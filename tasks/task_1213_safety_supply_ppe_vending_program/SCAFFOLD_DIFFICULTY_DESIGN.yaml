# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# task_1213 Safety Supply & PPE Vending Program
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 and is transcribed verbatim
# by the downstream unit-test-generator.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: chargeback_snapshot_vs_rerate_diverge
        grounds:
          - calculations.chargeback_snapshot_vs_rerate
          - calculations.admin_fee_rounding
          - state_machines.ChargebackBatch.OPEN_to_CLOSED
        distinguishing_aspect: |
          Money-domain dual variant: the same swept POSTED lines yield
          snapshot_total_cents == 4300 (vend-time stored line prices, tier fixed
          at each vend's cumulative_before) but rerated_total_cents == 4500
          (chronological replay at close where the reversed 6-unit line no longer
          pushes line C into the 400-cent tier) — a 150-cent divergence on
          identical issuance data, on the ChargebackBatch/IssuanceTransaction
          (fiscal) entity domain.
        test_recipe:
          setup:
            - "Cost center CC-DV1; role WELDER; GENERAL item GLOVE-DV base 500 with contract tiers 0->450 and 10->400 effective 2026-01-01..2026-12-31; policy limit 100/30d"
            - "Employee emp_dv in CC-DV1; separate manager mgr_dv (is_manager) in same cost center"
            - "Machine ACTIVE with slot cap 100 par 5 stocked to 60"
            - "Vends at three distinct clock times: A qty 6 (2026-05-02), B qty 6 (2026-05-03), C qty 4 (2026-05-04); B then reversed by mgr_dv"
            - "ChargebackBatch OPEN for CC-DV1 covering 2026-05-01..2026-06-01"
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-DV1", name: "Fabrication" }, as: FinanceAnalyst, captures: { cc_dv: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "WELDER-DV" }, as: EHSAdministrator, captures: { role_dv: $.data.id } }
            - { call: "POST /items", payload: { sku: "GLOVE-DV", name: "Welding Glove", category: "GENERAL", base_list_price_cents: 500 }, as: EHSAdministrator, captures: { item_dv: $.data.id } }
            - { call: "POST /contract-prices", payload: { item_id: "${item_dv}", min_period_qty: 0, unit_price_cents: 450, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: EHSAdministrator }
            - { call: "POST /contract-prices", payload: { item_id: "${item_dv}", min_period_qty: 10, unit_price_cents: 400, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: EHSAdministrator }
            - { call: "POST /issuance-policies", payload: { job_role_id: "${role_dv}", item_id: "${item_dv}", period_limit_qty: 100, period_window_days: 30 }, as: EHSAdministrator }
            - { call: "POST /employees", payload: { employee_code: "E-DV1", full_name: "Welder One", job_role_id: "${role_dv}", home_cost_center_id: "${cc_dv}" }, as: EHSAdministrator, captures: { emp_dv: $.data.id } }
            - { call: "POST /employees", payload: { employee_code: "M-DV1", full_name: "Manager One", job_role_id: "${role_dv}", home_cost_center_id: "${cc_dv}", is_manager: true }, as: EHSAdministrator, captures: { mgr_dv: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-DV1", site_name: "Plant 1", model: "VM-500" }, as: VendingTechnician, captures: { mach_dv: $.data.id, mach_dv_v: $.data.version } }
            - { call: "POST /machines/${mach_dv}/slots", payload: { slot_code: "A1", item_id: "${item_dv}", capacity: 100, par_level: 5, expected_machine_version: "${mach_dv_v}" }, as: VendingTechnician, captures: { slot_dv: $.data.id } }
            - { call: "PUT /machines/${mach_dv}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_dv}", slot_id: "${slot_dv}", qty: 60 }, as: VendingTechnician, captures: { ro_dv: $.data.id } }
            - { call: "POST /restock-orders/${ro_dv}/pick", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders/${ro_dv}/load", payload: {}, as: VendingTechnician }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T09:00:00Z" }, as: EHSAdministrator }
            - { call: "POST /issuances", payload: { machine_id: "${mach_dv}", slot_id: "${slot_dv}", qty: 6, idempotency_key: "dv-a" }, as: Employee, as_user_id: "${emp_dv}", captures: { vend_a: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T09:00:00Z" }, as: EHSAdministrator }
            - { call: "POST /issuances", payload: { machine_id: "${mach_dv}", slot_id: "${slot_dv}", qty: 6, idempotency_key: "dv-b" }, as: Employee, as_user_id: "${emp_dv}", captures: { vend_b: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T09:00:00Z" }, as: EHSAdministrator }
            - { call: "POST /issuances", payload: { machine_id: "${mach_dv}", slot_id: "${slot_dv}", qty: 4, idempotency_key: "dv-c" }, as: Employee, as_user_id: "${emp_dv}" }
            - { call: "POST /issuances/${vend_b}/reverse", payload: {}, as: Manager, as_user_id: "${mgr_dv}" }
            - { call: "POST /chargeback-batches", payload: { cost_center_id: "${cc_dv}", period_start: "2026-05-01", period_end: "2026-06-01" }, as: FinanceAnalyst, captures: { batch_dv: $.data.id } }
          trigger:
            - { call: "POST /chargeback-batches/${batch_dv}/close", payload: {}, as: FinanceAnalyst, captures: { close_snapshot: $.data.snapshot_total_cents, close_rerate: $.data.rerated_total_cents, close_fee: $.data.admin_fee_cents, close_total: $.data.total_cents, close_lines: $.data.line_count } }
            - { call: "GET /cost-centers/${cc_dv}", payload: {}, as: Any, captures: { cc_ytd: $.data.ytd_charged_cents } }
          assert:
            - "ChargebackBatch.${batch_dv}.line_count == 2"
            - "ChargebackBatch.${batch_dv}.snapshot_total_cents == 4300"
            - "ChargebackBatch.${batch_dv}.rerated_total_cents == 4500"
            - "ChargebackBatch.${batch_dv}.admin_fee_cents == 113"
            - "ChargebackBatch.${batch_dv}.total_cents == 4613"
            - "CostCenter.${cc_dv}.ytd_charged_cents == 4613"
            - "snapshot_total_cents != rerated_total_cents (4300 != 4500): reversed line B removed its tier contribution on replay"

      - name: restock_naive_qty_vs_committed_aware_suggestion
        grounds:
          - calculations.restock_suggested_qty
          - calculations.restock_par_trigger
        distinguishing_aspect: |
          Inventory-domain dual variant: for a slot with par_level 10, on_hand 4
          and 6 units already committed in an open SUGGESTED order, a manual
          order stores naive qty == 8 (client-requested fill, ignoring pipeline)
          while its committed-aware suggested_qty == 0
          (max(0, 10 - 4 - 6)) — same slot state, two valid algorithms, different
          integers, on the MachineSlot/RestockOrder (inventory) domain, distinct
          from the fiscal domain of chargeback_snapshot_vs_rerate_diverge.
        test_recipe:
          setup:
            - "GENERAL item REST-DV base 300; machine ACTIVE; slot S1 cap 20 par 10"
            - "Slot stocked to 4 via a first manual order; a second manual order qty 6 left SUGGESTED (open pipeline 6)"
          setup_api_calls:
            - { call: "POST /items", payload: { sku: "REST-DV", name: "Earplugs", category: "GENERAL", base_list_price_cents: 300 }, as: EHSAdministrator, captures: { item_rd: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-RD1", site_name: "Plant 2", model: "VM-300" }, as: VendingTechnician, captures: { mach_rd: $.data.id, mach_rd_v: $.data.version } }
            - { call: "POST /machines/${mach_rd}/slots", payload: { slot_code: "S1", item_id: "${item_rd}", capacity: 20, par_level: 10, expected_machine_version: "${mach_rd_v}" }, as: VendingTechnician, captures: { slot_rd: $.data.id } }
            - { call: "PUT /machines/${mach_rd}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_rd}", slot_id: "${slot_rd}", qty: 4 }, as: VendingTechnician, captures: { ro_rd1: $.data.id } }
            - { call: "POST /restock-orders/${ro_rd1}/pick", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders/${ro_rd1}/load", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_rd}", slot_id: "${slot_rd}", qty: 6 }, as: VendingTechnician, captures: { ro_rd2: $.data.id } }
          trigger:
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_rd}", slot_id: "${slot_rd}", qty: 8 }, as: VendingTechnician, captures: { ro3_qty: $.data.qty, ro3_suggested: $.data.suggested_qty } }
          assert:
            - "RestockOrder.qty == 8 (naive variant: requested qty stored verbatim)"
            - "RestockOrder.suggested_qty == 0 (committed-aware: max(0, 10 - 4 - 6))"
            - "RestockOrder.source == MANUAL"
            - "RestockOrder.status == SUGGESTED"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: contract_tier_resolution_cumulative_breakpoint
        grounds:
          - calculations.contract_price_resolution
        distinguishing_aspect: |
          Mode (a): three-input non-linear selection — cumulative_before (running
          period quantity), effective-window membership, and tier breakpoint
          ordering interact: at cumulative_before == 9 the tier-1 breakpoint
          (min_period_qty 10) is NOT reached so unit_price stays 450; the very
          next unit (cumulative_before == 10) flips the whole line to 400. The
          boundary sits between two consecutive single-unit vends.
        test_recipe:
          setup:
            - "Cost center, role, GENERAL item TIER-CF base 500 with tiers 0->450 and 10->400 (2026-01-01..2026-12-31); policy limit 100/30d; employee; machine ACTIVE; slot cap 100 par 0 stocked 50"
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-CF1", name: "Assembly" }, as: FinanceAnalyst, captures: { cc_cf: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "ASSEMBLER-CF" }, as: EHSAdministrator, captures: { role_cf: $.data.id } }
            - { call: "POST /items", payload: { sku: "TIER-CF", name: "Face Shield", category: "GENERAL", base_list_price_cents: 500 }, as: EHSAdministrator, captures: { item_cf: $.data.id } }
            - { call: "POST /contract-prices", payload: { item_id: "${item_cf}", min_period_qty: 0, unit_price_cents: 450, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: EHSAdministrator }
            - { call: "POST /contract-prices", payload: { item_id: "${item_cf}", min_period_qty: 10, unit_price_cents: 400, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: EHSAdministrator }
            - { call: "POST /issuance-policies", payload: { job_role_id: "${role_cf}", item_id: "${item_cf}", period_limit_qty: 100, period_window_days: 30 }, as: EHSAdministrator }
            - { call: "POST /employees", payload: { employee_code: "E-CF1", full_name: "Assembler One", job_role_id: "${role_cf}", home_cost_center_id: "${cc_cf}" }, as: EHSAdministrator, captures: { emp_cf: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-CF1", site_name: "Plant 3", model: "VM-500" }, as: VendingTechnician, captures: { mach_cf: $.data.id, mach_cf_v: $.data.version } }
            - { call: "POST /machines/${mach_cf}/slots", payload: { slot_code: "A1", item_id: "${item_cf}", capacity: 100, par_level: 0, expected_machine_version: "${mach_cf_v}" }, as: VendingTechnician, captures: { slot_cf: $.data.id } }
            - { call: "PUT /machines/${mach_cf}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_cf}", slot_id: "${slot_cf}", qty: 50 }, as: VendingTechnician, captures: { ro_cf: $.data.id } }
            - { call: "POST /restock-orders/${ro_cf}/pick", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders/${ro_cf}/load", payload: {}, as: VendingTechnician }
          trigger:
            - { call: "POST /issuances", payload: { machine_id: "${mach_cf}", slot_id: "${slot_cf}", qty: 9, idempotency_key: "cf-1" }, as: Employee, as_user_id: "${emp_cf}", captures: { cf_p1: $.data.unit_price_cents } }
            - { call: "POST /issuances", payload: { machine_id: "${mach_cf}", slot_id: "${slot_cf}", qty: 1, idempotency_key: "cf-2" }, as: Employee, as_user_id: "${emp_cf}", captures: { cf_p2: $.data.unit_price_cents } }
            - { call: "POST /issuances", payload: { machine_id: "${mach_cf}", slot_id: "${slot_cf}", qty: 1, idempotency_key: "cf-3" }, as: Employee, as_user_id: "${emp_cf}", captures: { cf_p3: $.data.unit_price_cents } }
          assert:
            - "line 1: cumulative_before 0 -> unit_price_cents == 450"
            - "line 2: cumulative_before 9 -> unit_price_cents == 450 (9 < 10, tier-1 NOT reached)"
            - "line 3: cumulative_before 10 -> unit_price_cents == 400 (>= breakpoint)"
            - "MachineSlot.${slot_cf}.on_hand_qty == 39"

      - name: chargeback_admin_fee_per_line_rounding
        grounds:
          - calculations.admin_fee_rounding
          - calculations.chargeback_snapshot_vs_rerate
        distinguishing_aspect: |
          Mode (b): nested rounding order pinned — three swept lines of 1350 cents
          each yield per-line round_half_up(33.75) = 34, summed to 102; the
          rejected sum-then-round order would give round_half_up(101.25) = 101.
          The scaffold pins round-per-line-then-sum, and the one-cent divergence
          is observable in admin_fee_cents and total_cents.
        test_recipe:
          setup:
            - "Cost center CC-CF2; role; GENERAL item FEE-CF base 450 with NO contract rows; policy limit 100/30d; employee; machine ACTIVE; slot cap 100 par 0 stocked 30"
            - "Three vends qty 3 each (line_total 1350 per line); batch OPEN 2026-05-01..2026-06-01"
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-CF2", name: "Paint Shop" }, as: FinanceAnalyst, captures: { cc_ff: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "PAINTER-CF" }, as: EHSAdministrator, captures: { role_ff: $.data.id } }
            - { call: "POST /items", payload: { sku: "FEE-CF", name: "Spray Sock", category: "GENERAL", base_list_price_cents: 450 }, as: EHSAdministrator, captures: { item_ff: $.data.id } }
            - { call: "POST /issuance-policies", payload: { job_role_id: "${role_ff}", item_id: "${item_ff}", period_limit_qty: 100, period_window_days: 30 }, as: EHSAdministrator }
            - { call: "POST /employees", payload: { employee_code: "E-CF2", full_name: "Painter One", job_role_id: "${role_ff}", home_cost_center_id: "${cc_ff}" }, as: EHSAdministrator, captures: { emp_ff: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-CF2", site_name: "Plant 4", model: "VM-500" }, as: VendingTechnician, captures: { mach_ff: $.data.id, mach_ff_v: $.data.version } }
            - { call: "POST /machines/${mach_ff}/slots", payload: { slot_code: "A1", item_id: "${item_ff}", capacity: 100, par_level: 0, expected_machine_version: "${mach_ff_v}" }, as: VendingTechnician, captures: { slot_ff: $.data.id } }
            - { call: "PUT /machines/${mach_ff}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_ff}", slot_id: "${slot_ff}", qty: 30 }, as: VendingTechnician, captures: { ro_ff: $.data.id } }
            - { call: "POST /restock-orders/${ro_ff}/pick", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders/${ro_ff}/load", payload: {}, as: VendingTechnician }
            - { call: "POST /issuances", payload: { machine_id: "${mach_ff}", slot_id: "${slot_ff}", qty: 3, idempotency_key: "ff-1" }, as: Employee, as_user_id: "${emp_ff}" }
            - { call: "POST /issuances", payload: { machine_id: "${mach_ff}", slot_id: "${slot_ff}", qty: 3, idempotency_key: "ff-2" }, as: Employee, as_user_id: "${emp_ff}" }
            - { call: "POST /issuances", payload: { machine_id: "${mach_ff}", slot_id: "${slot_ff}", qty: 3, idempotency_key: "ff-3" }, as: Employee, as_user_id: "${emp_ff}" }
            - { call: "POST /chargeback-batches", payload: { cost_center_id: "${cc_ff}", period_start: "2026-05-01", period_end: "2026-06-01" }, as: FinanceAnalyst, captures: { batch_ff: $.data.id } }
          trigger:
            - { call: "POST /chargeback-batches/${batch_ff}/close", payload: {}, as: FinanceAnalyst, captures: { ff_snapshot: $.data.snapshot_total_cents, ff_fee: $.data.admin_fee_cents, ff_total: $.data.total_cents } }
          assert:
            - "ChargebackBatch.${batch_ff}.snapshot_total_cents == 4050"
            - "ChargebackBatch.${batch_ff}.rerated_total_cents == 4050"
            - "ChargebackBatch.${batch_ff}.admin_fee_cents == 102 (3 x round_half_up(33.75) = 34; NOT 101 from sum-then-round)"
            - "ChargebackBatch.${batch_ff}.total_cents == 4152"

      - name: effective_limit_draw_split_evaluation_order
        grounds:
          - calculations.effective_limit
          - calculations.usage_rolling_window
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by evaluation order —
          the allowed draw depends on the effective limit, the effective limit
          depends on the override remainder, and the remainder is decremented by
          the draw itself. Pinned order (usage -> base limit -> covering override
          -> effective limit -> draw split) makes usage 4 / base 5 / vend 3 draw
          exactly 2 from the override, leaving remaining_qty 1, so a follow-up
          vend of 4 needing 4 > 1 fails with ERR_OVERRIDE_QTY_EXCEEDED.
        test_recipe:
          setup:
            - "Cost center; role; GENERAL item SPLIT-CF base 300; policy limit 5/30d; employee; manager; machine ACTIVE; slot cap 50 par 0 stocked 40"
            - "Employee at usage 4 (two vends of 2); ACTIVE override approved 3 covering 2026-05-01..2026-05-31"
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-CF3", name: "Maintenance" }, as: FinanceAnalyst, captures: { cc_sp: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "MECHANIC-CF" }, as: EHSAdministrator, captures: { role_sp: $.data.id } }
            - { call: "POST /items", payload: { sku: "SPLIT-CF", name: "Nitrile Gloves", category: "GENERAL", base_list_price_cents: 300 }, as: EHSAdministrator, captures: { item_sp: $.data.id } }
            - { call: "POST /issuance-policies", payload: { job_role_id: "${role_sp}", item_id: "${item_sp}", period_limit_qty: 5, period_window_days: 30 }, as: EHSAdministrator }
            - { call: "POST /employees", payload: { employee_code: "E-CF3", full_name: "Mechanic One", job_role_id: "${role_sp}", home_cost_center_id: "${cc_sp}" }, as: EHSAdministrator, captures: { emp_sp: $.data.id } }
            - { call: "POST /employees", payload: { employee_code: "M-CF3", full_name: "Mgr Three", job_role_id: "${role_sp}", home_cost_center_id: "${cc_sp}", is_manager: true }, as: EHSAdministrator, captures: { mgr_sp: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-CF3", site_name: "Plant 5", model: "VM-500" }, as: VendingTechnician, captures: { mach_sp: $.data.id, mach_sp_v: $.data.version } }
            - { call: "POST /machines/${mach_sp}/slots", payload: { slot_code: "A1", item_id: "${item_sp}", capacity: 50, par_level: 0, expected_machine_version: "${mach_sp_v}" }, as: VendingTechnician, captures: { slot_sp: $.data.id } }
            - { call: "PUT /machines/${mach_sp}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_sp}", slot_id: "${slot_sp}", qty: 40 }, as: VendingTechnician, captures: { ro_sp: $.data.id } }
            - { call: "POST /restock-orders/${ro_sp}/pick", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders/${ro_sp}/load", payload: {}, as: VendingTechnician }
            - { call: "POST /issuances", payload: { machine_id: "${mach_sp}", slot_id: "${slot_sp}", qty: 2, idempotency_key: "sp-1" }, as: Employee, as_user_id: "${emp_sp}" }
            - { call: "POST /issuances", payload: { machine_id: "${mach_sp}", slot_id: "${slot_sp}", qty: 2, idempotency_key: "sp-2" }, as: Employee, as_user_id: "${emp_sp}" }
            - { call: "POST /manager-overrides", payload: { employee_id: "${emp_sp}", item_id: "${item_sp}", approved_qty: 3, valid_from: "2026-05-01", valid_until: "2026-05-31", reason_code: "PROJECT" }, as: Manager, as_user_id: "${mgr_sp}", captures: { ov_sp: $.data.id } }
          trigger:
            - { call: "POST /issuances", payload: { machine_id: "${mach_sp}", slot_id: "${slot_sp}", qty: 3, idempotency_key: "sp-3", manager_override_id: "${ov_sp}" }, as: Employee, as_user_id: "${emp_sp}", captures: { sp_drawn: $.data.override_drawn_qty } }
            - { call: "GET /manager-overrides/${ov_sp}", payload: {}, as: Any, captures: { sp_consumed: $.data.consumed_qty, sp_remaining: $.data.remaining_qty } }
            - { call: "POST /issuances", payload: { machine_id: "${mach_sp}", slot_id: "${slot_sp}", qty: 4, idempotency_key: "sp-4", manager_override_id: "${ov_sp}" }, as: Employee, as_user_id: "${emp_sp}", captures: { sp_err: $.data.error_id } }
          assert:
            - "IssuanceTransaction.override_drawn_qty == 2 (usage 4 + qty 3 - max(base 5, usage 4))"
            - "ManagerOverride.${ov_sp}.consumed_qty == 2"
            - "ManagerOverride.${ov_sp}.remaining_qty == 1"
            - "second vend rejected: error_id == ERR_OVERRIDE_QTY_EXCEEDED (needed 4 > remaining 1)"
            - "ManagerOverride.${ov_sp}.status == ACTIVE after partial draw (CONSUMED only at equality)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: serialized_unit_inspection_cycle_loops
        grounds:
          - state_machines.SerializedUnit.IN_STOCK_to_ISSUED
          - state_machines.SerializedUnit.ISSUED_to_INSPECTION_DUE
          - state_machines.SerializedUnit.INSPECTION_DUE_to_ISSUED
          - calculations.inspection_due_sweep
        distinguishing_aspect: |
          SerializedUnit exhibits a true cycle ISSUED -> INSPECTION_DUE -> ISSUED
          -> INSPECTION_DUE (loop repeats across two clock sweeps with a PASS
          inspection in between), unlike a linear pipeline; each loop refreshes
          next_inspection_due_on from the latest inspected_on (2026-07-30, then
          2026-10-30).
        test_recipe:
          setup:
            - "FALL_PROTECTION item HARN-CY base 12000, inspection_interval_days 90; policy limit 10/30d; employee; machine with slot cap 10 par 0; serialized unit registered while COMMISSIONING; machine commissioned; unit vended at default clock 2026-05-01 (next_inspection_due_on 2026-07-30)"
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-CY1", name: "Rigging" }, as: FinanceAnalyst, captures: { cc_cy: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "RIGGER-CY" }, as: EHSAdministrator, captures: { role_cy: $.data.id } }
            - { call: "POST /items", payload: { sku: "HARN-CY", name: "Full Body Harness", category: "FALL_PROTECTION", base_list_price_cents: 12000, inspection_interval_days: 90 }, as: EHSAdministrator, captures: { item_cy: $.data.id } }
            - { call: "POST /issuance-policies", payload: { job_role_id: "${role_cy}", item_id: "${item_cy}", period_limit_qty: 10, period_window_days: 30 }, as: EHSAdministrator }
            - { call: "POST /employees", payload: { employee_code: "E-CY1", full_name: "Rigger One", job_role_id: "${role_cy}", home_cost_center_id: "${cc_cy}" }, as: EHSAdministrator, captures: { emp_cy: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-CY1", site_name: "Plant 6", model: "VM-700" }, as: VendingTechnician, captures: { mach_cy: $.data.id, mach_cy_v: $.data.version } }
            - { call: "POST /machines/${mach_cy}/slots", payload: { slot_code: "H1", item_id: "${item_cy}", capacity: 10, par_level: 0, expected_machine_version: "${mach_cy_v}" }, as: VendingTechnician, captures: { slot_cy: $.data.id } }
            - { call: "POST /serialized-units", payload: { item_id: "${item_cy}", serial_number: "SN-CY-001", slot_id: "${slot_cy}" }, as: EHSAdministrator, captures: { unit_cy: $.data.id } }
            - { call: "PUT /machines/${mach_cy}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /issuances", payload: { machine_id: "${mach_cy}", slot_id: "${slot_cy}", qty: 1, idempotency_key: "cy-1", serialized_unit_id: "${unit_cy}" }, as: Employee, as_user_id: "${emp_cy}", captures: { cy_due1: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-30T00:00:00Z" }, as: EHSAdministrator }
            - { call: "GET /serialized-units/${unit_cy}", payload: {}, as: Any, captures: { cy_s1: $.data.status, cy_d1: $.data.next_inspection_due_on } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-31T00:00:00Z" }, as: EHSAdministrator }
            - { call: "GET /serialized-units/${unit_cy}", payload: {}, as: Any, captures: { cy_s2: $.data.status } }
            - { call: "POST /serialized-units/${unit_cy}/inspect", payload: { result: "PASS", inspected_on: "2026-08-01" }, as: SafetyOfficer, captures: { cy_s3: $.data.status, cy_d3: $.data.next_inspection_due_on } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-31T00:00:00Z" }, as: EHSAdministrator }
            - { call: "GET /serialized-units/${unit_cy}", payload: {}, as: Any, captures: { cy_s4: $.data.status } }
          assert:
            - "on 2026-07-30 (== due date): status == ISSUED (boundary: due the FOLLOWING day)"
            - "on 2026-07-31: status == INSPECTION_DUE"
            - "after PASS on 2026-08-01: status == ISSUED and next_inspection_due_on == 2026-10-30"
            - "on 2026-10-31: status == INSPECTION_DUE (cycle loops a second time)"
            - "SerializedUnit.${unit_cy}.issued_to_employee_id == ${emp_cy} throughout"

      - name: vending_machine_offline_service_cycles
        grounds:
          - state_machines.VendingMachine.ACTIVE_to_OFFLINE
          - state_machines.VendingMachine.OFFLINE_to_ACTIVE
          - state_machines.VendingMachine.ACTIVE_to_IN_SERVICE
          - state_machines.VendingMachine.IN_SERVICE_to_ACTIVE
          - state_machines.ServiceTicket.OPEN_to_IN_PROGRESS
        distinguishing_aspect: |
          VendingMachine exhibits two independent cycles on one entity:
          ACTIVE -> OFFLINE -> ACTIVE (operator toggle) and
          ACTIVE -> IN_SERVICE -> ACTIVE (service-ticket driven) — cyclic shape
          on a different entity than SerializedUnit, with the second cycle
          entered only through a cross-entity system transition.
        test_recipe:
          setup:
            - "GENERAL item, machine with one slot, commissioned ACTIVE; no stock needed"
            - "Service ticket window [2026-05-01T00:00:00Z, 2026-05-02T00:00:00Z) covering the default clock"
          setup_api_calls:
            - { call: "POST /items", payload: { sku: "CYC-M1", name: "Safety Glasses", category: "GENERAL", base_list_price_cents: 700 }, as: EHSAdministrator, captures: { item_vm: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-VM1", site_name: "Plant 7", model: "VM-500" }, as: VendingTechnician, captures: { mach_vm: $.data.id, mach_vm_v: $.data.version } }
            - { call: "POST /machines/${mach_vm}/slots", payload: { slot_code: "A1", item_id: "${item_vm}", capacity: 20, par_level: 0, expected_machine_version: "${mach_vm_v}" }, as: VendingTechnician }
            - { call: "PUT /machines/${mach_vm}", payload: { status: "ACTIVE" }, as: VendingTechnician, captures: { vm_s1: $.data.status } }
            - { call: "POST /service-tickets", payload: { machine_id: "${mach_vm}", issue_code: "PREVENTIVE", window_start: "2026-05-01T00:00:00Z", window_end: "2026-05-02T00:00:00Z" }, as: VendingTechnician, captures: { tkt_vm: $.data.id } }
          trigger:
            - { call: "PUT /machines/${mach_vm}", payload: { status: "OFFLINE" }, as: VendingTechnician, captures: { vm_s2: $.data.status } }
            - { call: "PUT /machines/${mach_vm}", payload: { status: "ACTIVE" }, as: VendingTechnician, captures: { vm_s3: $.data.status } }
            - { call: "POST /service-tickets/${tkt_vm}/start", payload: {}, as: VendingTechnician }
            - { call: "GET /machines/${mach_vm}", payload: {}, as: Any, captures: { vm_s4: $.data.status } }
            - { call: "POST /service-tickets/${tkt_vm}/resolve", payload: {}, as: VendingTechnician, captures: { vm_tk: $.data.status } }
            - { call: "GET /machines/${mach_vm}", payload: {}, as: Any, captures: { vm_s5: $.data.status } }
          assert:
            - "commission: status ACTIVE (from COMMISSIONING)"
            - "toggle: ACTIVE -> OFFLINE -> ACTIVE (operator cycle)"
            - "service: ACTIVE -> IN_SERVICE on ticket start (system cycle, ticket IN_PROGRESS)"
            - "resolve: ticket RESOLVED and machine back to ACTIVE"
            - "VendingMachine.${mach_vm}.version incremented on every transition"
  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; depth >= 3 and >= 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: reversal_triggers_restock_autocancel_chain
        grounds:
          - state_machines.IssuanceTransaction.POSTED_to_REVERSED
          - state_machines.RestockOrder.SUGGESTED_to_CANCELLED
          - calculations.restock_par_trigger
        distinguishing_aspect: |
          Depth-3 cascade from POST /issuances/{id}/reverse: (1) issuance
          POSTED -> REVERSED; (2) that reversal restores MachineSlot.on_hand_qty
          4 -> 6; (3) the restored on_hand (now strictly above par 5) itself
          auto-cancels the SUGGESTED AUTO_PAR order — each link caused by the
          previous link, not by the original trigger.
        test_recipe:
          setup:
            - "Cost center; role; GENERAL item CASC-R base 300; policy limit 50/30d; employee emp_rc and manager mgr_rc; machine ACTIVE; slot cap 20 par 5 stocked to 6"
            - "Vend qty 2 drops on_hand to 4 (<= par 5) -> AUTO_PAR RestockOrder SUGGESTED qty 16 (capacity 20 - on_hand 4)"
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-RC1", name: "Stamping" }, as: FinanceAnalyst, captures: { cc_rc: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "PRESS-RC" }, as: EHSAdministrator, captures: { role_rc: $.data.id } }
            - { call: "POST /items", payload: { sku: "CASC-R", name: "Cut Gloves", category: "GENERAL", base_list_price_cents: 300 }, as: EHSAdministrator, captures: { item_rc: $.data.id } }
            - { call: "POST /issuance-policies", payload: { job_role_id: "${role_rc}", item_id: "${item_rc}", period_limit_qty: 50, period_window_days: 30 }, as: EHSAdministrator }
            - { call: "POST /employees", payload: { employee_code: "E-RC1", full_name: "Press Op", job_role_id: "${role_rc}", home_cost_center_id: "${cc_rc}" }, as: EHSAdministrator, captures: { emp_rc: $.data.id } }
            - { call: "POST /employees", payload: { employee_code: "M-RC1", full_name: "Mgr RC", job_role_id: "${role_rc}", home_cost_center_id: "${cc_rc}", is_manager: true }, as: EHSAdministrator, captures: { mgr_rc: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-RC1", site_name: "Plant 8", model: "VM-500" }, as: VendingTechnician, captures: { mach_rc: $.data.id, mach_rc_v: $.data.version } }
            - { call: "POST /machines/${mach_rc}/slots", payload: { slot_code: "A1", item_id: "${item_rc}", capacity: 20, par_level: 5, expected_machine_version: "${mach_rc_v}" }, as: VendingTechnician, captures: { slot_rc: $.data.id } }
            - { call: "PUT /machines/${mach_rc}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_rc}", slot_id: "${slot_rc}", qty: 6 }, as: VendingTechnician, captures: { ro_rc0: $.data.id } }
            - { call: "POST /restock-orders/${ro_rc0}/pick", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders/${ro_rc0}/load", payload: {}, as: VendingTechnician }
            - { call: "POST /issuances", payload: { machine_id: "${mach_rc}", slot_id: "${slot_rc}", qty: 2, idempotency_key: "rc-1" }, as: Employee, as_user_id: "${emp_rc}", captures: { iss_rc: $.data.id } }
            - { call: "GET /restock-orders", payload: { slot_id: "${slot_rc}", status: "SUGGESTED" }, as: Any, captures: { auto_rc_id: "$.data[0].id", auto_rc_qty: "$.data[0].qty" } }
          trigger:
            - { call: "POST /issuances/${iss_rc}/reverse", payload: {}, as: Manager, as_user_id: "${mgr_rc}", captures: { rc_iss_status: $.data.status } }
            - { call: "GET /slots/${slot_rc}", payload: {}, as: Any, captures: { rc_onhand: $.data.on_hand_qty } }
            - { call: "GET /restock-orders/${auto_rc_id}", payload: {}, as: Any, captures: { rc_ro_status: $.data.status } }
          assert:
            - "after vend: AUTO_PAR order existed with qty == 16 and status SUGGESTED (naive fill: capacity 20 - on_hand 4)"
            - "IssuanceTransaction.${iss_rc}.status == REVERSED (link 1)"
            - "MachineSlot.${slot_rc}.on_hand_qty == 6 (link 2: restoration)"
            - "RestockOrder.${auto_rc_id}.status == CANCELLED (link 3: auto-cancel because 6 > par 5)"

      - name: service_start_cancels_open_restocks_chain
        grounds:
          - state_machines.ServiceTicket.OPEN_to_IN_PROGRESS
          - state_machines.VendingMachine.ACTIVE_to_IN_SERVICE
          - state_machines.RestockOrder.SUGGESTED_to_CANCELLED
          - state_machines.ServiceTicket.IN_PROGRESS_to_RESOLVED
        distinguishing_aspect: |
          Depth-2+ cascade from a different trigger (POST /service-tickets/{id}/
          start): (1) ticket OPEN -> IN_PROGRESS; (2) that transition moves the
          machine ACTIVE -> IN_SERVICE; (3) the machine entering IN_SERVICE
          itself cancels its SUGGESTED restock order; and the subsequent resolve
          cascades machine -> ACTIVE plus a fresh AUTO_PAR restock sweep that
          re-creates an order with qty == 16.
        test_recipe:
          setup:
            - "GENERAL item CASC-S base 300; machine ACTIVE; slot cap 20 par 5 stocked to 4 (below par)"
            - "Manual restock order qty 10 left SUGGESTED; service ticket window [2026-05-01T00:00:00Z, 2026-05-02T00:00:00Z) covering default clock"
          setup_api_calls:
            - { call: "POST /items", payload: { sku: "CASC-S", name: "Ear Muffs", category: "GENERAL", base_list_price_cents: 300 }, as: EHSAdministrator, captures: { item_sc: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-SC1", site_name: "Plant 9", model: "VM-500" }, as: VendingTechnician, captures: { mach_sc: $.data.id, mach_sc_v: $.data.version } }
            - { call: "POST /machines/${mach_sc}/slots", payload: { slot_code: "A1", item_id: "${item_sc}", capacity: 20, par_level: 5, expected_machine_version: "${mach_sc_v}" }, as: VendingTechnician, captures: { slot_sc: $.data.id } }
            - { call: "PUT /machines/${mach_sc}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_sc}", slot_id: "${slot_sc}", qty: 4 }, as: VendingTechnician, captures: { ro_sc0: $.data.id } }
            - { call: "POST /restock-orders/${ro_sc0}/pick", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders/${ro_sc0}/load", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_sc}", slot_id: "${slot_sc}", qty: 10 }, as: VendingTechnician, captures: { ro_sc_open: $.data.id } }
            - { call: "POST /service-tickets", payload: { machine_id: "${mach_sc}", issue_code: "JAM", window_start: "2026-05-01T00:00:00Z", window_end: "2026-05-02T00:00:00Z" }, as: VendingTechnician, captures: { tkt_sc: $.data.id } }
          trigger:
            - { call: "POST /service-tickets/${tkt_sc}/start", payload: {}, as: VendingTechnician, captures: { sc_tk1: $.data.status } }
            - { call: "GET /machines/${mach_sc}", payload: {}, as: Any, captures: { sc_m1: $.data.status } }
            - { call: "GET /restock-orders/${ro_sc_open}", payload: {}, as: Any, captures: { sc_ro1: $.data.status } }
            - { call: "POST /service-tickets/${tkt_sc}/resolve", payload: {}, as: VendingTechnician }
            - { call: "GET /restock-orders", payload: { slot_id: "${slot_sc}", status: "SUGGESTED" }, as: Any, captures: { sc_auto_id: "$.data[0].id", sc_auto_qty: "$.data[0].qty", sc_auto_src: "$.data[0].source" } }
          assert:
            - "ServiceTicket.${tkt_sc}.status == IN_PROGRESS (link 1)"
            - "VendingMachine.${mach_sc}.status == IN_SERVICE (link 2, caused by link 1)"
            - "RestockOrder.${ro_sc_open}.status == CANCELLED (link 3, caused by machine entering IN_SERVICE)"
            - "after resolve: machine ACTIVE and post-service sweep created a fresh AUTO_PAR order with qty == 16 (capacity 20 - on_hand 4), source == AUTO_PAR"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: vend_machine_offline_beats_missing_fit_test
        grounds:
          - validations[priority=5]
          - validations[priority=8]
        distinguishing_aspect: |
          Pair state-vs-business_safety: one vend request that violates BOTH
          machine-state (machine OFFLINE, priority 5) AND respirator safety
          (no PASS fit test, priority 8) MUST return ERR_MACHINE_NOT_ACTIVE —
          the state category wins over the safety category.
        test_recipe:
          setup:
            - "RESPIRATOR item RESP-PP base 900; policy limit 10/30d; employee with NO fit test; machine stocked 10 then taken OFFLINE"
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-PP1", name: "Grinding" }, as: FinanceAnalyst, captures: { cc_pp: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "GRINDER-PP" }, as: EHSAdministrator, captures: { role_pp: $.data.id } }
            - { call: "POST /items", payload: { sku: "RESP-PP", name: "Half-Mask Respirator", category: "RESPIRATOR", base_list_price_cents: 900 }, as: EHSAdministrator, captures: { item_pp: $.data.id } }
            - { call: "POST /issuance-policies", payload: { job_role_id: "${role_pp}", item_id: "${item_pp}", period_limit_qty: 10, period_window_days: 30 }, as: EHSAdministrator }
            - { call: "POST /employees", payload: { employee_code: "E-PP1", full_name: "Grinder One", job_role_id: "${role_pp}", home_cost_center_id: "${cc_pp}" }, as: EHSAdministrator, captures: { emp_pp: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-PP1", site_name: "Plant 10", model: "VM-500" }, as: VendingTechnician, captures: { mach_pp: $.data.id, mach_pp_v: $.data.version } }
            - { call: "POST /machines/${mach_pp}/slots", payload: { slot_code: "R1", item_id: "${item_pp}", capacity: 20, par_level: 0, expected_machine_version: "${mach_pp_v}" }, as: VendingTechnician, captures: { slot_pp: $.data.id } }
            - { call: "PUT /machines/${mach_pp}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_pp}", slot_id: "${slot_pp}", qty: 10 }, as: VendingTechnician, captures: { ro_pp: $.data.id } }
            - { call: "POST /restock-orders/${ro_pp}/pick", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders/${ro_pp}/load", payload: {}, as: VendingTechnician }
            - { call: "PUT /machines/${mach_pp}", payload: { status: "OFFLINE" }, as: VendingTechnician }
          trigger:
            - { call: "POST /issuances", payload: { machine_id: "${mach_pp}", slot_id: "${slot_pp}", qty: 1, idempotency_key: "pp-1" }, as: Employee, as_user_id: "${emp_pp}", captures: { pp_err: $.data.error_id } }
          assert:
            - "rejected with error_id == ERR_MACHINE_NOT_ACTIVE (state, priority 5)"
            - "NOT ERR_FIT_TEST_REQUIRED even though the employee also lacks a PASS fit test (safety, priority 8)"

      - name: vend_fit_test_missing_beats_limit_exceeded
        grounds:
          - validations[priority=8]
          - validations[priority=18]
        distinguishing_aspect: |
          Pair business_safety-vs-business_fiscal: one vend request that violates
          BOTH respirator safety (no PASS fit test, priority 8) AND the fiscal
          issuance limit (usage 0 + qty 2 > limit 1, priority 18) MUST return
          ERR_FIT_TEST_REQUIRED — a different category pair than
          state-vs-safety in vend_machine_offline_beats_missing_fit_test.
        test_recipe:
          setup:
            - "RESPIRATOR item RESP-PQ base 900; policy limit 1/30d; employee with NO fit test; machine ACTIVE stocked 10"
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-PQ1", name: "Blasting" }, as: FinanceAnalyst, captures: { cc_pq: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "BLASTER-PQ" }, as: EHSAdministrator, captures: { role_pq: $.data.id } }
            - { call: "POST /items", payload: { sku: "RESP-PQ", name: "PAPR Respirator", category: "RESPIRATOR", base_list_price_cents: 900 }, as: EHSAdministrator, captures: { item_pq: $.data.id } }
            - { call: "POST /issuance-policies", payload: { job_role_id: "${role_pq}", item_id: "${item_pq}", period_limit_qty: 1, period_window_days: 30 }, as: EHSAdministrator }
            - { call: "POST /employees", payload: { employee_code: "E-PQ1", full_name: "Blaster One", job_role_id: "${role_pq}", home_cost_center_id: "${cc_pq}" }, as: EHSAdministrator, captures: { emp_pq: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-PQ1", site_name: "Plant 11", model: "VM-500" }, as: VendingTechnician, captures: { mach_pq: $.data.id, mach_pq_v: $.data.version } }
            - { call: "POST /machines/${mach_pq}/slots", payload: { slot_code: "R1", item_id: "${item_pq}", capacity: 20, par_level: 0, expected_machine_version: "${mach_pq_v}" }, as: VendingTechnician, captures: { slot_pq: $.data.id } }
            - { call: "PUT /machines/${mach_pq}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_pq}", slot_id: "${slot_pq}", qty: 10 }, as: VendingTechnician, captures: { ro_pq: $.data.id } }
            - { call: "POST /restock-orders/${ro_pq}/pick", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders/${ro_pq}/load", payload: {}, as: VendingTechnician }
          trigger:
            - { call: "POST /issuances", payload: { machine_id: "${mach_pq}", slot_id: "${slot_pq}", qty: 2, idempotency_key: "pq-1" }, as: Employee, as_user_id: "${emp_pq}", captures: { pq_err: $.data.error_id } }
          assert:
            - "rejected with error_id == ERR_FIT_TEST_REQUIRED (business_safety, priority 8)"
            - "NOT ERR_ISSUANCE_LIMIT_EXCEEDED even though qty 2 exceeds limit 1 (business_fiscal, priority 18)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics, distinct endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: usage_limit_exact_boundary
        grounds:
          - calculations.usage_rolling_window
          - calculations.effective_limit
          - validations[priority=18]
        distinguishing_aspect: |
          Metric = rolling usage count vs integer limit on POST /issuances:
          usage 4 + qty 1 == limit 5 PASSES (<= semantics); a further qty 1
          (usage 5 + 1 > 5) FAILS. The pass/fail boundary sits exactly on
          equality, not one unit before or after.
        test_recipe:
          setup:
            - "GENERAL item LIM-B base 300; policy limit 5/30d; employee; machine ACTIVE; slot cap 30 par 0 stocked 20"
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-LB1", name: "Tooling" }, as: FinanceAnalyst, captures: { cc_lb: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "MACHINIST-LB" }, as: EHSAdministrator, captures: { role_lb: $.data.id } }
            - { call: "POST /items", payload: { sku: "LIM-B", name: "Cut Sleeve", category: "GENERAL", base_list_price_cents: 300 }, as: EHSAdministrator, captures: { item_lb: $.data.id } }
            - { call: "POST /issuance-policies", payload: { job_role_id: "${role_lb}", item_id: "${item_lb}", period_limit_qty: 5, period_window_days: 30 }, as: EHSAdministrator }
            - { call: "POST /employees", payload: { employee_code: "E-LB1", full_name: "Machinist One", job_role_id: "${role_lb}", home_cost_center_id: "${cc_lb}" }, as: EHSAdministrator, captures: { emp_lb: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-LB1", site_name: "Plant 12", model: "VM-500" }, as: VendingTechnician, captures: { mach_lb: $.data.id, mach_lb_v: $.data.version } }
            - { call: "POST /machines/${mach_lb}/slots", payload: { slot_code: "A1", item_id: "${item_lb}", capacity: 30, par_level: 0, expected_machine_version: "${mach_lb_v}" }, as: VendingTechnician, captures: { slot_lb: $.data.id } }
            - { call: "PUT /machines/${mach_lb}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_lb}", slot_id: "${slot_lb}", qty: 20 }, as: VendingTechnician, captures: { ro_lb: $.data.id } }
            - { call: "POST /restock-orders/${ro_lb}/pick", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders/${ro_lb}/load", payload: {}, as: VendingTechnician }
          trigger:
            - { call: "POST /issuances", payload: { machine_id: "${mach_lb}", slot_id: "${slot_lb}", qty: 2, idempotency_key: "lb-1" }, as: Employee, as_user_id: "${emp_lb}" }
            - { call: "POST /issuances", payload: { machine_id: "${mach_lb}", slot_id: "${slot_lb}", qty: 2, idempotency_key: "lb-2" }, as: Employee, as_user_id: "${emp_lb}" }
            - { call: "POST /issuances", payload: { machine_id: "${mach_lb}", slot_id: "${slot_lb}", qty: 1, idempotency_key: "lb-3" }, as: Employee, as_user_id: "${emp_lb}", captures: { lb_ok: $.data.id } }
            - { call: "POST /issuances", payload: { machine_id: "${mach_lb}", slot_id: "${slot_lb}", qty: 1, idempotency_key: "lb-4" }, as: Employee, as_user_id: "${emp_lb}", captures: { lb_err: $.data.error_id } }
          assert:
            - "vend 3 (usage 4 + 1 == limit 5) SUCCEEDS: IssuanceTransaction created"
            - "vend 4 (usage 5 + 1 == 6 > 5) FAILS with ERR_ISSUANCE_LIMIT_EXCEEDED"
            - "MachineSlot.${slot_lb}.on_hand_qty == 15 (only three successful vends decremented)"

      - name: restock_load_capacity_exact_boundary
        grounds:
          - validations[priority=14]
          - state_machines.RestockOrder.PICKED_to_LOADED
        distinguishing_aspect: |
          Metric = physical slot capacity vs loaded units on a DIFFERENT endpoint
          (POST /restock-orders/{id}/load): on_hand 6 + qty 4 == capacity 10
          PASSES (<= semantics); a subsequent PICKED order of qty 1
          (10 + 1 > 10) FAILS with ERR_CAPACITY_EXCEEDED and the order stays
          PICKED. Distinct metric (capacity vs usage count) and distinct
          endpoint from usage_limit_exact_boundary.
        test_recipe:
          setup:
            - "GENERAL item CAP-B base 300; machine ACTIVE; slot cap 10 par 2"
            - "order A qty 6 loaded (on_hand 6); order B qty 4 PICKED; order C qty 1 PICKED"
          setup_api_calls:
            - { call: "POST /items", payload: { sku: "CAP-B", name: "Lens Wipes", category: "GENERAL", base_list_price_cents: 300 }, as: EHSAdministrator, captures: { item_cb: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-CB1", site_name: "Plant 13", model: "VM-300" }, as: VendingTechnician, captures: { mach_cb: $.data.id, mach_cb_v: $.data.version } }
            - { call: "POST /machines/${mach_cb}/slots", payload: { slot_code: "A1", item_id: "${item_cb}", capacity: 10, par_level: 2, expected_machine_version: "${mach_cb_v}" }, as: VendingTechnician, captures: { slot_cb: $.data.id } }
            - { call: "PUT /machines/${mach_cb}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_cb}", slot_id: "${slot_cb}", qty: 6 }, as: VendingTechnician, captures: { ro_cb_a: $.data.id } }
            - { call: "POST /restock-orders/${ro_cb_a}/pick", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders/${ro_cb_a}/load", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_cb}", slot_id: "${slot_cb}", qty: 4 }, as: VendingTechnician, captures: { ro_cb_b: $.data.id } }
            - { call: "POST /restock-orders/${ro_cb_b}/pick", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_cb}", slot_id: "${slot_cb}", qty: 1 }, as: VendingTechnician, captures: { ro_cb_c: $.data.id } }
            - { call: "POST /restock-orders/${ro_cb_c}/pick", payload: {}, as: VendingTechnician }
          trigger:
            - { call: "POST /restock-orders/${ro_cb_b}/load", payload: {}, as: VendingTechnician, captures: { cb_b_status: $.data.status } }
            - { call: "POST /restock-orders/${ro_cb_c}/load", payload: {}, as: VendingTechnician, captures: { cb_c_err: $.data.error_id } }
            - { call: "GET /restock-orders/${ro_cb_c}", payload: {}, as: Any, captures: { cb_c_status: $.data.status } }
            - { call: "GET /slots/${slot_cb}", payload: {}, as: Any, captures: { cb_onhand: $.data.on_hand_qty } }
          assert:
            - "order B load SUCCEEDS (6 + 4 == capacity 10): status LOADED"
            - "MachineSlot.${slot_cb}.on_hand_qty == 10"
            - "order C load FAILS with ERR_CAPACITY_EXCEEDED (10 + 1 > 10)"
            - "RestockOrder.${ro_cb_c}.status == PICKED (failed load leaves state untouched)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: vend_blocked_when_machine_offline
        grounds:
          - validations[priority=5]
          - state_machines.VendingMachine.ACTIVE_to_OFFLINE
          - state_machines.VendingMachine.OFFLINE_to_ACTIVE
        distinguishing_aspect: |
          Pair IssuanceTransaction x VendingMachine: the vend's validity is
          gated on the MACHINE's state, not the issuance's own — OFFLINE blocks
          with ERR_MACHINE_NOT_ACTIVE, and restoring the machine to ACTIVE (and
          no other change) makes the identical vend succeed.
        test_recipe:
          setup:
            - "GENERAL item XDEP-M base 300; policy limit 10/30d; employee; machine with slot cap 20 par 0 stocked 10, currently ACTIVE"
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-XM1", name: "Logistics" }, as: FinanceAnalyst, captures: { cc_xm: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "PACKER-XM" }, as: EHSAdministrator, captures: { role_xm: $.data.id } }
            - { call: "POST /items", payload: { sku: "XDEP-M", name: "Work Gloves", category: "GENERAL", base_list_price_cents: 300 }, as: EHSAdministrator, captures: { item_xm: $.data.id } }
            - { call: "POST /issuance-policies", payload: { job_role_id: "${role_xm}", item_id: "${item_xm}", period_limit_qty: 10, period_window_days: 30 }, as: EHSAdministrator }
            - { call: "POST /employees", payload: { employee_code: "E-XM1", full_name: "Packer One", job_role_id: "${role_xm}", home_cost_center_id: "${cc_xm}" }, as: EHSAdministrator, captures: { emp_xm: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-XM1", site_name: "Plant 14", model: "VM-500" }, as: VendingTechnician, captures: { mach_xm: $.data.id, mach_xm_v: $.data.version } }
            - { call: "POST /machines/${mach_xm}/slots", payload: { slot_code: "A1", item_id: "${item_xm}", capacity: 20, par_level: 0, expected_machine_version: "${mach_xm_v}" }, as: VendingTechnician, captures: { slot_xm: $.data.id } }
            - { call: "PUT /machines/${mach_xm}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_xm}", slot_id: "${slot_xm}", qty: 10 }, as: VendingTechnician, captures: { ro_xm: $.data.id } }
            - { call: "POST /restock-orders/${ro_xm}/pick", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders/${ro_xm}/load", payload: {}, as: VendingTechnician }
            - { call: "PUT /machines/${mach_xm}", payload: { status: "OFFLINE" }, as: VendingTechnician }
          trigger:
            - { call: "POST /issuances", payload: { machine_id: "${mach_xm}", slot_id: "${slot_xm}", qty: 1, idempotency_key: "xm-1" }, as: Employee, as_user_id: "${emp_xm}", captures: { xm_err: $.data.error_id } }
            - { call: "PUT /machines/${mach_xm}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /issuances", payload: { machine_id: "${mach_xm}", slot_id: "${slot_xm}", qty: 1, idempotency_key: "xm-2" }, as: Employee, as_user_id: "${emp_xm}", captures: { xm_ok: $.data.id } }
          assert:
            - "while machine OFFLINE: error_id == ERR_MACHINE_NOT_ACTIVE; no issuance created"
            - "after machine restored to ACTIVE: identical vend succeeds (201)"
            - "MachineSlot.${slot_xm}.on_hand_qty == 9 (exactly one successful vend)"

      - name: audit_fieldwork_blocked_by_open_batch
        grounds:
          - validations[priority=20]
          - state_machines.ComplianceAudit.DRAFT_to_FIELDWORK
          - state_machines.ChargebackBatch.OPEN_to_CLOSED
        distinguishing_aspect: |
          Pair ComplianceAudit x ChargebackBatch: the audit's DRAFT->FIELDWORK
          transition is gated on the state of a DIFFERENT entity — any
          overlapping OPEN chargeback batch forces ERR_OPEN_BATCHES_EXIST;
          closing the batch (no change to the audit itself) unlocks the
          transition.
        test_recipe:
          setup:
            - "Cost center CC-XA1; role; GENERAL item XDEP-A base 300; policy limit 10/30d; employee; machine ACTIVE stocked 5; one vend qty 1 at default clock 2026-05-01"
            - "ChargebackBatch OPEN for CC-XA1 period [2026-05-01, 2026-06-01)"
            - "ComplianceAudit scope OVERRIDE_USAGE period 2026-05-01..2026-05-31 (overlaps the OPEN batch)"
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-XA1", name: "Shipping" }, as: FinanceAnalyst, captures: { cc_xa: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "SHIPPER-XA" }, as: EHSAdministrator, captures: { role_xa: $.data.id } }
            - { call: "POST /items", payload: { sku: "XDEP-A", name: "Knee Pads", category: "GENERAL", base_list_price_cents: 300 }, as: EHSAdministrator, captures: { item_xa: $.data.id } }
            - { call: "POST /issuance-policies", payload: { job_role_id: "${role_xa}", item_id: "${item_xa}", period_limit_qty: 10, period_window_days: 30 }, as: EHSAdministrator }
            - { call: "POST /employees", payload: { employee_code: "E-XA1", full_name: "Shipper One", job_role_id: "${role_xa}", home_cost_center_id: "${cc_xa}" }, as: EHSAdministrator, captures: { emp_xa: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-XA1", site_name: "Plant 15", model: "VM-500" }, as: VendingTechnician, captures: { mach_xa: $.data.id, mach_xa_v: $.data.version } }
            - { call: "POST /machines/${mach_xa}/slots", payload: { slot_code: "A1", item_id: "${item_xa}", capacity: 20, par_level: 0, expected_machine_version: "${mach_xa_v}" }, as: VendingTechnician, captures: { slot_xa: $.data.id } }
            - { call: "PUT /machines/${mach_xa}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_xa}", slot_id: "${slot_xa}", qty: 5 }, as: VendingTechnician, captures: { ro_xa: $.data.id } }
            - { call: "POST /restock-orders/${ro_xa}/pick", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders/${ro_xa}/load", payload: {}, as: VendingTechnician }
            - { call: "POST /issuances", payload: { machine_id: "${mach_xa}", slot_id: "${slot_xa}", qty: 1, idempotency_key: "xa-1" }, as: Employee, as_user_id: "${emp_xa}" }
            - { call: "POST /chargeback-batches", payload: { cost_center_id: "${cc_xa}", period_start: "2026-05-01", period_end: "2026-06-01" }, as: FinanceAnalyst, captures: { batch_xa: $.data.id } }
            - { call: "POST /compliance-audits", payload: { scope: "OVERRIDE_USAGE", period_start: "2026-05-01", period_end: "2026-05-31" }, as: ComplianceAuditor, captures: { audit_xa: $.data.id } }
          trigger:
            - { call: "POST /compliance-audits/${audit_xa}/begin-fieldwork", payload: {}, as: ComplianceAuditor, captures: { xa_err: $.data.error_id } }
            - { call: "POST /chargeback-batches/${batch_xa}/close", payload: {}, as: FinanceAnalyst }
            - { call: "POST /compliance-audits/${audit_xa}/begin-fieldwork", payload: {}, as: ComplianceAuditor, captures: { xa_status: $.data.status } }
          assert:
            - "with batch OPEN: error_id == ERR_OPEN_BATCHES_EXIST; audit stays DRAFT"
            - "after batch CLOSED: audit transitions to FIELDWORK"
            - "ChargebackBatch.${batch_xa}.line_count == 1"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: service_window_half_open_adjacency
        grounds:
          - validations[priority=10]
        distinguishing_aspect: |
          Resource VendingMachine, HALF-OPEN interval semantics: ticket windows
          [08:00, 12:00) and [12:00, 16:00) touch at 12:00 and are ALLOWED
          (adjacency is not overlap), while [11:00, 13:00) intersects the first
          and is rejected with ERR_SERVICE_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Machine registered (status COMMISSIONING suffices — overlap rule is machine-scoped regardless of status)"
            - "Ticket T1 OPEN with window [2026-05-10T08:00:00Z, 2026-05-10T12:00:00Z)"
          setup_api_calls:
            - { call: "POST /machines", payload: { location_code: "LOC-SW1", site_name: "Plant 16", model: "VM-500" }, as: VendingTechnician, captures: { mach_sw: $.data.id } }
            - { call: "POST /service-tickets", payload: { machine_id: "${mach_sw}", issue_code: "PREVENTIVE", window_start: "2026-05-10T08:00:00Z", window_end: "2026-05-10T12:00:00Z" }, as: VendingTechnician, captures: { tkt_sw1: $.data.id } }
          trigger:
            - { call: "POST /service-tickets", payload: { machine_id: "${mach_sw}", issue_code: "JAM", window_start: "2026-05-10T12:00:00Z", window_end: "2026-05-10T16:00:00Z" }, as: VendingTechnician, captures: { tkt_sw2: $.data.id } }
            - { call: "POST /service-tickets", payload: { machine_id: "${mach_sw}", issue_code: "NETWORK", window_start: "2026-05-10T11:00:00Z", window_end: "2026-05-10T13:00:00Z" }, as: VendingTechnician, captures: { sw3_err: $.data.error_id } }
          assert:
            - "adjacent window (start == prior end) ACCEPTED: ticket created, status OPEN"
            - "intersecting window (11:00 < 12:00 < 13:00) REJECTED with ERR_SERVICE_WINDOW_OVERLAP"
            - "GET /service-tickets?machine_id shows exactly 2 tickets"

      - name: override_window_closed_gap_required
        grounds:
          - validations[priority=11]
        distinguishing_aspect: |
          Resource Employee x Item, CLOSED-interval semantics WITH a mandatory
          buffer: an existing ACTIVE override [2026-05-10, 2026-05-20] rejects a
          new window starting 2026-05-21 (adjacent closed intervals, zero full
          gap days) and accepts 2026-05-22 (2026-05-21 is a full gap day) —
          geometrically different from the service window's half-open adjacency
          rule on a different resource.
        test_recipe:
          setup:
            - "Cost center; role; GENERAL item GAP-O base 300; employee emp_gap; manager mgr_gap"
            - "Override O1 ACTIVE [2026-05-10, 2026-05-20]"
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-GO1", name: "Machining" }, as: FinanceAnalyst, captures: { cc_go: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "MACHINIST-GO" }, as: EHSAdministrator, captures: { role_go: $.data.id } }
            - { call: "POST /items", payload: { sku: "GAP-O", name: "Face Shield", category: "GENERAL", base_list_price_cents: 300 }, as: EHSAdministrator, captures: { item_go: $.data.id } }
            - { call: "POST /employees", payload: { employee_code: "E-GO1", full_name: "Machinist Two", job_role_id: "${role_go}", home_cost_center_id: "${cc_go}" }, as: EHSAdministrator, captures: { emp_go: $.data.id } }
            - { call: "POST /employees", payload: { employee_code: "M-GO1", full_name: "Mgr GO", job_role_id: "${role_go}", home_cost_center_id: "${cc_go}", is_manager: true }, as: EHSAdministrator, captures: { mgr_go: $.data.id } }
            - { call: "POST /manager-overrides", payload: { employee_id: "${emp_go}", item_id: "${item_go}", approved_qty: 2, valid_from: "2026-05-10", valid_until: "2026-05-20", reason_code: "PROJECT" }, as: Manager, as_user_id: "${mgr_go}", captures: { ov_go1: $.data.id } }
          trigger:
            - { call: "POST /manager-overrides", payload: { employee_id: "${emp_go}", item_id: "${item_go}", approved_qty: 2, valid_from: "2026-05-21", valid_until: "2026-05-25", reason_code: "PROJECT" }, as: Manager, as_user_id: "${mgr_go}", captures: { go2_err: $.data.error_id } }
            - { call: "POST /manager-overrides", payload: { employee_id: "${emp_go}", item_id: "${item_go}", approved_qty: 2, valid_from: "2026-05-22", valid_until: "2026-05-26", reason_code: "INCIDENT" }, as: Manager, as_user_id: "${mgr_go}", captures: { ov_go3: $.data.id } }
          assert:
            - "valid_from == 2026-05-21 (day after valid_until 2026-05-20) REJECTED with ERR_OVERRIDE_WINDOW_OVERLAP (zero full gap days)"
            - "valid_from == 2026-05-22 ACCEPTED (2026-05-21 is a full calendar gap day): status ACTIVE"
            - "GET /manager-overrides?employee_id returns exactly 2 ACTIVE overrides"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: vend_reverse_restores_slot_on_hand
        grounds:
          - state_machines.IssuanceTransaction.POSTED_to_REVERSED
        distinguishing_aspect: |
          Conserved quantity = MachineSlot.on_hand_qty (physical units):
          vend(3) followed by its compensating reverse MUST leave on_hand_qty
          exactly at its pre-vend value 10 — pinned formula:
          on_hand_after_reverse == on_hand_before_vend; the vend's -3 and the
          reversal's +3 cancel with zero drift.
        test_recipe:
          setup:
            - "Cost center; role; GENERAL item INV-K base 300; policy limit 10/30d; employee emp_ik; manager mgr_ik; machine ACTIVE; slot cap 20 par 0 stocked 10"
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-IK1", name: "Welding Bay" }, as: FinanceAnalyst, captures: { cc_ik: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "WELDER-IK" }, as: EHSAdministrator, captures: { role_ik: $.data.id } }
            - { call: "POST /items", payload: { sku: "INV-K", name: "Welding Sleeves", category: "GENERAL", base_list_price_cents: 300 }, as: EHSAdministrator, captures: { item_ik: $.data.id } }
            - { call: "POST /issuance-policies", payload: { job_role_id: "${role_ik}", item_id: "${item_ik}", period_limit_qty: 10, period_window_days: 30 }, as: EHSAdministrator }
            - { call: "POST /employees", payload: { employee_code: "E-IK1", full_name: "Welder Two", job_role_id: "${role_ik}", home_cost_center_id: "${cc_ik}" }, as: EHSAdministrator, captures: { emp_ik: $.data.id } }
            - { call: "POST /employees", payload: { employee_code: "M-IK1", full_name: "Mgr IK", job_role_id: "${role_ik}", home_cost_center_id: "${cc_ik}", is_manager: true }, as: EHSAdministrator, captures: { mgr_ik: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-IK1", site_name: "Plant 17", model: "VM-500" }, as: VendingTechnician, captures: { mach_ik: $.data.id, mach_ik_v: $.data.version } }
            - { call: "POST /machines/${mach_ik}/slots", payload: { slot_code: "A1", item_id: "${item_ik}", capacity: 20, par_level: 0, expected_machine_version: "${mach_ik_v}" }, as: VendingTechnician, captures: { slot_ik: $.data.id } }
            - { call: "PUT /machines/${mach_ik}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_ik}", slot_id: "${slot_ik}", qty: 10 }, as: VendingTechnician, captures: { ro_ik: $.data.id } }
            - { call: "POST /restock-orders/${ro_ik}/pick", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders/${ro_ik}/load", payload: {}, as: VendingTechnician }
          trigger:
            - { call: "POST /issuances", payload: { machine_id: "${mach_ik}", slot_id: "${slot_ik}", qty: 3, idempotency_key: "ik-1" }, as: Employee, as_user_id: "${emp_ik}", captures: { iss_ik: $.data.id } }
            - { call: "GET /slots/${slot_ik}", payload: {}, as: Any, captures: { ik_mid: $.data.on_hand_qty } }
            - { call: "POST /issuances/${iss_ik}/reverse", payload: {}, as: Manager, as_user_id: "${mgr_ik}" }
            - { call: "GET /slots/${slot_ik}", payload: {}, as: Any, captures: { ik_end: $.data.on_hand_qty } }
          assert:
            - "after vend: MachineSlot.${slot_ik}.on_hand_qty == 7"
            - "after reverse: MachineSlot.${slot_ik}.on_hand_qty == 10 (== pre-vend value; invariant restored)"
            - "IssuanceTransaction.${iss_ik}.status == REVERSED"
            - "GET /issuances?slot_id shows 1 row with status REVERSED and 0 POSTED rows"

      - name: override_grant_revoke_restores_effective_limit
        grounds:
          - calculations.effective_limit
          - state_machines.ManagerOverride.ACTIVE_to_REVOKED
        distinguishing_aspect: |
          Conserved quantity = the employee's effective issuance limit (logical
          quota, a different conserved quantity than physical units):
          effective_limit(employee, item) == IssuancePolicy.period_limit_qty +
          SUM(remaining_qty of covering ACTIVE overrides). Grant(3) then its
          compensating revoke MUST return the effective limit to the base 5 —
          observable behaviorally: a 6th unit vends only while the grant lives.
        test_recipe:
          setup:
            - "Cost center; role; GENERAL item LIM-K base 300; policy limit 5/30d; employee emp_lk; manager mgr_lk; machine ACTIVE; slot cap 30 par 0 stocked 20"
            - "Employee at usage 5 (vends 3 + 2, at base limit)"
          setup_api_calls:
            - { call: "POST /cost-centers", payload: { cost_center_code: "CC-LK1", name: "Final Assembly" }, as: FinanceAnalyst, captures: { cc_lk: $.data.id } }
            - { call: "POST /job-roles", payload: { role_name: "ASSEMBLER-LK" }, as: EHSAdministrator, captures: { role_lk: $.data.id } }
            - { call: "POST /items", payload: { sku: "LIM-K", name: "Anti-Fog Glasses", category: "GENERAL", base_list_price_cents: 300 }, as: EHSAdministrator, captures: { item_lk: $.data.id } }
            - { call: "POST /issuance-policies", payload: { job_role_id: "${role_lk}", item_id: "${item_lk}", period_limit_qty: 5, period_window_days: 30 }, as: EHSAdministrator }
            - { call: "POST /employees", payload: { employee_code: "E-LK1", full_name: "Assembler Two", job_role_id: "${role_lk}", home_cost_center_id: "${cc_lk}" }, as: EHSAdministrator, captures: { emp_lk: $.data.id } }
            - { call: "POST /employees", payload: { employee_code: "M-LK1", full_name: "Mgr LK", job_role_id: "${role_lk}", home_cost_center_id: "${cc_lk}", is_manager: true }, as: EHSAdministrator, captures: { mgr_lk: $.data.id } }
            - { call: "POST /machines", payload: { location_code: "LOC-LK1", site_name: "Plant 18", model: "VM-500" }, as: VendingTechnician, captures: { mach_lk: $.data.id, mach_lk_v: $.data.version } }
            - { call: "POST /machines/${mach_lk}/slots", payload: { slot_code: "A1", item_id: "${item_lk}", capacity: 30, par_level: 0, expected_machine_version: "${mach_lk_v}" }, as: VendingTechnician, captures: { slot_lk: $.data.id } }
            - { call: "PUT /machines/${mach_lk}", payload: { status: "ACTIVE" }, as: VendingTechnician }
            - { call: "POST /restock-orders", payload: { machine_id: "${mach_lk}", slot_id: "${slot_lk}", qty: 20 }, as: VendingTechnician, captures: { ro_lk: $.data.id } }
            - { call: "POST /restock-orders/${ro_lk}/pick", payload: {}, as: VendingTechnician }
            - { call: "POST /restock-orders/${ro_lk}/load", payload: {}, as: VendingTechnician }
            - { call: "POST /issuances", payload: { machine_id: "${mach_lk}", slot_id: "${slot_lk}", qty: 3, idempotency_key: "lk-1" }, as: Employee, as_user_id: "${emp_lk}" }
            - { call: "POST /issuances", payload: { machine_id: "${mach_lk}", slot_id: "${slot_lk}", qty: 2, idempotency_key: "lk-2" }, as: Employee, as_user_id: "${emp_lk}" }
          trigger:
            - { call: "POST /manager-overrides", payload: { employee_id: "${emp_lk}", item_id: "${item_lk}", approved_qty: 3, valid_from: "2026-05-01", valid_until: "2026-05-31", reason_code: "INCIDENT" }, as: Manager, as_user_id: "${mgr_lk}", captures: { ov_lk: $.data.id } }
            - { call: "POST /issuances", payload: { machine_id: "${mach_lk}", slot_id: "${slot_lk}", qty: 1, idempotency_key: "lk-3", manager_override_id: "${ov_lk}" }, as: Employee, as_user_id: "${emp_lk}", captures: { lk_drawn: $.data.override_drawn_qty } }
            - { call: "POST /manager-overrides/${ov_lk}/revoke", payload: {}, as: Manager, as_user_id: "${mgr_lk}", captures: { lk_ov_status: $.data.status } }
            - { call: "POST /issuances", payload: { machine_id: "${mach_lk}", slot_id: "${slot_lk}", qty: 1, idempotency_key: "lk-4" }, as: Employee, as_user_id: "${emp_lk}", captures: { lk_err: $.data.error_id } }
          assert:
            - "with grant ACTIVE: vend 6th unit SUCCEEDS, override_drawn_qty == 1 (effective limit 5 + 3 = 8 >= usage 6)"
            - "ManagerOverride.${ov_lk}.status == REVOKED after revoke"
            - "after revoke: identical vend FAILS with ERR_ISSUANCE_LIMIT_EXCEEDED (effective limit back to base 5; usage 6 >= 5)"
            - "invariant: effective_limit after grant+revoke == effective_limit before grant == 5"
