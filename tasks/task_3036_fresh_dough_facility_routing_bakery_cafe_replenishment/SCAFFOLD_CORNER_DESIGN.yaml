  - section: errors
    instances:
      - name: error_order_cutoff_passed_covered
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_ORDER_CUTOFF_PASSED]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_fiscal_on_locked_order_credit_breach
          rationale: "cutoff is exercised as part of the LOCKED-order setup; the exact-boundary trigger is covered by order_submit_at_exact_cutoff_rejected in §1.9 validations."

      - name: error_substitution_forbidden_covered
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_SUBSTITUTION_FORBIDDEN]"
        excluded_because:
          difficulty_instance: dual_variant_calc / transfer_pricing_provisional_vs_final_on_short_shipment
          rationale: "the SHIPPED_SHORT path exercises the no-substitution rule end-to-end."

      - name: error_invalid_state_covered
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_INVALID_STATE]"
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / donation_confirm_requires_schedule_closed
          rationale: "ERR_INVALID_STATE is asserted as the donation-confirm failure path."

