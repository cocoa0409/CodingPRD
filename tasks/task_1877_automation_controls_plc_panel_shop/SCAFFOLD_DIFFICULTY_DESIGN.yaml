            - "SubstitutionRequest.${sub_s}.sccr_impact_ka == 10"
            - "GET /panels/${panel_s} after approval returns sccr_rating_ka == 10"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: panel_design_review_revision_loop
        grounds:
          - state_machines.Panel.DESIGN_to_DESIGN_REVIEW
          - state_machines.Panel.DESIGN_REVIEW_to_DESIGN
          - state_machines.Panel.DESIGN_REVIEW_to_DESIGN_APPROVED
          - calculations.bom_cost_rollup
        distinguishing_aspect: |
          Panel machine is cyclic: DESIGN -> DESIGN_REVIEW -> DESIGN (reject) ->
          DESIGN_REVIEW (resubmit) -> DESIGN_APPROVED. The revision loop executes
          twice with a BOM quantity edit between cycles (recomputing the rolled-up
          line cost) and the third submit succeeds — proving the machine neither
          locks after N loops nor loses BOM edits across the cycle.
        test_recipe:
          setup:
            - "Panel in DESIGN with BOM {BPD-100, CON-5} rating 10 kA; designer de-005, QA qa-904"
          setup_api_calls:
            - call: "POST /panel-shop/customers"
              payload: { company_name: "Zeta Chemicals", site_state_code: "LA" }
              as: ProjectManager
              captures: { cust6_id: "$.data.id" }
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "${cust6_id}", job_number: "J-6001", quoted_price_cents: 700000 }
              as: ProjectManager
              captures: { job6_id: "$.data.id" }
            - call: "POST /panel-shop/jobs/${job6_id}/panels"
              payload: { panel_tag: "P-R1", enclosure_rating: "NEMA_4X", design_engineer_id: "de-005" }
              as: DesignEngineer
              captures: { panel_r: "$.data.id" }
            - call: "POST /panel-shop/components"
              payload: { part_number: "BPD-R100", component_class: "BRANCH_PROTECTIVE", unit_cost_cents: 45000, lead_time_days: 28, sccr_ka: 100, heat_dissipation_w: 12 }
              as: QAManager
              captures: { c_rbpd: "$.data.id" }
            - call: "POST /panel-shop/components"
              payload: { part_number: "CON-R5", component_class: "CONTACTOR", unit_cost_cents: 8000, lead_time_days: 5, sccr_ka: 5, heat_dissipation_w: 20 }
              as: QAManager
              captures: { c_rcon: "$.data.id" }
            - call: "POST /panel-shop/panels/${panel_r}/components"
              payload: { component_id: "${c_rbpd}", quantity: 1 }
              as: DesignEngineer
            - call: "POST /panel-shop/panels/${panel_r}/components"
              payload: { component_id: "${c_rcon}", quantity: 1 }
              as: DesignEngineer
              captures: { line_rcon: "$.data.id" }
          trigger:
            - call: "POST /panel-shop/panels/${panel_r}/submit-review"
              payload: {}
              as: DesignEngineer
            - call: "POST /panel-shop/panels/${panel_r}/reject-design"
              payload: {}
              as: QAManager
              as_user_id: "qa-904"
            - call: "POST /panel-shop/panels/${panel_r}/submit-review"
              payload: {}
              as: DesignEngineer
            - call: "POST /panel-shop/panels/${panel_r}/reject-design"
              payload: {}
              as: QAManager
              as_user_id: "qa-904"
            - call: "PATCH /panel-shop/panel-components/${line_rcon}"
              payload: { quantity: 2 }
              as: DesignEngineer
            - call: "POST /panel-shop/panels/${panel_r}/submit-review"
              payload: {}
              as: DesignEngineer
            - call: "POST /panel-shop/panels/${panel_r}/approve-design"
              payload: {}
              as: QAManager
              as_user_id: "qa-904"
          assert:
            - "After first reject, Panel.${panel_r}.status == DESIGN"
            - "After second reject, Panel.${panel_r}.status == DESIGN (loop count 2 does not lock the machine)"
            - "Final transition succeeds: Panel.${panel_r}.status == DESIGN_APPROVED"
            - "PATCH of quantity on a PENDING line recomputes extended_cost_cents == 16000 (2 * 8000)"

      - name: change_order_cyclic_negotiation_proposed_revised
        grounds:
          - state_machines.ChangeOrder.PROPOSED_to_REVISED
          - state_machines.ChangeOrder.REVISED_to_PROPOSED
          - state_machines.ChangeOrder.REVISED_to_APPROVED
        distinguishing_aspect: |
          ChangeOrder machine is a negotiation cycle distinct from Panel's revision
          loop: PROPOSED -> REVISED (customer counter) -> PROPOSED (PM re-tables) ->
          REVISED -> APPROVED. The cycle mutates price_delta_cents/discount_pct on
          each revise, so computed_delta_cents is re-derived per round; the assert
          pins the two rounds' computed values (round 1: 200000 @0.02 -> 190000;
          round 2: 150000 @0.00 -> 142500 via T1 floor).
        test_recipe:
          setup:
            - "Job J-6002 in DESIGN with quoted_price_cents 1000000 for customer"
          setup_api_calls:
            - call: "POST /panel-shop/customers"
              payload: { company_name: "Eta Wire", site_state_code: "IN" }
              as: ProjectManager
              captures: { cust7_id: "$.data.id" }
