        distinguishing_aspect: |
          SpecialOrder→ALLOCATED (SpecialOrder↔Product pair, distinct from the
          Prescription↔ClinicAppointment pair) is gated on product.recall_state == CLEAR;
          allocating a REQUESTED order for a RECALLED product yields ERR_PRODUCT_RECALLED.
        test_recipe:
          setup:
            - "Store S, Product P with an AVAILABLE lot, REQUESTED special order for P, then P recalled."
          setup_api_calls:
