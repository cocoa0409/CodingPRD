      - name: settle_queued_record_returns_not_settlable
        claim_type: Invalid Transitions
        grounds: [state_machines.DisseminationRecord, errors.ERR_RECORD_NOT_SETTLABLE]
        distinguishing_aspect: "Settle is only defined from SENT: settling a QUEUED record (never dispatched because the clock has not advanced) is 409 ERR_RECORD_NOT_SETTLABLE and retry_count stays 0."
        test_recipe:
          setup: ["Office, zone, SEVERE storm wind 60, one WEA channel; warning issued at 10:00 with the clock unmoved, so its record is still QUEUED."]
