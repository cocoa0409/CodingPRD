            - "the second post of the same (trait_code, rep_number) -> 409 with data.error_id == ERR_DUPLICATE_OBSERVATION"
            - "GET /trial-entries/${e_a}/observations returns total_count == 1 and the surviving value is 14.0, not 16.0"
            - "the stored row carries qc_status == ACCEPTED, is_outlier == false and a non-null recorded_by_user_id"
            - "TrialEntry.${e_a}.valid_rep_count == 1 after the single accepted observation"

      - name: objective_requires_an_existing_parent_program_in_the_path
        claim_type: Parent Relationships
        grounds:
          - entities.BreedingObjective.parent
          - validations[priority=4]
          - endpoints["POST /breeding-programs/{id}/objectives"]
          - endpoints["GET /breeding-programs/{id}/objectives"]
        distinguishing_aspect: "BreedingObjective is a true containment child: it is only creatable under a program path, its program_id is taken from that path rather than the body, and an unknown parent id must fail with ERR_PROGRAM_NOT_FOUND before any body validation runs."
