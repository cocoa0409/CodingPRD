  - section: errors
    coverage_note: |
      Table 6 requires every code in the §1.6 catalog of 56 errors to be triggerable. The
      sections above already trigger 42 of them; this section closes the remaining gap:
      two instances sweep the eight NOT_FOUND codes, three instances reach the determination
      lifecycle codes and the dividend priority-class code, and six excluded_because stubs
      point at the §1.8 instances that already trigger their code. ERR_UNAUTHENTICATED and
      ERR_UNAUTHORIZED are triggered by the rbac section and ERR_STALE_DEPOSITOR_VERSION /
      ERR_STALE_INSTITUTION_VERSION by the optimistic-concurrency instances in
      cross_cutting_complexity_layers below, one per §1.2.1 concurrency rule.
    instances:
      - name: every_read_endpoint_returns_its_own_not_found_code_for_an_unknown_uuid
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DEPOSITOR_NOT_FOUND]
          - errors[ERR_DETERMINATION_NOT_FOUND]
          - errors[ERR_CERTIFICATE_NOT_FOUND]
          - errors[ERR_BIDDER_NOT_FOUND]
          - errors[ERR_BID_NOT_FOUND]
          - errors[ERR_BRANCH_REOPENING_NOT_FOUND]
          - errors[ERR_DISTRIBUTION_NOT_FOUND]
          - validations[priority=12]
        distinguishing_aspect: "Each detail read reports the code for the entity named in its own path rather than a shared generic 404, and a well-formed but unknown UUID is a 404 rather than the 400 that a syntactically invalid id would produce."
        test_recipe:
          setup:
            - "an empty system with only the logical clock set; no entity of any kind has been created."
            - "MISSING_ID = 00000000-0000-4000-8000-000000000000 is a well-formed UUID that matches no row."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
          trigger:
            - call: "GET /depositor-records/00000000-0000-4000-8000-000000000000"
              as: ClaimsAgent
              captures: { nf_dep: $.data.error_id }
            - call: "GET /insurance-determinations/00000000-0000-4000-8000-000000000000"
              as: ClaimsAgent
              captures: { nf_det: $.data.error_id }
            - call: "GET /receivership-certificates/00000000-0000-4000-8000-000000000000"
              as: ClaimsAgent
              captures: { nf_cert: $.data.error_id }
            - call: "GET /bidders/00000000-0000-4000-8000-000000000000"
              as: ResolutionAnalyst
              captures: { nf_bidder: $.data.error_id }
            - call: "GET /bids/00000000-0000-4000-8000-000000000000"
              as: ResolutionAnalyst
              captures: { nf_bid: $.data.error_id }
            - call: "GET /branch-reopenings/00000000-0000-4000-8000-000000000000"
              as: ClosingManager
              captures: { nf_branch: $.data.error_id }
            - call: "GET /dividend-distributions/00000000-0000-4000-8000-000000000000"
              as: ReceivershipTrustee
              captures: { nf_dist: $.data.error_id }
            - call: "GET /institutions/00000000-0000-4000-8000-000000000000/insurance-summary"
              as: ReceivershipTrustee
              captures: { nf_summary: $.data.error_id }
          assert:
            - "trigger[0]: HTTP 404, data.error_id == 'ERR_DEPOSITOR_NOT_FOUND'"
            - "trigger[1]: HTTP 404, data.error_id == 'ERR_DETERMINATION_NOT_FOUND'"
            - "trigger[2]: HTTP 404, data.error_id == 'ERR_CERTIFICATE_NOT_FOUND'"
            - "trigger[3]: HTTP 404, data.error_id == 'ERR_BIDDER_NOT_FOUND'"
            - "trigger[4]: HTTP 404, data.error_id == 'ERR_BID_NOT_FOUND'"
            - "trigger[5]: HTTP 404, data.error_id == 'ERR_BRANCH_REOPENING_NOT_FOUND'"
            - "trigger[6]: HTTP 404, data.error_id == 'ERR_DISTRIBUTION_NOT_FOUND'"
            - "trigger[7]: HTTP 404, data.error_id == 'ERR_INSTITUTION_NOT_FOUND' — the computed read resolves its parent first"
            - "every response carries meta.api_request_id and response_type == 'error'"

      - name: action_endpoints_and_fk_payloads_return_the_not_found_code_of_the_row_they_cannot_resolve
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SUBMISSION_NOT_FOUND]
          - errors[ERR_INSTITUTION_NOT_FOUND]
          - errors[ERR_BIDDER_NOT_FOUND]
          - errors[ERR_DEPOSITOR_NOT_FOUND]
