        grounds:
          - state_machines.SaleDay.BIDDING_CLOSED_to_SETTLED
          - state_machines.Lot.PENNED_to_NO_SALE
          - state_machines.Consignment.SORTED_to_RECONCILED
          - state_machines.Settlement.DRAFT_to_HELD
          - calculations.seller_commission
          - conservation_invariants.INV_SALE_DAY_MONEY_BALANCE
        distinguishing_aspect: |
          Trigger 1 of 2, DEPTH 5: closing the sale day moves SaleDay -> SETTLED (hop 1);
          THAT finalizes the still-unsold Lot to NO_SALE (hop 2); THAT lot finalization is
          what drives its Consignment to RECONCILED (hop 3); THAT reconciliation is what
          creates the Settlement (hop 4); and THAT settlement creation is what appends the
          seven ChargeLine rows (hop 5). Each link is caused by the previous link, not by
          the original request.
