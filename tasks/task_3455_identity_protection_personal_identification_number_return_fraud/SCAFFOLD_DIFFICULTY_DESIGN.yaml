# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: interest_provisional_vs_final_diverge
        grounds:
          - calculations.refund_interest
          - entities.RefundDisbursement.fields.provisional_interest_cents
          - entities.RefundDisbursement.fields.final_interest_cents
        distinguishing_aspect: |
          RefundDisbursement-domain dual variant: identical base (100000 cents) and identical
          day count (30 days late) yield 575 cents under PROVISIONAL simple accrual but 577
          cents under FINAL daily compounding — two valid algorithms, different cents, on the
          refund-interest domain.
        test_recipe:
          setup:
            - "Clock at 2027-05-01; ACTIVE config M-INT with all weights 0, gray 1, hold 50"
            - "Taxpayer (prior_year_refund_cents 100000) files a 100000-cent NONE-bank return that scores 0 and lands FILTER_PASSED"
            - "Clock advanced to 2027-07-15 (75 days after receipt = 30 days past the 45-day free window); refund scheduled"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /identity-protection/filter-model-configs", payload: { model_version: "M-INT", w_victim_flagged: 0, w_refund_delta: 0, w_bank_product: 0, w_preparer_flagged: 0, w_dependent_conflict: 0, interaction_bonus: 0, gray_zone_threshold: 1, hold_threshold: 50 }, as: SystemAdmin, captures: { cfg: $.data.id } }
            - { call: "POST /identity-protection/filter-model-configs/${cfg}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000001", full_name: "Ann Interest", date_of_birth: "1980-01-01", prior_year_refund_cents: 100000 }, as: SystemAdmin, captures: { tp: $.data.id } }
            - { call: "POST /identity-protection/tax-returns", payload: { taxpayer_id: "${tp}", tax_year: 2026, filing_status: "SINGLE", claimed_refund_cents: 100000, bank_product: "NONE" }, as: Taxpayer, as_user_id: "${tp}", captures: { rtn: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-07-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /identity-protection/tax-returns/${rtn}/release-refund", payload: {}, as: FraudAnalyst, captures: { disb: $.data.id, prov: $.data.provisional_interest_cents } }
          trigger:
            - { call: "POST /identity-protection/refund-disbursements/${disb}/release", payload: { expected_amount_cents: 100577 }, as: SystemAdmin, captures: { fin: $.data.final_interest_cents, amt: $.data.amount_cents } }
          assert:
            - "captured prov == 575 (simple accrual on 100000 for 30 days, single round_half_up)"
            - "captured fin == 577 (daily compounding on 100000 for 30 days)"
            - "captured amt == 100577"
            - "prov != fin for identical base and day count"
            - "TaxReturn.${rtn}.status == REFUND_RELEASED"
      - name: risk_score_model_variant_divergence
        grounds:
          - calculations.filter_risk_score
          - entities.TaxReturn.fields.risk_score
          - entities.TaxReturn.fields.scoring_model_version
        distinguishing_aspect: |
          TaxReturn-domain dual variant (different entity domain than refund interest): the
          identical return payload scores 20 (FILTER_PASSED) under ACTIVE config MV-A with
          w_bank_product 20, but 60 (FILTER_HELD) under MV-B with w_bank_product 60 — variant
          selection is driven by which FilterModelConfig is ACTIVE at intake.
        test_recipe:
          setup:
            - "Clock at 2027-02-01; config MV-A (w_bank_product 20, gray 25, hold 50) ACTIVE"
            - "Taxpayer A files a REFUND_TRANSFER return scoring 20 -> FILTER_PASSED stamped MV-A"
            - "Config MV-B (w_bank_product 60) created and activated, retiring MV-A"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-02-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /identity-protection/filter-model-configs", payload: { model_version: "MV-A", w_victim_flagged: 0, w_refund_delta: 0, w_bank_product: 20, w_preparer_flagged: 0, w_dependent_conflict: 0, interaction_bonus: 0, gray_zone_threshold: 25, hold_threshold: 50 }, as: SystemAdmin, captures: { cfgA: $.data.id } }
            - { call: "POST /identity-protection/filter-model-configs/${cfgA}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000010", full_name: "Model A", date_of_birth: "1975-03-02", prior_year_refund_cents: 0 }, as: SystemAdmin, captures: { tpA: $.data.id } }
            - { call: "POST /identity-protection/tax-returns", payload: { taxpayer_id: "${tpA}", tax_year: 2026, filing_status: "SINGLE", claimed_refund_cents: 0, bank_product: "REFUND_TRANSFER", bank_account_fingerprint: "fp-aaa" }, as: Taxpayer, as_user_id: "${tpA}", captures: { rtnA: $.data.id, scoreA: $.data.risk_score } }
            - { call: "POST /identity-protection/filter-model-configs", payload: { model_version: "MV-B", w_victim_flagged: 0, w_refund_delta: 0, w_bank_product: 60, w_preparer_flagged: 0, w_dependent_conflict: 0, interaction_bonus: 0, gray_zone_threshold: 25, hold_threshold: 50 }, as: SystemAdmin, captures: { cfgB: $.data.id } }
            - { call: "POST /identity-protection/filter-model-configs/${cfgB}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000011", full_name: "Model B", date_of_birth: "1976-04-03", prior_year_refund_cents: 0 }, as: SystemAdmin, captures: { tpB: $.data.id } }
          trigger:
            - { call: "POST /identity-protection/tax-returns", payload: { taxpayer_id: "${tpB}", tax_year: 2026, filing_status: "SINGLE", claimed_refund_cents: 0, bank_product: "REFUND_TRANSFER", bank_account_fingerprint: "fp-bbb" }, as: Taxpayer, as_user_id: "${tpB}", captures: { rtnB: $.data.id, scoreB: $.data.risk_score } }
          assert:
            - "captured scoreA == 20 and TaxReturn.${rtnA}.status == FILTER_PASSED and scoring_model_version == MV-A"
            - "captured scoreB == 60 and TaxReturn.${rtnB}.status == FILTER_HELD and scoring_model_version == MV-B"
            - "identical payload yields different score and status solely from the ACTIVE config swap"

  - rule_id: combinatorial_formula
    instances:
      - name: risk_score_interaction_and_tier_selection
        grounds:
          - calculations.filter_risk_score
          - entities.FilterHold.fields.zone
        distinguishing_aspect: |
          Mode (a) combinatorial: >=3 weighted inputs with a conditional interaction branch —
          a VICTIM_FLAGGED filer with REFUND_TRANSFER and one refund-delta step sums to 45
          (GRAY tier), and the +10 interaction bonus for the victim x bank-product combination
          pushes the score to 55, flipping the hold tier from GRAY to FULL.
        test_recipe:
          setup:
            - "Clock 2027-02-10; config MV-INT (w_victim 15, w_delta 10, w_bank 20, interaction 10, gray 25, hold 50) ACTIVE"
            - "Taxpayer (prior_year_refund_cents 0) has a TAXPAYER_REPORT theft report CONFIRMED for tax_year 2026 -> VICTIM_FLAGGED + ENROLLED with an ACTIVE pin"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-02-10T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /identity-protection/filter-model-configs", payload: { model_version: "MV-INT", w_victim_flagged: 15, w_refund_delta: 10, w_bank_product: 20, w_preparer_flagged: 0, w_dependent_conflict: 0, interaction_bonus: 10, gray_zone_threshold: 25, hold_threshold: 50 }, as: SystemAdmin, captures: { cfg: $.data.id } }
            - { call: "POST /identity-protection/filter-model-configs/${cfg}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000020", full_name: "Vic Tim", date_of_birth: "1988-05-05", prior_year_refund_cents: 0 }, as: SystemAdmin, captures: { tp: $.data.id } }
            - { call: "POST /identity-protection/taxpayers/${tp}/identity-theft-reports", payload: { source: "TAXPAYER_REPORT", description: "wallet stolen" }, as: Taxpayer, as_user_id: "${tp}", captures: { rep: $.data.id } }
            - { call: "POST /identity-protection/identity-theft-reports/${rep}/confirm", payload: { tax_year: 2026 }, as: FraudAnalyst }
            - { call: "GET /identity-protection/taxpayers/${tp}/protection-pins", payload: {}, as: SystemAdmin, captures: { pin: "$.data[0].pin_value" } }
          trigger:
            - { call: "POST /identity-protection/tax-returns", payload: { taxpayer_id: "${tp}", tax_year: 2026, filing_status: "SINGLE", claimed_refund_cents: 100000, ip_pin_submitted: "${pin}", bank_product: "REFUND_TRANSFER", bank_account_fingerprint: "fp-int" }, as: Taxpayer, as_user_id: "${tp}", captures: { rtn: $.data.id, score: $.data.risk_score } }
            - { call: "GET /identity-protection/tax-returns/${rtn}/filter-holds", payload: {}, as: FraudAnalyst, captures: { zone: "$.data[0].zone" } }
          assert:
            - "captured score == 55 (15 victim + 10 one-delta-step + 20 bank-product + 10 interaction)"
            - "TaxReturn.${rtn}.status == FILTER_HELD"
            - "captured zone == FULL (55 >= hold_threshold 50; without the interaction branch the 45 would sit in GRAY)"
      - name: interest_per_component_rounding_order
        grounds:
          - calculations.refund_interest
          - calculations.dependent_conflict_adjustment
        distinguishing_aspect: |
          Mode (b) combinatorial: pinned nested-rounding order — FINAL interest rounds each
          component (300000-cent original base for 30 days -> 1731; -200000-cent conflict
          adjustment for 15 days -> -576) then sums to 1155; the rejected sum-then-compound
          order on the net 100000-cent base would give 577.
        test_recipe:
          setup:
            - "Clock 2027-05-01; pass-through config (all weights 0, gray 1, hold 50) ACTIVE"
            - "Taxpayers A and B each file a 300000-cent return claiming the same dependent -> conflict OPEN, both claims CONTESTED, both returns FILTER_PASSED (w_dependent_conflict 0)"
            - "B's refund scheduled (disbursement base 300000)"
            - "Clock at 2027-06-30: conflict resolved FIRST_FILER -> B loses 200000 cents (claimed 100000, adjustment -200000), disbursement base re-synced to 100000"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /identity-protection/filter-model-configs", payload: { model_version: "MV-PC", w_victim_flagged: 0, w_refund_delta: 0, w_bank_product: 0, w_preparer_flagged: 0, w_dependent_conflict: 0, interaction_bonus: 0, gray_zone_threshold: 1, hold_threshold: 50 }, as: SystemAdmin, captures: { cfg: $.data.id } }
            - { call: "POST /identity-protection/filter-model-configs/${cfg}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000030", full_name: "Filer A", date_of_birth: "1980-01-01", prior_year_refund_cents: 0 }, as: SystemAdmin, captures: { tpA: $.data.id } }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000031", full_name: "Filer B", date_of_birth: "1982-02-02", prior_year_refund_cents: 0 }, as: SystemAdmin, captures: { tpB: $.data.id } }
            - { call: "POST /identity-protection/tax-returns", payload: { taxpayer_id: "${tpA}", tax_year: 2026, filing_status: "HEAD_OF_HOUSEHOLD", claimed_refund_cents: 300000, bank_product: "NONE", dependents: [{ dependent_tin: "900000009", relationship: "CHILD" }] }, as: Taxpayer, as_user_id: "${tpA}", captures: { rtnA: $.data.id } }
            - { call: "POST /identity-protection/tax-returns", payload: { taxpayer_id: "${tpB}", tax_year: 2026, filing_status: "HEAD_OF_HOUSEHOLD", claimed_refund_cents: 300000, bank_product: "NONE", dependents: [{ dependent_tin: "900000009", relationship: "CHILD" }] }, as: Taxpayer, as_user_id: "${tpB}", captures: { rtnB: $.data.id } }
            - { call: "GET /identity-protection/dependent-conflicts", payload: { dependent_tin: "900000009" }, as: FraudAnalyst, captures: { conf: "$.data[0].id" } }
            - { call: "POST /identity-protection/tax-returns/${rtnB}/release-refund", payload: {}, as: FraudAnalyst, captures: { disb: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-06-30T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /identity-protection/dependent-conflicts/${conf}/resolve", payload: { winner: "FIRST_FILER" }, as: FraudAnalyst }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-07-15T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /identity-protection/refund-disbursements/${disb}/release", payload: { expected_amount_cents: 101155 }, as: SystemAdmin, captures: { fin: $.data.final_interest_cents, amt: $.data.amount_cents, base: $.data.base_cents } }
          assert:
            - "captured base == 100000 (300000 - 200000 dependent-credit adjustment)"
            - "captured fin == 1155 (round_half_up(compound(300000, 30d)) = 1731 plus round_half_up(compound(-200000, 15d)) = -576)"
            - "captured amt == 101155"
            - "fin != 577 — sum-then-compound on the net base is the rejected rounding order"

  - rule_id: non_linear_state_machine
    instances:
      - name: verification_case_retry_cycle
        grounds:
          - state_machines.IdentityVerificationCase.FAILED_to_DOCS_REQUESTED
          - state_machines.IdentityVerificationCase.DOCS_REQUESTED_to_FAILED
          - calculations.verification_document_coverage
        distinguishing_aspect: |
          Cyclic machine on IdentityVerificationCase: OPENED -> DOCS_REQUESTED -> FAILED ->
          DOCS_REQUESTED -> DOCS_SUBMITTED -> VERIFIED loops back through document request;
          attempts_count accumulates across the loop (1) while the linked held return only
          passes after the cycle terminates in VERIFIED.
        test_recipe:
          setup:
            - "Clock 2027-02-01; config MV-CYC (w_bank_product 60, gray 25, hold 50) ACTIVE"
            - "Taxpayer files a REFUND_TRANSFER return scoring 60 -> FILTER_HELD (FULL); verification case opened on channel PHONE (required docs PHOTO_ID + SSA_CARD)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-02-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /identity-protection/filter-model-configs", payload: { model_version: "MV-CYC", w_victim_flagged: 0, w_refund_delta: 0, w_bank_product: 60, w_preparer_flagged: 0, w_dependent_conflict: 0, interaction_bonus: 0, gray_zone_threshold: 25, hold_threshold: 50 }, as: SystemAdmin, captures: { cfg: $.data.id } }
            - { call: "POST /identity-protection/filter-model-configs/${cfg}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000040", full_name: "Cy Cle", date_of_birth: "1990-06-06", prior_year_refund_cents: 0 }, as: SystemAdmin, captures: { tp: $.data.id } }
            - { call: "POST /identity-protection/tax-returns", payload: { taxpayer_id: "${tp}", tax_year: 2026, filing_status: "SINGLE", claimed_refund_cents: 80000, bank_product: "REFUND_TRANSFER", bank_account_fingerprint: "fp-cyc" }, as: Taxpayer, as_user_id: "${tp}", captures: { rtn: $.data.id } }
            - { call: "POST /identity-protection/verification-cases", payload: { taxpayer_id: "${tp}", return_id: "${rtn}", channel: "PHONE" }, as: VerificationAgent, captures: { case: $.data.id } }
            - { call: "POST /identity-protection/verification-cases/${case}/request-documents", payload: {}, as: VerificationAgent }
            - { call: "POST /identity-protection/verification-cases/${case}/documents", payload: { doc_type: "PHOTO_ID" }, as: Taxpayer, as_user_id: "${tp}" }
            - { call: "POST /identity-protection/verification-cases/${case}/fail", payload: {}, as: VerificationAgent, captures: { attempts1: $.data.attempts_count, st1: $.data.status } }
            - { call: "POST /identity-protection/verification-cases/${case}/request-documents", payload: {}, as: VerificationAgent, captures: { st2: $.data.status } }
            - { call: "POST /identity-protection/verification-cases/${case}/documents", payload: { doc_type: "SSA_CARD" }, as: Taxpayer, as_user_id: "${tp}", captures: { doc2: $.data.id } }
          trigger:
            - { call: "POST /identity-protection/verification-cases/${case}/verify", payload: {}, as: VerificationAgent, captures: { stV: $.data.status } }
            - { call: "GET /identity-protection/tax-returns/${rtn}", payload: {}, as: FraudAnalyst, captures: { rtnSt: $.data.status } }
            - { call: "GET /identity-protection/tax-returns/${rtn}/filter-holds", payload: {}, as: FraudAnalyst, captures: { holdSt: "$.data[0].status" } }
          assert:
            - "captured st1 == FAILED and attempts1 == 1 after the first fail"
            - "captured st2 == DOCS_REQUESTED (FAILED loops back through request-documents)"
            - "case reached DOCS_SUBMITTED only after PHOTO_ID + SSA_CARD both received (single PHOTO_ID left it DOCS_REQUESTED)"
            - "captured stV == VERIFIED"
            - "captured rtnSt == FILTER_PASSED and captured holdSt == RESOLVED_VERIFIED"
      - name: theft_report_reject_reopen_cycle
        grounds:
          - state_machines.IdentityTheftReport.REJECTED_to_SUBMITTED
          - state_machines.IdentityTheftReport.SUBMITTED_to_CONFIRMED
        distinguishing_aspect: |
          Cyclic machine on IdentityTheftReport (a different entity than the verification
          case): SUBMITTED -> REJECTED -> SUBMITTED -> CONFIRMED traverses the reopen loop,
          and only the post-loop confirm fires the enrollment + pin-issuance cascade.
        test_recipe:
          setup:
            - "Clock 2027-01-20; taxpayer exists; taxpayer files a TAXPAYER_REPORT theft report"
            - "Analyst rejects it; taxpayer reopens it"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-20T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000041", full_name: "Re Porter", date_of_birth: "1985-07-07" }, as: SystemAdmin, captures: { tp: $.data.id } }
            - { call: "POST /identity-protection/taxpayers/${tp}/identity-theft-reports", payload: { source: "TAXPAYER_REPORT" }, as: Taxpayer, as_user_id: "${tp}", captures: { rep: $.data.id } }
            - { call: "POST /identity-protection/identity-theft-reports/${rep}/reject", payload: {}, as: FraudAnalyst, captures: { stR: $.data.status } }
            - { call: "POST /identity-protection/identity-theft-reports/${rep}/reopen", payload: {}, as: Taxpayer, as_user_id: "${tp}", captures: { stO: $.data.status } }
          trigger:
            - { call: "POST /identity-protection/identity-theft-reports/${rep}/confirm", payload: { tax_year: 2026 }, as: FraudAnalyst, captures: { stC: $.data.status } }
            - { call: "GET /identity-protection/taxpayers/${tp}", payload: {}, as: SystemAdmin, captures: { tpSt: $.data.status, enroll: $.data.ip_pin_enrollment } }
            - { call: "GET /identity-protection/taxpayers/${tp}/protection-pins", payload: {}, as: SystemAdmin, captures: { pinSt: "$.data[0].status", pinYear: "$.data[0].tax_year" } }
          assert:
            - "captured stR == REJECTED then stO == SUBMITTED (the reopen loop ran)"
            - "captured stC == CONFIRMED with confirmed_tax_year == 2026"
            - "captured tpSt == VICTIM_FLAGGED and enroll == ENROLLED"
            - "captured pinSt == ACTIVE and pinYear == 2026"

  - rule_id: transitive_cascade
    instances:
      - name: report_confirm_enrollment_pin_supersede_cascade
        grounds:
          - state_machines.IdentityTheftReport.SUBMITTED_to_CONFIRMED
          - state_machines.Taxpayer.NOT_ENROLLED_to_ENROLLED
          - state_machines.ProtectionPin.ACTIVE_to_SUPERSEDED
        distinguishing_aspect: |
          Depth-3 cascade triggered by report confirm: confirm mutates the Taxpayer
          (VICTIM_FLAGGED + ENROLLED, link 1); the enrollment mutation itself issues a new
          ACTIVE pin for the tax year (link 2); that pin creation itself supersedes the
          taxpayer's earlier ACTIVE pin for the same year (link 3).
        test_recipe:
          setup:
            - "Clock 2027-01-25; taxpayer opted in for tax_year 2026 (pin P1 ACTIVE, ONLINE_ACCOUNT)"
            - "Taxpayer files a TAXPAYER_REPORT (created_by = taxpayer, so analyst confirm passes segregation of duties)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-25T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000050", full_name: "Cas Cade", date_of_birth: "1979-08-08", pin_delivery_channel: "ONLINE_ACCOUNT" }, as: SystemAdmin, captures: { tp: $.data.id } }
            - { call: "POST /identity-protection/taxpayers/${tp}/ip-pin-opt-in", payload: { tax_year: 2026 }, as: Taxpayer, as_user_id: "${tp}", captures: { vAfterOptin: $.data.version } }
            - { call: "GET /identity-protection/taxpayers/${tp}/protection-pins", payload: {}, as: SystemAdmin, captures: { p1: "$.data[0].id", p1val: "$.data[0].pin_value" } }
            - { call: "POST /identity-protection/taxpayers/${tp}/identity-theft-reports", payload: { source: "TAXPAYER_REPORT", description: "noticed duplicate filing" }, as: Taxpayer, as_user_id: "${tp}", captures: { rep: $.data.id } }
          trigger:
            - { call: "POST /identity-protection/identity-theft-reports/${rep}/confirm", payload: { tax_year: 2026 }, as: FraudAnalyst }
            - { call: "GET /identity-protection/taxpayers/${tp}", payload: {}, as: SystemAdmin, captures: { tpSt: $.data.status, enroll: $.data.ip_pin_enrollment } }
            - { call: "GET /identity-protection/taxpayers/${tp}/protection-pins", payload: {}, as: SystemAdmin, captures: { pins: $.data } }
          assert:
            - "captured tpSt == VICTIM_FLAGGED and enroll == ENROLLED (link 1)"
            - "a new ACTIVE pin exists for tax_year 2026 whose pin_value != captured p1val (link 2)"
            - "the pin with id == captured p1 has status SUPERSEDED (link 3, caused by link 2's creation)"
            - "exactly one ACTIVE pin remains for (taxpayer, 2026)"
      - name: case_expiry_fraud_forfeit_cascade
        grounds:
          - state_machines.IdentityVerificationCase.DOCS_REQUESTED_to_EXPIRED
          - state_machines.TaxReturn.FILTER_HELD_to_FRAUD_CONFIRMED
          - state_machines.DependentClaim.CLAIMED_to_DISALLOWED
          - state_machines.DependentConflict.OPEN_to_RESOLVED
        distinguishing_aspect: |
          Depth-4 cascade from a different trigger (third verification failure, not a report
          confirm): fail -> case EXPIRED (link 1) -> held return FRAUD_CONFIRMED (link 2) ->
          the fraud cascade disallows the return's contested DependentClaim (link 3) -> the
          OPEN DependentConflict auto-resolves FIRST_FILER with resolved_reason FRAUD_FORFEIT
          (link 4), sustaining the honest filer's claim without touching their refund.
        test_recipe:
          setup:
            - "Clock 2027-02-01; config MV-FORF (w_dependent_conflict 20, gray 10, hold 50) ACTIVE"
            - "Taxpayer A files a 50000-cent NONE return claiming dependent 900000010 -> FILTER_PASSED, claim CLAIMED"
            - "Taxpayer B files a 50000-cent NONE return claiming the same dependent -> conflict OPEN, both claims CONTESTED, B's return scores 20 -> FILTER_HELD (GRAY)"
            - "B's verification case (channel ONLINE, forced by GRAY zone) is failed three times through the retry loop"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-02-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /identity-protection/filter-model-configs", payload: { model_version: "MV-FORF", w_victim_flagged: 0, w_refund_delta: 0, w_bank_product: 0, w_preparer_flagged: 0, w_dependent_conflict: 20, interaction_bonus: 0, gray_zone_threshold: 10, hold_threshold: 50 }, as: SystemAdmin, captures: { cfg: $.data.id } }
            - { call: "POST /identity-protection/filter-model-configs/${cfg}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000051", full_name: "Honest A", date_of_birth: "1981-09-09" }, as: SystemAdmin, captures: { tpA: $.data.id } }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000052", full_name: "Fraud B", date_of_birth: "1983-10-10" }, as: SystemAdmin, captures: { tpB: $.data.id } }
            - { call: "POST /identity-protection/tax-returns", payload: { taxpayer_id: "${tpA}", tax_year: 2026, filing_status: "HEAD_OF_HOUSEHOLD", claimed_refund_cents: 50000, bank_product: "NONE", dependents: [{ dependent_tin: "900000010", relationship: "CHILD" }] }, as: Taxpayer, as_user_id: "${tpA}", captures: { rtnA: $.data.id } }
            - { call: "POST /identity-protection/tax-returns", payload: { taxpayer_id: "${tpB}", tax_year: 2026, filing_status: "SINGLE", claimed_refund_cents: 50000, bank_product: "NONE", dependents: [{ dependent_tin: "900000010", relationship: "CHILD" }] }, as: Taxpayer, as_user_id: "${tpB}", captures: { rtnB: $.data.id } }
            - { call: "POST /identity-protection/verification-cases", payload: { taxpayer_id: "${tpB}", return_id: "${rtnB}", channel: "ONLINE" }, as: VerificationAgent, captures: { case: $.data.id } }
            - { call: "POST /identity-protection/verification-cases/${case}/request-documents", payload: {}, as: VerificationAgent }
            - { call: "POST /identity-protection/verification-cases/${case}/fail", payload: {}, as: VerificationAgent }
            - { call: "POST /identity-protection/verification-cases/${case}/request-documents", payload: {}, as: VerificationAgent }
            - { call: "POST /identity-protection/verification-cases/${case}/fail", payload: {}, as: VerificationAgent }
            - { call: "POST /identity-protection/verification-cases/${case}/request-documents", payload: {}, as: VerificationAgent }
          trigger:
            - { call: "POST /identity-protection/verification-cases/${case}/fail", payload: {}, as: VerificationAgent, captures: { caseSt: $.data.status, attempts: $.data.attempts_count } }
            - { call: "GET /identity-protection/tax-returns/${rtnB}", payload: {}, as: FraudAnalyst, captures: { rtnBSt: $.data.status } }
            - { call: "GET /identity-protection/tax-returns/${rtnA}/dependent-claims", payload: {}, as: FraudAnalyst, captures: { claimASt: "$.data[0].status" } }
            - { call: "GET /identity-protection/dependent-conflicts", payload: { dependent_tin: "900000010" }, as: FraudAnalyst, captures: { confSt: "$.data[0].status", confRes: "$.data[0].resolution", confWhy: "$.data[0].resolved_reason" } }
          assert:
            - "captured caseSt == EXPIRED and attempts == 3 (link 1)"
            - "captured rtnBSt == FRAUD_CONFIRMED (link 2)"
            - "B's claim DISALLOWED by the fraud cascade (link 3)"
            - "captured confSt == RESOLVED, confRes == FIRST_FILER, confWhy == FRAUD_FORFEIT (link 4)"
            - "captured claimASt == SUSTAINED and TaxReturn.${rtnA}.claimed_refund_cents == 50000 (honest filer untouched; no double adjustment on the forfeited side)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: ip_pin_safety_beats_duplicate_constraint
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_IP_PIN_MISMATCH]
          - errors[ERR_DUPLICATE_RETURN]
        distinguishing_aspect: |
          Error-category pair business_safety (p7) vs business_constraint (p8): an enrolled
          taxpayer's second filing for the same tax_year carries a WRONG ip_pin, violating
          both ERR_IP_PIN_MISMATCH and ERR_DUPLICATE_RETURN; the safety check is earlier in
          the ordered validation table, so ERR_IP_PIN_MISMATCH wins.
        test_recipe:
          setup:
            - "Clock 2027-02-01; pass-through config (gray 1, hold 50, all weights 0) ACTIVE"
            - "Taxpayer enrolled for 2026 (pin issued); first 2026 return already filed with the correct pin and FILTER_PASSED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-02-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /identity-protection/filter-model-configs", payload: { model_version: "MV-PR1", w_victim_flagged: 0, w_refund_delta: 0, w_bank_product: 0, w_preparer_flagged: 0, w_dependent_conflict: 0, interaction_bonus: 0, gray_zone_threshold: 1, hold_threshold: 50 }, as: SystemAdmin, captures: { cfg: $.data.id } }
            - { call: "POST /identity-protection/filter-model-configs/${cfg}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000060", full_name: "Pri One", date_of_birth: "1977-11-11" }, as: SystemAdmin, captures: { tp: $.data.id } }
            - { call: "POST /identity-protection/taxpayers/${tp}/ip-pin-opt-in", payload: { tax_year: 2026 }, as: Taxpayer, as_user_id: "${tp}" }
            - { call: "GET /identity-protection/taxpayers/${tp}/protection-pins", payload: {}, as: SystemAdmin, captures: { pin: "$.data[0].pin_value" } }
            - { call: "POST /identity-protection/tax-returns", payload: { taxpayer_id: "${tp}", tax_year: 2026, filing_status: "SINGLE", claimed_refund_cents: 40000, ip_pin_submitted: "${pin}", bank_product: "NONE" }, as: Taxpayer, as_user_id: "${tp}", captures: { rtn1: $.data.id } }
          trigger:
            - { call: "POST /identity-protection/tax-returns", payload: { taxpayer_id: "${tp}", tax_year: 2026, filing_status: "SINGLE", claimed_refund_cents: 90000, ip_pin_submitted: "000000", bank_product: "NONE" }, as: Taxpayer, as_user_id: "${tp}", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_IP_PIN_MISMATCH (422) — the p7 safety check outranks the p8 duplicate constraint"
            - "the response is NOT ERR_DUPLICATE_RETURN even though (tin, 2026) already has a non-terminal return"
      - name: terminal_state_beats_amount_mismatch
        grounds:
          - validations[priority=6]
          - validations[priority=12]
          - errors[ERR_ALREADY_TERMINAL]
          - errors[ERR_DISBURSEMENT_AMOUNT_MISMATCH]
        distinguishing_aspect: |
          Different error-category pair than the IP PIN instance: state (p6) vs
          business_fiscal (p12). Releasing an already-RELEASED disbursement with a wrong
          expected_amount_cents violates both the terminal-state lock and the amount check;
          the state check fires first, so ERR_ALREADY_TERMINAL wins.
        test_recipe:
          setup:
            - "Clock 2027-05-01; pass-through config ACTIVE; taxpayer (prior 50000) files a 50000-cent NONE return -> FILTER_PASSED"
            - "Refund scheduled and released at the same clock instant (0 days late, interest 0, amount 50000)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /identity-protection/filter-model-configs", payload: { model_version: "MV-PR2", w_victim_flagged: 0, w_refund_delta: 0, w_bank_product: 0, w_preparer_flagged: 0, w_dependent_conflict: 0, interaction_bonus: 0, gray_zone_threshold: 1, hold_threshold: 50 }, as: SystemAdmin, captures: { cfg: $.data.id } }
            - { call: "POST /identity-protection/filter-model-configs/${cfg}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000061", full_name: "Pri Two", date_of_birth: "1978-12-12", prior_year_refund_cents: 50000 }, as: SystemAdmin, captures: { tp: $.data.id } }
            - { call: "POST /identity-protection/tax-returns", payload: { taxpayer_id: "${tp}", tax_year: 2026, filing_status: "SINGLE", claimed_refund_cents: 50000, bank_product: "NONE" }, as: Taxpayer, as_user_id: "${tp}", captures: { rtn: $.data.id } }
            - { call: "POST /identity-protection/tax-returns/${rtn}/release-refund", payload: {}, as: FraudAnalyst, captures: { disb: $.data.id } }
            - { call: "POST /identity-protection/refund-disbursements/${disb}/release", payload: { expected_amount_cents: 50000 }, as: SystemAdmin, captures: { stRel: $.data.status } }
          trigger:
            - { call: "POST /identity-protection/refund-disbursements/${disb}/release", payload: { expected_amount_cents: 1 }, as: SystemAdmin, captures: { err: $.data.error_id } }
          assert:
            - "captured stRel == RELEASED after the first release"
            - "captured err == ERR_ALREADY_TERMINAL (409) — p6 state outranks p12 fiscal"
            - "the response is NOT ERR_DISBURSEMENT_AMOUNT_MISMATCH even though expected_amount_cents 1 != computed 50000"

  - rule_id: boundary_precision_check
    instances:
      - name: interest_free_window_day45_exactly
        grounds:
          - calculations.refund_interest
          - errors[ERR_DISBURSEMENT_AMOUNT_MISMATCH]
        distinguishing_aspect: |
          Boundary on the days-late metric via the disbursement-release endpoint: releasing
          exactly 45 days after the anchor date (received 2027-05-01, released 2027-06-15)
          yields days_late == 0 and final interest exactly 0 — the free window is inclusive
          of day 45, so the >= crossing happens only on day 46.
        test_recipe:
          setup:
            - "Clock 2027-05-01; pass-through config ACTIVE; taxpayer (prior 100000) files a 100000-cent NONE return -> FILTER_PASSED; refund scheduled same day"
            - "Clock advanced to exactly 2027-06-15 (anchor + 45 days)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /identity-protection/filter-model-configs", payload: { model_version: "MV-B45", w_victim_flagged: 0, w_refund_delta: 0, w_bank_product: 0, w_preparer_flagged: 0, w_dependent_conflict: 0, interaction_bonus: 0, gray_zone_threshold: 1, hold_threshold: 50 }, as: SystemAdmin, captures: { cfg: $.data.id } }
            - { call: "POST /identity-protection/filter-model-configs/${cfg}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000070", full_name: "Day Fortyfive", date_of_birth: "1970-01-19", prior_year_refund_cents: 100000 }, as: SystemAdmin, captures: { tp: $.data.id } }
            - { call: "POST /identity-protection/tax-returns", payload: { taxpayer_id: "${tp}", tax_year: 2026, filing_status: "SINGLE", claimed_refund_cents: 100000, bank_product: "NONE" }, as: Taxpayer, as_user_id: "${tp}", captures: { rtn: $.data.id } }
            - { call: "POST /identity-protection/tax-returns/${rtn}/release-refund", payload: {}, as: FraudAnalyst, captures: { disb: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-06-15T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /identity-protection/refund-disbursements/${disb}/release", payload: { expected_amount_cents: 100000 }, as: SystemAdmin, captures: { fin: $.data.final_interest_cents, amt: $.data.amount_cents } }
          assert:
            - "captured fin == 0 (45 - 45 = 0 days late; day 45 is inside the free window)"
            - "captured amt == 100000"
            - "TaxReturn.${rtn}.status == REFUND_RELEASED"
      - name: score_exactly_at_hold_threshold
        grounds:
          - calculations.filter_risk_score
          - entities.FilterHold.fields.zone
        distinguishing_aspect: |
          Boundary on the integer risk-score metric via POST /tax-returns (a different metric
          and endpoint than the interest day count): score == hold_threshold (50) is held
          FULL because the tier test is >=, while score == 49 sits in GRAY and score == 0
          passes — three returns one point/threshold apart land in three different tiers.
        test_recipe:
          setup:
            - "Clock 2027-02-01; config MV-BND (w_bank_product 49, w_refund_delta 1, gray 10, hold 50) ACTIVE"
            - "Three taxpayers with prior_year_refund_cents 0"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-02-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /identity-protection/filter-model-configs", payload: { model_version: "MV-BND", w_victim_flagged: 0, w_refund_delta: 1, w_bank_product: 49, w_preparer_flagged: 0, w_dependent_conflict: 0, interaction_bonus: 0, gray_zone_threshold: 10, hold_threshold: 50 }, as: SystemAdmin, captures: { cfg: $.data.id } }
            - { call: "POST /identity-protection/filter-model-configs/${cfg}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000071", full_name: "Gray Zone", date_of_birth: "1991-02-20", prior_year_refund_cents: 0 }, as: SystemAdmin, captures: { tpG: $.data.id } }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000072", full_name: "Edge Held", date_of_birth: "1992-03-21", prior_year_refund_cents: 0 }, as: SystemAdmin, captures: { tpH: $.data.id } }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000073", full_name: "Clean Pass", date_of_birth: "1993-04-22", prior_year_refund_cents: 0 }, as: SystemAdmin, captures: { tpP: $.data.id } }
          trigger:
            - { call: "POST /identity-protection/tax-returns", payload: { taxpayer_id: "${tpG}", tax_year: 2026, filing_status: "SINGLE", claimed_refund_cents: 0, bank_product: "REFUND_TRANSFER", bank_account_fingerprint: "fp-g49" }, as: Taxpayer, as_user_id: "${tpG}", captures: { scoreG: $.data.risk_score, stG: $.data.status, rtnG: $.data.id } }
            - { call: "POST /identity-protection/tax-returns", payload: { taxpayer_id: "${tpH}", tax_year: 2026, filing_status: "SINGLE", claimed_refund_cents: 100000, bank_product: "REFUND_TRANSFER", bank_account_fingerprint: "fp-h50" }, as: Taxpayer, as_user_id: "${tpH}", captures: { scoreH: $.data.risk_score, stH: $.data.status, rtnH: $.data.id } }
            - { call: "POST /identity-protection/tax-returns", payload: { taxpayer_id: "${tpP}", tax_year: 2026, filing_status: "SINGLE", claimed_refund_cents: 0, bank_product: "NONE" }, as: Taxpayer, as_user_id: "${tpP}", captures: { scoreP: $.data.risk_score, stP: $.data.status } }
            - { call: "GET /identity-protection/tax-returns/${rtnG}/filter-holds", payload: {}, as: FraudAnalyst, captures: { zoneG: "$.data[0].zone" } }
            - { call: "GET /identity-protection/tax-returns/${rtnH}/filter-holds", payload: {}, as: FraudAnalyst, captures: { zoneH: "$.data[0].zone" } }
          assert:
            - "captured scoreG == 49 and stG == FILTER_HELD and zoneG == GRAY (49 >= gray 10 but < hold 50)"
            - "captured scoreH == 50 and stH == FILTER_HELD and zoneH == FULL (score == hold_threshold triggers on >=)"
            - "captured scoreP == 0 and stP == FILTER_PASSED"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: release_requires_verified_case
        grounds:
          - state_machines.TaxReturn.FILTER_HELD_to_REFUND_SCHEDULED
          - state_machines.IdentityVerificationCase.DOCS_SUBMITTED_to_VERIFIED
          - errors[ERR_VERIFICATION_INCOMPLETE]
        distinguishing_aspect: |
          Entity pair TaxReturn x IdentityVerificationCase: release-refund on a FILTER_HELD
          return is rejected while its case is merely DOCS_SUBMITTED, and succeeds only after
          the case's own transition to VERIFIED flips the return to FILTER_PASSED.
        test_recipe:
          setup:
            - "Clock 2027-02-01; config MV-X1 (w_bank_product 60, gray 25, hold 50) ACTIVE"
            - "Taxpayer files REFUND_TRANSFER -> FILTER_HELD FULL; ONLINE case opened, documents requested, both required docs (PHOTO_ID, PRIOR_YEAR_RETURN) submitted -> DOCS_SUBMITTED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-02-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /identity-protection/filter-model-configs", payload: { model_version: "MV-X1", w_victim_flagged: 0, w_refund_delta: 0, w_bank_product: 60, w_preparer_flagged: 0, w_dependent_conflict: 0, interaction_bonus: 0, gray_zone_threshold: 25, hold_threshold: 50 }, as: SystemAdmin, captures: { cfg: $.data.id } }
            - { call: "POST /identity-protection/filter-model-configs/${cfg}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000080", full_name: "Dep One", date_of_birth: "1984-05-23" }, as: SystemAdmin, captures: { tp: $.data.id } }
            - { call: "POST /identity-protection/tax-returns", payload: { taxpayer_id: "${tp}", tax_year: 2026, filing_status: "SINGLE", claimed_refund_cents: 70000, bank_product: "REFUND_TRANSFER", bank_account_fingerprint: "fp-x1" }, as: Taxpayer, as_user_id: "${tp}", captures: { rtn: $.data.id } }
            - { call: "POST /identity-protection/verification-cases", payload: { taxpayer_id: "${tp}", return_id: "${rtn}", channel: "ONLINE" }, as: VerificationAgent, captures: { case: $.data.id } }
            - { call: "POST /identity-protection/verification-cases/${case}/request-documents", payload: {}, as: VerificationAgent }
            - { call: "POST /identity-protection/verification-cases/${case}/documents", payload: { doc_type: "PHOTO_ID" }, as: Taxpayer, as_user_id: "${tp}" }
            - { call: "POST /identity-protection/verification-cases/${case}/documents", payload: { doc_type: "PRIOR_YEAR_RETURN" }, as: Taxpayer, as_user_id: "${tp}", captures: { docOk: $.data.id } }
          trigger:
            - { call: "POST /identity-protection/tax-returns/${rtn}/release-refund", payload: {}, as: FraudAnalyst, captures: { err: $.data.error_id } }
            - { call: "POST /identity-protection/verification-cases/${case}/verify", payload: {}, as: VerificationAgent, captures: { caseSt: $.data.status } }
            - { call: "POST /identity-protection/tax-returns/${rtn}/release-refund", payload: {}, as: FraudAnalyst, captures: { disb: $.data.id, disbSt: $.data.status } }
          assert:
            - "captured err == ERR_VERIFICATION_INCOMPLETE while the case is DOCS_SUBMITTED (not yet VERIFIED)"
            - "captured caseSt == VERIFIED"
            - "TaxReturn.${rtn}.status == FILTER_PASSED after verify (cross-entity auto-transition)"
            - "captured disbSt == SCHEDULED on the retry"
      - name: advocate_expedite_requires_held_return
        grounds:
          - state_machines.AdvocateCase.OPENED_to_EXPEDITED_REVIEW
          - errors[ERR_HARDSHIP_NOT_EXPEDITABLE]
        distinguishing_aspect: |
          Different entity pair — AdvocateCase x TaxReturn: expedite is gated on the linked
          return being FILTER_HELD; an advocate case pointing at a REFUND_RELEASED return is
          rejected, while one pointing at a FILTER_HELD return succeeds and flags the hold
          priority_review.
        test_recipe:
          setup:
            - "Clock 2027-02-01; config MV-X2 (w_bank_product 60, gray 25, hold 50) ACTIVE"
            - "Taxpayer R files a 20000-cent NONE return (prior 20000) -> FILTER_PASSED -> refund scheduled and released same day -> REFUND_RELEASED"
            - "Taxpayer H files a REFUND_TRANSFER return -> FILTER_HELD"
            - "Advocate cases opened for both (by advocate user adv-1)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-02-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /identity-protection/filter-model-configs", payload: { model_version: "MV-X2", w_victim_flagged: 0, w_refund_delta: 0, w_bank_product: 60, w_preparer_flagged: 0, w_dependent_conflict: 0, interaction_bonus: 0, gray_zone_threshold: 25, hold_threshold: 50 }, as: SystemAdmin, captures: { cfg: $.data.id } }
            - { call: "POST /identity-protection/filter-model-configs/${cfg}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000081", full_name: "Released R", date_of_birth: "1986-06-24", prior_year_refund_cents: 20000 }, as: SystemAdmin, captures: { tpR: $.data.id } }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000082", full_name: "Held H", date_of_birth: "1987-07-25" }, as: SystemAdmin, captures: { tpH: $.data.id } }
            - { call: "POST /identity-protection/tax-returns", payload: { taxpayer_id: "${tpR}", tax_year: 2026, filing_status: "SINGLE", claimed_refund_cents: 20000, bank_product: "NONE" }, as: Taxpayer, as_user_id: "${tpR}", captures: { rtnR: $.data.id } }
            - { call: "POST /identity-protection/tax-returns/${rtnR}/release-refund", payload: {}, as: FraudAnalyst, captures: { disbR: $.data.id } }
            - { call: "POST /identity-protection/refund-disbursements/${disbR}/release", payload: { expected_amount_cents: 20000 }, as: SystemAdmin }
            - { call: "POST /identity-protection/tax-returns", payload: { taxpayer_id: "${tpH}", tax_year: 2026, filing_status: "SINGLE", claimed_refund_cents: 60000, bank_product: "REFUND_TRANSFER", bank_account_fingerprint: "fp-x2" }, as: Taxpayer, as_user_id: "${tpH}", captures: { rtnH: $.data.id } }
            - { call: "POST /identity-protection/advocate-cases", payload: { taxpayer_id: "${tpR}", return_id: "${rtnR}", hardship_type: "MEDICAL" }, as: TaxpayerAdvocate, as_user_id: "adv-1", captures: { advR: $.data.id } }
            - { call: "POST /identity-protection/advocate-cases", payload: { taxpayer_id: "${tpH}", return_id: "${rtnH}", hardship_type: "EVICTION" }, as: TaxpayerAdvocate, as_user_id: "adv-1", captures: { advH: $.data.id } }
          trigger:
            - { call: "POST /identity-protection/advocate-cases/${advR}/expedite", payload: {}, as: TaxpayerAdvocate, as_user_id: "adv-1", captures: { err: $.data.error_id } }
            - { call: "POST /identity-protection/advocate-cases/${advH}/expedite", payload: {}, as: TaxpayerAdvocate, as_user_id: "adv-1", captures: { stH: $.data.status, expH: $.data.expedited } }
            - { call: "GET /identity-protection/tax-returns/${rtnH}/filter-holds", payload: {}, as: TaxpayerAdvocate, captures: { prio: "$.data[0].priority_review" } }
          assert:
            - "captured err == ERR_HARDSHIP_NOT_EXPEDITABLE (linked return REFUND_RELEASED, not FILTER_HELD)"
            - "captured stH == EXPEDITED_REVIEW and expH == true"
            - "captured prio == true (expedite flags the held return's FilterHold)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: office_capacity_aggregate_overlap
        grounds:
          - entities.ServiceOffice.fields.capacity
          - validations[priority=9]
          - errors[ERR_APPOINTMENT_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Aggregate-capacity interval semantics on the ServiceOffice resource: appointments
          occupy half-open [start_at, end_at) intervals, adjacency is allowed (an 11:00 start
          does not collide with an 11:00 end), and rejection happens only when some instant
          would reach capacity overlapping BOOKED appointments (third overlap into a
          capacity-2 office fails; the adjacent fourth succeeds).
        test_recipe:
          setup:
            - "Clock 2027-03-01; config MV-APPT (w_bank_product 60, gray 25, hold 50) ACTIVE"
            - "Taxpayer files REFUND_TRANSFER -> FILTER_HELD FULL; IN_PERSON case opened (FULL zone permits any channel)"
            - "Office OFC-1 with capacity 2"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-03-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /identity-protection/filter-model-configs", payload: { model_version: "MV-APPT", w_victim_flagged: 0, w_refund_delta: 0, w_bank_product: 60, w_preparer_flagged: 0, w_dependent_conflict: 0, interaction_bonus: 0, gray_zone_threshold: 25, hold_threshold: 50 }, as: SystemAdmin, captures: { cfg: $.data.id } }
            - { call: "POST /identity-protection/filter-model-configs/${cfg}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000090", full_name: "In Person", date_of_birth: "1974-01-30" }, as: SystemAdmin, captures: { tp: $.data.id } }
            - { call: "POST /identity-protection/tax-returns", payload: { taxpayer_id: "${tp}", tax_year: 2026, filing_status: "SINGLE", claimed_refund_cents: 30000, bank_product: "REFUND_TRANSFER", bank_account_fingerprint: "fp-appt" }, as: Taxpayer, as_user_id: "${tp}", captures: { rtn: $.data.id } }
            - { call: "POST /identity-protection/verification-cases", payload: { taxpayer_id: "${tp}", return_id: "${rtn}", channel: "IN_PERSON" }, as: VerificationAgent, captures: { case: $.data.id } }
            - { call: "POST /identity-protection/service-offices", payload: { office_code: "OFC-1", name: "Downtown TAC", capacity: 2 }, as: SystemAdmin, captures: { office: $.data.id } }
            - { call: "POST /identity-protection/service-offices/${office}/appointments", payload: { case_id: "${case}", start_at: "2027-03-02T10:00:00Z", end_at: "2027-03-02T11:00:00Z" }, as: VerificationAgent, captures: { apA: $.data.id } }
            - { call: "POST /identity-protection/service-offices/${office}/appointments", payload: { case_id: "${case}", start_at: "2027-03-02T10:30:00Z", end_at: "2027-03-02T11:30:00Z" }, as: VerificationAgent, captures: { apB: $.data.id } }
          trigger:
            - { call: "POST /identity-protection/service-offices/${office}/appointments", payload: { case_id: "${case}", start_at: "2027-03-02T10:45:00Z", end_at: "2027-03-02T11:15:00Z" }, as: VerificationAgent, captures: { errC: $.data.error_id } }
            - { call: "POST /identity-protection/service-offices/${office}/appointments", payload: { case_id: "${case}", start_at: "2027-03-02T11:00:00Z", end_at: "2027-03-02T12:00:00Z" }, as: VerificationAgent, captures: { apD: $.data.id } }
          assert:
            - "captured errC == ERR_APPOINTMENT_CAPACITY_EXCEEDED (at 10:45 three half-open intervals overlap in a capacity-2 office)"
            - "captured apD is created (11:00 start is adjacent to A's 11:00 end; half-open semantics keep the overlap count at 2)"
            - "GET office appointments lists 3 BOOKED rows (A, B, D)"
      - name: report_window_closed_interval_exclusion
        grounds:
          - validations[priority=9]
          - errors[ERR_ACTIVE_REPORT_WINDOW]
          - entities.IdentityTheftReport.fields.created_at
        distinguishing_aspect: |
          Different interval semantics and resource than the office instance: the Taxpayer
          resource carries a single-occupancy CLOSED review window [created_at, created_at +
          60 days] around each SUBMITTED report — a second report at day 31 and even exactly
          at day 60 is rejected (inclusive end), and only day 61 succeeds; contrast the
          half-open adjacency-allowed appointment semantics.
        test_recipe:
          setup:
            - "Clock 2027-01-15T00:00:00Z; taxpayer exists; taxpayer files a TAXPAYER_REPORT (SUBMITTED, window [01-15, 03-16] inclusive)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000091", full_name: "Win Dow", date_of_birth: "1972-02-14" }, as: SystemAdmin, captures: { tp: $.data.id } }
            - { call: "POST /identity-protection/taxpayers/${tp}/identity-theft-reports", payload: { source: "TAXPAYER_REPORT" }, as: Taxpayer, as_user_id: "${tp}", captures: { rep1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-02-15T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /identity-protection/taxpayers/${tp}/identity-theft-reports", payload: { source: "TAXPAYER_REPORT" }, as: Taxpayer, as_user_id: "${tp}", captures: { err31: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-03-16T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /identity-protection/taxpayers/${tp}/identity-theft-reports", payload: { source: "TAXPAYER_REPORT" }, as: Taxpayer, as_user_id: "${tp}", captures: { err60: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-03-17T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /identity-protection/taxpayers/${tp}/identity-theft-reports", payload: { source: "TAXPAYER_REPORT" }, as: Taxpayer, as_user_id: "${tp}", captures: { rep2: $.data.id } }
          assert:
            - "captured err31 == ERR_ACTIVE_REPORT_WINDOW (31 days into the 60-day window)"
            - "captured err60 == ERR_ACTIVE_REPORT_WINDOW (exactly day 60 — the window's closed end is inclusive)"
            - "captured rep2 is created at day 61 (first instant outside the closed window)"

  - rule_id: compensating_invariant
    instances:
      - name: pin_reissue_conserves_single_active
        grounds:
          - concurrency_rules[pin-reissue-stale-version]
          - state_machines.ProtectionPin.ACTIVE_to_SUPERSEDED
          - entities.ProtectionPin.fields.status
        distinguishing_aspect: |
          Conserved quantity: the count of ACTIVE ProtectionPins per (taxpayer, tax_year).
          The forward action (manual reissue creating a new ACTIVE pin) paired with its
          compensation (superseding the prior ACTIVE pin) leaves that count at exactly 1.
        test_recipe:
          setup:
            - "Clock 2027-01-25; taxpayer ENROLLED for 2026 with pin P1 ACTIVE"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-25T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000100", full_name: "Re Issue", date_of_birth: "1971-03-15" }, as: SystemAdmin, captures: { tp: $.data.id } }
            - { call: "POST /identity-protection/taxpayers/${tp}/ip-pin-opt-in", payload: { tax_year: 2026 }, as: Taxpayer, as_user_id: "${tp}", captures: { vNow: $.data.version } }
            - { call: "GET /identity-protection/taxpayers/${tp}/protection-pins", payload: {}, as: SystemAdmin, captures: { p1: "$.data[0].id", p1val: "$.data[0].pin_value" } }
          trigger:
            - { call: "POST /identity-protection/protection-pins", payload: { taxpayer_id: "${tp}", tax_year: 2026, expected_taxpayer_version: "${vNow}" }, as: SystemAdmin, captures: { p2: $.data.id, p2val: $.data.pin_value } }
            - { call: "GET /identity-protection/taxpayers/${tp}/protection-pins", payload: {}, as: SystemAdmin, captures: { pins: $.data } }
          assert:
            - "captured p2val != p1val (a fresh pin value was issued)"
            - "pin p1 status == SUPERSEDED and pin p2 status == ACTIVE"
            - "count of ACTIVE pins for (taxpayer, 2026) == 1 before and after the reissue — the invariant holds"
      - name: conflict_resolution_conserves_single_credit
        grounds:
          - calculations.dependent_conflict_adjustment
          - state_machines.DependentClaim.CONTESTED_to_SUSTAINED
          - state_machines.DependentConflict.OPEN_to_RESOLVED
        distinguishing_aspect: |
          Different conserved quantity than pins: the total allowed dependent credit per
          (dependent_tin, tax_year). The forward action (second claim admitted, both claims
          CONTESTED) paired with its compensation (analyst resolution disallowing the loser)
          restores exactly one SUSTAINED claim worth DEPENDENT_CREDIT_CENTS (200000); the
          loser's return absorbs adjustment_cents == -200000.
        test_recipe:
          setup:
            - "Clock 2027-02-01; pass-through config (gray 1, hold 50, w_dependent_conflict 0) ACTIVE"
            - "Taxpayer A files a 300000-cent return claiming dependent 900000011 (CLAIMED, FILTER_PASSED)"
            - "Taxpayer B files a 100000-cent return claiming the same dependent (conflict OPEN; both claims CONTESTED; B FILTER_PASSED)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-02-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /identity-protection/filter-model-configs", payload: { model_version: "MV-INV", w_victim_flagged: 0, w_refund_delta: 0, w_bank_product: 0, w_preparer_flagged: 0, w_dependent_conflict: 0, interaction_bonus: 0, gray_zone_threshold: 1, hold_threshold: 50 }, as: SystemAdmin, captures: { cfg: $.data.id } }
            - { call: "POST /identity-protection/filter-model-configs/${cfg}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000101", full_name: "Credit A", date_of_birth: "1969-04-16" }, as: SystemAdmin, captures: { tpA: $.data.id } }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000102", full_name: "Credit B", date_of_birth: "1970-05-17" }, as: SystemAdmin, captures: { tpB: $.data.id } }
            - { call: "POST /identity-protection/tax-returns", payload: { taxpayer_id: "${tpA}", tax_year: 2026, filing_status: "HEAD_OF_HOUSEHOLD", claimed_refund_cents: 300000, bank_product: "NONE", dependents: [{ dependent_tin: "900000011", relationship: "CHILD" }] }, as: Taxpayer, as_user_id: "${tpA}", captures: { rtnA: $.data.id } }
            - { call: "POST /identity-protection/tax-returns", payload: { taxpayer_id: "${tpB}", tax_year: 2026, filing_status: "HEAD_OF_HOUSEHOLD", claimed_refund_cents: 100000, bank_product: "NONE", dependents: [{ dependent_tin: "900000011", relationship: "CHILD" }] }, as: Taxpayer, as_user_id: "${tpB}", captures: { rtnB: $.data.id } }
            - { call: "GET /identity-protection/dependent-conflicts", payload: { dependent_tin: "900000011" }, as: FraudAnalyst, captures: { conf: "$.data[0].id" } }
          trigger:
            - { call: "POST /identity-protection/dependent-conflicts/${conf}/resolve", payload: { winner: "SECOND_FILER" }, as: FraudAnalyst, captures: { confSt: $.data.status, confRes: $.data.resolution } }
            - { call: "GET /identity-protection/tax-returns/${rtnA}", payload: {}, as: FraudAnalyst, captures: { claimedA: $.data.claimed_refund_cents, adjA: $.data.adjustment_cents } }
            - { call: "GET /identity-protection/tax-returns/${rtnA}/dependent-claims", payload: {}, as: FraudAnalyst, captures: { claimASt: "$.data[0].status" } }
            - { call: "GET /identity-protection/tax-returns/${rtnB}/dependent-claims", payload: {}, as: FraudAnalyst, captures: { claimBSt: "$.data[0].status" } }
          assert:
            - "captured confSt == RESOLVED and confRes == SECOND_FILER"
            - "captured claimASt == DISALLOWED and claimBSt == SUSTAINED"
            - "captured claimedA == 100000 and adjA == -200000 (exactly one DEPENDENT_CREDIT_CENTS removed)"
            - "exactly one SUSTAINED claim exists for (dependent_tin 900000011, tax_year 2026), so total allowed credit == 200000 == DEPENDENT_CREDIT_CENTS"
            - "TaxReturn.${rtnB}.claimed_refund_cents == 100000 (winner untouched)"
