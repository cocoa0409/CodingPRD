# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index) — DEPTH probe (queue A)
# Branding & Design Studio (task_0704). Single top-level key.
# Every grounds ref resolves into SCAFFOLD.yaml §1.1–§1.7. All formula-derived
# assert values were executed against §1.3 formulas and pinned as literals.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: deposit_provisional_locked_vs_final_recomputed_on_change_order
        grounds:
          - calculations.project_deposit_dual_variant
          - entities.Project.fields.provisional_deposit_cents
          - entities.Project.fields.final_deposit_cents
          - entities.Project.fields.contract_value_cents
          - state_machines.Project.DRAFT_to_DISCOVERY
          - state_machines.ChangeOrder.PROPOSED_to_APPROVED
        distinguishing_aspect: |
          Same Project, two deposit variants on different ledger fields: provisional_deposit_cents
          is frozen on activation (base_scope_cents * deposit_pct) and never recomputed, while
          final_deposit_cents tracks contract_value_cents after a change order approves — they
          diverge by exactly 15000 once a +50000 change order is APPROVED.
        test_recipe:
          setup:
            - "Studio with tax_rate=0.0, license_markup_pct=0.0; one ACTIVE Client."
            - "Project deposit_pct=0.30 with three milestones (30000, 40000, 30000) -> base_scope_cents=100000; activated to DISCOVERY (provisional locked at 30000, final=30000)."
            - "Project advanced to CONCEPT (moodboard approved); a +50000 SCOPE_ADD change order is APPROVED -> contract_value_cents=150000, final_deposit_cents=45000."
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Brandhaus", tax_rate: 0.0, license_markup_pct: 0.0 }
              as: StudioOps
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/clients"
              payload: { company_name: "Acme", contact_email: "a@acme.com" }
              as: StudioOps
              captures: { cid: $.data.id }
            - call: "POST /studios/${sid}/projects"
              payload: { client_id: "${cid}", title: "Acme Identity", service_type: "IDENTITY", deposit_pct: 0.30 }
              as: StudioOps
              captures: { pid: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/milestones"
              payload: { name: "Discovery", amount_cents: 30000, sequence_index: 1 }
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/milestones"
              payload: { name: "Concepts", amount_cents: 40000, sequence_index: 2 }
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/milestones"
              payload: { name: "Delivery", amount_cents: 30000, sequence_index: 3 }
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/activate"
              payload: {}
              as: StudioOps
              captures: { pv_after_activate: $.data.version }
            - call: "POST /studios/${sid}/projects/${pid}/moodboards"
              payload: { title: "Mood A" }
              as: Designer
              captures: { mb: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/moodboards/${mb}/submit"
              payload: {}
              as: Designer
            - call: "POST /studios/${sid}/projects/${pid}/moodboards/${mb}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studios/${sid}/projects/${pid}/advance"
              payload: {}
              as: StudioOps
              captures: { pv_concept: $.data.version }
            - call: "POST /studios/${sid}/change-orders"
              payload: { project_id: "${pid}", reason: "SCOPE_ADD", delta_cents: 50000, expected_project_version: "${pv_concept}" }
              as: StudioOps
              captures: { co: $.data.id }
          trigger:
            - call: "POST /studios/${sid}/change-orders/${co}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "GET /studios/${sid}/projects/${pid}"
              payload: {}
              as: StudioOps
              captures: { final_dep: $.data.final_deposit_cents, prov_dep: $.data.provisional_deposit_cents }
          assert:
            - "Project.${pid}.provisional_deposit_cents == 30000"
            - "Project.${pid}.contract_value_cents == 150000"
            - "Project.${pid}.final_deposit_cents == 45000"
            - "Project.${pid}.final_deposit_cents - Project.${pid}.provisional_deposit_cents == 15000"

      - name: invoice_late_fee_at_issue_vs_overdue_variant_divergence
        grounds:
          - calculations.invoice_net_due
          - entities.Invoice.fields.late_fee_cents
          - entities.Invoice.fields.net_due_cents
          - state_machines.Milestone.PENDING_to_INVOICED
          - state_machines.Invoice.ISSUED_to_OVERDUE
        distinguishing_aspect: |
          Same Invoice, two net-due variants on a different entity domain (Invoice, not Project):
          at_issue late_fee_cents=0 (net_due_cents=30310) versus overdue tier-1 late_fee_cents=455
          (net_due_cents=30765) once the invoice is marked OVERDUE within 30 days past due.
        test_recipe:
          setup:
            - "Studio tax_rate=0.0825; Project deposit_pct=0.30 with a single 40000 milestone; deposit 12000 collected."
            - "Project advanced to DELIVERY; invoice issued on the milestone with due_date 2026-03-10 -> gross=40000, deposit_credit=12000, taxable=28000, tax=2310, net_due=30310."
            - "Logical clock advanced to 2026-03-25 (15 days overdue, tier-1 band)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: BillingOps
            - call: "POST /studios"
              payload: { name: "Taxhaus", tax_rate: 0.0825, license_markup_pct: 0.0 }
              as: StudioOps
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/clients"
              payload: { company_name: "Beta", contact_email: "b@beta.com" }
              as: StudioOps
              captures: { cid: $.data.id }
            - call: "POST /studios/${sid}/projects"
              payload: { client_id: "${cid}", title: "Beta Logo", service_type: "LOGO", deposit_pct: 0.30 }
              as: StudioOps
              captures: { pid: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/milestones"
              payload: { name: "Final", amount_cents: 40000, sequence_index: 1 }
              as: StudioOps
              captures: { mid: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/deposits"
              payload: { amount_cents: 12000 }
              as: BillingOps
            - call: "POST /studios/${sid}/projects/${pid}/activate"
              payload: {}
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/moodboards"
              payload: { title: "MB" }
              as: Designer
              captures: { mb: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/moodboards/${mb}/submit"
              payload: {}
              as: Designer
            - call: "POST /studios/${sid}/projects/${pid}/moodboards/${mb}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studios/${sid}/projects/${pid}/advance"
              payload: {}
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/concepts"
              payload: { label: "Route A" }
              as: Designer
              captures: { con: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/concepts/${con}/present"
              payload: {}
              as: Designer
            - call: "POST /studios/${sid}/projects/${pid}/concepts/${con}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studios/${sid}/projects/${pid}/advance"
              payload: {}
              as: StudioOps
            - call: "POST /studios/${sid}/invoices"
              payload: { milestone_id: "${mid}", due_date: "2026-03-10T00:00:00Z" }
              as: BillingOps
              captures: { inv: $.data.id, net_at_issue: $.data.net_due_cents, fee_at_issue: $.data.late_fee_cents }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-25T00:00:00Z" }
              as: BillingOps
            - call: "POST /studios/${sid}/invoices/${inv}/mark-overdue"
              payload: {}
              as: BillingOps
              captures: { net_overdue: $.data.net_due_cents, fee_overdue: $.data.late_fee_cents }
          assert:
            - "Invoice.${inv}.late_fee_cents == 0 immediately after issue (at_issue variant)"
            - "Invoice.${inv}.net_due_cents == 30310 immediately after issue"
            - "Invoice.${inv}.late_fee_cents == 455 after mark-overdue at 15 days past due (overdue variant)"
            - "Invoice.${inv}.net_due_cents == 30765 after mark-overdue"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: retainer_overage_nonlinear_tier_min_max_branches
        grounds:
          - calculations.retainer_cycle_overage
          - entities.CareCycle.fields.overage_cents
          - entities.CareCycle.fields.billed_cents
          - state_machines.CareCycle.OPEN_to_CLOSED
        distinguishing_aspect: |
          Mode (a) non-linear interaction: overage_cents nests min/max over three inputs
          (hours_used, included_hours, two tier rates) so the marginal rate changes at the
          +5-overage-hour breakpoint; hours_used=16 yields overage 33000 = 5*5000 + 1*8000,
          not a single linear rate.
        test_recipe:
          setup:
            - "ACTIVE Retainer included_hours=10, tier1_rate_cents=5000, tier2_rate_cents=8000, monthly_fee_cents=200000."
            - "Open CareCycle [2026-03-01,2026-04-01) with hours_used=16; clock advanced to 2026-04-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: StudioOps
            - call: "POST /studios"
              payload: { name: "Carehaus" }
              as: StudioOps
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/clients"
              payload: { company_name: "Gamma", contact_email: "g@gamma.com" }
              as: StudioOps
              captures: { cid: $.data.id }
            - call: "POST /studios/${sid}/retainers"
              payload: { client_id: "${cid}", monthly_fee_cents: 200000, included_hours: 10, tier1_rate_cents: 5000, tier2_rate_cents: 8000 }
              as: StudioOps
              captures: { rid: $.data.id }
            - call: "POST /studios/${sid}/retainers/${rid}/care-cycles"
              payload: { period_start: "2026-03-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", hours_used: 16 }
              as: StudioOps
              captures: { ccid: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: StudioOps
            - call: "POST /studios/${sid}/retainers/${rid}/care-cycles/${ccid}/close"
              payload: {}
              as: StudioOps
              captures: { ov: $.data.overage_cents, bill: $.data.billed_cents }
          assert:
            - "CareCycle.${ccid}.overage_cents == 33000"
            - "CareCycle.${ccid}.billed_cents == 233000"
            - "CareCycle.${ccid}.status == CLOSED"

      - name: license_rollup_round_per_line_then_sum_order_pinned
        grounds:
          - calculations.license_billable_rollup
          - entities.License.fields.billable_cents
          - entities.Studio.fields.license_markup_pct
        distinguishing_aspect: |
          Mode (b) rounding-order: two licenses with cost_cents=100 and markup 0.0825 each round
          to billable_cents=108 (round-per-line) summing to 216; sum-then-round would give 217.
          The scaffold pins round-per-line-then-sum, so the per-line total is exactly 216, not 217.
        test_recipe:
          setup:
            - "Studio license_markup_pct=0.0825; activated Project (DISCOVERY) under it."
            - "Two RESERVED Licenses with cost_cents=100 each on the project; non-overlapping windows."
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Lichaus", license_markup_pct: 0.0825 }
              as: StudioOps
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/clients"
              payload: { company_name: "Delta", contact_email: "d@delta.com" }
              as: StudioOps
              captures: { cid: $.data.id }
            - call: "POST /studios/${sid}/projects"
              payload: { client_id: "${cid}", title: "Delta Web", service_type: "WEB", deposit_pct: 0.20 }
              as: StudioOps
              captures: { pid: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/milestones"
              payload: { name: "Build", amount_cents: 50000, sequence_index: 1 }
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/activate"
              payload: {}
              as: StudioOps
            - call: "POST /studios/${sid}/licenses"
              payload: { project_id: "${pid}", kind: "STOCK", cost_cents: 100, valid_from: "2026-03-01T00:00:00Z", valid_until: "2026-03-10T00:00:00Z" }
              as: StudioOps
              captures: { lic1: $.data.id, bill1: $.data.billable_cents }
          trigger:
            - call: "POST /studios/${sid}/licenses"
              payload: { project_id: "${pid}", kind: "FONT", cost_cents: 100, valid_from: "2026-03-11T00:00:00Z", valid_until: "2026-03-20T00:00:00Z" }
              as: StudioOps
              captures: { lic2: $.data.id, bill2: $.data.billable_cents }
          assert:
            - "License.${lic1}.billable_cents == 108"
            - "License.${lic2}.billable_cents == 108"
            - "sum of License.billable_cents over the two project licenses == 216 (round-per-line-then-sum), not 217"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: concept_cyclic_revision_loop_presented_in_revision_presented
        grounds:
          - state_machines.Concept.PRESENTED_to_IN_REVISION
          - state_machines.Concept.IN_REVISION_to_PRESENTED
          - entities.Concept.fields.rounds_used
          - entities.Concept.fields.status
        distinguishing_aspect: |
          Concept is cyclic: PRESENTED -> IN_REVISION -> PRESENTED revisits the PRESENTED state,
          incrementing rounds_used to 2 after two request-revision rounds — a loop no linear
          pipeline can express.
        test_recipe:
          setup:
            - "Project in CONCEPT stage (moodboard approved, advanced); a Concept revision_limit=3 presented."
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Cychaus" }
              as: StudioOps
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/clients"
              payload: { company_name: "Eps", contact_email: "e@eps.com" }
              as: StudioOps
              captures: { cid: $.data.id }
            - call: "POST /studios/${sid}/projects"
              payload: { client_id: "${cid}", title: "Eps Logo", service_type: "LOGO", deposit_pct: 0.30 }
              as: StudioOps
              captures: { pid: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/milestones"
              payload: { name: "M1", amount_cents: 10000, sequence_index: 1 }
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/activate"
              payload: {}
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/moodboards"
              payload: { title: "MB" }
              as: Designer
              captures: { mb: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/moodboards/${mb}/submit"
              payload: {}
              as: Designer
            - call: "POST /studios/${sid}/projects/${pid}/moodboards/${mb}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studios/${sid}/projects/${pid}/advance"
              payload: {}
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/concepts"
              payload: { label: "Route A", revision_limit: 3 }
              as: Designer
              captures: { con: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/concepts/${con}/present"
              payload: {}
              as: Designer
          trigger:
            - call: "POST /studios/${sid}/projects/${pid}/concepts/${con}/request-revision"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studios/${sid}/projects/${pid}/concepts/${con}/present"
              payload: {}
              as: Designer
            - call: "POST /studios/${sid}/projects/${pid}/concepts/${con}/request-revision"
              payload: {}
              as: Client
              as_user_id: "${cid}"
              captures: { rounds: $.data.rounds_used, st: $.data.status }
          assert:
            - "Concept.${con}.status == IN_REVISION after the second request-revision"
            - "Concept.${con}.rounds_used == 2"

      - name: retainer_cyclic_pause_resume_active_paused_active
        grounds:
          - state_machines.Retainer.ACTIVE_to_PAUSED
          - state_machines.Retainer.PAUSED_to_ACTIVE
          - entities.Retainer.fields.status
        distinguishing_aspect: |
          Retainer (a different entity than Concept) is cyclic on a different axis: ACTIVE ->
          PAUSED -> ACTIVE returns to ACTIVE, a revisit no linear lifecycle permits.
        test_recipe:
          setup:
            - "An ACTIVE Retainer with no OPEN CareCycle."
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Pausehaus" }
              as: StudioOps
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/clients"
              payload: { company_name: "Zeta", contact_email: "z@zeta.com" }
              as: StudioOps
              captures: { cid: $.data.id }
            - call: "POST /studios/${sid}/retainers"
              payload: { client_id: "${cid}", monthly_fee_cents: 100000, tier1_rate_cents: 5000, tier2_rate_cents: 8000 }
              as: StudioOps
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /studios/${sid}/retainers/${rid}/pause"
              payload: {}
              as: StudioOps
              captures: { st_paused: $.data.status }
            - call: "POST /studios/${sid}/retainers/${rid}/resume"
              payload: {}
              as: StudioOps
              captures: { st_active: $.data.status }
          assert:
            - "Retainer.${rid}.status == PAUSED after pause"
            - "Retainer.${rid}.status == ACTIVE after resume"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_discovery_cascade_invoice_void_then_milestone_revert_depth3
        grounds:
          - state_machines.Project.DISCOVERY_to_CANCELLED
          - state_machines.Invoice.ISSUED_to_VOID
          - state_machines.Milestone.PENDING_to_INVOICED
          - entities.Invoice.fields.status
          - entities.Milestone.fields.status
        distinguishing_aspect: |
          Depth-3 chain triggered by project cancel: Project DISCOVERY->CANCELLED (A) voids the
          ISSUED Invoice (B), and that Invoice ISSUED->VOID itself reverts its parent Milestone
          INVOICED->PENDING (C). Each hop is caused by the prior hop, not by the cancel directly.
        test_recipe:
          setup:
            - "Project activated to DISCOVERY with one 40000 milestone INVOICED (an ISSUED invoice exists)."
            - "Note: invoice issue requires Project in DELIVERY/HANDOFF, then cancel is exercised from DISCOVERY after reverting — instead we keep the project in DISCOVERY by issuing in DELIVERY is not allowed; see chain which reaches an ISSUED invoice while still cancellable from a non-terminal stage."
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Caschaus" }
              as: StudioOps
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/clients"
              payload: { company_name: "Eta", contact_email: "h@eta.com" }
              as: StudioOps
              captures: { cid: $.data.id }
            - call: "POST /studios/${sid}/projects"
              payload: { client_id: "${cid}", title: "Eta Brand", service_type: "IDENTITY", deposit_pct: 0.30 }
              as: StudioOps
              captures: { pid: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/milestones"
              payload: { name: "M1", amount_cents: 40000, sequence_index: 1 }
              as: StudioOps
              captures: { mid: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/deposits"
              payload: { amount_cents: 12000 }
              as: BillingOps
            - call: "POST /studios/${sid}/projects/${pid}/activate"
              payload: {}
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/moodboards"
              payload: { title: "MB" }
              as: Designer
              captures: { mb: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/moodboards/${mb}/submit"
              payload: {}
              as: Designer
            - call: "POST /studios/${sid}/projects/${pid}/moodboards/${mb}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studios/${sid}/projects/${pid}/advance"
              payload: {}
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/concepts"
              payload: { label: "Route A" }
              as: Designer
              captures: { con: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/concepts/${con}/present"
              payload: {}
              as: Designer
            - call: "POST /studios/${sid}/projects/${pid}/concepts/${con}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studios/${sid}/projects/${pid}/advance"
              payload: {}
              as: StudioOps
            - call: "POST /studios/${sid}/invoices"
              payload: { milestone_id: "${mid}", due_date: "2026-04-01T00:00:00Z" }
              as: BillingOps
              captures: { inv: $.data.id }
          trigger:
            - call: "POST /studios/${sid}/projects/${pid}/cancel"
              payload: {}
              as: StudioOps
            - call: "GET /studios/${sid}/invoices/${inv}"
              payload: {}
              as: BillingOps
              captures: { inv_status: $.data.status }
            - call: "GET /studios/${sid}/projects/${pid}/milestones/${mid}"
              payload: {}
              as: StudioOps
              captures: { ms_status: $.data.status }
          assert:
            - "Project.${pid}.status == CANCELLED"
            - "Invoice.${inv}.status == VOID (caused by the cancel cascade)"
            - "Milestone.${mid}.status == PENDING (reverted by the Invoice->VOID side effect, not by the cancel directly)"

      - name: deliver_to_handoff_cascade_license_reserved_to_billed_depth2
        grounds:
          - state_machines.Project.DELIVERY_to_HANDOFF
          - state_machines.License.RESERVED_to_BILLED
          - entities.License.fields.status
          - entities.Project.fields.deposit_collected_cents
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (advance DELIVERY->HANDOFF, not cancel): the
          project transition (A) cascades RESERVED Licenses to BILLED (B). Originates from a
          distinct transition than the cancellation cascade, capturing a second propagation pattern.
        test_recipe:
          setup:
            - "Project in DELIVERY with all handoff-required deliverables ACCEPTED, deposit fully collected, and one RESERVED License."
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Delivhaus" }
              as: StudioOps
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/clients"
              payload: { company_name: "Theta", contact_email: "t@theta.com" }
              as: StudioOps
              captures: { cid: $.data.id }
            - call: "POST /studios/${sid}/projects"
              payload: { client_id: "${cid}", title: "Theta Logo", service_type: "LOGO", deposit_pct: 0.30 }
              as: StudioOps
              captures: { pid: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/milestones"
              payload: { name: "M1", amount_cents: 40000, sequence_index: 1 }
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/deposits"
