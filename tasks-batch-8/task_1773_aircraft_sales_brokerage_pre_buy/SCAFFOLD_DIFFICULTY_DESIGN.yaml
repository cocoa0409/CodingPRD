              as: ListingAgent
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2013, sale_price_usd: 3980000.55, sale_date: "2026-03-02", total_time_hours: 3100, comp_status: "UNVERIFIED" }
              as: ListingAgent
          trigger:
            - call: "POST /api/listings/${lst_id}/valuation"
              payload: { variant: "FINAL" }
              as: ListingAgent
              captures: { err: $.data.error_id }
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2015, sale_price_usd: 3900000.00, sale_date: "2026-04-01", total_time_hours: 2900, comp_status: "VERIFIED" }
              as: ListingAgent
            - call: "POST /api/listings/${lst_id}/valuation"
              payload: { variant: "FINAL" }
              as: ListingAgent
          assert:
            - "trigger[0] fails: data.error_id == ERR_INSUFFICIENT_COMPARABLES, HTTP 422 (UNVERIFIED comp excluded from input set)"
            - "trigger[2] succeeds: data.market_value_estimate_usd == 4121832.43 and data.valuation_status == FINAL"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: loi_submit_requires_active_listing
        grounds:
          - state_machines.LOI.SUBMITTED_to_ACCEPTED
          - validations[priority=5]
          - errors[ERR_LISTING_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair LOI -> Listing: POST /api/lois is rejected while the
          referenced Listing is DRAFT and succeeds once the same Listing is
          ACTIVE — the LOI's creatability depends on Listing state.
        test_recipe:
          setup:
            - "Listing in DRAFT (FINAL valuation computed but not yet activated); QUALIFIED buyer budget 3000000.00"
          setup_api_calls:
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2014, sale_price_usd: 4123456.05, sale_date: "2026-01-20", total_time_hours: 3001, comp_status: "VERIFIED" }
              as: ListingAgent
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2016, sale_price_usd: 4350000.00, sale_date: "2026-02-11", total_time_hours: 2850, comp_status: "VERIFIED" }
              as: ListingAgent
