              as: ApplicationEngineer
          assert:
            - "ToolOrder.${order_500}.per_unit_net_cents == 4244 (round_half_up(4550 * 1.06 * 0.88) = round_half_up(4244.24))"
            - "ToolOrder.${order_500}.total_price_cents == 2122000, not the 2122120 produced by rounding the total once"
            - "ToolOrder.${order_499}.per_unit_net_cents == 4485 (the 100-tier discount of 0.07, since 499 < 500)"
            - "ToolOrder.${order_499}.total_price_cents == 2238015"
            - "both orders reach status SUBMITTED and ToolProduct.${product_id}.open_order_units == 999"

      - name: recondition_rebate_is_paid_once_on_return_and_consumes_the_reservation
        claim_type: correct_result
        grounds:
          - calculations.recondition_rebate
          - calculations.recondition_life_extension
          - calculations.wheel_life_consumption
          - state_machines.ReconditionJob
        distinguishing_aspect: "The money path uses only the RESIDUAL_GEOMETRY percentage: an 8-regrind tool rated at 20.0% pays 12 * 900 * 0.20 = 2160 cents on return, the 22200-cent intake reservation is consumed rather than refunded, and the warranted 35.0% never touches the ledger."
        test_recipe:
          setup:
            - "Regrindable product EM-10-1 (SOLID_CARBIDE_ENDMILL, nominal 100.0, min regrind 70.0, step 2.5, 20 grind units per tool)"
            - "Customer CU-4 ACTIVE with regrind_credit_cents 50000, wheel WH-4 AVAILABLE with initial_life_units 100000"
          setup_api_calls:
            - call: "POST /tooling/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProductionPlanner
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-K10", target_workpiece_group: "K", co_binder_pct: 6.0, wc_grain_um: 0.8, hardness_hv: 1750, trs_mpa: 1900 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
            - call: "POST /tooling/insert-geometries"
              payload: { geometry_code: "EM-4F-30", iso_designation: "EM10-4F", application_class: "MEDIUM", chipbreaker_code: "NONE", rake_angle_deg: 10.0, nose_radius_mm: 0.5, max_depth_of_cut_mm: 10.0, edge_prep: "SHARP" }
              as: GeometryEngineer
              captures: { geometry_id: $.data.id }
            - call: "POST /tooling/tool-products"
              payload: { sku: "EM-10-1", order_class: "CATALOG", grade_id: "${grade_id}", geometry_id: "${geometry_id}", tool_type: "SOLID_CARBIDE_ENDMILL", list_price_cents: 12000, min_order_qty: 1, nominal_length_mm: 100.0, min_regrind_length_mm: 70.0, regrind_step_mm: 2.5, grind_units_per_tool: 20 }
              as: GeometryEngineer
              captures: { product_id: $.data.id }
            - call: "POST /tooling/grinding-wheels"
              payload: { wheel_code: "WH-4", spec_code: "D64-C100", initial_life_units: 100000 }
              as: ProductionPlanner
              captures: { wheel_id: $.data.id }
            - call: "POST /tooling/customers"
              payload: { customer_code: "CU-4", name: "Delta Cutter Service", tier: "STANDARD", regrind_credit_cents: 50000 }
              as: ProductionPlanner
              captures: { customer_id: $.data.id }
            - call: "GET /tooling/customers/${customer_id}"
              as: ProductionPlanner
              captures: { c_ver: $.data.version }
          trigger:
            - call: "POST /tooling/recondition-jobs"
              payload: { customer_id: "${customer_id}", product_id: "${product_id}", job_code: "RJ-1", units_received: 12, expected_customer_version: "${c_ver}" }
              as: ProductionPlanner
              captures: { job_id: $.data.id }
            - call: "POST /tooling/recondition-jobs/${job_id}/inspect"
              payload: { units_inspected: 12, measured_length_mm: 90.0, measured_corner_wear_um: 120.0 }
              as: ProductionPlanner
            - call: "POST /tooling/recondition-jobs/${job_id}/refurbish"
              payload: { wheel_id: "${wheel_id}", recoat_applied: false }
              as: ProductionPlanner
            - call: "POST /tooling/recondition-jobs/${job_id}/return"
              payload: { units_returned: 12 }
              as: ProductionPlanner
          assert:
            - "at intake: Customer regrind_credit_cents == 27800 and reserved_credit_cents == 22200 (12 * 1850)"
            - "after inspect: ReconditionJob remaining_regrinds == 8, life_extension_pct == 20.0, warranted_life_extension_pct == 35.0, scrap_recommended == false"
            - "after refurbish: GrindingWheel consumed_life_units == 240 (12 * 20) and status is still AVAILABLE"
            - "after return: ReconditionJob status == RETURNED, rebate_cents == 2160, reserved_credit_cents == 0"
            - "after return: Customer regrind_credit_cents == 29960 (27800 + 2160), so the reservation is consumed and never refunded"
            - "the warranted 35.0% appears nowhere in the ledger arithmetic"

  # ===========================================================================
  - section: validations
    instances:

      - name: window_ordering_is_checked_before_the_past_window_rule
        claim_type: priority_conflict
        grounds:
          - validations[priority=25]
          - validations[priority=26]
          - errors.ERR_INVALID_WINDOW
          - errors.ERR_WINDOW_IN_PAST
        distinguishing_aspect: "A window that is both reversed and in the past violates rules 25 and 26 at once and must surface ERR_INVALID_WINDOW; a well-ordered window that merely starts before the logical clock surfaces ERR_WINDOW_IN_PAST, and a window starting exactly at the current instant is accepted."
        test_recipe:
          setup:
            - "Logical clock at the default 2026-08-01T00:00:00Z"
            - "One coating recipe PVD-TIALN-3"
          setup_api_calls:
            - call: "POST /tooling/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProductionPlanner
            - call: "POST /tooling/coating-recipes"
              payload: { recipe_code: "PVD-TIALN-3", deposition_type: "PVD", layers: [{ material: "TiAlN", thickness_um: 3.0 }] }
              as: CoatingEngineer
              captures: { recipe_id: $.data.id }
          trigger:
            - call: "POST /tooling/coating-runs"
              payload: { recipe_id: "${recipe_id}", chamber_id: "CH1", window_start: "2026-07-30T12:00:00Z", window_end: "2026-07-30T06:00:00Z", loaded_area_cm2: 1000.00 }
              as: CoatingEngineer
              captures: { err_both: $.data.error_id }
            - call: "POST /tooling/coating-runs"
              payload: { recipe_id: "${recipe_id}", chamber_id: "CH1", window_start: "2026-07-31T23:59:59Z", window_end: "2026-08-02T06:00:00Z", loaded_area_cm2: 1000.00 }
              as: CoatingEngineer
              captures: { err_past: $.data.error_id }
            - call: "POST /tooling/coating-runs"
              payload: { recipe_id: "${recipe_id}", chamber_id: "CH1", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T06:00:00Z", loaded_area_cm2: 1000.00 }
              as: CoatingEngineer
              captures: { run_id: $.data.id }
          assert:
            - "${err_both} == ERR_INVALID_WINDOW, not ERR_WINDOW_IN_PAST (priority 25 precedes 26)"
            - "${err_past} == ERR_WINDOW_IN_PAST and HTTP status == 422"
            - "the third call succeeds: CoatingRun.${run_id}.status == SCHEDULED (window_start exactly at now is not in the past)"
            - "an equal window_start and window_end also yields ERR_INVALID_WINDOW because the rule is >=, not >"

      - name: business_codes_are_unique_per_collection
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors.ERR_DUPLICATE_CODE
        distinguishing_aspect: "Uniqueness is scoped per collection, not globally: a second grade with grade_code WC-P25 is rejected, while a geometry that happens to use the string WC-P25 as its geometry_code is accepted."
        test_recipe:
          setup:
            - "One grade WC-P25"
          setup_api_calls:
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-P25", target_workpiece_group: "P", co_binder_pct: 6.0, wc_grain_um: 1.2, hardness_hv: 1600, trs_mpa: 2100 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
          trigger:
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-P25", target_workpiece_group: "M", co_binder_pct: 10.0, wc_grain_um: 1.5, hardness_hv: 1450, trs_mpa: 2600 }
              as: MetallurgyEngineer
              captures: { err_dup: $.data.error_id }
            - call: "POST /tooling/insert-geometries"
              payload: { geometry_code: "WC-P25", iso_designation: "CNMG120408", application_class: "MEDIUM", chipbreaker_code: "MM", rake_angle_deg: 12.0, nose_radius_mm: 0.8, max_depth_of_cut_mm: 4.0, edge_prep: "HONED" }
              as: GeometryEngineer
              captures: { geometry_id: $.data.id }
          assert:
            - "${err_dup} == ERR_DUPLICATE_CODE and HTTP status == 409"
            - "only one CarbideGrade row exists with grade_code WC-P25 and its target_workpiece_group is still P"
            - "InsertGeometry.${geometry_id} is created successfully with geometry_code WC-P25"

      - name: special_product_derivation_rules
        claim_type: conditional_validation
        grounds:
          - validations[priority=22]
          - errors.ERR_INVALID_PRODUCT_DERIVATION
          - entities.ToolProduct.fields.base_catalog_product_id
        distinguishing_aspect: "The derivation rule applies only to SPECIAL products: omitting base_catalog_product_id is rejected, chaining a SPECIAL onto another SPECIAL is rejected (one derivation level only), and a CATALOG product that omits the field is accepted."
        test_recipe:
          setup:
            - "Grade WC-P25 DRAFT, geometry CNMG-MM DRAFT, one CATALOG product and one valid SPECIAL product derived from it"
          setup_api_calls:
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-P25", target_workpiece_group: "P", co_binder_pct: 6.0, wc_grain_um: 1.2, hardness_hv: 1600, trs_mpa: 2100 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
            - call: "POST /tooling/insert-geometries"
              payload: { geometry_code: "CNMG-MM", iso_designation: "CNMG120408", application_class: "MEDIUM", chipbreaker_code: "MM", rake_angle_deg: 12.0, nose_radius_mm: 0.8, max_depth_of_cut_mm: 4.0, edge_prep: "HONED" }
              as: GeometryEngineer
              captures: { geometry_id: $.data.id }
            - call: "POST /tooling/tool-products"
              payload: { sku: "CAT-INS-1", order_class: "CATALOG", grade_id: "${grade_id}", geometry_id: "${geometry_id}", tool_type: "INSERT", list_price_cents: 4550, min_order_qty: 25, nominal_length_mm: 12.7, min_regrind_length_mm: 12.7, regrind_step_mm: 0.5, grind_units_per_tool: 20 }
              as: GeometryEngineer
              captures: { catalog_id: $.data.id }
            - call: "POST /tooling/tool-products"
              payload: { sku: "SPC-INS-1", order_class: "SPECIAL", grade_id: "${grade_id}", geometry_id: "${geometry_id}", base_catalog_product_id: "${catalog_id}", tool_type: "INSERT", list_price_cents: 6100, min_order_qty: 5, nominal_length_mm: 12.7, min_regrind_length_mm: 12.7, regrind_step_mm: 0.5, grind_units_per_tool: 20 }
              as: ApplicationEngineer
              captures: { special_id: $.data.id }
          trigger:
            - call: "POST /tooling/tool-products"
              payload: { sku: "SPC-NOBASE", order_class: "SPECIAL", grade_id: "${grade_id}", geometry_id: "${geometry_id}", tool_type: "INSERT", list_price_cents: 6100, min_order_qty: 5, nominal_length_mm: 12.7, min_regrind_length_mm: 12.7, regrind_step_mm: 0.5, grind_units_per_tool: 20 }
              as: ApplicationEngineer
              captures: { err_nobase: $.data.error_id }
            - call: "POST /tooling/tool-products"
              payload: { sku: "SPC-CHAIN", order_class: "SPECIAL", grade_id: "${grade_id}", geometry_id: "${geometry_id}", base_catalog_product_id: "${special_id}", tool_type: "INSERT", list_price_cents: 6400, min_order_qty: 5, nominal_length_mm: 12.7, min_regrind_length_mm: 12.7, regrind_step_mm: 0.5, grind_units_per_tool: 20 }
              as: ApplicationEngineer
              captures: { err_chain: $.data.error_id }
            - call: "POST /tooling/tool-products"
              payload: { sku: "CAT-INS-2", order_class: "CATALOG", grade_id: "${grade_id}", geometry_id: "${geometry_id}", tool_type: "INSERT", list_price_cents: 4600, min_order_qty: 25, nominal_length_mm: 12.7, min_regrind_length_mm: 12.7, regrind_step_mm: 0.5, grind_units_per_tool: 20 }
              as: GeometryEngineer
              captures: { catalog2_id: $.data.id }
          assert:
            - "${err_nobase} == ERR_INVALID_PRODUCT_DERIVATION and HTTP status == 422"
            - "${err_chain} == ERR_INVALID_PRODUCT_DERIVATION"
            - "ToolProduct.${catalog2_id} is created with base_catalog_product_id == null"
            - "no ToolProduct row exists with sku SPC-NOBASE or SPC-CHAIN"

      - name: unit_counts_must_reconcile_on_every_counting_endpoint
        claim_type: violation_to_error
        grounds:
          - validations[priority=33]
          - errors.ERR_UNIT_COUNT_MISMATCH
        distinguishing_aspect: "The same error guards three different arithmetic identities on three different endpoints: sintered + scrap must equal pressed, produced + scrap must equal planned, and units_inspected may not exceed units_received."
        test_recipe:
          setup:
            - "Grade WC-K10 with batch BLD-1 pressed to 200 units; product EM-10-1 with a SCHEDULED run of 5 planned units whose window has elapsed; customer CU-5 with 50000 credit"
          setup_api_calls:
            - call: "POST /tooling/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProductionPlanner
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-K10", target_workpiece_group: "K", co_binder_pct: 6.0, wc_grain_um: 0.8, hardness_hv: 1750, trs_mpa: 1900 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
            - call: "POST /tooling/powder-blend-batches"
              payload: { grade_id: "${grade_id}", batch_code: "BLD-1", planned_mass_kg: 120.0 }
              as: MetallurgyEngineer
              captures: { batch_id: $.data.id }
            - call: "POST /tooling/powder-blend-batches/${batch_id}/press"
              payload: { pressed_units: 200 }
              as: MetallurgyEngineer
            - call: "POST /tooling/insert-geometries"
              payload: { geometry_code: "EM-4F-30", iso_designation: "EM10-4F", application_class: "MEDIUM", chipbreaker_code: "NONE", rake_angle_deg: 10.0, nose_radius_mm: 0.5, max_depth_of_cut_mm: 10.0, edge_prep: "SHARP" }
              as: GeometryEngineer
              captures: { geometry_id: $.data.id }
            - call: "POST /tooling/tool-products"
              payload: { sku: "EM-10-1", order_class: "CATALOG", grade_id: "${grade_id}", geometry_id: "${geometry_id}", tool_type: "SOLID_CARBIDE_ENDMILL", list_price_cents: 12000, min_order_qty: 1, nominal_length_mm: 100.0, min_regrind_length_mm: 70.0, regrind_step_mm: 2.5, grind_units_per_tool: 20 }
              as: GeometryEngineer
              captures: { product_id: $.data.id }
            - call: "POST /tooling/grinding-wheels"
              payload: { wheel_code: "WH-5", spec_code: "D64-C100", initial_life_units: 100000 }
              as: ProductionPlanner
              captures: { wheel_id: $.data.id }
            - call: "POST /tooling/grinding-runs"
              payload: { wheel_id: "${wheel_id}", product_id: "${product_id}", cell_id: "CELL_A", window_start: "2026-08-14T06:00:00Z", window_end: "2026-08-14T08:00:00Z", planned_units: 5 }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
            - call: "POST /tooling/customers"
              payload: { customer_code: "CU-5", name: "Epsilon Machining", tier: "STANDARD", regrind_credit_cents: 50000 }
              as: ProductionPlanner
              captures: { customer_id: $.data.id }
            - call: "GET /tooling/customers/${customer_id}"
              as: ProductionPlanner
              captures: { c_ver: $.data.version }
            - call: "POST /tooling/recondition-jobs"
              payload: { customer_id: "${customer_id}", product_id: "${product_id}", job_code: "RJ-5", units_received: 10, expected_customer_version: "${c_ver}" }
              as: ProductionPlanner
              captures: { job_id: $.data.id }
            - call: "POST /tooling/_clock/set_current_utc"
              payload: { current_utc: "2026-08-14T08:00:00Z" }
              as: ProductionPlanner
          trigger:
            - call: "POST /tooling/powder-blend-batches/${batch_id}/sinter"
              payload: { sintered_units: 170, scrap_units: 20, measured_density_gcc: 14.35, measured_hardness_hv: 1740 }
              as: MetallurgyEngineer
              captures: { err_sinter: $.data.error_id }
            - call: "POST /tooling/grinding-runs/${run_id}/complete"
              payload: { produced_units: 3, scrap_units: 1, measured_diameter_dev_um: 4.0 }
              as: ProductionPlanner
              captures: { err_grind: $.data.error_id }
            - call: "POST /tooling/recondition-jobs/${job_id}/inspect"
              payload: { units_inspected: 11, measured_length_mm: 90.0, measured_corner_wear_um: 120.0 }
              as: ProductionPlanner
              captures: { err_inspect: $.data.error_id }
          assert:
            - "${err_sinter} == ERR_UNIT_COUNT_MISMATCH and HTTP status == 422"
            - "${err_grind} == ERR_UNIT_COUNT_MISMATCH"
            - "${err_inspect} == ERR_UNIT_COUNT_MISMATCH"
            - "PowderBlendBatch.${batch_id}.stage is still PRESSED with qc_status PENDING"
            - "GrindingRun.${run_id}.status is still SCHEDULED and the wheel carries no charge"
            - "ReconditionJob.${job_id}.status is still RECEIVED with remaining_regrinds null"

      - name: order_confirmation_walks_the_referential_readiness_band
        claim_type: cascading_validation
        grounds:
          - validations[priority=19]
