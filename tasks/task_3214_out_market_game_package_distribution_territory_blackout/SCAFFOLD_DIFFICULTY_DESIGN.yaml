            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rights-grants"
              payload: { distributor_name: "StreamMax", scope: "OUT_OF_MARKET", exclusivity: "EXCLUSIVE", effective_from: "2026-01-01T00:00:00Z", effective_until: "2027-06-01T00:00:00Z", max_commercial_occupancy_cap: 2000 }
              as: PlatformAdmin
              captures: { rg_id: $.data.id }
            - call: "POST /seasons"
              payload: { rights_grant_id: "${rg_id}", label: "2026-Regular", regular_season_weeks: 18, season_start_date: "2026-08-05T00:00:00Z", season_end_date: "2026-12-09T00:00:00Z", grace_days: 7 }
              as: LeagueOps
              captures: { season_id: $.data.id }
            - call: "POST /markets"
