  - rule_id: boundary_precision_check
    instances:
      - name: cancellation_refund_band_at_exactly_thirty_days_before_arrival
        metric: "whole days between the clock date and Booking.arrival_date, tested at the 30-day band edge"
        endpoint: "POST /bookings/{bookingId}/cancel"
        grounds:
          - calculations.cancellation_refund_split
          - calculations.cancellation_refund_split.constants
          - entities.Booking.fields.cancellation_refund_pct
          - state_machines.Booking.payment_status
        distinguishing_aspect: |
          The 30-day edge is inclusive: at exactly 30 days out the guest keeps a 0.25 refund
          (94402 cents refunded, 283205 forfeited); one day later the band drops to 0.00 (0
          refunded, 377607 forfeited) and payment_status becomes FORFEITED instead of
          PARTIALLY_REFUNDED. Two bookings in two different cabins, cancelled one clock-day apart,
          separate an inclusive comparison from an exclusive one, and both splits must still sum to
          the deposit exactly.
        test_recipe:
          setup:
            - "OPEN season, two cabins, two disjoint parties of two adults plus one child"
            - "booking A in cabin Aspen and booking B in cabin Birch, both 2026-10-11 -> 2026-10-18, both confirmed with a 377607-cent deposit"
            - "cancel A at clock 2026-09-11 (exactly 30 days out) and B at clock 2026-09-12 (29 days out)"
