  - method: POST
    path: "/api/v1/stores/{storeId}/orders/{orderId}/start-production"
    description: "Move ACCEPTED -> IN_PRODUCTION; captures payment"
    roles: [LineWorker]
    code: 200
    input: []
    output: Order
    side_effects: ["payment_status AUTHORIZED -> CAPTURED"]

  - method: POST
    path: "/api/v1/stores/{storeId}/orders/{orderId}/verify-accuracy"
    description: "Submit an accuracy verification pass with per-line match results"
    roles: [LineWorker]
    code: 200
    input: [line_results]
    output: AccuracyVerification
    side_effects:
      - "verification_scoring updates OrderLine.accuracy_check and Order.accuracy_status"
      - "FAIL leaves order IN_PRODUCTION (rework loop); PASS enables mark-ready"

  - method: POST
    path: "/api/v1/stores/{storeId}/orders/{orderId}/mark-ready"
    description: "Move IN_PRODUCTION -> READY; gated on accuracy"
    roles: [LineWorker]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: POST
    path: "/api/v1/stores/{storeId}/orders/{orderId}/pickup"
    description: "Move READY -> PICKED_UP; releases interval load; posts theoretical cost"
    roles: [LineWorker]
    code: 200
    input: []
    output: Order
    side_effects:
      - "Store interval load -= entree_count; throttle_band re-evaluated"
      - "Store.theoretical_food_cost_cents += Order.theoretical_cost_cents"
      - "actual_food_cost_cents += consumed grams valued at unit cost"

  - method: POST
    path: "/api/v1/stores/{storeId}/orders/{orderId}/cancel"
    description: "Cancel a PLACED/ACCEPTED order; compensates capacity and inventory"
    roles: [StoreManager]
    code: 200
    input: []
    output: Order
    side_effects:
      - "Release committed capacity; payment VOIDED"
      - "Restore grams to newest ACTIVE batch per ingredient consumed"
      - "throttle_band and suppression re-evaluated"

  - method: GET
    path: "/api/v1/orders/{orderId}/verifications"
    description: "List accuracy verifications for an order"
    roles: [PlatformAdmin, StoreManager, GeneralManager, LineWorker]
    code: 200
    input: ["limit?", "offset?"]
    output: "AccuracyVerification[]"
    side_effects: []

  - method: GET
    path: "/api/v1/verifications"
    description: "List verifications filtered by order (FK reverse reachability)"
    roles: [PlatformAdmin, StoreManager, GeneralManager, LineWorker]
    code: 200
    input: ["limit?", "offset?", "order_id?"]
    output: "AccuracyVerification[]"
    side_effects: []

  - method: GET
    path: "/api/v1/verifications/{verificationId}"
    description: "Get one accuracy verification"
    roles: [PlatformAdmin, StoreManager, GeneralManager, LineWorker]
    code: 200
    input: []
    output: AccuracyVerification
    side_effects: []

  # --- StaffingDeployment ---
  - method: POST
    path: "/api/v1/stores/{storeId}/staffing-deployments"
    description: "Create a staffing deployment (OCC-guarded on Store.version); supersedes an existing DRAFT for the same shift_date"
    roles: [StoreManager]
    code: 201
    input: [shift_date, predicted_digital_mix_pct, predicted_instore_mix_pct, headcount, expected_store_version]
    output: StaffingDeployment
    side_effects:
      - "increments Store.version by 1"
      - "Existing DRAFT for same shift_date -> SUPERSEDED"
      - "staffing_split computes digital/instore headcount"

  - method: GET
    path: "/api/v1/stores/{storeId}/staffing-deployments"
    description: "List deployments"
    roles: [PlatformAdmin, StoreManager, GeneralManager, LineWorker]
    code: 200
    input: ["limit?", "offset?", "shift_date?", "status?"]
    output: "StaffingDeployment[]"
    side_effects: []

  - method: GET
    path: "/api/v1/staffing-deployments/{deploymentId}"
    description: "Get one deployment"
    roles: [PlatformAdmin, StoreManager, GeneralManager, LineWorker]
    code: 200
    input: []
    output: StaffingDeployment
    side_effects: []

  - method: GET
    path: "/api/v1/staffing-deployments"
    description: "List deployments filtered by store (FK reverse reachability)"
    roles: [PlatformAdmin, StoreManager, GeneralManager, LineWorker]
    code: 200
    input: ["limit?", "offset?", "store_id?", "status?"]
    output: "StaffingDeployment[]"
    side_effects: []

  - method: POST
    path: "/api/v1/stores/{storeId}/staffing-deployments/{deploymentId}/publish"
    description: "Publish a DRAFT deployment; supersedes any PUBLISHED one for the same shift_date"
    roles: [StoreManager]
    code: 200
    input: []
    output: StaffingDeployment
    side_effects: ["Prior PUBLISHED deployment for shift_date -> SUPERSEDED"]

  - method: POST
    path: "/api/v1/stores/{storeId}/staffing-deployments/{deploymentId}/lock"
    description: "Lock a PUBLISHED deployment (segregation of duties: locker != publisher)"
    roles: [GeneralManager]
    code: 200
    input: []
    output: StaffingDeployment
    side_effects: []

  # --- SuppressionEvent ---
  - method: GET
    path: "/api/v1/stores/{storeId}/suppression-events"
    description: "List suppression events (reverse reachability)"
    roles: [PlatformAdmin, StoreManager, GeneralManager, LineWorker]
    code: 200
    input: ["limit?", "offset?", "status?", "menu_item_id?", "ingredient_id?"]
    output: "SuppressionEvent[]"
    side_effects: []

  - method: GET
    path: "/api/v1/suppression-events/{eventId}"
    description: "Get one suppression event"
    roles: [PlatformAdmin, StoreManager, GeneralManager, LineWorker]
    code: 200
    input: []
    output: SuppressionEvent
    side_effects: []

  - method: GET
    path: "/api/v1/suppression-events"
    description: "List suppression events filtered by store, menu item, or ingredient"
    roles: [PlatformAdmin, StoreManager, GeneralManager, LineWorker]
    code: 200
    input: ["limit?", "offset?", "store_id?", "menu_item_id?", "ingredient_id?", "status?"]
    output: "SuppressionEvent[]"
    side_effects: []

  - method: POST
    path: "/api/v1/stores/{storeId}/suppression-events/{eventId}/resolve"
    description: "Manually resolve a MANUAL-scope suppression event"
    roles: [StoreManager]
    code: 200
    input: []
    output: SuppressionEvent
    side_effects: ["MenuItem.suppression_state recomputed"]

  # --- WasteEvent ---
  - method: POST
    path: "/api/v1/stores/{storeId}/waste-events"
    description: "Record waste against a batch (partial waste keeps batch ACTIVE; full-batch waste transitions it)"
    roles: [LineWorker, StoreManager]
    code: 201
    input: [ingredient_batch_id, grams, reason]
    output: WasteEvent
    side_effects:
      - "cost_cents = round_half_up(grams * unit_cost)"
      - "Ingredient.on_hand_grams -= grams; Store.actual_food_cost_cents += cost_cents"
      - "Full-batch waste: IngredientBatch ACTIVE -> WASTED"
      - "Threshold crossing may fire suppression_cascade"

  - method: GET
    path: "/api/v1/stores/{storeId}/waste-events"
    description: "List waste events"
    roles: [PlatformAdmin, StoreManager, GeneralManager]
    code: 200
    input: ["limit?", "offset?", "ingredient_batch_id?"]
    output: "WasteEvent[]"
    side_effects: []

  - method: GET
    path: "/api/v1/waste-events"
    description: "List waste events filtered by store or batch (FK reverse reachability)"
    roles: [PlatformAdmin, StoreManager, GeneralManager]
    code: 200
    input: ["limit?", "offset?", "store_id?", "ingredient_batch_id?"]
    output: "WasteEvent[]"
    side_effects: []

  - method: GET
    path: "/api/v1/waste-events/{wasteEventId}"
    description: "Get one waste event"
    roles: [PlatformAdmin, StoreManager, GeneralManager]
    code: 200
    input: []
    output: WasteEvent
    side_effects: []

  # --- DayClose ---
  - method: POST
    path: "/api/v1/stores/{storeId}/day-close"
    description: "Close the business day (OCC-guarded); freezes food-cost variance snapshot and advances current_business_day"
    roles: [GeneralManager]
    code: 201
    input: [expected_store_version]
    output: DayClose
    side_effects:
      - "increments Store.version by 1"
      - "Requires all windows SETTLED and no live orders (ERR_DAY_NOT_CLOSABLE)"
      - "CUTOFF windows -> SETTLED; DayClose snapshot persisted"

  - method: GET
    path: "/api/v1/stores/{storeId}/day-closes"
    description: "List day-close records"
    roles: [PlatformAdmin, StoreManager, GeneralManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "DayClose[]"
    side_effects: []

  - method: GET
    path: "/api/v1/day-closes"
    description: "List day-close records filtered by store (FK reverse reachability)"
    roles: [PlatformAdmin, StoreManager, GeneralManager]
    code: 200
    input: ["limit?", "offset?", "store_id?"]
    output: "DayClose[]"
    side_effects: []

  - method: GET
    path: "/api/v1/day-closes/{dayCloseId}"
    description: "Get one day-close record"
    roles: [PlatformAdmin, StoreManager, GeneralManager]
    code: 200
    input: []
    output: DayClose
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or unrecognized" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Authenticated role is not permitted for this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, wrong type, or enum value outside the declared set" }
  - { id: ERR_STORE_NOT_FOUND, http: 404, condition: "storeId path segment does not resolve" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "orderId does not resolve within the store" }
  - { id: ERR_MENU_ITEM_NOT_FOUND, http: 404, condition: "menuItemId does not resolve" }
  - { id: ERR_BATCH_NOT_FOUND, http: 404, condition: "ingredient_batch_id does not resolve" }
  - { id: ERR_DEPLOYMENT_NOT_FOUND, http: 404, condition: "deploymentId does not resolve within the store" }
  - { id: ERR_SUPPRESSION_EVENT_NOT_FOUND, http: 404, condition: "suppression event id does not resolve within the store" }
  - { id: ERR_CHANNEL_NOT_FOUND, http: 404, condition: "marketplace_channel_id does not resolve" }
  - { id: ERR_INGREDIENT_NOT_FOUND, http: 404, condition: "ingredientId does not resolve" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_store_version does not match current Store.version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity is in the wrong state for the requested transition" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Transition attempted from a terminal state (PICKED_UP, CANCELLED, EXPIRED, DEPLETED, WASTED, LOCKED, SUPERSEDED, SETTLED, RESOLVED)" }
  - { id: ERR_ACCURACY_UNVERIFIED, http: 409, condition: "mark-ready requires all OrderLines MATCHED and at least one PASS verification" }
  - { id: ERR_ITEM_SUPPRESSED, http: 409, condition: "A line's menu item is suppressed on the order's channel by an ACTIVE SuppressionEvent" }
  - { id: ERR_INSUFFICIENT_INGREDIENT, http: 409, condition: "FIFO-available grams across ACTIVE batches cannot cover the order's required grams (EXTRA customization doubles requirement)" }
  - { id: ERR_LINE_CAPACITY_EXCEEDED, http: 409, condition: "No OPEN ProductionWindow can absorb the order within digital_capacity (or in-store line is full)" }
  - { id: ERR_INVALID_DEPLOYMENT, http: 422, condition: "Mix pcts do not sum to 1, headcount < 2, or shift_date in the past" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Deployment lock attempted by the same X-User-ID that published it" }
  - { id: ERR_DAY_NOT_CLOSABLE, http: 409, condition: "Day close blocked: unsettled ProductionWindows or live orders remain" }
  - { id: ERR_MARKETPLACE_REFERENCE_INVALID, http: 422, condition: "MARKETPLACE order missing active channel, or external_order_ref duplicated within the channel" }
  - { id: ERR_WASTE_EXCEEDS_BATCH, http: 422, condition: "WasteEvent grams exceed the batch's grams_remaining" }
  - { id: ERR_MANUAL_SUPPRESSION_ONLY, http: 409, condition: "Manual resolve attempted on a SHORTAGE-caused SuppressionEvent" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "ProductionWindow interval overlaps an existing window for the store (half-open adjacency [start,end) permitted)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Corporate platform operator; provisions stores, ingredients, channels; drives the test clock"
    identity: opaque
    exclusive_operations:
      - "POST /stores"
      - "POST /ingredients"
      - "POST /marketplace-channels"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
  - name: StoreManager
    description: "Store-level manager; owns menu, deployments (publish), order cancel, manual suppression resolve, waste"
    identity: opaque
    exclusive_operations:
      - "POST /stores/{id}/menu-items"
      - "POST /menu-items/{id}/recipe-components"
      - "POST /stores/{id}/staffing-deployments"
      - "POST /stores/{id}/staffing-deployments/{id}/publish"
      - "POST /stores/{id}/orders/{id}/cancel"
      - "POST /stores/{id}/suppression-events/{id}/resolve"
    shared_operations:
      - "POST /stores/{id}/production-windows"
      - "POST /ingredients/{id}/batches"
      - "POST /stores/{id}/waste-events"
      - "POST /stores/{id}/orders"
      - "All GET endpoints"
  - name: GeneralManager
    description: "Above-store leader; locks deployments (segregation of duties vs publisher) and runs day close"
    identity: opaque
    exclusive_operations:
      - "POST /stores/{id}/staffing-deployments/{id}/lock"
      - "POST /stores/{id}/day-close"
    shared_operations:
      - "All GET endpoints"
  - name: LineWorker
    description: "Make-line staff; cooks batches, works orders through production, verifies accuracy, records waste"
    identity: opaque
    exclusive_operations:
      - "POST /stores/{id}/orders/{id}/start-production"
      - "POST /stores/{id}/orders/{id}/verify-accuracy"
      - "POST /stores/{id}/orders/{id}/mark-ready"
      - "POST /stores/{id}/orders/{id}/pickup"
    shared_operations:
      - "POST /ingredients/{id}/batches"
      - "POST /stores/{id}/waste-events"
      - "POST /stores/{id}/orders (IN_STORE channel only)"
      - "All GET endpoints"
  - name: MarketplaceChannel
    description: "Third-party marketplace injector; places MARKETPLACE orders under its own channel identity"
    identity: "entity_backed:MarketplaceChannel"
    exclusive_operations:
      - "POST /stores/{id}/orders with channel == MARKETPLACE and marketplace_channel_id == X-User-ID"
    shared_operations: []
