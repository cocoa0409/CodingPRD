  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: risk_tier_high_inclusive_at_exactly_020
        grounds:
          - calculations.risk_tier
          - calculations.prior_carrier_risk
          - entities.CounselingCase.fields.risk_tier
        distinguishing_aspect: "Numeric threshold boundary: a single first-degree affected member onset 35 yields prior_risk_pct exactly 0.20, and HIGH is inclusive (>=), so risk_tier == HIGH — reached via POST /counseling-cases/{id}/assess-risk."
        test_recipe:
          setup:
            - "Case ancestry EUROPEAN; one affected first-degree member onset 35"
          setup_api_calls:
            - { call: "POST /families", payload: { family_name: "Fam11", outreach_budget_cents: 10000 }, as: ProgramAdmin, captures: { fid: $.data.id } }
            - { call: "POST /counselors", payload: { full_name: "GC K", npi: "1000000011" }, as: ProgramAdmin, captures: { cid: $.data.id } }
            - { call: "POST /counseling-cases", payload: { family_id: "${fid}", assigned_counselor_id: "${cid}", patient_name: "Prob K", patient_dob: "1988-12-12", sex: "FEMALE", ancestry: "EUROPEAN", referral_reason: "FHx", covered_sessions: 1 }, as: GeneticCounselor, as_user_id: "${cid}", captures: { case_id: $.data.id } }
            - { call: "POST /pedigree-members", payload: { counseling_case_id: "${case_id}", relationship: "SIBLING", degree: 1, affected: true, age_of_onset: 35 }, as: GeneticCounselor, as_user_id: "${cid}" }
          trigger:
            - { call: "POST /counseling-cases/${case_id}/assess-risk", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
          assert:
            - "CounselingCase.${case_id}.prior_risk_pct == 0.2"
            - "CounselingCase.${case_id}.risk_tier == HIGH"

      - name: cascade_uptake_empty_denominator_is_zero
        grounds:
          - calculations.cascade_uptake
          - entities.Family.fields.cascade_uptake_pct
          - entities.Family.fields.cascade_invitations_sent_count
        distinguishing_aspect: "Empty-collection boundary on a different metric/endpoint: a family with zero invitations ever sent yields cascade_uptake_pct exactly 0.0 (no divide-by-zero), observed via GET /families/{id}."
        test_recipe:
          setup:
            - "Freshly created family, no cascade invitations"
          setup_api_calls:
            - { call: "POST /families", payload: { family_name: "Fam12", outreach_budget_cents: 10000 }, as: ProgramAdmin, captures: { fid: $.data.id } }
          trigger:
            - { call: "GET /families/${fid}", payload: {}, as: ProgramAdmin }
          assert:
            - "Family.${fid}.cascade_invitations_sent_count == 0"
            - "Family.${fid}.cascade_cases_count == 0"
            - "Family.${fid}.cascade_uptake_pct == 0.0"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_submit_requires_signed_consent
        grounds:
          - state_machines.TestOrder.DRAFT_to_SUBMITTED
          - entities.ConsentRecord.fields.status
          - validations[priority=8]
        distinguishing_aspect: "Entity pair (TestOrder, ConsentRecord): TestOrder's DRAFT->SUBMITTED transition is valid only when a ConsentRecord (type TESTING) for the same case is SIGNED; a PENDING consent yields ERR_CONSENT_REQUIRED."
