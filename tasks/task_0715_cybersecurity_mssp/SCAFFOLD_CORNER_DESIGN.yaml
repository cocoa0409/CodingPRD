        claim_type: Violation to Error
        grounds:
          - validations[priority=20]
          - errors[ERR_DUPLICATE_HOSTNAME]
        distinguishing_aspect: "Registering a second asset with the same hostname for the same client among non-DECOMMISSIONED assets returns ERR_DUPLICATE_HOSTNAME (409)."
