  - rule_id: non_linear_state_machine
    instances:
      - name: screening_revision_cycle_returns_to_draft_and_reconcurs
        grounds:
          - state_machines.PreadmissionScreening.SUBMITTED_to_CHANGES_REQUESTED
          - state_machines.PreadmissionScreening.CHANGES_REQUESTED_to_DRAFT
          - state_machines.PreadmissionScreening.DRAFT_to_SUBMITTED
          - state_machines.PreadmissionScreening.SUBMITTED_to_PHYSICIAN_CONCURRED
          - entities.PreadmissionScreening.fields.revision_count
        distinguishing_aspect: |
          The screening traverses the backward edge CHANGES_REQUESTED -> DRAFT, which
          clears reviewed_by_clinician_id and reviewed_at and increments revision_count
          to exactly 1, and then re-enters SUBMITTED and reaches PHYSICIAN_CONCURRED with
          revision_count still 1 — a genuine cycle, not a linear forward path.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T08:00:00Z (inside the 48-hour screening window for the whole chain)."
            - "One facility, one NURSE, one REHAB_PHYSICIAN, one patient."
            - "Screening created by the nurse with all four documentation flags true, submitted, and returned by the physician with decision REQUEST_CHANGES so it sits in CHANGES_REQUESTED with reviewed_at populated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
