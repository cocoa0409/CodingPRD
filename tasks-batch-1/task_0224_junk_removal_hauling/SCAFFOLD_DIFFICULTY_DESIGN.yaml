  - rule_id: compensating_invariant
    instances:
      - name: crew_minutes_conserved_dispatch_then_cancel
        grounds:
          - state_machines.HaulJob.ESTIMATED_to_SCHEDULED
          - state_machines.HaulJob.SCHEDULED_to_CANCELLED
          - calculations.crew_reserved_minutes
          - entities.Crew.fields.reserved_minutes
        distinguishing_aspect: |
          Conserved quantity = crew reserved-minutes: reserve a 120-min dispatch then cancel the job; the
          invariant Crew.reserved_minutes == sum(window_minutes over RESERVED/ACTIVE dispatches) holds, so
          the value returns to its pre-reserve baseline of 0 (no drift).
