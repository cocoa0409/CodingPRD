- section: cross_cutting
  instances:
  - name: block_revise_stale_version_rejected
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[block-revise-stale-version]
    - errors[ERR_STALE_VERSION]
    distinguishing_aspect: Revise with the version observed at publish succeeds; a second revise replaying the same stale version is rejected
      412 ERR_STALE_VERSION while the block keeps the first revision's values.
    test_recipe:
      setup:
      - Block created (v1) and published (v2); publish response version captured.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /stations
        payload:
          name: Station A
          zone_code: SEA1
        as: PlatformAdmin
        captures:
          st: $.data.id
          stv: $.data.version
      - call: POST /stations/${st}/blocks
        payload:
          starts_at: '2026-09-01T02:00:00Z'
          ends_at: '2026-09-01T04:00:00Z'
          required_vehicle_class: SEDAN
          base_pay_cents: 4000
        as: StationOps
        captures:
          bw: $.data.id
      - call: POST /blocks/${bw}/publish
        as: StationOps
        captures:
          bwv: $.data.version
      trigger:
      - call: POST /blocks/${bw}/revise
        payload:
          expected_block_version: ${bwv}
          base_pay_cents: 4500
        as: StationOps
        captures:
          pay1: $.data.base_pay_cents
          est1: $.data.estimated_pay_cents
          v1: $.data.version
      - call: POST /blocks/${bw}/revise
        payload:
          expected_block_version: ${bwv} - 1"
          base_pay_cents: 9999
        as: StationOps
        captures:
          err: $.data.error_id
      assert:
      - 'first revise succeeds: captured ${pay1} == 4500, ${est1} == 4500 (estimated recomputed), ${v1} == ${bwv} + 1'
      - second revise with stale version (${bwv} - 1) rejected 412 with captured ${err} == "ERR_STALE_VERSION"
      - DeliveryBlock.${bw}.base_pay_cents remains 4500
  - name: surge_cycle_stale_station_version_rejected
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[station-surge-cycle-stale-version]
    - errors[ERR_STALE_VERSION]
    distinguishing_aspect: 'A surge cycle consumes the station epoch: replaying the same expected_station_version after a successful cycle is
      rejected 412; each cycle increments Station.version exactly once.'
    test_recipe:
      setup:
      - Station created; version captured.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /stations
        payload:
          name: Station A
          zone_code: SEA1
        as: PlatformAdmin
        captures:
          st: $.data.id
          stv: $.data.version
      trigger:
      - call: POST /stations/${st}/run-surge-cycle
        payload:
          expected_station_version: ${stv}
        as: StationOps
        captures:
          sv1: $.data.version
      - call: POST /stations/${st}/run-surge-cycle
        payload:
          expected_station_version: ${stv} - 1"
        as: StationOps
        captures:
          err: $.data.error_id
      assert:
      - first cycle succeeds with captured ${sv1} == ${stv} + 1
      - replayed cycle with stale version rejected 412 with captured ${err} == "ERR_STALE_VERSION"
  - name: paginated_block_list_envelope_and_windowing
    claim_type: pagination_with_filtering
    grounds:
    - response_envelope
    - endpoints.GET /stations/{id}/blocks
    distinguishing_aspect: 'limit=1 pages through two blocks: page 1 returns the earlier block with has_more true and total_count 2; page 2 (offset
      1) returns the later block with has_more false.'
    test_recipe:
      setup:
      - 'Station with two published blocks: [02:00,04:00) created first, [05:00,07:00) created second.'
      setup_api_calls:
      - &id021
        call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /stations
        payload:
          name: Station A
          zone_code: SEA1
        as: PlatformAdmin
        captures:
          st: $.data.id
          stv: $.data.version
      - call: POST /stations/${st}/blocks
        payload:
          starts_at: '2026-09-01T02:00:00Z'
          ends_at: '2026-09-01T04:00:00Z'
          required_vehicle_class: SEDAN
          base_pay_cents: 4000
        as: StationOps
        captures:
          bw: $.data.id
      - call: POST /blocks/${bw}/publish
        as: StationOps
      - call: POST /stations/${st}/blocks
        payload:
          starts_at: '2026-09-01T05:00:00Z'
          ends_at: '2026-09-01T07:00:00Z'
          required_vehicle_class: SEDAN
          base_pay_cents: 4000
        as: StationOps
        captures:
          bl: $.data.id
      - call: POST /blocks/${bl}/publish
        as: StationOps
      trigger:
      - call: GET /stations/${st}/blocks?limit=1&offset=0
        as: StationOps
        captures:
          first_id: $.data[0].id
      - call: GET /stations/${st}/blocks?limit=1&offset=1
        as: StationOps
        captures:
          second_id: $.data[0].id
      assert:
      - 'page 1: data has exactly 1 item, meta.total_count == 2, meta.has_more == true, captured ${first_id} == ${bw} (starts_at ASC)'
      - 'page 2: data has exactly 1 item, meta.has_more == false, captured ${second_id} == ${bl}'
  - name: surge_cycle_expires_unfilled_block_and_its_offers
    claim_type: cascading_side_effects
    grounds:
    - calculations.surge_cycle_sweeps
    - state_machines.DeliveryBlock.PUBLISHED_to_EXPIRED
    distinguishing_aspect: A PUBLISHED block whose starts_at has passed is expired by the cycle and its remaining OFFERED offers cascade to EXPIRED
      in the same call.
    test_recipe:
      setup:
      - Block [02:00,04:00) published with an OFFERED offer expiring 2026-09-03; never accepted; clock advanced to 02:00.
      setup_api_calls:
      - *id021
      - call: POST /stations
        payload:
          name: Station A
          zone_code: SEA1
        as: PlatformAdmin
        captures:
          st: $.data.id
          stv: $.data.version
      - call: POST /drivers/register
        payload:
          legal_name: Dana One
