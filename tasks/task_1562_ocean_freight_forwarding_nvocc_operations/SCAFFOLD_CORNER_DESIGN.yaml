          trigger:
            - { call: "POST /freight/invoices/${inv}/adjustments", payload: { description: "SURCH-A", quantity: 0.5, unit_rate_cents: 2999, expected_invoice_version: "${iv}" }, as: FinanceController, captures: { v2: $.data.version, tot2: $.data.total_cents } }
            - { call: "POST /freight/invoices/${inv}/adjustments", payload: { description: "SURCH-B", quantity: 1.0, unit_rate_cents: 1000, expected_invoice_version: "${iv}" }, as: FinanceController, captures: { err: $.data.error_id } }
          assert:
            - "first adjustment: version 1 -> 2, total_cents == 78900 (77400 + round_half_up(0.5 x 2999))"
            - "second adjustment with stale version 1: error_id == ERR_STALE_INVOICE_VERSION, http 412; total stays 78900"

      - name: rate_threshold_auto_suspend_on_invoice_issue
        claim_type: rate_threshold_triggers
        grounds:
          - state_machines.Shipper.ACTIVE_to_SUSPENDED
          - calculations.credit_exposure
          - entities.Shipper.fields.status
        distinguishing_aspect: "Cumulative threshold trigger: issuing the FREIGHT invoice (posted 236000 <= 250000 limit) keeps the shipper ACTIVE; issuing the D&D invoice pushes posted to 377000 > 250000 and the system auto-suspends — the trigger is the issue event crossing the limit, not a manual action."
        test_recipe:
          setup:
            - "Shipper credit_limit_cents 250000; FCL booking (estimate 236000) progressed to ARRIVED; assignment discharged 2026-09-21T12:00Z, gated out 2026-09-30T12:00Z (5 demurrage days = 105000), returned 2026-10-06T12:00Z (3 detention days = 36000)"
          setup_api_calls:
