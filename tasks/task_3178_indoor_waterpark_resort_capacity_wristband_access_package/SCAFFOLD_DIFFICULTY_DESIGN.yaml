            - "Wristband.${wb20_new_id}.arcade_credit_limit_cents == 18900"
            - "sum of arcade_credit_limit_cents over non-REISSUED wristbands of Reservation ${res20_id} == Reservation.${res20_id}.credited_arcade_cents"

      - name: group_cancellation_zeroes_all_occupancy_units
        grounds:
          - state_machines.GroupBooking.transitions.CONFIRMED_to_CANCELLED
          - calculations.group_reserved_units
          - calculations.cabana_day_units
        distinguishing_aspect: |
          The conserved quantity here is group-held occupancy: a cancel plus its compensating
          cabana release must return the group's contribution to room, cabana and member
          totals to exactly zero, with no residual units left on any child row.
        test_recipe:
          setup:
            - "Resort with a CONFIRMED 2-member group holding a booked cabana on 2026-09-15"
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Traverse City", park_capacity_occupancy_units: 30, day_pass_cap_units: 10, arcade_credit_rate_cents_per_unit: 250 }
              as: platform_ops
              captures: { r21_id: "$.data.id" }
            - call: "POST /resorts/${r21_id}/group-bookings"
              payload: { group_kind: "FAMILY_REUNION", service_date: "2026-09-15", member_count: 2, deposit_paid_cents: 1000 }
              as: Group
              as_user_id: "gb-placeholder"
              captures: { gb21_id: "$.data.id" }
            - call: "POST /resorts/${r21_id}/group-bookings/${gb21_id}/confirm"
              payload: {}
              as: Group
              as_user_id: "${gb21_id}"
            - call: "POST /resorts/${r21_id}/group-members"
              payload: { group_booking_id: "${gb21_id}", member_name: "Kim", member_units: 1 }
              as: Group
              as_user_id: "${gb21_id}"
              captures: { gm21a_id: "$.data.id" }
            - call: "POST /resorts/${r21_id}/group-members"
              payload: { group_booking_id: "${gb21_id}", member_name: "Lex", member_units: 1 }
              as: Group
              as_user_id: "${gb21_id}"
              captures: { gm21b_id: "$.data.id" }
            - call: "POST /resorts/${r21_id}/cabanas"
              payload: { cabana_label: "CAB-5", cabana_kind: "CABANA", capacity_units: 4 }
              as: platform_ops
              captures: { cab21_id: "$.data.id", cab21_v: "$.data.version" }
            - call: "POST /resorts/${r21_id}/cabana-bookings"
              payload: { cabana_id: "${cab21_id}", group_booking_id: "${gb21_id}", service_date: "2026-09-15", start_minute: 600, end_minute: 720, member_units: 2, expected_cabana_version: "${cab21_v}" }
              as: Group
              as_user_id: "${gb21_id}"
              captures: { cb21_id: "$.data[0].id" }
            - call: "POST /resorts/${r21_id}/cabana-bookings/${cb21_id}/confirm"
              payload: {}
              as: Group
              as_user_id: "${gb21_id}"
          trigger:
            - call: "POST /resorts/${r21_id}/group-bookings/${gb21_id}/cancel"
              payload: {}
              as: Group
              as_user_id: "${gb21_id}"
          assert:
            - "GroupBooking.${gb21_id}.group_reserved_units == 0"
            - "CabanaBooking.${cb21_id}.cabana_booking_status == CANCELLED"
            - "Cabana.${cab21_id}.cabana_status == AVAILABLE"
            - "GroupBooking.${gb21_id}.group_reserved_units + sum of member_units over HELD or BOOKED cabana bookings of GroupBooking ${gb21_id} == 0"