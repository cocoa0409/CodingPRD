        distinguishing_aspect: "A VETERAN case decided with verified_service_era PRE_911_GULF is rejected even though the state transition itself is legal — the era policy is a separate gate."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. One member (claimed PRE_911_GULF) with an UNDER_REVIEW case."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/members"
              payload: { full_name: "Gulf Era Vet", member_type: "VETERAN", service_era_claimed: "PRE_911_GULF", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "ARMY" }
              as: IntakeCoordinator
              captures: { m_id: "$.data.id", m_v: "$.data.version" }
