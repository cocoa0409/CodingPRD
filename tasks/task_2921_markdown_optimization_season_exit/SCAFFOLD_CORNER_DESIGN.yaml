      - name: ladder_shape_rules_fire_in_their_declared_inner_order
        claim_type: Violation -> Error
        grounds:
          - validations[priority=18]
          - validations[priority=22]
          - errors[ERR_CADENCE_TOO_TIGHT]
          - errors[ERR_DEPTH_NOT_MONOTONIC]
          - errors[ERR_STEP_INDEX_OUT_OF_SEQUENCE]
          - errors[ERR_MAX_LADDER_STEPS]
          - global_constants.MAX_LADDER_STEPS
        distinguishing_aspect: |
          Four rung-shape errors are reachable from one plan and their order is pinned: cadence (priority 18)
          precedes every priority-22 check, and inside priority 22 the sequence check precedes the cap which
          precedes monotonicity - so a fifth rung with a legal index and a legal depth must report the cap.
        test_recipe:
          setup:
            - "Season FW26-APPAREL is ACTIVE; item A-1001 is AGING with a CERTIFIED estimate and protected_until_date 2026-10-01"
            - "A PERMANENT plan (exit_date_target 2027-01-15) holds one rung: step_index 1 on 2026-11-16 at 22.57"
