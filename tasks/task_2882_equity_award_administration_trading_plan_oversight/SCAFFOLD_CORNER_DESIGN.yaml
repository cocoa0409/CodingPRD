              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /equity-plans/${plan_id}/status"
              payload: { action: "UNFREEZE" }
              as: PlanAdministrator
              as_user_id: "admin-1"
          assert:
            - "the FREEZE returns HTTP 200 with status == FROZEN, freeze_reason == \"audit in progress\" and version == 2"
            - "the UNFREEZE returns HTTP 200 with status == ACTIVE, freeze_reason == null and version == 3"
            - "the second UNFREEZE returns HTTP 409 with error_id ERR_PLAN_INVALID_STATE and version stays 3"
            - "available_reserve_shares == 1000000 throughout; the lifecycle actions never touch the ledger"

