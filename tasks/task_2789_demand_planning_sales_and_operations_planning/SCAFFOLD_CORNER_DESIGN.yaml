              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/capacity-blocks"
              payload: { family_id: "${fam_id}", start_date: "2026-09-01", end_date: "2026-09-30", available_hours: 9 }
              as: SupplyPlanner
              as_user_id: "supply-1"
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-GUARD", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 2000000, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/supply-plans"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}" }
              as: SupplyPlanner
              as_user_id: "supply-1"
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SCENARIO_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/scenarios"
              payload: { cycle_id: "${cycle_id}", scenario_type: "CAPACITY_INVESTMENT", name: "Buy 5 hours", target_item_id: "${item_id}", added_capacity_hours: 5 }
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { sc_id: $.data.id }
            - call: "POST /sop/scenarios/${sc_id}/evaluate"
              payload: {}
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { net: $.data.net_gap_closure_cents }
          trigger:
            - call: "POST /sop/scenarios/${sc_id}/evaluate"
              payload: {}
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { e_eval: $.data.error_id }
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "EXECUTIVE_REVIEW" }
              as: SopAdmin
              captures: { v_exec: $.data.version }
            - call: "POST /sop/scenarios/${sc_id}/select"
              payload: { expected_cycle_version: "${v_exec}" }
              as: ExecutiveSponsor
              as_user_id: "exec-1"
              captures: { sc_closure: $.data.net_gap_closure_cents }
            - call: "GET /sop/planning-cycles/${cycle_id}"
              payload: {}
              as: ExecutiveSponsor
              as_user_id: "exec-2"
              captures: { v_after_select: $.data.version, closure_after: $.data.selected_closure_cents, residual_after: $.data.residual_gap_cents }
            - call: "POST /sop/scenarios/${sc_id}/select"
              payload: { expected_cycle_version: "${v_after_select}" }
              as: ExecutiveSponsor
              as_user_id: "exec-2"
              captures: { e_select: $.data.error_id }
          assert:
            - "${net} == 287800 and ${sc_closure} == 287800 — the first evaluate and the first select both succeed"
            - "The second evaluate returns 409 with ${e_eval} == \"ERR_SCENARIO_NOT_EVALUATABLE\" — the scenario is EVALUATED, and rule 60 passes because the cycle is still SCENARIO_REVIEW"
            - "The second select returns 409 with ${e_select} == \"ERR_SCENARIO_NOT_SELECTABLE\" — the scenario is SELECTED, not EVALUATED"
            - "The second select is NOT 403 ERR_SEGREGATION_OF_DUTIES (the author is supply-1, the actor exec-2) and NOT 412 (${v_after_select} is the current token), so priority 120 is the reported failure"
            - "${closure_after} == 287800 and ${residual_after} == 812200 both BEFORE and AFTER the refused second select — nothing is double-credited"
            - "Scenario.${sc_id}.selected_by_user_id is still \"exec-1\" and its status is still \"SELECTED\""

      - name: promotion_not_approvable_beats_frozen_horizon_on_a_second_approve
        claim_type: Priority Ordering
        grounds:
          - errors.ERR_PROMOTION_NOT_APPROVABLE
          - validations[priority=120]
          - validations[priority=140]
        distinguishing_aspect: |
          A Promotion must be in DRAFT to be approved, and that state guard sits at priority 120
          — ahead of the frozen-horizon calendar check at 140. So re-approving an already APPROVED
          promotion after the logical clock has advanced into its start month answers 409
          ERR_PROMOTION_NOT_APPROVABLE, not the 422 ERR_PROMOTION_HORIZON_FROZEN that the same
          clock position would produce on a DRAFT sibling.
        test_recipe:
          setup:
            - "One family, one MATURE item and two customers; two DRAFT promotions for 2026-09..2026-09 — P-DONE for CUST-A and P-DRAFT for CUST-B, so the two windows cannot collide under rule 140(a)."
            - "At the default logical clock 2026-08-01T00:00:00Z, P-DONE is approved; the clock is then moved to 2026-09-15T00:00:00Z."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BASE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-A", name: "Grocer A", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_a: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-B", name: "Club B", channel: "CLUB", priority_rank: 4 }
              as: SopAdmin
              captures: { cust_b: $.data.id }
            - call: "POST /sop/promotions"
              payload: { item_id: "${item_id}", customer_id: "${cust_a}", start_month: "2026-09", end_month: "2026-09", lift_pct: 10, cannibalization_pct: 2 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { promo_done: $.data.id }
            - call: "POST /sop/promotions"
              payload: { item_id: "${item_id}", customer_id: "${cust_b}", start_month: "2026-09", end_month: "2026-09", lift_pct: 10, cannibalization_pct: 2 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { promo_draft: $.data.id }
            - call: "POST /sop/promotions/${promo_done}/approve"
              payload: {}
              as: DemandReviewLead
              as_user_id: "lead-1"
              captures: { done_status: $.data.status, done_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: SopAdmin
          trigger:
            - call: "POST /sop/promotions/${promo_done}/approve"
              payload: {}
              as: DemandReviewLead
              as_user_id: "lead-1"
              captures: { e_state: $.data.error_id }
            - call: "POST /sop/promotions/${promo_draft}/approve"
              payload: {}
              as: DemandReviewLead
              as_user_id: "lead-1"
              captures: { e_clock: $.data.error_id }
          assert:
            - "${done_status} == \"APPROVED\" — the first approve landed while the logical clock still read 2026-08-01T00:00:00Z"
            - "The re-approve returns 409 with ${e_state} == \"ERR_PROMOTION_NOT_APPROVABLE\", NOT 422 ERR_PROMOTION_HORIZON_FROZEN, because priority 120 precedes priority 140"
            - "The DRAFT sibling returns 422 with ${e_clock} == \"ERR_PROMOTION_HORIZON_FROZEN\" at the very same clock position, proving the calendar rule is live"
            - "Promotion.${promo_done}.version == ${done_v} — the refused re-approve wrote nothing"
            - "Promotion.${promo_draft}.status is still \"DRAFT\"; GET /sop/promotions?status=APPROVED returns total_count == 1"

      - name: unevaluated_scenario_then_stale_supply_plan_block_the_executive_path
        claim_type: Violation to Error
        grounds:
          - errors.ERR_UNEVALUATED_SCENARIO
          - errors.ERR_STALE_SUPPLY_PLAN
          - validations[priority=130]
        distinguishing_aspect: |
          Both referential guards protect the same executive hand-off but at different hops:
          130(h) refuses to LEAVE scenario review while any scenario is still DRAFT, and 130(g)
          refuses to SELECT a scenario whose target plan has since gone STALE. The second one
          fires on a scenario that is itself perfectly EVALUATED, so the error is about a
          neighbouring row rather than the subject.
        test_recipe:
          setup:
            - "The base family, one MATURE item (95.0 / 0.20 / 30, safety_stock 330) and one customer; a 9 h block inside 2026-09 (900 units)."
            - "A cycle over 2026-09..2026-09 with financial_commitment_cents 2000000, one locked 1000-unit forecast and one PLANNED plan (constrained 900), advanced to SCENARIO_REVIEW."
            - "Two scenarios authored by supply-1: SC-EVAL (CAPACITY_INVESTMENT, 5 hours) which is evaluated, and SC-DRAFT (PRICE_REALIZATION, 5 pct) which is left in DRAFT."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BASE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, service_level_target_pct: 95.0, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/capacity-blocks"
              payload: { family_id: "${fam_id}", start_date: "2026-09-01", end_date: "2026-09-30", available_hours: 9 }
              as: SupplyPlanner
              as_user_id: "supply-1"
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-EXECPATH", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 2000000, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/supply-plans"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}" }
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { plan_id: $.data.id }
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SCENARIO_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/scenarios"
              payload: { cycle_id: "${cycle_id}", scenario_type: "CAPACITY_INVESTMENT", name: "Buy 5 hours", target_item_id: "${item_id}", added_capacity_hours: 5 }
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { sc_eval: $.data.id }
            - call: "POST /sop/scenarios/${sc_eval}/evaluate"
              payload: {}
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { eval_net: $.data.net_gap_closure_cents }
            - call: "POST /sop/scenarios"
              payload: { cycle_id: "${cycle_id}", scenario_type: "PRICE_REALIZATION", name: "Raise price five percent", target_item_id: "${item_id}", price_increase_pct: 5 }
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { sc_draft: $.data.id }
          trigger:
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "EXECUTIVE_REVIEW" }
              as: SopAdmin
              captures: { e_draft: $.data.error_id }
            - call: "POST /sop/scenarios/${sc_draft}/evaluate"
              payload: {}
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { draft_status: $.data.status }
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "EXECUTIVE_REVIEW" }
              as: SopAdmin
              captures: { cycle_status: $.data.status }
            - call: "POST /sop/items/${item_id}/inventory-policy"
              payload: { service_level_target_pct: 97.5, demand_cv: 0.20, lead_time_days: 30 }
              as: SupplyPlanner
              as_user_id: "supply-1"
            - call: "GET /sop/planning-cycles/${cycle_id}"
              payload: {}
              as: ExecutiveSponsor
              as_user_id: "exec-1"
              captures: { v_now: $.data.version, pv_now: $.data.plan_value_cents }
            - call: "POST /sop/scenarios/${sc_eval}/select"
              payload: { expected_cycle_version: "${v_now}" }
              as: ExecutiveSponsor
              as_user_id: "exec-1"
              captures: { e_stale: $.data.error_id }
          assert:
            - "${eval_net} == 287800 for SC-EVAL, and the first advance returns 422 with ${e_draft} == \"ERR_UNEVALUATED_SCENARIO\" because SC-DRAFT is still DRAFT"
            - "It is NOT 409 ERR_CYCLE_TRANSITION_INVALID — SCENARIO_REVIEW to EXECUTIVE_REVIEW is a declared edge, so priority 120 passes and 130(h) is the failure"
            - "${draft_status} == \"EVALUATED\" and the second advance then succeeds with ${cycle_status} == \"EXECUTIVE_REVIEW\""
            - "The inventory-policy reset stales the only plan: SupplyPlan.${plan_id}.status == \"STALE\", requires_replan == true and ${pv_now} == 0"
            - "The select returns 422 with ${e_stale} == \"ERR_STALE_SUPPLY_PLAN\" even though Scenario.${sc_eval}.status is \"EVALUATED\" and net_gap_closure_cents is 287800"
            - "It is NOT 409 ERR_SCENARIO_NOT_SELECTABLE and NOT 412 — the OCC token ${v_now} was re-read after the staling write"
            - "PlanningCycle.${cycle_id}.selected_closure_cents is still 0 and residual_gap_cents == 2000000 == gross_gap_cents after the refusal"

      - name: capacity_block_within_the_changeover_buffer_rejected
        claim_type: Violation to Error
        grounds:
          - errors.ERR_CAPACITY_BLOCK_OVERLAP
          - validations[priority=140]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / capacity_block_half_open_dates_with_changeover_buffer"
          rationale: |
            That difficulty instance already drives ERR_CAPACITY_BLOCK_OVERLAP across the full
            half-open boundary matrix — exactly adjacent blocks, blocks one day apart, blocks
            exactly CHANGEOVER_BUFFER_DAYS = 2 apart and the mirrored ordering of new versus
            existing — so a separate corner instance would re-test the same interval predicate
            with strictly weaker inputs.

      - name: capacity_block_exceeding_family_monthly_hours_rejected
        claim_type: Violation to Error
        grounds:
          - errors.ERR_FAMILY_MONTHLY_HOURS_EXCEEDED
          - validations[priority=150]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / capacity_block_half_open_dates_with_changeover_buffer"
          rationale: |
            The same difficulty instance also exercises the per-family monthly hours ceiling,
            including the case where an otherwise buffer-legal block is refused because the
            family's accumulated hours would pass max_monthly_hours; repeating it here would add
            no distinguishing input beyond a different hour literal.

  - section: rbac
    instances:
      - name: demand_planner_cannot_review_its_own_adjustment
        claim_type: Segregation of duties
        grounds:
          - roles.DemandPlanner
          - roles.DemandReviewLead
          - endpoints[POST /sop/consensus-adjustments/{adjustment_id}/reviews]
          - validations[priority=20]
        distinguishing_aspect: |
          Review is EXCLUSIVE to DemandReviewLead, so the segregation of duties around
          adjustments is enforced by role membership alone and never reaches a proposer-versus-
          reviewer identity comparison: the proposing DemandPlanner is refused with 403
          ERR_UNAUTHORIZED, not ERR_SEGREGATION_OF_DUTIES, and the same call from the lead on the
          same adjustment succeeds.
        test_recipe:
          setup:
            - "The base family, one MATURE item and one customer; a cycle over 2026-09..2026-09 (commitment 0) in DEMAND_REVIEW with one 1000-unit forecast and one PROPOSED SALES_INTELLIGENCE adjustment of +100 proposed by planner-1."
