            - { call: "POST /v1/return-items/${it2}/inspect", payload: { condition: NEW }, as: PlatformAdmin }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: HOME_PICKUP, boxless: true, items: [ { sku: "D3", quantity: 1, unit_price_cents: 500, declared_condition: NEW, longest_side_cm: 10, weight_grams: 100 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro3: $.data.id } }
            - { call: "POST /v1/pickup-appointments", payload: { return_order_id: "${ro3}", zone_id: "${zone_id}", window_start: "2026-05-01T00:30:00Z", window_end: "2026-05-01T02:30:00Z" }, as: Shopper, as_user_id: "${sh_id}", captures: { ap3: $.data.id } }
            - { call: "POST /v1/pickup-appointments/${ap3}/start", payload: {}, as: PlatformAdmin }
