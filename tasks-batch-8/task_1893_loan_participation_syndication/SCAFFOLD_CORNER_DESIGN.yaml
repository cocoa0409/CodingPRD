        distinguishing_aspect: "POST /api/facilities is AgentBank-exclusive; ParticipantLender caller -> 403 ERR_FORBIDDEN_FOR_ROLE."
        test_recipe:
          setup: ["empty database (no participant needed; role header alone is rejected)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/facilities", payload: { borrower_id: "00000000-0000-0000-0000-000000000000", facility_name: "X", total_commitment_cents: 1000000, currency: "USD", interest_rate_bps: 900, day_count_basis: "ACT_360", servicing_fee_bps: 10, default_interest_addon_bps: 300, maturity_date: "2030-01-01" }, as: ParticipantLender, as_user_id: "00000000-0000-0000-0000-000000000000", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE, HTTP 403 (role check priority 2 precedes existence 404)"

      - name: borrower_cannot_confirm_wire_forbidden
        claim_type: rbac_exclusive_denial
        grounds: ['roles[AgentBank]', 'errors[ERR_FORBIDDEN_FOR_ROLE]']
        distinguishing_aspect: "Settlement confirm is AgentBank-exclusive; Borrower caller -> 403."
        test_recipe:
          setup: ["funded-flow: draw created; settlement exists in PENDING"]
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "CF B", sector: "OTHER", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac CF", total_commitment_cents: 5000000, currency: "USD", interest_rate_bps: 900, day_count_basis: "ACT_360", servicing_fee_bps: 10, default_interest_addon_bps: 300, maturity_date: "2030-01-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "CP", commitment_cents: 5000000 }, as: AgentBank, captures: { p_id: $.data.id } }
            - { call: "POST /api/participants/${p_id}/commit", payload: {}, as: AgentBank }
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f_id}", draw_amount_cents: 1000000, accrual_start_date: "2026-08-01", accrual_end_date: "2027-08-01", expected_facility_version: "${f_v}" }, as: AgentBank, captures: { d_id: $.data.id } }
            - { call: "GET /api/funding_settlements?participant_id=${p_id}", as: AgentBank, captures: { s1: '$.data[0].id' } }
