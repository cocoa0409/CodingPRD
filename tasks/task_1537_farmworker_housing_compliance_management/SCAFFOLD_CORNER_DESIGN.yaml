      - name: utility_overage_forbids_amount_cents
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]", entities.ChargeLedgerEntry.fields.amount_cents]
        distinguishing_aspect: "UTILITY_OVERAGE entries are server-computed: supplying amount_cents alongside usage_lines is a 400."
        test_recipe:
          setup: ["site OPEN; tenancy ACTIVE"]
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "S", state_code: "CA" }, as: OperatorAdmin, captures: { site_id: $.data.id, site_v: $.data.version } }
