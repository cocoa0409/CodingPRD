scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_taxpayer_returns_201_pending
        claim_type: Creation
        grounds: ["entities.Taxpayer.fields.account_status"]
        distinguishing_aspect: "POST /tax/taxpayers with all required fields -> 201; account_status == PENDING, version == 1, server-minted id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "Acme", entity_type: "LLC", email: "a@x.com", filing_frequency: "QUARTERLY" }
              as: Anonymous
              captures: { tp_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Taxpayer.${tp_id}.account_status == PENDING"
            - "Taxpayer.${tp_id}.version == 1"

      - name: get_taxpayer_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_TAXPAYER_NOT_FOUND]"]
        distinguishing_aspect: "GET /tax/taxpayers/{unknown-uuid} -> 404 ERR_TAXPAYER_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /tax/taxpayers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: TaxAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404"
            - "response error_id == ERR_TAXPAYER_NOT_FOUND"

      - name: create_taxpayer_missing_required_field
        claim_type: Required Fields
        grounds: ["errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /tax/taxpayers missing filing_frequency -> 400 ERR_VALIDATION."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "NoFreq", entity_type: "LLC", email: "nf@x.com" }
              as: Anonymous
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 400"
            - "response error_id == ERR_VALIDATION"

      - name: jurisdiction_active_default_true
        claim_type: Defaults
        grounds: ["entities.Jurisdiction.fields.active"]
        distinguishing_aspect: "POST /tax/jurisdictions omitting active -> active defaults to true."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /tax/jurisdictions"
              payload: { code: "CITY", name: "City", rate_bps: 850 }
              as: TaxAdmin
              captures: { jur_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Jurisdiction.${jur_id}.active == true"

      - name: remittance_id_created_at_system_generated
        claim_type: System Fields
        grounds: ["entities.Remittance.fields.received_at"]
        distinguishing_aspect: "POST /tax/remittances -> server sets id, created_at, received_at, applied_amount_cents == 0; client-supplied applied_amount ignored (field not accepted)."
        test_recipe:
          setup: ["one PENDING taxpayer"]
          setup_api_calls:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "RemTP", entity_type: "LLC", email: "rt@x.com", filing_frequency: "MONTHLY" }
              as: Anonymous
              captures: { tp_id: $.data.id }
          trigger:
            - call: "POST /tax/remittances"
              payload: { taxpayer_id: "${tp_id}", remittance_type: "PREPAYMENT", amount_cents: 5000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { rem_id: $.data.id }
          assert:
            - "Remittance.${rem_id}.applied_amount_cents == 0"
            - "Remittance.${rem_id}.unapplied_amount_cents == 5000"

  # =========================================================================
  - section: state_machines
    instances:
      - name: file_already_filed_return_rejected
        claim_type: Invalid Transitions
        grounds: ["state_machines.TaxReturn.DRAFT_to_FILED", "errors[ERR_RETURN_NOT_DRAFT]"]
        distinguishing_aspect: "Filing a return already in FILED -> 409 ERR_RETURN_NOT_DRAFT; no recomputation occurs."
        test_recipe:
          setup: ["one ACTIVE taxpayer; one jurisdiction; a FILED return"]
          setup_api_calls:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "F1", entity_type: "LLC", email: "f1@x.com", filing_frequency: "QUARTERLY" }
              as: Anonymous
              captures: { tp_id: $.data.id }
            - call: "POST /tax/taxpayers/${tp_id}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /tax/jurisdictions"
              payload: { code: "CITY", name: "City", rate_bps: 850 }
              as: TaxAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /tax/returns"
              payload: { taxpayer_id: "${tp_id}", period_key: "2026-Q1", period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-03-31T00:00:00Z", filing_due_date: "2026-04-20T00:00:00Z", lines: [ { jurisdiction_id: "${jur_id}", gross_sales_cents: 1000000, exempt_sales_cents: 0, deduction_cents: 0 } ] }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax/returns/${ret_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
          trigger:
            - call: "POST /tax/returns/${ret_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409"
            - "response error_id == ERR_RETURN_NOT_DRAFT"

      - name: file_return_blocked_when_account_pending
        claim_type: Precondition Enforcement
        grounds: ["state_machines.TaxReturn.DRAFT_to_FILED", "errors[ERR_ACCOUNT_NOT_ACTIVE]"]
        distinguishing_aspect: "Filing while owning taxpayer is PENDING (never activated) -> 409 ERR_ACCOUNT_NOT_ACTIVE."
        test_recipe:
          setup: ["one PENDING (unactivated) taxpayer; a DRAFT return"]
          setup_api_calls:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "P1", entity_type: "LLC", email: "p1@x.com", filing_frequency: "QUARTERLY" }
              as: Anonymous
              captures: { tp_id: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "CITY", name: "City", rate_bps: 850 }
              as: TaxAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /tax/returns"
              payload: { taxpayer_id: "${tp_id}", period_key: "2026-Q1", period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-03-31T00:00:00Z", filing_due_date: "2026-04-20T00:00:00Z", lines: [ { jurisdiction_id: "${jur_id}", gross_sales_cents: 1000000, exempt_sales_cents: 0, deduction_cents: 0 } ] }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
          trigger:
            - call: "POST /tax/returns/${ret_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409"
            - "response error_id == ERR_ACCOUNT_NOT_ACTIVE"

      - name: close_terminal_audit_rejected
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Audit.OPEN_to_CLOSED_NO_CHANGE", "errors[ERR_AUDIT_NOT_OPEN]"]
        distinguishing_aspect: "Closing an audit already CLOSED_NO_CHANGE -> 409 ERR_AUDIT_NOT_OPEN."
        test_recipe:
          setup: ["one taxpayer; a NEXUS_DISCOVERY audit closed NO_CHANGE"]
          setup_api_calls:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "AudTP", entity_type: "CORP", email: "at@x.com", filing_frequency: "ANNUAL" }
              as: Anonymous
              captures: { tp_id: $.data.id }
            - call: "POST /tax/audits"
              payload: { taxpayer_id: "${tp_id}", audit_type: "NEXUS_DISCOVERY", period_key: "2026", gross_receipts_cents: 5000000 }
              as: TaxAuditor
              as_user_id: "aud-1"
              captures: { audit_id: $.data.id }
            - call: "POST /tax/audits/${audit_id}/close"
              payload: { outcome: "NO_CHANGE" }
              as: TaxAuditor
              as_user_id: "aud-1"
          trigger:
            - call: "POST /tax/audits/${audit_id}/close"
              payload: { outcome: "NO_CHANGE" }
              as: TaxAuditor
              as_user_id: "aud-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409"
            - "response error_id == ERR_AUDIT_NOT_OPEN"

      - name: respond_when_not_info_requested_rejected
        claim_type: Invalid Transitions
        grounds: ["state_machines.Appeal.INFO_REQUESTED_to_SUBMITTED", "errors[ERR_INFO_NOT_REQUESTED]"]
        distinguishing_aspect: "Taxpayer respond on a SUBMITTED (not INFO_REQUESTED) appeal -> 409 ERR_INFO_NOT_REQUESTED."
        test_recipe:
          setup: ["ACTIVE taxpayer; ISSUED assessment; SUBMITTED appeal; clock 2026-04-20"]
          setup_api_calls:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "ApTP", entity_type: "LLC", email: "ap@x.com", filing_frequency: "QUARTERLY" }
              as: Anonymous
              captures: { tp_id: $.data.id }
            - call: "POST /tax/taxpayers/${tp_id}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-20T00:00:00Z" }
              as: TaxAdmin
            - call: "POST /tax/assessments"
              payload: { taxpayer_id: "${tp_id}", assessment_type: "LATE_FILING", tax_deficiency_cents: 100000, original_due_date: "2026-01-20T00:00:00Z" }
              as: TaxAuditor
              as_user_id: "aud-1"
              captures: { asmt_id: $.data.id }
            - call: "POST /tax/appeals"
              payload: { assessment_id: "${asmt_id}", grounds: "Dispute." }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { appeal_id: $.data.id }
          trigger:
            - call: "POST /tax/appeals/${appeal_id}/respond"
              payload: { response_note: "Premature." }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409"
            - "response error_id == ERR_INFO_NOT_REQUESTED"

      - name: appeal_deny_affirms_assessment_keeps_balance
        claim_type: Side Effect Execution
        grounds: ["state_machines.Appeal.SUBMITTED_to_DENIED", "state_machines.Assessment.ISSUED_to_AFFIRMED"]
        distinguishing_aspect: "Deny drives the assessment ISSUED->AFFIRMED and the account_balance_cents retains the assessment total (unchanged by AFFIRMED)."
        test_recipe:
          setup: ["ACTIVE taxpayer; LATE_FILING assessment total 113300; SUBMITTED appeal; clock 2026-04-20"]
          setup_api_calls:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "DenTP", entity_type: "CORP", email: "den@x.com", filing_frequency: "QUARTERLY" }
              as: Anonymous
              captures: { tp_id: $.data.id }
            - call: "POST /tax/taxpayers/${tp_id}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-20T00:00:00Z" }
              as: TaxAdmin
            - call: "POST /tax/assessments"
              payload: { taxpayer_id: "${tp_id}", assessment_type: "LATE_FILING", tax_deficiency_cents: 100000, original_due_date: "2026-01-20T00:00:00Z" }
              as: TaxAuditor
              as_user_id: "aud-1"
              captures: { asmt_id: $.data.id }
            - call: "POST /tax/appeals"
              payload: { assessment_id: "${asmt_id}", grounds: "Dispute." }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { appeal_id: $.data.id }
          trigger:
            - call: "POST /tax/appeals/${appeal_id}/decide"
              payload: { outcome: "DENY" }
              as: AppealsOfficer
              as_user_id: "off-1"
          assert:
            - "Assessment.${asmt_id}.status == AFFIRMED"
            - "Taxpayer.${tp_id}.account_balance_cents == 113300"

  # =========================================================================
  - section: calculations
    instances:
      - name: vendor_discount_zero_when_filed_late
        claim_type: Correct Result
        grounds: ["calculations.vendor_collection_discount", "entities.TaxReturn.fields.vendor_discount_cents"]
        distinguishing_aspect: "Filing one day after filing_due_date (2026-04-21 > 2026-04-20) yields vendor_discount_cents == 0 and net_return_due_cents == tax_due_cents == 68000."
        test_recipe:
          setup: ["ACTIVE taxpayer; DRAFT return due 2026-04-20; clock 2026-04-21 at file"]
          setup_api_calls:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "LateTP", entity_type: "LLC", email: "lt@x.com", filing_frequency: "QUARTERLY" }
              as: Anonymous
              captures: { tp_id: $.data.id }
            - call: "POST /tax/taxpayers/${tp_id}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /tax/jurisdictions"
              payload: { code: "CITY", name: "City", rate_bps: 850 }
              as: TaxAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /tax/returns"
              payload: { taxpayer_id: "${tp_id}", period_key: "2026-Q1", period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-03-31T00:00:00Z", filing_due_date: "2026-04-20T00:00:00Z", lines: [ { jurisdiction_id: "${jur_id}", gross_sales_cents: 1000000, exempt_sales_cents: 200000, deduction_cents: 0 } ] }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-21T00:00:00Z" }
              as: TaxAdmin
          trigger:
            - call: "POST /tax/returns/${ret_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
          assert:
            - "TaxReturn.${ret_id}.vendor_discount_cents == 0"
            - "TaxReturn.${ret_id}.net_return_due_cents == 68000"

      - name: vendor_discount_capped
        claim_type: Constants Applied
        grounds: ["calculations.vendor_collection_discount"]
        distinguishing_aspect: "A large tax_due (10,000,000 -> raw 1.5% = 150000) is capped at VENDOR_DISCOUNT_CAP_CENTS 100000; net_return_due_cents == 9900000 when timely."
        test_recipe:
          setup: ["ACTIVE taxpayer; DRAFT return taxable 100,000,000 at 1000 bps -> tax_due 10,000,000; filed timely"]
          setup_api_calls:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "CapTP", entity_type: "CORP", email: "cap@x.com", filing_frequency: "MONTHLY" }
              as: Anonymous
              captures: { tp_id: $.data.id }
            - call: "POST /tax/taxpayers/${tp_id}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /tax/jurisdictions"
              payload: { code: "BIG", name: "Big", rate_bps: 1000 }
              as: TaxAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /tax/returns"
              payload: { taxpayer_id: "${tp_id}", period_key: "2026-01", period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-01-31T00:00:00Z", filing_due_date: "2026-02-20T00:00:00Z", lines: [ { jurisdiction_id: "${jur_id}", gross_sales_cents: 100000000, exempt_sales_cents: 0, deduction_cents: 0 } ] }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-20T00:00:00Z" }
              as: TaxAdmin
          trigger:
            - call: "POST /tax/returns/${ret_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
          assert:
            - "TaxReturn.${ret_id}.tax_due_cents == 10000000"
            - "TaxReturn.${ret_id}.vendor_discount_cents == 100000"
            - "TaxReturn.${ret_id}.net_return_due_cents == 9900000"

      - name: late_filing_penalty_cap_applied
        claim_type: Constants Applied
        grounds: ["calculations.assessment_penalty_interest"]
        distinguishing_aspect: "LATE_FILING base 6,000,000 -> raw 10% = 600000 capped at LATE_FILING_PENALTY_CAP_CENTS 500000; with 0 months late interest == 0 and total == 6500000."
        test_recipe:
          setup: ["ACTIVE taxpayer; clock equal to original_due_date so months_late == 0"]
          setup_api_calls:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "CapPen", entity_type: "CORP", email: "cp@x.com", filing_frequency: "QUARTERLY" }
              as: Anonymous
              captures: { tp_id: $.data.id }
            - call: "POST /tax/taxpayers/${tp_id}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-20T00:00:00Z" }
              as: TaxAdmin
          trigger:
            - call: "POST /tax/assessments"
              payload: { taxpayer_id: "${tp_id}", assessment_type: "LATE_FILING", tax_deficiency_cents: 6000000, original_due_date: "2026-01-20T00:00:00Z" }
              as: TaxAuditor
              as_user_id: "aud-1"
              captures: { asmt_id: $.data.id }
          assert:
            - "Assessment.${asmt_id}.penalty_cents == 500000"
            - "Assessment.${asmt_id}.interest_cents == 0"
            - "Assessment.${asmt_id}.total_due_cents == 6500000"

      - name: return_taxable_floored_at_zero
        claim_type: Correct Result
        grounds: ["calculations.return_tax_due", "entities.TaxReturn.fields.total_taxable_cents"]
        distinguishing_aspect: "A line whose exempt+deduction exceed gross floors taxable_cents at 0 (max(0,...)); tax_due_cents == 0 for that line."
        test_recipe:
          setup: ["ACTIVE taxpayer; jurisdiction 850 bps; DRAFT return one line gross 100000 exempt 200000"]
          setup_api_calls:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "ZeroTP", entity_type: "LLC", email: "zt@x.com", filing_frequency: "MONTHLY" }
              as: Anonymous
              captures: { tp_id: $.data.id }
            - call: "POST /tax/taxpayers/${tp_id}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /tax/jurisdictions"
              payload: { code: "CITY", name: "City", rate_bps: 850 }
              as: TaxAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /tax/returns"
              payload: { taxpayer_id: "${tp_id}", period_key: "2026-01", period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-01-31T00:00:00Z", filing_due_date: "2026-02-20T00:00:00Z", lines: [ { jurisdiction_id: "${jur_id}", gross_sales_cents: 100000, exempt_sales_cents: 200000, deduction_cents: 0 } ] }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
          trigger:
            - call: "POST /tax/returns/${ret_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
          assert:
            - "TaxReturn.${ret_id}.total_taxable_cents == 0"
            - "TaxReturn.${ret_id}.tax_due_cents == 0"

      - name: nexus_below_threshold_not_established
        claim_type: Correct Result
        grounds: ["calculations.nexus_determination", "entities.Audit.fields.nexus_established"]
        distinguishing_aspect: "gross_receipts_cents 9999999 (threshold-1) -> nexus_established == false (boundary is >=, not >)."
        test_recipe:
          setup: ["one registered taxpayer"]
          setup_api_calls:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "NxTP", entity_type: "CORP", email: "nx@x.com", filing_frequency: "ANNUAL" }
              as: Anonymous
              captures: { tp_id: $.data.id }
          trigger:
            - call: "POST /tax/audits"
              payload: { taxpayer_id: "${tp_id}", audit_type: "NEXUS_DISCOVERY", period_key: "2026", gross_receipts_cents: 9999999 }
              as: TaxAuditor
              as_user_id: "aud-1"
              captures: { audit_id: $.data.id }
          assert:
            - "Audit.${audit_id}.nexus_established == false"

  # =========================================================================
  - section: validations
    instances:
      - name: duplicate_jurisdiction_code_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=9]", "errors[ERR_DUPLICATE_JURISDICTION]"]
        distinguishing_aspect: "Creating a second Jurisdiction with an existing code -> 409 ERR_DUPLICATE_JURISDICTION."
        test_recipe:
          setup: ["one jurisdiction with code CITY"]
          setup_api_calls:
            - call: "POST /tax/jurisdictions"
              payload: { code: "CITY", name: "City", rate_bps: 850 }
              as: TaxAdmin
              captures: { jur_id: $.data.id }
          trigger:
            - call: "POST /tax/jurisdictions"
              payload: { code: "CITY", name: "City Dup", rate_bps: 900 }
              as: TaxAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409"
            - "response error_id == ERR_DUPLICATE_JURISDICTION"

      - name: overapplication_rejected_on_filed_return
        claim_type: Violation → Error
        grounds: ["validations[priority=10]", "errors[ERR_OVERAPPLICATION]", "calculations.remittance_application"]
        distinguishing_aspect: "Applying more than the target FILED return's remaining net due (68000) -> 422 ERR_OVERAPPLICATION."
        test_recipe:
          setup: ["ACTIVE taxpayer; FILED return net due 68000; remittance amount 200000"]
          setup_api_calls:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "OverTP", entity_type: "LLC", email: "ov@x.com", filing_frequency: "QUARTERLY" }
              as: Anonymous
              captures: { tp_id: $.data.id }
            - call: "POST /tax/taxpayers/${tp_id}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /tax/jurisdictions"
              payload: { code: "CITY", name: "City", rate_bps: 850 }
              as: TaxAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: TaxAdmin
            - call: "POST /tax/returns"
              payload: { taxpayer_id: "${tp_id}", period_key: "2026-Q1", period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-03-31T00:00:00Z", filing_due_date: "2026-04-20T00:00:00Z", lines: [ { jurisdiction_id: "${jur_id}", gross_sales_cents: 1000000, exempt_sales_cents: 200000, deduction_cents: 0 } ] }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax/returns/${ret_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /tax/remittances"
              payload: { taxpayer_id: "${tp_id}", remittance_type: "PAYMENT", amount_cents: 200000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { rem_id: $.data.id }
          trigger:
            - call: "POST /tax/remittances/${rem_id}/apply"
              payload: { applied_return_id: "${ret_id}", apply_amount_cents: 100000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 422"
            - "response error_id == ERR_OVERAPPLICATION"

      - name: appeal_after_window_rejected
        claim_type: Temporal validation
        grounds: ["validations[priority=8]", "errors[ERR_APPEAL_WINDOW_CLOSED]"]
        distinguishing_aspect: "Filing an appeal 61 days after issued_at (issued 2026-04-20, filed 2026-06-20 > 60-day window) -> 409 ERR_APPEAL_WINDOW_CLOSED."
        test_recipe:
          setup: ["ACTIVE taxpayer; assessment issued at 2026-04-20; clock advanced to 2026-06-20 before appeal"]
          setup_api_calls:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "WinTP", entity_type: "CORP", email: "w@x.com", filing_frequency: "QUARTERLY" }
              as: Anonymous
              captures: { tp_id: $.data.id }
            - call: "POST /tax/taxpayers/${tp_id}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-20T00:00:00Z" }
              as: TaxAdmin
            - call: "POST /tax/assessments"
              payload: { taxpayer_id: "${tp_id}", assessment_type: "LATE_FILING", tax_deficiency_cents: 100000, original_due_date: "2026-01-20T00:00:00Z" }
              as: TaxAuditor
              as_user_id: "aud-1"
              captures: { asmt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: TaxAdmin
          trigger:
            - call: "POST /tax/appeals"
              payload: { assessment_id: "${asmt_id}", grounds: "Too late." }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409"
            - "response error_id == ERR_APPEAL_WINDOW_CLOSED"

      - name: appeal_on_non_issued_assessment_rejected
        claim_type: Cross-entity validation
        grounds: ["validations[priority=5]", "errors[ERR_ASSESSMENT_NOT_ISSUED]"]
        distinguishing_aspect: "Filing an appeal against an assessment already ABATED -> 409 ERR_ASSESSMENT_NOT_ISSUED."
        test_recipe:
          setup: ["ACTIVE taxpayer; assessment issued then ABATED via a first allowed appeal; clock 2026-04-20"]
          setup_api_calls:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "AbTP", entity_type: "CORP", email: "ab@x.com", filing_frequency: "QUARTERLY" }
              as: Anonymous
              captures: { tp_id: $.data.id }
            - call: "POST /tax/taxpayers/${tp_id}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-20T00:00:00Z" }
              as: TaxAdmin
            - call: "POST /tax/assessments"
              payload: { taxpayer_id: "${tp_id}", assessment_type: "LATE_FILING", tax_deficiency_cents: 100000, original_due_date: "2026-01-20T00:00:00Z" }
              as: TaxAuditor
              as_user_id: "aud-1"
              captures: { asmt_id: $.data.id }
            - call: "POST /tax/appeals"
              payload: { assessment_id: "${asmt_id}", grounds: "First appeal." }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { appeal1_id: $.data.id }
            - call: "POST /tax/appeals/${appeal1_id}/decide"
              payload: { outcome: "ALLOW" }
              as: AppealsOfficer
              as_user_id: "off-1"
          trigger:
            - call: "POST /tax/appeals"
              payload: { assessment_id: "${asmt_id}", grounds: "Second appeal." }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409"
            - "response error_id == ERR_ASSESSMENT_NOT_ISSUED"

  # =========================================================================
  - section: endpoints
    instances:
      - name: list_returns_filtered_by_taxpayer_paginated
        claim_type: Computed read
        grounds: ["endpoints"]
        distinguishing_aspect: "GET /tax/returns?taxpayer_id=... returns an array envelope with total_count and has_more; only that taxpayer's returns appear."
        test_recipe:
          setup: ["ACTIVE taxpayer with one return"]
          setup_api_calls:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "ListTP", entity_type: "LLC", email: "li@x.com", filing_frequency: "QUARTERLY" }
              as: Anonymous
              captures: { tp_id: $.data.id }
            - call: "POST /tax/taxpayers/${tp_id}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /tax/jurisdictions"
              payload: { code: "CITY", name: "City", rate_bps: 850 }
              as: TaxAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /tax/returns"
              payload: { taxpayer_id: "${tp_id}", period_key: "2026-Q1", period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-03-31T00:00:00Z", filing_due_date: "2026-04-20T00:00:00Z", lines: [ { jurisdiction_id: "${jur_id}", gross_sales_cents: 1000000, exempt_sales_cents: 0, deduction_cents: 0 } ] }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
          trigger:
            - call: "GET /tax/returns?taxpayer_id=${tp_id}"
              payload: {}
              as: TaxAdmin
          assert:
            - "HTTP 200; response_type == array"
            - "meta/pagination includes total_count == 1 and has_more == false"
            - "the returned array contains the return ${ret_id}"

      - name: apply_return_not_found
        claim_type: Cross-reference link
        grounds: ["errors[ERR_RETURN_NOT_FOUND]"]
        distinguishing_aspect: "Applying a remittance to a non-existent applied_return_id -> 404 ERR_RETURN_NOT_FOUND."
        test_recipe:
          setup: ["ACTIVE taxpayer; a remittance"]
          setup_api_calls:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "AppTP", entity_type: "LLC", email: "app@x.com", filing_frequency: "QUARTERLY" }
              as: Anonymous
              captures: { tp_id: $.data.id }
            - call: "POST /tax/taxpayers/${tp_id}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /tax/remittances"
              payload: { taxpayer_id: "${tp_id}", remittance_type: "PREPAYMENT", amount_cents: 5000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { rem_id: $.data.id }
          trigger:
            - call: "POST /tax/remittances/${rem_id}/apply"
              payload: { applied_return_id: "00000000-0000-4000-8000-000000000000", apply_amount_cents: 1000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404"
            - "response error_id == ERR_RETURN_NOT_FOUND"

  # =========================================================================
  - section: rbac
    instances:
      - name: taxpayer_cannot_open_audit
        claim_type: peer_roles
        grounds: ["roles"]
        distinguishing_aspect: "A Taxpayer calling POST /tax/audits (a TaxAuditor exclusive op) -> 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["one ACTIVE taxpayer"]
          setup_api_calls:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "RbTP", entity_type: "LLC", email: "rb@x.com", filing_frequency: "QUARTERLY" }
              as: Anonymous
              captures: { tp_id: $.data.id }
            - call: "POST /tax/taxpayers/${tp_id}/activate"
              payload: {}
              as: TaxAdmin
          trigger:
            - call: "POST /tax/audits"
              payload: { taxpayer_id: "${tp_id}", audit_type: "FIELD_AUDIT", period_key: "2026-Q1" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { err_id: $.data.error_id }
          assert:
