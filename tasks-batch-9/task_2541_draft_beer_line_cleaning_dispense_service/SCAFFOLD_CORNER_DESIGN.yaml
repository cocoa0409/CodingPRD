              captures: { rem: $.data.liters_remaining, lstatus: $.data.status }
            - call: "GET /draft-service/cleaning-cycles?line_id=${line1}&compliance_result=PASS&limit=10&offset=0"
              payload: {}
              as: QualityAuditor
              as_user_id: "auditor-1"
              captures: { total: $.total_count, listed: "$.data[0].id" }
          assert:
            - "the create response already carries every derived figure: ${vol} == 2.214, ${sol} == 7, ${presc} == 0.31, ${eff} == 1.993, ${req} == 20, ${grade} == PASS"
            - "${lastc} == 2026-08-05T09:00:00Z, ${due} == 2026-08-26T09:00:00Z, ${od} == 0, ${flag} == COMPLIANT, ${lastchem} == CAUSTIC"
            - "${rem} == 19.690 and ${lstatus} == AVAILABLE"
            - "${total} == 1 and ${listed} == ${cyc}"
            - "no clock move and no second write occurred between the create and these reads"
