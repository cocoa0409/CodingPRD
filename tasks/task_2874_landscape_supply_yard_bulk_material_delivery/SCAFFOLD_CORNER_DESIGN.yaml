              as_user_id: "loader-c1"
          assert:
            - "before the trigger: WillCallTicket.${t_prebuy}.queue_position == 1 and WillCallTicket.${t_plain}.queue_position == 2 (priority beats the earlier request)"
            - "MaterialOrder.${ord_prebuy}.quoted_total_cents == 7200 (4.0 * 1800 locked, no fees on WILL_CALL) and MaterialOrder.${ord_plain}.quoted_total_cents == 8000"
            - "trigger response data.id == ${t_prebuy} with status STAGED"
            - "after the trigger: WillCallTicket.${t_plain}.queue_position == 1 and MaterialOrder.${ord_prebuy}.fulfillment_status == ALLOCATED"

      - name: queue_ranking_tiebreaks_on_created_at_and_skips_future_requests
        claim_type: chronological
        grounds:
          - calculations.will_call_queue_ranking
          - errors[ERR_WILL_CALL_QUEUE_EMPTY]
        distinguishing_aspect: "With priority_class and requested_pickup_at tied, created_at ASC is the final discriminator (never the id), and a ticket whose requested_pickup_at is still in the future keeps a queue_position but is filtered out of the candidate set, so the third stage-next finds an empty queue."
