            - call: "POST /rentals/incidents"
              payload: { reservation_id: "${r1}", incident_type: "SAFETY_THREAT", severity: "HIGH", source: "HOST_REPORT", detected_at: "2026-08-11T01:00:00Z", description: "Guest threatened a neighbour on the shared stairwell." }
              as: Host
              as_user_id: "${h1}"
              captures: { i1: $.data.id }
            - call: "POST /rentals/incidents"
              payload: { reservation_id: "${r1}", incident_type: "PROPERTY_DAMAGE", severity: "MEDIUM", source: "HOST_REPORT", detected_at: "2026-08-11T01:10:00Z", description: "Interior door frame split." }
              as: Host
              as_user_id: "${h1}"
              captures: { i2: $.data.id }
            - call: "POST /rentals/incidents"
              payload: { reservation_id: "${r1}", incident_type: "PROPERTY_DAMAGE", severity: "LOW", source: "HOST_REPORT", detected_at: "2026-08-11T01:20:00Z", description: "Two window screens torn." }
              as: Host
