# §1.8 Scaffold Difficulty Design (Test Targeting Index)
#
# Nine rule_id blocks, two differentiated instances each (18 total). Every
# `grounds:` entry resolves into SCAFFOLD.yaml §1.1-§1.7. Every setup chain
# starts from an empty database and uses only endpoints declared in §1.5.
# Every numeric literal in an `assert:` line was computed by executing the
# corresponding §1.3 formula with its declared constants.
#
# Shared fixture arithmetic (executed, not estimated):
#   Property P1: SLAB, 2000 sq ft, 180 linear ft, FL
#     LIQUID_BARRIER quote = min(round((275.00 + 1500*0.42 + 500*0.35) * 1.00, 2), 4200.00)
#                          = 1080.00 ; target_gallons = ceil(180*1.0 + 20*0.5) = 190
#     base_premium         = round(1080.00 * 0.18, 2)          = 194.40
#     repair cap (R&R)     = round(194.40 * 60.0, 2)           = 11664.00
#     annual_premium       = round(194.40 + 0.004*11664.00, 2) = 241.06
#   Property P2: CRAWLSPACE, 1800 sq ft, 175 linear ft, GA
#     BAIT_STATION quote   = min(round((390.00 + 1500*0.42 + 300*0.35) * 1.15, 2), 3600.00)
#                          = 1293.75 ; target_station_count = ceil(175/10) = 18
#     escalation threshold = ceil(18 * 0.05) = 1
#   Bond term windows from issuance date 2026-09-01:
#     current_term_end 2027-09-01, renewal_window_opens_on 2027-07-03,
#     lapse_date 2027-10-01, reinstatement deadline 2027-12-30,
#     rolled term 2027-09-01 -> 2028-08-31, second lapse_date 2028-09-30

scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: bond_reinstatement_prorated_remainder_vs_full_term_restart
        grounds:
          - calculations.reinstatement_settlement
          - state_machines.Bond.ACTIVE_to_LAPSED
          - state_machines.Bond.LAPSED_to_ACTIVE
          - entities.Bond.fields.current_term_end
          - entities.Bond.fields.reinstatement_count
          - validations[priority=112]
        distinguishing_aspect: |
          Entity domain: Bond term accounting. The same bond, lapsed twice with identical
          annual_premium_usd 241.06, settles for 352.40 with current_term_end 2028-08-31 when
          lapse_days is 15 (PRORATED_REMAINDER keeps the anniversary) and for 414.81 with
          current_term_end 2029-11-14 when lapse_days is 45 (FULL_TERM_RESTART moves it).
        test_recipe:
          setup:
            - "One FL property P1 (SLAB, 2000 sq ft, 180 linear ft) with a COMPLETED liquid-barrier plan."
            - "One REPAIR_AND_RETREAT bond issued 2026-09-01: annual_premium_usd 241.06, current_term_end 2027-09-01, lapse_date-to-be 2027-10-01."
            - "The bond is driven LAPSED, reinstated 15 days after the lapse date, driven LAPSED again, and reinstated 45 days after the second lapse date."
            - "Two REINSTATEMENT-purpose graphs, each completed within 30 days of its reinstatement call and each free of active infestation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { address_line1: "411 Cypress Row", state_code: "FL", construction_type: "SLAB", square_footage: 2000, linear_footage: 180, year_built: 1995, has_attached_structures: false }
              as: ComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Rosa Vance", license_number: "FL-10001", license_state: "FL", license_categories: ["WDO_INSPECTOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { insb: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Dale Ortiz", license_number: "FL-10002", license_state: "FL", license_categories: ["TERMITE_APPLICATOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { insa: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insb}", purpose: "INITIAL", scheduled_start_at: "2026-08-01T13:00:00Z", scheduled_end_at: "2026-08-01T15:00:00Z" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { ins1: $.data.id }
            - call: "POST /inspections/${ins1}/findings"
              payload: { finding_type: "CONDUCIVE_CONDITION", grid_ref: "A1", conducive_code: "EXCESS_MOISTURE", severity: 2 }
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "POST /inspections/${ins1}/graph-complete"
              payload: {}
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "POST /treatment-plans"
              payload: { property_id: "${p1}", inspection_id: "${ins1}", applicator_id: "${insa}", method: "LIQUID_BARRIER", chemical_product_code: "FIPRO_9" }
              as: BranchManager
              captures: { plan1: $.data.id }
            - call: "POST /treatment-plans/${plan1}/approve"
              payload: {}
              as: BranchManager
            - call: "GET /treatment-plans/${plan1}"
              payload: {}
              as: BranchManager
              captures: { pv1: $.data.version }
            - call: "POST /treatment-plans/${plan1}/applications"
              payload: { product_epa_number: "432-1234", gallons_applied: 190.00, concentration_pct: 0.06, expected_treatment_plan_version: "${pv1}" }
              as: Applicator
              as_user_id: "${insa}"
            - call: "POST /treatment-plans/${plan1}/complete"
              payload: {}
              as: Applicator
              as_user_id: "${insa}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /bonds"
              payload: { property_id: "${p1}", treatment_plan_id: "${plan1}", coverage_tier: "REPAIR_AND_RETREAT", conducive_waiver_codes: [] }
              as: BranchManager
              captures: { bond1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-10-05T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /bonds/${bond1}/term-review"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-10-10T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insb}", purpose: "REINSTATEMENT", supersedes_inspection_id: "${ins1}", scheduled_start_at: "2027-10-10T09:00:00Z", scheduled_end_at: "2027-10-10T11:00:00Z" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { ins2: $.data.id }
            - call: "POST /inspections/${ins2}/graph-complete"
              payload: { no_findings_attested: true }
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-10-16T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /bonds/${bond1}/reinstate"
              payload: { reinstatement_inspection_id: "${ins2}", amount_usd: 352.40 }
              as: BranchManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-10-05T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /bonds/${bond1}/term-review"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-11-10T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insb}", purpose: "REINSTATEMENT", supersedes_inspection_id: "${ins2}", scheduled_start_at: "2028-11-10T09:00:00Z", scheduled_end_at: "2028-11-10T11:00:00Z" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { ins3: $.data.id }
            - call: "POST /inspections/${ins3}/graph-complete"
              payload: { no_findings_attested: true }
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-11-14T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /bonds/${bond1}/reinstate"
              payload: { reinstatement_inspection_id: "${ins3}", amount_usd: 414.81 }
              as: BranchManager
          assert:
            - "Bond.${bond1}.annual_premium_usd == 241.06"
            - "after the first reinstatement (lapse_days 15, variant PRORATED_REMAINDER): the accepted amount_usd is 352.40, computed as round(round(241.06 * 350/365, 2) + 95.00 + 1.75*15, 2) = round(231.15 + 95.00 + 26.25, 2)"
            - "after the first reinstatement: Bond.${bond1}.current_term_start == 2027-10-01 and Bond.${bond1}.current_term_end == 2028-08-31 — the pre-lapse anniversary is preserved"
            - "after the first reinstatement: Bond.${bond1}.status == ACTIVE, reinstatement_count == 1, term_index == 2, lapse_date == null"
            - "after the second reinstatement (lapse_days 45, variant FULL_TERM_RESTART): the accepted amount_usd is 414.81, computed as round(241.06 + 95.00 + 1.75*45, 2) = round(241.06 + 95.00 + 78.75, 2)"
            - "after the second reinstatement: Bond.${bond1}.current_term_start == 2028-11-14 and Bond.${bond1}.current_term_end == 2029-11-14 — the anniversary has moved"
            - "after the second reinstatement: Bond.${bond1}.reinstatement_count == 2 and term_index == 3"
            - "variant divergence: 414.81 != 352.40, and the FULL_TERM_RESTART term_end 2029-11-14 is not the PRORATED_REMAINDER anniversary roll 2029-08-31, so the two settlements of the same bond disagree on both money and term geometry"

      - name: claim_exclusion_finding_level_vs_aggregate_proration
        grounds:
          - calculations.claim_exclusion_and_eligibility
          - calculations.claim_payout_waterfall
          - state_machines.DamageClaim.SUBMITTED_to_UNDER_ADJUDICATION
          - state_machines.DamageClaim.UNDER_ADJUDICATION_to_WITHDRAWN
          - entities.GraphFinding.fields.pre_existing
          - entities.GraphFinding.fields.severity
        distinguishing_aspect: |
          Entity domain: DamageClaim damage exclusion (not bond term accounting). Two claims of
          6000.00 verified by graphs carrying byte-identical DAMAGE findings settle at
          eligible_damage_usd 5100.00 under FINDING_LEVEL and 3333.33 under AGGREGATE_PRORATION,
          because the basis selector reads the verifying graph's supersedes_inspection_id.
        test_recipe:
          setup:
            - "P1 bonded REPAIR_AND_RETREAT with repair_liability_cap_usd 11664.00 and an untouched money ledger."
            - "Two verifying graphs, each with DAMAGE cells A1 (3500.00, severity 3, new), B2 (1600.00, severity 2, new) and C3 (2400.00, severity 4, pre-existing)."
            - "Graph V1 supersedes the initial graph (purpose RENEWAL) so the basis selector picks FINDING_LEVEL; graph V2 supersedes nothing (purpose INITIAL) so it picks AGGREGATE_PRORATION."
            - "The first claim is withdrawn before the second is filed, so the single-open-claim constraint is never violated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { address_line1: "411 Cypress Row", state_code: "FL", construction_type: "SLAB", square_footage: 2000, linear_footage: 180, year_built: 1995, has_attached_structures: false }
              as: ComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Rosa Vance", license_number: "FL-10001", license_state: "FL", license_categories: ["WDO_INSPECTOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { insb: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Dale Ortiz", license_number: "FL-10002", license_state: "FL", license_categories: ["TERMITE_APPLICATOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { insa: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insb}", purpose: "INITIAL", scheduled_start_at: "2026-08-01T13:00:00Z", scheduled_end_at: "2026-08-01T15:00:00Z" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { ins1: $.data.id }
            - call: "POST /inspections/${ins1}/graph-complete"
              payload: { no_findings_attested: true }
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "POST /treatment-plans"
              payload: { property_id: "${p1}", inspection_id: "${ins1}", applicator_id: "${insa}", method: "LIQUID_BARRIER", chemical_product_code: "FIPRO_9" }
              as: BranchManager
              captures: { plan1: $.data.id }
            - call: "POST /treatment-plans/${plan1}/approve"
              payload: {}
              as: BranchManager
            - call: "GET /treatment-plans/${plan1}"
              payload: {}
              as: BranchManager
              captures: { pv1: $.data.version }
            - call: "POST /treatment-plans/${plan1}/applications"
              payload: { product_epa_number: "432-1234", gallons_applied: 190.00, concentration_pct: 0.06, expected_treatment_plan_version: "${pv1}" }
              as: Applicator
              as_user_id: "${insa}"
            - call: "POST /treatment-plans/${plan1}/complete"
              payload: {}
              as: Applicator
              as_user_id: "${insa}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /bonds"
              payload: { property_id: "${p1}", treatment_plan_id: "${plan1}", coverage_tier: "REPAIR_AND_RETREAT", conducive_waiver_codes: [] }
              as: BranchManager
              captures: { bond1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-15T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insb}", purpose: "RENEWAL", supersedes_inspection_id: "${ins1}", scheduled_start_at: "2026-10-15T09:00:00Z", scheduled_end_at: "2026-10-15T11:00:00Z" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { v1: $.data.id }
            - call: "POST /inspections/${v1}/findings"
              payload: { finding_type: "DAMAGE", grid_ref: "A1", organism: "SUBTERRANEAN_TERMITE", severity: 3, damage_estimate_usd: 3500.00, pre_existing: false }
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "POST /inspections/${v1}/findings"
              payload: { finding_type: "DAMAGE", grid_ref: "B2", organism: "SUBTERRANEAN_TERMITE", severity: 2, damage_estimate_usd: 1600.00, pre_existing: false }
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "POST /inspections/${v1}/findings"
              payload: { finding_type: "DAMAGE", grid_ref: "C3", organism: "WOOD_BORING_BEETLE", severity: 4, damage_estimate_usd: 2400.00, pre_existing: true }
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "POST /inspections/${v1}/graph-complete"
              payload: {}
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "GET /bonds/${bond1}"
              payload: {}
              as: BranchManager
              captures: { bv1: $.data.version }
            - call: "POST /damage-claims"
              payload: { bond_id: "${bond1}", claim_type: "REPAIR", claimed_damage_usd: 6000.00, expected_bond_version: "${bv1}" }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { claim1: $.data.id }
          trigger:
            - call: "POST /damage-claims/${claim1}/attach-verification"
              payload: { verifying_inspection_id: "${v1}" }
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "POST /damage-claims/${claim1}/withdraw"
              payload: {}
              as: PropertyOwner
              as_user_id: "${p1}"
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insb}", purpose: "INITIAL", scheduled_start_at: "2026-10-20T09:00:00Z", scheduled_end_at: "2026-10-20T11:00:00Z" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { v2: $.data.id }
            - call: "POST /inspections/${v2}/findings"
              payload: { finding_type: "DAMAGE", grid_ref: "A1", organism: "SUBTERRANEAN_TERMITE", severity: 3, damage_estimate_usd: 3500.00, pre_existing: false }
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "POST /inspections/${v2}/findings"
              payload: { finding_type: "DAMAGE", grid_ref: "B2", organism: "SUBTERRANEAN_TERMITE", severity: 2, damage_estimate_usd: 1600.00, pre_existing: false }
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "POST /inspections/${v2}/findings"
              payload: { finding_type: "DAMAGE", grid_ref: "C3", organism: "WOOD_BORING_BEETLE", severity: 4, damage_estimate_usd: 2400.00, pre_existing: true }
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "POST /inspections/${v2}/graph-complete"
              payload: {}
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "GET /bonds/${bond1}"
              payload: {}
              as: BranchManager
              captures: { bv2: $.data.version }
            - call: "POST /damage-claims"
              payload: { bond_id: "${bond1}", claim_type: "REPAIR", claimed_damage_usd: 6000.00, expected_bond_version: "${bv2}" }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { claim2: $.data.id }
            - call: "POST /damage-claims/${claim2}/attach-verification"
              payload: { verifying_inspection_id: "${v2}" }
              as: FieldInspector
              as_user_id: "${insb}"
          assert:
            - "DamageClaim.${claim1}.exclusion_basis == FINDING_LEVEL"
            - "DamageClaim.${claim1}.eligible_damage_usd == 5100.00 — min(6000.00, 3500.00 + 1600.00)"
            - "DamageClaim.${claim1}.excluded_pre_existing_usd == 900.00"
            - "DamageClaim.${claim1}.deductible_usd == 357.00 — round(5100.00 * 0.07, 2)"
            - "DamageClaim.${claim1}.projected_payout_usd == 4743.00"
            - "DamageClaim.${claim2}.exclusion_basis == AGGREGATE_PRORATION"
            - "DamageClaim.${claim2}.eligible_damage_usd == 3333.33 — round(6000.00 * 5/9, 2) over severities 3+2 of 9"
            - "DamageClaim.${claim2}.excluded_pre_existing_usd == 2666.67"
            - "DamageClaim.${claim2}.deductible_usd == 233.33 and projected_payout_usd == 3100.00"
            - "variant divergence: 5100.00 != 3333.33 on byte-identical DAMAGE findings and an identical claimed_damage_usd of 6000.00"
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: renewal_invoice_round_each_component_then_sum
        grounds:
          - calculations.renewal_invoice_total
          - calculations.renewal_invoice_total.constants.RENEWAL_RATE_OF_PREMIUM
          - calculations.renewal_invoice_total.constants.INSPECTION_FEE_PER_100_SQFT
          - state_machines.BondRenewal.PENDING_to_PAID
          - state_machines.Bond.ACTIVE_to_ACTIVE
          - entities.BondRenewal.fields.invoice_total_usd
        distinguishing_aspect: |
          Combinatorial mode (b): NESTED ROUNDING ORDER. Four components are each rounded to 2 dp
          and only then summed. The three-decimal rates 0.345, 2.155, 7.335 and 0.415 are chosen so
          that round-each-then-sum yields 227.19 while sum-then-round-once yields 227.18 — a
          one-cent divergence that also decides whether a 227.19 payment is sufficient.
        test_recipe:
          setup:
            - "P1 (FL, SLAB, 2000 sq ft) bonded 2026-09-01 with annual_premium_usd 241.06 and current_term_end 2027-09-01."
            - "A PENDING renewal opened inside the renewal window (2027-08-20, window opened 2027-07-03), priced provisionally."
            - "A GRAPHED RENEWAL inspection carrying exactly two CONDUCIVE_CONDITION finding rows."
            - "The renewal is completed 3 UTC days past the term end, at clock 2027-09-04, still inside the 30-day grace."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { address_line1: "411 Cypress Row", state_code: "FL", construction_type: "SLAB", square_footage: 2000, linear_footage: 180, year_built: 1995, has_attached_structures: false }
              as: ComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Rosa Vance", license_number: "FL-10001", license_state: "FL", license_categories: ["WDO_INSPECTOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { insb: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Dale Ortiz", license_number: "FL-10002", license_state: "FL", license_categories: ["TERMITE_APPLICATOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { insa: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insb}", purpose: "INITIAL", scheduled_start_at: "2026-08-01T13:00:00Z", scheduled_end_at: "2026-08-01T15:00:00Z" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { ins1: $.data.id }
            - call: "POST /inspections/${ins1}/graph-complete"
              payload: { no_findings_attested: true }
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "POST /treatment-plans"
              payload: { property_id: "${p1}", inspection_id: "${ins1}", applicator_id: "${insa}", method: "LIQUID_BARRIER", chemical_product_code: "FIPRO_9" }
              as: BranchManager
              captures: { plan1: $.data.id }
            - call: "POST /treatment-plans/${plan1}/approve"
              payload: {}
              as: BranchManager
            - call: "GET /treatment-plans/${plan1}"
              payload: {}
              as: BranchManager
              captures: { pv1: $.data.version }
            - call: "POST /treatment-plans/${plan1}/applications"
              payload: { product_epa_number: "432-1234", gallons_applied: 190.00, concentration_pct: 0.06, expected_treatment_plan_version: "${pv1}" }
              as: Applicator
              as_user_id: "${insa}"
            - call: "POST /treatment-plans/${plan1}/complete"
              payload: {}
              as: Applicator
              as_user_id: "${insa}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /bonds"
              payload: { property_id: "${p1}", treatment_plan_id: "${plan1}", coverage_tier: "REPAIR_AND_RETREAT", conducive_waiver_codes: [] }
              as: BranchManager
              captures: { bond1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-08-20T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /bonds/${bond1}/renewals"
              payload: {}
              as: BranchManager
