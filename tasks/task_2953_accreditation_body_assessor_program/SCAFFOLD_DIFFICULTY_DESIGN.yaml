  - rule_id: non_linear_state_machine
    instances:
      - name: nonconformity_response_rejection_and_effectiveness_failure_cycles
        grounds:
          - state_machines.Nonconformity.OPEN_to_RESPONSE_SUBMITTED
          - state_machines.Nonconformity.RESPONSE_SUBMITTED_to_OPEN
          - state_machines.Nonconformity.RESPONSE_SUBMITTED_to_RESPONSE_ACCEPTED
          - state_machines.Nonconformity.RESPONSE_ACCEPTED_to_OPEN
          - entities.Nonconformity.fields.response_round
        distinguishing_aspect: |
          The Nonconformity machine is cyclic through two distinct back-edges that must both be
          traversed in one life: RESPONSE_SUBMITTED -> OPEN on a rejected corrective action, and
          RESPONSE_ACCEPTED -> OPEN on failed effectiveness verification. The finding therefore
          visits OPEN three times, response_round counts only response submissions (so it lands on
          2, not 3), and the failure back-edge must leave the application's blocking ledger
          untouched because the finding never left the blocking set.
        test_recipe:
          setup:
            - "Clock 2026-08-10; one PUBLISHED scheme (witness_min_count 2, critical_nc_close_days 30)."
            - "A GRANTED and screened LEAD_ASSESSOR and a GRANTED and screened TECHNICAL_ASSESSOR, both CONFIRMED on the cycle."
