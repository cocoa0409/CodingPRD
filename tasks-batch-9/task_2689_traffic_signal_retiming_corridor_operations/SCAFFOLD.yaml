scenario: |
  Generate task harder than expert level!

  2689. Traffic Signal Retiming & Corridor Operations (city traffic operations division): signal
  inventory with controller type, detection status and communication connectivity, corridor selection
  for retiming based on age of timing plans, volume changes and complaint history, turning movement
  counts and travel time runs for before-and-after evaluation, timing plan development across cycle
  length, splits and offsets by time of day with coordination, pedestrian timing compliance with
  walking speed standards and accessible signal requirements, transit and emergency vehicle priority
  configuration and conflict management, implementation, field observation and fine tuning with
  citizen feedback, performance measurement on delay, stops and arrivals on green

domain_name: traffic-signal-retiming-corridor-operations
api_prefix: "/signal-ops"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: graph
  # Corridor <-> Intersection is many-to-many through CorridorMember; TimingPlan, PriorityConfig,
  # FieldObservation and TurningMovementCount all reference an Intersection *and* a RetimingProject,
  # so the reference graph is a genuine mesh rather than a tree. URLs are a mix of flat collections
  # and reverse-reachability sub-resources; no path nests deeper than parent/{id}/child-segment.

  state_machine_shape: cyclic
  # RetimingProject loops IMPLEMENTED -> FIELD_TUNING -> PLAN_DEVELOPMENT -> IMPLEMENTED with a
  # bounded tuning_round counter; Corridor loops SCREENED -> DEFERRED -> SCREENED; TimingPlan carries
  # TWO independent state axes (status x ped_compliance_state) plus a SUBMITTED -> DRAFT revert;
  # PriorityConfig carries approval_status x deployment_status as parallel dimensions.

  relationship_patterns:
    - one_to_many        # RetimingProject -> TimingPlan, TimingPlan -> PhaseSplit
    - many_to_many       # Corridor <-> Intersection via CorridorMember
    - cross_aggregate    # TimingPlan (project aggregate) mutates Intersection (inventory aggregate)
    - polymorphic: false

  role_model: segregation_of_duties
  # The TimingEngineer who authored a TimingPlan MUST NOT be the CertifyingEngineer who certifies it
  # (compared on X-User-ID). Priority configs follow the same propose/approve/deploy split across
  # three different roles.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================================
# §1.1 Entity-Relationship Table
# =====================================================================================
entities:
  - name: Intersection
    parent: null
    common_fields: true
    fields:
      - name: location_name
        type: string
        source: input
        description: "Human-readable cross-street label, e.g. `Main St @ 3rd Ave`."
        constraints: "1..120 chars, non-blank"
      - name: controller_type
        type: enum
        source: input
        description: "Cabinet/controller family installed at the intersection."
        constraints: "one of {TS2_CABINET, ATC_CABINET, LEGACY_170}"
      - name: detection_status
        type: enum
        source: input
        default: FULL
        description: "Vehicle-detection health as last field-verified."
        constraints: "one of {FULL, PARTIAL, FAILED, NONE}"
      - name: comm_status
        type: enum
        source: input
        default: ONLINE
        description: "Communication connectivity back to the central signal system."
        constraints: "one of {ONLINE, INTERMITTENT, OFFLINE}"
      - name: aps_installed
        type: boolean
        source: input
        default: false
        description: "True when an Accessible Pedestrian Signal (audible/tactile) is installed."
      - name: walking_speed_standard
        type: enum
        source: input
        default: STD_3_5_FPS
        description: "Walking-speed standard used to size pedestrian clearance at this intersection."
        constraints: "one of {STD_3_5_FPS, EXTENDED_3_0_FPS}; MUST be EXTENDED_3_0_FPS when aps_installed is true"
      - name: pedestrian_recall
        type: boolean
        source: input
        default: false
        description: "True when the pedestrian phase is served on recall every cycle."
      - name: max_cycle_length_sec
        type: integer
        source: input
        default: 150
        description: "Locally adopted ceiling on cycle length for this intersection."
        constraints: "60..240"
      - name: last_retimed_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant at which a TimingPlan for this intersection last reached DEPLOYED; null when never retimed."
      - name: timing_plan_age_days
        type: integer
        source: computed
        description: "Age of the deployed timing in whole days, per calculations.intersection_timing_plan_age_days."
      - name: operational_posture
        type: enum
        source: computed
        description: "Derived gate over detection_status and comm_status, per calculations.intersection_operational_posture."
        constraints: "one of {READY, RESTRICTED, BLOCKED}"
      - name: deployed_coordinated_cycle_sec
        type: integer
        source: computed
        default: null
        description: "cycle_length_sec of this intersection's DEPLOYED TimingPlan with the lowest tod_start_min; null when no plan is DEPLOYED."
      - name: priority_budget_sec
        type: integer
        source: computed
        default: 0
        description: "Per-cycle green-extension budget available to priority requests, per calculations.priority_budget_allocation."
      - name: granted_priority_extension_total_sec
        type: integer
        source: computed
        default: 0
        description: "Sum of granted_extension_sec over this intersection's PriorityConfig rows with deployment_status == DEPLOYED."
      - name: unallocated_priority_budget_sec
        type: integer
        source: computed
        default: 0
        description: "priority_budget_sec minus granted_priority_extension_total_sec; the conserved slack in the priority budget invariant."

  - name: Corridor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Corridor label, e.g. `Main St (1st Ave - 9th Ave)`."
        constraints: "1..120 chars, non-blank, unique across Corridor"
      - name: jurisdiction_class
        type: enum
        source: input
        description: "Functional classification driving the priority-score class multiplier."
        constraints: "one of {ARTERIAL, COLLECTOR, LOCAL}"
      - name: annual_volume_change_pct
        type: number
        source: input
        default: 0
        description: "Signed year-over-year traffic volume change in percent; only its absolute value enters scoring."
        constraints: "-100.0 .. 400.0"
      - name: selection_status
        type: enum
        source: system
        default: UNSCREENED
        description: "Retiming-program selection state, per state_machines.Corridor."
        constraints: "one of {UNSCREENED, SCREENED, SELECTED, DEFERRED}"
      - name: member_count
        type: integer
        source: computed
        default: 0
        description: "Count of CorridorMember rows whose corridor_id equals this Corridor.id."
      - name: avg_plan_age_days
        type: number
        source: computed
        default: 0
        description: "Variant-dependent mean timing-plan age across member intersections, per calculations.corridor_avg_plan_age_days."
      - name: complaint_count_12mo
        type: integer
        source: computed
        default: 0
        description: "Count of CitizenComplaint rows in the trailing 12-month window, per calculations.corridor_complaint_count_12mo."
      - name: complaint_total_count
        type: integer
        source: computed
        default: 0
        description: "Count of ALL CitizenComplaint rows whose corridor_id equals this Corridor.id, regardless of status or age."
      - name: complaint_open_count
        type: integer
        source: computed
        default: 0
        description: "Count of this corridor's CitizenComplaint rows with status IN {OPEN, TRIAGED}."
      - name: complaint_linked_count
        type: integer
        source: computed
        default: 0
        description: "Count of this corridor's CitizenComplaint rows with status == LINKED."
      - name: complaint_terminal_count
        type: integer
        source: computed
        default: 0
        description: "Count of this corridor's CitizenComplaint rows with status IN {RESOLVED, CLOSED_NO_ACTION}."
      - name: priority_score
        type: number
        source: computed
        default: 0
        description: "0..100 retiming priority score, per calculations.corridor_priority_score."
      - name: priority_score_variant
        type: enum
        source: computed
        default: null
        description: "Which variant produced the current priority_score; null before first screening."
        constraints: "one of {SCREENING, PROGRAMMING, null}"
      - name: screened_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the most recent successful screen call; null while UNSCREENED."

  - name: CorridorMember
    parent: Corridor
    common_fields: false
    fields:
      - name: corridor_id
        type: string
        source: input
        description: "FK -> Corridor.id; the corridor this membership belongs to."
      - name: intersection_id
        type: string
        source: input
        description: "FK -> Intersection.id; the signalized intersection enrolled in the corridor."
      - name: sequence_index
        type: integer
        source: input
        description: "1-based position along the corridor in the primary progression direction."
        constraints: ">= 1; unique within corridor_id; MUST equal (current member_count + 1) at creation so indices stay gap-free"
      - name: distance_from_prev_ft
        type: number
        source: input
        default: 0
        description: "Centerline distance in feet from the member at sequence_index - 1."
        constraints: ">= 0; MUST be exactly 0 when sequence_index == 1"

  - name: Requester
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: "Name the citizen gave when registering for feedback follow-up."
        constraints: "1..80 chars, non-blank"
      - name: email
        type: string
        source: input
        description: "Contact email; the natural key for a requester."
        constraints: "must contain `@`; unique across Requester"
      - name: contact_pref
        type: enum
        source: input
        default: EMAIL
        description: "How the division may follow up on a complaint."
        constraints: "one of {EMAIL, PHONE, NONE}"
      - name: open_complaint_count
        type: integer
        source: computed
        default: 0
        description: "Count of this requester's CitizenComplaint rows with status IN {OPEN, TRIAGED, LINKED}."

  - name: CitizenComplaint
    parent: null
    common_fields: true
    fields:
      - name: requester_id
        type: string
        source: input
        description: "FK -> Requester.id; the citizen who filed the complaint."
      - name: corridor_id
        type: string
        source: input
        description: "FK -> Corridor.id; the corridor the complaint is about."
      - name: linked_project_id
        type: string
        source: system
        default: null
        description: "FK -> RetimingProject.id; null until the complaint reaches LINKED, cleared again when it is requeued to OPEN."
      - name: category
        type: enum
        source: input
        description: "Complaint taxonomy used by the coordination-requeue cascade."
        constraints: "one of {COORDINATION, PEDESTRIAN, DETECTION, TIMING_OTHER}"
      - name: narrative
        type: string
        source: input
        description: "Free-text description supplied by the citizen."
        constraints: "1..1000 chars, non-blank"
      - name: received_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the complaint was filed; drives the trailing 12-month window."
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "Complaint lifecycle state, per state_machines.CitizenComplaint."
        constraints: "one of {OPEN, TRIAGED, LINKED, RESOLVED, CLOSED_NO_ACTION}"
      - name: reopen_count
        type: integer
        source: system
        default: 0
        description: "Number of times this complaint has re-entered OPEN from RESOLVED or from the coordination-requeue cascade."

  - name: RetimingProject
    parent: Corridor
    common_fields: true
    fields:
      - name: corridor_id
        type: string
        source: input
        description: "FK -> Corridor.id; the corridor being retimed."
      - name: status
        type: enum
        source: system
        default: DATA_COLLECTION
        description: "Project lifecycle state, per state_machines.RetimingProject."
        constraints: "one of {DATA_COLLECTION, PLAN_DEVELOPMENT, IMPLEMENTED, FIELD_TUNING, EVALUATION, CLOSED, ABANDONED}"
      - name: study_window_start_at
        type: datetime
        source: input
        description: "Instant from which before-study data is considered fresh."
      - name: study_window_days
        type: integer
        source: input
        default: 180
        description: "Length of the study freshness window in whole days."
        constraints: "30..730"
      - name: tuning_round
        type: integer
        source: system
        default: 0
        description: "Number of completed FIELD_TUNING -> PLAN_DEVELOPMENT loops; bounded by MAX_TUNING_ROUNDS."
      - name: last_tuning_completed_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the most recent FIELD_TUNING -> EVALUATION transition; the cutoff that the certified performance variant applies to AFTER travel-time runs."
      - name: lead_engineer_user_id
        type: string
        source: input
        description: "Opaque X-User-ID of the TimingEngineer accountable for the project."
        constraints: "1..64 chars, non-blank"
      - name: eligible_member_count
        type: integer
        source: computed
        default: 0
        description: "Count of this project's corridor members whose Intersection.operational_posture IN {READY, RESTRICTED}."

  - name: TurningMovementCount
    parent: RetimingProject
    common_fields: false
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> RetimingProject.id; the study this count belongs to."
      - name: intersection_id
        type: string
        source: input
        description: "FK -> Intersection.id; the counted intersection."
      - name: study_role
        type: enum
        source: input
        description: "Whether this count is part of the before study or the after study."
        constraints: "one of {BEFORE, AFTER}"
      - name: count_date
        type: datetime
        source: input
        description: "Instant the count was collected in the field."
      - name: period
        type: enum
        source: input
        description: "Time-of-day period the count represents."
        constraints: "one of {AM_PEAK, MID_DAY, PM_PEAK}"
      - name: phase_volumes
        type: object
        source: input
        description: "Map of phase number (string key `1`..`8`) to that phase's critical lane volume in vehicles per hour."
        constraints: "1..8 entries; keys are decimal strings in 1..8; values are integers 0..2000"
      - name: critical_flow_ratio_sum
        type: number
        source: computed
        description: "Sum of phase_volumes values divided by SATURATION_FLOW_VPHPL, per calculations.intersection_recommended_cycle_length."
      - name: recommended_cycle_sec
        type: integer
        source: computed
        description: "Webster-style cycle length recommended by this count, per calculations.intersection_recommended_cycle_length."

  - name: TravelTimeRun
    parent: RetimingProject
    common_fields: false
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> RetimingProject.id; the study this floating-car run belongs to."
      - name: study_role
        type: enum
        source: input
        description: "Whether this run is part of the before study or the after study."
        constraints: "one of {BEFORE, AFTER}"
      - name: direction
        type: enum
        source: input
        description: "Direction of travel for the run."
        constraints: "one of {NB, SB, EB, WB}"
      - name: started_at
        type: datetime
        source: input
        description: "Instant the probe vehicle entered the corridor."
      - name: duration_sec
        type: number
        source: input
        description: "End-to-end corridor travel time in seconds."
        constraints: "> 0; <= 3600"
      - name: stops_count
        type: integer
        source: input
        description: "Number of full stops observed on the run."
        constraints: ">= 0"
      - name: arrivals_on_green_count
        type: integer
        source: input
        description: "Number of signal arrivals during green on the run."
        constraints: ">= 0; <= total_arrivals"
      - name: total_arrivals
        type: integer
        source: input
        description: "Number of signal arrivals observed on the run; doubles as the run's weight in the certified metric variant."
        constraints: ">= 1"
      - name: recorded_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the run row was created; compared against RetimingProject.last_tuning_completed_at by the certified variant."

  - name: TimingPlan
    parent: RetimingProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> RetimingProject.id; the retiming project that develops this plan."
      - name: intersection_id
        type: string
        source: input
        description: "FK -> Intersection.id; the intersection the plan controls."
      - name: tod_period
        type: enum
        source: input
        description: "Time-of-day label for the plan."
        constraints: "one of {AM_PEAK, MID_DAY, PM_PEAK, OFF_PEAK}"
      - name: tod_start_min
        type: integer
        source: input
        description: "Inclusive start of the plan's time-of-day window, in minutes after local midnight."
        constraints: "0..1439"
      - name: tod_end_min
        type: integer
        source: input
        description: "Exclusive end of the plan's time-of-day window, in minutes after local midnight."
        constraints: "1..1440; MUST be > tod_start_min (no wrap-around windows)"
      - name: coordination_ref
        type: enum
        source: input
        default: MASTER
        description: "MASTER means the plan takes the corridor coordinated cycle and an offset; LOCAL_FREE means the plan runs free and keeps offset_sec 0."
        constraints: "one of {MASTER, LOCAL_FREE}"
      - name: cycle_length_sec
        type: integer
        source: input
        description: "Operating cycle length in seconds; overwritten with the corridor coordinated cycle by the coordinate transition when coordination_ref == MASTER."
        constraints: "60..240; <= Intersection.max_cycle_length_sec"
      - name: drafted_cycle_length_sec
        type: integer
        source: system
        description: "Snapshot of cycle_length_sec as supplied at creation; restored by the return transition."
      - name: offset_sec
        type: integer
        source: computed
        default: 0
        description: "Coordination offset assigned by calculations.timing_plan_offset_assignment; always 0 when coordination_ref == LOCAL_FREE."
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Plan workflow axis, per state_machines.TimingPlan."
        constraints: "one of {DRAFT, COORDINATED, SUBMITTED, CERTIFIED, DEPLOYED, SUPERSEDED}"
      - name: ped_compliance_state
        type: enum
        source: system
        default: PENDING
        description: "Pedestrian-compliance axis, evolving independently of status, per state_machines.TimingPlan."
        constraints: "one of {PENDING, COMPLIANT, NON_COMPLIANT, WAIVED}"
      - name: drafted_split_total_sec
        type: integer
        source: computed
        default: 0
        description: "Sum of PhaseSplit.split_sec over this plan's phases; the conserved quantity in the split-second invariant."
      - name: effective_split_total_sec
        type: integer
        source: computed
        default: 0
        description: "Sum of PhaseSplit.effective_split_sec over this plan's phases; MUST equal cycle_length_sec once status is COORDINATED or beyond."
      - name: authored_by_user_id
        type: string
        source: system
        description: "X-User-ID of the TimingEngineer who created the plan; the segregation-of-duties comparand."
      - name: certified_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the CertifyingEngineer who certified the plan; null until CERTIFIED."
      - name: return_count
        type: integer
        source: system
        default: 0
        description: "Number of SUBMITTED -> DRAFT returns this plan has taken."

  - name: PhaseSplit
    parent: TimingPlan
    common_fields: true
    fields:
      - name: timing_plan_id
        type: string
        source: input
        description: "FK -> TimingPlan.id; the plan this phase belongs to."
      - name: phase_number
        type: integer
        source: input
        description: "NEMA phase number."
        constraints: "1..8; unique within timing_plan_id"
      - name: split_sec
        type: integer
        source: input
        description: "Drafted split in seconds, inclusive of green, yellow and red clearance."
        constraints: ">= 5; <= 240"
      - name: effective_split_sec
        type: integer
        source: computed
        default: 0
        description: "Split after rescaling to the plan's operating cycle, per calculations.timing_plan_split_rescale; equals split_sec while the plan is DRAFT."
      - name: min_green_sec
        type: integer
        source: input
        description: "Minimum green time the controller must serve for this phase."
        constraints: ">= 1; <= 60"
      - name: yellow_sec
        type: number
        source: input
        description: "Yellow change interval in seconds."
        constraints: "3.0 .. 6.0"
      - name: red_clearance_sec
        type: number
        source: input
        description: "All-red clearance interval in seconds."
        constraints: "0.0 .. 6.0"
      - name: is_pedestrian_phase
        type: boolean
        source: input
        default: false
        description: "True when this phase serves a pedestrian crossing and must satisfy pedestrian timing."
      - name: walk_sec
        type: number
        source: input
        default: 0
        description: "WALK interval provided for this phase."
        constraints: ">= 0; MUST be > 0 when is_pedestrian_phase is true"
      - name: ped_clear_sec
        type: number
        source: input
        default: 0
        description: "Pedestrian change (flashing DON'T WALK) interval provided for this phase."
        constraints: ">= 0; MUST be > 0 when is_pedestrian_phase is true"
      - name: crosswalk_length_ft
        type: number
        source: input
        default: 0
        description: "Curb-to-curb crossing distance for this phase's crosswalk."
        constraints: ">= 0; MUST be > 0 when is_pedestrian_phase is true"

  - name: PedestrianComplianceCheck
    parent: TimingPlan
    common_fields: true
    fields:
      - name: timing_plan_id
        type: string
        source: input
        description: "FK -> TimingPlan.id; the plan whose pedestrian timing was evaluated."
      - name: phase_number
        type: integer
        source: system
        description: "NEMA phase number of the evaluated PhaseSplit."
      - name: walking_speed_fps
        type: number
        source: computed
        description: "Walking speed applied, derived from Intersection.walking_speed_standard."
      - name: required_ped_clear_sec
        type: number
        source: computed
        description: "Minimum pedestrian change interval required, per calculations.pedestrian_clearance_requirement."
      - name: provided_ped_clear_sec
        type: number
        source: system
        description: "PhaseSplit.ped_clear_sec snapshot at evaluation time."
      - name: required_walk_sec
        type: number
        source: computed
        description: "Minimum WALK interval required (APS-dependent), per calculations.pedestrian_clearance_requirement."
      - name: provided_walk_sec
        type: number
        source: system
        description: "PhaseSplit.walk_sec snapshot at evaluation time."
      - name: required_phase_length_sec
        type: number
        source: computed
        description: "walk + ped clear + yellow + red clearance the phase must accommodate, per calculations.pedestrian_clearance_requirement."
      - name: provided_phase_length_sec
        type: number
        source: system
        description: "PhaseSplit.effective_split_sec snapshot at evaluation time (post-rescale, not the drafted split)."
      - name: result
        type: enum
        source: system
        description: "Outcome of the evaluation."
        constraints: "one of {PASS, FAIL, WAIVED}"
      - name: failure_reason
        type: enum
        source: system
        default: null
        description: "First failing sub-check in the pinned order; null when result is PASS."
        constraints: "one of {PED_CLEAR_SHORT, WALK_SHORT, PHASE_TOO_SHORT, null}"
      - name: waived_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the CertifyingEngineer who waived this failing check; null unless result is WAIVED."
      - name: waiver_justification
        type: string
        source: system
        default: null
        description: "Justification text captured with the waiver; null unless result is WAIVED."

  - name: PriorityConfig
    parent: Intersection
    common_fields: true
    fields:
      - name: intersection_id
        type: string
        source: input
        description: "FK -> Intersection.id; the intersection this priority treatment applies to."
      - name: priority_type
        type: enum
        source: input
        description: "TSP is transit signal priority; EVP is emergency vehicle preemption."
        constraints: "one of {TSP, EVP}"
      - name: approval_status
        type: enum
        source: system
        default: PROPOSED
        description: "Approval axis, per state_machines.PriorityConfig."
        constraints: "one of {PROPOSED, APPROVED, REJECTED}"
      - name: deployment_status
        type: enum
        source: system
        default: NOT_DEPLOYED
        description: "Deployment axis, evolving independently of approval_status, per state_machines.PriorityConfig."
        constraints: "one of {NOT_DEPLOYED, DEPLOYED, SUSPENDED}"
      - name: requested_max_extension_sec
        type: integer
        source: input
        description: "Green extension in seconds this treatment asks for each cycle."
        constraints: "1..40"
      - name: max_early_green_sec
        type: integer
        source: input
        default: 0
        description: "Early-green (red truncation) allowance in seconds."
        constraints: "0..20"
      - name: conflict_resolution_rank
        type: integer
        source: input
        description: "Allocation rank within priority_type; lower rank is served first."
        constraints: "1..9; unique per (intersection_id, priority_type) among rows with deployment_status != SUSPENDED"
      - name: granted_extension_sec
        type: integer
        source: computed
        default: 0
        description: "Extension actually granted after the waterfall allocation, per calculations.priority_budget_allocation; 0 while not DEPLOYED."
      - name: proposed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the TimingEngineer who proposed the config."
      - name: approved_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the CertifyingEngineer who approved the config; null until APPROVED."

  - name: FieldObservation
    parent: RetimingProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> RetimingProject.id; the project the observation was logged under."
      - name: intersection_id
        type: string
        source: input
        description: "FK -> Intersection.id; the observed intersection."
      - name: tod_period
        type: enum
        source: input
        description: "Time-of-day period observed; selects which DEPLOYED TimingPlan the adjustment cascade reopens."
        constraints: "one of {AM_PEAK, MID_DAY, PM_PEAK, OFF_PEAK}"
      - name: observed_at
        type: datetime
        source: input
        description: "Instant the observation was made in the field."
      - name: finding_code
        type: enum
        source: input
        description: "Structured field finding."
        constraints: "one of {QUEUE_SPILLBACK, EARLY_RETURN_TO_GREEN, PED_CALL_MISSED, DETECTION_FAULT, PROGRESSION_BREAK, NONE}"
      - name: requires_adjustment
        type: boolean
        source: input
        default: false
        description: "True when the finding demands a timing change; drives the fine-tuning cascade."
      - name: resolution_status
        type: enum
        source: system
        default: OPEN
        description: "Whether the finding has been addressed."
        constraints: "one of {OPEN, ADDRESSED, DISMISSED}"
      - name: observer_user_id
        type: string
        source: system
        description: "X-User-ID of the FieldTechnician who logged the observation."

  - name: PerformanceEvaluation
    parent: RetimingProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> RetimingProject.id; the project being evaluated."
      - name: status
        type: enum
        source: system
        default: PROVISIONAL
        description: "Evaluation lifecycle state, per state_machines.PerformanceEvaluation."
        constraints: "one of {PROVISIONAL, CERTIFIED, INVALIDATED, SUPERSEDED}"
      - name: metric_variant
        type: enum
        source: computed
        default: PROVISIONAL_UNWEIGHTED
        description: "Which variant of calculations.corridor_performance_metrics produced the stored numbers."
        constraints: "one of {PROVISIONAL_UNWEIGHTED, CERTIFIED_WEIGHTED}"
      - name: mean_travel_time_before_sec
        type: number
        source: computed
        description: "Mean corridor travel time over included BEFORE runs, 2dp."
      - name: mean_travel_time_after_sec
        type: number
        source: computed
        description: "Mean corridor travel time over included AFTER runs, 2dp."
      - name: delay_reduction_pct
        type: number
        source: computed
        description: "Percent reduction in mean travel time, 2dp."
      - name: total_stops_before
        type: integer
        source: computed
        description: "Sum of stops_count over included BEFORE runs."
      - name: total_stops_after
        type: integer
        source: computed
        description: "Sum of stops_count over included AFTER runs."
      - name: stops_reduction_pct
        type: number
        source: computed
        description: "Percent reduction in total stops, 2dp."
      - name: aog_pct_before
        type: number
        source: computed
        description: "Arrivals-on-green percentage over included BEFORE runs, 2dp."
      - name: aog_pct_after
        type: number
        source: computed
        description: "Arrivals-on-green percentage over included AFTER runs, 2dp."
      - name: included_after_run_count
        type: integer
        source: computed
        description: "Number of AFTER TravelTimeRun rows that entered the computation under the active variant."
      - name: certified_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the CertifyingEngineer who certified the evaluation; null until CERTIFIED."

# =====================================================================================
# §1.2 State Machine Table
# =====================================================================================
state_machines:

  - entity: Corridor
    initial_state: UNSCREENED
    terminal_states: []
    note: |
      Cyclic on the selection axis: SCREENED -> DEFERRED -> SCREENED is a legal loop, and a corridor
      whose project closes returns to SCREENED for the next program cycle. There is no terminal state
      because a corridor is perpetually re-screenable.
    transitions:
      - from: UNSCREENED
        to: SCREENED
        trigger: "POST /signal-ops/corridors/{id}/screen"
        actor: SignalOpsAdmin
        preconditions:
          - "member_count >= 1"
          - "at least one CorridorMember whose Intersection.operational_posture IN {READY, RESTRICTED} exists, else ERR_NO_ELIGIBLE_MEMBERS"
        side_effects:
          - "recompute Corridor.member_count as count of CorridorMember rows with corridor_id == this Corridor.id"
          - "recompute Corridor.complaint_total_count, complaint_open_count, complaint_linked_count, complaint_terminal_count"
          - "recompute Corridor.complaint_count_12mo per calculations.corridor_complaint_count_12mo"
          - "recompute Corridor.avg_plan_age_days per calculations.corridor_avg_plan_age_days using the screening_variant included set"
          - "recompute Corridor.priority_score per calculations.corridor_priority_score, variant screening_variant"
          - "set Corridor.priority_score_variant := SCREENING"
          - "set Corridor.screened_at := logical clock now"
          - "increments Corridor.version by 1"

      - from: SCREENED
        to: SELECTED
        trigger: "POST /signal-ops/corridors/{id}/selection-decision with decision == SELECT"
        actor: SignalOpsAdmin
        preconditions:
          - "selection_status == SCREENED, else ERR_CORRIDOR_NOT_SCREENED"
          - "priority_score recomputed under programming_variant >= SELECT_SCORE_THRESHOLD (50.00), else ERR_SCORE_BELOW_SELECT_THRESHOLD"
          - "no RetimingProject with corridor_id == this Corridor.id and status NOT IN {CLOSED, ABANDONED}, else ERR_CORRIDOR_PROJECT_ACTIVE"
        side_effects:
          - "recompute Corridor.complaint_count_12mo per calculations.corridor_complaint_count_12mo"
          - "recompute Corridor.avg_plan_age_days per calculations.corridor_avg_plan_age_days using the programming_variant included set"
          - "recompute Corridor.priority_score per calculations.corridor_priority_score, variant programming_variant"
          - "set Corridor.priority_score_variant := PROGRAMMING"
          - "increments Corridor.version by 1"

      - from: SCREENED
        to: DEFERRED
        trigger: "POST /signal-ops/corridors/{id}/selection-decision with decision == DEFER"
        actor: SignalOpsAdmin
        preconditions:
          - "selection_status == SCREENED, else ERR_CORRIDOR_NOT_SCREENED"
        side_effects:
          - "recompute Corridor.complaint_count_12mo, avg_plan_age_days and priority_score under programming_variant"
          - "set Corridor.priority_score_variant := PROGRAMMING"
          - "increments Corridor.version by 1"

      - from: DEFERRED
        to: SCREENED
        trigger: "POST /signal-ops/corridors/{id}/screen"
        actor: SignalOpsAdmin
        preconditions:
          - "member_count >= 1"
          - "at least one CorridorMember whose Intersection.operational_posture IN {READY, RESTRICTED} exists, else ERR_NO_ELIGIBLE_MEMBERS"
        side_effects:
          - "same recomputation set as UNSCREENED -> SCREENED, under screening_variant"
          - "set Corridor.priority_score_variant := SCREENING"
          - "set Corridor.screened_at := logical clock now"
          - "increments Corridor.version by 1"
        note: "Closes the selection cycle — a deferred corridor is re-screened in the next program cycle."

      - from: SELECTED
        to: SCREENED
        trigger: "POST /signal-ops/corridors/{id}/screen"
        actor: SignalOpsAdmin
        preconditions:
          - "no RetimingProject with corridor_id == this Corridor.id and status NOT IN {CLOSED, ABANDONED}, else ERR_CORRIDOR_PROJECT_ACTIVE"
          - "at least one CorridorMember whose Intersection.operational_posture IN {READY, RESTRICTED} exists, else ERR_NO_ELIGIBLE_MEMBERS"
        side_effects:
          - "same recomputation set as UNSCREENED -> SCREENED, under screening_variant"
          - "set Corridor.priority_score_variant := SCREENING"
          - "increments Corridor.version by 1"

      - from: SCREENED
        to: DEFERRED
        trigger: "system event — cascade link 4 of the implementation cascade fired by POST /signal-ops/retiming-projects/{id}/implement"
        actor: system
        preconditions:
          - "this Corridor has a CorridorMember pointing at an Intersection whose last_retimed_at was just refreshed by cascade link 3"
          - "selection_status == SCREENED"
          - "Corridor.priority_score, recomputed under programming_variant with the refreshed ages, < DEFER_SCORE_THRESHOLD (35.00)"
        side_effects:
          - "recompute Corridor.avg_plan_age_days and Corridor.priority_score under programming_variant; set priority_score_variant := PROGRAMMING"
          - "set Corridor.selection_status := DEFERRED"
          - "increments Corridor.version by 1"
          - "CASCADE LINK 5: because this Corridor just entered DEFERRED, every CitizenComplaint with corridor_id == this Corridor.id, status == TRIAGED and category == COORDINATION transitions TRIAGED -> OPEN (processed in created_at ASC order); complaints of any other category, and complaints already in OPEN, LINKED, RESOLVED or CLOSED_NO_ACTION, are left untouched"

  - entity: RetimingProject
    initial_state: DATA_COLLECTION
    terminal_states: [CLOSED, ABANDONED]
    note: |
      Cyclic: IMPLEMENTED -> FIELD_TUNING -> PLAN_DEVELOPMENT -> IMPLEMENTED. The loop terminates
      because each FIELD_TUNING -> PLAN_DEVELOPMENT hop increments tuning_round and the transition is
      refused once tuning_round would exceed MAX_TUNING_ROUNDS (3).
    transitions:
      - from: DATA_COLLECTION
        to: PLAN_DEVELOPMENT
        trigger: "POST /signal-ops/retiming-projects/{id}/advance"
        actor: TimingEngineer
        preconditions:
          - "status == DATA_COLLECTION, else ERR_PROJECT_NOT_IN_DATA_COLLECTION"
          - "every CorridorMember of this project's corridor whose Intersection.operational_posture IN {READY, RESTRICTED} has >= 1 TurningMovementCount with project_id == this project and study_role == BEFORE, else ERR_BEFORE_STUDY_INCOMPLETE"
          - "at least 1 TravelTimeRun with project_id == this project and study_role == BEFORE exists, else ERR_BEFORE_STUDY_INCOMPLETE"
          - "logical clock now < study_window_start_at + study_window_days days (the deadline instant itself is already expired), else ERR_STUDY_WINDOW_EXPIRED"
        side_effects:
          - "recompute RetimingProject.eligible_member_count"
          - "increments RetimingProject.version by 1"

      - from: PLAN_DEVELOPMENT
        to: IMPLEMENTED
        trigger: "POST /signal-ops/retiming-projects/{id}/implement"
        actor: TimingEngineer
        preconditions:
          - "status == PLAN_DEVELOPMENT, else ERR_PROJECT_NOT_IN_PLAN_DEVELOPMENT"
          - "every CorridorMember of this project's corridor whose Intersection.operational_posture IN {READY, RESTRICTED} has >= 1 TimingPlan with project_id == this project and status == CERTIFIED, else ERR_PLAN_COVERAGE_INCOMPLETE"
        side_effects:
          - "CASCADE LINK 1: set RetimingProject.status := IMPLEMENTED; increments RetimingProject.version by 1"
          - "CASCADE LINK 2: because the project entered IMPLEMENTED, every TimingPlan with project_id == this project and status == CERTIFIED transitions CERTIFIED -> DEPLOYED, processed in (Intersection sequence_index ASC, TimingPlan.tod_start_min ASC) order"
          - "CASCADE LINK 3: because each of those plans entered DEPLOYED, (i) any other TimingPlan on the same (intersection_id, tod_period) already in DEPLOYED transitions DEPLOYED -> SUPERSEDED, and (ii) that plan's Intersection has last_retimed_at := logical clock now, timing_plan_age_days := 0, deployed_coordinated_cycle_sec / priority_budget_sec / granted_priority_extension_total_sec / unallocated_priority_budget_sec recomputed, version incremented"
          - "CASCADE LINK 4: because those Intersection.last_retimed_at values changed, every Corridor holding a CorridorMember for any touched Intersection recomputes avg_plan_age_days and priority_score under programming_variant (processed in Corridor.created_at ASC order); a Corridor whose recomputed priority_score < DEFER_SCORE_THRESHOLD (35.00) and whose selection_status == SCREENED transitions SCREENED -> DEFERRED"
          - "CASCADE LINK 5: because those Corridors entered DEFERRED, each of their CitizenComplaint rows with status == TRIAGED and category == COORDINATION transitions TRIAGED -> OPEN (created_at ASC order), incrementing reopen_count by 1; the Corridor complaint bucket counters are re-derived (both TRIAGED and OPEN live in complaint_open_count, so the partition totals are unchanged)"

      - from: IMPLEMENTED
        to: FIELD_TUNING
        trigger: "POST /signal-ops/retiming-projects/{id}/field-tuning with action == START"
        actor: SignalOpsAdmin
        preconditions:
          - "status == IMPLEMENTED, else ERR_PROJECT_NOT_IMPLEMENTED"
        side_effects:
          - "increments RetimingProject.version by 1"

      - from: FIELD_TUNING
        to: PLAN_DEVELOPMENT
        trigger: "system event — cascade link 3 of the fine-tuning cascade fired by POST /signal-ops/field-observations with requires_adjustment == true"
        actor: system
        preconditions:
          - "status == FIELD_TUNING"
          - "cascade link 2 actually reopened a DEPLOYED TimingPlan (a plan matching the observation's intersection_id and tod_period existed in DEPLOYED)"
          - "tuning_round + 1 <= MAX_TUNING_ROUNDS (3), else the whole POST /signal-ops/field-observations request is rejected with ERR_TUNING_ROUND_LIMIT and no FieldObservation row is created"
        side_effects:
          - "set RetimingProject.status := PLAN_DEVELOPMENT; increments tuning_round by 1; increments RetimingProject.version by 1"
          - "CASCADE LINK 4: because the project left FIELD_TUNING, every PerformanceEvaluation with project_id == this project and status == PROVISIONAL transitions PROVISIONAL -> INVALIDATED (processed in created_at ASC order)"

      - from: FIELD_TUNING
        to: EVALUATION
        trigger: "POST /signal-ops/retiming-projects/{id}/field-tuning with action == COMPLETE"
        actor: SignalOpsAdmin
        preconditions:
          - "status == FIELD_TUNING, else ERR_PROJECT_NOT_IN_FIELD_TUNING"
          - "every FieldObservation with project_id == this project has resolution_status IN {ADDRESSED, DISMISSED}, else ERR_INVALID_REQUEST"
        side_effects:
          - "set RetimingProject.last_tuning_completed_at := logical clock now"
          - "increments RetimingProject.version by 1"

      - from: EVALUATION
        to: CLOSED
        trigger: "POST /signal-ops/retiming-projects/{id}/close with disposition == CLOSED"
        actor: SignalOpsAdmin
        preconditions:
          - "status == EVALUATION, else ERR_PROJECT_NOT_IN_EVALUATION"
          - "at least 1 PerformanceEvaluation with project_id == this project and status == CERTIFIED exists, else ERR_EVALUATION_NOT_FOUND"
        side_effects:
          - "increments RetimingProject.version by 1"
          - "every CitizenComplaint with linked_project_id == this project and status == LINKED transitions LINKED -> RESOLVED (created_at ASC order); the Corridor's complaint bucket counters are refreshed"

      - from: DATA_COLLECTION
        to: ABANDONED
        trigger: "POST /signal-ops/retiming-projects/{id}/close with disposition == ABANDONED"
        actor: SignalOpsAdmin
        preconditions:
          - "status IN {DATA_COLLECTION, PLAN_DEVELOPMENT}, else ERR_PROJECT_TERMINAL"
        side_effects:
          - "every TimingPlan with project_id == this project and status IN {DRAFT, COORDINATED, SUBMITTED, CERTIFIED} transitions to SUPERSEDED (created_at ASC order)"
          - "every CitizenComplaint with linked_project_id == this project and status == LINKED transitions LINKED -> OPEN, clearing linked_project_id and incrementing reopen_count by 1"
          - "increments RetimingProject.version by 1"

      - from: PLAN_DEVELOPMENT
        to: ABANDONED
        trigger: "POST /signal-ops/retiming-projects/{id}/close with disposition == ABANDONED"
        actor: SignalOpsAdmin
        preconditions:
          - "status IN {DATA_COLLECTION, PLAN_DEVELOPMENT}, else ERR_PROJECT_TERMINAL"
        side_effects:
          - "identical to the DATA_COLLECTION -> ABANDONED side-effect set"

  - entity: TimingPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    note: |
      PARALLEL STATE DIMENSIONS on one row. Axis A is `status`
      (DRAFT -> COORDINATED -> SUBMITTED -> CERTIFIED -> DEPLOYED -> SUPERSEDED, with SUBMITTED -> DRAFT
      revert and DEPLOYED -> DRAFT reopen). Axis B is `ped_compliance_state`
      (PENDING -> COMPLIANT | NON_COMPLIANT, and NON_COMPLIANT -> WAIVED) which advances only through
      the coordinate transition and the pedestrian-check waiver, never through certify/implement.
      Axis B can move (NON_COMPLIANT -> WAIVED) while axis A stands still at COORDINATED, and axis A
      moves SUBMITTED -> CERTIFIED without touching axis B.
    transitions:
      - from: DRAFT
        to: COORDINATED
        trigger: "POST /signal-ops/retiming-projects/{id}/coordinate"
        actor: TimingEngineer
        preconditions:
          - "RetimingProject.status == PLAN_DEVELOPMENT, else ERR_PROJECT_NOT_IN_PLAN_DEVELOPMENT"
          - "every TimingPlan with project_id == this project has status == DRAFT, else ERR_PLAN_NOT_DRAFT"
          - "at least one TimingPlan exists for the project, else ERR_INVALID_REQUEST"
          - "every eligible member intersection with a DRAFT plan has >= 1 BEFORE TurningMovementCount, else ERR_BEFORE_STUDY_INCOMPLETE"
          - "no TurningMovementCount feeding the pipeline has critical_flow_ratio_sum >= OVERSATURATION_RATIO (0.95), else ERR_OVERSATURATED_APPROACH"
          - "the corridor coordinated cycle must not exceed any participating Intersection.max_cycle_length_sec, else ERR_CYCLE_EXCEEDS_LOCAL_MAX"
        side_effects:
          - "PIPELINE STEP 1: for every BEFORE TurningMovementCount of the project, compute critical_flow_ratio_sum and recommended_cycle_sec per calculations.intersection_recommended_cycle_length"
          - "PIPELINE STEP 2: compute the corridor coordinated cycle per calculations.corridor_coordinated_cycle_length"
          - "PIPELINE STEP 3: for every DRAFT plan with coordination_ref == MASTER, overwrite TimingPlan.cycle_length_sec := the coordinated cycle from step 2 (drafted_cycle_length_sec is left untouched)"
          - "PIPELINE STEP 4: for every DRAFT plan, rescale its PhaseSplit rows per calculations.timing_plan_split_rescale and write PhaseSplit.effective_split_sec; refresh TimingPlan.effective_split_total_sec and drafted_split_total_sec"
          - "PIPELINE STEP 5: for every DRAFT plan, assign TimingPlan.offset_sec per calculations.timing_plan_offset_assignment"
          - "PIPELINE STEP 6: for every DRAFT plan, evaluate pedestrian timing per calculations.pedestrian_clearance_requirement AGAINST THE STEP-4 effective_split_sec values (never against split_sec); create one PedestrianComplianceCheck row per PhaseSplit with is_pedestrian_phase == true, in phase_number ASC order"
          - "PIPELINE STEP 7: set TimingPlan.ped_compliance_state := COMPLIANT when every created check has result == PASS, otherwise NON_COMPLIANT"
          - "PIPELINE STEP 8: set TimingPlan.status := COORDINATED; increments TimingPlan.version by 1 for every touched plan; increments RetimingProject.version by 1"
        note: "Steps 3 -> 4 -> 6 are order-pinned: evaluating step 6 before step 4 would compare pedestrian minimums against the drafted splits and can flip PASS/FAIL."

      - from: COORDINATED
        to: SUBMITTED
        trigger: "POST /signal-ops/timing-plans/{id}/submit"
        actor: TimingEngineer
        preconditions:
          - "status == COORDINATED, else ERR_PLAN_NOT_COORDINATED"
          - "ped_compliance_state IN {COMPLIANT, WAIVED}, else ERR_PED_CLEARANCE_INSUFFICIENT"
          - "for every PhaseSplit of the plan, effective_split_sec >= min_green_sec + yellow_sec + red_clearance_sec, else ERR_MIN_GREEN_VIOLATION"
          - "no other TimingPlan on the same intersection_id with status IN {COORDINATED, SUBMITTED, CERTIFIED, DEPLOYED} has a time-of-day window overlapping [tod_start_min, tod_end_min), else ERR_TOD_WINDOW_OVERLAP"
        side_effects:
          - "increments TimingPlan.version by 1"

      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /signal-ops/timing-plans/{id}/certify"
        actor: CertifyingEngineer
        preconditions:
          - "X-User-ID != TimingPlan.authored_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "status == SUBMITTED, else ERR_PLAN_NOT_SUBMITTED"
          - "Intersection.operational_posture != BLOCKED, else ERR_POSTURE_BLOCKS_CERTIFICATION"
        side_effects:
          - "set TimingPlan.certified_by_user_id := X-User-ID"
          - "increments TimingPlan.version by 1"

      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /signal-ops/timing-plans/{id}/return"
        actor: CertifyingEngineer
        preconditions:
          - "status == SUBMITTED, else ERR_PLAN_NOT_SUBMITTED"
        side_effects:
          - "COMPENSATION: restore TimingPlan.cycle_length_sec := drafted_cycle_length_sec"
          - "COMPENSATION: for every PhaseSplit of the plan set effective_split_sec := split_sec (phase_number ASC order)"
          - "COMPENSATION: set TimingPlan.offset_sec := 0, ped_compliance_state := PENDING, effective_split_total_sec := drafted_split_total_sec"
          - "delete every PedestrianComplianceCheck row with timing_plan_id == this plan"
          - "increments TimingPlan.return_count by 1; increments TimingPlan.version by 1"
        note: "Exact inverse of the coordinate transition — the split-second invariant must hold with zero drift afterwards."

      - from: CERTIFIED
        to: DEPLOYED
        trigger: "system event — cascade link 2 fired by POST /signal-ops/retiming-projects/{id}/implement"
        actor: system
        preconditions:
          - "status == CERTIFIED"
          - "RetimingProject.status just became IMPLEMENTED"
        side_effects:
          - "see RetimingProject PLAN_DEVELOPMENT -> IMPLEMENTED cascade links 3, 4 and 5"

      - from: DEPLOYED
        to: SUPERSEDED
        trigger: "system event — cascade link 3 fired when a newer plan for the same (intersection_id, tod_period) reaches DEPLOYED"
        actor: system
        preconditions:
          - "status == DEPLOYED"
          - "another TimingPlan with the same intersection_id and tod_period, and a strictly later created_at, just entered DEPLOYED"
        side_effects:
          - "increments TimingPlan.version by 1"

      - from: DEPLOYED
        to: DRAFT
        trigger: "system event — cascade link 2 of the fine-tuning cascade fired by POST /signal-ops/field-observations with requires_adjustment == true"
        actor: system
        preconditions:
          - "status == DEPLOYED"
          - "TimingPlan.intersection_id == FieldObservation.intersection_id and TimingPlan.tod_period == FieldObservation.tod_period"
          - "when more than one plan matches, the one with the greatest created_at is selected"
        side_effects:
          - "set TimingPlan.cycle_length_sec := drafted_cycle_length_sec, offset_sec := 0, ped_compliance_state := PENDING"
          - "for every PhaseSplit set effective_split_sec := split_sec; set effective_split_total_sec := drafted_split_total_sec"
          - "delete every PedestrianComplianceCheck row with timing_plan_id == this plan"
          - "increments TimingPlan.version by 1"
          - "CASCADE LINK 3: because this plan left DEPLOYED, its RetimingProject transitions FIELD_TUNING -> PLAN_DEVELOPMENT (see that transition for link 4)"

      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /signal-ops/timing-plans (create-with-supersede)"
        actor: TimingEngineer
        preconditions:
          - "status == DRAFT"
          - "a new TimingPlan is being created with the same (project_id, intersection_id, tod_period)"
          - "the create request's expected_project_version matches RetimingProject.version, else ERR_STALE_PROJECT_VERSION"
        side_effects:
          - "increments TimingPlan.version by 1"
        note: "This is the true race resolved by concurrency_rules.timing-plan-create-stale-project."

  - entity: PedestrianComplianceCheck
    initial_state: PASS
    terminal_states: [PASS, WAIVED]
    note: "Rows are minted by the coordinate pipeline in either PASS or FAIL; only FAIL is non-terminal."
    transitions:
      - from: FAIL
        to: WAIVED
        trigger: "POST /signal-ops/pedestrian-checks/{id}/waive"
        actor: CertifyingEngineer
        preconditions:
          - "result == FAIL, else ERR_PED_CHECK_NOT_FAILING"
          - "the parent TimingPlan.status == COORDINATED, else ERR_PLAN_NOT_COORDINATED"
          - "X-User-ID != parent TimingPlan.authored_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "set result := WAIVED, waived_by_user_id := X-User-ID, waiver_justification := request justification"
          - "increments PedestrianComplianceCheck.version by 1"
          - "BUBBLE UP: when no PedestrianComplianceCheck row of the parent plan has result == FAIL any more, set parent TimingPlan.ped_compliance_state := WAIVED and increment that plan's version by 1"

  - entity: PriorityConfig
    initial_state: PROPOSED
    terminal_states: [REJECTED]
    note: |
      PARALLEL STATE DIMENSIONS: `approval_status` (PROPOSED -> APPROVED | REJECTED) and
      `deployment_status` (NOT_DEPLOYED -> DEPLOYED -> SUSPENDED -> DEPLOYED) advance independently on
      the same row. deployment_status may only leave NOT_DEPLOYED once approval_status == APPROVED,
      but approval_status never changes as a consequence of a deployment move.
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /signal-ops/priority-configs/{id}/approve with decision == APPROVE"
        actor: CertifyingEngineer
        preconditions:
          - "approval_status == PROPOSED, else ERR_CONFIG_NOT_PROPOSED"
          - "X-User-ID != PriorityConfig.proposed_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "set approved_by_user_id := X-User-ID; increments PriorityConfig.version by 1"

      - from: PROPOSED
        to: REJECTED
        trigger: "POST /signal-ops/priority-configs/{id}/approve with decision == REJECT"
        actor: CertifyingEngineer
        preconditions:
          - "approval_status == PROPOSED, else ERR_CONFIG_NOT_PROPOSED"
          - "X-User-ID != PriorityConfig.proposed_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "increments PriorityConfig.version by 1"

      - from: NOT_DEPLOYED
        to: DEPLOYED
        trigger: "POST /signal-ops/priority-configs/{id}/deploy"
        actor: SignalOpsAdmin
        preconditions:
          - "approval_status == APPROVED, else ERR_CONFIG_NOT_APPROVED"
          - "deployment_status IN {NOT_DEPLOYED, SUSPENDED}, else ERR_CONFIG_NOT_DEPLOYED"
          - "Intersection.operational_posture == READY, else ERR_POSTURE_BLOCKS_DEPLOYMENT"
          - "at least 1 TimingPlan with this intersection_id and status == DEPLOYED exists, else ERR_PLAN_COVERAGE_INCOMPLETE"
          - "after running calculations.priority_budget_allocation, a config with priority_type == EVP must receive granted_extension_sec > 0, else ERR_PRIORITY_BUDGET_EXHAUSTED"
        side_effects:
          - "set deployment_status := DEPLOYED"
          - "re-run calculations.priority_budget_allocation for the whole intersection and rewrite granted_extension_sec on every DEPLOYED config of that intersection"
          - "recompute Intersection.priority_budget_sec, granted_priority_extension_total_sec and unallocated_priority_budget_sec; increments Intersection.version by 1"
          - "increments PriorityConfig.version by 1"

      - from: SUSPENDED
        to: DEPLOYED
        trigger: "POST /signal-ops/priority-configs/{id}/deploy"
        actor: SignalOpsAdmin
        preconditions:
          - "identical to the NOT_DEPLOYED -> DEPLOYED precondition set"
        side_effects:
          - "identical to the NOT_DEPLOYED -> DEPLOYED side-effect set"

      - from: DEPLOYED
        to: SUSPENDED
        trigger: "POST /signal-ops/priority-configs/{id}/suspend"
        actor: SignalOpsAdmin
        preconditions:
          - "deployment_status == DEPLOYED, else ERR_CONFIG_NOT_DEPLOYED"
        side_effects:
          - "COMPENSATION: set deployment_status := SUSPENDED and granted_extension_sec := 0"
          - "re-run calculations.priority_budget_allocation over the remaining DEPLOYED configs of that intersection"
          - "recompute Intersection.priority_budget_sec, granted_priority_extension_total_sec and unallocated_priority_budget_sec; increments Intersection.version by 1"
          - "increments PriorityConfig.version by 1"

  - entity: CitizenComplaint
    initial_state: OPEN
    terminal_states: [CLOSED_NO_ACTION]
    note: "Cyclic: RESOLVED -> OPEN via reopen, LINKED -> OPEN via the project ABANDONED cascade, and TRIAGED -> OPEN via the corridor auto-defer requeue (cascade link 5)."
    transitions:
      - from: OPEN
        to: TRIAGED
        trigger: "POST /signal-ops/complaints/{id}/triage with disposition == TRIAGE"
        actor: CitizenLiaison
        preconditions:
          - "status == OPEN, else ERR_COMPLAINT_INVALID_STATE"
        side_effects:
          - "refresh Corridor complaint bucket counters (open/linked/terminal/total) and Requester.open_complaint_count"
          - "increments CitizenComplaint.version by 1"

      - from: OPEN
        to: CLOSED_NO_ACTION
        trigger: "POST /signal-ops/complaints/{id}/triage with disposition == NO_ACTION"
        actor: CitizenLiaison
        preconditions:
          - "status == OPEN, else ERR_COMPLAINT_INVALID_STATE"
        side_effects:
          - "refresh Corridor complaint bucket counters and Requester.open_complaint_count"
          - "increments CitizenComplaint.version by 1"

      - from: TRIAGED
        to: LINKED
        trigger: "POST /signal-ops/complaints/{id}/link"
        actor: CitizenLiaison
        preconditions:
          - "status == TRIAGED, else ERR_COMPLAINT_INVALID_STATE"
          - "the referenced RetimingProject.corridor_id == CitizenComplaint.corridor_id, else ERR_COMPLAINT_PROJECT_MISMATCH"
          - "the referenced RetimingProject.status NOT IN {CLOSED, ABANDONED}, else ERR_PROJECT_TERMINAL"
        side_effects:
          - "set linked_project_id := the referenced project id"
          - "decrement Corridor.complaint_open_count by 1 and increment Corridor.complaint_linked_count by 1"
          - "increments CitizenComplaint.version by 1"

      - from: LINKED
        to: RESOLVED
        trigger: "POST /signal-ops/complaints/{id}/resolve"
        actor: CitizenLiaison
        preconditions:
          - "status == LINKED, else ERR_COMPLAINT_INVALID_STATE"
          - "linked_project_id references a RetimingProject with status IN {EVALUATION, CLOSED}, else ERR_PROJECT_NOT_IN_EVALUATION"
        side_effects:
          - "decrement Corridor.complaint_linked_count by 1 and increment Corridor.complaint_terminal_count by 1"
          - "decrement Requester.open_complaint_count by 1"
          - "increments CitizenComplaint.version by 1"

      - from: RESOLVED
        to: OPEN
        trigger: "POST /signal-ops/complaints/{id}/reopen"
        actor: CitizenLiaison
        preconditions:
          - "status == RESOLVED, else ERR_COMPLAINT_INVALID_STATE"
        side_effects:
          - "set linked_project_id := null; increments reopen_count by 1"
          - "decrement Corridor.complaint_terminal_count by 1 and increment Corridor.complaint_open_count by 1"
          - "increment Requester.open_complaint_count by 1"
          - "increments CitizenComplaint.version by 1"

      - from: LINKED
        to: OPEN
        trigger: "system event — the RetimingProject ABANDONED cascade fired by POST /signal-ops/retiming-projects/{id}/close with disposition == ABANDONED"
        actor: system
        preconditions:
          - "status == LINKED"
          - "linked_project_id == the project being abandoned (any category)"
        side_effects:
          - "set linked_project_id := null; increments reopen_count by 1"
          - "COMPENSATION: decrement Corridor.complaint_linked_count by 1 and increment Corridor.complaint_open_count by 1, restoring the partition to its pre-link values"
          - "increment Requester.open_complaint_count by 0 (LINKED already counted in the requester's open bucket, so the requester counter is unchanged)"
          - "increments CitizenComplaint.version by 1"

      - from: TRIAGED
        to: OPEN
        trigger: "system event — cascade link 5 of the implementation cascade (the corridor auto-defer requeue)"
        actor: system
        preconditions:
          - "status == TRIAGED"
          - "category == COORDINATION"
          - "the owning Corridor just transitioned SCREENED -> DEFERRED in cascade link 4"
        side_effects:
          - "increments reopen_count by 1"
          - "Corridor.complaint_open_count is unchanged because TRIAGED and OPEN are both in the open bucket; complaint_linked_count and complaint_terminal_count are unchanged"
          - "Requester.open_complaint_count is unchanged for the same reason"
          - "increments CitizenComplaint.version by 1"

  - entity: PerformanceEvaluation
    initial_state: PROVISIONAL
    terminal_states: [CERTIFIED, INVALIDATED, SUPERSEDED]
    transitions:
      - from: PROVISIONAL
        to: CERTIFIED
        trigger: "POST /signal-ops/performance-evaluations/{id}/certify"
        actor: CertifyingEngineer
        preconditions:
          - "status == PROVISIONAL, else ERR_EVALUATION_NOT_PROVISIONAL"
          - "RetimingProject.status == EVALUATION, else ERR_PROJECT_NOT_IN_EVALUATION"
          - "RetimingProject.last_tuning_completed_at is not null, else ERR_INVALID_REQUEST"
          - "at least 1 AFTER TravelTimeRun with recorded_at >= RetimingProject.last_tuning_completed_at exists, else ERR_NO_AFTER_STUDY"
        side_effects:
          - "set metric_variant := CERTIFIED_WEIGHTED and RECOMPUTE every metric field per calculations.corridor_performance_metrics under certified_variant"
          - "set certified_by_user_id := X-User-ID; set status := CERTIFIED"
          - "increments PerformanceEvaluation.version by 1"

      - from: PROVISIONAL
        to: SUPERSEDED
        trigger: "POST /signal-ops/retiming-projects/{id}/performance-evaluations (create-with-supersede)"
        actor: CertifyingEngineer
        preconditions:
          - "status == PROVISIONAL"
          - "a new PerformanceEvaluation is being created for the same project_id"
        side_effects:
          - "increments PerformanceEvaluation.version by 1"

      - from: PROVISIONAL
        to: INVALIDATED
        trigger: "system event — cascade link 4 of the fine-tuning cascade"
        actor: system
        preconditions:
          - "status == PROVISIONAL"
          - "the parent RetimingProject just transitioned FIELD_TUNING -> PLAN_DEVELOPMENT"
        side_effects:
          - "increments PerformanceEvaluation.version by 1"

# =====================================================================================
# §1.2.1 Concurrency Rules (OCC on a parent entity's `version` — the only sanctioned mechanism)
# =====================================================================================
concurrency_rules:
  - rule_id: timing-plan-create-stale-project
    parent_entity: RetimingProject
    write_endpoint: "POST /signal-ops/timing-plans"
    occ_field: "expected_project_version"
    description: |
      Creating a TimingPlan against a RetimingProject whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has already created a plan
      for the same (project_id, intersection_id, tod_period) — which legitimately supersedes the prior
      DRAFT plan per state_machines.TimingPlan DRAFT -> SUPERSEDED — leaving this writer's view of the
      project stale.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

  - rule_id: priority-config-create-stale-intersection
    parent_entity: Intersection
    write_endpoint: "POST /signal-ops/priority-configs"
    occ_field: "expected_intersection_version"
    description: |
      Creating a PriorityConfig against an Intersection whose version has advanced since the client
      last observed it is rejected. The intersection's version moves whenever its deployed coordinated
      cycle, and therefore its priority_budget_sec, is recomputed; a config proposed against a stale
      budget view would claim extension seconds that no longer exist, so the write is refused on the
      stale version rather than silently re-ranked.
    error_id: ERR_STALE_INTERSECTION_VERSION
    http_status: 412

# =====================================================================================
# §1.3 Calculation Rules Table
# =====================================================================================
calculations:

  - name: intersection_operational_posture
    trigger: "On every read or write that materialises an Intersection, and on every POST /signal-ops/intersections and PATCH /signal-ops/intersections/{id}"
    algorithm: threshold
    formula: |
      if comm_status == OFFLINE or detection_status == FAILED:
          operational_posture = BLOCKED
      elif comm_status == INTERMITTENT or detection_status IN {PARTIAL, NONE}:
          operational_posture = RESTRICTED
      else:
          operational_posture = READY
    input_set: "Only the Intersection's own comm_status and detection_status fields; no child rows participate."
    constants: {}
    precision: "Enumerated value, no rounding"

  - name: intersection_timing_plan_age_days
    trigger: "On every read or write that materialises an Intersection, and as the per-member age term inside calculations.corridor_avg_plan_age_days"
    algorithm: aggregation
    formula: |
      if last_retimed_at is null:
          timing_plan_age_days = NEVER_RETIMED_AGE_DAYS
      else:
          elapsed_sec = (logical_clock_now - last_retimed_at) in whole seconds
          timing_plan_age_days = floor(elapsed_sec / 86400)      # truncate, never round
    input_set: "The Intersection's last_retimed_at against the logical clock; ignores TimingPlan rows entirely."
    constants:
      NEVER_RETIMED_AGE_DAYS: 3650
    precision: "Whole days, floor (truncating) division"

  - name: corridor_complaint_count_12mo
    trigger: "Corridor UNSCREENED|DEFERRED|SELECTED -> SCREENED, and Corridor SCREENED -> SELECTED|DEFERRED"
    algorithm: aggregation
    formula: |
      window_lower_bound = logical_clock_now - COMPLAINT_WINDOW_DAYS days      # INCLUSIVE
      window_upper_bound = logical_clock_now                                   # INCLUSIVE
      complaint_count_12mo = count of CitizenComplaint rows where
          corridor_id == Corridor.id
          AND status IN {OPEN, TRIAGED, LINKED, RESOLVED}          # CLOSED_NO_ACTION is EXCLUDED
          AND received_at >= window_lower_bound
          AND received_at <= window_upper_bound
    input_set: |
      Source entity CitizenComplaint filtered on the explicit status set {OPEN, TRIAGED, LINKED, RESOLVED};
      window is the CLOSED interval [now - 365 days, now]; a complaint whose received_at equals the lower
      bound to the second IS counted, one second earlier is not. The count is order-insensitive so no
      tie-break is required.
    constants:
      COMPLAINT_WINDOW_DAYS: 365
    precision: "Integer count"

  - name: corridor_avg_plan_age_days
    trigger: "Corridor UNSCREENED|DEFERRED|SELECTED -> SCREENED (screening_variant); Corridor SCREENED -> SELECTED|DEFERRED and implementation cascade link 4 (programming_variant)"
    algorithm: aggregation
    formula: |
      members = CorridorMember rows with corridor_id == Corridor.id, enumerated in sequence_index ASC order
      included = members filtered by the ACTIVE VARIANT's predicate (see variants)
      if included is empty:
          avg_plan_age_days = 0.00        # and the caller raises ERR_NO_ELIGIBLE_MEMBERS for screening
      else:
          ages = [ calculations.intersection_timing_plan_age_days(m.intersection_id) for m in included ]
          avg_plan_age_days = round_half_up(sum(ages) / count(included), 2)
    input_set: |
      Source entity CorridorMember joined to Intersection. The included set is pinned per variant below;
      enumeration order is sequence_index ASC (irrelevant to the sum but pinned so the rounding of the
      mean is reproducible). No tie-break needed — the result is a mean, not a selection.
    constants: {}
    precision: "2 decimal places, round_half_up, applied ONCE to the mean (never to individual ages)"
    variants:
      - name: screening_variant
        when: "Any transition into SCREENED (POST /signal-ops/corridors/{id}/screen)"
        difference: "included = members whose Intersection.operational_posture IN {READY, RESTRICTED}; BLOCKED members are dropped from both numerator and denominator."
      - name: programming_variant
        when: "POST /signal-ops/corridors/{id}/selection-decision (either decision) and implementation cascade link 4"
        difference: "included = ALL members regardless of Intersection.operational_posture; BLOCKED members contribute their (typically stale, therefore age-inflating or age-deflating) age to the mean."

  - name: corridor_priority_score
    trigger: "Corridor UNSCREENED|DEFERRED|SELECTED -> SCREENED, Corridor SCREENED -> SELECTED|DEFERRED, and implementation cascade link 4"
    algorithm: weighted_scoring
    formula: |
      # DUAL VARIANT: the score is a pure function of avg_plan_age_days, so whichever
      # calculations.corridor_avg_plan_age_days variant ran determines the number.
      plan_age_component  = min(1.0, Corridor.avg_plan_age_days / AGE_SATURATION_DAYS)
      volume_component    = min(1.0, abs(Corridor.annual_volume_change_pct) / VOLUME_SATURATION_PCT)
      complaint_component = min(1.0, Corridor.complaint_count_12mo / COMPLAINT_SATURATION_COUNT)
      class_multiplier    = CLASS_MULTIPLIER[Corridor.jurisdiction_class]
      raw = ( WEIGHT_AGE       * plan_age_component
            + WEIGHT_VOLUME    * volume_component
            + WEIGHT_COMPLAINT * complaint_component ) * class_multiplier
      priority_score = round_half_up(min(1.0, raw) * 100.0, 2)
      # NOTE: components are NEVER individually rounded; the single rounding step is the last line.
    input_set: "The Corridor's own avg_plan_age_days (variant-dependent), annual_volume_change_pct, complaint_count_12mo and jurisdiction_class."
    constants:
      AGE_SATURATION_DAYS: 1825
      VOLUME_SATURATION_PCT: 25.0
      COMPLAINT_SATURATION_COUNT: 20
      WEIGHT_AGE: 0.45
      WEIGHT_VOLUME: 0.35
      WEIGHT_COMPLAINT: 0.20
      CLASS_MULTIPLIER: { ARTERIAL: 1.25, COLLECTOR: 1.00, LOCAL: 0.80 }
      SELECT_SCORE_THRESHOLD: 50.00
      DEFER_SCORE_THRESHOLD: 35.00
    precision: "2 decimal places, round_half_up, applied once to the final percentage"
    variants:
      - name: screening_variant
        when: "Computed during any transition into SCREENED; writes priority_score_variant := SCREENING"
        difference: "Consumes the screening_variant avg_plan_age_days (BLOCKED members excluded), so a corridor with one very stale but BLOCKED member and one freshly retimed READY member scores HIGHER here than under the programming variant when the stale member is the READY one."
      - name: programming_variant
        when: "Computed during SCREENED -> SELECTED|DEFERRED and during implementation cascade link 4; writes priority_score_variant := PROGRAMMING"
        difference: "Consumes the programming_variant avg_plan_age_days (all members included), producing a strictly different score whenever at least one member is BLOCKED and its age differs from the eligible members' mean."

  - name: intersection_recommended_cycle_length
    trigger: "Pipeline step 1 of the TimingPlan DRAFT -> COORDINATED transition (POST /signal-ops/retiming-projects/{id}/coordinate), and on POST /signal-ops/intersections/{id}/turning-movement-counts"
    algorithm: threshold
    formula: |
      volumes = the values of TurningMovementCount.phase_volumes, enumerated by integer key ASC
      phase_count = count(volumes)
      critical_flow_ratio_sum = sum(volumes) / SATURATION_FLOW_VPHPL          # exact, unrounded
      if critical_flow_ratio_sum >= OVERSATURATION_RATIO:                     # >= , NOT >
          raise ERR_OVERSATURATED_APPROACH
      lost_time_sec = phase_count * LOST_TIME_PER_PHASE_SEC
      webster_cycle = (1.5 * lost_time_sec + 5.0) / (1.0 - critical_flow_ratio_sum)
      rounded_up = ceil(webster_cycle / CYCLE_ROUNDING_MULTIPLE_SEC) * CYCLE_ROUNDING_MULTIPLE_SEC
      recommended_cycle_sec = max(MIN_CYCLE_SEC, min(rounded_up, Intersection.max_cycle_length_sec))
    input_set: |
      Exactly one TurningMovementCount per intersection feeds the pipeline: the row with project_id == the
      project, intersection_id == the member, study_role == BEFORE, selected as the one with the greatest
      count_date; tie-break when two rows share count_date: greatest created_at; further tie-break: period
      ordered PM_PEAK > AM_PEAK > MID_DAY. If no such row exists the coordinate call fails with
      ERR_BEFORE_STUDY_INCOMPLETE.
    constants:
      SATURATION_FLOW_VPHPL: 1800
      LOST_TIME_PER_PHASE_SEC: 4.0
      OVERSATURATION_RATIO: 0.95
      CYCLE_ROUNDING_MULTIPLE_SEC: 5
      MIN_CYCLE_SEC: 60
    precision: "critical_flow_ratio_sum stored to 4 decimal places round_half_up; recommended_cycle_sec is a whole multiple of 5 seconds (ceiling before clamping, clamp applied last)"

  - name: corridor_coordinated_cycle_length
    trigger: "Pipeline step 2 of the TimingPlan DRAFT -> COORDINATED transition"
    algorithm: constraint_propagation
    formula: |
      participants = CorridorMember rows of the project's corridor, sequence_index ASC, restricted to
                     members that (a) have Intersection.operational_posture IN {READY, RESTRICTED} AND
                     (b) have at least one DRAFT TimingPlan for this project with coordination_ref == MASTER
      if participants is empty:
          coordinated_cycle_sec = null   # nothing is coordinated; every plan keeps its drafted cycle
      else:
          peak = max( calculations.intersection_recommended_cycle_length(p) for p in participants )
          coordinated_cycle_sec = ceil(peak / CYCLE_ROUNDING_MULTIPLE_SEC) * CYCLE_ROUNDING_MULTIPLE_SEC
          hard_ceiling = min( Intersection.max_cycle_length_sec for p in participants )
          if coordinated_cycle_sec > hard_ceiling:
              raise ERR_CYCLE_EXCEEDS_LOCAL_MAX
    input_set: |
      Participants are pinned by the explicit posture set {READY, RESTRICTED} plus the coordination_ref ==
      MASTER predicate; the aggregate is a max over recommended_cycle_sec, so it is order-insensitive.
      Tie-break is unnecessary because the value, not the winning participant, is consumed.
    constants:
      CYCLE_ROUNDING_MULTIPLE_SEC: 5
    precision: "Whole multiple of 5 seconds"

  - name: timing_plan_split_rescale
    trigger: "Pipeline step 4 of the TimingPlan DRAFT -> COORDINATED transition"
    algorithm: waterfall_allocation
    formula: |
      phases = PhaseSplit rows with timing_plan_id == plan.id, enumerated in phase_number ASC order
      drafted_split_total_sec = sum(p.split_sec for p in phases)
      target_cycle = plan.cycle_length_sec            # already overwritten by pipeline step 3
      # ---- PINNED ROUNDING ORDER: round EACH phase first, then reconcile the residual. -------------
      # Explicitly NOT "sum the scaled values then round", and explicitly NOT "truncate each phase then
      # distribute the whole remainder". Those two alternatives produce different second-by-second splits
      # for the same inputs; only the order below is correct.
      for p in phases (phase_number ASC):
          p.effective_split_sec = round_half_up( p.split_sec * target_cycle / drafted_split_total_sec , 0 )
      residual = target_cycle - sum(p.effective_split_sec for p in phases)      # may be negative
      coordinated_phase = the phase with the greatest min_green_sec;
                          tie-break: lowest phase_number
      coordinated_phase.effective_split_sec = coordinated_phase.effective_split_sec + residual
      plan.effective_split_total_sec = sum(p.effective_split_sec for p in phases)   # == target_cycle
      # INVARIANT: plan.effective_split_total_sec == plan.cycle_length_sec, exactly, with no drift.
    input_set: |
      All PhaseSplit rows of the plan (no status filter — PhaseSplit has no status), enumerated
      phase_number ASC. The residual recipient is selected by the explicit ranking expression
      `max(min_green_sec)` with tie-break `min(phase_number)`; the candidate pool is never empty because a
      plan cannot be coordinated with zero phases.
    constants: {}
    precision: |
      Each per-phase quotient is rounded to a WHOLE second with round_half_up BEFORE summation; the single
      residual (positive or negative) is then applied once, to exactly one phase. No second rounding pass.

  - name: timing_plan_offset_assignment
    trigger: "Pipeline step 5 of the TimingPlan DRAFT -> COORDINATED transition"
    algorithm: chronological
    formula: |
      if plan.coordination_ref == LOCAL_FREE:
          plan.offset_sec = 0
      else:
          members = CorridorMember rows of the project's corridor, sequence_index ASC
          cumulative_ft = sum( m.distance_from_prev_ft for m in members
                               with sequence_index <= this plan's member sequence_index )
          cumulative_travel_sec = cumulative_ft / PROGRESSION_SPEED_FPS
          plan.offset_sec = round_half_up(cumulative_travel_sec, 0) mod plan.cycle_length_sec
    input_set: "CorridorMember rows of the project's corridor including BLOCKED members (distance is geometric, not operational), enumerated sequence_index ASC with no gaps."
    constants:
      PROGRESSION_SPEED_FPS: 44.0
    precision: "Whole seconds; round_half_up applied to the cumulative travel time BEFORE the modulo, never after"

  - name: pedestrian_clearance_requirement
    trigger: "Pipeline step 6 of the TimingPlan DRAFT -> COORDINATED transition, once per PhaseSplit with is_pedestrian_phase == true"
    algorithm: threshold
    formula: |
      walking_speed_fps = 3.5 if Intersection.walking_speed_standard == STD_3_5_FPS else 3.0
      required_ped_clear_sec = ceil( (PhaseSplit.crosswalk_length_ft / walking_speed_fps) * 10 ) / 10   # ceil to tenth
      required_walk_sec      = MIN_WALK_APS_SEC if Intersection.aps_installed else MIN_WALK_STD_SEC
      provided_ped_clear_sec = PhaseSplit.ped_clear_sec
      provided_walk_sec      = PhaseSplit.walk_sec
      required_phase_length_sec = required_walk_sec + required_ped_clear_sec
                                  + PhaseSplit.yellow_sec + PhaseSplit.red_clearance_sec
      provided_phase_length_sec = PhaseSplit.effective_split_sec     # POST-rescale value from step 4
      # ---- PINNED SUB-CHECK ORDER; the FIRST failure decides failure_reason ------------------------
      if provided_ped_clear_sec < required_ped_clear_sec:      result = FAIL, failure_reason = PED_CLEAR_SHORT
      elif provided_walk_sec    < required_walk_sec:           result = FAIL, failure_reason = WALK_SHORT
      elif provided_phase_length_sec < required_phase_length_sec: result = FAIL, failure_reason = PHASE_TOO_SHORT
      else:                                                   result = PASS, failure_reason = null
      # Boundary: equality PASSES on every one of the three sub-checks (>= semantics, not >).
    input_set: "Only PhaseSplit rows of this plan with is_pedestrian_phase == true, enumerated phase_number ASC; the walking-speed standard and APS flag come from the plan's Intersection."
    constants:
      WALKING_SPEED_STD_FPS: 3.5
      WALKING_SPEED_EXTENDED_FPS: 3.0
      MIN_WALK_STD_SEC: 4.0
      MIN_WALK_APS_SEC: 7.0
    precision: "required_ped_clear_sec rounded UP to one decimal place (ceiling to the tenth); all comparisons at 1 decimal place"

  - name: priority_budget_allocation
    trigger: "PriorityConfig NOT_DEPLOYED|SUSPENDED -> DEPLOYED and DEPLOYED -> SUSPENDED; also re-run by implementation cascade link 3 when an Intersection's deployed coordinated cycle changes"
    algorithm: waterfall_allocation
    formula: |
      if Intersection.deployed_coordinated_cycle_sec is null:
          priority_budget_sec = 0
      else:
          priority_budget_sec = floor(Intersection.deployed_coordinated_cycle_sec * MAX_PRIORITY_FRACTION)
      # Candidate pool: this intersection's PriorityConfig rows with deployment_status == DEPLOYED.
      # Allocation order (PINNED): all EVP rows first, then all TSP rows; within a priority_type,
      # conflict_resolution_rank ASC; tie-break on equal rank: created_at ASC. `id` is never consulted.
      remaining = priority_budget_sec
      for cfg in ordered_pool:
          cfg.granted_extension_sec = min(cfg.requested_max_extension_sec, remaining)
          remaining = remaining - cfg.granted_extension_sec
      # Every config with deployment_status != DEPLOYED has granted_extension_sec = 0.
      Intersection.granted_priority_extension_total_sec = sum(cfg.granted_extension_sec for cfg in ordered_pool)
      Intersection.unallocated_priority_budget_sec      = priority_budget_sec
                                                          - Intersection.granted_priority_extension_total_sec
      # INVARIANT: granted_priority_extension_total_sec + unallocated_priority_budget_sec
      #            == priority_budget_sec, at every observable moment.
      # A config being newly DEPLOYED whose granted_extension_sec would be 0 — i.e. the intersection's
      # unallocated_priority_budget_sec is already 0 at the moment of the deploy, for EITHER priority_type —
      # causes the deploy call to fail with ERR_PRIORITY_BUDGET_EXHAUSTED and NOTHING is written.
    input_set: |
      Source entity PriorityConfig filtered to deployment_status == DEPLOYED on the given intersection_id.
      Ordering is the explicit two-key sort (priority_type EVP-before-TSP, then conflict_resolution_rank
      ASC) with created_at ASC as the final tie-break. Empty pool → granted totals 0 and
      unallocated_priority_budget_sec == priority_budget_sec.
    constants:
      MAX_PRIORITY_FRACTION: 0.20
    precision: "Whole seconds; the budget uses floor (never round) so it can never exceed the fraction"

  - name: corridor_performance_metrics
    trigger: "POST /signal-ops/retiming-projects/{id}/performance-evaluations (provisional_variant) and PerformanceEvaluation PROVISIONAL -> CERTIFIED (certified_variant)"
    algorithm: aggregation
    formula: |
      before_runs = TravelTimeRun rows with project_id == project and study_role == BEFORE
      after_runs  = TravelTimeRun rows with project_id == project and study_role == AFTER,
                    filtered by the ACTIVE VARIANT's inclusion predicate (see variants)
      if before_runs is empty:   raise ERR_BEFORE_STUDY_INCOMPLETE
      if after_runs is empty:    raise ERR_NO_AFTER_STUDY
      mean_travel_time_before_sec = MEAN(before_runs)      # MEAN defined per variant
      mean_travel_time_after_sec  = MEAN(after_runs)
      delay_reduction_pct = round_half_up( 100.0 * (mean_travel_time_before_sec - mean_travel_time_after_sec)
                                           / mean_travel_time_before_sec , 2 )
      total_stops_before = sum(r.stops_count for r in before_runs)
      total_stops_after  = sum(r.stops_count for r in after_runs)
      stops_reduction_pct = round_half_up( 100.0 * (total_stops_before - total_stops_after)
                                           / total_stops_before , 2 )     # total_stops_before == 0 -> 0.00
      aog_pct_before = round_half_up( 100.0 * sum(r.arrivals_on_green_count for r in before_runs)
                                             / sum(r.total_arrivals for r in before_runs) , 2 )
      aog_pct_after  = round_half_up( 100.0 * sum(r.arrivals_on_green_count for r in after_runs)
                                             / sum(r.total_arrivals for r in after_runs) , 2 )
      included_after_run_count = count(after_runs)
    input_set: |
      Source entity TravelTimeRun on the project, split by study_role. BEFORE runs are always all of them.
      The AFTER inclusion predicate and the definition of MEAN are both variant-dependent and pinned
      below. All aggregates are sums or means, so no tie-break is required; the AFTER filter uses the
      recorded_at timestamp, never `id`.
    constants: {}
    precision: |
      Every percentage and every mean is rounded to 2 decimal places with round_half_up. Means are
      rounded BEFORE they enter delay_reduction_pct (round-then-divide, not divide-then-round-once), so
      mean_travel_time_before_sec and mean_travel_time_after_sec as persisted are exactly the values the
      percentage was computed from.
    variants:
      - name: provisional_variant
        when: "POST /signal-ops/retiming-projects/{id}/performance-evaluations; writes metric_variant := PROVISIONAL_UNWEIGHTED"
        difference: |
          AFTER inclusion predicate: ALL rows with study_role == AFTER, regardless of recorded_at.
          MEAN(runs) = round_half_up( sum(r.duration_sec) / count(runs) , 2 )   # unweighted arithmetic mean
      - name: certified_variant
        when: "PerformanceEvaluation PROVISIONAL -> CERTIFIED; writes metric_variant := CERTIFIED_WEIGHTED"
        difference: |
          AFTER inclusion predicate: rows with study_role == AFTER AND
          recorded_at >= RetimingProject.last_tuning_completed_at   (>= , inclusive) — runs invalidated by
          the last round of fine tuning are dropped from the mean, from total_stops_after AND from
          aog_pct_after.
          MEAN(runs) = round_half_up( sum(r.duration_sec * r.total_arrivals) / sum(r.total_arrivals) , 2 )
          # arrivals-weighted mean, so identical run data yields a different number than the provisional
          # variant even when the inclusion sets happen to coincide.

# =====================================================================================
# §1.4 Validation Rules Table (evaluated in ascending `priority`; the FIRST failure wins)
# =====================================================================================
validations:
  - priority: 1
    category: auth
    check: "Both X-User-Role and X-User-ID headers are present and non-blank"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the six roles declared in §1.7"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all

  - priority: 10
    category: auth
    check: "The acting role appears in the target endpoint's §1.5 `roles:` list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 15
    category: auth
    check: "Segregation of duties: X-User-ID differs from the resource's authoring/proposing user id (TimingPlan.authored_by_user_id for certify/return/waive, PriorityConfig.proposed_by_user_id for approve)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /signal-ops/timing-plans/{id}/certify, POST /signal-ops/pedestrian-checks/{id}/waive, POST /signal-ops/priority-configs/{id}/approve"

  - priority: 16
    category: auth
    check: "A PublicRequester's X-User-ID equals the target CitizenComplaint.requester_id (or the Requester.id in the path)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "GET /signal-ops/requesters/{id}, GET /signal-ops/requesters/{id}/complaints, POST /signal-ops/complaints"

  - priority: 20
    category: existence
    check: "Every id in the request path resolves to a stored row, validated left-to-right"
    error_id: "ERR_CORRIDOR_NOT_FOUND | ERR_INTERSECTION_NOT_FOUND | ERR_PROJECT_NOT_FOUND | ERR_TIMING_PLAN_NOT_FOUND | ERR_PHASE_SPLIT_NOT_FOUND | ERR_PED_CHECK_NOT_FOUND | ERR_PRIORITY_CONFIG_NOT_FOUND | ERR_COMPLAINT_NOT_FOUND | ERR_REQUESTER_NOT_FOUND | ERR_EVALUATION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a templated path segment"

  - priority: 25
    category: existence
    check: "Every foreign-key id supplied in the request body resolves to a stored row"
    error_id: "ERR_CORRIDOR_NOT_FOUND | ERR_INTERSECTION_NOT_FOUND | ERR_PROJECT_NOT_FOUND | ERR_REQUESTER_NOT_FOUND"
    http_status: 404
    applies_to: "POST /signal-ops/corridors/{id}/members, POST /signal-ops/retiming-projects, POST /signal-ops/timing-plans, POST /signal-ops/priority-configs, POST /signal-ops/field-observations, POST /signal-ops/complaints, POST /signal-ops/complaints/{id}/link"

  - priority: 30
    category: business_constraint
    check: "All required body fields are present, of the declared type, within declared numeric ranges, and enum values are members of the declared set"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all endpoints with a request body"

  - priority: 35
    category: business_constraint
    check: "limit is an integer in 1..100 and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: "all list endpoints"

  - priority: 40
    category: state
    check: "The target resource is in a state from which the requested transition is declared in §1.2"
    error_id: "ERR_CORRIDOR_NOT_SCREENED | ERR_CORRIDOR_NOT_SELECTED | ERR_PROJECT_NOT_IN_DATA_COLLECTION | ERR_PROJECT_NOT_IN_PLAN_DEVELOPMENT | ERR_PROJECT_NOT_IMPLEMENTED | ERR_PROJECT_NOT_IN_FIELD_TUNING | ERR_PROJECT_NOT_IN_EVALUATION | ERR_PROJECT_TERMINAL | ERR_PLAN_NOT_DRAFT | ERR_PLAN_NOT_COORDINATED | ERR_PLAN_NOT_SUBMITTED | ERR_PED_CHECK_NOT_FAILING | ERR_CONFIG_NOT_PROPOSED | ERR_CONFIG_NOT_APPROVED | ERR_CONFIG_NOT_DEPLOYED | ERR_COMPLAINT_INVALID_STATE | ERR_EVALUATION_NOT_PROVISIONAL"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 45
    category: state
    check: "The supplied expected_<parent>_version equals the parent's current version (§1.2.1 OCC)"
    error_id: "ERR_STALE_PROJECT_VERSION | ERR_STALE_INTERSECTION_VERSION"
    http_status: 412
    applies_to: "POST /signal-ops/timing-plans, POST /signal-ops/priority-configs, POST /signal-ops/retiming-projects/{id}/performance-evaluations"

  - priority: 50
    category: business_safety
    check: "An Intersection with aps_installed == true must carry walking_speed_standard == EXTENDED_3_0_FPS"
    error_id: ERR_APS_STANDARD_MISMATCH
    http_status: 422
    applies_to: "POST /signal-ops/intersections, PATCH /signal-ops/intersections/{id}"

  - priority: 55
    category: business_safety
    check: "Operational posture gates: certification requires Intersection.operational_posture != BLOCKED; priority deployment requires operational_posture == READY"
    error_id: "ERR_POSTURE_BLOCKS_CERTIFICATION | ERR_POSTURE_BLOCKS_DEPLOYMENT"
    http_status: 409
    applies_to: "POST /signal-ops/timing-plans/{id}/certify, POST /signal-ops/priority-configs/{id}/deploy"

  - priority: 57
    category: business_safety
    check: "The plan's ped_compliance_state IN {COMPLIANT, WAIVED} before it may be submitted"
    error_id: ERR_PED_CLEARANCE_INSUFFICIENT
    http_status: 409
    applies_to: "POST /signal-ops/timing-plans/{id}/submit"

  - priority: 58
    category: business_safety
    check: "For every PhaseSplit of the plan, effective_split_sec >= min_green_sec + yellow_sec + red_clearance_sec"
    error_id: ERR_MIN_GREEN_VIOLATION
    http_status: 422
    applies_to: "POST /signal-ops/timing-plans/{id}/submit"

  - priority: 60
    category: business_referential
    check: "Before-study completeness: every eligible member intersection has >= 1 BEFORE TurningMovementCount for this project AND the project has >= 1 BEFORE TravelTimeRun"
    error_id: ERR_BEFORE_STUDY_INCOMPLETE
    http_status: 409
    applies_to: "POST /signal-ops/retiming-projects/{id}/advance, POST /signal-ops/retiming-projects/{id}/coordinate, POST /signal-ops/retiming-projects/{id}/performance-evaluations"

  - priority: 62
    category: business_referential
    check: "Plan coverage: every eligible member intersection has >= 1 CERTIFIED TimingPlan for this project (implement); the priority config's intersection has >= 1 DEPLOYED TimingPlan (deploy)"
    error_id: ERR_PLAN_COVERAGE_INCOMPLETE
    http_status: 409
    applies_to: "POST /signal-ops/retiming-projects/{id}/implement, POST /signal-ops/priority-configs/{id}/deploy"

  - priority: 63
    category: business_referential
    check: "The project referenced by a complaint link belongs to the complaint's corridor"
    error_id: ERR_COMPLAINT_PROJECT_MISMATCH
    http_status: 422
    applies_to: "POST /signal-ops/complaints/{id}/link"

  - priority: 64
    category: business_referential
    check: "At least one AFTER TravelTimeRun with recorded_at >= RetimingProject.last_tuning_completed_at exists"
    error_id: ERR_NO_AFTER_STUDY
    http_status: 409
    applies_to: "POST /signal-ops/performance-evaluations/{id}/certify"

  - priority: 65
    category: business_temporal
    check: "Logical clock now < study_window_start_at + study_window_days days. The deadline instant itself counts as EXPIRED: at exactly study_window_start_at + study_window_days the advance is REJECTED; one second earlier it is ACCEPTED."
    error_id: ERR_STUDY_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /signal-ops/retiming-projects/{id}/advance"

  - priority: 66
    category: business_temporal
    check: "HALF-OPEN interval overlap on an Intersection: the plan's [tod_start_min, tod_end_min) must not intersect the window of any other plan on the same intersection_id whose status IN {COORDINATED, SUBMITTED, CERTIFIED, DEPLOYED}. Adjacency (a.tod_end_min == b.tod_start_min) is PERMITTED; there is no buffer."
    error_id: ERR_TOD_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /signal-ops/timing-plans/{id}/submit"

  - priority: 67
    category: business_temporal
    check: "CLOSED interval plus buffer on a RetimingProject: for the same (project_id, direction, study_role), the gap between a new run's CLOSED interval [started_at, started_at + duration_sec] and every stored run's CLOSED interval must be >= RUN_SEPARATION_SEC = 120 seconds, measured on whichever side the new run falls. A gap of exactly 120 seconds is ACCEPTED; a gap of 119 seconds is REJECTED; overlapping intervals and touching endpoints (gap 0) are REJECTED. This is deliberately different from the half-open, zero-buffer ERR_TOD_WINDOW_OVERLAP rule at priority 66."
    error_id: ERR_RUN_SPACING_VIOLATION
    http_status: 409
    applies_to: "POST /signal-ops/retiming-projects/{id}/travel-time-runs"

  - priority: 68
    category: business_temporal
    check: "FieldObservation.observed_at must be >= the project's most recent transition into FIELD_TUNING and <= logical clock now"
    error_id: ERR_OBSERVATION_OUT_OF_WINDOW
    http_status: 422
    applies_to: "POST /signal-ops/field-observations"

  - priority: 70
    category: business_constraint
    check: "cycle_length_sec (drafted, and the coordinated cycle after step 3) must be <= Intersection.max_cycle_length_sec for every participating intersection"
    error_id: ERR_CYCLE_EXCEEDS_LOCAL_MAX
    http_status: 422
    applies_to: "POST /signal-ops/timing-plans, POST /signal-ops/retiming-projects/{id}/coordinate"

  - priority: 71
    category: business_constraint
    check: "critical_flow_ratio_sum < OVERSATURATION_RATIO (0.95); a sum of exactly 0.95 is REJECTED"
    error_id: ERR_OVERSATURATED_APPROACH
    http_status: 422
    applies_to: "POST /signal-ops/intersections/{id}/turning-movement-counts, POST /signal-ops/retiming-projects/{id}/coordinate"

  - priority: 72
    category: business_constraint
    check: "conflict_resolution_rank is unique per (intersection_id, priority_type) among rows with deployment_status != SUSPENDED"
    error_id: ERR_DUPLICATE_PRIORITY_RANK
    http_status: 409
    applies_to: "POST /signal-ops/priority-configs"

  - priority: 73
    category: business_constraint
    check: "phase_number is unique within a timing_plan_id"
    error_id: ERR_DUPLICATE_PHASE_NUMBER
    http_status: 409
    applies_to: "POST /signal-ops/timing-plans/{id}/phase-splits"

  - priority: 74
    category: business_constraint
    check: "(corridor_id, intersection_id) is unique in CorridorMember, and sequence_index must equal Corridor.member_count + 1 so indices stay gap-free"
    error_id: "ERR_DUPLICATE_CORRIDOR_MEMBER | ERR_SEQUENCE_INDEX_GAP"
    http_status: "409 | 422"
    applies_to: "POST /signal-ops/corridors/{id}/members"

  - priority: 75
    category: business_constraint
    check: "At least one CorridorMember whose Intersection.operational_posture IN {READY, RESTRICTED} exists (non-empty eligible set)"
    error_id: ERR_NO_ELIGIBLE_MEMBERS
    http_status: 409
    applies_to: "POST /signal-ops/corridors/{id}/screen"

  - priority: 76
    category: business_constraint
    check: "priority_score recomputed under programming_variant >= SELECT_SCORE_THRESHOLD (50.00); exactly 50.00 is ACCEPTED, 49.99 is REJECTED. A rejected decision writes NOTHING: the corridor keeps its screening-variant priority_score, priority_score_variant SCREENING, selection_status SCREENED and its previous version."
    error_id: ERR_SCORE_BELOW_SELECT_THRESHOLD
    http_status: 409
    applies_to: "POST /signal-ops/corridors/{id}/selection-decision with decision == SELECT"

  - priority: 77
    category: business_constraint
    check: "No RetimingProject on the corridor with status NOT IN {CLOSED, ABANDONED}"
    error_id: ERR_CORRIDOR_PROJECT_ACTIVE
    http_status: 409
    applies_to: "POST /signal-ops/retiming-projects, POST /signal-ops/corridors/{id}/selection-decision with decision == SELECT, POST /signal-ops/corridors/{id}/screen from SELECTED"

  - priority: 78
    category: business_constraint
    check: "Corridor.selection_status == SELECTED before a RetimingProject may be created for it"
    error_id: ERR_CORRIDOR_NOT_SELECTED
    http_status: 409
    applies_to: "POST /signal-ops/retiming-projects"

  - priority: 79
    category: business_constraint
    check: "tuning_round + 1 <= MAX_TUNING_ROUNDS (3) before the fine-tuning cascade may loop the project back to PLAN_DEVELOPMENT"
    error_id: ERR_TUNING_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /signal-ops/field-observations with requires_adjustment == true"

  - priority: 80
    category: business_constraint
    check: "Requester.email is unique across Requester"
    error_id: ERR_DUPLICATE_REQUESTER_EMAIL
    http_status: 409
    applies_to: "POST /signal-ops/requesters"

  - priority: 85
    category: business_fiscal
    check: "A newly DEPLOYED PriorityConfig with priority_type == EVP must receive granted_extension_sec > 0 from the priority budget waterfall"
    error_id: ERR_PRIORITY_BUDGET_EXHAUSTED
    http_status: 409
    applies_to: "POST /signal-ops/priority-configs/{id}/deploy"

# =====================================================================================
# §1.5 API Endpoint Table
# =====================================================================================
endpoints:

  # ---------------- Signal inventory (Intersection) ----------------
  - method: POST
    path: "/signal-ops/intersections"
    description: "Register a signalized intersection in the inventory."
    roles: [SignalOpsAdmin]
    code: 201
    input: [location_name, controller_type, "detection_status?", "comm_status?", "aps_installed?", "walking_speed_standard?", "pedestrian_recall?", "max_cycle_length_sec?"]
    output: Intersection
    side_effects:
      - "computes operational_posture per calculations.intersection_operational_posture"
      - "computes timing_plan_age_days per calculations.intersection_timing_plan_age_days (3650 while last_retimed_at is null)"
      - "initialises priority_budget_sec, granted_priority_extension_total_sec and unallocated_priority_budget_sec to 0"

  - method: GET
    path: "/signal-ops/intersections"
    description: "List intersections with inventory filters and pagination."
    roles: [SignalOpsAdmin, TimingEngineer, CertifyingEngineer, FieldTechnician, CitizenLiaison]
    code: 200
    input: ["controller_type?", "comm_status?", "detection_status?", "operational_posture?", "limit?", "offset?"]
    output: Intersection[]
    side_effects: []

  - method: GET
    path: "/signal-ops/intersections/{id}"
    description: "Read one intersection including its derived posture and priority-budget fields."
    roles: [SignalOpsAdmin, TimingEngineer, CertifyingEngineer, FieldTechnician, CitizenLiaison]
    code: 200
    input: []
    output: Intersection
    side_effects: []

  - method: PATCH
    path: "/signal-ops/intersections/{id}"
    description: "Update detection/communication health and pedestrian configuration for an intersection."
    roles: [SignalOpsAdmin]
    code: 200
    input: ["detection_status?", "comm_status?", "aps_installed?", "walking_speed_standard?", "pedestrian_recall?", "max_cycle_length_sec?"]
    output: Intersection
    side_effects:
      - "recomputes operational_posture per calculations.intersection_operational_posture"
      - "increments Intersection.version by 1"

  - method: GET
    path: "/signal-ops/intersections/{id}/corridor-memberships"
    description: "Reverse lookup: every CorridorMember row that enrols this intersection in a corridor."
    roles: [SignalOpsAdmin, TimingEngineer, CertifyingEngineer, FieldTechnician, CitizenLiaison]
    code: 200
    input: ["limit?", "offset?"]
    output: CorridorMember[]
    side_effects: []

  - method: GET
    path: "/signal-ops/intersections/{id}/timing-plans"
    description: "Reverse lookup: timing plans controlling this intersection, filterable by status and time-of-day label."
    roles: [SignalOpsAdmin, TimingEngineer, CertifyingEngineer, FieldTechnician, CitizenLiaison]
    code: 200
    input: ["status?", "tod_period?", "limit?", "offset?"]
    output: TimingPlan[]
    side_effects: []

  - method: GET
    path: "/signal-ops/intersections/{id}/priority-configs"
    description: "Reverse lookup: transit and emergency priority configurations at this intersection."
    roles: [SignalOpsAdmin, TimingEngineer, CertifyingEngineer, FieldTechnician, CitizenLiaison]
    code: 200
    input: ["priority_type?", "approval_status?", "deployment_status?", "limit?", "offset?"]
    output: PriorityConfig[]
    side_effects: []

  - method: GET
    path: "/signal-ops/intersections/{id}/field-observations"
    description: "Reverse lookup: field observations logged at this intersection."
    roles: [SignalOpsAdmin, TimingEngineer, CertifyingEngineer, FieldTechnician, CitizenLiaison]
    code: 200
    input: ["resolution_status?", "limit?", "offset?"]
    output: FieldObservation[]
    side_effects: []

  - method: GET
    path: "/signal-ops/intersections/{id}/turning-movement-counts"
    description: "Reverse lookup: turning movement counts collected at this intersection."
    roles: [SignalOpsAdmin, TimingEngineer, CertifyingEngineer, FieldTechnician, CitizenLiaison]
    code: 200
    input: ["study_role?", "period?", "limit?", "offset?"]
    output: TurningMovementCount[]
    side_effects: []

  - method: POST
    path: "/signal-ops/intersections/{id}/turning-movement-counts"
    description: "Record a turning movement count at this intersection for a project's before or after study."
    roles: [FieldTechnician]
    code: 201
    input: [project_id, study_role, count_date, period, phase_volumes]
    output: TurningMovementCount
    side_effects:
      - "computes critical_flow_ratio_sum and recommended_cycle_sec per calculations.intersection_recommended_cycle_length"
      - "rejects with ERR_OVERSATURATED_APPROACH when critical_flow_ratio_sum >= 0.95"

  # ---------------- Corridor screening and selection ----------------
  - method: POST
    path: "/signal-ops/corridors"
    description: "Create a corridor for the retiming program."
    roles: [SignalOpsAdmin]
    code: 201
    input: [name, jurisdiction_class, "annual_volume_change_pct?"]
    output: Corridor
    side_effects:
      - "initialises selection_status := UNSCREENED, member_count := 0, all complaint counters := 0, priority_score := 0, priority_score_variant := null"

  - method: GET
    path: "/signal-ops/corridors"
    description: "List corridors with selection filters and pagination."
    roles: [SignalOpsAdmin, TimingEngineer, CertifyingEngineer, FieldTechnician, CitizenLiaison]
    code: 200
    input: ["selection_status?", "jurisdiction_class?", "limit?", "offset?"]
    output: Corridor[]
    side_effects: []

  - method: GET
    path: "/signal-ops/corridors/{id}"
    description: "Read one corridor including its derived score and complaint bucket counters."
    roles: [SignalOpsAdmin, TimingEngineer, CertifyingEngineer, FieldTechnician, CitizenLiaison]
    code: 200
    input: []
    output: Corridor
    side_effects: []

  - method: POST
    path: "/signal-ops/corridors/{id}/members"
    description: "Enrol an intersection in the corridor at the next sequence position."
    roles: [SignalOpsAdmin]
    code: 201
    input: [intersection_id, sequence_index, "distance_from_prev_ft?"]
    output: CorridorMember
    side_effects:
      - "recomputes Corridor.member_count; increments Corridor.version by 1"

  - method: GET
    path: "/signal-ops/corridors/{id}/members"
    description: "Reverse lookup: corridor membership rows in sequence order."
    roles: [SignalOpsAdmin, TimingEngineer, CertifyingEngineer, FieldTechnician, CitizenLiaison]
    code: 200
    input: ["limit?", "offset?"]
    output: CorridorMember[]
    side_effects: []

  - method: GET
    path: "/signal-ops/corridors/{id}/retiming-projects"
    description: "Reverse lookup: retiming projects on this corridor."
    roles: [SignalOpsAdmin, TimingEngineer, CertifyingEngineer, FieldTechnician, CitizenLiaison]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RetimingProject[]
    side_effects: []

  - method: GET
    path: "/signal-ops/corridors/{id}/complaints"
    description: "Reverse lookup: citizen complaints filed against this corridor."
    roles: [SignalOpsAdmin, TimingEngineer, CertifyingEngineer, FieldTechnician, CitizenLiaison]
    code: 200
    input: ["status?", "category?", "limit?", "offset?"]
    output: CitizenComplaint[]
    side_effects: []

  - method: POST
    path: "/signal-ops/corridors/{id}/screen"
    description: "Screen the corridor for the retiming program; recomputes plan age, complaint counters and the priority score under the screening variant."
    roles: [SignalOpsAdmin]
    code: 200
    input: []
    output: Corridor
    side_effects:
      - "Corridor UNSCREENED|DEFERRED|SELECTED -> SCREENED with the recomputation set declared in §1.2"
      - "sets priority_score_variant := SCREENING and screened_at := logical clock now"
      - "increments Corridor.version by 1"

  - method: POST
    path: "/signal-ops/corridors/{id}/selection-decision"
    description: "Select or defer a screened corridor; recomputes the priority score under the programming variant first."
    roles: [SignalOpsAdmin]
    code: 200
    input: [decision, "rationale?"]
    output: Corridor
    side_effects:
      - "Corridor SCREENED -> SELECTED (decision == SELECT) or SCREENED -> DEFERRED (decision == DEFER)"
      - "recomputes avg_plan_age_days, complaint_count_12mo and priority_score under programming_variant; sets priority_score_variant := PROGRAMMING"
      - "increments Corridor.version by 1"

  # ---------------- Citizen feedback ----------------
  - method: POST
    path: "/signal-ops/requesters"
    description: "Register a citizen requester so complaints can be attributed and followed up."
    roles: [CitizenLiaison]
    code: 201
    input: [display_name, email, "contact_pref?"]
    output: Requester
    side_effects:
      - "initialises open_complaint_count := 0"

  - method: GET
    path: "/signal-ops/requesters/{id}"
    description: "Read one requester. A PublicRequester may only read their own row."
    roles: [CitizenLiaison, PublicRequester]
    code: 200
    input: []
    output: Requester
    side_effects: []

  - method: GET
    path: "/signal-ops/requesters/{id}/complaints"
    description: "Reverse lookup: complaints filed by this requester. A PublicRequester may only read their own."
    roles: [CitizenLiaison, PublicRequester]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CitizenComplaint[]
    side_effects: []

  - method: POST
    path: "/signal-ops/complaints"
    description: "File a citizen complaint about a corridor."
    roles: [CitizenLiaison, PublicRequester]
    code: 201
    input: [requester_id, corridor_id, category, narrative]
    output: CitizenComplaint
    side_effects:
      - "sets received_at := logical clock now and status := OPEN"
      - "refreshes Corridor.complaint_total_count and Corridor.complaint_open_count; increments Requester.open_complaint_count by 1"

  - method: POST
    path: "/signal-ops/complaints/{id}/triage"
    description: "Triage an open complaint into the queue, or close it with no action."
    roles: [CitizenLiaison]
    code: 200
    input: [disposition, "note?"]
    output: CitizenComplaint
    side_effects:
      - "CitizenComplaint OPEN -> TRIAGED (disposition == TRIAGE) or OPEN -> CLOSED_NO_ACTION (disposition == NO_ACTION)"
      - "refreshes Corridor complaint bucket counters and Requester.open_complaint_count"

  - method: POST
    path: "/signal-ops/complaints/{id}/link"
    description: "Link a triaged complaint to a retiming project on the same corridor."
    roles: [CitizenLiaison]
    code: 200
    input: [project_id]
    output: CitizenComplaint
    side_effects:
      - "CitizenComplaint TRIAGED -> LINKED; sets linked_project_id"
      - "moves one unit from Corridor.complaint_open_count to Corridor.complaint_linked_count"

  - method: POST
    path: "/signal-ops/complaints/{id}/resolve"
    description: "Resolve a linked complaint once its project reaches evaluation or closure."
    roles: [CitizenLiaison]
    code: 200
    input: ["resolution_note?"]
    output: CitizenComplaint
    side_effects:
      - "CitizenComplaint LINKED -> RESOLVED"
      - "moves one unit from Corridor.complaint_linked_count to Corridor.complaint_terminal_count; decrements Requester.open_complaint_count by 1"

  - method: POST
    path: "/signal-ops/complaints/{id}/reopen"
    description: "Reopen a resolved complaint when the citizen reports the issue persists."
    roles: [CitizenLiaison]
    code: 200
    input: ["reason?"]
    output: CitizenComplaint
    side_effects:
      - "CitizenComplaint RESOLVED -> OPEN; clears linked_project_id; increments reopen_count by 1"
      - "moves one unit from Corridor.complaint_terminal_count to Corridor.complaint_open_count; increments Requester.open_complaint_count by 1"

  # ---------------- Retiming project lifecycle ----------------
  - method: POST
    path: "/signal-ops/retiming-projects"
    description: "Open a retiming project on a SELECTED corridor."
    roles: [TimingEngineer]
    code: 201
    input: [corridor_id, study_window_start_at, "study_window_days?", lead_engineer_user_id]
    output: RetimingProject
    side_effects:
      - "initialises status := DATA_COLLECTION, tuning_round := 0, last_tuning_completed_at := null"
      - "computes eligible_member_count from the corridor's members whose Intersection.operational_posture IN {READY, RESTRICTED}"

  - method: GET
    path: "/signal-ops/retiming-projects/{id}"
    description: "Read one retiming project."
    roles: [SignalOpsAdmin, TimingEngineer, CertifyingEngineer, FieldTechnician, CitizenLiaison]
    code: 200
    input: []
    output: RetimingProject
    side_effects: []

  - method: GET
    path: "/signal-ops/retiming-projects/{id}/turning-movement-counts"
    description: "Reverse lookup: turning movement counts collected for this project."
    roles: [SignalOpsAdmin, TimingEngineer, CertifyingEngineer, FieldTechnician, CitizenLiaison]
    code: 200
    input: ["study_role?", "limit?", "offset?"]
    output: TurningMovementCount[]
    side_effects: []

  - method: POST
    path: "/signal-ops/retiming-projects/{id}/travel-time-runs"
    description: "Record a floating-car travel time run for the project's before or after study."
    roles: [FieldTechnician]
    code: 201
    input: [study_role, direction, started_at, duration_sec, stops_count, arrivals_on_green_count, total_arrivals]
    output: TravelTimeRun
    side_effects:
      - "sets recorded_at := logical clock now"
      - "enforces the closed-interval-plus-120s-buffer spacing rule (validations priority 67)"

  - method: GET
    path: "/signal-ops/retiming-projects/{id}/travel-time-runs"
    description: "Reverse lookup: travel time runs recorded for this project."
    roles: [SignalOpsAdmin, TimingEngineer, CertifyingEngineer, FieldTechnician, CitizenLiaison]
    code: 200
    input: ["study_role?", "direction?", "limit?", "offset?"]
    output: TravelTimeRun[]
    side_effects: []

  - method: GET
    path: "/signal-ops/retiming-projects/{id}/timing-plans"
    description: "Reverse lookup: timing plans developed under this project."
    roles: [SignalOpsAdmin, TimingEngineer, CertifyingEngineer, FieldTechnician, CitizenLiaison]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: TimingPlan[]
    side_effects: []

  - method: GET
    path: "/signal-ops/retiming-projects/{id}/field-observations"
    description: "Reverse lookup: field observations logged under this project."
    roles: [SignalOpsAdmin, TimingEngineer, CertifyingEngineer, FieldTechnician, CitizenLiaison]
    code: 200
    input: ["resolution_status?", "limit?", "offset?"]
    output: FieldObservation[]
    side_effects: []

  - method: GET
    path: "/signal-ops/retiming-projects/{id}/complaints"
    description: "Reverse lookup: complaints currently linked to this project."
    roles: [SignalOpsAdmin, TimingEngineer, CertifyingEngineer, FieldTechnician, CitizenLiaison]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CitizenComplaint[]
    side_effects: []

  - method: GET
    path: "/signal-ops/retiming-projects/{id}/performance-evaluations"
    description: "Reverse lookup: performance evaluations produced for this project."
    roles: [SignalOpsAdmin, TimingEngineer, CertifyingEngineer, FieldTechnician, CitizenLiaison]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PerformanceEvaluation[]
    side_effects: []

  - method: POST
    path: "/signal-ops/retiming-projects/{id}/performance-evaluations"
    description: "Compute a provisional before-and-after performance evaluation for the project; supersedes any prior PROVISIONAL row. Allowed while RetimingProject.status IN {FIELD_TUNING, EVALUATION} so that a provisional read-out can be taken mid-tuning; any status outside that set is ERR_PROJECT_NOT_IN_EVALUATION (409)."
    roles: [CertifyingEngineer]
    code: 201
    input: [expected_project_version]
    output: PerformanceEvaluation
    side_effects:
      - "OCC on RetimingProject.version per concurrency_rules — rejected with ERR_STALE_PROJECT_VERSION (412) when stale"
      - "requires RetimingProject.status IN {FIELD_TUNING, EVALUATION}, else ERR_PROJECT_NOT_IN_EVALUATION (409)"
      - "computes every metric field per calculations.corridor_performance_metrics under provisional_variant; sets metric_variant := PROVISIONAL_UNWEIGHTED"
      - "transitions any existing PROVISIONAL PerformanceEvaluation of this project to SUPERSEDED"
      - "increments RetimingProject.version by 1"

  - method: POST
    path: "/signal-ops/retiming-projects/{id}/advance"
    description: "Advance the project from data collection into plan development once the before study is complete and fresh."
    roles: [TimingEngineer]
    code: 200
    input: []
    output: RetimingProject
    side_effects:
      - "RetimingProject DATA_COLLECTION -> PLAN_DEVELOPMENT"
      - "recomputes eligible_member_count; increments RetimingProject.version by 1"

  - method: POST
    path: "/signal-ops/retiming-projects/{id}/coordinate"
    description: "Run the corridor coordination pipeline over every DRAFT plan: recommended cycles, coordinated cycle, cycle overwrite, split rescale, offsets, then pedestrian compliance evaluation — in that pinned order."
    roles: [TimingEngineer]
    code: 200
    input: []
    output: RetimingProject
    side_effects:
      - "TimingPlan DRAFT -> COORDINATED for every plan of the project, with pipeline steps 1..8 per §1.2"
      - "creates one PedestrianComplianceCheck per pedestrian PhaseSplit and sets each plan's ped_compliance_state"
      - "increments each touched TimingPlan.version by 1 and RetimingProject.version by 1"

  - method: POST
    path: "/signal-ops/retiming-projects/{id}/implement"
    description: "Implement the project in the field; deploys every certified plan and fires the four-link implementation cascade."
    roles: [TimingEngineer]
    code: 200
    input: []
    output: RetimingProject
    side_effects:
      - "RetimingProject PLAN_DEVELOPMENT -> IMPLEMENTED (cascade link 1)"
      - "TimingPlan CERTIFIED -> DEPLOYED for every certified plan (cascade link 2)"
      - "supersedes previously DEPLOYED plans on the same (intersection_id, tod_period) and refreshes each Intersection's last_retimed_at, timing_plan_age_days, deployed_coordinated_cycle_sec and priority-budget fields (cascade link 3)"
      - "recomputes every affected Corridor's avg_plan_age_days and priority_score under programming_variant and auto-defers SCREENED corridors that fall below 35.00 (cascade link 4)"
      - "requeues TRIAGED COORDINATION complaints of auto-deferred corridors back to OPEN (cascade link 5)"

  - method: POST
    path: "/signal-ops/retiming-projects/{id}/field-tuning"
    description: "Start the field observation and fine tuning phase (action == START) or complete it (action == COMPLETE), stamping last_tuning_completed_at."
    roles: [SignalOpsAdmin]
    code: 200
    input: [action]
    output: RetimingProject
    side_effects:
      - "RetimingProject IMPLEMENTED -> FIELD_TUNING (START) or FIELD_TUNING -> EVALUATION (COMPLETE)"
      - "on COMPLETE, sets last_tuning_completed_at := logical clock now"
      - "increments RetimingProject.version by 1"

  - method: POST
    path: "/signal-ops/retiming-projects/{id}/close"
    description: "Close a project after a certified evaluation, or abandon it before implementation."
    roles: [SignalOpsAdmin]
    code: 200
    input: [disposition, "note?"]
    output: RetimingProject
    side_effects:
      - "RetimingProject EVALUATION -> CLOSED (disposition == CLOSED) or DATA_COLLECTION|PLAN_DEVELOPMENT -> ABANDONED (disposition == ABANDONED)"
      - "resolves or requeues the project's LINKED complaints per §1.2"
      - "increments RetimingProject.version by 1"

  # ---------------- Timing plan development ----------------
  - method: POST
    path: "/signal-ops/timing-plans"
    description: "Draft a timing plan for one intersection and one time-of-day window under a project; supersedes a prior DRAFT plan on the same (project, intersection, tod_period)."
    roles: [TimingEngineer]
    code: 201
    input: [project_id, intersection_id, tod_period, tod_start_min, tod_end_min, cycle_length_sec, "coordination_ref?", expected_project_version]
    output: TimingPlan
    side_effects:
      - "OCC on RetimingProject.version per concurrency_rules.timing-plan-create-stale-project — ERR_STALE_PROJECT_VERSION (412) when stale"
      - "snapshots drafted_cycle_length_sec := cycle_length_sec and sets authored_by_user_id := X-User-ID"
      - "TimingPlan DRAFT -> SUPERSEDED for a prior DRAFT plan on the same (project_id, intersection_id, tod_period)"
      - "increments RetimingProject.version by 1"

  - method: GET
    path: "/signal-ops/timing-plans/{id}"
    description: "Read one timing plan, including both state axes and both split totals."
    roles: [SignalOpsAdmin, TimingEngineer, CertifyingEngineer, FieldTechnician, CitizenLiaison]
    code: 200
    input: []
    output: TimingPlan
    side_effects: []

  - method: POST
    path: "/signal-ops/timing-plans/{id}/phase-splits"
    description: "Add a phase split to a DRAFT timing plan."
    roles: [TimingEngineer]
    code: 201
    input: [phase_number, split_sec, min_green_sec, yellow_sec, red_clearance_sec, "is_pedestrian_phase?", "walk_sec?", "ped_clear_sec?", "crosswalk_length_ft?"]
    output: PhaseSplit
    side_effects:
      - "sets effective_split_sec := split_sec while the plan is DRAFT"
      - "recomputes TimingPlan.drafted_split_total_sec and effective_split_total_sec; increments TimingPlan.version by 1"

  - method: GET
    path: "/signal-ops/timing-plans/{id}/phase-splits"
    description: "Reverse lookup: phase splits of a timing plan in phase_number order."
    roles: [SignalOpsAdmin, TimingEngineer, CertifyingEngineer, FieldTechnician, CitizenLiaison]
    code: 200
    input: ["limit?", "offset?"]
    output: PhaseSplit[]
    side_effects: []

  - method: PATCH
    path: "/signal-ops/phase-splits/{id}"
    description: "Adjust a phase split while its plan is DRAFT."
    roles: [TimingEngineer]
    code: 200
    input: ["split_sec?", "min_green_sec?", "yellow_sec?", "red_clearance_sec?", "walk_sec?", "ped_clear_sec?", "crosswalk_length_ft?"]
    output: PhaseSplit
    side_effects:
      - "rejected with ERR_PLAN_NOT_DRAFT when the parent TimingPlan.status != DRAFT"
      - "sets effective_split_sec := split_sec; recomputes the plan's split totals; increments TimingPlan.version by 1"

  - method: GET
    path: "/signal-ops/timing-plans/{id}/pedestrian-checks"
    description: "Reverse lookup: pedestrian compliance checks minted for a timing plan by the coordination pipeline."
    roles: [SignalOpsAdmin, TimingEngineer, CertifyingEngineer, FieldTechnician, CitizenLiaison]
    code: 200
    input: ["result?", "limit?", "offset?"]
    output: PedestrianComplianceCheck[]
    side_effects: []

  - method: POST
    path: "/signal-ops/timing-plans/{id}/submit"
    description: "Submit a coordinated plan for certification."
    roles: [TimingEngineer]
    code: 200
    input: []
    output: TimingPlan
    side_effects:
      - "TimingPlan COORDINATED -> SUBMITTED"
      - "enforces the pedestrian compliance gate, the min-green gate and the half-open time-of-day overlap rule"
      - "increments TimingPlan.version by 1"

  - method: POST
    path: "/signal-ops/timing-plans/{id}/certify"
    description: "Certify a submitted plan. The certifying engineer must not be the plan's author."
    roles: [CertifyingEngineer]
    code: 200
    input: []
    output: TimingPlan
    side_effects:
      - "TimingPlan SUBMITTED -> CERTIFIED; sets certified_by_user_id := X-User-ID"
      - "increments TimingPlan.version by 1"

  - method: POST
    path: "/signal-ops/timing-plans/{id}/return"
    description: "Return a submitted plan to draft, fully compensating the coordination pipeline's writes."
    roles: [CertifyingEngineer]
    code: 200
    input: [reason]
    output: TimingPlan
    side_effects:
      - "TimingPlan SUBMITTED -> DRAFT"
      - "restores cycle_length_sec := drafted_cycle_length_sec, every PhaseSplit.effective_split_sec := split_sec, offset_sec := 0, ped_compliance_state := PENDING"
      - "deletes every PedestrianComplianceCheck of the plan; increments return_count and version by 1"

  - method: POST
    path: "/signal-ops/pedestrian-checks/{id}/waive"
    description: "Waive a failing pedestrian compliance check with written justification."
    roles: [CertifyingEngineer]
    code: 200
    input: [waiver_justification]
    output: PedestrianComplianceCheck
    side_effects:
      - "PedestrianComplianceCheck FAIL -> WAIVED; sets waived_by_user_id := X-User-ID"
      - "bubbles up: when the plan has no remaining FAIL check, sets TimingPlan.ped_compliance_state := WAIVED and increments that plan's version by 1"

  # ---------------- Transit and emergency vehicle priority ----------------
  - method: POST
    path: "/signal-ops/priority-configs"
    description: "Propose a transit (TSP) or emergency (EVP) priority configuration at an intersection."
    roles: [TimingEngineer]
    code: 201
    input: [intersection_id, priority_type, requested_max_extension_sec, "max_early_green_sec?", conflict_resolution_rank, expected_intersection_version]
    output: PriorityConfig
    side_effects:
      - "OCC on Intersection.version per concurrency_rules.priority-config-create-stale-intersection — ERR_STALE_INTERSECTION_VERSION (412) when stale"
      - "initialises approval_status := PROPOSED, deployment_status := NOT_DEPLOYED, granted_extension_sec := 0"
      - "sets proposed_by_user_id := X-User-ID; increments Intersection.version by 1"

  - method: POST
    path: "/signal-ops/priority-configs/{id}/approve"
    description: "Approve or reject a proposed priority configuration. The approver must not be the proposer."
    roles: [CertifyingEngineer]
    code: 200
    input: [decision, "note?"]
    output: PriorityConfig
    side_effects:
      - "PriorityConfig PROPOSED -> APPROVED (decision == APPROVE) or PROPOSED -> REJECTED (decision == REJECT)"
      - "sets approved_by_user_id := X-User-ID on approval; increments PriorityConfig.version by 1"

  - method: POST
    path: "/signal-ops/priority-configs/{id}/deploy"
    description: "Deploy an approved priority configuration and re-run the intersection's priority budget waterfall."
    roles: [SignalOpsAdmin]
    code: 200
    input: []
    output: PriorityConfig
    side_effects:
      - "PriorityConfig NOT_DEPLOYED|SUSPENDED -> DEPLOYED"
      - "re-runs calculations.priority_budget_allocation and rewrites granted_extension_sec on every DEPLOYED config of that intersection"
      - "recomputes Intersection.priority_budget_sec, granted_priority_extension_total_sec, unallocated_priority_budget_sec; increments Intersection.version by 1"

  - method: POST
    path: "/signal-ops/priority-configs/{id}/suspend"
    description: "Suspend a deployed priority configuration, releasing its granted extension back into the intersection's budget."
    roles: [SignalOpsAdmin]
    code: 200
    input: ["reason?"]
    output: PriorityConfig
    side_effects:
      - "PriorityConfig DEPLOYED -> SUSPENDED; sets granted_extension_sec := 0"
      - "re-runs calculations.priority_budget_allocation over the remaining DEPLOYED configs"
      - "recomputes the Intersection priority-budget fields; increments Intersection.version by 1"

  # ---------------- Field observation, fine tuning, evaluation ----------------
  - method: POST
    path: "/signal-ops/field-observations"
    description: "Log a field observation during fine tuning; an observation flagged requires_adjustment fires the three-link fine-tuning cascade."
    roles: [FieldTechnician]
    code: 201
    input: [project_id, intersection_id, tod_period, observed_at, finding_code, "requires_adjustment?"]
    output: FieldObservation
    side_effects:
      - "sets observer_user_id := X-User-ID and resolution_status := OPEN (cascade link 1)"
      - "when requires_adjustment == true: TimingPlan DEPLOYED -> DRAFT for the matching (intersection_id, tod_period) plan, restoring drafted splits and deleting its pedestrian checks (cascade link 2)"
      - "RetimingProject FIELD_TUNING -> PLAN_DEVELOPMENT with tuning_round incremented (cascade link 3)"
      - "PerformanceEvaluation PROVISIONAL -> INVALIDATED for that project (cascade link 4)"
      - "rejected with ERR_TUNING_ROUND_LIMIT, writing nothing, when tuning_round + 1 > 3"

  - method: PATCH
    path: "/signal-ops/field-observations/{id}"
    description: "Mark a field observation as addressed or dismissed so fine tuning can be completed."
    roles: [FieldTechnician, SignalOpsAdmin]
    code: 200
    input: [resolution_status]
    output: FieldObservation
    side_effects:
      - "increments FieldObservation.version by 1"

  - method: POST
    path: "/signal-ops/performance-evaluations/{id}/certify"
    description: "Certify a provisional evaluation, recomputing every metric under the arrivals-weighted certified variant with post-tuning runs only."
    roles: [CertifyingEngineer]
    code: 200
    input: []
    output: PerformanceEvaluation
    side_effects:
      - "PerformanceEvaluation PROVISIONAL -> CERTIFIED; sets metric_variant := CERTIFIED_WEIGHTED"
      - "recomputes every metric field per calculations.corridor_performance_metrics under certified_variant"
      - "sets certified_by_user_id := X-User-ID; increments PerformanceEvaluation.version by 1"

  # ---------------- Test-driving endpoint (§1.5 priority ladder rung 3) ----------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint every timestamp the server stamps (received_at, recorded_at, last_retimed_at, screened_at, last_tuning_completed_at) and every window/age comparison reads that default, never real wall-clock time."
    roles: [SignalOpsAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "moves the logical clock; does not mutate any stored entity and does not bump any version"

# =====================================================================================
# §1.6 Error Code Catalog
# =====================================================================================
errors:

  # ---- authentication / authorization ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty on any /signal-ops or /_clock request"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the six roles declared in §1.7"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID equals the identity that authored the artifact being approved: certifying a TimingPlan whose authored_by_user_id == X-User-ID, or approving a PriorityConfig whose proposed_by_user_id == X-User-ID"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "role PublicRequester acts on a Requester row or a CitizenComplaint whose requester_id differs from X-User-ID"

  # ---- not found ----
  - id: ERR_INTERSECTION_NOT_FOUND
    http: 404
    condition: "intersection_id in the path or in the request body matches no Intersection"
  - id: ERR_CORRIDOR_NOT_FOUND
    http: 404
    condition: "corridor_id in the path or in the request body matches no Corridor"
  - id: ERR_REQUESTER_NOT_FOUND
    http: 404
    condition: "requester_id in the path or in the request body matches no Requester"
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "complaint_id in the path matches no CitizenComplaint"
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "project_id in the path or in the request body matches no RetimingProject"
  - id: ERR_TIMING_PLAN_NOT_FOUND
    http: 404
    condition: "plan_id in the path matches no TimingPlan"
  - id: ERR_PHASE_SPLIT_NOT_FOUND
    http: 404
    condition: "split_id in the path matches no PhaseSplit"
  - id: ERR_PED_CHECK_NOT_FOUND
    http: 404
    condition: "check_id in the path matches no PedestrianComplianceCheck"
  - id: ERR_PRIORITY_CONFIG_NOT_FOUND
    http: 404
    condition: "config_id in the path matches no PriorityConfig"
  - id: ERR_OBSERVATION_NOT_FOUND
    http: 404
    condition: "observation_id in the path matches no FieldObservation"
  - id: ERR_EVALUATION_NOT_FOUND
    http: 404
    condition: "evaluation_id in the path matches no PerformanceEvaluation"

  # ---- request shape ----
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "a required input field is missing, an enum value is outside its declared set, a numeric field is non-numeric or out of range, phase_volumes is absent/empty/non-object or holds a negative volume, tod_start_min >= tod_end_min, or a timestamp is not RFC3339 UTC"
  - id: ERR_INVALID_PAGINATION
    http: 422
    condition: "limit < 1, limit > 100, or offset < 0 on any list endpoint"

  # ---- state errors ----
  - id: ERR_CORRIDOR_NOT_SCREENED
    http: 409
    condition: "POST /signal-ops/corridors/{id}/selection-decision when Corridor.selection_status != SCREENED"
  - id: ERR_CORRIDOR_NOT_SELECTED
    http: 409
    condition: "POST /signal-ops/retiming-projects when the referenced Corridor.selection_status != SELECTED"
  - id: ERR_PROJECT_NOT_IN_DATA_COLLECTION
    http: 409
    condition: "POST /signal-ops/retiming-projects/{id}/advance when RetimingProject.status != DATA_COLLECTION"
  - id: ERR_PROJECT_NOT_IN_PLAN_DEVELOPMENT
    http: 409
    condition: "POST /signal-ops/timing-plans, /coordinate or /implement when RetimingProject.status != PLAN_DEVELOPMENT"
  - id: ERR_PROJECT_NOT_IMPLEMENTED
    http: 409
    condition: "POST /signal-ops/retiming-projects/{id}/field-tuning with action == START when RetimingProject.status != IMPLEMENTED"
  - id: ERR_PROJECT_NOT_IN_FIELD_TUNING
    http: 409
    condition: "POST /signal-ops/field-observations, or /field-tuning with action == COMPLETE, when RetimingProject.status != FIELD_TUNING"
  - id: ERR_PROJECT_NOT_IN_EVALUATION
    http: 409
    condition: "POST /signal-ops/retiming-projects/{id}/performance-evaluations when RetimingProject.status NOT IN {FIELD_TUNING, EVALUATION}; POST /signal-ops/retiming-projects/{id}/close with disposition == CLOSED when status != EVALUATION; POST /signal-ops/performance-evaluations/{id}/certify when the parent project is not in EVALUATION; POST /signal-ops/complaints/{id}/resolve when the linked project's status is NOT IN {EVALUATION, CLOSED}"
  - id: ERR_PROJECT_TERMINAL
    http: 409
    condition: "any write against a RetimingProject whose status is CLOSED or ABANDONED"
  - id: ERR_PLAN_NOT_DRAFT
    http: 409
    condition: "POST /signal-ops/timing-plans/{id}/phase-splits or PATCH /signal-ops/phase-splits/{id} when the parent TimingPlan.status != DRAFT"
  - id: ERR_PLAN_NOT_COORDINATED
    http: 409
    condition: "POST /signal-ops/timing-plans/{id}/submit when TimingPlan.status != COORDINATED"
  - id: ERR_PLAN_NOT_SUBMITTED
    http: 409
    condition: "POST /signal-ops/timing-plans/{id}/certify or /return when TimingPlan.status != SUBMITTED"
  - id: ERR_PED_CHECK_NOT_FAILING
    http: 409
    condition: "POST /signal-ops/pedestrian-checks/{id}/waive when PedestrianComplianceCheck.result != FAIL"
  - id: ERR_CONFIG_NOT_PROPOSED
    http: 409
    condition: "POST /signal-ops/priority-configs/{id}/approve when PriorityConfig.approval_status != PROPOSED"
  - id: ERR_CONFIG_NOT_APPROVED
    http: 409
    condition: "POST /signal-ops/priority-configs/{id}/deploy when PriorityConfig.approval_status != APPROVED"
  - id: ERR_CONFIG_NOT_DEPLOYED
    http: 409
    condition: "POST /signal-ops/priority-configs/{id}/suspend when PriorityConfig.deployment_status != DEPLOYED"
  - id: ERR_COMPLAINT_INVALID_STATE
    http: 409
    condition: "a complaint action is attempted from a status the CitizenComplaint machine does not allow it from (triage outside OPEN, link outside TRIAGED, resolve outside LINKED, reopen outside RESOLVED)"
  - id: ERR_EVALUATION_NOT_PROVISIONAL
    http: 409
    condition: "POST /signal-ops/performance-evaluations/{id}/certify when PerformanceEvaluation.status != PROVISIONAL"
  - id: ERR_OBSERVATION_NOT_OPEN
    http: 409
    condition: "PATCH /signal-ops/field-observations/{id} when FieldObservation.resolution_status != OPEN"
  - id: ERR_OBSERVATIONS_UNRESOLVED
    http: 409
    condition: "POST /signal-ops/retiming-projects/{id}/field-tuning with action == COMPLETE while the project still has a FieldObservation in resolution_status OPEN"

  # ---- optimistic concurrency ----
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: "expected_project_version does not equal the current RetimingProject.version on POST /signal-ops/timing-plans or POST /signal-ops/retiming-projects/{id}/performance-evaluations"
  - id: ERR_STALE_INTERSECTION_VERSION
    http: 412
    condition: "expected_intersection_version does not equal the current Intersection.version on POST /signal-ops/priority-configs"

  # ---- safety / engineering-standard errors ----
  - id: ERR_APS_STANDARD_MISMATCH
    http: 422
    condition: "PATCH /signal-ops/intersections/{id} sets aps_installed true while walking_speed_standard would remain STD_3_5_FPS, or clears aps_installed while walking_speed_standard is EXTENDED_3_0_FPS"
  - id: ERR_POSTURE_BLOCKS_CERTIFICATION
    http: 409
    condition: "POST /signal-ops/timing-plans/{id}/certify when the plan's Intersection.operational_posture == BLOCKED"
  - id: ERR_POSTURE_BLOCKS_DEPLOYMENT
    http: 409
    condition: "POST /signal-ops/priority-configs/{id}/deploy when the config's Intersection.operational_posture != READY"
  - id: ERR_PED_CLEARANCE_INSUFFICIENT
    http: 422
    condition: "POST /signal-ops/timing-plans/{id}/submit while the plan holds a PedestrianComplianceCheck with result FAIL that has not been waived"
  - id: ERR_MIN_GREEN_VIOLATION
    http: 422
    condition: "POST /signal-ops/timing-plans/{id}/submit when any PhaseSplit.effective_split_sec is below that phase's min_green_sec + yellow_sec + red_clearance_sec"
  - id: ERR_CYCLE_EXCEEDS_LOCAL_MAX
    http: 422
    condition: "the coordinated cycle length written by POST /signal-ops/retiming-projects/{id}/coordinate would exceed the Intersection.max_cycle_length_sec of one of the project's plans"
  - id: ERR_OVERSATURATED_APPROACH
    http: 422
    condition: "POST /signal-ops/intersections/{id}/turning-movement-counts whose critical_flow_ratio_sum >= 0.95"

  # ---- referential / study-completeness errors ----
  - id: ERR_BEFORE_STUDY_INCOMPLETE
    http: 409
    condition: "POST /signal-ops/retiming-projects/{id}/advance when the project lacks a BEFORE TurningMovementCount for every eligible corridor member, or has no BEFORE TravelTimeRun row at all; also raised by /coordinate when a participating member has no BEFORE count, and by the performance-metrics calculation when the BEFORE run set is empty"
  - id: ERR_PLAN_COVERAGE_INCOMPLETE
    http: 409
    condition: "POST /signal-ops/retiming-projects/{id}/coordinate or /implement when the project has no plan, or lacks a plan for an eligible corridor member"
  - id: ERR_COMPLAINT_PROJECT_MISMATCH
    http: 422
    condition: "POST /signal-ops/complaints/{id}/link when the target RetimingProject.corridor_id differs from the complaint's corridor_id"
  - id: ERR_NO_AFTER_STUDY
    http: 409
    condition: "POST /signal-ops/retiming-projects/{id}/performance-evaluations when the project has no AFTER TravelTimeRun row at all, or POST /signal-ops/performance-evaluations/{id}/certify when no AFTER run has recorded_at >= RetimingProject.last_tuning_completed_at"
  - id: ERR_NO_ELIGIBLE_MEMBERS
    http: 409
    condition: "POST /signal-ops/corridors/{id}/screen when the corridor's member set contains no Intersection whose operational_posture is READY or RESTRICTED (the empty eligible set, including the zero-member corridor)"
  - id: ERR_SCORE_BELOW_SELECT_THRESHOLD
    http: 409
    condition: "POST /signal-ops/corridors/{id}/selection-decision with decision == SELECT when the programming-variant priority_score is below 50.00"
  - id: ERR_CORRIDOR_PROJECT_ACTIVE
    http: 409
    condition: "POST /signal-ops/retiming-projects when the corridor already has a project whose status is not CLOSED or ABANDONED"

  # ---- temporal errors ----
  - id: ERR_STUDY_WINDOW_EXPIRED
    http: 409
    condition: "POST /signal-ops/retiming-projects/{id}/advance when the logical clock is at or past study_window_start_at + study_window_days"
  - id: ERR_TOD_WINDOW_OVERLAP
    http: 409
    condition: "POST /signal-ops/timing-plans/{id}/submit when the plan's half-open [tod_start_min, tod_end_min) window overlaps another SUBMITTED, CERTIFIED or DEPLOYED plan's window at the same intersection; touching endpoints do not overlap"
  - id: ERR_RUN_SPACING_VIOLATION
    http: 409
    condition: "POST /signal-ops/retiming-projects/{id}/travel-time-runs when the gap between the new run's closed interval [started_at, started_at + duration_sec] and an existing run's closed interval, for the same (project_id, direction, study_role), is strictly less than 120 seconds (overlap and touching endpoints included); a gap of exactly 120 seconds is accepted"
  - id: ERR_OBSERVATION_OUT_OF_WINDOW
    http: 422
    condition: "POST /signal-ops/field-observations whose observed_at is before the project's implemented-at moment or after the logical clock now"

  # ---- uniqueness / structural errors ----
  - id: ERR_DUPLICATE_REQUESTER_EMAIL
    http: 409
    condition: "POST /signal-ops/requesters with an email already held by another Requester (case-insensitive)"
  - id: ERR_DUPLICATE_PRIORITY_RANK
    http: 409
    condition: "POST /signal-ops/priority-configs with a conflict_resolution_rank already held, at the same intersection_id and for the same priority_type, by a config whose deployment_status != SUSPENDED (matching the §1.1 uniqueness constraint exactly: a SUSPENDED config releases its rank, and the same rank may be reused across the two priority_type values)"
  - id: ERR_DUPLICATE_PHASE_NUMBER
    http: 409
    condition: "POST /signal-ops/timing-plans/{id}/phase-splits with a phase_number already present on that plan"
  - id: ERR_DUPLICATE_CORRIDOR_MEMBER
    http: 409
    condition: "POST /signal-ops/corridors/{id}/members with an intersection_id already enrolled in that corridor"
  - id: ERR_SEQUENCE_INDEX_GAP
    http: 422
    condition: "POST /signal-ops/corridors/{id}/members whose sequence_index is not exactly the corridor's current member_count + 1"
  - id: ERR_DUPLICATE_TOD_PLAN
    http: 409
    condition: "POST /signal-ops/timing-plans for a (project_id, intersection_id, tod_period) triple that already has a plan in status COORDINATED, SUBMITTED, CERTIFIED or DEPLOYED"

  # ---- budget / limit errors ----
  - id: ERR_TUNING_ROUND_LIMIT
    http: 409
    condition: "POST /signal-ops/field-observations with requires_adjustment true when RetimingProject.tuning_round + 1 would exceed 3"
  - id: ERR_PRIORITY_BUDGET_EXHAUSTED
    http: 409
    condition: "POST /signal-ops/priority-configs/{id}/deploy when the intersection's unallocated_priority_budget_sec is 0, so the waterfall could grant this config no seconds at all"

  # ---- clock ----
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "POST /_clock/set_current_utc with a to_iso8601 strictly earlier than the clock's current value"

# =====================================================================================
# §1.7 RBAC Matrix
# =====================================================================================
roles:

  - name: SignalOpsAdmin
    description: "Traffic operations division administrator: owns the signal inventory, corridor screening and selection, project phase gates, priority deployment and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /signal-ops/intersections"
      - "PATCH /signal-ops/intersections/{id}"
      - "POST /signal-ops/corridors"
      - "POST /signal-ops/corridors/{id}/members"
      - "POST /signal-ops/corridors/{id}/screen"
      - "POST /signal-ops/corridors/{id}/selection-decision"
      - "POST /signal-ops/retiming-projects/{id}/field-tuning"
      - "POST /signal-ops/retiming-projects/{id}/close"
      - "POST /signal-ops/priority-configs/{id}/deploy"
      - "POST /signal-ops/priority-configs/{id}/suspend"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "PATCH /signal-ops/field-observations/{id} (with FieldTechnician)"
      - "every operational GET under /signal-ops (with TimingEngineer, CertifyingEngineer, FieldTechnician, CitizenLiaison)"

  - name: TimingEngineer
    description: "Develops timing plans: opens projects, advances them out of data collection, runs the corridor coordination pipeline, drafts plans and splits, submits for certification, proposes priority configurations, and implements approved retimings."
    identity: "opaque"
    exclusive_operations:
      - "POST /signal-ops/retiming-projects"
      - "POST /signal-ops/retiming-projects/{id}/advance"
      - "POST /signal-ops/retiming-projects/{id}/coordinate"
      - "POST /signal-ops/retiming-projects/{id}/implement"
      - "POST /signal-ops/timing-plans"
      - "POST /signal-ops/timing-plans/{id}/phase-splits"
      - "PATCH /signal-ops/phase-splits/{id}"
      - "POST /signal-ops/timing-plans/{id}/submit"
      - "POST /signal-ops/priority-configs"
    shared_operations:
      - "every operational GET under /signal-ops (with SignalOpsAdmin, CertifyingEngineer, FieldTechnician, CitizenLiaison)"

  - name: CertifyingEngineer
    description: "Independent reviewer: certifies or returns submitted timing plans, waives failing pedestrian checks with written justification, approves or rejects priority configurations, and produces and certifies performance evaluations. Segregation of duties forbids certifying or approving artifacts this same X-User-ID authored."
    identity: "opaque"
    exclusive_operations:
      - "POST /signal-ops/timing-plans/{id}/certify"
      - "POST /signal-ops/timing-plans/{id}/return"
      - "POST /signal-ops/pedestrian-checks/{id}/waive"
      - "POST /signal-ops/priority-configs/{id}/approve"
      - "POST /signal-ops/retiming-projects/{id}/performance-evaluations"
      - "POST /signal-ops/performance-evaluations/{id}/certify"
    shared_operations:
      - "every operational GET under /signal-ops (with SignalOpsAdmin, TimingEngineer, FieldTechnician, CitizenLiaison)"

  - name: FieldTechnician
    description: "Collects field data: turning movement counts, floating-car travel time runs, and field observations during fine tuning."
    identity: "opaque"
    exclusive_operations:
      - "POST /signal-ops/intersections/{id}/turning-movement-counts"
      - "POST /signal-ops/retiming-projects/{id}/travel-time-runs"
      - "POST /signal-ops/field-observations"
    shared_operations:
      - "PATCH /signal-ops/field-observations/{id} (with SignalOpsAdmin)"
      - "every operational GET under /signal-ops (with SignalOpsAdmin, TimingEngineer, CertifyingEngineer)"

  - name: CitizenLiaison
    description: "Public-information officer: registers requesters and moves citizen complaints through triage, linkage to a retiming project, resolution and reopening."
    identity: "opaque"
    exclusive_operations:
      - "POST /signal-ops/requesters"
      - "POST /signal-ops/complaints/{id}/triage"
      - "POST /signal-ops/complaints/{id}/link"
      - "POST /signal-ops/complaints/{id}/resolve"
      - "POST /signal-ops/complaints/{id}/reopen"
    shared_operations:
      - "POST /signal-ops/complaints (with PublicRequester)"
      - "GET /signal-ops/requesters/{id} and GET /signal-ops/requesters/{id}/complaints for any requester (with PublicRequester, who is limited to their own)"
      - "every operational GET under /signal-ops (with SignalOpsAdmin, TimingEngineer, CertifyingEngineer, FieldTechnician)"

  - name: PublicRequester
    description: "A member of the public acting as themselves. X-User-ID is the Requester.id; may file complaints on their own behalf and read only their own requester row and complaints."
    identity: "entity_backed:Requester"
    exclusive_operations: []
    shared_operations:
      - "POST /signal-ops/complaints, restricted to requester_id == X-User-ID (with CitizenLiaison)"
      - "GET /signal-ops/requesters/{id}, restricted to requester_id == X-User-ID (with CitizenLiaison)"
      - "GET /signal-ops/requesters/{id}/complaints, restricted to requester_id == X-User-ID (with CitizenLiaison)"
