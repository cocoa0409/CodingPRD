# =============================================================================
# PRD Benchmark Seed Tables — Media Asset Management & Archive Operations
# =============================================================================

scenario: |
  Media Asset Management & Archive Operations (broadcast archive department):
  ingest & standardized metadata tagging, proxy generation & search index,
  rights/restriction flags & expiration on assets, storage tiering & migration
  between formats, retrieval request & delivery workflow, retention/disposal
  policy & legal hold, preservation of obsolete formats & digitization queue,
  usage tracking & royalty implications

domain_name: media-archive-operations
api_prefix: /archive

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Work email; unique across staff" }
      - { name: full_name, type: string, source: input, description: "Display name" }
      - { name: department, type: string, source: input, description: "Department label (free-form)" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether the staff account is active" }

  - name: IngestBatch
    parent: null
    common_fields: true
    fields:
      - { name: batch_name, type: string, source: input, description: "Human label for the ingest batch" }
      - { name: source_department, type: string, source: input, description: "Originating department" }
      - { name: status, type: enum, source: system, description: "OPEN → FINALIZED" }
      - { name: asset_count, type: integer, source: computed, default: 0, description: "Count of Assets whose ingest_batch_id == this batch id" }

  - name: Asset
    parent: null
    common_fields: true
    fields:
      - { name: ingest_batch_id, type: string, source: input, description: "FK -> IngestBatch.id; batch the asset was ingested under" }
      - { name: source_asset_id, type: string, source: system, default: null, description: "FK -> Asset.id; set only on derivative assets produced by a completed DigitizationTicket (self-referential); null for originals" }
      - { name: title, type: string, source: input, description: "Asset title" }
      - { name: description, type: string, source: input, description: "Catalog description; must be non-empty before submit-metadata" }
      - { name: media_type, type: enum, source: input, description: "VIDEO | AUDIO | FILM | PHOTO | DOCUMENT" }
      - { name: format_class, type: enum, source: input, description: "BETACAM_SP | UMATIC | VHS | FILM_16MM | AUDIO_REEL | AUDIO_DAT | DIGITAL_FILE | PRORES_FILE" }
      - { name: duration_seconds, type: integer, source: input, description: "Runtime in seconds; must be > 0" }
      - { name: size_gb, type: number, source: input, description: "Storage footprint in GB; must be > 0" }
      - { name: rights_holder, type: string, source: input, description: "Rights-holder label used to sweep usage into royalty statements" }
      - { name: keywords, type: array, source: input, default: [], description: "Search keywords; must contain >= 1 entry before submit-metadata" }
      - { name: content_rating, type: enum, source: input, default: "NR", description: "G | PG | PG13 | R | NR; must be != NR before submit-metadata" }
      - { name: catalog_status, type: enum, source: system, description: "METADATA_DRAFT → IN_REVIEW → CATALOGED → ARCHIVED → DISPOSAL_SCHEDULED → DISPOSED, with rework loops" }
      - { name: storage_tier, type: enum, source: system, default: "ONLINE", description: "ONLINE | NEARLINE | DEEP_ARCHIVE; changed only by completed MigrationJob" }
      - { name: rights_posture, type: enum, source: computed, description: "Derived from RightsGrants vs logical clock: CLEARED | RESTRICTED | EXPIRED (see rights_posture_derivation)" }
      - { name: hold_status, type: enum, source: computed, description: "HELD iff any LegalHold for this asset is ACTIVE, else CLEAR" }
      - { name: metadata_submitted_by_user_id, type: string, source: system, default: null, description: "X-User-ID captured at submit-metadata; used for segregation-of-duties on metadata-approve" }

  - name: ProxyRendition
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id" }
      - { name: rendition_type, type: enum, source: input, default: "PROXY_LOWRES", description: "PROXY_LOWRES | PROXY_HIGHRES" }
      - { name: status, type: enum, source: system, description: "QUEUED → RENDERING → READY | FAILED, with FAILED → QUEUED retry" }
      - { name: retry_count, type: integer, source: system, default: 0, description: "Increments on each retry; hard cap MAX_PROXY_RETRIES = 3" }
      - { name: proxy_url, type: string, source: system, default: null, description: "Set on complete; presence means the asset is searchable via proxy" }
      - { name: indexed_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp when rendition became READY and entered the search index" }
      - { name: failure_reason, type: string, source: input, default: null, description: "Operator-supplied reason recorded on fail" }

  - name: RightsGrant
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id" }
      - { name: grant_type, type: enum, source: input, description: "BROADCAST | STREAMING | SYNDICATION | ARCHIVAL_ONLY" }
      - { name: territory, type: enum, source: input, description: "DOMESTIC | REGIONAL | GLOBAL" }
      - { name: exclusive, type: boolean, source: input, default: false, description: "Exclusive grants enforce window non-overlap per (asset, grant_type, territory)" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive start of rights window" }
      - { name: window_end, type: datetime, source: input, description: "EXCLUSIVE end of rights window: grant effective while window_start <= now < window_end" }
      - { name: restriction_flags, type: array, source: input, default: [], description: "Zero or more of EDITORIAL_ONLY | NO_RERUN | NEWS_USE_ONLY | GEO_BLOCKED; empty means unrestricted" }
      - { name: status, type: enum, source: system, description: "ACTIVE → REVOKED (expiration is computed from the window, not a state)" }

  - name: LegalHold
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id" }
      - { name: matter_reference, type: string, source: input, description: "Legal matter docket reference" }
      - { name: reason, type: string, source: input, description: "Why the hold is placed" }
      - { name: placed_by_user_id, type: string, source: system, description: "X-User-ID of the placing LegalCounsel; release must come from a different user id" }
      - { name: status, type: enum, source: system, description: "ACTIVE (on create) → RELEASED" }
      - { name: released_by_user_id, type: string, source: system, default: null, description: "X-User-ID of releasing LegalCounsel" }
      - { name: released_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of release" }

  - name: RetentionPolicy
    parent: null
    common_fields: true
    fields:
      - { name: media_type, type: enum, source: input, description: "VIDEO | AUDIO | FILM | PHOTO | DOCUMENT; unique among RetentionPolicy rows" }
      - { name: min_retention_years, type: integer, source: input, description: "Minimum years an asset of this media_type must be kept before disposal; years counted as 365 days" }
      - { name: requires_legal_review, type: boolean, source: input, default: false, description: "Recorded flag; informational for downstream review routing" }

  - name: DisposalOrder
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creating ArchivistLead; approver must differ" }
      - { name: scheduled_execution_date, type: datetime, source: input, description: "Earliest logical time at which execute is allowed; must be > now at create" }
      - { name: retention_override, type: boolean, source: input, default: false, description: "If true, create skips the retention-elapsed check" }
      - { name: override_reason, type: string, source: input, default: null, description: "Required when retention_override is true" }
      - { name: pinned_asset_version, type: integer, source: system, description: "Asset.version as it stands AFTER the create's own version increment (i.e., expected_asset_version + 1); re-checked at approve and execute" }
      - { name: status, type: enum, source: system, description: "DRAFT → PENDING_APPROVAL → APPROVED → EXECUTED; branches REJECTED / WITHDRAWN / BLOCKED" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of approving ArchivistLead" }
      - { name: reject_reason, type: string, source: input, default: null, description: "Reason recorded on reject" }

  - name: RetrievalRequest
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id" }
      - { name: requester_id, type: string, source: input, description: "FK -> StaffMember.id; the requesting staff member (Requester role identity)" }
      - { name: purpose, type: enum, source: input, description: "BROADCAST | INTERNAL_REVIEW | EXHIBITION; BROADCAST requires rights_posture CLEARED, others allow CLEARED or RESTRICTED" }
      - { name: delivery_tier, type: enum, source: input, default: "STANDARD", description: "STANDARD | EXPEDITE" }
      - { name: requested_delivery_by, type: datetime, source: input, description: "Requested deadline; must be > now and, for BROADCAST, < every effective grant's window_end" }
      - { name: status, type: enum, source: system, description: "SUBMITTED → UNDER_REVIEW → RECALLING | STAGED → DELIVERED; branches RETURN loop / REJECTED / CANCELLED / EXPIRED" }
      - { name: quoted_fee_cents, type: integer, source: computed, default: null, description: "Delivery fee quoted at approve time from delivery_fee_cents calculation" }
      - { name: return_count, type: integer, source: system, default: 0, description: "Increments each time the request is returned from UNDER_REVIEW to SUBMITTED" }
      - { name: staged_at, type: datetime, source: system, default: null, description: "Logical time the request entered STAGED; expiry measured from this" }
      - { name: delivered_at, type: datetime, source: system, default: null, description: "Logical time of delivery" }
      - { name: review_note, type: string, source: input, default: null, description: "Note supplied on return/reject" }

  - name: UsageEvent
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id" }
      - { name: reported_by_id, type: string, source: input, description: "FK -> StaffMember.id; the Requester reporting usage" }
      - { name: usage_type, type: enum, source: input, description: "BROADCAST | REBROADCAST | STREAMING | PROMO" }
      - { name: market_size, type: integer, source: input, description: "Audience size of the market; must be > 0; selects market tier" }
      - { name: duration_seconds_used, type: integer, source: input, description: "Seconds of the asset used; must be > 0" }
      - { name: aired_at, type: datetime, source: input, description: "Logical timestamp of usage; statement sweep includes aired_at in [period_start, period_end)" }
      - { name: status, type: enum, source: system, description: "REPORTED → VERIFIED → ROYALTY_POSTED; REPORTED|VERIFIED → DISPUTED → REPORTED" }
      - { name: provisional_accrual_cents, type: integer, source: computed, default: null, description: "Accrual computed at verify time by royalty_event_accrual (provisional variant)" }
      - { name: final_accrual_cents, type: integer, source: computed, default: null, description: "Accrual recomputed at statement close (final variant with volume discount)" }
      - { name: statement_id, type: string, source: system, default: null, description: "FK -> RoyaltyStatement.id; set when swept into a statement at close" }
      - { name: dispute_reason, type: string, source: input, default: null, description: "Reason recorded on dispute" }

  - name: RoyaltyStatement
    parent: null
    common_fields: true
    fields:
      - { name: rights_holder, type: string, source: input, description: "Rights-holder label; swept events are those whose asset.rights_holder equals this" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive period start" }
      - { name: period_end, type: datetime, source: input, description: "EXCLUSIVE period end; must be > period_start" }
      - { name: status, type: enum, source: system, description: "OPEN → CLOSED → POSTED; CLOSED → OPEN reopen loop" }
      - { name: event_ids, type: array, source: system, default: [], description: "Snapshot of UsageEvent ids swept at close; cleared on reopen" }
      - { name: total_verified_seconds, type: integer, source: computed, default: 0, description: "Sum of duration_seconds_used over swept events; selects volume tier" }
      - { name: volume_tier, type: enum, source: computed, default: null, description: "TIER_0 | TIER_1 | TIER_2 derived from total_verified_seconds" }
      - { name: provisional_total_cents, type: integer, source: computed, default: null, description: "Sum of provisional_accrual_cents over the swept set (no volume discount)" }
      - { name: total_accrual_cents, type: integer, source: computed, default: null, description: "Sum of final_accrual_cents over the swept set (volume discount applied per event, rounded per event)" }

  - name: MigrationJob
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id" }
      - { name: target_tier, type: enum, source: input, description: "ONLINE | NEARLINE | DEEP_ARCHIVE; must differ from asset's current storage_tier" }
      - { name: status, type: enum, source: system, description: "QUEUED → IN_PROGRESS → COMPLETED | FAILED → QUEUED; QUEUED ↔ HOLD_PAUSED; SUPERSEDED / CANCELLED terminals" }
      - { name: retry_count, type: integer, source: system, default: 0, description: "Increments on each retry; hard cap MAX_MIGRATION_RETRIES = 2" }
      - { name: checksum_sha256, type: string, source: input, default: null, description: "Operator-supplied checksum recorded at complete" }
      - { name: failure_reason, type: string, source: input, default: null, description: "Reason recorded on fail" }

  - name: DigitizationTicket
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id; asset's format_class must be in the OBSOLETE_FORMATS set" }
      - { name: workstation_id, type: string, source: system, default: null, description: "FK -> Workstation.id; set by assign or auto-assign" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned slot start (recomputed by auto-assign)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Planned slot end; must be > scheduled_start" }
      - { name: output_format, type: enum, source: input, description: "PRORES_FILE | H264_FILE; format of the derivative asset produced at qc-pass" }
      - { name: priority_score, type: integer, source: computed, description: "preservation_priority_score: decay_risk(format) * age_years + delivered_retrievals_365d * 10" }
      - { name: status, type: enum, source: system, description: "QUEUED → ASSIGNED → DIGITIZING → QC_REVIEW → COMPLETED | (qc-fail) → QUEUED | QC_FAILED; CANCELLED from QUEUED|ASSIGNED" }
      - { name: rework_count, type: integer, source: system, default: 0, description: "Increments on each qc-fail; at MAX_QC_REWORKS = 2 the next qc-fail sends ticket to QC_FAILED" }
      - { name: qc_notes, type: string, source: input, default: null, description: "Notes recorded on qc-pass/qc-fail" }

  - name: Workstation
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Workstation label; unique" }
      - { name: supported_formats, type: array, source: input, description: "Subset of format_class values this station can digitize" }
      - { name: status, type: enum, source: system, description: "ACTIVE ↔ MAINTENANCE" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: IngestBatch
    initial_state: OPEN
    terminal_states: [FINALIZED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /archive/ingest-batches/{id}/finalize"
        actor: IngestCoordinator
        preconditions:
          - "Batch has >= 1 Asset (ERR_EMPTY_BATCH)"
          - "Every Asset with ingest_batch_id == batch.id has catalog_status != METADATA_DRAFT (ERR_BATCH_ASSETS_UNRESOLVED)"
        side_effects:
          - "status → FINALIZED; further POST /archive/assets against this batch rejected (ERR_BATCH_NOT_OPEN)"

  - entity: Asset
    initial_state: METADATA_DRAFT
    terminal_states: [DISPOSED]
    note: >
      Parallel dimensions: catalog_status (this machine) evolves independently of
      storage_tier (mutated only by MigrationJob completion) and of the computed
      postures rights_posture / hold_status. A tier migration never changes
      catalog_status and vice versa.
    transitions:
      - from: METADATA_DRAFT
        to: IN_REVIEW
        trigger: "POST /archive/assets/{id}/submit-metadata"
        actor: MetadataCataloger
        preconditions:
          - "catalog_status == METADATA_DRAFT (ERR_INVALID_CATALOG_TRANSITION)"
          - "description non-empty AND keywords >= 1 entry AND content_rating != NR (ERR_METADATA_INCOMPLETE)"
        side_effects:
          - "metadata_submitted_by_user_id := X-User-ID"
      - from: IN_REVIEW
        to: CATALOGED
        trigger: "POST /archive/assets/{id}/metadata-approve"
        actor: MetadataLibrarian
        preconditions:
          - "catalog_status == IN_REVIEW (ERR_INVALID_CATALOG_TRANSITION)"
          - "X-User-ID != metadata_submitted_by_user_id (ERR_SOD_METADATA_SELF_APPROVE)"
        side_effects: []
      - from: IN_REVIEW
        to: METADATA_DRAFT
        trigger: "POST /archive/assets/{id}/metadata-reject"
        actor: MetadataLibrarian
        preconditions:
          - "catalog_status == IN_REVIEW (ERR_INVALID_CATALOG_TRANSITION)"
        side_effects:
          - "metadata_submitted_by_user_id := null"
      - from: CATALOGED
        to: ARCHIVED
        trigger: "POST /archive/assets/{id}/archive"
        actor: ArchivistLead
        preconditions:
          - "catalog_status == CATALOGED (ERR_INVALID_CATALOG_TRANSITION)"
          - ">= 1 ProxyRendition for this asset in READY state (ERR_PROXY_NOT_READY)"
          - ">= 1 RightsGrant row exists for this asset (any status) (ERR_NO_RIGHTS_GRANT_ON_RECORD)"
        side_effects: []
      - from: ARCHIVED
        to: IN_REVIEW
        trigger: "POST /archive/assets/{id}/recatalog"
        actor: ArchivistLead
        preconditions:
          - "catalog_status == ARCHIVED (ERR_INVALID_CATALOG_TRANSITION)"
        side_effects:
          - "metadata_submitted_by_user_id := null (fresh review round)"
      - from: ARCHIVED
        to: DISPOSAL_SCHEDULED
        trigger: "system (when a DisposalOrder for this asset is APPROVED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISPOSAL_SCHEDULED
        to: ARCHIVED
        trigger: "system (when the scheduling DisposalOrder is WITHDRAWN, or auto-BLOCKED by legal-hold activation)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISPOSAL_SCHEDULED
        to: DISPOSED
        trigger: "system (when the scheduling DisposalOrder is EXECUTED)"
        actor: system
        preconditions: []
        side_effects:
          - "All RetrievalRequests for this asset in SUBMITTED | UNDER_REVIEW | RECALLING | STAGED → CANCELLED"
          - "All MigrationJobs for this asset in QUEUED | HOLD_PAUSED → CANCELLED"
          - "All DigitizationTickets for this asset in QUEUED | ASSIGNED → CANCELLED"
    # storage_tier dimension (parallel): ONLINE | NEARLINE | DEEP_ARCHIVE, any-direction,
    # mutated only by MigrationJob COMPLETED (see MigrationJob machine).

  - entity: ProxyRendition
    initial_state: QUEUED
    terminal_states: [READY]
    transitions:
      - from: QUEUED
        to: RENDERING
        trigger: "POST /archive/proxy-renditions/{id}/claim"
        actor: LabTechnician
        preconditions:
          - "status == QUEUED (ERR_PROXY_NOT_QUEUED)"
        side_effects: []
      - from: RENDERING
        to: READY
        trigger: "POST /archive/proxy-renditions/{id}/complete"
        actor: LabTechnician
        preconditions:
          - "status == RENDERING (ERR_PROXY_NOT_RENDERING)"
        side_effects:
          - "proxy_url := system-generated; indexed_at := now (search index entry)"
      - from: RENDERING
        to: FAILED
        trigger: "POST /archive/proxy-renditions/{id}/fail"
        actor: LabTechnician
        preconditions:
          - "status == RENDERING (ERR_PROXY_NOT_RENDERING)"
        side_effects:
          - "failure_reason := input.reason"
      - from: FAILED
        to: QUEUED
        trigger: "POST /archive/proxy-renditions/{id}/retry"
        actor: LabTechnician
        preconditions:
          - "status == FAILED (ERR_PROXY_NOT_FAILED)"
          - "retry_count < MAX_PROXY_RETRIES (3) (ERR_RETRY_BUDGET_EXHAUSTED)"
        side_effects:
          - "retry_count += 1"

  - entity: RightsGrant
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /archive/rights-grants/{id}/revoke"
        actor: RightsManager
        preconditions:
          - "status == ACTIVE (ERR_GRANT_ALREADY_REVOKED)"
        side_effects:
          - "Asset.rights_posture recomputed on next read (grant no longer effective)"

  - entity: LegalHold
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /archive/legal-holds/{id}/release"
        actor: LegalCounsel
        preconditions:
          - "status == ACTIVE (ERR_HOLD_ALREADY_RELEASED)"
          - "X-User-ID != placed_by_user_id (ERR_SOD_HOLD_SELF_RELEASE)"
        side_effects:
          - "released_by_user_id := X-User-ID; released_at := now"
          - "If no ACTIVE LegalHold remains for the asset: asset.hold_status → CLEAR and all MigrationJobs for the asset in HOLD_PAUSED → QUEUED"
          - "BLOCKED DisposalOrders stay BLOCKED (manual resubmit required)"

  - entity: DisposalOrder
    initial_state: DRAFT
    terminal_states: [EXECUTED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /archive/disposal-orders/{id}/submit"
        actor: ArchivistLead
        preconditions:
          - "status == DRAFT (ERR_DISPOSAL_ORDER_NOT_DRAFT)"
        side_effects: []
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /archive/disposal-orders/{id}/approve"
        actor: ArchivistLead
        preconditions:
          - "status == PENDING_APPROVAL (ERR_DISPOSAL_ORDER_NOT_PENDING)"
          - "asset.hold_status == CLEAR (ERR_LEGAL_HOLD_ACTIVE)"
          - "asset.version == pinned_asset_version (ERR_ASSET_VERSION_DRIFT)"
          - "X-User-ID != created_by_user_id (ERR_SOD_DISPOSAL_SELF_APPROVE)"
        side_effects:
          - "approved_by_user_id := X-User-ID"
          - "Asset.catalog_status ARCHIVED → DISPOSAL_SCHEDULED"
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /archive/disposal-orders/{id}/reject"
        actor: ArchivistLead
        preconditions:
          - "status == PENDING_APPROVAL (ERR_DISPOSAL_ORDER_NOT_PENDING)"
        side_effects:
          - "reject_reason := input.reason; Asset unchanged"
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /archive/disposal-orders/{id}/execute"
        actor: ArchivistLead
        preconditions:
          - "status == APPROVED (ERR_DISPOSAL_ORDER_NOT_APPROVED)"
          - "asset.hold_status == CLEAR (ERR_LEGAL_HOLD_ACTIVE)"
          - "asset.version == pinned_asset_version (ERR_ASSET_VERSION_DRIFT)"
          - "now >= scheduled_execution_date (ERR_DISPOSAL_NOT_YET_DUE)"
        side_effects:
          - "Asset.catalog_status DISPOSAL_SCHEDULED → DISPOSED"
          - "Cascade: non-terminal RetrievalRequests → CANCELLED; QUEUED|HOLD_PAUSED MigrationJobs → CANCELLED; QUEUED|ASSIGNED DigitizationTickets → CANCELLED"
      - from: PENDING_APPROVAL
        to: BLOCKED
        trigger: "system (legal hold activated on the asset)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: BLOCKED
        trigger: "system (legal hold activated on the asset)"
        actor: system
        preconditions: []
        side_effects:
          - "Asset.catalog_status DISPOSAL_SCHEDULED → ARCHIVED (this order had scheduled it)"
      - from: BLOCKED
        to: PENDING_APPROVAL
        trigger: "POST /archive/disposal-orders/{id}/resubmit"
        actor: ArchivistLead
        preconditions:
          - "status == BLOCKED (ERR_DISPOSAL_ORDER_NOT_BLOCKED)"
          - "asset.hold_status == CLEAR (ERR_LEGAL_HOLD_ACTIVE)"
        side_effects:
          - "pinned_asset_version := current asset.version (re-pin)"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /archive/disposal-orders/{id}/withdraw"
        actor: ArchivistLead
        preconditions:
          - "status in {DRAFT, APPROVED} (ERR_DISPOSAL_ORDER_NOT_WITHDRAWABLE)"
          - "X-User-ID == created_by_user_id (ERR_INSUFFICIENT_PERMISSIONS)"
        side_effects: []
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /archive/disposal-orders/{id}/withdraw"
        actor: ArchivistLead
        preconditions:
          - "status in {DRAFT, APPROVED} (ERR_DISPOSAL_ORDER_NOT_WITHDRAWABLE)"
          - "X-User-ID == created_by_user_id (ERR_INSUFFICIENT_PERMISSIONS)"
        side_effects:
          - "Asset.catalog_status DISPOSAL_SCHEDULED → ARCHIVED"

  - entity: RetrievalRequest
    initial_state: SUBMITTED
    terminal_states: [DELIVERED, REJECTED, CANCELLED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /archive/retrieval-requests/{id}/start-review"
        actor: AccessOfficer
        preconditions:
          - "status == SUBMITTED (ERR_REQUEST_NOT_SUBMITTED)"
        side_effects: []
      - from: UNDER_REVIEW
        to: STAGED
        trigger: "POST /archive/retrieval-requests/{id}/approve (asset.storage_tier != DEEP_ARCHIVE)"
        actor: AccessOfficer
        preconditions:
          - "status == UNDER_REVIEW (ERR_REQUEST_NOT_UNDER_REVIEW)"
          - "X-User-ID != requester_id (ERR_SOD_RETRIEVAL_SELF_APPROVE)"
          - "asset.hold_status == CLEAR (ERR_ASSET_UNDER_LEGAL_HOLD)"
          - "purpose gate re-checked against current asset.rights_posture (ERR_RIGHTS_EXPIRED_FOR_PURPOSE)"
          - "asset.storage_tier != DEEP_ARCHIVE"
        side_effects:
          - "quoted_fee_cents := delivery_fee_cents(asset, delivery_tier)"
          - "staged_at := now"
      - from: UNDER_REVIEW
        to: RECALLING
        trigger: "POST /archive/retrieval-requests/{id}/approve (asset.storage_tier == DEEP_ARCHIVE)"
        actor: AccessOfficer
        preconditions:
          - "status == UNDER_REVIEW (ERR_REQUEST_NOT_UNDER_REVIEW)"
          - "X-User-ID != requester_id (ERR_SOD_RETRIEVAL_SELF_APPROVE)"
          - "asset.hold_status == CLEAR (ERR_ASSET_UNDER_LEGAL_HOLD)"
          - "purpose gate re-checked against current asset.rights_posture (ERR_RIGHTS_EXPIRED_FOR_PURPOSE)"
          - "asset.storage_tier == DEEP_ARCHIVE"
        side_effects:
          - "quoted_fee_cents := delivery_fee_cents(asset, delivery_tier)"
      - from: UNDER_REVIEW
        to: SUBMITTED
        trigger: "POST /archive/retrieval-requests/{id}/return"
        actor: AccessOfficer
        preconditions:
          - "status == UNDER_REVIEW (ERR_REQUEST_NOT_UNDER_REVIEW)"
        side_effects:
          - "return_count += 1; review_note := input.note"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /archive/retrieval-requests/{id}/reject"
        actor: AccessOfficer
        preconditions:
          - "status == UNDER_REVIEW (ERR_REQUEST_NOT_UNDER_REVIEW)"
        side_effects:
          - "review_note := input.note"
      - from: RECALLING
        to: STAGED
        trigger: "POST /archive/retrieval-requests/{id}/stage-complete"
        actor: LabTechnician
        preconditions:
          - "status == RECALLING (ERR_REQUEST_NOT_RECALLING)"
        side_effects:
          - "staged_at := now"
      - from: RECALLING
        to: STAGED
        trigger: "system (a MigrationJob for this asset COMPLETES with target_tier != DEEP_ARCHIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "staged_at := migration completion time"
      - from: STAGED
        to: DELIVERED
        trigger: "POST /archive/retrieval-requests/{id}/deliver"
        actor: AccessOfficer
        preconditions:
          - "status == STAGED (ERR_REQUEST_NOT_STAGED)"
          - "now <= staged_at + STAGE_HOLD_HOURS (72h) (request already EXPIRED otherwise via clock sweep)"
        side_effects:
          - "delivered_at := now"
      - from: STAGED
        to: EXPIRED
        trigger: "system (clock sweep: now > staged_at + 72h)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /archive/retrieval-requests/{id}/cancel"
        actor: "Requester (own only: X-User-ID == requester_id) or AccessOfficer"
        preconditions:
          - "status in {SUBMITTED, UNDER_REVIEW, RECALLING, STAGED} (ERR_REQUEST_TERMINAL)"
        side_effects: []
      - from: UNDER_REVIEW
        to: CANCELLED
        trigger: "POST /archive/retrieval-requests/{id}/cancel"
        actor: "Requester (own) or AccessOfficer"
        preconditions:
          - "status in {SUBMITTED, UNDER_REVIEW, RECALLING, STAGED} (ERR_REQUEST_TERMINAL)"
        side_effects: []
      - from: RECALLING
        to: CANCELLED
        trigger: "POST /archive/retrieval-requests/{id}/cancel"
        actor: "Requester (own) or AccessOfficer"
        preconditions:
          - "status in {SUBMITTED, UNDER_REVIEW, RECALLING, STAGED} (ERR_REQUEST_TERMINAL)"
        side_effects: []
      - from: STAGED
        to: CANCELLED
        trigger: "POST /archive/retrieval-requests/{id}/cancel"
        actor: "Requester (own) or AccessOfficer"
        preconditions:
          - "status in {SUBMITTED, UNDER_REVIEW, RECALLING, STAGED} (ERR_REQUEST_TERMINAL)"
        side_effects: []

  - entity: UsageEvent
    initial_state: REPORTED
    terminal_states: [ROYALTY_POSTED]
    transitions:
      - from: REPORTED
        to: VERIFIED
        trigger: "POST /archive/usage-events/{id}/verify"
        actor: FinanceOfficer
        preconditions:
          - "status == REPORTED (ERR_EVENT_NOT_REPORTED)"
        side_effects:
          - "provisional_accrual_cents := royalty_event_accrual(provisional variant)"
      - from: REPORTED
        to: DISPUTED
        trigger: "POST /archive/usage-events/{id}/dispute"
        actor: FinanceOfficer
        preconditions:
          - "status in {REPORTED, VERIFIED} (ERR_EVENT_NOT_DISPUTABLE)"
        side_effects:
          - "dispute_reason := input.reason"
      - from: VERIFIED
        to: DISPUTED
        trigger: "POST /archive/usage-events/{id}/dispute"
        actor: FinanceOfficer
        preconditions:
          - "status in {REPORTED, VERIFIED} (ERR_EVENT_NOT_DISPUTABLE)"
        side_effects:
          - "dispute_reason := input.reason; statement post re-validates VERIFIED snapshot (ERR_STATEMENT_EVENTS_DIRTY)"
      - from: DISPUTED
        to: REPORTED
        trigger: "POST /archive/usage-events/{id}/resubmit"
        actor: "Requester (own only: X-User-ID == reported_by_id)"
        preconditions:
          - "status == DISPUTED (ERR_EVENT_NOT_DISPUTED)"
        side_effects:
          - "provisional_accrual_cents := null (must be re-verified)"
      - from: VERIFIED
        to: ROYALTY_POSTED
        trigger: "system (owning RoyaltyStatement transitions CLOSED → POSTED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RoyaltyStatement
    initial_state: OPEN
    terminal_states: [POSTED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /archive/royalty-statements/{id}/close"
        actor: FinanceOfficer
        preconditions:
          - "status == OPEN (ERR_STATEMENT_NOT_OPEN)"
          - ">= 1 UsageEvent with asset.rights_holder == statement.rights_holder AND status == VERIFIED AND period_start <= aired_at < period_end (ERR_STATEMENT_EMPTY)"
        side_effects:
          - "Sweep matched events: compute volume_tier from total_verified_seconds; per-event final_accrual_cents; provisional_total_cents; total_accrual_cents"
          - "event_ids := swept ids; each swept event.statement_id := this statement"
      - from: CLOSED
        to: OPEN
        trigger: "POST /archive/royalty-statements/{id}/reopen"
        actor: FinanceOfficer
        preconditions:
          - "status == CLOSED (ERR_STATEMENT_NOT_CLOSED)"
        side_effects:
          - "event_ids := []; swept events' statement_id := null; totals reset to null"
      - from: CLOSED
        to: POSTED
        trigger: "POST /archive/royalty-statements/{id}/post"
        actor: FinanceOfficer
        preconditions:
          - "status == CLOSED (ERR_STATEMENT_NOT_CLOSED)"
          - "now >= period_end (ERR_PERIOD_NOT_ENDED)"
          - "total_accrual_cents >= MIN_PAYOUT_CENTS (1000) (ERR_PAYOUT_BELOW_MINIMUM)"
          - "Every event in event_ids still has status == VERIFIED (ERR_STATEMENT_EVENTS_DIRTY)"
        side_effects:
          - "Every swept UsageEvent VERIFIED → ROYALTY_POSTED"

  - entity: MigrationJob
    initial_state: QUEUED
    terminal_states: [COMPLETED, CANCELLED, SUPERSEDED]
    transitions:
      - from: QUEUED
        to: IN_PROGRESS
        trigger: "POST /archive/migration-jobs/{id}/start"
        actor: LabTechnician
        preconditions:
          - "status == QUEUED (ERR_JOB_NOT_QUEUED)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /archive/migration-jobs/{id}/complete"
        actor: LabTechnician
        preconditions:
          - "status == IN_PROGRESS (ERR_JOB_NOT_IN_PROGRESS)"
        side_effects:
          - "Asset.storage_tier := target_tier; Asset.version += 1 (tier residency change for storage_cost_cents)"
          - "If target_tier != DEEP_ARCHIVE: RetrievalRequests for this asset in RECALLING → STAGED (staged_at := now)"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /archive/migration-jobs/{id}/fail"
        actor: LabTechnician
        preconditions:
          - "status == IN_PROGRESS (ERR_JOB_NOT_IN_PROGRESS)"
        side_effects:
          - "failure_reason := input.reason"
      - from: FAILED
        to: QUEUED
        trigger: "POST /archive/migration-jobs/{id}/retry"
        actor: LabTechnician
        preconditions:
          - "status == FAILED (ERR_JOB_NOT_FAILED)"
          - "retry_count < MAX_MIGRATION_RETRIES (2) (ERR_RETRY_BUDGET_EXHAUSTED)"
        side_effects:
          - "retry_count += 1"
      - from: QUEUED
        to: HOLD_PAUSED
        trigger: "system (legal hold activated on the asset)"
        actor: system
        preconditions: []
        side_effects: []
      - from: HOLD_PAUSED
        to: QUEUED
        trigger: "system (last ACTIVE legal hold on the asset released)"
        actor: system
        preconditions: []
        side_effects: []
      - from: QUEUED
        to: SUPERSEDED
        trigger: "system (a new MigrationJob is created for the same asset with a fresh expected_asset_version)"
        actor: system
        preconditions: []
        side_effects: []
      - from: QUEUED
        to: CANCELLED
        trigger: "POST /archive/migration-jobs/{id}/cancel (or system on asset disposal)"
        actor: ArchivistLead
        preconditions:
          - "status in {QUEUED, HOLD_PAUSED} (ERR_JOB_NOT_CANCELLABLE)"
        side_effects: []
      - from: HOLD_PAUSED
        to: CANCELLED
        trigger: "POST /archive/migration-jobs/{id}/cancel (or system on asset disposal)"
        actor: ArchivistLead
        preconditions:
          - "status in {QUEUED, HOLD_PAUSED} (ERR_JOB_NOT_CANCELLABLE)"
        side_effects: []

  - entity: DigitizationTicket
    initial_state: QUEUED
    terminal_states: [COMPLETED, QC_FAILED, CANCELLED]
    transitions:
      - from: QUEUED
        to: ASSIGNED
        trigger: "POST /archive/digitization-tickets/{id}/assign OR POST /archive/digitization-tickets/auto-assign"
        actor: LabTechnician
        preconditions:
          - "status == QUEUED (ERR_TICKET_NOT_QUEUED)"
          - "workstation.status == ACTIVE (ERR_WORKSTATION_UNAVAILABLE)"
          - "asset.format_class ∈ workstation.supported_formats (ERR_WORKSTATION_FORMAT_UNSUPPORTED)"
          - "No schedule conflict on workstation: for every ASSIGNED|DIGITIZING ticket t on it, new_end + 30min <= t.scheduled_start OR new_start >= t.scheduled_end + 30min (ERR_WORKSTATION_SCHEDULE_CONFLICT)"
        side_effects:
          - "workstation_id := chosen workstation (auto-assign also sets scheduled_start := now, scheduled_end := now + 4h)"
      - from: ASSIGNED
        to: DIGITIZING
        trigger: "POST /archive/digitization-tickets/{id}/start"
        actor: LabTechnician
        preconditions:
          - "status == ASSIGNED (ERR_TICKET_NOT_ASSIGNED)"
          - "now >= scheduled_start (ERR_TICKET_NOT_DUE)"
        side_effects: []
      - from: DIGITIZING
        to: QC_REVIEW
        trigger: "POST /archive/digitization-tickets/{id}/submit-qc"
        actor: LabTechnician
        preconditions:
          - "status == DIGITIZING (ERR_TICKET_NOT_DIGITIZING)"
        side_effects: []
      - from: QC_REVIEW
        to: COMPLETED
        trigger: "POST /archive/digitization-tickets/{id}/qc-pass"
        actor: LabTechnician
        preconditions:
          - "status == QC_REVIEW (ERR_TICKET_NOT_IN_QC)"
        side_effects:
          - "Creates derivative Asset: source_asset_id := original id, format_class := output_format, ingest_batch_id := original's batch (system exception: allowed even though batch is FINALIZED), catalog_status METADATA_DRAFT, storage_tier ONLINE"
      - from: QC_REVIEW
        to: QUEUED
        trigger: "POST /archive/digitization-tickets/{id}/qc-fail (rework_count < MAX_QC_REWORKS = 2)"
        actor: LabTechnician
        preconditions:
          - "status == QC_REVIEW (ERR_TICKET_NOT_IN_QC)"
          - "rework_count < 2"
        side_effects:
          - "rework_count += 1; workstation_id := null (slot freed)"
      - from: QC_REVIEW
        to: QC_FAILED
        trigger: "POST /archive/digitization-tickets/{id}/qc-fail (rework_count == MAX_QC_REWORKS = 2)"
        actor: LabTechnician
        preconditions:
          - "status == QC_REVIEW (ERR_TICKET_NOT_IN_QC)"
          - "rework_count == 2"
        side_effects:
          - "workstation_id := null"
      - from: QUEUED
        to: CANCELLED
        trigger: "POST /archive/digitization-tickets/{id}/cancel (or system on asset disposal)"
        actor: ArchivistLead
        preconditions:
          - "status in {QUEUED, ASSIGNED} (ERR_TICKET_NOT_CANCELLABLE)"
        side_effects: []
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /archive/digitization-tickets/{id}/cancel (or system on asset disposal)"
        actor: ArchivistLead
        preconditions:
          - "status in {QUEUED, ASSIGNED} (ERR_TICKET_NOT_CANCELLABLE)"
        side_effects: []

  - entity: Workstation
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: MAINTENANCE
        trigger: "PATCH /archive/workstations/{id}"
        actor: SystemAdmin
        preconditions:
          - "No DigitizationTicket on this workstation in ASSIGNED or DIGITIZING (ERR_WORKSTATION_BUSY)"
        side_effects: []
      - from: MAINTENANCE
        to: ACTIVE
        trigger: "PATCH /archive/workstations/{id}"
        actor: SystemAdmin
        preconditions: []
        side_effects: []

# =============================================================================
# Concurrency Rules (OCC — see §1.2.1 filter; both pass serial-observability)
# =============================================================================
concurrency_rules:
  - rule_id: disposal-order-create-stale-asset
    parent_entity: Asset
    write_endpoint: "POST /archive/disposal-orders"
    occ_field: "expected_asset_version"
    description: |
      Creating a DisposalOrder against an Asset whose version has advanced
      since the client last observed it is rejected. A disposal order created
      from a stale read (e.g., the client read version 5, another writer then
      PATCHed the asset title advancing it to 6) would otherwise legitimately
      succeed because no state field changed; the stale-version check is the
      only rejection basis.
    error_id: ERR_STALE_ASSET_VERSION
    http_status: 412

  - rule_id: migration-job-create-stale-asset
    parent_entity: Asset
    write_endpoint: "POST /archive/migration-jobs"
    occ_field: "expected_asset_version"
    description: |
      Creating a MigrationJob against an Asset whose version has advanced
      since the client last observed it is rejected. Creating a migration job
      legitimately supersedes an existing QUEUED job under the supersede rule,
      so a second sequential create sees no blocking state; the stale-version
      check is the only rejection basis.
    error_id: ERR_STALE_ASSET_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: rights_posture_derivation
    trigger: "On every read of an Asset (GET) and at every validation that references rights_posture; evaluated against the logical clock"
    algorithm: aggregation
    formula: |
      effective_grants = [g in RightsGrant where g.asset_id == asset.id
                          AND g.status == ACTIVE
                          AND g.window_start <= now < g.window_end]
      if effective_grants is empty: rights_posture = EXPIRED
      elif any g in effective_grants has restriction_flags == []: rights_posture = CLEARED
      else: rights_posture = RESTRICTED
      Precedence pin: CLEARED beats RESTRICTED whenever at least one
      unrestricted effective grant exists. Expiration is end-EXCLUSIVE:
      a grant whose window_end == now is NOT effective.
    input_set: "All RightsGrants of the asset (REVOKED excluded from effective set)"
    constants:
      WINDOW_END_EXCLUSIVE: true
    precision: "n/a (enum derivation)"

  - name: hold_status_derivation
    trigger: "On read of an Asset and at every validation that references hold_status; recomputed by LegalHold create/release"
    algorithm: aggregation
    formula: |
      if exists LegalHold h where h.asset_id == asset.id AND h.status == ACTIVE:
        hold_status = HELD
      else:
        hold_status = CLEAR
    input_set: "LegalHolds of the asset with status ACTIVE"
    precision: "n/a (enum derivation)"

  - name: royalty_event_accrual
    trigger: "UsageEvent verify (provisional variant); RoyaltyStatement close (final variant)"
    algorithm: tiered_pricing
    formula: |
      units = ceil(duration_seconds_used / 30)            # billable 30-second units
      base  = MARKET_RATE[market_tier(market_size)]        # tiered rate per unit
      mult  = USAGE_MULTIPLIER[usage_type]
      raw   = units * base * mult
      provisional_accrual_cents = max(MIN_PER_EVENT_CENTS, round_half_up(raw))
      # final variant (at close):
      discount = VOLUME_DISCOUNT[statement.volume_tier]
      final_accrual_cents = max(MIN_PER_EVENT_CENTS, round_half_up(raw * (1 - discount)))
    input_set: "The single UsageEvent being verified (provisional) or each swept event at close (final)"
    constants:
      MARKET_RATE: {SMALL: 100, MEDIUM: 250, LARGE: 500}   # cents per 30s unit
      MARKET_TIER_SMALL_MAX: 1000000        # market_size < 1,000,000 -> SMALL
      MARKET_TIER_MEDIUM_MAX: 5000000       # 1,000,000 <= market_size < 5,000,000 -> MEDIUM; >= 5,000,000 -> LARGE
      USAGE_MULTIPLIER: {BROADCAST: 1.0, REBROADCAST: 0.5, STREAMING: 0.75, PROMO: 0.25}
      MIN_PER_EVENT_CENTS: 25
    precision: "integer cents; round_half_up applied per event AFTER multiplier (and per event after discount in the final variant) — never round a summed total"
    variants:
      - name: provisional
        when: "Computed at POST /archive/usage-events/{id}/verify; stored as provisional_accrual_cents"
        difference: "No volume discount; uses only event-local inputs"
      - name: final
        when: "Computed at POST /archive/royalty-statements/{id}/close; stored as final_accrual_cents"
        difference: "Applies volume discount keyed on the statement's total_verified_seconds — identical event data yields a lower accrual whenever volume_tier != TIER_0"

  - name: royalty_statement_totals
    trigger: "RoyaltyStatement close"
    algorithm: waterfall_allocation
    formula: |
      # Circular-looking dependency pinned to an explicit evaluation order:
      # the volume tier depends on total seconds, while the total accrual
      # depends on the tier's discount. Evaluation order is fixed:
      #   1. swept = VERIFIED UsageEvents with asset.rights_holder == rights_holder
      #      AND period_start <= aired_at < period_end  (half-open)
      #   2. total_verified_seconds = sum(duration_seconds_used over swept)
      #   3. volume_tier = TIER_0 if total < 3600; TIER_1 if 3600 <= total < 36000;
      #      TIER_2 if total >= 36000
      #   4. per-event final_accrual_cents via royalty_event_accrual(final)
      #   5. total_accrual_cents = sum(final_accrual_cents)
      #   6. provisional_total_cents = sum(provisional_accrual_cents) over the SAME set
      # Step 2 must fully complete before step 3; recomputation is forbidden.
    input_set: "UsageEvents status VERIFIED, asset.rights_holder == statement.rights_holder, aired_at in [period_start, period_end)"
    constants:
      TIER_1_THRESHOLD_SECONDS: 3600      # >= 3600 -> TIER_1
      TIER_2_THRESHOLD_SECONDS: 36000     # >= 36000 -> TIER_2
      VOLUME_DISCOUNT: {TIER_0: 0.0, TIER_1: 0.10, TIER_2: 0.20}
    precision: "integer cents; per-event round_half_up then sum"
    variants:
      - name: provisional_view
        when: "provisional_total_cents — same swept set, no discount"
        difference: "Always >= total_accrual_cents; strictly greater iff volume_tier != TIER_0 and at least one event sits above the per-event floor"

  - name: storage_cost_cents
    trigger: "GET /archive/assets/{id}/storage-cost (returns BOTH variants)"
    algorithm: forward_looking
    formula: |
      # PROJECTED variant (forward-looking): cost of keeping the asset at its
      # CURRENT tier for the REST of the current calendar month (UTC):
      #   days_remaining = days_in_month - day_of_month(now) + 1   # today inclusive
      #   projected = round_half_up(size_gb * TIER_RATE[storage_tier] * days_remaining)
      # ACTUAL variant (chronological): replay COMPLETED MigrationJobs of the
      # asset in created_at order to build tier-residency intervals inside the
      # current calendar month [month_start, now); the asset's creation time
      # (or month_start if created earlier) opens the first interval at the
      # tier the asset held then (ONLINE unless migrated):
      #   for each interval: hours = (end - start) / 3600
      #     interval_cost = round_half_up(size_gb * TIER_RATE[tier] * hours / 24)
      #   actual = sum(interval_cost)   # per-interval rounding, THEN sum
      # The two variants diverge whenever a migration changed tier mid-month.
    input_set: "Asset + its COMPLETED MigrationJobs (created_at order, tie-break: created_at ASC); intervals intersected with [month_start, now)"
    constants:
      TIER_RATE: {ONLINE: 4, NEARLINE: 1.5, DEEP_ARCHIVE: 0.25}   # cents per GB per day
    precision: "cents; round_half_up per interval (ACTUAL) or once (PROJECTED)"
    variants:
      - name: projected
        when: "Forward-looking rest-of-month estimate at current tier"
        difference: "Ignores migration history; uses only current tier"
      - name: actual
        when: "Chronological month-to-date cost from tier residency"
        difference: "Replays COMPLETED migrations; per-interval rounding then sum (order pinned: round each interval BEFORE summing)"

  - name: delivery_fee_cents
    trigger: "RetrievalRequest approve (UNDER_REVIEW → STAGED|RECALLING)"
    algorithm: tiered_pricing
    formula: |
      fee = (TIER_BASE[asset.storage_tier] + ceil(size_gb) * PER_GB_CENTS)
      if delivery_tier == EXPEDITE: fee = fee * EXPEDITE_MULTIPLIER
      quoted_fee_cents = fee
    input_set: "The RetrievalRequest + its Asset (tier and size at approve time)"
    constants:
      TIER_BASE: {ONLINE: 0, NEARLINE: 500, DEEP_ARCHIVE: 1500}
      PER_GB_CENTS: 10
      EXPEDITE_MULTIPLIER: 2
    precision: "integer cents; no rounding needed after ceil(size_gb)"

  - name: preservation_priority_score
    trigger: "On read of a DigitizationTicket and inside auto-assign ranking"
    algorithm: weighted_scoring
    formula: |
      age_days  = floor((now - asset.created_at) / 86400)
      age_years = floor(age_days / 365)
      delivered_365d = count(RetrievalRequest r where r.asset_id == asset.id
                             AND r.status == DELIVERED
                             AND now - 365*86400s < r.delivered_at <= now)
      priority_score = DECAY_RISK[asset.format_class] * age_years + delivered_365d * 10
    input_set: "Ticket's asset + the asset's DELIVERED RetrievalRequests in the trailing 365-day window (end-inclusive, start-exclusive)"
    constants:
      DECAY_RISK: {BETACAM_SP: 90, UMATIC: 85, VHS: 70, FILM_16MM: 95, AUDIO_REEL: 80, AUDIO_DAT: 75, DIGITAL_FILE: 10, PRORES_FILE: 5}
      DEMAND_WEIGHT: 10
    precision: "integer arithmetic only (floor day/year truncation)"

  - name: retention_eligibility
    trigger: "DisposalOrder create"
    algorithm: threshold
    formula: |
      years = RetentionPolicy.min_retention_years for asset.media_type,
              else DEFAULT_RETENTION_YEARS when no policy row exists
      eligible_at = asset.created_at + years * 365 * 86400 seconds
      eligible iff now >= eligible_at   # >= boundary: exactly at eligible_at is allowed
      if not eligible AND retention_override != true: ERR_RETENTION_NOT_ELAPSED
    input_set: "Asset + RetentionPolicy matching asset.media_type"
    constants:
      DEFAULT_RETENTION_YEARS: 7
    precision: "second precision on the logical clock"

  - name: exclusive_grant_overlap
    trigger: "RightsGrant create when exclusive == true"
    algorithm: interval_merge
    formula: |
      # Half-open interval semantics: [window_start, window_end)
      # Adjacency is ALLOWED: new.window_start == existing.window_end is no conflict.
      conflict iff exists ACTIVE RightsGrant g with same (asset_id, grant_type, territory)
                 AND new.window_start < g.window_end AND g.window_start < new.window_end
    input_set: "ACTIVE RightsGrants of the asset with identical grant_type and territory and exclusive == true"
    precision: "second precision"

  - name: workstation_schedule_conflict
    trigger: "DigitizationTicket assign / auto-assign"
    algorithm: interval_merge
    formula: |
      # BUFFER semantics (differs from exclusive_grant_overlap): a turnaround
      # buffer of TURNAROUND_MINUTES must be left on BOTH sides of every
      # occupied slot. Adjacency (gap == 0) is a CONFLICT; gap == 30min exactly
      # is ALLOWED (>= boundary).
      conflict iff exists ticket t on workstation with t.status in {ASSIGNED, DIGITIZING}
                 AND NOT (new_end + 30min <= t.scheduled_start
                          OR new_start >= t.scheduled_end + 30min)
    input_set: "DigitizationTickets on the workstation in ASSIGNED or DIGITIZING"
    constants:
      TURNAROUND_MINUTES: 30
    precision: "minute precision"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for this operation per RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path ids and body FK references exist (path validated left-to-right, then body references)"
    error_id: "ERR_<RESOURCE>_NOT_FOUND — one of ERR_STAFF_MEMBER_NOT_FOUND, ERR_BATCH_NOT_FOUND, ERR_ASSET_NOT_FOUND, ERR_PROXY_NOT_FOUND, ERR_GRANT_NOT_FOUND, ERR_HOLD_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_RETRIEVAL_REQUEST_NOT_FOUND, ERR_EVENT_NOT_FOUND, ERR_STATEMENT_NOT_FOUND, ERR_JOB_NOT_FOUND, ERR_TICKET_NOT_FOUND, ERR_WORKSTATION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with resource ids"
  - priority: 4
    category: state
    check: "Target resource state preconditions for the transition (per state machine)"
    error_id: "state-specific (ERR_INVALID_CATALOG_TRANSITION, ERR_DISPOSAL_ORDER_NOT_PENDING, ERR_ASSET_NOT_RETRIEVABLE, ERR_ASSET_DISPOSED, ERR_ASSET_NOT_ARCHIVED, ERR_ASSET_LOCKED, ERR_REQUEST_*, ERR_EVENT_*, ERR_STATEMENT_NOT_OPEN/CLOSED, ERR_JOB_*, ERR_TICKET_*, ERR_BATCH_*, ERR_PROXY_*, ERR_GRANT_ALREADY_REVOKED, ERR_HOLD_ALREADY_RELEASED, ERR_RETRY_BUDGET_EXHAUSTED, ERR_WORKSTATION_BUSY, ERR_ACTIVE_DISPOSAL_ORDER_EXISTS, ERR_JOB_IN_PROGRESS_EXISTS, ...)"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: state
    check: "OCC: expected_asset_version == asset.version on POST /archive/disposal-orders and POST /archive/migration-jobs"
    error_id: ERR_STALE_ASSET_VERSION
    http_status: 412
    applies_to: "POST /archive/disposal-orders, POST /archive/migration-jobs"
  - priority: 6
    category: business_safety
    check: "Legal-hold gates: asset.hold_status == CLEAR required for disposal approve/execute/resubmit, migration-job create, retrieval create/approve; segregation-of-duties: metadata-approve / disposal-approve / retrieval-approve / hold-release actor must differ from the originating user id"
    error_id: "ERR_LEGAL_HOLD_ACTIVE | ERR_ASSET_UNDER_LEGAL_HOLD | ERR_SOD_*"
    http_status: 409
    applies_to: "disposal-orders approve|execute|resubmit, migration-jobs create, retrieval-requests create|approve, assets metadata-approve, legal-holds release"
  - priority: 7
    category: business_temporal
    check: "Temporal rules: rights window well-formed (start < end, end > now), exclusive-grant overlap, delivery deadline future / within rights window, ticket start due, disposal due date, statement period ended, workstation buffer overlap, statement period overlap"
    error_id: "ERR_RIGHTS_WINDOW_PAST | ERR_EXCLUSIVE_GRANT_OVERLAP | ERR_DELIVERY_DEADLINE_PAST | ERR_DELIVERY_BEYOND_RIGHTS_WINDOW | ERR_RIGHTS_EXPIRED_FOR_PURPOSE | ERR_TICKET_NOT_DUE | ERR_DISPOSAL_NOT_YET_DUE | ERR_STATEMENT_PERIOD_OVERLAP | ERR_WORKSTATION_SCHEDULE_CONFLICT (malformed windows fall under ERR_INVALID_REQUEST at 400)"
    http_status: 422
    applies_to: "rights-grants create, retrieval-requests create, digitization-tickets assign/auto-assign, disposal-orders execute, royalty-statements create|post"
  - priority: 8
    category: business_referential
    check: "Constraint rules: metadata completeness, format obsolescence, workstation format support, one non-terminal DisposalOrder per asset, at most one IN_PROGRESS MigrationJob per asset, unique RetentionPolicy per media_type, unique Workstation name, unique StaffMember email, retention elapsed (or override)"
    error_id: "ERR_METADATA_INCOMPLETE | ERR_FORMAT_NOT_OBSOLETE | ERR_WORKSTATION_FORMAT_UNSUPPORTED | ERR_ACTIVE_DISPOSAL_ORDER_EXISTS | ERR_JOB_IN_PROGRESS_EXISTS | ERR_DUPLICATE_MEDIA_TYPE_POLICY | ERR_DUPLICATE_WORKSTATION_NAME | ERR_DUPLICATE_STAFF_EMAIL | ERR_RETENTION_NOT_ELAPSED | ERR_NO_ELIGIBLE_TICKET (auto-assign empty-pool fallback, 409)"
    http_status: 422
    applies_to: "assets submit-metadata, digitization-tickets create|assign|auto-assign, disposal-orders create, migration-jobs create, retention-policies create, workstations create, staff-members create"
  - priority: 9
    category: business_fiscal
    check: "Fiscal gates: statement total >= MIN_PAYOUT_CENTS at post"
    error_id: ERR_PAYOUT_BELOW_MINIMUM
    http_status: 402
    applies_to: "royalty-statements post"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/archive/_clock/set_current_utc"
    description: "Set the logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z; the clock NEVER falls back to wall-clock. Setting the clock triggers the time-based sweep: STAGED RetrievalRequests whose staged_at + 72h < now become EXPIRED."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Time-based sweep: STAGED RetrievalRequest past 72h → EXPIRED"]

  # --- StaffMember ---
  - method: POST
    path: "/archive/staff-members"
    description: "Register a staff member (Requester identity)"
    roles: [SystemAdmin]
    code: 201
    input: [email, full_name, department, "active?"]
    output: StaffMember
    side_effects: []
  - method: GET
    path: "/archive/staff-members"
    description: "List staff members"
    roles: [SystemAdmin, IngestCoordinator, MetadataCataloger, MetadataLibrarian, ArchivistLead, RightsManager, LegalCounsel, AccessOfficer, Requester, FinanceOfficer, LabTechnician]
    code: 200
    input: ["email?", "limit?", "offset?"]
    output: "StaffMember[]"
    side_effects: []
  - method: GET
    path: "/archive/staff-members/{id}"
    description: "Get a staff member"
    roles: [SystemAdmin, IngestCoordinator, MetadataCataloger, MetadataLibrarian, ArchivistLead, RightsManager, LegalCounsel, AccessOfficer, Requester, FinanceOfficer, LabTechnician]
    code: 200
    input: []
    output: StaffMember
    side_effects: []

  # --- IngestBatch ---
  - method: POST
    path: "/archive/ingest-batches"
    description: "Create an ingest batch (status OPEN)"
    roles: [IngestCoordinator]
    code: 201
    input: [batch_name, source_department]
    output: IngestBatch
    side_effects: ["status = OPEN, asset_count = 0"]
  - method: GET
    path: "/archive/ingest-batches"
    description: "List ingest batches"
    roles: [SystemAdmin, IngestCoordinator, MetadataCataloger, MetadataLibrarian, ArchivistLead, RightsManager, LegalCounsel, AccessOfficer, Requester, FinanceOfficer, LabTechnician]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "IngestBatch[]"
    side_effects: []
  - method: GET
    path: "/archive/ingest-batches/{id}"
    description: "Get an ingest batch"
    roles: [SystemAdmin, IngestCoordinator, MetadataCataloger, MetadataLibrarian, ArchivistLead, RightsManager, LegalCounsel, AccessOfficer, Requester, FinanceOfficer, LabTechnician]
    code: 200
    input: []
    output: IngestBatch
    side_effects: []
  - method: POST
    path: "/archive/ingest-batches/{id}/finalize"
    description: "Finalize batch: requires >= 1 asset and no asset still METADATA_DRAFT"
    roles: [IngestCoordinator]
    code: 200
    input: []
    output: IngestBatch
    side_effects: ["status → FINALIZED"]

  # --- Asset ---
  - method: POST
    path: "/archive/assets"
    description: "Ingest an asset into an OPEN batch; catalog_status METADATA_DRAFT, storage_tier ONLINE"
    roles: [IngestCoordinator]
    code: 201
    input: [ingest_batch_id, title, description, media_type, format_class, duration_seconds, size_gb, rights_holder, "keywords?", "content_rating?", "source_asset_id?"]
    output: Asset
    side_effects: ["catalog_status = METADATA_DRAFT", "storage_tier = ONLINE", "batch.asset_count += 1"]
  - method: GET
    path: "/archive/assets"
    description: "List assets with filters"
    roles: [SystemAdmin, IngestCoordinator, MetadataCataloger, MetadataLibrarian, ArchivistLead, RightsManager, LegalCounsel, AccessOfficer, Requester, FinanceOfficer, LabTechnician]
    code: 200
    input: ["ingest_batch_id?", "source_asset_id?", "catalog_status?", "storage_tier?", "format_class?", "limit?", "offset?"]
    output: "Asset[]"
    side_effects: []
  - method: GET
    path: "/archive/assets/{id}"
    description: "Get an asset (rights_posture / hold_status computed at read time)"
    roles: [SystemAdmin, IngestCoordinator, MetadataCataloger, MetadataLibrarian, ArchivistLead, RightsManager, LegalCounsel, AccessOfficer, Requester, FinanceOfficer, LabTechnician]
    code: 200
    input: []
    output: Asset
    side_effects: []
  - method: PATCH
    path: "/archive/assets/{id}"
    description: "Edit descriptive metadata; allowed only in METADATA_DRAFT or IN_REVIEW (else ERR_ASSET_LOCKED); bumps version"
    roles: [MetadataCataloger]
    code: 200
    input: ["title?", "description?", "keywords?", "content_rating?", "rights_holder?"]
    output: Asset
    side_effects: ["increments Asset.version by 1"]
  - method: POST
    path: "/archive/assets/{id}/submit-metadata"
    description: "Submit metadata for review (METADATA_DRAFT → IN_REVIEW)"
    roles: [MetadataCataloger]
    code: 200
    input: []
    output: Asset
    side_effects: ["metadata_submitted_by_user_id := X-User-ID"]
  - method: POST
    path: "/archive/assets/{id}/metadata-approve"
    description: "Approve metadata (IN_REVIEW → CATALOGED); approver must differ from submitter"
    roles: [MetadataLibrarian]
    code: 200
    input: []
    output: Asset
    side_effects: []
  - method: POST
    path: "/archive/assets/{id}/metadata-reject"
    description: "Reject metadata (IN_REVIEW → METADATA_DRAFT rework loop)"
    roles: [MetadataLibrarian]
    code: 200
    input: [reason]
    output: Asset
    side_effects: ["metadata_submitted_by_user_id := null"]
  - method: POST
    path: "/archive/assets/{id}/archive"
    description: "Archive a CATALOGED asset; requires a READY proxy and a rights grant on record"
    roles: [ArchivistLead]
    code: 200
    input: []
    output: Asset
    side_effects: ["catalog_status → ARCHIVED"]
  - method: POST
    path: "/archive/assets/{id}/recatalog"
    description: "Reopen an ARCHIVED asset for metadata rework (ARCHIVED → IN_REVIEW)"
    roles: [ArchivistLead]
    code: 200
    input: []
    output: Asset
    side_effects: ["catalog_status → IN_REVIEW; metadata_submitted_by_user_id := null"]
  - method: GET
    path: "/archive/assets/{id}/storage-cost"
    description: "Computed read: both storage_cost_cents variants for the current calendar month"
    roles: [SystemAdmin, ArchivistLead, FinanceOfficer]
    code: 200
    input: []
    output: "{ projected_cost_cents: integer, actual_cost_cents: integer, currency: string }"
    side_effects: []

  # --- ProxyRendition ---
  - method: POST
    path: "/archive/proxy-renditions"
    description: "Queue proxy generation for an asset"
    roles: [IngestCoordinator, LabTechnician]
    code: 201
    input: [asset_id, "rendition_type?"]
    output: ProxyRendition
    side_effects: ["status = QUEUED, retry_count = 0"]
  - method: GET
    path: "/archive/proxy-renditions/{id}"
    description: "Get a proxy rendition"
    roles: [SystemAdmin, IngestCoordinator, MetadataCataloger, MetadataLibrarian, ArchivistLead, RightsManager, LegalCounsel, AccessOfficer, Requester, FinanceOfficer, LabTechnician]
    code: 200
    input: []
    output: ProxyRendition
    side_effects: []

  - method: GET
    path: "/archive/proxy-renditions"
    description: "List proxy renditions"
    roles: [SystemAdmin, IngestCoordinator, MetadataCataloger, MetadataLibrarian, ArchivistLead, RightsManager, LegalCounsel, AccessOfficer, Requester, FinanceOfficer, LabTechnician]
    code: 200
    input: ["asset_id?", "status?", "limit?", "offset?"]
    output: "ProxyRendition[]"
    side_effects: []
  - method: POST
    path: "/archive/proxy-renditions/{id}/claim"
    description: "Claim a queued rendition (QUEUED → RENDERING)"
    roles: [LabTechnician]
    code: 200
    input: []
    output: ProxyRendition
    side_effects: []
  - method: POST
    path: "/archive/proxy-renditions/{id}/complete"
    description: "Mark rendering complete (RENDERING → READY); sets proxy_url and indexed_at"
    roles: [LabTechnician]
    code: 200
    input: []
    output: ProxyRendition
    side_effects: ["proxy_url set; indexed_at := now"]
  - method: POST
    path: "/archive/proxy-renditions/{id}/fail"
    description: "Mark rendering failed (RENDERING → FAILED)"
    roles: [LabTechnician]
    code: 200
    input: [reason]
    output: ProxyRendition
    side_effects: ["failure_reason := reason"]
  - method: POST
    path: "/archive/proxy-renditions/{id}/retry"
    description: "Retry a FAILED rendition (FAILED → QUEUED); cap MAX_PROXY_RETRIES = 3"
    roles: [LabTechnician]
    code: 200
    input: []
    output: ProxyRendition
    side_effects: ["retry_count += 1"]

  # --- RightsGrant ---
  - method: POST
    path: "/archive/rights-grants"
    description: "Create a rights grant; exclusive grants enforce half-open window non-overlap per (asset, grant_type, territory)"
    roles: [RightsManager]
    code: 201
    input: [asset_id, grant_type, territory, window_start, window_end, "exclusive?", "restriction_flags?"]
    output: RightsGrant
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/archive/rights-grants/{id}"
    description: "Get a rights grant"
    roles: [SystemAdmin, IngestCoordinator, MetadataCataloger, MetadataLibrarian, ArchivistLead, RightsManager, LegalCounsel, AccessOfficer, Requester, FinanceOfficer, LabTechnician]
