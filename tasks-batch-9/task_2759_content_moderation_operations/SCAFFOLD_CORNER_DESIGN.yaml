# §1.9 Scaffold Corner Design — breadth coverage of every testable claim in
# SCAFFOLD.yaml §1.1-§1.7 that SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) does not
# already assert. Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md; no categories are invented.
scaffold_corner_design:
  - section: entities
    instances:
      - name: content_item_creation_returns_all_declared_fields
        claim_type: creation
        grounds:
          - entities.ContentItem
          - endpoints.POST_/moderation/content-items
        distinguishing_aspect: "A create with every required field returns 201 and every §1.1 field of ContentItem, with system and computed fields populated by the server."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T09:00:00Z."
            - "One STANDARD account exists."
          setup_api_calls:
            - call: "POST /moderation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "POST /moderation/accounts"
              payload: { external_handle: "acct_c1", region_code: "US", tier: "STANDARD" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /moderation/content-items"
              payload: { account_id: "${acct_id}", language: "EN", media_kind: "VIDEO", graphic_weight: 4 }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { ci_id: $.data.id }
          assert:
            - "HTTP 201 with response_type object"
            - "data.account_id == ${acct_id}, language == EN, media_kind == VIDEO, graphic_weight == 4"
            - "data.visibility_status == LIVE, review_status == CLEAR, open_case_count == 0, reinstated_at == null"
            - "data.posted_at == 2026-08-01T09:00:00Z and data.version == 1"
            - "data.id is a UUID with no type prefix, and created_at == updated_at == 2026-08-01T09:00:00Z"
      - name: policy_category_retrieval_returns_stored_row
        claim_type: retrieval
        grounds:
          - entities.PolicyCategory
          - endpoints.GET_/moderation/policy-categories/{id}
        distinguishing_aspect: "GET by id returns the same row the create returned, including the DRAFT status and the still-null active_version_id."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T09:00:00Z."
            - "A T3/HATE category with code HATE_SPEECH has been created and no version has been activated for it."
          setup_api_calls:
            - call: "POST /moderation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "POST /moderation/policy-categories"
              payload: { code: "HATE_SPEECH", name: "Hate Speech", severity_tier: "T3", specialty: "HATE" }
              as: PolicyManager
              as_user_id: "pm-alice"
              captures: { cat_id: $.data.id }
          trigger:
            - call: "GET /moderation/policy-categories/${cat_id}"
              payload: {}
              as: QAAuditor
              as_user_id: "qa-1"
          assert:
            - "HTTP 200 with data.id == ${cat_id}, code == HATE_SPEECH, name == Hate Speech, severity_tier == T3, specialty == HATE"
            - "data.status == DRAFT, active_version_id == null, parent_category_id == null, version == 1"
      - name: reviewer_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/moderation/reviewers
          - response_envelope.pagination_fields
        distinguishing_aspect: "A three-row collection read with limit 2 returns two rows plus total_count 3 and has_more true; the second page returns the remaining row with has_more false."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T09:00:00Z."
            - "Exactly three reviewers exist, created in the order Rita, Quinn, Sven."
          setup_api_calls:
            - call: "POST /moderation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "POST /moderation/reviewers"
              payload: { display_name: "Rita", languages: ["EN"], specialties: ["VIOLENCE"], utc_offset_minutes: 0, shift_start_local_hour: 8, shift_end_local_hour: 20, role_class: "FRONTLINE" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { r1_id: $.data.id }
            - call: "POST /moderation/reviewers"
              payload: { display_name: "Quinn", languages: ["EN"], specialties: ["VIOLENCE"], utc_offset_minutes: 0, shift_start_local_hour: 8, shift_end_local_hour: 20, role_class: "QA" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { qa_id: $.data.id }
            - call: "POST /moderation/reviewers"
              payload: { display_name: "Sven", languages: ["EN"], specialties: ["VIOLENCE"], utc_offset_minutes: 0, shift_start_local_hour: 8, shift_end_local_hour: 20, role_class: "SENIOR" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { r2_id: $.data.id }
          trigger:
            - call: "GET /moderation/reviewers"
              payload: { limit: 2, offset: 0 }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "GET /moderation/reviewers"
              payload: { limit: 2, offset: 2 }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
          assert:
            - "page 1 — HTTP 200, response_type array, limit 2, offset 0, total_count 3, has_more true, data length 2"
            - "page 1 rows are ${r1_id} then ${qa_id} in created_at ASC order"
            - "page 2 — limit 2, offset 2, total_count 3, has_more false, data length 1 containing ${r2_id}"
            - "GET /moderation/reviewers?role_class=QA returns total_count 1 with only ${qa_id}"
      - name: moderation_case_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=10]
          - errors.ERR_CASE_NOT_FOUND
        distinguishing_aspect: "A well-formed but unknown UUID on a path-parameterised read returns the entity-specific 404, not a generic 400 or an empty 200."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T09:00:00Z; no moderation case exists."
          setup_api_calls:
            - call: "POST /moderation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
          trigger:
            - call: "GET /moderation/moderation-cases/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
          assert:
            - "HTTP 404 with response_type error and data.error_id == ERR_CASE_NOT_FOUND"
            - "GET /moderation/appeals/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2 returns ERR_APPEAL_NOT_FOUND, proving the 404 id is per-entity"
      - name: content_item_missing_required_account_id_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Omitting a field whose source is input and which has no default fails at priority 3 with 400, before any FK existence check at priority 11 can run."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T09:00:00Z."
          setup_api_calls:
            - call: "POST /moderation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
          trigger:
            - call: "POST /moderation/content-items"
              payload: { language: "EN", media_kind: "TEXT" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "no ContentItem row was created: GET /moderation/content-items returns total_count 0"
      - name: account_defaults_applied_when_optional_inputs_omitted
        claim_type: defaults
        grounds:
          - entities.Account
          - endpoints.POST_/moderation/accounts
        distinguishing_aspect: "Omitting tier and appeal_credits_remaining yields STANDARD and DEFAULT_APPEAL_CREDITS 3, and the computed ledger fields start at their zero values."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T09:00:00Z."
          setup_api_calls:
            - call: "POST /moderation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
          trigger:
            - call: "POST /moderation/accounts"
              payload: { external_handle: "acct_defaults", region_code: "DE" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
          assert:
            - "HTTP 201 with data.tier == STANDARD and appeal_credits_remaining == 3"
            - "data.strike_points == 0, lifetime_removed_count == 0, standing == GOOD_STANDING"
            - "an explicit tier HIGH_PROFILE on a second account is honoured and not overwritten by the default"
      - name: reviewer_system_fields_are_server_minted
        claim_type: system_fields
        grounds:
          - entities.Reviewer
          - endpoints.POST_/moderation/reviewers
        distinguishing_aspect: "id, created_at, updated_at and version are minted by the server on create and updated_at advances on the next mutation while created_at does not."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T09:00:00Z, then advanced to 2026-08-01T10:00:00Z before the certification write."
            - "A T2/VIOLENCE category with an ACTIVE v1 exists so that a certification can be granted."
          setup_api_calls:
            - call: "POST /moderation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "POST /moderation/policy-categories"
              payload: { code: "VIOLENT_THREAT", name: "Violent Threat", severity_tier: "T2", specialty: "VIOLENCE" }
              as: PolicyManager
              as_user_id: "pm-alice"
              captures: { cat_id: $.data.id }
            - call: "POST /moderation/policy-versions"
              payload: { policy_category_id: "${cat_id}", version_label: "v1", auto_action_threshold: 0.9000, review_floor: 0.4000, enforcement_action: "REMOVE" }
              as: PolicyManager
              as_user_id: "pm-alice"
              captures: { pv1_id: $.data.id }
            - call: "POST /moderation/policy-versions/${pv1_id}/back-test"
              payload: {}
              as: PolicyManager
              as_user_id: "pm-alice"
            - call: "POST /moderation/policy-versions/${pv1_id}/activate"
              payload: {}
              as: PolicyManager
              as_user_id: "pm-bob"
            - call: "POST /moderation/reviewers"
              payload: { display_name: "Rita", languages: ["EN"], specialties: ["VIOLENCE"], utc_offset_minutes: 0, shift_start_local_hour: 8, shift_end_local_hour: 20, role_class: "FRONTLINE" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { r1_id: $.data.id, r1_v: $.data.version }
            - call: "POST /moderation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T10:00:00Z" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
          trigger:
            - call: "POST /moderation/reviewers/${r1_id}/certifications"
              payload: { policy_version_id: "${pv1_id}", expected_reviewer_version: "${r1_v}" }
              as: PolicyManager
              as_user_id: "pm-alice"
          assert:
            - "the created reviewer had ${r1_v} == 1 with created_at == updated_at == 2026-08-01T09:00:00Z"
            - "after the certification, data.version == 2, created_at is still 2026-08-01T09:00:00Z and updated_at == 2026-08-01T10:00:00Z"
            - "data.certified_policy_version_ids == [${pv1_id}] and the id is unchanged"
      - name: policy_version_threshold_order_invalid_request_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=66]
          - errors.ERR_THRESHOLD_ORDER_INVALID
        distinguishing_aspect: "A numeric-range constraint between two input fields (review_floor must not exceed auto_action_threshold) is enforced at create time with its own 422, distinct from the 400 for a malformed enum."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T09:00:00Z with one T2/VIOLENCE category."
          setup_api_calls:
            - call: "POST /moderation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "POST /moderation/policy-categories"
              payload: { code: "VIOLENT_THREAT", name: "Violent Threat", severity_tier: "T2", specialty: "VIOLENCE" }
              as: PolicyManager
              as_user_id: "pm-alice"
              captures: { cat_id: $.data.id }
          trigger:
            - call: "POST /moderation/policy-versions"
              payload: { policy_category_id: "${cat_id}", version_label: "bad", auto_action_threshold: 0.4000, review_floor: 0.9000, enforcement_action: "REMOVE" }
              as: PolicyManager
              as_user_id: "pm-alice"
            - call: "POST /moderation/policy-categories"
              payload: { code: "OTHER_CODE", name: "Bad Tier", severity_tier: "T9", specialty: "VIOLENCE" }
              as: PolicyManager
              as_user_id: "pm-alice"
          assert:
            - "HTTP 422 with data.error_id == ERR_THRESHOLD_ORDER_INVALID for the inverted thresholds"
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST for the unknown severity_tier enum member T9"
            - "PolicyCategory ${cat_id} still has active_version_id null and no PolicyVersion row exists"
      - name: detection_signal_is_immutable_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.DetectionSignal
          - endpoints.GET_/moderation/detection-signals/{id}
        distinguishing_aspect: "DetectionSignal declares common_fields false, so it carries only id and created_at — no version, no updated_at — and §1.5 exposes no mutating endpoint for it."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T09:00:00Z."
            - "A T2/VIOLENCE category with ACTIVE v1 (auto 0.9000, floor 0.4000), one EN/VIOLENCE queue, one STANDARD account and one TEXT content item of graphic_weight 2."
            - "A signal at 0.7000 has been recorded and routed to HUMAN_REVIEW."
          setup_api_calls:
            - call: "POST /moderation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "POST /moderation/accounts"
              payload: { external_handle: "acct_imm", region_code: "US", tier: "STANDARD" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { acct_id: $.data.id }
            - call: "POST /moderation/policy-categories"
              payload: { code: "VIOLENT_THREAT", name: "Violent Threat", severity_tier: "T2", specialty: "VIOLENCE" }
              as: PolicyManager
              as_user_id: "pm-alice"
              captures: { cat_id: $.data.id }
            - call: "POST /moderation/policy-versions"
              payload: { policy_category_id: "${cat_id}", version_label: "v1", auto_action_threshold: 0.9000, review_floor: 0.4000, enforcement_action: "REMOVE" }
              as: PolicyManager
              as_user_id: "pm-alice"
              captures: { pv1_id: $.data.id }
            - call: "POST /moderation/policy-versions/${pv1_id}/back-test"
              payload: {}
              as: PolicyManager
              as_user_id: "pm-alice"
            - call: "POST /moderation/policy-versions/${pv1_id}/activate"
              payload: {}
              as: PolicyManager
              as_user_id: "pm-bob"
            - call: "POST /moderation/review-queues"
              payload: { name: "EN Violence", policy_category_id: "${cat_id}", language: "EN", specialty: "VIOLENCE" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "POST /moderation/content-items"
              payload: { account_id: "${acct_id}", language: "EN", media_kind: "TEXT", graphic_weight: 2 }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { ci_id: $.data.id }
            - call: "POST /moderation/detection-signals"
              payload: { content_item_id: "${ci_id}", policy_category_code: "VIOLENT_THREAT", classifier_id: "clf-violence-1", classifier_confidence: 0.7000 }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { sig_id: $.data.id, sig_case: $.data.resulting_case_id }
          trigger:
            - call: "GET /moderation/detection-signals/${sig_id}"
              payload: {}
              as: QAAuditor
              as_user_id: "qa-1"
          assert:
            - "HTTP 200 with data.id == ${sig_id} and data.created_at present"
            - "data has no version field and no updated_at field"
            - "data.effective_confidence == 0.7000, disposition == HUMAN_REVIEW, pinned_policy_version_label == v1, resulting_case_id == ${sig_case}"
            - "§1.5 declares no PATCH, PUT or DELETE for /moderation/detection-signals/{id}, so the row can never change"
      - name: policy_version_with_unknown_parent_category_rejected
        claim_type: parent_relationships
        grounds:
          - validations[priority=11]
          - errors.ERR_CATEGORY_NOT_FOUND
        distinguishing_aspect: "A body foreign key to a non-existent parent fails with the parent's own 404 at priority 11, before any threshold-order or uniqueness check runs."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T09:00:00Z; no policy category exists."
          setup_api_calls:
            - call: "POST /moderation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
          trigger:
            - call: "POST /moderation/policy-versions"
              payload: { policy_category_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", version_label: "v1", auto_action_threshold: 0.4000, review_floor: 0.9000, enforcement_action: "REMOVE" }
              as: PolicyManager
              as_user_id: "pm-alice"
          assert:
            - "HTTP 404 with data.error_id == ERR_CATEGORY_NOT_FOUND"
            - "NOT ERR_THRESHOLD_ORDER_INVALID (priority 66), even though review_floor 0.9000 exceeds auto_action_threshold 0.4000"
      - name: moderation_case_reachable_by_every_declared_foreign_key
        claim_type: graph
        grounds:
          - entities.ModerationCase
          - endpoints.GET_/moderation/moderation-cases
          - endpoints.GET_/moderation/content-items/{id}/detection-signals
        distinguishing_aspect: "entity_topology is graph: one ModerationCase points at six parents, and every one of those foreign keys is reverse-navigable — five through the filtered case list and the signal through the content sub-resource."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T09:00:00Z."
            - "A T2/VIOLENCE category with ACTIVE v1, one EN/VIOLENCE queue, one STANDARD account, one TEXT content item of graphic_weight 2, reviewer Rita certified on v1."
            - "A 0.7000 signal produced a case which Rita was assigned and then decided NO_ACTION, so every foreign key on the case is populated."
          setup_api_calls:
            - call: "POST /moderation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "POST /moderation/accounts"
              payload: { external_handle: "acct_graph", region_code: "US", tier: "STANDARD" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { acct_id: $.data.id }
            - call: "POST /moderation/policy-categories"
              payload: { code: "VIOLENT_THREAT", name: "Violent Threat", severity_tier: "T2", specialty: "VIOLENCE" }
              as: PolicyManager
              as_user_id: "pm-alice"
              captures: { cat_id: $.data.id }
            - call: "POST /moderation/policy-versions"
              payload: { policy_category_id: "${cat_id}", version_label: "v1", auto_action_threshold: 0.9000, review_floor: 0.4000, enforcement_action: "REMOVE" }
              as: PolicyManager
              as_user_id: "pm-alice"
              captures: { pv1_id: $.data.id }
            - call: "POST /moderation/policy-versions/${pv1_id}/back-test"
              payload: {}
              as: PolicyManager
              as_user_id: "pm-alice"
            - call: "POST /moderation/policy-versions/${pv1_id}/activate"
              payload: {}
              as: PolicyManager
              as_user_id: "pm-bob"
            - call: "POST /moderation/review-queues"
              payload: { name: "EN Violence", policy_category_id: "${cat_id}", language: "EN", specialty: "VIOLENCE" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { q_id: $.data.id }
            - call: "POST /moderation/reviewers"
              payload: { display_name: "Rita", languages: ["EN"], specialties: ["VIOLENCE"], utc_offset_minutes: 0, shift_start_local_hour: 8, shift_end_local_hour: 20, role_class: "FRONTLINE" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { r1_id: $.data.id, r1_v: $.data.version }
            - call: "POST /moderation/reviewers/${r1_id}/certifications"
              payload: { policy_version_id: "${pv1_id}", expected_reviewer_version: "${r1_v}" }
              as: PolicyManager
              as_user_id: "pm-alice"
            - call: "POST /moderation/content-items"
              payload: { account_id: "${acct_id}", language: "EN", media_kind: "TEXT", graphic_weight: 2 }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { ci_id: $.data.id }
            - call: "POST /moderation/detection-signals"
              payload: { content_item_id: "${ci_id}", policy_category_code: "VIOLENT_THREAT", classifier_id: "clf-violence-1", classifier_confidence: 0.7000 }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { sig_id: $.data.id, case_id: $.data.resulting_case_id }
            - call: "GET /moderation/moderation-cases/${case_id}"
              payload: {}
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { c_v: $.data.version }
            - call: "POST /moderation/moderation-cases/${case_id}/assign"
              payload: { expected_case_version: "${c_v}", target_reviewer_id: "${r1_id}" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "POST /moderation/moderation-cases/${case_id}/decide"
              payload: { outcome: "NO_ACTION" }
              as: Reviewer
              as_user_id: "${r1_id}"
          trigger:
            - call: "GET /moderation/moderation-cases"
              payload: { content_item_id: "${ci_id}" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "GET /moderation/content-items/${ci_id}/detection-signals"
              payload: {}
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
          assert:
            - "the filtered case list returns total_count 1 containing ${case_id}"
            - "the same list filtered by detection_signal_id, policy_version_id, queue_id, assigned_reviewer_id and decided_by_reviewer_id each return total_count 1 with ${case_id}"
            - "the content sub-resource returns response_type array with exactly one signal, ${sig_id}, whose resulting_case_id == ${case_id}"
            - "ModerationCase.${case_id}.decision_outcome == NO_ACTION with strike_points_applied 0, so ContentItem.${ci_id}.review_status == CLEAR and visibility_status == LIVE"
            - "Account.${acct_id}.strike_points == 0 and standing == GOOD_STANDING"

  - section: state_machines
    instances:
      - name: content_item_starts_live_and_clear
        claim_type: initial_state
        grounds:
          - state_machines.ContentItem.initial_state
