          rationale: "Clock-deferred execution (lapse at due date, expiry at end date) is driven through set_current_utc in the named 1.8 instance; the fixed 2026-09-01T00:00:00Z default is asserted in applicant_company_create_returns_envelope_defaults_and_fixed_clock."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: approval_decision_and_dependent_reads_agree_immediately
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.GenericApplication.RECEIVED_to_APPROVED
          - state_machines.ExclusivityAward.ELIGIBLE_to_AWARDED
        distinguishing_aspect: "Immediate consistency: the approval-decision response already shows APPROVED, and the very next read of the exclusivity award shows AWARDED with marketing_deadline computed — no reconciliation lag."
        test_recipe:
          setup:
            - "Clock at 2026-12-01. First-filer application (P4 certification, ACCEPTED BE study, PASSED inspection, timely notice, suit window closed with no suit) about to be approved."
          setup_api_calls:
            - call: "POST /generic-drug-review/applicant-companies"
              payload: { legal_name: "Immediate Co", contact_email: "reg@im.example", headquarters_country: "US" }
              as: ProgramAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /generic-drug-review/reference-products"
              payload: { brand_name: "Immedex", active_ingredient: "immedexol", strength: "56 mg", dosage_form: "TABLET", rld_approval_date: "2000-01-01", is_new_chemical_entity: false, indication_codes: ["IND-A"], patent_owner_user_id: "innovator-ops-85" }
              as: ProgramAdmin
              captures: { rld_id: $.data.id }
            - call: "POST /generic-drug-review/reference-products/${rld_id}/listed-patents"
              payload: { patent_number: "US1919001", patent_type: "DRUG_SUBSTANCE", expiry_date: "2030-01-01" }
              as: InnovatorSponsor
              as_user_id: "innovator-ops-85"
              captures: { pat_id: $.data.id }
            - call: "POST /generic-drug-review/applications"
              payload: { reference_product_id: "${rld_id}", applicant_id: "${ac_id}", review_priority: "STANDARD", labeling_mode: "FULL", carved_indication_codes: [] }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { app_id: $.data.id, app_v0: $.data.version }
            - call: "POST /generic-drug-review/applications/${app_id}/bioequivalence-studies"
              payload: { study_type: "FASTING", analyte: "immedexol", auc_ratio_pct: 100.0, auc_ci_low_pct: 92.0, auc_ci_high_pct: 108.0, cmax_ratio_pct: 99.0, cmax_ci_low_pct: 90.0, cmax_ci_high_pct: 110.0 }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
            - call: "POST /generic-drug-review/applications/${app_id}/patent-certifications"
              payload: { patent_id: "${pat_id}", certification_type: "PARAGRAPH_IV_CHALLENGE", expected_application_version: "${app_v0}" }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { cert_id: $.data.id }
            - call: "POST /generic-drug-review/manufacturing-facilities"
              payload: { applicant_id: "${ac_id}", facility_name: "IM Plant", fei_number: "FEI-IM-1", country_code: "US" }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /generic-drug-review/facility-inspections"
              payload: { facility_id: "${fac_id}", application_id: "${app_id}", scheduled_start_date: "2026-09-05", scheduled_end_date: "2026-09-07" }
              as: RegulatoryReviewer
              captures: { insp_id: $.data.id }
            - call: "POST /generic-drug-review/facility-inspections/${insp_id}/record-outcome"
              payload: { outcome: "PASSED" }
              as: FacilityInspector
            - call: "POST /generic-drug-review/applications/${app_id}/submit"
              payload: {}
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
            - call: "POST /generic-drug-review/patent-certifications/${cert_id}/notices"
              payload: {}
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /generic-drug-review/applications/${app_id}/approval-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              captures: { st: $.data.status, ad: $.data.approval_date }
            - call: "GET /generic-drug-review/exclusivity-awards"
              payload: { application_id: "${app_id}" }
              as: RegulatoryReviewer
              captures: { aw_status: "$.data[0].status", aw_mdl: "$.data[0].marketing_deadline" }
          assert:
            - "the decision response itself carries status == APPROVED and approval_date == \"2026-12-01\""
            - "the immediately following GET shows the award already AWARDED with marketing_deadline == \"2027-02-14\" — every side effect of the transition is visible in the same logical instant"

