            - "Console CONSOLE-O1 declared_max_span 2, observer S_O, carrying one ACTIVE feed (acuity weight 2.0), so the station is ACTIVE_MONITORING and S_O is ON_ASSIGNMENT."
            - "The clock is left at the startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-O", name: "Remote Monitoring Unit O", observation_cost_budget_cents: 500000, video_monitoring_enabled: true }
              as: NurseManager
              captures: { unit_o: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${unit_o}", mrn: "MRN-9501", full_name: "Pat Seventeen", age_years: 60 }
