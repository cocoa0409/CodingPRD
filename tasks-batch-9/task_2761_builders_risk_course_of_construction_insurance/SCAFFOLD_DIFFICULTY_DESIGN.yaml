  - rule_id: transitive_cascade
    instances:
      - name: clock_expiry_cascades_policy_parts_storage_and_facility
        grounds:
          - state_machines.BuildersRiskPolicy.IN_FORCE_to_EXPIRED
          - state_machines.CoveragePart.ACTIVE_to_CLOSED
          - state_machines.TemporaryStorageAssignment.APPROVED_to_RELEASED
          - state_machines.ExtensionEndorsement.REQUESTED_to_LAPSED
          - entities.StorageFacility.fields.committed_value_cents
          - entities.TemporaryStorageAssignment.fields.release_reason
        distinguishing_aspect: |
          A depth-4 chain triggered by the logical clock, where each hop is caused by the previous
          hop and not by the clock itself: the clock expires the policy; because the policy left
          IN_FORCE its coverage parts close; because those parts closed the temporary-storage
          assignments are released; because an assignment was released the shared facility's
          committed_value_cents falls. The facility is never named in the triggering call.
        test_recipe:
