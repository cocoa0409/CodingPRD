  - rule_id: non_linear_state_machine
    instances:
      - name: prospect_parallel_dimensions_advance_without_disturbing_each_other
        grounds:
          - state_machines.Prospect
          - entities.Prospect.fields.declaration_status
          - entities.Prospect.fields.invitation_status
          - entities.Prospect.fields.consent_status
          - entities.Prospect.fields.signing_status
        distinguishing_aspect: |
          Prospect carries five independent state dimensions on one row; a consent GRANT must
          move only consent_status and consent_scope while declaration_status stays DECLARED,
          invitation_status stays ACCEPTED, eligibility_status stays ELIGIBLE, signing_status
          stays UNSIGNED and medical_clearance_status stays PENDING. An implementation with a
          single `status` column cannot represent this combined state.
        test_recipe:
          setup:
            - "DraftCycle 2027 in DECLARATION_OPEN with two REGISTERED clubs"
            - "Prospect Avery Lane created, then DECLARED, ruled ELIGIBLE, INVITED and ACCEPTED"
            - "Logical clock at 2027-01-02T00:00:00.000Z, before the 2027-01-15T23:59:59.000Z declaration deadline"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00.000Z" }
              as: LeagueDraftAdmin
            - call: "POST /draft-ops/draft-cycles"
              payload: { season_year: 2027, declaration_deadline_at: "2027-01-15T23:59:59.000Z", combine_week_start_at: "2027-02-22T08:00:00.000Z", combine_week_end_at: "2027-02-28T20:00:00.000Z", draft_start_at: "2027-04-22T18:00:00.000Z", rounds_count: 2 }
