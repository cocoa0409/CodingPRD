# =============================================================================
# SCAFFOLD — Newborn Hearing Screening & Follow-Up Tracking (state EHDI program)
# §1.0 response envelope, §1.1 entities, §1.2 state machines, §1.2.1 concurrency,
# §1.3 calculations, §1.4 validations, §1.5 endpoints, §1.6 errors, §1.7 RBAC.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2606. Newborn Hearing Screening & Follow-Up Tracking (state early hearing detection program):
  birth facility screening protocol before discharge with pass/refer results, refer-result
  outpatient rescreen scheduling and loss-to-follow-up prevention, diagnostic audiologic
  evaluation timeliness benchmarks by age, early intervention referral and enrollment linkage,
  risk-factor registry for delayed-onset hearing loss surveillance, out-of-hospital and home
  birth capture pathways, provider reporting compliance and facility performance dashboards,
  family communication in preferred language and appointment navigation support

domain_name: newborn-hearing-screening
# Flat topology: every business resource is a top-level collection under the root prefix and
# is linked by foreign keys in request bodies (no ownership nesting in URL paths).
api_prefix: /

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
    - rate_threshold_triggers
    - ops_run_checkpoint

  entity_topology: flat
  state_machine_shape: branching
  # Branching is the dominant shape (DiagnosticEvaluation forks ATTESTED -> {FINALIZED_LOSS,
  # FINALIZED_NO_LOSS} with divergent cascades; FacilityReport forks SUBMITTED -> {ACCEPTED,
  # RETURNED_FOR_CORRECTION}); FollowUpEpisode is cyclic (rescreen attempt loop and
  # LOST_TO_FOLLOW_UP re-engagement loop) and Infant carries two parallel state dimensions
  # (screening_status x intervention_status) that advance independently on the same row.

  relationship_patterns:
    - one_to_many          # Facility -> Infant, Infant -> FollowUpEpisode, Episode -> RescreenAppointment
    - self_referential     # ScreeningEncounter.prior_encounter_id, FollowUpEpisode.supersedes_episode_id, FacilityReport.supersedes_report_id
    - cross_aggregate      # NavigationTask.funding_facility_id, EarlyInterventionReferral.ei_program_facility_id

  role_model: segregation_of_duties
  # Two hard segregation rules: (1) the Audiologist who attests a DiagnosticEvaluation must not
  # be the Provider who performed it; (2) the operator who accepted a FacilityReport must not be
  # the operator who waives its penalty.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================

entities:
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Facility legal name.
        constraints: 1..120 chars, required
      - name: facility_type
        type: enum
        source: input
        description: Program role of this facility.
        constraints: "one of {BIRTH_HOSPITAL, BIRTHING_CENTER, MIDWIFE_PRACTICE, AUDIOLOGY_CLINIC, EI_PROGRAM}"
      - name: region_code
        type: string
        source: input
        description: State service region; used by the navigator and EI-program selectors.
        constraints: "one of {R1, R2, R3, R4}"
      - name: navigation_budget_units_total
        type: integer
        source: input
        default: 40
        description: Total navigation-support units this facility may have reserved at once.
        constraints: 0..999
      - name: navigation_budget_units_remaining
        type: integer
        source: computed
        description: >-
          navigation_budget_units_total minus the sum of units_reserved over NavigationTask rows
          whose funding_facility_id is this facility and whose status IN {UNASSIGNED, OPEN, COMPLETED}.
      - name: penalty_points_balance
        type: integer
        source: computed
        description: >-
          Reporting-compliance penalty balance; equals sum(FacilityReport.assessed_penalty_points
          WHERE facility_id == this.id AND status == ACCEPTED) + manual_adjustment_points_total.
        default: 0
      - name: manual_adjustment_points_total
        type: integer
        source: computed
        description: Running sum of points_delta applied by POST /facilities/{id}/penalty-adjustments.
        default: 0
      - name: reporting_compliance_status
        type: enum
        source: computed
        description: >-
          Posture derived from penalty_points_balance at every mutation that changes it:
          balance <= 4 COMPLIANT; 5..9 WATCH; 10..17 PROBATION; >= 18 SUSPENDED.
        default: COMPLIANT
        constraints: "one of {COMPLIANT, WATCH, PROBATION, SUSPENDED}"
      - name: performance_score
        type: number
        source: computed
        description: >-
          Official cohort-basis performance score (0..100, 2dp) written by the most recent
          POST /reporting-periods/{id}/close; null when any component denominator is 0.
        default: null
      - name: encounter_basis_performance_score
        type: number
        source: computed
        description: >-
          Encounter-basis variant of the same score written by the same close run; retained for
          reconciliation against performance_score and never used to drive posture.
        default: null
      - name: last_closed_period_label
        type: string
        source: computed
        description: period_start..period_end label of the most recently closed ReportingPeriod, or null.
        default: null

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id; employing facility of this provider.
      - name: provider_type
        type: enum
        source: input
        description: Clinical/operational function; gates which role identity this provider may act as.
        constraints: "one of {SCREENER, AUDIOLOGIST, NAVIGATOR, EI_COORDINATOR}"
      - name: full_name
        type: string
        source: input
        description: Provider display name.
        constraints: 1..120 chars, required
      - name: region_code
        type: string
        source: input
        description: Service region this provider covers; matched against the infant's birth-facility region.
        constraints: "one of {R1, R2, R3, R4}"
      - name: languages
        type: array
        source: input
        description: Languages this provider can serve families in.
        default: ["EN"]
        constraints: "non-empty array of {EN, ES, ZH, VI, AR, ASL, OTHER}"
      - name: credential_status
        type: enum
        source: input
        default: ACTIVE
        description: Credential standing; only ACTIVE providers may perform or be assigned work.
        constraints: "one of {ACTIVE, LAPSED, SUSPENDED}"
      - name: max_open_tasks
        type: integer
        source: input
        default: 5
        description: Navigator workload ceiling used by the navigator selector's eligibility filter.
        constraints: 1..50
      - name: open_task_count
        type: integer
        source: computed
        description: count(NavigationTask WHERE assigned_provider_id == this.id AND status == OPEN).
        default: 0

  - name: Infant
    parent: null
    common_fields: true
    fields:
      - name: birth_facility_id
        type: string
        source: input
        description: FK -> Facility.id; facility of record for the birth (or the midwife practice for a home birth).
      - name: birth_datetime
        type: datetime
        source: input
        description: ISO 8601 UTC birth instant; must be <= the logical clock at registration.
      - name: birth_setting
        type: enum
        source: input
        description: Capture pathway; drives the loss-to-follow-up base weight and the initial-screen episode rule.
        constraints: "one of {INPATIENT, BIRTHING_CENTER, OUT_OF_HOSPITAL, HOME_BIRTH}"
      - name: gestational_age_weeks
        type: integer
        source: input
        description: Completed gestational weeks at birth; drives the corrected-age offset.
        constraints: 22..44
      - name: nicu_stay_days
        type: integer
        source: input
        default: 0
        description: NICU length of stay in days; >= 5 forces the corrected-age basis and auto-registers a risk factor.
        constraints: 0..365
      - name: preferred_language
        type: enum
        source: input
        default: EN
        description: Family's preferred language for all program communication.
        constraints: "one of {EN, ES, ZH, VI, AR, ASL, OTHER}"
      - name: interpreter_required
        type: boolean
        source: input
        default: false
        description: Family requires interpreter support; adds navigation units and language-gap risk points.
      - name: guardian_name
        type: string
        source: input
        description: Guardian of record.
        constraints: 1..120 chars, required
      - name: guardian_contact_phone
        type: string
        source: input
        description: Guardian contact number used by navigation outreach.
        constraints: 7..20 chars, required
      - name: guardian_consent_status
        type: enum
        source: input
        default: GRANTED
        description: Consent for screening/diagnostic procedures; REFUSED blocks diagnostic submission.
        constraints: "one of {PENDING, GRANTED, REFUSED}"
      - name: discharge_datetime
        type: datetime
        source: system
        description: Stamped by POST /infants/{id}/discharge from the request body; null until discharged.
        default: null
      - name: discharged_unscreened
        type: boolean
        source: computed
        default: false
        description: True when discharge was recorded while screening_status was NOT_SCREENED.
      - name: screening_status
        type: enum
        source: computed
        description: >-
          Screening/diagnostic dimension of the case (state machine dimension A); advances only
          through declared §1.2 transitions.
        default: NOT_SCREENED
        constraints: "one of {NOT_SCREENED, PASSED, REFERRED, DIAGNOSTIC_IN_PROGRESS, DIAGNOSED_NO_LOSS, DIAGNOSED_LOSS, LOST_TO_FOLLOW_UP}"
      - name: intervention_status
        type: enum
        source: computed
        description: >-
          Early-intervention dimension of the case (state machine dimension B); advances
          independently of screening_status on the same row.
        default: NOT_APPLICABLE
        constraints: "one of {NOT_APPLICABLE, REFERRAL_DUE, REFERRED, ENROLLED, DECLINED}"
      - name: ltf_risk_score
        type: integer
        source: computed
        description: Loss-to-follow-up risk score 0..100 per calculations.ltf_risk_score.
        default: 0
      - name: priority_band
        type: enum
        source: computed
        description: "Band of ltf_risk_score: >= 45 CRITICAL, >= 30 HIGH, >= 15 ELEVATED, else LOW."
        default: LOW
        constraints: "one of {LOW, ELEVATED, HIGH, CRITICAL}"
      - name: missed_appointment_count
        type: integer
        source: computed
        default: 0
        description: count(RescreenAppointment WHERE infant_id == this.id AND status == NO_SHOW).
      - name: risk_factor_count
        type: integer
        source: computed
        default: 0
        description: >-
          count(RiskFactorEntry WHERE infant_id == this.id AND status IN
          {ACTIVE, SURVEILLANCE_DUE, SURVEILLANCE_OVERDUE}).
      - name: reengagement_count
        type: integer
        source: computed
        default: 0
        description: Number of times a LOST_TO_FOLLOW_UP episode of this infant was re-opened by outreach.

  - name: ScreeningEncounter
    parent: null
    common_fields: false
    # Append-only clinical event: no update path, no version field (id + created_at only).
    fields:
      - name: infant_id
        type: string
        source: input
        description: FK -> Infant.id; infant screened.
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id; facility where the screen was performed.
      - name: performed_by_provider_id
        type: string
        source: input
        description: FK -> Provider.id; provider who performed the screen; must be credential_status ACTIVE.
      - name: episode_id
        type: string
        source: input
        description: FK -> FollowUpEpisode.id; episode this screen answers; null for a BIRTH_ADMISSION screen.
        default: null
      - name: appointment_id
        type: string
        source: input
        description: FK -> RescreenAppointment.id; booked appointment this screen fulfils; null for walk-in/inpatient screens.
        default: null
      - name: prior_encounter_id
        type: string
        source: input
        description: FK -> ScreeningEncounter.id; the screen this one repeats (self-referential attempt chain); null for the first screen.
        default: null
      - name: encounter_type
        type: enum
        source: input
        description: Screening pathway of this event.
        constraints: "one of {BIRTH_ADMISSION, OUTPATIENT_RESCREEN, HOME_VISIT, SURVEILLANCE}"
      - name: method
        type: enum
        source: input
        description: Physiologic method used.
        constraints: "one of {OAE, AABR}"
      - name: performed_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant of the screen; must be >= infant.birth_datetime and <= logical clock.
      - name: left_ear_result
        type: enum
        source: input
        description: Left ear outcome.
        constraints: "one of {PASS, REFER, NOT_TESTED}"
      - name: right_ear_result
        type: enum
        source: input
        description: Right ear outcome.
        constraints: "one of {PASS, REFER, NOT_TESTED}"
      - name: overall_result
        type: enum
        source: computed
        description: Per calculations.overall_screening_result — PASS, REFER, or INCOMPLETE.
        constraints: "one of {PASS, REFER, INCOMPLETE}"
      - name: before_discharge
        type: boolean
        source: computed
        description: >-
          True when encounter_type == BIRTH_ADMISSION and (infant.discharge_datetime is null OR
          performed_at <= infant.discharge_datetime); used by the cohort-basis screening rate.
      - name: age_days_at_encounter
        type: integer
        source: computed
        description: floor((performed_at - infant.birth_datetime) / 86400 seconds).

  - name: FollowUpEpisode
    parent: null
    common_fields: true
    fields:
      - name: infant_id
        type: string
        source: input
        description: FK -> Infant.id; subject of this follow-up case.
      - name: supersedes_episode_id
        type: string
        source: input
        description: FK -> FollowUpEpisode.id; prior open episode this one replaces (self-referential); null when none.
        default: null
      - name: episode_type
        type: enum
        source: input
        description: Milestone this episode chases; selects the benchmark age and the required slot_type.
        constraints: "one of {INITIAL_SCREEN, RESCREEN, DIAGNOSTIC}"
      - name: status
        type: enum
        source: computed
        description: Cyclic follow-up lifecycle per §1.2.
        default: PENDING_SCHEDULING
        constraints: "one of {PENDING_SCHEDULING, SCHEDULED, ESCALATED_DIAGNOSTIC, LOST_TO_FOLLOW_UP, RESOLVED_PASS, RESOLVED_DIAGNOSED, RESOLVED_NO_LOSS, CLOSED_DECLINED, SUPERSEDED}"
      - name: owner_scope
        type: enum
        source: computed
        description: Who owns the outreach; escalated to STATE_PROGRAM when the facility posture degrades.
        default: FACILITY
        constraints: "one of {FACILITY, STATE_PROGRAM}"
      - name: escalation_flag
        type: boolean
        source: computed
        default: false
        description: True once this episode has been escalated by a period close; adds risk points.
      - name: benchmark_days
        type: integer
        source: computed
        description: "30 when episode_type IN {INITIAL_SCREEN, RESCREEN}; 90 when DIAGNOSTIC."
      - name: due_date
        type: datetime
        source: computed
        description: infant.birth_datetime + benchmark_days days (calendar-independent 86400s multiples).
      - name: attempt_count
        type: integer
        source: computed
        default: 0
        description: count(RescreenAppointment WHERE episode_id == this.id AND status IN {BOOKED, ATTENDED, NO_SHOW}).
      - name: timeliness_status
        type: enum
        source: computed
        description: Per calculations.milestone_timeliness_status under the infant's applied age basis.
        default: PENDING
        constraints: "one of {PENDING, ON_TIME, LATE, OVERDUE}"
      - name: closure_reason
        type: enum
        source: computed
        description: Why the episode left the active set; null while active.
        default: null
        constraints: "one of {RESCREEN_PASSED, DIAGNOSIS_CONFIRMED, DIAGNOSIS_NO_LOSS, FAMILY_DECLINED, MOVED_OUT_OF_STATE, SUPERSEDED, LOST_TO_FOLLOW_UP}"
      - name: closed_at
        type: datetime
        source: computed
        description: Logical-clock instant at which the episode reached a terminal state; null while active.
        default: null

  - name: ClinicSlot
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id; clinic offering the slot.
      - name: provider_id
        type: string
        source: input
        description: FK -> Provider.id; audiologist staffing the slot; overlap is rejected per provider.
      - name: starts_at
        type: datetime
        source: input
        description: Half-open window start (inclusive).
      - name: ends_at
        type: datetime
        source: input
        description: Half-open window end (exclusive); must be > starts_at.
      - name: slot_type
        type: enum
        source: input
        description: Which episode types may book this slot.
        constraints: "one of {RESCREEN, DIAGNOSTIC}"
      - name: total_capacity
        type: integer
        source: input
        default: 1
        description: Number of appointments the slot can hold concurrently.
        constraints: 1..20
      - name: booked_count
        type: integer
        source: computed
        default: 0
        description: count(RescreenAppointment WHERE slot_id == this.id AND status IN {BOOKED, ATTENDED}).
      - name: remaining_capacity
        type: integer
        source: computed
        description: total_capacity - booked_count; never negative.
      - name: status
        type: enum
        source: computed
        description: OPEN while remaining_capacity >= 1, FULL at 0.
        default: OPEN
        constraints: "one of {OPEN, FULL}"

  - name: RescreenAppointment
    parent: null
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: input
        description: FK -> FollowUpEpisode.id; episode being scheduled.
      - name: slot_id
        type: string
        source: input
        description: FK -> ClinicSlot.id; slot occupied by this appointment.
      - name: infant_id
        type: string
        source: computed
        description: FK -> Infant.id; copied from the episode at booking so family-burden checks are single-hop.
      - name: linked_navigation_task_id
        type: string
        source: computed
        description: FK -> NavigationTask.id; interpreter task auto-created when interpreter_needed is true; null otherwise.
        default: null
      - name: interpreter_needed
        type: boolean
        source: input
        default: false
        description: Book interpreter support for this visit; reserves navigation units at the funding facility.
      - name: status
        type: enum
        source: computed
        description: Appointment lifecycle per §1.2.
        default: BOOKED
        constraints: "one of {BOOKED, ATTENDED, NO_SHOW, CANCELLED}"
      - name: disposition_reason
        type: string
        source: computed
        description: Free-text reason captured when the appointment was closed as NO_SHOW or CANCELLED; null while BOOKED.
        default: null

  - name: DiagnosticEvaluation
    parent: null
    common_fields: true
    fields:
      - name: infant_id
        type: string
        source: input
        description: FK -> Infant.id; infant evaluated.
      - name: episode_id
        type: string
        source: input
        description: FK -> FollowUpEpisode.id; the DIAGNOSTIC episode this evaluation answers.
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id; audiology clinic performing the evaluation.
      - name: performed_by_provider_id
        type: string
        source: input
        description: FK -> Provider.id; audiologist who performed the evaluation.
      - name: attested_by_provider_id
        type: string
        source: computed
        description: FK -> Provider.id; second-reader audiologist who attested; null until attestation.
        default: null
      - name: evaluation_datetime
        type: datetime
        source: input
        description: ISO 8601 UTC instant of the evaluation session; must be <= logical clock.
      - name: method
        type: enum
        source: input
        description: Diagnostic technique.
        constraints: "one of {DIAGNOSTIC_ABR, ASSR, BEHAVIORAL}"
      - name: left_ear_threshold_db
        type: integer
        source: input
        description: Left ear threshold in dB nHL, supplied at submit.
        default: null
        constraints: 0..120
      - name: right_ear_threshold_db
        type: integer
        source: input
        description: Right ear threshold in dB nHL, supplied at submit.
        default: null
        constraints: 0..120
      - name: outcome
        type: enum
        source: input
        description: Clinical conclusion supplied at submit; must agree with the thresholds (> 25 dB means loss in that ear).
        default: null
        constraints: "one of {NO_LOSS, UNILATERAL_LOSS, BILATERAL_LOSS}"
      - name: status
        type: enum
        source: computed
        description: Branching evaluation lifecycle per §1.2.
        default: DRAFT
        constraints: "one of {DRAFT, PENDING_ATTESTATION, ATTESTED, FINALIZED_LOSS, FINALIZED_NO_LOSS}"
      - name: finalized_at
        type: datetime
        source: computed
        description: Logical-clock instant of finalize; null before.
        default: null
      - name: age_days_at_finalize
        type: integer
        source: computed
        description: Chronological age in days at finalize per calculations.infant_age_basis.
        default: null
      - name: timeliness_status
        type: enum
        source: computed
        description: >-
          Diagnostic timeliness under the infant's APPLIED age basis (corrected when the infant
          qualifies) against the 90-day benchmark; written at finalize.
        default: PENDING
        constraints: "one of {PENDING, ON_TIME, LATE, OVERDUE}"
      - name: timeliness_status_chronological_basis
        type: enum
        source: computed
        description: >-
          The same benchmark evaluated with the chronological-basis variant; written at finalize so
          the two variants can be reconciled on one row.
        default: PENDING
        constraints: "one of {PENDING, ON_TIME, LATE, OVERDUE}"
      - name: attestation_note
        type: string
        source: computed
        description: Note recorded by the attesting audiologist; null until attestation.
        default: null

  - name: EarlyInterventionReferral
    parent: null
    common_fields: true
    fields:
      - name: infant_id
        type: string
        source: input
        description: FK -> Infant.id; infant referred to early intervention.
      - name: diagnostic_evaluation_id
        type: string
        source: input
        description: FK -> DiagnosticEvaluation.id; the FINALIZED_LOSS evaluation that generated this referral.
      - name: ei_program_facility_id
        type: string
        source: computed
        description: FK -> Facility.id; EI_PROGRAM facility chosen by the EI-program selector; null when the pool was empty.
        default: null
      - name: status
        type: enum
        source: computed
        description: Referral/enrollment lifecycle per §1.2.
        default: PENDING
        constraints: "one of {PENDING, ACCEPTED, ENROLLED, DECLINED_BY_FAMILY, REJECTED_BY_PROGRAM}"
      - name: referred_at
        type: datetime
        source: computed
        description: Logical-clock instant at which the referral row was created by the finalize cascade.
      - name: accepted_at
        type: datetime
        source: computed
        description: Logical-clock instant of program acceptance; null before.
        default: null
      - name: ifsp_date
        type: datetime
        source: input
        description: Individualized Family Service Plan date supplied at enrollment.
        default: null
      - name: enrollment_age_days
        type: integer
        source: computed
        description: Applied-basis age in days at enrollment; null before enrollment.
        default: null
      - name: ei_timeliness_status
        type: enum
        source: computed
        description: Enrollment timeliness against the 180-day benchmark under the applied age basis.
        default: PENDING
        constraints: "one of {PENDING, ON_TIME, LATE, OVERDUE}"
      - name: resolution_reason
        type: string
        source: computed
        description: Reason recorded with a REJECTED_BY_PROGRAM or DECLINED_BY_FAMILY decision; null otherwise.
        default: null

  - name: RiskFactorEntry
    parent: null
    common_fields: true
    fields:
      - name: infant_id
        type: string
        source: input
        description: FK -> Infant.id; infant carrying this delayed-onset risk factor.
      - name: risk_factor_code
        type: enum
        source: input
        description: JCIH risk indicator for delayed-onset hearing loss.
        constraints: "one of {CMV, FAMILY_HISTORY, CRANIOFACIAL_ANOMALY, SYNDROME, BACTERIAL_MENINGITIS, ECMO, HYPERBILIRUBINEMIA_EXCHANGE, OTOTOXIC_MEDICATION, NICU_5_PLUS_DAYS}"
      - name: identified_at
        type: datetime
        source: input
        description: Instant the factor was documented; must be >= infant.birth_datetime and <= logical clock.
      - name: source
        type: enum
        source: input
        default: BIRTH_FACILITY
        description: Who documented the factor; REGISTRY_AUTO marks rows minted by the NICU auto-registration cascade.
        constraints: "one of {BIRTH_FACILITY, AUDIOLOGY, REGISTRY_AUTO}"
      - name: surveillance_due_date
        type: datetime
        source: computed
        description: >-
          infant.birth_datetime + 180 days for HIGH_RISK codes {CMV, BACTERIAL_MENINGITIS, ECMO};
          + 270 days otherwise.
      - name: status
        type: enum
        source: computed
        description: Surveillance lifecycle per §1.2.
        default: ACTIVE
        constraints: "one of {ACTIVE, SURVEILLANCE_DUE, SURVEILLANCE_OVERDUE, CLEARED, LOSS_IDENTIFIED}"
      - name: surveillance_result
        type: enum
        source: computed
        description: Result of the SURVEILLANCE screen that closed this entry; null while open.
        default: null
        constraints: "one of {PASS, REFER}"
      - name: surveillance_recorded_at
        type: datetime
        source: computed
        description: Logical-clock instant at which the surveillance screen closed this entry; null while open.
        default: null

  - name: NavigationTask
    parent: null
    common_fields: true
    fields:
      - name: infant_id
        type: string
        source: input
        description: FK -> Infant.id; family this navigation work serves.
      - name: episode_id
        type: string
        source: input
        description: FK -> FollowUpEpisode.id; episode this task supports; null for EI-linkage tasks.
        default: null
      - name: funding_facility_id
        type: string
        source: computed
        description: FK -> Facility.id; copied from infant.birth_facility_id at creation; its budget funds units_reserved.
      - name: assigned_provider_id
        type: string
        source: computed
        description: FK -> Provider.id; navigator holding the task; null while UNASSIGNED.
        default: null
      - name: task_type
        type: enum
        source: input
        description: Kind of navigation support.
        constraints: "one of {OUTREACH_CALL, INTERPRETER_SESSION, HOME_VISIT, EI_LINKAGE, APPOINTMENT_NAVIGATION}"
      - name: visit_starts_at
        type: datetime
        source: input
        description: Home-visit window start; required when task_type == HOME_VISIT, forbidden otherwise.
        default: null
      - name: visit_ends_at
        type: datetime
        source: input
        description: Home-visit window end; required when task_type == HOME_VISIT and must be > visit_starts_at.
        default: null
      - name: units_reserved
        type: integer
        source: computed
        description: Per calculations.navigation_units_cost; 0 when the funding facility had insufficient budget.
        default: 0
      - name: budget_shortfall_flag
        type: boolean
        source: computed
        default: false
        description: True when a cascade-created task could not reserve its units because the budget was short.
      - name: status
        type: enum
        source: computed
        description: Task lifecycle per §1.2.
        default: UNASSIGNED
        constraints: "one of {UNASSIGNED, OPEN, COMPLETED, CANCELLED}"
      - name: outcome
        type: enum
        source: computed
        description: Recorded at completion; FAMILY_REENGAGED drives the re-engagement cascade.
        default: null
        constraints: "one of {CONTACTED, FAMILY_REENGAGED, NO_CONTACT, INTERPRETER_PROVIDED, LINKED}"
      - name: contacted_language
        type: enum
        source: computed
        description: Language actually used with the family at completion; null while open.
        default: null
        constraints: "one of {EN, ES, ZH, VI, AR, ASL, OTHER}"
      - name: closure_note
        type: string
        source: computed
        description: Reason text recorded when the task was closed as CANCELLED; null otherwise.
        default: null

  - name: ReportingPeriod
    parent: null
    common_fields: true
    fields:
      - name: period_start
        type: datetime
        source: input
        description: Inclusive start of the reporting window.
      - name: period_end
        type: datetime
        source: input
        description: Exclusive end of the reporting window; must be > period_start and must not overlap another period.
      - name: submission_due_datetime
        type: datetime
        source: input
        description: Deadline for facility report submission; must be >= period_end.
      - name: status
        type: enum
        source: computed
        description: OPEN until closed by the ops-run checkpoint.
        default: OPEN
        constraints: "one of {OPEN, CLOSED}"
      - name: closed_at
        type: datetime
        source: computed
        description: Logical-clock instant of close; null while OPEN.
        default: null
      - name: facilities_assessed_count
        type: integer
        source: computed
        default: 0
        description: Number of non-EI_PROGRAM facilities assessed by this period's close run.
      - name: episodes_escalated_count
        type: integer
        source: computed
        default: 0
        description: Number of episodes escalated to STATE_PROGRAM by this period's close run.
      - name: episodes_lost_count
        type: integer
        source: computed
        default: 0
        description: Number of episodes moved to LOST_TO_FOLLOW_UP by this period's close run.

  - name: FacilityReport
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id; reporting facility.
      - name: reporting_period_id
        type: string
        source: input
        description: FK -> ReportingPeriod.id; period covered.
      - name: supersedes_report_id
        type: string
        source: input
        description: FK -> FacilityReport.id; returned/submitted report this corrected filing replaces (self-referential); null for a first filing.
        default: null
      - name: attested_screened_count
        type: integer
        source: input
        description: Facility-attested count of infants screened during the period; null on auto-generated non-filing reports.
        default: null
        constraints: 0..99999
      - name: attested_refer_count
        type: integer
        source: input
        description: Facility-attested count of REFER results during the period; null on auto-generated non-filing reports.
        default: null
        constraints: 0..99999
      - name: actual_screened_count
        type: integer
        source: computed
        description: Server-computed distinct infants with a BIRTH_ADMISSION encounter at this facility inside the period window.
      - name: actual_refer_count
        type: integer
        source: computed
        description: Server-computed count of this facility's encounters inside the period window whose overall_result == REFER.
      - name: variance_case_count
        type: integer
        source: computed
        description: >-
          abs(attested_screened_count - actual_screened_count) + abs(attested_refer_count -
          actual_refer_count); equals actual_refer_count on auto-generated non-filing reports.
      - name: submitted_at
        type: datetime
        source: computed
        description: Logical-clock instant of submission (or of the close run for auto-generated reports).
      - name: submitted_late
        type: boolean
        source: computed
        default: false
        description: submitted_at > ReportingPeriod.submission_due_datetime.
      - name: auto_generated
        type: boolean
        source: computed
        default: false
        description: True for the non-filing report of record minted by a close run when the facility filed nothing.
      - name: status
        type: enum
        source: computed
        description: Review lifecycle per §1.2.
        default: SUBMITTED
        constraints: "one of {SUBMITTED, RETURNED_FOR_CORRECTION, ACCEPTED, SUPERSEDED, PENALTY_WAIVED}"
      - name: accepted_by_user_id
        type: string
        source: computed
        description: Opaque operator id that accepted this report; null when auto-accepted by the close run.
        default: null
      - name: review_note
        type: string
        source: computed
        description: Auditor note from the last review decision; null before review.
        default: null
      - name: assessed_penalty_points
        type: integer
        source: computed
        description: Points assessed against the facility for this period per calculations.reporting_penalty_assessment.
        default: 0
      - name: waiver_reason
        type: string
        source: computed
        description: Reason recorded when the penalty was waived; null otherwise.
        default: null

# =============================================================================
# §1.2 State Machine Table
# Infant carries TWO parallel dimensions on the same row (screening_status,
# intervention_status) that advance independently; FollowUpEpisode is cyclic;
# DiagnosticEvaluation and FacilityReport branch with divergent side-effect sets.
# =============================================================================

state_machines:
  - entity: Infant
    state_field: screening_status
    initial_state: NOT_SCREENED
    terminal_states: [DIAGNOSED_NO_LOSS]
    transitions:
      - from: NOT_SCREENED
        to: PASSED
        trigger: "POST /screening-encounters with encounter_type IN {BIRTH_ADMISSION, HOME_VISIT} and computed overall_result == PASS"
        actor: FacilityScreener
        preconditions:
          - "Facility[encounter.facility_id].reporting_compliance_status != SUSPENDED"
          - "infant.screening_status == NOT_SCREENED"
        side_effects:
          - "recompute infant.ltf_risk_score and infant.priority_band (calculations.ltf_risk_score)"
          - "if an INITIAL_SCREEN episode of this infant is in {PENDING_SCHEDULING, SCHEDULED}, that episode -> RESOLVED_PASS with closure_reason RESCREEN_PASSED (cascade link 2)"
          - "because that episode closed, any BOOKED RescreenAppointment on it -> CANCELLED and its slot.booked_count decrements (cascade link 3)"
      - from: NOT_SCREENED
        to: REFERRED
        trigger: "POST /screening-encounters with encounter_type IN {BIRTH_ADMISSION, HOME_VISIT} and computed overall_result IN {REFER, INCOMPLETE}"
        actor: FacilityScreener
        preconditions:
          - "Facility[encounter.facility_id].reporting_compliance_status != SUSPENDED"
        side_effects:
          - "CASCADE C3 link 2: infant.screening_status -> REFERRED"
          - "CASCADE C3 link 3: because screening_status became REFERRED and no episode of this infant is in {PENDING_SCHEDULING, SCHEDULED, ESCALATED_DIAGNOSTIC}, the system creates FollowUpEpisode(episode_type RESCREEN, status PENDING_SCHEDULING, benchmark_days 30, due_date = birth_datetime + 30 days, owner_scope FACILITY)"
          - "CASCADE C3 link 4: because that episode now exists, infant.ltf_risk_score is recomputed with its age_pressure term and infant.priority_band is rewritten"
          - "CASCADE C3 link 5: because priority_band became CRITICAL (and only then), the system creates NavigationTask(task_type OUTREACH_CALL, episode_id = the new episode) assigning it through the navigator selector"
          - "increments infant.version by 1"
      - from: REFERRED
        to: PASSED
        trigger: "POST /screening-encounters with encounter_type == OUTPATIENT_RESCREEN and computed overall_result == PASS"
        actor: FacilityScreener
        preconditions:
          - "the encounter's episode_id names a FollowUpEpisode of this infant with status == SCHEDULED"
          - "Facility[encounter.facility_id].reporting_compliance_status != SUSPENDED"
        side_effects:
          - "the named episode -> RESOLVED_PASS with closure_reason RESCREEN_PASSED, timeliness_status per calculations.milestone_timeliness_status"
          - "the encounter's appointment_id appointment -> ATTENDED; slot.booked_count unchanged (ATTENDED still occupies capacity)"
          - "recompute infant.ltf_risk_score and infant.priority_band"
      - from: REFERRED
        to: DIAGNOSTIC_IN_PROGRESS
        trigger: "POST /follow-up-episodes with episode_type == DIAGNOSTIC for this infant"
        actor: Navigator
        preconditions:
          - "infant.screening_status == REFERRED"
          - "expected_infant_version matches infant.version"
        side_effects:
          - "any episode of this infant in {PENDING_SCHEDULING, SCHEDULED} named by supersedes_episode_id -> SUPERSEDED with closure_reason SUPERSEDED"
          - "the new DIAGNOSTIC episode is created with benchmark_days 90 and due_date = birth_datetime + 90 days"
          - "recompute infant.ltf_risk_score and infant.priority_band"
          - "increments infant.version by 1"
      - from: DIAGNOSTIC_IN_PROGRESS
        to: DIAGNOSED_LOSS
        trigger: "POST /diagnostic-evaluations/{id}/finalize on an ATTESTED evaluation whose outcome IN {UNILATERAL_LOSS, BILATERAL_LOSS}"
        actor: Audiologist
        preconditions:
          - "evaluation.status == ATTESTED"
          - "infant.screening_status == DIAGNOSTIC_IN_PROGRESS"
        side_effects:
          - "CASCADE C1: see state_machines.DiagnosticEvaluation.ATTESTED_to_FINALIZED_LOSS for the full 5-link chain"
      - from: DIAGNOSTIC_IN_PROGRESS
        to: DIAGNOSED_NO_LOSS
        trigger: "POST /diagnostic-evaluations/{id}/finalize on an ATTESTED evaluation whose outcome == NO_LOSS"
        actor: Audiologist
        preconditions:
          - "evaluation.status == ATTESTED"
          - "infant.screening_status == DIAGNOSTIC_IN_PROGRESS"
        side_effects:
          - "the linked episode -> RESOLVED_NO_LOSS with closure_reason DIAGNOSIS_NO_LOSS"
          - "intervention_status stays NOT_APPLICABLE (no EI referral is minted on this branch)"
          - "recompute infant.ltf_risk_score and infant.priority_band"
      - from: REFERRED
        to: LOST_TO_FOLLOW_UP
        trigger: "POST /reporting-periods/{id}/close (system) when the infant's active episode is moved to LOST_TO_FOLLOW_UP"
        actor: system
        preconditions:
          - "the infant has an episode with status == PENDING_SCHEDULING whose effective age exceeds benchmark_days + 45 and whose attempt_count >= 3"
        side_effects:
          - "CASCADE C2 alternate link: episode -> LOST_TO_FOLLOW_UP causes infant.screening_status -> LOST_TO_FOLLOW_UP"
          - "recompute infant.ltf_risk_score and infant.priority_band"
      - from: LOST_TO_FOLLOW_UP
        to: REFERRED
        trigger: "POST /navigation-tasks/{id}/close with disposition COMPLETED and outcome FAMILY_REENGAGED"
        actor: Navigator
        preconditions:
          - "the task's infant has an episode with status == LOST_TO_FOLLOW_UP"
        side_effects:
          - "CASCADE C4 link 2: the LOST_TO_FOLLOW_UP episode -> PENDING_SCHEDULING, closure_reason cleared to null, closed_at cleared to null"
          - "CASCADE C4 link 3: because the episode left LOST_TO_FOLLOW_UP, infant.screening_status -> REFERRED and infant.reengagement_count increments by 1"
          - "CASCADE C4 link 4: because reengagement changed the infant, ltf_risk_score and priority_band are recomputed (an active navigation task now applies the -8 relief term)"
        note: "This is the cyclic edge of dimension A — an infant may be lost and re-engaged repeatedly."

  - entity: Infant
    state_field: intervention_status
    initial_state: NOT_APPLICABLE
    terminal_states: [ENROLLED]
    transitions:
      - from: NOT_APPLICABLE
        to: REFERRAL_DUE
        trigger: "POST /diagnostic-evaluations/{id}/finalize with outcome IN {UNILATERAL_LOSS, BILATERAL_LOSS} (system link of CASCADE C1)"
        actor: system
        preconditions:
          - "the linked episode reached RESOLVED_DIAGNOSED in the same cascade"
        side_effects:
          - "CASCADE C1 link 4 follows immediately: the EarlyInterventionReferral row is minted"
      - from: REFERRAL_DUE
        to: REFERRED
        trigger: "system creation of the EarlyInterventionReferral row inside CASCADE C1"
        actor: system
        preconditions:
          - "infant.intervention_status == REFERRAL_DUE"
        side_effects:
          - "EarlyInterventionReferral(status PENDING, referred_at = clock) is created with ei_program_facility_id from calculations.ei_program_selector"
          - "CASCADE C1 link 5: because the referral now exists, NavigationTask(task_type EI_LINKAGE) is created and assigned by the navigator selector"
      - from: REFERRED
        to: ENROLLED
        trigger: "POST /ei-referrals/{id}/enroll"
        actor: EICoordinator
        preconditions:
          - "referral.status == ACCEPTED"
          - "the referral's diagnostic_evaluation_id row has status == FINALIZED_LOSS"
        side_effects:
          - "referral.status -> ENROLLED, enrollment_age_days and ei_timeliness_status written (180-day benchmark, applied basis)"
          - "any OPEN NavigationTask with task_type EI_LINKAGE for this infant -> COMPLETED with outcome LINKED, releasing nothing (COMPLETED tasks keep their units_reserved)"
          - "recompute infant.ltf_risk_score and infant.priority_band"
      - from: REFERRED
        to: DECLINED
        trigger: "POST /ei-referrals/{id}/decision with decision == FAMILY_DECLINED"
        actor: Navigator
        preconditions:
          - "referral.status IN {PENDING, ACCEPTED}"
        side_effects:
          - "referral.status -> DECLINED_BY_FAMILY with resolution_reason recorded"
          - "any OPEN NavigationTask with task_type EI_LINKAGE for this infant -> CANCELLED, releasing its units_reserved back to funding_facility.navigation_budget_units_remaining"
      - from: REFERRED
        to: REFERRAL_DUE
        trigger: "POST /ei-referrals/{id}/decision with decision == REJECT"
        actor: EICoordinator
        preconditions:
          - "referral.status == PENDING"
          - "X-User-ID is a Provider with provider_type EI_COORDINATOR whose facility_id == referral.ei_program_facility_id"
        side_effects:
          - "referral.status -> REJECTED_BY_PROGRAM with resolution_reason recorded"
          - "because the referral was rejected, infant.intervention_status returns to REFERRAL_DUE"
          - "because intervention_status returned to REFERRAL_DUE, the system mints a replacement EarlyInterventionReferral (status PENDING) for the same diagnostic_evaluation_id, re-running calculations.ei_program_selector with the rejecting facility EXCLUDED from the candidate pool; when the post-exclusion pool is empty the replacement is created with ei_program_facility_id == null"
          - "because the replacement referral now exists, infant.intervention_status -> REFERRED again (the completing half of the dimension-B cycle)"
        note: "Cyclic edge of dimension B — REFERRED -> REFERRAL_DUE -> REFERRED inside one request, with selector exclusion on retry."

  - entity: FollowUpEpisode
    initial_state: PENDING_SCHEDULING
    terminal_states: [RESOLVED_PASS, RESOLVED_DIAGNOSED, RESOLVED_NO_LOSS, CLOSED_DECLINED, SUPERSEDED]
    transitions:
      - from: PENDING_SCHEDULING
        to: SCHEDULED
        trigger: "POST /rescreen-appointments"
        actor: Navigator
        preconditions:
          - "episode.status == PENDING_SCHEDULING"
          - "ClinicSlot[slot_id].status == OPEN"
          - "ClinicSlot[slot_id].slot_type == RESCREEN when episode_type IN {INITIAL_SCREEN, RESCREEN}, DIAGNOSTIC when episode_type == DIAGNOSTIC"
          - "ClinicSlot[slot_id].starts_at > logical clock"
          - "no other RescreenAppointment of this infant with status IN {BOOKED, ATTENDED} has a slot whose starts_at is strictly within 24 hours of this slot's starts_at"
          - "episode.attempt_count < 3"
        side_effects:
          - "RescreenAppointment(status BOOKED) is created and infant_id is copied from the episode"
          - "because the appointment was created, slot.booked_count increments by 1 and slot.remaining_capacity / slot.status are re-derived"
          - "because the appointment was created with interpreter_needed == true, a NavigationTask(task_type INTERPRETER_SESSION, episode_id = this episode) is created, its units_reserved are debited from Facility[infant.birth_facility_id].navigation_budget_units_remaining, and its id is written to appointment.linked_navigation_task_id"
          - "episode.attempt_count is re-derived and episode.status -> SCHEDULED"
          - "recompute infant.ltf_risk_score and infant.priority_band"
      - from: SCHEDULED
        to: PENDING_SCHEDULING
        trigger: "POST /rescreen-appointments/{id}/close with disposition IN {NO_SHOW, CANCELLED}"
        actor: Navigator
        preconditions:
          - "appointment.status == BOOKED"
          - "episode.status == SCHEDULED"
        side_effects:
          - "appointment -> NO_SHOW or CANCELLED with disposition_reason recorded"
          - "because the appointment left BOOKED, slot.booked_count decrements by 1 and slot.status is re-derived (a NO_SHOW also releases the capacity)"
          - "because the appointment left BOOKED, any linked_navigation_task_id task in status IN {UNASSIGNED, OPEN} -> CANCELLED and its units_reserved are credited back to the funding facility"
          - "on NO_SHOW only: infant.missed_appointment_count is re-derived (+1) and ltf_risk_score / priority_band are recomputed with the +6-per-no-show term"
          - "episode.status -> PENDING_SCHEDULING (attempt_count keeps counting NO_SHOW attempts but not CANCELLED ones)"
        note: "Cyclic edge — an episode may loop SCHEDULED -> PENDING_SCHEDULING -> SCHEDULED up to 3 counted attempts."
      - from: SCHEDULED
        to: RESOLVED_PASS
        trigger: "POST /screening-encounters with episode_id set and computed overall_result == PASS"
        actor: FacilityScreener
        preconditions:
          - "episode.status == SCHEDULED"
          - "the encounter's appointment_id names a BOOKED appointment on this episode"
        side_effects:
          - "appointment -> ATTENDED"
          - "episode.timeliness_status is written per calculations.milestone_timeliness_status, closure_reason RESCREEN_PASSED, closed_at = clock"
          - "infant.screening_status -> PASSED"
          - "recompute infant.ltf_risk_score and infant.priority_band"
      - from: SCHEDULED
        to: ESCALATED_DIAGNOSTIC
        trigger: "POST /screening-encounters with episode_id set and computed overall_result IN {REFER, INCOMPLETE} on a RESCREEN episode"
        actor: FacilityScreener
        preconditions:
          - "episode.status == SCHEDULED and episode.episode_type IN {INITIAL_SCREEN, RESCREEN}"
          - "the encounter's appointment_id names a BOOKED appointment on this episode"
        side_effects:
          - "appointment -> ATTENDED"
          - "episode.episode_type is NOT mutated; episode.status -> ESCALATED_DIAGNOSTIC, benchmark_days stays 30 for this episode's own timeliness"
          - "because the rescreen referred, infant.screening_status -> DIAGNOSTIC_IN_PROGRESS"
          - "recompute infant.ltf_risk_score and infant.priority_band"
        note: "The escalated episode is the one a DiagnosticEvaluation attaches to; a separate DIAGNOSTIC episode is only created when the diagnostic pathway is entered directly from a birth-admission REFER."
      - from: ESCALATED_DIAGNOSTIC
        to: RESOLVED_DIAGNOSED
        trigger: "POST /diagnostic-evaluations/{id}/finalize with outcome IN {UNILATERAL_LOSS, BILATERAL_LOSS}"
        actor: Audiologist
        preconditions:
          - "episode.status IN {ESCALATED_DIAGNOSTIC, SCHEDULED, PENDING_SCHEDULING} and the evaluation's episode_id names this episode"
          - "evaluation.status == ATTESTED"
        side_effects:
          - "CASCADE C1 link 2: episode -> RESOLVED_DIAGNOSED, closure_reason DIAGNOSIS_CONFIRMED, closed_at = clock, timeliness_status written"
          - "any BOOKED appointment on this episode -> CANCELLED, releasing slot capacity"
      - from: ESCALATED_DIAGNOSTIC
        to: RESOLVED_NO_LOSS
        trigger: "POST /diagnostic-evaluations/{id}/finalize with outcome == NO_LOSS"
        actor: Audiologist
        preconditions:
          - "the evaluation's episode_id names this episode and evaluation.status == ATTESTED"
        side_effects:
          - "episode -> RESOLVED_NO_LOSS, closure_reason DIAGNOSIS_NO_LOSS, closed_at = clock, timeliness_status written"
          - "infant.screening_status -> DIAGNOSED_NO_LOSS; intervention_status untouched"
      - from: PENDING_SCHEDULING
        to: LOST_TO_FOLLOW_UP
        trigger: "POST /reporting-periods/{id}/close (system)"
        actor: system
        preconditions:
          - "episode.status == PENDING_SCHEDULING"
          - "effective_age_days (calculations.infant_age_basis) > episode.benchmark_days + 45"
          - "episode.attempt_count >= 3"
        side_effects:
          - "episode -> LOST_TO_FOLLOW_UP, closure_reason LOST_TO_FOLLOW_UP, closed_at = clock, timeliness_status OVERDUE"
          - "because the episode was lost, infant.screening_status -> LOST_TO_FOLLOW_UP and risk/band are recomputed"
          - "period.episodes_lost_count increments by 1"
      - from: LOST_TO_FOLLOW_UP
        to: PENDING_SCHEDULING
        trigger: "POST /navigation-tasks/{id}/close with disposition COMPLETED and outcome FAMILY_REENGAGED"
        actor: Navigator
        preconditions:
          - "episode.status == LOST_TO_FOLLOW_UP and the task's infant_id == episode.infant_id"
        side_effects:
          - "CASCADE C4 link 2: episode -> PENDING_SCHEDULING with closure_reason and closed_at cleared to null; escalation_flag and owner_scope are preserved"
          - "CASCADE C4 link 3: infant.screening_status -> REFERRED, infant.reengagement_count += 1"
          - "CASCADE C4 link 4: infant.ltf_risk_score and priority_band recomputed"
        note: "Second cyclic edge of the episode machine."
      - from: PENDING_SCHEDULING
        to: CLOSED_DECLINED
        trigger: "POST /follow-up-episodes/{id}/close"
        actor: Navigator
        preconditions:
          - "episode.status IN {PENDING_SCHEDULING, SCHEDULED}"
          - "closure_reason IN {FAMILY_DECLINED, MOVED_OUT_OF_STATE}"
        side_effects:
          - "episode -> CLOSED_DECLINED with the supplied closure_reason and closed_at = clock"
          - "any BOOKED appointment on this episode -> CANCELLED, releasing slot capacity, and its linked interpreter task -> CANCELLED, releasing its units"
          - "recompute infant.ltf_risk_score and infant.priority_band"
      - from: PENDING_SCHEDULING
        to: SUPERSEDED
        trigger: "POST /follow-up-episodes naming this episode in supersedes_episode_id"
        actor: Navigator
        preconditions:
          - "episode.status IN {PENDING_SCHEDULING, SCHEDULED}"
          - "expected_infant_version matches Infant.version (see concurrency_rules.episode-create-stale-infant)"
        side_effects:
          - "episode -> SUPERSEDED with closure_reason SUPERSEDED and closed_at = clock"
          - "any BOOKED appointment on the superseded episode -> CANCELLED, releasing slot capacity"
          - "increments Infant.version by 1"

  - entity: RescreenAppointment
    initial_state: BOOKED
    terminal_states: [ATTENDED, NO_SHOW, CANCELLED]
    transitions:
      - from: BOOKED
        to: ATTENDED
        trigger: "POST /screening-encounters with appointment_id naming this appointment"
        actor: FacilityScreener
        preconditions:
          - "appointment.status == BOOKED"
          - "the encounter's episode_id == appointment.episode_id"
        side_effects:
          - "appointment -> ATTENDED; slot.booked_count is unchanged because ATTENDED still occupies capacity"
          - "episode advances to RESOLVED_PASS or ESCALATED_DIAGNOSTIC per the encounter result"
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /rescreen-appointments/{id}/close with disposition == NO_SHOW"
        actor: Navigator
        preconditions:
          - "appointment.status == BOOKED"
          - "ClinicSlot[appointment.slot_id].starts_at <= logical clock"
        side_effects:
          - "slot.booked_count decrements by 1, remaining_capacity and status re-derived"
          - "infant.missed_appointment_count re-derived; ltf_risk_score / priority_band recomputed"
          - "linked interpreter NavigationTask (if any, status IN {UNASSIGNED, OPEN}) -> CANCELLED with its units released"
          - "episode -> PENDING_SCHEDULING"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /rescreen-appointments/{id}/close with disposition == CANCELLED, or a cascade that closes the parent episode"
        actor: Navigator
        preconditions:
          - "appointment.status == BOOKED"
        side_effects:
          - "slot.booked_count decrements by 1, remaining_capacity and status re-derived (capacity conservation invariant)"
          - "linked interpreter NavigationTask (if any, status IN {UNASSIGNED, OPEN}) -> CANCELLED with its units credited back to funding_facility.navigation_budget_units_remaining"
          - "episode -> PENDING_SCHEDULING when the cancel was operator-initiated; the episode keeps its cascade-assigned state when the cancel came from an episode closure"

  - entity: DiagnosticEvaluation
    initial_state: DRAFT
    terminal_states: [FINALIZED_LOSS, FINALIZED_NO_LOSS]
    transitions:
      - from: DRAFT
        to: PENDING_ATTESTATION
        trigger: "POST /diagnostic-evaluations/{id}/submit"
        actor: Audiologist
        preconditions:
          - "evaluation.status == DRAFT"
          - "Infant[evaluation.infant_id].guardian_consent_status != REFUSED"
          - "Infant[evaluation.infant_id].screening_status IN {REFERRED, DIAGNOSTIC_IN_PROGRESS}"
          - "Provider[performed_by_provider_id].credential_status == ACTIVE"
          - "outcome agrees with the thresholds: NO_LOSS requires both thresholds <= 25 dB; UNILATERAL_LOSS requires exactly one threshold > 25 dB; BILATERAL_LOSS requires both thresholds > 25 dB"
        side_effects:
          - "thresholds and outcome are stored; status -> PENDING_ATTESTATION"
      - from: PENDING_ATTESTATION
        to: ATTESTED
        trigger: "POST /diagnostic-evaluations/{id}/attest with decision == ACCEPT"
        actor: Audiologist
        preconditions:
          - "evaluation.status == PENDING_ATTESTATION"
          - "X-User-ID names a Provider with provider_type AUDIOLOGIST and credential_status ACTIVE"
          - "X-User-ID != evaluation.performed_by_provider_id (segregation of duties)"
        side_effects:
          - "attested_by_provider_id = X-User-ID, attestation_note stored, status -> ATTESTED"
      - from: PENDING_ATTESTATION
        to: DRAFT
        trigger: "POST /diagnostic-evaluations/{id}/attest with decision == RETURN"
        actor: Audiologist
        preconditions:
          - "evaluation.status == PENDING_ATTESTATION"
          - "X-User-ID != evaluation.performed_by_provider_id"
        side_effects:
          - "thresholds and outcome are cleared to null, attestation_note stored, status -> DRAFT"
        note: "Revision loop — the evaluation can be resubmitted after correction."
      - from: ATTESTED
        to: FINALIZED_LOSS
        trigger: "POST /diagnostic-evaluations/{id}/finalize when outcome IN {UNILATERAL_LOSS, BILATERAL_LOSS}"
        actor: Audiologist
        preconditions:
          - "evaluation.status == ATTESTED"
          - "Facility[evaluation.facility_id].reporting_compliance_status != SUSPENDED"
        side_effects:
          - "CASCADE C1 link 1: status -> FINALIZED_LOSS, finalized_at = clock, age_days_at_finalize, timeliness_status (applied basis) and timeliness_status_chronological_basis (variant) written"
          - "CASCADE C1 link 2: because the evaluation reached FINALIZED_LOSS, its episode -> RESOLVED_DIAGNOSED (closure_reason DIAGNOSIS_CONFIRMED)"
          - "CASCADE C1 link 3: because that episode resolved, infant.screening_status -> DIAGNOSED_LOSS and infant.intervention_status -> REFERRAL_DUE"
          - "CASCADE C1 link 4: because intervention_status became REFERRAL_DUE, an EarlyInterventionReferral(status PENDING) is minted with ei_program_facility_id from calculations.ei_program_selector, and intervention_status -> REFERRED"
          - "CASCADE C1 link 5: because the referral row now exists, a NavigationTask(task_type EI_LINKAGE) is created, assigned through calculations.navigator_selector, and its units_reserved debited from Facility[infant.birth_facility_id]"
          - "CASCADE C1 link 6: because that task now exists, infant.ltf_risk_score is recomputed with the -8 navigation-relief term and priority_band rewritten"
      - from: ATTESTED
        to: FINALIZED_NO_LOSS
        trigger: "POST /diagnostic-evaluations/{id}/finalize when outcome == NO_LOSS"
        actor: Audiologist
        preconditions:
          - "evaluation.status == ATTESTED"
          - "Facility[evaluation.facility_id].reporting_compliance_status != SUSPENDED"
        side_effects:
          - "status -> FINALIZED_NO_LOSS, finalized_at, age_days_at_finalize and both timeliness variants written"
          - "the linked episode -> RESOLVED_NO_LOSS (closure_reason DIAGNOSIS_NO_LOSS)"
          - "infant.screening_status -> DIAGNOSED_NO_LOSS; intervention_status stays NOT_APPLICABLE and NO referral or EI_LINKAGE task is created — the divergent half of the fork"
          - "recompute infant.ltf_risk_score and priority_band"
        note: "Branch pair with ATTESTED_to_FINALIZED_LOSS: identical trigger endpoint, disjoint side-effect sets."

  - entity: EarlyInterventionReferral
    initial_state: PENDING
    terminal_states: [ENROLLED, DECLINED_BY_FAMILY, REJECTED_BY_PROGRAM]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /ei-referrals/{id}/decision with decision == ACCEPT"
        actor: EICoordinator
        preconditions:
          - "referral.status == PENDING"
          - "referral.ei_program_facility_id is not null"
          - "X-User-ID names a Provider with provider_type EI_COORDINATOR whose facility_id == referral.ei_program_facility_id"
        side_effects:
          - "status -> ACCEPTED, accepted_at = clock"
      - from: PENDING
        to: REJECTED_BY_PROGRAM
        trigger: "POST /ei-referrals/{id}/decision with decision == REJECT"
        actor: EICoordinator
        preconditions:
          - "referral.status == PENDING"
          - "X-User-ID names a Provider with provider_type EI_COORDINATOR whose facility_id == referral.ei_program_facility_id"
        side_effects:
          - "status -> REJECTED_BY_PROGRAM with resolution_reason recorded"
          - "the dimension-B cycle on Infant runs: intervention_status -> REFERRAL_DUE, a replacement referral is minted with this program excluded from the selector pool, then intervention_status -> REFERRED"
      - from: ACCEPTED
        to: ENROLLED
        trigger: "POST /ei-referrals/{id}/enroll"
        actor: EICoordinator
        preconditions:
          - "referral.status == ACCEPTED"
          - "DiagnosticEvaluation[referral.diagnostic_evaluation_id].status == FINALIZED_LOSS"
          - "ifsp_date >= referral.referred_at and ifsp_date <= logical clock"
        side_effects:
          - "status -> ENROLLED; enrollment_age_days and ei_timeliness_status written against the 180-day benchmark under the applied age basis"
          - "infant.intervention_status -> ENROLLED"
          - "any OPEN EI_LINKAGE NavigationTask for this infant -> COMPLETED with outcome LINKED (units stay reserved because COMPLETED work is consumed, not released)"
      - from: PENDING
        to: DECLINED_BY_FAMILY
        trigger: "POST /ei-referrals/{id}/decision with decision == FAMILY_DECLINED"
        actor: Navigator
        preconditions:
          - "referral.status IN {PENDING, ACCEPTED}"
        side_effects:
          - "status -> DECLINED_BY_FAMILY with resolution_reason recorded"
          - "infant.intervention_status -> DECLINED"
          - "any NavigationTask with task_type EI_LINKAGE for this infant in status IN {UNASSIGNED, OPEN} -> CANCELLED, crediting its units_reserved back to funding_facility.navigation_budget_units_remaining"
      - from: ACCEPTED
        to: DECLINED_BY_FAMILY
        trigger: "POST /ei-referrals/{id}/decision with decision == FAMILY_DECLINED"
        actor: Navigator
        preconditions:
          - "referral.status == ACCEPTED"
        side_effects:
          - "same side-effect set as the PENDING -> DECLINED_BY_FAMILY edge"

  - entity: NavigationTask
    initial_state: UNASSIGNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: UNASSIGNED
        to: OPEN
        trigger: "POST /navigation-tasks with assigned_provider_id or auto_assign true, POST /navigation-tasks/{id}/assign, or a cascade that mints an auto-assigned task"
        actor: Navigator
        preconditions:
          - "task.status == UNASSIGNED"
          - "the chosen Provider has provider_type NAVIGATOR, credential_status ACTIVE, region_code == Facility[infant.birth_facility_id].region_code, open_task_count < max_open_tasks, and (infant.interpreter_required == false OR infant.preferred_language IN provider.languages)"
        side_effects:
          - "assigned_provider_id written; status -> OPEN; Provider.open_task_count re-derived (+1)"
          - "recompute infant.ltf_risk_score and priority_band (an OPEN task keeps the -8 relief term)"
      - from: OPEN
        to: COMPLETED
        trigger: "POST /navigation-tasks/{id}/close with disposition == COMPLETED"
        actor: Navigator
        preconditions:
          - "task.status == OPEN"
          - "outcome is supplied and contacted_language is supplied when outcome IN {CONTACTED, FAMILY_REENGAGED, INTERPRETER_PROVIDED}"
        side_effects:
          - "status -> COMPLETED with outcome and contacted_language recorded; units_reserved are NOT released (consumed work)"
          - "Provider.open_task_count re-derived (-1)"
          - "when outcome == FAMILY_REENGAGED, CASCADE C4 runs: the infant's LOST_TO_FOLLOW_UP episode -> PENDING_SCHEDULING, then infant.screening_status -> REFERRED with reengagement_count += 1, then risk/band recomputed"
      - from: UNASSIGNED
        to: CANCELLED
        trigger: "POST /navigation-tasks/{id}/close with disposition == CANCELLED, or a cascade that cancels the parent appointment/referral"
        actor: Navigator
        preconditions:
          - "task.status == UNASSIGNED"
        side_effects:
          - "status -> CANCELLED with closure_note; units_reserved credited back to Facility[funding_facility_id].navigation_budget_units_remaining (budget conservation invariant)"
          - "recompute infant.ltf_risk_score and priority_band (relief term drops once no non-cancelled task remains)"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /navigation-tasks/{id}/close with disposition == CANCELLED, or a cascade that cancels the parent appointment/referral"
        actor: Navigator
        preconditions:
          - "task.status == OPEN"
        side_effects:
          - "status -> CANCELLED with closure_note; units_reserved credited back to the funding facility"
          - "Provider.open_task_count re-derived (-1)"
          - "recompute infant.ltf_risk_score and priority_band"

  - entity: RiskFactorEntry
    initial_state: ACTIVE
    terminal_states: [CLEARED, LOSS_IDENTIFIED]
    transitions:
      - from: ACTIVE
        to: SURVEILLANCE_DUE
        trigger: "POST /reporting-periods/{id}/close (system)"
        actor: system
        preconditions:
          - "entry.status == ACTIVE"
          - "logical clock >= surveillance_due_date - 30 days AND logical clock <= surveillance_due_date"
        side_effects:
          - "status -> SURVEILLANCE_DUE; infant.risk_factor_count is unchanged (both statuses count) so no risk recompute is required"
      - from: SURVEILLANCE_DUE
        to: SURVEILLANCE_OVERDUE
        trigger: "POST /reporting-periods/{id}/close (system)"
        actor: system
        preconditions:
          - "entry.status == SURVEILLANCE_DUE"
          - "logical clock > surveillance_due_date"
        side_effects:
          - "status -> SURVEILLANCE_OVERDUE"
      - from: ACTIVE
        to: SURVEILLANCE_OVERDUE
        trigger: "POST /reporting-periods/{id}/close (system) when the due date was already passed at the first close that observed the entry"
        actor: system
        preconditions:
          - "entry.status == ACTIVE"
          - "logical clock > surveillance_due_date"
        side_effects:
          - "status -> SURVEILLANCE_OVERDUE"
      - from: SURVEILLANCE_DUE
        to: CLEARED
        trigger: "POST /screening-encounters with encounter_type == SURVEILLANCE and computed overall_result == PASS"
        actor: Audiologist
        preconditions:
          - "entry.status IN {ACTIVE, SURVEILLANCE_DUE, SURVEILLANCE_OVERDUE}"
          - "the encounter's infant_id == entry.infant_id"
        side_effects:
          - "every open entry of this infant -> CLEARED with surveillance_result PASS and surveillance_recorded_at = clock"
          - "because risk_factor_count dropped, infant.ltf_risk_score and priority_band are recomputed"
      - from: SURVEILLANCE_OVERDUE
        to: LOSS_IDENTIFIED
        trigger: "POST /screening-encounters with encounter_type == SURVEILLANCE and computed overall_result IN {REFER, INCOMPLETE}"
        actor: Audiologist
        preconditions:
          - "entry.status IN {ACTIVE, SURVEILLANCE_DUE, SURVEILLANCE_OVERDUE}"
          - "the encounter's infant_id == entry.infant_id"
        side_effects:
          - "every open entry of this infant -> LOSS_IDENTIFIED with surveillance_result REFER"
          - "because a delayed-onset REFER was recorded, infant.screening_status -> REFERRED (from PASSED, DIAGNOSED_NO_LOSS or LOST_TO_FOLLOW_UP) and a new FollowUpEpisode(episode_type DIAGNOSTIC) is created in PENDING_SCHEDULING"
          - "recompute infant.ltf_risk_score and priority_band"

  - entity: FacilityReport
    initial_state: SUBMITTED
    terminal_states: [SUPERSEDED, PENALTY_WAIVED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /facility-reports/{id}/review with decision == ACCEPT, or POST /reporting-periods/{id}/close auto-accepting an unreviewed report"
        actor: ProgramAuditor
        preconditions:
          - "report.status IN {SUBMITTED, RETURNED_FOR_CORRECTION}"
          - "ReportingPeriod[report.reporting_period_id].status == OPEN when the actor is a ProgramAuditor"
        side_effects:
          - "status -> ACCEPTED; accepted_by_user_id = X-User-ID for an auditor review, null for a close-run auto-accept; review_note stored"
          - "actual_screened_count, actual_refer_count and variance_case_count are recomputed from the period window"
      - from: SUBMITTED
        to: RETURNED_FOR_CORRECTION
        trigger: "POST /facility-reports/{id}/review with decision == RETURN"
        actor: ProgramAuditor
        preconditions:
          - "report.status == SUBMITTED"
          - "ReportingPeriod[report.reporting_period_id].status == OPEN"
        side_effects:
          - "status -> RETURNED_FOR_CORRECTION with review_note stored; no penalty is assessed at review time"
        note: "Divergent branch of the same trigger endpoint — ACCEPT freezes the counts, RETURN keeps the filing open for a superseding correction."
      - from: RETURNED_FOR_CORRECTION
        to: SUPERSEDED
        trigger: "POST /facility-reports naming this report in supersedes_report_id"
        actor: FacilityAdmin
        preconditions:
          - "report.status IN {SUBMITTED, RETURNED_FOR_CORRECTION}"
          - "expected_facility_version matches Facility.version (see concurrency_rules.report-submit-stale-facility)"
        side_effects:
          - "status -> SUPERSEDED; the superseded row is excluded from the penalty assessment and from penalty_points_balance"
          - "increments Facility.version by 1"
      - from: ACCEPTED
        to: PENALTY_WAIVED
        trigger: "POST /facility-reports/{id}/waive-penalty"
        actor: ProgramAdmin
        preconditions:
          - "report.status == ACCEPTED and report.assessed_penalty_points > 0"
          - "ReportingPeriod[report.reporting_period_id].status == CLOSED"
          - "X-User-ID != report.accepted_by_user_id (segregation of duties)"
        side_effects:
          - "status -> PENALTY_WAIVED with waiver_reason stored"
          - "because the row left ACCEPTED, Facility.penalty_points_balance drops by assessed_penalty_points and reporting_compliance_status is re-derived from the new balance"
          - "increments Facility.version by 1"

  - entity: ReportingPeriod
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /reporting-periods/{id}/close"
        actor: ProgramAdmin
        preconditions:
          - "period.status == OPEN"
          - "logical clock >= period.period_end"
          - "no other ReportingPeriod whose period_end <= this period.period_start is still OPEN (periods must close in chronological order)"
        side_effects:
          - "for every Facility with facility_type IN {BIRTH_HOSPITAL, BIRTHING_CENTER, MIDWIFE_PRACTICE, AUDIOLOGY_CLINIC}, in ascending Facility.created_at order: mint an auto_generated ACCEPTED FacilityReport when no non-SUPERSEDED report exists for (facility, period); auto-accept any report still in {SUBMITTED, RETURNED_FOR_CORRECTION}; write assessed_penalty_points per calculations.reporting_penalty_assessment; update penalty_points_balance and re-derive reporting_compliance_status; write performance_score and encounter_basis_performance_score per calculations.facility_performance_score; increment facilities_assessed_count"
          - "CASCADE C2 link 2: for every facility whose posture became PROBATION or SUSPENDED in this run, every FollowUpEpisode of that facility's infants with status IN {PENDING_SCHEDULING, SCHEDULED} gets escalation_flag true and owner_scope STATE_PROGRAM; period.episodes_escalated_count increments per episode"
          - "CASCADE C2 link 3: because those episodes escalated, each affected infant's ltf_risk_score is recomputed with the +6 escalation term and priority_band rewritten"
          - "CASCADE C2 link 4: because an infant's priority_band became CRITICAL in link 3 and that infant has no NavigationTask in status IN {UNASSIGNED, OPEN}, an OUTREACH_CALL NavigationTask is minted and auto-assigned through calculations.navigator_selector"
          - "episode timeliness sweep, in ascending FollowUpEpisode.created_at order: PENDING_SCHEDULING episodes past benchmark get timeliness_status OVERDUE; those past benchmark + 45 with attempt_count >= 3 -> LOST_TO_FOLLOW_UP (cascading to infant.screening_status)"
          - "risk-registry sweep, in ascending RiskFactorEntry.created_at order: ACTIVE/SURVEILLANCE_DUE entries advance per the RiskFactorEntry machine"
          - "period.status -> CLOSED, closed_at = clock; Facility.last_closed_period_label written"
        note: "Ops-run checkpoint. Ordering is pinned by created_at ASC at every sweep so the run is deterministic; entity ids are never used as an ordering key."

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================

concurrency_rules:
  - rule_id: episode-create-stale-infant
    parent_entity: Infant
    write_endpoint: "POST /follow-up-episodes"
    occ_field: "expected_infant_version"
    description: |
      Creating a FollowUpEpisode against an Infant whose version has advanced since the client
      last read it is rejected. Episode creation legitimately supersedes the infant's currently
      open episode (supersedes_episode_id), so a second create carrying a version the server has
      already moved past would silently discard follow-up work the writer never saw.
    error_id: ERR_STALE_INFANT_VERSION
    http_status: 412
  - rule_id: report-submit-stale-facility
    parent_entity: Facility
    write_endpoint: "POST /facility-reports"
    occ_field: "expected_facility_version"
    description: |
      Submitting a FacilityReport against a Facility whose version has advanced since the client
      last read it is rejected. A corrected filing legitimately supersedes the prior report for the
      same period, so a submission built on a stale facility view (its posture, penalty balance or
      an earlier accepted report having already changed) must be refused rather than layered on.
    error_id: ERR_STALE_FACILITY_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================

calculations:
  - name: overall_screening_result
    trigger: "POST /screening-encounters — derived before any state transition fires"
    algorithm: aggregation
    formula: |
      if left_ear_result == PASS and right_ear_result == PASS: overall_result = PASS
      elif left_ear_result == NOT_TESTED and right_ear_result == NOT_TESTED: overall_result = INCOMPLETE
      else: overall_result = REFER
      # NOT_TESTED in exactly one ear is treated as REFER for that ear: a single untested ear
      # cannot certify a pass. INCOMPLETE is handled identically to REFER by every transition,
      # but is reported separately so facility dashboards can distinguish protocol failures.
    input_set: "The single encounter being created; no other rows participate."
    constants: {}
    precision: "enum output, no rounding"

  - name: infant_age_basis
    trigger: "Every read of GET /infants/{id}/timeliness and every write of a timeliness_status field (episode close, diagnostic finalize, EI enrollment, period close)"
    algorithm: threshold
    formula: |
      chronological_age_days = floor((reference_instant - infant.birth_datetime) / 86400 seconds)
      prematurity_offset_days = max(0, (40 - infant.gestational_age_weeks) * 7)
      corrected_age_days = max(0, chronological_age_days - prematurity_offset_days)
      benchmark_age_basis = CORRECTED if (infant.gestational_age_weeks < 35
                                         or infant.nicu_stay_days >= 5) else CHRONOLOGICAL
      effective_age_days = corrected_age_days if benchmark_age_basis == CORRECTED
                           else chronological_age_days
      # reference_instant is the logical clock for a live read, and the milestone instant
      # (encounter.performed_at, evaluation.finalized_at, referral.ifsp_date) for a stored status.
    input_set: "One Infant row plus the reference instant; no aggregation."
    constants:
      TERM_GESTATION_WEEKS: 40
      CORRECTED_BASIS_GA_THRESHOLD_WEEKS: 35
      CORRECTED_BASIS_NICU_DAYS: 5
    precision: "integer days, floor division on whole seconds"
    variants:
      - name: applied_basis
        when: "Every field the program treats as clinical truth — FollowUpEpisode.timeliness_status, DiagnosticEvaluation.timeliness_status, EarlyInterventionReferral.ei_timeliness_status, the loss-to-follow-up sweep at period close, and the age_pressure term of ltf_risk_score."
        difference: "Uses effective_age_days, i.e. corrected age for infants with gestational_age_weeks < 35 or nicu_stay_days >= 5, chronological age otherwise."
      - name: chronological_basis
        when: "Every field the program publishes for federal comparability — DiagnosticEvaluation.timeliness_status_chronological_basis and the *_chronological fields of GET /infants/{id}/timeliness."
        difference: "Always uses chronological_age_days, ignoring prematurity_offset_days. For a 32-week infant finalized at 130 chronological days the applied basis returns ON_TIME (74 corrected days) while this variant returns LATE — same row, two stored answers."

  - name: milestone_timeliness_status
    trigger: "Written whenever a milestone completes (episode closure, diagnostic finalize, EI enrollment) and re-evaluated for open episodes by POST /reporting-periods/{id}/close"
    algorithm: threshold
    formula: |
      benchmark_days = 30 if milestone == SCREENING            # INITIAL_SCREEN / RESCREEN episode
                       else 90 if milestone == DIAGNOSTIC      # DiagnosticEvaluation
                       else 180                                # EI enrollment
      age = effective_age_days (or chronological_age_days for the chronological variant)
             evaluated at the milestone instant
      if milestone is complete:
          ON_TIME if age <= benchmark_days
          LATE    if benchmark_days < age <= benchmark_days + 45
          LATE    if age > benchmark_days + 45      # completed, however late, is never OVERDUE
      else:
          PENDING  if age <= benchmark_days
          OVERDUE  if age > benchmark_days
      # Boundary is inclusive on the benchmark: age == 90 for a diagnostic is ON_TIME, 91 is LATE.
    input_set: "One milestone row plus its infant; the LATE_GRACE_DAYS band only distinguishes reporting tiers, never re-opens the record."
    constants:
      SCREEN_BENCHMARK_DAYS: 30
      DIAGNOSTIC_BENCHMARK_DAYS: 90
      EI_ENROLLMENT_BENCHMARK_DAYS: 180
      LATE_GRACE_DAYS: 45
    precision: "enum output over integer day comparisons"

  - name: ltf_risk_score
    trigger: "Recomputed by every transition whose side_effects say 'recompute infant.ltf_risk_score' — infant registration, encounter recording, episode create/close/escalate/lose/reengage, appointment book/no-show/cancel, navigation task create/assign/close, risk-entry create/clear, contact-preference patch, and period close"
    algorithm: weighted_scoring
    formula: |
      setting_points = SETTING_POINTS[infant.birth_setting]
      language_gap_points = 10 if (infant.interpreter_required == true and
            count(Provider WHERE provider_type == NAVIGATOR
                             AND credential_status == ACTIVE
                             AND region_code == Facility[infant.birth_facility_id].region_code
                             AND infant.preferred_language IN languages) == 0) else 0
      missed_points = min(24, 6 * infant.missed_appointment_count)
      risk_factor_points = min(16, 4 * count(RiskFactorEntry WHERE infant_id == infant.id
                               AND status IN {ACTIVE, SURVEILLANCE_DUE, SURVEILLANCE_OVERDUE}))
      active_episode = the FollowUpEpisode WHERE infant_id == infant.id
                       AND status IN {PENDING_SCHEDULING, SCHEDULED, ESCALATED_DIAGNOSTIC},
                       ordered by created_at DESC, first row (created_at ASC breaks nothing else;
                       ids are never consulted)
      if active_episode is null:
          age_pressure = 0
          escalation_points = 0
      else:
          b = active_episode.benchmark_days
          e = effective_age_days at the logical clock (calculations.infant_age_basis, applied basis)
          age_pressure = 0  if e <= b - 10
                         12 if b - 10 < e <= b
                         20 if e > b
          escalation_points = 6 if active_episode.escalation_flag == true else 0
      navigation_relief = -8 if count(NavigationTask WHERE infant_id == infant.id
                          AND status IN {UNASSIGNED, OPEN, COMPLETED}) >= 1 else 0
      raw = setting_points + language_gap_points + missed_points + risk_factor_points
            + age_pressure + escalation_points + navigation_relief
      ltf_risk_score = max(0, min(100, raw))
      priority_band = CRITICAL if ltf_risk_score >= 45
                      HIGH     if 30 <= ltf_risk_score < 45
                      ELEVATED if 15 <= ltf_risk_score < 30
                      LOW      otherwise
    input_set: >-
      One Infant plus: its NO_SHOW appointments, its open risk-registry entries, its single active
      episode (statuses pinned above), its non-CANCELLED navigation tasks, and the navigator pool
      of its birth facility's region. CANCELLED tasks and CLEARED/LOSS_IDENTIFIED registry entries
      are excluded.
    constants:
      SETTING_POINTS: { INPATIENT: 0, BIRTHING_CENTER: 8, OUT_OF_HOSPITAL: 12, HOME_BIRTH: 15 }
      LANGUAGE_GAP_POINTS: 10
      MISSED_APPT_POINTS_EACH: 6
      MISSED_APPT_CAP: 24
      RISK_FACTOR_POINTS_EACH: 4
      RISK_FACTOR_CAP: 16
      AGE_PRESSURE_LEAD_DAYS: 10
      AGE_PRESSURE_NEAR: 12
      AGE_PRESSURE_OVER: 20
      ESCALATION_POINTS: 6
      NAVIGATION_RELIEF_POINTS: -8
      BAND_CRITICAL: 45
      BAND_HIGH: 30
      BAND_ELEVATED: 15
    precision: "integer arithmetic end to end; the min/max clamp is applied once to the summed raw value, never per term"

  - name: facility_performance_score
    trigger: "POST /reporting-periods/{id}/close writes both variants onto the Facility; GET /facilities/{id}/performance reads them back alongside the component rates"
    algorithm: weighted_scoring
    formula: |
      # --- component rates, both variants share r2 and r3 -----------------------------
      # r1 differs by attribution basis (this is the dual-variant axis):
      cohort_denominator     = count(Infant WHERE birth_facility_id == F
                                     AND birth_datetime IN [period.period_start, period.period_end))
      cohort_numerator       = count(those infants having >= 1 ScreeningEncounter WHERE
                                     facility_id == F AND encounter_type == BIRTH_ADMISSION
                                     AND before_discharge == true)
      encounter_denominator  = count(DISTINCT infant_id over ScreeningEncounter WHERE facility_id == F
                                     AND encounter_type == BIRTH_ADMISSION
                                     AND performed_at IN [period.period_start, period.period_end))
      encounter_numerator    = count(DISTINCT infant_id over those same encounters
                                     WHERE before_discharge == true)
      r2_denominator = count(FollowUpEpisode WHERE Infant[infant_id].birth_facility_id == F
                             AND created_at IN [period.period_start, period.period_end))
      r2_numerator   = count(those episodes whose status at close IN
                             {RESOLVED_PASS, RESOLVED_DIAGNOSED, RESOLVED_NO_LOSS})
      r3 = 1.0 if the (F, period) FacilityReport of record has submitted_late == false
                 and auto_generated == false
           else 0.0
      # --- pinned rounding order (mode (b)) -----------------------------------------
      # Step 1: round EACH component rate to 4 decimals, ROUND_HALF_UP.
      # Step 2: multiply each rounded rate by its weight and sum the three products at full
      #         precision — the products are NOT rounded.
      # Step 3: multiply the sum by 100 and round ONCE to 2 decimals, ROUND_HALF_UP.
      # "Weight, sum, then round at the end" is the pinned order. Rounding each weighted
      # product to cents before summing is explicitly NOT used.
      r1_cohort    = round4(cohort_numerator / cohort_denominator)
      r1_encounter = round4(encounter_denominator == 0 ? null
                            : encounter_numerator / encounter_denominator)
      r2 = round4(r2_numerator / r2_denominator)
      performance_score                  = round2((0.50*r1_cohort + 0.30*r2 + 0.20*r3) * 100)
      encounter_basis_performance_score  = round2((0.50*r1_encounter + 0.30*r2 + 0.20*r3) * 100)
      # --- empty-set rule (no re-normalisation) --------------------------------------
      # If cohort_denominator == 0 then r1_cohort is null and performance_score is null.
      # If encounter_denominator == 0 then encounter_basis_performance_score is null.
      # If r2_denominator == 0 then r2 is null and BOTH scores are null.
      # A null score never moves reporting_compliance_status; only the penalty balance does.
    input_set: >-
      Infants of facility F born inside the half-open period window, that facility's
      BIRTH_ADMISSION encounters inside the window, follow-up episodes of its infants created
      inside the window (any status at close), and the single FacilityReport of record for
      (F, period) — the non-SUPERSEDED report with the latest created_at.
    constants:
      WEIGHT_SCREENED_BEFORE_DISCHARGE: 0.50
      WEIGHT_REFER_FOLLOWUP_RESOLUTION: 0.30
      WEIGHT_REPORT_TIMELINESS: 0.20
      RATE_DECIMALS: 4
      SCORE_DECIMALS: 2
    precision: "component rates 4 dp ROUND_HALF_UP; final score 2 dp ROUND_HALF_UP applied exactly once"
    variants:
      - name: cohort_basis
        when: "Facility.performance_score — the official state metric published on the facility dashboard."
        difference: "Attributes an infant to the period it was BORN in, so a baby born on the last day of the period and screened after the window still counts against the period's denominator."
      - name: encounter_basis
        when: "Facility.encounter_basis_performance_score — the reconciliation figure shown next to the official score."
        difference: "Attributes an infant to the period its BIRTH_ADMISSION screen was performed in, so a baby who is never screened (or screened after the window) leaves this period's denominator entirely instead of counting against it. For one August cohort of two infants where the second is discharged unscreened, r1_cohort is 0.5000 while r1_encounter is 1.0000 from identical rows, and with r2 = 0.0000 and r3 = 1.0 the two published scores are 45.00 and 70.00."

  - name: reporting_penalty_assessment
    trigger: "POST /reporting-periods/{id}/close, once per assessed facility, in ascending Facility.created_at order"
    algorithm: tiered_pricing
    formula: |
      report = the FacilityReport for (F, period) with status != SUPERSEDED and the latest
               created_at (auto-generated non-filing report when the facility filed nothing)
      if report.auto_generated == true:
          variance = report.actual_refer_count          # attested counts are null; every refer
                                                        # case is an unreported case
          base_points = 2 * variance + 5                # MISSING_REPORT_POINTS
      else:
          variance = report.variance_case_count
          base_points = 2 * variance + (3 if report.submitted_late else 0)
      carryover_points = F.penalty_points_balance observed BEFORE this assessment writes
      # --- pinned evaluation order (mode (c)) ----------------------------------------
      # The surcharge tier is keyed on the PRE-surcharge total (base + carryover), while the
      # surcharge itself multiplies base_points ONLY, and the product is rounded exactly once.
      # Reading the tier off the post-surcharge total, or applying the surcharge to the
      # carryover as well, are both explicitly NOT the rule.
      tier_input = base_points + carryover_points
      surcharge_pct = 0.00 if tier_input <= 4
                      0.25 if 5 <= tier_input <= 9
                      0.50 if tier_input >= 10
      assessed_penalty_points = round_half_up(base_points * (1 + surcharge_pct))   # integer
      report.assessed_penalty_points = assessed_penalty_points
      F.penalty_points_balance = carryover_points + assessed_penalty_points
      reporting_compliance_status = COMPLIANT if balance <= 4
                                    WATCH     if 5 <= balance <= 9
                                    PROBATION if 10 <= balance <= 17
                                    SUSPENDED if balance >= 18
    input_set: >-
      One facility, one period, and the single non-SUPERSEDED FacilityReport of record for that
      pair. PENALTY_WAIVED rows from earlier periods are already out of penalty_points_balance and
      therefore out of carryover_points.
    constants:
      VARIANCE_POINTS_PER_CASE: 2
      MISSING_REPORT_POINTS: 5
      LATE_REPORT_POINTS: 3
      SURCHARGE_TIER1_MAX: 4
      SURCHARGE_TIER2_MAX: 9
      SURCHARGE_TIER2_PCT: 0.25
      SURCHARGE_TIER3_PCT: 0.50
      POSTURE_COMPLIANT_MAX: 4
      POSTURE_WATCH_MAX: 9
      POSTURE_PROBATION_MAX: 17
    precision: "points are integers; the single round_half_up is applied to base_points * (1 + surcharge_pct)"

  - name: navigation_units_cost
    trigger: "Creation of any NavigationTask, whether by POST /navigation-tasks, by the interpreter side-effect of POST /rescreen-appointments, or by a cascade (EI_LINKAGE, OUTREACH_CALL)"
    algorithm: aggregation
    formula: |
      required_units = 2                                            # BASE_UNITS
                       + (3 if infant.interpreter_required else 0)  # INTERPRETER_UNITS
                       + (4 if task_type == HOME_VISIT else 0)      # HOME_VISIT_UNITS
      remaining = Facility[infant.birth_facility_id].navigation_budget_units_remaining
      if remaining >= required_units:
          units_reserved = required_units
          budget_shortfall_flag = false
      elif the task is created by a CASCADE (EI_LINKAGE / OUTREACH_CALL / interpreter side-effect):
          units_reserved = 0
          budget_shortfall_flag = true          # the task still exists and still relieves risk
      else:   # operator-initiated POST /navigation-tasks
          reject with ERR_NAVIGATION_BUDGET_EXHAUSTED
      # Conservation invariant: funding facility's navigation_budget_units_remaining
      # + sum(units_reserved of its tasks in {UNASSIGNED, OPEN, COMPLETED}) == navigation_budget_units_total
      # at every observable instant. CANCELLED tasks release; COMPLETED tasks do not.
    input_set: "The task being created plus its infant and the infant's birth facility."
    constants:
      BASE_UNITS: 2
      INTERPRETER_UNITS: 3
      HOME_VISIT_UNITS: 4
    precision: "integer units"

  - name: navigator_selector
    trigger: "Any NavigationTask assignment where the request does not name assigned_provider_id — POST /navigation-tasks with auto_assign true, POST /navigation-tasks/{id}/assign with the field omitted, and every cascade-minted task"
    algorithm: constraint_propagation
    formula: |
      candidates = Provider WHERE provider_type == NAVIGATOR
                     AND credential_status == ACTIVE
                     AND region_code == Facility[infant.birth_facility_id].region_code
                     AND open_task_count < max_open_tasks
                     AND (infant.interpreter_required == false
                          OR infant.preferred_language IN languages)
                     AND id NOT IN excluded_provider_ids      # set on retry after a cancel
      ranking      = ORDER BY open_task_count ASC,
                              max_open_tasks DESC,
                              created_at ASC          # final tie-break; ids are never consulted
      chosen       = first row of ranking
      empty_pool   = cascade-minted task   -> the task is created with status UNASSIGNED and
                                              assigned_provider_id null (deferred queue)
                     POST /navigation-tasks or /assign -> reject with ERR_NO_ELIGIBLE_NAVIGATOR
    input_set: "All Provider rows of provider_type NAVIGATOR; no other entity participates."
    constants: {}
    precision: "deterministic single-row selection"

  - name: ei_program_selector
    trigger: "Creation of an EarlyInterventionReferral — by the CASCADE C1 finalize chain and by the replacement referral minted on REJECTED_BY_PROGRAM"
    algorithm: waterfall_allocation
    formula: |
      tier1 = Facility WHERE facility_type == EI_PROGRAM
                        AND reporting_compliance_status IN {COMPLIANT, WATCH}
                        AND region_code == Facility[infant.birth_facility_id].region_code
                        AND id NOT IN excluded_facility_ids     # the rejecting program on retry
      tier2 = Facility WHERE facility_type == EI_PROGRAM
                        AND reporting_compliance_status IN {COMPLIANT, WATCH}
                        AND id NOT IN excluded_facility_ids     # statewide fallback, any region
      pool  = tier1 if tier1 is non-empty else tier2
      ranking = ORDER BY count(EarlyInterventionReferral WHERE ei_program_facility_id == candidate.id
                               AND status IN {PENDING, ACCEPTED}) ASC,
                         created_at ASC        # final tie-break; ids are never consulted
      chosen  = first row of ranking
      empty_pool = the referral is created with ei_program_facility_id null; the infant still
                   advances to intervention_status REFERRED and a ProgramAdmin must call
                   POST /ei-referrals/{id}/assign-program
    input_set: "All Facility rows with facility_type EI_PROGRAM plus their open referral counts."
    constants: {}
    precision: "deterministic single-row selection; the region tier is exhausted before the statewide tier"

  - name: surveillance_due_date
    trigger: "POST /risk-factor-entries and the NICU auto-registration side-effect of POST /infants"
    algorithm: threshold
    formula: |
      HIGH_RISK_CODES = {CMV, BACTERIAL_MENINGITIS, ECMO}
      surveillance_due_date = infant.birth_datetime
                              + (180 days if risk_factor_code IN HIGH_RISK_CODES else 270 days)
      # days are exact 86400-second multiples; no calendar-month arithmetic.
    input_set: "The entry being created plus its infant's birth_datetime."
    constants:
      HIGH_RISK_SURVEILLANCE_DAYS: 180
      STANDARD_SURVEILLANCE_DAYS: 270
      SURVEILLANCE_DUE_WINDOW_DAYS: 30
    precision: "exact datetime arithmetic in whole days"

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the FIRST failing row determines the response, so dual-failure requests are decidable)
# Bands: 1-2 authentication/authorization, 3-4 request schema, 5-6 existence,
# 7 entity-backed identity, 8-9 optimistic concurrency, 10-15 state preconditions,
# 16-19 safety/compliance, 20-25 referential, 26-31 temporal, 32-38 constraint,
# 39-42 fiscal/capacity.
# =============================================================================

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "Request schema: every required body field present; enums within their declared sets; integers within declared ranges; datetimes ISO 8601 UTC; visit_starts_at/visit_ends_at present iff task_type == HOME_VISIT; ifsp_date present on enroll; points_delta non-zero"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 4
    category: business_constraint
    check: "limit within 1..100 and offset >= 0 on every list endpoint"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"
  - priority: 5
    category: existence
    check: "Every id in the path resolves, validated left to right (facility, infant, encounter, episode, slot, appointment, evaluation, referral, risk entry, task, period, report)"
    error_id: "ERR_FACILITY_NOT_FOUND | ERR_PROVIDER_NOT_FOUND | ERR_INFANT_NOT_FOUND | ERR_ENCOUNTER_NOT_FOUND | ERR_EPISODE_NOT_FOUND | ERR_SLOT_NOT_FOUND | ERR_APPOINTMENT_NOT_FOUND | ERR_EVALUATION_NOT_FOUND | ERR_REFERRAL_NOT_FOUND | ERR_TASK_NOT_FOUND | ERR_PERIOD_NOT_FOUND | ERR_REPORT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 6
    category: existence
    check: "Every foreign key in the body resolves (birth_facility_id, facility_id, provider_id, performed_by_provider_id, infant_id, episode_id, slot_id, appointment_id, prior_encounter_id, supersedes_episode_id, supersedes_report_id, reporting_period_id, assigned_provider_id, ei_program_facility_id)"
    error_id: "ERR_FACILITY_NOT_FOUND | ERR_PROVIDER_NOT_FOUND | ERR_INFANT_NOT_FOUND | ERR_EPISODE_NOT_FOUND | ERR_SLOT_NOT_FOUND | ERR_APPOINTMENT_NOT_FOUND | ERR_ENCOUNTER_NOT_FOUND | ERR_PERIOD_NOT_FOUND | ERR_REPORT_NOT_FOUND"
    http_status: 404
    applies_to: "all write endpoints carrying foreign keys"
  - priority: 7
    category: auth
    check: >-
      Entity-backed identity: for FacilityAdmin, X-User-ID equals the Facility id it acts for; for
      FacilityScreener, X-User-ID is a Provider with provider_type SCREENER whose facility_id equals
      the encounter/infant facility; for Audiologist, a Provider with provider_type AUDIOLOGIST; for
      Navigator, a Provider with provider_type NAVIGATOR; for EICoordinator, a Provider with
      provider_type EI_COORDINATOR whose facility_id equals the referral's ei_program_facility_id
    error_id: ERR_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "all endpoints whose roles include an entity_backed role"
  - priority: 8
    category: state
    check: "expected_infant_version equals Infant.version (concurrency_rules.episode-create-stale-infant)"
    error_id: ERR_STALE_INFANT_VERSION
    http_status: 412
    applies_to: "POST /follow-up-episodes"
  - priority: 9
    category: state
    check: "expected_facility_version equals Facility.version (concurrency_rules.report-submit-stale-facility)"
    error_id: ERR_STALE_FACILITY_VERSION
    http_status: 412
    applies_to: "POST /facility-reports"
  - priority: 10
    category: state
    check: "The infant has not already been discharged when POST /infants/{id}/discharge is called"
    error_id: ERR_INFANT_ALREADY_DISCHARGED
    http_status: 409
    applies_to: "POST /infants/{id}/discharge"
  - priority: 11
    category: state
    check: "The target episode is in a state that permits the operation: PENDING_SCHEDULING to book an appointment, {PENDING_SCHEDULING, SCHEDULED} to close, SCHEDULED or ESCALATED_DIAGNOSTIC to record a linked encounter"
    error_id: ERR_EPISODE_NOT_SCHEDULABLE
    http_status: 409
    applies_to: "POST /rescreen-appointments, POST /follow-up-episodes/{id}/close, POST /screening-encounters with episode_id"
  - priority: 12
    category: state
    check: "The target appointment is BOOKED when closed or when an encounter references it"
    error_id: ERR_APPOINTMENT_NOT_OPEN
    http_status: 409
    applies_to: "POST /rescreen-appointments/{id}/close, POST /screening-encounters with appointment_id"
  - priority: 13
    category: state
    check: "The target row is in the state its action requires: evaluation DRAFT to submit, PENDING_ATTESTATION to attest, ATTESTED to finalize; referral PENDING to accept/reject, ACCEPTED to enroll, {PENDING, ACCEPTED} to family-decline, ei_program_facility_id null to assign-program; task UNASSIGNED to assign, {UNASSIGNED, OPEN} to close; report {SUBMITTED, RETURNED_FOR_CORRECTION} to review, ACCEPTED with assessed_penalty_points > 0 to waive; period OPEN to close"
    error_id: "ERR_EVALUATION_INVALID_STATE | ERR_REFERRAL_INVALID_STATE | ERR_TASK_INVALID_STATE | ERR_REPORT_INVALID_STATE | ERR_PERIOD_ALREADY_CLOSED"
    http_status: 409
    applies_to: "all action endpoints on DiagnosticEvaluation, EarlyInterventionReferral, NavigationTask, FacilityReport, ReportingPeriod"
  - priority: 14
    category: state
    check: "Facility[facility_id].reporting_compliance_status != SUSPENDED for any new ScreeningEncounter and for POST /diagnostic-evaluations/{id}/finalize"
    error_id: ERR_FACILITY_SUSPENDED
    http_status: 409
    applies_to: "POST /screening-encounters, POST /diagnostic-evaluations/{id}/finalize"
  - priority: 15
    category: state
    check: "Periods close in chronological order: no earlier ReportingPeriod (period_end <= this period_start) is still OPEN"
    error_id: ERR_EARLIER_PERIOD_OPEN
    http_status: 409
    applies_to: "POST /reporting-periods/{id}/close"
  - priority: 16
    category: business_safety
    check: "Infant.guardian_consent_status != REFUSED before diagnostic results may be submitted"
    error_id: ERR_GUARDIAN_CONSENT_REFUSED
    http_status: 422
    applies_to: "POST /diagnostic-evaluations/{id}/submit"
  - priority: 17
    category: business_safety
    check: "Segregation of duties: the attesting X-User-ID differs from evaluation.performed_by_provider_id; the waiving X-User-ID differs from report.accepted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /diagnostic-evaluations/{id}/attest, POST /facility-reports/{id}/waive-penalty"
  - priority: 18
    category: business_safety
    check: "Outcome agrees with thresholds: NO_LOSS requires both ear thresholds <= 25 dB; UNILATERAL_LOSS exactly one > 25 dB; BILATERAL_LOSS both > 25 dB"
    error_id: ERR_OUTCOME_THRESHOLD_MISMATCH
    http_status: 422
    applies_to: "POST /diagnostic-evaluations/{id}/submit"
  - priority: 19
    category: business_safety
    check: "A SURVEILLANCE encounter may only be recorded once the infant has at least one RiskFactorEntry in status IN {ACTIVE, SURVEILLANCE_DUE, SURVEILLANCE_OVERDUE}"
    error_id: ERR_NO_OPEN_RISK_FACTOR
    http_status: 422
    applies_to: "POST /screening-encounters with encounter_type == SURVEILLANCE"
  - priority: 20
    category: business_referential
    check: "Every provider that performs, attests or is assigned work has credential_status == ACTIVE"
    error_id: ERR_PROVIDER_NOT_CREDENTIALED
    http_status: 409
    applies_to: "POST /screening-encounters, POST /diagnostic-evaluations, POST /diagnostic-evaluations/{id}/attest, POST /clinic-slots, POST /navigation-tasks, POST /navigation-tasks/{id}/assign"
  - priority: 21
    category: business_referential
    check: "The referenced provider's provider_type fits the work: SCREENER or AUDIOLOGIST performs an encounter, AUDIOLOGIST performs/attests an evaluation and staffs a slot, NAVIGATOR holds a navigation task"
    error_id: ERR_PROVIDER_TYPE_MISMATCH
    http_status: 409
    applies_to: "POST /screening-encounters, POST /diagnostic-evaluations, POST /clinic-slots, POST /navigation-tasks, POST /navigation-tasks/{id}/assign"
  - priority: 22
    category: business_referential
    check: "ClinicSlot.slot_type is RESCREEN for an INITIAL_SCREEN/RESCREEN episode and DIAGNOSTIC for a DIAGNOSTIC episode"
    error_id: ERR_SLOT_TYPE_MISMATCH
    http_status: 409
    applies_to: "POST /rescreen-appointments"
  - priority: 23
    category: business_referential
    check: "Linkage integrity: encounter.episode_id belongs to encounter.infant_id; encounter.appointment_id belongs to encounter.episode_id; evaluation.episode_id belongs to evaluation.infant_id; supersedes_episode_id belongs to the same infant; supersedes_report_id belongs to the same facility and period"
    error_id: ERR_LINKAGE_MISMATCH
    http_status: 409
    applies_to: "POST /screening-encounters, POST /diagnostic-evaluations, POST /follow-up-episodes, POST /facility-reports"
  - priority: 24
    category: business_referential
    check: "Infant.screening_status IN {REFERRED, DIAGNOSTIC_IN_PROGRESS} before diagnostic results may be submitted"
    error_id: ERR_INFANT_NOT_REFERRED
    http_status: 409
    applies_to: "POST /diagnostic-evaluations/{id}/submit"
  - priority: 25
    category: business_referential
    check: "An EI_PROGRAM facility may only be named as ei_program_facility_id, and facility_type must fit the endpoint (EI_PROGRAM facilities file no reports and register no births; AUDIOLOGY_CLINIC facilities own clinic slots)"
    error_id: ERR_FACILITY_TYPE_MISMATCH
    http_status: 409
    applies_to: "POST /infants, POST /clinic-slots, POST /facility-reports, POST /ei-referrals/{id}/assign-program"
  - priority: 26
    category: business_temporal
    check: "Infant.birth_datetime <= logical clock"
    error_id: ERR_BIRTH_DATETIME_IN_FUTURE
    http_status: 422
    applies_to: "POST /infants"
  - priority: 27
    category: business_temporal
    check: "Event instants lie inside [infant.birth_datetime, logical clock]: encounter.performed_at, evaluation.evaluation_datetime, risk entry.identified_at, discharge_datetime, ifsp_date"
    error_id: ERR_TIMESTAMP_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /screening-encounters, POST /diagnostic-evaluations, POST /risk-factor-entries, POST /infants/{id}/discharge, POST /ei-referrals/{id}/enroll"
  - priority: 28
    category: business_temporal
    check: "ClinicSlot.starts_at > logical clock when an appointment is booked into it"
    error_id: ERR_SLOT_IN_PAST
    http_status: 422
    applies_to: "POST /rescreen-appointments"
  - priority: 29
    category: business_temporal
    check: "logical clock >= ReportingPeriod.period_end before the period may be closed"
    error_id: ERR_PERIOD_NOT_ENDED
    http_status: 422
    applies_to: "POST /reporting-periods/{id}/close"
  - priority: 30
    category: business_temporal
    check: "Window sanity: ends_at > starts_at on a slot, visit_ends_at > visit_starts_at on a home visit, period_end > period_start, submission_due_datetime >= period_end"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /clinic-slots, POST /navigation-tasks, POST /reporting-periods"
  - priority: 31
    category: business_temporal
    check: "A new ReportingPeriod's [period_start, period_end) must not intersect an existing period's window"
    error_id: ERR_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /reporting-periods"
  - priority: 32
    category: business_constraint
    check: >-
      Half-open provider exclusivity: a new ClinicSlot for provider P is rejected when an existing
      slot of P satisfies new.starts_at < existing.ends_at AND existing.starts_at < new.ends_at.
      Touching windows (new.starts_at == existing.ends_at) are allowed.
    error_id: ERR_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /clinic-slots"
  - priority: 33
    category: business_constraint
    check: >-
      Family-burden buffer: booking is rejected when another RescreenAppointment of the same infant
      with status IN {BOOKED, ATTENDED} sits on a slot whose starts_at is strictly less than 24
      hours away from the new slot's starts_at (abs difference < 86400 seconds). Exactly 24 hours
      apart is allowed.
    error_id: ERR_FAMILY_BURDEN_BUFFER
    http_status: 409
    applies_to: "POST /rescreen-appointments"
  - priority: 34
    category: business_constraint
    check: >-
      Navigator travel buffer: a HOME_VISIT task is rejected when the chosen navigator already holds
      a HOME_VISIT task in status IN {UNASSIGNED, OPEN} whose closed window [visit_starts_at,
      visit_ends_at] comes within 45 minutes of the new window on either side — i.e. rejected unless
      new.visit_starts_at >= other.visit_ends_at + 45 min OR other.visit_starts_at >= new.visit_ends_at + 45 min.
    error_id: ERR_NAVIGATOR_TRAVEL_BUFFER
    http_status: 409
    applies_to: "POST /navigation-tasks, POST /navigation-tasks/{id}/assign"
  - priority: 35
    category: business_constraint
    check: "episode.attempt_count < 3 before another appointment may be booked on it"
    error_id: ERR_ATTEMPT_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /rescreen-appointments"
  - priority: 36
    category: business_constraint
    check: "An infant may not have two episodes in status IN {PENDING_SCHEDULING, SCHEDULED, ESCALATED_DIAGNOSTIC}; a second create must name the open one in supersedes_episode_id"
    error_id: ERR_ACTIVE_EPISODE_EXISTS
    http_status: 409
    applies_to: "POST /follow-up-episodes"
  - priority: 37
    category: business_constraint
    check: "At most one BIRTH_ADMISSION encounter per infant; at most one non-SUPERSEDED FacilityReport per (facility, period) unless supersedes_report_id names the incumbent"
    error_id: "ERR_DUPLICATE_BIRTH_SCREEN | ERR_DUPLICATE_REPORT"
    http_status: 409
    applies_to: "POST /screening-encounters, POST /facility-reports"
  - priority: 38
    category: business_constraint
    check: "A penalty adjustment may not drive Facility.penalty_points_balance below 0"
    error_id: ERR_NEGATIVE_PENALTY_BALANCE
    http_status: 422
    applies_to: "POST /facilities/{id}/penalty-adjustments"
  - priority: 39
    category: business_fiscal
    check: "ClinicSlot.remaining_capacity >= 1 (status == OPEN) at booking time"
    error_id: ERR_SLOT_FULL
    http_status: 409
    applies_to: "POST /rescreen-appointments"
  - priority: 40
    category: business_fiscal
    check: "Facility[infant.birth_facility_id].navigation_budget_units_remaining >= required_units for an operator-initiated navigation task or an interpreter-flagged booking"
    error_id: ERR_NAVIGATION_BUDGET_EXHAUSTED
    http_status: 409
    applies_to: "POST /navigation-tasks, POST /rescreen-appointments with interpreter_needed true"
  - priority: 41
    category: business_fiscal
    check: "The navigator selector's candidate pool is non-empty for an operator-initiated assignment"
    error_id: ERR_NO_ELIGIBLE_NAVIGATOR
    http_status: 409
    applies_to: "POST /navigation-tasks with auto_assign true, POST /navigation-tasks/{id}/assign without assigned_provider_id"
  - priority: 42
    category: business_fiscal
    check: "The chosen navigator's open_task_count < max_open_tasks when the request names assigned_provider_id explicitly"
    error_id: ERR_NAVIGATOR_AT_CAPACITY
    http_status: 409
    applies_to: "POST /navigation-tasks, POST /navigation-tasks/{id}/assign"

# =============================================================================
# §1.5 API Endpoint Table
# Flat collections under api_prefix "/" — every templated path segment is
# literally "{id}". 54 endpoints: 25 reads (single-resource, sub-resource and
# filtered lists giving every §1.1 FK a reverse-reachability GET) and 29 writes.
# =============================================================================

endpoints:
  # --------------------------------------------------------------- Facility ---
  - method: POST
    path: "/facilities"
    description: Register a facility (birth hospital, birthing center, midwife practice, audiology clinic or EI program).
    roles: [ProgramAdmin]
    code: 201
    input: [name, facility_type, region_code, "navigation_budget_units_total?"]
    output: Facility
    side_effects:
      - "navigation_budget_units_remaining initialised to navigation_budget_units_total"
      - "penalty_points_balance 0, reporting_compliance_status COMPLIANT, performance_score null"
  - method: POST
    path: "/facilities/{id}/penalty-adjustments"
    description: >-
      Apply a manual compliance-penalty adjustment (positive to sanction, negative to remit). The
      only way to move a facility's posture without closing a reporting period.
    roles: [ProgramAdmin]
    code: 200
    input: [points_delta, reason]
    output: Facility
    side_effects:
      - "manual_adjustment_points_total += points_delta and penalty_points_balance is re-derived"
      - "reporting_compliance_status re-derived from the new balance (<=4 COMPLIANT, 5-9 WATCH, 10-17 PROBATION, >=18 SUSPENDED)"
      - "increments Facility.version by 1"
      - "rejects with ERR_NEGATIVE_PENALTY_BALANCE when the resulting balance would be < 0"
  - method: GET
    path: "/facilities/{id}"
    description: Read one facility including its budget, penalty balance, posture and both performance-score variants.
    roles: [ProgramAdmin, ProgramAuditor, FacilityAdmin, FacilityScreener, Audiologist, Navigator, EICoordinator]
    code: 200
    input: []
    output: Facility
    side_effects: []
  - method: GET
    path: "/facilities/{id}/providers"
    description: List the providers employed by this facility (reverse reachability for Provider.facility_id).
    roles: [ProgramAdmin, ProgramAuditor, FacilityAdmin, FacilityScreener, Audiologist, Navigator, EICoordinator]
    code: 200
    input: ["provider_type?", "credential_status?", "limit?", "offset?"]
    output: "Provider[]"
    side_effects: []
  - method: GET
    path: "/facilities/{id}/performance"
    description: >-
      Facility performance dashboard — both variants of calculations.facility_performance_score
      written by the last period close plus the component rates behind them.
    roles: [ProgramAdmin, ProgramAuditor, FacilityAdmin]
    code: 200
    input: []
    output: "{ facility_id: string, performance_score: number, encounter_basis_performance_score: number, cohort_screened_rate: number, encounter_screened_rate: number, followup_resolution_rate: number, report_timeliness_rate: number, penalty_points_balance: integer, reporting_compliance_status: string, last_closed_period_label: string }"
    side_effects: []

  # --------------------------------------------------------------- Provider ---
  - method: POST
    path: "/providers"
    description: Register a screener, audiologist, navigator or EI coordinator at a facility.
    roles: [ProgramAdmin, FacilityAdmin]
    code: 201
    input: [facility_id, provider_type, full_name, region_code, "languages?", "credential_status?", "max_open_tasks?"]
    output: Provider
    side_effects:
      - "open_task_count initialised to 0"
  - method: GET
    path: "/providers/{id}"
    description: Read one provider including credential standing and live navigator workload.
    roles: [ProgramAdmin, ProgramAuditor, FacilityAdmin, FacilityScreener, Audiologist, Navigator, EICoordinator]
    code: 200
    input: []
    output: Provider
    side_effects: []

  # ----------------------------------------------------------------- Infant ---
  - method: POST
    path: "/infants"
    description: >-
      Register a newborn on the EHDI registry. Covers inpatient births and the out-of-hospital /
      home-birth capture pathways, which have no discharge screen and therefore open a follow-up
      episode immediately.
    roles: [ProgramAdmin, FacilityAdmin, FacilityScreener]
    code: 201
    input: [birth_facility_id, birth_datetime, birth_setting, gestational_age_weeks, "nicu_stay_days?", "preferred_language?", "interpreter_required?", guardian_name, guardian_contact_phone, "guardian_consent_status?"]
    output: Infant
    side_effects:
      - "screening_status NOT_SCREENED, intervention_status NOT_APPLICABLE"
      - "when nicu_stay_days >= 5, a RiskFactorEntry(risk_factor_code NICU_5_PLUS_DAYS, source REGISTRY_AUTO, identified_at = birth_datetime, status ACTIVE) is minted and its surveillance_due_date computed per calculations.surveillance_due_date"
      - "when birth_setting IN {OUT_OF_HOSPITAL, HOME_BIRTH}, a FollowUpEpisode(episode_type INITIAL_SCREEN, status PENDING_SCHEDULING, benchmark_days 30, due_date = birth_datetime + 30 days) is created — the out-of-hospital capture pathway"
      - "ltf_risk_score and priority_band computed per calculations.ltf_risk_score"
  - method: POST
    path: "/infants/{id}/discharge"
    description: Record discharge from the birth facility, freezing the before-discharge screening denominator.
    roles: [ProgramAdmin, FacilityAdmin, FacilityScreener]
    code: 200
    input: [discharge_datetime]
    output: Infant
    side_effects:
      - "discharge_datetime stamped; discharged_unscreened set true when screening_status was NOT_SCREENED"
      - "when discharged_unscreened is true and the infant has no episode in {PENDING_SCHEDULING, SCHEDULED, ESCALATED_DIAGNOSTIC}, a FollowUpEpisode(episode_type INITIAL_SCREEN, status PENDING_SCHEDULING) is created"
      - "recompute ltf_risk_score and priority_band"
      - "increments Infant.version by 1"
  - method: PATCH
    path: "/infants/{id}/contact-preferences"
    description: >-
      Update family communication preferences and consent — preferred language, interpreter need,
      contact phone, guardian consent.
    roles: [ProgramAdmin, FacilityAdmin, Navigator]
    code: 200
    input: ["preferred_language?", "interpreter_required?", "guardian_contact_phone?", "guardian_consent_status?"]
    output: Infant
    side_effects:
      - "recompute ltf_risk_score and priority_band — the language-gap term re-evaluates the navigator pool of the birth facility's region"
      - "increments Infant.version by 1"
  - method: GET
    path: "/infants/{id}"
    description: Read one infant with both state dimensions, risk score and priority band.
    roles: [ProgramAdmin, ProgramAuditor, FacilityAdmin, FacilityScreener, Audiologist, Navigator, EICoordinator]
    code: 200
    input: []
    output: Infant
    side_effects: []
  - method: GET
    path: "/infants"
    description: >-
      Worklist of infants, filterable by birth facility (reverse reachability for
      Infant.birth_facility_id), by either state dimension and by priority band.
    roles: [ProgramAdmin, ProgramAuditor, FacilityAdmin, FacilityScreener, Audiologist, Navigator, EICoordinator]
    code: 200
    input: ["birth_facility_id?", "screening_status?", "intervention_status?", "priority_band?", "birth_setting?", "limit?", "offset?"]
    output: "Infant[]"
    side_effects: []
  - method: GET
    path: "/infants/{id}/timeliness"
    description: >-
      Age-benchmark panel for one infant — both variants of calculations.infant_age_basis and the
      1-3-6 milestone statuses derived from them.
    roles: [ProgramAdmin, ProgramAuditor, FacilityAdmin, Audiologist, Navigator, EICoordinator]
    code: 200
    input: []
    output: "{ infant_id: string, chronological_age_days: integer, corrected_age_days: integer, effective_age_days: integer, prematurity_offset_days: integer, benchmark_age_basis: string, screening_timeliness_status: string, diagnostic_timeliness_status: string, diagnostic_timeliness_status_chronological_basis: string, ei_timeliness_status: string, ltf_risk_score: integer, priority_band: string }"
    side_effects: []
  - method: GET
    path: "/infants/{id}/risk-factor-entries"
    description: Delayed-onset risk registry for one infant (reverse reachability for RiskFactorEntry.infant_id).
    roles: [ProgramAdmin, ProgramAuditor, FacilityAdmin, Audiologist, Navigator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "RiskFactorEntry[]"
    side_effects: []

  # ------------------------------------------------------ ScreeningEncounter ---
  - method: POST
    path: "/screening-encounters"
    description: >-
      Record a physiologic screen — the birth-admission screen before discharge, an outpatient
      rescreen against a booked appointment, a home visit, or a delayed-onset surveillance screen.
      Append-only clinical event; overall_result is derived, never supplied.
    roles: [FacilityScreener, Audiologist]
    code: 201
    input: [infant_id, facility_id, performed_by_provider_id, encounter_type, method, performed_at, left_ear_result, right_ear_result, "episode_id?", "appointment_id?", "prior_encounter_id?"]
    output: ScreeningEncounter
    side_effects:
      - "overall_result derived per calculations.overall_screening_result; before_discharge and age_days_at_encounter computed"
      - "on a PASS at BIRTH_ADMISSION/HOME_VISIT: infant.screening_status -> PASSED and any open INITIAL_SCREEN episode -> RESOLVED_PASS, cancelling its BOOKED appointment and releasing slot capacity"
      - "on a REFER/INCOMPLETE at BIRTH_ADMISSION/HOME_VISIT: CASCADE C3 runs (screening_status -> REFERRED, RESCREEN episode minted, risk recomputed, OUTREACH_CALL task auto-assigned when the band becomes CRITICAL)"
      - "when appointment_id is supplied: that appointment -> ATTENDED and its episode advances to RESOLVED_PASS or ESCALATED_DIAGNOSTIC per overall_result"
      - "when encounter_type == SURVEILLANCE: every open RiskFactorEntry of the infant -> CLEARED (PASS) or LOSS_IDENTIFIED (REFER/INCOMPLETE), and on LOSS_IDENTIFIED a DIAGNOSTIC episode is minted with screening_status -> REFERRED"
      - "recompute infant.ltf_risk_score and infant.priority_band"
  - method: GET
    path: "/screening-encounters/{id}"
    description: Read one screening encounter with its derived result and age-at-encounter.
    roles: [ProgramAdmin, ProgramAuditor, FacilityAdmin, FacilityScreener, Audiologist, Navigator, EICoordinator]
    code: 200
    input: []
    output: ScreeningEncounter
    side_effects: []
  - method: GET
    path: "/screening-encounters"
    description: >-
      Filtered encounter log — reverse reachability for every ScreeningEncounter FK (infant_id,
      facility_id, performed_by_provider_id, episode_id, appointment_id and the self-referential
      prior_encounter_id attempt chain).
    roles: [ProgramAdmin, ProgramAuditor, FacilityAdmin, FacilityScreener, Audiologist, Navigator, EICoordinator]
    code: 200
    input: ["infant_id?", "facility_id?", "performed_by_provider_id?", "episode_id?", "appointment_id?", "prior_encounter_id?", "encounter_type?", "overall_result?", "limit?", "offset?"]
    output: "ScreeningEncounter[]"
    side_effects: []

  # --------------------------------------------------------- FollowUpEpisode ---
  - method: POST
    path: "/follow-up-episodes"
    description: >-
      Open a follow-up episode for an infant (rescreen or diagnostic), optionally superseding the
      infant's currently open episode. OCC-guarded on the Infant per
      concurrency_rules.episode-create-stale-infant.
    roles: [ProgramAdmin, FacilityAdmin, Navigator]
    code: 201
    input: [infant_id, episode_type, expected_infant_version, "supersedes_episode_id?"]
    output: FollowUpEpisode
    side_effects:
      - "rejects with ERR_STALE_INFANT_VERSION (412) when expected_infant_version != Infant.version"
      - "benchmark_days (30 or 90) and due_date = infant.birth_datetime + benchmark_days days are computed"
      - "when supersedes_episode_id is supplied, that episode -> SUPERSEDED (closure_reason SUPERSEDED) and its BOOKED appointment -> CANCELLED, releasing slot capacity"
      - "when episode_type == DIAGNOSTIC and infant.screening_status == REFERRED, infant.screening_status -> DIAGNOSTIC_IN_PROGRESS"
      - "recompute infant.ltf_risk_score and infant.priority_band"
      - "increments Infant.version by 1"
  - method: POST
    path: "/follow-up-episodes/{id}/close"
    description: Close an active episode administratively (family declined, or family moved out of state).
    roles: [ProgramAdmin, Navigator]
    code: 200
    input: [closure_reason]
    output: FollowUpEpisode
    side_effects:
      - "episode -> CLOSED_DECLINED with the supplied closure_reason and closed_at = logical clock"
      - "any BOOKED appointment on the episode -> CANCELLED, releasing slot capacity; its linked interpreter task -> CANCELLED, crediting units back to the funding facility"
      - "recompute infant.ltf_risk_score and infant.priority_band"
  - method: GET
    path: "/follow-up-episodes/{id}"
    description: Read one follow-up episode with attempt count, benchmark, due date and timeliness.
    roles: [ProgramAdmin, ProgramAuditor, FacilityAdmin, FacilityScreener, Audiologist, Navigator, EICoordinator]
    code: 200
    input: []
    output: FollowUpEpisode
    side_effects: []
  - method: GET
    path: "/follow-up-episodes"
    description: >-
      Filtered episode list — reverse reachability for FollowUpEpisode.infant_id and the
      self-referential supersedes_episode_id.
    roles: [ProgramAdmin, ProgramAuditor, FacilityAdmin, FacilityScreener, Audiologist, Navigator, EICoordinator]
    code: 200
    input: ["infant_id?", "supersedes_episode_id?", "status?", "episode_type?", "owner_scope?", "timeliness_status?", "limit?", "offset?"]
    output: "FollowUpEpisode[]"
    side_effects: []

  # --------------------------------------------------------------- ClinicSlot ---
  - method: POST
    path: "/clinic-slots"
    description: >-
      Publish an audiology clinic slot. Half-open [starts_at, ends_at) windows must not overlap for
      the same staffing provider; touching windows are allowed.
    roles: [ProgramAdmin, FacilityAdmin]
    code: 201
    input: [facility_id, provider_id, starts_at, ends_at, slot_type, "total_capacity?"]
    output: ClinicSlot
    side_effects:
      - "booked_count 0, remaining_capacity = total_capacity, status OPEN"
      - "rejects with ERR_SLOT_OVERLAP when the provider already staffs an intersecting window"
  - method: GET
    path: "/clinic-slots/{id}"
    description: Read one clinic slot with live capacity.
    roles: [ProgramAdmin, ProgramAuditor, FacilityAdmin, FacilityScreener, Audiologist, Navigator, EICoordinator]
    code: 200
    input: []
    output: ClinicSlot
    side_effects: []
  - method: GET
    path: "/clinic-slots"
    description: Filtered slot list — reverse reachability for ClinicSlot.facility_id and ClinicSlot.provider_id.
    roles: [ProgramAdmin, ProgramAuditor, FacilityAdmin, FacilityScreener, Audiologist, Navigator, EICoordinator]
    code: 200
    input: ["facility_id?", "provider_id?", "slot_type?", "status?", "limit?", "offset?"]
    output: "ClinicSlot[]"
    side_effects: []

  # --------------------------------------------------- RescreenAppointment ---
  - method: POST
    path: "/rescreen-appointments"
    description: >-
      Book an episode into a clinic slot, optionally with interpreter support. Enforces slot type,
      future slot, capacity, the 3-attempt ceiling and the 24-hour family-burden buffer.
    roles: [ProgramAdmin, FacilityAdmin, Navigator]
    code: 201
    input: [episode_id, slot_id, "interpreter_needed?"]
    output: RescreenAppointment
    side_effects:
      - "appointment created with status BOOKED and infant_id copied from the episode"
      - "slot.booked_count += 1; remaining_capacity and status re-derived"
      - "episode.attempt_count re-derived and episode.status -> SCHEDULED"
      - "when interpreter_needed is true, a NavigationTask(task_type INTERPRETER_SESSION) is minted, its units_reserved debited from Facility[infant.birth_facility_id].navigation_budget_units_remaining per calculations.navigation_units_cost, and its id written to appointment.linked_navigation_task_id"
      - "recompute infant.ltf_risk_score and infant.priority_band"
  - method: POST
    path: "/rescreen-appointments/{id}/close"
    description: Close a booked appointment as a no-show or a cancellation, returning the episode to scheduling.
    roles: [ProgramAdmin, FacilityAdmin, Navigator]
    code: 200
    input: [disposition, "reason?"]
    output: RescreenAppointment
    side_effects:
      - "appointment -> NO_SHOW or CANCELLED with disposition_reason recorded"
      - "slot.booked_count -= 1; remaining_capacity and status re-derived (capacity conservation)"
      - "linked interpreter NavigationTask in {UNASSIGNED, OPEN} -> CANCELLED, crediting units back to the funding facility"
      - "on NO_SHOW: infant.missed_appointment_count re-derived (+1)"
      - "episode.status -> PENDING_SCHEDULING; recompute infant.ltf_risk_score and infant.priority_band"
  - method: GET
    path: "/rescreen-appointments/{id}"
    description: Read one appointment with its slot, episode and interpreter-task linkage.
    roles: [ProgramAdmin, ProgramAuditor, FacilityAdmin, FacilityScreener, Audiologist, Navigator, EICoordinator]
    code: 200
    input: []
    output: RescreenAppointment
    side_effects: []
  - method: GET
    path: "/rescreen-appointments"
    description: >-
      Filtered appointment list — reverse reachability for episode_id, slot_id, infant_id and
      linked_navigation_task_id.
    roles: [ProgramAdmin, ProgramAuditor, FacilityAdmin, FacilityScreener, Audiologist, Navigator, EICoordinator]
    code: 200
    input: ["episode_id?", "slot_id?", "infant_id?", "linked_navigation_task_id?", "status?", "limit?", "offset?"]
    output: "RescreenAppointment[]"
    side_effects: []

  # ---------------------------------------------------- DiagnosticEvaluation ---
  - method: POST
    path: "/diagnostic-evaluations"
    description: Open a diagnostic audiologic evaluation against the infant's diagnostic-track episode.
    roles: [ProgramAdmin, FacilityAdmin, Audiologist]
    code: 201
    input: [infant_id, episode_id, facility_id, performed_by_provider_id, evaluation_datetime, method]
    output: DiagnosticEvaluation
    side_effects:
      - "status DRAFT; thresholds, outcome, attested_by_provider_id and both timeliness fields null/PENDING"
  - method: POST
    path: "/diagnostic-evaluations/{id}/submit"
    description: Submit ear thresholds and the clinical outcome for second-reader attestation.
    roles: [Audiologist]
    code: 200
    input: [left_ear_threshold_db, right_ear_threshold_db, outcome]
    output: DiagnosticEvaluation
    side_effects:
      - "thresholds and outcome stored; status -> PENDING_ATTESTATION"
      - "rejects with ERR_OUTCOME_THRESHOLD_MISMATCH when the outcome disagrees with the 25 dB rule, ERR_GUARDIAN_CONSENT_REFUSED when consent was refused, ERR_INFANT_NOT_REFERRED when the infant is not on the diagnostic track"
  - method: POST
    path: "/diagnostic-evaluations/{id}/attest"
    description: >-
      Second-reader attestation. ACCEPT moves the evaluation to ATTESTED; RETURN clears the results
      back to DRAFT for correction. The attester must not be the performing audiologist.
    roles: [Audiologist]
    code: 200
    input: [decision, "note?"]
    output: DiagnosticEvaluation
    side_effects:
      - "on ACCEPT: attested_by_provider_id = X-User-ID, attestation_note stored, status -> ATTESTED"
      - "on RETURN: thresholds and outcome cleared to null, attestation_note stored, status -> DRAFT"
      - "rejects with ERR_SEGREGATION_OF_DUTIES when X-User-ID == performed_by_provider_id"
  - method: POST
    path: "/diagnostic-evaluations/{id}/finalize"
    description: >-
      Finalize an attested evaluation. The LOSS branch runs CASCADE C1 end to end (episode resolved,
      both infant dimensions advanced, EI referral minted, EI_LINKAGE navigation task assigned, risk
      recomputed); the NO_LOSS branch mints neither referral nor task.
    roles: [Audiologist]
    code: 200
    input: []
    output: DiagnosticEvaluation
    side_effects:
      - "status -> FINALIZED_LOSS or FINALIZED_NO_LOSS; finalized_at = logical clock; age_days_at_finalize written"
      - "timeliness_status (applied basis) and timeliness_status_chronological_basis (chronological variant) both written against the 90-day diagnostic benchmark"
      - "LOSS branch: episode -> RESOLVED_DIAGNOSED; infant.screening_status -> DIAGNOSED_LOSS; infant.intervention_status -> REFERRAL_DUE then REFERRED; EarlyInterventionReferral(PENDING) minted via calculations.ei_program_selector; EI_LINKAGE NavigationTask minted via calculations.navigator_selector; risk and band recomputed"
      - "NO_LOSS branch: episode -> RESOLVED_NO_LOSS; infant.screening_status -> DIAGNOSED_NO_LOSS; intervention_status untouched; no referral and no task created"
  - method: GET
    path: "/diagnostic-evaluations/{id}"
    description: Read one diagnostic evaluation including both timeliness variants.
    roles: [ProgramAdmin, ProgramAuditor, FacilityAdmin, Audiologist, Navigator, EICoordinator]
    code: 200
    input: []
    output: DiagnosticEvaluation
    side_effects: []
  - method: GET
    path: "/diagnostic-evaluations"
    description: >-
      Filtered evaluation list — reverse reachability for infant_id, episode_id, facility_id,
      performed_by_provider_id and attested_by_provider_id.
    roles: [ProgramAdmin, ProgramAuditor, FacilityAdmin, Audiologist, Navigator, EICoordinator]
    code: 200
    input: ["infant_id?", "episode_id?", "facility_id?", "performed_by_provider_id?", "attested_by_provider_id?", "status?", "limit?", "offset?"]
    output: "DiagnosticEvaluation[]"
    side_effects: []

  # ---------------------------------------------- EarlyInterventionReferral ---
  - method: POST
    path: "/ei-referrals/{id}/assign-program"
    description: >-
      Assign or re-assign the EI program on a referral the selector could not place (empty pool
      leaves ei_program_facility_id null).
    roles: [ProgramAdmin]
    code: 200
    input: [ei_program_facility_id]
    output: EarlyInterventionReferral
    side_effects:
      - "ei_program_facility_id written; status stays PENDING"
      - "rejects with ERR_FACILITY_TYPE_MISMATCH when the named facility is not facility_type EI_PROGRAM"
  - method: POST
    path: "/ei-referrals/{id}/decision"
    description: >-
      Program or family decision on a referral — ACCEPT, REJECT (returns the infant to REFERRAL_DUE
      and mints a replacement referral with the rejecting program excluded), or FAMILY_DECLINED.
    roles: [EICoordinator, Navigator]
    code: 200
    input: [decision, "reason?"]
    output: EarlyInterventionReferral
    side_effects:
      - "ACCEPT: status -> ACCEPTED, accepted_at = logical clock"
      - "REJECT: status -> REJECTED_BY_PROGRAM; infant.intervention_status -> REFERRAL_DUE; a replacement EarlyInterventionReferral(PENDING) is minted for the same diagnostic_evaluation_id with the rejecting facility excluded from calculations.ei_program_selector (null when the pool empties); infant.intervention_status -> REFERRED"
      - "FAMILY_DECLINED: status -> DECLINED_BY_FAMILY; infant.intervention_status -> DECLINED; any EI_LINKAGE NavigationTask in {UNASSIGNED, OPEN} -> CANCELLED, crediting its units back to the funding facility"
  - method: POST
    path: "/ei-referrals/{id}/enroll"
    description: Enroll the infant in early intervention by recording the IFSP date.
    roles: [EICoordinator]
    code: 200
    input: [ifsp_date]
    output: EarlyInterventionReferral
    side_effects:
      - "status -> ENROLLED; enrollment_age_days and ei_timeliness_status written against the 180-day benchmark under the applied age basis"
      - "infant.intervention_status -> ENROLLED"
      - "any OPEN EI_LINKAGE NavigationTask for this infant -> COMPLETED with outcome LINKED; its units_reserved stay consumed"
      - "recompute infant.ltf_risk_score and infant.priority_band"
  - method: GET
    path: "/ei-referrals/{id}"
    description: Read one early-intervention referral with enrollment timeliness.
    roles: [ProgramAdmin, ProgramAuditor, FacilityAdmin, Audiologist, Navigator, EICoordinator]
    code: 200
    input: []
    output: EarlyInterventionReferral
    side_effects: []
  - method: GET
    path: "/ei-referrals"
    description: >-
      Filtered referral list — reverse reachability for infant_id, diagnostic_evaluation_id and
      ei_program_facility_id; also the discovery channel for cascade-minted referrals.
    roles: [ProgramAdmin, ProgramAuditor, FacilityAdmin, Audiologist, Navigator, EICoordinator]
    code: 200
    input: ["infant_id?", "diagnostic_evaluation_id?", "ei_program_facility_id?", "status?", "limit?", "offset?"]
    output: "EarlyInterventionReferral[]"
    side_effects: []

  # ----------------------------------------------------------- RiskFactorEntry ---
  - method: POST
    path: "/risk-factor-entries"
    description: Register a JCIH delayed-onset risk factor on the surveillance registry.
    roles: [ProgramAdmin, FacilityAdmin, FacilityScreener, Audiologist]
    code: 201
    input: [infant_id, risk_factor_code, identified_at, "source?"]
    output: RiskFactorEntry
    side_effects:
      - "status ACTIVE; surveillance_due_date computed per calculations.surveillance_due_date (180 days for CMV/BACTERIAL_MENINGITIS/ECMO, else 270)"
      - "infant.risk_factor_count re-derived; recompute infant.ltf_risk_score and infant.priority_band"

  # ------------------------------------------------------------ NavigationTask ---
  - method: POST
    path: "/navigation-tasks"
    description: >-
      Create family-navigation work — outreach call, interpreter session, home visit, EI linkage or
      appointment navigation. Assign explicitly, auto-assign through the selector, or leave queued.
    roles: [ProgramAdmin, FacilityAdmin, Navigator]
    code: 201
    input: [infant_id, task_type, "episode_id?", "visit_starts_at?", "visit_ends_at?", "assigned_provider_id?", "auto_assign?"]
    output: NavigationTask
    side_effects:
      - "funding_facility_id copied from infant.birth_facility_id; units_reserved computed per calculations.navigation_units_cost and debited from that facility's navigation_budget_units_remaining"
      - "rejects with ERR_NAVIGATION_BUDGET_EXHAUSTED when the operator-initiated cost exceeds the remaining budget"
      - "with assigned_provider_id or auto_assign true: status -> OPEN, assigned_provider_id written (calculations.navigator_selector when auto), Provider.open_task_count re-derived"
      - "recompute infant.ltf_risk_score and infant.priority_band (a live task applies the -8 relief term)"
  - method: POST
    path: "/navigation-tasks/{id}/assign"
    description: >-
      Assign or reassign a queued task. Omitting assigned_provider_id runs
      calculations.navigator_selector; an empty candidate pool is rejected.
    roles: [ProgramAdmin, Navigator]
    code: 200
    input: ["assigned_provider_id?"]
    output: NavigationTask
    side_effects:
      - "status -> OPEN with assigned_provider_id written; Provider.open_task_count re-derived (+1)"
      - "rejects with ERR_NO_ELIGIBLE_NAVIGATOR when the selector pool is empty, ERR_NAVIGATOR_AT_CAPACITY when the named navigator is at max_open_tasks"
      - "recompute infant.ltf_risk_score and infant.priority_band"
  - method: POST
    path: "/navigation-tasks/{id}/close"
    description: >-
      Close a navigation task. COMPLETED consumes its reserved units; CANCELLED credits them back.
      Completing with outcome FAMILY_REENGAGED runs the loss-to-follow-up re-engagement cascade.
    roles: [ProgramAdmin, Navigator]
    code: 200
    input: [disposition, "outcome?", "contacted_language?", "reason?"]
    output: NavigationTask
    side_effects:
      - "COMPLETED: outcome and contacted_language recorded; units_reserved NOT released; Provider.open_task_count re-derived (-1)"
      - "CANCELLED: closure_note recorded; units_reserved credited back to Facility[funding_facility_id].navigation_budget_units_remaining (budget conservation)"
      - "outcome FAMILY_REENGAGED runs CASCADE C4: the infant's LOST_TO_FOLLOW_UP episode -> PENDING_SCHEDULING with closure_reason/closed_at cleared, infant.screening_status -> REFERRED, reengagement_count += 1, risk and band recomputed"
  - method: GET
    path: "/navigation-tasks/{id}"
    description: Read one navigation task with its reserved units and shortfall flag.
    roles: [ProgramAdmin, ProgramAuditor, FacilityAdmin, Audiologist, Navigator, EICoordinator]
    code: 200
    input: []
    output: NavigationTask
    side_effects: []
  - method: GET
    path: "/navigation-tasks"
    description: >-
      Filtered task list — reverse reachability for infant_id, episode_id, funding_facility_id and
      assigned_provider_id; the discovery channel for every cascade-minted task.
    roles: [ProgramAdmin, ProgramAuditor, FacilityAdmin, FacilityScreener, Audiologist, Navigator, EICoordinator]
    code: 200
    input: ["infant_id?", "episode_id?", "funding_facility_id?", "assigned_provider_id?", "status?", "task_type?", "limit?", "offset?"]
    output: "NavigationTask[]"
    side_effects: []

  # ----------------------------------------------------------- ReportingPeriod ---
  - method: POST
    path: "/reporting-periods"
    description: Open a reporting window. Windows are half-open and must not overlap an existing period.
    roles: [ProgramAdmin]
    code: 201
    input: [period_start, period_end, submission_due_datetime]
    output: ReportingPeriod
    side_effects:
      - "status OPEN; all three run counters 0"
  - method: POST
    path: "/reporting-periods/{id}/close"
    description: >-
      Ops-run checkpoint. Assesses every non-EI facility (auto-generating a non-filing report of
      record where nothing was filed), writes penalties and both performance-score variants,
      escalates the follow-up episodes of degraded facilities, sweeps episode timeliness and the
      loss-to-follow-up rule, and advances the surveillance registry — all in ascending created_at
      order.
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ReportingPeriod
    side_effects:
      - "per facility in ascending Facility.created_at order: mint the auto_generated ACCEPTED FacilityReport when nothing non-SUPERSEDED exists; auto-accept SUBMITTED/RETURNED_FOR_CORRECTION reports; write assessed_penalty_points per calculations.reporting_penalty_assessment; update penalty_points_balance and reporting_compliance_status; write performance_score and encounter_basis_performance_score; facilities_assessed_count += 1"
      - "CASCADE C2: episodes of infants of every facility that became PROBATION/SUSPENDED get escalation_flag true and owner_scope STATE_PROGRAM (episodes_escalated_count += 1 each), affected infants' risk and band are recomputed with the +6 escalation term, and an OUTREACH_CALL task is auto-assigned for each infant whose band became CRITICAL with no live task"
      - "episode timeliness sweep in ascending FollowUpEpisode.created_at order: past-benchmark PENDING_SCHEDULING episodes -> timeliness_status OVERDUE; past benchmark + 45 with attempt_count >= 3 -> LOST_TO_FOLLOW_UP, cascading infant.screening_status -> LOST_TO_FOLLOW_UP and episodes_lost_count += 1"
      - "registry sweep in ascending RiskFactorEntry.created_at order: ACTIVE -> SURVEILLANCE_DUE inside the 30-day window, ACTIVE/SURVEILLANCE_DUE -> SURVEILLANCE_OVERDUE past the due date"
      - "period.status -> CLOSED, closed_at = logical clock, Facility.last_closed_period_label written"
  - method: GET
    path: "/reporting-periods/{id}"
    description: Read one reporting period with its close-run counters.
    roles: [ProgramAdmin, ProgramAuditor, FacilityAdmin]
    code: 200
    input: []
    output: ReportingPeriod
    side_effects: []

  # ------------------------------------------------------------- FacilityReport ---
  - method: POST
    path: "/facility-reports"
    description: >-
      File a facility's attested screening counts for a period, optionally superseding a returned
      filing. OCC-guarded on the Facility per concurrency_rules.report-submit-stale-facility.
    roles: [FacilityAdmin]
    code: 201
    input: [facility_id, reporting_period_id, attested_screened_count, attested_refer_count, expected_facility_version, "supersedes_report_id?"]
    output: FacilityReport
    side_effects:
      - "rejects with ERR_STALE_FACILITY_VERSION (412) when expected_facility_version != Facility.version"
      - "actual_screened_count, actual_refer_count and variance_case_count computed from the period window; submitted_at = logical clock; submitted_late derived against submission_due_datetime"
      - "when supersedes_report_id is supplied, that report -> SUPERSEDED and drops out of the penalty assessment"
      - "increments Facility.version by 1"
  - method: POST
    path: "/facility-reports/{id}/review"
    description: Auditor review of a filing — ACCEPT freezes the counts, RETURN reopens it for a superseding correction.
    roles: [ProgramAuditor]
    code: 200
    input: [decision, "note?"]
    output: FacilityReport
    side_effects:
      - "ACCEPT: status -> ACCEPTED, accepted_by_user_id = X-User-ID, review_note stored, counts recomputed"
      - "RETURN: status -> RETURNED_FOR_CORRECTION, review_note stored, no penalty assessed"
  - method: POST
    path: "/facility-reports/{id}/waive-penalty"
    description: >-
      Waive an assessed penalty on an accepted report after its period closed. The waiving operator
      must not be the operator who accepted the report.
    roles: [ProgramAdmin]
    code: 200
    input: [waiver_reason]
    output: FacilityReport
    side_effects:
      - "status -> PENALTY_WAIVED with waiver_reason stored"
      - "Facility.penalty_points_balance -= assessed_penalty_points and reporting_compliance_status is re-derived from the new balance"
      - "increments Facility.version by 1"
      - "rejects with ERR_SEGREGATION_OF_DUTIES when X-User-ID == report.accepted_by_user_id"
  - method: GET
    path: "/facility-reports/{id}"
    description: Read one facility report with attested vs actual counts and the assessed penalty.
    roles: [ProgramAdmin, ProgramAuditor, FacilityAdmin]
    code: 200
    input: []
    output: FacilityReport
    side_effects: []
  - method: GET
    path: "/facility-reports"
    description: >-
      Filtered report list — reverse reachability for facility_id, reporting_period_id and the
      self-referential supersedes_report_id; the discovery channel for auto-generated reports.
    roles: [ProgramAdmin, ProgramAuditor, FacilityAdmin]
    code: 200
    input: ["facility_id?", "reporting_period_id?", "supersedes_report_id?", "status?", "auto_generated?", "limit?", "offset?"]
    output: "FacilityReport[]"
    side_effects: []

  # ---------------------------------------------------- test-driving endpoint ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: >-
      Set the server's logical clock, which every age, benchmark, window and deadline rule reads.
      The startup default is exactly 2026-08-01T00:00:00Z — before any call to this endpoint the
      logical clock reads that instant and never falls back to real wall-clock time.
    roles: [ProgramAdmin, ProgramAuditor, FacilityAdmin, FacilityScreener, Audiologist, Navigator, EICoordinator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "no entity is mutated; subsequent requests evaluate every temporal rule against the new instant"

# =============================================================================
# §1.6 Error Code Catalog — every id is triggerable by at least one endpoint
# =============================================================================

errors:
  # ---- authentication / authorization ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: X-User-Role or X-User-ID header missing, or the role is not one of the seven declared roles.
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: The acting role is not listed on the endpoint in §1.5.
  - id: ERR_IDENTITY_MISMATCH
    http: 403
    condition: >-
      X-User-ID does not resolve to the entity the role is backed by, or resolves to an instance that
      does not own/serve the addressed resource (facility of the report, provider of the encounter,
      EI coordinator of the referral's program).
  # ---- request shape ----
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: Missing required field, unknown enum value, out-of-range integer, malformed datetime, or a home-visit window supplied on a non-HOME_VISIT task.
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: limit outside 1..100 or offset < 0 on a list endpoint.
  # ---- existence ----
  - id: ERR_FACILITY_NOT_FOUND
    http: 404
    condition: A facility id in the path or body does not resolve.
  - id: ERR_PROVIDER_NOT_FOUND
    http: 404
    condition: A provider id in the path or body does not resolve.
  - id: ERR_INFANT_NOT_FOUND
    http: 404
    condition: An infant id in the path or body does not resolve.
  - id: ERR_ENCOUNTER_NOT_FOUND
    http: 404
    condition: A screening-encounter id in the path or in prior_encounter_id does not resolve.
  - id: ERR_EPISODE_NOT_FOUND
    http: 404
    condition: A follow-up-episode id in the path, episode_id or supersedes_episode_id does not resolve.
  - id: ERR_SLOT_NOT_FOUND
    http: 404
    condition: A clinic-slot id in the path or body does not resolve.
  - id: ERR_APPOINTMENT_NOT_FOUND
    http: 404
    condition: A rescreen-appointment id in the path or body does not resolve.
  - id: ERR_EVALUATION_NOT_FOUND
    http: 404
    condition: A diagnostic-evaluation id in the path or body does not resolve.
  - id: ERR_REFERRAL_NOT_FOUND
    http: 404
    condition: An early-intervention-referral id in the path does not resolve.
  - id: ERR_TASK_NOT_FOUND
    http: 404
    condition: A navigation-task id in the path or in linked_navigation_task_id does not resolve.
  - id: ERR_PERIOD_NOT_FOUND
    http: 404
    condition: A reporting-period id in the path or body does not resolve.
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: A facility-report id in the path or in supersedes_report_id does not resolve.
  # ---- optimistic concurrency ----
  - id: ERR_STALE_INFANT_VERSION
    http: 412
    condition: expected_infant_version on POST /follow-up-episodes does not equal the Infant's current version.
  - id: ERR_STALE_FACILITY_VERSION
    http: 412
    condition: expected_facility_version on POST /facility-reports does not equal the Facility's current version.
  # ---- state preconditions ----
  - id: ERR_INFANT_ALREADY_DISCHARGED
    http: 409
    condition: POST /infants/{id}/discharge on an infant whose discharge_datetime is already set.
  - id: ERR_EPISODE_NOT_SCHEDULABLE
    http: 409
    condition: >-
      The target episode is not in a state that permits the operation — booking needs
      PENDING_SCHEDULING, administrative close needs PENDING_SCHEDULING or SCHEDULED, and a linked
      encounter needs SCHEDULED or ESCALATED_DIAGNOSTIC.
  - id: ERR_APPOINTMENT_NOT_OPEN
    http: 409
    condition: The addressed or referenced appointment is not BOOKED (already ATTENDED, NO_SHOW or CANCELLED).
  - id: ERR_EVALUATION_INVALID_STATE
    http: 409
    condition: submit on a non-DRAFT evaluation, attest on a non-PENDING_ATTESTATION evaluation, or finalize on a non-ATTESTED evaluation.
  - id: ERR_REFERRAL_INVALID_STATE
    http: 409
    condition: >-
      A referral action is illegal for its status — accept/reject needs PENDING, enroll needs
      ACCEPTED, family-decline needs PENDING or ACCEPTED, assign-program needs a null
      ei_program_facility_id.
  - id: ERR_TASK_INVALID_STATE
    http: 409
    condition: assign on a task that is not UNASSIGNED, or close on a task already COMPLETED or CANCELLED.
  - id: ERR_REPORT_INVALID_STATE
    http: 409
    condition: review on a report that is not SUBMITTED/RETURNED_FOR_CORRECTION, or waive-penalty on a report that is not ACCEPTED with assessed_penalty_points > 0.
  - id: ERR_PERIOD_ALREADY_CLOSED
    http: 409
    condition: A period-scoped action addresses a ReportingPeriod whose status is already CLOSED (or a review whose period has closed).
  - id: ERR_EARLIER_PERIOD_OPEN
    http: 409
    condition: Closing a period while an earlier period (period_end <= this period_start) is still OPEN.
  - id: ERR_FACILITY_SUSPENDED
    http: 409
    condition: Recording a screening encounter at, or finalizing a diagnostic evaluation for, a facility whose reporting_compliance_status is SUSPENDED.
  # ---- safety / compliance ----
  - id: ERR_GUARDIAN_CONSENT_REFUSED
    http: 422
    condition: Submitting diagnostic results for an infant whose guardian_consent_status is REFUSED.
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: The attesting audiologist is the performing audiologist, or the waiving operator is the operator who accepted the report.
  - id: ERR_OUTCOME_THRESHOLD_MISMATCH
    http: 422
    condition: The submitted outcome contradicts the ear thresholds under the 25 dB rule.
  - id: ERR_NO_OPEN_RISK_FACTOR
    http: 422
    condition: A SURVEILLANCE encounter is recorded for an infant with no ACTIVE/SURVEILLANCE_DUE/SURVEILLANCE_OVERDUE registry entry.
  # ---- referential fitness ----
  - id: ERR_PROVIDER_NOT_CREDENTIALED
    http: 409
    condition: A referenced provider's credential_status is LAPSED or SUSPENDED.
  - id: ERR_PROVIDER_TYPE_MISMATCH
    http: 409
    condition: The referenced provider's provider_type does not fit the operation (screener/audiologist/navigator/EI coordinator).
  - id: ERR_SLOT_TYPE_MISMATCH
    http: 409
    condition: The slot's slot_type does not match the episode_type being booked (RESCREEN vs DIAGNOSTIC).
  - id: ERR_LINKAGE_MISMATCH
    http: 409
    condition: >-
      Cross-references disagree — the encounter's episode belongs to another infant, the appointment
      belongs to another episode, or a supersedes_* id belongs to another infant/facility+period.
  - id: ERR_INFANT_NOT_REFERRED
    http: 409
    condition: Diagnostic results are submitted for an infant whose screening_status is not REFERRED or DIAGNOSTIC_IN_PROGRESS.
  - id: ERR_FACILITY_TYPE_MISMATCH
    http: 409
    condition: The facility's facility_type does not fit its role in the request (EI program named as a birth facility, non-EI program named as an EI program, non-clinic publishing slots).
  # ---- temporal ----
  - id: ERR_BIRTH_DATETIME_IN_FUTURE
    http: 422
    condition: birth_datetime is later than the logical clock.
  - id: ERR_TIMESTAMP_OUT_OF_RANGE
    http: 422
    condition: An event instant (performed_at, evaluation_datetime, identified_at, discharge_datetime, ifsp_date) falls before the infant's birth or after the logical clock.
  - id: ERR_SLOT_IN_PAST
    http: 422
    condition: The slot being booked starts at or before the logical clock.
  - id: ERR_PERIOD_NOT_ENDED
    http: 422
    condition: Closing a reporting period before the logical clock reaches its period_end.
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: ends_at <= starts_at, visit_ends_at <= visit_starts_at, period_end <= period_start, or submission_due_datetime < period_end.
  - id: ERR_PERIOD_OVERLAP
    http: 409
    condition: The new reporting window intersects an existing period's half-open window.
  # ---- constraint ----
  - id: ERR_SLOT_OVERLAP
    http: 409
    condition: The staffing provider already holds a clinic slot whose half-open window intersects the new one.
  - id: ERR_FAMILY_BURDEN_BUFFER
    http: 409
    condition: The infant already has a live appointment whose slot starts strictly within 24 hours of the requested slot.
  - id: ERR_NAVIGATOR_TRAVEL_BUFFER
    http: 409
    condition: The chosen navigator already holds a live home visit whose window is within 45 minutes of the requested window.
  - id: ERR_ATTEMPT_LIMIT_REACHED
    http: 409
    condition: The episode already has 3 counted appointment attempts.
  - id: ERR_ACTIVE_EPISODE_EXISTS
    http: 409
    condition: The infant already has an episode in PENDING_SCHEDULING/SCHEDULED/ESCALATED_DIAGNOSTIC and supersedes_episode_id was not supplied.
  - id: ERR_DUPLICATE_BIRTH_SCREEN
    http: 409
    condition: A second BIRTH_ADMISSION encounter is recorded for the same infant.
  - id: ERR_DUPLICATE_REPORT
    http: 409
    condition: A non-SUPERSEDED report already exists for the (facility, period) pair and supersedes_report_id was not supplied.
  - id: ERR_NEGATIVE_PENALTY_BALANCE
    http: 422
    condition: A penalty adjustment would drive the facility's penalty_points_balance below 0.
  # ---- capacity / budget ----
  - id: ERR_SLOT_FULL
    http: 409
    condition: The slot's remaining_capacity is 0 (status FULL).
  - id: ERR_NAVIGATION_BUDGET_EXHAUSTED
    http: 409
    condition: The funding facility's navigation_budget_units_remaining is smaller than the operator-initiated task's required units.
  - id: ERR_NO_ELIGIBLE_NAVIGATOR
    http: 409
    condition: An operator-initiated auto-assignment found no navigator satisfying type, credential, region, workload and language eligibility.
  - id: ERR_NAVIGATOR_AT_CAPACITY
    http: 409
    condition: The explicitly named navigator already holds max_open_tasks OPEN tasks.

# =============================================================================
# §1.7 RBAC Matrix — segregation of duties (attestation and penalty waiver)
# =============================================================================

roles:
  - name: ProgramAdmin
    description: State EHDI program operator — registry setup, period closes, EI placement overrides and penalty administration.
    identity: opaque
    exclusive_operations:
      - "POST /facilities"
      - "POST /facilities/{id}/penalty-adjustments"
      - "POST /reporting-periods"
      - "POST /reporting-periods/{id}/close"
      - "POST /ei-referrals/{id}/assign-program"
      - "POST /facility-reports/{id}/waive-penalty"
    shared_operations:
      - "POST /providers, POST /infants, POST /infants/{id}/discharge, PATCH /infants/{id}/contact-preferences"
      - "POST /follow-up-episodes, POST /follow-up-episodes/{id}/close, POST /clinic-slots"
      - "POST /rescreen-appointments, POST /rescreen-appointments/{id}/close"
      - "POST /diagnostic-evaluations, POST /risk-factor-entries"
      - "POST /navigation-tasks, POST /navigation-tasks/{id}/assign, POST /navigation-tasks/{id}/close"
      - "every GET endpoint and POST /_clock/set_current_utc"
  - name: ProgramAuditor
    description: State compliance auditor — reviews facility filings and reads every dashboard, but never files, never closes a period and never waives a penalty.
    identity: opaque
    exclusive_operations:
      - "POST /facility-reports/{id}/review"
    shared_operations:
      - "every GET endpoint and POST /_clock/set_current_utc"
  - name: FacilityAdmin
    description: Birth facility or audiology clinic administrator — registers providers and infants, publishes slots, files period reports.
    identity: "entity_backed:Facility"
    exclusive_operations:
      - "POST /facility-reports"
    shared_operations:
      - "POST /providers, POST /infants, POST /infants/{id}/discharge, PATCH /infants/{id}/contact-preferences"
      - "POST /follow-up-episodes, POST /clinic-slots, POST /rescreen-appointments, POST /rescreen-appointments/{id}/close"
      - "POST /diagnostic-evaluations, POST /risk-factor-entries, POST /navigation-tasks"
      - "GET endpoints for facilities, providers, infants, encounters, episodes, slots, appointments, evaluations, referrals, tasks, periods and reports; POST /_clock/set_current_utc"
  - name: FacilityScreener
    description: Birth-facility screening technician — records physiologic screens and registers newborns.
    identity: "entity_backed:Provider"
    exclusive_operations: []
    shared_operations:
      - "POST /screening-encounters (with Audiologist)"
      - "POST /infants, POST /infants/{id}/discharge, POST /risk-factor-entries"
      - "GET endpoints for facilities, providers, infants, encounters, episodes, slots, appointments and tasks; POST /_clock/set_current_utc"
  - name: Audiologist
    description: Diagnostic audiologist — performs, attests and finalizes evaluations and runs surveillance screens. Attestation is segregated from performance.
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /diagnostic-evaluations/{id}/submit"
      - "POST /diagnostic-evaluations/{id}/attest"
      - "POST /diagnostic-evaluations/{id}/finalize"
    shared_operations:
      - "POST /screening-encounters (with FacilityScreener), POST /diagnostic-evaluations, POST /risk-factor-entries"
      - "GET endpoints for facilities, providers, infants, encounters, episodes, slots, appointments, evaluations, referrals and tasks; POST /_clock/set_current_utc"
  - name: Navigator
    description: Family navigator — books and closes appointments, works navigation tasks, records family declines and opens follow-up episodes.
    identity: "entity_backed:Provider"
    exclusive_operations: []
    shared_operations:
      - "POST /follow-up-episodes, POST /follow-up-episodes/{id}/close"
      - "POST /rescreen-appointments, POST /rescreen-appointments/{id}/close"
      - "POST /navigation-tasks, POST /navigation-tasks/{id}/assign, POST /navigation-tasks/{id}/close"
      - "PATCH /infants/{id}/contact-preferences, POST /ei-referrals/{id}/decision (FAMILY_DECLINED only)"
