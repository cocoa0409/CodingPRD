              as: LogisticsPlanner
              as_user_id: "planner-1"
          assert:
            - "at the end of setup Shipment.${shp}.status == \"SEALED\", sealed_at == \"2026-08-01T14:00:00Z\", nested_cube_m3 == 3.0000, loaded_cube_m3 == 4.0000, cube_utilization_pct == 60.00 and quoted_freight_cents == 23325"
            - "the unseal returns 200 with Shipment.${shp}.status == \"LOADING\" — the documented BACKWARD edge SEALED -> LOADING"
            - "immediately after the unseal Shipment.${shp}.quoted_freight_cents is null and sealed_at is null: the backward edge DESTROYS both derived fields instead of leaving the stale 23325 in place"
            - "the unseal leaves the cube rollup untouched (nested_cube_m3 still 3.0000, cube_utilization_pct still 60.00) and both existing lines still LOADED at nest_position 1 and 2, and FinishedUnit.${fu1}.logistics_status and FinishedUnit.${fu2}.logistics_status are both still \"LOADED\" — only the Shipment moved backward"
            - "the third line is accepted because the admission test uses the rounded post-add value: round(3.0000 + 1.0000, 4) == 4.0000 <= trailer_cube_capacity_m3 5.0000 and round(48.000 + 24.000, 3) == 72.000 <= trailer_max_payload_kg 200.000; ShipmentLine.${sl3}.nest_position == 3, line_gross_cube_m3 == 2.0000 and line_nested_cube_m3 == 1.0000 == round(2.0000 * 0.5000, 4)"
            - "after the third line Shipment.${shp}.nested_cube_m3 == 4.0000, loaded_cube_m3 == 6.0000, loaded_weight_kg == 72.000, cube_utilization_pct == 80.00 == round(4.0000 / 5.0000 * 100, 2) and density_kg_per_m3 == 18.000 == round(72.000 / 4.0000, 3)"
            - "the second seal returns 200, Shipment.${shp}.status is \"SEALED\" again and sealed_at == \"2026-08-01T15:00:00Z\" — the SAME state is re-entered with a DIFFERENT stamp"
            - "Shipment.${shp}.quoted_freight_cents == 29657 on the second seal: per-line 14640 + 7320 + 7320 == 29280 (each line's chargeable_kg is max(unit_weight_kg 24.000, round(nested_cube * 120.000, 3)), so 240.000 * 61 and 120.000 * 61), then the 75.00 discount tier at 7.50 percent gives round_half_up(29280 * 7.50 / 100) == 2196, after_discount 27084, fuel round_half_up(27084 * 9.50 / 100) == 2573, total 27084 + 2573"
            - "29657 is NOT 23325 (the pre-unseal quote is not restored), NOT 23325 + 7320 == 30645 (the quote is not incrementally patched), and NOT 30645 - round_half_up(30645 * 7.50 / 100) == 28347 — the whole quote is recomputed from scratch over the new line set with a re-selected tier"
            - "the tier re-selection is the load-bearing consequence of the revert: utilization moved 60.00 -> 80.00, so the row chosen changed from {min_utilization_pct 60.00, rate_pct 3.00} to {min_utilization_pct 75.00, rate_pct 7.50}, and holding the first tier would have produced 29280 - 878 + 2698 == 31100 instead"

  # ===========================================================================
  # RULE 4 — transitive_cascade
  # One chain of depth 5 (CASCADE-B, triggered by COOLING -> DEMOLDED) and one
  # of depth 3 (CASCADE-D, triggered by SELLABLE -> REWORK): different
  # triggering transitions, and every `assert:` pins the TERMINAL effect.
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: demold_service_cascade_unblocks_three_resin_blocked_orders
        grounds:
          - state_machines.MoldingCycle.COOLING_to_DEMOLDED
          - state_machines.Mold.AVAILABLE_to_MAINTENANCE
          - state_machines.MoldingCycle.SCHEDULED_to_ABORTED
          - state_machines.ResinCharge.RESERVED_to_RELEASED
          - state_machines.ResinLot.DEPLETED_to_AVAILABLE
          - state_machines.ProductionOrder.BLOCKED_RESIN_to_READY_TO_SCHEDULE
          - calculations.mold_service_counter
          - calculations.qualified_resin_lot_count
          - calculations.mold_selection
        distinguishing_aspect: |
          Depth 5, and the triggering transition is MoldingCycle
          COOLING -> DEMOLDED — a SUCCESSFUL cycle completion, not a failure
          and not a re-inspection. Each link is caused strictly by the previous
          one: the service counter reaching its interval demotes the mould, the
          demoted mould aborts its OTHER scheduled cycle, that abort releases a
          reserved charge, the returned mass revives a DEPLETED lot, and the
          revived lot unblocks three BLOCKED_RESIN orders. Nothing in the
          demold request mentions moulds, lots or orders.
        test_recipe:
          setup:
            - "ProductModel PM-CASB-KM with nominal_charge_kg 12.000 and charge_tolerance_pct 5.00, so a lot qualifies only while available_kg >= round(12.000 * 0.95, 3) == 11.400."
            - "ONE Mold MLD-CASB-1 (cavity_count 1, nominal_charge_kg 12.000) with service_interval_cycles 1, so the very first demould drives cycles_since_service to 1 == the interval and fires CASCADE-B link 1."
            - "THREE ResinLots, all qualified on grade, additive, colour, melt index and regrind: LOT-CASB-A with received_kg 12.500, LOT-CASB-B with received_kg 12.000, and LOT-CASB-TMP with received_kg 12.000 and expires_on 2026-08-02 (the other two expire 2035-12-31)."
            - "Three single-unit orders PO-CASB-1, PO-CASB-2 and PO-CASB-3 on the same model and the same target site WH-CASB (20.0000 in one zone, posture NORMAL, so no order can be BLOCKED_WAREHOUSE). All three are released while LOT-CASB-TMP still keeps qualified_resin_lot_count >= 1, so all three reach READY_TO_SCHEDULE."
            - "PO-CASB-1 gets cycle CYC-CASB-1 (oven 2026-08-03T09:00-10:00, cooling to 10:30) charged 12.000 kg from LOT-CASB-A, which leaves that lot at available_kg 0.500 — still status AVAILABLE (only exactly 0.000 depletes) but NO LONGER qualified because 0.500 < 11.400."
            - "PO-CASB-2 gets cycle CYC-CASB-2 (oven 2026-08-03T11:00-12:00, a disjoint half-open span on the same arm and the same mould) charged 12.000 kg from LOT-CASB-B, which drives that lot to exactly 0.000 and status DEPLETED. Creating a cycle moved PO-CASB-1 and PO-CASB-2 to IN_PRODUCTION; PO-CASB-3 has no cycle and stays READY_TO_SCHEDULE."
            - "The clock is then advanced to 2026-08-03T00:00:00Z. LOT-CASB-TMP.expires_on 2026-08-02 is strictly before that date, so CASCADE-G link 2 expires it; it holds no charges, so links 3 and 4 are vacuous, and link 5 finds qualified_resin_lot_count == 0 (A unqualified on mass, B DEPLETED, TMP EXPIRED) and sends ALL THREE orders to BLOCKED_RESIN with blocked_reason NO_QUALIFIED_RESIN_LOT."
            - "CYC-CASB-1 is then started at 09:00 (legal because LOT-CASB-A is still status AVAILABLE, which is what start-oven checks — not qualification) and put into cooling at 10:00, so at the end of setup CYC-CASB-1 is COOLING, the mould is IN_CYCLE with cycles_since_service 0, CYC-CASB-2 is SCHEDULED holding a RESERVED charge, and all three orders are BLOCKED_RESIN."
          setup_api_calls:
            - call: "POST /product-models"
              payload: { model_code: "PM-CASB-KM", hull_type: "KAYAK", size_class: "MID", resin_grade: "HDPE_LINEAR", master_color_code: "IVORY", max_color_delta_e: 1.50, required_additive_package_code: "UV12", max_regrind_pct: 30.00, min_melt_index_g10min: 2.50, max_melt_index_g10min: 6.00, nominal_charge_kg: 12.000, charge_tolerance_pct: 5.00, min_cooling_minutes: 30, target_wall_thickness_mm: 6.00, wall_thickness_min_mm: 4.50, wall_cv_max_pct: 12.00, impact_test_min_joules: 90.00, gross_cube_m3: 2.0000, nest_factor: 0.5000, unit_weight_kg: 24.000, msrp_cents: 300000, warranty_basis: "FLAT", initial_warranty_reserve_cents: 500000, seasonal_family: "PADDLE" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pm: $.data.id }
            - call: "POST /molds"
