  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_header_returns_401
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
        distinguishing_aspect: "p1 auth precedes everything: a request with no X-User-Role header fails ERR_UNAUTHENTICATED 401 even when the path id does not exist (auth beats existence)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /plans/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: __NO_ROLE_HEADER__
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED (401), not a 404 — priority 1 beats priority 3"

      - name: plan_not_found_returns_404
        claim_type: Violation → Error
        grounds:
          - validations[priority=3]
          - errors[ERR_PLAN_NOT_FOUND]
        distinguishing_aspect: "Existence: GET on a well-formed but unknown plan id returns ERR_PLAN_NOT_FOUND 404 with the standard error envelope."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /plans/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: UtilityPlanner
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PLAN_NOT_FOUND (404); response_type == error and data.message present"

      - name: duplicate_forecast_triple_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=7]
          - errors[ERR_DUPLICATE_FORECAST]
        distinguishing_aspect: "Uniqueness key (plan, scenario_tag, forecast_year): the second BASE/2030 row under the same plan fails 409; the same triple under a DIFFERENT plan succeeds."
        test_recipe:
          setup: ["Plans P1 and P2 DRAFT; P1 already has a BASE/2030 forecast."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "IRP DupF1", cycle_year: 2026, planning_horizon_years: 15 }
              as: UtilityPlanner
              captures: { p1: $.data.id }
            - call: "POST /plans"
              payload: { plan_name: "IRP DupF2", cycle_year: 2026, planning_horizon_years: 15 }
              as: UtilityPlanner
              captures: { p2: $.data.id }
            - call: "POST /plans/${p1}/forecasts"
              payload: { scenario_tag: "BASE", forecast_year: 2030, residential_mw: 10, commercial_mw: 0, industrial_mw: 0, electrification_mw: 0 }
              as: UtilityPlanner
          trigger:
            - call: "POST /plans/${p1}/forecasts"
              payload: { scenario_tag: "BASE", forecast_year: 2030, residential_mw: 20, commercial_mw: 0, industrial_mw: 0, electrification_mw: 0 }
              as: UtilityPlanner
              captures: { err: $.data.error_id }
            - call: "POST /plans/${p2}/forecasts"
              payload: { scenario_tag: "BASE", forecast_year: 2030, residential_mw: 20, commercial_mw: 0, industrial_mw: 0, electrification_mw: 0 }
              as: UtilityPlanner
              captures: { ok_id: $.data.id }
          assert:
            - "same-plan duplicate fails with ERR_DUPLICATE_FORECAST (409)"
            - "same triple under a different plan succeeds (201)"

      - name: preferred_portfolio_conflict_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=7]
          - errors[ERR_PREFERRED_PORTFOLIO_CONFLICT]
        distinguishing_aspect: "At-most-one preferred portfolio per plan: the second create with preferred_flag true fails ERR_PREFERRED_PORTFOLIO_CONFLICT (409); a non-preferred second portfolio succeeds."
        test_recipe:
          setup: ["Plan P DRAFT with one preferred portfolio."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "IRP Pref", cycle_year: 2026, planning_horizon_years: 15 }
              as: UtilityPlanner
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/portfolios"
              payload: { portfolio_name: "PF-1", preferred_flag: true }
              as: UtilityPlanner
          trigger:
            - call: "POST /plans/${plan_id}/portfolios"
              payload: { portfolio_name: "PF-2", preferred_flag: true }
              as: UtilityPlanner
              captures: { err: $.data.error_id }
            - call: "POST /plans/${plan_id}/portfolios"
              payload: { portfolio_name: "PF-3", preferred_flag: false }
              as: UtilityPlanner
              captures: { ok_id: $.data.id }
          assert:
            - "second preferred portfolio fails ERR_PREFERRED_PORTFOLIO_CONFLICT (409)"
            - "non-preferred second portfolio is created (201)"

      - name: duplicate_candidate_name_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=7]
          - errors[ERR_DUPLICATE_CANDIDATE_NAME]
        distinguishing_aspect: "Candidate names are globally unique case-sensitively: re-posting the same candidate_name fails ERR_DUPLICATE_CANDIDATE_NAME; a name differing only by case succeeds."
        test_recipe:
          setup: ["Candidate 'K-DUP' registered."]
          setup_api_calls:
            - call: "POST /candidates"
              payload: { candidate_name: "K-DUP", resource_type: "SOLAR", nameplate_mw: 100, online_year: 2028, capex_usd_per_kw: 900, fixed_om_usd_per_kw_year: 10, fuel_type: "SUN", build_lead_years: 2 }
              as: UtilityPlanner
          trigger:
            - call: "POST /candidates"
              payload: { candidate_name: "K-DUP", resource_type: "WIND", nameplate_mw: 50, online_year: 2029, capex_usd_per_kw: 1100, fixed_om_usd_per_kw_year: 20, fuel_type: "WIND", build_lead_years: 2 }
              as: UtilityPlanner
              captures: { err: $.data.error_id }
            - call: "POST /candidates"
              payload: { candidate_name: "k-dup", resource_type: "WIND", nameplate_mw: 50, online_year: 2029, capex_usd_per_kw: 1100, fixed_om_usd_per_kw_year: 20, fuel_type: "WIND", build_lead_years: 2 }
              as: UtilityPlanner
              captures: { ok_id: $.data.id }
          assert:
            - "exact duplicate name fails ERR_DUPLICATE_CANDIDATE_NAME (409)"
            - "case-variant name succeeds (201) — uniqueness is case-sensitive"

      - name: duplicate_position_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=7]
          - errors[ERR_DUPLICATE_POSITION]
        distinguishing_aspect: "One selected position per (portfolio, candidate): the second add of the same candidate to the same portfolio fails ERR_DUPLICATE_POSITION, but after DELETE (selected=false) the pair can be re-added."
        test_recipe:
          setup: ["Plan P DRAFT; portfolio PF; candidate K; one selected position (K in PF) exists."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "IRP DupP", cycle_year: 2026, planning_horizon_years: 15 }
              as: UtilityPlanner
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/portfolios"
              payload: { portfolio_name: "PF-DupP" }
              as: UtilityPlanner
              captures: { pf_id: $.data.id }
            - call: "POST /candidates"
              payload: { candidate_name: "K-DUPP", resource_type: "SOLAR", nameplate_mw: 100, online_year: 2028, capex_usd_per_kw: 900, fixed_om_usd_per_kw_year: 10, fuel_type: "SUN", build_lead_years: 2 }
              as: UtilityPlanner
              captures: { cand_id: $.data.id }
            - call: "POST /portfolios/${pf_id}/positions"
              payload: { candidate_id: "${cand_id}", committed_mw: 30 }
              as: UtilityPlanner
              captures: { pos_id: $.data.id }
          trigger:
            - call: "POST /portfolios/${pf_id}/positions"
              payload: { candidate_id: "${cand_id}", committed_mw: 20 }
              as: UtilityPlanner
              captures: { err: $.data.error_id }
            - call: "DELETE /portfolios/${pf_id}/positions/${pos_id}"
              payload: {}
              as: UtilityPlanner
            - call: "POST /portfolios/${pf_id}/positions"
              payload: { candidate_id: "${cand_id}", committed_mw: 20 }
              as: UtilityPlanner
              captures: { pos2_id: $.data.id }
          assert:
            - "duplicate selected position fails ERR_DUPLICATE_POSITION (409)"
            - "after soft-removal the pair is addable again (201); the old row remains queryable with selected == false"

      - name: intervenor_no_standing_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=8]
          - errors[ERR_INTERVENOR_NO_STANDING]
        distinguishing_aspect: "An intervenor registered with standing_approved=false may not file testimony even when acting as itself and the plan is UNDER_REVIEW — ERR_INTERVENOR_NO_STANDING 422."
        test_recipe:
