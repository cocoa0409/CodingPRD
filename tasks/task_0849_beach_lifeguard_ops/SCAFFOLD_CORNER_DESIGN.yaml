# =============================================================================
# task_0849 — §1.9 Scaffold Corner Design (breadth coverage of non-difficulty claims)
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: corner_beach_create_returns_201_with_fields
        claim_type: creation
        grounds: [entities.Beach, endpoints]
        distinguishing_aspect: "POST /beach-ops/beaches with all required fields returns 201 and echoes name/town_code/season dates plus system id/version."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id, ver: $.data.version }
          assert:
            - "response HTTP status == 201"
            - "Beach.name == 'Ocean Park'"
            - "Beach.version == 1"

      - name: corner_beach_missing_town_code_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Beach.fields.town_code, "validations[priority=4]"]
        distinguishing_aspect: "POST /beach-ops/beaches omitting town_code returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: corner_zone_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds: [entities.Zone, "validations[priority=3]"]
        distinguishing_aspect: "GET /beach-ops/zones/{id} for a random unknown UUID returns 404 ERR_RESOURCE_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /beach-ops/zones/00000000-0000-4000-8000-000000000000"
              as: Public
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_RESOURCE_NOT_FOUND"

      - name: corner_zone_defaults_on_create
        claim_type: defaults
        grounds:
          - entities.Zone.fields.flag_status
          - entities.Zone.fields.water_status
          - entities.Zone.fields.rip_current_level
          - entities.Zone.fields.on_duty_guard_count
        distinguishing_aspect: "A freshly created Zone defaults to flag_status RED, water_status OPEN, rip_current_level LOW, on_duty_guard_count 0."
        test_recipe:
          setup: ["One beach."]
          setup_api_calls:
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
          trigger:
            - call: "POST /beach-ops/zones"
              payload: { beach_id: "${beach_id}", name: "North Cove" }
              as: BeachCaptain
              captures: { flag: $.data.flag_status, water: $.data.water_status, rip: $.data.rip_current_level, count: $.data.on_duty_guard_count }
          assert:
            - "Zone.flag_status == RED"
            - "Zone.water_status == OPEN"
            - "Zone.rip_current_level == LOW"
            - "Zone.on_duty_guard_count == 0"

      - name: corner_sample_immutable_common_fields_false
        claim_type: immutability
        grounds: [entities.WaterQualitySample]
        distinguishing_aspect: "WaterQualitySample is common_fields:false — created with id/created_at only, no version, and no update endpoint exists."
        test_recipe:
          setup: ["One beach + zone."]
          setup_api_calls:
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
            - call: "POST /beach-ops/zones"
              payload: { beach_id: "${beach_id}", name: "North Cove" }
              as: BeachCaptain
              captures: { zone_id: $.data.id }
          trigger:
            - call: "POST /beach-ops/water-quality-samples"
              payload: { zone_id: "${zone_id}", enterococci_mpn: 20, sampled_at: "2026-07-15T08:00:00Z", lab_ref: "L1", technician: "T" }
              as: WaterQualityInspector
              captures: { sample_id: $.data.id }
          assert:
            - "WaterQualitySample response carries id and created_at but no version field"
            - "no PUT/PATCH endpoint for WaterQualitySample exists in §1.5"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: corner_shift_clockout_from_scheduled_invalid
        claim_type: invalid_transition
        grounds: [state_machines.Shift, "validations[priority=8]"]
        distinguishing_aspect: "CLOCK_OUT on a SCHEDULED shift (never clocked in) returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["beach/zone/tower/lifeguard; one SCHEDULED shift."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T09:00:00Z" }
              as: BeachCaptain
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
            - call: "POST /beach-ops/zones"
              payload: { beach_id: "${beach_id}", name: "North Cove", min_guards_required: 1 }
              as: BeachCaptain
              captures: { zone_id: $.data.id }
            - call: "POST /beach-ops/towers"
              payload: { zone_id: "${zone_id}", label: "T4", max_concurrent_guards: 2 }
              as: BeachCaptain
              captures: { tower_id: $.data.id }
            - call: "POST /beach-ops/lifeguards"
              payload: { beach_id: "${beach_id}", name: "Ana", certification_level: "SENIOR", employee_ref: "E1" }
              as: BeachCaptain
              captures: { lg_id: $.data.id }
            - call: "POST /beach-ops/shifts"
              payload: { lifeguard_id: "${lg_id}", tower_id: "${tower_id}", scheduled_start: "2026-07-15T09:00:00Z", scheduled_end: "2026-07-15T17:00:00Z" }
              as: BeachCaptain
              captures: { shift_id: $.data.id }
          trigger:
            - call: "POST /beach-ops/shifts/${shift_id}/transitions"
              payload: { action: "CLOCK_OUT" }
              as: Lifeguard
              as_user_id: "${lg_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: corner_shift_double_clockin_invalid
        claim_type: idempotency
        grounds: [state_machines.Shift.SCHEDULED_to_ON_DUTY, "validations[priority=8]"]
        distinguishing_aspect: "A second CLOCK_IN on an already ON_DUTY shift returns 409 ERR_INVALID_STATE (no SCHEDULED->ON_DUTY from ON_DUTY)."
        test_recipe:
          setup: ["beach/zone/tower/lifeguard; shift; first CLOCK_IN done."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T09:00:00Z" }
              as: BeachCaptain
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
            - call: "POST /beach-ops/zones"
              payload: { beach_id: "${beach_id}", name: "North Cove", min_guards_required: 1 }
              as: BeachCaptain
              captures: { zone_id: $.data.id }
            - call: "POST /beach-ops/towers"
              payload: { zone_id: "${zone_id}", label: "T4", max_concurrent_guards: 2 }
              as: BeachCaptain
              captures: { tower_id: $.data.id }
            - call: "POST /beach-ops/lifeguards"
              payload: { beach_id: "${beach_id}", name: "Ana", certification_level: "SENIOR", employee_ref: "E1" }
              as: BeachCaptain
              captures: { lg_id: $.data.id }
            - call: "POST /beach-ops/shifts"
              payload: { lifeguard_id: "${lg_id}", tower_id: "${tower_id}", scheduled_start: "2026-07-15T09:00:00Z", scheduled_end: "2026-07-15T17:00:00Z" }
              as: BeachCaptain
              captures: { shift_id: $.data.id }
            - call: "POST /beach-ops/shifts/${shift_id}/transitions"
              payload: { action: "CLOCK_IN" }
              as: Lifeguard
              as_user_id: "${lg_id}"
          trigger:
            - call: "POST /beach-ops/shifts/${shift_id}/transitions"
              payload: { action: "CLOCK_IN" }
              as: Lifeguard
              as_user_id: "${lg_id}"
              captures: { err: $.data.error_id }
          assert:
            - "second CLOCK_IN response.data.error_id == ERR_INVALID_STATE"

      - name: corner_incident_close_from_open_invalid
        claim_type: invalid_transition
        grounds: [state_machines.Incident, "validations[priority=8]"]
        distinguishing_aspect: "CLOSE directly from OPEN returns 409 ERR_INVALID_STATE (CLOSE only from RESOLVED_ON_SCENE/ESCALATED_EMS/REUNITED)."
        test_recipe:
          setup: ["beach/zone/lifeguard; one OPEN incident."]
          setup_api_calls:
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
            - call: "POST /beach-ops/zones"
              payload: { beach_id: "${beach_id}", name: "North Cove", min_guards_required: 1 }
              as: BeachCaptain
              captures: { zone_id: $.data.id }
            - call: "POST /beach-ops/lifeguards"
              payload: { beach_id: "${beach_id}", name: "Ana", certification_level: "SENIOR", employee_ref: "E1" }
              as: BeachCaptain
              captures: { lg_id: $.data.id }
            - call: "POST /beach-ops/incidents"
              payload: { zone_id: "${zone_id}", type: "RESCUE", occurred_at: "2026-07-15T10:00:00Z", description: "swimmer distress", lifeguard_id: "${lg_id}" }
              as: Lifeguard
              as_user_id: "${lg_id}"
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /beach-ops/incidents/${inc_id}/transitions"
              payload: { action: "CLOSE" }
              as: Lifeguard
              as_user_id: "${lg_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: corner_incident_reunite_non_lostchild_mismatch
        claim_type: precondition_enforcement
        grounds: [state_machines.Incident.OPEN_to_REUNITED, "validations[priority=14]"]
        distinguishing_aspect: "REUNITE on a RESCUE (non-LOST_CHILD) incident returns 422 ERR_INCIDENT_TYPE_MISMATCH."
        test_recipe:
          setup: ["beach/zone/lifeguard; one OPEN RESCUE incident."]
          setup_api_calls:
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
            - call: "POST /beach-ops/zones"
              payload: { beach_id: "${beach_id}", name: "North Cove", min_guards_required: 1 }
              as: BeachCaptain
              captures: { zone_id: $.data.id }
            - call: "POST /beach-ops/lifeguards"
              payload: { beach_id: "${beach_id}", name: "Ana", certification_level: "SENIOR", employee_ref: "E1" }
              as: BeachCaptain
              captures: { lg_id: $.data.id }
            - call: "POST /beach-ops/incidents"
              payload: { zone_id: "${zone_id}", type: "RESCUE", occurred_at: "2026-07-15T10:00:00Z", description: "swimmer distress", lifeguard_id: "${lg_id}" }
              as: Lifeguard
              as_user_id: "${lg_id}"
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /beach-ops/incidents/${inc_id}/transitions"
              payload: { action: "REUNITE" }
              as: Lifeguard
              as_user_id: "${lg_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INCIDENT_TYPE_MISMATCH"

      - name: corner_advisory_lift_when_not_active_invalid
        claim_type: invalid_transition
        grounds: [state_machines.Advisory.ACTIVE_to_LIFTED, "validations[priority=10]"]
        distinguishing_aspect: "Lifting an already-SUPERSEDED advisory returns 409 ERR_ADVISORY_NOT_ACTIVE."
        test_recipe:
          setup: ["beach/zone; one sample MPN 40; advisory1 issued then superseded by advisory2."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T09:00:00Z" }
              as: BeachCaptain
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
            - call: "POST /beach-ops/zones"
              payload: { beach_id: "${beach_id}", name: "North Cove", min_guards_required: 1 }
              as: BeachCaptain
              captures: { zone_id: $.data.id, zv0: $.data.version }
            - call: "POST /beach-ops/water-quality-samples"
              payload: { zone_id: "${zone_id}", enterococci_mpn: 40, sampled_at: "2026-07-15T08:00:00Z", lab_ref: "L1", technician: "T" }
              as: WaterQualityInspector
            - call: "POST /beach-ops/zones/${zone_id}/advisories"
              payload: { basis: "SINGLE_SAMPLE", expected_zone_version: "${zv0}" }
              as: WaterQualityInspector
              captures: { adv1_id: $.data.id }
            - call: "GET /beach-ops/zones/${zone_id}"
              as: WaterQualityInspector
              captures: { zv1: $.data.version }
            - call: "POST /beach-ops/zones/${zone_id}/advisories"
              payload: { basis: "SINGLE_SAMPLE", expected_zone_version: "${zv1}" }
              as: WaterQualityInspector
              captures: { adv2_id: $.data.id }
          trigger:
            - call: "POST /beach-ops/advisories/${adv1_id}/lift"
              payload: {}
              as: WaterQualityInspector
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ADVISORY_NOT_ACTIVE"

      - name: corner_advisory_supersede_marks_prior
        claim_type: side_effect_execution
        grounds: [state_machines.Advisory.ACTIVE_to_SUPERSEDED, entities.Advisory.fields.status]
        distinguishing_aspect: "Issuing advisory2 flips advisory1 (same zone) from ACTIVE to SUPERSEDED while advisory2 is ACTIVE."
        test_recipe:
          setup: ["beach/zone; one sample MPN 40; advisory1 issued."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T09:00:00Z" }
              as: BeachCaptain
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
            - call: "POST /beach-ops/zones"
              payload: { beach_id: "${beach_id}", name: "North Cove", min_guards_required: 1 }
              as: BeachCaptain
              captures: { zone_id: $.data.id, zv0: $.data.version }
            - call: "POST /beach-ops/water-quality-samples"
              payload: { zone_id: "${zone_id}", enterococci_mpn: 40, sampled_at: "2026-07-15T08:00:00Z", lab_ref: "L1", technician: "T" }
              as: WaterQualityInspector
            - call: "POST /beach-ops/zones/${zone_id}/advisories"
              payload: { basis: "SINGLE_SAMPLE", expected_zone_version: "${zv0}" }
              as: WaterQualityInspector
              captures: { adv1_id: $.data.id }
            - call: "GET /beach-ops/zones/${zone_id}"
              as: WaterQualityInspector
              captures: { zv1: $.data.version }
          trigger:
            - call: "POST /beach-ops/zones/${zone_id}/advisories"
              payload: { basis: "SINGLE_SAMPLE", expected_zone_version: "${zv1}" }
              as: WaterQualityInspector
              captures: { adv2_status: $.data.status }
            - call: "GET /beach-ops/advisories/${adv1_id}"
              as: WaterQualityInspector
              captures: { adv1_status: $.data.status }
          assert:
            - "Advisory1.status == SUPERSEDED"
            - "Advisory2.status == ACTIVE"

      - name: corner_pass_revoke_twice_invalid
        claim_type: invalid_transition
        grounds: [state_machines.ParkingPass.ACTIVE_to_REVOKED, "validations[priority=11]"]
        distinguishing_aspect: "Revoking an already-REVOKED pass returns 409 ERR_PASS_NOT_ACTIVE."
        test_recipe:
          setup: ["beach/lot; one pass issued then revoked once."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T09:00:00Z" }
              as: BeachCaptain
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
            - call: "POST /beach-ops/parking-lots"
              payload: { beach_id: "${beach_id}", name: "Lot A", total_spaces: 10, daily_rate_cents: 1000 }
              as: ParkingClerk
              captures: { lot_id: $.data.id }
            - call: "POST /beach-ops/parking-passes"
              payload: { lot_id: "${lot_id}", plate: "P1", vehicle_type: "CAR", pass_type: "DAILY" }
              as: ParkingClerk
              captures: { pass_id: $.data.id }
            - call: "POST /beach-ops/parking-passes/${pass_id}/revoke"
              payload: {}
              as: ParkingClerk
          trigger:
            - call: "POST /beach-ops/parking-passes/${pass_id}/revoke"
              payload: {}
              as: ParkingClerk
              captures: { err: $.data.error_id }
          assert:
            - "second revoke response.data.error_id == ERR_PASS_NOT_ACTIVE"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: corner_parking_fee_daily_weekday_car_nonresident_base
        claim_type: correct_result
        grounds: [calculations.parking_fee, entities.ParkingPass.fields.fee_cents]
        distinguishing_aspect: "DAILY CAR non-resident on a WEEKDAY equals the base rate: round(1000*1.0)=1000."
        test_recipe:
          setup: ["Clock 2026-07-15T10:00:00Z (Wed); beach; lot rate 1000."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T10:00:00Z" }
              as: BeachCaptain
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
            - call: "POST /beach-ops/parking-lots"
              payload: { beach_id: "${beach_id}", name: "Lot A", total_spaces: 50, daily_rate_cents: 1000 }
              as: ParkingClerk
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /beach-ops/parking-passes"
              payload: { lot_id: "${lot_id}", plate: "P1", vehicle_type: "CAR", pass_type: "DAILY", is_resident: false }
              as: ParkingClerk
              captures: { fee: $.data.fee_cents }
          assert:
            - "ParkingPass.fee_cents == 1000"

      - name: corner_parking_fee_season_nonresident_car_flat
        claim_type: correct_result
        grounds: [calculations.parking_fee, entities.ParkingPass.fields.pass_type]
        distinguishing_aspect: "SEASON non-resident CAR is the flat season base 30000, independent of day_type."
        test_recipe:
          setup: ["Clock 2026-07-18T10:00:00Z (Sat); beach; lot rate 1200."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-18T10:00:00Z" }
              as: BeachCaptain
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
            - call: "POST /beach-ops/parking-lots"
              payload: { beach_id: "${beach_id}", name: "Lot A", total_spaces: 50, daily_rate_cents: 1200 }
              as: ParkingClerk
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /beach-ops/parking-passes"
              payload: { lot_id: "${lot_id}", plate: "P1", vehicle_type: "CAR", pass_type: "SEASON", is_resident: false }
              as: ParkingClerk
              captures: { fee: $.data.fee_cents }
          assert:
            - "ParkingPass.fee_cents == 30000"

      - name: corner_geomean_empty_window_yields_none
        claim_type: correct_result
        grounds: [calculations.bacteria_exceedance_assessment, entities.Advisory.fields.level]
        distinguishing_aspect: "GEOMEAN_30DAY with no samples in the window yields level NONE and assessed_value 0."
        test_recipe:
          setup: ["Clock 2026-07-15T09:00:00Z; beach; zone with NO samples."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T09:00:00Z" }
              as: BeachCaptain
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
            - call: "POST /beach-ops/zones"
              payload: { beach_id: "${beach_id}", name: "North Cove", min_guards_required: 1 }
              as: BeachCaptain
              captures: { zone_id: $.data.id, zv0: $.data.version }
          trigger:
            - call: "POST /beach-ops/zones/${zone_id}/advisories"
              payload: { basis: "GEOMEAN_30DAY", expected_zone_version: "${zv0}" }
              as: WaterQualityInspector
              captures: { level: $.data.level, val: $.data.assessed_value }
          assert:
            - "Advisory.level == NONE"
            - "Advisory.assessed_value == 0"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: corner_shift_window_invalid_end_before_start
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", entities.Shift.fields.scheduled_end]
        distinguishing_aspect: "Creating a shift with scheduled_end <= scheduled_start returns 422 ERR_SHIFT_WINDOW_INVALID."
        test_recipe:
          setup: ["beach/zone/tower/lifeguard."]
          setup_api_calls:
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
            - call: "POST /beach-ops/zones"
              payload: { beach_id: "${beach_id}", name: "North Cove", min_guards_required: 1 }
              as: BeachCaptain
              captures: { zone_id: $.data.id }
            - call: "POST /beach-ops/towers"
              payload: { zone_id: "${zone_id}", label: "T4", max_concurrent_guards: 2 }
              as: BeachCaptain
              captures: { tower_id: $.data.id }
            - call: "POST /beach-ops/lifeguards"
              payload: { beach_id: "${beach_id}", name: "Ana", certification_level: "SENIOR", employee_ref: "E1" }
              as: BeachCaptain
              captures: { lg_id: $.data.id }
          trigger:
            - call: "POST /beach-ops/shifts"
              payload: { lifeguard_id: "${lg_id}", tower_id: "${tower_id}", scheduled_start: "2026-07-15T17:00:00Z", scheduled_end: "2026-07-15T09:00:00Z" }
              as: BeachCaptain
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SHIFT_WINDOW_INVALID"

      - name: corner_season_dates_invalid_end_before_start
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", entities.Beach.fields.season_end_date]
        distinguishing_aspect: "Creating a beach with season_end_date <= season_start_date returns 422 ERR_SEASON_DATES_INVALID."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-09-07", season_end_date: "2026-05-23" }
              as: BeachCaptain
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SEASON_DATES_INVALID"

      - name: corner_escalate_ems_missing_details_returns_error
        claim_type: violation_to_error
        grounds: ["validations[priority=18]", state_machines.Incident.OPEN_to_ESCALATED_EMS]
        distinguishing_aspect: "ESCALATE_EMS without ems_hospital/ems_unit/ems_narrative/ems_transported returns 422 ERR_EMS_DETAILS_REQUIRED."
        test_recipe:
          setup: ["beach/zone/lifeguard; one OPEN MEDICAL incident."]
          setup_api_calls:
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
            - call: "POST /beach-ops/zones"
              payload: { beach_id: "${beach_id}", name: "North Cove", min_guards_required: 1 }
              as: BeachCaptain
              captures: { zone_id: $.data.id }
            - call: "POST /beach-ops/lifeguards"
              payload: { beach_id: "${beach_id}", name: "Ana", certification_level: "SENIOR", employee_ref: "E1" }
              as: BeachCaptain
              captures: { lg_id: $.data.id }
            - call: "POST /beach-ops/incidents"
              payload: { zone_id: "${zone_id}", type: "MEDICAL", occurred_at: "2026-07-15T10:00:00Z", description: "chest pain", lifeguard_id: "${lg_id}" }
              as: Lifeguard
              as_user_id: "${lg_id}"
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /beach-ops/incidents/${inc_id}/transitions"
              payload: { action: "ESCALATE_EMS" }
              as: Lifeguard
              as_user_id: "${lg_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_EMS_DETAILS_REQUIRED"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: corner_zones_filtered_by_beach_reverse_fk
        claim_type: listing
        grounds: [endpoints, entities.Zone.fields.beach_id]
        distinguishing_aspect: "GET /beach-ops/zones?beach_id=<id> returns the beach's zones as a Zone[] with pagination envelope."
        test_recipe:
          setup: ["one beach with one zone."]
          setup_api_calls:
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
            - call: "POST /beach-ops/zones"
              payload: { beach_id: "${beach_id}", name: "North Cove", min_guards_required: 1 }
              as: BeachCaptain
              captures: { zone_id: $.data.id }
          trigger:
            - call: "GET /beach-ops/zones"
              payload: { beach_id: "${beach_id}" }
              as: Public
              captures: { first_id: "$.data[0].id" }
          assert:
            - "response.data is an array containing the created zone (first_id == zone_id)"
            - "meta/pagination fields total_count and has_more present"

      - name: corner_seasonal_report_incident_counts
        claim_type: computed_read
        grounds: [endpoints, calculations.zone_coverage_hours]
        distinguishing_aspect: "seasonal-report tallies total_incidents=2, rescue_count=1, ems_escalations=0 for a beach with one RESCUE and one MEDICAL incident (neither escalated)."
        test_recipe:
          setup: ["beach/zone/lifeguard; two incidents (RESCUE, MEDICAL), both left OPEN."]
          setup_api_calls:
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
            - call: "POST /beach-ops/zones"
              payload: { beach_id: "${beach_id}", name: "North Cove", min_guards_required: 1 }
              as: BeachCaptain
              captures: { zone_id: $.data.id }
            - call: "POST /beach-ops/lifeguards"
              payload: { beach_id: "${beach_id}", name: "Ana", certification_level: "SENIOR", employee_ref: "E1" }
              as: BeachCaptain
              captures: { lg_id: $.data.id }
            - call: "POST /beach-ops/incidents"
              payload: { zone_id: "${zone_id}", type: "RESCUE", occurred_at: "2026-07-15T10:00:00Z", description: "rescue", lifeguard_id: "${lg_id}" }
              as: Lifeguard
              as_user_id: "${lg_id}"
            - call: "POST /beach-ops/incidents"
              payload: { zone_id: "${zone_id}", type: "MEDICAL", occurred_at: "2026-07-15T11:00:00Z", description: "medical", lifeguard_id: "${lg_id}" }
              as: Lifeguard
              as_user_id: "${lg_id}"
          trigger:
            - call: "GET /beach-ops/beaches/${beach_id}/seasonal-report"
              as: BeachCaptain
              captures: { total: $.data.total_incidents, rescues: $.data.rescue_count, ems: $.data.ems_escalations }
          assert:
            - "seasonal_report.total_incidents == 2"
            - "seasonal_report.rescue_count == 1"
            - "seasonal_report.ems_escalations == 0"

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: corner_lifeguard_cannot_create_zone_unauthorized
        claim_type: unauthorized_denial
        grounds: [roles.Lifeguard, "validations[priority=2]"]
        distinguishing_aspect: "A Lifeguard calling POST /beach-ops/zones (BeachCaptain-only) returns 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["one beach."]
          setup_api_calls:
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
          trigger:
            - call: "POST /beach-ops/zones"
              payload: { beach_id: "${beach_id}", name: "North Cove" }
              as: Lifeguard
              as_user_id: "someone"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHORIZED"

      - name: corner_parkingclerk_cannot_issue_advisory_unauthorized
        claim_type: unauthorized_denial
        grounds: [roles.ParkingClerk, "validations[priority=2]"]
        distinguishing_aspect: "A ParkingClerk calling POST /beach-ops/zones/{id}/advisories (WaterQualityInspector-only) returns 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["beach/zone with a sample."]
          setup_api_calls:
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
            - call: "POST /beach-ops/zones"
              payload: { beach_id: "${beach_id}", name: "North Cove", min_guards_required: 1 }
              as: BeachCaptain
              captures: { zone_id: $.data.id, zv0: $.data.version }
          trigger:
            - call: "POST /beach-ops/zones/${zone_id}/advisories"
              payload: { basis: "SINGLE_SAMPLE", expected_zone_version: "${zv0}" }
              as: ParkingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHORIZED"

      - name: corner_unknown_role_returns_unauthenticated
        claim_type: unauthorized_denial
        grounds: ["validations[priority=1]"]
        distinguishing_aspect: "A request whose X-User-Role is not a declared role returns 401 ERR_UNAUTHENTICATED."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: Intruder
              as_user_id: "x"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHENTICATED"

  # ---------------------------------------------------------------------------
  - section: cross_cutting
    instances:
      - name: corner_advisory_create_stale_zone_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[advisory-create-stale-zone]", "validations[priority=7]"]
        distinguishing_aspect: "A second advisory create carrying the pre-supersede expected_zone_version (now stale) returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["beach/zone; one sample MPN 40; capture zone version zv0 (=1) at zone create."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T09:00:00Z" }
              as: BeachCaptain
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
            - call: "POST /beach-ops/zones"
              payload: { beach_id: "${beach_id}", name: "North Cove", min_guards_required: 1 }
              as: BeachCaptain
              captures: { zone_id: $.data.id, zv0: $.data.version }
            - call: "POST /beach-ops/water-quality-samples"
              payload: { zone_id: "${zone_id}", enterococci_mpn: 40, sampled_at: "2026-07-15T08:00:00Z", lab_ref: "L1", technician: "T" }
              as: WaterQualityInspector
            - call: "POST /beach-ops/zones/${zone_id}/advisories"
              payload: { basis: "SINGLE_SAMPLE", expected_zone_version: "${zv0}" }
              as: WaterQualityInspector
          trigger:
            - call: "POST /beach-ops/zones/${zone_id}/advisories"
              payload: { basis: "SINGLE_SAMPLE", expected_zone_version: "${zv0}" }
              as: WaterQualityInspector
              captures: { err: $.data.error_id }
          assert:
            - "second advisory create response.data.error_id == ERR_STALE_VERSION"

      - name: corner_zone_version_increments_on_advisory
        claim_type: optimistic_concurrency
        grounds: [entities.Zone.fields.version, state_machines.Advisory.none_to_ACTIVE]
        distinguishing_aspect: "Issuing one ADVISORY-level advisory on a fresh zone (version 1) advances Zone.version to exactly 2."
        test_recipe:
          setup: ["beach/zone (version 1); one sample MPN 40."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T09:00:00Z" }
              as: BeachCaptain
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
            - call: "POST /beach-ops/zones"
              payload: { beach_id: "${beach_id}", name: "North Cove", min_guards_required: 1 }
              as: BeachCaptain
              captures: { zone_id: $.data.id, zv0: $.data.version }
            - call: "POST /beach-ops/water-quality-samples"
              payload: { zone_id: "${zone_id}", enterococci_mpn: 40, sampled_at: "2026-07-15T08:00:00Z", lab_ref: "L1", technician: "T" }
              as: WaterQualityInspector
            - call: "POST /beach-ops/zones/${zone_id}/advisories"
              payload: { basis: "SINGLE_SAMPLE", expected_zone_version: "${zv0}" }
              as: WaterQualityInspector
          trigger:
            - call: "GET /beach-ops/zones/${zone_id}"
              as: BeachCaptain
              captures: { ver: $.data.version }
          assert:
            - "Zone.version == 2"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: corner_immediate_visibility_beach_create_then_get
        claim_type: immediate
        grounds: [entities.Beach]
        distinguishing_aspect: "A beach created via POST is immediately readable by GET in a subsequent request with identical field values."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
          trigger:
            - call: "GET /beach-ops/beaches/${beach_id}"
              as: Public
              captures: { name: $.data.name }
          assert:
            - "Beach.name == 'Ocean Park'"

