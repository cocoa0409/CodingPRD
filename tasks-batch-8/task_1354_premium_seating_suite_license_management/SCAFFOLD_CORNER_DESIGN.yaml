      - name: derived_balance_reconciles_on_void
        claim_type: derived_field_reconciliation
        grounds: [entities.Account.fields.balance_due_cents, state_machines.Invoice.ISSUED_to_VOID]
        distinguishing_aspect: "Derived-field reconciliation on source removal: voiding an ISSUED invoice immediately removes it from balance_due_cents (5000 -> 0) with no payment involved."
        test_recipe:
          setup: ["Account ACTIVE; invoice ISSUED 5000 (unpaid)"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { legal_name: "Acme Corp", account_type: CORPORATE, tax_id: "T-100", billing_email: "ap@acme.example" }, as: PremiumSalesRep, captures: { ac: $.data.id } }
            - { call: "POST /api/accounts/${ac}/set_status", payload: { target_status: "ACTIVE" }, as: FinanceController }
            - { call: "POST /api/invoices", payload: { account_id: "${ac}", lines: [ { description: "Misc", quantity: 1, unit_price_cents: 5000 } ], due_on: "2026-09-01T00:00:00Z" }, as: FinanceController, captures: { inv: $.data.id } }
            - { call: "POST /api/invoices/${inv}/issue", payload: {}, as: FinanceController }
            - { call: "GET /api/accounts/${ac}", payload: {}, as: FinanceController, captures: { bal0: $.data.balance_due_cents } }
          trigger:
            - { call: "POST /api/invoices/${inv}/void", payload: {}, as: FinanceController }
            - { call: "GET /api/accounts/${ac}", payload: {}, as: FinanceController, captures: { bal1: $.data.balance_due_cents } }
          assert:
            - "bal0 == 5000 (issue raised the derived balance in the same request)"
            - "bal1 == 0 immediately after void (derived field reconciled synchronously)"

