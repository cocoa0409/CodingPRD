          v1: $.data.version
      - call: PATCH /api/contestants/${c_v}
        payload:
          status: SUSPENDED
        as: CommitteeAdmin
        captures:
          v2: $.data.version
      - call: PATCH /api/contestants/${c_v}
        payload:
          status: GOOD_STANDING
        as: CommitteeAdmin
        captures:
          v3: $.data.version
      assert:
      - v1 == 1, v2 == 2, v3 == 3 (exactly +1 per mutation)
      - updated_at changes on each PATCH while created_at is constant
  - name: cascading_side_effects_stub
    claim_type: cascading_side_effects
    grounds:
    - state_machines.StockAnimal.DRAWN_to_INJURED
    - state_machines.Contestant.GOOD_STANDING_to_SUSPENDED
    excluded_because:
      difficulty_instance: transitive_cascade / vet_injury_turnout_cascade_recomputes_purse
      rationale: Depth-3 vet cascade and depth-3 suspension cascade are both exercised end-to-end by the two §1.8 transitive_cascade instances.
  - name: dual_variant_calculation_stub
    claim_type: dual_variant_calculation
    grounds:
    - calculations.purse_and_places
    - calculations.contractor_settlement
    excluded_because:
      difficulty_instance: dual_variant_calc / payout_provisional_includes_recorded_vs_final_verified_only
      rationale: Both variants of both calculations are asserted by the two §1.8 dual_variant_calc instances.
  - name: rate_threshold_triggers_stub
    claim_type: rate_threshold_triggers
    grounds:
    - calculations.welfare_out_threshold
    - calculations.ticket_capacity_check
    excluded_because:
      difficulty_instance: boundary_precision_check / ticket_order_at_exact_capacity_succeeds_plus_one_fails
      rationale: Ticket capacity threshold is asserted there; the welfare out-count threshold is asserted by welfare_threshold_retires_at_third_out in this file (calculations section).
- section: consistency_model
  instances:
  - name: immediate_visibility_of_computed_splits_on_create
    claim_type: immediate
    grounds:
    - complexity_profile.consistency_model
    - calculations.entry_fee_split
    - endpoints.POST_/api/entries
    distinguishing_aspect: 'Consistency is immediate: the POST /api/entries response itself contains the fully computed fee split (retention 240, sanction 600, contribution 1160 for a 2000 fee) — no read-after-write
      or delay is needed to observe derived fields.'
    test_recipe:
      setup:
      - Rodeo ENTRIES_OPEN with one BAREBACK event (fee 2000) and one performance; one contestant
      setup_api_calls:
      - call: POST /api/rodeos
        payload:
          name: Immediate Rodeo
          city: Immediate
          entries_close_at: '2026-08-10T00:00:00Z'
        as: CommitteeAdmin
        captures:
          r_id: $.data.id
      - call: POST /api/rodeo-events
        payload:
          rodeo_id: ${r_id}
          event_code: BAREBACK
          go_rounds: 1
          entry_fee_cents: 2000
          added_money_cents: 0
          per_performance_slots: 10
          payout_places: 1
        as: CommitteeAdmin
        captures:
          ev_id: $.data.id
      - call: POST /api/performances
        payload:
          rodeo_id: ${r_id}
          label: Fri
          arena: Main
          starts_at: '2026-08-14T19:00:00Z'
          ends_at: '2026-08-14T22:00:00Z'
          arena_capacity: 100
        as: CommitteeAdmin
      - call: POST /api/rodeos/${r_id}/transition
        payload:
          action: OPEN_ENTRIES
        as: CommitteeAdmin
      - call: POST /api/contestants
        payload:
          card_number: PRCA-499
          full_name: Rider Imm
        as: EntryOffice
        captures:
          c_i: $.data.id
      trigger:
      - call: POST /api/entries
        payload:
          contestant_id: ${c_i}
          rodeo_event_id: ${ev_id}
        as: EntryOffice
        captures:
          e_i: $.data.id
      assert:
      - 'The 201 response data already shows: entry_fee_cents == 2000, committee_retention_cents == 240, sanction_fee_cents == 600, purse_contribution_cents == 1160, fee_charges_cents == 2000, contribution_charges_cents
        == 1160, status == ENTERED'
