            - call: "POST /herds/parlors"
              payload: { herd_id: "${h_id}", name: "North D-12", stall_capacity: 24, turnaround_minutes: 30 }
              as: HerdManager
              captures: { p_id: $.data.id }
            - call: "POST /herds/milking-shifts"
              payload: { parlor_id: "${p_id}", start_at: "2026-06-01T04:00:00Z", end_at: "2026-06-01T07:00:00Z", cows_milked: 24 }
              as: ParlorTech
          trigger:
            - call: "POST /herds/milking-shifts"
              payload: { parlor_id: "${p_id}", start_at: "2026-06-01T07:30:00Z", end_at: "2026-06-01T10:00:00Z", cows_milked: 24 }
              as: ParlorTech
              captures: { shift2_id: $.data.id }
          assert:
            - "response.status == 201"
            - "MilkingShift.${shift2_id}.status == LOGGED"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: calving_requires_breeding_confirmed_pregnant
        grounds:
          - state_machines.Animal.HEIFER_to_ACTIVE
          - state_machines.BreedingEvent.BRED_to_CONFIRMED_PREGNANT
          - errors[ERR_BREEDING_NOT_CONFIRMED]
        distinguishing_aspect: |
          Entity pair Animal -> BreedingEvent: an Animal's HEIFER->ACTIVE calving is rejected with
          ERR_BREEDING_NOT_CONFIRMED when the referenced BreedingEvent is still BRED (not CONFIRMED_PREGNANT).
        test_recipe:
          setup:
            - "Heifer with a BRED (unconfirmed) breeding event."
          setup_api_calls:
            - call: "POST /herds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "Calve Dep Dairy", federal_order_number: "30" }
