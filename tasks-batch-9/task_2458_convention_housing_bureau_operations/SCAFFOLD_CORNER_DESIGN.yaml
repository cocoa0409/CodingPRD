            - call: "POST /housing/sub-blocks/${vip_sb_id}/approve"
              payload: {}
              as: BureauController
              as_user_id: "ctrl-1"
          assert:
            - "the self-approval returns HTTP 403 with response.data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "the ctrl-1 approval returns HTTP 200 with data.approval_status == APPROVED"
            - "SubBlock.${vip_sb_id}.requested_by_user_id == coord-1"
            - "SubBlock.${vip_sb_id}.approved_by_user_id == ctrl-1"

      - name: reduction_approval_by_its_own_filer_rejected
        claim_type: segregation_of_duties
        grounds:
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines.AttritionReduction.SUBMITTED_to_APPROVED
        distinguishing_aspect: "The same duty split guards the money side: the coordinator who filed the reduction cannot approve it under her own id even while presenting the controller role, and ctrl-1's approval then succeeds without touching the room accounting."
        test_recipe:
          setup: ["OPEN block of 10 rooms (reduction_rights_pct 0.20) with a 2-room reduction filed by coord-1 before the deadline."]
          setup_api_calls:
            - call: "POST /housing/events"
              payload: { name: "Annual Summit", code: "SUM26", event_start_date: "2026-09-14", event_end_date: "2026-09-18", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
              as: BureauCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /housing/hotels"
              payload: { name: "Grand Plaza", distance_to_venue_miles: 0.3, room_tax_pct: 0.1475, total_rooms: 400 }
              as: BureauCoordinator
              captures: { hotel_id: $.data.id }
            - call: "POST /housing/hotel-blocks"
              payload: { event_id: "${event_id}", hotel_id: "${hotel_id}", contracted_rooms_per_night: 10, negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20 }
              as: BureauCoordinator
              captures: { block_id: $.data.id, block_v1: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/terms"
              payload: { negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20, expected_hotel_block_version: "${block_v1}" }
              as: BureauCoordinator
              captures: { block_v2: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/contract"
              payload: { confirmation_number: "CN-SUM26-046" }
              as: HotelManager
              as_user_id: "${hotel_id}"
              captures: { block_v3: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/sub-blocks"
              payload: { segment: "GENERAL", allotted_rooms: 6, expected_hotel_block_version: "${block_v3}" }
              as: BureauCoordinator
              as_user_id: "coord-1"
              captures: { gen_sb_id: $.data.id }
            - call: "POST /housing/hotel-blocks/${block_id}/open"
              payload: {}
              as: BureauCoordinator
            - call: "POST /housing/attrition-reductions"
              payload: { hotel_block_id: "${block_id}", requested_reduction_rooms: 2, effective_date: "2026-08-16", justification_code: "PACE_SHORTFALL" }
              as: BureauCoordinator
              as_user_id: "coord-1"
              captures: { red_id: $.data.id }
          trigger:
            - call: "POST /housing/attrition-reductions/${red_id}/approve"
              payload: {}
              as: BureauController
              as_user_id: "coord-1"
            - call: "POST /housing/attrition-reductions/${red_id}/approve"
              payload: {}
              as: BureauController
              as_user_id: "ctrl-1"
          assert:
            - "the self-approval returns HTTP 403 with response.data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "the ctrl-1 approval returns HTTP 200 with data.status == APPROVED"
            - "AttritionReduction.${red_id}.approved_by_user_id == ctrl-1"
            - "HotelBlock.${block_id}.contracted_rooms_per_night == 10"
            - "SubBlock.${gen_sb_id}.allotted_rooms == 6"

  # ===================================================================================
  # SECTION 8 — CROSS-CUTTING COMPLEXITY LAYERS
  # ===================================================================================
  - section: cross-cutting complexity layers
    instances:
      - name: stale_block_version_on_terms_submission_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[block-terms-revision-stale-block]
          - errors[ERR_STALE_BLOCK_VERSION]
        distinguishing_aspect: "The version the coordinator read before the first submission is no longer current: re-submitting terms with that stale expected_hotel_block_version returns 412 ERR_STALE_BLOCK_VERSION, leaving revision_round at 1 and the rate at the first submission's value."
        test_recipe:
          setup: ["Block created (version v1) and one terms submission already applied (version v2, revision_round 1, rate 21900)."]
          setup_api_calls:
            - call: "POST /housing/events"
              payload: { name: "Annual Summit", code: "SUM26", event_start_date: "2026-09-14", event_end_date: "2026-09-18", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
              as: BureauCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /housing/hotels"
              payload: { name: "Grand Plaza", distance_to_venue_miles: 0.3, room_tax_pct: 0.1475, total_rooms: 400 }
              as: BureauCoordinator
              captures: { hotel_id: $.data.id }
            - call: "POST /housing/hotel-blocks"
              payload: { event_id: "${event_id}", hotel_id: "${hotel_id}", contracted_rooms_per_night: 10, negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20 }
              as: BureauCoordinator
              captures: { block_id: $.data.id, block_v1: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/terms"
              payload: { negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20, expected_hotel_block_version: "${block_v1}" }
              as: BureauCoordinator
              captures: { block_v2: $.data.version }
          trigger:
            - call: "POST /housing/hotel-blocks/${block_id}/terms"
              payload: { negotiated_nightly_rate_cents: 18900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20, expected_hotel_block_version: "${block_v1}" }
              as: BureauCoordinator
          assert:
            - "response HTTP status == 412"
            - "response.data.error_id == ERR_STALE_BLOCK_VERSION"
            - "HotelBlock.${block_id}.version == ${block_v2}"
            - "HotelBlock.${block_id}.revision_round == 1"
            - "HotelBlock.${block_id}.negotiated_nightly_rate_cents == 21900"
            - "HotelBlock.${block_id}.status == TERMS_SUBMITTED"

      - name: stale_block_version_on_sub_block_carve_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[subblock-carve-stale-block]
          - errors[ERR_STALE_BLOCK_VERSION]
        distinguishing_aspect: "A carve computed against an inventory figure read before another carve landed is refused: the second request presents the pre-carve version and gets 412 ERR_STALE_BLOCK_VERSION even though 4 unassigned rooms would have covered its 3-room ask."
        test_recipe:
          setup: ["CONTRACTED block of 10 rooms; version v3 read after contracting; a GENERAL carve of 6 then applied (version v4, unassigned 4)."]
          setup_api_calls:
            - call: "POST /housing/events"
              payload: { name: "Annual Summit", code: "SUM26", event_start_date: "2026-09-14", event_end_date: "2026-09-18", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
              as: BureauCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /housing/hotels"
              payload: { name: "Grand Plaza", distance_to_venue_miles: 0.3, room_tax_pct: 0.1475, total_rooms: 400 }
              as: BureauCoordinator
              captures: { hotel_id: $.data.id }
            - call: "POST /housing/hotel-blocks"
              payload: { event_id: "${event_id}", hotel_id: "${hotel_id}", contracted_rooms_per_night: 10, negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20 }
              as: BureauCoordinator
              captures: { block_id: $.data.id, block_v1: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/terms"
              payload: { negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20, expected_hotel_block_version: "${block_v1}" }
              as: BureauCoordinator
              captures: { block_v2: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/contract"
              payload: { confirmation_number: "CN-SUM26-047" }
              as: HotelManager
              as_user_id: "${hotel_id}"
              captures: { block_v3: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/sub-blocks"
              payload: { segment: "GENERAL", allotted_rooms: 6, expected_hotel_block_version: "${block_v3}" }
              as: BureauCoordinator
              as_user_id: "coord-1"
              captures: { gen_sb_id: $.data.id }
            - call: "GET /housing/hotel-blocks/${block_id}"
              payload: {}
              as: BureauCoordinator
              captures: { block_v4: $.data.version }
          trigger:
            - call: "POST /housing/hotel-blocks/${block_id}/sub-blocks"
              payload: { segment: "STAFF", allotted_rooms: 3, eligibility_code: "STAFF-2026", expected_hotel_block_version: "${block_v3}" }
              as: BureauCoordinator
              as_user_id: "coord-1"
            - call: "POST /housing/hotel-blocks/${block_id}/sub-blocks"
              payload: { segment: "STAFF", allotted_rooms: 3, eligibility_code: "STAFF-2026", expected_hotel_block_version: "${block_v4}" }
              as: BureauCoordinator
              as_user_id: "coord-1"
              captures: { staff_sb_id: $.data.id }
          assert:
            - "the stale carve returns HTTP 412 with response.data.error_id == ERR_STALE_BLOCK_VERSION"
            - "after the stale carve HotelBlock.${block_id}.version == ${block_v4} and unassigned_rooms_per_night == 4"
            - "the refreshed carve returns HTTP 201 with data.approval_status == PENDING_APPROVAL"
            - "HotelBlock.${block_id}.unassigned_rooms_per_night == 1"
            - "SubBlock.${staff_sb_id}.carve_seq == 2"

      - name: vendor_risk_score_crosses_review_threshold_and_clamps
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.rogue_vendor_risk_score
          - state_machines.RogueHousingVendor.REPORTED_to_UNDER_REVIEW
        distinguishing_aspect: "A second verified incident on a new channel with payment solicitation takes the raw score from 50 to 10 + 50 + 30 + 20 == 110, which clamps to 100 and crosses the 60 review threshold, flipping REPORTED -> UNDER_REVIEW on the same call."
        test_recipe:
          setup: ["One vendor with a single verified EMAIL incident (risk_score 50, status REPORTED) and two attendees."]
          setup_api_calls:
            - call: "POST /housing/events"
              payload: { name: "Annual Summit", code: "SUM26", event_start_date: "2026-09-14", event_end_date: "2026-09-18", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
              as: BureauCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /housing/attendees"
              payload: { event_id: "${event_id}", email: "a1@example.com", full_name: "Attendee One", registration_id: "REG-1", attendee_type: "GENERAL" }
              as: BureauCoordinator
              captures: { att1_id: $.data.id }
            - call: "POST /housing/attendees"
              payload: { event_id: "${event_id}", email: "a2@example.com", full_name: "Attendee Two", registration_id: "REG-2", attendee_type: "GENERAL" }
              as: BureauCoordinator
              captures: { att2_id: $.data.id }
            - call: "POST /housing/rogue-vendors"
              payload: { event_id: "${event_id}", name: "Summit Rooms LLC", contact_domain: "summit-rooms.example", detection_source: "ATTENDEE_REPORT" }
              as: ComplianceOfficer
              captures: { vendor_id: $.data.id }
            - call: "POST /housing/rogue-vendors/${vendor_id}/incidents"
              payload: { attendee_id: "${att1_id}", contact_channel: "EMAIL", occurred_at: "2026-07-20T10:00:00Z", verified: true, solicited_payment: false }
              as: ComplianceOfficer
              captures: { inc1_id: $.data.id }
          trigger:
            - call: "POST /housing/rogue-vendors/${vendor_id}/incidents"
              payload: { attendee_id: "${att2_id}", contact_channel: "PHONE", occurred_at: "2026-07-22T09:30:00Z", verified: true, solicited_payment: true }
              as: ComplianceOfficer
              captures: { inc2_id: $.data.id }
            - call: "GET /housing/rogue-vendors/${vendor_id}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "response HTTP status == 200"
            - "response.data.risk_score == 100"
            - "response.data.status == UNDER_REVIEW"
            - "response.data.verified_incident_count == 2"
            - "response.data.distinct_channel_count == 2"
            - "Attendee.${att1_id}.warning_count == 0"
            - "Attendee.${att2_id}.housing_risk_flag == false"

      - name: reduction_exercise_side_effect_chain
        claim_type: cascading_side_effects
        grounds:
          - state_machines.AttritionReduction.APPROVED_to_EXERCISED
        excluded_because:
          difficulty_instance: transitive_cascade / reduction_exercise_cascade_depth_four_waitlists_last_reservation
          rationale: "The named §1.8 instance follows the full four-hop chain from the reduction through block, sub-block and reservation."

      - name: dual_basis_commission_layer
        claim_type: dual_variant_calculation
        grounds:
          - calculations.commission_due.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / commission_two_basis_variants_diverge_on_invoice
          rationale: "The named §1.8 instance asserts both bases and the variance on one invoice."

  # ===================================================================================
  # SECTION 9 — CONSISTENCY MODEL
  # ===================================================================================
  - section: consistency model
    instances:
      - name: reservation_write_is_immediately_visible_to_every_reader
        claim_type: immediate_consistency
        grounds:
          - entities.SubBlock.fields.committed_rooms
          - entities.Event.fields.total_confirmed_room_nights
          - calculations.event_housing_posture
        distinguishing_aspect: "Every derived figure is readable on the very next request with no settling period: the sub-block occupancy, the event room-night ledger and the pace-independent posture all reflect the 4-night booking immediately, and a repeated read returns the same values."
        test_recipe:
          setup: ["OPEN block of 10 rooms with a GENERAL carve of 6 and one attendee; no reservations."]
          setup_api_calls:
            - call: "POST /housing/events"
              payload: { name: "Annual Summit", code: "SUM26", event_start_date: "2026-09-14", event_end_date: "2026-09-18", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
