              as_user_id: "${prov_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /patients/${pt_id}/treatment-plans/${plan_id}/phases"
              payload: { phase_type: "ACUTE", sequence_index: 0, visits_per_week: 3, planned_visit_count: 3 }
