scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: composite_provisional_vs_final_diverge_on_same_cycle
        grounds:
          - calculations.cycle_composite_score
          - calculations.cycle_observation_component
          - state_machines.EvaluationCycle.SCORING_to_SUBMITTED
          - state_machines.EvaluationCycle.SUBMITTED_to_FINALIZED
          - entities.EvaluationCycle.fields.composite_variant
        distinguishing_aspect: |
          On the EvaluationCycle domain, the PROVISIONAL variant scores the cycle on the
          observations it actually has while the FINAL variant pads each pool up to the
          policy's required count with MISSING_OBSERVATION_FLOOR, so the identical stored
          rows yield composite_score 3.15 at submit and 2.62 at finalize.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Policy requiring 2 formal and 1 informal observation, all other constants at their defaults."
            - "One certified evaluator, one school with a 100000-cent budget, one educator."
            - "Cycle carrying exactly one SUBMITTED FORMAL observation weighted 3.33 and one SUBMITTED INFORMAL observation weighted 3.00 — one formal short of the required two."
            - "Two ATTACHED evidence artifacts on the cycle, so the evidence-sufficiency adjustment is 0.00 and cannot mask the variant delta."
            - "One CERTIFIED growth measure, index 3.00 at 100 percent coverage, giving growth_component 3.0000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HrAdmin
            - call: "POST /evaluation-policies"
              payload: { school_year: "2026-2027", required_formal_count: 2, required_informal_count: 1 }
              as: HrAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /schools"
              payload: { name: "Lincoln High", code: "LHS", level: "HIGH", evaluation_budget_allocated_cents: 100000 }
              as: HrAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /educators"
              payload: { school_id: "${sch_id}", employee_number: "E-1001", full_name: "Dana Reed", service_start_date: "2023-08-02" }
              as: HrAdmin
              captures: { edu_id: $.data.id }
            - call: "POST /evaluators"
              payload: { full_name: "Pat Ortiz" }
              as: HrAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /calibration-reviews"
              payload: { evaluator_id: "${ev_id}", anchor_lesson_code: "ANCH-1", anchor_score: 3.00, evaluator_score: 3.10 }
              as: HrAdmin
              captures: { cal1_id: $.data.id }
            - call: "POST /calibration-reviews/${cal1_id}/decide"
              payload: { policy_id: "${pol_id}" }
              as: HrAdmin
            - call: "POST /evaluation-cycles"
              payload: { educator_id: "${edu_id}", policy_id: "${pol_id}", school_year: "2026-2027", cycle_type: "COMPREHENSIVE" }
              as: HrAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /observations"
              payload: { cycle_id: "${cyc_id}", evaluator_id: "${ev_id}", observation_type: "FORMAL", scheduled_start: "2026-09-10T09:00:00Z", scheduled_end: "2026-09-10T10:00:00Z", announced: true }
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { obs1_id: $.data.id }
            - call: "POST /observations/${obs1_id}/conduct"
              payload: {}
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { o1v0: $.data.version }
            - call: "POST /observations/${obs1_id}/rubric-scores"
              payload: { domain_code: "PLANNING", raw_score: 3, expected_observation_version: "${o1v0}" }
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { o1v1: $.data.observation_version_after }
            - call: "POST /observations/${obs1_id}/rubric-scores"
              payload: { domain_code: "ENVIRONMENT", raw_score: 3, expected_observation_version: "${o1v1}" }
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { o1v2: $.data.observation_version_after }
            - call: "POST /observations/${obs1_id}/rubric-scores"
              payload: { domain_code: "INSTRUCTION", raw_score: 4, expected_observation_version: "${o1v2}" }
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { o1v3: $.data.observation_version_after }
            - call: "POST /observations/${obs1_id}/rubric-scores"
              payload: { domain_code: "PROFESSIONALISM", raw_score: 3, expected_observation_version: "${o1v3}" }
              as: Evaluator
              as_user_id: "${ev_id}"
            - call: "POST /observations/${obs1_id}/evidence-artifacts"
              payload: { artifact_type: "LESSON_PLAN", title: "Unit 3 plan" }
              as: Evaluator
              as_user_id: "${ev_id}"
            - call: "POST /observations/${obs1_id}/evidence-artifacts"
              payload: { artifact_type: "STUDENT_WORK", title: "Exit tickets" }
              as: Teacher
              as_user_id: "${edu_id}"
            - call: "POST /observations/${obs1_id}/submit"
              payload: {}
              as: Evaluator
              as_user_id: "${ev_id}"
            - call: "POST /observations"
              payload: { cycle_id: "${cyc_id}", evaluator_id: "${ev_id}", observation_type: "INFORMAL", scheduled_start: "2026-09-11T09:00:00Z", scheduled_end: "2026-09-11T09:30:00Z", announced: true }
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { obs2_id: $.data.id }
            - call: "POST /observations/${obs2_id}/conduct"
              payload: {}
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { o2v0: $.data.version }
            - call: "POST /observations/${obs2_id}/rubric-scores"
              payload: { domain_code: "PLANNING", raw_score: 3, expected_observation_version: "${o2v0}" }
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { o2v1: $.data.observation_version_after }
            - call: "POST /observations/${obs2_id}/rubric-scores"
              payload: { domain_code: "ENVIRONMENT", raw_score: 3, expected_observation_version: "${o2v1}" }
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { o2v2: $.data.observation_version_after }
            - call: "POST /observations/${obs2_id}/rubric-scores"
              payload: { domain_code: "INSTRUCTION", raw_score: 3, expected_observation_version: "${o2v2}" }
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { o2v3: $.data.observation_version_after }
            - call: "POST /observations/${obs2_id}/rubric-scores"
              payload: { domain_code: "PROFESSIONALISM", raw_score: 3, expected_observation_version: "${o2v3}" }
              as: Evaluator
              as_user_id: "${ev_id}"
            - call: "POST /observations/${obs2_id}/submit"
              payload: {}
              as: Evaluator
              as_user_id: "${ev_id}"
            - call: "GET /evaluation-cycles/${cyc_id}"
              payload: {}
              as: HrAdmin
              captures: { cv1: $.data.version }
            - call: "POST /growth-measures"
              payload: { cycle_id: "${cyc_id}", measure_code: "STATE_ASSESSMENT", index_value: 3.00, coverage_pct: 100, expected_cycle_version: "${cv1}" }
              as: HrAdmin
              captures: { gm_id: $.data.id }
            - call: "POST /growth-measures/${gm_id}/certify"
              payload: {}
              as: HrAdmin
          trigger:
            - call: "POST /evaluation-cycles/${cyc_id}/submit"
              payload: {}
              as: HrAdmin
              captures: { prov_score: $.data.composite_score }
            - call: "POST /evaluation-cycles/${cyc_id}/finalize"
              payload: {}
              as: HrAdmin
              captures: { final_score: $.data.composite_score }
          assert:
            - "After the submit call, EvaluationCycle.${cyc_id}.composite_score == 3.15"
            - "After the submit call, EvaluationCycle.${cyc_id}.composite_variant == PROVISIONAL"
            - "After the submit call, EvaluationCycle.${cyc_id}.observation_component == 3.2475"
            - "After the finalize call, EvaluationCycle.${cyc_id}.composite_score == 2.62"
            - "After the finalize call, EvaluationCycle.${cyc_id}.composite_variant == FINAL"
            - "After the finalize call, EvaluationCycle.${cyc_id}.observation_component == 2.3738"
            - "After the finalize call, EvaluationCycle.${cyc_id}.evidence_adjustment == 0.00"
            - "After the finalize call, EvaluationCycle.${cyc_id}.composite_rating == EFFECTIVE"
            - "EvaluationCycle.${cyc_id}.growth_component == 3.0000 under both variants"

      - name: calibration_rolling_vs_anchor_drift_diverge_on_evaluator
        grounds:
          - calculations.evaluator_calibration_drift
          - entities.Evaluator.fields.calibration_drift_rolling
          - entities.Evaluator.fields.calibration_drift_anchor
          - state_machines.Evaluator.PROVISIONAL_to_PROVISIONAL
        distinguishing_aspect: |
          On the Evaluator domain — a different entity from the composite's EvaluationCycle —
          the ROLLING variant averages the last three decided deviations to 0.55 while the
          ANCHOR variant reports only the most recent deviation, 0.10; certification consults
          ROLLING, so the evaluator stays PROVISIONAL even though ANCHOR is inside tolerance.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Policy with calibration_drift_tolerance 0.50 and calibration_max_consecutive_failures 2 (defaults)."
            - "One evaluator with two decided calibration reviews: deviation 1.00 decided FAIL, then deviation 0.10 decided PASS."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HrAdmin
            - call: "POST /evaluation-policies"
              payload: { school_year: "2026-2027" }
              as: HrAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /evaluators"
              payload: { full_name: "Robin Vega" }
              as: HrAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /calibration-reviews"
              payload: { evaluator_id: "${ev_id}", anchor_lesson_code: "ANCH-A", anchor_score: 3.00, evaluator_score: 4.00 }
              as: HrAdmin
              captures: { cal1_id: $.data.id }
            - call: "POST /calibration-reviews/${cal1_id}/decide"
              payload: { policy_id: "${pol_id}" }
              as: HrAdmin
            - call: "POST /calibration-reviews"
              payload: { evaluator_id: "${ev_id}", anchor_lesson_code: "ANCH-B", anchor_score: 3.00, evaluator_score: 3.10 }
              as: HrAdmin
              captures: { cal2_id: $.data.id }
          trigger:
            - call: "POST /calibration-reviews/${cal2_id}/decide"
              payload: { policy_id: "${pol_id}" }
              as: HrAdmin
              captures: { cal2_outcome: $.data.outcome }
          assert:
            - "CalibrationReview.${cal1_id}.deviation == 1.00 and CalibrationReview.${cal1_id}.outcome == FAIL"
            - "CalibrationReview.${cal2_id}.deviation == 0.10 and CalibrationReview.${cal2_id}.outcome == PASS"
            - "Evaluator.${ev_id}.calibration_drift_rolling == 0.55"
            - "Evaluator.${ev_id}.calibration_drift_anchor == 0.10"
            - "Evaluator.${ev_id}.calibration_drift_rolling != Evaluator.${ev_id}.calibration_drift_anchor"
            - "Evaluator.${ev_id}.certification_status == PROVISIONAL"
            - "Evaluator.${ev_id}.consecutive_failed_calibrations == 0"
            - "Evaluator.${ev_id}.passed_calibration_count == 1"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: observation_weighted_score_rounds_per_domain_then_sums
        grounds:
          - calculations.observation_weighted_score
          - entities.RubricScore.fields.weighted_contribution
          - entities.EvaluationPolicy.fields.unannounced_multiplier
          - state_machines.Observation.CONDUCTED_to_SCORED
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins "multiply each domain by its weight and
          the unannounced multiplier, round that contribution to 2 decimals, THEN sum". For
          raw scores 3/2/4/3 at weights 22/23/33/22 with multiplier 1.10 the pinned order
          yields 3.42; the forbidden "sum first, round once" order yields 3.41.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Policy at default domain weights 22/23/33/22 and unannounced_multiplier 1.10."
            - "One certified evaluator, one educator, one cycle."
            - "One UNANNOUNCED FORMAL observation, conducted, with all four domains scored 3/2/4/3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HrAdmin
            - call: "POST /evaluation-policies"
              payload: { school_year: "2026-2027" }
              as: HrAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /schools"
              payload: { name: "Lincoln High", code: "LHS", level: "HIGH", evaluation_budget_allocated_cents: 100000 }
              as: HrAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /educators"
              payload: { school_id: "${sch_id}", employee_number: "E-2001", full_name: "Ari Cole", service_start_date: "2024-08-15" }
              as: HrAdmin
              captures: { edu_id: $.data.id }
            - call: "POST /evaluators"
              payload: { full_name: "Pat Ortiz" }
              as: HrAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /calibration-reviews"
              payload: { evaluator_id: "${ev_id}", anchor_lesson_code: "ANCH-1", anchor_score: 3.00, evaluator_score: 3.10 }
              as: HrAdmin
              captures: { cal1_id: $.data.id }
            - call: "POST /calibration-reviews/${cal1_id}/decide"
              payload: { policy_id: "${pol_id}" }
              as: HrAdmin
            - call: "POST /evaluation-cycles"
              payload: { educator_id: "${edu_id}", policy_id: "${pol_id}", school_year: "2026-2027", cycle_type: "COMPREHENSIVE" }
              as: HrAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /observations"
              payload: { cycle_id: "${cyc_id}", evaluator_id: "${ev_id}", observation_type: "FORMAL", scheduled_start: "2026-09-10T09:00:00Z", scheduled_end: "2026-09-10T10:00:00Z", announced: false }
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { obs1_id: $.data.id }
            - call: "POST /observations/${obs1_id}/conduct"
              payload: {}
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { o1v0: $.data.version }
            - call: "POST /observations/${obs1_id}/rubric-scores"
              payload: { domain_code: "PLANNING", raw_score: 3, expected_observation_version: "${o1v0}" }
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { o1v1: $.data.observation_version_after }
            - call: "POST /observations/${obs1_id}/rubric-scores"
              payload: { domain_code: "ENVIRONMENT", raw_score: 2, expected_observation_version: "${o1v1}" }
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { o1v2: $.data.observation_version_after }
            - call: "POST /observations/${obs1_id}/rubric-scores"
              payload: { domain_code: "INSTRUCTION", raw_score: 4, expected_observation_version: "${o1v2}" }
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { o1v3: $.data.observation_version_after }
          trigger:
            - call: "POST /observations/${obs1_id}/rubric-scores"
              payload: { domain_code: "PROFESSIONALISM", raw_score: 3, expected_observation_version: "${o1v3}" }
              as: Evaluator
              as_user_id: "${ev_id}"
            - call: "GET /observations/${obs1_id}/rubric-scores"
              payload: {}
              as: HrAdmin
          assert:
            - "Observation.${obs1_id}.status == SCORED"
            - "Observation.${obs1_id}.weighted_score == 3.42"
            - "Observation.${obs1_id}.weighted_score != 3.41"
            - "RubricScore for PLANNING has weighted_contribution == 0.73"
            - "RubricScore for ENVIRONMENT has weighted_contribution == 0.51"
            - "RubricScore for INSTRUCTION has weighted_contribution == 1.45"
            - "RubricScore for PROFESSIONALISM has weighted_contribution == 0.73"
            - "Observation.${obs1_id}.scored_domain_count == 4"

      - name: evidence_adjustment_keyed_on_pre_band_not_final_band
        grounds:
          - calculations.evidence_sufficiency_adjustment
          - calculations.cycle_composite_score
          - entities.EvaluationCycle.fields.evidence_adjustment
          - entities.EvaluationPolicy.fields.evidence_min_artifacts
          - state_machines.EvaluationCycle.SUBMITTED_to_FINALIZED
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with a pinned evaluation order: the penalty is
          selected from the band of the PRE-adjustment composite (2.55 -> EFFECTIVE -> -0.10)
          while composite_rating is read off the POST-adjustment composite (2.45 -> DEVELOPING),
          so the band that chose the adjustment is not the band that is stored.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Policy requiring 1 formal and 1 informal observation with evidence_min_artifacts 2."
            - "Cycle with one SUBMITTED FORMAL weighted 3.33 and one SUBMITTED INFORMAL weighted 3.00, giving observation_component 3.2475."
            - "One CERTIFIED growth measure index 1.51 at 100 percent coverage, giving growth_component 1.5100 and composite_pre 2.55."
            - "Exactly ONE ATTACHED evidence artifact on the cycle — one short of evidence_min_artifacts."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HrAdmin
            - call: "POST /evaluation-policies"
              payload: { school_year: "2026-2027", required_formal_count: 1, required_informal_count: 1, evidence_min_artifacts: 2 }
