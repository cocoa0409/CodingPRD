# =============================================================================
# PRD Benchmark Seed Tables — Catering Commissary & Event Staffing
# Difficulty: Expert
# =============================================================================

scenario: |
  569. Catering Commissary & Event Staffing: event order & headcount, menu BOM &
  food cost, prep/production schedule & packout, rental & equipment (chafer/linen),
  staff (server/bartender) scheduling & rate, delivery/setup route, gratuity/service
  charge, post-event actualization

domain_name: catering-commissary
api_prefix: "/"

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation      # estimate (booked headcount) vs actual (served headcount); scheduled vs actual labor
    - cascading_side_effects        # order cancel -> production cancel -> ingredient release; check-out -> order labor rollup
    - optimistic_concurrency        # re-quote supersede race on EventOrder.version
    - rate_threshold_triggers       # staff overtime past 8.0h at 1.5x

  entity_topology: flat
  # flat: peer entities linked by foreign keys; every collection is a top-level
  #       path (/event-orders, /order-lines, /production-runs, ...). No nested
  #       URL ownership; FK reverse-reachability served by filtered-list GETs.

  state_machine_shape: cyclic
  # EventOrder (DRAFT<->QUOTED revision loop) and ProductionRun
  # (SCHEDULED->IN_PROGRESS->SCHEDULED reschedule loop) are both non-linear.

  relationship_patterns:
    - one_to_many         # EventOrder -> OrderLine / ProductionRun / RentalReservation / StaffAssignment / Quote
    - many_to_many        # MenuItem <-> Ingredient via RecipeLine (BOM)
    - cross_aggregate     # ProductionRun (kitchen) references Station + MenuItem + EventOrder

  role_model: peer_roles
  # Admin owns config assets; KitchenManager owns menu/BOM/production;
  # SalesManager owns orders/quotes; EventCaptain owns staff/rentals/dispatch.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Ingredient
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Ingredient display name.
      - name: unit
        type: enum
        source: input
        description: Measurement unit for on_hand_qty and qty_per_portion.
        constraints: "one of {GRAM, ML, EACH}"
      - name: unit_cost_cents
        type: integer
        source: input
        description: Cost in whole cents of one `unit` of this ingredient.
        constraints: "> 0"
      - name: on_hand_qty
        type: number
        source: input
        description: Free (uncommitted) quantity in `unit`. Decremented when a ProductionRun is scheduled, restored on run cancel.
        constraints: ">= 0; 3 decimal places"
      - name: committed_qty
        type: number
        source: computed
        description: Quantity reserved by SCHEDULED/IN_PROGRESS ProductionRuns. Starts 0. Invariant on_hand_qty + committed_qty is conserved across schedule/cancel.
        default: 0

  - name: MenuItem
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Menu item name.
      - name: category
        type: enum
        source: input
        description: Menu category.
        constraints: "one of {ENTREE, SIDE, BEVERAGE, DESSERT}"
      - name: sell_price_cents_per_portion
        type: integer
        source: input
        description: Client-facing price per portion in whole cents.
        constraints: "> 0"
      - name: portion_food_cost_cents
        type: integer
        source: computed
        description: BOM roll-up cost per portion in whole cents. Recomputed whenever a RecipeLine for this item is created. SUM-THEN-ROUND (see calculations.portion_food_cost). Starts 0 with no recipe lines.
        default: 0

  - name: RecipeLine
    parent: null
    common_fields: false
    fields:
      - name: menu_item_id
        type: string
        source: input
        description: "FK -> MenuItem.id; the menu item this BOM line belongs to."
      - name: ingredient_id
        type: string
        source: input
        description: "FK -> Ingredient.id; the ingredient consumed per portion."
      - name: qty_per_portion
        type: number
        source: input
        description: Quantity of the ingredient (in the ingredient's `unit`) consumed per portion.
        constraints: "> 0; 4 decimal places"

  - name: Station
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Prep/production station name.
      - name: concurrent_capacity
        type: integer
        source: input
        description: Maximum number of ProductionRuns whose [scheduled_start, scheduled_end) windows may overlap on this station at any instant.
        constraints: ">= 1"

  - name: EquipmentItem
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Rental asset name.
      - name: asset_type
        type: enum
        source: input
        description: Category of rental asset.
        constraints: "one of {CHAFER, LINEN, TABLE, GLASSWARE}"
      - name: total_units
        type: integer
        source: input
        description: Total units in the rental pool.
        constraints: "> 0"
      - name: rental_price_cents
        type: integer
        source: input
        description: Rental charge in whole cents per unit per reservation.
        constraints: "> 0"

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Staff member name.
      - name: staff_role
        type: enum
        source: input
        description: The single role this person is qualified to work.
        constraints: "one of {SERVER, BARTENDER, CHEF}"
      - name: hourly_rate_cents
        type: integer
        source: input
        description: Base pay in whole cents per hour.
        constraints: "> 0"

  - name: EventOrder
    parent: null
    common_fields: true
    fields:
      - name: guest_count
        type: integer
        source: input
        description: Booked (estimated) headcount. Drives estimate calculations.
        constraints: "> 0"
      - name: event_start
        type: datetime
        source: input
        description: Event service window start (ISO 8601 UTC).
      - name: event_end
        type: datetime
        source: input
        description: Event service window end (ISO 8601 UTC). Must be strictly after event_start.
      - name: venue_address
        type: string
        source: input
        description: Delivery/setup destination.
      - name: service_charge_pct
        type: number
        source: input
        description: Service-charge rate applied to (food_revenue + labor). Range 0..1.
        constraints: ">= 0 and <= 1"
      - name: gratuity_pct
        type: number
        source: input
        description: Gratuity rate applied to food_revenue ONLY. Range 0..1.
        constraints: ">= 0 and <= 1"
      - name: delivery_vehicle
        type: string
        source: input
        description: Vehicle label for the delivery/setup route. Optional at create; may be set before dispatch.
        default: null
      - name: delivery_depart_time
        type: datetime
        source: input
        description: Planned departure time for the delivery route.
        default: null
      - name: status
        type: enum
        source: computed
        description: Lifecycle state.
        default: DRAFT
        constraints: "one of {DRAFT, QUOTED, CONFIRMED, IN_PRODUCTION, PACKED, DISPATCHED, COMPLETED, ACTUALIZED, CANCELLED}"
      - name: actual_guest_count
        type: integer
        source: input
        description: Served headcount, supplied at actualize. Drives actual (settlement) calculations.
        default: null
        constraints: "> 0 when present"
      - name: actual_labor_total_cents
        type: integer
        source: computed
        description: Running sum of actual_labor_cents across this order's CHECKED_OUT StaffAssignments. Incremented on each staff check-out. Starts 0.
        default: 0
      - name: actual_food_revenue_cents
        type: integer
        source: computed
        description: Settlement food revenue, computed at actualize from actual_guest_count. Null until ACTUALIZED.
        default: null
      - name: actual_food_cost_cents
        type: integer
        source: computed
        description: Settlement food cost (BOM roll-up) at actual headcount. Null until ACTUALIZED.
        default: null
      - name: actual_rental_cents
        type: integer
        source: computed
        description: Settlement rental charge, sum over ACTIVE RentalReservations. Null until ACTUALIZED.
        default: null
      - name: actual_service_charge_cents
        type: integer
        source: computed
        description: Settlement service charge = round(service_charge_pct * (actual_food_revenue + actual_labor_total)). Null until ACTUALIZED.
        default: null
      - name: actual_gratuity_cents
        type: integer
        source: computed
        description: Settlement gratuity = round(gratuity_pct * actual_food_revenue). Null until ACTUALIZED.
        default: null
      - name: actual_grand_total_cents
        type: integer
        source: computed
        description: Settlement grand total (see calculations.event_settlement). Null until ACTUALIZED.
        default: null

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - name: event_order_id
        type: string
        source: input
        description: "FK -> EventOrder.id; the order this line belongs to. Editable only while the order is DRAFT."
      - name: menu_item_id
        type: string
        source: input
        description: "FK -> MenuItem.id; the menu item ordered."
      - name: portions_per_guest
        type: number
        source: input
        description: Portions of this menu item served per guest. line_portions = ceil(portions_per_guest * headcount).
        constraints: "> 0; 2 decimal places"
      - name: status
        type: enum
        source: computed
        description: ACTIVE or REMOVED. DELETE transitions ACTIVE->REMOVED (soft). REMOVED lines are excluded from all calculations and default list results.
        default: ACTIVE
        constraints: "one of {ACTIVE, REMOVED}"

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - name: event_order_id
        type: string
        source: input
        description: "FK -> EventOrder.id; the order this quote snapshots."
      - name: status
        type: enum
        source: computed
        description: ACTIVE or SUPERSEDED. Generating a new quote or revising the order marks the prior ACTIVE quote SUPERSEDED.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUPERSEDED}"
      - name: guest_count_snapshot
        type: integer
        source: computed
        description: Copy of EventOrder.guest_count at quote time.
      - name: food_revenue_cents
        type: integer
        source: computed
        description: Estimate food revenue over ACTIVE order lines at guest_count_snapshot (see calculations.event_estimate).
      - name: food_cost_cents
        type: integer
        source: computed
        description: Estimate BOM food cost over ACTIVE order lines at guest_count_snapshot.

  - name: ProductionRun
    parent: null
    common_fields: true
    fields:
      - name: event_order_id
        type: string
        source: input
        description: "FK -> EventOrder.id; the order this run produces for."
      - name: station_id
        type: string
        source: input
        description: "FK -> Station.id; the station executing this run."
      - name: menu_item_id
        type: string
        source: input
        description: "FK -> MenuItem.id; the item being produced."
      - name: portions
        type: integer
        source: input
        description: Portions to produce. Drives ingredient commitment.
        constraints: "> 0"
      - name: scheduled_start
        type: datetime
        source: input
        description: Production window start (ISO 8601 UTC).
      - name: scheduled_end
        type: datetime
        source: input
        description: Production window end (ISO 8601 UTC). Must be strictly after scheduled_start.
      - name: status
        type: enum
        source: computed
        description: Lifecycle state.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, IN_PROGRESS, DONE, CANCELLED}"

  - name: RentalReservation
    parent: null
    common_fields: true
    fields:
      - name: event_order_id
        type: string
        source: input
        description: "FK -> EventOrder.id; the order this reservation serves."
      - name: equipment_item_id
        type: string
        source: input
        description: "FK -> EquipmentItem.id; the rental asset reserved."
      - name: qty
        type: integer
        source: input
        description: Units reserved.
        constraints: "> 0"
      - name: out_time
        type: datetime
        source: input
        description: Reservation occupation start (ISO 8601 UTC).
      - name: return_time
        type: datetime
        source: input
        description: Reservation occupation end (ISO 8601 UTC). Must be strictly after out_time.
      - name: status
        type: enum
        source: computed
        description: ACTIVE or CANCELLED.
        default: ACTIVE
        constraints: "one of {ACTIVE, CANCELLED}"

  - name: StaffAssignment
    parent: null
    common_fields: true
    fields:
      - name: event_order_id
        type: string
        source: input
        description: "FK -> EventOrder.id; the order this shift serves."
      - name: staff_member_id
        type: string
        source: input
        description: "FK -> StaffMember.id; the person assigned."
      - name: staff_role
        type: enum
        source: input
        description: Role requested for this shift. Must equal the StaffMember.staff_role.
        constraints: "one of {SERVER, BARTENDER, CHEF}"
      - name: shift_start
        type: datetime
        source: input
        description: Scheduled shift start (ISO 8601 UTC).
      - name: shift_end
        type: datetime
        source: input
        description: Scheduled shift end (ISO 8601 UTC). Must be strictly after shift_start.
      - name: actual_start
        type: datetime
        source: input
        description: Clock-in time, supplied at check-in.
        default: null
      - name: actual_end
        type: datetime
        source: input
        description: Clock-out time, supplied at check-out.
        default: null
      - name: scheduled_labor_cents
        type: integer
        source: computed
        description: Estimated labor from [shift_start, shift_end) at creation (see calculations.staff_labor, variant scheduled).
      - name: actual_labor_cents
        type: integer
        source: computed
        description: Realized labor from [actual_start, actual_end) at check-out (see calculations.staff_labor, variant actual). Null until CHECKED_OUT.
        default: null
      - name: status
        type: enum
        source: computed
        description: Lifecycle state.
        default: OFFERED
        constraints: "one of {OFFERED, CONFIRMED, CHECKED_IN, CHECKED_OUT, CANCELLED}"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: EventOrder
    initial_state: DRAFT
    terminal_states: [ACTUALIZED, CANCELLED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /event-orders/{id}/quotes"
        actor: SalesManager
        preconditions:
          - "order has >= 1 ACTIVE OrderLine (else ERR_NO_ORDER_LINES)"
          - "expected_event_order_version matches EventOrder.version (else ERR_STALE_ORDER_VERSION)"
        side_effects:
          - "create Quote(status=ACTIVE) with guest_count_snapshot, food_revenue_cents, food_cost_cents per calculations.event_estimate"
          - "increments EventOrder.version by 1"
      - from: QUOTED
        to: QUOTED
        trigger: "POST /event-orders/{id}/quotes"
        actor: SalesManager
        preconditions:
          - "order has >= 1 ACTIVE OrderLine (else ERR_NO_ORDER_LINES)"
          - "expected_event_order_version matches EventOrder.version (else ERR_STALE_ORDER_VERSION)"
        side_effects:
          - "mark prior ACTIVE Quote -> SUPERSEDED"
          - "create new Quote(status=ACTIVE) per calculations.event_estimate"
          - "increments EventOrder.version by 1"
        note: "Re-quote supersedes; this is the OCC-guarded supersede transition (concurrency_rules.quote-create-stale-order)."
      - from: QUOTED
        to: DRAFT
        trigger: "POST /event-orders/{id}/revise"
        actor: SalesManager
        preconditions: []
        side_effects:
          - "mark ACTIVE Quote -> SUPERSEDED"
          - "increments EventOrder.version by 1"
        note: "Revision loop (cyclic): reopen for line editing."
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /event-orders/{id}/confirm"
        actor: SalesManager
        preconditions:
          - "order status == QUOTED (reaching QUOTED guarantees exactly one ACTIVE Quote)"
        side_effects:
          - "OrderLines become immutable (create/delete now rejected with ERR_ORDER_NOT_DRAFT)"
      - from: CONFIRMED
        to: IN_PRODUCTION
        trigger: "POST /event-orders/{id}/start-production"
        actor: KitchenManager
        preconditions:
          - "order has >= 1 ProductionRun; all its non-CANCELLED ProductionRuns are SCHEDULED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: IN_PRODUCTION
        to: PACKED
        trigger: "POST /event-orders/{id}/pack"
        actor: KitchenManager
        preconditions:
          - "every non-CANCELLED ProductionRun of this order is DONE (else ERR_PRODUCTION_NOT_COMPLETE)"
        side_effects: []
      - from: PACKED
        to: DISPATCHED
        trigger: "POST /event-orders/{id}/dispatch"
        actor: EventCaptain
        preconditions:
          - "order has >= 1 StaffAssignment in {CONFIRMED, CHECKED_IN, CHECKED_OUT} (else ERR_NO_STAFF_CONFIRMED)"
        side_effects: []
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /event-orders/{id}/complete"
        actor: EventCaptain
        preconditions: []
        side_effects: []
      - from: COMPLETED
        to: ACTUALIZED
        trigger: "POST /event-orders/{id}/actualize"
        actor: SalesManager
        preconditions:
          - "actual_guest_count present and > 0 (else ERR_INVALID_GUEST_COUNT)"
        side_effects:
          - "compute actual_food_revenue_cents, actual_food_cost_cents at actual_guest_count (calculations.event_settlement)"
          - "compute actual_rental_cents = sum(qty*rental_price_cents) over ACTIVE RentalReservations"
          - "compute actual_service_charge_cents, actual_gratuity_cents, actual_grand_total_cents (calculations.event_settlement)"
        note: "actual_labor_total_cents already accumulated via staff check-outs."
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /event-orders/{id}/cancel"
        actor: SalesManager
        preconditions: []
        side_effects:
          - "cascade: every non-terminal ProductionRun -> CANCELLED (which itself releases committed ingredients)"
          - "cascade: every ACTIVE RentalReservation -> CANCELLED"
          - "cascade: every non-terminal StaffAssignment -> CANCELLED"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /event-orders/{id}/cancel"
        actor: SalesManager
        preconditions: []
        side_effects:
          - "mark ACTIVE Quote -> SUPERSEDED"
          - "cascade cancel ProductionRuns/RentalReservations/StaffAssignments as in DRAFT->CANCELLED"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /event-orders/{id}/cancel"
        actor: SalesManager
        preconditions: []
        side_effects:
          - "cascade: every non-terminal ProductionRun -> CANCELLED (releases committed ingredients to Ingredient.on_hand_qty)"
          - "cascade: every ACTIVE RentalReservation -> CANCELLED"
          - "cascade: every non-terminal StaffAssignment -> CANCELLED"
      - from: IN_PRODUCTION
        to: CANCELLED
        trigger: "POST /event-orders/{id}/cancel"
        actor: SalesManager
        preconditions: []
        side_effects:
          - "cascade: every non-terminal ProductionRun -> CANCELLED (releases committed ingredients)"
          - "cascade: every ACTIVE RentalReservation -> CANCELLED"
          - "cascade: every non-terminal StaffAssignment -> CANCELLED"

  - entity: OrderLine
    initial_state: ACTIVE
    terminal_states: [REMOVED]
    transitions:
      - from: ACTIVE
        to: REMOVED
        trigger: "DELETE /order-lines/{id}"
        actor: SalesManager
        preconditions:
          - "parent EventOrder.status == DRAFT (else ERR_ORDER_NOT_DRAFT)"
        side_effects:
          - "increments parent EventOrder.version by 1"
        note: "Cross-entity dependency: OrderLine removal gated by EventOrder state."

  - entity: ProductionRun
    initial_state: SCHEDULED
    terminal_states: [DONE, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /production-runs/{id}/start"
        actor: KitchenManager
        preconditions:
          - "parent EventOrder.status == IN_PRODUCTION (else ERR_INVALID_STATE)"
        side_effects: []
      - from: IN_PROGRESS
        to: DONE
        trigger: "POST /production-runs/{id}/complete"
        actor: KitchenManager
        preconditions: []
        side_effects:
          - "consume committed ingredients permanently: for each RecipeLine, Ingredient.committed_qty -= qty_per_portion*portions (on_hand_qty unchanged)"
      - from: IN_PROGRESS
        to: SCHEDULED
        trigger: "POST /production-runs/{id}/reschedule"
        actor: KitchenManager
        preconditions:
          - "new [scheduled_start, scheduled_end) (if supplied) keeps station overlap count <= Station.concurrent_capacity (else ERR_STATION_OVERBOOKED)"
        side_effects:
          - "if scheduled_start/scheduled_end supplied, overwrite them"
        note: "Reschedule loop (cyclic): QA fail returns run to SCHEDULED."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /production-runs/{id}/cancel (or EventOrder cancel cascade)"
        actor: KitchenManager
        preconditions: []
        side_effects:
          - "release ingredients: for each RecipeLine, Ingredient.on_hand_qty += qty_per_portion*portions; Ingredient.committed_qty -= qty_per_portion*portions"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /production-runs/{id}/cancel (or EventOrder cancel cascade)"
        actor: KitchenManager
        preconditions: []
        side_effects:
          - "release ingredients: for each RecipeLine, Ingredient.on_hand_qty += qty_per_portion*portions; Ingredient.committed_qty -= qty_per_portion*portions"

  - entity: RentalReservation
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /rental-reservations/{id}/cancel (or EventOrder cancel cascade)"
        actor: EventCaptain
        preconditions: []
        side_effects:
          - "frees the reserved qty over [out_time, return_time) so equipment availability is restored (calculations.equipment_availability)"

  - entity: StaffAssignment
    initial_state: OFFERED
    terminal_states: [CHECKED_OUT, CANCELLED]
    transitions:
      - from: OFFERED
        to: CONFIRMED
        trigger: "POST /staff-assignments/{id}/confirm"
        actor: EventCaptain
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /staff-assignments/{id}/check-in"
        actor: EventCaptain
        preconditions:
          - "actual_start present (else ERR_VALIDATION)"
        side_effects:
          - "store actual_start"
      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /staff-assignments/{id}/check-out"
        actor: EventCaptain
        preconditions:
          - "actual_end present and strictly after actual_start (else ERR_INVALID_TIME_WINDOW)"
        side_effects:
          - "store actual_end; compute actual_labor_cents (calculations.staff_labor variant=actual)"
          - "bubble up: parent EventOrder.actual_labor_total_cents += actual_labor_cents"
      - from: OFFERED
        to: CANCELLED
        trigger: "POST /staff-assignments/{id}/cancel (or EventOrder cancel cascade)"
        actor: EventCaptain
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /staff-assignments/{id}/cancel (or EventOrder cancel cascade)"
        actor: EventCaptain
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: quote-create-stale-order
    parent_entity: EventOrder
    write_endpoint: "POST /event-orders/{id}/quotes"
    occ_field: "expected_event_order_version"
    description: |
      Generating a Quote against an EventOrder whose version has advanced since
      the client last observed it is rejected. A new quote legitimately supersedes
      the prior one, so two independent quote generations are both valid product
      operations; the one carrying a stale expected_event_order_version is rejected
      because its view of the order's line set / prior quote is out of date. OCC on
      EventOrder.version reduces this to a deterministic stale-version check: any
      OrderLine create/delete, revise, or prior quote generation increments
      EventOrder.version, so a subsequent generate carrying the pre-increment
      version fails.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: portion_food_cost
    trigger: "on POST /recipe-lines (recompute the target MenuItem.portion_food_cost_cents)"
    algorithm: aggregation
    formula: |
      raw = 0                       # exact rational accumulator
      for each RecipeLine rl of the menu item:
        raw += rl.qty_per_portion * Ingredient(rl.ingredient_id).unit_cost_cents
      portion_food_cost_cents = round_half_up(raw)   # SUM-THEN-ROUND
    input_set: "all RecipeLines whose menu_item_id == the item"
    constants: {}
    precision: "SUM exact rational contributions across all recipe lines, THEN round half up ONCE to whole cents. (Per-line rounding then summing is explicitly NOT used.)"
    variants: []

  - name: event_estimate
    trigger: "on POST /event-orders/{id}/quotes (Quote snapshot fields)"
    algorithm: forward_looking
    formula: |
      H = EventOrder.guest_count
      food_revenue_cents = 0
      food_cost_cents = 0
      for each ACTIVE OrderLine ol:
        p = ceil(ol.portions_per_guest * H)                         # line_portions
        food_revenue_cents += p * MenuItem(ol.menu_item_id).sell_price_cents_per_portion
        food_cost_cents    += p * MenuItem(ol.menu_item_id).portion_food_cost_cents
    input_set: "ACTIVE OrderLines only (REMOVED excluded)"
    constants: {}
    precision: "line_portions = ceil(portions_per_guest * headcount) per line; sub-totals are exact integer cents (no rounding)."
    variants:
      - name: estimate
        when: "Quote generation (booked guest_count)"
        difference: "headcount H = EventOrder.guest_count"
      - name: actual
        when: "settlement (see event_settlement, actual_guest_count)"
        difference: "headcount H = EventOrder.actual_guest_count; identical formula, different headcount input"

  - name: staff_labor
    trigger: "scheduled: on POST /staff-assignments (scheduled_labor_cents); actual: on POST /staff-assignments/{id}/check-out (actual_labor_cents)"
    algorithm: threshold
    formula: |
      hours = (window_end - window_start) in hours as an exact rational
      reg   = min(hours, OT_THRESHOLD_HOURS)
      ot    = max(hours - OT_THRESHOLD_HOURS, 0)
      labor_cents = round_half_up(reg * rate + ot * rate * OT_MULTIPLIER)
        where rate = StaffMember.hourly_rate_cents
      # Overtime applies to hours STRICTLY GREATER than OT_THRESHOLD_HOURS.
    input_set: "one StaffAssignment"
    constants:
      OT_THRESHOLD_HOURS: 8.0
      OT_MULTIPLIER: 1.5
    precision: "compute reg/ot in exact rational hours, then round half up ONCE to whole cents."
    variants:
      - name: scheduled
        when: "assignment creation"
        difference: "window = [shift_start, shift_end)"
      - name: actual
        when: "check-out"
        difference: "window = [actual_start, actual_end); may cross OT_THRESHOLD where scheduled did not"

  - name: event_settlement
    trigger: "on POST /event-orders/{id}/actualize"
    algorithm: aggregation
    formula: |
      # actual food figures via event_estimate.variant=actual (H = actual_guest_count)
      actual_food_revenue_cents = SUM p*sell_price over ACTIVE OrderLines   (p = ceil(ppg*actual_guest_count))
      actual_food_cost_cents    = SUM p*portion_food_cost over ACTIVE OrderLines
      actual_rental_cents       = SUM (r.qty * EquipmentItem(r.equipment_item_id).rental_price_cents) over ACTIVE RentalReservations
      L = EventOrder.actual_labor_total_cents                              # accumulated at check-outs
      actual_service_charge_cents = round_half_up(service_charge_pct * (actual_food_revenue_cents + L))   # base EXCLUDES rentals
      actual_gratuity_cents       = round_half_up(gratuity_pct * actual_food_revenue_cents)               # base is FOOD ONLY
      actual_grand_total_cents = actual_food_revenue_cents + L + actual_rental_cents
                                 + actual_service_charge_cents + actual_gratuity_cents
    input_set: "ACTIVE OrderLines; ACTIVE RentalReservations; CHECKED_OUT StaffAssignments (already summed into actual_labor_total_cents)"
    constants: {}
    precision: "Round service charge and gratuity INDEPENDENTLY (each round_half_up to cents), THEN sum all five components. Evaluation order is pinned: revenue/cost/rental/labor first, then the two surcharges from those totals, then the grand total."
    variants:
      - name: estimate_vs_actual
        when: "estimate is the Quote (guest_count); actual is the settlement on EventOrder (actual_guest_count)"
        difference: "same revenue/cost formula; estimate keys on guest_count, actual keys on actual_guest_count"

  - name: equipment_availability
    trigger: "on POST /rental-reservations (feasibility) and GET /equipment-items/{id}/availability"
    algorithm: interval_merge
    formula: |
      # Aggregate-capacity overlap over half-open [out_time, return_time) intervals.
      # For a candidate window W and equipment E:
      #   consider all ACTIVE reservations of E whose interval overlaps W
      #   (overlap iff a.out_time < b.return_time AND b.out_time < a.return_time).
      #   peak = maximum, over every instant t in W, of SUM(qty of ACTIVE reservations covering t).
      #   available_units(W) = E.total_units - peak
      # A new reservation of qty q is feasible iff q <= available_units(W ∪ new) considering itself.
      # Equivalently: for every instant, existing_overlap + q <= total_units.
    input_set: "ACTIVE RentalReservations of the equipment overlapping the candidate window"
    constants: {}
    precision: "half-open intervals: touching endpoints (a.return_time == b.out_time) do NOT overlap; capacity is the summed qty (aggregate), not a count of reservations."
    variants: []

  - name: ingredient_commitment
    trigger: "on POST /production-runs (commit) and on ProductionRun cancel (release)"
    algorithm: aggregation
    formula: |
      for each RecipeLine rl of the run's menu_item_id:
        need = rl.qty_per_portion * ProductionRun.portions
        # commit (schedule):
        require Ingredient(rl.ingredient_id).on_hand_qty >= need   (else ERR_INSUFFICIENT_INVENTORY)
        Ingredient.on_hand_qty  -= need
        Ingredient.committed_qty += need
        # release (cancel): inverse (on_hand_qty += need; committed_qty -= need)
        # consume (run complete): committed_qty -= need (on_hand_qty unchanged)
    input_set: "RecipeLines of the run's menu item"
    constants: {}
    precision: "quantities carry 3 decimal places; on_hand_qty + committed_qty is conserved across schedule<->cancel."
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is permitted for this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "request body well-formed: required fields present, correct types"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all writes"
  - priority: 3
    category: business_constraint
    check: "enum fields carry a declared member (unit, category, asset_type, staff_role)"
    error_id: ERR_INVALID_ENUM
    http_status: 400
    applies_to: "all writes with enum fields"
  - priority: 3
    category: business_constraint
    check: "quantity/count fields > 0 (qty, portions, portions_per_guest, unit_cost_cents, total_units, rental_price_cents, hourly_rate_cents, concurrent_capacity)"
    error_id: ERR_QUANTITY_NOT_POSITIVE
    http_status: 422
    applies_to: "POST /order-lines, /production-runs, /rental-reservations, /ingredients, /equipment-items, /staff-members, /stations, /menu-items"
  - priority: 3
    category: business_constraint
    check: "guest_count > 0 on create; actual_guest_count > 0 on actualize"
    error_id: ERR_INVALID_GUEST_COUNT
    http_status: 422
    applies_to: "POST /event-orders, POST /event-orders/{id}/actualize"
  - priority: 3
    category: business_temporal
    check: "interval end strictly after start (event_end>event_start, scheduled_end>scheduled_start, return_time>out_time, shift_end>shift_start, actual_end>actual_start)"
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    applies_to: "POST /event-orders, /production-runs, /rental-reservations, /staff-assignments, check-out"
  - priority: 4
    category: existence
    check: "path id and body FK targets resolve to existing resources, left-to-right"
    error_id: ERR_EVENT_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "endpoints referencing an event order"
  - priority: 4
    category: existence
    check: "referenced MenuItem exists"
    error_id: ERR_MENU_ITEM_NOT_FOUND
    http_status: 404
    applies_to: "POST /order-lines, /recipe-lines, /production-runs"
  - priority: 4
    category: existence
    check: "referenced Ingredient exists"
    error_id: ERR_INGREDIENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /recipe-lines"
  - priority: 4
    category: existence
    check: "referenced Station exists"
    error_id: ERR_STATION_NOT_FOUND
    http_status: 404
    applies_to: "POST /production-runs"
  - priority: 4
    category: existence
    check: "referenced EquipmentItem exists"
    error_id: ERR_EQUIPMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /rental-reservations, GET /equipment-items/{id}/availability"
  - priority: 4
    category: existence
    check: "referenced StaffMember exists"
    error_id: ERR_STAFF_NOT_FOUND
    http_status: 404
    applies_to: "POST /staff-assignments"
  - priority: 4
    category: existence
    check: "target OrderLine / ProductionRun / RentalReservation / StaffAssignment exists"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "child action & GET-by-id endpoints"
  - priority: 5
    category: state
    check: "target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all lifecycle action endpoints"
  - priority: 5
    category: state
    check: "OrderLine create/delete requires parent EventOrder.status == DRAFT"
    error_id: ERR_ORDER_NOT_DRAFT
    http_status: 409
    applies_to: "POST /order-lines, DELETE /order-lines/{id}"
  - priority: 5
    category: state
    check: "pack requires every non-CANCELLED ProductionRun of the order to be DONE"
    error_id: ERR_PRODUCTION_NOT_COMPLETE
    http_status: 409
    applies_to: "POST /event-orders/{id}/pack"
  - priority: 6
    category: business_constraint
    check: "quote/first-quote requires >= 1 ACTIVE OrderLine on the order (empty-set boundary)"
    error_id: ERR_NO_ORDER_LINES
    http_status: 422
    applies_to: "POST /event-orders/{id}/quotes"
  - priority: 6
    category: business_constraint
    check: "StaffAssignment.staff_role must equal StaffMember.staff_role"
    error_id: ERR_STAFF_ROLE_MISMATCH
    http_status: 422
    applies_to: "POST /staff-assignments"
  - priority: 7
    category: business_safety
    check: "dispatch requires >= 1 StaffAssignment in {CONFIRMED, CHECKED_IN, CHECKED_OUT}"
    error_id: ERR_NO_STAFF_CONFIRMED
    http_status: 422
    applies_to: "POST /event-orders/{id}/dispatch"
  - priority: 8
    category: business_temporal
    check: "assigned StaffMember has no other non-CANCELLED assignment whose [shift_start, shift_end) overlaps, or is within STAFF_REST_BUFFER_MIN of, the new shift"
    error_id: ERR_STAFF_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /staff-assignments"
  - priority: 8
    category: business_temporal
    check: "at every instant of the run window, count of overlapping non-CANCELLED ProductionRuns on the Station must not exceed Station.concurrent_capacity"
    error_id: ERR_STATION_OVERBOOKED
    http_status: 409
    applies_to: "POST /production-runs, POST /production-runs/{id}/reschedule"
  - priority: 9
    category: business_fiscal
    check: "for every RecipeLine of the run's menu item, Ingredient.on_hand_qty >= qty_per_portion*portions"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 422
    applies_to: "POST /production-runs"
  - priority: 9
    category: business_fiscal
    check: "at every instant of the reservation window, existing overlapping ACTIVE reserved qty + new qty <= EquipmentItem.total_units"
    error_id: ERR_EQUIPMENT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /rental-reservations"
  - priority: 10
    category: business_constraint
    check: "expected_event_order_version matches EventOrder.version (OCC)"
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    applies_to: "POST /event-orders/{id}/quotes"
  - priority: 3
    category: business_constraint
    check: "pagination limit in [1,100], offset >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Ingredient (Admin config) ----
  - method: POST
    path: "/ingredients"
    description: "Create an ingredient with inventory."
    roles: [Admin]
    code: 201
    input: [name, unit, unit_cost_cents, on_hand_qty]
    output: Ingredient
    side_effects: ["committed_qty initialized to 0"]
  - method: GET
    path: "/ingredients/{id}"
    description: "Fetch an ingredient (on_hand_qty, committed_qty)."
    roles: [Admin, KitchenManager, SalesManager, EventCaptain]
    code: 200
    input: []
    output: Ingredient
    side_effects: []

  # ---- MenuItem (Kitchen config) ----
  - method: POST
    path: "/menu-items"
    description: "Create a menu item (portion_food_cost_cents starts 0)."
    roles: [KitchenManager]
    code: 201
    input: [name, category, sell_price_cents_per_portion]
    output: MenuItem
    side_effects: []
  - method: GET
    path: "/menu-items/{id}"
    description: "Fetch a menu item including computed portion_food_cost_cents."
    roles: [Admin, KitchenManager, SalesManager, EventCaptain]
    code: 200
    input: []
    output: MenuItem
    side_effects: []

  # ---- RecipeLine (BOM) ----
  - method: POST
    path: "/recipe-lines"
    description: "Add a BOM line to a menu item; recomputes MenuItem.portion_food_cost_cents."
    roles: [KitchenManager]
    code: 201
    input: [menu_item_id, ingredient_id, qty_per_portion]
    output: RecipeLine
    side_effects: ["recompute target MenuItem.portion_food_cost_cents (calculations.portion_food_cost)"]
  - method: GET
    path: "/recipe-lines/{id}"
    description: "Fetch a recipe line."
    roles: [Admin, KitchenManager, SalesManager, EventCaptain]
    code: 200
    input: []
    output: RecipeLine
    side_effects: []
  - method: GET
    path: "/recipe-lines"
    description: "List recipe lines; filter by menu_item_id and/or ingredient_id (FK reverse-reachability)."
    roles: [Admin, KitchenManager, SalesManager, EventCaptain]
    code: 200
    input: ["menu_item_id?", "ingredient_id?", "limit?", "offset?"]
    output: RecipeLine[]
    side_effects: []

  # ---- Station ----
  - method: POST
    path: "/stations"
    description: "Create a production station."
    roles: [Admin]
    code: 201
    input: [name, concurrent_capacity]
    output: Station
    side_effects: []

  # ---- EquipmentItem ----
  - method: POST
    path: "/equipment-items"
    description: "Create a rental asset pool."
    roles: [Admin]
    code: 201
    input: [name, asset_type, total_units, rental_price_cents]
    output: EquipmentItem
    side_effects: []
  - method: GET
    path: "/equipment-items/{id}"
    description: "Fetch a rental asset."
    roles: [Admin, KitchenManager, SalesManager, EventCaptain]
    code: 200
    input: []
    output: EquipmentItem
    side_effects: []
  - method: GET
    path: "/equipment-items/{id}/availability"
    description: "Compute free units of the asset over [out_time, return_time) (calculations.equipment_availability)."
    roles: [Admin, KitchenManager, SalesManager, EventCaptain]
    code: 200
    input: ["out_time?", "return_time?"]
    output: "{ available_units: integer, total_units: integer }"
    side_effects: []

  # ---- StaffMember ----
  - method: POST
    path: "/staff-members"
    description: "Create a staff member with role and rate."
    roles: [Admin]
    code: 201
    input: [name, staff_role, hourly_rate_cents]
    output: StaffMember
    side_effects: []

  # ---- EventOrder ----
  - method: POST
    path: "/event-orders"
    description: "Create an event order in DRAFT."
    roles: [SalesManager]
    code: 201
    input: [guest_count, event_start, event_end, venue_address, service_charge_pct, gratuity_pct, "delivery_vehicle?", "delivery_depart_time?"]
    output: EventOrder
    side_effects: ["status=DRAFT; version=1"]
  - method: GET
    path: "/event-orders/{id}"
    description: "Fetch an event order (status, version, actual_* fields)."
    roles: [Admin, KitchenManager, SalesManager, EventCaptain]
    code: 200
    input: []
    output: EventOrder
    side_effects: []
  - method: GET
    path: "/event-orders"
    description: "List event orders (paginated)."
    roles: [Admin, KitchenManager, SalesManager, EventCaptain]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EventOrder[]
    side_effects: []
  - method: POST
    path: "/event-orders/{id}/quotes"
    description: "Generate an ACTIVE Quote (supersedes prior). OCC-guarded on EventOrder.version."
    roles: [SalesManager]
    code: 201
    input: [expected_event_order_version]
    output: Quote
    side_effects: ["prior ACTIVE Quote -> SUPERSEDED", "status DRAFT->QUOTED (or stays QUOTED)", "increments EventOrder.version by 1"]
  - method: POST
    path: "/event-orders/{id}/revise"
    description: "Reopen a QUOTED order to DRAFT (revision loop)."
    roles: [SalesManager]
    code: 200
    input: []
    output: EventOrder
    side_effects: ["ACTIVE Quote -> SUPERSEDED", "status QUOTED->DRAFT", "increments EventOrder.version by 1"]
  - method: POST
    path: "/event-orders/{id}/confirm"
    description: "Confirm a QUOTED order; order lines become immutable."
    roles: [SalesManager]
    code: 200
    input: []
    output: EventOrder
    side_effects: ["status QUOTED->CONFIRMED"]
  - method: POST
    path: "/event-orders/{id}/start-production"
    description: "Begin production (requires >=1 SCHEDULED run)."
    roles: [KitchenManager]
    code: 200
    input: []
    output: EventOrder
    side_effects: ["status CONFIRMED->IN_PRODUCTION"]
  - method: POST
    path: "/event-orders/{id}/pack"
    description: "Packout after all production runs DONE."
    roles: [KitchenManager]
    code: 200
    input: []
    output: EventOrder
    side_effects: ["status IN_PRODUCTION->PACKED"]
  - method: POST
    path: "/event-orders/{id}/dispatch"
    description: "Dispatch delivery/setup route (requires confirmed staff)."
    roles: [EventCaptain]
    code: 200
    input: ["delivery_vehicle?", "delivery_depart_time?"]
    output: EventOrder
    side_effects: ["status PACKED->DISPATCHED"]
  - method: POST
    path: "/event-orders/{id}/complete"
    description: "Mark the event completed."
    roles: [EventCaptain]
    code: 200
    input: []
    output: EventOrder
    side_effects: ["status DISPATCHED->COMPLETED"]
  - method: POST
    path: "/event-orders/{id}/actualize"
    description: "Post-event actualization at served headcount; computes settlement."
    roles: [SalesManager]
    code: 200
    input: [actual_guest_count]
    output: EventOrder
    side_effects: ["status COMPLETED->ACTUALIZED", "compute actual_* settlement fields (calculations.event_settlement)"]
  - method: POST
    path: "/event-orders/{id}/cancel"
    description: "Cancel a non-terminal order; cascade-cancels runs/rentals/assignments."
    roles: [SalesManager]
    code: 200
    input: ["reason?"]
    output: EventOrder
    side_effects: ["status ->CANCELLED", "cascade cancel ProductionRuns (release ingredients), RentalReservations, StaffAssignments"]

  # ---- OrderLine ----
  - method: POST
    path: "/order-lines"
    description: "Add a line to a DRAFT order."
    roles: [SalesManager]
    code: 201
    input: [event_order_id, menu_item_id, portions_per_guest]
    output: OrderLine
    side_effects: ["increments parent EventOrder.version by 1"]
  - method: GET
    path: "/order-lines/{id}"
    description: "Fetch an order line."
    roles: [Admin, KitchenManager, SalesManager, EventCaptain]
    code: 200
    input: []
    output: OrderLine
    side_effects: []
  - method: GET
    path: "/order-lines"
    description: "List order lines; filter by event_order_id and/or menu_item_id (FK reverse-reachability). Excludes REMOVED unless include_removed=true."
    roles: [Admin, KitchenManager, SalesManager, EventCaptain]
    code: 200
    input: ["event_order_id?", "menu_item_id?", "include_removed?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []
  - method: DELETE
    path: "/order-lines/{id}"
    description: "Soft-remove a line (only while order is DRAFT)."
    roles: [SalesManager]
    code: 200
    input: []
    output: OrderLine
    side_effects: ["status ACTIVE->REMOVED", "increments parent EventOrder.version by 1"]

  # ---- Quote ----
  - method: GET
    path: "/quotes/{id}"
    description: "Fetch a quote snapshot."
    roles: [Admin, KitchenManager, SalesManager, EventCaptain]
    code: 200
    input: []
    output: Quote
    side_effects: []
  - method: GET
    path: "/quotes"
    description: "List quotes; filter by event_order_id (FK reverse-reachability)."
    roles: [Admin, KitchenManager, SalesManager, EventCaptain]
    code: 200
    input: ["event_order_id?", "status?", "limit?", "offset?"]
    output: Quote[]
    side_effects: []

  # ---- ProductionRun ----
  - method: POST
    path: "/production-runs"
    description: "Schedule a production run (requires CONFIRMED order); commits ingredients."
    roles: [KitchenManager]
    code: 201
    input: [event_order_id, station_id, menu_item_id, portions, scheduled_start, scheduled_end]
    output: ProductionRun
    side_effects: ["commit ingredients (calculations.ingredient_commitment): on_hand_qty-=need, committed_qty+=need"]
  - method: GET
    path: "/production-runs/{id}"
    description: "Fetch a production run."
    roles: [Admin, KitchenManager, SalesManager, EventCaptain]
    code: 200
    input: []
    output: ProductionRun
    side_effects: []
  - method: GET
    path: "/production-runs"
    description: "List production runs; filter by event_order_id / station_id / menu_item_id (FK reverse-reachability)."
    roles: [Admin, KitchenManager, SalesManager, EventCaptain]
    code: 200
    input: ["event_order_id?", "station_id?", "menu_item_id?", "limit?", "offset?"]
    output: ProductionRun[]
    side_effects: []
  - method: POST
    path: "/production-runs/{id}/start"
    description: "Start a scheduled run (requires order IN_PRODUCTION)."
    roles: [KitchenManager]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["status SCHEDULED->IN_PROGRESS"]
  - method: POST
    path: "/production-runs/{id}/complete"
    description: "Complete a run; consumes committed ingredients permanently."
    roles: [KitchenManager]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["status IN_PROGRESS->DONE", "committed_qty-=need (consumption)"]
  - method: POST
    path: "/production-runs/{id}/reschedule"
    description: "Return an in-progress run to SCHEDULED (QA fail loop); optionally reset window."
    roles: [KitchenManager]
    code: 200
    input: ["scheduled_start?", "scheduled_end?"]
    output: ProductionRun
    side_effects: ["status IN_PROGRESS->SCHEDULED"]
  - method: POST
    path: "/production-runs/{id}/cancel"
    description: "Cancel a non-terminal run; releases committed ingredients."
    roles: [KitchenManager]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["status ->CANCELLED", "release ingredients: on_hand_qty+=need, committed_qty-=need"]

  # ---- RentalReservation ----
  - method: POST
    path: "/rental-reservations"
    description: "Reserve equipment over a window (requires CONFIRMED order); aggregate-capacity check."
    roles: [EventCaptain]
    code: 201
    input: [event_order_id, equipment_item_id, qty, out_time, return_time]
    output: RentalReservation
    side_effects: ["occupies qty over [out_time, return_time) for availability (calculations.equipment_availability)"]
  - method: GET
    path: "/rental-reservations/{id}"
    description: "Fetch a reservation."
    roles: [Admin, KitchenManager, SalesManager, EventCaptain]
    code: 200
    input: []
    output: RentalReservation
    side_effects: []
  - method: GET
    path: "/rental-reservations"
    description: "List reservations; filter by event_order_id / equipment_item_id (FK reverse-reachability)."
    roles: [Admin, KitchenManager, SalesManager, EventCaptain]
    code: 200
    input: ["event_order_id?", "equipment_item_id?", "limit?", "offset?"]
    output: RentalReservation[]
    side_effects: []
  - method: POST
    path: "/rental-reservations/{id}/cancel"
    description: "Cancel a reservation; frees reserved units over its window."
    roles: [EventCaptain]
    code: 200
    input: []
    output: RentalReservation
    side_effects: ["status ACTIVE->CANCELLED", "restore availability"]

  # ---- StaffAssignment ----
  - method: POST
    path: "/staff-assignments"
    description: "Offer a shift to a staff member (requires CONFIRMED order); role-match and no-double-book checks."
    roles: [EventCaptain]
    code: 201
    input: [event_order_id, staff_member_id, staff_role, shift_start, shift_end]
    output: StaffAssignment
    side_effects: ["compute scheduled_labor_cents (calculations.staff_labor variant=scheduled)"]
  - method: GET
    path: "/staff-assignments/{id}"
    description: "Fetch an assignment."
    roles: [Admin, KitchenManager, SalesManager, EventCaptain]
    code: 200
    input: []
    output: StaffAssignment
    side_effects: []
  - method: GET
    path: "/staff-assignments"
    description: "List assignments; filter by event_order_id / staff_member_id (FK reverse-reachability)."
    roles: [Admin, KitchenManager, SalesManager, EventCaptain]
    code: 200
    input: ["event_order_id?", "staff_member_id?", "limit?", "offset?"]
    output: StaffAssignment[]
    side_effects: []
  - method: POST
    path: "/staff-assignments/{id}/confirm"
    description: "Confirm an offered assignment."
    roles: [EventCaptain]
    code: 200
    input: []
    output: StaffAssignment
    side_effects: ["status OFFERED->CONFIRMED"]
  - method: POST
    path: "/staff-assignments/{id}/check-in"
    description: "Clock in; stores actual_start."
    roles: [EventCaptain]
    code: 200
    input: [actual_start]
    output: StaffAssignment
    side_effects: ["status CONFIRMED->CHECKED_IN"]
  - method: POST
    path: "/staff-assignments/{id}/check-out"
    description: "Clock out; computes actual_labor_cents and rolls it into EventOrder.actual_labor_total_cents."
    roles: [EventCaptain]
    code: 200
    input: [actual_end]
    output: StaffAssignment
    side_effects: ["status CHECKED_IN->CHECKED_OUT", "compute actual_labor_cents (calculations.staff_labor variant=actual)", "parent EventOrder.actual_labor_total_cents += actual_labor_cents"]
  - method: POST
    path: "/staff-assignments/{id}/cancel"
    description: "Cancel an OFFERED/CONFIRMED assignment."
    roles: [EventCaptain]
    code: 200
    input: []
    output: StaffAssignment
    side_effects: ["status ->CANCELLED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/unrecognized X-User-Role or X-User-ID"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for this endpoint"
  - id: ERR_VALIDATION
    http: 400
    condition: "malformed body: missing required field or wrong type"
  - id: ERR_INVALID_ENUM
    http: 400
    condition: "enum field carries an undeclared member"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside [1,100] or offset < 0"
  - id: ERR_QUANTITY_NOT_POSITIVE
    http: 422
    condition: "a quantity/count/price field is <= 0"
  - id: ERR_INVALID_GUEST_COUNT
    http: 422
    condition: "guest_count or actual_guest_count <= 0"
  - id: ERR_INVALID_TIME_WINDOW
    http: 422
    condition: "interval end not strictly after start"
  - id: ERR_EVENT_ORDER_NOT_FOUND
    http: 404
    condition: "event order id does not resolve"
  - id: ERR_MENU_ITEM_NOT_FOUND
    http: 404
    condition: "menu item id does not resolve"
  - id: ERR_INGREDIENT_NOT_FOUND
    http: 404
    condition: "ingredient id does not resolve"
  - id: ERR_STATION_NOT_FOUND
    http: 404
    condition: "station id does not resolve"
  - id: ERR_EQUIPMENT_NOT_FOUND
    http: 404
    condition: "equipment item id does not resolve"
  - id: ERR_STAFF_NOT_FOUND
    http: 404
    condition: "staff member id does not resolve"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "target order line / run / reservation / assignment / quote id does not resolve"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "requested lifecycle transition not defined from the current state"
  - id: ERR_ORDER_NOT_DRAFT
    http: 409
    condition: "order line create/delete attempted while order not DRAFT"
  - id: ERR_PRODUCTION_NOT_COMPLETE
    http: 409
    condition: "pack attempted while some non-CANCELLED run is not DONE"
  - id: ERR_NO_ORDER_LINES
    http: 422
    condition: "quote generation attempted with zero ACTIVE order lines"
  - id: ERR_STAFF_ROLE_MISMATCH
    http: 422
    condition: "assignment staff_role != StaffMember.staff_role"
  - id: ERR_NO_STAFF_CONFIRMED
    http: 422
    condition: "dispatch attempted with no CONFIRMED+ staff assignment"
  - id: ERR_STAFF_DOUBLE_BOOKED
    http: 409
    condition: "staff shift overlaps or is within STAFF_REST_BUFFER_MIN of another non-CANCELLED shift"
  - id: ERR_STATION_OVERBOOKED
    http: 409
    condition: "run window overlap on station exceeds concurrent_capacity"
  - id: ERR_INSUFFICIENT_INVENTORY
    http: 422
    condition: "ingredient on_hand_qty < required commitment for a run"
  - id: ERR_EQUIPMENT_UNAVAILABLE
    http: 409
    condition: "reservation qty + overlapping reserved qty exceeds total_units"
  - id: ERR_STALE_ORDER_VERSION
    http: 412
    condition: "expected_event_order_version != EventOrder.version on quote generation"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Admin
    description: "Commissary operations administrator; owns config assets (ingredients, stations, equipment, staff roster)."
    identity: opaque
    exclusive_operations:
      - "POST /ingredients"
      - "POST /stations"
      - "POST /equipment-items"
      - "POST /staff-members"
    shared_operations:
      - "all GET reads"
  - name: KitchenManager
    description: "Owns menu/BOM and production scheduling."
    identity: opaque
    exclusive_operations:
      - "POST /menu-items"
      - "POST /recipe-lines"
      - "POST /production-runs and its start/complete/reschedule/cancel actions"
      - "POST /event-orders/{id}/start-production"
      - "POST /event-orders/{id}/pack"
    shared_operations:
      - "all GET reads"
  - name: SalesManager
    description: "Owns event orders, order lines, quotes, confirmation, actualization, cancellation."
    identity: opaque
    exclusive_operations:
      - "POST /event-orders"
      - "POST /order-lines and DELETE /order-lines/{id}"
      - "POST /event-orders/{id}/quotes"
      - "POST /event-orders/{id}/revise"
      - "POST /event-orders/{id}/confirm"
      - "POST /event-orders/{id}/actualize"
      - "POST /event-orders/{id}/cancel"
    shared_operations:
      - "all GET reads"
  - name: EventCaptain
    description: "Owns staff scheduling, equipment reservations, delivery/setup dispatch and completion."
    identity: opaque
    exclusive_operations:
      - "POST /staff-assignments and its confirm/check-in/check-out/cancel actions"
      - "POST /rental-reservations and its cancel action"
      - "POST /event-orders/{id}/dispatch"
      - "POST /event-orders/{id}/complete"
    shared_operations:
      - "all GET reads"
