              captures: { pc_id: $.data.id }
            - call: "GET /amnesty/pre-clearances/${pc_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
              captures: { pc_v_stale: $.data.version }
            - call: "POST /amnesty/pre-clearances/${pc_id}/begin-review"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
          trigger:
            - call: "POST /amnesty/pre-clearances/${pc_id}/offer-terms"
              payload: { expected_pre_clearance_version: "${pc_v_stale}", offered_lookback_months: 48, offered_penalty_waiver_pct: 0.90, offered_interest_waiver_pct: 0.45 }
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
              captures: { err_stale: $.data.error_id }
            - call: "GET /amnesty/pre-clearances/${pc_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
              captures: { pc_v_fresh: $.data.version }
            - call: "POST /amnesty/pre-clearances/${pc_id}/offer-terms"
              payload: { expected_pre_clearance_version: "${pc_v_fresh}", offered_lookback_months: 48, offered_penalty_waiver_pct: 0.90, offered_interest_waiver_pct: 0.45 }
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
              captures: { err_lookback: $.data.error_id }
            - call: "POST /amnesty/pre-clearances/${pc_id}/offer-terms"
              payload: { expected_pre_clearance_version: "${pc_v_fresh}", offered_lookback_months: 36, offered_penalty_waiver_pct: 0.90, offered_interest_waiver_pct: 0.45 }
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
          assert:
            - "the first trigger returns status 412 with error_id ERR_STALE_PRE_CLEARANCE_VERSION"
            - "${pc_v_fresh} == ${pc_v_stale} + 1"
            - "the third trigger returns status 422 with error_id ERR_LOOKBACK_EXCEEDS_PROGRAM_LIMIT"
            - "after the third trigger PreClearanceRequest.${pc_id}.status == \"UNDER_REVIEW\" with round_index == 0"
            - "the fourth trigger returns status 200 with status == \"TERMS_OFFERED\""
            - "PreClearanceRequest.${pc_id}.round_index == 1 and counter_count == 0"
            - "PreClearanceRequest.${pc_id}.current_offer_lookback_months == 36"
            - "PreClearanceRequest.${pc_id}.last_offer_officer_user_id == \"officer-alpha\""
            - "GET /amnesty/pre-clearances/${pc_id}/negotiation-rounds?proposed_by=STATE returns total_count == 1"

      - name: stale_expected_agreement_version_is_refused_on_amendment
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[amend-stale-agreement]
          - validations[priority=10]
          - errors[ERR_STALE_AGREEMENT_VERSION]
        distinguishing_aspect: |
          The third OCC site is the amendment, where the stale read matters because the new
          draft copies the scope of the row it supersedes. The failed amendment creates no
          second agreement at all — the collection count stays at 1 — which distinguishes
          it from a partially applied amendment.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; OPEN program with one SALES_USE term"
            - "Taxpayer Brackenridge holds an EXECUTED agreement; the officer read its version, then the taxpayer remitted 60000 cents, advancing it"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs"
              payload: { name: "FY27 Amnesty", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z", lookback_months: 36, base_penalty_waiver_pct: 1.00, base_interest_waiver_pct: 0.50, post_program_penalty_multiplier: 2.00, revenue_forecast_cents: 100000000 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /amnesty/programs/${prog_id}/tax-type-terms"
              payload: { tax_type: "SALES_USE", eligible_period_start: "2020-01-01", eligible_period_end: "2026-07-01", min_liability_cents: 50000 }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs/${prog_id}/open"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /amnesty/taxpayers"
              payload: { legal_name: "Brackenridge Metals Inc", taxpayer_type: "BUSINESS", tin_last4: "2255" }
              as: ProgramAdministrator
              captures: { tp_id: $.data.id }
            - call: "POST /amnesty/agreements"
              payload: { program_id: "${prog_id}", taxpayer_id: "${tp_id}", tax_types: ["SALES_USE"], lookback_start_date: "2023-09-01", lookback_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
              captures: { agr_id: $.data.id }
            - call: "POST /amnesty/agreements/${agr_id}/execute"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "officer-beta"
            - call: "GET /amnesty/agreements/${agr_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
              captures: { agr_v_stale: $.data.version }
            - call: "POST /amnesty/payments"
              payload: { agreement_id: "${agr_id}", amount_cents: 60000, payment_reference: "GOODFAITH-1" }
              as: Taxpayer
              as_user_id: "${tp_id}"
          trigger:
            - call: "POST /amnesty/agreements/${agr_id}/amend"
              payload: { expected_agreement_version: "${agr_v_stale}", lookback_start_date: "2024-01-01", lookback_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
              captures: { err_id: $.data.error_id }
            - call: "GET /amnesty/agreements/${agr_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
              captures: { agr_v_fresh: $.data.version }
            - call: "POST /amnesty/agreements/${agr_id}/amend"
              payload: { expected_agreement_version: "${agr_v_fresh}", lookback_start_date: "2024-01-01", lookback_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
              captures: { new_agr_id: $.data.id }
          assert:
            - "the first trigger returns status 412 with error_id ERR_STALE_AGREEMENT_VERSION"
            - "after the first trigger VoluntaryDisclosureAgreement.${agr_id}.status == \"EXECUTED\" and GET /amnesty/agreements?program_id=${prog_id} returns total_count == 1"
            - "${agr_v_fresh} == ${agr_v_stale} + 1"
            - "the third trigger returns status 201"
            - "VoluntaryDisclosureAgreement.${new_agr_id}.amends_agreement_id == \"${agr_id}\" and version == 1"
            - "VoluntaryDisclosureAgreement.${agr_id}.status == \"SUPERSEDED\""
            - "GET /amnesty/agreements?program_id=${prog_id} returns total_count == 2"

      - name: version_increments_on_every_write_and_only_on_the_written_row
        claim_type: optimistic_concurrency
        grounds:
          - response_envelope
          - entities.AmnestyProgram
          - state_machines.AmnestyProgram
        distinguishing_aspect: |
          Version is per row and per write: the program walks 1 to 4 across create, open,
          close and reconcile, while its child term — untouched by any of those calls —
          stays at version 1 with its original updated_at. A global counter, or bumping
          children along with the parent, fails.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; a DRAFT program with one SALES_USE term exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs"
              payload: { name: "FY27 Amnesty", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z", lookback_months: 36, base_penalty_waiver_pct: 1.00, base_interest_waiver_pct: 0.50, post_program_penalty_multiplier: 2.00, revenue_forecast_cents: 100000000 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /amnesty/programs/${prog_id}/tax-type-terms"
              payload: { tax_type: "SALES_USE", eligible_period_start: "2020-01-01", eligible_period_end: "2026-07-01", min_liability_cents: 50000 }
              as: ProgramAdministrator
              captures: { term_id: $.data.id }
          trigger:
            - call: "POST /amnesty/programs/${prog_id}/open"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs/${prog_id}/close"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /amnesty/programs/${prog_id}/reconcile"
              payload: {}
              as: ProgramAdministrator
          assert:
            - "the program was created at version 1 with updated_at == created_at == \"2026-09-15T00:00:00.000Z\""
            - "after the first trigger AmnestyProgram.${prog_id}.version == 2 and status == \"OPEN\""
            - "after the third trigger AmnestyProgram.${prog_id}.version == 3, status == \"CLOSED\" and closed_at == \"2026-12-01T00:00:00.000Z\""
            - "after the fourth trigger AmnestyProgram.${prog_id}.version == 4 and status == \"RECONCILED\""
            - "AmnestyProgram.${prog_id}.updated_at == \"2026-12-01T00:00:00.000Z\""
            - "ProgramTaxTypeTerm.${term_id}.version == 1 and its updated_at is still \"2026-09-15T00:00:00.000Z\""
            - "AmnestyProgram.${prog_id}.final_realization_pct == 0.0000 (nothing was collected) and the revenue summary reports forecast_status SHORTFALL"

      - name: cascading_side_effects_across_a_multi_hop_chain
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: breach_declaration_cascades_five_hops_to_behavior_score
          rationale: |
            That instance verifies a five-hop chain end to end (agreement, returns, plan,
            installments, enforcement action, taxpayer score, program totals) from a
            single declare-breach call, which is the strongest form of this claim.

      - name: dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
        excluded_because:
          difficulty_instance: statutory_vs_negotiated_accrual_cutoff_divergence
          rationale: |
            That instance runs identical facts through both accrual variants in one
            fixture and asserts the full divergence, covering the layer claim.

      - name: rate_threshold_trigger_boundaries
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
        excluded_because:
          difficulty_instance: post_program_penalty_nested_cap_beats_escalated_rate
          rationale: |
            That instance sits on the escalated-tier rate, the behavior-score adjustment
            threshold and the 50 percent cap simultaneously, testing three thresholds at
            their boundaries in one assessment.

  # =========================================================================
  - section: Consistency Model
    instances:
      - name: derived_fields_are_visible_in_the_same_response_that_causes_them
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - response_envelope
          - calculations.return_statutory_liability
        distinguishing_aspect: |
          Consistency is immediate, so the /file response itself must already carry every
          derived figure — accrual_end_date, days_late, the applied rate, gross, waived and
          payable components — rather than exposing them only on a later read. The
          agreement rollup and the program totals are likewise current on the very next
          read, with no settling period.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; OPEN program with one SALES_USE term"
            - "Taxpayer Larkspur holds an EXECUTED agreement with one DRAFT return of 1000000 cents due 2025-10-27"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs"
              payload: { name: "FY27 Amnesty", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z", lookback_months: 36, base_penalty_waiver_pct: 1.00, base_interest_waiver_pct: 0.50, post_program_penalty_multiplier: 2.00, revenue_forecast_cents: 100000000 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /amnesty/programs/${prog_id}/tax-type-terms"
              payload: { tax_type: "SALES_USE", eligible_period_start: "2020-01-01", eligible_period_end: "2026-07-01", min_liability_cents: 50000 }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs/${prog_id}/open"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /amnesty/taxpayers"
              payload: { legal_name: "Larkspur Textiles LLC", taxpayer_type: "BUSINESS", tin_last4: "6677" }
              as: ProgramAdministrator
              captures: { tp_id: $.data.id }
            - call: "POST /amnesty/agreements"
              payload: { program_id: "${prog_id}", taxpayer_id: "${tp_id}", tax_types: ["SALES_USE"], lookback_start_date: "2023-09-01", lookback_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
              captures: { agr_id: $.data.id }
            - call: "POST /amnesty/agreements/${agr_id}/execute"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "officer-beta"
            - call: "POST /amnesty/agreements/${agr_id}/returns"
              payload: { tax_type: "SALES_USE", period_start_date: "2025-01-01", period_end_date: "2025-03-31", original_due_date: "2025-10-27", reported_tax_cents: 1000000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
          trigger:
            - call: "POST /amnesty/returns/${ret_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "GET /amnesty/agreements/${agr_id}"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "auditor-one"
            - call: "GET /amnesty/programs/${prog_id}/revenue-summary"
              payload: {}
              as: ProgramAdministrator
          assert:
            - "the FIRST trigger's own response body already carries status FILED, accrual_end_date 2026-12-01, days_late 400, penalty_rate_applied 0.25, gross_penalty_cents 250000, gross_interest_cents 100000, waived_penalty_cents 250000, waived_interest_cents 50000, payable_interest_cents 50000 and balance_due_cents 1050000"
            - "the first trigger's response also carries filed_at == \"2026-09-15T00:00:00.000Z\" and version == 2"
            - "the second trigger reports gross_liability_cents 1350000, waived_amount_cents 300000, total_due_cents 1050000 and payment_status UNPAID with no intervening write"
            - "the third trigger reports waived_total_cents 300000, collected_cents 0, realization_pct 0.0000, forecast_status SHORTFALL and participant_count 1"
            - "no re-read is required for any of these values to appear"

      - name: cascade_visibility_without_a_settling_delay
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        excluded_because:
          difficulty_instance: breach_declaration_cascades_five_hops_to_behavior_score
          rationale: |
            That instance asserts every hop of a five-level cascade — including the
            taxpayer score and the program totals — on the first read after the triggering
            call, which is exactly the immediate-consistency claim applied to derived data.
