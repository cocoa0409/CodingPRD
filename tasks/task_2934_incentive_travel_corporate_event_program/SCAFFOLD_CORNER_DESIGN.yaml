      trigger:
      - POST /destinations/${d3_id}/shortlist as SourcingManager sm-01.
      - POST /destinations/${d4_id}/shortlist as SourcingManager sm-01.
      - POST /qualifiers/${qt_id}/review as SalesOpsAnalyst so-01.
      - 'POST /programs/${p_id}/advance {"to_status": "REGISTRATION_OPEN"} as ProgramDirector pd-01.'
      - 'POST /programs/${p_id}/advance {"to_status": "ONSITE"} as ProgramDirector pd-01.'
      - 'POST /programs {"name": "FY28 Chairmans Club", "fiscal_year": 2028, "qualification_metric": "NET_REVENUE_CENTS",
        "sales_period_start": "2028-01-01T00:00:00Z", "sales_period_end": "2028-06-30T00:00:00Z", "budget_total_cents":
        1000000} as ProgramDirector pd-01, then POST /programs/{that program_id}/advance {"to_status":
        "SOURCING"}.'
      assert:
      - 'Shortlisting Cartagena returns ERR_DESTINATION_RISK_TOO_HIGH with HTTP 422: risk_score 61 is
        one point above MAX_DESTINATION_RISK 60, and its inspection_score 88 clears the other gate, so
        only the risk rule can be responsible.'
      - 'Shortlisting Naples returns ERR_INSPECTION_SCORE_BELOW_MINIMUM with HTTP 422: inspection_score
        69 is one point below MIN_INSPECTION_SCORE 70 while risk_score 40 clears the risk gate.'
      - Both destinations remain status "CANDIDATE" and inspection_status "INSPECTED" — a rejected shortlist
        does not partially apply.
