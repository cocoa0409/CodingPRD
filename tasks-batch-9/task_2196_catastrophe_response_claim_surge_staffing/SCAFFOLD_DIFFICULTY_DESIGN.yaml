      - name: deployment_containment_semantics_inclusive_bounds_one_second_out
        grounds:
          - validations[priority=26]
          - validations[priority=25]
          - errors[ERR_ASSIGNMENT_OUTSIDE_DEPLOYMENT]
          - errors[ERR_ASSIGNMENT_WINDOW_CONFLICT]
          - endpoints[POST /inspection-assignments]
        distinguishing_aspect: |
          Resource entity: Deployment (as the enclosing window). Interval semantics: CONTAINMENT with
          INCLUSIVE bounds — deployment.window_start_utc <= new.start AND new.end <= deployment.window_end_utc.
          This is the third distinct semantics in this rule: not a pad (instance 1) and not an aggregate
          capacity count (instance 2) but a subset test. Probed at both edges: a probe flush against the
          deployment's start is accepted, and a probe exceeding the deployment's end by exactly one second is
          rejected. The instance also pins the CONTRASTING per-Adjuster STRICT half-open zero-buffer axis
          (priority 25) by accepting exact adjacency between two assignments of the same adjuster, which the
          buffered axis in instance 1 rejects.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z startup default."
            - "One CatastropheEvent 'CAT-2026-803' in DECLARED: HURRICANE, FL, expected_severity_index 0.1000, posture OPEN."
            - "One DESK-certified STAFF Adjuster licensed in FL with max_open_claims 5."
            - "One CONFIRMED Deployment D, role_type DESK (so no HousingBlock participates), window 2026-09-04T00:00:00Z -> 2026-09-10T00:00:00Z."
            - "Three identical Claims P, Q, R each triaged to severity_score 4.30 / FAST_TRACK / inspection_mode DESK: base = 100.0*min(1.0, 8000/400000) = 2.00; raw = 2.00*1.15 + 0.0 + 0.0 + 20.0*0.1000 = 2.30 + 2.00 = 4.30; case_reserve = round(max(8000, min(9000,400000)-1000)*0.25, 2) = round(8000.00*0.25,2) = 2000.00."
            - "Probe 1 on claim P: window 2026-09-04T00:00:00Z -> 2026-09-06T00:00:00Z — flush against D.window_start_utc, so the inclusive lower bound is exercised and accepted."
            - "Probe 2 on claim Q: window 2026-09-06T00:00:00Z -> 2026-09-08T00:00:00Z — new.start == probe 1's end for the SAME adjuster, accepted because priority 25 is strict half-open with zero buffer."
          setup_api_calls:
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-803", peril_type: "HURRICANE", jurisdiction_state: "FL", event_start_utc: "2026-07-31T00:00:00.000Z", exposure_count: 1300, avg_insured_value: 260000, expected_severity_index: 0.1000 }
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { ev: $.data.id }
            - call: "POST /catastrophe-events/${ev}/declare"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
            - call: "POST /adjusters"
              payload: { full_name: "Contain Probe", employment_type: "STAFF", home_state: "FL", licensed_states: ["FL"], license_expiry_utc: "2027-08-31T00:00:00.000Z", max_open_claims: 5, daily_rate: 520, per_diem_rate: 0, desk_certified: true, aerial_certified: false }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
              captures: { adj: $.data.id }
            - call: "POST /deployments"
              payload: { event_id: "${ev}", role_type: "DESK", window_start_utc: "2026-09-04T00:00:00.000Z", window_end_utc: "2026-09-10T00:00:00.000Z", adjuster_id: "${adj}" }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
              captures: { dep: $.data.id }
            - call: "POST /deployments/${dep}/confirm"
              payload: {}
              as: DeploymentCoordinator
              as_user_id: "dc_1"
            - call: "POST /claims"
              payload: { policy_number: "POL-8301", loss_state: "FL", loss_date_utc: "2026-07-31T00:00:00.000Z", reported_loss_amount: 8000, coverage_lines: [{ coverage_code: "DWELLING", limit_amount: 400000, deductible_amount: 1000, estimated_damage_amount: 9000 }], event_id: "${ev}", access_status: "ACCESSIBLE" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { cp: $.data.id }
            - call: "POST /claims/${cp}/triage"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ce_1"
            - call: "POST /claims"
              payload: { policy_number: "POL-8302", loss_state: "FL", loss_date_utc: "2026-07-31T00:00:00.000Z", reported_loss_amount: 8000, coverage_lines: [{ coverage_code: "DWELLING", limit_amount: 400000, deductible_amount: 1000, estimated_damage_amount: 9000 }], event_id: "${ev}", access_status: "ACCESSIBLE" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { cq: $.data.id }
            - call: "POST /claims/${cq}/triage"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ce_1"
            - call: "POST /claims"
              payload: { policy_number: "POL-8303", loss_state: "FL", loss_date_utc: "2026-07-31T00:00:00.000Z", reported_loss_amount: 8000, coverage_lines: [{ coverage_code: "DWELLING", limit_amount: 400000, deductible_amount: 1000, estimated_damage_amount: 9000 }], event_id: "${ev}", access_status: "ACCESSIBLE" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { cr: $.data.id }
            - call: "POST /claims/${cr}/triage"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ce_1"
            - call: "POST /inspection-assignments"
              payload: { claim_id: "${cp}", mode: "DESK", window_start_utc: "2026-09-04T00:00:00.000Z", window_end_utc: "2026-09-06T00:00:00.000Z", adjuster_id: "${adj}", deployment_id: "${dep}" }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
              captures: { a_p: $.data.id }
            - call: "POST /inspection-assignments"
              payload: { claim_id: "${cq}", mode: "DESK", window_start_utc: "2026-09-06T00:00:00.000Z", window_end_utc: "2026-09-08T00:00:00.000Z", adjuster_id: "${adj}", deployment_id: "${dep}" }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
              captures: { a_q: $.data.id }
          trigger:
            - call: "POST /inspection-assignments"
              payload: { claim_id: "${cr}", mode: "DESK", window_start_utc: "2026-09-09T00:00:00.000Z", window_end_utc: "2026-09-10T00:00:01.000Z", adjuster_id: "${adj}", deployment_id: "${dep}" }
              as: DeploymentCoordinator
