              payload: { full_name: "Exp One", employee_number: "E-C-440", home_country_code: "US", home_state_code: "NY", hire_date: "2019-01-07", birth_date: "1979-09-09", insider_status: "DESIGNATED_INSIDER" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { p1_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "Exp Two", employee_number: "E-C-441", home_country_code: "US", home_state_code: "NY", hire_date: "2019-01-07", birth_date: "1980-10-10", insider_status: "DESIGNATED_INSIDER" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { p2_id: $.data.id }
            - call: "POST /trading-windows"
              payload: { plan_id: "${plan_id}", quarter_label: "FY2026-Q1", open_at: "2026-01-05T00:00:00Z", close_at: "2026-03-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { w_id: $.data.id }
            - call: "POST /trading-windows/${w_id}/status"
              payload: { action: "OPEN" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /preclearance-requests"
              payload: { participant_id: "${p1_id}", window_id: "${w_id}", transaction_type: "OPEN_MARKET_SALE", requested_shares: 200, intended_trade_date: "2026-01-09" }
              as: Participant
              as_user_id: "${p1_id}"
              captures: { pr_a_id: $.data.id }
            - call: "POST /preclearance-requests/${pr_a_id}/decide"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /preclearance-requests"
              payload: { participant_id: "${p2_id}", window_id: "${w_id}", transaction_type: "OPEN_MARKET_SALE", requested_shares: 150, intended_trade_date: "2026-01-09" }
              as: Participant
              as_user_id: "${p2_id}"
              captures: { pr_b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-12T09:00:00Z" }
