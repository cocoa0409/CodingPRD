              as: WarehouseOperator
              captures: { nr_prod_id: $.data.id }
            - call: "POST /yeast-strains"
              payload: { strain_code: "WLP001", name: "California Ale", fermentation_type: "ALE", propagation_lead_time_days: 7, list_price_cents_per_l: 1200.00, viability_pct_at_ship: 92.0, cells_per_ml_slurry_billion: 1.2, min_batch_l: 20.0, vessel_max_l: 2000.0 }
              as: WarehouseOperator
              captures: { nr_strain_id: $.data.id }
            - call: "POST /brewer-recipes"
              payload: { brewer_id: "${nr_id}", malt_product_id: "${nr_prod_id}", yeast_strain_id: "${nr_strain_id}", name: "House Pale", batch_volume_bbl: 30.0, original_gravity_plato: 12.50, target_color_lovibond: 2.50, target_extract_pct: 80.00, target_protein_pct: 11.00, requested_pitch_rate_million_cells_per_ml_per_plato: 0.75 }
              as: Brewer
              as_user_id: "${nr_id}"
              captures: { nr_recipe_id: $.data.id }
            - call: "POST /yeast-propagation-jobs"
              payload: { brewer_id: "${nr_id}", recipe_id: "${nr_recipe_id}", yeast_strain_id: "${nr_strain_id}", pitch_date: "2026-08-20T00:00:00Z" }
              as: WarehouseOperator
              captures: { nr_job_id: $.data.id, nr_job_state: $.data.status }
            - call: "POST /sales-orders"
              payload: { brewer_id: "${nr_id}", requested_ship_date: "2026-08-15T00:00:00Z", purchase_order_ref: "PO-NR" }
              as: Brewer
              as_user_id: "${nr_id}"
              captures: { nr_o_id: $.data.id }
