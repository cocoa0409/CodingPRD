            - "GET /denied-entry-incidents has total_count == 0 — a priority-19 rejection books no incident and no strike"
            - "${live} == 1 and ${peak} == 2 — Ada in, Bob in, Ada out"
            - "Ticket.${t_ada_id}.admission_status == EXITED and Ticket.${t_bob_id}.admission_status == INSIDE"

