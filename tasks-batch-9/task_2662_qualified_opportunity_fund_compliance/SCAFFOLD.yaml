# =============================================================================
# SCAFFOLD.yaml — Qualified Opportunity Fund Compliance
# Sections §1.0 – §1.7 (response envelope, entities, state machines,
# concurrency rules, calculations, validations, endpoints, errors, RBAC).
# §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml; §1.9 in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2662. Qualified Opportunity Fund Compliance (qualified opportunity fund manager): investor eligible gain intake with 180-day investment deadline verification, fund self-certification and semiannual ninety-percent asset test measurement, qualified opportunity zone business testing on gross income, intangibles and nonqualified financial property, substantial improvement requirement measurement against basis within the thirty-month window, working capital safe harbor plan documentation and spend schedule, penalty calculation for failed testing dates and cure options, ten-year hold basis step-up election and asset disposition sequencing, investor reporting and inclusion event tracking

domain_name: "qualified-opportunity-fund-compliance"
api_prefix: "/qof"

# ---------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# ---------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §0.1–§0.3 Complexity profile
# ---------------------------------------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - rate_threshold_triggers
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency

  entity_topology: flat
  # Fourteen peer entities joined exclusively by FK fields. No entity is nested
  # inside another in a URL path for its own identity: every resource is
  # addressed at `/qof/<collection>/{id}`. Action and event sub-paths
  # (`/qof/funds/{id}/asset-tests`, `/qof/wcsh-plans/{id}/expenditures`) exist
  # only as creation/read channels for children that are discovered through
  # their FK, never as an identity path for the child itself.

  state_machine_shape: cyclic
  # EligibleGain cycles ELIGIBLE -> PARTIALLY_INVESTED -> FULLY_INVESTED and
  # back down on revocation; PenaltyAssessment cycles
  # ASSESSED -> CURE_REQUESTED -> ASSESSED on a denied REASONABLE_CAUSE cure.
  # Fund carries two independent state dimensions
  # (certification_status x compliance_posture)
  # and BusinessTest forks MEASURED -> {PASSED, FAILED} with divergent
  # side-effect sets.

  relationship_patterns:
    - one_to_many          # Fund -> FundAsset, Fund -> AssetTest, QOZBusiness -> BusinessTest
    - cross_aggregate      # DeferralElection joins the Investor aggregate to the Fund aggregate
    - polymorphic          # CapitalExpenditure attaches to EITHER an ImprovementProject OR a WorkingCapitalPlan
    - self_referential     # ImprovementProject.group_key links sibling projects into one aggregation group

  role_model: segregation_of_duties
  # The ComplianceOfficer who measured a test may not certify it
  # (measured_by_user_id != X-User-ID), and FundManager may never certify.

  consistency_model: immediate
  # Every derived field (Fund.aggregate_*, EligibleGain.unelected_amount,
  # QOZBusiness.nqfp_amount, Fund.cumulative_penalty_months) is recomputed
  # inside the mutating request and is observable in that request's response.

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table (14 entities)
# ---------------------------------------------------------------------------
entities:

  - name: Investor
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Taxpayer legal name on the deferral election.
        constraints: "1..200 chars, non-blank"
      - name: taxpayer_type
        type: enum
        source: input
        description: Federal taxpayer classification driving which deadline_basis values are legal.
        constraints: "INDIVIDUAL | PARTNERSHIP | C_CORPORATION | TRUST"
      - name: tax_year_end_month
        type: integer
        source: input
        description: Calendar month in which the taxpayer's tax year ends.
        default: 12
        constraints: "1..12"
      - name: compliance_attestation_status
        type: enum
        source: input
        description: KYC/anti-abuse attestation posture; only ATTESTED investors may make a deferral election.
        default: PENDING
        constraints: "PENDING | ATTESTED | BLOCKED"
      - name: eligible_gain_total
        type: number
        source: computed
        description: "Sum of EligibleGain.eligible_amount over gains with investor_id == this Investor.id and status IN {ELIGIBLE, PARTIALLY_INVESTED, FULLY_INVESTED, EXPIRED}; 2 dp."
        default: 0.00
      - name: deferred_gain_outstanding
        type: number
        source: computed
        description: "Sum of DeferralElection.deferred_remaining over elections with investor_id == this Investor.id and status IN {DEFERRED, STEPPED_UP, INCLUDED_PARTIAL}; 2 dp."
        default: 0.00
      - name: included_gain_total
        type: number
        source: computed
        description: "Sum of DeferralElection.included_amount over elections with investor_id == this Investor.id and status IN {INCLUDED_PARTIAL, INCLUDED_FULL}; 2 dp."
        default: 0.00

  - name: Fund
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Fund legal name.
        constraints: "1..200 chars, non-blank"
      - name: entity_type
        type: enum
        source: input
        description: Fund's federal entity classification for the self-certification filing.
        constraints: "CORPORATION | PARTNERSHIP"
      - name: manager_user_id
        type: string
        source: input
        description: "Opaque FundManager operator id that owns this fund. NOT a foreign key to any entity: it is compared against X-User-ID for FundManager calls only."
        constraints: "1..64 chars, non-blank"
      - name: asset_test_valuation_method
        type: enum
        source: input
        description: Fund-level election selecting which valuation variant the 90-percent asset test uses by default.
        default: UNADJUSTED_COST_BASIS
        constraints: "APPLICABLE_FINANCIAL_STATEMENT | UNADJUSTED_COST_BASIS"
      - name: certification_status
        type: enum
        source: computed
        description: First independent state dimension — self-certification lifecycle.
        default: DRAFT
        constraints: "DRAFT | SELF_CERTIFIED | DECERTIFIED"
      - name: compliance_posture
        type: enum
        source: computed
        description: Second independent state dimension — rolling 90-percent asset test posture; evolves without changing certification_status.
        default: UNTESTED
        constraints: "UNTESTED | COMPLIANT | DEFICIENT | CURE_PENDING | FAILED_FINAL"
      - name: first_taxable_month_iso8601
        type: datetime
        source: computed
        description: First month the fund elects to be treated as a QOF; stamped by self-certification. Null before self-certification.
      - name: self_certification_date
        type: datetime
        source: computed
        description: Logical-clock instant at which certification_status became SELF_CERTIFIED. Null before that.
      - name: aggregate_asset_basis
        type: number
        source: computed
        description: "Sum of FundAsset.unadjusted_cost_basis over assets with fund_id == this Fund.id and status IN {HELD, IMPROVING}; 2 dp."
        default: 0.00
      - name: aggregate_qualified_basis
        type: number
        source: computed
        description: "Sum of FundAsset.unadjusted_cost_basis over assets with fund_id == this Fund.id, status IN {HELD, IMPROVING} and qualification == QUALIFIED; 2 dp."
        default: 0.00
      - name: aggregate_afs_value
        type: number
        source: computed
        description: "Sum of FundAsset.afs_fair_value over assets with fund_id == this Fund.id and status IN {HELD, IMPROVING}; 2 dp."
        default: 0.00
      - name: aggregate_qualified_afs_value
        type: number
        source: computed
        description: "Sum of FundAsset.afs_fair_value over assets with fund_id == this Fund.id, status IN {HELD, IMPROVING} and qualification == QUALIFIED; 2 dp."
        default: 0.00
      - name: deferred_gain_committed
        type: number
        source: computed
        description: "Sum of DeferralElection.elected_amount over elections with fund_id == this Fund.id and status != REVOKED; 2 dp."
        default: 0.00
      - name: cumulative_penalty_months
        type: integer
        source: computed
        description: "Conserved quantity: sum of PenaltyAssessment.failed_month_count over assessments with fund_id == this Fund.id and status IN {ASSESSED, CURE_REQUESTED, UPHELD}."
        default: 0
      - name: consecutive_failed_tests
        type: integer
        source: computed
        description: Count of consecutive AssetTest rows for this fund, ordered by measurement_date ASC then created_at ASC, ending at the latest one, whose status == CERTIFIED_FAIL. Reset to 0 by any CERTIFIED_PASS.
        default: 0
      - name: last_test_measurement_date
        type: datetime
        source: computed
        description: measurement_date of the AssetTest for this fund with the greatest (measurement_date, created_at); null when none exists.

  - name: EligibleGain
    parent: null
    common_fields: true
    fields:
      - name: investor_id
        type: string
        source: input
        description: "FK -> Investor.id; the taxpayer that realized the gain and owns every election against it."
      - name: gain_character
        type: enum
        source: input
        description: Tax character of the realized gain; ORDINARY is never eligible for deferral.
        constraints: "SHORT_TERM_CAPITAL | LONG_TERM_CAPITAL | SECTION_1231_NET | ORDINARY"
      - name: eligible_amount
        type: number
        source: input
        description: Gross gain dollars available for deferral.
        constraints: "> 0.00, 2 dp"
      - name: realization_date
        type: datetime
        source: input
        description: Instant the gain was realized on the underlying sale or exchange.
      - name: deadline_basis
        type: enum
        source: input
        description: Selects which of the two 180-day window variants applies (see calculations.eligible_gain_investment_deadline).
        constraints: "SALE_DATE | PARTNERSHIP_YEAR_END | SECTION_1231_YEAR_END"
      - name: pass_through_year_end
        type: datetime
        source: input
        description: Pass-through entity or Section 1231 tax-year-end instant; required when deadline_basis != SALE_DATE, forbidden when deadline_basis == SALE_DATE.
      - name: window_basis_date
        type: datetime
        source: computed
        description: The date the 180-day clock actually starts from, resolved from deadline_basis.
      - name: investment_deadline
        type: datetime
        source: computed
        description: window_basis_date + 180 days; an election is timely when its investment_date is on or before this instant's calendar day.
      - name: elected_amount
        type: number
        source: computed
        description: "Sum of DeferralElection.elected_amount over elections with eligible_gain_id == this EligibleGain.id and status != REVOKED; 2 dp."
        default: 0.00
      - name: unelected_amount
        type: number
        source: computed
        description: "Conserved remainder: eligible_amount - elected_amount; 2 dp. Never negative."
      - name: status
        type: enum
        source: computed
        description: Investment lifecycle of the gain; cycles back down when elections are revoked.
        default: ELIGIBLE
        constraints: "ELIGIBLE | PARTIALLY_INVESTED | FULLY_INVESTED | EXPIRED"
      - name: expired_at
        type: datetime
        source: computed
        description: Logical-clock instant at which the deadline sweep moved this gain to EXPIRED; null otherwise.

  - name: DeferralElection
    parent: null
    common_fields: true
    fields:
      - name: eligible_gain_id
        type: string
        source: input
        description: "FK -> EligibleGain.id; the gain whose dollars this election defers."
      - name: fund_id
        type: string
        source: input
        description: "FK -> Fund.id; the QOF that received the investment."
      - name: investor_id
        type: string
        source: computed
        description: "FK -> Investor.id; copied from EligibleGain.investor_id at creation and immutable thereafter."
      - name: elected_amount
        type: number
        source: input
        description: Gain dollars invested in the fund by this election.
        constraints: "> 0.00, 2 dp, <= EligibleGain.unelected_amount at creation time"
      - name: investment_date
        type: datetime
        source: computed
        description: Logical-clock instant at which the election was created; drives 180-day verification and every holding-period tier.
      - name: days_from_basis
        type: integer
        source: computed
        description: "floor((investment_date - EligibleGain.window_basis_date) / 1 day) at creation time."
      - name: initial_basis
        type: number
        source: computed
        description: Statutory basis in the qualifying investment immediately after the election; always 0.00.
        default: 0.00
      - name: current_basis
        type: number
        source: computed
        description: Basis after any granted ten-year step-up election; equals initial_basis until a StepUpElection is GRANTED.
        default: 0.00
      - name: step_up_applied_pct
        type: number
        source: computed
        description: 1.0000 once a StepUpElection on this election is GRANTED, else 0.0000. 4 dp.
        default: 0.0000
      - name: holding_tier
        type: enum
        source: computed
        description: Holding tier as of the fund's logical clock at the most recent read-affecting mutation on this election.
        default: UNDER_FIVE
        constraints: "UNDER_FIVE | FIVE_YEAR | SEVEN_YEAR | TEN_YEAR"
      - name: included_amount
        type: number
        source: computed
        description: "Sum of InclusionEvent.net_inclusion_amount over events with deferral_election_id == this DeferralElection.id; 2 dp."
        default: 0.00
      - name: included_fraction_total
        type: number
        source: computed
        description: "Sum of InclusionEvent.included_fraction over events with deferral_election_id == this DeferralElection.id; 4 dp; capped at 1.0000."
        default: 0.0000
      - name: deferred_remaining
        type: number
        source: computed
        description: "round(elected_amount * (1.0000 - included_fraction_total), 2); 0.00 once fully included; 0.00 when status == REVOKED."
        default: 0.00
      - name: status
        type: enum
        source: computed
        description: Election lifecycle; branches into the step-up path or the inclusion path.
        default: DEFERRED
        constraints: "DEFERRED | STEPPED_UP | INCLUDED_PARTIAL | INCLUDED_FULL | REVOKED"
      - name: revoked_reason_code
        type: enum
        source: computed
        description: Reason recorded when the election was revoked; NONE while status != REVOKED.
        default: NONE
        constraints: "NONE | INVESTOR_WITHDRAWAL | FUND_REJECTED | ADMIN_CORRECTION"

  - name: FundAsset
    parent: null
    common_fields: true
    fields:
      - name: fund_id
        type: string
        source: input
        description: "FK -> Fund.id; the QOF that holds this asset."
      - name: qoz_business_id
        type: string
        source: input
        description: "FK -> QOZBusiness.id; nullable — populated only when asset_class == QOZB_EQUITY, in which case the asset's qualification tracks that business's qualification_status."
      - name: asset_class
        type: enum
        source: input
        description: Statutory classification of the holding.
        constraints: "QOZ_BUSINESS_PROPERTY | QOZB_EQUITY | NONQUALIFIED_FINANCIAL_PROPERTY | CASH"
      - name: acquisition_date
        type: datetime
        source: input
        description: Instant the fund acquired the asset; asset-test inclusion uses this against the test period.
      - name: acquired_from_related_party
        type: boolean
        source: input
        description: True when the seller was a related party, which blocks QUALIFIED status outright.
        default: false
      - name: original_use_in_zone
        type: boolean
        source: input
        description: True when original use of the property in the zone commences with the fund; false means substantial improvement is required to qualify.
        default: false
      - name: unadjusted_cost_basis
        type: number
        source: input
        description: Unadjusted cost basis in dollars — the denominator input for the UNADJUSTED_COST_BASIS valuation variant.
        constraints: ">= 0.00, 2 dp"
      - name: afs_fair_value
        type: number
        source: input
        description: Applicable-financial-statement carrying value in dollars — the denominator input for the APPLICABLE_FINANCIAL_STATEMENT valuation variant.
        constraints: ">= 0.00, 2 dp"
      - name: adjusted_basis
        type: number
        source: computed
        description: "unadjusted_cost_basis + sum(CapitalExpenditure.amount) over expenditures whose improvement_project_id belongs to an ImprovementProject with fund_asset_id == this FundAsset.id and counts_toward_basis == true; 2 dp."
      - name: qualification
        type: enum
        source: computed
        description: Whether the asset counts in the 90-percent numerator right now.
        default: NONQUALIFIED
        constraints: "QUALIFIED | NONQUALIFIED | IMPROVEMENT_PENDING"
      - name: status
        type: enum
        source: computed
        description: Holding lifecycle; only HELD and IMPROVING assets enter asset-test aggregates.
        default: HELD
        constraints: "HELD | IMPROVING | DISPOSED"
      - name: disposed_at
        type: datetime
        source: computed
        description: Logical-clock instant of disposition; null while status != DISPOSED.
      - name: disposition_sequence_index
        type: integer
        source: computed
        description: 1-based position of this asset inside the disposition_sequence of the most recently GRANTED StepUpElection whose election's fund_id == this asset's fund_id; null when the asset is not listed.
      - name: proceeds_amount
        type: number
        source: computed
        description: Gross proceeds recorded at disposition; 0.00 while status != DISPOSED.
        default: 0.00

  - name: QOZBusiness
    parent: null
    common_fields: true
    fields:
      - name: fund_id
        type: string
        source: input
        description: "FK -> Fund.id; the QOF that owns equity in this operating business."
      - name: legal_name
        type: string
        source: input
        description: Operating business legal name.
        constraints: "1..200 chars, non-blank"
      - name: zone_tract_code
        type: string
        source: input
        description: Designated opportunity-zone census tract code the business operates in.
        constraints: "exactly 11 characters"
      - name: declared_nqfp_amount
        type: number
        source: input
        description: Nonqualified financial property the business itself reports, before any working-capital safe-harbor exclusion.
        constraints: ">= 0.00, 2 dp"
      - name: total_asset_value
        type: number
        source: input
        description: Total asset value reported by the business, used as the NQFP denominator when no measurement override is supplied.
        constraints: "> 0.00, 2 dp"
      - name: total_tangible_property_basis
        type: number
        source: input
        description: Aggregate basis of tangible property held by the business.
        constraints: ">= 0.00, 2 dp"
      - name: wcsh_protected_amount
        type: number
        source: computed
        description: "Sum of (WorkingCapitalPlan.covered_amount - WorkingCapitalPlan.spent_total) over plans with qoz_business_id == this QOZBusiness.id and status == ACTIVE; 2 dp."
        default: 0.00
      - name: blown_unspent_amount
        type: number
        source: computed
        description: "Sum of WorkingCapitalPlan.unspent_amount over plans with qoz_business_id == this QOZBusiness.id and status == BLOWN; 2 dp."
        default: 0.00
      - name: nqfp_amount
        type: number
        source: computed
        description: "max(0.00, round(declared_nqfp_amount + blown_unspent_amount - wcsh_protected_amount, 2)) — the NQFP figure the three-prong test actually measures."
        default: 0.00
      - name: qualification_status
        type: enum
        source: computed
        description: Rolling qualification of the operating business; DISQUALIFIED propagates to every QOZB_EQUITY FundAsset pointing at it.
        default: UNTESTED
        constraints: "UNTESTED | QUALIFIED | AT_RISK | DISQUALIFIED"
      - name: consecutive_failed_business_tests
        type: integer
        source: computed
        description: Count of consecutive BusinessTest rows for this business, ordered by testing_date ASC then created_at ASC, ending at the latest one, whose status == FAILED. Reset to 0 by any PASSED.
        default: 0

  - name: BusinessTest
    parent: null
    common_fields: true
    fields:
      - name: qoz_business_id
        type: string
        source: input
        description: "FK -> QOZBusiness.id; the business being tested on this testing date."
      - name: testing_date
        type: datetime
        source: input
        description: Semiannual testing date the measurement is attributed to.
      - name: safe_harbor_used
        type: enum
        source: input
        description: Which 50-percent gross-income safe harbor the measurement relies on; selects the gross_income_pct branch.
        constraints: "FIFTY_PCT_HOURS | FIFTY_PCT_AMOUNTS_PAID | MANAGEMENT_AND_TANGIBLE | GROSS_INCOME_ACTUAL"
      - name: hours_zone_pct
        type: number
        source: input
        description: Percentage of services hours performed inside the zone; required when safe_harbor_used == FIFTY_PCT_HOURS. 4 dp.
        constraints: "0.0000..100.0000"
      - name: amounts_paid_zone_pct
        type: number
        source: input
        description: Percentage of amounts paid for services performed inside the zone; required when safe_harbor_used == FIFTY_PCT_AMOUNTS_PAID. 4 dp.
        constraints: "0.0000..100.0000"
      - name: gross_income_zone_amount
        type: number
        source: input
        description: Gross income derived from the active conduct of business inside the zone.
        constraints: ">= 0.00, 2 dp"
      - name: gross_income_total_amount
        type: number
        source: input
        description: Total gross income of the business for the measurement period.
        constraints: ">= 0.00, 2 dp"
      - name: intangibles_zone_use_amount
        type: number
        source: input
        description: Intangible property value used in the active conduct of business inside the zone.
        constraints: ">= 0.00, 2 dp"
      - name: intangibles_total_amount
        type: number
        source: input
        description: Total intangible property value held by the business.
        constraints: ">= 0.00, 2 dp"
      - name: total_asset_value_measured
        type: number
        source: input
        description: Total asset value as measured on this testing date; the NQFP prong denominator.
        constraints: "> 0.00, 2 dp"
      - name: nqfp_amount_measured
        type: number
        source: computed
        description: Snapshot of QOZBusiness.nqfp_amount taken at measurement time.
        default: 0.00
      - name: gross_income_pct
        type: number
        source: computed
        description: Gross-income prong percentage produced by the safe_harbor_used branch; 4 dp.
        default: 0.0000
      - name: intangibles_pct
        type: number
        source: computed
        description: Intangibles prong percentage; 4 dp.
        default: 0.0000
      - name: nqfp_pct
        type: number
        source: computed
        description: NQFP prong percentage; 4 dp.
        default: 0.0000
      - name: gross_income_prong
        type: enum
        source: computed
        description: PASS when gross_income_pct >= 50.0000, else FAIL; PENDING before measurement.
        default: PENDING
        constraints: "PENDING | PASS | FAIL"
      - name: intangibles_prong
        type: enum
        source: computed
        description: PASS when intangibles_pct >= 40.0000, else FAIL; PENDING before measurement.
        default: PENDING
        constraints: "PENDING | PASS | FAIL"
      - name: nqfp_prong
        type: enum
        source: computed
        description: PASS when nqfp_pct <= 5.0000, else FAIL; PENDING before measurement.
        default: PENDING
        constraints: "PENDING | PASS | FAIL"
      - name: status
        type: enum
        source: computed
        description: Test lifecycle; forks from MEASURED into PASSED or FAILED with different side-effect sets.
        default: DRAFT
        constraints: "DRAFT | MEASURED | PASSED | FAILED"
      - name: measured_by_user_id
        type: string
        source: computed
        description: X-User-ID of the operator that ran the measurement; null before measurement. Compared against the certifier for segregation of duties.
      - name: certified_by_user_id
        type: string
        source: computed
        description: X-User-ID of the ComplianceOfficer that certified the test; null before certification.

  - name: AssetTest
    parent: null
    common_fields: true
    fields:
      - name: fund_id
        type: string
        source: input
        description: "FK -> Fund.id; the fund whose 90-percent asset test this row measures."
      - name: measurement_date
        type: datetime
        source: input
        description: Semiannual testing date the ratio is measured on.
      - name: period_start
        type: datetime
        source: input
        description: Inclusive lower bound of the half-open testing period [period_start, period_end).
      - name: period_end
        type: datetime
        source: input
        description: Exclusive upper bound of the half-open testing period [period_start, period_end). Back-to-back periods may share this instant.
      - name: valuation_method
        type: enum
        source: computed
        description: Resolved valuation variant — valuation_method_override when supplied at creation, otherwise Fund.asset_test_valuation_method as of creation.
        constraints: "APPLICABLE_FINANCIAL_STATEMENT | UNADJUSTED_COST_BASIS"
      - name: qualified_numerator
        type: number
        source: computed
        description: Sum of the valuation-method value over included QUALIFIED assets; 2 dp.
        default: 0.00
      - name: total_denominator
        type: number
        source: computed
        description: Sum of the valuation-method value over all included assets; 2 dp.
        default: 0.00
      - name: ratio_pct
        type: number
        source: computed
        description: qualified_numerator / total_denominator * 100, rounded half-up to 4 dp; 0.0000 when total_denominator == 0.00.
        default: 0.0000
      - name: included_asset_count
        type: integer
        source: computed
        description: Number of FundAsset rows that entered the measurement.
        default: 0
      - name: result
        type: enum
        source: computed
        description: PASS when ratio_pct >= 90.0000, else FAIL; PENDING before measurement.
        default: PENDING
        constraints: "PENDING | PASS | FAIL"
      - name: shortfall_amount
        type: number
        source: computed
        description: max(0.00, round(0.90 * total_denominator - qualified_numerator, 2)); 0.00 when result == PASS.
        default: 0.00
      - name: failed_month_count
        type: integer
        source: computed
        description: Whole months of noncompliance attributed to this test; 0 when result == PASS.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Test lifecycle.
        default: DRAFT
        constraints: "DRAFT | MEASURED | CERTIFIED_PASS | CERTIFIED_FAIL"
      - name: measured_by_user_id
        type: string
        source: computed
        description: X-User-ID of the operator that ran the measurement; null before measurement.
      - name: certified_by_user_id
        type: string
        source: computed
        description: X-User-ID of the ComplianceOfficer that certified the test; null before certification.

  - name: ImprovementProject
    parent: null
    common_fields: true
    fields:
      - name: fund_asset_id
        type: string
        source: input
        description: "FK -> FundAsset.id; the property whose substantial improvement is being measured."
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the 30-month substantial-improvement window.
      - name: window_end
        type: datetime
        source: computed
        description: window_start + 30 calendar months, exclusive upper bound. Closed-interval overlap arithmetic against sibling projects uses [window_start, window_end - 1 day].
      - name: aggregation_method
        type: enum
        source: input
        description: Selects the asset-by-asset variant or the aggregated-group variant of the substantial-improvement ratio.
        constraints: "ASSET_BY_ASSET | AGGREGATED_GROUP"
      - name: group_key
        type: string
        source: input
        description: Self-referential grouping handle linking sibling ImprovementProject rows into one aggregation group; required when aggregation_method == AGGREGATED_GROUP, forbidden otherwise.
        constraints: "1..40 chars when present"
      - name: basis_at_acquisition
        type: number
        source: computed
        description: Snapshot of FundAsset.unadjusted_cost_basis taken when the project was created; the ratio denominator for the ASSET_BY_ASSET variant.
      - name: qualified_additions_total
        type: number
        source: computed
        description: Additions to basis credited to this project under the active aggregation_method; 2 dp.
        default: 0.00
      - name: improvement_ratio_pct
        type: number
        source: computed
        description: qualified_additions_total / denominator * 100, rounded half-up to 4 dp; 0.0000 when the denominator is 0.00.
        default: 0.0000
      - name: status
        type: enum
        source: computed
        description: Improvement lifecycle.
        default: OPEN
        constraints: "OPEN | SATISFIED | LAPSED"
      - name: evaluated_at
        type: datetime
        source: computed
        description: Logical-clock instant of the most recent evaluation; null before the first evaluation.

  - name: WorkingCapitalPlan
    parent: null
    common_fields: true
    fields:
      - name: qoz_business_id
        type: string
        source: input
        description: "FK -> QOZBusiness.id; the business whose working capital this plan shelters."
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the 31-month working-capital safe-harbor window.
      - name: window_end
        type: datetime
        source: computed
        description: window_start + 31 calendar months, exclusive upper bound.
      - name: covered_amount
        type: number
        source: input
        description: Working-capital dollars the written plan shelters from NQFP treatment.
        constraints: "> 0.00, 2 dp"
      - name: written_plan_reference
        type: string
        source: input
        description: Document reference for the written designation and plan required by the safe harbor.
        constraints: "1..80 chars, non-blank"
      - name: schedule_month_count
        type: integer
        source: input
        description: Number of monthly buckets in spend_schedule.
        constraints: "1..31"
      - name: spend_schedule
        type: array
        source: input
        description: "Ordered monthly buckets, each an object { month_index: integer 1..31, planned_amount: number >= 0.00 }; month_index values MUST be 1..schedule_month_count with no gaps or duplicates."
      - name: documentation_complete
        type: boolean
        source: computed
        description: True when written_plan_reference is non-blank, len(spend_schedule) == schedule_month_count, and round(sum(planned_amount), 2) == covered_amount.
        default: false
      - name: spent_total
        type: number
        source: computed
        description: "round(sum(CapitalExpenditure.amount) over expenditures with wcsh_plan_id == this plan's id, expenditure_kind IN {OPERATING_WORKING_CAPITAL, CAPITALIZED_IMPROVEMENT} and window_start <= spend_date < window_end, 2)."
        default: 0.00
      - name: unspent_amount
        type: number
        source: computed
        description: max(0.00, round(covered_amount - spent_total, 2)).
        default: 0.00
      - name: last_checkpoint_month_index
        type: integer
        source: computed
        description: month_index of the most recent evaluate-checkpoint call; 0 before the first checkpoint.
        default: 0
      - name: pacing_shortfall
        type: number
        source: computed
        description: max(0.00, round(required_cumulative - actual_cumulative, 2)) at the most recent checkpoint.
        default: 0.00
      - name: overspill_amount
        type: number
        source: computed
        description: Expenditure dollars that could not be absorbed by any schedule bucket during the waterfall allocation; 2 dp.
        default: 0.00
      - name: status
        type: enum
        source: computed
        description: Plan lifecycle; BLOWN releases the sheltered dollars back into the business's NQFP figure.
        default: DRAFT
        constraints: "DRAFT | ACTIVE | COMPLETED | BLOWN"

  - name: CapitalExpenditure
    parent: null
    common_fields: false
    fields:
      - name: improvement_project_id
        type: string
        source: computed
        description: "FK -> ImprovementProject.id; nullable — set from the path when the expenditure is logged against a substantial-improvement project, null when logged against a working-capital plan."
      - name: wcsh_plan_id
        type: string
        source: computed
        description: "FK -> WorkingCapitalPlan.id; nullable — set from the path when the expenditure is logged against a working-capital safe-harbor plan, null when logged against an improvement project."
      - name: amount
        type: number
        source: input
        description: Dollars spent.
        constraints: "> 0.00, 2 dp"
      - name: expenditure_kind
        type: enum
        source: input
        description: Nature of the spend; only CAPITALIZED_IMPROVEMENT adds to basis.
        constraints: "CAPITALIZED_IMPROVEMENT | OPERATING_WORKING_CAPITAL | LAND_ACQUISITION"
      - name: spend_date
        type: datetime
        source: computed
        description: Logical-clock instant at which the expenditure was recorded.
      - name: counts_toward_basis
        type: boolean
        source: computed
        description: True exactly when expenditure_kind == CAPITALIZED_IMPROVEMENT and spend_date falls inside the container's window.
        default: false
      - name: schedule_month_index
        type: integer
        source: computed
        description: For plan-attached expenditures, the highest spend_schedule month_index this expenditure's dollars reached during waterfall allocation; null for project-attached expenditures.

  - name: PenaltyAssessment
    parent: null
    common_fields: true
    fields:
      - name: fund_id
        type: string
        source: computed
        description: "FK -> Fund.id; copied from the failing AssetTest at assessment time."
      - name: asset_test_id
        type: string
        source: computed
        description: "FK -> AssetTest.id; the certified-failed test that produced this assessment."
      - name: failed_month_count
        type: integer
        source: computed
        description: Snapshot of AssetTest.failed_month_count; the conserved noncompliance-month quantity this assessment contributes to Fund.cumulative_penalty_months.
      - name: shortfall_amount
        type: number
        source: computed
        description: Snapshot of AssetTest.shortfall_amount at assessment time; 2 dp.
      - name: monthly_penalty_amount
        type: number
        source: computed
        description: The per-month penalty figure, rounded half-up to the cent BEFORE summation; 2 dp.
        default: 0.00
      - name: gross_penalty_amount
        type: number
        source: computed
        description: monthly_penalty_amount summed over failed_month_count months; 2 dp.
        default: 0.00
      - name: cure_credit_amount
        type: number
        source: computed
        description: Credit granted when a cure is approved; 0.00 until then; 2 dp.
        default: 0.00
      - name: net_penalty_amount
        type: number
        source: computed
        description: gross_penalty_amount - cure_credit_amount; 2 dp.
        default: 0.00
      - name: cure_attempt_count
        type: integer
        source: computed
        description: Number of cure requests filed against this assessment; capped at 2.
        default: 0
      - name: cure_basis
        type: enum
        source: computed
        description: Basis asserted by the most recent cure request.
        default: NONE
        constraints: "NONE | REASONABLE_CAUSE | TREATED_AS_FAILURE"
      - name: narrative_reference
        type: string
        source: computed
        description: Document reference supplied with the most recent cure request; null before any request.
      - name: status
        type: enum
        source: computed
        description: Assessment lifecycle; cycles ASSESSED -> CURE_REQUESTED -> ASSESSED when a REASONABLE_CAUSE cure is denied, and terminates at UPHELD when a TREATED_AS_FAILURE cure is denied.
        default: ASSESSED
        constraints: "ASSESSED | CURE_REQUESTED | CURED | UPHELD"
      - name: requested_by_user_id
        type: string
        source: computed
        description: X-User-ID of the FundManager that filed the most recent cure request; null before any request.
      - name: decided_by_user_id
        type: string
        source: computed
        description: X-User-ID of the ComplianceOfficer that decided the most recent cure request; null before any decision.

  - name: InclusionEvent
    parent: null
    common_fields: true
    fields:
      - name: deferral_election_id
        type: string
        source: computed
        description: "FK -> DeferralElection.id; set from the path; the election whose deferred gain is being included."
      - name: event_type
        type: enum
        source: input
        description: Category of inclusion event.
        constraints: "SALE_OF_INTEREST | GIFT_TRANSFER | FUND_DECERTIFICATION | PARTIAL_REDEMPTION | DEC_31_2026_STATUTORY"
      - name: included_fraction
        type: number
        source: input
        description: Fraction of the original elected_amount included by this event; 4 dp.
        constraints: "> 0.0000 and <= 1.0000"
      - name: event_date
        type: datetime
        source: computed
        description: Logical-clock instant of the event; drives the holding-tier lookup.
      - name: holding_days
        type: integer
        source: computed
        description: "floor((event_date - DeferralElection.investment_date) / 1 day)."
      - name: holding_tier_applied
        type: enum
        source: computed
        description: Holding tier resolved from holding_days at event time.
        constraints: "UNDER_FIVE | FIVE_YEAR | SEVEN_YEAR | TEN_YEAR"
      - name: gross_inclusion_amount
        type: number
        source: computed
        description: round(DeferralElection.elected_amount * included_fraction, 2).
        default: 0.00
      - name: basis_offset_amount
        type: number
        source: computed
        description: round(DeferralElection.elected_amount * included_fraction * step_pct, 2), where step_pct comes from holding_tier_applied.
        default: 0.00
      - name: net_inclusion_amount
        type: number
        source: computed
        description: round(gross_inclusion_amount - basis_offset_amount, 2).
        default: 0.00
      - name: is_full
        type: boolean
        source: computed
        description: True when the election's included_fraction_total reaches 1.0000 as a result of this event.
        default: false

  - name: StepUpElection
    parent: null
    common_fields: true
    fields:
      - name: deferral_election_id
        type: string
        source: computed
        description: "FK -> DeferralElection.id; set from the path; the qualifying investment whose basis is stepped up."
      - name: claimed_fmv
        type: number
        source: input
        description: Fair market value claimed for the qualifying investment on the election date.
        constraints: "> 0.00, 2 dp"
      - name: disposition_sequence
        type: array
        source: input
        description: "Ordered list of FundAsset ids (strings) declaring the disposition order the fund will follow; position i (1-based) is written to FundAsset.disposition_sequence_index. Every listed asset MUST belong to the election's fund and be status == HELD."
      - name: election_date
        type: datetime
        source: computed
        description: Logical-clock instant at which the step-up election was filed.
      - name: holding_period_days
        type: integer
        source: computed
        description: "floor((election_date - DeferralElection.investment_date) / 1 day)."
      - name: stepped_up_basis
        type: number
        source: computed
        description: claimed_fmv when status == GRANTED, else 0.00.
        default: 0.00
      - name: status
        type: enum
        source: computed
        description: Outcome of the election, decided synchronously at filing time.
        constraints: "GRANTED | DENIED"
      - name: denial_reason
        type: enum
        source: computed
        description: Why the election was denied; NONE when GRANTED.
        default: NONE
        constraints: "NONE | HOLD_UNDER_TEN_YEARS | FUND_DECERTIFIED | PRIOR_FULL_INCLUSION"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  # --- Fund, dimension 1 of 2: certification_status -------------------------
  - entity: Fund
    state_field: certification_status
    initial_state: DRAFT
    terminal_states: [DECERTIFIED]
    note: |
      Fund carries two INDEPENDENT state dimensions. certification_status and
      compliance_posture advance on different triggers and neither one's value
      constrains the other's, except that DECERTIFIED forces
      compliance_posture := FAILED_FINAL as an explicit side effect.
    transitions:
      - from: DRAFT
        to: SELF_CERTIFIED
        trigger: "POST /qof/funds/{id}/self-certify"
        actor: FundManager
        preconditions:
          - "certification_status == DRAFT"
          - "X-User-ID == Fund.manager_user_id"
          - "first_taxable_month_iso8601 input is the first instant of a calendar month (day == 1, time == 00:00:00.000Z)"
        side_effects:
          - "sets certification_status = SELF_CERTIFIED"
          - "sets self_certification_date = logical clock now"
          - "sets first_taxable_month_iso8601 from the request"
          - "leaves compliance_posture untouched at its current value (UNTESTED on a fresh fund)"
          - "increments Fund.version by 1"
      - from: SELF_CERTIFIED
        to: DECERTIFIED
        trigger: "POST /qof/funds/{id}/decertify"
        actor: ComplianceOfficer
        preconditions:
          - "certification_status == SELF_CERTIFIED"
        side_effects:
          - "sets certification_status = DECERTIFIED"
          - "sets compliance_posture = FAILED_FINAL (the only coupling between the two dimensions)"
          - "CASCADE link 1: every DeferralElection with fund_id == this fund and status IN {DEFERRED, STEPPED_UP, INCLUDED_PARTIAL} receives a system InclusionEvent with event_type = FUND_DECERTIFICATION and included_fraction = round(1.0000 - included_fraction_total, 4)"
          - "CASCADE link 2: because those InclusionEvents exist, each such election's included_amount/included_fraction_total/deferred_remaining are recomputed and status becomes INCLUDED_FULL"
          - "CASCADE link 3: because those elections changed, each owning Investor's deferred_gain_outstanding and included_gain_total are recomputed"
          - "increments Fund.version by 1"
      - from: SELF_CERTIFIED
        to: DECERTIFIED
        trigger: "system event: POST /qof/asset-tests/{id}/certify certifies a second consecutive FAIL (Fund.consecutive_failed_tests becomes 2)"
        actor: system
        preconditions:
          - "certification_status == SELF_CERTIFIED"
          - "compliance_posture == DEFICIENT and consecutive_failed_tests == 1 before this certification"
          - "AssetTest.status == MEASURED and AssetTest.result == FAIL"
        side_effects:
          - "sets certification_status = DECERTIFIED and compliance_posture = FAILED_FINAL"
          - "fires the same three-link InclusionEvent cascade as the operator-driven DECERTIFIED transition above"
          - "increments Fund.version by 1"
      - from: DRAFT
        to: DECERTIFIED
        trigger: "POST /qof/funds/{id}/decertify"
        actor: ComplianceOfficer
        preconditions:
          - "certification_status == DRAFT"
        side_effects:
          - "sets certification_status = DECERTIFIED"
          - "sets compliance_posture = FAILED_FINAL"
          - "no InclusionEvent cascade fires, because a DRAFT fund can hold no DeferralElection (see validations priority 9)"
          - "increments Fund.version by 1"

  # --- Fund, dimension 2 of 2: compliance_posture ---------------------------
  - entity: Fund
    state_field: compliance_posture
    initial_state: UNTESTED
    terminal_states: [FAILED_FINAL]
    note: |
      Driven entirely by system events on AssetTest rows and by cascades from
      QOZBusiness disqualification. Never driven directly by a client call.
    transitions:
      - from: UNTESTED
        to: COMPLIANT
        trigger: "system event: POST /qof/asset-tests/{id}/certify certifies a test whose result == PASS"
        actor: system
        preconditions:
          - "AssetTest.status == MEASURED and AssetTest.result == PASS"
        side_effects:
          - "sets compliance_posture = COMPLIANT"
          - "sets consecutive_failed_tests = 0"
          - "increments Fund.version by 1"
      - from: UNTESTED
        to: DEFICIENT
        trigger: "system event: POST /qof/asset-tests/{id}/certify certifies a test whose result == FAIL"
        actor: system
        preconditions:
          - "AssetTest.status == MEASURED and AssetTest.result == FAIL"
          - "Fund.consecutive_failed_tests would become 1 (i.e. is 0 before this certification)"
        side_effects:
          - "CASCADE link 1: sets AssetTest.status = CERTIFIED_FAIL and increments Fund.consecutive_failed_tests to 1"
          - "CASCADE link 2: because that test is now CERTIFIED_FAIL, a PenaltyAssessment row is created with status = ASSESSED, fund_id/asset_test_id/failed_month_count/shortfall_amount snapshotted, and calculations.failed_test_penalty applied; Fund.cumulative_penalty_months increases by PenaltyAssessment.failed_month_count"
          - "CASCADE link 3: because an ASSESSED PenaltyAssessment now exists for this fund, compliance_posture = DEFICIENT"
          - "increments Fund.version by 1"
      - from: COMPLIANT
        to: DEFICIENT
        trigger: "system event: POST /qof/asset-tests/{id}/certify certifies a test whose result == FAIL, OR POST /qof/business-tests/{id}/certify disqualifies a QOZBusiness and the fund's latest MEASURED AssetTest flips to result == FAIL"
        actor: system
        preconditions:
          - "compliance_posture == COMPLIANT"
        side_effects:
          - "same three-link cascade as UNTESTED -> DEFICIENT when the trigger is an AssetTest certification"
          - "when the trigger is the QOZBusiness disqualification cascade, only the re-measured AssetTest fields and compliance_posture change; no PenaltyAssessment is created because no certification occurred"
          - "increments Fund.version by 1"
      - from: DEFICIENT
        to: CURE_PENDING
        trigger: "system event: POST /qof/penalty-assessments/{id}/cure-requests"
        actor: system
        preconditions:
          - "PenaltyAssessment.status == ASSESSED and PenaltyAssessment.fund_id == this fund"
          - "compliance_posture == DEFICIENT"
        side_effects:
          - "sets compliance_posture = CURE_PENDING"
          - "increments Fund.version by 1"
      - from: CURE_PENDING
        to: DEFICIENT
        trigger: "system event: POST /qof/penalty-assessments/{id}/cure-decisions with decision == DENY"
        actor: system
        preconditions:
          - "PenaltyAssessment.status == CURE_REQUESTED"
        side_effects:
          - "sets compliance_posture = DEFICIENT (the fund's posture cycles back, mirroring the assessment's own cycle)"
          - "increments Fund.version by 1"
      - from: CURE_PENDING
        to: COMPLIANT
        trigger: "system event: POST /qof/penalty-assessments/{id}/cure-decisions with decision == APPROVE"
        actor: system
        preconditions:
          - "PenaltyAssessment.status == CURE_REQUESTED"
          - "no other PenaltyAssessment for this fund has status IN {ASSESSED, CURE_REQUESTED, UPHELD} after this decision is applied"
        side_effects:
          - "COMPENSATION: sets PenaltyAssessment.status = CURED and decrements Fund.cumulative_penalty_months by exactly PenaltyAssessment.failed_month_count, restoring the pre-assessment value of the conserved noncompliance-month quantity"
          - "sets compliance_posture = COMPLIANT and consecutive_failed_tests = 0"
          - "increments Fund.version by 1"
      - from: DEFICIENT
        to: FAILED_FINAL
        trigger: "system event: POST /qof/asset-tests/{id}/certify certifies a second consecutive FAIL (Fund.consecutive_failed_tests becomes 2)"
        actor: system
        preconditions:
          - "AssetTest.result == FAIL"
          - "Fund.consecutive_failed_tests == 1 before this certification"
        side_effects:
          - "CASCADE link 1: sets AssetTest.status = CERTIFIED_FAIL and Fund.consecutive_failed_tests = 2"
          - "CASCADE link 2: because that test is CERTIFIED_FAIL, a second PenaltyAssessment (status ASSESSED) is created and Fund.cumulative_penalty_months increases by its failed_month_count"
          - "CASCADE link 3: because consecutive_failed_tests reached 2, compliance_posture = FAILED_FINAL and certification_status = DECERTIFIED"
          - "CASCADE link 4: because certification_status became DECERTIFIED, the DECERTIFIED transition's own InclusionEvent cascade fires for every DeferralElection with status IN {DEFERRED, STEPPED_UP, INCLUDED_PARTIAL}, and each owning Investor's deferred_gain_outstanding / included_gain_total are recomputed"
          - "increments Fund.version by 1"

  # --- EligibleGain: cyclic -------------------------------------------------
  - entity: EligibleGain
    state_field: status
    initial_state: ELIGIBLE
    terminal_states: [EXPIRED]
    note: |
      Cyclic: PARTIALLY_INVESTED -> FULLY_INVESTED -> PARTIALLY_INVESTED ->
      ELIGIBLE are all reachable, because revoking an election returns its
      dollars to unelected_amount.
    transitions:
      - from: ELIGIBLE
        to: PARTIALLY_INVESTED
        trigger: "POST /qof/deferral-elections"
        actor: Investor
        preconditions:
          - "status == ELIGIBLE"
          - "elected_amount < unelected_amount"
        side_effects:
          - "recomputes elected_amount and unelected_amount (unelected_amount decreases by exactly elected_amount)"
          - "recomputes Investor.deferred_gain_outstanding"
          - "increments EligibleGain.version by 1"
      - from: ELIGIBLE
        to: FULLY_INVESTED
        trigger: "POST /qof/deferral-elections"
        actor: Investor
        preconditions:
          - "status == ELIGIBLE"
          - "elected_amount == unelected_amount"
        side_effects:
          - "sets unelected_amount = 0.00"
          - "recomputes Investor.deferred_gain_outstanding"
          - "increments EligibleGain.version by 1"
      - from: PARTIALLY_INVESTED
        to: PARTIALLY_INVESTED
        trigger: "POST /qof/deferral-elections (additional election against the same gain)"
        actor: Investor
        preconditions:
          - "status == PARTIALLY_INVESTED"
          - "elected_amount < unelected_amount"
        side_effects:
          - "self-loop: elected_amount increases and unelected_amount decreases by exactly elected_amount"
          - "increments EligibleGain.version by 1"
      - from: PARTIALLY_INVESTED
        to: FULLY_INVESTED
        trigger: "POST /qof/deferral-elections"
        actor: Investor
        preconditions:
          - "status == PARTIALLY_INVESTED"
          - "elected_amount == unelected_amount"
        side_effects:
          - "sets unelected_amount = 0.00"
          - "increments EligibleGain.version by 1"
      - from: FULLY_INVESTED
        to: PARTIALLY_INVESTED
        trigger: "POST /qof/deferral-elections/{id}/revoke"
        actor: Investor
        preconditions:
          - "status == FULLY_INVESTED"
          - "the revoked election is not the only non-REVOKED election on the gain"
        side_effects:
          - "COMPENSATION: unelected_amount increases by exactly the revoked election's elected_amount, restoring the conserved gain-dollar identity eligible_amount == unelected_amount + sum(non-revoked elected_amount)"
          - "increments EligibleGain.version by 1"
      - from: FULLY_INVESTED
        to: ELIGIBLE
        trigger: "POST /qof/deferral-elections/{id}/revoke"
        actor: Investor
        preconditions:
          - "status == FULLY_INVESTED"
          - "the revoked election is the only non-REVOKED election on the gain"
        side_effects:
          - "COMPENSATION: unelected_amount returns to eligible_amount exactly; elected_amount returns to 0.00"
          - "increments EligibleGain.version by 1"
      - from: PARTIALLY_INVESTED
        to: ELIGIBLE
        trigger: "POST /qof/deferral-elections/{id}/revoke"
        actor: Investor
        preconditions:
          - "status == PARTIALLY_INVESTED"
          - "the revoked election is the only non-REVOKED election on the gain"
        side_effects:
          - "COMPENSATION: unelected_amount returns to eligible_amount exactly"
          - "increments EligibleGain.version by 1"
      - from: ELIGIBLE
        to: EXPIRED
        trigger: "POST /qof/ops-runs/deadline-sweep"
        actor: ComplianceOfficer
        preconditions:
          - "status == ELIGIBLE"
          - "logical clock now > investment_deadline"
        side_effects:
          - "sets status = EXPIRED and expired_at = logical clock now"
          - "increments EligibleGain.version by 1"
      - from: PARTIALLY_INVESTED
        to: EXPIRED
        trigger: "POST /qof/ops-runs/deadline-sweep"
        actor: ComplianceOfficer
        preconditions:
          - "status == PARTIALLY_INVESTED"
          - "logical clock now > investment_deadline"
        side_effects:
          - "sets status = EXPIRED and expired_at = logical clock now; unelected_amount is frozen at its current value and can never be elected again"
          - "increments EligibleGain.version by 1"

  # --- DeferralElection: branching fork-join --------------------------------
  - entity: DeferralElection
    state_field: status
    initial_state: DEFERRED
    terminal_states: [INCLUDED_FULL, REVOKED]
    note: |
      Fork-join: DEFERRED forks into {STEPPED_UP, INCLUDED_PARTIAL} with
      disjoint side-effect sets (the step-up branch rewrites basis and writes
      disposition indices onto FundAsset rows; the inclusion branch moves gain
      dollars into the investor's included_gain_total), and both branches
      converge on INCLUDED_FULL.
    transitions:
      - from: DEFERRED
        to: STEPPED_UP
        trigger: "POST /qof/deferral-elections/{id}/step-up-elections resulting in StepUpElection.status == GRANTED"
        actor: Investor
        preconditions:
          - "status == DEFERRED"
          - "CROSS-ENTITY: Fund(fund_id).certification_status == SELF_CERTIFIED"
          - "StepUpElection.holding_period_days >= 3653"
          - "no InclusionEvent on this election has is_full == true"
        side_effects:
          - "sets status = STEPPED_UP, current_basis = StepUpElection.claimed_fmv, step_up_applied_pct = 1.0000, holding_tier = TEN_YEAR"
          - "writes disposition_sequence_index = i (1-based) onto each FundAsset listed at position i of StepUpElection.disposition_sequence"
          - "increments DeferralElection.version by 1"
      - from: DEFERRED
        to: INCLUDED_PARTIAL
        trigger: "POST /qof/deferral-elections/{id}/inclusion-events with round(included_fraction_total + included_fraction, 4) < 1.0000"
        actor: Investor | ComplianceOfficer
        preconditions:
          - "status == DEFERRED"
          - "round(included_fraction_total + included_fraction, 4) <= 1.0000"
        side_effects:
          - "sets status = INCLUDED_PARTIAL and recomputes included_amount, included_fraction_total, deferred_remaining"
          - "CASCADE: recomputes Investor.deferred_gain_outstanding and Investor.included_gain_total"
          - "increments DeferralElection.version by 1"
      - from: DEFERRED
        to: INCLUDED_FULL
        trigger: "POST /qof/deferral-elections/{id}/inclusion-events with round(included_fraction_total + included_fraction, 4) == 1.0000"
        actor: Investor | ComplianceOfficer
        preconditions:
          - "status == DEFERRED"
        side_effects:
          - "sets status = INCLUDED_FULL, deferred_remaining = 0.00, InclusionEvent.is_full = true"
          - "CASCADE: recomputes Investor.deferred_gain_outstanding and Investor.included_gain_total"
          - "increments DeferralElection.version by 1"
      - from: INCLUDED_PARTIAL
        to: INCLUDED_PARTIAL
        trigger: "POST /qof/deferral-elections/{id}/inclusion-events (another partial event)"
        actor: Investor | ComplianceOfficer
        preconditions:
          - "status == INCLUDED_PARTIAL"
          - "round(included_fraction_total + included_fraction, 4) < 1.0000"
        side_effects:
          - "self-loop: included_amount and included_fraction_total grow; deferred_remaining shrinks"
          - "increments DeferralElection.version by 1"
      - from: INCLUDED_PARTIAL
        to: INCLUDED_FULL
        trigger: "POST /qof/deferral-elections/{id}/inclusion-events closing the remaining fraction"
        actor: Investor | ComplianceOfficer
        preconditions:
          - "status == INCLUDED_PARTIAL"
          - "round(included_fraction_total + included_fraction, 4) == 1.0000"
        side_effects:
          - "join point: sets status = INCLUDED_FULL, deferred_remaining = 0.00, InclusionEvent.is_full = true"
          - "increments DeferralElection.version by 1"
      - from: STEPPED_UP
        to: INCLUDED_FULL
        trigger: "POST /qof/deferral-elections/{id}/inclusion-events with included_fraction == 1.0000"
        actor: Investor | ComplianceOfficer
        preconditions:
          - "status == STEPPED_UP"
        side_effects:
          - "join point from the other branch: sets status = INCLUDED_FULL; because holding_tier == TEN_YEAR the InclusionEvent's basis_offset_amount uses step_pct = 0.15"
          - "increments DeferralElection.version by 1"
      - from: DEFERRED
        to: REVOKED
        trigger: "POST /qof/deferral-elections/{id}/revoke"
        actor: Investor
        preconditions:
          - "status == DEFERRED"
          - "X-User-ID == DeferralElection.investor_id"
          - "no InclusionEvent exists for this election"
        side_effects:
          - "COMPENSATION: sets status = REVOKED, deferred_remaining = 0.00, revoked_reason_code from the request"
          - "CASCADE link 1: EligibleGain.elected_amount decreases and unelected_amount increases by exactly elected_amount"
          - "CASCADE link 2: because the gain's elected_amount changed, EligibleGain.status is re-derived (FULLY_INVESTED -> PARTIALLY_INVESTED or -> ELIGIBLE)"
          - "CASCADE link 3: because the election is no longer counted, Fund.deferred_gain_committed and Investor.deferred_gain_outstanding are recomputed"
          - "increments DeferralElection.version by 1"

  # --- FundAsset ------------------------------------------------------------
  - entity: FundAsset
    state_field: status
    initial_state: HELD
    terminal_states: [DISPOSED]
    transitions:
      - from: HELD
        to: IMPROVING
        trigger: "POST /qof/improvement-projects (project created against this asset)"
        actor: FundManager
        preconditions:
          - "status == HELD"
          - "original_use_in_zone == false (property whose original use began before the fund acquired it is the only property that needs substantial improvement)"
        side_effects:
          - "sets status = IMPROVING and qualification = IMPROVEMENT_PENDING"
          - "CASCADE: Fund.aggregate_qualified_basis and aggregate_qualified_afs_value are recomputed (an IMPROVEMENT_PENDING asset leaves the qualified numerator)"
          - "increments FundAsset.version by 1"
      - from: IMPROVING
        to: HELD
        trigger: "system event: POST /qof/improvement-projects/{id}/evaluate sets the project to SATISFIED"
        actor: system
        preconditions:
          - "ImprovementProject.improvement_ratio_pct >= 100.0000"
        side_effects:
          - "sets status = HELD and qualification = QUALIFIED"
          - "CASCADE: Fund.aggregate_qualified_basis and aggregate_qualified_afs_value are recomputed"
          - "increments FundAsset.version by 1"
      - from: IMPROVING
        to: HELD
        trigger: "system event: POST /qof/improvement-projects/{id}/evaluate sets the project to LAPSED"
        actor: system
        preconditions:
          - "logical clock now >= ImprovementProject.window_end and improvement_ratio_pct < 100.0000"
        side_effects:
          - "sets status = HELD and qualification = NONQUALIFIED"
          - "CASCADE: Fund.aggregate_qualified_basis and aggregate_qualified_afs_value are recomputed"
          - "increments FundAsset.version by 1"
      - from: HELD
        to: DISPOSED
        trigger: "POST /qof/fund-assets/{id}/dispose"
        actor: FundManager
        preconditions:
          - "status == HELD"
          - "X-User-ID == Fund(fund_id).manager_user_id"
          - "when disposition_sequence_index is non-null, every FundAsset of the same fund with a non-null disposition_sequence_index strictly less than this asset's index already has status == DISPOSED"
        side_effects:
          - "sets status = DISPOSED, disposed_at = logical clock now, proceeds_amount from the request"
          - "CASCADE: Fund.aggregate_asset_basis, aggregate_qualified_basis, aggregate_afs_value, aggregate_qualified_afs_value are recomputed, restoring the basis-ledger identity over the remaining HELD/IMPROVING assets"
          - "increments FundAsset.version by 1"

  # --- QOZBusiness ----------------------------------------------------------
  - entity: QOZBusiness
    state_field: qualification_status
    initial_state: UNTESTED
    terminal_states: [DISQUALIFIED]
    transitions:
      - from: UNTESTED
        to: QUALIFIED
        trigger: "system event: POST /qof/business-tests/{id}/certify where all three prongs PASS"
        actor: system
        preconditions:
          - "BusinessTest.status == MEASURED"
          - "gross_income_prong == PASS and intangibles_prong == PASS and nqfp_prong == PASS"
        side_effects:
          - "sets qualification_status = QUALIFIED and consecutive_failed_business_tests = 0"
          - "CASCADE: every FundAsset with qoz_business_id == this business, asset_class == QOZB_EQUITY and status == HELD gets qualification = QUALIFIED; Fund.aggregate_qualified_basis and aggregate_qualified_afs_value are recomputed"
          - "increments QOZBusiness.version by 1"
      - from: UNTESTED
        to: AT_RISK
        trigger: "system event: POST /qof/business-tests/{id}/certify where nqfp_prong == PASS but at least one of gross_income_prong / intangibles_prong == FAIL"
        actor: system
        preconditions:
          - "BusinessTest.status == MEASURED"
          - "nqfp_prong == PASS"
          - "consecutive_failed_business_tests == 0 before this certification"
        side_effects:
          - "sets qualification_status = AT_RISK and consecutive_failed_business_tests = 1"
          - "no FundAsset qualification changes (AT_RISK is a warning posture only)"
          - "increments QOZBusiness.version by 1"
      - from: UNTESTED
        to: DISQUALIFIED
        trigger: "system event: POST /qof/business-tests/{id}/certify where nqfp_prong == FAIL"
        actor: system
        preconditions:
          - "BusinessTest.status == MEASURED"
          - "nqfp_prong == FAIL"
        side_effects:
          - "CASCADE link 1: sets qualification_status = DISQUALIFIED and consecutive_failed_business_tests = 1"
          - "CASCADE link 2: because the business is DISQUALIFIED, every FundAsset with qoz_business_id == this business and status IN {HELD, IMPROVING} gets qualification = NONQUALIFIED, and Fund.aggregate_qualified_basis / aggregate_qualified_afs_value are recomputed"
          - "CASCADE link 3: because the fund's qualified aggregates changed, the fund's AssetTest with status == MEASURED and the greatest (measurement_date, created_at) is re-measured in place — qualified_numerator, total_denominator, ratio_pct, result, shortfall_amount and failed_month_count are all recomputed"
          - "CASCADE link 4: because that re-measured test's result is now FAIL, Fund.compliance_posture = DEFICIENT"
          - "increments QOZBusiness.version by 1"
      - from: AT_RISK
        to: QUALIFIED
        trigger: "system event: POST /qof/business-tests/{id}/certify where all three prongs PASS"
        actor: system
        preconditions:
          - "qualification_status == AT_RISK"
          - "all three prongs PASS"
        side_effects:
          - "sets qualification_status = QUALIFIED and consecutive_failed_business_tests = 0"
          - "increments QOZBusiness.version by 1"
      - from: AT_RISK
        to: DISQUALIFIED
        trigger: "system event: POST /qof/business-tests/{id}/certify where any prong == FAIL and consecutive_failed_business_tests == 1"
        actor: system
        preconditions:
          - "qualification_status == AT_RISK"
          - "at least one prong == FAIL"
        side_effects:
          - "same four-link cascade as UNTESTED -> DISQUALIFIED, with consecutive_failed_business_tests = 2"
          - "increments QOZBusiness.version by 1"
      - from: QUALIFIED
        to: AT_RISK
        trigger: "system event: POST /qof/wcsh-plans/{id}/evaluate-checkpoint sets the plan to BLOWN while the business has no BusinessTest in status MEASURED to re-derive"
        actor: system
        preconditions:
          - "qualification_status == QUALIFIED"
          - "the business has no BusinessTest with status == MEASURED"
        side_effects:
          - "sets qualification_status = AT_RISK because the sheltered working capital re-entered nqfp_amount"
          - "increments QOZBusiness.version by 1"
      - from: QUALIFIED
        to: DISQUALIFIED
        trigger: "system event: POST /qof/wcsh-plans/{id}/evaluate-checkpoint sets the plan to BLOWN"
        actor: system
        preconditions:
          - "qualification_status == QUALIFIED"
          - "the business has a BusinessTest with status == MEASURED whose recomputed nqfp_pct > 5.0000"
        side_effects:
          - "CASCADE link 1: because the plan is BLOWN, wcsh_protected_amount falls and blown_unspent_amount rises, so nqfp_amount is recomputed upward"
          - "CASCADE link 2: because nqfp_amount rose, the latest MEASURED BusinessTest's nqfp_amount_measured, nqfp_pct and nqfp_prong are re-derived; nqfp_prong becomes FAIL and qualification_status = DISQUALIFIED"
          - "CASCADE link 3: because the business is DISQUALIFIED, every FundAsset with qoz_business_id == this business and status IN {HELD, IMPROVING} gets qualification = NONQUALIFIED and Fund.aggregate_qualified_basis / aggregate_qualified_afs_value are recomputed"
          - "increments QOZBusiness.version by 1"

  # --- BusinessTest: fork with divergent side-effect sets -------------------
  - entity: BusinessTest
    state_field: status
    initial_state: DRAFT
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: DRAFT
        to: MEASURED
        trigger: "POST /qof/business-tests/{id}/measure"
        actor: FundManager | ComplianceOfficer
        preconditions:
          - "status == DRAFT"
          - "the safe-harbor input required by safe_harbor_used is present (see validations priority 22)"
        side_effects:
          - "runs calculations.qozb_prong_evaluation and stores gross_income_pct, intangibles_pct, nqfp_pct, nqfp_amount_measured and the three prong enums"
          - "sets measured_by_user_id = X-User-ID"
          - "increments BusinessTest.version by 1"
      - from: MEASURED
        to: PASSED
        trigger: "POST /qof/business-tests/{id}/certify"
        actor: ComplianceOfficer
        preconditions:
          - "status == MEASURED"
          - "X-User-ID != measured_by_user_id (segregation of duties)"
          - "all three prong enums == PASS"
        side_effects:
          - "sets status = PASSED and certified_by_user_id = X-User-ID"
          - "drives the QOZBusiness transition to QUALIFIED, which promotes every QOZB_EQUITY FundAsset to qualification = QUALIFIED"
          - "increments BusinessTest.version by 1"
      - from: MEASURED
        to: FAILED
        trigger: "POST /qof/business-tests/{id}/certify"
        actor: ComplianceOfficer
        preconditions:
          - "status == MEASURED"
          - "X-User-ID != measured_by_user_id (segregation of duties)"
          - "at least one prong enum == FAIL"
        side_effects:
          - "sets status = FAILED and certified_by_user_id = X-User-ID"
          - "divergent branch: drives the QOZBusiness transition to AT_RISK (nqfp_prong == PASS) or the four-link DISQUALIFIED cascade (nqfp_prong == FAIL); the PASSED branch fires neither"
          - "increments BusinessTest.version by 1"

  # --- AssetTest ------------------------------------------------------------
  - entity: AssetTest
    state_field: status
    initial_state: DRAFT
    terminal_states: [CERTIFIED_PASS, CERTIFIED_FAIL]
    transitions:
      - from: DRAFT
        to: MEASURED
        trigger: "POST /qof/asset-tests/{id}/measure"
        actor: FundManager | ComplianceOfficer
        preconditions:
          - "status == DRAFT"
          - "CROSS-ENTITY: Fund(fund_id).certification_status == SELF_CERTIFIED"
        side_effects:
          - "runs calculations.semiannual_asset_test_ratio and stores qualified_numerator, total_denominator, ratio_pct, included_asset_count, result, shortfall_amount, failed_month_count"
          - "sets measured_by_user_id = X-User-ID"
          - "sets Fund.last_test_measurement_date = measurement_date"
          - "increments AssetTest.version by 1"
      - from: MEASURED
        to: CERTIFIED_PASS
        trigger: "POST /qof/asset-tests/{id}/certify"
        actor: ComplianceOfficer
        preconditions:
          - "status == MEASURED"
          - "X-User-ID != measured_by_user_id (segregation of duties)"
          - "result == PASS"
        side_effects:
          - "sets status = CERTIFIED_PASS and certified_by_user_id = X-User-ID"
          - "drives Fund.compliance_posture to COMPLIANT and resets Fund.consecutive_failed_tests to 0"
          - "increments AssetTest.version by 1"
      - from: MEASURED
        to: CERTIFIED_FAIL
        trigger: "POST /qof/asset-tests/{id}/certify"
        actor: ComplianceOfficer
        preconditions:
          - "status == MEASURED"
          - "X-User-ID != measured_by_user_id (segregation of duties)"
          - "result == FAIL"
        side_effects:
          - "sets status = CERTIFIED_FAIL and certified_by_user_id = X-User-ID"
          - "CASCADE link 1: increments Fund.consecutive_failed_tests by 1"
          - "CASCADE link 2: because this test is now CERTIFIED_FAIL, creates a PenaltyAssessment (status ASSESSED) with calculations.failed_test_penalty applied, and increases Fund.cumulative_penalty_months by failed_month_count"
          - "CASCADE link 3: because an ASSESSED PenaltyAssessment now exists, Fund.compliance_posture becomes DEFICIENT, or FAILED_FINAL with certification_status = DECERTIFIED when consecutive_failed_tests reaches 2"
          - "increments AssetTest.version by 1"

  # --- ImprovementProject ---------------------------------------------------
  - entity: ImprovementProject
    state_field: status
    initial_state: OPEN
    terminal_states: [SATISFIED, LAPSED]
    transitions:
      - from: OPEN
        to: SATISFIED
        trigger: "POST /qof/improvement-projects/{id}/evaluate"
        actor: FundManager | ComplianceOfficer
        preconditions:
          - "status == OPEN"
          - "improvement_ratio_pct >= 100.0000 under the project's aggregation_method"
          - "logical clock now < window_end"
          - "CROSS-ENTITY: FundAsset(fund_asset_id).status == IMPROVING"
        side_effects:
          - "sets status = SATISFIED and evaluated_at = logical clock now"
          - "CASCADE: drives the FundAsset IMPROVING -> HELD transition with qualification = QUALIFIED, which recomputes Fund.aggregate_qualified_basis and aggregate_qualified_afs_value"
          - "for aggregation_method == AGGREGATED_GROUP, every sibling ImprovementProject with the same group_key and status == OPEN is also set to SATISFIED and its own FundAsset is promoted the same way"
          - "increments ImprovementProject.version by 1"
      - from: OPEN
        to: LAPSED
        trigger: "POST /qof/improvement-projects/{id}/evaluate"
        actor: FundManager | ComplianceOfficer
        preconditions:
          - "status == OPEN"
          - "logical clock now >= window_end"
          - "improvement_ratio_pct < 100.0000"
        side_effects:
          - "sets status = LAPSED and evaluated_at = logical clock now"
          - "CASCADE: drives the FundAsset IMPROVING -> HELD transition with qualification = NONQUALIFIED, which recomputes Fund.aggregate_qualified_basis and aggregate_qualified_afs_value"
          - "increments ImprovementProject.version by 1"
      - from: OPEN
        to: LAPSED
        trigger: "POST /qof/ops-runs/deadline-sweep"
        actor: ComplianceOfficer
        preconditions:
          - "status == OPEN"
          - "logical clock now >= window_end"
          - "improvement_ratio_pct < 100.0000"
        side_effects:
          - "identical to the evaluate-driven LAPSED transition; the sweep applies it to every matching project"
          - "increments ImprovementProject.version by 1"

  # --- WorkingCapitalPlan ---------------------------------------------------
  - entity: WorkingCapitalPlan
    state_field: status
    initial_state: DRAFT
    terminal_states: [COMPLETED, BLOWN]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /qof/wcsh-plans/{id}/activate"
        actor: FundManager
        preconditions:
          - "status == DRAFT"
          - "documentation_complete == true"
          - "logical clock now < window_end"
        side_effects:
          - "sets status = ACTIVE"
          - "CASCADE: QOZBusiness.wcsh_protected_amount rises by (covered_amount - spent_total), so QOZBusiness.nqfp_amount is recomputed downward"
          - "increments WorkingCapitalPlan.version by 1"
      - from: ACTIVE
        to: BLOWN
        trigger: "POST /qof/wcsh-plans/{id}/evaluate-checkpoint"
        actor: FundManager | ComplianceOfficer
        preconditions:
          - "status == ACTIVE"
          - "calculations.wcsh_pacing_compliance yields pacing_shortfall > round(required_cumulative * 0.10, 2)"
        side_effects:
          - "sets status = BLOWN"
          - "CASCADE link 1: QOZBusiness.wcsh_protected_amount falls to exclude this plan and blown_unspent_amount rises by unspent_amount, so nqfp_amount is recomputed upward"
          - "CASCADE link 2: because nqfp_amount rose, the latest MEASURED BusinessTest's nqfp_amount_measured / nqfp_pct / nqfp_prong are re-derived and QOZBusiness.qualification_status moves to DISQUALIFIED (nqfp_pct > 5.0000) or AT_RISK (no MEASURED test exists)"
          - "CASCADE link 3: because the business is DISQUALIFIED, every FundAsset with qoz_business_id == this business and status IN {HELD, IMPROVING} gets qualification = NONQUALIFIED and Fund.aggregate_qualified_basis / aggregate_qualified_afs_value are recomputed"
          - "increments WorkingCapitalPlan.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /qof/wcsh-plans/{id}/evaluate-checkpoint with checkpoint_month_index >= schedule_month_count"
        actor: FundManager | ComplianceOfficer
        preconditions:
          - "status == ACTIVE"
          - "checkpoint_month_index >= schedule_month_count"
          - "pacing_shortfall == 0.00"
        side_effects:
          - "sets status = COMPLETED"
          - "CASCADE: QOZBusiness.wcsh_protected_amount falls to exclude this plan; blown_unspent_amount is NOT increased, so nqfp_amount rises only by the plan's unspent_amount if any remained (it is 0.00 whenever pacing_shortfall == 0.00 and the schedule is fully funded)"
          - "increments WorkingCapitalPlan.version by 1"
      - from: ACTIVE
        to: BLOWN
        trigger: "POST /qof/ops-runs/deadline-sweep"
        actor: ComplianceOfficer
        preconditions:
          - "status == ACTIVE"
          - "logical clock now >= window_end"
          - "unspent_amount > 0.00"
        side_effects:
          - "identical cascade to the checkpoint-driven BLOWN transition; the sweep applies it to every ACTIVE plan whose 31-month window has closed with unspent dollars"
          - "increments WorkingCapitalPlan.version by 1"

  # --- PenaltyAssessment: cyclic -------------------------------------------
  - entity: PenaltyAssessment
    state_field: status
    initial_state: ASSESSED
    terminal_states: [CURED, UPHELD]
    note: |
      Cyclic: ASSESSED -> CURE_REQUESTED -> ASSESSED whenever a REASONABLE_CAUSE
      cure is denied, so a second request may be filed. A denial of a
      TREATED_AS_FAILURE basis is terminal (UPHELD) because the manager has
      conceded the failure. Requests are capped at cure_attempt_count < 2, so a
      third filing after two denied REASONABLE_CAUSE attempts raises
      ERR_CURE_ATTEMPTS_EXHAUSTED while the row is still ASSESSED.
    transitions:
      - from: ASSESSED
        to: CURE_REQUESTED
        trigger: "POST /qof/penalty-assessments/{id}/cure-requests"
        actor: FundManager
        preconditions:
          - "status == ASSESSED"
          - "cure_attempt_count < 2"
          - "X-User-ID == Fund(fund_id).manager_user_id"
        side_effects:
          - "sets status = CURE_REQUESTED, cure_attempt_count += 1, cure_basis and narrative_reference from the request, requested_by_user_id = X-User-ID"
          - "CASCADE: Fund.compliance_posture moves DEFICIENT -> CURE_PENDING"
          - "increments PenaltyAssessment.version by 1"
      - from: CURE_REQUESTED
        to: ASSESSED
        trigger: "POST /qof/penalty-assessments/{id}/cure-decisions with decision == DENY and cure_basis == REASONABLE_CAUSE"
        actor: ComplianceOfficer
        preconditions:
          - "status == CURE_REQUESTED"
          - "cure_basis == REASONABLE_CAUSE"
        side_effects:
          - "cycle back: sets status = ASSESSED and decided_by_user_id = X-User-ID; cure_credit_amount stays 0.00 and Fund.cumulative_penalty_months is unchanged"
          - "CASCADE: Fund.compliance_posture moves CURE_PENDING -> DEFICIENT"
          - "increments PenaltyAssessment.version by 1"
      - from: CURE_REQUESTED
        to: UPHELD
        trigger: "POST /qof/penalty-assessments/{id}/cure-decisions with decision == DENY and cure_basis == TREATED_AS_FAILURE"
        actor: ComplianceOfficer
        preconditions:
          - "status == CURE_REQUESTED"
          - "cure_basis == TREATED_AS_FAILURE"
        side_effects:
          - "sets status = UPHELD and decided_by_user_id = X-User-ID; net_penalty_amount stays equal to gross_penalty_amount"
          - "CASCADE: Fund.compliance_posture moves CURE_PENDING -> DEFICIENT; Fund.cumulative_penalty_months is unchanged because UPHELD still counts"
          - "increments PenaltyAssessment.version by 1"
      - from: CURE_REQUESTED
        to: CURED
        trigger: "POST /qof/penalty-assessments/{id}/cure-decisions with decision == APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "status == CURE_REQUESTED"
          - "cure_basis == REASONABLE_CAUSE (a TREATED_AS_FAILURE basis can only be denied)"
        side_effects:
          - "COMPENSATION: sets status = CURED, applies calculations.penalty_cure_credit_netting to set cure_credit_amount and net_penalty_amount, sets decided_by_user_id = X-User-ID"
          - "COMPENSATION: decrements Fund.cumulative_penalty_months by exactly failed_month_count, returning the conserved noncompliance-month quantity to its pre-assessment value"
          - "CASCADE: Fund.compliance_posture moves CURE_PENDING -> COMPLIANT and consecutive_failed_tests resets to 0"
          - "increments PenaltyAssessment.version by 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's `version` — the only mechanism)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: deferral-election-create-stale-fund
    parent_entity: Fund
    write_endpoint: "POST /qof/deferral-elections"
    occ_field: "expected_fund_version"
    description: |
      Creating a DeferralElection against a Fund whose version has advanced
      since the client last read it is rejected. Two elections against the same
      SELF_CERTIFIED fund are both legitimate under §1.2 (any number of
      investors may invest), so the second create cannot be rejected by any
      state precondition: the client's view of the fund's committed-capital
      ledger (deferred_gain_committed) is simply stale, and the fund's version
      is the only observable that reveals it.
    error_id: ERR_STALE_FUND_VERSION
    http_status: 412

  - rule_id: improvement-expenditure-stale-project
    parent_entity: ImprovementProject
    write_endpoint: "POST /qof/improvement-projects/{id}/expenditures"
    occ_field: "expected_project_version"
    description: |
      Recording a CapitalExpenditure against an ImprovementProject whose
      version has advanced since the client last read it is rejected. A second
      expenditure on an OPEN project is always legitimate, so no state
      precondition catches the writer whose view of qualified_additions_total
      and improvement_ratio_pct predates another expenditure.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:

  - name: eligible_gain_investment_deadline
    trigger: "POST /qof/eligible-gains (stamps window_basis_date + investment_deadline); re-read on every POST /qof/deferral-elections to compute days_from_basis"
    algorithm: temporal_window
    formula: |
      # Step 1 — resolve the window start. This is the ONLY place the two
      # variants diverge, and they diverge on identical realization data.
      if deadline_basis == SALE_DATE:
          window_basis_date = realization_date
      else:                                  # PARTNERSHIP_YEAR_END or SECTION_1231_YEAR_END
          window_basis_date = pass_through_year_end

      # Step 2 — 180 calendar days, added as whole days to the UTC instant.
      investment_deadline = window_basis_date + 180 days

      # Step 3 — timeliness of an election, evaluated at election-create time.
      days_from_basis = floor(
          (election.investment_date - gain.window_basis_date) / 1 day )
      timely  <=>  0 <= days_from_basis <= 180
      # BOUNDARY: days_from_basis == 180 is timely; 181 raises
      # ERR_180_DAY_WINDOW_CLOSED. A negative days_from_basis (election dated
      # before the window start) raises ERR_180_DAY_WINDOW_NOT_OPEN.
    input_set: "One EligibleGain row. No aggregation; no other entity participates."
    constants:
      DEFERRAL_WINDOW_DAYS: 180
    precision: "whole days; instants compared at millisecond resolution in UTC"
    variants:
      - name: sale_date_window
        when: "deadline_basis == SALE_DATE"
        difference: "Window starts at realization_date. For realization_date 2026-03-15T00:00:00.000Z the deadline is 2026-09-11T00:00:00.000Z."
      - name: pass_through_year_end_window
        when: "deadline_basis IN {PARTNERSHIP_YEAR_END, SECTION_1231_YEAR_END}"
        difference: "Window starts at pass_through_year_end, which is later than realization_date for the same underlying sale. For realization_date 2026-03-15 with pass_through_year_end 2026-12-31T00:00:00.000Z the deadline is 2027-06-29T00:00:00.000Z — 292 days later than the sale_date_window variant on identical gain data."

  - name: semiannual_asset_test_ratio
    trigger: "POST /qof/asset-tests/{id}/measure; re-run in place by the QOZBusiness DISQUALIFIED cascade (link 3) on the fund's latest MEASURED test"
    algorithm: aggregation
    formula: |
      # --- inclusion set (explicit status filter + half-open period) --------
      included = [ a for a in FundAsset
                   if a.fund_id == test.fund_id
                   and a.status IN {HELD, IMPROVING}
                   and a.acquisition_date <  test.period_end        # half-open upper bound
                   and (a.disposed_at IS NULL or a.disposed_at >= test.period_end) ]
      included_asset_count = len(included)

      # --- valuation variant selection --------------------------------------
      def value(a):
          if test.valuation_method == UNADJUSTED_COST_BASIS: return a.unadjusted_cost_basis
          else:                                             return a.afs_fair_value

      total_denominator   = round_half_up(sum(value(a) for a in included), 2)
      qualified_numerator = round_half_up(
          sum(value(a) for a in included if a.qualification == QUALIFIED), 2)

      # --- ratio, with the empty-set / zero-denominator edge pinned ---------
      if total_denominator == 0.00:
          ratio_pct = 0.0000
      else:
          ratio_pct = round_half_up(qualified_numerator / total_denominator * 100, 4)

      # --- threshold, evaluated on the ROUNDED 4-dp ratio (pinned) ----------
      result = PASS if ratio_pct >= 90.0000 else FAIL

      shortfall_amount = 0.00 if result == PASS else round_half_up(
          0.90 * total_denominator - qualified_numerator, 2)

      # --- months of noncompliance attributed to a failed period ------------
      if result == PASS:
          failed_month_count = 0
      else:
          failed_month_count = (measurement_date.year - period_start.year) * 12 \
                             + (measurement_date.month - period_start.month) \
                             + (1 if measurement_date.day >= period_start.day else 0)
    input_set: "FundAsset rows of one fund with status IN {HELD, IMPROVING}, acquisition_date strictly before period_end, and either never disposed or disposed on/after period_end. DISPOSED-before-period_end assets are excluded from BOTH numerator and denominator."
    constants:
      QUALIFIED_ASSET_MIN_PCT: 90.0000
      SHORTFALL_TARGET_RATIO: 0.90
    precision: "money 2 dp round_half_up; percentages 4 dp round_half_up; threshold comparison uses the rounded 4-dp ratio_pct"
    variants:
      - name: cost_basis_valuation
        when: "test.valuation_method == UNADJUSTED_COST_BASIS (fund default)"
        difference: "Uses FundAsset.unadjusted_cost_basis. With a QUALIFIED asset at cost 850000.00 and a NONQUALIFIED asset at cost 150000.00 the ratio is 85.0000 -> FAIL with shortfall_amount 50000.00."
      - name: afs_valuation
        when: "test.valuation_method == APPLICABLE_FINANCIAL_STATEMENT"
        difference: "Uses FundAsset.afs_fair_value. On the SAME two assets carried at 950000.00 and 50000.00 the ratio is 95.0000 -> PASS with shortfall_amount 0.00. Identical asset rows, opposite compliance outcome."

  - name: qozb_prong_evaluation
    trigger: "POST /qof/business-tests/{id}/measure; the nqfp prong is re-derived in place by the WorkingCapitalPlan ACTIVE -> BLOWN cascade (link 2)"
    algorithm: threshold
    formula: |
      # ---- prong 1: 50-percent gross income, four mutually exclusive branches
      if safe_harbor_used == FIFTY_PCT_HOURS:
          gross_income_pct = round_half_up(hours_zone_pct, 4)
      elif safe_harbor_used == FIFTY_PCT_AMOUNTS_PAID:
          gross_income_pct = round_half_up(amounts_paid_zone_pct, 4)
      elif safe_harbor_used == GROSS_INCOME_ACTUAL:
          gross_income_pct = 0.0000 if gross_income_total_amount == 0.00 else \
              round_half_up(gross_income_zone_amount / gross_income_total_amount * 100, 4)
      else:   # MANAGEMENT_AND_TANGIBLE — non-linear composite of THREE inputs
          mgmt_component = 0.0000 if intangibles_total_amount == 0.00 else \
              round_half_up(intangibles_zone_use_amount / intangibles_total_amount * 100, 4)
          tangible_component = round_half_up(
              (total_asset_value_measured - nqfp_amount_measured)
              / total_asset_value_measured * 100, 4)
          gross_income_pct = min(100.0000, round_half_up(
              min(mgmt_component, tangible_component) * MGMT_SAFE_HARBOR_CREDIT, 4))

      # ---- prong 2: 40-percent intangibles
      intangibles_pct = 0.0000 if intangibles_total_amount == 0.00 else \
          round_half_up(intangibles_zone_use_amount / intangibles_total_amount * 100, 4)

      # ---- prong 3: 5-percent nonqualified financial property
      # nqfp_amount_measured snapshots QOZBusiness.nqfp_amount, which already
      # nets ACTIVE plan shelter out and adds BLOWN plan unspent dollars back:
      #   nqfp_amount = max(0.00, round(declared_nqfp_amount
      #                                 + blown_unspent_amount
      #                                 - wcsh_protected_amount, 2))
      nqfp_amount_measured = QOZBusiness.nqfp_amount
      nqfp_pct = round_half_up(nqfp_amount_measured / total_asset_value_measured * 100, 4)

      # ---- prong enums
      gross_income_prong = PASS if gross_income_pct   >= 50.0000 else FAIL
      intangibles_prong  = PASS if intangibles_pct    >= 40.0000 else FAIL
      nqfp_prong         = PASS if nqfp_pct           <= 5.0000  else FAIL
    input_set: "One BusinessTest row plus the live QOZBusiness.nqfp_amount, which aggregates WorkingCapitalPlan rows for that business filtered to status == ACTIVE (shelter) and status == BLOWN (release)."
    constants:
      GROSS_INCOME_MIN_PCT: 50.0000
      INTANGIBLES_MIN_PCT: 40.0000
      NQFP_MAX_PCT: 5.0000
      MGMT_SAFE_HARBOR_CREDIT: 1.25
    precision: "percentages 4 dp round_half_up; money 2 dp round_half_up; each prong compares the rounded 4-dp percentage"

  - name: substantial_improvement_ratio
    trigger: "POST /qof/improvement-projects/{id}/expenditures (recomputes qualified_additions_total and improvement_ratio_pct) and POST /qof/improvement-projects/{id}/evaluate (decides SATISFIED vs LAPSED)"
    algorithm: aggregation
    formula: |
      window_end = window_start + 30 calendar months          # exclusive

      def additions(p):
          return round_half_up(sum(e.amount for e in CapitalExpenditure
                  if e.improvement_project_id == p.id
                  and e.expenditure_kind == CAPITALIZED_IMPROVEMENT
                  and p.window_start <= e.spend_date < p.window_end), 2)

      if aggregation_method == ASSET_BY_ASSET:
          qualified_additions_total = additions(this)
          denominator               = this.basis_at_acquisition
      else:                                    # AGGREGATED_GROUP
          group = [ p for p in ImprovementProject
                    if p.group_key == this.group_key
                    and p.aggregation_method == AGGREGATED_GROUP
                    and p.status IN {OPEN, SATISFIED} ]
          # deterministic order: group members are processed by
          # (window_start ASC, created_at ASC); the sum is order-independent
          # but the order is pinned so partial-failure reporting is stable.
          qualified_additions_total = round_half_up(sum(additions(p) for p in group), 2)
          denominator               = round_half_up(sum(p.basis_at_acquisition for p in group), 2)

      improvement_ratio_pct = 0.0000 if denominator == 0.00 else round_half_up(
          qualified_additions_total / denominator * 100, 4)

      # decided only by POST .../evaluate or the deadline sweep
      if improvement_ratio_pct >= 100.0000 and clock_now <  window_end: status = SATISFIED
      elif                                     clock_now >= window_end: status = LAPSED
      else:                                                             status = OPEN
    input_set: "CapitalExpenditure rows with expenditure_kind == CAPITALIZED_IMPROVEMENT whose spend_date lies in the owning project's own half-open 30-month window. For AGGREGATED_GROUP, sibling projects with the same group_key and status IN {OPEN, SATISFIED} contribute both their additions and their basis_at_acquisition; LAPSED siblings are excluded from both sides."
    constants:
      SI_WINDOW_MONTHS: 30
      SI_REQUIRED_PCT: 100.0000
    precision: "money 2 dp round_half_up; ratio 4 dp round_half_up"
    variants:
      - name: asset_by_asset
        when: "aggregation_method == ASSET_BY_ASSET"
        difference: "Each project stands alone. Project A (basis 500000.00, additions 600000.00) reaches 120.0000 -> SATISFIED; project B (basis 500000.00, additions 450000.00) reaches 90.0000 -> LAPSED once its window closes."
      - name: aggregated_group
        when: "aggregation_method == AGGREGATED_GROUP with a shared group_key"
        difference: "The same two projects pooled under one group_key produce 1050000.00 / 1000000.00 = 105.0000 for BOTH, so project B is SATISFIED instead of LAPSED. Identical expenditure rows, opposite outcome for B."

  - name: wcsh_pacing_compliance
    trigger: "POST /qof/wcsh-plans/{id}/evaluate-checkpoint; spent_total / unspent_amount are also refreshed by POST /qof/wcsh-plans/{id}/expenditures"
    algorithm: waterfall_allocation
    formula: |
      window_end = window_start + 31 calendar months            # exclusive

      # --- chronological input set, order pinned -----------------------------
      spends = [ e for e in CapitalExpenditure
                 if e.wcsh_plan_id == plan.id
                 and e.expenditure_kind IN {OPERATING_WORKING_CAPITAL, CAPITALIZED_IMPROVEMENT}
                 and plan.window_start <= e.spend_date < plan.window_end ]
      spends.sort(key = (spend_date ASC, created_at ASC))   # tie-break on created_at, never id

      # --- waterfall: fill the earliest unfilled bucket first ---------------
      buckets = plan.spend_schedule sorted by month_index ASC   # month_index 1..schedule_month_count
      filled  = { b.month_index: 0.00 for b in buckets }
      overspill_amount = 0.00
      for e in spends:
          remaining = e.amount
          reached = null
          for b in buckets:
              room = round_half_up(b.planned_amount - filled[b.month_index], 2)
              take = min(remaining, room)
              if take > 0.00:
                  filled[b.month_index] = round_half_up(filled[b.month_index] + take, 2)
                  remaining = round_half_up(remaining - take, 2)
                  reached = b.month_index
              if remaining == 0.00: break
          e.schedule_month_index = reached
          overspill_amount = round_half_up(overspill_amount + remaining, 2)

      m = checkpoint_month_index                                # request input
      required_cumulative = round_half_up(
          sum(b.planned_amount for b in buckets if b.month_index <= m), 2)
      actual_cumulative   = round_half_up(
          sum(filled[b.month_index] for b in buckets if b.month_index <= m), 2)

      pacing_shortfall = max(0.00, round_half_up(required_cumulative - actual_cumulative, 2))
      tolerance        = round_half_up(required_cumulative * WCSH_PACING_TOLERANCE_PCT / 100, 2)

      spent_total    = round_half_up(sum(e.amount for e in spends), 2)
      unspent_amount = max(0.00, round_half_up(plan.covered_amount - spent_total, 2))
      last_checkpoint_month_index = m

      # --- threshold, strict > so an exactly-at-tolerance plan survives ------
      if pacing_shortfall > tolerance:                           status = BLOWN
      elif m >= plan.schedule_month_count and pacing_shortfall == 0.00: status = COMPLETED
      else:                                                     status = ACTIVE
    input_set: "CapitalExpenditure rows attached to this plan (wcsh_plan_id == plan.id) with expenditure_kind IN {OPERATING_WORKING_CAPITAL, CAPITALIZED_IMPROVEMENT} and spend_date inside the half-open 31-month window. LAND_ACQUISITION spends and out-of-window spends are excluded from spent_total and from the waterfall."
    constants:
      WCSH_WINDOW_MONTHS: 31
      WCSH_PACING_TOLERANCE_PCT: 10.0
    precision: "money 2 dp round_half_up; the BLOWN comparison is strictly greater-than against tolerance"

  - name: failed_test_penalty
    trigger: "system event inside POST /qof/asset-tests/{id}/certify when result == FAIL — creates the PenaltyAssessment and fills monthly_penalty_amount, gross_penalty_amount, net_penalty_amount"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: round the per-month figure to the cent FIRST,
      # then sum over the failed months. The rejected order — summing the
      # unrounded monthly figures and rounding once at the end — differs by
      # cents and is explicitly NOT the contract.
      monthly_penalty_amount = round_half_up(
          shortfall_amount * UNDERPAYMENT_ANNUAL_RATE / 12, 2)          # per-month rounding FIRST

      gross_penalty_amount = round_half_up(
          sum(monthly_penalty_amount for i in 1..failed_month_count), 2)  # THEN sum

      # Worked example, shortfall_amount = 50000.00, failed_month_count = 6:
      #   monthly = round_half_up(50000.00 * 0.08 / 12, 2) = round_half_up(333.3333.., 2) = 333.33
      #   gross   = 333.33 * 6                                            = 1999.98
      # Rejected order: round_half_up(50000.00 * 0.08 / 12 * 6, 2)        = 2000.00
      net_penalty_amount = round_half_up(gross_penalty_amount - cure_credit_amount, 2)
      # cure_credit_amount is 0.00 at assessment time.
    input_set: "One AssetTest row with status transitioning to CERTIFIED_FAIL; its shortfall_amount and failed_month_count are snapshotted onto the new PenaltyAssessment."
    constants:
      UNDERPAYMENT_ANNUAL_RATE: 0.08
    precision: "money 2 dp round_half_up, applied per month before summation"

  - name: penalty_cure_credit_netting
    trigger: "POST /qof/penalty-assessments/{id}/cure-decisions with decision == APPROVE"
    algorithm: threshold
    formula: |
      # The definition LOOKS circular: the credit cap is chosen from a tier of
      # the penalty, and the penalty net of the credit is what the fund owes.
      # The evaluation order below is PINNED so the value is well-defined.
      # step 1: gross is already stored by calculations.failed_test_penalty
      gross = assessment.gross_penalty_amount
      # step 2: the tier basis is GROSS, never the net figure
      tier_basis = gross
      # step 3: tier selection
      cap_pct = CURE_CREDIT_HIGH_CAP_PCT if tier_basis >= CURE_CREDIT_TIER_BREAK \
                else CURE_CREDIT_LOW_CAP_PCT
      # step 4: credit, floored then capped by gross
      cure_credit_amount = round_half_up(
          min(gross, max(CURE_CREDIT_FLOOR, round_half_up(cap_pct * tier_basis, 2))), 2)
      # step 5: net
      net_penalty_amount = round_half_up(gross - cure_credit_amount, 2)
      # step 6: NO second pass. cap_pct is never re-derived from
      # net_penalty_amount even though net_penalty_amount may fall below
      # CURE_CREDIT_TIER_BREAK as a result of step 4.
      #
      # Worked example, gross = 1999.98:
      #   tier_basis 1999.98 >= 1000.00 -> cap_pct 0.60
      #   0.60 * 1999.98 = 1199.988 -> round_half_up -> 1199.99
      #   max(250.00, 1199.99) = 1199.99 ; min(1999.98, 1199.99) = 1199.99
      #   net = 1999.98 - 1199.99 = 799.99
      # Re-deriving the tier from net (799.99 < 1000.00 -> 0.40) would give
      # credit 800.00 and net 1199.98 — the wrong answer.
    input_set: "One PenaltyAssessment row in status CURE_REQUESTED with cure_basis == REASONABLE_CAUSE."
    constants:
      CURE_CREDIT_TIER_BREAK: 1000.00
      CURE_CREDIT_HIGH_CAP_PCT: 0.60
      CURE_CREDIT_LOW_CAP_PCT: 0.40
      CURE_CREDIT_FLOOR: 250.00
    precision: "money 2 dp round_half_up at every step named above"

  - name: inclusion_event_amount
    trigger: "POST /qof/deferral-elections/{id}/inclusion-events, and the system InclusionEvents created by the Fund DECERTIFIED cascade"
    algorithm: tiered_pricing
    formula: |
      holding_days = floor((event_date - election.investment_date) / 1 day)

      if   holding_days >= TEN_YEAR_DAYS:   holding_tier_applied = TEN_YEAR
      elif holding_days >= SEVEN_YEAR_DAYS: holding_tier_applied = SEVEN_YEAR
      elif holding_days >= FIVE_YEAR_DAYS:  holding_tier_applied = FIVE_YEAR
      else:                                 holding_tier_applied = UNDER_FIVE

      step_pct = 0.15 if holding_tier_applied IN {SEVEN_YEAR, TEN_YEAR} else \
                 0.10 if holding_tier_applied == FIVE_YEAR else 0.00

      gross_inclusion_amount = round_half_up(
          election.elected_amount * included_fraction, 2)
      basis_offset_amount    = round_half_up(
          election.elected_amount * included_fraction * step_pct, 2)
      net_inclusion_amount   = round_half_up(
          gross_inclusion_amount - basis_offset_amount, 2)

      is_full = (round_half_up(election.included_fraction_total + included_fraction, 4) == 1.0000)
      # BOUNDARY: holding_days == 1826 is FIVE_YEAR (>=), 1825 is UNDER_FIVE.
    input_set: "One DeferralElection row plus the InclusionEvent request body. included_fraction_total already reflects every prior InclusionEvent on that election."
    constants:
      FIVE_YEAR_DAYS: 1826
      SEVEN_YEAR_DAYS: 2557
      TEN_YEAR_DAYS: 3653
      STEP_UP_FIVE_PCT: 0.10
      STEP_UP_SEVEN_PCT: 0.15
    precision: "money 2 dp round_half_up; fractions 4 dp round_half_up"

  - name: ten_year_step_up_grant
    trigger: "POST /qof/deferral-elections/{id}/step-up-elections"
    algorithm: threshold
    formula: |
      holding_period_days = floor((election_date - election.investment_date) / 1 day)

      if   holding_period_days < TEN_YEAR_DAYS:
              status = DENIED ; denial_reason = HOLD_UNDER_TEN_YEARS
      elif Fund(election.fund_id).certification_status == DECERTIFIED:
              status = DENIED ; denial_reason = FUND_DECERTIFIED
      elif any InclusionEvent on this election has is_full == true:
              status = DENIED ; denial_reason = PRIOR_FULL_INCLUSION
      else:
              status = GRANTED ; denial_reason = NONE

      stepped_up_basis = claimed_fmv if status == GRANTED else 0.00

      # Disposition sequencing (only on GRANTED): the request's ordered list is
      # authoritative. Position i (1-based) of disposition_sequence is written
      # to FundAsset.disposition_sequence_index. No server-side ranking, no
      # tie-break, and never any dependence on FundAsset.id ordering.
      for i, asset_id in enumerate(disposition_sequence, start=1):
          FundAsset(asset_id).disposition_sequence_index = i
      # BOUNDARY: holding_period_days == 3653 grants; 3652 denies with
      # HOLD_UNDER_TEN_YEARS.
    input_set: "One DeferralElection row, its Fund, and every InclusionEvent with deferral_election_id == that election."
    constants:
      TEN_YEAR_DAYS: 3653
    precision: "whole days; money 2 dp"

  - name: eligible_gain_conservation_invariant
    trigger: "asserted after every POST /qof/deferral-elections and every POST /qof/deferral-elections/{id}/revoke"
    algorithm: constraint_propagation
    formula: |
      # CONSERVED QUANTITY #1 — dollars of eligible gain on one EligibleGain row.
      INVARIANT:
        gain.eligible_amount == round_half_up(
            gain.unelected_amount
            + sum(e.elected_amount for e in DeferralElection
                  if e.eligible_gain_id == gain.id and e.status != REVOKED), 2)

      forward action      POST /qof/deferral-elections
                          -> unelected_amount -= elected_amount
                          -> elected_amount   += elected_amount
      compensating action POST /qof/deferral-elections/{id}/revoke
                          -> unelected_amount += elected_amount   (exactly)
                          -> elected_amount   -= elected_amount
      After the pair, gain.unelected_amount is bit-identical to its pre-forward
      value and gain.status has cycled back to the state it held before.
    input_set: "One EligibleGain row and every DeferralElection with that eligible_gain_id, partitioned by status != REVOKED."
    constants: {}
    precision: "money 2 dp round_half_up"

  - name: noncompliance_month_conservation_invariant
    trigger: "asserted after every POST /qof/asset-tests/{id}/certify and every POST /qof/penalty-assessments/{id}/cure-decisions"
    algorithm: constraint_propagation
    formula: |
      # CONSERVED QUANTITY #2 — whole months of noncompliance on one Fund.
      # This is an integer month count, not a money amount.
      INVARIANT:
        fund.cumulative_penalty_months ==
            sum(p.failed_month_count for p in PenaltyAssessment
                if p.fund_id == fund.id
                and p.status IN {ASSESSED, CURE_REQUESTED, UPHELD})

      forward action      POST /qof/asset-tests/{id}/certify with result == FAIL
                          -> creates PenaltyAssessment(status ASSESSED)
                          -> fund.cumulative_penalty_months += failed_month_count
      compensating action POST /qof/penalty-assessments/{id}/cure-decisions
                          with decision == APPROVE
                          -> assessment.status = CURED
                          -> fund.cumulative_penalty_months -= failed_month_count
      A denied cure is NOT a compensating action: the assessment cycles back to
      ASSESSED (or terminates at UPHELD) and the month count stays put.
    input_set: "One Fund row and every PenaltyAssessment with that fund_id, filtered to status IN {ASSESSED, CURE_REQUESTED, UPHELD}."
    constants: {}
    precision: "integer months, exact"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the FIRST rule that fails determines the response error_id)
# ---------------------------------------------------------------------------
validations:

  - priority: 1
    category: auth
    check: "Both X-User-Role and X-User-ID request headers are present and non-blank."
    error_id: ERR_MISSING_AUTH_HEADER
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is exactly one of FundManager, ComplianceOfficer, Investor, PlatformAdmin."
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "The role in X-User-Role appears in the target endpoint's roles list in §1.5."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: business_constraint
    check: "Request body / query schema: every required input field present, no unknown fields, types correct, enum members legal, numbers within their declared constraints (eligible_amount > 0, included_fraction in (0.0000, 1.0000], zone_tract_code exactly 11 chars, spend_schedule month_index values 1..schedule_month_count with no gaps or duplicates, first_taxable_month_iso8601 at a month boundary)."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 5
    category: business_constraint
    check: "Pagination: limit is an integer in 1..100 and offset is an integer >= 0."
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "GET /qof/funds, GET /qof/eligible-gains, GET /qof/deferral-elections, GET /qof/qoz-businesses, GET /qof/fund-assets, GET /qof/improvement-projects, GET /qof/wcsh-plans, GET /qof/penalty-assessments, GET /qof/funds/{id}/asset-tests, GET /qof/qoz-businesses/{id}/business-tests, GET /qof/deferral-elections/{id}/inclusion-events, GET /qof/deferral-elections/{id}/step-up-elections, GET /qof/improvement-projects/{id}/expenditures, GET /qof/wcsh-plans/{id}/expenditures"

  - priority: 6
    category: existence
    check: "Every id in the URL path exists, validated left to right. Emits the not-found error of the entity that owns the path segment (ERR_FUND_NOT_FOUND, ERR_INVESTOR_NOT_FOUND, ERR_ELIGIBLE_GAIN_NOT_FOUND, ERR_DEFERRAL_ELECTION_NOT_FOUND, ERR_FUND_ASSET_NOT_FOUND, ERR_QOZ_BUSINESS_NOT_FOUND, ERR_BUSINESS_TEST_NOT_FOUND, ERR_ASSET_TEST_NOT_FOUND, ERR_IMPROVEMENT_PROJECT_NOT_FOUND, ERR_WCSH_PLAN_NOT_FOUND, ERR_PENALTY_ASSESSMENT_NOT_FOUND)."
    error_id: ERR_FUND_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 7
    category: business_referential
    check: "Every foreign key supplied in a request body references an existing row: eligible_gain_id, fund_id, investor_id, qoz_business_id, fund_asset_id, and every element of StepUpElection.disposition_sequence."
    error_id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http_status: 404
    applies_to: "POST /qof/eligible-gains, POST /qof/deferral-elections, POST /qof/fund-assets, POST /qof/qoz-businesses, POST /qof/wcsh-plans, POST /qof/improvement-projects, POST /qof/deferral-elections/{id}/step-up-elections"

  - priority: 8
    category: auth
    check: "Ownership scope. For X-User-Role == Investor, X-User-ID must equal the Investor.id that owns the target resource (EligibleGain.investor_id, DeferralElection.investor_id, or the {id} of GET /qof/investors/{id} and GET /qof/investors/{id}/statement)."
    error_id: ERR_INVESTOR_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /qof/eligible-gains, GET /qof/eligible-gains/{id}, POST /qof/deferral-elections, POST /qof/deferral-elections/{id}/revoke, POST /qof/deferral-elections/{id}/inclusion-events, POST /qof/deferral-elections/{id}/step-up-elections, GET /qof/investors/{id}, GET /qof/investors/{id}/statement"

  - priority: 9
    category: auth
    check: "Fund ownership. For X-User-Role == FundManager on any endpoint that mutates a fund-owned resource, X-User-ID must equal Fund.manager_user_id of the owning fund."
    error_id: ERR_FUND_MANAGER_MISMATCH
    http_status: 403
    applies_to: "POST /qof/funds/{id}/self-certify, POST /qof/fund-assets, POST /qof/fund-assets/{id}/dispose, POST /qof/funds/{id}/asset-tests, POST /qof/qoz-businesses, POST /qof/improvement-projects, POST /qof/improvement-projects/{id}/expenditures, POST /qof/wcsh-plans, POST /qof/wcsh-plans/{id}/activate, POST /qof/wcsh-plans/{id}/expenditures, POST /qof/penalty-assessments/{id}/cure-requests"

  - priority: 10
    category: auth
    check: "Segregation of duties. On a certify call, X-User-ID must differ from the target test's measured_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /qof/asset-tests/{id}/certify, POST /qof/business-tests/{id}/certify"

  - priority: 11
    category: state
    check: "Fund certification gate. The owning Fund's certification_status must be SELF_CERTIFIED."
    error_id: ERR_FUND_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /qof/deferral-elections, POST /qof/asset-tests/{id}/measure, POST /qof/qoz-businesses, POST /qof/fund-assets"

  - priority: 12
    category: state
    check: "Fund decertification lockout. The owning Fund's certification_status must not be DECERTIFIED."
    error_id: ERR_FUND_DECERTIFIED
    http_status: 409
    applies_to: "POST /qof/deferral-elections, POST /qof/funds/{id}/self-certify, POST /qof/funds/{id}/decertify, POST /qof/funds/{id}/asset-tests, POST /qof/fund-assets"

  - priority: 13
    category: state
    check: "The target resource is in a NON-TERMINAL state from which the requested transition is declared in §1.2 (EligibleGain ELIGIBLE/PARTIALLY_INVESTED/FULLY_INVESTED, DeferralElection DEFERRED/STEPPED_UP/INCLUDED_PARTIAL, BusinessTest/AssetTest in the required DRAFT or MEASURED state, ImprovementProject OPEN, WorkingCapitalPlan in DRAFT for activate and ACTIVE for checkpoint/expenditure, PenaltyAssessment in ASSESSED for a request and CURE_REQUESTED for a decision, FundAsset HELD for dispose). SCOPE CARVE-OUT: this rule NEVER fires when the target is already in a terminal state for its machine — that case belongs exclusively to priority 14 (ERR_ALREADY_TERMINAL), even though 13 is evaluated first. Priority 13 therefore covers only non-terminal states from which the requested transition is undeclared (measure on a MEASURED test, checkpoint on a DRAFT plan, cure-decision on an ASSESSED assessment, and so on)."
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all POST action endpoints"

  - priority: 14
    category: state
    check: "The target resource is already in a terminal state for its machine (EligibleGain EXPIRED, DeferralElection INCLUDED_FULL or REVOKED, BusinessTest PASSED/FAILED, AssetTest CERTIFIED_PASS/CERTIFIED_FAIL, ImprovementProject SATISFIED/LAPSED, WorkingCapitalPlan COMPLETED/BLOWN, PenaltyAssessment CURED/UPHELD, FundAsset DISPOSED, Fund DECERTIFIED). CARVE-OUT: POST /qof/deferral-elections/{id}/step-up-elections is exempt from this rule. A step-up filing against an INCLUDED_FULL election is accepted and recorded as a DENIED StepUpElection (denial_reason FUND_DECERTIFIED or PRIOR_FULL_INCLUSION per calculations.ten_year_step_up_grant), because the investor is entitled to a written denial on file rather than a rejected request."
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all POST action endpoints except POST /qof/deferral-elections/{id}/step-up-elections"

  - priority: 15
    category: state
    check: "Optimistic concurrency. The expected_<parent>_version supplied in the body equals the parent's current version (see §1.2.1)."
    error_id: ERR_STALE_FUND_VERSION
    http_status: 412
    applies_to: "POST /qof/deferral-elections (expected_fund_version -> ERR_STALE_FUND_VERSION), POST /qof/improvement-projects/{id}/expenditures (expected_project_version -> ERR_STALE_PROJECT_VERSION)"

  - priority: 16
    category: business_safety
    check: "Investor compliance gate. Investor.compliance_attestation_status must be ATTESTED."
    error_id: ERR_INVESTOR_NOT_ATTESTED
    http_status: 422
    applies_to: "POST /qof/deferral-elections, POST /qof/deferral-elections/{id}/step-up-elections"

  - priority: 17
    category: business_safety
    check: "Gain character gate. EligibleGain.gain_character must not be ORDINARY, and deadline_basis == SECTION_1231_YEAR_END is legal only when gain_character == SECTION_1231_NET."
    error_id: ERR_GAIN_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /qof/eligible-gains, POST /qof/deferral-elections"

  - priority: 18
    category: business_safety
    check: "Related-party bar. A FundAsset with acquired_from_related_party == true may never be created with asset_class == QOZ_BUSINESS_PROPERTY."
    error_id: ERR_RELATED_PARTY_ACQUISITION
    http_status: 422
    applies_to: "POST /qof/fund-assets"

  - priority: 19
    category: business_temporal
    check: "180-day window closed. days_from_basis (see calculations.eligible_gain_investment_deadline) must be <= 180."
    error_id: ERR_180_DAY_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /qof/deferral-elections"

  - priority: 20
    category: business_temporal
    check: "180-day window not yet open. days_from_basis must be >= 0; an election dated before the gain's window_basis_date is rejected."
    error_id: ERR_180_DAY_WINDOW_NOT_OPEN
    http_status: 422
    applies_to: "POST /qof/deferral-elections"

  - priority: 21
    category: business_temporal
    check: "AssetTest testing-period overlap, HALF-OPEN interval arithmetic on the Fund resource. A new test's [period_start, period_end) must not intersect the [period_start, period_end) of any existing AssetTest for the same fund whose status != DRAFT_DISCARDED. Adjacency is LEGAL: a new period whose period_start equals an existing period's period_end is accepted, because back-to-back semiannual periods share that instant. period_start must also be strictly before period_end."
    error_id: ERR_TESTING_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /qof/funds/{id}/asset-tests"

  - priority: 22
    category: business_temporal
    check: "ImprovementProject window overlap, CLOSED interval arithmetic on the FundAsset resource. A new project's closed window [window_start, window_end - 1 day] must not intersect the closed window of any existing project on the same fund_asset_id with status IN {OPEN, SATISFIED}. Adjacency is REJECTED here: because both endpoints are inclusive, a new window whose window_start equals an existing window's window_end - 1 day collides. This is deliberately different geometry from the half-open AssetTest rule at priority 21."
    error_id: ERR_IMPROVEMENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /qof/improvement-projects"

  - priority: 23
    category: business_temporal
    check: "Expenditure inside the container window. For a project-attached expenditure, window_start <= logical clock now < window_end of the ImprovementProject."
    error_id: ERR_EXPENDITURE_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /qof/improvement-projects/{id}/expenditures"

  - priority: 24
    category: business_temporal
    check: "WCSH window still open. For a plan-attached expenditure and for plan activation, window_start <= logical clock now < window_end of the WorkingCapitalPlan."
    error_id: ERR_WCSH_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /qof/wcsh-plans/{id}/expenditures, POST /qof/wcsh-plans/{id}/activate"

  - priority: 25
    category: business_constraint
    check: "WCSH documentation completeness. On activate, documentation_complete must be true (written_plan_reference non-blank, len(spend_schedule) == schedule_month_count, and round(sum(planned_amount), 2) == covered_amount)."
    error_id: ERR_WCSH_PLAN_INCOMPLETE
    http_status: 422
    applies_to: "POST /qof/wcsh-plans/{id}/activate"

  - priority: 26
    category: business_constraint
    check: "WCSH schedule arithmetic. At creation, round(sum(spend_schedule[].planned_amount), 2) must equal covered_amount exactly."
    error_id: ERR_WCSH_SCHEDULE_MISMATCH
    http_status: 422
    applies_to: "POST /qof/wcsh-plans"

  - priority: 27
    category: business_constraint
    check: "Checkpoint index bound. checkpoint_month_index must be an integer in 1..schedule_month_count and >= last_checkpoint_month_index."
    error_id: ERR_CHECKPOINT_INDEX_INVALID
    http_status: 422
    applies_to: "POST /qof/wcsh-plans/{id}/evaluate-checkpoint"

  - priority: 28
    category: business_constraint
    check: "Safe-harbor input completeness. safe_harbor_used == FIFTY_PCT_HOURS requires hours_zone_pct; FIFTY_PCT_AMOUNTS_PAID requires amounts_paid_zone_pct; MANAGEMENT_AND_TANGIBLE and GROSS_INCOME_ACTUAL require neither and reject both."
    error_id: ERR_SAFE_HARBOR_INPUT_MISSING
    http_status: 422
    applies_to: "POST /qof/business-tests/{id}/measure"

  - priority: 29
    category: business_referential
    check: "QOZB linkage. asset_class == QOZB_EQUITY requires a qoz_business_id whose QOZBusiness.fund_id equals the asset's fund_id; every other asset_class must omit qoz_business_id."
    error_id: ERR_QOZB_LINK_REQUIRED
    http_status: 422
    applies_to: "POST /qof/fund-assets"

  - priority: 30
    category: business_referential
    check: "Aggregation grouping. aggregation_method == AGGREGATED_GROUP requires a non-blank group_key; ASSET_BY_ASSET must omit it. Every project sharing a group_key must belong to FundAsset rows of the same fund_id."
    error_id: ERR_AGGREGATION_GROUP_INVALID
    http_status: 422
    applies_to: "POST /qof/improvement-projects"

  - priority: 31
    category: business_constraint
    check: "Ten-year hold. holding_period_days must be >= 3653 for a step-up election to be GRANTED; a shorter hold is NOT rejected — it is recorded as a DENIED StepUpElection with denial_reason HOLD_UNDER_TEN_YEARS. This priority slot only rejects a filing the hold cannot even be evaluated for: an election whose investment_date lies strictly after the logical clock."
    error_id: ERR_TEN_YEAR_HOLD_NOT_MET
    http_status: 422
    applies_to: "POST /qof/deferral-elections/{id}/step-up-elections"

  - priority: 32
    category: business_referential
    check: "Disposition sequence integrity. Every FundAsset id in disposition_sequence must belong to the election's fund, have status == HELD, appear at most once, and the list must be non-empty when supplied."
    error_id: ERR_DISPOSITION_SEQUENCE_INVALID
    http_status: 422
    applies_to: "POST /qof/deferral-elections/{id}/step-up-elections"

  - priority: 33
    category: business_constraint
    check: "Revoked election. A step-up election may not be filed against a DeferralElection in status REVOKED: a revoked election has no qualifying investment left to step up. (An INCLUDED_FULL election IS filable — see the carve-out at priority 14 — and comes back as a DENIED StepUpElection.)"
    error_id: ERR_ELECTION_REVOKED
    http_status: 409
    applies_to: "POST /qof/deferral-elections/{id}/step-up-elections"

  - priority: 34
    category: business_constraint
    check: "Disposition ordering. A FundAsset with a non-null disposition_sequence_index may only be disposed after every asset of the same fund with a strictly smaller non-null index already has status == DISPOSED."
    error_id: ERR_DISPOSITION_ORDER_VIOLATION
    http_status: 409
    applies_to: "POST /qof/fund-assets/{id}/dispose"

  - priority: 35
    category: business_fiscal
    check: "Election amount ceiling. elected_amount must be <= EligibleGain.unelected_amount."
    error_id: ERR_ELECTED_AMOUNT_EXCEEDS_GAIN
    http_status: 422
    applies_to: "POST /qof/deferral-elections"

  - priority: 36
    category: business_fiscal
    check: "WCSH aggregate capacity, AGGREGATE-CAPACITY interval arithmetic on the QOZBusiness resource. Overlapping plans are permitted, but for every month covered by the new plan's window, the sum of covered_amount over plans with the same qoz_business_id, status IN {DRAFT, ACTIVE} and a window covering that month, plus the new plan's covered_amount, must be <= round(QOZBusiness.total_asset_value * 0.31, 2). This is neither pairwise-half-open (priority 21) nor pairwise-closed (priority 22): a single overlapping pair may be legal while a third overlapping plan breaches the aggregate."
    error_id: ERR_WCSH_AGGREGATE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /qof/wcsh-plans"

  - priority: 37
    category: business_fiscal
    check: "Inclusion fraction ceiling. round(included_fraction_total + included_fraction, 4) must be <= 1.0000."
    error_id: ERR_INCLUSION_FRACTION_EXCEEDS_REMAINING
    http_status: 422
    applies_to: "POST /qof/deferral-elections/{id}/inclusion-events"

  - priority: 38
    category: business_fiscal
    check: "Cure attempts. cure_attempt_count must be < 2 when a new cure request is filed."
    error_id: ERR_CURE_ATTEMPTS_EXHAUSTED
    http_status: 409
    applies_to: "POST /qof/penalty-assessments/{id}/cure-requests"

  - priority: 39
    category: business_fiscal
    check: "Cure basis. decision == APPROVE requires cure_basis == REASONABLE_CAUSE; a TREATED_AS_FAILURE basis can only be DENYed."
    error_id: ERR_CURE_BASIS_NOT_APPROVABLE
    http_status: 422
    applies_to: "POST /qof/penalty-assessments/{id}/cure-decisions"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
#
# Every endpoint sits under the /qof prefix. All requests carry the
# X-User-Role and X-User-ID headers (see §1.7). Two endpoints live in the
# `/qof/_<name>` test-driving namespace (the logical clock); everything else is
# a plausible business/operator surface.
# ---------------------------------------------------------------------------
endpoints:

  # --- logical clock (test-driving namespace) -------------------------------
  - method: POST
    path: "/qof/_clock/set_current_utc"
    description: |
      Sets the server's logical clock, which every computed instant in this
      domain reads (DeferralElection.investment_date, CapitalExpenditure.spend_date,
      InclusionEvent.event_date, StepUpElection.election_date, FundAsset.disposed_at,
      EligibleGain.expired_at, ImprovementProject.evaluated_at).
      MANDATORY DEFAULT: before any call to this endpoint the logical clock reads
      exactly 2026-08-01T00:00:00Z. The server MUST NOT fall back to real
      wall-clock time at any point.
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime, previous_utc: datetime }"
    side_effects:
      - "no entity is mutated; subsequent writes stamp their computed instants from the new value"

  - method: GET
    path: "/qof/_clock"
    description: "Reads the logical clock. Returns 2026-08-01T00:00:00Z until the first set_current_utc call."
    roles: [PlatformAdmin, FundManager, ComplianceOfficer, Investor]
    code: 200
    input: []
    output: "{ current_utc: datetime }"
    side_effects: []

  # --- ops run --------------------------------------------------------------
  - method: POST
    path: "/qof/ops-runs/deadline-sweep"
    description: |
      Operator batch pass evaluated against the logical clock: expires every
      EligibleGain whose investment_deadline has passed with unelected dollars
      remaining, LAPSEs every ImprovementProject whose 30-month window has
      closed below 100.0000 percent, and BLOWs every ACTIVE WorkingCapitalPlan
      whose 31-month window has closed with unspent_amount > 0.00.
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "{ expired_gain_count: integer, lapsed_project_count: integer, blown_plan_count: integer, swept_at: datetime }"
    side_effects:
      - "EligibleGain ELIGIBLE|PARTIALLY_INVESTED -> EXPIRED with expired_at stamped"
      - "ImprovementProject OPEN -> LAPSED; the owning FundAsset returns to qualification = NONQUALIFIED and status = HELD"
      - "WorkingCapitalPlan ACTIVE -> BLOWN, which releases unspent_amount back into QOZBusiness.nqfp_amount (see §1.2 WorkingCapitalPlan cascade)"

  # --- Investor -------------------------------------------------------------
  - method: POST
    path: "/qof/investors"
    description: "Registers a taxpayer that may realize eligible gains and make deferral elections."
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, taxpayer_type, "tax_year_end_month?", "compliance_attestation_status?"]
    output: Investor
    side_effects:
      - "creates Investor with eligible_gain_total / deferred_gain_outstanding / included_gain_total at 0.00"

  - method: GET
    path: "/qof/investors/{id}"
    description: "Reads one investor, including the three rollup totals."
    roles: [PlatformAdmin, ComplianceOfficer, Investor]
    code: 200
    input: []
    output: Investor
    side_effects: []

  - method: GET
    path: "/qof/investors"
    description: "Paginated investor list, optionally filtered by attestation posture."
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "compliance_attestation_status?"]
    output: Investor[]
    side_effects: []

  - method: PATCH
    path: "/qof/investors/{id}/attestation"
    description: "Moves an investor between PENDING, ATTESTED and BLOCKED after KYC/anti-abuse review."
    roles: [PlatformAdmin]
    code: 200
    input: [compliance_attestation_status]
    output: Investor
    side_effects:
      - "sets Investor.compliance_attestation_status"
      - "increments Investor.version by 1"

  - method: GET
    path: "/qof/investors/{id}/statement"
    description: "Computed investor report: the three gain rollups plus election and inclusion-event counts."
    roles: [Investor, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: "{ investor_id: string, eligible_gain_total: number, deferred_gain_outstanding: number, included_gain_total: number, election_count: integer, inclusion_event_count: integer }"
    side_effects: []

  - method: GET
    path: "/qof/investors/{id}/eligible-gains"
    description: "Reverse lookup for EligibleGain.investor_id."
    roles: [Investor, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: EligibleGain[]
    side_effects: []

  - method: GET
    path: "/qof/investors/{id}/deferral-elections"
    description: "Reverse lookup for DeferralElection.investor_id."
    roles: [Investor, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: DeferralElection[]
    side_effects: []

  # --- Fund -----------------------------------------------------------------
  - method: POST
    path: "/qof/funds"
    description: "Creates a fund in certification_status DRAFT and compliance_posture UNTESTED."
    roles: [PlatformAdmin, FundManager]
    code: 201
    input: [name, entity_type, manager_user_id, "asset_test_valuation_method?"]
    output: Fund
    side_effects:
      - "creates Fund with every aggregate at 0.00 / 0 and both state dimensions at their initial values"

  - method: GET
    path: "/qof/funds/{id}"
    description: "Reads one fund, including both state dimensions, every asset-test aggregate and the current version for optimistic concurrency."
    roles: [FundManager, ComplianceOfficer, PlatformAdmin, Investor]
    code: 200
    input: []
    output: Fund
    side_effects: []

  - method: GET
    path: "/qof/funds"
    description: "Paginated fund list, filterable on either independent state dimension or on the owning manager."
    roles: [FundManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "certification_status?", "compliance_posture?", "manager_user_id?"]
    output: Fund[]
    side_effects: []

  - method: POST
    path: "/qof/funds/{id}/self-certify"
    description: "Fund self-certification as a QOF, stamping the first taxable month it elects to be treated as one."
    roles: [FundManager]
    code: 200
    input: [first_taxable_month_iso8601]
    output: Fund
    side_effects:
      - "certification_status DRAFT -> SELF_CERTIFIED"
      - "sets self_certification_date = logical clock now and first_taxable_month_iso8601 from the request"
      - "leaves compliance_posture unchanged"
      - "increments Fund.version by 1"

  - method: POST
    path: "/qof/funds/{id}/decertify"
    description: "Compliance decertification of a fund; forces the compliance dimension to FAILED_FINAL and fully includes every outstanding deferral."
    roles: [ComplianceOfficer]
    code: 200
    input: ["reason_note?"]
    output: Fund
    side_effects:
      - "certification_status -> DECERTIFIED and compliance_posture -> FAILED_FINAL"
      - "creates a FUND_DECERTIFICATION InclusionEvent on every DeferralElection of the fund in status DEFERRED|STEPPED_UP|INCLUDED_PARTIAL"
      - "those elections become INCLUDED_FULL and their owning Investors' rollups are recomputed"
      - "increments Fund.version by 1"

  - method: POST
    path: "/qof/funds/{id}/asset-tests"
    description: "Opens a semiannual 90-percent asset test for a half-open testing period, optionally overriding the fund's default valuation variant."
    roles: [FundManager, ComplianceOfficer]
    code: 201
    input: [measurement_date, period_start, period_end, "valuation_method_override?"]
    output: AssetTest
    side_effects:
      - "creates AssetTest in status DRAFT, result PENDING, with valuation_method resolved from valuation_method_override or Fund.asset_test_valuation_method"

  - method: GET
    path: "/qof/funds/{id}/asset-tests"
    description: "Reverse lookup for AssetTest.fund_id."
    roles: [FundManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: AssetTest[]
    side_effects: []

  # --- EligibleGain ---------------------------------------------------------
  - method: POST
    path: "/qof/eligible-gains"
    description: "Intakes a realized gain and resolves its 180-day window basis and investment deadline from deadline_basis."
    roles: [Investor, PlatformAdmin]
    code: 201
    input: [investor_id, gain_character, eligible_amount, realization_date, deadline_basis, "pass_through_year_end?"]
    output: EligibleGain
    side_effects:
      - "computes window_basis_date and investment_deadline (calculations.eligible_gain_investment_deadline)"
      - "sets status = ELIGIBLE, elected_amount = 0.00, unelected_amount = eligible_amount"
      - "recomputes Investor.eligible_gain_total"

  - method: GET
    path: "/qof/eligible-gains/{id}"
    description: "Reads one eligible gain, including the conserved elected/unelected split."
    roles: [Investor, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: EligibleGain
    side_effects: []

  - method: GET
    path: "/qof/eligible-gains"
    description: "Paginated gain list; reverse lookup for EligibleGain.investor_id."
    roles: [Investor, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "investor_id?", "status?", "deadline_basis?"]
    output: EligibleGain[]
    side_effects: []

  - method: GET
    path: "/qof/eligible-gains/{id}/deferral-elections"
    description: "Reverse lookup for DeferralElection.eligible_gain_id."
    roles: [Investor, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: DeferralElection[]
    side_effects: []

  # --- DeferralElection -----------------------------------------------------
  - method: POST
    path: "/qof/deferral-elections"
    description: |
      Elects to defer gain dollars into a self-certified QOF. Verifies the
      180-day window against the gain's window_basis_date and guards the fund
      aggregate with optimistic concurrency on Fund.version (§1.2.1).
    roles: [Investor, PlatformAdmin]
    code: 201
    input: [eligible_gain_id, fund_id, elected_amount, expected_fund_version]
    output: DeferralElection
    side_effects:
      - "stamps investment_date = logical clock now and days_from_basis"
      - "copies investor_id from EligibleGain.investor_id; sets initial_basis = current_basis = 0.00"
      - "recomputes EligibleGain.elected_amount / unelected_amount / status (ELIGIBLE -> PARTIALLY_INVESTED -> FULLY_INVESTED)"
      - "recomputes Fund.deferred_gain_committed and Investor.deferred_gain_outstanding"
      - "increments Fund.version by 1"

  - method: GET
    path: "/qof/deferral-elections/{id}"
    description: "Reads one deferral election, including basis, holding tier and the inclusion rollups."
    roles: [Investor, FundManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: DeferralElection
    side_effects: []

  - method: GET
    path: "/qof/deferral-elections"
    description: "Paginated election list; reverse lookup for DeferralElection.fund_id, DeferralElection.investor_id and DeferralElection.eligible_gain_id."
    roles: [Investor, FundManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "fund_id?", "investor_id?", "eligible_gain_id?", "status?"]
    output: DeferralElection[]
    side_effects: []

  - method: POST
    path: "/qof/deferral-elections/{id}/revoke"
    description: "Revokes an election, returning its dollars to the gain's unelected remainder (compensating action for the gain-conservation invariant)."
    roles: [Investor, PlatformAdmin]
    code: 200
    input: [revoked_reason_code]
    output: DeferralElection
    side_effects:
      - "status -> REVOKED, deferred_remaining -> 0.00, revoked_reason_code set"
      - "recomputes EligibleGain.elected_amount / unelected_amount and walks its status back down (FULLY_INVESTED -> PARTIALLY_INVESTED -> ELIGIBLE)"
      - "recomputes Fund.deferred_gain_committed and Investor.deferred_gain_outstanding"

  - method: POST
    path: "/qof/deferral-elections/{id}/inclusion-events"
    description: "Records an inclusion event against the election and applies the holding-tier basis step (calculations.inclusion_event_amount)."
    roles: [Investor, FundManager, PlatformAdmin]
    code: 201
    input: [event_type, included_fraction]
    output: InclusionEvent
    side_effects:
      - "stamps event_date = logical clock now, holding_days, holding_tier_applied"
      - "computes gross_inclusion_amount, basis_offset_amount, net_inclusion_amount, is_full"
      - "recomputes the election's included_amount / included_fraction_total / deferred_remaining and status (INCLUDED_PARTIAL or INCLUDED_FULL)"
      - "recomputes Investor.deferred_gain_outstanding and Investor.included_gain_total"

  - method: GET
    path: "/qof/deferral-elections/{id}/inclusion-events"
    description: "Reverse lookup for InclusionEvent.deferral_election_id; the only discovery channel for the system events created by the fund-decertification cascade."
    roles: [Investor, FundManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "event_type?"]
    output: InclusionEvent[]
    side_effects: []

  - method: POST
    path: "/qof/deferral-elections/{id}/step-up-elections"
    description: "Files the ten-year-hold basis step-up election and pins the asset disposition order the fund will follow."
    roles: [Investor, PlatformAdmin]
    code: 201
    input: [claimed_fmv, "disposition_sequence?"]
    output: StepUpElection
    side_effects:
      - "stamps election_date = logical clock now and holding_period_days; decides GRANTED vs DENIED synchronously (calculations.ten_year_step_up_grant)"
      - "on GRANTED: sets stepped_up_basis = claimed_fmv, the election's current_basis = claimed_fmv, step_up_applied_pct = 1.0000 and status = STEPPED_UP"
      - "on GRANTED with a disposition_sequence: writes FundAsset.disposition_sequence_index 1..N in list order"

  - method: GET
    path: "/qof/deferral-elections/{id}/step-up-elections"
    description: "Reverse lookup for StepUpElection.deferral_election_id."
    roles: [Investor, FundManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: StepUpElection[]
    side_effects: []

  # --- FundAsset ------------------------------------------------------------
  - method: POST
    path: "/qof/fund-assets"
    description: "Records an asset held by the fund and derives its initial qualification for the 90-percent numerator."
    roles: [FundManager, PlatformAdmin]
    code: 201
    input: [fund_id, asset_class, acquisition_date, unadjusted_cost_basis, afs_fair_value, "qoz_business_id?", "acquired_from_related_party?", "original_use_in_zone?"]
    output: FundAsset
    side_effects:
      - "sets status = HELD and adjusted_basis = unadjusted_cost_basis"
      - "derives qualification: QUALIFIED for QOZ_BUSINESS_PROPERTY with original_use_in_zone == true; IMPROVEMENT_PENDING for QOZ_BUSINESS_PROPERTY with original_use_in_zone == false; QOZB_EQUITY tracks QOZBusiness.qualification_status; NONQUALIFIED_FINANCIAL_PROPERTY and CASH are always NONQUALIFIED"
      - "recomputes Fund.aggregate_asset_basis / aggregate_qualified_basis / aggregate_afs_value / aggregate_qualified_afs_value"

  - method: GET
    path: "/qof/fund-assets/{id}"
    description: "Reads one asset, including qualification, adjusted_basis and any pinned disposition_sequence_index."
    roles: [FundManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: FundAsset
    side_effects: []

  - method: GET
    path: "/qof/fund-assets"
    description: "Paginated asset list; reverse lookup for FundAsset.fund_id and FundAsset.qoz_business_id."
    roles: [FundManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "fund_id?", "qoz_business_id?", "status?", "qualification?"]
    output: FundAsset[]
    side_effects: []

  - method: POST
    path: "/qof/fund-assets/{id}/dispose"
    description: "Disposes an asset, enforcing the pinned disposition sequence from the granted step-up election."
    roles: [FundManager, PlatformAdmin]
    code: 200
    input: [proceeds_amount]
    output: FundAsset
    side_effects:
      - "status HELD|IMPROVING -> DISPOSED, disposed_at stamped, proceeds_amount recorded"
      - "removes the asset from every Fund aggregate (the four aggregate_* fields are recomputed)"
      - "leaves already-CERTIFIED asset tests untouched; only DRAFT/MEASURED tests see the change on their next measurement"

  # --- QOZBusiness ----------------------------------------------------------
  - method: POST
    path: "/qof/qoz-businesses"
    description: "Registers an operating business the fund holds equity in, with its self-reported NQFP and asset figures."
    roles: [FundManager, PlatformAdmin]
    code: 201
    input: [fund_id, legal_name, zone_tract_code, declared_nqfp_amount, total_asset_value, total_tangible_property_basis]
    output: QOZBusiness
    side_effects:
      - "sets qualification_status = UNTESTED and consecutive_failed_business_tests = 0"
      - "computes nqfp_amount = declared_nqfp_amount (no plan shelter or release exists yet)"

  - method: GET
    path: "/qof/qoz-businesses/{id}"
    description: "Reads one operating business, including the netted nqfp_amount the three-prong test measures."
    roles: [FundManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: QOZBusiness
    side_effects: []

  - method: GET
    path: "/qof/qoz-businesses"
    description: "Paginated business list; reverse lookup for QOZBusiness.fund_id."
    roles: [FundManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "fund_id?", "qualification_status?"]
    output: QOZBusiness[]
    side_effects: []

  - method: PATCH
    path: "/qof/qoz-businesses/{id}/reported-figures"
    description: "Updates the business's self-reported balance-sheet figures and re-derives nqfp_amount from the live plan shelter and release."
    roles: [FundManager, PlatformAdmin]
    code: 200
    input: ["declared_nqfp_amount?", "total_asset_value?", "total_tangible_property_basis?"]
    output: QOZBusiness
    side_effects:
      - "recomputes nqfp_amount = max(0.00, declared_nqfp_amount + blown_unspent_amount - wcsh_protected_amount)"
      - "does NOT re-derive any BusinessTest prong; prongs are only re-derived by measurement or by the plan-BLOWN cascade"
      - "increments QOZBusiness.version by 1"

  - method: POST
    path: "/qof/qoz-businesses/{id}/business-tests"
    description: "Opens a semiannual QOZB three-prong test for a testing date; the measurement inputs arrive at the measure call."
    roles: [FundManager, ComplianceOfficer]
    code: 201
    input: [testing_date]
    output: BusinessTest
    side_effects:
      - "creates BusinessTest in status DRAFT with all three prongs PENDING"

  - method: GET
    path: "/qof/qoz-businesses/{id}/business-tests"
    description: "Reverse lookup for BusinessTest.qoz_business_id."
    roles: [FundManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: BusinessTest[]
    side_effects: []

  # --- BusinessTest ---------------------------------------------------------
  - method: GET
    path: "/qof/business-tests/{id}"
    description: "Reads one QOZB test, including each prong percentage and verdict."
    roles: [FundManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: BusinessTest
    side_effects: []

  - method: POST
    path: "/qof/business-tests/{id}/measure"
    description: "Runs the three-prong measurement (gross income under the elected safe harbor, intangibles, nonqualified financial property)."
    roles: [FundManager, ComplianceOfficer]
    code: 200
    input: [safe_harbor_used, gross_income_zone_amount, gross_income_total_amount, intangibles_zone_use_amount, intangibles_total_amount, total_asset_value_measured, "hours_zone_pct?", "amounts_paid_zone_pct?"]
    output: BusinessTest
    side_effects:
      - "status DRAFT -> MEASURED, measured_by_user_id = X-User-ID"
      - "computes gross_income_pct / intangibles_pct / nqfp_pct and the three prong verdicts (calculations.qozb_prong_evaluation)"
      - "snapshots nqfp_amount_measured from the live QOZBusiness.nqfp_amount"

  - method: POST
    path: "/qof/business-tests/{id}/certify"
    description: "Certifies a measured QOZB test; the certifier must differ from the measurer (segregation of duties)."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: BusinessTest
    side_effects:
      - "status MEASURED -> PASSED when all three prongs PASS, else -> FAILED; certified_by_user_id = X-User-ID"
      - "on PASSED: QOZBusiness.qualification_status -> QUALIFIED and consecutive_failed_business_tests = 0"
      - "on FAILED with nqfp_prong == FAIL: QOZBusiness -> DISQUALIFIED, which flips every QOZB_EQUITY FundAsset pointing at it to NONQUALIFIED, recomputes the Fund aggregates, re-measures the fund's latest MEASURED AssetTest in place and may drive Fund.compliance_posture to DEFICIENT"
      - "on FAILED with nqfp_prong == PASS: QOZBusiness -> AT_RISK and consecutive_failed_business_tests increments"

  # --- AssetTest ------------------------------------------------------------
  - method: GET
    path: "/qof/asset-tests/{id}"
    description: "Reads one 90-percent asset test, including numerator, denominator, ratio, shortfall and failed month count."
    roles: [FundManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: AssetTest
    side_effects: []

  - method: POST
    path: "/qof/asset-tests/{id}/measure"
    description: "Measures the 90-percent asset test over the assets included by the half-open testing period, using the test's resolved valuation variant."
    roles: [FundManager, ComplianceOfficer]
    code: 200
    input: []
    output: AssetTest
    side_effects:
      - "status DRAFT -> MEASURED, measured_by_user_id = X-User-ID"
      - "computes included_asset_count, qualified_numerator, total_denominator, ratio_pct, result, shortfall_amount, failed_month_count (calculations.semiannual_asset_test_ratio)"

  - method: POST
    path: "/qof/asset-tests/{id}/certify"
    description: "Certifies a measured asset test; the certifier must differ from the measurer. A certified failure assesses the penalty."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: AssetTest
    side_effects:
      - "status MEASURED -> CERTIFIED_PASS when result == PASS, else -> CERTIFIED_FAIL; certified_by_user_id = X-User-ID"
      - "on CERTIFIED_PASS: Fund.compliance_posture -> COMPLIANT and consecutive_failed_tests = 0"
      - "on CERTIFIED_FAIL: Fund.consecutive_failed_tests increments, a PenaltyAssessment is created (calculations.failed_test_penalty), Fund.cumulative_penalty_months increases by failed_month_count, and Fund.compliance_posture -> DEFICIENT (or FAILED_FINAL plus certification_status DECERTIFIED on the second consecutive failure, which cascades a FUND_DECERTIFICATION InclusionEvent onto every outstanding election)"
      - "sets Fund.last_test_measurement_date; increments Fund.version by 1"

  # --- ImprovementProject ---------------------------------------------------
  - method: POST
    path: "/qof/improvement-projects"
    description: "Opens the 30-month substantial-improvement window for an asset under the asset-by-asset or aggregated-group variant."
    roles: [FundManager, PlatformAdmin]
    code: 201
    input: [fund_asset_id, window_start, aggregation_method, "group_key?"]
    output: ImprovementProject
    side_effects:
      - "computes window_end = window_start + 30 calendar months and snapshots basis_at_acquisition from FundAsset.unadjusted_cost_basis"
      - "creates the project in status OPEN with qualified_additions_total 0.00 and improvement_ratio_pct 0.0000"
      - "moves the owning FundAsset to status IMPROVING with qualification = IMPROVEMENT_PENDING"

  - method: GET
    path: "/qof/improvement-projects/{id}"
    description: "Reads one improvement project, including the ratio under its active aggregation method."
    roles: [FundManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: ImprovementProject
    side_effects: []

  - method: GET
    path: "/qof/improvement-projects"
    description: "Paginated project list; reverse lookup for ImprovementProject.fund_asset_id, and group walk for the self-referential group_key."
    roles: [FundManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "fund_asset_id?", "status?", "group_key?", "aggregation_method?"]
    output: ImprovementProject[]
    side_effects: []

  - method: POST
    path: "/qof/improvement-projects/{id}/expenditures"
    description: "Logs a capital expenditure against the substantial-improvement project, guarded by optimistic concurrency on ImprovementProject.version (§1.2.1)."
    roles: [FundManager]
    code: 201
    input: [amount, expenditure_kind, expected_project_version]
    output: CapitalExpenditure
    side_effects:
      - "stamps spend_date = logical clock now, sets improvement_project_id from the path and wcsh_plan_id = null"
      - "sets counts_toward_basis = true only for CAPITALIZED_IMPROVEMENT inside the project's window"
      - "recomputes ImprovementProject.qualified_additions_total and improvement_ratio_pct, and FundAsset.adjusted_basis"
      - "increments ImprovementProject.version by 1"

  - method: GET
    path: "/qof/improvement-projects/{id}/expenditures"
    description: "Reverse lookup for CapitalExpenditure.improvement_project_id."
    roles: [FundManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "expenditure_kind?"]
    output: CapitalExpenditure[]
    side_effects: []

  - method: POST
    path: "/qof/improvement-projects/{id}/evaluate"
    description: "Decides the substantial-improvement outcome against the 100-percent requirement and the 30-month window."
    roles: [FundManager, ComplianceOfficer]
    code: 200
    input: []
    output: ImprovementProject
    side_effects:
      - "recomputes improvement_ratio_pct under the active aggregation_method and stamps evaluated_at"
      - "status OPEN -> SATISFIED when improvement_ratio_pct >= 100.0000 inside the window: the FundAsset becomes HELD/QUALIFIED and the Fund's qualified aggregates rise"
      - "status OPEN -> LAPSED once the window has closed below 100.0000: the FundAsset returns to HELD/NONQUALIFIED"

  # --- WorkingCapitalPlan ---------------------------------------------------
  - method: POST
    path: "/qof/wcsh-plans"
    description: "Files a working-capital safe-harbor plan with its written designation and monthly spend schedule; enforces the aggregate 31-percent capacity across overlapping plans."
    roles: [FundManager, PlatformAdmin]
    code: 201
    input: [qoz_business_id, window_start, covered_amount, written_plan_reference, schedule_month_count, spend_schedule]
    output: WorkingCapitalPlan
    side_effects:
      - "computes window_end = window_start + 31 calendar months and documentation_complete"
      - "creates the plan in status DRAFT with spent_total 0.00, unspent_amount = covered_amount, last_checkpoint_month_index 0"
      - "no shelter is granted yet: QOZBusiness.wcsh_protected_amount only counts ACTIVE plans"

  - method: GET
    path: "/qof/wcsh-plans/{id}"
    description: "Reads one working-capital plan, including pacing shortfall, overspill and the schedule cursor."
    roles: [FundManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: WorkingCapitalPlan
    side_effects: []

  - method: GET
    path: "/qof/wcsh-plans"
    description: "Paginated plan list; reverse lookup for WorkingCapitalPlan.qoz_business_id."
    roles: [FundManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "qoz_business_id?", "status?"]
    output: WorkingCapitalPlan[]
    side_effects: []

  - method: POST
    path: "/qof/wcsh-plans/{id}/activate"
    description: "Activates a documented plan, which shelters its unspent dollars from the business's NQFP figure."
    roles: [FundManager]
    code: 200
    input: []
    output: WorkingCapitalPlan
    side_effects:
      - "status DRAFT -> ACTIVE"
      - "raises QOZBusiness.wcsh_protected_amount by (covered_amount - spent_total) and lowers QOZBusiness.nqfp_amount accordingly"

  - method: POST
    path: "/qof/wcsh-plans/{id}/expenditures"
    description: "Logs a spend against the plan and re-runs the waterfall allocation over the monthly schedule buckets."
    roles: [FundManager]
    code: 201
    input: [amount, expenditure_kind]
    output: CapitalExpenditure
    side_effects:
      - "stamps spend_date = logical clock now, sets wcsh_plan_id from the path and improvement_project_id = null"
      - "re-runs calculations.wcsh_pacing_compliance to refresh spent_total, unspent_amount, overspill_amount and every expenditure's schedule_month_index"
      - "recomputes QOZBusiness.wcsh_protected_amount and nqfp_amount"
      - "does NOT change plan status; only evaluate-checkpoint may move it to COMPLETED or BLOWN"

  - method: GET
    path: "/qof/wcsh-plans/{id}/expenditures"
    description: "Reverse lookup for CapitalExpenditure.wcsh_plan_id, including each spend's allocated schedule_month_index."
    roles: [FundManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "expenditure_kind?"]
    output: CapitalExpenditure[]
    side_effects: []

  - method: POST
    path: "/qof/wcsh-plans/{id}/evaluate-checkpoint"
    description: "Evaluates the plan's spend pacing at a schedule month index against the 10-percent tolerance."
    roles: [FundManager, ComplianceOfficer]
    code: 200
    input: [checkpoint_month_index]
    output: WorkingCapitalPlan
    side_effects:
      - "sets last_checkpoint_month_index and pacing_shortfall (calculations.wcsh_pacing_compliance)"
      - "status ACTIVE -> BLOWN when pacing_shortfall > tolerance, which releases unspent_amount into QOZBusiness.blown_unspent_amount, raises nqfp_amount, re-derives the nqfp prong of the business's latest MEASURED BusinessTest and can disqualify the business"
      - "status ACTIVE -> COMPLETED when the final schedule month is reached with pacing_shortfall == 0.00, which drops the shelter without releasing anything"

  # --- PenaltyAssessment ----------------------------------------------------
  - method: GET
    path: "/qof/penalty-assessments/{id}"
    description: "Reads one penalty assessment, including the per-month figure, gross, cure credit and net."
    roles: [FundManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: PenaltyAssessment
    side_effects: []

  - method: GET
    path: "/qof/penalty-assessments"
    description: "Paginated assessment list; reverse lookup for PenaltyAssessment.fund_id and PenaltyAssessment.asset_test_id, and the only discovery channel for assessments created by the certify cascade."
    roles: [FundManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "fund_id?", "asset_test_id?", "status?"]
    output: PenaltyAssessment[]
    side_effects: []

  - method: POST
    path: "/qof/penalty-assessments/{id}/cure-requests"
    description: "Files a cure request asserting reasonable cause (or conceding failure) against an assessed penalty."
    roles: [FundManager]
    code: 200
    input: [cure_basis, narrative_reference]
    output: PenaltyAssessment
    side_effects:
      - "status ASSESSED -> CURE_REQUESTED, cure_attempt_count increments, cure_basis / narrative_reference / requested_by_user_id recorded"
      - "Fund.compliance_posture DEFICIENT -> CURE_PENDING"

  - method: POST
    path: "/qof/penalty-assessments/{id}/cure-decisions"
    description: "Decides a pending cure request; approval credits the penalty and returns the conserved noncompliance months."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision]
    output: PenaltyAssessment
    side_effects:
      - "on APPROVE: status -> CURED, cure_credit_amount and net_penalty_amount set (calculations.penalty_cure_credit_netting), Fund.cumulative_penalty_months decreases by failed_month_count, Fund.compliance_posture -> COMPLIANT"
      - "on DENY with cure_basis == REASONABLE_CAUSE: status -> ASSESSED (the cycle back), Fund.compliance_posture -> DEFICIENT; a further request is allowed only while cure_attempt_count < 2"
      - "on DENY with cure_basis == TREATED_AS_FAILURE: status -> UPHELD, Fund.compliance_posture CURE_PENDING -> DEFICIENT (the penalty stands and its noncompliance months keep counting)"
      - "records decided_by_user_id = X-User-ID"

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:

  # --- auth / role ---
  - id: ERR_MISSING_AUTH_HEADER
    http: 401
    condition: "X-User-Role or X-User-ID absent or blank."
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of FundManager, ComplianceOfficer, Investor, PlatformAdmin."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The caller's role is not listed in the target endpoint's roles."
  - id: ERR_INVESTOR_SCOPE_VIOLATION
    http: 403
    condition: "An Investor caller addressed a gain, election or statement that belongs to a different Investor.id."
  - id: ERR_FUND_MANAGER_MISMATCH
    http: 403
    condition: "A FundManager caller's X-User-ID does not equal Fund.manager_user_id of the fund owning the target resource."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The certifying user is the same user that measured the test."

  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown field, wrong type, illegal enum member, out-of-range number, or a malformed spend_schedule."
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset negative or non-integer."

  # --- existence ---
  - id: ERR_FUND_NOT_FOUND
    http: 404
    condition: "No Fund with the given path id."
  - id: ERR_INVESTOR_NOT_FOUND
    http: 404
    condition: "No Investor with the given path id."
  - id: ERR_ELIGIBLE_GAIN_NOT_FOUND
    http: 404
    condition: "No EligibleGain with the given path id."
  - id: ERR_DEFERRAL_ELECTION_NOT_FOUND
    http: 404
    condition: "No DeferralElection with the given path id."
  - id: ERR_FUND_ASSET_NOT_FOUND
    http: 404
    condition: "No FundAsset with the given path id."
  - id: ERR_QOZ_BUSINESS_NOT_FOUND
    http: 404
    condition: "No QOZBusiness with the given path id."
  - id: ERR_BUSINESS_TEST_NOT_FOUND
    http: 404
    condition: "No BusinessTest with the given path id."
  - id: ERR_ASSET_TEST_NOT_FOUND
    http: 404
    condition: "No AssetTest with the given path id."
  - id: ERR_IMPROVEMENT_PROJECT_NOT_FOUND
    http: 404
    condition: "No ImprovementProject with the given path id."
  - id: ERR_WCSH_PLAN_NOT_FOUND
    http: 404
    condition: "No WorkingCapitalPlan with the given path id."
  - id: ERR_PENALTY_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "No PenaltyAssessment with the given path id."
  - id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http: 404
    condition: "A foreign key supplied in a request body (investor_id, eligible_gain_id, fund_id, qoz_business_id, fund_asset_id, or a disposition_sequence element) does not resolve."

  # --- state ---
  - id: ERR_FUND_NOT_CERTIFIED
    http: 409
    condition: "The owning fund's certification_status is not SELF_CERTIFIED."
  - id: ERR_FUND_DECERTIFIED
    http: 409
    condition: "The owning fund's certification_status is DECERTIFIED."
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "The requested transition is not declared in §1.2 from the target's current NON-TERMINAL state; a target already in a terminal state raises ERR_ALREADY_TERMINAL instead."
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "The target resource is already in a terminal state for its machine."
  - id: ERR_STALE_FUND_VERSION
    http: 412
    condition: "expected_fund_version does not equal the current Fund.version."
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: "expected_project_version does not equal the current ImprovementProject.version."

  # --- business ---
  - id: ERR_INVESTOR_NOT_ATTESTED
    http: 422
    condition: "Investor.compliance_attestation_status is not ATTESTED."
  - id: ERR_GAIN_NOT_ELIGIBLE
    http: 422
    condition: "gain_character is ORDINARY, or deadline_basis == SECTION_1231_YEAR_END on a gain that is not SECTION_1231_NET."
  - id: ERR_RELATED_PARTY_ACQUISITION
    http: 422
    condition: "asset_class == QOZ_BUSINESS_PROPERTY with acquired_from_related_party == true."
  - id: ERR_180_DAY_WINDOW_CLOSED
    http: 422
    condition: "days_from_basis exceeds 180 at election time."
  - id: ERR_180_DAY_WINDOW_NOT_OPEN
    http: 422
    condition: "days_from_basis is negative at election time."
  - id: ERR_TESTING_PERIOD_OVERLAP
    http: 409
    condition: "A new asset-test period intersects an existing half-open testing period of the same fund, or period_start is not strictly before period_end."
  - id: ERR_IMPROVEMENT_WINDOW_OVERLAP
    http: 409
    condition: "A new improvement window intersects (or is adjacent to) an existing closed window on the same asset."
  - id: ERR_EXPENDITURE_OUTSIDE_WINDOW
    http: 422
    condition: "The logical clock is outside the improvement project's 30-month window."
  - id: ERR_WCSH_WINDOW_CLOSED
    http: 422
    condition: "The logical clock is outside the plan's 31-month safe-harbor window."
  - id: ERR_WCSH_PLAN_INCOMPLETE
    http: 422
    condition: "Activation attempted while documentation_complete is false."
  - id: ERR_WCSH_SCHEDULE_MISMATCH
    http: 422
    condition: "The spend_schedule planned amounts do not sum to covered_amount."
  - id: ERR_CHECKPOINT_INDEX_INVALID
    http: 422
    condition: "checkpoint_month_index outside 1..schedule_month_count or below last_checkpoint_month_index."
  - id: ERR_SAFE_HARBOR_INPUT_MISSING
    http: 422
    condition: "The safe-harbor branch's required percentage input is missing, or a percentage input was supplied for a branch that does not use it."
  - id: ERR_QOZB_LINK_REQUIRED
    http: 422
    condition: "qoz_business_id missing for QOZB_EQUITY, supplied for any other asset_class, or pointing at a business of a different fund."
  - id: ERR_AGGREGATION_GROUP_INVALID
    http: 422
    condition: "group_key missing for AGGREGATED_GROUP, supplied for ASSET_BY_ASSET, or shared across assets of different funds."
  - id: ERR_TEN_YEAR_HOLD_NOT_MET
    http: 422
    condition: "Reserved for step-up requests that cannot even be evaluated for the hold, e.g. an election whose investment_date lies in the future of the logical clock."
  - id: ERR_DISPOSITION_SEQUENCE_INVALID
    http: 422
    condition: "A disposition_sequence element is empty, duplicated, not HELD, or belongs to another fund."
  - id: ERR_ELECTION_REVOKED
    http: 409
    condition: "A step-up election was filed against a DeferralElection in status REVOKED."
  - id: ERR_DISPOSITION_ORDER_VIOLATION
    http: 409
    condition: "An asset was disposed before an earlier-indexed asset in the pinned disposition sequence."
  - id: ERR_ELECTED_AMOUNT_EXCEEDS_GAIN
    http: 422
    condition: "elected_amount exceeds EligibleGain.unelected_amount."
  - id: ERR_WCSH_AGGREGATE_CAP_EXCEEDED
    http: 422
    condition: "Overlapping plan months would push the business's sheltered dollars above 31 percent of total_asset_value."
  - id: ERR_INCLUSION_FRACTION_EXCEEDS_REMAINING
    http: 422
    condition: "included_fraction_total plus included_fraction would exceed 1.0000."
  - id: ERR_CURE_ATTEMPTS_EXHAUSTED
    http: 409
    condition: "A third cure request was filed against the same assessment."
  - id: ERR_CURE_BASIS_NOT_APPROVABLE
    http: 422
    condition: "decision == APPROVE while cure_basis is TREATED_AS_FAILURE."

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:

  - name: Investor
    identity: entity_backed:Investor
    description: |
      The taxpayer. X-User-ID MUST equal an existing Investor.id; every gain,
      election, inclusion event and step-up election the caller touches must
      belong to that investor (validations priority 8).
    exclusive_operations:
      - "POST /qof/eligible-gains (own gains)"
      - "POST /qof/deferral-elections/{id}/revoke"
      - "POST /qof/deferral-elections/{id}/step-up-elections"
      - "GET /qof/investors/{id}/statement (own statement)"
    shared_operations:
      - "POST /qof/deferral-elections (with PlatformAdmin)"
      - "POST /qof/deferral-elections/{id}/inclusion-events (with FundManager, PlatformAdmin)"
      - "GET reads of own gains, elections, inclusion events and step-up elections"
      - "GET /qof/funds/{id} (needed to read Fund.version before an election)"
      - "GET /qof/_clock"

  - name: FundManager
    identity: opaque
    description: |
      Fund operator. X-User-ID is an opaque operator handle, NOT an entity id;
      it is compared against Fund.manager_user_id of the fund that owns the
      target resource (validations priority 9). A FundManager may measure a
      test but may never certify one.
    exclusive_operations:
      - "POST /qof/funds/{id}/self-certify"
      - "POST /qof/fund-assets/{id}/dispose"
      - "POST /qof/wcsh-plans/{id}/activate"
      - "POST /qof/wcsh-plans/{id}/expenditures"
      - "POST /qof/improvement-projects/{id}/expenditures"
      - "POST /qof/penalty-assessments/{id}/cure-requests"
    shared_operations:
      - "POST /qof/funds, POST /qof/fund-assets, POST /qof/qoz-businesses, POST /qof/wcsh-plans, POST /qof/improvement-projects (with PlatformAdmin)"
      - "POST /qof/funds/{id}/asset-tests, POST /qof/asset-tests/{id}/measure, POST /qof/qoz-businesses/{id}/business-tests, POST /qof/business-tests/{id}/measure, POST /qof/improvement-projects/{id}/evaluate, POST /qof/wcsh-plans/{id}/evaluate-checkpoint (with ComplianceOfficer)"
      - "PATCH /qof/qoz-businesses/{id}/reported-figures (with PlatformAdmin)"
      - "POST /qof/deferral-elections/{id}/inclusion-events (with Investor, PlatformAdmin)"
      - "fund-scoped GET reads"

  - name: ComplianceOfficer
    identity: opaque
    description: |
      Independent compliance reviewer. X-User-ID is an opaque operator handle.
      Holds the certification and cure-decision authority; the same handle may
      not both measure and certify one test (validations priority 10).
    exclusive_operations:
      - "POST /qof/asset-tests/{id}/certify"
      - "POST /qof/business-tests/{id}/certify"
      - "POST /qof/penalty-assessments/{id}/cure-decisions"
      - "POST /qof/funds/{id}/decertify"
    shared_operations:
      - "POST /qof/funds/{id}/asset-tests, POST /qof/asset-tests/{id}/measure, POST /qof/qoz-businesses/{id}/business-tests, POST /qof/business-tests/{id}/measure, POST /qof/improvement-projects/{id}/evaluate, POST /qof/wcsh-plans/{id}/evaluate-checkpoint (with FundManager)"
      - "every compliance GET read across funds, investors, gains, elections, tests, plans and assessments"

  - name: PlatformAdmin
    identity: opaque
    description: |
      Platform operator. X-User-ID is an opaque operator handle. Owns investor
      onboarding, the logical clock and the deadline sweep, and may stand in
      for an investor or a manager on creation endpoints, but holds no
      certification or cure-decision authority.
    exclusive_operations:
      - "POST /qof/investors"
      - "PATCH /qof/investors/{id}/attestation"
      - "POST /qof/_clock/set_current_utc"
      - "POST /qof/ops-runs/deadline-sweep"
    shared_operations:
      - "POST /qof/funds, POST /qof/fund-assets, POST /qof/qoz-businesses, POST /qof/wcsh-plans, POST /qof/improvement-projects (with FundManager)"
      - "POST /qof/eligible-gains, POST /qof/deferral-elections, POST /qof/deferral-elections/{id}/revoke, POST /qof/deferral-elections/{id}/inclusion-events, POST /qof/deferral-elections/{id}/step-up-elections (with Investor)"
      - "POST /qof/fund-assets/{id}/dispose (with FundManager)"
      - "PATCH /qof/qoz-businesses/{id}/reported-figures (with FundManager)"
      - "every GET read"
