        as: SystemOperator
      - call: POST /event-security/guards
        payload:
          full_name: Gale One
          employment_type: EMPLOYEE
          credential_level: 1
          license_number: GC-7001
          credential_expires_on: '2026-12-31T00:00:00Z'
          base_hourly_rate_cents: 2200
        as: StaffingCoordinator
        captures:
          g1_id: $.data.id
      - call: POST /event-security/guards/${g1_id}/credential-verification
        payload:
          action: VERIFY
        as: CredentialAuditor
      trigger:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-05T00:00:00Z'
        as: SystemOperator
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-05T00:00:00Z'
        as: SystemOperator
      - call: GET /event-security/guards/${g1_id}
        payload: {}
        as: CredentialAuditor
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-12-31T00:00:00Z'
        as: SystemOperator
      - call: GET /event-security/guards/${g1_id}
        payload: {}
        as: CredentialAuditor
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2027-01-15T00:00:00Z'
        as: SystemOperator
      - call: GET /event-security/guards
        payload:
          verification_status: EXPIRED
        as: CredentialAuditor
      assert:
      - the advance to 2026-09-05 returns 200 with current_utc == "2026-09-05T00:00:00Z", expired_guard_count == 0 and voided_assignment_count == 0 — nothing was due
      - re-setting the clock to the SAME instant again returns expired_guard_count == 0 and voided_assignment_count == 0; the checkpoint is idempotent for an unchanged clock
      - the guard read after both advances still shows verification_status == VERIFIED and an unchanged version
      - the advance to exactly 2026-12-31T00:00:00Z returns expired_guard_count == 1 and voided_assignment_count == 0 — the sweep predicate is credential_expires_on <= the NEW clock, so the boundary instant
        expires the card, and the guard holds no roster rows to void
      - the guard read now shows verification_status == EXPIRED with version incremented by exactly 1
      - the further advance to 2027-01-15 returns expired_guard_count == 0 — the already-EXPIRED row is not VERIFIED and so is not swept a second time
      - the guard listing filtered by verification_status EXPIRED reports total_count == 1
  - name: cascading_side_effects_verified_end_to_end
