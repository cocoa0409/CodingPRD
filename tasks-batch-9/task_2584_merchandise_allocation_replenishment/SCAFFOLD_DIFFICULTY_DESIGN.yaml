          Two structurally identical programs differ by exactly one basis point of threshold: 15536 and
          15537 against a recommendation whose benefit_ratio_bp is exactly 15536. The freight-worthiness
          gate is >= with equality passing, so the first approve succeeds and the second is rejected. A >
          implementation, or any off-by-one in the ROUND_HALF_UP of 15535.71, flips one of the two answers.
