  - method: GET
    path: "/lot-items"
    description: "List LotItem rows across lots (filterable)."
    roles: [IntakeOfficer, PropertyCustodian, ClaimsExaminer, ReleaseOfficer, PoliceLiaison, AuctionCoordinator, ProgramAdmin]
    code: 200
    input: ["lot_id?", "item_id?", "limit?", "offset?"]
    output: LotItem[]
    side_effects: []
  - method: GET
    path: "/lot-items/{lot_item_id}"
    description: "Get one LotItem row."
    roles: [IntakeOfficer, PropertyCustodian, ClaimsExaminer, ReleaseOfficer, PoliceLiaison, AuctionCoordinator, ProgramAdmin]
    code: 200
    input: []
    output: LotItem
    side_effects: []
  - method: POST
    path: "/auction-lots/{lot_id}/publish"
    description: "Publish a non-empty DRAFT lot."
    roles: [AuctionCoordinator]
    code: 200
    input: []
    output: AuctionLot
    side_effects: ["AuctionLot DRAFT -> PUBLISHED", "increments AuctionLot.version by 1"]
  - method: POST
    path: "/auction-lots/{lot_id}/finalize-sale"
    description: "Record hammer price and sell the lot; finalizer must differ from lot creator; all lotted items -> SOLD."
    roles: [AuctionCoordinator]
    code: 200
    input: [hammer_price_cents]
    output: AuctionLot
    side_effects: ["sets hammer_price_cents, finalized_by", "lotted Items LOTTED -> SOLD", "recompute storage_occupancy (slots freed)", "increments AuctionLot.version by 1"]
  - method: POST
    path: "/auction-lots/{lot_id}/close-unsold"
    description: "Close a published lot without a sale; per-item unsold escalation applies."
    roles: [AuctionCoordinator]
    code: 200
    input: []
    output: AuctionLot
    side_effects: ["per unsold_escalation each lotted Item -> AUCTION_ELIGIBLE or DISPOSAL_PENDING", "LotItem rows deleted", "minimum_bid_cents recomputed (to 0)", "increments AuctionLot.version by 1"]

  # ---- release records ----
  - method: GET
    path: "/release-records"
    description: "List release documentation records (append-only)."
    roles: [IntakeOfficer, PropertyCustodian, ClaimsExaminer, ReleaseOfficer, PoliceLiaison, AuctionCoordinator, ProgramAdmin]
    code: 200
    input: ["item_id?", "claim_id?", "limit?", "offset?"]
    output: ReleaseRecord[]
    side_effects: []
  - method: GET
    path: "/release-records/{record_id}"
    description: "Get one release record."
    roles: [IntakeOfficer, PropertyCustodian, ClaimsExaminer, ReleaseOfficer, PoliceLiaison, AuctionCoordinator, ProgramAdmin]
    code: 200
    input: []
    output: ReleaseRecord
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/invalid X-User-Role, or missing X-User-ID for a non-PublicUser role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "role not permitted on endpoint, or Claimant acting on another claimant's resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path id or body-referenced FK id does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, malformed value, or enum value outside the declared set" }
  - { id: ERR_STALE_ITEM_VERSION, http: 412, condition: "POST /claims expected_item_version != current Item.version" }
  - { id: ERR_STALE_LOT_VERSION, http: 412, condition: "lot add-item expected_lot_version != current AuctionLot.version" }
  - { id: ERR_STALE_PROGRAM_VERSION, http: 412, condition: "POST /retention-policies expected_program_version != current Program.version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "target resource state does not permit the requested transition" }
  - { id: ERR_ITEM_NOT_CLAIMABLE, http: 409, condition: "claim creation against an item not in {STORED, LISTED}" }
  - { id: ERR_ITEM_NOT_AUCTION_ELIGIBLE, http: 409, condition: "lot add-item against an item not in AUCTION_ELIGIBLE" }
  - { id: ERR_LOTS_NOT_FINAL, http: 409, condition: "event settle while any lot is in {DRAFT, PUBLISHED}" }
  - { id: ERR_PROGRAM_INACTIVE, http: 409, condition: "item intake or publish under a deactivated program" }
  - { id: ERR_LOCATION_INACTIVE, http: 409, condition: "intake or move targeting a deactivated storage location" }
  - { id: ERR_LOCATION_NOT_EMPTY, http: 409, condition: "deactivating a storage location with occupied_slots > 0" }
  - { id: ERR_STORAGE_CAPACITY_EXCEEDED, http: 409, condition: "intake or move would push occupied_slots above capacity_slots" }
  - { id: ERR_SECURE_STORAGE_REQUIRED, http: 422, condition: "HIGH-tier item targeted at a location with supports_high_value == false" }
  - { id: ERR_NO_RETENTION_POLICY, http: 422, condition: "no active RetentionPolicy for (program_id, category, computed value_tier)" }
  - { id: ERR_DISPOSAL_METHOD_MISMATCH, http: 422, condition: "dispose method != item.pending_disposal_method" }
  - { id: ERR_LOT_EMPTY, http: 422, condition: "publishing a lot with zero LotItem rows" }
  - { id: ERR_INVALID_TIME_WINDOW, http: 422, condition: "auction event ends_at <= starts_at" }
  - { id: ERR_VENUE_DOUBLE_BOOKED, http: 409, condition: "half-open window overlap with another SCHEDULED/COMPLETED event at the same venue" }
  - { id: ERR_EVENT_STILL_OPEN, http: 409, condition: "settle attempted before event.ends_at on the logical clock" }
  - { id: ERR_CROSS_PROGRAM_REFERENCE, http: 422, condition: "event program != venue program, or lotted item program != event program" }
  - { id: ERR_INSURANCE_CAP_EXCEEDED, http: 422, condition: "add-item would push lot minimum_bid_cents above venue insurance_cap_cents" }
  - { id: ERR_BELOW_MINIMUM_BID, http: 422, condition: "hammer_price_cents < lot.minimum_bid_cents" }
  - { id: ERR_IDENTIFICATION_NOT_LISTABLE, http: 422, condition: "publish attempted on an item with is_identification == true" }
  - { id: ERR_CLAIM_PROOF_INSUFFICIENT, http: 422, condition: "approve attempted below tier threshold, or HIGH tier without claimant.id_verified" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "same X-User-ID attempted two duty-segregated steps (intake vs release, intake vs approve, lot create vs finalize)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PublicUser
    description: "Unauthenticated-equivalent public visitor of the online portal (X-User-ID optional)"
    identity: opaque
    exclusive_operations: ["POST /claimants", "POST /inquiries"]
    shared_operations: ["GET /public/items"]
  - name: Claimant
    description: "Registered owner claiming property; may only touch its own claims"
    identity: "entity_backed:Claimant"
    exclusive_operations: ["POST /claims", "POST /claims/{claim_id}/resubmit", "POST /claims/{claim_id}/withdraw"]
    shared_operations: ["GET /public/items", "GET /claims", "GET /claims/{claim_id}", "GET /claimants/{claimant_id}"]
  - name: IntakeOfficer
    description: "Front-desk staff registering and describing found property; also answers public inquiries"
    identity: opaque
    exclusive_operations: ["POST /items", "POST /items/{item_id}/publish", "POST /items/{item_id}/unpublish", "POST /inquiries/{inquiry_id}/answer", "POST /inquiries/{inquiry_id}/close"]
    shared_operations: ["all staff GET list/read endpoints"]
  - name: PropertyCustodian
    description: "Back-office custodian managing storage moves and disposal"
    identity: opaque
    exclusive_operations: ["POST /items/{item_id}/move", "POST /items/{item_id}/dispose"]
    shared_operations: ["all staff GET list/read endpoints"]
  - name: ClaimsExaminer
    description: "Reviews ownership claims, verifies claimant IDs, approves or rejects"
    identity: opaque
    exclusive_operations: ["POST /claimants/{claimant_id}/verify-id", "POST /claims/{claim_id}/start-review", "POST /claims/{claim_id}/request-info", "POST /claims/{claim_id}/approve", "POST /claims/{claim_id}/reject"]
    shared_operations: ["all staff GET list/read endpoints"]
  - name: ReleaseOfficer
    description: "Performs documented property handover to verified owners"
    identity: opaque
    exclusive_operations: ["POST /items/{item_id}/release"]
    shared_operations: ["all staff GET list/read endpoints"]
  - name: PoliceLiaison
    description: "Interfaces with law enforcement for high-value/ID/evidence items"
    identity: opaque
    exclusive_operations: ["POST /items/{item_id}/refer-to-law-enforcement", "POST /referrals/{referral_id}/confirm-pickup", "POST /referrals/{referral_id}/return-to-custody", "POST /referrals/{referral_id}/convert-to-evidence"]
    shared_operations: ["all staff GET list/read endpoints"]
  - name: AuctionCoordinator
    description: "Runs auctions: events, lots, sales; segregation between lot creator and sale finalizer"
    identity: opaque
    exclusive_operations: ["POST /auction-events", "POST /auction-events/{event_id}/cancel", "POST /auction-events/{event_id}/settle", "POST /auction-lots", "POST /auction-lots/{lot_id}/items", "DELETE /auction-lots/{lot_id}/items/{item_id}", "POST /auction-lots/{lot_id}/publish", "POST /auction-lots/{lot_id}/finalize-sale", "POST /auction-lots/{lot_id}/close-unsold"]
    shared_operations: ["all staff GET list/read endpoints"]
  - name: ProgramAdmin
    description: "City administrator owning programs, retention policies, storage, venues, clock, and sweeps"
    identity: opaque
    exclusive_operations: ["POST /programs", "POST /programs/{program_id}/deactivate", "POST /retention-policies", "POST /storage-locations", "POST /storage-locations/{location_id}/deactivate", "POST /venues", "POST /_clock/set_current_utc", "POST /_sweeps/retention"]
    shared_operations: ["all staff GET list/read endpoints"]
