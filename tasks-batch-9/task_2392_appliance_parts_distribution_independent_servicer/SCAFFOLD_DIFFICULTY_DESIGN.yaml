          assert:
            - "trigger step 1 returns HTTP 422 with data.error_id == ERR_ORDER_HAS_NO_LINES"
            - "PartOrder.${order_z_id}.fulfillment_status == DRAFT and PartOrder.${order_z_id}.total_cents == 0"
            - "trigger step 2 returns 200 and PartOrder.${order_y_id}.fulfillment_status == ALLOCATED"
