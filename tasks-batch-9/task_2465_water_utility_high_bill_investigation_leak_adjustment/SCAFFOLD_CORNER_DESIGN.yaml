            - "One AccountLedgerEntry with entry_type CHARGE and source_kind METER_TEST_DEPOSIT of +3000 is written, so balance_cents == 63569 and credit_status stays PAST_DUE"
            - "SCHEDULE: HTTP 200 with status FIELD_TEST_SCHEDULED, window_start 2026-08-05T09:00:00Z and window_end 2026-08-05T12:00:00Z"
            - "RESULT AT window_end: HTTP 422 with error_id ERR_TEST_RESULT_OUTSIDE_WINDOW, because the reserved interval is half-open and 2026-08-05T12:00:00Z is the excluded upper endpoint"
            - "After that refusal status is still FIELD_TEST_SCHEDULED with tested_at null and field_result null"
            - "RESULT AT window_start: HTTP 200 with status CLOSED_PASS, field_result PASS, tested_at 2026-08-05T09:00:00Z — the lower endpoint is included"
            - "Meter.${meter_a_id}.accuracy_status == VERIFIED_ACCURATE and last_test_completed_at == 2026-08-05T09:00:00Z"
            - "deposit_refunded is still false and balance_cents is still 63569 — a PASS forfeits the deposit"
            - "HighBillInvestigation.${inv_id}.status is still OPEN: the EVIDENCE_REQUESTED -> EVIDENCE_UNDER_REVIEW escalation only fires from EVIDENCE_REQUESTED"

      - name: corner_error_board_hearing_notice_timing_officer_and_remand_guards
        claim_type: error_triggerable
        grounds:
          - errors[ERR_HEARING_NOTICE_TOO_SHORT]
          - errors[ERR_HEARING_NOT_YET_HELD]
          - errors[ERR_HEARING_OFFICER_CONFLICT]
          - errors[ERR_REMAND_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Four independent guards along one appeal, each isolated by a single day or a single user id:
          2026-08-10 is one day short of the ten-day notice and 2026-08-11 is exactly enough; a decision
          recorded before the hearing date is refused and the identical call after the clock moves is
          accepted; the clerk u-shared is barred because that id filed the appeal even though the role is
