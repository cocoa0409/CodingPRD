            - "the same payload with deployed_from 2026-11-30T00:00:00Z, i.e. deployed_from exactly equal to profile A's deployed_to, is REJECTED with ERR_CUTOVER_BUFFER_VIOLATION — touching endpoints are forbidden here, the opposite verdict from validations[priority=27]"
