scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_species_profile_returns_201_all_fields
        claim_type: Creation
        grounds: [entities.SpeciesProfile, endpoints]
        distinguishing_aspect: "POST /species-profiles with all required fields -> 201 and SpeciesProfile with server-minted id, created_at, version=1, is_regulated default false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /species-profiles"
              payload: { common_name: "Eastern Gray Squirrel", code: "EGS_C", base_trap_fee_cents: 4000 }
              as: ComplianceOfficer
              captures: { sp_id: $.data.id }
          assert:
            - "response.status == 201"
            - "SpeciesProfile.${sp_id}.is_regulated == false"
            - "SpeciesProfile.${sp_id}.relocation_max_miles == 25"
            - "SpeciesProfile.${sp_id}.version == 1"

      - name: get_property_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Property, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /properties/{id} with a non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /properties/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_entry_point_missing_required_estimated_individuals
        claim_type: Required Fields
        grounds: [entities.EntryPoint, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /inspections/{id}/entry-points omitting estimated_individuals -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A DRAFT inspection on a property and a species profile."]
          setup_api_calls:
            - call: "POST /service-accounts"
              payload: { account_name: "E1", contact_email: "e1@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /properties"
              payload: { account_id: "${acct_id}", latitude: 40.0, longitude: -75.0 }
              as: Dispatcher
              captures: { prop_id: $.data.id }
            - call: "POST /species-profiles"
              payload: { common_name: "Bat", code: "BAT_E1", base_trap_fee_cents: 4000 }
              as: ComplianceOfficer
              captures: { sp_id: $.data.id }
            - call: "POST /properties/${prop_id}/inspections"
              payload: { scheduled_for: "2026-04-02T09:00:00Z" }
              as: Dispatcher
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /inspections/${insp_id}/entry-points"
              payload: { species_id: "${sp_id}", location_label: "gap" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_inspection_default_is_emergency_false
        claim_type: Defaults
        grounds: [entities.Inspection.fields.is_emergency]
        distinguishing_aspect: "POST /properties/{id}/inspections omitting is_emergency -> defaults to false."
        test_recipe:
          setup: ["A property."]
          setup_api_calls:
            - call: "POST /service-accounts"
              payload: { account_name: "E2", contact_email: "e2@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /properties"
              payload: { account_id: "${acct_id}", latitude: 40.0, longitude: -75.0 }
              as: Dispatcher
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /properties/${prop_id}/inspections"
              payload: { scheduled_for: "2026-04-02T09:00:00Z" }
              as: Dispatcher
              captures: { insp_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Inspection.${insp_id}.is_emergency == false"
            - "Inspection.${insp_id}.status == DRAFT"

      - name: technician_computed_kit_counts_on_create
        claim_type: Computed Fields
        grounds: [entities.Technician.fields.traps_deployed, entities.Technician.fields.traps_available]
        distinguishing_aspect: "On POST /technicians, traps_deployed computes to 0 and traps_available computes to kit_trap_capacity (5), ignoring any client-supplied value."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /technicians"
              payload: { full_name: "Ty", license_tier: "CERTIFIED", kit_trap_capacity: 5 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Technician.${tech_id}.traps_deployed == 0"
            - "Technician.${tech_id}.traps_available == 5"

      - name: entry_point_invalid_severity_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.EntryPoint.fields.severity, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /inspections/{id}/entry-points with severity not in {MINOR,MODERATE,MAJOR} -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A DRAFT inspection and a species profile."]
          setup_api_calls:
            - call: "POST /service-accounts"
              payload: { account_name: "E3", contact_email: "e3@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /properties"
              payload: { account_id: "${acct_id}", latitude: 40.0, longitude: -75.0 }
              as: Dispatcher
              captures: { prop_id: $.data.id }
            - call: "POST /species-profiles"
              payload: { common_name: "Mouse", code: "MOUSE_E3", base_trap_fee_cents: 4000 }
              as: ComplianceOfficer
              captures: { sp_id: $.data.id }
            - call: "POST /properties/${prop_id}/inspections"
              payload: { scheduled_for: "2026-04-02T09:00:00Z" }
              as: Dispatcher
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /inspections/${insp_id}/entry-points"
              payload: { species_id: "${sp_id}", location_label: "gap", severity: "EXTREME", estimated_individuals: 2 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: property_wrong_parent_account_not_found
        claim_type: Parent Relationships
        grounds: [entities.Property.fields.account_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /properties with a non-existent account_id FK -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /properties"
              payload: { account_id: "00000000-0000-4000-8000-000000000000", latitude: 40.0, longitude: -75.0 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: species_profile_min_exceeds_max_rejected
        claim_type: Type Constraints
        grounds: [entities.SpeciesProfile.fields.relocation_min_miles, entities.SpeciesProfile.fields.relocation_max_miles, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /species-profiles with relocation_min_miles > relocation_max_miles -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /species-profiles"
              payload: { common_name: "Bad", code: "BAD_E4", base_trap_fee_cents: 4000, relocation_min_miles: 30, relocation_max_miles: 10 }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

  # =========================================================================
  # State machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: inspection_complete_from_completed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Inspection.DRAFT_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Completing an already COMPLETED inspection -> ERR_INVALID_STATE (409); no state change."
        test_recipe:
          setup: ["A COMPLETED inspection (one entry point added then completed)."]
          setup_api_calls:
            - call: "POST /service-accounts"
              payload: { account_name: "S1", contact_email: "s1@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /properties"
              payload: { account_id: "${acct_id}", latitude: 40.0, longitude: -75.0 }
              as: Dispatcher
              captures: { prop_id: $.data.id }
            - call: "POST /species-profiles"
              payload: { common_name: "Rat", code: "RAT_S1", base_trap_fee_cents: 4000 }
              as: ComplianceOfficer
              captures: { sp_id: $.data.id }
            - call: "POST /properties/${prop_id}/inspections"
              payload: { scheduled_for: "2026-04-02T09:00:00Z" }
              as: Dispatcher
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/entry-points"
              payload: { species_id: "${sp_id}", location_label: "gap", severity: "MINOR", estimated_individuals: 1 }
              as: Dispatcher
            - call: "POST /properties/${prop_id}/inspections/${insp_id}/complete"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /properties/${prop_id}/inspections/${insp_id}/complete"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: inspection_complete_with_no_entry_points_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Inspection.DRAFT_to_COMPLETED, "errors[ERR_EMPTY_SET]"]
        distinguishing_aspect: "Completing a DRAFT inspection that has zero entry points -> ERR_EMPTY_SET (409)."
        test_recipe:
          setup: ["A DRAFT inspection with no entry points."]
          setup_api_calls:
            - call: "POST /service-accounts"
              payload: { account_name: "S2", contact_email: "s2@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /properties"
              payload: { account_id: "${acct_id}", latitude: 40.0, longitude: -75.0 }
              as: Dispatcher
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/inspections"
              payload: { scheduled_for: "2026-04-02T09:00:00Z" }
              as: Dispatcher
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /properties/${prop_id}/inspections/${insp_id}/complete"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_EMPTY_SET"

      - name: quote_accept_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Quote.SENT_to_ACCEPTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Accepting a DRAFT (not yet SENT) quote -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A DRAFT quote with one line item (not sent)."]
          setup_api_calls:
            - call: "POST /service-accounts"
              payload: { account_name: "S3", contact_email: "s3@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /properties"
              payload: { account_id: "${acct_id}", latitude: 40.0, longitude: -75.0 }
              as: Dispatcher
              captures: { prop_id: $.data.id }
            - call: "POST /species-profiles"
              payload: { common_name: "Vole", code: "VOLE_S3", base_trap_fee_cents: 4000 }
              as: ComplianceOfficer
              captures: { sp_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Ned", license_tier: "BASIC", kit_trap_capacity: 5 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /properties/${prop_id}/inspections"
              payload: { scheduled_for: "2026-04-02T09:00:00Z" }
              as: Dispatcher
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/entry-points"
              payload: { species_id: "${sp_id}", location_label: "gap", severity: "MINOR", estimated_individuals: 1 }
              as: Dispatcher
            - call: "POST /properties/${prop_id}/inspections/${insp_id}/complete"
              payload: {}
              as: Dispatcher
              captures: { insp_v: $.data.version }
            - call: "POST /quotes"
              payload: { inspection_id: "${insp_id}", expected_inspection_version: "${insp_v}" }
              as: Dispatcher
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/line-items"
              payload: { species_id: "${sp_id}", line_type: "TRAP", quantity: 1, unit_price_cents: 4000 }
              as: Dispatcher
          trigger:
            - call: "POST /quotes/${quote_id}/accept"
              payload: { assigned_technician_id: "${tech_id}" }
              as: PropertyOwner
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: permit_approve_lifts_regulatory_hold_bubble
        claim_type: Side Effect Execution
        grounds: [state_machines.Permit.REQUESTED_to_APPROVED, entities.Property.fields.posture]
        distinguishing_aspect: "Approving the only permit on a work order flips Property.posture from REGULATORY_HOLD to ACTIVE_REMEDIATION (bubble side effect)."
        test_recipe:
          setup: ["An OPEN work order for one regulated species whose single Permit is REQUESTED; Property.posture == REGULATORY_HOLD."]
          setup_api_calls:
            - call: "POST /service-accounts"
              payload: { account_name: "S4", contact_email: "s4@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /properties"
              payload: { account_id: "${acct_id}", latitude: 40.0, longitude: -75.0 }
              as: Dispatcher
              captures: { prop_id: $.data.id }
            - call: "POST /species-profiles"
              payload: { common_name: "Fox", code: "FOX_S4", is_regulated: true, relocation_min_miles: 5, relocation_max_miles: 25, base_trap_fee_cents: 4000, risk_weight: 2.0 }
              as: ComplianceOfficer
              captures: { sp_reg_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Fay", license_tier: "CERTIFIED", kit_trap_capacity: 5 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /properties/${prop_id}/inspections"
              payload: { scheduled_for: "2026-04-02T09:00:00Z" }
              as: Dispatcher
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/entry-points"
              payload: { species_id: "${sp_reg_id}", location_label: "den", severity: "MAJOR", estimated_individuals: 2 }
              as: Dispatcher
            - call: "POST /properties/${prop_id}/inspections/${insp_id}/complete"
              payload: {}
              as: Dispatcher
              captures: { insp_v: $.data.version }
            - call: "POST /quotes"
              payload: { inspection_id: "${insp_id}", expected_inspection_version: "${insp_v}" }
              as: Dispatcher
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/line-items"
              payload: { species_id: "${sp_reg_id}", line_type: "TRAP", quantity: 1, unit_price_cents: 4000 }
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/accept"
              payload: { assigned_technician_id: "${tech_id}" }
              as: PropertyOwner
              as_user_id: "${acct_id}"
              captures: { wo_id: $.data.id }
            - call: "GET /work-orders/${wo_id}/permits"
              payload: {}
              as: ComplianceOfficer
              captures: { permit_id: "$.data[0].id" }
          trigger:
            - call: "POST /permits/${permit_id}/approve"
              payload: { permit_number: "REG-2026-001" }
              as: ComplianceOfficer
          assert:
            - "Permit.${permit_id}.status == APPROVED"
            - "Property.${prop_id}.posture == ACTIVE_REMEDIATION"

      - name: permit_deny_cascade_cancels_work_order
        claim_type: Side Effect Execution
        grounds: [state_machines.Permit.REQUESTED_to_DENIED, entities.WorkOrder.fields.lifecycle, entities.Property.fields.posture]
        distinguishing_aspect: "Denying the permit cascades WorkOrder.lifecycle -> CANCELLED and Property.posture -> OPEN."
        test_recipe:
          setup: ["An OPEN work order for one regulated species whose single Permit is REQUESTED."]
          setup_api_calls:
            - call: "POST /service-accounts"
              payload: { account_name: "S5", contact_email: "s5@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /properties"
              payload: { account_id: "${acct_id}", latitude: 40.0, longitude: -75.0 }
              as: Dispatcher
              captures: { prop_id: $.data.id }
            - call: "POST /species-profiles"
              payload: { common_name: "Owl", code: "OWL_S5", is_regulated: true, relocation_min_miles: 5, relocation_max_miles: 25, base_trap_fee_cents: 4000, risk_weight: 2.0 }
              as: ComplianceOfficer
              captures: { sp_reg_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Ola", license_tier: "CERTIFIED", kit_trap_capacity: 5 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /properties/${prop_id}/inspections"
              payload: { scheduled_for: "2026-04-02T09:00:00Z" }
              as: Dispatcher
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/entry-points"
              payload: { species_id: "${sp_reg_id}", location_label: "loft", severity: "MAJOR", estimated_individuals: 2 }
              as: Dispatcher
            - call: "POST /properties/${prop_id}/inspections/${insp_id}/complete"
              payload: {}
              as: Dispatcher
              captures: { insp_v: $.data.version }
            - call: "POST /quotes"
              payload: { inspection_id: "${insp_id}", expected_inspection_version: "${insp_v}" }
              as: Dispatcher
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/line-items"
              payload: { species_id: "${sp_reg_id}", line_type: "TRAP", quantity: 1, unit_price_cents: 4000 }
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/accept"
              payload: { assigned_technician_id: "${tech_id}" }
              as: PropertyOwner
              as_user_id: "${acct_id}"
              captures: { wo_id: $.data.id }
            - call: "GET /work-orders/${wo_id}/permits"
              payload: {}
              as: ComplianceOfficer
              captures: { permit_id: "$.data[0].id" }
          trigger:
            - call: "POST /permits/${permit_id}/deny"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "Permit.${permit_id}.status == DENIED"
            - "WorkOrder.${wo_id}.lifecycle == CANCELLED"
            - "Property.${prop_id}.posture == OPEN"

      - name: trap_capture_from_spent_trap_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.TrapPlacement.SET_to_SPENT, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Recording a second capture on a trap already SPENT -> ERR_INVALID_STATE (409); no second CaptureEvent."
        test_recipe:
          setup: ["A trap already resolved to SPENT by a compliant capture on an OPEN work order."]
          setup_api_calls:
            - call: "POST /service-accounts"
              payload: { account_name: "S6", contact_email: "s6@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /properties"
              payload: { account_id: "${acct_id}", latitude: 40.0, longitude: -75.0 }
              as: Dispatcher
              captures: { prop_id: $.data.id }
            - call: "POST /species-profiles"
              payload: { common_name: "Hog", code: "HOG_S6", is_regulated: false, relocation_min_miles: 5, relocation_max_miles: 25, base_trap_fee_cents: 4000, risk_weight: 1.0 }
              as: ComplianceOfficer
              captures: { sp_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Hank", license_tier: "BASIC", kit_trap_capacity: 5 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /properties/${prop_id}/inspections"
              payload: { scheduled_for: "2026-04-02T09:00:00Z" }
              as: Dispatcher
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/entry-points"
              payload: { species_id: "${sp_id}", location_label: "gap", severity: "MINOR", estimated_individuals: 1 }
              as: Dispatcher
            - call: "POST /properties/${prop_id}/inspections/${insp_id}/complete"
              payload: {}
              as: Dispatcher
              captures: { insp_v: $.data.version }
            - call: "POST /quotes"
              payload: { inspection_id: "${insp_id}", expected_inspection_version: "${insp_v}" }
              as: Dispatcher
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/line-items"
              payload: { species_id: "${sp_id}", line_type: "TRAP", quantity: 1, unit_price_cents: 4000 }
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/accept"
              payload: { assigned_technician_id: "${tech_id}" }
              as: PropertyOwner
              as_user_id: "${acct_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/trap-placements"
              payload: { species_id: "${sp_id}", technician_id: "${tech_id}", window_start: "2026-04-03T09:00:00Z", window_end: "2026-04-03T10:00:00Z" }
              as: FieldTechnician
              as_user_id: "${tech_id}"
              captures: { trap1_id: $.data.id }
            - call: "POST /trap-placements/${trap1_id}/captures"
              payload: { captured_at: "2026-04-03T12:00:00Z", release_latitude: 40.145, release_longitude: -75.0 }
              as: FieldTechnician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /trap-placements/${trap1_id}/captures"
              payload: { captured_at: "2026-04-03T13:00:00Z", release_latitude: 40.145, release_longitude: -75.0 }
              as: FieldTechnician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "TrapPlacement.${trap1_id}.status == SPENT"

      - name: cancelled_inspection_terminal_lockdown_cannot_complete
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Inspection.DRAFT_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Completing a CANCELLED inspection -> ERR_INVALID_STATE (409); CANCELLED is terminal."
        test_recipe:
          setup: ["A CANCELLED inspection."]
          setup_api_calls:
            - call: "POST /service-accounts"
              payload: { account_name: "S7", contact_email: "s7@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /properties"
              payload: { account_id: "${acct_id}", latitude: 40.0, longitude: -75.0 }
              as: Dispatcher
