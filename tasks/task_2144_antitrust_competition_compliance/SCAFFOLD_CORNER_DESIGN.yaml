  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_business_unit_version_on_risk_assessment_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[risk-assessment-create-stale-business-unit]
          - errors[ERR_STALE_VERSION]
          - validations[priority=8]
        distinguishing_aspect: "Two strictly sequential creates: the first supersedes and bumps BusinessUnit.version, so the second — still carrying the version observed before the first — is refused with 412 ERR_STALE_VERSION and the ACTIVE assessment is unchanged."
        test_recipe:
          setup: ["One BusinessUnit whose version has been read once and stored."]
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
            - call: "POST /compliance/business-units"
              payload: { name: "Specialty Resins EMEA", market_code: "EU-RESIN", market_share_bps: 3000, interaction_point_count: 0, competitor_overlap_pct: 5 }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { bu_id: $.data.id }
            - call: "GET /compliance/business-units/${bu_id}"
              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { bu_v_stale: $.data.version }
          trigger:
            - call: "POST /compliance/risk-assessments"
              payload: { business_unit_id: "${bu_id}", variant: "BASELINE", expected_business_unit_version: "${bu_v_stale}" }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { ra_first_id: $.data.id }
            - call: "POST /compliance/risk-assessments"
              payload: { business_unit_id: "${bu_id}", variant: "INCIDENT_ADJUSTED", expected_business_unit_version: "${bu_v_stale}" }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "the first create returns HTTP 201 and RiskAssessment.${ra_first_id}.status == ACTIVE"
            - "the second create returns HTTP 412 with ${err_id} == 'ERR_STALE_VERSION'"
            - "RiskAssessment.${ra_first_id}.status is still ACTIVE"
            - "GET /compliance/risk-assessments?business_unit_id=${bu_id} returns total_count == 1"
            - "BusinessUnit.${bu_id}.risk_band == MODERATE"

      - name: occ_stale_transaction_version_on_hsr_analysis_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[hsr-analysis-create-stale-transaction]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "The SECOND OCC guard, on a different parent: an HsrAnalysis create carrying the transaction version observed before the first analysis is refused with 412 ERR_STALE_VERSION, and the transaction keeps the first analysis's determination."
        test_recipe:
          setup: ["One BusinessUnit and one DRAFT Transaction whose version has been captured at creation."]
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
            - call: "POST /compliance/business-units"
              payload: { name: "Specialty Resins EMEA", market_code: "EU-RESIN", market_share_bps: 1200, interaction_point_count: 4, competitor_overlap_pct: 25 }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { bu_id: $.data.id }
            - call: "POST /compliance/transactions"
              payload: { business_unit_id: "${bu_id}", target_name: "Kelmar Coatings BV", deal_value_cents: 11000000000, assumed_liabilities_cents: 100000000, market_valuation_cents: 13000000000, acquirer_total_assets_cents: 50000000000, target_total_assets_cents: 5000000000, signed_at: "2026-06-01T00:00:00Z", exemption_code: "NONE" }
              as: BusinessLead
              as_user_id: "${bu_id}"
              captures: { tx_id: $.data.id, tx_v_stale: $.data.version }
          trigger:
            - call: "POST /compliance/hsr-analyses"
              payload: { transaction_id: "${tx_id}", valuation_variant: "SIGNED_DEAL", expected_transaction_version: "${tx_v_stale}" }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { an_first_id: $.data.id }
            - call: "POST /compliance/hsr-analyses"
              payload: { transaction_id: "${tx_id}", valuation_variant: "MARKET_VALUE", expected_transaction_version: "${tx_v_stale}" }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "the first analysis returns HTTP 201 with determination BELOW_THRESHOLD"
            - "the second analysis returns HTTP 412 with ${err_id} == 'ERR_STALE_VERSION'"
            - "HsrAnalysis.${an_first_id}.status == ACTIVE"
            - "Transaction.${tx_id}.status == EXEMPT"
            - "GET /compliance/hsr-analyses?transaction_id=${tx_id} returns total_count == 1"

      - name: restricted_posture_blocks_new_participations_but_not_contact_logging
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.business_unit_posture
          - validations[priority=12]
          - errors[ERR_BUSINESS_UNIT_RESTRICTED]
        distinguishing_aspect: "At exposure_points of exactly 40.00 the posture is RESTRICTED (the comparison is >=): POST /compliance/participations returns 409 ERR_BUSINESS_UNIT_RESTRICTED while POST /compliance/competitor-contacts still succeeds, because self-reporting is never gated at RESTRICTED."
        test_recipe:
          setup:
            - "BusinessUnit with exposure_budget_points 200 adjusted to exactly 40.00 exposure points, so posture is RESTRICTED."
            - "One LEGAL employee and one APPROVED TIER_1_LOW association."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
            - call: "POST /compliance/business-units"
              payload: { name: "Specialty Resins EMEA", market_code: "EU-RESIN", market_share_bps: 1200, interaction_point_count: 4, competitor_overlap_pct: 25, exposure_budget_points: 200, review_minutes_budget: 480 }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { bu_id: $.data.id }
            - call: "POST /compliance/employees"
              payload: { business_unit_id: "${bu_id}", full_name: "Ines Vogel", email: "ines.vogel@example.com", role_category: "LEGAL" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { emp_id: $.data.id }
            - call: "POST /compliance/trade-associations"
              payload: { name: "Coatings Standards Group", approval_tier: "TIER_1_LOW", competitor_density_pct: 0 }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { assoc_id: $.data.id }
            - call: "POST /compliance/trade-associations/${assoc_id}/approval"
              payload: { decision: "APPROVED" }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
            - call: "GET /compliance/business-units/${bu_id}"
              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { bu_v1: $.data.version }
            - call: "POST /compliance/business-units/${bu_id}/exposure-adjustments"
              payload: { points_delta: 40, reason: "Legacy register migration", expected_business_unit_version: "${bu_v1}" }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
          trigger:
            - call: "POST /compliance/participations"
              payload: { business_unit_id: "${bu_id}", association_id: "${assoc_id}", employee_id: "${emp_id}", purpose: "Standards drafting delegate" }
              as: BusinessLead
              as_user_id: "${bu_id}"
              captures: { err_id: $.data.error_id }
            - call: "POST /compliance/competitor-contacts"
              payload: { business_unit_id: "${bu_id}", employee_id: "${emp_id}", competitor_name: "Rivex SA", contact_channel: "EMAIL", topic_tags: [], pricing_topic: false, occurred_at: "2026-07-20T10:00:00Z" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { c_id: $.data.id }
          assert:
            - "BusinessUnit.${bu_id}.exposure_points == 40.00 and posture == RESTRICTED"
            - "the participation call returns HTTP 409 with ${err_id} == 'ERR_BUSINESS_UNIT_RESTRICTED'"
            - "the contact-log call returns HTTP 201 and CompetitorContact.${c_id}.exposure_points_charged == 5.00"
            - "BusinessUnit.${bu_id}.exposure_points == 45.00 and posture is still RESTRICTED"
            - "GET /compliance/participations?business_unit_id=${bu_id} returns total_count == 0"

      - name: document_audit_findings_feed_the_incident_adjusted_variant
        claim_type: cascading_side_effects
        grounds:
          - state_machines.DocumentAudit.OPEN_to_COMPLETED
          - entities.BusinessUnit.fields.document_violation_count
          - calculations.market_risk_index
        distinguishing_aspect: "Completing an audit with violation_count 4 lifts BusinessUnit.document_violation_count to 4, which the very next INCIDENT_ADJUSTED assessment turns into an incident_load of 8 (index 46.00 -> 54.00, band MODERATE -> HIGH); the BASELINE variant taken afterwards ignores it entirely."
        test_recipe:
          setup: ["One BusinessUnit with market_share_bps 3000, interaction 0, overlap 5 and one OPEN DocumentAudit over 40 documents."]
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
