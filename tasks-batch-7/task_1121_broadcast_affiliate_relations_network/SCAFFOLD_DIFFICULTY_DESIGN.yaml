          assert:
            - "err == ERR_AVAIL_POOL_EXHAUSTED  # 4+6+1=11 > 10 (aggregate capacity)"

  # ==========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: avail_pool_conservation_under_revoke
        grounds:
          - calculations.avail_allocation_waterfall
          - state_machines.AvailAllocation.CLAIMED_to_REVOKED
        distinguishing_aspect: |
          Conserved quantity: avail_minutes_local_allocatable minus sum of
          CONFIRMED claims. Forward action: confirm claim -> remaining decreases.
          Compensating action: revoke the confirmed claim -> remaining returns
          to original. Test asserts pool_remaining unchanged after
          confirm-then-revoke cycle.
        test_recipe:
          setup:
            - "Network, Station, Territory, Agreement ACTIVE"
            - "Program with avail_minutes_local_allocatable=10"
            - "AvailAllocation AA1 = 4 min CLAIMED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /networks"
              payload: { call_sign: "PBN", primary_feed_tz: "America/New_York", reverse_comp_standard_pct: 0.40, retrans_share_standard_pct: 0.60 }
              as: PlatformAdmin
              captures: { net_id: $.data.id }
            - call: "POST /station-groups"
              payload: { group_name: "M", leverage_tier: "MID" }
              as: PlatformAdmin
              captures: { sg_id: $.data.id }
            - call: "POST /networks/${net_id}/stations"
              payload: { call_sign: "KPBN", dma_code: "DMA-001", station_group_id: "${sg_id}" }
              as: NetworkAffiliateRelations
              captures: { st_id: $.data.id }
            - call: "POST /networks/${net_id}/territories"
              payload: { dma_code: "DMA-001", protection_window_start_utc: "2026-05-01T00:00:00Z", protection_window_end_utc: "2026-06-30T00:00:00Z" }
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/programs"
              payload: { title: "S", scheduled_start_utc: "2026-06-01T20:00:00Z", scheduled_end_utc: "2026-06-01T21:00:00Z", avail_minutes_total: 20, avail_minutes_local_allocatable: 10, is_syndicated: false }
              as: NetworkAffiliateRelations
              captures: { prog_id: $.data.id }
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements"
              payload: { term_start_utc: "2026-01-01T00:00:00Z", term_end_utc: "2027-01-01T00:00:00Z", reverse_comp_pct: 0.40, retrans_share_pct: 0.60, clearance_obligation_hours: 100 }
              as: NetworkAffiliateRelations
              captures: { ag_id: $.data.id }
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/submit"
              payload: {}
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/activate"
              payload: {}
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/avail-allocations"
              payload: { program_id: "${prog_id}", period_index: 0, local_minutes_claimed: 4, claimed_revenue_cents: 100 }
              as: StationGroupOwner
              as_user_id: "${sg_id}"
              captures: { aa1: $.data.id }
          trigger:
            - call: "POST /networks/${net_id}/stations/${st_id}/avail-allocations/${aa1}/confirm"
              payload: {}
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/avail-allocations/${aa1}/revoke"
              payload: {}
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/avail-allocations"
              payload: { program_id: "${prog_id}", period_index: 0, local_minutes_claimed: 10, claimed_revenue_cents: 100 }
              as: StationGroupOwner
              as_user_id: "${sg_id}"
              captures: { aa2: $.data.id }
            - call: "POST /networks/${net_id}/stations/${st_id}/avail-allocations/${aa2}/confirm"
              payload: {}
              as: NetworkAffiliateRelations
              captures: { status: $.data.status }
          assert:
            - "status == CONFIRMED  # revocation freed pool; new claim of size 10 fits (10 <= 10)"
            - "invariant: sum(CONFIRMED claims) + confirmed pool consumed = avail_minutes_local_allocatable after each op"

      - name: retrans_settlement_commit_void_balance
        grounds:
          - state_machines.RetransSettlement.DRAFT_to_COMMITTED
          - state_machines.RetransSettlement.DRAFT_to_VOID
          - entities.StationGroup.fields.aggregate_retrans_cents
        distinguishing_aspect: |
          Conserved quantity: StationGroup.aggregate_retrans_cents. A DRAFT
          settlement that is VOIDed (rather than COMMITTED) must NOT mutate
          the aggregate. Forward action (commit) mutates aggregate; compensating
          path (void from DRAFT, never committed) leaves aggregate unchanged.
          Different conserved quantity from avail pool (cents vs minutes).
        test_recipe:
          setup:
            - "Network, StationGroup (MID), Station, Territory, Agreement ACTIVE"
            - "Initial aggregate_retrans_cents = 0"
            - "Two DRAFT settlements: RS1 (commit), RS2 (void)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /networks"
              payload: { call_sign: "PBN", primary_feed_tz: "America/New_York", reverse_comp_standard_pct: 0.40, retrans_share_standard_pct: 0.60 }
              as: PlatformAdmin
              captures: { net_id: $.data.id }
            - call: "POST /station-groups"
              payload: { group_name: "M", leverage_tier: "MID" }
              as: PlatformAdmin
              captures: { sg_id: $.data.id }
            - call: "POST /networks/${net_id}/stations"
              payload: { call_sign: "KPBN", dma_code: "DMA-001", station_group_id: "${sg_id}" }
              as: NetworkAffiliateRelations
              captures: { st_id: $.data.id, st_v: $.data.version }
            - call: "POST /networks/${net_id}/territories"
              payload: { dma_code: "DMA-001", protection_window_start_utc: "2026-05-01T00:00:00Z", protection_window_end_utc: "2026-06-30T00:00:00Z" }
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements"
              payload: { term_start_utc: "2026-01-01T00:00:00Z", term_end_utc: "2027-01-01T00:00:00Z", reverse_comp_pct: 0.40, retrans_share_pct: 0.60, clearance_obligation_hours: 100 }
              as: NetworkAffiliateRelations
              captures: { ag_id: $.data.id }
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/submit"
              payload: {}
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/activate"
              payload: {}
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/retrans-settlements"
              payload: { agreement_id: "${ag_id}", period_index: 0, gross_retrans_cents: 1000000 }
              as: NetworkAffiliateRelations
              captures: { rs1: $.data.id }
            - call: "POST /networks/${net_id}/stations/${st_id}/retrans-settlements"
              payload: { agreement_id: "${ag_id}", period_index: 0, gross_retrans_cents: 2000000 }
              as: NetworkAffiliateRelations
              captures: { rs2: $.data.id }
          trigger:
            - call: "POST /networks/${net_id}/stations/${st_id}/retrans-settlements/${rs2}/void"
              payload: {}
              as: NetworkAffiliateRelations
            - call: "GET /station-groups/${sg_id}"
              payload: {}
              as: NetworkAffiliateRelations
              captures: { agg_after_void: $.data.aggregate_retrans_cents }
            - call: "POST /networks/${net_id}/stations/${st_id}/retrans-settlements/${rs1}/commit"
              payload: { expected_station_version: "${st_v}" }
              as: NetworkAffiliateRelations
            - call: "GET /station-groups/${sg_id}"
              payload: {}
              as: NetworkAffiliateRelations
              captures: { agg_after_commit: $.data.aggregate_retrans_cents }
          assert:
            - "agg_after_void == 0  # VOID from DRAFT leaves aggregate untouched"
            - "agg_after_commit == 1000000  # COMMIT adds net_retrans_cents (= 1000000 - 0 credits)"
