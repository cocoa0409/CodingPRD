scenario: |
  Educational & Student-Travel Operator (EF style): tour & departure, enrollment &
  payment plan, chaperone-ratio & free-spot, permission/medical & passport, insurance
  & cancellation, group-leader portal, supplier & rooming, refund/rebook

domain_name: student-travel-ef
api_prefix: ""   # flat topology: every entity is a top-level collection; no shared nested prefix

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  # flat: Tour, Departure, GroupLeader, Enrollment, PaymentPlan, Payment,
  # PermissionForm, Chaperone, RoomingAssignment, Supplier, SupplierBooking are
  # all top-level collections linked by FK fields (no nesting in URL paths).
  state_machine_shape: parallel
  # Enrollment carries two independent axes (lifecycle_status x payment_status);
  # PermissionForm is cyclic (CHANGES_REQUESTED -> SUBMITTED revision loop).
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  # Operator (opaque operator staff), GroupLeader (owns its Departures),
  # Traveler (acts on its own Enrollment). Non-overlapping resource ownership.
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Tour
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Marketing name of the tour product, e.g. 'Rome Classics'."
      - name: destination
        type: string
        source: input
        description: "Primary destination country/city."
      - name: nights
        type: integer
        source: input
        description: "Number of nights on the itinerary."
        constraints: ">= 1"
      - name: base_price_cents
        type: integer
        source: input
        description: "Reference list price per traveler in cents; a Departure may override via price_per_traveler_cents."
        constraints: ">= 0"

  - name: GroupLeader
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Teacher / group organizer full name."
      - name: email
        type: string
        source: input
        description: "Contact email; unique per group leader."
      - name: school_name
        type: string
        source: input
        description: "School or institution the leader represents."
      - name: free_spot_credit_cents
        type: integer
        source: computed
        description: "Sum over this leader's Departures of that departure's FINAL free_spot_credit (calculations.free_spot_credit). Recomputed on every free_spot_earned change. Starts at 0."
        default: 0

  - name: Departure
    parent: null
    common_fields: true
    fields:
      - name: tour_id
        type: string
        source: input
        description: "FK -> Tour.id"
      - name: group_leader_id
        type: string
        source: input
        description: "FK -> GroupLeader.id; the leader who owns this departure's roster."
      - name: depart_date
        type: datetime
        source: input
        description: "UTC date/time the group departs (used as start of the travel interval)."
      - name: return_date
        type: datetime
        source: input
        description: "UTC date/time the group returns (end of the travel interval)."
      - name: enrollment_deadline
        type: datetime
        source: input
        description: "Last instant (UTC) at which a new Enrollment may be created against this departure."
      - name: early_bird_cutoff
        type: datetime
        source: input
        description: "Enrollments created at or before this instant receive the EARLY_BIRD_PCT discount (calculations.enrollment_price)."
      - name: capacity
        type: integer
        source: input
        description: "Total seats, shared by active travelers, earned free spots, and available seats (calculations.departure_seat_ledger)."
        constraints: ">= 1"
      - name: price_per_traveler_cents
        type: integer
        source: input
        description: "Gross price per traveler in cents for this departure."
        constraints: ">= 0"
      - name: min_to_guarantee
        type: integer
        source: input
        description: "Minimum active_enrollment_count required before the departure may be GUARANTEED."
        constraints: ">= 1"
      - name: chaperone_ratio
        type: integer
        source: input
        description: "Paying travelers per one free spot / required chaperone (calculations.free_spot_credit)."
        default: 6
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state."
        default: DRAFT
        constraints: "one of {DRAFT, OPEN, GUARANTEED, DEPARTED, CANCELLED}"
      - name: active_enrollment_count
        type: integer
        source: computed
        description: "count of Enrollment where departure_id == this.id AND lifecycle_status IN {PENDING, CONFIRMED, TRAVELING, COMPLETED} (i.e. NOT CANCELLED)."
        default: 0
      - name: paid_in_full_count
        type: integer
        source: computed
        description: "count of Enrollment where departure_id == this.id AND payment_status == PAID_IN_FULL AND lifecycle_status != CANCELLED."
        default: 0
      - name: free_spots_earned
        type: integer
        source: computed
        description: "Persisted FINAL free-spot count (calculations.free_spot_credit variant=final); recomputed on guarantee and on every paid_in_full or cancellation cascade. Starts at 0."
        default: 0
      - name: available_seats
        type: integer
        source: computed
        description: "capacity - active_enrollment_count - free_spots_earned (calculations.departure_seat_ledger)."

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: departure_id
        type: string
        source: input
        description: "FK -> Departure.id"
      - name: traveler_name
        type: string
        source: input
        description: "Full name of the enrolled student."
      - name: traveler_dob
        type: datetime
        source: input
        description: "Traveler date of birth (UTC midnight); used for rooming age-band checks (validations)."
      - name: traveler_gender
        type: enum
        source: input
        description: "Traveler gender for rooming grouping."
        constraints: "one of {MALE, FEMALE, NONBINARY}"
      - name: add_ons
        type: array
        source: input
        description: "Optional add-on codes each priced by ADDON_PRICES (calculations.enrollment_price)."
        default: []
        constraints: "each one of {SINGLE_ROOM, EXCURSION, STEM_LAB}"
      - name: insurance_opted
        type: boolean
        source: input
        description: "Whether the traveler purchased insurance; adds INSURANCE_PREMIUMS[insurance_tier] to price."
        default: false
      - name: insurance_tier
        type: enum
        source: input
        description: "Insurance tier when insurance_opted; PREMIUM grants cancel-for-any-reason (refund_pct forced to 1.00 in calculations.refund_amount)."
        default: null
        constraints: "one of {BASIC, PREMIUM} when insurance_opted else null"
      - name: price_locked_cents
        type: integer
        source: computed
        description: "Total price locked at creation by calculations.enrollment_price; input value (if any) ignored."
      - name: lifecycle_status
        type: enum
        source: system
        description: "Lifecycle axis (independent of payment_status)."
        default: PENDING
        constraints: "one of {PENDING, CONFIRMED, TRAVELING, COMPLETED, CANCELLED}"
      - name: payment_status
        type: enum
        source: system
        description: "Payment axis (independent of lifecycle_status)."
        default: UNPAID
        constraints: "one of {UNPAID, PARTIAL, PAID_IN_FULL, REFUNDED}"
      - name: doc_complete
        type: boolean
        source: computed
        description: "true iff this enrollment's PermissionForm exists and its status == APPROVED; else false."
        default: false
      - name: cancel_reason
        type: enum
        source: system
        description: "Why the enrollment was cancelled; null until cancelled."
        default: null
        constraints: "one of {TRAVELER_REQUEST, DEPARTURE_CANCELLED, REBOOK} or null"

  - name: PaymentPlan
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id"
      - name: total_cents
        type: integer
        source: computed
        description: "Equals the enrollment's price_locked_cents at plan creation."
      - name: deposit_cents
        type: integer
        source: input
        description: "Non-financed up-front amount; defaults to DEPOSIT_CENTS."
        default: 30000
      - name: installment_count
        type: integer
        source: input
        description: "Number of installments the financed remainder is split into (calculations.installment_split)."
        constraints: ">= 1"
      - name: installment_amounts
        type: array
        source: computed
        description: "Per-installment cents from calculations.installment_split; sum equals total_cents - deposit_cents (no drift)."
      - name: amount_paid_cents
        type: integer
        source: computed
        description: "sum of Payment.amount_cents for kind IN {DEPOSIT, INSTALLMENT} on this plan minus sum of kind == REFUND. Recomputed on each Payment."
        default: 0
      - name: amount_refunded_cents
        type: integer
        source: computed
        description: "sum of Payment.amount_cents for kind == REFUND on this plan."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Plan lifecycle."
        default: ACTIVE
        constraints: "one of {ACTIVE, PAID, REFUND_DUE, REFUNDED, SUPERSEDED}"

  - name: Payment
    parent: null
    common_fields: false
    fields:
      - name: payment_plan_id
        type: string
        source: input
        description: "FK -> PaymentPlan.id"
      - name: amount_cents
        type: integer
        source: input
        description: "Positive magnitude of the money movement in cents."
        constraints: "> 0"
      - name: kind
        type: enum
        source: input
        description: "Direction/purpose of the money movement."
        default: INSTALLMENT
        constraints: "one of {DEPOSIT, INSTALLMENT, REFUND, PENALTY_RETAINED}"
      - name: memo
        type: string
        source: input
        description: "Free-text note; optional."
        default: null

  - name: PermissionForm
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; at most one form per enrollment."
      - name: passport_number
        type: string
        source: input
        description: "Traveler passport number."
      - name: passport_expiry
        type: datetime
        source: input
        description: "Passport expiry date (UTC)."
      - name: guardian_consent
        type: boolean
        source: input
        description: "Whether a guardian signed consent; must be true to submit."
      - name: medical_notes
        type: string
        source: input
        description: "Medical notes / allergies."
        default: null
      - name: dietary
        type: string
        source: input
        description: "Dietary restrictions."
        default: null
      - name: status
        type: enum
        source: system
        description: "Cyclic review lifecycle."
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, CHANGES_REQUESTED, APPROVED}"

  - name: Chaperone
    parent: null
    common_fields: true
    fields:
      - name: departure_id
        type: string
        source: input
        description: "FK -> Departure.id"
      - name: full_name
        type: string
        source: input
        description: "Chaperone full name."
      - name: email
        type: string
        source: input
        description: "Chaperone email; identity used to detect the same person across departures for calculations/overlap checks."
      - name: role_type
        type: enum
        source: input
        description: "Whether the chaperone is a teaching lead or an accompanying adult."
        default: ADULT
        constraints: "one of {TEACHER, ADULT}"
      - name: status
        type: enum
        source: system
        description: "Chaperone confirmation state; created CONFIRMED."
        default: CONFIRMED
        constraints: "one of {CONFIRMED}"

  - name: RoomingAssignment
    parent: null
    common_fields: true
    fields:
      - name: departure_id
        type: string
        source: input
        description: "FK -> Departure.id"
      - name: room_label
        type: string
        source: input
        description: "Human label for the room, e.g. 'R-201'."
      - name: room_type
        type: enum
        source: input
        description: "Determines capacity: DOUBLE=2, TRIPLE=3, QUAD=4."
        constraints: "one of {DOUBLE, TRIPLE, QUAD}"
      - name: room_gender
        type: enum
        source: input
        description: "Gender band this room admits; every member Enrollment.traveler_gender must equal it (validations)."
        constraints: "one of {MALE, FEMALE, NONBINARY}"
      - name: capacity
        type: integer
        source: computed
        description: "2, 3, or 4 derived from room_type."
      - name: member_enrollment_ids
        type: array
        source: system
        description: "Ordered list of Enrollment ids assigned to this room; length must not exceed capacity."
        default: []
      - name: status
        type: enum
        source: system
        description: "DRAFT until finalized."
        default: DRAFT
        constraints: "one of {DRAFT, FINALIZED}"

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Supplier / vendor name."
      - name: service_type
        type: enum
        source: input
        description: "Kind of service supplied."
        constraints: "one of {HOTEL, BUS, GUIDE, FLIGHT}"
      - name: city
        type: string
        source: input
        description: "City the supplier serves."

  - name: SupplierBooking
    parent: null
    common_fields: true
    fields:
      - name: departure_id
        type: string
        source: input
        description: "FK -> Departure.id"
      - name: supplier_id
        type: string
        source: input
        description: "FK -> Supplier.id"
      - name: service_window_start
        type: datetime
        source: input
        description: "Start of the occupied service interval (UTC); interval is half-open [start, end)."
      - name: service_window_end
        type: datetime
        source: input
        description: "End of the occupied service interval (UTC), exclusive."
      - name: room_block
        type: integer
        source: input
        description: "Number of rooms/seats held from the supplier for this window."
        constraints: ">= 1"
      - name: cost_cents
        type: integer
        source: input
        description: "Total booking cost in cents."
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Booking lifecycle."
        default: HELD
        constraints: "one of {HELD, CONFIRMED, CANCELLED}"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Departure
    initial_state: DRAFT
    terminal_states: [DEPARTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /departures/{id}/open"
        actor: Operator
        preconditions:
          - "departure.group_leader_id references an existing GroupLeader"
          - "departure.capacity >= 1"
        side_effects:
          - "sets available_seats = capacity (active_enrollment_count and free_spots_earned are 0)"

      - from: OPEN
        to: GUARANTEED
        trigger: "POST /departures/{id}/guarantee"
        actor: Operator
        preconditions:
          - "active_enrollment_count >= min_to_guarantee"
          - "count of Chaperone where departure_id == this.id AND status == CONFIRMED >= ceil(active_enrollment_count / chaperone_ratio); else ERR_NOT_ENOUGH_CHAPERONES"
        side_effects:
          - "recompute free_spots_earned via calculations.free_spot_credit variant=final (paid_in_full_count // chaperone_ratio)"
          - "recompute available_seats via calculations.departure_seat_ledger"
          - "recompute GroupLeader.free_spot_credit_cents for departure.group_leader_id"

      - from: GUARANTEED
        to: DEPARTED
        trigger: "POST /departures/{id}/depart (Operator; precondition clock >= depart_date)"
        actor: Operator
        preconditions:
          - "logical clock (POST /_clock/set_current_utc) >= depart_date"
        side_effects:
          - "every Enrollment with lifecycle_status == CONFIRMED transitions CONFIRMED -> TRAVELING"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /departures/{id}/cancel"
        actor: Operator
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "no enrollments exist to cascade"

      - from: OPEN
        to: CANCELLED
        trigger: "POST /departures/{id}/cancel"
        actor: Operator
        preconditions:
          - "status == OPEN"
        side_effects:
          - "CASCADE (rule transitive_cascade depth-3): each Enrollment with lifecycle_status != CANCELLED transitions to CANCELLED with cancel_reason = DEPARTURE_CANCELLED"
          - "each such Enrollment's cancellation itself drives its ACTIVE/PAID PaymentPlan to REFUND_DUE"
          - "each such PaymentPlan being set REFUND_DUE itself appends a Payment(kind=REFUND, amount=amount_paid_cents) [operator cancellation => refund_pct forced 1.00, no penalty] then the plan settles to REFUNDED and enrollment.payment_status -> REFUNDED"
          - "recompute free_spots_earned, available_seats, and GroupLeader.free_spot_credit_cents"

      - from: GUARANTEED
        to: CANCELLED
        trigger: "POST /departures/{id}/cancel"
        actor: Operator
        preconditions:
          - "status == GUARANTEED"
        side_effects:
          - "identical cascade to OPEN -> CANCELLED (Enrollment -> PaymentPlan -> Payment(REFUND) full refund), then recompute derived seat/credit fields"

  - entity: Enrollment
    initial_state: PENDING
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      # --- lifecycle_status axis ---
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /enrollments/{id}/confirm"
        actor: GroupLeader
        preconditions:
          - "CROSS-ENTITY (rule cross_entity_state_dependency): departure.status IN {OPEN, GUARANTEED}; else ERR_DEPARTURE_NOT_OPEN"
          - "amount_paid_cents on the enrollment's ACTIVE PaymentPlan >= deposit_cents (deposit received)"
        side_effects:
          - "updated_at refreshed"

      - from: CONFIRMED
        to: TRAVELING
        trigger: "system: parent Departure GUARANTEED -> DEPARTED"
        actor: system
        preconditions:
          - "parent departure transitioning to DEPARTED"
        side_effects: []

      - from: TRAVELING
        to: COMPLETED
        trigger: "system: departure return processed via POST /departures/{id}/depart side effects at/after return_date"
        actor: system
        preconditions:
          - "clock >= departure.return_date"
        side_effects: []

      - from: PENDING
        to: CANCELLED
        trigger: "POST /enrollments/{id}/cancel"
        actor: Traveler
        preconditions:
          - "lifecycle_status == PENDING (else ERR_INVALID_STATE)"
        side_effects:
          - "CASCADE (rule transitive_cascade): enrollment cancellation drives its ACTIVE PaymentPlan -> REFUND_DUE"
          - "that PaymentPlan REFUND_DUE itself computes calculations.refund_amount (variant=final, tiered by days_before), appends Payment(kind=REFUND, refund_amount) and Payment(kind=PENALTY_RETAINED, penalty), then plan -> REFUNDED and enrollment.payment_status -> REFUNDED"
          - "set cancel_reason = TRAVELER_REQUEST"
          - "recompute departure.active_enrollment_count, free_spots_earned, available_seats and GroupLeader.free_spot_credit_cents"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /enrollments/{id}/cancel"
        actor: Traveler
        preconditions:
          - "lifecycle_status == CONFIRMED (else ERR_INVALID_STATE)"
        side_effects:
          - "identical refund cascade and derived-field recompute as PENDING -> CANCELLED"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /enrollments/{id}/rebook"
        actor: GroupLeader
        preconditions:
          - "target_departure_id references a Departure in status IN {OPEN, GUARANTEED} with available_seats >= 1; else ERR_REBOOK_TARGET_INVALID"
        side_effects:
          - "set cancel_reason = REBOOK; NO penalty (refund_pct effectively 1.00 for transferred funds)"
          - "create a NEW Enrollment on target_departure_id copying traveler fields, price re-locked via calculations.enrollment_price at target departure"
          - "transfer amount_paid_cents from old plan to a new ACTIVE PaymentPlan via Payment(kind=DEPOSIT/INSTALLMENT) mirrors; old plan -> REFUNDED with a Payment(kind=REFUND) equal to its amount_paid_cents"
          - "recompute derived seat/credit fields on BOTH departures"

      # --- payment_status axis (independent of lifecycle_status) ---
      - from: UNPAID
        to: PARTIAL
        trigger: "POST /payments (0 < new amount_paid_cents < total_cents)"
        actor: Traveler
        preconditions:
          - "an ACTIVE PaymentPlan exists for the enrollment"
        side_effects:
          - "recompute PaymentPlan.amount_paid_cents"

      - from: PARTIAL
        to: PAID_IN_FULL
        trigger: "POST /payments (amount_paid_cents >= total_cents)"
        actor: Traveler
        preconditions:
          - "an ACTIVE PaymentPlan exists"
        side_effects:
          - "PaymentPlan -> PAID"
          - "CASCADE (rule transitive_cascade depth-2): enrollment.payment_status flip to PAID_IN_FULL bumps departure.paid_in_full_count, which itself drives recompute of departure.free_spots_earned (calculations.free_spot_credit) and GroupLeader.free_spot_credit_cents"

      - from: UNPAID
        to: PAID_IN_FULL
        trigger: "POST /payments (single payment where amount_paid_cents >= total_cents)"
        actor: Traveler
        preconditions:
          - "an ACTIVE PaymentPlan exists"
        side_effects:
          - "PaymentPlan -> PAID; same paid_in_full cascade as PARTIAL -> PAID_IN_FULL"

      - from: PARTIAL
        to: REFUNDED
        trigger: "system: enrollment cancellation refund cascade"
        actor: system
        preconditions:
          - "enrollment.lifecycle_status transitioning to CANCELLED"
        side_effects:
          - "PaymentPlan -> REFUNDED"

      - from: PAID_IN_FULL
        to: REFUNDED
        trigger: "system: enrollment cancellation refund cascade"
        actor: system
        preconditions:
          - "enrollment.lifecycle_status transitioning to CANCELLED"
        side_effects:
          - "PaymentPlan -> REFUNDED"

  - entity: PaymentPlan
    initial_state: ACTIVE
    terminal_states: [REFUNDED, SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: PAID
        trigger: "system: amount_paid_cents >= total_cents"
        actor: system
        preconditions:
          - "amount_paid_cents >= total_cents"
        side_effects:
          - "enrollment.payment_status -> PAID_IN_FULL (bubble to paid_in_full cascade)"

      - from: ACTIVE
        to: REFUND_DUE
        trigger: "system: parent Enrollment cancellation"
        actor: system
        preconditions:
          - "enrollment transitioning to CANCELLED"
        side_effects:
          - "compute calculations.refund_amount; append Payment(kind=REFUND) and Payment(kind=PENALTY_RETAINED)"

      - from: PAID
        to: REFUND_DUE
        trigger: "system: parent Enrollment cancellation (fully paid case)"
        actor: system
        preconditions:
          - "enrollment transitioning to CANCELLED"
        side_effects:
          - "compute calculations.refund_amount; append Payment(kind=REFUND) and Payment(kind=PENALTY_RETAINED)"

      - from: REFUND_DUE
        to: REFUNDED
        trigger: "system: refund Payment persisted"
        actor: system
        preconditions:
          - "a Payment(kind=REFUND) exists for this plan"
        side_effects:
          - "enrollment.payment_status -> REFUNDED"

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /payment-plans (a newer ACTIVE plan created for the same enrollment)"
        actor: GroupLeader
        preconditions:
          - "a new PaymentPlan is created for the same enrollment_id with a matching expected_enrollment_version (OCC)"
        side_effects:
          - "this plan's amount_paid_cents carries forward to the new plan via mirrored Payment rows"

  - entity: PermissionForm
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /permission-forms/{id}/submit"
        actor: Traveler
        preconditions:
          - "guardian_consent == true"
          - "passport_number and passport_expiry present"
        side_effects:
          - "updated_at refreshed"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /permission-forms/{id}/review (decision=APPROVE)"
        actor: Operator
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "recompute enrollment.doc_complete -> true (derived-field reconciliation)"

      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /permission-forms/{id}/review (decision=REQUEST_CHANGES)"
        actor: Operator
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "enrollment.doc_complete stays false"

      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /permission-forms/{id}/submit (revision loop)"
        actor: Traveler
        preconditions:
          - "guardian_consent == true"
        side_effects:
          - "updated_at refreshed; CYCLE back to SUBMITTED"

  - entity: RoomingAssignment
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /rooming-assignments/{id}/finalize"
        actor: GroupLeader
        preconditions:
          - "1 <= len(member_enrollment_ids) <= capacity (else ERR_ROOM_FULL if over)"
          - "CROSS-ENTITY (rule cross_entity_state_dependency): every member Enrollment has an APPROVED PermissionForm (doc_complete == true); else ERR_DOCS_INCOMPLETE"
          - "every member Enrollment.traveler_gender == room_gender; else ERR_ROOMING_GENDER_MISMATCH"
        side_effects:
          - "status -> FINALIZED (members locked)"

  - entity: SupplierBooking
    initial_state: HELD
    terminal_states: [CONFIRMED, CANCELLED]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /supplier-bookings/{id}/confirm"
        actor: Operator
        preconditions:
          - "parent departure.status == GUARANTEED (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> CONFIRMED"

      - from: HELD
        to: CANCELLED
        trigger: "POST /supplier-bookings/{id}/cancel (Operator) — released back to supplier"
        actor: Operator
        preconditions:
          - "status == HELD"
        side_effects:
          - "the occupied [service_window_start, service_window_end) interval is released so future bookings on the supplier no longer conflict with it"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-enrollment
    parent_entity: Enrollment
    write_endpoint: "POST /payment-plans"
    occ_field: "expected_enrollment_version"
    description: |
      Creating a PaymentPlan against an Enrollment whose version has advanced
      since the client last observed it is rejected. A newly created plan
      legitimately supersedes the prior ACTIVE plan for that enrollment
      (PaymentPlan ACTIVE -> SUPERSEDED); a client whose expected_enrollment_version
      is stale has therefore not seen the supersede and is rejected with a
      precondition failure rather than silently creating a second competing plan.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: enrollment_price
    trigger: "POST /enrollments (price_locked_cents) and re-run on POST /enrollments/{id}/rebook against the target departure"
    algorithm: threshold
    formula: |
      gross = departure.price_per_traveler_cents
      early_bird_discount = round_half_up(gross * EARLY_BIRD_PCT) if clock <= departure.early_bird_cutoff else 0
      add_ons_total = sum(ADDON_PRICES[a] for a in enrollment.add_ons)      # 0 if empty
      insurance = INSURANCE_PREMIUMS[insurance_tier] if insurance_opted else 0
      price_locked_cents = gross - early_bird_discount + add_ons_total + insurance
    input_set: "single enrollment; clock position relative to early_bird_cutoff selects the discount branch"
    constants:
      EARLY_BIRD_PCT: 0.10
      ADDON_PRICES: { SINGLE_ROOM: 40000, EXCURSION: 12000, STEM_LAB: 8000 }
      INSURANCE_PREMIUMS: { BASIC: 9900, PREMIUM: 19900 }
    precision: "integer cents; round_half_up applied to the early_bird_discount term only"

  - name: installment_split
    trigger: "POST /payment-plans (installment_amounts)"
    algorithm: waterfall_allocation
    formula: |
      financed = total_cents - deposit_cents
      n = installment_count
      base_each = financed // n                      # integer floor
      remainder = financed - base_each * n           # 0 <= remainder < n
      # PINNED ORDER: floor every installment first, then allocate the remainder
      # cents one-per-installment to the EARLIEST installments (index 0..remainder-1).
      installment_amounts[i] = base_each + (1 if i < remainder else 0)
      # invariant: sum(installment_amounts) == financed exactly (no drift)
    input_set: "one PaymentPlan; financed = total_cents - deposit_cents"
    constants:
      DEPOSIT_CENTS: 30000
    precision: "integer cents; floor-then-distribute remainder to earliest installments (NOT round-each-then-sum)"

  - name: refund_amount
    trigger: "system: Enrollment PENDING/CONFIRMED -> CANCELLED (traveler request)"
    algorithm: tiered_pricing
    formula: |
      days_before = floor((departure.depart_date - clock) / 1 day)
      refund_pct =
        1.00 if days_before >= 90
        0.75 if 60 <= days_before < 90
        0.50 if 30 <= days_before < 60
        0.00 if days_before < 30
      if insurance_opted and insurance_tier == PREMIUM: refund_pct = 1.00   # cancel-for-any-reason
      refund_amount = round_half_up(refundable_base * refund_pct)
      penalty_retained = amount_paid_cents - min(refund_amount, amount_paid_cents)
      # money invariant (compensating_invariant): amount_paid_cents == refund_amount' + penalty_retained
      # where refund_amount' = min(refund_amount, amount_paid_cents)
    input_set: "one enrollment's ACTIVE/PAID plan; refundable_base selected by variant"
    constants:
      REFUND_PCT_90_PLUS: 1.00
      REFUND_PCT_60_89: 0.75
      REFUND_PCT_30_59: 0.50
      REFUND_PCT_UNDER_30: 0.00
    precision: "integer cents; round_half_up on refundable_base * refund_pct"
    variants:
      - name: provisional_estimate
        when: "quoted BEFORE the traveler confirms cancellation (what-if preview)"
        difference: "refundable_base = price_locked_cents (assumes the plan will be paid in full)"
      - name: final
        when: "applied on the actual PENDING/CONFIRMED -> CANCELLED transition"
        difference: "refundable_base = amount_paid_cents (actual money received); diverges from provisional whenever amount_paid_cents != price_locked_cents"

  - name: free_spot_credit
    trigger: "POST /departures/{id}/guarantee; and system recompute on any enrollment payment_status flip to/from PAID_IN_FULL or any enrollment cancellation"
    algorithm: threshold
    formula: |
      free_spots = paying_count // chaperone_ratio          # integer floor; boundary at exactly chaperone_ratio
      free_spot_credit_cents = free_spots * departure.price_per_traveler_cents
    input_set: "all Enrollments on the departure; paying_count selected by variant"
    constants:
      DEFAULT_CHAPERONE_RATIO: 6
    precision: "integer count and integer cents"
    variants:
      - name: provisional
        when: "displayed while the departure is still OPEN (forward-looking projection)"
        difference: "paying_count = count of Enrollment with lifecycle_status IN {PENDING, CONFIRMED} (all non-cancelled enrollees, assumed to pay)"
      - name: final
        when: "persisted into departure.free_spots_earned at guarantee and on paid/cancel recompute"
        difference: "paying_count = paid_in_full_count (only Enrollments with payment_status == PAID_IN_FULL); diverges from provisional whenever some enrollees have not fully paid"

  - name: departure_seat_ledger
    trigger: "any change to active_enrollment_count or free_spots_earned"
    algorithm: aggregation
    formula: |
      active_enrollment_count = count(Enrollment where departure_id == d.id AND lifecycle_status != CANCELLED)
      available_seats = capacity - active_enrollment_count - free_spots_earned
      # seat invariant (compensating_invariant): capacity == active_enrollment_count + free_spots_earned + available_seats
    input_set: "all non-CANCELLED Enrollments on the departure plus persisted free_spots_earned"
    constants: {}
    precision: "integer seats"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is one of {Operator, GroupLeader, Traveler}"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "acting role is permitted for the endpoint per RBAC; entity_backed roles additionally must own the resource (GroupLeader: departure.group_leader_id == X-User-ID; Traveler: enrollment.id == X-User-ID)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every path/body referenced resource exists, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
    description: "Concrete error_id is the entity-specific *_NOT_FOUND (see error catalog)."

  - priority: 4
    category: state
    check: "target resource is in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 5
    category: state
    check: "on POST /payments: the enrollment's plan is ACTIVE (not REFUNDED/SUPERSEDED/PAID)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /payments"

  - priority: 6
    category: business_safety
    check: "on rooming finalize: every member Enrollment has doc_complete == true"
    error_id: ERR_DOCS_INCOMPLETE
    http_status: 409
    applies_to: "POST /rooming-assignments/{id}/finalize"

  - priority: 7
    category: business_safety
    check: "on rooming member add / finalize: member Enrollment.traveler_gender == room_gender"
    error_id: ERR_ROOMING_GENDER_MISMATCH
    http_status: 422
    applies_to: "POST /rooming-assignments/{id}/members, POST /rooming-assignments/{id}/finalize"

  - priority: 8
    category: business_temporal
    check: "on POST /enrollments: clock <= departure.enrollment_deadline"
    error_id: ERR_ENROLLMENT_CLOSED
    http_status: 422
    applies_to: "POST /enrollments"

  - priority: 9
    category: business_temporal
    check: "on POST /supplier-bookings: [service_window_start, service_window_end) does not overlap any non-CANCELLED booking on the same supplier_id (half-open; adjacency allowed)"
    error_id: ERR_SUPPLIER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /supplier-bookings"

  - priority: 10
    category: business_temporal
    check: "on POST /chaperones: the same email is not already a CONFIRMED chaperone on another departure whose CLOSED travel interval [depart_date, return_date] lies within CHAPERONE_REST_BUFFER_DAYS (= 1) of this departure's interval; concretely reject when new.depart_date <= other.return_date + 1 day AND other.depart_date <= new.return_date + 1 day"
    error_id: ERR_CHAPERONE_UNAVAILABLE
    http_status: 409
    applies_to: "POST /chaperones"

  - priority: 11
    category: business_constraint
    check: "on rooming member add: len(member_enrollment_ids) < capacity"
    error_id: ERR_ROOM_FULL
    http_status: 409
    applies_to: "POST /rooming-assignments/{id}/members, POST /rooming-assignments/{id}/finalize"

  - priority: 12
    category: business_constraint
    check: "on POST /enrollments: departure.available_seats >= 1"
    error_id: ERR_DEPARTURE_FULL
    http_status: 409
    applies_to: "POST /enrollments"

  - priority: 13
    category: business_constraint
    check: "on guarantee: active_enrollment_count >= min_to_guarantee AND enough CONFIRMED chaperones"
    error_id: ERR_GUARANTEE_NOT_MET
    http_status: 409
    applies_to: "POST /departures/{id}/guarantee"

  - priority: 14
    category: business_fiscal
    check: "on POST /payments: amount_cents <= (total_cents - amount_paid_cents) [no overpayment]"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /payments"

  - priority: 15
    category: business_referential
    check: "OCC: expected_enrollment_version matches enrollment.version on POST /payment-plans"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /payment-plans"

