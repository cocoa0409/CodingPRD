# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3153_delivery_point_sequencing_route_adjustment_service_standards
#
# Depth probe. 9 rule_ids x 2 instances each = 18 instances. Every instance
# grounds in SCAFFOLD.yaml §1.1–§1.7 and carries a structured, replayable
# test_recipe. Shared fixtures are re-declared per instance (no YAML anchors
# across instances) so each recipe is self-contained.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: evaluation_street_time_actual_vs_disputed_floor
        grounds:
          - calculations.modeled_street_time
          - calculations.evaluated_daily_minutes
          - state_machines.RouteEvaluation.CONSULTATION_SCHEDULED_to_CONSULTED
        distinguishing_aspect: |
          Dual variant on the RouteEvaluation domain: identical count inputs
          produce evaluated_daily_minutes == 600 when the consultation outcome
          is CONCURRED (actual street time adopted) versus == 300 when the
          outcome is DISPUTED (min(actual=2160, modeled=358) floored). The
          variant is selected by consultation_outcome, not by input volumes.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Facility LAX (CONTIGUOUS) exists; unit DU1 (case slots 500) exists; regular carrier C1; route R1 (STANDARD, version 2 after evaluation creation) hosting an evaluation in DATA_COLLECTION."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/processing-facilities"
              payload: { facility_code: "LAX", facility_type: "P_AND_DC", region_class: "CONTIGUOUS", dispatch_cutoff_local: "17:00", operating_days: ["MON","TUE","WED","THU","FRI","SAT"] }
              as: ServiceStandardsAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /api/delivery-units"
              payload: { unit_code: "DU1", office_name: "Westside Station", delivery_office_facility_id: "${fac_id}", case_slot_count_per_route: 500 }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/carriers"
              payload: { employee_id: "E1234567", full_name: "Rita Cortez", carrier_class: "REGULAR" }
              as: Postmaster
              captures: { carrier_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/routes"
              payload: { route_code: "C012", assigned_carrier_id: "${carrier_id}", route_type: "CITY" }
              as: RouteSupervisor
              captures: { route_id: $.data.id, route_v1: $.data.version }
            - call: "POST /api/delivery-units/${unit_id}/routes/${route_id}/evaluations"
              payload: { evaluation_kind: "FULL_COUNT", count_week_start: "2026-09-19", expected_route_version: "${route_v1}" }
              as: RouteSupervisor
              captures: { eval_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/routes/${route_id}/evaluations/${eval_id}/begin-count"
              payload: {}
              as: RouteSupervisor
          trigger:
            - call: "POST /api/delivery-units/${unit_id}/routes/${route_id}/evaluations/${eval_id}/submit-counts"
              payload: { letters_count_total: 3600, flats_count_total: 900, parcels_count_total: 40, actual_street_minutes_total: 2160, office_minutes_total: 1440 }
              as: RouteSupervisor
            - call: "POST /api/delivery-units/${unit_id}/routes/${route_id}/evaluations/${eval_id}/record-consultation"
              payload: { consultation_outcome: "DISPUTED" }
              as: RouteSupervisor
          assert:
            - "RouteEvaluation.${eval_id}.modeled_street_minutes_total == 358"
            - "RouteEvaluation.${eval_id}.evaluated_daily_minutes == 300 (disputed variant: (1440 + min(2160, 358)) / 6 round-half-up)"
            - "RouteEvaluation.${eval_id}.consultation_outcome == DISPUTED"
            - "Re-running the same recipe in a fresh unit with consultation_outcome CONCURRED yields evaluated_daily_minutes == 600 (actual variant: (1440 + 2160) / 6) — identical inputs, divergent result across the two variants"

      - name: service_standard_contiguous_vs_non_contiguous
        grounds:
          - calculations.service_standard_delivery_date
          - entities.ServiceStandardQuery.fields.variant_used
        distinguishing_aspect: |
          Dual variant on the ServiceStandardQuery domain (different entity
          domain from RouteEvaluation): the same rule (service_days 2,
          extra 2, acceptance Tuesday 2026-09-01 before cutoff) commits
          2026-09-03 when both facilities are CONTIGUOUS versus 2026-09-08
          when the destination is NON_CONTIGUOUS, because the two Sunday/
          operating-day skips land differently once the extra days push the
          roll across a non-operating Sunday and Monday.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Origin facility LAX (CONTIGUOUS, Mon–Sat operating, cutoff 17:00); destination facility HNL (NON_CONTIGUOUS); rule FIRST_CLASS LAX→HNL service_days 2, non_contiguous_extra_days 2, effective_from 2026-01-01, no effective_to."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/processing-facilities"
              payload: { facility_code: "LAX", facility_type: "P_AND_DC", region_class: "CONTIGUOUS", dispatch_cutoff_local: "17:00", operating_days: ["MON","TUE","WED","THU","FRI","SAT"] }
              as: ServiceStandardsAdmin
              captures: { lax_id: $.data.id, lax_v: $.data.version }
            - call: "POST /api/processing-facilities"
              payload: { facility_code: "HNL", facility_type: "P_AND_DC", region_class: "NON_CONTIGUOUS", dispatch_cutoff_local: "16:00", operating_days: ["MON","TUE","WED","THU","FRI","SAT"] }
              as: ServiceStandardsAdmin
              captures: { hnl_id: $.data.id }
            - call: "POST /api/processing-facilities/${lax_id}/service-standard-rules"
              payload: { dest_facility_id: "${hnl_id}", mail_class: "FIRST_CLASS", service_days: 2, non_contiguous_extra_days: 2, effective_from: "2026-01-01", expected_facility_version: "${lax_v}" }
              as: ServiceStandardsAdmin
          trigger:
            - call: "POST /api/service-standard-queries"
              payload: { origin_facility_id: "${lax_id}", dest_facility_id: "${hnl_id}", mail_class: "FIRST_CLASS", acceptance_date: "2026-09-01", acceptance_time_local: "10:00" }
              as: ServiceStandardsAdmin
              captures: { q_id: $.data.id }
          assert:
            - "ServiceStandardQuery.${q_id}.variant_used == NON_CONTIGUOUS"
            - "ServiceStandardQuery.${q_id}.committed_service_days == 4"
            - "ServiceStandardQuery.${q_id}.committed_delivery_date == \"2026-09-08\""
            - "A control query with a CONTIGUOUS destination under an identical 2-day rule commits 2026-09-03 with variant_used == CONTIGUOUS — same acceptance tuple, different committed date per variant"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: modeled_street_time_tier_boundary_downturn
        grounds:
          - calculations.modeled_street_time
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with tiered non-linear interaction. A pure
          +1 flat increase that crosses the 6000-piece volume threshold flips
          the tier factor 1.00 → 0.97, so modeled street time DECREASES
          (435 → 422) despite strictly more mail — a monotone-reading
          implementation is wrong at the boundary.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two sibling units A and B each with one route whose evaluation sits in DATA_COLLECTION; unit A will count 5999 pieces (tier 0), unit B 6000 pieces (tier 1)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/processing-facilities"
              payload: { facility_code: "LAX", facility_type: "P_AND_DC", region_class: "CONTIGUOUS", dispatch_cutoff_local: "17:00", operating_days: ["MON","TUE","WED","THU","FRI","SAT"] }
              as: ServiceStandardsAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /api/delivery-units"
              payload: { unit_code: "DUA", office_name: "Alpha Station", delivery_office_facility_id: "${fac_id}", case_slot_count_per_route: 500 }
              as: PlatformAdmin
              captures: { unit_a: $.data.id }
            - call: "POST /api/delivery-units"
              payload: { unit_code: "DUB", office_name: "Beta Station", delivery_office_facility_id: "${fac_id}", case_slot_count_per_route: 500 }
              as: PlatformAdmin
              captures: { unit_b: $.data.id }
            - call: "POST /api/delivery-units/${unit_a}/carriers"
              payload: { employee_id: "E0000001", full_name: "Ana Reyes", carrier_class: "REGULAR" }
              as: Postmaster
              captures: { car_a: $.data.id }
            - call: "POST /api/delivery-units/${unit_b}/carriers"
              payload: { employee_id: "E0000002", full_name: "Ben Ortiz", carrier_class: "REGULAR" }
              as: Postmaster
              captures: { car_b: $.data.id }
            - call: "POST /api/delivery-units/${unit_a}/routes"
              payload: { route_code: "C001", assigned_carrier_id: "${car_a}", route_type: "CITY" }
              as: RouteSupervisor
              captures: { route_a: $.data.id, route_a_v: $.data.version }
            - call: "POST /api/delivery-units/${unit_b}/routes"
              payload: { route_code: "C001", assigned_carrier_id: "${car_b}", route_type: "CITY" }
              as: RouteSupervisor
              captures: { route_b: $.data.id, route_b_v: $.data.version }
            - call: "POST /api/delivery-units/${unit_a}/routes/${route_a}/evaluations"
              payload: { evaluation_kind: "MINI_SURVEY", count_week_start: "2026-09-19", expected_route_version: "${route_a_v}" }
              as: RouteSupervisor
              captures: { eval_a: $.data.id }
            - call: "POST /api/delivery-units/${unit_b}/routes/${route_b}/evaluations"
              payload: { evaluation_kind: "MINI_SURVEY", count_week_start: "2026-09-19", expected_route_version: "${route_b_v}" }
              as: RouteSupervisor
              captures: { eval_b: $.data.id }
            - call: "POST /api/delivery-units/${unit_a}/routes/${route_a}/evaluations/${eval_a}/begin-count"
              payload: {}
              as: RouteSupervisor
            - call: "POST /api/delivery-units/${unit_b}/routes/${route_b}/evaluations/${eval_b}/begin-count"
              payload: {}
              as: RouteSupervisor
          trigger:
            - call: "POST /api/delivery-units/${unit_a}/routes/${route_a}/evaluations/${eval_a}/submit-counts"
              payload: { letters_count_total: 5000, flats_count_total: 999, parcels_count_total: 40, actual_street_minutes_total: 1500, office_minutes_total: 1200 }
              as: RouteSupervisor
            - call: "POST /api/delivery-units/${unit_b}/routes/${route_b}/evaluations/${eval_b}/submit-counts"
              payload: { letters_count_total: 5000, flats_count_total: 1000, parcels_count_total: 40, actual_street_minutes_total: 1500, office_minutes_total: 1200 }
              as: RouteSupervisor
          assert:
            - "RouteEvaluation.${eval_a}.modeled_street_minutes_total == 435 (5999 pieces, tier 0, factor 1.00)"
            - "RouteEvaluation.${eval_b}.modeled_street_minutes_total == 422 (6000 pieces exactly, tier 1, factor 0.97)"
            - "modeled_street_minutes_total strictly decreases from eval_a to eval_b although the piece count strictly increases"

      - name: modeled_street_time_nested_rounding_order_pinned
        grounds:
          - calculations.modeled_street_time
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. With letters 3033,
          flats 901, parcels 40 (tier 0), the pinned per-step rounding
          (2dp half-up first, weighted sum, final integer round) yields 331;
          the alternative sum-then-round evaluation order yields 330. The
          scaffold's pinned order is the only acceptable answer.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One unit, one route, evaluation in DATA_COLLECTION awaiting counts."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/processing-facilities"
              payload: { facility_code: "LAX", facility_type: "P_AND_DC", region_class: "CONTIGUOUS", dispatch_cutoff_local: "17:00", operating_days: ["MON","TUE","WED","THU","FRI","SAT"] }
              as: ServiceStandardsAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /api/delivery-units"
              payload: { unit_code: "DUR", office_name: "Rounding Station", delivery_office_facility_id: "${fac_id}", case_slot_count_per_route: 500 }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/carriers"
              payload: { employee_id: "E0000010", full_name: "Cora Diaz", carrier_class: "REGULAR" }
              as: Postmaster
              captures: { car_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/routes"
              payload: { route_code: "C010", assigned_carrier_id: "${car_id}", route_type: "CITY" }
              as: RouteSupervisor
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /api/delivery-units/${unit_id}/routes/${route_id}/evaluations"
              payload: { evaluation_kind: "SPECIAL_INSPECTION", count_week_start: "2026-09-19", expected_route_version: "${route_v}" }
              as: RouteSupervisor
              captures: { eval_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/routes/${route_id}/evaluations/${eval_id}/begin-count"
              payload: {}
              as: RouteSupervisor
          trigger:
            - call: "POST /api/delivery-units/${unit_id}/routes/${route_id}/evaluations/${eval_id}/submit-counts"
              payload: { letters_count_total: 3033, flats_count_total: 901, parcels_count_total: 40, actual_street_minutes_total: 1000, office_minutes_total: 800 }
              as: RouteSupervisor
          assert:
            - "RouteEvaluation.${eval_id}.modeled_street_minutes_total == 331"
            - "The value differs from the sum-then-round alternative (330): casing 3033/18 rounds to 168.50 and pull-down 3934/70 rounds to 56.20 before the weighted sum; an implementation that defers rounding produces 330 and MUST fail"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: evaluation_recollection_cycle_fires_once
        grounds:
          - state_machines.RouteEvaluation.CONSULTED_to_DATA_COLLECTION
          - entities.RouteEvaluation.fields.recollection_used
          - errors.ERR_RECOLLECTION_EXHAUSTED
        distinguishing_aspect: |
          Cyclic machine on RouteEvaluation: CONSULTED → DATA_COLLECTION is a
          backward loop permitted exactly once when the outcome is DISPUTED
          (recollection_used flips true); a second loop attempt is rejected
          with ERR_RECOLLECTION_EXHAUSTED, and a loop attempt after CONCURRED
          is rejected for outcome rather than count.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One unit/route with an evaluation CONSULTED with outcome DISPUTED; recollection_used false."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/processing-facilities"
              payload: { facility_code: "LAX", facility_type: "P_AND_DC", region_class: "CONTIGUOUS", dispatch_cutoff_local: "17:00", operating_days: ["MON","TUE","WED","THU","FRI","SAT"] }
              as: ServiceStandardsAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /api/delivery-units"
              payload: { unit_code: "DUC", office_name: "Cycle Station", delivery_office_facility_id: "${fac_id}", case_slot_count_per_route: 500 }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/carriers"
              payload: { employee_id: "E0000100", full_name: "Dana Park", carrier_class: "REGULAR" }
              as: Postmaster
              captures: { car_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/routes"
              payload: { route_code: "C100", assigned_carrier_id: "${car_id}", route_type: "CITY" }
              as: RouteSupervisor
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /api/delivery-units/${unit_id}/routes/${route_id}/evaluations"
              payload: { evaluation_kind: "FULL_COUNT", count_week_start: "2026-09-19", expected_route_version: "${route_v}" }
              as: RouteSupervisor
              captures: { eval_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/routes/${route_id}/evaluations/${eval_id}/begin-count"
              payload: {}
              as: RouteSupervisor
            - call: "POST /api/delivery-units/${unit_id}/routes/${route_id}/evaluations/${eval_id}/submit-counts"
              payload: { letters_count_total: 3600, flats_count_total: 900, parcels_count_total: 40, actual_street_minutes_total: 2160, office_minutes_total: 1440 }
              as: RouteSupervisor
            - call: "POST /api/delivery-units/${unit_id}/routes/${route_id}/evaluations/${eval_id}/record-consultation"
              payload: { consultation_outcome: "DISPUTED" }
              as: RouteSupervisor
          trigger:
            - call: "POST /api/delivery-units/${unit_id}/routes/${route_id}/evaluations/${eval_id}/order-recollection"
              payload: {}
              as: Postmaster
            - call: "POST /api/delivery-units/${unit_id}/routes/${route_id}/evaluations/${eval_id}/submit-counts"
              payload: { letters_count_total: 3700, flats_count_total: 950, parcels_count_total: 42, actual_street_minutes_total: 2100, office_minutes_total: 1400 }
              as: RouteSupervisor
            - call: "POST /api/delivery-units/${unit_id}/routes/${route_id}/evaluations/${eval_id}/record-consultation"
              payload: { consultation_outcome: "DISPUTED" }
              as: RouteSupervisor
            - call: "POST /api/delivery-units/${unit_id}/routes/${route_id}/evaluations/${eval_id}/order-recollection"
              payload: {}
              as: Postmaster
              captures: { err2: $.data.error_id }
          assert:
            - "first order-recollection returns 200, status DATA_COLLECTION, recollection_used == true, and the count inputs are zeroed for re-entry"
            - "after re-collection and a second DISPUTED consultation the evaluation is CONSULTED again (cycle closed)"
            - "second order-recollection returns 409 with error_id == ERR_RECOLLECTION_EXHAUSTED (loop-count guard, not ERR_INVALID_STATE)"

      - name: coa_parallel_dimensions_evolve_independently
        grounds:
          - state_machines.ChangeOfAddress
          - entities.ChangeOfAddress.fields.forwarding_status
          - entities.ChangeOfAddress.fields.validation_status
        distinguishing_aspect: |
          Parallel state dimensions on one entity (different non-linear shape
          and different entity from the evaluation cycle): validation_status
          (UNVERIFIED → VERIFIED) and forwarding_status (PENDING → ACTIVE →
          SUSPENDED → ACTIVE) advance on separate triggers; verifying does not
          activate, and suspend/resume loops leave validation_status untouched.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Unit with one OCCUPIED point; a TEMPORARY COA filed begin 2026-09-01 end 2026-10-01, PENDING and UNVERIFIED."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/processing-facilities"
              payload: { facility_code: "LAX", facility_type: "P_AND_DC", region_class: "CONTIGUOUS", dispatch_cutoff_local: "17:00", operating_days: ["MON","TUE","WED","THU","FRI","SAT"] }
              as: ServiceStandardsAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /api/delivery-units"
              payload: { unit_code: "DUD", office_name: "Parallel Station", delivery_office_facility_id: "${fac_id}", case_slot_count_per_route: 500 }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/carriers"
              payload: { employee_id: "E0000200", full_name: "Eli Ford", carrier_class: "REGULAR" }
              as: Postmaster
              captures: { car_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/routes"
              payload: { route_code: "C200", assigned_carrier_id: "${car_id}", route_type: "CITY" }
              as: RouteSupervisor
              captures: { route_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/delivery-points"
              payload: { address_line1: "10 Rose Ave", city: "Culver City", state_code: "CA", zip11: "902300101001", point_kind: "RESIDENTIAL" }
              as: AddressManagementSpecialist
              captures: { point_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/delivery-points/${point_id}/activate"
              payload: { route_id: "${route_id}" }
              as: AddressManagementSpecialist
            - call: "POST /api/delivery-units/${unit_id}/coas"
              payload: { old_delivery_point_id: "${point_id}", new_address_line1: "99 Palm St", new_city: "Tucson", new_state_code: "AZ", new_zip11: "857010001001", move_kind: "FAMILY", move_type: "TEMPORARY", begin_date: "2026-09-01", end_date: "2026-10-01" }
              as: CustomerServiceRep
              captures: { coa_id: $.data.id }
          trigger:
            - call: "POST /api/delivery-units/${unit_id}/coas/${coa_id}/activate-now"
              payload: {}
              as: CustomerServiceRep
              captures: { err1: $.data.error_id }
            - call: "POST /api/delivery-units/${unit_id}/coas/${coa_id}/verify"
              payload: {}
              as: CustomerServiceRep
            - call: "POST /api/delivery-units/${unit_id}/coas/${coa_id}/activate-now"
              payload: {}
              as: CustomerServiceRep
            - call: "POST /api/delivery-units/${unit_id}/coas/${coa_id}/suspend"
              payload: {}
              as: CustomerServiceRep
            - call: "POST /api/delivery-units/${unit_id}/coas/${coa_id}/resume"
              payload: {}
              as: CustomerServiceRep
          assert:
            - "activate-now while UNVERIFIED fails 409 ERR_CROSS_ENTITY_STATE: the forwarding axis is gated by the validation axis without merging them"
            - "after verify: validation_status == VERIFIED and forwarding_status still == PENDING (independent axes)"
            - "after activate-now: forwarding_status == ACTIVE, validation_status == VERIFIED"
            - "suspend then resume loop returns forwarding_status to ACTIVE while validation_status never leaves VERIFIED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: adjustment_effective_cascades_through_points_sequences_evaluation
        grounds:
          - state_machines.RouteAdjustment.APPROVED_to_EFFECTIVE
          - state_machines.CarrierRoute.UNDER_ADJUSTMENT_to_STANDARD
          - calculations.renumber_cascade_order
        distinguishing_aspect: |
          Depth-4 cascade from the clock transition APPROVED → EFFECTIVE:
          adjustment fires route A (current_evaluated_minutes := 545, status →
          STANDARD), which moves the point's active_route_id to route B
          (recomputing both active_delivery_point_count values), which itself
          renumbers A's surviving sequence entries to a gapless 1..N and
          appends the moved point to B, which closes the parent evaluation
          CLOSED_ADOPTED. Each hop is caused by the previous hop.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Unit with routes A (C300) and B (C301), both STANDARD; points P1, P2 activated onto A; an evaluation on A CONSULTED (CONCURRED); an APPROVED adjustment (proposed 545, transfer P2→B, effective_date 2026-09-08)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/processing-facilities"
              payload: { facility_code: "LAX", facility_type: "P_AND_DC", region_class: "CONTIGUOUS", dispatch_cutoff_local: "17:00", operating_days: ["MON","TUE","WED","THU","FRI","SAT"] }
              as: ServiceStandardsAdmin
              captures: { fac_id: $.data.id }
