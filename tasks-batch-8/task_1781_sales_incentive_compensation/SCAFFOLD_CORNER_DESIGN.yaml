            - { call: "POST /reps", payload: { program_id: "${ppu}", name: "Rep PU", employee_ref: "PU-R1" }, as: CompAdmin, captures: { rpu: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${ppu}", rep_id: "${rpu}", plan_id: "${plan_pu}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_pu: $.data.id } }
