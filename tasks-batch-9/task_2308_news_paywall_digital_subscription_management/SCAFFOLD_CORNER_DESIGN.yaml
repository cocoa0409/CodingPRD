              as: SubscriptionOpsAgent
              captures: { sub_bk1: "$.data.id" }
            - call: "GET /paywall/subscriptions/${sub_bk1}/invoices"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { inv_bk1: "$.data[0].id" }
            - call: "POST /paywall/invoices/${inv_bk1}/payment-attempts"
              payload: { outcome: "SUCCEEDED", amount_cents: 499 }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/readers"
              payload: { email: "bulk2@mail.test", is_registered: true }
              as: SubscriptionOpsAgent
              captures: { rd_bk2: "$.data.id" }
            - call: "GET /paywall/offer-plans/${plan_bk}"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { plan_bk_v2: "$.data.version" }
            - call: "POST /paywall/subscriptions"
              payload: { reader_id: "${rd_bk2}", offer_plan_id: "${plan_bk}", expected_offer_plan_version: "${plan_bk_v2}" }
              as: SubscriptionOpsAgent
              captures: { sub_bk2: "$.data.id" }
            - call: "GET /paywall/subscriptions/${sub_bk2}/invoices"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { inv_bk2: "$.data[0].id" }
            - call: "POST /paywall/invoices/${inv_bk2}/payment-attempts"
              payload: { outcome: "SUCCEEDED", amount_cents: 499 }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: SubscriptionOpsAgent
          trigger:
            - call: "POST /paywall/billing-runs"
              payload: { scope: "FULL" }
              as: SubscriptionOpsAgent
              captures: { run_bk: "$.data.run_id", run_bk_scope: "$.data.scope" }
          assert:
            - "the response status is 200 with scope == FULL"
            - "invoices_created has length 2 and contains one new invoice for ${sub_bk1} and one for ${sub_bk2}"
            - "readers_rescored has length 2 and contains ${rd_bk1} and ${rd_bk2}"
            - "holds_activated, holds_completed, subscriptions_paused, subscriptions_resumed, cancellations_completed, seats_expired, subscriptions_cancelled_nonpay and cards_updated are all empty arrays"
            - "Subscription.${sub_bk1}.cycle_index == 2 and Subscription.${sub_bk2}.cycle_index == 2"
            - "Reader.${rd_bk1}.engagement_score == 0.00 and Reader.${rd_bk1}.propensity_band == LOW"
            - "Reader.${rd_bk2}.propensity_band == LOW"

      - name: card_updater_sweep_only_touches_retrying_subscriptions
        claim_type: Conditional action
        grounds:
          - endpoints[POST /paywall/billing-runs]
          - calculations.dunning_retry_schedule.constants
        distinguishing_aspect: "The DUNNING sweep is doubly conditional: it fires only for an enrolled reader whose subscription is RETRYING with card_updater_status PENDING, extending card_exp_year by exactly CARD_UPDATER_EXTENSION_YEARS 3, while an equally enrolled reader with no failing subscription is left at NOT_APPLICABLE with an untouched expiry year."
        test_recipe:
          setup:
            - "Clock advanced to 2026-10-01T00:00:00Z with a DIGITAL_ONLY subscription in dunning: cycle-1 499 paid on 2026-09-01, cycle-2 invoice of 1499 created by a BILLING_ONLY run and soft-declined once, so dunning_status is RETRYING and card_updater_status is PENDING. A second enrolled reader holds no subscription."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/offer-plans"
              payload: { name: "Digital Updater", bundle_type: "DIGITAL_ONLY", intro_price_cents: 499, intro_cycles: 1, standard_price_cents: 1499, standard_from_cycle: 2, cycle_days: 30 }
              as: RevenueManager
              captures: { plan_cu: "$.data.id" }
            - call: "POST /paywall/offer-plans/${plan_cu}/activate"
              payload: {}
              as: RevenueManager
              captures: { plan_cu_v: "$.data.version" }
            - call: "POST /paywall/readers"
              payload: { email: "updater@mail.test", is_registered: true, card_last4: "4444", card_exp_month: 9, card_exp_year: 2026, card_updater_registered: true }
              as: SubscriptionOpsAgent
              captures: { rd_cu: "$.data.id" }
            - call: "POST /paywall/readers"
              payload: { email: "control@mail.test", is_registered: true, card_last4: "5555", card_exp_month: 9, card_exp_year: 2026, card_updater_registered: true }
              as: SubscriptionOpsAgent
              captures: { rd_cu_ctl: "$.data.id" }
            - call: "POST /paywall/subscriptions"
              payload: { reader_id: "${rd_cu}", offer_plan_id: "${plan_cu}", expected_offer_plan_version: "${plan_cu_v}" }
              as: SubscriptionOpsAgent
              captures: { sub_cu: "$.data.id" }
            - call: "GET /paywall/subscriptions/${sub_cu}/invoices"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { inv_cu1: "$.data[0].id" }
            - call: "POST /paywall/invoices/${inv_cu1}/payment-attempts"
              payload: { outcome: "SUCCEEDED", amount_cents: 499 }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/billing-runs"
              payload: { scope: "BILLING_ONLY" }
              as: SubscriptionOpsAgent
            - call: "GET /paywall/subscriptions/${sub_cu}/invoices"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { inv_cu2: "$.data[1].id" }
            - call: "POST /paywall/invoices/${inv_cu2}/payment-attempts"
              payload: { outcome: "SOFT_DECLINE", amount_cents: 1499, decline_code: "expired_card" }
