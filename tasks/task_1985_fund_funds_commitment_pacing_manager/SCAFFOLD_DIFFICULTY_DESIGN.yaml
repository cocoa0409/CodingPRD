              payload: {}
              as: Analyst
              as_user_id: "${ana2}"
              captures: { stress_fc: $.data.forecast_net_cash }
          assert:
            - "base forecast current quarter includes the 500,000 PENDING distribution inflow"
            - "stress forecast current quarter excludes the 500,000 distribution and scales expected calls by 1.15"
            - "stress_fc[0] < base_fc[0]"
            - "both responses return exactly 8 quarterly entries"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes: (a) non-linear interaction, (b) nested rounding order)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: fee_layering_tiered_rate_carry_and_wrapper
        grounds:
          - calculations.fee_layering
          - entities.FundVehicle.fields.mgmt_fee_rate_early
          - entities.FundVehicle.fields.mgmt_fee_rate_late
          - entities.ValuationReport.fields.total_fee_burden_pct
        distinguishing_aspect: |
          Mode (a): fee_layering combines >= 3 inputs (sized_amount, rate
          branch selected by quarters-since-vintage vs investment_period_years*4,
          carry max() branch on nav_gain vs hurdle_return, plus the wrapper
          layer) with conditional branches on entity state — the early/late
          rate switch and the zero-carry branch both exercised by the pinned
          fixture (vintage 2026 reported at 2026-Q3 => early rate; nav_gain
          500,000 < hurdle_return 600,000 => carry = 0).
        test_recipe:
          setup:
            - "Program opened, cash 20,000,000, buffer 1,000,000, posture NORMAL"
            - "EXECUTED commitment 10,000,000 fully called (one PAID call of 10,000,000)"
            - "Vehicle terms: early 0.02, late 0.01, investment_period_years 5, carry 0.20, hurdle 0.08, vintage 2026"
