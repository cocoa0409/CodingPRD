# =============================================================================
# task_1027_video_game_retro_store — SCAFFOLD (§1.0–§1.7)
# =============================================================================

scenario: |
  Video-Game & Retro Store: new/used trade-in & grading, pre-order/allocation,
  console repair/refurb, consignment, loyalty/store credit, tournament/event,
  rental, inventory.

domain_name: video-game-retro-store
api_prefix: "/"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by foreign keys (member_id, product_id, product_stock_id,
  # inventory_item_id, station_id). No deep URL nesting except reverse-reachability
  # sub-resources.

  state_machine_shape: parallel
  # PreOrder carries two independent dimensions (payment_status x allocation_status);
  # TradeIn is cyclic (OFFERED <-> DISPUTED); InventoryItem is cyclic
  # (AVAILABLE -> RENTED -> AVAILABLE via rental checkout/return).

  relationship_patterns:
    - one_to_many          # Member -> PreOrder/TradeIn/Rental; Product -> ProductStock/InventoryItem
    - cross_aggregate      # Allocation couples PreOrder <-> ProductStock; Sale line -> InventoryItem

  role_model: hierarchical_override
  # Manager > Clerk (operational superset); Member is entity-backed and acts on
  # its own resources only.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Member display name" }
      - { name: email, type: string, source: input, description: "Contact email; unique" }
      - { name: tier, type: enum, source: input, default: STANDARD, description: "Loyalty tier", constraints: "one of STANDARD, SILVER, GOLD" }
      - { name: store_credit_balance_cents, type: integer, source: computed, default: 0, description: "Sum of all StoreCreditEntry.amount_cents for this member; never negative" }
      - { name: loyalty_points, type: integer, source: computed, default: 0, description: "Cumulative loyalty points earned from Sales; never negative" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Catalog title (game or console model)" }
      - { name: kind, type: enum, source: input, description: "Product kind", constraints: "one of GAME, CONSOLE, ACCESSORY" }
      - { name: base_price_cents, type: integer, source: input, description: "New/list retail price in cents; must be > 0" }
      - { name: base_trade_value_cents, type: integer, source: input, description: "Grade-A trade-in base value in cents; must be >= 0" }
      - { name: daily_rental_rate_cents, type: integer, source: input, default: 0, description: "Per-day rental rate in cents; must be >= 0" }

  - name: ProductStock
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the product this pre-order allocation pool covers" }
      - { name: unit_price_cents, type: integer, source: input, description: "Full pre-order price per unit in cents; must be > 0" }
      - { name: deposit_cents, type: integer, source: input, description: "Deposit required to reserve a pre-order in cents; 0 < deposit_cents <= unit_price_cents" }
      - { name: total_count, type: integer, source: input, description: "Total physical units the pool will fulfill; must be > 0" }
      - { name: available_count, type: integer, source: computed, description: "Units not yet allocated or fulfilled; invariant available_count + allocated_count + fulfilled_count == total_count" }
      - { name: allocated_count, type: integer, source: computed, default: 0, description: "Units currently held by ALLOCATED pre-orders" }
      - { name: fulfilled_count, type: integer, source: computed, default: 0, description: "Units consumed by FULFILLED pre-orders" }
      - { name: release_state, type: enum, source: system, default: EMBARGOED, description: "Allocation gate", constraints: "one of EMBARGOED, RELEASED" }

  - name: InventoryItem
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the catalog product this physical unit is an instance of" }
      - { name: condition_grade, type: enum, source: input, description: "Physical grade", constraints: "one of A, B, C, D" }
      - { name: acquisition_cost_cents, type: integer, source: input, default: 0, description: "Cost paid to acquire the unit in cents; must be >= 0" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "Physical-possession status; a reservation does NOT change it (multiple future rentals may be booked). AVAILABLE until physically checked out.", constraints: "one of AVAILABLE, RENTED, SOLD" }

  - name: PreOrder
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the member holding this pre-order" }
      - { name: product_stock_id, type: string, source: input, description: "FK -> ProductStock.id; the allocation pool this pre-order draws from" }
      - { name: amount_paid_cents, type: integer, source: computed, default: 0, description: "Cumulative payments recorded via POST payments; never exceeds ProductStock.unit_price_cents" }
      - { name: payment_status, type: enum, source: system, default: UNPAID, description: "Payment dimension", constraints: "one of UNPAID, DEPOSIT_PAID, PAID_IN_FULL, REFUNDED" }
      - { name: allocation_status, type: enum, source: system, default: PENDING, description: "Allocation dimension", constraints: "one of PENDING, WAITLISTED, ALLOCATED, FULFILLED, RELEASED" }

  - name: Allocation
    parent: null
    common_fields: true
    fields:
      - { name: pre_order_id, type: string, source: system, description: "FK -> PreOrder.id; the pre-order this allocation grants a unit to" }
      - { name: product_stock_id, type: string, source: system, description: "FK -> ProductStock.id; the pool this unit is drawn from" }
      - { name: status, type: enum, source: system, default: HELD, description: "Allocation lifecycle", constraints: "one of HELD, CONSUMED, RELEASED" }

  - name: TradeIn
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the trading-in member" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the product being traded in" }
      - { name: stated_grade, type: enum, source: input, description: "Grade the member claims at intake", constraints: "one of A, B, C, D" }
      - { name: final_grade, type: enum, source: system, description: "Grade set by clerk at grading; null until first grade", constraints: "one of A, B, C, D" }
      - { name: payout_method, type: enum, source: input, description: "How the member is paid", constraints: "one of CASH, STORE_CREDIT" }
      - { name: provisional_value_cents, type: integer, source: computed, description: "Value quoted at intake from stated_grade and payout_method" }
      - { name: final_value_cents, type: integer, source: computed, description: "Value of the current offer from final_grade and payout_method; null until first grade" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "Trade-in lifecycle", constraints: "one of SUBMITTED, OFFERED, DISPUTED, SETTLED, VOIDED" }

  - name: Rental
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the renting member" }
      - { name: inventory_item_id, type: string, source: input, description: "FK -> InventoryItem.id; the specific physical unit rented" }
      - { name: start_at, type: datetime, source: input, description: "Reservation start instant (ISO 8601 UTC)" }
      - { name: due_at, type: datetime, source: input, description: "Scheduled return instant (ISO 8601 UTC); must be strictly after start_at" }
      - { name: daily_rate_cents, type: integer, source: system, description: "Snapshot of Product.daily_rental_rate_cents at reservation time" }
      - { name: planned_days, type: integer, source: computed, description: "ceil((due_at - start_at) / 24h); used for estimated_charge_cents" }
      - { name: returned_at, type: datetime, source: system, description: "Actual return instant; null until returned" }
      - { name: estimated_charge_cents, type: integer, source: computed, description: "daily_rate_cents * planned_days; pinned at checkout" }
      - { name: late_fee_cents, type: integer, source: computed, default: 0, description: "Late penalty computed at return; 0 until returned" }
      - { name: final_charge_cents, type: integer, source: computed, description: "estimated_charge_cents + late_fee_cents; pinned at return" }
      - { name: status, type: enum, source: system, default: RESERVED, description: "Rental lifecycle", constraints: "one of RESERVED, CHECKED_OUT, RETURNED" }

  - name: Sale
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the buying member (loyalty accrues here)" }
      - { name: lines, type: array, source: input, description: "Array of objects, each { inventory_item_id, unit_price_cents, qty }; qty must be >= 1" }
      - { name: redeem_store_credit_cents, type: integer, source: input, default: 0, description: "Store credit to apply to this sale in cents; must be >= 0" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum over lines of qty * unit_price_cents" }
      - { name: tax_total_cents, type: integer, source: computed, description: "Sum over lines of round_half_up(qty * unit_price_cents * TAX_RATE); per-line rounding" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents + tax_total_cents" }
      - { name: amount_due_cents, type: integer, source: computed, description: "total_cents - redeem_store_credit_cents (redemption capped at total_cents)" }
      - { name: loyalty_points_earned, type: integer, source: computed, description: "Points credited to the member for this sale" }

  - name: Station
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Station / play area name" }
      - { name: seat_capacity, type: integer, source: input, description: "Physical seats at the station; must be > 0" }

  - name: Tournament
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; the station this tournament occupies" }
      - { name: title, type: string, source: input, description: "Tournament title" }
      - { name: starts_at, type: datetime, source: input, description: "Tournament start instant (ISO 8601 UTC)" }
      - { name: ends_at, type: datetime, source: input, description: "Tournament end instant (ISO 8601 UTC); must be strictly after starts_at" }
      - { name: registration_opens_at, type: datetime, source: input, description: "Registration window open instant (ISO 8601 UTC)" }
      - { name: registration_closes_at, type: datetime, source: input, description: "Registration window close instant (ISO 8601 UTC); must be > registration_opens_at and <= starts_at" }
      - { name: max_participants, type: integer, source: input, description: "Registration capacity; must be > 0" }
      - { name: registered_count, type: integer, source: computed, default: 0, description: "Number of successful registrations; must never exceed max_participants" }
      - { name: registered_member_ids, type: array, source: system, description: "Ids of members already registered; enforces one registration per member" }

  - name: StoreCreditEntry
    parent: null
    common_fields: false   # append-only ledger event: carries only id and created_at
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; the member whose balance this entry adjusts" }
      - { name: amount_cents, type: integer, source: system, description: "Signed delta applied to the member's store_credit_balance_cents (may be negative)" }
      - { name: reason, type: enum, source: system, description: "Origin of the entry", constraints: "one of TRADE_IN_PAYOUT, TRADE_IN_VOID_REVERSAL, MANUAL_ADJUSTMENT, SALE_REDEMPTION, PREORDER_REFUND" }
      - { name: related_ref, type: string, source: system, description: "Id of the originating TradeIn, Sale, or PreOrder (or null for manual adjustments)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # --- ProductStock: embargo gate -------------------------------------------
  - entity: ProductStock
    field: release_state
    initial_state: EMBARGOED
    terminal_states: [RELEASED]
    transitions:
      - from: EMBARGOED
        to: RELEASED
        trigger: "POST /product-stocks/{id}/release"
        actor: Manager
        preconditions: ["ProductStock exists and is EMBARGOED"]
        side_effects:
          - "increments ProductStock.version by 1"
        note: "Only a RELEASED pool may grant ALLOCATED units; while EMBARGOED every new pre-order is WAITLISTED."

  # --- InventoryItem: physical unit lifecycle (cyclic via rental) ------------
  - entity: InventoryItem
    field: status
    initial_state: AVAILABLE
    terminal_states: [SOLD]
    transitions:
      - from: AVAILABLE
        to: RENTED
        trigger: "POST /rentals/{id}/checkout"
        actor: Clerk
        preconditions: ["owning Rental.status == RESERVED", "InventoryItem.status == AVAILABLE"]
        side_effects: ["Rental.status -> CHECKED_OUT; Rental.estimated_charge_cents pinned"]
      - from: RENTED
        to: AVAILABLE
        trigger: "POST /rentals/{id}/return"
        actor: Clerk
        preconditions: ["owning Rental.status == CHECKED_OUT"]
        side_effects: ["Rental.status -> RETURNED; Rental.late_fee_cents and final_charge_cents pinned"]
      - from: AVAILABLE
        to: SOLD
        trigger: "POST /sales"
        actor: Clerk
        preconditions: ["InventoryItem.status == AVAILABLE for every line item"]
        side_effects: ["line item marked SOLD"]

  # --- PreOrder: allocation dimension (parallel with payment dimension) ------
  - entity: PreOrder
    field: allocation_status
    initial_state: PENDING
    terminal_states: [FULFILLED, RELEASED]
    transitions:
      - from: PENDING
        to: ALLOCATED
        trigger: "POST /pre-orders (create-time resolution)"
        actor: system
        preconditions:
          - "referenced ProductStock.release_state == RELEASED"
          - "ProductStock.available_count >= 1"
        side_effects:
          - "Allocation created in HELD"
          - "ProductStock.available_count decremented by 1; ProductStock.allocated_count incremented by 1"
          - "increments ProductStock.version by 1"
        note: "Cross-entity: PreOrder allocation depends on ProductStock state and count."
      - from: PENDING
        to: WAITLISTED
        trigger: "POST /pre-orders (create-time resolution)"
        actor: system
        preconditions:
          - "referenced ProductStock.release_state == EMBARGOED OR ProductStock.available_count == 0"
        side_effects:
          - "increments ProductStock.version by 1"
        note: "Empty-pool / embargo fallback: no unit granted, pre-order waits."
      - from: WAITLISTED
        to: ALLOCATED
        trigger: "system: waitlist promotion during POST /pre-orders/{id}/cancel of a holder"
        actor: system
        preconditions:
          - "a HELD Allocation was just released on the same ProductStock"
          - "this PreOrder is the promotion winner per allocation_promotion selector"
        side_effects:
          - "Allocation created in HELD for this PreOrder"
          - "ProductStock.available_count decremented by 1; ProductStock.allocated_count incremented by 1"
        note: "Hop 3 of the cancel cascade."
      - from: ALLOCATED
        to: FULFILLED
        trigger: "POST /pre-orders/{id}/fulfill"
        actor: Clerk
        preconditions:
          - "PreOrder.allocation_status == ALLOCATED"
          - "PreOrder.payment_status == PAID_IN_FULL"
        side_effects:
          - "owning Allocation.status -> CONSUMED"
          - "ProductStock.allocated_count decremented by 1; ProductStock.fulfilled_count incremented by 1"
      - from: ALLOCATED
        to: RELEASED
        trigger: "POST /pre-orders/{id}/cancel"
        actor: Member
        preconditions: ["PreOrder.allocation_status == ALLOCATED"]
        side_effects:
          - "owning Allocation.status -> RELEASED (hop 1)"
          - "ProductStock.allocated_count decremented by 1; ProductStock.available_count incremented by 1 (hop 1)"
          - "waitlist promotion runs: select promotion winner and re-allocate the freed unit (hop 2 -> hop 3)"
      - from: WAITLISTED
        to: RELEASED
        trigger: "POST /pre-orders/{id}/cancel"
        actor: Member
        preconditions: ["PreOrder.allocation_status == WAITLISTED"]
        side_effects: ["pre-order removed from the waitlist; no unit to release"]
      - from: PENDING
        to: RELEASED
        trigger: "POST /pre-orders/{id}/cancel"
        actor: Member
        preconditions: ["PreOrder.allocation_status == PENDING"]
        side_effects: ["pre-order cancelled before resolution"]

  # --- PreOrder: payment dimension (parallel with allocation dimension) ------
  - entity: PreOrder
    field: payment_status
    initial_state: UNPAID
    terminal_states: [REFUNDED]
    transitions:
      - from: UNPAID
        to: DEPOSIT_PAID
        trigger: "POST /pre-orders/{id}/payments"
        actor: Member
        preconditions:
          - "cumulative amount_paid_cents >= ProductStock.deposit_cents"
          - "cumulative amount_paid_cents < ProductStock.unit_price_cents"
        side_effects: ["PreOrder.amount_paid_cents increased by payment amount"]
      - from: UNPAID
        to: PAID_IN_FULL
        trigger: "POST /pre-orders/{id}/payments"
        actor: Member
        preconditions: ["cumulative amount_paid_cents >= ProductStock.unit_price_cents"]
        side_effects: ["PreOrder.amount_paid_cents increased by payment amount"]
      - from: DEPOSIT_PAID
        to: PAID_IN_FULL
        trigger: "POST /pre-orders/{id}/payments"
        actor: Member
        preconditions: ["cumulative amount_paid_cents >= ProductStock.unit_price_cents"]
        side_effects: ["PreOrder.amount_paid_cents increased by payment amount"]
      - from: UNPAID
        to: REFUNDED
        trigger: "POST /pre-orders/{id}/cancel"
        actor: Member
        preconditions: []
        side_effects: []
      - from: DEPOSIT_PAID
        to: REFUNDED
        trigger: "POST /pre-orders/{id}/cancel"
        actor: Member
        preconditions: []
        side_effects:
          - "StoreCreditEntry (reason PREORDER_REFUND, amount = +amount_paid_cents) created; Member.store_credit_balance_cents increased"
      - from: PAID_IN_FULL
        to: REFUNDED
        trigger: "POST /pre-orders/{id}/cancel"
        actor: Member
        preconditions: []
        side_effects:
          - "StoreCreditEntry (reason PREORDER_REFUND, amount = +amount_paid_cents) created; Member.store_credit_balance_cents increased"

  # --- TradeIn: cyclic grade/dispute loop -----------------------------------
  - entity: TradeIn
    field: status
    initial_state: SUBMITTED
    terminal_states: [SETTLED, VOIDED]
    transitions:
      - from: SUBMITTED
        to: OFFERED
        trigger: "POST /trade-ins/{id}/grade"
        actor: Clerk
        preconditions: ["TradeIn.status == SUBMITTED"]
        side_effects:
          - "TradeIn.final_grade set to graded value"
          - "TradeIn.final_value_cents recomputed from final_grade and payout_method (trade_in_value final variant)"
      - from: OFFERED
        to: DISPUTED
        trigger: "POST /trade-ins/{id}/dispute"
        actor: Member
        preconditions: ["TradeIn.status == OFFERED"]
        side_effects: []
      - from: DISPUTED
        to: OFFERED
        trigger: "POST /trade-ins/{id}/grade"
        actor: Clerk
        preconditions: ["TradeIn.status == DISPUTED"]
        side_effects:
          - "TradeIn.final_grade overwritten with re-graded value"
          - "TradeIn.final_value_cents recomputed (trade_in_value final variant)"
        note: "Cycle: OFFERED <-> DISPUTED via dispute then re-grade."
      - from: OFFERED
        to: SETTLED
        trigger: "POST /trade-ins/{id}/accept"
        actor: Member
        preconditions: ["TradeIn.status == OFFERED"]
        side_effects:
          - "if payout_method == STORE_CREDIT: StoreCreditEntry (reason TRADE_IN_PAYOUT, amount = +final_value_cents) created; Member.store_credit_balance_cents increased"
          - "if payout_method == CASH: no store-credit entry (cash disbursed out of band)"
      - from: SETTLED
        to: VOIDED
        trigger: "POST /trade-ins/{id}/void"
        actor: Manager
        preconditions: ["TradeIn.status == SETTLED"]
        side_effects:
          - "if the settlement created a TRADE_IN_PAYOUT entry: StoreCreditEntry (reason TRADE_IN_VOID_REVERSAL, amount = -final_value_cents) created (hop 1)"
          - "Member.store_credit_balance_cents recomputed from the ledger (hop 2)"
        note: "Compensating action: store-credit total returns to its pre-settlement value."

  # --- Rental: reserve -> checkout -> return --------------------------------
  - entity: Rental
    field: status
    initial_state: RESERVED
    terminal_states: [RETURNED]
    transitions:
      - from: RESERVED
        to: CHECKED_OUT
        trigger: "POST /rentals/{id}/checkout"
        actor: Clerk
        preconditions:
          - "Rental.status == RESERVED"
          - "InventoryItem.status == AVAILABLE for this rental's item"
        side_effects:
          - "InventoryItem.status AVAILABLE -> RENTED"
          - "Rental.estimated_charge_cents pinned = daily_rate_cents * planned_days (rental_charge estimated variant)"
      - from: CHECKED_OUT
        to: RETURNED
        trigger: "POST /rentals/{id}/return"
        actor: Clerk
        preconditions: ["Rental.status == CHECKED_OUT"]
        side_effects:
          - "Rental.returned_at set to current clock time"
          - "Rental.late_fee_cents pinned via rental_late_fee"
          - "Rental.final_charge_cents pinned = estimated_charge_cents + late_fee_cents (rental_charge final variant)"
          - "InventoryItem.status -> AVAILABLE"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: preorder-create-stale-stock
    parent_entity: ProductStock
    write_endpoint: "POST /pre-orders"
    occ_field: "expected_product_stock_version"
    description: |
      Creating a PreOrder against a ProductStock whose version has advanced
      since the client last observed it is rejected. Every successful pre-order
      creation resolves against the pool (granting a unit or waitlisting) and
      advances ProductStock.version, so a create still carrying the previously
      observed version is operating on a stale view of remaining availability
      and is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: trade_in_value
    trigger: "POST /trade-ins (provisional variant); POST /trade-ins/{id}/grade (final variant)"
    algorithm: weighted_scoring
    formula: |
      graded_cents = round_half_up(product.base_trade_value_cents * GRADE_MULTIPLIER[grade])
      if payout_method == STORE_CREDIT:
          value_cents = round_half_up(graded_cents * (1 + STORE_CREDIT_BONUS_PCT))
      else:   # CASH
          value_cents = graded_cents
    input_set: "Single TradeIn; grade is stated_grade (provisional) or final_grade (final)."
    constants:
      GRADE_MULTIPLIER: { A: 1.0, B: 0.75, C: 0.5, D: 0.25 }
      STORE_CREDIT_BONUS_PCT: 0.10
    precision: "integer cents, round_half_up at each round_half_up() call"
    variants:
      - name: provisional
        when: "at intake (POST /trade-ins); writes provisional_value_cents"
        difference: "uses stated_grade supplied by the member"
      - name: final
        when: "at grading (POST /trade-ins/{id}/grade); writes final_value_cents"
        difference: "uses final_grade set by the clerk; diverges from provisional whenever final_grade != stated_grade"

  - name: rental_charge
    trigger: "POST /rentals/{id}/checkout (estimated variant); POST /rentals/{id}/return (final variant)"
    algorithm: aggregation
    formula: |
      planned_days = ceil((due_at - start_at) / 24h)      # ceil of exact hours/24
      estimated_charge_cents = daily_rate_cents * planned_days
      final_charge_cents = estimated_charge_cents + late_fee_cents   # late_fee from rental_late_fee
    input_set: "Single Rental; daily_rate_cents is the snapshot taken at reservation."
    constants: {}
    precision: "integer cents; planned_days uses ceiling division on whole seconds"
    variants:
      - name: estimated
        when: "at checkout; pins estimated_charge_cents from planned_days"
        difference: "assumes on-time return; excludes any late fee"
      - name: final
        when: "at return; pins final_charge_cents"
        difference: "adds rental_late_fee for the actual returned_at; diverges from estimated whenever returned_at > due_at"

  - name: rental_late_fee
    trigger: "POST /rentals/{id}/return"
    algorithm: threshold
    formula: |
      if returned_at <= due_at:
          late_fee_cents = 0
      else:
          late_days = ceil((returned_at - due_at) / 24h)   # whole-second ceiling
          late_fee_cents = late_days * DAILY_LATE_FEE_CENTS
    input_set: "Single Rental; returned_at is the clock time at return."
    constants:
      DAILY_LATE_FEE_CENTS: 500
    precision: "integer cents; boundary is inclusive at due_at (exactly on time -> 0)"

  - name: sale_totals
    trigger: "POST /sales"
    algorithm: aggregation
    formula: |
      # Evaluation order is PINNED: tax is rounded PER LINE, then summed.
      subtotal_cents = sum(line.qty * line.unit_price_cents for line in lines)
      tax_total_cents = sum(round_half_up(line.qty * line.unit_price_cents * TAX_RATE) for line in lines)
      total_cents = subtotal_cents + tax_total_cents
      applied_credit_cents = min(redeem_store_credit_cents, total_cents)
      amount_due_cents = total_cents - applied_credit_cents
    input_set: "One Sale; every line's inventory_item must be AVAILABLE (validated before compute)."
    constants:
      TAX_RATE: 0.0725
    precision: "integer cents, round_half_up applied per line BEFORE summation (round-then-sum, not sum-then-round)"

  - name: loyalty_points_earned
    trigger: "POST /sales"
    algorithm: tiered_pricing
    formula: |
      # >=3 inputs (cash portion, tier, cap) with non-linear interaction.
      cash_portion_cents = total_cents - applied_credit_cents        # store-credit portion earns nothing
      raw_points = floor(cash_portion_cents / 100 * TIER_RATE[member.tier])
      loyalty_points_earned = min(raw_points, MAX_POINTS_PER_SALE)
    input_set: "One Sale; member.tier read from the buying member; applied_credit_cents from sale_totals."
    constants:
      TIER_RATE: { STANDARD: 1.0, SILVER: 1.5, GOLD: 2.0 }
      MAX_POINTS_PER_SALE: 5000
    precision: "integer points; floor after multiplying, then min-cap"

  - name: allocation_promotion
    trigger: "waitlist promotion inside POST /pre-orders/{id}/cancel of an ALLOCATED holder"
    algorithm: waterfall_allocation
    formula: |
      candidates = PreOrder where product_stock_id == freed.product_stock_id
                   and allocation_status == WAITLISTED
      rank by (TIER_RANK[member.tier] DESC, created_at ASC)
      tie_break: created_at ASC   # created_at is unique-enough; id is NEVER used
      winner = first candidate; if candidates empty -> no promotion (freed unit stays available)
    input_set: "WAITLISTED PreOrders on the same ProductStock; member.tier read per candidate."
    constants:
      TIER_RANK: { STANDARD: 1, SILVER: 2, GOLD: 3 }
    precision: "n/a — selection only; deterministic ranking with created_at tie-break"

  - name: store_credit_balance
    trigger: "any StoreCreditEntry creation (trade-in payout/void, sale redemption, pre-order refund, manual adjustment)"
    algorithm: aggregation
    formula: |
      Member.store_credit_balance_cents = sum(e.amount_cents for e in StoreCreditEntry
                                              where e.member_id == member.id)
    input_set: "All StoreCreditEntry rows for the member (append-only; entries are never mutated)."
    constants: {}
    precision: "integer cents; invariant balance == ledger sum after every mutation, including compensations"

  - name: stock_unit_conservation
    trigger: "any ProductStock count mutation (allocate, waitlist-promote, fulfill, cancel-release)"
    algorithm: aggregation
    formula: |
      invariant: available_count + allocated_count + fulfilled_count == total_count
      allocate:        available -=1 ; allocated +=1
      cancel-release:  allocated -=1 ; available +=1
      fulfill:         allocated -=1 ; fulfilled +=1
    input_set: "Single ProductStock; counts move between buckets, total_count is fixed."
    constants: {}
    precision: "integer counts; total_count never changes after creation"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is one of Member, Clerk, Manager"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-referenced resources exist (left-to-right); body FK references resolve"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path params or FK body fields"

  - priority: 4
    category: business_constraint
    check: "Request body conforms to the endpoint input schema (required fields present, enum members valid, numeric ranges, lines non-empty with qty>=1)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 5
    category: business_referential
    check: "A Member (entity_backed) may only act on resources whose member_id equals X-User-ID"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Member-initiated actions on PreOrder, TradeIn, Rental"

  - priority: 6
    category: state
    check: "Target resource is in a legal state for the requested transition (state-machine from-state)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all lifecycle-action endpoints"

  - priority: 7
    category: state
    check: "Every Sale line's InventoryItem is AVAILABLE; a rental checkout's InventoryItem is AVAILABLE"
    error_id: ERR_ITEM_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /sales, POST /rentals/{id}/checkout"

  - priority: 8
    category: state
    check: "Pre-order fulfill requires allocation_status == ALLOCATED and payment_status == PAID_IN_FULL"
    error_id: ERR_ALLOCATION_NOT_READY
    http_status: 409
    applies_to: "POST /pre-orders/{id}/fulfill"

  - priority: 9
    category: concurrency
    check: "expected_product_stock_version matches current ProductStock.version (OCC)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /pre-orders"

  - priority: 10
    category: business_temporal
    check: "New rental interval [start_at, due_at) does not collide with any active (RESERVED/CHECKED_OUT) rental on the same InventoryItem, applying a RENTAL_BUFFER_HOURS = 24 gap. Conflict iff (new.start_at < other.due_at + 24h) AND (other.start_at < new.due_at + 24h). Exactly buffer-apart is accepted."
    error_id: ERR_RENTAL_OVERLAP
    http_status: 409
    applies_to: "POST /rentals"

  - priority: 11
    category: business_temporal
    check: "New tournament interval [starts_at, ends_at) does not overlap an existing tournament on the same Station. Half-open intervals, NO buffer: conflict iff (new.starts_at < other.ends_at) AND (other.starts_at < new.ends_at). Exact adjacency (new.starts_at == other.ends_at) is accepted."
    error_id: ERR_STATION_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /tournaments"

  - priority: 12
    category: business_temporal
    check: "Current clock time is within [registration_opens_at, registration_closes_at) for the tournament"
    error_id: ERR_REGISTRATION_CLOSED
    http_status: 409
    applies_to: "POST /tournaments/{id}/register"

  - priority: 13
    category: business_constraint
    check: "Tournament has remaining capacity (registered_count < max_participants)"
    error_id: ERR_TOURNAMENT_FULL
    http_status: 409
    applies_to: "POST /tournaments/{id}/register"

  - priority: 14
    category: business_constraint
    check: "Member is not already registered for the tournament"
    error_id: ERR_ALREADY_REGISTERED
    http_status: 409
    applies_to: "POST /tournaments/{id}/register"

  - priority: 15
    category: business_constraint
    check: "At most one active (non-terminal: PENDING/WAITLISTED/ALLOCATED) PreOrder per (member_id, product_stock_id)"
    error_id: ERR_ONE_ACTIVE_PREORDER
    http_status: 409
    applies_to: "POST /pre-orders"

  - priority: 16
    category: business_fiscal
    check: "redeem_store_credit_cents <= Member.store_credit_balance_cents"
    error_id: ERR_INSUFFICIENT_STORE_CREDIT
    http_status: 402
    applies_to: "POST /sales"

  - priority: 17
    category: business_fiscal
    check: "Pre-order payment amount is positive and cumulative amount_paid_cents does not exceed ProductStock.unit_price_cents; first payment reaches at least deposit_cents"
    error_id: ERR_INSUFFICIENT_PAYMENT
    http_status: 402
    applies_to: "POST /pre-orders/{id}/payments"

# =============================================================================
# §1.5 API Endpoint Table (41 endpoints)
# =============================================================================
endpoints:
  # --- Test-driving clock ---------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-07-01T00:00:00Z; before any call here the clock reads exactly that default (never wall-clock)."
    roles: [Manager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601; drives rental late fees and registration windows"]

  # --- Member ---------------------------------------------------------------
  - method: POST
    path: "/members"
    description: "Create a member"
    roles: [Clerk, Manager]
    code: 201
    input: [full_name, email, "tier?"]
    output: Member
    side_effects: ["store_credit_balance_cents=0; loyalty_points=0; tier defaults to STANDARD"]

  - method: GET
    path: "/members/{id}"
    description: "Get a member"
    roles: [Member, Clerk, Manager]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: GET
    path: "/members/{id}/store-credit-entries"
    description: "List the member's store-credit ledger entries (reverse-reachability for StoreCreditEntry.member_id)"
    roles: [Member, Clerk, Manager]
    code: 200
    input: ["limit?", "offset?"]
    output: StoreCreditEntry[]
    side_effects: []

  - method: GET
    path: "/members/{id}/sales"
    description: "List the member's sales (reverse-reachability for Sale.member_id)"
    roles: [Member, Clerk, Manager]
    code: 200
    input: ["limit?", "offset?"]
    output: Sale[]
    side_effects: []

  - method: POST
    path: "/members/{id}/store-credit/adjustments"
    description: "Manager grants/deducts store credit; appends a MANUAL_ADJUSTMENT ledger entry"
    roles: [Manager]
    code: 201
    input: [amount_cents]
    output: StoreCreditEntry
    side_effects: ["StoreCreditEntry (reason MANUAL_ADJUSTMENT) created; Member.store_credit_balance_cents recomputed"]

  # --- Product --------------------------------------------------------------
  - method: POST
    path: "/products"
    description: "Create a catalog product"
    roles: [Clerk, Manager]
    code: 201
    input: [title, kind, base_price_cents, base_trade_value_cents, "daily_rental_rate_cents?"]
    output: Product
    side_effects: []

  - method: GET
    path: "/products/{id}"
    description: "Get a product"
    roles: [Member, Clerk, Manager]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: GET
    path: "/products/{id}/stocks"
    description: "List pre-order pools for a product (reverse-reachability for ProductStock.product_id)"
    roles: [Member, Clerk, Manager]
    code: 200
    input: ["limit?", "offset?"]
    output: ProductStock[]
    side_effects: []

  - method: GET
    path: "/products/{id}/inventory-items"
    description: "List physical units for a product (reverse-reachability for InventoryItem.product_id)"
    roles: [Member, Clerk, Manager]
    code: 200
    input: ["limit?", "offset?"]
    output: InventoryItem[]
    side_effects: []

  # --- ProductStock ---------------------------------------------------------
  - method: POST
    path: "/products/{id}/stocks"
    description: "Create a pre-order allocation pool for a product (starts EMBARGOED)"
    roles: [Manager]
    code: 201
    input: [unit_price_cents, deposit_cents, total_count]
    output: ProductStock
    side_effects: ["available_count=total_count; allocated_count=0; fulfilled_count=0; release_state=EMBARGOED"]

  - method: GET
    path: "/product-stocks/{id}"
    description: "Get a pre-order pool (exposes counts and version)"
    roles: [Member, Clerk, Manager]
    code: 200
    input: []
    output: ProductStock
    side_effects: []

  - method: POST
    path: "/product-stocks/{id}/release"
    description: "Release a pool from embargo so pre-orders can be ALLOCATED"
    roles: [Manager]
    code: 200
    input: []
    output: ProductStock
    side_effects: ["release_state EMBARGOED -> RELEASED", "increments ProductStock.version by 1"]

  - method: GET
    path: "/product-stocks/{id}/allocations"
    description: "List allocations drawn from a pool (reverse-reachability for Allocation.product_stock_id)"
    roles: [Clerk, Manager]
    code: 200
    input: ["limit?", "offset?"]
    output: Allocation[]
    side_effects: []

  # --- InventoryItem --------------------------------------------------------
  - method: POST
    path: "/products/{id}/inventory-items"
    description: "Create a physical unit of a product (starts AVAILABLE)"
    roles: [Clerk, Manager]
    code: 201
    input: [condition_grade, "acquisition_cost_cents?"]
    output: InventoryItem
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/inventory-items/{id}"
    description: "Get a physical unit"
    roles: [Member, Clerk, Manager]
    code: 200
    input: []
    output: InventoryItem
    side_effects: []

  # --- PreOrder -------------------------------------------------------------
  - method: POST
    path: "/pre-orders"
    description: "Create a pre-order; resolves to ALLOCATED (if pool RELEASED and available) or WAITLISTED. OCC-guarded on the pool version."
    roles: [Member, Clerk, Manager]
    code: 201
    input: [member_id, product_stock_id, expected_product_stock_version]
    output: PreOrder
    side_effects:
      - "allocation_status resolved to ALLOCATED or WAITLISTED (see §1.2)"
      - "on ALLOCATED: Allocation created HELD; ProductStock available_count-- / allocated_count++"
      - "increments ProductStock.version by 1"
      - "enforces one active pre-order per (member_id, product_stock_id)"

  - method: GET
    path: "/pre-orders/{id}"
    description: "Get a pre-order (exposes both status dimensions)"
    roles: [Member, Clerk, Manager]
    code: 200
    input: []
    output: PreOrder
    side_effects: []

  - method: GET
    path: "/pre-orders"
    description: "List pre-orders filtered by member or pool (reverse-reachability for PreOrder.member_id and PreOrder.product_stock_id)"
    roles: [Member, Clerk, Manager]
    code: 200
    input: ["member_id?", "product_stock_id?", "limit?", "offset?"]
    output: PreOrder[]
    side_effects: []

  - method: GET
    path: "/pre-orders/{id}/allocations"
    description: "List allocations held by a pre-order (reverse-reachability for Allocation.pre_order_id)"
    roles: [Member, Clerk, Manager]
    code: 200
    input: ["limit?", "offset?"]
    output: Allocation[]
    side_effects: []

  - method: POST
    path: "/pre-orders/{id}/payments"
    description: "Record a payment toward a pre-order; advances payment_status"
    roles: [Member, Clerk, Manager]
    code: 200
    input: [amount_cents]
    output: PreOrder
    side_effects: ["amount_paid_cents += amount_cents; payment_status advances UNPAID -> DEPOSIT_PAID -> PAID_IN_FULL"]

  - method: POST
    path: "/pre-orders/{id}/fulfill"
    description: "Fulfill an allocated, fully-paid pre-order"
    roles: [Clerk, Manager]
    code: 200
    input: []
    output: PreOrder
    side_effects:
      - "allocation_status ALLOCATED -> FULFILLED; owning Allocation -> CONSUMED"
      - "ProductStock allocated_count-- / fulfilled_count++"

  - method: POST
    path: "/pre-orders/{id}/cancel"
    description: "Cancel a pre-order; releases any held unit (triggering waitlist promotion) and refunds paid amount as store credit"
    roles: [Member, Clerk, Manager]
    code: 200
    input: []
    output: PreOrder
    side_effects:
      - "allocation_status -> RELEASED; payment_status -> REFUNDED"
      - "if ALLOCATED: owning Allocation -> RELEASED; ProductStock allocated_count-- / available_count++; then waitlist promotion (allocation_promotion) re-allocates the freed unit"
      - "if amount_paid_cents > 0: StoreCreditEntry (reason PREORDER_REFUND) created; Member balance recomputed"

  # --- TradeIn --------------------------------------------------------------
  - method: POST
    path: "/trade-ins"
    description: "Submit a trade-in; computes provisional_value_cents from stated_grade"
    roles: [Member, Clerk, Manager]
    code: 201
    input: [member_id, product_id, stated_grade, payout_method]
    output: TradeIn
    side_effects: ["status=SUBMITTED; provisional_value_cents pinned (trade_in_value provisional variant)"]

  - method: GET
    path: "/trade-ins/{id}"
    description: "Get a trade-in"
    roles: [Member, Clerk, Manager]
    code: 200
    input: []
    output: TradeIn
    side_effects: []

  - method: GET
    path: "/trade-ins"
    description: "List trade-ins filtered by member or product (reverse-reachability for TradeIn.member_id and TradeIn.product_id)"
    roles: [Member, Clerk, Manager]
    code: 200
    input: ["member_id?", "product_id?", "limit?", "offset?"]
    output: TradeIn[]
    side_effects: []

  - method: POST
    path: "/trade-ins/{id}/grade"
    description: "Clerk grades (or re-grades) a trade-in and makes an offer"
    roles: [Clerk, Manager]
    code: 200
    input: [final_grade]
    output: TradeIn
    side_effects: ["status SUBMITTED->OFFERED or DISPUTED->OFFERED; final_grade + final_value_cents pinned (final variant)"]

  - method: POST
    path: "/trade-ins/{id}/dispute"
    description: "Member disputes the current offer (sends it back for re-grading)"
    roles: [Member, Clerk, Manager]
    code: 200
    input: []
    output: TradeIn
    side_effects: ["status OFFERED -> DISPUTED"]

  - method: POST
    path: "/trade-ins/{id}/accept"
    description: "Member accepts the offer; settles the trade-in"
    roles: [Member, Clerk, Manager]
    code: 200
    input: []
    output: TradeIn
    side_effects:
      - "status OFFERED -> SETTLED"
      - "if payout_method == STORE_CREDIT: StoreCreditEntry (reason TRADE_IN_PAYOUT, +final_value_cents) created; Member balance recomputed"

  - method: POST
    path: "/trade-ins/{id}/void"
    description: "Manager voids a settled trade-in; reverses any store-credit payout"
    roles: [Manager]
    code: 200
    input: []
    output: TradeIn
    side_effects:
      - "status SETTLED -> VOIDED"
      - "if a TRADE_IN_PAYOUT entry exists: StoreCreditEntry (reason TRADE_IN_VOID_REVERSAL, -final_value_cents) created; Member balance recomputed"

  # --- Rental ---------------------------------------------------------------
  - method: POST
    path: "/rentals"
    description: "Reserve a rental of a specific inventory item over [start_at, due_at)"
    roles: [Member, Clerk, Manager]
    code: 201
    input: [member_id, inventory_item_id, start_at, due_at]
    output: Rental
    side_effects:
      - "status=RESERVED (books a future window; InventoryItem.status is NOT changed by a reservation)"
      - "daily_rate_cents snapshotted; planned_days computed"
      - "rejects if the interval + RENTAL_BUFFER_HOURS overlaps another active (RESERVED/CHECKED_OUT) rental on the item (ERR_RENTAL_OVERLAP)"

  - method: GET
    path: "/rentals/{id}"
    description: "Get a rental"
    roles: [Member, Clerk, Manager]
    code: 200
    input: []
    output: Rental
    side_effects: []

  - method: GET
    path: "/rentals"
    description: "List rentals filtered by member or item (reverse-reachability for Rental.member_id and Rental.inventory_item_id)"
    roles: [Member, Clerk, Manager]
    code: 200
    input: ["member_id?", "inventory_item_id?", "limit?", "offset?"]
    output: Rental[]
    side_effects: []

  - method: POST
    path: "/rentals/{id}/checkout"
    description: "Check out a reserved rental; pins the estimated charge"
    roles: [Clerk, Manager]
    code: 200
    input: []
    output: Rental
    side_effects: ["status RESERVED -> CHECKED_OUT; InventoryItem -> RENTED; estimated_charge_cents pinned"]

  - method: POST
    path: "/rentals/{id}/return"
    description: "Return a checked-out rental; computes late fee and final charge at the current clock time"
    roles: [Clerk, Manager]
    code: 200
    input: []
    output: Rental
    side_effects: ["status CHECKED_OUT -> RETURNED; returned_at=clock; late_fee_cents + final_charge_cents pinned; InventoryItem -> AVAILABLE"]

  # --- Sale -----------------------------------------------------------------
  - method: POST
    path: "/sales"
    description: "Ring up a point-of-sale sale of one or more inventory items; computes totals, redeems store credit, accrues loyalty points"
    roles: [Clerk, Manager]
    code: 201
    input: [member_id, lines, "redeem_store_credit_cents?"]
    output: Sale
    side_effects:
      - "each line's InventoryItem AVAILABLE -> SOLD"
      - "subtotal/tax/total/amount_due pinned (sale_totals)"
      - "loyalty_points_earned pinned and added to Member.loyalty_points"
      - "if redeem_store_credit_cents > 0: StoreCreditEntry (reason SALE_REDEMPTION, negative) created; Member balance recomputed"

  # --- Station --------------------------------------------------------------
  - method: POST
    path: "/stations"
    description: "Create a gaming station"
    roles: [Manager]
    code: 201
    input: [name, seat_capacity]
    output: Station
    side_effects: []

  # --- Tournament -----------------------------------------------------------
  - method: POST
    path: "/tournaments"
    description: "Schedule a tournament on a station; rejects if its interval overlaps another tournament on the same station"
    roles: [Clerk, Manager]
    code: 201
    input: [station_id, title, starts_at, ends_at, registration_opens_at, registration_closes_at, max_participants]
    output: Tournament
    side_effects: ["registered_count=0; registered_member_ids=[]; rejects on station interval overlap (ERR_STATION_DOUBLE_BOOKED)"]

  - method: GET
    path: "/tournaments/{id}"
    description: "Get a tournament"
    roles: [Member, Clerk, Manager]
    code: 200
    input: []
    output: Tournament
    side_effects: []

  - method: GET
    path: "/tournaments"
    description: "List tournaments filtered by station (reverse-reachability for Tournament.station_id)"
    roles: [Member, Clerk, Manager]
    code: 200
    input: ["station_id?", "limit?", "offset?"]
    output: Tournament[]
    side_effects: []

  - method: POST
    path: "/tournaments/{id}/register"
    description: "Register a member for a tournament (within the registration window, subject to capacity, one per member)"
    roles: [Member, Clerk, Manager]
    code: 200
    input: [member_id]
    output: Tournament
    side_effects: ["registered_count++; member id appended to registered_member_ids"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not one of Member/Clerk/Manager" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Acting role not permitted for this endpoint per RBAC" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Member acting on a resource whose member_id != X-User-ID" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource or referenced FK does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Request body fails schema: missing required field, bad enum, out-of-range number, empty lines, or qty < 1" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a legal state for the requested lifecycle transition" }
  - { id: ERR_ITEM_NOT_AVAILABLE, http: 409, condition: "An InventoryItem targeted by a sale or rental is not AVAILABLE" }
  - { id: ERR_ALLOCATION_NOT_READY, http: 409, condition: "Fulfill attempted while allocation_status != ALLOCATED or payment_status != PAID_IN_FULL" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_product_stock_version does not match current ProductStock.version (OCC)" }
  - { id: ERR_RENTAL_OVERLAP, http: 409, condition: "Requested rental interval plus buffer collides with an active rental on the same item" }
  - { id: ERR_STATION_DOUBLE_BOOKED, http: 409, condition: "Requested tournament interval overlaps an existing tournament on the same station" }
  - { id: ERR_REGISTRATION_CLOSED, http: 409, condition: "Current clock time is outside [registration_opens_at, registration_closes_at)" }
  - { id: ERR_TOURNAMENT_FULL, http: 409, condition: "registered_count already equals max_participants" }
  - { id: ERR_ALREADY_REGISTERED, http: 409, condition: "Member already registered for this tournament" }
  - { id: ERR_ONE_ACTIVE_PREORDER, http: 409, condition: "Member already has a non-terminal pre-order for this pool" }
  - { id: ERR_INSUFFICIENT_STORE_CREDIT, http: 402, condition: "redeem_store_credit_cents exceeds the member's store_credit_balance_cents" }
  - { id: ERR_INSUFFICIENT_PAYMENT, http: 402, condition: "Pre-order payment non-positive, below deposit on first payment, or would exceed unit_price_cents" }
  - { id: ERR_PAGINATION_INVALID, http: 400, condition: "limit or offset out of the allowed range (limit 1..100, offset >= 0)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Member
    description: "A store customer acting on their own pre-orders, trade-ins, rentals, and tournament registrations."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "POST /pre-orders (own)"
      - "POST /pre-orders/{id}/payments (own)"
