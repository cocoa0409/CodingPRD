            - "${e_submit} == ERR_MENU_ITEM_INVALID_STATE (409) — the submission is where the status is finally checked"
            - "${mi_st1} == ACTIVE, and the identical resubmit now succeeds: ${p_st1} == SUBMITTED, ${p_pdb} == 500, ${p_pu} == 940, ${p_pfc} == 2381, ${p_ecap} == 448 and ${p_pcd} == 800 — nothing about the proposal changed, only the item's status"
            - "${ml_snap} == 100 — the same mix-line load that was refused a moment ago now succeeds against the ACTIVE item"

  - section: rbac
    instances:
      - name: each_role_owns_its_exclusive_surface_and_is_refused_on_every_other
        claim_type: per_role
        grounds:
          - roles[PlatformAdmin, RecipeDeveloper, CulinaryDirector, CostAnalyst, UnitManager]
          - validations[priority 2] ERR_UNAUTHORIZED
        distinguishing_aspect: "Five peer roles, each probed positively on one exclusive operation and negatively on another role's, with the two traps that a coarse hierarchy gets wrong: CulinaryDirector may RETIRE an ingredient but may not CREATE one (creation is shared by PlatformAdmin and RecipeDeveloper only), and UnitManager has an empty exclusive set yet full read access. No role is a superset of another — PlatformAdmin cannot author a recipe and CulinaryDirector cannot run a roll-up."
        test_recipe:
          setup:
            - "One Unit STORE-001 in MW, one Ingredient CHEDDAR-BLOCK and one DRAFT Recipe PLATE-GRILL, each created by the role that owns the operation. Nothing is activated: every arm below is decided at priority 2, before any state is read."
          setup_api_calls:
            - call: "POST /culinary/units"
              payload: { code: "STORE-001", name: "Downtown", region_code: "MW" }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
              as: RecipeDeveloper
              captures: { ched_id: $.data.id }
            - call: "POST /culinary/recipes"
              payload: { code: "PLATE-GRILL", name: "Grilled Cheese Plate", recipe_type: "PLATED", base_uom: "EACH", batch_yield_base_units: 4, portions_per_batch: 4 }
              as: RecipeDeveloper
              captures: { grill_id: $.data.id }
          trigger:
            - call: "POST /culinary/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /culinary/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00.000Z" }
              as: CulinaryDirector
              captures: { e_clock: $.data.error_id }
            - call: "POST /culinary/units"
              payload: { code: "STORE-009", name: "Suburb", region_code: "SE" }
              as: RecipeDeveloper
              captures: { e_unit_dev: $.data.error_id }
            - call: "POST /culinary/recipes"
              payload: { code: "PLATE-ADMIN", name: "Admin Plate", recipe_type: "PLATED", base_uom: "EACH", batch_yield_base_units: 4, portions_per_batch: 4 }
              as: PlatformAdmin
              captures: { e_recipe_admin: $.data.error_id }
            - call: "POST /culinary/ingredients"
              payload: { sku: "DIRECTOR-SALT", name: "Director Salt", base_uom: "GRAM", pack_base_units: 1000, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 0, kcal_per_base_unit_micros: 0, sodium_mcg_per_base_unit: 380000 }
              as: CulinaryDirector
              captures: { e_ing_dir: $.data.error_id }
            - call: "POST /culinary/ingredients"
              payload: { sku: "ADMIN-SALT", name: "Admin Salt", base_uom: "GRAM", pack_base_units: 1000, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 0, kcal_per_base_unit_micros: 0, sodium_mcg_per_base_unit: 380000 }
              as: PlatformAdmin
              captures: { ok_ing_admin: $.data.id }
            - call: "POST /culinary/ingredients/${ched_id}/retire"
              as: CulinaryDirector
              captures: { ok_retired: $.data.status }
            - call: "POST /culinary/recipes/${grill_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CulinaryDirector
              captures: { e_rollup_dir: $.data.error_id }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-08-03T00:00:00.000Z" }
              as: CostAnalyst
              captures: { ok_feed: $.data.id }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "SPECIALTY", region_code: "MW", feed_date: "2026-08-03T00:00:00.000Z" }
              as: RecipeDeveloper
              captures: { e_feed_dev: $.data.error_id }
            - call: "POST /culinary/menu-period-reviews"
              payload: { unit_id: "${unit_id}", period_start: "2026-07-01T00:00:00.000Z", period_end: "2026-08-01T00:00:00.000Z", basis: "SALES_MIX_BASED" }
              as: UnitManager
              as_user_id: "${unit_id}"
              captures: { e_review_um: $.data.error_id }
            - call: "POST /culinary/recipes/${grill_id}/activate"
              as: RecipeDeveloper
              captures: { e_activate_dev: $.data.error_id }
            - call: "GET /culinary/recipes/${grill_id}"
              as: UnitManager
              as_user_id: "${unit_id}"
              captures: { um_read: $.data.code }
            - call: "GET /culinary/recipes/${grill_id}"
              as: PlatformAdmin
              captures: { admin_read: $.data.code }
          assert:
            - "the clock is PlatformAdmin-exclusive: the admin call succeeds and ${e_clock} == ERR_UNAUTHORIZED (403) for CulinaryDirector"
            - "${e_unit_dev} == ERR_UNAUTHORIZED — store registration is PlatformAdmin-exclusive"
            - "${e_recipe_admin} == ERR_UNAUTHORIZED — PlatformAdmin is NOT a superset of RecipeDeveloper; it cannot author a recipe"
            - "${e_ing_dir} == ERR_UNAUTHORIZED while ${ok_ing_admin} is minted: ingredient creation is shared by PlatformAdmin and RecipeDeveloper only, and the approval role is excluded from it"
            - "${ok_retired} == RETIRED — yet the same CulinaryDirector owns ingredient retirement, so the role's authority is over lifecycle transitions and not over the catalogue"
            - "${e_rollup_dir} == ERR_UNAUTHORIZED — roll-ups are CostAnalyst-exclusive, so the approver cannot manufacture the cost figures it approves"
            - "${ok_feed} is minted for CostAnalyst while ${e_feed_dev} == ERR_UNAUTHORIZED for RecipeDeveloper"
            - "${e_review_um} == ERR_UNAUTHORIZED — UnitManager has an EMPTY exclusive set: it may only write count lines, and even opening the review that holds them belongs to CostAnalyst"
            - "${e_activate_dev} == ERR_UNAUTHORIZED — the author cannot activate its own recipe, which is the structural half of segregation of duties"
            - "${um_read} == PLATE-GRILL == ${admin_read} — every role, including the one with no exclusive operations, can read every GET endpoint"

      - name: segregation_of_duties_binds_the_user_id_not_the_role_and_ranks_below_the_state_checks
        claim_type: segregation_of_duties
        grounds:
          - validations[priority 26] ERR_COST_STALE
          - validations[priority 27] ERR_SEGREGATION_OF_DUTIES
          - roles[CulinaryDirector] approval authority
        distinguishing_aspect: "The submitter is recorded as a USER, so the same human wearing the approval role is still refused: submitted_by_user_id is compared against X-User-ID, not against the role. And the check is deliberately ranked BELOW the cost-state gate, so when the plate cost goes stale between submission and approval the self-approver is told ERR_COST_STALE first — the security error only surfaces once the record is otherwise approvable, which is the opposite of the usual auth-first ordering seen at priorities 1 and 2."
        test_recipe:
          setup:
            - "GRILL WORLD in MW: CHEDDAR-BLOCK PUBLISHED at 22000000 micros / 2268 from 2026-07-01, PLATE-GRILL ACTIVE with CHEDDAR ep 400 over 4 portions, MI-GRILL-MW ACTIVE at 400 cents with plate_cost_cents 100 and target_food_cost_bps 3000."
            - "One proposal at 420 cents, elasticity 12000, SUBMITTED by X-User-ID user-dev-1 while the plate cost was still FRESH."
            - "A second BROADLINE feed dated 2026-07-15 at 33000000 micros, published AFTER the submission to drive the item's plate cost stale."
          setup_api_calls:
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
              as: RecipeDeveloper
              captures: { ched_id: $.data.id }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed1_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed1_id}/lines"
              payload: { ingredient_id: "${ched_id}", pack_cost_micros: 22000000, effective_from: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed1_id}/publish"
              as: CostAnalyst
            - call: "POST /culinary/recipes"
              payload: { code: "PLATE-GRILL", name: "Grilled Cheese Plate", recipe_type: "PLATED", base_uom: "EACH", batch_yield_base_units: 4, portions_per_batch: 4 }
              as: RecipeDeveloper
              captures: { grill_id: $.data.id, grill_v0: $.data.version }
            - call: "POST /culinary/recipes/${grill_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${ched_id}", ep_quantity_base_units: 400, sequence_no: 1, expected_recipe_version: "${grill_v0}" }
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${grill_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
            - call: "POST /culinary/recipes/${grill_id}/submit-review"
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${grill_id}/activate"
              as: CulinaryDirector
            - call: "POST /culinary/menu-items"
              payload: { code: "MI-GRILL-MW", name: "Grilled Cheese", recipe_id: "${grill_id}", region_code: "MW", current_price_cents: 400, target_food_cost_bps: 3000, declared_allergen_mask: 1 }
              as: RecipeDeveloper
              captures: { mi_id: $.data.id }
            - call: "POST /culinary/menu-items/${mi_id}/plate-cost"
              as: CostAnalyst
              captures: { plate0: $.data.plate_cost_cents }
            - call: "POST /culinary/menu-items/${mi_id}/activate"
              as: CulinaryDirector
            - call: "POST /culinary/price-change-proposals"
              payload: { menu_item_id: "${mi_id}", proposed_price_cents: 420, effective_from: "2026-09-01T00:00:00.000Z", elasticity_bps: 12000 }
              as: RecipeDeveloper
              captures: { p_id: $.data.id }
            - call: "POST /culinary/price-change-proposals/${p_id}/submit"
              as: RecipeDeveloper
              as_user_id: "user-dev-1"
              captures: { p_sub: $.data.submitted_by_user_id, p_st: $.data.status }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-07-15T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed2_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed2_id}/lines"
              payload: { ingredient_id: "${ched_id}", pack_cost_micros: 33000000, effective_from: "2026-07-15T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed2_id}/publish"
              as: CostAnalyst
              captures: { feed2_st: $.data.status }
          trigger:
            - call: "GET /culinary/menu-items/${mi_id}"
              as: CostAnalyst
              captures: { mi_state_stale: $.data.plate_cost_state, mi_plate_stale: $.data.plate_cost_cents }
            - call: "POST /culinary/price-change-proposals/${p_id}/approve"
              as: CulinaryDirector
              as_user_id: "user-dev-1"
              captures: { e_first: $.data.error_id }
            - call: "POST /culinary/recipes/${grill_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
              captures: { portion1: $.data.portion_cost_micros }
            - call: "POST /culinary/menu-items/${mi_id}/plate-cost"
              as: CostAnalyst
              captures: { plate1: $.data.plate_cost_cents, mi_state_fresh: $.data.plate_cost_state }
            - call: "POST /culinary/price-change-proposals/${p_id}/approve"
              as: CulinaryDirector
              as_user_id: "user-dev-1"
              captures: { e_second: $.data.error_id }
            - call: "GET /culinary/price-change-proposals/${p_id}"
              as: CulinaryDirector
              captures: { st_after_reject: $.data.status, appr_after_reject: $.data.approved_by_user_id }
            - call: "POST /culinary/price-change-proposals/${p_id}/approve"
              as: CulinaryDirector
              as_user_id: "user-dir-1"
              captures: { st_final: $.data.status, appr_final: $.data.approved_by_user_id, sub_final: $.data.submitted_by_user_id }
          assert:
            - "${plate0} == 100 and ${p_sub} == user-dev-1 with ${p_st} == SUBMITTED — the submitter's user id is recorded on the record, not just their role"
            - "${feed2_st} == PUBLISHED and ${mi_state_stale} == STALE while ${mi_plate_stale} == 100 — the publication cascade invalidated the plate cost without recomputing it"
            - "${e_first} == ERR_COST_STALE (409), NOT ERR_SEGREGATION_OF_DUTIES: the approver IS the submitter and would be refused anyway, but priority 26 is evaluated first, so the security error is masked by the state error"
            - "${portion1} == 1455027 and ${plate1} == 151 with ${mi_state_fresh} == FRESH — the cost is reconciled and the state gate now passes"
            - "${e_second} == ERR_SEGREGATION_OF_DUTIES (403) — same person, different role: switching from RecipeDeveloper to CulinaryDirector does not launder the conflict, because the comparison is X-User-ID against submitted_by_user_id"
            - "${st_after_reject} == SUBMITTED and ${appr_after_reject} == null — the refused approval wrote nothing"
            - "${st_final} == APPROVED with ${appr_final} == user-dir-1 and ${sub_final} == user-dev-1 still recorded: a genuinely different operator in the same role succeeds, so the rule is about identity and never about the role"

      - name: a_unit_manager_may_only_count_for_its_own_store
        claim_type: per_role
        grounds:
          - validations[priority 14] ERR_UNIT_SCOPE_VIOLATION
          - roles[UnitManager] identity entity_backed:Unit
          - endpoints[POST /culinary/menu-period-reviews/{id}/count-lines]
        distinguishing_aspect: "The one entity-backed identity in the domain: X-User-ID is a Unit id, so the same role is allowed or refused depending on WHICH review it writes to. The shared operation is asymmetric — CostAnalyst writes count lines to any unit's review without a scope check at all — and the scope applies only to the write: the same UnitManager can freely READ the other store's review and its count lines. A single is-this-my-tenant guard bolted onto the reads would fail two of the arms."
        test_recipe:
          setup:
            - "Two Units: STORE-A in MW and STORE-B in MW. One OPEN SALES_MIX_BASED review per unit over [2026-07-01, 2026-08-01), both with no mix lines, so every count line's expected_base_units is 0 and its variance equals its usage."
            - "CHEDDAR-BLOCK exists but needs no published price: count lines value nothing until the review is closed."
          setup_api_calls:
            - call: "POST /culinary/units"
              payload: { code: "STORE-A", name: "Store A", region_code: "MW" }
              as: PlatformAdmin
              captures: { unit_a: $.data.id }
            - call: "POST /culinary/units"
              payload: { code: "STORE-B", name: "Store B", region_code: "MW" }
              as: PlatformAdmin
              captures: { unit_b: $.data.id }
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
              as: RecipeDeveloper
              captures: { ched_id: $.data.id }
            - call: "POST /culinary/menu-period-reviews"
              payload: { unit_id: "${unit_a}", period_start: "2026-07-01T00:00:00.000Z", period_end: "2026-08-01T00:00:00.000Z", basis: "USAGE_BASED" }
              as: CostAnalyst
              captures: { rev_a: $.data.id }
            - call: "POST /culinary/menu-period-reviews"
              payload: { unit_id: "${unit_b}", period_start: "2026-07-01T00:00:00.000Z", period_end: "2026-08-01T00:00:00.000Z", basis: "USAGE_BASED" }
              as: CostAnalyst
              captures: { rev_b: $.data.id }
          trigger:
            - call: "POST /culinary/menu-period-reviews/${rev_a}/count-lines"
              payload: { ingredient_id: "${ched_id}", opening_base_units: 1000, received_base_units: 0, counted_base_units: 400 }
              as: UnitManager
              as_user_id: "${unit_a}"
              captures: { own_id: $.data.id, own_used: $.data.used_base_units, own_exp: $.data.expected_base_units, own_var: $.data.variance_base_units, own_sync: $.data.sync_state }
            - call: "POST /culinary/menu-period-reviews/${rev_b}/count-lines"
              payload: { ingredient_id: "${ched_id}", opening_base_units: 1000, received_base_units: 0, counted_base_units: 400 }
              as: UnitManager
              as_user_id: "${unit_a}"
              captures: { e_scope: $.data.error_id }
            - call: "POST /culinary/menu-period-reviews/${rev_b}/count-lines"
              payload: { ingredient_id: "${ched_id}", opening_base_units: 2000, received_base_units: 500, counted_base_units: 900 }
              as: UnitManager
              as_user_id: "${unit_b}"
              captures: { b_id: $.data.id, b_used: $.data.used_base_units }
            - call: "POST /culinary/menu-period-reviews/${rev_b}/count-lines"
              payload: { ingredient_id: "${ched_id}", opening_base_units: 100, received_base_units: 0, counted_base_units: 40 }
              as: CostAnalyst
              captures: { ca_id: $.data.id, ca_used: $.data.used_base_units }
            - call: "GET /culinary/menu-period-reviews/${rev_b}/count-lines"
              payload: { limit: 10, offset: 0 }
              as: UnitManager
              as_user_id: "${unit_a}"
              captures: { cross_read_total: $.pagination.total_count, cross_read_first: "$.data[0].id" }
            - call: "POST /culinary/menu-period-reviews/${rev_a}/classify"
              as: UnitManager
              as_user_id: "${unit_a}"
              captures: { e_classify: $.data.error_id }
          assert:
            - "the manager's own store is writable: ${own_id} is minted with ${own_used} == 600 == 1000 + 0 - 400, ${own_exp} == 0 (no mix lines loaded), ${own_var} == 600 and ${own_sync} == CURRENT"
            - "${e_scope} == ERR_UNIT_SCOPE_VIOLATION (403) — the SAME role and the SAME payload, refused purely because the review belongs to STORE-B"
            - "${b_id} is minted with ${b_used} == 1600 == 2000 + 500 - 900 when the request carries STORE-B's own id, so the guard is per-request identity and not a per-role ban"
            - "${ca_id} is minted with ${ca_used} == 60 — CostAnalyst shares the endpoint WITHOUT the scope restriction and writes into another unit's review freely, so the check is conditional on the role"
            - "${cross_read_total} == 2 and ${cross_read_first} == ${b_id} — STORE-A's manager reads STORE-B's count lines without complaint: priority 14 guards the write only"
            - "${e_classify} == ERR_UNAUTHORIZED (403), not ERR_UNIT_SCOPE_VIOLATION — for an operation outside the shared set, priority 2 rejects the role before priority 14 can look at the unit"

  - section: cross_cutting_complexity_layers
    instances:
      - name: every_recipe_parented_write_rejects_a_stale_expected_recipe_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[component-add-stale-recipe] ERR_STALE_RECIPE_VERSION
          - concurrency_rules[component-remove-stale-recipe] ERR_STALE_RECIPE_VERSION
          - concurrency_rules[spec-change-order-create-stale-recipe] ERR_STALE_RECIPE_VERSION
        distinguishing_aspect: "All three Recipe-parented writes are probed with the version the caller legitimately held one write ago, which is the only value that distinguishes an informed second write from a blind one — appending a second component, removing a second component and opening a second order are all legal in themselves. The spec-change-order arm adds the trap that makes OCC bite here: creating an order bumps open_spec_change_count and therefore the recipe version, so a client that read the recipe once and files two orders is rejected on the second even though nothing else in the system moved."
        test_recipe:
          setup:
            - "CHEDDAR-BLOCK and WHEAT-FLOUR both PUBLISHED in MW (pack 2268 at 22000000 and pack 22680 at 12000000 micros)."
            - "DRAFT recipe PLATE-DRAFT with CHEDDAR ep 400 already added, so its version has advanced exactly once past the value the create returned."
            - "A second recipe PLATE-LIVE, CHEDDAR ep 400 only, driven all the way to ACTIVE so specification change orders can be opened against it."
          setup_api_calls:
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
              as: RecipeDeveloper
              captures: { ched_id: $.data.id }
            - call: "POST /culinary/ingredients"
              payload: { sku: "WHEAT-FLOUR", name: "Bread Flour", base_uom: "GRAM", pack_base_units: 22680, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 4, kcal_per_base_unit_micros: 3500000, sodium_mcg_per_base_unit: 20 }
              as: RecipeDeveloper
              captures: { flour_id: $.data.id }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed1_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed1_id}/lines"
              payload: { ingredient_id: "${ched_id}", pack_cost_micros: 22000000, effective_from: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed1_id}/lines"
              payload: { ingredient_id: "${flour_id}", pack_cost_micros: 12000000, effective_from: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed1_id}/publish"
              as: CostAnalyst
            - call: "POST /culinary/recipes"
              payload: { code: "PLATE-DRAFT", name: "Draft Plate", recipe_type: "PLATED", base_uom: "EACH", batch_yield_base_units: 4, portions_per_batch: 4 }
              as: RecipeDeveloper
              captures: { d_id: $.data.id, d_v0: $.data.version }
            - call: "POST /culinary/recipes/${d_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${ched_id}", ep_quantity_base_units: 400, sequence_no: 1, expected_recipe_version: "${d_v0}" }
              as: RecipeDeveloper
              captures: { d_comp1: $.data.id }
            - call: "GET /culinary/recipes/${d_id}"
              as: RecipeDeveloper
              captures: { d_v1: $.data.version }
            - call: "POST /culinary/recipes"
              payload: { code: "PLATE-LIVE", name: "Live Plate", recipe_type: "PLATED", base_uom: "EACH", batch_yield_base_units: 4, portions_per_batch: 4 }
              as: RecipeDeveloper
              captures: { l_id: $.data.id, l_v0: $.data.version }
            - call: "POST /culinary/recipes/${l_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${ched_id}", ep_quantity_base_units: 400, sequence_no: 1, expected_recipe_version: "${l_v0}" }
              as: RecipeDeveloper
              captures: { l_comp1: $.data.id }
            - call: "POST /culinary/recipes/${l_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
            - call: "POST /culinary/recipes/${l_id}/submit-review"
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${l_id}/activate"
              as: CulinaryDirector
              captures: { l_v_active: $.data.version, l_open0: $.data.open_spec_change_count }
          trigger:
            - call: "POST /culinary/recipes/${d_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${flour_id}", ep_quantity_base_units: 200, sequence_no: 2, expected_recipe_version: "${d_v0}" }
              as: RecipeDeveloper
              captures: { e_add: $.data.error_id }
            - call: "GET /culinary/recipes/${d_id}"
              as: RecipeDeveloper
              captures: { d_v_after_fail: $.data.version, d_count_after_fail: $.data.component_count }
            - call: "POST /culinary/recipes/${d_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${flour_id}", ep_quantity_base_units: 200, sequence_no: 2, expected_recipe_version: "${d_v1}" }
              as: RecipeDeveloper
              captures: { d_comp2: $.data.id }
            - call: "GET /culinary/recipes/${d_id}"
              as: RecipeDeveloper
              captures: { d_v2: $.data.version, d_count2: $.data.component_count }
            - call: "DELETE /culinary/recipe-components/${d_comp2}"
              payload: { expected_recipe_version: "${d_v1}" }
              as: RecipeDeveloper
              captures: { e_del: $.data.error_id }
            - call: "GET /culinary/recipe-components/${d_comp2}"
              as: RecipeDeveloper
              captures: { comp2_status_after_fail: $.data.status }
            - call: "DELETE /culinary/recipe-components/${d_comp2}"
              payload: { expected_recipe_version: "${d_v2}" }
              as: RecipeDeveloper
              captures: { del_status: $.data.status }
            - call: "POST /culinary/spec-change-orders"
              payload: { recipe_id: "${l_id}", change_type: "COMPONENT_QTY", target_component_id: "${l_comp1}", new_ep_quantity_base_units: 500, expected_recipe_version: "${l_v_active}" }
              as: RecipeDeveloper
              captures: { sco_a: $.data.id }
            - call: "GET /culinary/recipes/${l_id}"
              as: RecipeDeveloper
              captures: { l_v_after_a: $.data.version, l_open1: $.data.open_spec_change_count }
            - call: "POST /culinary/spec-change-orders"
              payload: { recipe_id: "${l_id}", change_type: "COMPONENT_QTY", target_component_id: "${l_comp1}", new_ep_quantity_base_units: 600, expected_recipe_version: "${l_v_active}" }
              as: RecipeDeveloper
              captures: { e_sco: $.data.error_id }
            - call: "GET /culinary/recipes/${l_id}"
              as: RecipeDeveloper
              captures: { l_v_after_fail: $.data.version, l_open_after_fail: $.data.open_spec_change_count }
            - call: "POST /culinary/spec-change-orders"
              payload: { recipe_id: "${l_id}", change_type: "COMPONENT_QTY", target_component_id: "${l_comp1}", new_ep_quantity_base_units: 600, expected_recipe_version: "${l_v_after_a}" }
              as: RecipeDeveloper
              captures: { sco_b: $.data.id }
            - call: "GET /culinary/recipes/${l_id}"
              as: RecipeDeveloper
              captures: { l_open2: $.data.open_spec_change_count }
          assert:
            - "${e_add} == ERR_STALE_RECIPE_VERSION (412) — ${d_v0} was valid exactly one write ago and appending a SECOND component is otherwise perfectly legal, so only the version can distinguish the two cases"
            - "${d_v_after_fail} == ${d_v1} and ${d_count_after_fail} == 1 — the rejected write left neither the version nor the component set touched"
            - "the retry with the current version succeeds: ${d_count2} == 2 and ${d_v2} == ${d_v1} + 1"
            - "${e_del} == ERR_STALE_RECIPE_VERSION (412) for the DELETE using the version that the successful add invalidated, and ${comp2_status_after_fail} == ACTIVE proves nothing was removed"
            - "${del_status} == REMOVED once the current version is supplied — the same request, one integer different"
            - "${l_open0} == 0 and ${l_open1} == 1 with ${l_v_after_a} == ${l_v_active} + 1 — opening an order mutates the recipe's derived counter and therefore its version"
            - "${e_sco} == ERR_STALE_RECIPE_VERSION (412): the SECOND order is filed with the version the client read before the FIRST one, and the counter's own bump is what makes that read stale — a client that never re-reads the recipe can never file two orders"
            - "${l_v_after_fail} == ${l_v_after_a} and ${l_open_after_fail} == 1 — the rejected create did not increment the counter, so a 412 leaves no residue"
            - "${sco_b} is minted with ${l_open2} == 2 once the refreshed version is used"

      - name: an_lto_campaign_planned_against_an_obsolete_menu_item_read_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[lto-create-stale-menu-item] ERR_STALE_MENU_ITEM_VERSION
          - endpoints[POST /culinary/lto-campaigns]
        distinguishing_aspect: "The only MenuItem-parented OCC rule, and the one whose legitimate-repeat case is strongest: several campaigns on disjoint windows are expected, so nothing but the version can reject a plan authored against an obsolete price or plate cost. The stale value here is produced by a pure recomputation — a second plate-cost run that changes no figure at all yet still bumps the version — which is exactly the case an implementation that only bumps the version 'when something changed' gets wrong."
        test_recipe:
          setup:
            - "GRILL WORLD in MW: CHEDDAR-BLOCK PUBLISHED at 22000000 micros / 2268, PLATE-GRILL ACTIVE with CHEDDAR ep 400 over 4 portions, MI-GRILL-MW ACTIVE at 400 cents with plate_cost_cents 100 and plate_cost_state FRESH."
            - "The item's version is then advanced by re-running the plate cost, which recomputes the identical 100 cents."
          setup_api_calls:
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
