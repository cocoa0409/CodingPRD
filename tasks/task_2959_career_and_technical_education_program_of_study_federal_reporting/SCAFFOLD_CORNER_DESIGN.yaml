scaffold_corner_design:

  - section: entities
    instances:

      - name: program_of_study_creation_returns_the_declared_field_set
        claim_type: creation
        grounds:
          - entities.ProgramOfStudy
          - endpoints[POST /cte/programs-of-study]
          - response_envelope
        distinguishing_aspect: |
          A 201 must return every ProgramOfStudy field the scaffold declares, with the four input fields echoed and the
          system/computed fields at their declared defaults, wrapped in the success envelope.
        test_recipe:
          setup:
            - "Empty database. The logical clock is pinned to its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CteDirector
              as_user_id: "u_dir_1"
          trigger:
            - call: "POST /cte/programs-of-study"
              payload: { cip_code: "51.0801", title: "Medical Assisting", cluster: "HEALTH_SCIENCE", labor_market_data_asof: "2026-03-01" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { pos_id: $.data.id, st: $.data.approval_status, ph: $.data.clna_phase, ver: $.data.version }
          assert:
            - "response HTTP status == 201"
            - "response meta.api_request_id and meta.api_request_timestamp are both present"
            - "response response_type == 'object'"
            - "${st} == DRAFT"
            - "${ph} == NOT_STARTED"
            - "${ver} == 1"
            - "ProgramOfStudy.${pos_id}.cip_code == 51.0801"
            - "ProgramOfStudy.${pos_id}.title == Medical Assisting"
            - "ProgramOfStudy.${pos_id}.cluster == HEALTH_SCIENCE"
            - "ProgramOfStudy.${pos_id}.labor_market_data_asof == 2026-03-01"
            - "ProgramOfStudy.${pos_id}.approval_round == 0"
            - "ProgramOfStudy.${pos_id}.authored_by_user_id == u_dir_1"
            - "ProgramOfStudy.${pos_id}.alignment_index == null"
            - "ProgramOfStudy.${pos_id}.alignment_index_variant == null"
            - "ProgramOfStudy.${pos_id}.secondary_credit_total == 0.00"
            - "ProgramOfStudy.${pos_id}.postsecondary_credit_total == 0.00"
            - "ProgramOfStudy.${pos_id}.articulated_credit_total == 0.00"
            - "ProgramOfStudy.${pos_id}.federal_reporting_eligible == false"
            - "ProgramOfStudy.${pos_id}.open_finding_codes == []"
            - "ProgramOfStudy.${pos_id}.narrative_url == null"
            - "ProgramOfStudy.${pos_id}.clna_certified_on == null and clna_expires_on == null and clna_certified_by_user_id == null"

      - name: get_sequence_course_returns_the_stored_row_including_depth_from_root
        claim_type: retrieval
        grounds:
          - entities.SequenceCourse
          - endpoints[GET /cte/sequence-courses/{id}]
          - entities.SequenceCourse.fields.depth_from_root
        distinguishing_aspect: |
          A detail GET must return the persisted row byte-for-byte as written, including the computed depth_from_root
          that the prerequisite chain determines (0 for the root course, 1 for the course that names it).
        test_recipe:
          setup:
            - "Empty database. The logical clock is pinned to its startup default 2026-08-01T00:00:00Z."
            - "One ProgramOfStudy in approval_status DRAFT with a SECONDARY root course at position 1 and a POSTSECONDARY course at position 2 whose prerequisite_course_id is the root."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CteDirector
              as_user_id: "u_dir_1"
            - call: "POST /cte/programs-of-study"
              payload: { cip_code: "51.0801", title: "Medical Assisting", cluster: "HEALTH_SCIENCE", labor_market_data_asof: "2026-03-01" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { pos_id: $.data.id }
            - call: "POST /cte/programs-of-study/${pos_id}/sequence-courses"
              payload: { code: "MED-1", title: "Medical Assisting I", segment: "SECONDARY", position: 1, credit_hours: 4.00, status: "ACTIVE" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { crs_sec_id: $.data.id }
            - call: "POST /cte/programs-of-study/${pos_id}/sequence-courses"
              payload: { code: "MED-9", title: "Dual-Credit Phlebotomy", segment: "POSTSECONDARY", position: 2, credit_hours: 3.00, articulated_credit_hours: 2.50, articulation_verified: true, prerequisite_course_id: "${crs_sec_id}", status: "ACTIVE" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { crs_ps_id: $.data.id }
          trigger:
            - call: "GET /cte/sequence-courses/${crs_sec_id}"
              payload: {}
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { d_root: $.data.depth_from_root }
            - call: "GET /cte/sequence-courses/${crs_ps_id}"
              payload: {}
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { d_leaf: $.data.depth_from_root, ah: $.data.articulated_credit_hours, av: $.data.articulation_verified, pid: $.data.pos_id }
          assert:
            - "${d_root} == 0"
            - "${d_leaf} == 1"
            - "${ah} == 2.50"
            - "${av} == true"
            - "${pid} == ${pos_id}"
            - "SequenceCourse.${crs_ps_id}.prerequisite_course_id == ${crs_sec_id}"
            - "SequenceCourse.${crs_ps_id}.segment == POSTSECONDARY and position == 2 and credit_hours == 3.00"

      - name: list_programs_of_study_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /cte/programs-of-study]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Three rows exist; limit 2 / offset 0 must return 2 items with total_count 3 and has_more true, and limit 2 /
          offset 2 must return 1 item with total_count 3 and has_more false. The cluster filter must narrow
          total_count to the matching subset rather than to the page size.
        test_recipe:
          setup:
            - "Empty database. The logical clock is pinned to its startup default 2026-08-01T00:00:00Z."
            - "Three ProgramOfStudy rows created in this order: cip_code 51.0801 cluster HEALTH_SCIENCE, cip_code 11.0201 cluster INFORMATION_TECHNOLOGY, cip_code 46.0302 cluster CONSTRUCTION."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CteDirector
              as_user_id: "u_dir_1"
            - call: "POST /cte/programs-of-study"
              payload: { cip_code: "51.0801", title: "Medical Assisting", cluster: "HEALTH_SCIENCE", labor_market_data_asof: "2026-03-01" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { pos1_id: $.data.id }
            - call: "POST /cte/programs-of-study"
              payload: { cip_code: "11.0201", title: "Computer Programming", cluster: "INFORMATION_TECHNOLOGY", labor_market_data_asof: "2026-03-01" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { pos2_id: $.data.id }
            - call: "POST /cte/programs-of-study"
              payload: { cip_code: "46.0302", title: "Electrical Trades", cluster: "CONSTRUCTION", labor_market_data_asof: "2026-03-01" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { pos3_id: $.data.id }
          trigger:
            - call: "GET /cte/programs-of-study"
              payload: { limit: 2, offset: 0 }
              as: StateComplianceReviewer
              as_user_id: "u_rev_1"
              captures: { n1: $.meta.total_count, h1: $.meta.has_more }
            - call: "GET /cte/programs-of-study"
              payload: { limit: 2, offset: 2 }
              as: StateComplianceReviewer
              as_user_id: "u_rev_1"
              captures: { n2: $.meta.total_count, h2: $.meta.has_more }
            - call: "GET /cte/programs-of-study"
              payload: { cluster: "CONSTRUCTION" }
              as: StateComplianceReviewer
              as_user_id: "u_rev_1"
              captures: { n3: $.meta.total_count, h3: $.meta.has_more }
            - call: "GET /cte/programs-of-study"
              payload: { approval_status: "STATE_APPROVED" }
              as: StateComplianceReviewer
              as_user_id: "u_rev_1"
              captures: { n4: $.meta.total_count, h4: $.meta.has_more }
          assert:
            - "response response_type == 'array' on every one of the four reads"
            - "${n1} == 3"
            - "${h1} == true"
            - "the first read returns exactly 2 items with limit 2 and offset 0 echoed"
            - "${n2} == 3"
            - "${h2} == false"
            - "the second read returns exactly 1 item"
            - "${n3} == 1"
            - "${h3} == false"
            - "the third read returns only ProgramOfStudy.${pos3_id}"
            - "${n4} == 0"
            - "${h4} == false"
            - "the fourth read returns an empty item list"

      - name: get_student_with_an_unknown_id_returns_student_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_STUDENT_NOT_FOUND]
          - validations[priority=5]
          - endpoints[GET /cte/students/{id}]
          - response_envelope.error
        distinguishing_aspect: |
          A syntactically valid but unpersisted id on the Student detail read must produce the Student-specific 404
          error_id inside the error envelope, not a generic 404 and not the parent program's error_id.
        test_recipe:
          setup:
            - "Empty database. The logical clock is pinned to its startup default 2026-08-01T00:00:00Z."
            - "One ProgramOfStudy in approval_status DRAFT holding exactly one Student, so the collection is non-empty and the miss cannot be an empty-table artefact."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CteDirector
              as_user_id: "u_dir_1"
            - call: "POST /cte/programs-of-study"
              payload: { cip_code: "51.0801", title: "Medical Assisting", cluster: "HEALTH_SCIENCE", labor_market_data_asof: "2026-03-01" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { pos_id: $.data.id }
            - call: "POST /cte/programs-of-study/${pos_id}/students"
              payload: { state_student_id: "100000001", cohort_year: 2026 }
              as: SchoolRegistrar
              as_user_id: "u_reg_1"
              captures: { stu1_id: $.data.id }
          trigger:
            - call: "GET /cte/students/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SchoolRegistrar
              as_user_id: "u_reg_1"
          assert:
            - "response error_id == ERR_STUDENT_NOT_FOUND"
            - "response HTTP status == 404"
            - "response response_type == 'error'"
            - "response data.message is a non-empty string"
            - "Student.${stu1_id} is unaffected and still has concentrator_status == PARTICIPANT"

      - name: create_expenditure_without_service_period_end_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /cte/grant-awards/{id}/expenditures]
        distinguishing_aspect: |
          Every field listed without a trailing question mark in the endpoint's input: is required; omitting
          service_period_end must fail shape validation at priority 3 with HTTP 400 and must NOT reach the OCC check at
          priority 8 even though expected_grant_award_version is supplied.
        test_recipe:
          setup:
            - "Empty database. The logical clock is pinned to its startup default 2026-08-01T00:00:00Z."
            - "One ProgramOfStudy in approval_status DRAFT."
            - "One GrantAward for fiscal_year 2027 with allocation_cents 5000000 and obligation window 2026-07-01 to 2027-06-30, version 1 and a zeroed ledger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CteDirector
              as_user_id: "u_dir_1"
            - call: "POST /cte/programs-of-study"
              payload: { cip_code: "51.0801", title: "Medical Assisting", cluster: "HEALTH_SCIENCE", labor_market_data_asof: "2026-03-01" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { pos_id: $.data.id }
            - call: "POST /cte/grant-awards"
              payload: { fiscal_year: 2027, allocation_cents: 5000000, obligation_window_start: "2026-07-01", obligation_window_end: "2027-06-30" }
              as: GrantFiscalOfficer
              as_user_id: "u_fis_1"
              captures: { grant_id: $.data.id, grant_v1: $.data.version }
          trigger:
            - call: "POST /cte/grant-awards/${grant_id}/expenditures"
              payload: { pos_id: "${pos_id}", category: "CONSUMABLE", description: "Missing end date", unit_cost_cents: 100000, quantity: 1, service_period_start: "2026-09-01", expected_grant_award_version: "${grant_v1}" }
              as: CteDirector
              as_user_id: "u_dir_1"
            - call: "GET /cte/grant-awards/${grant_id}"
              payload: {}
              as: GrantFiscalOfficer
              as_user_id: "u_fis_1"
              captures: { v_after: $.data.version }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "response HTTP status == 400"
            - "${v_after} == ${grant_v1}"
            - "GrantAward.${grant_id}.remaining_cents == 5000000"
            - "GET /cte/grant-awards/${grant_id}/expenditures returns total_count == 0"

      - name: omitted_optional_inputs_take_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.SequenceCourse.fields.status
          - entities.SequenceCourse.fields.articulated_credit_hours
          - entities.SequenceCourse.fields.articulation_verified
          - entities.Credential.fields.exam_required
          - entities.CommitteeMember.fields.is_chair
          - entities.Student.fields.special_population_codes
        distinguishing_aspect: |
          Six declared defaults across four entities must materialise when the optional input is omitted: SequenceCourse
          status DRAFT, articulated_credit_hours 0, articulation_verified false; Credential exam_required true;
          CommitteeMember is_chair false; Student special_population_codes empty array.
        test_recipe:
          setup:
            - "Empty database. The logical clock is pinned to its startup default 2026-08-01T00:00:00Z."
            - "One ProgramOfStudy in approval_status DRAFT with one FORMING AdvisoryCommittee created at program version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CteDirector
              as_user_id: "u_dir_1"
            - call: "POST /cte/programs-of-study"
              payload: { cip_code: "51.0801", title: "Medical Assisting", cluster: "HEALTH_SCIENCE", labor_market_data_asof: "2026-03-01" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { pos_id: $.data.id, pos_v_a: $.data.version }
            - call: "POST /cte/programs-of-study/${pos_id}/advisory-committees"
              payload: { name: "Medical Assisting Advisory Committee", quorum_min_members: 3, employer_seat_min: 2, expected_program_of_study_version: "${pos_v_a}" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { cmte_id: $.data.id }
          trigger:
            - call: "POST /cte/programs-of-study/${pos_id}/sequence-courses"
              payload: { code: "MED-1", title: "Medical Assisting I", segment: "SECONDARY", position: 1, credit_hours: 4.00 }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { crs_id: $.data.id, crs_st: $.data.status, crs_ah: $.data.articulated_credit_hours, crs_av: $.data.articulation_verified }
            - call: "POST /cte/programs-of-study/${pos_id}/credentials"
              payload: { code: "CCMA", title: "Certified Clinical Medical Assistant", tier: "NATIONAL" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { cred_id: $.data.id, cred_ex: $.data.exam_required, cred_ct: $.data.counts_toward_indicator }
            - call: "POST /cte/advisory-committees/${cmte_id}/members"
              payload: { full_name: "Rosa Vega", sector: "EMPLOYER", seat_code: "EMP-1", term_start_on: "2026-01-01", term_end_on: "2027-12-31" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { m1_id: $.data.id, m1_ch: $.data.is_chair, m1_st: $.data.status }
            - call: "POST /cte/programs-of-study/${pos_id}/students"
              payload: { state_student_id: "100000001", cohort_year: 2026 }
              as: SchoolRegistrar
              as_user_id: "u_reg_1"
              captures: { stu1_id: $.data.id, stu_pop: $.data.special_population_codes, stu_cs: $.data.concentrator_status }
          assert:
            - "${crs_st} == DRAFT"
            - "${crs_ah} == 0.00"
            - "${crs_av} == false"
            - "${cred_ex} == true"
            - "${cred_ct} == false"
            - "${m1_ch} == false"
            - "${m1_st} == ACTIVE"
            - "${stu_pop} == []"
            - "${stu_cs} == PARTICIPANT"
            - "AdvisoryCommittee.${cmte_id}.chair_member_id == null"
            - "Student.${stu1_id}.cte_credits_earned == 0.00"
            - "Student.${stu1_id}.exited_on == null and exit_reason == null"

      - name: expenditure_gross_and_federal_share_are_computed_from_the_category_table
        claim_type: computed_fields
        grounds:
          - entities.Expenditure.fields.gross_cents
          - entities.Expenditure.fields.federal_share_pct
          - calculations.expenditure_federal_share
        distinguishing_aspect: |
          gross_cents and federal_share_pct are source: computed and are never accepted from the request: for
          unit_cost_cents 12345 and quantity 7 the row must show gross_cents 86415 and, for PROFESSIONAL_DEVELOPMENT,
          federal_share_pct 1.0 while approved_cents stays null until certification.
        test_recipe:
          setup:
            - "Empty database. The logical clock is pinned to its startup default 2026-08-01T00:00:00Z."
            - "One ProgramOfStudy in approval_status DRAFT."
            - "One GrantAward for fiscal_year 2027 with allocation_cents 5000000 and obligation window 2026-07-01 to 2027-06-30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CteDirector
              as_user_id: "u_dir_1"
            - call: "POST /cte/programs-of-study"
              payload: { cip_code: "51.0801", title: "Medical Assisting", cluster: "HEALTH_SCIENCE", labor_market_data_asof: "2026-03-01" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { pos_id: $.data.id }
            - call: "POST /cte/grant-awards"
              payload: { fiscal_year: 2027, allocation_cents: 5000000, obligation_window_start: "2026-07-01", obligation_window_end: "2027-06-30" }
              as: GrantFiscalOfficer
              as_user_id: "u_fis_1"
              captures: { grant_id: $.data.id, grant_v1: $.data.version }
          trigger:
            - call: "POST /cte/grant-awards/${grant_id}/expenditures"
              payload: { pos_id: "${pos_id}", category: "PROFESSIONAL_DEVELOPMENT", description: "Instructor externship stipends", unit_cost_cents: 12345, quantity: 7, service_period_start: "2026-09-01", service_period_end: "2026-09-30", expected_grant_award_version: "${grant_v1}" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { e1_id: $.data.id, e1_gross: $.data.gross_cents, e1_share: $.data.federal_share_pct, e1_appr: $.data.approved_cents, e1_st: $.data.status }
          assert:
            - "${e1_gross} == 86415"
            - "${e1_share} == 1.0"
            - "${e1_appr} == null"
            - "${e1_st} == REQUESTED"
            - "Expenditure.${e1_id}.requested_by_user_id == u_dir_1"
            - "Expenditure.${e1_id}.certified_by_user_id == null and finding_code == null"
            - "GrantAward.${grant_id}.direct_obligated_cents == 0 and remaining_cents == 5000000"

      - name: grant_award_system_and_computed_fields_are_server_minted_at_creation
        claim_type: system_fields
        grounds:
          - entities.GrantAward
          - endpoints[POST /cte/grant-awards]
          - calculations.grant_obligation_rollup
          - entities.GrantAward.fields.admin_cap_cents
        distinguishing_aspect: |
          The server mints id, version 1, created_at and updated_at, and initialises the whole ledger in one step: for
          allocation_cents 5000000 the row must show admin_cap_cents 250000 (5 percent, round_half_up),
          remaining_cents 5000000 and indirect_rate 0.0812 — the tier for a direct total of zero.
        test_recipe:
          setup:
            - "Empty database. The logical clock is pinned to its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CteDirector
              as_user_id: "u_dir_1"
          trigger:
            - call: "POST /cte/grant-awards"
              payload: { fiscal_year: 2027, allocation_cents: 5000000, obligation_window_start: "2026-07-01", obligation_window_end: "2027-06-30" }
              as: GrantFiscalOfficer
              as_user_id: "u_fis_1"
              captures: { g_id: $.data.id, g_v: $.data.version, g_st: $.data.status, g_cap: $.data.admin_cap_cents, g_rate: $.data.indirect_rate, g_rem: $.data.remaining_cents }
          assert:
            - "response HTTP status == 201"
            - "${g_id} is a non-empty server-generated string"
            - "${g_v} == 1"
            - "${g_st} == OPEN"
            - "${g_cap} == 250000"
            - "${g_rate} == 0.0812"
            - "${g_rem} == 5000000"
            - "GrantAward.${g_id}.direct_obligated_cents == 0"
            - "GrantAward.${g_id}.indirect_pool_cents == 0"
            - "GrantAward.${g_id}.obligated_cents == 0"
            - "GrantAward.${g_id}.admin_obligated_cents == 0"
            - "GrantAward.${g_id}.created_at and updated_at are ISO 8601 UTC instants with exactly three fractional digits"

      - name: pattern_enum_and_range_constraints_are_all_enforced_as_invalid_request
        claim_type: type_constraints
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - entities.ProgramOfStudy.fields.cip_code
          - entities.CommitteeMember.fields.seat_code
          - entities.SequenceCourse.fields.position
          - entities.Student.fields.cohort_year
          - entities.Expenditure.fields.quantity
        distinguishing_aspect: |
          Seven distinct shape rules must each yield ERR_INVALID_REQUEST with HTTP 400 and must persist nothing: a
          cip_code that misses the two-dot-four pattern, a cluster outside the enum, a seat_code missing its
          three-letter prefix, position 9 above the 1..8 bound, cohort_year 2019 below the 2020 bound,
          articulated_credit_hours above credit_hours, and quantity 0 below the minimum of 1.
        test_recipe:
          setup:
            - "Empty database. The logical clock is pinned to its startup default 2026-08-01T00:00:00Z."
            - "One ProgramOfStudy in approval_status DRAFT with one FORMING AdvisoryCommittee."
            - "One GrantAward for fiscal_year 2027 with allocation_cents 5000000 and obligation window 2026-07-01 to 2027-06-30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CteDirector
              as_user_id: "u_dir_1"
