        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "POST /airport/airlines response carries the persisted entity; a subsequent GET sees the same row — no eventual-consistency lag."
        test_recipe:
          setup: []
          setup_api_calls:
            - call: "POST /airport/airlines"
              payload: { iata_code: "IC", legal_name: "Immediate Consistency", carrier_class: "PASSENGER", pfc_approved: false }
              as: AirportFinance
              captures: { ic_id: $.data.id, ic_created: $.data.created_at }
          trigger:
            - call: "GET /airport/airlines/{ic_id}"
              as: AirportFinance
          assert:
            - "GET response matches POST response field-for-field (iata_code, legal_name, carrier_class, pfc_approved, id, created_at, updated_at, version)"
