          Voiding a notice reaches into a different aggregate and restores exactly two parcel fields —
          open_violation_count back to 0 and compliance_status back to PENDING_INSPECTION because no
          passed inspection exists — while deliberately leaving the verified risk_score 70.49 and
          risk_score_basis POST_INSPECTION_VERIFIED in place: a void is not a re-inspection.
        test_recipe:
          setup:
            - "Active cycle, ACTIVE inspector, HIGH parcel; one FAILED inspection at clock 2026-08-22 has produced an ISSUED MAJOR notice."
