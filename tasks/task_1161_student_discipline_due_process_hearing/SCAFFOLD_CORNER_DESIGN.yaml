  # ---------------------------------------------------------------------------
  # Section: calculations
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: occurrence_excludes_submitted_priors
        claim_type: input_set_filtering
        grounds: [calculations.occurrence_count]
        distinguishing_aspect: "A same-category prior still in SUBMITTED is excluded from the prior set: case3 classifies at occurrence_index 2, not 3."
        test_recipe:
          setup:
            - "Offense DISR-01 with bands occ1 [1,3], occ2 [2,4]; student NONE"
            - "case1 (incident 2026-05-04) fully CONFIRMED; case2 (incident 2026-05-05) created but left SUBMITTED; case3 (incident 2026-05-06) created"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T09:00:00Z" }, as: DistrictAdmin }
            - call: "POST /offense-codes"
              payload: { code: "DISR-01", title: "Disruption", category: "DISRUPTION", severity_level: 2, expellable: false }
              as: DistrictAdmin
              captures: { oc_id: $.data.id }
