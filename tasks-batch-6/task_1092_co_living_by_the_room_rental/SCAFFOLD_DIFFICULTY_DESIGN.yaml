        grounds:
          - validations[priority=26]
          - errors[ERR_ROOM_TURNOVER_CONFLICT]
          - entities.Membership.fields.effective_end_date
          - entities.Room.fields.available_from_date
          - state_machines.Room.VACANT_to_RESERVED
