- section: calculations
  instances:
  - name: fee_lost_ticket_three_calendar_days
    claim_type: correct_result
    grounds:
    - calculations.transient_fee_calculation
    - entities.ParkingSession.fields.fee_mode
    distinguishing_aspect: 'LOST_TICKET fee counts distinct calendar dates touched (entry 08-01, lost at 08-03 -> 3 days) times lost_ticket_daily_cents: 7200.'
    test_recipe:
      setup:
      - Facility with published tariff, ONLINE gate; session entered 2026-08-01T10:00:00Z; clock 2026-08-03T12:00:00Z
      setup_api_calls:
      - call: POST /ops/facilities
        payload:
          name: LT Fac
          total_spaces: 200
          monthly_capacity: 50
          event_pool_spaces: 40
        as: FacilityManager
        captures:
          fac: $.data.id
          fac_v: $.data.version
      - call: POST /ops/rate-schedules
        payload:
          facility_id: ${fac}
          label: L
          grace_minutes: 15
          first_hour_cents: 500
          additional_hour_cents: 300
          daily_max_cents: 2400
          event_flat_cents: 1500
          lost_ticket_daily_cents: 2400
          effective_from: '2026-08-01T00:00:00Z'
        as: FacilityManager
        captures:
          rs: $.data.id
      - call: POST /ops/rate-schedules/${rs}/publish
        payload:
          expected_facility_version: ${fac_v}
        as: FacilityManager
      - call: POST /ops/access-devices
        payload:
          facility_id: ${fac}
          device_label: E1
          device_kind: ENTRY_GATE
        as: FacilityManager
        captures:
          dev: $.data.id
      - call: POST /ops/access-devices/${dev}/heartbeat
        as: GateDevice
        as_user_id: ${dev}
      - call: POST /ops/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T10:00:00Z'
        as: FacilityManager
      - call: POST /ops/parking-sessions
        payload:
          facility_id: ${fac}
          entry_device_id: ${dev}
          ticket_barcode: LT-1
        as: GateDevice
        as_user_id: ${dev}
        captures:
          sess: $.data.id
      - call: POST /ops/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T12:00:00Z'
        as: FacilityManager
      trigger:
      - call: POST /ops/parking-sessions/${sess}/lost-ticket
        as: ParkingAttendant
        as_user_id: att-1
        captures:
          fm: $.data.fee_mode
      - call: POST /ops/parking-sessions/${sess}/quote
        as: ParkingAttendant
        as_user_id: att-1
        captures:
          fee: $.data.fee_cents
      assert:
      - fee_mode == LOST_TICKET after the lost-ticket action
      - quote fee_cents == 7200 (3 calendar dates 08-01/02/03 x 2400)
  - name: fee_event_flat_covered_by_difficulty
    claim_type: variant_divergence
    grounds:
    - calculations.transient_fee_calculation
    excluded_because:
      difficulty_instance: transitive_cascade / event_activation_cascades_posture_to_device_mode
      rationale: That instance asserts an EVENT_FLAT-pinned session quotes 1500 for a 2h stay that would bill 800 under STANDARD — the duration-independence claim.
  - name: fee_monthly_credential_zero_and_free_exit
    claim_type: correct_result
    grounds:
    - calculations.transient_fee_calculation
    - validations[priority=15]
    distinguishing_aspect: Credentialed MONTHLY sessions quote 0 at any duration and exit directly with auto-settle (tender NONE, settled 0).
    test_recipe:
      setup:
      - Facility with published tariff, ONLINE gate; ACTIVE agreement with ACTIVE credential
      setup_api_calls:
      - call: POST /ops/facilities
        payload:
          name: M0 Fac
          total_spaces: 200
