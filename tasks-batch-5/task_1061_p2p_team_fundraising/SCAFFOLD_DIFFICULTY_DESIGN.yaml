              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { event_b_id: $.data.id }
            - call: "POST /api/participants"
              payload: { campaign_id: "${camp_b_id}", display_name: "Bea Bravo" }
              as: Anonymous
              captures: { pb_id: $.data.id }
            - call: "POST /api/participants/${pb_id}/activate"
