          - state_machines.BenefitAudit.PASSED_CLOSED_to_REOPENED
          - state_machines.BenefitAudit.REOPENED_to_CORRECTED
          - state_machines.ParticipantComplaint.TRIAGED_to_RESOLVED
          - calculations.funded_status_measurement
          - entities.SettlementEntry
          - errors.ERR_AUDIT_STATE_INVALID
