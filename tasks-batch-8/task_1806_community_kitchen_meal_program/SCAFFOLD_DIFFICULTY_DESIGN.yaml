              captures: { b_status: $.data.status, b_remaining: $.data.remaining_servings }
          assert:
            - "FoodBatch.${batch_id}.status == ACCEPTED after the QUARANTINED -> INSPECTING -> ACCEPTED cycle"
            - "FoodBatch.${batch_id}.remaining_servings == 20 (30 - 10 discarded)"
      - name: meal_order_parallel_dimensions
        grounds:
          - state_machines.MealOrder
          - entities.MealOrder.fields.prep_status
          - entities.MealOrder.fields.fulfillment_status
