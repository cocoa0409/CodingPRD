# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 2549 - Flood Zone Determination & Map Amendment Support
#
# Breadth probe. The nine `section:` values and every `claim_type:` are taken
# from references/claim-extraction-guide.md; no category is invented here.
# Rows the scaffold does not surface are skipped without ceremony (e.g. the
# entities/Immutability row - every entity declares common_fields: true - and
# the soft_delete / idempotency / multi_tenancy / bulk / scheduled_actions
# complexity layers, none of which appear in complexity_profile).
# Corners already asserted by a §1.8 instance appear as `excluded_because:`
# stubs naming that instance.
#
# Every numeric literal below was computed by executing the relevant §1.3
# formula with its declared `constants:`. Clock default is
# 2026-08-01T00:00:00Z; every chain sets it explicitly anyway.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: corner_community_creation_returns_every_declared_field
        claim_type: creation
        grounds:
          - entities.Community
          - endpoints.POST_/flood-zone/communities
          - calculations.community_coverage_availability
        distinguishing_aspect: "A fully specified POST /flood-zone/communities returns 201 with all nine business fields plus the four common fields; coverage_availability is derived at creation rather than accepted from the client."
        test_recipe:
          setup:
            - "empty database; clock pinned to 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAnalyst
          trigger:
            - call: "POST /flood-zone/communities"
              payload: { community_id_code: "125129", name: "Coastal County FL", state_code: "FL", participation_status: "PROBATION", cbrs_flag: false, probation_surcharge_cents: 5000 }
              as: ProviderAnalyst
              captures: { c_id: $.data.id, c_avail: $.data.coverage_availability }
          assert:
            - "response code 201 and response_type == object"
            - "Community.${c_id}.community_id_code == 125129, .name == Coastal County FL, .state_code == FL, .participation_status == PROBATION, .cbrs_flag == false, .probation_surcharge_cents == 5000"
            - "Community.${c_id}.coverage_availability == FULL_WITH_SURCHARGE (derived from participation_status PROBATION by calculations.community_coverage_availability)"
            - "Community.${c_id}.active_folio_count == 0 and .last_participation_change_at == null"
            - "Community.${c_id}.version == 1 and .created_at == 2026-08-01T00:00:00.000Z and .id is a bare UUID with no type prefix"

      - name: corner_lender_detail_get_returns_stored_row
        claim_type: retrieval
        grounds:
          - entities.Lender
          - endpoints.GET_/flood-zone/lenders/{lender_id}
        distinguishing_aspect: "GET /flood-zone/lenders/{lender_id} echoes exactly what POST stored, including the two authorization flags and the computed open_force_placement_count, without any mutation."
        test_recipe:
          setup:
            - "one Lender created with both authorization flags true"
          setup_api_calls:
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAnalyst
            - call: "POST /flood-zone/lenders"
              payload: { name: "First Coastal Bank", contact_email: "ops@firstcoastal.example", force_placement_authorized_flag: true, escrow_servicing_flag: true }
              as: ProviderAnalyst
              captures: { lender_id: $.data.id, lender_version: $.data.version }
          trigger:
            - call: "GET /flood-zone/lenders/${lender_id}"
              payload: {}
              as: Lender
              as_user_id: "${lender_id}"
              captures: { read_name: $.data.name }
          assert:
            - "response code 200 and Lender.${lender_id}.name == First Coastal Bank, .contact_email == ops@firstcoastal.example"
            - "Lender.${lender_id}.force_placement_authorized_flag == true and .escrow_servicing_flag == true and .open_force_placement_count == 0"
            - "Lender.${lender_id}.version == 1 (the read did not bump the version) and .updated_at == .created_at"

      - name: corner_properties_list_pagination_envelope
        claim_type: listing
        grounds:
          - endpoints.GET_/flood-zone/properties
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three properties in one community, read with limit 2 / offset 0 and then offset 2, pin total_count, has_more and page length independently of the filter."
        test_recipe:
          setup:
            - "one community with exactly three properties, all ROOFTOP and GEOCODED"
          setup_api_calls:
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAnalyst
            - call: "POST /flood-zone/communities"
              payload: { community_id_code: "125129", name: "Coastal County FL", state_code: "FL" }
              as: ProviderAnalyst
              captures: { c_fl_id: $.data.id }
            - call: "POST /flood-zone/properties"
              payload: { community_id: "${c_fl_id}", street_address: "1 Bayfront Rd", city: "Miami", postal_code: "33101", map_panel_number: "12086C0312K", latitude: 25.7617, longitude: -80.1918, geocode_method: "ROOFTOP", geocode_confidence_score: 0.95 }
              as: ProviderAnalyst
              captures: { pr_1_id: $.data.id }
            - call: "POST /flood-zone/properties"
              payload: { community_id: "${c_fl_id}", street_address: "2 Bayfront Rd", city: "Miami", postal_code: "33101", map_panel_number: "12086C0312K", latitude: 25.7618, longitude: -80.1919, geocode_method: "ROOFTOP", geocode_confidence_score: 0.95 }
              as: ProviderAnalyst
              captures: { pr_2_id: $.data.id }
            - call: "POST /flood-zone/properties"
              payload: { community_id: "${c_fl_id}", street_address: "3 Bayfront Rd", city: "Miami", postal_code: "33101", map_panel_number: "12086C0312K", latitude: 25.7619, longitude: -80.1920, geocode_method: "ROOFTOP", geocode_confidence_score: 0.95 }
              as: ProviderAnalyst
              captures: { pr_3_id: $.data.id }
          trigger:
            - call: "GET /flood-zone/properties"
              payload: { community_id: "${c_fl_id}", limit: 2, offset: 0 }
              as: Borrower
              captures: { page1_row0_id: "$.data[0].id", page1_row1_id: "$.data[1].id" }
            - call: "GET /flood-zone/properties"
              payload: { community_id: "${c_fl_id}", limit: 2, offset: 2 }
              as: Borrower
              captures: { page2_row0_id: "$.data[0].id" }
          assert:
            - "page 1: response_type == array, limit == 2, offset == 0, total_count == 3, has_more == true, exactly 2 rows returned"
            - "page 2: limit == 2, offset == 2, total_count == 3, has_more == false, exactly 1 row returned"
            - "the union of the two pages is exactly {${pr_1_id}, ${pr_2_id}, ${pr_3_id}} with no row repeated across pages"
            - "GET /flood-zone/properties with no query parameters applies pagination_defaults limit 10 offset 0 and returns all 3 rows with has_more == false"

      - name: corner_determination_detail_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_DETERMINATION_NOT_FOUND]
          - validations.priority_5_ERR_<ENTITY>_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unknown UUID in the path yields the entity-specific 404 error_id, not a generic 404 and not ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "empty database (no Determination rows at all)"
          setup_api_calls:
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAnalyst
          trigger:
            - call: "GET /flood-zone/determinations/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ProviderAnalyst
          assert:
            - "response code 404 with response_type == error and data.error_id == ERR_DETERMINATION_NOT_FOUND"
            - "data.message is a non-empty string and no entity field is echoed in the error envelope"
            - "the same unknown id on GET /flood-zone/disputes/{dispute_id} returns ERR_DISPUTE_NOT_FOUND, so the error_id is entity-specific rather than shared"

      - name: corner_structure_create_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - validations.priority_4_ERR_INVALID_REQUEST
          - endpoints.POST_/flood-zone/structures
        distinguishing_aspect: "Omitting replacement_cost_cents - a required input with no default - is a 400 shape failure at priority 4, ahead of any FK or business check."
        test_recipe:
          setup:
            - "one community and one property exist, so the property FK in the payload is valid and only the missing field can fail"
          setup_api_calls:
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAnalyst
            - call: "POST /flood-zone/communities"
              payload: { community_id_code: "125129", name: "Coastal County FL", state_code: "FL" }
              as: ProviderAnalyst
              captures: { c_fl_id: $.data.id }
            - call: "POST /flood-zone/properties"
              payload: { community_id: "${c_fl_id}", street_address: "11 Bayfront Rd", city: "Miami", postal_code: "33101", map_panel_number: "12086C0312K", latitude: 25.7617, longitude: -80.1918, geocode_method: "ROOFTOP", geocode_confidence_score: 0.95 }
              as: ProviderAnalyst
              captures: { pr_a_id: $.data.id }
          trigger:
            - call: "POST /flood-zone/structures"
              payload: { property_id: "${pr_a_id}", structure_label: "Main dwelling", occupancy_type: "SINGLE_FAMILY", foundation_type: "SLAB", sfha_offset_ft: -12.0 }
              as: ProviderAnalyst
          assert:
            - "response code 400 with data.error_id == ERR_INVALID_REQUEST"
            - "no Structure row was created: GET /flood-zone/structures?property_id=${pr_a_id} returns total_count 0"
            - "Property.${pr_a_id}.structure_count == 0 (the rejected create left the parent's derived count untouched)"
            - "an unknown extra field in an otherwise complete payload is rejected by the same rule with the same 400 ERR_INVALID_REQUEST"

      - name: corner_community_optional_inputs_take_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Community.participation_status
          - entities.Community.cbrs_flag
          - entities.Community.probation_surcharge_cents
        distinguishing_aspect: "Omitting all three optional inputs yields REGULAR / false / 0 and therefore coverage_availability FULL - the defaults are applied by the server, not required from the client."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAnalyst
          trigger:
            - call: "POST /flood-zone/communities"
              payload: { community_id_code: "125129", name: "Coastal County FL", state_code: "FL" }
              as: ProviderAnalyst
              captures: { c_id: $.data.id, c_status: $.data.participation_status }
          assert:
            - "Community.${c_id}.participation_status == REGULAR, .cbrs_flag == false, .probation_surcharge_cents == 0"
            - "Community.${c_id}.coverage_availability == FULL (the default participation status falls through every clause of calculations.community_coverage_availability)"
            - "a second community created identically except cbrs_flag true has coverage_availability == UNAVAILABLE, proving the default is false and not merely absent"

      - name: corner_property_geocode_fields_computed_from_method_and_score
        claim_type: computed_fields
        grounds:
          - entities.Property.geocode_status
          - entities.Property.geocode_buffer_ft
          - calculations.structure_zone_determination.constants.GEOCODE_BUFFER_FT
        distinguishing_aspect: "geocode_status and geocode_buffer_ft are derived from (geocode_method, geocode_confidence_score) - a ZIP_CENTROID hit at confidence 0.55 lands UNRESOLVED with a 250 ft buffer even though the client supplied neither field."
        test_recipe:
          setup:
            - "one community; no panel is needed because Property.map_panel_number is a plain string, not a foreign key"
          setup_api_calls:
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAnalyst
            - call: "POST /flood-zone/communities"
              payload: { community_id_code: "125129", name: "Coastal County FL", state_code: "FL" }
              as: ProviderAnalyst
              captures: { c_fl_id: $.data.id }
          trigger:
            - call: "POST /flood-zone/properties"
              payload: { community_id: "${c_fl_id}", street_address: "77 Inland Ave", city: "Miami", postal_code: "33101", map_panel_number: "12086C0312K", latitude: 25.8000, longitude: -80.3000, geocode_method: "ZIP_CENTROID", geocode_confidence_score: 0.55 }
              as: ProviderAnalyst
              captures: { pr_z_id: $.data.id, pr_z_status: $.data.geocode_status, pr_z_buffer: $.data.geocode_buffer_ft }
          assert:
            - "Property.${pr_z_id}.geocode_buffer_ft == 250 (GEOCODE_BUFFER_FT[ZIP_CENTROID])"
            - "Property.${pr_z_id}.geocode_status == UNRESOLVED (confidence 0.55 < 0.60)"
            - "Property.${pr_z_id}.geocode_corrected_count == 0 and .structure_count == 0"
            - "a ZIP_CENTROID property created with geocode_confidence_score 0.60 instead is GEOCODED with the same buffer 250, so the two computed fields are independent of each other"

      - name: corner_loan_folio_system_fields_minted_by_server
        claim_type: system_fields
        grounds:
          - entities.LoanFolio.initial_escrow_balance_cents
          - entities.LoanFolio.monitoring_status
          - entities.LoanFolio.insurance_status
        distinguishing_aspect: "The folio's system fields are minted at creation: initial_escrow_balance_cents mirrors the supplied escrow, the two status dimensions take their §1.2 initial states, and version starts at 1."
        test_recipe:
          setup:
            - "community, lender and property exist; the folio is created with escrow_balance_cents 500000"
          setup_api_calls:
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAnalyst
            - call: "POST /flood-zone/communities"
              payload: { community_id_code: "125129", name: "Coastal County FL", state_code: "FL" }
              as: ProviderAnalyst
              captures: { c_fl_id: $.data.id }
            - call: "POST /flood-zone/lenders"
              payload: { name: "First Coastal Bank", contact_email: "ops@firstcoastal.example" }
              as: ProviderAnalyst
              captures: { lender_id: $.data.id }
            - call: "POST /flood-zone/properties"
              payload: { community_id: "${c_fl_id}", street_address: "11 Bayfront Rd", city: "Miami", postal_code: "33101", map_panel_number: "12086C0312K", latitude: 25.7617, longitude: -80.1918, geocode_method: "ROOFTOP", geocode_confidence_score: 0.95 }
              as: ProviderAnalyst
              captures: { pr_a_id: $.data.id }
          trigger:
            - call: "POST /flood-zone/loan-folios"
              payload: { lender_id: "${lender_id}", property_id: "${pr_a_id}", loan_number: "LN-4401", borrower_user_id: "borrower-a", principal_balance_cents: 28000000, policy_anniversary_date: "2027-03-15T00:00:00Z", escrow_balance_cents: 500000 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { f_a_id: $.data.id, f_a_version: $.data.version, f_a_initial: $.data.initial_escrow_balance_cents }
          assert:
            - "response code 201; LoanFolio.${f_a_id}.initial_escrow_balance_cents == 500000 == .escrow_balance_cents"
            - "LoanFolio.${f_a_id}.monitoring_status == ACTIVE and .insurance_status == NONE (the two declared initial states)"
            - "LoanFolio.${f_a_id}.current_determination_id == null, .required_coverage_cents == 0, .reported_coverage_cents == 0, .open_notice_count == 0, .pending_redetermination_count == 0, .compliance_posture == COMPLIANT"
            - "LoanFolio.${f_a_id}.version == 1 and .force_placed_at == null and .cumulative_earned_premium_cents == 0"
            - "Community.${c_fl_id}.active_folio_count == 1 after the create"

      - name: corner_property_invalid_geocode_method_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Property.geocode_method
          - validations.priority_4_ERR_INVALID_REQUEST
        distinguishing_aspect: "An out-of-range enum value and an out-of-range numeric both fail the same priority-4 shape check with 400 - enum closure is enforced on input, not silently coerced."
        test_recipe:
          setup:
            - "one community exists"
          setup_api_calls:
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAnalyst
            - call: "POST /flood-zone/communities"
              payload: { community_id_code: "125129", name: "Coastal County FL", state_code: "FL" }
              as: ProviderAnalyst
              captures: { c_fl_id: $.data.id }
          trigger:
            - call: "POST /flood-zone/properties"
              payload: { community_id: "${c_fl_id}", street_address: "11 Bayfront Rd", city: "Miami", postal_code: "33101", map_panel_number: "12086C0312K", latitude: 25.7617, longitude: -80.1918, geocode_method: "STREET_INTERPOLATED", geocode_confidence_score: 0.95 }
              as: ProviderAnalyst
          assert:
            - "response code 400 with data.error_id == ERR_INVALID_REQUEST (STREET_INTERPOLATED is not in {ROOFTOP, PARCEL_CENTROID, ZIP_CENTROID, FAILED})"
            - "geocode_confidence_score 1.40 with a valid method is rejected by the same rule (declared range 0.00..1.00)"
            - "GET /flood-zone/properties?community_id=${c_fl_id} returns total_count 0 - neither rejected payload was persisted"

      - name: corner_structure_unknown_property_fk_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations.priority_6_ERR_<ENTITY>_NOT_FOUND
          - entities.Structure.property_id
        distinguishing_aspect: "A body FK that does not resolve is a 404 naming the referenced entity (flat topology: cross-reference integrity), and it is checked after shape but before any business rule."
        test_recipe:
          setup:
            - "one community exists; no Property row exists"
          setup_api_calls:
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAnalyst
            - call: "POST /flood-zone/communities"
              payload: { community_id_code: "125129", name: "Coastal County FL", state_code: "FL" }
              as: ProviderAnalyst
              captures: { c_fl_id: $.data.id }
          trigger:
            - call: "POST /flood-zone/structures"
              payload: { property_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", structure_label: "Main dwelling", occupancy_type: "SINGLE_FAMILY", foundation_type: "SLAB", replacement_cost_cents: 32000000, sfha_offset_ft: -12.0 }
              as: ProviderAnalyst
          assert:
            - "response code 404 with data.error_id == ERR_PROPERTY_NOT_FOUND"
            - "the shape check ran first: the same payload with an unknown property_id AND a bad occupancy_type returns 400 ERR_INVALID_REQUEST instead"
            - "no Structure row exists afterwards"

      - name: corner_structures_filtered_list_reverse_lookup_by_property
        claim_type: listing
        grounds:
          - endpoints.GET_/flood-zone/structures
          - entities.Structure.property_id
        distinguishing_aspect: "The Structure -> Property foreign key is reverse-reachable through the filtered-list form: the property_id filter partitions two properties' structures exactly, with pagination metadata scoped to the filter."
        test_recipe:
          setup:
            - "one community with two properties: property A carries two structures, property B carries one"
          setup_api_calls:
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAnalyst
            - call: "POST /flood-zone/communities"
              payload: { community_id_code: "125129", name: "Coastal County FL", state_code: "FL" }
              as: ProviderAnalyst
              captures: { c_fl_id: $.data.id }
            - call: "POST /flood-zone/properties"
              payload: { community_id: "${c_fl_id}", street_address: "11 Bayfront Rd", city: "Miami", postal_code: "33101", map_panel_number: "12086C0312K", latitude: 25.7617, longitude: -80.1918, geocode_method: "ROOFTOP", geocode_confidence_score: 0.95 }
              as: ProviderAnalyst
              captures: { pr_a_id: $.data.id }
            - call: "POST /flood-zone/properties"
              payload: { community_id: "${c_fl_id}", street_address: "12 Bayfront Rd", city: "Miami", postal_code: "33101", map_panel_number: "12086C0312K", latitude: 25.7620, longitude: -80.1921, geocode_method: "ROOFTOP", geocode_confidence_score: 0.95 }
              as: ProviderAnalyst
              captures: { pr_b_id: $.data.id }
            - call: "POST /flood-zone/structures"
              payload: { property_id: "${pr_a_id}", structure_label: "A main", occupancy_type: "SINGLE_FAMILY", foundation_type: "SLAB", replacement_cost_cents: 32000000, sfha_offset_ft: -12.0 }
              as: ProviderAnalyst
              captures: { st_a1_id: $.data.id }
            - call: "POST /flood-zone/structures"
              payload: { property_id: "${pr_a_id}", structure_label: "A detached garage", occupancy_type: "NON_RESIDENTIAL", foundation_type: "SLAB", replacement_cost_cents: 4000000, sfha_offset_ft: -12.0 }
              as: ProviderAnalyst
              captures: { st_a2_id: $.data.id }
            - call: "POST /flood-zone/structures"
              payload: { property_id: "${pr_b_id}", structure_label: "B main", occupancy_type: "SINGLE_FAMILY", foundation_type: "CRAWLSPACE", replacement_cost_cents: 28000000, sfha_offset_ft: 40.0 }
              as: ProviderAnalyst
              captures: { st_b1_id: $.data.id }
          trigger:
            - call: "GET /flood-zone/structures"
              payload: { property_id: "${pr_a_id}" }
              as: Lender
              captures: { a_row0_id: "$.data[0].id", a_row1_id: "$.data[1].id" }
            - call: "GET /flood-zone/structures"
              payload: { property_id: "${pr_b_id}", occupancy_type: "SINGLE_FAMILY" }
              as: Lender
              captures: { b_row0_id: "$.data[0].id" }
          assert:
            - "property A filter: total_count == 2, has_more == false, rows are exactly {${st_a1_id}, ${st_a2_id}}"
            - "property B filter combined with occupancy_type SINGLE_FAMILY: total_count == 1, row is ${st_b1_id}"
            - "Property.${pr_a_id}.structure_count == 2 and Property.${pr_b_id}.structure_count == 1 - the derived count agrees with the filtered list"
            - "GET /flood-zone/structures with no filter returns total_count 3, so the filter narrows rather than the list being pre-scoped"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: corner_dispute_created_in_initial_state_submitted
        claim_type: initial_state
        grounds:
          - state_machines.Dispute.initial_state
          - endpoints.POST_/flood-zone/disputes
          - entities.Dispute.decision_due_at
        distinguishing_aspect: "A freshly filed dispute is SUBMITTED with round_number 1 and both review fields null, and it locks the determination into UNDER_DISPUTE in the same response."
        test_recipe:
          setup:
            - "FL community, lender, panel seq 1 EFFECTIVE (zone AE, BFE 7.75), ROOFTOP property, structure sfha_offset_ft -12.0, folio for borrower-a, ORIGINATION determination ISSUED"
            - "basis STRUCTURE_LOCATION carries no extra admissibility precondition in priority 28, so the dispute is admissible as filed"
          setup_api_calls:
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAnalyst
            - call: "POST /flood-zone/communities"
              payload: { community_id_code: "125129", name: "Coastal County FL", state_code: "FL" }
              as: ProviderAnalyst
              captures: { c_fl_id: $.data.id }
            - call: "POST /flood-zone/lenders"
              payload: { name: "First Coastal Bank", contact_email: "ops@firstcoastal.example" }
              as: ProviderAnalyst
