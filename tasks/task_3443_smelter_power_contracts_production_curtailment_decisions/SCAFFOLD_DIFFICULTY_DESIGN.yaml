scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: power_contract_forward_vs_settled_cost
        grounds:
          - calculations.effective_power_cost
          - entities.PowerContract.fields.forward_cost_per_mwh
          - entities.PowerContract.fields.settled_cost_per_mwh
        distinguishing_aspect: |
          Two variants on the PowerContract domain: FORWARD prices the identical
          component stack off the single latest spot print; SETTLED replays every
          intra-month observation time-weighted. Same contract, same observations,
          different USD/MWh.
        test_recipe:
          setup:
            - "Smelter in NA_NORTHWEST with one ACTIVE contract: FIXED 150MW @ 32.00, MARKET_INDEXED 100MW, INTERRUPTIBLE 50MW (cap 500h); logical clock 2026-09-11; spot prints 48.00 (2026-08-20), 40.00 (2026-09-01), 60.00 (2026-09-06)."
          setup_api_calls:
            - call: "POST /smelter-ops/smelters"
              payload: { name: "Riverbend", region_code: "NA_NORTHWEST", rated_capacity_tpd: 1000, labor_headcount: 450 }
              as: PlatformAdmin
              captures: { sm: $.data.id }
            - call: "POST /smelter-ops/power-contracts"
              payload: { smelter_id: "${sm}", supplier_name: "Bonneville", window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z", components: [ { component_type: "FIXED", volume_mw: 150, fixed_price_per_mwh: 32.00 }, { component_type: "MARKET_INDEXED", volume_mw: 100 }, { component_type: "INTERRUPTIBLE", volume_mw: 50, interruptible_cap_hours_per_year: 500 } ], take_or_pay_pct: 0.9 }
              as: EnergyManager
              captures: { pc: $.data.id }
            - call: "POST /smelter-ops/power-contracts/${pc}/activate"
              payload: {}
              as: EnergyManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /smelter-ops/price-observations"
              payload: { instrument: "POWER_SPOT", region_code: "NA_NORTHWEST", observed_at: "2026-08-20T00:00:00Z", price_usd: 48.00 }
              as: TradingAnalyst
            - call: "POST /smelter-ops/price-observations"
              payload: { instrument: "POWER_SPOT", region_code: "NA_NORTHWEST", observed_at: "2026-09-01T00:00:00Z", price_usd: 40.00 }
              as: TradingAnalyst
            - call: "POST /smelter-ops/price-observations"
              payload: { instrument: "POWER_SPOT", region_code: "NA_NORTHWEST", observed_at: "2026-09-06T00:00:00Z", price_usd: 60.00 }
              as: TradingAnalyst
          trigger:
            - call: "GET /smelter-ops/power-contracts/${pc}"
              as: EnergyManager
              captures: { fwd: $.data.forward_cost_per_mwh, settled: $.data.settled_cost_per_mwh }
          assert:
            - "PowerContract.${pc}.forward_cost_per_mwh == 43.50 (latest spot 60.00: (150*32 + 100*60 + 50*60*0.75)/300)"
            - "PowerContract.${pc}.settled_cost_per_mwh == 38.92 (time-weighted average 50.00 over 120h @ 40.00 + 120h @ 60.00)"
            - "forward_cost_per_mwh != settled_cost_per_mwh for identical contract and observation set"

      - name: alumina_transfer_cost_plus_vs_market_linked
        grounds:
          - calculations.internal_transfer_price
          - entities.AluminaSupplyAgreement.fields.current_transfer_price
        distinguishing_aspect: |
          Different entity domain (AluminaSupplyAgreement, not PowerContract): two
          agreements for the same smelter, one COST_PLUS and one MARKET_LINKED, read
          at the same clock produce different transfer prices (345.00 vs 326.40).
        test_recipe:
          setup:
            - "Smelter exists; ALUMINA_INDEX print 340.00 @ 2026-08-15; two agreements: COST_PLUS base 300.00 markup 0.15, and MARKET_LINKED discount 0.04."
          setup_api_calls:
            - call: "POST /smelter-ops/smelters"
              payload: { name: "Riverbend", region_code: "NA_NORTHWEST", rated_capacity_tpd: 1000, labor_headcount: 450 }
              as: PlatformAdmin
              captures: { sm: $.data.id }
            - call: "POST /smelter-ops/price-observations"
              payload: { instrument: "ALUMINA_INDEX", region_code: "GLOBAL", observed_at: "2026-08-15T00:00:00Z", price_usd: 340.00 }
              as: TradingAnalyst
            - call: "POST /smelter-ops/alumina-agreements"
              payload: { smelter_id: "${sm}", refinery_name: "RefineryNorth", pricing_model: "COST_PLUS", base_cost_per_tonne: 300.00, markup_pct: 0.15, monthly_volume_tonnes: 8000 }
              as: Controller
              captures: { ag_cp: $.data.id }
            - call: "POST /smelter-ops/alumina-agreements"
              payload: { smelter_id: "${sm}", refinery_name: "RefinerySouth", pricing_model: "MARKET_LINKED", market_discount_pct: 0.04, monthly_volume_tonnes: 4000 }
              as: Controller
              captures: { ag_ml: $.data.id }
          trigger:
            - call: "GET /smelter-ops/smelters/${sm}/alumina-agreements"
              as: Controller
          assert:
            - "AluminaSupplyAgreement.${ag_cp}.current_transfer_price == 345.00 (300.00 * 1.15)"
            - "AluminaSupplyAgreement.${ag_ml}.current_transfer_price == 326.40 (340.00 * 0.96)"
            - "the two variants diverge by 18.60 for the same smelter at the same clock"

  - rule_id: combinatorial_formula
    instances:
      - name: curtailment_margin_gate_multifactor
        grounds:
          - calculations.curtailment_margin_gate
          - entities.CurtailmentDecision.fields.economics_snapshot
        distinguishing_aspect: |
          Mode (a): four market/contract inputs (lme, premium, transfer, power)
          interact non-linearly through the nested max(0, RESTART_RESERVE - margin)
          branch and the < threshold flag; the snapshot freezes every intermediate.
        test_recipe:
          setup:
            - "Smelter NA_NORTHWEST 1000 tpd; ACTIVE blended contract; potline 500 tpd OPERATING; COST_PLUS agreement at 345.00; LME 1750.00, premium 280.00, spot 96.00 (forward power cost 60.00)."
          setup_api_calls:
            - call: "POST /smelter-ops/smelters"
              payload: { name: "Riverbend", region_code: "NA_NORTHWEST", rated_capacity_tpd: 1000, labor_headcount: 450 }
              as: PlatformAdmin
              captures: { sm: $.data.id }
            - call: "POST /smelter-ops/power-contracts"
              payload: { smelter_id: "${sm}", supplier_name: "Bonneville", window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z", components: [ { component_type: "FIXED", volume_mw: 150, fixed_price_per_mwh: 32.00 }, { component_type: "MARKET_INDEXED", volume_mw: 100 }, { component_type: "INTERRUPTIBLE", volume_mw: 50, interruptible_cap_hours_per_year: 500 } ] }
              as: EnergyManager
              captures: { pc: $.data.id }
            - call: "POST /smelter-ops/power-contracts/${pc}/activate"
              payload: {}
              as: EnergyManager
            - call: "POST /smelter-ops/potlines"
              payload: { smelter_id: "${sm}", line_code: "P1", capacity_tpd: 500, amperage_ka: 320 }
              as: SmelterManager
              captures: { pl: $.data.id, pv: $.data.version }
            - call: "POST /smelter-ops/alumina-agreements"
              payload: { smelter_id: "${sm}", refinery_name: "RefineryNorth", pricing_model: "COST_PLUS", base_cost_per_tonne: 300.00, markup_pct: 0.15, monthly_volume_tonnes: 8000 }
              as: Controller
            - call: "POST /smelter-ops/price-observations"
              payload: { instrument: "ALUMINUM_LME", region_code: "GLOBAL", observed_at: "2026-08-15T00:00:00Z", price_usd: 1750.00 }
              as: TradingAnalyst
            - call: "POST /smelter-ops/price-observations"
              payload: { instrument: "REGIONAL_PREMIUM", region_code: "NA_NORTHWEST", observed_at: "2026-08-15T00:00:00Z", price_usd: 280.00 }
              as: TradingAnalyst
            - call: "POST /smelter-ops/price-observations"
              payload: { instrument: "POWER_SPOT", region_code: "NA_NORTHWEST", observed_at: "2026-08-20T00:00:00Z", price_usd: 96.00 }
              as: EnergyManager
          trigger:
            - call: "POST /smelter-ops/curtailment-decisions"
              payload: { potline_id: "${pl}", expected_potline_version: "${pv}", trigger_type: "POWER_PRICE", depth_pct: 50, planned_start: "2026-09-10T00:00:00Z", planned_end: "2026-10-10T00:00:00Z" }
              as: SmelterManager
              as_user_id: "mgr-1"
              captures: { dec: $.data.id }
          assert:
            - "CurtailmentDecision.${dec}.economics_snapshot.lme_price_usd == 1750.00"
            - "CurtailmentDecision.${dec}.economics_snapshot.regional_premium_usd == 280.00"
            - "CurtailmentDecision.${dec}.economics_snapshot.transfer_price_per_tonne == 345.00"
            - "CurtailmentDecision.${dec}.economics_snapshot.power_cost_per_mwh == 60.00 (forward variant at spot 96.00)"
            - "CurtailmentDecision.${dec}.economics_snapshot.margin_per_tonne == 137.60 (1750 + 280 - 1.92*345 - 13.5*60 - 420)"
            - "CurtailmentDecision.${dec}.economics_snapshot.curtailment_economic == true (137.60 < 150.00)"
            - "CurtailmentDecision.${dec}.economics_snapshot.avoidable_loss_per_tonne == 12.40 (max(0, 150 - 137.60))"

      - name: monthly_settlement_round_per_hour_then_sum
        grounds:
          - calculations.monthly_power_settlement
          - entities.PowerContract.fields.month_to_date_settlement_usd
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. Pinned order rounds each
          hourly energy cost to cents before summing (24 * 5555.21 = 133325.04);
          the forbidden sum-then-round order yields 133325.02. Different mode than
          the margin-gate instance (which is mode (a)).
        test_recipe:
          setup:
            - "Smelter NA_NORTHWEST; ACTIVE contract with a single MARKET_INDEXED 100MW component; one spot print 53.57 @ 2026-08-25; clock advanced to 2026-09-02T00:00:00Z so exactly 24 hourly costs elapse in September."
          setup_api_calls:
            - call: "POST /smelter-ops/smelters"
              payload: { name: "Riverbend", region_code: "NA_NORTHWEST", rated_capacity_tpd: 1000, labor_headcount: 450 }
              as: PlatformAdmin
              captures: { sm: $.data.id }
            - call: "POST /smelter-ops/power-contracts"
              payload: { smelter_id: "${sm}", supplier_name: "Bonneville", window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z", components: [ { component_type: "MARKET_INDEXED", volume_mw: 100 } ] }
              as: EnergyManager
              captures: { pc: $.data.id }
            - call: "POST /smelter-ops/power-contracts/${pc}/activate"
              payload: {}
              as: EnergyManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /smelter-ops/price-observations"
              payload: { instrument: "POWER_SPOT", region_code: "NA_NORTHWEST", observed_at: "2026-08-25T00:00:00Z", price_usd: 53.57 }
              as: EnergyManager
          trigger:
            - call: "GET /smelter-ops/power-contracts/${pc}"
              as: EnergyManager
              captures: { mtd: $.data.month_to_date_settlement_usd }
          assert:
            - "PowerContract.${pc}.month_to_date_settlement_usd == 133325.04 (24 * round_half_up(100 * 53.57 * 1.037, 2) = 24 * 5555.21)"
            - "133325.04 != 133325.02, the value produced by the forbidden sum-then-round order"

  - rule_id: non_linear_state_machine
    instances:
      - name: potline_curtail_idle_restart_cycle
        grounds:
          - state_machines.Potline.OPERATING_to_CURTAILED
          - state_machines.Potline.CURTAILED_to_IDLE
          - state_machines.Potline.IDLE_to_RESTARTING
          - state_machines.Potline.RESTARTING_to_OPERATING
        distinguishing_aspect: |
          Cyclic machine on Potline: OPERATING -> CURTAILED -> IDLE -> RESTARTING
          -> OPERATING closes the loop; the restart leg is reachable only through a
          RestartPlan child, and the restart_cost_class depends on accumulated
          downtime, so the cycle is not a plain revert.
        test_recipe:
          setup:
            - "Smelter with ACTIVE contract (window covers default clock), ACTIVE SPL_DISPOSAL permit, potline P1 500 tpd OPERATING."
          setup_api_calls:
            - call: "POST /smelter-ops/smelters"
              payload: { name: "Riverbend", region_code: "NA_NORTHWEST", rated_capacity_tpd: 1000, labor_headcount: 450 }
              as: PlatformAdmin
              captures: { sm: $.data.id }
            - call: "POST /smelter-ops/power-contracts"
              payload: { smelter_id: "${sm}", supplier_name: "Bonneville", window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z", components: [ { component_type: "FIXED", volume_mw: 150, fixed_price_per_mwh: 32.00 } ] }
              as: EnergyManager
              captures: { pc: $.data.id }
            - call: "POST /smelter-ops/power-contracts/${pc}/activate"
              payload: {}
              as: EnergyManager
            - call: "POST /smelter-ops/environmental-permits"
              payload: { smelter_id: "${sm}", permit_type: "SPL_DISPOSAL", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-06-01T00:00:00Z" }
              as: EHSManager
            - call: "POST /smelter-ops/potlines"
              payload: { smelter_id: "${sm}", line_code: "P1", capacity_tpd: 500, amperage_ka: 320 }
              as: SmelterManager
              captures: { pl: $.data.id }
          trigger:
            - call: "POST /smelter-ops/potlines/${pl}/curtail"
              payload: { depth_pct: 40 }
              as: SmelterManager
            - call: "POST /smelter-ops/potlines/${pl}/curtail"
              payload: { depth_pct: 100 }
              as: SmelterManager
            - call: "POST /smelter-ops/restart-plans"
              payload: { potline_id: "${pl}", planned_restart_at: "2026-09-05T00:00:00Z" }
              as: SmelterManager
              captures: { rp: $.data.id }
            - call: "POST /smelter-ops/restart-plans/${rp}/start"
              payload: {}
              as: SmelterManager
            - call: "POST /smelter-ops/restart-plans/${rp}/complete"
              payload: {}
              as: SmelterManager
            - call: "GET /smelter-ops/potlines/${pl}"
              as: SmelterManager
              captures: { final_status: $.data.operating_status, final_depth: $.data.curtailment_depth_pct }
          assert:
            - "after curtail 40: Potline.${pl}.operating_status == CURTAILED and curtailment_depth_pct == 40"
            - "after curtail 100: operating_status == IDLE and curtailment_depth_pct == 100"
            - "RestartPlan.${rp}.restart_cost_class == HOT and estimated_cost_usd == 100000 (80000 + 40*500, idle < 24h at creation)"
            - "after start: potline RESTARTING; after complete: potline OPERATING with curtailment_depth_pct == 0 and curtailed_since == null"
            - "the cycle returned the potline to OPERATING without any SHUTDOWN transition"

      - name: decision_reject_revise_cycle
        grounds:
          - state_machines.CurtailmentDecision.LABOR_REVIEW_to_REJECTED
          - state_machines.CurtailmentDecision.REJECTED_to_ECONOMIC_REVIEW
        distinguishing_aspect: |
          Cyclic machine on a different entity (CurtailmentDecision, not Potline):
          ECONOMIC_REVIEW -> LABOR_REVIEW -> REJECTED -> ECONOMIC_REVIEW revision
          loop, and the loop back-edge clears the economic reviewer and recomputes
          the economics snapshot.
        test_recipe:
          setup:
            - "Smelter with ACTIVE blended contract, potline 500 tpd, COST_PLUS agreement (345.00), LME 2400.00, premium 380.00, spot 48.00 (forward power 38.00, margin 1184.60)."
          setup_api_calls:
            - call: "POST /smelter-ops/smelters"
              payload: { name: "Riverbend", region_code: "NA_NORTHWEST", rated_capacity_tpd: 1000, labor_headcount: 450 }
              as: PlatformAdmin
              captures: { sm: $.data.id }
            - call: "POST /smelter-ops/power-contracts"
              payload: { smelter_id: "${sm}", supplier_name: "Bonneville", window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z", components: [ { component_type: "FIXED", volume_mw: 150, fixed_price_per_mwh: 32.00 }, { component_type: "MARKET_INDEXED", volume_mw: 100 }, { component_type: "INTERRUPTIBLE", volume_mw: 50, interruptible_cap_hours_per_year: 500 } ] }
              as: EnergyManager
              captures: { pc: $.data.id }
            - call: "POST /smelter-ops/power-contracts/${pc}/activate"
              payload: {}
              as: EnergyManager
            - call: "POST /smelter-ops/potlines"
              payload: { smelter_id: "${sm}", line_code: "P1", capacity_tpd: 500, amperage_ka: 320 }
              as: SmelterManager
              captures: { pl: $.data.id, pv: $.data.version }
            - call: "POST /smelter-ops/alumina-agreements"
              payload: { smelter_id: "${sm}", refinery_name: "RefineryNorth", pricing_model: "COST_PLUS", base_cost_per_tonne: 300.00, markup_pct: 0.15, monthly_volume_tonnes: 8000 }
              as: Controller
            - call: "POST /smelter-ops/price-observations"
              payload: { instrument: "ALUMINUM_LME", region_code: "GLOBAL", observed_at: "2026-08-15T00:00:00Z", price_usd: 2400.00 }
              as: TradingAnalyst
            - call: "POST /smelter-ops/price-observations"
              payload: { instrument: "REGIONAL_PREMIUM", region_code: "NA_NORTHWEST", observed_at: "2026-08-15T00:00:00Z", price_usd: 380.00 }
              as: TradingAnalyst
            - call: "POST /smelter-ops/price-observations"
              payload: { instrument: "POWER_SPOT", region_code: "NA_NORTHWEST", observed_at: "2026-08-20T00:00:00Z", price_usd: 48.00 }
              as: EnergyManager
            - call: "POST /smelter-ops/curtailment-decisions"
              payload: { potline_id: "${pl}", expected_potline_version: "${pv}", trigger_type: "METAL_PRICE", depth_pct: 50, planned_start: "2026-09-10T00:00:00Z", planned_end: "2026-10-10T00:00:00Z" }
              as: SmelterManager
              as_user_id: "mgr-1"
              captures: { dec: $.data.id }
            - call: "POST /smelter-ops/curtailment-decisions/${dec}/economic-approve"
              payload: {}
              as: Controller
              as_user_id: "ctrl-1"
          trigger:
            - call: "POST /smelter-ops/curtailment-decisions/${dec}/reject"
              payload: {}
              as: VPOperations
              as_user_id: "vp-1"
            - call: "POST /smelter-ops/curtailment-decisions/${dec}/revise"
              payload: { depth_pct: 60, planned_start: "2026-09-12T00:00:00Z", planned_end: "2026-10-12T00:00:00Z" }
              as: SmelterManager
              as_user_id: "mgr-1"
          assert:
            - "after economic-approve: CurtailmentDecision.${dec}.status == LABOR_REVIEW"
            - "after reject: status == REJECTED"
            - "after revise: status == ECONOMIC_REVIEW (cycle back-edge)"
            - "after revise: economic_reviewed_by_user_id == null (review state cleared by the loop)"
            - "after revise: depth_pct == 60 and economics_snapshot.margin_per_tonne == 1184.60 (recomputed from unchanged inputs)"

  - rule_id: transitive_cascade
    instances:
      - name: decision_execute_cascade_depth3
        grounds:
          - state_machines.CurtailmentDecision.APPROVED_to_EXECUTED
          - entities.PowerContract.fields.take_or_pay_exposed
          - entities.Smelter.fields.operating_posture
          - entities.Smelter.fields.curtailed_capacity_tpd
        distinguishing_aspect: |
          Depth-3 chain triggered by decision execute: (1) decision -> potline
          mutates Potline.operating_status to CURTAILED; (2) the potline mutation
          — not the original action — forces Smelter.operating_posture and
          curtailed_capacity_tpd to recompute; (3) the posture change flips the
          ACTIVE PowerContract's take_or_pay_exposed flag. Each link is caused by
          the previous link's mutation.
        test_recipe:
          setup:
            - "Smelter 1000 tpd with two potlines (P1 500, P2 300, both OPERATING), ACTIVE blended contract, labor agreement notice_period_days 0, OPEN hedge 20000t for 2026-09 (coverage 0.6667), price set LME 2400 / premium 380 / ALUMINA_INDEX 340, APPROVED decision depth 60 on P1."
          setup_api_calls:
            - call: "POST /smelter-ops/smelters"
              payload: { name: "Riverbend", region_code: "NA_NORTHWEST", rated_capacity_tpd: 1000, labor_headcount: 450 }
              as: PlatformAdmin
              captures: { sm: $.data.id }
            - call: "POST /smelter-ops/power-contracts"
              payload: { smelter_id: "${sm}", supplier_name: "Bonneville", window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z", components: [ { component_type: "FIXED", volume_mw: 150, fixed_price_per_mwh: 32.00 }, { component_type: "MARKET_INDEXED", volume_mw: 100 }, { component_type: "INTERRUPTIBLE", volume_mw: 50, interruptible_cap_hours_per_year: 500 } ] }
              as: EnergyManager
              captures: { pc: $.data.id }
            - call: "POST /smelter-ops/power-contracts/${pc}/activate"
              payload: {}
              as: EnergyManager
            - call: "POST /smelter-ops/potlines"
              payload: { smelter_id: "${sm}", line_code: "P1", capacity_tpd: 500, amperage_ka: 320 }
              as: SmelterManager
              captures: { pl1: $.data.id, pv1: $.data.version }
            - call: "POST /smelter-ops/potlines"
              payload: { smelter_id: "${sm}", line_code: "P2", capacity_tpd: 300, amperage_ka: 280 }
              as: SmelterManager
              captures: { pl2: $.data.id }
            - call: "POST /smelter-ops/labor-agreements"
              payload: { smelter_id: "${sm}", union_name: "USW-2026", notice_period_days: 0, severance_weeks_per_year: 1.5, community_impact_clause: true }
              as: PlatformAdmin
            - call: "POST /smelter-ops/price-observations"
              payload: { instrument: "ALUMINUM_LME", region_code: "GLOBAL", observed_at: "2026-08-15T00:00:00Z", price_usd: 2400.00 }
              as: TradingAnalyst
            - call: "POST /smelter-ops/price-observations"
              payload: { instrument: "REGIONAL_PREMIUM", region_code: "NA_NORTHWEST", observed_at: "2026-08-15T00:00:00Z", price_usd: 380.00 }
              as: TradingAnalyst
            - call: "POST /smelter-ops/price-observations"
              payload: { instrument: "ALUMINA_INDEX", region_code: "GLOBAL", observed_at: "2026-08-15T00:00:00Z", price_usd: 340.00 }
              as: TradingAnalyst
            - call: "POST /smelter-ops/price-observations"
              payload: { instrument: "POWER_SPOT", region_code: "NA_NORTHWEST", observed_at: "2026-08-20T00:00:00Z", price_usd: 48.00 }
              as: EnergyManager
            - call: "POST /smelter-ops/hedge-positions"
              payload: { smelter_id: "${sm}", instrument: "LME_SWAP", volume_tonnes: 20000, strike_price_usd: 2400.00, delivery_month: "2026-09" }
              as: TradingAnalyst
            - call: "POST /smelter-ops/curtailment-decisions"
              payload: { potline_id: "${pl1}", expected_potline_version: "${pv1}", trigger_type: "METAL_PRICE", depth_pct: 60, planned_start: "2026-09-05T00:00:00Z", planned_end: "2026-10-05T00:00:00Z" }
              as: SmelterManager
              as_user_id: "mgr-1"
              captures: { dec: $.data.id }
            - call: "POST /smelter-ops/curtailment-decisions/${dec}/economic-approve"
