  # ===========================================================================
  - section: state_machines
    instances:

      - name: agreement_draft_to_active_sets_posture_current
        claim_type: valid_transition
        grounds:
          - state_machines.DelegationAgreement.DRAFT_to_ACTIVE
          - endpoints.POST_/ipa/delegation-agreements/{id}/state
        distinguishing_aspect: |
          The activation trigger moves status to ACTIVE, stamps
          capitation_posture CURRENT and bumps version by exactly 1 — one
          increment, not two, even though two fields changed.
        test_recipe:
          setup:
            - "Agreement AGR_S1 exists in DRAFT with shares 6000 + 4000 bps."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Corner Transition Health", payer_tax_id: "94-3000042", delegation_scope: "FULL_RISK", base_pmpm_cents: 20000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 6000, institutional_pool_share_bps: 4000, quality_withhold_bps: 0, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 5 }
              as: IpaAdmin
              captures: { agr_s1: "$.data.id", agr_s1_v0: "$.data.version" }
          trigger:
            - call: "POST /ipa/delegation-agreements/${agr_s1}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
              captures: { agr_s1_status: "$.data.status", agr_s1_v1: "$.data.version" }
          assert:
            - "HTTP 200 and ${agr_s1_status} == \"ACTIVE\""
            - "DelegationAgreement.${agr_s1}.capitation_posture == \"CURRENT\""
            - "${agr_s1_v1} == ${agr_s1_v0} + 1"

      - name: pool_close_for_incurral_before_pool_year_end_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.RiskPool.ACCUMULATING_to_CLOSED_FOR_INCURRAL
          - validations.priority_11_ERR_INVALID_STATE_TRANSITION
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: |
          The transition's second precondition (clock >= pool_year_end) is
          enforced independently of the from-state check: the pool IS in
          ACCUMULATING, so only the temporal precondition can fail, and it
          returns 409 ERR_INVALID_STATE_TRANSITION — not the 422
          ERR_SETTLEMENT_WINDOW_NOT_OPEN, which belongs to the SETTLED step.
        test_recipe:
          setup:
            - "Agreement AGR_S2 is ACTIVE with a PROFESSIONAL pool covering all of 2026."
            - "Logical clock is 2026-08-01T00:00:00Z — inside the pool year."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Corner Precondition Health", payer_tax_id: "94-3000043", delegation_scope: "FULL_RISK", base_pmpm_cents: 20000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 6000, institutional_pool_share_bps: 4000, quality_withhold_bps: 0, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 5 }
              as: IpaAdmin
              captures: { agr_s2: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_s2}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_s2}/risk-pools"
              payload: { pool_type: "PROFESSIONAL", pool_year_start: "2026-01-01T00:00:00Z", pool_year_end: "2026-12-31T23:59:59Z" }
              as: IpaAdmin
              captures: { pool_s2: "$.data.id" }
          trigger:
            - call: "POST /ipa/risk-pools/${pool_s2}/state"
              payload: { to_state: "CLOSED_FOR_INCURRAL" }
              as: IpaAdmin
              captures: { s2_error: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-31T23:59:59Z" }
              as: IpaAdmin
            - call: "POST /ipa/risk-pools/${pool_s2}/state"
              payload: { to_state: "CLOSED_FOR_INCURRAL" }
              as: IpaAdmin
              captures: { s2_status: "$.data.status" }
          assert:
            - "call 1 returns HTTP 409 and ${s2_error} == \"ERR_INVALID_STATE_TRANSITION\""
            - "after call 1 RiskPool.${pool_s2}.status is still \"ACCUMULATING\""
            - "call 3 returns HTTP 200 and ${s2_status} == \"CLOSED_FOR_INCURRAL\" — the clock at exactly pool_year_end satisfies the >= precondition"

      - name: agreement_suspend_closes_open_panels_and_reinstate_does_not_reopen
        claim_type: side_effect_execution
        grounds:
          - state_machines.DelegationAgreement.ACTIVE_to_SUSPENDED
          - state_machines.DelegationAgreement.SUSPENDED_to_ACTIVE
          - entities.PhysicianMember.fields.panel_status
        distinguishing_aspect: |
          The suspend side effect is scoped: only panels in OPEN move to
          CLOSED_TO_NEW, and reinstatement deliberately does NOT reverse it. The
          physician who was already CLOSED_TO_NEW is untouched by both steps, so
          the two physicians end identical — proving the cascade is conditional
          on the current panel_status and one-directional.
        test_recipe:
          setup:
            - "Agreement AGR_S3 is ACTIVE with two ACTIVE physicians: PS3A with panel_status OPEN and PS3B explicitly PATCHed to CLOSED_TO_NEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Corner Suspend Health", payer_tax_id: "94-3000044", delegation_scope: "FULL_RISK", base_pmpm_cents: 20000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 6000, institutional_pool_share_bps: 4000, quality_withhold_bps: 0, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 5 }
              as: IpaAdmin
              captures: { agr_s3: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_s3}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_s3}/physicians"
              payload: { npi: "3500000001", full_name: "Suri Adeyemi", specialty: "PRIMARY_CARE" }
              as: NetworkManager
              captures: { p_s3a: "$.data.id" }
            - call: "POST /ipa/physicians/${p_s3a}/state"
              payload: { to_state: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /ipa/physicians/${p_s3a}/state"
              payload: { to_state: "ACTIVE" }
              as: NetworkManager
            - call: "POST /ipa/delegation-agreements/${agr_s3}/physicians"
              payload: { npi: "3500000002", full_name: "Silas Boateng", specialty: "PRIMARY_CARE" }
              as: NetworkManager
              captures: { p_s3b: "$.data.id" }
            - call: "POST /ipa/physicians/${p_s3b}/state"
              payload: { to_state: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /ipa/physicians/${p_s3b}/state"
              payload: { to_state: "ACTIVE" }
              as: NetworkManager
            - call: "PATCH /ipa/physicians/${p_s3b}/panel-status"
              payload: { panel_status: "CLOSED_TO_NEW" }
              as: NetworkManager
              captures: { p_s3b_panel_before: "$.data.panel_status" }
          trigger:
            - call: "POST /ipa/delegation-agreements/${agr_s3}/state"
              payload: { to_state: "SUSPENDED" }
              as: IpaAdmin
            - call: "GET /ipa/delegation-agreements/${agr_s3}/physicians"
              payload: { panel_status: "CLOSED_TO_NEW", limit: 10, offset: 0 }
              as: NetworkManager
            - call: "POST /ipa/delegation-agreements/${agr_s3}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
            - call: "GET /ipa/delegation-agreements/${agr_s3}/physicians"
              payload: { panel_status: "OPEN", limit: 10, offset: 0 }
              as: NetworkManager
          assert:
            - "${p_s3b_panel_before} == \"CLOSED_TO_NEW\" before the trigger"
            - "call 1 returns HTTP 200 with DelegationAgreement.${agr_s3}.status == \"SUSPENDED\""
            - "call 2 returns exactly 2 rows, total_count == 2 — PS3A moved OPEN -> CLOSED_TO_NEW and PS3B was already there"
            - "call 3 returns HTTP 200 with status \"ACTIVE\""
            - "call 4 returns zero rows, total_count == 0 — reinstatement does NOT reopen either panel"
            - "PhysicianMember.${p_s3a}.credential_status == \"ACTIVE\" throughout — the suspend cascade touches only the panel dimension"

      - name: agreement_draft_to_terminated_is_not_a_declared_transition
        claim_type: invalid_transitions
        grounds:
          - state_machines.DelegationAgreement
          - validations.priority_11_ERR_INVALID_STATE_TRANSITION
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: |
          TERMINATED is reachable only from ACTIVE or SUSPENDED; DRAFT →
          TERMINATED is absent from the transition list and must be rejected
          with 409 even though TERMINATED is a legitimate state of the entity
          and the requester holds the exclusive role.
        test_recipe:
          setup:
            - "Agreement AGR_S4 exists in DRAFT and has never been activated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Corner Invalid From Health", payer_tax_id: "94-3000045", delegation_scope: "FULL_RISK", base_pmpm_cents: 20000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 6000, institutional_pool_share_bps: 4000, quality_withhold_bps: 0, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 5 }
              as: IpaAdmin
              captures: { agr_s4: "$.data.id", agr_s4_v0: "$.data.version" }
          trigger:
            - call: "POST /ipa/delegation-agreements/${agr_s4}/state"
              payload: { to_state: "TERMINATED" }
              as: IpaAdmin
              captures: { s4_error: "$.data.error_id" }
            - call: "GET /ipa/delegation-agreements/${agr_s4}"
              as: IpaAdmin
              captures: { agr_s4_status: "$.data.status", agr_s4_v1: "$.data.version" }
          assert:
            - "call 1 returns HTTP 409 and ${s4_error} == \"ERR_INVALID_STATE_TRANSITION\""
            - "${agr_s4_status} == \"DRAFT\" and ${agr_s4_v1} == ${agr_s4_v0} — a rejected transition bumps nothing"

      - name: stop_loss_recovery_created_in_draft_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.StopLossRecovery
          - entities.StopLossRecovery.fields.status
          - calculations.stop_loss_recovery
          - endpoints.POST_/ipa/stop-loss-recoveries
        distinguishing_aspect: |
          A freshly created recovery is in the declared initial_state DRAFT with
          both user-id audit fields null, while its money fields are already
          computed at create time (attachment 10000, eligible 20000, excess
