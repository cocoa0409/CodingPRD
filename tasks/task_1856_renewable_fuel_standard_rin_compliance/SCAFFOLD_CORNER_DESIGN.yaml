              as_user_id: "cm-2"
          assert:
            - "first verify error_id == ERR_SEGREGATION_OF_DUTIES (creator user id matches)"
            - "second verify by cm-2 succeeds; transfer_status == VERIFIED"

      - name: segregation_auditor_cannot_submit_own_year_report
        claim_type: segregation_of_duties
        grounds: ["validations[priority=3]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Report-side segregation: the engagement's auditor (aud-1) also holding ComplianceManager duties cannot submit the ANNUAL report for the same year; priority 3 fires before the attest-clean check."
        test_recipe:
          setup: ["account + year; engagement for aud-1 CLOSED_CLEAN; ANNUAL draft created by cm-1"]
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-RBAC-5" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/obligation-years"
              payload: { account_id: "${acct}", year: 2026, projected_volume_gal: 1000, std_cellulosic_pct: 10.0, std_biomass_diesel_pct: 20.0, std_advanced_pct: 30.0, std_total_pct: 40.0 }
              as: ComplianceManager
              captures: { yr: $.data.id, yr_v: $.data.version }
            - call: "POST /rfs/attest-engagements"
              payload: { obligation_year_id: "${yr}", auditor_user_id: "aud-1", fieldwork_start: "2026-09-01T00:00:00Z", fieldwork_end: "2026-10-01T00:00:00Z" }
              as: ComplianceManager
              captures: { eng: $.data.id }
            - call: "POST /rfs/attest-engagements/${eng}/begin-fieldwork"
              as: Auditor
              as_user_id: "aud-1"
            - call: "POST /rfs/attest-engagements/${eng}/issue-findings"
              payload: { findings: "CLEAN" }
              as: Auditor
              as_user_id: "aud-1"
            - call: "POST /rfs/attest-engagements/${eng}/close"
              as: Auditor
              as_user_id: "aud-1"
            - call: "POST /rfs/compliance-reports"
              payload: { obligation_year_id: "${yr}", report_type: "ANNUAL", expected_obligation_year_version: "${yr_v}" }
              as: ComplianceManager
              as_user_id: "cm-1"
              captures: { rep: $.data.id }
          trigger:
            - call: "POST /rfs/compliance-reports/${rep}/submit"
              as: ComplianceManager
              as_user_id: "aud-1"
              captures: { err: $.data.error_id }
          assert:
            - "trigger error_id == ERR_SEGREGATION_OF_DUTIES (auditor of the year cannot submit its annual report)"
            - "ComplianceReport.${rep}.status == DRAFT"

  # ===========================================================================
  # Section: complexity_layers
  # ===========================================================================
  - section: complexity_layers
    instances:
      - name: cascade_layer_end_to_end
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        distinguishing_aspect: "Covered by difficulty instance vendor_revocation_invalidation_cascade (depth-4) and retirement_acceptance_cascade_to_satisfied (depth-2)."
        excluded_because:
          difficulty_instance: transitive_cascade / vendor_revocation_invalidation_cascade
          rationale: "Layer behavior identical to the named instance."

      - name: threshold_layer_clock_gates
        claim_type: rate_threshold_triggers
        grounds: [calculations.retention_cutoff, calculations.rin_vintage_expiry, calculations.carryover_cap_check]
        distinguishing_aspect: "Covered by retention_purge_exact_cutoff_second, lot_expiry_sweep_on_clock_advance, retirement_deadline_exact_instant, and carryover boundary instances."
        excluded_because:
          difficulty_instance: boundary_precision_check / retention_purge_exact_cutoff_second
          rationale: "Threshold boundaries asserted across the cited instances."

      - name: dual_variant_layer
        claim_type: dual_variant_calculation
        grounds: [calculations.rvo_obligation, calculations.state_credit_generation]
        distinguishing_aspect: "Covered by the two §1.8 dual_variant_calc instances."
        excluded_because:
          difficulty_instance: dual_variant_calc / rvo_provisional_vs_final_on_obligation_year
          rationale: "Layer exercised by both dual-variant instances."

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_cascade_in_same_request
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: the decide=ACCEPT response and a subsequent GET show lot debit, year counters, and posture already updated — no asynchronous reconciliation."
        test_recipe:
          setup: ["year 2026; GENERATED D6 lot 100 separated; batch TOTAL/D6 qty 100 SUBMITTED"]
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-CON-1" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/obligation-years"
              payload: { account_id: "${acct}", year: 2026, projected_volume_gal: 1000, std_cellulosic_pct: 10.0, std_biomass_diesel_pct: 20.0, std_advanced_pct: 30.0, std_total_pct: 40.0 }
              as: ComplianceManager
              captures: { yr: $.data.id }
            - call: "POST /rfs/rin-lots"
              payload: { account_id: "${acct}", d_code: "D6", vintage_year: 2026, gallon_qty: 100, equivalence_value: 1.0 }
              as: ComplianceManager
              captures: { lot: $.data.id }
            - call: "POST /rfs/rin-lots/${lot}/separations"
              payload: { blended_gallons: 100 }
              as: ComplianceManager
            - call: "POST /rfs/retirement-batches"
              payload: { obligation_year_id: "${yr}", category: "TOTAL_RENEWABLE", d_code: "D6", rin_qty: 100 }
              as: ComplianceManager
              captures: { b: $.data.id }
            - call: "POST /rfs/retirement-batches/${b}/submit"
              as: ComplianceManager
          trigger:
            - call: "POST /rfs/retirement-batches/${b}/decide"
              payload: { decision: "ACCEPT" }
              as: OpsAdmin
            - call: "GET /rfs/obligation-years/${yr}"
              as: ComplianceManager
            - call: "GET /rfs/rin-lots/${lot}"
              as: ComplianceManager
          assert:
            - "decide response shows RetirementBatch.${b}.status == ACCEPTED"
            - "immediately after: ObligationYear.${yr}.retired_total_rins == 100"
            - "immediately after: RINLot.${lot}.status == EXHAUSTED and retired_qty == 100"
