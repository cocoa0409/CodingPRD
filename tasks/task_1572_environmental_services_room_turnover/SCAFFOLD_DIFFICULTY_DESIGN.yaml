            - call: "POST /evs/clean-requests"
              payload: { bed_id: "${b2}", clean_type: "ROUTINE" }
              as: EVSDispatcher
              captures: { r2: $.data.id }
          trigger:
            - call: "POST /evs/clean-requests/${r1}/assign"
              payload: { staff_id: "${t1}", planned_start_at: "2026-08-01T09:00:00Z" }
              as: EVSDispatcher
            - call: "POST /evs/clean-requests/${r2}/assign"
              payload: { staff_id: "${t1}", planned_start_at: "2026-08-01T10:00:00Z" }
              as: EVSDispatcher
            - call: "POST /evs/clean-requests/${r1}/unassign"
              payload: {}
              as: EVSDispatcher
            - call: "GET /evs/clean-requests?assigned_staff_id=${t1}"
              payload: { assigned_staff_id: "${t1}" }
              as: Any
              captures: { live_counted: "$.data[0].id" }
          assert:
            - "StaffMember.${t1}.active_clean_count == 0 before any assign"
            - "After two assigns the count was 2; after the unassign StaffMember.${t1}.active_clean_count == 1 — the pair (assign R1, unassign R1) conserves the count"
            - "CleanRequest.${r1}.status == QUEUED AND assigned_staff_id == null; CleanRequest.${r2}.status == ASSIGNED"
            - "The filtered list GET /evs/clean-requests?assigned_staff_id=${t1}&status=ASSIGNED returns exactly 1 row — derived counter equals live query"
            - "StaffMember.${t1}.version increments accompanied every count change (mutations bump version)"
