          - state_machines.ModuleCompletion.PASSED_to_VOIDED
          - state_machines.Cohort.GRADUATION_REVIEW_to_IN_SESSION
          - entities.Cohort.fields.delivered_contact_hours
          - entities.Program.fields.pending_graduation_count
        distinguishing_aspect: |
          Cascade B originates from a DIFFERENT triggering transition - ClassSession DELIVERED ->
          CANCELLED - and propagates along its own path: the cancellation invalidates the session, THAT
          voids every completion recorded against it, THAT rewrites the trainee ledger and demotes the
          graduate, and THAT reverts the cohort out of GRADUATION_REVIEW and decrements the program
          counter. The two cascades share no triggering transition and no intermediate hop set.
