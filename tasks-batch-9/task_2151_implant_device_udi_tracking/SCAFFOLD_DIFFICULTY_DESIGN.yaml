            - call: "POST /udi/surgical-cases/${case_id}/implant-records"
              payload: { device_unit_id: "${u1_id}", udi_di: "00812345678905", udi_pi_serial: "SN-0001", anatomic_site: "FEMUR_PROXIMAL", laterality: "LEFT", expected_case_version: "${case_v}" }
