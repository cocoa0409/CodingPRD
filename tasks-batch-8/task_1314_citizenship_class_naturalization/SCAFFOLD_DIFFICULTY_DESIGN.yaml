              as: ProgramAdmin
              captures: { sec_id: $.data.id, sec_v0: $.data.version }
            - call: "POST /naturalization/applicants"
              payload: { full_name: "Att Eight", email: "a8@x.com", date_of_birth: "1990-01-01" }
