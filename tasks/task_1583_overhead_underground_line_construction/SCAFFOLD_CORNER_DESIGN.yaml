# =============================================================================
# Task 1583 — Scaffold Corner Design (§1.9 Coverage Index for Non-Difficulty Tests)
# Breadth coverage of §1.1–§1.7 claims not already covered by §1.8.
# =============================================================================
scaffold_corner_design:

  # ------------------------------------------------------------------
  # Section: entities
  # ------------------------------------------------------------------
  - section: entities
    instances:
      - name: contract_creation_applies_defaults
        claim_type: defaults
        grounds: [entities.Contract.fields.retainage_pct, entities.Contract.fields.overrun_threshold_pct, entities.Contract.fields.quantity_cap_pct]
        distinguishing_aspect: "Omitting the three percentage fields applies defaults 0.10 / 1.10 / 1.25 and initial status DRAFT."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /contracts"
              payload: { utility_name: "City Power", contract_number: "CD-1", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
              captures: { cid: $.data.id }
          assert:
            - "Contract.${cid}.retainage_pct == 0.10, overrun_threshold_pct == 1.10, quantity_cap_pct == 1.25"
            - "Contract.${cid}.status == DRAFT and version == 1"

      - name: contract_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - entities.Contract.fields.utility_name
          - validations[priority=3]
        distinguishing_aspect: "POST /contracts without utility_name fails with ERR_INVALID_REQUEST (400) before any state is created."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /contracts"
              payload: { contract_number: "CD-2", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status == 400"

      - name: invalid_crew_type_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Crew.fields.crew_type
          - validations[priority=3]
        distinguishing_aspect: "crew_type 'HELICOPTER' is outside {OVERHEAD, UNDERGROUND, STORM} and fails with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /crews"
              payload: { crew_code: "CR-BAD", crew_type: "HELICOPTER", base_rate_per_hour: 55.00 }
              as: CONTRACTOR_PM
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status == 400"

      - name: contract_not_found_returns_404
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /contracts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CONTRACTOR_PM
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and http status == 404"

      - name: crews_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "GET /crews?limit=1&offset=0 with 2 crews returns total_count==2 and has_more==true; offset=1 returns has_more==false."
        test_recipe:
          setup: ["two crews CR-A and CR-B exist"]
          setup_api_calls:
            - call: "POST /crews"
              payload: { crew_code: "CR-A", crew_type: "OVERHEAD", base_rate_per_hour: 55.00 }
              as: CONTRACTOR_PM
            - call: "POST /crews"
              payload: { crew_code: "CR-B", crew_type: "UNDERGROUND", base_rate_per_hour: 58.00 }
              as: CONTRACTOR_PM
          trigger:
            - call: "GET /crews"
              payload: { limit: 1, offset: 0 }
              as: CONTRACTOR_PM
            - call: "GET /crews"
              payload: { limit: 1, offset: 1 }
              as: CONTRACTOR_PM
          assert:
            - "page 1: total_count == 2, has_more == true, exactly 1 crew returned"
            - "page 2: total_count == 2, has_more == false, exactly 1 crew returned"

      - name: crew_status_derivation_through_storm_lifecycle
        claim_type: computed_fields
        grounds: [calculations.crew_equipment_status_derivation, entities.Crew.fields.status]
        distinguishing_aspect: "Crew.status computes AVAILABLE at creation, STANDBY under an ACTIVE STANDBY activation, CALLOUT after convert, and AVAILABLE again after close — with no direct status write."
        test_recipe:
          setup:
            - "Contract ACTIVE (one bid item); crew CR-L at rate 55.00"
          setup_api_calls:
            - call: "POST /contracts"
              payload: { utility_name: "City Power", contract_number: "CD-6", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/bid-items"
              payload: { item_code: "OH-MISC", description: "Misc", unit: "HR", unit_price: 10.00, estimated_quantity: 100 }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/transition"
              payload: { to: "ACTIVE" }
              as: CONTRACTOR_PM
            - call: "POST /crews"
              payload: { crew_code: "CR-L", crew_type: "STORM", base_rate_per_hour: 55.00 }
              as: CONTRACTOR_PM
              captures: { crew_id: $.data.id }
          trigger:
            - call: "POST /contracts/${cid}/storm-activations"
              payload: { crew_id: "${crew_id}", kind: "STANDBY", activation_date: "2026-08-05" }
              as: UTILITY_DISPATCHER
              captures: { sa1: $.data.id }
            - call: "POST /storm-activations/${sa1}/convert"
              payload: {}
              as: UTILITY_DISPATCHER
            - call: "POST /storm-activations/${sa1}/close"
              payload: { hours_standby: 2, hours_worked: 5 }
              as: UTILITY_DISPATCHER
          assert:
            - "at creation Crew.${crew_id}.status == AVAILABLE"
            - "after STANDBY activation: status == STANDBY"
            - "after convert: status == CALLOUT and StormActivation.${sa1}.converted == true"
            - "after close: status == AVAILABLE and StormActivation.${sa1}.status == CLOSED"

  # ------------------------------------------------------------------
  # Section: state_machines
  # ------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: work_package_backward_transition_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.WorkPackage
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "An IN_PROGRESS work package cannot move back to MOBILIZED; the attempt fails with ERR_INVALID_STATE and status is unchanged."
        test_recipe:
          setup: ["Contract ACTIVE; work package IN_PROGRESS with a PLANNED assignment"]
          setup_api_calls:
            - call: "POST /contracts"
              payload: { utility_name: "City Power", contract_number: "CS-1", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/bid-items"
              payload: { item_code: "OH-MISC", description: "Misc", unit: "HR", unit_price: 10.00, estimated_quantity: 100 }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/transition"
              payload: { to: "ACTIVE" }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/work-packages"
              payload: { name: "WP back", location: "L1", requires_outage: false }
              as: CONTRACTOR_PM
              captures: { wp_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "MOBILIZED" }
              as: CONTRACTOR_PM
            - call: "POST /crews"
              payload: { crew_code: "CR-BK", crew_type: "OVERHEAD", base_rate_per_hour: 55.00 }
              as: CONTRACTOR_PM
              captures: { crew_id: $.data.id }
            - call: "POST /equipment"
              payload: { equipment_code: "EQ-BK", kind: "BUCKET_TRUCK", daily_rate: 120.00 }
              as: CONTRACTOR_PM
              captures: { eq_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/assignments"
              payload: { crew_id: "${crew_id}", equipment_id: "${eq_id}", start_date: "2026-08-03", end_date: "2026-08-07" }
              as: FOREMAN
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "IN_PROGRESS" }
              as: CONTRACTOR_PM
          trigger:
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "MOBILIZED" }
              as: CONTRACTOR_PM
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409); WorkPackage.${wp_id}.status remains IN_PROGRESS"

      - name: completed_work_package_is_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.WorkPackage]
        distinguishing_aspect: "A COMPLETED work package rejects every further transition (here CANCELLED) with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Contract ACTIVE; work package walked PLANNED -> MOBILIZED -> IN_PROGRESS -> PUNCH -> COMPLETED (no rework, no material issues)"]
          setup_api_calls:
            - call: "POST /contracts"
              payload: { utility_name: "City Power", contract_number: "CS-2", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/bid-items"
              payload: { item_code: "OH-MISC", description: "Misc", unit: "HR", unit_price: 10.00, estimated_quantity: 100 }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/transition"
              payload: { to: "ACTIVE" }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/work-packages"
              payload: { name: "WP term", location: "L2", requires_outage: false }
              as: CONTRACTOR_PM
              captures: { wp_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "MOBILIZED" }
              as: CONTRACTOR_PM
            - call: "POST /crews"
              payload: { crew_code: "CR-T", crew_type: "OVERHEAD", base_rate_per_hour: 55.00 }
              as: CONTRACTOR_PM
              captures: { crew_id: $.data.id }
            - call: "POST /equipment"
              payload: { equipment_code: "EQ-T", kind: "BUCKET_TRUCK", daily_rate: 120.00 }
              as: CONTRACTOR_PM
              captures: { eq_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/assignments"
              payload: { crew_id: "${crew_id}", equipment_id: "${eq_id}", start_date: "2026-08-03", end_date: "2026-08-07" }
              as: FOREMAN
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "IN_PROGRESS" }
              as: CONTRACTOR_PM
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "PUNCH" }
              as: CONTRACTOR_PM
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "COMPLETED" }
              as: CONTRACTOR_PM
          trigger:
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "CANCELLED" }
              as: CONTRACTOR_PM
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE; WorkPackage.${wp_id}.status remains COMPLETED"

      - name: new_work_package_initial_state_planned
        claim_type: initial_state
        grounds: [state_machines.WorkPackage]
        distinguishing_aspect: "A freshly created work package starts in PLANNED."
        test_recipe:
          setup: ["Contract ACTIVE"]
          setup_api_calls:
            - call: "POST /contracts"
              payload: { utility_name: "City Power", contract_number: "CS-3", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/bid-items"
              payload: { item_code: "OH-MISC", description: "Misc", unit: "HR", unit_price: 10.00, estimated_quantity: 100 }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/transition"
              payload: { to: "ACTIVE" }
              as: CONTRACTOR_PM
          trigger:
            - call: "POST /contracts/${cid}/work-packages"
              payload: { name: "WP init", location: "L3", requires_outage: false }
              as: CONTRACTOR_PM
              captures: { wp_id: $.data.id, st: $.data.status }
          assert:
            - "WorkPackage.${wp_id}.status == PLANNED at creation"

      - name: inspection_resubmit_after_terminal_rejected
        claim_type: idempotency
        grounds:
          - state_machines.Inspection
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Submitting a result to an already-PASSED inspection fails with ERR_INVALID_STATE (no double-submit)."
        test_recipe:
          setup: ["Full field setup; entry e1 SUBMITTED; inspection i1 already PASSED"]
          setup_api_calls:
            - call: "POST /contracts"
              payload: { utility_name: "City Power", contract_number: "CS-4", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/bid-items"
              payload: { item_code: "OH-MISC", description: "Misc", unit: "EACH", unit_price: 10.00, estimated_quantity: 100 }
              as: CONTRACTOR_PM
              captures: { bid_id: $.data.id }
            - call: "POST /contracts/${cid}/transition"
              payload: { to: "ACTIVE" }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/work-packages"
              payload: { name: "WP insp", location: "L4", requires_outage: false }
              as: CONTRACTOR_PM
              captures: { wp_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "MOBILIZED" }
              as: CONTRACTOR_PM
            - call: "POST /crews"
              payload: { crew_code: "CR-IS", crew_type: "OVERHEAD", base_rate_per_hour: 55.00 }
              as: CONTRACTOR_PM
              captures: { crew_id: $.data.id }
            - call: "POST /equipment"
              payload: { equipment_code: "EQ-IS", kind: "BUCKET_TRUCK", daily_rate: 120.00 }
              as: CONTRACTOR_PM
              captures: { eq_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/assignments"
              payload: { crew_id: "${crew_id}", equipment_id: "${eq_id}", start_date: "2026-08-03", end_date: "2026-08-07" }
              as: FOREMAN
              captures: { asg_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "IN_PROGRESS" }
              as: CONTRACTOR_PM
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T12:00:00Z" }
              as: CONTRACTOR_PM
            - call: "POST /assignments/${asg_id}/transition"
              payload: { to: "ACTIVE" }
              as: FOREMAN
              captures: { asg_v: $.data.version }
            - call: "POST /assignments/${asg_id}/production-entries"
              payload: { bid_item_id: "${bid_id}", work_date: "2026-08-04", quantity_reported: 5, expected_assignment_version: "${asg_v}" }
              as: FOREMAN
              captures: { e1: $.data.id }
            - call: "POST /work-packages/${wp_id}/inspections"
              payload: { production_entry_id: "${e1}", standard_code: "UTIL-OH-1.0" }
              as: UTILITY_INSPECTOR
              captures: { i1: $.data.id }
            - call: "POST /inspections/${i1}/submit"
              payload: { result: "PASS" }
              as: UTILITY_INSPECTOR
          trigger:
            - call: "POST /inspections/${i1}/submit"
              payload: { result: "FAIL" }
              as: UTILITY_INSPECTOR
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE; Inspection.${i1}.status remains PASSED; ProductionEntry.${e1}.status remains ACCEPTED"

      - name: outage_request_change_cycle_adopts_new_window
        claim_type: valid_transition
        grounds: [state_machines.OutageRequest.APPROVED_to_CHANGE_REQUESTED, state_machines.OutageRequest.CHANGE_REQUESTED_to_APPROVED]
        distinguishing_aspect: "Cyclic approval loop on OutageRequest: APPROVED -> CHANGE_REQUESTED with a new window -> APPROVED adopts the requested window (window_start/window_end overwritten)."
        test_recipe:
          setup: ["Contract ACTIVE; work package MOBILIZED; outage o1 APPROVED for 2026-08-10T08:00:00Z..2026-08-10T12:00:00Z on CKT-2"]
          setup_api_calls:
            - call: "POST /contracts"
              payload: { utility_name: "City Power", contract_number: "CS-5", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/bid-items"
              payload: { item_code: "OH-MISC", description: "Misc", unit: "EACH", unit_price: 10.00, estimated_quantity: 100 }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/transition"
              payload: { to: "ACTIVE" }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/work-packages"
              payload: { name: "WP oc", location: "L5", requires_outage: true }
              as: CONTRACTOR_PM
              captures: { wp_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "MOBILIZED" }
              as: CONTRACTOR_PM
            - call: "POST /work-packages/${wp_id}/outage-requests"
              payload: { circuit_id: "CKT-2", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z" }
              as: CONTRACTOR_PM
              captures: { o1: $.data.id }
            - call: "POST /outage-requests/${o1}/decide"
              payload: { decision: "APPROVED" }
              as: UTILITY_DISPATCHER
          trigger:
            - call: "POST /outage-requests/${o1}/request-change"
              payload: { window_start: "2026-08-11T09:00:00Z", window_end: "2026-08-11T13:00:00Z" }
              as: CONTRACTOR_PM
            - call: "POST /outage-requests/${o1}/decide"
              payload: { decision: "APPROVED" }
              as: UTILITY_DISPATCHER
          assert:
            - "after request-change: OutageRequest.${o1}.status == CHANGE_REQUESTED with requested_window_start == 2026-08-11T09:00:00Z"
            - "after re-approval: status == APPROVED, window_start == 2026-08-11T09:00:00Z, window_end == 2026-08-11T13:00:00Z, requested_window_* cleared to null"

      - name: assignment_activation_outside_date_window_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Assignment.PLANNED_to_ACTIVE]
        distinguishing_aspect: "Activating an assignment whose date range (2026-08-05..2026-08-07) does not contain the logical clock date (2026-08-03) fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Contract ACTIVE; work package MOBILIZED; assignment a1 PLANNED for 2026-08-05..2026-08-07; clock at 2026-08-03T12:00:00Z"]
          setup_api_calls:
            - call: "POST /contracts"
              payload: { utility_name: "City Power", contract_number: "CS-6", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/bid-items"
              payload: { item_code: "OH-MISC", description: "Misc", unit: "EACH", unit_price: 10.00, estimated_quantity: 100 }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/transition"
              payload: { to: "ACTIVE" }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/work-packages"
              payload: { name: "WP dw", location: "L6", requires_outage: false }
              as: CONTRACTOR_PM
              captures: { wp_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "MOBILIZED" }
              as: CONTRACTOR_PM
            - call: "POST /crews"
              payload: { crew_code: "CR-DW", crew_type: "OVERHEAD", base_rate_per_hour: 55.00 }
              as: CONTRACTOR_PM
              captures: { crew_id: $.data.id }
            - call: "POST /equipment"
              payload: { equipment_code: "EQ-DW", kind: "BUCKET_TRUCK", daily_rate: 120.00 }
              as: CONTRACTOR_PM
              captures: { eq_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/assignments"
              payload: { crew_id: "${crew_id}", equipment_id: "${eq_id}", start_date: "2026-08-05", end_date: "2026-08-07" }
              as: FOREMAN
              captures: { a1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T12:00:00Z" }
              as: CONTRACTOR_PM
          trigger:
            - call: "POST /assignments/${a1}/transition"
              payload: { to: "ACTIVE" }
              as: FOREMAN
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE; Assignment.${a1}.status remains PLANNED"

  # ------------------------------------------------------------------
  # Section: calculations
  # ------------------------------------------------------------------
  - section: calculations
    instances:
      - name: accepted_quantity_counts_only_accepted_entries
        claim_type: input_set_filtering
        grounds: [calculations.production_acceptance_accounting, entities.BidItem.fields.accepted_quantity]
        distinguishing_aspect: "accepted_quantity counts only ACCEPTED entries: with 10 ACCEPTED + 7 SUBMITTED + 5 VOID + 3 REWORK_REQUIRED on the same bid item, accepted_quantity == 10."
        test_recipe:
          setup:
            - "Full field setup; bid item est=200 (cap 250), price 10.00"
            - "e1 qty 10 ACCEPTED; e2 qty 7 SUBMITTED; e3 qty 5 voided from SUBMITTED; e4 qty 3 in REWORK_REQUIRED"
          setup_api_calls:
            - call: "POST /contracts"
              payload: { utility_name: "City Power", contract_number: "CC-1", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/bid-items"
              payload: { item_code: "OH-MISC", description: "Misc", unit: "EACH", unit_price: 10.00, estimated_quantity: 200 }
              as: CONTRACTOR_PM
              captures: { bid_id: $.data.id }
            - call: "POST /contracts/${cid}/transition"
              payload: { to: "ACTIVE" }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/work-packages"
              payload: { name: "WP filt", location: "L7", requires_outage: false }
              as: CONTRACTOR_PM
              captures: { wp_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "MOBILIZED" }
              as: CONTRACTOR_PM
            - call: "POST /crews"
              payload: { crew_code: "CR-FL", crew_type: "OVERHEAD", base_rate_per_hour: 55.00 }
              as: CONTRACTOR_PM
              captures: { crew_id: $.data.id }
            - call: "POST /equipment"
              payload: { equipment_code: "EQ-FL", kind: "BUCKET_TRUCK", daily_rate: 120.00 }
              as: CONTRACTOR_PM
              captures: { eq_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/assignments"
              payload: { crew_id: "${crew_id}", equipment_id: "${eq_id}", start_date: "2026-08-03", end_date: "2026-08-07" }
              as: FOREMAN
              captures: { asg_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "IN_PROGRESS" }
              as: CONTRACTOR_PM
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T12:00:00Z" }
              as: CONTRACTOR_PM
            - call: "POST /assignments/${asg_id}/transition"
              payload: { to: "ACTIVE" }
              as: FOREMAN
              captures: { v1: $.data.version }
            - call: "POST /assignments/${asg_id}/production-entries"
              payload: { bid_item_id: "${bid_id}", work_date: "2026-08-03", quantity_reported: 10, expected_assignment_version: "${v1}" }
              as: FOREMAN
              captures: { e1: $.data.id }
            - call: "POST /work-packages/${wp_id}/inspections"
              payload: { production_entry_id: "${e1}", standard_code: "UTIL-OH-1.0" }
              as: UTILITY_INSPECTOR
              captures: { i1: $.data.id }
            - call: "POST /inspections/${i1}/submit"
              payload: { result: "PASS" }
              as: UTILITY_INSPECTOR
            - call: "GET /assignments/${asg_id}"
              payload: {}
              as: FOREMAN
              captures: { v2: $.data.version }
            - call: "POST /assignments/${asg_id}/production-entries"
              payload: { bid_item_id: "${bid_id}", work_date: "2026-08-04", quantity_reported: 7, expected_assignment_version: "${v2}" }
              as: FOREMAN
            - call: "GET /assignments/${asg_id}"
              payload: {}
              as: FOREMAN
              captures: { v3: $.data.version }
            - call: "POST /assignments/${asg_id}/production-entries"
              payload: { bid_item_id: "${bid_id}", work_date: "2026-08-05", quantity_reported: 5, expected_assignment_version: "${v3}" }
              as: FOREMAN
              captures: { e3: $.data.id }
            - call: "POST /production-entries/${e3}/void"
              payload: {}
              as: FOREMAN
            - call: "GET /assignments/${asg_id}"
              payload: {}
              as: FOREMAN
              captures: { v4: $.data.version }
            - call: "POST /assignments/${asg_id}/production-entries"
              payload: { bid_item_id: "${bid_id}", work_date: "2026-08-06", quantity_reported: 3, expected_assignment_version: "${v4}" }
              as: FOREMAN
              captures: { e4: $.data.id }
            - call: "POST /work-packages/${wp_id}/inspections"
              payload: { production_entry_id: "${e4}", standard_code: "UTIL-OH-1.0" }
              as: UTILITY_INSPECTOR
              captures: { i4: $.data.id }
            - call: "POST /inspections/${i4}/submit"
              payload: { result: "FAIL" }
              as: UTILITY_INSPECTOR
          trigger: []
          assert:
            - "BidItem.${bid_id}.accepted_quantity == 10 (SUBMITTED 7, VOID 5, and REWORK_REQUIRED 3 all excluded)"
            - "WorkPackage.${wp_id}.rework_open_count == 1"

      - name: storm_premium_correct_result
        claim_type: correct_result
        grounds: [calculations.storm_premium_pay]
        excluded_because:
          difficulty_instance: standby_convert_vs_pure_callout_premium
          rationale: "Both variants' premium_pay values are asserted as literals in the named §1.8 instance."

      - name: billing_preview_variant_outputs
        claim_type: variant_divergence
        grounds: [calculations.billing_extension]
        excluded_because:
          difficulty_instance: billing_preview_provisional_vs_final
          rationale: "Variant selection and divergence asserted with literal subtotals/amounts_due in the named §1.8 instance."

      - name: overrun_tier_boundary_split
        claim_type: correct_result
        grounds: [calculations.billing_extension]
        excluded_because:
          difficulty_instance: overrun_tier_split_pricing
          rationale: "Tier boundary (110/10 split at the 110% threshold) asserted with literals in the named §1.8 instance."

      - name: invoice_rounding_order_precision
        claim_type: precision
        grounds: [calculations.invoice_total_aggregation]
        excluded_because:
          difficulty_instance: per_line_rounding_then_sum
          rationale: "Per-line-then-sum rounding order asserted with literals in the named §1.8 instance."

      - name: quantity_cap_threshold_behavior
        claim_type: constants_applied
        grounds: [calculations.quantity_cap_check]
        excluded_because:
          difficulty_instance: quantity_cap_equality_boundary
          rationale: "125% cap constant and inclusive boundary asserted in the named §1.8 instance."

  # ------------------------------------------------------------------
  # Section: validations
  # ------------------------------------------------------------------
  - section: validations
    instances:
      - name: missing_role_header_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request without X-User-Role returns 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /contracts/00000000-0000-0000-0000-000000000000"
              payload: {}
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED and http status == 401 (auth precedes existence — no 404 leak)"

      - name: foreman_cannot_create_contract
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "FOREMAN attempting POST /contracts (a CONTRACTOR_PM exclusive) returns 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /contracts"
              payload: { utility_name: "City Power", contract_number: "CV-1", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: FOREMAN
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN and http status == 403; no contract is created"

      - name: bid_items_locked_after_activation
        claim_type: violation_to_error
        grounds:
          - validations[priority=7b]
          - errors[ERR_BID_ITEMS_LOCKED]
        distinguishing_aspect: "Adding a bid item after the contract leaves DRAFT fails with ERR_BID_ITEMS_LOCKED; the unit-price schedule is immutable once ACTIVE."
        test_recipe:
          setup: ["Contract CD-3 with one bid item, already ACTIVE"]
          setup_api_calls:
            - call: "POST /contracts"
              payload: { utility_name: "City Power", contract_number: "CD-3", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/bid-items"
              payload: { item_code: "OH-MISC", description: "Misc", unit: "HR", unit_price: 10.00, estimated_quantity: 100 }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/transition"
              payload: { to: "ACTIVE" }
              as: CONTRACTOR_PM
          trigger:
            - call: "POST /contracts/${cid}/bid-items"
              payload: { item_code: "OH-LATE", description: "Late item", unit: "EACH", unit_price: 99.00, estimated_quantity: 10 }
              as: CONTRACTOR_PM
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_BID_ITEMS_LOCKED and http status == 409"

      - name: work_package_create_requires_active_contract
        claim_type: violation_to_error
        grounds:
          - validations[priority=6b]
          - errors[ERR_CONTRACT_NOT_ACTIVE]
        distinguishing_aspect: "Creating a work package on a DRAFT contract fails with ERR_CONTRACT_NOT_ACTIVE."
        test_recipe:
          setup: ["Contract CD-4 in DRAFT with one bid item"]
          setup_api_calls:
            - call: "POST /contracts"
              payload: { utility_name: "City Power", contract_number: "CD-4", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/bid-items"
              payload: { item_code: "OH-MISC", description: "Misc", unit: "HR", unit_price: 10.00, estimated_quantity: 100 }
              as: CONTRACTOR_PM
          trigger:
            - call: "POST /contracts/${cid}/work-packages"
              payload: { name: "Too early", location: "L8", requires_outage: false }
              as: CONTRACTOR_PM
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CONTRACT_NOT_ACTIVE and http status == 409"

      - name: assignment_end_before_start_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=9h]
          - errors[ERR_INVALID_DATE_RANGE]
        distinguishing_aspect: "Assignment with end_date before start_date fails with ERR_INVALID_DATE_RANGE (422)."
        test_recipe:
          setup: ["Contract ACTIVE; work package MOBILIZED; crew and equipment exist"]
          setup_api_calls:
            - call: "POST /contracts"
              payload: { utility_name: "City Power", contract_number: "CV-2", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/bid-items"
              payload: { item_code: "OH-MISC", description: "Misc", unit: "HR", unit_price: 10.00, estimated_quantity: 100 }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/transition"
              payload: { to: "ACTIVE" }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/work-packages"
              payload: { name: "WP dr", location: "L9", requires_outage: false }
              as: CONTRACTOR_PM
              captures: { wp_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "MOBILIZED" }
              as: CONTRACTOR_PM
            - call: "POST /crews"
              payload: { crew_code: "CR-DR", crew_type: "OVERHEAD", base_rate_per_hour: 55.00 }
              as: CONTRACTOR_PM
              captures: { crew_id: $.data.id }
            - call: "POST /equipment"
              payload: { equipment_code: "EQ-DR", kind: "BUCKET_TRUCK", daily_rate: 120.00 }
              as: CONTRACTOR_PM
              captures: { eq_id: $.data.id }
          trigger:
            - call: "POST /work-packages/${wp_id}/assignments"
              payload: { crew_id: "${crew_id}", equipment_id: "${eq_id}", start_date: "2026-08-07", end_date: "2026-08-03" }
              as: FOREMAN
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_DATE_RANGE and http status == 422"

      - name: return_exceeds_issued_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=9i]
          - errors[ERR_RETURN_EXCEEDS_ISSUED]
        distinguishing_aspect: "Cumulative returns may not exceed quantity_issued: after issuing 10 and returning 7, a return of 4 fails with ERR_RETURN_EXCEEDS_ISSUED."
        test_recipe:
          setup: ["Contract ACTIVE; work package IN_PROGRESS with assignment; stock on_hand 10; issue mi1 of 10; 7 already returned"]
          setup_api_calls:
            - call: "POST /contracts"
              payload: { utility_name: "City Power", contract_number: "CV-3", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/bid-items"
              payload: { item_code: "OH-MISC", description: "Misc", unit: "EACH", unit_price: 10.00, estimated_quantity: 100 }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/transition"
              payload: { to: "ACTIVE" }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/work-packages"
              payload: { name: "WP ret", location: "L10", requires_outage: false }
              as: CONTRACTOR_PM
              captures: { wp_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "MOBILIZED" }
              as: CONTRACTOR_PM
            - call: "POST /crews"
              payload: { crew_code: "CR-RT", crew_type: "OVERHEAD", base_rate_per_hour: 55.00 }
              as: CONTRACTOR_PM
              captures: { crew_id: $.data.id }
            - call: "POST /equipment"
              payload: { equipment_code: "EQ-RT", kind: "BUCKET_TRUCK", daily_rate: 120.00 }
              as: CONTRACTOR_PM
              captures: { eq_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/assignments"
              payload: { crew_id: "${crew_id}", equipment_id: "${eq_id}", start_date: "2026-08-03", end_date: "2026-08-07" }
              as: FOREMAN
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "IN_PROGRESS" }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/stock-items"
              payload: { material_code: "MAT-1", description: "Connectors", uom: "EACH", initial_on_hand: 10 }
              as: UTILITY_DISPATCHER
              captures: { stock_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/material-issues"
              payload: { stock_item_id: "${stock_id}", quantity_issued: 10 }
              as: FOREMAN
              captures: { mi1: $.data.id }
            - call: "POST /material-issues/${mi1}/return"
              payload: { quantity: 7 }
              as: FOREMAN
          trigger:
            - call: "POST /material-issues/${mi1}/return"
              payload: { quantity: 4 }
              as: FOREMAN
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RETURN_EXCEEDS_ISSUED (7 + 4 > 10 issued); MaterialIssue.${mi1}.quantity_returned remains 7"

      - name: variance_reconcile_requires_pm_and_note
        claim_type: conditional_validation
        grounds:
          - validations[priority=9j]
          - state_machines.MaterialIssue.OPEN_to_VARIANCE_RECONCILED
        distinguishing_aspect: "Non-zero variance reconcile (issued 10, returned 2, installed 5) is rejected for FOREMAN with ERR_MATERIAL_VARIANCE_UNRESOLVED, then succeeds for CONTRACTOR_PM with a variance_note, yielding VARIANCE_RECONCILED with variance == 3."
        test_recipe:
          setup: ["Contract ACTIVE; work package IN_PROGRESS with assignment; stock on_hand 10; issue mi1 of 10 with 2 returned"]
          setup_api_calls:
            - call: "POST /contracts"
              payload: { utility_name: "City Power", contract_number: "CV-4", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/bid-items"
              payload: { item_code: "OH-MISC", description: "Misc", unit: "EACH", unit_price: 10.00, estimated_quantity: 100 }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/transition"
              payload: { to: "ACTIVE" }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/work-packages"
              payload: { name: "WP var", location: "L11", requires_outage: false }
              as: CONTRACTOR_PM
              captures: { wp_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "MOBILIZED" }
              as: CONTRACTOR_PM
            - call: "POST /crews"
              payload: { crew_code: "CR-VR", crew_type: "OVERHEAD", base_rate_per_hour: 55.00 }
              as: CONTRACTOR_PM
              captures: { crew_id: $.data.id }
            - call: "POST /equipment"
              payload: { equipment_code: "EQ-VR", kind: "BUCKET_TRUCK", daily_rate: 120.00 }
              as: CONTRACTOR_PM
              captures: { eq_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/assignments"
              payload: { crew_id: "${crew_id}", equipment_id: "${eq_id}", start_date: "2026-08-03", end_date: "2026-08-07" }
              as: FOREMAN
            - call: "POST /work-packages/${wp_id}/transition"
              payload: { to: "IN_PROGRESS" }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/stock-items"
              payload: { material_code: "MAT-2", description: "Splices", uom: "EACH", initial_on_hand: 10 }
              as: UTILITY_DISPATCHER
              captures: { stock_id: $.data.id }
            - call: "POST /work-packages/${wp_id}/material-issues"
              payload: { stock_item_id: "${stock_id}", quantity_issued: 10 }
              as: FOREMAN
              captures: { mi1: $.data.id }
            - call: "POST /material-issues/${mi1}/return"
              payload: { quantity: 2 }
              as: FOREMAN
          trigger:
            - call: "POST /material-issues/${mi1}/reconcile"
              payload: { quantity_installed: 5 }
              as: FOREMAN
              captures: { err: $.data.error_id }
            - call: "POST /material-issues/${mi1}/reconcile"
              payload: { quantity_installed: 5, variance_note: "3 units damaged on truck, incident report IR-77" }
              as: CONTRACTOR_PM
          assert:
            - "FOREMAN reconcile with variance fails: error_id == ERR_MATERIAL_VARIANCE_UNRESOLVED"
            - "CONTRACTOR_PM reconcile with note succeeds: MaterialIssue.${mi1}.status == VARIANCE_RECONCILED and variance == 3"
            - "WorkPackage.${wp_id}.open_material_issue_count == 0"

      - name: cross_contract_stock_reference_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=10]
          - errors[ERR_CROSS_CONTRACT_REFERENCE]
        distinguishing_aspect: "Issuing a stock item owned by contract B into a work package of contract A fails with ERR_CROSS_CONTRACT_REFERENCE even though both entities exist."
        test_recipe:
          setup: ["Contract A ACTIVE with work package IN_PROGRESS + assignment; Contract B (DRAFT) with stock item SB on_hand 10"]
          setup_api_calls:
            - call: "POST /contracts"
              payload: { utility_name: "City Power", contract_number: "CV-5A", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
              captures: { ca: $.data.id }
