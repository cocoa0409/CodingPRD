  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_policy_version_on_claim_transaction_excluded
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[claim-txn-stale-policy]
          - errors[ERR_STALE_POLICY_VERSION]
        excluded_because:
          difficulty_instance: compensating_invariant / reserve_set_then_release_conserves_claim_incurred
          rationale: "That §1.8 instance exercises the happy-path OCC handshake on /claims/{id}/transactions (capturing and re-supplying expected_policy_version across PAYMENT/RESERVE_SET/RESERVE_RELEASE). The dedicated stale-version negative test below covers the rejection branch."

      - name: stale_policy_version_negative_on_claim_transaction
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[claim-txn-stale-policy]
          - errors[ERR_STALE_POLICY_VERSION]
          - entities.Policy.fields.version
        distinguishing_aspect: "Re-supplying a now-stale expected_policy_version (one less than current) on a second /claims/{id}/transactions post -> 412 ERR_STALE_POLICY_VERSION; the second post's erosion is not applied."
        test_recipe:
          setup: ["IN_FORCE OCCURRENCE policy; clock 2026-06-01; a RESERVED claim; capture the policy version AFTER the first reserve, then advance it with a second reserve so the captured value goes stale."]
          setup_api_calls:
            - call: "POST /insurers"
              payload: { name: "Acme Mutual", naic_code: "12345" }
              as: InsurerAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /insureds"
              payload: { insurer_id: "${ins_id}", legal_name: "BuildCo LLC", fein: "11-1111111", primary_basis: "PAYROLL" }
              as: Underwriter
              captures: { insured_id: $.data.id }
            - call: "POST /policies"
              payload: { insurer_id: "${ins_id}", insured_id: "${insured_id}", policy_number: "CGL-C32", coverage_trigger: "OCCURRENCE", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z", each_occurrence_limit_cents: 1000000000, general_aggregate_limit_cents: 2000000000, products_aggregate_limit_cents: 1000000000, premium_basis: "PAYROLL", rate_per_unit_cents: 300, minimum_premium_cents: 100000, estimated_exposure_units: 1000000 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /insurers/${ins_id}/clock"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: InsurerAdmin
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", claimant_name: "W", loss_type: "BODILY_INJURY", occurrence_date: "2026-03-01T00:00:00.000Z", reported_date: "2026-03-02T00:00:00.000Z" }
              as: ClaimsAdjuster
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/transactions"
              payload: { txn_type: "RESERVE_SET", amount_cents: 10000000 }
              as: ClaimsAdjuster
            - call: "GET /policies/${pol_id}"
              payload: {}
              as: ClaimsAdjuster
              captures: { pv_stale: $.data.version }
            - call: "POST /claims/${claim_id}/transactions"
              payload: { txn_type: "RESERVE_SET", amount_cents: 20000000, expected_policy_version: "${pv_stale}" }
              as: ClaimsAdjuster
          trigger:
            - call: "POST /claims/${claim_id}/transactions"
              payload: { txn_type: "RESERVE_SET", amount_cents: 30000000, expected_policy_version: "${pv_stale}" }
              as: ClaimsAdjuster
              captures: { err: $.data.error_id }
          assert:
            - "Response status 412, data.error_id == ERR_STALE_POLICY_VERSION"
            - "Claim.${claim_id}.incurred_cents == 30000000 (only the first two reserves applied; stale post rejected)"

      - name: stale_policy_version_on_audit_finalize
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[audit-finalize-stale-policy]
          - errors[ERR_STALE_POLICY_VERSION]
        distinguishing_aspect: "Finalizing an audit with an expected_policy_version captured before the policy was further mutated -> 412 ERR_STALE_POLICY_VERSION. Here the captured version is decremented by 1 to force the mismatch deterministically."
        test_recipe:
          setup: ["EXPIRED OCCURRENCE policy with a COMPLETED audit (net adjustment material, 150000)."]
          setup_api_calls:
            - call: "POST /insurers"
              payload: { name: "Acme Mutual", naic_code: "12345" }
              as: InsurerAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /insureds"
              payload: { insurer_id: "${ins_id}", legal_name: "BuildCo LLC", fein: "11-1111111", primary_basis: "PAYROLL" }
              as: Underwriter
              captures: { insured_id: $.data.id }
            - call: "POST /policies"
              payload: { insurer_id: "${ins_id}", insured_id: "${insured_id}", policy_number: "CGL-C33", coverage_trigger: "OCCURRENCE", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z", each_occurrence_limit_cents: 100000000, general_aggregate_limit_cents: 200000000, products_aggregate_limit_cents: 100000000, premium_basis: "PAYROLL", rate_per_unit_cents: 300, minimum_premium_cents: 100000, estimated_exposure_units: 1000000 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /insurers/${ins_id}/clock"
              payload: { to_iso8601: "2027-01-02T00:00:00.000Z" }
              as: InsurerAdmin
            - call: "POST /audits"
              payload: { policy_id: "${pol_id}", audit_basis: "PAYROLL" }
              as: PremiumAuditor
              captures: { audit_id: $.data.id }
            - call: "POST /audits/${audit_id}/start"
              payload: {}
              as: PremiumAuditor
            - call: "POST /audits/${audit_id}/exposure-records"
              payload: { class_code: "91560", basis_amount_units: 1500000 }
              as: PremiumAuditor
            - call: "POST /audits/${audit_id}/complete"
              payload: {}
              as: PremiumAuditor
            - call: "GET /policies/${pol_id}"
              payload: {}
              as: PremiumAuditor
              captures: { pv: $.data.version }
          trigger:
            - call: "POST /audits/${audit_id}/finalize"
              payload: { expected_policy_version: "${pv} - 1" }
              as: PremiumAuditor
              captures: { err: $.data.error_id }
          assert:
            - "Response status 412, data.error_id == ERR_STALE_POLICY_VERSION"
            - "PremiumAudit.${audit_id}.status == COMPLETED (unchanged); Policy.${pol_id}.status == EXPIRED (not AUDIT_CLOSED)"

      - name: audit_finalize_material_adjustment_drives_audit_closed
        claim_type: dual_variant_calculation
        grounds:
          - state_machines.PremiumAudit.COMPLETED_to_FINALIZED
          - state_machines.Policy.EXPIRED_to_AUDIT_CLOSED
          - entities.Policy.fields.audited_premium_cents
        distinguishing_aspect: "Finalizing a COMPLETED audit whose abs(net_adjustment) 150000 exceeds the 50000 waiver threshold -> status FINALIZED (not WAIVED); Policy moves EXPIRED -> AUDIT_CLOSED and audited_premium_cents takes the computed 450000."
        test_recipe:
          setup: ["EXPIRED OCCURRENCE policy (estimated 300000); audit started, one ExposureRecord 1500000 -> computed 450000, net 150000; COMPLETED."]
          setup_api_calls:
            - call: "POST /insurers"
