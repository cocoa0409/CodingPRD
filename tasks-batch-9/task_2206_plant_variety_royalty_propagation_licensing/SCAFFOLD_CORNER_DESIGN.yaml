            - "RoyaltyLineItem.${l2_id}.billable_units == 10001, effective_rate_cents == 38.2375, provisional_amount_cents == 382413"
            - "RoyaltyReport.${r_id}.provisional_total_cents == 784913 (402500 + 382413)"
            - "The one-unit-larger line is CHEAPER in total: 382413 < 402500"
            - "Both rates sit inside the collar [26.2500, 52.5000], so neither is clamped"

      - name: annuity_volume_credit_band_boundary_at_five_hundred_thousand_cents
        claim_type: tiered_pricing
        grounds:
          - calculations.annuity_total_due.constants
          - calculations.annuity_total_due.formula
          - endpoints[POST /protection-filings/{filing_id}/pay-annuity]
        distinguishing_aspect: "CREDIT_TIER_HIGH_BOUND_CENTS 500000 is the inclusive start of the 0.06 band: an on-time annuity with pre_credit_total exactly 500000 earns credit 30000 and pays 470000, while pre_credit_total 499999 sits in the 0.03 band, earns round_half_up(14999.97) = 15000 and pays 484999 - one cent less base costs 14999 cents MORE to pay."
        test_recipe:
          setup:
            - "One Variety with two GRANTED filings: US with annuity_base_cents 500000 and CA with annuity_base_cents 499999."
            - "Both are moved to MAINTENANCE_DUE with annuity_due_date 2026-10-01T00:00:00Z while the clock stays at 2026-08-01T00:00:00Z, so annuity_days_late is 0 and surcharge_pct is 0.00 for both."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Juneberry Bramble", species: "Rubus idaeus", breeder_code: "JN", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { v_id: $.data.id }
            - call: "POST /protection-filings"
              payload: { variety_id: "${v_id}", instrument_type: "PLANT_PATENT", jurisdiction_code: "US", annuity_base_cents: 500000 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { f_us: $.data.id }
            - call: "POST /protection-filings"
              payload: { variety_id: "${v_id}", instrument_type: "PLANT_PATENT", jurisdiction_code: "CA", annuity_base_cents: 499999 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { f_ca: $.data.id }
            - call: "POST /protection-filings/${f_us}/file"
              payload: {}
              as: BreederAdmin
              as_user_id: "breeder-1"
            - call: "POST /protection-filings/${f_us}/grant"
              payload: {}
              as: BreederAdmin
              as_user_id: "breeder-1"
            - call: "POST /protection-filings/${f_ca}/file"
              payload: {}
              as: BreederAdmin
              as_user_id: "breeder-1"
            - call: "POST /protection-filings/${f_ca}/grant"
              payload: {}
              as: BreederAdmin
              as_user_id: "breeder-1"
            - call: "POST /protection-filings/${f_us}/schedule-annuity"
              payload: { annuity_due_date: "2026-10-01T00:00:00Z", annuity_grace_days: 90 }
              as: BreederAdmin
              as_user_id: "breeder-1"
            - call: "POST /protection-filings/${f_ca}/schedule-annuity"
              payload: { annuity_due_date: "2026-10-01T00:00:00Z", annuity_grace_days: 90 }
              as: BreederAdmin
              as_user_id: "breeder-1"
          trigger:
            - call: "POST /protection-filings/${f_us}/pay-annuity"
              payload: { paid_amount_cents: 470000 }
              as: BreederAdmin
              as_user_id: "breeder-1"
            - call: "POST /protection-filings/${f_ca}/pay-annuity"
              payload: { paid_amount_cents: 484999 }
              as: BreederAdmin
              as_user_id: "breeder-1"
          assert:
            - "Both calls return 200 and both filings are back at status GRANTED with installments_paid_count == 1"
            - "ProtectionFiling.${f_us}: annuity_days_late == 0, annuity_surcharge_cents == 0, annuity_volume_credit_cents == 30000, annuity_total_due_cents == 470000"
            - "ProtectionFiling.${f_ca}: annuity_days_late == 0, annuity_surcharge_cents == 0, annuity_volume_credit_cents == 15000, annuity_total_due_cents == 484999"
            - "484999 > 470000 - the smaller base pays the larger amount, proving the band boundary is inclusive at 500000"
            - "Variety.${v_id}.protection_posture == PROTECTED and protected_jurisdictions == [\"CA\", \"US\"] throughout"
            - "Paying 469999 on ${f_us} instead returns ERR_ANNUITY_AMOUNT_MISMATCH"

      - name: compliance_rolling_window_lower_bound_is_exclusive_at_exactly_one_hundred_twenty_days
        claim_type: precision
        grounds:
          - calculations.propagator_compliance_score.precision
          - calculations.propagator_compliance_score.variants[rolling_120d]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "The window is half-open with an EXCLUSIVE lower bound: a CONFIRMED_UNAUTH_MATCH penalty stamped 2026-08-25T00:00:00Z is still inside the window at clock 2026-12-22 (window_lower 2026-08-24) giving compliance_score 70, and has aged out at exactly 2026-12-23 (window_lower == the event instant) giving 100 - while lifetime_compliance_score stays 70 at both instants."
        test_recipe:
          setup:
            - "One Variety, one Propagator with an ACTIVE agreement, and a SurveillanceCase naming that propagator, concluded MATCH_CONFIRMED at clock 2026-08-25T00:00:00Z (max_match_confidence 0.9600)."
            - "2026-08-25 + ROLLING_WINDOW_DAYS 120 == 2026-12-23, so that date is the exact ageing-out instant."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Kingfisher Bramble", species: "Rubus idaeus", breeder_code: "KF", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { v_id: $.data.id }
            - call: "POST /propagators"
              payload: { legal_name: "Kingfisher Nursery", home_territory_code: "US-WA" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { p_id: $.data.id }
            - call: "POST /propagator-agreements"
              payload: { propagator_id: "${p_id}", quality_tier: "TIER_B", territory_codes: ["US-WA"], term_start: "2026-08-01T00:00:00Z", term_end: "2027-08-01T00:00:00Z" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { a_id: $.data.id }
            - call: "POST /propagator-agreements/${a_id}/countersign"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-1"
            - call: "POST /surveillance-cases"
              payload: { variety_id: "${v_id}", suspected_propagator_id: "${p_id}", market_survey_ref: "MS-2026-060" }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
              captures: { c_id: $.data.id }
            - call: "POST /surveillance-cases/${c_id}/sample"
              payload: { sampled_unit_count: 30 }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
            - call: "POST /surveillance-cases/${c_id}/genetic-tests"
              payload: { lab_code: "GENLAB", marker_panel: "SSR-16", match_confidence: 0.9600 }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00Z" }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
            - call: "POST /surveillance-cases/${c_id}/conclude-testing"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "auditor-1"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-22T00:00:00Z" }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-23T00:00:00Z" }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
          assert:
            - "After the conclude-testing in setup: SurveillanceCase.${c_id}.concluded_at == 2026-08-25T00:00:00Z and Propagator.${p_id}.compliance_score == 70"
            - "After the 2026-12-22 clock call: Propagator.${p_id}.compliance_score == 70 (window_lower 2026-08-24 < the event instant, so the event is still counted) and lifetime_compliance_score == 70"
            - "After the 2026-12-23 clock call: Propagator.${p_id}.compliance_score == 100 (window_lower == the event instant, and the lower bound is exclusive) while lifetime_compliance_score is still 70"
            - "PropagatorAgreement.${a_id}.status == ACTIVE at every instant - 70 is not strictly below SUSPEND_THRESHOLD 70, so no suspension ever fired"
            - "The 2026-12-23 response reports compliance_recompute_count >= 1"

      - name: royalty_variant_divergence_corner_deferred_to_difficulty_design
        claim_type: variant_divergence
        grounds:
          - calculations.royalty_report_totals.variants
        distinguishing_aspect: "The two-variant divergence corner - identical stored data producing different totals under reported_basis and audited_basis, with the delta asserted - is covered end to end by the difficulty design."
        excluded_because:
          difficulty_instance: royalty_report_reported_basis_versus_audited_basis_divergence
          rationale: "That dual_variant_calc instance asserts provisional_total_cents 394450, final_total_cents 458850, the 64400-cent delta and both effective rates 40.2500 / 38.2375 on one shared line."

      - name: royalty_variant_selection_corner_deferred_to_difficulty_design
        claim_type: variant_selection
        grounds:
          - calculations.royalty_report_totals.variants
          - calculations.propagator_compliance_score.variants
        distinguishing_aspect: "The variant-selection corner - the right variant chosen for the right context, and written to its own field - is covered by the difficulty design on both dual-variant calculations."
        excluded_because:
          difficulty_instance: propagator_compliance_rolling_window_versus_lifetime_divergence
          rationale: "That dual_variant_calc instance asserts that rolling_120d writes compliance_score and lifetime writes lifetime_compliance_score, and that only the former responds to the clock; the royalty pair is likewise pinned by royalty_report_reported_basis_versus_audited_basis_divergence (submit writes provisional_*, accept writes final_*)."

      - name: royalty_variant_reconciliation_corner_deferred_to_difficulty_design
        claim_type: reconciliation
        grounds:
          - calculations.royalty_report_totals
          - calculations.propagator_royalty_ledger
        distinguishing_aspect: "The reconciliation corner - the delta applied to the ledger when the variant switches from provisional to final - is covered by the difficulty design."
        excluded_because:
          difficulty_instance: royalty_report_reported_basis_versus_audited_basis_divergence
          rationale: "That instance carries the switch through to Propagator.royalty_payable_cents, asserting the ledger books the audited figure rather than the provisional one."

      - name: compliance_decay_corner_deferred_to_difficulty_design
        claim_type: decay_function
        grounds:
          - calculations.propagator_compliance_score
        distinguishing_aspect: "The decay-function corner - penalties ageing out as the clock advances with no new API write - is covered by the difficulty design."
        excluded_because:
          difficulty_instance: propagator_compliance_rolling_window_versus_lifetime_divergence
          rationale: "That instance advances the clock past a penalty's 120-day anniversary and asserts compliance_score rises while lifetime_compliance_score does not."

      - name: quota_and_ledger_aggregation_corner_deferred_to_difficulty_design
        claim_type: aggregation
        grounds:
          - calculations.quota_tag_inventory
          - calculations.propagator_royalty_ledger
        distinguishing_aspect: "The aggregation corner - running totals correct after an add and correct again after a reversal - is covered on both aggregation calculations by the difficulty design."
        excluded_because:
          difficulty_instance: voiding_an_issued_tag_order_restores_quota_unit_inventory_exactly
          rationale: "That compensating_invariant instance asserts the tag-inventory sums after add and after reversal; reversing_a_settlement_restores_propagator_royalty_payable_exactly does the same for the royalty ledger."

  # =====================================================================
  - section: validations
    instances:
      - name: duplicate_denomination_compared_case_insensitively_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=22]
          - errors.ERR_DUPLICATE_DENOMINATION
          - entities.Variety.fields.denomination
        distinguishing_aspect: "Uniqueness is case-insensitive after trimming, so \"  aurora bramble \" collides with the stored \"Aurora Bramble\" and returns 409 ERR_DUPLICATE_DENOMINATION - a byte-equality implementation would let the duplicate through."
        test_recipe:
          setup:
            - "One Variety with denomination \"Aurora Bramble\"."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Aurora Bramble", species: "Rubus idaeus", breeder_code: "AB", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
          trigger:
            - call: "POST /varieties"
              payload: { denomination: "  aurora bramble ", species: "Vitis vinifera", breeder_code: "XX", base_royalty_cents_per_plant: 50, base_royalty_cents_per_acre: 1500 }
              as: BreederAdmin
              as_user_id: "breeder-1"
          assert:
            - "HTTP status is 409 and data.error_id == ERR_DUPLICATE_DENOMINATION"
            - "GET /varieties returns total_count == 1"
            - "A genuinely different denomination \"Aurora Brambleberry\" is accepted, so the check is equality-based and not a prefix match"

      - name: brand_mark_equal_to_the_denomination_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=21]
          - errors.ERR_BRAND_CONFLICTS_DENOMINATION
          - state_machines[Variety.brand_status].transitions[BRAND_NONE->BRAND_REGISTERED].preconditions
        distinguishing_aspect: "The scenario's separation of trademark from variety name is enforced at registration: a brand_mark_text equal (case-insensitively, after trimming) to this variety's own denomination is refused, and so is one equal to ANOTHER variety's denomination or registered mark."
        test_recipe:
          setup:
            - "Two varieties: V1 \"Bracken Bramble\" and V2 \"Coral Bramble\" with the registered mark \"CORALSTAR\"."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Bracken Bramble", species: "Rubus idaeus", breeder_code: "BK", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { v1_id: $.data.id }
            - call: "POST /varieties"
              payload: { denomination: "Coral Bramble", species: "Rubus idaeus", breeder_code: "CR", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { v2_id: $.data.id }
            - call: "POST /varieties/${v2_id}/brand-register"
              payload: { brand_mark_text: "CORALSTAR", brand_registry_class: "CLASS_31", brand_renewal_due_at: "2027-08-01T00:00:00Z" }
              as: BreederAdmin
              as_user_id: "breeder-1"
          trigger:
            - call: "POST /varieties/${v1_id}/brand-register"
              payload: { brand_mark_text: " bracken bramble ", brand_registry_class: "CLASS_31", brand_renewal_due_at: "2027-08-01T00:00:00Z" }
              as: BreederAdmin
              as_user_id: "breeder-1"
          assert:
            - "HTTP status is 422 and data.error_id == ERR_BRAND_CONFLICTS_DENOMINATION"
            - "Variety.${v1_id}.brand_status is still BRAND_NONE and brand_mark_text is null"
            - "The same call with brand_mark_text \"Coral Bramble\" (another variety's denomination) also returns ERR_BRAND_CONFLICTS_DENOMINATION"
            - "The same call with brand_mark_text \"coralstar\" (another variety's registered mark) also returns ERR_BRAND_CONFLICTS_DENOMINATION"
            - "The same call with brand_mark_text \"BRACKENSTAR\" succeeds and Variety.${v1_id}.brand_status == BRAND_REGISTERED"

      - name: clock_set_to_an_earlier_or_equal_instant_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=34]
          - errors.ERR_CLOCK_NOT_MONOTONIC
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "The clock input must be STRICTLY greater than the present value, so re-sending the current instant is rejected as well as an earlier one - which is what stops already-fired sweeps from replaying."
        test_recipe:
          setup:
            - "Empty database, clock advanced once to 2026-09-15T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: BreederAdmin
              as_user_id: "breeder-1"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: BreederAdmin
              as_user_id: "breeder-1"
          assert:
            - "HTTP status is 422 and data.error_id == ERR_CLOCK_NOT_MONOTONIC"
            - "A subsequent POST /_clock/set_current_utc with 2026-08-20T00:00:00Z (earlier still) also returns ERR_CLOCK_NOT_MONOTONIC"
            - "A subsequent POST /_clock/set_current_utc with 2026-09-15T00:00:01Z succeeds and reports current_utc == 2026-09-15T00:00:01Z"
            - "The very first call of a fresh database with 2026-08-01T00:00:00Z is rejected too, because that is exactly the startup default"

      - name: trial_interval_with_harvest_before_plant_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=29]
          - errors.ERR_INVALID_INTERVAL
          - endpoints[POST /variety-trials]
        distinguishing_aspect: "VarietyTrial requires plant_date < harvest_date strictly, so equal endpoints are rejected as well as reversed ones - and the same priority-29 rule covers four other entities with their own boundary semantics."
        test_recipe:
          setup:
            - "One Variety and one TrialSite."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Delphine Bramble", species: "Rubus idaeus", breeder_code: "DL", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { v_id: $.data.id }
            - call: "POST /trial-sites"
              payload: { site_name: "Delphine Station", region_code: "PNW", plot_capacity: 60 }
              as: TrialCoordinator
              as_user_id: "coord-1"
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /variety-trials"
              payload: { variety_id: "${v_id}", trial_site_id: "${s_id}", plot_count: 10, plant_date: "2026-09-20T00:00:00Z", harvest_date: "2026-08-05T00:00:00Z" }
              as: TrialCoordinator
              as_user_id: "coord-1"
          assert:
            - "HTTP status is 422 and data.error_id == ERR_INVALID_INTERVAL"
            - "GET /variety-trials returns total_count == 0"
            - "plant_date == harvest_date == 2026-09-20T00:00:00Z also returns ERR_INVALID_INTERVAL (the trial window is half-open and must be non-empty)"
            - "POST /propagator-agreements with term_start == term_end also returns ERR_INVALID_INTERVAL, while POST /sublicense-grants with effective_date == expiry_date is ACCEPTED - that interval is closed, so a one-day grant is legitimate"

      - name: replacement_filing_allowed_once_the_earlier_one_lapsed
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=23]
          - calculations.variety_protection_posture
          - state_machines[ProtectionFiling.status].transitions[GRANTED->LAPSED]
        distinguishing_aspect: "The duplicate-filing guard only spans statuses {DRAFT, FILED, GRANTED, MAINTENANCE_DUE}, so once the first filing LAPSES a replacement filing for the identical (variety, instrument_type, jurisdiction) triple is accepted - and it lifts the posture from LAPSED_PROTECTION back to PENDING without restoring protected_jurisdictions."
        test_recipe:
          setup:
            - "One Variety with a US PLANT_PATENT filing carried DRAFT -> FILED -> GRANTED and then voluntarily lapsed."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Elmshade Bramble", species: "Rubus idaeus", breeder_code: "EL", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { v_id: $.data.id }
            - call: "POST /protection-filings"
              payload: { variety_id: "${v_id}", instrument_type: "PLANT_PATENT", jurisdiction_code: "US", annuity_base_cents: 200000 }
