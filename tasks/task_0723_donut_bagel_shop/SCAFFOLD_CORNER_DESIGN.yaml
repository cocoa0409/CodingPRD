          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "GLAZED", name: "Glazed Donut", category: "DONUT", unit_price_cents: 150, dozen_price_cents: 1500, bulk_threshold: 24, bulk_unit_price_cents: 110, unit_cost_cents: 45 }
              as: ShopAdmin
              captures: { glazed_id: $.data.id }
            - call: "POST /production-days"
              payload: { business_date: "2026-04-11", delivery_cutoff_utc: "2026-04-11T20:00:00Z" }
              as: ShopAdmin
              captures: { d_id: $.data.id }
            - call: "POST /production-days/${d_id}/bake-batches"
              payload: { product_id: "${glazed_id}", par_qty: 10 }
              as: BakeManager
              captures: { b_id: $.data.id }
            - call: "POST /production-days/${d_id}/start-baking"
              payload: {}
              as: BakeManager
            - call: "POST /production-days/${d_id}/bake-batches/${b_id}/bake"
              payload: { baked_qty: 10 }
              as: BakeManager
            - call: "POST /production-days/${d_id}/open-sales"
              payload: {}
              as: BakeManager
            - call: "POST /production-days/${d_id}/bake-batches/${b_id}/sweep"
              payload: {}
              as: BakeManager
            - call: "POST /production-days/${d_id}/close-cutoff"
              payload: {}
              as: ShopAdmin
            - call: "GET /production-days/${d_id}"
              payload: {}
              as: BakeManager
              captures: { v: $.data.version }
          trigger:
            - call: "POST /production-days/${d_id}/reconcile"
              payload: { expected_production_day_version: "${v}" }
              as: BakeManager
          assert:
            - "ProductionDay.${d_id}.status == RECONCILED"

      - name: occ_stale_version_reconcile_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reconcile-stale-day]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Reconcile carrying a stale expected_production_day_version (one below current) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["a CUTOFF day with one swept batch; client holds a version captured before the close-cutoff bump"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "GLAZED", name: "Glazed Donut", category: "DONUT", unit_price_cents: 150, dozen_price_cents: 1500, bulk_threshold: 24, bulk_unit_price_cents: 110, unit_cost_cents: 45 }
              as: ShopAdmin
              captures: { glazed_id: $.data.id }
            - call: "POST /production-days"
              payload: { business_date: "2026-04-12", delivery_cutoff_utc: "2026-04-12T20:00:00Z" }
              as: ShopAdmin
              captures: { d_id: $.data.id }
            - call: "POST /production-days/${d_id}/bake-batches"
              payload: { product_id: "${glazed_id}", par_qty: 10 }
              as: BakeManager
              captures: { b_id: $.data.id }
            - call: "POST /production-days/${d_id}/start-baking"
              payload: {}
              as: BakeManager
            - call: "POST /production-days/${d_id}/bake-batches/${b_id}/bake"
              payload: { baked_qty: 10 }
              as: BakeManager
            - call: "POST /production-days/${d_id}/open-sales"
              payload: {}
              as: BakeManager
            - call: "POST /production-days/${d_id}/bake-batches/${b_id}/sweep"
              payload: {}
              as: BakeManager
            - call: "POST /production-days/${d_id}/close-cutoff"
              payload: {}
              as: ShopAdmin
            - call: "GET /production-days/${d_id}"
              payload: {}
              as: BakeManager
              captures: { v: $.data.version }
          trigger:
            - call: "POST /production-days/${d_id}/reconcile"
              payload: { expected_production_day_version: "${v} - 1" }
              as: BakeManager
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_STALE_VERSION"

      - name: version_increments_on_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.ProductionDay.fields.version, state_machines.ProductionDay.OPEN_to_BAKING]
        distinguishing_aspect: "ProductionDay.version starts at 1 on create and increments after start-baking mutation."
        test_recipe:
          setup: ["an OPEN day with one batch"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "GLAZED", name: "Glazed Donut", category: "DONUT", unit_price_cents: 150, dozen_price_cents: 1500, bulk_threshold: 24, bulk_unit_price_cents: 110, unit_cost_cents: 45 }
              as: ShopAdmin
              captures: { glazed_id: $.data.id }
            - call: "POST /production-days"
              payload: { business_date: "2026-04-13", delivery_cutoff_utc: "2026-04-13T20:00:00Z" }
              as: ShopAdmin
              captures: { d_id: $.data.id, v0: $.data.version }
            - call: "POST /production-days/${d_id}/bake-batches"
              payload: { product_id: "${glazed_id}", par_qty: 10 }
              as: BakeManager
          trigger:
            - call: "POST /production-days/${d_id}/start-baking"
              payload: {}
              as: BakeManager
          assert:
            - "ProductionDay.${d_id}.version == 2"

