              as: HarvestCoordinator
            - call: "POST /grower-relations/pick-calls"
              payload: { contract_id: "${contract_id}", block_id: "${block_id}", target_pick_at: "2026-08-25T14:00:00Z", estimated_tons: 40.000 }
              as: HarvestCoordinator
              captures: { pick_call_id: $.data.id }
            - call: "POST /grower-relations/pick-calls/${pick_call_id}/acknowledge"
              payload: {}
              as: Grower
          trigger:
            - call: "POST /grower-relations/delivery-appointments"
              payload: { pick_call_id: "${pick_call_id}", lane_id: "${lane_id}", window_start: "2026-08-25T14:00:00Z", window_end: "2026-08-25T16:00:00Z", planned_tons: 20.000 }
              as: Grower
              captures: { appointment_grower: $.data.id }
            - call: "POST /grower-relations/delivery-appointments"
              payload: { pick_call_id: "${pick_call_id}", lane_id: "${lane_id}", window_start: "2026-08-25T16:30:00Z", window_end: "2026-08-25T18:30:00Z", planned_tons: 20.000 }
              as: HarvestCoordinator
              captures: { appointment_desk: $.data.id }
            - call: "GET /grower-relations/delivery-appointments"
              payload: { pick_call_id: "${pick_call_id}" }
              as: HarvestCoordinator
            - call: "GET /grower-relations/crush-pad-lanes/${lane_id}"
              as: HarvestCoordinator
            - call: "POST /grower-relations/delivery-appointments/${appointment_grower}/cancel"
              payload: { reason: "Crew reassigned" }
              as: HarvestCoordinator
            - call: "GET /grower-relations/crush-pad-lanes/${lane_id}"
              as: HarvestCoordinator
          assert:
            - "Both bookings return 201 with status SCHEDULED: the producer and the harvest desk are genuine peers on this endpoint"
            - "Listing the pick call's appointments returns total_count == 2: one row created by the producer and one by the desk, indistinguishable in shape — the write is genuinely shared even though the list read is winery-side only (Grower is not among §1.5's roles for GET /grower-relations/delivery-appointments)"
            - "The lane reports committed_tons == 40.000 and scheduled_appointment_count == 2 regardless of which role created each row"
            - "Cancellation is NOT shared: it is exclusive to HarvestCoordinator, and after the cancel the lane reports committed_tons == 20.000 and scheduled_appointment_count == 1"
            - "The crush-pad-lane and sampling-crew rows in the setup were created by GrowerRelationsManager, which shares those two writes with HarvestCoordinator — the same peer pattern from the other side"

  # ===========================================================================
  # SECTION 8 — Cross-cutting complexity layers
  # complexity_profile.complexity_layers declares four layers:
  # dual_variant_calculation, rate_threshold_triggers, cascading_side_effects and
  # optimistic_concurrency. §1.2.1 declares exactly two concurrency rules and both
  # are probed by the single OCC instance below.
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_expected_versions_are_refused_412_on_both_concurrency_rules
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[ERR_STALE_APPOINTMENT_VERSION]
          - concurrency_rules[ERR_STALE_WEIGH_TAG_VERSION]
          - validations.priority_12
          - validations.priority_13
        distinguishing_aspect: |
          Both OCC guards must be live, and both must be checked AFTER existence and shape but
          BEFORE any state or business rule, which is why the stale probes here are otherwise
          perfectly legal calls. The trap is the version bump itself: the first weigh tag drives
          the appointment SCHEDULED -> ARRIVED and therefore invalidates the version the scale
          house is holding, so a second load on the same appointment must re-read. An
          implementation that only increments version on direct writes to the row — not on
          cascaded transitions — accepts the stale token and silently loses the concurrency
          guarantee. The 412 is also distinct from every other failure code in the catalogue.
        test_recipe:
          setup:
            - "Standard chain to a SCHEDULED appointment on lane L1 for 2026-08-25T14:00-16:00Z with planned_tons 40.000; the clock is inside the window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T08:00:00Z" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/growers"
              payload: { name: "Ridgeline Vineyards", license_number: "PL-44821", region_code: "NAPA-NORTH" }
              as: GrowerRelationsManager
              captures: { grower_id: $.data.id }
            - call: "POST /grower-relations/vineyard-blocks"
              payload: { grower_id: "${grower_id}", block_code: "B-12", varietal: "CABERNET_SAUVIGNON", acres: 20.000, expected_yield_tons_per_acre: 2.000, ava_code: "NAPA-VALLEY" }
              as: GrowerRelationsManager
              captures: { block_id: $.data.id }
            - call: "POST /grower-relations/quality-specs"
              payload: { spec_code: "CAB-STD-2026", min_brix_accept: 20.0, brix_bonus_start: 24.0, brix_penalty_start: 22.0, rot_rejection_pct: 8.0, min_brix_pick_call: 21.0 }
              as: GrowerRelationsManager
              captures: { spec_id: $.data.id }
            - call: "POST /grower-relations/crush-pad-lanes"
              payload: { lane_code: "L1", daily_capacity_tons: 80.000, turnaround_buffer_minutes: 30, max_load_tons: 40.000 }
              as: HarvestCoordinator
              captures: { lane_id: $.data.id }
            - call: "POST /grower-relations/sampling-crews"
              payload: { crew_code: "SC-1", region_code: "NAPA-NORTH", max_concurrent_visits: 2 }
              as: HarvestCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /grower-relations/grape-contracts"
              payload: { grower_id: "${grower_id}", quality_spec_id: "${spec_id}", contract_code: "GC-OCC", contract_basis: "TONNAGE", base_price_per_ton_cents: 450000, over_delivery_policy: "ACCEPT_AT_CONTRACT", term_start_vintage: 2026, term_end_vintage: 2027, committed_tons: 80.000, installment_plan: [{ installment_no: 1, pct_of_settlement: 100.0, due_offset_days: 30, lien_protected: true }] }
              as: GrowerRelationsManager
              captures: { contract_id: $.data.id }
            - call: "POST /grower-relations/contract-block-allocations"
              payload: { contract_id: "${contract_id}", block_id: "${block_id}" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/grape-contracts/${contract_id}/offer"
              payload: {}
              as: GrowerRelationsManager
            - call: "POST /grower-relations/grape-contracts/${contract_id}/accept"
              payload: {}
              as: Grower
            - call: "POST /grower-relations/sampling-visits"
              payload: { contract_id: "${contract_id}", block_id: "${block_id}", crew_id: "${crew_id}", window_start: "2026-08-20T09:00:00Z", window_end: "2026-08-20T11:00:00Z" }
              as: HarvestCoordinator
              captures: { visit_id: $.data.id }
            - call: "POST /grower-relations/sampling-visits/${visit_id}/record"
              payload: { measured_brix: 24.5, measured_ta_gl: 6.5, measured_ph: 3.40, measured_rot_pct: 1.0 }
              as: HarvestCoordinator
            - call: "POST /grower-relations/pick-calls"
              payload: { contract_id: "${contract_id}", block_id: "${block_id}", target_pick_at: "2026-08-25T14:00:00Z", estimated_tons: 45.000 }
              as: HarvestCoordinator
              captures: { pick_call_id: $.data.id }
            - call: "POST /grower-relations/pick-calls/${pick_call_id}/acknowledge"
              payload: {}
              as: Grower
            - call: "POST /grower-relations/delivery-appointments"
              payload: { pick_call_id: "${pick_call_id}", lane_id: "${lane_id}", window_start: "2026-08-25T14:00:00Z", window_end: "2026-08-25T16:00:00Z", planned_tons: 40.000 }
              as: HarvestCoordinator
              captures: { appointment_id: $.data.id, appt_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T14:30:00Z" }
              as: GrowerRelationsManager
          trigger:
            - call: "POST /grower-relations/weigh-tags"
              payload: { appointment_id: "${appointment_id}", block_id: "${block_id}", gross_weight_lbs: 57000, expected_appointment_version: "${appt_v1}" }
              as: ScaleOperator
              captures: { tag_a: $.data.id, tag_a_v1: $.data.version }
            - call: "POST /grower-relations/weigh-tags"
              payload: { appointment_id: "${appointment_id}", block_id: "${block_id}", gross_weight_lbs: 61240, expected_appointment_version: "${appt_v1}" }
              as: ScaleOperator
              captures: { e1: $.data.error_id }
            - call: "GET /grower-relations/delivery-appointments/${appointment_id}"
              as: ScaleOperator
              captures: { appt_v2: $.data.version }
            - call: "POST /grower-relations/weigh-tags"
              payload: { appointment_id: "${appointment_id}", block_id: "${block_id}", gross_weight_lbs: 61240, expected_appointment_version: "${appt_v2}" }
              as: ScaleOperator
              captures: { tag_b: $.data.id }
            - call: "POST /grower-relations/weigh-tags/${tag_a}/tare"
              payload: { tare_weight_lbs: 17000 }
              as: ScaleOperator
              captures: { tag_a_v2: $.data.version }
            - call: "POST /grower-relations/weigh-tags/${tag_a}/grades"
              payload: { brix: 23.0, ta_gl: 6.5, ph: 3.40, rot_pct: 1.0, mog_pct: 0.5, expected_weigh_tag_version: "${tag_a_v1}" }
              as: QualityLabTech
              captures: { e2: $.data.error_id }
            - call: "POST /grower-relations/weigh-tags/${tag_a}/grades"
              payload: { brix: 23.0, ta_gl: 6.5, ph: 3.40, rot_pct: 1.0, mog_pct: 0.5, expected_weigh_tag_version: "${tag_a_v2}" }
              as: QualityLabTech
            - call: "GET /grower-relations/weigh-tags/${tag_a}"
              as: GrowerRelationsManager
          assert:
            - "The first weigh tag is accepted with the version captured at appointment creation and drives the appointment SCHEDULED -> ARRIVED"
            - "${e1} == ERR_STALE_APPOINTMENT_VERSION with HTTP 412: the token that worked one call earlier is now stale because the cascaded transition incremented the appointment's version"
            - "The refused call created no WeighTag: GET /grower-relations/weigh-tags filtered by the appointment reports total_count == 1 at that point"
            - "The re-read version ${appt_v2} == ${appt_v1} + 1, and the retry with it returns 201"
            - "${e2} == ERR_STALE_WEIGH_TAG_VERSION with HTTP 412: the tare bumped the tag from ${tag_a_v1} to ${tag_a_v2}, so the lab's pre-tare token is refused even though weigh_status is NET_FINAL and the grading is otherwise valid"
            - "The retry with ${tag_a_v2} returns 201 and the final read shows the tag at version ${tag_a_v2} + 1 with disposition ACCEPTED — every accepted write moved the counter by exactly one"

      - name: multi_level_cascade_is_verified_end_to_end
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: grading_cap_reached_cascade_to_lane_committed_tons
          rationale: |
            §1.8's transitive_cascade rule owns the deepest chain in the domain — grading drives
            the contract's tonnage_status, which suspends pick calls, which cancels appointments,
            which rewrites each lane's committed_tons and scheduled_appointment_count — and
            asserts every level of it, plus the ordering constraint that FULFILLED is evaluated
            before SUSPENDED_CAP. Its sibling instance runs the compensating direction through a
            grade dispute.

      - name: both_variants_produce_their_expected_results_and_the_delta_is_correct
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: settlement_basis_load_by_load_versus_weighted_blend_divergence
          rationale: |
            The layer is exercised at full depth there: identical loads settled under
            LOAD_BY_LOAD and under WEIGHTED_BLEND, with both totals and the delta asserted in
            whole cents, plus the provisional-to-final reconciliation. The reliability-scope
            variant pair is covered by the second instance of the same §1.8 rule.

      - name: cumulative_and_instantaneous_thresholds_are_tested_at_their_boundaries
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: brix_dead_band_and_sub_step_exact_boundaries
          rationale: |
            The instantaneous thresholds of the grading ladder — min_brix_accept,
            brix_penalty_start, brix_bonus_start and the sub-step dead band between them — are
            probed exactly on and just inside each edge there. The cumulative thresholds are
            covered by lane_daily_capacity_exact_equality_accepted (tonnage) and by
            prompt_pay_tier_boundary_at_exactly_five_million_cents in §1.9 (money).

  # ===========================================================================
  # SECTION 9 — Consistency model (immediate)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: every_cascaded_change_is_visible_in_the_same_request_cycle
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.WeighTag.PENDING_to_ACCEPTED
        distinguishing_aspect: |
          consistency_model is `immediate`, so the single POST that grades a load must leave
          EVERY derived field across five other entities already correct on the very next read —
          no background job, no lag. The reads immediately after the grading therefore double as
          a fan-out audit of one transition's side effects: settlement line, contract rollup,
          pick call fulfilment, appointment closing and lane ledger, plus the producer's
          delivered tonnage on the block. An implementation that recomputes rollups lazily at
          settlement-close time passes the settlement tests and fails here.
        test_recipe:
          setup:
            - "Standard chain to a NET_FINAL weigh tag of exactly 20.000 net tons on a 40.000-t contract; the load is the appointment's only tag."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T08:00:00Z" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/growers"
              payload: { name: "Ridgeline Vineyards", license_number: "PL-44821", region_code: "NAPA-NORTH" }
              as: GrowerRelationsManager
