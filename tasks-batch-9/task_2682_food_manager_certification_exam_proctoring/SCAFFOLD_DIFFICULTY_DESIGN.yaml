      - name: proctor_registration_audit_suspension_reinstatement_cycles
        grounds:
          - state_machines.Proctor.REGISTERED_to_UNDER_AUDIT
          - state_machines.Proctor.UNDER_AUDIT_to_REGISTERED
          - state_machines.Proctor.UNDER_AUDIT_to_SUSPENDED
          - state_machines.Proctor.SUSPENDED_to_REGISTERED
          - entities.Proctor.fields.suspended_reason
        distinguishing_aspect: |
          The Proctor machine is genuinely cyclic on a DIFFERENT entity from the parallel-dimension
          instance: REGISTERED -> UNDER_AUDIT -> REGISTERED is traversed, then re-entered, then exited
          the other way (UNDER_AUDIT -> SUSPENDED with suspended_reason AUDIT_FAILURE), then closed by
          SUSPENDED -> REGISTERED with suspended_reason cleared to null, and finally re-entered a third
          time. No forward-only pipeline can produce REGISTERED twice after two different exits, and
          the audit is re-openable an unbounded number of times (no loop counter caps it). The proctor
          has no terminal sittings, so both risk variants stay 0.00 and the PASS close is not
          overridden by the suspension gate.
        test_recipe:
          setup:
            - "One jurisdiction and one provider; one proctor created and APPROVED, so registration_status == REGISTERED with risk_score 0.0 and suspended_reason null."
            - "The proctor has no ExamSessions at all, so |S| == 0 and LIFETIME_CUMULATIVE risk_score is 0.00 by definition."
