scenario: "Bankruptcy Filing (Chapter 7/13): Means Test, Schedules A-J, 341 creditors' meeting, Automatic Stay, Chapter 13 reorganization plan, monthly trustee payment, Discharge exemptions"
domain_name: bankruptcy-filing
api_prefix: /

complexity_profile:
  primary_archetype: posture-driven gating
  secondary_archetype: compliance / audit
  complexity_layers:
    - dual-variant calculation
    - cascading side effects
    - rate / threshold triggers
    - waterfall allocation
    - derived field reconciliation
    - optimistic concurrency

  entity_topology: hybrid
  # A Case is the aggregate root (tree of Schedules, Debts, ClaimRecords, Plans,
  # PlanPayments, StayReliefMotions, Meeting341). MeansTest hangs off Case as a
  # 1:1 child. ClaimRecord cross-references Debt (cross-aggregate); Meeting341
  # cross-references a Trustee resource for time-slot conflict detection — so the
  # model is a tree with cross-cutting associations — hybrid, not a strict tree.

  state_machine_shape: posture_driven
  # Case.stay_posture (NONE / ACTIVE / LIFTED_PARTIAL / TERMINATED) is a derived
  # aggregate field that gates whether creditor collection actions are permitted.
  # Case.status is a branching machine (Chapter 7 vs Chapter 13 diverge after the
  # 341 meeting); Plan carries a revision cycle (DRAFT->FILED->DENIED->DRAFT).

  relationship_patterns:
    - one_to_many        # Case -> Debt, Case -> PlanPayment, Case -> StayReliefMotion
    - cross_aggregate    # ClaimRecord.debt_id references a Debt under the same Case

  role_model: segregation_of_duties
  # The Debtor files; the Trustee chairs the 341 meeting, confirms plans, applies
  # trustee payments, and grants discharge. The same actor cannot both file the
  # case (Debtor) and adjudicate it (Trustee). A Creditor files claims and moves
  # for relief from stay. BankruptcyAdmin is operational. Trustee is entity-backed
  # so that 341-meeting time slots can be conflict-checked per individual trustee.

  consistency_model: immediate

# ---------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — emitted verbatim)
# ---------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Case
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix. Identity only; never a business-decision input."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits. Filing-order tie-break key for the trustee payment ledger."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, refreshed on every mutation including cascaded side effects."
      - name: version
        type: integer
        source: system
        description: "Starts at 1, increments by one on every mutation. OCC token for plan creation."
      - name: debtor_id
        type: string
        source: input
        description: "FK -> Debtor.id; the individual filing for bankruptcy."
      - name: filed_chapter
        type: enum
        source: input
        description: "Chapter the debtor petitions under. One of {CHAPTER_7, CHAPTER_13}."
        constraints: "enum: CHAPTER_7 | CHAPTER_13"
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state (see §1.2). One of {DRAFT, FILED, MEETING_HELD, CONFIRMED, DISCHARGED, DISMISSED}."
        default: DRAFT
        constraints: "enum: DRAFT | FILED | MEETING_HELD | CONFIRMED | DISCHARGED | DISMISSED"
      - name: stay_posture
        type: enum
        source: computed
        description: "Derived automatic-stay posture gating creditor actions. One of {NONE, ACTIVE, LIFTED_PARTIAL, TERMINATED}. NONE while DRAFT; ACTIVE on petition; LIFTED_PARTIAL once any StayReliefMotion is GRANTED; TERMINATED on discharge or dismissal."
        default: NONE
        constraints: "enum: NONE | ACTIVE | LIFTED_PARTIAL | TERMINATED"
      - name: petition_date
        type: datetime
        source: system
        description: "UTC timestamp the petition was filed (DRAFT->FILED). Null while DRAFT. Basis for the means-test 6-month lookback window."
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state of the debtor's domicile, selects the median-income figure and exemption set."
        constraints: "two-letter uppercase US state code"
      - name: household_size
        type: integer
        source: input
        description: "Number of people in the debtor's household; selects the applicable median-income row."
        constraints: ">= 1"
      - name: means_test_result
        type: enum
        source: computed
        description: "Mirror of the child MeansTest.result, denormalized onto the case for gating Chapter 7 confirmation. One of {NOT_RUN, PRESUMPTION_OK, PRESUMPTION_ABUSE}."
        default: NOT_RUN
        constraints: "enum: NOT_RUN | PRESUMPTION_OK | PRESUMPTION_ABUSE"
      - name: total_exempt_value_cents
        type: integer
        source: computed
        description: "Sum of claimed_exempt_value_cents over this case's Schedule rows of schedule_letter='C', recomputed on each schedule mutation. Used by the discharge no-asset check."
        default: 0
      - name: nonexempt_estate_cents
        type: integer
        source: computed
        description: "Sum over Schedule rows of schedule_letter IN {A,B} of (asset_value_cents) minus total_exempt_value_cents, floored at 0. Drives the discharge exemption invariant."
        default: 0

  - name: Debtor
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix. Equals X-User-ID when X-User-Role=Debtor."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, refreshed on every mutation."
      - name: version
        type: integer
        source: system
        description: "Starts at 1, increments on every mutation."
      - name: full_name
        type: string
        source: input
        description: "Debtor's legal name."
      - name: email
        type: string
        source: input
        description: "Debtor contact email; unique across debtors."
        constraints: "unique"
      - name: prior_discharge_within_8y
        type: boolean
        source: input
        description: "True if the debtor received a Chapter 7 discharge within the prior 8 years; blocks a new Chapter 7 discharge."
        default: false

  - name: MeansTest
    parent: Case
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, refreshed on every mutation."
      - name: version
        type: integer
        source: system
        description: "Starts at 1, increments on every mutation."
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case this means test belongs to (1:1)."
      - name: cmi_monthly_cents
        type: integer
        source: input
        description: "Current Monthly Income: average of the debtor's gross monthly income over the 6 calendar months before the petition, in cents."
        constraints: ">= 0"
      - name: monthly_expenses_cents
        type: integer
        source: input
        description: "Allowed monthly living expenses (IRS national/local standards) in cents."
        constraints: ">= 0"
      - name: median_annual_income_cents
        type: integer
        source: input
        description: "State+household median annual income figure in cents, supplied per filing (selected by Case.state_code and household_size)."
        constraints: ">= 0"
      - name: annualized_cmi_cents
        type: integer
        source: computed
        description: "cmi_monthly_cents * 12. The income side of the median comparison."
        default: 0
      - name: disposable_monthly_cents
        type: integer
        source: computed
        description: "Monthly disposable income = max(0, cmi_monthly_cents - monthly_expenses_cents). The abuse-presumption driver."
        default: 0
      - name: result
        type: enum
        source: computed
        description: "Means-test outcome (see §1.3 means_test_evaluation). One of {NOT_RUN, PRESUMPTION_OK, PRESUMPTION_ABUSE}."
        default: NOT_RUN
        constraints: "enum: NOT_RUN | PRESUMPTION_OK | PRESUMPTION_ABUSE"

  - name: Schedule
    parent: Case
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, refreshed on every mutation."
      - name: version
        type: integer
        source: system
        description: "Starts at 1, increments on every mutation."
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case this schedule line belongs to."
      - name: schedule_letter
        type: enum
        source: input
        description: "Which of Schedules A through J this row records. A/B real & personal property; C claimed exemptions; D secured debts; E/F priority & unsecured debts; G/H contracts & codebtors; I income; J expenses."
        constraints: "enum: A | B | C | D | E | F | G | H | I | J"
      - name: description
        type: string
        source: input
        description: "Free-text line-item description."
      - name: asset_value_cents
        type: integer
        source: input
        description: "Fair-market value of the asset for schedule_letter IN {A,B}; 0 for non-asset schedules."
        default: 0
        constraints: ">= 0"
      - name: claimed_exempt_value_cents
        type: integer
        source: input
        description: "Exemption claimed on a Schedule C row; 0 for other letters. Must not exceed the matching asset's value (see §1.4)."
        default: 0
        constraints: ">= 0"

  - name: Debt
    parent: Case
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits. Tie-break key for equal-priority waterfall buckets."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, refreshed on every mutation."
      - name: version
        type: integer
        source: system
        description: "Starts at 1, increments on every mutation."
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case this debt is scheduled under."
      - name: creditor_id
        type: string
        source: input
        description: "FK -> Creditor.id; the creditor owed this debt."
      - name: debt_class
        type: enum
        source: input
        description: "Bankruptcy classification driving waterfall priority. One of {SECURED, PRIORITY, UNSECURED}."
        constraints: "enum: SECURED | PRIORITY | UNSECURED"
      - name: scheduled_amount_cents
        type: integer
        source: input
        description: "Amount the debtor schedules as owed, in cents."
        constraints: ">= 1"
      - name: allowed_amount_cents
        type: integer
        source: computed
        description: "Amount actually allowed for distribution, set from the matching ClaimRecord on claim allowance (see §1.2 ClaimRecord). Defaults to scheduled_amount_cents until a claim is allowed."
        default: 0

  - name: Creditor
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix. Equals X-User-ID when X-User-Role=Creditor."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, refreshed on every mutation."
      - name: version
        type: integer
        source: system
        description: "Starts at 1, increments on every mutation."
      - name: name
        type: string
        source: input
        description: "Creditor's name."

  - name: Trustee
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix. Equals X-User-ID when X-User-Role=Trustee."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, refreshed on every mutation."
      - name: version
        type: integer
        source: system
        description: "Starts at 1, increments on every mutation."
      - name: name
        type: string
        source: input
        description: "Trustee's name."

  - name: Meeting341
    parent: Case
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, refreshed on every mutation."
      - name: version
        type: integer
        source: system
        description: "Starts at 1, increments on every mutation."
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case whose 341 creditors' meeting this is (1:1 — at most one Meeting341 per case)."
      - name: trustee_id
        type: string
        source: input
        description: "FK -> Trustee.id; the trustee who will chair the meeting. Used for per-trustee time-slot conflict detection."
      - name: room_code
        type: string
        source: input
        description: "Hearing-room identifier; the room must be free including a mandatory cleanup buffer between meetings."
      - name: scheduled_start
        type: datetime
        source: input
        description: "UTC start of the meeting slot (inclusive)."
      - name: scheduled_end
        type: datetime
        source: input
        description: "UTC end of the meeting slot (exclusive — back-to-back meetings sharing an endpoint do NOT overlap on a trustee)."
        constraints: "scheduled_end > scheduled_start"
      - name: status
        type: enum
        source: computed
        description: "Meeting lifecycle. One of {SCHEDULED, HELD}. SCHEDULED on create; HELD once the trustee conducts it."
        default: SCHEDULED
        constraints: "enum: SCHEDULED | HELD"

  - name: ClaimRecord
    parent: Case
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, refreshed on every mutation."
      - name: version
        type: integer
        source: system
        description: "Starts at 1, increments on every mutation."
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case this proof of claim is filed against."
      - name: debt_id
        type: string
        source: input
        description: "FK -> Debt.id; the scheduled debt this claim corresponds to (cross-aggregate within the same case)."
      - name: filed_by_creditor_id
        type: string
        source: input
        description: "FK -> Creditor.id; the creditor who filed this proof of claim. Must equal the linked Debt.creditor_id."
      - name: claimed_amount_cents
        type: integer
        source: input
        description: "Amount the creditor asserts is owed, in cents."
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: "Claim lifecycle (see §1.2). One of {FILED, ALLOWED, DISALLOWED}."
        default: FILED
        constraints: "enum: FILED | ALLOWED | DISALLOWED"
      - name: allowed_amount_cents
        type: integer
        source: computed
        description: "Amount allowed on allowance; set by the trustee (defaults to claimed_amount_cents) and copied onto Debt.allowed_amount_cents."
        default: 0

  - name: Plan
    parent: Case
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits. Latest-by-created_at selects the active plan when multiple exist."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, refreshed on every mutation."
      - name: version
        type: integer
        source: system
        description: "Starts at 1, increments on every mutation."
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the Chapter 13 reorganization plan's case. Only valid when Case.filed_chapter=CHAPTER_13."
      - name: monthly_payment_cents
        type: integer
        source: input
        description: "Proposed monthly trustee payment, in cents."
        constraints: ">= 1"
      - name: plan_duration_months
        type: integer
        source: input
        description: "Number of monthly payments in the commitment period."
        constraints: "36 <= plan_duration_months <= 60"
      - name: status
        type: enum
        source: computed
        description: "Plan lifecycle with a revision cycle (see §1.2). One of {DRAFT, FILED, CONFIRMED, DENIED, COMPLETED}."
        default: DRAFT
        constraints: "enum: DRAFT | FILED | CONFIRMED | DENIED | COMPLETED"
      - name: is_active
        type: boolean
        source: computed
        description: "True only for the case's latest-by-created_at non-DENIED plan; superseded plans flip to false."
        default: true
      - name: total_committed_cents
        type: integer
        source: computed
        description: "monthly_payment_cents * plan_duration_months; the total fund the waterfall distributes."
        default: 0
      - name: paid_to_date_cents
        type: integer
        source: computed
        description: "Running sum of applied PlanPayment.amount_cents for this plan. Reconciled on each payment."
        default: 0

  - name: PlanPayment
    parent: Plan
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits. Chronological order of payment application; earliest-first."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, refreshed on every mutation."
      - name: version
        type: integer
        source: system
        description: "Starts at 1, increments on every mutation."
      - name: plan_id
        type: string
        source: input
        description: "FK -> Plan.id; the confirmed plan this monthly payment is applied against."
      - name: amount_cents
        type: integer
        source: input
        description: "Amount received from the debtor this month, in cents."
        constraints: ">= 1"
      - name: applied_at
        type: datetime
        source: system
        description: "UTC timestamp the trustee recorded the payment."

  - name: StayReliefMotion
    parent: Case
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, refreshed on every mutation."
      - name: version
        type: integer
        source: system
        description: "Starts at 1, increments on every mutation."
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case whose automatic stay this motion targets."
      - name: movant_creditor_id
        type: string
        source: input
        description: "FK -> Creditor.id; the creditor seeking relief from the stay."
      - name: target_debt_id
        type: string
        source: input
        description: "FK -> Debt.id; the specific debt/collateral the movant seeks to act on (must be SECURED)."
      - name: status
        type: enum
        source: computed
        description: "Motion lifecycle (see §1.2). One of {PENDING, GRANTED, DENIED}."
        default: PENDING
        constraints: "enum: PENDING | GRANTED | DENIED"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Case
    initial_state: DRAFT
    terminal_states: [DISCHARGED, DISMISSED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /cases/{id}/petition"
        actor: Debtor
        preconditions:
          - "Case.status == DRAFT"
          - "at least one Schedule row of schedule_letter='I' AND one of 'J' exist for the case"
          - "a MeansTest exists for the case AND MeansTest.result != NOT_RUN"
          - "if filed_chapter==CHAPTER_7: means_test_result == PRESUMPTION_OK (an abuse presumption blocks a Chapter 7 petition)"
        side_effects:
          - "set Case.status=FILED, set Case.petition_date=now"
          - "set Case.stay_posture=ACTIVE (automatic stay arises; see resource_temporal_overlap and cross_entity_state_dependency rules)"
          - "increments Case.version by 1"
        note: "The automatic stay arises on petition and gates all subsequent creditor collection actions."
      - from: FILED
        to: MEETING_HELD
        trigger: "system: bubbles up when the case's Meeting341 transitions SCHEDULED->HELD"
        actor: system
        preconditions:
          - "Case.status == FILED"
          - "the case has a Meeting341 (cross-entity dependency — the 341 meeting must be scheduled before it can be held)"
        side_effects:
          - "set Case.status=MEETING_HELD"
          - "increments Case.version by 1"
        note: "Holding the 341 creditors' meeting bubbles the case from FILED to MEETING_HELD (see transitive_cascade meeting_hold chain)."
      - from: MEETING_HELD
        to: CONFIRMED
        trigger: "POST /cases/{id}/confirm (Chapter 13 only)"
        actor: Trustee
        preconditions:
          - "Case.status == MEETING_HELD"
          - "Case.filed_chapter == CHAPTER_13"
          - "the case has a Plan with status==CONFIRMED (see Plan machine)"
        side_effects:
          - "set Case.status=CONFIRMED"
          - "increments Case.version by 1"
        note: "Branch point: Chapter 13 proceeds to plan confirmation; Chapter 7 skips straight to discharge."
      - from: MEETING_HELD
        to: DISCHARGED
        trigger: "POST /cases/{id}/discharge (Chapter 7 path)"
        actor: Trustee
        preconditions:
          - "Case.status == MEETING_HELD"
          - "Case.filed_chapter == CHAPTER_7"
          - "Case.means_test_result == PRESUMPTION_OK"
          - "Debtor.prior_discharge_within_8y == false"
        side_effects:
          - "set Case.status=DISCHARGED, set Case.stay_posture=TERMINATED"
          - "all Debt rows of debt_class==UNSECURED have allowed_amount_cents reduced to 0 (discharged); SECURED and PRIORITY survive (see compensating_invariant)"
          - "increments Case.version by 1"
        note: "Chapter 7 discharge wipes unsecured debts; the stay terminates because the estate is liquidated."
      - from: CONFIRMED
        to: DISCHARGED
        trigger: "POST /cases/{id}/discharge (Chapter 13 path)"
        actor: Trustee
        preconditions:
          - "Case.status == CONFIRMED"
          - "Case.filed_chapter == CHAPTER_13"
          - "the case's active Plan has paid_to_date_cents >= total_committed_cents (plan completed)"
        side_effects:
          - "set Case.status=DISCHARGED, set Case.stay_posture=TERMINATED"
          - "set the active Plan.status=COMPLETED"
          - "all Debt rows of debt_class==UNSECURED have allowed_amount_cents reduced to 0 (discharged)"
          - "increments Case.version by 1"
        note: "Chapter 13 discharge requires the full committed amount to have been paid in."
      - from: FILED
        to: DISMISSED
        trigger: "POST /cases/{id}/dismiss"
        actor: Trustee
        preconditions:
          - "Case.status IN {FILED, MEETING_HELD, CONFIRMED}"
        side_effects:
          - "set Case.status=DISMISSED, set Case.stay_posture=TERMINATED"
          - "all PENDING StayReliefMotion rows on the case are set to DENIED (moot)"
          - "increments Case.version by 1"
        note: "Dismissal terminates the stay and moots any pending relief motions."
      - from: MEETING_HELD
        to: DISMISSED
        trigger: "POST /cases/{id}/dismiss"
        actor: Trustee
        preconditions:
          - "Case.status IN {FILED, MEETING_HELD, CONFIRMED}"
        side_effects:
          - "set Case.status=DISMISSED, set Case.stay_posture=TERMINATED"
          - "all PENDING StayReliefMotion rows on the case are set to DENIED (moot)"
          - "increments Case.version by 1"
      - from: CONFIRMED
        to: DISMISSED
        trigger: "POST /cases/{id}/dismiss"
        actor: Trustee
        preconditions:
          - "Case.status IN {FILED, MEETING_HELD, CONFIRMED}"
        side_effects:
          - "set Case.status=DISMISSED, set Case.stay_posture=TERMINATED"
          - "all PENDING StayReliefMotion rows on the case are set to DENIED (moot)"
          - "increments Case.version by 1"

  - entity: Meeting341
    initial_state: SCHEDULED
    terminal_states: [HELD]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /meetings/{id}/hold"
        actor: Trustee
        preconditions:
          - "Meeting341.status == SCHEDULED"
          - "Case.status == FILED (the case must be filed and not yet past the meeting)"
          - "the acting Trustee equals Meeting341.trustee_id (only the assigned trustee conducts the meeting)"
        side_effects:
          - "set Meeting341.status=HELD"
          - "bubble up: set Case.status=MEETING_HELD (cross-entity cascade; see transitive_cascade meeting_hold)"
          - "increments Meeting341.version by 1; increments Case.version by 1"
        note: "Conducting the 341 meeting bubbles the parent Case to MEETING_HELD."

  - entity: ClaimRecord
    initial_state: FILED
    terminal_states: [ALLOWED, DISALLOWED]
    transitions:
      - from: FILED
        to: ALLOWED
        trigger: "POST /claims/{id}/allow"
        actor: Trustee
        preconditions:
          - "ClaimRecord.status == FILED"
          - "Case.status IN {MEETING_HELD, CONFIRMED} (claims allowed only after the 341 meeting)"
        side_effects:
          - "set ClaimRecord.status=ALLOWED, set ClaimRecord.allowed_amount_cents=claimed_amount_cents"
          - "set the linked Debt.allowed_amount_cents = ClaimRecord.allowed_amount_cents (cross-aggregate ledger sync)"
          - "increments ClaimRecord.version by 1"
        note: "Allowing a claim updates the corresponding Debt's allowed amount, which feeds the Chapter 13 waterfall."
      - from: FILED
        to: DISALLOWED
        trigger: "POST /claims/{id}/disallow"
        actor: Trustee
        preconditions:
          - "ClaimRecord.status == FILED"
          - "Case.status IN {MEETING_HELD, CONFIRMED}"
        side_effects:
          - "set ClaimRecord.status=DISALLOWED, set ClaimRecord.allowed_amount_cents=0"
          - "set the linked Debt.allowed_amount_cents = 0"
          - "increments ClaimRecord.version by 1"

  - entity: Plan
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /plans/{id}/file-plan"
        actor: Debtor
        preconditions:
          - "Plan.status == DRAFT"
          - "Plan.is_active == true"
          - "Case.filed_chapter == CHAPTER_13"
          - "Case.status IN {FILED, MEETING_HELD}"
        side_effects:
          - "set Plan.status=FILED"
          - "increments Plan.version by 1"
      - from: FILED
        to: CONFIRMED
        trigger: "POST /plans/{id}/confirm-plan"
        actor: Trustee
        preconditions:
          - "Plan.status == FILED"
          - "Case.status == MEETING_HELD"
          - "plan feasibility holds: Plan.total_committed_cents >= the projected disbursement floor (see §1.3 plan_feasibility_check)"
        side_effects:
          - "set Plan.status=CONFIRMED"
          - "increments Plan.version by 1"
      - from: FILED
        to: DENIED
        trigger: "POST /plans/{id}/deny-plan"
        actor: Trustee
        preconditions:
          - "Plan.status == FILED"
        side_effects:
          - "set Plan.status=DENIED, set Plan.is_active=false"
          - "increments Plan.version by 1"
        note: "A denied plan is superseded; the debtor drafts a new plan (revision cycle FILED->DENIED then a fresh DRAFT plan)."
      - from: CONFIRMED
        to: COMPLETED
        trigger: "system: set on Case discharge (Chapter 13 path)"
        actor: system
        preconditions:
          - "Plan.status == CONFIRMED"
          - "Plan.paid_to_date_cents >= Plan.total_committed_cents"
        side_effects:
          - "set Plan.status=COMPLETED"
          - "increments Plan.version by 1"

  - entity: StayReliefMotion
    initial_state: PENDING
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: PENDING
        to: GRANTED
        trigger: "POST /stay-relief-motions/{id}/grant"
        actor: Trustee
        preconditions:
          - "StayReliefMotion.status == PENDING"
          - "Case.stay_posture IN {ACTIVE, LIFTED_PARTIAL} (the stay must still be in force to be lifted)"
          - "the target Debt.debt_class == SECURED"
        side_effects:
          - "set StayReliefMotion.status=GRANTED"
          - "set Case.stay_posture=LIFTED_PARTIAL (the stay is partially lifted as to the targeted collateral; see cross_entity_state_dependency)"
          - "increments Case.version by 1 (the case posture mutated)"
        note: "Granting relief partially lifts the automatic stay; the movant may then pursue the named collateral."
      - from: PENDING
        to: DENIED
        trigger: "POST /stay-relief-motions/{id}/deny"
        actor: Trustee
        preconditions:
          - "StayReliefMotion.status == PENDING"
        side_effects:
          - "set StayReliefMotion.status=DENIED"
          - "increments StayReliefMotion.version by 1"

# §1.2.1 Concurrency Rules
concurrency_rules:
  - rule_id: plan-create-stale-case
    parent_entity: Case
    write_endpoint: "POST /plans"
    occ_field: "expected_case_version"
    description: |
      Creating a Plan against a Case whose version has advanced since the client
      last observed it is rejected on a stale-version check. A fresh DRAFT plan
      legitimately supersedes the prior plan of the case (flipping the prior
      plan's is_active to false), so a second create observing identical case
      state would itself succeed under the product's supersede semantics — making
      this a true write-write race resolved by OCC on Case.version rather than a
      state precondition.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: means_test_evaluation
    trigger: "POST /means-tests (compute) and re-evaluated whenever the MeansTest inputs are (re)submitted"
    algorithm: threshold
    formula: |
      annualized_cmi_cents = cmi_monthly_cents * 12
      disposable_monthly_cents = max(0, cmi_monthly_cents - monthly_expenses_cents)

      # Step 1 — income screen against the state+household median (the gate)
      if annualized_cmi_cents <= median_annual_income_cents:
          result = PRESUMPTION_OK            # below or AT median: passes outright
      else:
          # Step 2 — disposable-income screen (60-month projection vs floor)
          projected_disposable_cents = disposable_monthly_cents * 60
          if projected_disposable_cents >= ABUSE_FLOOR_CENTS:
              result = PRESUMPTION_ABUSE      # presumption of abuse arises
          else:
              result = PRESUMPTION_OK
      # mirror onto Case.means_test_result and MeansTest.result
    input_set: "Single MeansTest row's submitted figures; no cross-entity aggregation."
    constants:
      ABUSE_FLOOR_CENTS: 1500000   # $15,000 projected disposable over 60 months triggers the abuse presumption
    precision: "integer cents; no rounding (all inputs are integer cents)"
    variants:
      - name: at_median_boundary
        when: "annualized_cmi_cents == median_annual_income_cents exactly"
        difference: "The income screen uses <= (at-median passes). 1 cent above median falls through to the disposable screen."

  - name: chapter13_waterfall_distribution
    trigger: "GET /plans/{id}/distribution (computed read); recomputed from current Debt.allowed_amount_cents and Plan.paid_to_date_cents"
    algorithm: waterfall_allocation
    formula: |
      # Distribute paid_to_date_cents across debt classes in strict priority order.
      # Ordering: class rank PRIORITY(0) < SECURED(1) < UNSECURED(2);
      # within a class, ascending Debt.created_at, then ascending Debt.id only as
      # a last-resort stable key (created_at collisions are not expected).
      fund = Plan.paid_to_date_cents
      buckets = order_debts_by(class_rank ASC, created_at ASC)   # only ALLOWED-or-defaulted debts
      for debt in buckets:
          owed = debt.allowed_amount_cents
          pay  = min(fund, owed)
          debt_distribution[debt.id] = pay
          fund = fund - pay
      # Within a class, fill earlier-created debts fully before later ones
      # (NOT pro-rata) — order sensitivity is the difficulty.
      # Any remainder after all debts are paid is the surplus returned to debtor.
      surplus_cents = fund
    input_set: "All Debt rows on the case with allowed_amount_cents > 0; PRIORITY first, then SECURED, then UNSECURED."
    constants: {}
    precision: "integer cents; sequential subtraction, no division (fill-in-full, not pro-rata)"
    variants:
      - name: priority_before_secured
        when: "fund insufficient to cover all classes"
        difference: "PRIORITY claims are filled before SECURED, which are filled before UNSECURED; a fund that runs dry mid-class pays earlier-created debts in that class fully and later ones $0."

  - name: meeting_slot_conflict_detection
    trigger: "precondition of POST /meetings (scheduling a 341 meeting)"
    algorithm: interval_merge
    formula: |
      # Two independent overlap checks with DIFFERENT interval semantics; both
      # must pass or the schedule is rejected.
      new = [scheduled_start, scheduled_end)

      # (1) TRUSTEE check — half-open [start, end). Two meetings on the SAME
      #     trustee_id conflict iff they strictly overlap. Back-to-back meetings
      #     sharing an endpoint (existing.end == new.start) do NOT conflict.
      for m in Meeting341 where m.trustee_id == new.trustee_id and m.status == SCHEDULED:
          if new.start < m.scheduled_end and m.scheduled_start < new.end:
              reject ERR_TRUSTEE_DOUBLE_BOOKED   # half-open overlap

      # (2) ROOM check — same room_code requires a CLEANUP buffer between meetings.
      #     The room is busy over [start - BUFFER, end + BUFFER); a new meeting in
      #     the same room conflicts if its raw interval intersects that padded
      #     window. Adjacency is NOT allowed for rooms — there must be a gap of at
      #     least ROOM_BUFFER_MINUTES between consecutive meetings.
      for m in Meeting341 where m.room_code == new.room_code and m.status == SCHEDULED:
          busy_start = m.scheduled_start - ROOM_BUFFER_MINUTES
          busy_end   = m.scheduled_end   + ROOM_BUFFER_MINUTES
          if new.start < busy_end and busy_start < new.end:
              reject ERR_ROOM_BUFFER_CONFLICT    # padded-interval overlap
    input_set: "SCHEDULED Meeting341 rows sharing the same trustee_id (check 1) or room_code (check 2)."
    constants:
      ROOM_BUFFER_MINUTES: 30   # mandatory cleanup gap between two meetings in the same room
    precision: "minute-resolution UTC timestamps; comparisons are strict < (half-open) for the trustee, padded for the room"
    variants:
      - name: trustee_adjacency_allowed
        when: "existing.scheduled_end == new.scheduled_start on the same trustee"
        difference: "Half-open semantics: back-to-back trustee meetings sharing an endpoint pass; the same adjacency in the same room fails the 30-minute buffer."

  - name: plan_feasibility_check
    trigger: "precondition of POST /plans/{id}/confirm-plan"
    algorithm: aggregation
    formula: |
      # The plan must commit enough to cover every PRIORITY claim in full
      # (priority debts are non-dischargeable in Chapter 13).
      priority_floor_cents = sum(Debt.allowed_amount_cents
                                 for Debt in case
                                 where debt_class == PRIORITY)
      # Plan total must clear that floor.
      feasible = (Plan.total_committed_cents >= priority_floor_cents)
    input_set: "Debt rows on the case with debt_class==PRIORITY; uses allowed_amount_cents (post-claim-allowance)."
    constants: {}
    precision: "integer cents"
    variants:
      - name: exact_floor
        when: "total_committed_cents == priority_floor_cents exactly"
        difference: "Uses >= so a plan committing exactly the priority floor is feasible; one cent short is infeasible (ERR_PLAN_INFEASIBLE)."

  - name: discharge_exemption_settlement
    trigger: "side effect of Case DISCHARGED transition (both chapters)"
    algorithm: aggregation
    formula: |
      # Reconcile the estate's exempt vs nonexempt split at discharge.
      total_exempt_value_cents = sum(Schedule.claimed_exempt_value_cents
                                     for Schedule in case where schedule_letter == 'C')
      gross_asset_cents = sum(Schedule.asset_value_cents
                              for Schedule in case where schedule_letter IN {A, B})
      nonexempt_estate_cents = max(0, gross_asset_cents - total_exempt_value_cents)
      # Invariant: exempt + nonexempt == gross when exempt <= gross (see compensating_invariant)
    input_set: "Schedule rows of the case: letter C for exemptions, letters A and B for asset values."
    constants: {}
    precision: "integer cents; floor the nonexempt at 0"
    variants:
      - name: over_exempt_clamped
        when: "total_exempt_value_cents > gross_asset_cents (over-claimed exemptions)"
        difference: "nonexempt_estate_cents floors at 0 rather than going negative; the over-claim does not create negative estate value."

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except Anonymous-permitted creates"
  - priority: 2
    category: auth
    check: "the role is permitted to perform this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path-referenced resources (case, claim, plan, motion) exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all routes with path ids"
  - priority: 4
    category: existence
    check: "body foreign keys (debtor_id, case_id, creditor_id, debt_id) reference existing rows"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "all creates with FK body fields"
  - priority: 5
    category: existence
    check: "required body fields present and of correct type/enum domain"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all creates and computes"
  - priority: 6
    category: state
    check: "target resource is in a state from which this transition is defined (§1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: business_referential
    check: "ClaimRecord.filed_by_creditor_id must equal the linked Debt.creditor_id (a creditor may only file claims on its own scheduled debts)"
    error_id: ERR_CLAIM_CREDITOR_MISMATCH
    http_status: 409
    applies_to: "POST /claims"
  - priority: 8
    category: business_referential
    check: "a StayReliefMotion's target_debt_id must reference a Debt of debt_class==SECURED on the same case"
    error_id: ERR_RELIEF_TARGET_NOT_SECURED
    http_status: 409
    applies_to: "POST /stay-relief-motions, .../grant"
  - priority: 9
    category: business_temporal
    check: "a 341 meeting's [scheduled_start, scheduled_end) must not strictly overlap another SCHEDULED Meeting341 on the same trustee_id (half-open; back-to-back endpoints do NOT conflict)"
    error_id: ERR_TRUSTEE_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /meetings"
  - priority: 10
    category: business_temporal
    check: "a 341 meeting in the same room_code must keep a ROOM_BUFFER_MINUTES (30 min) cleanup gap from any other SCHEDULED Meeting341 in that room (padded-interval overlap; adjacency NOT allowed)"
    error_id: ERR_ROOM_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /meetings"
  - priority: 11
    category: business_safety
    check: "Chapter 7 petition blocked when means_test_result==PRESUMPTION_ABUSE (presumption of abuse bars Chapter 7 relief)"
    error_id: ERR_MEANS_TEST_ABUSE
    http_status: 409
    applies_to: "POST /cases/{id}/petition"
  - priority: 12
    category: business_safety
    check: "Chapter 7 discharge blocked when Debtor.prior_discharge_within_8y==true (8-year discharge bar)"
    error_id: ERR_PRIOR_DISCHARGE_BAR
    http_status: 409
    applies_to: "POST /cases/{id}/discharge"
  - priority: 13
    category: business_temporal
    check: "creditor collection actions (claim filing, relief-motion filing) require the automatic stay to permit them: stay_posture must be ACTIVE or LIFTED_PARTIAL, never TERMINATED"
    error_id: ERR_STAY_TERMINATED
    http_status: 409
    applies_to: "POST /claims, POST /stay-relief-motions"
  - priority: 14
    category: business_constraint
    check: "a Schedule C row's claimed_exempt_value_cents must not exceed the case's gross scheduled asset value (sum of Schedule A+B asset_value_cents); over-exemption rejected"
    error_id: ERR_EXEMPTION_EXCEEDS_ASSET
    http_status: 422
    applies_to: "POST /schedules (letter C)"
  - priority: 15
    category: business_constraint
    check: "Plan endpoints (create/file/confirm) require Case.filed_chapter==CHAPTER_13"
    error_id: ERR_NOT_CHAPTER_13
    http_status: 409
    applies_to: "POST /plans and plan transitions"
  - priority: 16
    category: business_fiscal
    check: "plan confirmation requires Plan.total_committed_cents >= sum of PRIORITY Debt.allowed_amount_cents (priority floor)"
    error_id: ERR_PLAN_INFEASIBLE
    http_status: 409
    applies_to: "POST /plans/{id}/confirm-plan"
  - priority: 17
    category: business_fiscal
    check: "a PlanPayment that would drive paid_to_date_cents above total_committed_cents is rejected (cannot overpay the committed fund)"
    error_id: ERR_PLAN_OVERPAYMENT
    http_status: 422
    applies_to: "POST /plan-payments"
  - priority: 18
    category: state
    check: "OCC: expected_case_version must equal the current Case.version on plan creation"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /plans"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- Registries (flat top-level collections) ---
  - method: POST
    path: "/debtors"
    description: "Register a debtor."
    roles: [BankruptcyAdmin, Debtor]
    code: 201
    input: [full_name, email, "prior_discharge_within_8y?"]
    output: Debtor
    side_effects: []
  - method: GET
    path: "/debtors/{id}"
    description: "Fetch a debtor."
    roles: [BankruptcyAdmin, Debtor, Trustee]
    code: 200
    input: []
    output: Debtor
    side_effects: []
  - method: POST
    path: "/creditors"
    description: "Register a creditor."
    roles: [BankruptcyAdmin, Creditor]
    code: 201
    input: [name]
    output: Creditor
    side_effects: []
  - method: GET
    path: "/creditors/{id}"
    description: "Fetch a creditor."
    roles: [BankruptcyAdmin, Creditor, Trustee]
    code: 200
    input: []
    output: Creditor
    side_effects: []
  - method: POST
    path: "/trustees"
    description: "Register a trustee."
    roles: [BankruptcyAdmin, Trustee]
    code: 201
    input: [name]
    output: Trustee
    side_effects: []
  - method: GET
    path: "/trustees/{id}"
    description: "Fetch a trustee."
    roles: [BankruptcyAdmin, Trustee]
    code: 200
    input: []
    output: Trustee
    side_effects: []

  # --- Case lifecycle ---
  - method: POST
    path: "/cases"
    description: "Open a bankruptcy case in DRAFT."
    roles: [BankruptcyAdmin, Debtor]
    code: 201
    input: [debtor_id, filed_chapter, state_code, household_size]
    output: Case
    side_effects: ["Case created with status=DRAFT, stay_posture=NONE, means_test_result=NOT_RUN"]
  - method: GET
    path: "/cases/{id}"
    description: "Fetch a case with all computed/denormalized fields."
    roles: [BankruptcyAdmin, Debtor, Trustee, Creditor]
    code: 200
    input: []
    output: Case
    side_effects: []
  - method: GET
    path: "/cases"
    description: "List cases; filter by debtor_id (reverse-reachability for Case.debtor_id) and status."
    roles: [BankruptcyAdmin, Trustee]
    code: 200
    input: ["debtor_id?", "status?", "limit?", "offset?"]
    output: Case[]
    side_effects: []
  - method: POST
    path: "/cases/{id}/petition"
    description: "File the petition (DRAFT->FILED); automatic stay arises."
    roles: [Debtor]
    code: 200
    input: []
    output: Case
    side_effects: ["status=FILED, petition_date set, stay_posture=ACTIVE, Case.version+1"]
  - method: POST
    path: "/cases/{id}/confirm"
    description: "Confirm the case for Chapter 13 (MEETING_HELD->CONFIRMED)."
    roles: [Trustee]
    code: 200
    input: []
    output: Case
    side_effects: ["status=CONFIRMED, Case.version+1"]
  - method: POST
    path: "/cases/{id}/discharge"
    description: "Grant discharge (Ch7: MEETING_HELD->DISCHARGED; Ch13: CONFIRMED->DISCHARGED)."
    roles: [Trustee]
    code: 200
    input: []
    output: Case
    side_effects: ["status=DISCHARGED, stay_posture=TERMINATED, UNSECURED debts allowed_amount_cents->0, Ch13 active plan COMPLETED, exemption settlement recomputed, Case.version+1"]
  - method: POST
    path: "/cases/{id}/dismiss"
    description: "Dismiss the case (FILED/MEETING_HELD/CONFIRMED->DISMISSED)."
    roles: [Trustee]
    code: 200
    input: []
    output: Case
    side_effects: ["status=DISMISSED, stay_posture=TERMINATED, PENDING relief motions->DENIED, Case.version+1"]

  # --- MeansTest (flat collection; 1:1 per case via case_id) ---
  - method: POST
    path: "/means-tests"
    description: "Submit/compute the means test for a case (creates or replaces the 1:1 MeansTest)."
    roles: [Debtor]
    code: 201
    input: [case_id, cmi_monthly_cents, monthly_expenses_cents, median_annual_income_cents]
    output: MeansTest
    side_effects: ["compute annualized_cmi_cents, disposable_monthly_cents, result; mirror result onto Case.means_test_result; Case.version+1"]
  - method: GET
    path: "/means-tests/{id}"
    description: "Fetch a means-test row."
    roles: [BankruptcyAdmin, Debtor, Trustee]
    code: 200
    input: []
    output: MeansTest
    side_effects: []
  - method: GET
    path: "/means-tests"
    description: "List means tests; filter by case_id (reverse-reachability for MeansTest.case_id)."
    roles: [BankruptcyAdmin, Debtor, Trustee]
    code: 200
    input: ["case_id?", "limit?", "offset?"]
    output: MeansTest[]
    side_effects: []

  # --- 341 creditors' meeting (flat collection; 1:1 per case via case_id) ---
  - method: POST
    path: "/meetings"
    description: "Schedule the 341 creditors' meeting on a trustee at a time slot/room (SCHEDULED). Conflict-checked per trustee (half-open) and per room (buffered)."
    roles: [Trustee]
    code: 201
    input: [case_id, trustee_id, room_code, scheduled_start, scheduled_end]
    output: Meeting341
    side_effects: ["Meeting341 created in SCHEDULED (requires Case.status==FILED and no overlap)"]
  - method: GET
    path: "/meetings/{id}"
    description: "Fetch a 341 meeting."
    roles: [BankruptcyAdmin, Debtor, Trustee, Creditor]
    code: 200
    input: []
    output: Meeting341
    side_effects: []
  - method: GET
    path: "/meetings"
    description: "List 341 meetings; filter by case_id (reverse-reachability for Meeting341.case_id) and trustee_id (reverse-reachability for Meeting341.trustee_id)."
    roles: [BankruptcyAdmin, Debtor, Trustee, Creditor]
    code: 200
    input: ["case_id?", "trustee_id?", "status?", "limit?", "offset?"]
    output: Meeting341[]
    side_effects: []
  - method: POST
    path: "/meetings/{id}/hold"
    description: "Trustee conducts the scheduled 341 meeting (Meeting341 SCHEDULED->HELD); bubbles Case FILED->MEETING_HELD."
    roles: [Trustee]
    code: 200
    input: []
    output: Meeting341
    side_effects: ["Meeting341.status=HELD; Case.status=MEETING_HELD; Meeting341.version+1; Case.version+1"]

  # --- Schedules A-J (flat collection; case_id FK) ---
  - method: POST
    path: "/schedules"
    description: "Add a Schedule A-J line item to a case."
    roles: [Debtor]
    code: 201
    input: [case_id, schedule_letter, description, "asset_value_cents?", "claimed_exempt_value_cents?"]
    output: Schedule
    side_effects: ["recompute Case.total_exempt_value_cents and nonexempt_estate_cents; Case.version+1"]
  - method: GET
    path: "/schedules/{id}"
    description: "Fetch a schedule row."
    roles: [BankruptcyAdmin, Debtor, Trustee, Creditor]
    code: 200
    input: []
    output: Schedule
    side_effects: []
  - method: GET
    path: "/schedules"
    description: "List schedule rows; filter by case_id (reverse-reachability for Schedule.case_id) and schedule_letter."
    roles: [BankruptcyAdmin, Debtor, Trustee, Creditor]
    code: 200
    input: ["case_id?", "schedule_letter?", "limit?", "offset?"]
    output: Schedule[]
    side_effects: []

  # --- Debts (flat collection; case_id + creditor_id FKs) ---
  - method: POST
    path: "/debts"
    description: "Schedule a debt under a case."
    roles: [Debtor]
    code: 201
    input: [case_id, creditor_id, debt_class, scheduled_amount_cents]
    output: Debt
    side_effects: ["Debt created; allowed_amount_cents defaults to scheduled_amount_cents"]
  - method: GET
    path: "/debts/{id}"
    description: "Fetch a debt."
    roles: [BankruptcyAdmin, Debtor, Trustee, Creditor]
    code: 200
    input: []
    output: Debt
    side_effects: []
  - method: GET
    path: "/debts"
    description: "List debts; filter by case_id (reverse-reachability for Debt.case_id), creditor_id (reverse-reachability for Debt.creditor_id), and debt_class."
    roles: [BankruptcyAdmin, Debtor, Trustee, Creditor]
    code: 200
    input: ["case_id?", "creditor_id?", "debt_class?", "limit?", "offset?"]
    output: Debt[]
    side_effects: []

  # --- Claims / proofs of claim (flat collection; case_id + debt_id + filed_by_creditor_id FKs) ---
  - method: POST
    path: "/claims"
    description: "Creditor files a proof of claim against a scheduled debt."
    roles: [Creditor]
    code: 201
    input: [case_id, debt_id, filed_by_creditor_id, claimed_amount_cents]
    output: ClaimRecord
    side_effects: ["ClaimRecord created in FILED"]
  - method: GET
    path: "/claims/{id}"
    description: "Fetch a claim."
    roles: [BankruptcyAdmin, Debtor, Trustee, Creditor]
    code: 200
    input: []
    output: ClaimRecord
    side_effects: []
  - method: GET
    path: "/claims"
    description: "List claims; filter by case_id (reverse-reachability for ClaimRecord.case_id), debt_id (reverse-reachability for ClaimRecord.debt_id), and filed_by_creditor_id (reverse-reachability for ClaimRecord.filed_by_creditor_id)."
    roles: [BankruptcyAdmin, Debtor, Trustee, Creditor]
    code: 200
    input: ["case_id?", "debt_id?", "filed_by_creditor_id?", "status?", "limit?", "offset?"]
    output: ClaimRecord[]
    side_effects: []
  - method: POST
    path: "/claims/{id}/allow"
    description: "Trustee allows a filed claim."
    roles: [Trustee]
    code: 200
    input: []
    output: ClaimRecord
    side_effects: ["status=ALLOWED, allowed_amount_cents=claimed_amount_cents, linked Debt.allowed_amount_cents synced, version+1"]
  - method: POST
    path: "/claims/{id}/disallow"
    description: "Trustee disallows a filed claim."
    roles: [Trustee]
    code: 200
    input: []
    output: ClaimRecord
    side_effects: ["status=DISALLOWED, allowed_amount_cents=0, linked Debt.allowed_amount_cents=0, version+1"]

  # --- Chapter 13 plans (flat collection; case_id FK) ---
  - method: POST
    path: "/plans"
    description: "Create a Chapter 13 reorganization plan (DRAFT). Supersedes any prior active plan on the case."
    roles: [Debtor]
    code: 201
    input: [case_id, monthly_payment_cents, plan_duration_months, expected_case_version]
    output: Plan
    side_effects: ["new Plan DRAFT is_active=true; prior active plan is_active->false; total_committed_cents computed; Case.version+1"]
  - method: GET
    path: "/plans/{id}"
    description: "Fetch a plan."
    roles: [BankruptcyAdmin, Debtor, Trustee]
    code: 200
    input: []
    output: Plan
    side_effects: []
  - method: GET
    path: "/plans"
    description: "List plans; filter by case_id (reverse-reachability for Plan.case_id) and status."
    roles: [BankruptcyAdmin, Debtor, Trustee]
    code: 200
    input: ["case_id?", "status?", "limit?", "offset?"]
    output: Plan[]
    side_effects: []
  - method: POST
    path: "/plans/{id}/file-plan"
    description: "Debtor files the plan (DRAFT->FILED)."
    roles: [Debtor]
    code: 200
    input: []
    output: Plan
    side_effects: ["status=FILED, version+1"]
  - method: POST
    path: "/plans/{id}/confirm-plan"
    description: "Trustee confirms a filed plan (FILED->CONFIRMED) after feasibility."
    roles: [Trustee]
    code: 200
    input: []
    output: Plan
    side_effects: ["status=CONFIRMED, version+1"]
  - method: POST
    path: "/plans/{id}/deny-plan"
    description: "Trustee denies a filed plan (FILED->DENIED); plan superseded."
    roles: [Trustee]
    code: 200
    input: []
    output: Plan
    side_effects: ["status=DENIED, is_active=false, version+1"]
  - method: GET
    path: "/plans/{id}/distribution"
    description: "Computed read of the waterfall distribution of paid_to_date_cents across the case's debts."
    roles: [BankruptcyAdmin, Debtor, Trustee]
    code: 200
    input: []
    output: "{ plan_id: string, paid_to_date_cents: integer, distribution: object, surplus_cents: integer }"
    side_effects: []

  # --- Plan payments (monthly trustee payment; flat collection; plan_id FK) ---
  - method: POST
    path: "/plan-payments"
    description: "Record a monthly trustee payment against a confirmed plan."
    roles: [Trustee]
    code: 201
    input: [plan_id, amount_cents]
    output: PlanPayment
    side_effects: ["PlanPayment created, applied_at set; Plan.paid_to_date_cents += amount_cents (reconciled); Plan.version+1"]
  - method: GET
    path: "/plan-payments/{id}"
    description: "Fetch a plan payment."
    roles: [BankruptcyAdmin, Debtor, Trustee]
    code: 200
    input: []
    output: PlanPayment
    side_effects: []
  - method: GET
    path: "/plan-payments"
    description: "List plan payments; filter by plan_id (reverse-reachability for PlanPayment.plan_id)."
    roles: [BankruptcyAdmin, Debtor, Trustee]
    code: 200
    input: ["plan_id?", "limit?", "offset?"]
    output: PlanPayment[]
    side_effects: []

  # --- Stay relief motions (flat collection; case_id + movant_creditor_id + target_debt_id FKs) ---
  - method: POST
    path: "/stay-relief-motions"
    description: "Creditor moves for relief from the automatic stay against secured collateral."
    roles: [Creditor]
    code: 201
    input: [case_id, movant_creditor_id, target_debt_id]
    output: StayReliefMotion
    side_effects: ["StayReliefMotion created in PENDING"]
  - method: GET
    path: "/stay-relief-motions/{id}"
    description: "Fetch a stay relief motion."
    roles: [BankruptcyAdmin, Debtor, Trustee, Creditor]
    code: 200
    input: []
    output: StayReliefMotion
    side_effects: []
  - method: GET
    path: "/stay-relief-motions"
    description: "List relief motions; filter by case_id (reverse-reachability for StayReliefMotion.case_id), movant_creditor_id (reverse-reachability for StayReliefMotion.movant_creditor_id), and target_debt_id (reverse-reachability for StayReliefMotion.target_debt_id)."
    roles: [BankruptcyAdmin, Debtor, Trustee, Creditor]
    code: 200
    input: ["case_id?", "movant_creditor_id?", "target_debt_id?", "status?", "limit?", "offset?"]
    output: StayReliefMotion[]
    side_effects: []
  - method: POST
    path: "/stay-relief-motions/{id}/grant"
    description: "Trustee grants relief (PENDING->GRANTED); stay partially lifts."
    roles: [Trustee]
    code: 200
    input: []
    output: StayReliefMotion
    side_effects: ["status=GRANTED, Case.stay_posture=LIFTED_PARTIAL, Case.version+1"]
  - method: POST
    path: "/stay-relief-motions/{id}/deny"
    description: "Trustee denies relief (PENDING->DENIED)."
    roles: [Trustee]
    code: 200
    input: []
    output: StayReliefMotion
    side_effects: ["status=DENIED, version+1"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Authenticated role not permitted for this operation per §1.7."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path-referenced resource (case, claim, plan, motion) does not exist."
  - id: ERR_FK_NOT_FOUND
    http: 404
    condition: "A body foreign key (debtor_id, creditor_id, debt_id, case_id) references a non-existent row."
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required field, wrong type, or out-of-domain enum / numeric constraint."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state from which the requested transition is defined."
  - id: ERR_CLAIM_CREDITOR_MISMATCH
    http: 409
    condition: "ClaimRecord.filed_by_creditor_id does not equal the linked Debt.creditor_id."
  - id: ERR_RELIEF_TARGET_NOT_SECURED
    http: 409
    condition: "A stay-relief motion targets a Debt whose debt_class is not SECURED."
  - id: ERR_MEANS_TEST_ABUSE
    http: 409
    condition: "Chapter 7 petition attempted while means_test_result == PRESUMPTION_ABUSE."
  - id: ERR_PRIOR_DISCHARGE_BAR
    http: 409
    condition: "Chapter 7 discharge attempted while Debtor.prior_discharge_within_8y == true."
  - id: ERR_STAY_TERMINATED
    http: 409
    condition: "A creditor collection action attempted while Case.stay_posture == TERMINATED."
  - id: ERR_EXEMPTION_EXCEEDS_ASSET
    http: 422
    condition: "A Schedule C claimed_exempt_value_cents exceeds the case's gross scheduled asset value."
  - id: ERR_NOT_CHAPTER_13
    http: 409
    condition: "A plan operation attempted on a case whose filed_chapter is not CHAPTER_13."
  - id: ERR_PLAN_INFEASIBLE
    http: 409
    condition: "Plan confirmation attempted where total_committed_cents < the PRIORITY-claim floor."
  - id: ERR_PLAN_OVERPAYMENT
    http: 422
    condition: "A PlanPayment would drive paid_to_date_cents above total_committed_cents."
  - id: ERR_STALE_CASE_VERSION
    http: 412
    condition: "Plan creation carries an expected_case_version that does not match the current Case.version."

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: Debtor
    description: "The individual filing for bankruptcy; owns the case, schedules, debts, means test, and proposes Chapter 13 plans."
    identity: "entity_backed:Debtor"
    exclusive_operations:
      - "POST /cases/{id}/petition"
      - "POST /means-tests"
      - "POST /schedules"
      - "POST /debts"
      - "POST /plans"
      - "POST /plans/{id}/file-plan"
    shared_operations:
      - "POST /debtors"
      - "POST /cases"
      - "GET (read endpoints on owned case, schedules, debts, claims, plans, payments, motions)"
  - name: Trustee
    description: "Schedules and chairs the 341 meeting, allows/disallows claims, confirms/denies plans, applies trustee payments, rules on stay relief, and grants discharge. Segregated from the Debtor: never files the petition or proposes a plan. X-User-ID equals the acting Trustee's id; the meeting-hold check compares it to Meeting341.trustee_id."
    identity: "entity_backed:Trustee"
    exclusive_operations:
      - "POST /meetings"
      - "POST /meetings/{id}/hold"
      - "POST /cases/{id}/confirm"
      - "POST /cases/{id}/discharge"
      - "POST /cases/{id}/dismiss"
      - "POST /claims/{id}/allow"
      - "POST /claims/{id}/disallow"
      - "POST /plans/{id}/confirm-plan"
      - "POST /plans/{id}/deny-plan"
      - "POST /plan-payments"
      - "POST /stay-relief-motions/{id}/grant"
      - "POST /stay-relief-motions/{id}/deny"
    shared_operations:
      - "POST /trustees"
      - "GET (all read endpoints)"
  - name: Creditor
    description: "Files proofs of claim and moves for relief from the automatic stay against its own secured collateral."
    identity: "entity_backed:Creditor"
    exclusive_operations:
      - "POST /claims"
      - "POST /stay-relief-motions"
    shared_operations:
      - "POST /creditors"
      - "GET (read endpoints on cases, debts, claims, motions)"
  - name: BankruptcyAdmin
    description: "Operational role for registry bootstrap and oversight reads; does not drive case adjudication."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /debtors"
      - "POST /creditors"
      - "GET (all read endpoints)"
