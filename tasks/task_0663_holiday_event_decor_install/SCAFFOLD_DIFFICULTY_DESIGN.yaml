          assert:
            - "DamageReport.${dr_id}.replacement_cost_cents == 29500"
            - "DamageReport.${dr_id}.settlement_total_cents == 35400"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: contract_renewal_cycle_revisits_active
        grounds:
          - state_machines.Contract.ACTIVE_to_RENEWAL_OFFERED
          - state_machines.Contract.RENEWAL_OFFERED_to_ACTIVE
          - state_machines.RenewalOffer.SENT_to_DECLINED
        distinguishing_aspect: >
          Cycle on Contract: ACTIVE→RENEWAL_OFFERED→ACTIVE (decline reverts), letting the same
          contract be re-offered — a loop the linear pipelines cannot express.
        test_recipe:
          setup:
            - "ACTIVE COMMERCIAL contract with a SENT RenewalOffer (contract now RENEWAL_OFFERED)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Echo Co", account_type: "COMMERCIAL", contact_email: "e@echo.test", site_address: "5 Ave" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { sku: "TREE-E", category: "TREE", unit_replacement_cents: 9000, on_hand_qty: 30 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /clients/${client_id}/contracts"
              payload: { contract_type: "COMMERCIAL", season_year: 2026, early_bird_deadline: "2026-03-01T00:00:00Z" }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/design-proposals"
              payload: { theme: "Trees" }
              as: AccountManager
              captures: { proposal_id: $.data.id }
            - call: "POST /design-proposals/${proposal_id}/line-items"
              payload: { inventory_item_id: "${sku_id}", quantity: 4, unit_install_cents: 5000 }
              as: AccountManager
            - call: "POST /design-proposals/${proposal_id}/submit"
              payload: {}
              as: AccountManager
            - call: "POST /clients/${client_id}/contracts/${contract_id}/propose"
