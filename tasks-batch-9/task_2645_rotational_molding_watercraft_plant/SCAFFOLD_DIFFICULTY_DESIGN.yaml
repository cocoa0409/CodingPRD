              as_user_id: "admin-1"
            - call: "GET /production-orders/${po}"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
          assert:
            - "MoldingCycle.${cyc_a}.status == \"ABORTED\" and MoldingCycle.${cyc_a}.abort_reason == \"OPERATOR_ABORT\" and MoldingCycle.${cyc_a}.actual_oven_start_at is null — the SCHEDULED -> ABORTED branch never entered the oven"
            - "ResinCharge.${ch_a}.status == \"RELEASED\" and ResinCharge.${ch_a}.released_reason == \"CYCLE_ABORTED\" (CASCADE-A link 2)"
            - "immediately after the first abort, ResinLot.${lot}.available_kg == 12.000, reserved_kg == 12.000, consumed_kg == 0.000 and status == \"AVAILABLE\" — the DEPLETED -> AVAILABLE edge fired because available_kg rose above 0.000"
            - "MoldingCycle.${cyc_b}.status after start-oven is \"OVEN_RUNNING\" and ResinCharge.${ch_b}.status == \"CONSUMED\": the OTHER edge out of SCHEDULED moved the same 12.000 kg from reserved_kg to consumed_kg, leaving available_kg unchanged at 12.000, so the lot stays AVAILABLE rather than re-depleting"
            - "Mold.${mold}.status == \"IN_CYCLE\" while cycle B is OVEN_RUNNING"
            - "MoldingCycle.${cyc_b}.status == \"ABORTED\" and abort_reason == \"OPERATOR_ABORT\" after the second abort, and Mold.${mold}.status == \"AVAILABLE\" with cycles_since_service == 0 — an OVEN_RUNNING abort frees the mold WITHOUT incrementing the service counter"
            - "ResinCharge.${ch_b}.status is still \"CONSUMED\" (NOT RELEASED) and ResinCharge.${ch_b}.released_reason is null — the asymmetric compensation: a shot already in the oven is scrapped, not returned"
            - "ResinLot.${lot} finally reads available_kg == 12.000, reserved_kg == 0.000, consumed_kg == 12.000, status == \"AVAILABLE\", and round(12.000 + 0.000 + 12.000, 3) == 24.000 == ResinLot.${lot}.received_kg — the mass invariant survives both branches"
            - "GET /finished-units?production_order_id=${po} returns 0 rows: neither ABORTED branch minted a hull"
            - "ProductionOrder.${po}.status == \"IN_PRODUCTION\" with completed_qty == 0, scrapped_qty == 0, material_cost_cents == 2520 == round_half_up(12.000 * 210) from the single CONSUMED charge, oven_energy_cost_cents == 0 because no cycle reached DEMOLDED, overhead_cents == 454 == round_half_up(2520 * 18.00 / 100), total_cost_cents == 2974 and unit_cost_cents is null"

      - name: finished_unit_rework_loop_edge_closed_by_logistics_axis
        grounds:
          - state_machines.FinishedUnit.OUTFITTED_to_REWORK
          - state_machines.FinishedUnit.REWORK_to_TRIMMED
          - state_machines.FinishedUnit.TRIMMED_to_OUTFITTED
          - state_machines.FinishedUnit.OUTFITTED_to_SELLABLE
          - state_machines.FinishedUnit.logistics_status.UNALLOCATED_to_STORED
          - calculations.inspection_verdict
          - calculations.wall_thickness_distribution
          - calculations.production_order_cost
          - validations[priority=39]
        distinguishing_aspect: |
          A DIFFERENT ENTITY from the MoldingCycle fork: this instance drives
          FinishedUnit, whose non-linearity is a genuine CYCLE — REWORK travels
          BACKWARD to TRIMMED and the unit re-walks TRIMMED -> OUTFITTED ->
          SELLABLE, so the same state is occupied twice with rework_count 0 and
          then 1 and hardware_kit_serial cleared in between. It is not a branch
          (the MoldingCycle case) but a loop, and the loop is closed from the
          OTHER, parallel axis: once logistics_status leaves UNALLOCATED the
          build-axis edge out of SELLABLE becomes unreachable
          (ERR_UNIT_NOT_REINSPECTABLE, priority 39).
