  # ===========================================================================
  # Section: roles  (RBAC denial and identity claims)
  # ===========================================================================
  - section: roles
    instances:
      - name: missing_auth_headers_returns_401
        claim_type: "rbac_denial"
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers at all is rejected before any role-permission or resource-existence check runs."
        test_recipe:
          setup: ["No prior state needed."]
          setup_api_calls: []
          trigger:
            - call: "GET /orders"
              payload: {}
              as: "Anonymous (no X-User-Role/X-User-ID headers sent)"
          assert:
            - "response error_id == 'ERR_UNAUTHENTICATED' with http_status 401"

      - name: wrong_role_forbidden_from_exclusive_operation
        claim_type: "rbac_denial"
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]", "roles.WarehouseOps"]
        distinguishing_aspect: "WarehouseOps (which does not own POST /gift-basket-templates per §1.7) is rejected with ERR_FORBIDDEN_ROLE even though its headers are otherwise well-formed and authenticated."
        test_recipe:
          setup: ["No prior state needed."]
          setup_api_calls: []
          trigger:
            - call: "POST /gift-basket-templates"
              payload: { name: "Not Allowed Basket", category: "CUSTOM", base_price_cents: 1000, is_perishable: false, components: [], active: true }
              as: WarehouseOps
          assert:
            - "response error_id == 'ERR_FORBIDDEN_ROLE' with http_status 403"

      - name: account_manager_cannot_act_on_a_different_accounts_order
        claim_type: "rbac_denial"
        grounds: ["roles.AccountManager"]
        distinguishing_aspect: "AccountManager is entity_backed:CorporateAccount — X-User-ID must equal the CorporateAccount.id owning the target resource; an AccountManager authenticated as a DIFFERENT account's id is rejected even though the role itself is permitted to call this endpoint in general."
        test_recipe:
          setup: ["Two separate CorporateAccounts, A and B, each with their own GiftBasketTemplate."]
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { name: "Owner A Corp", billing_email: "ap@ownera.example", monthly_budget_cents: 1000000, approval_threshold_cents: 1000000 }
              as: PlatformAdmin
              captures: { acct_a_id: $.data.id, acct_a_v: $.data.version }
            - call: "POST /corporate-accounts"
              payload: { name: "Owner B Corp", billing_email: "ap@ownerb.example", monthly_budget_cents: 1000000, approval_threshold_cents: 1000000 }
              as: PlatformAdmin
              captures: { acct_b_id: $.data.id, acct_b_v: $.data.version }
            - call: "POST /component-skus"
              payload: { name: "Cross Item", unit_cost_cents: 200, is_perishable: false, on_hand_qty: 100 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /gift-basket-templates"
              payload: { name: "Cross Basket", category: "CUSTOM", base_price_cents: 2000, is_perishable: false, components: [ { sku_id: "${sku_id}", quantity: 1 } ], active: true }
              as: PlatformAdmin
              captures: { template_id: $.data.id }
          trigger:
            - call: "POST /corporate-accounts/${acct_b_id}/orders"
              payload: { template_id: "${template_id}", occasion: "CUSTOM", expected_corporate_account_version: "${acct_b_v}" }
              as: AccountManager
              as_user_id: "${acct_a_id}"
          assert:
            - "response error_id == 'ERR_FORBIDDEN_ROLE' with http_status 403 (X-User-ID '${acct_a_id}' does not own the target account '${acct_b_id}')"

  # ===========================================================================
  # Section: complexity_layers  (scheduled/deferred actions, OCC, version-pinning)
  # ===========================================================================
  - section: complexity_layers
    instances:
      - name: occ_stale_version_rejected_on_branding_profile_create
        claim_type: "occ_stale_version_conflict"
        grounds: ["concurrency_rules[branding-profile-create-stale-account]"]
        distinguishing_aspect: "Two strictly sequential BrandingProfile-create requests: the first succeeds and bumps CorporateAccount.version; a second request still carrying the ORIGINAL (now-stale) expected_corporate_account_version is rejected with ERR_STALE_VERSION, purely from observing a stale version field — no timing/parallelism involved."
        test_recipe:
          setup: ["A CorporateAccount at version=1. A first BrandingProfile is created using expected_corporate_account_version=1, which succeeds and bumps the account to version=2."]
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { name: "Occ Corp", billing_email: "ap@occ.example", monthly_budget_cents: 1000000, approval_threshold_cents: 1000000 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /corporate-accounts/${acct_id}/branding-profiles"
              payload: { name: "First Kit", logo_url: "https://cdn.example/first.png", accent_color: "#111111", card_stock: "MATTE", expected_corporate_account_version: "${acct_v}" }
              as: AccountManager
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /corporate-accounts/${acct_id}/branding-profiles"
              payload: { name: "Second Kit", logo_url: "https://cdn.example/second.png", accent_color: "#222222", card_stock: "GLOSS", expected_corporate_account_version: "${acct_v}" }
              as: AccountManager
              as_user_id: "${acct_id}"
          assert:
            - "response error_id == 'ERR_STALE_VERSION' with http_status 412 (expected_corporate_account_version=${acct_v} is stale; the account is now at version 2 after the first branding-profile creation)"

      - name: occ_stale_version_rejected_on_order_create_after_budget_patch
        claim_type: "occ_stale_version_conflict"
        grounds: ["concurrency_rules[order-create-stale-account]"]
        distinguishing_aspect: "A CorporateOrder-create request carrying an expected_corporate_account_version observed BEFORE a PATCH /corporate-accounts/{id}/budget call is rejected, since the PATCH bumped the account's version — a different write_endpoint/parent-mutation pair than this rule's sibling instance (BrandingProfile creation)."
        test_recipe:
          setup: ["A CorporateAccount at version=1. Its budget is then adjusted via PATCH, bumping it to version=2."]
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { name: "OccOrder Corp", billing_email: "ap@occorder.example", monthly_budget_cents: 500000, approval_threshold_cents: 500000 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /component-skus"
              payload: { name: "Occ Item", unit_cost_cents: 200, is_perishable: false, on_hand_qty: 100 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /gift-basket-templates"
              payload: { name: "Occ Basket", category: "CUSTOM", base_price_cents: 2000, is_perishable: false, components: [ { sku_id: "${sku_id}", quantity: 1 } ], active: true }
              as: PlatformAdmin
              captures: { template_id: $.data.id }
            - call: "PATCH /corporate-accounts/${acct_id}/budget"
              payload: { monthly_budget_cents: 600000 }
              as: PlatformAdmin
          trigger:
            - call: "POST /corporate-accounts/${acct_id}/orders"
              payload: { template_id: "${template_id}", occasion: "CUSTOM", expected_corporate_account_version: "${acct_v}" }
              as: AccountManager
              as_user_id: "${acct_id}"
          assert:
            - "response error_id == 'ERR_STALE_VERSION' with http_status 412 (expected_corporate_account_version=${acct_v} is stale after the intervening PATCH /corporate-accounts/{id}/budget bumped the account to version 2)"

      - name: recurring_series_auto_generates_order_when_clock_passes_next_run_date
        claim_type: "scheduled_deferred_action"
        grounds: ["state_machines.RecurringOrderSeries.ACTIVE_to_ACTIVE"]
        distinguishing_aspect: "Advancing the logical clock past an ACTIVE series' next_run_date auto-generates a new CorporateOrder cloning the source order's template/branding/occasion, and advances next_run_date by interval_days — a clock-driven system transition, not a client-triggered one."
        test_recipe:
          setup: ["A RecurringOrderSeries with interval_days=30, created at the default clock instant 2026-03-01T00:00:00Z, so next_run_date=2026-03-31T00:00:00Z."]
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { name: "Recur Corp", billing_email: "ap@recur.example", monthly_budget_cents: 1000000, approval_threshold_cents: 1000000 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /component-skus"
              payload: { name: "Recur Item", unit_cost_cents: 300, is_perishable: false, on_hand_qty: 1000 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /gift-basket-templates"
              payload: { name: "Recur Basket", category: "CORPORATE_WELCOME", base_price_cents: 3000, is_perishable: false, components: [ { sku_id: "${sku_id}", quantity: 1 } ], active: true }
              as: PlatformAdmin
              captures: { template_id: $.data.id }
            - call: "POST /corporate-accounts/${acct_id}/orders"
              payload: { template_id: "${template_id}", occasion: "ONBOARDING", expected_corporate_account_version: "${acct_v}" }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { source_order_id: $.data.id }
            - call: "POST /corporate-accounts/${acct_id}/recurring-series"
              payload: { source_order_id: "${source_order_id}", interval_days: 30 }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { series_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "RecurringOrderSeries.${series_id}.next_run_date == '2026-05-01T00:00:00Z' (advanced by interval_days=30 from 2026-04-01, the clock instant that passed the prior 2026-03-31 next_run_date)"
            - "RecurringOrderSeries.${series_id}.last_generated_order_id is a new CorporateOrder id (not null, and different from '${source_order_id}')"

      - name: perishable_reservation_auto_expires_when_clock_passes_expires_at
        claim_type: "scheduled_deferred_action"
        grounds: ["state_machines.InventoryReservation.RESERVED_to_EXPIRED"]
        distinguishing_aspect: "A RESERVED reservation on a perishable SKU whose expires_at has passed transitions automatically to EXPIRED the moment the logical clock is advanced past it — a system-triggered, clock-driven transition, not a client action."
        test_recipe:
          setup: ["ComponentSKU is_perishable=true, shelf_life_days=2 (so expires_at = clock default 2026-03-01T00:00:00Z + 2 days = 2026-03-03T00:00:00Z once reserved); one Recipient imported, creating the reservation."]
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { name: "Expiry Corp", billing_email: "ap@expiry.example", monthly_budget_cents: 1000000, approval_threshold_cents: 1000000 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /component-skus"
              payload: { name: "Fresh Berries", unit_cost_cents: 250, is_perishable: true, shelf_life_days: 2, on_hand_qty: 50 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /gift-basket-templates"
              payload: { name: "Berry Basket", category: "CLIENT_APPRECIATION", base_price_cents: 3500, is_perishable: true, shelf_life_days: 2, components: [ { sku_id: "${sku_id}", quantity: 1 } ], active: true }
              as: PlatformAdmin
              captures: { template_id: $.data.id }
            - call: "POST /corporate-accounts/${acct_id}/orders"
              payload: { template_id: "${template_id}", occasion: "THANK_YOU", expected_corporate_account_version: "${acct_v}" }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/recipients/import"
              payload: { rows: [ { full_name: "Expiry Recipient", email: "expiry@example.com", shipping_address_line1: "18 Berry St", city: "Redmond", state_code: "OR", postal_code: "97756", country_code: "US", quantity: 3 } ] }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { recipient_id: "$.data[0].id" }
            - call: "GET /inventory-reservations"
              payload: { recipient_id: "${recipient_id}" }
              as: WarehouseOps
              captures: { reservation_id: "$.data[0].id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-04T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "InventoryReservation.${reservation_id}.status == 'EXPIRED' (expires_at 2026-03-03T00:00:00Z has passed as of the new clock instant 2026-03-04T00:00:00Z)"

  # ===========================================================================
  # Section: consistency_model  (atomicity of the auto-approval continuation)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: failed_auto_approval_rolls_back_atomically_leaving_order_draft
        claim_type: "atomic_consistency"
        grounds: ["state_machines.CorporateOrder.DRAFT_to_PENDING_APPROVAL"]
        distinguishing_aspect: "When requires_approval resolves to false but the auto-approval continuation itself fails a precondition (here, a non-existent station_id), the ENTIRE submit-for-approval call fails atomically: approval_status remains DRAFT and no BudgetApproval row is persisted — not left stranded in PENDING_APPROVAL."
        test_recipe:
          setup: ["An order with a small enough total that requires_approval will resolve to false, but a bogus station_id is supplied so the auto-approval continuation's existence check fails."]
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { name: "Atomic Corp", billing_email: "ap@atomic.example", monthly_budget_cents: 1000000, approval_threshold_cents: 1000000 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /component-skus"
              payload: { name: "Small Item", unit_cost_cents: 100, is_perishable: false, on_hand_qty: 100 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /gift-basket-templates"
              payload: { name: "Small Basket", category: "CUSTOM", base_price_cents: 1000, is_perishable: false, components: [ { sku_id: "${sku_id}", quantity: 1 } ], active: true }
              as: PlatformAdmin
              captures: { template_id: $.data.id }
            - call: "POST /corporate-accounts/${acct_id}/orders"
              payload: { template_id: "${template_id}", occasion: "CUSTOM", expected_corporate_account_version: "${acct_v}" }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/recipients/import"
              payload: { rows: [ { full_name: "Atomic Recipient", email: "atomic@example.com", shipping_address_line1: "19 Atom St", city: "Prineville", state_code: "OR", postal_code: "97754", country_code: "US", quantity: 1 } ] }
              as: AccountManager
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /orders/${order_id}/submit-for-approval"
              payload: { requested_by_user_id: "emp-req-29", station_id: "00000000-0000-4000-8000-000000000008", scheduled_date: "2026-03-04T00:00:00Z" }
              as: AccountManager
              as_user_id: "${acct_id}"
          assert:
            - "response error_id == 'ERR_FULFILLMENT_REF_NOT_FOUND' with http_status 404"
            - "CorporateOrder.${order_id}.approval_status == 'DRAFT' (unchanged; the failed auto-approval continuation did not leave it stuck in PENDING_APPROVAL)"
            - "GET /orders/${order_id}/budget-approvals returns an empty array (no BudgetApproval row was persisted by the failed attempt)"
