              as: RetailerAdmin
            - call: "POST /shopper-insights/panel-households"
              payload:
                households:
                  - { household_ref: "n1", category_codes: ["SNACKS"] }
                  - { household_ref: "n2", category_codes: ["SNACKS"] }
                  - { household_ref: "n3", category_codes: ["SNACKS"] }
              as: RetailerAdmin
            - call: "POST /shopper-insights/audience-segments"
              payload: { contract_id: "${contract}", segment_name: "Recon", category_code: "SNACKS" }
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { seg: $.data.id, sz0: $.data.size }
          trigger:
            - call: "POST /shopper-insights/panel-households"
              payload:
                households:
                  - { household_ref: "n4", category_codes: ["SNACKS"] }
                  - { household_ref: "n5", category_codes: ["SNACKS"] }
              as: RetailerAdmin
            - call: "POST /shopper-insights/audience-segments/${seg}/submit"
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { sz1: $.data.size, st1: $.data.status }
          assert:
            - "size at create == 3"
            - "size after submit == 5 (recomputed against the current panel)"
            - "status == PENDING_APPROVAL"

