scenario: |
  Airline Crew Hotel Sourcing & Layover Contract Management (American Airlines): crew layover requirements by station including minimum rest, transport time and room availability commitments, hotel sourcing with request for proposal cycles, rate negotiation and blackout protections, contract terms covering room blocks, late cancellation, quiet room standards and security requirements, ground transportation coordination between airport and hotel with pickup timing tied to crew schedules, irregular operations surges requiring rooms beyond contracted blocks with distressed sourcing, crew feedback and audit on hotel conditions with remediation or contract termination, invoice reconciliation against actual crew room usage, union agreement provisions on hotel standards

domain_name: "airline-crew-hotel-sourcing"
api_prefix: ""

complexity_profile:
  primary_archetype: multi-party-negotiation
  secondary_archetype: quota-allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: approval_chain
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Station
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "IATA station code; unique across all stations"
        constraints: "uppercase 3 letters; unique"
      - name: name
        type: string
        source: input
        description: "human-readable station name"
      - name: timezone
        type: string
        source: input
        description: "IANA timezone of the station"
      - name: min_rest_hours
        type: integer
        source: input
        description: "station-level minimum crew rest hours behind the door"
        constraints: ">= 1 and <= 24"
      - name: transport_time_minutes
        type: integer
        source: input
        description: "one-way airport-to-hotel ground transport minutes used in rest and pickup math"
        constraints: ">= 5 and <= 180"
      - name: room_availability_commitment
        type: integer
        source: input
        description: "rooms the station commits to source per layover night"
        constraints: ">= 0"

  - name: UnionAgreement
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "agreement name, e.g. APA-2026"
      - name: crew_type
        type: enum
        source: input
        description: "crew population governed"
        constraints: "one of PILOT | FLIGHT_ATTENDANT"
      - name: min_rest_hours
        type: integer
        source: input
        description: "contractual minimum rest hours; the stricter of station vs union applies"
        constraints: ">= 8 and <= 24"
      - name: quiet_room_required
        type: boolean
        source: input
        description: "whether contracted hotels must guarantee quiet rooms"
      - name: min_room_standard
        type: enum
        source: input
        description: "minimum acceptable room standard"
        constraints: "one of STANDARD | PREMIUM | SUITE"
      - name: blackout_protection_required
        type: boolean
        source: input
        description: "whether contract must carry blackout date protections"
      - name: max_invoice_variance_pct
        type: number
        source: input
        description: "maximum absolute percent variance between billed and reconciled invoice totals before approval is blocked"
        constraints: "> 0 and <= 100"

  - name: HotelVendor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "vendor legal name"
      - name: contact_email
        type: string
        source: input
        description: "vendor contact email"
      - name: status
        type: enum
        source: system
        description: "vendor lifecycle status"
        default: ACTIVE
        constraints: "one of ACTIVE | SUSPENDED | BLACKLISTED"
      - name: security_certified
        type: boolean
        source: input
        description: "vendor holds airline security certification"
      - name: quiet_rooms_count
        type: integer
        source: input
        description: "count of quiet-standard rooms the vendor operates"
        constraints: ">= 0"

  - name: RfpCycle
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> Station.id; station being sourced"
      - name: title
        type: string
        source: input
        description: "cycle title"
      - name: status
        type: enum
        source: system
        description: "cycle state"
        default: DRAFT
        constraints: "one of DRAFT | OPEN | EVALUATION | NEGOTIATION | AWARDED | CANCELLED"
      - name: response_deadline
        type: datetime
        source: input
        description: "ISO8601 UTC instant after which proposals are rejected"
      - name: target_room_count
        type: integer
        source: input
        description: "rooms the cycle aims to contract"
        constraints: ">= 1"
      - name: budget_cap_cents
        type: integer
        source: input
        description: "maximum total contract value allowed at award"
        constraints: "> 0"
      - name: negotiation_round
        type: integer
        source: system
        description: "counts EVALUATION->NEGOTIATION entries; increments on each open-negotiation"
        default: 0
  - name: RfpProposal
    parent: null
    common_fields: true
    fields:
      - name: rfp_cycle_id
        type: string
        source: input
        description: "FK -> RfpCycle.id; cycle this proposal answers"
      - name: vendor_id
        type: string
        source: input
        description: "FK -> HotelVendor.id; proposing vendor"
      - name: offered_room_count
        type: integer
        source: input
        description: "rooms offered"
        constraints: ">= 1"
      - name: offered_rate_cents
        type: integer
        source: input
        description: "offered nightly room rate"
        constraints: ">= 0"
      - name: current_rate_cents
        type: integer
        source: system
        description: "rate in effect during NEGOTIATION; set from offered_rate_cents at submission, rewritten by counter-offers"
      - name: status
        type: enum
        source: system
        description: "proposal state"
        default: SUBMITTED
        constraints: "one of SUBMITTED | UNDER_REVIEW | SHORTLISTED | REJECTED | ACCEPTED | WITHDRAWN"
      - name: quiet_room_commitment
        type: integer
        source: input
        description: "quiet rooms committed by the vendor"
        constraints: ">= 0"
      - name: blackout_dates
        type: array
        source: input
        description: "array of ISO8601 dates (YYYY-MM-DD) the vendor excludes from the rate"
        default: []

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - name: rfp_cycle_id
        type: string
        source: input
        description: "FK -> RfpCycle.id; awarding cycle"
      - name: station_id
        type: string
        source: system
        description: "FK -> Station.id; copied from the RfpCycle at creation"
      - name: vendor_id
        type: string
        source: system
        description: "FK -> HotelVendor.id; copied from the accepted proposal"
      - name: proposal_id
        type: string
        source: system
        description: "FK -> RfpProposal.id; the proposal this contract awards"
      - name: status
        type: enum
        source: system
        description: "contract state"
        default: DRAFT
        constraints: "one of DRAFT | ACTIVE | SUSPENDED | TERMINATED | EXPIRED"
      - name: room_block_size
        type: integer
        source: input
        description: "contracted room block per night"
        constraints: ">= 1"
      - name: negotiated_rate_cents
        type: integer
        source: system
        description: "nightly rate taken from proposal.current_rate_cents at award"
      - name: start_date
        type: datetime
        source: input
        description: "contract effective date (UTC)"
      - name: end_date
        type: datetime
        source: input
        description: "contract expiry date (UTC); must be after start_date"
      - name: late_cancel_hours
        type: integer
        source: input
        description: "hours before check-in within which cancellation is late and chargeable"
        constraints: ">= 0"
      - name: quiet_room_standard
        type: enum
        source: input
        description: "quiet room standard guaranteed"
        constraints: "one of BASIC | ENHANCED | PREMIUM"
      - name: security_requirements
        type: array
        source: input
        description: "array of security clause identifiers"
        default: []
      - name: blackout_dates
        type: array
        source: input
        description: "array of ISO8601 dates (YYYY-MM-DD) on which the negotiated rate does not apply"
        default: []
      - name: blackout_protection
        type: boolean
        source: input
        description: "whether rooms must still be honored on blackout dates"
        default: false
      - name: remediation_deadline
        type: datetime
        source: system
        description: "ISO8601 deadline by which an open CRITICAL audit must be remediated; set when contract enters SUSPENDED"
      - name: total_contract_value_cents
        type: integer
        source: computed
        description: "computed by contract_value: negotiated_rate_cents * room_block_size * nights"

  - name: CrewLayoverRequirement
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> Station.id; station of the layover"
      - name: crew_type
        type: enum
        source: input
        description: "crew population"
        constraints: "one of PILOT | FLIGHT_ATTENDANT"
      - name: crew_count
        type: integer
        source: input
        description: "rooms required (one room per crew member)"
        constraints: ">= 1"
      - name: arrival_time
        type: datetime
        source: input
        description: "scheduled aircraft arrival at the station (UTC)"
      - name: departure_time
        type: datetime
        source: input
        description: "scheduled next departure from the station (UTC); must be after arrival_time"
      - name: required_rest_hours
        type: integer
        source: input
        description: "rest hours the schedule was built to provide"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "requirement state"
        default: PLANNED
        constraints: "one of PLANNED | CONFIRMED | SURGED | CANCELLED | COMPLETED"
      - name: is_irregular_ops
        type: boolean
        source: input
        description: "true when the layover arises from irregular operations (IROPS)"
        default: false
      - name: rest_compliant
        type: boolean
        source: computed
        description: "computed by rest_compliance: effective_required_rest >= effective minimum rest"
  - name: RoomAllocation
    parent: null
    common_fields: true
    fields:
      - name: layover_requirement_id
        type: string
        source: input
        description: "FK -> CrewLayoverRequirement.id; the layover being housed"
      - name: contract_id
        type: string
        source: system
        description: "FK -> Contract.id; set when kind is CONTRACTED; null for DISTRESSED"
      - name: vendor_id
        type: string
        source: system
        description: "FK -> HotelVendor.id; set when kind is DISTRESSED; null for CONTRACTED"
      - name: kind
        type: enum
        source: system
        description: "CONTRACTED for book-against-contract; DISTRESSED for surge sourcing"
        constraints: "one of CONTRACTED | DISTRESSED"
      - name: status
        type: enum
        source: system
        description: "allocation state"
        default: HELD
        constraints: "one of HELD | CONFIRMED | CHECKED_IN | RELEASED | CANCELLED | NO_SHOW"
      - name: rooms_held
        type: integer
        source: system
        description: "rooms held; equals the layover's crew_count at creation"
        constraints: ">= 1"
      - name: nightly_rate_cents
        type: integer
        source: system
        description: "CONTRACTED: contract.negotiated_rate_cents unless the stay date is in contract.blackout_dates (then blackout_rate_cents); DISTRESSED: rate set at confirm"
      - name: blackout_rate_cents
        type: integer
        source: input
        description: "optional override rate applied when the stay date is a blackout date; required iff contract.blackout_protection is true and the date is blacked out"
        constraints: ">= 0 when present"
      - name: stay_date
        type: datetime
        source: input
        description: "UTC calendar date of the room night"
      - name: distressed_cost_cents
        type: integer
        source: computed
        description: "computed by distressed_cost at CONFIRMED for DISTRESSED allocations; null otherwise"

  - name: TransportTrip
    parent: null
    common_fields: true
    fields:
      - name: layover_requirement_id
        type: string
        source: input
        description: "FK -> CrewLayoverRequirement.id; layover served"
      - name: contract_id
        type: string
        source: system
        description: "FK -> Contract.id; copied from the layover's CONFIRMED CONTRACTED allocation at schedule time"
      - name: direction
        type: enum
        source: input
        description: "travel direction"
        constraints: "one of AIRPORT_TO_HOTEL | HOTEL_TO_AIRPORT"
      - name: pickup_time
        type: datetime
        source: computed
        description: "computed by pickup_timing from layover times, station transport minutes and direction"
      - name: status
        type: enum
        source: system
        description: "trip state"
        default: SCHEDULED
        constraints: "one of SCHEDULED | DISPATCHED | COMPLETED | CANCELLED | MISSED"
      - name: vehicle_capacity
        type: integer
        source: input
        description: "seats on the dispatched vehicle"
        constraints: ">= 1"

  - name: CrewFeedback
    parent: null
    common_fields: false
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; contract the feedback targets"
      - name: layover_requirement_id
        type: string
        source: input
        description: "FK -> CrewLayoverRequirement.id; layover during which conditions were experienced"
      - name: crew_type
        type: enum
        source: input
        description: "population of the reporting crew"
        constraints: "one of PILOT | FLIGHT_ATTENDANT"
      - name: rating
        type: integer
        source: input
        description: "1 (worst) to 5 (best)"
        constraints: ">= 1 and <= 5"
      - name: category
        type: enum
        source: input
        description: "primary complaint category"
        constraints: "one of NOISE | SECURITY | CLEANLINESS | TRANSPORT | OTHER"
      - name: comment
        type: string
        source: input
        description: "free-text comment"
        default: ""

  - name: Audit
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; contract under audit"
      - name: auditor_id
        type: string
        source: input
        description: "opaque identifier of the CrewAuditor performing the audit"
      - name: status
        type: enum
        source: system
        description: "audit state"
        default: OPEN
        constraints: "one of OPEN | IN_PROGRESS | CLOSED_PASS | CLOSED_FAIL"
      - name: severity
        type: enum
        source: input
        description: "finding severity; CRITICAL suspends the contract"
        constraints: "one of MINOR | MAJOR | CRITICAL"
      - name: findings
        type: string
        source: input
        description: "finding narrative"
      - name: opened_at
        type: datetime
        source: system
        description: "timestamp the audit was opened (logical clock)"

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; contract billed"
      - name: billing_period_start
        type: datetime
        source: input
        description: "invoice period start (UTC)"
      - name: billing_period_end
        type: datetime
        source: input
        description: "invoice period end (UTC); must be on or after start"
      - name: status
        type: enum
        source: system
        description: "invoice state"
        default: RECEIVED
        constraints: "one of RECEIVED | RECONCILED | APPROVED | DISPUTED | PAID | REJECTED"
      - name: billed_room_nights
        type: integer
        source: input
        description: "room nights the vendor claims"
        constraints: ">= 0"
      - name: billed_amount_cents
        type: integer
        source: input
        description: "total amount the vendor claims"
        constraints: ">= 0"
      - name: reconciled_room_nights
        type: integer
        source: computed
        description: "computed by invoice_reconciliation from CHECKED_IN and NO_SHOW allocations in the period"
      - name: reconciled_amount_cents
        type: integer
        source: computed
        description: "computed by invoice_reconciliation; reconciled room nights at contracted rates plus late-cancel charges"
      - name: variance_pct
        type: number
        source: computed
        description: "computed by invoice_variance; 0.0 when reconciled_amount_cents == 0"
# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RfpCycle
    initial_state: DRAFT
    terminal_states: [AWARDED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /rfp-cycles/{id}/open"
        actor: SourcingManager
        preconditions:
          - "cycle.status == DRAFT"
          - "cycle.response_deadline is after the current logical clock time"
        side_effects:
          - "increments RfpCycle.version by 1"
      - from: OPEN
        to: EVALUATION
        trigger: "POST /rfp-cycles/{id}/close"
        actor: SourcingManager
        preconditions:
          - "cycle.status == OPEN"
        side_effects:
          - "every RfpProposal of this cycle with status SUBMITTED transitions to UNDER_REVIEW"
          - "increments RfpCycle.version by 1"
      - from: EVALUATION
        to: NEGOTIATION
        trigger: "POST /rfp-cycles/{id}/open-negotiation"
        actor: SourcingManager
        preconditions:
          - "cycle.status == EVALUATION"
          - "at least one proposal of this cycle has status SHORTLISTED"
        side_effects:
          - "RfpCycle.negotiation_round increments by 1"
          - "increments RfpCycle.version by 1"
      - from: NEGOTIATION
        to: EVALUATION
        trigger: "POST /rfp-cycles/{id}/open-negotiation (return branch when no counter-offer advances)"
        actor: SourcingManager
        preconditions:
          - "cycle.status == NEGOTIATION"
        side_effects:
          - "increments RfpCycle.version by 1"
        note: "cyclic revision loop EVALUATION <-> NEGOTIATION; negotiation_round only increments on the EVALUATION->NEGOTIATION direction"
      - from: NEGOTIATION
        to: AWARDED
        trigger: "POST /rfp-cycles/{id}/award"
        actor: SourcingManager
        preconditions:
          - "cycle.status == NEGOTIATION"
          - "payload.proposal_id references a proposal of this cycle with status SHORTLISTED"
          - "proposal.current_rate_cents * payload.room_block_size * nights(payload.start_date, payload.end_date) <= cycle.budget_cap_cents (contract_value, preliminary rounding variant)"
          - "payload.end_date is after payload.start_date"
        side_effects:
          - "creates a Contract in status DRAFT with proposal_id, vendor_id, station_id copied, negotiated_rate_cents = proposal.current_rate_cents"
          - "the awarded proposal transitions SHORTLISTED -> ACCEPTED"
          - "every other proposal of this cycle with status in {SUBMITTED, UNDER_REVIEW, SHORTLISTED} transitions to REJECTED"
          - "increments RfpCycle.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /rfp-cycles/{id}/cancel"
        actor: SourcingManager
        preconditions:
          - "cycle.status in {DRAFT, OPEN, EVALUATION, NEGOTIATION}"
        side_effects:
          - "every proposal of this cycle with status in {SUBMITTED, UNDER_REVIEW, SHORTLISTED} transitions to REJECTED"
          - "increments RfpCycle.version by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /rfp-cycles/{id}/cancel"
        actor: SourcingManager
        preconditions:
          - "cycle.status in {DRAFT, OPEN, EVALUATION, NEGOTIATION}"
        side_effects:
          - "every proposal of this cycle with status in {SUBMITTED, UNDER_REVIEW, SHORTLISTED} transitions to REJECTED"
          - "increments RfpCycle.version by 1"
      - from: EVALUATION
        to: CANCELLED
        trigger: "POST /rfp-cycles/{id}/cancel"
        actor: SourcingManager
        preconditions:
          - "cycle.status in {DRAFT, OPEN, EVALUATION, NEGOTIATION}"
        side_effects:
          - "every proposal of this cycle with status in {SUBMITTED, UNDER_REVIEW, SHORTLISTED} transitions to REJECTED"
          - "increments RfpCycle.version by 1"
      - from: NEGOTIATION
        to: CANCELLED
        trigger: "POST /rfp-cycles/{id}/cancel"
        actor: SourcingManager
        preconditions:
          - "cycle.status in {DRAFT, OPEN, EVALUATION, NEGOTIATION}"
        side_effects:
          - "every proposal of this cycle with status in {SUBMITTED, UNDER_REVIEW, SHORTLISTED} transitions to REJECTED"
          - "increments RfpCycle.version by 1"

  - entity: RfpProposal
    initial_state: SUBMITTED
    terminal_states: [REJECTED, ACCEPTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "system cascade: parent RfpCycle OPEN -> EVALUATION via POST /rfp-cycles/{id}/close"
        actor: system
        preconditions:
          - "parent cycle transitions OPEN -> EVALUATION"
        side_effects:
          - "increments RfpProposal.version by 1"
      - from: UNDER_REVIEW
        to: SHORTLISTED
        trigger: "POST /rfp-proposals/{id}/shortlist"
        actor: SourcingManager
        preconditions:
          - "proposal.status == UNDER_REVIEW"
          - "parent cycle.status == EVALUATION"
        side_effects:
          - "increments RfpProposal.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /rfp-proposals/{id}/reject"
        actor: SourcingManager
        preconditions:
          - "proposal.status in {UNDER_REVIEW, SHORTLISTED}"
        side_effects:
          - "increments RfpProposal.version by 1"
      - from: SHORTLISTED
        to: REJECTED
        trigger: "POST /rfp-proposals/{id}/reject or cascade from cycle award/cancel"
        actor: SourcingManager
        preconditions:
          - "proposal.status in {UNDER_REVIEW, SHORTLISTED}"
        side_effects:
          - "increments RfpProposal.version by 1"
      - from: SHORTLISTED
        to: ACCEPTED
        trigger: "system cascade: parent cycle award"
        actor: system
        preconditions:
          - "parent cycle transitions NEGOTIATION -> AWARDED naming this proposal"
        side_effects:
          - "increments RfpProposal.version by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /rfp-proposals/{id}/withdraw"
        actor: HotelVendorRep
        preconditions:
          - "proposal.status in {SUBMITTED, UNDER_REVIEW, SHORTLISTED}"
          - "acting HotelVendorRep.vendor_id == proposal.vendor_id"
        side_effects:
          - "increments RfpProposal.version by 1"
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /rfp-proposals/{id}/withdraw"
        actor: HotelVendorRep
        preconditions:
          - "proposal.status in {SUBMITTED, UNDER_REVIEW, SHORTLISTED}"
          - "acting HotelVendorRep.vendor_id == proposal.vendor_id"
        side_effects:
          - "increments RfpProposal.version by 1"
      - from: SHORTLISTED
        to: WITHDRAWN
        trigger: "POST /rfp-proposals/{id}/withdraw"
        actor: HotelVendorRep
        preconditions:
          - "proposal.status in {SUBMITTED, UNDER_REVIEW, SHORTLISTED}"
          - "acting HotelVendorRep.vendor_id == proposal.vendor_id"
        side_effects:
          - "increments RfpProposal.version by 1"
  - entity: Contract
    initial_state: DRAFT
    terminal_states: [TERMINATED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /contracts/{id}/activate"
        actor: SourcingManager
        preconditions:
          - "contract.status == DRAFT"
          - "contract.vendor.status == ACTIVE (vendor not SUSPENDED or BLACKLISTED)"
          - "union compliance: for the UnionAgreement of the station's crew, if quiet_room_required then contract.quiet_room_standard != BASIC; if blackout_protection_required then contract.blackout_protection == true; min_room_standard STANDARD requires quiet_room_standard in {BASIC, ENHANCED, PREMIUM}, PREMIUM requires {ENHANCED, PREMIUM}, SUITE requires {PREMIUM}"
          - "contract.start_date is on or before end_date"
        side_effects:
          - "increments Contract.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system cascade: an Audit with severity CRITICAL is opened against this contract via POST /audits"
        actor: system
        preconditions:
          - "contract.status == ACTIVE"
        side_effects:
          - "sets contract.remediation_deadline = logical clock + 168 hours (7 days)"
          - "every RoomAllocation of this contract with status HELD transitions to RELEASED"
          - "every TransportTrip referencing this contract with status SCHEDULED transitions to CANCELLED"
          - "every CrewLayoverRequirement at this contract's station with status CONFIRMED whose CONFIRMED allocation was released transitions to SURGED"
          - "increments Contract.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /contracts/{id}/remediate"
        actor: SourcingManager
        preconditions:
          - "contract.status == SUSPENDED"
          - "no Audit against this contract has status OPEN or IN_PROGRESS with severity CRITICAL"
        side_effects:
          - "clears contract.remediation_deadline to null"
          - "increments Contract.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /contracts/{id}/terminate"
        actor: SourcingManager
        preconditions:
          - "contract.status == SUSPENDED"
        side_effects:
          - "contract.vendor.status transitions to SUSPENDED"
          - "increments Contract.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /contracts/{id}/terminate"
        actor: SourcingManager
        preconditions:
          - "contract.status == ACTIVE"
          - "the count of CrewFeedback rows against this contract with rating <= 2 is >= 3 (three-strike rule)"
        side_effects:
          - "every RoomAllocation of this contract with status in {HELD, CONFIRMED} transitions to CANCELLED"
          - "every CrewLayoverRequirement at this contract's station with status CONFIRMED whose allocation was cancelled transitions to SURGED"
          - "contract.vendor.status transitions to SUSPENDED"
          - "increments Contract.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: logical clock passes contract.end_date"
        actor: system
        preconditions:
          - "contract.status == ACTIVE"
          - "logical clock time > contract.end_date"
        side_effects:
          - "increments Contract.version by 1"
        note: "evaluated lazily: any read or write touching the contract after end_date settles it to EXPIRED"

  - entity: CrewLayoverRequirement
    initial_state: PLANNED
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: PLANNED
        to: CONFIRMED
        trigger: "POST /layover-requirements/{id}/book"
        actor: CrewOps
        preconditions:
          - "layover.status == PLANNED"
          - "layover.rest_compliant == true (effective_required_rest >= max(station.min_rest_hours, union.min_rest_hours for the layover's crew_type))"
          - "the contract named by payload.contract_id has status ACTIVE, station_id == layover.station_id"
          - "the stay_date is not in contract.blackout_dates, OR contract.blackout_protection == true (blackout protection honors the stay at blackout_rate_cents)"
          - "no other RoomAllocation for this layover has status in {HELD, CONFIRMED} (overlap guard: layover resource occupied at most once)"
          - "occupancy guard: count of CONFIRMED RoomAllocation rows of this contract with stay_date == payload.stay_date must be < contract.room_block_size"
        side_effects:
          - "creates a RoomAllocation kind CONTRACTED, status HELD, contract_id = payload.contract_id, rooms_held = layover.crew_count, nightly_rate_cents = negotiated or blackout rate per stay_date"
          - "increments CrewLayoverRequirement.version by 1"
      - from: CONFIRMED
        to: SURGED
        trigger: "system cascade: the layover's allocation is RELEASED (contract suspension) or CANCELLED (contract termination)"
        actor: system
        preconditions:
          - "layover.status == CONFIRMED"
        side_effects:
          - "increments CrewLayoverRequirement.version by 1"
      - from: SURGED
        to: CONFIRMED
        trigger: "POST /layover-requirements/{id}/distressed-book"
        actor: CrewOps
        preconditions:
          - "layover.status == SURGED"
          - "payload.vendor_id references a HotelVendor with status ACTIVE"
        side_effects:
          - "creates a RoomAllocation kind DISTRESSED, status HELD, vendor_id = payload.vendor_id, rooms_held = layover.crew_count, nightly_rate_cents = payload.rate_cents"
          - "increments CrewLayoverRequirement.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /layover-requirements/{id}/cancel"
        actor: CrewOps
        preconditions:
          - "layover.status in {PLANNED, CONFIRMED, SURGED}"
        side_effects:
          - "if a RoomAllocation for this layover has status in {HELD, CONFIRMED}: it transitions to CANCELLED, and the cancel is late (invoice chargeable) iff the allocation's stay_date minus contract.late_cancel_hours is after the logical clock time"
          - "every TransportTrip for this layover with status SCHEDULED transitions to CANCELLED"
          - "increments CrewLayoverRequirement.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /layover-requirements/{id}/cancel"
        actor: CrewOps
        preconditions:
          - "layover.status in {PLANNED, CONFIRMED, SURGED}"
        side_effects:
          - "if a RoomAllocation for this layover has status in {HELD, CONFIRMED}: it transitions to CANCELLED, and the cancel is late (invoice chargeable) iff the allocation's stay_date minus contract.late_cancel_hours is after the logical clock time"
          - "every TransportTrip for this layover with status SCHEDULED transitions to CANCELLED"
          - "increments CrewLayoverRequirement.version by 1"
      - from: SURGED
        to: CANCELLED
        trigger: "POST /layover-requirements/{id}/cancel"
        actor: CrewOps
        preconditions:
          - "layover.status in {PLANNED, CONFIRMED, SURGED}"
        side_effects:
          - "if a RoomAllocation for this layover has status in {HELD, CONFIRMED}: it transitions to CANCELLED; DISTRESSED allocations are always chargeable on cancellation"
          - "every TransportTrip for this layover with status SCHEDULED transitions to CANCELLED"
          - "increments CrewLayoverRequirement.version by 1"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "system cascade: the layover's RoomAllocation transitions CONFIRMED -> CHECKED_IN"
        actor: system
        preconditions:
          - "layover.status == CONFIRMED"
        side_effects:
          - "increments CrewLayoverRequirement.version by 1"

  - entity: RoomAllocation
    initial_state: HELD
    terminal_states: [RELEASED, CANCELLED, NO_SHOW, CHECKED_IN]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /allocations/{id}/confirm"
        actor: CrewOps
        preconditions:
          - "allocation.status == HELD"
          - "the allocation's layover has status CONFIRMED"
        side_effects:
          - "if kind == DISTRESSED: sets distressed_cost_cents via distressed_cost calculation"
          - "increments RoomAllocation.version by 1"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /allocations/{id}/check-in"
        actor: HotelVendorRep
        preconditions:
          - "allocation.status == CONFIRMED"
          - "allocation.stay_date is on or before the logical clock date (cannot check in before the stay date)"
        side_effects:
          - "cascade: the allocation's CrewLayoverRequirement transitions CONFIRMED -> COMPLETED"
          - "increments RoomAllocation.version by 1"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /allocations/{id}/no-show"
        actor: CrewOps
        preconditions:
          - "allocation.status == CONFIRMED"
          - "logical clock date is strictly after allocation.stay_date"
        side_effects:
          - "increments RoomAllocation.version by 1"
      - from: HELD
        to: RELEASED
        trigger: "POST /allocations/{id}/release or system cascade on contract suspension"
        actor: CrewOps
        preconditions:
          - "allocation.status == HELD"
        side_effects:
          - "if the allocation's layover has status CONFIRMED: cascade transitions it CONFIRMED -> SURGED"
          - "increments RoomAllocation.version by 1"
      - from: HELD
        to: CANCELLED
        trigger: "system cascade on layover cancel or contract termination"
        actor: system
        preconditions:
          - "allocation.status in {HELD, CONFIRMED}"
        side_effects:
          - "increments RoomAllocation.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "system cascade on layover cancel or contract termination"
        actor: system
        preconditions:
          - "allocation.status in {HELD, CONFIRMED}"
        side_effects:
          - "increments RoomAllocation.version by 1"

  - entity: TransportTrip
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, MISSED]
    transitions:
      - from: SCHEDULED
        to: DISPATCHED
        trigger: "POST /transport-trips/{id}/dispatch"
        actor: CrewOps
        preconditions:
          - "trip.status == SCHEDULED"
          - "the trip's layover has status CONFIRMED"
        side_effects:
          - "increments TransportTrip.version by 1"
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /transport-trips/{id}/complete"
        actor: CrewOps
        preconditions:
          - "trip.status == DISPATCHED"
        side_effects:
          - "increments TransportTrip.version by 1"
      - from: SCHEDULED
        to: MISSED
        trigger: "system: logical clock passes trip.pickup_time while still SCHEDULED"
        actor: system
        preconditions:
          - "trip.status == SCHEDULED"
          - "logical clock time > trip.pickup_time"
        side_effects:
          - "increments TransportTrip.version by 1"
        note: "evaluated lazily on any read or write of the trip"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system cascade on layover cancel or contract suspension"
        actor: system
        preconditions:
          - "trip.status == SCHEDULED"
        side_effects:
          - "increments TransportTrip.version by 1"

  - entity: Audit
    initial_state: OPEN
    terminal_states: [CLOSED_PASS, CLOSED_FAIL]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /audits/{id}/start"
        actor: CrewAuditor
        preconditions:
          - "audit.status == OPEN"
        side_effects:
          - "increments Audit.version by 1"
      - from: IN_PROGRESS
        to: CLOSED_PASS
        trigger: "POST /audits/{id}/close"
        actor: CrewAuditor
        preconditions:
          - "audit.status == IN_PROGRESS"
          - "payload.outcome == PASS"
        side_effects:
          - "increments Audit.version by 1"
      - from: IN_PROGRESS
        to: CLOSED_FAIL
        trigger: "POST /audits/{id}/close"
        actor: CrewAuditor
        preconditions:
          - "audit.status == IN_PROGRESS"
          - "payload.outcome == FAIL"
        side_effects:
          - "cascade: the audit's Contract transitions to TERMINATED with all termination side effects (allocations cancelled, layovers surged, vendor suspended), regardless of whether the contract was ACTIVE or SUSPENDED"
          - "increments Audit.version by 1"

  - entity: Invoice
    initial_state: RECEIVED
    terminal_states: [PAID, REJECTED]
    transitions:
      - from: RECEIVED
        to: RECONCILED
        trigger: "POST /invoices/{id}/reconcile"
        actor: FinanceAnalyst
        preconditions:
          - "invoice.status == RECEIVED"
        side_effects:
          - "runs invoice_reconciliation: sets reconciled_room_nights and reconciled_amount_cents from the contract's allocations in the billing period"
          - "runs invoice_variance: sets variance_pct"
          - "increments Invoice.version by 1"
      - from: RECONCILED
        to: APPROVED
        trigger: "POST /invoices/{id}/approve"
        actor: FinanceAnalyst
        preconditions:
          - "invoice.status == RECONCILED"
          - "invoice.variance_pct <= union.max_invoice_variance_pct for the station's crew agreement (fiscal gate)"
        side_effects:
          - "increments Invoice.version by 1"
      - from: RECONCILED
        to: DISPUTED
        trigger: "POST /invoices/{id}/dispute"
        actor: FinanceAnalyst
        preconditions:
          - "invoice.status in {RECONCILED, APPROVED}"
        side_effects:
          - "increments Invoice.version by 1"
      - from: APPROVED
        to: DISPUTED
        trigger: "POST /invoices/{id}/dispute"
        actor: FinanceAnalyst
        preconditions:
          - "invoice.status in {RECONCILED, APPROVED}"
        side_effects:
          - "increments Invoice.version by 1"
      - from: DISPUTED
        to: RECONCILED
        trigger: "POST /invoices/{id}/re-reconcile"
        actor: FinanceAnalyst
        preconditions:
          - "invoice.status == DISPUTED"
        side_effects:
          - "re-runs invoice_reconciliation and invoice_variance, overwriting reconciled fields"
          - "increments Invoice.version by 1"
      - from: APPROVED
        to: PAID
        trigger: "POST /invoices/{id}/mark-paid"
        actor: FinanceAnalyst
        preconditions:
          - "invoice.status == APPROVED"
        side_effects:
          - "increments Invoice.version by 1"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /invoices/{id}/reject"
        actor: FinanceAnalyst
        preconditions:
          - "invoice.status == RECEIVED"
        side_effects:
          - "increments Invoice.version by 1"
# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: award-stale-cycle-version
    parent_entity: RfpCycle
    write_endpoint: "POST /rfp-cycles/{id}/award"
    occ_field: "expected_cycle_version"
    description: |
      Awarding an RfpCycle whose version has advanced since the client last
      observed it is rejected. A prior counter-offer or open-negotiation call
      may have legitimately moved the cycle (and rewritten proposal rates),
      so the awarding client's view of the cycle is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: book-stale-layover-version
    parent_entity: CrewLayoverRequirement
    write_endpoint: "POST /layover-requirements/{id}/book"
    occ_field: "expected_layover_version"
    description: |
      Booking a CrewLayoverRequirement whose version has advanced since the
      client last observed it is rejected. A prior book or cancel may have
      legitimately changed the layover's occupancy state, so the booking
      client's view of the layover is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: rest_compliance
    trigger: "on CrewLayoverRequirement creation and on every PATCH to arrival_time, departure_time, required_rest_hours, or crew_type"
    algorithm: threshold
    formula: |
      layover_hours = (departure_time - arrival_time) in whole hours, floor
      transport_hours = 2 * station.transport_time_minutes / 60.0
      effective_rest_hours = layover_hours - transport_hours
      min_rest = max(station.min_rest_hours, union.min_rest_hours)
        where union is the UnionAgreement whose crew_type == layover.crew_type
      rest_compliant = (effective_rest_hours >= min_rest)   # boundary: >=
    input_set: "the layover, its Station, and the UnionAgreement matching crew_type"
    constants:
      TRANSPORT_LEGS: 2
    precision: "hours compared as numbers; boundary uses >= (compliant AT the threshold)"
    variants:
      - name: scheduled
        when: "layover.is_irregular_ops == false"
        difference: "uses arrival_time and departure_time as given"
      - name: irregular_ops
        when: "layover.is_irregular_ops == true"
        difference: "arrival_time is replaced by the current logical clock time when the given arrival_time is in the past, reflecting the wheels-down time"

  - name: pickup_timing
    trigger: "on POST /layover-requirements/{id}/transport-trips (trip scheduling)"
    algorithm: forward_looking
    formula: |
      if direction == AIRPORT_TO_HOTEL:
        pickup_time = layover.arrival_time + station.transport_time_minutes
      else (HOTEL_TO_AIRPORT):
        pickup_time = layover.departure_time - (station.transport_time_minutes + BUFFER_MINUTES)
    input_set: "the layover and its station"
    constants:
      BUFFER_MINUTES: 90
    precision: "minute precision, no rounding"
    variants:
      - name: scheduled
        when: "layover.is_irregular_ops == false"
        difference: "times as given"
      - name: irregular_ops
        when: "layover.is_irregular_ops == true"
        difference: "pickup_time is pushed to max(computed pickup_time, logical clock + 30 minutes) so a trip is never scheduled in the past"

  - name: contract_value
    trigger: "at RfpCycle award precondition (preliminary variant) and at Contract creation (authoritative variant)"
    algorithm: aggregation
    formula: |
      nights = (end_date - start_date) in whole days, floor
      total = rate_cents * room_block_size * nights
      # ROUNDING ORDER PINNED (mode b): multiply integers first, round only the final total to whole cents with round_half_up
      total_cents = round_half_up(rate_cents * room_block_size * nights)
    input_set: "award payload (start_date, end_date, room_block_size) and proposal.current_rate_cents"
    constants: {}
    precision: "integer cents; single final round_half_up"
    variants:
      - name: preliminary
        when: "evaluated as the award budget precondition"
        difference: "uses floor-day nights; only gates the budget check"
      - name: authoritative
        when: "evaluated at Contract creation"
        difference: "stores contract.total_contract_value_cents; identical formula, but the stored value is the system of record for downstream budget reporting"

  - name: distressed_cost
    trigger: "on RoomAllocation HELD -> CONFIRMED when kind == DISTRESSED"
    algorithm: tiered_pricing
    formula: |
      surge_n = number of pre-existing RoomAllocation rows with kind == DISTRESSED,
                stay_date == allocation.stay_date, and status in {HELD, CONFIRMED, CHECKED_IN}
      if surge_n <= TIER1_MAX:      multiplier = 1.25
      elif surge_n <= TIER2_MAX:    multiplier = 1.50
      else:                          multiplier = 2.00
      distressed_cost_cents = round_half_up(nightly_rate_cents * rooms_held * multiplier)
      # mode (a): >= 3 inputs (rate, rooms, surge tier) with tiered non-linear interaction
    input_set: "the allocation being confirmed plus all DISTRESSED allocations on the same stay_date"
    constants:
      TIER1_MAX: 5
      TIER2_MAX: 10
    precision: "integer cents, round_half_up on the final product only"

  - name: invoice_reconciliation
    trigger: "on POST /invoices/{id}/reconcile and /re-reconcile"
    algorithm: aggregation
    formula: |
      eligible = contract's RoomAllocation rows with status CHECKED_IN
                 and billing_period_start <= stay_date <= billing_period_end (inclusive both ends)
      chargeable_late_cancels = contract's RoomAllocation rows with status CANCELLED
                 in the period whose cancellation was late per the late_cancel_hours rule
      reconciled_room_nights = sum of rooms_held over eligible
      late_cancel_charge_cents = 0.50 * sum over chargeable_late_cancels of
                                 round_half_up(nightly_rate_cents * rooms_held)   # per-line rounding first
      reconciled_amount_cents = round_half_up(
          sum over eligible of round_half_up(nightly_rate_cents * rooms_held)     # per-line rounding first
        ) + late_cancel_charge_cents
      # ROUNDING ORDER PINNED (mode b): round per allocation line, then sum lines, then round the sum
    input_set: "allocations of the invoice's contract filtered by status and stay_date window"
    constants:
      LATE_CANCEL_FRACTION: 0.50
    precision: "integer cents; per-line round_half_up before summation"

  - name: invoice_variance
    trigger: "immediately after invoice_reconciliation"
    algorithm: threshold
    formula: |
      if reconciled_amount_cents == 0:
        variance_pct = 0.0 if billed_amount_cents == 0 else 100.0
      else:
        variance_pct = round_half_up(
          abs(billed_amount_cents - reconciled_amount_cents) / reconciled_amount_cents * 100, 2)
      approval_gate = (variance_pct <= union.max_invoice_variance_pct)   # boundary: <=
    input_set: "the invoice and the UnionAgreement matching the station's crew"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: percent_of_reconciled
        when: "default"
        difference: "denominator is reconciled_amount_cents (actual usage)"
      - name: percent_of_billed
        when: "reporting view only, never used for the approval gate"
        difference: "denominator is billed_amount_cents; surfaces vendor overstatement differently but MUST NOT drive approval"
# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and names a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "role is permitted for the endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every id in the path and every FK id in the body resolves to an existing entity, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "target resource is in a state from which the requested transition exists"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 5
    category: business_safety
    check: "book: layover.rest_compliant must be true (rest floor is a safety rule, evaluated before any capacity check)"
    error_id: ERR_REST_VIOLATION
    http_status: 422
    applies_to: ["POST /layover-requirements/{id}/book"]
  - priority: 6
    category: business_safety
    check: "award/activate: union compliance — quiet_room_required requires quiet_room_standard != BASIC; blackout_protection_required requires blackout_protection == true; min_room_standard ladder (STANDARD->any, PREMIUM->{ENHANCED,PREMIUM}, SUITE->{PREMIUM})"
    error_id: ERR_UNION_STANDARD_VIOLATION
    http_status: 422
    applies_to: ["POST /contracts/{id}/activate", "POST /rfp-cycles/{id}/award"]
  - priority: 7
    category: business_referential
    check: "activate: contract.vendor.status == ACTIVE"
    error_id: ERR_VENDOR_INACTIVE
    http_status: 422
    applies_to: ["POST /contracts/{id}/activate", "POST /layover-requirements/{id}/distressed-book"]
  - priority: 8
    category: business_temporal
    check: "submit proposal: logical clock time must be <= cycle.response_deadline"
    error_id: ERR_DEADLINE_PASSED
    http_status: 422
    applies_to: ["POST /rfp-cycles/{id}/proposals"]
  - priority: 9
    category: business_temporal
    check: "book: stay_date must not be in contract.blackout_dates unless contract.blackout_protection == true"
    error_id: ERR_BLACKOUT_DATE
    http_status: 422
    applies_to: ["POST /layover-requirements/{id}/book"]
  - priority: 10
    category: business_constraint
    check: "book: no other RoomAllocation for this layover has status in {HELD, CONFIRMED} (single-occupancy of the layover resource)"
    error_id: ERR_LAYOVER_ALREADY_BOOKED
    http_status: 409
    applies_to: ["POST /layover-requirements/{id}/book"]
  - priority: 11
    category: business_constraint
    check: "book: count of CONFIRMED allocations of the contract on the same stay_date < contract.room_block_size (aggregate occupancy; a CONFIRMED block of exactly room_block_size rejects the next book)"
    error_id: ERR_ROOM_BLOCK_EXHAUSTED
    http_status: 422
    applies_to: ["POST /layover-requirements/{id}/book"]
  - priority: 12
    category: business_constraint
    check: "create transport trip: pickup_time computed for the requested direction must not equal the pickup_time of an existing non-CANCELLED trip of the same layover and same direction"
    error_id: ERR_PICKUP_CONFLICT
    http_status: 409
    applies_to: ["POST /layover-requirements/{id}/transport-trips"]
  - priority: 13
    category: business_constraint
    check: "terminate from ACTIVE: three-strike rule requires >= 3 CrewFeedback rows with rating <= 2"
    error_id: ERR_TERMINATION_THRESHOLD
    http_status: 422
    applies_to: ["POST /contracts/{id}/terminate"]
  - priority: 14
    category: business_fiscal
    check: "award: contract_value preliminary total <= cycle.budget_cap_cents"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 422
    applies_to: ["POST /rfp-cycles/{id}/award"]
  - priority: 15
    category: business_fiscal
    check: "approve: invoice.variance_pct <= union.max_invoice_variance_pct"
    error_id: ERR_INVOICE_VARIANCE_EXCEEDED
    http_status: 422
    applies_to: ["POST /invoices/{id}/approve"]
  - priority: 16
    category: state
    check: "counter-offer: proposal.status must be SHORTLISTED and parent cycle.status == NEGOTIATION"
    error_id: ERR_NOT_NEGOTIABLE
    http_status: 409
    applies_to: ["POST /rfp-proposals/{id}/counter-offer"]
  - priority: 17
    category: business_constraint
    check: "request shape: required fields present, enums valid, datetime ranges ordered (end after start)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving infrastructure ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the logical clock. Startup default is exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["lazy-settles contracts past end_date to EXPIRED and trips past pickup_time to MISSED on next access"]
  # --- stations ---
  - method: POST
    path: "/stations"
    description: "Create a station"
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, timezone, min_rest_hours, transport_time_minutes, room_availability_commitment]
    output: Station
    side_effects: []
  - method: GET
    path: "/stations"
    description: "List stations"
    roles: [PlatformAdmin, SourcingManager, CrewOps, FinanceAnalyst, CrewAuditor, HotelVendorRep]
    code: 200
    input: ["limit?", "offset?"]
    output: Station[]
    side_effects: []
  - method: GET
    path: "/stations/{id}"
    description: "Get one station"
    roles: [PlatformAdmin, SourcingManager, CrewOps, FinanceAnalyst, CrewAuditor, HotelVendorRep]
    code: 200
    input: []
    output: Station
    side_effects: []
  # --- union agreements ---
  - method: POST
    path: "/union-agreements"
    description: "Create a union agreement"
    roles: [PlatformAdmin]
    code: 201
    input: [name, crew_type, min_rest_hours, quiet_room_required, min_room_standard, blackout_protection_required, max_invoice_variance_pct]
    output: UnionAgreement
    side_effects: []
  - method: GET
    path: "/union-agreements"
    description: "List union agreements"
    roles: [PlatformAdmin, SourcingManager, CrewOps, FinanceAnalyst, CrewAuditor]
    code: 200
    input: ["crew_type?", "limit?", "offset?"]
    output: UnionAgreement[]
    side_effects: []
  - method: GET
    path: "/union-agreements/{id}"
    description: "Get one union agreement"
    roles: [PlatformAdmin, SourcingManager, CrewOps, FinanceAnalyst, CrewAuditor]
    code: 200
    input: []
    output: UnionAgreement
    side_effects: []
  # --- vendors ---
  - method: POST
    path: "/hotel-vendors"
    description: "Create a hotel vendor"
    roles: [PlatformAdmin]
    code: 201
    input: [name, contact_email, security_certified, quiet_rooms_count]
    output: HotelVendor
    side_effects: ["status initialized to ACTIVE"]
  - method: GET
    path: "/hotel-vendors"
    description: "List vendors"
    roles: [PlatformAdmin, SourcingManager, CrewOps, FinanceAnalyst, CrewAuditor, HotelVendorRep]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: HotelVendor[]
    side_effects: []
  - method: GET
    path: "/hotel-vendors/{id}"
    description: "Get one vendor"
    roles: [PlatformAdmin, SourcingManager, CrewOps, FinanceAnalyst, CrewAuditor, HotelVendorRep]
    code: 200
    input: []
    output: HotelVendor
    side_effects: []
  # --- RFP cycles ---
  - method: POST
    path: "/rfp-cycles"
    description: "Create an RFP cycle (DRAFT)"
    roles: [SourcingManager]
    code: 201
    input: [station_id, title, response_deadline, target_room_count, budget_cap_cents]
    output: RfpCycle
    side_effects: []
  - method: GET
    path: "/rfp-cycles"
    description: "List RFP cycles"
    roles: [PlatformAdmin, SourcingManager, CrewOps, FinanceAnalyst, HotelVendorRep]
    code: 200
    input: ["station_id?", "status?", "limit?", "offset?"]
    output: RfpCycle[]
    side_effects: []
  - method: GET
    path: "/rfp-cycles/{id}"
    description: "Get one cycle"
    roles: [PlatformAdmin, SourcingManager, CrewOps, FinanceAnalyst, HotelVendorRep]
    code: 200
    input: []
    output: RfpCycle
    side_effects: []
  - method: POST
    path: "/rfp-cycles/{id}/open"
    description: "DRAFT -> OPEN"
    roles: [SourcingManager]
    code: 200
    input: []
    output: RfpCycle
    side_effects: ["increments RfpCycle.version by 1"]
  - method: POST
    path: "/rfp-cycles/{id}/close"
    description: "OPEN -> EVALUATION; cascades proposals SUBMITTED -> UNDER_REVIEW"
    roles: [SourcingManager]
    code: 200
    input: []
    output: RfpCycle
    side_effects: ["proposals SUBMITTED -> UNDER_REVIEW", "increments RfpCycle.version by 1"]
  - method: POST
    path: "/rfp-cycles/{id}/open-negotiation"
    description: "EVALUATION -> NEGOTIATION (round++) or NEGOTIATION -> EVALUATION (return)"
    roles: [SourcingManager]
    code: 200
    input: []
    output: RfpCycle
    side_effects: ["negotiation_round increments on the EVALUATION->NEGOTIATION direction", "increments RfpCycle.version by 1"]
  - method: POST
    path: "/rfp-cycles/{id}/award"
    description: "NEGOTIATION -> AWARDED; creates DRAFT Contract; OCC on cycle version"
    roles: [SourcingManager]
    code: 201
    input: [proposal_id, room_block_size, start_date, end_date, late_cancel_hours, quiet_room_standard, security_requirements, blackout_dates, blackout_protection, expected_cycle_version]
    output: Contract
    side_effects:
      - "creates Contract in DRAFT with negotiated_rate_cents = proposal.current_rate_cents"
      - "awarded proposal SHORTLISTED -> ACCEPTED; all other non-terminal proposals -> REJECTED"
      - "increments RfpCycle.version by 1"
  - method: POST
    path: "/rfp-cycles/{id}/cancel"
    description: "-> CANCELLED from any non-terminal state"
    roles: [SourcingManager]
    code: 200
    input: []
    output: RfpCycle
    side_effects: ["non-terminal proposals -> REJECTED", "increments RfpCycle.version by 1"]
  # --- proposals ---
  - method: POST
    path: "/rfp-cycles/{id}/proposals"
    description: "Vendor submits a proposal to an OPEN cycle"
    roles: [HotelVendorRep]
    code: 201
    input: [vendor_id, offered_room_count, offered_rate_cents, quiet_room_commitment, "blackout_dates?"]
    output: RfpProposal
    side_effects: ["current_rate_cents = offered_rate_cents"]
  - method: GET
    path: "/rfp-proposals"
    description: "List proposals (filtered list supports FK reverse lookup)"
    roles: [PlatformAdmin, SourcingManager, FinanceAnalyst, HotelVendorRep]
    code: 200
    input: ["rfp_cycle_id?", "vendor_id?", "status?", "limit?", "offset?"]
    output: RfpProposal[]
    side_effects: []
  - method: GET
    path: "/rfp-proposals/{id}"
    description: "Get one proposal"
    roles: [PlatformAdmin, SourcingManager, FinanceAnalyst, HotelVendorRep]
    code: 200
    input: []
    output: RfpProposal
    side_effects: []
  - method: POST
    path: "/rfp-proposals/{id}/shortlist"
    description: "UNDER_REVIEW -> SHORTLISTED"
    roles: [SourcingManager]
    code: 200
    input: []
    output: RfpProposal
    side_effects: ["increments RfpProposal.version by 1"]
  - method: POST
    path: "/rfp-proposals/{id}/reject"
    description: "UNDER_REVIEW|SHORTLISTED -> REJECTED"
    roles: [SourcingManager]
    code: 200
    input: []
    output: RfpProposal
    side_effects: ["increments RfpProposal.version by 1"]
  - method: POST
    path: "/rfp-proposals/{id}/withdraw"
    description: "-> WITHDRAWN; only the owning vendor's rep"
    roles: [HotelVendorRep]
    code: 200
    input: []
    output: RfpProposal
    side_effects: ["increments RfpProposal.version by 1"]
  - method: POST
    path: "/rfp-proposals/{id}/counter-offer"
    description: "Rewrite current_rate_cents during NEGOTIATION"
    roles: [SourcingManager]
    code: 200
    input: [new_rate_cents]
    output: RfpProposal
    side_effects: ["current_rate_cents = new_rate_cents", "increments RfpProposal.version by 1"]
  # --- contracts ---
  - method: GET
    path: "/contracts"
    description: "List contracts"
    roles: [PlatformAdmin, SourcingManager, CrewOps, FinanceAnalyst, CrewAuditor, HotelVendorRep]
    code: 200
    input: ["station_id?", "vendor_id?", "status?", "rfp_cycle_id?", "proposal_id?", "limit?", "offset?"]
    output: Contract[]
    side_effects: []
  - method: GET
    path: "/contracts/{id}"
    description: "Get one contract"
    roles: [PlatformAdmin, SourcingManager, CrewOps, FinanceAnalyst, CrewAuditor, HotelVendorRep]
    code: 200
    input: []
    output: Contract
    side_effects: ["lazy-settle to EXPIRED if past end_date"]
  - method: POST
    path: "/contracts/{id}/activate"
    description: "DRAFT -> ACTIVE with union compliance gate"
    roles: [SourcingManager]
    code: 200
    input: []
    output: Contract
    side_effects: ["increments Contract.version by 1"]
  - method: POST
    path: "/contracts/{id}/remediate"
    description: "SUSPENDED -> ACTIVE when no open CRITICAL audit remains"
    roles: [SourcingManager]
    code: 200
    input: []
    output: Contract
    side_effects: ["clears remediation_deadline", "increments Contract.version by 1"]
  - method: POST
    path: "/contracts/{id}/terminate"
    description: "ACTIVE (three-strike) or SUSPENDED -> TERMINATED"
    roles: [SourcingManager]
    code: 200
    input: []
    output: Contract
    side_effects: ["cancels non-terminal allocations, surges their layovers, suspends vendor", "increments Contract.version by 1"]
  # --- layover requirements ---
  - method: POST
    path: "/layover-requirements"
    description: "Create a crew layover requirement; computes rest_compliant"
    roles: [CrewOps]
    code: 201
    input: [station_id, crew_type, crew_count, arrival_time, departure_time, required_rest_hours, "is_irregular_ops?"]
    output: CrewLayoverRequirement
    side_effects: ["runs rest_compliance calculation"]
  - method: GET
    path: "/layover-requirements"
    description: "List layover requirements"
    roles: [PlatformAdmin, SourcingManager, CrewOps, FinanceAnalyst, CrewAuditor]
    code: 200
    input: ["station_id?", "status?", "crew_type?", "limit?", "offset?"]
    output: CrewLayoverRequirement[]
    side_effects: []
  - method: GET
    path: "/layover-requirements/{id}"
    description: "Get one layover requirement"
    roles: [PlatformAdmin, SourcingManager, CrewOps, FinanceAnalyst, CrewAuditor]
    code: 200
    input: []
    output: CrewLayoverRequirement
    side_effects: []
  - method: POST
    path: "/layover-requirements/{id}/book"
    description: "PLANNED -> CONFIRMED; creates CONTRACTED allocation; OCC on layover version"
    roles: [CrewOps]
    code: 201
    input: [contract_id, stay_date, "blackout_rate_cents?", expected_layover_version]
    output: RoomAllocation
    side_effects: ["creates RoomAllocation CONTRACTED/HELD", "increments CrewLayoverRequirement.version by 1"]
  - method: POST
    path: "/layover-requirements/{id}/distressed-book"
    description: "SURGED -> CONFIRMED; creates DISTRESSED allocation"
    roles: [CrewOps]
    code: 201
    input: [vendor_id, rate_cents]
    output: RoomAllocation
    side_effects: ["creates RoomAllocation DISTRESSED/HELD", "increments CrewLayoverRequirement.version by 1"]
  - method: POST
    path: "/layover-requirements/{id}/cancel"
    description: "-> CANCELLED from PLANNED/CONFIRMED/SURGED"
    roles: [CrewOps]
    code: 200
    input: []
    output: CrewLayoverRequirement
    side_effects: ["cancels HELD/CONFIRMED allocation (late-cancel flag per contract.late_cancel_hours)", "cancels SCHEDULED trips", "increments CrewLayoverRequirement.version by 1"]
  - method: POST
    path: "/layover-requirements/{id}/transport-trips"
    description: "Schedule a ground transport trip; computes pickup_time"
    roles: [CrewOps]
    code: 201
    input: [direction, vehicle_capacity]
    output: TransportTrip
    side_effects: ["runs pickup_timing calculation; contract_id copied from the layover's CONFIRMED CONTRACTED allocation"]
  # --- allocations ---
  - method: GET
    path: "/allocations"
    description: "List allocations (FK reverse lookup for layover/contract/vendor)"
    roles: [PlatformAdmin, SourcingManager, CrewOps, FinanceAnalyst, CrewAuditor, HotelVendorRep]
    code: 200
    input: ["layover_requirement_id?", "contract_id?", "vendor_id?", "status?", "kind?", "stay_date?", "limit?", "offset?"]
    output: RoomAllocation[]
    side_effects: []
  - method: GET
    path: "/allocations/{id}"
    description: "Get one allocation"
    roles: [PlatformAdmin, SourcingManager, CrewOps, FinanceAnalyst, CrewAuditor, HotelVendorRep]
    code: 200
    input: []
    output: RoomAllocation
    side_effects: []
  - method: POST
    path: "/allocations/{id}/confirm"
    description: "HELD -> CONFIRMED; computes distressed_cost_cents for DISTRESSED"
    roles: [CrewOps]
    code: 200
    input: []
    output: RoomAllocation
    side_effects: ["runs distressed_cost when kind == DISTRESSED", "increments RoomAllocation.version by 1"]
  - method: POST
    path: "/allocations/{id}/check-in"
    description: "CONFIRMED -> CHECKED_IN; cascades layover -> COMPLETED"
    roles: [HotelVendorRep]
    code: 200
    input: []
    output: RoomAllocation
    side_effects: ["layover CONFIRMED -> COMPLETED", "increments RoomAllocation.version by 1"]
  - method: POST
    path: "/allocations/{id}/no-show"
    description: "CONFIRMED -> NO_SHOW after the stay date"
    roles: [CrewOps]
    code: 200
    input: []
    output: RoomAllocation
    side_effects: ["increments RoomAllocation.version by 1"]
  - method: POST
    path: "/allocations/{id}/release"
    description: "HELD -> RELEASED; cascades layover CONFIRMED -> SURGED"
    roles: [CrewOps]
    code: 200
    input: []
    output: RoomAllocation
    side_effects: ["layover CONFIRMED -> SURGED", "increments RoomAllocation.version by 1"]
  # --- transport trips ---
  - method: GET
    path: "/transport-trips"
    description: "List trips (FK reverse lookup)"
    roles: [PlatformAdmin, SourcingManager, CrewOps, CrewAuditor]
    code: 200
    input: ["layover_requirement_id?", "contract_id?", "status?", "direction?", "limit?", "offset?"]
    output: TransportTrip[]
    side_effects: []
  - method: GET
    path: "/transport-trips/{id}"
    description: "Get one trip"
    roles: [PlatformAdmin, SourcingManager, CrewOps, CrewAuditor]
    code: 200
    input: []
    output: TransportTrip
    side_effects: ["lazy-settle to MISSED if past pickup_time"]
  - method: POST
    path: "/transport-trips/{id}/dispatch"
    description: "SCHEDULED -> DISPATCHED"
    roles: [CrewOps]
    code: 200
    input: []
    output: TransportTrip
    side_effects: ["increments TransportTrip.version by 1"]
  - method: POST
    path: "/transport-trips/{id}/complete"
    description: "DISPATCHED -> COMPLETED"
    roles: [CrewOps]
    code: 200
    input: []
    output: TransportTrip
    side_effects: ["increments TransportTrip.version by 1"]
  # --- feedback ---
  - method: POST
    path: "/crew-feedback"
    description: "Crew files feedback on a contract after a layover"
    roles: [CrewOps]
    code: 201
    input: [contract_id, layover_requirement_id, crew_type, rating, category, "comment?"]
    output: CrewFeedback
    side_effects: []
  - method: GET
    path: "/crew-feedback"
    description: "List feedback (FK reverse lookup)"
    roles: [PlatformAdmin, SourcingManager, CrewOps, CrewAuditor]
    code: 200
    input: ["contract_id?", "layover_requirement_id?", "rating?", "limit?", "offset?"]
    output: CrewFeedback[]
    side_effects: []
  - method: GET
    path: "/crew-feedback/{id}"
    description: "Get one feedback row"
    roles: [PlatformAdmin, SourcingManager, CrewOps, CrewAuditor]
    code: 200
    input: []
    output: CrewFeedback
    side_effects: []
  # --- audits ---
  - method: POST
    path: "/audits"
    description: "Open an audit; severity CRITICAL suspends the contract"
    roles: [CrewAuditor]
    code: 201
    input: [contract_id, auditor_id, severity, findings]
    output: Audit
    side_effects: ["if severity == CRITICAL and contract ACTIVE: contract -> SUSPENDED with full suspension cascade"]
  - method: GET
    path: "/audits"
    description: "List audits (FK reverse lookup)"
    roles: [PlatformAdmin, SourcingManager, CrewAuditor]
    code: 200
    input: ["contract_id?", "status?", "severity?", "limit?", "offset?"]
    output: Audit[]
    side_effects: []
  - method: GET
    path: "/audits/{id}"
    description: "Get one audit"
    roles: [PlatformAdmin, SourcingManager, CrewAuditor]
    code: 200
    input: []
    output: Audit
    side_effects: []
  - method: POST
    path: "/audits/{id}/start"
    description: "OPEN -> IN_PROGRESS"
    roles: [CrewAuditor]
    code: 200
    input: []
    output: Audit
    side_effects: ["increments Audit.version by 1"]
  - method: POST
    path: "/audits/{id}/close"
    description: "IN_PROGRESS -> CLOSED_PASS | CLOSED_FAIL; FAIL terminates the contract"
    roles: [CrewAuditor]
    code: 200
    input: [outcome]
    output: Audit
    side_effects: ["outcome FAIL: contract -> TERMINATED with termination cascade", "increments Audit.version by 1"]
  # --- invoices ---
  - method: POST
    path: "/invoices"
    description: "Vendor submits an invoice against a contract"
    roles: [HotelVendorRep]
    code: 201
    input: [contract_id, billing_period_start, billing_period_end, billed_room_nights, billed_amount_cents]
    output: Invoice
    side_effects: []
  - method: GET
    path: "/invoices"
    description: "List invoices (FK reverse lookup)"
    roles: [PlatformAdmin, SourcingManager, FinanceAnalyst, HotelVendorRep]
    code: 200
    input: ["contract_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: GET
    path: "/invoices/{id}"
    description: "Get one invoice"
    roles: [PlatformAdmin, SourcingManager, FinanceAnalyst, HotelVendorRep]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: POST
    path: "/invoices/{id}/reconcile"
    description: "RECEIVED -> RECONCILED; runs invoice_reconciliation + invoice_variance"
    roles: [FinanceAnalyst]
    code: 200
    input: []
    output: Invoice
    side_effects: ["sets reconciled_room_nights, reconciled_amount_cents, variance_pct", "increments Invoice.version by 1"]
  - method: POST
    path: "/invoices/{id}/approve"
    description: "RECONCILED -> APPROVED; fiscal variance gate"
    roles: [FinanceAnalyst]
    code: 200
    input: []
    output: Invoice
    side_effects: ["increments Invoice.version by 1"]
  - method: POST
    path: "/invoices/{id}/dispute"
    description: "RECONCILED|APPROVED -> DISPUTED"
    roles: [FinanceAnalyst]
    code: 200
    input: []
    output: Invoice
    side_effects: ["increments Invoice.version by 1"]
  - method: POST
    path: "/invoices/{id}/re-reconcile"
    description: "DISPUTED -> RECONCILED; re-runs reconciliation"
    roles: [FinanceAnalyst]
    code: 200
    input: []
    output: Invoice
    side_effects: ["recomputes reconciled fields and variance", "increments Invoice.version by 1"]
  - method: POST
    path: "/invoices/{id}/mark-paid"
    description: "APPROVED -> PAID"
    roles: [FinanceAnalyst]
    code: 200
    input: []
    output: Invoice
    side_effects: ["increments Invoice.version by 1"]
  - method: POST
    path: "/invoices/{id}/reject"
    description: "RECEIVED -> REJECTED"
    roles: [FinanceAnalyst]
    code: 200
    input: []
    output: Invoice
    side_effects: ["increments Invoice.version by 1"]
# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role header missing or not a declared role"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "authenticated role not permitted for this endpoint, or entity-backed ownership check fails (e.g. HotelVendorRep withdrawing another vendor's proposal)"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "path or body id does not resolve to an existing entity"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, invalid enum value, or disordered datetime range"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "requested transition does not exist from the resource's current state"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version (OCC)"
  - id: ERR_DEADLINE_PASSED
    http: 422
    condition: "proposal submitted after the cycle's response_deadline"
  - id: ERR_NOT_NEGOTIABLE
    http: 409
    condition: "counter-offer on a proposal not SHORTLISTED or cycle not in NEGOTIATION"
  - id: ERR_REST_VIOLATION
    http: 422
    condition: "book attempted while layover.rest_compliant is false"
  - id: ERR_BLACKOUT_DATE
    http: 422
    condition: "stay_date falls on a contract blackout date without blackout_protection"
  - id: ERR_ROOM_BLOCK_EXHAUSTED
    http: 422
    condition: "contract already has room_block_size CONFIRMED allocations on the stay_date"
  - id: ERR_LAYOVER_ALREADY_BOOKED
    http: 409
    condition: "layover already has a HELD or CONFIRMED allocation"
  - id: ERR_PICKUP_CONFLICT
    http: 409
    condition: "computed pickup_time collides with an existing non-CANCELLED trip of the same layover and direction"
  - id: ERR_VENDOR_INACTIVE
    http: 422
    condition: "vendor referenced by the operation is SUSPENDED or BLACKLISTED"
  - id: ERR_UNION_STANDARD_VIOLATION
    http: 422
    condition: "contract fails union quiet-room, blackout-protection, or room-standard ladder requirements"
  - id: ERR_TERMINATION_THRESHOLD
    http: 422
    condition: "terminate from ACTIVE without >= 3 low-rated (<= 2) feedback rows"
  - id: ERR_BUDGET_EXCEEDED
    http: 422
    condition: "award contract value exceeds the cycle budget_cap_cents"
  - id: ERR_INVOICE_VARIANCE_EXCEEDED
    http: 422
    condition: "invoice variance_pct exceeds the union max_invoice_variance_pct"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "airline platform administrator; owns reference data and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /stations"
      - "POST /union-agreements"
      - "POST /hotel-vendors"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET list/detail endpoints"
  - name: SourcingManager
    description: "airline hotel sourcing lead; runs RFP cycles, negotiates, awards, manages contracts"
    identity: "opaque"
    exclusive_operations:
      - "POST /rfp-cycles"
      - "POST /rfp-cycles/{id}/open"
      - "POST /rfp-cycles/{id}/close"
      - "POST /rfp-cycles/{id}/open-negotiation"
      - "POST /rfp-cycles/{id}/award"
      - "POST /rfp-cycles/{id}/cancel"
      - "POST /rfp-proposals/{id}/shortlist"
      - "POST /rfp-proposals/{id}/reject"
      - "POST /rfp-proposals/{id}/counter-offer"
      - "POST /contracts/{id}/activate"
      - "POST /contracts/{id}/remediate"
      - "POST /contracts/{id}/terminate"
    shared_operations:
      - "GET endpoints for stations, vendors, cycles, proposals, contracts, layovers, allocations, trips, feedback, audits"
  - name: CrewOps
    description: "airline crew operations desk; owns layover requirements, bookings, transport"
    identity: "opaque"
    exclusive_operations:
      - "POST /layover-requirements"
      - "POST /layover-requirements/{id}/book"
      - "POST /layover-requirements/{id}/distressed-book"
      - "POST /layover-requirements/{id}/cancel"
      - "POST /layover-requirements/{id}/transport-trips"
      - "POST /allocations/{id}/confirm"
      - "POST /allocations/{id}/no-show"
      - "POST /allocations/{id}/release"
      - "POST /transport-trips/{id}/dispatch"
      - "POST /transport-trips/{id}/complete"
      - "POST /crew-feedback"
    shared_operations:
      - "GET endpoints for stations, vendors, contracts, layovers, allocations, trips, feedback"
  - name: FinanceAnalyst
    description: "airline finance; reconciles and settles invoices"
    identity: "opaque"
    exclusive_operations:
      - "POST /invoices/{id}/reconcile"
      - "POST /invoices/{id}/approve"
      - "POST /invoices/{id}/dispute"
      - "POST /invoices/{id}/re-reconcile"
      - "POST /invoices/{id}/mark-paid"
