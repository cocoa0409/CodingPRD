          assert:
            - "rs1 == IN_REVIEW and rr1 == 1"
            - "rs2 == DRAFT (reject cycle leg)"
            - "rs3 == IN_REVIEW and rr3 == 2 (round accumulates across the cycle)"
            - "rs4 == APPROVED"
            - "rel1 == RELEASED and rs5 == APPROVED"
            - "rel2 == WITHDRAWN and rs6 == APPROVED (release dimension moves; review dimension untouched)"

  # ===================================================================
  # Rule 4 — transitive_cascade (2 instances, different triggers)
  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cascade_lab_validation_depth4
        grounds:
          - state_machines.LabAnalysis.SUBMITTED_to_VALIDATED
