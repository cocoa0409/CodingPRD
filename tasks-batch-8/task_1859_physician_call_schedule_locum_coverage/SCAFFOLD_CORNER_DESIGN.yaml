              captures: { prog_v: $.data.version }
            - call: "GET /api/call-assignments?program_id=${prog_id}"
              as: SchedulerAdmin
              captures: { a_id: $.data.0.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T08:00:00Z" }
              as: SchedulerAdmin
            - call: "POST /api/call-assignments/${a_id}/mark-served"
              as: SchedulerAdmin
          trigger:
            - call: "POST /api/call-programs/${prog_id}/regenerate"
              payload: { expected_call_program_version: "${prog_v}" }
              as: SchedulerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "generation auto-assigned the slot to P1 (captured ${a_id} exists with origin GENERATED)"
            - "regenerate rejected with ERR_REGENERATE_HAS_PROGRESS (captured ${err}) despite the fresh OCC version — progress check is a state precondition, not a version check"

