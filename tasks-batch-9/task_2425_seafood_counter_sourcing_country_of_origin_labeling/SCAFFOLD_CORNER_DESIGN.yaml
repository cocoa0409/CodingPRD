              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${cod_id}", lot_code: "COD-0801-A", harvest_method: "WILD_LONGLINE", production_method: "WILD", origin_country_code: "US", previously_frozen: false, fresh_claim: true, received_weight_kg: 10.000, unit_cost_cents_per_kg: 1700, retail_price_cents_per_kg: 2450, cooked_retail_price_cents_per_kg: 2600 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /seafood-ops/lots/${lot_id}/case"
              payload: { case_slot: 1 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T14:00:00Z" }
              as: ChainAdmin
          trigger:
            - call: "POST /seafood-ops/ice-bed-readings"
              payload: { counter_id: "${counter_id}", case_slot: 3, reading_at: "2026-08-01T13:00:00Z", temperature_c: 4.9, taken_by_user_id: "assoc-7" }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "GET /seafood-ops/counters/${counter_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
              captures: { posture_after_one: $.data.posture, count_after_one: $.data.open_excursion_count }
            - call: "POST /seafood-ops/ice-bed-readings"
              payload: { counter_id: "${counter_id}", case_slot: 4, reading_at: "2026-08-01T13:30:00Z", temperature_c: 5.2, taken_by_user_id: "assoc-7" }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "GET /seafood-ops/counters/${counter_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
              captures: { posture_after_two: $.data.posture, count_after_two: $.data.open_excursion_count }
            - call: "POST /seafood-ops/verification-samples"
              payload: { lot_id: "${lot_id}", sampled_weight_g: 150 }
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
              captures: { e_suspended: $.data.error_id }
            - call: "GET /seafood-ops/excursions"
              payload: { counter_id: "${counter_id}", case_slot: 3 }
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
              captures: { exc_three: "$.data[0].id" }
            - call: "POST /seafood-ops/excursions/${exc_three}/resolve"
              payload: { resolution: "RELEASE", note: "empty slot, probe corrected" }
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
            - call: "POST /seafood-ops/verification-samples"
              payload: { lot_id: "${lot_id}", sampled_weight_g: 150 }
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
              captures: { sample_id: $.data.id }
          assert:
            - "${count_after_one} == 1 and ${posture_after_one} == RESTRICTED"
            - "${count_after_two} == 2 and ${posture_after_two} == SUSPENDED"
            - "trigger call 5 returns HTTP 409 with ${e_suspended} == ERR_COUNTER_SUSPENDED"
            - "no VerificationSample exists after trigger call 5 and SupplierLot.${lot_id}.label_status == UNVERIFIED"
            - "trigger call 7 returns HTTP 200 with ColdChainExcursion.${exc_three}.status == RESOLVED_RELEASED"
            - "Counter.${counter_id}.open_excursion_count == 1 and Counter.${counter_id}.posture == RESTRICTED"
            - "trigger call 8 returns HTTP 201 with VerificationSample.${sample_id}.status == DRAFT and SupplierLot.${lot_id}.label_status == SAMPLED"
            - "SupplierLot.${lot_id}.intake_status == CASED throughout (both excursions were on empty slots)"

      - name: stale_expected_version_rejected_on_both_occ_write_endpoints
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules
          - validations[priority=20]
          - validations[priority=21]
          - errors.ERR_STALE_LOT_VERSION
          - errors.ERR_STALE_COUNTER_VERSION
        distinguishing_aspect: |
          Both declared OCC guards must be honoured on their own write endpoint and against
          their own parent's version counter: a lot version captured before a sales posting is
          stale for the case-label write, and a counter version consumed by one verification
          cycle close is stale for the next -- and each answers 412 with its own error id.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z"
            - "Atlantic Cod SupplierLot of 10.000 kg cased into slot 1"
            - "the lot version captured BEFORE any further write"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
            - call: "POST /seafood-ops/counters"
              payload: { store_number: "4120", department_name: "Seafood Service Counter", case_slot_count: 6 }
              as: ChainAdmin
              captures: { counter_id: $.data.id }
            - call: "POST /seafood-ops/suppliers"
              payload: { name: "Gulf Bay Dealers", permit_number: "PERMIT-8801" }
              as: ChainAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /seafood-ops/species"
              payload: { market_name: "Atlantic Cod", scientific_name: "Gadus morhua", acceptable_market_names: ["Atlantic Cod", "Cod"], simp_covered: false, high_risk_substitution: false, sustainability_program_eligible: true }
              as: ChainAdmin
              captures: { cod_id: $.data.id }
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${cod_id}", lot_code: "COD-0801-A", harvest_method: "WILD_LONGLINE", production_method: "WILD", origin_country_code: "US", previously_frozen: false, fresh_claim: true, received_weight_kg: 10.000, unit_cost_cents_per_kg: 1700, retail_price_cents_per_kg: 2450, cooked_retail_price_cents_per_kg: 2600 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /seafood-ops/lots/${lot_id}/case"
              payload: { case_slot: 1 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "GET /seafood-ops/lots/${lot_id}"
              payload: {}
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_v_old: $.data.version }
            - call: "GET /seafood-ops/counters/${counter_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
              captures: { counter_v_old: $.data.version }
          trigger:
            - call: "POST /seafood-ops/lots/${lot_id}/record-sales"
              payload: { sold_weight_kg: 1.000 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "POST /seafood-ops/case-labels"
              payload: { lot_id: "${lot_id}", expected_lot_version: "${lot_v_old}" }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { e_lot_version: $.data.error_id }
            - call: "GET /seafood-ops/lots/${lot_id}"
              payload: {}
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_v_new: $.data.version }
            - call: "POST /seafood-ops/case-labels"
              payload: { lot_id: "${lot_id}", expected_lot_version: "${lot_v_new}" }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { label_id: $.data.id }
            - call: "POST /seafood-ops/counters/${counter_id}/close-verification-cycle"
              payload: { expected_counter_version: "${counter_v_old}" }
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
              captures: { cycle_first: $.data.verification_cycle_index }
            - call: "POST /seafood-ops/counters/${counter_id}/close-verification-cycle"
              payload: { expected_counter_version: "${counter_v_old}" }
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
              captures: { e_counter_version: $.data.error_id }
            - call: "GET /seafood-ops/counters/${counter_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
              captures: { counter_v_new: $.data.version }
            - call: "POST /seafood-ops/counters/${counter_id}/close-verification-cycle"
              payload: { expected_counter_version: "${counter_v_new}" }
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
              captures: { cycle_second: $.data.verification_cycle_index }
          assert:
            - "trigger call 2 returns HTTP 412 with ${e_lot_version} == ERR_STALE_LOT_VERSION"
            - "no CaseLabel row was created by trigger call 2"
            - "${lot_v_new} > ${lot_v_old} (record-sales incremented the lot version)"
            - "trigger call 4 returns HTTP 201 with CaseLabel.${label_id}.status == PUBLISHED"
            - "trigger call 5 returns HTTP 200 with ${cycle_first} == 1"
            - "trigger call 6 returns HTTP 412 with ${e_counter_version} == ERR_STALE_COUNTER_VERSION (the version was consumed by the first close)"
            - "Counter.${counter_id}.verification_cycle_index == 1 after the refused replay"
            - "${counter_v_new} > ${counter_v_old} and trigger call 8 returns HTTP 200 with ${cycle_second} == 2"

      - name: mismatch_cascade_runs_end_to_end_across_five_entities
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.VerificationSample.IN_LAB_to_MISMATCH
        excluded_because:
          difficulty_instance: transitive_cascade / mismatch_cascade_depth_five_lot_label_shrink_chargeback_supplier
          rationale: "The named §1.8 instance walks the full depth-five cascade in one call and asserts every link, including the supplier ledger and the violation."

      - name: both_shrink_variants_are_asserted_on_one_event
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.shrink_valuation.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / shrink_dual_variant_provisional_vs_final_diverge
          rationale: "The named §1.8 instance asserts the provisional and final variant outputs and the recovery credit that explains their delta."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: posture_is_recomputed_immediately_on_cure_and_expunge
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.counter_posture_derivation
          - state_machines.ComplianceViolation.OPEN_to_CURED
          - state_machines.ComplianceViolation.CURED_to_EXPUNGED
        distinguishing_aspect: |
          There is no batch or deferred recomputation: the same response that cures a violation
          must already show the halved point total (ceil(6/2) == 3) and the posture that follows
          from it, and the expunge response must show 0 points. A read-after-write on the
          counter can never disagree with the mutation response.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z"
            - "Atlantic Cod SupplierLot cased into slot 1"
            - "one MISMATCH VerificationSample, so a SPECIES_SUBSTITUTION violation worth 6 points exists and the counter is RESTRICTED"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
            - call: "POST /seafood-ops/counters"
              payload: { store_number: "4120", department_name: "Seafood Service Counter", case_slot_count: 6 }
              as: ChainAdmin
              captures: { counter_id: $.data.id }
            - call: "POST /seafood-ops/suppliers"
              payload: { name: "Gulf Bay Dealers", permit_number: "PERMIT-8801" }
              as: ChainAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /seafood-ops/species"
              payload: { market_name: "Atlantic Cod", scientific_name: "Gadus morhua", acceptable_market_names: ["Atlantic Cod", "Cod"], simp_covered: false, high_risk_substitution: false, sustainability_program_eligible: true }
              as: ChainAdmin
              captures: { cod_id: $.data.id }
            - call: "POST /seafood-ops/species"
              payload: { market_name: "Pacific Cod", scientific_name: "Gadus macrocephalus", acceptable_market_names: ["Pacific Cod", "True Cod"], simp_covered: false, high_risk_substitution: false, sustainability_program_eligible: false }
              as: ChainAdmin
              captures: { pacific_id: $.data.id }
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${cod_id}", lot_code: "COD-0801-A", harvest_method: "WILD_LONGLINE", production_method: "WILD", origin_country_code: "US", previously_frozen: false, fresh_claim: true, received_weight_kg: 10.000, unit_cost_cents_per_kg: 1700, retail_price_cents_per_kg: 2450, cooked_retail_price_cents_per_kg: 2600 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /seafood-ops/lots/${lot_id}/case"
              payload: { case_slot: 1 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "POST /seafood-ops/verification-samples"
              payload: { lot_id: "${lot_id}", sampled_weight_g: 150 }
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
              captures: { sample_id: $.data.id }
            - call: "POST /seafood-ops/verification-samples/${sample_id}/send-to-lab"
              payload: { lab_reference: "LAB-2026-0801-4" }
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
            - call: "POST /seafood-ops/verification-samples/${sample_id}/result"
              payload: { observed_species_id: "${pacific_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
            - call: "GET /seafood-ops/violations"
              payload: { counter_id: "${counter_id}", category: "SPECIES_SUBSTITUTION" }
              as: ComplianceOfficer
              as_user_id: "officer-read-9"
              captures: { viol_id: "$.data[0].id", viol_points: "$.data[0].points" }
            - call: "GET /seafood-ops/counters/${counter_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-read-9"
              captures: { points_before: $.data.violation_points, posture_before: $.data.posture }
          trigger:
            - call: "POST /seafood-ops/violations/${viol_id}/cure"
              payload: { cure_note: "counter staff retrained and the case reset" }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "GET /seafood-ops/counters/${counter_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-read-9"
              captures: { points_after_cure: $.data.violation_points, posture_after_cure: $.data.posture }
            - call: "POST /seafood-ops/violations/${viol_id}/expunge"
              payload: { expunge_note: "lab retest cleared the species identification" }
              as: ComplianceOfficer
              as_user_id: "officer-read-9"
            - call: "GET /seafood-ops/counters/${counter_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-read-9"
              captures: { points_after_expunge: $.data.violation_points, posture_after_expunge: $.data.posture }
          assert:
            - "${viol_points} == 6 and ${points_before} == 6 and ${posture_before} == RESTRICTED"
            - "trigger call 1 returns HTTP 200 with ComplianceViolation.${viol_id}.status == CURED and cured_at == 2026-08-01T08:00:00Z"
            - "${points_after_cure} == 3 and ${posture_after_cure} == OPEN"
            - "the mutation response of trigger call 1 already reflects the recomputed counter state, so the read in trigger call 2 adds no new information"
            - "trigger call 3 returns HTTP 200 with ComplianceViolation.${viol_id}.status == EXPUNGED"
            - "${points_after_expunge} == 0 and ${posture_after_expunge} == OPEN"
            - "SupplierLot.${lot_id}.chargeback_status == ASSESSED (curing a violation never unwinds the supplier chargeback)"
