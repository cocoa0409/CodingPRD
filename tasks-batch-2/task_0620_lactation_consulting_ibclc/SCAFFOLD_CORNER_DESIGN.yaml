# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Lactation Consulting & Breastfeeding Support (IBCLC) — Expert
# Breadth probe over §1.1–§1.7 surface; §1.8 depth corners are excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_practice_returns_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Practice.fields.aca_preventive_enabled
          - entities.Practice.fields.now_utc
        distinguishing_aspect: "POST /practices with only name returns 201, aca_preventive_enabled defaults true, now_utc defaults 2026-01-01T00:00:00Z, version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /practices"
              payload: { name: "Solo Practice" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
          assert:
            - "response status == 201"
            - "Practice.${prac_id}.aca_preventive_enabled == true"
            - "Practice.${prac_id}.now_utc == 2026-01-01T00:00:00Z"
            - "Practice.${prac_id}.version == 1"

      - name: get_consult_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Consult
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "GET /consults/{id} with a random non-existent UUID returns ERR_RESOURCE_NOT_FOUND (404)."
        test_recipe:
          setup: ["A practice exists; the consult id is a fresh UUID never created."]
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "Solo Practice" }
              as: PracticeAdmin
          trigger:
            - call: "GET /consults/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FrontDesk
          assert:
            - "response status == 404"
            - "data.error_id == ERR_RESOURCE_NOT_FOUND"

      - name: create_consult_missing_required_field_returns_400
        claim_type: Required Fields
        grounds:
          - entities.Consult.fields.pay_method
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /consults omitting required pay_method returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A practice, consultant, and client exist."]
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "Solo Practice" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /consultants"
              payload: { practice_id: "${prac_id}", full_name: "Ana IBCLC", standard_rate_cents: 20000 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /clients"
              payload: { practice_id: "${prac_id}", full_name: "Parent A", infant_dob: "2026-05-01T00:00:00Z", household_income_cents: 9900000 }
              as: FrontDesk
              captures: { client_a_id: $.data.id }
          trigger:
            - call: "POST /consults"
              payload: { practice_id: "${prac_id}", client_id: "${client_a_id}", consultant_id: "${cons_id}", consult_type: "TELEHEALTH", scheduled_start_utc: "2026-06-10T15:00:00Z", scheduled_end_utc: "2026-06-10T16:00:00Z" }
              as: FrontDesk
          assert:
            - "response status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_consult_end_before_start_returns_400
        claim_type: Type Constraints
        grounds:
          - entities.Consult.fields.scheduled_end_utc
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /consults with scheduled_end_utc <= scheduled_start_utc returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A practice, consultant, and client exist."]
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "Solo Practice" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /consultants"
              payload: { practice_id: "${prac_id}", full_name: "Ana IBCLC", standard_rate_cents: 20000 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /clients"
              payload: { practice_id: "${prac_id}", full_name: "Parent A", infant_dob: "2026-05-01T00:00:00Z", household_income_cents: 9900000 }
              as: FrontDesk
              captures: { client_a_id: $.data.id }
          trigger:
            - call: "POST /consults"
              payload: { practice_id: "${prac_id}", client_id: "${client_a_id}", consultant_id: "${cons_id}", consult_type: "TELEHEALTH", scheduled_start_utc: "2026-06-10T16:00:00Z", scheduled_end_utc: "2026-06-10T15:00:00Z", pay_method: "SELF_PAY" }
              as: FrontDesk
          assert:
            - "response status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: service_package_per_visit_value_computed_floor
        claim_type: Computed Fields
        grounds:
          - entities.ServicePackage.fields.per_visit_value_cents
        distinguishing_aspect: "POST /service-packages price 10000 / 3 visits yields per_visit_value_cents == floor(10000/3) == 3333; client-supplied per_visit value (if any) ignored."
        test_recipe:
          setup: ["A practice exists."]
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "Solo Practice" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
          trigger:
            - call: "POST /service-packages"
              payload: { practice_id: "${prac_id}", name: "THREE_VISIT", included_visits: 3, price_cents: 10000 }
              as: PracticeAdmin
              captures: { pkg_id: $.data.id }
          assert:
            - "ServicePackage.${pkg_id}.per_visit_value_cents == 3333"

      - name: weighted_feed_transfer_grams_computed
        claim_type: Computed Fields
        grounds:
          - entities.WeightedFeed.fields.transfer_grams
        distinguishing_aspect: "POST /weighted-feeds pre 4000 / post 4045 computes transfer_grams == 45."
        test_recipe:
          setup: ["An OPEN follow-up plan off a COMPLETED consult."]
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "Solo Practice" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /consultants"
              payload: { practice_id: "${prac_id}", full_name: "Ana IBCLC", standard_rate_cents: 20000 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /clients"
              payload: { practice_id: "${prac_id}", full_name: "Parent A", infant_dob: "2026-05-01T00:00:00Z", household_income_cents: 9900000 }
              as: FrontDesk
              captures: { client_a_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { practice_id: "${prac_id}", to_iso8601: "2026-06-10T15:00:00Z" }
              as: PracticeAdmin
            - call: "POST /consults"
              payload: { practice_id: "${prac_id}", client_id: "${client_a_id}", consultant_id: "${cons_id}", consult_type: "TELEHEALTH", scheduled_start_utc: "2026-06-10T15:00:00Z", scheduled_end_utc: "2026-06-10T16:00:00Z", pay_method: "SELF_PAY" }
              as: FrontDesk
              captures: { consult_a_id: $.data.id }
            - call: "POST /feeding-assessments"
              payload: { consult_id: "${consult_a_id}", latch_score: 8, pre_feed_weight_grams: 4000, post_feed_weight_grams: 4040 }
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /consults/${consult_a_id}/start"
              payload: {}
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /consults/${consult_a_id}/complete"
              payload: {}
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /follow-up-plans"
              payload: { consult_id: "${consult_a_id}", target_daily_transfer_grams: 100 }
              as: Consultant
              as_user_id: "${cons_id}"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /weighted-feeds"
              payload: { follow_up_plan_id: "${plan_id}", pre_feed_weight_grams: 4000, post_feed_weight_grams: 4045 }
              as: Consultant
              as_user_id: "${cons_id}"
              captures: { wf_id: $.data.id }
          assert:
            - "WeightedFeed.${wf_id}.transfer_grams == 45"

      - name: client_system_fields_ignored_on_create
        claim_type: System Fields
        grounds:
          - entities.Client.fields.status
          - entities.Client.fields.no_show_strikes
        distinguishing_aspect: "POST /clients ignores any client-supplied status/no_show_strikes; server stamps status ACTIVE, no_show_strikes 0, reimbursement_ledger_cents 0, version 1."
        test_recipe:
          setup: ["A practice exists."]
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "Solo Practice" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
          trigger:
            - call: "POST /clients"
              payload: { practice_id: "${prac_id}", full_name: "Parent A", infant_dob: "2026-05-01T00:00:00Z", household_income_cents: 9900000 }
              as: FrontDesk
              captures: { client_a_id: $.data.id }
          assert:
            - "Client.${client_a_id}.status == ACTIVE"
            - "Client.${client_a_id}.no_show_strikes == 0"
            - "Client.${client_a_id}.reimbursement_ledger_cents == 0"
            - "Client.${client_a_id}.version == 1"

      - name: create_consult_referenced_client_not_found_returns_404
        claim_type: flat
        grounds:
          - validations[priority=4]
          - errors[ERR_REFERENCED_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "POST /consults with a body client_id that does not exist returns ERR_REFERENCED_RESOURCE_NOT_FOUND (404) — FK reference integrity on a flat-topology body link."
        test_recipe:
          setup: ["A practice and consultant exist; client_id in body is a fresh UUID."]
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "Solo Practice" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /consultants"
              payload: { practice_id: "${prac_id}", full_name: "Ana IBCLC", standard_rate_cents: 20000 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
          trigger:
            - call: "POST /consults"
              payload: { practice_id: "${prac_id}", client_id: "00000000-0000-4000-8000-000000000000", consultant_id: "${cons_id}", consult_type: "TELEHEALTH", scheduled_start_utc: "2026-06-10T15:00:00Z", scheduled_end_utc: "2026-06-10T16:00:00Z", pay_method: "SELF_PAY" }
              as: FrontDesk
          assert:
            - "response status == 404"
            - "data.error_id == ERR_REFERENCED_RESOURCE_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: complete_consult_without_assessment_returns_error
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Consult.IN_PROGRESS_to_COMPLETED
          - errors[ERR_NO_FEEDING_ASSESSMENT]
        distinguishing_aspect: "POST /consults/{id}/complete on an IN_PROGRESS consult with NO feeding assessment fails ERR_NO_FEEDING_ASSESSMENT (409); status stays IN_PROGRESS."
        test_recipe:
          setup: ["An IN_PROGRESS consult with no feeding assessment recorded."]
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "Solo Practice" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /consultants"
              payload: { practice_id: "${prac_id}", full_name: "Ana IBCLC", standard_rate_cents: 20000 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /clients"
              payload: { practice_id: "${prac_id}", full_name: "Parent A", infant_dob: "2026-05-01T00:00:00Z", household_income_cents: 9900000 }
              as: FrontDesk
              captures: { client_a_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { practice_id: "${prac_id}", to_iso8601: "2026-06-10T15:00:00Z" }
              as: PracticeAdmin
            - call: "POST /consults"
              payload: { practice_id: "${prac_id}", client_id: "${client_a_id}", consultant_id: "${cons_id}", consult_type: "TELEHEALTH", scheduled_start_utc: "2026-06-10T15:00:00Z", scheduled_end_utc: "2026-06-10T16:00:00Z", pay_method: "SELF_PAY" }
              as: FrontDesk
              captures: { consult_a_id: $.data.id }
            - call: "POST /consults/${consult_a_id}/start"
              payload: {}
              as: Consultant
              as_user_id: "${cons_id}"
          trigger:
            - call: "POST /consults/${consult_a_id}/complete"
              payload: {}
              as: Consultant
              as_user_id: "${cons_id}"
          assert:
            - "response status == 409"
            - "data.error_id == ERR_NO_FEEDING_ASSESSMENT"

      - name: start_consult_before_start_time_returns_not_startable
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Consult.SCHEDULED_to_IN_PROGRESS
          - errors[ERR_CONSULT_NOT_STARTABLE]
        distinguishing_aspect: "POST /consults/{id}/start when Practice.now_utc (default 2026-01-01) is before scheduled_start_utc returns ERR_CONSULT_NOT_STARTABLE (409)."
        test_recipe:
          setup: ["A SCHEDULED consult at 2026-06-10 with the clock left at its default 2026-01-01."]
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "Solo Practice" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /consultants"
              payload: { practice_id: "${prac_id}", full_name: "Ana IBCLC", standard_rate_cents: 20000 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /clients"
              payload: { practice_id: "${prac_id}", full_name: "Parent A", infant_dob: "2026-05-01T00:00:00Z", household_income_cents: 9900000 }
              as: FrontDesk
              captures: { client_a_id: $.data.id }
            - call: "POST /consults"
              payload: { practice_id: "${prac_id}", client_id: "${client_a_id}", consultant_id: "${cons_id}", consult_type: "TELEHEALTH", scheduled_start_utc: "2026-06-10T15:00:00Z", scheduled_end_utc: "2026-06-10T16:00:00Z", pay_method: "SELF_PAY" }
              as: FrontDesk
              captures: { consult_a_id: $.data.id }
          trigger:
            - call: "POST /consults/${consult_a_id}/start"
              payload: {}
              as: Consultant
              as_user_id: "${cons_id}"
          assert:
            - "response status == 409"
            - "data.error_id == ERR_CONSULT_NOT_STARTABLE"

      - name: complete_consult_from_scheduled_invalid_transition
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Consult.IN_PROGRESS_to_COMPLETED
          - errors[ERR_CONSULT_NOT_IN_PROGRESS]
        distinguishing_aspect: "POST /consults/{id}/complete on a SCHEDULED (never started) consult fails ERR_CONSULT_NOT_IN_PROGRESS (409)."
        test_recipe:
          setup: ["A SCHEDULED consult, never started."]
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "Solo Practice" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /consultants"
              payload: { practice_id: "${prac_id}", full_name: "Ana IBCLC", standard_rate_cents: 20000 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /clients"
              payload: { practice_id: "${prac_id}", full_name: "Parent A", infant_dob: "2026-05-01T00:00:00Z", household_income_cents: 9900000 }
              as: FrontDesk
              captures: { client_a_id: $.data.id }
            - call: "POST /consults"
              payload: { practice_id: "${prac_id}", client_id: "${client_a_id}", consultant_id: "${cons_id}", consult_type: "TELEHEALTH", scheduled_start_utc: "2026-06-10T15:00:00Z", scheduled_end_utc: "2026-06-10T16:00:00Z", pay_method: "SELF_PAY" }
              as: FrontDesk
              captures: { consult_a_id: $.data.id }
          trigger:
            - call: "POST /consults/${consult_a_id}/complete"
              payload: {}
              as: Consultant
              as_user_id: "${cons_id}"
          assert:
            - "response status == 409"
            - "data.error_id == ERR_CONSULT_NOT_IN_PROGRESS"

      - name: cancel_already_cancelled_consult_returns_not_cancellable
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Consult.SCHEDULED_to_CANCELLED
          - errors[ERR_CONSULT_NOT_CANCELLABLE]
        distinguishing_aspect: "Second POST /consults/{id}/cancel on an already CANCELLED (terminal) consult fails ERR_CONSULT_NOT_CANCELLABLE (409); no side effects fire twice."
        test_recipe:
          setup: ["A CANCELLED consult."]
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "Solo Practice" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /consultants"
              payload: { practice_id: "${prac_id}", full_name: "Ana IBCLC", standard_rate_cents: 20000 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /clients"
              payload: { practice_id: "${prac_id}", full_name: "Parent A", infant_dob: "2026-05-01T00:00:00Z", household_income_cents: 9900000 }
              as: FrontDesk
              captures: { client_a_id: $.data.id }
            - call: "POST /consults"
              payload: { practice_id: "${prac_id}", client_id: "${client_a_id}", consultant_id: "${cons_id}", consult_type: "TELEHEALTH", scheduled_start_utc: "2026-06-10T15:00:00Z", scheduled_end_utc: "2026-06-10T16:00:00Z", pay_method: "SELF_PAY" }
              as: FrontDesk
              captures: { consult_a_id: $.data.id }
            - call: "POST /consults/${consult_a_id}/cancel"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /consults/${consult_a_id}/cancel"
              payload: {}
              as: FrontDesk
          assert:
            - "response status == 409"
            - "data.error_id == ERR_CONSULT_NOT_CANCELLABLE"

      - name: adjudicate_superbill_not_submitted_returns_error
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Superbill.SUBMITTED_to_PAID
          - errors[ERR_SUPERBILL_NOT_SUBMITTED]
        distinguishing_aspect: "POST /superbills/{id}/adjudicate on a DRAFT (never submitted) superbill fails ERR_SUPERBILL_NOT_SUBMITTED (409)."
        test_recipe:
          setup: ["A DRAFT superbill on a COMPLETED consult."]
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "Solo Practice" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /consultants"
              payload: { practice_id: "${prac_id}", full_name: "Ana IBCLC", standard_rate_cents: 20000 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /clients"
              payload: { practice_id: "${prac_id}", full_name: "Parent A", infant_dob: "2026-05-01T00:00:00Z", household_income_cents: 9900000 }
              as: FrontDesk
              captures: { client_a_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { practice_id: "${prac_id}", to_iso8601: "2026-06-10T15:00:00Z" }
              as: PracticeAdmin
            - call: "POST /consults"
              payload: { practice_id: "${prac_id}", client_id: "${client_a_id}", consultant_id: "${cons_id}", consult_type: "TELEHEALTH", scheduled_start_utc: "2026-06-10T15:00:00Z", scheduled_end_utc: "2026-06-10T16:00:00Z", pay_method: "SELF_PAY" }
              as: FrontDesk
              captures: { consult_a_id: $.data.id }
            - call: "POST /feeding-assessments"
              payload: { consult_id: "${consult_a_id}", latch_score: 8, pre_feed_weight_grams: 4000, post_feed_weight_grams: 4040 }
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /consults/${consult_a_id}/start"
              payload: {}
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /consults/${consult_a_id}/complete"
              payload: {}
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /superbills"
              payload: { consult_id: "${consult_a_id}", billed_amount_cents: 25000, allowed_amount_cents: 15000, is_aca_preventive: true }
              as: BillingSpecialist
              captures: { sb_id: $.data.id }
          trigger:
            - call: "POST /superbills/${sb_id}/adjudicate"
              payload: { outcome: "PAID" }
              as: BillingSpecialist
          assert:
            - "response status == 409"
            - "data.error_id == ERR_SUPERBILL_NOT_SUBMITTED"

      - name: void_unpaid_superbill_returns_not_voidable
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Superbill.PAID_to_VOID
          - errors[ERR_SUPERBILL_NOT_VOIDABLE]
        distinguishing_aspect: "POST /superbills/{id}/void on a SUBMITTED (not PAID) superbill fails ERR_SUPERBILL_NOT_VOIDABLE (409); OCC version check not reached."
        test_recipe:
          setup: ["A SUBMITTED superbill (not yet adjudicated) on a COMPLETED consult; caller holds the client version."]
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "Solo Practice" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /consultants"
              payload: { practice_id: "${prac_id}", full_name: "Ana IBCLC", standard_rate_cents: 20000 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /clients"
              payload: { practice_id: "${prac_id}", full_name: "Parent A", infant_dob: "2026-05-01T00:00:00Z", household_income_cents: 9900000 }
              as: FrontDesk
              captures: { client_a_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { practice_id: "${prac_id}", to_iso8601: "2026-06-10T15:00:00Z" }
              as: PracticeAdmin
            - call: "POST /consults"
              payload: { practice_id: "${prac_id}", client_id: "${client_a_id}", consultant_id: "${cons_id}", consult_type: "TELEHEALTH", scheduled_start_utc: "2026-06-10T15:00:00Z", scheduled_end_utc: "2026-06-10T16:00:00Z", pay_method: "SELF_PAY" }
              as: FrontDesk
              captures: { consult_a_id: $.data.id }
            - call: "POST /feeding-assessments"
              payload: { consult_id: "${consult_a_id}", latch_score: 8, pre_feed_weight_grams: 4000, post_feed_weight_grams: 4040 }
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /consults/${consult_a_id}/start"
              payload: {}
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /consults/${consult_a_id}/complete"
              payload: {}
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /superbills"
              payload: { consult_id: "${consult_a_id}", billed_amount_cents: 25000, allowed_amount_cents: 15000, is_aca_preventive: true }
              as: BillingSpecialist
              captures: { sb_id: $.data.id }
            - call: "POST /superbills/${sb_id}/submit"
              payload: {}
