    output: ConnectionApplication
    side_effects: ["set applicant_user_id from X-User-ID"]
  - method: GET
    path: "/connection-applications"
    description: List connection applications.
    roles: [Applicant, UtilityReviewer, UtilityAdmin]
    code: 200
    input: ["applicant_user_id?", "parcel_id?", "status?", "limit?", "offset?"]
    output: ConnectionApplication[]
    side_effects: []
  - method: GET
    path: "/connection-applications/{id}"
    description: Fetch one application (includes computed fees and status).
    roles: [Applicant, UtilityReviewer, UtilityAdmin]
    code: 200
    input: []
    output: ConnectionApplication
    side_effects: []
  - method: POST
    path: "/connection-applications/{id}/submit"
    description: Submit a DRAFT/REVISION_REQUESTED application for review.
    roles: [Applicant]
    code: 200
    input: []
    output: ConnectionApplication
    side_effects: ["status -> SUBMITTED"]
  - method: POST
    path: "/connection-applications/{id}/start-review"
    description: Begin review.
    roles: [UtilityReviewer]
    code: 200
    input: []
    output: ConnectionApplication
    side_effects: ["status -> UNDER_REVIEW"]
  - method: POST
    path: "/connection-applications/{id}/request-revision"
    description: Send an application back for revision.
    roles: [UtilityReviewer]
    code: 200
    input: ["reason?"]
    output: ConnectionApplication
    side_effects: ["status -> REVISION_REQUESTED"]
  - method: POST
    path: "/connection-applications/{id}/approve"
    description: Approve; assess capacity/tap/total fees; create backflow requirement if applicable. Enforces SoD vs availability reviewer.
    roles: [UtilityReviewer]
    code: 200
    input: []
    output: ConnectionApplication
    side_effects: ["status -> APPROVED", "set capacity_fee_cents/tap_fee_cents/total_fees_due_cents/backflow_required", "create BackflowAssembly if required"]
  - method: POST
    path: "/connection-applications/{id}/deny"
    description: Deny an application under review.
    roles: [UtilityReviewer]
    code: 200
    input: ["reason?"]
    output: ConnectionApplication
    side_effects: ["status -> DENIED"]
  - method: POST
    path: "/connection-applications/{id}/pay-fees"
    description: Record a payment toward total_fees_due_cents.
    roles: [Applicant]
    code: 200
    input: [amount_cents]
    output: ConnectionApplication
    side_effects: ["fees_paid_cents += amount_cents"]
  - method: POST
    path: "/connection-applications/{id}/activate"
    description: Activate a ready application; creates the ServiceAccount.
    roles: [Applicant]
    code: 200
    input: []
    output: ConnectionApplication
    side_effects: ["status -> ACTIVATED", "create ServiceAccount(ACTIVE)"]
  - method: POST
    path: "/connection-applications/{id}/withdraw"
    description: Withdraw an application before activation.
    roles: [Applicant]
    code: 200
    input: []
    output: ConnectionApplication
    side_effects: ["status -> WITHDRAWN"]

  # ---- Availability ----
  - method: POST
