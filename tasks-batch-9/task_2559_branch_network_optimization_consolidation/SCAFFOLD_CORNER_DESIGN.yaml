          - validations.priority_41_ERR_PROPERTY_DISPOSITION_MISSING
          - state_machines.ConsolidationCase.transitions.NOTICE_FILED_to_CLOSURE_EXECUTED
        distinguishing_aspect: "Execution is guarded by a ladder of checks whose order is observable: with the clock still at 2026-08-01 the notice-period rule at priority 22 fires even though the property disposition is also missing, and only after the clock reaches the effective date does the priority 41 diagnosis surface — then the same call succeeds once the disposition exists."
