            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-03T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /blackout-periods/${b_be}/complete", payload: {}, as: Recordkeeper, captures: { err_be: "$.data.error_id" } }
            - { call: "POST /participants", payload: { termination_case_id: "${c_cf}", full_name: "Too Late", ssn: "121110099", mailing_address: "9 L St", account_balance_cents: 1000, vested_pct: 100 }, as: PlanAdministrator, captures: { err_cf: "$.data.error_id" } }
            - { call: "POST /termination-cases/${c_ndr}/begin-distributions", payload: {}, as: PlanAdministrator, captures: { err_ndr: "$.data.error_id" } }
          assert:
            - "Arm 1: error_id == ERR_BLACKOUT_NOT_ENDED, http 409 (2026-09-03 < end_at 2026-09-05)"
            - "Arm 2: error_id == ERR_CASE_CENSUS_FROZEN, http 409 (case is DISTRIBUTION_IN_PROGRESS)"
            - "Arm 3: error_id == ERR_DISTRIBUTION_NOTICE_REQUIRED, http 422 (no live DISTRIBUTION notice on case C)"
