          setup_api_calls: []
          trigger:
            - call: "POST /cases"
              payload: { case_number: "CASE-V1", agency_affiliate_code: "AFF-01", household_size: 1, scheduled_arrival_date: "2026-08-10" }
              captures: { err: $.data.error_id }
