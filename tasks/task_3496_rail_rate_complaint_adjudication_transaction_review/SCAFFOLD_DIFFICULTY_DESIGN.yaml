# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3496_rail_rate_complaint_adjudication_transaction_review
# 9 rules x 2 instances = 18 instances. Every recipe replays from empty-DB
# against the §1.5 endpoint surface. Clock default 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: alleged_vs_adjudicated_rvc_flips_market_dominance
        grounds:
          - calculations.alleged_rvc_ratio
          - calculations.adjudicated_rvc_ratio
          - state_machines.RateComplaint.FILED_to_EVIDENTIARY_PHASE
        distinguishing_aspect: "Same complaint, same challenged rate: the alleged variant (cost 10000 -> ratio 1.9500) opens jurisdiction while the adjudicated variant (verified cost 11000 -> ratio 1.7727) closes it — the two variants of the same formula over different data sources produce opposite gate outcomes."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Carrier OKTX exists with a 2025 revenue adequacy finding. Complaint filed at challenged 19500 / alleged cost 10000 (alleged ratio 1.9500); market dominance PRESENT; shipper SAC evidence verified at cost 11000 (adjudicated ratio 1.7727)."
          setup_api_calls:
            - call: "POST /stb/carriers"
              payload: { carrier_code: "OKTX", legal_name: "Oklahoma & Texas Railway", carrier_class: "I", base_route_miles: 1000 }
              as: PlatformAdmin
              captures: { c_oktx: $.data.id }
            - call: "POST /stb/carriers/${c_oktx}/revenue-adequacy-findings"
              payload: { fiscal_year: 2025, operating_revenue_cents: 1000000000, operating_expense_cents: 800000000, net_investment_cents: 2000000000 }
              as: BoardAdjudicator
            - call: "POST /stb/rate-complaints"
              payload: { shipper_id: "shp-ada", carrier_id: "${c_oktx}", commodity: "GRAIN", challenged_rate_cents_per_ton: 19500, alleged_variable_cost_cents_per_ton: 10000, annual_tons: 1000, relief_sought_cents: 400000001, contested_fiscal_year: 2025 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { rc1: $.data.id }
            - call: "POST /stb/rate-complaints/${rc1}/determine-market-dominance"
              payload: { product_competition_exists: false, geographic_competition_exists: false }
              as: BoardAdjudicator
            - call: "POST /stb/rate-complaints/${rc1}/evidence"
              payload: { submission_type: "SAC_STUDY", submitted_by_party: "SHIPPER", reference_rate_cents_per_ton: 15000, verified_variable_cost_cents_per_ton: 11000 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { ev1: $.data.id }
            - call: "POST /stb/evidence-submissions/${ev1}/verify"
              payload: { review_outcome: "VERIFIED" }
              as: BoardAdjudicator
          trigger:
            - call: "POST /stb/rate-complaints/${rc1}/decide"
              payload: { outcome: "UPHELD", shipments: [{ shipment_ref: "S-1", tons: 10.000 }] }
              as: BoardAdjudicator
              captures: { err: $.data.error_id }
          assert:
            - "RateComplaint.${rc1}.alleged_rvc_ratio == 1.9500 (alleged variant cleared the 1.8000 threshold)"
            - "RateComplaint.${rc1}.adjudicated_rvc_ratio == 1.7727 (adjudicated variant over verified cost 11000)"
            - "err == ERR_MARKET_DOMINANCE_ABSENT and http status 409"
            - "RateComplaint.${rc1}.status == EVIDENTIARY_PHASE (unchanged by the failed decide)"
      - name: current_year_vs_five_year_roi_finding_divergence
        grounds:
          - calculations.revenue_adequacy_roi
          - entities.Carrier.fields.revenue_adequacy_status
        distinguishing_aspect: "Same carrier, same 2025 filing: the current-year variant yields 1000 bps (< 1140, inadequate) while the five-year-average variant over fiscal 2021-2025 yields 1180 bps (adequate) — the finding and Carrier.revenue_adequacy_status follow only the five-year variant."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Carrier OKTX registered; findings for fiscal 2021-2024 already filed (ROI 1200, 1250, 1300, 1150 bps)."
          setup_api_calls:
            - call: "POST /stb/carriers"
              payload: { carrier_code: "OKTX", legal_name: "Oklahoma & Texas Railway", carrier_class: "I", base_route_miles: 1000 }
              as: PlatformAdmin
              captures: { c_oktx: $.data.id }
            - call: "POST /stb/carriers/${c_oktx}/revenue-adequacy-findings"
              payload: { fiscal_year: 2021, operating_revenue_cents: 620000000, operating_expense_cents: 500000000, net_investment_cents: 1000000000 }
              as: BoardAdjudicator
              captures: { f21: $.data.id }
            - call: "POST /stb/carriers/${c_oktx}/revenue-adequacy-findings"
              payload: { fiscal_year: 2022, operating_revenue_cents: 600000000, operating_expense_cents: 500000000, net_investment_cents: 800000000 }
              as: BoardAdjudicator
            - call: "POST /stb/carriers/${c_oktx}/revenue-adequacy-findings"
              payload: { fiscal_year: 2023, operating_revenue_cents: 565000000, operating_expense_cents: 500000000, net_investment_cents: 500000000 }
              as: BoardAdjudicator
            - call: "POST /stb/carriers/${c_oktx}/revenue-adequacy-findings"
              payload: { fiscal_year: 2024, operating_revenue_cents: 730000000, operating_expense_cents: 500000000, net_investment_cents: 2000000000 }
              as: BoardAdjudicator
          trigger:
            - call: "POST /stb/carriers/${c_oktx}/revenue-adequacy-findings"
              payload: { fiscal_year: 2025, operating_revenue_cents: 1000000000, operating_expense_cents: 800000000, net_investment_cents: 2000000000 }
              as: BoardAdjudicator
              captures: { f25: $.data.id }
          assert:
            - "RevenueAdequacyFinding.${f25}.current_year_roi_bps == 1000"
            - "RevenueAdequacyFinding.${f25}.five_year_avg_roi_bps == 1180"
            - "RevenueAdequacyFinding.${f25}.finding == ADEQUATE (five-year variant governs despite current-year 1000 < 1140)"
            - "RevenueAdequacyFinding.${f21}.five_year_avg_roi_bps == 1200 (single available year averages itself)"
            - "Carrier.${c_oktx}.revenue_adequacy_status == ADEQUATE"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: prescription_floor_switches_with_revenue_adequacy
        grounds:
          - calculations.prescribed_rate_and_relief
          - entities.RevenueAdequacyFinding.fields.finding
        distinguishing_aspect: "Mode (a): identical complaints and evidence (challenged 19500, verified cost 10500, reference rate 11200, 1000 tons) produce prescribed 11200 against an ADEQUATE carrier but 11550 against an INADEQUATE carrier — the nested min/max floor branches on a DIFFERENT entity's computed finding."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Carrier OKTX has findings 2021-2025 (five-year 1180 -> ADEQUATE). Carrier BNRZ has only a 2025 finding (1000 -> INADEQUATE). Identical complaints (challenged 19500, alleged 10000, FULL_SAC, year 2025) against each carrier are in EVIDENTIARY_PHASE with one VERIFIED SAC study each (reference 11200, verified cost 10500; adjudicated ratio 1.8571)."
          setup_api_calls:
            - call: "POST /stb/carriers"
              payload: { carrier_code: "OKTX", legal_name: "Oklahoma & Texas Railway", carrier_class: "I", base_route_miles: 1000 }
              as: PlatformAdmin
              captures: { c_oktx: $.data.id }
            - call: "POST /stb/carriers"
              payload: { carrier_code: "BNRZ", legal_name: "Big Northern Railroad", carrier_class: "I", base_route_miles: 800 }
              as: PlatformAdmin
              captures: { c_bnrz: $.data.id }
            - call: "POST /stb/carriers/${c_oktx}/revenue-adequacy-findings"
              payload: { fiscal_year: 2021, operating_revenue_cents: 620000000, operating_expense_cents: 500000000, net_investment_cents: 1000000000 }
              as: BoardAdjudicator
            - call: "POST /stb/carriers/${c_oktx}/revenue-adequacy-findings"
              payload: { fiscal_year: 2022, operating_revenue_cents: 600000000, operating_expense_cents: 500000000, net_investment_cents: 800000000 }
              as: BoardAdjudicator
            - call: "POST /stb/carriers/${c_oktx}/revenue-adequacy-findings"
              payload: { fiscal_year: 2023, operating_revenue_cents: 565000000, operating_expense_cents: 500000000, net_investment_cents: 500000000 }
              as: BoardAdjudicator
            - call: "POST /stb/carriers/${c_oktx}/revenue-adequacy-findings"
              payload: { fiscal_year: 2024, operating_revenue_cents: 730000000, operating_expense_cents: 500000000, net_investment_cents: 2000000000 }
              as: BoardAdjudicator
            - call: "POST /stb/carriers/${c_oktx}/revenue-adequacy-findings"
              payload: { fiscal_year: 2025, operating_revenue_cents: 1000000000, operating_expense_cents: 800000000, net_investment_cents: 2000000000 }
              as: BoardAdjudicator
            - call: "POST /stb/carriers/${c_bnrz}/revenue-adequacy-findings"
              payload: { fiscal_year: 2025, operating_revenue_cents: 1000000000, operating_expense_cents: 800000000, net_investment_cents: 2000000000 }
              as: BoardAdjudicator
            - call: "POST /stb/rate-complaints"
              payload: { shipper_id: "shp-ada", carrier_id: "${c_oktx}", commodity: "GRAIN", challenged_rate_cents_per_ton: 19500, alleged_variable_cost_cents_per_ton: 10000, annual_tons: 1000, relief_sought_cents: 400000001, contested_fiscal_year: 2025 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { rc_a: $.data.id }
            - call: "POST /stb/rate-complaints"
              payload: { shipper_id: "shp-ada", carrier_id: "${c_bnrz}", commodity: "GRAIN", challenged_rate_cents_per_ton: 19500, alleged_variable_cost_cents_per_ton: 10000, annual_tons: 1000, relief_sought_cents: 400000001, contested_fiscal_year: 2025 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { rc_b: $.data.id }
            - call: "POST /stb/rate-complaints/${rc_a}/determine-market-dominance"
              payload: { product_competition_exists: false, geographic_competition_exists: false }
              as: BoardAdjudicator
            - call: "POST /stb/rate-complaints/${rc_b}/determine-market-dominance"
              payload: { product_competition_exists: false, geographic_competition_exists: false }
              as: BoardAdjudicator
            - call: "POST /stb/rate-complaints/${rc_a}/evidence"
              payload: { submission_type: "SAC_STUDY", submitted_by_party: "SHIPPER", reference_rate_cents_per_ton: 11200, verified_variable_cost_cents_per_ton: 10500 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { ev_a: $.data.id }
            - call: "POST /stb/rate-complaints/${rc_b}/evidence"
              payload: { submission_type: "SAC_STUDY", submitted_by_party: "SHIPPER", reference_rate_cents_per_ton: 11200, verified_variable_cost_cents_per_ton: 10500 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { ev_b: $.data.id }
            - call: "POST /stb/evidence-submissions/${ev_a}/verify"
              payload: { review_outcome: "VERIFIED" }
              as: BoardAdjudicator
            - call: "POST /stb/evidence-submissions/${ev_b}/verify"
              payload: { review_outcome: "VERIFIED" }
              as: BoardAdjudicator
          trigger:
            - call: "POST /stb/rate-complaints/${rc_a}/decide"
              payload: { outcome: "UPHELD", shipments: [{ shipment_ref: "S-1", tons: 10.000 }] }
              as: BoardAdjudicator
            - call: "POST /stb/rate-complaints/${rc_b}/decide"
              payload: { outcome: "UPHELD", shipments: [{ shipment_ref: "S-1", tons: 10.000 }] }
              as: BoardAdjudicator
          assert:
            - "RateComplaint.${rc_a}.prescribed_rate_cents_per_ton == 11200 (ADEQUATE floor 10500 < reference 11200, floor does not bind)"
            - "RateComplaint.${rc_b}.prescribed_rate_cents_per_ton == 11550 (INADEQUATE floor round(10500*1.1000)=11550 > reference 11200, floor binds)"
            - "RateComplaint.${rc_a}.relief_granted_cents == 8300000 and RateComplaint.${rc_b}.relief_granted_cents == 7950000"
            - "RateComplaint.${rc_a}.award_granted_cents == 83000 and RateComplaint.${rc_b}.award_granted_cents == 79500"
      - name: reparation_rounds_per_shipment_then_sums
        grounds:
          - calculations.reparation_award_total
        distinguishing_aspect: "Mode (b): with rate difference 8300 cents/ton and shipments 10.515t + 5.005t, the pinned round-per-shipment-then-sum order yields 87275 + 41542 = 128817 cents; the forbidden sum-then-round order would yield 128816 — a 1-cent deterministic divergence."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Carrier OKTX with findings 2021-2025 (five-year 1180 bps -> ADEQUATE, so the 1.0000 floor 10500 does not bind against reference 11200). Complaint challenged 19500, alleged 10000, tons 1000, FULL_SAC, year 2025, VERIFIED evidence (reference 11200, cost 10500 -> adjudicated 1.8571)."
          setup_api_calls:
            - call: "POST /stb/carriers"
              payload: { carrier_code: "OKTX", legal_name: "Oklahoma & Texas Railway", carrier_class: "I", base_route_miles: 1000 }
              as: PlatformAdmin
              captures: { c_oktx: $.data.id }
            - call: "POST /stb/carriers/${c_oktx}/revenue-adequacy-findings"
              payload: { fiscal_year: 2021, operating_revenue_cents: 620000000, operating_expense_cents: 500000000, net_investment_cents: 1000000000 }
              as: BoardAdjudicator
            - call: "POST /stb/carriers/${c_oktx}/revenue-adequacy-findings"
              payload: { fiscal_year: 2022, operating_revenue_cents: 600000000, operating_expense_cents: 500000000, net_investment_cents: 800000000 }
              as: BoardAdjudicator
            - call: "POST /stb/carriers/${c_oktx}/revenue-adequacy-findings"
              payload: { fiscal_year: 2023, operating_revenue_cents: 565000000, operating_expense_cents: 500000000, net_investment_cents: 500000000 }
              as: BoardAdjudicator
            - call: "POST /stb/carriers/${c_oktx}/revenue-adequacy-findings"
              payload: { fiscal_year: 2024, operating_revenue_cents: 730000000, operating_expense_cents: 500000000, net_investment_cents: 2000000000 }
              as: BoardAdjudicator
            - call: "POST /stb/carriers/${c_oktx}/revenue-adequacy-findings"
              payload: { fiscal_year: 2025, operating_revenue_cents: 1000000000, operating_expense_cents: 800000000, net_investment_cents: 2000000000 }
              as: BoardAdjudicator
            - call: "POST /stb/rate-complaints"
              payload: { shipper_id: "shp-ada", carrier_id: "${c_oktx}", commodity: "COAL", challenged_rate_cents_per_ton: 19500, alleged_variable_cost_cents_per_ton: 10000, annual_tons: 1000, relief_sought_cents: 400000001, contested_fiscal_year: 2025 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { rc1: $.data.id }
            - call: "POST /stb/rate-complaints/${rc1}/determine-market-dominance"
              payload: { product_competition_exists: false, geographic_competition_exists: false }
              as: BoardAdjudicator
            - call: "POST /stb/rate-complaints/${rc1}/evidence"
              payload: { submission_type: "SAC_STUDY", submitted_by_party: "SHIPPER", reference_rate_cents_per_ton: 11200, verified_variable_cost_cents_per_ton: 10500 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { ev1: $.data.id }
            - call: "POST /stb/evidence-submissions/${ev1}/verify"
              payload: { review_outcome: "VERIFIED" }
              as: BoardAdjudicator
          trigger:
            - call: "POST /stb/rate-complaints/${rc1}/decide"
              payload: { outcome: "UPHELD", shipments: [{ shipment_ref: "S-A", tons: 10.515 }, { shipment_ref: "S-B", tons: 5.005 }] }
              as: BoardAdjudicator
          assert:
            - "RateComplaint.${rc1}.prescribed_rate_cents_per_ton == 11200 (ADEQUATE floor 10500 < reference 11200) and rate difference == 8300 cents/ton"
            - "RateComplaint.${rc1}.award_granted_cents == 128817 (round_half_up(8300*10.515)=87275 + round_half_up(8300*5.005)=41542; sum-then-round would give 128816)"
            - "RateComplaint.${rc1}.award_outstanding_cents == 128817 and award_paid_cents == 0 and award_status == GRANTED"
            - "Carrier.${c_oktx}.reparation_exposure_cents == 128817"
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: complaint_reopen_cycle_supersedes_evidence
        grounds:
          - state_machines.RateComplaint.DECIDED_to_REOPENED
          - state_machines.RateComplaint.REOPENED_to_EVIDENTIARY_PHASE
          - state_machines.EvidenceSubmission.VERIFIED_to_SUPERSEDED
        distinguishing_aspect: "Cyclic machine on RateComplaint: DECIDED -> REOPENED -> (new evidence) -> EVIDENTIARY_PHASE -> DECIDED again; reopening supersedes prior VERIFIED evidence and nulls adjudicated_rvc_ratio, so a second decide without fresh verification fails ERR_NO_VERIFIED_EVIDENCE."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Carrier OKTX with 2025 finding (single-year 1000 -> INADEQUATE). Complaint RC (challenged 19500, alleged 10000, tons 1000, FULL_SAC, year 2025) decided UPHELD: prescribed 11550, award 79500 from one 10.000t shipment; complaint DECIDED."
          setup_api_calls:
            - call: "POST /stb/carriers"
              payload: { carrier_code: "OKTX", legal_name: "Oklahoma & Texas Railway", carrier_class: "I", base_route_miles: 1000 }
              as: PlatformAdmin
              captures: { c_oktx: $.data.id }
            - call: "POST /stb/carriers/${c_oktx}/revenue-adequacy-findings"
              payload: { fiscal_year: 2025, operating_revenue_cents: 1000000000, operating_expense_cents: 800000000, net_investment_cents: 2000000000 }
              as: BoardAdjudicator
            - call: "POST /stb/rate-complaints"
              payload: { shipper_id: "shp-ada", carrier_id: "${c_oktx}", commodity: "GRAIN", challenged_rate_cents_per_ton: 19500, alleged_variable_cost_cents_per_ton: 10000, annual_tons: 1000, relief_sought_cents: 400000001, contested_fiscal_year: 2025 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { rc1: $.data.id }
            - call: "POST /stb/rate-complaints/${rc1}/determine-market-dominance"
              payload: { product_competition_exists: false, geographic_competition_exists: false }
              as: BoardAdjudicator
            - call: "POST /stb/rate-complaints/${rc1}/evidence"
              payload: { submission_type: "SAC_STUDY", submitted_by_party: "SHIPPER", reference_rate_cents_per_ton: 11200, verified_variable_cost_cents_per_ton: 10500 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { ev1: $.data.id }
            - call: "POST /stb/evidence-submissions/${ev1}/verify"
              payload: { review_outcome: "VERIFIED" }
              as: BoardAdjudicator
            - call: "POST /stb/rate-complaints/${rc1}/decide"
              payload: { outcome: "UPHELD", shipments: [{ shipment_ref: "S-1", tons: 10.000 }] }
              as: BoardAdjudicator
            - call: "POST /stb/rate-complaints/${rc1}/reopen"
              payload: {}
              as: Shipper
              as_user_id: "shp-ada"
          trigger:
            - call: "POST /stb/rate-complaints/${rc1}/evidence"
              payload: { submission_type: "REBUTTAL", submitted_by_party: "CARRIER", reference_rate_cents_per_ton: 13000, verified_variable_cost_cents_per_ton: 10800 }
              as: CarrierOperator
              as_user_id: "${c_oktx}"
              captures: { ev2: $.data.id }
          assert:
            - "after reopen: RateComplaint.${rc1}.status == REOPENED and adjudicated_rvc_ratio is null"
            - "EvidenceSubmission.${ev1}.review_status == SUPERSEDED (superseded by the reopen, visible in GET /stb/rate-complaints/${rc1}/evidence)"
            - "after the trigger evidence POST: RateComplaint.${rc1}.status == EVIDENTIARY_PHASE (cycle completed) and EvidenceSubmission.${ev2}.review_status == SUBMITTED"
            - "RateComplaint.${rc1}.award_granted_cents == 79500 (decision figures survive reopening until a new decide)"
      - name: merger_decision_branches_diverge_on_score_band
        grounds:
          - state_machines.MergerApplication.COMMENT_PERIOD_to_APPROVED_WITH_CONDITIONS
          - state_machines.MergerApplication.COMMENT_PERIOD_to_REJECTED
          - calculations.public_interest_score
        distinguishing_aspect: "Branching fork on MergerApplication: score 59.00 admits only APPROVED_WITH_CONDITIONS (conditions recorded, plan -> MONITORING) while score 43.00 admits only REJECTED (plan -> MOOT) — divergent side-effect sets per branch."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Carriers CSXT (acquirer) and NSOR (target) exist. Merger M1 scores (50,70,60) -> 59.00 with a service assurance plan; merger M2 scores (40,50,40) -> 43.00 with a service assurance plan. Clock advanced to 2026-10-16T00:00:00Z (comment periods closed)."
          setup_api_calls:
            - call: "POST /stb/carriers"
              payload: { carrier_code: "CSXT", legal_name: "Crescent South Extension Transport", carrier_class: "I", base_route_miles: 2100 }
              as: PlatformAdmin
              captures: { c_csxt: $.data.id }
            - call: "POST /stb/carriers"
              payload: { carrier_code: "NSOR", legal_name: "Northern & Southern Railway", carrier_class: "II", base_route_miles: 640 }
              as: PlatformAdmin
              captures: { c_nsor: $.data.id }
            - call: "POST /stb/merger-applications"
              payload: { acquiring_carrier_id: "${c_csxt}", target_carrier_id: "${c_nsor}", transaction_value_cents: 900000000, competition_preservation_score: 50, service_reliability_score: 70, shipper_impact_score: 60 }
              as: CarrierOperator
              as_user_id: "${c_csxt}"
              captures: { m1: $.data.id }
            - call: "POST /stb/merger-applications/${m1}/service-assurance-plans"
              payload: { plan_name: "M1 Service Assurance Plan", commitments: ["Maintain Gulf gateway interchange windows", "48-hour car supply restoration"] }
              as: CarrierOperator
              as_user_id: "${c_csxt}"
              captures: { sap1: $.data.id }
            - call: "POST /stb/merger-applications"
              payload: { acquiring_carrier_id: "${c_csxt}", target_carrier_id: "${c_nsor}", transaction_value_cents: 500000000, competition_preservation_score: 40, service_reliability_score: 50, shipper_impact_score: 40 }
              as: CarrierOperator
              as_user_id: "${c_csxt}"
              captures: { m2: $.data.id }
            - call: "POST /stb/merger-applications/${m2}/service-assurance-plans"
              payload: { plan_name: "M2 Service Assurance Plan", commitments: ["Hire 200 operating craft"] }
              as: CarrierOperator
              as_user_id: "${c_csxt}"
              captures: { sap2: $.data.id }
            - call: "POST /stb/_clock/set_current_utc"
              payload: { current_utc: "2026-10-16T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /stb/merger-applications/${m1}/decide"
              payload: { outcome: "APPROVED_WITH_CONDITIONS", conditions: ["Five-year service assurance oversight", "Gateway interchange commitment enforceable"] }
              as: BoardAdjudicator
            - call: "POST /stb/merger-applications/${m2}/decide"
              payload: { outcome: "REJECTED" }
              as: BoardAdjudicator
          assert:
            - "MergerApplication.${m1}.public_interest_score == 59.00 and status == APPROVED_WITH_CONDITIONS"
            - "MergerApplication.${m1}.conditions_imposed == [\"Five-year service assurance oversight\", \"Gateway interchange commitment enforceable\"]"
            - "ServiceAssurancePlan.${sap1}.status == MONITORING"
            - "MergerApplication.${m2}.public_interest_score == 43.00 and status == REJECTED"
            - "ServiceAssurancePlan.${sap2}.status == MOOT"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: escalation_cascade_puts_merger_on_service_hold
        grounds:
          - state_machines.ServiceComplaint.OPEN_to_ESCALATED
          - entities.Carrier.fields.compliance_standing
          - entities.MergerApplication.fields.service_review_hold
        distinguishing_aspect: "Depth-3 cascade from escalate: complaint ESCALATED (hop 1: ESO created ACTIVE) -> carrier compliance_standing PROBATION (hop 2: recomputed from the ACTIVE ESO) -> merger service_review_hold true (hop 3), which then blocks outcome APPROVED at decide with ERR_MERGER_SERVICE_HOLD."
        test_recipe:
          setup:
