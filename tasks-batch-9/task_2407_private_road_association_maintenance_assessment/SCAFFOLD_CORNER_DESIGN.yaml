          rationale: "ERR_PROPOSAL_NOT_BALLOTING is already triggered there on a POST /ballots against a DRAFT proposal, with the response pinned against the competing standing error."

      - name: member_not_in_good_standing_code
        claim_type: triggerability
        excluded_because:
          difficulty_instance: ballot_proposal_state_error_outranks_member_standing_error
          rationale: "The same §1.8 instance triggers ERR_MEMBER_NOT_IN_GOOD_STANDING in isolation once the proposal state is legal, so both codes of that pair are covered."

