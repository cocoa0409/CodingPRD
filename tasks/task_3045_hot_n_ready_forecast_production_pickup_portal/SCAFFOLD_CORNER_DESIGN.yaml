  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: event_cancel_removes_it_from_provisional_forecast
        claim_type: correct_result
        grounds:
          - calculations.daypart_forecast
          - state_machines.DemandEvent.SCHEDULED_to_CANCELLED
        distinguishing_aspect: "After a SCHEDULED overlapping event (multiplier 2.0) is cancelled, the daypart's forecast_units_provisional drops from 20 back to 10 and made_ahead_target recomputes from 12 to 6."
        test_recipe:
          setup:
            - "StoreDay 2026-10-12; DINNER daypart 960-1080 base 10 rack 20; overlapping event 16:00Z-19:00Z mult 2.0 (forecast 20, target 12); clock 10:00Z so event SCHEDULED"
          setup_api_calls:
            - call: "POST /store-days"
              payload: { business_date: "2026-10-12" }
              as: StoreManager
              captures: { sd_id: $.data.id }
            - call: "POST /store-days/${sd_id}/dayparts"
              payload: { label: "DINNER", window_start_minute: 960, window_end_minute: 1080, rack_capacity: 20, base_demand_units: 10 }
              as: StoreManager
              captures: { dp_id: $.data.id }
            - call: "POST /store-days/${sd_id}/demand-events"
              payload: { name: "Rally", window_start_at: "2026-10-12T16:00:00Z", window_end_at: "2026-10-12T19:00:00Z", demand_multiplier: 2.0 }
              as: StoreManager
              captures: { ev_id: $.data.id }
            - call: "GET /dayparts/${dp_id}"
              payload: {}
              as: StoreManager
              captures: { fc_before: $.data.forecast_units_provisional, target_before: $.data.made_ahead_target }
          trigger:
            - call: "POST /demand-events/${ev_id}/cancel"
              payload: {}
              as: StoreManager
            - call: "GET /dayparts/${dp_id}"
              payload: {}
              as: StoreManager
              captures: { fc_after: $.data.forecast_units_provisional, target_after: $.data.made_ahead_target }
          assert:
            - "forecast before cancel == 20"
            - "made_ahead_target before cancel == 12"
            - "forecast after cancel == 10"
            - "made_ahead_target after cancel == 6"

      - name: overlapping_event_multipliers_sum_with_floor
        claim_type: correct_result
        grounds:
          - calculations.daypart_forecast
        distinguishing_aspect: "Two overlapping SCHEDULED events with multipliers 1.5 and 2.0 SUM (M = max(1, 3.5)) giving forecast round(10 x 3.5) = 35; a max-only implementation would give 20."
        test_recipe:
          setup:
            - "StoreDay 2026-10-13; DINNER daypart 960-1080 base 10 rack 40; two overlapping events mult 1.5 and 2.0 (disjoint windows from each other? NO — events must not overlap each other per ERR_EVENT_WINDOW_OVERLAP, so use one event 16:00-17:30 mult 1.5 and another 17:30-19:00 mult 2.0 — adjacent shares 17:30 boundary which is an intersection under closed semantics -> rejected; therefore use 16:00-17:00 and 17:01-19:00, both overlapping the daypart but not each other)"
          setup_api_calls:
            - call: "POST /store-days"
              payload: { business_date: "2026-10-13" }
              as: StoreManager
              captures: { sd_id: $.data.id }
            - call: "POST /store-days/${sd_id}/dayparts"
              payload: { label: "DINNER", window_start_minute: 960, window_end_minute: 1080, rack_capacity: 40, base_demand_units: 10 }
              as: StoreManager
              captures: { dp_id: $.data.id }
            - call: "POST /store-days/${sd_id}/demand-events"
              payload: { name: "E1", window_start_at: "2026-10-13T16:00:00Z", window_end_at: "2026-10-13T17:00:00Z", demand_multiplier: 1.5 }
              as: StoreManager
            - call: "POST /store-days/${sd_id}/demand-events"
              payload: { name: "E2", window_start_at: "2026-10-13T17:01:00Z", window_end_at: "2026-10-13T19:00:00Z", demand_multiplier: 2.0 }
              as: StoreManager
          trigger:
            - call: "GET /dayparts/${dp_id}"
              payload: {}
              as: StoreManager
              captures: { fc: $.data.forecast_units_provisional }
          assert:
            - "Daypart.${dp_id}.forecast_units_provisional == 35 (10 x (1.5 + 2.0), multiplier floor max(1, 3.5))"

      - name: promo_price_applies_only_to_non_customized_lines
        claim_type: correct_result
        grounds:
          - calculations.order_pricing
        distinguishing_aspect: "Product with list 600 and promo 500: a customized line pays list price (600), an identical non-customized line pays promo (500) — same order, same product, different unit price by line flag; portal fee computed on each line's own subtotal."
        test_recipe:
          setup:
            - "StoreDay 2026-10-14 opened; LUNCH daypart ACTIVE at 11:00Z; product with promo 500 list 600 and customization_allowed true"
          setup_api_calls:
            - call: "POST /store-days"
              payload: { business_date: "2026-10-14" }
              as: StoreManager
              captures: { sd_id: $.data.id }
