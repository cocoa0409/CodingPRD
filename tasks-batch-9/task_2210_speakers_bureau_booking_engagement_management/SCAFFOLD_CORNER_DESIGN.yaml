  # =========================================================================
  # State machines (§1.2) — transitions, preconditions, cascades, lockdown
  # =========================================================================
  - section: state_machines
    instances:

      - name: inquiry_disqualify_branch_is_terminal_and_refuses_proposal_rounds
        claim_type: valid_transition
        grounds:
          - state_machines.Inquiry.RECEIVED_to_DISQUALIFIED
          - errors[ERR_INQUIRY_STATE_INVALID]
        distinguishing_aspect: |
          The qualify endpoint carries two outcomes on one trigger: DISQUALIFY must land the
          inquiry in the terminal DISQUALIFIED state (still stamping owning_agent_user_id and
          bumping version), after which no proposal round can be opened.
        test_recipe:
          setup:
            - "A RECEIVED inquiry from a GOOD-credit client with an ample budget and lead time"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /speakers"
              payload: { full_name: "Dana Reyes", topics: ["AI_STRATEGY", "LEADERSHIP"], fee_floor_cents: 1000000, fee_ceiling_cents: 2000000, travel_class: "PREMIUM", travel_buffer_days: 1, tax_form_status: "ON_FILE" }
              as: BureauAdmin
              captures: { sp: $.data.id }
            - call: "POST /clients"
              payload: { org_name: "Meridian Health", industry_code: "HEALTHCARE", primary_contact_email: "ops@meridian.example" }
              as: BureauAdmin
              captures: { cl: $.data.id }
            - call: "POST /inquiries"
              payload: { client_id: "${cl}", required_topic: "AI_STRATEGY", event_start_utc: "2026-10-15T16:00:00Z", event_end_utc: "2026-10-15T18:00:00Z", audience_size: 800, budget_cents: 1600000, objective_tags: ["STRATEGY"] }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { inq: $.data.id }
          trigger:
            - call: "POST /inquiries/${inq}/qualify"
              payload: { outcome: "DISQUALIFY", qualification_note: "audience mismatch" }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { st: $.data.status, iv: $.data.version }
            - call: "POST /inquiries/${inq}/proposals"
              payload: { expected_inquiry_version: "${iv}", valid_until_utc: "2026-09-20T00:00:00Z" }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { err: $.data.error_id }
          assert:
            - "the inquiry is DISQUALIFIED with qualification_note recorded, owning_agent_user_id agent-01 and version 2"
            - "opening a proposal round on it returns 409 ERR_INQUIRY_STATE_INVALID even though the supplied version is current"
            - "no Proposal row is created: GET /proposals?limit=10 returns total_count 0"

      - name: contract_send_twice_is_rejected_by_the_draft_precondition
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Contract.DRAFT_to_SENT
