  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_devices_filtered_by_rack_id
        claim_type: Computed read
        grounds: [endpoints, entities.Device.fields.rack_id]
        distinguishing_aspect: "GET /devices?rack_id=X returns only devices on rack X as an array."
        test_recipe:
          setup: ["A rack with two devices registered."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "C34", email: "c34@x.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", site_address: "1 St", region_code: "WEST" }
              as: ProjectManager
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/rack"
              payload: { rack_units_total: 10, subnet_cidr: "10.20.0.0/24" }
              as: ProjectManager
              captures: { rack_id: $.data.id }
            - call: "POST /devices"
              payload: { rack_id: "${rack_id}", sku: "A", category: "AUDIO", rack_units: 1 }
              as: LowVoltageTech
            - call: "POST /devices"
              payload: { rack_id: "${rack_id}", sku: "B", category: "VIDEO", rack_units: 1 }
              as: LowVoltageTech
          trigger:
            - call: "GET /devices?rack_id=${rack_id}"
              payload: {}
              as: LowVoltageTech
          assert:
            - "response_type == array"
            - "total_count == 2"

      - name: get_rack_subresource_returns_array_of_one
        claim_type: Computed read
        grounds: [endpoints, entities.Rack.fields.project_id]
        distinguishing_aspect: "GET /projects/{id}/rack returns an array of exactly one Rack (reverse-reachability, 1:1 cardinality)."
        test_recipe:
          setup: ["A project with a rack."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "C35", email: "c35@x.com" }
