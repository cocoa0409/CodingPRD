scaffold_corner_design:

  # =====================================================================
  - section: entities
    instances:

      - name: corner_circuit_creation_returns_201_with_resolved_cycle_fields
        claim_type: Creation
        grounds: ['entities.Circuit', 'endpoints["POST /vm/circuits"]', 'calculations.prescription_resolution']
        distinguishing_aspect: "POST /vm/circuits with all five required fields returns 201, echoes them, and stamps prescription_id, cycle_months 36, next_trim_due_on 2027-03-15, reliability_tier TIER_NORMAL, trim_status NOT_SCHEDULED and version 1."
        test_recipe:
          setup: ["One ACTIVE 12kV/RAPID prescription with base_cycle_years 4."]
          setup_api_calls:
            - call: "POST /vm/prescriptions"
              payload: { voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", base_cycle_years: 4, clearance_radius_ft: 10, effective_from: "2026-01-01" }
              as: UtilityForester
              captures: { presc_id: $.data.id }
            - call: "POST /vm/prescriptions/${presc_id}/activate"
              payload: {}
              as: UtilityForester
          trigger:
            - call: "POST /vm/circuits"
              payload: { circuit_code: "CKT-A", voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", customer_count: 1200, last_trim_completed_on: "2024-03-15" }
              as: UtilityForester
              captures: { ckt_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Circuit.${ckt_id}.prescription_id == ${presc_id}"
            - "Circuit.${ckt_id}.cycle_months == 36"
            - "Circuit.${ckt_id}.next_trim_due_on == 2027-03-15"
            - "Circuit.${ckt_id}.reliability_tier == TIER_NORMAL"
            - "Circuit.${ckt_id}.trim_status == NOT_SCHEDULED"
            - "Circuit.${ckt_id}.version == 1"
            - "response envelope carries meta.api_request_id and meta.api_request_timestamp with response_type == object"

      - name: corner_circuit_get_by_id_returns_stored_entity
        claim_type: Retrieval
        grounds: ['endpoints["GET /vm/circuits/{id}"]']
        distinguishing_aspect: "GET /vm/circuits/{id} returns the same circuit_code, voltage_class and computed cycle_months that POST returned."
        test_recipe:
          setup: ["One ACTIVE prescription and one circuit CKT-A."]
          setup_api_calls:
            - call: "POST /vm/prescriptions"
              payload: { voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", base_cycle_years: 4, clearance_radius_ft: 10, effective_from: "2026-01-01" }
              as: UtilityForester
              captures: { presc_id: $.data.id }
            - call: "POST /vm/prescriptions/${presc_id}/activate"
              payload: {}
              as: UtilityForester
            - call: "POST /vm/circuits"
              payload: { circuit_code: "CKT-A", voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", customer_count: 1200, last_trim_completed_on: "2024-03-15" }
              as: UtilityForester
              captures: { ckt_id: $.data.id }
          trigger:
            - call: "GET /vm/circuits/${ckt_id}"
              payload: {}
              as: ContractorPlanner
          assert:
            - "HTTP status == 200"
            - "data.circuit_code == CKT-A"
            - "data.cycle_months == 36"
            - "data.id == ${ckt_id}"

      - name: corner_prescriptions_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds: ['endpoints["GET /vm/prescriptions"]']
        distinguishing_aspect: "With three DRAFT prescriptions stored, GET /vm/prescriptions?limit=2&offset=0 returns exactly 2 rows, total_count 3 and has_more true; offset=2 returns 1 row and has_more false."
        test_recipe:
          setup: ["Three prescriptions in DRAFT for three different growth zones."]
          setup_api_calls:
            - call: "POST /vm/prescriptions"
              payload: { voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", base_cycle_years: 4, clearance_radius_ft: 10, effective_from: "2026-01-01" }
              as: UtilityForester
            - call: "POST /vm/prescriptions"
              payload: { voltage_class: "DISTRIBUTION_12KV", growth_zone: "MODERATE", base_cycle_years: 5, clearance_radius_ft: 10, effective_from: "2026-01-01" }
              as: UtilityForester
            - call: "POST /vm/prescriptions"
              payload: { voltage_class: "DISTRIBUTION_12KV", growth_zone: "SLOW", base_cycle_years: 6, clearance_radius_ft: 10, effective_from: "2026-01-01" }
              as: UtilityForester
          trigger:
            - call: "GET /vm/prescriptions"
              payload: { limit: 2, offset: 0 }
              as: UtilityForester
          assert:
            - "HTTP status == 200 and response_type == array"
            - "len(data) == 2"
            - "total_count == 3"
            - "has_more == true"
            - "a follow-up call with limit 2 and offset 2 returns len(data) == 1 and has_more == false"

      - name: corner_circuit_get_unknown_id_not_found
        claim_type: Not Found
        grounds: ['errors[ERR_CIRCUIT_NOT_FOUND]', 'validations[priority=5]']
        distinguishing_aspect: "GET /vm/circuits/{id} with a syntactically valid but unknown UUID returns 404 ERR_CIRCUIT_NOT_FOUND, not 200 with an empty body."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /vm/prescriptions"
              payload: { voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", base_cycle_years: 4, clearance_radius_ft: 10, effective_from: "2026-01-01" }
              as: UtilityForester
              captures: { presc_id: $.data.id }
          trigger:
            - call: "GET /vm/circuits/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: UtilityForester
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_CIRCUIT_NOT_FOUND"
            - "response_type == error"

      - name: corner_work_order_create_missing_required_returns_invalid_request
        claim_type: Required Fields
        grounds: ['validations[priority=7]', 'errors[ERR_VALIDATION]', 'endpoints["POST /vm/work-orders"]']
        distinguishing_aspect: "POST /vm/work-orders without billing_method returns 400 ERR_VALIDATION and creates no row."
        test_recipe:
          setup: ["One ACTIVE prescription, circuit CKT-A and one DRAFT work plan."]
          setup_api_calls:
            - call: "POST /vm/prescriptions"
              payload: { voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", base_cycle_years: 4, clearance_radius_ft: 10, effective_from: "2026-01-01" }
              as: UtilityForester
              captures: { presc_id: $.data.id }
            - call: "POST /vm/prescriptions/${presc_id}/activate"
              payload: {}
              as: UtilityForester
            - call: "POST /vm/circuits"
              payload: { circuit_code: "CKT-A", voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", customer_count: 1200, last_trim_completed_on: "2024-03-15" }
              as: UtilityForester
              captures: { ckt_id: $.data.id }
            - call: "POST /vm/work-plans"
              payload: { circuit_id: "${ckt_id}", program_year: 2026, planned_span_miles: 10, budget_cents: 5000000 }
              as: UtilityForester
              captures: { wp_id: $.data.id }
          trigger:
            - call: "POST /vm/work-orders"
              payload: { work_plan_id: "${wp_id}", span_miles: 2.5, planned_unit_count: 200 }
              as: ContractorPlanner
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_VALIDATION"
            - "GET /vm/work-orders with work_plan_id ${wp_id} returns 0 rows"
            - "WorkPlan.${wp_id}.planned_unit_count == 0"

      - name: corner_prescription_defaults_applied_when_optional_flags_omitted
        claim_type: Defaults
        grounds: ['entities.Prescription.fields.ground_to_sky', 'entities.Prescription.fields.herbicide_allowed']
        distinguishing_aspect: "Omitting ground_to_sky and herbicide_allowed yields ground_to_sky false and herbicide_allowed true on the stored prescription."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /vm/prescriptions"
              payload: { voltage_class: "TRANSMISSION_115KV", growth_zone: "SLOW", base_cycle_years: 6, clearance_radius_ft: 30, effective_from: "2026-01-01" }
              as: UtilityForester
              captures: { p_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Prescription.${p_id}.ground_to_sky == false"
            - "Prescription.${p_id}.herbicide_allowed == true"
            - "Prescription.${p_id}.status == DRAFT"

      - name: corner_hazard_tree_risk_score_input_ignored
        claim_type: Computed Fields
        grounds: ['entities.HazardTree.fields.risk_score', 'validations[priority=7]']
        distinguishing_aspect: "A client-supplied risk_score of 99.99 is ignored; the stored score is the formula result 83.00."
        test_recipe:
          setup: ["Circuit CKT-A on DISTRIBUTION_12KV."]
          setup_api_calls:
            - call: "POST /vm/prescriptions"
              payload: { voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", base_cycle_years: 4, clearance_radius_ft: 10, effective_from: "2026-01-01" }
              as: UtilityForester
              captures: { presc_id: $.data.id }
            - call: "POST /vm/prescriptions/${presc_id}/activate"
              payload: {}
              as: UtilityForester
            - call: "POST /vm/circuits"
              payload: { circuit_code: "CKT-A", voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", customer_count: 1200, last_trim_completed_on: "2024-03-15" }
              as: UtilityForester
              captures: { ckt_id: $.data.id }
          trigger:
            - call: "POST /vm/hazard-trees"
              payload: { circuit_id: "${ckt_id}", species: "SILVER_MAPLE", defect_class: "DEAD", height_ft: 60, offset_ft: 30, risk_score: 99.99 }
              as: CertifiedArborist
              as_user_id: "arborist-a"
              captures: { ht_id: $.data.id }
          assert:
            - "HazardTree.${ht_id}.risk_score == 83.00"
            - "HazardTree.${ht_id}.strike_potential == true"
            - "HazardTree.${ht_id}.status == IDENTIFIED"

      - name: corner_production_entry_is_immutable_and_carries_no_version
        claim_type: Immutability
        grounds: ['entities.ProductionEntry', 'endpoints["GET /vm/production-entries/{id}"]']
        distinguishing_aspect: "ProductionEntry is declared common_fields false: the read response exposes id and created_at but no version and no updated_at, and §1.5 declares no update or delete endpoint for it."
        excluded_because:
          difficulty_instance: tm_gross_rounds_per_production_entry_then_sums
          rationale: "The append-only shape and entry_cents stamping are asserted by the named §1.8 instance; only the absence of a mutation endpoint remains, which the endpoint table settles by construction."

      - name: corner_work_order_create_unknown_plan_returns_not_found
        claim_type: Parent Relationships
        grounds: ['validations[priority=6]', 'errors[ERR_WORK_PLAN_NOT_FOUND]']
        distinguishing_aspect: "POST /vm/work-orders naming a work_plan_id that does not exist returns 404 ERR_WORK_PLAN_NOT_FOUND, ahead of any state or business check."
        test_recipe:
          setup: ["Empty database apart from one DRAFT prescription."]
          setup_api_calls:
            - call: "POST /vm/prescriptions"
              payload: { voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", base_cycle_years: 4, clearance_radius_ft: 10, effective_from: "2026-01-01" }
              as: UtilityForester
          trigger:
            - call: "POST /vm/work-orders"
              payload: { work_plan_id: "00000000-0000-4000-8000-000000000000", span_miles: 2.5, billing_method: "UNIT_PRICE", planned_unit_count: 200 }
              as: ContractorPlanner
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_WORK_PLAN_NOT_FOUND"

      - name: corner_circuit_invalid_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: ['validations[priority=7]', 'errors[ERR_VALIDATION]']
        distinguishing_aspect: "voltage_class DISTRIBUTION_7KV is not a declared enum member, so POST /vm/circuits returns 400 ERR_VALIDATION before the prescription selector runs."
        test_recipe:
          setup: ["No ACTIVE prescription exists, so a successful path would have failed with ERR_NO_ACTIVE_PRESCRIPTION - the enum error must still win."]
          setup_api_calls: []
          trigger:
            - call: "POST /vm/circuits"
              payload: { circuit_code: "CKT-BAD", voltage_class: "DISTRIBUTION_7KV", growth_zone: "RAPID", customer_count: 1200, last_trim_completed_on: "2024-03-15" }
              as: UtilityForester
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_VALIDATION"
            - "error_id != ERR_NO_ACTIVE_PRESCRIPTION"

      - name: corner_path_ids_validated_left_to_right_return_resource_not_found
        claim_type: Not Found
        grounds: ['validations[priority=5]', 'errors[ERR_WORK_ORDER_NOT_FOUND]', 'errors[ERR_BILLING_LINE_NOT_FOUND]', 'errors[ERR_CREW_NOT_FOUND]', 'errors[ERR_STORM_EVENT_NOT_FOUND]', 'errors[ERR_PERMIT_NOT_FOUND]', 'errors[ERR_HAZARD_TREE_NOT_FOUND]', 'errors[ERR_NOTIFICATION_NOT_FOUND]', 'errors[ERR_CREW_ASSIGNMENT_NOT_FOUND]', 'errors[ERR_PRODUCTION_ENTRY_NOT_FOUND]', 'errors[ERR_OUTAGE_RECORD_NOT_FOUND]', 'errors[ERR_PRESCRIPTION_NOT_FOUND]']
        distinguishing_aspect: "Every path-id resource raises its own domain-specific 404 rather than a shared generic code: each read below targets an unknown UUID and must return the not-found code named for that resource."
        test_recipe:
          setup:
            - "Empty database; all ten reads target the same syntactically valid but unknown UUID."
          setup_api_calls:
            []
          trigger:
            - call: "GET /vm/work-orders/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: UtilityForester
              captures: { e_wo: $.data.error_id }
            - call: "GET /vm/billing-lines/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: UtilityForester
              captures: { e_bl: $.data.error_id }
            - call: "GET /vm/crews/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: UtilityForester
              captures: { e_cr: $.data.error_id }
            - call: "GET /vm/storm-events/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: UtilityForester
              captures: { e_st: $.data.error_id }
            - call: "GET /vm/herbicide-permits/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: UtilityForester
              captures: { e_pm: $.data.error_id }
            - call: "GET /vm/hazard-trees/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: UtilityForester
              captures: { e_ht: $.data.error_id }
            - call: "GET /vm/customer-notifications/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: UtilityForester
              captures: { e_cn: $.data.error_id }
            - call: "GET /vm/crew-assignments/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: UtilityForester
              captures: { e_ca: $.data.error_id }
            - call: "GET /vm/production-entries/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: UtilityForester
              captures: { e_pe: $.data.error_id }
            - call: "GET /vm/outage-records/00000000-0000-4000-8000-00000000000a"
              payload: {}
              as: UtilityForester
              captures: { e_or: $.data.error_id }
            - call: "GET /vm/prescriptions/00000000-0000-4000-8000-00000000000b"
              payload: {}
              as: UtilityForester
              captures: { e_pr: $.data.error_id }
            - call: "GET /vm/work-plans/00000000-0000-4000-8000-00000000000c"
              payload: {}
              as: UtilityForester
              captures: { e_wp: $.data.error_id }
          assert:
            - "every call returns HTTP 404 with response_type == error"
            - "e_wo == ERR_WORK_ORDER_NOT_FOUND"
            - "e_bl == ERR_BILLING_LINE_NOT_FOUND"
            - "e_cr == ERR_CREW_NOT_FOUND"
            - "e_st == ERR_STORM_EVENT_NOT_FOUND"
            - "e_pm == ERR_PERMIT_NOT_FOUND"
            - "e_ht == ERR_HAZARD_TREE_NOT_FOUND"
            - "e_cn == ERR_NOTIFICATION_NOT_FOUND"
            - "e_ca == ERR_CREW_ASSIGNMENT_NOT_FOUND"
            - "e_pe == ERR_PRODUCTION_ENTRY_NOT_FOUND"
            - "e_or == ERR_OUTAGE_RECORD_NOT_FOUND"
            - "e_pr == ERR_PRESCRIPTION_NOT_FOUND"
            - "e_wp == ERR_WORK_PLAN_NOT_FOUND"


  # =====================================================================
  - section: state_machines
    instances:

      - name: corner_work_order_start_from_mapped_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ['state_machines.WorkOrder.execution_status.RELEASED_to_IN_PROGRESS', 'errors[ERR_INVALID_STATE]', 'validations[priority=10]']
        distinguishing_aspect: "start is declared only from RELEASED; calling it on a MAPPED span returns 409 ERR_INVALID_STATE and leaves execution_status at MAPPED."
        test_recipe:
          setup:
            - "Circuit CKT-A, RELEASED plan, one span in MAPPED that has never been released."
          setup_api_calls:
            - call: "POST /vm/prescriptions"
              payload: { voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", base_cycle_years: 4, clearance_radius_ft: 10, effective_from: "2026-01-01" }
              as: UtilityForester
              captures: { presc_id: $.data.id }
            - call: "POST /vm/prescriptions/${presc_id}/activate"
              payload: {}
              as: UtilityForester
            - call: "POST /vm/circuits"
              payload: { circuit_code: "CKT-A", voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", customer_count: 1200, last_trim_completed_on: "2024-03-15" }
              as: UtilityForester
              captures: { ckt_id: $.data.id }
            - call: "POST /vm/work-plans"
              payload: { circuit_id: "${ckt_id}", program_year: 2026, planned_span_miles: 10, budget_cents: 5000000 }
              as: UtilityForester
              captures: { wp_id: $.data.id }
            - call: "POST /vm/work-orders"
              payload: { work_plan_id: "${wp_id}", span_miles: 2.5, billing_method: "UNIT_PRICE", planned_unit_count: 200 }
              as: ContractorPlanner
              captures: { wo_id: $.data.id }
            - call: "POST /vm/work-orders/${wo_id}/map"
              payload: { clearance_radius_ft: 12 }
              as: ContractorPlanner
            - call: "POST /vm/work-plans/${wp_id}/release"
              payload: {}
              as: ContractorPlanner
          trigger:
            - call: "POST /vm/work-orders/${wo_id}/start"
              payload: {}
              as: ContractorPlanner
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"
            - "WorkOrder.${wo_id}.execution_status == MAPPED"

      - name: corner_work_plan_release_without_mapped_span_returns_empty_work_plan
        claim_type: Precondition Enforcement
        grounds: ['validations[priority=44]', 'errors[ERR_EMPTY_WORK_PLAN]', 'state_machines.WorkPlan.DRAFT_to_RELEASED']
        distinguishing_aspect: "A DRAFT plan whose only span is still PLANNED has zero MAPPED spans, so release returns 422 ERR_EMPTY_WORK_PLAN and the plan stays DRAFT."
        test_recipe:
          setup:
            - "Circuit CKT-A and a DRAFT plan holding exactly one span in PLANNED (never mapped)."
          setup_api_calls:
            - call: "POST /vm/prescriptions"
              payload: { voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", base_cycle_years: 4, clearance_radius_ft: 10, effective_from: "2026-01-01" }
              as: UtilityForester
              captures: { presc_id: $.data.id }
            - call: "POST /vm/prescriptions/${presc_id}/activate"
              payload: {}
              as: UtilityForester
            - call: "POST /vm/circuits"
              payload: { circuit_code: "CKT-A", voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", customer_count: 1200, last_trim_completed_on: "2024-03-15" }
              as: UtilityForester
              captures: { ckt_id: $.data.id }
            - call: "POST /vm/work-plans"
              payload: { circuit_id: "${ckt_id}", program_year: 2026, planned_span_miles: 10, budget_cents: 5000000 }
              as: UtilityForester
              captures: { wp_id: $.data.id }
            - call: "POST /vm/work-orders"
              payload: { work_plan_id: "${wp_id}", span_miles: 2.5, billing_method: "UNIT_PRICE", planned_unit_count: 200 }
              as: ContractorPlanner
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /vm/work-plans/${wp_id}/release"
              payload: {}
              as: ContractorPlanner
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_EMPTY_WORK_PLAN"
            - "WorkPlan.${wp_id}.status == DRAFT"
            - "Circuit.${ckt_id}.trim_status == NOT_SCHEDULED"

      - name: corner_billing_line_pay_twice_returns_already_terminal
        claim_type: Terminal State Lockdown
        grounds: ['state_machines.BillingLine.APPROVED_to_PAID', 'errors[ERR_ALREADY_TERMINAL]', 'validations[priority=11]']
        distinguishing_aspect: "PAID is a terminal state of BillingLine: the second pay call returns 409 ERR_ALREADY_TERMINAL and WorkOrder.billing_status stays SETTLED."
        test_recipe:
          setup:
            - "A completed UNIT_PRICE span with a line worth 820800 cents that has been submitted, approved and paid."
          setup_api_calls:
            - call: "POST /vm/prescriptions"
              payload: { voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", base_cycle_years: 4, clearance_radius_ft: 10, effective_from: "2026-01-01" }
              as: UtilityForester
              captures: { presc_id: $.data.id }
            - call: "POST /vm/prescriptions/${presc_id}/activate"
              payload: {}
              as: UtilityForester
            - call: "POST /vm/circuits"
              payload: { circuit_code: "CKT-A", voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", customer_count: 1200, last_trim_completed_on: "2024-03-15" }
              as: UtilityForester
              captures: { ckt_id: $.data.id }
            - call: "POST /vm/work-plans"
              payload: { circuit_id: "${ckt_id}", program_year: 2026, planned_span_miles: 10, budget_cents: 5000000 }
              as: UtilityForester
              captures: { wp_id: $.data.id }
            - call: "POST /vm/work-orders"
              payload: { work_plan_id: "${wp_id}", span_miles: 2.5, billing_method: "UNIT_PRICE", planned_unit_count: 200 }
              as: ContractorPlanner
              captures: { wo_id: $.data.id }
            - call: "POST /vm/work-orders/${wo_id}/map"
              payload: { clearance_radius_ft: 12 }
              as: ContractorPlanner
            - call: "POST /vm/work-plans/${wp_id}/release"
              payload: {}
              as: ContractorPlanner
            - call: "POST /vm/work-orders/${wo_id}/release"
              payload: {}
              as: ContractorPlanner
            - call: "POST /vm/crews"
              payload: { crew_code: "CRW-1", crew_type: "BUCKET", headcount: 3, hourly_rate_cents: 8533, home_district: "NORTH" }
              as: ContractorPlanner
              captures: { crew1_id: $.data.id }
            - call: "POST /vm/crew-assignments"
              payload: { work_order_id: "${wo_id}", crew_id: "${crew1_id}", start_at: "2026-08-03T08:00:00Z", end_at: "2026-08-03T16:00:00Z" }
              as: ContractorPlanner
              captures: { ca_id: $.data.id }
            - call: "POST /vm/work-orders/${wo_id}/start"
              payload: {}
              as: ContractorPlanner
            - call: "POST /vm/production-entries"
              payload: { crew_assignment_id: "${ca_id}", work_date: "2026-08-03", units_trimmed: 180, labor_hours: 8, equipment_hours: 6, disposal_tons: 1 }
              as: CrewForeman
              as_user_id: "${crew1_id}"
            - call: "POST /vm/work-orders/${wo_id}/complete"
              payload: {}
