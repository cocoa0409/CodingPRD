            - "ChargingSession.${sa_id}.charging_status == SUSPENDED and allocated_power_kw == 0.0 (hop2)"
            - "ChargingSession.${sb_id}.allocated_power_kw == 60.0 (hop3: freed 60 kW reallocated to surviving CHARGING session B)"

      - name: batch_settle_cascade_lineitems_then_sessions_depth2
        grounds:
          - state_machines.SettlementBatch.LOCKED_to_SETTLED
          - state_machines.ChargingSession.RATED_to_SETTLED
          - entities.SettlementLineItem.fields.status
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (POST settle): batch LOCKED->SETTLED
