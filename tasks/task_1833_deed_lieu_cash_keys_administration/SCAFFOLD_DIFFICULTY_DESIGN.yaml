  # =====================================================================
  # Rule 6 — boundary_precision_check (different metrics, distinct endpoints)
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: marketing_days_89_vs_90
        grounds:
          - calculations.creditable_marketing_days
          - validations[priority=15]
          - errors[ERR_MARKETING_PERIOD_NOT_MET]
        distinguishing_aspect: |
          Numeric-threshold boundary (>= 90, not > 90) on the creditable-days metric
          via POST .../certify-marketing: at exactly 90 days the gate passes; at 89
          it fails. Distinct metric and endpoint from the lien-count and grace-day
          boundary instances.
        test_recipe:
          setup:
            - "DIL case LN-BP1 in MARKETING_PERIOD with one ACTIVE listing dated 2026-05-01; clock first at 2026-07-29 (89 creditable days), then 2026-07-30 (exactly 90)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /property-solutions/loans", payload: { loan_number: "LN-BP1", unpaid_principal_balance_cents: 20000000, accrued_interest_cents: 300000, escrow_advances_cents: 120000, foreclosure_fees_cents: 80000, note_annual_rate: 0.06, fair_market_value_cents: 18000000, delinquency_days: 90 }, as: ServicingAdmin, captures: { loan_id: $.data.id } }
            - { call: "POST /property-solutions/borrowers", payload: { full_name: "A. Borrower", email: "a@x.com", hardship_type: MEDICAL, self_reported_condition_grade: B }, as: ServicingAdmin, captures: { bor_id: $.data.id } }
            - { call: "POST /property-solutions/properties", payload: { loan_id: "${loan_id}", address_line: "1 Main St", county: "Maricopa", state_code: "AZ", occupancy_type: OWNER_OCCUPIED }, as: ServicingAdmin }
            - { call: "POST /property-solutions/cases", payload: { loan_id: "${loan_id}", borrower_id: "${bor_id}", program_type: DEED_IN_LIEU }, as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { case_id: $.data.id } }
            - { call: "POST /property-solutions/cases/${case_id}/submit", as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/cases/${case_id}/evaluate-eligibility", payload: { decision: PASS }, as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/listings", payload: { case_id: "${case_id}", list_date: "2026-05-01", list_price_cents: 19000000 }, as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { lst_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-29T00:00:00Z" }, as: ServicingAdmin }
          trigger:
            - { call: "POST /property-solutions/cases/${case_id}/certify-marketing", as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-30T00:00:00Z" }, as: ServicingAdmin }
            - { call: "GET /property-solutions/listings/${lst_id}", as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { cd90: $.data.creditable_days } }
            - { call: "POST /property-solutions/cases/${case_id}/certify-marketing", as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { st: $.data.status } }
          assert:
            - "First certify-marketing (89 days) -> ERR_MARKETING_PERIOD_NOT_MET (422); case stays MARKETING_PERIOD"
            - "MarketingListing.${lst_id}.creditable_days == 90 on 2026-07-30"
            - "Second certify-marketing (exactly 90 days) -> 200; case status TITLE_REVIEW"

      - name: unreleased_lien_count_zero_gate
        grounds:
          - validations[priority=20]
          - state_machines.TitleCommitment.RECEIVED_to_CLEARED
          - errors[ERR_JUNIOR_LIENS_OUTSTANDING]
        distinguishing_aspect: |
          Empty-set boundary on the unreleased-lien COUNT metric via
          POST .../certify-title: exactly 1 outstanding lien blocks; releasing it
          (count 0) unblocks via the bubble-up CLEARED transition. Different metric
          (collection emptiness) and endpoint than the marketing-days boundary.
        test_recipe:
          setup:
            - "DIL case LN-BP2 in TITLE_REVIEW; commitment received, then one junior lien added (position 2, 50000) so unreleased_lien_count == 1"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /property-solutions/loans", payload: { loan_number: "LN-BP2", unpaid_principal_balance_cents: 20000000, accrued_interest_cents: 300000, escrow_advances_cents: 120000, foreclosure_fees_cents: 80000, note_annual_rate: 0.06, fair_market_value_cents: 18000000, delinquency_days: 90 }, as: ServicingAdmin, captures: { loan_id: $.data.id } }
            - { call: "POST /property-solutions/borrowers", payload: { full_name: "A. Borrower", email: "a@x.com", hardship_type: MEDICAL, self_reported_condition_grade: B }, as: ServicingAdmin, captures: { bor_id: $.data.id } }
            - { call: "POST /property-solutions/properties", payload: { loan_id: "${loan_id}", address_line: "1 Main St", county: "Maricopa", state_code: "AZ", occupancy_type: OWNER_OCCUPIED }, as: ServicingAdmin }
            - { call: "POST /property-solutions/cases", payload: { loan_id: "${loan_id}", borrower_id: "${bor_id}", program_type: DEED_IN_LIEU }, as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { case_id: $.data.id } }
            - { call: "POST /property-solutions/cases/${case_id}/submit", as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/cases/${case_id}/evaluate-eligibility", payload: { decision: PASS }, as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/listings", payload: { case_id: "${case_id}", list_date: "2026-05-01", list_price_cents: 19000000 }, as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ServicingAdmin }
