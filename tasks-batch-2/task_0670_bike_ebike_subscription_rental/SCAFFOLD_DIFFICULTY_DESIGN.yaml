          Depth-3 cascade from inspect: (1) inspect runs return_settlement on the RentalAgreement,
          (2) that settlement releases the Bike (OUT->AVAILABLE), (3) that bike release recomputes
          BikeModel.available_count — each hop caused by the prior, not by the inspect call directly.
        test_recipe:
          setup:
            - "STANDARD model deposit 20000, single bike; rental ACTIVE then RETURN_REQUESTED; due 2026-06-12, returned on time 2026-06-11."
