      - name: member_withdraw_revokes_award_releases_fund_reservation
        grounds:
          - state_machines.Member.ACTIVE_to_WITHDRAWN
          - state_machines.ScholarshipAward.ACTIVE_to_REVOKED
          - calculations.scholarship_fund_accounting
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (member withdrawal):
          withdraw -> the member's ACTIVE award is REVOKED (mutation caused by
          withdrawal) -> the revocation releases the reservation on the fund
          (reserved 4000 -> 0, available 46000 -> 50000), a mutation caused by
          the revocation; the fund fields do NOT change if the award is skipped.
        test_recipe:
          setup:
            - "PAID member ACTIVE; fund budget 50000; award annual_cap 4000 ACTIVATED (reserved 4000, available 46000, disbursed 0)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /sites"
