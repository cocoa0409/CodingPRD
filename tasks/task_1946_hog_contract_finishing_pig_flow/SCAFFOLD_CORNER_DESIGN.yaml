            - { call: "POST /contracts/${contract_id}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /barns", payload: { site_id: "${site_id}", barn_code: "B1", capacity_head: 1200, floor_space_sqft: 9600 }, as: IntegratorAdmin, captures: { barn_id: $.data.id, barn_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-02-15T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups", payload: { barn_id: "${barn_id}", contract_id: "${contract_id}", placement_date: "2026-03-02", target_market_date: "2026-07-13", head_placed: 100, avg_start_weight_lbs: 50.0, expected_barn_version: "${barn_v}" }, as: FieldTech, captures: { group_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-02T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups/${group_id}/confirm-placement", payload: {}, as: FieldTech }
            - { call: "POST /pig-groups/${group_id}/close-out", payload: {}, as: FieldTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-02T12:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /barn-washes", payload: { barn_id: "${barn_id}", wash_type: "FULL_DISINFECT", completed_at: "2026-03-02T12:00:00Z" }, as: Grower, as_user_id: "${grower_id}", captures: { bw1: $.data.id } }
          trigger:
