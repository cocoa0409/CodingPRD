        distinguishing_aspect: "OCC on SurgicalCase.version: reschedule with the version observed at create succeeds (1 -> 2); replaying the same expected version is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Case created (version 1 captured from create response)"]
