# ===========================================================================
  # Rule 3 — non_linear_state_machine (≥ 2 instances, different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: preauthorization_parallel_review_and_consumption_dimensions
        grounds:
          - state_machines.Preauthorization."CLINICAL_REVIEW / UNCONSUMED"_to_"DENIED / UNCONSUMED"
          - state_machines.Preauthorization."DENIED / UNCONSUMED"_to_"CLINICAL_REVIEW / UNCONSUMED"
          - state_machines.Preauthorization."APPROVED / UNCONSUMED"_to_"APPROVED / PARTIALLY_CONSUMED"
          - entities.Preauthorization.fields.consumption_status
          - errors[ERR_CLINIC_CONTRACT_FROZEN]
        distinguishing_aspect: "Preauthorization carries two INDEPENDENT state dimensions on one row — review_status and consumption_status — so a row can sit at DENIED while its consumption dimension is untouched, loop DENIED to CLINICAL_REVIEW and back, and later sit at APPROVED while consumption advances UNCONSUMED to PARTIALLY_CONSUMED; no linear A-to-B-to-C pipeline can express a row that is simultaneously DENIED in one dimension and UNCONSUMED in another."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. CONCURRENT_BUNDLE employer E5, bundle B5, advocate A5, member M8 CARE_ACTIVE, clinic C5 CONTRACTED on an ACTIVE 1450000-rate contract."
