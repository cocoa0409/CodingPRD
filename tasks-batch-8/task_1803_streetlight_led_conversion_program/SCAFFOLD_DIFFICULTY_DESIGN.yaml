      setup:
      - ACTIVE program, RESIDENTIAL district, crew; one UTILITY_OWNED pole 90W (tier T1 -> STANDARD priority, sla 96h)
      - Ticket reported at the default clock 2026-08-01T00:00:00Z by citizen-1, TRIAGED, DISPATCHED to the crew
