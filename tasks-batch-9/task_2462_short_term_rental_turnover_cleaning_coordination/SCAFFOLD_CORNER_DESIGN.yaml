            - "C_QUAL (skill 2, quality 90.00) is created FIRST; C_SKILL (skill 4, quality 70.00) second. Both are ACTIVE with home_zone_code ZONE_A."
            - "T5 is in PENDING_ASSIGNMENT with window 16:00Z-20:30Z (270 minutes)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
