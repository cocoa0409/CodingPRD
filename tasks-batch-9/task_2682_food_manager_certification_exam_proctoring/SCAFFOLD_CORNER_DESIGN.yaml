        excluded_because:
          difficulty_instance: resource_temporal_overlap / proctor_exclusive_occupancy_rejects_14_minute_gap_allows_exactly_15
          rationale: "That §1.8 instance tests the 14-minute rejection and the exactly-15-minute acceptance on both sides of the buffer."
      - name: site_seat_half_open_adjacency
        claim_type: interval_merge
        grounds:
