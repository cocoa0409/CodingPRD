            - "QualifyingMove.${move_id}.status == RECORDED and adjudicated_on is null"
            - "CertificateOfEligibility.${coe_id}.status == DRAFT, correction_round_count == 0, risk_flag_count == 0 and provisional_eligibility_end_on is null"
            - "RecruiterAssignment.${asg_id}.status == PLANNED and cancelled_reason is null"
            - "RecordTransferRequest.${req_id}.status == INITIATED, matched_prior_student_id is null, reported_prior_credits == 0.00 and applied_transferred_credits == 0.00"

      - name: corner_adjudicating_an_already_verified_move_returns_move_already_adjudicated
        claim_type: Idempotency
        grounds:
          - validations[priority 6 ERR_MOVE_ALREADY_ADJUDICATED]
