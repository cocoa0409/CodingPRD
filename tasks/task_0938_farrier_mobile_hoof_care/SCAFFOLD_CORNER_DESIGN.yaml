          assert:
            - "response status is 412"
            - "error_id == ERR_STALE_CLIENT_VERSION"
            - "Client.${cl1}.credit_balance_cents == 0"
            - "Client.${cl1}.deposit_balance_cents == 5000"

      - name: corner_version_increments_by_one_on_every_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.Horse, response_envelope]
        distinguishing_aspect: "Two successive PATCH /horses/{id} calls take Horse.version from 1 to 2 to 3, and updated_at moves while created_at does not."
        test_recipe:
          setup: ["One horse."]
          setup_api_calls:
            - call: "POST /barns"
              payload: { name: "Ridgeview", zone: "A", served_weekdays: ["MON", "TUE", "WED", "THU", "FRI"], access_open_minute: 420, access_close_minute: 1020, blackout_dates: [] }
              as: PlatformAdmin
              captures: { barn_a: "$.data.id" }
            - call: "POST /clients"
              payload: { display_name: "Aoi Tanaka", home_barn_id: "${barn_a}" }
              as: PlatformAdmin
              captures: { cl1: "$.data.id" }
            - call: "POST /horses"
              payload: { client_id: "${cl1}", barn_id: "${barn_a}", name: "Comet", routine_cycle_weeks: 6, shoe_size_code: "1" }
              as: PlatformAdmin
              captures: { h1: "$.data.id", h1_v0: "$.data.version" }
          trigger:
            - call: "PATCH /horses/${h1}"
              payload: { routine_cycle_weeks: 7 }
              as: PlatformAdmin
              captures: { h1_v1: "$.data.version" }
            - call: "PATCH /horses/${h1}"
              payload: { requires_sedation: true }
              as: PlatformAdmin
              captures: { h1_v2: "$.data.version" }
          assert:
            - "${h1_v0} == 1, ${h1_v1} == 2 and ${h1_v2} == 3"
            - "Horse.${h1}.routine_cycle_weeks == 7 and requires_sedation == true"
            - "Horse.${h1}.created_at is unchanged across both calls while updated_at advances"

      - name: corner_cascade_side_effects_are_visible_immediately
        claim_type: cascading_side_effects
        grounds: [cascades.CASCADE-A]
        excluded_because:
          difficulty_instance: transitive_cascade / lameness_report_cascades_six_hops_to_stock_transfer_cancellation
          rationale: "That instance asserts all six hops on reads issued right after the triggering request, which is exactly the immediate-consistency claim."

  # =========================================================================
  # Consistency model
  # =========================================================================
  - section: consistency_model
    instances:

      - name: corner_derived_client_counters_reconcile_inside_the_triggering_request
        claim_type: immediate
        grounds: [calculations.no_show_rolling_count, calculations.client_billing_standing, entities.Client.fields.no_show_count_rolling]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / farrier_cert_expired_state_preempts_client_prepay_required_fiscal
          rationale: "That instance asserts no_show_count_rolling and billing_standing immediately after the third no-show, with no intervening reconciliation step."

      - name: corner_invoice_recompute_at_stop_completion_is_visible_in_the_same_request
        claim_type: immediate
        grounds: [calculations.invoice_build, calculations.trip_fee_allocation]
        excluded_because:
          difficulty_instance: compensating_invariant / trip_fee_shares_always_sum_back_to_the_stop_fee
          rationale: "That instance reads all three invoices straight after POST /route-stops/{id}/complete and finds the trip-fee shares and multi-horse discounts already applied."
