    roles: [ShiftLead]
    input: [flag_reason]
    output: WasteEntry
    side_effects: ["state_machines.WasteEntry.RECORDED_to_FLAGGED"]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_ENTRY_NOT_FOUND, ERR_INVALID_ENTRY_STATE]

  - method: POST
    path: /waste-entries/{id}/clear-flag
    purpose: Clear a review flag, returning the entry to RECORDED.
    roles: [ShiftLead]
    input: []
    output: WasteEntry
