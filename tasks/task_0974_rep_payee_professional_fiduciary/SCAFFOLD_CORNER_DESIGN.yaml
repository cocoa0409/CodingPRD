      - name: deposit_entitlement_client_mismatch
        claim_type: cross_entity_validation
        grounds: ["validations[priority=23]", "errors[ERR_ENTITLEMENT_ACCOUNT_MISMATCH]"]

        distinguishing_aspect: "Cross-entity FK coherence: depositing client B's entitlement payment into client A's account is rejected even though both ids exist."
        test_recipe:
          setup: ["Client A with OPERATING account; client B with an entitlement"]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Mismatch A", date_of_birth: "1963-03-03", ssn_last4: "3030", county_of_residence: "TRV", medicaid_enrolled: false }, as: FiduciaryAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /clients", payload: { legal_name: "Mismatch B", date_of_birth: "1964-04-04", ssn_last4: "4040", county_of_residence: "TRV", medicaid_enrolled: false }, as: FiduciaryAdmin, captures: { cb_id: $.data.id } }
            - { call: "POST /trust-accounts", payload: { client_id: "${ca_id}", account_type: "OPERATING", bank_account_ref: "BA-MM-001" }, as: FinancialOfficer, captures: { aa_id: $.data.id } }
            - { call: "POST /benefit-entitlements", payload: { client_id: "${cb_id}", claim_type: "SSI", monthly_benefit_cents: 80000, effective_start_date: "2026-01-01" }, as: FiduciaryAdmin, captures: { eb_id: $.data.id } }
          trigger:
