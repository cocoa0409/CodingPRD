              captures: { line_f_id: $.data.id }
            - call: "POST /epr/reports/${rep_id}/submit"
              payload: {}
              as: ProducerComplianceOfficer
              as_user_id: "${p4_id}"
          trigger:
            - call: "POST /epr/reports/${rep_id}/assess"
