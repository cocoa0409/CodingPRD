              captures: { ins: $.data.insurance_status, total: $.data.total_copay_cents }
          assert:
            - "the line's refill_pct_used == 71 — floor(100 x 20 / 28) where 20 = 2026-08-15 minus 2026-07-26"
            - "${ins} == CLEARED because 71 >= the plan's 60; under the default 75 the identical history would have produced HELD_TOO_SOON"
            - "${total} == 762 and the line is ADJUDICATED with days_supply_filled 28"
            - "InsurancePlan.${plan_id}.refill_too_soon_threshold_pct == 60 — the supplied value, not the 75 default"

      - name: per_line_copay_rounds_half_up_at_exact_half_cents
        claim_type: precision
        grounds:
          - calculations.cycle_copay_cents
          - entities.CycleLine.fields.copay_cents
          - entities.InsurancePlan.fields.coinsurance_pct
        distinguishing_aspect: "Both lines land on an exact .5 cent, the only input class where half-up, half-down and banker's rounding disagree; truncation would under-bill by 1 cent per line."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z; plan with coinsurance_pct 50 (patient factor 0.5), generic rate 33 and specialty rate 45 cents per day"
            - "synchronized patient with one GENERIC and one SPECIALTY tablet, both clearing the refill edit"
            - "cycle C1 opened with day_supply_days 25, so every line fills exactly 25 days"
          setup_api_calls:
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pharmacy/insurance-plans"
              payload: { payer_name: "Northwind PBM", bin_number: "610502", generic_copay_cents_per_day: 33, brand_copay_cents_per_day: 74, specialty_copay_cents_per_day: 45, refill_too_soon_threshold_pct: 75, coinsurance_pct: 50 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Rosa Klein", date_of_birth: "1954-09-09", email: "rosa.klein@example.com", state_code: "WA", insurance_plan_id: "${plan_id}" }
              as: PharmacyOperations
              captures: { pt_id: $.data.id }
            - call: "POST /pharmacy/prescriptions"
              payload: { patient_id: "${pt_id}", prescriber_npi: "1487654321", drug_name: "Metformin ER", ndc: "00093-1049-01", strength: "500mg", form: "TABLET", copay_tier: "GENERIC", dose_times: ["MORNING"], quantity_per_dose: 1, days_supply_written: 30, refills_authorized: 3, written_date: "2026-05-01", expiration_date: "2027-05-01", last_dispensed_date: "2026-07-25", last_dispensed_days_supply: 28 }
              as: Prescriber
              captures: { rx_a: $.data.id }
            - call: "POST /pharmacy/prescriptions"
              payload: { patient_id: "${pt_id}", prescriber_npi: "1487654321", drug_name: "Sitagliptin", ndc: "00006-0277-31", strength: "100mg", form: "TABLET", copay_tier: "SPECIALTY", dose_times: ["EVENING"], quantity_per_dose: 1, days_supply_written: 30, refills_authorized: 3, written_date: "2026-05-01", expiration_date: "2027-05-01", last_dispensed_date: "2026-07-18", last_dispensed_days_supply: 30 }
              as: Prescriber
              captures: { rx_b: $.data.id }
            - call: "POST /pharmacy/patients/${pt_id}/synchronize"
              payload: { anchor_fill_day: 15, sync_mode: "BRIDGE_TO_START" }
              as: PharmacyOperations
            - call: "POST /pharmacy/fill-cycles"
              payload: { patient_id: "${pt_id}", cycle_start_date: "2026-08-15", day_supply_days: 25 }
              as: PharmacyOperations
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /pharmacy/fill-cycles/${c1}/adjudicate"
              payload: {}
              as: VerifyingPharmacist
              captures: { total: $.data.total_copay_cents }
          assert:
            - "the ${rx_a} line has copay_cents 413 — 33 x 25 x 0.5 = 412.5 rounded HALF UP (412 would be truncation, 412 would also be banker's rounding to even)"
            - "the ${rx_b} line has copay_cents 563 — 45 x 25 x 0.5 = 562.5 rounded HALF UP"
            - "${total} == 976 (413 + 563) under PINNED_ROUND_THEN_SUM, while the unrounded sum is exactly 975.0"
            - "both lines have days_supply_filled 25 and allowance_days 25 = min(90, 30 x 4, 25 + 0 + 0), so priority 37 does not fire"
            - "refill_pct_used is 75 for ${rx_a} and 93 for ${rx_b}, both clearing the 75 threshold"

      - name: sync_variant_is_selected_by_the_pinned_mode_then_overridden_per_cycle
        claim_type: variant_selection
        grounds:
          - calculations.sync_alignment_days
          - entities.Patient.fields.sync_mode
          - endpoints.POST_/pharmacy/fill-cycles
        distinguishing_aspect: "Selection, not arithmetic: the first cycle inherits TRIM_TO_START from the patient with no sync_mode in its body, and the second cycle's explicit body value wins for that cycle alone without re-pinning the patient."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z; patient pinned to TRIM_TO_START at synchronize"
            - "one prescription last dispensed 2026-07-25 for 28 days, so the patient holds supply through 2026-08-22"
            - "each cycle is adjudicated in turn, since the alignment days are stamped onto the lines at adjudication"
          setup_api_calls:
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pharmacy/insurance-plans"
              payload: { payer_name: "Northwind PBM", bin_number: "610502", generic_copay_cents_per_day: 34, brand_copay_cents_per_day: 74, specialty_copay_cents_per_day: 44, refill_too_soon_threshold_pct: 75, coinsurance_pct: 20 }
