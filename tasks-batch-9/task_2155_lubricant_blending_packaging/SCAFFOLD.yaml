scenario: "2155. Lubricant Blending & Packaging (independent lube blender): base-oil & additive package inventory, blend recipe & tank heel contamination, certification/approval (API/OEM) claim control, package configuration & private label, viscosity QC & retain, bulk delivery vs packaged pricing, used-oil take-back linkage, spec change & re-approval — difficulty: harder than expert level"
domain_name: "lubricant-blending-packaging"
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval
    - optimistic_concurrency
  entity_topology: graph
  # graph: ProductSpec, ApprovalClaim, BlendRecipe, PackageConfiguration and BlendBatch form a
  # many-to-many web joined by claim_codes / spec_revision pinning; PackageConfiguration is also
  # self-referential via superseded_by_id. No nesting-only ownership tree.
  state_machine_shape: parallel
  # BlendBatch carries two independent dimensions (production_status x qc_status); ApprovalClaim is
  # cyclic (ACTIVE -> SUSPENDED -> SUBMITTED -> ACTIVE); SpecChangeRequest is a branching fork-join
  # (IN_REVIEW forks into viscosity_review and approval_review, joins at CLEARED); Order and
  # BlendTank both contain revert cycles.
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: legal/trading name of the buying account
      - name: customer_type
        type: enum
        source: input
        description: commercial classification of the account
        constraints: "one of DISTRIBUTOR, FLEET, PRIVATE_LABEL, INDUSTRIAL"
      - name: contract_tier
        type: enum
        source: input
        description: pricing tier; selects the discount percentage in calculations.order_line_pricing and the credit variant in calculations.takeback_credit
        constraints: "one of TIER_A, TIER_B, TIER_C"
      - name: credit_limit_cents
        type: integer
        source: input
        description: maximum Order.pre_credit_total_cents this account may carry on a single confirmed order
        constraints: ">= 0"
      - name: takeback_agreement_status
        type: enum
        source: input
        description: whether a signed used-oil take-back agreement is in force
        default: NONE
        constraints: "one of NONE, ACTIVE, SUSPENDED"
      - name: takeback_credit_balance_cents
        type: integer
        source: computed
        description: running used-oil credit ledger; see calculations.customer_takeback_credit_balance
        default: 0
      - name: last_credit_event_at
        type: datetime
        source: system
        description: logical-clock timestamp of the most recent credit grant or credit application on this account; null until the first such event

  - name: ComponentLot
    parent: null
    common_fields: true
    fields:
      - name: component_type
        type: enum
        source: input
        description: physical class of the material in the lot
        constraints: "one of BASE_OIL, VI_IMPROVER, ADDITIVE_PACKAGE, DYE"
      - name: component_code
        type: string
        source: input
        description: material code shared by every lot of the same material; RecipeComponent.component_code matches on this value
      - name: additive_family
        type: enum
        source: input
        description: chemistry family carried by this material; drives tank heel compatibility
        default: NONE
        constraints: "one of NONE, ZDDP_PCMO, LOW_SAPS, HDEO_API_CK4, GEAR_EP, FOOD_GRADE_H1"
      - name: received_kg
        type: number
        source: input
        description: mass booked in at goods receipt; never changes
        constraints: "> 0"
      - name: available_kg
        type: number
        source: computed
        description: mass still free to draw; see calculations.component_lot_availability
      - name: unit_cost_cents_per_kg
        type: integer
        source: input
        description: landed cost of this lot in whole cents per kilogram
        constraints: "> 0"
      - name: kv100_cst
        type: number
        source: input
        description: certificate-of-analysis kinematic viscosity at 100 C, in cSt
        constraints: "> 0"
      - name: density_kg_per_l
        type: number
        source: input
        description: certificate-of-analysis density at 15 C
        constraints: "> 0"
      - name: coa_viscosity_verified
        type: boolean
        source: input
        description: whether the incoming COA viscosity was independently re-tested; false forces BlendBatch.claim_eligible to false for any batch drawing this lot
        default: true
      - name: status
        type: enum
        source: system
        description: lot disposition
        default: AVAILABLE
        constraints: "one of AVAILABLE, QUARANTINED, DEPLETED"
      - name: quarantine_reason
        type: string
        source: system
        description: free text recorded when the lot is quarantined; null otherwise

  - name: ProductSpec
    parent: null
    common_fields: true
    fields:
      - name: product_code
        type: string
        source: input
        description: unique finished-product code
        constraints: "unique across all ProductSpec rows"
      - name: sae_grade
        type: string
        source: input
        description: SAE viscosity grade label, e.g. 0W-20
      - name: revision
        type: integer
        source: computed
        description: monotonically increasing spec revision; incremented only by the SpecChangeRequest CLEARED -> EFFECTIVE transition
        default: 1
      - name: status
        type: enum
        source: system
        description: spec lifecycle state
        default: DRAFT
        constraints: "one of DRAFT, ACTIVE, WITHDRAWN"
      - name: target_kv100_cst
        type: number
        source: input
        description: nominal kinematic viscosity at 100 C, in cSt
        constraints: "> 0"
      - name: kv100_tolerance_pct
        type: number
        source: input
        description: symmetric tolerance band half-width, in percent of target_kv100_cst
        constraints: "> 0 and <= 25"
      - name: min_additive_treat_pct
        type: number
        source: input
        description: minimum total ADDITIVE_PACKAGE mass fraction any recipe for this spec must carry
        constraints: ">= 0 and <= 100"
      - name: base_stock_group
        type: enum
        source: input
        description: API base-oil group required by this spec
        constraints: "one of GROUP_I, GROUP_II, GROUP_III, GROUP_IV"
      - name: additive_family
        type: enum
        source: input
        description: chemistry family of the finished product; compared against BlendTank.heel_additive_family
        constraints: "one of ZDDP_PCMO, LOW_SAPS, HDEO_API_CK4, GEAR_EP, FOOD_GRADE_H1"
      - name: effective_from
        type: datetime
        source: system
        description: logical-clock timestamp at which the spec was activated; null while DRAFT

  - name: BlendRecipe
    parent: ProductSpec
    common_fields: true
    fields:
      - name: product_spec_id
        type: string
        source: input
        description: FK -> ProductSpec.id; the spec this recipe formulates
      - name: spec_revision_pinned
        type: integer
        source: system
        description: value of ProductSpec.revision copied at recipe creation; a recipe whose pinned revision falls behind its spec is retired by the spec-change cascade
      - name: status
        type: enum
        source: system
        description: recipe lifecycle state
        default: DRAFT
        constraints: "one of DRAFT, ACTIVE, RETIRED"
      - name: total_mass_basis_kg
        type: number
        source: input
        description: nominal batch mass the mass fractions are quoted against; documentation only, never used in calculations
        constraints: "> 0"
      - name: additive_treat_pct
        type: number
        source: computed
        description: sum of mass_fraction_pct over this recipe's RecipeComponent rows with component_type == ADDITIVE_PACKAGE, 2 decimal places
      - name: predicted_kv100_cst
        type: number
        source: computed
        description: log-log blended viscosity of the recipe; see calculations.recipe_predicted_kv100
      - name: component_count
        type: integer
        source: computed
        description: number of RecipeComponent rows attached to this recipe

  - name: RecipeComponent
    parent: BlendRecipe
    common_fields: false
    fields:
      - name: blend_recipe_id
        type: string
        source: system
        description: FK -> BlendRecipe.id; owning recipe
      - name: component_code
        type: string
        source: input
        description: material code resolved against ComponentLot.component_code at charge time
      - name: component_type
        type: enum
        source: input
        description: physical class of the material
        constraints: "one of BASE_OIL, VI_IMPROVER, ADDITIVE_PACKAGE, DYE"
      - name: mass_fraction_pct
        type: number
        source: input
        description: percentage of total blend mass contributed by this component
        constraints: "> 0 and <= 100"
      - name: nominal_kv100_cst
        type: number
        source: input
        description: datasheet kinematic viscosity at 100 C used by the log-log blending formula
        constraints: "> 0"
      - name: additive_family
        type: enum
        source: input
        description: chemistry family of this component
        default: NONE
        constraints: "one of NONE, ZDDP_PCMO, LOW_SAPS, HDEO_API_CK4, GEAR_EP, FOOD_GRADE_H1"

  - name: BlendTank
    parent: null
    common_fields: true
    fields:
      - name: tank_code
        type: string
        source: input
        description: unique tank identifier painted on the vessel
        constraints: "unique across all BlendTank rows"
      - name: capacity_l
        type: number
        source: input
        description: nominal working capacity in litres
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: tank disposition
        default: AVAILABLE
        constraints: "one of AVAILABLE, CHARGED, QUARANTINED"
      - name: heel_volume_l
        type: number
        source: input
        description: residual product left in the tank bottom, in litres
        default: 0.0
        constraints: ">= 0"
      - name: heel_additive_family
        type: enum
        source: input
        description: chemistry family of the residual heel; NONE means the tank was flushed clean
        default: NONE
        constraints: "one of NONE, ZDDP_PCMO, LOW_SAPS, HDEO_API_CK4, GEAR_EP, FOOD_GRADE_H1"
      - name: heel_product_code
        type: string
        source: input
        description: product_code of the last product to occupy the tank; null after a flush
      - name: last_flush_at
        type: datetime
        source: system
        description: logical-clock timestamp of the most recent flush; null if never flushed

  - name: BlendBatch
    parent: BlendRecipe
    common_fields: true
    fields:
      - name: blend_recipe_id
        type: string
        source: input
        description: FK -> BlendRecipe.id; the recipe being blended
      - name: batch_code
        type: string
        source: input
        description: unique batch identifier used on the certificate of analysis
        constraints: "unique across all BlendBatch rows"
      - name: planned_volume_l
        type: number
        source: input
        description: intended finished volume in litres
        constraints: "> 0"
      - name: blend_tank_id
        type: string
        source: system
        description: FK -> BlendTank.id; tank the batch was charged into; null while PLANNED
      - name: charge_volume_l
        type: number
        source: system
        description: litres of fresh blend actually charged; null while PLANNED
      - name: charge_mass_kg
        type: number
        source: computed
        description: charge_volume_l converted to mass; see calculations.batch_component_requirement
      - name: window_start
        type: datetime
        source: system
        description: start of the tank occupancy interval claimed by this batch; null while PLANNED
      - name: window_end
        type: datetime
        source: system
        description: end of the tank occupancy interval claimed by this batch; null while PLANNED
      - name: production_status
        type: enum
        source: system
        description: production dimension of the batch state; evolves independently of qc_status
        default: PLANNED
        constraints: "one of PLANNED, CHARGING, BLENDED, RELEASED, QUARANTINED, REWORKED, DISPOSED"
      - name: qc_status
        type: enum
        source: system
        description: quality dimension of the batch state; evolves independently of production_status
        default: PENDING
        constraints: "one of PENDING, SAMPLED, PASSED, FAILED, WAIVED"
      - name: predicted_kv100_cst
        type: number
        source: computed
        description: snapshot of BlendRecipe.predicted_kv100_cst taken at batch creation
      - name: measured_kv100_cst
        type: number
        source: system
        description: measured_value of the most recent KV100 QCResult on this batch; null until one exists
      - name: heel_ratio_actual
        type: number
        source: computed
        description: fraction of the charged volume that is residual heel; see calculations.heel_contamination_ratio
      - name: claim_eligible
        type: boolean
        source: computed
        description: whether this batch may be packaged under an approval claim; see calculations.batch_claim_eligibility
        default: false
      - name: estimated_component_cost_cents
        type: integer
        source: computed
        description: provisional raw-material cost, moving-average variant; see calculations.batch_component_cost
        default: 0
      - name: component_cost_cents
        type: integer
        source: computed
        description: final raw-material cost, consumption-layer variant; see calculations.batch_component_cost
        default: 0
      - name: retain_count
        type: integer
        source: computed
        description: number of RetainSample rows on this batch with status == HELD
        default: 0

  - name: ComponentDraw
    parent: BlendBatch
    common_fields: true
    fields:
      - name: blend_batch_id
        type: string
        source: system
        description: FK -> BlendBatch.id; batch that drew the material
      - name: component_lot_id
        type: string
        source: system
        description: FK -> ComponentLot.id; lot the material came from
      - name: component_code
        type: string
        source: system
        description: material code copied from the lot at draw time
      - name: drawn_kg
        type: number
        source: system
        description: mass drawn from this lot for this batch, 3 decimal places
      - name: unit_cost_cents_per_kg
        type: integer
        source: system
        description: snapshot of ComponentLot.unit_cost_cents_per_kg at draw time
      - name: status
        type: enum
        source: system
        description: draw disposition; RETURNED means the reservation was compensated back to the lot
        default: RESERVED
        constraints: "one of RESERVED, CONSUMED, RETURNED"

  - name: QCResult
    parent: BlendBatch
    common_fields: false
    fields:
      - name: blend_batch_id
        type: string
        source: system
        description: FK -> BlendBatch.id; batch under test
      - name: test_type
        type: enum
        source: input
        description: laboratory test performed
        constraints: "one of KV100, KV40, TBN, FLASH_POINT"
      - name: measured_value
        type: number
        source: input
        description: numeric test reading in the test's native unit
        constraints: "> 0"
      - name: result
        type: enum
        source: computed
        description: pass/fail verdict; see calculations.qc_viscosity_conformance
        constraints: "one of PASS, FAIL"
      - name: tested_at
        type: datetime
        source: system
        description: logical-clock timestamp at which the result was recorded
      - name: technician_user_id
        type: string
        source: system
        description: X-User-ID of the QCTechnician who recorded the result; consumed by the segregation-of-duties check on release and waiver

  - name: RetainSample
    parent: BlendBatch
    common_fields: true
    fields:
      - name: blend_batch_id
        type: string
        source: system
        description: FK -> BlendBatch.id; batch the retain was drawn from
      - name: retain_code
        type: string
        source: input
        description: retain jar label
        constraints: "unique within a batch"
      - name: volume_ml
        type: number
        source: input
        description: retained volume in millilitres
        constraints: ">= 100"
      - name: retained_at
        type: datetime
        source: system
        description: logical-clock timestamp at which the retain was booked
      - name: retention_until
        type: datetime
        source: computed
        description: earliest instant the retain may legally be disposed of; see calculations.retain_retention_window
      - name: status
        type: enum
        source: system
        description: retain disposition
        default: HELD
        constraints: "one of HELD, DISPOSED"

  - name: ApprovalClaim
    parent: ProductSpec
    common_fields: true
    fields:
      - name: product_spec_id
        type: string
        source: input
        description: FK -> ProductSpec.id; spec the claim is asserted against
      - name: claim_body
        type: enum
        source: input
        description: certifying or approving body
        constraints: "one of API, ILSAC, OEM_MB, OEM_VW, OEM_CAT, JASO"
      - name: claim_code
        type: string
        source: input
        description: printed claim string, e.g. API SP; PackageConfiguration.claim_codes matches on this value
      - name: pinned_spec_revision
        type: integer
        source: system
        description: value of ProductSpec.revision copied when the claim was submitted; null while DRAFT and never submitted
      - name: status
        type: enum
        source: system
        description: claim lifecycle state
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, ACTIVE, SUSPENDED, REJECTED, WITHDRAWN"
      - name: licence_number
        type: string
        source: system
        description: licence identifier supplied at approval; null before approval
      - name: valid_until
        type: datetime
        source: system
        description: approval expiry; see calculations.claim_validity_window
      - name: requires_recertification
        type: boolean
        source: system
        description: set true when the spec-change cascade suspends this claim; cleared on the next approval
        default: false
      - name: suspension_reason
        type: string
        source: system
        description: free text recorded when the claim is suspended; null otherwise

  - name: PackageConfiguration
    parent: ProductSpec
    common_fields: true
    fields:
      - name: product_spec_id
        type: string
        source: input
        description: FK -> ProductSpec.id; finished product being packaged
      - name: customer_id
        type: string
        source: input
        description: FK -> Customer.id; private-label owner; null for house-brand configurations
      - name: package_type
        type: enum
        source: input
        description: pack format; selects the base rate in calculations.order_line_pricing
        constraints: "one of BULK, IBC_1000L, DRUM_205L, PAIL_20L, CASE_12X1L"
      - name: label_brand
        type: string
        source: input
        description: brand name printed on the label
      - name: private_label
        type: boolean
        source: input
        description: whether the label belongs to the customer rather than the blender
        default: false
      - name: fill_volume_l
        type: number
        source: input
        description: litres of product delivered per ordered unit
        constraints: "> 0"
      - name: units_per_case
        type: integer
        source: input
        description: bottles per case for CASE_12X1L; null for every other package_type
      - name: claim_codes
        type: array
        source: input
        description: list of ApprovalClaim.claim_code strings printed on this label; empty array means the label carries no approval claim
        default: []
      - name: status
        type: enum
        source: system
        description: configuration lifecycle state
        default: DRAFT
        constraints: "one of DRAFT, ACTIVE, CLAIM_BLOCKED, SUPERSEDED, RETIRED"
      - name: superseded_by_id
        type: string
        source: system
        description: FK -> PackageConfiguration.id; newer configuration that displaced this one on the same (product_spec_id, package_type, customer_id) triple; null while current

  - name: PackagingLine
    parent: null
    common_fields: true
    fields:
      - name: line_code
        type: string
        source: input
        description: unique filling-line identifier
        constraints: "unique across all PackagingLine rows"
      - name: max_concurrent_runs
        type: integer
        source: input
        description: number of filling heads; the aggregate capacity used by the packaging overlap rule
        default: 2
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: line availability
        default: AVAILABLE
        constraints: "one of AVAILABLE, DOWN"
      - name: scheduled_run_count
        type: integer
        source: computed
        description: number of PackagingRun rows on this line with status IN {SCHEDULED, RUNNING}
        default: 0

  - name: PackagingRun
    parent: null
    common_fields: true
    fields:
      - name: blend_batch_id
        type: string
        source: input
        description: FK -> BlendBatch.id; released batch being packed
      - name: package_configuration_id
        type: string
        source: input
        description: FK -> PackageConfiguration.id; pack format and label being produced
      - name: packaging_line_id
        type: string
        source: input
        description: FK -> PackagingLine.id; line the run occupies
      - name: window_start
        type: datetime
        source: input
        description: inclusive start of the line occupancy interval
      - name: window_end
        type: datetime
        source: input
        description: inclusive end of the line occupancy interval
        constraints: "> window_start"
      - name: planned_units
        type: integer
        source: input
        description: units scheduled to be filled
        constraints: "> 0"
      - name: produced_units
        type: integer
        source: system
        description: units actually filled; null until the run completes
      - name: status
        type: enum
        source: system
        description: run lifecycle state
        default: SCHEDULED
        constraints: "one of SCHEDULED, RUNNING, COMPLETED, CANCELLED"
      - name: cancel_reason
        type: string
        source: system
        description: free text recorded on cancellation; null otherwise

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: FK -> Customer.id; buying account
      - name: delivery_mode
        type: enum
        source: input
        description: whether the order ships as bulk tanker litres or as packaged units; selects the freight branch in calculations.order_freight_and_credit
        constraints: "one of BULK_DELIVERY, PACKAGED"
      - name: takeback_linked
        type: boolean
        source: input
        description: whether used-oil take-back credit may be applied to this order
        default: false
      - name: status
        type: enum
        source: system
        description: order lifecycle state
        default: DRAFT
        constraints: "one of DRAFT, CONFIRMED, HOLD, INVOICED, VOID"
      - name: subtotal_cents
        type: integer
        source: computed
        description: sum of per-line rounded line_total_cents; see calculations.order_line_pricing
        default: 0
      - name: total_volume_l
        type: number
        source: computed
        description: sum of OrderLine.volume_l over lines with status == OPEN, 2 decimal places
        default: 0
      - name: freight_surcharge_cents
        type: integer
        source: computed
        description: freight component; see calculations.order_freight_and_credit step 2
        default: 0
      - name: pre_credit_total_cents
        type: integer
        source: computed
        description: subtotal_cents + freight_surcharge_cents; the base the take-back credit cap is computed on
        default: 0
      - name: takeback_credit_applied_cents
        type: integer
        source: computed
        description: used-oil credit drawn against this order; see calculations.order_freight_and_credit step 4
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: pre_credit_total_cents - takeback_credit_applied_cents
        default: 0
      - name: hold_reason
        type: string
        source: system
        description: free text recorded when the order is put on hold; null otherwise

  - name: OrderLine
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: system
        description: FK -> Order.id; owning order
      - name: package_configuration_id
        type: string
        source: input
        description: FK -> PackageConfiguration.id; what is being bought
      - name: quantity_units
        type: integer
        source: input
        description: number of packaged units (or bulk litre-units) ordered
        constraints: "> 0"
      - name: volume_l
        type: number
        source: computed
        description: quantity_units * PackageConfiguration.fill_volume_l, 2 decimal places
      - name: unit_price_cents
        type: integer
        source: computed
        description: display price of one unit; see calculations.order_line_pricing. Deliberately NOT a factor of line_total_cents
      - name: line_total_cents
        type: integer
        source: computed
        description: rounded extended price of the line; see calculations.order_line_pricing
      - name: status
        type: enum
        source: system
        description: line disposition
        default: OPEN
        constraints: "one of OPEN, HOLD, CANCELLED"

  - name: TakebackCollection
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: FK -> Customer.id; account whose used oil is collected
      - name: order_id
        type: string
        source: input
        description: FK -> Order.id; delivery this collection is piggy-backed onto; null for standalone collections
      - name: scheduled_volume_l
        type: number
        source: input
        description: litres the customer expects to hand over; documentation only
      - name: collected_volume_l
        type: number
        source: system
        description: litres actually collected; null until collection
      - name: water_pct
        type: number
        source: system
        description: assayed water content in percent; null until assay
      - name: sediment_pct
        type: number
        source: system
        description: assayed sediment content in percent; null until assay
      - name: status
        type: enum
        source: system
        description: collection lifecycle state
        default: SCHEDULED
        constraints: "one of SCHEDULED, COLLECTED, ASSAYED, CREDITED, REJECTED"
      - name: credit_variant
        type: enum
        source: computed
        description: which variant of calculations.takeback_credit produced credit_cents; null until credited
        constraints: "one of FLAT_RATE, ASSAY_ADJUSTED"
      - name: credit_cents
        type: integer
        source: computed
        description: credit granted to the customer ledger; see calculations.takeback_credit
        default: 0
      - name: reject_reason
        type: string
        source: system
        description: free text recorded when the collection is rejected; null otherwise

  - name: SpecChangeRequest
    parent: ProductSpec
    common_fields: true
    fields:
      - name: product_spec_id
        type: string
        source: system
        description: FK -> ProductSpec.id; spec proposed for change
      - name: requested_kv100_cst
        type: number
        source: input
        description: proposed replacement for ProductSpec.target_kv100_cst
        constraints: "> 0"
      - name: requested_kv100_tolerance_pct
        type: number
        source: input
        description: proposed replacement for ProductSpec.kv100_tolerance_pct
        constraints: "> 0 and <= 25"
      - name: requested_min_additive_treat_pct
        type: number
        source: input
        description: proposed replacement for ProductSpec.min_additive_treat_pct
        constraints: ">= 0 and <= 100"
      - name: requested_additive_family
        type: enum
        source: input
        description: proposed replacement for ProductSpec.additive_family
        constraints: "one of ZDDP_PCMO, LOW_SAPS, HDEO_API_CK4, GEAR_EP, FOOD_GRADE_H1"
      - name: status
        type: enum
        source: system
        description: change-request lifecycle state
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, IN_REVIEW, CLEARED, REJECTED, EFFECTIVE, WITHDRAWN"
      - name: viscosity_review
        type: enum
        source: system
        description: verdict of the viscosity branch of the fork
        default: PENDING
        constraints: "one of PENDING, CLEARED, BLOCKED"
      - name: approval_review
        type: enum
        source: system
        description: verdict of the certification branch of the fork
        default: PENDING
        constraints: "one of PENDING, CLEARED, BLOCKED"
      - name: claims_to_suspend_count
        type: integer
        source: computed
        description: number of ApprovalClaim rows on the spec with status == ACTIVE at the moment the approval branch is decided; recorded by the approval-review transition
        default: 0
      - name: effective_revision
        type: integer
        source: system
        description: ProductSpec.revision produced by making this request effective; null until EFFECTIVE

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: ProductSpec
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /product-specs/{id}/activate"
        actor: ProductManager
        preconditions:
          - "ProductSpec.status == DRAFT"
        side_effects:
          - "set effective_from = logical clock now"
          - "increments ProductSpec.version by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "system: SpecChangeRequest CLEARED -> EFFECTIVE (cascade A, link 1)"
        actor: system
        preconditions:
          - "ProductSpec.status == ACTIVE"
        side_effects:
          - "revision = revision + 1"
          - "target_kv100_cst = request.requested_kv100_cst; kv100_tolerance_pct = request.requested_kv100_tolerance_pct; min_additive_treat_pct = request.requested_min_additive_treat_pct; additive_family = request.requested_additive_family"
          - "increments ProductSpec.version by 1"
          - "cascade A link 2 fires because revision advanced: every ApprovalClaim on this spec with status == ACTIVE and pinned_spec_revision < revision transitions ACTIVE -> SUSPENDED"
          - "cascade A link 5 fires because revision advanced: every BlendRecipe on this spec with status == ACTIVE and spec_revision_pinned < revision transitions ACTIVE -> RETIRED"
        note: "Self-loop revision bump; the spec row is never replaced, so every FK pointing at it stays valid while the pinned revisions go stale."
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /product-specs/{id}/withdraw"
        actor: ProductManager
        preconditions:
          - "ProductSpec.status == ACTIVE"
          - "no ApprovalClaim on this spec has status == ACTIVE"
        side_effects:
          - "every BlendRecipe on this spec with status == ACTIVE transitions ACTIVE -> RETIRED"
          - "increments ProductSpec.version by 1"

  - entity: ComponentLot
    initial_state: AVAILABLE
    terminal_states: [DEPLETED]
    transitions:
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "POST /component-lots/{id}/quarantine"
        actor: QualityManager
        preconditions:
          - "ComponentLot.status == AVAILABLE"
        side_effects:
          - "set quarantine_reason from request"
          - "increments ComponentLot.version by 1"
      - from: AVAILABLE
        to: DEPLETED
        trigger: "system: BlendBatch PLANNED -> CHARGING draws the lot down to zero"
        actor: system
        preconditions:
          - "available_kg reaches exactly 0 after the draw"
        side_effects:
          - "increments ComponentLot.version by 1"
      - from: DEPLETED
        to: AVAILABLE
        trigger: "system: BlendBatch CHARGING -> PLANNED returns a reserved draw"
        actor: system
        preconditions:
          - "ComponentDraw.status == RESERVED on this lot for the cancelled batch"
        side_effects:
          - "available_kg restored per calculations.component_lot_availability"
          - "increments ComponentLot.version by 1"

  - entity: BlendRecipe
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /blend-recipes/{id}/activate"
        actor: ProductManager
        preconditions:
          - "BlendRecipe.status == DRAFT"
          - "ProductSpec.status == ACTIVE"
          - "spec_revision_pinned == ProductSpec.revision"
          - "sum of RecipeComponent.mass_fraction_pct == 100.00 exactly"
          - "additive_treat_pct >= ProductSpec.min_additive_treat_pct"
          - "predicted_kv100_cst within the spec band per calculations.qc_viscosity_conformance bounds"
        side_effects:
          - "increments BlendRecipe.version by 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "system: ProductSpec revision advanced (cascade A link 5) or ProductSpec ACTIVE -> WITHDRAWN"
        actor: system
        preconditions:
          - "BlendRecipe.status == ACTIVE"
          - "spec_revision_pinned < ProductSpec.revision, or the spec was withdrawn"
        side_effects:
          - "increments BlendRecipe.version by 1"

  - entity: BlendTank
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: CHARGED
        trigger: "POST /blend-batches/{id}/charge"
        actor: BlendOperator
        preconditions:
          - "BlendTank.status == AVAILABLE"
        side_effects:
          - "increments BlendTank.version by 1"
      - from: CHARGED
        to: AVAILABLE
        trigger: "POST /blend-batches/{id}/release"
        actor: QualityManager
        preconditions:
          - "BlendTank.status == CHARGED"
        side_effects:
          - "heel_volume_l = round_half_up(BlendBatch.charge_volume_l * HEEL_RETENTION_PCT / 100, 3) with HEEL_RETENTION_PCT = 0.5"
          - "heel_additive_family = ProductSpec.additive_family of the released batch"
          - "heel_product_code = ProductSpec.product_code of the released batch"
          - "increments BlendTank.version by 1"
      - from: CHARGED
        to: AVAILABLE
        trigger: "POST /blend-batches/{id}/cancel-charge"
        actor: BlendOperator
        preconditions:
          - "BlendTank.status == CHARGED"
        side_effects:
          - "heel_volume_l, heel_additive_family and heel_product_code are left exactly as they were before the charge"
          - "increments BlendTank.version by 1"
      - from: CHARGED
        to: QUARANTINED
        trigger: "system: BlendBatch BLENDED -> QUARANTINED (cascade B, link 4)"
        actor: system
        preconditions:
          - "BlendTank.status == CHARGED"
        side_effects:
          - "increments BlendTank.version by 1"
      - from: QUARANTINED
        to: AVAILABLE
        trigger: "POST /blend-tanks/{id}/flush"
        actor: BlendOperator
        preconditions:
          - "BlendTank.status IN {AVAILABLE, QUARANTINED}"
          - "no BlendBatch on this tank has production_status IN {CHARGING, BLENDED}"
        side_effects:
          - "heel_volume_l = 0.0; heel_additive_family = NONE; heel_product_code = null"
          - "last_flush_at = logical clock now"
          - "increments BlendTank.version by 1"
      - from: AVAILABLE
        to: AVAILABLE
        trigger: "POST /blend-tanks/{id}/flush"
        actor: BlendOperator
        preconditions:
          - "BlendTank.status == AVAILABLE"
        side_effects:
          - "heel_volume_l = 0.0; heel_additive_family = NONE; heel_product_code = null"
          - "last_flush_at = logical clock now"
          - "increments BlendTank.version by 1"

  - entity: BlendBatch
    initial_state: PLANNED
    terminal_states: [DISPOSED]
    transitions:
      # ---- production dimension ----
      - from: PLANNED
        to: CHARGING
        trigger: "POST /blend-batches/{id}/charge"
        actor: BlendOperator
        preconditions:
          - "BlendBatch.production_status == PLANNED"
          - "BlendRecipe.status == ACTIVE"
          - "ProductSpec.status == ACTIVE and BlendRecipe.spec_revision_pinned == ProductSpec.revision"
          - "BlendTank.status == AVAILABLE"
          - "window_end > window_start"
          - "no tank window conflict per validations[priority=24]"
          - "heel compatibility and heel ratio pass per validations[priority=17] and validations[priority=18]"
          - "every required component_code resolves to ComponentLot rows with status == AVAILABLE whose summed available_kg >= required_kg; a shortfall that QUARANTINED lots of the same code would have covered is refused at validations[priority=19] instead of validations[priority=35]"
        side_effects:
          - "set blend_tank_id, charge_volume_l, window_start, window_end from the request"
          - "compute charge_mass_kg and per-component required_kg per calculations.batch_component_requirement"
          - "compute heel_ratio_actual per calculations.heel_contamination_ratio"
          - "compute estimated_component_cost_cents via calculations.batch_component_cost variant moving_average_cost"
          - "create one ComponentDraw row per consumed lot layer with status RESERVED per calculations.batch_component_cost variant consumption_layer_cost draw order"
          - "each drawn ComponentLot.available_kg is reduced by the drawn_kg (calculations.component_lot_availability); a lot reaching exactly 0 transitions AVAILABLE -> DEPLETED"
          - "compute claim_eligible per calculations.batch_claim_eligibility"
          - "BlendTank AVAILABLE -> CHARGED"
          - "increments BlendBatch.version by 1"
      - from: CHARGING
        to: PLANNED
        trigger: "POST /blend-batches/{id}/cancel-charge"
        actor: BlendOperator
        preconditions:
          - "BlendBatch.production_status == CHARGING"
          - "BlendBatch.qc_status == PENDING"
        side_effects:
          - "every ComponentDraw on this batch with status == RESERVED transitions RESERVED -> RETURNED"
          - "each affected ComponentLot.available_kg is restored per calculations.component_lot_availability; a DEPLETED lot returns to AVAILABLE"
          - "blend_tank_id, charge_volume_l, charge_mass_kg, window_start, window_end, heel_ratio_actual reset to null; estimated_component_cost_cents reset to 0; claim_eligible reset to false"
          - "BlendTank CHARGED -> AVAILABLE with heel fields untouched"
          - "increments BlendBatch.version by 1"
        note: "Compensating action for the charge; conserves calculations.component_lot_availability exactly."
      - from: CHARGING
        to: BLENDED
        trigger: "POST /blend-batches/{id}/complete-blend"
        actor: BlendOperator
        preconditions:
          - "BlendBatch.production_status == CHARGING"
        side_effects:
          - "every ComponentDraw on this batch with status == RESERVED transitions RESERVED -> CONSUMED"
          - "compute component_cost_cents via calculations.batch_component_cost variant consumption_layer_cost"
          - "increments BlendBatch.version by 1"
      - from: REWORKED
        to: BLENDED
        trigger: "POST /blend-batches/{id}/complete-blend"
        actor: BlendOperator
        preconditions:
          - "BlendBatch.production_status == REWORKED"
          - "BlendBatch.qc_status == PENDING"
        side_effects:
          - "component_cost_cents recomputed over the unchanged CONSUMED ComponentDraw set (value is unchanged)"
          - "increments BlendBatch.version by 1"
        note: "Closes the QUARANTINED -> REWORKED -> BLENDED cycle."
      - from: BLENDED
        to: RELEASED
        trigger: "POST /blend-batches/{id}/release"
        actor: QualityManager
        preconditions:
          - "BlendBatch.production_status == BLENDED"
          - "BlendBatch.qc_status IN {PASSED, WAIVED}"
          - "retain_count >= MIN_RETAIN_COUNT (2)"
          - "X-User-ID of the caller does not equal any QCResult.technician_user_id on this batch"
        side_effects:
          - "BlendTank CHARGED -> AVAILABLE with heel fields rewritten from this batch"
          - "increments BlendBatch.version by 1"
      - from: BLENDED
        to: QUARANTINED
        trigger: "POST /blend-batches/{id}/quarantine, or system on a FAIL QCResult (cascade B, link 1)"
        actor: QualityManager
        preconditions:
          - "BlendBatch.production_status == BLENDED"
        side_effects:
          - "cascade B link 2 fires because the batch entered QUARANTINED: every PackagingRun on this batch with status IN {SCHEDULED, RUNNING} transitions to CANCELLED with cancel_reason BATCH_QUARANTINED"
          - "cascade B link 4 fires because the batch entered QUARANTINED: BlendTank CHARGED -> QUARANTINED"
          - "increments BlendBatch.version by 1"
      - from: RELEASED
        to: QUARANTINED
        trigger: "POST /blend-batches/{id}/quarantine (market recall of an already released batch)"
        actor: QualityManager
        preconditions:
          - "BlendBatch.production_status == RELEASED"
        side_effects:
          - "cascade B link 1: the batch enters QUARANTINED"
          - "cascade B link 2 fires because the batch entered QUARANTINED: every PackagingRun on this batch with status IN {SCHEDULED, RUNNING} transitions to CANCELLED with cancel_reason BATCH_QUARANTINED"
          - "cascade B link 4 is skipped: the tank was already handed back at release, so its status is left untouched"
          - "increments BlendBatch.version by 1"
        note: "Origin of cascade B. The tank hop only fires when the tank is still CHARGED by this batch, which is never the case for a released batch."
      - from: QUARANTINED
        to: REWORKED
        trigger: "POST /blend-batches/{id}/rework"
        actor: BlendOperator
        preconditions:
          - "BlendBatch.production_status == QUARANTINED"
          - "BlendBatch.qc_status == FAILED"
        side_effects:
          - "qc_status FAILED -> PENDING; measured_kv100_cst reset to null"
          - "BlendTank QUARANTINED -> QUARANTINED (unchanged; the tank must still be flushed separately)"
          - "increments BlendBatch.version by 1"
      - from: QUARANTINED
        to: DISPOSED
        trigger: "POST /blend-batches/{id}/dispose"
        actor: QualityManager
        preconditions:
          - "BlendBatch.production_status == QUARANTINED"
        side_effects:
          - "ComponentDraw rows stay CONSUMED; no mass is returned to any lot"
          - "increments BlendBatch.version by 1"
      # ---- quality dimension (independent of production_status) ----
      - from: PENDING
        to: SAMPLED
        trigger: "POST /blend-batches/{id}/qc-results (first result on the batch, result == PASS)"
        actor: QCTechnician
        preconditions:
          - "BlendBatch.qc_status == PENDING"
          - "BlendBatch.production_status IN {CHARGING, BLENDED, REWORKED}"
        side_effects:
          - "if test_type == KV100 set measured_kv100_cst = measured_value"
          - "increments BlendBatch.version by 1"
        note: "qc dimension; production_status is untouched."
      - from: SAMPLED
        to: PASSED
        trigger: "POST /blend-batches/{id}/qc-results completing the required set"
        actor: QCTechnician
        preconditions:
          - "BlendBatch.qc_status == SAMPLED"
          - "QCResult rows on this batch cover every test_type in REQUIRED_TESTS {KV100, TBN} and every one of them has result == PASS"
        side_effects:
          - "increments BlendBatch.version by 1"
      - from: PENDING
        to: FAILED
        trigger: "POST /blend-batches/{id}/qc-results with result == FAIL"
        actor: QCTechnician
        preconditions:
          - "BlendBatch.qc_status == PENDING"
        side_effects:
          - "cascade B link 1: if production_status == BLENDED the batch transitions BLENDED -> QUARANTINED"
          - "increments BlendBatch.version by 1"
      - from: SAMPLED
        to: FAILED
        trigger: "POST /blend-batches/{id}/qc-results with result == FAIL"
        actor: QCTechnician
        preconditions:
          - "BlendBatch.qc_status == SAMPLED"
        side_effects:
          - "cascade B link 1: if production_status == BLENDED the batch transitions BLENDED -> QUARANTINED"
          - "increments BlendBatch.version by 1"
      - from: FAILED
        to: WAIVED
        trigger: "POST /blend-batches/{id}/waive-qc"
        actor: QualityManager
        preconditions:
          - "BlendBatch.qc_status == FAILED"
          - "BlendBatch.claim_eligible == false"
          - "X-User-ID of the caller does not equal any QCResult.technician_user_id on this batch"
        side_effects:
          - "increments BlendBatch.version by 1"
      - from: SAMPLED
        to: WAIVED
        trigger: "POST /blend-batches/{id}/waive-qc"
        actor: QualityManager
        preconditions:
          - "BlendBatch.qc_status == SAMPLED"
          - "BlendBatch.claim_eligible == false"
          - "X-User-ID of the caller does not equal any QCResult.technician_user_id on this batch"
        side_effects:
          - "increments BlendBatch.version by 1"

  - entity: ApprovalClaim
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /approval-claims/{id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "ApprovalClaim.status == DRAFT"
          - "ProductSpec.status == ACTIVE"
          - "at least one BlendRecipe on the spec has status == ACTIVE and spec_revision_pinned == ProductSpec.revision"
        side_effects:
          - "pinned_spec_revision = ProductSpec.revision"
          - "increments ApprovalClaim.version by 1"
      - from: SUSPENDED
        to: SUBMITTED
        trigger: "POST /approval-claims/{id}/submit (re-approval after a spec change)"
        actor: ComplianceOfficer
        preconditions:
          - "ApprovalClaim.status == SUSPENDED"
          - "ProductSpec.status == ACTIVE"
          - "at least one BlendRecipe on the spec has status == ACTIVE and spec_revision_pinned == ProductSpec.revision"
        side_effects:
          - "pinned_spec_revision = ProductSpec.revision (re-pinned to the new revision)"
          - "increments ApprovalClaim.version by 1"
        note: "Closes the ACTIVE -> SUSPENDED -> SUBMITTED -> ACTIVE cycle."
      - from: SUBMITTED
        to: ACTIVE
        trigger: "POST /approval-claims/{id}/decision with decision == APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "ApprovalClaim.status == SUBMITTED"
          - "licence_number present in the request"
        side_effects:
          - "licence_number set; requires_recertification = false"
          - "valid_until per calculations.claim_validity_window"
          - "every PackageConfiguration with status == CLAIM_BLOCKED whose claim_codes are now all carried by ACTIVE claims on the same spec transitions CLAIM_BLOCKED -> ACTIVE"
          - "increments ApprovalClaim.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /approval-claims/{id}/decision with decision == REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "ApprovalClaim.status == SUBMITTED"
        side_effects:
          - "increments ApprovalClaim.version by 1"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /approval-claims/{id}/lifecycle with action == REVISE"
        actor: ComplianceOfficer
        preconditions:
          - "ApprovalClaim.status == REJECTED"
        side_effects:
          - "pinned_spec_revision reset to null"
          - "increments ApprovalClaim.version by 1"
        note: "Closes the SUBMITTED -> REJECTED -> DRAFT -> SUBMITTED revision loop."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /approval-claims/{id}/lifecycle with action == SUSPEND, or system on ProductSpec revision advance (cascade A, link 2)"
        actor: ComplianceOfficer
        preconditions:
          - "ApprovalClaim.status == ACTIVE"
        side_effects:
          - "requires_recertification = true; suspension_reason recorded"
          - "cascade A link 3 fires because this claim left ACTIVE: every PackageConfiguration with status == ACTIVE whose claim_codes contains this claim_code transitions ACTIVE -> CLAIM_BLOCKED"
          - "increments ApprovalClaim.version by 1"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /approval-claims/{id}/lifecycle with action == WITHDRAW"
        actor: ComplianceOfficer
        preconditions:
          - "ApprovalClaim.status == ACTIVE"
        side_effects:
          - "every PackageConfiguration with status == ACTIVE whose claim_codes contains this claim_code transitions ACTIVE -> CLAIM_BLOCKED"
          - "increments ApprovalClaim.version by 1"
      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "POST /approval-claims/{id}/lifecycle with action == WITHDRAW"
        actor: ComplianceOfficer
        preconditions:
          - "ApprovalClaim.status == SUSPENDED"
        side_effects:
          - "increments ApprovalClaim.version by 1"

  - entity: PackageConfiguration
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /package-configurations/{id}/activate"
        actor: ProductManager
        preconditions:
          - "PackageConfiguration.status == DRAFT"
          - "ProductSpec.status == ACTIVE"
          - "every claim_code entry matches an ApprovalClaim on the same product_spec_id with status == ACTIVE"
        side_effects:
          - "any other PackageConfiguration with status == ACTIVE and the same (product_spec_id, package_type, customer_id) triple transitions ACTIVE -> SUPERSEDED and has superseded_by_id set to this configuration's id"
          - "increments PackageConfiguration.version by 1"
      - from: ACTIVE
        to: CLAIM_BLOCKED
        trigger: "system: an ApprovalClaim whose claim_code appears in claim_codes left ACTIVE (cascade A, link 3)"
        actor: system
        preconditions:
          - "PackageConfiguration.status == ACTIVE"
          - "claim_codes contains the claim_code of the claim that left ACTIVE"
        side_effects:
          - "cascade A link 4 fires because this configuration left ACTIVE: every OrderLine with status == OPEN referencing this configuration transitions OPEN -> HOLD"
          - "increments PackageConfiguration.version by 1"
      - from: CLAIM_BLOCKED
        to: ACTIVE
        trigger: "system: ApprovalClaim SUBMITTED -> ACTIVE restores every claim_code on this configuration"
        actor: system
        preconditions:
          - "PackageConfiguration.status == CLAIM_BLOCKED"
          - "every claim_code entry matches an ApprovalClaim on the same product_spec_id with status == ACTIVE"
        side_effects:
          - "increments PackageConfiguration.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: a newer PackageConfiguration on the same (product_spec_id, package_type, customer_id) triple is activated"
        actor: system
        preconditions:
          - "PackageConfiguration.status == ACTIVE"
        side_effects:
          - "superseded_by_id = id of the newly activated configuration"
          - "every OrderLine with status == OPEN referencing this configuration transitions OPEN -> HOLD"
          - "increments PackageConfiguration.version by 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /package-configurations/{id}/retire"
        actor: ProductManager
        preconditions:
          - "PackageConfiguration.status IN {DRAFT, ACTIVE, CLAIM_BLOCKED}"
          - "no PackagingRun on this configuration has status IN {SCHEDULED, RUNNING}"
        side_effects:
          - "increments PackageConfiguration.version by 1"
      - from: DRAFT
        to: RETIRED
        trigger: "POST /package-configurations/{id}/retire"
        actor: ProductManager
        preconditions:
          - "PackageConfiguration.status == DRAFT"
        side_effects:
          - "increments PackageConfiguration.version by 1"
      - from: CLAIM_BLOCKED
        to: RETIRED
        trigger: "POST /package-configurations/{id}/retire"
        actor: ProductManager
        preconditions:
          - "PackageConfiguration.status == CLAIM_BLOCKED"
        side_effects:
          - "increments PackageConfiguration.version by 1"

  - entity: PackagingLine
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: DOWN
        trigger: "POST /packaging-lines/{id}/service-status with target_status == DOWN"
        actor: PlatformAdmin
        preconditions:
          - "PackagingLine.status == AVAILABLE"
        side_effects:
          - "increments PackagingLine.version by 1"
      - from: DOWN
        to: AVAILABLE
        trigger: "POST /packaging-lines/{id}/service-status with target_status == AVAILABLE"
        actor: PlatformAdmin
        preconditions:
          - "PackagingLine.status == DOWN"
        side_effects:
          - "increments PackagingLine.version by 1"

  - entity: PackagingRun
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /packaging-runs/{id}/start"
        actor: BlendOperator
        preconditions:
          - "PackagingRun.status == SCHEDULED"
          - "PackagingLine.status == AVAILABLE"
          - "PackageConfiguration.status == ACTIVE"
        side_effects:
          - "increments PackagingRun.version by 1"
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /packaging-runs/{id}/complete"
        actor: BlendOperator
        preconditions:
          - "PackagingRun.status == RUNNING"
        side_effects:
          - "produced_units set from the request"
          - "PackagingLine.scheduled_run_count recomputed (decreases by 1)"
          - "increments PackagingRun.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /packaging-runs/{id}/cancel, or system on BlendBatch entering QUARANTINED (cascade B, link 2)"
        actor: BlendOperator
        preconditions:
          - "PackagingRun.status == SCHEDULED"
        side_effects:
          - "cancel_reason recorded"
          - "cascade B link 3 fires because this run left SCHEDULED: PackagingLine.scheduled_run_count is recomputed and decreases by 1"
          - "increments PackagingRun.version by 1"
      - from: RUNNING
        to: CANCELLED
        trigger: "POST /packaging-runs/{id}/cancel, or system on BlendBatch entering QUARANTINED (cascade B, link 2)"
        actor: BlendOperator
        preconditions:
          - "PackagingRun.status == RUNNING"
        side_effects:
          - "cancel_reason recorded"
          - "cascade B link 3 fires because this run left RUNNING: PackagingLine.scheduled_run_count is recomputed and decreases by 1"
          - "increments PackagingRun.version by 1"

  - entity: Order
    initial_state: DRAFT
    terminal_states: [INVOICED, VOID]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /orders/{id}/confirm"
        actor: SalesRep
        preconditions:
          - "Order.status == DRAFT"
          - "at least one OrderLine with status == OPEN exists"
          - "every OrderLine with status == OPEN references a PackageConfiguration with status == ACTIVE"
          - "if takeback_linked == true then Customer.takeback_agreement_status == ACTIVE"
          - "pre_credit_total_cents <= Customer.credit_limit_cents"
        side_effects:
          - "recompute every OrderLine.volume_l, unit_price_cents and line_total_cents per calculations.order_line_pricing"
          - "recompute subtotal_cents, total_volume_l, freight_surcharge_cents, pre_credit_total_cents and total_cents per calculations.order_freight_and_credit"
          - "increments Order.version by 1"
      - from: CONFIRMED
        to: HOLD
        trigger: "POST /orders/{id}/hold, or system when an OrderLine on this order goes OPEN -> HOLD (cascade A, link 4)"
        actor: SalesRep
        preconditions:
          - "Order.status == CONFIRMED"
        side_effects:
          - "hold_reason recorded"
          - "increments Order.version by 1"
      - from: HOLD
        to: CONFIRMED
        trigger: "POST /orders/{id}/resume"
        actor: SalesRep
        preconditions:
          - "Order.status == HOLD"
          - "every OrderLine on this order with status IN {OPEN, HOLD} references a PackageConfiguration with status == ACTIVE"
        side_effects:
          - "every OrderLine with status == HOLD transitions HOLD -> OPEN"
          - "hold_reason reset to null"
          - "recompute pricing per calculations.order_line_pricing and calculations.order_freight_and_credit"
          - "increments Order.version by 1"
      - from: CONFIRMED
        to: INVOICED
        trigger: "POST /orders/{id}/invoice"
        actor: SalesRep
        preconditions:
          - "Order.status == CONFIRMED"
          - "total_cents > 0"
        side_effects:
          - "increments Order.version by 1"
      - from: CONFIRMED
        to: VOID
        trigger: "POST /orders/{id}/void"
        actor: SalesRep
        preconditions:
          - "Order.status IN {DRAFT, CONFIRMED, HOLD}"
        side_effects:
          - "every OrderLine with status IN {OPEN, HOLD} transitions to CANCELLED"
          - "takeback_credit_applied_cents reset to 0 and total_cents recomputed as pre_credit_total_cents"
          - "Customer.takeback_credit_balance_cents recomputed per calculations.customer_takeback_credit_balance and Customer.version incremented by 1"
          - "increments Order.version by 1"
        note: "Compensating action for POST /orders/{id}/apply-takeback-credit; conserves the customer credit ledger exactly."
      - from: DRAFT
        to: VOID
        trigger: "POST /orders/{id}/void"
        actor: SalesRep
        preconditions:
          - "Order.status == DRAFT"
        side_effects:
          - "every OrderLine with status == OPEN transitions to CANCELLED"
          - "increments Order.version by 1"
      - from: HOLD
        to: VOID
        trigger: "POST /orders/{id}/void"
        actor: SalesRep
        preconditions:
          - "Order.status == HOLD"
        side_effects:
          - "every OrderLine with status IN {OPEN, HOLD} transitions to CANCELLED"
          - "takeback_credit_applied_cents reset to 0; Customer.takeback_credit_balance_cents recomputed and Customer.version incremented by 1"
          - "increments Order.version by 1"

  - entity: OrderLine
    initial_state: OPEN
    terminal_states: [CANCELLED]
    transitions:
      - from: OPEN
        to: HOLD
        trigger: "system: the referenced PackageConfiguration left ACTIVE (cascade A, link 4)"
        actor: system
        preconditions:
          - "OrderLine.status == OPEN"
          - "PackageConfiguration.status IN {CLAIM_BLOCKED, SUPERSEDED}"
        side_effects:
          - "if the owning Order.status == CONFIRMED it transitions CONFIRMED -> HOLD with hold_reason CLAIM_BLOCKED_LINE"
          - "increments OrderLine.version by 1"
      - from: HOLD
        to: OPEN
        trigger: "POST /orders/{id}/resume"
        actor: SalesRep
        preconditions:
          - "OrderLine.status == HOLD"
          - "PackageConfiguration.status == ACTIVE"
        side_effects:
          - "increments OrderLine.version by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /orders/{id}/void"
        actor: SalesRep
        preconditions:
          - "OrderLine.status == OPEN"
        side_effects:
          - "increments OrderLine.version by 1"
      - from: HOLD
        to: CANCELLED
        trigger: "POST /orders/{id}/void"
        actor: SalesRep
        preconditions:
          - "OrderLine.status == HOLD"
        side_effects:
          - "increments OrderLine.version by 1"

  - entity: TakebackCollection
    initial_state: SCHEDULED
    terminal_states: [CREDITED, REJECTED]
    transitions:
      - from: SCHEDULED
        to: COLLECTED
        trigger: "POST /takeback-collections/{id}/collect"
        actor: SalesRep
        preconditions:
          - "TakebackCollection.status == SCHEDULED"
          - "Customer.takeback_agreement_status == ACTIVE"
        side_effects:
          - "collected_volume_l set from the request"
          - "increments TakebackCollection.version by 1"
      - from: COLLECTED
        to: ASSAYED
        trigger: "POST /takeback-collections/{id}/assay"
        actor: QCTechnician
        preconditions:
          - "TakebackCollection.status == COLLECTED"
          - "water_pct + sediment_pct <= MAX_CONTAMINATION_PCT (25)"
        side_effects:
          - "water_pct and sediment_pct set from the request"
          - "increments TakebackCollection.version by 1"
      - from: COLLECTED
        to: REJECTED
        trigger: "POST /takeback-collections/{id}/assay with water_pct + sediment_pct > 25"
        actor: QCTechnician
        preconditions:
          - "TakebackCollection.status == COLLECTED"
        side_effects:
          - "water_pct and sediment_pct set from the request; reject_reason = CONTAMINATION_ABOVE_LIMIT"
          - "credit_cents stays 0 and credit_variant stays null"
          - "increments TakebackCollection.version by 1"
      - from: COLLECTED
        to: CREDITED
        trigger: "POST /takeback-collections/{id}/credit"
        actor: SalesRep
        preconditions:
          - "TakebackCollection.status == COLLECTED"
        side_effects:
          - "credit_variant = FLAT_RATE and credit_cents computed per calculations.takeback_credit variant flat_rate"
          - "Customer.takeback_credit_balance_cents recomputed per calculations.customer_takeback_credit_balance; Customer.last_credit_event_at = logical clock now; increments Customer.version by 1"
          - "increments TakebackCollection.version by 1"
      - from: ASSAYED
        to: CREDITED
        trigger: "POST /takeback-collections/{id}/credit"
        actor: SalesRep
        preconditions:
          - "TakebackCollection.status == ASSAYED"
        side_effects:
          - "credit_variant selected per calculations.takeback_credit and credit_cents computed with the selected variant"
          - "Customer.takeback_credit_balance_cents recomputed per calculations.customer_takeback_credit_balance; Customer.last_credit_event_at = logical clock now; increments Customer.version by 1"
          - "increments TakebackCollection.version by 1"

  - entity: SpecChangeRequest
    initial_state: DRAFT
    terminal_states: [EFFECTIVE, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /spec-change-requests/{id}/submit"
        actor: ProductManager
        preconditions:
          - "SpecChangeRequest.status == DRAFT"
          - "ProductSpec.status == ACTIVE"
        side_effects:
          - "increments SpecChangeRequest.version by 1"
      - from: SUBMITTED
        to: IN_REVIEW
        trigger: "system: the fork opens immediately inside POST /spec-change-requests/{id}/submit"
        actor: system
        preconditions:
          - "SpecChangeRequest.status == SUBMITTED"
        side_effects:
          - "viscosity_review = PENDING and approval_review = PENDING (both branches open)"
          - "increments SpecChangeRequest.version by 1"
      - from: IN_REVIEW
        to: IN_REVIEW
        trigger: "POST /spec-change-requests/{id}/viscosity-review (branch 1)"
        actor: QualityManager
        preconditions:
          - "SpecChangeRequest.status == IN_REVIEW"
          - "viscosity_review == PENDING"
          - "if decision == CLEAR then every BlendRecipe on the spec with status == ACTIVE has predicted_kv100_cst inside the requested band per calculations.spec_change_viscosity_band"
        side_effects:
          - "viscosity_review = CLEARED or BLOCKED per the decision"
          - "branch-1-only side effect: no claim counting is performed"
          - "increments SpecChangeRequest.version by 1"
      - from: IN_REVIEW
        to: IN_REVIEW
        trigger: "POST /spec-change-requests/{id}/approval-review (branch 2)"
        actor: ComplianceOfficer
        preconditions:
          - "SpecChangeRequest.status == IN_REVIEW"
          - "approval_review == PENDING"
        side_effects:
          - "approval_review = CLEARED or BLOCKED per the decision"
          - "branch-2-only side effect: claims_to_suspend_count = number of ApprovalClaim rows on the spec with status == ACTIVE at this instant"
          - "increments SpecChangeRequest.version by 1"
      - from: IN_REVIEW
        to: CLEARED
        trigger: "system: join fires when viscosity_review == CLEARED and approval_review == CLEARED"
        actor: system
        preconditions:
          - "SpecChangeRequest.status == IN_REVIEW"
          - "viscosity_review == CLEARED and approval_review == CLEARED"
        side_effects:
          - "increments SpecChangeRequest.version by 1"
      - from: IN_REVIEW
        to: REJECTED
        trigger: "system: join fires when either branch is BLOCKED"
        actor: system
        preconditions:
          - "SpecChangeRequest.status == IN_REVIEW"
          - "viscosity_review == BLOCKED or approval_review == BLOCKED"
        side_effects:
          - "increments SpecChangeRequest.version by 1"
      - from: CLEARED
        to: EFFECTIVE
        trigger: "POST /spec-change-requests/{id}/make-effective"
        actor: ProductManager
        preconditions:
          - "SpecChangeRequest.status == CLEARED"
          - "ProductSpec.status == ACTIVE"
        side_effects:
          - "cascade A link 1: ProductSpec ACTIVE -> ACTIVE with revision + 1 and the four requested fields written through"
          - "effective_revision = the new ProductSpec.revision"
          - "increments SpecChangeRequest.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /spec-change-requests/{id}/withdraw"
        actor: ProductManager
        preconditions:
          - "SpecChangeRequest.status == DRAFT"
        side_effects:
          - "increments SpecChangeRequest.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent entity's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: spec-change-create-stale-spec
    parent_entity: ProductSpec
    write_endpoint: "POST /product-specs/{id}/change-requests"
    occ_field: "expected_product_spec_version"
    description: |
      A ProductSpec may legitimately carry more than one open SpecChangeRequest, so a second
      create against the same spec is a valid product operation rather than a state violation.
      Creating a change request whose expected_product_spec_version no longer equals the spec's
      current version is rejected: the client's view of target_kv100_cst, min_additive_treat_pct
      and revision is stale, and the requested deltas were computed against a spec that has since
      moved.
    error_id: ERR_STALE_SPEC_VERSION
    http_status: 412

  - rule_id: takeback-credit-apply-stale-customer
    parent_entity: Customer
    write_endpoint: "POST /orders/{id}/apply-takeback-credit"
    occ_field: "expected_customer_version"
    description: |
      A customer may legitimately draw take-back credit against more than one order, so applying
      credit to a second order is a valid product operation rather than a state violation.
      Applying credit while carrying an expected_customer_version that no longer equals the
      customer's current version is rejected: the caller's view of takeback_credit_balance_cents
      predates an earlier grant or draw-down and the amount it intends to apply is stale.
    error_id: ERR_STALE_CUSTOMER_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: recipe_predicted_kv100
    trigger: "POST /blend-recipes (at creation) and re-evaluated as a read-only input by POST /spec-change-requests/{id}/viscosity-review"
    algorithm: weighted_scoring
    formula: |
      # ASTM D341 style log-log blending. Non-linear in every input: the mass fractions
      # weight a double-logarithm of each component's viscosity, and the result is a
      # double exponential. Three or more RecipeComponent rows always participate.
      Z_c        = log10( log10( component.nominal_kv100_cst + VISCOSITY_OFFSET ) )   # per component
      Z_blend    = SUM over components of ( component.mass_fraction_pct / 100 ) * Z_c
      predicted  = 10 ** ( 10 ** Z_blend ) - VISCOSITY_OFFSET
      BlendRecipe.predicted_kv100_cst = round_half_up( predicted, 3 )

      # additive treat rate, same pass
      BlendRecipe.additive_treat_pct = round_half_up(
          SUM over components with component_type == ADDITIVE_PACKAGE of mass_fraction_pct, 2 )
      BlendRecipe.component_count = COUNT of RecipeComponent rows on the recipe
    input_set: "every RecipeComponent row on the recipe, with no status filter (RecipeComponent is immutable and has no status); rows are summed in ascending created_at order, and Z_blend is accumulated at full precision with a single round at the end"
    constants:
      VISCOSITY_OFFSET: 0.7
    precision: "predicted_kv100_cst 3 decimal places round_half_up; additive_treat_pct 2 decimal places round_half_up; no intermediate rounding inside the summation"
    variants: []

  - name: batch_component_requirement
    trigger: "POST /blend-batches/{id}/charge (BlendBatch PLANNED -> CHARGING)"
    algorithm: aggregation
    formula: |
      BlendBatch.charge_mass_kg = round_half_up( request.charge_volume_l * BLEND_DENSITY_KG_PER_L, 3 )
      for each RecipeComponent c on the batch's recipe:
          required_kg[c.component_code] = round_half_up( BlendBatch.charge_mass_kg * c.mass_fraction_pct / 100, 3 )
    input_set: "every RecipeComponent row on BlendBatch.blend_recipe_id"
    constants:
      BLEND_DENSITY_KG_PER_L: 0.860
    precision: "3 decimal places, round_half_up, applied to charge_mass_kg first and then independently to each required_kg"
    variants: []

  - name: heel_contamination_ratio
    trigger: "POST /blend-batches/{id}/charge (BlendBatch PLANNED -> CHARGING)"
    algorithm: threshold
    formula: |
      heel_ratio = round_half_up( tank.heel_volume_l / ( tank.heel_volume_l + request.charge_volume_l ), 6 )
      BlendBatch.heel_ratio_actual = heel_ratio

      cross_family = ( tank.heel_additive_family != NONE
                       AND tank.heel_additive_family != spec.additive_family )
      same_family  = ( tank.heel_additive_family == spec.additive_family )

      # gate 1 (validations[priority=17]) - absolute food-grade barrier, ratio-independent
      if spec.additive_family == FOOD_GRADE_H1 and tank.heel_additive_family NOT IN {NONE, FOOD_GRADE_H1}:
          reject ERR_FLUSH_REQUIRED
      if tank.heel_additive_family == FOOD_GRADE_H1 and spec.additive_family != FOOD_GRADE_H1:
          reject ERR_FLUSH_REQUIRED

      # gate 2 (validations[priority=18]) - inclusive upper bound, `<=` not `<`
      limit = MAX_HEEL_RATIO_CROSS_FAMILY if cross_family else (
              MAX_HEEL_RATIO_SAME_FAMILY  if same_family  else 1.0 )
      if heel_ratio > limit:
          reject ERR_HEEL_CONTAMINATION_EXCEEDED
    input_set: "the single BlendTank named by request.blend_tank_id, in its state immediately before the charge; the ProductSpec reached through BlendBatch.blend_recipe_id -> BlendRecipe.product_spec_id"
    constants:
      MAX_HEEL_RATIO_CROSS_FAMILY: 0.005000
      MAX_HEEL_RATIO_SAME_FAMILY: 0.020000
    precision: "6 decimal places, round_half_up; the comparison uses the rounded value, so a raw ratio of 0.0050004 rounds to 0.005000 and is accepted"
    variants: []

  - name: batch_claim_eligibility
    trigger: "POST /blend-batches/{id}/charge (BlendBatch PLANNED -> CHARGING); recomputed to false by POST /blend-batches/{id}/cancel-charge"
    algorithm: constraint_propagation
    formula: |
      cross_family = ( tank.heel_additive_family != NONE
                       AND tank.heel_additive_family != spec.additive_family )
      same_family  = ( tank.heel_additive_family == spec.additive_family )

      claim_limit = CLAIM_HEEL_LIMIT_CROSS_FAMILY if cross_family else (
                    CLAIM_HEEL_LIMIT_SAME_FAMILY  if same_family  else 1.0 )

      BlendBatch.claim_eligible = TRUE only if ALL of:
        - BlendBatch.heel_ratio_actual <= claim_limit
        - every ComponentLot touched by a ComponentDraw of this batch has coa_viscosity_verified == true
        - the batch's BlendRecipe.spec_revision_pinned == ProductSpec.revision at charge time
      otherwise FALSE
    input_set: "the ComponentDraw rows created by this charge (status RESERVED) and the lots they point at; the tank state immediately before the charge"
    constants:
      CLAIM_HEEL_LIMIT_CROSS_FAMILY: 0.001000
      CLAIM_HEEL_LIMIT_SAME_FAMILY: 0.010000
    precision: "boolean; the ratio comparison reuses the already-rounded heel_ratio_actual (6 decimal places)"
    variants: []

  - name: batch_component_cost
    trigger: "variant moving_average_cost on POST /blend-batches/{id}/charge; variant consumption_layer_cost on POST /blend-batches/{id}/complete-blend"
    algorithm: chronological
    formula: |
      # ---- draw order (shared by both variants) ----
      # For each required component_code, candidate lots are ComponentLot rows with
      # component_code == the required code AND status == AVAILABLE, ordered by
      #   created_at ASC, then received_kg DESC, then unit_cost_cents_per_kg ASC.
      # Lot `id` is NEVER a sort key. Each candidate contributes
      #   take = min(lot.available_kg, remaining_required_kg)
      # until remaining_required_kg reaches 0.

      # ---- variant A: moving_average_cost (provisional, written at CHARGING) ----
      for each required component_code:
          wavg[code] = ( SUM over candidate lots of ( lot.available_kg * lot.unit_cost_cents_per_kg ) )
                       / ( SUM over candidate lots of lot.available_kg )
          # evaluated over EVERY candidate lot, including lots the draw never reaches,
          # and evaluated BEFORE any available_kg is decremented by this charge
      estimated = SUM over required component_codes of ( required_kg[code] * wavg[code] )
      BlendBatch.estimated_component_cost_cents = round_half_up( estimated, 0 )
      # NOTE: the per-code products are accumulated at full precision; there is exactly
      # one rounding, at the very end.

      # ---- variant B: consumption_layer_cost (final, written at BLENDED) ----
      final = SUM over ComponentDraw rows of this batch with status == CONSUMED of
              ( draw.drawn_kg * draw.unit_cost_cents_per_kg )
      BlendBatch.component_cost_cents = round_half_up( final, 0 )
    input_set: "variant A: all ComponentLot rows with status == AVAILABLE matching each required component_code, snapshotted before the draw. variant B: only the ComponentDraw rows of this batch whose status == CONSUMED (RESERVED and RETURNED rows are excluded)."
    constants: {}
    precision: "whole cents, round_half_up, applied exactly once at the end of each variant"
    variants:
      - name: moving_average_cost
        when: "written to BlendBatch.estimated_component_cost_cents during PLANNED -> CHARGING"
        difference: "prices the full requirement at the availability-weighted average cost of every AVAILABLE lot of that component_code, so cheap early layers are diluted by expensive later layers that the draw may never touch"
      - name: consumption_layer_cost
        when: "written to BlendBatch.component_cost_cents during CHARGING -> BLENDED and again during REWORKED -> BLENDED"
        difference: "prices only the layers actually consumed, in created_at ASC order, so the cheapest lots carry their true share and the result is strictly lower whenever earlier lots are cheaper than later ones"

  - name: component_lot_availability
    trigger: "recomputed on ComponentDraw creation (charge), on RESERVED -> RETURNED (cancel-charge) and on RESERVED -> CONSUMED (complete-blend)"
    algorithm: aggregation
    formula: |
      ComponentLot.available_kg = round_half_up(
          ComponentLot.received_kg
          - SUM over ComponentDraw rows on this lot with status IN {RESERVED, CONSUMED} of drawn_kg, 3 )

      # CONSERVED QUANTITY (mass): for every ComponentLot L, at every observable instant,
      #   L.available_kg
      #   + SUM(draw.drawn_kg for draws on L with status IN {RESERVED, CONSUMED})
      #   == L.received_kg
      # A charge followed by its compensating cancel-charge must leave available_kg
      # numerically identical to its pre-charge value.
    input_set: "every ComponentDraw row whose component_lot_id is this lot; RETURNED draws are excluded from the deduction"
    constants: {}
    precision: "3 decimal places, round_half_up"
    variants: []

  - name: qc_viscosity_conformance
    trigger: "POST /blend-batches/{id}/qc-results, and reused as the recipe-activation band check on POST /blend-recipes/{id}/activate"
    algorithm: threshold
    formula: |
      spec  = ProductSpec reached via BlendBatch.blend_recipe_id -> BlendRecipe.product_spec_id
      lower = round_half_up( spec.target_kv100_cst * ( 1 - spec.kv100_tolerance_pct / 100 ), 3 )
      upper = round_half_up( spec.target_kv100_cst * ( 1 + spec.kv100_tolerance_pct / 100 ), 3 )

      if test_type == KV100:
          QCResult.result = PASS if ( lower <= measured_value <= upper ) else FAIL   # BOTH ends inclusive
          BlendBatch.measured_kv100_cst = measured_value
      else:
          QCResult.result = PASS if measured_value > 0 else FAIL
    input_set: "the single QCResult being recorded; the band comes from the ProductSpec's CURRENT target_kv100_cst and kv100_tolerance_pct, not from the recipe's pinned revision"
    constants:
      REQUIRED_TESTS: ["KV100", "TBN"]
    precision: "band endpoints 3 decimal places round_half_up; measured_value compared as given, no rounding"
    variants: []

  - name: retain_retention_window
    trigger: "POST /blend-batches/{id}/retain-samples"
    algorithm: decay_function
    formula: |
      claim_bearing = EXISTS an ApprovalClaim with product_spec_id == the batch's spec
                      AND status == ACTIVE, evaluated at the instant the retain is created
      days = RETENTION_DAYS_CLAIM_BEARING if claim_bearing else RETENTION_DAYS_STANDARD
      RetainSample.retained_at      = logical clock now
      RetainSample.retention_until  = retained_at + days (exact calendar days, UTC)
    input_set: "ApprovalClaim rows on the batch's ProductSpec with status == ACTIVE at retain-creation time; the window is frozen at creation and is NOT recomputed when claims later change state"
    constants:
      RETENTION_DAYS_STANDARD: 365
      RETENTION_DAYS_CLAIM_BEARING: 1095
    precision: "ISO 8601 UTC with three fractional digits"
    variants: []

  - name: claim_validity_window
    trigger: "POST /approval-claims/{id}/decision with decision == APPROVE (ApprovalClaim SUBMITTED -> ACTIVE)"
    algorithm: decay_function
    formula: |
      ApprovalClaim.valid_until = logical clock now + CLAIM_VALIDITY_DAYS (exact calendar days, UTC)
    input_set: "the single claim being approved"
    constants:
      CLAIM_VALIDITY_DAYS: 730
    precision: "ISO 8601 UTC with three fractional digits"
    variants: []

  - name: order_line_pricing
    trigger: "POST /orders/{id}/lines, and recomputed by POST /orders/{id}/confirm and POST /orders/{id}/resume"
    algorithm: tiered_pricing
    formula: |
      cfg  = PackageConfiguration referenced by the line
      cust = Customer referenced by the order

      base_rate      = PACKAGE_RATE_CENTS_PER_L[cfg.package_type]
      tier_discount  = TIER_DISCOUNT_PCT[cust.contract_tier]
      uplift         = PRIVATE_LABEL_UPLIFT_PCT if cfg.private_label else 0.0

      line_rate      = base_rate * ( 1 - tier_discount / 100 ) * ( 1 + uplift / 100 )   # UNROUNDED
      OrderLine.volume_l           = round_half_up( quantity_units * cfg.fill_volume_l, 2 )
      OrderLine.line_total_cents   = round_half_up( OrderLine.volume_l * line_rate, 0 )
      OrderLine.unit_price_cents   = round_half_up( cfg.fill_volume_l * line_rate, 0 )

      # PINNED ROUNDING ORDER: round each line first, then sum. The order-level subtotal is
      # NEVER computed by summing unrounded line values, and line_total_cents is NEVER
      # quantity_units * unit_price_cents - the two figures legitimately disagree.
      Order.subtotal_cents = SUM over OrderLines with status == OPEN of line_total_cents
      Order.total_volume_l = round_half_up( SUM over OrderLines with status == OPEN of volume_l, 2 )
    input_set: "OrderLine rows on the order with status == OPEN, summed in ascending created_at order; lines with status IN {HOLD, CANCELLED} contribute nothing"
    constants:
      PACKAGE_RATE_CENTS_PER_L: { BULK: 320, IBC_1000L: 380, DRUM_205L: 425, PAIL_20L: 505, CASE_12X1L: 640 }
      TIER_DISCOUNT_PCT: { TIER_A: 12.0, TIER_B: 7.5, TIER_C: 0.0 }
      PRIVATE_LABEL_UPLIFT_PCT: 4.5
    precision: "whole cents, round_half_up, applied once per line; the multiplier chain that yields line_rate is never rounded"
    variants: []

  - name: order_freight_and_credit
    trigger: "POST /orders/{id}/confirm and POST /orders/{id}/resume (steps 1-3 and 5); POST /orders/{id}/apply-takeback-credit (step 4 and 5); POST /orders/{id}/void (step 4 reset to 0 and step 5)"
    algorithm: waterfall_allocation
    formula: |
      # The four figures look mutually dependent - the credit is capped as a share of the
      # total, the total contains freight, and freight is keyed on a money tier. The
      # evaluation order below is PINNED and is the only correct one.

      STEP 1  subtotal_cents = per calculations.order_line_pricing (round-per-line, then sum)

      STEP 2  if order.delivery_mode == BULK_DELIVERY:
                  if Order.total_volume_l >= BULK_FREE_FREIGHT_L:      freight = 0
                  else: freight = round_half_up(
                            BULK_MIN_FREIGHT_CENTS * ( 1 - Order.total_volume_l / BULK_FREE_FREIGHT_L ), 0 )
              else:   # PACKAGED - tier keyed on subtotal_cents, i.e. BEFORE freight and BEFORE credit
                  if subtotal_cents >= PACKAGED_FREIGHT_FREE_THRESHOLD_CENTS:  freight = 0
                  elif subtotal_cents >= PACKAGED_FREIGHT_MID_THRESHOLD_CENTS: freight = PACKAGED_FREIGHT_MID_CENTS
                  else:                                                        freight = PACKAGED_FREIGHT_LOW_CENTS
              Order.freight_surcharge_cents = freight

      STEP 3  Order.pre_credit_total_cents = subtotal_cents + freight_surcharge_cents

      STEP 4  if order.takeback_linked == false:  applied = 0
              else:
                  cap     = floor( pre_credit_total_cents * TAKEBACK_CREDIT_CAP_PCT / 100 )   # floor, not round
                  applied = min( Customer.takeback_credit_balance_cents, cap )
              Order.takeback_credit_applied_cents = applied
              # the cap is a share of pre_credit_total_cents - NEVER of total_cents

      STEP 5  Order.total_cents = pre_credit_total_cents - takeback_credit_applied_cents
    input_set: "OrderLine rows with status == OPEN for steps 1-2; the single Customer row named by Order.customer_id for step 4, read after every prior credit grant and draw-down has been applied"
    constants:
      BULK_FREE_FREIGHT_L: 4000
      BULK_MIN_FREIGHT_CENTS: 48000
      PACKAGED_FREIGHT_FREE_THRESHOLD_CENTS: 1000000
      PACKAGED_FREIGHT_MID_THRESHOLD_CENTS: 500000
      PACKAGED_FREIGHT_MID_CENTS: 22500
      PACKAGED_FREIGHT_LOW_CENTS: 39500
      TAKEBACK_CREDIT_CAP_PCT: 15
    precision: "whole cents; freight uses round_half_up, the credit cap uses floor; both thresholds use >= (a subtotal of exactly 1000000 is free freight, a total_volume_l of exactly 4000 is free freight)"
    variants: []

  - name: takeback_credit
    trigger: "POST /takeback-collections/{id}/credit (COLLECTED -> CREDITED or ASSAYED -> CREDITED)"
    algorithm: forward_looking
    formula: |
      # variant selection is fully determined by two fields and has no default branch
      if collection.status == COLLECTED:                       variant = FLAT_RATE
      elif customer.contract_tier == TIER_A:                   variant = FLAT_RATE
      else:                                                    variant = ASSAY_ADJUSTED   # status == ASSAYED and tier IN {TIER_B, TIER_C}

      if variant == FLAT_RATE:
          credit = round_half_up( collection.collected_volume_l * TAKEBACK_FLAT_RATE_CENTS_PER_L, 0 )
      else:
          net_factor = 1 - collection.water_pct / 100 - collection.sediment_pct / 100
          credit = round_half_up( collection.collected_volume_l * TAKEBACK_BASE_RATE_CENTS_PER_L * net_factor, 0 )
          credit = max( credit, 0 )

      TakebackCollection.credit_variant = variant
      TakebackCollection.credit_cents   = credit
    input_set: "the single TakebackCollection row and the Customer it points at; no other collections participate"
    constants:
      TAKEBACK_FLAT_RATE_CENTS_PER_L: 18
      TAKEBACK_BASE_RATE_CENTS_PER_L: 25
      MAX_CONTAMINATION_PCT: 25
    precision: "whole cents, round_half_up, applied once at the end"
    variants:
      - name: flat_rate
        when: "the collection was credited straight from COLLECTED (no assay on file), or the customer's contract_tier == TIER_A"
        difference: "pays a flat 18 cents per collected litre and ignores water_pct and sediment_pct entirely, so a dirty load is paid the same as a clean one"
      - name: assay_adjusted
        when: "the collection reached ASSAYED and the customer's contract_tier IN {TIER_B, TIER_C}"
        difference: "pays a higher headline 25 cents per litre but multiplies by (1 - water_pct/100 - sediment_pct/100), so the same volume yields a different figure and can be higher or lower than the flat variant depending on contamination"

  - name: customer_takeback_credit_balance
    trigger: "recomputed on TakebackCollection -> CREDITED, on POST /orders/{id}/apply-takeback-credit, and on Order -> VOID"
    algorithm: aggregation
    formula: |
      Customer.takeback_credit_balance_cents =
            SUM over TakebackCollection rows with customer_id == C.id and status == CREDITED of credit_cents
          - SUM over Order rows with customer_id == C.id and status IN {CONFIRMED, HOLD, INVOICED}
              of takeback_credit_applied_cents

      # CONSERVED QUANTITY (money): granted credit minus applied credit is invariant.
      # Voiding an order zeroes its takeback_credit_applied_cents and drops it out of the
      # second sum, so apply-then-void restores takeback_credit_balance_cents exactly.
    input_set: "TakebackCollection rows in status CREDITED only (SCHEDULED, COLLECTED, ASSAYED and REJECTED contribute nothing); Order rows in status CONFIRMED, HOLD or INVOICED only (DRAFT and VOID contribute nothing)"
    constants: {}
    precision: "whole cents; no rounding is required because every term is already an integer"
    variants: []

  - name: spec_change_viscosity_band
    trigger: "POST /spec-change-requests/{id}/viscosity-review with decision == CLEAR"
    algorithm: threshold
    formula: |
      lower = round_half_up( request.requested_kv100_cst * ( 1 - request.requested_kv100_tolerance_pct / 100 ), 3 )
      upper = round_half_up( request.requested_kv100_cst * ( 1 + request.requested_kv100_tolerance_pct / 100 ), 3 )
      for each BlendRecipe on the spec with status == ACTIVE:
          if not ( lower <= recipe.predicted_kv100_cst <= upper ):
              reject ERR_VISCOSITY_REVIEW_BLOCKED
    input_set: "BlendRecipe rows with product_spec_id == the request's spec and status == ACTIVE; DRAFT and RETIRED recipes are ignored, and an empty candidate set clears the branch"
    constants: {}
    precision: "band endpoints 3 decimal places round_half_up; both comparisons inclusive"
    variants: []

  - name: tank_window_occupancy
    trigger: "POST /blend-batches/{id}/charge"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN intervals [start, end): touching endpoints do NOT collide.
      # A changeover buffer widens ONLY the incoming interval's left edge, and only when
      # the incoming chemistry differs from what the tank currently holds.
      cross_family    = ( tank.heel_additive_family != NONE
                          AND tank.heel_additive_family != spec.additive_family )
      effective_start = request.window_start - ( CHANGEOVER_BUFFER_MINUTES minutes if cross_family else 0 )

      conflict = EXISTS a BlendBatch B with
                     B.blend_tank_id == request.blend_tank_id
                 AND B.id != this batch
                 AND B.production_status IN {PLANNED, CHARGING, BLENDED, RELEASED}
                 AND effective_start < B.window_end
                 AND B.window_start   < request.window_end
      if conflict: reject ERR_TANK_WINDOW_CONFLICT
    input_set: "BlendBatch rows on the same tank whose production_status IN {PLANNED, CHARGING, BLENDED, RELEASED} and whose window_start is not null; QUARANTINED, REWORKED and DISPOSED batches release their window"
    constants:
      CHANGEOVER_BUFFER_MINUTES: 120
    precision: "instant comparison at whole-second resolution, UTC"
    variants: []

  - name: packaging_line_concurrency
    trigger: "POST /packaging-runs"
    algorithm: interval_merge
    formula: |
      # CLOSED intervals [start, end]: touching endpoints DO collide. Capacity is aggregate,
      # not exclusive - the line tolerates up to max_concurrent_runs overlapping runs.
      overlapping = COUNT of PackagingRun rows R with
                        R.packaging_line_id == request.packaging_line_id
                    AND R.status IN {SCHEDULED, RUNNING}
                    AND request.window_start <= R.window_end
                    AND R.window_start       <= request.window_end
      if overlapping >= line.max_concurrent_runs: reject ERR_LINE_CAPACITY_EXCEEDED
      PackagingLine.scheduled_run_count = COUNT of PackagingRun rows on the line with status IN {SCHEDULED, RUNNING}
    input_set: "PackagingRun rows on the same PackagingLine with status IN {SCHEDULED, RUNNING}; COMPLETED and CANCELLED runs free their slot immediately"
    constants: {}
    precision: "instant comparison at whole-second resolution, UTC"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table  (evaluated strictly in ascending priority order;
#     the FIRST failing rule decides the response)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the eight declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the caller's X-User-Role appears in the endpoint's declared roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "request body carries every required field, every enum value is a declared member, every numeric field satisfies its declared range, and datetime fields parse as ISO 8601 UTC"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints and all GET endpoints with query parameters"

  - priority: 4
    category: existence
    check: "every path-segment resource id resolves, checked left to right"
    error_id: "ERR_CUSTOMER_NOT_FOUND | ERR_COMPONENT_LOT_NOT_FOUND | ERR_PRODUCT_SPEC_NOT_FOUND | ERR_BLEND_RECIPE_NOT_FOUND | ERR_BLEND_TANK_NOT_FOUND | ERR_BLEND_BATCH_NOT_FOUND | ERR_RETAIN_SAMPLE_NOT_FOUND | ERR_APPROVAL_CLAIM_NOT_FOUND | ERR_PACKAGE_CONFIGURATION_NOT_FOUND | ERR_PACKAGING_LINE_NOT_FOUND | ERR_PACKAGING_RUN_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_TAKEBACK_COLLECTION_NOT_FOUND | ERR_SPEC_CHANGE_REQUEST_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a templated path segment"

  - priority: 5
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row"
    error_id: "ERR_CUSTOMER_NOT_FOUND | ERR_PRODUCT_SPEC_NOT_FOUND | ERR_BLEND_RECIPE_NOT_FOUND | ERR_BLEND_TANK_NOT_FOUND | ERR_BLEND_BATCH_NOT_FOUND | ERR_PACKAGE_CONFIGURATION_NOT_FOUND | ERR_PACKAGING_LINE_NOT_FOUND | ERR_ORDER_NOT_FOUND"
    http_status: 404
    applies_to: "POST /blend-recipes, POST /blend-batches, POST /blend-batches/{id}/charge, POST /package-configurations, POST /packaging-runs, POST /orders, POST /orders/{id}/lines, POST /takeback-collections, POST /approval-claims"

  - priority: 6
    category: auth
    check: "a caller whose X-User-Role == Customer may only read or write resources whose customer_id equals the caller's X-User-ID"
    error_id: ERR_CUSTOMER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "GET /customers/{id}, GET /orders/{id}, GET /orders, GET /takeback-collections/{id}, GET /takeback-collections, POST /takeback-collections"

  - priority: 7
    category: auth
    check: "the caller's X-User-ID does not appear as technician_user_id on any QCResult of the target batch (segregation of duties between testing and disposition)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /blend-batches/{id}/release, POST /blend-batches/{id}/waive-qc"

  - priority: 8
    category: state
    check: "expected_product_spec_version equals the target ProductSpec's current version"
    error_id: ERR_STALE_SPEC_VERSION
    http_status: 412
    applies_to: "POST /product-specs/{id}/change-requests"

  - priority: 9
    category: state
    check: "expected_customer_version equals the order's Customer's current version"
    error_id: ERR_STALE_CUSTOMER_VERSION
    http_status: 412
    applies_to: "POST /orders/{id}/apply-takeback-credit"

  - priority: 10
    category: state
    check: "the target resource is in a from-state declared for the requested transition in section 1.2; additionally POST /orders/{id}/apply-takeback-credit requires Order.status == CONFIRMED even though it changes no status field"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every POST that triggers a state transition, plus POST /orders/{id}/apply-takeback-credit"

  - priority: 11
    category: state
    check: "BlendTank.status == AVAILABLE at the instant of the charge"
    error_id: ERR_TANK_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /blend-batches/{id}/charge"

  - priority: 12
    category: state
    check: "BlendRecipe.status == ACTIVE"
    error_id: ERR_RECIPE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /blend-batches/{id}/charge"

  - priority: 13
    category: state
    check: "ProductSpec.status == ACTIVE"
    error_id: ERR_SPEC_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /blend-recipes/{id}/activate, POST /blend-batches/{id}/charge, POST /approval-claims/{id}/submit, POST /package-configurations/{id}/activate, POST /spec-change-requests/{id}/submit, POST /spec-change-requests/{id}/make-effective"

  - priority: 14
    category: state
    check: "BlendBatch.production_status == RELEASED"
    error_id: ERR_BATCH_NOT_RELEASED
    http_status: 409
    applies_to: "POST /packaging-runs"

  - priority: 15
    category: state
    check: "PackageConfiguration.status == ACTIVE"
    error_id: ERR_CONFIG_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /packaging-runs, POST /packaging-runs/{id}/start, POST /orders/{id}/lines, POST /orders/{id}/confirm, POST /orders/{id}/resume"

  - priority: 16
    category: state
    check: "PackagingLine.status == AVAILABLE"
    error_id: ERR_LINE_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /packaging-runs, POST /packaging-runs/{id}/start"

  - priority: 17
    category: business_safety
    check: "a FOOD_GRADE_H1 product may not be charged into a tank holding a non-H1 heel, and a non-H1 product may not be charged into a tank holding an H1 heel, at any heel ratio"
    error_id: ERR_FLUSH_REQUIRED
    http_status: 422
    applies_to: "POST /blend-batches/{id}/charge"

  - priority: 18
    category: business_safety
    check: "heel_ratio_actual <= MAX_HEEL_RATIO_CROSS_FAMILY for a cross-family heel, or <= MAX_HEEL_RATIO_SAME_FAMILY for a same-family heel"
    error_id: ERR_HEEL_CONTAMINATION_EXCEEDED
    http_status: 422
    applies_to: "POST /blend-batches/{id}/charge"

  - priority: 19
    category: business_safety
    check: "for a required component_code whose AVAILABLE lots alone cannot cover required_kg but whose AVAILABLE plus QUARANTINED lots together can, the shortfall is attributable to blocked stock and the charge is refused here rather than falling through to the plain shortage check at priority 35"
    error_id: ERR_LOT_QUARANTINED
    http_status: 422
    applies_to: "POST /blend-batches/{id}/charge"

  - priority: 20
    category: business_safety
    check: "BlendRecipe.additive_treat_pct >= ProductSpec.min_additive_treat_pct"
    error_id: ERR_TREAT_RATE_BELOW_SPEC
    http_status: 422
    applies_to: "POST /blend-recipes/{id}/activate"

  - priority: 21
    category: business_safety
    check: "BlendRecipe.predicted_kv100_cst lies inside the spec's viscosity band per calculations.qc_viscosity_conformance"
    error_id: ERR_PREDICTED_VISCOSITY_OUT_OF_SPEC
    http_status: 422
    applies_to: "POST /blend-recipes/{id}/activate"

  - priority: 22
    category: business_safety
    check: "a PackagingRun whose PackageConfiguration.claim_codes is non-empty requires BlendBatch.claim_eligible == true; a waiver requires BlendBatch.claim_eligible == false"
    error_id: ERR_CLAIM_NOT_SUBSTANTIATED
    http_status: 422
    applies_to: "POST /packaging-runs, POST /blend-batches/{id}/waive-qc"

  - priority: 23
    category: business_safety
    check: "BlendBatch.retain_count >= MIN_RETAIN_COUNT (2) at release"
    error_id: ERR_INSUFFICIENT_RETAINS
    http_status: 422
    applies_to: "POST /blend-batches/{id}/release"

  - priority: 24
    category: business_temporal
    check: "the requested tank occupancy window does not collide with another batch's window on the same tank under the half-open, changeover-buffered interval rule (calculations.tank_window_occupancy)"
    error_id: ERR_TANK_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /blend-batches/{id}/charge"

  - priority: 25
    category: business_temporal
    check: "the requested packaging window does not push the count of closed-interval-overlapping SCHEDULED or RUNNING runs on the line to max_concurrent_runs or beyond (calculations.packaging_line_concurrency)"
    error_id: ERR_LINE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /packaging-runs"

  - priority: 26
    category: business_temporal
    check: "window_end is strictly after window_start"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /blend-batches/{id}/charge, POST /packaging-runs"

  - priority: 27
    category: business_temporal
    check: "the logical clock has reached RetainSample.retention_until"
    error_id: ERR_RETENTION_WINDOW_ACTIVE
    http_status: 422
    applies_to: "POST /retain-samples/{id}/dispose"

  - priority: 28
    category: business_referential
    check: "the recipe's RecipeComponent mass_fraction_pct values sum to exactly 100.00"
    error_id: ERR_RECIPE_FRACTION_SUM
    http_status: 422
    applies_to: "POST /blend-recipes, POST /blend-recipes/{id}/activate"

  - priority: 29
    category: business_referential
    check: "BlendRecipe.spec_revision_pinned equals the current ProductSpec.revision"
    error_id: ERR_SPEC_REVISION_STALE
    http_status: 409
    applies_to: "POST /blend-recipes/{id}/activate, POST /blend-batches/{id}/charge"

  - priority: 30
    category: business_referential
    check: "every claim_code on the configuration matches an ApprovalClaim on the same product_spec_id with status == ACTIVE"
    error_id: ERR_CLAIM_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /package-configurations/{id}/activate"

  - priority: 31
    category: business_referential
    check: "the ProductSpec has at least one ACTIVE BlendRecipe pinned to the current revision"
    error_id: ERR_NO_ELIGIBLE_RECIPE
    http_status: 409
    applies_to: "POST /approval-claims/{id}/submit"

  - priority: 32
    category: business_referential
    check: "the order's Customer has takeback_agreement_status == ACTIVE whenever take-back is involved"
    error_id: ERR_TAKEBACK_AGREEMENT_INACTIVE
    http_status: 409
    applies_to: "POST /orders/{id}/confirm (when takeback_linked == true), POST /takeback-collections, POST /takeback-collections/{id}/collect"

  - priority: 33
    category: business_constraint
    check: "the (product_spec_id, claim_body, claim_code) triple is not already used by an ApprovalClaim in status IN {DRAFT, SUBMITTED, ACTIVE, SUSPENDED}"
    error_id: ERR_DUPLICATE_CLAIM
    http_status: 409
    applies_to: "POST /approval-claims"

  - priority: 34
    category: business_constraint
    check: "ProductSpec.product_code, BlendTank.tank_code, BlendBatch.batch_code, PackagingLine.line_code are globally unique, and RetainSample.retain_code is unique within its batch"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /product-specs, POST /blend-tanks, POST /blend-batches, POST /packaging-lines, POST /blend-batches/{id}/retain-samples"

  - priority: 35
    category: business_fiscal
    check: "for every required component_code the summed available_kg of AVAILABLE lots is >= required_kg, with no QUARANTINED lot of that code able to close the gap (that case is already caught at priority 19)"
    error_id: ERR_COMPONENT_SHORTAGE
    http_status: 422
    applies_to: "POST /blend-batches/{id}/charge"

  - priority: 36
    category: business_fiscal
    check: "Order.pre_credit_total_cents <= Customer.credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /orders/{id}/confirm, POST /orders/{id}/resume"

  - priority: 37
    category: business_fiscal
    check: "the order is takeback_linked and the customer's takeback_credit_balance_cents is greater than 0"
    error_id: ERR_NO_TAKEBACK_CREDIT
    http_status: 422
    applies_to: "POST /orders/{id}/apply-takeback-credit"

  - priority: 38
    category: business_fiscal
    check: "the charge volume plus the existing heel does not exceed BlendTank.capacity_l"
    error_id: ERR_TANK_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /blend-batches/{id}/charge"

  - priority: 39
    category: business_referential
    check: "a CLEAR verdict on the viscosity branch requires every ACTIVE BlendRecipe on the spec to sit inside the requested band per calculations.spec_change_viscosity_band"
    error_id: ERR_VISCOSITY_REVIEW_BLOCKED
    http_status: 422
    applies_to: "POST /spec-change-requests/{id}/viscosity-review"


# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- test-driving: logical clock -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before the first call the clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time. Every created_at, updated_at, tested_at, retained_at, retention_until, valid_until, effective_from, last_flush_at and last_credit_event_at is stamped from this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["advances or rewinds the logical clock; no entity is mutated"]

  # ---- Customer --------------------------------------------------------------------
  - method: POST
    path: "/customers"
    description: "Registers a buying account."
    roles: [PlatformAdmin]
    code: 201
    input: [name, customer_type, contract_tier, credit_limit_cents, "takeback_agreement_status?"]
    output: Customer
    side_effects: ["takeback_credit_balance_cents initialised to 0"]

  - method: GET
    path: "/customers/{id}"
    description: "Reads one account."
    roles: [PlatformAdmin, SalesRep, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/customers/{id}/takeback-agreement"
    description: "Sets the used-oil take-back agreement status on an account."
    roles: [PlatformAdmin, SalesRep]
    code: 200
    input: [agreement_status]
    output: Customer
    side_effects: ["increments Customer.version by 1"]

  # ---- ComponentLot ----------------------------------------------------------------
  - method: POST
    path: "/component-lots"
    description: "Books in a base-oil, VI-improver, additive-package or dye lot at goods receipt."
    roles: [PlatformAdmin]
    code: 201
