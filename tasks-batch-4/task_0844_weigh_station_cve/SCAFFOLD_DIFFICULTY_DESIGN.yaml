            - { call: "POST /screenings", payload: { station_id: "${station_id}", carrier_id: "${carrier_id}", driver_id: "${driver_id}", vehicle_plate: "PLT-9", axle_count: 5, gross_weight_lbs: 79000, heaviest_axle_lbs: 19000, hazmat_placarded: false }, as: Screener, captures: { screening_clear_id: "$.data.id" } }
