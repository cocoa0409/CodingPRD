# =============================================================================
# Survey & Market-Research Panel — Scaffold (§1.0–§1.7)
# Difficulty: EXPERT
# =============================================================================

scenario: |
  708. Survey & Market-Research Panel: study design & screener, panelist
  recruitment & quota/segmentation, incentive (points/cash) accrual & payout,
  response quality & fraud/attention check, focus-group scheduling & facility,
  data delivery & report, panel health/churn, IRB/consent

domain_name: survey-market-research-panel
api_prefix: ""    # flat topology: each entity has a top-level collection at root (/studies, /panelists, /participations, ...)

# -----------------------------------------------------------------------------
# Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation      # provisional points vs finalized cash; rolling vs lifetime health
    - cascading_side_effects        # response reject -> quota release -> recruitment reopen -> accrual reversal
    - optimistic_concurrency        # QuotaCell.version on recruitment seat claims
    - rate_threshold_triggers       # quality-score tiers, churn thresholds
    - temporal_windowing            # focus-group facility scheduling overlap

  entity_topology: flat            # peer entities linked by FK; no nested resource ownership in URLs
  state_machine_shape: parallel    # Participation has parallel screening_status x quality_status; Response cyclic re-screen; Study branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - many_to_many                 # Panelist <-> FocusGroup via FocusGroupBooking junction
  role_model: peer_roles           # ResearchManager owns studies; PanelOps owns panelists/payouts; FieldCoordinator owns focus groups; Panelist acts on own resources
  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---------------------------------------------------------------------------
  - name: Study
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Study title" }
      - { name: irb_protocol_number, type: string, source: input, description: "IRB protocol reference; required to leave DRAFT" }
      - { name: estimated_minutes, type: integer, source: input, description: "Estimated completion time in minutes; drives length_bonus", constraints: ">= 1" }
      - { name: base_incentive_points, type: integer, source: input, description: "Base points awarded per completed response", constraints: ">= 0" }
      - { name: screener_min_age, type: integer, source: input, description: "Minimum panelist age accepted by the screener", constraints: ">= 0" }
      - { name: required_consent_version, type: integer, source: input, description: "Consent form version a panelist must have ACCEPTED to participate", default: 1, constraints: ">= 1" }
      - { name: target_total_n, type: integer, source: computed, description: "Sum of QuotaCell.target_n across this study's cells" }
      - { name: committed_total_n, type: integer, source: computed, description: "Sum of QuotaCell.committed_n across this study's cells" }
      - { name: status, type: enum, source: system, description: "DRAFT | FIELDING | PAUSED | CLOSED | DELIVERED", default: DRAFT, constraints: "DRAFT|FIELDING|PAUSED|CLOSED|DELIVERED" }

  # ---------------------------------------------------------------------------
  - name: QuotaCell
    parent: null
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> Study.id" }
      - { name: segment_key, type: string, source: input, description: "Segment label, unique per study (e.g. 'F_18_34_CA')" }
      - { name: target_n, type: integer, source: input, description: "Number of qualified completes targeted for this segment", constraints: ">= 1" }
      - { name: reserved_n, type: integer, source: computed, description: "Count of Participations holding a seat in SCREENING or SCREENED_IN on this cell" }
      - { name: committed_n, type: integer, source: computed, description: "Count of Participations whose screening_status is QUALIFIED or COMPLETED on this cell" }
      - { name: available_n, type: integer, source: computed, description: "target_n - reserved_n - committed_n, floored at 0" }
      - { name: fill_status, type: enum, source: computed, description: "OPEN | FILLED; FILLED when committed_n >= target_n", constraints: "OPEN|FILLED" }

  # ---------------------------------------------------------------------------
  - name: Panelist
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Panelist email; globally unique" }
      - { name: full_name, type: string, source: input, description: "Panelist display name" }
      - { name: age, type: integer, source: input, description: "Panelist age in years", constraints: ">= 0" }
      - { name: segment_key, type: string, source: input, description: "Demographic segment this panelist belongs to" }
      - { name: points_balance, type: integer, source: computed, description: "Available points: sum of CREDITED IncentiveAccrual minus points consumed by APPROVED/PAID PayoutRequests" }
      - { name: lifetime_invited_n, type: integer, source: computed, description: "Count of Participations ever created for this panelist" }
      - { name: lifetime_completed_n, type: integer, source: computed, description: "Count of Participations with completion_status COMPLETED for this panelist" }
      - { name: last_activity_at, type: datetime, source: computed, description: "Timestamp of most recent Participation creation or completion for this panelist; null if none" }
      - { name: health_score, type: integer, source: computed, description: "Rolling panel-health score; see panel_health_score calculation" }
      - { name: status, type: enum, source: system, description: "ACTIVE | AT_RISK | CHURNED | SUSPENDED", default: ACTIVE, constraints: "ACTIVE|AT_RISK|CHURNED|SUSPENDED" }

  # ---------------------------------------------------------------------------
  - name: Consent
    parent: null
    common_fields: false
    fields:
      - { name: panelist_id, type: string, source: input, description: "FK -> Panelist.id" }
      - { name: study_id, type: string, source: input, description: "FK -> Study.id" }
      - { name: consent_version, type: integer, source: input, description: "Version of the consent form the panelist is responding to", constraints: ">= 1" }
      - { name: decision, type: enum, source: input, description: "ACCEPTED | DECLINED | WITHDRAWN", constraints: "ACCEPTED|DECLINED|WITHDRAWN" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical-clock timestamp when this consent record was written" }

  # ---------------------------------------------------------------------------
  - name: Participation
    parent: null
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> Study.id" }
      - { name: panelist_id, type: string, source: input, description: "FK -> Panelist.id" }
      - { name: quota_cell_id, type: string, source: input, description: "FK -> QuotaCell.id; the cell this participation reserves a seat in" }
      - { name: screening_status, type: enum, source: system, description: "SCREENING | SCREENED_IN | QUALIFIED | SCREENED_OUT | VOIDED; QUALIFIED is the quota-committing terminal of this axis", default: SCREENING, constraints: "SCREENING|SCREENED_IN|QUALIFIED|SCREENED_OUT|VOIDED" }
      - { name: completion_status, type: enum, source: system, description: "NOT_STARTED | IN_PROGRESS | COMPLETED | ABANDONED; evolves independently of screening_status", default: NOT_STARTED, constraints: "NOT_STARTED|IN_PROGRESS|COMPLETED|ABANDONED" }
      - { name: completion_seconds, type: integer, source: input, description: "Seconds the panelist took to complete; supplied on submit; null until submitted" }
      - { name: straightline_run, type: integer, source: input, description: "Longest run of identical grid answers; supplied on submit; drives straightline_score" }
      - { name: quality_score, type: integer, source: computed, description: "0-100 weighted quality score computed at submit; null until COMPLETED" }
      - { name: quality_status, type: enum, source: computed, description: "PENDING | PASS | FLAGGED | FAIL; derived from quality_score tiers", default: PENDING, constraints: "PENDING|PASS|FLAGGED|FAIL" }
      - { name: provisional_points, type: integer, source: computed, description: "Points provisionally accrued at SCREENED_IN; see incentive_accrual" }
      - { name: rescreen_count, type: integer, source: computed, description: "Number of times this participation has cycled SCREENED_OUT -> SCREENING", default: 0 }

  # ---------------------------------------------------------------------------
  - name: AttentionCheck
    parent: null
    common_fields: false
    fields:
      - { name: participation_id, type: string, source: input, description: "FK -> Participation.id" }
      - { name: check_kind, type: enum, source: input, description: "TRAP_QUESTION | INSTRUCTED_RESPONSE | TIMING", constraints: "TRAP_QUESTION|INSTRUCTED_RESPONSE|TIMING" }
      - { name: passed, type: boolean, source: input, description: "Whether the panelist passed this attention check" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical-clock timestamp the check was recorded" }

  # ---------------------------------------------------------------------------
  - name: IncentiveAccrual
    parent: null
    common_fields: true
    fields:
      - { name: panelist_id, type: string, source: input, description: "FK -> Panelist.id" }
      - { name: participation_id, type: string, source: input, description: "FK -> Participation.id; the participation that earned (or reversed) this accrual" }
      - { name: accrual_kind, type: enum, source: system, description: "PROVISIONAL | FINALIZED | REVERSAL", constraints: "PROVISIONAL|FINALIZED|REVERSAL" }
      - { name: points, type: integer, source: computed, description: "Signed point delta; positive for PROVISIONAL/FINALIZED, negative for REVERSAL" }
      - { name: status, type: enum, source: system, description: "HELD | CREDITED | VOID; HELD does not count toward points_balance, CREDITED does", default: HELD, constraints: "HELD|CREDITED|VOID" }

  # ---------------------------------------------------------------------------
  - name: PayoutRequest
    parent: null
    common_fields: true
    fields:
      - { name: panelist_id, type: string, source: input, description: "FK -> Panelist.id" }
      - { name: payout_method, type: enum, source: input, description: "CASH | GIFT_CARD", constraints: "CASH|GIFT_CARD" }
      - { name: points_requested, type: integer, source: input, description: "Points the panelist wants to redeem", constraints: ">= 1" }
      - { name: cash_cents, type: integer, source: computed, description: "points_requested * CENTS_PER_POINT, computed at request time" }
      - { name: expected_panelist_version, type: integer, source: input, description: "OCC: Panelist.version the client last observed; used to detect a stale points_balance" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | PAID | REJECTED | CANCELLED", default: REQUESTED, constraints: "REQUESTED|APPROVED|PAID|REJECTED|CANCELLED" }

  # ---------------------------------------------------------------------------
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Facility / room name" }
      - { name: capacity, type: integer, source: input, description: "Maximum panelists the room seats", constraints: ">= 1" }
      - { name: turnaround_minutes, type: integer, source: input, description: "Buffer required after a session before the room is free again", default: 0, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | OFFLINE", default: AVAILABLE, constraints: "AVAILABLE|OFFLINE" }

  # ---------------------------------------------------------------------------
  - name: FocusGroup
    parent: null
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> Study.id" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; the room booked for this session" }
      - { name: starts_at, type: datetime, source: input, description: "Session start (inclusive); ISO 8601 UTC" }
      - { name: ends_at, type: datetime, source: input, description: "Session end (exclusive); ISO 8601 UTC" }
      - { name: seats, type: integer, source: input, description: "Seats offered for this session; must be <= facility.capacity", constraints: ">= 1" }
      - { name: booked_n, type: integer, source: computed, description: "Count of FocusGroupBookings in CONFIRMED status for this session" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CANCELLED | COMPLETED", default: SCHEDULED, constraints: "SCHEDULED|CANCELLED|COMPLETED" }

  # ---------------------------------------------------------------------------
  - name: FocusGroupBooking
    parent: null
    common_fields: true
    fields:
      - { name: focus_group_id, type: string, source: input, description: "FK -> FocusGroup.id" }
      - { name: panelist_id, type: string, source: input, description: "FK -> Panelist.id" }
      - { name: expected_focus_group_version, type: integer, source: input, description: "OCC: FocusGroup.version the client last observed; used to detect a stale seat count" }
      - { name: status, type: enum, source: system, description: "CONFIRMED | CANCELLED | NO_SHOW | ATTENDED", default: CONFIRMED, constraints: "CONFIRMED|CANCELLED|NO_SHOW|ATTENDED" }

  # ---------------------------------------------------------------------------
  - name: DataDelivery
    parent: null
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> Study.id" }
      - { name: included_completes_n, type: integer, source: computed, description: "Count of Participations with quality_status PASS and completion_status COMPLETED at build time" }
      - { name: report_format, type: enum, source: input, description: "CSV | SPSS | DASHBOARD", constraints: "CSV|SPSS|DASHBOARD" }
      - { name: status, type: enum, source: system, description: "BUILDING | READY | DELIVERED | REVOKED", default: BUILDING, constraints: "BUILDING|READY|DELIVERED|REVOKED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  # Study — branching lifecycle with revert (FIELDING <-> PAUSED cycle) and a
  # cross-entity precondition (DELIVERY gating). terminal: DELIVERED.
  - entity: Study
    field: status
    initial_state: DRAFT
    terminal_states: [DELIVERED]
    transitions:
      - from: DRAFT
        to: FIELDING
        trigger: "POST /studies/{id}/launch"
        actor: ResearchManager
        preconditions:
          - "irb_protocol_number is non-empty"
          - "Study has at least one QuotaCell (target_total_n >= 1)"
        side_effects:
          - "Recompute target_total_n = sum(QuotaCell.target_n)"

      - from: FIELDING
        to: PAUSED
        trigger: "POST /studies/{id}/pause"
        actor: ResearchManager
        preconditions: []
        side_effects:
          - "New Participations are blocked while PAUSED (recruitment frozen)"

      - from: PAUSED
        to: FIELDING
        trigger: "POST /studies/{id}/resume"
        actor: ResearchManager
        preconditions: []
        side_effects:
          - "Recruitment unfrozen; new Participations accepted again"
        note: "FIELDING<->PAUSED forms a cycle (revision loop)."

      - from: [FIELDING, PAUSED]
        to: CLOSED
        trigger: "POST /studies/{id}/close"
        actor: ResearchManager
        preconditions: []
        side_effects:
          - "All Participations with screening_status SCREENING or SCREENED_IN -> VOIDED (cascade A: releases reserved_n on their QuotaCells; each VOIDED participation's HELD PROVISIONAL accrual -> VOID)"

      - from: CLOSED
        to: DELIVERED
        trigger: "POST /studies/{id}/deliver"
        actor: ResearchManager
        preconditions:
          - "A DataDelivery for this study exists in status READY"
        side_effects:
          - "The READY DataDelivery -> DELIVERED"

  # ---------------------------------------------------------------------------
  # Participation — PARALLEL state dimensions: screening_status (cyclic via
  # re-screen) x completion_status (independent axis). This is the non-linear
  # core of the scaffold.
  - entity: Participation
    field: screening_status
    initial_state: SCREENING
    terminal_states: [QUALIFIED, SCREENED_OUT, VOIDED]
    note: "screening_status evolves independently of completion_status (parallel dimensions on one entity)."
    transitions:
      - from: SCREENING
        to: SCREENED_IN
        trigger: "POST /participations/{id}/screen with outcome=IN"
        actor: FieldCoordinator
        preconditions:
          - "Parent Study.status == FIELDING"
          - "Panelist.age >= Study.screener_min_age"
          - "An ACCEPTED Consent exists for (panelist_id, study_id) at consent_version >= Study.required_consent_version (cross-entity dependency)"
          - "QuotaCell.available_n >= 1 at screen time"
        side_effects:
          - "Compute provisional_points = incentive_accrual.provisional variant"
          - "Create IncentiveAccrual(kind=PROVISIONAL, status=HELD, points=+provisional_points)"
          - "Panelist.lifetime_invited_n is unchanged (set at creation); cell reserved_n already counts this participation"

      - from: SCREENING
        to: SCREENED_OUT
        trigger: "POST /participations/{id}/screen with outcome=OUT"
        actor: FieldCoordinator
        preconditions:
          - "Parent Study.status == FIELDING"
        side_effects:
          - "Releases this participation's seat: QuotaCell.reserved_n recomputed (cascade: cell available_n increases)"

      - from: SCREENED_OUT
        to: SCREENING
        trigger: "POST /participations/{id}/rescreen"
        actor: FieldCoordinator
        preconditions:
          - "Parent Study.status == FIELDING"
          - "QuotaCell.available_n >= 1 (a seat must be re-reservable)"
          - "rescreen_count < MAX_RESCREENS"
        side_effects:
          - "rescreen_count += 1"
          - "Re-reserves a seat on the QuotaCell (reserved_n recomputed upward)"
        note: "SCREENED_OUT->SCREENING is the cyclic revision loop (negotiation-round shape)."

      - from: SCREENED_IN
        to: QUALIFIED
        trigger: "system, on POST /participations/{id}/submit when completion_status reaches COMPLETED and quality_status in {PASS, FLAGGED}"
        actor: system
        preconditions:
          - "completion_status == COMPLETED"
          - "quality_status in {PASS, FLAGGED}"
        side_effects:
          - "Cell committed_n recomputed (seat moves reserved -> committed); cell fill_status may flip OPEN->FILLED (bubble-up via quota_fill)"
          - "Finalize incentive: HELD PROVISIONAL accrual -> CREDITED at FINALIZED point value (cascade B start)"

      - from: SCREENED_IN
        to: SCREENED_OUT
        trigger: "system, on POST /participations/{id}/submit when quality_status == FAIL"
        actor: system
        preconditions:
          - "completion_status == COMPLETED"
          - "quality_status == FAIL"
        side_effects:
          - "Releases reserved seat (cell reserved_n recomputed)"
          - "HELD PROVISIONAL accrual -> VOID (no points credited)"

      - from: [SCREENING, SCREENED_IN]
        to: VOIDED
        trigger: "system, on POST /studies/{id}/close (cascade A) or POST /panelists/{id}/suspend"
        actor: system
        preconditions: []
        side_effects:
          - "Releases reserved seat (cell reserved_n recomputed)"
          - "HELD PROVISIONAL accrual -> VOID"

  - entity: Participation
    field: completion_status
    initial_state: NOT_STARTED
    terminal_states: [COMPLETED, ABANDONED]
    note: "Second parallel axis on Participation; advances independently of screening_status."
    transitions:
      - from: NOT_STARTED
        to: IN_PROGRESS
        trigger: "POST /participations/{id}/start"
        actor: Panelist
        preconditions:
          - "screening_status == SCREENED_IN"
        side_effects:
          - "Panelist.last_activity_at = clock now"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /participations/{id}/submit"
        actor: Panelist
        preconditions:
          - "screening_status == SCREENED_IN"
          - "completion_seconds and straightline_run supplied"
        side_effects:
          - "Compute quality_score (quality_score calc) and derive quality_status"
          - "Panelist.lifetime_completed_n recomputed; Panelist.last_activity_at = clock now; Panelist.health_score recomputed"
          - "Drives screening_status transition (SCREENED_IN->QUALIFIED or SCREENED_IN->SCREENED_OUT) per quality_status"

      - from: IN_PROGRESS
        to: ABANDONED
        trigger: "POST /participations/{id}/abandon"
        actor: Panelist
        preconditions: []
        side_effects:
          - "If screening_status is SCREENING or SCREENED_IN it transitions to VOIDED (cross-axis cascade), releasing the seat and voiding the HELD accrual"

  # ---------------------------------------------------------------------------
  # Panelist — ACTIVE <-> AT_RISK cycle (health-driven), plus SUSPENDED branch.
  - entity: Panelist
    field: status
    initial_state: ACTIVE
    terminal_states: [CHURNED]
    transitions:
      - from: ACTIVE
        to: AT_RISK
        trigger: "system, on health recompute when health_score < CHURN_THRESHOLD"
        actor: system
        preconditions:
          - "health_score < CHURN_THRESHOLD"
        side_effects: []

      - from: AT_RISK
        to: ACTIVE
        trigger: "system, on health recompute when health_score >= CHURN_THRESHOLD"
        actor: system
        preconditions:
          - "health_score >= CHURN_THRESHOLD"
        side_effects: []
        note: "ACTIVE<->AT_RISK is a health-driven cycle."

      - from: AT_RISK
        to: CHURNED
        trigger: "POST /panelists/{id}/mark_churned"
        actor: PanelOps
        preconditions:
          - "health_score < CHURN_FLOOR"
        side_effects:
          - "All this panelist's Participations in SCREENING/SCREENED_IN -> VOIDED (cascade: seats released, HELD accruals VOID)"

      - from: [ACTIVE, AT_RISK]
        to: SUSPENDED
        trigger: "POST /panelists/{id}/suspend"
        actor: PanelOps
        preconditions: []
        side_effects:
          - "All this panelist's Participations in SCREENING/SCREENED_IN -> VOIDED (seats released, HELD accruals VOID)"
        note: "SUSPENDED is non-terminal (can be reinstated)."

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /panelists/{id}/reinstate"
        actor: PanelOps
        preconditions: []
        side_effects: []

  # ---------------------------------------------------------------------------
  # PayoutRequest — branching approve/reject; OCC on Panelist.version.
  - entity: PayoutRequest
    field: status
    initial_state: REQUESTED
    terminal_states: [PAID, REJECTED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /payout-requests/{id}/approve"
        actor: PanelOps
        preconditions:
          - "Panelist.points_balance >= points_requested at approval time"
        side_effects:
          - "points_requested points are consumed from Panelist.points_balance (balance recompute subtracts APPROVED/PAID requests)"

      - from: REQUESTED
        to: REJECTED
        trigger: "POST /payout-requests/{id}/reject"
        actor: PanelOps
        preconditions: []
        side_effects: []

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /payout-requests/{id}/cancel"
        actor: Panelist
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: PAID
        trigger: "POST /payout-requests/{id}/pay"
        actor: PanelOps
        preconditions: []
        side_effects:
          - "Points remain consumed; payout disbursed"

  # ---------------------------------------------------------------------------
  # FocusGroup — scheduling lifecycle.
  - entity: FocusGroup
    field: status
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /focus-groups/{id}/cancel"
        actor: FieldCoordinator
        preconditions: []
        side_effects:
          - "All CONFIRMED FocusGroupBookings -> CANCELLED (cascade down)"

      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /focus-groups/{id}/complete"
        actor: FieldCoordinator
        preconditions:
          - "FocusGroup.starts_at <= clock now"
        side_effects:
          - "CONFIRMED bookings remain CONFIRMED until individually marked ATTENDED/NO_SHOW"

  # ---------------------------------------------------------------------------
  # FocusGroupBooking — attendance lifecycle.
  - entity: FocusGroupBooking
    field: status
    initial_state: CONFIRMED
    terminal_states: [CANCELLED, NO_SHOW, ATTENDED]
    transitions:
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /focus-group-bookings/{id}/cancel or system (parent FocusGroup cancelled)"
        actor: "Panelist or system"
        preconditions: []
        side_effects:
          - "FocusGroup.booked_n recomputed downward (frees a seat)"

      - from: CONFIRMED
        to: ATTENDED
        trigger: "POST /focus-group-bookings/{id}/mark_attended"
        actor: FieldCoordinator
        preconditions:
          - "Parent FocusGroup.status == COMPLETED"
        side_effects: []

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /focus-group-bookings/{id}/mark_no_show"
        actor: FieldCoordinator
        preconditions:
          - "Parent FocusGroup.status == COMPLETED"
        side_effects: []

  # ---------------------------------------------------------------------------
  # DataDelivery — build/deliver lifecycle.
  - entity: DataDelivery
    field: status
    initial_state: BUILDING
    terminal_states: [DELIVERED, REVOKED]
    transitions:
      - from: BUILDING
        to: READY
        trigger: "POST /data-deliveries/{id}/build"
        actor: ResearchManager
        preconditions:
          - "Parent Study.status == CLOSED"
        side_effects:
          - "Snapshot included_completes_n = count(Participation with quality_status PASS and completion_status COMPLETED)"

      - from: READY
        to: DELIVERED
        trigger: "system, on POST /studies/{id}/deliver"
        actor: system
        preconditions: []
        side_effects: []

      - from: [BUILDING, READY]
        to: REVOKED
        trigger: "POST /data-deliveries/{id}/revoke"
        actor: ResearchManager
        preconditions: []
        side_effects: []

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules — true races only (OCC on parent.version)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: payout-request-stale-panelist
    parent_entity: Panelist
    write_endpoint: "POST /payout-requests"
    occ_field: "expected_panelist_version"
    description: |
      Creating a PayoutRequest against a Panelist whose version has advanced
      since the client last observed it is rejected. A finalized accrual or a
      reversal can legitimately change the panelist's points_balance (and bump
      its version) after the client read the balance; a request carrying a stale
      expected_panelist_version is rejected so it cannot redeem points the
      panelist no longer has.
    error_id: ERR_STALE_PANELIST_VERSION
    http_status: 412

  - rule_id: focus-group-booking-stale-seat
    parent_entity: FocusGroup
    write_endpoint: "POST /focus-group-bookings"
    occ_field: "expected_focus_group_version"
    description: |
      Creating a FocusGroupBooking against a FocusGroup whose version has
      advanced since the client last observed it is rejected. Another writer
      may have just confirmed a booking (legitimately consuming the last seat
      and bumping the session version); a booking carrying a stale
      expected_focus_group_version is rejected so the session is not oversold.
    error_id: ERR_STALE_FOCUS_GROUP_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- Calc 1: incentive accrual (DUAL-VARIANT on Participation/Panelist domain) ---
  - name: incentive_accrual
    trigger: "Participation SCREENING->SCREENED_IN (provisional) and SCREENED_IN->QUALIFIED (finalized)"
    algorithm: threshold
    formula: |
      provisional_points = base_incentive_points + length_bonus
      length_bonus = ceil(study.estimated_minutes / LENGTH_BONUS_STEP_MIN) * LENGTH_BONUS_POINTS_PER_STEP
      # FINALIZED variant, applied only when participation becomes QUALIFIED:
      finalized_points = round_half_up(provisional_points * quality_multiplier)
      quality_multiplier = 1.25 if quality_score >= 90
                           else 1.00 if quality_score >= 70
                           else 0.50 if quality_score >= 50
                           else 0.00   # (FAIL never reaches QUALIFIED, so finalize never sees 0.00)
    input_set: "Single Participation; its parent Study supplies base_incentive_points and estimated_minutes."
    constants:
      LENGTH_BONUS_STEP_MIN: 5
      LENGTH_BONUS_POINTS_PER_STEP: 10
      CENTS_PER_POINT: 2
    precision: "integer points, round_half_up at the finalize step"
    variants:
      - name: provisional
        when: "computed at SCREENED_IN; written as IncentiveAccrual(kind=PROVISIONAL, status=HELD); does NOT count toward points_balance"
        difference: "uses raw base+length_bonus with no quality multiplier; HELD"
      - name: finalized
        when: "computed at QUALIFIED; the HELD PROVISIONAL accrual flips to CREDITED and its points value is replaced by finalized_points"
        difference: "multiplies provisional by quality_multiplier and rounds half-up; CREDITED (counts toward points_balance)"

  # --- Calc 2: quality_score (weighted_scoring; combinatorial mode (a)) ---
  - name: quality_score
    trigger: "Participation IN_PROGRESS->COMPLETED (POST /participations/{id}/submit)"
    algorithm: weighted_scoring
    formula: |
      attention_pass_pct = (passed_checks / total_checks) * 100   if total_checks > 0 else 100
      # speed_score: too-fast is the strongest fraud signal
      speed_score = 0   if completion_seconds < (study.estimated_minutes * 60 * MIN_SPEED_FRACTION)
                    else 50  if completion_seconds > (study.estimated_minutes * 60 * MAX_SPEED_FRACTION)
                    else 100
      straightline_score = max(0, 100 - straightline_run * STRAIGHTLINE_PENALTY_PER_RUN)
      quality_score = round_half_up(W_ATTENTION*attention_pass_pct
                                    + W_SPEED*speed_score
                                    + W_STRAIGHTLINE*straightline_score)
      # quality_status tiers (derive from quality_score):
      #   PASS    if quality_score >= 70
      #   FLAGGED if 50 <= quality_score < 70   (kept, but flagged for review)
      #   FAIL    if quality_score < 50
    input_set: "passed_checks/total_checks aggregate over AttentionCheck rows whose participation_id == this Participation."
    constants:
      W_ATTENTION: 0.5
      W_SPEED: 0.3
      W_STRAIGHTLINE: 0.2
      MIN_SPEED_FRACTION: 0.34
      MAX_SPEED_FRACTION: 3.0
      STRAIGHTLINE_PENALTY_PER_RUN: 4
      QUALITY_PASS_THRESHOLD: 70
      QUALITY_FLAG_THRESHOLD: 50
    precision: "integer 0-100, round_half_up"

  # --- Calc 3: panel_health_score (DUAL-VARIANT: rolling vs lifetime; mode (a) combinatorial) ---
  - name: panel_health_score
    trigger: "Participation create, Participation COMPLETED, panelist health recompute, GET /panelists/{id}/health"
    algorithm: weighted_scoring
    formula: |
      # rolling variant (the persisted Panelist.health_score):
      window = the most recent RECENT_WINDOW Participations by created_at DESC for this panelist
      completed_recent = count(window where completion_status == COMPLETED)
      invited_recent   = count(window)
      base = (completed_recent / invited_recent) * 100   if invited_recent > 0 else 100
      inactivity_penalty = floor(days_since(last_activity_at) / INACTIVITY_STEP_DAYS) * INACTIVITY_PENALTY_PER_STEP
      health_score = round_half_up(clamp(base - inactivity_penalty, 0, 100))
    input_set: "Participations for this panelist; rolling uses most-recent RECENT_WINDOW by created_at DESC, lifetime uses all."
    constants:
      RECENT_WINDOW: 5
      INACTIVITY_STEP_DAYS: 30
      INACTIVITY_PENALTY_PER_STEP: 5
      CHURN_THRESHOLD: 50
      CHURN_FLOOR: 30
    precision: "integer 0-100, round_half_up"
    variants:
      - name: rolling
        when: "persisted as Panelist.health_score and returned as data.health_score on GET /panelists/{id}/health"
        difference: "denominator is the most recent RECENT_WINDOW participations only"
      - name: lifetime
        when: "returned as data.lifetime_health_score on GET /panelists/{id}/health"
        difference: "denominator is ALL participations ever (lifetime_invited_n); no recency window"

  # --- Calc 4: quota_fill (aggregation/threshold; combinatorial mode (c) ordered eval) ---
  - name: quota_fill
    trigger: "Participation screen/submit/void transitions; GET /quota-cells/{id}"
    algorithm: aggregation
    formula: |
      reserved_n  = count(Participation p where p.quota_cell_id == cell.id
                          and p.screening_status in {SCREENING, SCREENED_IN})
      committed_n = count(Participation p where p.quota_cell_id == cell.id
                          and p.screening_status == QUALIFIED)
      available_n = max(0, target_n - reserved_n - committed_n)
      fill_status = FILLED if committed_n >= target_n else OPEN
      # Evaluation order is pinned: reserved_n and committed_n are computed from the
      # CURRENT screening_status of every participation FIRST, THEN available_n is
      # derived from them — a participation is counted in exactly one of reserved/
      # committed (its screening_status partitions the two sets), never both.
    input_set: "All Participations whose quota_cell_id == cell.id, partitioned by screening_status."
    precision: "integer counts"

  # --- Calc 5: points_balance (aggregation; mode (c) circular-looking, pinned order) ---
  - name: points_balance
    trigger: "IncentiveAccrual credited/voided; PayoutRequest approve/pay/reject/cancel; GET /panelists/{id}"
    algorithm: aggregation
    formula: |
      credited_points = sum(IncentiveAccrual.points where panelist_id == p.id and status == CREDITED)
      consumed_points = sum(PayoutRequest.points_requested where panelist_id == p.id
                            and status in {APPROVED, PAID})
      points_balance = credited_points - consumed_points
      # Pinned order: credited_points and consumed_points are each fully summed
      # over current row states BEFORE the subtraction; a payout's consumption is
      # only counted once it reaches APPROVED (not at REQUESTED), so REQUESTED
      # payouts do not yet reduce the balance available to a competing request.
    input_set: "CREDITED IncentiveAccrual rows and APPROVED/PAID PayoutRequest rows for this panelist."
    precision: "integer points"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path/body resource id resolves to an existing entity, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "Acting Panelist (entity_backed) may only operate on resources whose panelist_id equals X-User-ID"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /participations/{id}/start, /submit, /abandon; POST /payout-requests, /payout-requests/{id}/cancel; POST /focus-group-bookings, /focus-group-bookings/{id}/cancel"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "An ACCEPTED Consent at consent_version >= Study.required_consent_version exists for (panelist, study) before SCREENED_IN"
    error_id: ERR_CONSENT_REQUIRED
    http_status: 422
    applies_to: "POST /participations/{id}/screen"

  - priority: 7
    category: business_constraint
    check: "Panelist.age >= Study.screener_min_age at screen-in"
    error_id: ERR_SCREENER_AGE_FAIL
    http_status: 422
    applies_to: "POST /participations/{id}/screen"

  - priority: 8
    category: business_temporal
    check: "FocusGroup [starts_at, ends_at) plus facility turnaround buffer must not overlap any other SCHEDULED FocusGroup on the same facility"
    error_id: ERR_FACILITY_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /focus-groups"

  - priority: 9
    category: business_temporal
    check: "A panelist's confirmed FocusGroupBookings must not overlap in [starts_at, ends_at) across two SCHEDULED sessions (no buffer)"
    error_id: ERR_PANELIST_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /focus-group-bookings"

  - priority: 10
    category: business_constraint
    check: "FocusGroup.seats must be <= facility.capacity; booking blocked once booked_n >= seats"
    error_id: ERR_SESSION_FULL
    http_status: 409
    applies_to: "POST /focus-group-bookings"

  - priority: 11
    category: business_constraint
    check: "QuotaCell.available_n >= 1 at screen-in / rescreen (no seat to reserve)"
    error_id: ERR_QUOTA_CELL_FULL
    http_status: 409
    applies_to: "POST /participations/{id}/screen, POST /participations/{id}/rescreen"

  - priority: 12
    category: business_constraint
    check: "rescreen_count < MAX_RESCREENS"
    error_id: ERR_RESCREEN_LIMIT
    http_status: 422
    applies_to: "POST /participations/{id}/rescreen"

  - priority: 13
    category: business_fiscal
    check: "PayoutRequest.points_requested >= MIN_PAYOUT_POINTS"
    error_id: ERR_PAYOUT_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /payout-requests"

  - priority: 14
    category: business_fiscal
    check: "Panelist.points_balance >= points_requested at approval"
    error_id: ERR_INSUFFICIENT_POINTS
    http_status: 422
    applies_to: "POST /payout-requests/{id}/approve"

  - priority: 15
    category: business_constraint
    check: "segment_key is unique within a Study's QuotaCells"
    error_id: ERR_DUPLICATE_SEGMENT
    http_status: 409
    applies_to: "POST /studies/{id}/quota-cells"

  - priority: 16
    category: state
    check: "OCC: expected_<parent>_version equals the parent's current version on race-prone creates"
    error_id: ERR_STALE_PANELIST_VERSION
    http_status: 412
    applies_to: "POST /payout-requests, POST /focus-group-bookings"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- Studies -----
  - method: POST
    path: "/studies"
    description: "Create a study (DRAFT)"
    roles: [ResearchManager]
    code: 201
    input: [title, irb_protocol_number, estimated_minutes, base_incentive_points, screener_min_age, "required_consent_version?"]
    output: Study
    side_effects: ["status=DRAFT, target_total_n=0, committed_total_n=0"]

  - method: GET
    path: "/studies"
    description: "List studies (paginated; optional status filter)"
    roles: [ResearchManager, PanelOps, FieldCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Study[]
    side_effects: []

  - method: GET
    path: "/studies/{id}"
    description: "Get a study with computed quota totals"
    roles: [ResearchManager, PanelOps, FieldCoordinator]
    code: 200
    input: []
    output: Study
    side_effects: ["Recompute target_total_n, committed_total_n"]

  - method: POST
    path: "/studies/{id}/launch"
    description: "DRAFT -> FIELDING"
    roles: [ResearchManager]
    code: 200
    input: []
    output: Study
    side_effects: ["status->FIELDING", "Recompute target_total_n"]

  - method: POST
    path: "/studies/{id}/pause"
    description: "FIELDING -> PAUSED (freeze recruitment)"
    roles: [ResearchManager]
    code: 200
    input: []
    output: Study
    side_effects: ["status->PAUSED"]

  - method: POST
    path: "/studies/{id}/resume"
    description: "PAUSED -> FIELDING (unfreeze recruitment)"
    roles: [ResearchManager]
    code: 200
    input: []
    output: Study
    side_effects: ["status->FIELDING"]

  - method: POST
    path: "/studies/{id}/close"
    description: "FIELDING/PAUSED -> CLOSED"
    roles: [ResearchManager]
    code: 200
    input: []
    output: Study
    side_effects:
      - "status->CLOSED"
      - "Cascade A: SCREENING/SCREENED_IN Participations -> VOIDED (seats released, HELD PROVISIONAL accruals -> VOID)"

  - method: POST
    path: "/studies/{id}/deliver"
    description: "CLOSED -> DELIVERED (requires a READY DataDelivery)"
    roles: [ResearchManager]
    code: 200
    input: []
    output: Study
    side_effects: ["status->DELIVERED", "READY DataDelivery -> DELIVERED"]

  # ----- Quota cells (children of Study) -----
  - method: POST
    path: "/studies/{id}/quota-cells"
    description: "Add a quota cell to a study (DRAFT or FIELDING)"
    roles: [ResearchManager]
    code: 201
    input: [segment_key, target_n]
    output: QuotaCell
    side_effects: ["reserved_n=0, committed_n=0, available_n=target_n, fill_status=OPEN"]

  - method: GET
    path: "/studies/{id}/quota-cells"
    description: "List quota cells for a study (reverse-reachability for QuotaCell.study_id)"
    roles: [ResearchManager, PanelOps, FieldCoordinator]
    code: 200
    input: []
    output: QuotaCell[]
    side_effects: ["Recompute each cell's reserved_n, committed_n, available_n, fill_status"]

  - method: GET
    path: "/quota-cells/{id}"
    description: "Get a quota cell with live fill counts"
    roles: [ResearchManager, PanelOps, FieldCoordinator]
    code: 200
    input: []
    output: QuotaCell
    side_effects: ["Recompute reserved_n, committed_n, available_n, fill_status"]

  # ----- Panelists -----
  - method: POST
    path: "/panelists"
    description: "Register a panelist (ACTIVE)"
    roles: [PanelOps]
    code: 201
    input: [email, full_name, age, segment_key]
    output: Panelist
    side_effects: ["status=ACTIVE, points_balance=0, health_score=100, lifetime counters=0"]

  - method: GET
    path: "/panelists"
    description: "List panelists (paginated; optional status/segment filter)"
    roles: [PanelOps, ResearchManager, FieldCoordinator]
    code: 200
    input: ["status?", "segment_key?", "limit?", "offset?"]
    output: Panelist[]
    side_effects: []

  - method: GET
    path: "/panelists/{id}"
    description: "Get a panelist with computed points_balance and health"
    roles: [PanelOps, ResearchManager, FieldCoordinator, Panelist]
    code: 200
    input: []
    output: Panelist
    side_effects: ["Recompute points_balance, lifetime counters, health_score, status"]

  - method: GET
    path: "/panelists/{id}/health"
    description: "Computed read: rolling and lifetime health scores"
    roles: [PanelOps, ResearchManager]
    code: 200
    input: []
    output: "{ health_score: integer, lifetime_health_score: integer, status: string }"
    side_effects: ["Recompute both health variants"]

  - method: POST
    path: "/panelists/{id}/suspend"
    description: "ACTIVE/AT_RISK -> SUSPENDED"
    roles: [PanelOps]
    code: 200
    input: []
    output: Panelist
    side_effects: ["status->SUSPENDED", "Cascade: SCREENING/SCREENED_IN Participations -> VOIDED (seats released, HELD accruals VOID)"]

  - method: POST
    path: "/panelists/{id}/reinstate"
    description: "SUSPENDED -> ACTIVE"
    roles: [PanelOps]
    code: 200
    input: []
    output: Panelist
    side_effects: ["status->ACTIVE"]

  - method: POST
    path: "/panelists/{id}/mark_churned"
    description: "AT_RISK -> CHURNED (health below floor)"
    roles: [PanelOps]
    code: 200
    input: []
    output: Panelist
    side_effects: ["status->CHURNED", "Cascade: SCREENING/SCREENED_IN Participations -> VOIDED"]

  # ----- Consent -----
  - method: POST
    path: "/consents"
    description: "Record a panelist's consent decision for a study"
    roles: [PanelOps, Panelist]
    code: 201
    input: [panelist_id, study_id, consent_version, decision]
    output: Consent
    side_effects: ["recorded_at = clock now"]

  - method: GET
    path: "/consents"
    description: "List consents (reverse-reachability for Consent.panelist_id and Consent.study_id)"
    roles: [PanelOps, ResearchManager, Panelist]
    code: 200
    input: ["panelist_id?", "study_id?", "limit?", "offset?"]
    output: Consent[]
    side_effects: []

  - method: GET
    path: "/consents/{id}"
    description: "Get a single consent record"
    roles: [PanelOps, ResearchManager, Panelist]
    code: 200
    input: []
    output: Consent
    side_effects: []

  # ----- Participations -----
  - method: POST
    path: "/participations"
    description: "Create a participation (reserves a quota-cell seat; SCREENING/NOT_STARTED)"
    roles: [FieldCoordinator]
    code: 201
    input: [study_id, panelist_id, quota_cell_id]
    output: Participation
    side_effects:
      - "screening_status=SCREENING, completion_status=NOT_STARTED, rescreen_count=0"
      - "Cell reserved_n recomputed upward; Panelist.lifetime_invited_n++, last_activity_at set, health recomputed"

  - method: GET
    path: "/participations"
    description: "List participations (reverse-reachability for study_id, panelist_id, quota_cell_id)"
    roles: [ResearchManager, PanelOps, FieldCoordinator]
    code: 200
    input: ["study_id?", "panelist_id?", "quota_cell_id?", "screening_status?", "limit?", "offset?"]
    output: Participation[]
    side_effects: []

  - method: GET
    path: "/participations/{id}"
    description: "Get a participation"
    roles: [ResearchManager, PanelOps, FieldCoordinator, Panelist]
    code: 200
    input: []
    output: Participation
    side_effects: []

  - method: POST
    path: "/participations/{id}/screen"
    description: "Screen a participation IN or OUT"
    roles: [FieldCoordinator]
    code: 200
    input: [outcome]
    output: Participation
    side_effects:
      - "outcome=IN: SCREENING->SCREENED_IN, compute provisional_points, create HELD PROVISIONAL accrual"
      - "outcome=OUT: SCREENING->SCREENED_OUT, release seat (cell reserved_n recomputed)"

  - method: POST
    path: "/participations/{id}/rescreen"
    description: "SCREENED_OUT -> SCREENING (re-reserve a seat)"
    roles: [FieldCoordinator]
    code: 200
    input: []
    output: Participation
    side_effects: ["rescreen_count++", "Re-reserve seat (cell reserved_n recomputed upward)"]

  - method: POST
    path: "/participations/{id}/start"
    description: "completion NOT_STARTED -> IN_PROGRESS"
    roles: [Panelist]
    code: 200
    input: []
    output: Participation
    side_effects: ["completion_status->IN_PROGRESS", "Panelist.last_activity_at set"]

  - method: POST
    path: "/participations/{id}/submit"
    description: "completion IN_PROGRESS -> COMPLETED; computes quality; drives screening axis"
    roles: [Panelist]
    code: 200
    input: [completion_seconds, straightline_run]
    output: Participation
    side_effects:
      - "Compute quality_score, derive quality_status"
      - "quality PASS/FLAGGED: SCREENED_IN->QUALIFIED (seat committed, fill_status may flip, finalize accrual CREDITED)"
      - "quality FAIL: SCREENED_IN->SCREENED_OUT (seat released, HELD accrual VOID)"
      - "Panelist.lifetime_completed_n++, last_activity_at set, health recomputed"

  - method: POST
    path: "/participations/{id}/abandon"
    description: "completion IN_PROGRESS -> ABANDONED"
    roles: [Panelist]
    code: 200
    input: []
    output: Participation
    side_effects: ["completion_status->ABANDONED", "If screening SCREENING/SCREENED_IN -> VOIDED (seat released, HELD accrual VOID)"]

  # ----- Attention checks (children of Participation) -----
  - method: POST
    path: "/participations/{id}/attention-checks"
    description: "Record an attention/fraud check result on a participation"
    roles: [FieldCoordinator]
    code: 201
    input: [check_kind, passed]
    output: AttentionCheck
    side_effects: ["recorded_at = clock now"]

  - method: GET
    path: "/participations/{id}/attention-checks"
    description: "List attention checks for a participation (reverse-reachability for AttentionCheck.participation_id)"
    roles: [ResearchManager, FieldCoordinator]
    code: 200
    input: []
    output: AttentionCheck[]
    side_effects: []

  # ----- Incentive accruals (reverse-reachability) -----
  - method: GET
    path: "/incentive-accruals"
    description: "List incentive accruals (reverse-reachability for panelist_id and participation_id)"
    roles: [PanelOps, ResearchManager]
    code: 200
    input: ["panelist_id?", "participation_id?", "limit?", "offset?"]
    output: IncentiveAccrual[]
    side_effects: []

  - method: GET
    path: "/incentive-accruals/{id}"
    description: "Get a single incentive accrual"
    roles: [PanelOps, ResearchManager]
    code: 200
    input: []
    output: IncentiveAccrual
    side_effects: []

  # ----- Payout requests -----
  - method: POST
    path: "/payout-requests"
    description: "Panelist requests a points payout (OCC on Panelist.version)"
    roles: [Panelist, PanelOps]
    code: 201
    input: [panelist_id, payout_method, points_requested, expected_panelist_version]
    output: PayoutRequest
    side_effects: ["status=REQUESTED, cash_cents = points_requested * CENTS_PER_POINT"]

  - method: GET
    path: "/payout-requests"
    description: "List payout requests (reverse-reachability for PayoutRequest.panelist_id)"
    roles: [PanelOps, ResearchManager, Panelist]
    code: 200
    input: ["panelist_id?", "status?", "limit?", "offset?"]
    output: PayoutRequest[]
    side_effects: []

  - method: GET
    path: "/payout-requests/{id}"
    description: "Get a payout request"
    roles: [PanelOps, Panelist]
    code: 200
    input: []
    output: PayoutRequest
    side_effects: []

  - method: POST
    path: "/payout-requests/{id}/approve"
    description: "REQUESTED -> APPROVED (consumes points)"
    roles: [PanelOps]
    code: 200
    input: []
    output: PayoutRequest
    side_effects: ["status->APPROVED", "Panelist.points_balance recompute subtracts these points", "increments Panelist.version by 1"]

  - method: POST
    path: "/payout-requests/{id}/pay"
    description: "APPROVED -> PAID"
    roles: [PanelOps]
    code: 200
    input: []
    output: PayoutRequest
    side_effects: ["status->PAID"]

  - method: POST
    path: "/payout-requests/{id}/reject"
    description: "REQUESTED -> REJECTED"
    roles: [PanelOps]
    code: 200
    input: []
    output: PayoutRequest
    side_effects: ["status->REJECTED"]

  - method: POST
    path: "/payout-requests/{id}/cancel"
    description: "REQUESTED -> CANCELLED (by owning panelist)"
    roles: [Panelist]
    code: 200
    input: []
    output: PayoutRequest
    side_effects: ["status->CANCELLED"]

  # ----- Facilities -----
  - method: POST
    path: "/facilities"
    description: "Create a focus-group facility/room"
    roles: [FieldCoordinator]
    code: 201
    input: [name, capacity, "turnaround_minutes?"]
    output: Facility
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/facilities/{id}"
    description: "Get a facility"
    roles: [FieldCoordinator, ResearchManager]
    code: 200
    input: []
    output: Facility
    side_effects: []

  # ----- Focus groups -----
  - method: POST
    path: "/focus-groups"
    description: "Schedule a focus group (checks facility double-booking with turnaround buffer)"
    roles: [FieldCoordinator]
    code: 201
    input: [study_id, facility_id, starts_at, ends_at, seats]
    output: FocusGroup
    side_effects: ["status=SCHEDULED, booked_n=0"]

  - method: GET
    path: "/focus-groups"
    description: "List focus groups (reverse-reachability for study_id and facility_id)"
    roles: [FieldCoordinator, ResearchManager, PanelOps]
    code: 200
    input: ["study_id?", "facility_id?", "status?", "limit?", "offset?"]
    output: FocusGroup[]
    side_effects: []

  - method: GET
    path: "/focus-groups/{id}"
    description: "Get a focus group with live booked_n"
    roles: [FieldCoordinator, ResearchManager, PanelOps]
    code: 200
    input: []
    output: FocusGroup
    side_effects: ["Recompute booked_n"]

  - method: POST
    path: "/focus-groups/{id}/cancel"
    description: "SCHEDULED -> CANCELLED (cascades bookings)"
    roles: [FieldCoordinator]
    code: 200
    input: []
    output: FocusGroup
    side_effects: ["status->CANCELLED", "CONFIRMED bookings -> CANCELLED"]

  - method: POST
    path: "/focus-groups/{id}/complete"
    description: "SCHEDULED -> COMPLETED (must be at/after starts_at)"
    roles: [FieldCoordinator]
    code: 200
    input: []
    output: FocusGroup
    side_effects: ["status->COMPLETED"]

  # ----- Focus-group bookings -----
  - method: POST
    path: "/focus-group-bookings"
    description: "Book a panelist into a focus group (OCC on FocusGroup.version; capacity + panelist-conflict checks)"
    roles: [Panelist, FieldCoordinator]
    code: 201
    input: [focus_group_id, panelist_id, expected_focus_group_version]
    output: FocusGroupBooking
    side_effects: ["status=CONFIRMED", "FocusGroup.booked_n recomputed upward", "increments FocusGroup.version by 1"]

  - method: GET
    path: "/focus-group-bookings"
    description: "List bookings (reverse-reachability for focus_group_id and panelist_id)"
    roles: [FieldCoordinator, ResearchManager, PanelOps, Panelist]
    code: 200
    input: ["focus_group_id?", "panelist_id?", "status?", "limit?", "offset?"]
    output: FocusGroupBooking[]
    side_effects: []

  - method: GET
    path: "/focus-group-bookings/{id}"
    description: "Get a single focus-group booking"
    roles: [FieldCoordinator, ResearchManager, PanelOps, Panelist]
    code: 200
    input: []
    output: FocusGroupBooking
    side_effects: []

  - method: POST
    path: "/focus-group-bookings/{id}/cancel"
    description: "CONFIRMED -> CANCELLED (by owning panelist)"
    roles: [Panelist, FieldCoordinator]
    code: 200
    input: []
    output: FocusGroupBooking
    side_effects: ["status->CANCELLED", "FocusGroup.booked_n recomputed downward"]

  - method: POST
    path: "/focus-group-bookings/{id}/mark_attended"
    description: "CONFIRMED -> ATTENDED (session must be COMPLETED)"
    roles: [FieldCoordinator]
    code: 200
    input: []
    output: FocusGroupBooking
    side_effects: ["status->ATTENDED"]

  - method: POST
    path: "/focus-group-bookings/{id}/mark_no_show"
    description: "CONFIRMED -> NO_SHOW (session must be COMPLETED)"
    roles: [FieldCoordinator]
    code: 200
    input: []
    output: FocusGroupBooking
    side_effects: ["status->NO_SHOW"]

  # ----- Data deliveries -----
  - method: POST
    path: "/data-deliveries"
    description: "Create a data delivery deliverable for a study (BUILDING)"
    roles: [ResearchManager]
    code: 201
    input: [study_id, report_format]
    output: DataDelivery
    side_effects: ["status=BUILDING, included_completes_n=0"]

  - method: GET
    path: "/data-deliveries"
    description: "List data deliveries (reverse-reachability for study_id)"
    roles: [ResearchManager, PanelOps]
    code: 200
    input: ["study_id?", "status?", "limit?", "offset?"]
    output: DataDelivery[]
    side_effects: []

  - method: GET
    path: "/data-deliveries/{id}"
    description: "Get a single data delivery"
    roles: [ResearchManager, PanelOps]
    code: 200
    input: []
    output: DataDelivery
    side_effects: []

  - method: POST
    path: "/data-deliveries/{id}/build"
    description: "BUILDING -> READY (snapshots included_completes_n; study must be CLOSED)"
    roles: [ResearchManager]
    code: 200
    input: []
    output: DataDelivery
    side_effects: ["status->READY", "Snapshot included_completes_n = count(PASS+COMPLETED participations)"]

  - method: POST
    path: "/data-deliveries/{id}/revoke"
    description: "BUILDING/READY -> REVOKED"
    roles: [ResearchManager]
    code: 200
    input: []
    output: DataDelivery
    side_effects: ["status->REVOKED"]

  # ----- Test-driving: logical clock -----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is 2026-03-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [ResearchManager, PanelOps, FieldCoordinator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Logical clock advanced/rewound to to_iso8601 for all subsequent timestamp/window evaluation"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or missing X-User-ID header" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for this operation per RBAC" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Acting Panelist is not the owner (panelist_id != X-User-ID) of the target resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced resource id does not resolve to an existing entity" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body, missing required field, or invalid enum/type" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state from which the requested transition is defined" }
  - { id: ERR_CONSENT_REQUIRED, http: 422, condition: "No ACCEPTED Consent at consent_version >= Study.required_consent_version for (panelist, study) at screen-in" }
  - { id: ERR_SCREENER_AGE_FAIL, http: 422, condition: "Panelist.age < Study.screener_min_age at screen-in" }
  - { id: ERR_QUOTA_CELL_FULL, http: 409, condition: "QuotaCell.available_n < 1 at screen-in or rescreen" }
  - { id: ERR_DUPLICATE_SEGMENT, http: 409, condition: "segment_key already used by another QuotaCell in the same study" }
  - { id: ERR_RESCREEN_LIMIT, http: 422, condition: "rescreen_count has reached MAX_RESCREENS" }
  - { id: ERR_STUDY_NOT_FIELDING, http: 409, condition: "Operation requires parent Study.status == FIELDING (recruitment frozen or not launched)" }
  - { id: ERR_SUBMIT_FIELDS_MISSING, http: 422, condition: "completion_seconds or straightline_run absent on submit" }
  - { id: ERR_FACILITY_DOUBLE_BOOKED, http: 409, condition: "FocusGroup interval plus facility turnaround buffer overlaps another SCHEDULED session on the same facility" }
  - { id: ERR_PANELIST_SCHEDULE_CONFLICT, http: 409, condition: "Panelist already has a CONFIRMED booking on a SCHEDULED session overlapping this one" }
  - { id: ERR_SESSION_FULL, http: 409, condition: "FocusGroup.booked_n >= seats; no seat to confirm" }
  - { id: ERR_SEATS_EXCEED_CAPACITY, http: 422, condition: "FocusGroup.seats > facility.capacity at scheduling" }
  - { id: ERR_PAYOUT_BELOW_MINIMUM, http: 422, condition: "points_requested < MIN_PAYOUT_POINTS" }
  - { id: ERR_INSUFFICIENT_POINTS, http: 422, condition: "Panelist.points_balance < points_requested at approval" }
  - { id: ERR_STALE_PANELIST_VERSION, http: 412, condition: "expected_panelist_version != Panelist.version on payout-request create" }
  - { id: ERR_STALE_FOCUS_GROUP_VERSION, http: 412, condition: "expected_focus_group_version != FocusGroup.version on booking create" }
  - { id: ERR_DELIVERY_NOT_READY, http: 409, condition: "Study deliver attempted without a READY DataDelivery" }
  - { id: ERR_STUDY_NOT_CLOSED, http: 409, condition: "DataDelivery build attempted while parent Study is not CLOSED" }
  - { id: ERR_NO_QUOTA_CELLS, http: 409, condition: "Study launch attempted with target_total_n < 1 (no quota cells)" }
  - { id: ERR_IRB_PROTOCOL_REQUIRED, http: 422, condition: "Study launch attempted with empty irb_protocol_number" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ResearchManager
    description: "Designs studies, manages quota cells, runs the study lifecycle, and produces data deliveries/reports."
    identity: opaque
    exclusive_operations:
      - "POST /studies and /studies/{id}/{launch,pause,resume,close,deliver}"
      - "POST /studies/{id}/quota-cells"
      - "POST /data-deliveries and /data-deliveries/{id}/{build,revoke}"
    shared_operations:
      - "GET on studies, quota-cells, panelists, participations, consents, focus-groups, payout-requests, incentive-accruals, data-deliveries, attention-checks"

  - name: PanelOps
    description: "Manages the panelist roster: registration, health/churn lifecycle, and payout approval/disbursement."
    identity: opaque
    exclusive_operations:
      - "POST /panelists and /panelists/{id}/{suspend,reinstate,mark_churned}"
      - "POST /payout-requests/{id}/{approve,pay,reject}"
    shared_operations:
      - "POST /consents (on behalf of panelist); POST /payout-requests (on behalf of panelist)"
      - "GET on panelists, payout-requests, incentive-accruals, participations, studies, quota-cells, focus-groups, data-deliveries"

  - name: FieldCoordinator
    description: "Runs fielding: creates participations, screens/rescreens, records attention checks, and schedules focus groups/facilities."
    identity: opaque
    exclusive_operations:
      - "POST /participations and /participations/{id}/{screen,rescreen}"
      - "POST /participations/{id}/attention-checks"
      - "POST /facilities, /focus-groups and /focus-groups/{id}/{cancel,complete}"
      - "POST /focus-group-bookings/{id}/{mark_attended,mark_no_show}"
    shared_operations:
      - "POST /focus-group-bookings (on behalf of panelist)"
      - "GET on studies, quota-cells, panelists, participations, focus-groups, facilities, attention-checks"

  - name: Panelist
    description: "A registered panelist acting on their own participations, consents, payout requests, and focus-group bookings."
    identity: "entity_backed:Panelist"
    exclusive_operations:
      - "POST /participations/{id}/{start,submit,abandon} (own)"
      - "POST /payout-requests/{id}/cancel (own); POST /focus-group-bookings/{id}/cancel (own)"
    shared_operations:
      - "POST /consents (own); POST /payout-requests (own); POST /focus-group-bookings (own)"
      - "GET own panelist, participations, payout-requests, focus-group-bookings, consents"
