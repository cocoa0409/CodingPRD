            - { call: "POST /governance/physicians/${t_id}/standing", payload: { standing: SUSPENDED }, as: BoardAdmin }
          trigger:
            - { call: "POST /governance/motions/${m_id}/close", payload: {}, as: BoardAdmin, captures: { err: $.data.error_id } }
