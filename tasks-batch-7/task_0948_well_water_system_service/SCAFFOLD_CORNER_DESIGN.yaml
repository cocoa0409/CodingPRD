      - name: corner_endpoint_water_tests_self_referential_parent_filter
        claim_type: Cross-reference link
        grounds: ["entities.WaterTest.fields.parent_test_id", "state_machines.WaterTest.ANALYZED_PRESUMPTIVE_POSITIVE_to_CLEARED_NEGATIVE", "endpoints"]
        distinguishing_aspect: |
          The confirmatory endpoint creates a CHILD WaterTest whose parent_test_id
          points back at the presumptive row, and that child is discoverable ONLY
          through the self-referential filtered list - it never appears in any creation
          response. Filtering by parent_test_id returns exactly 1 row, while filtering
          the well by result_status CLEARED_NEGATIVE returns 2 rows (parent and child).
          An implementation that latches the parent without materialising the child row
          returns 0 and 1.
        test_recipe:
          setup:
            - "One account, property, well and technician; the well starts at potability UNKNOWN."
            - "One BACTERIOLOGICAL test sampled 2026-06-01T00:00:00Z, analysed 24 hours later by officer-alpha with coliform present, so it sits at ANALYZED_PRESUMPTIVE_POSITIVE and the well at ADVISORY."
            - "Clock at 2026-06-10T13:00:00Z when officer-bravo records the confirmatory result."
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /water-service/accounts"
              payload: { legal_name: "Child Test Co", billing_jurisdiction_code: "JUR_ALPHA", contact_email: "ct@corner.example" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /water-service/properties"
              payload: { account_id: "${acct_id}", address_line: "2 Retest", jurisdiction_code: "JUR_ALPHA", distance_miles: 10.0, household_size: 3 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /water-service/well-profiles"
              payload: { property_id: "${prop_id}", jurisdiction_code: "JUR_ALPHA", well_type: "DRILLED", depth_feet: 200.0 }
              as: PlatformAdmin
              captures: { well_id: $.data.id }
            - call: "POST /water-service/technicians"
              payload: { full_name: "Retest Tech", tier: "JOURNEYMAN", home_jurisdiction_code: "JUR_ALPHA", status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /water-service/water-tests"
              payload: { well_profile_id: "${well_id}", collected_by_technician_id: "${tech_id}", panel_type: "BACTERIOLOGICAL", sample_datetime: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
              captures: { wt_parent: $.data.id }
            - call: "POST /water-service/water-tests/${wt_parent}/lab-result"
              payload: { analyzed_at: "2026-06-02T00:00:00Z", coliform_present: true }
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T13:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /water-service/water-tests/${wt_parent}/confirmatory-result"
              payload: { confirm_sample_datetime: "2026-06-10T00:00:00Z", confirm_analyzed_at: "2026-06-10T12:00:00Z", confirm_coliform_present: false, collected_by_technician_id: "${tech_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-bravo"
            - call: "GET /water-service/water-tests"
              payload: { parent_test_id: "${wt_parent}" }
              as: ComplianceOfficer
              as_user_id: "officer-bravo"
              captures: { wt_child: "$.data[0].id" }
            - call: "GET /water-service/water-tests"
              payload: { well_profile_id: "${well_id}", result_status: "CLEARED_NEGATIVE" }
              as: ComplianceOfficer
              as_user_id: "officer-bravo"
          assert:
            - "GET /water-service/water-tests with parent_test_id == ${wt_parent} returns exactly 1 row"
            - "WaterTest.${wt_child}.parent_test_id == ${wt_parent}"
            - "WaterTest.${wt_child}.panel_type == BACTERIOLOGICAL and WaterTest.${wt_child}.result_status == CLEARED_NEGATIVE"
            - "WaterTest.${wt_parent}.result_status == CLEARED_NEGATIVE"
            - "WaterTest.${wt_parent}.recorded_by_user_id == officer-alpha"
            - "WaterTest.${wt_parent}.confirmed_by_user_id == officer-bravo"
            - "GET /water-service/water-tests with well_profile_id == ${well_id} and result_status == CLEARED_NEGATIVE returns exactly 2 rows"
            - "WellProfile.${well_id}.potability_status == SAFE and WellProfile.${well_id}.advisory_reason == null"

      - name: corner_endpoint_quote_decline_is_terminal
        claim_type: Action endpoint
        grounds: ["state_machines.Quote.SENT_to_DECLINED", "errors[ERR_QUOTE_INVALID_STATE]", "endpoints"]
        distinguishing_aspect: |
          Declining a SENT quote is a success path no other instance exercises: the
          quote moves to DECLINED, its version advances past the send, and DECLINED is
          terminal, so a subsequent approve on the same quote fails 409
          ERR_QUOTE_INVALID_STATE and leaves the status DECLINED with approved_at still
          null. An implementation that allows approve-after-decline overwrites
          approved_total_cents.
        test_recipe:
          setup:
            - "One account, property, well, JOURNEYMAN technician, one COMPLETED inspection and one CONTROL part costing 5000 cents."
            - "One quote of scope REPAIR with one quantity-1 line, PRICED and SENT."
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /water-service/accounts"
              payload: { legal_name: "Decline Co", billing_jurisdiction_code: "JUR_ALPHA", contact_email: "dc@corner.example" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /water-service/properties"
              payload: { account_id: "${acct_id}", address_line: "1 Decline", jurisdiction_code: "JUR_ALPHA", distance_miles: 10.0, household_size: 3 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /water-service/well-profiles"
              payload: { property_id: "${prop_id}", jurisdiction_code: "JUR_ALPHA", well_type: "DRILLED", depth_feet: 200.0 }
              as: PlatformAdmin
              captures: { well_id: $.data.id }
            - call: "POST /water-service/technicians"
              payload: { full_name: "Decline Tech", tier: "JOURNEYMAN", home_jurisdiction_code: "JUR_ALPHA", status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /water-service/part-catalog-items"
              payload: { part_number: "CTL-5000-D", category: "CONTROL", unit_cost_cents: 5000, media_kind: "NONE", on_hand_qty: 10, status: "ACTIVE" }
              as: PlatformAdmin
              captures: { part_id: $.data.id }
            - call: "POST /water-service/inspections"
              payload: { well_profile_id: "${well_id}", technician_id: "${tech_id}", scheduled_for: "2026-06-01T10:00:00Z" }
              as: Dispatcher
              captures: { insp_id: $.data.id }
            - call: "POST /water-service/inspections/${insp_id}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /water-service/inspections/${insp_id}/complete"
              payload: { measured_yield_gpm: 20.0, static_level_feet: 50.0, observed_drawdown_gallons: 6.0 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /water-service/quotes"
              payload: { property_id: "${prop_id}", well_profile_id: "${well_id}", inspection_id: "${insp_id}", scope: "REPAIR", estimated_labor_minutes: 60, estimated_start_at: "2026-06-03T09:00:00Z", quoted_technician_tier: "JOURNEYMAN" }
              as: Estimator
              captures: { quote_id: $.data.id, qv0: $.data.version }
            - call: "POST /water-service/quotes/${quote_id}/lines"
              payload: { part_catalog_item_id: "${part_id}", quantity: 1, expected_quote_version: "${qv0}" }
              as: Estimator
            - call: "POST /water-service/quotes/${quote_id}/price"
              payload: {}
              as: Estimator
            - call: "POST /water-service/quotes/${quote_id}/send"
              payload: {}
              as: Estimator
              captures: { qv_sent: $.data.version }
          trigger:
            - call: "POST /water-service/quotes/${quote_id}/decline"
              payload: {}
              as: CustomerContact
              as_user_id: "${acct_id}"
              captures: { qv_declined: $.data.version }
            - call: "POST /water-service/quotes/${quote_id}/approve"
              payload: {}
              as: CustomerContact
              as_user_id: "${acct_id}"
              captures: { err_state: $.data.error_id }
          assert:
            - "Quote.${quote_id}.status == DECLINED"
            - "${qv_declined} == ${qv_sent} + 1"
            - "Quote.${quote_id}.sent_at == 2026-06-01T09:00:00.000Z"
            - "${err_state} == ERR_QUOTE_INVALID_STATE"
            - "HTTP status is 409 on the approve-after-decline call"
            - "Quote.${quote_id}.approved_at == null and Quote.${quote_id}.approved_total_cents == null"
            - "Quote.${quote_id}.total_cents == 18080"

      - name: corner_endpoint_inspection_cancel_from_in_progress_leaves_the_well_untouched
        claim_type: Action endpoint
        grounds: ["state_machines.Inspection.IN_PROGRESS_to_CANCELLED", "entities.WellProfile.fields.measured_yield_gpm", "endpoints"]
        distinguishing_aspect: |
          An IN_PROGRESS inspection can still be cancelled, and because CASCADE-C-1
          fires only on /complete the well keeps measured_yield_gpm null,
          last_inspection_completed_at null and its creation-time duty cycle of 5.00 /
          MODERATE. The inspection's own completed_at and three measurements stay null
          too. An implementation that treats cancel as a completion writes the well's
          yield.
        test_recipe:
          setup: ["One account, property, well created with the default 6.0 gallon drawdown, one technician and one SCHEDULED inspection moved to IN_PROGRESS."]
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
