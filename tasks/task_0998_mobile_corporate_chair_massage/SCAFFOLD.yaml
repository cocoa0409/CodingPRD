    output: Booking
    side_effects: ["booking_kind set to EVENT; status=DRAFT; billing_status=UNBILLED"]

  - method: GET
    path: /chair-massage/bookings
    description: "List bookings (paginated)"
    roles: [PlatformAdmin, Organizer, Therapist]
    code: 200
    input: ["limit?", "offset?", "status?", "billing_status?", "corporate_account_id?", "region_id?", "event_date?"]
    output: Booking[]
    side_effects: []

  - method: GET
    path: /chair-massage/bookings/{id}
