      - name: test_run_parallel_state_dimensions_move_independently
        claim_type: parallel
        grounds:
          - state_machines.TestRun
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / test_run_three_dimensions_move_independently_and_reset_on_reopen
          rationale: "The three-dimension TestRun product state and its reset on reopen are exactly what the named §1.8 instance walks."
      - name: selection_approval_guarded_by_pattern_asset_state
        claim_type: guarded_transitions
        grounds:
          - state_machines.Selection.transitions.PROPOSED_to_APPROVED
          - validations[priority=35]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / selection_approval_gated_by_pattern_asset_state_and_unblocked_by_refurbishment
          rationale: "The cross-entity guard on PROPOSED to APPROVED is the subject of the named §1.8 instance, both blocked and unblocked."
      - name: scrap_disposition_cascade_down_to_kit_release
        claim_type: cascade_down
        grounds:
          - state_machines.CastingLot.transitions.INSPECTED_to_QUARANTINED
          - state_machines.BuildOrder.transitions.ASSEMBLED_to_CASTING_SHORT
        excluded_because:
          difficulty_instance: transitive_cascade / scrap_disposition_cascades_lot_quarantine_build_short_package_hold_kit_release
          rationale: "The four-level downward cascade from one disposition is asserted level by level in the named §1.8 instance."
      - name: casting_lot_compensation_on_disposition_revision
        claim_type: compensation
        grounds:
          - state_machines.CastingDefect.transitions.DISPOSITIONED_SCRAP_to_DISPOSITIONED_REPAIR
          - calculations.casting_yield_ledger
        excluded_because:
          difficulty_instance: compensating_invariant / casting_lot_piece_conservation_holds_across_scrap_revision_and_repair_verification
          rationale: "Reversal of the scrap booking and the resulting ledger drift check are the named §1.8 instance's entire subject."
      - name: pattern_asset_cyclic_refurbishment_loop
        claim_type: cyclic
        grounds:
          - state_machines.PatternAsset
          - calculations.pattern_wear_index
        excluded_because:
          difficulty_instance: non_linear_state_machine / pattern_asset_wear_refurbishment_cycle_restarts_wear_curve
          rationale: "The QUALIFIED to WORN to IN_REFURB to QUALIFIED loop and the counter reset are covered by the named §1.8 instance."
      - name: out_of_tolerance_evaluate_bubbles_up_to_duty_application
        claim_type: bubble_up
        grounds:
          - state_machines.Selection.transitions.APPROVED_to_UNDER_REVIEW
          - state_machines.DutyApplication.transitions.CONTRACTED_to_OPEN
        excluded_because:
          difficulty_instance: transitive_cascade / out_of_tolerance_evaluate_cascades_build_rework_selection_review_duty_reopen
          rationale: "Upward propagation of a failed evaluation to Selection and DutyApplication is asserted in the named §1.8 instance."
      - name: warranty_adjudication_three_way_branching_fork
        claim_type: branching
        grounds:
          - state_machines.WarrantyClaim.transitions.UNDER_ADJUDICATION_to_ADJUDICATED_MANUFACTURING
        excluded_because:
          difficulty_instance: non_linear_state_machine / warranty_adjudication_three_way_fork_with_divergent_side_effects
          rationale: "All three adjudication branches and their divergent counters are enumerated in the named §1.8 instance."

  # =====================================================================
  # calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: selection_computes_trim_head_efficiency_and_certified_npsh_from_the_duty_point
        claim_type: correct_result
        grounds:
          - calculations.impeller_trim_and_head_prediction
          - calculations.predicted_efficiency
          - calculations.npsh_certification_margin
          - endpoints["POST /selections"]
        distinguishing_aspect: |
          One selection of HSC-14 for 265 m3/h at 74.0 m pins the whole derivation chain: K = 20/90000,
          r_exact 0.9869009 gives a trim of 350.3 mm, and because diameter_ratio is recomputed from the
          ROUNDED 350.3 mm the predicted head is 73.97 m, not the 74.00 m that r_exact would return - the
          one-decimal trim rounding must be observable downstream in head, efficiency, power and NPSH.
        test_recipe:
          setup:
            - "Foundry, PumpModel HSC-14, PatternAsset and MaterialSealConfig MSC-CI-P11 exist."
            - "DutyApplication APP-1001 is OPEN at 265.0 m3/h, 74.0 m, NPSHa 5.00 m, sg 1.00, 1.2 cSt, CLEAN."
          setup_api_calls:
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH", name: "North Iron Works", approved_alloys: ["CI_GG25", "DUPLEX_S31803"], concurrent_pour_capacity: 2 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /pump-models"
              payload: { model_code: "HSC-14", generation: 2, interchange_group: "IG-HSC-14", max_impeller_diameter_mm: 355.0, min_impeller_diameter_mm: 300.0, shutoff_head_m: 92.0, bep_flow_m3h: 300.0, bep_head_m: 72.0, bep_efficiency_pct: 82.0, npshr_at_bep_m: 4.20, rated_speed_rpm: 2950, max_flow_m3h: 380.0, rotor_mass_kg: 68.0, balance_grade: "G6_3" }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /pattern-assets"
              payload: { pump_model_id: "${m1_id}", foundry_id: "${f1_id}", pattern_code: "PAT-HSC14-A", wear_threshold: 20 }
              as: PlatformAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /material-seal-configs"
              payload: { pump_model_id: "${m1_id}", config_code: "MSC-CI-P11", casing_material: "CI_GG25", impeller_material: "CI_GG25", seal_type: "SINGLE_CARTRIDGE", flush_plan: "API_PLAN_11", service_class: "CLEAN", max_solids_pct: 0.0, max_viscosity_cst: 50.0, max_chloride_ppm: 200.0, max_temp_c: 120.0, min_running_clearance_mm: 0.30 }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /duty-applications"
              payload: { application_code: "APP-1001", customer_name: "Delta Refining", duty_flow_m3h: 265.0, duty_head_m: 74.0, npsha_available_m: 5.00, specific_gravity: 1.00, viscosity_cst: 1.2, solids_pct: 0.0, chloride_ppm: 150.0, process_temp_c: 60.0, min_efficiency_pct: 74.0, test_grade: "GRADE_1B", witness_required: true, service_class_required: "CLEAN" }
              as: ApplicationEngineer
              as_user_id: "eng-101"
              captures: { d1_id: $.data.id, d1_ver: $.data.version }
          trigger:
            - call: "POST /selections"
              payload: { duty_application_id: "${d1_id}", pump_model_id: "${m1_id}", material_seal_config_id: "${c1_id}", expected_duty_application_version: "${d1_ver}" }
              as: ApplicationEngineer
              as_user_id: "eng-101"
              captures: { s1_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Selection.${s1_id}.trimmed_impeller_diameter_mm == 350.3"
            - "Selection.${s1_id}.predicted_head_m == 73.97"
            - "Selection.${s1_id}.predicted_efficiency_pct == 80.96"
            - "Selection.${s1_id}.predicted_shaft_power_kw == 65.96"
            - "Selection.${s1_id}.min_motor_kw == 72.56"
            - "Selection.${s1_id}.npshr_catalog_m == 3.52"
            - "Selection.${s1_id}.npsh_provisional_margin_m == 1.48"
            - "Selection.${s1_id}.npsh_safety_factor == 1.25"
            - "Selection.${s1_id}.npshr_certified_m == 4.40"
            - "Selection.${s1_id}.npsh_margin_m == 0.60"
            - "Selection.${s1_id}.status == DRAFT and proposed_by_user_id == null"
      - name: pattern_wear_index_counts_only_the_first_critical_defect_per_lot
        claim_type: input_set_filtering
        grounds:
          - calculations.pattern_wear_index
          - endpoints["POST /casting-lots/{id}/defects"]
          - state_machines.PatternAsset.transitions.QUALIFIED_to_WORN
        distinguishing_aspect: |
          The wear input set is one increment per pour plus one increment per LOT that has any CRITICAL
          defect: a lot with two CRITICAL defects and one MINOR defect must still count 1 defect pour, so
          wear_index is 1 + 2*1 = 3 and a pattern with wear_threshold 5 stays QUALIFIED - counting each
          CRITICAL defect would give 5 and wrongly retire the pattern.
        test_recipe:
          setup:
            - "PatternAsset PAT-HSC14-A has wear_threshold 5 and zero counters."
            - "One lot H-9001 has been poured from it."
          setup_api_calls:
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH", name: "North Iron Works", approved_alloys: ["CI_GG25", "DUPLEX_S31803"], concurrent_pour_capacity: 2 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /pump-models"
              payload: { model_code: "HSC-14", generation: 2, interchange_group: "IG-HSC-14", max_impeller_diameter_mm: 355.0, min_impeller_diameter_mm: 300.0, shutoff_head_m: 92.0, bep_flow_m3h: 300.0, bep_head_m: 72.0, bep_efficiency_pct: 82.0, npshr_at_bep_m: 4.20, rated_speed_rpm: 2950, max_flow_m3h: 380.0, rotor_mass_kg: 68.0, balance_grade: "G6_3" }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /pattern-assets"
              payload: { pump_model_id: "${m1_id}", foundry_id: "${f1_id}", pattern_code: "PAT-HSC14-A", wear_threshold: 5 }
              as: PlatformAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /casting-lots"
              payload: { pattern_asset_id: "${p1_id}", foundry_id: "${f1_id}", heat_number: "H-9001", alloy_code: "CI_GG25", qty_poured: 4, pour_window_start: "2026-08-05T00:00:00Z", pour_window_end: "2026-08-10T00:00:00Z" }
              as: FoundryPartner
              as_user_id: "${f1_id}"
              captures: { l1_id: $.data.id }
            - call: "POST /casting-lots/${l1_id}/defects"
              payload: { defect_code: "DEF-C1", defect_type: "COLD_SHUT", severity: "CRITICAL", affected_qty: 1 }
              as: FoundryPartner
              as_user_id: "${f1_id}"
          trigger:
            - call: "POST /casting-lots/${l1_id}/defects"
              payload: { defect_code: "DEF-C2", defect_type: "MISRUN", severity: "CRITICAL", affected_qty: 1 }
              as: FoundryPartner
              as_user_id: "${f1_id}"
            - call: "POST /casting-lots/${l1_id}/defects"
              payload: { defect_code: "DEF-M1", defect_type: "POROSITY", severity: "MINOR", affected_qty: 1 }
              as: FoundryPartner
              as_user_id: "${f1_id}"
          assert:
            - "both calls return 201"
            - "PatternAsset.${p1_id}.pours_since_refurb == 1"
            - "PatternAsset.${p1_id}.defect_pours_since_refurb == 1"
            - "PatternAsset.${p1_id}.wear_index == 3"
            - "PatternAsset.${p1_id}.status == QUALIFIED and refurb_cycles == 0"
            - "PumpModel.${m1_id}.status is still ORDERABLE"
      - name: casting_yield_ledger_ignores_reported_and_use_as_is_defects
        claim_type: input_set_filtering
        grounds:
          - calculations.casting_yield_ledger
          - state_machines.CastingDefect.transitions.REPORTED_to_DISPOSITIONED_USE_AS_IS
        distinguishing_aspect: |
          Only DISPOSITIONED_SCRAP and DISPOSITIONED_REPAIR feed the two loss sums; a MAJOR defect on 2 of
          6 pieces must leave qty_accepted at 6 both while it is REPORTED and after it is dispositioned
          USE_AS_IS, so an as-cast blemish accepted by engineering never consumes inventory.
        test_recipe:
          setup:
            - "Lot H-9001 is POURED with 6 pieces and carries one REPORTED MAJOR defect on 2 pieces, logged by the foundry."
          setup_api_calls:
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH", name: "North Iron Works", approved_alloys: ["CI_GG25", "DUPLEX_S31803"], concurrent_pour_capacity: 2 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /pump-models"
              payload: { model_code: "HSC-14", generation: 2, interchange_group: "IG-HSC-14", max_impeller_diameter_mm: 355.0, min_impeller_diameter_mm: 300.0, shutoff_head_m: 92.0, bep_flow_m3h: 300.0, bep_head_m: 72.0, bep_efficiency_pct: 82.0, npshr_at_bep_m: 4.20, rated_speed_rpm: 2950, max_flow_m3h: 380.0, rotor_mass_kg: 68.0, balance_grade: "G6_3" }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /pattern-assets"
              payload: { pump_model_id: "${m1_id}", foundry_id: "${f1_id}", pattern_code: "PAT-HSC14-A", wear_threshold: 20 }
              as: PlatformAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /casting-lots"
              payload: { pattern_asset_id: "${p1_id}", foundry_id: "${f1_id}", heat_number: "H-9001", alloy_code: "CI_GG25", qty_poured: 6, pour_window_start: "2026-08-05T00:00:00Z", pour_window_end: "2026-08-10T00:00:00Z" }
              as: FoundryPartner
              as_user_id: "${f1_id}"
              captures: { l1_id: $.data.id }
            - call: "POST /casting-lots/${l1_id}/defects"
              payload: { defect_code: "DEF-003", defect_type: "INCLUSION", severity: "MAJOR", affected_qty: 2 }
              as: FoundryPartner
              as_user_id: "${f1_id}"
              captures: { df1_id: $.data.id }
          trigger:
            - call: "POST /casting-defects/${df1_id}/disposition"
              payload: { disposition: "USE_AS_IS" }
              as: QualityInspector
              as_user_id: "qi-301"
          assert:
            - "HTTP status is 200 and CastingDefect.${df1_id}.status == DISPOSITIONED_USE_AS_IS"
            - "CastingLot.${l1_id}.qty_poured == 6 and qty_accepted == 6"
            - "CastingLot.${l1_id}.qty_scrapped == 0 and qty_rework_pending == 0"
            - "CastingLot.${l1_id}.status is still POURED because USE_AS_IS triggers no quarantine cascade"
      - name: balance_allowance_reads_the_grade_g_table_not_a_fixed_coefficient
        claim_type: constants_applied
        grounds:
          - calculations.balance_allowance
          - entities.PumpModel.fields.balance_grade
          - endpoints["POST /build-orders/{id}/assembly"]
        distinguishing_aspect: |
          VTP-08 is a G2_5 rotor of 40.0 kg at 1480 rpm, so the ISO 1940 allowance is 2.5*9549*40.0/1480 =
          645.20 g mm and the clearance band is [0.25, 0.40] mm - a hardcoded G6_3 6.3 would yield 1626.30
          and wrongly accept a 900 g mm rotor, so the grade must be a genuine table lookup.
        test_recipe:
          setup:
            - "PumpModel VTP-08 exists with balance_grade G2_5, rotor_mass_kg 40.0 and rated_speed_rpm 1480."
            - "An APPROVED Selection of VTP-08 for APP-2002 exists and BuildOrder SN-2001 is PLANNED on an ACCEPTED lot."
