            - { call: "GET /api/investigations/${iv1}", as: IntakeCoordinator, captures: { ist: $.data.status } }
            - { call: "GET /api/clock-suspensions/${s1}", as: IntakeCoordinator, captures: { sst: $.data.status, scc: $.data.credited_seconds } }
          assert:
            - "cst == 'WITHDRAWN'; ast == 'RELEASED'; ist == 'CANCELLED'"
            - "sst == 'CLOSED' and scc == 259200 (3 days frozen at withdraw, not growing)"

      - name: reclassify_during_investigation_rejected
        claim_type: invalid_transition
        grounds: [state_machines.PatientCase.INTAKE_to_CLASSIFIED, "errors[ERR_CASE_INVALID_STATE]"]
        distinguishing_aspect: "Classification decisions are only accepted while INTAKE/CLASSIFIED; a reclassification attempt in UNDER_INVESTIGATION -> ERR_CASE_INVALID_STATE (even with correct OCC version)."
        test_recipe:
          setup: ["Grievance UNDER_INVESTIGATION"]
          setup_api_calls:
