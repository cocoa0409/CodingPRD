    - errors.ERR_CENTER_FORWARD_LOCKED
    distinguishing_aspect: "One finalize request both breaches the strict ready-deadline cutoff (business_temporal, priority 8) and lands on a center whose forward_posture is CONSTRAINED (business_constraint, priority 9), and the response is ERR_ORDER_CUTOFF_MISSED at 422 rather than ERR_CENTER_FORWARD_LOCKED at 409 \u2014 a business_temporal-versus-business_constraint pair, distinct from the state-versus-business_safety case."
