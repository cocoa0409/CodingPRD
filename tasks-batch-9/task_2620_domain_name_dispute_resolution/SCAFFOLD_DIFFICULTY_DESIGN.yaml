            - "Decision.${dec_id}.status == ISSUED with issued_at == 2026-08-01T00:00:00Z and implementation_deadline_at == 2026-08-14T00:00:00Z"
            - "Case.${case_id}.status == IMPLEMENTATION_WAITING and Panelist.active_case_load == 1 on each of the three panelists"

  - rule_id: resource_temporal_overlap
    instances:

      - name: engagement_windows_that_merely_touch_are_allowed_one_second_of_overlap_is_not
        grounds:
          - calculations.panelist_window_conflict
          - validations[priority=66].ERR_PANELIST_WINDOW_CONFLICT
          - entities.PanelistAppointment.fields.accepted_at
          - entities.PanelistAppointment.fields.decision_due_at
        distinguishing_aspect: |
          The scarce resource is a panelist's fourteen-day engagement window, and the two attempts sit
          one second apart on either side of a half-open boundary. With an ACCEPTED seat occupying
          [2026-08-10T00:00:00Z, 2026-08-24T00:00:00Z), a nomination at 2026-08-23T23:59:59Z overlaps
          by exactly one second and is refused, while a nomination at 2026-08-24T00:00:00Z merely
          touches and is allowed - the panelist then legitimately holds two engagements whose windows
          share an endpoint. Treating the interval as closed rejects the legal case; treating it as
          date-granular accepts the illegal one.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z for both case chains, then 2026-08-10, 2026-08-23T23:59:59Z and 2026-08-24T00:00:00Z."
            - "Registrar IANA-2313 ACTIVE; domains touch1.example and touch2.example under it."
            - "Complainant Touch Ltd (country_code FR) files a single-member case on each domain; both are paid, cleared by cm-002, verified with lock_applied true, notified by EMAIL and answered by the respondent on 2026-08-01, so both sit in RESPONSE_RECEIVED."
            - "One panelist (DE) with max_overlapping_engagements 5 and no declared blackout, so only the interval arithmetic can refuse a seat."
            - "At clock 2026-08-10T00:00:00Z the panelist accepts the SOLE seat of case 1, giving the window [2026-08-10T00:00:00Z, 2026-08-24T00:00:00Z)."
