              as: ChannelManager
              captures: { prog_a: $.data.id }
            - call: "POST /protein-ops/programs/${prog_a}/lifecycle"
              payload: { target_status: "ACTIVE" }
              as: ChannelManager
            - call: "POST /protein-ops/programs"
