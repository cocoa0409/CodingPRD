          MedicalDocumentation is cyclic (AWAITED -> RECEIVED -> AWAITED ->
          RECEIVED -> ACCEPTED): a reviewer rejection loops the record back to
          AWAITED with rejection_count incremented and a fresh 15-day deadline.
          Non-linearity on a different entity than the Claim cycle.
