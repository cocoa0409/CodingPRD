        grounds:
          - endpoints[POST /retrans/audit-findings/{id}/resolve]
          - state_machines.AuditFinding.OPEN_to_DISMISSED
          - state_machines.SubscriberReport.UNDER_AUDIT_to_REPORTED
        distinguishing_aspect: "DISMISSED only rewinds the report when no SUBSTANTIATED sibling exists: dismissing the sole finding returns the report from UNDER_AUDIT to REPORTED with audit_adjustment_subscribers 0 and the basis back at 100000, and the second finding dismissed after a substantiated one leaves the report ADJUSTED at 106000."
