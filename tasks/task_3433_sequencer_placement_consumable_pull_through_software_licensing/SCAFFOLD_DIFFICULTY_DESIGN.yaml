            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "INSTALL" }
              as: FieldServiceEngineer
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "COMMISSION" }
              as: FieldServiceEngineer
            - call: "POST /genomics/service-contracts"
              payload: { account_id: "${acct}", instrument_id: "${inst}", coverage_start: "2026-09-01T00:00:00Z", coverage_end: "2027-09-01T00:00:00Z", committed_uptime_percent: 99.0, monthly_fee_cents: 500000, annual_credit_cap_cents: 120000, reagent_guarantee: false }
              as: FinanceAdmin
              captures: { ctr: $.data.id }
            - call: "POST /genomics/service-contracts/${ctr}/activate"
              payload: {}
              as: FinanceAdmin
            - call: "POST /genomics/software-updates"
              payload: { update_version: "4.0.0", min_model_generation: 4, unlocks_run_modes: ["HIGH_OUTPUT"], clinical_validation_status: "NOT_VALIDATED" }
              as: PlatformAdmin
              captures: { upd: $.data.id }
          trigger:
            - call: "POST /genomics/instruments/${inst}/software-updates"
