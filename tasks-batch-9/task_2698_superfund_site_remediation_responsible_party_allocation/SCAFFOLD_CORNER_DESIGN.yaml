          rationale: "That instance offers exactly at the floor and one cent below it, so the conditional action is fully pinned."

  # The claim-extraction guide's Table 6 has a single obligation - every catalogued error must be
  # triggerable by at least one test - so every instance below carries claim_type: triggerable.
  # A coverage roll-call for all 49 codes closes this section.
  - section: errors
    instances:

      - name: corner_empty_user_id_header_returns_4XX
        claim_type: triggerable
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - endpoints[POST /sites]
        distinguishing_aspect: "Priority 1 fires before everything else: the same well-formed POST /sites body sent with an empty X-User-ID header is 401 ERR_UNAUTHENTICATED, not 422 for the payload and not 403 for the role."
        test_recipe:
          setup:
            - "Empty database; the request carries X-User-Role: RemedialProjectManager but an empty X-User-ID."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-04T08:00:00Z" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
          trigger:
            - call: "POST /sites"
              payload: { name: "Hollis Yard Coal Tar", epa_region: 2, hrs_score: 44.40 }
              as: RemedialProjectManager
              as_user_id: ""
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 401 with response_type == error and $.data.error_id == ERR_UNAUTHENTICATED"
            - "no Site row was created: GET /sites as a valid RemedialProjectManager returns total_count == 0"

      - name: corner_unknown_ids_on_every_path_rooted_entity_not_found
        claim_type: triggerable
        grounds:
          - validations[priority=4]
          - errors[ERR_WASTE_IN_RECORD_NOT_FOUND]
          - errors[ERR_RECORD_OF_DECISION_NOT_FOUND]
          - errors[ERR_ALLOCATION_ROUND_NOT_FOUND]
          - errors[ERR_CONSENT_DECREE_NOT_FOUND]
          - errors[ERR_REMEDIATION_CONTRACT_NOT_FOUND]
          - errors[ERR_COST_RECOVERY_ACTION_NOT_FOUND]
        distinguishing_aspect: "Each path-rooted entity reports its own 404 code rather than a shared generic one, and the code follows the entity named by the path segment even though all six ids are drawn from the same empty namespace."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-04T08:00:00Z" }
