# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1381: IP Portfolio Docketing & Annuity Payments
# 9 rules x >=2 instances = 19 active instances (combinatorial_formula and
# boundary_precision_check carry 3 each).
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: budget_forecast_committed_vs_projected_diverge
        grounds:
          - calculations.budget_forecast
          - entities.PatentFamily.fields.committed_forecast_cents
          - endpoints."GET /families/{familyId}/budget-forecast"
        distinguishing_aspect: |
          Dual variant on the PatentFamily money domain: with identical
          obligations (y1 AUTHORIZED at 10255, y2/y3 SCHEDULED at 1026/3077),
          variant=COMMITTED reports 10255 while variant=PROJECTED reports 14358
          on the same family at the same instant — the variants differ by
          inclusion set AND value basis (actuals vs estimates).
        test_recipe:
          setup:
            - "EP rule with fx_to_usd_cents_bps 10255 and tier fees 10000/1000/3000 for years 1/2/3 (bounds '1|2|3|4-20')"
            - "Client with one family (cap 1000000) and one GRANTED EP application (entity_size LARGE, grant 2026-03-01) generating obligations y1 due 2026-09-01 est 10255, y2 est 1026, y3 est 3077"
            - "y1 obligation AUTHORIZED at 10255 via approve by the family's ClientApprover"
          setup_api_calls:
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction: "EP", oa_response_months: 3, max_extensions: 2, extension_months: 1, extension_fee_cents: 20000, annuity_start_year: 1, term_years: 3, surcharge_window_months: 6, surcharge_bps_month_1: 2500, surcharge_bps_late: 5000, small_entity_multiplier_bps: 5000, fee_tier_bounds: "1|2|3|4-20", fee_tier_1_cents: 10000, fee_tier_2_cents: 1000, fee_tier_3_cents: 3000, fee_tier_4_cents: 9999, paris_window_months: 12, pct_window_months: 30, fx_to_usd_cents_bps: 10255 }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { display_name: "Acme EP" }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }

            - call: "POST /clients/${cl_id}/contacts"
              payload: { full_name: "C Approve", email: "ca@x.com" }
              as: PlatformAdmin
              captures: { ct_id: $.data.id }

            - call: "POST /clients/${cl_id}/families"
              payload: { title: "F1", first_priority_date: "2026-01-15", budget_cap_cents: 1000000 }
              as: DocketingManager
              as_user_id: mgr-1
              captures: { fam_id: $.data.id }

            - call: "POST /families/${fam_id}/applications"
              payload: { jurisdiction: "EP", application_type: "ORIGINAL", filing_date: "2026-02-01", application_number: "EP-1", entity_size: "LARGE" }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { app_id: $.data.id }

            - call: "POST /applications/${app_id}/file"
              payload: {}
              as: DocketingClerk
              as_user_id: clerk-1
            - call: "POST /applications/${app_id}/grant"
              payload: { grant_date: "2026-03-01" }
              as: DocketingClerk
              as_user_id: clerk-1
            - call: "GET /applications/${app_id}/annuity-obligations"
              as: Any
              captures: { ob_y1: "$.data[0].id" }

            - call: "GET /annuity-obligations/${ob_y1}"
              as: Any
              captures: { ob_y1_v: $.data.version }

            - call: "POST /annuity-obligations/${ob_y1}/authorizations"
              payload: { amount_cents: 10255, expected_annuity_obligation_version: "${ob_y1_v}" }
              as: DocketingManager
              as_user_id: mgr-1
              captures: { au_y1: $.data.id }

            - call: "POST /authorizations/${au_y1}/approve"
              payload: {}
              as: ClientApprover
              as_user_id: "${ct_id}"
          trigger:
            - call: "GET /families/${fam_id}/budget-forecast"
              payload: { variant: "COMMITTED" }
              as: Any
              captures: { tot_committed: $.data.total_usd_cents }

            - call: "GET /families/${fam_id}/budget-forecast"
              payload: { variant: "PROJECTED" }
              as: Any
              captures: { tot_projected: $.data.total_usd_cents }

          assert:
            - "tot_committed == 10255"
            - "tot_projected == 14358"
            - "PatentFamily.${fam_id}.committed_forecast_cents == 10255"

      - name: client_risk_score_statutory_vs_all_diverge
        grounds:
          - calculations.client_risk_score
          - endpoints."GET /clients/{clientId}/risk-score"
        distinguishing_aspect: |
          Dual variant on the Client risk domain (different entity domain than
          the family money forecast above): with one open STATUTORY entry
          (weight 10, 4 days out, x4 -> 40), one OFFICE_ACTION_RESPONSE entry
          (4, 19 days, x2 -> 8), one ANNUITY entry (6, 55 days, x1 -> 6) and one
          RECORDATION entry (2, 304 days, x0.5 -> 1), variant=STATUTORY_ONLY
          yields 40 / ELEVATED while variant=ALL_DEADLINES yields 55 /
          CRITICAL — same open-entry set, different inclusion filter, different
          score AND different tier.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z"
            - "US rule with oa_response_months 3; client with one family; one PENDING US application"
            - "Manual DocketEntry STATUTORY due 2026-08-05; manual ANNUITY entry due 2026-09-25; manual RECORDATION entry due 2027-06-01"
            - "OfficeAction NON_FINAL_REJECTION mailed 2026-05-20 auto-creating OFFICE_ACTION_RESPONSE entry due 2026-08-20"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction: "US", oa_response_months: 3, max_extensions: 2, extension_months: 1, extension_fee_cents: 20000, annuity_start_year: 3, term_years: 5, surcharge_window_months: 6, surcharge_bps_month_1: 2500, surcharge_bps_late: 5000, small_entity_multiplier_bps: 5000, fee_tier_bounds: "1-3|4-7|8-12|13-20", fee_tier_1_cents: 10000, fee_tier_2_cents: 20000, fee_tier_3_cents: 30000, fee_tier_4_cents: 40000, paris_window_months: 12, pct_window_months: 30, fx_to_usd_cents_bps: 10000 }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { display_name: "RiskCo" }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }

            - call: "POST /clients/${cl_id}/families"
              payload: { title: "RF", first_priority_date: "2026-01-15", budget_cap_cents: 1000000 }
              as: DocketingManager
              as_user_id: mgr-1
              captures: { fam_id: $.data.id }

            - call: "POST /families/${fam_id}/applications"
              payload: { jurisdiction: "US", application_type: "ORIGINAL", filing_date: "2026-02-01", application_number: "US-1", entity_size: "LARGE" }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { app_id: $.data.id }

            - call: "POST /applications/${app_id}/file"
              payload: {}
              as: DocketingClerk
              as_user_id: clerk-1
            - call: "POST /applications/${app_id}/docket-entries"
              payload: { entry_type: "STATUTORY", title: "Stat bar", base_due_date: "2026-08-05" }
              as: DocketingClerk
              as_user_id: clerk-1
            - call: "POST /applications/${app_id}/docket-entries"
              payload: { entry_type: "ANNUITY", title: "Ann reminder", base_due_date: "2026-09-25" }
              as: DocketingClerk
              as_user_id: clerk-1
            - call: "POST /applications/${app_id}/docket-entries"
              payload: { entry_type: "RECORDATION", title: "Record assignment", base_due_date: "2027-06-01" }
              as: DocketingClerk
              as_user_id: clerk-1
            - call: "POST /applications/${app_id}/office-actions"
              payload: { action_type: "NON_FINAL_REJECTION", mail_date: "2026-05-20" }
              as: DocketingClerk
              as_user_id: clerk-1
          trigger:
            - call: "GET /clients/${cl_id}/risk-score"
              payload: { variant: "STATUTORY_ONLY" }
              as: Any
              captures: { score_stat: $.data.score, tier_stat: $.data.tier }

            - call: "GET /clients/${cl_id}/risk-score"
              payload: { variant: "ALL_DEADLINES" }
              as: Any
              captures: { score_all: $.data.score, tier_all: $.data.tier }

          assert:
            - "score_stat == 40"
            - "tier_stat == ELEVATED"
            - "score_all == 55"
            - "tier_all == CRITICAL"

  - rule_id: combinatorial_formula
    instances:
      - name: annuity_fee_tiered_small_entity_surcharge_branches
        grounds:
          - calculations.annuity_fee_amount
          - entities.JurisdictionRule.fields.fee_tier_bounds
          - endpoints."POST /annuity-obligations/{obligationId}/confirm-payment"
        distinguishing_aspect: |
          Mode (a) — a >=3-input non-linear formula: tier lookup by
          period_year, conditional SMALL-entity halving with round_half_up at a
          .5 boundary (10001 -> 5001), and a months_late branch selecting
          between two surcharge tiers. Pinned outcomes: SMALL y3 base 5001,
          paid 2 months late -> 5001 + round(5001*0.5)=2501 -> 7502; LARGE y4
          base 20000, paid 20 days late -> +25% -> 25000; LARGE y3 paid on its
          due date -> 10001 with zero surcharge.
        test_recipe:
          setup:
            - "JP rule: tier bounds '1-3|4-7|8-12|13-20', tier1 10001, tier2 20000, small multiplier 5000 bps, surcharge 2500 bps month 1 / 5000 bps late, fx 10000, start_year 3, term_years 4"
            - "App S (entity_size SMALL, grant 2026-03-01): obligation y3 due 2028-09-01 base_fee_local_cents 5001"
            - "App L (entity_size LARGE, grant 2026-03-01): obligations y3 due 2028-09-01 base 10001, y4 due 2029-09-01 base 20000"
            - "Each target obligation authorized for its base amount, released, and instructed"
          setup_api_calls:
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction: "JP", oa_response_months: 3, max_extensions: 2, extension_months: 1, extension_fee_cents: 20000, annuity_start_year: 3, term_years: 4, surcharge_window_months: 6, surcharge_bps_month_1: 2500, surcharge_bps_late: 5000, small_entity_multiplier_bps: 5000, fee_tier_bounds: "1-3|4-7|8-12|13-20", fee_tier_1_cents: 10001, fee_tier_2_cents: 20000, fee_tier_3_cents: 30000, fee_tier_4_cents: 40000, paris_window_months: 12, pct_window_months: 30, fx_to_usd_cents_bps: 10000 }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { display_name: "FeeCo" }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }

            - call: "POST /clients/${cl_id}/contacts"
              payload: { full_name: "C Approve", email: "ca@x.com" }
              as: PlatformAdmin
              captures: { ct_id: $.data.id }

            - call: "POST /clients/${cl_id}/families"
              payload: { title: "FF", first_priority_date: "2026-01-15", budget_cap_cents: 1000000 }
              as: DocketingManager
              as_user_id: mgr-1
              captures: { fam_id: $.data.id }

            - call: "POST /families/${fam_id}/applications"
              payload: { jurisdiction: "JP", application_type: "ORIGINAL", filing_date: "2026-02-01", application_number: "JP-S", entity_size: "SMALL" }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { app_s: $.data.id }

            - call: "POST /applications/${app_s}/file"
              payload: {}
              as: DocketingClerk
              as_user_id: clerk-1
            - call: "POST /applications/${app_s}/grant"
              payload: { grant_date: "2026-03-01" }
              as: DocketingClerk
              as_user_id: clerk-1
            - call: "POST /families/${fam_id}/applications"
              payload: { jurisdiction: "JP", application_type: "ORIGINAL", filing_date: "2026-02-01", application_number: "JP-L", entity_size: "LARGE" }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { app_l: $.data.id }

            - call: "POST /applications/${app_l}/file"
              payload: {}
              as: DocketingClerk
              as_user_id: clerk-1
            - call: "POST /applications/${app_l}/grant"
              payload: { grant_date: "2026-03-01" }
              as: DocketingClerk
              as_user_id: clerk-1
            - call: "GET /applications/${app_s}/annuity-obligations"
              as: Any
              captures: { ob_s3: "$.data[0].id", ob_s3_base: "$.data[0].base_fee_local_cents" }

            - call: "GET /annuity-obligations/${ob_s3}"
              as: Any
              captures: { ob_s3_v: $.data.version }

            - call: "POST /annuity-obligations/${ob_s3}/authorizations"
              payload: { amount_cents: 5001, expected_annuity_obligation_version: "${ob_s3_v}" }
              as: DocketingManager
              as_user_id: mgr-1
              captures: { au_s3: $.data.id }

            - call: "POST /authorizations/${au_s3}/approve"
              payload: {}
              as: ClientApprover
              as_user_id: "${ct_id}"
            - call: "POST /authorizations/${au_s3}/release"
              payload: {}
              as: FinanceOfficer
              as_user_id: fin-1
            - call: "POST /annuity-obligations/${ob_s3}/instruct-payment"
              payload: {}
              as: FinanceOfficer
              as_user_id: fin-1
            - call: "GET /applications/${app_l}/annuity-obligations"
              as: Any
              captures: { ob_l3: "$.data[0].id", ob_l4: "$.data[1].id" }

            - call: "GET /annuity-obligations/${ob_l3}"
              as: Any
              captures: { ob_l3_v: $.data.version }

            - call: "POST /annuity-obligations/${ob_l3}/authorizations"
              payload: { amount_cents: 10001, expected_annuity_obligation_version: "${ob_l3_v}" }
              as: DocketingManager
              as_user_id: mgr-1
              captures: { au_l3: $.data.id }

            - call: "POST /authorizations/${au_l3}/approve"
              payload: {}
              as: ClientApprover
              as_user_id: "${ct_id}"
            - call: "POST /authorizations/${au_l3}/release"
              payload: {}
              as: FinanceOfficer
              as_user_id: fin-1
            - call: "POST /annuity-obligations/${ob_l3}/instruct-payment"
              payload: {}
              as: FinanceOfficer
              as_user_id: fin-1
            - call: "GET /annuity-obligations/${ob_l4}"
              as: Any
              captures: { ob_l4_v: $.data.version }

            - call: "POST /annuity-obligations/${ob_l4}/authorizations"
              payload: { amount_cents: 20000, expected_annuity_obligation_version: "${ob_l4_v}" }
              as: DocketingManager
              as_user_id: mgr-1
              captures: { au_l4: $.data.id }

            - call: "POST /authorizations/${au_l4}/approve"
              payload: {}
              as: ClientApprover
              as_user_id: "${ct_id}"
            - call: "POST /authorizations/${au_l4}/release"
              payload: {}
              as: FinanceOfficer
              as_user_id: fin-1
            - call: "POST /annuity-obligations/${ob_l4}/instruct-payment"
              payload: {}
              as: FinanceOfficer
              as_user_id: fin-1
          trigger:
            - call: "POST /annuity-obligations/${ob_s3}/confirm-payment"
              payload: { paid_date: "2028-10-15" }
              as: FinanceOfficer
              as_user_id: fin-1
              captures: { paid_s3: $.data.paid_amount_cents }

            - call: "POST /annuity-obligations/${ob_l3}/confirm-payment"
              payload: { paid_date: "2028-09-01" }
              as: FinanceOfficer
              as_user_id: fin-1
              captures: { paid_l3: $.data.paid_amount_cents }

            - call: "POST /annuity-obligations/${ob_l4}/confirm-payment"
              payload: { paid_date: "2029-09-21" }
              as: FinanceOfficer
              as_user_id: fin-1
              captures: { paid_l4: $.data.paid_amount_cents }

          assert:
            - "ob_s3_base == 5001"
            - "paid_s3 == 7502"
            - "paid_l3 == 10001"
            - "paid_l4 == 25000"

      - name: budget_forecast_per_line_rounding_beats_sum_then_round
        grounds:
          - calculations.budget_forecast
          - calculations.annuity_fee_amount
          - endpoints."GET /families/{familyId}/budget-forecast"
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: with fx
          10255 bps and local fees 10000/1000/3000, the pinned rule (convert
          and round per obligation line, then sum) yields 10255 + 1026 + 3077 =
          14358, whereas the forbidden sum-then-round order yields
          round(14000 * 1.0255) = 14357. The scaffold pins per-line-then-sum;
          the assertion 14358 discriminates the two orders.
        test_recipe:
          setup:
            - "EP rule fx 10255, tier fees 10000/1000/3000 (bounds '1|2|3|4-20'), start_year 1, term_years 3"
            - "Family with one GRANTED EP LARGE application (grant 2026-03-01); all three obligations remain SCHEDULED"
          setup_api_calls:
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction: "EP", oa_response_months: 3, max_extensions: 2, extension_months: 1, extension_fee_cents: 20000, annuity_start_year: 1, term_years: 3, surcharge_window_months: 6, surcharge_bps_month_1: 2500, surcharge_bps_late: 5000, small_entity_multiplier_bps: 5000, fee_tier_bounds: "1|2|3|4-20", fee_tier_1_cents: 10000, fee_tier_2_cents: 1000, fee_tier_3_cents: 3000, fee_tier_4_cents: 9999, paris_window_months: 12, pct_window_months: 30, fx_to_usd_cents_bps: 10255 }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { display_name: "RoundCo" }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }

            - call: "POST /clients/${cl_id}/families"
              payload: { title: "RF", first_priority_date: "2026-01-15", budget_cap_cents: 1000000 }
              as: DocketingManager
              as_user_id: mgr-1
              captures: { fam_id: $.data.id }

            - call: "POST /families/${fam_id}/applications"
              payload: { jurisdiction: "EP", application_type: "ORIGINAL", filing_date: "2026-02-01", application_number: "EP-R", entity_size: "LARGE" }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { app_id: $.data.id }

            - call: "POST /applications/${app_id}/file"
              payload: {}
              as: DocketingClerk
              as_user_id: clerk-1
            - call: "POST /applications/${app_id}/grant"
              payload: { grant_date: "2026-03-01" }
              as: DocketingClerk
              as_user_id: clerk-1
            - call: "GET /applications/${app_id}/annuity-obligations"
              as: Any
              captures: { est1: "$.data[0].estimated_amount_usd_cents", est2: "$.data[1].estimated_amount_usd_cents", est3: "$.data[2].estimated_amount_usd_cents" }

          trigger:
            - call: "GET /families/${fam_id}/budget-forecast"
              payload: { variant: "PROJECTED" }
              as: Any
              captures: { tot_projected: $.data.total_usd_cents }

          assert:
            - "est1 == 10255"
            - "est2 == 1026"
            - "est3 == 3077"
            - "tot_projected == 14358"

      - name: authorization_cap_evaluation_order_is_pinned
        grounds:
          - calculations.authorization_cap_evaluation
          - calculations.committed_forecast_rollup
          - validations[priority=23]
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order:
          whether obligation B may enter the COMMITTED forecast depends on a
          cap check that itself reads the COMMITTED forecast. The pinned order
          (read committed_before -> add candidate -> gate -> only then mutate)
          means B's failed approval leaves committed at exactly 10000 and B
          REQUESTED; after deauthorizing A (committed 0), the same B approval
          succeeds and committed becomes exactly 20000.
        test_recipe:
          setup:
            - "US rule; family cap 20000; GRANTED app (grant 2026-03-01) with y3 (est 10000) and y4 (est 20000) obligations"
            - "Authorization A (10000) on y3 and B (20000) on y4 both REQUESTED"
          setup_api_calls:
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction: "US", oa_response_months: 3, max_extensions: 2, extension_months: 1, extension_fee_cents: 20000, annuity_start_year: 3, term_years: 5, surcharge_window_months: 6, surcharge_bps_month_1: 2500, surcharge_bps_late: 5000, small_entity_multiplier_bps: 5000, fee_tier_bounds: "1-3|4-7|8-12|13-20", fee_tier_1_cents: 10000, fee_tier_2_cents: 20000, fee_tier_3_cents: 30000, fee_tier_4_cents: 40000, paris_window_months: 12, pct_window_months: 30, fx_to_usd_cents_bps: 10000 }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { display_name: "CapCo" }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }

            - call: "POST /clients/${cl_id}/contacts"
              payload: { full_name: "C Approve", email: "ca@x.com" }
              as: PlatformAdmin
              captures: { ct_id: $.data.id }

            - call: "POST /clients/${cl_id}/families"
              payload: { title: "CF", first_priority_date: "2026-01-15", budget_cap_cents: 20000 }
              as: DocketingManager
              as_user_id: mgr-1
              captures: { fam_id: $.data.id }

            - call: "POST /families/${fam_id}/applications"
              payload: { jurisdiction: "US", application_type: "ORIGINAL", filing_date: "2026-02-01", application_number: "US-C", entity_size: "LARGE" }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { app_id: $.data.id }

            - call: "POST /applications/${app_id}/file"
              payload: {}
              as: DocketingClerk
              as_user_id: clerk-1
            - call: "POST /applications/${app_id}/grant"
              payload: { grant_date: "2026-03-01" }
              as: DocketingClerk
              as_user_id: clerk-1
            - call: "GET /applications/${app_id}/annuity-obligations"
              as: Any
              captures: { ob_a: "$.data[0].id", ob_b: "$.data[1].id" }

            - call: "GET /annuity-obligations/${ob_a}"
              as: Any
              captures: { ob_a_v: $.data.version }

            - call: "POST /annuity-obligations/${ob_a}/authorizations"
              payload: { amount_cents: 10000, expected_annuity_obligation_version: "${ob_a_v}" }
              as: DocketingManager
              as_user_id: mgr-1
              captures: { au_a: $.data.id }

            - call: "GET /annuity-obligations/${ob_b}"
              as: Any
              captures: { ob_b_v: $.data.version }

            - call: "POST /annuity-obligations/${ob_b}/authorizations"
              payload: { amount_cents: 20000, expected_annuity_obligation_version: "${ob_b_v}" }
              as: DocketingManager
              as_user_id: mgr-1
              captures: { au_b: $.data.id }

            - call: "POST /authorizations/${au_a}/approve"
              payload: {}
              as: ClientApprover
              as_user_id: "${ct_id}"
          trigger:
            - call: "POST /authorizations/${au_b}/approve"
              payload: {}
              as: ClientApprover
              as_user_id: "${ct_id}"
              captures: { err_b: $.data.error_id }

            - call: "GET /families/${fam_id}"
              as: Any
              captures: { committed_mid: $.data.committed_forecast_cents }

            - call: "GET /authorizations/${au_b}"
              as: Any
              captures: { st_b_mid: $.data.status }

