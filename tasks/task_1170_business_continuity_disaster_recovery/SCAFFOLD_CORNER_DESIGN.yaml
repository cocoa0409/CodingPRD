              as: ResilienceAdmin
              captures: { p_id: $.data.id }
            - call: "POST /resilience/processes/${p_id}/activate"
              payload: {}
              as: ResilienceAdmin
            - call: "POST /resilience/gaps"
              payload: { process_id: "${p_id}", severity: "HIGH", description: "g1", due_date: "2026-05-20T00:00:00Z" }
              as: PlanAuthor
              as_user_id: "${c1_id}"
            - call: "POST /resilience/gaps"
              payload: { process_id: "${p_id}", severity: "LOW", description: "g2", due_date: "2026-12-01T00:00:00Z" }
              as: PlanAuthor
              as_user_id: "${c1_id}"
            - call: "GET /resilience/processes/${p_id}/gap-pressure"
              payload: {}
              as: PlanAuthor
              as_user_id: "${c1_id}"
              captures: { p_before: $.data.pressure_score }
            - call: "POST /resilience/gaps"
              payload: { process_id: "${p_id}", severity: "CRITICAL", description: "g3", due_date: "2026-05-20T00:00:00Z" }
              as: PlanAuthor
              as_user_id: "${c1_id}"
          trigger:
            - call: "GET /resilience/processes/${p_id}/gap-pressure"
