      - name: terrain_area_with_a_serving_lift_from_another_season_returns_cross_season_reference
        claim_type: parent_relationships
        grounds:
          - validations[priority=4]
          - errors[ERR_CROSS_SEASON_REFERENCE]
          - entities.TerrainArea.fields.serving_lift_id
        distinguishing_aspect: |
          The entity topology is flat, so nothing in the URL prevents pairing a season_id from one
          season with a serving_lift_id from another. Both FKs resolve, so a plain existence check
          passes - the rejection has to come from comparing the two rows season scopes. Getting this
          wrong would let capacity, wind holds and inspections leak across seasons.
        test_recipe:
          setup:
            - "Two seasons exist; the lift belongs to season B, the area is being created under season A."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MountainOpsDirector
            - call: "POST /mountain-ops/seasons"
              payload: { season_label: "2026-27", base_depth_policy: "MEAN_OF_STAKES", water_right_seasonal_af: 250.000, plant_max_gpm: 6000, snowmaking_kwh_per_af: 620.0, min_patrollers_per_open_area: 2, groom_freshness_hours: 18, energy_windows: [{ code: "OFF_1", start_hour_utc: 0, end_hour_utc: 6, price_usd_per_kwh: 0.062, tier: "OFF_PEAK" }, { code: "MID_1", start_hour_utc: 6, end_hour_utc: 9, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }, { code: "ON_1", start_hour_utc: 9, end_hour_utc: 21, price_usd_per_kwh: 0.187, tier: "ON_PEAK" }, { code: "MID_2", start_hour_utc: 21, end_hour_utc: 24, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }] }
              as: MountainOpsDirector
              captures: { season_a: $.data.id }
            - call: "POST /mountain-ops/seasons"
              payload: { season_label: "2027-28", base_depth_policy: "MEAN_OF_STAKES", water_right_seasonal_af: 250.000, plant_max_gpm: 6000, snowmaking_kwh_per_af: 620.0, min_patrollers_per_open_area: 2, groom_freshness_hours: 18, energy_windows: [{ code: "OFF_1", start_hour_utc: 0, end_hour_utc: 6, price_usd_per_kwh: 0.062, tier: "OFF_PEAK" }, { code: "MID_1", start_hour_utc: 6, end_hour_utc: 9, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }, { code: "ON_1", start_hour_utc: 9, end_hour_utc: 21, price_usd_per_kwh: 0.187, tier: "ON_PEAK" }, { code: "MID_2", start_hour_utc: 21, end_hour_utc: 24, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }] }
              as: MountainOpsDirector
              captures: { season_b: $.data.id }
            - call: "POST /mountain-ops/lifts"
              payload: { season_id: "${season_b}", lift_code: "LB", name: "Other Season Lift", lift_type: "DETACHABLE", wind_hold_threshold_mph: 40.0, hourly_capacity_pph: 1800, required_operator_count: 2 }
              as: LiftOpsManager
              captures: { lift_b: $.data.id }
          trigger:
            - call: "POST /mountain-ops/terrain-areas"
              payload: { season_id: "${season_a}", serving_lift_id: "${lift_b}", trail_code: "T1", name: "Leaky", terrain_class: "BLUE", acres: 18.0, min_open_base_depth_in: 30 }
              as: MountainOpsDirector
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with data.error_id == 'ERR_CROSS_SEASON_REFERENCE'."
            - "No TerrainArea row is created under either season."
            - "The same body with a lift created under season A is accepted, so the rejection is attributable to the scope mismatch alone."

      - name: patroller_with_an_unknown_assigned_terrain_area_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=4]
          - entities.Patroller.fields.assigned_terrain_area_id
          - errors[ERR_TERRAIN_AREA_NOT_FOUND]
        distinguishing_aspect: |
          assigned_terrain_area_id is an optional FK, which is the corner: optional must mean
          omittable, not unvalidated. An omitted value yields a roster-only patroller who counts toward
