              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/locations"
              payload: { label: "RL", lat: 40.0, lng: -74.0, scenario_family: "RETAIL" }
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { loc_id: $.data.id }
            - call: "POST /clients/${client_id}/scripts"
              payload: { title: "R", scenario_family: "RETAIL", required_photo_count: 1, receipt_required: false, reimburse_cap_cents: 5000, base_fee_cents: 2000, weights_json: { greeting: 1.0 }, passing_score: 70 }
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { script_id: $.data.id }
            - call: "POST /scripts/${script_id}/publish"
              payload: {}
              as: ClientManager
              as_user_id: "${client_id}"
            - call: "POST /clients/${client_id}/waves"
              payload: { name: "RW", field_window_start: "2026-06-01T00:00:00Z", field_window_end: "2026-06-30T00:00:00Z", rotation_cooldown_days: 30 }
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { wave_id: $.data.id }
            - call: "POST /waves/${wave_id}/publish"
              payload: {}
              as: ClientManager
              as_user_id: "${client_id}"
            - call: "POST /shoppers"
              payload: { full_name: "R Shop", email: "rs@x.test", home_lat: 40.0, home_lng: -74.0 }
              as: Anonymous
              captures: { shopper_id: $.data.id }
            - call: "POST /shoppers/${shopper_id}/certification-attempts"
              payload: { raw_score: 90, scenario_family: "RETAIL" }
              as: QaValidator
            - call: "POST /assignments"
              payload: { wave_id: "${wave_id}", shopper_id: "${shopper_id}", location_id: "${loc_id}", script_id: "${script_id}", due_at: "2026-06-20T00:00:00Z" }
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { asg_id: $.data.id }
            - call: "POST /assignments/${asg_id}/accept"
              payload: {}
              as: Shopper
              as_user_id: "${shopper_id}"
            - call: "POST /assignments/${asg_id}/evidence"
              payload: { kind: "PHOTO", object_uri: "s3://e/p.jpg" }
              as: Shopper
              as_user_id: "${shopper_id}"
              captures: { ph: $.data.id }
            - call: "POST /evidence/${ph}/review"
              payload: { decision: "APPROVE" }
              as: QaValidator
            - call: "POST /assignments/${asg_id}/scorecard"
              payload: { section_scores_json: { greeting: 88 } }
              as: Shopper
              as_user_id: "${shopper_id}"
            - call: "POST /assignments/${asg_id}/submit"
              payload: {}
              as: Shopper
              as_user_id: "${shopper_id}"
          trigger:
            - call: "POST /assignments/${asg_id}/request-revision"
              payload: {}
              as: QaValidator
