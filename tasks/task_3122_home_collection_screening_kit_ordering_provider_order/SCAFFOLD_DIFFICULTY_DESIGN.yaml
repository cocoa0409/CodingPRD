scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: sla_provisional_vs_return_logistics_on_abandoned_order
        grounds:
          - calculations.kit_turnaround_sla_days
          - entities.ScreeningOrder.fields.abandonment_due_at
        distinguishing_aspect: |
          On an abandoned (never-returned) ScreeningOrder the provisional variant
          reports 45 days while the return_logistics variant reports 45 days at
          abandonment day — but one day BEFORE abandonment (clock at
          shipped+44) provisional reports 44 while return_logistics already
          reports the full 45-day allowance: the two variants diverge on the
          same in-flight order.
        test_recipe:
          setup:
            - "Clock set to 2026-09-01; patient P (age-eligible, AVERAGE risk) and provider V (ORDERING) exist"
            - "Order O for P confirmed eligible; kit created and shipped on 2026-09-01; no return"
            - "Clock advanced to 2026-09-01 + 44 days (one day before abandonment_due_at)"
          setup_api_calls:
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /screening/patients"
              payload: { external_ref: "p-sla-1", date_of_birth: "1970-01-01", risk_category: "AVERAGE" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /screening/providers"
              payload: { npi: "1234567890", display_name: "Dr A", channel: "ORDERING" }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /screening/orders"
              payload: { patient_id: "${p_id}", provider_id: "${v_id}" }
              as: Provider
              as_user_id: "${v_id}"
              captures: { o_id: $.data.id, o_v1: $.data.version }
            - call: "POST /screening/orders/${o_id}/eligibility/confirm"
              payload: {}
              as: ProgramAdmin
            - call: "POST /screening/orders/${o_id}/kit"
              payload: { expected_order_version: "${o_v1} + 1" }
              as: FulfillmentAgent
              captures: { k_id: $.data.id }
            - call: "POST /screening/kits/${k_id}/ship"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /screening/orders/${o_id}/sla"
              as: ProgramAdmin
          assert:
            - "response.data.provisional_days == 44"
            - "response.data.return_logistics_days == 45"
            - "ScreeningOrder.${o_id}.status == KIT_SHIPPED (not yet abandoned)"

      - name: risk_score_weighted_vs_unweighted_channel_flip
        grounds:
          - calculations.weighted_risk_screen_score
          - entities.Patient.fields.recent_symptoms
        distinguishing_aspect: |
          The weighted risk score (entity domain: Patient) drives the
          recommended_channel advisory: patient A with only recent_symptoms
          scores 5 (HOME_KIT_OK) while patient B with only family_history
          scores 2 — an unweighted count treats both as one flag, but the
          weighted variant places A one point below the CLINIC threshold while
          B is three below; the variant difference is observable as different
          scores for equal flag-count inputs.
        test_recipe:
          setup:
            - "Patient A: recent_symptoms=true, comorbidity=false, family_history=false"
            - "Patient B: recent_symptoms=false, comorbidity=false, family_history=true"
          setup_api_calls:
            - call: "POST /screening/patients"
              payload: { external_ref: "p-risk-a", date_of_birth: "1970-06-15", risk_category: "AVERAGE", recent_symptoms: true, comorbidity: false, family_history: false }
              as: ProgramAdmin
              captures: { pa_id: $.data.id }
            - call: "POST /screening/patients"
              payload: { external_ref: "p-risk-b", date_of_birth: "1970-06-15", risk_category: "AVERAGE", recent_symptoms: false, comorbidity: false, family_history: true }
              as: ProgramAdmin
              captures: { pb_id: $.data.id }
          trigger:
            - call: "GET /screening/patients/${pa_id}/risk-score"
              as: ProgramAdmin
            - call: "GET /screening/patients/${pb_id}/risk-score"
              as: ProgramAdmin
          assert:
            - "patient A score == 5 and recommended_channel == HOME_KIT_OK"
            - "patient B score == 2 and recommended_channel == HOME_KIT_OK"
            - "patient A score != patient B score despite identical flag count (1 each)"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: quality_measure_rate_threshold_inputs
        grounds:
          - calculations.quality_measure_attribution
        distinguishing_aspect: |
          Mode (a) — formula with >=3 inputs and non-linear interaction:
          adherence_rate depends on attributed_count, adherent_count, AND the
          quality_outcome mapping branch (ADHERENT_POSITIVE_NAVIGATED only when
          navigation completed within the window); a positive result with a
          LAPSED navigation counts in the denominator but not the numerator,
          flipping the rate non-linearly relative to a NEGATIVE result.
        test_recipe:
          setup:
            - "Program G (PUSH, measure_year 2026) with two cohort members M1 and M2"
            - "M1's order resulted NEGATIVE; M2's order resulted POSITIVE and navigation LAPSED (clock moved past due date)"
          setup_api_calls:
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /screening/programs"
              payload: { program_code: "G-COMB", program_name: "G", outreach_mode: "PUSH", measure_year: 2026 }
              as: ProgramAdmin
              captures: { g_id: $.data.id }
            - call: "POST /screening/patients"
              payload: { external_ref: "p-comb-1", date_of_birth: "1970-01-01", risk_category: "AVERAGE" }
              as: ProgramAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /screening/patients"
              payload: { external_ref: "p-comb-2", date_of_birth: "1970-01-01", risk_category: "AVERAGE" }
              as: ProgramAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /screening/providers"
              payload: { npi: "1234567891", display_name: "Dr B", channel: "ORDERING" }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /screening/programs/${g_id}/cohorts"
              payload: { patient_id: "${p1_id}" }
              as: ProgramAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /screening/programs/${g_id}/cohorts"
              payload: { patient_id: "${p2_id}" }
              as: ProgramAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /screening/orders"
              payload: { patient_id: "${p1_id}", provider_id: "${v_id}", program_id: "${g_id}", cohort_id: "${c1_id}" }
              as: Provider
              as_user_id: "${v_id}"
              captures: { o1_id: $.data.id, o1_v: $.data.version }
            - call: "POST /screening/orders/${o1_id}/eligibility/confirm"
              payload: {}
              as: ProgramAdmin
            - call: "POST /screening/orders/${o1_id}/kit"
              payload: { expected_order_version: "${o1_v} + 1" }
              as: FulfillmentAgent
              captures: { k1_id: $.data.id }
            - call: "POST /screening/kits/${k1_id}/ship"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /screening/kits/${k1_id}/return"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /screening/orders/${o1_id}/specimens"
              payload: {}
              as: LabTechnician
              captures: { s1_id: $.data.id }
            - call: "POST /screening/specimens/${s1_id}/process"
              payload: {}
              as: LabTechnician
            - call: "POST /screening/specimens/${s1_id}/adequacy"
              payload: { adequacy: "ADEQUATE" }
              as: LabTechnician
            - call: "POST /screening/specimens/${s1_id}/result"
              payload: { outcome: "NEGATIVE" }
              as: LabTechnician
            - call: "POST /screening/orders"
              payload: { patient_id: "${p2_id}", provider_id: "${v_id}", program_id: "${g_id}", cohort_id: "${c2_id}" }
              as: Provider
              as_user_id: "${v_id}"
              captures: { o2_id: $.data.id, o2_v: $.data.version }
            - call: "POST /screening/orders/${o2_id}/eligibility/confirm"
              payload: {}
              as: ProgramAdmin
            - call: "POST /screening/orders/${o2_id}/kit"
              payload: { expected_order_version: "${o2_v} + 1" }
              as: FulfillmentAgent
              captures: { k2_id: $.data.id }
            - call: "POST /screening/kits/${k2_id}/ship"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /screening/kits/${k2_id}/return"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /screening/orders/${o2_id}/specimens"
              payload: {}
              as: LabTechnician
              captures: { s2_id: $.data.id }
            - call: "POST /screening/specimens/${s2_id}/process"
              payload: {}
              as: LabTechnician
            - call: "POST /screening/specimens/${s2_id}/adequacy"
              payload: { adequacy: "ADEQUATE" }
              as: LabTechnician
            - call: "POST /screening/specimens/${s2_id}/result"
              payload: { outcome: "POSITIVE" }
              as: LabTechnician
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-15T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /screening/programs/${g_id}/quality-measure-report"
              payload: {}
              as: ProgramAdmin
          assert:
            - "response.data.denominator == 2"
            - "response.data.numerator == 1"
            - "response.data.adherence_rate == 0.5"
            - "ScreeningOrder.${o2_id}.quality_outcome == POSITIVE_NAVIGATION_LAPSED"

      - name: navigation_window_circular_dependency_pinned_order
        grounds:
          - calculations.navigation_window_check
          - calculations.quality_measure_attribution
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order:
          quality_outcome (ADHERENT_POSITIVE_NAVIGATED vs
          POSITIVE_NAVIGATION_PENDING) depends on navigation_status, which
          itself is derived from navigation_due_at, which is computed from
          delivered_to_provider_at — the scaffold pins the order
          delivered_at -> due_at -> lapse check -> quality_outcome, so a
          completion exactly ON the due date is ADHERENT (inclusive boundary)
          while one day later is LAPSED.
        test_recipe:
          setup:
            - "Order resulted POSITIVE with delivered_to_provider_at on 2026-09-01; navigation_due_at = 2026-11-30"
            - "Navigation scheduled on 2026-09-10"
          setup_api_calls:
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /screening/patients"
              payload: { external_ref: "p-nav-1", date_of_birth: "1970-01-01", risk_category: "AVERAGE" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /screening/providers"
              payload: { npi: "1234567892", display_name: "Dr C", channel: "TELEHEALTH" }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /screening/orders"
              payload: { patient_id: "${p_id}", provider_id: "${v_id}" }
              as: Provider
              as_user_id: "${v_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /screening/orders/${o_id}/eligibility/confirm"
              payload: {}
              as: ProgramAdmin
            - call: "POST /screening/orders/${o_id}/kit"
              payload: { expected_order_version: "${o_v} + 1" }
              as: FulfillmentAgent
              captures: { k_id: $.data.id }
            - call: "POST /screening/kits/${k_id}/ship"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /screening/kits/${k_id}/return"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /screening/orders/${o_id}/specimens"
              payload: {}
              as: LabTechnician
              captures: { s_id: $.data.id }
            - call: "POST /screening/specimens/${s_id}/process"
              payload: {}
              as: LabTechnician
            - call: "POST /screening/specimens/${s_id}/adequacy"
              payload: { adequacy: "ADEQUATE" }
              as: LabTechnician
            - call: "POST /screening/specimens/${s_id}/result"
              payload: { outcome: "POSITIVE" }
              as: LabTechnician
              captures: { r_id: $.data.id }
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /screening/results/${r_id}/navigation/schedule"
              payload: {}
              as: Navigator
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-30T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /screening/results/${r_id}/navigation/complete"
              payload: {}
              as: Navigator
          assert:
            - "ScreeningResult.${r_id}.navigation_status == COMPLETED"
            - "ScreeningResult.${r_id}.navigation_due_at == 2026-11-30"
            - "ScreeningOrder.${o_id}.quality_outcome == ADHERENT_POSITIVE_NAVIGATED (completion on the due date is on-time: inclusive boundary)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_recollection_cycle
        grounds:
          - state_machines.ScreeningOrder.IN_LAB_to_RECOLLECTION_REQUESTED
          - state_machines.ScreeningOrder.RECOLLECTION_REQUESTED_to_KIT_ORDERED
        distinguishing_aspect: |
          ScreeningOrder cycles IN_LAB -> RECOLLECTION_REQUESTED ->
          KIT_ORDERED -> ... -> IN_LAB up to MAX_RECOLLECTIONS times; the
          recollection_round counter distinguishes the first loop from the
          terminal one (round 2 rejects further INADEQUATE with
          ERR_RECOLLECTION_LIMIT_REACHED).
        test_recipe:
          setup:
            - "Order O driven to IN_LAB; first specimen marked INADEQUATE (round becomes 1)"
            - "Replacement kit created, shipped, returned; second specimen accessioned"
          setup_api_calls:
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /screening/patients"
              payload: { external_ref: "p-rec-1", date_of_birth: "1970-01-01", risk_category: "AVERAGE" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /screening/providers"
              payload: { npi: "1234567893", display_name: "Dr D", channel: "ORDERING" }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /screening/orders"
              payload: { patient_id: "${p_id}", provider_id: "${v_id}" }
              as: Provider
              as_user_id: "${v_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /screening/orders/${o_id}/eligibility/confirm"
              payload: {}
              as: ProgramAdmin
            - call: "POST /screening/orders/${o_id}/kit"
              payload: { expected_order_version: "${o_v} + 1" }
              as: FulfillmentAgent
              captures: { k1_id: $.data.id }
            - call: "POST /screening/kits/${k1_id}/ship"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /screening/kits/${k1_id}/return"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /screening/orders/${o_id}/specimens"
              payload: {}
              as: LabTechnician
              captures: { s1_id: $.data.id }
            - call: "POST /screening/specimens/${s1_id}/adequacy"
              payload: { adequacy: "INADEQUATE" }
              as: LabTechnician
            - call: "GET /screening/orders/${o_id}"
              as: ProgramAdmin
              captures: { o_v2: $.data.version }
            - call: "POST /screening/orders/${o_id}/kit"
              payload: { expected_order_version: "${o_v2}" }
              as: FulfillmentAgent
              captures: { k2_id: $.data.id }
            - call: "POST /screening/kits/${k2_id}/ship"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /screening/kits/${k2_id}/return"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /screening/orders/${o_id}/specimens"
              payload: {}
              as: LabTechnician
              captures: { s2_id: $.data.id }
          trigger:
            - call: "GET /screening/orders/${o_id}"
              as: ProgramAdmin
          assert:
            - "ScreeningOrder.${o_id}.status == IN_LAB (second pass through the cycle)"
            - "ScreeningOrder.${o_id}.recollection_round == 1"
            - "ScreeningKit.${k1_id}.status == CONSUMED"
            - "ScreeningKit.${k2_id}.status == RETURNED"
            - "ScreeningOrder.${o_id}.active_kit_id == ${k2_id}"

      - name: navigation_branching_fork_join
        grounds:
          - state_machines.ScreeningResult.PENDING_to_SCHEDULED
          - state_machines.ScreeningResult.SCHEDULED_to_COMPLETED
          - state_machines.ScreeningResult.PENDING_to_LAPSED
        distinguishing_aspect: |
          ScreeningResult (a different entity than ScreeningOrder) forks at
          result time into NOT_REQUIRED (NEGATIVE) or PENDING (POSITIVE), and
          PENDING joins to exactly one of COMPLETED or LAPSED with divergent
          side-effect sets: COMPLETED sets navigation_completed_at and may make
          the order ADHERENT; LAPSED flips quality_outcome to
          POSITIVE_NAVIGATION_LAPSED.
        test_recipe:
          setup:
            - "Two orders resulted on 2026-09-01: R1 NEGATIVE, R2 POSITIVE (navigation PENDING, due 2026-11-30)"
            - "Clock advanced to 2026-12-01 (past R2's due date)"
          setup_api_calls:
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /screening/patients"
              payload: { external_ref: "p-br-1", date_of_birth: "1970-01-01", risk_category: "AVERAGE" }
              as: ProgramAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /screening/patients"
              payload: { external_ref: "p-br-2", date_of_birth: "1970-01-01", risk_category: "AVERAGE" }
              as: ProgramAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /screening/providers"
              payload: { npi: "1234567894", display_name: "Dr E", channel: "ORDERING" }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /screening/orders"
              payload: { patient_id: "${p1_id}", provider_id: "${v_id}" }
              as: Provider
              as_user_id: "${v_id}"
              captures: { o1_id: $.data.id, o1_v: $.data.version }
            - call: "POST /screening/orders/${o1_id}/eligibility/confirm"
              payload: {}
              as: ProgramAdmin
            - call: "POST /screening/orders/${o1_id}/kit"
              payload: { expected_order_version: "${o1_v} + 1" }
              as: FulfillmentAgent
              captures: { k1_id: $.data.id }
            - call: "POST /screening/kits/${k1_id}/ship"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /screening/kits/${k1_id}/return"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /screening/orders/${o1_id}/specimens"
              payload: {}
              as: LabTechnician
              captures: { s1_id: $.data.id }
            - call: "POST /screening/specimens/${s1_id}/process"
              payload: {}
              as: LabTechnician
            - call: "POST /screening/specimens/${s1_id}/adequacy"
              payload: { adequacy: "ADEQUATE" }
              as: LabTechnician
            - call: "POST /screening/specimens/${s1_id}/result"
              payload: { outcome: "NEGATIVE" }
              as: LabTechnician
              captures: { r1_id: $.data.id }
            - call: "POST /screening/orders"
              payload: { patient_id: "${p2_id}", provider_id: "${v_id}" }
              as: Provider
              as_user_id: "${v_id}"
              captures: { o2_id: $.data.id, o2_v: $.data.version }
            - call: "POST /screening/orders/${o2_id}/eligibility/confirm"
              payload: {}
              as: ProgramAdmin
            - call: "POST /screening/orders/${o2_id}/kit"
              payload: { expected_order_version: "${o2_v} + 1" }
              as: FulfillmentAgent
              captures: { k2_id: $.data.id }
            - call: "POST /screening/kits/${k2_id}/ship"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /screening/kits/${k2_id}/return"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /screening/orders/${o2_id}/specimens"
              payload: {}
              as: LabTechnician
              captures: { s2_id: $.data.id }
            - call: "POST /screening/specimens/${s2_id}/process"
              payload: {}
              as: LabTechnician
            - call: "POST /screening/specimens/${s2_id}/adequacy"
              payload: { adequacy: "ADEQUATE" }
              as: LabTechnician
            - call: "POST /screening/specimens/${s2_id}/result"
              payload: { outcome: "POSITIVE" }
              as: LabTechnician
              captures: { r2_id: $.data.id }
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /screening/results/${r1_id}"
              as: Navigator
            - call: "GET /screening/results/${r2_id}"
              as: Navigator
          assert:
            - "ScreeningResult.${r1_id}.navigation_status == NOT_REQUIRED (NEGATIVE branch)"
            - "ScreeningResult.${r2_id}.navigation_status == LAPSED (POSITIVE branch, past due date)"
            - "ScreeningOrder.${o1_id}.quality_outcome == ADHERENT_NEGATIVE"
            - "ScreeningOrder.${o2_id}.quality_outcome == POSITIVE_NAVIGATION_LAPSED"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: result_delivery_cascade_depth3
        grounds:
          - state_machines.ScreeningOrder.IN_LAB_to_RESULTED
          - state_machines.MemberCohort.ORDERED_to_SCREENED
          - calculations.quality_measure_attribution
        distinguishing_aspect: |
          Depth-3 chain originating from the RESULT transition: specimen
          RESULTED mutates the ScreeningOrder (status + quality_outcome), that
          order mutation cascades to its MemberCohort (ORDERED -> SCREENED),
          and the cohort mutation itself triggers recomputation of the
          HealthPlanProgram counters (adherent_count += 1). Each hop is caused
          by the previous hop, not by the original POST.
        test_recipe:
          setup:
            - "PUSH program G with cohort member M; order O carrying cohort_id driven to IN_LAB with ADEQUATE specimen in PROCESSING"
          setup_api_calls:
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /screening/programs"
              payload: { program_code: "G-CASC", program_name: "GC", outreach_mode: "PUSH", measure_year: 2026 }
              as: ProgramAdmin
              captures: { g_id: $.data.id }
            - call: "POST /screening/patients"
              payload: { external_ref: "p-casc-1", date_of_birth: "1970-01-01", risk_category: "AVERAGE" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /screening/providers"
              payload: { npi: "1234567895", display_name: "Dr F", channel: "ORDERING" }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /screening/programs/${g_id}/cohorts"
              payload: { patient_id: "${p_id}" }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
            - call: "POST /screening/orders"
              payload: { patient_id: "${p_id}", provider_id: "${v_id}", program_id: "${g_id}", cohort_id: "${c_id}" }
              as: Provider
              as_user_id: "${v_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /screening/orders/${o_id}/eligibility/confirm"
              payload: {}
              as: ProgramAdmin
            - call: "POST /screening/orders/${o_id}/kit"
              payload: { expected_order_version: "${o_v} + 1" }
              as: FulfillmentAgent
              captures: { k_id: $.data.id }
            - call: "POST /screening/kits/${k_id}/ship"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /screening/kits/${k_id}/return"
              payload: {}
