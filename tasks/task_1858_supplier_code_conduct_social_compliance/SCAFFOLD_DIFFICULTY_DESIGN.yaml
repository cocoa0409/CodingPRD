  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_temporal_on_exited_facility_booking
        grounds:
          - "validations[priority=7]"
          - "validations[priority=10]"
          - "errors[ERR_FACILITY_NOT_ACTIVE]"
          - "errors[ERR_AUDITOR_BOOKING_CONFLICT]"
        distinguishing_aspect: |
          Error-category pair state (p7) vs business_temporal (p10): the request
          violates BOTH (facility EXITED; the auditor's [2026-09-01, 2026-09-05)
          booking intersects [2026-09-02, 2026-09-04)) and the state error MUST win.
          The paired instance exercises a different category pair
          (business_safety vs business_referential).
        test_recipe:
          setup:
            - "Supplier ACTIVE; facilities facA (US) and facB (US); auditor aud1 (covers US) has a SCHEDULED audit at facB [2026-09-01, 2026-09-05)"
