# =============================================================================
# PRD Benchmark Scaffold — Pop-Up Free Clinic Event Operations & Volunteer Licensing
# =============================================================================
# Domain: Remote Area Medical style pop-up free clinic events.
# Archetype: posture-driven gating (Event posture gates every child operation)
#            + quota/allocation (station throughput, patient tickets)
#            + compliance/audit (license verification & state practice authorization)
# =============================================================================

scenario: |
  Pop-Up Free Clinic Event Operations & Volunteer Licensing (Remote Area Medical):
  event site selection with host agreements for arenas, fairgrounds and schools,
  volunteer recruitment across dental, vision and medical disciplines with license
  verification and state practice authorization, ticketing or queue system for
  patients arriving before dawn with capacity limits and fair sequencing, service
  station layout with triage, dental extraction and denture fabrication, eye exam
  and glasses lab throughput, equipment transport and setup with sterilization
  capability in a temporary venue, patient records for a one-time encounter with
  referral information for follow-up care, unmet demand documentation when
  capacity runs out, teardown and community partner handoff.

domain_name: pop-up-clinic-events
api_prefix: /clinic-events

complexity_profile:
  primary_archetype: posture-driven-gating
  secondary_archetype: quota-allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: posture_driven
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ClinicEvent
    parent: null
    common_fields: true
    fields:
      - { name: event_code, type: string, source: input, description: "Human-readable unique event code (e.g. RAM-2026-APP-01)" }
      - { name: name, type: string, source: input, description: "Display name of the clinic event" }
      - { name: host_state_code, type: string, source: input, description: "Two-letter US state code where the event is physically held; governs volunteer practice authorization" }
      - { name: service_date, type: string, source: input, description: "ISO-8601 calendar date (YYYY-MM-DD) of the single service day" }
      - { name: doors_open_utc, type: string, source: input, description: "ISO-8601 timestamp when patient queue opens (typically pre-dawn)" }
      - { name: total_patient_capacity, type: integer, source: input, description: "Hard ceiling on tickets issuable for the event; must be >= 1" }
      - { name: posture, type: enum, source: computed, default: PLANNING, description: "Derived aggregate gate: PLANNING | SITE_LOCKED | STAFFING | READY | IN_SERVICE | TEARDOWN | CLOSED | CANCELLED. Gates all child operations; recomputed on every child mutation", constraints: "enum: PLANNING, SITE_LOCKED, STAFFING, READY, IN_SERVICE, TEARDOWN, CLOSED, CANCELLED" }
      - { name: confirmed_site_agreement_id, type: string, source: system, description: "FK -> SiteAgreement.id; the single CONFIRMED agreement for this event, null until one is confirmed", constraints: "nullable" }
      - { name: dental_chair_count, type: integer, source: computed, default: 0, description: "Sum of ServiceStation.chair_count where station_type == DENTAL and status == OPERATIONAL" }
      - { name: vision_lane_count, type: integer, source: computed, default: 0, description: "Sum of ServiceStation.chair_count where station_type == VISION and status == OPERATIONAL" }
      - { name: medical_bay_count, type: integer, source: computed, default: 0, description: "Sum of ServiceStation.chair_count where station_type == MEDICAL and status == OPERATIONAL" }
      - { name: verified_volunteer_count, type: integer, source: computed, default: 0, description: "Count of Volunteer rows with status == AUTHORIZED linked to this event via DisciplineAssignment status == CONFIRMED" }
      - { name: tickets_issued_count, type: integer, source: computed, default: 0, description: "Count of PatientTicket rows with status IN {QUEUED, CALLED, IN_SERVICE}" }
      - { name: tickets_served_count, type: integer, source: computed, default: 0, description: "Count of PatientTicket rows with status == SERVED" }
      - { name: unmet_demand_count, type: integer, source: computed, default: 0, description: "Count of PatientTicket rows with status == TURNED_AWAY" }
      - { name: projected_servable_patients, type: number, source: computed, default: 0, description: "Forward-looking projection from station throughput calculation (see calculations.projected_servable_patients)" }
      - { name: sterilization_cycles_completed, type: integer, source: computed, default: 0, description: "Count of SterilizationCycle rows with status == COMPLETED for this event" }

  - name: Site
    parent: null
    common_fields: true
    fields:
      - { name: site_name, type: string, source: input, description: "Venue name (arena, fairground, school)" }
      - { name: site_type, type: enum, source: input, description: "ARENA | FAIRGROUND | SCHOOL", constraints: "enum: ARENA, FAIRGROUND, SCHOOL" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code of the venue" }
      - { name: square_footage, type: integer, source: input, description: "Usable indoor square footage; must be >= 2000" }
      - { name: has_loading_dock, type: boolean, source: input, description: "Whether the venue has a loading dock for equipment transport" }
      - { name: power_capacity_kw, type: number, source: input, description: "Available electrical capacity in kilowatts; must be > 0" }
      - { name: sterilization_capable, type: boolean, source: input, description: "Whether the venue can physically host a sterilization suite (ventilation + water)" }
      - { name: status, type: enum, source: system, default: PROSPECT, description: "PROSPECT | VETTED | RETIRED", constraints: "enum: PROSPECT, VETTED, RETIRED" }

  - name: SiteAgreement
    parent: ClinicEvent
    common_fields: true
    fields:
      - { name: clinic_event_id, type: string, source: system, description: "FK -> ClinicEvent.id; owning event" }
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; the venue being negotiated" }
      - { name: host_org_name, type: string, source: input, description: "Legal name of the host organization (school board, fairground authority)" }
      - { name: liability_cap_cents, type: integer, source: input, description: "Maximum liability the host accepts, in cents; must be >= 0" }
      - { name: insurance_certificate_ref, type: string, source: input, description: "Reference string for the certificate of insurance on file" }
      - { name: cost_share_cents, type: integer, source: computed, default: 0, description: "Computed host cost share per calculations.host_cost_share" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | NEGOTIATING | CONFIRMED | SUPERSEDED | REJECTED", constraints: "enum: DRAFT, NEGOTIATING, CONFIRMED, SUPERSEDED, REJECTED" }
      - { name: supersedes_agreement_id, type: string, source: input, description: "FK -> SiteAgreement.id; self-referential link — when this agreement is confirmed, the referenced prior CONFIRMED agreement transitions to SUPERSEDED", constraints: "nullable" }

  - name: Volunteer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Volunteer legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across volunteers" }
      - { name: discipline, type: enum, source: input, description: "DENTAL | VISION | MEDICAL | GENERAL", constraints: "enum: DENTAL, VISION, MEDICAL, GENERAL" }
      - { name: license_number, type: string, source: input, description: "Professional license number; empty string permitted only when discipline == GENERAL" }
      - { name: license_state_code, type: string, source: input, description: "Two-letter state that issued the license; empty string only when discipline == GENERAL" }
      - { name: license_expiry_date, type: string, source: input, description: "ISO-8601 date of license expiry; must be > event service_date to authorize; empty string only when discipline == GENERAL" }
      - { name: status, type: enum, source: system, default: REGISTERED, description: "REGISTERED | VERIFICATION_PENDING | VERIFIED | AUTHORIZED | SUSPENDED | REJECTED", constraints: "enum: REGISTERED, VERIFICATION_PENDING, VERIFIED, AUTHORIZED, SUSPENDED, REJECTED" }
      - { name: suspension_reason, type: string, source: system, description: "Free-text reason recorded when status transitions to SUSPENDED", constraints: "nullable" }

  - name: LicenseVerification
    parent: Volunteer
    common_fields: true
    fields:
      - { name: volunteer_id, type: string, source: system, description: "FK -> Volunteer.id; the volunteer under review" }
      - { name: clinic_event_id, type: string, source: input, description: "FK -> ClinicEvent.id; the event the volunteer seeks authorization for — state practice authorization is event-specific" }
      - { name: reviewer_notes, type: string, source: input, description: "Free-text notes from the credentialing reviewer" }
      - { name: attempt_sequence, type: integer, source: computed, default: 1, description: "Monotonic attempt counter per (volunteer_id, clinic_event_id); starts at 1 and increments on every new verification request" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | APPROVED | DENIED | EXPIRED_REVIEW", constraints: "enum: PENDING, APPROVED, DENIED, EXPIRED_REVIEW" }
      - { name: denial_code, type: enum, source: system, description: "LICENSE_EXPIRED | STATE_MISMATCH | UNVERIFIABLE | DISCIPLINE_MISMATCH — set when status == DENIED", constraints: "enum: LICENSE_EXPIRED, STATE_MISMATCH, UNVERIFIABLE, DISCIPLINE_MISMATCH; nullable" }

  - name: DisciplineAssignment
    parent: ClinicEvent
    common_fields: true
    fields:
      - { name: clinic_event_id, type: string, source: system, description: "FK -> ClinicEvent.id; owning event" }
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; the assigned volunteer" }
      - { name: station_id, type: string, source: input, description: "FK -> ServiceStation.id; station the volunteer is rostered to", constraints: "nullable" }
      - { name: shift_code, type: enum, source: input, description: "FULL_DAY | MORNING | AFTERNOON", constraints: "enum: FULL_DAY, MORNING, AFTERNOON" }
      - { name: status, type: enum, source: system, default: ROSTERED, description: "ROSTERED | CONFIRMED | CHECKED_IN | NO_SHOW | RELEASED", constraints: "enum: ROSTERED, CONFIRMED, CHECKED_IN, NO_SHOW, RELEASED" }

  - name: ServiceStation
    parent: ClinicEvent
    common_fields: true
    fields:
      - { name: clinic_event_id, type: string, source: system, description: "FK -> ClinicEvent.id; owning event" }
      - { name: station_label, type: string, source: input, description: "Human label, e.g. 'DENTAL-03'" }
      - { name: station_type, type: enum, source: input, description: "TRIAGE | DENTAL | VISION | MEDICAL | GLASSES_LAB | DENTURE_LAB", constraints: "enum: TRIAGE, DENTAL, VISION, MEDICAL, GLASSES_LAB, DENTURE_LAB" }
      - { name: chair_count, type: integer, source: input, description: "Number of parallel service positions at this station; must be >= 1" }
      - { name: minutes_per_patient, type: integer, source: input, description: "Average service time per patient at this station; must be >= 5" }
      - { name: requires_sterilization, type: boolean, source: input, description: "True for DENTAL and MEDICAL stations; instruments must cycle through sterilization between patients" }
      - { name: service_window_open_utc, type: string, source: input, description: "ISO-8601 timestamp when this station begins serving" }
      - { name: service_window_close_utc, type: string, source: input, description: "ISO-8601 timestamp when this station stops admitting new patients; must be > service_window_open_utc" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | SET_UP | STERILIZATION_CLEARED | OPERATIONAL | DEGRADED | OFFLINE | DISMANTLED", constraints: "enum: PLANNED, SET_UP, STERILIZATION_CLEARED, OPERATIONAL, DEGRADED, OFFLINE, DISMANTLED" }
      - { name: served_count, type: integer, source: computed, default: 0, description: "Count of PatientEncounter rows with status == COMPLETED at this station" }

  - name: PatientTicket
    parent: ClinicEvent
    common_fields: true
    fields:
      - { name: clinic_event_id, type: string, source: system, description: "FK -> ClinicEvent.id; owning event" }
      - { name: patient_ref, type: string, source: input, description: "Opaque patient identifier supplied at intake (no PII beyond this ref)" }
      - { name: arrival_utc, type: string, source: input, description: "ISO-8601 timestamp the patient physically arrived; used for fair sequencing" }
      - { name: requested_service, type: enum, source: input, description: "DENTAL | VISION | MEDICAL — the primary service the patient requests", constraints: "enum: DENTAL, VISION, MEDICAL" }
      - { name: priority_tier, type: enum, source: input, description: "STANDARD | VULNERABLE (elderly, pregnant, disabled) — VULNERABLE patients are sequenced ahead within fairness rules", constraints: "enum: STANDARD, VULNERABLE" }
      - { name: queue_position, type: integer, source: computed, description: "Computed fair-sequence position at issue time per calculations.queue_sequencing; immutable after issue" }
      - { name: status, type: enum, source: system, default: QUEUED, description: "QUEUED | CALLED | IN_SERVICE | SERVED | NO_SHOW | TURNED_AWAY | WITHDRAWN", constraints: "enum: QUEUED, CALLED, IN_SERVICE, SERVED, NO_SHOW, TURNED_AWAY, WITHDRAWN" }
      - { name: turn_away_reason, type: enum, source: system, description: "CAPACITY_EXHAUSTED | EVENT_ENDED — set when status == TURNED_AWAY", constraints: "enum: CAPACITY_EXHAUSTED, EVENT_ENDED; nullable" }

  - name: PatientEncounter
    parent: ClinicEvent
    common_fields: true
    fields:
      - { name: clinic_event_id, type: string, source: system, description: "FK -> ClinicEvent.id; owning event" }
      - { name: ticket_id, type: string, source: input, description: "FK -> PatientTicket.id; the ticket this encounter serves" }
      - { name: station_id, type: string, source: input, description: "FK -> ServiceStation.id; station performing the service" }
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; treating volunteer — must be AUTHORIZED with matching discipline" }
      - { name: encounter_type, type: enum, source: input, description: "TRIAGE | EXTRACTION | DENTURE_FIT | EYE_EXAM | GLASSES_DISPENSE | MEDICAL_CONSULT", constraints: "enum: TRIAGE, EXTRACTION, DENTURE_FIT, EYE_EXAM, GLASSES_DISPENSE, MEDICAL_CONSULT" }
      - { name: findings_summary, type: string, source: input, description: "Free-text clinical findings for the one-time record" }
      - { name: requires_followup, type: boolean, source: input, description: "Whether the patient needs follow-up care beyond this event" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | COMPLETED | ABANDONED", constraints: "enum: OPEN, COMPLETED, ABANDONED" }

  - name: ReferralRecord
    parent: PatientEncounter
    common_fields: false
    fields:
      - { name: encounter_id, type: string, source: system, description: "FK -> PatientEncounter.id; the encounter generating the referral" }
      - { name: clinic_event_id, type: string, source: system, description: "FK -> ClinicEvent.id; denormalized owning event" }
      - { name: referral_type, type: enum, source: input, description: "DENTAL_FOLLOWUP | VISION_FOLLOWUP | MEDICAL_FOLLOWUP | URGENT_CARE", constraints: "enum: DENTAL_FOLLOWUP, VISION_FOLLOWUP, MEDICAL_FOLLOWUP, URGENT_CARE" }
      - { name: partner_org_name, type: string, source: input, description: "Community partner organization receiving the referral" }
      - { name: urgency, type: enum, source: input, description: "ROUTINE | URGENT | EMERGENT", constraints: "enum: ROUTINE, URGENT, EMERGENT" }
      - { name: notes, type: string, source: input, description: "Free-text handoff notes" }

  - name: EquipmentManifest
    parent: ClinicEvent
    common_fields: true
    fields:
      - { name: clinic_event_id, type: string, source: system, description: "FK -> ClinicEvent.id; owning event" }
      - { name: manifest_label, type: string, source: input, description: "Shipment label, e.g. 'TRUCK-1'" }
      - { name: item_count, type: integer, source: input, description: "Number of equipment line items; must be >= 1" }
      - { name: weight_kg, type: number, source: input, description: "Gross shipment weight; must be > 0" }
      - { name: requires_loading_dock, type: boolean, source: input, description: "True if any item needs dock-level unloading" }
      - { name: contains_sterilizer, type: boolean, source: input, description: "True if the manifest includes an autoclave/sterilizer unit" }
      - { name: status, type: enum, source: system, default: PACKED, description: "PACKED | IN_TRANSIT | DELIVERED | UNPACKED | REPACKED", constraints: "enum: PACKED, IN_TRANSIT, DELIVERED, UNPACKED, REPACKED" }

  - name: SterilizationCycle
    parent: ClinicEvent
    common_fields: true
    fields:
      - { name: clinic_event_id, type: string, source: system, description: "FK -> ClinicEvent.id; owning event" }
      - { name: cycle_sequence, type: integer, source: computed, description: "Monotonic per-event cycle number, assigned at start; first cycle is 1" }
      - { name: instrument_batch_size, type: integer, source: input, description: "Number of instrument kits in this cycle; must be >= 1 and <= AUTOCLAVE_BATCH_MAX (24)" }
      - { name: started_utc, type: string, source: system, description: "Server-stamped ISO-8601 start time" }
      - { name: completed_utc, type: string, source: system, description: "Server-stamped ISO-8601 completion time", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: RUNNING, description: "RUNNING | COMPLETED | FAILED", constraints: "enum: RUNNING, COMPLETED, FAILED" }

  - name: UnmetDemandReport
    parent: ClinicEvent
    common_fields: false
    fields:
      - { name: clinic_event_id, type: string, source: system, description: "FK -> ClinicEvent.id; owning event" }
      - { name: generated_at_utc, type: string, source: system, description: "Server-stamped generation time" }
      - { name: turned_away_count, type: integer, source: computed, description: "Snapshot of tickets TURNED_AWAY at generation time" }
      - { name: estimated_unserved_beyond_queue, type: integer, source: computed, description: "Extrapolated demand that never reached ticketing per calculations.unmet_demand_extrapolation" }
      - { name: projected_shortfall_patients, type: integer, source: computed, description: "total demand estimate minus projected_servable_patients" }
      - { name: report_variant, type: enum, source: computed, description: "OBSERVED_ONLY | WITH_EXTRAPOLATION — which unmet-demand variant this report captures", constraints: "enum: OBSERVED_ONLY, WITH_EXTRAPOLATION" }

  - name: CommunityHandoff
    parent: ClinicEvent
    common_fields: true
    fields:
      - { name: clinic_event_id, type: string, source: system, description: "FK -> ClinicEvent.id; owning event" }
      - { name: partner_org_name, type: string, source: input, description: "Community partner accepting responsibility for follow-ups" }
      - { name: referral_packet_count, type: integer, source: computed, default: 0, description: "Count of ReferralRecord rows bundled into this handoff" }
      - { name: teardown_checklist_complete, type: boolean, source: input, description: "Whether the venue teardown checklist is fully signed off" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PACKET_ASSEMBLED | ACCEPTED | DISPUTED", constraints: "enum: DRAFT, PACKET_ASSEMBLED, ACCEPTED, DISPUTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ClinicEvent
    initial_state: PLANNING
    terminal_states: [CLOSED, CANCELLED]
    note: "Posture-driven compound machine: posture is recomputed from child aggregates on every child mutation; explicit transitions exist for the operator-driven moves, and system recompute moves posture automatically when gate conditions become true."
    transitions:
      - from: PLANNING
        to: SITE_LOCKED
        trigger: "system recompute (when a SiteAgreement reaches CONFIRMED)"
        actor: system
        preconditions:
          - "Exactly one SiteAgreement for this event is CONFIRMED"
        side_effects:
          - "ClinicEvent.confirmed_site_agreement_id set to that agreement"
          - "ClinicEvent.version incremented"
      - from: SITE_LOCKED
        to: STAFFING
        trigger: "system recompute (when >= 1 ServiceStation exists in PLANNED or later AND >= 1 Volunteer is VERIFICATION_PENDING or beyond for this event)"
        actor: system
        preconditions:
          - "At least one ServiceStation row exists for the event"
          - "At least one LicenseVerification row exists for the event"
        side_effects:
          - "ClinicEvent.version incremented"
      - from: STAFFING
        to: READY
        trigger: "system recompute (when every ServiceStation is SET_UP or beyond AND every PENDING LicenseVerification is resolved AND authorized coverage minimums met per calculations.discipline_coverage_score >= COVERAGE_MIN)"
        actor: system
        preconditions:
          - "No ServiceStation in PLANNED status"
          - "No LicenseVerification in PENDING status for this event"
          - "discipline_coverage_score >= COVERAGE_MIN (60)"
        side_effects:
          - "ClinicEvent.version incremented"
      - from: READY
        to: IN_SERVICE
        trigger: "POST /clinic-events/{id}/open-doors"
        actor: EventDirector
        preconditions:
          - "posture == READY (ERR_EVENT_POSTURE_FORBIDS otherwise)"
          - "Every EquipmentManifest for the event is UNPACKED (ERR_MANIFEST_NOT_UNPACKED)"
          - "Every DENTAL/MEDICAL ServiceStation with requires_sterilization == true has at least one COMPLETED SterilizationCycle (ERR_STERILIZATION_NOT_CLEARED)"
        side_effects:
          - "ClinicEvent.version incremented"
      - from: IN_SERVICE
        to: TEARDOWN
        trigger: "POST /clinic-events/{id}/end-service"
        actor: EventDirector
        preconditions:
          - "posture == IN_SERVICE"
          - "No PatientTicket in CALLED or IN_SERVICE status (ERR_ACTIVE_ENCOUNTERS_REMAIN)"
        side_effects:
          - "All QUEUED PatientTickets transition to TURNED_AWAY with turn_away_reason == EVENT_ENDED"
          - "ClinicEvent.unmet_demand_count recomputed"
          - "ClinicEvent.version incremented"
      - from: TEARDOWN
        to: CLOSED
        trigger: "POST /clinic-events/{id}/close"
        actor: EventDirector
        preconditions:
          - "posture == TEARDOWN"
          - "Every ServiceStation is DISMANTLED (ERR_STATIONS_NOT_DISMANTLED)"
          - "Every EquipmentManifest is REPACKED (ERR_MANIFEST_NOT_REPACKED)"
          - "A CommunityHandoff exists with status == ACCEPTED (ERR_HANDOFF_NOT_ACCEPTED)"
        side_effects:
          - "ClinicEvent.version incremented"
      - from: PLANNING
        to: CANCELLED
        trigger: "POST /clinic-events/{id}/cancel"
        actor: EventDirector
        preconditions:
          - "posture IN {PLANNING, SITE_LOCKED, STAFFING, READY}"
        side_effects:
          - "All non-terminal SiteAgreements transition to REJECTED"
          - "All ROSTERED/CONFIRMED DisciplineAssignments transition to RELEASED"
          - "ClinicEvent.version incremented"
      - from: SITE_LOCKED
        to: CANCELLED
        trigger: "POST /clinic-events/{id}/cancel"
        actor: EventDirector
        preconditions: ["posture IN {PLANNING, SITE_LOCKED, STAFFING, READY}"]
        side_effects:
          - "All non-terminal SiteAgreements transition to REJECTED"
          - "All ROSTERED/CONFIRMED DisciplineAssignments transition to RELEASED"
          - "ClinicEvent.version incremented"
      - from: STAFFING
        to: CANCELLED
        trigger: "POST /clinic-events/{id}/cancel"
        actor: EventDirector
        preconditions: ["posture IN {PLANNING, SITE_LOCKED, STAFFING, READY}"]
        side_effects:
          - "All non-terminal SiteAgreements transition to REJECTED"
          - "All ROSTERED/CONFIRMED DisciplineAssignments transition to RELEASED"
          - "ClinicEvent.version incremented"
      - from: READY
        to: CANCELLED
        trigger: "POST /clinic-events/{id}/cancel"
        actor: EventDirector
        preconditions: ["posture IN {PLANNING, SITE_LOCKED, STAFFING, READY}"]
        side_effects:
          - "All non-terminal SiteAgreements transition to REJECTED"
          - "All ROSTERED/CONFIRMED DisciplineAssignments transition to RELEASED"
          - "ClinicEvent.version incremented"

  - entity: SiteAgreement
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, REJECTED]
    note: "Branching machine with create-with-supersede: a new agreement may name a prior CONFIRMED agreement in supersedes_agreement_id; confirming the new one supersedes the old one."
    transitions:
      - from: DRAFT
        to: NEGOTIATING
        trigger: "POST /clinic-events/{id}/site-agreements/{aid}/submit"
        actor: LogisticsCoordinator
        preconditions:
          - "Agreement in DRAFT (ERR_INVALID_STATE otherwise)"
          - "Parent ClinicEvent posture IN {PLANNING, SITE_LOCKED} (ERR_EVENT_POSTURE_FORBIDS)"
        side_effects: []
      - from: NEGOTIATING
        to: CONFIRMED
        trigger: "POST /clinic-events/{id}/site-agreements/{aid}/confirm"
        actor: EventDirector
        preconditions:
          - "Agreement in NEGOTIATING"
          - "Referenced Site.status == VETTED (ERR_SITE_NOT_VETTED)"
          - "Site.state_code == ClinicEvent.host_state_code (ERR_SITE_STATE_MISMATCH)"
          - "insurance_certificate_ref non-empty (ERR_INSURANCE_MISSING)"
          - "Parent ClinicEvent posture IN {PLANNING, SITE_LOCKED}"
        side_effects:
          - "If supersedes_agreement_id names a CONFIRMED agreement, that agreement transitions CONFIRMED -> SUPERSEDED and ClinicEvent.confirmed_site_agreement_id is reassigned"
          - "ClinicEvent.confirmed_site_agreement_id set to this agreement; posture recompute may move PLANNING -> SITE_LOCKED"
          - "ClinicEvent.version incremented"
      - from: NEGOTIATING
        to: REJECTED
        trigger: "POST /clinic-events/{id}/site-agreements/{aid}/reject"
        actor: EventDirector
        preconditions: ["Agreement in NEGOTIATING"]
        side_effects: []
      - from: CONFIRMED
        to: SUPERSEDED
        trigger: "system (when a successor agreement with supersedes_agreement_id == this.id is confirmed)"
        actor: system
        preconditions: ["A successor SiteAgreement referencing this one reaches CONFIRMED"]
        side_effects:
          - "ClinicEvent.confirmed_site_agreement_id reassigned to successor"

  - entity: Site
    initial_state: PROSPECT
    terminal_states: [RETIRED]
    transitions:
      - from: PROSPECT
        to: VETTED
        trigger: "POST /sites/{id}/vet"
        actor: LogisticsCoordinator
        preconditions:
          - "Site in PROSPECT"
          - "square_footage >= 2000 (ERR_SITE_TOO_SMALL)"
          - "power_capacity_kw > 0 (ERR_VALIDATION)"
        side_effects: []
      - from: VETTED
        to: RETIRED
        trigger: "POST /sites/{id}/retire"
        actor: LogisticsCoordinator
        preconditions:
          - "Site in VETTED"
          - "No SiteAgreement in DRAFT/NEGOTIATING/CONFIRMED references this site (ERR_SITE_IN_USE)"
        side_effects: []

  - entity: Volunteer
    initial_state: REGISTERED
    terminal_states: [REJECTED]
    note: "Branching with a revision loop: SUSPENDED -> VERIFIED re-entry allowed via reinstate, producing a cycle VERIFIED -> SUSPENDED -> VERIFIED."
    transitions:
      - from: REGISTERED
        to: VERIFICATION_PENDING
        trigger: "POST /volunteers/{id}/request-verification (creates LicenseVerification PENDING)"
        actor: VolunteerCoordinator
        preconditions:
          - "Volunteer in REGISTERED or VERIFIED (re-verification for a new event)"
          - "discipline != GENERAL implies license_number, license_state_code, license_expiry_date all non-empty (ERR_LICENSE_FIELDS_REQUIRED)"
        side_effects:
          - "LicenseVerification row created with status PENDING and next attempt_sequence for (volunteer, event)"
      - from: VERIFICATION_PENDING
        to: VERIFIED
        trigger: "system (when LicenseVerification is approved)"
        actor: system
        preconditions: ["Linked LicenseVerification transitions PENDING -> APPROVED"]
        side_effects:
          - "ClinicEvent.verified_volunteer_count recomputed; posture recompute may fire"
      - from: VERIFICATION_PENDING
        to: REJECTED
        trigger: "system (when LicenseVerification is denied with terminal denial_code)"
        actor: system
        preconditions: ["Linked LicenseVerification transitions PENDING -> DENIED"]
        side_effects: []
      - from: VERIFIED
        to: AUTHORIZED
        trigger: "POST /volunteers/{id}/authorize"
        actor: VolunteerCoordinator
        preconditions:
          - "Volunteer in VERIFIED"
          - "An APPROVED LicenseVerification exists whose clinic_event.host_state_code authorization is current: license_expiry_date > event.service_date (ERR_LICENSE_EXPIRED)"
          - "license_state_code == event.host_state_code OR discipline == GENERAL (ERR_STATE_PRACTICE_FORBIDDEN)"
          - "license_expiry_date > event.service_date (ERR_LICENSE_EXPIRED)"
        side_effects:
          - "ClinicEvent.verified_volunteer_count recomputed; discipline_coverage_score recomputed; posture recompute may fire"
      - from: AUTHORIZED
        to: SUSPENDED
        trigger: "POST /volunteers/{id}/suspend"
        actor: VolunteerCoordinator
        preconditions:
          - "Volunteer in AUTHORIZED"
          - "suspension_reason supplied in request body (ERR_VALIDATION)"
        side_effects:
          - "All ROSTERED/CONFIRMED DisciplineAssignments for this volunteer transition to RELEASED"
          - "ClinicEvent.verified_volunteer_count recomputed; discipline_coverage_score recomputed; posture may regress READY -> STAFFING if coverage drops below COVERAGE_MIN"
      - from: SUSPENDED
        to: VERIFIED
        trigger: "POST /volunteers/{id}/reinstate"
        actor: VolunteerCoordinator
        preconditions:
          - "Volunteer in SUSPENDED"
          - "The LicenseVerification that authorized them remains APPROVED"
        side_effects:
          - "ClinicEvent.verified_volunteer_count recomputed; discipline_coverage_score recomputed; posture recompute may fire"
      - from: VERIFIED
        to: VERIFICATION_PENDING
        trigger: "POST /volunteers/{id}/request-verification"
        actor: VolunteerCoordinator
        preconditions: ["Volunteer in REGISTERED or VERIFIED"]
        side_effects:
          - "New LicenseVerification row created with incremented attempt_sequence"

  - entity: LicenseVerification
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED, EXPIRED_REVIEW]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /volunteers/{vid}/license-verifications/{id}/approve"
        actor: CredentialingOfficer
        preconditions:
          - "Verification in PENDING"
          - "Volunteer.discipline matches the assignment discipline sought (ERR_DISCIPLINE_MISMATCH)"
          - "Volunteer.license_expiry_date > linked event service_date (else auto-deny with LICENSE_EXPIRED)"
        side_effects:
          - "Volunteer transitions VERIFICATION_PENDING -> VERIFIED"
      - from: PENDING
        to: DENIED
        trigger: "POST /volunteers/{vid}/license-verifications/{id}/deny"
        actor: CredentialingOfficer
        preconditions:
          - "Verification in PENDING"
          - "denial_code supplied and in enum (ERR_VALIDATION)"
        side_effects:
          - "Volunteer transitions VERIFICATION_PENDING -> REJECTED when denial_code IN {UNVERIFIABLE, DISCIPLINE_MISMATCH}; for {LICENSE_EXPIRED, STATE_MISMATCH} the volunteer remains VERIFICATION_PENDING-eligible and may re-request"
      - from: PENDING
        to: EXPIRED_REVIEW
        trigger: "system (when linked event service_date passes while verification still PENDING)"
        actor: system
        preconditions: ["Logical clock > event.service_date and verification still PENDING"]
        side_effects: []

  - entity: PatientTicket
    initial_state: QUEUED
    terminal_states: [SERVED, NO_SHOW, TURNED_AWAY, WITHDRAWN]
    note: "Branching with revert: CALLED -> QUEUED requeue allowed once (patient stepped away), producing QUEUED -> CALLED -> QUEUED cycle bounded by requeue_count."
    transitions:
      - from: "(none — issue creates the ticket in QUEUED)"
        to: QUEUED
        trigger: "POST /clinic-events/{id}/tickets"
        actor: QueueMarshal
        preconditions:
          - "Parent event posture == IN_SERVICE (ERR_EVENT_POSTURE_FORBIDS)"
          - "tickets_issued_count < total_patient_capacity (ERR_CAPACITY_EXHAUSTED)"
        side_effects:
          - "queue_position assigned per calculations.queue_sequencing"
          - "ClinicEvent.tickets_issued_count incremented"
      - from: QUEUED
        to: CALLED
        trigger: "POST /clinic-events/{id}/tickets/{tid}/call"
        actor: QueueMarshal
        preconditions:
          - "Ticket in QUEUED"
          - "Parent event posture == IN_SERVICE (ERR_EVENT_POSTURE_FORBIDS)"
          - "Ticket is the head of the fair sequence for its requested_service per calculations.queue_sequencing (ERR_NOT_QUEUE_HEAD)"
        side_effects: []
      - from: CALLED
        to: IN_SERVICE
        trigger: "POST /clinic-events/{id}/tickets/{tid}/begin-service"
        actor: StationLead
        preconditions:
          - "Ticket in CALLED"
          - "A compatible OPERATIONAL ServiceStation exists for requested_service with an open service window (ERR_NO_STATION_AVAILABLE)"
        side_effects:
          - "PatientEncounter row created with status OPEN"
      - from: CALLED
        to: QUEUED
        trigger: "POST /clinic-events/{id}/tickets/{tid}/requeue"
        actor: QueueMarshal
        preconditions:
          - "Ticket in CALLED"
          - "requeue_count < 1 (ERR_REQUEUE_EXHAUSTED) — at most one requeue per ticket"
        side_effects:
          - "queue_position recomputed as tail-of-queue (fair-sequence re-entry per calculations.queue_sequencing)"
      - from: IN_SERVICE
        to: SERVED
        trigger: "system (when the open PatientEncounter for this ticket is COMPLETED)"
        actor: system
        preconditions: ["Linked PatientEncounter transitions OPEN -> COMPLETED"]
        side_effects:
          - "ClinicEvent.tickets_served_count incremented; tickets_issued_count decremented"
      - from: CALLED
        to: NO_SHOW
        trigger: "POST /clinic-events/{id}/tickets/{tid}/mark-no-show"
        actor: QueueMarshal
        preconditions: ["Ticket in CALLED"]
        side_effects:
          - "ClinicEvent.tickets_issued_count decremented"
      - from: QUEUED
        to: TURNED_AWAY
        trigger: "system (capacity exhaustion at issue time, or event end-service cascade)"
        actor: system
        preconditions: ["tickets_issued_count == total_patient_capacity at issue, or event transitions IN_SERVICE -> TEARDOWN"]
        side_effects:
          - "ClinicEvent.unmet_demand_count incremented"
      - from: QUEUED
        to: WITHDRAWN
        trigger: "POST /clinic-events/{id}/tickets/{tid}/withdraw"
        actor: QueueMarshal
        preconditions: ["Ticket in QUEUED"]
        side_effects:
          - "ClinicEvent.tickets_issued_count decremented"

  - entity: ServiceStation
    initial_state: PLANNED
    terminal_states: [DISMANTLED]
    note: "Compound + guarded: OPERATIONAL requires sterilization clearance for sterilization-requiring station types; DEGRADED <-> OPERATIONAL loop is a bounded cycle driven by sterilization capacity."
    transitions:
      - from: PLANNED
        to: SET_UP
        trigger: "POST /clinic-events/{id}/stations/{sid}/mark-set-up"
        actor: LogisticsCoordinator
        preconditions:
          - "Station in PLANNED"
          - "Parent event posture IN {SITE_LOCKED, STAFFING} (ERR_EVENT_POSTURE_FORBIDS)"
          - "Confirmed site's power_capacity_kw >= sum of station power draw already set up + this station's draw (ERR_POWER_CAPACITY_EXCEEDED)"
        side_effects:
          - "Parent event posture recompute may fire"
      - from: SET_UP
        to: STERILIZATION_CLEARED
        trigger: "system (when a SterilizationCycle COMPLETES covering this station type, for requires_sterilization stations)"
        actor: system
        preconditions: ["requires_sterilization == true AND >= 1 COMPLETED SterilizationCycle for the event"]
        side_effects: []
      - from: SET_UP
        to: OPERATIONAL
        trigger: "POST /clinic-events/{id}/stations/{sid}/mark-operational"
        actor: StationLead
        preconditions:
          - "Station in SET_UP with requires_sterilization == false, OR station in STERILIZATION_CLEARED"
          - "Parent event posture IN {SITE_LOCKED, STAFFING, READY, IN_SERVICE}"
        side_effects:
          - "ClinicEvent dental/vision/medical counts recomputed; projected_servable_patients recomputed"
      - from: STERILIZATION_CLEARED
        to: OPERATIONAL
        trigger: "POST /clinic-events/{id}/stations/{sid}/mark-operational"
        actor: StationLead
        preconditions: ["Station in STERILIZATION_CLEARED"]
        side_effects:
          - "ClinicEvent station counts recomputed; projected_servable_patients recomputed"
      - from: OPERATIONAL
        to: DEGRADED
        trigger: "system (when sterilization backlog exceeds STERILIZATION_BACKLOG_MAX unprocessed batches for a requires_sterilization station)"
        actor: system
        preconditions: ["Station OPERATIONAL AND requires_sterilization AND pending instrument batches > STERILIZATION_BACKLOG_MAX (6)"]
        side_effects:
          - "ClinicEvent station counts recomputed (DEGRADED stations count at half capacity, rounded down, in projected_servable_patients)"
      - from: DEGRADED
        to: OPERATIONAL
        trigger: "system (when a SterilizationCycle COMPLETES and backlog <= STERILIZATION_BACKLOG_MAX)"
        actor: system
        preconditions: ["Backlog cleared"]
        side_effects:
          - "ClinicEvent station counts recomputed; projected_servable_patients recomputed"
      - from: OPERATIONAL
        to: OFFLINE
        trigger: "POST /clinic-events/{id}/stations/{sid}/take-offline"
        actor: StationLead
        preconditions:
          - "Station in OPERATIONAL or DEGRADED"
          - "No OPEN PatientEncounter at this station (ERR_ACTIVE_ENCOUNTERS_REMAIN)"
        side_effects:
          - "ClinicEvent station counts recomputed; projected_servable_patients recomputed"
      - from: DEGRADED
        to: OFFLINE
        trigger: "POST /clinic-events/{id}/stations/{sid}/take-offline"
        actor: StationLead
        preconditions: ["No OPEN PatientEncounter at this station"]
        side_effects:
          - "ClinicEvent station counts recomputed; projected_servable_patients recomputed"
      - from: OFFLINE
        to: OPERATIONAL
        trigger: "POST /clinic-events/{id}/stations/{sid}/mark-operational"
        actor: StationLead
        preconditions:
          - "Station in OFFLINE"
          - "If requires_sterilization: at least one COMPLETED SterilizationCycle since the station went OFFLINE (ERR_STERILIZATION_NOT_CLEARED)"
        side_effects:
          - "ClinicEvent station counts recomputed; projected_servable_patients recomputed"
      - from: OPERATIONAL
        to: DISMANTLED
        trigger: "POST /clinic-events/{id}/stations/{sid}/dismantle"
        actor: LogisticsCoordinator
        preconditions:
          - "Station in OPERATIONAL, DEGRADED, or OFFLINE"
          - "Parent event posture == TEARDOWN (ERR_EVENT_POSTURE_FORBIDS)"
        side_effects:
          - "ClinicEvent station counts recomputed"
      - from: DEGRADED
        to: DISMANTLED
        trigger: "POST /clinic-events/{id}/stations/{sid}/dismantle"
        actor: LogisticsCoordinator
        preconditions: ["Parent event posture == TEARDOWN"]
        side_effects:
          - "ClinicEvent station counts recomputed"
      - from: OFFLINE
        to: DISMANTLED
        trigger: "POST /clinic-events/{id}/stations/{sid}/dismantle"
        actor: LogisticsCoordinator
        preconditions: ["Parent event posture == TEARDOWN"]
        side_effects:
          - "ClinicEvent station counts recomputed"

  - entity: PatientEncounter
    initial_state: OPEN
    terminal_states: [COMPLETED, ABANDONED]
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "POST /clinic-events/{id}/encounters/{eid}/complete"
        actor: StationLead
        preconditions:
          - "Encounter in OPEN"
          - "Treating volunteer status == AUTHORIZED at completion time (ERR_VOLUNTEER_NOT_AUTHORIZED)"
          - "Station status IN {OPERATIONAL, DEGRADED} (ERR_STATION_NOT_SERVING)"
          - "If requires_followup == true, at least one ReferralRecord must be created in the same request bundle (ERR_REFERRAL_REQUIRED)"
        side_effects:
          - "Ticket transitions IN_SERVICE -> SERVED"
          - "ServiceStation.served_count incremented"
          - "ClinicEvent.tickets_served_count incremented; tickets_issued_count decremented"
          - "If requires_followup == true: linked ReferralRecord rows become part of the event referral packet; CommunityHandoff.referral_packet_count recomputed"
      - from: OPEN
        to: ABANDONED
        trigger: "POST /clinic-events/{id}/encounters/{eid}/abandon"
        actor: StationLead
        preconditions: ["Encounter in OPEN"]
        side_effects:
          - "Ticket transitions IN_SERVICE -> QUEUED with queue_position recomputed as tail-of-queue"

  - entity: EquipmentManifest
    initial_state: PACKED
    terminal_states: [REPACKED]
    transitions:
      - from: PACKED
        to: IN_TRANSIT
        trigger: "POST /clinic-events/{id}/manifests/{mid}/ship"
        actor: LogisticsCoordinator
        preconditions:
          - "Manifest in PACKED"
          - "Parent event has a CONFIRMED SiteAgreement (posture >= SITE_LOCKED) (ERR_EVENT_POSTURE_FORBIDS)"
          - "If requires_loading_dock == true, confirmed site has_loading_dock == true (ERR_LOADING_DOCK_REQUIRED)"
        side_effects: []
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /clinic-events/{id}/manifests/{mid}/deliver"
        actor: LogisticsCoordinator
        preconditions: ["Manifest in IN_TRANSIT"]
        side_effects: []
      - from: DELIVERED
        to: UNPACKED
        trigger: "POST /clinic-events/{id}/manifests/{mid}/unpack"
        actor: LogisticsCoordinator
        preconditions: ["Manifest in DELIVERED"]
        side_effects:
          - "If contains_sterilizer == true, sterilization cycles may now be started for the event"
      - from: UNPACKED
        to: REPACKED
        trigger: "POST /clinic-events/{id}/manifests/{mid}/repack"
        actor: LogisticsCoordinator
        preconditions:
          - "Manifest in UNPACKED"
          - "Parent event posture == TEARDOWN (ERR_EVENT_POSTURE_FORBIDS)"
        side_effects: []

  - entity: SterilizationCycle
    initial_state: RUNNING
    terminal_states: [COMPLETED, FAILED]
    transitions:
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /clinic-events/{id}/sterilization-cycles/{cid}/complete"
        actor: SterilizationTech
        preconditions:
          - "Cycle in RUNNING"
          - "instrument_batch_size <= AUTOCLAVE_BATCH_MAX (24) (validated at creation; ERR_BATCH_TOO_LARGE)"
        side_effects:
          - "ClinicEvent.sterilization_cycles_completed incremented"
          - "requires_sterilization stations in SET_UP transition to STERILIZATION_CLEARED"
          - "DEGRADED stations whose backlog is now cleared transition back to OPERATIONAL"
      - from: RUNNING
        to: FAILED
        trigger: "POST /clinic-events/{id}/sterilization-cycles/{cid}/fail"
        actor: SterilizationTech
        preconditions: ["Cycle in RUNNING"]
        side_effects:
          - "instrument batch returns to pending backlog (drives DEGRADED thresholds)"

  - entity: CommunityHandoff
    initial_state: DRAFT
    terminal_states: [ACCEPTED, DISPUTED]
    transitions:
      - from: DRAFT
        to: PACKET_ASSEMBLED
        trigger: "POST /clinic-events/{id}/handoffs/{hid}/assemble-packet"
        actor: EventDirector
        preconditions:
          - "Handoff in DRAFT"
          - "Parent event posture IN {IN_SERVICE, TEARDOWN}"
        side_effects:
          - "referral_packet_count recomputed as count of ReferralRecord for the event"
      - from: PACKET_ASSEMBLED
        to: ACCEPTED
        trigger: "POST /clinic-events/{id}/handoffs/{hid}/accept"
        actor: CommunityPartnerRep
        preconditions:
          - "Handoff in PACKET_ASSEMBLED"
          - "teardown_checklist_complete == true (ERR_TEARDOWN_INCOMPLETE)"
        side_effects: []
      - from: PACKET_ASSEMBLED
        to: DISPUTED
        trigger: "POST /clinic-events/{id}/handoffs/{hid}/dispute"
        actor: CommunityPartnerRep
        preconditions: ["Handoff in PACKET_ASSEMBLED"]
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: site-agreement-create-stale-event
    parent_entity: ClinicEvent
    write_endpoint: "POST /clinic-events/{id}/site-agreements"
    occ_field: "expected_event_version"
    description: |
      Creating a SiteAgreement against a ClinicEvent whose version has advanced
      since the client last observed it is rejected. A second agreement creation
      with a stale expected_event_version would silently miss the fact that a
      prior agreement was confirmed in between (which legitimately locks the site
      selection), so the stale writer is rejected with 412.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: volunteer-authorize-stale-event
    parent_entity: ClinicEvent
    write_endpoint: "POST /volunteers/{id}/authorize"
    occ_field: "expected_event_version"
    description: |
      Authorizing a volunteer against a ClinicEvent whose version has advanced
      since the client last observed it is rejected. The discipline coverage
      gate (READY posture) is computed from event aggregates; an authorization
      issued against a stale event view could be based on a coverage score that
      a superseding site agreement or another suspension has already changed.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: projected_servable_patients
    trigger: "On every ServiceStation status mutation and on event open-doors"
    algorithm: forward_looking
    description: "Projects how many patients the event can serve per discipline from station throughput."
    formula: |
      For each discipline D in {DENTAL, VISION, MEDICAL}:
        stations_D = ServiceStation where clinic_event_id == event
                     AND station_type == D AND status IN {OPERATIONAL, DEGRADED}
        effective_chairs(s) = s.chair_count if s.status == OPERATIONAL
                              else floor(s.chair_count / 2)   # DEGRADED half capacity
        window_minutes(s) = (s.service_window_close_utc - s.service_window_open_utc) in minutes
        per_station(s) = floor( effective_chairs(s) * window_minutes(s) / s.minutes_per_patient )
        capacity_D = sum over stations_D of per_station(s)
      projected_servable_patients = capacity_DENTAL + capacity_VISION + capacity_MEDICAL
      Rounding: floor applied per-station BEFORE summing (round-per-line-then-sum order is pinned;
      summing raw values then flooring is FORBIDDEN and yields a different integer).
    input_set: "ServiceStation rows for the event with status IN {OPERATIONAL, DEGRADED}; PLANNED/SET_UP/STERILIZATION_CLEARED/OFFLINE/DISMANTLED excluded"
    constants:
      DEGRADED_CAPACITY_DIVISOR: 2
    precision: "integer result; floor per station before summation"
    variants:
      - name: optimistic_variant
        when: "Used in posture recompute gating READY -> counts DEGRADED at full chair_count"
        difference: "DEGRADED stations counted at full chair_count instead of floor(chair_count/2); produces a strictly larger projection whenever any DEGRADED station exists with odd chair_count"
      - name: pessimistic_variant
        when: "Used in UnmetDemandReport.projected_shortfall_patients"
        difference: "Base formula as written (DEGRADED at half capacity, floor per station)"

  - name: queue_sequencing
    trigger: "On ticket issue, requeue, and queue-head selection"
    algorithm: chronological
    description: "Fair sequencing across priority tiers and arrival times."
    formula: |
      Candidate set for a call: PatientTicket where clinic_event_id == event
        AND requested_service == D AND status == QUEUED.
      Ordering key: (priority_rank ASC, arrival_utc ASC, created_at ASC)
        where priority_rank(VULNERABLE) = 0, priority_rank(STANDARD) = 1.
      queue_position at issue = 1 + max(existing queue_position across ALL statuses
        that ever occupied the queue for this event, including WITHDRAWN/TURNED_AWAY
        so positions are never reused).
      Requeue: new queue_position = current max queue_position + 1 (tail-of-queue).
      Queue head for discipline D = min by ordering key over the candidate set.
      Tie-break after arrival_utc: created_at ASC. id is NEVER used.
    input_set: "PatientTicket rows for the event; queue-head selection filters to status == QUEUED and requested_service == D"
    constants:
      PRIORITY_RANK_VULNERABLE: 0
      PRIORITY_RANK_STANDARD: 1
    precision: "integer positions; monotonic, never reused"
    variants: []

  - name: host_cost_share
    trigger: "On SiteAgreement confirmation"
    algorithm: waterfall_allocation
    description: "Computes host cost share from liability cap and venue type tiers."
    formula: |
      base_cents = SITE_BASE_COST_CENTS(site.site_type):
        ARENA 800000, FAIRGROUND 500000, SCHOOL 300000.
      tier_waterfall over square_footage (ordered buckets, each fills before next):
        bucket 1: sqft [0, 10000)      -> 0% surcharge
        bucket 2: sqft [10000, 30000)  -> 15% of base applied to overflow portion factor
        bucket 3: sqft [30000, inf)    -> 25% of base applied to overflow portion factor
      surcharge_cents = base_cents * ( 0.15 * clamp(sqft-10000,0,20000)/20000
                                     + 0.25 * max(sqft-30000,0)/max(sqft-30000,0) if sqft>30000 else 0 )
        -- expressed operationally: tier2_factor = min(max(sqft-10000,0),20000)/20000
           tier3_factor = 1 if sqft >= 30000 else 0
        surcharge_cents = round_half_up(base_cents * (0.15*tier2_factor + 0.25*tier3_factor))
      raw_share = base_cents + surcharge_cents
      cost_share_cents = min(raw_share, liability_cap_cents)   # cap truncates last
      Rounding: round_half_up to whole cents, applied ONCE after surcharge sum (sum-then-round
      order pinned; per-bucket rounding is FORBIDDEN).
    input_set: "The single SiteAgreement being confirmed and its referenced Site"
    constants:
      ARENA_BASE_CENTS: 800000
      FAIRGROUND_BASE_CENTS: 500000
      SCHOOL_BASE_CENTS: 300000
    precision: "whole cents, round_half_up, single rounding after summation"
    variants:
      - name: provisional_estimate
        when: "Computed at DRAFT creation for display"
        difference: "Ignores liability_cap_cents (no cap truncation); always >= final confirmed value"
      - name: final_at_confirm
        when: "Computed on confirm transition"
        difference: "Applies min(raw_share, liability_cap_cents); the value persisted to cost_share_cents"

  - name: discipline_coverage_score
    trigger: "On every Volunteer status mutation and DisciplineAssignment mutation for the event"
    algorithm: weighted_scoring
    description: "Weighted coverage of the three clinical disciplines; gates the READY posture."
    formula: |
      For each discipline D in {DENTAL, VISION, MEDICAL}:
        authorized_D = count of Volunteer where status == AUTHORIZED AND discipline == D
                       AND EXISTS DisciplineAssignment (clinic_event_id == event,
                         volunteer_id == volunteer, status IN {ROSTERED, CONFIRMED, CHECKED_IN})
        demand_weight_D = DENTAL 0.5, VISION 0.3, MEDICAL 0.2
        station_D = count of ServiceStation (clinic_event_id == event, station_type == D,
                     status IN {SET_UP, STERILIZATION_CLEARED, OPERATIONAL, DEGRADED})
        coverage_D = min( authorized_D / max(station_D, 1), 1.0 )   # per-discipline cap at 1.0
      score = round_half_up( 100 * sum( demand_weight_D * coverage_D ), 2 )
      Weight normalization: weights are NOT renormalized when a discipline has zero stations;
      a missing discipline contributes 0 (weights sum to 1.0 by construction).
    input_set: "AUTHORIZED volunteers with non-released assignments for the event; stations not in PLANNED/OFFLINE/DISMANTLED"
    constants:
      COVERAGE_MIN: 60
      WEIGHT_DENTAL: 0.5
      WEIGHT_VISION: 0.3
      WEIGHT_MEDICAL: 0.2
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: unmet_demand_extrapolation
    trigger: "On UnmetDemandReport generation"
    algorithm: threshold
    description: "Two variants of unmet demand documentation — observed-only vs extrapolated."
    formula: |
      observed = count of PatientTicket where status == TURNED_AWAY
      queue_at_close = count of PatientTicket where status == QUEUED at end-service cascade time
      extrapolation_factor = 1 + (queue_at_close / max(tickets_served_count, 1))
      estimated_unserved_beyond_queue = round_half_up( observed * extrapolation_factor ) - observed
      projected_shortfall_patients = observed + estimated_unserved_beyond_queue
        + max(0, total_patient_capacity - projected_servable_patients_pessimistic)
    input_set: "Ticket status snapshot at report generation; event counters"
    constants: {}
    precision: "integer persons, round_half_up"
    variants:
      - name: OBSERVED_ONLY
        when: "report_variant == OBSERVED_ONLY"
        difference: "estimated_unserved_beyond_queue = 0; projected_shortfall = observed + capacity gap only"
      - name: WITH_EXTRAPOLATION
        when: "report_variant == WITH_EXTRAPOLATION"
        difference: "Full formula; strictly >= OBSERVED_ONLY whenever queue_at_close > 0"

  - name: sterilization_backlog
    trigger: "On SterilizationCycle start/complete/fail and on station degrade checks"
    algorithm: aggregation
    description: "Tracks pending instrument batches against the degrade threshold."
    formula: |
      pending_batches(event) = sum of instrument_batch_size over SterilizationCycle
        where clinic_event_id == event AND status == RUNNING
        + batches returned by FAILED cycles not yet resubmitted
      A requires_sterilization OPERATIONAL station degrades when
        pending_batches(event) > STERILIZATION_BACKLOG_MAX.
      Boundary: pending == STERILIZATION_BACKLOG_MAX does NOT degrade (strictly-greater);
      pending == STERILIZATION_BACKLOG_MAX + 1 DOES degrade.
    input_set: "SterilizationCycle rows for the event with status == RUNNING or FAILED-unresubmitted"
    constants:
      AUTOCLAVE_BATCH_MAX: 24
      STERILIZATION_BACKLOG_MAX: 6
    precision: "integer batches"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles; X-User-ID present for entity_backed roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted for the target endpoint per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-referenced resources exist, validated left-to-right (event before site-agreement before station, etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "Parent ClinicEvent posture permits the child operation (e.g. station setup requires SITE_LOCKED/STAFFING; ticket call requires IN_SERVICE; dismantle requires TEARDOWN)"
    error_id: ERR_EVENT_POSTURE_FORBIDS
    http_status: 409
    applies_to: "all child-mutation endpoints under /clinic-events/{id}"
  - priority: 5
    category: state
    check: "Target resource is in a valid from-state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: business_safety
    check: "Clinical safety: volunteer discipline matches encounter/station discipline; license unexpired relative to event service_date; state practice authorization holds"
    error_id: ERR_STATE_PRACTICE_FORBIDDEN
    http_status: 422
    applies_to: "POST /volunteers/{id}/authorize, POST /clinic-events/{id}/encounters"
  - priority: 7
    category: business_safety
    check: "Sterilization gate: requires_sterilization stations must have a COMPLETED cycle before OPERATIONAL and before open-doors"
    error_id: ERR_STERILIZATION_NOT_CLEARED
    http_status: 422
    applies_to: "POST /clinic-events/{id}/open-doors, POST /clinic-events/{id}/stations/{sid}/mark-operational"
  - priority: 8
    category: business_temporal
    check: "Temporal windows: service_window_close_utc > service_window_open_utc; license_expiry_date > event.service_date; arrival_utc <= doors_open_utc + service day window"
    error_id: ERR_TEMPORAL_WINDOW_INVALID
    http_status: 422
    applies_to: "station create, volunteer register, ticket issue"
  - priority: 9
    category: business_constraint
    check: "Capacity and resource constraints: total_patient_capacity not exceeded; site power budget not exceeded; autoclave batch <= 24; requeue_count < 1"
    error_id: ERR_CAPACITY_EXHAUSTED
    http_status: 422
    applies_to: "ticket issue, station set-up, sterilization-cycle create, ticket requeue"
  - priority: 10
    category: business_referential
    check: "Referential integrity: FK targets exist and are in compatible states (site VETTED, station belongs to event, volunteer AUTHORIZED, agreement supersede target CONFIRMED)"
    error_id: ERR_REFERENCE_INVALID
    http_status: 422
    applies_to: "all create/link endpoints"
  - priority: 11
    category: business_fiscal
    check: "Fiscal: liability_cap_cents >= 0; host cost share computed and capped"
    error_id: ERR_FISCAL_RULE_VIOLATION
    http_status: 422
    applies_to: "site-agreement create/confirm"
  - priority: 12
    category: state
    check: "OCC: expected_event_version equals current ClinicEvent.version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /clinic-events/{id}/site-agreements, POST /volunteers/{id}/authorize"

