          - errors.ERR_CLAIMANT_IDENTITY_MISMATCH
          - roles.Claimant.identity
        distinguishing_aspect: "The Claimant role is entity_backed: X-User-ID must equal claimant_id; a claim filed with a different X-User-ID fails 403 ERR_CLAIMANT_IDENTITY_MISMATCH even though the role is correct."
        test_recipe:
          setup:
            - "Fund OPEN_FOR_CLAIMS after a 1500000 collection; claimant A NOTIFIED."
          setup_api_calls:
            - *c_clock
            - call: "POST /enforcement/subject-companies"
              payload: { legal_name: "Acme Gadgets Inc", complaint_count_90d: 60 }
              as: PlatformAdmin
              captures: { company_id: $.data.id }
            - *c_inv
            - *c_inv_pr
            - *c_inv_eg
            - *c_inv_ng
            - *c_order
            - *c_propose
            - *c_clock_oct
            - *c_finalize
            - *c_monitor
            - *c_judgment
            - *c_get_fund
