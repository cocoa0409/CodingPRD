            - "Application.${a3_id}.appeal_round_count == 2 (unchanged by the refused filing)"
            - "Application.${a3_id}.status == DENIED with denial_reason_code RESIDENCY"
            - "GET /esa/appeals?application_id=${a3_id} returns total_count 2 and both are OVERTURNED"
      - name: suspended_account_before_cap_priority_covered_by_difficulty
        claim_type: Priority Ordering
        grounds:
          - validations[priority=21]
          - validations[priority=35]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / suspended_account_check_precedes_category_cap_check
          rationale: "The single request that violates both p21 and p35 is asserted to return 409 ERR_ACCOUNT_SUSPENDED in the named §1.8 instance."

      - name: duplicate_window_before_cap_priority_covered_by_difficulty
        claim_type: Priority Ordering
        grounds:
          - validations[priority=30]
          - validations[priority=35]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / duplicate_service_period_check_precedes_category_cap_check
          rationale: "The request that violates both p30 and p35 is asserted to return 409 ERR_DUPLICATE_SERVICE_PERIOD in the named §1.8 instance."

      - name: provider_probation_gate_on_flow_covered_by_difficulty
        claim_type: Violation -> Error
        grounds:
          - validations[priority=25]
          - errors.ERR_PROVIDER_NOT_ELIGIBLE
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / reimbursement_flow_requires_provider_not_on_probation
          rationale: "The flow-dependent provider-status gate (PROBATION blocks REIMBURSEMENT but allows PREAPPROVAL) is asserted in the named §1.8 instance."

      - name: overlapping_service_window_collision_covered_by_difficulty
        claim_type: Violation -> Error
        grounds:
          - validations[priority=30]
          - errors.ERR_DUPLICATE_SERVICE_PERIOD
        excluded_because:
          difficulty_instance: resource_temporal_overlap / adjacent_service_windows_coexist_while_overlapping_ones_collide
          rationale: "Half-open interval semantics (touching endpoints coexist, true overlap collides) are asserted in the named §1.8 instance."

  - section: endpoints
    instances:
      - name: clock_endpoint_pins_the_logical_program_time
        claim_type: Action endpoint
        grounds:
          - endpoints["POST /esa/_clock/set_current_utc"]
          - validations[priority=19]
          - errors.ERR_APPLICATION_WINDOW_CLOSED
        distinguishing_aspect: "Every window, deadline and decay decision reads the logical clock, not wall time: the identical application POST is refused at 2026-08-10 (before window_open_at 2026-08-15) and accepted at 2026-09-01, so the endpoint is the single source of program time."
        test_recipe:
          setup:
            - "ProgramYear 2026-27 is WINDOW_OPEN with window_open_at 2026-08-15T00:00:00Z."
            - "Student S1 exists and the logical clock has been set to 2026-08-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /esa/program-years"
              payload: { label: "2026-27", residency_state: "TX", total_seats: 2, window_open_at: "2026-08-15T00:00:00Z", window_close_at: "2026-09-30T23:59:59Z", term_start_date: "2026-08-01", term_end_date: "2027-06-30", base_award_cents: 731500, rollover_cap_pct: 0.25, admin_fee_pct: 0.0175, acceptance_deadline_days: 14, min_assessment_percentile: 40, min_portfolio_artifacts: 6 }
              as: ProgramAdmin
              captures: { py_id: $.data.id }
            - call: "POST /esa/program-years/${py_id}/open-window"
              payload: {}
              as: ProgramAdmin
            - call: "POST /esa/students"
              payload: { household_id: "HH-1", first_name: "Ana", last_name: "Reyes", date_of_birth: "2014-04-02", residency_state: "TX", prior_enrollment: "PUBLIC_SCHOOL_FULL_YEAR", income_band: "BAND_B", category_flags: ["DISABILITY_IEP", "PRIOR_PUBLIC_SCHOOL"], has_enrolled_sibling: false }
              as: ProgramAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /esa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              captures: { early_now: $.data.current_utc }
          trigger:
            - call: "POST /esa/applications"
              payload: { program_year_id: "${py_id}", student_id: "${s1_id}", claimed_income_band: "BAND_B", claimed_category_flags: ["DISABILITY_IEP", "PRIOR_PUBLIC_SCHOOL"] }
              as: Guardian
              as_user_id: "${s1_id}"
              captures: { err_id: $.data.error_id }
            - call: "POST /esa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { open_now: $.data.current_utc }
            - call: "POST /esa/applications"
              payload: { program_year_id: "${py_id}", student_id: "${s1_id}", claimed_income_band: "BAND_B", claimed_category_flags: ["DISABILITY_IEP", "PRIOR_PUBLIC_SCHOOL"] }
              as: Guardian
              as_user_id: "${s1_id}"
              captures: { a1_id: $.data.id }
          assert:
            - "${early_now} == 2026-08-10T00:00:00Z and ${open_now} == 2026-09-01T00:00:00Z"
            - "the first trigger returns HTTP 409 with ${err_id} == ERR_APPLICATION_WINDOW_CLOSED (the clock is before window_open_at, not after window_close_at)"
            - "the third trigger returns HTTP 201 and Application.${a1_id}.status == DRAFT"
            - "ProgramYear.${py_id}.status == WINDOW_OPEN throughout: only the clock moved"

