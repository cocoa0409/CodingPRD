        claim_type: Violation -> Error
        grounds:
          - roles.Distributor
          - errors[ERR_UNAUTHORIZED]
          - endpoints.GET_/op/reprint-plans
        distinguishing_aspect: "Peer-role denial: the Distributor role can place allocation orders but holds no read on the reprint-plan surface, so the same request that Judge or OpsAdmin may make returns 403 for this role."
        test_recipe:
