          - errors[ERR_COST_OVERRUN_BLOCKED]
        distinguishing_aspect: |
          Metric: chargeback-to-prorata ratio in exact cents; endpoint: extension
          approve. Posting chargeback 1304919 == 1186290 x 1 x 110/100 EXACTLY
          leaves posture NORMAL (comparison is strictly-greater) and the extension
