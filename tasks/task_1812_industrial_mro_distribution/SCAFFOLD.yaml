# =============================================================================
# Task 1812: Industrial MRO Distribution (Grainger style) — seed tables
# =============================================================================

scenario: |
  1812. Industrial MRO Distribution (Grainger style): contract price matrix by customer tier, national-account rebate & spend-tier true-up, branch vs central stock allocation, will-call/same-day fulfillment promise, vendor drop-ship & special-order margin, returns & restocking policy by item class, hazmat/regulated item shipping restriction, punch-out catalog & approval workflow

domain_name: industrial-mro-distribution
api_prefix: /mro

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat            # peer entities joined by FK references; no URL nesting except sub-resource reads
  state_machine_shape: parallel    # SalesOrder.status x SalesOrder.fulfillment_status; RequisitionCart is cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# common_fields: true  => id (server UUID), created_at, updated_at (ISO8601 UTC,
# 3 fractional digits), version (integer from 1, +1 per mutation).
# Date-window fields use ISO calendar dates (YYYY-MM-DD); the logical clock
# (POST /_clock/set_current_utc, default 2026-08-01T00:00:00Z) drives all
# date/minute comparisons.
# =============================================================================
entities:
  - name: CustomerAccount
    parent: null
    common_fields: true
    fields:
      - { name: account_number, type: string, source: input, description: "Unique customer account number" }
      - { name: display_name, type: string, source: input, description: "Customer display name" }
      - { name: price_tier, type: enum, source: input, default: STANDARD, description: "STANDARD | SILVER | GOLD | PLATINUM — selects the contract price-matrix row set" }
      - { name: is_national_account, type: boolean, source: input, default: false, description: "National-account flag; required to attach a RebateAgreement" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Credit ceiling in cents (>= 0)" }
      - { name: approval_threshold_cents, type: integer, source: input, default: 0, description: "Punch-out carts with estimated_total_cents strictly greater than this require CustomerApprover approval; <= threshold auto-approves on submit" }
      - { name: primary_ship_to_state, type: string, source: input, description: "Default ship-to state code (2-letter) used for hazmat region restrictions" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CREDIT_HOLD — initial ACTIVE; changed via PUT /mro/customers/{id}" }
      - { name: net_spend_cents, type: integer, source: computed, default: 0, description: "Read-only = sum(total_cents of COMPLETED orders) - sum(credit_cents of CREDITED returns) for this customer" }
      - { name: open_credit_exposure_cents, type: integer, source: computed, default: 0, description: "Read-only = sum(total_cents of orders in status CONFIRMED); debited at confirm, released at complete/cancel" }

  - name: Item
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Unique SKU code" }
      - { name: description, type: string, source: input, description: "Catalog description" }
      - { name: item_class, type: enum, source: input, description: "STOCKED | SPECIAL_ORDER | NON_RETURNABLE — drives the returns policy: STOCKED = 60-day window, 0% restock; SPECIAL_ORDER = 30-day window, 20% restock; NON_RETURNABLE = returns rejected" }
      - { name: hazmat_restriction, type: enum, source: input, default: NONE, description: "NONE | GROUND_ONLY | WILL_CALL_ONLY — GROUND_ONLY forbids SAME_DAY; WILL_CALL_ONLY forbids any delivery method" }
      - { name: restricted_states, type: array, source: input, default: [], description: "State codes where delivery of this item is prohibited (will-call pickup exempt)" }
      - { name: list_price_cents, type: integer, source: input, description: "Catalog list price per unit in cents (> 0)" }
      - { name: drop_ship_eligible, type: boolean, source: input, default: false, description: "Whether the allocation waterfall may source this item from the vendor drop-ship channel" }
      - { name: vendor_cost_estimate_cents, type: integer, source: input, default: 0, description: "Estimated vendor unit cost used for provisional drop-ship margin" }
      - { name: vendor_freight_estimate_cents, type: integer, source: input, default: 0, description: "Estimated per-line vendor freight used for provisional drop-ship margin" }

  - name: PriceMatrixRule
    parent: null
    common_fields: true
    fields:
      - { name: customer_tier, type: enum, source: input, description: "STANDARD | SILVER | GOLD | PLATINUM — the customer tier this rule prices for" }
      - { name: item_id, type: string, source: input, required: false, description: "FK -> Item.id; item-specific rule scope. Exactly one of item_id / item_class must be set" }
      - { name: item_class, type: enum, source: input, required: false, description: "STOCKED | SPECIAL_ORDER | NON_RETURNABLE — class-level rule scope. Exactly one of item_id / item_class must be set" }
      - { name: rule_type, type: enum, source: input, description: "FIXED_PRICE | DISCOUNT_PCT" }
      - { name: contract_unit_price_cents, type: integer, source: input, required: false, description: "Contract unit price in cents; required iff rule_type == FIXED_PRICE" }
      - { name: discount_pct, type: number, source: input, required: false, description: "Percent off list price (0 < pct < 100); required iff rule_type == DISCOUNT_PCT" }
      - { name: effective_from, type: datetime, source: input, description: "Window start date (YYYY-MM-DD), inclusive" }
      - { name: effective_to, type: datetime, source: input, description: "Window end date (YYYY-MM-DD), exclusive; half-open window [effective_from, effective_to); must be > effective_from" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE — initial DRAFT; DRAFT -> ACTIVE via activate (overlap check fires there)" }

  - name: RebateAgreement
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> CustomerAccount.id; taken from the creation path" }
      - { name: period_start, type: datetime, source: input, description: "Accrual period start date (YYYY-MM-DD), inclusive — CLOSED interval" }
      - { name: period_end, type: datetime, source: input, description: "Accrual period end date (YYYY-MM-DD), inclusive — CLOSED interval; must be > period_start" }
      - { name: tiers, type: array, source: input, description: "Spend tiers [{threshold_cents, rebate_bps}]; >= 1 entry; threshold_cents strictly ascending with first threshold_cents == 0; rebate_bps in 0..10000" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | CLOSED | SETTLED — initial DRAFT" }
      - { name: accrued_spend_cents, type: integer, source: computed, default: 0, description: "Read-only spend accrued while ACTIVE: += order.total_cents on completion dated inside the period; -= return.credit_cents on credit dated inside the period" }
      - { name: current_tier_index, type: integer, source: computed, default: 0, description: "Read-only = max{i : tiers[i].threshold_cents <= accrued_spend_cents} (>= boundary: exact equality reaches the tier)" }
      - { name: provisional_rebate_cents, type: integer, source: computed, default: 0, description: "Read-only average-rate accrual = round_half_up(accrued_spend_cents * tiers[current_tier_index].rebate_bps / 10000)" }
      - { name: final_rebate_cents, type: integer, source: computed, description: "Read-only marginal-band rebate computed at close; null until CLOSED" }
      - { name: true_up_delta_cents, type: integer, source: computed, description: "Read-only = final_rebate_cents - provisional_rebate_cents at close (negative = clawback); null until CLOSED" }
      - { name: settled_credit_cents, type: integer, source: computed, description: "Read-only credit issued at settle = final_rebate_cents; null until SETTLED" }

  - name: StockLocation
    parent: null
    common_fields: true
    fields:
      - { name: location_code, type: string, source: input, description: "Unique location code" }
      - { name: location_type, type: enum, source: input, description: "BRANCH | CENTRAL" }
      - { name: region_state, type: string, source: input, description: "State code where the location sits" }
      - { name: same_day_cutoff_minute, type: integer, source: input, required: false, description: "UTC minute-of-day cutoff (0..1439) for the will-call/same-day promise; REQUIRED for BRANCH, must be omitted for CENTRAL" }

  - name: StockBalance
    parent: null
    common_fields: true
    fields:
      - { name: location_id, type: string, source: system, description: "FK -> StockLocation.id; taken from the restock path" }
      - { name: item_id, type: string, source: input, description: "FK -> Item.id; given on restock" }
      - { name: on_hand_qty, type: integer, source: computed, default: 0, description: "Read-only physical units; changed only by restock (+), mark-fulfilled (-), and return receive of RESALEABLE STOCKED lines (+)" }
      - { name: reserved_qty, type: integer, source: computed, default: 0, description: "Read-only units allocated to unfulfilled order lines at this location" }
      - { name: available_qty, type: integer, source: computed, default: 0, description: "Read-only = on_hand_qty - reserved_qty (identity holds at all times)" }
    note: "Unique per (location_id, item_id); created lazily by the first restock of that item at that location"

  - name: RequisitionCart
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> CustomerAccount.id; owning account (punch-out buyer's account)" }
      - { name: punch_out_external_ref, type: string, source: input, required: false, description: "External punch-out session reference" }
      - { name: lines, type: array, source: input, description: "Cart lines [{item_id, qty}], >= 1 line, qty >= 1" }
      - { name: estimated_total_cents, type: integer, source: computed, default: 0, description: "Read-only = sum(qty * resolved unit price) per current price rules at submit; recomputed on every submit (no freight)" }
      - { name: status, type: enum, source: system, description: "OPEN | PENDING_APPROVAL | APPROVED | REJECTED | CONVERTED — initial OPEN" }
      - { name: rejection_reason, type: string, source: system, description: "Reason captured from the reject call; null unless REJECTED" }

  - name: SalesOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> CustomerAccount.id" }
      - { name: fulfillment_branch_id, type: string, source: input, description: "FK -> StockLocation.id; must reference a BRANCH location" }
      - { name: source_cart_id, type: string, source: input, required: false, description: "FK -> RequisitionCart.id; set when the order is created from an APPROVED cart; null for direct orders" }
      - { name: fulfillment_method, type: enum, source: input, description: "WILL_CALL | SAME_DAY | STANDARD" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | CONFIRMED | COMPLETED | CANCELLED — initial SUBMITTED (commercial dimension)" }
      - { name: fulfillment_status, type: enum, source: system, description: "UNALLOCATED | ALLOCATED | PARTIALLY_ALLOCATED | READY_FOR_WILL_CALL | SHIPPED | FULFILLED — initial UNALLOCATED (warehouse dimension, evolves independently of status)" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Read-only = sum(line_total_cents), computed at order creation; excludes freight" }
      - { name: freight_cents, type: integer, source: computed, description: "Read-only freight + hazmat handling, computed at order creation (see order_total_pricing)" }
      - { name: total_cents, type: integer, source: computed, description: "Read-only = subtotal_cents + freight_cents" }
      - { name: promise_date, type: datetime, source: computed, description: "Read-only promise date (YYYY-MM-DD) for WILL_CALL/SAME_DAY per the branch cutoff; null for STANDARD" }
      - { name: sla_breach, type: boolean, source: computed, default: false, description: "Read-only; set at mark-ready: true iff promise_date is set and the mark-ready clock date is later than promise_date" }
      - { name: confirmed_at, type: datetime, source: system, description: "Logical-clock timestamp of confirm; null until CONFIRMED" }
      - { name: fulfilled_at, type: datetime, source: system, description: "Logical-clock timestamp of mark-fulfilled; null until FULFILLED; return windows measure from this date" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock timestamp of complete; null until COMPLETED" }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> SalesOrder.id; set at order creation" }
      - { name: item_id, type: string, source: input, description: "FK -> Item.id" }
      - { name: qty, type: integer, source: input, description: "Ordered units (>= 1)" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Read-only resolved unit price (contract matrix + quantity tier), snapshotted at order creation" }
      - { name: line_total_cents, type: integer, source: computed, description: "Read-only = qty * unit_price_cents" }
      - { name: qty_branch, type: integer, source: computed, default: 0, description: "Read-only units allocated from the fulfilling branch" }
      - { name: qty_central, type: integer, source: computed, default: 0, description: "Read-only units allocated from the selected central DC" }
      - { name: qty_drop_ship, type: integer, source: computed, default: 0, description: "Read-only units routed to vendor drop-ship" }
      - { name: qty_backordered, type: integer, source: computed, default: 0, description: "Read-only units awaiting stock; decremented by the backorder auto-fill chain" }
      - { name: fulfillment_source, type: enum, source: computed, description: "BRANCH_ONLY | SPLIT_STOCK | DROP_SHIP_ONLY | BACKORDER_ONLY | MIXED — derived from the qty_* fields at confirm; UNRESOLVED before confirm", default: UNRESOLVED }
      - { name: qty_vendor_confirmed, type: integer, source: system, default: 0, description: "Units the drop-ship vendor has confirmed with actual costs" }
      - { name: vendor_cost_actual_cents, type: integer, source: system, description: "Actual vendor unit cost from vendor-confirm; null until confirmed" }
      - { name: freight_actual_cents, type: integer, source: system, description: "Actual per-line vendor freight from vendor-confirm; null until confirmed" }
      - { name: provisional_margin_cents, type: integer, source: computed, description: "Read-only estimated drop-ship margin at confirm; null when qty_drop_ship == 0" }
      - { name: final_margin_cents, type: integer, source: computed, description: "Read-only actualized drop-ship margin at vendor-confirm; null until confirmed" }
      - { name: margin_status, type: enum, source: computed, default: NOT_APPLICABLE, description: "NOT_APPLICABLE | PROVISIONAL | FINALIZED" }

  - name: ReturnAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> SalesOrder.id; the order being returned against" }
      - { name: lines, type: array, source: input, description: "Return lines [{order_line_id, qty, condition}]; condition in RESALEABLE | DAMAGED; qty >= 1" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | REJECTED | RECEIVED | CREDITED — initial REQUESTED" }
      - { name: rejection_reason, type: string, source: system, description: "Reason captured from the reject call; null unless REJECTED" }
      - { name: credit_cents, type: integer, source: computed, description: "Read-only return credit (per-line rounding, then sum); null until CREDITED" }
      - { name: restocking_fee_cents, type: integer, source: computed, description: "Read-only = sum(line gross) - credit_cents; null until CREDITED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: CustomerAccount
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: CREDIT_HOLD
        trigger: "PUT /mro/customers/{id} with status=CREDIT_HOLD"
        actor: DistributionAdmin
        preconditions:
          - "expected_customer_version matches current version (ERR_STALE_VERSION)"
        side_effects:
          - "CustomerAccount.version += 1"
        note: "Open orders are unaffected; only POST /mro/orders/{id}/confirm is gated on customer status"
      - from: CREDIT_HOLD
        to: ACTIVE
        trigger: "PUT /mro/customers/{id} with status=ACTIVE"
        actor: DistributionAdmin
        preconditions:
          - "expected_customer_version matches current version (ERR_STALE_VERSION)"
        side_effects:
          - "CustomerAccount.version += 1"

  - entity: PriceMatrixRule
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /mro/price-rules/{id}/activate"
        actor: DistributionAdmin
        preconditions:
          - "No other ACTIVE rule with the same scope key (customer_tier + item_id, or customer_tier + item_class) has an overlapping half-open window [effective_from, effective_to) (ERR_PRICE_RULE_WINDOW_OVERLAP)"
        side_effects: []
        note: "Two DRAFT rules may overlap freely; the overlap gate fires only at activation. PUT of an ACTIVE rule that changes the window re-runs the same overlap check."

  - entity: RebateAgreement
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /mro/rebate-agreements/{id}/activate"
        actor: DistributionAdmin
        preconditions:
          - "Logical-clock date <= period_end (ERR_AGREEMENT_PERIOD_EXPIRED)"
        side_effects: []
        note: "Early activation (clock date < period_start) is allowed; accrual only counts completions/credits dated inside [period_start, period_end]"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /mro/rebate-agreements/{id}/close"
        actor: DistributionAdmin
        preconditions:
          - "Logical-clock date > period_end (ERR_AGREEMENT_PERIOD_NOT_ENDED)"
        side_effects:
          - "Compute final_rebate_cents (marginal-band variant of rebate_accrual_and_trueup)"
          - "Compute true_up_delta_cents = final_rebate_cents - provisional_rebate_cents"
      - from: CLOSED
        to: SETTLED
        trigger: "POST /mro/rebate-agreements/{id}/settle"
        actor: DistributionAdmin
        preconditions: []
        side_effects:
          - "settled_credit_cents = final_rebate_cents"

  - entity: RequisitionCart
    initial_state: OPEN
    terminal_states: [CONVERTED]
    transitions:
      - from: OPEN
        to: PENDING_APPROVAL
        trigger: "POST /mro/carts/{id}/submit"
        actor: CustomerBuyer
        preconditions:
          - "lines contains >= 1 line (ERR_VALIDATION)"
        side_effects:
          - "estimated_total_cents recomputed = sum(qty * resolved unit price) per current ACTIVE price rules (no freight)"
        note: "Taken when estimated_total_cents > customer.approval_threshold_cents"
      - from: OPEN
        to: APPROVED
        trigger: "POST /mro/carts/{id}/submit"
        actor: CustomerBuyer
        preconditions:
          - "lines contains >= 1 line (ERR_VALIDATION)"
        side_effects:
          - "estimated_total_cents recomputed as above"
        note: "Auto-approval fork: taken when estimated_total_cents <= customer.approval_threshold_cents (boundary: exact equality auto-approves)"
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /mro/carts/{id}/approve"
        actor: CustomerApprover
        preconditions:
          - "Cart is PENDING_APPROVAL (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /mro/carts/{id}/reject"
        actor: CustomerApprover
        preconditions:
          - "Cart is PENDING_APPROVAL (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "rejection_reason = request reason"
      - from: REJECTED
        to: OPEN
        trigger: "PUT /mro/carts/{id} (revise lines)"
        actor: CustomerBuyer
        preconditions: []
        side_effects:
          - "lines replaced; rejection_reason cleared"
        note: "Revision loop — the cycle OPEN -> PENDING_APPROVAL -> REJECTED -> OPEN may repeat without bound"
      - from: OPEN
        to: OPEN
        trigger: "PUT /mro/carts/{id} (revise lines)"
        actor: CustomerBuyer
        preconditions: []
        side_effects:
          - "lines replaced"
      - from: APPROVED
        to: CONVERTED
        trigger: "POST /mro/orders with source_cart_id"
        actor: CustomerBuyer | DistributionAdmin
        preconditions:
          - "Cart is APPROVED (ERR_INVALID_STATE_TRANSITION)"
          - "Request customer_id == cart.customer_id (ERR_CART_CUSTOMER_MISMATCH)"
        side_effects:
          - "SalesOrder created in SUBMITTED with lines copied from the cart and source_cart_id set"

  - entity: SalesOrder
    dimension: status
    initial_state: SUBMITTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: CONFIRMED
        trigger: "POST /mro/orders/{id}/confirm"
        actor: DistributionAdmin
        preconditions:
          - "CustomerAccount.status == ACTIVE (ERR_CUSTOMER_NOT_ACTIVE)"
          - "No line item with hazmat_restriction == WILL_CALL_ONLY when fulfillment_method != WILL_CALL (ERR_HAZMAT_METHOD_RESTRICTED)"
          - "No line item with hazmat_restriction == GROUND_ONLY when fulfillment_method == SAME_DAY (ERR_HAZMAT_METHOD_RESTRICTED)"
          - "No line item whose restricted_states contains customer.primary_ship_to_state when fulfillment_method != WILL_CALL (ERR_HAZMAT_REGION_RESTRICTED)"
          - "open_credit_exposure_cents + total_cents <= customer.credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED; exact equality is allowed)"
        side_effects:
          - "Run allocation_waterfall per line in request order: branch first, then one selected CENTRAL, then drop-ship if eligible, else backorder"
          - "StockBalance reservations: branch balance reserved_qty += qty_branch; selected central balance reserved_qty += qty_central"
          - "fulfillment_status = ALLOCATED if no line has qty_backordered > 0 else PARTIALLY_ALLOCATED"
          - "promise_date computed (promise_date calculation) for WILL_CALL/SAME_DAY"
          - "provisional drop-ship margins computed for lines with qty_drop_ship > 0 (margin_status PROVISIONAL)"
          - "confirmed_at = logical clock"
          - "CustomerAccount.open_credit_exposure_cents += total_cents"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /mro/orders/{id}/cancel"
        actor: CustomerBuyer | DistributionAdmin
        preconditions: []
        side_effects: []
        note: "No reservations exist yet in SUBMITTED"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /mro/orders/{id}/cancel"
        actor: CustomerBuyer | DistributionAdmin
        preconditions:
          - "fulfillment_status in {ALLOCATED, PARTIALLY_ALLOCATED} (ERR_INVALID_STATE_TRANSITION once READY_FOR_WILL_CALL/SHIPPED/FULFILLED)"
        side_effects:
          - "Link 1: for each line, StockBalance(branch,item).reserved_qty -= qty_branch and the selected central StockBalance.reserved_qty -= qty_central; available_qty recomputed on each touched balance"
          - "Link 2: freed availability auto-fills eligible backordered OrderLines at the freed location (eligibility: line.qty_backordered > 0 AND parent SalesOrder.status == CONFIRMED AND parent.fulfillment_branch_id == that branch for branch stock, resp. allocated central for central stock; processing order: parent order created_at ASC, then line position ASC): each fill decrements qty_backordered, increments qty_branch (resp. qty_central), and re-increments that balance's reserved_qty by the filled units"
          - "Link 3: a line whose qty_backordered reaches 0 triggers its parent SalesOrder.fulfillment_status recompute (PARTIALLY_ALLOCATED -> ALLOCATED when no line of that order has qty_backordered > 0)"
          - "Link 4: CustomerAccount.open_credit_exposure_cents -= total_cents"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /mro/orders/{id}/complete"
        actor: DistributionAdmin
        preconditions:
          - "fulfillment_status == FULFILLED (ERR_ORDER_NOT_FULFILLED)"
        side_effects:
          - "Link 1: CustomerAccount.net_spend_cents += total_cents and open_credit_exposure_cents -= total_cents"
          - "Link 2: that spend mutation debits every ACTIVE RebateAgreement of this customer whose closed period [period_start, period_end] contains the completion date: accrued_spend_cents += total_cents"
          - "Link 3: the accrual re-evaluates current_tier_index = max{i : tiers[i].threshold_cents <= accrued_spend_cents}"
          - "Link 4: provisional_rebate_cents recomputed at the new current_tier_index (average-rate variant)"
          - "completed_at = logical clock"

  - entity: SalesOrder
    dimension: fulfillment_status
    initial_state: UNALLOCATED
    terminal_states: [FULFILLED]
    transitions:
      - from: UNALLOCATED
        to: ALLOCATED
        trigger: "POST /mro/orders/{id}/confirm"
        actor: DistributionAdmin
        preconditions: []
        side_effects: []
        note: "Taken when the allocation waterfall leaves qty_backordered == 0 on every line"
      - from: UNALLOCATED
        to: PARTIALLY_ALLOCATED
        trigger: "POST /mro/orders/{id}/confirm"
        actor: DistributionAdmin
        preconditions: []
        side_effects: []
        note: "Taken when any line has qty_backordered > 0 after the waterfall"
      - from: PARTIALLY_ALLOCATED
        to: ALLOCATED
        trigger: "system (automatic when the backorder auto-fill chain leaves qty_backordered == 0 on every line)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ALLOCATED
        to: READY_FOR_WILL_CALL
        trigger: "POST /mro/orders/{id}/mark-ready"
        actor: BranchManager
        preconditions:
          - "fulfillment_method == WILL_CALL"
          - "Order status == CONFIRMED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "sla_breach = (promise_date is set AND logical-clock date > promise_date)"
      - from: PARTIALLY_ALLOCATED
        to: READY_FOR_WILL_CALL
        trigger: "POST /mro/orders/{id}/mark-ready"
        actor: BranchManager
        preconditions:
          - "fulfillment_method == WILL_CALL"
          - "Order status == CONFIRMED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "sla_breach computed as above"
        note: "Partial orders may be readied; backordered units remain open"
      - from: ALLOCATED
        to: SHIPPED
        trigger: "POST /mro/orders/{id}/mark-ready"
        actor: BranchManager
        preconditions:
          - "fulfillment_method in {SAME_DAY, STANDARD}"
          - "Order status == CONFIRMED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "sla_breach computed as above"
      - from: PARTIALLY_ALLOCATED
        to: SHIPPED
        trigger: "POST /mro/orders/{id}/mark-ready"
        actor: BranchManager
        preconditions:
          - "fulfillment_method in {SAME_DAY, STANDARD}"
          - "Order status == CONFIRMED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "sla_breach computed as above"
      - from: READY_FOR_WILL_CALL
        to: FULFILLED
        trigger: "POST /mro/orders/{id}/mark-fulfilled"
        actor: BranchManager
        preconditions:
          - "Every line with qty_drop_ship > 0 has qty_vendor_confirmed == qty_drop_ship (ERR_DROP_SHIP_UNCONFIRMED)"
        side_effects:
          - "For each line: branch StockBalance on_hand_qty -= qty_branch and reserved_qty -= qty_branch; selected central StockBalance on_hand_qty -= qty_central and reserved_qty -= qty_central"
          - "fulfilled_at = logical clock"
      - from: SHIPPED
        to: FULFILLED
        trigger: "POST /mro/orders/{id}/mark-fulfilled"
        actor: BranchManager
        preconditions:
          - "Every line with qty_drop_ship > 0 has qty_vendor_confirmed == qty_drop_ship (ERR_DROP_SHIP_UNCONFIRMED)"
        side_effects:
          - "Same stock decrement side effects as READY_FOR_WILL_CALL -> FULFILLED"
          - "fulfilled_at = logical clock"

  - entity: ReturnAuthorization
    initial_state: REQUESTED
    terminal_states: [REJECTED, CREDITED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /mro/returns/{id}/approve"
        actor: DistributionAdmin
        preconditions: []
        side_effects: []
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /mro/returns/{id}/reject"
        actor: DistributionAdmin
        preconditions: []
        side_effects:
          - "rejection_reason = request reason"
        note: "Branching fork: a REQUESTED return is either approved or rejected, never both"
      - from: APPROVED
        to: RECEIVED
        trigger: "POST /mro/returns/{id}/receive"
        actor: BranchManager
        preconditions: []
        side_effects:
          - "Link 1: lines with condition == RESALEABLE and item.item_class == STOCKED increment StockBalance(order.fulfillment_branch_id, item).on_hand_qty by qty (DAMAGED lines and SPECIAL_ORDER items are never restocked)"
          - "Link 2: the freed on-hand stock triggers the same backorder auto-fill chain as order cancel (eligibility + created_at ASC ordering), re-reserving units to the oldest eligible backordered lines"
          - "Link 3: any line whose qty_backordered reaches 0 recomputes its parent SalesOrder.fulfillment_status (PARTIALLY_ALLOCATED -> ALLOCATED when fully allocated)"
      - from: RECEIVED
        to: CREDITED
        trigger: "POST /mro/returns/{id}/credit"
        actor: DistributionAdmin
        preconditions: []
        side_effects:
          - "Compute credit_cents and restocking_fee_cents per return_credit (per-line rounding, then sum)"
          - "Link 1: CustomerAccount.net_spend_cents -= credit_cents"
          - "Link 2: every ACTIVE RebateAgreement of the customer whose closed period contains the credit date: accrued_spend_cents -= credit_cents"
          - "Link 3: current_tier_index and provisional_rebate_cents recomputed at the reduced accrual"

# =============================================================================
# Table 2.1: Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: customer-update-stale-version
    parent_entity: CustomerAccount
    write_endpoint: "PUT /mro/customers/{id}"
    occ_field: expected_customer_version
    description: |
      Updating a CustomerAccount (tier, limits, or status) with an
      expected_customer_version below the account's current version is
      rejected. The account's version advances on every successful PUT, so a
      client holding a previously observed version is writing from a stale
      view even though a sequential update would otherwise be legitimate.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: price-rule-update-stale-version
    parent_entity: PriceMatrixRule
    write_endpoint: "PUT /mro/price-rules/{id}"
    occ_field: expected_price_rule_version
    description: |
      Updating a PriceMatrixRule with an expected_price_rule_version below the
      rule's current version is rejected. The rule's version advances on every
      successful PUT (and a PUT that changes the window of an ACTIVE rule
      re-runs the overlap check), so a stale-version writer is acting on a
      superseded definition of the price matrix.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# All money math in integer cents; round_half_up unless stated otherwise.
# =============================================================================
calculations:
  - name: order_line_unit_price
    trigger: "SalesOrder creation (POST /mro/orders), per line, in request order"
    algorithm: tiered_pricing
    formula: |
      Inputs: customer.price_tier, item (id, item_class, list_price_cents),
      line qty, logical-clock date.
      1. Candidate rules = PriceMatrixRule with status == ACTIVE,
         customer_tier == customer.price_tier, and
         effective_from <= clock_date < effective_to (half-open), and
         (item_id == line.item_id OR item_class == item.item_class).
      2. Specificity: an item_id rule beats an item_class rule. Overlap
         validation guarantees at most one ACTIVE rule per
         (tier, item) and per (tier, class) covering a date, so at most one
         candidate survives per specificity level; no further tie-break exists.
      3. base = rule.contract_unit_price_cents                (FIXED_PRICE)
         base = round_half_up(list_price_cents * (1 - discount_pct/100))  (DISCOUNT_PCT; rounding step 1)
         base = list_price_cents                              (no candidate)
      4. Quantity tier, whole-quantity (average, NOT marginal):
         qty >= 50 -> 5% off; else qty >= 10 -> 3% off; else no tier.
         unit = round_half_up(base * (1 - tier_pct))          (rounding step 2)
      5. Cap: unit = min(unit, list_price_cents).
      6. line_total_cents = qty * unit_price_cents (exact integer).
    input_set: "ACTIVE rules of the order customer's tier whose half-open window contains the order-creation clock date"
    constants:
      QTY_TIER_1_THRESHOLD: 10
      QTY_TIER_1_PCT: 0.03
      QTY_TIER_2_THRESHOLD: 50
      QTY_TIER_2_PCT: 0.05
    precision: "integer cents; round_half_up at each marked step, in the pinned order (discount first, quantity tier second)"

  - name: order_total_pricing
    trigger: "SalesOrder creation (POST /mro/orders), after all lines are priced"
    algorithm: threshold
    formula: |
      Pinned evaluation order (the circular-looking dependency is resolved by
      testing the threshold against the PRE-FREIGHT subtotal only):
      1. subtotal_cents = sum(line_total_cents) over all lines.
      2. base_freight: WILL_CALL -> 0;
         else if subtotal_cents >= FREE_FREIGHT_THRESHOLD_CENTS -> 0;
         else SAME_DAY -> SAME_DAY_FREIGHT_CENTS; STANDARD -> STANDARD_FREIGHT_CENTS.
      3. hazmat_handling = HAZMAT_HANDLING_CENTS if any line's item has
         hazmat_restriction != NONE and fulfillment_method != WILL_CALL, else 0.
      4. freight_cents = base_freight + hazmat_handling.
      5. total_cents = subtotal_cents + freight_cents.
    input_set: "All lines of the order"
    constants:
      FREE_FREIGHT_THRESHOLD_CENTS: 25000
      SAME_DAY_FREIGHT_CENTS: 1500
      STANDARD_FREIGHT_CENTS: 795
      HAZMAT_HANDLING_CENTS: 2500
    precision: "integer cents; no rounding needed"
    note: "The free-freight test never includes freight itself; hazmat handling is added even when base freight is waived"

  - name: return_credit
    trigger: "POST /mro/returns/{id}/credit (transition RECEIVED -> CREDITED)"
    algorithm: aggregation
    formula: |
      Policy by item.item_class: STOCKED -> restock 0%, window 60 days;
      SPECIAL_ORDER -> restock 20%, window 30 days; NON_RETURNABLE -> rejected
      at return creation (ERR_ITEM_NOT_RETURNABLE).
      Rounding order is PINNED (per-line first, then sum):
      1. Per return line l: gross_l = qty_l * unit_price_cents_l (order-line snapshot).
      2. credit_l = round_half_up(gross_l * (1 - restock_pct(class_l)/100)).
      3. credit_cents = sum(credit_l).
      4. restocking_fee_cents = sum(gross_l) - credit_cents.
      The alternative "sum grosses, then round once" is explicitly rejected:
      e.g. two SPECIAL_ORDER lines grossing 103 each yield 82 + 82 = 164,
      not round(206 * 0.8) = 165.
    input_set: "The return's lines; unit prices from the referenced order lines"
    constants:
      STOCKED_RESTOCK_PCT: 0
      STOCKED_WINDOW_DAYS: 60
      SPECIAL_ORDER_RESTOCK_PCT: 20
      SPECIAL_ORDER_WINDOW_DAYS: 30
    precision: "integer cents; round_half_up per line BEFORE summing"

  - name: rebate_accrual_and_trueup
    trigger: "Accrual variant: order COMPLETED / return CREDITED dated inside an ACTIVE agreement's period. Final variant: agreement close."
    algorithm: tiered_pricing
    formula: |
      Shared: accrued_spend_cents maintained on the agreement (see transitions).
      current_tier_index = max{i : tiers[i].threshold_cents <= accrued_spend_cents}
      (>= boundary: spend exactly equal to a threshold reaches that tier).
    input_set: "Completions/credits dated inside [period_start, period_end] while the agreement is ACTIVE"
    precision: "integer cents; round_half_up once at the end of each variant"
    variants:
      - name: provisional_average_rate
        when: "While ACTIVE, after every accrual/decrement"
        difference: "provisional_rebate_cents = round_half_up(accrued_spend_cents * tiers[current_tier_index].rebate_bps / 10000) — the reached tier's rate applies to ALL accrued spend (average rate)"
      - name: final_marginal_bands
        when: "At close (ACTIVE -> CLOSED)"
        difference: "final_rebate_cents = round_half_up(sum over i of band_i * tiers[i].rebate_bps / 10000) where band_i = max(0, min(accrued_spend_cents, threshold_{i+1} or +inf) - threshold_i) — each band of spend earns only its own tier's rate (marginal). true_up_delta_cents = final_rebate_cents - provisional_rebate_cents; may be negative (clawback). Example: tiers [{0,100},{10000000,200}] with accrued 15000000 -> provisional 300000 vs final 200000."

  - name: drop_ship_margin
    trigger: "Provisional: order confirm, per line with qty_drop_ship > 0. Final: vendor-confirm."
    algorithm: aggregation
    formula: |
      Per line (only when qty_drop_ship > 0):
      provisional_margin_cents = qty_drop_ship * unit_price_cents
        - (qty_drop_ship * item.vendor_cost_estimate_cents + item.vendor_freight_estimate_cents)
      final_margin_cents = qty_drop_ship * unit_price_cents
        - (qty_drop_ship * vendor_cost_actual_cents + freight_actual_cents)
      margin_status: NOT_APPLICABLE (qty_drop_ship == 0) -> PROVISIONAL (at confirm) -> FINALIZED (at vendor-confirm).
    input_set: "Order lines with qty_drop_ship > 0"
    precision: "integer cents"
    variants:
      - name: provisional_estimated
        when: "At order confirm"
        difference: "Uses item.vendor_cost_estimate_cents and item.vendor_freight_estimate_cents"
      - name: final_actualized
        when: "At POST /mro/orders/{id}/vendor-confirm"
        difference: "Uses the vendor-supplied vendor_cost_actual_cents and freight_actual_cents; for identical sell price the two variants differ whenever actuals differ from estimates"

  - name: promise_date
    trigger: "POST /mro/orders/{id}/confirm"
    algorithm: threshold
    formula: |
      If fulfillment_method in {WILL_CALL, SAME_DAY}:
        minute = UTC minute-of-day of the logical clock at confirm
        promise_date = clock_date            if minute <= branch.same_day_cutoff_minute
        promise_date = clock_date + 1 day    otherwise
      If fulfillment_method == STANDARD: promise_date = null.
      Boundary is <= : confirming at exactly the cutoff minute earns the
      same-day promise. sla_breach is computed at mark-ready:
      sla_breach = promise_date is not null AND clock date at mark-ready > promise_date.
    input_set: "The order and its fulfilling branch"
    precision: "date granularity (YYYY-MM-DD)"

  - name: allocation_waterfall
    trigger: "POST /mro/orders/{id}/confirm, per line in request order"
    algorithm: waterfall_allocation
    formula: |
      remaining = line.qty
      (a StockBalance that does not exist yet reads as available_qty 0)
      1. Branch bucket: take = min(branch_balance.available_qty, remaining);
         qty_branch += take; branch_balance.reserved_qty += take; remaining -= take.
      2. Central bucket (single location): if remaining > 0, select ONE central:
         eligibility = StockLocation.location_type == CENTRAL AND its balance
         for this item has available_qty > 0; ranking = available_qty DESC;
         tie-break = StockLocation.created_at ASC (never id). take =
         min(selected.available_qty, remaining); qty_central += take;
         selected.reserved_qty += take; remaining -= take. Only one central is
         ever used per line; if the pool is empty, fall through.
      3. Drop-ship bucket: if remaining > 0 AND item.drop_ship_eligible:
         qty_drop_ship = remaining; remaining = 0.
      4. Backorder bucket: qty_backordered = remaining.
      fulfillment_source derivation: qty == qty_branch -> BRANCH_ONLY;
      qty == qty_drop_ship -> DROP_SHIP_ONLY; qty == qty_backordered ->
      BACKORDER_ONLY; qty == qty_branch + qty_central -> SPLIT_STOCK; else MIXED.
    input_set: "StockBalances for the line's item at the fulfilling branch and at CENTRAL locations"
    precision: "integer units"

  - name: available_qty
    trigger: "On every mutation of a StockBalance (restock, reserve, release, fulfill, return putaway)"
    algorithm: aggregation
    formula: "available_qty = on_hand_qty - reserved_qty; the identity holds at all times and both fields are read-only to clients"
    input_set: "The mutated StockBalance"
    precision: "integer units"

  - name: credit_exposure
    trigger: "POST /mro/orders/{id}/confirm (fiscal gate)"
    algorithm: aggregation
    formula: |
      open_credit_exposure_cents (on CustomerAccount) = sum(total_cents) over
      the customer's orders in status CONFIRMED. At confirm, the gate is
      open_credit_exposure_cents + order.total_cents <= credit_limit_cents;
      exact equality is allowed (> rejects with ERR_CREDIT_LIMIT_EXCEEDED).
      The exposure is debited at confirm and released at complete or cancel.
    input_set: "Customer's orders in status CONFIRMED plus the order being confirmed"
    precision: "integer cents"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "The caller's role is permitted on this endpoint"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Entity-backed roles (CustomerBuyer, CustomerApprover) may only touch resources owned by their account: X-User-ID must equal the owning customer_id of the cart/order/return's order/customer path parameter"
    error_id: ERR_CUSTOMER_SCOPE_MISMATCH
    http_status: 403
    applies_to: "customer-scoped endpoints when called by entity-backed roles"
  - priority: 4
    category: existence
    check: "Path resource ids exist, validated left-to-right (customer before agreement, order before return, etc.)"
    error_id: "ERR_CUSTOMER_NOT_FOUND | ERR_ITEM_NOT_FOUND | ERR_PRICE_RULE_NOT_FOUND | ERR_REBATE_AGREEMENT_NOT_FOUND | ERR_LOCATION_NOT_FOUND | ERR_CART_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_RETURN_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids or body-referenced ids"
  - priority: 5
    category: business_constraint
    check: "Request shape: required fields present, enum members valid, qty >= 1, amounts >= 0, effective_to > effective_from, period_end > period_start, tiers well-formed (first threshold 0, strictly ascending), exactly one of item_id/item_class on price rules, exactly one of lines/source_cart_id on order create, same_day_cutoff_minute present iff location_type == BRANCH"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all mutation endpoints"
  - priority: 6
    category: state
    check: "State preconditions of the targeted transition, including: OCC expected_*_version match on PUT endpoints (ERR_STALE_VERSION 412); customer ACTIVE at order confirm (ERR_CUSTOMER_NOT_ACTIVE); order fulfillment FULFILLED at complete (ERR_ORDER_NOT_FULFILLED); drop-ship lines vendor-confirmed at mark-fulfilled (ERR_DROP_SHIP_UNCONFIRMED); return allowed only when order is COMPLETED or (CONFIRMED with fulfillment FULFILLED) (ERR_ORDER_NOT_RETURNABLE); all other from-state mismatches (ERR_INVALID_STATE_TRANSITION)"
    error_id: "ERR_STALE_VERSION | ERR_CUSTOMER_NOT_ACTIVE | ERR_ORDER_NOT_FULFILLED | ERR_DROP_SHIP_UNCONFIRMED | ERR_ORDER_NOT_RETURNABLE | ERR_INVALID_STATE_TRANSITION"
    http_status: "409 (ERR_STALE_VERSION is 412)"
    applies_to: "state-transition and PUT endpoints"
  - priority: 7
    category: business_safety
    check: "Hazmat/regulated shipping restrictions at order confirm: WILL_CALL_ONLY item on a delivery method, or GROUND_ONLY item on SAME_DAY (ERR_HAZMAT_METHOD_RESTRICTED); item.restricted_states containing customer.primary_ship_to_state on a delivery method (ERR_HAZMAT_REGION_RESTRICTED; WILL_CALL is exempt from both)"
    error_id: "ERR_HAZMAT_METHOD_RESTRICTED | ERR_HAZMAT_REGION_RESTRICTED"
    http_status: 422
    applies_to: "POST /mro/orders/{id}/confirm"
  - priority: 8
    category: business_temporal
    check: "Clock-relative windows: rebate activate requires clock date <= period_end (ERR_AGREEMENT_PERIOD_EXPIRED); rebate close requires clock date > period_end (ERR_AGREEMENT_PERIOD_NOT_ENDED); return creation requires clock date <= fulfilled_at date + class window (ERR_RETURN_WINDOW_EXPIRED)"
    error_id: "ERR_AGREEMENT_PERIOD_EXPIRED | ERR_AGREEMENT_PERIOD_NOT_ENDED | ERR_RETURN_WINDOW_EXPIRED"
    http_status: "409 (ERR_RETURN_WINDOW_EXPIRED is 422)"
    applies_to: "rebate activate/close; return create"
  - priority: 9
    category: business_constraint
    check: "Uniqueness and interval-overlap: sku unique (ERR_SKU_ALREADY_EXISTS); account_number unique (ERR_ACCOUNT_NUMBER_EXISTS); location_code unique (ERR_LOCATION_CODE_EXISTS); price-rule activation must not overlap an ACTIVE same-scope rule under half-open windows (ERR_PRICE_RULE_WINDOW_OVERLAP); rebate agreement must not overlap another agreement of the same customer under closed intervals (ERR_AGREEMENT_WINDOW_OVERLAP)"
    error_id: "ERR_SKU_ALREADY_EXISTS | ERR_ACCOUNT_NUMBER_EXISTS | ERR_LOCATION_CODE_EXISTS | ERR_PRICE_RULE_WINDOW_OVERLAP | ERR_AGREEMENT_WINDOW_OVERLAP"
    http_status: 409
    applies_to: "POST /mro/items, POST /mro/customers, POST /mro/locations, price-rule activate/PUT, rebate create"
  - priority: 10
    category: business_referential
    check: "Referential business rules: rebate create requires customer.is_national_account (ERR_CUSTOMER_NOT_NATIONAL_ACCOUNT); NON_RETURNABLE items rejected from returns (ERR_ITEM_NOT_RETURNABLE); fulfillment_branch_id must reference a BRANCH (ERR_BRANCH_TYPE_REQUIRED); return lines must belong to the order and not exceed remaining returnable qty (ERR_RETURN_LINE_INVALID); vendor-confirm actual_costs must cover exactly the order's unconfirmed drop-ship lines (ERR_VENDOR_LINES_MISMATCH); order customer_id must equal source cart's customer_id (ERR_CART_CUSTOMER_MISMATCH)"
    error_id: "ERR_CUSTOMER_NOT_NATIONAL_ACCOUNT | ERR_ITEM_NOT_RETURNABLE | ERR_BRANCH_TYPE_REQUIRED | ERR_RETURN_LINE_INVALID | ERR_VENDOR_LINES_MISMATCH | ERR_CART_CUSTOMER_MISMATCH"
    http_status: 422
    applies_to: "rebate create, return create, order create, vendor-confirm"
  - priority: 11
    category: business_fiscal
    check: "Credit gate at confirm: open_credit_exposure_cents + total_cents > credit_limit_cents rejects (exact equality allowed)"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /mro/orders/{id}/confirm"

# =============================================================================
# Table 5: API Endpoint Table (response envelope is FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- CustomerAccount ---
  - method: POST
    path: "/mro/customers"
    description: "Create a customer account"
    roles: [DistributionAdmin]
    code: 201
    input: [account_number, display_name, "price_tier?", "is_national_account?", credit_limit_cents, "approval_threshold_cents?", primary_ship_to_state]
    output: CustomerAccount
    side_effects: ["status = ACTIVE", "net_spend_cents = 0", "open_credit_exposure_cents = 0"]
  - method: GET
    path: "/mro/customers/{id}"
    description: "Get a customer account"
    roles: [DistributionAdmin, CustomerBuyer, CustomerApprover, BranchManager, VendorRep]
    code: 200
    input: []
    output: CustomerAccount
    side_effects: []
  - method: PUT
    path: "/mro/customers/{id}"
    description: "Update tier/limits/threshold/ship-to or status (ACTIVE <-> CREDIT_HOLD); OCC-guarded"
    roles: [DistributionAdmin]
    code: 200
    input: ["price_tier?", "is_national_account?", "credit_limit_cents?", "approval_threshold_cents?", "primary_ship_to_state?", "status?", expected_customer_version]
    output: CustomerAccount
    side_effects: ["increments CustomerAccount.version by 1", "status transitions per CustomerAccount state machine"]
  - method: GET
    path: "/mro/customers/{id}/rebate-agreements"
    description: "List rebate agreements of a customer"
    roles: [DistributionAdmin, CustomerBuyer, CustomerApprover, BranchManager, VendorRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "RebateAgreement[]"
    side_effects: []
  - method: GET
    path: "/mro/customers/{id}/carts"
    description: "List requisition carts of a customer"
    roles: [DistributionAdmin, CustomerBuyer, CustomerApprover, BranchManager, VendorRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "RequisitionCart[]"
    side_effects: []

  # --- Item ---
  - method: POST
    path: "/mro/items"
    description: "Create a catalog item"
    roles: [DistributionAdmin]
    code: 201
    input: [sku, description, item_class, "hazmat_restriction?", "restricted_states?", list_price_cents, "drop_ship_eligible?", "vendor_cost_estimate_cents?", "vendor_freight_estimate_cents?"]
    output: Item
    side_effects: []
  - method: GET
    path: "/mro/items/{id}"
    description: "Get an item"
    roles: [DistributionAdmin, CustomerBuyer, CustomerApprover, BranchManager, VendorRep]
    code: 200
    input: []
    output: Item
    side_effects: []
  - method: GET
    path: "/mro/items/{id}/stock-balances"
    description: "List stock balances of an item across locations"
    roles: [DistributionAdmin, CustomerBuyer, CustomerApprover, BranchManager, VendorRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "StockBalance[]"
    side_effects: []
  - method: GET
    path: "/mro/items/{id}/order-lines"
    description: "List order lines referencing an item"
    roles: [DistributionAdmin, CustomerBuyer, CustomerApprover, BranchManager, VendorRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "OrderLine[]"
    side_effects: []

  # --- PriceMatrixRule ---
  - method: POST
    path: "/mro/price-rules"
    description: "Create a contract price-matrix rule (DRAFT)"
    roles: [DistributionAdmin]
    code: 201
    input: [customer_tier, "item_id?", "item_class?", rule_type, "contract_unit_price_cents?", "discount_pct?", effective_from, effective_to]
    output: PriceMatrixRule
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/mro/price-rules"
    description: "List price rules with filters"
    roles: [DistributionAdmin, CustomerBuyer, CustomerApprover, BranchManager, VendorRep]
    code: 200
    input: ["limit?", "offset?", "customer_tier?", "item_id?", "item_class?", "status?"]
    output: "PriceMatrixRule[]"
    side_effects: []
  - method: GET
    path: "/mro/price-rules/{id}"
    description: "Get a price rule"
    roles: [DistributionAdmin, CustomerBuyer, CustomerApprover, BranchManager, VendorRep]
    code: 200
    input: []
    output: PriceMatrixRule
    side_effects: []
  - method: PUT
    path: "/mro/price-rules/{id}"
    description: "Update a price rule's value or window; OCC-guarded; window change on an ACTIVE rule re-runs the overlap check"
    roles: [DistributionAdmin]
    code: 200
    input: ["rule_type?", "contract_unit_price_cents?", "discount_pct?", "effective_from?", "effective_to?", expected_price_rule_version]
    output: PriceMatrixRule
    side_effects: ["increments PriceMatrixRule.version by 1"]
  - method: POST
    path: "/mro/price-rules/{id}/activate"
    description: "Activate a DRAFT price rule (fires the half-open window overlap gate)"
    roles: [DistributionAdmin]
    code: 200
    input: []
    output: PriceMatrixRule
    side_effects: ["status DRAFT -> ACTIVE"]

  # --- RebateAgreement ---
  - method: POST
    path: "/mro/customers/{id}/rebate-agreements"
    description: "Create a rebate agreement (DRAFT) for a national-account customer; closed-interval overlap gate"
    roles: [DistributionAdmin]
    code: 201
    input: [period_start, period_end, tiers]
    output: RebateAgreement
    side_effects: ["status = DRAFT", "accrued_spend_cents = 0", "current_tier_index = 0", "provisional_rebate_cents = 0"]
  - method: GET
    path: "/mro/rebate-agreements/{id}"
    description: "Get a rebate agreement"
    roles: [DistributionAdmin, CustomerBuyer, CustomerApprover, BranchManager, VendorRep]
    code: 200
    input: []
    output: RebateAgreement
    side_effects: []
  - method: POST
    path: "/mro/rebate-agreements/{id}/activate"
    description: "Activate a DRAFT agreement (clock date must be <= period_end)"
    roles: [DistributionAdmin]
    code: 200
    input: []
    output: RebateAgreement
    side_effects: ["status DRAFT -> ACTIVE"]
  - method: POST
    path: "/mro/rebate-agreements/{id}/close"
    description: "Close an ACTIVE agreement after period end; computes final marginal rebate and true-up delta"
    roles: [DistributionAdmin]
    code: 200
    input: []
    output: RebateAgreement
    side_effects: ["status ACTIVE -> CLOSED", "computes final_rebate_cents and true_up_delta_cents"]
  - method: POST
    path: "/mro/rebate-agreements/{id}/settle"
    description: "Settle a CLOSED agreement; issues the credit"
    roles: [DistributionAdmin]
    code: 200
    input: []
    output: RebateAgreement
    side_effects: ["status CLOSED -> SETTLED", "settled_credit_cents = final_rebate_cents"]

  # --- StockLocation / StockBalance ---
  - method: POST
    path: "/mro/locations"
    description: "Create a branch or central DC"
    roles: [DistributionAdmin]
    code: 201
    input: [location_code, location_type, region_state, "same_day_cutoff_minute?"]
    output: StockLocation
    side_effects: []
  - method: GET
    path: "/mro/locations/{id}"
    description: "Get a location"
    roles: [DistributionAdmin, CustomerBuyer, CustomerApprover, BranchManager, VendorRep]
    code: 200
    input: []
    output: StockLocation
    side_effects: []
  - method: POST
    path: "/mro/locations/{id}/restock"
    description: "Add on-hand stock of an item at a location (creates the StockBalance lazily); triggers the backorder auto-fill chain"
    roles: [DistributionAdmin]
    code: 200
    input: [item_id, qty]
    output: StockBalance
    side_effects: ["on_hand_qty += qty", "backorder auto-fill chain (links 2-3 of order cancel) runs for the freed availability"]
  - method: GET
    path: "/mro/locations/{id}/stock-balances"
    description: "List stock balances at a location"
    roles: [DistributionAdmin, CustomerBuyer, CustomerApprover, BranchManager, VendorRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "StockBalance[]"
    side_effects: []

  # --- RequisitionCart (punch-out) ---
  - method: POST
    path: "/mro/carts"
    description: "Create a requisition cart (punch-out return); buyer must belong to customer_id"
    roles: [CustomerBuyer]
    code: 201
    input: [customer_id, lines, "punch_out_external_ref?"]
    output: RequisitionCart
    side_effects: ["status = OPEN"]
  - method: GET
    path: "/mro/carts/{id}"
    description: "Get a cart"
    roles: [DistributionAdmin, CustomerBuyer, CustomerApprover, BranchManager, VendorRep]
    code: 200
    input: []
    output: RequisitionCart
    side_effects: []
  - method: PUT
    path: "/mro/carts/{id}"
    description: "Revise cart lines; allowed in OPEN, and from REJECTED it reopens the cart (REJECTED -> OPEN)"
    roles: [CustomerBuyer]
    code: 200
    input: [lines]
    output: RequisitionCart
    side_effects: ["lines replaced", "REJECTED -> OPEN when revising a rejected cart"]
  - method: POST
    path: "/mro/carts/{id}/submit"
    description: "Submit a cart; recomputes the estimate; forks to PENDING_APPROVAL or auto-APPROVED by the customer's approval threshold"
    roles: [CustomerBuyer]
    code: 200
    input: []
    output: RequisitionCart
    side_effects: ["estimated_total_cents recomputed", "OPEN -> PENDING_APPROVAL | APPROVED"]
  - method: POST
    path: "/mro/carts/{id}/approve"
    description: "Approve a PENDING_APPROVAL cart"
    roles: [CustomerApprover]
    code: 200
    input: []
    output: RequisitionCart
    side_effects: ["PENDING_APPROVAL -> APPROVED"]
  - method: POST
    path: "/mro/carts/{id}/reject"
    description: "Reject a PENDING_APPROVAL cart with a reason"
    roles: [CustomerApprover]
    code: 200
    input: [reason]
    output: RequisitionCart
    side_effects: ["PENDING_APPROVAL -> REJECTED", "rejection_reason stored"]

  # --- SalesOrder ---
  - method: POST
    path: "/mro/orders"
    description: "Create an order directly (lines) or from an APPROVED cart (source_cart_id); exactly one of lines/source_cart_id; pricing snapshotted at creation"
    roles: [CustomerBuyer, DistributionAdmin]
    code: 201
    input: [customer_id, fulfillment_branch_id, fulfillment_method, "lines?", "source_cart_id?"]
    output: SalesOrder
    side_effects: ["line unit prices + totals computed (order_line_unit_price, order_total_pricing)", "status = SUBMITTED", "fulfillment_status = UNALLOCATED", "source cart (if any) -> CONVERTED", "OrderLines created"]
  - method: GET
    path: "/mro/orders"
    description: "List orders with filters"
    roles: [DistributionAdmin, CustomerBuyer, CustomerApprover, BranchManager, VendorRep]
    code: 200
    input: ["limit?", "offset?", "customer_id?", "fulfillment_branch_id?", "source_cart_id?", "status?"]
    output: "SalesOrder[]"
    side_effects: []
  - method: GET
    path: "/mro/orders/{id}"
    description: "Get an order"
    roles: [DistributionAdmin, CustomerBuyer, CustomerApprover, BranchManager, VendorRep]
    code: 200
    input: []
    output: SalesOrder
    side_effects: []
  - method: POST
    path: "/mro/orders/{id}/confirm"
    description: "Confirm a SUBMITTED order: runs hazmat + credit gates, the allocation waterfall, promise date, and provisional drop-ship margins"
    roles: [DistributionAdmin]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["status SUBMITTED -> CONFIRMED", "allocation_waterfall per line", "fulfillment_status ALLOCATED | PARTIALLY_ALLOCATED", "promise_date computed", "open_credit_exposure_cents += total_cents"]
  - method: POST
    path: "/mro/orders/{id}/cancel"
    description: "Cancel a SUBMITTED or CONFIRMED order; CONFIRMED cancels release reservations and trigger the backorder auto-fill chain"
    roles: [CustomerBuyer, DistributionAdmin]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["status -> CANCELLED", "reservation release + backorder auto-fill chain (links 1-4)"]
  - method: POST
    path: "/mro/orders/{id}/mark-ready"
    description: "Branch marks a confirmed order ready: READY_FOR_WILL_CALL (WILL_CALL) or SHIPPED (SAME_DAY/STANDARD); computes sla_breach"
    roles: [BranchManager]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["fulfillment_status -> READY_FOR_WILL_CALL | SHIPPED", "sla_breach computed"]
  - method: POST
    path: "/mro/orders/{id}/mark-fulfilled"
    description: "Mark a ready/shipped order fulfilled; requires all drop-ship quantities vendor-confirmed; decrements on-hand and releases reservations"
    roles: [BranchManager]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["fulfillment_status -> FULFILLED", "on_hand_qty/reserved_qty decremented per allocation", "fulfilled_at = clock"]
  - method: POST
    path: "/mro/orders/{id}/vendor-confirm"
    description: "Vendor confirms drop-ship lines with actual unit costs and freight; actual_costs must cover exactly the order's unconfirmed drop-ship lines"
    roles: [VendorRep]
    code: 200
    input: [actual_costs]
    output: SalesOrder
    side_effects: ["qty_vendor_confirmed = qty_drop_ship per listed line", "final_margin_cents computed; margin_status -> FINALIZED"]
  - method: POST
    path: "/mro/orders/{id}/complete"
    description: "Complete a fulfilled order; runs the spend-accrual cascade into customer and rebate agreement"
    roles: [DistributionAdmin]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["status -> COMPLETED", "accrual cascade (links 1-4)"]
  - method: GET
    path: "/mro/orders/{id}/lines"
    description: "List an order's lines in creation order"
    roles: [DistributionAdmin, CustomerBuyer, CustomerApprover, BranchManager, VendorRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "OrderLine[]"
    side_effects: []
  - method: GET
    path: "/mro/orders/{id}/returns"
    description: "List return authorizations against an order"
    roles: [DistributionAdmin, CustomerBuyer, CustomerApprover, BranchManager, VendorRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "ReturnAuthorization[]"
    side_effects: []

  # --- ReturnAuthorization ---
  - method: POST
    path: "/mro/returns"
    description: "Request a return against a fulfilled/completed order; enforces per-class window and returnability"
    roles: [CustomerBuyer, DistributionAdmin]
    code: 201
    input: [order_id, lines]
    output: ReturnAuthorization
    side_effects: ["status = REQUESTED"]
  - method: GET
    path: "/mro/returns/{id}"
    description: "Get a return authorization"
    roles: [DistributionAdmin, CustomerBuyer, CustomerApprover, BranchManager, VendorRep]
    code: 200
    input: []
    output: ReturnAuthorization
    side_effects: []
  - method: POST
    path: "/mro/returns/{id}/approve"
    description: "Approve a REQUESTED return"
    roles: [DistributionAdmin]
    code: 200
    input: []
    output: ReturnAuthorization
    side_effects: ["REQUESTED -> APPROVED"]
  - method: POST
    path: "/mro/returns/{id}/reject"
    description: "Reject a REQUESTED return with a reason"
    roles: [DistributionAdmin]
    code: 200
    input: [reason]
    output: ReturnAuthorization
    side_effects: ["REQUESTED -> REJECTED", "rejection_reason stored"]
  - method: POST
    path: "/mro/returns/{id}/receive"
    description: "Receive an approved return at the branch; restocks RESALEABLE STOCKED lines and triggers the backorder auto-fill chain"
    roles: [BranchManager]
    code: 200
    input: []
    output: ReturnAuthorization
    side_effects: ["APPROVED -> RECEIVED", "restock + backorder auto-fill chain"]
  - method: POST
    path: "/mro/returns/{id}/credit"
    description: "Credit a received return; computes the per-line-rounded credit and decrements spend accruals"
    roles: [DistributionAdmin]
    code: 200
    input: []
    output: ReturnAuthorization
    side_effects: ["RECEIVED -> CREDITED", "credit_cents + restocking_fee_cents computed", "spend decrement cascade (links 1-3)"]

  # --- Test-driving logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock. Before any set call the clock reads exactly 2026-08-01T00:00:00Z (server startup default) and MUST NOT fall back to wall-clock time. All date/minute comparisons (price windows, rebate periods, promise cutoff, return windows) read this clock."
    roles: [DistributionAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock set"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not a declared role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Caller role is not permitted on this endpoint" }
  - { id: ERR_CUSTOMER_SCOPE_MISMATCH, http: 403, condition: "Entity-backed role (buyer/approver) touches a resource owned by a different customer account" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Customer id does not exist" }
  - { id: ERR_ITEM_NOT_FOUND, http: 404, condition: "Item id does not exist" }
  - { id: ERR_PRICE_RULE_NOT_FOUND, http: 404, condition: "Price rule id does not exist" }
  - { id: ERR_REBATE_AGREEMENT_NOT_FOUND, http: 404, condition: "Rebate agreement id does not exist" }
  - { id: ERR_LOCATION_NOT_FOUND, http: 404, condition: "Location id does not exist" }
  - { id: ERR_CART_NOT_FOUND, http: 404, condition: "Cart id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "Order id does not exist" }
  - { id: ERR_RETURN_NOT_FOUND, http: 404, condition: "Return id does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Request shape violation: missing required field, invalid enum, qty < 1, inverted window/period, malformed tiers, item_id/item_class both or neither, lines/source_cart_id both or neither, BRANCH without same_day_cutoff_minute or CENTRAL with one" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Target resource is not in a from-state of the requested transition (e.g., approve an OPEN cart, cancel a COMPLETED order, double-confirm, convert a non-APPROVED cart, decision on a non-REQUESTED return)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_*_version does not match the parent's current version on a PUT endpoint" }
  - { id: ERR_CUSTOMER_NOT_ACTIVE, http: 409, condition: "Order confirm requires CustomerAccount.status == ACTIVE (CREDIT_HOLD blocks)" }
  - { id: ERR_ORDER_NOT_FULFILLED, http: 409, condition: "Order complete requires fulfillment_status == FULFILLED" }
  - { id: ERR_ORDER_NOT_RETURNABLE, http: 409, condition: "Return create requires the order to be COMPLETED, or CONFIRMED with fulfillment_status == FULFILLED" }
  - { id: ERR_DROP_SHIP_UNCONFIRMED, http: 409, condition: "mark-fulfilled while a line has qty_drop_ship > qty_vendor_confirmed" }
  - { id: ERR_HAZMAT_METHOD_RESTRICTED, http: 422, condition: "Confirm with a WILL_CALL_ONLY item on a delivery method, or a GROUND_ONLY item on SAME_DAY" }
  - { id: ERR_HAZMAT_REGION_RESTRICTED, http: 422, condition: "Confirm delivering an item whose restricted_states contains the customer's primary_ship_to_state (WILL_CALL exempt)" }
  - { id: ERR_AGREEMENT_PERIOD_EXPIRED, http: 409, condition: "Rebate activate when the logical-clock date is after period_end" }
  - { id: ERR_AGREEMENT_PERIOD_NOT_ENDED, http: 409, condition: "Rebate close when the logical-clock date is on or before period_end" }
  - { id: ERR_RETURN_WINDOW_EXPIRED, http: 422, condition: "Return created after fulfilled_at date + item-class window (60d STOCKED / 30d SPECIAL_ORDER)" }
  - { id: ERR_SKU_ALREADY_EXISTS, http: 409, condition: "Item sku already exists" }
  - { id: ERR_ACCOUNT_NUMBER_EXISTS, http: 409, condition: "Customer account_number already exists" }
  - { id: ERR_LOCATION_CODE_EXISTS, http: 409, condition: "Location code already exists" }
  - { id: ERR_PRICE_RULE_WINDOW_OVERLAP, http: 409, condition: "Activating (or window-editing an ACTIVE) price rule whose half-open [effective_from, effective_to) overlaps another ACTIVE rule with the same scope key; adjacency (from == other.to) is allowed" }
  - { id: ERR_AGREEMENT_WINDOW_OVERLAP, http: 409, condition: "Creating a rebate agreement whose closed [period_start, period_end] shares any day with another agreement of the same customer; start == other.period_end is an overlap, start == other.period_end + 1 day is allowed" }
  - { id: ERR_CUSTOMER_NOT_NATIONAL_ACCOUNT, http: 422, condition: "Rebate agreement created for a customer with is_national_account == false" }
  - { id: ERR_ITEM_NOT_RETURNABLE, http: 422, condition: "Return includes a line whose item_class is NON_RETURNABLE" }
  - { id: ERR_BRANCH_TYPE_REQUIRED, http: 422, condition: "fulfillment_branch_id references a CENTRAL location" }
  - { id: ERR_RETURN_LINE_INVALID, http: 422, condition: "Return line references an order line of another order, or cumulative returned qty (over non-rejected returns) would exceed the line's qty" }
  - { id: ERR_VENDOR_LINES_MISMATCH, http: 422, condition: "vendor-confirm actual_costs does not cover exactly the order's unconfirmed drop-ship lines" }
  - { id: ERR_CART_CUSTOMER_MISMATCH, http: 422, condition: "Order create with source_cart_id whose cart.customer_id differs from the request customer_id" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Confirm would push open_credit_exposure_cents + total_cents above credit_limit_cents" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: DistributionAdmin
    description: "Distributor-side operator: catalog, price matrix, rebate lifecycle, locations/stock, order confirm/complete, return decisions and credits"
    identity: opaque
    exclusive_operations:
      - "POST /mro/customers, PUT /mro/customers/{id}"
      - "POST /mro/items"
      - "POST /mro/price-rules, PUT /mro/price-rules/{id}, POST /mro/price-rules/{id}/activate"
      - "POST /mro/customers/{id}/rebate-agreements, activate/close/settle"
      - "POST /mro/locations, POST /mro/locations/{id}/restock"
      - "POST /mro/orders/{id}/confirm, POST /mro/orders/{id}/complete"
      - "POST /mro/returns/{id}/approve, reject, credit"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /mro/orders, POST /mro/orders/{id}/cancel, POST /mro/returns"
      - "All GET endpoints"
  - name: CustomerBuyer
    description: "Buyer at a customer account (punch-out user); owns carts and may order/return for their own account"
    identity: "entity_backed:CustomerAccount"
    exclusive_operations:
      - "POST /mro/carts, PUT /mro/carts/{id}, POST /mro/carts/{id}/submit"
    shared_operations:
      - "POST /mro/orders, POST /mro/orders/{id}/cancel, POST /mro/returns (own account only)"
      - "All GET endpoints (scoped to own account)"
  - name: CustomerApprover
    description: "Approver at a customer account; decides carts that exceed the account's approval threshold"
    identity: "entity_backed:CustomerAccount"
    exclusive_operations:
      - "POST /mro/carts/{id}/approve, POST /mro/carts/{id}/reject"
    shared_operations:
      - "All GET endpoints (scoped to own account)"
  - name: BranchManager
    description: "Branch fulfillment operator: readiness, fulfillment, and physical return receipt"
    identity: opaque
    exclusive_operations:
      - "POST /mro/orders/{id}/mark-ready, POST /mro/orders/{id}/mark-fulfilled"
      - "POST /mro/returns/{id}/receive"
    shared_operations:
      - "All GET endpoints"
  - name: VendorRep
    description: "Drop-ship vendor representative; confirms drop-ship quantities with actual costs"
    identity: opaque
    exclusive_operations:
      - "POST /mro/orders/{id}/vendor-confirm"
    shared_operations:
      - "All GET endpoints"
