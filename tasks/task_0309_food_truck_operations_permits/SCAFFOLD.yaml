# =============================================================================
# Food Truck Operations & Permits — benchmark seed tables (v1)
# Difficulty target: Expert
# =============================================================================

scenario: |
  309. Food Truck Operations & Permits: location/event schedule & booking,
  commissary & health-permit tracking, menu & par/prep, POS & cashless,
  spot/route reservation fee, staff shift, propane/generator log,
  sales-by-event reporting

domain_name: food-truck-operations
api_prefix: ""

# Structural DNA of this benchmark. The core coupling is a posture-driven
# operability gate (OperatorTruck.operability is derived from permit validity,
# commissary linkage, propane/generator safety state, and active staffing) that
# gates every revenue-bearing child operation (booking arrival, order capture),
# layered on top of two temporal-overlap resources (Spot occupancy and Staff
# shift) and a dual-variant order-pricing engine (live POS estimate vs.
# settlement reconciliation).
complexity_profile:
  primary_archetype: posture_driven_gating
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency        # OCC on OperatorTruck.version for booking-create supersede race
    - cascading_side_effects        # permit expiry / commissary suspension cascade to truck -> bookings -> orders
    - dual_variant_calculation      # Order live total (estimate) vs settled total (reconciliation)
    - derived_field_reconciliation  # operability + reservation_fee_balance + par depletion stay consistent

  entity_topology: flat
  # All entities are peer top-level collections linked by foreign keys; nothing is
  # nested in the URL. OperatorTruck is the conceptual aggregate root (its
  # operability gates child ops) but children (MenuItem, PrepBatch, Order,
  # StaffShift, UtilityLog) reference it by FK rather than nesting under it.
  # Booking is a junction binding Truck x Spot x Event by FK.

  state_machine_shape: posture_driven
  # OperatorTruck.operability (OPERABLE / RESTRICTED / GROUNDED) is a derived
  # aggregate that gates child operations; Order carries parallel dimensions
  # (lifecycle_status x payment_status); Booking has a branching reservation
  # cycle (RESERVED -> ARRIVED -> DEPARTED with a NO_SHOW / CANCELLED branch).

  relationship_patterns:
    - one_to_many        # Truck -> MenuItem, PrepBatch, Order, StaffShift, UtilityLog
    - many_to_many       # Booking binds Truck x Spot x Event
    - cross_aggregate    # Truck -> HealthPermit, Truck -> Commissary, Booking -> Spot/Event

  role_model: peer_roles
  # OperatorTruck (owns its truck's menu/prep/orders/shifts), Dispatcher (owns
  # spots, events, bookings, commissary linkage), HealthInspector (owns permit
  # lifecycle), PlatformAdmin (operational superset for seeding/clock/utility).

  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Commissary
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Commissary kitchen facility name" }
      - { name: state_code, type: string, source: input, description: "US two-letter state code where the commissary is licensed" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED. A SUSPENDED commissary cannot back an operable truck", constraints: "one of {ACTIVE, SUSPENDED}" }
      - { name: docked_truck_count, type: integer, source: computed, description: "Read-only: count of OperatorTrucks whose commissary_id == this.id and whose operability != GROUNDED" }

  - name: HealthPermit
    parent: null
    common_fields: true
    fields:
      - { name: truck_id, type: string, source: input, description: "FK -> OperatorTruck.id; the truck this permit certifies. At most one ACTIVE permit per truck" }
      - { name: permit_number, type: string, source: input, description: "Externally issued permit identifier" }
      - { name: state_code, type: string, source: input, description: "US two-letter state code that issued the permit" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | EXPIRED | REVOKED. Set ACTIVE on issue, EXPIRED by clock sweep, REVOKED by inspector", constraints: "one of {ACTIVE, EXPIRED, REVOKED}" }
      - { name: issued_at, type: datetime, source: input, description: "ISO 8601 UTC instant the permit became valid" }
      - { name: expires_at, type: datetime, source: input, description: "ISO 8601 UTC instant the permit lapses; at-or-after this instant the permit is EXPIRED" }

  - name: OperatorTruck
    parent: null
    common_fields: true
    fields:
      - { name: commissary_id, type: string, source: input, description: "FK -> Commissary.id; the commissary this truck is docked to" }
      - { name: name, type: string, source: input, description: "Truck display name" }
      - { name: home_state_code, type: string, source: input, description: "US two-letter state code the truck is registered in" }
      - { name: operability, type: enum, source: computed, default: "GROUNDED", description: "Read-only derived posture gating child ops: OPERABLE | RESTRICTED | GROUNDED. Recomputed on every condition change; see operability_posture", constraints: "one of {OPERABLE, RESTRICTED, GROUNDED}" }
      - { name: propane_psi, type: number, source: computed, default: 0, description: "Read-only: latest UtilityLog.propane_psi_after for this truck, 0 if no PROPANE log", constraints: ">= 0" }
      - { name: generator_runtime_hours, type: number, source: computed, default: 0, description: "Read-only: cumulative sum of UtilityLog.generator_delta_hours for this truck", constraints: ">= 0" }
      - { name: reservation_fee_balance_cents, type: integer, source: computed, default: 0, description: "Read-only: sum of reservation_fee_cents over this truck's Bookings in {RESERVED, ARRIVED, DEPARTED, NO_SHOW} minus refunds; see reservation_fee_balance", constraints: ">= 0" }
      - { name: gross_sales_cents, type: integer, source: computed, default: 0, description: "Read-only: sum of settled_total_cents over this truck's SETTLED Orders" }

  - name: MenuItem
    parent: null
    common_fields: true
    fields:
      - { name: truck_id, type: string, source: input, description: "FK -> OperatorTruck.id; owning truck" }
      - { name: sku, type: string, source: input, description: "Per-truck unique stock keeping unit code" }
      - { name: name, type: string, source: input, description: "Menu item display name" }
      - { name: unit_price_cents, type: integer, source: input, description: "List price per unit in cents", constraints: ">= 0" }
      - { name: par_units, type: integer, source: input, description: "Target on-hand prepared units (the 'par level') the truck wants stocked", constraints: ">= 0" }
      - { name: prepared_units, type: integer, source: computed, default: 0, description: "Read-only: sum of units_made over OPEN PrepBatches of this item minus units consumed by SETTLED orders; see prepared_units_ledger", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: "AVAILABLE", description: "AVAILABLE | UNLISTED. UNLISTED items cannot be ordered", constraints: "one of {AVAILABLE, UNLISTED}" }

  - name: PrepBatch
    parent: null
    common_fields: true
    fields:
      - { name: truck_id, type: string, source: input, description: "FK -> OperatorTruck.id; owning truck" }
      - { name: menu_item_id, type: string, source: input, description: "FK -> MenuItem.id; the item this batch prepares" }
      - { name: units_made, type: integer, source: input, description: "Units produced in this prep batch", constraints: ">= 1" }
      - { name: prepped_at, type: datetime, source: system, description: "ISO 8601 UTC instant the batch was logged (server clock)" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | DISCARDED. DISCARDED batches no longer count toward prepared_units", constraints: "one of {OPEN, DISCARDED}" }

  - name: Spot
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Vending spot / route stop name" }
      - { name: state_code, type: string, source: input, description: "US two-letter state code the spot is located in" }
      - { name: concurrent_capacity, type: integer, source: input, description: "Maximum number of trucks that may hold overlapping bookings on this spot at once", constraints: ">= 1" }
      - { name: buffer_minutes, type: integer, source: input, default: 0, description: "Teardown/setup buffer in minutes appended to BOTH ends of each booking window for overlap math on this spot", constraints: ">= 0" }
      - { name: reservation_fee_cents, type: integer, source: input, description: "Flat reservation fee in cents charged when a truck books this spot", constraints: ">= 0" }

  - name: Event
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Event / market name (e.g., Saturday Night Market)" }
      - { name: starts_at, type: datetime, source: input, description: "ISO 8601 UTC event window start (inclusive)" }
      - { name: ends_at, type: datetime, source: input, description: "ISO 8601 UTC event window end (exclusive)" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | CANCELLED. CANCELLED event cascades to its bookings", constraints: "one of {SCHEDULED, CANCELLED}" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: truck_id, type: string, source: input, description: "FK -> OperatorTruck.id; the booking truck" }
      - { name: spot_id, type: string, source: input, description: "FK -> Spot.id; the reserved spot" }
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; the event the booking is for" }
      - { name: window_start, type: datetime, source: input, description: "ISO 8601 UTC requested occupancy start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "ISO 8601 UTC requested occupancy end (exclusive)" }
      - { name: status, type: enum, source: system, default: "RESERVED", description: "RESERVED | ARRIVED | DEPARTED | NO_SHOW | CANCELLED; see Booking state machine", constraints: "one of {RESERVED, ARRIVED, DEPARTED, NO_SHOW, CANCELLED}" }
      - { name: reservation_fee_cents, type: integer, source: computed, description: "Read-only: snapshot of Spot.reservation_fee_cents at reservation time", constraints: ">= 0" }
      - { name: fee_refunded_cents, type: integer, source: computed, default: 0, description: "Read-only: amount of reservation_fee_cents refunded on cancellation; see reservation_fee_balance", constraints: ">= 0" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: truck_id, type: string, source: system, description: "FK -> OperatorTruck.id; owning truck (copied from the booking's truck on create)" }
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the ARRIVED booking the order is captured under" }
      - { name: lifecycle_status, type: enum, source: system, default: "OPEN", description: "OPEN | SETTLED | VOID (independent of payment_status); see Order state machine", constraints: "one of {OPEN, SETTLED, VOID}" }
      - { name: payment_status, type: enum, source: system, default: "UNPAID", description: "UNPAID | AUTHORIZED | CAPTURED | REFUNDED (cashless dimension, evolves independently of lifecycle_status)", constraints: "one of {UNPAID, AUTHORIZED, CAPTURED, REFUNDED}" }
      - { name: tip_cents, type: integer, source: input, default: 0, description: "Customer tip in cents added at capture", constraints: ">= 0" }
      - { name: discount_code, type: enum, source: input, default: "NONE", description: "NONE | HAPPY_HOUR | BULK10. Promotional code applied at settlement", constraints: "one of {NONE, HAPPY_HOUR, BULK10}" }
      - { name: live_total_cents, type: integer, source: computed, default: 0, description: "Read-only: provisional total recomputed on every line change while OPEN; see order_live_total", constraints: ">= 0" }
      - { name: settled_total_cents, type: integer, source: computed, description: "Read-only: final reconciled total pinned at settlement; see order_settled_total", constraints: ">= 0" }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; owning order" }
      - { name: menu_item_id, type: string, source: input, description: "FK -> MenuItem.id; the item sold on this line" }
      - { name: quantity, type: integer, source: input, description: "Units sold on this line", constraints: ">= 1" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Read-only: snapshot of MenuItem.unit_price_cents at the time the line was added", constraints: ">= 0" }
      - { name: line_subtotal_cents, type: integer, source: computed, description: "Read-only: quantity * unit_price_cents", constraints: ">= 0" }

  - name: StaffShift
    parent: null
    common_fields: true
    fields:
      - { name: truck_id, type: string, source: input, description: "FK -> OperatorTruck.id; owning truck" }
      - { name: staff_name, type: string, source: input, description: "Worker identifier; overlap checks are per (truck_id, staff_name)" }
      - { name: role, type: enum, source: input, description: "DRIVER | COOK | CASHIER. A truck needs >= 1 active DRIVER and >= 1 active COOK shift covering now to be OPERABLE", constraints: "one of {DRIVER, COOK, CASHIER}" }
      - { name: shift_start, type: datetime, source: input, description: "ISO 8601 UTC shift start (inclusive)" }
      - { name: shift_end, type: datetime, source: input, description: "ISO 8601 UTC shift end (exclusive)" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | CANCELLED. A shift covers the current clock when SCHEDULED and shift_start <= now < shift_end", constraints: "one of {SCHEDULED, CANCELLED}" }

  - name: UtilityLog
    parent: null
    common_fields: false  # append-only event; id + created_at only
    fields:
      - { name: truck_id, type: string, source: input, description: "FK -> OperatorTruck.id; owning truck" }
      - { name: utility, type: enum, source: input, description: "PROPANE | GENERATOR. PROPANE entries set propane level; GENERATOR entries add runtime", constraints: "one of {PROPANE, GENERATOR}" }
      - { name: propane_psi_after, type: number, source: input, default: null, description: "For PROPANE entries: tank PSI after this fill/draw. Required for PROPANE, ignored for GENERATOR", constraints: ">= 0" }
      - { name: generator_delta_hours, type: number, source: input, default: null, description: "For GENERATOR entries: runtime hours added by this log. Required for GENERATOR, ignored for PROPANE", constraints: ">= 0" }
      - { name: logged_at, type: datetime, source: system, description: "ISO 8601 UTC instant the entry was recorded (server clock)" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: HealthPermit
    initial_state: ACTIVE
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock sweep via POST /_clock/set_current_utc advancing now to-or-past expires_at)"
        actor: system
        preconditions:
          - "Permit is ACTIVE and now >= expires_at"
        side_effects:
          - "Owning OperatorTruck.operability recomputed (loss of the only ACTIVE permit drives the truck toward GROUNDED) — see operability_posture"
          - "If that truck drops to GROUNDED, each of its RESERVED future Bookings (window_start > now) is CANCELLED with full fee refund (cascade) — see reservation_fee_balance"

      - from: ACTIVE
        to: REVOKED
        trigger: "POST /health-permits/{permitId}/revoke"
        actor: HealthInspector
        preconditions:
          - "Permit is ACTIVE (ERR_PERMIT_NOT_ACTIVE)"
        side_effects:
          - "Owning OperatorTruck.operability recomputed — see operability_posture"
          - "If that truck drops to GROUNDED, each of its RESERVED future Bookings (window_start > now) is CANCELLED with full fee refund (cascade) — see reservation_fee_balance"

  - entity: Commissary
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /commissaries/{commissaryId}/suspend"
        actor: Dispatcher
        preconditions:
          - "Commissary is ACTIVE (ERR_COMMISSARY_NOT_ACTIVE)"
        side_effects:
          - "Every OperatorTruck with commissary_id == this.id has operability recomputed; loss of an ACTIVE commissary forces those trucks to GROUNDED — see operability_posture"
          - "For each truck thereby GROUNDED, its RESERVED future Bookings are CANCELLED with full fee refund (transitive cascade) — see reservation_fee_balance"
          - "docked_truck_count recomputed"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /commissaries/{commissaryId}/reinstate"
        actor: Dispatcher
        preconditions:
          - "Commissary is SUSPENDED (ERR_COMMISSARY_NOT_SUSPENDED)"
        side_effects:
          - "Trucks docked here have operability recomputed (may rise from GROUNDED toward RESTRICTED/OPERABLE if other conditions hold) — see operability_posture"
          - "docked_truck_count recomputed"

  - entity: OperatorTruck
    initial_state: GROUNDED
    terminal_states: []
    note: "operability is a DERIVED posture, never set by a direct request. Every condition change (permit status, commissary status, staffing coverage, propane/generator thresholds, clock advance) recomputes it via operability_posture. Any recompute that writes the truck row (including a recompute that leaves operability unchanged but touches the truck, e.g. permit issue or a utility log) is a mutation and therefore increments OperatorTruck.version by 1 per the common-fields rule — this is what makes a previously-read version stale for the booking-create OCC check. The three values form an ordered ladder GROUNDED < RESTRICTED < OPERABLE."
    transitions:
      - from: GROUNDED
        to: RESTRICTED
        trigger: "system (operability_posture recompute: hard gates pass but a soft gate fails)"
        actor: system
        preconditions:
          - "Owning Commissary ACTIVE AND exactly one non-lapsed ACTIVE HealthPermit for the truck (hard gates)"
          - "At least one soft gate fails: propane_psi < MIN_OPERATING_PSI, OR no active DRIVER+COOK staffing covering now, OR generator_runtime_hours >= GENERATOR_SERVICE_HOURS"
        side_effects: []
      - from: RESTRICTED
        to: OPERABLE
        trigger: "system (operability_posture recompute: all hard and soft gates pass)"
        actor: system
        preconditions:
          - "All hard gates pass AND all soft gates pass — see operability_posture"
        side_effects: []
      - from: GROUNDED
        to: OPERABLE
        trigger: "system (operability_posture recompute: all gates pass directly from GROUNDED)"
        actor: system
        preconditions:
          - "All hard gates AND all soft gates pass — see operability_posture"
        side_effects: []
      - from: OPERABLE
        to: RESTRICTED
        trigger: "system (operability_posture recompute: a soft gate regresses)"
        actor: system
        preconditions:
          - "Hard gates still pass but a soft gate now fails"
        side_effects: []
      - from: OPERABLE
        to: GROUNDED
        trigger: "system (operability_posture recompute: a hard gate fails — permit lost/expired/revoked or commissary suspended)"
        actor: system
        preconditions:
          - "A hard gate fails"
        side_effects:
          - "Each RESERVED future Booking (window_start > now) for this truck is CANCELLED with full reservation-fee refund (cascade) — see reservation_fee_balance"
      - from: RESTRICTED
        to: GROUNDED
        trigger: "system (operability_posture recompute: a hard gate fails)"
        actor: system
        preconditions:
          - "A hard gate fails"
        side_effects:
          - "Each RESERVED future Booking (window_start > now) for this truck is CANCELLED with full reservation-fee refund (cascade) — see reservation_fee_balance"

  - entity: Event
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /events/{eventId}/cancel"
        actor: Dispatcher
        preconditions:
          - "Event is SCHEDULED (ERR_EVENT_NOT_SCHEDULED)"
        side_effects:
          - "Every Booking on this event in {RESERVED, ARRIVED} is CANCELLED; RESERVED bookings get a full fee refund, ARRIVED bookings get NO refund (truck already showed up) — see reservation_fee_balance"
          - "Any OPEN Order under a now-CANCELLED ARRIVED booking is VOIDed (transitive cascade) — see Order VOID"

  - entity: Booking
    initial_state: RESERVED
    terminal_states: [DEPARTED, NO_SHOW, CANCELLED]
    transitions:
      - from: RESERVED
        to: ARRIVED
        trigger: "POST /bookings/{bookingId}/arrive"
        actor: OperatorTruck
        preconditions:
          - "Booking is RESERVED (ERR_BOOKING_NOT_RESERVED)"
          - "Owning OperatorTruck.operability == OPERABLE (ERR_TRUCK_NOT_OPERABLE)"
          - "Parent Event is SCHEDULED (ERR_EVENT_NOT_SCHEDULED)"
          - "Current clock now is within [window_start, window_end) (ERR_OUTSIDE_BOOKING_WINDOW)"
        side_effects: []
      - from: ARRIVED
        to: DEPARTED
        trigger: "POST /bookings/{bookingId}/depart"
        actor: OperatorTruck
        preconditions:
          - "Booking is ARRIVED (ERR_BOOKING_NOT_ARRIVED)"
          - "No OPEN Order exists under this booking (ERR_OPEN_ORDERS_EXIST)"
        side_effects: []
      - from: RESERVED
        to: NO_SHOW
        trigger: "system (clock sweep: now advances to-or-past window_end while booking still RESERVED)"
        actor: system
        preconditions:
          - "Booking RESERVED and now >= window_end"
        side_effects:
          - "Reservation fee is forfeited (NOT refunded): fee_refunded_cents stays 0; truck.reservation_fee_balance_cents unchanged (NO_SHOW still counts in balance)"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /bookings/{bookingId}/cancel"
        actor: OperatorTruck
        preconditions:
          - "Booking is RESERVED (ERR_BOOKING_NOT_RESERVED)"
        side_effects:
          - "If now < window_start - CANCEL_CUTOFF_MINUTES: full fee refund (fee_refunded_cents = reservation_fee_cents). Otherwise late cancel: NO refund (fee_refunded_cents = 0) — see reservation_fee_balance"
      - from: RESERVED
        to: CANCELLED
        trigger: "system (cascade from Event cancel, truck GROUNDED, permit loss, or commissary suspend)"
        actor: system
        preconditions:
          - "Booking is RESERVED and window_start > now (future booking)"
        side_effects:
          - "Full fee refund (fee_refunded_cents = reservation_fee_cents) — see reservation_fee_balance"
      - from: ARRIVED
        to: CANCELLED
        trigger: "system (cascade from Event cancel only)"
        actor: system
        preconditions:
          - "Booking is ARRIVED and parent Event is being CANCELLED"
        side_effects:
          - "No refund (truck already arrived); any OPEN Orders under it are VOIDed (transitive cascade) — see Order VOID"

  - entity: Order
    initial_state: OPEN
    terminal_states: [SETTLED, VOID]
    note: "Two independent dimensions: lifecycle_status (OPEN -> SETTLED|VOID) and payment_status (UNPAID -> AUTHORIZED -> CAPTURED, plus CAPTURED -> REFUNDED). They evolve on separate triggers; a VOID order whose payment was CAPTURED refunds independently."
    transitions:
      - from: OPEN
        to: SETTLED
        trigger: "POST /orders/{orderId}/settle"
        actor: OperatorTruck
        preconditions:
          - "Order is OPEN (ERR_ORDER_NOT_OPEN)"
          - "Order has >= 1 OrderLine (ERR_EMPTY_ORDER)"
          - "payment_status == CAPTURED (ERR_PAYMENT_NOT_CAPTURED)"
          - "Settle must not drive any MenuItem.prepared_units below 0 (ERR_INSUFFICIENT_PREPARED_UNITS)"
        side_effects:
          - "settled_total_cents pinned via order_settled_total (applies discount_code + tip, per-line rounding order fixed)"
          - "Each OrderLine permanently consumes prepared_units of its MenuItem — see prepared_units_ledger"
          - "Owning truck.gross_sales_cents incremented by settled_total_cents"
      - from: OPEN
        to: VOID
        trigger: "POST /orders/{orderId}/void"
        actor: OperatorTruck
        preconditions:
          - "Order is OPEN (ERR_ORDER_NOT_OPEN)"
        side_effects:
          - "If payment_status == CAPTURED, payment_status -> REFUNDED (independent payment dimension)"
          - "No prepared_units are consumed (VOID orders never deplete par)"
      - from: OPEN
        to: VOID
        trigger: "system (cascade: parent Booking CANCELLED via Event cancel while order still OPEN)"
        actor: system
        preconditions:
          - "Order is OPEN and parent Booking transitions to CANCELLED"
        side_effects:
          - "If payment_status == CAPTURED, payment_status -> REFUNDED"
      - from: UNPAID
        to: AUTHORIZED
        trigger: "POST /orders/{orderId}/authorize-payment"
        actor: OperatorTruck
        preconditions:
          - "Order is OPEN (ERR_ORDER_NOT_OPEN)"
          - "payment_status == UNPAID (ERR_PAYMENT_NOT_UNPAID)"
          - "Order has >= 1 OrderLine (ERR_EMPTY_ORDER)"
        side_effects:
          - "payment_status -> AUTHORIZED (lifecycle_status unchanged)"
        note: "payment dimension transition"
      - from: AUTHORIZED
        to: CAPTURED
        trigger: "POST /orders/{orderId}/capture-payment"
        actor: OperatorTruck
        preconditions:
          - "payment_status == AUTHORIZED (ERR_PAYMENT_NOT_AUTHORIZED)"
        side_effects:
          - "tip_cents recorded onto the order; payment_status -> CAPTURED; live_total_cents refreshed to include tip"
        note: "payment dimension transition"
      - from: CAPTURED
        to: REFUNDED
        trigger: "system (cascade from Order VOID when payment was CAPTURED)"
        actor: system
        preconditions:
          - "payment_status == CAPTURED and lifecycle_status transitions to VOID"
        side_effects: []
        note: "payment dimension transition"

  - entity: StaffShift
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /staff-shifts/{shiftId}/cancel"
        actor: OperatorTruck
        preconditions:
          - "Shift is SCHEDULED (ERR_SHIFT_NOT_SCHEDULED)"
        side_effects:
          - "Owning truck.operability recomputed (may drop to RESTRICTED if this removed the last covering DRIVER or COOK) — see operability_posture"

  - entity: PrepBatch
    initial_state: OPEN
    terminal_states: [DISCARDED]
    transitions:
      - from: OPEN
        to: DISCARDED
        trigger: "POST /prep-batches/{batchId}/discard"
        actor: OperatorTruck
        preconditions:
          - "Batch is OPEN (ERR_BATCH_NOT_OPEN)"
          - "Discarding must not drive MenuItem.prepared_units below units already consumed by SETTLED orders (ERR_PREPARED_UNITS_NEGATIVE)"
        side_effects:
          - "MenuItem.prepared_units recomputed (this batch's units_made removed from the pool) — see prepared_units_ledger"

  - entity: MenuItem
    initial_state: AVAILABLE
    terminal_states: [UNLISTED]
    transitions:
      - from: AVAILABLE
        to: UNLISTED
        trigger: "POST /menu-items/{menuItemId}/unlist"
        actor: OperatorTruck
        preconditions:
          - "Item is AVAILABLE (ERR_MENU_ITEM_UNLISTED if already UNLISTED)"
        side_effects:
          - "status -> UNLISTED; subsequent POST /order-lines for this item are rejected (ERR_MENU_ITEM_UNLISTED). Existing lines/prepared_units are unaffected"

# -----------------------------------------------------------------------------
# Table 1.2.1: Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: booking-create-stale-truck
    parent_entity: OperatorTruck
    write_endpoint: "POST /bookings"
    occ_field: "expected_truck_version"
    description: |
      Creating a Booking carries the truck version the client last observed. A
      truck's version advances whenever a permit/commissary/staffing/utility
      change recomputes its operability or a cascade cancels one of its bookings.
      If the client's observed version is stale, the booking create is rejected:
      the client's view of whether the truck is even bookable (operability, fee
      balance) no longer reflects reality, so the reservation must be re-derived
      from a fresh read.
    error_id: ERR_STALE_TRUCK_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: operability_posture
    trigger: "any change to: HealthPermit.status, Commissary.status, StaffShift coverage, UtilityLog (propane/generator), or current clock advance"
    algorithm: constraint_propagation
    formula: |
      Evaluate gates for an OperatorTruck T at current clock `now`:
        HARD GATES (all must hold, else operability = GROUNDED):
          H1: Commissary(T.commissary_id).status == ACTIVE
          H2: exactly one HealthPermit with truck_id==T.id and status==ACTIVE,
              and that permit has now < expires_at (not lapsed)
        SOFT GATES (all must hold for OPERABLE; if hard pass but >=1 soft fails -> RESTRICTED):
          S1: T.propane_psi >= MIN_OPERATING_PSI
          S2: there is a SCHEDULED StaffShift with role==DRIVER covering now
              (shift_start <= now < shift_end) for T,
              AND a SCHEDULED StaffShift with role==COOK covering now for T
          S3: T.generator_runtime_hours < GENERATOR_SERVICE_HOURS
      Result ladder:
        if any HARD gate fails -> GROUNDED
        elif all SOFT gates pass -> OPERABLE
        else -> RESTRICTED
    input_set: "Single truck T; permits filtered to status==ACTIVE and now<expires_at; shifts filtered to status==SCHEDULED covering now; commissary by FK."
    constants:
      MIN_OPERATING_PSI: 20
      GENERATOR_SERVICE_HOURS: 100
    precision: "numeric >= / < comparison on PSI and hours thresholds"
    note: "A drop to GROUNDED cascades RESERVED future-booking cancellation with refund (see reservation_fee_balance). This posture gate is what all revenue ops depend on."

  - name: order_live_total
    trigger: "OrderLine added while Order OPEN; capture-payment (adds tip)"
    algorithm: aggregation
    formula: |
      live_subtotal = sum over the order's OrderLines of (quantity * unit_price_cents)  # snapshot prices
      live_total_cents = live_subtotal + tip_cents
      discount_code is NOT applied to the live total — it is the POS estimate
      shown before settlement. Discounts only enter at settlement.
    input_set: "All OrderLines of the order (lines are not independently cancellable, no status filter)."
    precision: "integer cents; inputs already integer cents, no rounding"
    note: "Provisional/estimate variant. Diverges from order_settled_total whenever discount_code != NONE (and otherwise equals it)."

  - name: order_settled_total
    trigger: "POST /orders/{orderId}/settle"
    algorithm: tiered_pricing
    formula: |
      Step 1 (per-line discount, ROUND PER LINE THEN SUM — order is pinned):
        for each OrderLine of the order:
          raw_line = quantity * unit_price_cents
          if discount_code == HAPPY_HOUR:
              disc_line = round_half_up(raw_line * (1 - HAPPY_HOUR_PCT))
          elif discount_code == BULK10 and quantity >= BULK10_MIN_QTY:
              disc_line = round_half_up(raw_line * (1 - BULK10_PCT))
          else:
              disc_line = raw_line
        discounted_subtotal = sum of disc_line over lines
      Step 2: settled_total_cents = discounted_subtotal + tip_cents
      The rounding order is FIXED: round each line AFTER its discount, THEN sum.
      Summing raw then discounting once would yield a different cent value; this
      benchmark pins per-line-then-sum.
    input_set: "All OrderLines of the order at settle time. BULK10 eligibility is per-line (line quantity >= BULK10_MIN_QTY), not on the order total."
    constants:
      HAPPY_HOUR_PCT: 0.15
      BULK10_PCT: 0.10
      BULK10_MIN_QTY: 10
    precision: "round_half_up to whole cents, applied per line item before summing"
    variants:
      - name: estimate
        when: "while OPEN (POS display via order_live_total)"
        difference: "ignores discount_code entirely"
      - name: final
        when: "at settle"
        difference: "applies the per-line discount with pinned per-line rounding"
    note: "Dual-variant against order_live_total: identical lines, different totals once a discount applies."

  - name: reservation_fee_balance
    trigger: "Booking create (debit), Booking cancel/cascade (conditional refund credit), NO_SHOW (no change), Event-cancel cascade"
    algorithm: aggregation
    formula: |
      For a truck T:
        reservation_fee_balance_cents =
          ( sum of reservation_fee_cents over T's Bookings whose status in
            {RESERVED, ARRIVED, DEPARTED, NO_SHOW} )
          MINUS
          ( sum of fee_refunded_cents over T's CANCELLED Bookings ).
      Refund determination on a per-booking cancel:
        - manual cancel, now < window_start - CANCEL_CUTOFF_MINUTES  -> fee_refunded_cents = reservation_fee_cents (full)
        - manual cancel, on/after cutoff                             -> fee_refunded_cents = 0
        - system cascade cancel of a RESERVED future booking         -> fee_refunded_cents = reservation_fee_cents (full)
        - Event-cancel of an ARRIVED booking                         -> CANCELLED, fee_refunded_cents = 0 (kept)
        - NO_SHOW                                                    -> stays in balance, fee_refunded_cents = 0 (forfeit)
    input_set: "Bookings of truck T filtered by status as above. A CANCELLED booking contributes only its fee_refunded_cents as a credit."
    constants:
      CANCEL_CUTOFF_MINUTES: 120
    precision: "integer cents"
    note: "Conserved quantity: across any create -> cancel(full-refund) pair the truck's reservation_fee_balance_cents returns to its pre-create value (net-zero). A late cancel or NO_SHOW deliberately forfeits the fee and is NOT net-zero."

  - name: prepared_units_ledger
    trigger: "PrepBatch create (credit), PrepBatch discard (debit), Order settle (consume), recompute on read"
    algorithm: aggregation
    formula: |
      For a MenuItem M:
        prepared_units =
          ( sum of units_made over OPEN PrepBatches with menu_item_id == M.id )
          MINUS
          ( sum of OrderLine.quantity over OrderLines whose menu_item_id == M.id
            and whose parent Order.lifecycle_status == SETTLED ).
      Invariant: prepared_units must never be negative. A settle that would drive
      it below 0 is rejected (ERR_INSUFFICIENT_PREPARED_UNITS); a discard that
      would drive it below 0 is rejected (ERR_PREPARED_UNITS_NEGATIVE).
    input_set: "PrepBatches filtered status==OPEN; consumption from OrderLines under SETTLED orders only (OPEN/VOID orders never consume)."
    precision: "integer units"
    note: "Conserved quantity: units_made_total(OPEN batches) - consumed_total(SETTLED) == prepared_units, always >= 0. Settling one order then voiding a different order leaves this invariant intact since VOID never consumes."

  - name: sales_by_event_report
    trigger: "GET /events/{eventId}/sales-report"
    algorithm: aggregation
    formula: |
      For an Event E, across all Bookings on E and the SETTLED Orders under those
      bookings:
        gross_sales_cents     = sum of Order.settled_total_cents over SETTLED orders
        order_count           = count of SETTLED Orders
        total_tips_cents      = sum of Order.tip_cents over those SETTLED Orders
        net_reservation_cents = sum over E's Bookings of
            (reservation_fee_cents - fee_refunded_cents) for bookings whose
            status in {ARRIVED, DEPARTED, NO_SHOW}   # fees actually kept
        truck_breakdown       = per truck_id: { truck_id, gross_sales_cents, order_count }
      truck_breakdown is sorted by gross_sales_cents DESC, tie-break by truck.created_at ASC.
    input_set: "SETTLED Orders whose booking_id resolves to a Booking on Event E; Bookings on E for the fee rollup."
    precision: "integer cents"
    note: "Pure read aggregation; tie-break uses created_at (never id)."

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role is one of the declared roles"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per the RBAC matrix; for entity_backed OperatorTruck writes, X-User-ID must equal the owning truck_id of the target resource"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all write endpoints

  - priority: 3
    category: existence
    check: "Every resource id in the path exists, validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path ids

  - priority: 4
    category: existence
    check: "Every FK in the request body references an existing resource (truck_id, spot_id, event_id, commissary_id, menu_item_id, booking_id, order_id)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all create endpoints with FK body fields

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enums in range, integers within declared constraints (quantity >= 1, units_made >= 1, concurrent_capacity >= 1), window_end > window_start, expires_at > issued_at, state_code two letters, PROPANE log carries propane_psi_after / GENERATOR log carries generator_delta_hours"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all create/transition endpoints with a body

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined (Booking RESERVED to arrive, Order OPEN to settle, Permit ACTIVE to revoke, etc.)"
    error_id: "varies (ERR_BOOKING_NOT_RESERVED, ERR_ORDER_NOT_OPEN, ERR_PERMIT_NOT_ACTIVE, ...)"
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 7
    category: state
    check: "Cross-entity state precondition: arriving a booking requires owning OperatorTruck.operability == OPERABLE; opening an order requires owning truck OPERABLE"
    error_id: ERR_TRUCK_NOT_OPERABLE
    http_status: 409
    applies_to: "POST /bookings/{bookingId}/arrive, POST /orders"

  - priority: 8
    category: state
    check: "Cross-entity state precondition: arriving a booking requires parent Event SCHEDULED; opening an order requires the parent Booking ARRIVED"
    error_id: "ERR_EVENT_NOT_SCHEDULED | ERR_BOOKING_NOT_ARRIVED"
    http_status: 409
    applies_to: "POST /bookings/{bookingId}/arrive, POST /orders"

  - priority: 9
    category: business_temporal
    check: "Arrive requires the current clock within [window_start, window_end)"
    error_id: ERR_OUTSIDE_BOOKING_WINDOW
    http_status: 409
    applies_to: "POST /bookings/{bookingId}/arrive"

  - priority: 10
    category: business_constraint
    check: "MenuItem on an order line must be AVAILABLE (not UNLISTED) and belong to the same truck as the order"
    error_id: ERR_MENU_ITEM_UNLISTED
    http_status: 409
    applies_to: "POST /order-lines"

  - priority: 11
    category: business_temporal
    check: "Spot temporal-overlap: a new RESERVED booking's [window_start, window_end) padded by Spot.buffer_minutes on BOTH ends must not push the count of concurrently-overlapping non-terminal bookings on that spot above Spot.concurrent_capacity (half-open intervals; touching endpoints with zero buffer do NOT overlap)"
    error_id: ERR_SPOT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /bookings"

  - priority: 12
    category: business_temporal
    check: "Staff shift overlap: a new SCHEDULED shift for (truck_id, staff_name) must not overlap any existing SCHEDULED shift for that worker on that truck (half-open [shift_start, shift_end); adjacency at a shared endpoint is allowed, no buffer)"
    error_id: ERR_SHIFT_OVERLAP
    http_status: 409
    applies_to: "POST /staff-shifts"

  - priority: 13
    category: business_constraint
    check: "Permit uniqueness: a truck may have at most one ACTIVE HealthPermit; issuing a second while one is ACTIVE is rejected"
    error_id: ERR_DUPLICATE_ACTIVE_PERMIT
    http_status: 409
    applies_to: "POST /health-permits"

  - priority: 14
    category: business_temporal
    check: "Booking window must fall within the parent Event's [starts_at, ends_at) window"
    error_id: ERR_BOOKING_OUTSIDE_EVENT
    http_status: 422
    applies_to: "POST /bookings"

  - priority: 15
    category: business_fiscal
    check: "Settling an order must not drive any MenuItem.prepared_units below 0 (sufficient prepared inventory for every line)"
    error_id: ERR_INSUFFICIENT_PREPARED_UNITS
    http_status: 409
    applies_to: "POST /orders/{orderId}/settle"

  - priority: 16
    category: business_referential
    check: "Optimistic concurrency: expected_truck_version on booking create must equal the truck's current version"
    error_id: ERR_STALE_TRUCK_VERSION
    http_status: 412
    applies_to: "POST /bookings"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Commissary ---
  - method: POST
    path: "/commissaries"
    description: "Create a commissary facility"
    roles: [Dispatcher, PlatformAdmin]
    code: 201
    input: [name, state_code]
    output: Commissary
    side_effects: ["status=ACTIVE, docked_truck_count=0"]

  - method: GET
    path: "/commissaries"
    description: "List commissaries (paginated)"
    roles: [Dispatcher, PlatformAdmin, OperatorTruck, HealthInspector]
    code: 200
    input: ["limit?", "offset?"]
    output: "Commissary[]"
    side_effects: []

  - method: GET
    path: "/commissaries/{commissaryId}"
    description: "Get a commissary"
    roles: [Dispatcher, PlatformAdmin, OperatorTruck, HealthInspector]
    code: 200
    input: []
    output: Commissary
    side_effects: []

  - method: POST
    path: "/commissaries/{commissaryId}/suspend"
    description: "Suspend a commissary"
    roles: [Dispatcher, PlatformAdmin]
    code: 200
    input: []
    output: Commissary
    side_effects:
      - "status -> SUSPENDED"
      - "Each docked truck operability recomputed -> GROUNDED when it loses its only ACTIVE commissary"
      - "RESERVED future bookings of those grounded trucks CANCELLED with full refund (transitive cascade)"
      - "docked_truck_count recomputed"

  - method: POST
    path: "/commissaries/{commissaryId}/reinstate"
    description: "Reinstate a suspended commissary"
    roles: [Dispatcher, PlatformAdmin]
    code: 200
    input: []
    output: Commissary
    side_effects: ["status -> ACTIVE", "docked trucks operability recomputed", "docked_truck_count recomputed"]

  # --- OperatorTruck ---
  - method: POST
    path: "/trucks"
    description: "Create an operator truck (starts GROUNDED until permit + commissary + staffing satisfy operability_posture)"
    roles: [Dispatcher, PlatformAdmin]
    code: 201
    input: [name, commissary_id, home_state_code]
    output: OperatorTruck
    side_effects: ["operability=GROUNDED, propane_psi=0, generator_runtime_hours=0, reservation_fee_balance_cents=0, gross_sales_cents=0, version=1"]

  - method: GET
    path: "/trucks"
    description: "List operator trucks; optional commissary_id filter (FK reverse-reachability for OperatorTruck.commissary_id)"
    roles: [Dispatcher, PlatformAdmin, OperatorTruck, HealthInspector]
    code: 200
    input: ["commissary_id?", "limit?", "offset?"]
    output: "OperatorTruck[]"
    side_effects: []

  - method: GET
    path: "/trucks/{truckId}"
    description: "Get a truck (operability and all computed fields reflect current state)"
    roles: [Dispatcher, PlatformAdmin, OperatorTruck, HealthInspector]
    code: 200
    input: []
    output: OperatorTruck
    side_effects: []

  # --- HealthPermit ---
  - method: POST
    path: "/health-permits"
    description: "Issue a health permit for a truck"
    roles: [HealthInspector, PlatformAdmin]
    code: 201
    input: [truck_id, permit_number, state_code, issued_at, expires_at]
    output: HealthPermit
    side_effects:
      - "status=ACTIVE"
      - "Owning truck operability recomputed (may rise from GROUNDED)"
      - "Rejected if truck already has an ACTIVE permit (ERR_DUPLICATE_ACTIVE_PERMIT)"

  - method: GET
    path: "/health-permits"
    description: "List health permits; optional truck_id filter (FK reverse-reachability for HealthPermit.truck_id)"
    roles: [HealthInspector, PlatformAdmin, Dispatcher, OperatorTruck]
    code: 200
    input: ["truck_id?", "limit?", "offset?"]
    output: "HealthPermit[]"
    side_effects: []

  - method: GET
    path: "/health-permits/{permitId}"
    description: "Get a health permit"
    roles: [HealthInspector, PlatformAdmin, Dispatcher, OperatorTruck]
    code: 200
    input: []
    output: HealthPermit
    side_effects: []

  - method: POST
    path: "/health-permits/{permitId}/revoke"
    description: "Revoke an active permit"
    roles: [HealthInspector, PlatformAdmin]
    code: 200
    input: []
    output: HealthPermit
    side_effects:
      - "status -> REVOKED"
      - "Owning truck operability recomputed -> GROUNDED (loss of only ACTIVE permit)"
      - "RESERVED future bookings of that truck CANCELLED with full refund (cascade)"

  # --- Spot ---
  - method: POST
    path: "/spots"
    description: "Create a vending spot / route stop"
    roles: [Dispatcher, PlatformAdmin]
    code: 201
    input: [name, state_code, concurrent_capacity, reservation_fee_cents, "buffer_minutes?"]
    output: Spot
    side_effects: []

  - method: GET
    path: "/spots"
    description: "List spots (paginated)"
    roles: [Dispatcher, PlatformAdmin, OperatorTruck, HealthInspector]
    code: 200
    input: ["limit?", "offset?"]
    output: "Spot[]"
    side_effects: []

  - method: GET
    path: "/spots/{spotId}"
    description: "Get a spot"
    roles: [Dispatcher, PlatformAdmin, OperatorTruck, HealthInspector]
    code: 200
    input: []
    output: Spot
    side_effects: []

  # --- Event ---
  - method: POST
    path: "/events"
    description: "Create an event window"
    roles: [Dispatcher, PlatformAdmin]
    code: 201
    input: [name, starts_at, ends_at]
    output: Event
    side_effects: ["status=SCHEDULED"]

  - method: GET
    path: "/events"
    description: "List events (paginated)"
    roles: [Dispatcher, PlatformAdmin, OperatorTruck, HealthInspector]
    code: 200
    input: ["limit?", "offset?"]
    output: "Event[]"
    side_effects: []

  - method: GET
    path: "/events/{eventId}"
    description: "Get an event"
    roles: [Dispatcher, PlatformAdmin, OperatorTruck, HealthInspector]
    code: 200
    input: []
    output: Event
    side_effects: []

  - method: POST
    path: "/events/{eventId}/cancel"
    description: "Cancel an event; cascades to its bookings and their open orders"
    roles: [Dispatcher, PlatformAdmin]
    code: 200
    input: []
    output: Event
    side_effects:
      - "status -> CANCELLED"
      - "RESERVED bookings on this event -> CANCELLED with full refund"
      - "ARRIVED bookings on this event -> CANCELLED with NO refund; their OPEN orders -> VOID (transitive cascade)"

  - method: GET
    path: "/events/{eventId}/sales-report"
    description: "Computed sales-by-event report (gross sales, order count, tips, net reservation fees, per-truck breakdown)"
    roles: [Dispatcher, PlatformAdmin]
    code: 200
    input: []
    output: "{ event_id: string, gross_sales_cents: integer, order_count: integer, total_tips_cents: integer, net_reservation_cents: integer, truck_breakdown: array }"
    side_effects: []

  # --- Booking (junction Truck x Spot x Event) ---
  - method: POST
    path: "/bookings"
    description: "Reserve a spot for a truck at an event (charges reservation fee, OCC-guarded on truck.version)"
    roles: [OperatorTruck, Dispatcher, PlatformAdmin]
    code: 201
    input: [truck_id, spot_id, event_id, window_start, window_end, expected_truck_version]
    output: Booking
    side_effects:
      - "status=RESERVED"
      - "reservation_fee_cents snapshot from Spot.reservation_fee_cents"
      - "truck.reservation_fee_balance_cents += reservation_fee_cents"
      - "increments OperatorTruck.version by 1"
      - "Validation chain: spot capacity overlap, booking within event window, OCC version check"

  - method: GET
    path: "/bookings"
    description: "List bookings; optional truck_id / spot_id / event_id filters (FK reverse-reachability for Booking.truck_id, Booking.spot_id, Booking.event_id)"
    roles: [Dispatcher, PlatformAdmin, OperatorTruck, HealthInspector]
    code: 200
    input: ["truck_id?", "spot_id?", "event_id?", "limit?", "offset?"]
    output: "Booking[]"
    side_effects: []

  - method: GET
    path: "/bookings/{bookingId}"
    description: "Get a booking"
    roles: [Dispatcher, PlatformAdmin, OperatorTruck, HealthInspector]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: POST
    path: "/bookings/{bookingId}/arrive"
    description: "Truck arrives at its booked spot (requires OPERABLE truck, SCHEDULED event, clock within window)"
    roles: [OperatorTruck, PlatformAdmin]
    code: 200
    input: []
    output: Booking
    side_effects: ["status -> ARRIVED"]

  - method: POST
    path: "/bookings/{bookingId}/depart"
    description: "Truck departs (requires no OPEN orders)"
    roles: [OperatorTruck, PlatformAdmin]
    code: 200
    input: []
    output: Booking
    side_effects: ["status -> DEPARTED"]

  - method: POST
    path: "/bookings/{bookingId}/cancel"
    description: "Cancel a reserved booking (full refund if before cutoff, else forfeit)"
    roles: [OperatorTruck, PlatformAdmin]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "status -> CANCELLED"
      - "fee_refunded_cents set per cutoff rule; truck.reservation_fee_balance_cents adjusted"

  # --- MenuItem ---
  - method: POST
    path: "/menu-items"
    description: "Add a menu item to a truck"
    roles: [OperatorTruck, PlatformAdmin]
    code: 201
    input: [truck_id, sku, name, unit_price_cents, par_units]
    output: MenuItem
    side_effects: ["status=AVAILABLE, prepared_units=0"]

  - method: GET
    path: "/menu-items"
    description: "List menu items; optional truck_id filter (FK reverse-reachability for MenuItem.truck_id)"
    roles: [Dispatcher, PlatformAdmin, OperatorTruck, HealthInspector]
    code: 200
    input: ["truck_id?", "limit?", "offset?"]
    output: "MenuItem[]"
    side_effects: []

  - method: GET
    path: "/menu-items/{menuItemId}"
    description: "Get a menu item"
    roles: [Dispatcher, PlatformAdmin, OperatorTruck, HealthInspector]
    code: 200
    input: []
    output: MenuItem
    side_effects: []

  - method: POST
    path: "/menu-items/{menuItemId}/unlist"
    description: "Mark a menu item UNLISTED (no longer orderable)"
    roles: [OperatorTruck, PlatformAdmin]
    code: 200
    input: []
    output: MenuItem
    side_effects: ["status -> UNLISTED"]

  # --- PrepBatch ---
  - method: POST
    path: "/prep-batches"
    description: "Log a prep batch (credits prepared_units of the item)"
    roles: [OperatorTruck, PlatformAdmin]
    code: 201
    input: [truck_id, menu_item_id, units_made]
    output: PrepBatch
    side_effects: ["status=OPEN, prepped_at=server clock", "MenuItem.prepared_units recomputed"]

  - method: GET
    path: "/prep-batches"
    description: "List prep batches; optional truck_id / menu_item_id filters (FK reverse-reachability for PrepBatch.truck_id and PrepBatch.menu_item_id)"
    roles: [Dispatcher, PlatformAdmin, OperatorTruck, HealthInspector]
    code: 200
    input: ["truck_id?", "menu_item_id?", "limit?", "offset?"]
    output: "PrepBatch[]"
    side_effects: []

  - method: GET
    path: "/prep-batches/{batchId}"
    description: "Get a prep batch"
    roles: [Dispatcher, PlatformAdmin, OperatorTruck, HealthInspector]
    code: 200
    input: []
    output: PrepBatch
    side_effects: []

  - method: POST
    path: "/prep-batches/{batchId}/discard"
    description: "Discard an OPEN prep batch (removes its units from prepared_units pool)"
    roles: [OperatorTruck, PlatformAdmin]
    code: 200
    input: []
    output: PrepBatch
    side_effects: ["status -> DISCARDED", "MenuItem.prepared_units recomputed; rejected if it would go negative"]

  # --- StaffShift ---
  - method: POST
    path: "/staff-shifts"
    description: "Schedule a staff shift (overlap-checked per worker; may raise truck operability)"
    roles: [OperatorTruck, PlatformAdmin]
    code: 201
    input: [truck_id, staff_name, role, shift_start, shift_end]
    output: StaffShift
    side_effects: ["status=SCHEDULED", "owning truck operability recomputed"]

  - method: GET
    path: "/staff-shifts"
    description: "List staff shifts; optional truck_id filter (FK reverse-reachability for StaffShift.truck_id)"
    roles: [Dispatcher, PlatformAdmin, OperatorTruck, HealthInspector]
    code: 200
    input: ["truck_id?", "limit?", "offset?"]
    output: "StaffShift[]"
    side_effects: []

  - method: GET
    path: "/staff-shifts/{shiftId}"
    description: "Get a staff shift"
    roles: [Dispatcher, PlatformAdmin, OperatorTruck, HealthInspector]
    code: 200
    input: []
    output: StaffShift
    side_effects: []

  - method: POST
    path: "/staff-shifts/{shiftId}/cancel"
    description: "Cancel a scheduled shift (may lower truck operability)"
    roles: [OperatorTruck, PlatformAdmin]
    code: 200
    input: []
    output: StaffShift
    side_effects: ["status -> CANCELLED", "owning truck operability recomputed"]

  # --- UtilityLog ---
  - method: POST
    path: "/utility-logs"
    description: "Append a propane or generator log entry (updates truck propane_psi / generator_runtime_hours, recomputes operability)"
    roles: [OperatorTruck, PlatformAdmin]
    code: 201
    input: [truck_id, utility, "propane_psi_after?", "generator_delta_hours?"]
    output: UtilityLog
    side_effects:
      - "PROPANE: truck.propane_psi = propane_psi_after"
      - "GENERATOR: truck.generator_runtime_hours += generator_delta_hours"
      - "owning truck operability recomputed"

  - method: GET
    path: "/utility-logs"
    description: "List utility logs; optional truck_id / utility filters (FK reverse-reachability for UtilityLog.truck_id)"
    roles: [Dispatcher, PlatformAdmin, OperatorTruck, HealthInspector]
    code: 200
    input: ["truck_id?", "utility?", "limit?", "offset?"]
    output: "UtilityLog[]"
    side_effects: []

  - method: GET
    path: "/utility-logs/{logId}"
    description: "Get a utility log entry"
    roles: [Dispatcher, PlatformAdmin, OperatorTruck, HealthInspector]
    code: 200
    input: []
    output: UtilityLog
    side_effects: []

  # --- Order + OrderLine (POS / cashless) ---
  - method: POST
    path: "/orders"
    description: "Open a POS order under an ARRIVED booking (requires OPERABLE truck)"
    roles: [OperatorTruck, PlatformAdmin]
    code: 201
    input: [booking_id]
    output: Order
    side_effects: ["truck_id copied from booking", "lifecycle_status=OPEN, payment_status=UNPAID, live_total_cents=0"]

  - method: GET
    path: "/orders"
    description: "List orders; optional truck_id / booking_id filters (FK reverse-reachability for Order.truck_id and Order.booking_id)"
    roles: [Dispatcher, PlatformAdmin, OperatorTruck, HealthInspector]
    code: 200
    input: ["truck_id?", "booking_id?", "limit?", "offset?"]
    output: "Order[]"
    side_effects: []

  - method: GET
    path: "/orders/{orderId}"
    description: "Get an order"
    roles: [Dispatcher, PlatformAdmin, OperatorTruck, HealthInspector]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: POST
    path: "/order-lines"
    description: "Add a line item to an OPEN order (snapshots unit price, recomputes live_total)"
    roles: [OperatorTruck, PlatformAdmin]
    code: 201
    input: [order_id, menu_item_id, quantity]
    output: OrderLine
    side_effects:
      - "unit_price_cents snapshot from MenuItem.unit_price_cents"
      - "line_subtotal_cents = quantity * unit_price_cents"
      - "parent Order.live_total_cents recomputed"
      - "Rejected if MenuItem UNLISTED or not on the order's truck"

  - method: GET
    path: "/order-lines"
    description: "List order lines; optional order_id / menu_item_id filters (FK reverse-reachability for OrderLine.order_id and OrderLine.menu_item_id)"
    roles: [Dispatcher, PlatformAdmin, OperatorTruck, HealthInspector]
    code: 200
    input: ["order_id?", "menu_item_id?", "limit?", "offset?"]
    output: "OrderLine[]"
    side_effects: []

  - method: GET
    path: "/order-lines/{lineId}"
    description: "Get an order line"
    roles: [Dispatcher, PlatformAdmin, OperatorTruck, HealthInspector]
    code: 200
    input: []
    output: OrderLine
    side_effects: []

  - method: POST
    path: "/orders/{orderId}/authorize-payment"
    description: "Authorize the cashless payment (UNPAID -> AUTHORIZED)"
    roles: [OperatorTruck, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: ["payment_status -> AUTHORIZED"]

  - method: POST
    path: "/orders/{orderId}/capture-payment"
    description: "Capture the cashless payment with optional tip (AUTHORIZED -> CAPTURED)"
    roles: [OperatorTruck, PlatformAdmin]
    code: 200
    input: ["tip_cents?"]
    output: Order
    side_effects: ["payment_status -> CAPTURED", "tip recorded", "live_total_cents refreshed to include tip"]

  - method: POST
    path: "/orders/{orderId}/settle"
    description: "Settle an OPEN, CAPTURED order with an optional discount code (pins settled_total, consumes prepared_units)"
    roles: [OperatorTruck, PlatformAdmin]
    code: 200
    input: ["discount_code?"]
    output: Order
    side_effects:
      - "lifecycle_status -> SETTLED"
      - "settled_total_cents pinned via order_settled_total"
      - "each line consumes MenuItem.prepared_units (rejected if any would go negative)"
      - "truck.gross_sales_cents += settled_total_cents"

  - method: POST
    path: "/orders/{orderId}/void"
    description: "Void an OPEN order (refunds if CAPTURED; never consumes par)"
    roles: [OperatorTruck, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: ["lifecycle_status -> VOID", "if payment_status==CAPTURED -> REFUNDED"]

  # --- Test-driving clock endpoint (last-resort namespace) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving: set the server's current UTC clock; advancing it sweeps permit expiry and booking NO_SHOW and recomputes affected operability and cascades"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ now: datetime, swept_permit_ids: array, swept_booking_ids: array }"
    side_effects:
      - "current clock set to to_iso8601 (must be >= prior clock; ERR_CLOCK_REWIND otherwise)"
      - "ACTIVE permits with now >= expires_at -> EXPIRED; affected trucks recomputed; their RESERVED future bookings cascade-cancelled with refund"
      - "RESERVED bookings with now >= window_end -> NO_SHOW (fee forfeited)"

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing or role not recognized" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for this operation, or entity_backed OperatorTruck acting on a truck it does not own" }

  # --- Existence ---
  - { id: ERR_COMMISSARY_NOT_FOUND, http: 404, condition: "commissary id (path or FK) does not exist" }
  - { id: ERR_TRUCK_NOT_FOUND, http: 404, condition: "truck id (path or FK) does not exist" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "permit id does not exist" }
  - { id: ERR_SPOT_NOT_FOUND, http: 404, condition: "spot id (path or FK) does not exist" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "event id (path or FK) does not exist" }
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "booking id (path or FK) does not exist" }
  - { id: ERR_MENU_ITEM_NOT_FOUND, http: 404, condition: "menu item id (path or FK) does not exist or not on this truck" }
  - { id: ERR_BATCH_NOT_FOUND, http: 404, condition: "prep batch id does not exist" }
  - { id: ERR_SHIFT_NOT_FOUND, http: 404, condition: "staff shift id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "order id (path or FK) does not exist" }
  - { id: ERR_LINE_NOT_FOUND, http: 404, condition: "order line id does not exist" }
  - { id: ERR_LOG_NOT_FOUND, http: 404, condition: "utility log id does not exist" }

  # --- Request shape ---
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "missing required field, bad enum, integer out of declared range, window_end <= window_start, expires_at <= issued_at, bad state_code, PROPANE log without propane_psi_after, GENERATOR log without generator_delta_hours" }
  - { id: ERR_BOOKING_OUTSIDE_EVENT, http: 422, condition: "booking window not contained within parent event [starts_at, ends_at)" }

  # --- State ---
  - { id: ERR_PERMIT_NOT_ACTIVE, http: 409, condition: "revoke requires permit ACTIVE" }
  - { id: ERR_COMMISSARY_NOT_ACTIVE, http: 409, condition: "suspend requires commissary ACTIVE" }
  - { id: ERR_COMMISSARY_NOT_SUSPENDED, http: 409, condition: "reinstate requires commissary SUSPENDED" }
  - { id: ERR_EVENT_NOT_SCHEDULED, http: 409, condition: "cancel, or arrive against this event, requires event SCHEDULED" }
  - { id: ERR_BOOKING_NOT_RESERVED, http: 409, condition: "arrive/cancel requires booking RESERVED" }
  - { id: ERR_BOOKING_NOT_ARRIVED, http: 409, condition: "depart, or open order, requires booking ARRIVED" }
  - { id: ERR_OUTSIDE_BOOKING_WINDOW, http: 409, condition: "arrive requires current clock within [window_start, window_end)" }
  - { id: ERR_TRUCK_NOT_OPERABLE, http: 409, condition: "arrive / open order requires owning truck operability == OPERABLE" }
  - { id: ERR_OPEN_ORDERS_EXIST, http: 409, condition: "depart blocked: an OPEN order still exists under the booking" }
  - { id: ERR_ORDER_NOT_OPEN, http: 409, condition: "settle/void/add-line/authorize requires order lifecycle_status OPEN" }
  - { id: ERR_EMPTY_ORDER, http: 409, condition: "settle/authorize requires the order to have >= 1 line" }
  - { id: ERR_PAYMENT_NOT_UNPAID, http: 409, condition: "authorize requires payment_status UNPAID" }
  - { id: ERR_PAYMENT_NOT_AUTHORIZED, http: 409, condition: "capture requires payment_status AUTHORIZED" }
  - { id: ERR_PAYMENT_NOT_CAPTURED, http: 409, condition: "settle requires payment_status CAPTURED" }
  - { id: ERR_SHIFT_NOT_SCHEDULED, http: 409, condition: "cancel requires shift SCHEDULED" }
  - { id: ERR_BATCH_NOT_OPEN, http: 409, condition: "discard requires batch OPEN" }
  - { id: ERR_MENU_ITEM_UNLISTED, http: 409, condition: "cannot add an UNLISTED menu item to an order" }

  # --- Business constraints ---
  - { id: ERR_DUPLICATE_ACTIVE_PERMIT, http: 409, condition: "truck already has an ACTIVE permit when issuing a new one" }
  - { id: ERR_SPOT_CAPACITY_EXCEEDED, http: 409, condition: "new booking (buffer-padded) would push overlapping non-terminal bookings on the spot above concurrent_capacity" }
  - { id: ERR_SHIFT_OVERLAP, http: 409, condition: "new shift overlaps an existing SCHEDULED shift for the same (truck_id, staff_name)" }
  - { id: ERR_INSUFFICIENT_PREPARED_UNITS, http: 409, condition: "settle would drive a MenuItem.prepared_units below 0" }
  - { id: ERR_PREPARED_UNITS_NEGATIVE, http: 409, condition: "discard would drive a MenuItem.prepared_units below 0 (units already consumed by SETTLED orders)" }

  # --- Concurrency ---
  - { id: ERR_STALE_TRUCK_VERSION, http: 412, condition: "expected_truck_version on booking create != truck's current version" }

  # --- Test-driving ---
  - { id: ERR_CLOCK_REWIND, http: 422, condition: "_clock/set_current_utc target is earlier than the current clock" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: OperatorTruck
    description: "Acts as a single food truck: owns its menu, prep, staff shifts, utility logs, orders; reserves spots and runs POS. Entity_backed — X-User-ID is the OperatorTruck.id and write ops on truck-owned resources require X-User-ID == resource's truck_id."
    identity: "entity_backed:OperatorTruck"
    exclusive_operations:
      - "POST /menu-items, /menu-items/{id}/unlist"
      - "POST /prep-batches, /prep-batches/{id}/discard"
      - "POST /staff-shifts, /staff-shifts/{id}/cancel"
      - "POST /utility-logs"
      - "POST /bookings/{id}/arrive, /depart, /cancel"
      - "POST /orders, /order-lines, /orders/{id}/authorize-payment, /capture-payment, /settle, /void"
    shared_operations:
      - "POST /bookings (also Dispatcher, PlatformAdmin)"
      - "GET reads across trucks, commissaries, spots, events, bookings, permits, menu-items, prep-batches, staff-shifts, utility-logs, orders, order-lines"

  - name: Dispatcher
    description: "Operates the location/event side: owns commissaries, spots, events, and the booking ledger; can also place bookings on behalf of trucks. Opaque operational identity."
    identity: "opaque"
    exclusive_operations:
      - "POST /commissaries, /commissaries/{id}/suspend, /reinstate"
      - "POST /spots"
      - "POST /events, /events/{id}/cancel"
      - "POST /trucks (provision a truck)"
      - "GET /events/{id}/sales-report"
    shared_operations:
      - "POST /bookings (also OperatorTruck, PlatformAdmin)"
      - "GET reads across all collections"

  - name: HealthInspector
    description: "Owns permit lifecycle: issues and revokes health permits. Opaque regulatory identity."
    identity: "opaque"
    exclusive_operations:
      - "POST /health-permits, /health-permits/{id}/revoke"
    shared_operations:
      - "GET reads across trucks, commissaries, permits, spots, events, bookings"

  - name: PlatformAdmin
    description: "Operational superset for seeding/clock control; may perform any business operation. Opaque administrative identity."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "Any business write or read operation (superset of all other roles)"
