      - name: fail_inspection_revokes_only_the_issued_certificate
        claim_type: Conditional cascade
        grounds:
          - state_machines.ComplianceCertificate.ISSUED_to_REVOKED
          - state_machines.Inspection.NOTICED_to_COMPLETED_FAIL.side_effects
          - entities.ComplianceCertificate.fields.snapshot_risk_class
        distinguishing_aspect: |
          LINK 4 of the FAIL cascade is conditional on certificate status and expiry: of two
          certificates on the same parcel, the ISSUED one (expiring 2026-11-20T23:59:59Z, i.e. after
          the 2026-09-10 clock) is revoked while the DENIED one is untouched, and the revoked row keeps
