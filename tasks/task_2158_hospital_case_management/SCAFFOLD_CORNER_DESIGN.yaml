            - call: "GET /episodes/${ep_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { ep_v2: $.data.version, committed_before: $.data.logistics_committed_cents }
          trigger:
            - call: "POST /episodes/${ep_id}/logistics-orders"
              payload: { expected_episode_version: "${ep_v2}", order_type: "PATIENT_TRANSPORT", vehicle_id: "${veh_id}", mileage_miles: 20, window_start: "2026-08-02T14:30:00Z", window_end: "2026-08-02T15:30:00Z" }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { lo2: $.data.id }
            - call: "POST /logistics-orders/${lo2}/confirm"
              payload: {}
              as: DischargeCoordinator
              as_user_id: "dc-alpha"
          assert:
            - "before the supersede: Episode.${ep_id}.logistics_committed_cents == 35800"
            - "LogisticsOrder.${lo1}.status == CANCELLED and cancel_reason == SUPERSEDED"
            - "immediately after the create: Episode.${ep_id}.logistics_committed_cents == 0"
            - "LogisticsOrder.${lo2}.cost_cents == 43000 and after confirm status == CONFIRMED"
            - "after the second confirm: Episode.${ep_id}.logistics_committed_cents == 43000"
            - "GET /logistics-orders?vehicle_id=${veh_id} returns total_count == 2"

      - name: dual_variant_layer_is_covered_by_difficulty_design
        claim_type: dual_variant_calculation
        grounds: ["calculations.composite_readmission_risk_score", "calculations.placement_cost_projection"]
        excluded_because:
          difficulty_instance: dual_variant_calc / risk_score_admission_variant_versus_predischarge_variant
          rationale: "Variant divergence, variant selection and the post-switch reconciliation are all asserted by the two §1.8 dual_variant_calc instances."

  - section: consistency_model
    instances:

      - name: choice_cascade_is_visible_in_the_same_response_and_immediate_reads
        claim_type: immediate
        grounds:
          - state_machines.Referral.CHOICE_PENDING_to_PLACED
          - entities.Referral.fields.chosen_bed_offer_id
          - entities.PostAcuteProvider.fields.acceptance_rate_pct
        distinguishing_aspect: "consistency_model is immediate: the document-choice response body itself already shows status PLACED and chosen_bed_offer_id, and reads issued straight afterwards show the sibling offer DECLINED_BY_PATIENT and both providers' counters already updated - no second request or delay is needed."
        test_recipe:
          setup:
            - "A SNF Referral in CHOICE_PENDING with two OFFERED offers, from Cedar SNF and Birch SNF"
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Lakeside Choice", coinsurance_pct: 0.200, snf_auth_required: false }
              as: PlatformAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-H001", full_name: "Ola Mbeki", date_of_birth: "1941-10-10", primary_payer_id: "${payer_id}", prior_admissions_180d: 2, lives_alone: false, has_pcp: true }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Cedar SNF", provider_type: "SNF", quality_star_rating: 4, distance_miles_from_hospital: 6, bed_unit_codes: ["UNIT-A"] }
              as: PlatformAdmin
              captures: { prov_a: $.data.id }
            - call: "POST /providers"
              payload: { name: "Birch SNF", provider_type: "SNF", quality_star_rating: 5, distance_miles_from_hospital: 22, bed_unit_codes: ["UNIT-A"] }
              as: PlatformAdmin
              captures: { prov_b: $.data.id }
            - call: "POST /providers"
              payload: { name: "Alder SNF", provider_type: "SNF", quality_star_rating: 3, distance_miles_from_hospital: 12, bed_unit_codes: ["UNIT-A"] }
              as: PlatformAdmin
              captures: { prov_c: $.data.id }
            - call: "POST /episodes"
              payload: { patient_id: "${pat_id}", admission_type: "EMERGENT", drg_code: "DRG-291", drg_gmlos_days: 4.5, attending_unit: "5W", admitted_at: "2026-08-01T00:00:00Z" }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { ep_id: $.data.id }
            - call: "POST /episodes/${ep_id}/screenings"
              payload: { screening_type: "ADMISSION", functional_score: 8, cognitive_score: 8, social_support_score: 4, medication_count: 10 }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { scr_id: $.data.id }
            - call: "POST /screenings/${scr_id}/submit"
              payload: {}
              as: CaseManager
              as_user_id: "cm-alpha"
            - call: "POST /episodes/${ep_id}/referrals"
              payload: { requested_level_of_care: "SNF", projected_stay_days: 14, needed_by: "2026-08-20T00:00:00Z" }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/broadcast"
              payload: { provider_ids: ["${prov_a}", "${prov_b}", "${prov_c}"] }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { ref_v1: $.data.version }
            - call: "POST /referrals/${ref_id}/offers"
              payload: { expected_referral_version: "${ref_v1}", bed_unit_code: "UNIT-A", bed_available_from: "2026-08-05T00:00:00Z", hold_expires_at: "2026-08-12T00:00:00Z", daily_rate_cents: 30000 }
              as: PostAcuteLiaison
              as_user_id: "${prov_a}"
              captures: { off_a: $.data.id }
            - call: "GET /referrals/${ref_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { ref_v2: $.data.version }
            - call: "POST /referrals/${ref_id}/offers"
              payload: { expected_referral_version: "${ref_v2}", bed_unit_code: "UNIT-A", bed_available_from: "2026-08-05T00:00:00Z", hold_expires_at: "2026-08-12T00:00:00Z", daily_rate_cents: 28000 }
              as: PostAcuteLiaison
              as_user_id: "${prov_b}"
              captures: { off_b: $.data.id }
          trigger:
            - call: "POST /referrals/${ref_id}/document-choice"
              payload: { chosen_bed_offer_id: "${off_b}", patient_choice_attested: true, choice_basis: "FAMILY_PREFERENCE" }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { chosen: $.data.chosen_bed_offer_id, st: $.data.status }
          assert:
            - "the document-choice response body itself has status == PLACED and chosen_bed_offer_id == ${off_b} and choice_basis == FAMILY_PREFERENCE"
            - "an immediate GET /offers/${off_a} shows status == DECLINED_BY_PATIENT"
            - "an immediate GET /offers/${off_b} shows status == ACCEPTED_BY_PATIENT"
            - "PostAcuteProvider.${prov_a}.held_bed_units == 0 and offers_accepted_count == 0 and acceptance_rate_pct == 0.0"
            - "PostAcuteProvider.${prov_b}.held_bed_units == 1 and offers_accepted_count == 1 and acceptance_rate_pct == 100.0"
            - "the patient's non-recommended choice is honoured: Referral.${ref_id}.recommended_bed_offer_id == ${off_a} yet chosen_bed_offer_id == ${off_b}"
