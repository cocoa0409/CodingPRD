              as: Customer
              captures: { cust_b: $.data.id }
            - call: "POST /rental-network/customers/${cust_a}/verify-license"
              payload: {}
              as: DealerAgent
              as_user_id: "${dealer_a}"
            - call: "POST /rental-network/customers/${cust_b}/verify-license"
              payload: {}
