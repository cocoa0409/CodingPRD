            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1200 N Main St", unit_designator: "Apt 4B", city: "El Paso", state_code: "TX", postal_code: "79901" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { addr1_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Ana Ruiz", date_of_birth: "1980-04-11", last4_ssn: "4417", address_id: "${addr1_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000, qualifying_benefit: "NONE", tribal_lands_flag: false }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { sub1_id: $.data.id }
            - call: "POST /lifeline/subscribers/${sub1_id}/eligibility-checks"
              payload: { claimed_basis: "INCOME", proof_document_ref: "DOC-M1" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { chk1_id: $.data.id }
            - call: "POST /lifeline/eligibility-checks/${chk1_id}/verifier-result"
              payload: { verifier_outcome: "MATCH" }
              as: NationalVerifier
            - call: "POST /lifeline/enrollments"
              payload: { subscriber_id: "${sub1_id}", provider_id: "${prov_a_id}", eligibility_check_id: "${chk1_id}", certified_address_id: "${addr1_id}", service_type: "VOICE", one_per_household_attested: true, benefit_start_date: "2026-07-01T00:00:00Z" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { enr1_id: $.data.id }
            - call: "GET /lifeline/providers/${prov_a_id}"
              payload: {}
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { prov_a_ver: $.data.version }
            - call: "POST /lifeline/reimbursement-claims"
              payload: { provider_id: "${prov_a_id}", service_month: "2026-06", expected_provider_version: "${prov_a_ver}" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /lifeline/reimbursement-claims/${claim_id}/file"
              payload: { certifying_officer_ref: "OFFICER-7" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
          trigger:
            - call: "POST /lifeline/reimbursement-claims/${claim_id}/audit-draw"
              payload: { sample_size: 1 }
              as: ComplianceAuditor
              as_user_id: "AUD-1"
              captures: { pool_err: $.data.error_id }
            - call: "POST /lifeline/reimbursement-claims/${claim_id}/audit-draw"
              payload: { sample_size: 0 }
              as: ComplianceAuditor
              as_user_id: "AUD-1"
              captures: { size_err: $.data.error_id }
          assert:
            - "ReimbursementClaim.${claim_id}.provisional_amount_cents == 0"
            - "ReimbursementClaim.${claim_id}.final_amount_cents == 0"
            - "ReimbursementClaim.${claim_id}.variance_cents == 0"
            - "ReimbursementClaim.${claim_id}.covered_enrollment_count == 0"
            - "the first trigger call returns HTTP 409 and ${pool_err} == ERR_EMPTY_SAMPLE_POOL"
            - "the second trigger call returns HTTP 422 and ${size_err} == ERR_INVALID_SAMPLE_SIZE"
            - "ReimbursementClaim.${claim_id}.status == FILED"
            - "ReimbursementClaim.${claim_id}.audit_sample_count == 0"
            - "ReimbursementClaim.${claim_id}.failed_sample_count == 0"
            - "Provider.${prov_a_id}.claim_gross_cents == 0"
            - "Provider.${prov_a_id}.net_reimbursed_cents == 0"
            - "Provider.${prov_a_id}.audit_hold_flag == false"

      - name: income_threshold_equality_boundary_on_eligibility_check_endpoint
        grounds:
          - calculations.fpg_income_threshold
          - calculations.eligibility_income_evaluation
          - validations[priority=70]
          - entities.EligibilityCheck.fields.evaluated_income_cents
          - entities.EligibilityCheck.fields.income_variant
        distinguishing_aspect: |
          The metric here is a money threshold in whole cents, reached only through POST
          /lifeline/subscribers/{id}/eligibility-checks: annual_income_cents exactly equal to
          the 4341600 threshold is ACCEPTED because the comparison is <=, while 4341601 -
          one single cent higher - is rejected with
          ERR_SUBSCRIBER_INCOME_ABOVE_THRESHOLD.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Provider licensed in TX with enrollment_cap 50."
            - "Subscriber S1: household_size 4, non-tribal, annual_income_cents exactly 4341600 (= the computed threshold)."
            - "Subscriber S2: household_size 4, non-tribal, annual_income_cents 4341601 (threshold + 1 cent), at a distinct address."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/providers"
              payload: { name: "SafeLink Wireless", spin_id: "143015", study_area_code: "489015", licensed_state_codes: ["TX"], enrollment_cap: 50 }
              as: ProgramAdministrator
              captures: { prov_a_id: $.data.id }
            - call: "POST /lifeline/addresses"
