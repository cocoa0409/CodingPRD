            - "The COMMIT page returns 1 row with amount_mrem 180.00 and reason RWP_APPROVED, total_count == 1"
            - "The unfiltered page with limit 1 returns 1 row, total_count == 2 and has_more == true — the filter narrows total_count, pagination does not"

      - name: set_predecessor_repoints_the_chain_and_rewalks_the_path
        claim_type: action_endpoint
        grounds: ["endpoints.POST_/schedule-activities/{id}/set-predecessor", "calculations.outage_critical_path", "state_machines.ScheduleActivity[constraint_status]"]
        distinguishing_aspect: "Every declared side effect of the re-sequencing endpoint in one pass: attaching B1 behind A2 blocks it and lengthens the path to 550.00, and passing predecessor_activity_id null detaches it again, returning it to CLEAR and the projection to 300.00."
        test_recipe:
          setup:
            - "Outage UNIT_1 / 1R24 (target 720) owns A1 (100 h), A2 (150 h, predecessor A1) and B1 (300 h, root). All three are unlinked, so each hop inflates by 0.1."
            - "Before the trigger: A2 path 250.00 / risk 275.00, B1 path 300.00 / risk 330.00, projected 300.00, critical path B1."
            - "After attaching B1 behind A2: B1 path 250.00 + 300.00 = 550.00 and risk 275.00 + 330.00 = 605.00, projected 550.00, still ON_TRACK against 720."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /outages"
