        distinguishing_aspect: "The sub-resource read is a computed read: after a failing inspection drops the park to NON_COMPLIANT, the listed priority_score values must already be the re-derived 4680 and 4550 (compliance_factor 1.30), not the 3600 and 3500 stored at proposal time, and the status and fiscal_year filters must narrow the same list."
