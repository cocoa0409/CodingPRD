            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: ACTIVATE }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r1_id}/shop-locations", payload: { shop_name: "Northside Diesel", street_line: "12 Elm", zip_code: "75001" }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { s1_id: "$.data.id" } }
            - { call: "POST /retail/technicians", payload: { full_name: "Dana Reyes", current_shop_location_id: "${s1_id}", credit_line_limit_cents: 100000, months_in_trade: 100, employment_verified: true }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { t_id: "$.data.id" } }
            - { call: "POST /retail/shop-locations/${s1_id}/credit-applications", payload: { technician_id: "${t_id}", requested_limit_cents: 50000, requested_kind: REVOLVING, employment_verified: true, months_in_trade: 100, prior_delinquency_count: 0, decision_source: FRANCHISEE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap1_id: "$.data.id" } }
            - { call: "POST /retail/credit-applications/${ap1_id}/status", payload: { action: APPROVE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap1_ver: "$.data.version" } }
            - { call: "POST /retail/credit-applications/${ap1_id}/accounts", payload: { expected_application_version: "${ap1_ver}" }, as: CreditOfficer, captures: { a1_id: "$.data.id" } }
            - { call: "POST /retail/products", payload: { sku: P1, product_name: "Torque Wrench", category: POWER_TOOLS, unit_cost_cents: 12000, retail_price_cents: 15000, default_warranty_months: 12, is_new_launch: false }, as: PlatformAdmin, captures: { p1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/inventory-positions", payload: { product_id: "${p1_id}", on_hand_qty: 10 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-09-07T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /retail/routes/${r1_id}/sales-orders", payload: { technician_id: "${t_id}", credit_account_id: "${a1_id}", mix_profile: DIAGNOSTIC_WEIGHTED, lines: [{ product_id: "${p1_id}", quantity: 2, unit_price_cents: 15000, warranty_terms: { type: FORCE1000, months: 12 } }] }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { o_id: "$.data.id" } }
            - { call: "POST /retail/sales-orders/${o_id}/status", payload: { action: CONFIRM }, as: RouteSalesRep, as_user_id: "${f_id}" }
            - { call: "POST /retail/sales-orders/${o_id}/status", payload: { action: DELIVER }, as: RouteSalesRep, as_user_id: "${f_id}" }
            - { call: "POST /retail/sales-orders/${o_id}/warranty-claims", payload: { line_index: 0, claim_kind: CLAIM, idempotency_key: idem-list-a, apply_to_account_id: "${a1_id}" }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { c_open: "$.data.id", c_open_status: "$.data.claim_status" } }
            - { call: "POST /retail/sales-orders/${o_id}/warranty-claims", payload: { line_index: 1, claim_kind: WARRANTY_REPLACEMENT, idempotency_key: idem-list-b }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { c_wr: "$.data.id" } }
            - { call: "POST /retail/sales-orders/${o_id}/warranty-claims/${c_wr}/status", payload: { action: SUBMIT }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { c_wr_status: "$.data.claim_status" } }
          trigger:
            - { call: "GET /retail/warranty-claims", payload: { order_id: "${o_id}" }, as: RouteSalesRep, captures: { all_first: "$.data[0].claim_kind" } }
            - { call: "GET /retail/warranty-claims", payload: { order_id: "${o_id}", claim_status: OPEN, claim_kind: CLAIM }, as: RouteSalesRep, captures: { filtered_first: "$.data[0].id", filtered_first_status: "$.data[0].claim_status" } }
          assert:
            - "the unfiltered call returns 2 claims for the order"
            - "the compound filter returns exactly 1 claim, id ${c_open}, with claim_status OPEN"
            - "the WARRANTY_REPLACEMENT claim ${c_wr} is SUBMITTED and excluded by the OPEN filter"
            - "the filtered page's total_count == 1"

      - name: endpoint_order_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_ORDER_NOT_FOUND]", "endpoints[GET /retail/sales-orders/{id}]"]
        distinguishing_aspect: "A well-formed but unknown SalesOrder id returns ERR_ORDER_NOT_FOUND with http 404, and the same holds for the nested claim path whose parent order does not exist."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /retail/sales-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: PlatformAdmin, captures: { order_error: "$.data.error_id" } }
            - { call: "POST /retail/sales-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/warranty-claims/9b4f2d1c-3e5a-4b02-ad9c-23f8c7b1e2d3/status", payload: { action: SUBMIT }, as: RouteSalesRep, captures: { nested_error: "$.data.error_id" } }
          assert:
            - "the order read captures ${order_error} == ERR_ORDER_NOT_FOUND with http 404"
            - "the nested claim action captures ${nested_error} == ERR_ORDER_NOT_FOUND, the leftmost missing path id winning"
            - "the nested action http status is 404"

      - name: endpoint_patch_order_rejects_empty_line_array
        claim_type: request_shape
