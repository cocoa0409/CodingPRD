      - name: annual_report_due_date_rolls_forward_over_weekends_and_holidays
        claim_type: correct_result
        grounds:
          - calculations.annual_report_due_date
          - calculations.business_day_calendar
        distinguishing_aspect: >-
          The window is added in CALENDAR days and only the RESULT is rolled forward to the next
          business day, so three different roll paths must all work off the same 210-day
          arithmetic: a Saturday landing rolls two days, a Thursday landing that is a market
          holiday rolls one day, and a Friday holiday landing rolls three days across the
          weekend. A control period whose landing is already a business day must not move at all.
