              payload: { customer_id: "${cust_id}", service_area_id: "${sa_id}", payload_weight_g: 2000, priority: "STANDARD" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { order_id: $.data.id, order_v1: $.data.version }
            - call: "POST /orders/${order_id}/dispatch"
              payload: { nest_id: "${nest_id}", expected_order_version: "${order_v1}" }
              as: DispatchOperator
