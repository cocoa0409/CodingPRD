  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: appointment_completion_cascades_four_links_into_inventory_amendment
        grounds:
          - state_machines.VerificationAppointment.state.ON_SITE_to_COMPLETED
          - state_machines.ServiceLine.inventory_state.CLASSIFIED_PROVISIONAL_to_CLASSIFIED_VERIFIED
          - state_machines.ServiceLine.replacement_state.ELIGIBLE_to_NOT_REQUIRED
          - state_machines.WaterSystem.inventory_status.PUBLISHED_to_AMENDMENT_PENDING
          - calculations.program_posture
          - entities.VerificationAppointment.fields.emitted_evidence_item_id
        distinguishing_aspect: |
          Depth 4, each link strictly caused by the previous one: (1) the completion
          synthesizes an APPOINTMENT_CASCADE EvidenceItem for the UTILITY side; (2) that
          insertion completes the both-sides field-evidence predicate, flipping
          inventory_state to CLASSIFIED_VERIFIED and re-reading the SAME evidence under
          FIELD_BASIS, which turns classification UNKNOWN -> NON_LEAD; (3) that
          classification change bubbles into the WaterSystem counters; (4) the counter
          refresh with inventory_status == PUBLISHED forces AMENDMENT_PENDING, whose
          program_posture STEP 3 clause forces RESTRICTED. Suppress link 1 and none of
          links 2-4 can occur; suppress link 2 (leave the line under RECORDS_BASIS) and
          links 3-4 do not fire because classification would not change.
        test_recipe:
          setup:
            - "WaterSystem with no disadvantaged tracts and a PUBLISHED RECORDS-basis inventory."
            - "One ServiceLine 101 Elm St whose only records evidence is PREDICTIVE_MODEL/CUSTOMER/UNKNOWN, so classification == UNKNOWN, certainty_score == 0.00, priority == 40.00, inventory_state == CLASSIFIED_PROVISIONAL and replacement_state == ELIGIBLE."
            - "The line also already carries POTHOLE/CUSTOMER/COPPER field evidence, which is invisible under RECORDS_BASIS and therefore changes nothing until the UTILITY side is field-verified too."
            - "Its single PENDING CustomerNotification has been delivered, so outstanding_notification_count == 0 and the only thing holding program_posture at RESTRICTED before the trigger is unknown_share_pct == 100.00 (STEP 6)."
            - "An ACTIVE VerificationCrew certified for POTHOLE holds an ON_SITE POTHOLE appointment on that line."
          setup_api_calls:
            - call: "POST /lsl/water-systems"
              payload: { pwsid: "IL2031008", system_name: "Foxglen Water", compliance_deadline_date: "2027-10-16", baseline_lead_and_grr_count: 100, disadvantaged_tract_codes: [], funding_mode: "WATERFALL" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { ws: $.data.id }
            - call: "POST /lsl/service-lines"
              payload: { water_system_id: "${ws}", address_label: "101 Elm St", census_tract_code: "17031-9900" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { l1: $.data.id }
            - call: "POST /lsl/evidence-items"
              payload: { service_line_id: "${l1}", source_type: "PREDICTIVE_MODEL", side: "CUSTOMER", observed_material: "UNKNOWN", observed_at: "2026-06-02T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
            - call: "POST /lsl/sampling-batches"
              payload: { water_system_id: "${ws}", stratum_code: "STR-A", stratum_line_count: 20 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { batch: $.data.id }
            - call: "POST /lsl/sampling-batches/${batch}/samples"
              payload: { service_line_id: "${l1}", lead_ppb: 1.0, collected_at: "2026-07-11T09:00:00Z", sample_type: "FIRST_DRAW" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/sampling-batches/${batch}/samples"
              payload: { service_line_id: "${l1}", lead_ppb: 2.0, collected_at: "2026-07-12T09:00:00Z", sample_type: "FIRST_DRAW" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/sampling-batches/${batch}/samples"
              payload: { service_line_id: "${l1}", lead_ppb: 3.0, collected_at: "2026-07-13T09:00:00Z", sample_type: "FIRST_DRAW" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/sampling-batches/${batch}/samples"
              payload: { service_line_id: "${l1}", lead_ppb: 4.0, collected_at: "2026-07-14T09:00:00Z", sample_type: "FIFTH_LITER" }
              as: ComplianceOfficer
