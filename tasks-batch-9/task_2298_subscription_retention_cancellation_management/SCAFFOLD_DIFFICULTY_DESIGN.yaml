            - "CORE exists with a MUG addon; subscriber C on PAID_SOCIAL subscribed on 2026-01-10 at 4-week cadence and paid its 6298-cent signup invoice (margin 3678)."
            - "The cycle-1 RENEWAL_REMINDER was sent on 2026-01-28 and on 2026-02-07 the renewal run issued invoice cycle_index 1 for 6298 cents."
            - "Attempt 1 on that invoice was settled SOFT_DECLINE / INSUFFICIENT_FUNDS on 2026-02-07: billing_state PAST_DUE, first_failed_at 2026-02-07, grace_end_at 2026-02-10."
            - "On 2026-02-08 C opened a cancellation session and captured reason PRICE; the session is still non-terminal."
            - "On 2026-02-10 attempt 2 was created: raw retry 2026-02-07 + 3 days equals grace_end_at exactly, so it is not clamped and not final."
