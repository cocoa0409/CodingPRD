            - "${sur} == 52.08"
            - "${com} == 486.08"
            - "${st} == COMMITTED"
            - "WaferStartPlan.${plan_b}.released_wafer_starts == 0"
            - "WaferStartPlan.${plan_b}.committed_hours <= WaferStartPlan.${plan_b}.capacity_budget_hours"
            - "${tier} != TIER_3"
            - "${sur} != 108.50"

      - name: die_yield_rounds_each_wafer_before_averaging
        grounds:
          - calculations.die_yield_and_speed_grade_allocation
          - entities.DieSortRun.fields.sort_yield
          - entities.DieSortRun.fields.good_die_total
          - entities.DieSortRun.fields.dominant_signature
          - entities.DieSortRun.fields.yield_loss_ratio
        distinguishing_aspect: |
          Mode (c) — pinned rounding order, a third distinct mode: three wafers of very unequal
          tested_die (100 / 10 / 50) are each rounded to 4 dp (0.9000, 0.8000, 0.9400) and only
          then averaged, giving sort_yield 0.8800; pooling good_die/tested_die across wafers and
