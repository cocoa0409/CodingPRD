  - rule_id: boundary_precision_check
    instances:
      - name: adl_count_two_of_six_inclusive_boundary
        grounds:
          - calculations.benefit_trigger_decision
          - entities.BenefitTriggerCertification.fields.decision
          - entities.Policy.fields.benefits_triggered
        distinguishing_aspect: |
          Numeric threshold boundary on the trigger-certifications endpoint: exactly 2 distinct
          ADL deficiencies (>= 2, inclusive) yields CERTIFIED, while 1 ADL with no cognitive
          impairment yields NOT_CERTIFIED — the >= 2 boundary, not > 2.
        test_recipe:
          setup:
            - "An IN_FORCE policy; first certification has exactly 2 ADLs (CERTIFIED), a superseding one has 1 ADL (NOT_CERTIFIED)."
          setup_api_calls:
            - call: "POST /policyholders"
              payload: { full_name: "Two Six", state_code: "CA", date_of_birth: "1940-12-12" }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", product_mode: "REIMBURSEMENT", daily_benefit_max_cents: 20000, monthly_benefit_max_cents: 600000, initial_pool_cents: 10000000, inflation_rider: "NONE", elimination_period_days: 0 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/issue"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /policies/${pol_id}/trigger-certifications"
              payload: { adl_deficiencies: ["BATHING", "DRESSING"], cognitive_impairment: false }
              as: CareAssessor
              captures: { cert2: $.data.id, dec2: $.data.decision }
            - call: "GET /policies/${pol_id}"
              payload: {}
              as: Underwriter
              captures: { trig_after_2: $.data.benefits_triggered }
            - call: "POST /policies/${pol_id}/trigger-certifications"
              payload: { adl_deficiencies: ["BATHING"], cognitive_impairment: false, supersedes_id: "${cert2}" }
              as: CareAssessor
              captures: { cert1: $.data.id, dec1: $.data.decision }
            - call: "GET /policies/${pol_id}"
              payload: {}
              as: Underwriter
              captures: { trig_after_1: $.data.benefits_triggered }
          assert:
            - "BenefitTriggerCertification.${cert2}.decision == CERTIFIED"
            - "Policy.${pol_id}.benefits_triggered == true after the 2-ADL certification"
            - "BenefitTriggerCertification.${cert1}.decision == NOT_CERTIFIED"
            - "Policy.${pol_id}.benefits_triggered == false after the superseding 1-ADL certification"

