            - "${ledger_end} == 0 (exactly the pre-accept value; conservation with no drift)"
            - "${pay_status} == VOIDED, ${pay_variant} == PROVISIONAL, ${pay_net} == 12554 (row retained, never deleted)"
            - "Assignment.${a1}.status == REVOKED and Assignment.${a1}.revoked_at == 2026-08-01T00:00:00Z"
            - "${t_status} == PENDING_ASSIGNMENT and ${t_version} == 4"
            - "Cleaner.${cc}.completed_turnover_count == 0 and Cleaner.${cc}.decline_count == 0"

      - name: supply_on_hand_conserved_across_restock_approve_then_waive_reversal
        grounds:
          - calculations.supply_on_hand_projection
          - calculations.restock_chargeback
          - state_machines.ChecklistTask.VERIFIED_to_WAIVED
          - entities.StockMovement.fields.delta_qty
          - entities.StockMovement.fields.charge_cents
          - endpoints["GET /stock-movements"]
        distinguishing_aspect: |
          Conserved quantity: SUPPLY UNITS (SupplyLine.on_hand_qty, pinned to
          SUM of delta_qty over that line's StockMovements). APPROVE takes LIN-SHEET-Q 6 -> 5 and
          WEL-WINE 1 -> 0 and books 1808 cents; WAIVE of the same VERIFIED task appends REVERSAL
          movements that restore 6 and 1 and negate every charge, so the ledger sums back to the
          seeded quantities and restock_charge_cents returns to 0.
        test_recipe:
          setup:
            - "Property P1 'AUS-101' with four ACTIVE supply lines: LIN-SHEET-Q (LINEN 260c par 6 on_hand 6), LIN-TOWEL-B (LINEN 180c par 8 on_hand 8), CON-COFFEE (CONSUMABLE 340c par 4 on_hand 4), WEL-WINE (WELCOME 900c par 1 on_hand 1)."
            - "Cleaner C accepted T1, outgoing guest CHECKED_OUT, clock 2026-08-08T16:00:00Z, clean IN_PROGRESS."
            - "The SUPPLY_RESTOCK task has been SUBMITTED consuming 1 unit of each line and then APPROVED, so it is VERIFIED with restock_charge_cents 1808 and the other three tasks are still PENDING (turnover stays IN_PROGRESS, which the WAIVE transition requires)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-101", name: "Barton Loft", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner1@example.com", bedroom_count: 2, bathroom_count: 2, bed_count: 3, local_utc_offset_minutes: -300, min_clean_minutes: 120, min_skill_level: 2 }
              as: PlatformAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /properties/${p1}/supply-lines"
              payload: { sku: "LIN-SHEET-Q", name: "Queen sheet set", category: "LINEN", unit_cost_cents: 260, par_qty: 6, unit: "SET", initial_on_hand_qty: 6 }
              as: PlatformAdmin
              captures: { sl1: "$.data.id" }
            - call: "POST /properties/${p1}/supply-lines"
              payload: { sku: "LIN-TOWEL-B", name: "Bath towel", category: "LINEN", unit_cost_cents: 180, par_qty: 8, unit: "EACH", initial_on_hand_qty: 8 }
              as: PlatformAdmin
              captures: { sl2: "$.data.id" }
            - call: "POST /properties/${p1}/supply-lines"
              payload: { sku: "CON-COFFEE", name: "Coffee pods", category: "CONSUMABLE", unit_cost_cents: 340, par_qty: 4, unit: "BOX", initial_on_hand_qty: 4 }
              as: PlatformAdmin
              captures: { sl3: "$.data.id" }
            - call: "POST /properties/${p1}/supply-lines"
              payload: { sku: "WEL-WINE", name: "Welcome wine", category: "WELCOME", unit_cost_cents: 900, par_qty: 1, unit: "BOTTLE", initial_on_hand_qty: 1 }
              as: PlatformAdmin
              captures: { sl4: "$.data.id" }
            - call: "POST /cleaners"
              payload: { name: "Cleaner C", home_zone_code: "ZONE_A", skill_level: 4, max_daily_turnovers: 3, initial_quality_score: 92.00 }
              as: PlatformAdmin
              captures: { cc: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "OUT-1", guest_name: "Guest Out", checkin_at: "2026-08-05T21:00:00Z", checkout_at: "2026-08-08T16:00:00Z" }
              as: Coordinator
              captures: { b_out: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "IN-1", guest_name: "Guest In", checkin_at: "2026-08-08T21:00:00Z", checkout_at: "2026-08-11T16:00:00Z" }
              as: Coordinator
              captures: { b_in: "$.data.id" }
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "${b_out}", incoming_booking_id: "${b_in}" }
              as: Coordinator
              captures: { t1: "$.data.id", t1_v: "$.data.version" }
            - call: "POST /turnovers/${t1}/assign"
              payload: { expected_turnover_version: "${t1_v}", cleaner_id: "${cc}" }
              as: Coordinator
              as_user_id: "coord-1"
              captures: { a1: "$.data.id" }
            - call: "POST /assignments/${a1}/accept"
              payload: {}
              as: Cleaner
              as_user_id: "${cc}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${b_out}/checkout"
              payload: {}
              as: Coordinator
            - call: "POST /turnovers/${t1}/start"
              payload: {}
              as: Cleaner
              as_user_id: "${cc}"
            - call: "GET /turnovers/${t1}/checklist-tasks"
              payload: { category: "RESTOCK" }
              as: Cleaner
              as_user_id: "${cc}"
              captures: { ck_restock: "$.data[0].id" }
            - call: "POST /checklist-tasks/${ck_restock}/submit"
              payload: { photo_uri: "https://ph/restock.jpg", restock_entries: [{ supply_line_id: "${sl1}", qty_used: 1 }, { supply_line_id: "${sl2}", qty_used: 1 }, { supply_line_id: "${sl3}", qty_used: 1 }, { supply_line_id: "${sl4}", qty_used: 1 }] }
              as: Cleaner
              as_user_id: "${cc}"
            - call: "POST /checklist-tasks/${ck_restock}/review"
              payload: { action: "APPROVE" }
              as: Coordinator
              as_user_id: "coord-2"
              captures: { charge_after_approve: "$.data.restock_charge_cents" }
            - call: "GET /supply-lines/${sl1}"
              payload: {}
              as: Coordinator
              captures: { sl1_mid: "$.data.on_hand_qty" }
            - call: "GET /supply-lines/${sl4}"
              payload: {}
              as: Coordinator
              captures: { sl4_mid: "$.data.on_hand_qty", sl4_below_mid: "$.data.below_par" }
          trigger:
            - call: "POST /checklist-tasks/${ck_restock}/review"
              payload: { action: "WAIVE", reject_reason: "supplies were donated by the owner, do not charge" }
              as: Coordinator
              as_user_id: "coord-2"
              captures: { ck_status: "$.data.status", charge_after_waive: "$.data.restock_charge_cents" }
            - call: "GET /supply-lines/${sl1}"
              payload: {}
              as: Coordinator
              captures: { sl1_end: "$.data.on_hand_qty", sl1_below_end: "$.data.below_par" }
            - call: "GET /supply-lines/${sl4}"
              payload: {}
              as: Coordinator
              captures: { sl4_end: "$.data.on_hand_qty", sl4_below_end: "$.data.below_par" }
            - call: "GET /stock-movements"
              payload: { supply_line_id: "${sl1}" }
              as: Coordinator
              captures: { mv0_delta: "$.data[0].delta_qty", mv1_delta: "$.data[1].delta_qty", mv1_charge: "$.data[1].charge_cents", mv2_delta: "$.data[2].delta_qty", mv2_charge: "$.data[2].charge_cents", mv2_reason: "$.data[2].reason", mv2_seq: "$.data[2].sequence_no" }
            - call: "GET /turnovers/${t1}"
              payload: {}
              as: Coordinator
              captures: { t_chargeback: "$.data.restock_chargeback_cents", t_status: "$.data.status" }
          assert:
            - "${charge_after_approve} == 1808 and ${sl1_mid} == 5 and ${sl4_mid} == 0 and ${sl4_below_mid} == true"
            - "${ck_status} == WAIVED and ${charge_after_waive} == 0"
            - "${sl1_end} == 6 and ${sl1_below_end} == false"
            - "${sl4_end} == 1 and ${sl4_below_end} == false"
            - "${mv0_delta} == 6 (SEED), ${mv1_delta} == -1 with ${mv1_charge} == 280, ${mv2_delta} == 1 with ${mv2_charge} == -280"
            - "${mv2_reason} == REVERSAL and ${mv2_seq} == 3"
            - "SUM of delta_qty over ${sl1}'s three movements == 6 == SupplyLine.${sl1}.on_hand_qty"
            - "SUM of charge_cents over ${sl1}'s three movements == 0"
            - "${t_chargeback} == 0 and ${t_status} == IN_PROGRESS"
            - "no StockMovement row was deleted: GET /stock-movements?supply_line_id=${sl1} returns total_count == 3"
