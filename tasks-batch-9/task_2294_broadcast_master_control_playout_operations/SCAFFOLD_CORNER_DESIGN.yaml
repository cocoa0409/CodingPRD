              as: TrafficCoordinator
              captures: { e_plmismatch: "$.data.error_id" }
          assert:
            - "${e_faulttarget} == ERR_FAULT_TARGET_MISMATCH (409): LOSS_OF_SIGNAL requires transmitter_id, and supplying only channel_id is a target mismatch even though the channel exists"
            - "${e_roleclass} == ERR_OPERATOR_ROLE_CLASS_INVALID (409): the inspector is a real ENGINEER operator, so priority 4 (ERR_ROLE_IDENTITY_MISMATCH) does not apply — the HEADER identity is a QC technician and only the REFERENCED operator is wrong"
