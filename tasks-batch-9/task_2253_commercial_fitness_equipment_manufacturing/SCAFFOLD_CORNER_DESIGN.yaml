- section: errors
  instances:
  - name: every_not_found_code_in_the_catalog_is_reachable_by_family
    claim_type: triggerability
    grounds:
    - errors[ERR_MODEL_NOT_FOUND]
    - errors[ERR_REVISION_NOT_FOUND]
    - errors[ERR_TEST_RESOURCE_NOT_FOUND]
    - errors[ERR_FIRMWARE_NOT_FOUND]
    - errors[ERR_FACILITY_NOT_FOUND]
    - errors[ERR_ORDER_NOT_FOUND]
    - errors[ERR_PARTNER_NOT_FOUND]
    - errors[ERR_INSTALL_JOB_NOT_FOUND]
    - errors[ERR_ASSET_NOT_FOUND]
    - errors[ERR_SERVICE_PLAN_NOT_FOUND]
    - validations[priority=3]
    distinguishing_aspect: 'All ten 404 codes are distinct and family-scoped, and the two shared codes cover two entity types each: ERR_TEST_RESOURCE_NOT_FOUND answers for rigs AND runs, ERR_FIRMWARE_NOT_FOUND
      for releases AND certifications, ERR_ORDER_NOT_FOUND for orders AND order lines, ERR_SERVICE_PLAN_NOT_FOUND for programs AND visits — so a generic 404 body would fail this test.'
    test_recipe:
      setup:
      - The store is empty of every entity family.
      - No entity anywhere has the id 00000000-0000-4000-8000-000000000000.
      setup_api_calls: []
      trigger:
      - call: GET /equipment-models/00000000-0000-4000-8000-000000000000
        payload: {}
        as: ProductEngineer
        captures: {e_model: $.data.error_id}
      - call: GET /model-revisions/00000000-0000-4000-8000-000000000000
        payload: {}
        as: ProductEngineer
        captures: {e_rev: $.data.error_id}
      - call: GET /test-rigs/00000000-0000-4000-8000-000000000000
        payload: {}
        as: ProductEngineer
        captures: {e_rig: $.data.error_id}
      - call: GET /test-runs/00000000-0000-4000-8000-000000000000
        payload: {}
        as: ProductEngineer
        captures: {e_run: $.data.error_id}
      - call: GET /firmware-releases/00000000-0000-4000-8000-000000000000
        payload: {}
        as: ProductEngineer
        captures: {e_fw: $.data.error_id}
      - call: GET /firmware-certifications/00000000-0000-4000-8000-000000000000
        payload: {}
        as: ComplianceOfficer
        captures: {e_cert: $.data.error_id}
      - call: GET /facilities/00000000-0000-4000-8000-000000000000
        payload: {}
        as: OrderPlanner
        captures: {e_fac: $.data.error_id}
      - call: GET /orders/00000000-0000-4000-8000-000000000000
        payload: {}
        as: OrderPlanner
        captures: {e_ord: $.data.error_id}
      - call: GET /order-lines/00000000-0000-4000-8000-000000000000
        payload: {}
        as: OrderPlanner
        captures: {e_line: $.data.error_id}
      - call: GET /service-partners/00000000-0000-4000-8000-000000000000
        payload: {}
        as: ServiceOpsAdmin
        captures: {e_part: $.data.error_id}
      - call: GET /install-jobs/00000000-0000-4000-8000-000000000000
        payload: {}
        as: OrderPlanner
        captures: {e_job: $.data.error_id}
      - call: GET /serialized-assets/00000000-0000-4000-8000-000000000000
        payload: {}
        as: OrderPlanner
        captures: {e_asset: $.data.error_id}
      - call: GET /pm-programs/00000000-0000-4000-8000-000000000000
        payload: {}
        as: ServiceOpsAdmin
        captures: {e_prog: $.data.error_id}
      - call: GET /maintenance-visits/00000000-0000-4000-8000-000000000000
        payload: {}
        as: ServiceOpsAdmin
        captures: {e_visit: $.data.error_id}
      assert:
      - the model probe returns 404 with error_id ERR_MODEL_NOT_FOUND and the revision probe ERR_REVISION_NOT_FOUND
      - both the rig probe and the run probe return 404 with error_id ERR_TEST_RESOURCE_NOT_FOUND
      - both the firmware-release probe and the firmware-certification probe return 404 with error_id ERR_FIRMWARE_NOT_FOUND
      - the facility probe returns ERR_FACILITY_NOT_FOUND and the partner probe ERR_PARTNER_NOT_FOUND
      - both the order probe and the order-line probe return 404 with error_id ERR_ORDER_NOT_FOUND
      - the install-job probe returns ERR_INSTALL_JOB_NOT_FOUND and the asset probe ERR_ASSET_NOT_FOUND
      - both the pm-program probe and the maintenance-visit probe return 404 with error_id ERR_SERVICE_PLAN_NOT_FOUND
      - every one of the fourteen responses carries response_type == 'error' with a non-empty data.message and meta.api_request_id
  - name: authentication_is_checked_before_role_path_and_schema
    claim_type: triggerability
    grounds:
    - errors[ERR_UNAUTHENTICATED]
    - validations[priority=1]
    - validations[priority=2]
    - validations[priority=3]
    distinguishing_aspect: The priority-1 check fires on an absent role header and on a syntactically valid but unknown role name ('Auditor'), and it fires even when the same request would ALSO fail the
      path check (unknown id) and the schema check (empty body) — so the response is 401, never 404, 403 or 400. A properly authenticated call to the identical path then returns 404, proving the store state
      was never the reason.
    test_recipe:
      setup:
      - Facility f1 exists and order o1 was created for it.
      - No entity has the id 00000000-0000-4000-8000-000000000000. There is no role named 'Auditor'.
      setup_api_calls:
      - call: POST /facilities
        payload: {account_name: Grandstand Fitness, freight_zone: Z1, credit_limit_cents: 500000000}
        as: OrderPlanner
        captures: {f1: $.data.id}
      - call: POST /orders
        payload: {facility_id: '${f1}', requested_install_window_start: '2026-09-10T08:00:00Z', requested_install_window_end: '2026-09-10T18:00:00Z'}
        as: OrderPlanner
        captures: {o1: $.data.id}
      trigger:
      - call: GET /orders/00000000-0000-4000-8000-000000000000
        payload: {}
        captures: {e_noheader: $.data.error_id}
      - call: GET /orders/${o1}
        payload: {}
        as: Auditor
        captures: {e_unknown_role: $.data.error_id}
      - call: POST /orders/00000000-0000-4000-8000-000000000000/quote
        payload: {}
        as: Auditor
        captures: {e_unknown_role_write: $.data.error_id}
      - call: GET /orders/00000000-0000-4000-8000-000000000000
        payload: {}
        as: OrderPlanner
        captures: {e_authenticated: $.data.error_id}
      - call: GET /orders/${o1}
        payload: {}
        as: OrderPlanner
      assert:
      - the call with no role header returns 401 with error_id ERR_UNAUTHENTICATED (not 404, even though the id does not exist)
      - the call naming the unknown role 'Auditor' on an existing order returns 401 with error_id ERR_UNAUTHENTICATED (not 403)
      - the write with an unknown role, an unknown id and an empty body returns 401 with error_id ERR_UNAUTHENTICATED (priority 1 before 2, 3 and 7)
      - the same GET issued as OrderPlanner returns 404 with error_id ERR_ORDER_NOT_FOUND, isolating the header as the cause of the 401s
      - GET /orders/${o1} as OrderPlanner returns 200 with config_status == CONFIGURING
      - none of the rejected calls changed Order.${o1}.version
  - name: the_fourth_rework_loop_on_one_revision_is_refused
    claim_type: triggerability
    grounds:
    - errors[ERR_REWORK_LIMIT_EXCEEDED]
    - validations[priority=16]
    - domain_constants.REWORK_LIMIT
    - state_machines.ModelRevision.IN_TESTING_to_DRAFT
    distinguishing_aspect: 'The counter is per revision and cumulative across submit/rework cycles: loops 1, 2 and 3 succeed and each bumps rework_count, then the fourth rework returns 409 ERR_REWORK_LIMIT_EXCEEDED
      with the revision left in IN_TESTING rather than dropping to DRAFT.'
    test_recipe:
      setup:
      - Model T900 Treadmill exists with revision T900-R1, which has been submitted for testing (IN_TESTING, rework_count 0).
      - No durability runs have been booked, so nothing else can block the loop.
      setup_api_calls:
      - call: POST /equipment-models
        payload: {name: T900 Treadmill, category: CARDIO, duty_class: FULL_COMMERCIAL, unit_list_price_cents: 479950, shipping_weight_kg: 212.5, allowed_finish_codes: [GRAPHITE]}
        as: ProductEngineer
        captures: {m1: $.data.id, m1_v: $.data.version}
      - call: POST /model-revisions
        payload: {equipment_model_id: '${m1}', revision_code: T900-R1, target_cycle_count: 600000, expected_equipment_model_version: '${m1_v}'}
        as: ProductEngineer
        captures: {r1: $.data.id}
      - call: POST /model-revisions/${r1}/submit-for-testing
        payload: {}
        as: ProductEngineer
      trigger:
      - call: POST /model-revisions/${r1}/rework
        payload: {rework_note: frame weld fixture revised}
        as: ProductEngineer
      - call: POST /model-revisions/${r1}/submit-for-testing
        payload: {}
        as: ProductEngineer
      - call: POST /model-revisions/${r1}/rework
        payload: {rework_note: frame weld fixture revised}
        as: ProductEngineer
      - call: POST /model-revisions/${r1}/submit-for-testing
        payload: {}
        as: ProductEngineer
      - call: POST /model-revisions/${r1}/rework
        payload: {rework_note: frame weld fixture revised}
        as: ProductEngineer
      - call: POST /model-revisions/${r1}/submit-for-testing
        payload: {}
        as: ProductEngineer
      - call: GET /model-revisions/${r1}
        payload: {}
        as: ProductEngineer
      - call: POST /model-revisions/${r1}/rework
        payload: {rework_note: fourth attempt at the weld fixture}
        as: ProductEngineer
        captures: {err_limit: $.data.error_id}
      - call: GET /model-revisions/${r1}
        payload: {}
        as: ProductEngineer
      assert:
      - the first rework returns 200 with status == DRAFT and rework_count == 1
      - the second and third reworks return 200 with rework_count == 2 then 3
      - each re-submit returns 200 with status == IN_TESTING
      - 'immediately before the fourth attempt: rework_count == 3 == REWORK_LIMIT and status == IN_TESTING'
      - the fourth rework returns 409 with error_id ERR_REWORK_LIMIT_EXCEEDED
      - after the refusal ModelRevision.${r1}.status is still IN_TESTING and rework_count is still 3
  - name: cycle_target_not_met_fires_below_the_gate_and_on_an_outstanding_run
    claim_type: triggerability
    grounds:
    - errors[ERR_CYCLE_TARGET_NOT_MET]
    - validations[priority=15]
    - state_machines.ModelRevision.IN_TESTING_to_QUALIFIED
