      - name: noshow_strike_suspends_and_cancels
        grounds: [state_machines.VolunteerShift.SCHEDULED_to_NO_SHOW, state_machines.Volunteer.ACTIVE_to_SUSPENDED, calculations.noshow_strike, "endpoints[POST /ops/run-sweep]"]
        distinguishing_aspect: "Depth-3 cascade triggered by the ops sweep: (1) three past-due SCHEDULED shifts flip NO_SHOW incrementing no_show_count per shift; (2) the third strike crossing >= 3 suspends the volunteer ACTIVE -> SUSPENDED; (3) the suspension cancels the volunteer's remaining SCHEDULED shift (2026-08-20) — a different trigger and propagation pattern than the hour-void cascade."
        test_recipe:
          setup:
            - "Volunteer with three past SCHEDULED shifts (2026-08-02/03/04 09:00-10:00) and one future SCHEDULED shift (2026-08-20 09:00-10:00); clock advanced to 2026-08-10T00:00:00Z"
