              as: ProgramAdmin
            - call: "PATCH /sites/${sid}"
              payload: { status: "OPEN", expected_site_version: "${s_v}" }
              as: ProgramAdmin
          trigger:
            - call: "POST /intake-events"
              payload: { site_id: "${sid}", source_type: "RESIDENT_SELF_HAUL", tree_count: 2, size_class: "SMALL" }
              as: SiteSupervisor
