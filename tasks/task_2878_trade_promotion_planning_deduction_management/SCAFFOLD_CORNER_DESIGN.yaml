          - errors.ERR_STALE_PROMOTION_VERSION
          - validations.priority_31
        distinguishing_aspect: |
          The second §1.2.1 rule: an accrual posted between the client's read and its
          validate advances Promotion.version, so the validate priced off a balance that has
          already moved and is refused with 412 ERR_STALE_PROMOTION_VERSION. Re-reading and
          resending the identical body succeeds. The interleaved writer is a different
          endpoint from the OCC-guarded one, which is what makes the version — not a state
          flag — the thing being checked.
        test_recipe:
          setup:
