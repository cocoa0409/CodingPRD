      - name: delivery_gates_unwind_one_precondition_at_a_time
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=40]
          - validations[priority=43]
          - validations[priority=25]
          - errors[ERR_UNIT_NOT_CERTIFIED]
          - errors[ERR_DRIVER_TRAINING_INCOMPLETE]
          - errors[ERR_ORDER_NOT_ACTIVE]
          - validations[priority=31]
          - endpoints[POST /bus-units/{id}/deliver]
        distinguishing_aspect: |
          deliver enforces three independent preconditions in a fixed order and each is removed one at a
          time on the SAME bus: at BUILT/PENDING it reports ERR_UNIT_NOT_CERTIFIED (40); once CERTIFIED but
          untrained it reports ERR_DRIVER_TRAINING_INCOMPLETE (43); only after assign-dealer and
          complete-driver-training does it return 200 and set delivered_at to the logical clock. The bus
          never leaves BUILT during the two refusals. The successful delivery also bubbles the order to
          FULFILLED, which is the only state from which a further mint reports ERR_ORDER_NOT_ACTIVE.
        test_recipe:
          setup:
            - "TX fixture; SOL-TX-105 for 1 unit awarded with promised_delivery_date 2026-12-01"
            - "One BusUnit advanced to BUILT on line L-A1 with all three TX-required tests PASSED by qc-01"
            - "Dealer D-TX-01 licensed in TX exists but is not yet assigned; clock at 2026-09-20"
