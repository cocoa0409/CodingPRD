            - "response error_id == ERR_BENCH_CALIBRATION_EXPIRED"
            - "ShellTest.${t1_id}.status == SCHEDULED"
            - "ShellTest.${t1_id}.severity_index == null"
            - "ShellTest.${t1_id}.computed_result == null"
            - "EquipmentUnit.${u1_id}.recon_status == INSPECTED"
            - "EquipmentUnit.${u1_id}.current_si == null"
            - "TestBench.${bench_id}.calibration_valid_until == 2026-08-05T00:00:00Z"

      - name: label_issue_blocked_by_owning_account_billing_hold
        grounds:
          - validations.v-account-billing-hold
          - entities.CustomerAccount.fields.status
          - entities.EquipmentUnit.fields.recon_status
