            - { call: "POST /glass/usage-reports", payload: { license_id: "${lic_id}", period_start: "2027-04-01T00:00:00Z", period_end: "2027-06-30T00:00:00Z", lines: [{ channel: "EXPORT", units: 100001, net_revenue_cents: 100001 }] }, as: DeviceMaker, as_user_id: "${m_id}", captures: { r2_rate: $.data.royalty_rate_applied, r2_prov: $.data.provisional_royalty_cents } }
