          difficulty_instance: priority_pair_validation_conflict / tenant_scope_violation_at_priority_22_outranks_hold_quota_exhaustion_at_priority_102
          rationale: "The §1.8 instance already holds a booking as the wrong AnchorTenantRep and asserts ERR_TENANT_SCOPE_VIOLATION, covering the entity-backed identity check for the only role whose identity is not opaque."

  - section: cross_cutting_complexity_layers
    instances:
      - name: changeover_order_create_rejects_a_stale_expected_venue_version_and_accepts_the_fresh_one
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[rule_id=changeover-order-create-stale-venue]
          - errors.ERR_STALE_VENUE_VERSION
          - endpoints[POST /changeover-orders]
        distinguishing_aspect: "A version read before an unrelated hold is placed becomes stale: the create carrying it returns 412 ERR_STALE_VENUE_VERSION without writing anything, and the identical create carrying the re-read version succeeds and bumps Venue.version by exactly one."
        test_recipe:
          setup:
            - "The standard turnaround pair — hockey booking HELD, concert booking CONFIRMED — with the venue version captured, and then a third booking held so that the captured version is one behind."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
            - call: "POST /venues"
              payload: { name: "Lakeside Arena", rigging_capacity_kg: 20000, dock_count: 4, max_bowl_seats: 18000, crew_headcount_cap: 60, min_turnaround_buffer_minutes: 45, dock_buffer_minutes: 30, overnight_shift_start_local_hour: 22 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/configuration-profiles"
              payload: { code: "ICE_HOCKEY", requires_ice: true, ice_cover_required: false, seating_mode: "FULL_BOWL", nominal_seats: 17000, base_changeover_minutes: 240, crew_size_required: 30, floor_protection_panels_required: 0, dehumidification_required_lph: 120, rigging_points_required: 40 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { p_ice: $.data.id }
            - call: "POST /venues/${venue_id}/configuration-profiles"
              payload: { code: "CONCERT_END_STAGE", requires_ice: false, ice_cover_required: true, seating_mode: "CURTAINED_HALF", nominal_seats: 9000, base_changeover_minutes: 300, crew_size_required: 40, floor_protection_panels_required: 120, dehumidification_required_lph: 0, rigging_points_required: 220 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { p_con: $.data.id }
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", config_profile_id: "${p_ice}", title: "Hockey Sep 10", promoter_name: "Lakeside Hockey Promotions", event_start_utc: "2026-09-10T00:00:00Z", event_end_utc: "2026-09-10T03:00:00Z", expected_attendance: 15000, rigging_load_kg: 3000 }
              as: BookingManager
              captures: { b_ice: $.data.id }
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", config_profile_id: "${p_con}", title: "Arena Concert Sep 10", promoter_name: "Northside Live", event_start_utc: "2026-09-10T16:00:00Z", event_end_utc: "2026-09-10T19:00:00Z", expected_attendance: 8000, rigging_load_kg: 5000 }
              as: BookingManager
              captures: { b_con: $.data.id }
            - call: "POST /event-bookings/${b_ice}/hold"
              payload: {}
              as: BookingManager
            - call: "POST /event-bookings/${b_con}/hold"
              payload: {}
              as: BookingManager
            - call: "GET /venues/${venue_id}"
              payload: {}
              as: BookingManager
              captures: { v1: $.data.version }
            - call: "POST /event-bookings/${b_con}/confirm"
              payload: { expected_venue_version: "${v1}" }
              as: BookingManager
            - call: "GET /venues/${venue_id}"
              payload: {}
              as: ChangeoverSupervisor
              as_user_id: "sup-alpha"
              captures: { v_stale: $.data.version }
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", config_profile_id: "${p_ice}", title: "Unrelated hockey Sep 20", promoter_name: "Lakeside Hockey Promotions", event_start_utc: "2026-09-20T00:00:00Z", event_end_utc: "2026-09-20T03:00:00Z", expected_attendance: 15000, rigging_load_kg: 3000 }
              as: BookingManager
              captures: { b_other: $.data.id }
            - call: "POST /event-bookings/${b_other}/hold"
              payload: {}
              as: BookingManager
          trigger:
            - call: "POST /changeover-orders"
              payload: { from_booking_id: "${b_ice}", to_booking_id: "${b_con}", crew_headcount: 40, expected_venue_version: "${v_stale}" }
              as: ChangeoverSupervisor
              as_user_id: "sup-alpha"
              captures: { err: $.data.error_id }
            - call: "GET /venues/${venue_id}"
              payload: {}
              as: ChangeoverSupervisor
              as_user_id: "sup-alpha"
              captures: { v_fresh: $.data.version }
            - call: "POST /changeover-orders"
              payload: { from_booking_id: "${b_ice}", to_booking_id: "${b_con}", crew_headcount: 40, expected_venue_version: "${v_fresh}" }
              as: ChangeoverSupervisor
              as_user_id: "sup-alpha"
              captures: { order: $.data.id, planned: $.data.planned_turnaround_minutes }
          assert:
            - "v_fresh == ${v_stale} + 1, the single bump contributed by holding the unrelated booking ${b_other}"
            - "the first trigger call returns HTTP 412 with err == ERR_STALE_VENUE_VERSION"
            - "GET /changeover-orders?venue_id=${venue_id} returns total_count == 0 immediately after the refusal and Venue.${venue_id}.version is still ${v_fresh}, so a rejected OCC write neither creates a row nor bumps the version"
            - "the third trigger call returns HTTP 201 with ChangeoverOrder.${order}.status == PLANNED and planned == 708"
            - "Venue.${venue_id}.version == ${v_fresh} + 1 after the accepted create"
            - "the stale value ${v_stale} is never accepted again: it remains two behind the current version"

      - name: booking_confirm_rejects_a_stale_expected_venue_version
        claim_type: optimistic_concurrency
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / stale_venue_version_at_priority_45_outranks_expired_hold_at_priority_78_on_confirm
          rationale: "The §1.8 instance is the OCC probe for the second concurrency_rules entry, booking-confirm-stale-venue: it sends a stale expected_venue_version to POST /event-bookings/{id}/confirm, asserts 412, and then replays with the fresh version."

      - name: displacement_cascade_is_verified_end_to_end
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / upheld_challenge_displacement_cascades_four_hops_from_ruling_to_equipment_and_labor_ledgers
          rationale: "The §1.8 instance walks all four hops of the displacement cascade in one recipe and asserts the intermediate rows at every hop, including the equipment and labor ledgers at the far end."

      - name: turnaround_variants_are_both_correct_and_their_delta_is_pinned
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: dual_variant_calc / turnaround_planned_variant_blind_to_rework_and_idle_minutes_while_actual_absorbs_them
          rationale: "The §1.8 instance computes both the PLANNED and the ACTUAL variant on one order and pins the delta that rework and idle minutes create, which is exactly the dual-variant claim."

      - name: the_cover_cycle_threshold_is_tested_at_its_boundary
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: non_linear_state_machine / ice_sheet_cover_uncover_cycle_terminates_by_auto_meltout_on_the_fourth_cover
          rationale: "The §1.8 instance drives cover_cycles to the cumulative limit and shows the auto-meltout firing exactly on the boundary cycle rather than one earlier or later."

  - section: consistency_model
    instances:
      - name: hold_and_release_effects_are_visible_in_the_same_response_and_in_the_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.EventBooking.transitions.HELD_to_RELEASED.side_effects
          - entities.Venue.fields.open_hold_count
          - entities.AnchorTenant.fields.holds_consumed
        distinguishing_aspect: "Every counter and cascade touched by a release — booking status, dock reservation, Venue.open_hold_count, AnchorTenant.holds_consumed and Venue.version — is already correct in the release response itself and in reads issued immediately afterwards, with no second call or delay needed."
        test_recipe:
          setup:
            - "A venue with PROFILE ICE, one TIER_2 anchor tenant, one tenant booking HELD, and one RESERVED dock window on that booking."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
            - call: "POST /venues"
              payload: { name: "Lakeside Arena", rigging_capacity_kg: 20000, dock_count: 4, max_bowl_seats: 18000, crew_headcount_cap: 60, min_turnaround_buffer_minutes: 45, dock_buffer_minutes: 30, overnight_shift_start_local_hour: 22 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/configuration-profiles"
              payload: { code: "ICE_HOCKEY", requires_ice: true, ice_cover_required: false, seating_mode: "FULL_BOWL", nominal_seats: 17000, base_changeover_minutes: 240, crew_size_required: 30, floor_protection_panels_required: 0, dehumidification_required_lph: 120, rigging_points_required: 40 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { p_ice: $.data.id }
            - call: "POST /venues/${venue_id}/anchor-tenants"
              payload: { name: "Lakeside Hockey Club", hold_priority_tier: "TIER_2", guaranteed_holds_per_season: 3 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { t1: $.data.id }
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", config_profile_id: "${p_ice}", title: "Tenant game Sep 10", tenant_id: "${t1}", event_start_utc: "2026-09-10T00:00:00Z", event_end_utc: "2026-09-10T03:00:00Z", expected_attendance: 15000, rigging_load_kg: 3000 }
              as: AnchorTenantRep
              as_user_id: "${t1}"
              captures: { bk: $.data.id }
            - call: "POST /event-bookings/${bk}/hold"
              payload: {}
              as: AnchorTenantRep
              as_user_id: "${t1}"
              captures: { held_status: $.data.status, exp: $.data.hold_expires_at }
            - call: "POST /event-bookings/${bk}/dock-slot-reservations"
              payload: { dock_number: 1, purpose: "LOAD_IN", window_start_utc: "2026-09-09T12:00:00Z", window_end_utc: "2026-09-09T16:00:00Z", truck_count: 10 }
              as: ChangeoverSupervisor
              as_user_id: "sup-alpha"
              captures: { res: $.data.id }
            - call: "GET /venues/${venue_id}"
              payload: {}
              as: BookingManager
              captures: { v_before: $.data.version }
          trigger:
            - call: "POST /event-bookings/${bk}/release"
              payload: { reason: "TENANT_WITHDREW" }
              as: BookingManager
              captures: { rel_status: $.data.status, rel_reason: $.data.release_reason }
          assert:
            - "held_status == HELD and exp == 2026-08-08T00:00:00.000Z from the TIER_2 168-hour window"
            - "the release response itself already carries rel_status == RELEASED and rel_reason == TENANT_WITHDREW"
            - "GET /event-bookings/${bk} issued immediately afterwards returns status == RELEASED, no re-read or delay being required"
            - "GET /event-bookings/${bk}/dock-slot-reservations returns the row ${res} with status == RELEASED and release_reason == BOOKING_GONE, the cascade being visible in the very next read"
            - "GET /venues/${venue_id} returns open_hold_count == 0 and version == ${v_before} + 1"
            - "the AnchorTenant row ${t1} in GET /venues/${venue_id}/anchor-tenants reads holds_consumed == 0, decremented by the release in the same operation"
