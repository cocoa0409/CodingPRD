          trigger:
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${caseA1}", expected_case_version: "${caseA1_v}", document_reference: "DRO-2663-T1", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 3000 }
              as: QdroAnalyst
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${caseA2}", expected_case_version: "${caseA2_v}", document_reference: "DRO-2663-T2", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 2000 }
              as: QdroAnalyst
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${caseB}", expected_case_version: "${caseB_v}", document_reference: "DRO-2663-T3", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000 }
              as: QdroAnalyst
            - call: "GET /segregation-holds"
              payload: { plan_account_id: "${acctA}" }
              as: PlanAdministrator
              captures: { a_first: "$.data[0].hold_amount_cents", a_first_case: "$.data[0].qdro_case_id", a_first_acct: "$.data[0].plan_account_id" }
            - call: "GET /segregation-holds"
              payload: { qdro_case_id: "${caseA2}" }
              as: PlanAdministrator
              captures: { a2_amt: "$.data[0].hold_amount_cents" }
            - call: "GET /participants/${partA}/qdro-cases"
              payload: {}
              as: PlanAdministrator
              captures: { a_case_first: "$.data[0].id" }
          assert:
            - "GET /segregation-holds with plan_account_id=${acctA} returns exactly 2 rows (300000 and 200000) — both of participant A's cases resolve to the SAME PlanAccount, which is precisely the set the aggregate-exposure check consumes; ${a_first_acct} == \"${acctA}\" on every row."
            - "GET /segregation-holds with qdro_case_id=${caseA1} returns exactly 1 row and ${a_first_case} is one of ${caseA1} / ${caseA2} — the two filters are not interchangeable."
            - "${a2_amt} == 200000 and GET /segregation-holds with plan_account_id=${acctB} returns exactly 1 row of 200000 (4000 bps of 500000) — participant B's hold never appears under participant A's account even though the amounts coincide."
            - "GET /plan-accounts/${acctA} reports held_amount_cents 500000 and available_balance_cents 500000, while GET /plan-accounts/${acctB} reports held_amount_cents 200000 and available_balance_cents 300000 — the cross-branch association is aggregated per account, not per case."
            - "GET /participants/${partA}/qdro-cases returns exactly 2 rows and ${a_case_first} is one of ${caseA1} / ${caseA2}; GET /participants/${partB}/qdro-cases returns exactly 1 row."
            - "GET /plans/${plan_id} reports participant_count 2 — the hierarchy's top-level derived count is unaffected by the cross-aggregate holds."

      - name: single_resource_reads_echo_stored_state_for_every_root_collection
        claim_type: retrieval
        grounds:
          - endpoints[GET /plans/{id}]
          - endpoints[GET /participants/{id}]
          - endpoints[GET /plan-accounts/{id}]
          - endpoints[GET /qdro-cases/{id}]
          - endpoints[GET /draft-orders/{id}]
          - endpoints[GET /segregation-holds/{id}]
        distinguishing_aspect: |
          Every root collection exposes a by-id read that returns the persisted row — including the rows
          the server created as SIDE EFFECTS rather than by direct request. The SegregationHold produced by
          a draft-order receipt has no POST of its own, so GET /segregation-holds/{id} is the only proof
          that the cascade actually persisted a row with the right foreign keys, amount and window rather
          than merely echoing numbers into the draft-order response.
        test_recipe:
          setup:
            - "A PUBLISHED plan, one participant, one plan account with an assignable PRE_TAX_DEFERRAL source of 1000000, one case, one received draft at 3000 bps, clock 2026-09-01."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Readback Plan", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST"], earnings_adjustment_method: "PERIOD_END" }
