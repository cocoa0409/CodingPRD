        grounds:
          - concurrency_rules[lot-split-occ]
          - validations[priority=11]
          - errors[ERR_STALE_LOT_VERSION]
        distinguishing_aspect: "The lot's version moves on release, so a split that quotes the version read at creation time is rejected with ERR_STALE_LOT_VERSION 412 at priority 11 — before the state check at 16 and the quantity check at 41 that this same request would otherwise pass — and no child lot appears."
        test_recipe:
          setup:
            - "Flow FLOW-A (LOGIC_N5) RELEASED with one step seq 10 LITHO 2.0h; PLAN-A COMMITTED for 30 starts against a 200.0-hour budget."
            - "LOT-001 (25 wafers) created — its version is captured here — and then RELEASED, which increments that version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
            - call: "POST /fab/recipes"
              payload: { recipe_code: "LITHO-200", tool_type: "LITHO", target_value: 50.00 }
              as: ProcessEngineer
