              as: CrewCoordinator
            - call: "POST /hail-ops/crew-deployments"
              payload: { technician_id: "${tech_b}", facility_id: "${fac}", start_date: "2026-08-21", end_date: "2026-09-05" }
              as: CrewCoordinator
          assert:
            - "the 2026-08-20 call returns 409 with error_id == ERR_TECHNICIAN_DEPLOYMENT_OVERLAP"
            - "the 2026-08-21 call returns 409 with error_id == ERR_TECHNICIAN_DEPLOYMENT_OVERLAP"
            - "the 2026-08-22 call returns 201 and the new CrewDeployment.status == CONFIRMED with start_date == 2026-08-22"
            - "the TB 2026-08-21 call returns 201 and the new CrewDeployment.technician_id == ${tech_b}"
            - "GET /hail-ops/crew-deployments?technician_id=${tech_a} returns total_count == 2"
            - "GET /hail-ops/crew-deployments?technician_id=${tech_b} returns total_count == 1"
            - "CrewDeployment.${dep_a}.effective_end_date == 2026-08-20 and CrewDeployment.${dep_a}.status == CONFIRMED"

