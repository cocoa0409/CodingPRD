              as: DistributorAdmin
              captures: { part_sd_v: $.data.version }
            - call: "POST /allocation-runs"
              payload: { part_id: "${part_sd}", expected_part_version: "${part_sd_v}" }
              as: DistributorAdmin
              captures: { run_sd: $.data.id }
            - call: "POST /lots/${lot_sd}/exposures"
