            - "the persisted row has status DECLINED and decline_reason_code NO_ELIGIBLE_ITEMS"
            - "eligible_subtotal_cents == 0, ebt_tender_cents == 0, other_tender_cents == 0 and split_tender_applied == false"
            - "flagged_line_skus == [BEER-1, HOT-1, CAT-1]"
            - "GET /pos-transactions?store_id=${store_id}&status=DECLINED returns total_count == 1"

      - name: closed_period_refuses_both_a_void_and_a_settlement_import
        claim_type: Violation → Error
        grounds:
          - validations.priority_20_business_integrity
          - errors.ERR_REDEMPTION_PERIOD_CLOSED
        distinguishing_aspect: "Once the period is CLOSED its aggregates are frozen from both directions: voiding a transaction that falls inside it and importing a settlement into it both return 409 ERR_REDEMPTION_PERIOD_CLOSED, and the frozen 1000c total is untouched."
        test_recipe:
          setup:
            - "An authorized store with one 1000c AUTHORIZED sale inside a period that has been closed at 2026-08-02T00:00Z."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
            - *k_submit
            - *k_insp
            - *k_visit
            - *k_start
            - *k_findings
            - *k_decision
            - *k_depot
            - *k_term
            - *k_deploy
            - *k_activate
            - *k_period_aug
