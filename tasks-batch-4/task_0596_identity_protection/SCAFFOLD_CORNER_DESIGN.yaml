            - call: "POST /idp/subscribers"
              payload: { email: "v6@example.com", full_name: "Bad Token", date_of_birth: "1987-07-27", ssn_last4: "4444", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /idp/subscribers/${sub_id}/verify"
              payload: { verification_token: "not-the-real-token" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with error_id == 'ERR_INVALID_VERIFICATION_TOKEN'"
            - "Subscriber.${sub_id}.enrollment_status == 'PENDING_VERIFICATION'"
            - "GET /idp/subscribers/${sub_id}/bureau-profiles returns 0 elements"

      - name: claim_submit_with_underwriting_risk_above_75_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=22]
          - errors[ERR_UNDERWRITING_RISK_TOO_HIGH]
          - calculations.identity_risk_score
        distinguishing_aspect: "After the claim's own case is resolved, four other CONFIRMED_FRAUD alerts (SSN_TRACE x2 = 50, ACCOUNT_TAKEOVER = 20, CREDIT_INQUIRY = 8) leave underwriting_risk_score at 88 > 75, so submit is rejected with ERR_UNDERWRITING_RISK_TOO_HIGH (409)."
        test_recipe:
          setup:
            - "Verified subscriber; one DARK_WEB alert acknowledged + confirmed -> its case is assigned, engaged and RESOLVED (so that alert now contributes 0)."
            - "Four further alerts acknowledged and confirmed as fraud, all with OPEN cases: SSN_TRACE, SSN_TRACE, ACCOUNT_TAKEOVER, CREDIT_INQUIRY."
            - "underwriting_risk_score is therefore 10 + 25 + 25 + 20 + 8 == 88."
            - "A DRAFT claim exists on the resolved case."
          setup_api_calls:
            - call: "POST /idp/plans"
              payload: { tier: "ULTIMATE", monthly_fee_cents: 3499, insurance_limit_cents: 500000, max_family_members: 4, child_monitoring_included: true, bureau_scope: "TRI", min_specialist_tier: "TIER1" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /idp/subscribers"
              payload: { email: "v7@example.com", full_name: "High Risk", date_of_birth: "1978-08-08", ssn_last4: "4545", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { sub_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /idp/subscribers/${sub_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /idp/specialists"
              payload: { full_name: "Solo Worker", tier: "TIER3", max_caseload: 5, max_concurrent_engagements: 1 }
              as: PlatformAdmin
              captures: { sp_id: $.data.id }
            - call: "POST /idp/alerts"
              payload: { subscriber_id: "${sub_id}", alert_type: "DARK_WEB", severity: "LOW", source_detail: "base case alert" }
              as: PlatformAdmin
              captures: { a_base: $.data.id }
            - call: "POST /idp/alerts/${a_base}/acknowledge"
              payload: {}
              as: PlatformAdmin
            - call: "POST /idp/alerts/${a_base}/confirm-fraud"
              payload: {}
              as: PlatformAdmin
            - call: "GET /idp/restoration-cases"
              payload: { origin_alert_id: "${a_base}" }
              as: PlatformAdmin
              captures: { case_id: "$.data[0].id" }
            - call: "POST /idp/restoration-cases/${case_id}/assign"
              payload: { specialist_id: "${sp_id}" }
              as: PlatformAdmin
            - call: "GET /idp/specialists/${sp_id}"
              payload: {}
              as: PlatformAdmin
              captures: { sp_v: $.data.version }
            - call: "POST /idp/specialist-engagements"
              payload: { specialist_id: "${sp_id}", case_id: "${case_id}", window_start: "2026-05-25T09:00:00Z", window_end: "2026-05-25T11:00:00Z", expected_specialist_version: "${sp_v}" }
              as: PlatformAdmin
            - call: "POST /idp/restoration-cases/${case_id}/resolve"
              payload: { resolution_summary: "Base case closed." }
              as: RestorationSpecialist
              as_user_id: "${sp_id}"
            - call: "GET /idp/restoration-cases/${case_id}"
              payload: {}
              as: PlatformAdmin
              captures: { case_v: $.data.version }
            - call: "POST /idp/insurance-claims"
              payload:
                case_id: "${case_id}"
                expected_case_version: "${case_v}"
                expenses:
                  - { category: "LEGAL_FEES", amount_cents: 60000, documented: true }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /idp/alerts"
              payload: { subscriber_id: "${sub_id}", alert_type: "SSN_TRACE", severity: "MEDIUM", source_detail: "ssn hit 1" }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /idp/alerts/${a1}/acknowledge"
              payload: {}
              as: PlatformAdmin
            - call: "POST /idp/alerts/${a1}/confirm-fraud"
              payload: {}
              as: PlatformAdmin
            - call: "POST /idp/alerts"
              payload: { subscriber_id: "${sub_id}", alert_type: "SSN_TRACE", severity: "MEDIUM", source_detail: "ssn hit 2" }
              as: PlatformAdmin
              captures: { a2: $.data.id }
            - call: "POST /idp/alerts/${a2}/acknowledge"
              payload: {}
              as: PlatformAdmin
            - call: "POST /idp/alerts/${a2}/confirm-fraud"
              payload: {}
              as: PlatformAdmin
            - call: "POST /idp/alerts"
              payload: { subscriber_id: "${sub_id}", alert_type: "ACCOUNT_TAKEOVER", severity: "MEDIUM", source_detail: "ato hit" }
              as: PlatformAdmin
              captures: { a3: $.data.id }
            - call: "POST /idp/alerts/${a3}/acknowledge"
              payload: {}
              as: PlatformAdmin
            - call: "POST /idp/alerts/${a3}/confirm-fraud"
              payload: {}
              as: PlatformAdmin
            - call: "POST /idp/alerts"
              payload: { subscriber_id: "${sub_id}", alert_type: "CREDIT_INQUIRY", severity: "LOW", source_detail: "inquiry hit" }
              as: PlatformAdmin
              captures: { a4: $.data.id }
            - call: "POST /idp/alerts/${a4}/acknowledge"
              payload: {}
              as: PlatformAdmin
            - call: "POST /idp/alerts/${a4}/confirm-fraud"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /idp/insurance-claims/${claim_id}/submit"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Subscriber.${sub_id}.underwriting_risk_score == 88"
            - "Subscriber.${sub_id}.insurance_status == 'AVAILABLE' (the fiscal rule is NOT the one that fires)"
            - "HTTP 409 with error_id == 'ERR_UNDERWRITING_RISK_TOO_HIGH'"
            - "InsuranceClaim.${claim_id}.status == 'DRAFT' AND provisional_amount_cents == null"

      - name: error_insurance_exhausted_on_submit
        claim_type: Violation → Error
        grounds: ["errors[ERR_INSURANCE_EXHAUSTED]"]
        excluded_because:
          difficulty_instance: transitive_cascade / pay_cascade_remaining_then_exhausted_then_submit_blocked
          rationale: "Asserted as hop 4 of the named §1.8 cascade instance."

      - name: error_invalid_state_priority_over_fiscal
        claim_type: Priority Ordering
        grounds: ["errors[ERR_INVALID_STATE]", "validations[priority=8]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / submit_state_beats_fiscal_exhausted
          rationale: "The state-vs-fiscal priority ordering is the whole point of the named §1.8 instance."

      - name: error_case_not_resolved_on_submit
        claim_type: Cross-entity validation
        grounds: ["errors[ERR_CASE_NOT_RESOLVED]", "validations[priority=9]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / claim_submit_requires_case_resolved
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_enrollment_not_active_on_assign
        claim_type: Cross-entity validation
        grounds: ["errors[ERR_ENROLLMENT_NOT_ACTIVE]", "validations[priority=10]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / case_assign_requires_subscriber_enrollment_active
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_thaw_window_overlap
        claim_type: Temporal validation
        grounds: ["errors[ERR_THAW_WINDOW_OVERLAP]", "validations[priority=16]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / thaw_window_closed_interval_touching_endpoint_collides
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_engagement_capacity_exceeded
        claim_type: Temporal validation
        grounds: ["errors[ERR_ENGAGEMENT_CAPACITY_EXCEEDED]", "validations[priority=17]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / engagement_half_open_plus_60min_buffer_capacity_conflict
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_specialist_at_capacity_and_tier_insufficient
        claim_type: Priority conflict
        grounds: ["errors[ERR_SPECIALIST_AT_CAPACITY]", "errors[ERR_SPECIALIST_TIER_INSUFFICIENT]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / assign_safety_tier_beats_constraint_caseload
          rationale: "Both error conditions are provoked and their ordering asserted by the named §1.8 instance; ERR_SPECIALIST_AT_CAPACITY alone is also asserted by boundary_precision_check / specialist_capacity_boundary_is_gte_not_gt."

  # =========================================================================
  - section: endpoints
    instances:
      - name: clock_startup_default_is_2026_05_01
        claim_type: Computed read
        grounds:
          - endpoints.POST_/idp/_clock/set_current_utc
          - entities.BureauProfile.fields.score_pulled_at
        distinguishing_aspect: "Before any set_current_utc call the logical clock reads exactly 2026-05-01T00:00:00Z, so the first score-refresh stamps score_pulled_at with that instant rather than wall-clock time."
        test_recipe:
          setup: ["Verified subscriber on a TRI plan; the clock endpoint has NOT been called."]
          setup_api_calls:
            - call: "POST /idp/plans"
              payload: { tier: "ULTIMATE", monthly_fee_cents: 3499, insurance_limit_cents: 500000, max_family_members: 4, child_monitoring_included: true, bureau_scope: "TRI", min_specialist_tier: "TIER1" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /idp/subscribers"
              payload: { email: "ep1@example.com", full_name: "Clock Default", date_of_birth: "1990-01-01", ssn_last4: "4646", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { sub_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /idp/subscribers/${sub_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "GET /idp/subscribers/${sub_id}/bureau-profiles"
              payload: {}
              as: PlatformAdmin
              captures: { bp_eq: "$.data[0].id" }
          trigger:
            - call: "POST /idp/bureau-profiles/${bp_eq}/score-refresh"
              payload: { credit_score: 710 }
              as: PlatformAdmin
          assert:
            - "BureauProfile.${bp_eq}.score_pulled_at == '2026-05-01T00:00:00.000Z'"
            - "BureauProfile.${bp_eq}.credit_score == 710"
            - "Subscriber.${sub_id}.composite_credit_score == 710 AND monitoring_status == 'MONITORED'"

      - name: alerts_filtered_by_family_member_id
        claim_type: Cross-reference link
        grounds:
          - endpoints.GET_/idp/alerts
          - entities.Alert.fields.family_member_id
        distinguishing_aspect: "GET /idp/alerts?family_member_id=<child> returns only the child's alert, not the subscriber-level alert on the same account."
        test_recipe:
          setup: ["Verified subscriber with one CHILD family member; one alert on the subscriber (family_member_id null) and one alert on the child."]
          setup_api_calls:
            - call: "POST /idp/plans"
              payload: { tier: "ULTIMATE", monthly_fee_cents: 3499, insurance_limit_cents: 500000, max_family_members: 4, child_monitoring_included: true, bureau_scope: "TRI", min_specialist_tier: "TIER1" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /idp/subscribers"
              payload: { email: "ep2@example.com", full_name: "Filter Test", date_of_birth: "1990-01-01", ssn_last4: "4747", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { sub_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /idp/subscribers/${sub_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /idp/subscribers/${sub_id}/family-members"
              payload: { full_name: "Filter Kid", date_of_birth: "2019-09-09", ssn_last4: "4848", relationship: "CHILD" }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { fm_child: $.data.id }
            - call: "POST /idp/alerts"
              payload: { subscriber_id: "${sub_id}", alert_type: "DARK_WEB", severity: "LOW", source_detail: "adult alert" }
              as: PlatformAdmin
              captures: { a_adult: $.data.id }
            - call: "POST /idp/alerts"
              payload: { subscriber_id: "${sub_id}", family_member_id: "${fm_child}", alert_type: "SSN_TRACE", severity: "HIGH", source_detail: "child alert" }
              as: PlatformAdmin
              captures: { a_child: $.data.id }
          trigger:
            - call: "GET /idp/alerts"
              payload: { family_member_id: "${fm_child}" }
              as: PlatformAdmin
          assert:
            - "Exactly 1 element returned; its id == ${a_child}; total_count == 1"
            - "${a_adult} is NOT in the result set"
            - "GET /idp/alerts filtered by subscriber_id == ${sub_id} returns 2 elements"

