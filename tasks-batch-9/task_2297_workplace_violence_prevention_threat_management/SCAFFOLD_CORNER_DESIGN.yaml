# =============================================================================
# 1.9 Scaffold Corner Design (breadth probe)
#
# Task 2297 - Workplace Violence Prevention & Threat Management.
# A walk of references/claim-extraction-guide.md against SCAFFOLD.yaml
# 1.1-1.7. The nine guide sections are the section: values and the guide
# rows are the claim_type: values; nothing outside the guide is invented.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an
# excluded_because stub naming the covering 1.8 instance and no test_recipe.
# Every pinned numeric literal was computed by executing the matching
# calculations[].formula with Decimal / ROUND_HALF_UP.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: worksite_creation_returns_all_declared_fields
        claim_type: creation
        grounds:
          - entities.Worksite
          - endpoints[POST /worksites]
          - roles.ProgramAdmin.exclusive_operations
        distinguishing_aspect: |
          POST /worksites returns 201 with every declared Worksite field populated: the three input
          fields echoed, both computed fields at their declared defaults and the common id / created_at /
          updated_at / version block present, which is the baseline no other instance asserts.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z (the mandatory default)."
            - "No rows of any kind exist yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /worksites"
              payload: { name: "North Plant", state_code: "CA", employee_count: 20 }
              as: ProgramAdmin
              captures: { ws_id: $.data.id }
          assert:
            - "The trigger returns HTTP 201"
            - "Worksite.${ws_id}.name == \"North Plant\", state_code == \"CA\" and employee_count == 20"
            - "Worksite.${ws_id}.violent_incident_count_12mo == 0 and high_risk_flag == false"
            - "Worksite.${ws_id}.id is a non-empty string, version == 1, created_at == 2026-08-01T00:00:00Z and updated_at == 2026-08-01T00:00:00Z"
      - name: work_area_retrieval_returns_stored_fields_and_null_hazard_score
        claim_type: retrieval
        grounds:
          - entities.WorkArea
          - endpoints[GET /work-areas/{work_area_id}]
          - entities.WorkArea.fields.current_hazard_score
          - entities.WorkArea.fields.restricted_employee_count
        distinguishing_aspect: |
          GET /work-areas/{work_area_id} echoes back exactly what POST stored and shows both computed
          counters at their pre-activity values, including current_hazard_score == null because the
          worksite has no ACTIVE or REVIEW_DUE PreventionPlan yet - a null that no other instance pins.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z."
            - "Worksite \"North Plant\" (state_code CA, employee_count 20) exists."
            - "WorkArea \"Front Desk\" (job_function CASH_HANDLING, public_access_flag true, lone_worker_flag false, night_shift_flag true, occupancy_cap 8) exists; no PreventionPlan and no HazardAssessment exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /worksites"
              payload: { name: "North Plant", state_code: "CA", employee_count: 20 }
              as: ProgramAdmin
              captures: { ws_id: $.data.id }
            - call: "POST /work-areas"
              payload: { worksite_id: "${ws_id}", name: "Front Desk", job_function: "CASH_HANDLING", public_access_flag: true, lone_worker_flag: false, night_shift_flag: true, occupancy_cap: 8 }
              as: ProgramAdmin
              captures: { wa_front_id: $.data.id }
          trigger:
            - call: "GET /work-areas/${wa_front_id}"
              payload: {}
              as: ProgramAdmin
              captures: { read_area_id: $.data.id }
          assert:
            - "The trigger returns HTTP 200 and ${read_area_id} == ${wa_front_id}"
            - "The response worksite_id == ${ws_id}, name == \"Front Desk\" and job_function == CASH_HANDLING"
            - "The response public_access_flag == true, lone_worker_flag == false, night_shift_flag == true and occupancy_cap == 8"
            - "The response restricted_employee_count == 0 and current_hazard_score == null (no ACTIVE or REVIEW_DUE plan governs the area)"
            - "The response version == 1"
      - name: incident_report_listing_paginates_and_filters_by_triage_status
        claim_type: listing
        grounds:
          - endpoints[GET /incident-reports]
          - entities.IncidentReport.fields.triage_status
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          GET /incident-reports narrows a two-row table to one row with the triage_status query filter
          and reports the filtered total_count together with has_more false, and a limit of 1 with
          offset 1 over the unfiltered set flips has_more, which pins the pagination envelope rather
          than any single entity field.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z (the mandatory default)."
            - "Worksite \"North Plant\" with employee_count 20 and one WorkArea \"Front Desk\" (public_access_flag true, night_shift_flag true, lone_worker_flag false, occupancy_cap 8)."
            - "Eleven ACTIVE Employee rows back the entity_backed roles: Sofia Ortiz (SafetyOfficer), Marcus Reed (SiteManager), Dana Kim (ThreatTeamLead, discipline HR), Ivan Petrov (SECURITY), Grace Liu (OPERATIONS), Nora Bell (CLINICAL), Omar Haddad (LEGAL), Priya Nair (HRPartner), Luis Vega (SecurityCoordinator), Ana Torres (reporter) and Karl Frey (subject)."
            - "One IncidentReport filed through WEB_FORM (weapon_involved true, FIRST_AID, TYPE_3_COWORKER) has been triaged ESCALATE, so its triage_status is ESCALATED."
            - "A second IncidentReport filed through SUPERVISOR (weapon_involved false, NONE, TYPE_2_CLIENT) is untouched, so its triage_status is still NEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /worksites"
              payload: { name: "North Plant", state_code: "CA", employee_count: 20 }
              as: ProgramAdmin
              captures: { ws_id: $.data.id }
            - call: "POST /work-areas"
              payload: { worksite_id: "${ws_id}", name: "Front Desk", job_function: "CASH_HANDLING", public_access_flag: true, lone_worker_flag: false, night_shift_flag: true, occupancy_cap: 8 }
              as: ProgramAdmin
              captures: { wa_front_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Sofia Ortiz", job_function: "ADMIN" }
              as: ProgramAdmin
              captures: { so_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Marcus Reed", job_function: "ADMIN" }
              as: ProgramAdmin
              captures: { sm_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Dana Kim", job_function: "ADMIN", team_discipline: "HR" }
              as: ProgramAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Ivan Petrov", job_function: "ADMIN", team_discipline: "SECURITY" }
              as: ProgramAdmin
              captures: { sec_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Grace Liu", job_function: "ADMIN", team_discipline: "OPERATIONS" }
              as: ProgramAdmin
              captures: { ops_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Nora Bell", job_function: "ADMIN", team_discipline: "CLINICAL" }
              as: ProgramAdmin
              captures: { clin_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Omar Haddad", job_function: "ADMIN", team_discipline: "LEGAL" }
              as: ProgramAdmin
              captures: { legal_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Priya Nair", job_function: "ADMIN" }
              as: ProgramAdmin
              captures: { hr_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Luis Vega", job_function: "ADMIN" }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Ana Torres", job_function: "ADMIN" }
              as: ProgramAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Karl Frey", job_function: "ADMIN" }
              as: ProgramAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /incident-reports"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", reporter_employee_id: "${rep_id}", subject_employee_id: "${subj_id}", channel: "WEB_FORM", occurred_at: "2026-07-30T14:00:00Z", narrative: "Co-worker brandished a box cutter during a shift handover argument.", incident_type: "TYPE_3_COWORKER", weapon_involved: true, injury_level: "FIRST_AID" }
              as: Employee
              as_user_id: "${rep_id}"
              captures: { rep_report_id: $.data.id }
            - call: "POST /incident-reports/${rep_report_id}/triage"
              payload: { disposition: "ESCALATE", triage_note: "Weapon present; convening the threat assessment team." }
              as: SafetyOfficer
              as_user_id: "${so_id}"
            - call: "POST /incident-reports"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", reporter_employee_id: "${rep_id}", channel: "SUPERVISOR", occurred_at: "2026-07-29T08:00:00Z", narrative: "Client refused to leave the lobby and shouted at the receptionist.", incident_type: "TYPE_2_CLIENT", weapon_involved: false, injury_level: "NONE" }
              as: Employee
              as_user_id: "${rep_id}"
              captures: { new_report_id: $.data.id }
          trigger:
            - call: "GET /incident-reports"
              payload: { worksite_id: "${ws_id}", triage_status: "NEW" }
              as: SafetyOfficer
              as_user_id: "${so_id}"
            - call: "GET /incident-reports"
              payload: { worksite_id: "${ws_id}", limit: 1, offset: 1 }
              as: SafetyOfficer
              as_user_id: "${so_id}"
          assert:
            - "The first trigger call returns HTTP 200 with total_count == 1 and has_more == false"
            - "The first trigger call data array holds exactly one element whose id == ${new_report_id} and triage_status == NEW"
            - "The second trigger call returns HTTP 200 with total_count == 2, limit == 1, offset == 1 and has_more == false"
            - "The second trigger call data array holds exactly one element (offset 1 of 2 rows ordered by created_at)"
      - name: threat_case_not_found_returns_404
        claim_type: not_found
        grounds:
          - endpoints[GET /threat-cases/{threat_case_id}]
          - errors[ERR_THREAT_CASE_NOT_FOUND]
          - validations[priority=5]
        distinguishing_aspect: |
          A syntactically valid but unknown threat_case_id on an authorised GET resolves to
          ERR_THREAT_CASE_NOT_FOUND at priority 5, proving path-id existence is checked for reads and
          not only for the action endpoints that mutate a case.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z (the mandatory default)."
            - "Worksite \"North Plant\" with employee_count 20 and one WorkArea \"Front Desk\" (public_access_flag true, night_shift_flag true, lone_worker_flag false, occupancy_cap 8)."
            - "Eleven ACTIVE Employee rows back the entity_backed roles: Sofia Ortiz (SafetyOfficer), Marcus Reed (SiteManager), Dana Kim (ThreatTeamLead, discipline HR), Ivan Petrov (SECURITY), Grace Liu (OPERATIONS), Nora Bell (CLINICAL), Omar Haddad (LEGAL), Priya Nair (HRPartner), Luis Vega (SecurityCoordinator), Ana Torres (reporter) and Karl Frey (subject)."
            - "No ThreatCase row exists."
          setup_api_calls:
