              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_id}", calendar_quarter: "2025-Q1", gross_wages_cents: 300000 }
              as: ProgramAdmin
            - call: "POST /ui/claims"
              payload: { claimant_id: "${clmt_id}", filed_date: "2026-04-05" }
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /ui/claims/${claim_id}/submit"
              payload: {}
              as: Claimant
              as_user_id: "${clmt_id}"
            - call: "POST /ui/determinations"
              payload: { claim_id: "${claim_id}", determination_type: "MONETARY" }
              as: Adjudicator
            - call: "POST /ui/weekly-certifications"
              payload: { claim_id: "${claim_id}", week_ending_date: "2026-04-11" }
              as: Claimant
              as_user_id: "${clmt_id}"
