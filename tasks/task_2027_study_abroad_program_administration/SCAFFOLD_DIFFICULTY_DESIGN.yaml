            - call: "GET /api/v1/insurance-enrollments"
              payload: { application_id: "${app_id}" }
              as: ProgramCoordinator
              captures: { ins_status: "$.data[0].status" }
          assert:
            - "link 1: Program.${prog_id}.status == SUSPENDED"
            - "link 2: Application.${app_id}.status == WITHDRAWN and withdraw_reason == SYSTEM_SUSPENSION"
            - "link 3a: BillingStatement.${stmt_id}.status == VOID, credit_memo_cents == 200000 (equals the pre-cascade amount_paid_cents), outstanding_cents == 0"
