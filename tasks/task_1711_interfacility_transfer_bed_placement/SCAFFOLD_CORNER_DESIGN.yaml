        distinguishing_aspect: "Zero-denominator edge: taking the facility's only bed OUT_OF_SERVICE leaves operational_bed_count 0, occupancy_pct pins to 100.0, and the saturation rule fires (auto ALL_UNITS diversion)."
        test_recipe:
          setup: ["facility RCV with exactly one bed"]
          setup_api_calls:
