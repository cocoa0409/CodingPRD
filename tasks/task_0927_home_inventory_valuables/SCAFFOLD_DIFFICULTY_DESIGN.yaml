scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: acv_at_loss_date_diverges_from_acv_at_current_clock
        grounds:
          - calculations.item_actual_cash_value
          - calculations.claim_settlement_allocation
          - entities.Item.fields.acv_value_cents
          - entities.ClaimLine.fields.gross_value_cents
          - state_machines.LossClaim.status.OPEN_to_SUBMITTED
        distinguishing_aspect: |
          This instance is dual-variant on the Item domain: the SAME item row yields
          acv_value_cents = 353333 under the AT_CURRENT_CLOCK variant and
          gross_value_cents = 366667 under the AT_LOSS_DATE variant, a 13334-cent
          divergence caused solely by which instant supplies age_months.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z; an ELECTRONICS CategorySchedule with 20%/year depreciation and a 10% salvage floor."
            - "A PLUS household with one CATALOGED ELECTRONICS item acquired 2026-01-01, purchase price 400000 cents, declared 350000 cents, evidence tier PHOTO_SERIAL."
            - "A bound policy with deductible 100000 and a GENERATED documentation package snapshotted at 2026-05-01."
            - "Clock advanced to 2026-08-01 (still inside the package's 180-day validity window); a loss claim with loss_date 2026-06-01 on settlement_basis ACV carrying one line for the item."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vault/category-schedules"
              payload: { category: "ELECTRONICS", useful_life_months: 60, annual_depreciation_pct: 20.0, salvage_floor_pct: 10.0, blanket_sublimit_cents: 500000, appraisal_scope: "ELECTRONICS", serial_required: true }
              as: PlatformAdmin
            - call: "POST /vault/members"
              payload: { email: "owner.a@example.com", full_name: "Owner A" }
              as: Anonymous
              captures: { owner_id: $.data.id }
            - call: "POST /vault/households"
              payload: { name: "Maple House", address_label: "12 Maple St" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { hh_id: $.data.id }
            - call: "POST /vault/subscriptions"
              payload: { household_id: "${hh_id}", tier: "PLUS" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /vault/subscriptions/${sub_id}/billing-event"
              payload: { outcome: "PAYMENT_SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /vault/rooms"
              payload: { household_id: "${hh_id}", name: "Study", floor_label: "1" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { room_id: $.data.id }
            - call: "POST /vault/items"
              payload: { household_id: "${hh_id}", room_id: "${room_id}", name: "Studio Monitor", category: "ELECTRONICS", acquired_at: "2026-01-01T00:00:00Z", quantity: 1, serial_number: "SM-4400", purchase_price_cents: 400000 }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { it_id: $.data.id }
            - call: "POST /vault/items/${it_id}/assets"
              payload: { asset_kind: "PHOTO", byte_size: 120000, checksum: "sha-a1", captured_at: "2026-05-01T00:00:00Z" }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/items/${it_id}/declare-value"
              payload: { declared_value_cents: 350000 }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/policies"
              payload: { household_id: "${hh_id}", carrier_name: "Northwind Mutual", policy_number: "NW-1001", deductible_cents: 100000, scheduled_allowance_cents: 1000000, effective_from: "2026-05-01T00:00:00Z" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { pol_id: $.data.id }
            - call: "POST /vault/packages"
              payload: { household_id: "${hh_id}", policy_id: "${pol_id}" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { pkg_id: $.data.id }
            - call: "GET /vault/households/${hh_id}"
              payload: {}
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { hh_v: $.data.version }
            - call: "POST /vault/packages/${pkg_id}/generate"
              payload: { expected_household_version: "${hh_v}" }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vault/claims"
              payload: { household_id: "${hh_id}", package_id: "${pkg_id}", policy_id: "${pol_id}", loss_date: "2026-06-01T00:00:00Z", peril: "WATER", settlement_basis: "ACV", affected_room_ids: ["${room_id}"], deductible_mode: "PRO_RATA" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { clm_id: $.data.id }
            - call: "POST /vault/claims/${clm_id}/lines"
              payload: { item_id: "${it_id}", claimed_quantity: 1 }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { cl_id: $.data.id }
          trigger:
            - call: "POST /vault/claims/${clm_id}/submit"
              payload: {}
              as: Homeowner
              as_user_id: "${owner_id}"
          assert:
            - "Item.${it_id}.acv_value_cents == 353333"
            - "Item.${it_id}.effective_value_basis == ACV"
            - "Item.${it_id}.effective_value_cents == 353333"
            - "ClaimLine.${cl_id}.gross_value_cents == 366667"
            - "ClaimLine.${cl_id}.capped_value_cents == 366667"
            - "ClaimLine.${cl_id}.deductible_share_cents == 100000"
            - "ClaimLine.${cl_id}.net_settlement_cents == 266667"
            - "ClaimLine.${cl_id}.gross_value_cents - Item.${it_id}.acv_value_cents == 13334"

      - name: coverage_gap_scheduled_first_diverges_from_blanket_first
        grounds:
          - calculations.policy_coverage_gap
          - entities.Policy.fields.coverage_gap_cents
          - entities.Item.fields.coverage_mode
          - endpoints.GET /vault/policies/{policy_id}/coverage-gap
        distinguishing_aspect: |
          This instance is dual-variant on the Policy domain, a different entity domain
          from the Item-level ACV instance: identical items produce coverage_gap_cents
          = 100000 under SCHEDULED_FIRST and 300000 under BLANKET_FIRST, because in
          BLANKET_FIRST the earlier-created scheduled item consumes the JEWELRY
          sublimit and then has no residual left to draw on the scheduled allowance.
        test_recipe:
          setup:
            - "A JEWELRY CategorySchedule with a 300000-cent blanket sublimit."
            - "A PLUS household with a policy whose scheduled_allowance_cents is 1000000."
            - "Item A created first: declared 200000, no purchase price, SCHEDULED at 200000 on the policy."
            - "Item B created second: declared 400000, no purchase price, left on BLANKET."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vault/category-schedules"
              payload: { category: "JEWELRY", useful_life_months: 240, annual_depreciation_pct: 4.0, salvage_floor_pct: 40.0, blanket_sublimit_cents: 300000, appraisal_scope: "JEWELRY", serial_required: false }
              as: PlatformAdmin
            - call: "POST /vault/members"
              payload: { email: "owner.b@example.com", full_name: "Owner B" }
              as: Anonymous
              captures: { owner_id: $.data.id }
            - call: "POST /vault/households"
              payload: { name: "Birch House", address_label: "8 Birch Ln" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { hh_id: $.data.id }
            - call: "POST /vault/subscriptions"
              payload: { household_id: "${hh_id}", tier: "PLUS" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /vault/subscriptions/${sub_id}/billing-event"
              payload: { outcome: "PAYMENT_SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /vault/rooms"
              payload: { household_id: "${hh_id}", name: "Dressing Room", floor_label: "2" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { room_id: $.data.id }
            - call: "POST /vault/policies"
              payload: { household_id: "${hh_id}", carrier_name: "Northwind Mutual", policy_number: "NW-2002", deductible_cents: 50000, scheduled_allowance_cents: 1000000, effective_from: "2026-05-01T00:00:00Z" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { pol_id: $.data.id }
            - call: "POST /vault/items"
              payload: { household_id: "${hh_id}", room_id: "${room_id}", name: "Sapphire Ring", category: "JEWELRY", acquired_at: "2024-01-01T00:00:00Z", quantity: 1 }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { it_a: $.data.id }
            - call: "POST /vault/items/${it_a}/assets"
              payload: { asset_kind: "PHOTO", byte_size: 90000, checksum: "sha-b1", captured_at: "2026-05-01T00:00:00Z" }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/items/${it_a}/declare-value"
              payload: { declared_value_cents: 200000 }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/items"
              payload: { household_id: "${hh_id}", room_id: "${room_id}", name: "Pearl Necklace", category: "JEWELRY", acquired_at: "2024-02-01T00:00:00Z", quantity: 1 }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { it_b: $.data.id }
            - call: "POST /vault/items/${it_b}/assets"
              payload: { asset_kind: "PHOTO", byte_size: 90000, checksum: "sha-b2", captured_at: "2026-05-01T00:00:00Z" }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/items/${it_b}/declare-value"
              payload: { declared_value_cents: 400000 }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "GET /vault/policies/${pol_id}"
              payload: {}
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { pol_v: $.data.version }
            - call: "POST /vault/items/${it_a}/schedule"
              payload: { policy_id: "${pol_id}", scheduled_value_cents: 200000, expected_policy_version: "${pol_v}" }
              as: Homeowner
              as_user_id: "${owner_id}"
          trigger:
            - call: "GET /vault/policies/${pol_id}/coverage-gap"
              payload: { basis: "SCHEDULED_FIRST" }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "GET /vault/policies/${pol_id}/coverage-gap"
              payload: { basis: "BLANKET_FIRST" }
              as: Homeowner
              as_user_id: "${owner_id}"
          assert:
            - "SCHEDULED_FIRST response data.total_value_cents == 600000"
            - "SCHEDULED_FIRST response data.total_covered_cents == 500000"
            - "SCHEDULED_FIRST response data.coverage_gap_cents == 100000"
            - "SCHEDULED_FIRST response data.item_count == 2"
            - "SCHEDULED_FIRST response data.schedule_required_unscheduled_count == 0"
            - "BLANKET_FIRST response data.total_covered_cents == 300000"
            - "BLANKET_FIRST response data.coverage_gap_cents == 300000"
            - "Policy.${pol_id}.coverage_gap_cents == 100000"

  - rule_id: combinatorial_formula
    instances:
      - name: package_snapshot_rounds_each_line_before_summing
        grounds:
          - calculations.package_totals_snapshot
          - calculations.item_actual_cash_value
          - entities.PackageLine.fields.snapshot_effective_value_cents
          - entities.DocumentationPackage.fields.snapshot_total_effective_cents
          - state_machines.DocumentationPackage.status.DRAFT_to_GENERATED
        distinguishing_aspect: |
          Mode (b) - nested rounding where the order changes the cents. Three identical
          FURNITURE items each have an exact ACV of 189990.5 cents at the snapshot
          instant. Rounding per line first yields 3 x 189991 = 569973; summing the exact
          values first and rounding once yields 569972. The scaffold pins round-per-line,
          so snapshot_total_effective_cents must be 569973.
        test_recipe:
          setup:
            - "A FURNITURE CategorySchedule with 10%/year depreciation, a 10% salvage floor and a 400000-cent blanket sublimit."
            - "Three CATALOGED FURNITURE items, each purchase price 199990 cents, acquired 2025-11-01, declared 150000, one PHOTO each."
            - "Clock at 2026-05-01, so every item's age is exactly 181 days = 6 whole 30-day months and the exact ACV is 199990 * 0.95 = 189990.5."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vault/category-schedules"
              payload: { category: "FURNITURE", useful_life_months: 120, annual_depreciation_pct: 10.0, salvage_floor_pct: 10.0, blanket_sublimit_cents: 400000, appraisal_scope: "GENERAL", serial_required: false }
              as: PlatformAdmin
            - call: "POST /vault/members"
              payload: { email: "owner.c@example.com", full_name: "Owner C" }
              as: Anonymous
              captures: { owner_id: $.data.id }
            - call: "POST /vault/households"
              payload: { name: "Cedar House", address_label: "3 Cedar Way" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { hh_id: $.data.id }
            - call: "POST /vault/subscriptions"
              payload: { household_id: "${hh_id}", tier: "PLUS" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /vault/subscriptions/${sub_id}/billing-event"
              payload: { outcome: "PAYMENT_SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /vault/rooms"
              payload: { household_id: "${hh_id}", name: "Living Room", floor_label: "1" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { room_id: $.data.id }
            - call: "POST /vault/items"
              payload: { household_id: "${hh_id}", room_id: "${room_id}", name: "Armchair 1", category: "FURNITURE", acquired_at: "2025-11-01T00:00:00Z", quantity: 1, purchase_price_cents: 199990 }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { it_1: $.data.id }
            - call: "POST /vault/items/${it_1}/assets"
              payload: { asset_kind: "PHOTO", byte_size: 80000, checksum: "sha-c1", captured_at: "2026-05-01T00:00:00Z" }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/items/${it_1}/declare-value"
              payload: { declared_value_cents: 150000 }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/items"
              payload: { household_id: "${hh_id}", room_id: "${room_id}", name: "Armchair 2", category: "FURNITURE", acquired_at: "2025-11-01T00:00:00Z", quantity: 1, purchase_price_cents: 199990 }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { it_2: $.data.id }
            - call: "POST /vault/items/${it_2}/assets"
              payload: { asset_kind: "PHOTO", byte_size: 80000, checksum: "sha-c2", captured_at: "2026-05-01T00:00:00Z" }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/items/${it_2}/declare-value"
              payload: { declared_value_cents: 150000 }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/items"
              payload: { household_id: "${hh_id}", room_id: "${room_id}", name: "Armchair 3", category: "FURNITURE", acquired_at: "2025-11-01T00:00:00Z", quantity: 1, purchase_price_cents: 199990 }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { it_3: $.data.id }
            - call: "POST /vault/items/${it_3}/assets"
              payload: { asset_kind: "PHOTO", byte_size: 80000, checksum: "sha-c3", captured_at: "2026-05-01T00:00:00Z" }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/items/${it_3}/declare-value"
              payload: { declared_value_cents: 150000 }
              as: Homeowner
              as_user_id: "${owner_id}"
            - call: "POST /vault/policies"
              payload: { household_id: "${hh_id}", carrier_name: "Northwind Mutual", policy_number: "NW-3003", deductible_cents: 50000, scheduled_allowance_cents: 0, effective_from: "2026-05-01T00:00:00Z" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { pol_id: $.data.id }
            - call: "POST /vault/packages"
              payload: { household_id: "${hh_id}", policy_id: "${pol_id}" }
              as: Homeowner
              as_user_id: "${owner_id}"
