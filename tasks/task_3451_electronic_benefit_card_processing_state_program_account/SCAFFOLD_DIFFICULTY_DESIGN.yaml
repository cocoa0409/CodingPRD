# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7. All setup chains replay
# against §1.5 endpoints only. Clock control uses POST /_clock/set_current_utc
# (mounted OUTSIDE /ebt; server default 2026-09-01T00:00:00Z).
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: purse_spendable_vs_ledger_with_scheduled_posting
        grounds:
          - calculations.purse_balance_inquiry
          - entities.Purse.fields.ledger_balance_cents
          - entities.Purse.fields.spendable_balance_cents
        distinguishing_aspect: |
          On a Purse (entity domain: benefit purse), the LEDGER variant counts a
          SCHEDULED posting's POST_CREDIT while the SPENDABLE variant excludes it,
          so one read of the same purse reports ledger_balance_cents == 30000 and
          spendable_balance_cents == 0 for identical underlying data.
        test_recipe:
          setup:
            - "Contract TX ACTIVE with a single FOOD program (default config)"
            - "Case 0000000003 (bucket 3) with one FOOD purse"
            - "September allotment run of 30000 cents executed at 2026-09-01T00:00:00Z: posting SCHEDULED, available_at 2026-09-04T06:00:00Z, POST_CREDIT 30000 already in the ledger"
            - "Logical clock at 2026-09-02T12:00:00Z (before availability)"
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { p_food: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000003", head_of_household_name: "H A" }, as: StateAdmin, captures: { case_id: $.data.id } }
            - { call: "GET /ebt/purses", payload: { case_account_id: "${case_id}", program_id: "${p_food}" }, as: StateAdmin, captures: { pu_food: "$.data[0].id" } }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_food}", benefit_month: "2026-09", amount_cents: 30000 }, as: StateAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T12:00:00Z" }, as: StateAdmin }
          trigger:
            - { call: "GET /ebt/purses/${pu_food}", payload: {}, as: StateAdmin, captures: { led: $.data.ledger_balance_cents, spd: $.data.spendable_balance_cents } }
            - { call: "GET /ebt/purses/${pu_food}/postings", payload: {}, as: StateAdmin, captures: { pstat: "$.data[0].posting_status" } }
          assert:
            - "Purse.${pu_food}.ledger_balance_cents == 30000"
            - "Purse.${pu_food}.spendable_balance_cents == 0"
            - "BenefitPosting.posting_status == SCHEDULED (captured pstat == 'SCHEDULED')"
            - "captured led (30000) != captured spd (0)"

      - name: settlement_gross_vs_net_position_with_adjustments
        grounds:
          - calculations.settlement_position
          - calculations.acquirer_fee_total
          - entities.SettlementBatch.fields.net_position_cents
        distinguishing_aspect: |
          On a SettlementBatch (entity domain: acquirer settlement), the GROSS
          variant (335) and the NET variant (gross - fee + adjustments = 230)
          diverge for identical settled data because the 5-cent round-per-txn fee
          and a -100 UPHELD dispute adjustment apply only to NET.
        test_recipe:
          setup:
            - "Contract TX ACTIVE with FOOD + CASH programs (all defaults)"
            - "Retailer R1 (acquirer ACQ1) APPROVED with food-eligible UPC 111111111111"
            - "Case 0000000000 with food purse 30000, cash purse 20000, active card (pin 1234)"
            - "Five AUTHORIZED food purchases of 67 cents each on 2026-09-02"
            - "Clock advanced to 2026-09-03T00:00:00Z: cutoff sweep settles all five into one ACQ1 batch for 2026-09-02 (gross 335, fee 5 x 1 = 5, net 330)"
            - "Retailer dispute filed (disputed 100) then UPHELD with adjustment_cents -100"
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { p_food: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "CASH" }, as: StateAdmin, captures: { p_cash: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/retailers", payload: { contract_id: "${c_id}", retailer_name: "R1", acquirer_reference: "ACQ1" }, as: StateAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /ebt/retailers/${r_id}/item-files", payload: { items: [ { upc: "111111111111", food_eligible: true, effective_from: "2026-08-01", effective_to: null } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H B" }, as: StateAdmin, captures: { case_id: $.data.id } }
            - { call: "GET /ebt/purses", payload: { case_account_id: "${case_id}", program_id: "${p_food}" }, as: StateAdmin, captures: { pu_food: "$.data[0].id" } }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_food}", benefit_month: "2026-09", amount_cents: 30000 }, as: StateAdmin }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_cash}", benefit_month: "2026-09", amount_cents: 20000 }, as: StateAdmin }
            - { call: "POST /ebt/cards", payload: { case_account_id: "${case_id}" }, as: CardholderServices, captures: { card_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T12:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/cards/${card_id}/activate", payload: { pin: "1234" }, as: Cardholder, as_user_id: "${case_id}" }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 67 } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 67 } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 67 } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 67 } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 67 } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-03T00:00:00Z" }, as: StateAdmin }
            - { call: "GET /ebt/settlement-batches", payload: { contract_id: "${c_id}" }, as: StateAdmin, captures: { b_id: "$.data[0].id" } }
            - { call: "POST /ebt/disputes", payload: { settlement_batch_id: "${b_id}", disputed_amount_cents: 100, reason: "short payment review" }, as: RetailerSystem, as_user_id: "${r_id}", captures: { d_id: $.data.id } }
            - { call: "POST /ebt/disputes/${d_id}/status", payload: { to: "UPHELD", adjustment_cents: -100 }, as: StateAdmin }
          trigger:
            - { call: "GET /ebt/settlement-batches/${b_id}", payload: {}, as: StateAdmin, captures: { g: $.data.gross_settled_cents, f: $.data.acquirer_fee_cents, a: $.data.adjustment_total_cents, n: $.data.net_position_cents } }
          assert:
            - "SettlementBatch.${b_id}.gross_settled_cents == 335"
            - "SettlementBatch.${b_id}.acquirer_fee_cents == 5"
            - "SettlementBatch.${b_id}.adjustment_total_cents == -100"
            - "SettlementBatch.${b_id}.net_position_cents == 230"
            - "captured g (335) != captured n (230)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: split_tender_food_cash_no_spill
        grounds:
          - calculations.split_tender_authorization
          - errors[ERR_INSUFFICIENT_FUNDS]
        distinguishing_aspect: |
          Mode (a) multi-input non-linear waterfall: a 2500-cent food charge is
          rejected ERR_INSUFFICIENT_FUNDS although combined purse spendable is
          22000, because the no-spill rule forbids the idle 20000-cent CASH purse
          from covering a FOOD bucket shortfall (min-per-bucket, branch on purse
          existence and eligibility).
        test_recipe:
          setup:
            - "Contract TX ACTIVE with FOOD (20000... see run: food 2000 cents) and CASH (20000 cents)"
            - "Case 0000000000, active card pin 1234, retailer R1 with food-eligible UPC 111111111111"
            - "Food purse spendable 2000, cash purse spendable 20000"
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { p_food: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "CASH" }, as: StateAdmin, captures: { p_cash: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/retailers", payload: { contract_id: "${c_id}", retailer_name: "R1", acquirer_reference: "ACQ1" }, as: StateAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /ebt/retailers/${r_id}/item-files", payload: { items: [ { upc: "111111111111", food_eligible: true, effective_from: "2026-08-01", effective_to: null } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H C" }, as: StateAdmin, captures: { case_id: $.data.id } }
            - { call: "GET /ebt/purses", payload: { case_account_id: "${case_id}", program_id: "${p_food}" }, as: StateAdmin, captures: { pu_food: "$.data[0].id" } }
            - { call: "GET /ebt/purses", payload: { case_account_id: "${case_id}", program_id: "${p_cash}" }, as: StateAdmin, captures: { pu_cash: "$.data[0].id" } }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_food}", benefit_month: "2026-09", amount_cents: 2000 }, as: StateAdmin }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_cash}", benefit_month: "2026-09", amount_cents: 20000 }, as: StateAdmin }
            - { call: "POST /ebt/cards", payload: { case_account_id: "${case_id}" }, as: CardholderServices, captures: { card_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T12:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/cards/${card_id}/activate", payload: { pin: "1234" }, as: Cardholder, as_user_id: "${case_id}" }
          trigger:
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 2500 } ] }, as: RetailerSystem, as_user_id: "${r_id}", captures: { err: $.data.error_id } }
            - { call: "GET /ebt/purses/${pu_food}", payload: {}, as: StateAdmin, captures: { food_spd: $.data.spendable_balance_cents } }
            - { call: "GET /ebt/purses/${pu_cash}", payload: {}, as: StateAdmin, captures: { cash_spd: $.data.spendable_balance_cents } }
            - { call: "GET /ebt/purses/${pu_food}/ledger", payload: {}, as: StateAdmin, captures: { food_ledger_n: "$.data[0].entry_type" } }
          assert:
            - "captured err == 'ERR_INSUFFICIENT_FUNDS'"
            - "Purse.${pu_food}.spendable_balance_cents == 2000 (unchanged)"
            - "Purse.${pu_cash}.spendable_balance_cents == 20000 (unchanged; idle cash may not cover food)"
            - "food purse ledger contains exactly the POST_CREDIT entry (first entry type captured == 'POST_CREDIT')"

      - name: acquirer_fee_round_per_txn_then_sum
        grounds:
          - calculations.acquirer_fee_total
          - entities.SettlementBatch.fields.acquirer_fee_cents
        distinguishing_aspect: |
          Mode (b) nested rounding order: the pinned round-PER-TRANSACTION-then-sum
          order gives acquirer_fee_cents == 5 for five 67-cent transactions
          (round_half_up(0.5025) = 1 each); the forbidden sum-then-round order
          would give round_half_up(2.5125) = 3.
        test_recipe:
          setup:
            - "Contract TX ACTIVE with FOOD program; retailer R1 (ACQ1); case 0000000000 with active card and 30000-cent food purse"
            - "Five AUTHORIZED 67-cent food purchases on 2026-09-02; clock advanced to 2026-09-03T00:00:00Z so the cutoff sweep settles them into one batch"
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { p_food: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/retailers", payload: { contract_id: "${c_id}", retailer_name: "R1", acquirer_reference: "ACQ1" }, as: StateAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /ebt/retailers/${r_id}/item-files", payload: { items: [ { upc: "111111111111", food_eligible: true, effective_from: "2026-08-01", effective_to: null } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H D" }, as: StateAdmin, captures: { case_id: $.data.id } }
            - { call: "GET /ebt/purses", payload: { case_account_id: "${case_id}", program_id: "${p_food}" }, as: StateAdmin, captures: { pu_food: "$.data[0].id" } }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_food}", benefit_month: "2026-09", amount_cents: 30000 }, as: StateAdmin }
            - { call: "POST /ebt/cards", payload: { case_account_id: "${case_id}" }, as: CardholderServices, captures: { card_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T12:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/cards/${card_id}/activate", payload: { pin: "1234" }, as: Cardholder, as_user_id: "${case_id}" }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 67 } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 67 } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 67 } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 67 } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 67 } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-03T00:00:00Z" }, as: StateAdmin }
          trigger:
            - { call: "GET /ebt/settlement-batches", payload: { contract_id: "${c_id}" }, as: StateAdmin, captures: { b_fee: "$.data[0].acquirer_fee_cents", b_gross: "$.data[0].gross_settled_cents", b_net: "$.data[0].net_position_cents" } }
          assert:
            - "batch.acquirer_fee_cents == 5 (round-per-transaction-then-sum; sum-then-round would be 3)"
            - "batch.gross_settled_cents == 335"
            - "batch.net_position_cents == 330"

      - name: replacement_fee_purse_priority_and_waiver_order
        grounds:
          - calculations.replacement_fee_assessment
          - entities.Card.fields.fee_charged_cents
          - entities.Card.fields.fee_waived
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order: the
          fee amount depends on which purse absorbs it while absorbability depends
          on each purse's balance vs that fee. With the free allowance consumed,
          the 250-cent fee is debited from the CASH purse (priority order CASH
          before FOOD) even though the FOOD purse holds 30000 cents; food stays
          untouched at 30000 and cash drops 1000 -> 750.
        test_recipe:
          setup:
            - "Contract TX ACTIVE with FOOD (30000) and CASH (1000) purses for case 0000000000"
            - "card1 activated 2026-09-02; replace #1 consumes the single free replacement (card2 fee 0); card2 activated 2026-09-03"
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { p_food: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "CASH" }, as: StateAdmin, captures: { p_cash: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H E" }, as: StateAdmin, captures: { case_id: $.data.id } }
            - { call: "GET /ebt/purses", payload: { case_account_id: "${case_id}", program_id: "${p_cash}" }, as: StateAdmin, captures: { pu_cash: "$.data[0].id" } }
            - { call: "GET /ebt/purses", payload: { case_account_id: "${case_id}", program_id: "${p_food}" }, as: StateAdmin, captures: { pu_food: "$.data[0].id" } }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_food}", benefit_month: "2026-09", amount_cents: 30000 }, as: StateAdmin }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_cash}", benefit_month: "2026-09", amount_cents: 1000 }, as: StateAdmin }
            - { call: "POST /ebt/cards", payload: { case_account_id: "${case_id}" }, as: CardholderServices, captures: { card1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T12:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/cards/${card1}/activate", payload: { pin: "1234" }, as: Cardholder, as_user_id: "${case_id}" }
            - { call: "POST /ebt/cards/${card1}/replace", payload: {}, as: Cardholder, as_user_id: "${case_id}", captures: { card2: $.data.id, card2_fee: $.data.fee_charged_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-03T12:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/cards/${card2}/activate", payload: { pin: "1234" }, as: Cardholder, as_user_id: "${case_id}" }
          trigger:
            - { call: "POST /ebt/cards/${card2}/replace", payload: {}, as: Cardholder, as_user_id: "${case_id}", captures: { card3: $.data.id, card3_fee: $.data.fee_charged_cents, card3_waived: $.data.fee_waived } }
            - { call: "GET /ebt/purses/${pu_cash}", payload: {}, as: StateAdmin, captures: { cash_spd: $.data.spendable_balance_cents } }
            - { call: "GET /ebt/purses/${pu_food}", payload: {}, as: StateAdmin, captures: { food_spd: $.data.spendable_balance_cents } }
            - { call: "GET /ebt/purses/${pu_cash}/ledger", payload: { entry_type: "FEE_DEBIT" }, as: StateAdmin, captures: { fee_amt: "$.data[0].amount_cents" } }
          assert:
            - "card2.fee_charged_cents == 0 (free allowance consumed by first replacement)"
            - "card3.fee_charged_cents == 250 and card3.fee_waived == false"
            - "cash purse spendable == 750 (1000 - 250 FEE_DEBIT, captured cash_spd == 750)"
            - "food purse spendable == 30000 (untouched; CASH has absorption priority)"
            - "cash purse ledger FEE_DEBIT amount == 250"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: card_pin_lock_cycle_unlock_via_reset
        grounds:
          - state_machines.Card.ACTIVE_to_PIN_LOCKED
          - state_machines.Card.PIN_LOCKED_to_ACTIVE
          - validations[priority=18]
        distinguishing_aspect: |
          Card carries a cyclic dimension ACTIVE -> PIN_LOCKED -> ACTIVE: three
          PIN mismatches lock the card (third is the boundary), a further purchase
          with the CORRECT pin is rejected ERR_PIN_LOCKED by the state
          short-circuit, and a CSR pin-reset completes the loop back to ACTIVE
          with pin_fail_count == 0.
        test_recipe:
          setup:
            - "Contract TX ACTIVE with FOOD program; case 0000000000; food purse 30000; card activated with pin 1234; retailer with food UPC 111111111111"
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { p_food: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/retailers", payload: { contract_id: "${c_id}", retailer_name: "R1", acquirer_reference: "ACQ1" }, as: StateAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /ebt/retailers/${r_id}/item-files", payload: { items: [ { upc: "111111111111", food_eligible: true, effective_from: "2026-08-01", effective_to: null } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H F" }, as: StateAdmin, captures: { case_id: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_food}", benefit_month: "2026-09", amount_cents: 30000 }, as: StateAdmin }
            - { call: "POST /ebt/cards", payload: { case_account_id: "${case_id}" }, as: CardholderServices, captures: { card_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T12:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/cards/${card_id}/activate", payload: { pin: "1234" }, as: Cardholder, as_user_id: "${case_id}" }
          trigger:
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "9999", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 100 } ] }, as: RetailerSystem, as_user_id: "${r_id}", captures: { e1: $.data.error_id } }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "9999", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 100 } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "GET /ebt/cards/${card_id}", payload: {}, as: StateAdmin, captures: { st_after2: $.data.card_status, fc_after2: $.data.pin_fail_count } }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "9999", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 100 } ] }, as: RetailerSystem, as_user_id: "${r_id}", captures: { e3: $.data.error_id } }
            - { call: "GET /ebt/cards/${card_id}", payload: {}, as: StateAdmin, captures: { st_locked: $.data.card_status } }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 100 } ] }, as: RetailerSystem, as_user_id: "${r_id}", captures: { e4: $.data.error_id } }
            - { call: "POST /ebt/cards/${card_id}/pin-reset", payload: { new_pin: "4321" }, as: CardholderServices }
            - { call: "GET /ebt/cards/${card_id}", payload: {}, as: StateAdmin, captures: { st_reset: $.data.card_status, fc_reset: $.data.pin_fail_count } }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "4321", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 100 } ] }, as: RetailerSystem, as_user_id: "${r_id}", captures: { ok_total: $.data.total_cents } }
          assert:
            - "e1 == 'ERR_PIN_MISMATCH' and e3 == 'ERR_PIN_MISMATCH'"
            - "after 2 mismatches: card_status == 'ACTIVE' and pin_fail_count == 2 (boundary not yet reached)"
            - "after 3rd mismatch: card_status == 'PIN_LOCKED'"
            - "correct-pin purchase while PIN_LOCKED: e4 == 'ERR_PIN_LOCKED'"
            - "after CSR pin-reset: card_status == 'ACTIVE' and pin_fail_count == 0"
            - "purchase with new pin succeeds: ok_total == 100"

      - name: claim_parallel_investigation_and_credit_dimensions
        grounds:
          - state_machines.SkimmingClaim.FILED_to_UNDER_INVESTIGATION
          - state_machines.SkimmingClaimCredit.NONE_to_PROVISIONAL
          - state_machines.SkimmingClaimCredit.PROVISIONAL_to_FINAL
          - calculations.claim_credit_resolution
        distinguishing_aspect: |
          SkimmingClaim evolves on two independent dimensions:
          investigation_status moves FILED -> UNDER_INVESTIGATION ->
          SUBSTANTIATED while credit_status independently moves NONE ->
          PROVISIONAL -> FINAL; the provisional credit (50000, capped) lands while
          the claim is still UNDER_INVESTIGATION, and the final delta (-5000)
          posts only at adjudication.
        test_recipe:
          setup:
            - "Contract TX ACTIVE with FOOD (30000) and CASH (40000); case 0000000000; card pin 1234"
            - "One purchase on 2026-09-02: food 30000 + non-food 30000 (total 60000)"
            - "Claim for 60000 filed by the cardholder at 2026-09-02T13:00:00Z with freeze_purse=true; CSR moves it UNDER_INVESTIGATION at 2026-09-05T12:00:00Z"
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { p_food: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "CASH" }, as: StateAdmin, captures: { p_cash: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/retailers", payload: { contract_id: "${c_id}", retailer_name: "R1", acquirer_reference: "ACQ1" }, as: StateAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /ebt/retailers/${r_id}/item-files", payload: { items: [ { upc: "111111111111", food_eligible: true, effective_from: "2026-08-01", effective_to: null }, { upc: "222222222222", food_eligible: false, effective_from: "2026-08-01", effective_to: null } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H G" }, as: StateAdmin, captures: { case_id: $.data.id } }
            - { call: "GET /ebt/purses", payload: { case_account_id: "${case_id}", program_id: "${p_cash}" }, as: StateAdmin, captures: { pu_cash: "$.data[0].id" } }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_food}", benefit_month: "2026-09", amount_cents: 30000 }, as: StateAdmin }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_cash}", benefit_month: "2026-09", amount_cents: 40000 }, as: StateAdmin }
            - { call: "POST /ebt/cards", payload: { case_account_id: "${case_id}" }, as: CardholderServices, captures: { card_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T12:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/cards/${card_id}/activate", payload: { pin: "1234" }, as: Cardholder, as_user_id: "${case_id}" }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 30000 }, { upc: "222222222222", quantity: 1, unit_price_cents: 30000 } ] }, as: RetailerSystem, as_user_id: "${r_id}", captures: { txn: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T13:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/claims", payload: { case_account_id: "${case_id}", card_id: "${card_id}", authorization_ids: [ "${txn}" ], claimed_amount_cents: 60000, incident_description: "skimmed at pump", freeze_purse: true }, as: Cardholder, as_user_id: "${case_id}", captures: { cl: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T12:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/claims/${cl}/status", payload: { to: "UNDER_INVESTIGATION" }, as: CardholderServices }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T11:59:59Z" }, as: StateAdmin }
            - { call: "GET /ebt/case-accounts/${case_id}/claims", payload: {}, as: StateAdmin, captures: { inv_pre: "$.data[0].investigation_status", cr_pre: "$.data[0].credit_status" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T12:00:00Z" }, as: StateAdmin }
            - { call: "GET /ebt/case-accounts/${case_id}/claims", payload: {}, as: StateAdmin, captures: { inv_mid: "$.data[0].investigation_status", cr_mid: "$.data[0].credit_status", prov_amt: "$.data[0].provisional_credit_cents" } }
            - { call: "GET /ebt/purses/${pu_cash}", payload: {}, as: StateAdmin, captures: { cash_mid: $.data.ledger_balance_cents } }
            - { call: "POST /ebt/claims/${cl}/status", payload: { to: "SUBSTANTIATED", substantiated_amount_cents: 45000 }, as: StateAdmin, captures: { inv_fin: $.data.investigation_status, cr_fin: $.data.credit_status } }
            - { call: "GET /ebt/purses/${pu_cash}", payload: {}, as: StateAdmin, captures: { cash_fin: $.data.ledger_balance_cents } }
          assert:
            - "at 2026-09-15T11:59:59Z: investigation_status == 'UNDER_INVESTIGATION' and credit_status == 'NONE' (delay boundary not crossed)"
            - "at 2026-09-15T12:00:00Z: investigation_status still 'UNDER_INVESTIGATION' while credit_status == 'PROVISIONAL' (dimensions move independently)"
            - "provisional_credit_cents == 50000 (min(60000 claimed, 50000 cap))"
            - "cash purse ledger_balance after provisional == 60000 (40000 - 30000 + 50000; target purse is CASH because cash_sum 30000 >= food_sum 30000)"
            - "after adjudication to SUBSTANTIATED with 45000: credit_status == 'FINAL' and cash purse ledger_balance == 55000 (CLAIM_REVERSAL_DEBIT 5000 = 50000 - 45000)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: expungement_dormancy_card_deactivation_chain
        grounds:
          - state_machines.BenefitPosting.AVAILABLE_to_EXPUNGED
          - state_machines.CaseAccount.OPEN_to_DORMANT
          - state_machines.Card.ACTIVE_to_DEACTIVATED
          - calculations.expungement_sweep
        distinguishing_aspect: |
          Depth-3 cascade from a clock advance: posting AVAILABLE -> EXPUNGED
          (link 1, purse zeroed by EXPUNGE_DEBIT) causes the CaseAccount OPEN ->
          DORMANT (link 2, all purses zero and no live postings), which causes
          every non-terminal Card -> DEACTIVATED (link 3). Each link is triggered
          by the previous link's mutation, not by the clock directly.
        test_recipe:
          setup:
            - "Contract TX ACTIVE with a single FOOD program (defaults: expungement 90 days, notice lead 30)"
            - "Case 0000000000, food purse with one AVAILABLE posting of 30000; single purchase of 100 at 2026-09-02T12:00:00Z sets last_activity_at"
            - "Card activated (ACTIVE) before the long inactivity gap"
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { p_food: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/retailers", payload: { contract_id: "${c_id}", retailer_name: "R1", acquirer_reference: "ACQ1" }, as: StateAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /ebt/retailers/${r_id}/item-files", payload: { items: [ { upc: "111111111111", food_eligible: true, effective_from: "2026-08-01", effective_to: null } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H H" }, as: StateAdmin, captures: { case_id: $.data.id } }
            - { call: "GET /ebt/purses", payload: { case_account_id: "${case_id}", program_id: "${p_food}" }, as: StateAdmin, captures: { pu_food: "$.data[0].id" } }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_food}", benefit_month: "2026-09", amount_cents: 30000 }, as: StateAdmin }
            - { call: "POST /ebt/cards", payload: { case_account_id: "${case_id}" }, as: CardholderServices, captures: { card_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T12:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/cards/${card_id}/activate", payload: { pin: "1234" }, as: Cardholder, as_user_id: "${case_id}" }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 100 } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T12:00:00Z" }, as: StateAdmin }
            - { call: "GET /ebt/purses/${pu_food}", payload: {}, as: StateAdmin, captures: { notice_at: $.data.expungement_notice_sent_at, bal_notice: $.data.ledger_balance_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-01T11:59:59Z" }, as: StateAdmin }
            - { call: "GET /ebt/case-accounts/${case_id}", payload: {}, as: StateAdmin, captures: { case_pre: $.data.account_status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-01T12:00:00Z" }, as: StateAdmin }
            - { call: "GET /ebt/purses/${pu_food}", payload: {}, as: StateAdmin, captures: { bal_post: $.data.ledger_balance_cents } }
            - { call: "GET /ebt/purses/${pu_food}/postings", payload: {}, as: StateAdmin, captures: { post_stat: "$.data[0].posting_status" } }
            - { call: "GET /ebt/case-accounts/${case_id}", payload: {}, as: StateAdmin, captures: { case_post: $.data.account_status } }
            - { call: "GET /ebt/cards/${card_id}", payload: {}, as: StateAdmin, captures: { card_post: $.data.card_status } }
          assert:
            - "at notice point 2026-11-01T12:00:00Z: expungement_notice_sent_at == '2026-11-01T12:00:00Z' and ledger_balance still == 29900 (notice is not expungement)"
            - "one second before eligibility (2026-12-01T11:59:59Z): account_status == 'OPEN'"
            - "at 2026-12-01T12:00:00Z (last_activity + 90 days, inclusive): purse ledger_balance == 0 (EXPUNGE_DEBIT 29900)"
            - "posting posting_status == 'EXPUNGED'"
            - "case account_status == 'DORMANT' (link 2: all purses zero, no SCHEDULED/AVAILABLE postings)"
            - "card card_status == 'DEACTIVATED' (link 3: dormancy cascade)"

      - name: substantiated_claim_retailer_threshold_suspension_chain
        grounds:
          - state_machines.SkimmingClaim.UNDER_INVESTIGATION_to_SUBSTANTIATED
          - entities.Retailer.fields.skimming_incident_count
          - errors[ERR_RETAILER_NOT_ACTIVE]
        distinguishing_aspect: |
          Depth-2 cascade from claim adjudication (a different trigger than the
          clock): the third SUBSTANTIATED decision increments the retailer's
          skimming_incident_count (link 1), and crossing the threshold 3 flips the
          Retailer APPROVED -> SUSPENDED (link 2), after which new authorizations
          fail with ERR_RETAILER_NOT_ACTIVE.
        test_recipe:
          setup:
            - "Contract TX ACTIVE with FOOD program (default skimming_suspend_threshold 3)"
            - "Case 0000000000, food purse 30000, active card pin 1234, retailer R1"
            - "Three rounds of: 100-cent purchase -> cardholder claim (freeze_purse false) -> CSR investigation -> StateAdmin SUBSTANTIATED 100"
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { p_food: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/retailers", payload: { contract_id: "${c_id}", retailer_name: "R1", acquirer_reference: "ACQ1" }, as: StateAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /ebt/retailers/${r_id}/item-files", payload: { items: [ { upc: "111111111111", food_eligible: true, effective_from: "2026-08-01", effective_to: null } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H I" }, as: StateAdmin, captures: { case_id: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_food}", benefit_month: "2026-09", amount_cents: 30000 }, as: StateAdmin }
            - { call: "POST /ebt/cards", payload: { case_account_id: "${case_id}" }, as: CardholderServices, captures: { card_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T12:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/cards/${card_id}/activate", payload: { pin: "1234" }, as: Cardholder, as_user_id: "${case_id}" }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 100 } ] }, as: RetailerSystem, as_user_id: "${r_id}", captures: { t1: $.data.id } }
            - { call: "POST /ebt/claims", payload: { case_account_id: "${case_id}", card_id: "${card_id}", authorization_ids: [ "${t1}" ], claimed_amount_cents: 100, incident_description: "skim 1", freeze_purse: false }, as: Cardholder, as_user_id: "${case_id}", captures: { cl1: $.data.id } }
            - { call: "POST /ebt/claims/${cl1}/status", payload: { to: "UNDER_INVESTIGATION" }, as: CardholderServices }
            - { call: "POST /ebt/claims/${cl1}/status", payload: { to: "SUBSTANTIATED", substantiated_amount_cents: 100 }, as: StateAdmin }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 100 } ] }, as: RetailerSystem, as_user_id: "${r_id}", captures: { t2: $.data.id } }
            - { call: "POST /ebt/claims", payload: { case_account_id: "${case_id}", card_id: "${card_id}", authorization_ids: [ "${t2}" ], claimed_amount_cents: 100, incident_description: "skim 2", freeze_purse: false }, as: Cardholder, as_user_id: "${case_id}", captures: { cl2: $.data.id } }
            - { call: "POST /ebt/claims/${cl2}/status", payload: { to: "UNDER_INVESTIGATION" }, as: CardholderServices }
            - { call: "POST /ebt/claims/${cl2}/status", payload: { to: "SUBSTANTIATED", substantiated_amount_cents: 100 }, as: StateAdmin }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 100 } ] }, as: RetailerSystem, as_user_id: "${r_id}", captures: { t3: $.data.id } }
            - { call: "POST /ebt/claims", payload: { case_account_id: "${case_id}", card_id: "${card_id}", authorization_ids: [ "${t3}" ], claimed_amount_cents: 100, incident_description: "skim 3", freeze_purse: false }, as: Cardholder, as_user_id: "${case_id}", captures: { cl3: $.data.id } }
            - { call: "POST /ebt/claims/${cl3}/status", payload: { to: "UNDER_INVESTIGATION" }, as: CardholderServices }
          trigger:
            - { call: "POST /ebt/claims/${cl3}/status", payload: { to: "SUBSTANTIATED", substantiated_amount_cents: 100 }, as: StateAdmin }
            - { call: "GET /ebt/retailers/${r_id}", payload: {}, as: StateAdmin, captures: { r_status: $.data.retailer_status, r_count: $.data.skimming_incident_count } }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 100 } ] }, as: RetailerSystem, as_user_id: "${r_id}", captures: { err: $.data.error_id } }
          assert:
            - "Retailer.skimming_incident_count == 3 after the third substantiation"
            - "Retailer.retailer_status == 'SUSPENDED' (threshold 3 reached via cascade)"
            - "new authorization rejected: err == 'ERR_RETAILER_NOT_ACTIVE'"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: frozen_purse_beats_insufficient_funds
        grounds:
          - validations[priority=13]
          - validations[priority=23]
          - errors[ERR_PURSE_FROZEN]
          - errors[ERR_INSUFFICIENT_FUNDS]
        distinguishing_aspect: |
          Error-category pair {state, business_fiscal}: one purchase request
          violates both ERR_PURSE_FROZEN (priority 13, state) and
          ERR_INSUFFICIENT_FUNDS (priority 23, fiscal) — the food purse is FROZEN
          by a skimming claim AND the 2500-cent charge exceeds its 1900-cent
          spendable. The state error must win.
        test_recipe:
          setup:
            - "Contract TX ACTIVE with FOOD (2000) and CASH (20000); case 0000000000; active card"
            - "A 100-cent purchase settled the purse to spendable 1900; a skimming claim with freeze_purse=true froze the food purse"
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { p_food: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "CASH" }, as: StateAdmin, captures: { p_cash: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/retailers", payload: { contract_id: "${c_id}", retailer_name: "R1", acquirer_reference: "ACQ1" }, as: StateAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /ebt/retailers/${r_id}/item-files", payload: { items: [ { upc: "111111111111", food_eligible: true, effective_from: "2026-08-01", effective_to: null } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H J" }, as: StateAdmin, captures: { case_id: $.data.id } }
            - { call: "GET /ebt/purses", payload: { case_account_id: "${case_id}", program_id: "${p_food}" }, as: StateAdmin, captures: { pu_food: "$.data[0].id" } }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_food}", benefit_month: "2026-09", amount_cents: 2000 }, as: StateAdmin }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_cash}", benefit_month: "2026-09", amount_cents: 20000 }, as: StateAdmin }
            - { call: "POST /ebt/cards", payload: { case_account_id: "${case_id}" }, as: CardholderServices, captures: { card_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T12:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/cards/${card_id}/activate", payload: { pin: "1234" }, as: Cardholder, as_user_id: "${case_id}" }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 100 } ] }, as: RetailerSystem, as_user_id: "${r_id}", captures: { t1: $.data.id } }
            - { call: "POST /ebt/claims", payload: { case_account_id: "${case_id}", card_id: "${card_id}", authorization_ids: [ "${t1}" ], claimed_amount_cents: 100, incident_description: "freeze me", freeze_purse: true }, as: Cardholder, as_user_id: "${case_id}" }
          trigger:
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 2500 } ] }, as: RetailerSystem, as_user_id: "${r_id}", captures: { err: $.data.error_id } }
            - { call: "GET /ebt/purses/${pu_food}", payload: {}, as: StateAdmin, captures: { spd: $.data.spendable_balance_cents, pst: $.data.purse_status } }
          assert:
            - "err == 'ERR_PURSE_FROZEN' (state priority beats fiscal insufficiency)"
            - "purse_status == 'FROZEN' and spendable_balance_cents == 1900 (unchanged)"

      - name: claim_window_expired_beats_txn_case_mismatch
        grounds:
          - validations[priority=21]
          - validations[priority=22]
          - errors[ERR_CLAIM_WINDOW_EXPIRED]
          - errors[ERR_CLAIM_TXN_CASE_MISMATCH]
        distinguishing_aspect: |
          Error-category pair {business_temporal, business_referential} — disjoint
          from the other instance's {state, business_fiscal}: the claim references
          a transaction that is BOTH 74 days old (window 60 -> temporal,
          priority 21) AND owned by a different case (referential, priority 22).
          The temporal error ERR_CLAIM_WINDOW_EXPIRED must win.
        test_recipe:
          setup:
            - "Contract TX ACTIVE with FOOD program; cases A (0000000000) and B (0000000001)"
            - "Case B made a 500-cent purchase at 2026-09-02T12:00:00Z; case A has a card but no transactions"
            - "Logical clock advanced to 2026-11-15T00:00:00Z (transaction age 74 days > claim_window_days 60)"
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { p_food: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/retailers", payload: { contract_id: "${c_id}", retailer_name: "R1", acquirer_reference: "ACQ1" }, as: StateAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /ebt/retailers/${r_id}/item-files", payload: { items: [ { upc: "111111111111", food_eligible: true, effective_from: "2026-08-01", effective_to: null } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H K1" }, as: StateAdmin, captures: { case_a: $.data.id } }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000001", head_of_household_name: "H K2" }, as: StateAdmin, captures: { case_b: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_food}", benefit_month: "2026-09", amount_cents: 30000 }, as: StateAdmin }
            - { call: "POST /ebt/cards", payload: { case_account_id: "${case_a}" }, as: CardholderServices, captures: { card_a: $.data.id } }
            - { call: "POST /ebt/cards", payload: { case_account_id: "${case_b}" }, as: CardholderServices, captures: { card_b: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T12:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/cards/${card_b}/activate", payload: { pin: "1234" }, as: Cardholder, as_user_id: "${case_b}" }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_b}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 500 } ] }, as: RetailerSystem, as_user_id: "${r_id}", captures: { txn_b: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-15T00:00:00Z" }, as: StateAdmin }
          trigger:
            - { call: "POST /ebt/claims", payload: { case_account_id: "${case_a}", card_id: "${card_a}", authorization_ids: [ "${txn_b}" ], claimed_amount_cents: 500, incident_description: "not mine but old", freeze_purse: false }, as: Cardholder, as_user_id: "${case_a}", captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_CLAIM_WINDOW_EXPIRED' (temporal priority 21 beats referential priority 22)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: posting_available_exactly_at_available_at
        grounds:
          - calculations.posting_bucket_schedule
          - state_machines.BenefitPosting.SCHEDULED_to_AVAILABLE
        distinguishing_aspect: |
          Boundary on the availability metric through the clock endpoint: at
          2026-09-01T05:59:59Z the posting is SCHEDULED and spendable is 0; at
          exactly 2026-09-01T06:00:00Z (the >= boundary) it flips AVAILABLE and
          spendable becomes 30000.
        test_recipe:
          setup:
            - "Contract TX ACTIVE with FOOD program (default availability hour 6); case 0000000000 (bucket 0 -> available_date 2026-09-01)"
            - "September run 30000 executed at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { p_food: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H L" }, as: StateAdmin, captures: { case_id: $.data.id } }
            - { call: "GET /ebt/purses", payload: { case_account_id: "${case_id}", program_id: "${p_food}" }, as: StateAdmin, captures: { pu_food: "$.data[0].id" } }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_food}", benefit_month: "2026-09", amount_cents: 30000 }, as: StateAdmin }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T05:59:59Z" }, as: StateAdmin }
            - { call: "GET /ebt/purses/${pu_food}/postings", payload: {}, as: StateAdmin, captures: { st_before: "$.data[0].posting_status" } }
            - { call: "GET /ebt/purses/${pu_food}", payload: {}, as: StateAdmin, captures: { spd_before: $.data.spendable_balance_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T06:00:00Z" }, as: StateAdmin }
            - { call: "GET /ebt/purses/${pu_food}/postings", payload: {}, as: StateAdmin, captures: { st_at: "$.data[0].posting_status" } }
            - { call: "GET /ebt/purses/${pu_food}", payload: {}, as: StateAdmin, captures: { spd_at: $.data.spendable_balance_cents } }
          assert:
            - "one second before available_at: posting_status == 'SCHEDULED' and spendable == 0"
            - "exactly at available_at 2026-09-01T06:00:00Z: posting_status == 'AVAILABLE' and spendable == 30000 (inclusive >= boundary)"

      - name: withdrawal_at_exact_daily_limit_allowed
        grounds:
          - calculations.withdrawal_authorization
          - errors[ERR_DAILY_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Boundary on the cumulative daily-withdrawal metric through the
          authorization endpoint: cumulative withdrawals of exactly
          50000 cents (== cash_withdrawal_daily_limit_cents) are allowed
          (strictly-greater rejects), while the next 500-cent withdrawal
          (cumulative 50500) is rejected ERR_DAILY_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "Contract TX ACTIVE with FOOD (1000) and CASH (60000); case 0000000000; active card pin 1234"
            - "All activity on the same UTC day 2026-09-02"
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { p_food: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "CASH" }, as: StateAdmin, captures: { p_cash: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/retailers", payload: { contract_id: "${c_id}", retailer_name: "R1", acquirer_reference: "ACQ1" }, as: StateAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H M" }, as: StateAdmin, captures: { case_id: $.data.id } }
            - { call: "GET /ebt/purses", payload: { case_account_id: "${case_id}", program_id: "${p_cash}" }, as: StateAdmin, captures: { pu_cash: "$.data[0].id" } }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_food}", benefit_month: "2026-09", amount_cents: 1000 }, as: StateAdmin }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_cash}", benefit_month: "2026-09", amount_cents: 60000 }, as: StateAdmin }
            - { call: "POST /ebt/cards", payload: { case_account_id: "${case_id}" }, as: CardholderServices, captures: { card_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T12:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/cards/${card_id}/activate", payload: { pin: "1234" }, as: Cardholder, as_user_id: "${case_id}" }
          trigger:
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "CASH_WITHDRAWAL", withdrawal_amount_cents: 30000 }, as: RetailerSystem, as_user_id: "${r_id}", captures: { w1: $.data.cash_charge_cents } }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "CASH_WITHDRAWAL", withdrawal_amount_cents: 20000 }, as: RetailerSystem, as_user_id: "${r_id}", captures: { w2: $.data.cash_charge_cents } }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "CASH_WITHDRAWAL", withdrawal_amount_cents: 500 }, as: RetailerSystem, as_user_id: "${r_id}", captures: { err: $.data.error_id } }
            - { call: "GET /ebt/purses/${pu_cash}", payload: {}, as: StateAdmin, captures: { spd: $.data.spendable_balance_cents } }
          assert:
            - "first withdrawal 30000 authorized (w1 == 30000)"
            - "second withdrawal 20000 authorized: cumulative 50000 == limit allowed (w2 == 20000)"
            - "third withdrawal 500 rejected: err == 'ERR_DAILY_LIMIT_EXCEEDED' (cumulative 50500 > 50000)"
            - "cash purse spendable == 10000 (60000 - 50000)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: purchase_rejected_when_retailer_suspended
        grounds:
          - state_machines.Retailer.APPROVED_to_SUSPENDED
          - validations[priority=10]
          - errors[ERR_RETAILER_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair PurchaseTransaction x Retailer: authorization creation is
          gated on the RETAILER's state — a manual APPROVED -> SUSPENDED makes
          the very same well-formed purchase fail ERR_RETAILER_NOT_ACTIVE, and
          SUSPENDED -> APPROVED restores it.
        test_recipe:
          setup:
            - "Contract TX ACTIVE with FOOD program; case 0000000000 with active card and 30000 food; retailer R1 APPROVED"
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { p_food: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/retailers", payload: { contract_id: "${c_id}", retailer_name: "R1", acquirer_reference: "ACQ1" }, as: StateAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /ebt/retailers/${r_id}/item-files", payload: { items: [ { upc: "111111111111", food_eligible: true, effective_from: "2026-08-01", effective_to: null } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H N" }, as: StateAdmin, captures: { case_id: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_food}", benefit_month: "2026-09", amount_cents: 30000 }, as: StateAdmin }
            - { call: "POST /ebt/cards", payload: { case_account_id: "${case_id}" }, as: CardholderServices, captures: { card_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T12:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/cards/${card_id}/activate", payload: { pin: "1234" }, as: Cardholder, as_user_id: "${case_id}" }
            - { call: "POST /ebt/retailers/${r_id}/status", payload: { to: "SUSPENDED" }, as: StateAdmin }
          trigger:
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 100 } ] }, as: RetailerSystem, as_user_id: "${r_id}", captures: { err: $.data.error_id } }
            - { call: "POST /ebt/retailers/${r_id}/status", payload: { to: "APPROVED" }, as: StateAdmin }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 100 } ] }, as: RetailerSystem, as_user_id: "${r_id}", captures: { ok: $.data.total_cents } }
          assert:
            - "while retailer SUSPENDED: err == 'ERR_RETAILER_NOT_ACTIVE'"
            - "after reinstatement to APPROVED: purchase succeeds with total_cents == 100"

      - name: reconcile_blocked_while_dispute_open
        grounds:
          - state_machines.SettlementBatch.DISPUTED_to_RECONCILED
          - validations[priority=16]
          - errors[ERR_BATCH_HAS_OPEN_DISPUTES]
        distinguishing_aspect: |
          Entity pair SettlementBatch x SettlementDispute: a reconcile whose
          amount MATCHES net_position_cents is still rejected
          ERR_BATCH_HAS_OPEN_DISPUTES while a dispute is OPEN; only after the
          dispute is OVERTURNED does the identical reconcile succeed.
        test_recipe:
          setup:
            - "Contract TX ACTIVE with FOOD program; case 0000000000 with active card and 30000 food; retailer R1"
            - "One 1000-cent purchase on 2026-09-02; cutoff at 2026-09-03T00:00:00Z creates batch (gross 1000, fee 8, net 992)"
            - "Retailer dispute filed (batch CUTOFF -> DISPUTED, dispute OPEN)"
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { p_food: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/retailers", payload: { contract_id: "${c_id}", retailer_name: "R1", acquirer_reference: "ACQ1" }, as: StateAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /ebt/retailers/${r_id}/item-files", payload: { items: [ { upc: "111111111111", food_eligible: true, effective_from: "2026-08-01", effective_to: null } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H O" }, as: StateAdmin, captures: { case_id: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_food}", benefit_month: "2026-09", amount_cents: 30000 }, as: StateAdmin }
            - { call: "POST /ebt/cards", payload: { case_account_id: "${case_id}" }, as: CardholderServices, captures: { card_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T12:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/cards/${card_id}/activate", payload: { pin: "1234" }, as: Cardholder, as_user_id: "${case_id}" }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 1000 } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-03T00:00:00Z" }, as: StateAdmin }
            - { call: "GET /ebt/settlement-batches", payload: { contract_id: "${c_id}" }, as: StateAdmin, captures: { b_id: "$.data[0].id" } }
            - { call: "POST /ebt/disputes", payload: { settlement_batch_id: "${b_id}", disputed_amount_cents: 992, reason: "statement review" }, as: RetailerSystem, as_user_id: "${r_id}", captures: { d_id: $.data.id } }
          trigger:
            - { call: "POST /ebt/settlement-batches/${b_id}/reconcile", payload: { actual_settled_cents: 992 }, as: StateAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /ebt/disputes/${d_id}/status", payload: { to: "OVERTURNED" }, as: StateAdmin }
            - { call: "POST /ebt/settlement-batches/${b_id}/reconcile", payload: { actual_settled_cents: 992 }, as: StateAdmin, captures: { bstat: $.data.batch_status } }
          assert:
            - "reconcile with OPEN dispute: err == 'ERR_BATCH_HAS_OPEN_DISPUTES' even though 992 == net_position_cents"
            - "after OVERTURNED: identical reconcile succeeds, batch_status == 'RECONCILED'"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: item_window_half_open_overlap_rejected_adjacency_allowed
        grounds:
          - validations[priority=20]
          - entities.RetailerItem.fields.effective_from
          - errors[ERR_ITEM_WINDOW_OVERLAP]
        distinguishing_aspect: |
          RetailerItem windows use HALF-OPEN [effective_from, effective_to)
          semantics: an upload overlapping 2026-09-15..2026-11-01 against the
          existing 2026-09-01..2026-10-01 record conflicts, while the adjacent
          2026-10-01..2026-12-01 (from == other's to) is accepted.
        test_recipe:
          setup:
            - "Contract TX ACTIVE with FOOD program; retailer R1 APPROVED"
            - "Existing item record for UPC 333333333333 covering [2026-09-01, 2026-10-01)"
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { p_food: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/retailers", payload: { contract_id: "${c_id}", retailer_name: "R1", acquirer_reference: "ACQ1" }, as: StateAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /ebt/retailers/${r_id}/item-files", payload: { items: [ { upc: "333333333333", food_eligible: true, effective_from: "2026-09-01", effective_to: "2026-10-01" } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
          trigger:
            - { call: "POST /ebt/retailers/${r_id}/item-files", payload: { items: [ { upc: "333333333333", food_eligible: false, effective_from: "2026-09-15", effective_to: "2026-11-01" } ] }, as: RetailerSystem, as_user_id: "${r_id}", captures: { err: $.data.error_id } }
            - { call: "POST /ebt/retailers/${r_id}/item-files", payload: { items: [ { upc: "333333333333", food_eligible: false, effective_from: "2026-10-01", effective_to: "2026-12-01" } ] }, as: RetailerSystem, as_user_id: "${r_id}", captures: { made: $.data.created_count } }
          assert:
            - "overlapping upload rejected: err == 'ERR_ITEM_WINDOW_OVERLAP'"
            - "adjacent upload (from == previous effective_to) accepted: created_count == 1 (half-open adjacency is not a conflict)"

      - name: disaster_window_closed_interval_adjacency_conflicts
        grounds:
          - validations[priority=20]
          - entities.BenefitProgram.fields.disaster_window_start
          - errors[ERR_DISASTER_WINDOW_OVERLAP]
        distinguishing_aspect: |
          DISASTER program windows use CLOSED [start, end] semantics — the dual of
          the item-file rule on a different resource: a second DISASTER program
          starting exactly on the first one's end date (2026-09-25) CONFLICTS,
          while one starting the next day (2026-09-26) is accepted.
        test_recipe:
          setup:
            - "Contract TX ACTIVE with FOOD program; DISASTER program D1 with closed window [2026-09-10, 2026-09-25] already ACTIVE"
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "DISASTER", disaster_window_start: "2026-09-10", disaster_window_end: "2026-09-25" }, as: StateAdmin }
          trigger:
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "DISASTER", disaster_window_start: "2026-09-25", disaster_window_end: "2026-10-05" }, as: StateAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "DISASTER", disaster_window_start: "2026-09-26", disaster_window_end: "2026-10-05" }, as: StateAdmin, captures: { d3: $.data.id } }
          assert:
            - "adjacent closed-window program rejected: err == 'ERR_DISASTER_WINDOW_OVERLAP' (end-touching-start conflicts under closed semantics)"
            - "program starting the day after the window end is created (id captured, d3 present)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: authorization_void_restores_purse_balance
        grounds:
          - state_machines.PurchaseTransaction.AUTHORIZED_to_VOIDED
          - calculations.purse_balance_inquiry
          - entities.LedgerEntry.fields.entry_type
        distinguishing_aspect: |
          Conserved quantity: a purse's balance. The forward action
          (PURCHASE_DEBIT 800) paired with its compensating action (same-day
          VOID_CREDIT 800) leaves Purse.ledger_balance_cents and
          Purse.spendable_balance_cents exactly at their pre-action values
          (30000), with both entries present in the append-only ledger.
        test_recipe:
          setup:
            - "Contract TX ACTIVE with FOOD (30000) program; case 0000000000; active card pin 1234; retailer R1"
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { p_food: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/retailers", payload: { contract_id: "${c_id}", retailer_name: "R1", acquirer_reference: "ACQ1" }, as: StateAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /ebt/retailers/${r_id}/item-files", payload: { items: [ { upc: "111111111111", food_eligible: true, effective_from: "2026-08-01", effective_to: null } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H P" }, as: StateAdmin, captures: { case_id: $.data.id } }
            - { call: "GET /ebt/purses", payload: { case_account_id: "${case_id}", program_id: "${p_food}" }, as: StateAdmin, captures: { pu_food: "$.data[0].id" } }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_food}", benefit_month: "2026-09", amount_cents: 30000 }, as: StateAdmin }
            - { call: "POST /ebt/cards", payload: { case_account_id: "${case_id}" }, as: CardholderServices, captures: { card_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T12:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/cards/${card_id}/activate", payload: { pin: "1234" }, as: Cardholder, as_user_id: "${case_id}" }
            - { call: "GET /ebt/purses/${pu_food}", payload: {}, as: StateAdmin, captures: { pre_bal: $.data.ledger_balance_cents } }
          trigger:
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 800 } ] }, as: RetailerSystem, as_user_id: "${r_id}", captures: { txn: $.data.id } }
            - { call: "GET /ebt/purses/${pu_food}", payload: {}, as: StateAdmin, captures: { mid_bal: $.data.ledger_balance_cents } }
            - { call: "POST /ebt/authorizations/${txn}/void", payload: {}, as: RetailerSystem, as_user_id: "${r_id}", captures: { vstat: $.data.txn_status } }
            - { call: "GET /ebt/purses/${pu_food}", payload: {}, as: StateAdmin, captures: { post_bal: $.data.ledger_balance_cents, post_spd: $.data.spendable_balance_cents } }
            - { call: "GET /ebt/purses/${pu_food}/ledger", payload: {}, as: StateAdmin, captures: { e1: "$.data[0].entry_type", e2: "$.data[1].entry_type", e3: "$.data[2].entry_type" } }
          assert:
            - "pre-purchase ledger_balance == 30000"
            - "after purchase: ledger_balance == 29200 (PURCHASE_DEBIT 800)"
            - "after same-day void: txn_status == 'VOIDED' and ledger_balance == 30000 == pre-action value (invariant restored)"
            - "spendable_balance_cents == 30000 as well"
            - "ledger holds the compensating pair: entries [POST_CREDIT, PURCHASE_DEBIT, VOID_CREDIT] in created_at ASC order"

      - name: pre_cutoff_void_leaves_batch_gross_unchanged
        grounds:
          - state_machines.PurchaseTransaction.AUTHORIZED_to_SETTLED
          - entities.SettlementBatch.fields.gross_settled_cents
          - calculations.settlement_position
        distinguishing_aspect: |
          Conserved quantity: a settlement batch's gross settled total (an
          aggregate over transactions, a different quantity than a purse balance).
          A 500-cent authorization paired with its compensating same-day void
          before the cutoff leaves the batch's gross exactly as if only the
          700-cent authorization had ever happened: gross 700, txn_count 1.
        test_recipe:
          setup:
            - "Contract TX ACTIVE with FOOD program; case 0000000000 with active card and 30000 food; retailer R1 (ACQ1)"
            - "On 2026-09-02: purchase T1 500 then purchase T2 700; T1 voided the same day"
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { p_food: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/retailers", payload: { contract_id: "${c_id}", retailer_name: "R1", acquirer_reference: "ACQ1" }, as: StateAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /ebt/retailers/${r_id}/item-files", payload: { items: [ { upc: "111111111111", food_eligible: true, effective_from: "2026-08-01", effective_to: null } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H Q" }, as: StateAdmin, captures: { case_id: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_food}", benefit_month: "2026-09", amount_cents: 30000 }, as: StateAdmin }
            - { call: "POST /ebt/cards", payload: { case_account_id: "${case_id}" }, as: CardholderServices, captures: { card_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T12:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/cards/${card_id}/activate", payload: { pin: "1234" }, as: Cardholder, as_user_id: "${case_id}" }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 500 } ] }, as: RetailerSystem, as_user_id: "${r_id}", captures: { t1: $.data.id } }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 700 } ] }, as: RetailerSystem, as_user_id: "${r_id}", captures: { t2: $.data.id } }
            - { call: "POST /ebt/authorizations/${t1}/void", payload: {}, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-03T00:00:00Z" }, as: StateAdmin }
          trigger:
            - { call: "GET /ebt/settlement-batches", payload: { contract_id: "${c_id}" }, as: StateAdmin, captures: { b_gross: "$.data[0].gross_settled_cents", b_count: "$.data[0].txn_count", b_fee: "$.data[0].acquirer_fee_cents", b_net: "$.data[0].net_position_cents" } }
          assert:
            - "batch.gross_settled_cents == 700 (the voided 500 contributes nothing — forward + compensation conserve gross)"
            - "batch.txn_count == 1"
            - "batch.acquirer_fee_cents == 5 (round_half_up(700 * 75 / 10000) = round_half_up(5.25))"
            - "batch.net_position_cents == 695"
