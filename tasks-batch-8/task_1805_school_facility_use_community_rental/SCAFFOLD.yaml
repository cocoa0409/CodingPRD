    side_effects: []

  - method: POST
    path: "/district/work_orders/{wo_id}/verify"
    description: "Verify actual custodial hours (drives FINAL staffing charge)"
    roles: [CustodialSupervisor]
    code: 200
    input: [actual_hours]
    output: CustodialWorkOrder
    side_effects: ["wo_status -> VERIFIED", "FINAL invoice staffing recomputed (actual variant)"]

  # --- Invoices ---
  - method: GET
    path: "/district/invoices/{invoice_id}"
    description: "Get invoice"
    roles: [FacilitiesDirector, DistrictAdmin, SiteCoordinator, RenterOrgRep]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/district/invoices"
    description: "List invoices"
    roles: [FacilitiesDirector, DistrictAdmin, SiteCoordinator]
    code: 200
    input: ["renter_org_id?", "invoice_kind?", "invoice_status?", "permit_id?", "limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []

  # --- Damage assessments ---
  - method: POST
    path: "/district/permits/{permit_id}/damage_assessments"
    description: "Record damage intake on a COMPLETED permit (SiteCoordinator only; freezes deposit release)"
    roles: [SiteCoordinator]
    code: 201
    input: [line_items]
    output: DamageAssessment
    side_effects: ["assessment_status=OPEN", "recorded_by_user_id = X-User-ID", "permit financial_status -> FORFEIT_PENDING"]

  - method: GET
    path: "/district/damage_assessments"
    description: "List damage assessments district-wide (filterable)"
    roles: [FacilitiesDirector, DistrictAdmin, SiteCoordinator]
    code: 200
    input: ["permit_id?", "facility_id?", "assessment_status?", "limit?", "offset?"]
    output: "DamageAssessment[]"
    side_effects: []

  - method: GET
    path: "/district/damage_assessments/{assessment_id}"
    description: "Get damage assessment"
    roles: [FacilitiesDirector, DistrictAdmin, SiteCoordinator, RenterOrgRep]
    code: 200
    input: []
    output: DamageAssessment
    side_effects: []

  - method: POST
    path: "/district/damage_assessments/{assessment_id}/adjudicate"
    description: "Adjudicate damage amount (FacilitiesDirector; cannot be the intake coordinator)"
    roles: [FacilitiesDirector]
    code: 200
    input: [adjudicated_amount_cents]
    output: DamageAssessment
    side_effects: ["assessment_status -> ADJUDICATED"]

  - method: POST
    path: "/district/damage_assessments/{assessment_id}/accept"
    description: "Renter accepts adjudication -> FINAL, forfeiture allocation runs"
    roles: [RenterOrgRep]
    code: 200
    input: []
    output: DamageAssessment
    side_effects: ["assessment_status -> FINAL", "calculations.deposit_forfeiture_allocation runs"]

  - method: POST
    path: "/district/damage_assessments/{assessment_id}/appeal"
    description: "Appeal adjudication within 14 days"
    roles: [RenterOrgRep]
    code: 200
    input: [appeal_reason]
    output: DamageAssessment
    side_effects: ["assessment_status -> APPEALED"]

  - method: POST
    path: "/district/damage_assessments/{assessment_id}/resolve_appeal"
    description: "Resolve appeal with final amount (FacilitiesDirector; not intake coordinator)"
    roles: [FacilitiesDirector]
    code: 200
    input: [final_amount_cents]
    output: DamageAssessment
    side_effects: ["assessment_status -> FINAL", "adjudicated_amount_cents overwritten", "forfeiture allocation runs"]

  # --- Seasonal permits ---
  - method: POST
    path: "/district/seasonal_permits"
    description: "Create a recurring seasonal permit series; expands occurrences and runs each through the approval pipeline. When renewed_from_id is present, expected_series_version is required (OCC on the prior series)."
    roles: [RenterOrgRep, FacilitiesDirector]
    code: 201
    input: [renter_org_id, facility_id, series_name, recurrence_rule, season_start, season_end, "renewed_from_id?", "expected_series_version?"]
    output: SeasonalPermit
    side_effects:
      - "series_status=PENDING_GENERATION -> ACTIVE or PARTIALLY_BLOCKED"
      - "when renewed_from_id present: increments renewed-from SeasonalPermit.version by 1"
      - "one RentalRequest + Permit per conflict-free occurrence; per-occurrence pricing under occurrence's own policy"

  - method: GET
    path: "/district/seasonal_permits/{series_id}"
    description: "Get seasonal permit series"
    roles: [FacilitiesDirector, DistrictAdmin, SiteCoordinator, RenterOrgRep]
    code: 200
    input: []
    output: SeasonalPermit
    side_effects: []

  - method: GET
    path: "/district/seasonal_permits"
    description: "List seasonal permit series"
    roles: [FacilitiesDirector, DistrictAdmin, SiteCoordinator]
    code: 200
    input: ["renter_org_id?", "series_status?", "facility_id?", "renewed_from_id?", "limit?", "offset?"]
    output: "SeasonalPermit[]"
    side_effects: []

  - method: POST
    path: "/district/seasonal_permits/{series_id}/cancel"
    description: "Cancel series; future permits CANCELLED with ADMINISTRATIVE refund"
    roles: [RenterOrgRep, FacilitiesDirector]
    code: 200
    input: [reason]
    output: SeasonalPermit
    side_effects: ["series_status -> CANCELLED", "future permits -> CANCELLED (full refund)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing or malformed"
  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "Role not permitted for this endpoint, or entity-backed role does not own the path resource (RenterOrgRep acting on another org)"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path id does not exist (validated left-to-right through nested path segments)"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, wrong type, enum value outside declared set"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "Current lifecycle/financial state does not permit the requested action (e.g., approve non-UNDER_REVIEW request, cancel non-ISSUED permit, verify work order before completion)"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent entity's current version (OCC)"
  - id: ERR_CAPACITY_EXCEEDED
    http: 422
    condition: "headcount_estimate exceeds Facility.capacity"
  - id: ERR_INSURANCE_INSUFFICIENT
    http: 422
    condition: "No VALID certificate covering the full event window with limits meeting the headcount tier (non-INTERNAL renters)"
  - id: ERR_INVALID_TIME_WINDOW
    http: 422
    condition: "ends_at <= starts_at; duration > 12h; starts_at not in the future at submit; seasonal span > 120 days; buffer not a 15-minute multiple"
  - id: ERR_SCHEDULE_CONFLICT
    http: 409
    condition: "Requested interval overlaps a SCHEDULED SchoolCalendarEvent or an ISSUED/ACTIVE permit's blocked interval on the same facility"
  - id: ERR_REFERENCE_INVALID
    http: 422
    condition: "Referenced facility/site/policy/series invalid: site not ACTIVE, no ACTIVE policy covers starts_at for (rate_class, tier), renewed_from series missing or not renewable"
  - id: ERR_RENTER_NOT_IN_GOOD_STANDING
    http: 402
    condition: "Renter org is SUSPENDED or BARRED"
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 402
    condition: "DEPOSIT_CAPTURE amount != deposit_required_cents exactly"
  - id: ERR_OVERPAYMENT
    http: 402
    condition: "FEE_PAYMENT exceeds invoice remaining balance (total_cents - amount_paid_cents)"
  - id: ERR_DUPLICATE
    http: 409
    condition: "Uniqueness violation: org_name, facility_code within site, site_code, policy (rate_class, tier, effective_from)"
  - id: ERR_IDEMPOTENCY_CONFLICT
    http: 409
    condition: "Idempotency key reused with a different payload"
  - id: ERR_REVISION_LIMIT_EXCEEDED
    http: 409
    condition: "request_revision attempted when revision_round == 3"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Adjudicate/resolve_appeal attempted by the same operator id recorded as recorded_by_user_id on the assessment"
  - id: ERR_APPEAL_WINDOW_ELAPSED
    http: 409
    condition: "Appeal attempted more than 14 days after adjudication"
  - id: ERR_ADJUDICATION_EXCEEDS_CLAIM
    http: 422
    condition: "adjudicated_amount_cents or final_amount_cents exceeds total_claimed_cents"
  - id: ERR_FACILITY_NOT_AVAILABLE
    http: 409
    condition: "Facility is MAINTENANCE_HOLD or RETIRED (request create/begin_review/approve)"
  - id: ERR_SITE_CLOSED
    http: 409
    condition: "Site is CLOSED; no new requests, events, or facilities"
  - id: ERR_PERMIT_NOT_CANCELLABLE
    http: 409
    condition: "Cancel attempted on permit not in ISSUED (post-activation disputes must go through damage assessment)"
  - id: ERR_EMPTY_DAMAGE_CLAIM
    http: 422
    condition: "DamageAssessment line_items empty or any repair_cost_cents <= 0"
  - id: ERR_RENEWAL_NOT_RENEWABLE
    http: 422
    condition: "renewed_from_id references a series not owned by this renter or already renewed by another series"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RenterOrgRep
    description: "Representative of a RenterOrganization; submits requests, uploads insurance, pays, cancels own permits, appeals damage"
    identity: "entity_backed:RenterOrganization"
    exclusive_operations:
      - "POST /district/renters/{org_id}/requests — create request (own org only)"
      - "POST /district/renters/{org_id}/requests/{id}/submit|resubmit|withdraw"
      - "POST /district/permits/{id}/payments — post deposit/fee payments"
      - "POST /district/damage_assessments/{id}/accept|appeal"
    shared_operations:
      - "GET reads of own org's requests, permits, invoices, payments, certificates, seasonal series"
      - "POST /district/permits/{id}/cancel (shared with FacilitiesDirector)"
      - "POST /district/seasonal_permits (shared with FacilitiesDirector)"
      - "POST /district/seasonal_permits/{id}/cancel (shared with FacilitiesDirector)"

  - name: SiteCoordinator
    description: "School-site staff; reviews requests, completes permits, records damage intake"
    identity: "opaque"
    exclusive_operations:
      - "POST /district/requests/{id}/begin_review"
      - "POST /district/requests/{id}/request_revision"
      - "POST /district/permits/{id}/complete"
      - "POST /district/permits/{id}/damage_assessments — damage intake (records X-User-ID as recorded_by_user_id)"
    shared_operations:
      - "GET reads across sites, facilities, requests, permits, work orders, invoices"

  - name: FacilitiesDirector
    description: "District facilities office head; approves/denies, waitlists, bars renters, revokes insurance, adjudicates damage (never own intake)"
    identity: "opaque"
    exclusive_operations:
      - "POST /district/requests/{id}/approve|deny|waitlist"
      - "POST /district/renters — register renter org"
      - "POST /district/renters/{id}/bar"
      - "POST /district/insurance_certificates/{id}/revoke"
      - "POST /district/damage_assessments/{id}/adjudicate|resolve_appeal (blocked when X-User-ID == recorded_by_user_id)"
    shared_operations:
      - "POST /district/permits/{id}/cancel (shared with RenterOrgRep)"
      - "POST /district/seasonal_permits (shared with RenterOrgRep)"
      - "GET reads across all resources"

  - name: CustodialSupervisor
    description: "Custodial operations lead; verifies actual hours on work orders"
    identity: "opaque"
    exclusive_operations:
      - "POST /district/work_orders/{id}/verify"
    shared_operations:
      - "GET reads of facilities, permits, work orders, calendar events"

  - name: DistrictAdmin
    description: "District operations administrator; manages sites, facilities, rate policies, school calendar, and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /district/sites, /district/sites/{id}/close"
      - "POST /district/sites/{id}/facilities, /district/facilities/{id}/hold|release_hold|retire"
      - "POST /district/rate_policies"
      - "POST /district/sites/{id}/calendar_events, /district/calendar_events/{id}/cancel"
      - "POST /district/_clock/set_current_utc"
    shared_operations:
      - "GET reads across all resources"
