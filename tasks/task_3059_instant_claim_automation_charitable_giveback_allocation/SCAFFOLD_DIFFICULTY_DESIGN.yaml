          (A) auto-approves and pays the claim, (B) the payment appends a
          CLAIM_PAYOUT ledger entry on the policy, (C) the ledger mutation
          recomputes the cohort's retained_claims_actual_cents, and (D) that
          recompute mutates giveback_actual_cents — each hop caused by the
          previous one, not by the FNOL call directly. With a 0.75 treaty:
          pot 20000, payout 100000, share 75000, retained 25000, giveback 0.
