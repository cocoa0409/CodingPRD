              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /engagements/${eng_id}/system-components"
              payload: { hostname: "pay-01", component_type: "APPLICATION", function_class: "PAYMENT_APPLICATION", stores_chd: true, facility_name: "DC-EAST", facility_type: "DATA_CENTER", segment_id: "${seg_cde_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { comp_pay_01_id: $.data.id }
            - call: "POST /engagements/${eng_id}/system-components"
              payload: { hostname: "pay-02", component_type: "APPLICATION", function_class: "PAYMENT_APPLICATION", stores_chd: true, facility_name: "DC-EAST", facility_type: "DATA_CENTER", segment_id: "${seg_cde_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { eng_v1: $.data.version }
            - call: "POST /engagements/${eng_id}/sampling-plans"
              payload: { plan_variant: "FINAL", justification_text: "Full coverage of the in-scope inventory.", expected_engagement_version: "${eng_v1}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /engagements/${eng_id}/scope-lock"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /engagements/${eng_id}/requirement-assessments"
              payload: { requirement_ref: "1.2.1", requirement_family: "R1", testing_procedure_count: 3, applicability: "APPLICABLE" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { req_a_id: $.data.id }
            - call: "POST /requirement-assessments/${req_a_id}/start-testing"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /requirement-assessments/${req_a_id}/evidence-items"
              payload: { evidence_type: "DOCUMENT_REVIEW", procedure_ref: "1.2.1.a", sufficiency: "SUFFICIENT", note: "Firewall standard reviewed." }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /requirement-assessments/${req_a_id}/evidence-items"
              payload: { evidence_type: "INTERVIEW", procedure_ref: "1.2.1.b", sufficiency: "SUFFICIENT", interviewee_name: "Priya Raman", interviewee_title: "Network Engineering Manager" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /requirement-assessments/${req_a_id}/evidence-items"
              payload: { evidence_type: "OBSERVATION", procedure_ref: "1.2.1.c", sufficiency: "SUFFICIENT", component_id: "${comp_pay_01_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /requirement-assessments/${req_a_id}/conclusion"
              payload: { conclusion: "IN_PLACE", conclusion_rationale: "Ruleset restricts inbound traffic to documented services." }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /engagements/${eng_id}/network-segments"
              payload: { name: "CONNECTED-OPS", segment_class: "CONNECTED", parent_segment_id: "${seg_cde_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { seg_conn_id: $.data.id }
            - call: "POST /network-segments/${seg_conn_id}/segmentation-test-plan"
              payload: { test_method: "TRAFFIC_ANALYSIS", planned_date: "2026-08-12" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
          trigger:
            - call: "POST /network-segments/${seg_conn_id}/validation-result"
              payload: { outcome: "FAIL", note: "Operational traffic reaches the cardholder network." }
              as: Assessor
              as_user_id: "${lead_id}"
              captures: { seg_status_in_response: $.data.segmentation_status }
            - call: "GET /engagements/${eng_id}/summary"
              payload: {}
              as: ClientRepresentative
              captures: { posture_next_read: $.data.posture, gaps_next_read: $.data.open_gap_count }
            - call: "GET /sampling-plans?engagement_id=${eng_id}"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { plan_status_next_read: "$.data[0].status" }
          assert:
            - "The verdict response itself carries ${seg_status_in_response} == FAILED - the caller does not have to re-read the segment to learn the outcome"
            - "${posture_next_read} == RESTRICTED and ${gaps_next_read} == 1 on the first read after the verdict, with no intervening write of any kind"
            - "${plan_status_next_read} == STALE on that same first read - SamplingPlan.${plan_id} was invalidated inside the verdict request"
            - "GET /requirement-assessments?engagement_id=${eng_id} on the first read already shows RequirementAssessment.${req_a_id} back in IN_TESTING with remediation_status GAP_OPEN"
            - "GET /remediation-items?engagement_id=${eng_id} on the first read already returns total_count 1 with status OPEN"
            - "GET /engagements/${eng_id} and GET /engagements/${eng_id}/summary agree on posture, open_gap_count and unvalidated_segment_count at every point - the two projections are never transiently divergent"
            - "A second identical read returns the same values as the first: nothing settles late, and there is no window in which the engagement still reports posture OPEN after the FAIL verdict has been acknowledged"
            - "Every effect above is attributable to the one accepted request: the engagement version advanced exactly once for that verdict"
