        payload:
          condition_codes:
          - DEEP_VEIN_THROMBOSIS
        as: Guest
        as_user_id: ${guest_id}
      - call: POST /intake-forms/${intake_id}/submit
        payload: {}
        as: Guest
        as_user_id: ${guest_id}
      - call: POST /intake-forms/${intake_id}/screen
        payload: {}
        as: ComplianceOfficer
        as_user_id: co-3
      - call: POST /intake-forms/${intake_id}/amend
        payload:
          condition_codes: []
        as: Guest
        as_user_id: ${guest_id}
      - call: POST /intake-forms/${intake_id}/submit
        payload: {}
        as: Guest
        as_user_id: ${guest_id}
      - call: POST /intake-forms/${intake_id}/screen
        payload: {}
        as: ComplianceOfficer
        as_user_id: co-3
      - call: POST /intake-forms/${intake_id}/amend
        payload:
          condition_codes: []
        as: Guest
        as_user_id: ${guest_id}
      assert:
      - 'the first trigger returns 409 ERR_INVALID_INTAKE_STATE: amend departs only from SCREENED_FLAGGED, and this form is still DRAFT'
      - after the first screen the form is SCREENED_FLAGGED with flagged_condition_codes == ["ACTIVE_INFECTION"] and amendment_round == 0
      - the fourth trigger (first legal amend) returns 200 with status == DRAFT, amendment_round == 1, flagged_condition_codes == [] and screened_by_user_id == null
      - 'the amend also recomputes the guest pointer: Guest.${guest_id}.authoritative_intake_form_id becomes null again because no screened form remains'
      - the second legal amend brings amendment_round to 2, and the form screens SCREENED_FLAGGED again on DEEP_VEIN_THROMBOSIS then SCREENED_CLEAR on the empty set
      - the last trigger returns 409 ERR_AMENDMENT_LIMIT only if the form is SCREENED_FLAGGED; when the final screen produced SCREENED_CLEAR it returns 409 ERR_INVALID_INTAKE_STATE — priority 9 is checked before priority 34
