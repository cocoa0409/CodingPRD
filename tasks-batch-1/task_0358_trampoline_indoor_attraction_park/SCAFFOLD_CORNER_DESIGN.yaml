      - name: addon_catalog_price_overrides_input
        claim_type: Constants Applied
        grounds: [calculations.addon_pricing, entities.PassAddOn.fields.unit_price_cents]
        distinguishing_aspect: "Attaching PHOTO_PKG x1 resolves unit_price_cents=2500 from the ADDON_PRICES catalog and line_total_cents=2500 (server catalog, not client input)."
        test_recipe:
          setup: ["A reservation pass exists."]
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ParkManager
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T10:00:00Z", ends_at: "2026-06-20T12:00:00Z", jump_capacity: 10, base_price_cents: 2000 }
              as: ParkManager
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /park/participants"
              payload: { park_id: "${park_id}", full_name: "AO J", birthdate: "1990-01-01T00:00:00Z" }
