      - name: work_order_and_disconnection_actions_outside_their_admissible_parent_states_are_refused
        claim_type: invalid_transition
        grounds:
          - validations.priority_31
          - validations.priority_32
          - state_machines.DemolitionWorkOrder
          - state_machines.UtilityDisconnection
        distinguishing_aspect: |
          From ISSUED the work order refuses start, complete and fail-inspection with
          ERR_INVALID_WORK_ORDER_STATE; once it reaches IN_PROGRESS the same error blocks ordering a
          further disconnection, and resolving an existing child returns the child-specific
          ERR_INVALID_DISCONNECTION_STATE - the child's own status is CONFIRMED and legal, so the
          refusal is keyed on the parent's status.
        test_recipe:
          setup:
            - "One MitigationProject in DRAFT with one parcel, one ACTIVE asbestos-certified contractor and one work order ISSUED with asbestos_survey_status CLEARED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
