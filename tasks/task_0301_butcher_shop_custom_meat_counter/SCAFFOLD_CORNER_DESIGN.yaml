              payload: { drawn_lot_id: "${lot_id}", catch_weight_g: 2001, expected_inventory_lot_version: "${lot_v}" }
              as: Butcher
              captures: { err: "$.data.error_id" }
          assert:
            - "draw response error_id == ERR_INSUFFICIENT_LOT_WEIGHT"

      - name: holiday_capacity_exceeded_when_over
        claim_type: Aggregate validation
        grounds: ["validations[priority=15]", "errors[ERR_HOLIDAY_CAPACITY_EXCEEDED]"]
        distinguishing_aspect: "A HOLIDAY order pushing window committed_g to 10001 against capacity 10000 returns ERR_HOLIDAY_CAPACITY_EXCEEDED (409)."
        test_recipe:
          setup: ["A HolidayWindow capacity 10000g before cutoff with 5000g already committed; a 5001g order over capacity."]
          setup_api_calls:
            - call: "POST /pricing-policies"
              payload: { shrink_pct_whole_cut: 0.04, shrink_pct_grind: 0.10, preferred_discount_pct: 0.10, wholesale_discount_pct: 0.20, bulk_threshold_g: 5000, bulk_extra_discount_pct: 0.05 }
              as: ShiftManager
            - call: "POST /cut-types"
              payload: { code: "RIBEYE", species: "BEEF", base_price_cents_per_kg: 4000 }
              as: ShiftManager
              captures: { ribeye_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-19T00:00:00Z" }
              as: ShiftManager
            - call: "POST /holiday-windows"
              payload: { name: "THANKSGIVING_2026", pickup_date: "2026-11-26T00:00:00Z", capacity_g: 10000, cutoff_at: "2026-11-20T00:00:00Z" }
              as: ShiftManager
              captures: { win_id: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Ulla Under", phone: "555-1009" }
              as: CounterClerk
              captures: { u_id: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Otto Over", phone: "555-1010" }
              as: CounterClerk
              captures: { o_id: "$.data.id" }
            - call: "POST /custom-orders"
              payload: { customer_id: "${u_id}", order_kind: "HOLIDAY", holiday_window_id: "${win_id}", pickup_date: "2026-11-26T00:00:00Z", lines: [ { cut_type_id: "${ribeye_id}", ordered_weight_g: 5000 } ] }
              as: CounterClerk
              as_user_id: "${u_id}"
          trigger:
            - call: "POST /custom-orders"
              payload: { customer_id: "${o_id}", order_kind: "HOLIDAY", holiday_window_id: "${win_id}", pickup_date: "2026-11-26T00:00:00Z", lines: [ { cut_type_id: "${ribeye_id}", ordered_weight_g: 5001 } ] }
              as: CounterClerk
              as_user_id: "${o_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "second order response error_id == ERR_HOLIDAY_CAPACITY_EXCEEDED"

      - name: aging_not_complete_before_target_days
        claim_type: Temporal validation
        grounds: ["validations[priority=8]", "errors[ERR_AGING_NOT_COMPLETE]"]
        distinguishing_aspect: "complete-aging at clock 2026-06-07 (6 days < target 7) returns ERR_AGING_NOT_COMPLETE (409)."
        test_recipe:
          setup: ["A DRY_RIBEYE AGING lot started 2026-06-01 target 7 days; clock at 2026-06-07."]
          setup_api_calls:
            - call: "POST /cut-types"
              payload: { code: "DRY_RIBEYE", species: "BEEF", base_price_cents_per_kg: 6000, requires_dry_age: true }
              as: ShiftManager
              captures: { dr_id: "$.data.id" }
            - call: "POST /dry-age-lockers"
              payload: { name: "LOCKER-EARLY", capacity_g: 20000, min_temp_c: 0, max_temp_c: 4 }
              as: ShiftManager
              captures: { locker_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShiftManager
            - call: "POST /inventory-lots"
              payload: { cut_type_id: "${dr_id}", received_weight_g: 5000, aging_target_days: 7 }
              as: Butcher
              captures: { lot_id: "$.data.id" }
            - call: "POST /inventory-lots/${lot_id}/start-aging"
              payload: { locker_id: "${locker_id}" }
              as: Butcher
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-07T00:00:00Z" }
              as: ShiftManager
          trigger:
            - call: "POST /inventory-lots/${lot_id}/complete-aging"
              payload: {}
              as: Butcher
              captures: { err: "$.data.error_id" }
          assert:
            - "complete-aging response error_id == ERR_AGING_NOT_COMPLETE"

      - name: locker_over_capacity_on_start_aging
        claim_type: Violation → Error
        grounds: ["validations[priority=13]", "errors[ERR_LOCKER_OVER_CAPACITY]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / locker_capacity_aggregate_buffer_overlap"
          rationale: "ERR_LOCKER_OVER_CAPACITY is the failure path of the named §1.8 aggregate-capacity overlap instance."

  # =========================================================================
  - section: endpoints
    instances:
      - name: pricing_policy_activation_deactivates_prior
        claim_type: Action endpoint
        grounds: [endpoints, entities.PricingPolicy.fields.is_active]
        distinguishing_aspect: "Creating a second PricingPolicy sets its is_active true and flips the prior policy's is_active to false."
        test_recipe:
          setup: ["One active PricingPolicy already exists."]
          setup_api_calls:
            - call: "POST /pricing-policies"
              payload: { shrink_pct_whole_cut: 0.04, shrink_pct_grind: 0.10, preferred_discount_pct: 0.10, wholesale_discount_pct: 0.20, bulk_threshold_g: 5000, bulk_extra_discount_pct: 0.05 }
              as: ShiftManager
              captures: { first_id: "$.data.id" }
          trigger:
            - call: "POST /pricing-policies"
              payload: { shrink_pct_whole_cut: 0.05, shrink_pct_grind: 0.12, preferred_discount_pct: 0.10, wholesale_discount_pct: 0.20, bulk_threshold_g: 6000, bulk_extra_discount_pct: 0.05 }
              as: ShiftManager
              captures: { second_id: "$.data.id", active2: "$.data.is_active" }
            - call: "GET /pricing-policies/${first_id}"
              payload: {}
              as: ShiftManager
              captures: { active1: "$.data.is_active" }
          assert:
            - "PricingPolicy.${second_id}.is_active == true"
            - "PricingPolicy.${first_id}.is_active == false"

      - name: break_down_share_spawns_lots_with_source
        claim_type: Action endpoint
        grounds: [state_machines.AnimalShare.FULLY_CLAIMED_to_BROKEN_DOWN, entities.InventoryLot.fields.source_share_id]
        distinguishing_aspect: "Breaking down a FULLY_CLAIMED share spawns InventoryLot rows whose source_share_id equals the share id, discoverable via GET /inventory-lots?source_share_id=."
        test_recipe:
          setup: ["A FULLY_CLAIMED BEEF share (two HALF claims), carcass 100000g."]
          setup_api_calls:
            - call: "POST /animal-shares"
              payload: { species: "BEEF", carcass_weight_g: 100000, deposit_cents: 8000 }
              as: ShiftManager
              captures: { share_id: "$.data.id" }
            - call: "POST /cut-types"
              payload: { code: "RIBEYE", species: "BEEF", base_price_cents_per_kg: 4000 }
              as: ShiftManager
              captures: { ribeye_id: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Half One", phone: "555-1011" }
              as: CounterClerk
              captures: { c1_id: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Half Two", phone: "555-1012" }
              as: CounterClerk
              captures: { c2_id: "$.data.id" }
            - call: "POST /share-claims"
              payload: { animal_share_id: "${share_id}", customer_id: "${c1_id}", fraction: "HALF" }
              as: CounterClerk
              as_user_id: "${c1_id}"
            - call: "POST /share-claims"
              payload: { animal_share_id: "${share_id}", customer_id: "${c2_id}", fraction: "HALF" }
              as: CounterClerk
              as_user_id: "${c2_id}"
          trigger:
            - call: "POST /animal-shares/${share_id}/break-down"
              payload: { lots: [ { cut_type_id: "${ribeye_id}", received_weight_g: 4000 } ] }
              as: Butcher
              captures: { st: "$.data.share_status" }
            - call: "GET /inventory-lots"
              payload: { source_share_id: "${share_id}" }
              as: Butcher
              captures: { first_lot_status: "$.data[0].lot_status" }
          assert:
            - "AnimalShare.${share_id}.share_status == BROKEN_DOWN"
            - "GET /inventory-lots?source_share_id returns >= 1 lot with source_share_id == ${share_id}"

