      - name: distribute_rejected_when_redemption_exceeds_held_units
        claim_type: violation_to_error
        grounds: ["validations[priority=28]", "errors[ERR_INSUFFICIENT_UNITS]", calculations.distribution_redemption_units]
        distinguishing_aspect: "A QUASI fund (underwater-exempt) whose price crashed to 2000 millicents faces an APPROVED distribution of 510000 cents needing 255000000000 micro-units against holdings of 50000000000 — distribute fails atomically and the distribution stays APPROVED."
        test_recipe:
          setup: ["pool with policy (rate 2000bps — the maximum) ADOPTED, engaged manager, ACTIVE QUASI fund FIU with 50000000000 micro-units (gift 5000000) from Q1; Q2 finalized at price 2000 (EMV 100000); FY2026 distribution APPROVED with final 510000 (base (5000000+100000)/2 = 2550000, raw 510000, QUASI exempt from the underwater lock)"]
