    code: 200
    input: ["vessel_call_id?", "status?", "limit?", "offset?"]
    output: ShiftWindow[]
    side_effects: []
  - method: GET
    path: "/api/shift-windows/{id}"
    description: "Get a shift window"
    roles: [StevedoreAdmin, StevedoreSuperintendent, LaborHallDispatcher, GangForeman, ClaimsAdjuster, PayrollClerk, BillingClerk]
    code: 200
    input: []
