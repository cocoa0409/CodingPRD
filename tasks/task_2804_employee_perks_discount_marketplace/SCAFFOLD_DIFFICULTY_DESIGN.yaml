          assert:
            - "${commission} == 806, ${share} == 202 and ${net} == 6717"
            - "${dispute_status} == RESOLVED_MERCHANT_FAULT and ${credit} == 500"
            - "GET /perks/redemptions/${red_id}/ledger-entries with no entry_type filter returns exactly 6 rows: COMMISSION_ACCRUAL +806, EMPLOYER_SHARE -202, COMMISSION_REVERSAL -806, EMPLOYER_SHARE_REVERSAL +202, DISPUTE_CREDIT -500, DISPUTE_CREDIT_RECOVERY +500"
            - "the sum of amount_cents over those 6 rows == 0"
            - "${reversal_amount} == -806"
            - "${share_reversal_amount} == 202"
            - "${credit_amount} == -500"
            - "${recovery_amount} == 500"
            - "${employer_accrued} == 0"
            - "${merchant_payable} == 500"
            - "Redemption.${red_id}.fulfillment_status == REFUNDED"
            - "Redemption.${red_id}.verification_status == VERIFIED, untouched by the refund on the parallel dimension"

