scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: copay_funded_vs_indigent_lien_variant
        grounds:
          - calculations.copay_amount
          - calculations.indigency_determination
          - entities.CopayCharge.fields.charge_variant
          - entities.CopayCharge.fields.amount_cents
          - "validations[priority=34]"
        distinguishing_aspect: |
          The dual variant lives on the CopayCharge / LedgerEntry money domain: an identical
          SICK_CALL encounter posts 500 cents as a CHARGE against a funded inmate but 250
          cents as a LIEN against an indigent inmate, and the CopayCharge.status differs
          (POSTED vs DEBT_LIEN).
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "Inmate B-1001 with a single 1000-cent DEPOSIT ledger entry, so account_balance_cents is 1000 and the 30-day peak is 1000."
            - "Inmate B-1002 with an empty ledger, so account_balance_cents is 0 and the peak stands in as 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "B-1001", full_name: "Alex Rivera", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z", admission_type: "NEW_BOOKING" }
              as: IntakeOfficer
              captures: { inm_f: $.data.id }
            - call: "POST /inmates"
              payload: { booking_number: "B-1002", full_name: "Blair Cortez", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z", admission_type: "NEW_BOOKING" }
              as: IntakeOfficer
              captures: { inm_i: $.data.id }
            - call: "POST /inmates/${inm_f}/ledger-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 1000, memo: "commissary deposit" }
              as: HealthServicesAdmin
          trigger:
            - call: "POST /inmates/${inm_f}/copay-charges"
              payload: { encounter_type: "SICK_CALL" }
              as: HealthServicesAdmin
              captures: { chg_f: $.data.id }
            - call: "POST /inmates/${inm_i}/copay-charges"
              payload: { encounter_type: "SICK_CALL" }
              as: HealthServicesAdmin
              captures: { chg_i: $.data.id }
          assert:
            - "CopayCharge.${chg_f}.charge_variant == FUNDED"
            - "CopayCharge.${chg_f}.amount_cents == 500"
            - "CopayCharge.${chg_f}.status == POSTED"
            - "CopayCharge.${chg_f}.indigency_snapshot == false"
            - "Inmate.${inm_f}.account_balance_cents == 500"
            - "CopayCharge.${chg_i}.charge_variant == INDIGENT"
            - "CopayCharge.${chg_i}.amount_cents == 250"
            - "CopayCharge.${chg_i}.status == DEBT_LIEN"
            - "CopayCharge.${chg_i}.indigency_snapshot == true"
            - "Inmate.${inm_i}.account_balance_cents == -250"

      - name: medication_adherence_dot_vs_kop_denominator
        grounds:
          - calculations.medication_adherence_pct
          - entities.MedicationOrder.fields.route_mode
          - entities.MedicationOrder.fields.adherence_pct
          - state_machines.MedicationAdministration.SCHEDULED_to_ADMINISTERED
        distinguishing_aspect: |
          The dual variant lives on the MedicationOrder clinical domain, a different entity
          domain from the co-pay money variant: two doses actually taken score 66.67 under
          the DOT event-count denominator (3 scored events) and 50.00 under the KOP
          expected-unit denominator (4 expected units) for the same two-day window.
        test_recipe:
          setup:
            - "Logical clock advanced stepwise from 2026-05-01T00:00:00Z to 2026-05-02T08:00:00Z."
            - "One inmate holding two ACTIVE orders of different drug_class: a DOT PSYCHOTROPIC order and a KOP CHRONIC_MAINTENANCE order, both 2 doses/day from 2026-05-01 through 2026-05-03."
            - "The DOT order has three recorded administrations: ON_TIME ADMINISTERED, LATE ADMINISTERED, and MISSED."
            - "The KOP order has one pill count: 4 units dispensed, 2 units returned."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "B-1010", full_name: "Casey Nunez", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z", admission_type: "NEW_BOOKING" }
              as: IntakeOfficer
              captures: { inm: $.data.id, inm_v1: $.data.version }
            - call: "POST /medication-orders"
              payload: { inmate_id: "${inm}", drug_name: "Sertraline", drug_class: "PSYCHOTROPIC", route_mode: "DOT", doses_per_day: 2, start_date: "2026-05-01T00:00:00Z", end_date: "2026-05-03T00:00:00Z", expected_inmate_version: "${inm_v1}" }
              as: Provider
              as_user_id: "u-prov-1"
              captures: { ord_dot: $.data.id }
            - call: "GET /inmates/${inm}"
              payload: {}
              as: Provider
              as_user_id: "u-prov-1"
              captures: { inm_v2: $.data.version }
            - call: "POST /medication-orders"
              payload: { inmate_id: "${inm}", drug_name: "Lisinopril", drug_class: "CHRONIC_MAINTENANCE", route_mode: "KOP", doses_per_day: 2, start_date: "2026-05-01T00:00:00Z", end_date: "2026-05-03T00:00:00Z", expected_inmate_version: "${inm_v2}" }
              as: Provider
              as_user_id: "u-prov-1"
              captures: { ord_kop: $.data.id }
            - call: "POST /medication-orders/${ord_dot}/administrations"
              payload: { scheduled_at: "2026-05-01T08:00:00Z" }
              as: Nurse
              as_user_id: "u-nurse-1"
              captures: { adm1: $.data.id }
            - call: "POST /medication-orders/${ord_dot}/administrations"
              payload: { scheduled_at: "2026-05-01T20:00:00Z" }
              as: Nurse
              as_user_id: "u-nurse-1"
              captures: { adm2: $.data.id }
            - call: "POST /medication-orders/${ord_dot}/administrations"
              payload: { scheduled_at: "2026-05-02T08:00:00Z" }
              as: Nurse
              as_user_id: "u-nurse-1"
              captures: { adm3: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T08:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /medication-administrations/${adm1}/record"
              payload: { outcome: "ADMINISTERED", observed_swallow: true }
              as: Nurse
              as_user_id: "u-nurse-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T21:30:00Z" }
              as: HealthServicesAdmin
            - call: "POST /medication-administrations/${adm2}/record"
              payload: { outcome: "ADMINISTERED", observed_swallow: true }
              as: Nurse
              as_user_id: "u-nurse-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T08:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /medication-administrations/${adm3}/record"
              payload: { outcome: "MISSED" }
              as: Nurse
              as_user_id: "u-nurse-1"
          trigger:
            - call: "POST /medication-orders/${ord_kop}/pill-count"
              payload: { units_dispensed_delta: 4, units_returned_delta: 2 }
              as: Nurse
              as_user_id: "u-nurse-1"
          assert:
            - "MedicationAdministration.${adm1}.timing_class == ON_TIME"
            - "MedicationAdministration.${adm2}.timing_class == LATE"
            - "MedicationAdministration.${adm3}.timing_class == MISSED_WINDOW"
            - "MedicationOrder.${ord_dot}.adherence_pct == 66.67"
            - "MedicationOrder.${ord_kop}.adherence_pct == 50.00"

  - rule_id: combinatorial_formula
    instances:

      - name: transport_lead_time_nested_max_min_three_inputs
        grounds:
          - calculations.transport_lead_time_requirement
          - calculations.transport_escort_requirement
          - "validations[priority=27]"
          - "errors[ERR_TRANSPORT_LEAD_TIME_TOO_SHORT]"
        distinguishing_aspect: |
          Mode (a): required_lead_minutes is a nested max(min(...)) over THREE independent
          inputs - referral urgency, escort level derived from custody_level, and the
          referral's no_show_count - so an EMERGENT trip for a MAXIMUM-custody inmate needs
          480 minutes, not the 60-minute EMERGENT floor.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "A MAXIMUM-custody inmate, so required_escort_level is ESCORT_2_ARMED (surcharge 480 minutes)."
            - "An EMERGENT SpecialtyReferral in status AUTHORIZED with no_show_count 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "B-1020", full_name: "Dana Ellis", facility_code: "FAC-01", custody_level: "MAXIMUM", booked_at: "2026-05-01T00:00:00Z", admission_type: "NEW_BOOKING" }
              as: IntakeOfficer
              captures: { inm: $.data.id }
            - call: "POST /specialty-referrals"
              payload: { inmate_id: "${inm}", specialty: "CARDIOLOGY", urgency: "EMERGENT" }
              as: Provider
              as_user_id: "u-prov-1"
              captures: { ref: $.data.id }
            - call: "POST /specialty-referrals/${ref}/submit-for-review"
              payload: { retrospective: false }
              as: Provider
              as_user_id: "u-prov-1"
              captures: { ur: $.data.id }
            - call: "POST /utilization-reviews/${ur}/decide"
              payload: { decision: "APPROVE" }
              as: UtilizationReviewer
              as_user_id: "u-ur-1"
            - call: "GET /specialty-referrals/${ref}"
              payload: {}
              as: CustodyOfficer
              as_user_id: "u-co-1"
              captures: { ref_v: $.data.version }
          trigger:
            - call: "POST /transport-orders"
              payload: { referral_id: "${ref}", appointment_at: "2026-05-01T07:59:00Z", expected_referral_version: "${ref_v}" }
              as: CustodyOfficer
              as_user_id: "u-co-1"
            - call: "POST /transport-orders"
              payload: { referral_id: "${ref}", appointment_at: "2026-05-01T08:00:00Z", expected_referral_version: "${ref_v}" }
              as: CustodyOfficer
              as_user_id: "u-co-1"
              captures: { trip: $.data.id }
          assert:
            - "The first trigger call returns 422 with error_id ERR_TRANSPORT_LEAD_TIME_TOO_SHORT because lead_minutes == 479 and required_lead_minutes == 480"
            - "The second trigger call returns 201"
            - "TransportOrder.${trip}.required_escort_level == ESCORT_2_ARMED"
            - "TransportOrder.${trip}.lead_minutes == 480"
            - "TransportOrder.${trip}.status == DRAFT"

      - name: facility_adherence_round_per_order_then_average
        grounds:
          - calculations.facility_adherence_index
          - calculations.medication_adherence_pct
          - entities.MedicationOrder.fields.adherence_pct
        distinguishing_aspect: |
          Mode (b): the rounding ORDER is pinned - each order's adherence_pct is rounded to
          2 dp first and the already-rounded values are averaged, giving 77.78; pooling raw
          numerators and denominators across orders and rounding once at the end gives
          60.00, a different number from identical data.
        test_recipe:
          setup:
            - "Logical clock advanced stepwise from 2026-05-01T00:00:00Z to 2026-05-03T08:00:00Z."
            - "One inmate at facility FAC-01 with three ACTIVE DOT orders of different drug_class, all 1 dose/day from 2026-05-01 through 2026-05-05."
            - "Order A has three scored administrations, one ADMINISTERED ON_TIME and two MISSED (adherence 33.33)."
            - "Orders B and C each have one ADMINISTERED ON_TIME administration (adherence 100.00 each)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "B-1030", full_name: "Emery Fox", facility_code: "FAC-01", custody_level: "MINIMUM", booked_at: "2026-05-01T00:00:00Z", admission_type: "NEW_BOOKING" }
              as: IntakeOfficer
              captures: { inm: $.data.id, inm_v1: $.data.version }
            - call: "POST /medication-orders"
              payload: { inmate_id: "${inm}", drug_name: "Sertraline", drug_class: "PSYCHOTROPIC", route_mode: "DOT", doses_per_day: 1, start_date: "2026-05-01T00:00:00Z", end_date: "2026-05-05T00:00:00Z", expected_inmate_version: "${inm_v1}" }
              as: Provider
              as_user_id: "u-prov-1"
              captures: { ord_a: $.data.id }
            - call: "GET /inmates/${inm}"
              payload: {}
              as: Provider
              as_user_id: "u-prov-1"
              captures: { inm_v2: $.data.version }
            - call: "POST /medication-orders"
              payload: { inmate_id: "${inm}", drug_name: "Lisinopril", drug_class: "CHRONIC_MAINTENANCE", route_mode: "DOT", doses_per_day: 1, start_date: "2026-05-01T00:00:00Z", end_date: "2026-05-05T00:00:00Z", expected_inmate_version: "${inm_v2}" }
              as: Provider
              as_user_id: "u-prov-1"
              captures: { ord_b: $.data.id }
            - call: "GET /inmates/${inm}"
              payload: {}
              as: Provider
              as_user_id: "u-prov-1"
              captures: { inm_v3: $.data.version }
            - call: "POST /medication-orders"
              payload: { inmate_id: "${inm}", drug_name: "Amoxicillin", drug_class: "ACUTE_SHORT_COURSE", route_mode: "DOT", doses_per_day: 1, start_date: "2026-05-01T00:00:00Z", end_date: "2026-05-05T00:00:00Z", expected_inmate_version: "${inm_v3}" }
              as: Provider
              as_user_id: "u-prov-1"
              captures: { ord_c: $.data.id }
            - call: "POST /medication-orders/${ord_a}/administrations"
              payload: { scheduled_at: "2026-05-01T08:00:00Z" }
              as: Nurse
              as_user_id: "u-nurse-1"
              captures: { a1: $.data.id }
            - call: "POST /medication-orders/${ord_a}/administrations"
              payload: { scheduled_at: "2026-05-02T08:00:00Z" }
              as: Nurse
              as_user_id: "u-nurse-1"
              captures: { a2: $.data.id }
            - call: "POST /medication-orders/${ord_a}/administrations"
              payload: { scheduled_at: "2026-05-03T08:00:00Z" }
              as: Nurse
              as_user_id: "u-nurse-1"
              captures: { a3: $.data.id }
            - call: "POST /medication-orders/${ord_b}/administrations"
              payload: { scheduled_at: "2026-05-01T09:00:00Z" }
              as: Nurse
              as_user_id: "u-nurse-1"
              captures: { b1: $.data.id }
            - call: "POST /medication-orders/${ord_c}/administrations"
              payload: { scheduled_at: "2026-05-01T10:00:00Z" }
              as: Nurse
              as_user_id: "u-nurse-1"
              captures: { c1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T08:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /medication-administrations/${a1}/record"
              payload: { outcome: "ADMINISTERED", observed_swallow: true }
              as: Nurse
              as_user_id: "u-nurse-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T09:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /medication-administrations/${b1}/record"
              payload: { outcome: "ADMINISTERED", observed_swallow: true }
              as: Nurse
              as_user_id: "u-nurse-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T10:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /medication-administrations/${c1}/record"
              payload: { outcome: "ADMINISTERED", observed_swallow: true }
              as: Nurse
              as_user_id: "u-nurse-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T08:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /medication-administrations/${a2}/record"
              payload: { outcome: "MISSED" }
              as: Nurse
              as_user_id: "u-nurse-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-03T08:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /medication-administrations/${a3}/record"
              payload: { outcome: "MISSED" }
              as: Nurse
              as_user_id: "u-nurse-1"
          trigger:
            - call: "GET /reports/facility-adherence"
              payload: { facility_code: "FAC-01" }
              as: HealthServicesAdmin
          assert:
            - "MedicationOrder.${ord_a}.adherence_pct == 33.33"
            - "MedicationOrder.${ord_b}.adherence_pct == 100.00"
            - "MedicationOrder.${ord_c}.adherence_pct == 100.00"
            - "response data order_count == 3"
            - "response data adherence_index == 77.78"
            - "adherence_index != 60.00, which is what pooling 3 administered over 5 scored events would produce"

      - name: copay_indigency_evaluated_on_pre_charge_ledger
        grounds:
          - calculations.copay_amount
          - calculations.indigency_determination
          - calculations.inmate_account_balance
          - entities.CopayCharge.fields.indigency_snapshot
        distinguishing_aspect: |
          Mode (c): the dependency looks circular - amount_cents depends on indigency,
          indigency depends on account_balance_cents, and this charge changes that balance -
          so the scaffold pins the evaluation order to PRE-charge, yielding FUNDED / 500;
          evaluating after the entry posts would yield INDIGENT / 250.
        test_recipe:
          setup:
            - "A 250-cent DEPOSIT posted at 2026-05-01T00:00:00Z, then the clock advanced to 2026-06-05T00:00:00Z."
            - "At that clock the 30-day lookback window is [2026-05-06, 2026-06-05] and contains NO ledger entries, so the peak stands in as the current balance 250."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "B-1040", full_name: "Frankie Gill", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z", admission_type: "NEW_BOOKING" }
              as: IntakeOfficer
              captures: { inm: $.data.id }
            - call: "POST /inmates/${inm}/ledger-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 250, memo: "family deposit" }
              as: HealthServicesAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: HealthServicesAdmin
          trigger:
            - call: "POST /inmates/${inm}/copay-charges"
              payload: { encounter_type: "SICK_CALL" }
              as: HealthServicesAdmin
              captures: { chg: $.data.id }
          assert:
            - "CopayCharge.${chg}.indigency_snapshot == false"
            - "CopayCharge.${chg}.charge_variant == FUNDED"
            - "CopayCharge.${chg}.amount_cents == 500"
            - "CopayCharge.${chg}.status == POSTED"
            - "Inmate.${inm}.account_balance_cents == -250"
            - "Inmate.${inm}.indigent_flag == true, because the read-time evaluation AFTER the charge sees the CHARGE entry with balance_after_cents -250 inside the window"
            - "amount_cents != 250, which is the value a post-charge indigency evaluation would have produced"

  - rule_id: non_linear_state_machine
    instances:

      - name: inmate_parallel_axes_freeze_leaves_custody_untouched
        grounds:
          - state_machines.Inmate.OPEN_to_FROZEN
          - state_machines.Inmate.FROZEN_to_OPEN
          - entities.Inmate.fields.records_state
          - entities.Inmate.fields.custody_status
          - "validations[priority=7]"
        distinguishing_aspect: |
          PARALLEL shape on the Inmate entity: records_state moves OPEN -> FROZEN -> OPEN
          while custody_status stays IN_CUSTODY for the whole sequence, and the frozen
          interval gates a clinical write that succeeds again after the unfreeze.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "One inmate in custody_status IN_CUSTODY and records_state OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "B-1050", full_name: "Gale Hart", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z", admission_type: "NEW_BOOKING" }
              as: IntakeOfficer
              captures: { inm: $.data.id }
          trigger:
            - call: "POST /inmates/${inm}/records-freeze"
              payload: {}
              as: HealthServicesAdmin
            - call: "POST /sick-call-requests"
              payload: { inmate_id: "${inm}", complaint_text: "tooth pain", encounter_type: "SICK_CALL" }
              as: Nurse
              as_user_id: "u-nurse-1"
            - call: "POST /inmates/${inm}/records-unfreeze"
              payload: {}
              as: HealthServicesAdmin
            - call: "POST /sick-call-requests"
              payload: { inmate_id: "${inm}", complaint_text: "tooth pain", encounter_type: "SICK_CALL" }
              as: Nurse
              as_user_id: "u-nurse-1"
              captures: { sc: $.data.id }
          assert:
            - "The first records-freeze response has records_state == FROZEN and custody_status == IN_CUSTODY"
            - "The second trigger call returns 409 with error_id ERR_RECORDS_FROZEN"
            - "The records-unfreeze response has records_state == OPEN and custody_status == IN_CUSTODY"
            - "The fourth trigger call returns 201 and SickCallRequest.${sc}.status == SUBMITTED"
            - "Inmate.${inm}.custody_status == IN_CUSTODY"
            - "Inmate.${inm}.records_state == OPEN"
            - "Inmate.${inm}.version == 3, because only the freeze and the unfreeze mutate the Inmate row"

      - name: grievance_remand_cycle_returns_appeal_to_formal
        grounds:
          - state_machines.Grievance.UNDER_REVIEW_to_REMANDED
          - state_machines.Grievance.REMANDED_to_UNDER_REVIEW
          - state_machines.Grievance.DECIDED_to_FILED
          - calculations.grievance_response_due
          - entities.Grievance.fields.remand_count
        distinguishing_aspect: |
          CYCLIC shape on the Grievance entity - a different entity from the parallel Inmate
          machine: the row re-enters FILED twice through stage escalation and then re-enters
          UNDER_REVIEW through the APPEAL -> FORMAL remand loop, ending at stage FORMAL with
          remand_count 1 and a freshly recomputed 15-day response window.
        test_recipe:
          setup:
            - "Logical clock held at 2026-05-01T00:00:00Z for the whole ladder."
            - "One inmate with a non-billing grievance filed on the same day as the grieved event."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
