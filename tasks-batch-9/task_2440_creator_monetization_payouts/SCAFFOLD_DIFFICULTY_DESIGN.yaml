            - "GET /monetization/creators/${cr_id}/ledger-entries?entry_type=ACCRUAL&source_id=${ev_id} returns exactly one LedgerEntry with amount_cents == 666"
            - "Creator.${cr_id}.ledger_balance_cents == 666 (1000250 accrued, 1000000 debited, 250 fee, then +666)"

      - name: payout_fee_double_ceiling_nesting_order_mode_b
        mode: "b_nested_rounding_order_matters"
        grounds:
          - calculations.payout_fee_and_amount
          - entities.Creator.fields.payout_method
          - entities.Payout.fields.payable_before_fee_cents
          - entities.Payout.fields.fee_cents
          - entities.Payout.fields.amount_cents
          - entities.LedgerEntry.fields.entry_type
          - "state_machines.Payout.initial_state"
        distinguishing_aspect: |
          Mode (b): payout_fee_and_amount rounds twice with CEIL - once on the
          percentage component (step 3) and once on the volume-tier product
          (step 4) - and the two CEILs do not commute. For INSTANT_DEBIT with
          payable_before_fee_cents 60340: step 3 gives 100 + ceil(60340*150/10000)
          == 100 + ceil(905.1) == 1006, step 4 gives ceil(1006*7500/10000) ==
          ceil(754.5) == 755, so fee_cents == 755 and amount_cents == 59585.
          Collapsing the two roundings into one - ceil((100 + 60340*150/10000) *
          7500/10000) == ceil(753.825) == 754 - is off by exactly one cent.
        test_recipe:
          setup:
