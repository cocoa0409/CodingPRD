        distinguishing_aspect: "With the mission RANGE_SCHEDULED, no weather or COLA active, but the logical clock one day before window_open (2026-10-09 < 2026-10-10), launch is 422 ERR_LAUNCH_WINDOW_VIOLATION — the closed-bound window check fails on the low side."
