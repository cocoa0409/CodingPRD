          assert:
            - "W2's issue is 422 ERR_INVALID_SUPERSEDE_CHAIN (UPGRADE requires a WATCH prior, W1 is a WARNING)"
            - "W3's issue is 422 ERR_INVALID_SUPERSEDE_CHAIN (CONTINUATION requires the same level, WATCH != WARNING)"
            - "Product.${ch_w1} remains ISSUED (neither malformed chain superseded it)"

      - name: duplicate_neighbor_agreement_rejected
        claim_type: violation_to_error
        grounds: [errors.ERR_DUPLICATE_AGREEMENT, entities.NeighborAgreement]
        distinguishing_aspect: "Agreement uniqueness is on the unordered office pair: a second agreement between the same offices is 409 ERR_DUPLICATE_AGREEMENT even with the parties swapped and different hazards."
        test_recipe:
          setup: ["Offices A and B with one existing agreement (A as party A, B as party B)."]
          setup_api_calls:
            - call: "POST /alerts/offices"
              payload: { office_code: "KDPA", name: "Dup A", region: "WEST", area_method: "PLANAR" }
              as: PlatformAdmin
              captures: { dp_off_a: $.data.id }
            - call: "POST /alerts/offices"
              payload: { office_code: "KDPB", name: "Dup B", region: "WEST", area_method: "PLANAR" }
              as: PlatformAdmin
              captures: { dp_off_b: $.data.id }
            - call: "POST /alerts/neighbor-agreements"
              payload: { office_a_id: "${dp_off_a}", office_b_id: "${dp_off_b}", hazard_types: ["SEVERE_THUNDERSTORM"], coordination_timeout_minutes: 15 }
              as: PlatformAdmin
          trigger:
            - call: "POST /alerts/neighbor-agreements"
              payload: { office_a_id: "${dp_off_b}", office_b_id: "${dp_off_a}", hazard_types: ["HURRICANE"], coordination_timeout_minutes: 30 }
              as: PlatformAdmin
              captures: { dp_err: $.data.error_id }
          assert:
            - "the second agreement is 409 with error_id == ERR_DUPLICATE_AGREEMENT (party order is irrelevant)"
            - "GET /alerts/offices/${dp_off_a}/neighbor-agreements still returns exactly 1 row"

      - name: issuance_criteria_and_overlap_boundary_corners
        claim_type: violation_to_error
        grounds: [errors.ERR_ISSUANCE_CRITERIA_NOT_MET, calculations.zone_overlap_resolution]
        excluded_because:
          difficulty_instance: wind_58_issues_wind_57_rejected
          rationale: "The inclusive wind threshold (and in overlap_pct_0100_included_0090_excluded the inclusive 0.10 zone-inclusion ratio) are asserted at their exact boundaries in the named §1.8 instances."

      - name: product_window_overlap_corner
        claim_type: violation_to_error
        grounds: [errors.ERR_PRODUCT_OVERLAP_CONFLICT]
        excluded_because:
          difficulty_instance: watch_windows_half_open_adjacency_allowed_overlap_rejected
          rationale: "Half-open adjacency acceptance and straddling rejection are asserted in the named §1.8 instance."

      - name: evacuation_buffer_corner
        claim_type: violation_to_error
        grounds: [errors.ERR_EVACUATION_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: evacuation_reentry_buffer_gap_45_rejected_gap_60_allowed
          rationale: "The 60-minute buffer's 45-rejected/60-accepted boundary is asserted in the named §1.8 instance."

  # ===========================================================================
  - section: rbac
    instances:
      - name: product_create_with_undeclared_role_returns_unauthenticated
        claim_type: role_denial
        grounds: ["validations[priority=1]", errors.ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A role header value that is not a declared role (Anonymous) is an authentication failure: 401 ERR_UNAUTHENTICATED fires before any role-permission or schema check."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /alerts/products"
              payload: { product_level: "WATCH", hazard_type: "WINTER_STORM", issuing_office_id: "00000000-0000-4000-8000-000000000000", expires_at: "2026-09-02T00:00:00Z" }
              as: Anonymous
              captures: { au_err: $.data.error_id }
          assert:
            - "the response is 401 with error_id == ERR_UNAUTHENTICATED (undeclared role header)"
            - "error_id != ERR_FORBIDDEN_ROLE and != ERR_OFFICE_NOT_FOUND (auth runs first)"

      - name: emergency_manager_cannot_create_product
