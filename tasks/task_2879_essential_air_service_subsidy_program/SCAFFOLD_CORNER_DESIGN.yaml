          assert:
            - "Proposal.${pa_id}.projected_annual_passengers == floor(12 * 2 * 19 * 52 * 0.375) == 8892 with subsidy_per_passenger_usd == 179.94"
            - "Proposal.${pb_id}.projected_annual_passengers == floor(13 * 2 * 19 * 52 * 0.375) == 9633 with subsidy_per_passenger_usd == 176.48"
            - "The first ranking read returns candidate_count == 2, ranked_proposal_ids == [${pb_id}, ${pa_id}], excluded_proposal_ids == [], top_proposal_id == ${pb_id} and top_composite_score == 60.0000"
            - "In that first read ${pa_id} scores 59.3270 == round(0.40*0.0000 + 0.35*round(100*176.48/179.94, 4) + 0.25*100.0000, 4) with subsidy component 98.0771"
            - "Both proposals still have composite_score null after the ranking reads, and Solicitation.${sol_id}.status is still CLOSED with selected_proposal_id null — the preview persists nothing"
            - "The second ranking read returns candidate_count == 1, ranked_proposal_ids == [${pa_id}], excluded_proposal_ids == [${pb_id}], top_composite_score == 60.0000 because ${pa_id} is now its own best_spp and scores 0.35*100.0000 + 0.25*100.0000"
            - "The selection order returns 201 and persists Proposal.${pa_id}.composite_score == 59.3270 and Proposal.${pb_id}.composite_score == 60.0000"
            - "Proposal.${pb_id}.evaluation_state == SELECTED, Proposal.${pa_id}.evaluation_state == NOT_SELECTED and ServiceAgreement.${agr_id}.carrier_id == ${car2_id} with min_weekly_round_trips == 13 and min_monthly_seats == floor(13 * 2 * 19 * 52 / 12) == 2140"

      - name: superseding_preference_filing_replaces_the_ranking_input
        claim_type: bulk_action
        grounds:
          - endpoints.POST_/eas/solicitations/{id}/preferences
          - endpoints.GET_/eas/solicitations/{id}/preferences
          - calculations.carrier_selection_ranking
        distinguishing_aspect: "One filing writes a whole rankings array as a single atomic unit stamped with the new filing_sequence: the earlier rows stay stored and readable but contribute nothing, so a re-filing that reverses the order flips the winner while GET preferences still returns both generations."
        test_recipe:
          setup:
            - "Community HYS with a CLOSED solicitation holding the same two UNDER_EVALUATION proposals A (12 round trips, 1600000.00) and B (13 round trips, 1700000.00)."
