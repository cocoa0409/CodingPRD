scaffold_difficulty_design:

  # =================================================================
  # Rule 1 — Dual-variant calculations across DIFFERENT entity domains
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: refund_weather_prorata_vs_voluntary_tiered_diverge
        grounds:
          - calculations.weather_prorata_refund
          - calculations.voluntary_tiered_refund
          - entities.Refund.fields.refund_kind
          - entities.Ticket.fields.face_value
        distinguishing_aspect: |
          For the SAME GA 3-day ticket (face_value 240.00), the weather cascade
          variant (forward_looking on Festival.current_festival_day) yields 160.00
          with fee 0.00, while the voluntary patron variant (chronological days-before
          tiering) at 10 days out yields 180.00 with fee 60.00 — two different
          algorithms on two different entity domains (Festival cascade vs single Ticket).
        test_recipe:
          setup:
            - "Festival F (start 2026-08-01, end 2026-08-03, total_days 3), clock pinned 2026-07-22 (10 days before start)"
            - "Two identical GA 3-day tickets sold (face_value 240.00 each); ticket TW destined for weather refund, ticket TV destined for voluntary refund"
            - "Festival driven to SUSPENDED after day 1 opened (current_festival_day=1) for the weather branch"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-22T00:00:00Z" }
              as: FestivalDirector
            - call: "POST /festivals"
              payload: { name: "Voluntary F", start_date: "2026-08-01", end_date: "2026-08-03" }
              as: FestivalDirector
              captures: { fv_id: $.data.id }
            - call: "POST /festivals/${fv_id}/zones"
              payload: { code: "A", slot_capacity: 2 }
              as: FestivalDirector
            - call: "POST /festivals/${fv_id}/stages"
              payload: { name: "Main", changeover_minutes: 30 }
              as: FestivalDirector
            - call: "POST /festivals/${fv_id}/open-sales"
              payload: {}
              as: FestivalDirector
            - call: "POST /festivals/${fv_id}/tickets"
              payload: { ticket_type: "GA", day_count: 3, purchaser_email: "tv@x.com" }
              as: BoxOffice
              captures: { tv_id: $.data.id, tv_face: $.data.face_value }
          trigger:
            - call: "POST /tickets/${tv_id}/refund"
              payload: {}
              as: BoxOffice
              captures: { rv_id: $.data.id, rv_amt: $.data.amount, rv_fee: $.data.fee_withheld, rv_kind: $.data.refund_kind }
          assert:
            - "Refund.${rv_id}.refund_kind == VOLUNTARY_TIERED"
            - "Refund.${rv_id}.amount == 180.00"
            - "Refund.${rv_id}.fee_withheld == 60.00"
            - "Ticket.${tv_id}.face_value == 240.00"

      - name: booth_fee_tiered_vs_cashout_aggregation_diverge
        grounds:
          - calculations.booth_fee_calc
          - calculations.wristband_cashout
          - entities.VendorApplication.fields.booth_fee
          - entities.Wristband.fields.balance
        distinguishing_aspect: |
          booth_fee_calc (tiered_pricing over VendorApplication: tier rate * days *
          (1+zone surcharge) + power) produces 1740.00 for FOOD/zone-A/3-day/power,
          whereas wristband_cashout (aggregation over Wristband.balance: balance minus
          3% fee) produces 97.00 for a 100.00 wallet — distinct algorithms on distinct
          entity domains (vendor booth pricing vs patron wallet draw-down).
        test_recipe:
          setup:
            - "Festival F (3 days) ON_SALE; zone A slot_capacity 2; vendor V; application AP (FOOD, zone A, 3 days, power) approved -> booth_fee 1740.00"
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "Booth F", start_date: "2026-08-01", end_date: "2026-08-03" }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/zones"
              payload: { code: "A", slot_capacity: 2 }
              as: FestivalDirector
              captures: { z_id: $.data.id, z_v: $.data.version }
            - call: "POST /festivals/${f_id}/stages"
              payload: { name: "Main", changeover_minutes: 30 }
              as: FestivalDirector
            - call: "POST /vendors"
              payload: { company_name: "Tacos Co", contact_email: "v@x.com" }
              as: VendorManager
              captures: { v_id: $.data.id }
            - call: "POST /festivals/${f_id}/vendor-applications"
              payload: { vendor_id: "${v_id}", booth_zone_id: "${z_id}", booth_tier: "FOOD", day_count: 3, power_addon: true }
              as: VendorManager
              captures: { ap_id: $.data.id }
            - call: "POST /vendor-applications/${ap_id}/start-review"
              payload: {}
              as: VendorManager
          trigger:
            - call: "POST /vendor-applications/${ap_id}/approve"
              payload: { expected_zone_version: "${z_v}" }
              as: VendorManager
              captures: { ap_fee: $.data.booth_fee }
          assert:
            - "VendorApplication.${ap_id}.booth_fee == 1740.00"
            - "VendorApplication.${ap_id}.status == APPROVED"

  # =================================================================
  # Rule 2 — Combinatorial formulas across DIFFERENT modes
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: booth_fee_mode_a_nonlinear_three_inputs
        grounds:
          - calculations.booth_fee_calc
          - entities.VendorApplication.fields.booth_tier
          - entities.Zone.fields.code
          - entities.VendorApplication.fields.power_addon
        distinguishing_aspect: |
          MODE (a): booth_fee_calc has >=3 interacting inputs (booth_tier selects a
          base rate, Zone.code selects a multiplicative surcharge, day_count scales
          both, power_addon adds a conditional term). PREMIUM/zone-B/2-day/no-power =
          (300*2)*(1.10) = 660.00, a non-linear tier+surcharge interaction.
        test_recipe:
          setup:
            - "Festival F (3 days); zone B (10% surcharge); vendor V; application PREMIUM/2-day/no-power under review"
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "ModeA F", start_date: "2026-08-01", end_date: "2026-08-03" }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/zones"
              payload: { code: "B", slot_capacity: 1 }
              as: FestivalDirector
              captures: { z_id: $.data.id, z_v: $.data.version }
            - call: "POST /vendors"
              payload: { company_name: "Crafts Co", contact_email: "v2@x.com" }
              as: VendorManager
              captures: { v_id: $.data.id }
            - call: "POST /festivals/${f_id}/vendor-applications"
              payload: { vendor_id: "${v_id}", booth_zone_id: "${z_id}", booth_tier: "PREMIUM", day_count: 2, power_addon: false }
              as: VendorManager
              captures: { ap_id: $.data.id }
            - call: "POST /vendor-applications/${ap_id}/start-review"
              payload: {}
              as: VendorManager
          trigger:
            - call: "POST /vendor-applications/${ap_id}/approve"
              payload: { expected_zone_version: "${z_v}" }
              as: VendorManager
              captures: { fee: $.data.booth_fee }
          assert:
            - "VendorApplication.${ap_id}.booth_fee == 660.00"

      - name: settlement_mode_b_sum_then_round_not_per_line
        grounds:
          - calculations.vendor_settlement_payout
          - entities.WalletTxn.fields.amount
          - entities.Vendor.fields.payout_total
        distinguishing_aspect: |
          MODE (b): vendor_settlement_payout pins sum-then-round. Three SPEND txns of
          0.31 each: sum 0.93, commission round2(0.93*0.08)=0.07, net 0.86. Per-line
          rounding (round2(0.31*0.08)=0.02 x3 = 0.06) would diverge — the scaffold pins
          sum-then-round, so the payout is 0.86, NOT 0.87.
        test_recipe:
          setup:
            - "Festival F CLOSED at final day; zone A; vendor V with CONFIRMED application AP (fee paid in full, booth_fee 180.00 paid 180.00); wristband W ACTIVE with 3 SPEND txns of 0.31 credited to AP's booth"
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "Settle F", start_date: "2026-08-01", end_date: "2026-08-01", max_reentries: 1 }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/zones"
              payload: { code: "C", slot_capacity: 1 }
              as: FestivalDirector
              captures: { z_id: $.data.id, z_v: $.data.version }
            - call: "POST /festivals/${f_id}/stages"
              payload: { name: "Main", changeover_minutes: 30 }
              as: FestivalDirector
            - call: "POST /vendors"
              payload: { company_name: "Drinks Co", contact_email: "v3@x.com" }
              as: VendorManager
              captures: { v_id: $.data.id }
            - call: "POST /festivals/${f_id}/vendor-applications"
              payload: { vendor_id: "${v_id}", booth_zone_id: "${z_id}", booth_tier: "STANDARD", day_count: 1, power_addon: false }
              as: VendorManager
              captures: { ap_id: $.data.id }
            - call: "POST /vendor-applications/${ap_id}/start-review"
              payload: {}
              as: VendorManager
            - call: "POST /vendor-applications/${ap_id}/approve"
              payload: { expected_zone_version: "${z_v}" }
              as: VendorManager
              captures: { ap_fee: $.data.booth_fee }
            - call: "POST /vendor-applications/${ap_id}/pay-fee"
              payload: { amount: 180.00 }
              as: Vendor
              as_user_id: "${v_id}"
            - call: "POST /vendor-applications/${ap_id}/confirm"
              payload: {}
              as: Vendor
              as_user_id: "${v_id}"
            - call: "POST /festivals/${f_id}/open-sales"
              payload: {}
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/tickets"
              payload: { ticket_type: "GA", day_count: 1, purchaser_email: "p@x.com" }
              as: BoxOffice
              captures: { t_id: $.data.id }
            - call: "POST /festivals/${f_id}/wristbands"
              payload: { rfid_uid: "RF-SETTLE-1" }
              as: BoxOffice
              captures: { w_id: $.data.id }
            - call: "POST /wristbands/${w_id}/activate"
              payload: { ticket_id: "${t_id}" }
              as: BoxOffice
            - call: "POST /wristbands/${w_id}/topup"
              payload: { amount: 1.00 }
              as: BoxOffice
            - call: "POST /festivals/${f_id}/go-live"
              payload: {}
              as: FestivalDirector
            - call: "POST /wristbands/${w_id}/spend"
              payload: { amount: 0.31, booth_zone_id: "${z_id}" }
              as: BoxOffice
            - call: "POST /wristbands/${w_id}/spend"
              payload: { amount: 0.31, booth_zone_id: "${z_id}" }
              as: BoxOffice
            - call: "POST /wristbands/${w_id}/spend"
              payload: { amount: 0.31, booth_zone_id: "${z_id}" }
              as: BoxOffice
            - call: "POST /festivals/${f_id}/close"
              payload: {}
              as: FestivalDirector
          trigger:
            - call: "POST /vendor-applications/${ap_id}/settle"
              payload: {}
              as: FestivalDirector
          assert:
            - "Vendor.${v_id}.payout_total == 0.86"

  # =================================================================
  # Rule 3 — Non-linear state-machine shape on DIFFERENT entities
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: festival_cycle_live_suspended_resume
        grounds:
          - state_machines.Festival.LIVE_to_SUSPENDED
          - state_machines.Festival.SUSPENDED_to_LIVE
          - entities.Festival.fields.operational_posture
        distinguishing_aspect: |
          CYCLE on Festival: LIVE -> SUSPENDED (weather-hold) -> LIVE (resume) is a
          back-edge loop on operational_posture; after weather-hold then resume the
          posture returns to LIVE and gate ENTER is permitted again.
        test_recipe:
          setup:
            - "Festival F LIVE (current_festival_day 1)"
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "Cycle F", start_date: "2026-08-01", end_date: "2026-08-02" }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/zones"
              payload: { code: "A", slot_capacity: 1 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/stages"
              payload: { name: "Main", changeover_minutes: 30 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/open-sales"
              payload: {}
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/go-live"
              payload: {}
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/weather-hold"
              payload: {}
              as: FestivalDirector
          trigger:
            - call: "POST /festivals/${f_id}/resume"
              payload: {}
              as: FestivalDirector
              captures: { posture: $.data.operational_posture }
          assert:
            - "Festival.${f_id}.operational_posture == LIVE"

      - name: wristband_parallel_lifecycle_x_presence
        grounds:
          - state_machines.Wristband.ACTIVE_to_FROZEN
          - state_machines.Wristband.OUTSIDE_to_INSIDE
          - entities.Wristband.fields.lifecycle_status
          - entities.Wristband.fields.presence_status
        distinguishing_aspect: |
          PARALLEL DIMENSIONS on Wristband: lifecycle_status (ACTIVE->FROZEN) and
          presence_status (OUTSIDE->INSIDE) evolve on the SAME row independently —
          a wristband can be INSIDE (entered the gate) while its wallet is FROZEN;
          freezing does not change presence_status and entering does not change
          lifecycle_status.
        test_recipe:
          setup:
            - "Festival F LIVE; wristband W ACTIVE, OUTSIDE; W has entered the gate once (INSIDE) and then been frozen"
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "Parallel F", start_date: "2026-08-01", end_date: "2026-08-02", max_reentries: 1 }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/zones"
              payload: { code: "A", slot_capacity: 1 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/stages"
              payload: { name: "Main", changeover_minutes: 30 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/open-sales"
              payload: {}
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/tickets"
              payload: { ticket_type: "GA", day_count: 2, purchaser_email: "p2@x.com" }
              as: BoxOffice
              captures: { t_id: $.data.id }
            - call: "POST /festivals/${f_id}/wristbands"
              payload: { rfid_uid: "RF-PAR-1" }
              as: BoxOffice
              captures: { w_id: $.data.id }
            - call: "POST /wristbands/${w_id}/activate"
              payload: { ticket_id: "${t_id}" }
              as: BoxOffice
            - call: "POST /festivals/${f_id}/go-live"
              payload: {}
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/gate-scan"
              payload: { wristband_id: "${w_id}", direction: "ENTER" }
              as: GateAttendant
          trigger:
            - call: "POST /wristbands/${w_id}/freeze"
              payload: {}
              as: FestivalDirector
              captures: { life: $.data.lifecycle_status, pres: $.data.presence_status }
          assert:
            - "Wristband.${w_id}.lifecycle_status == FROZEN"
            - "Wristband.${w_id}.presence_status == INSIDE"

  # =================================================================
  # Rule 4 — Transitive cascade chains from DIFFERENT triggers
  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_cascade_ticket_to_wristband_to_liability_depth3
        grounds:
          - state_machines.Festival.SUSPENDED_to_CANCELLED
          - state_machines.Wristband.ACTIVE_to_FROZEN
          - calculations.weather_prorata_refund
          - entities.Festival.fields.total_wallet_liability
          - entities.Festival.fields.total_refund_liability
        distinguishing_aspect: |
          DEPTH-3 chain from SUSPENDED->CANCELLED: (A) festival cancel mutates each
          Ticket to REFUNDED issuing a weather refund; (B) that ticket-refund itself
          freezes the ticket's linked ACTIVE Wristband (lifecycle->FROZEN); (C) freezing
          the wristband itself recomputes Festival.total_wallet_liability, dropping the
          now-FROZEN balance from the ACTIVE sum. Each hop is caused by the previous.
        test_recipe:
          setup:
            - "Festival F SUSPENDED after day 1 (current_festival_day 1, total_days 3); one GA 3-day ticket ACTIVATED, linked to wristband W ACTIVE with balance 50.00 (so total_wallet_liability == 50.00 pre-cancel)"
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "Cascade F", start_date: "2026-08-01", end_date: "2026-08-03", max_reentries: 1 }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/zones"
              payload: { code: "A", slot_capacity: 1 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/stages"
              payload: { name: "Main", changeover_minutes: 30 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/open-sales"
              payload: {}
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/tickets"
              payload: { ticket_type: "GA", day_count: 3, purchaser_email: "c@x.com" }
              as: BoxOffice
              captures: { t_id: $.data.id }
            - call: "POST /festivals/${f_id}/wristbands"
              payload: { rfid_uid: "RF-CAS-1" }
              as: BoxOffice
              captures: { w_id: $.data.id }
            - call: "POST /wristbands/${w_id}/activate"
              payload: { ticket_id: "${t_id}" }
              as: BoxOffice
            - call: "POST /wristbands/${w_id}/topup"
              payload: { amount: 50.00 }
              as: BoxOffice
            - call: "POST /festivals/${f_id}/go-live"
              payload: {}
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/weather-hold"
              payload: {}
              as: FestivalDirector
          trigger:
            - call: "POST /festivals/${f_id}/cancel"
              payload: {}
              as: FestivalDirector
              captures: { posture: $.data.operational_posture, wallet_liab: $.data.total_wallet_liability, refund_liab: $.data.total_refund_liability }
          assert:
            - "Festival.${f_id}.operational_posture == CANCELLED"
            - "Ticket.${t_id}.status == REFUNDED"
            - "Wristband.${w_id}.lifecycle_status == FROZEN"
            - "Festival.${f_id}.total_wallet_liability == 0.00"
            - "Festival.${f_id}.total_refund_liability == 160.00"

      - name: return_for_revision_releases_slot_depth2
        grounds:
          - state_machines.VendorApplication.APPROVED_to_UNDER_REVIEW
          - entities.Zone.fields.allocated_count
          - entities.Zone.fields.version
        distinguishing_aspect: |
          DEPTH-2 compensation chain from APPROVED->UNDER_REVIEW (return-for-revision):
          (A) the application returns to UNDER_REVIEW which (B) decrements the booth
          Zone.allocated_count by 1 and bumps Zone.version — restoring the slot to the
          pool. Originates from a DIFFERENT trigger than the cancel cascade.
        test_recipe:
          setup:
            - "Festival F; zone Z slot_capacity 1; application AP APPROVED (allocated_count became 1, Zone.version bumped to 2)"
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "Revision F", start_date: "2026-08-01", end_date: "2026-08-02" }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/zones"
              payload: { code: "A", slot_capacity: 1 }
              as: FestivalDirector
              captures: { z_id: $.data.id, z_v: $.data.version }
            - call: "POST /vendors"
              payload: { company_name: "Art Co", contact_email: "v4@x.com" }
              as: VendorManager
              captures: { v_id: $.data.id }
            - call: "POST /festivals/${f_id}/vendor-applications"
              payload: { vendor_id: "${v_id}", booth_zone_id: "${z_id}", booth_tier: "STANDARD", day_count: 2, power_addon: false }
              as: VendorManager
              captures: { ap_id: $.data.id }
            - call: "POST /vendor-applications/${ap_id}/start-review"
              payload: {}
              as: VendorManager
            - call: "POST /vendor-applications/${ap_id}/approve"
              payload: { expected_zone_version: "${z_v}" }
              as: VendorManager
          trigger:
            - call: "POST /vendor-applications/${ap_id}/return-for-revision"
              payload: {}
              as: VendorManager
              captures: { st: $.data.status, fee: $.data.booth_fee }
          assert:
            - "VendorApplication.${ap_id}.status == UNDER_REVIEW"
            - "VendorApplication.${ap_id}.booth_fee == null"
            - "Zone.${z_id}.allocated_count == 0"

  # =================================================================
  # Rule 5 — Validation priority conflicts across DIFFERENT category pairs
  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: suspended_state_beats_already_inside_safety
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_FESTIVAL_SUSPENDED]
          - errors[ERR_ALREADY_INSIDE]
        distinguishing_aspect: |
          CATEGORY PAIR state(p8 ERR_FESTIVAL_SUSPENDED) vs business_safety(p10
          ERR_ALREADY_INSIDE): a wristband that is already INSIDE while the festival is
          SUSPENDED, scanned ENTER, fails BOTH; the lower-priority p8 posture check wins,
          returning ERR_FESTIVAL_SUSPENDED (409), NOT ERR_ALREADY_INSIDE.
        test_recipe:
          setup:
            - "Festival F LIVE; wristband W ACTIVE and currently INSIDE; then festival weather-held to SUSPENDED"
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "Conflict F", start_date: "2026-08-01", end_date: "2026-08-02", max_reentries: 2 }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/zones"
              payload: { code: "A", slot_capacity: 1 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/stages"
              payload: { name: "Main", changeover_minutes: 30 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/open-sales"
              payload: {}
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/tickets"
              payload: { ticket_type: "GA", day_count: 2, purchaser_email: "q@x.com" }
              as: BoxOffice
              captures: { t_id: $.data.id }
            - call: "POST /festivals/${f_id}/wristbands"
              payload: { rfid_uid: "RF-CFL-1" }
              as: BoxOffice
              captures: { w_id: $.data.id }
            - call: "POST /wristbands/${w_id}/activate"
              payload: { ticket_id: "${t_id}" }
              as: BoxOffice
            - call: "POST /festivals/${f_id}/go-live"
              payload: {}
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/gate-scan"
              payload: { wristband_id: "${w_id}", direction: "ENTER" }
              as: GateAttendant
            - call: "POST /festivals/${f_id}/weather-hold"
              payload: {}
              as: FestivalDirector
          trigger:
            - call: "POST /festivals/${f_id}/gate-scan"
              payload: { wristband_id: "${w_id}", direction: "ENTER" }
              as: GateAttendant
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_FESTIVAL_SUSPENDED"
            - "response.http_status == 409"

      - name: zone_full_constraint_beats_stale_zone_occ
        grounds:
          - validations[priority=9]
          - validations[priority=16]
          - errors[ERR_ZONE_FULL]
          - errors[ERR_STALE_ZONE_VERSION]
        distinguishing_aspect: |
          CATEGORY PAIR business_constraint(p9 OCC ERR_STALE_ZONE_VERSION) vs
          business_constraint(p16 ERR_ZONE_FULL) — distinct from the state/safety pair
          above. When approving against a zone that is BOTH full (allocated_count ==
          slot_capacity) AND whose version the caller observed stale, the lower-priority
          p9 OCC check is evaluated first and ERR_STALE_ZONE_VERSION (412) wins over the
          p16 ERR_ZONE_FULL (409).
        test_recipe:
          setup:
            - "Festival F; zone Z slot_capacity 1; application AP1 APPROVED (fills the zone, bumps Zone.version to 2); application AP2 UNDER_REVIEW; caller holds the pre-AP1 Zone.version (1)"
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "ZoneFull F", start_date: "2026-08-01", end_date: "2026-08-02" }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/zones"
              payload: { code: "A", slot_capacity: 1 }
              as: FestivalDirector
              captures: { z_id: $.data.id, z_v0: $.data.version }
            - call: "POST /vendors"
              payload: { company_name: "V1 Co", contact_email: "vz1@x.com" }
              as: VendorManager
              captures: { v1_id: $.data.id }
            - call: "POST /vendors"
              payload: { company_name: "V2 Co", contact_email: "vz2@x.com" }
              as: VendorManager
              captures: { v2_id: $.data.id }
            - call: "POST /festivals/${f_id}/vendor-applications"
              payload: { vendor_id: "${v1_id}", booth_zone_id: "${z_id}", booth_tier: "STANDARD", day_count: 2, power_addon: false }
              as: VendorManager
              captures: { ap1_id: $.data.id }
            - call: "POST /festivals/${f_id}/vendor-applications"
              payload: { vendor_id: "${v2_id}", booth_zone_id: "${z_id}", booth_tier: "STANDARD", day_count: 2, power_addon: false }
              as: VendorManager
              captures: { ap2_id: $.data.id }
            - call: "POST /vendor-applications/${ap1_id}/start-review"
              payload: {}
              as: VendorManager
            - call: "POST /vendor-applications/${ap2_id}/start-review"
              payload: {}
              as: VendorManager
            - call: "POST /vendor-applications/${ap1_id}/approve"
              payload: { expected_zone_version: "${z_v0}" }
              as: VendorManager
          trigger:
            - call: "POST /vendor-applications/${ap2_id}/approve"
              payload: { expected_zone_version: "${z_v0}" }
              as: VendorManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_ZONE_VERSION"
            - "response.http_status == 412"

  # =================================================================
  # Rule 6 — Boundary-precision checks on DIFFERENT metrics/endpoints
  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: reentry_cap_exact_boundary_third_enter
        grounds:
          - validations[priority=11]
          - entities.Wristband.fields.reentry_used
          - entities.Festival.fields.max_reentries
          - errors[ERR_REENTRY_LIMIT]
        distinguishing_aspect: |
          COUNT-METRIC boundary on POST /festivals/{id}/gate-scan: with max_reentries=1,
          the wristband may ENTER (count 0->1), EXIT, re-ENTER (reentry_used 0->1), EXIT;
          the NEXT ENTER (would make reentry_used 2 > max 1) is rejected with
          ERR_REENTRY_LIMIT. The boundary is reentry_used >= max_reentries.
        test_recipe:
          setup:
            - "Festival F LIVE, max_reentries 1; wristband W ACTIVE; W has done ENTER, EXIT, ENTER (reentry_used now 1), EXIT — currently OUTSIDE"
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "Reentry F", start_date: "2026-08-01", end_date: "2026-08-02", max_reentries: 1 }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/zones"
              payload: { code: "A", slot_capacity: 1 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/stages"
              payload: { name: "Main", changeover_minutes: 30 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/open-sales"
              payload: {}
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/tickets"
              payload: { ticket_type: "GA", day_count: 2, purchaser_email: "r@x.com" }
              as: BoxOffice
              captures: { t_id: $.data.id }
            - call: "POST /festivals/${f_id}/wristbands"
              payload: { rfid_uid: "RF-RE-1" }
              as: BoxOffice
              captures: { w_id: $.data.id }
            - call: "POST /wristbands/${w_id}/activate"
              payload: { ticket_id: "${t_id}" }
              as: BoxOffice
            - call: "POST /festivals/${f_id}/go-live"
              payload: {}
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/gate-scan"
              payload: { wristband_id: "${w_id}", direction: "ENTER" }
              as: GateAttendant
            - call: "POST /festivals/${f_id}/gate-scan"
              payload: { wristband_id: "${w_id}", direction: "EXIT" }
              as: GateAttendant
            - call: "POST /festivals/${f_id}/gate-scan"
              payload: { wristband_id: "${w_id}", direction: "ENTER" }
              as: GateAttendant
            - call: "POST /festivals/${f_id}/gate-scan"
              payload: { wristband_id: "${w_id}", direction: "EXIT" }
              as: GateAttendant
          trigger:
            - call: "POST /festivals/${f_id}/gate-scan"
              payload: { wristband_id: "${w_id}", direction: "ENTER" }
              as: GateAttendant
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_REENTRY_LIMIT"
            - "response.http_status == 409"

      - name: parking_capacity_full_zero_remaining_boundary
        grounds:
          - validations[priority=17]
          - entities.ParkingLot.fields.capacity
          - entities.ParkingLot.fields.sold_count
          - errors[ERR_CAPACITY_FULL]
        distinguishing_aspect: |
          EMPTY-POOL boundary on POST /tickets/{id}/add-ons (different metric and
          endpoint than the re-entry count): a ParkingLot of capacity 1 with sold_count
          already 1 (zero remaining) rejects the next PARKING sell with ERR_CAPACITY_FULL;
          the boundary is sold_count >= capacity (no free pass).
        test_recipe:
          setup:
            - "Festival F ON_SALE; parking lot L capacity 1; two tickets T1, T2; T1 already bought the only parking pass (sold_count == 1)"
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "ParkFull F", start_date: "2026-08-01", end_date: "2026-08-02" }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/zones"
              payload: { code: "A", slot_capacity: 1 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/parking-lots"
              payload: { name: "Lot A", capacity: 1, price_per_pass: 25.00 }
              as: FestivalDirector
              captures: { l_id: $.data.id, l_v0: $.data.version }
            - call: "POST /festivals/${f_id}/open-sales"
              payload: {}
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/tickets"
              payload: { ticket_type: "GA", day_count: 2, purchaser_email: "t1@x.com" }
              as: BoxOffice
              captures: { t1_id: $.data.id }
            - call: "POST /festivals/${f_id}/tickets"
              payload: { ticket_type: "GA", day_count: 2, purchaser_email: "t2@x.com" }
              as: BoxOffice
              captures: { t2_id: $.data.id }
            - call: "POST /tickets/${t1_id}/add-ons"
              payload: { kind: "PARKING", parking_lot_id: "${l_id}", expected_lot_version: "${l_v0}" }
              as: BoxOffice
              captures: { l_v1: $.data.version }
            - call: "GET /parking-lots/${l_id}"
              payload: {}
              as: BoxOffice
              captures: { l_v_now: $.data.version }
          trigger:
            - call: "POST /tickets/${t2_id}/add-ons"
              payload: { kind: "PARKING", parking_lot_id: "${l_id}", expected_lot_version: "${l_v_now}" }
              as: BoxOffice
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CAPACITY_FULL"
            - "response.http_status == 409"

  # =================================================================
  # Rule 7 — Cross-entity state dependencies across DIFFERENT entity pairs
  # =================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: approve_application_depends_on_zone_capacity
        grounds:
          - state_machines.VendorApplication.UNDER_REVIEW_to_APPROVED
          - entities.Zone.fields.allocated_count
          - entities.Zone.fields.slot_capacity
          - errors[ERR_ZONE_FULL]
        distinguishing_aspect: |
          PAIR VendorApplication->Zone: AP's UNDER_REVIEW->APPROVED transition is valid
          only when its booth Zone has a free slot (allocated_count < slot_capacity).
          With a full zone the transition is rejected (ERR_ZONE_FULL) even though AP
          itself is in the correct from-state.
        test_recipe:
          setup:
            - "Festival F; zone Z slot_capacity 1; AP1 APPROVED filling the zone; AP2 UNDER_REVIEW; caller holds fresh Zone.version (post AP1 approval)"
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "CrossZone F", start_date: "2026-08-01", end_date: "2026-08-02" }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/zones"
              payload: { code: "A", slot_capacity: 1 }
              as: FestivalDirector
              captures: { z_id: $.data.id, z_v0: $.data.version }
            - call: "POST /vendors"
              payload: { company_name: "CV1", contact_email: "cv1@x.com" }
              as: VendorManager
              captures: { v1_id: $.data.id }
            - call: "POST /vendors"
              payload: { company_name: "CV2", contact_email: "cv2@x.com" }
              as: VendorManager
              captures: { v2_id: $.data.id }
            - call: "POST /festivals/${f_id}/vendor-applications"
              payload: { vendor_id: "${v1_id}", booth_zone_id: "${z_id}", booth_tier: "STANDARD", day_count: 2, power_addon: false }
              as: VendorManager
              captures: { ap1_id: $.data.id }
            - call: "POST /festivals/${f_id}/vendor-applications"
              payload: { vendor_id: "${v2_id}", booth_zone_id: "${z_id}", booth_tier: "STANDARD", day_count: 2, power_addon: false }
              as: VendorManager
              captures: { ap2_id: $.data.id }
            - call: "POST /vendor-applications/${ap1_id}/start-review"
              payload: {}
              as: VendorManager
            - call: "POST /vendor-applications/${ap2_id}/start-review"
              payload: {}
              as: VendorManager
            - call: "POST /vendor-applications/${ap1_id}/approve"
              payload: { expected_zone_version: "${z_v0}" }
              as: VendorManager
            - call: "GET /zones/${z_id}"
              payload: {}
              as: VendorManager
              captures: { z_v1: $.data.version }
          trigger:
            - call: "POST /vendor-applications/${ap2_id}/approve"
              payload: { expected_zone_version: "${z_v1}" }
              as: VendorManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ZONE_FULL"
            - "response.http_status == 409"

      - name: activate_wristband_depends_on_ticket_sold_state
        grounds:
          - state_machines.Wristband.ISSUED_to_ACTIVE
          - entities.Ticket.fields.status
          - entities.Ticket.fields.wristband_id
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          PAIR Wristband->Ticket (different from the AP->Zone pair): a wristband's
          ISSUED->ACTIVE activation requires the supplied Ticket to be in status SOLD
          with wristband_id null. Supplying a ticket already ACTIVATED (linked to another
          wristband) rejects the activation with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Festival F ON_SALE; ticket T sold then activated onto wristband W1 (now ACTIVATED); second wristband W2 ISSUED"
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "ActDep F", start_date: "2026-08-01", end_date: "2026-08-02" }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/zones"
              payload: { code: "A", slot_capacity: 1 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/open-sales"
              payload: {}
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/tickets"
              payload: { ticket_type: "GA", day_count: 2, purchaser_email: "act@x.com" }
              as: BoxOffice
              captures: { t_id: $.data.id }
            - call: "POST /festivals/${f_id}/wristbands"
              payload: { rfid_uid: "RF-ACT-1" }
              as: BoxOffice
              captures: { w1_id: $.data.id }
            - call: "POST /festivals/${f_id}/wristbands"
              payload: { rfid_uid: "RF-ACT-2" }
              as: BoxOffice
              captures: { w2_id: $.data.id }
            - call: "POST /wristbands/${w1_id}/activate"
              payload: { ticket_id: "${t_id}" }
              as: BoxOffice
          trigger:
            - call: "POST /wristbands/${w2_id}/activate"
              payload: { ticket_id: "${t_id}" }
              as: BoxOffice
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

  # =================================================================
  # Rule 8 — Resource temporal-overlap conflicts across DIFFERENT interval semantics
  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: stage_buffered_overlap_within_changeover
        grounds:
          - validations[priority=12]
          - entities.Stage.fields.changeover_minutes
          - entities.Performance.fields.starts_at
          - errors[ERR_STAGE_CONFLICT]
        distinguishing_aspect: |
          SEMANTICS A (Stage resource, half-open + buffer): on stage S with
          changeover_minutes 30, an existing performance 18:00-19:00 blocks a new one
          starting 19:15 because 19:15 < 19:00 + 30min buffer; rejected ERR_STAGE_CONFLICT.
          A 19:30 start (exactly at buffer end) would be allowed.
        test_recipe:
          setup:
            - "Festival F; stage S changeover_minutes 30; existing SCHEDULED performance 'Nova' 18:00-19:00 on S"
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "StageOv F", start_date: "2026-08-01", end_date: "2026-08-02" }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/zones"
              payload: { code: "A", slot_capacity: 1 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/stages"
              payload: { name: "Main", changeover_minutes: 30 }
              as: FestivalDirector
              captures: { s_id: $.data.id }
            - call: "POST /stages/${s_id}/performances"
              payload: { artist_name: "Nova", starts_at: "2026-08-01T18:00:00Z", ends_at: "2026-08-01T19:00:00Z" }
              as: FestivalDirector
          trigger:
            - call: "POST /stages/${s_id}/performances"
              payload: { artist_name: "Pulse", starts_at: "2026-08-01T19:15:00Z", ends_at: "2026-08-01T20:00:00Z" }
              as: FestivalDirector
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STAGE_CONFLICT"
            - "response.http_status == 409"

      - name: artist_unbuffered_overlap_across_stages
        grounds:
          - validations[priority=13]
          - entities.Performance.fields.artist_name
          - entities.Performance.fields.starts_at
          - errors[ERR_ARTIST_DOUBLE_BOOKED]
        distinguishing_aspect: |
          SEMANTICS B (Artist logical resource, half-open, NO buffer, festival-wide):
          artist 'Nova' booked 18:00-19:00 on stage S1 conflicts with a 18:30-19:30
          booking on a DIFFERENT stage S2 (overlap, no buffer) -> ERR_ARTIST_DOUBLE_BOOKED.
          Unlike Stage semantics, a 19:00-20:00 booking on S2 (exact adjacency, no buffer)
          would be allowed — different interval geometry than the buffered stage rule.
        test_recipe:
          setup:
            - "Festival F; stages S1 and S2; SCHEDULED performance 'Nova' 18:00-19:00 on S1"
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "ArtistOv F", start_date: "2026-08-01", end_date: "2026-08-02" }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/zones"
              payload: { code: "A", slot_capacity: 1 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/stages"
              payload: { name: "S1", changeover_minutes: 30 }
              as: FestivalDirector
              captures: { s1_id: $.data.id }
            - call: "POST /festivals/${f_id}/stages"
              payload: { name: "S2", changeover_minutes: 30 }
              as: FestivalDirector
              captures: { s2_id: $.data.id }
            - call: "POST /stages/${s1_id}/performances"
              payload: { artist_name: "Nova", starts_at: "2026-08-01T18:00:00Z", ends_at: "2026-08-01T19:00:00Z" }
              as: FestivalDirector
          trigger:
            - call: "POST /stages/${s2_id}/performances"
              payload: { artist_name: "Nova", starts_at: "2026-08-01T18:30:00Z", ends_at: "2026-08-01T19:30:00Z" }
              as: FestivalDirector
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ARTIST_DOUBLE_BOOKED"
            - "response.http_status == 409"

  # =================================================================
  # Rule 9 — Compensating-action invariants across DIFFERENT conserved quantities
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: wallet_liability_conserved_topup_then_cashout
        grounds:
          - state_machines.Wristband.ACTIVE_to_CLOSED
          - calculations.wristband_cashout
          - entities.Festival.fields.total_wallet_liability
          - entities.Wristband.fields.balance
        distinguishing_aspect: |
          CONSERVED QUANTITY 1 (wallet liability): the invariant
          Festival.total_wallet_liability == SUM(Wristband.balance WHERE
          lifecycle_status==ACTIVE) holds before and after a top-up + cash-out pair.
          Top-up 100.00 sets liability 100.00; cash-out (forward action) zeroes the
          balance and decrements liability by the pre-cashout balance 100.00, leaving
          total_wallet_liability == 0.00 with no drift.
        test_recipe:
          setup:
            - "Festival F LIVE; wristband W ACTIVE with balance 100.00 (topup); total_wallet_liability == 100.00; W has exited (OUTSIDE) so it may cash out"
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "WalletInv F", start_date: "2026-08-01", end_date: "2026-08-02", wristband_cashout_pct: 0.03 }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/zones"
              payload: { code: "A", slot_capacity: 1 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/stages"
              payload: { name: "Main", changeover_minutes: 30 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/open-sales"
              payload: {}
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/tickets"
              payload: { ticket_type: "GA", day_count: 2, purchaser_email: "wi@x.com" }
              as: BoxOffice
              captures: { t_id: $.data.id }
            - call: "POST /festivals/${f_id}/wristbands"
              payload: { rfid_uid: "RF-WI-1" }
              as: BoxOffice
              captures: { w_id: $.data.id }
            - call: "POST /wristbands/${w_id}/activate"
              payload: { ticket_id: "${t_id}" }
              as: BoxOffice
            - call: "POST /wristbands/${w_id}/topup"
              payload: { amount: 100.00 }
              as: BoxOffice
            - call: "POST /festivals/${f_id}/go-live"
              payload: {}
              as: FestivalDirector
          trigger:
            - call: "POST /wristbands/${w_id}/cashout"
              payload: {}
              as: BoxOffice
              captures: { bal: $.data.balance, life: $.data.lifecycle_status }
            - call: "GET /festivals/${f_id}"
              payload: {}
              as: FestivalDirector
              captures: { liab: $.data.total_wallet_liability }
          assert:
            - "Wristband.${w_id}.balance == 0"
            - "Wristband.${w_id}.lifecycle_status == CLOSED"
            - "Festival.${f_id}.total_wallet_liability == 0.00"

      - name: zone_slot_conserved_approve_then_withdraw
        grounds:
          - state_machines.VendorApplication.UNDER_REVIEW_to_APPROVED
          - state_machines.VendorApplication.APPROVED_to_WITHDRAWN
          - entities.Zone.fields.allocated_count
        distinguishing_aspect: |
          CONSERVED QUANTITY 2 (zone booth slots, distinct from wallet money): the
          invariant Zone.allocated_count == COUNT(VendorApplication WHERE booth_zone_id==Z
          AND status IN {APPROVED, CONFIRMED}) holds across an approve + withdraw pair.
          Approve raises allocated_count 0->1; withdraw (compensation) returns it 1->0,
          leaving allocated_count == 0 with no slot leakage.
        test_recipe:
          setup:
            - "Festival F; zone Z slot_capacity 1; application AP APPROVED (allocated_count == 1, fee_paid 0)"
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "SlotInv F", start_date: "2026-08-01", end_date: "2026-08-02" }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/zones"
              payload: { code: "A", slot_capacity: 1 }
              as: FestivalDirector
              captures: { z_id: $.data.id, z_v0: $.data.version }
            - call: "POST /vendors"
              payload: { company_name: "SInv Co", contact_email: "si@x.com" }
              as: VendorManager
              captures: { v_id: $.data.id }
            - call: "POST /festivals/${f_id}/vendor-applications"
              payload: { vendor_id: "${v_id}", booth_zone_id: "${z_id}", booth_tier: "STANDARD", day_count: 2, power_addon: false }
              as: VendorManager
              captures: { ap_id: $.data.id }
            - call: "POST /vendor-applications/${ap_id}/start-review"
              payload: {}
              as: VendorManager
            - call: "POST /vendor-applications/${ap_id}/approve"
              payload: { expected_zone_version: "${z_v0}" }
              as: VendorManager
          trigger:
            - call: "POST /vendor-applications/${ap_id}/withdraw"
              payload: {}
              as: Vendor
              as_user_id: "${v_id}"
              captures: { st: $.data.status }
            - call: "GET /zones/${z_id}"
              payload: {}
              as: VendorManager
              captures: { alloc: $.data.allocated_count }
          assert:
            - "VendorApplication.${ap_id}.status == WITHDRAWN"
            - "Zone.${z_id}.allocated_count == 0"
