            - "POST /artwork-assets/aa_absent/versions returns 404 with data.error_id == ERR_ARTWORK_ASSET_NOT_FOUND, not 412 ERR_STALE_ASSET_VERSION"
            - "POST /artwork-assets/${asset_id}/versions with claim_ids [mc_absent] returns 404 with data.error_id == ERR_MARKETING_CLAIM_NOT_FOUND and creates no ArtworkVersion"
            - "POST /printer-proofs with artwork_version_id av_absent returns 404 with data.error_id == ERR_ARTWORK_VERSION_NOT_FOUND, not 409 ERR_VERSION_STATE_INVALID"
            - "ArtworkAsset.${asset_id}.version_counter == 0 and version == 1 after all four refusals"

      - name: cross_aggregate_references_must_match_the_owning_parents_scope
        claim_type: parent_relationships
        grounds:
          - errors[ERR_MARKET_CODE_NOT_IN_BRIEF]
          - errors[ERR_LANGUAGE_CODE_NOT_IN_BRIEF]
          - errors[ERR_SUPERSEDES_VERSION_MISMATCH]
          - errors[ERR_CLAIM_MARKET_MISMATCH]
          - entities.ArtworkAsset.fields.language_codes
          - entities.ArtworkVersion.fields.supersedes_version_id
          - validations[priority=42]
          - validations[priority=43]
          - validations[priority=45]
          - validations[priority=44]
        distinguishing_aspect: |
          Existence is not enough in a graph topology: every referenced row must also
          sit inside the referrer's scope. Four scope rules are probed with rows that
          all exist - a market outside the brief's market_codes, a language outside the
          brief's language_codes, a self-referential supersedes pointer into a
          DIFFERENT asset, and a claim cleared for the wrong market. Each has its own
