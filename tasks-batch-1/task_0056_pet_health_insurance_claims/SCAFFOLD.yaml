scenario: "Pet Health Insurance Claims: annual Deductible, reimbursement rate, annual cap, waiting period, pre-existing condition exclusion, multi-pet discount, invoice upload OCR review, Wellness rider"
domain_name: pet-health-insurance-claims
api_prefix: ""

complexity_profile:
  primary_archetype: Ledger reconciliation
  secondary_archetype: Pricing engine
  complexity_layers:
    - Dual-variant calculation
    - Rate / threshold triggers
    - Derived field reconciliation
    - Optimistic concurrency
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many        # Account -> Policy -> Claim; Claim -> ClaimLine; Claim -> InvoiceDocument
    - cross_aggregate    # Claim.condition_id -> MedicalCondition; PolicyYear accumulators read across sibling Claims
  role_model: peer_roles
  consistency_model: immediate

# ---------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# ---------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix. Identity only; never a business-decision input."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; refreshed on every mutation including cascaded side effects."
      - name: version
        type: integer
        source: system
        description: "Starts at 1, increments by 1 on every mutation (including cascades). OCC token."
        default: 1
      - name: email
        type: string
        source: input
        description: "Account holder login email."
        constraints: "Unique across Account."
      - name: full_name
        type: string
        source: input
        description: "Account holder full name."
      - name: active_policy_count
        type: integer
        source: computed
        description: "Count of child Policy rows whose status IN {ACTIVE}. Drives multi-pet discount eligibility."
      - name: monthly_premium_cents
        type: integer
        source: computed
        description: "Sum over ACTIVE child Policy of (discounted base premium + wellness rider premium). See calc account_monthly_premium."
      - name: multi_pet_discount_applied
        type: boolean
        source: computed
        description: "True iff active_policy_count >= MULTI_PET_THRESHOLD (2)."

  - name: Policy
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; owning account."
      - name: pet_name
        type: string
        source: input
        description: "Insured pet name."
      - name: species
        type: enum
        source: input
        description: "Insured species."
        constraints: "One of {DOG, CAT}."
      - name: base_premium_cents
        type: integer
        source: input
        description: "Monthly base premium for this policy before any discount or rider, in cents."
        constraints: ">= 0 integer."
      - name: annual_deductible_cents
        type: integer
        source: input
        description: "Annual deductible for this policy, in cents."
        constraints: ">= 0 integer."
      - name: reimbursement_rate_bps
        type: integer
        source: input
        description: "Reimbursement rate in basis points (8000 = 80%) applied to post-deductible eligible amount."
        constraints: "Integer in [0, 10000]."
      - name: annual_cap_cents
        type: integer
        source: input
        description: "Maximum total reimbursement per policy year, in cents."
        constraints: ">= 0 integer."
      - name: waiting_period_days
        type: integer
        source: input
        description: "Days after effective_date before non-wellness claims are payable."
        constraints: ">= 0 integer."
        default: 14
      - name: wellness_rider
        type: boolean
        source: input
        description: "Whether the Wellness rider is attached. Adds flat rider premium and a separate wellness allowance bucket."
        default: false
      - name: effective_date
        type: datetime
        source: input
        description: "Date coverage begins. Waiting-period and pre-existing windows are measured from here. ISO 8601 UTC."
      - name: status
        type: enum
        source: system
        description: "Lifecycle status."
        constraints: "One of {PENDING_PAYMENT, ACTIVE, LAPSED, CANCELLED}. Initial PENDING_PAYMENT."
        default: PENDING_PAYMENT

  - name: PolicyYear
    parent: Policy
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: "FK -> Policy.id; owning policy."
      - name: year_index
        type: integer
        source: system
        description: "0-based ordinal; year 0 covers [effective_date, effective_date + 365d)."
      - name: period_start
        type: datetime
        source: system
        description: "Inclusive start of this coverage year. ISO 8601 UTC."
      - name: period_end
        type: datetime
        source: system
        description: "Exclusive end of this coverage year. ISO 8601 UTC."
      - name: deductible_met_cents
        type: integer
        source: computed
        description: "Sum of deductible_applied_cents across this year's APPROVED/PAID Claims. Reconciled per calc policy_year_ledger."
      - name: reimbursed_cents
        type: integer
        source: computed
        description: "Sum of reimbursed_cents across this year's APPROVED/PAID Claims. Capped at annual_cap_cents."
      - name: wellness_used_cents
        type: integer
        source: computed
        description: "Sum of wellness_paid_cents across this year's APPROVED/PAID wellness Claims."
      - name: status
        type: enum
        source: system
        description: "Whether the year accumulators may still change."
        constraints: "One of {OPEN, CLOSED}. Initial OPEN; CLOSED when current clock >= period_end."
        default: OPEN

  - name: MedicalCondition
    parent: Policy
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: "FK -> Policy.id; the policy this condition is recorded against."
      - name: name
        type: string
        source: input
        description: "Condition label (e.g., 'cruciate ligament tear')."
      - name: first_diagnosed_date
        type: datetime
        source: input
        description: "Date the condition was first diagnosed. ISO 8601 UTC."
      - name: exclusion_status
        type: enum
        source: computed
        description: "PRE_EXISTING if first_diagnosed_date < (effective_date + waiting_period_days); else COVERED. See calc condition_exclusion."
        constraints: "One of {PRE_EXISTING, COVERED}."

  - name: Claim
    parent: Policy
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: "FK -> Policy.id; the policy being claimed against."
      - name: condition_id
        type: string
        source: input
        description: "FK -> MedicalCondition.id; the condition this claim treats. Null only when claim_type=WELLNESS."
      - name: claim_type
        type: enum
        source: input
        description: "ILLNESS/ACCIDENT consume the deductible/cap; WELLNESS draws the wellness allowance bucket and bypasses deductible."
        constraints: "One of {ILLNESS, ACCIDENT, WELLNESS}."
      - name: incident_date
        type: datetime
        source: input
        description: "Date care was rendered. Drives waiting-period check and chronological ledger order. ISO 8601 UTC."
      - name: submitted_amount_cents
        type: integer
        source: input
        description: "Total billed amount from the invoice, in cents (sum of submitted ClaimLine amounts)."
        constraints: ">= 1 integer."
      - name: eligible_amount_cents
        type: integer
        source: computed
        description: "Sum of ClaimLine.allowed_amount_cents after OCR review and per-line exclusions."
      - name: deductible_applied_cents
        type: integer
        source: computed
        description: "Portion of eligible_amount absorbed by remaining deductible at adjudication. 0 for WELLNESS."
      - name: reimbursed_cents
        type: integer
        source: computed
        description: "Payable amount after deductible, rate, and annual-cap clamp. See calc policy_year_ledger."
      - name: wellness_paid_cents
        type: integer
        source: computed
        description: "Payable amount drawn from the wellness allowance bucket. 0 for non-WELLNESS."
      - name: status
        type: enum
        source: system
        description: "Adjudication lifecycle."
        constraints: "One of {DRAFT, SUBMITTED, IN_REVIEW, APPROVED, DENIED, PAID}. Initial DRAFT."
        default: DRAFT
      - name: denial_reason
        type: string
        source: system
        description: "Set when status=DENIED; one of the business error_ids that caused denial. Null otherwise."

  - name: ClaimLine
    parent: Claim
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> Claim.id; the claim this line belongs to."
      - name: description
        type: string
        source: input
        description: "Service/line description as billed."
      - name: billed_amount_cents
        type: integer
        source: input
        description: "Billed amount for this line, in cents."
        constraints: ">= 0 integer."
      - name: allowed_amount_cents
        type: integer
        source: computed
        description: "Amount allowed for this line after OCR adjustment and exclusion. 0 if excluded."
      - name: excluded
        type: boolean
        source: computed
        description: "True if this line was excluded by reviewer (e.g., non-covered item). Excluded lines contribute 0 to eligible_amount."
        default: false

  - name: InvoiceDocument
    parent: Claim
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> Claim.id; the claim this invoice supports."
      - name: file_uri
        type: string
        source: input
        description: "Storage URI of the uploaded invoice image/PDF."
      - name: ocr_total_cents
        type: integer
        source: system
        description: "Total amount the OCR engine extracted from the invoice, in cents. Set by the OCR-run endpoint."
      - name: ocr_status
        type: enum
        source: system
        description: "OCR pipeline state."
        constraints: "One of {PENDING_OCR, OCR_DONE, REVIEW_NEEDED, ACCEPTED, REJECTED}. Initial PENDING_OCR."
        default: PENDING_OCR
      - name: ocr_mismatch_bps
        type: integer
        source: computed
        description: "abs(ocr_total_cents - claim.submitted_amount_cents) * 10000 / submitted_amount_cents. Drives REVIEW_NEEDED gate."

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Policy
    initial_state: PENDING_PAYMENT
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING_PAYMENT
        to: ACTIVE
        trigger: "POST /accounts/{id}/policies/{pid}/activate"
        actor: Underwriter
        preconditions:
          - "Policy.status == PENDING_PAYMENT"
        side_effects:
          - "Set effective_date to request effective_date if provided, else keep input value."
          - "Create PolicyYear year_index=0 with period_start=effective_date, period_end=effective_date+365d, status=OPEN."
          - "Recompute Account.active_policy_count and Account.monthly_premium_cents and Account.multi_pet_discount_applied (Ledger sync to Account)."
          - "Increments Account.version by 1."
          - "Increments Policy.version by 1."
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /accounts/{id}/policies/{pid}/lapse"
        actor: Underwriter
        preconditions:
          - "Policy.status == ACTIVE"
        side_effects:
          - "Recompute Account.active_policy_count, monthly_premium_cents, multi_pet_discount_applied."
          - "Increments Account.version by 1; increments Policy.version by 1."
        note: "Lapsing one of two active policies may drop the account below MULTI_PET_THRESHOLD, re-pricing the sibling policy upward (cross-entity recompute)."
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /accounts/{id}/policies/{pid}/cancel"
        actor: Underwriter
        preconditions:
          - "Policy.status == ACTIVE"
        side_effects:
          - "Recompute Account.active_policy_count, monthly_premium_cents, multi_pet_discount_applied."
          - "Increments Account.version by 1; increments Policy.version by 1."
      - from: PENDING_PAYMENT
        to: CANCELLED
        trigger: "POST /accounts/{id}/policies/{pid}/cancel"
        actor: Underwriter
        preconditions:
          - "Policy.status == PENDING_PAYMENT"
        side_effects:
          - "Increments Policy.version by 1."
        note: "No Account recompute: a PENDING_PAYMENT policy is not counted in active_policy_count."

  - entity: InvoiceDocument
    initial_state: PENDING_OCR
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: PENDING_OCR
        to: OCR_DONE
        trigger: "POST /claims/{cid}/invoices/{iid}/run-ocr"
        actor: system
        preconditions:
          - "InvoiceDocument.ocr_status == PENDING_OCR"
        side_effects:
          - "Set ocr_total_cents from request body."
          - "Compute ocr_mismatch_bps = abs(ocr_total_cents - Claim.submitted_amount_cents)*10000 / Claim.submitted_amount_cents (integer floor)."
          - "If ocr_mismatch_bps > OCR_MISMATCH_TOLERANCE_BPS (500), set ocr_status=REVIEW_NEEDED instead of OCR_DONE."
          - "Increments InvoiceDocument.version by 1."
        note: "Branch: low mismatch -> OCR_DONE (auto-acceptable); high mismatch -> REVIEW_NEEDED (reviewer must act)."
      - from: OCR_DONE
        to: ACCEPTED
        trigger: "POST /claims/{cid}/invoices/{iid}/accept"
        actor: ClaimsAdjuster
        preconditions:
          - "InvoiceDocument.ocr_status IN {OCR_DONE, REVIEW_NEEDED}"
        side_effects:
          - "Increments InvoiceDocument.version by 1."
      - from: REVIEW_NEEDED
        to: ACCEPTED
        trigger: "POST /claims/{cid}/invoices/{iid}/accept"
        actor: ClaimsAdjuster
        preconditions:
          - "InvoiceDocument.ocr_status IN {OCR_DONE, REVIEW_NEEDED}"
        side_effects:
          - "Increments InvoiceDocument.version by 1."
      - from: REVIEW_NEEDED
        to: REJECTED
        trigger: "POST /claims/{cid}/invoices/{iid}/reject"
        actor: ClaimsAdjuster
        preconditions:
          - "InvoiceDocument.ocr_status == REVIEW_NEEDED"
        side_effects:
          - "Increments InvoiceDocument.version by 1."

  - entity: Claim
    initial_state: DRAFT
    terminal_states: [DENIED, PAID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /claims/{cid}/submit"
        actor: PolicyHolder
        preconditions:
          - "Claim.status == DRAFT"
          - "Policy.status == ACTIVE (cross-entity)"
          - "Claim has >= 1 ClaimLine"
          - "Claim has an InvoiceDocument whose ocr_status == ACCEPTED (cross-entity)"
        side_effects:
          - "Freeze submitted_amount_cents = sum of ClaimLine.billed_amount_cents."
          - "Increments Claim.version by 1."
      - from: SUBMITTED
        to: IN_REVIEW
        trigger: "POST /claims/{cid}/begin-review"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == SUBMITTED"
        side_effects:
          - "Compute each ClaimLine.allowed_amount_cents (excluded lines -> 0) and Claim.eligible_amount_cents (calc claim_eligible_amount)."
          - "Increments Claim.version by 1."
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /claims/{cid}/adjudicate (decision=APPROVE)"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == IN_REVIEW"
          - "incident_date >= effective_date + waiting_period_days (non-WELLNESS only)"
          - "claim_type=WELLNESS OR referenced MedicalCondition.exclusion_status == COVERED (cross-entity)"
          - "PolicyYear covering incident_date exists and is OPEN (cross-entity)"
        side_effects:
          - "Run calc policy_year_ledger for the covering PolicyYear: recompute deductible_applied_cents, reimbursed_cents, wellness_paid_cents for THIS claim using chronological (incident_date ASC) ledger position."
          - "Recompute PolicyYear.deductible_met_cents, reimbursed_cents, wellness_used_cents (Ledger sync to PolicyYear)."
          - "Increments Claim.version by 1; increments PolicyYear.version by 1."
        note: "Branch APPROVE: adjudication writes reimbursement; sets the payable amounts."
      - from: IN_REVIEW
        to: DENIED
        trigger: "POST /claims/{cid}/adjudicate (decision=DENY)"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == IN_REVIEW"
        side_effects:
          - "Set denial_reason from request body reason code."
          - "Set deductible_applied_cents=0, reimbursed_cents=0, wellness_paid_cents=0."
          - "Increments Claim.version by 1."
        note: "Branch DENY: no ledger mutation; PolicyYear accumulators unchanged."
      - from: APPROVED
        to: PAID
        trigger: "POST /claims/{cid}/pay"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == APPROVED"
        side_effects:
          - "Increments Claim.version by 1."
        note: "Terminal payable state; PolicyYear accumulators already reflect this claim from APPROVED."
      - from: APPROVED
        to: DENIED
        trigger: "POST /claims/{cid}/reverse"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == APPROVED"
        side_effects:
          - "Compensation: subtract this claim's deductible_applied_cents, reimbursed_cents, wellness_paid_cents from the covering PolicyYear accumulators (restoring them to pre-approval values)."
          - "Set deductible_applied_cents=0, reimbursed_cents=0, wellness_paid_cents=0, denial_reason='ERR_CLAIM_REVERSED'."
          - "Increments Claim.version by 1; increments PolicyYear.version by 1."
        note: "Compensating action: the conserved quantity PolicyYear.reimbursed_cents must return to its pre-approval value."

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: adjudicate-stale-policy-year
    parent_entity: PolicyYear
    write_endpoint: "POST /claims/{cid}/adjudicate"
    occ_field: "expected_policy_year_version"
    description: |
      Adjudicating a Claim APPROVE recomputes the covering PolicyYear's
      deductible/cap accumulators. If the PolicyYear version has advanced since
      the adjuster last read it — because a sibling Claim against the same
      PolicyYear was just approved and consumed deductible/cap headroom — the
      adjuster's view of remaining headroom is stale and the approval is
      rejected. The adjuster must re-read the PolicyYear and resubmit.
    error_id: ERR_STALE_POLICY_YEAR_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: claim_eligible_amount
    trigger: "Claim SUBMITTED -> IN_REVIEW (begin-review)"
    algorithm: aggregation
    formula: |
      # Per-line allowance after OCR review/exclusion, then summed.
      # round_half_up applied PER LINE before summing (pinned order).
      for each ClaimLine L of the claim, in created_at ASC:
        if L.excluded: L.allowed_amount_cents = 0
        else:          L.allowed_amount_cents = L.billed_amount_cents   # OCR review may have already adjusted billed_amount_cents on the line
      eligible_amount_cents = sum(L.allowed_amount_cents for L not excluded)
    input_set: "ClaimLines of the claim whose excluded == false."
    constants: {}
    precision: "Integer cents; no fractional cents at this step."

  - name: policy_year_ledger
    trigger: "Claim IN_REVIEW -> APPROVED (adjudicate APPROVE)"
    algorithm: chronological
    formula: |
      # On every APPROVE, RE-ATTRIBUTE the whole covering PolicyYear from scratch.
      # The authoritative ledger replays the full set S of non-WELLNESS claims that
      # are (or are about to be) APPROVED/PAID in this PolicyYear, ordered by
      # incident_date ASC, created_at ASC as tie-break (never id), then writes each
      # claim's deductible_applied_cents and reimbursed_cents.
      P  = covering Policy
      PY = covering PolicyYear
      rate = P.reimbursement_rate_bps / 10000
      S = { existing APPROVED/PAID non-WELLNESS claims of PY } ∪ { this claim if non-WELLNESS }
      sort S by (incident_date ASC, created_at ASC)
      ded_used = 0 ; reimb_used = 0
      for claim c in S:
        remaining_ded = max(0, P.annual_deductible_cents - ded_used)
        c.deductible_applied_cents = min(remaining_ded, c.eligible_amount_cents)
        post_ded = c.eligible_amount_cents - c.deductible_applied_cents
        raw_reimb = round_half_up(post_ded * rate)
        remaining_cap = max(0, P.annual_cap_cents - reimb_used)
        c.reimbursed_cents = min(raw_reimb, remaining_cap)
        ded_used   += c.deductible_applied_cents
        reimb_used += c.reimbursed_cents
      # WELLNESS claims are handled separately and do not enter S:
      if this.claim_type == WELLNESS:
        this.deductible_applied_cents = 0 ; this.reimbursed_cents = 0
        remaining_wellness = max(0, WELLNESS_ALLOWANCE_CENTS - PY.wellness_used_cents)
        this.wellness_paid_cents = min(this.eligible_amount_cents, remaining_wellness)
    input_set: "All APPROVED/PAID non-WELLNESS claims of the covering PolicyYear plus the claim being approved (re-attributed together); WELLNESS claims draw only the wellness bucket and never enter the deductible/cap ledger."
    constants:
      WELLNESS_ALLOWANCE_CENTS: 30000
    precision: "2 implied decimals (cents). round_half_up at the post-deductible * rate step, PER CLAIM, never sum-then-round."
    variants:
      - name: chronological_by_incident_date
        when: "Authoritative: re-attribute the whole year by incident_date ASC on each APPROVE."
        difference: "A later-approved but earlier-incident claim retroactively consumes the deductible first, lowering an already-approved later-incident claim's reimbursement."
      - name: submission_order
        when: "Naive alternative an implementer might pick: book each claim against the running accumulator in approval order, never re-attributing."
        difference: "When claims are approved out of incident-date order, deductible_applied_cents and reimbursed_cents per claim diverge from the chronological variant for identical inputs (e.g., earlier-incident claim reimburses 4000 vs 20000)."

  - name: account_monthly_premium
    trigger: "Policy activate/lapse/cancel side effect (recompute on Account)"
    algorithm: tiered_pricing
    formula: |
      # Multi-pet discount: threshold on count of ACTIVE policies.
      active = [ Po for Po in Account.policies if Po.status == ACTIVE ]
      multi  = len(active) >= MULTI_PET_THRESHOLD
      disc   = MULTI_PET_DISCOUNT_BPS if multi else 0    # basis points
      total  = 0
      for Po in active (created_at ASC):
        # Discount applies to base premium ONLY; wellness rider premium is added AFTER and is never discounted (pinned evaluation order).
        discounted_base = round_half_up(Po.base_premium_cents * (10000 - disc) / 10000)
        line = discounted_base + (WELLNESS_RIDER_PREMIUM_CENTS if Po.wellness_rider else 0)
        total += line
      monthly_premium_cents = total
      active_policy_count = len(active)
      multi_pet_discount_applied = multi
    input_set: "Child Policy rows with status == ACTIVE (PENDING_PAYMENT/LAPSED/CANCELLED excluded)."
    constants:
      MULTI_PET_THRESHOLD: 2
      MULTI_PET_DISCOUNT_BPS: 1000
      WELLNESS_RIDER_PREMIUM_CENTS: 1500
    precision: "Integer cents. round_half_up on each discounted base BEFORE adding the (undiscounted) rider premium and BEFORE summing across policies (pinned order: discount+round per policy, then add rider, then sum)."
    variants:
      - name: discount_base_then_add_rider
        when: "Authoritative: discount the base, round, then add the flat undiscounted rider per policy."
        difference: "Rider premium escapes the discount."
      - name: discount_full_line
        when: "Naive alternative: apply discount to (base + rider) together."
        difference: "Discounts the rider too, yielding a lower premium for rider-bearing policies — different total."

  - name: condition_exclusion
    trigger: "MedicalCondition create; re-evaluated on read"
    algorithm: threshold
    formula: |
      coverage_start = Policy.effective_date + Policy.waiting_period_days (days)
      if MedicalCondition.first_diagnosed_date < coverage_start:
        exclusion_status = PRE_EXISTING
      else:
        exclusion_status = COVERED
    input_set: "Single MedicalCondition against its Policy."
    constants: {}
    precision: "Date comparison at day granularity; strict '<' means a diagnosis exactly at coverage_start is COVERED."

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-referenced resources exist, validated left-to-right (account, then policy, then claim, then invoice/line)."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterized endpoints"
  - priority: 4
    category: business_referential
    check: "Body FK targets exist and belong to the path parent (e.g., Claim.condition_id resolves to a MedicalCondition of the same Policy)."
    error_id: ERR_FK_INVALID
    http_status: 422
    applies_to: "POST/PUT bodies carrying FKs"
  - priority: 5
    category: state
    check: "Target resource is in a state from which this transition is allowed."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: business_referential
    check: "PolicyHolder acting on a resource must own the owning Account (X-User-ID == Account.id chain)."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "PolicyHolder claim/policy endpoints"
  - priority: 7
    category: business_temporal
    check: "On adjudicate APPROVE of a non-WELLNESS claim: incident_date >= effective_date + waiting_period_days."
    error_id: ERR_WITHIN_WAITING_PERIOD
    http_status: 422
    applies_to: "POST /claims/{cid}/adjudicate"
  - priority: 8
    category: business_safety
    check: "On adjudicate APPROVE of a non-WELLNESS claim: referenced MedicalCondition.exclusion_status must be COVERED (not PRE_EXISTING)."
    error_id: ERR_PRE_EXISTING_EXCLUDED
    http_status: 422
    applies_to: "POST /claims/{cid}/adjudicate"
  - priority: 9
    category: business_temporal
    check: "On adjudicate APPROVE: a PolicyYear whose [period_start, period_end) contains incident_date must exist and be OPEN."
    error_id: ERR_POLICY_YEAR_CLOSED
    http_status: 422
    applies_to: "POST /claims/{cid}/adjudicate"
  - priority: 10
    category: business_constraint
    check: "On invoice run-ocr: ocr_total_cents must be >= 0 integer; on claim submit: claim must have >= 1 ClaimLine and an ACCEPTED InvoiceDocument."
    error_id: ERR_CLAIM_NOT_READY
    http_status: 422
    applies_to: "POST /claims/{cid}/submit"
  - priority: 11
    category: business_constraint
    check: "On claim create: claim_type=WELLNESS requires Policy.wellness_rider == true; non-WELLNESS requires non-null condition_id."
    error_id: ERR_WELLNESS_RIDER_REQUIRED
    http_status: 422
    applies_to: "POST /accounts/{id}/policies/{pid}/claims"
  - priority: 12
    category: business_fiscal
    check: "OCC: expected_policy_year_version on adjudicate must equal current PolicyYear.version."
    error_id: ERR_STALE_POLICY_YEAR_VERSION
    http_status: 412
    applies_to: "POST /claims/{cid}/adjudicate"
  - priority: 13
    category: business_constraint
    check: "Required body fields present and well-typed; enum members valid; numeric fields within declared ranges; pagination params within bounds."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  - method: POST
    path: "/accounts"
    description: "Create an account holder."
    roles: [PolicyHolder, Underwriter]
    code: 201
    input: [email, full_name]
    output: Account
    side_effects: []

  - method: GET
    path: "/accounts/{id}"
    description: "Fetch an account with computed premium fields."
    roles: [PolicyHolder, Underwriter, ClaimsAdjuster]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: GET
    path: "/accounts"
    description: "List accounts (paginated)."
    roles: [Underwriter, ClaimsAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: Account[]
    side_effects: []

  - method: POST
    path: "/accounts/{id}/policies"
    description: "Create a policy under an account (PENDING_PAYMENT)."
    roles: [Underwriter]
    code: 201
    input: [pet_name, species, base_premium_cents, annual_deductible_cents, reimbursement_rate_bps, annual_cap_cents, "waiting_period_days?", "wellness_rider?", effective_date]
    output: Policy
    side_effects: []

  - method: GET
    path: "/accounts/{id}/policies"
    description: "List policies of an account (FK reverse-reachability for Policy.account_id)."
    roles: [PolicyHolder, Underwriter, ClaimsAdjuster]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Policy[]
    side_effects: []

  - method: GET
    path: "/accounts/{id}/policies/{pid}"
    description: "Fetch one policy."
    roles: [PolicyHolder, Underwriter, ClaimsAdjuster]
    code: 200
    input: []
    output: Policy
    side_effects: []

  - method: POST
    path: "/accounts/{id}/policies/{pid}/activate"
    description: "Activate a PENDING_PAYMENT policy; creates PolicyYear 0 and re-prices account."
    roles: [Underwriter]
    code: 200
    input: ["effective_date?"]
    output: Policy
    side_effects:
      - "Create PolicyYear 0; recompute Account premium fields; increments Account.version and Policy.version by 1."

  - method: POST
    path: "/accounts/{id}/policies/{pid}/lapse"
    description: "Lapse an ACTIVE policy; re-prices account (may drop multi-pet discount)."
    roles: [Underwriter]
    code: 200
    input: []
    output: Policy
    side_effects:
      - "Recompute Account premium fields; increments Account.version and Policy.version by 1."

  - method: POST
    path: "/accounts/{id}/policies/{pid}/cancel"
    description: "Cancel a policy."
    roles: [Underwriter]
    code: 200
    input: []
    output: Policy
    side_effects:
      - "Recompute Account premium fields when policy was ACTIVE; increments versions."

  - method: GET
    path: "/accounts/{id}/policies/{pid}/policy-years"
    description: "List PolicyYears of a policy (FK reverse-reachability for PolicyYear.policy_id)."
    roles: [PolicyHolder, Underwriter, ClaimsAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: PolicyYear[]
    side_effects: []

  - method: POST
    path: "/accounts/{id}/policies/{pid}/conditions"
    description: "Record a medical condition on a policy; exclusion_status computed."
    roles: [PolicyHolder, Underwriter, ClaimsAdjuster]
    code: 201
    input: [name, first_diagnosed_date]
    output: MedicalCondition
    side_effects:
      - "Compute exclusion_status (calc condition_exclusion)."

  - method: GET
    path: "/accounts/{id}/policies/{pid}/conditions"
    description: "List conditions of a policy (FK reverse-reachability for MedicalCondition.policy_id)."
    roles: [PolicyHolder, Underwriter, ClaimsAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: MedicalCondition[]
    side_effects: []

  - method: POST
    path: "/accounts/{id}/policies/{pid}/claims"
    description: "Open a DRAFT claim against a policy."
    roles: [PolicyHolder]
    code: 201
    input: [claim_type, incident_date, "condition_id?"]
    output: Claim
    side_effects: []

  - method: GET
    path: "/claims"
    description: "List claims, filterable by policy_id or condition_id (FK reverse-reachability for Claim.policy_id and Claim.condition_id)."
    roles: [PolicyHolder, Underwriter, ClaimsAdjuster]
    code: 200
    input: ["policy_id?", "condition_id?", "status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []

  - method: GET
    path: "/claims/{cid}"
    description: "Fetch one claim with computed adjudication fields."
    roles: [PolicyHolder, Underwriter, ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: POST
    path: "/claims/{cid}/lines"
    description: "Add a ClaimLine to a DRAFT claim."
    roles: [PolicyHolder]
    code: 201
    input: [description, billed_amount_cents]
    output: ClaimLine
    side_effects: []

  - method: GET
    path: "/claims/{cid}/lines"
    description: "List ClaimLines of a claim (FK reverse-reachability for ClaimLine.claim_id)."
    roles: [PolicyHolder, Underwriter, ClaimsAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: ClaimLine[]
    side_effects: []

  - method: PATCH
    path: "/claims/{cid}/lines/{lid}"
    description: "Reviewer adjusts a line: set allowed amount or exclude it (only while claim IN_REVIEW)."
    roles: [ClaimsAdjuster]
    code: 200
    input: ["billed_amount_cents?", "excluded?"]
    output: ClaimLine
    side_effects:
      - "Recompute Claim.eligible_amount_cents (calc claim_eligible_amount); increments Claim.version by 1."

  - method: POST
    path: "/claims/{cid}/invoices"
    description: "Upload an invoice document to a DRAFT claim (PENDING_OCR)."
    roles: [PolicyHolder]
    code: 201
    input: [file_uri]
    output: InvoiceDocument
    side_effects: []

  - method: GET
    path: "/claims/{cid}/invoices"
    description: "List invoice documents of a claim (FK reverse-reachability for InvoiceDocument.claim_id)."
    roles: [PolicyHolder, Underwriter, ClaimsAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: InvoiceDocument[]
    side_effects: []

  - method: POST
    path: "/claims/{cid}/invoices/{iid}/run-ocr"
    description: "Run OCR on an invoice; sets ocr_total_cents and branches to OCR_DONE or REVIEW_NEEDED."
    roles: [ClaimsAdjuster]
    code: 200
    input: [ocr_total_cents]
    output: InvoiceDocument
    side_effects:
      - "Compute ocr_mismatch_bps; set ocr_status; increments InvoiceDocument.version by 1."

  - method: POST
    path: "/claims/{cid}/invoices/{iid}/accept"
    description: "Accept an invoice (from OCR_DONE or REVIEW_NEEDED)."
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: InvoiceDocument
    side_effects:
      - "Increments InvoiceDocument.version by 1."

  - method: POST
    path: "/claims/{cid}/invoices/{iid}/reject"
    description: "Reject an invoice in REVIEW_NEEDED."
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: InvoiceDocument
    side_effects:
      - "Increments InvoiceDocument.version by 1."

  - method: POST
    path: "/claims/{cid}/submit"
    description: "Submit a DRAFT claim for adjudication."
    roles: [PolicyHolder]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "Freeze submitted_amount_cents; increments Claim.version by 1."

  - method: POST
    path: "/claims/{cid}/begin-review"
    description: "Move SUBMITTED claim to IN_REVIEW and compute eligible_amount."
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "Compute ClaimLine allowances and Claim.eligible_amount_cents; increments Claim.version by 1."

  - method: POST
    path: "/claims/{cid}/adjudicate"
    description: "Approve or deny an IN_REVIEW claim. APPROVE runs the policy-year ledger under OCC."
    roles: [ClaimsAdjuster]
    code: 200
    input: [decision, "reason?", "expected_policy_year_version?"]
    output: Claim
    side_effects:
      - "APPROVE: run calc policy_year_ledger; recompute PolicyYear accumulators; increments Claim.version and PolicyYear.version by 1."
      - "DENY: set denial_reason; zero payable fields; increments Claim.version by 1."

  - method: POST
    path: "/claims/{cid}/pay"
    description: "Mark an APPROVED claim PAID."
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "Increments Claim.version by 1."

  - method: POST
    path: "/claims/{cid}/reverse"
    description: "Reverse an APPROVED claim (compensation): restore PolicyYear accumulators."
    roles: [ClaimsAdjuster]
    code: 200
    input: [expected_policy_year_version]
    output: Claim
    side_effects:
      - "Subtract this claim's payable amounts from PolicyYear accumulators; zero payable fields; set denial_reason; increments Claim.version and PolicyYear.version by 1."

  - method: GET
    path: "/policies/{pid}"
    description: "Flat fetch of one policy by id."
    roles: [PolicyHolder, Underwriter, ClaimsAdjuster]
    code: 200
    input: []
    output: Policy
    side_effects: []

  - method: GET
    path: "/policies"
    description: "Filtered list of policies (FK reverse-reachability for Policy.account_id)."
    roles: [PolicyHolder, Underwriter, ClaimsAdjuster]
    code: 200
    input: ["account_id?", "status?", "limit?", "offset?"]
    output: Policy[]
    side_effects: []

  - method: GET
    path: "/policy-years/{yid}"
    description: "Flat fetch of one PolicyYear by id."
    roles: [PolicyHolder, Underwriter, ClaimsAdjuster]
    code: 200
    input: []
    output: PolicyYear
    side_effects: []

  - method: GET
    path: "/policy-years"
    description: "Filtered list of PolicyYears (FK reverse-reachability for PolicyYear.policy_id)."
    roles: [PolicyHolder, Underwriter, ClaimsAdjuster]
    code: 200
    input: ["policy_id?", "limit?", "offset?"]
    output: PolicyYear[]
    side_effects: []

  - method: GET
    path: "/conditions/{coid}"
    description: "Flat fetch of one MedicalCondition by id."
    roles: [PolicyHolder, Underwriter, ClaimsAdjuster]
    code: 200
    input: []
    output: MedicalCondition
    side_effects: []

  - method: GET
    path: "/conditions"
    description: "Filtered list of conditions (FK reverse-reachability for MedicalCondition.policy_id)."
    roles: [PolicyHolder, Underwriter, ClaimsAdjuster]
    code: 200
    input: ["policy_id?", "limit?", "offset?"]
    output: MedicalCondition[]
    side_effects: []

  - method: GET
    path: "/claim-lines/{id}"
    description: "Flat fetch of one ClaimLine by id."
    roles: [PolicyHolder, Underwriter, ClaimsAdjuster]
    code: 200
    input: []
    output: ClaimLine
    side_effects: []

  - method: GET
    path: "/claim-lines"
    description: "Filtered list of ClaimLines (FK reverse-reachability for ClaimLine.claim_id)."
    roles: [PolicyHolder, Underwriter, ClaimsAdjuster]
    code: 200
    input: ["claim_id?", "limit?", "offset?"]
    output: ClaimLine[]
    side_effects: []

  - method: GET
    path: "/invoices/{id}"
    description: "Flat fetch of one InvoiceDocument by id."
    roles: [PolicyHolder, Underwriter, ClaimsAdjuster]
    code: 200
    input: []
    output: InvoiceDocument
    side_effects: []

  - method: GET
    path: "/invoices"
    description: "Filtered list of invoice documents (FK reverse-reachability for InvoiceDocument.claim_id)."
    roles: [PolicyHolder, Underwriter, ClaimsAdjuster]
    code: 200
    input: ["claim_id?", "limit?", "offset?"]
    output: InvoiceDocument[]
    side_effects: []

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving: set the server's current UTC clock (drives PolicyYear OPEN/CLOSED)."
    roles: [Underwriter]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "Closes any PolicyYear whose period_end <= new clock (status CLOSED)."

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID header."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role not permitted for this operation."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "PolicyHolder acting on a resource not owned by their Account."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-referenced resource does not exist."
  - id: ERR_FK_INVALID
    http: 422
    condition: "Body FK target does not exist or does not belong to the path parent."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a state allowing this transition."
  - id: ERR_WITHIN_WAITING_PERIOD
    http: 422
    condition: "Non-WELLNESS claim incident_date is before effective_date + waiting_period_days."
  - id: ERR_PRE_EXISTING_EXCLUDED
    http: 422
    condition: "Referenced condition is PRE_EXISTING (diagnosed before coverage start)."
  - id: ERR_POLICY_YEAR_CLOSED
    http: 422
    condition: "No OPEN PolicyYear covers the claim's incident_date at adjudication."
  - id: ERR_CLAIM_NOT_READY
    http: 422
    condition: "Submit attempted without >=1 ClaimLine or without an ACCEPTED InvoiceDocument."
  - id: ERR_WELLNESS_RIDER_REQUIRED
    http: 422
    condition: "WELLNESS claim on a policy without the wellness rider, or non-WELLNESS claim missing condition_id."
  - id: ERR_STALE_POLICY_YEAR_VERSION
    http: 412
    condition: "expected_policy_year_version does not match current PolicyYear.version on adjudicate/reverse."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, bad enum/type, out-of-range numeric, or bad pagination params."
  - id: ERR_CLAIM_REVERSED
    http: 422
    condition: "Sentinel denial_reason recorded when an APPROVED claim is reversed (not returned as an HTTP error; stored on the claim)."

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: PolicyHolder
    description: "Account holder who opens claims, adds lines, uploads invoices, and submits."
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /accounts/{id}/policies/{pid}/claims"
      - "POST /claims/{cid}/lines"
      - "POST /claims/{cid}/invoices"
      - "POST /claims/{cid}/submit"
    shared_operations:
      - "POST /accounts"
      - "GET /accounts/{id}"
      - "GET /accounts/{id}/policies (+ /{pid}, /policy-years, /conditions)"
      - "POST /accounts/{id}/policies/{pid}/conditions"
      - "GET /claims (+ /{cid}, /lines, /invoices)"
  - name: Underwriter
    description: "Manages account creation and policy lifecycle (activate/lapse/cancel), sets clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /accounts/{id}/policies"
      - "POST /accounts/{id}/policies/{pid}/activate"
      - "POST /accounts/{id}/policies/{pid}/lapse"
      - "POST /accounts/{id}/policies/{pid}/cancel"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /accounts"
      - "GET /accounts (+ /{id}, /policies, /conditions, /policy-years)"
      - "POST /accounts/{id}/policies/{pid}/conditions"
      - "GET /claims (+ /{cid}, /lines, /invoices)"
  - name: ClaimsAdjuster
    description: "Reviews invoices (OCR), adjusts lines, adjudicates, pays, and reverses claims."
    identity: "opaque"
    exclusive_operations:
      - "POST /claims/{cid}/invoices/{iid}/run-ocr"
      - "POST /claims/{cid}/invoices/{iid}/accept"
      - "POST /claims/{cid}/invoices/{iid}/reject"
      - "PATCH /claims/{cid}/lines/{lid}"
      - "POST /claims/{cid}/begin-review"
      - "POST /claims/{cid}/adjudicate"
      - "POST /claims/{cid}/pay"
      - "POST /claims/{cid}/reverse"
    shared_operations:
      - "GET /accounts (+ /{id}, /policies, /conditions, /policy-years)"
      - "POST /accounts/{id}/policies/{pid}/conditions"
      - "GET /claims (+ /{cid}, /lines, /invoices)"
