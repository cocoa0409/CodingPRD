            - "DisclosureItem.${minors_item_id}.weight_credit == 8.00 and surcharge_cents == 7500"
            - "the submit call returns HTTP 200 with Registration.${reg_id}.status == SUBMITTED"
            - "Registration.${reg_id}.provisional_filing_fee_cents == 60500"
            - "Registration.${reg_id}.charged_fee_cents == 60500"
            - "DataBroker.${broker_id}.fee_paid_cents == 60500"
            - "DataBroker.${broker_id}.fee_credit_cents == 439500"
            - "DataBroker.${broker_id}.fee_deposited_cents == 500000"

      - name: recipient_reliability_applies_the_late_ack_penalty_and_stays_active
        claim_type: correct_result
        grounds:
