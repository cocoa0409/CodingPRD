            - call: "POST /repair-orders/${ro_id}/blueprint"
              payload: {}
              as: Estimator
              as_user_id: "est-001"
            - call: "POST /repair-orders/${ro_id}/estimate/lock"
              payload: {}
              as: Estimator
              as_user_id: "est-001"
              captures: { ro_ver_locked: $.data.version }
            - call: "POST /repair-orders/${ro_id}/consent-decisions"
              payload: { decision: "CONSENT", alternate_parts_ok: false, expected_repair_order_version: "${ro_ver_locked}" }
              as: Customer
