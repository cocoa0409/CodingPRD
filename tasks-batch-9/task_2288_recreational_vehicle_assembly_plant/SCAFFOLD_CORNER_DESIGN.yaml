              as: PlantAdmin
              captures: { fp_id: $.data.id }
            - call: "POST /option-items"
              payload: { option_code: "OPT-HEAVY", category: "INTERIOR", install_station: "FINISH", price_cents: 100000, weight_lbs: 3001, added_station_hours: 1.00, amp_draw: 0, water_demand_gal: 0 }
              as: PlantAdmin
              captures: { o_heavy: $.data.id }
            - call: "POST /option-items"
              payload: { option_code: "OPT-AMP60", category: "ELECTRICAL", install_station: "ROUGH_IN", price_cents: 100000, weight_lbs: 0, added_station_hours: 1.00, amp_draw: 60, water_demand_gal: 0 }
              as: PlantAdmin
              captures: { o_amp60: $.data.id }
            - call: "POST /option-items"
              payload: { option_code: "OPT-WAT31", category: "PLUMBING", install_station: "ROUGH_IN", price_cents: 100000, weight_lbs: 0, added_station_hours: 1.00, amp_draw: 0, water_demand_gal: 31 }
              as: PlantAdmin
              captures: { o_wat31: $.data.id }
            - call: "POST /option-items"
              payload: { option_code: "OPT-AMP50", category: "ELECTRICAL", install_station: "ROUGH_IN", price_cents: 100000, weight_lbs: 0, added_station_hours: 1.00, amp_draw: 50, water_demand_gal: 0 }
              as: PlantAdmin
