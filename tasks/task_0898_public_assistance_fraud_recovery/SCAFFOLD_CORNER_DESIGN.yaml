  - section: state_machines
    instances:
      - name: dup_month_covered_by_difficulty
        claim_type: invalid_transition
        grounds: ["errors[ERR_DUPLICATE_MONTH]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / duplicate_benefit_month_point_collision
          rationale: "The duplicate benefit_month collision is asserted by the named §1.8 instance."

      - name: hearing_ipv_impose_cascade_covered
        claim_type: side_effect_execution
        grounds: ["state_machines.Disqualification.ADH_REFERRED_to_IMPOSED"]
        excluded_because:
          difficulty_instance: transitive_cascade / hearing_ipv_impose_reclassify_recoup_depth3
          rationale: "The ADH_REFERRED->IMPOSED transition and its impose cascade are exercised by the named §1.8 depth-3 instance."
