          trigger:
            - call: "POST /leagues/${lg}/volunteers/${v1}/screenings/${s1}/adjudicate"
              payload: { action: "APPROVE" }
              as: DistrictAdministrator
              captures: { err: $.data.error_id }
            - call: "POST /leagues/${lg}/volunteers/${v1}/screenings/${s1}/adjudicate"
              payload: { action: "DISQUALIFY" }
