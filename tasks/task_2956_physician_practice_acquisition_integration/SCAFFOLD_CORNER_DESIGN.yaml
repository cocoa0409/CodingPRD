            - "Acquisition.${acq_id}.retention_pool_committed_cents == 0 and retention_pool_available_cents == 3000000"
            - "Acquisition.${acq_id}.hr_staffing_coverage_pct == 0.00"
            - "target_status RESCINDED on the same DRAFT row succeeds, so the expired draft is still disposable"

      - name: billing_conversion_attest_in_sourcing_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.BillingConversion.status.NOT_STARTED_to_ATTESTED
          - validations[priority=14]
        distinguishing_aspect: |
          NOT_STARTED -> ATTESTED is guarded on the parent deal_status being
          BOARD_REVIEW, SIGNED or CLOSED, so attestation on a SOURCING deal is refused
          and attested_on stays null — even though every notice figure on the row
          already satisfies the coverage and lead-time rules.
        test_recipe:
          setup:
            - "One Acquisition in deal_status SOURCING."
