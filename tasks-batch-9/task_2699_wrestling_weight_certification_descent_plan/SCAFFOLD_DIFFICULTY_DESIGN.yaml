              payload: { status: "OPEN" }
              as: StateOffice
            - call: "POST /teams"
              payload: { season_id: "${season_id}", school_name: "Northgate High" }
              as: StateOffice
              captures: { team_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Dana Ruiz", credential_number: "AS-1001", certified_methods: ["SKINFOLD", "BIA"], certification_expires_on: "2027-06-30" }
              as: StateOffice
              captures: { assessor_id: $.data.id }
            - call: "POST /assessors/${assessor_id}/training-records"
              payload: { credential_code: "NFHS-BC-101", hours: 8 }
              as: StateOffice
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T12:00:00Z" }
              as: StateOffice
            - call: "POST /teams/${team_id}/wrestlers"
              payload: { full_name: "Alex Mercer", sex: "M", grade: 11 }
              as: TeamCoach
