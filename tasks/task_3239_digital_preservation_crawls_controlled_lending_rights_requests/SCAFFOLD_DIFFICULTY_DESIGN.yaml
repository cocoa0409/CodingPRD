# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3239_digital_preservation_crawls_controlled_lending_rights_requests
# Depth probe: 9 difficulty rules x 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: playback_variant_nearest_time_vs_latest_default
        grounds:
          - calculations.playback_resolution
          - endpoints.GET_/archive/playback
        distinguishing_aspect: |
          The playback_resolution calculation has two selection variants on the
          Capture entity domain: with requested_at supplied the nearest-in-
          absolute-time capture wins (past tie preferred), while omitting
          requested_at selects the maximum captured_at. The same capture set
          yields a different returned capture_id depending on which variant the
          request invokes.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z."
            - "Crawl job J1 scheduled at 2026-09-01T01:00:00Z with rpm 60, started and RUNNING."
            - "Capture C1 recorded at clock 2026-09-02T00:00:00Z for url https://example.site/a with content_hash h1."
            - "Capture C2 recorded at clock 2026-09-05T00:00:00Z for the same url with content_hash h2."
          setup_api_calls:
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Admin
            - call: "POST /archive/crawl-jobs"
              payload: { seed_url: "https://example.site/", scheduled_at: "2026-09-01T01:00:00Z", requests_per_minute: 60 }
              as: CrawlOperator
              captures: { job1: $.data.id }
            - call: "POST /archive/crawl-jobs/${job1}/start"
              payload: {}
              as: CrawlOperator
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: Admin
            - call: "POST /archive/captures"
              payload: { crawl_job_id: "${job1}", url: "https://example.site/a", content_hash: "h1", has_dynamic_content: false }
              as: CrawlOperator
              captures: { cap1: $.data.id }
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: Admin
            - call: "POST /archive/captures"
              payload: { crawl_job_id: "${job1}", url: "https://example.site/a", content_hash: "h2", has_dynamic_content: false }
              as: CrawlOperator
              captures: { cap2: $.data.id }
          trigger:
            - call: "GET /archive/playback"
              payload: { url: "https://example.site/a", requested_at: "2026-09-04T00:00:00Z" }
              as: Patron
              as_user_id: "patron-any"
              captures: { nearest_cap: $.data.capture_id }
            - call: "GET /archive/playback"
              payload: { url: "https://example.site/a" }
              as: Patron
              as_user_id: "patron-any"
              captures: { latest_cap: $.data.capture_id }
          assert:
            - "first response mode == FULL and nearest_cap == ${cap2} (1 day from 2026-09-04 beats 2 days)"
            - "second response mode == FULL and latest_cap == ${cap2}"
            - "a third call with requested_at 2026-09-03T00:00:00Z would return ${cap1}: |2d-3d| == |5d-3d| tie resolves to the EARLIER capture ${cap1}"
      - name: work_availability_provisional_embargo_vs_hard_withdrawal
        grounds:
          - calculations.work_availability_recompute
          - state_machines.RightsRequest.FILED_to_UNDER_REVIEW
          - state_machines.RightsRequest.UNDER_REVIEW_to_LEGAL_HOLD
        distinguishing_aspect: |
          The work_availability_recompute variants act on the Work/RightsRequest
          domain (different entity domain from Capture playback): the
          provisional_embargo variant (UNDER_REVIEW) blocks new checkouts but
          leaves ACTIVE loans untouched, while the hard_withdrawal variant
          (LEGAL_HOLD) revokes every ACTIVE loan on the work's items — same
          work, same loan, two different outcomes for identical loan data.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z."
            - "Library L1 ACTIVE; work W1 AVAILABLE; batch B1 SEALED with item I1 LENDABLE."
            - "Patron P1 holds an ACTIVE STANDARD loan LN1 on I1 (checked out at setup clock)."
            - "RightsRequest R1 (subject WORK, work W1) filed by legal-a; filed_by == 'legal-a'."
          setup_api_calls:
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: Admin
            - call: "POST /archive/partner-libraries"
              payload: { library_code: "LIB-A", display_name: "Library A", storage_commitment_years: 10 }
              as: LibraryAdmin
              captures: { lib1: $.data.id }
            - call: "POST /archive/works"
              payload: { title: "At-Risk Almanac", author: "A. Writer", publication_year: 1998 }
              as: Admin
              captures: { work1: $.data.id }
            - call: "POST /archive/scan-batches"
              payload: { operator_code: "op-1" }
              as: ScanOperator
              captures: { batch1: $.data.id }
            - call: "POST /archive/items"
              payload: { batch_id: "${batch1}", work_id: "${work1}", owning_library_id: "${lib1}", page_count: 300, condition_grade: "GOOD" }
              as: ScanOperator
              captures: { item1: $.data.id }
            - call: "POST /archive/scan-batches/${batch1}/seal"
              payload: {}
              as: ScanOperator
            - call: "POST /archive/patrons"
              payload: { email: "p1@example.org", full_name: "Patron One" }
              as: Anonymous
              captures: { pat1: $.data.id }
            - call: "POST /archive/loans"
              payload: { item_id: "${item1}", patron_id: "${pat1}", loan_kind: "STANDARD" }
              as: Patron
              as_user_id: "${pat1}"
              captures: { loan1: $.data.id }
            - call: "POST /archive/rights-requests"
              payload: { subject_kind: "WORK", work_id: "${work1}", claimant_name: "Estate of Writer" }
              as: LegalReviewer
              as_user_id: "legal-a"
              captures: { rr1: $.data.id }
          trigger:
            - call: "POST /archive/rights-requests/${rr1}/begin-review"
              payload: {}
              as: LegalReviewer
              as_user_id: "legal-b"
            - call: "GET /archive/patrons/${pat1}/loans"
              payload: { status: "ACTIVE" }
              as: Admin
              captures: { mid_count: "$.data[0].id" }
            - call: "POST /archive/rights-requests/${rr1}/escalate-hold"
              payload: {}
              as: LegalReviewer
              as_user_id: "legal-b"
          assert:
            - "after begin-review: Work.${work1}.availability == EMBARGOED and Loan.${loan1}.status is still ACTIVE (provisional variant preserves loans)"
            - "GET /archive/patrons/${pat1}/loans?status=ACTIVE between the two triggers returns exactly 1 row"
            - "after escalate-hold: Work.${work1}.availability == WITHDRAWN and Loan.${loan1}.status == REVOKED (hard-withdrawal variant revokes)"
            - "ScanItem.${item1}.status == LENDABLE and Patron.${pat1}.active_loan_count == 0 after the hold cascade"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: playback_time_weighted_mode_formula
        grounds:
          - calculations.playback_resolution
          - endpoints.GET_/archive/playback
        distinguishing_aspect: |
          Mode (a): a >= 3-input non-linear formula — suppression override
          (directive/rights state) x requested_at presence x nearest-time
          distance with a directional tie-break and a has_dynamic_content
          branch. A static capture with an exactly equidistant earlier/later
          pair resolves to the earlier capture, and adding
          has_dynamic_content=true to that winner flips mode to DEGRADED.
        test_recipe:
          setup:
            - "Logical clock advanced stepwise; job J2 RUNNING."
            - "Capture D1 (static) at 2026-09-02T00:00:00Z and D2 (static) at 2026-09-04T00:00:00Z for url https://tie.site/x, hashes t1/t2."
            - "Capture D3 (dynamic) at 2026-09-06T00:00:00Z for the same url, hash t3."
          setup_api_calls:
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Admin
            - call: "POST /archive/crawl-jobs"
              payload: { seed_url: "https://tie.site/", scheduled_at: "2026-09-01T00:30:00Z", requests_per_minute: 30 }
              as: CrawlOperator
              captures: { job2: $.data.id }
            - call: "POST /archive/crawl-jobs/${job2}/start"
              payload: {}
              as: CrawlOperator
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: Admin
            - call: "POST /archive/captures"
              payload: { crawl_job_id: "${job2}", url: "https://tie.site/x", content_hash: "t1", has_dynamic_content: false }
              as: CrawlOperator
              captures: { d1: $.data.id }
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: Admin
            - call: "POST /archive/captures"
              payload: { crawl_job_id: "${job2}", url: "https://tie.site/x", content_hash: "t2", has_dynamic_content: false }
              as: CrawlOperator
              captures: { d2: $.data.id }
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: Admin
            - call: "POST /archive/captures"
              payload: { crawl_job_id: "${job2}", url: "https://tie.site/x", content_hash: "t3", has_dynamic_content: true }
              as: CrawlOperator
              captures: { d3: $.data.id }
          trigger:
            - call: "GET /archive/playback"
              payload: { url: "https://tie.site/x", requested_at: "2026-09-03T00:00:00Z" }
              as: Admin
              captures: { tie_pick: $.data.capture_id }
            - call: "GET /archive/playback"
              payload: { url: "https://tie.site/x" }
              as: Admin
              captures: { dyn_mode: $.data.mode }
          assert:
            - "tie_pick == ${d1}: requested 2026-09-03 is equidistant (2 days) from D1 and D2; the EARLIER capture wins the tie"
            - "dyn_mode == \"DEGRADED\" and the omitted-requested_at variant selects ${d3} (max captured_at) whose has_dynamic_content flips the mode"
            - "GET /archive/playback with url https://tie.site/absent returns mode == \"NOT_FOUND\" and capture_id null (empty candidate set)"
      - name: grant_settlement_reverse_ordering_balance
        grounds:
          - calculations.grant_utilization
          - calculations.capture_dedupe_and_storage_cost
          - state_machines.BudgetLine.OPEN_to_SETTLED
          - state_machines.FundingGrant.EXHAUSTED_to_OPEN
        distinguishing_aspect: |
          Mode (c): a circular-looking dependency with pinned evaluation
          order — BudgetLine settlement mutates reserved_cents and spent_cents,
          which recompute grant utilization, which recompute grant status,
          which gates whether further BudgetLines may be created; the scaffold
          pins the order (line settle -> reserved/spent -> utilization ->
          status -> creation gate) so that settling below the reservation
          re-opens an EXHAUSTED grant for exactly the difference.
        test_recipe:
          setup:
            - "Grant G1 amount_cents 100000, OPEN."
            - "BudgetLine BL1 reservation 100000 (drives G1 to exactly EXHAUSTED)."
          setup_api_calls:
            - call: "POST /archive/funding-grants"
              payload: { donor_name: "Mellon", amount_cents: 100000 }
              as: FinanceAdmin
              captures: { grant1: $.data.id, grant_v0: $.data.version }
            - call: "POST /archive/budget-lines"
              payload: { grant_id: "${grant1}", category: "STORAGE", budget_reservation_cents: 100000 }
              as: FinanceAdmin
              captures: { bl1: $.data.id }
            - call: "GET /archive/funding-grants/${grant1}"
              payload: {}
              as: FinanceAdmin
              captures: { grant_v1: $.data.version }
          trigger:
            - call: "POST /archive/budget-lines"
              payload: { grant_id: "${grant1}", category: "BANDWIDTH", budget_reservation_cents: 1 }
              as: FinanceAdmin
              captures: { reject_err: $.data.error_id }
            - call: "POST /archive/budget-lines/${bl1}/settle"
              payload: { actual_spend_cents: 80000, expected_grant_version: "${grant_v1}" }
              as: FinanceAdmin
            - call: "POST /archive/budget-lines"
              payload: { grant_id: "${grant1}", category: "SCAN_LABOR", budget_reservation_cents: 20000 }
              as: FinanceAdmin
              captures: { bl2: $.data.id }
            - call: "POST /archive/budget-lines"
              payload: { grant_id: "${grant1}", category: "PETABYTE_INSURANCE", budget_reservation_cents: 1 }
              as: FinanceAdmin
              captures: { reject_err2: $.data.error_id }
          assert:
            - "after BL1 creation: FundingGrant.${grant1}.reserved_cents == 100000 and status == EXHAUSTED (equality at the boundary triggers EXHAUSTED, not 1 cent more)"
            - "the first over-limit creation is rejected with reject_err == ERR_GRANT_EXHAUSTED"
            - "after settling BL1 at 80000: reserved_cents == 0, spent_cents == 80000, and status recomputes to OPEN (cycle EXHAUSTED -> OPEN)"
            - "BL2 (20000) then succeeds, driving utilization back to exactly 100000 and status to EXHAUSTED again"
            - "the final 1-cent creation is rejected with reject_err2 == ERR_GRANT_EXHAUSTED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: funding_grant_open_exhausted_cycle
        grounds:
          - state_machines.FundingGrant.OPEN_to_EXHAUSTED
          - state_machines.FundingGrant.EXHAUSTED_to_OPEN
          - calculations.grant_utilization
        distinguishing_aspect: |
          FundingGrant has a genuine cycle (OPEN -> EXHAUSTED -> OPEN) on the
          grant entity, driven purely by BudgetLine side effects; the scaffold
          demonstrates the cycle closes twice and that CLOSED remains manually
          reachable from either cycle state.
        test_recipe:
          setup:
            - "Grant G2 amount_cents 50000 OPEN; BudgetLine BL3 reservation 30000."
          setup_api_calls:
            - call: "POST /archive/funding-grants"
              payload: { donor_name: "Ford", amount_cents: 50000 }
              as: FinanceAdmin
              captures: { grant2: $.data.id }
            - call: "POST /archive/budget-lines"
              payload: { grant_id: "${grant2}", category: "STORAGE", budget_reservation_cents: 30000 }
              as: FinanceAdmin
              captures: { bl3: $.data.id }
          trigger:
            - call: "POST /archive/budget-lines"
              payload: { grant_id: "${grant2}", category: "BANDWIDTH", budget_reservation_cents: 20000 }
              as: FinanceAdmin
              captures: { bl4: $.data.id }
            - call: "GET /archive/funding-grants/${grant2}"
              payload: {}
              as: FinanceAdmin
              captures: { gv2: $.data.version }
            - call: "POST /archive/budget-lines/${bl4}/release"
              payload: { expected_grant_version: "${gv2}" }
              as: FinanceAdmin
          assert:
            - "after BL4 creation: FundingGrant.${grant2}.status == EXHAUSTED (30000 + 20000 == 50000)"
            - "after releasing BL4: FundingGrant.${grant2}.status == OPEN again and reserved_cents == 30000 (cycle closed)"
            - "BudgetLine.${bl4}.status == RELEASED and contributes 0 to utilization"
            - "FundingGrant.${grant2}.version advanced on every write (create BL3, create BL4, release BL4)"
      - name: rights_request_branching_review_hold_dismiss_fork
        grounds:
          - state_machines.RightsRequest.UNDER_REVIEW_to_LEGAL_HOLD
          - state_machines.RightsRequest.LEGAL_HOLD_to_DISMISSED
          - state_machines.RightsRequest.UNDER_REVIEW_to_DISMISSED
        distinguishing_aspect: |
          RightsRequest has a branching fork (UNDER_REVIEW -> {LEGAL_HOLD,
          DISMISSED, UPHELD_REMOVED} and LEGAL_HOLD -> {DISMISSED,
          UPHELD_REMOVED}) whose branch choice determines whether the
          hard-withdrawal cascade fires before the final dismissal recovers
          availability — divergent side-effect sets per branch on the rights
          entity (different entity from FundingGrant).
        test_recipe:
          setup:
            - "Work W2 AVAILABLE with one LENDABLE item I2; patron P2 with ACTIVE loan LN2 on I2."
            - "RightsRequest R2 on W2 filed by legal-a, begun by legal-b (UNDER_REVIEW, W2 EMBARGOED)."
          setup_api_calls:
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: Admin
            - call: "POST /archive/partner-libraries"
              payload: { library_code: "LIB-B", display_name: "Library B", storage_commitment_years: 5 }
              as: LibraryAdmin
              captures: { lib2: $.data.id }
            - call: "POST /archive/works"
              payload: { title: "Contested Memoirs", author: "B. Author", publication_year: 2005 }
              as: Admin
              captures: { work2: $.data.id }
            - call: "POST /archive/scan-batches"
              payload: { operator_code: "op-2" }
              as: ScanOperator
              captures: { batch2: $.data.id }
            - call: "POST /archive/items"
              payload: { batch_id: "${batch2}", work_id: "${work2}", owning_library_id: "${lib2}", page_count: 210, condition_grade: "FINE" }
              as: ScanOperator
              captures: { item2: $.data.id }
            - call: "POST /archive/scan-batches/${batch2}/seal"
              payload: {}
              as: ScanOperator
            - call: "POST /archive/patrons"
              payload: { email: "p2@example.org", full_name: "Patron Two" }
              as: Anonymous
              captures: { pat2: $.data.id }
            - call: "POST /archive/loans"
              payload: { item_id: "${item2}", patron_id: "${pat2}", loan_kind: "STANDARD" }
              as: Patron
              as_user_id: "${pat2}"
              captures: { loan2: $.data.id }
            - call: "POST /archive/rights-requests"
              payload: { subject_kind: "WORK", work_id: "${work2}", claimant_name: "Heirs of Author" }
              as: LegalReviewer
              as_user_id: "legal-a"
              captures: { rr2: $.data.id }
            - call: "POST /archive/rights-requests/${rr2}/begin-review"
              payload: {}
              as: LegalReviewer
              as_user_id: "legal-b"
          trigger:
            - call: "POST /archive/rights-requests/${rr2}/escalate-hold"
              payload: {}
              as: LegalReviewer
              as_user_id: "legal-b"
            - call: "POST /archive/rights-requests/${rr2}/decide"
              payload: { decision: "DISMISS" }
              as: LegalReviewer
              as_user_id: "legal-c"
          assert:
            - "the LEGAL_HOLD branch fired the revocation cascade: Loan.${loan2}.status == REVOKED even though the request is ultimately DISMISSED"
            - "after dismissal: Work.${work2}.availability == AVAILABLE (no remaining blocking requests) while the revoked loan stays REVOKED (branch side effects are not undone)"
            - "RightsRequest.${rr2}.decided_by == \"legal-c\" and reviewed_by == \"legal-b\""
            - "Patron.${pat2}.active_loan_count == 0"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: sweep_expiry_to_patron_suspension_cascade
        grounds:
          - state_machines.Loan.ACTIVE_to_EXPIRED
          - state_machines.Patron.ACTIVE_to_SUSPENDED
          - calculations.waitlist_promotion
          - endpoints.POST_/archive/_sweeps/run
        distinguishing_aspect: |
          Depth-4 cascade triggered by the sweep transition: loan expiry (1)
          mutates the patron's strike_count (2); the strike increment itself
          flips patron.status to SUSPENDED (3); the suspension itself cancels
          that patron's OFFERED waitlist entries (4). Each link is caused by
          the previous link, not by the sweep directly.
        test_recipe:
          setup:
            - "Clock starts 2026-09-01T00:00:00Z; work W3 with two LENDABLE items I3a/I3b; patrons P3 (borrower) and P4 (waitlisted)."
            - "P3 already has strike_count == 2 from two earlier expired loans (setup: two checkout + sweep cycles on I3a)."
            - "P3 holds ACTIVE STANDARD loan LN3 on I3a due at 2026-09-15T00:00:00Z."
            - "P4's waitlist entry E4 on W3 is OFFERED (I3b was returned earlier and promoted E4); P4's entry awaits claim."
            - "Wait: P4's OFFERED entry is actually held by P3 — set entry E3o belonging to P3 in OFFERED on work W3 after the second expiry promoted it."
          setup_api_calls:
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Admin
            - call: "POST /archive/partner-libraries"
              payload: { library_code: "LIB-C", display_name: "Library C", storage_commitment_years: 7 }
              as: LibraryAdmin
              captures: { lib3: $.data.id }
            - call: "POST /archive/works"
              payload: { title: "Cascade Studies", author: "C. Chain", publication_year: 2010 }
              as: Admin
              captures: { work3: $.data.id }
            - call: "POST /archive/scan-batches"
              payload: { operator_code: "op-3" }
              as: ScanOperator
              captures: { batch3: $.data.id }
            - call: "POST /archive/items"
              payload: { batch_id: "${batch3}", work_id: "${work3}", owning_library_id: "${lib3}", page_count: 150, condition_grade: "FAIR" }
              as: ScanOperator
              captures: { item3a: $.data.id }
            - call: "POST /archive/items"
              payload: { batch_id: "${batch3}", work_id: "${work3}", owning_library_id: "${lib3}", page_count: 150, condition_grade: "FAIR" }
              as: ScanOperator
              captures: { item3b: $.data.id }
            - call: "POST /archive/scan-batches/${batch3}/seal"
              payload: {}
              as: ScanOperator
            - call: "POST /archive/patrons"
              payload: { email: "p3@example.org", full_name: "Patron Three" }
              as: Anonymous
              captures: { pat3: $.data.id }
            - call: "POST /archive/patrons"
              payload: { email: "p4@example.org", full_name: "Patron Four" }
              as: Anonymous
              captures: { pat4: $.data.id }
            - call: "POST /archive/loans"
              payload: { item_id: "${item3a}", patron_id: "${pat3}", loan_kind: "STANDARD" }
              as: Patron
              as_user_id: "${pat3}"
              captures: { loanA: $.data.id }
            - call: "POST /archive/loans"
              payload: { item_id: "${item3b}", patron_id: "${pat3}", loan_kind: "STANDARD" }
              as: Patron
              as_user_id: "${pat3}"
              captures: { loanB: $.data.id }
            - call: "POST /archive/waitlist-entries"
              payload: { work_id: "${work3}", patron_id: "${pat3}" }
              as: Patron
              as_user_id: "${pat3}"
              captures: { entry3: $.data.id }
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: Admin
            - call: "POST /archive/_sweeps/run"
              payload: {}
              as: Admin
            - call: "POST /archive/loans"
              payload: { item_id: "${item3a}", patron_id: "${pat3}", loan_kind: "STANDARD" }
              as: Patron
              as_user_id: "${pat3}"
              captures: { loan3: $.data.id }
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: Admin
          trigger:
            - call: "POST /archive/_sweeps/run"
              payload: {}
              as: Admin
          assert:
            - "Loan.${loan3}.status == EXPIRED and ScanItem.${item3a}.status == LENDABLE (hop 1)"
            - "Patron.${pat3}.strike_count == 3 and Patron.${pat3}.status == SUSPENDED (hops 2-3 caused by the strike increment, not the sweep directly)"
            - "WaitlistEntry.${entry3}.status == CANCELLED (hop 4: suspension cancels the patron's OFFERED entry that the first sweep's promotion created)"
            - "WaitlistEntry.${entry3}.offered_at is not null (it was OFFERED before the suspension cascade cancelled it)"
      - name: rights_hold_to_loan_revocation_cascade
        grounds:
          - state_machines.RightsRequest.UNDER_REVIEW_to_LEGAL_HOLD
          - state_machines.Loan.ACTIVE_to_REVOKED
          - state_machines.ScanItem.ON_LOAN_to_LENDABLE
          - calculations.waitlist_promotion
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (escalate-hold, not the
          sweep): the hold flips work.availability (1); the availability flip
          revokes each ACTIVE loan on the work's items (2); each loan
