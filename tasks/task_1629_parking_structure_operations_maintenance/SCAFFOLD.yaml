    source: computed
    description: deposit_cents - cancellation_fee_cents at cancel; null until CANCELLED
    default: null
state_machines:
- entity: Facility
  field: posture
  initial_state: NORMAL
  terminal_states:
  - DECOMMISSIONED
  transitions:
  - from: NORMAL
    to: EVENT_SURGE
    trigger: system (POST /ops/event-bookings/{id}/activate side effect)
    actor: system
    preconditions:
    - An EventBooking of this facility transitions CONFIRMED -> ACTIVE
    side_effects:
    - Every AccessDevice of this facility with device_status ONLINE flips device_mode STANDARD -> EVENT (cascade link 2)
  - from: EVENT_SURGE
    to: NORMAL
    trigger: system (POST /ops/event-bookings/{id}/complete side effect)
    actor: system
    preconditions:
    - The completing event leaves zero other EventBooking rows of this facility in ACTIVE
    side_effects:
    - Every AccessDevice of this facility with device_mode EVENT flips device_mode EVENT -> STANDARD
  - from: NORMAL
    to: RESTRICTED
    trigger: 'system (CRITICAL inspection report), system (close-of-business: >= 1 CRITICAL incident OPEN/INVESTIGATING), or POST /ops/facilities/{id}/transition-posture'
    actor: system or FacilityManager
    preconditions: []
    side_effects: []
  - from: RESTRICTED
    to: NORMAL
    trigger: POST /ops/facilities/{id}/transition-posture
    actor: FacilityManager
    preconditions:
    - No StructuralInspection of this facility with inspection_status REPORTED and condition_class CRITICAL (else ERR_STRUCTURAL_CRITICAL)
    - No IncidentReport of this facility with severity CRITICAL and incident_status IN {OPEN, INVESTIGATING} (else ERR_POSTURE_TRANSITION_BLOCKED)
    side_effects: []
  - from:
    - NORMAL
    - RESTRICTED
    to: CLOSED_TEMPORARY
    trigger: POST /ops/facilities/{id}/transition-posture
    actor: FacilityManager
    preconditions: []
    side_effects: []
  - from: CLOSED_TEMPORARY
    to: NORMAL
    trigger: POST /ops/facilities/{id}/transition-posture
    actor: FacilityManager
    preconditions:
    - No StructuralInspection of this facility with inspection_status REPORTED and condition_class CRITICAL (else ERR_STRUCTURAL_CRITICAL)
    - No IncidentReport of this facility with severity CRITICAL and incident_status IN {OPEN, INVESTIGATING} (else ERR_POSTURE_TRANSITION_BLOCKED)
    side_effects: []
  - from:
    - NORMAL
    - RESTRICTED
    - CLOSED_TEMPORARY
    to: DECOMMISSIONED
    trigger: POST /ops/facilities/{id}/transition-posture
    actor: FacilityManager
    preconditions:
    - No ParkingSession with occupancy_state PARKED
    - No MonthlyAgreement with agreement_status IN {APPROVED, ACTIVE, SUSPENDED}
    - No RepairProject with project_status IN {PROPOSED, FUNDED, SCHEDULED, IN_PROGRESS, DEFERRED}
    - No EventBooking with booking_status IN {CONFIRMED, ACTIVE}
    - Violations -> ERR_POSTURE_TRANSITION_BLOCKED
    side_effects: []
- entity: RateSchedule
  field: schedule_status
  initial_state: DRAFT
  terminal_states:
  - SUPERSEDED
  - RETIRED
  transitions:
  - from: DRAFT
    to: PUBLISHED
    trigger: POST /ops/rate-schedules/{id}/publish
    actor: FacilityManager
    preconditions:
    - expected_facility_version matches Facility.version (OCC, else ERR_STALE_FACILITY_VERSION)
    side_effects:
    - Any other RateSchedule of the same facility in PUBLISHED flips PUBLISHED -> SUPERSEDED
    - published_at set to logical now
    - increments Facility.version by 1
  - from: PUBLISHED
    to: SUPERSEDED
    trigger: system (another schedule of the same facility publishes)
    actor: system
    preconditions: []
    side_effects: []
  - from:
    - DRAFT
    - PUBLISHED
    to: RETIRED
    trigger: POST /ops/rate-schedules/{id}/retire
    actor: FacilityManager
    preconditions: []
    side_effects: []
- entity: AccessDevice
  field: device_status
  initial_state: OFFLINE
  terminal_states:
  - DECOMMISSIONED
  transitions:
  - from:
    - OFFLINE
    - DEGRADED
    to: ONLINE
    trigger: POST /ops/access-devices/{id}/heartbeat
    actor: GateDevice
    preconditions:
    - X-User-ID equals this device's id (else ERR_DEVICE_IDENTITY_MISMATCH)
    side_effects:
    - last_heartbeat_at set to logical now
  - from: ONLINE
    to: DEGRADED
    trigger: POST /ops/access-devices/{id}/report-fault
    actor: GateDevice or FacilityManager
    preconditions: []
    side_effects: []
  - from:
    - ONLINE
    - DEGRADED
    to: OFFLINE
    trigger: 'system (close-of-business: last_heartbeat_at is null or older than 24h before run time)'
    actor: system
    preconditions: []
    side_effects: []
  - from:
    - OFFLINE
    - ONLINE
    - DEGRADED
    to: DECOMMISSIONED
    trigger: POST /ops/access-devices/{id}/decommission
    actor: FacilityManager
    preconditions: []
    side_effects:
    - device_mode forced to STANDARD
- entity: MonthlyAgreement
  field: agreement_status
  initial_state: SUBMITTED
  terminal_states:
  - TERMINATED
  - WITHDRAWN
  transitions:
  - from: SUBMITTED
    to: APPROVED
    trigger: system (evaluated synchronously at POST /ops/monthly-agreements creation; result visible in the 201 response at version 1)
    actor: system
    preconditions:
    - count(agreements of this facility with agreement_status IN {ACTIVE, SUSPENDED}) < facility.monthly_capacity
    side_effects: []
  - from: SUBMITTED
    to: WAITLISTED
    trigger: system (evaluated synchronously at creation when the APPROVED precondition fails)
    actor: system
    preconditions: []
    side_effects: []
  - from: WAITLISTED
    to: APPROVED
    trigger: system (close-of-business waitlist promotion per waitlist_promotion calculation)
    actor: system
    preconditions:
    - count(agreements IN {ACTIVE, SUSPENDED, APPROVED}) < facility.monthly_capacity
    side_effects: []
  - from: APPROVED
    to: WAITLISTED
    trigger: 'system (CRITICAL inspection demotion cascade: newest APPROVED by application_seq DESC demoted while APPROVED+ACTIVE+SUSPENDED exceed effective capacity)'
    actor: system
    preconditions: []
    side_effects:
    - Every Credential of this agreement with credential_status ACTIVE flips ACTIVE -> REVOKED and Facility.deposit_liability_cents decreases by that credential's deposit_cents (cascade link 3)
  - from: APPROVED
    to: ACTIVE
    trigger: POST /ops/monthly-agreements/{id}/activate
    actor: ParkingAttendant or FacilityManager
    preconditions:
    - Facility.posture NOT IN {CLOSED_TEMPORARY, DECOMMISSIONED} (else ERR_FACILITY_POSTURE_BLOCKS)
    - count(agreements IN {ACTIVE, SUSPENDED}) < facility.monthly_capacity (else ERR_MONTHLY_POOL_EXHAUSTED)
    side_effects:
    - activated_at set to logical now
    - first_invoice_cents computed per monthly_proration
  - from: ACTIVE
    to: SUSPENDED
    trigger: POST /ops/monthly-agreements/{id}/suspend
    actor: FacilityManager
    preconditions: []
    side_effects:
    - Credentials of this agreement in ACTIVE flip ACTIVE -> LOST_REPORTED is NOT applied; credentials remain ACTIVE but entry with them is blocked while SUSPENDED (see entry preconditions)
  - from: SUSPENDED
    to: ACTIVE
    trigger: POST /ops/monthly-agreements/{id}/resume
    actor: FacilityManager
    preconditions: []
    side_effects: []
  - from:
    - APPROVED
    - ACTIVE
    - SUSPENDED
    to: TERMINATED
    trigger: POST /ops/monthly-agreements/{id}/terminate
    actor: FacilityManager or ParkingAttendant
    preconditions:
    - No Credential of this agreement with credential_status IN {ACTIVE, LOST_REPORTED} (else ERR_CREDENTIALS_OUTSTANDING)
    side_effects: []
  - from: WAITLISTED
    to: WITHDRAWN
    trigger: POST /ops/monthly-agreements/{id}/withdraw
    actor: FacilityManager, ParkingAttendant, or MonthlyParker (owner)
    preconditions: []
    side_effects: []
- entity: Credential
  field: credential_status
  initial_state: ACTIVE
  terminal_states:
  - REPLACED
  - RETURNED
  - REVOKED
  transitions:
  - from: ACTIVE
    to: LOST_REPORTED
    trigger: POST /ops/credentials/{id}/report-lost
    actor: MonthlyParker (owner of the agreement's parker_account_id) or ParkingAttendant
    preconditions: []
    side_effects: []
  - from: LOST_REPORTED
    to: ACTIVE
    trigger: POST /ops/credentials/{id}/report-found
    actor: MonthlyParker (owner) or ParkingAttendant
    preconditions: []
    side_effects: []
  - from:
    - ACTIVE
    - LOST_REPORTED
    to: REPLACED
    trigger: POST /ops/credentials/{id}/replace
    actor: ParkingAttendant
    preconditions: []
    side_effects:
    - A new Credential is created for the same agreement with credential_status ACTIVE and the same deposit_cents
    - This credential's replaced_by_credential_id points at the new credential
    - Facility.deposit_liability_cents unchanged (deposit carries over; compensating pair with the new credential's creation)
  - from:
    - ACTIVE
    - LOST_REPORTED
    to: RETURNED
    trigger: POST /ops/credentials/{id}/return
    actor: ParkingAttendant
    preconditions: []
    side_effects:
    - Facility.deposit_liability_cents decreases by deposit_cents (deposit refunded)
  - from:
    - ACTIVE
    - LOST_REPORTED
    to: REVOKED
    trigger: POST /ops/credentials/{id}/revoke or system (agreement demotion cascade)
    actor: ParkingAttendant, FacilityManager, or system
    preconditions: []
    side_effects:
    - Facility.deposit_liability_cents decreases by deposit_cents (deposit forfeited)
- entity: ParkingSession
  field: occupancy_state
  initial_state: PARKED
  terminal_states:
  - EXITED
  parallel_with: billing_state
  transitions:
  - from: PARKED
    to: EXITED
    trigger: POST /ops/parking-sessions/{id}/exit
    actor: GateDevice
    preconditions:
    - billing_state IN {SETTLED, COMPED}, OR (billing_state IN {OPEN, QUOTED} AND transient_fee_calculation at logical now == 0, in which case the exit auto-settles)
    - else ERR_EXIT_UNPAID
    side_effects:
    - exit_at set to logical now
    - 'If auto-settled: billing_state OPEN/QUOTED -> SETTLED, settled_fee_cents = 0, tender_type = NONE'
    - Facility.occupied_spaces decreases by 1 (derived on read)
- entity: ParkingSession
  field: billing_state
  initial_state: OPEN
  terminal_states:
  - COMPED
  - REFUNDED
  parallel_with: occupancy_state
  transitions:
  - from: OPEN
    to: QUOTED
    trigger: POST /ops/parking-sessions/{id}/quote
    actor: GateDevice or ParkingAttendant
    preconditions:
    - occupancy_state == PARKED
    side_effects:
    - quoted_fee_cents = transient_fee_calculation at logical now
  - from: QUOTED
    to: QUOTED
    trigger: POST /ops/parking-sessions/{id}/quote (re-quote refreshes at logical now)
    actor: GateDevice or ParkingAttendant
    preconditions:
    - occupancy_state == PARKED
    side_effects:
    - quoted_fee_cents recomputed
  - from:
    - OPEN
    - QUOTED
    to: SETTLED
    trigger: POST /ops/parking-sessions/{id}/pay
    actor: ParkingAttendant
    preconditions:
    - occupancy_state == PARKED
    - tender_type CASH requires shift_id of an OPEN AttendantShift at this facility whose attendant_user_id == X-User-ID (else ERR_SHIFT_NOT_OPEN)
    side_effects:
    - settled_fee_cents = transient_fee_calculation at logical now (chronological settlement, not the quote)
    - tender_type set; paid_in_shift_id set when CASH
    - Facility.cumulative_collected_cents increases by settled_fee_cents
    - 'CASH: the shift''s expected_cash_cents derivation gains +settled_fee_cents'
  - from:
    - OPEN
    - QUOTED
    to: COMPED
    trigger: POST /ops/parking-sessions/{id}/comp
    actor: ParkingAttendant
    preconditions:
    - occupancy_state == PARKED
    - shift_id names an OPEN shift at this facility owned by X-User-ID (else ERR_SHIFT_NOT_OPEN)
    - shift.comp_total_cents + current fee <= COMP_CAP_PER_SHIFT_CENTS (else ERR_COMP_LIMIT_EXCEEDED)
    side_effects:
    - settled_fee_cents = 0; tender_type = NONE
    - shift.comp_total_cents increases by the waived fee value
  - from: SETTLED
    to: REFUNDED
    trigger: POST /ops/parking-sessions/{id}/refund
    actor: RevenueAuditor
    preconditions:
    - amount_cents <= settled_fee_cents (else ERR_REFUND_EXCEEDS_COLLECTED)
    side_effects:
    - refunded_cents = amount_cents; refunded_at set
    - Facility.cumulative_collected_cents decreases by amount_cents (compensating pair with settle)
    - 'If tender_type CASH and paid_in_shift''s shift_status != RECONCILED: that shift''s expected_cash_cents derivation loses amount_cents'
- entity: AttendantShift
  field: shift_status
  initial_state: OPEN
  terminal_states:
  - RECONCILED
  transitions:
  - from: OPEN
    to: CLOSED
    trigger: POST /ops/shifts/{id}/close
    actor: ParkingAttendant
    preconditions:
    - shift.attendant_user_id == X-User-ID (else ERR_NOT_OWNER)
    side_effects:
    - closed_at set; expected_cash_cents computed per shift_expected_cash
  - from: OPEN
    to: FORCE_CLOSED
    trigger: system (close-of-business sweeps shifts still OPEN)
    actor: system
    preconditions: []
    side_effects:
    - closed_at set; counted_cash_cents remains null; expected_cash_cents computed
  - from:
    - CLOSED
    - FORCE_CLOSED
    to: RECONCILED
    trigger: system (its ReconciliationRecord transitions to APPROVED)
    actor: system
    preconditions: []
    side_effects: []
- entity: ReconciliationRecord
  field: reconciliation_status
  initial_state: DRAFT
  terminal_states:
  - APPROVED
  transitions:
  - from: DRAFT
    to: SUBMITTED
    trigger: POST /ops/reconciliations/{id}/submit
    actor: RevenueAuditor
    preconditions:
    - X-User-ID != shift.attendant_user_id (segregation of duties, else ERR_SEGREGATION_OF_DUTIES)
    - shift.counted_cash_cents is not null (else ERR_VALIDATION)
    - 'variance does NOT breach thresholds: variance_cents > -SHORTAGE_REVIEW_CENTS AND variance_cents < OVERAGE_REVIEW_CENTS'
    side_effects:
    - auditor_user_id set from X-User-ID; variance_cents computed
  - from: DRAFT
    to: VARIANCE_REVIEW
    trigger: system (submit when variance breaches thresholds)
    actor: system
    preconditions:
    - variance_cents <= -SHORTAGE_REVIEW_CENTS OR variance_cents >= OVERAGE_REVIEW_CENTS
    side_effects:
    - auditor_user_id set from X-User-ID; variance_cents computed
    - Auto-creates IncidentReport (incident_type CASH_VARIANCE, reconciliation_id = this record, auto_created = true, severity HIGH when ABS(variance) >= VARIANCE_HIGH_CENTS else MEDIUM) in OPEN
  - from: SUBMITTED
    to: APPROVED
    trigger: POST /ops/reconciliations/{id}/approve
    actor: RevenueAuditor
    preconditions:
    - X-User-ID != shift.attendant_user_id (else ERR_SEGREGATION_OF_DUTIES)
    side_effects:
    - shift transitions CLOSED/FORCE_CLOSED -> RECONCILED
  - from: VARIANCE_REVIEW
    to: APPROVED
    trigger: POST /ops/reconciliations/{id}/approve with incident_id
    actor: RevenueAuditor
    preconditions:
    - X-User-ID != shift.attendant_user_id (else ERR_SEGREGATION_OF_DUTIES)
    - incident_id required and must name an IncidentReport with reconciliation_id == this record, incident_type CASH_VARIANCE, incident_status INVESTIGATING (else ERR_VARIANCE_INCIDENT_REQUIRED)
    side_effects:
    - The linked incident transitions INVESTIGATING -> RESOLVED
    - shift transitions CLOSED/FORCE_CLOSED -> RECONCILED
- entity: StructuralInspection
  field: inspection_status
  initial_state: SCHEDULED
  terminal_states:
  - REPORTED
  - CANCELLED
  transitions:
  - from: SCHEDULED
    to: IN_FIELD
    trigger: POST /ops/inspections/{id}/start
    actor: MaintenanceSupervisor
    preconditions: []
    side_effects: []
  - from: IN_FIELD
    to: REPORTED
    trigger: POST /ops/inspections/{id}/report
    actor: MaintenanceSupervisor
    preconditions:
    - load_bearing_rating, waterproofing_rating, surface_rating all in 1..5 (else ERR_VALIDATION)
    side_effects:
    - condition_index and condition_class computed per structural_condition_index
    - 'If condition_class == CRITICAL (cascade link 1): Facility.posture -> RESTRICTED and Facility.closed_spaces increases by closed_space_count, Facility.version +1'
    - 'Cascade link 2 (caused by link 1): while count(APPROVED)+count(ACTIVE,SUSPENDED) > min(monthly_capacity, total_spaces - closed_spaces), the newest APPROVED agreement by application_seq DESC flips
      APPROVED -> WAITLISTED'
    - 'Cascade link 3 (caused by link 2, per agreement demoted): its ACTIVE credentials flip ACTIVE -> REVOKED and deposit liability is refunded'
  - from:
    - SCHEDULED
    - IN_FIELD
    to: CANCELLED
    trigger: POST /ops/inspections/{id}/cancel
    actor: MaintenanceSupervisor
    preconditions: []
    side_effects: []
- entity: RepairProject
  field: project_status
  initial_state: PROPOSED
  terminal_states:
  - CLOSED_OUT
  - CANCELLED
  transitions:
  - from: PROPOSED
    to: FUNDED
    trigger: POST /ops/repair-projects/{id}/fund
    actor: FacilityManager
    preconditions:
    - If inspection_id is set, that inspection's inspection_status == REPORTED (else ERR_INSPECTION_NOT_REPORTED)
    - amount_cents <= Facility.capital_reserve_cents (else ERR_INSUFFICIENT_RESERVE)
    side_effects:
    - funded_amount_cents = amount_cents
    - Facility.capital_reserve_cents decreases by amount_cents (reserve draw)
  - from: FUNDED
    to: SCHEDULED
    trigger: POST /ops/repair-projects/{id}/schedule
    actor: MaintenanceSupervisor
    preconditions:
    - end_at > start_at (else ERR_INVALID_TIME_RANGE)
    side_effects:
    - scheduled_start_at / scheduled_end_at set
  - from: SCHEDULED
    to: IN_PROGRESS
    trigger: POST /ops/repair-projects/{id}/start
    actor: MaintenanceSupervisor
    preconditions: []
    side_effects:
    - Facility.closed_spaces increases by closed_space_count, Facility.version +1
  - from: IN_PROGRESS
    to: CLOSED_OUT
    trigger: POST /ops/repair-projects/{id}/close-out
    actor: MaintenanceSupervisor
    preconditions: []
    side_effects:
    - Facility.closed_spaces decreases by closed_space_count (compensating pair with start), Facility.version +1
  - from: PROPOSED
    to: DEFERRED
    trigger: POST /ops/repair-projects/{id}/defer
    actor: FacilityManager
    preconditions: []
    side_effects: []
  - from: DEFERRED
    to: PROPOSED
    trigger: POST /ops/repair-projects/{id}/revise (revision loop)
    actor: MaintenanceSupervisor
    preconditions: []
    side_effects:
    - revision_count increases by 1
  - from:
    - PROPOSED
    - FUNDED
    - DEFERRED
    to: CANCELLED
    trigger: POST /ops/repair-projects/{id}/cancel
    actor: FacilityManager
    preconditions: []
    side_effects:
    - 'If FUNDED: Facility.capital_reserve_cents increases by funded_amount_cents (draw refunded)'
- entity: MaintenanceWindow
  field: window_status
  initial_state: SCHEDULED
  terminal_states:
  - COMPLETED
  - MISSED
  - CANCELLED
  transitions:
  - from: SCHEDULED
    to: IN_PROGRESS
    trigger: POST /ops/maintenance-windows/{id}/start
    actor: MaintenanceSupervisor
    preconditions: []
    side_effects: []
  - from: IN_PROGRESS
    to: COMPLETED
    trigger: POST /ops/maintenance-windows/{id}/complete
    actor: MaintenanceSupervisor
    preconditions: []
    side_effects: []
  - from:
    - SCHEDULED
    - IN_PROGRESS
    to: MISSED
    trigger: 'system (close-of-business: end_at is strictly before the run''s logical timestamp)'
    actor: system
    preconditions: []
    side_effects: []
  - from: SCHEDULED
    to: CANCELLED
    trigger: POST /ops/maintenance-windows/{id}/cancel
    actor: MaintenanceSupervisor
    preconditions: []
    side_effects: []
- entity: PatrolRound
  field: patrol_status
  initial_state: SCHEDULED
  terminal_states:
  - COMPLETED
  - MISSED
  transitions:
  - from: SCHEDULED
    to: COMPLETED
    trigger: POST /ops/patrol-rounds/{id}/complete
    actor: SecurityOfficer
    preconditions: []
    side_effects:
    - completed_at set to logical now
  - from: SCHEDULED
    to: MISSED
    trigger: 'system (close-of-business: scheduled_start is strictly before the run''s logical timestamp and the round was never completed)'
    actor: system
    preconditions: []
    side_effects: []
- entity: IncidentReport
  field: incident_status
  initial_state: OPEN
  terminal_states:
  - CLOSED
  transitions:
  - from: OPEN
    to: INVESTIGATING
    trigger: POST /ops/incidents/{id}/investigate
    actor: SecurityOfficer or RevenueAuditor
    preconditions: []
    side_effects: []
  - from: INVESTIGATING
    to: RESOLVED
    trigger: POST /ops/incidents/{id}/resolve or system (variance reconciliation approved with this incident linked)
    actor: SecurityOfficer, RevenueAuditor, or system
    preconditions: []
    side_effects: []
  - from:
    - OPEN
    - RESOLVED
    to: CLOSED
    trigger: POST /ops/incidents/{id}/close
    actor: SecurityOfficer, RevenueAuditor, or FacilityManager
    preconditions: []
    side_effects: []
  - from:
    - OPEN
    - INVESTIGATING
    to: CLOSED
    trigger: POST /ops/incidents/{id}/mark-duplicate
    actor: SecurityOfficer
    preconditions:
    - duplicate_of_incident_id names a different IncidentReport of the same facility with incident_status != CLOSED (else ERR_REFERENCE_NOT_FOUND)
    side_effects:
    - duplicate_of_incident_id recorded
- entity: EVCharger
  field: charger_status
  initial_state: PROPOSED
  terminal_states:
  - DECOMMISSIONED
  transitions:
  - from: PROPOSED
    to: PERMITTED
    trigger: POST /ops/ev-chargers/{id}/permit
    actor: MaintenanceSupervisor
    preconditions: []
    side_effects: []
  - from: PERMITTED
    to: INSTALLED
    trigger: POST /ops/ev-chargers/{id}/install
    actor: MaintenanceSupervisor
    preconditions: []
    side_effects: []
  - from: INSTALLED
    to: COMMISSIONED
    trigger: POST /ops/ev-chargers/{id}/commission
    actor: MaintenanceSupervisor
    preconditions: []
    side_effects:
    - commissioned_at set to logical now (first commissioning only)
  - from: COMMISSIONED
    to: OUT_OF_SERVICE
    trigger: POST /ops/ev-chargers/{id}/take-out-of-service or system (a ChargingSession faults)
    actor: MaintenanceSupervisor or system
    preconditions: []
    side_effects: []
  - from: OUT_OF_SERVICE
    to: COMMISSIONED
    trigger: POST /ops/ev-chargers/{id}/return-to-service (cyclic)
    actor: MaintenanceSupervisor
    preconditions: []
    side_effects: []
  - from:
    - PROPOSED
    - PERMITTED
    - INSTALLED
    - OUT_OF_SERVICE
    to: DECOMMISSIONED
    trigger: POST /ops/ev-chargers/{id}/decommission
    actor: MaintenanceSupervisor
    preconditions: []
    side_effects: []
- entity: ChargingSession
  field: session_status
  initial_state: CHARGING
  terminal_states:
  - COMPLETED
  - FAULTED
  transitions:
  - from: CHARGING
    to: COMPLETED
    trigger: POST /ops/charging-sessions/{id}/complete
    actor: MonthlyParker, ParkingAttendant, or MaintenanceSupervisor
    preconditions: []
    side_effects:
    - ended_at set to logical now
  - from: CHARGING
    to: FAULTED
    trigger: POST /ops/charging-sessions/{id}/fault
    actor: ParkingAttendant or MaintenanceSupervisor
    preconditions: []
    side_effects:
    - ended_at set to logical now
    - charger transitions COMMISSIONED -> OUT_OF_SERVICE
- entity: EventBooking
  field: booking_status
  initial_state: REQUESTED
  terminal_states:
  - COMPLETED
  - CANCELLED
  transitions:
  - from: REQUESTED
    to: CONFIRMED
    trigger: POST /ops/event-bookings/{id}/confirm
    actor: FacilityManager
    preconditions:
    - len(staffing_assignments) >= min_staff (else ERR_STAFFING_INSUFFICIENT)
    - event_pool_allocation check per event_pool_allocation calculation (else ERR_EVENT_POOL_EXCEEDED)
    side_effects:
    - staffing_assignments recorded
  - from: CONFIRMED
    to: ACTIVE
    trigger: POST /ops/event-bookings/{id}/activate
    actor: FacilityManager
    preconditions:
    - logical now >= start_at AND logical now < end_at (else ERR_INVALID_TIME_RANGE)
    side_effects:
    - 'If Facility.posture == NORMAL: posture -> EVENT_SURGE, Facility.version +1 (cascade link 1)'
    - 'Cascade link 2 (caused by link 1): all ONLINE AccessDevices of the facility flip device_mode -> EVENT'
  - from: ACTIVE
    to: COMPLETED
    trigger: POST /ops/event-bookings/{id}/complete
    actor: FacilityManager
    preconditions: []
    side_effects:
    - 'If no other ACTIVE EventBooking of this facility and posture == EVENT_SURGE: posture -> NORMAL, devices flip device_mode -> STANDARD (conditional cascade reversal)'
  - from:
    - REQUESTED
    - CONFIRMED
    to: CANCELLED
    trigger: POST /ops/event-bookings/{id}/cancel
    actor: FacilityManager
    preconditions: []
    side_effects:
    - cancellation_fee_cents and deposit_refund_cents computed per event_cancellation_fee (0 when cancelled from REQUESTED)
concurrency_rules:
- rule_id: rate-publish-stale-facility
  parent_entity: Facility
  write_endpoint: POST /ops/rate-schedules/{rate_schedule_id}/publish
  occ_field: expected_facility_version
  description: 'Publishing a RateSchedule supersedes the facility''s currently PUBLISHED

    schedule, so the publish is only legitimate against the Facility version

    the client last observed. A publish carrying an expected_facility_version

    behind the facility''s current version is rejected: another publish (or

    posture/cascade write) has advanced the facility since the client''s read.

    '
  error_id: ERR_STALE_FACILITY_VERSION
  http_status: 412
- rule_id: agreement-amend-stale-version
  parent_entity: MonthlyAgreement
  write_endpoint: POST /ops/monthly-agreements/{monthly_agreement_id}/amend
  occ_field: expected_agreement_version
  description: 'Amending a MonthlyAgreement is legitimate against the agreement version

    the client last observed. An amend carrying an expected_agreement_version

    behind the agreement''s current version is rejected: a prior amend or a

    lifecycle transition has advanced the agreement since the client''s read.

    '
  error_id: ERR_STALE_AGREEMENT_VERSION
  http_status: 412
calculations:
- name: transient_fee_calculation
  trigger: POST quote (provisional at logical now), POST pay (chronological settlement at logical now), POST exit auto-settle check, POST lost-ticket re-rating
  algorithm: tiered_pricing
  formula: "Inputs: session.entry_at, as_of (logical now), the pinned RateSchedule R,\n        session.fee_mode, session.credential_id.\n1. fee_mode MONTHLY (credential presented): fee = 0.\n2. fee_mode\
    \ EVENT_FLAT: fee = R.event_flat_cents (duration-independent).\n3. fee_mode LOST_TICKET: fee = R.lost_ticket_daily_cents *\n   count_distinct_calendar_dates_touched(entry_at, as_of); minimum 1 date.\n\
    4. fee_mode STANDARD:\n   elapsed_min = floor((as_of - entry_at) / 60 seconds)\n   if elapsed_min <= R.grace_minutes: fee = 0  (boundary: == stays free)\n   else bill from minute 0 (grace is NOT subtracted):\n\
    \     cap_mode CALENDAR_DAY: split [entry_at, as_of) at each local midnight into\n       per-date segments; per segment: hours = ceil(segment_min / 60);\n       segment_fee = min(R.first_hour_cents\
    \ + max(0, hours-1) * R.additional_hour_cents,\n                         R.daily_max_cents); fee = sum(segment_fee over segments).\n     cap_mode ROLLING_24H: split [entry_at, as_of) into consecutive\
    \ 24h windows\n       anchored at entry_at; per window same formula; fee = sum over windows.\nPartial hours always round UP via ceil per segment/window. All outputs integer cents.\n"
  input_set: ParkingSession rows with occupancy_state PARKED; the RateSchedule pinned at entry is used even if later SUPERSEDED (version-pinning)
  constants:
    MINUTES_PER_HOUR: 60
    SECONDS_PER_MINUTE: 60
    HOURS_PER_ROLLING_WINDOW: 24
  precision: integer cents; hours via ceil; no decimal rounding
  variants:
  - name: calendar_day_cap
    when: pinned RateSchedule.cap_mode == CALENDAR_DAY
    difference: Cap resets at each local midnight; a 22.5h stay crossing midnight bills two capped segments (2400 + 2400 = 4800 on the reference tariff)
  - name: rolling_24h_cap
    when: pinned RateSchedule.cap_mode == ROLLING_24H
    difference: Cap applies per 24h window anchored at entry; the identical 22.5h stay falls in ONE window and bills 2400
- name: monthly_proration
  trigger: POST /ops/monthly-agreements/{id}/activate
  algorithm: aggregation
  formula: 'days_in_month = length of the calendar month containing activated_at (logical clock)

    remaining_days = days_in_month - day_of_month(activated_at) + 1   (activation day inclusive)

    prorated_rent_cents      = round_half_up(monthly_rate_cents * remaining_days / days_in_month)

    prorated_ev_cents        = round_half_up(ev_surcharge_cents * remaining_days / days_in_month)

    first_invoice_cents      = prorated_rent_cents + prorated_ev_cents

    PINNED ROUNDING ORDER: each component is rounded to integer cents FIRST

    (round_half_up), then components are summed. Summing unrounded components and

    rounding once is explicitly NOT the rule (differs by cents, e.g. rate 19999 +

    EV 2999 over 18/31 days: per-component 11612 + 1741 = 13353 vs sum-then-round 13354).

    '
  input_set: the MonthlyAgreement being activated
  precision: integer cents, round_half_up per component before summation
  constants: {}
- name: monthly_pool_availability
  trigger: agreement creation auto-evaluation, activate precondition, close-of-business promotion, CRITICAL-report demotion cascade
  algorithm: threshold
  formula: "allocated  = count(MonthlyAgreement of facility with agreement_status IN {ACTIVE, SUSPENDED})\ncommitted  = allocated + count(agreement_status == APPROVED)\ncreation rule:       allocated <\
    \ monthly_capacity  -> new agreement APPROVED else WAITLISTED\nactivation rule:     allocated < monthly_capacity  -> activate allowed else ERR_MONTHLY_POOL_EXHAUSTED\npromotion rule:      while committed\
    \ < monthly_capacity and waitlist non-empty: promote per waitlist_promotion\ndemotion rule:       effective_capacity = min(monthly_capacity, total_spaces - closed_spaces);\n                     while\
    \ committed > effective_capacity: demote newest APPROVED (application_seq DESC)\nBoundary: checks use strict <; count exactly == capacity blocks further approval/activation.\n"
  input_set: MonthlyAgreement rows of one facility filtered by agreement_status as stated
  precision: integer counts; == boundary is exclusionary
  constants: {}
- name: waitlist_promotion
  trigger: close-of-business run
  algorithm: chronological
  formula: 'Candidate set: agreements of this facility with agreement_status == WAITLISTED.

    Ranking: created_at ASC; exact created_at ties broken by application_seq ASC

    (per-facility monotonic; id is NEVER used).

    Loop: while count(ACTIVE)+count(SUSPENDED)+count(APPROVED) < monthly_capacity

    and candidates remain: promote the top-ranked candidate to APPROVED, re-rank.

    '
  input_set: WAITLISTED agreements of the facility at run time
  precision: order-sensitive; rank pinned above
  constants: {}
- name: shift_expected_cash
  trigger: shift close, close-of-business force-close, reconciliation submit, refund of a CASH-settled session
  algorithm: waterfall_allocation
  formula: "expected_cash_cents = opening_float_cents\n  + sum(ParkingSession.settled_fee_cents where paid_in_shift_id == shift.id\n        AND tender_type == CASH AND billing_state IN {SETTLED, REFUNDED})\n\
    \  - sum(refunded_cents over REFUNDED sessions whose paid_in_shift_id == shift.id\n        AND tender_type == CASH), applied only while shift_status != RECONCILED\n  - paid_out_cents\n  + over_ring_cents\n\
    Order: float first, then cash-in, then refunds, then paid-outs, then over-rings.\n"
  input_set: sessions tied to this shift via paid_in_shift_id with tender_type CASH
  precision: integer cents
  constants: {}
- name: variance_threshold_classification
  trigger: reconciliation submit
  algorithm: threshold
  formula: 'variance_cents = shift.counted_cash_cents - shift_expected_cash

    if variance_cents <= -SHORTAGE_REVIEW_CENTS: VARIANCE_REVIEW (boundary: exactly -2000 breaches)

    elif variance_cents >= OVERAGE_REVIEW_CENTS: VARIANCE_REVIEW (boundary: exactly +5000 breaches)

    else: SUBMITTED (auto-approvable)

    Auto-incident severity: HIGH when ABS(variance_cents) >= VARIANCE_HIGH_CENTS else MEDIUM.

    '
  input_set: the ReconciliationRecord being submitted and its shift
  precision: integer cents; thresholds are INCLUSIVE (<= / >=)
  constants:
    SHORTAGE_REVIEW_CENTS: 2000
    OVERAGE_REVIEW_CENTS: 5000
    VARIANCE_HIGH_CENTS: 10000
- name: capital_reserve_ledger
  trigger: close-of-business (levy), repair fund (draw), repair cancel from FUNDED (draw refund)
  algorithm: constraint_propagation
  formula: "PINNED EVALUATION ORDER (resolves the circular-looking dependency between\nlevy and net revenue; net_revenue is REPORTED, never fed back into levy):\n1. gross_collected_D = sum(settled_fee_cents\
    \ of sessions settled on business date D,\n       any tender) - sum(refunded_cents of refunds issued on date D)\n2. levy_D = round_half_up(max(0, gross_collected_D) * facility.levy_pct)\n3. capital_reserve_cents\
    \ += levy_D\n4. net_revenue_D = gross_collected_D - levy_D   (derived AFTER levy; levy never reads net)\nDraws: fund subtracts amount_cents; cancel from FUNDED adds funded_amount_cents back.\n"
  input_set: ParkingSession rows of the facility with settled/refund date == business date D
  precision: integer cents, round_half_up for the levy
  constants: {}
- name: ev_charger_utilization
  trigger: close-of-business run, per COMMISSIONED/OUT_OF_SERVICE charger (only chargers with commissioned_at set)
  algorithm: aggregation
  formula: "window_start = max(charger.commissioned_at, business_date_D - 28 days)\navailable_minutes = (run_time - window_start) in whole minutes\neligible sessions: ChargingSession rows of this charger\
    \ with session_status == COMPLETED\n  and ended_at within [window_start, run_time]; FAULTED sessions excluded.\nsession_pct = round_half_up(100.0 * sum(ended_at - started_at minutes) / available_minutes,\
    \ 2)\nenergy_pct  = round_half_up(100.0 * sum(kwh_delivered) / (max_kw * (available_minutes/60)), 2)\nLow-util bookkeeping: session_pct < MIN_UTIL_PCT -> low_util_run_count += 1 else reset 0;\nutilization_review_flag\
    \ = (low_util_run_count >= 2).\n"
  input_set: COMPLETED ChargingSession rows of the charger inside the rolling window
  precision: percent with 2 decimal places, round_half_up
  constants:
    WINDOW_DAYS: 28
    MIN_UTIL_PCT: 5.0
  variants:
  - name: session_time_basis
    when: always computed
    difference: measures occupied minutes over available minutes; 120 min over 40320 min = 0.30%
  - name: energy_basis
    when: always computed
    difference: measures kWh over nameplate-deliverable kWh; identical data 7.2 kWh over (7 kW * 672 h) = 0.15% — same inputs, different percent
- name: event_pool_allocation
  trigger: POST /ops/event-bookings/{id}/confirm
  algorithm: threshold
  formula: "overlap(e, other): e.start_at < other.end_at AND other.start_at < e.end_at  (strictly half-open; touching endpoints do NOT overlap)\npool_charge = e.presale_allocation + sum(other.presale_allocation\
    \ for other\n              EventBooking of the same facility with booking_status IN {CONFIRMED, ACTIVE}\n              and overlap(e, other))\nconfirm allowed iff pool_charge <= facility.event_pool_spaces\
    \   (boundary: == allowed)\n"
  input_set: CONFIRMED/ACTIVE EventBooking rows of the facility overlapping the candidate
  precision: integer spaces; <= boundary inclusive
  constants: {}
- name: structural_condition_index
  trigger: POST /ops/inspections/{id}/report
  algorithm: weighted_scoring
  formula: "condition_index = round_half_up(20 * (0.5*load_bearing_rating + 0.3*waterproofing_rating + 0.2*surface_rating))\ncondition_class = CRITICAL if load_bearing_rating <= 2 OR condition_index < 40\n\
    \                  else FAIR if condition_index < 70 else SOUND\nExample: (2,5,5) -> index 70, class CRITICAL via the load-bearing override (NOT SOUND/FAIR).\n"
  input_set: the three element ratings supplied at report
  precision: integer index, round_half_up
  constants:
    W_LOAD_BEARING: 0.5
    W_WATERPROOFING: 0.3
    W_SURFACE: 0.2
    CRITICAL_LOAD_RATING: 2
    CRITICAL_INDEX: 40
    FAIR_INDEX: 70
- name: occupancy_pressure
  trigger: derived on every Facility read/dashboard
  algorithm: aggregation
  formula: 'occupied_spaces          = count(ParkingSession of facility with occupancy_state PARKED)

    available_transient      = total_spaces - closed_spaces - occupied_spaces

    monthly_allocated        = count(MonthlyAgreement IN {ACTIVE, SUSPENDED})

    Derived on read; never mutates version.

    '
  input_set: all PARKED sessions and ACTIVE/SUSPENDED agreements of the facility
  precision: integer counts
  constants: {}
- name: event_cancellation_fee
  trigger: POST /ops/event-bookings/{id}/cancel
  algorithm: threshold
  formula: "From REQUESTED: fee = 0.\nFrom CONFIRMED, by the booking's cancellation_policy:\n  FORFEIT_DEPOSIT: fee = deposit_cents.\n  SLIDING_NOTICE: notice_hours = (start_at - logical now) in hours;\n\
    \    notice_hours < SLIDING_THRESHOLD_HOURS -> fee = deposit_cents;\n    else fee = round_half_up(deposit_cents / 2).\ndeposit_refund_cents = deposit_cents - fee.\n"
  input_set: the EventBooking being cancelled
  precision: integer cents, round_half_up
  constants:
    SLIDING_THRESHOLD_HOURS: 48
  variants:
  - name: forfeit_deposit
    when: cancellation_policy == FORFEIT_DEPOSIT
    difference: fee equals the full deposit regardless of notice; cancelling 72h early on a 10000 deposit costs 10000
  - name: sliding_notice
    when: cancellation_policy == SLIDING_NOTICE
    difference: same 72h-early cancellation costs only 5000 — identical inputs, half the fee
validations:
- priority: 1
  category: auth
  check: X-User-ID and X-User-Role headers present; X-User-Role names a declared role
  error_id: ERR_MISSING_CONTEXT_HEADER
  http_status: 400
  applies_to: all endpoints
- priority: 2
  category: auth
  check: The caller's role is listed in the endpoint's roles
  error_id: ERR_FORBIDDEN_ROLE
  http_status: 403
  applies_to: all endpoints
- priority: 3
  category: auth
  check: 'Identity bindings: GateDevice X-User-ID must equal the device id in path (heartbeat/fault) or entry_device_id in body (entry); MonthlyParker X-User-ID must equal the owning agreement''s parker_account_id
    (report-lost/found, withdraw); shift close owner must match attendant_user_id'
  error_id: ERR_DEVICE_IDENTITY_MISMATCH | ERR_NOT_OWNER
  http_status: 403
  applies_to: identity-bound endpoints
- priority: 4
  category: auth
  check: 'Segregation of duties: reconciliation submit/approve X-User-ID must differ from the shift''s attendant_user_id'
  error_id: ERR_SEGREGATION_OF_DUTIES
  http_status: 403
  applies_to: POST /ops/reconciliations, POST /ops/reconciliations/{id}/submit, POST /ops/reconciliations/{id}/approve
- priority: 5
  category: existence
  check: Path resource ids exist, validated left-to-right
  error_id: ERR_NOT_FOUND
  http_status: 404
  applies_to: all endpoints with path ids
- priority: 6
  category: existence
  check: Body reference ids exist (facility_id, shift_id, agreement_id, charger_id, credential_id, inspection_id, patrol_round_id, reconciliation_id, duplicate_of_incident_id, incident_id, supersedes_schedule_id)
  error_id: ERR_REFERENCE_NOT_FOUND
  http_status: 404
  applies_to: endpoints taking body references
- priority: 7
  category: business_constraint
  check: Required fields present; enum values in range; numeric ranges respected (ratings 1..5, amounts > 0 etc.)
  error_id: ERR_VALIDATION
  http_status: 400
  applies_to: all endpoints with a body
- priority: 8
  category: state
  check: 'OCC: expected_facility_version == Facility.version on publish; expected_agreement_version == MonthlyAgreement.version on amend'
  error_id: ERR_STALE_FACILITY_VERSION | ERR_STALE_AGREEMENT_VERSION
  http_status: 412
  applies_to: POST /ops/rate-schedules/{id}/publish, POST /ops/monthly-agreements/{id}/amend
- priority: 9
  category: state
  check: Target resource's current state permits the requested transition (covers terminal lockdown, wrong-from-state, exit on settled session, second settle, etc.)
  error_id: ERR_INVALID_STATE_TRANSITION
  http_status: 409
  applies_to: all action endpoints
- priority: 10
  category: state
  check: 'Facility posture gate: transient entry requires posture IN {NORMAL, EVENT_SURGE}; credentialed entry also allows RESTRICTED; agreement create/activate, event confirm/activate blocked from CLOSED_TEMPORARY/DECOMMISSIONED'
  error_id: ERR_FACILITY_POSTURE_BLOCKS
  http_status: 409
  applies_to: entry, agreement create/activate, event confirm/activate
- priority: 11
  category: state
  check: Manual posture transition legality (target EVENT_SURGE forbidden manually; release guards on CRITICAL inspections/incidents; decommission guards)
  error_id: ERR_POSTURE_TRANSITION_BLOCKED | ERR_STRUCTURAL_CRITICAL
  http_status: 409
  applies_to: POST /ops/facilities/{id}/transition-posture
- priority: 12
  category: state
  check: Entry gate device must be ONLINE and belong to the facility
  error_id: ERR_DEVICE_NOT_ONLINE
  http_status: 409
  applies_to: POST /ops/parking-sessions
- priority: 13
  category: state
  check: A PUBLISHED rate schedule with effective_from <= logical now must exist for the facility
  error_id: ERR_NO_PUBLISHED_RATE
  http_status: 409
  applies_to: POST /ops/parking-sessions
- priority: 14
  category: state
  check: CASH pay / comp requires shift_id naming an OPEN shift at the same facility owned by the caller
  error_id: ERR_SHIFT_NOT_OPEN
  http_status: 409
  applies_to: POST /ops/parking-sessions/{id}/pay, POST /ops/parking-sessions/{id}/comp
- priority: 15
  category: state
  check: Credentialed entry requires credential ACTIVE and its agreement ACTIVE
  error_id: ERR_CREDENTIAL_NOT_VALID
  http_status: 409
  applies_to: POST /ops/parking-sessions with credential_id
- priority: 16
  category: state
  check: Credential issuance requires agreement APPROVED or ACTIVE
  error_id: ERR_AGREEMENT_NOT_ISSUABLE
  http_status: 409
  applies_to: POST /ops/credentials
- priority: 17
  category: business_safety
  check: Window on a level whose facility has a REPORTED CRITICAL StructuralInspection with matching level_scope requires safety_authorized = true
  error_id: ERR_SAFETY_HOLD
  http_status: 409
  applies_to: POST /ops/maintenance-windows
- priority: 18
  category: business_temporal
  check: end strictly after start for windows, events, repair schedule
  error_id: ERR_INVALID_TIME_RANGE
  http_status: 400
  applies_to: POST /ops/maintenance-windows, POST /ops/event-bookings, POST /ops/repair-projects/{id}/schedule
- priority: 19
  category: business_temporal
  check: 'Window overlap with 30-minute buffer on same facility+level among SCHEDULED/IN_PROGRESS windows: conflict unless new.start >= existing.end + 30min or existing.start >= new.end + 30min'
  error_id: ERR_WINDOW_OVERLAP
  http_status: 409
  applies_to: POST /ops/maintenance-windows
- priority: 20
  category: business_temporal
  check: Event pool aggregate capacity across overlapping CONFIRMED/ACTIVE events (half-open overlap) must stay <= event_pool_spaces
  error_id: ERR_EVENT_POOL_EXCEEDED
  http_status: 409
  applies_to: POST /ops/event-bookings/{id}/confirm
- priority: 21
  category: business_temporal
  check: Event activation only within [start_at, end_at)
  error_id: ERR_INVALID_TIME_RANGE
  http_status: 400
  applies_to: POST /ops/event-bookings/{id}/activate
- priority: 22
  category: business_constraint
  check: ticket_barcode unique among PARKED sessions of the facility
  error_id: ERR_DUPLICATE_TICKET
  http_status: 409
  applies_to: POST /ops/parking-sessions
- priority: 23
  category: business_constraint
  check: At most one OPEN shift per attendant per facility
  error_id: ERR_SHIFT_ALREADY_OPEN
  http_status: 409
  applies_to: POST /ops/shifts
- priority: 24
  category: business_constraint
  check: At most 2 credentials per agreement with credential_status IN {ACTIVE, LOST_REPORTED}
  error_id: ERR_CREDENTIAL_LIMIT
  http_status: 409
  applies_to: POST /ops/credentials
- priority: 25
  category: business_constraint
  check: Charger must be COMMISSIONED with no other CHARGING session; agreement_id if present must be ACTIVE
  error_id: ERR_CHARGER_UNAVAILABLE
  http_status: 409
  applies_to: POST /ops/charging-sessions
- priority: 26
  category: business_constraint
  check: Event confirm requires len(staffing_assignments) >= min_staff
  error_id: ERR_STAFFING_INSUFFICIENT
  http_status: 409
  applies_to: POST /ops/event-bookings/{id}/confirm
- priority: 27
  category: business_referential
  check: Agreement terminate requires no credentials in {ACTIVE, LOST_REPORTED}
  error_id: ERR_CREDENTIALS_OUTSTANDING
  http_status: 409
  applies_to: POST /ops/monthly-agreements/{id}/terminate
- priority: 28
  category: business_referential
  check: Reconciliation approve from VARIANCE_REVIEW requires incident_id naming the linked CASH_VARIANCE incident in INVESTIGATING
  error_id: ERR_VARIANCE_INCIDENT_REQUIRED
  http_status: 409
  applies_to: POST /ops/reconciliations/{id}/approve
- priority: 29
  category: business_referential
  check: Repair funding with inspection_id requires that inspection REPORTED
  error_id: ERR_INSPECTION_NOT_REPORTED
  http_status: 409
  applies_to: POST /ops/repair-projects/{id}/fund
- priority: 30
  category: business_fiscal
  check: Agreement activation requires allocated < monthly_capacity
  error_id: ERR_MONTHLY_POOL_EXHAUSTED
  http_status: 409
  applies_to: POST /ops/monthly-agreements/{id}/activate
- priority: 31
  category: business_fiscal
  check: Shift comp_total_cents + waived fee <= COMP_CAP_PER_SHIFT_CENTS
  error_id: ERR_COMP_LIMIT_EXCEEDED
  http_status: 422
  applies_to: POST /ops/parking-sessions/{id}/comp
- priority: 32
  category: business_fiscal
  check: Refund amount_cents <= settled_fee_cents of the session
  error_id: ERR_REFUND_EXCEEDS_COLLECTED
  http_status: 422
  applies_to: POST /ops/parking-sessions/{id}/refund
- priority: 33
  category: business_fiscal
  check: Repair draw amount_cents <= Facility.capital_reserve_cents
  error_id: ERR_INSUFFICIENT_RESERVE
  http_status: 422
  applies_to: POST /ops/repair-projects/{id}/fund
endpoints:
- method: POST
  path: /ops/_clock/set_current_utc
  description: Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z and NEVER falls back to wall-clock; every entry_at/exit_at/activated_at/created_at/close-of-business date reads this
    clock.
  roles:
  - FacilityManager
  code: 200
  input:
  - to_iso8601
  output: '{ current_utc: datetime }'
  side_effects:
  - logical clock advanced
- method: POST
  path: /ops/facilities
  description: Create a facility
  roles:
  - FacilityManager
  code: 201
  input:
  - name
  - total_spaces
  - monthly_capacity
  - event_pool_spaces
  - levy_pct?
  output: Facility
  side_effects:
  - posture=NORMAL, computed counters 0
- method: GET
  path: /ops/facilities/{facility_id}
  description: Get facility
  roles: &id001
  - FacilityManager
  - ParkingAttendant
  - RevenueAuditor
  - MaintenanceSupervisor
  - SecurityOfficer
  - GateDevice
  - MonthlyParker
  code: 200
  input: []
  output: Facility
  side_effects: []
- method: GET
  path: /ops/facilities
  description: List facilities
  roles: *id001
  code: 200
  input:
  - posture?
  output: Facility[]
  side_effects: []
- method: POST
  path: /ops/facilities/{facility_id}/transition-posture
  description: Manual posture transition (targets RESTRICTED, CLOSED_TEMPORARY, NORMAL, DECOMMISSIONED; never EVENT_SURGE)
  roles:
  - FacilityManager
  code: 200
  input:
  - target_posture
  output: Facility
  side_effects:
  - posture transition per Facility machine
  - increments Facility.version by 1
- method: POST
  path: /ops/facilities/{facility_id}/close-of-business
  description: 'Ops-run checkpoint for the logical clock''s current date. Preconditions: posture != DECOMMISSIONED and business date strictly after last_close_date (else ERR_INVALID_STATE_TRANSITION). Increments
    Facility.version by 1.'
  roles:
  - FacilityManager
  code: 200
  input: []
  output: '{ business_date: string, shifts_force_closed: integer, reconciliations_created: integer, agreements_promoted: integer, windows_marked_missed: integer, patrols_marked_missed: integer, devices_marked_offline:
    integer, levy_credited_cents: integer, chargers_flagged: integer }'
  side_effects:
  - Force-close OPEN shifts -> FORCE_CLOSED; create DRAFT ReconciliationRecord for each CLOSED/FORCE_CLOSED shift lacking a non-terminal one
  - Mark MISSED windows (SCHEDULED/IN_PROGRESS with end_at < now) and MISSED patrols (SCHEDULED with scheduled_start < now)
  - Waitlist promotion per waitlist_promotion
  - Capital levy per capital_reserve_ledger; last_close_date set
  - EV utilization recompute per ev_charger_utilization; review flags
  - Devices with last_heartbeat_at null or older than 24h -> OFFLINE
  - 'If posture NORMAL and any CRITICAL incident OPEN/INVESTIGATING: posture -> RESTRICTED'
