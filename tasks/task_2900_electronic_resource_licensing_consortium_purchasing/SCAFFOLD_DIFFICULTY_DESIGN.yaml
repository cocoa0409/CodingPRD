  - rule_id: non_linear_state_machine
    instances:
      - name: negotiation_counter_revise_cycle_rejected_at_round_limit
        grounds:
          - state_machines.Negotiation.DRAFTING_to_VENDOR_REVIEW
          - state_machines.Negotiation.VENDOR_REVIEW_to_COUNTERED
          - state_machines.Negotiation.COUNTERED_to_DRAFTING
          - validations[priority=30]
          - entities.Negotiation.fields.round_count
        distinguishing_aspect: |
          Non-linearity on the Negotiation entity is a true cycle: DRAFTING -> VENDOR_REVIEW ->
          COUNTERED -> DRAFTING is traversed twice, round_count reaches MAX_NEGOTIATION_ROUNDS 3,
          and the third revise is refused with ERR_NEGOTIATION_ROUND_LIMIT while the row stays in
          COUNTERED - a loop with a termination counter, not a forward pipeline.
        test_recipe:
          setup:
            - "Vendor Atlas Scholarly and Product Atlas Humanities Collection; Member Alpha College."
            - "A DRAFT trial exists only to satisfy the negotiation's trial_id foreign key - signing is never attempted here."
            - "The negotiation has been submitted three times and countered three times, with revisions after the first two counters, so round_count == 3 and status == COUNTERED."
