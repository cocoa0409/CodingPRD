            - "offset -1 -> 400 ERR_PAGINATION_INVALID"
            - "limit 100 -> 200 with total_count 2, has_more false and two rows (upper bound inclusive)"
            - "limit 1 offset 1 -> 200 with total_count 2, has_more false and exactly one row"

