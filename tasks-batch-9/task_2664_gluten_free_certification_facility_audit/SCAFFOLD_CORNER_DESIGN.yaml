      - name: facility_outcome_selector_takes_the_latest_closed_audit_not_the_earliest_window
        claim_type: selector_policy
        grounds:
          - entities.Facility.fields.last_closed_audit_outcome
          - entities.Facility.fields.last_closed_audit_closed_on
          - state_machines.Audit.transitions.IN_PROGRESS_to_CLOSED_PASS
        distinguishing_aspect: |
          Two audits are open at once and they close in the OPPOSITE order to their on-site
          windows: the surveillance audit whose window is 2026-08-10 closes first, and the
          initial audit whose window was 2026-08-05 closes afterwards on 2026-08-11. The
          facility's snapshot must therefore carry the 2026-08-11 close, which distinguishes a
          selector keyed on closed_on from one keyed on onsite_start_at or on the audit id
          order. Both audits close with a perfect 100 because neither carries a finding.
        test_recipe:
          setup:
            - "One applicant with one facility whose sanitation was VALIDATED on 2026-08-01."
            - "One INITIAL audit over [2026-08-05T09:00Z, 2026-08-05T17:00Z) and one SURVEILLANCE audit over [2026-08-10T09:00Z, 2026-08-10T17:00Z); the windows do not overlap."
            - "Both audits are started, then the SURVEILLANCE audit is closed at 2026-08-10T17:00Z while the INITIAL audit is still IN_PROGRESS."
            - "The clock is then advanced to 2026-08-11 and no certificate exists, so the surveillance close had nothing to refresh."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/applicants"
              payload: { legal_name: "Northgate Bakehouse Ltd", contact_email: "qa@northgate.example", country_code: "US" }
              as: ProgramAdministrator
              captures: { app_id: $.data.id }
            - call: "POST /gfco/facilities"
              payload: { applicant_id: "${app_id}", site_name: "Plant 9", air_handling_class: "FILTERED_ZONED", shared_equipment_present: false, gluten_containing_operations: "NONE" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /gfco/facilities/${fac_id}/sanitation-validation"
              payload: { swab_ppm: 2.0, method: "G12_ELISA", validated_on: "2026-08-01T00:00:00Z" }
              as: CertificationReviewer
              as_user_id: "rev-1"
              captures: { fac_out_0: $.data.last_closed_audit_outcome }
            - call: "POST /gfco/audits"
              payload: { facility_id: "${fac_id}", audit_type: "INITIAL", onsite_start_at: "2026-08-05T09:00:00Z", onsite_end_at: "2026-08-05T17:00:00Z" }
              as: FieldAuditor
              as_user_id: "aud-1"
              captures: { aud_early: $.data.id }
            - call: "POST /gfco/audits"
              payload: { facility_id: "${fac_id}", audit_type: "SURVEILLANCE", onsite_start_at: "2026-08-10T09:00:00Z", onsite_end_at: "2026-08-10T17:00:00Z" }
              as: FieldAuditor
              as_user_id: "aud-2"
              captures: { aud_late: $.data.id }
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/audits/${aud_early}/start"
              payload: {}
              as: FieldAuditor
              as_user_id: "aud-1"
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/audits/${aud_late}/start"
              payload: {}
              as: FieldAuditor
              as_user_id: "aud-2"
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T17:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/audits/${aud_late}/close"
              payload: { shared_equipment_verified: true, air_handling_verified: true, sanitation_validation_reviewed: true }
              as: FieldAuditor
              as_user_id: "aud-2"
              captures: { late_status: $.data.status, late_closed: $.data.closed_on, late_score: $.data.provisional_score }
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /gfco/audits/${aud_early}/close"
              payload: { shared_equipment_verified: true, air_handling_verified: true, sanitation_validation_reviewed: true }
              as: FieldAuditor
              as_user_id: "aud-1"
          assert:
            - "response.status == 200"
            - "response.data.id == ${aud_early}"
            - "response.data.status == \"CLOSED_PASS\""
            - "response.data.closed_on == \"2026-08-11T00:00:00Z\""
            - "response.data.closed_by_user_id == \"aud-1\""
            - "response.data.provisional_score == 100"
            - "response.data.final_score == 100"
            - "response.data.finding_count == 0"
            - "response.data.critical_finding_count == 0"
            - "${fac_out_0} == \"NONE\""
            - "${late_status} == \"CLOSED_PASS\""
            - "${late_closed} == \"2026-08-10T17:00:00Z\""
            - "${late_score} == 100"
            - "Facility.${fac_id}.last_closed_audit_outcome == \"CLOSED_PASS\""
            - "Facility.${fac_id}.last_closed_audit_closed_on == \"2026-08-11T00:00:00Z\""
            - "Audit.${aud_late}.closed_on == \"2026-08-10T17:00:00Z\""
            - "GET /gfco/audits with facility_id=${fac_id} and status=IN_PROGRESS returns total_count == 0"

      - name: five_hop_supplier_cascade_is_the_cascading_side_effects_case
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: supplier_suspension_propagates_five_hops_to_certificate_and_posture
          rationale: |
            That instance drives the deepest chain the domain has - supplier status to ingredient
            block to product formula to certificate suspension to applicant posture - in one
            call and asserts every hop plus the ordering-sensitive counters. Any corner instance
            would be a strict subset of it, and the partial-failure side of the layer is covered
            by the validation instances that assert no partial writes after a rejection.

      - name: two_variant_pairs_are_the_dual_variant_calculation_cases
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: audit_score_provisional_frozen_vs_final_recomputed_after_ca_verification
          rationale: |
            Both variant pairs of the design are already exercised there and in the paired
            posture instance: the audit score's PROVISIONAL_ONSITE value stays frozen while
            FINAL_ADJUDICATED re-derives with the corrective-action relief factor, and the
            posture pair diverges when the rolling window excludes a finding the certification
            cycle still counts. Each asserts both variants and the delta on switch, which is
            the whole content of the layer.

  - section: consistency_model
    instances:
      - name: failing_lot_test_publishes_verdict_finding_and_posture_in_one_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.lot_test_verdict
          - calculations.open_nc_penalty_points
          - endpoints."POST /gfco/lot-tests"
        distinguishing_aspect: |
          One write crosses three aggregates and the model is immediate, so the lab's own
          response must already carry the applied threshold and the verdict, the raised
          nonconformance must be listable in the same cycle with its computed penalty points and
          due date, and the applicant's posture must already read 92 - no sweep, no second
          request and no re-read delay may be needed to observe any of it.
        test_recipe:
          setup:
            - "One applicant, one facility (no shared equipment, operations NONE), one supplier and one APPROVED INHERENTLY_GF ingredient."
            - "One STANDARD product with that line at 55 pct, formula CLEARED and testing plan ACTIVE at threshold_ppm 20."
            - "No lot test has been recorded yet, so the applicant's posture is a clean 100."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/applicants"
              payload: { legal_name: "Northgate Bakehouse Ltd", contact_email: "qa@northgate.example", country_code: "US" }
              as: ProgramAdministrator
              captures: { app_id: $.data.id }
            - call: "POST /gfco/facilities"
              payload: { applicant_id: "${app_id}", site_name: "Plant 9", air_handling_class: "FILTERED_ZONED", shared_equipment_present: false, gluten_containing_operations: "NONE" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /gfco/suppliers"
              payload: { name: "Prairie Mills", country_code: "CA", gluten_handling_disclosed: false }
              as: ProgramAdministrator
              captures: { sup_id: $.data.id }
            - call: "POST /gfco/ingredients"
              payload: { applicant_id: "${app_id}", supplier_id: "${sup_id}", name: "Brown Rice Flour", risk_class: "INHERENTLY_GF" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { ing_id: $.data.id }
            - call: "POST /gfco/supplier-documents"
              payload: { supplier_id: "${sup_id}", ingredient_id: "${ing_id}", doc_type: "ALLERGEN_STATEMENT", issued_on: "2026-07-01T00:00:00Z", expires_on: "2028-07-01T00:00:00Z" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { doc_id: $.data.id }
            - call: "POST /gfco/supplier-documents/${doc_id}/verification"
              payload: { decision: "APPROVE" }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /gfco/ingredients/${ing_id}/submission"
              payload: {}
              as: ApplicantContact
              as_user_id: "${app_id}"
            - call: "POST /gfco/ingredients/${ing_id}/review"
              payload: { decision: "APPROVE" }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /gfco/products"
              payload: { applicant_id: "${app_id}", facility_id: "${fac_id}", name: "Rice Sandwich Loaf", sku: "RSL-001", requested_mark_tier: "STANDARD" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /gfco/product-ingredients"
              payload: { product_id: "${prod_id}", ingredient_id: "${ing_id}", inclusion_pct: 55 }
              as: ApplicantContact
              as_user_id: "${app_id}"
            - call: "POST /gfco/products/${prod_id}/formula-review"
              payload: { decision: "CLEAR" }
              as: CertificationReviewer
              as_user_id: "rev-1"
              captures: { prod_v1: $.data.version }
            - call: "POST /gfco/products/${prod_id}/testing-plan"
              payload: { expected_product_version: "${prod_v1}" }
              as: CertificationReviewer
              as_user_id: "rev-1"
              captures: { prod_thr: $.data.threshold_ppm }
            - call: "GET /gfco/applicants/${app_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { pre_score: $.data.posture_score_cycle }
          trigger:
            - call: "POST /gfco/lot-tests"
              payload: { product_id: "${prod_id}", lot_code: "RSL-L1", test_type: "SCHEDULED", sample_collected_on: "2026-08-01T00:00:00Z", ppm_result: 25.0, lab_method: "G12_ELISA" }
              as: LabTechnician
              as_user_id: "lab-1"
          assert:
            - "response.status == 201"
            - "response.data.product_id == ${prod_id}"
            - "response.data.lot_code == \"RSL-L1\""
            - "response.data.threshold_applied_ppm == 20"
            - "response.data.verdict == \"FAIL\""
            - "response.data.status == \"RECORDED\""
            - "response.data.nonconformance_created == true"
            - "response.data.in_recall_scope == false"
            - "${prod_thr} == 20"
            - "${pre_score} == 100"
            - "GET /gfco/nonconformances with applicant_id=${app_id} returns total_count == 1"
            - "GET /gfco/nonconformances with applicant_id=${app_id} returns items[0].source_type == \"LOT_TEST\""
            - "GET /gfco/nonconformances with applicant_id=${app_id} returns items[0].category == \"THRESHOLD_EXCEEDANCE\""
            - "GET /gfco/nonconformances with applicant_id=${app_id} returns items[0].severity == \"MAJOR\""
            - "GET /gfco/nonconformances with applicant_id=${app_id} returns items[0].status == \"OPEN\""
            - "GET /gfco/nonconformances with applicant_id=${app_id} returns items[0].penalty_points == 8"
            - "GET /gfco/nonconformances with applicant_id=${app_id} returns items[0].ca_due_on == \"2026-08-31T00:00:00Z\""
            - "Applicant.${app_id}.open_nc_penalty_points == 8"
            - "Applicant.${app_id}.posture_score_cycle == 92"
            - "Applicant.${app_id}.posture_score_rolling_12m == 92"
            - "Applicant.${app_id}.compliance_posture == \"GOOD_STANDING\""
            - "Product.${prod_id}.last_scheduled_sample_on == \"2026-08-01T00:00:00Z\""

      - name: complaint_substantiation_is_the_multi_aggregate_immediate_visibility_case
        claim_type: immediate
        excluded_because:
          difficulty_instance: complaint_substantiation_cascades_through_critical_nc_to_probation
          rationale: |
            That instance already asserts, inside the single investigation-outcome response
            cycle, the complaint's new state, the CRITICAL nonconformance it raises, the
            certificate's suspension with its reason, the frozen product label and both
            recomputed posture variants - i.e. every aggregate the write touches is observed
            without a re-read. A second immediate-visibility instance would only re-assert the
            same property on a shorter chain, which the lot-test instance above already does.
