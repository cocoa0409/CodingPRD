  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: distribution_rerun_supersedes_prior_run
        claim_type: conditional_action
        grounds: [state_machines.DistributionRun.COMPUTED_to_SUPERSEDED, state_machines.DistributionLine.PENDING_to_VOID]
        distinguishing_aspect: "Re-running the waterfall with the current payment version supersedes the COMPUTED run: run1 -> SUPERSEDED with its lines VOID, run2 numbered 2; remitting the superseded run then fails."
        test_recipe:
          setup: ["funded facility single participant; draw 1,000,000; payment 50,000 value 2026-08-31; run1 created"]
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Rerun B", sector: "OTHER", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Rerun", total_commitment_cents: 5000000, currency: "USD", interest_rate_bps: 1200, day_count_basis: "ACT_360", servicing_fee_bps: 25, default_interest_addon_bps: 800, maturity_date: "2031-08-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "RP", commitment_cents: 5000000 }, as: AgentBank, captures: { p_id: $.data.id } }
            - { call: "POST /api/participants/${p_id}/commit", payload: {}, as: AgentBank }
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f_id}", draw_amount_cents: 1000000, accrual_start_date: "2026-08-01", accrual_end_date: "2027-08-01", expected_facility_version: "${f_v}" }, as: AgentBank, captures: { d_id: $.data.id } }
            - { call: "GET /api/funding_settlements?participant_id=${p_id}", as: AgentBank, captures: { s1: '$.data[0].id' } }
            - { call: "POST /api/funding_settlements/${s1}/report_wire", payload: { amount_cents: 1000000 }, as: ParticipantLender, as_user_id: "${p_id}" }
            - { call: "POST /api/funding_settlements/${s1}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/payments", payload: { facility_id: "${f_id}", payment_type: "REGULAR", amount_cents: 50000, value_date: "2026-08-31" }, as: Borrower, as_user_id: "${b_id}", captures: { pay_id: $.data.id, pay_v: $.data.version } }
            - { call: "POST /api/payments/${pay_id}/distribution_runs", payload: { expected_payment_version: "${pay_v}" }, as: AgentBank, captures: { run1: $.data.id } }
            - { call: "GET /api/payments/${pay_id}", as: AgentBank, captures: { pay_v2: $.data.version } }
          trigger:
            - { call: "POST /api/payments/${pay_id}/distribution_runs", payload: { expected_payment_version: "${pay_v2}" }, as: AgentBank, captures: { run2: $.data.id, run2_n: $.data.run_number } }
            - { call: "POST /api/distribution_runs/${run1}/remit", payload: {}, as: AgentBank, captures: { err: $.data.error_id } }
          assert:
            - "DistributionRun.${run1}.status == SUPERSEDED with superseded_by_run_id == ${run2}; its lines are VOID"
            - "DistributionRun.${run2}.run_number == 2 and status == COMPUTED"
            - "remit of superseded run1: error_id == ERR_INVALID_STATE_TRANSITION, HTTP 409"

      - name: participant_list_filter_by_status
        claim_type: listing
        grounds: [entities.Participant]
        distinguishing_aspect: "Filtered list: GET /api/participants?facility_id&status=FUNDED returns only FUNDED participants of that facility."
        test_recipe:
          setup: ["facility with one COMMITTED (unfunded) and one FUNDED participant after a partial draw funding"]
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Filt B", sector: "OTHER", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Filt", total_commitment_cents: 5000000, currency: "USD", interest_rate_bps: 900, day_count_basis: "ACT_360", servicing_fee_bps: 10, default_interest_addon_bps: 300, maturity_date: "2030-01-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "FP1", commitment_cents: 3000000 }, as: AgentBank, captures: { p1_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "FP2", commitment_cents: 2000000 }, as: AgentBank, captures: { p2_id: $.data.id } }
            - { call: "POST /api/participants/${p1_id}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${p2_id}/commit", payload: {}, as: AgentBank }
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f_id}", draw_amount_cents: 1000000, accrual_start_date: "2026-08-01", accrual_end_date: "2027-08-01", expected_facility_version: "${f_v}" }, as: AgentBank, captures: { d_id: $.data.id } }
            - { call: "GET /api/funding_settlements?participant_id=${p1_id}", as: AgentBank, captures: { s1: '$.data[0].id' } }
            - { call: "POST /api/funding_settlements/${s1}/report_wire", payload: { amount_cents: 600000 }, as: ParticipantLender, as_user_id: "${p1_id}" }
            - { call: "POST /api/funding_settlements/${s1}/confirm", payload: {}, as: AgentBank }
          trigger:
            - { call: "GET /api/participants?facility_id=${f_id}&status=FUNDED", as: AgentBank, captures: { lst: $.data } }
            - { call: "GET /api/participants?facility_id=${f_id}&status=COMMITTED", as: AgentBank }
          assert:
            - "FUNDED filter returns exactly [${p1_id}] (total_count == 1)"
            - "COMMITTED filter returns exactly [${p2_id}] (draw SETTLED bubble never fired for P2)"

      - name: response_envelope_shape_and_immediate_readback
        claim_type: envelope_shape
        grounds: [response_envelope]
        distinguishing_aspect: "Every response carries meta.api_request_id, meta.api_request_timestamp, response_type; created entity is fully readable in the same response (immediate consistency)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Env B", sector: "ENERGY", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
          trigger:
            - { call: "GET /api/borrowers/${b_id}", as: ParticipantLender, as_user_id: "${b_id}" }
          assert:
            - "create response: meta.api_request_id present, response_type == object, data.id == ${b_id}"
            - "GET response echoes identical legal_name/status/version (immediate, no lag)"
            - "GET is permitted for role ParticipantLender (reads are role-agnostic; the id need not be a real participant for reads)"

  # ===========================================================================
  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds: ['validations[priority=1]', 'errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]']
        distinguishing_aspect: "Request without X-User-ID/X-User-Role headers -> 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (priority 1 beats everything)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
