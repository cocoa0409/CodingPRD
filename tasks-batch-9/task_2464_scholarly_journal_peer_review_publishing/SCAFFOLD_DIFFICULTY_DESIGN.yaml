          setup:
            - "One Journal with min_completed_reviews_for_decision = 1 and default apc_base_cents 180000."
            - "One Manuscript IN_PRODUCTION whose ProductionJob is at content_stage PROOF_APPROVED and clearance_stage DEPOSIT_CONFIRMED (first invoice already PAID for 180000)."
