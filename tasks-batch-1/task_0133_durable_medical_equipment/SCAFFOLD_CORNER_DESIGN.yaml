  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_version_increments_on_cmn_activate
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[cmn-activate-stale-order]", entities.DMEOrder.fields.version]
        distinguishing_aspect: "Activating a CMN with the correct expected_order_version succeeds and bumps DMEOrder.version by exactly 1 (the positive OCC path)."
        test_recipe:
          setup: ["CMN-required order at version 1; CMN#1 DRAFT."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "OC1", medicare_id: "MBI-OC1", date_of_birth: "1960-01-01", address_state: "CA" }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "OCS1", ptan: "PTAN-OC1", accreditation_active: true }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /hcpcs-items"
              payload: { hcpcs_code: "K1800", description: "OCC wheelchair", billing_category: "CAPPED_RENTAL", purchase_price_cents: 100000, monthly_rental_cents: 10000, requires_cmn: true, requires_prior_auth: false, is_cpap: false }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /dme-orders"
              payload: { patient_id: "${pat_id}", supplier_id: "${sup_id}", hcpcs_item_id: "${item_id}", acquisition_type: "RENTAL", modifier: "KX", ordered_at_utc: "2026-01-01T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /cmns"
              payload: { order_id: "${order_id}", physician_npi: "NPI-OC", length_of_need_months: 12, signed_date: "2025-12-15" }
              as: PhysicianUser
              captures: { cmn_id: $.data.id }
          trigger:
            - call: "POST /cmns/${cmn_id}/activate"
              payload: { expected_order_version: "${order_v}" }
              as: PhysicianUser
              captures: { cmn_st: $.data.status }
            - call: "GET /dme-orders/${order_id}"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { v_after: $.data.version }
          assert:
            - "CMN.${cmn_id}.status == ACTIVE"
            - "DMEOrder.${order_id}.version == 2 (incremented by exactly 1 from 1)"

      - name: occ_stale_version_on_cmn_activate_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[cmn-activate-stale-order]", "errors[ERR_STALE_ORDER_VERSION]", "validations[priority=14]"]
        distinguishing_aspect: "Activating CMN#2 carrying the pre-supersede order version (order_v0, now stale after CMN#1 activation bumped it) -> ERR_STALE_ORDER_VERSION 412."
        test_recipe:
          setup: ["CMN-required order; CMN#1 activated (order version bumped to 2); CMN#2 DRAFT; client still holds order version observed at creation (1)."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "ST1", medicare_id: "MBI-ST1", date_of_birth: "1960-01-01", address_state: "CA" }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "STS1", ptan: "PTAN-ST1", accreditation_active: true }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /hcpcs-items"
              payload: { hcpcs_code: "K1900", description: "Stale wheelchair", billing_category: "CAPPED_RENTAL", purchase_price_cents: 100000, monthly_rental_cents: 10000, requires_cmn: true, requires_prior_auth: false, is_cpap: false }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /dme-orders"
              payload: { patient_id: "${pat_id}", supplier_id: "${sup_id}", hcpcs_item_id: "${item_id}", acquisition_type: "RENTAL", modifier: "KX", ordered_at_utc: "2026-01-01T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { order_id: $.data.id, order_v0: $.data.version }
            - call: "POST /cmns"
              payload: { order_id: "${order_id}", physician_npi: "NPI-S1", length_of_need_months: 12, signed_date: "2025-12-10" }
              as: PhysicianUser
              captures: { cmn1_id: $.data.id }
            - call: "POST /cmns/${cmn1_id}/activate"
              payload: { expected_order_version: "${order_v0}" }
              as: PhysicianUser
            - call: "POST /cmns"
              payload: { order_id: "${order_id}", physician_npi: "NPI-S2", length_of_need_months: 24, signed_date: "2025-12-12" }
              as: PhysicianUser
              captures: { cmn2_id: $.data.id }
          trigger:
            - call: "POST /cmns/${cmn2_id}/activate"
              payload: { expected_order_version: "${order_v0}" }
              as: PhysicianUser
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_STALE_ORDER_VERSION"
            - "HTTP status == 412"

