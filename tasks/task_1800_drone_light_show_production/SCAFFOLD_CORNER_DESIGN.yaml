          trigger:
            - { call: "GET /api/show-events/${show_id}/readiness", as: FleetManager, captures: { posture: $.data.posture, cnt: $.data.assigned_count, req: $.data.required_drone_count } }
          assert:
            - "${posture} == NOT_READY with ${cnt} == 0 and ${req} == 2"
            - "gates object reports g1..g6 in order: g1,g2,g3,g4 true; g5 false (grid incomplete); g6 false (no certified GO)"

      - name: drones_pagination_defaults_and_limit_bounds
        claim_type: standard_crud
        grounds:
          - response_envelope
          - "endpoints: GET /api/drones"
        distinguishing_aspect: "default page is limit 10/offset 0 with total_count 12 and has_more true; limit=2&offset=10 returns the last 2 with has_more false; limit 0 and 101 are rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["12 drones registered"]
          setup_api_calls:
            - { call: "POST /api/drones", payload: { serial_number: "SN-P01", model: "LUM-2" }, as: FleetManager }
