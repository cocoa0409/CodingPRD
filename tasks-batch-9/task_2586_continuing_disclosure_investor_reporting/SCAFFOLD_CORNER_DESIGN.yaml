          assert:
            - "${fixed_waivable} == false — the omitted input took its declared default"
            - "${e_both} == ERR_REQUIREMENT_NOT_WAIVABLE with HTTP 409 — priority 27 beats priority 40 when both are violated"
            - "${e_not_waivable} == ERR_REQUIREMENT_NOT_WAIVABLE with HTTP 409 — supplying a reason does not unlock a non-waivable requirement"
            - "${e_no_reason} == ERR_WAIVER_REASON_REQUIRED with HTTP 422 on the waivable requirement"
            - "${w_status} == WAIVED, ${w_factor} == 1.0, ${w_reason} is the supplied text"
