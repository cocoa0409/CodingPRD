        distinguishing_aspect: "OCC: accept with stale expected_customer_version returns ERR_STALE_VERSION (412)"
        test_recipe:
          setup: ["Customer C version=2 (after one mutation); ISSUED Quote"]
          setup_api_calls:
            - call: "POST /stairlift-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
