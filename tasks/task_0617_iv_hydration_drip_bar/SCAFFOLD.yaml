    path: "/dispatch-routes/{id}/lock"
    description: "Lock a route so no further stops may be assigned."
    roles: [ClinicAdmin]
    code: 200
    input: []
    output: DispatchRoute
    side_effects: ["status=LOCKED", "increments DispatchRoute.version by 1"]
  - method: POST
    path: "/dispatch-routes/{id}/close"
    description: "Close a locked route once all stops are terminal."
    roles: [ClinicAdmin]
    code: 200
    input: []
    output: DispatchRoute
    side_effects: ["status=CLOSED", "increments DispatchRoute.version by 1"]

  # ---- Appointment ----
  - method: POST
    path: "/appointments"
    description: "Request an appointment (drip + add-ons, lounge or mobile)."
    roles: [ClinicAdmin, IntakeNurse]
    code: 201
    input: [patient_id, menu_item_id, "addon_ids?", location_type, "lounge_id?", start_at, "duration_minutes?", "membership_id?"]
    output: Appointment
    side_effects: ["status:=REQUESTED"]
  - method: GET
    path: "/appointments/{id}"
    description: "Read an appointment (status, charge, credits, FKs)."
    roles: [ClinicAdmin, IntakeNurse, MedicalDirector, Nurse]
    code: 200
    input: []
    output: Appointment
    side_effects: []
  - method: GET
    path: "/appointments"
    description: "List appointments (filters)."
    roles: [ClinicAdmin, IntakeNurse, MedicalDirector, Nurse]
    code: 200
    input: ["patient_id?", "menu_item_id?", "membership_id?", "lounge_id?", "route_id?", "nurse_id?", "standing_order_id?", "status?", "limit?", "offset?"]
    output: Appointment[]
    side_effects: []
  - method: POST
    path: "/appointments/{id}/intake"
    description: "Author and submit an intake screening; computes contraindication_score and outcome; moves appointment REQUESTED->SCREEN_PENDING."
    roles: [IntakeNurse]
    code: 201
    input: [author_user_id, "pregnancy?", "renal_impairment?", "cardiac_history?", "g6pd_deficiency?", "recent_adverse_event?"]
    output: IntakeScreening
    side_effects: ["create IntakeScreening (SUBMITTED)", "compute contraindication_score + outcome", "appointment.status=SCREEN_PENDING", "increments Appointment.version by 1"]
  - method: POST
    path: "/appointments/{id}/schedule"
    description: "Schedule a CLEARED appointment (fork to REQUIRES_MD_REVIEW when outcome demands MD review). Reserves supply, computes charge, decrements credits."
    roles: [ClinicAdmin]
    code: 200
    input: [expected_appointment_version]
    output: Appointment
    side_effects: ["pin standing_order_id", "reserve supply (FEFO)", "compute amount_charged_cents", "decrement membership credits", "status=SCHEDULED or REQUIRES_MD_REVIEW", "increments Appointment.version by 1"]
  - method: POST
    path: "/appointments/{id}/md-approve"
    description: "Medical director approves a REQUIRES_MD_REVIEW appointment; redeems membership credits; -> SCHEDULED."
    roles: [MedicalDirector]
    code: 200
    input: [expected_appointment_version, "expected_membership_version?"]
    output: Appointment
    side_effects: ["pin standing_order_id", "reserve supply (FEFO)", "compute amount_charged_cents", "decrement membership credits", "status=SCHEDULED", "increments Appointment.version by 1"]
  - method: POST
    path: "/appointments/{id}/md-decline"
    description: "Medical director declines a REQUIRES_MD_REVIEW appointment; -> DECLINED."
    roles: [MedicalDirector]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status=DECLINED", "increments Appointment.version by 1"]
  - method: POST
    path: "/appointments/{id}/dispatch"
    description: "Assign an RN (and route for MOBILE) to a SCHEDULED appointment; -> DISPATCHED."
    roles: [ClinicAdmin]
    code: 200
    input: [nurse_id, "route_id?"]
    output: Appointment
    side_effects: ["set nurse_id; set route_id and increment route.stop_count for MOBILE", "status=DISPATCHED", "increments Appointment.version by 1"]
  - method: POST
    path: "/appointments/{id}/start"
    description: "Dispatched RN starts the infusion; -> IN_PROGRESS."
    roles: [Nurse]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status=IN_PROGRESS", "increments Appointment.version by 1"]
  - method: POST
    path: "/appointments/{id}/complete"
    description: "RN completes the infusion; consumes supply; finalizes credits; -> COMPLETED."
    roles: [Nurse]
    code: 200
    input: []
    output: Appointment
    side_effects: ["consume reserved supply (reserved-=1, consumed+=1 per line; lot EXHAUSTED when full)", "finalize credits", "status=COMPLETED", "increments Appointment.version by 1"]
  - method: POST
    path: "/appointments/{id}/cancel"
    description: "Cancel a non-terminal appointment; releases supply reservation, restores credits, decrements route stop."
    roles: [ClinicAdmin]
    code: 200
    input: []
    output: Appointment
    side_effects: ["release reserved supply", "restore membership credits", "decrement route.stop_count if routed", "status=CANCELLED", "increments Appointment.version by 1"]

  # ---- IntakeScreening (read / reverse) ----
  - method: GET
    path: "/intake-screenings/{id}"
    description: "Read an intake screening (score, outcome, status)."
    roles: [ClinicAdmin, IntakeNurse, MedicalDirector]
    code: 200
    input: []
    output: IntakeScreening
    side_effects: []
  - method: GET
    path: "/appointments/{id}/intake-screenings"
    description: "Reverse lookup: screenings for an appointment (latest SUBMITTED is authoritative)."
    roles: [ClinicAdmin, IntakeNurse, MedicalDirector]
    code: 200
    input: []
    output: IntakeScreening[]
    side_effects: []

  # ---- Consent ----
  - method: POST
    path: "/consents"
    description: "Record patient consent for an appointment (witness must differ from screening author)."
    roles: [IntakeNurse, ClinicAdmin]
    code: 201
    input: [appointment_id, signed_by_patient, witness_user_id]
    output: Consent
    side_effects: ["status:=SIGNED"]
  - method: GET
    path: "/consents/{id}"
    description: "Read a consent."
    roles: [ClinicAdmin, IntakeNurse, MedicalDirector]
    code: 200
    input: []
    output: Consent
    side_effects: []
  - method: POST
    path: "/consents/{id}/revoke"
    description: "Revoke a signed consent."
    roles: [IntakeNurse, ClinicAdmin, MedicalDirector]
    code: 200
    input: []
    output: Consent
    side_effects: ["status=REVOKED"]
  - method: GET
    path: "/appointments/{id}/consents"
    description: "Reverse lookup: consents for an appointment."
    roles: [ClinicAdmin, IntakeNurse, MedicalDirector]
    code: 200
    input: []
    output: Consent[]
    side_effects: []

  # ---- AdverseEvent ----
  - method: POST
    path: "/adverse-events"
    description: "Report an adverse reaction during/after an infusion; increments patient open_adverse_event_count."
    roles: [Nurse, MedicalDirector]
    code: 201
    input: [appointment_id, reported_by_user_id, severity, description]
    output: AdverseEvent
    side_effects: ["status:=REPORTED", "recompute Patient.open_adverse_event_count (increment)"]
  - method: GET
    path: "/adverse-events/{id}"
    description: "Read an adverse event."
    roles: [ClinicAdmin, MedicalDirector, Nurse]
    code: 200
    input: []
    output: AdverseEvent
    side_effects: []
  - method: POST
    path: "/adverse-events/{id}/review"
    description: "Medical director moves an event to UNDER_REVIEW."
    roles: [MedicalDirector]
    code: 200
    input: []
    output: AdverseEvent
    side_effects: ["status=UNDER_REVIEW", "increments AdverseEvent.version by 1"]
  - method: POST
    path: "/adverse-events/{id}/resolve"
    description: "Medical director resolves an event; decrements patient open_adverse_event_count."
    roles: [MedicalDirector]
    code: 200
    input: []
    output: AdverseEvent
    side_effects: ["status=RESOLVED", "recompute Patient.open_adverse_event_count (decrement)", "increments AdverseEvent.version by 1"]
  - method: GET
    path: "/appointments/{id}/adverse-events"
    description: "Reverse lookup: adverse events for an appointment."
    roles: [ClinicAdmin, MedicalDirector, Nurse]
    code: 200
    input: []
    output: AdverseEvent[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/blank X-User-Role or X-User-ID, or unknown role value."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Role not permitted for the endpoint per §1.7."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path-referenced or FK-referenced resource does not exist."
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Malformed body: missing required field, bad enum, out-of-range integer, lounge_id/location_type mismatch, empty addon_ids element."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Transition not defined from the resource's current state (e.g. complete a SCHEDULED appointment, activate a non-DRAFT order)."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC expected_<parent>_version does not match the live parent version on schedule/md-approve."
  - id: ERR_SCREENING_BLOCKED
    http: 409
    condition: "Latest SUBMITTED IntakeScreening.outcome == BLOCKED; appointment cannot be scheduled or approved."
  - id: ERR_CONSENT_MISSING
    http: 409
    condition: "No SIGNED Consent exists for the appointment at schedule/approve time."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "Same identity attempts two segregated roles (consent witness == screening author; md-approver == screening author; dispatched nurse == standing-order medical_director)."
  - id: ERR_NO_STANDING_ORDER
    http: 409
    condition: "Drip requires a standing order but no ACTIVE StandingOrder covers its tier in force at start_at."
  - id: ERR_SLOT_CONFLICT
    http: 409
    condition: "LOUNGE slot exceeds bay capacity / falls outside open-close window, or MOBILE dispatch violates route turnaround buffer."
  - id: ERR_SUPPLY_UNAVAILABLE
    http: 409
    condition: "No AVAILABLE, non-expired SupplyLot with free units for a required drip/add-on line at start_at."
  - id: ERR_CREDIT_INSUFFICIENT
    http: 409
    condition: "Membership credit redemption would drive a balance below zero, or membership not ACTIVE when redemption attempted."
  - id: ERR_LOT_HAS_RESERVATIONS
    http: 409
    condition: "Quarantine attempted on a lot with units_reserved > 0."
  - id: ERR_CONSENT_NOT_AFFIRMED
    http: 422
    condition: "Consent submitted with signed_by_patient != true."
  - id: ERR_ROUTE_LOCKED
    http: 409
    condition: "Dispatch attempts to add a stop to a LOCKED or CLOSED route."
  - id: ERR_VALIDATION_PARAM
    http: 400
    condition: "Invalid pagination/query parameter (limit/offset out of bounds, unknown filter value)."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ClinicAdmin
    description: "Front-desk/operations operator: configures catalog, schedules, dispatches, cancels, manages routes/supply/memberships."
    identity: "opaque"
    exclusive_operations:
      - "POST /menu-items"
      - "POST /add-ons"
      - "POST /memberships"
      - "POST /memberships/{id}/suspend"
      - "POST /memberships/{id}/reinstate"
      - "POST /lounges"
      - "POST /nurses"
      - "POST /supply-lots"
      - "POST /supply-lots/{id}/quarantine"
      - "POST /dispatch-routes"
      - "POST /dispatch-routes/{id}/lock"
      - "POST /dispatch-routes/{id}/close"
      - "POST /appointments/{id}/schedule"
      - "POST /appointments/{id}/dispatch"
      - "POST /appointments/{id}/cancel"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /patients"
      - "POST /appointments"
      - "POST /consents"
      - "POST /consents/{id}/revoke"
      - "GET (reads across resources)"

  - name: IntakeNurse
    description: "Performs good-faith intake/contraindication screening and records consent."
    identity: "opaque"
    exclusive_operations:
      - "POST /appointments/{id}/intake"
    shared_operations:
      - "POST /patients"
      - "POST /appointments"
      - "POST /consents"
      - "POST /consents/{id}/revoke"
      - "GET (reads across resources)"

  - name: MedicalDirector
    description: "Licensed prescriber: signs/activates/revokes standing orders, reviews MD-review appointments, reviews/resolves adverse events. Identity-tracked for segregation of duties."
    identity: "opaque"
    exclusive_operations:
      - "POST /standing-orders"
      - "POST /standing-orders/{id}/activate"
      - "POST /standing-orders/{id}/revoke"
      - "POST /appointments/{id}/md-approve"
      - "POST /appointments/{id}/md-decline"
      - "POST /adverse-events/{id}/review"
      - "POST /adverse-events/{id}/resolve"
    shared_operations:
      - "POST /adverse-events"
      - "POST /consents/{id}/revoke"
      - "GET (reads across resources)"

  - name: Nurse
    description: "Registered nurse who is dispatched to perform the infusion (start/complete) and may report adverse events. Identity-tracked; entity_backed by Nurse."
    identity: "entity_backed:Nurse"
    exclusive_operations:
      - "POST /appointments/{id}/start"
      - "POST /appointments/{id}/complete"
    shared_operations:
      - "POST /adverse-events"
      - "GET (reads across resources)"
