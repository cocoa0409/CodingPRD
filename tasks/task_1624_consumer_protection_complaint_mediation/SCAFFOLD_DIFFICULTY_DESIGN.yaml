              payload: {}
              as: UnitDirector
              as_user_id: "dir-2"
              captures: { e1: $.data.error_id }
            - call: "POST /consumer-protection/scam-alerts/${a2}/publish"
              payload: {}
              as: UnitDirector
              as_user_id: "dir-3"
              captures: { e2: $.data.error_id }
          assert:
            - "${e1} == ERR_SEGREGATION_OF_DUTIES (dir-2 drafted alert2; safety priority 7 beats constraint priority 8 despite the duplicate-active violation also holding)"
            - "${e2} == ERR_DUPLICATE_ACTIVE_ALERT (with SoD satisfied by dir-3, the constraint surfaces)"
            - "ScamAlert.${a2}.alert_status == DRAFT (both rejections leave state untouched)"
  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics + endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: d_boundary_filing_window_365
        grounds:
          - calculations.filing_window_check
          - validations[priority=7]
          - errors[ERR_FILING_WINDOW_EXPIRED]
        distinguishing_aspect: |
          Metric = whole days elapsed since incident, endpoint = POST complaints.
          (filed_at - incident_date) == 365 days exactly is eligible (<= rule);
          366 days is rejected — the boundary sits ON the allowed side.
        test_recipe:
          setup:
            - "Consumer and in-state business registered; clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /consumer-protection/consumers"
              payload: { full_name: "C W", email: "cw@x.com", state_code: "OR" }
              as: Anonymous
              captures: { con: $.data.id }
            - call: "POST /consumer-protection/businesses"
              payload: { legal_name: "WinCo", home_state: "OR", operates_in_states: ["OR"], naics_code: "454110" }
              as: Anonymous
              captures: { biz: $.data.id }
            - call: "POST /consumer-protection/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UnitDirector
            - call: "POST /consumer-protection/complaints"
              payload: { consumer_id: "${con}", business_id: "${biz}", incident_date: "2025-08-01", incident_state: "OR", category: "DECEPTIVE_PRACTICE", description: "exactly 365 days", amount_in_dispute_cents: 100 }
              as: Consumer
              as_user_id: "${con}"
              captures: { k1: $.data.id, jf: $.data.jurisdiction_factors }
            - call: "POST /consumer-protection/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: UnitDirector
          trigger:
            - call: "POST /consumer-protection/complaints"
              payload: { consumer_id: "${con}", business_id: "${biz}", incident_date: "2025-08-01", incident_state: "OR", category: "REFUND_REFUSAL", description: "366 days", amount_in_dispute_cents: 100 }
              as: Consumer
              as_user_id: "${con}"
              captures: { e: $.data.error_id }
          assert:
            - "Complaint.${k1} created at exactly 365 days: jurisdiction_factors.within_filing_window == true (2025-08-01 -> 2026-08-01 is 365 days, <= 365 allowed)"
            - "${e} == ERR_FILING_WINDOW_EXPIRED at 366 days (2025-08-01 -> 2026-08-02)"
      - name: d_boundary_response_deadline_instant
        grounds:
          - calculations.response_deadline_calc
          - entities.BusinessResponse.fields.is_late
          - entities.Complaint.fields.ever_response_overdue
        distinguishing_aspect: |
          Metric = second-precision timestamp vs deadline, endpoint = POST
          business-responses. submitted_at == response_deadline exactly is timely
          (<=); one second later the sweep has flipped the complaint to
          RESPONSE_OVERDUE and the response is late. Different metric and
          endpoint from the filing-window instance.
        test_recipe:
          setup:
            - "Two complaints K1, K2 on the same in-state business, both notified at 2026-08-01T00:00:00Z (deadline 2026-08-31T00:00:00Z)"
          setup_api_calls:
            - call: "POST /consumer-protection/consumers"
              payload: { full_name: "C T", email: "ct@x.com", state_code: "OR" }
              as: Anonymous
              captures: { con: $.data.id }
            - call: "POST /consumer-protection/businesses"
              payload: { legal_name: "TimeCo", home_state: "OR", operates_in_states: ["OR"], naics_code: "454110" }
              as: Anonymous
              captures: { biz: $.data.id }
            - call: "POST /consumer-protection/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UnitDirector
            - call: "POST /consumer-protection/complaints"
              payload: { consumer_id: "${con}", business_id: "${biz}", incident_date: "2026-07-01", incident_state: "OR", category: "REFUND_REFUSAL", description: "k1", amount_in_dispute_cents: 100 }
              as: Consumer
              as_user_id: "${con}"
              captures: { k1: $.data.id }
            - call: "POST /consumer-protection/complaints/${k1}/screen"
              payload: { decision: "ACCEPT" }
              as: IntakeOfficer
              as_user_id: "officer-1"
            - call: "POST /consumer-protection/complaints/${k1}/notify-business"
              payload: {}
              as: IntakeOfficer
              as_user_id: "officer-1"
              captures: { dl1: $.data.response_deadline }
            - call: "POST /consumer-protection/complaints"
              payload: { consumer_id: "${con}", business_id: "${biz}", incident_date: "2026-07-02", incident_state: "OR", category: "REFUND_REFUSAL", description: "k2", amount_in_dispute_cents: 100 }
              as: Consumer
              as_user_id: "${con}"
              captures: { k2: $.data.id }
            - call: "POST /consumer-protection/complaints/${k2}/screen"
              payload: { decision: "ACCEPT" }
              as: IntakeOfficer
              as_user_id: "officer-1"
            - call: "POST /consumer-protection/complaints/${k2}/notify-business"
              payload: {}
              as: IntakeOfficer
              as_user_id: "officer-1"
            - call: "POST /consumer-protection/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: UnitDirector
          trigger:
            - call: "POST /consumer-protection/complaints/${k1}/business-responses"
              payload: { response_text: "on the dot" }
              as: Business
              as_user_id: "${biz}"
              captures: { late1: $.data.is_late }
            - call: "POST /consumer-protection/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:01Z" }
              as: UnitDirector
            - call: "POST /consumer-protection/complaints/${k2}/business-responses"
              payload: { response_text: "one second late" }
              as: Business
              as_user_id: "${biz}"
              captures: { late2: $.data.is_late }
            - call: "GET /consumer-protection/complaints/${k1}"
              payload: {}
              as: IntakeOfficer
              captures: { cs1: $.data.case_status, ev1: $.data.ever_response_overdue }
            - call: "GET /consumer-protection/complaints/${k2}"
              payload: {}
              as: IntakeOfficer
              captures: { cs2: $.data.case_status, ev2: $.data.ever_response_overdue }
          assert:
            - "${dl1} == 2026-08-31T00:00:00Z (in-state: notified_at + 30 days)"
            - "${late1} == false and ${cs1} == RESPONSE_RECEIVED and ${ev1} == false (submitted_at == deadline is timely; sweep did not flip at equality)"
            - "${late2} == true and ${ev2} == true and ${cs2} == RESPONSE_RECEIVED (one second past: sweep flipped K2 to RESPONSE_OVERDUE, late response still accepted)"
  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: d_xstate_complaint_needs_sufficient_response
        grounds:
          - state_machines.Complaint.RESPONSE_RECEIVED_to_MEDIATION_OFFERED
          - state_machines.BusinessResponse.SUBMITTED_to_INSUFFICIENT_RETURNED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Pair Complaint <- BusinessResponse: offer-mediation requires the LATEST
          BusinessResponse to be SUFFICIENT; after an INSUFFICIENT review the
          complaint reverts to BUSINESS_NOTIFIED and the transition is rejected
          until a resubmission is reviewed SUFFICIENT.
        test_recipe:
          setup:
            - "Complaint in RESPONSE_RECEIVED whose only response was just reviewed INSUFFICIENT (complaint reverted to BUSINESS_NOTIFIED)"
          setup_api_calls:
            - call: "POST /consumer-protection/consumers"
              payload: { full_name: "C G", email: "cg@x.com", state_code: "OR" }
              as: Anonymous
              captures: { con: $.data.id }
            - call: "POST /consumer-protection/businesses"
              payload: { legal_name: "GateCo", home_state: "OR", operates_in_states: ["OR"], naics_code: "454110" }
              as: Anonymous
              captures: { biz: $.data.id }
            - call: "POST /consumer-protection/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UnitDirector
            - call: "POST /consumer-protection/complaints"
              payload: { consumer_id: "${con}", business_id: "${biz}", incident_date: "2026-07-01", incident_state: "OR", category: "DEFECTIVE_PRODUCT", description: "gate", amount_in_dispute_cents: 300 }
              as: Consumer
              as_user_id: "${con}"
              captures: { k: $.data.id }
            - call: "POST /consumer-protection/complaints/${k}/screen"
              payload: { decision: "ACCEPT" }
              as: IntakeOfficer
              as_user_id: "officer-1"
            - call: "POST /consumer-protection/complaints/${k}/notify-business"
              payload: {}
              as: IntakeOfficer
              as_user_id: "officer-1"
            - call: "POST /consumer-protection/complaints/${k}/business-responses"
              payload: { response_text: "deny everything" }
              as: Business
              as_user_id: "${biz}"
              captures: { r1: $.data.id }
            - call: "POST /consumer-protection/business-responses/${r1}/review"
              payload: { verdict: "INSUFFICIENT" }
              as: IntakeOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /consumer-protection/complaints/${k}/offer-mediation"
              payload: {}
              as: IntakeOfficer
              as_user_id: "officer-1"
              captures: { e: $.data.error_id }
            - call: "POST /consumer-protection/complaints/${k}/business-responses"
              payload: { response_text: "full answer with remedy" }
              as: Business
              as_user_id: "${biz}"
              captures: { r2: $.data.id, att2: $.data.attempt_number }
            - call: "POST /consumer-protection/business-responses/${r2}/review"
              payload: { verdict: "SUFFICIENT" }
              as: IntakeOfficer
              as_user_id: "officer-1"
            - call: "POST /consumer-protection/complaints/${k}/offer-mediation"
              payload: {}
              as: IntakeOfficer
              as_user_id: "officer-1"
              captures: { st: $.data.case_status }
          assert:
            - "${e} == ERR_INVALID_STATE (complaint reverted to BUSINESS_NOTIFIED because the response was INSUFFICIENT)"
            - "${att2} == 2 (resubmission counted on the complaint)"
            - "${st} == MEDIATION_OFFERED once the latest response is SUFFICIENT"
      - name: d_xstate_offer_accept_needs_active_complaint
        grounds:
          - state_machines.SettlementOffer.TENDERED_to_ACCEPTED
          - state_machines.Complaint.MEDIATION_ACTIVE_to_REFERRED_ENFORCEMENT
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Pair SettlementOffer <- Complaint (different pair from the response-gate
          instance): accepting a TENDERED offer requires the complaint in
          {MEDIATION_ACTIVE, MEDIATION_IMPASSE}; after referral the complaint is
          REFERRED_ENFORCEMENT and the accept is rejected even though the offer
          itself is still TENDERED and unexpired.
        test_recipe:
          setup:
            - "Complaint in MEDIATION_ACTIVE with offer TENDERED by the business; complaint then referred to enforcement by the mediator"
