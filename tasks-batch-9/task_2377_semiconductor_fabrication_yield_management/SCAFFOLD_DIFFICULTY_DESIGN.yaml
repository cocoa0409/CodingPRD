  # =====================================================================
  # R3 — non_linear_state_machine
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: change_request_revision_cycle_then_third_request_rejects
        grounds:
          - state_machines.RecipeChangeRequest.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.RecipeChangeRequest.REVISION_REQUESTED_to_SUBMITTED
          - state_machines.RecipeChangeRequest.SUBMITTED_to_REJECTED
          - calculations.recipe_change_risk_score
          - entities.RecipeChangeRequest.fields.revision_round
        distinguishing_aspect: |
          Non-linearity on the RecipeChangeRequest entity: SUBMITTED -> REVISION_REQUESTED ->
          SUBMITTED is a genuine cycle, and the very same trigger
          (POST /fab/change-requests/{id}/request-revision) branches to two different target
          states depending on the accumulated revision_round — REVISION_REQUESTED while
          revision_round < MAX_REVISION_ROUNDS (2), REJECTED once it reaches 2.
        test_recipe:
          setup:
            - "Recipe ETCH-100 exists with target_value 100.00, status QUALIFIED, revision 1."
            - "No lots exist, so impact_lot_count is 0 and a MAJOR change of 100.00 -> 110.00 scores exactly 60.00 (35.00 class + 25.00 saturated delta), below REQUAL_THRESHOLD."
            - "Change notice CR-1 has just been authored by u_pe_1 and is SUBMITTED with revision_round 0."
            - "The logical clock is untouched and reads 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /fab/recipes"
              payload: { recipe_code: "ETCH-100", tool_type: "ETCH", target_value: 100.00, qual_expiry_days: 100 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { r_etch: $.data.id }
            - call: "POST /fab/recipes/${r_etch}/change-requests"
              payload: { change_class: "MAJOR", proposed_target: 110.00, justification: "Widen etch depth by 10 percent" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { cr: $.data.id, cr_score: $.data.risk_score, cr_requal: $.data.requires_full_requal }
          trigger:
            - call: "POST /fab/change-requests/${cr}/request-revision"
              payload: { reviewer_comment: "Attach split-lot evidence" }
              as: QualityManager
              as_user_id: "u_qm_1"
              captures: { st1: $.data.status, rr1: $.data.revision_round }
            - call: "POST /fab/change-requests/${cr}/resubmit"
              payload: { change_class: "MAJOR", proposed_target: 110.00, justification: "Split-lot evidence attached" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { st2: $.data.status, rr2: $.data.revision_round }
            - call: "POST /fab/change-requests/${cr}/request-revision"
              payload: { reviewer_comment: "Evidence covers only one tool" }
              as: QualityManager
              as_user_id: "u_qm_1"
              captures: { st3: $.data.status, rr3: $.data.revision_round }
            - call: "POST /fab/change-requests/${cr}/resubmit"
              payload: { change_class: "MAJOR", proposed_target: 110.00, justification: "Evidence extended to both tools" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { st4: $.data.status, rr4: $.data.revision_round }
            - call: "POST /fab/change-requests/${cr}/request-revision"
              payload: { reviewer_comment: "Third pass — closing the notice" }
              as: QualityManager
              as_user_id: "u_qm_1"
              captures: { st5: $.data.status, rr5: $.data.revision_round }
          assert:
            - "${cr_score} == 60.00"
            - "${cr_requal} == false"
            - "${st1} == REVISION_REQUESTED"
            - "${rr1} == 0"
            - "${st2} == SUBMITTED"
            - "${rr2} == 1"
            - "${st3} == REVISION_REQUESTED"
            - "${rr3} == 1"
            - "${st4} == SUBMITTED"
            - "${rr4} == 2"
            - "${st5} == REJECTED"
            - "${rr5} == 2"
            - "${st1} == ${st3}"
            - "${st5} != ${st3}"
            - "Recipe.${r_etch}.status == QUALIFIED"
            - "Recipe.${r_etch}.revision == 1"
            - "Recipe.${r_etch}.target_value == 100.00"
            - "RecipeChangeRequest.${cr}.approver_user_id == null"

      - name: chamber_qualification_cycles_through_disqualification_and_pm
        grounds:
          - state_machines.Chamber.QUALIFIED_to_DISQUALIFIED
          - state_machines.Chamber.DISQUALIFIED_to_UNQUALIFIED
          - state_machines.Chamber.UNQUALIFIED_to_QUALIFIED
          - state_machines.StepRun.OPEN_to_ABORTED
          - calculations.equipment_capacity_hours_ledger
        distinguishing_aspect: |
          Non-linearity on a different entity, Chamber: the cycle QUALIFIED -> DISQUALIFIED ->
          UNQUALIFIED -> QUALIFIED re-enters QUALIFIED through a different in-edge than the one it
          left by, and DISQUALIFIED can only be left via the parent Equipment's pm-complete —
          a state whose exit is owned by a sibling entity, not by the chamber's own endpoints.
        test_recipe:
          setup:
            - "FLOW-A RELEASED (seq 10 LITHO 2.0h, seq 20 ETCH 3.0h metrology-required with rework target seq 10, seq 30 LITHO 2.0h) with an SPC chart on seq 20 (target 100.00, sigma 2.00, usl 110.00, lsl 90.00, ucl 106.00, lcl 94.00)."
            - "LITHO-1/CH_L1 and ETCH-1/CH_E1 both QUALIFIED at 2026-08-01T00:00:00Z with a 100-day expiry; ETCH-1 has purge_buffer_hours 24.0."
            - "Operator OP-001 certified for LITHO/ETCH/CMP and GOWNED."
            - "PLAN-A COMMITTED; LOT-001 (3 wafers, STANDARD) released, step seq 10 tracked out, and an OPEN step-seq-20 run on CH_E1 (ETCH-1 PRODUCTIVE, available_capacity_hours 717.00)."
