  - rule_id: resource_temporal_overlap
    instances:

      - name: label_display_window_half_open_adjacency_allowed
        grounds:
          - validations.priority_60
          - errors.ERR_LABEL_WINDOW_OVERLAP
          - calculations.effective_label_selection
          - entities.LabelVersion.fields.effective_until
        distinguishing_aspect: |
          Occupied resource: the *display timeline of one ServicePlan*, with half-open
          [effective_from, effective_until) semantics and a null upper bound meaning +infinity, so
          exact adjacency is legal and any strict straddle is refused. Capacity is one: a second
          window on the same instant is simply illegal.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (the scaffold default 2026-08-01T00:00:00Z is repositioned first)."
            - "ServicePlan FIBER300 (advertised 300/140, intro 4999 for 6 months, post-promotional 7999, ETF 12000 PRORATED_MONTHLY, required_locales [en-US])."
