# =============================================================================
# PRD Benchmark Seed Tables - task_1500_artist_management_commission_accounting
# =============================================================================

scenario: |
  Artist Management & Commission Accounting (artist management firm): income stream
  tracking (touring/recording/publishing/endorsement), commission rate by income type
  & post-term sunset provisions, expense reimbursement & advance recoupment, team
  coordination (agent/business manager/publicist) & approvals, career calendar &
  opportunity evaluation, contract negotiation & option management, statement
  production for artist, dispute & audit rights

domain_name: artist-management-commission
api_prefix: /

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate, self_referential, polymorphic]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Section 1.0 Response Envelope (FIXED - verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Section 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Artist
    parent: null
    common_fields: true
    fields:
      - { name: stage_name, type: string, source: input, description: "Artist stage/professional name" }
      - { name: legal_name, type: string, source: input, description: "Legal name for contracts" }
      - { name: primary_genre, type: string, source: input, description: "Primary genre or discipline" }
      - { name: home_currency, type: string, source: input, default: "USD", description: "ISO currency for statements" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ON_HIATUS | ARCHIVED", constraints: "enum: ACTIVE, ON_HIATUS, ARCHIVED; initial ACTIVE" }
      - { name: current_agreement_id, type: string, source: system, description: "Pointer to the Agreement currently in ACTIVE status for this artist (null when none); kept in sync by activate/supersede transitions" }
      - { name: unrecouped_advance_balance_cents, type: integer, source: computed, description: "Sum of outstanding_cents over this artist's Advances with status ACTIVE" }
      - { name: lifetime_gross_cents, type: integer, source: computed, description: "Sum of gross_amount_cents over non-VOIDED IncomeEvents of this artist" }
      - { name: lifetime_commission_cents, type: integer, source: computed, description: "Sum of commission_amount_cents over VERIFIED/SETTLED/POSTED IncomeEvents of this artist" }
      - { name: lifetime_disbursed_cents, type: integer, source: computed, description: "Sum of disbursed_cents over FINALIZED Statements of this artist" }

  - name: Agreement
    parent: null
    common_fields: true
    fields:
      - { name: artist_id, type: string, source: input, description: "FK -> Artist.id; the managed artist" }
      - { name: prior_agreement_id, type: string, source: system, description: "FK -> Agreement.id; self-referential supersede chain (null for first agreement)", constraints: "nullable" }
      - { name: term_start_date, type: string, source: input, description: "ISO date; first day of term (inclusive)" }
      - { name: term_end_date, type: string, source: input, description: "ISO date; last day of term (inclusive)" }
      - { name: termination_date, type: string, source: system, description: "ISO date of early termination; null unless TERMINATED", constraints: "nullable" }
      - { name: touring_commission_base, type: enum, source: input, default: "GROSS", description: "Variant selector for commission_amount on TOURING events: GROSS | NET_OF_EXPENSES", constraints: "enum: GROSS, NET_OF_EXPENSES" }
      - { name: recoupment_policy, type: enum, source: input, default: "FIFO", description: "Variant selector for advance_recoupment_waterfall: FIFO | PRO_RATA", constraints: "enum: FIFO, PRO_RATA" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUPERSEDED | TERMINATED | EXPIRED | SUNSET | CLOSED", constraints: "enum set; initial DRAFT" }
      - { name: sunset_start_date, type: string, source: computed, description: "ISO date when sunset window opens: term_end_date+1 day, or termination_date+1 day when TERMINATED, or supersede date when SUPERSEDED; null while DRAFT/ACTIVE", constraints: "nullable" }
      - { name: sunset_end_date, type: string, source: computed, description: "ISO date: sunset_start_date + max(sunset_months over this agreement's CommissionRateSchedules) - 1 day; null when max sunset_months == 0", constraints: "nullable" }

  - name: CommissionRateSchedule
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> Agreement.id" }
      - { name: income_type, type: enum, source: input, description: "TOURING | RECORDING | PUBLISHING | ENDORSEMENT", constraints: "enum: TOURING, RECORDING, PUBLISHING, ENDORSEMENT" }
      - { name: in_term_rate_bps, type: integer, source: input, description: "Commission rate in basis points while income is IN_TERM", constraints: "0..10000" }
      - { name: sunset_rate_bps, type: integer, source: input, description: "Reduced rate in basis points applied to SUNSET income", constraints: "0..10000; must be <= in_term_rate_bps" }
      - { name: sunset_months, type: integer, source: input, description: "Post-term months this income type stays commissionable at sunset rate", constraints: ">= 0" }
      - { name: effective_from_date, type: string, source: input, description: "ISO date; half-open window start (inclusive)" }
      - { name: effective_to_date, type: string, source: input, description: "ISO date; half-open window end (exclusive); null = open-ended", constraints: "nullable; must be > effective_from_date when set" }

  - name: IncomeEvent
    parent: null
    common_fields: true
    fields:
      - { name: artist_id, type: string, source: input, description: "FK -> Artist.id" }
      - { name: agreement_id, type: string, source: system, description: "FK -> Agreement.id; resolved server-side at creation: among the artist's agreements with term_start_date <= recognition_date, the one with the greatest term_start_date, ties broken by created_at ASC (sunset-expired agreements still resolve, yielding POST_TERM_EXEMPT at verify); ERR_NO_COVERING_AGREEMENT when no such agreement exists" }
      - { name: linked_engagement_id, type: string, source: input, description: "FK -> Engagement.id; set when this income pays out a booked engagement", constraints: "nullable" }
      - { name: parent_event_id, type: string, source: input, description: "FK -> IncomeEvent.id; self-referential: required when kind == ADJUSTMENT", constraints: "nullable" }
      - { name: kind, type: enum, source: input, default: "ORIGINAL", description: "ORIGINAL | ADJUSTMENT", constraints: "enum: ORIGINAL, ADJUSTMENT" }
      - { name: income_type, type: enum, source: input, description: "TOURING | RECORDING | PUBLISHING | ENDORSEMENT", constraints: "enum set" }
      - { name: source_name, type: string, source: input, description: "Payer/counterparty name (promoter, label, PRO, brand)" }
      - { name: gross_amount_cents, type: integer, source: input, description: "Gross billed amount", constraints: "> 0" }
      - { name: recognition_date, type: string, source: input, description: "ISO date the income was earned (drives rate selection and accrual inclusion)" }
      - { name: received_date, type: string, source: system, description: "ISO date cash settled; null until settle", constraints: "nullable" }
      - { name: received_amount_cents, type: integer, source: system, description: "Cash actually received; set at settle", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "REPORTED | VERIFIED | SETTLED | POSTED | VOIDED", constraints: "enum set; initial REPORTED" }
      - { name: term_relation, type: enum, source: computed, description: "IN_TERM | SUNSET | POST_TERM_EXEMPT per commission_rate_resolution; null until verify", constraints: "nullable" }
      - { name: applied_schedule_id, type: string, source: system, description: "FK -> CommissionRateSchedule.id pinned at verify (rate snapshot)", constraints: "nullable" }
      - { name: applied_rate_bps, type: integer, source: system, description: "Rate actually applied, pinned at verify", constraints: "nullable" }
      - { name: commission_amount_cents, type: integer, source: computed, description: "round_half_up(commission base * applied_rate_bps / 10000), pinned at verify" }
      - { name: artist_net_cents, type: integer, source: computed, description: "gross_amount_cents - commission_amount_cents, pinned at verify" }
      - { name: recouped_amount_cents, type: integer, source: computed, description: "Total recouped from this event's cash share at settle; 0 until settled", default: 0 }
      - { name: artist_payable_cents, type: integer, source: computed, description: "received_amount_cents - commission_amount_cents - recouped_amount_cents; null until settle", constraints: "nullable" }
      - { name: statement_id, type: string, source: system, description: "FK -> Statement.id once this event is posted as an INCOME line on an issued statement; null before", constraints: "nullable" }
      - { name: recoup_statement_id, type: string, source: system, description: "FK -> Statement.id once this event's recouped_amount_cents is swept as an ADVANCE_RECOUPMENT line; null before", constraints: "nullable" }
      - { name: reported_by_user_id, type: string, source: system, description: "X-User-ID of creator; segregation-of-duties anchor for verify" }

  - name: Advance
    parent: null
    common_fields: true
    fields:
      - { name: artist_id, type: string, source: input, description: "FK -> Artist.id" }
      - { name: principal_cents, type: integer, source: input, description: "Advance principal paid to artist", constraints: "> 0" }
      - { name: issued_date, type: string, source: input, description: "ISO date the advance was issued (FIFO ordering key)" }
      - { name: recoup_pct_bps, type: integer, source: input, default: 10000, description: "Share of each settled event's cash share applied to this advance (10000 = 100%)", constraints: "1..10000" }
      - { name: applies_to_income_types, type: array, source: input, default: [], description: "Empty = cross-collateralized against all income types; otherwise restricts recoupment to listed types", constraints: "subset of TOURING, RECORDING, PUBLISHING, ENDORSEMENT" }
      - { name: recouped_cents, type: integer, source: computed, description: "Total recouped so far via the waterfall", default: 0 }
      - { name: written_off_cents, type: integer, source: system, description: "Amount forgiven at write-off", default: 0 }
      - { name: outstanding_cents, type: integer, source: computed, description: "principal_cents - recouped_cents - written_off_cents" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RECOUPED | WRITTEN_OFF", constraints: "enum set; initial ACTIVE" }

  - name: Expense
    parent: null
    common_fields: true
    fields:
      - { name: artist_id, type: string, source: input, description: "FK -> Artist.id; artist on whose behalf the expense was incurred" }
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id; links production costs to a booking (drives NET_OF_EXPENSES commission base)", constraints: "nullable" }
      - { name: category, type: enum, source: input, description: "TRAVEL | PRODUCTION | MARKETING | LEGAL | OTHER", constraints: "enum set" }
      - { name: amount_cents, type: integer, source: input, description: "Expense amount", constraints: "> 0" }
      - { name: incurred_date, type: string, source: input, description: "ISO date the cost was incurred" }
      - { name: description, type: string, source: input, description: "Free-text description" }
      - { name: status, type: enum, source: system, description: "PENDING_APPROVAL | APPROVED | REJECTED | REIMBURSED", constraints: "enum set; initial PENDING_APPROVAL" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of creator; segregation-of-duties anchor for approvals" }
      - { name: rejection_note, type: string, source: system, description: "Note from rejecting approver", constraints: "nullable" }
      - { name: reimbursed_statement_id, type: string, source: system, description: "FK -> Statement.id once swept onto an issued statement as EXPENSE_REIMBURSEMENT line", constraints: "nullable" }

  - name: ApprovalRequest
    parent: null
    common_fields: true
    fields:
      - { name: artist_id, type: string, source: system, description: "FK -> Artist.id; copied from the target resource for scoping" }
      - { name: target_type, type: enum, source: system, description: "EXPENSE | OPPORTUNITY", constraints: "enum set" }
      - { name: target_id, type: string, source: system, description: "Polymorphic reference resolved via target_type: EXPENSE -> Expense.id; OPPORTUNITY -> Opportunity.id" }
      - { name: required_approver, type: enum, source: system, description: "Role that must decide: BUSINESS_MANAGER | ARTIST | FIRM_ADMIN", constraints: "enum set" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | REJECTED | CANCELLED", constraints: "enum set; initial PENDING" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID whose action raised this request (submitter or negotiator)" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of decider; null while PENDING", constraints: "nullable" }
      - { name: decision_note, type: string, source: input, description: "Optional note supplied at decision time", constraints: "nullable" }

  - name: Opportunity
    parent: null
    common_fields: true
    fields:
      - { name: artist_id, type: string, source: input, description: "FK -> Artist.id" }
      - { name: income_type, type: enum, source: input, description: "TOURING | RECORDING | PUBLISHING | ENDORSEMENT", constraints: "enum set" }
      - { name: counterparty_name, type: string, source: input, description: "Offeror (promoter, label, brand)" }
      - { name: proposed_value_cents, type: integer, source: input, description: "Initial offered value", constraints: "> 0" }
      - { name: current_value_cents, type: integer, source: system, description: "Value under negotiation; starts equal to proposed_value_cents; mutated by counter-offer" }
      - { name: offer_expiry_date, type: string, source: input, description: "ISO date; offer lapses when the logical clock date passes it" }
      - { name: proposed_window_start, type: string, source: input, description: "ISO datetime; proposed engagement window start" }
      - { name: proposed_window_end, type: string, source: input, description: "ISO datetime; proposed engagement window end (must be > start)" }
      - { name: fit_score, type: integer, source: input, description: "Subjective strategic fit 0..100 supplied by the agent", constraints: "0..100" }
      - { name: evaluation_score, type: integer, source: computed, description: "0..100 weighted score from opportunity_evaluation_score; null until first evaluation", constraints: "nullable" }
      - { name: recommendation, type: enum, source: computed, description: "PURSUE | CONSIDER | PASS_SUGGESTED; null until first evaluation", constraints: "nullable" }
      - { name: requires_artist_approval, type: boolean, source: computed, description: "true iff current_value_cents > ARTIST_APPROVAL_THRESHOLD_CENTS (10000000)" }
      - { name: round_number, type: integer, source: system, description: "Negotiation round counter; 0 at creation, +1 per counter-offer", default: 0 }
      - { name: status, type: enum, source: system, description: "RECEIVED | UNDER_EVALUATION | NEGOTIATING | ACCEPTED | CONVERTED | DECLINED | WITHDRAWN | EXPIRED", constraints: "enum set; initial RECEIVED" }
      - { name: converted_engagement_id, type: string, source: system, description: "FK -> Engagement.id created by convert; null until CONVERTED", constraints: "nullable" }

  - name: Engagement
    parent: null
    common_fields: true
    fields:
      - { name: artist_id, type: string, source: input, description: "FK -> Artist.id" }
      - { name: opportunity_id, type: string, source: input, description: "FK -> Opportunity.id; set when this engagement is a hold for / conversion of an opportunity", constraints: "nullable" }
      - { name: income_type, type: enum, source: input, description: "TOURING | RECORDING | PUBLISHING | ENDORSEMENT", constraints: "enum set" }
      - { name: counterparty_name, type: string, source: input, description: "Promoter / studio / brand" }
      - { name: start_datetime, type: string, source: input, description: "ISO datetime engagement starts" }
      - { name: end_datetime, type: string, source: input, description: "ISO datetime engagement ends (must be > start_datetime)" }
      - { name: travel_buffer_hours, type: integer, source: input, default: 24, description: "Buffer applied BOTH sides of the window for overlap detection", constraints: ">= 0" }
      - { name: guarantee_cents, type: integer, source: input, description: "Guaranteed pay for the engagement", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "HOLD | CONFIRMED | COMPLETED | SETTLED | CANCELLED | RELEASED", constraints: "enum set; initial HOLD (CONFIRMED when created by opportunity convert or option exercise)" }
      - { name: confirmed_at, type: string, source: system, description: "ISO datetime of HOLD->CONFIRMED (or creation when born CONFIRMED); sunset eligibility anchor", constraints: "nullable" }

  - name: Option
    parent: null
    common_fields: true
    fields:
      - { name: artist_id, type: string, source: input, description: "FK -> Artist.id" }
      - { name: agreement_id, type: string, source: input, description: "FK -> Agreement.id; the agreement granting the option" }
      - { name: source_opportunity_id, type: string, source: input, description: "FK -> Opportunity.id the option was negotiated from", constraints: "nullable" }
      - { name: option_type, type: enum, source: input, description: "RECORDING_CYCLE | ENDORSEMENT_RENEWAL | TOUR_LEG | MERCHANDISE", constraints: "enum set" }
      - { name: income_type, type: enum, source: input, description: "Income type of the resulting engagement: TOURING | RECORDING | PUBLISHING | ENDORSEMENT", constraints: "enum set" }
      - { name: exercise_window_start, type: string, source: input, description: "ISO datetime; exercise allowed at or after this instant (inclusive)" }
      - { name: exercise_window_end, type: string, source: input, description: "ISO datetime; exercise allowed at or before this instant (inclusive); must be > start" }
      - { name: engagement_start_datetime, type: string, source: input, description: "ISO datetime; window start of the engagement created by exercise" }
      - { name: engagement_end_datetime, type: string, source: input, description: "ISO datetime; window end of the engagement created by exercise (must be > start)" }
      - { name: exercise_value_cents, type: integer, source: input, description: "Guarantee carried onto the engagement created by exercise", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "OPEN | EXERCISED | LAPSED | WAIVED", constraints: "enum set; initial OPEN" }
      - { name: exercised_engagement_id, type: string, source: system, description: "FK -> Engagement.id created by exercise; null until EXERCISED", constraints: "nullable" }

  - name: TeamMember
    parent: null
    common_fields: true
    fields:
      - { name: artist_id, type: string, source: input, description: "FK -> Artist.id; the artist this team member serves (scope anchor for entity-backed roles)" }
      - { name: member_role, type: enum, source: input, description: "AGENT | BUSINESS_MANAGER | PUBLICIST", constraints: "enum set" }
      - { name: display_name, type: string, source: input, description: "Person name" }
      - { name: authority_expense_cap_cents, type: integer, source: input, default: 100000, description: "Max expense amount this member may APPROVE (BUSINESS_MANAGER only)", constraints: ">= 0" }
      - { name: window_start_date, type: string, source: input, description: "ISO date the assignment becomes effective" }
      - { name: window_end_date, type: string, source: input, description: "ISO date the assignment ends; null = open-ended", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | ENDED", constraints: "enum set; initial ACTIVE" }

  - name: Statement
    parent: null
    common_fields: true
    fields:
      - { name: artist_id, type: string, source: input, description: "FK -> Artist.id" }
      - { name: prior_statement_id, type: string, source: system, description: "FK -> Statement.id; self-referential carry chain: the latest non-DISCARDED statement of this artist with period_end_date < this period_start_date; null for the first", constraints: "nullable" }
      - { name: period_start_date, type: string, source: input, description: "ISO date; closed interval start (inclusive)" }
      - { name: period_end_date, type: string, source: input, description: "ISO date; closed interval end (inclusive); must be >= start and <= clock date" }
      - { name: basis, type: enum, source: input, description: "ACCRUAL | CASH - dual-variant inclusion rule for INCOME lines", constraints: "enum: ACCRUAL, CASH" }
      - { name: revision_number, type: integer, source: system, description: "1 at generation; +1 per amendment", default: 1 }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | DISPUTED | ACKNOWLEDGED | FINALIZED | DISCARDED", constraints: "enum set; initial DRAFT" }
      - { name: issued_at, type: string, source: system, description: "ISO datetime of DRAFT->ISSUED (also reset by each amendment re-issue)", constraints: "nullable" }
      - { name: dispute_window_ends_at, type: string, source: system, description: "issued_at + 30 days; disputes accepted while clock <= this instant", constraints: "nullable" }
      - { name: rate_snapshot, type: array, source: system, description: "Pinned [{income_type, schedule_id, rate_bps}] per INCOME line at generation; amendments never re-derive pinned lines" }
      - { name: gross_total_cents, type: integer, source: computed, description: "Sum of gross over INCOME lines" }
      - { name: commission_total_cents, type: integer, source: computed, description: "Sum of commission over INCOME lines (already-rounded per-event values)" }
      - { name: income_net_total_cents, type: integer, source: computed, description: "Sum of artist_net over INCOME lines" }
      - { name: expense_total_cents, type: integer, source: computed, description: "Sum of EXPENSE_REIMBURSEMENT lines" }
      - { name: recoup_total_cents, type: integer, source: computed, description: "Sum of ADVANCE_RECOUPMENT lines" }
      - { name: adjustment_total_cents, type: integer, source: computed, description: "Signed sum of ADJUSTMENT lines (audit findings, audit-cost recovery, dispute awards)", default: 0 }
      - { name: carry_in_cents, type: integer, source: system, description: "carry_out_cents of prior_statement_id at generation; 0 for first statement" }
      - { name: net_payable_cents, type: integer, source: computed, description: "income_net_total - expense_total - recoup_total + adjustment_total + carry_in" }
      - { name: disbursed_cents, type: integer, source: computed, description: "net_payable if >= MIN_DISBURSEMENT_CENTS (50000), else 0", default: 0 }
      - { name: carry_out_cents, type: integer, source: computed, description: "net_payable - disbursed (negative net_payable carries as debt)", default: 0 }

  - name: StatementLine
    parent: null
    common_fields: false
    fields:
      - { name: statement_id, type: string, source: system, description: "FK -> Statement.id" }
      - { name: line_type, type: enum, source: system, description: "INCOME | EXPENSE_REIMBURSEMENT | ADVANCE_RECOUPMENT | ADJUSTMENT", constraints: "enum set" }
      - { name: ref_id, type: string, source: system, description: "Polymorphic reference resolved via line_type: INCOME -> IncomeEvent.id; EXPENSE_REIMBURSEMENT -> Expense.id; ADVANCE_RECOUPMENT -> IncomeEvent.id (the settled event); ADJUSTMENT -> Dispute.id or Audit.id" }
      - { name: amount_cents, type: integer, source: system, description: "Signed line amount: INCOME/ADJUSTMENT may be positive; EXPENSE_REIMBURSEMENT/ADVANCE_RECOUPMENT stored positive and subtracted by the totals calc; ADJUSTMENT signed" }
      - { name: commission_cents, type: integer, source: system, description: "Commission component (INCOME lines only; else 0)", default: 0 }
      - { name: note, type: string, source: system, description: "Human-readable derivation note" }

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - { name: artist_id, type: string, source: input, description: "FK -> Artist.id" }
      - { name: statement_id, type: string, source: input, description: "FK -> Statement.id under dispute" }
      - { name: reason, type: enum, source: input, description: "COMMISSION_RATE | INCOME_MISSING | EXPENSE_UNAUTHORIZED | RECOUPMENT_ERROR | SUNSET_MISCLASSIFIED | OTHER", constraints: "enum set" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Amount the artist contests", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "OPEN | UNDER_REVIEW | RESOLVED_UPHELD | RESOLVED_REJECTED | WITHDRAWN | ESCALATED", constraints: "enum set; initial OPEN" }
      - { name: awarded_amount_cents, type: integer, source: system, description: "Net amount owed back to the artist, set when RESOLVED_UPHELD (commission-free)", constraints: "nullable" }
      - { name: resolution_note, type: string, source: input, description: "Resolution note supplied at resolve", constraints: "nullable" }

  - name: Audit
    parent: null
    common_fields: true
    fields:
      - { name: artist_id, type: string, source: input, description: "FK -> Artist.id" }
      - { name: scope_statement_id, type: string, source: input, description: "FK -> Statement.id under audit" }
      - { name: source_dispute_id, type: string, source: system, description: "FK -> Dispute.id when the audit arose from an escalation; null for direct audit demands", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "REQUESTED | IN_PROGRESS | FINDINGS_ISSUED | CLOSED", constraints: "enum set; initial REQUESTED" }
      - { name: findings_underpayment_cents, type: integer, source: input, description: "Underpayment found by the auditor (>= 0); set at issue-findings" }
      - { name: audit_cost_cents, type: integer, source: input, description: "Cost of the audit (>= 0); set at issue-findings" }
      - { name: cost_bearer, type: enum, source: computed, description: "FIRM | ARTIST per audit_cost_allocation; null until findings issued", constraints: "nullable" }
      - { name: underpayment_applied, type: boolean, source: system, description: "true once findings_underpayment_cents has been swept onto a generated statement as a positive ADJUSTMENT", default: false }
      - { name: cost_applied, type: boolean, source: system, description: "true once an ARTIST-borne audit_cost_cents has been swept as a negative ADJUSTMENT", default: false }
      - { name: reopen_count, type: integer, source: system, description: "Number of artist re-openings; max 2", default: 0 }

# =============================================================================
# Section 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Artist
    initial_state: ACTIVE
    terminal_states: [ARCHIVED]
    transitions:
      - from: ACTIVE
        to: ON_HIATUS
        trigger: "PATCH /artists/{id} with status=ON_HIATUS"
        actor: FirmAdmin
        preconditions: ["Artist.status == ACTIVE (ERR_INVALID_STATE otherwise)"]
        side_effects: ["increments Artist.version by 1"]
      - from: ON_HIATUS
        to: ACTIVE
        trigger: "PATCH /artists/{id} with status=ACTIVE"
        actor: FirmAdmin
        preconditions: ["Artist.status == ON_HIATUS (ERR_INVALID_STATE otherwise)"]
        side_effects: ["increments Artist.version by 1"]
      - from: ACTIVE
        to: ARCHIVED
        trigger: "PATCH /artists/{id} with status=ARCHIVED"
        actor: FirmAdmin
        preconditions: ["Artist.status in {ACTIVE, ON_HIATUS} (ERR_INVALID_STATE otherwise)"]
        side_effects:
          - "increments Artist.version by 1"
          - "Cascade down: TeamMembers of this artist in ACTIVE/SUSPENDED -> ENDED"
      - from: ON_HIATUS
        to: ARCHIVED
        trigger: "PATCH /artists/{id} with status=ARCHIVED"
        actor: FirmAdmin
        preconditions: []
        side_effects:
          - "increments Artist.version by 1"
          - "Cascade down: TeamMembers of this artist in ACTIVE/SUSPENDED -> ENDED"
    note: "ARCHIVED blocks new income events, expenses, opportunities, engagements, options, agreements, advances and statement generation (ERR_ARTIST_ARCHIVED); disputes and audits on existing statements remain openable (audit rights survive archiving)."

  - entity: Agreement
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /agreements/{id}/activate"
        actor: FirmAdmin
        preconditions:
          - "Agreement.status == DRAFT (ERR_INVALID_STATE otherwise)"
          - "Artist.status != ARCHIVED (ERR_ARTIST_ARCHIVED)"
          - "At least one CommissionRateSchedule exists for this agreement (ERR_NO_RATE_SCHEDULE)"
        side_effects:
          - "If the artist has another Agreement in ACTIVE: that agreement -> SUPERSEDED (its sunset_start_date = clock date, sunset_end_date computed from its schedules) and its prior_agreement chain records the new agreement"
          - "Agreement.prior_agreement_id = the superseded agreement's id (null if none)"
          - "Artist.current_agreement_id = this agreement"
          - "increments Artist.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /agreements/{id}/terminate"
        actor: FirmAdmin
        preconditions: ["Agreement.status == ACTIVE (ERR_INVALID_STATE otherwise)"]
        side_effects:
          - "termination_date = input termination_date; sunset_start_date = termination_date + 1 day; sunset_end_date = sunset_start_date + max(sunset_months over schedules) - 1 day (null if max == 0)"
          - "Artist.current_agreement_id = null"
          - "increments Artist.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (POST /_clock/set_current_utc sweep: clock date > term_end_date)"
        actor: system
        preconditions: ["Agreement.status == ACTIVE", "clock date > term_end_date"]
        side_effects:
          - "sunset_start_date = term_end_date + 1 day; sunset_end_date = sunset_start_date + max(sunset_months over schedules) - 1 day (null if max == 0)"
          - "Artist.current_agreement_id = null"
      - from: EXPIRED
        to: SUNSET
        trigger: "system (same clock sweep, immediately after the ACTIVE->EXPIRED hop)"
        actor: system
        preconditions: ["sunset_end_date IS NOT NULL", "clock date <= sunset_end_date"]
        side_effects: []
      - from: EXPIRED
        to: CLOSED
        trigger: "system (same clock sweep, immediately after the ACTIVE->EXPIRED hop)"
        actor: system
        preconditions: ["sunset_end_date IS NULL OR clock date > sunset_end_date"]
        side_effects: []
      - from: TERMINATED
        to: SUNSET
        trigger: "system (clock sweep)"
        actor: system
        preconditions: ["sunset_end_date IS NOT NULL", "clock date <= sunset_end_date"]
        side_effects: []
      - from: TERMINATED
        to: CLOSED
        trigger: "system (clock sweep)"
        actor: system
        preconditions: ["sunset_end_date IS NULL OR clock date > sunset_end_date"]
        side_effects: []
      - from: SUPERSEDED
        to: SUNSET
        trigger: "system (clock sweep)"
        actor: system
        preconditions: ["sunset_end_date IS NOT NULL", "clock date <= sunset_end_date"]
        side_effects: []
      - from: SUPERSEDED
        to: CLOSED
        trigger: "system (clock sweep)"
        actor: system
        preconditions: ["sunset_end_date IS NULL OR clock date > sunset_end_date"]
        side_effects: []
      - from: SUNSET
        to: CLOSED
        trigger: "system (clock sweep: clock date > sunset_end_date)"
        actor: system
        preconditions: ["Agreement.status == SUNSET"]
        side_effects: []
    note: "SUNSET is a commission posture, not a freeze: income events recognized in the sunset window remain verifiable at sunset rates. Agreements in DRAFT or CLOSED are not commissionable postures."

  - entity: CommissionRateSchedule
    initial_state: null
    terminal_states: []
    transitions: []
    note: "No status field. Lifecycle is the half-open effective window [effective_from_date, effective_to_date): creation validates non-overlap per (agreement_id, income_type); POST /rate-schedules/{id}/close pins effective_to_date. Window arithmetic: schedules overlap iff A.effective_from_date < (B.effective_to_date or infinity) AND B.effective_from_date < (A.effective_to_date or infinity); adjacency (A.effective_to_date == B.effective_from_date) is ALLOWED."

  - entity: IncomeEvent
    initial_state: REPORTED
    terminal_states: [VOIDED]
    transitions:
      - from: REPORTED
        to: VERIFIED
        trigger: "POST /income-events/{id}/verify"
        actor: BusinessManager
        preconditions:
          - "IncomeEvent.status == REPORTED (ERR_INVALID_STATE otherwise)"
          - "Segregation of duties: caller X-User-ID != reported_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "The resolved agreement is in a commissionable posture {ACTIVE, SUPERSEDED, TERMINATED, EXPIRED, SUNSET} (ERR_AGREEMENT_NOT_ACTIVE when DRAFT or CLOSED)"
          - "A CommissionRateSchedule for (agreement_id, income_type) covers recognition_date (ERR_NO_RATE_SCHEDULE)"
        side_effects:
          - "Runs commission_rate_resolution: pins applied_schedule_id, applied_rate_bps, term_relation"
          - "Runs commission_amount: pins commission_amount_cents, artist_net_cents (per-event round_half_up to whole cents)"
          - "Artist.lifetime_commission_cents recomputed; increments Artist.version by 1"
      - from: VERIFIED
        to: SETTLED
        trigger: "POST /income-events/{id}/settle"
        actor: BusinessManager
        preconditions:
          - "IncomeEvent.status in {VERIFIED, POSTED} (ERR_INVALID_STATE otherwise)"
          - "0 < received_amount_cents <= gross_amount_cents AND received_amount_cents >= commission_amount_cents (ERR_AMOUNT_OUT_OF_RANGE)"
        side_effects:
          - "Sets received_date, received_amount_cents"
          - "Hop 1: runs advance_recoupment_waterfall over the artist's ACTIVE eligible Advances, mutating recouped_cents/outstanding_cents; sets this event's recouped_amount_cents and artist_payable_cents"
          - "Hop 2: any Advance whose outstanding_cents reaches 0 transitions ACTIVE -> RECOUPED (caused by the hop-1 mutation)"
          - "Hop 3: Artist.unrecouped_advance_balance_cents and lifetime fields recomputed; increments Artist.version by 1 (caused by hop 2)"
          - "If linked_engagement_id set and that Engagement is COMPLETED: Engagement -> SETTLED"
      - from: VERIFIED
        to: POSTED
        trigger: "system (POST /statements/{id}/issue sweeps this event as an INCOME line)"
        actor: system
        preconditions: ["Event included in the issuing statement's sweep"]
        side_effects: ["statement_id = issuing statement"]
      - from: SETTLED
        to: POSTED
        trigger: "system (POST /statements/{id}/issue)"
        actor: system
        preconditions: ["Event included in the issuing statement's sweep"]
        side_effects: ["statement_id = issuing statement"]
      - from: POSTED
        to: SETTLED
        trigger: "POST /income-events/{id}/settle"
        actor: BusinessManager
        preconditions: ["Same as VERIFIED->SETTLED"]
        side_effects:
          - "Status remains POSTED after settlement fields are written (POSTED is a latch): the machine records SETTLED-equivalent data; recoupment runs identically and the recoup line is swept onto the NEXT statement (recoup_statement_id still null)"
          - "Hops 1-3 of the settle cascade run identically"
        note: "Cash arriving after an accrual posting does not reopen the issued statement; only the recoup/adjustment effects flow forward."
      - from: REPORTED
        to: VOIDED
        trigger: "POST /income-events/{id}/void"
        actor: BusinessManager
        preconditions: ["IncomeEvent.status == REPORTED (ERR_INVALID_STATE otherwise)"]
        side_effects: ["Artist.lifetime_gross_cents recomputed"]
      - from: VERIFIED
        to: VOIDED
        trigger: "POST /income-events/{id}/void"
        actor: BusinessManager
        preconditions:
          - "IncomeEvent.status == VERIFIED (ERR_INVALID_STATE otherwise)"
          - "SETTLED/POSTED events are never voided: corrections use a kind=ADJUSTMENT child event (ERR_EVENT_ALREADY_SETTLED)"
        side_effects:
          - "Artist.lifetime_gross_cents and lifetime_commission_cents recomputed; increments Artist.version by 1"

  - entity: Advance
    initial_state: ACTIVE
    terminal_states: [RECOUPED, WRITTEN_OFF]
    transitions:
      - from: ACTIVE
        to: RECOUPED
        trigger: "system (advance_recoupment_waterfall drives outstanding_cents to 0 during an income event settle)"
        actor: system
        preconditions: ["outstanding_cents == 0"]
        side_effects: ["Artist.unrecouped_advance_balance_cents recomputed; increments Artist.version by 1"]
      - from: ACTIVE
        to: WRITTEN_OFF
        trigger: "POST /advances/{id}/write-off"
        actor: FirmAdmin
        preconditions:
          - "Advance.status == ACTIVE (ERR_INVALID_STATE otherwise)"
          - "outstanding_cents > 0 (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "written_off_cents = outstanding_cents; outstanding_cents = 0 (preserves principal == recouped + outstanding + written_off)"
          - "Artist.unrecouped_advance_balance_cents recomputed; increments Artist.version by 1"

  - entity: Expense
    initial_state: PENDING_APPROVAL
    terminal_states: [REIMBURSED]
    transitions:
      - from: null
        to: PENDING_APPROVAL
        trigger: "POST /expenses"
        actor: Agent | BusinessManager | Publicist
        preconditions: ["Artist.status != ARCHIVED (ERR_ARTIST_ARCHIVED)"]
        side_effects:
          - "Runs expense_approval_routing: creates one ApprovalRequest per required approver (PENDING), target_type=EXPENSE"
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "system (POST /approval-requests/{id}/approve flips the LAST pending request for this expense)"
        actor: system
        preconditions: ["All ApprovalRequests with target_id == this expense are APPROVED"]
        side_effects: []
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "system (POST /approval-requests/{id}/reject on any pending request for this expense)"
        actor: system
        preconditions: []
        side_effects:
          - "rejection_note = the rejecting request's decision_note"
          - "Sibling PENDING ApprovalRequests for this expense -> CANCELLED"
      - from: REJECTED
        to: PENDING_APPROVAL
        trigger: "POST /expenses/{id}/resubmit"
        actor: Agent | BusinessManager | Publicist
        preconditions: ["Expense.status == REJECTED (ERR_EXPENSE_NOT_REJECTED otherwise)"]
        side_effects:
          - "Applies optional new amount_cents/description; re-runs expense_approval_routing against the (possibly new) amount; fresh ApprovalRequests created"
      - from: APPROVED
        to: REIMBURSED
        trigger: "system (POST /statements/{id}/issue sweeps this expense as an EXPENSE_REIMBURSEMENT line)"
        actor: system
        preconditions: ["incurred_date <= statement.period_end_date and not previously reimbursed"]
        side_effects: ["reimbursed_statement_id = issuing statement"]

  - entity: ApprovalRequest
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED, CANCELLED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /approval-requests/{id}/approve"
        actor: BusinessManager | Artist | FirmAdmin
        preconditions:
          - "ApprovalRequest.status == PENDING (ERR_INVALID_STATE otherwise)"
          - "Caller role matches required_approver (BUSINESS_MANAGER request: BusinessManager with TeamMember.member_role == BUSINESS_MANAGER; ARTIST request: Artist acting as the artist himself; FIRM_ADMIN request: FirmAdmin) (ERR_FORBIDDEN_FOR_ROLE)"
          - "Segregation of duties: caller X-User-ID != requested_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "For EXPENSE targets with required_approver == BUSINESS_MANAGER: expense.amount_cents <= the approver TeamMember.authority_expense_cap_cents (ERR_APPROVAL_AUTHORITY_EXCEEDED)"
        side_effects:
          - "decided_by_user_id = caller; if this was the last PENDING request for the target: EXPENSE target -> APPROVED; OPPORTUNITY target: no state change (accept checks approval existence)"
      - from: PENDING
        to: REJECTED
        trigger: "POST /approval-requests/{id}/reject"
        actor: BusinessManager | Artist | FirmAdmin
        preconditions:
          - "ApprovalRequest.status == PENDING (ERR_INVALID_STATE otherwise)"
          - "Caller role matches required_approver (ERR_FORBIDDEN_FOR_ROLE)"
          - "Segregation of duties: caller X-User-ID != requested_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "EXPENSE target -> REJECTED; sibling PENDING requests -> CANCELLED"
          - "OPPORTUNITY target: pending request consumed; opportunity itself unchanged (agent may re-negotiate)"
      - from: PENDING
        to: CANCELLED
        trigger: "system (target withdrawn/declined/expired, sibling rejection, or expense resubmit)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Opportunity
    initial_state: RECEIVED
    terminal_states: [CONVERTED, DECLINED, WITHDRAWN, EXPIRED]
    transitions:
      - from: RECEIVED
        to: UNDER_EVALUATION
        trigger: "POST /opportunities/{id}/evaluate"
        actor: Agent | BusinessManager
        preconditions: ["Opportunity.status in {RECEIVED, UNDER_EVALUATION} (ERR_INVALID_STATE otherwise)"]
        side_effects:
          - "Runs trailing_average_gross + opportunity_evaluation_score: sets evaluation_score, recommendation"
          - "From UNDER_EVALUATION this is a re-evaluation (refresh); state stays UNDER_EVALUATION"
      - from: UNDER_EVALUATION
        to: NEGOTIATING
        trigger: "POST /opportunities/{id}/negotiate"
        actor: Agent
        preconditions:
          - "Opportunity.status == UNDER_EVALUATION (ERR_INVALID_STATE otherwise)"
          - "clock date <= offer_expiry_date (ERR_OFFER_EXPIRED)"
        side_effects:
          - "If requires_artist_approval and no PENDING/APPROVED ARTIST ApprovalRequest exists for this opportunity: create one (PENDING)"
      - from: NEGOTIATING
        to: NEGOTIATING
        trigger: "POST /opportunities/{id}/counter-offer when |new_value - current_value| / current_value <= 0.10"
        actor: Agent
        preconditions:
          - "Opportunity.status == NEGOTIATING (ERR_INVALID_STATE otherwise)"
          - "clock date <= offer_expiry_date (ERR_OFFER_EXPIRED)"
          - "new_value_cents > 0 (ERR_INVALID_REQUEST)"
          - "OCC: expected_opportunity_version must match (ERR_STALE_OPPORTUNITY_VERSION)"
        side_effects:
          - "current_value_cents = new_value_cents; round_number += 1; increments Opportunity.version by 1"
          - "If the new value pushes requires_artist_approval from false to true: create ARTIST ApprovalRequest (PENDING)"
      - from: NEGOTIATING
        to: UNDER_EVALUATION
        trigger: "POST /opportunities/{id}/counter-offer when |new_value - current_value| / current_value > 0.10"
        actor: Agent
        preconditions: ["Same as NEGOTIATING -> NEGOTIATING"]
        side_effects:
          - "current_value_cents = new_value_cents; round_number += 1; increments Opportunity.version by 1"
          - "evaluation_score and recommendation are NOT auto-recomputed; POST /opportunities/{id}/evaluate must be called again"
          - "If requires_artist_approval newly true: create ARTIST ApprovalRequest (PENDING)"
        note: "The 10% band is exclusive: exactly 10% change stays NEGOTIATING; anything larger loops back to UNDER_EVALUATION (cyclic negotiation rounds)."
      - from: UNDER_EVALUATION
        to: ACCEPTED
        trigger: "POST /opportunities/{id}/accept"
        actor: Agent
        preconditions:
          - "Opportunity.status in {UNDER_EVALUATION, NEGOTIATING} (ERR_INVALID_STATE otherwise)"
          - "evaluation_score IS NOT NULL (ERR_INVALID_STATE: must evaluate first)"
          - "clock date <= offer_expiry_date (ERR_OFFER_EXPIRED)"
          - "If requires_artist_approval: an APPROVED ARTIST ApprovalRequest for this opportunity exists (ERR_ARTIST_APPROVAL_REQUIRED)"
        side_effects: []
      - from: NEGOTIATING
        to: ACCEPTED
        trigger: "POST /opportunities/{id}/accept"
        actor: Agent
        preconditions: ["Same as UNDER_EVALUATION -> ACCEPTED"]
        side_effects: []
      - from: ACCEPTED
        to: CONVERTED
        trigger: "POST /opportunities/{id}/convert"
        actor: Agent
        preconditions:
          - "Opportunity.status == ACCEPTED (ERR_INVALID_STATE otherwise)"
          - "proposed_window_end > clock now (ERR_ENGAGEMENT_WINDOW_PAST): the engagement is born CONFIRMED, so the confirm-time temporal guard applies at creation"
        side_effects:
          - "Creates Engagement for the artist: status CONFIRMED, window = proposed_window_start/end, travel_buffer_hours = 24, guarantee_cents = current_value_cents, opportunity_id = this opportunity, confirmed_at = clock; converted_engagement_id set"
          - "Runs engagement_overlap_detection; on conflict the whole convert fails (ERR_ENGAGEMENT_OVERLAP)"
          - "Cascade: any other HOLD engagements of this artist overlapping the new CONFIRMED window -> RELEASED; each released hold whose opportunity_id points at an Opportunity in {RECEIVED, UNDER_EVALUATION, NEGOTIATING} drives that Opportunity -> WITHDRAWN"
      - from: RECEIVED
        to: DECLINED
        trigger: "POST /opportunities/{id}/decline"
        actor: Agent
        preconditions: ["Opportunity.status in {RECEIVED, UNDER_EVALUATION, NEGOTIATING} (ERR_INVALID_STATE otherwise)"]
        side_effects: ["Pending ApprovalRequests for this opportunity -> CANCELLED"]
      - from: UNDER_EVALUATION
        to: DECLINED
        trigger: "POST /opportunities/{id}/decline"
        actor: Agent
        preconditions: []
        side_effects: ["Pending ApprovalRequests for this opportunity -> CANCELLED"]
      - from: NEGOTIATING
        to: DECLINED
        trigger: "POST /opportunities/{id}/decline"
        actor: Agent
        preconditions: []
        side_effects: ["Pending ApprovalRequests for this opportunity -> CANCELLED"]
      - from: RECEIVED
        to: WITHDRAWN
        trigger: "POST /opportunities/{id}/withdraw OR system cascade (calendar lost to a confirmed engagement)"
        actor: Agent | system
        preconditions: ["Opportunity.status in {RECEIVED, UNDER_EVALUATION, NEGOTIATING} (ERR_INVALID_STATE otherwise)"]
        side_effects: ["Pending ApprovalRequests for this opportunity -> CANCELLED"]
      - from: UNDER_EVALUATION
        to: WITHDRAWN
        trigger: "POST /opportunities/{id}/withdraw OR system cascade"
        actor: Agent | system
        preconditions: []
        side_effects: ["Pending ApprovalRequests for this opportunity -> CANCELLED"]
      - from: NEGOTIATING
        to: WITHDRAWN
        trigger: "POST /opportunities/{id}/withdraw OR system cascade"
        actor: Agent | system
        preconditions: []
        side_effects: ["Pending ApprovalRequests for this opportunity -> CANCELLED"]
      - from: RECEIVED
        to: EXPIRED
        trigger: "system (clock sweep: clock date > offer_expiry_date)"
        actor: system
        preconditions: ["Opportunity.status in {RECEIVED, UNDER_EVALUATION, NEGOTIATING}"]
        side_effects: ["Pending ApprovalRequests for this opportunity -> CANCELLED"]
      - from: UNDER_EVALUATION
        to: EXPIRED
        trigger: "system (clock sweep)"
        actor: system
        preconditions: []
        side_effects: ["Pending ApprovalRequests -> CANCELLED"]
      - from: NEGOTIATING
        to: EXPIRED
        trigger: "system (clock sweep)"
        actor: system
        preconditions: []
        side_effects: ["Pending ApprovalRequests -> CANCELLED"]

  - entity: Engagement
    initial_state: HOLD
    terminal_states: [SETTLED, CANCELLED, RELEASED]
    transitions:
      - from: HOLD
        to: CONFIRMED
        trigger: "POST /engagements/{id}/confirm"
        actor: Agent
        preconditions:
          - "Engagement.status == HOLD (ERR_INVALID_STATE otherwise)"
          - "end_datetime > clock now (ERR_ENGAGEMENT_WINDOW_PAST)"
          - "engagement_overlap_detection: no other CONFIRMED engagement of this artist within buffered windows (ERR_ENGAGEMENT_OVERLAP)"
          - "If opportunity_id set: that Opportunity.status in {ACCEPTED, CONVERTED} (ERR_OPPORTUNITY_NOT_ACCEPTED)"
        side_effects:
          - "confirmed_at = clock"
          - "Cascade: other HOLD engagements of this artist overlapping the newly confirmed buffered window -> RELEASED; a released hold whose opportunity_id points at an Opportunity in {RECEIVED, UNDER_EVALUATION, NEGOTIATING} drives that Opportunity -> WITHDRAWN"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /engagements/{id}/complete"
        actor: Agent | BusinessManager
        preconditions:
          - "Engagement.status == CONFIRMED (ERR_INVALID_STATE otherwise)"
          - "clock now >= end_datetime (ERR_ENGAGEMENT_NOT_ENDED)"
        side_effects: []
      - from: COMPLETED
        to: SETTLED
        trigger: "system (first linked IncomeEvent reaches settlement via POST /income-events/{id}/settle)"
        actor: system
        preconditions: ["A settled IncomeEvent has linked_engagement_id == this engagement"]
        side_effects: []
      - from: HOLD
        to: CANCELLED
        trigger: "POST /engagements/{id}/cancel"
        actor: Agent
        preconditions:
          - "Engagement.status in {HOLD, CONFIRMED} (ERR_INVALID_STATE otherwise)"
          - "No linked IncomeEvent in {VERIFIED, SETTLED, POSTED} (ERR_ENGAGEMENT_HAS_INCOME)"
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /engagements/{id}/cancel"
        actor: Agent
        preconditions: ["Same as HOLD -> CANCELLED"]
        side_effects: []
      - from: HOLD
        to: RELEASED
        trigger: "system cascade only (a newly CONFIRMED overlapping engagement releases it; see confirm/convert/exercise cascades)"
        actor: system
        preconditions: ["Overlap with a newly confirmed engagement"]
        side_effects: ["If opportunity_id set and that Opportunity in {RECEIVED, UNDER_EVALUATION, NEGOTIATING}: Opportunity -> WITHDRAWN"]

  - entity: Option
    initial_state: OPEN
    terminal_states: [EXERCISED, LAPSED, WAIVED]
    transitions:
      - from: OPEN
        to: EXERCISED
        trigger: "POST /options/{id}/exercise"
        actor: Agent
        preconditions:
          - "Option.status == OPEN (ERR_INVALID_STATE otherwise)"
          - "exercise_window_start <= clock now <= exercise_window_end, both bounds INCLUSIVE (ERR_OPTION_WINDOW_VIOLATION)"
          - "Option.agreement_id resolves to an Agreement in status ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
          - "engagement_end_datetime > clock now (ERR_ENGAGEMENT_WINDOW_PAST): the engagement is born CONFIRMED, so the confirm-time temporal guard applies at creation"
        side_effects:
          - "Hop 1: creates Engagement: status CONFIRMED, window = engagement_start/end_datetime, travel_buffer_hours = 24, guarantee_cents = exercise_value_cents, income_type = option.income_type, confirmed_at = clock; exercised_engagement_id set"
          - "Hop 2: the new CONFIRMED engagement triggers engagement_overlap_detection; on conflict exercise fails wholesale (ERR_ENGAGEMENT_OVERLAP); otherwise overlapping HOLD engagements of this artist -> RELEASED"
          - "Hop 3: each RELEASED hold whose opportunity_id points at an Opportunity in {RECEIVED, UNDER_EVALUATION, NEGOTIATING} drives that Opportunity -> WITHDRAWN"
      - from: OPEN
        to: WAIVED
        trigger: "POST /options/{id}/waive"
        actor: Artist | FirmAdmin
        preconditions: ["Option.status == OPEN (ERR_INVALID_STATE otherwise)"]
        side_effects: []
      - from: OPEN
        to: LAPSED
        trigger: "system (clock sweep: clock now > exercise_window_end)"
        actor: system
        preconditions: ["Option.status == OPEN"]
        side_effects: []

  - entity: TeamMember
    initial_state: ACTIVE
    terminal_states: [ENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /team-members/{id}/suspend"
        actor: FirmAdmin
        preconditions: ["TeamMember.status == ACTIVE (ERR_INVALID_STATE otherwise)"]
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /team-members/{id}/resume"
        actor: FirmAdmin
        preconditions: ["TeamMember.status == SUSPENDED (ERR_INVALID_STATE otherwise)"]
        side_effects: []
      - from: ACTIVE
        to: ENDED
        trigger: "POST /team-members/{id}/end OR system (clock sweep: clock date > window_end_date)"
        actor: FirmAdmin | system
        preconditions: ["TeamMember.status in {ACTIVE, SUSPENDED} (ERR_INVALID_STATE otherwise)"]
        side_effects: []
      - from: SUSPENDED
        to: ENDED
        trigger: "POST /team-members/{id}/end OR system (clock sweep)"
        actor: FirmAdmin | system
        preconditions: []
        side_effects: []

  - entity: Statement
    initial_state: DRAFT
    terminal_states: [FINALIZED, DISCARDED]
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /statements/generate"
        actor: BusinessManager
        preconditions:
          - "Artist.status != ARCHIVED (ERR_ARTIST_ARCHIVED)"
          - "period_start_date <= period_end_date (ERR_INVALID_REQUEST)"
          - "period_end_date <= clock date (ERR_STATEMENT_PERIOD_FUTURE)"
          - "No overlap with any non-DISCARDED statement of this artist under CLOSED-interval arithmetic: new.start <= existing.end AND existing.start <= new.end (ERR_STATEMENT_PERIOD_OVERLAP)"
          - "The immediately preceding statement (latest non-DISCARDED with period_end_date < new start) must not be DRAFT (ERR_PRIOR_STATEMENT_OPEN)"
        side_effects:
          - "Runs statement_generation (basis-variant inclusion, carry chain, disbursement threshold): creates StatementLines, sets all totals, carry_in/carry_out, rate_snapshot"
      - from: DRAFT
        to: ISSUED
        trigger: "POST /statements/{id}/issue"
        actor: BusinessManager
        preconditions: ["Statement.status == DRAFT (ERR_INVALID_STATE otherwise)"]
        side_effects:
          - "issued_at = clock; dispute_window_ends_at = issued_at + 30 days; totals frozen"
          - "Swept INCOME-line events -> POSTED (statement_id set); swept expenses -> REIMBURSED (reimbursed_statement_id set); swept recoup events get recoup_statement_id set"
      - from: ISSUED
        to: DISPUTED
        trigger: "system (POST /disputes with statement_id == this statement)"
        actor: system
        preconditions: ["Statement.status == ISSUED", "clock <= dispute_window_ends_at"]
        side_effects: []
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /statements/{id}/amend"
        actor: BusinessManager
        preconditions:
          - "Statement.status == DISPUTED (ERR_INVALID_STATE otherwise)"
          - "Every Dispute with statement_id == this statement is in {RESOLVED_UPHELD, RESOLVED_REJECTED, WITHDRAWN} (ERR_DISPUTE_NOT_RESOLVED)"
        side_effects:
          - "Hop 1: for each RESOLVED_UPHELD dispute, append an ADJUSTMENT StatementLine (amount = dispute.awarded_amount_cents, ref_id = dispute id); revision_number += 1"
          - "Hop 2: statement_generation totals re-run over the amended line set (rate_snapshot lines untouched): adjustment_total_cents, net_payable_cents, disbursed_cents, carry_out_cents recomputed"
          - "Hop 3: Artist.version increments; Artist lifetime fields are NOT restated (awards are commission-free), but the amended carry_out_cents becomes carry_in for the next generated statement"
          - "issued_at and dispute_window_ends_at reset (a fresh 30-day dispute window opens)"
      - from: ISSUED
        to: ACKNOWLEDGED
        trigger: "POST /statements/{id}/acknowledge"
        actor: Artist
        preconditions: ["Statement.status == ISSUED (ERR_INVALID_STATE otherwise)"]
        side_effects: []
      - from: ISSUED
        to: ACKNOWLEDGED
        trigger: "system (clock sweep: clock > dispute_window_ends_at with no active dispute; deemed acceptance)"
        actor: system
        preconditions: ["Statement.status == ISSUED", "clock > dispute_window_ends_at"]
        side_effects: []
      - from: ACKNOWLEDGED
        to: FINALIZED
        trigger: "POST /statements/{id}/disburse"
        actor: BusinessManager
        preconditions: ["Statement.status == ACKNOWLEDGED (ERR_INVALID_STATE otherwise)"]
        side_effects:
          - "Artist.lifetime_disbursed_cents += disbursed_cents; increments Artist.version by 1"
      - from: DRAFT
        to: DISCARDED
        trigger: "POST /statements/{id}/discard"
        actor: BusinessManager
        preconditions: ["Statement.status == DRAFT (ERR_INVALID_STATE otherwise)"]
        side_effects: []

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [RESOLVED_UPHELD, RESOLVED_REJECTED, WITHDRAWN, ESCALATED]
    transitions:
      - from: null
        to: OPEN
        trigger: "POST /disputes"
        actor: Artist
        preconditions:
          - "Statement.status == ISSUED (DRAFT/DISCARDED -> ERR_INVALID_STATE)"
          - "Statement.status in {ACKNOWLEDGED, FINALIZED} means the dispute window has already closed (acknowledge or deemed acceptance happens exactly when the window lapses) -> ERR_DISPUTE_WINDOW_CLOSED"
          - "Statement.status == DISPUTED means another dispute is active -> ERR_DISPUTE_ALREADY_ACTIVE"
        side_effects: ["Statement ISSUED -> DISPUTED"]
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /disputes/{id}/start-review"
        actor: BusinessManager
        preconditions: ["Dispute.status == OPEN (ERR_INVALID_STATE otherwise)"]
        side_effects: []
      - from: UNDER_REVIEW
        to: RESOLVED_UPHELD
        trigger: "POST /disputes/{id}/resolve with outcome=UPHELD"
        actor: BusinessManager | FirmAdmin
        preconditions:
          - "Dispute.status == UNDER_REVIEW (ERR_INVALID_STATE otherwise)"
          - "awarded_amount_cents present and > 0 (ERR_INVALID_REQUEST)"
        side_effects: ["awarded_amount_cents recorded; the amount becomes an ADJUSTMENT line only when the statement is amended"]
      - from: UNDER_REVIEW
        to: RESOLVED_REJECTED
        trigger: "POST /disputes/{id}/resolve with outcome=REJECTED"
        actor: BusinessManager | FirmAdmin
        preconditions: ["Dispute.status == UNDER_REVIEW (ERR_INVALID_STATE otherwise)"]
        side_effects: []
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /disputes/{id}/withdraw"
        actor: Artist
        preconditions: ["Dispute.status in {OPEN, UNDER_REVIEW} (ERR_INVALID_STATE otherwise)"]
        side_effects: ["If no other active dispute remains on the statement: Statement DISPUTED -> ISSUED (compensation revert)"]
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /disputes/{id}/withdraw"
        actor: Artist
        preconditions: []
        side_effects: ["If no other active dispute remains on the statement: Statement DISPUTED -> ISSUED"]
      - from: OPEN
        to: ESCALATED
        trigger: "POST /disputes/{id}/escalate"
        actor: Artist
        preconditions: ["Dispute.status in {OPEN, UNDER_REVIEW} (ERR_INVALID_STATE otherwise)"]
        side_effects:
          - "Creates Audit: status REQUESTED, scope_statement_id = dispute.statement_id, source_dispute_id = this dispute"
      - from: UNDER_REVIEW
        to: ESCALATED
        trigger: "POST /disputes/{id}/escalate"
        actor: Artist
        preconditions: []
        side_effects: ["Creates Audit in REQUESTED (as above)"]
    note: "Because the clock sweep deems an ISSUED statement ACKNOWLEDGED the moment the clock passes dispute_window_ends_at, an ISSUED statement always has an open window; ERR_DISPUTE_WINDOW_CLOSED is therefore the terminal-state message for ACKNOWLEDGED/FINALIZED statements."

  - entity: Audit
    initial_state: REQUESTED
    terminal_states: [CLOSED]
    transitions:
      - from: null
        to: REQUESTED
        trigger: "POST /audits (direct audit right) OR system (dispute escalation)"
        actor: Artist | system
        preconditions:
          - "Scope statement status in {ISSUED, DISPUTED, ACKNOWLEDGED, FINALIZED} (ERR_INVALID_STATE)"
          - "statement.issued_at >= clock - 365 days, inclusive (ERR_AUDIT_WINDOW_CLOSED)"
          - "No other Audit on the same statement with status != CLOSED (ERR_AUDIT_ALREADY_ACTIVE)"
        side_effects: []
      - from: REQUESTED
        to: IN_PROGRESS
        trigger: "POST /audits/{id}/begin"
        actor: Auditor
        preconditions: ["Audit.status == REQUESTED (ERR_INVALID_STATE otherwise)"]
        side_effects: []
      - from: IN_PROGRESS
        to: FINDINGS_ISSUED
        trigger: "POST /audits/{id}/issue-findings"
        actor: Auditor
        preconditions: ["Audit.status == IN_PROGRESS (ERR_INVALID_STATE otherwise)"]
        side_effects:
          - "Runs audit_cost_allocation against the scope statement's pinned net_payable_cents: sets cost_bearer"
      - from: FINDINGS_ISSUED
        to: IN_PROGRESS
        trigger: "POST /audits/{id}/reopen (artist objects to findings)"
        actor: Artist
        preconditions:
          - "Audit.status == FINDINGS_ISSUED (ERR_INVALID_STATE otherwise)"
          - "reopen_count < 2 (ERR_AUDIT_REOPEN_LIMIT)"
        side_effects: ["reopen_count += 1"]
      - from: FINDINGS_ISSUED
        to: CLOSED
        trigger: "POST /audits/{id}/close"
        actor: Auditor | FirmAdmin
        preconditions: ["Audit.status == FINDINGS_ISSUED (ERR_INVALID_STATE otherwise)"]
        side_effects: []

# =============================================================================
# Section 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: agreement-create-stale-artist
    parent_entity: Artist
    write_endpoint: "POST /agreements"
    occ_field: "expected_artist_version"
    description: |
      Creating an Agreement for an Artist whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just activated a different agreement for the same artist (the
      activation legitimately supersedes the previously active one and bumps
      Artist.version), so the current writer's view of the artist is stale.
    error_id: ERR_STALE_ARTIST_VERSION
    http_status: 412
  - rule_id: agreement-update-stale-version
    parent_entity: Agreement
    write_endpoint: "PATCH /agreements/{id}"
    occ_field: "expected_agreement_version"
    description: |
      Updating an Agreement whose version has advanced since the client last
      observed it is rejected. A second writer's term extension or policy edit
      bumps Agreement.version, so a subsequent update carrying the older
      expected version is stale and must be refused.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
  - rule_id: opportunity-counter-stale-version
    parent_entity: Opportunity
    write_endpoint: "POST /opportunities/{id}/counter-offer"
    occ_field: "expected_opportunity_version"
    description: |
      Counter-offering against an Opportunity whose version has advanced since
      the client last observed it is rejected. A counter-offer legitimately
      supersedes the current negotiated value (bumping Opportunity.version and
      round_number), so a subsequent counter-offer carrying the older expected
      version negotiates from stale terms and is refused.
    error_id: ERR_STALE_OPPORTUNITY_VERSION
    http_status: 412

# =============================================================================
# Section 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: commission_rate_resolution
    trigger: "IncomeEvent verify (REPORTED -> VERIFIED); also defines Agreement sunset window arithmetic"
    algorithm: threshold
    formula: |
      term_effective_end = agreement.termination_date if agreement.status == TERMINATED
                           else agreement.term_end_date
      schedule = the CommissionRateSchedule with schedule.agreement_id == event.agreement_id
                 AND schedule.income_type == event.income_type
                 AND schedule.effective_from_date <= event.recognition_date
                 AND (schedule.effective_to_date IS NULL OR event.recognition_date < schedule.effective_to_date)
      if no such schedule: reject verify with ERR_NO_RATE_SCHEDULE
      if event.recognition_date <= term_effective_end:
          term_relation = IN_TERM; applied_rate_bps = schedule.in_term_rate_bps
      else:
          sunset_end_for_type = term_effective_end + schedule.sunset_months (calendar months)
          in_window = event.recognition_date <= sunset_end_for_type
          deal_in_term = (event.linked_engagement_id IS NULL)
                         OR (engagement.confirmed_at date-part <= term_effective_end)
          if in_window AND deal_in_term:
              term_relation = SUNSET; applied_rate_bps = schedule.sunset_rate_bps
          else:
              term_relation = POST_TERM_EXEMPT; applied_rate_bps = 0
      pin applied_schedule_id = schedule.id
    input_set: "The resolving CommissionRateSchedule set is filtered by (agreement_id, income_type) and the half-open effective window containing recognition_date; at most one schedule may match (enforced by rate_schedule_overlap_detection)"
    constants: {}
    precision: "dates compared as ISO calendar dates; month addition is calendrical (2027-01-31 + 1 month = 2027-02-28)"

  - name: commission_amount
    trigger: "IncomeEvent verify, immediately after commission_rate_resolution"
    algorithm: tiered_pricing
    formula: |
      base = event.gross_amount_cents
      if agreement.touring_commission_base == NET_OF_EXPENSES
         AND event.income_type == TOURING
         AND event.linked_engagement_id IS NOT NULL:
          base = base - sum(e.amount_cents for e in Expense
                            where e.engagement_id == event.linked_engagement_id
                            AND e.status IN {APPROVED, REIMBURSED})
          base = max(0, base)
      commission_amount_cents = round_half_up(base * applied_rate_bps / 10000)
      artist_net_cents = gross_amount_cents - commission_amount_cents
    input_set: "Expenses linked to the same engagement in status APPROVED or REIMBURSED at verify time; PENDING_APPROVAL and REJECTED expenses are excluded"
    constants: {}
    precision: "0 decimal places (whole cents), round_half_up; computed PER EVENT at verify (never re-deriv​ed from statement aggregates)"
    variants:
      - name: gross_base
        when: "agreement.touring_commission_base == GROSS (default) or event is not a linked TOURING event"
        difference: "commission base is the full gross_amount_cents"
      - name: net_of_expenses_base
        when: "agreement.touring_commission_base == NET_OF_EXPENSES and event is TOURING linked to an engagement"
        difference: "commission base subtracts approved production/travel costs of the engagement first, so identical gross yields a smaller commission (e.g. gross 200000, approved engagement expenses 30000, rate 1500 bps: GROSS -> 30000, NET_OF_EXPENSES -> 25500)"

  - name: advance_recoupment_waterfall
    trigger: "IncomeEvent settle (VERIFIED/POSTED -> SETTLED)"
    algorithm: waterfall_allocation
    formula: |
      cash_share = event.received_amount_cents - event.commission_amount_cents
      eligible = [a for a in Advance where a.artist_id == event.artist_id
                  AND a.status == ACTIVE
                  AND (a.applies_to_income_types == [] OR event.income_type IN a.applies_to_income_types)]
      ordering: issued_date ASC, then created_at ASC (never id)
      FIFO variant (agreement.recoupment_policy == FIFO):
        remaining = cash_share
        for A in eligible ordered as above:
            take = min(A.outstanding_cents, round_half_up(remaining * A.recoup_pct_bps / 10000))
            A.recouped_cents += take; A.outstanding_cents -= take; remaining -= take
            if A.outstanding_cents == 0: A.status = RECOUPED
            if remaining == 0: break
        event.recouped_amount_cents = cash_share - remaining
      PRO_RATA variant (agreement.recoupment_policy == PRO_RATA):
        total_out = sum(a.outstanding_cents for a in eligible)
        if total_out == 0: event.recouped_amount_cents = 0
        else:
          ordered = eligible ordered as above
          for i, A in enumerate(ordered):
              if A is not last in ordered: share_i = floor(cash_share * A.outstanding_cents / total_out)
              else: share_i = cash_share - sum(all prior share_j)   # remainder to LAST, not first
              applied_i = min(A.outstanding_cents, round_half_up(share_i * A.recoup_pct_bps / 10000))
              A.recouped_cents += applied_i; A.outstanding_cents -= applied_i
              if A.outstanding_cents == 0: A.status = RECOUPED
          event.recouped_amount_cents = sum(applied_i)
      event.artist_payable_cents = cash_share - event.recouped_amount_cents
    input_set: "Advances of the same artist in ACTIVE status whose income-type scope covers the settling event"
    constants: {}
    precision: "whole cents, round_half_up per allocation step; floor for PRO_RATA share split; share remainder assigned to the last eligible advance in order"
    variants:
      - name: fifo
        when: "agreement.recoupment_policy == FIFO"
        difference: "oldest advance eats at its own recoup_pct until exhausted before the next advance is touched (e.g. cash_share 80000, A out 50000 @100%, B out 60000 @50%: A takes 50000, B takes 15000; total recouped 65000)"
      - name: pro_rata
        when: "agreement.recoupment_policy == PRO_RATA"
        difference: "cash share split pro-rata by outstanding then each advance's pct applied (same inputs: share_A = floor(80000*50000/110000)=36363, applied_A 36363; share_B = 43637, applied_B = round_half_up(43637*0.5) = 21819; total recouped 58182)"

  - name: statement_generation
    trigger: "POST /statements/generate (build DRAFT) and POST /statements/{id}/amend (totals re-run over amended lines)"
    algorithm: aggregation
    formula: |
      EVALUATION ORDER IS PINNED (circular-looking carry chain made explicit):
      (1) INCOME lines: events with statement_id IS NULL AND
            basis == ACCRUAL: status IN {VERIFIED, SETTLED} AND recognition_date IN [period_start_date, period_end_date]
            basis == CASH:    status == SETTLED AND received_date IN [period_start_date, period_end_date]
          each line: amount = event.artist_net_cents, commission = event.commission_amount_cents
          rate_snapshot = [{income_type, schedule_id: event.applied_schedule_id, rate_bps: event.applied_rate_bps}] per event
      (2) EXPENSE_REIMBURSEMENT lines: expenses of artist with status == APPROVED AND incurred_date <= period_end_date
      (3) ADVANCE_RECOUPMENT lines: events with recoup_statement_id IS NULL AND recouped_amount_cents > 0
          AND received_date IN [period_start_date, period_end_date]; amount = recouped_amount_cents
      (4) ADJUSTMENT lines: audits of this artist's statements with status IN {FINDINGS_ISSUED, CLOSED}:
            + findings_underpayment_cents when > 0 AND underpayment_applied == false (mark underpayment_applied)
            - audit_cost_cents when cost_bearer == ARTIST AND audit_cost_cents > 0 AND cost_applied == false (mark cost_applied)
      (5) carry_in_cents = prior_statement.carry_out_cents (the latest non-DISCARDED statement of this artist
          with period_end_date < this period_start_date; 0 when none)
      (6) net_payable_cents = income_net_total - expense_total - recoup_total + adjustment_total + carry_in
      (7) disbursement threshold: if net_payable >= MIN_DISBURSEMENT_CENTS: disbursed = net_payable, carry_out = 0
          elif net_payable > 0: disbursed = 0, carry_out = net_payable
          else: disbursed = 0, carry_out = net_payable (negative carry = artist debt to the firm)
      INVARIANT: disbursed_cents + carry_out_cents == net_payable_cents after every generate/amend/disburse.
    input_set: "Per-artist; income events not yet posted (statement_id IS NULL), expenses APPROVED-not-yet-reimbursed, settled events with unreported recoupment, unresolved audit adjustments; all date windows CLOSED [start, end]"
    constants:
      MIN_DISBURSEMENT_CENTS: 50000
    precision: "whole cents; commissions were already rounded PER EVENT at verify (round per event, then sum); statement NEVER re-rounds or re-derives event commissions"
    variants:
      - name: accrual_basis
        when: "statement.basis == ACCRUAL"
        difference: "INCOME inclusion keyed on recognition_date and accepts VERIFIED events (cash need not have arrived); an event recognized in P1 but settled in P2 appears in the ACCRUAL P1 statement"
      - name: cash_basis
        when: "statement.basis == CASH"
        difference: "INCOME inclusion keyed on received_date and accepts only SETTLED events; the same event appears in the CASH P2 statement, so identical data yields different per-period gross_total_cents / commission_total_cents / net_payable_cents"

  - name: expense_approval_routing
    trigger: "Expense create and resubmit"
    algorithm: threshold
    formula: |
      if amount_cents <= TIER1_MAX_CENTS: required = [BUSINESS_MANAGER]
      elif amount_cents <= TIER2_MAX_CENTS: required = [BUSINESS_MANAGER, ARTIST]
      else: required = [BUSINESS_MANAGER, ARTIST, FIRM_ADMIN]
      one PENDING ApprovalRequest per required approver; boundaries are INCLUSIVE upper bounds
      (exactly 100000 -> BUSINESS_MANAGER only; exactly 1000000 -> BUSINESS_MANAGER + ARTIST)
    input_set: "The expense amount only"
    constants:
      TIER1_MAX_CENTS: 100000
      TIER2_MAX_CENTS: 1000000
    precision: "integer cents; boundary comparisons are <="

  - name: trailing_average_gross
    trigger: "POST /opportunities/{id}/evaluate (input to opportunity_evaluation_score)"
    algorithm: aggregation
    formula: |
      window = [clock_date - 365 days, clock_date] inclusive both ends
      source = IncomeEvents of the artist with income_type == opportunity.income_type,
               status IN {SETTLED, POSTED}, received_date IN window
      if source empty: trailing_avg_cents = null (caller substitutes neutral financial_component 50)
      else: trailing_avg_cents = round_half_up(sum(received_amount_cents) / count)
    input_set: "Settled/posted income events of the same artist and income type inside the trailing 365-day window; VERIFIED (unsettled) events excluded; tie/order irrelevant (mean)"
    constants:
      WINDOW_DAYS: 365
    precision: "whole cents, round_half_up"

  - name: opportunity_evaluation_score
    trigger: "POST /opportunities/{id}/evaluate"
    algorithm: weighted_scoring
    formula: |
      if trailing_avg_cents is null: financial_component = 50
      else: financial_component = min(100, round_half_up(50 * opportunity.current_value_cents / trailing_avg_cents))
      conflicts = engagements of the artist whose window intersects [proposed_window_start, proposed_window_end]
                  under plain (unbuffered) closed-interval intersection
      availability_component = 0 if any conflict is CONFIRMED
                               else 50 if any conflict is HOLD
                               else 100
      evaluation_score = round_half_up(0.5 * financial_component + 0.3 * fit_score + 0.2 * availability_component)
      recommendation = PURSUE if evaluation_score >= 70
                       else CONSIDER if evaluation_score >= 40
                       else PASS_SUGGESTED
      boundary: exactly 70 -> PURSUE (>= semantics)
    input_set: "opportunity.current_value_cents, opportunity.fit_score, trailing_average_gross for the same income type, plain-window engagement conflicts"
    constants:
      W_FINANCIAL: 0.5
      W_FIT: 0.3
      W_AVAILABILITY: 0.2
      PURSUE_THRESHOLD: 70
      CONSIDER_THRESHOLD: 40
      ARTIST_APPROVAL_THRESHOLD_CENTS: 10000000
    precision: "score 0..100 integer, round_half_up at the final weighted step only (components are integers)"

  - name: engagement_overlap_detection
    trigger: "Engagement confirm; Opportunity convert; Option exercise (all produce/confirm CONFIRMED engagements)"
    algorithm: interval_merge
    formula: |
      effective window of engagement E = [E.start_datetime - E.travel_buffer_hours, E.end_datetime + E.travel_buffer_hours]  (buffer applied to BOTH sides)
      candidate conflicts with existing C iff both are for the same artist, C.status == CONFIRMED, and
          E.start_eff < C.end_eff AND C.start_eff < E.end_eff   (strict inequalities: exact touching is ALLOWED)
      confirmed-conflict -> reject with ERR_ENGAGEMENT_OVERLAP
      overlapping HOLD engagements are not conflicts; they are cascade-released on success
    input_set: "Engagements of the same artist in status CONFIRMED (blocking) or HOLD (released)"
    constants: {}
    precision: "ISO datetime comparison, microsecond-free; strict < so windows merely touching at the buffered edge do not conflict"

  - name: rate_schedule_overlap_detection
    trigger: "CommissionRateSchedule create and close"
    algorithm: interval_merge
    formula: |
      windows are HALF-OPEN [effective_from_date, effective_to_date) with effective_to_date NULL = +infinity
      new schedule N conflicts with existing S (same agreement_id AND same income_type) iff
          N.effective_from_date < (S.effective_to_date or +inf) AND S.effective_from_date < (N.effective_to_date or +inf)
      adjacency (N.effective_from_date == S.effective_to_date) is ALLOWED
      conflict -> ERR_RATE_SCHEDULE_OVERLAP
    input_set: "All CommissionRateSchedules of the same (agreement_id, income_type), regardless of window position"
    constants: {}
    precision: "ISO date comparison"

  - name: statement_period_overlap_detection
    trigger: "POST /statements/generate"
    algorithm: interval_merge
    formula: |
      statement periods are CLOSED [period_start_date, period_end_date]
      new period P conflicts with existing non-DISCARDED statement S of the same artist iff
          P.period_start_date <= S.period_end_date AND S.period_start_date <= P.period_end_date
      touching is impossible for well-formed monthly periods: P.start == S.end IS an overlap (both closed)
      P.start == S.end + 1 day is the tightest legal successor
    input_set: "Statements of the same artist with status != DISCARDED"
    constants: {}
    precision: "ISO date comparison, inclusive both ends"

  - name: audit_cost_allocation
    trigger: "POST /audits/{id}/issue-findings"
    algorithm: threshold
    formula: |
      EVALUATION ORDER PINNED (snapshot first, so the cost decision never feeds back into the base):
      (1) base = scope_statement.net_payable_cents AS PINNED on the issued statement (never recomputed)
      (2) ratio = if base <= 0 then +infinity else findings_underpayment_cents / base
      (3) cost_bearer = FIRM if ratio >= UNDERPAYMENT_RATIO_THRESHOLD OR findings_underpayment_cents >= FIRM_BEARING_FLOOR_CENTS
                        else ARTIST
      (4) only when cost_bearer == ARTIST is audit_cost_cents recoverable through the next statement sweep
    input_set: "The scope statement's pinned net_payable_cents; the audit's findings inputs"
    constants:
      UNDERPAYMENT_RATIO_THRESHOLD: 0.05
      FIRM_BEARING_FLOOR_CENTS: 2500000
    precision: "ratio compared as exact rational (findings * 100 >= base * 5) to avoid float error at the 5% boundary"

  - name: option_window_check
    trigger: "POST /options/{id}/exercise and the clock sweep that lapses options"
    algorithm: threshold
    formula: |
      exercisable iff exercise_window_start <= clock_now <= exercise_window_end  (BOTH bounds inclusive)
      clock sweep lapses OPEN options when clock_now > exercise_window_end
    input_set: "The option's window and the logical clock"
    constants: {}
    precision: "ISO datetime, second precision; inclusive bounds"

# =============================================================================
# Section 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must both be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "X-User-Role must be in the endpoint's declared roles list"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: auth
    check: "Entity-backed scoping: Agent/BusinessManager/Publicist callers must resolve X-User-ID to a TeamMember whose member_role matches X-User-Role and whose artist_id matches the target resource's artist chain; Artist callers may only touch resources whose artist_id == X-User-ID"
    error_id: ERR_ARTIST_ACCESS_DENIED
    http_status: 403
    applies_to: "all artist-scoped endpoints (everything except POST /artists, GET /artists list, POST /_clock/set_current_utc)"

  - priority: 4
    category: auth
    check: "Entity-backed TeamMember callers must be in status ACTIVE (SUSPENDED/ENDED members may not act)"
    error_id: ERR_TEAM_MEMBER_INACTIVE
    http_status: 403
    applies_to: "all endpoints called with roles Agent, BusinessManager, Publicist"

  - priority: 5
    category: existence
    check: "Request body shape: required fields present, types valid, enum values in range, amounts positive where required, end > start window sanity"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"

  - priority: 6
    category: existence
    check: "Path parameters must resolve to existing resources"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 7
    category: existence
    check: "Body-supplied foreign keys (artist_id, agreement_id, statement_id, linked_engagement_id, parent_event_id, opportunity_id, source_opportunity_id, engagement_id) must resolve to existing resources"
    error_id: ERR_INVALID_REFERENCE
    http_status: 422
    applies_to: "endpoints with body foreign keys"

  - priority: 8
    category: state
    check: "Target resource must be in a state from which the requested transition exists (state-machine precondition); also covers OCC-irrelevant state gates like ERR_EVENT_ALREADY_SETTLED, ERR_EXPENSE_NOT_REJECTED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action/transition endpoints"

  - priority: 9
    category: state
    check: "OCC: expected_<parent>_version must equal the parent's current version on POST /agreements, PATCH /agreements/{id}, POST /opportunities/{id}/counter-offer"
    error_id: "ERR_STALE_ARTIST_VERSION | ERR_STALE_AGREEMENT_VERSION | ERR_STALE_OPPORTUNITY_VERSION"
    http_status: 412
    applies_to: "POST /agreements; PATCH /agreements/{id}; POST /opportunities/{id}/counter-offer"

  - priority: 10
    category: business_safety
    check: "Segregation of duties: the approver/verifier must not be the same X-User-ID as the submitter/reporter (expense approvals, income verification)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /approval-requests/{id}/approve, POST /approval-requests/{id}/reject, POST /income-events/{id}/verify"

  - priority: 11
    category: business_temporal
    check: "Clock/window checks: option exercise window (ERR_OPTION_WINDOW_VIOLATION), offer expiry (ERR_OFFER_EXPIRED), engagement window already past on confirm (ERR_ENGAGEMENT_WINDOW_PAST), engagement not ended on complete (ERR_ENGAGEMENT_NOT_ENDED), dispute window closed via acknowledge/deemed acceptance (ERR_DISPUTE_WINDOW_CLOSED), audit window (ERR_AUDIT_WINDOW_CLOSED), statement period not in the future (ERR_STATEMENT_PERIOD_FUTURE)"
    error_id: "ERR_OPTION_WINDOW_VIOLATION | ERR_OFFER_EXPIRED | ERR_ENGAGEMENT_WINDOW_PAST | ERR_ENGAGEMENT_NOT_ENDED | ERR_DISPUTE_WINDOW_CLOSED | ERR_AUDIT_WINDOW_CLOSED | ERR_STATEMENT_PERIOD_FUTURE"
    http_status: "409 | 422"
    applies_to: "option exercise; opportunity negotiate/counter-offer/accept; engagement confirm/complete; dispute create; audit create; statement generate"

  - priority: 12
    category: business_referential
    check: "Cross-entity state gates: artist not ARCHIVED (ERR_ARTIST_ARCHIVED); covering agreement exists (ERR_NO_COVERING_AGREEMENT) and is in a commissionable posture (ERR_AGREEMENT_NOT_ACTIVE); rate schedule exists for verify (ERR_NO_RATE_SCHEDULE); linked opportunity ACCEPTED/CONVERTED (ERR_OPPORTUNITY_NOT_ACCEPTED); artist approval present for high-value accept (ERR_ARTIST_APPROVAL_REQUIRED); immediately-preceding statement not DRAFT (ERR_PRIOR_STATEMENT_OPEN); all disputes resolved before amend (ERR_DISPUTE_NOT_RESOLVED); adjustment parent SETTLED/POSTED (ERR_ADJUSTMENT_PARENT_INVALID)"
    error_id: "ERR_ARTIST_ARCHIVED | ERR_NO_COVERING_AGREEMENT | ERR_AGREEMENT_NOT_ACTIVE | ERR_NO_RATE_SCHEDULE | ERR_OPPORTUNITY_NOT_ACCEPTED | ERR_ARTIST_APPROVAL_REQUIRED | ERR_PRIOR_STATEMENT_OPEN | ERR_DISPUTE_NOT_RESOLVED | ERR_ADJUSTMENT_PARENT_INVALID"
    http_status: "409 | 422"
    applies_to: "income verify/create; option create/exercise; engagement confirm; opportunity accept; statement generate/amend; agreement activate; income-event create (adjustment kind)"

  - priority: 13
    category: business_constraint
    check: "Uniqueness/overlap constraints: rate-schedule windows (ERR_RATE_SCHEDULE_OVERLAP), engagement buffered windows (ERR_ENGAGEMENT_OVERLAP), statement periods (ERR_STATEMENT_PERIOD_OVERLAP), one active dispute per statement (ERR_DISPUTE_ALREADY_ACTIVE), one non-CLOSED audit per statement (ERR_AUDIT_ALREADY_ACTIVE)"
    error_id: "ERR_RATE_SCHEDULE_OVERLAP | ERR_ENGAGEMENT_OVERLAP | ERR_STATEMENT_PERIOD_OVERLAP | ERR_DISPUTE_ALREADY_ACTIVE | ERR_AUDIT_ALREADY_ACTIVE"
    http_status: 409
    applies_to: "rate-schedule create/close; engagement confirm; opportunity convert; option exercise; statement generate; dispute create; audit create"

  - priority: 14
    category: business_fiscal
    check: "Money limits last: approver authority cap (ERR_APPROVAL_AUTHORITY_EXCEEDED), settle amount range (ERR_AMOUNT_OUT_OF_RANGE)"
    error_id: "ERR_APPROVAL_AUTHORITY_EXCEEDED | ERR_AMOUNT_OUT_OF_RANGE"
    http_status: 422
    applies_to: "POST /approval-requests/{id}/approve; POST /income-events/{id}/settle"

# =============================================================================
# Section 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Artist ---
  - { method: POST, path: "/artists", description: "Create an Artist (status ACTIVE, version 1)", roles: [FirmAdmin], code: 201, input: [stage_name, legal_name, primary_genre, "home_currency?"], output: Artist, side_effects: [] }
  - { method: GET, path: "/artists/{id}", description: "Get one Artist", roles: [FirmAdmin, Agent, BusinessManager, Publicist, Artist, Auditor], code: 200, input: [], output: Artist, side_effects: [] }
  - { method: GET, path: "/artists", description: "List artists with optional filters and pagination", roles: [FirmAdmin, Agent, BusinessManager, Publicist, Artist, Auditor], code: 200, input: ["status?", "current_agreement_id?", "limit?", "offset?"], output: "Artist[]", side_effects: [] }
  - { method: PATCH, path: "/artists/{id}", description: "Update mutable fields / status (ACTIVE<->ON_HIATUS, ->ARCHIVED per state machine)", roles: [FirmAdmin], code: 200, input: ["status?", "stage_name?", "home_currency?"], output: Artist, side_effects: ["status transitions per Artist state machine; increments Artist.version by 1; archiving cascades TeamMembers ACTIVE/SUSPENDED -> ENDED"] }

  # --- Agreement ---
  - { method: POST, path: "/agreements", description: "Create a management Agreement in DRAFT. OCC: expected_artist_version guards against superseding activations the caller has not observed.", roles: [FirmAdmin], code: 201, input: [artist_id, term_start_date, term_end_date, expected_artist_version, "touring_commission_base?", "recoupment_policy?"], output: Agreement, side_effects: ["increments Artist.version by 1"] }
  - { method: GET, path: "/agreements/{id}", description: "Get one Agreement", roles: [FirmAdmin, Agent, BusinessManager, Publicist, Artist, Auditor], code: 200, input: [], output: Agreement, side_effects: [] }
  - { method: GET, path: "/agreements", description: "List agreements (FK reverse lookup by artist_id; supersede chain via prior_agreement_id)", roles: [FirmAdmin, Agent, BusinessManager, Publicist, Artist, Auditor], code: 200, input: ["artist_id?", "prior_agreement_id?", "status?", "limit?", "offset?"], output: "Agreement[]", side_effects: [] }
  - { method: PATCH, path: "/agreements/{id}", description: "Edit an agreement. DRAFT: all input fields editable. ACTIVE: only term_end_date extension (new value must be > current term_end_date). Other statuses: ERR_INVALID_STATE. OCC on Agreement.version.", roles: [FirmAdmin], code: 200, input: [expected_agreement_version, "term_start_date?", "term_end_date?", "touring_commission_base?", "recoupment_policy?"], output: Agreement, side_effects: ["increments Agreement.version by 1"] }
  - { method: POST, path: "/agreements/{id}/activate", description: "DRAFT -> ACTIVE; supersedes the artist's current ACTIVE agreement if any", roles: [FirmAdmin], code: 200, input: [], output: Agreement, side_effects: ["prior ACTIVE agreement -> SUPERSEDED with sunset window opened", "Artist.current_agreement_id updated", "increments Artist.version by 1"] }
  - { method: POST, path: "/agreements/{id}/terminate", description: "ACTIVE -> TERMINATED early; opens sunset window at termination_date", roles: [FirmAdmin], code: 200, input: [termination_date], output: Agreement, side_effects: ["sunset_start/end computed", "Artist.current_agreement_id = null", "increments Artist.version by 1"] }

  # --- CommissionRateSchedule ---
  - { method: POST, path: "/rate-schedules", description: "Create an effective-dated rate schedule; half-open window non-overlap enforced per (agreement_id, income_type)", roles: [FirmAdmin, BusinessManager], code: 201, input: [agreement_id, income_type, in_term_rate_bps, sunset_rate_bps, sunset_months, effective_from_date, "effective_to_date?"], output: CommissionRateSchedule, side_effects: ["rate_schedule_overlap_detection"] }
  - { method: GET, path: "/rate-schedules/{id}", description: "Get one CommissionRateSchedule", roles: [FirmAdmin, Agent, BusinessManager, Publicist, Artist, Auditor], code: 200, input: [], output: CommissionRateSchedule, side_effects: [] }
  - { method: GET, path: "/rate-schedules", description: "List rate schedules (FK reverse lookup by agreement_id)", roles: [FirmAdmin, Agent, BusinessManager, Publicist, Artist, Auditor], code: 200, input: ["agreement_id?", "income_type?", "limit?", "offset?"], output: "CommissionRateSchedule[]", side_effects: [] }
  - { method: POST, path: "/rate-schedules/{id}/close", description: "Pin effective_to_date on an open schedule; overlap re-validated", roles: [FirmAdmin, BusinessManager], code: 200, input: [effective_to_date], output: CommissionRateSchedule, side_effects: ["rate_schedule_overlap_detection"] }

  # --- IncomeEvent ---
  - { method: POST, path: "/income-events", description: "Report an income event (REPORTED). Server resolves agreement_id: among the artist's agreements with term_start_date <= recognition_date, the one with the greatest term_start_date, ties broken by created_at ASC (ERR_NO_COVERING_AGREEMENT when none). kind=ADJUSTMENT requires parent_event_id in SETTLED/POSTED (ERR_ADJUSTMENT_PARENT_INVALID).", roles: [Agent, BusinessManager], code: 201, input: [artist_id, income_type, gross_amount_cents, recognition_date, source_name, "linked_engagement_id?", "kind?", "parent_event_id?"], output: IncomeEvent, side_effects: ["agreement_id resolved and pinned", "reported_by_user_id = caller"] }
  - { method: GET, path: "/income-events/{id}", description: "Get one IncomeEvent", roles: [FirmAdmin, Agent, BusinessManager, Publicist, Artist, Auditor], code: 200, input: [], output: IncomeEvent, side_effects: [] }
  - { method: GET, path: "/income-events", description: "List income events (FK reverse lookups)", roles: [FirmAdmin, Agent, BusinessManager, Publicist, Artist, Auditor], code: 200, input: ["artist_id?", "agreement_id?", "linked_engagement_id?", "parent_event_id?", "statement_id?", "recoup_statement_id?", "applied_schedule_id?", "status?", "income_type?", "limit?", "offset?"], output: "IncomeEvent[]", side_effects: [] }
  - { method: POST, path: "/income-events/{id}/verify", description: "REPORTED -> VERIFIED; pins rate schedule, term_relation (IN_TERM/SUNSET/POST_TERM_EXEMPT), commission, artist_net", roles: [BusinessManager], code: 200, input: [], output: IncomeEvent, side_effects: ["commission_rate_resolution", "commission_amount", "Artist.lifetime_commission_cents recomputed; increments Artist.version by 1"] }
  - { method: POST, path: "/income-events/{id}/settle", description: "VERIFIED/POSTED -> SETTLED; runs the recoupment waterfall cascade (event -> advances -> advance RECOUPED -> artist recompute)", roles: [BusinessManager], code: 200, input: [received_date, received_amount_cents], output: IncomeEvent, side_effects: ["advance_recoupment_waterfall", "Advances may flip ACTIVE -> RECOUPED", "Artist.unrecouped_advance_balance_cents recomputed; increments Artist.version by 1", "linked COMPLETED Engagement -> SETTLED"] }
  - { method: POST, path: "/income-events/{id}/void", description: "REPORTED/VERIFIED -> VOIDED; SETTLED/POSTED rejected (ERR_EVENT_ALREADY_SETTLED)", roles: [BusinessManager], code: 200, input: [], output: IncomeEvent, side_effects: ["Artist.lifetime_gross_cents / lifetime_commission_cents recomputed"] }

  # --- Advance ---
  - { method: POST, path: "/advances", description: "Issue a recoupable advance (ACTIVE)", roles: [BusinessManager, FirmAdmin], code: 201, input: [artist_id, principal_cents, issued_date, "recoup_pct_bps?", "applies_to_income_types?"], output: Advance, side_effects: ["Artist.unrecouped_advance_balance_cents recomputed; increments Artist.version by 1"] }
  - { method: GET, path: "/advances/{id}", description: "Get one Advance", roles: [FirmAdmin, Agent, BusinessManager, Publicist, Artist, Auditor], code: 200, input: [], output: Advance, side_effects: [] }
  - { method: GET, path: "/advances", description: "List advances (FK reverse lookup by artist_id)", roles: [FirmAdmin, Agent, BusinessManager, Publicist, Artist, Auditor], code: 200, input: ["artist_id?", "status?", "limit?", "offset?"], output: "Advance[]", side_effects: [] }
  - { method: POST, path: "/advances/{id}/write-off", description: "ACTIVE -> WRITTEN_OFF; forgives outstanding balance", roles: [FirmAdmin], code: 200, input: [], output: Advance, side_effects: ["written_off_cents = outstanding_cents; outstanding_cents = 0", "Artist.unrecouped_advance_balance_cents recomputed; increments Artist.version by 1"] }

  # --- Expense ---
  - { method: POST, path: "/expenses", description: "Submit a reimbursable expense; auto-creates routed ApprovalRequests (PENDING_APPROVAL)", roles: [Agent, BusinessManager, Publicist], code: 201, input: [artist_id, category, amount_cents, incurred_date, description, "engagement_id?"], output: Expense, side_effects: ["expense_approval_routing creates PENDING ApprovalRequests"] }
  - { method: GET, path: "/expenses/{id}", description: "Get one Expense", roles: [FirmAdmin, Agent, BusinessManager, Publicist, Artist, Auditor], code: 200, input: [], output: Expense, side_effects: [] }
  - { method: GET, path: "/expenses", description: "List expenses (FK reverse lookups)", roles: [FirmAdmin, Agent, BusinessManager, Publicist, Artist, Auditor], code: 200, input: ["artist_id?", "engagement_id?", "reimbursed_statement_id?", "status?", "limit?", "offset?"], output: "Expense[]", side_effects: [] }
  - { method: POST, path: "/expenses/{id}/resubmit", description: "REJECTED -> PENDING_APPROVAL with optional edits; routing re-run, old requests already CANCELLED", roles: [Agent, BusinessManager, Publicist], code: 200, input: ["amount_cents?", "description?"], output: Expense, side_effects: ["expense_approval_routing re-run; fresh ApprovalRequests"] }

  # --- ApprovalRequest ---
  - { method: GET, path: "/approval-requests/{id}", description: "Get one ApprovalRequest", roles: [FirmAdmin, Agent, BusinessManager, Publicist, Artist, Auditor], code: 200, input: [], output: ApprovalRequest, side_effects: [] }
  - { method: GET, path: "/approval-requests", description: "List approval requests (FK reverse lookup by artist_id; filter by target)", roles: [FirmAdmin, Agent, BusinessManager, Publicist, Artist, Auditor], code: 200, input: ["artist_id?", "target_type?", "target_id?", "required_approver?", "status?", "limit?", "offset?"], output: "ApprovalRequest[]", side_effects: [] }
  - { method: POST, path: "/approval-requests/{id}/approve", description: "Approve a PENDING request; role must match required_approver; SoD and authority caps enforced; last approval flips an EXPENSE target to APPROVED", roles: [BusinessManager, Artist, FirmAdmin], code: 200, input: ["decision_note?"], output: ApprovalRequest, side_effects: ["target EXPENSE -> APPROVED when all its requests APPROVED"] }
  - { method: POST, path: "/approval-requests/{id}/reject", description: "Reject a PENDING request; EXPENSE target -> REJECTED, sibling PENDING requests -> CANCELLED", roles: [BusinessManager, Artist, FirmAdmin], code: 200, input: ["decision_note?"], output: ApprovalRequest, side_effects: ["EXPENSE target -> REJECTED; sibling PENDING requests -> CANCELLED"] }

  # --- Opportunity ---
  - { method: POST, path: "/opportunities", description: "Register an incoming offer (RECEIVED)", roles: [Agent], code: 201, input: [artist_id, income_type, counterparty_name, proposed_value_cents, offer_expiry_date, proposed_window_start, proposed_window_end, fit_score], output: Opportunity, side_effects: ["current_value_cents = proposed_value_cents; round_number = 0"] }
  - { method: GET, path: "/opportunities/{id}", description: "Get one Opportunity", roles: [FirmAdmin, Agent, BusinessManager, Publicist, Artist, Auditor], code: 200, input: [], output: Opportunity, side_effects: [] }
  - { method: GET, path: "/opportunities", description: "List opportunities (FK reverse lookup by artist_id)", roles: [FirmAdmin, Agent, BusinessManager, Publicist, Artist, Auditor], code: 200, input: ["artist_id?", "status?", "income_type?", "converted_engagement_id?", "limit?", "offset?"], output: "Opportunity[]", side_effects: [] }
  - { method: POST, path: "/opportunities/{id}/evaluate", description: "RECEIVED -> UNDER_EVALUATION (or refresh in place); computes evaluation_score and recommendation", roles: [Agent, BusinessManager], code: 200, input: [], output: Opportunity, side_effects: ["trailing_average_gross", "opportunity_evaluation_score"] }
  - { method: POST, path: "/opportunities/{id}/negotiate", description: "UNDER_EVALUATION -> NEGOTIATING; raises ARTIST ApprovalRequest when value crosses the approval threshold", roles: [Agent], code: 200, input: [], output: Opportunity, side_effects: ["may create ARTIST ApprovalRequest (PENDING)"] }
  - { method: POST, path: "/opportunities/{id}/counter-offer", description: "Record a counter-offer. OCC on Opportunity.version. Value delta <= 10%: stays NEGOTIATING; > 10%: loops back to UNDER_EVALUATION.", roles: [Agent], code: 200, input: [new_value_cents, expected_opportunity_version], output: Opportunity, side_effects: ["current_value_cents updated; round_number += 1; increments Opportunity.version by 1", "may create ARTIST ApprovalRequest when crossing the approval threshold"] }
  - { method: POST, path: "/opportunities/{id}/accept", description: "UNDER_EVALUATION/NEGOTIATING -> ACCEPTED; requires prior evaluation, unexpired offer, artist approval when required", roles: [Agent], code: 200, input: [], output: Opportunity, side_effects: [] }
  - { method: POST, path: "/opportunities/{id}/decline", description: "RECEIVED/UNDER_EVALUATION/NEGOTIATING -> DECLINED", roles: [Agent], code: 200, input: [], output: Opportunity, side_effects: ["pending ApprovalRequests -> CANCELLED"] }
  - { method: POST, path: "/opportunities/{id}/withdraw", description: "Counterparty pulls the offer: RECEIVED/UNDER_EVALUATION/NEGOTIATING -> WITHDRAWN", roles: [Agent], code: 200, input: [], output: Opportunity, side_effects: ["pending ApprovalRequests -> CANCELLED"] }
  - { method: POST, path: "/opportunities/{id}/convert", description: "ACCEPTED -> CONVERTED; creates a CONFIRMED engagement (overlap-checked); releases overlapping HOLDs and withdraws their opportunities", roles: [Agent], code: 201, input: [], output: Engagement, side_effects: ["creates CONFIRMED Engagement", "engagement_overlap_detection", "overlapping HOLD engagements -> RELEASED; their open opportunities -> WITHDRAWN"] }

  # --- Engagement ---
  - { method: POST, path: "/engagements", description: "Create a calendar engagement in HOLD (tentative hold; no overlap blocking)", roles: [Agent], code: 201, input: [artist_id, income_type, counterparty_name, start_datetime, end_datetime, guarantee_cents, "travel_buffer_hours?", "opportunity_id?"], output: Engagement, side_effects: [] }
  - { method: GET, path: "/engagements/{id}", description: "Get one Engagement", roles: [FirmAdmin, Agent, BusinessManager, Publicist, Artist, Auditor], code: 200, input: [], output: Engagement, side_effects: [] }
  - { method: GET, path: "/engagements", description: "List engagements (FK reverse lookups)", roles: [FirmAdmin, Agent, BusinessManager, Publicist, Artist, Auditor], code: 200, input: ["artist_id?", "opportunity_id?", "status?", "limit?", "offset?"], output: "Engagement[]", side_effects: [] }
  - { method: POST, path: "/engagements/{id}/confirm", description: "HOLD -> CONFIRMED; buffered-overlap check; releases overlapping HOLDs (cascade to their opportunities)", roles: [Agent], code: 200, input: [], output: Engagement, side_effects: ["confirmed_at = clock", "engagement_overlap_detection", "overlapping HOLDs -> RELEASED; their open opportunities -> WITHDRAWN"] }
  - { method: POST, path: "/engagements/{id}/complete", description: "CONFIRMED -> COMPLETED once the engagement has ended", roles: [Agent, BusinessManager], code: 200, input: [], output: Engagement, side_effects: [] }
  - { method: POST, path: "/engagements/{id}/cancel", description: "HOLD/CONFIRMED -> CANCELLED; blocked when verified income is linked", roles: [Agent], code: 200, input: [], output: Engagement, side_effects: [] }

  # --- Option ---
  - { method: POST, path: "/options", description: "Create a contract option (OPEN) on an ACTIVE agreement", roles: [Agent, FirmAdmin], code: 201, input: [artist_id, agreement_id, option_type, income_type, exercise_window_start, exercise_window_end, engagement_start_datetime, engagement_end_datetime, exercise_value_cents, "source_opportunity_id?"], output: Option, side_effects: [] }
  - { method: GET, path: "/options/{id}", description: "Get one Option", roles: [FirmAdmin, Agent, BusinessManager, Publicist, Artist, Auditor], code: 200, input: [], output: Option, side_effects: [] }
  - { method: GET, path: "/options", description: "List options (FK reverse lookups)", roles: [FirmAdmin, Agent, BusinessManager, Publicist, Artist, Auditor], code: 200, input: ["artist_id?", "agreement_id?", "source_opportunity_id?", "exercised_engagement_id?", "status?", "limit?", "offset?"], output: "Option[]", side_effects: [] }
  - { method: POST, path: "/options/{id}/exercise", description: "OPEN -> EXERCISED inside the inclusive window; creates a CONFIRMED engagement and cascades hold releases", roles: [Agent], code: 201, input: [], output: Engagement, side_effects: ["creates CONFIRMED Engagement", "engagement_overlap_detection", "overlapping HOLDs -> RELEASED; their open opportunities -> WITHDRAWN"] }
  - { method: POST, path: "/options/{id}/waive", description: "OPEN -> WAIVED (artist gives up the right)", roles: [Artist, FirmAdmin], code: 200, input: [], output: Option, side_effects: [] }

  # --- TeamMember ---
  - { method: POST, path: "/team-members", description: "Assign an agent / business manager / publicist to an artist (ACTIVE)", roles: [FirmAdmin], code: 201, input: [artist_id, member_role, display_name, window_start_date, "authority_expense_cap_cents?", "window_end_date?"], output: TeamMember, side_effects: [] }
  - { method: GET, path: "/team-members/{id}", description: "Get one TeamMember", roles: [FirmAdmin, Agent, BusinessManager, Publicist, Artist, Auditor], code: 200, input: [], output: TeamMember, side_effects: [] }
  - { method: GET, path: "/team-members", description: "List team members (FK reverse lookup by artist_id)", roles: [FirmAdmin, Agent, BusinessManager, Publicist, Artist, Auditor], code: 200, input: ["artist_id?", "member_role?", "status?", "limit?", "offset?"], output: "TeamMember[]", side_effects: [] }
  - { method: POST, path: "/team-members/{id}/suspend", description: "ACTIVE -> SUSPENDED (member may not act while suspended)", roles: [FirmAdmin], code: 200, input: [], output: TeamMember, side_effects: [] }
  - { method: POST, path: "/team-members/{id}/resume", description: "SUSPENDED -> ACTIVE", roles: [FirmAdmin], code: 200, input: [], output: TeamMember, side_effects: [] }
  - { method: POST, path: "/team-members/{id}/end", description: "ACTIVE/SUSPENDED -> ENDED", roles: [FirmAdmin], code: 200, input: [], output: TeamMember, side_effects: [] }

  # --- Statement ---
  - { method: POST, path: "/statements/generate", description: "Generate a DRAFT statement for a closed period; runs statement_generation (basis variant, carry chain, threshold, audit sweeps)", roles: [BusinessManager], code: 201, input: [artist_id, period_start_date, period_end_date, basis], output: Statement, side_effects: ["statement_generation", "creates StatementLines", "marks audit adjustment flags"] }
  - { method: GET, path: "/statements/{id}", description: "Get one Statement", roles: [FirmAdmin, Agent, BusinessManager, Publicist, Artist, Auditor], code: 200, input: [], output: Statement, side_effects: [] }
  - { method: GET, path: "/statements", description: "List statements (FK reverse lookups incl. carry chain)", roles: [FirmAdmin, Agent, BusinessManager, Publicist, Artist, Auditor], code: 200, input: ["artist_id?", "prior_statement_id?", "status?", "basis?", "limit?", "offset?"], output: "Statement[]", side_effects: [] }
  - { method: GET, path: "/statements/{id}/lines", description: "List the statement's lines (append-only; amendments add ADJUSTMENT lines)", roles: [FirmAdmin, Agent, BusinessManager, Publicist, Artist, Auditor], code: 200, input: ["limit?", "offset?"], output: "StatementLine[]", side_effects: [] }
  - { method: POST, path: "/statements/{id}/issue", description: "DRAFT -> ISSUED; freezes totals, opens 30-day dispute window, posts income events, marks expenses REIMBURSED", roles: [BusinessManager], code: 200, input: [], output: Statement, side_effects: ["income events -> POSTED", "expenses -> REIMBURSED", "recoup_statement_id set on swept events"] }
  - { method: POST, path: "/statements/{id}/acknowledge", description: "ISSUED -> ACKNOWLEDGED (artist accepts the statement)", roles: [Artist], code: 200, input: [], output: Statement, side_effects: [] }
  - { method: POST, path: "/statements/{id}/amend", description: "DISPUTED -> ISSUED as revision+1 once all disputes resolved; appends ADJUSTMENT lines for upheld disputes; totals recompute", roles: [BusinessManager], code: 200, input: [], output: Statement, side_effects: ["ADJUSTMENT lines appended", "totals recomputed", "fresh dispute window", "increments Artist.version by 1"] }
  - { method: POST, path: "/statements/{id}/disburse", description: "ACKNOWLEDGED -> FINALIZED; executes the pinned disbursed amount", roles: [BusinessManager], code: 200, input: [], output: Statement, side_effects: ["Artist.lifetime_disbursed_cents += disbursed_cents; increments Artist.version by 1"] }
  - { method: POST, path: "/statements/{id}/discard", description: "DRAFT -> DISCARDED (withdraw a draft statement)", roles: [BusinessManager], code: 200, input: [], output: Statement, side_effects: [] }

  # --- Dispute ---
  - { method: POST, path: "/disputes", description: "Artist opens a dispute against an ISSUED statement inside the 30-day window; statement -> DISPUTED", roles: [Artist], code: 201, input: [artist_id, statement_id, reason, claimed_amount_cents], output: Dispute, side_effects: ["Statement ISSUED -> DISPUTED"] }
  - { method: GET, path: "/disputes/{id}", description: "Get one Dispute", roles: [FirmAdmin, Agent, BusinessManager, Publicist, Artist, Auditor], code: 200, input: [], output: Dispute, side_effects: [] }
  - { method: GET, path: "/disputes", description: "List disputes (FK reverse lookups)", roles: [FirmAdmin, Agent, BusinessManager, Publicist, Artist, Auditor], code: 200, input: ["artist_id?", "statement_id?", "status?", "limit?", "offset?"], output: "Dispute[]", side_effects: [] }
  - { method: POST, path: "/disputes/{id}/start-review", description: "OPEN -> UNDER_REVIEW", roles: [BusinessManager], code: 200, input: [], output: Dispute, side_effects: [] }
  - { method: POST, path: "/disputes/{id}/resolve", description: "UNDER_REVIEW -> RESOLVED_UPHELD (awarded_amount_cents required) or RESOLVED_REJECTED", roles: [BusinessManager, FirmAdmin], code: 200, input: [outcome, "awarded_amount_cents?", "resolution_note?"], output: Dispute, side_effects: ["awarded amounts feed the next amendment as ADJUSTMENT lines"] }
  - { method: POST, path: "/disputes/{id}/withdraw", description: "OPEN/UNDER_REVIEW -> WITHDRAWN; statement reverts DISPUTED -> ISSUED when no active dispute remains", roles: [Artist], code: 200, input: [], output: Dispute, side_effects: ["may revert Statement DISPUTED -> ISSUED"] }
  - { method: POST, path: "/disputes/{id}/escalate", description: "OPEN/UNDER_REVIEW -> ESCALATED; creates an Audit in REQUESTED", roles: [Artist], code: 201, input: [], output: Audit, side_effects: ["creates Audit (REQUESTED, source_dispute_id set)"] }

  # --- Audit ---
  - { method: POST, path: "/audits", description: "Artist demands an audit of a statement issued within the last 365 days (audit right survives artist archiving)", roles: [Artist], code: 201, input: [artist_id, scope_statement_id], output: Audit, side_effects: [] }
  - { method: GET, path: "/audits/{id}", description: "Get one Audit", roles: [FirmAdmin, Agent, BusinessManager, Publicist, Artist, Auditor], code: 200, input: [], output: Audit, side_effects: [] }
  - { method: GET, path: "/audits", description: "List audits (FK reverse lookups)", roles: [FirmAdmin, Agent, BusinessManager, Publicist, Artist, Auditor], code: 200, input: ["artist_id?", "scope_statement_id?", "source_dispute_id?", "status?", "limit?", "offset?"], output: "Audit[]", side_effects: [] }
  - { method: POST, path: "/audits/{id}/begin", description: "REQUESTED -> IN_PROGRESS", roles: [Auditor], code: 200, input: [], output: Audit, side_effects: [] }
  - { method: POST, path: "/audits/{id}/issue-findings", description: "IN_PROGRESS -> FINDINGS_ISSUED; runs audit_cost_allocation (firm bears costs at >= 5% underpayment or >= $25,000)", roles: [Auditor], code: 200, input: [findings_underpayment_cents, audit_cost_cents], output: Audit, side_effects: ["audit_cost_allocation sets cost_bearer"] }
  - { method: POST, path: "/audits/{id}/reopen", description: "FINDINGS_ISSUED -> IN_PROGRESS (artist objection); max 2 reopens", roles: [Artist], code: 200, input: [], output: Audit, side_effects: ["reopen_count += 1"] }
  - { method: POST, path: "/audits/{id}/close", description: "FINDINGS_ISSUED -> CLOSED", roles: [Auditor, FirmAdmin], code: 200, input: [], output: Audit, side_effects: [] }

  # --- Logical clock (test-driving endpoint) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the logical clock used by every temporal rule (sunset windows, option lapses, offer expiry, dispute windows, deemed acceptance, team windows). Startup default is exactly 2026-08-01T00:00:00Z; the clock never reads wall-clock time. to_iso8601 must be >= the current logical time (ERR_INVALID_REQUEST on regression). The sweep applies: Agreement ACTIVE->EXPIRED -> SUNSET/CLOSED, SUNSET->CLOSED, Option OPEN->LAPSED, Opportunity ->EXPIRED, Statement ISSUED->ACKNOWLEDGED (deemed acceptance past dispute window), TeamMember ACTIVE->ENDED past window_end_date."
    roles: [FirmAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ agreements_expired: integer, agreements_sunset: integer, agreements_closed: integer, options_lapsed: integer, opportunities_expired: integer, statements_acknowledged: integer, team_members_ended: integer }"
    side_effects: ["applies every time-driven automatic transition"]

# =============================================================================
# Section 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role is not in the endpoint's roles list, or the caller's role does not match an ApprovalRequest's required_approver" }
  - { id: ERR_ARTIST_ACCESS_DENIED, http: 403, condition: "Entity-backed caller's artist scope does not match the target resource's artist chain (TeamMember serves a different artist, or Artist touches another artist's resource)" }
  - { id: ERR_TEAM_MEMBER_INACTIVE, http: 403, condition: "Entity-backed TeamMember caller is SUSPENDED or ENDED" }
  # --- request / existence ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, enum out of range, non-positive amount, window end <= start, clock regression" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not resolve to an existing resource" }
  - { id: ERR_INVALID_REFERENCE, http: 422, condition: "Body-supplied foreign key does not resolve (artist_id, agreement_id, statement_id, engagement/opportunity/parent links)" }
  # --- state ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a state from which the requested transition exists" }
  - { id: ERR_STALE_ARTIST_VERSION, http: 412, condition: "POST /agreements carried an expected_artist_version older than the artist's current version" }
  - { id: ERR_STALE_AGREEMENT_VERSION, http: 412, condition: "PATCH /agreements/{id} carried an expected_agreement_version older than the agreement's current version" }
  - { id: ERR_STALE_OPPORTUNITY_VERSION, http: 412, condition: "Counter-offer carried an expected_opportunity_version older than the opportunity's current version" }
  # --- segregation of duties ---
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Approver/verifier X-User-ID equals the submitter/reporter of the same record" }
  # --- agreement / rates ---
  - { id: ERR_ARTIST_ARCHIVED, http: 409, condition: "Mutation blocked because the artist is ARCHIVED (disputes and audits on existing statements exempt)" }
  - { id: ERR_NO_COVERING_AGREEMENT, http: 409, condition: "No agreement of the artist covers the income event's recognition_date (term or sunset window)" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Agreement exists but is DRAFT/CLOSED (verify) or not ACTIVE (option create/exercise)" }
  - { id: ERR_NO_RATE_SCHEDULE, http: 422, condition: "No CommissionRateSchedule for (agreement_id, income_type) covers the recognition_date; also blocks agreement activation with zero schedules" }
  - { id: ERR_RATE_SCHEDULE_OVERLAP, http: 409, condition: "Half-open effective window collides with another schedule of the same (agreement_id, income_type)" }
  # --- income events / advances ---
  - { id: ERR_EVENT_ALREADY_SETTLED, http: 409, condition: "Void attempted on a SETTLED or POSTED income event (use an ADJUSTMENT event instead)" }
  - { id: ERR_AMOUNT_OUT_OF_RANGE, http: 422, condition: "settle received_amount_cents not in (commission_amount_cents, gross_amount_cents], or other fiscal range violation" }
  - { id: ERR_ADJUSTMENT_PARENT_INVALID, http: 422, condition: "kind=ADJUSTMENT without parent_event_id, or parent not in SETTLED/POSTED" }
  # --- approvals ---
  - { id: ERR_APPROVAL_AUTHORITY_EXCEEDED, http: 422, condition: "BUSINESS_MANAGER approver's authority_expense_cap_cents is below the expense amount" }
  - { id: ERR_EXPENSE_NOT_REJECTED, http: 409, condition: "Resubmit attempted on an expense not in REJECTED" }
  # --- opportunity / engagement / option ---
  - { id: ERR_ARTIST_APPROVAL_REQUIRED, http: 409, condition: "Accept requires an APPROVED ARTIST ApprovalRequest (current_value_cents > 10000000)" }
  - { id: ERR_OFFER_EXPIRED, http: 409, condition: "clock date is past offer_expiry_date on negotiate / counter-offer / accept" }
  - { id: ERR_OPPORTUNITY_NOT_ACCEPTED, http: 409, condition: "Engagement confirm references an opportunity not in ACCEPTED/CONVERTED" }
  - { id: ERR_ENGAGEMENT_OVERLAP, http: 409, condition: "Buffered engagement window collides with another CONFIRMED engagement of the same artist" }
  - { id: ERR_ENGAGEMENT_WINDOW_PAST, http: 422, condition: "Confirm attempted when end_datetime is already in the past" }
  - { id: ERR_ENGAGEMENT_NOT_ENDED, http: 409, condition: "Complete attempted before end_datetime" }
  - { id: ERR_ENGAGEMENT_HAS_INCOME, http: 409, condition: "Cancel attempted with linked income events in VERIFIED/SETTLED/POSTED" }
  - { id: ERR_OPTION_WINDOW_VIOLATION, http: 409, condition: "Exercise attempted before exercise_window_start or after exercise_window_end (bounds inclusive)" }
  # --- statements / disputes / audits ---
  - { id: ERR_STATEMENT_PERIOD_OVERLAP, http: 409, condition: "Closed statement period collides with an existing non-DISCARDED statement of the artist" }
  - { id: ERR_STATEMENT_PERIOD_FUTURE, http: 422, condition: "period_end_date is after the logical clock date" }
  - { id: ERR_PRIOR_STATEMENT_OPEN, http: 409, condition: "The immediately preceding statement is still DRAFT" }
  - { id: ERR_DISPUTE_WINDOW_CLOSED, http: 409, condition: "Dispute attempted on an ACKNOWLEDGED/FINALIZED statement (the 30-day window has closed, possibly via deemed acceptance)" }
  - { id: ERR_DISPUTE_ALREADY_ACTIVE, http: 409, condition: "Another dispute on the same statement is OPEN or UNDER_REVIEW" }
  - { id: ERR_DISPUTE_NOT_RESOLVED, http: 409, condition: "Amend attempted while a dispute on the statement is still OPEN/UNDER_REVIEW/ESCALATED" }
  - { id: ERR_AUDIT_WINDOW_CLOSED, http: 409, condition: "Scope statement was issued more than 365 days before the logical clock" }
  - { id: ERR_AUDIT_ALREADY_ACTIVE, http: 409, condition: "Another audit on the same statement is not CLOSED" }
  - { id: ERR_AUDIT_REOPEN_LIMIT, http: 409, condition: "Audit has already been reopened twice" }

# =============================================================================
# Section 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FirmAdmin
    description: "Management-firm operations administrator: owns artists, agreements, rate schedules, team assignments, write-offs, the logical clock; top-tier approval authority"
    identity: opaque
    exclusive_operations:
      - "POST /artists, PATCH /artists/{id}"
      - "POST /agreements, PATCH /agreements/{id}, POST /agreements/{id}/activate, POST /agreements/{id}/terminate"
      - "POST /team-members, POST /team-members/{id}/suspend, POST /team-members/{id}/resume, POST /team-members/{id}/end"
      - "POST /advances/{id}/write-off"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /rate-schedules, POST /rate-schedules/{id}/close (with BusinessManager)"
      - "POST /advances (with BusinessManager)"
      - "POST /approval-requests/{id}/approve|reject as FIRM_ADMIN approver (with BusinessManager, Artist)"
      - "POST /disputes/{id}/resolve (with BusinessManager)"
      - "POST /options, POST /options/{id}/waive (with Agent / Artist respectively)"
      - "POST /audits/{id}/close (with Auditor)"
      - "All GET endpoints"

  - name: Agent
    description: "Talent agent serving an artist: books engagements, works the opportunity pipeline, exercises options, reports income, files expenses"
    identity: "entity_backed:TeamMember"
    exclusive_operations:
      - "POST /opportunities, POST /opportunities/{id}/negotiate, POST /opportunities/{id}/counter-offer, POST /opportunities/{id}/accept, POST /opportunities/{id}/decline, POST /opportunities/{id}/withdraw, POST /opportunities/{id}/convert"
      - "POST /engagements, POST /engagements/{id}/confirm, POST /engagements/{id}/cancel"
      - "POST /options/{id}/exercise"
    shared_operations:
      - "POST /income-events (with BusinessManager)"
      - "POST /opportunities/{id}/evaluate (with BusinessManager)"
      - "POST /engagements/{id}/complete (with BusinessManager)"
      - "POST /expenses, POST /expenses/{id}/resubmit (with BusinessManager, Publicist)"
      - "POST /options (with FirmAdmin)"
      - "All GET endpoints (scoped to own artist)"

  - name: BusinessManager
    description: "Business manager serving an artist: verifies and settles income, runs statements, approves expenses within authority, works disputes"
    identity: "entity_backed:TeamMember"
    exclusive_operations:
      - "POST /income-events/{id}/verify, POST /income-events/{id}/settle, POST /income-events/{id}/void"
      - "POST /statements/generate, POST /statements/{id}/issue, POST /statements/{id}/amend, POST /statements/{id}/disburse, POST /statements/{id}/discard"
      - "POST /disputes/{id}/start-review"
    shared_operations:
      - "POST /income-events (with Agent)"
      - "POST /advances (with FirmAdmin)"
      - "POST /rate-schedules, POST /rate-schedules/{id}/close (with FirmAdmin)"
      - "POST /approval-requests/{id}/approve|reject as BUSINESS_MANAGER approver"
      - "POST /disputes/{id}/resolve (with FirmAdmin)"
      - "POST /opportunities/{id}/evaluate (with Agent)"
      - "POST /engagements/{id}/complete (with Agent)"
      - "POST /expenses, POST /expenses/{id}/resubmit (with Agent, Publicist)"
      - "All GET endpoints (scoped to own artist)"

  - name: Publicist
    description: "Publicist serving an artist: may file marketing expenses and read artist records; no approval or money authority"
    identity: "entity_backed:TeamMember"
    exclusive_operations: []
    shared_operations:
      - "POST /expenses, POST /expenses/{id}/resubmit (with Agent, BusinessManager)"
      - "All GET endpoints (scoped to own artist)"

  - name: Artist
    description: "The artist themself: acknowledges statements, files/withdraws/escalates disputes, demands and re-opens audits, waives options, approves high-value items"
    identity: "entity_backed:Artist"
    exclusive_operations:
      - "POST /statements/{id}/acknowledge"
      - "POST /disputes, POST /disputes/{id}/withdraw, POST /disputes/{id}/escalate"
      - "POST /audits, POST /audits/{id}/reopen"
    shared_operations:
      - "POST /approval-requests/{id}/approve|reject as ARTIST approver"
      - "POST /options/{id}/waive (with FirmAdmin)"
      - "All GET endpoints (scoped to own resources)"

  - name: Auditor
    description: "External auditor (opaque user id, not on the artist's team): conducts audits requested by the artist"
    identity: opaque
    exclusive_operations:
      - "POST /audits/{id}/begin, POST /audits/{id}/issue-findings"
    shared_operations:
      - "POST /audits/{id}/close (with FirmAdmin)"
      - "All GET endpoints"
