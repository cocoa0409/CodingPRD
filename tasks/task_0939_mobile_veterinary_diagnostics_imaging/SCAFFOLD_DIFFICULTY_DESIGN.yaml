            - call: "POST /technicians"
              payload: { full_name: "Eve Marsh", certified_modalities: ["RADIOGRAPHY"] }
              as: PlatformAdmin
              captures: { tc_s: $.data.id }
            - call: "POST /routes"
              payload: { mobile_unit_id: "${un_s1}", technician_id: "${tc_s}", service_date: "2026-05-04", shift_start_minute: 480, shift_end_minute: 900 }
              as: Scheduler
              captures: { rt_s1: $.data.id, rts1_v1: $.data.version }
            - call: "POST /routes/${rt_s1}/stops"
              payload: { clinic_id: "${cl_s}", planned_arrival_minute: 500, service_minutes: 30, drive_minutes_from_prev: 10, stop_priority: "ROUTINE", expected_route_version: "${rts1_v1}" }
              as: Scheduler
              captures: { stop_day1: $.data.id }
            - call: "POST /routes"
              payload: { mobile_unit_id: "${un_s2}", technician_id: "${tc_s}", service_date: "2026-05-04", shift_start_minute: 480, shift_end_minute: 900 }
              as: Scheduler
              captures: { rt_s2: $.data.id, rts2_v1: $.data.version }
            - call: "POST /routes"
              payload: { mobile_unit_id: "${un_s2}", technician_id: "${tc_s}", service_date: "2026-05-05", shift_start_minute: 480, shift_end_minute: 900 }
              as: Scheduler
              captures: { rt_s3: $.data.id, rts3_v1: $.data.version }
          trigger:
            - call: "POST /routes/${rt_s2}/stops"
              payload: { clinic_id: "${cl_s}", planned_arrival_minute: 800, service_minutes: 30, drive_minutes_from_prev: 10, stop_priority: "ROUTINE", expected_route_version: "${rts2_v1}" }
              as: Scheduler
              captures: { err_id: $.data.error_id }
            - call: "POST /routes/${rt_s3}/stops"
              payload: { clinic_id: "${cl_s}", planned_arrival_minute: 800, service_minutes: 30, drive_minutes_from_prev: 10, stop_priority: "ROUTINE", expected_route_version: "${rts3_v1}" }
              as: Scheduler
              captures: { stop_day2: $.data.id }
          assert:
            - "${err_id} == ERR_CLINIC_STOP_ALREADY_SCHEDULED"
            - "HTTP status == 409"
            - "Route.${rt_s2}.stop_count == 0"
            - "RouteStop.${stop_day2}.clinic_id == ${cl_s}"
            - "GET /route-stops?clinic_id=${cl_s} returns exactly 2 rows"
            - "minute-level non-overlap (500..530 versus 800..830) does not rescue the same-day request: the clinic rule is day-granular"

  - rule_id: compensating_invariant
    instances:
      - name: block_ledger_draw_and_qc_refund_conserve_purchased_studies
        grounds:
          - conservation_invariants.INV_BLOCK_CONSERVATION
          - calculations.block_balance_projection
          - calculations.block_draw_decision
          - concurrency_rules[block-purchase-stale-contract]
          - entities.BlockLedgerEntry.fields.delta_studies
        distinguishing_aspect: |
          Conserved quantity #1 is a COUNT of prepaid study units. Posting a
          study draws one unit and a later equipment quarantine refunds it, and
          at every observation point
          block_purchased_studies == block_consumed_studies + block_remaining_studies
          holds exactly, with block_consumed_studies equal to minus the sum of
          the contract's BlockLedgerEntry.delta_studies — including across a
          mid-flight top-up that changes purchased from 1 to 3.
