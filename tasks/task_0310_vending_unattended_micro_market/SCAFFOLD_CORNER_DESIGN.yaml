# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for non-Difficulty tests)
# Breadth probe over §1.1-§1.7. excluded_because stubs cite §1.8 instances by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_host_site_minimal_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.HostSite, endpoints]
        distinguishing_aspect: "POST /operations/host-sites with name + contact_email returns 201; commission_model defaults FLAT, flat_commission_pct 0.10, monthly_guarantee_cents 0, status ACTIVE, lifetime_commission_cents 0, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /operations/host-sites"
              payload: { name: "H1", contact_email: "h1@x.com" }
              as: FieldOps
              captures: { hid: $.data.id }
          assert:
            - "response status == 201"
            - "HostSite.${hid}.commission_model == FLAT"
            - "HostSite.${hid}.flat_commission_pct == 0.10"
            - "HostSite.${hid}.monthly_guarantee_cents == 0"
            - "HostSite.${hid}.status == ACTIVE"
            - "HostSite.${hid}.lifetime_commission_cents == 0"
            - "HostSite.${hid}.version == 1"

      - name: create_product_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - "entities.Product"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /operations/products without unit_cost_cents returns ERR_INVALID_REQUEST (400); unit_cost_cents has no default and source input."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /operations/products"
              payload: { sku: "NOCOST", name: "No Cost", category: "SNACK" }
              as: FieldOps
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_product_invalid_category_enum_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.Product.fields.category"
          - "errors[ERR_INVALID_ENUM]"
        distinguishing_aspect: "POST /operations/products with category=CANDY (not in {BEVERAGE,SNACK,FRESH_FOOD}) returns ERR_INVALID_ENUM (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /operations/products"
              payload: { sku: "BAD", name: "Bad", category: "CANDY", unit_cost_cents: 30 }
              as: FieldOps
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_ENUM"

      - name: duplicate_product_sku_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.Product.fields.sku"
          - "errors[ERR_DUPLICATE_SKU]"
        distinguishing_aspect: "Second POST /operations/products with an already-used sku returns ERR_DUPLICATE_SKU (422)."
        test_recipe:
          setup: ["one product with sku DUP exists"]
          setup_api_calls:
            - call: "POST /operations/products"
              payload: { sku: "DUP", name: "First", category: "SNACK", unit_cost_cents: 30 }
              as: FieldOps
          trigger:
            - call: "POST /operations/products"
              payload: { sku: "DUP", name: "Second", category: "SNACK", unit_cost_cents: 35 }
              as: FieldOps
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_DUPLICATE_SKU"

      - name: duplicate_machine_asset_tag_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.Machine.fields.asset_tag"
          - "errors[ERR_DUPLICATE_ASSET_TAG]"
        distinguishing_aspect: "Second POST /operations/machines with an already-used asset_tag returns ERR_DUPLICATE_ASSET_TAG (422)."
        test_recipe:
          setup: ["one host and one machine with asset_tag TAG1 exist"]
          setup_api_calls:
            - call: "POST /operations/host-sites"
              payload: { name: "Hd", contact_email: "hd@x.com" }
              as: FieldOps
              captures: { hid: $.data.id }
            - call: "POST /operations/machines"
              payload: { host_site_id: "${hid}", asset_tag: "TAG1", machine_type: "SNACK_VENDOR" }
              as: FieldOps
          trigger:
            - call: "POST /operations/machines"
              payload: { host_site_id: "${hid}", asset_tag: "TAG1", machine_type: "BEVERAGE_VENDOR" }
              as: FieldOps
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_DUPLICATE_ASSET_TAG"

      - name: get_machine_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - "entities.Machine"
          - "errors[ERR_MACHINE_NOT_FOUND]"
        distinguishing_aspect: "GET /operations/machines/{id} with an unknown UUID returns ERR_MACHINE_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /operations/machines/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FieldOps
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_MACHINE_NOT_FOUND"

      - name: create_machine_with_unknown_host_returns_host_not_found
        claim_type: Parent Relationships
        grounds:
          - "entities.Machine.fields.host_site_id"
          - "errors[ERR_HOST_SITE_NOT_FOUND]"
        distinguishing_aspect: "POST /operations/machines whose body host_site_id references no host returns ERR_HOST_SITE_NOT_FOUND (404) — body FK existence per validation priority 4."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /operations/machines"
              payload: { host_site_id: "00000000-0000-4000-8000-000000000000", asset_tag: "T2", machine_type: "SNACK_VENDOR" }
              as: FieldOps
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_HOST_SITE_NOT_FOUND"

      - name: sale_is_immutable_event_no_version_field
        claim_type: Immutability
        grounds: [entities.Sale]
        distinguishing_aspect: "Sale is common_fields:false — a created Sale exposes id and created_at but no version/updated_at; the only mutation path is the void transition."
        test_recipe:
          setup: ["machine+slot stocked 10 units; one cashless sale qty1"]
          setup_api_calls:
            - call: "POST /operations/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: FieldOps
            - call: "POST /operations/host-sites"
              payload: { name: "Hi", contact_email: "hi@x.com" }
              as: FieldOps
              captures: { hid: $.data.id }
            - call: "POST /operations/products"
              payload: { sku: "IM", name: "Imm", category: "SNACK", unit_cost_cents: 20, shelf_life_days: 0 }
              as: FieldOps
              captures: { pid: $.data.id }
            - call: "POST /operations/machines"
              payload: { host_site_id: "${hid}", asset_tag: "IMT", machine_type: "SNACK_VENDOR" }
              as: FieldOps
              captures: { mid: $.data.id, mv0: $.data.version }
            - call: "POST /operations/machines/${mid}/slots"
              payload: { product_id: "${pid}", slot_code: "Z1", capacity: 10, par_level: 10, price_cents: 100 }
              as: FieldOps
              captures: { sid: $.data.id }
            - call: "POST /operations/drivers"
              payload: { full_name: "Imm Drv", employee_code: "EMPI" }
              as: FieldOps
              captures: { did: $.data.id }
            - call: "POST /operations/routes"
              payload: { driver_id: "${did}", service_date: "2026-06-20T00:00:00Z" }
              as: FieldOps
              captures: { rid: $.data.id }
            - call: "POST /operations/routes/${rid}/stops"
              payload: { machine_id: "${mid}", window_start_min: 480, window_end_min: 540 }
              as: FieldOps
              captures: { stid: $.data.id }
            - call: "POST /operations/routes/${rid}/dispatch"
              payload: {}
              as: FieldOps
            - call: "POST /operations/restock-visits"
              payload: { route_stop_id: "${stid}", counted_lines: [ { slot_id: "${sid}", physical_count: 0, refill_units: 10 } ], expected_machine_version: "${mv0}" }
              as: RouteDriver
              as_user_id: "${did}"
              captures: { vid: $.data.id }
            - call: "POST /operations/restock-visits/${vid}/reconcile"
              payload: { expected_machine_version: "${mv0}" }
              as: RouteDriver
              as_user_id: "${did}"
          trigger:
            - call: "POST /operations/sales"
              payload: { machine_id: "${mid}", slot_id: "${sid}", quantity: 1, payment_method: "CASHLESS" }
              as: FieldOps
              captures: { saleid: $.data.id }
          assert:
            - "response status == 201"
            - "Sale.${saleid} response contains id and created_at but no version field"

      - name: computed_machine_posture_input_ignored_on_create
        claim_type: Computed Fields
        grounds: [entities.Machine.fields.stock_status, entities.Machine.fields.cash_on_hand_cents]
        distinguishing_aspect: "Machine create ignores any client-sent stock_status/cash_on_hand_cents; server forces stock_status=STOCKOUT (no slots), cash_on_hand_cents=0, cash_status=CASH_OK, service_status=IN_SERVICE."
        test_recipe:
          setup: ["one host"]
          setup_api_calls:
            - call: "POST /operations/host-sites"
              payload: { name: "Hc", contact_email: "hc@x.com" }
              as: FieldOps
              captures: { hid: $.data.id }
          trigger:
            - call: "POST /operations/machines"
              payload: { host_site_id: "${hid}", asset_tag: "CT1", machine_type: "SNACK_VENDOR" }
              as: FieldOps
              captures: { mid: $.data.id }
          assert:
            - "Machine.${mid}.stock_status == STOCKOUT"
            - "Machine.${mid}.cash_on_hand_cents == 0"
            - "Machine.${mid}.cash_status == CASH_OK"
            - "Machine.${mid}.service_status == IN_SERVICE"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: reconcile_already_reconciled_visit_returns_not_draft
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.RestockVisit.DRAFT_to_RECONCILED"
          - "errors[ERR_VISIT_NOT_DRAFT]"
        distinguishing_aspect: "Reconciling a visit already in RECONCILED returns ERR_VISIT_NOT_DRAFT (409); terminal state lockdown, no second cascade fires."
        test_recipe:
          setup: ["a RECONCILED visit on a dispatched route (machine+slot, 10 units filled)"]
          setup_api_calls:
            - call: "POST /operations/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-21T00:00:00Z" }
              as: FieldOps
            - call: "POST /operations/host-sites"
              payload: { name: "Hr", contact_email: "hr@x.com" }
              as: FieldOps
              captures: { hid: $.data.id }
            - call: "POST /operations/products"
              payload: { sku: "RC", name: "Rc", category: "SNACK", unit_cost_cents: 20, shelf_life_days: 0 }
              as: FieldOps
              captures: { pid: $.data.id }
            - call: "POST /operations/machines"
              payload: { host_site_id: "${hid}", asset_tag: "RCT", machine_type: "SNACK_VENDOR" }
              as: FieldOps
              captures: { mid: $.data.id, mv0: $.data.version }
            - call: "POST /operations/machines/${mid}/slots"
              payload: { product_id: "${pid}", slot_code: "R1", capacity: 10, par_level: 10, price_cents: 100 }
              as: FieldOps
              captures: { sid: $.data.id }
            - call: "POST /operations/drivers"
              payload: { full_name: "Rc Drv", employee_code: "EMPR" }
              as: FieldOps
              captures: { did: $.data.id }
            - call: "POST /operations/routes"
              payload: { driver_id: "${did}", service_date: "2026-06-21T00:00:00Z" }
              as: FieldOps
              captures: { rid: $.data.id }
            - call: "POST /operations/routes/${rid}/stops"
              payload: { machine_id: "${mid}", window_start_min: 480, window_end_min: 540 }
              as: FieldOps
              captures: { stid: $.data.id }
            - call: "POST /operations/routes/${rid}/dispatch"
              payload: {}
              as: FieldOps
            - call: "POST /operations/restock-visits"
              payload: { route_stop_id: "${stid}", counted_lines: [ { slot_id: "${sid}", physical_count: 0, refill_units: 10 } ], expected_machine_version: "${mv0}" }
              as: RouteDriver
              as_user_id: "${did}"
              captures: { vid: $.data.id }
            - call: "POST /operations/restock-visits/${vid}/reconcile"
              payload: { expected_machine_version: "${mv0}" }
              as: RouteDriver
              as_user_id: "${did}"
              captures: { mv1: $.data.expected_machine_version }
            - call: "GET /operations/machines/${mid}"
              payload: {}
              as: FieldOps
              captures: { mvnow: $.data.version }
          trigger:
            - call: "POST /operations/restock-visits/${vid}/reconcile"
              payload: { expected_machine_version: "${mvnow}" }
              as: RouteDriver
              as_user_id: "${did}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_VISIT_NOT_DRAFT"

      - name: start_ticket_not_open_returns_not_open
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.ServiceTicket.OPEN_to_IN_PROGRESS"
          - "errors[ERR_TICKET_NOT_OPEN]"
        distinguishing_aspect: "Starting an IN_PROGRESS ticket via the OPEN->IN_PROGRESS trigger returns ERR_TICKET_NOT_OPEN (409)."
        test_recipe:
          setup: ["one machine with an IN_PROGRESS ticket"]
          setup_api_calls:
            - call: "POST /operations/host-sites"
              payload: { name: "Ht", contact_email: "ht@x.com" }
              as: FieldOps
              captures: { hid: $.data.id }
            - call: "POST /operations/machines"
              payload: { host_site_id: "${hid}", asset_tag: "TKT", machine_type: "SNACK_VENDOR" }
              as: FieldOps
              captures: { mid: $.data.id }
            - call: "POST /operations/machines/${mid}/service-tickets"
              payload: { issue_type: "JAM" }
              as: FieldOps
              captures: { tid: $.data.id }
            - call: "POST /operations/service-tickets/${tid}/start"
              payload: {}
              as: FieldOps
          trigger:
            - call: "POST /operations/service-tickets/${tid}/start"
              payload: {}
              as: FieldOps
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_TICKET_NOT_OPEN"

      - name: dispatch_empty_route_returns_route_empty
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.RestockRoute.DRAFT_to_DISPATCHED"
          - "errors[ERR_ROUTE_EMPTY]"
        distinguishing_aspect: "Dispatching a route with zero stops returns ERR_ROUTE_EMPTY (409)."
        test_recipe:
          setup: ["one ACTIVE driver, one DRAFT route with no stops"]
          setup_api_calls:
            - call: "POST /operations/drivers"
              payload: { full_name: "Empty Drv", employee_code: "EMPE" }
              as: FieldOps
              captures: { did: $.data.id }
            - call: "POST /operations/routes"
              payload: { driver_id: "${did}", service_date: "2026-06-22T00:00:00Z" }
              as: FieldOps
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /operations/routes/${rid}/dispatch"
              payload: {}
              as: FieldOps
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_ROUTE_EMPTY"

      - name: dispatch_route_inactive_driver_returns_driver_inactive
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.RestockRoute.DRAFT_to_DISPATCHED"
          - "errors[ERR_DRIVER_INACTIVE]"
          - "entities.RouteDriverProfile.fields.status"
        distinguishing_aspect: "Dispatching a route whose assigned driver is INACTIVE returns ERR_DRIVER_INACTIVE (409). (Driver inactivation reachable only if a driver-deactivate path exists; here the driver is created then made INACTIVE via the close path is N/A — instead the route references a driver that becomes INACTIVE; if no deactivation endpoint exists this corner is unreachable and is folded into ERR_DRIVER_INACTIVE catalog coverage.)"
        excluded_because:
          difficulty_instance: dual_variant_calc / dvc_gross_vs_net_commission_on_statement
          rationale: "No driver-deactivation endpoint is declared in §1.5, so an INACTIVE-driver dispatch state is not reachable from empty DB; ERR_DRIVER_INACTIVE remains a declared guard but is not separately exercisable. The dispatch happy-path (ACTIVE driver) is exercised within the named §1.8 setup chain."

      - name: close_route_with_unresolved_stop_returns_stops_unresolved
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.RestockRoute.DISPATCHED_to_CLOSED"
          - "errors[ERR_STOPS_UNRESOLVED]"
        distinguishing_aspect: "Closing a DISPATCHED route while a stop is still KITTED (not VISITED/SKIPPED) returns ERR_STOPS_UNRESOLVED (409)."
        test_recipe:
          setup: ["a dispatched route with one KITTED stop (no visit reconciled yet)"]
          setup_api_calls:
            - call: "POST /operations/host-sites"
              payload: { name: "Hu", contact_email: "hu@x.com" }
              as: FieldOps
              captures: { hid: $.data.id }
            - call: "POST /operations/machines"
              payload: { host_site_id: "${hid}", asset_tag: "URT", machine_type: "SNACK_VENDOR" }
              as: FieldOps
              captures: { mid: $.data.id }
            - call: "POST /operations/drivers"
              payload: { full_name: "U Drv", employee_code: "EMPU" }
              as: FieldOps
              captures: { did: $.data.id }
            - call: "POST /operations/routes"
              payload: { driver_id: "${did}", service_date: "2026-06-23T00:00:00Z" }
              as: FieldOps
              captures: { rid: $.data.id }
            - call: "POST /operations/routes/${rid}/stops"
              payload: { machine_id: "${mid}", window_start_min: 480, window_end_min: 540 }
              as: FieldOps
            - call: "POST /operations/routes/${rid}/dispatch"
              payload: {}
              as: FieldOps
          trigger:
            - call: "POST /operations/routes/${rid}/close"
              payload: {}
              as: FieldOps
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_STOPS_UNRESOLVED"

      - name: finalize_already_finalized_statement_returns_not_open
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.CommissionStatement.OPEN_to_FINALIZED"
          - "errors[ERR_STATEMENT_NOT_OPEN]"
        distinguishing_aspect: "Finalizing a FINALIZED statement returns ERR_STATEMENT_NOT_OPEN (409); lifetime balance is not double-credited."
        test_recipe:
          setup: ["a finalized statement for a host with no sales (net 0)"]
          setup_api_calls:
            - call: "POST /operations/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-24T00:00:00Z" }
              as: FieldOps
            - call: "POST /operations/host-sites"
              payload: { name: "Hf", contact_email: "hf@x.com", commission_model: "FLAT", flat_commission_pct: 0.10 }
              as: FieldOps
              captures: { hid: $.data.id }
            - call: "POST /operations/commission-statements"
              payload: { host_site_id: "${hid}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: FinanceClerk
              captures: { stid: $.data.id }
            - call: "POST /operations/commission-statements/${stid}/finalize"
              payload: {}
              as: FinanceClerk
          trigger:
            - call: "POST /operations/commission-statements/${stid}/finalize"
              payload: {}
              as: FinanceClerk
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_STATEMENT_NOT_OPEN"

      - name: finalize_blocked_while_draft_visit_pending
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.CommissionStatement.OPEN_to_FINALIZED"
          - "errors[ERR_VISITS_PENDING]"
        distinguishing_aspect: "Finalizing while a DRAFT RestockVisit exists on the host's machines within the period returns ERR_VISITS_PENDING (409)."
        test_recipe:
          setup: ["host+machine+slot; a dispatched route with a DRAFT (not yet reconciled) visit; an OPEN statement covering now"]
          setup_api_calls:
            - call: "POST /operations/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T00:00:00Z" }
              as: FieldOps
            - call: "POST /operations/host-sites"
              payload: { name: "Hp", contact_email: "hp@x.com", commission_model: "FLAT", flat_commission_pct: 0.10 }
              as: FieldOps
              captures: { hid: $.data.id }
            - call: "POST /operations/products"
              payload: { sku: "PD", name: "Pd", category: "SNACK", unit_cost_cents: 20, shelf_life_days: 0 }
              as: FieldOps
              captures: { pid: $.data.id }
            - call: "POST /operations/machines"
              payload: { host_site_id: "${hid}", asset_tag: "PDT", machine_type: "SNACK_VENDOR" }
              as: FieldOps
              captures: { mid: $.data.id, mv0: $.data.version }
            - call: "POST /operations/machines/${mid}/slots"
              payload: { product_id: "${pid}", slot_code: "PD1", capacity: 10, par_level: 10, price_cents: 100 }
              as: FieldOps
              captures: { sid: $.data.id }
            - call: "POST /operations/drivers"
              payload: { full_name: "Pd Drv", employee_code: "EMPP" }
              as: FieldOps
              captures: { did: $.data.id }
            - call: "POST /operations/routes"
              payload: { driver_id: "${did}", service_date: "2026-06-25T00:00:00Z" }
              as: FieldOps
              captures: { rid: $.data.id }
            - call: "POST /operations/routes/${rid}/stops"
              payload: { machine_id: "${mid}", window_start_min: 480, window_end_min: 540 }
              as: FieldOps
              captures: { stid: $.data.id }
            - call: "POST /operations/routes/${rid}/dispatch"
              payload: {}
              as: FieldOps
            - call: "POST /operations/restock-visits"
              payload: { route_stop_id: "${stid}", counted_lines: [ { slot_id: "${sid}", physical_count: 0, refill_units: 10 } ], expected_machine_version: "${mv0}" }
              as: RouteDriver
              as_user_id: "${did}"
            - call: "POST /operations/commission-statements"
              payload: { host_site_id: "${hid}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: FinanceClerk
              captures: { stid2: $.data.id }
          trigger:
            - call: "POST /operations/commission-statements/${stid2}/finalize"
              payload: {}
              as: FinanceClerk
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_VISITS_PENDING"

      - name: void_already_void_sale_returns_not_settled
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Sale.SETTLED_to_VOID"
          - "errors[ERR_SALE_NOT_SETTLED]"
        distinguishing_aspect: "Voiding a sale already VOID returns ERR_SALE_NOT_SETTLED (409); inventory not restored twice."
        test_recipe:
          setup: ["machine+slot 10 units; a cashless qty1 sale that has been voided once"]
          setup_api_calls:
            - call: "POST /operations/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-26T00:00:00Z" }
              as: FieldOps
            - call: "POST /operations/host-sites"
              payload: { name: "Hv", contact_email: "hv@x.com" }
              as: FieldOps
              captures: { hid: $.data.id }
            - call: "POST /operations/products"
