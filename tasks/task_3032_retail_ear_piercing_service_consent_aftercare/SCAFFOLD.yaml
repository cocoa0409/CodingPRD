    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: StoreLocation
    side_effects: ["status = CLOSED", "Cascades BOOKED/CONFIRMED appointments to CANCELLED", "Cascades ACTIVE piercers of the store to SUSPENDED"]

