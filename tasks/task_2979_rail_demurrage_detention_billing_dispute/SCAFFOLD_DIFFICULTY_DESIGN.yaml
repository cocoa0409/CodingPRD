              as: Customer
              as_user_id: "${cust_id}"
              captures: { dsp_id: $.data.id }
            - call: "POST /demurrage/disputes/${dsp_id}/evidence"
              payload: { evidence_type: "SWITCH_LIST", observed_at: "2026-08-06T00:00:00Z", description: "Switch list." }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T10:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/disputes/${dsp_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
