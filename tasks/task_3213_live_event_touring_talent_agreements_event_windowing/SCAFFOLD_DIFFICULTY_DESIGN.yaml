              as: TourPlanner
              captures: { ar_id: $.data.id }
            - call: "POST /touring/events"
              payload: { name: "D1", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-05", start_time: "19:00", end_time: "21:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { d1_id: $.data.id, d1_v: $.data.version }
            - call: "POST /touring/bookings"
              payload: { event_id: "${d1_id}", talent_id: "${t_id}", segment_label: "MATCH_1" }
              as: TourPlanner
            - call: "POST /touring/events/${d1_id}/lock"
              payload: { expected_event_version: "${d1_v}" }
              as: TourPlanner
            - call: "POST /touring/events/${d1_id}/complete"
              payload: {}
              as: TourPlanner
            - call: "POST /touring/events"
              payload: { name: "D2", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-06", start_time: "19:00", end_time: "21:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { d2_id: $.data.id, d2_v: $.data.version }
            - call: "POST /touring/bookings"
              payload: { event_id: "${d2_id}", talent_id: "${t_id}", segment_label: "MATCH_1" }
              as: TourPlanner
            - call: "POST /touring/events/${d2_id}/lock"
              payload: { expected_event_version: "${d2_v}" }
              as: TourPlanner
            - call: "POST /touring/events/${d2_id}/complete"
              payload: {}
              as: TourPlanner
            - call: "POST /touring/events"
              payload: { name: "D3", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-07", start_time: "19:00", end_time: "21:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { d3_id: $.data.id, d3_v: $.data.version }
            - call: "POST /touring/bookings"
              payload: { event_id: "${d3_id}", talent_id: "${t_id}", segment_label: "MATCH_1" }
              as: TourPlanner
            - call: "POST /touring/events/${d3_id}/lock"
              payload: { expected_event_version: "${d3_v}" }
              as: TourPlanner
            - call: "POST /touring/events/${d3_id}/complete"
              payload: {}
              as: TourPlanner
            - call: "POST /touring/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: ContractAdmin
          trigger:
            - call: "POST /touring/talents/${t_id}/call-up"
              payload: { decision: "DEFER" }
              as: TalentRelations
              captures: { cu_id: $.data.id }
          assert:
            - "CallUpDecision.${cu_id}.readiness_score == 42"
            - "Talent.${t_id}.roster_tier == DEVELOPMENTAL (DEFER does not promote)"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: storyline_shelve_revive_cycle_resets_gaps
        grounds:
          - state_machines.Storyline.ACTIVE_to_SHELVED
          - state_machines.Storyline.SHELVED_to_ACTIVE
          - calculations.storyline_gap_rule
        distinguishing_aspect: |
          Cyclic machine on Storyline: ACTIVE -> SHELVED -> ACTIVE loop where the
          revive resets gap_count to 0, so a storyline shelved at 3 consecutive
          misses can accumulate a fresh 3-gap budget after revival.
        test_recipe:
          setup:
            - "ACTIVE storyline S with three PLANNED chapters on SCHEDULED events E1 (2026-09-05), E2 (2026-09-06), E3 (2026-09-07)"
            - "All three events cancelled, driving gap_count to 3 and shelving S"
          setup_api_calls:
            - call: "POST /touring/storylines"
              payload: { title: "Cycle Feud" }
              as: StorylineEditor
              captures: { s_id: $.data.id }
            - call: "POST /touring/arenas"
              payload: { name: "Cyc Arena", city: "Orlando", country_code: "US", capacity: 1000, merch_booths: 0, timezone: "America/New_York" }
              as: TourPlanner
              captures: { ar_id: $.data.id }
