              captures: { aoi14_id: "$.data.id" }
            - call: "POST /annual-operating-instructions/${aoi14_id}/use-records"
              payload: { pasture_id: "${p17_id}", planned_entry_date: "2026-08-15", planned_exit_date: "2026-09-15", planned_head_count: 60, livestock_kind: "CATTLE" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { ur14_id: "$.data.id" }
          trigger:
            - call: "POST /closure-orders"
              payload: { allotment_id: "${a14_id}", order_type: "WILDFIRE_CLOSURE", effective_start_date: "2026-10-08", effective_end_date: "2026-12-31", justification: "Burned area closed to livestock pending seeding establishment." }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { co15_id: "$.data.id" }
            - call: "POST /annual-operating-instructions/${aoi14_id}/use-records"
              payload: { pasture_id: "${p18_id}", planned_entry_date: "2026-08-15", planned_exit_date: "2026-09-15", planned_head_count: 60, livestock_kind: "CATTLE" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { ces1_error_id: "$.data.error_id" }
          assert:
            - "before the trigger: Allotment.${a14_id}.allotment_status == RESTRICTED, AnnualOperatingInstruction.${aoi14_id}.aoi_status == DRAFT and PastureUseRecord.${ur14_id}.planned_aums == 62.00 — the identical shape of call succeeds while the allotment is merely RESTRICTED"
            - "ClosureOrder.${co15_id}.order_status == ACTIVE and ClosureOrder.${co15_id}.reduction_pct == 1.0 (the server records 1.0 for WILDFIRE_CLOSURE even though the request omitted the field)"
            - "Allotment.${a14_id}.allotment_status == CLOSED"
            - "Allotment.${a14_id}.stocking_adjustment_pct == 1.0000 (a WILDFIRE_CLOSURE source dominates the ACTIVE 0.30 DROUGHT_REDUCTION and is NOT capped at 0.9)"
            - "Allotment.${a14_id}.effective_capacity_aums == 0"
            - "the second trigger call returns HTTP 409 with error_id ERR_ALLOTMENT_CLOSED"
            - "the failure is NOT a capacity failure: validations.priority_30 (ERR_ALLOTMENT_CAPACITY_EXCEEDED) does not apply to POST /annual-operating-instructions/{aoiId}/use-records at all, and the pasture aggregate rule is satisfied because 62.00 <= 300 on a pasture with no other record"
            - "the failure is NOT an AOI state failure: AnnualOperatingInstruction.${aoi14_id}.aoi_status is still DRAFT, which is exactly the status POST .../use-records requires"
            - "PastureUseRecord.${ur14_id} still exists and its planned_aums is still 62.00 — the closure does not retroactively delete scheduled windows"
            - "control: POST /annual-operating-instructions/${aoi14_id}/issue as u_officer_1 also returns 409 ERR_ALLOTMENT_CLOSED"
            - "control: POST /closure-orders/${co15_id}/lift as u_officer_1 returns Allotment.${a14_id}.allotment_status == RESTRICTED (NOT OPEN — the DROUGHT_REDUCTION order is still ACTIVE) with stocking_adjustment_pct 0.3000 and effective_capacity_aums 840, after which the identical use-record call on ${p18_id} returns 201 with planned_aums 62.00"

      - name: decision_effectiveness_gated_by_appeal_stay
        grounds:
          - state_machines.PermitDecision.FINAL_to_STAYED
          - state_machines.AppealCase.initial_state_FILED
          - validations.priority_12
          - errors.ERR_DECISION_STAYED
        distinguishing_aspect: |
          A different entity pair (PermitDecision depends on AppealCase): a FINAL decision that
          is otherwise perfectly effectuable — NEPA complete, deciding officer distinct from the
          author, effective_date set — cannot be made effective because a THIRD entity, an
          AppealCase filed by the permittee with stay_requested true, exists in appeal_status
          FILED with stay_granted true. The gate is bidirectional in time: the stay is created by
          the appeal filing, blocks make-effective while it stands, and is released by the
          adjudicator's AFFIRM, at which point the decision transitions STAYED -> EFFECTIVE and
          the cascade it was holding back finally runs.
        test_recipe:
          setup:
            - "An allotment with 1200 permitted AUMs, one 300-AUM pasture and an ISSUED 300-AUM permit"
            - "A STOCKING_ADJUSTMENT decision authored by u_spec_1 with adjustment_pct 0.20, NEPA complete, finalized by u_officer_1 (decision_status FINAL)"
            - "An AppealCase filed by the permittee with stay_requested true, so the decision moved FINAL -> STAYED and stay_granted is true"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "Stay Gate Allotment", admin_unit_code: "NV-055", acres: 24000, total_permitted_aums: 1200, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 1 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { a15_id: "$.data.id" }
            - call: "POST /allotments/${a15_id}/pastures"
              payload: { name: "Stay Pasture", pasture_aum_capacity: 300, sequence_order: 1, rest_required: false }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { p19_id: "$.data.id" }
            - call: "POST /permittees"
              payload: { name: "Appellant Cattle", contact_email: "appellant@example.com" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { m19_id: "$.data.id" }
            - call: "POST /permittees/${m19_id}/base-properties"
              payload: { base_property_type: "LAND", legal_description: "T41N R68E Sec 22 SW", carrying_capacity_aums: 400, controlled_since_date: "2007-01-01" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { bp19_id: "$.data.id" }
            - call: "POST /grazing-permits"
              payload: { allotment_id: "${a15_id}", permittee_id: "${m19_id}", base_property_id: "${bp19_id}", requested_aums: 300, term_start_date: "2026-01-01", term_end_date: "2030-12-31", livestock_kind: "CATTLE" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { g18_id: "$.data.id" }
            - call: "POST /grazing-permits/${g18_id}/issue"
              payload: {}
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "GET /allotments/${a15_id}"
              payload: {}
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { a15_ver: "$.data.version" }
            - call: "POST /permit-decisions"
              payload: { decision_type: "STOCKING_ADJUSTMENT", allotment_id: "${a15_id}", expected_allotment_version: "${a15_ver}", nepa_level: "EA", adjustment_pct: 0.20, effective_date: "2026-09-15", rationale: "Monitoring supports a twenty percent reduction in permitted use." }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { d15_id: "$.data.id" }
            - call: "POST /permit-decisions/${d15_id}/complete-environmental-review"
              payload: { nepa_findings_summary: "Environmental assessment finds no significant impact from the proposed reduction." }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
            - call: "POST /permit-decisions/${d15_id}/finalize"
              payload: {}
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "POST /permit-decisions/${d15_id}/appeals"
              payload: { appellant_permittee_id: "${m19_id}", stay_requested: true, statement_of_reasons: "The reduction was ordered without considering the permittee's own monitoring data." }
              as: Permittee
              as_user_id: "${m19_id}"
              captures: { ap15_id: "$.data.id" }
          trigger:
            - call: "POST /permit-decisions/${d15_id}/make-effective"
              payload: {}
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { ces2_error_id: "$.data.error_id" }
          assert:
            - "AppealCase.${ap15_id}.appeal_status == FILED"
            - "AppealCase.${ap15_id}.stay_granted == true"
            - "AppealCase.${ap15_id}.remand_count == 0"
            - "PermitDecision.${d15_id}.decision_status == STAYED"
            - "the trigger returns HTTP 409 with error_id ERR_DECISION_STAYED"
            - "Allotment.${a15_id}.stocking_adjustment_pct == 0.0000 and effective_capacity_aums == 1200 (the held-back cascade did not run)"
            - "control: while the stay stands, POST /permit-decisions for another STOCKING_ADJUSTMENT on ${a15_id} with a fresh expected_allotment_version also returns 409 ERR_DECISION_STAYED"
            - "control: POST /appeal-cases/${ap15_id}/docket as u_judge_1 then POST /appeal-cases/${ap15_id}/decide with appeal_outcome AFFIRM as u_judge_1 returns AppealCase.appeal_status AFFIRMED, PermitDecision.${d15_id}.decision_status EFFECTIVE, Allotment.${a15_id}.stocking_adjustment_pct 0.2000 and effective_capacity_aums 960"
            - "control: the deciding officer's own person, X-User-ID u_officer_1 presented under X-User-Role AppealsAdjudicator, on POST /appeal-cases/${ap15_id}/decide returns 403 ERR_SEGREGATION_OF_DUTIES (priority 4 compares X-User-ID only, and outranks the priority-8 appeal-state check); the same id under X-User-Role AuthorizedOfficer instead returns 403 ERR_UNAUTHORIZED at priority 3 because that role is not listed for the endpoint"

      - name: permit_renewal_gated_by_permittee_debt
        grounds:
          - validations.priority_28
          - calculations.permittee_outstanding_balance
