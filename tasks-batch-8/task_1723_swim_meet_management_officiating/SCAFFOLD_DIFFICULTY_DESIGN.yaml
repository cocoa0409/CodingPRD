            - { call: "POST /swimmers", payload: { team_id: "${team_t}", full_name: "T B", birth_date: "2014-01-02", gender: "M" }, as: TeamCoach, as_user_id: "${team_t}", captures: { sw_tb: "$.data.id" } }
            - { call: "POST /swimmers", payload: { team_id: "${team_t}", full_name: "T C", birth_date: "2014-01-03", gender: "M" }, as: TeamCoach, as_user_id: "${team_t}", captures: { sw_tc: "$.data.id" } }
            - { call: "POST /swimmers", payload: { team_id: "${team_t}", full_name: "T D", birth_date: "2014-01-04", gender: "M" }, as: TeamCoach, as_user_id: "${team_t}", captures: { sw_td: "$.data.id" } }
            - { call: "POST /events", payload: { meet_id: "${meet_t}", event_number: 1, gender: "M", age_group: "ELEVEN_TWELVE", stroke: "FREESTYLE", distance_meters: 50, is_relay: false, qualifying_time_cs: 3000, session_date: "2026-08-15", scheduled_start_minute: 540, scheduled_end_minute: 570 }, as: MeetDirector, captures: { ev_t: "$.data.id" } }
            - { call: "POST /entries", payload: { event_id: "${ev_t}", swimmer_id: "${sw_ta}", seed_time_cs: 2400 }, as: TeamCoach, as_user_id: "${team_t}", captures: { en_ta: "$.data.id" } }
            - { call: "POST /entries", payload: { event_id: "${ev_t}", swimmer_id: "${sw_tb}", seed_time_cs: 2450 }, as: TeamCoach, as_user_id: "${team_t}", captures: { en_tb: "$.data.id" } }
            - { call: "POST /entries", payload: { event_id: "${ev_t}", swimmer_id: "${sw_tc}", seed_time_cs: 2460 }, as: TeamCoach, as_user_id: "${team_t}", captures: { en_tc: "$.data.id" } }
            - { call: "POST /entries", payload: { event_id: "${ev_t}", swimmer_id: "${sw_td}", seed_time_cs: 2470 }, as: TeamCoach, as_user_id: "${team_t}", captures: { en_td: "$.data.id" } }
            - { call: "POST /entries/${en_ta}/verify", payload: {}, as: MeetDirector }
            - { call: "POST /entries/${en_tb}/verify", payload: {}, as: MeetDirector }
            - { call: "POST /entries/${en_tc}/verify", payload: {}, as: MeetDirector }
            - { call: "POST /entries/${en_td}/verify", payload: {}, as: MeetDirector }
            - { call: "POST /officials", payload: { meet_id: "${meet_t}", full_name: "Ref T", lsc_membership_id: "LSC-RT", certifications: ["REFEREE"], certification_expires_on: "2027-01-01" }, as: MeetDirector, captures: { off_tr: "$.data.id" } }
            - { call: "POST /officials", payload: { meet_id: "${meet_t}", full_name: "Jud T", lsc_membership_id: "LSC-JT", certifications: ["STROKE_TURN_JUDGE"], certification_expires_on: "2027-01-01" }, as: MeetDirector, captures: { off_tj: "$.data.id" } }
            - { call: "POST /events/${ev_t}/official-assignments", payload: { official_id: "${off_tr}", role_on_deck: "REFEREE" }, as: MeetDirector, captures: { oa_tr: "$.data.id" } }
            - { call: "POST /official-assignments/${oa_tr}/confirm", payload: {}, as: MeetReferee, as_user_id: "${off_tr}" }
            - { call: "POST /events/${ev_t}/official-assignments", payload: { official_id: "${off_tj}", role_on_deck: "STROKE_TURN_JUDGE" }, as: MeetDirector, captures: { oa_tj: "$.data.id" } }
            - { call: "POST /official-assignments/${oa_tj}/confirm", payload: {}, as: DeckOfficial, as_user_id: "${off_tj}" }
