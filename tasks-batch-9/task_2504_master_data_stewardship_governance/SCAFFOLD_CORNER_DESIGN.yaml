        distinguishing_aspect: "Switching basis must not overwrite the other basis's ledger field: after a PROVISIONAL run stores 100.00 and a later CERTIFIED run stores 40.00, both figures coexist on the domain and the run epoch has advanced twice - a single quality_score field would lose the provisional figure."
