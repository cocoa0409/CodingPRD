            - "${s1_cut} == false and ${mid_work} == 150.00 with ${mid_red} == 150.00 and ${mid_active} == ${job_id}: the ledger really did move before the cascade"
            - "${fail_verdict} == FAIL: spillage_seconds 90 exceeds SPILLAGE_MAX_SECONDS 60 even though co_ppm_air_free 20.0 is far under CO_WARN_PPM 50"
