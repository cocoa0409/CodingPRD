  # =========================================================================
  # Section: calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: fit_default_base_without_open_need
        claim_type: correct_result
        grounds: ["calculations.fit_score"]
        distinguishing_aspect: "No OPEN RosterNeed for the position (a CLOSED one is ignored) falls back to DEFAULT_BASE 20: fit = 20 * 1.00 * 1.0 - 0 = 20.00."
        test_recipe:
          setup: ["scout s, director d; prospect p (QB) BOARD_READY with locked report scheme_fit 1.00; a CLOSED QB need for 2026"]
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "S", level: "AREA", weight: 1.0, season_grade_mean: 6.00, season_grade_stdev: 1.00 }
              as: GeneralManager
              captures: { s1: $.data.id }
            - call: "POST /scouting/scouts"
              payload: { full_name: "D", level: "DIRECTOR" }
              as: GeneralManager
              captures: { d1: $.data.id }
            - call: "POST /scouting/roster-needs"
              payload: { season_year: 2026, position: "QB", priority_tier: "P1" }
              as: GeneralManager
              captures: { n1: $.data.id }
            - call: "POST /scouting/roster-needs/${n1}/close"
              payload: {}
              as: GeneralManager
            - call: "POST /scouting/prospects"
              payload: { full_name: "P", position: "QB", college: "A" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { p1: $.data.id }
            - call: "POST /scouting/prospects/${p1}/reports"
              payload: { raw_grade: 7.00, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { r1: $.data.id }
            - call: "POST /scouting/reports/${r1}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${s1}"
            - call: "POST /scouting/reports/${r1}/lock"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p1}/advance"
              payload: { to_state: "EVALUATED" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p1}/advance"
              payload: { to_state: "BOARD_READY" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/draft-boards"
              payload: { season_year: 2026 }
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /scouting/draft-boards/${b1}/entries"
              payload: { prospect_id: "${p1}" }
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { fit: $.data.fit_score }
          assert:
            - "entry fit_score == 20.00 (DEFAULT_BASE 20 * 1.00 * 1.0 - 0)"

      - name: normalized_grade_clamped_at_max
        claim_type: boundary_edge
        grounds: ["calculations.normalized_grade"]
        distinguishing_aspect: "Raw score far above the mean exceeds MAX_G and clamps to 9.00: 5.0 + 1.5*(9.00-5.00)/0.50 = 17.0 -> 9.00."
        test_recipe:
          setup: ["scout s (mean 5.00, sd 0.50), director d; prospect p with report raw 9.00 submitted"]
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "S", level: "AREA", weight: 1.0, season_grade_mean: 5.00, season_grade_stdev: 0.50 }
              as: GeneralManager
              captures: { s1: $.data.id }
            - call: "POST /scouting/scouts"
              payload: { full_name: "D", level: "DIRECTOR" }
              as: GeneralManager
              captures: { d1: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "P", position: "QB", college: "A" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { p1: $.data.id }
            - call: "POST /scouting/prospects/${p1}/reports"
              payload: { raw_grade: 9.00, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { r1: $.data.id }
            - call: "POST /scouting/reports/${r1}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${s1}"
          trigger:
            - call: "POST /scouting/reports/${r1}/lock"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { n: $.data.normalized_grade }
          assert:
            - "normalized_grade == 9.00 (clamped at MAX_G)"

      - name: cap_hit_bonus_proration_rounds_half_up
        claim_type: precision
        grounds: ["calculations.cap_hit_and_budget_posture", "entities.FreeAgentTarget.fields.annual_cap_hit_cents"]
        distinguishing_aspect: "Bonus proration rounds half-up to integer cents: 10000001/3 = 3333333.67 -> 3333334, so hit = 10000000 + 3333334 = 13333334."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /scouting/free-agent-targets"
              payload: { player_name: "Prorate", position: "TE", season_year: 2026, base_salary_cents: 10000000, signing_bonus_cents: 10000001, contract_years: 3 }
              as: GeneralManager
              captures: { hit: $.data.annual_cap_hit_cents }
          assert:
            - "annual_cap_hit_cents == 13333334"

      - name: budget_posture_exact_ten_percent_healthy
        claim_type: boundary_edge
        grounds: ["calculations.cap_hit_and_budget_posture"]
        distinguishing_aspect: "Posture threshold is strictly-less-than: available exactly 10% of total cap is HEALTHY; one cent below flips to TIGHT."
        test_recipe:
          setup:
            - "budget base_cap 100000000 rollover 0; OPEN need QB P3 2026"
            - "t1 OFFERED hit 80000000 (sign leaves available 20000000 == exactly 10%)"
            - "t2 OFFERED hit 1 (sign leaves available 19999999 < 10%)"
          setup_api_calls:
            - call: "POST /scouting/budgets"
              payload: { season_year: 2026, base_cap_cents: 100000000, rollover_cents: 0 }
              as: GeneralManager
              captures: { bud: $.data.id }
            - call: "POST /scouting/roster-needs"
              payload: { season_year: 2026, position: "QB", priority_tier: "P3" }
              as: GeneralManager
            - call: "POST /scouting/free-agent-targets"
              payload: { player_name: "T1", position: "QB", season_year: 2026, base_salary_cents: 80000000, signing_bonus_cents: 0, contract_years: 1 }
              as: GeneralManager
              captures: { t1: $.data.id }
            - call: "POST /scouting/free-agent-targets"
              payload: { player_name: "T2", position: "QB", season_year: 2026, base_salary_cents: 1, signing_bonus_cents: 0, contract_years: 1 }
              as: GeneralManager
              captures: { t2: $.data.id }
            - call: "POST /scouting/free-agent-targets/${t1}/advance"
              payload: { to_state: "EVALUATING" }
              as: GeneralManager
            - call: "POST /scouting/free-agent-targets/${t1}/advance"
              payload: { to_state: "APPROVED" }
              as: GeneralManager
            - call: "POST /scouting/free-agent-targets/${t1}/advance"
              payload: { to_state: "OFFERED" }
              as: GeneralManager
            - call: "POST /scouting/free-agent-targets/${t2}/advance"
              payload: { to_state: "EVALUATING" }
              as: GeneralManager
            - call: "POST /scouting/free-agent-targets/${t2}/advance"
              payload: { to_state: "APPROVED" }
              as: GeneralManager
            - call: "POST /scouting/free-agent-targets/${t2}/advance"
              payload: { to_state: "OFFERED" }
              as: GeneralManager
          trigger:
            - call: "POST /scouting/free-agent-targets/${t1}/sign"
              payload: { budget_id: "${bud}" }
              as: GeneralManager
            - call: "GET /scouting/budgets/${bud}"
              as: GeneralManager
              captures: { post1: $.data.posture, avail1: $.data.available_cents }
            - call: "POST /scouting/free-agent-targets/${t2}/sign"
              payload: { budget_id: "${bud}" }
              as: GeneralManager
            - call: "GET /scouting/budgets/${bud}"
              as: GeneralManager
              captures: { post2: $.data.posture, avail2: $.data.available_cents }
          assert:
            - "after first sign: available_cents == 20000000 (exactly 10%) and posture == HEALTHY"
            - "after second sign: available_cents == 19999999 and posture == TIGHT"

      - name: rerank_equal_composite_higher_fit_wins
        claim_type: correct_result
        grounds: ["calculations.board_rerank"]
        distinguishing_aspect: "Selector tie-break: equal composite 7.00 is broken by fit_score DESC — the QB (fit 90.00 via P1 need) outranks the WR (fit 20.00 via DEFAULT_BASE) regardless of insertion order."
        test_recipe:
          setup:
            - "scout s (mean 6.00 sd 1.50), director d; OPEN need QB P1 2026"
            - "p_lo WR and p_hi QB both composite 7.00 (raw 8.00 each), both BOARD_READY"
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "S", level: "AREA", weight: 1.0, season_grade_mean: 6.00, season_grade_stdev: 1.50 }
              as: GeneralManager
              captures: { s1: $.data.id }
            - call: "POST /scouting/scouts"
              payload: { full_name: "D", level: "DIRECTOR" }
              as: GeneralManager
              captures: { d1: $.data.id }
            - call: "POST /scouting/roster-needs"
              payload: { season_year: 2026, position: "QB", priority_tier: "P1" }
              as: GeneralManager
            - call: "POST /scouting/prospects"
              payload: { full_name: "Lo WR", position: "WR", college: "A" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { p_lo: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "Hi QB", position: "QB", college: "B" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { p_hi: $.data.id }
            - call: "POST /scouting/prospects/${p_lo}/reports"
              payload: { raw_grade: 8.00, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { r_lo: $.data.id }
            - call: "POST /scouting/prospects/${p_hi}/reports"
              payload: { raw_grade: 8.00, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { r_hi: $.data.id }
            - call: "POST /scouting/reports/${r_lo}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${s1}"
            - call: "POST /scouting/reports/${r_hi}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${s1}"
            - call: "POST /scouting/reports/${r_lo}/lock"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/reports/${r_hi}/lock"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p_lo}/advance"
              payload: { to_state: "EVALUATED" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p_lo}/advance"
              payload: { to_state: "BOARD_READY" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p_hi}/advance"
              payload: { to_state: "EVALUATED" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p_hi}/advance"
              payload: { to_state: "BOARD_READY" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/draft-boards"
              payload: { season_year: 2026 }
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /scouting/draft-boards/${b1}/entries"
              payload: { prospect_id: "${p_lo}" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/draft-boards/${b1}/entries"
              payload: { prospect_id: "${p_hi}" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "GET /scouting/draft-boards/${b1}/entries"
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { top: "$.data[0].prospect_id", toprank: "$.data[0].rank" }
          assert:
            - "entries[0].prospect_id == ${p_hi} with rank 1 (fit 90.00 > 20.00 breaks the 7.00 composite tie)"
            - "entries[1] is ${p_lo} with rank 2"

      - name: weight_change_recomputes_composite
        claim_type: computed_fields
        grounds: ["calculations.composite_prospect_grade", 'endpoints["POST /scouting/scouts/{id}/weight"]']
        distinguishing_aspect: "Derived-field reconciliation: changing scout A's weight from 1.5 to 3.0 (weights 0.75/0.25) recomputes composite to 5.00 + 1.84 = 6.84."
        test_recipe:
          setup:
            - "scoutA weight 1.5 (mean 6.00 sd 2.00), scoutB weight 1.0 (mean 6.00 sd 1.00), director d"
            - "prospect p with A's report raw 8.23 (normalized 6.67) and B's report raw 7.57 (normalized 7.36), both LOCKED; composite 6.94"
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "A", level: "AREA", weight: 1.5, season_grade_mean: 6.00, season_grade_stdev: 2.00 }
              as: GeneralManager
              captures: { sa: $.data.id }
            - call: "POST /scouting/scouts"
              payload: { full_name: "B", level: "AREA", weight: 1.0, season_grade_mean: 6.00, season_grade_stdev: 1.00 }
              as: GeneralManager
              captures: { sb: $.data.id }
            - call: "POST /scouting/scouts"
              payload: { full_name: "D", level: "DIRECTOR" }
              as: GeneralManager
              captures: { d1: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "P", position: "OT", college: "A" }
              as: AreaScout
              as_user_id: "${sa}"
              captures: { p1: $.data.id }
            - call: "POST /scouting/prospects/${p1}/reports"
              payload: { raw_grade: 8.23, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${sa}"
              captures: { ra: $.data.id }
            - call: "POST /scouting/prospects/${p1}/reports"
              payload: { raw_grade: 7.57, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${sb}"
              captures: { rb: $.data.id }
            - call: "POST /scouting/reports/${ra}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${sa}"
            - call: "POST /scouting/reports/${rb}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${sb}"
            - call: "POST /scouting/reports/${ra}/lock"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/reports/${rb}/lock"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
          trigger:
            - call: "POST /scouting/scouts/${sa}/weight"
              payload: { new_weight: 3.0 }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "GET /scouting/prospects/${p1}"
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { comp: $.data.composite_grade }
          assert:
            - "prospect ${p1}.composite_grade == 6.84 after weight change (0.75*6.67 -> 5.00; 0.25*7.36 -> 1.84)"

  # =========================================================================
  # Section: validations
  # =========================================================================
  - section: validations
    instances:
      - name: report_create_missing_required_grade
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Missing required raw_grade returns ERR_VALIDATION (400) before any state or uniqueness checks."
        test_recipe:
          setup: ["scout s; prospect p"]
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "S", level: "AREA" }
              as: GeneralManager
              captures: { s1: $.data.id }
            - call: "POST /scouting/prospects"
