# =============================================================================
# Pharmaceutical e-commerce compliance benchmark — SCAFFOLD_DIFFICULTY_DESIGN
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine Difficulty Rules
# defined in scaffold-generator §0.5. Every `grounds:` reference resolves to a
# declared element in SCAFFOLD.yaml; every `assert:` literal is computed below.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: adr_deadline_anchor_variant
        grounds:
          - calculations.adr_reporting_deadline
          - state_machines.AdverseReactionReport.REPORTED_to_SUBMITTED
          - entities.AdverseReactionReport.fields.severity
          - entities.AdverseReactionReport.fields.reporting_deadline_at
          - validations[priority=60]
        distinguishing_aspect: |
          Operates on AdverseReactionReport — the forward-looking variant
          (anchored at original reported_at) and the chronological variant
          (re-anchored at escalation_at) yield different reporting_deadline_at
          for the same escalated report; the scaffold pins forward-looking, so
          a NON_SERIOUS-then-escalated SERIOUS report whose original
          reported_at is more than 24h in the past is past deadline even
          though escalation just occurred.
        test_recipe:
          setup:
            - "Create platform with current_clock_iso advanced to 2025-01-01T00:00:00.000Z"
            - "Create Customer, Drug (any OTC drug — irrelevant to ADR)"
            - "Create AdverseReactionReport with severity=NON_SERIOUS at clock=2025-01-01T00:00:00Z; reporting_deadline_at = 2025-01-16T00:00:00Z (15 days)"
          trigger:
            - "POST /_clock/advance to 2025-01-02T00:00:00.001Z (one millisecond past 24h since reported_at)"
            - "POST /adverse-reactions/{id}/escalate (severity → SERIOUS)"
            - "POST /adverse-reactions/{id}/submit"
          assert:
            - "After escalate: AdverseReactionReport.reporting_deadline_at == 2025-01-02T00:00:00.000Z (= reported_at + 24h, FORWARD-LOOKING anchored at intake — NOT escalation_at + 24h)"
            - "submit returns 422 ERR_REPORTING_DEADLINE_PASSED (clock 2025-01-02T00:00:00.001Z > deadline 2025-01-02T00:00:00.000Z)"

      - name: vendor_qualification_score_ordering_variant
        grounds:
          - calculations.vendor_qualification_review_score
          - state_machines.Vendor.ACTIVE_to_REVIEW_REQUIRED
          - entities.Vendor.fields.qualification_status
          - entities.Vendor.fields.business_license_expires_at
        distinguishing_aspect: |
          Operates on Vendor — the tiered_then_weighted variant computes
          raw_total → TIER → WEIGHTED_SCORE = raw_total × tier_multiplier;
          the weighted_then_tier variant produces a different score for
          inputs near tier boundaries. Different entity domain than the
          AdverseReactionReport instance above.
        test_recipe:
          setup:
            - "Create platform with current_clock_iso=2025-01-15T00:00:00.000Z"
            - "Create Vendor with business_license_expires_at=2025-04-01T00:00:00.000Z, drug_operation_permit_expires_at=2025-04-01T00:00:00.000Z; no pharmacists exist"
          trigger:
            - "POST /_clock/advance to 2025-01-15T00:00:00.001Z (negligible advance to trigger evaluation)"
            - "GET /vendors/{vendorId}"
          assert:
            - "L_days = floor((2025-04-01T00:00:00 - 2025-01-15T00:00:00) / 1 day) == 76"
            - "P_days == 76"
            - "score(76) == 1 (since 30 <= 76 < 90)"
            - "raw_total == 1 + 1 + 0 == 2"
            - "TIER == 'YELLOW' (since 2 <= raw_total <= 4)"
            - "WEIGHTED_SCORE == 3.0 (== 2 * 1.5, rounded half-up to 1 decimal)"
            - "Vendor.qualification_status == 'REVIEW_REQUIRED' (TIER YELLOW triggers ACTIVE→REVIEW_REQUIRED on clock advance)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: cold_chain_score_per_reading_then_sum
        grounds:
          - calculations.cold_chain_excursion_score
          - entities.ColdChainShipment.fields.temperature_readings
          - entities.ColdChainShipment.fields.excursion_score
        distinguishing_aspect: |
          Mode (b) — nested rounding/order: the formula MUST compute
          severity_i * window_minutes_i per-reading FIRST and then SUM. The
          forbidden alternative ((sum severities) * (sum minutes)) yields a
          different integer for the same readings. Pinned ordering elevates a
          subtle ambiguity into a hard, falsifiable requirement.
        test_recipe:
          setup:
            - "Create platform; clock=2025-01-01T00:00:00.000Z"
            - "Create Vendor (active), Pharmacist (active+courier_qualified), Customer (real_name_verified=true), one cold-chain Drug (cold_chain_required=true, classification=OTC, control_category=NONE) on shelf"
            - "Create Order with one item qty=1; pay; review-bypass not needed for OTC; advance dispensing manually via PharmacistReReviewer second-line; APPROVE; dispense"
            - "Dispatch ColdChainShipment for the order"
          trigger:
            - "POST /cold-chain-shipments/{id}/readings { recorded_at: '2025-01-01T00:00:00.000Z', celsius_tenths: 200 }   # 20.0°C (critical severity=5)"
            - "POST /cold-chain-shipments/{id}/readings { recorded_at: '2025-01-01T00:01:00.000Z', celsius_tenths: 200 }   # 60s later, severity=5"
            - "POST /cold-chain-shipments/{id}/readings { recorded_at: '2025-01-01T00:07:00.000Z', celsius_tenths: 27 }    # 360s later, in-range severity=0"
          assert:
            - "Reading 0: window_minutes = ceil(60/60) = 1; per_reading = 5*1 = 5"
            - "Reading 1: window_minutes = ceil(360/60) = 6; per_reading = 5*6 = 30"
            - "Reading 2 (last): window_minutes = 1; per_reading = 0*1 = 0"
            - "ColdChainShipment.excursion_score == 35  # = 5 + 30 + 0; the forbidden (sum severities)*(sum minutes) = (5+5+0)*(1+6+1) = 80, which is wrong"

      - name: vendor_score_circular_tier_then_multiplier
        grounds:
          - calculations.vendor_qualification_review_score
          - entities.Vendor.fields.qualification_status
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency: TIER is keyed on raw_total,
          then folded back as a multiplier on that same raw_total. Order is
          pinned (Step 4 → Step 5 only). Reverse order (multiplier-then-tier)
          shifts boundary results. Different combinatorial mode from the
          mode-(b) cold-chain rounding instance above.
        test_recipe:
          setup:
            - "Create platform clock=2025-01-15T00:00:00.000Z"
            - "Create Vendor with both expiry dates 2025-02-10T00:00:00.000Z (26 days out, score=3 each); no pharmacists"
          trigger:
            - "POST /_clock/advance to 2025-01-15T00:00:00.001Z"
            - "GET /vendors/{vendorId}"
          assert:
            - "L_days == 26, P_days == 26; score(26) == 3 each"
            - "raw_total == 3 + 3 + 0 == 6"
            - "TIER == 'RED' (since raw_total >= 5); multiplier = 2.0"
            - "WEIGHTED_SCORE == 12.0 (= 6 * 2.0); a weighted_then_tier ordering would assign a different tier and yield 6*2.0=12.0 only by coincidence at this point — at boundary input 24/26 the orderings diverge"
            - "Vendor.qualification_status == 'REVIEW_REQUIRED' (TIER in {YELLOW, RED} forces ACTIVE→REVIEW_REQUIRED)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: pharmacist_review_request_change_cycle
        grounds:
          - state_machines.PharmacistReview.IN_REVIEW_to_REQUEST_CHANGE
          - state_machines.PharmacistReview.REQUEST_CHANGE_to_IN_REVIEW
          - entities.PharmacistReview.fields.revision_count
          - entities.PharmacistReview.fields.status
        distinguishing_aspect: |
          PharmacistReview has a true cycle (IN_REVIEW → REQUEST_CHANGE →
          IN_REVIEW), bounded by MAX_REVISIONS=2. Different entity from the
          parallel-dimensions instance below.
        test_recipe:
          setup:
            - "Create platform; clock=2025-01-01T00:00:00.000Z"
            - "Create Vendor active; PrescriberReviewerPharmacist (PR) active; PharmacistReReviewer (RR) active and != PR; Customer with real_name_verified=true; one PRESCRIPTION drug on shelf with control_category=NONE"
            - "Upload prescription, approve as PR, place order referencing it, pay, open-pharmacist-review as RR (review status IN_REVIEW)"
          trigger:
            - "POST /pharmacist-reviews/{rid}/request-change body={decision_notes:'need clarification on dose schedule'} as RR"
            - "POST /pharmacist-reviews/{rid}/resume as RR"
            - "POST /pharmacist-reviews/{rid}/request-change body={decision_notes:'still ambiguous on contraindication line'} as RR"
            - "POST /pharmacist-reviews/{rid}/resume as RR"
            - "POST /pharmacist-reviews/{rid}/request-change body={decision_notes:'third attempt should fail'} as RR"
          assert:
            - "After first round-trip: review.status == 'IN_REVIEW' AND review.revision_count == 1"
            - "After second round-trip: review.status == 'IN_REVIEW' AND review.revision_count == 2"
            - "Third request-change returns 409 ERR_REVIEW_MAX_REVISIONS"

      - name: order_parallel_payment_and_dispensing_dimensions
        grounds:
          - entities.Order.fields.payment_status
          - entities.Order.fields.dispensing_status
          - state_machines.Order.payment_UNPAID_to_payment_PAID
          - state_machines.Order.dispensing_PENDING_REVIEW_to_dispensing_PHARMACIST_REVIEWING
          - state_machines.Order.payment_PAID_to_payment_REFUNDED
        distinguishing_aspect: |
          Order has two independent state dimensions on the same row:
          payment_status (UNPAID→PAID→REFUNDED) and dispensing_status
          (PENDING_REVIEW→…→DELIVERED with REJECTED/CANCELLED branches).
          They evolve independently — pay can occur while dispensing is in
          PHARMACIST_REVIEWING; the REFUNDED transition is a system cascade
          off dispensing_status changes. Different entity from the cyclic
          instance above.
        test_recipe:
          setup:
            - "Create platform; OTC drug on shelf; Customer real_name_verified=true; PharmacistReReviewer != PrescriptionReviewer (irrelevant for OTC); place order qty=1, total_amount_cents=10000"
          trigger:
            - "POST /orders/{oid}/pay  (payment_status: UNPAID→PAID; dispensing_status untouched)"
            - "POST /orders/{oid}/open-pharmacist-review  (dispensing: PENDING_REVIEW → PHARMACIST_REVIEWING)"
            - "POST /pharmacist-reviews/{rid}/reject body={decision_notes:'dosage exceeds rationality threshold for this cohort'}"
          assert:
            - "After /pay: Order.payment_status == 'PAID' AND Order.dispensing_status == 'PENDING_REVIEW' (independent)"
            - "After /open-pharmacist-review: payment_status still 'PAID', dispensing_status == 'PHARMACIST_REVIEWING'"
            - "After review reject: dispensing_status == 'REJECTED' AND payment_status == 'REFUNDED' (auto-cascade because PAID + dispensing→REJECTED)"
            - "AuditLog has both action='PHARMACIST_REVIEW_REJECTED' and action='ORDER_REFUNDED' rows"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: vendor_suspended_drug_offshelf_order_rejected_prescription_archived
        grounds:
          - state_machines.Vendor.REVIEW_REQUIRED_to_SUSPENDED
          - state_machines.Drug.ON_SHELF_to_OFF_SHELF
          - state_machines.Order.dispensing_PHARMACIST_REVIEWING_to_dispensing_REJECTED
          - state_machines.Prescription.APPROVED_to_ARCHIVED
        distinguishing_aspect: |
          Depth-4 chain triggered by Vendor SUSPENDED transition:
          (1) Vendor → SUSPENDED causes (2) all Vendor's drugs ON_SHELF →
          OFF_SHELF; the OFF_SHELF transition causes (3) outstanding orders
          referencing those drugs that are PENDING_REVIEW or
          PHARMACIST_REVIEWING → REJECTED; the order rejection causes (4)
          prescription auto-archive evaluation (if no other outstanding
          orders, Prescription APPROVED → ARCHIVED). Each link causes the
          next — not a fan-out from the root.
        test_recipe:
          setup:
            - "Create platform; clock=2025-01-01T00:00:00.000Z"
            - "Create Vendor V with both expiry dates 2025-01-02T00:00:00.000Z (1 day out); REVIEW_REQUIRED already triggered at create-time? — instead create with expires=2025-01-02 and ALERT_DAYS=30 places it in REVIEW_REQUIRED, but the second hop SUSPENDED only fires when clock >= max(expiry). Set both expiries to 2025-01-02."
            - "Create Pharmacist PR (PrescriptionReviewer) active and Pharmacist RR (PharmacistReReviewer) active, both with certificates 2026-01-01"
            - "Create Drug D (PRESCRIPTION, on shelf) under V"
            - "Create Customer C with real_name_verified=true"
            - "Upload Prescription, approve as PR; place Order referencing prescription, qty=1; open-pharmacist-review as RR (Order now in PHARMACIST_REVIEWING)"
          trigger:
            - "POST /_clock/advance to 2025-01-02T00:00:00.001Z (past max(expiry))"
          assert:
            - "Vendor.qualification_status == 'SUSPENDED' (hop 1)"
            - "Drug.status == 'OFF_SHELF' (hop 2 — caused by hop 1)"
            - "Order.dispensing_status == 'REJECTED' (hop 3 — caused by hop 2)"
            - "Order.payment_status remains 'UNPAID' (we did not pay; refund cascade does not fire)"
            - "Prescription.status == 'ARCHIVED' (hop 4 — auto-archive after no outstanding non-terminal orders)"
            - "AuditLog contains ordered entries: VENDOR_SUSPENDED, then PHARMACIST_REVIEW_REJECTED, then (optionally — archive emits ExternalEvent only)"

      - name: review_reject_order_reject_payment_refund
        grounds:
          - state_machines.PharmacistReview.IN_REVIEW_to_REJECTED
          - state_machines.Order.dispensing_PHARMACIST_REVIEWING_to_dispensing_REJECTED
          - state_machines.Order.payment_PAID_to_payment_REFUNDED
        distinguishing_aspect: |
          Depth-3 chain originating from a different trigger
          (PharmacistReview rejection action endpoint, not a
          system-clock-driven sweep): (1) review.status=REJECTED causes (2)
          Order.dispensing_status=REJECTED, which causes (3)
          Order.payment_status=REFUNDED if it was PAID. Different originating
          transition from the vendor-suspension cascade above.
        test_recipe:
          setup:
            - "Create platform; OTC drug on shelf; Customer (real_name verified)"
            - "Place Order qty=1; pay; open-pharmacist-review as RR"
          trigger:
            - "POST /pharmacist-reviews/{rid}/reject body={decision_notes:'interaction risk with concurrent SSRI therapy'}"
          assert:
            - "PharmacistReview.status == 'REJECTED' (hop 1)"
            - "Order.dispensing_status == 'REJECTED' (hop 2 — caused by hop 1)"
            - "Order.payment_status == 'REFUNDED' (hop 3 — caused by hop 2 because payment_status was PAID at moment of cascade)"
            - "ExternalEvent rows: channel=PAYMENT event_type='order.refunded' exists exactly once (idempotency_key uniqueness)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: prescription_expired_vs_contraindication
        grounds:
          - validations[priority=21]
          - validations[priority=23]
          - state_machines.Prescription.REVIEW_PENDING_to_APPROVED
        distinguishing_aspect: |
          Error-category pair: business_temporal (ERR_PRESCRIPTION_EXPIRED,
          priority 21) vs business_safety (ERR_CONTRAINDICATION_VIOLATION,
          priority 23). Both fail simultaneously on
          POST /prescriptions/{id}/approve; temporal wins because lower
          priority number = higher precedence.
        test_recipe:
          setup:
            - "Create platform; clock=2025-02-01T00:00:00.000Z"
            - "Create Customer C with special_population_flags=['PREGNANCY']"
            - "Create Drug D with classification=PRESCRIPTION, contraindications=['PREGNANCY']"
            - "Upload Prescription with issued_at=2025-01-01T00:00:00.000Z, validity_days=7 (expires 2025-01-08); drug_items=[{drug_id:D, qty:1}]"
          trigger:
            - "POST /prescriptions/{id}/approve as PrescriptionReviewer (acting != future re-reviewer)"
          assert:
            - "Both checks fail; response status == 422 with error_id == 'ERR_PRESCRIPTION_EXPIRED' (priority 21 wins over priority 23)"
            - "Removing the prescription expiry by re-issuing the prescription with validity_days=999 changes the next approve call's error to 'ERR_CONTRAINDICATION_VIOLATION' (the lower-priority rule surfaces only when the higher-priority rule passes)"

      - name: state_vs_segregation_of_duties
        grounds:
          - validations[priority=4]
          - validations[priority=40]
          - state_machines.Order.dispensing_PENDING_REVIEW_to_dispensing_PHARMACIST_REVIEWING
        distinguishing_aspect: |
          Different error-category pair: state (ERR_ORDER_NOT_REVIEWABLE,
          priority 4) vs business_safety
          (ERR_SEGREGATION_OF_DUTIES_VIOLATION, priority 40). Both fail on
          POST /orders/{id}/open-pharmacist-review; state-priority wins.
        test_recipe:
          setup:
            - "Create platform; PrescriberReviewerPharmacist PR; create Customer; OTC and PRESCRIPTION drugs; upload Prescription approved by PR; place Order referencing prescription"
            - "Open-pharmacist-review with assigned_pharmacist_id=PR (segregation violation) — first call: Order is in PENDING_REVIEW so state OK, request fails with ERR_SEGREGATION_OF_DUTIES_VIOLATION"
            - "Reset by creating a fresh Order; transition Order to a state != PENDING_REVIEW first by cancelling it (dispensing_status=CANCELLED)"
          trigger:
            - "POST /orders/{cancelled-oid}/open-pharmacist-review with assigned_pharmacist_id=PR"
          assert:
            - "First call (state OK, sod violated): response 403 ERR_SEGREGATION_OF_DUTIES_VIOLATION"
            - "Second call (state bad, sod also violated): response 409 ERR_ORDER_NOT_REVIEWABLE (state priority 4 wins over sod priority 40)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: cold_chain_dispose_exact_threshold_inclusive_vs_exclusive
        grounds:
          - calculations.cold_chain_excursion_score
          - validations[priority=52]
          - state_machines.ColdChainShipment.DISPATCHED_to_DISPOSED
        distinguishing_aspect: |
          Numeric threshold boundary: the disposal rule is `>` (strict)
          rather than `>=`. excursion_score==30 must NOT be disposable;
          excursion_score==31 must be. Endpoint: POST
          /cold-chain-shipments/{id}/dispose.
        test_recipe:
          setup:
            - "Build cold-chain shipment for an APPROVED+DISPENSED Order"
            - "Append readings constructed so excursion_score == 30 exactly: r0={recorded_at:'2025-01-01T00:00:00.000Z', celsius_tenths:200} (severity 5), r1={recorded_at:'2025-01-01T00:06:00.000Z', celsius_tenths:27} (severity 0), r2={recorded_at:'2025-01-01T00:07:00.000Z', celsius_tenths:27}"
          trigger:
            - "POST /cold-chain-shipments/{id}/dispose"
          assert:
            - "r0 window_minutes = ceil(360/60) = 6; per_reading_score r0 = 5*6 = 30"
            - "r1 window_minutes = ceil(60/60) = 1; per_reading_score r1 = 0"
            - "r2 window_minutes = 1; per_reading_score r2 = 0"
            - "ColdChainShipment.excursion_score == 30"
            - "Dispose returns 422 ERR_DISPOSAL_NOT_JUSTIFIED  # excursion_score == 30 is NOT > threshold"
            - "After appending r3={recorded_at:'2025-01-01T00:08:00.000Z', celsius_tenths:120} (severity 1, last reading window=1): excursion_score == 31 and dispose succeeds with status DISPOSED"

      - name: empty_drug_items_array_on_prescription_upload
        grounds:
          - entities.Prescription.fields.drug_items
          - validations[priority=3.5]
          - errors.ERR_INVALID_REQUEST
          - endpoints["POST /pharma-platforms/{pid}/prescriptions"]
        distinguishing_aspect: |
          Empty-collection edge — different metric (collection cardinality vs
          numeric threshold) and different endpoint
          (POST /prescriptions vs POST /cold-chain-shipments/{id}/dispose).
          drug_items must be a non-empty array; an empty array fails
          ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "Create platform, Customer C real_name_verified=true"
          trigger:
            - "POST /prescriptions body={ customer_id:C, prescriber_name:'Dr X', prescriber_license_no:'LIC-001', image_url:'http://x', issued_at:'2025-01-01T00:00:00Z', validity_days:7, drug_items:[] }"
          assert:
            - "Response status == 400 with error_id == 'ERR_INVALID_REQUEST'  # drug_items is empty"
            - "After retry with drug_items=[{drug_id:D, qty:1}]: response 201 and Prescription.status == 'REVIEW_PENDING'"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: drug_shelve_requires_vendor_active
        grounds:
          - state_machines.Drug.PENDING_REVIEW_to_ON_SHELF
          - state_machines.Vendor.ACTIVE_to_REVIEW_REQUIRED
          - validations[priority=13]
          - entities.Drug.fields.vendor_id
          - entities.Vendor.fields.qualification_status
        distinguishing_aspect: |
          Drug→Vendor cross-entity dependency: Drug.shelve is only valid
          when Drug.vendor.qualification_status == ACTIVE. Different entity
          pair from the Order→Prescription dependency below.
        test_recipe:
          setup:
            - "Create platform clock=2025-01-15T00:00:00.000Z"
            - "Create Vendor V with both expiry dates 2025-01-30T00:00:00.000Z (15 days out — score(15)=3 each, raw_total=6, TIER=RED → vendor will be REVIEW_REQUIRED on next clock-advance)"
            - "Create Drug D under V (PRESCRIPTION, control_category=NONE)"
            - "POST /_clock/advance to 2025-01-15T00:00:00.001Z   # Vendor flips to REVIEW_REQUIRED"
          trigger:
            - "POST /drugs/{D}/shelve"
          assert:
            - "Vendor.qualification_status == 'REVIEW_REQUIRED'"
            - "Response 409 ERR_VENDOR_NOT_ACTIVE (Drug shelve blocked because Vendor not ACTIVE)"
            - "After POST /vendors/{V}/resubmit-qualification with new far-future expiry dates (Vendor → ACTIVE), POST /drugs/{D}/shelve returns 200 and Drug.status == 'ON_SHELF'"

      - name: order_pay_requires_prescription_approved
        grounds:
          - state_machines.Order.payment_UNPAID_to_payment_PAID
          - state_machines.Prescription.REVIEW_PENDING_to_APPROVED
          - entities.Order.fields.prescription_id
          - entities.Prescription.fields.status
          - errors.ERR_PRESCRIPTION_NOT_APPROVED
        distinguishing_aspect: |
          Order→Prescription cross-entity dependency: pay is only valid when
          referenced Prescription.status == APPROVED. Different entity pair
          from the Drug→Vendor instance above.
        test_recipe:
          setup:
            - "Create platform; PR + RR pharmacists; PRESCRIPTION drug on shelf; Customer real_name_verified=true"
            - "Upload prescription (status=REVIEW_PENDING); place Order referencing prescription"
          trigger:
            - "POST /orders/{oid}/pay  # while prescription still REVIEW_PENDING"
          assert:
            - "Response 409 ERR_PRESCRIPTION_NOT_APPROVED"
            - "After POST /prescriptions/{rxid}/approve as PR: subsequent POST /orders/{oid}/pay returns 200 and Order.payment_status == 'PAID'"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: purchase_limit_rolling_window_aggregate_capacity
        grounds:
          - calculations.purchase_limit_aggregation
          - entities.PurchaseLimitRule.fields.window_days
          - entities.PurchaseLimitRule.fields.max_units_per_window
          - entities.Order.fields.paid_at
          - validations[priority=33]
        distinguishing_aspect: |
          Resource: Customer's PAID-order activity. Interval semantics:
          aggregate-capacity over a rolling closed-open window
          [now-window_days, now); a new Order's units would push the sum
          beyond max_units_per_window → rejected. Different interval
          semantics (aggregate-capacity-over-rolling-window) from the
          adjacency-floored cold-chain instance below.
        test_recipe:
          setup:
            - "Create platform clock=2025-01-31T00:00:00.000Z"
            - "Create PurchaseLimitRule with control_category=PSYCHOTROPIC_II, window_days=30, max_units_per_window=10, blocks_special_populations=[]"
            - "Create Customer C real_name_verified=true; PR+RR pharmacists; Drug D (PRESCRIPTION, control_category=PSYCHOTROPIC_II, per_order_qty_cap=10) on shelf"
            - "Place historical Order O1 referencing approved prescription, items=[{D, qty:8}]; pay; paid_at=2025-01-15T00:00:00.000Z (within window)"
            - "Place historical Order O2 items=[{D, qty:1}]; pay; paid_at=2024-12-30T00:00:00.000Z (OUTSIDE window — rolling left edge is 2025-01-01T00:00:00Z, paid_at < left edge → excluded)"
          trigger:
            - "POST /orders body={items:[{D, qty:3}]} (proposed; would bring window total to 8+3=11 > 10)"
            - "Then retry POST /orders body={items:[{D, qty:2}]} (would bring to 8+2=10 == max, NOT exceeded since check is `>`)"
          assert:
            - "First request fails 422 ERR_PURCHASE_LIMIT_EXCEEDED (8 + 3 = 11 > 10)"
            - "Second request succeeds 201 (8 + 2 = 10 == max; NOT > max)"
            - "O2 (paid_at=2024-12-30) is excluded from the aggregation: closed-open window is [2025-01-01T00:00:00.000Z, 2025-01-31T00:00:00.000Z) — paid_at strictly less than left edge does not count"

      - name: cold_chain_reading_adjacency_floored_window
        grounds:
          - calculations.cold_chain_excursion_score
          - entities.ColdChainShipment.fields.temperature_readings
        distinguishing_aspect: |
          Resource: ColdChainShipment timeline. Interval semantics: each
          reading occupies the half-open interval [recorded_at,
          next.recorded_at) with adjacency width
          window_minutes = max(1, ceil(seconds/60)) — a floor-of-1 buffer
          ensures even instantaneous readings carry weight, AND ceiling
          rounding makes sub-minute excursions count for a full minute.
          Different interval semantics (adjacency-with-min-1-minute-ceil)
          from the rolling-window aggregate-capacity instance above; sits on
          a different resource (ColdChainShipment vs Customer purchase
          history).
        test_recipe:
          setup:
            - "Build cold-chain shipment in DISPATCHED state"
          trigger:
            - "Append three readings: r0={2025-01-01T00:00:00.000Z, 200} (severity 5), r1={2025-01-01T00:00:00.001Z, 200} (severity 5), r2={2025-01-01T00:01:00.000Z, 27}"
          assert:
            - "r0 window: r1 - r0 = 0.001s → ceil(0.001/60) = 1, but max(1, 1) = 1; per_reading r0 = 5*1 = 5"
            - "r1 window: r2 - r1 ≈ 60s → ceil(60/60) = 1; per_reading r1 = 5*1 = 5"
            - "r2 last: window_minutes = 1; per_reading r2 = 0*1 = 0"
            - "excursion_score == 10  # = 5 + 5 + 0; the min-1-minute floor and ceil-rounding make a sub-millisecond gap still register as 1 minute (interval-buffer semantics)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: paid_minus_refunded_invariant_on_cancel_cascade
        grounds:
          - state_machines.Order.payment_PAID_to_payment_REFUNDED
          - state_machines.Order.dispensing_PENDING_REVIEW_to_dispensing_CANCELLED
          - entities.Order.fields.total_amount_cents
          - entities.Order.fields.payment_status
        distinguishing_aspect: |
          Conserved quantity (currency): customer's net unrefunded paid
          amount per platform =
              SUM(Order.total_amount_cents WHERE payment_status=='PAID' AND
                  customer_id==C)
            - SUM(Order.total_amount_cents WHERE payment_status=='REFUNDED' AND
                  customer_id==C).
          A pay-then-cancel pair is its own compensating action and MUST
          leave this quantity unchanged.
        test_recipe:
          setup:
            - "Create platform; OTC drug on shelf; Customer C real_name_verified=true; place Order O with items qty=2 unit_price_cents=12999 → total_amount_cents=25998"
            - "Compute pre-action net = 0 (no prior PAID orders for C)"
          trigger:
            - "POST /orders/{O}/pay  # payment_status: UNPAID→PAID"
            - "POST /orders/{O}/cancel  # dispensing → CANCELLED, cascades payment → REFUNDED"
          assert:
            - "Order.total_amount_cents == 25998"
            - "After /pay: PAID-sum = 25998, REFUNDED-sum = 0, net = 25998"
            - "After /cancel: PAID-sum = 25998 (unchanged — Order is now REFUNDED but its row's payment_status moved out of PAID; therefore PAID-sum becomes 0 and REFUNDED-sum becomes 25998), net = 0 - 25998 + 25998 = 0 unchanged from pre-action"
            - "Restated: customer's net unrefunded paid amount is 0 both before /pay and after /cancel — invariant pinned"
            - "Exactly one ExternalEvent row with channel=PAYMENT event_type='order.refunded' is produced (idempotency_key prevents drift)"

      - name: purchase_limit_units_invariant_on_revoke_cancel
        grounds:
          - calculations.purchase_limit_aggregation
          - state_machines.Prescription.APPROVED_to_REVOKED
          - state_machines.Order.dispensing_PENDING_REVIEW_to_dispensing_CANCELLED
          - entities.Order.fields.payment_status
        distinguishing_aspect: |
          Conserved quantity (collection / units, NOT currency): customer's
          active-paid units in window =
              SUM(line.qty for Order O where O.customer_id==C AND
                  O.payment_status=='PAID' AND
                  O.paid_at in [now-window_days, now) for line in O.items
                  where line.drug.control_category==CC).
          A "place-and-cancel-before-pay" sequence on a prescription order
          is its own compensating pair and MUST leave this quantity
          unchanged. Different conserved quantity type (purchase units, not
          monetary cents).
        test_recipe:
          setup:
            - "Create platform clock=2025-01-15T00:00:00.000Z; PurchaseLimitRule(control_category=PSYCHOTROPIC_II, window_days=30, max=10)"
            - "PR+RR pharmacists; Customer C real_name_verified=true; Drug D PRESCRIPTION control_category=PSYCHOTROPIC_II per_order_qty_cap=10"
            - "Upload Prescription, approve as PR; place Order O items=[{D, qty:5}] (UNPAID, PENDING_REVIEW)"
            - "Pre-action: PAID-units in window = 0 (O is UNPAID, excluded by aggregator)"
          trigger:
            - "POST /orders/{O}/cancel  # dispensing → CANCELLED, payment never went to PAID, so no refund cascade"
          assert:
            - "Order.dispensing_status == 'CANCELLED' AND Order.payment_status == 'UNPAID'"
            - "Aggregated PAID-units in window for (C, PSYCHOTROPIC_II) == 0 (cancelled order never entered PAID, so it never contributed; invariant unchanged)"
            - "A subsequent POST /orders body={items:[{D, qty:10}]} succeeds (still 0 + 10 == 10, not > 10)"
            - "If aggregator incorrectly counted UNPAID/CANCELLED orders, the qty=10 retry would fail — this assertion catches the drift"
