        claim_type: side_effect_execution
        grounds: [state_machines.BoardBuild.ASSEMBLED_to_DRAFT]
        excluded_because:
          difficulty_instance: "non_linear_state_machine / board_build_revision_cycle"
          rationale: "Revision cycle and reservation release asserted by the named §1.8 instance."

