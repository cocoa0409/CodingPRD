scenario: "Bail Bond & Pretrial Release: bond posting (cash/surety/PR), premium & collateral, court-date tracking/notification, condition-compliance check-in, forfeiture/recovery, exoneration/refund, indemnitor management, GPS monitoring"
domain_name: "bail-bond-pretrial-release"
api_prefix: ""
# Flat/graph topology: defendants, bail-orders, bonds, indemnitors, collateral,
# court-dates, gps-devices and forfeitures are all top-level peer collections
# linked by foreign keys, so there is no single nesting prefix.

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Ledger reconciliation"
  complexity_layers:
    - "Cascading side effects"
    - "Dual-variant calculation"
    - "Rate / threshold triggers"
    - "Optimistic concurrency"
    - "Derived field reconciliation"

  entity_topology: graph
  # Bonds, indemnitors and collateral items are peer entities tied by FK references and a
  # many-to-many IndemnityAgreement junction; ForfeitureProceeding crosses aggregate boundaries.

  state_machine_shape: cyclic
  # ForfeitureProceeding loops FORFEITED -> RECOVERY_OPEN -> REINSTATED -> (re-FTA) -> FORFEITED;
  # Bond carries parallel coverage_status x settlement_status dimensions.

  relationship_patterns:
    - one_to_many          # Defendant -> BailOrder -> Bond; Bond -> CollateralItem; Bond -> CourtDate
    - many_to_many         # Indemnitor <-> Bond via IndemnityAgreement
    - cross_aggregate      # ForfeitureProceeding references Bond + CourtDate across aggregates

  role_model: segregation_of_duties
  # The BondsAgent who posts a bond may not be the ComplianceOfficer who approves its exoneration;
  # the Court records appearances; RecoveryAgent runs recovery. Indemnitor is an entity-backed actor.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Defendant
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Legal name of the defendant."
      - name: date_of_birth
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD)."
      - name: phone_e164
        type: string
        source: input
        description: "Contact phone in E.164 format; used as the notification destination."
      - name: risk_tier
        type: enum
        source: input
        description: "Pretrial risk assessment tier."
        default: "MEDIUM"
        constraints: "one of LOW, MEDIUM, HIGH"
      - name: total_active_exposure_cents
        type: integer
        source: computed
        description: "Sum of bail_amount_cents over this defendant's Bonds whose coverage_status IN {ACTIVE, FORFEITED}. Recomputed on every Bond coverage_status change. See calculations.defendant_active_exposure."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "ACTIVE while any Bond has coverage_status IN {ACTIVE, FORFEITED}; CLEARED once every Bond is EXONERATED or REVOKED. Recomputed on bubble-up from Bond."
        default: "ACTIVE"
        constraints: "one of ACTIVE, CLEARED"

  - name: BailOrder
    parent: null
    common_fields: true
    fields:
      - name: defendant_id
        type: string
        source: input
        description: "FK -> Defendant.id; the defendant this bail order is set for."
      - name: case_number
        type: string
        source: input
        description: "Court case identifier; unique per defendant."
        constraints: "unique within (defendant_id)"
      - name: bail_amount_cents
        type: integer
        source: input
        description: "Court-set bail amount in cents; must be > 0."
        constraints: "> 0"
      - name: bond_type_allowed
        type: enum
        source: input
        description: "Which bond posting type the court permits for this order."
        constraints: "one of CASH, SURETY, PR, ANY"
      - name: condition_codes
        type: array
        source: input
        description: "Release condition codes the defendant must satisfy (e.g. GPS, CURFEW, DRUG_TEST, NO_CONTACT)."
        default: []
      - name: gps_required
        type: boolean
        source: input
        description: "True when the court mandates GPS monitoring as a release condition."
        default: false
      - name: status
        type: enum
        source: computed
        description: "OPEN until a Bond is posted, then BONDED; RESOLVED once the bond reaches a terminal coverage_status. Bubble-up from Bond."
        default: "OPEN"
        constraints: "one of OPEN, BONDED, RESOLVED"

  - name: Bond
    parent: null
    common_fields: true
    fields:
      - name: bail_order_id
        type: string
        source: input
        description: "FK -> BailOrder.id; the order this bond satisfies."
      - name: defendant_id
        type: string
        source: input
        description: "FK -> Defendant.id; denormalized from the bail order for exposure roll-up."
      - name: bond_type
        type: enum
        source: input
        description: "Posting mechanism."
        constraints: "one of CASH, SURETY, PR"
      - name: bail_amount_cents
        type: integer
        source: computed
        description: "Copied from BailOrder.bail_amount_cents at posting time; the face value at risk."
      - name: premium_rate_bps
        type: integer
        source: input
        description: "Negotiated surety premium rate in basis points (100 bps = 1%); required for SURETY, ignored for CASH/PR."
        default: 1000
        constraints: ">= 0 and <= 1500"
      - name: premium_cents
        type: integer
        source: computed
        description: "Surety premium charged to the indemnitors at posting. See calculations.surety_premium. 0 for CASH/PR."
        default: 0
      - name: premium_earned_cents
        type: integer
        source: computed
        description: "Portion of premium recognized as earned; set to premium_cents on EXONERATION, stays 0 if the bond is REVOKED before posting completes. See calculations.earned_premium."
        default: 0
      - name: required_collateral_cents
        type: integer
        source: computed
        description: "Collateral the agent must hold before activation. See calculations.required_collateral. 0 for PR."
        default: 0
      - name: collateral_held_cents
        type: integer
        source: computed
        description: "Sum of pledged_value_cents over linked CollateralItems whose status == HELD. Derived field, recomputed on CollateralItem status change. See calculations.collateral_held."
        default: 0
      - name: coverage_status
        type: enum
        source: computed
        description: "Lifecycle dimension of the bond's coverage of the defendant."
        default: "DRAFT"
        constraints: "one of DRAFT, ACTIVE, FORFEITED, EXONERATED, REVOKED"
      - name: settlement_status
        type: enum
        source: computed
        description: "Independent financial-settlement dimension that evolves on its own axis alongside coverage_status."
        default: "UNSETTLED"
        constraints: "one of UNSETTLED, PREMIUM_COLLECTED, COLLATERAL_REFUNDED, JUDGMENT_ENTERED"
      - name: posted_at
        type: string
        source: system
        description: "ISO 8601 UTC timestamp set when the bond transitions DRAFT -> ACTIVE."
        default: null

  - name: Indemnitor
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Legal name of the cosigner/guarantor."
      - name: phone_e164
        type: string
        source: input
        description: "Contact phone in E.164 format."
      - name: credit_limit_cents
        type: integer
        source: input
        description: "Maximum aggregate liability this indemnitor may guarantee across all bonds; must be > 0."
        constraints: "> 0"
      - name: total_exposure_cents
        type: integer
        source: computed
        description: "Sum of liability_share_cents over this indemnitor's IndemnityAgreements whose status == BINDING. Derived field, recomputed on IndemnityAgreement status change. See calculations.indemnitor_exposure."
        default: 0

  - name: IndemnityAgreement
    parent: null
    common_fields: true
    fields:
      - name: bond_id
        type: string
        source: input
        description: "FK -> Bond.id; the bond this agreement guarantees."
      - name: indemnitor_id
        type: string
        source: input
        description: "FK -> Indemnitor.id; the guaranteeing party."
      - name: liability_share_cents
        type: integer
        source: input
        description: "Portion of the bond face value this indemnitor is liable for; must be > 0."
        constraints: "> 0"
      - name: status
        type: enum
        source: computed
        description: "PENDING at creation; BINDING once the bond activates; DISCHARGED on exoneration; CALLED when a judgment is entered against it."
        default: "PENDING"
        constraints: "one of PENDING, BINDING, DISCHARGED, CALLED"

  - name: CollateralItem
    parent: null
    common_fields: true
    fields:
      - name: bond_id
        type: string
        source: input
        description: "FK -> Bond.id; the bond this collateral secures."
      - name: kind
        type: enum
        source: input
        description: "Form of collateral."
        constraints: "one of CASH, PROPERTY_LIEN, VEHICLE_TITLE"
      - name: pledged_value_cents
        type: integer
        source: input
        description: "Appraised pledge value in cents; must be > 0."
        constraints: "> 0"
      - name: status
        type: enum
        source: computed
        description: "HELD while securing an active bond; RELEASED on refund; LIQUIDATED when applied to a judgment."
        default: "HELD"
        constraints: "one of HELD, RELEASED, LIQUIDATED"

  - name: CourtDate
    parent: null
    common_fields: true
    fields:
      - name: bond_id
        type: string
        source: input
        description: "FK -> Bond.id; the bond whose defendant must appear."
      - name: scheduled_utc
        type: string
        source: input
        description: "ISO 8601 UTC timestamp of the scheduled appearance; must be in the future at creation relative to the system clock. Start of the hearing's occupied interval [scheduled_utc, scheduled_utc + duration_minutes]."
      - name: duration_minutes
        type: integer
        source: input
        description: "Length of the hearing in minutes; defines the closed occupied interval on the bond's docket. Must be > 0."
        default: 60
        constraints: "> 0"
      - name: hearing_type
        type: enum
        source: input
        description: "Type of hearing."
        default: "ARRAIGNMENT"
        constraints: "one of ARRAIGNMENT, PRETRIAL, TRIAL, SENTENCING"
      - name: status
        type: enum
        source: computed
        description: "Appearance outcome dimension."
        default: "SCHEDULED"
        constraints: "one of SCHEDULED, NOTIFIED, APPEARED, FAILED_TO_APPEAR, CONTINUED"
      - name: notified_at
        type: string
        source: system
        description: "ISO 8601 UTC timestamp set when a Notification is dispatched for this court date."
        default: null

  - name: Notification
    parent: null
    common_fields: false
    fields:
      - name: court_date_id
        type: string
        source: input
        description: "FK -> CourtDate.id; the appearance this notice concerns."
      - name: channel
        type: enum
        source: input
        description: "Delivery channel."
        default: "SMS"
        constraints: "one of SMS, VOICE, EMAIL"
      - name: lead_hours
        type: integer
        source: computed
        description: "Whole hours between dispatch (system clock) and CourtDate.scheduled_utc, floored. See calculations.notification_lead."
      - name: destination
        type: string
        source: system
        description: "Copied from the defendant's phone_e164 at dispatch."

  - name: CheckIn
    parent: null
    common_fields: false
    fields:
      - name: bond_id
        type: string
        source: input
        description: "FK -> Bond.id; the bond whose conditions are being verified."
      - name: condition_code
        type: enum
        source: input
        description: "Which release condition this check-in verifies."
        constraints: "one of GPS, CURFEW, DRUG_TEST, NO_CONTACT"
      - name: result
        type: enum
        source: input
        description: "Outcome reported by the supervising officer."
        constraints: "one of PASS, FAIL, MISSED"
      - name: occurred_utc
        type: string
        source: system
        description: "ISO 8601 UTC timestamp of the check-in, stamped from the system clock at creation."
      - name: weight
        type: integer
        source: computed
        description: "Non-compliance points this check-in contributes. See calculations.compliance_score."

  - name: GpsDevice
    parent: null
    common_fields: true
    fields:
      - name: serial_number
        type: string
        source: input
        description: "Hardware serial; globally unique."
        constraints: "unique"
      - name: assigned_bond_id
        type: string
        source: input
        description: "FK -> Bond.id; the bond this device monitors (null while UNASSIGNED)."
        default: null
      - name: violation_count
        type: integer
        source: computed
        description: "Cumulative count of FAIL/MISSED GPS check-ins recorded against the assigned bond since activation."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Device lifecycle dimension."
        default: "UNASSIGNED"
        constraints: "one of UNASSIGNED, ASSIGNED, ACTIVE, TAMPER, RETURNED"

  - name: ForfeitureProceeding
    parent: null
    common_fields: true
    fields:
      - name: bond_id
        type: string
        source: input
        description: "FK -> Bond.id; the forfeited bond."
      - name: trigger_court_date_id
        type: string
        source: input
        description: "FK -> CourtDate.id; the FAILED_TO_APPEAR court date that opened this proceeding."
      - name: forfeited_utc
        type: string
        source: system
        description: "ISO 8601 UTC timestamp when forfeiture was declared (system clock at declaration)."
      - name: grace_deadline_utc
        type: string
        source: computed
        description: "forfeited_utc + GRACE_PERIOD_DAYS days. Reinstatement is only allowed on or before this instant. See calculations.grace_deadline."
      - name: judgment_amount_cents
        type: integer
        source: computed
        description: "Amount entered against the bond when the grace period lapses without recovery. See calculations.judgment_amount."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Proceeding lifecycle dimension (cyclic)."
        default: "FORFEITED"
        constraints: "one of FORFEITED, RECOVERY_OPEN, REINSTATED, JUDGMENT, REMITTED"

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: bond_id
        type: string
        source: input
        description: "FK -> Bond.id; the bond this financial event affects."
      - name: entry_type
        type: enum
        source: input
        description: "Kind of financial event."
        constraints: "one of PREMIUM_COLLECTED, COLLATERAL_REFUND, FORFEITURE_JUDGMENT, REMISSION_CREDIT"
      - name: amount_cents
        type: integer
        source: input
        description: "Signed amount in cents; positive = inflow to the agency, negative = outflow/refund."
      - name: memo
        type: string
        source: input
        description: "Free-text description of the event."
        default: ""

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Bond
    initial_state: DRAFT
    terminal_states: [EXONERATED, REVOKED]
    note: "coverage_status dimension. settlement_status (UNSETTLED -> PREMIUM_COLLECTED -> COLLATERAL_REFUNDED | JUDGMENT_ENTERED) evolves on its own independent axis and is driven by the transitions below; the two dimensions are independent axes on the same row (parallel-dimension shape)."
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /defendants/{id}/bonds/{bond_id}/activate"
        actor: BondsAgent
        preconditions:
          - "bond.coverage_status == DRAFT"
          - "bond.bond_type == PR OR collateral_held_cents >= required_collateral_cents"
          - "for SURETY: sum of liability_share_cents over the bond's BINDING-eligible IndemnityAgreements (status == PENDING) >= bail_amount_cents"
          - "BailOrder.bond_type_allowed == ANY OR equals bond.bond_type"
        side_effects:
          - "set posted_at = system clock"
          - "recompute premium_cents via calculations.surety_premium; recompute required_collateral_cents"
          - "set settlement_status = PREMIUM_COLLECTED"
          - "append LedgerEntry(entry_type=PREMIUM_COLLECTED, amount_cents = +premium_cents) for SURETY"
          - "transition every PENDING IndemnityAgreement on this bond to BINDING; recompute each Indemnitor.total_exposure_cents (calculations.indemnitor_exposure)"
          - "set BailOrder.status = BONDED (bubble-up)"
          - "recompute Defendant.total_active_exposure_cents (calculations.defendant_active_exposure)"
      - from: ACTIVE
        to: FORFEITED
        trigger: "POST /defendants/{id}/court-dates/{court_date_id}/record-fta (system-cascaded)"
        actor: system
        preconditions:
          - "bond.coverage_status == ACTIVE"
          - "the triggering CourtDate.status transitions to FAILED_TO_APPEAR in the same request"
        side_effects:
          - "create ForfeitureProceeding(status=FORFEITED, forfeited_utc = system clock, grace_deadline_utc via calculations.grace_deadline)"
          - "recompute Defendant.total_active_exposure_cents (FORFEITED bonds remain in the exposure set)"
      - from: FORFEITED
        to: ACTIVE
        trigger: "POST /defendants/{id}/forfeitures/{proceeding_id}/reinstate"
        actor: ComplianceOfficer
        preconditions:
          - "bond.coverage_status == FORFEITED"
          - "the linked ForfeitureProceeding.status == RECOVERY_OPEN"
          - "system clock <= ForfeitureProceeding.grace_deadline_utc"
        side_effects:
          - "set ForfeitureProceeding.status = REINSTATED"
          - "recompute Defendant.total_active_exposure_cents"
      - from: ACTIVE
        to: EXONERATED
        trigger: "POST /defendants/{id}/bonds/{bond_id}/exonerate"
        actor: ComplianceOfficer
        preconditions:
          - "bond.coverage_status == ACTIVE"
          - "no CourtDate on this bond has status == SCHEDULED or NOTIFIED (all appearances resolved)"
          - "the acting ComplianceOfficer is NOT the BondsAgent who posted the bond (segregation of duties)"
        side_effects:
          - "set premium_earned_cents = premium_cents via calculations.earned_premium"
          - "set settlement_status = COLLATERAL_REFUNDED"
          - "cascade: transition every HELD CollateralItem on this bond to RELEASED (calculations.collateral_held recomputes collateral_held_cents to 0); for each release append LedgerEntry(entry_type=COLLATERAL_REFUND, amount_cents = -refund_amount via calculations.collateral_refund)"
          - "transition every BINDING IndemnityAgreement to DISCHARGED; recompute each Indemnitor.total_exposure_cents"
          - "transition any ACTIVE GpsDevice on this bond to RETURNED"
          - "set BailOrder.status = RESOLVED and bubble up Defendant.status (CLEARED if all bonds terminal)"
      - from: DRAFT
        to: REVOKED
        trigger: "POST /defendants/{id}/bonds/{bond_id}/revoke"
        actor: BondsAgent
        preconditions:
          - "bond.coverage_status == DRAFT"
        side_effects:
          - "transition every PENDING IndemnityAgreement to DISCHARGED"
          - "transition every HELD CollateralItem to RELEASED (no LedgerEntry; nothing was ever earned)"
          - "bubble up BailOrder.status and Defendant.status"

  - entity: CourtDate
    initial_state: SCHEDULED
    terminal_states: [APPEARED, CONTINUED]
    note: "FAILED_TO_APPEAR is terminal for the appearance but triggers the cross-aggregate forfeiture cascade onto Bond."
    transitions:
      - from: SCHEDULED
        to: NOTIFIED
        trigger: "POST /defendants/{id}/court-dates/{court_date_id}/notify"
        actor: Court
        preconditions:
          - "court_date.status == SCHEDULED"
          - "system clock < court_date.scheduled_utc"
        side_effects:
          - "create Notification(destination = defendant.phone_e164, lead_hours via calculations.notification_lead)"
          - "set court_date.notified_at = system clock"
      - from: NOTIFIED
        to: APPEARED
        trigger: "POST /defendants/{id}/court-dates/{court_date_id}/record-appearance"
        actor: Court
        preconditions:
          - "court_date.status IN {SCHEDULED, NOTIFIED}"
        side_effects:
          - "no financial side effects"
      - from: SCHEDULED
        to: APPEARED
        trigger: "POST /defendants/{id}/court-dates/{court_date_id}/record-appearance"
        actor: Court
        preconditions:
          - "court_date.status IN {SCHEDULED, NOTIFIED}"
        side_effects:
          - "no financial side effects"
      - from: NOTIFIED
        to: FAILED_TO_APPEAR
        trigger: "POST /defendants/{id}/court-dates/{court_date_id}/record-fta"
        actor: Court
        preconditions:
          - "court_date.status IN {SCHEDULED, NOTIFIED}"
          - "system clock >= court_date.scheduled_utc"
          - "the linked Bond.coverage_status == ACTIVE"
        side_effects:
          - "cascade: drive Bond ACTIVE -> FORFEITED (creates ForfeitureProceeding, see Bond.ACTIVE_to_FORFEITED)"
      - from: SCHEDULED
        to: FAILED_TO_APPEAR
        trigger: "POST /defendants/{id}/court-dates/{court_date_id}/record-fta"
        actor: Court
        preconditions:
          - "court_date.status IN {SCHEDULED, NOTIFIED}"
          - "system clock >= court_date.scheduled_utc"
          - "the linked Bond.coverage_status == ACTIVE"
        side_effects:
          - "cascade: drive Bond ACTIVE -> FORFEITED (creates ForfeitureProceeding, see Bond.ACTIVE_to_FORFEITED)"
      - from: SCHEDULED
        to: CONTINUED
        trigger: "POST /defendants/{id}/court-dates/{court_date_id}/continue"
        actor: Court
        preconditions:
          - "court_date.status IN {SCHEDULED, NOTIFIED}"
        side_effects:
          - "no financial side effects; a fresh CourtDate may be created for the new date"

  - entity: ForfeitureProceeding
    initial_state: FORFEITED
    terminal_states: [REINSTATED, REMITTED]
    note: "Cyclic shape: a REINSTATED bond can FTA again, opening a NEW ForfeitureProceeding (FORFEITED -> RECOVERY_OPEN -> REINSTATED is the loop body)."
    transitions:
      - from: FORFEITED
        to: RECOVERY_OPEN
        trigger: "POST /defendants/{id}/forfeitures/{proceeding_id}/open-recovery"
        actor: RecoveryAgent
        preconditions:
          - "proceeding.status == FORFEITED"
          - "system clock <= grace_deadline_utc"
        side_effects:
          - "no financial side effects; recovery effort begins"
      - from: RECOVERY_OPEN
        to: REINSTATED
        trigger: "POST /defendants/{id}/forfeitures/{proceeding_id}/reinstate"
        actor: ComplianceOfficer
        preconditions:
          - "proceeding.status == RECOVERY_OPEN"
          - "system clock <= grace_deadline_utc"
        side_effects:
          - "cascade: drive Bond FORFEITED -> ACTIVE (see Bond.FORFEITED_to_ACTIVE)"
      - from: RECOVERY_OPEN
        to: JUDGMENT
        trigger: "POST /defendants/{id}/forfeitures/{proceeding_id}/enter-judgment"
        actor: ComplianceOfficer
        preconditions:
          - "proceeding.status == RECOVERY_OPEN"
          - "system clock > grace_deadline_utc"
          - "expected_bond_version matches Bond.version (OCC)"
        side_effects:
          - "set judgment_amount_cents via calculations.judgment_amount"
          - "set Bond.coverage_status = (stays FORFEITED); set Bond.settlement_status = JUDGMENT_ENTERED"
          - "cascade: transition every HELD CollateralItem to LIQUIDATED; for each append LedgerEntry(entry_type=FORFEITURE_JUDGMENT, amount_cents = +liquidated_value)"
          - "cascade: transition every BINDING IndemnityAgreement to CALLED; recompute each Indemnitor.total_exposure_cents"
          - "append LedgerEntry(entry_type=FORFEITURE_JUDGMENT, amount_cents = +judgment_amount_cents, memo='net judgment')"
          - "increments Bond.version by 1"
      - from: FORFEITED
        to: JUDGMENT
        trigger: "POST /defendants/{id}/forfeitures/{proceeding_id}/enter-judgment"
        actor: ComplianceOfficer
        preconditions:
          - "proceeding.status == FORFEITED"
          - "system clock > grace_deadline_utc"
          - "expected_bond_version matches Bond.version (OCC)"
        side_effects:
          - "same cascade as RECOVERY_OPEN -> JUDGMENT; increments Bond.version by 1"
      - from: JUDGMENT
        to: REMITTED
        trigger: "POST /defendants/{id}/forfeitures/{proceeding_id}/remit"
        actor: ComplianceOfficer
        preconditions:
          - "proceeding.status == JUDGMENT"
          - "remission_pct supplied in (0, 100]"
        side_effects:
          - "append LedgerEntry(entry_type=REMISSION_CREDIT, amount_cents = -remitted_amount via calculations.remission_credit)"
          - "no change to CollateralItem or IndemnityAgreement states"

  - entity: GpsDevice
    initial_state: UNASSIGNED
    terminal_states: [RETURNED]
    note: "Independent device lifecycle; ACTIVE -> TAMPER -> ACTIVE is a recovery loop within the assignment."
    transitions:
      - from: UNASSIGNED
        to: ASSIGNED
        trigger: "POST /defendants/{id}/bonds/{bond_id}/gps/assign"
        actor: BondsAgent
        preconditions:
          - "device.status == UNASSIGNED"
          - "BailOrder.gps_required == true"
          - "no other GpsDevice with status IN {ASSIGNED, ACTIVE, TAMPER} references this bond"
        side_effects:
          - "set assigned_bond_id = bond.id"
      - from: ASSIGNED
        to: ACTIVE
        trigger: "POST /defendants/{id}/gps/{device_id}/activate"
        actor: BondsAgent
        preconditions:
          - "device.status == ASSIGNED"
          - "the assigned Bond.coverage_status == ACTIVE"
        side_effects:
          - "begin counting GPS violations"
      - from: ACTIVE
        to: TAMPER
        trigger: "POST /defendants/{id}/check-ins (system-cascaded when a GPS CheckIn result is FAIL)"
        actor: system
        preconditions:
          - "device.status == ACTIVE"
          - "incoming CheckIn.condition_code == GPS AND result == FAIL"
        side_effects:
          - "increment violation_count by 1"
      - from: TAMPER
        to: ACTIVE
        trigger: "POST /defendants/{id}/gps/{device_id}/clear-tamper"
        actor: RecoveryAgent
        preconditions:
          - "device.status == TAMPER"
        side_effects:
          - "no counter reset"
      - from: ACTIVE
        to: RETURNED
        trigger: "POST /defendants/{id}/gps/{device_id}/return (or cascade on Bond exoneration)"
        actor: BondsAgent
        preconditions:
          - "device.status IN {ASSIGNED, ACTIVE, TAMPER}"
        side_effects:
          - "clear assigned_bond_id"

  - entity: CollateralItem
    initial_state: HELD
    terminal_states: [RELEASED, LIQUIDATED]
    note: "Driven entirely by Bond-transition cascades; no direct endpoint mutates status (creation is the only direct write)."
    transitions:
      - from: HELD
        to: RELEASED
        trigger: "cascade from Bond ACTIVE->EXONERATED or DRAFT->REVOKED"
        actor: system
        preconditions:
          - "item.status == HELD"
          - "the parent Bond is transitioning to EXONERATED or REVOKED in the same request"
        side_effects:
          - "recompute Bond.collateral_held_cents (calculations.collateral_held)"
          - "on EXONERATION only: append LedgerEntry(entry_type=COLLATERAL_REFUND, amount_cents = -(pledged - PROCESSING_FEE_CENTS) via calculations.collateral_refund)"
      - from: HELD
        to: LIQUIDATED
        trigger: "cascade from ForfeitureProceeding ->JUDGMENT"
        actor: system
        preconditions:
          - "item.status == HELD"
          - "the parent Bond's ForfeitureProceeding is transitioning to JUDGMENT in the same request"
        side_effects:
          - "recompute Bond.collateral_held_cents to 0"
          - "append LedgerEntry(entry_type=FORFEITURE_JUDGMENT, amount_cents = +pledged_value_cents)"

  - entity: IndemnityAgreement
    initial_state: PENDING
    terminal_states: [DISCHARGED, CALLED]
    note: "Branching: PENDING forks to BINDING (on activation) or DISCHARGED (on revoke); BINDING forks to DISCHARGED (exoneration) or CALLED (judgment). Driven by Bond/ForfeitureProceeding cascades."
    transitions:
      - from: PENDING
        to: BINDING
        trigger: "cascade from Bond DRAFT->ACTIVE"
        actor: system
        preconditions:
          - "agreement.status == PENDING"
          - "the parent Bond is transitioning DRAFT->ACTIVE in the same request"
        side_effects:
          - "recompute Indemnitor.total_exposure_cents (calculations.indemnitor_exposure)"
      - from: PENDING
        to: DISCHARGED
        trigger: "cascade from Bond DRAFT->REVOKED"
        actor: system
        preconditions:
          - "agreement.status == PENDING"
          - "the parent Bond is transitioning DRAFT->REVOKED in the same request"
        side_effects:
          - "no exposure change (was never BINDING)"
      - from: BINDING
        to: DISCHARGED
        trigger: "cascade from Bond ACTIVE->EXONERATED"
        actor: system
        preconditions:
          - "agreement.status == BINDING"
          - "the parent Bond is transitioning ACTIVE->EXONERATED in the same request"
        side_effects:
          - "recompute Indemnitor.total_exposure_cents (drops by liability_share_cents)"
      - from: BINDING
        to: CALLED
        trigger: "cascade from ForfeitureProceeding ->JUDGMENT"
        actor: system
        preconditions:
          - "agreement.status == BINDING"
          - "the parent Bond's ForfeitureProceeding is transitioning to JUDGMENT in the same request"
        side_effects:
          - "recompute Indemnitor.total_exposure_cents (drops by liability_share_cents)"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: judgment-stale-bond
    parent_entity: Bond
    write_endpoint: "POST /defendants/{id}/forfeitures/{proceeding_id}/enter-judgment"
    occ_field: "expected_bond_version"
    description: |
      Entering a forfeiture judgment against a Bond whose version has advanced
      since the client last observed it is rejected. This captures the case
      where the grace period lapsed and a prior writer already entered judgment
      (liquidating collateral and calling the indemnity agreements, which
      legitimately supersedes any later judgment attempt against the same bond),
      so the current writer's view of the bond is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: surety_premium
    trigger: "Bond DRAFT -> ACTIVE (activation), SURETY bonds only"
    algorithm: tiered_pricing
    formula: |
      # premium_rate_bps is the negotiated marginal rate; the statutory FLOOR
      # is applied per tier of face value, then a non-refundable minimum.
      # Tiered by bail_amount_cents: tier boundaries are MARGINAL (each slice
      # priced at its own band rate, then summed), NOT a single flat rate.
      face = bond.bail_amount_cents
      band1 = min(face, TIER1_CAP_CENTS)                       # first 1,000,000c
      band2 = min(max(face - TIER1_CAP_CENTS, 0), TIER2_CAP_CENTS - TIER1_CAP_CENTS)
      band3 = max(face - TIER2_CAP_CENTS, 0)
      raw = (band1 * max(premium_rate_bps, TIER1_FLOOR_BPS)
           + band2 * max(premium_rate_bps, TIER2_FLOOR_BPS)
           + band3 * max(premium_rate_bps, TIER3_FLOOR_BPS)) / 10000
      premium_cents = max(round_half_up(raw), MIN_PREMIUM_CENTS)
    input_set: "Single bond at activation; bands derived from its own bail_amount_cents."
    constants:
      TIER1_CAP_CENTS: 1000000
      TIER2_CAP_CENTS: 5000000
      TIER1_FLOOR_BPS: 1000
      TIER2_FLOOR_BPS: 800
      TIER3_FLOOR_BPS: 600
      MIN_PREMIUM_CENTS: 10000
    precision: "integer cents, round_half_up at the final step only (sum the three bands as exact integers*bps before the single division+round)"

  - name: required_collateral
    trigger: "Bond DRAFT -> ACTIVE (activation), evaluated as a precondition input"
    algorithm: threshold
    formula: |
      # Risk-tier collateral coverage of face value, with a HIGH-risk surcharge.
      if bond.bond_type == "PR":
        required_collateral_cents = 0
      elif bond.bond_type == "CASH":
        required_collateral_cents = bond.bail_amount_cents          # full cash
      else:  # SURETY
        base_pct = COVERAGE_PCT[defendant.risk_tier]   # LOW 0.10, MEDIUM 0.25, HIGH 0.50
        required_collateral_cents = round_half_up(bond.bail_amount_cents * base_pct)
    input_set: "Single bond + its defendant's risk_tier."
    constants:
      COVERAGE_PCT: { LOW: 0.10, MEDIUM: 0.25, HIGH: 0.50 }
    precision: "integer cents, round_half_up"

  - name: collateral_held
    trigger: "any CollateralItem status change (HELD/RELEASED/LIQUIDATED) on the bond"
    algorithm: aggregation
    formula: |
      collateral_held_cents = sum(ci.pledged_value_cents
                                  for ci in bond.collateral_items
                                  if ci.status == "HELD")
    input_set: "CollateralItems linked to the bond with status == HELD only."
    precision: "integer cents"

  - name: collateral_refund
    trigger: "Bond ACTIVE -> EXONERATED (per HELD CollateralItem released)"
    algorithm: aggregation
    formula: |
      # Refund is GROSS of premium for CASH bonds (premium is 0) but NET of any
      # unearned administrative fee for SURETY: the agency retains a flat
      # processing fee per item, floored at 0.
      per_item_refund = max(ci.pledged_value_cents - PROCESSING_FEE_CENTS, 0)
      # the LedgerEntry amount is the NEGATIVE of per_item_refund (outflow).
    input_set: "Each HELD CollateralItem at the moment of exoneration."
    constants:
      PROCESSING_FEE_CENTS: 2500
    precision: "integer cents"

  - name: earned_premium
    trigger: "Bond ACTIVE -> EXONERATED"
    algorithm: forward_looking
    formula: |
      # FULLY-EARNED variant: on exoneration the entire premium is recognized
      # as earned, regardless of how long the bond was active.
      premium_earned_cents = bond.premium_cents
    input_set: "Single bond at exoneration."
    precision: "integer cents"
    variants:
      - name: fully_earned_on_exoneration
        when: "Bond reaches EXONERATED normally"
        difference: "Entire premium_cents recognized; this is the base."
      - name: zero_earned_on_revoke
        when: "Bond reaches REVOKED from DRAFT before activation"
        difference: "premium_earned_cents stays 0 because premium was never collected (settlement_status never reached PREMIUM_COLLECTED); no PREMIUM_COLLECTED ledger entry exists to recognize."

  - name: judgment_amount
    trigger: "ForfeitureProceeding -> JUDGMENT"
    algorithm: threshold
    formula: |
      # NET judgment: face value, reduced by collateral already liquidated and
      # by a recovery credit if a recovery was opened. Two valid interpretations
      # diverge — the scaffold PINS the SEQUENTIAL one:
      #   1. start from face = bond.bail_amount_cents
      #   2. subtract liquidated collateral (sum of pledged_value_cents of items
      #      transitioned to LIQUIDATED in THIS judgment)
      #   3. THEN if proceeding passed through RECOVERY_OPEN, subtract a flat
      #      RECOVERY_CREDIT_CENTS (good-faith recovery effort), floored at 0.
      net = bond.bail_amount_cents - liquidated_collateral_cents
      if proceeding_passed_recovery_open:
          net = max(net - RECOVERY_CREDIT_CENTS, 0)
      else:
          net = max(net, 0)
      judgment_amount_cents = net
    input_set: "Single bond + its HELD->LIQUIDATED collateral set + proceeding history."
    constants:
      RECOVERY_CREDIT_CENTS: 50000
    precision: "integer cents"
    variants:
      - name: with_recovery_credit
        when: "Proceeding went FORFEITED -> RECOVERY_OPEN -> JUDGMENT"
        difference: "RECOVERY_CREDIT_CENTS subtracted after collateral."
      - name: without_recovery_credit
        when: "Proceeding went FORFEITED -> JUDGMENT directly (no recovery opened)"
        difference: "No recovery credit; judgment is face minus liquidated collateral only."

  - name: remission_credit
    trigger: "ForfeitureProceeding JUDGMENT -> REMITTED"
    algorithm: threshold
    formula: |
      # remission_pct supplied by the court (0, 100]; credited against the
      # entered judgment. Rounded once at the end.
      remitted_amount_cents = round_half_up(proceeding.judgment_amount_cents
                                            * remission_pct / 100)
    input_set: "Single proceeding in JUDGMENT with a recorded judgment_amount_cents."
    precision: "integer cents, round_half_up"

  - name: compliance_score
    trigger: "any CheckIn creation"
    algorithm: weighted_scoring
    formula: |
      # Each CheckIn contributes a weight; the GPS device's violation_count and
      # the bond's compliance posture derive from the running sum. Weighting is
      # combinatorial: weight depends jointly on result AND condition_code.
      if result == "PASS":   weight = 0
      elif result == "MISSED": weight = MISSED_WEIGHT                        # 1
      elif result == "FAIL":
          weight = FAIL_BASE_WEIGHT + (GPS_FAIL_BONUS if condition_code == "GPS" else 0)
      # GPS FAIL also drives the GpsDevice ACTIVE -> TAMPER transition.
    input_set: "Single CheckIn at creation; weight a pure function of (result, condition_code)."
    constants:
      MISSED_WEIGHT: 1
      FAIL_BASE_WEIGHT: 2
      GPS_FAIL_BONUS: 3
    precision: "integer points"

  - name: defendant_active_exposure
    trigger: "any Bond coverage_status change"
    algorithm: aggregation
    formula: |
      total_active_exposure_cents = sum(b.bail_amount_cents
                                        for b in defendant.bonds
                                        if b.coverage_status IN {"ACTIVE", "FORFEITED"})
    input_set: "Bonds of the defendant with coverage_status IN {ACTIVE, FORFEITED}."
    precision: "integer cents"

  - name: indemnitor_exposure
    trigger: "any IndemnityAgreement status change"
    algorithm: aggregation
    formula: |
      total_exposure_cents = sum(ia.liability_share_cents
                                for ia in indemnitor.agreements
                                if ia.status == "BINDING")
    input_set: "IndemnityAgreements of the indemnitor with status == BINDING only."
    precision: "integer cents"

  - name: notification_lead
    trigger: "CourtDate SCHEDULED -> NOTIFIED (Notification creation)"
    algorithm: threshold
    formula: |
      delta_seconds = epoch(court_date.scheduled_utc) - epoch(system_clock_now)
      lead_hours = floor(delta_seconds / 3600)
    input_set: "Single court date vs the system clock at notify time."
    precision: "whole hours, floor"

  - name: grace_deadline
    trigger: "ForfeitureProceeding creation (Bond ACTIVE -> FORFEITED)"
    algorithm: threshold
    formula: |
      grace_deadline_utc = forfeited_utc + GRACE_PERIOD_DAYS days
      # Reinstatement / recovery allowed while system_clock <= grace_deadline_utc (INCLUSIVE);
      # judgment allowed only while system_clock > grace_deadline_utc (STRICT).
    input_set: "Single proceeding at creation."
    constants:
      GRACE_PERIOD_DAYS: 30
    precision: "ISO 8601 UTC instant"

  - name: docket_overlap_check
    trigger: "POST /defendants/{id}/bonds/{bond_id}/court-dates (validation input on CourtDate creation)"
    algorithm: interval_merge
    formula: |
      # CLOSED-interval semantics WITH a mandatory inter-hearing buffer.
      # The new hearing occupies [new_start, new_end] where
      #   new_start = scheduled_utc
      #   new_end   = scheduled_utc + duration_minutes minutes.
      # An EXISTING hearing E (status IN {SCHEDULED, NOTIFIED}) on the same bond
      # occupies [E.scheduled_utc, E.scheduled_utc + E.duration_minutes].
      # Each existing interval is INFLATED by DOCKET_BUFFER_MINUTES on BOTH ends
      # before the test, so two hearings must be separated by a strict gap > buffer.
      # Collision iff:
      #   new_start <= (E.end + BUFFER) AND (E.start - BUFFER) <= new_end
      # (touching endpoints collide — closed intervals; adjacency at the buffer
      #  boundary is a COLLISION, distinct from the device rule below).
      collides = exists E in same-bond hearings (SCHEDULED|NOTIFIED) where
                 new_start <= add_minutes(E.scheduled_utc, E.duration_minutes + DOCKET_BUFFER_MINUTES)
                 and add_minutes(E.scheduled_utc, -DOCKET_BUFFER_MINUTES) <= new_end
    input_set: "Existing CourtDates on the same bond with status IN {SCHEDULED, NOTIFIED}."
    constants:
      DOCKET_BUFFER_MINUTES: 30
    precision: "minute-resolution closed intervals; buffer inflation on the existing interval"

  - name: device_occupancy_check
    trigger: "POST /defendants/{id}/bonds/{bond_id}/gps/assign (validation input on assignment)"
    algorithm: interval_merge
    formula: |
      # AGGREGATE-CAPACITY semantics (capacity == 1), NOT geometric adjacency:
      # a bond's monitoring slot admits at most ONE non-returned device at a time.
      # There is NO buffer and NO timestamp arithmetic — occupancy is a pure
      # point-in-time count of devices whose status IN {ASSIGNED, ACTIVE, TAMPER}
      # currently referencing this bond.
      occupied = count(d for d in gps_devices
                       if d.assigned_bond_id == bond.id
                       and d.status IN {ASSIGNED, ACTIVE, TAMPER})
      collides = occupied >= DEVICE_CAPACITY
    input_set: "GpsDevices currently assigned to the bond with non-terminal status."
    constants:
      DEVICE_CAPACITY: 1
    precision: "integer occupancy count; capacity 1"

# =============================================================================
# 1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except Anonymous-permitted endpoints"
  - priority: 2
    category: auth
    check: "Acting role is permitted to call this endpoint per the RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every path-referenced resource exists, validated left-to-right (defendant, then bond/court-date/forfeiture/device)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all /{...}/ endpoints"
  - priority: 4
    category: existence
    check: "Every FK in the request body references an existing resource"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "POST endpoints with FK body fields"
  - priority: 5
    category: business_constraint
    check: "Required body fields present and types valid; enum values in their declared sets"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PATCH"
  - priority: 6
    category: business_constraint
    check: "case_number unique within (defendant_id) on BailOrder creation"
    error_id: ERR_DUPLICATE_CASE_NUMBER
    http_status: 409
    applies_to: "POST /defendants/{id}/bail-orders"
  - priority: 7
    category: business_constraint
    check: "GpsDevice.serial_number globally unique on creation"
    error_id: ERR_DUPLICATE_SERIAL
    http_status: 409
    applies_to: "POST /gps-devices"
  - priority: 8
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 9
    category: state
    check: "OCC: expected_bond_version equals the Bond's current version on enter-judgment"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /defendants/{id}/forfeitures/{proceeding_id}/enter-judgment"
  - priority: 10
    category: business_referential
    check: "Bond.bond_type is permitted by BailOrder.bond_type_allowed (ANY, or exact match)"
    error_id: ERR_BOND_TYPE_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /defendants/{id}/bail-orders/{order_id}/bonds"
  - priority: 11
    category: business_referential
    check: "GPS assignment requires BailOrder.gps_required == true"
    error_id: ERR_GPS_NOT_REQUIRED
    http_status: 409
    applies_to: "POST /defendants/{id}/bonds/{bond_id}/gps/assign"
  - priority: 12
    category: business_temporal
    check: "Docket overlap: a new CourtDate's closed interval must not collide with a buffer-inflated SCHEDULED/NOTIFIED hearing on the same bond (touching/adjacent at the buffer boundary collides). See calculations.docket_overlap_check."
    error_id: ERR_DOCKET_OVERLAP
    http_status: 409
    applies_to: "POST /defendants/{id}/bonds/{bond_id}/court-dates"
  - priority: 13
    category: business_constraint
    check: "Device occupancy: a bond admits at most one non-returned GpsDevice (aggregate capacity 1, no buffer). See calculations.device_occupancy_check."
    error_id: ERR_DEVICE_SLOT_OCCUPIED
    http_status: 409
    applies_to: "POST /defendants/{id}/bonds/{bond_id}/gps/assign"
  - priority: 14
    category: business_referential
    check: "Segregation of duties: the ComplianceOfficer exonerating a bond must not be the BondsAgent (X-User-ID) who activated it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /defendants/{id}/bonds/{bond_id}/exonerate"
  - priority: 15
    category: business_temporal
    check: "Reinstatement / open-recovery only while system clock <= grace_deadline_utc (INCLUSIVE boundary)"
    error_id: ERR_GRACE_EXPIRED
    http_status: 409
    applies_to: "POST /defendants/{id}/forfeitures/{proceeding_id}/reinstate, .../open-recovery"
  - priority: 16
    category: business_temporal
    check: "Judgment only while system clock > grace_deadline_utc (STRICT boundary); within grace, judgment is premature"
    error_id: ERR_GRACE_NOT_EXPIRED
    http_status: 409
    applies_to: "POST /defendants/{id}/forfeitures/{proceeding_id}/enter-judgment"
  - priority: 17
    category: business_temporal
    check: "A court date FTA may only be recorded at/after scheduled_utc; notification only before scheduled_utc"
    error_id: ERR_TIMING_VIOLATION
    http_status: 409
    applies_to: "POST .../court-dates/{court_date_id}/record-fta, .../notify"
  - priority: 18
    category: business_fiscal
    check: "On SURETY activation, total PENDING liability_share_cents on the bond must be >= bail_amount_cents (full coverage)"
    error_id: ERR_INSUFFICIENT_INDEMNITY
    http_status: 409
    applies_to: "POST /defendants/{id}/bonds/{bond_id}/activate"
  - priority: 19
    category: business_fiscal
    check: "On SURETY/CASH activation, collateral_held_cents must be >= required_collateral_cents"
    error_id: ERR_INSUFFICIENT_COLLATERAL
    http_status: 409
    applies_to: "POST /defendants/{id}/bonds/{bond_id}/activate"
  - priority: 20
    category: business_fiscal
    check: "Creating/binding an IndemnityAgreement must not push the indemnitor's total BINDING+PENDING exposure above credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /defendants/{id}/bonds/{bond_id}/indemnity-agreements"
  - priority: 21
    category: business_constraint
    check: "remission_pct must be in (0, 100]"
    error_id: ERR_INVALID_REMISSION
    http_status: 400
    applies_to: "POST /defendants/{id}/forfeitures/{proceeding_id}/remit"
  - priority: 22
    category: business_constraint
    check: "Pagination params semantically valid: limit in [1, 100], offset >= 0"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all list (GET collection) endpoints"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Defendants ----
  - method: POST
    path: "/defendants"
    description: "Register a defendant."
    roles: [BondsAgent, Court]
    code: 201
    input: [full_name, date_of_birth, phone_e164, "risk_tier?"]
    output: Defendant
    side_effects: []
  - method: GET
    path: "/defendants/{id}"
    description: "Fetch a defendant with computed exposure and status."
    roles: [BondsAgent, Court, ComplianceOfficer, RecoveryAgent]
    code: 200
    input: []
    output: Defendant
    side_effects: []
  - method: GET
    path: "/defendants"
    description: "List defendants (paginated)."
    roles: [BondsAgent, Court, ComplianceOfficer, RecoveryAgent]
    code: 200
    input: ["limit?", "offset?", "risk_tier?"]
    output: Defendant[]
    side_effects: []

  # ---- Bail Orders ----
  - method: POST
    path: "/defendants/{id}/bail-orders"
    description: "Record a court-set bail order for a defendant."
    roles: [Court]
    code: 201
    input: [case_number, bail_amount_cents, bond_type_allowed, "condition_codes?", "gps_required?"]
    output: BailOrder
    side_effects: ["validate case_number unique within defendant"]
  - method: GET
    path: "/defendants/{id}/bail-orders"
    description: "List a defendant's bail orders (reverse-reachability for BailOrder.defendant_id)."
    roles: [BondsAgent, Court, ComplianceOfficer, RecoveryAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: BailOrder[]
    side_effects: []
  - method: GET
    path: "/bail-orders/{id}"
    description: "Fetch a bail order."
    roles: [BondsAgent, Court, ComplianceOfficer, RecoveryAgent]
    code: 200
    input: []
    output: BailOrder
    side_effects: []

  # ---- Bonds ----
  - method: POST
    path: "/defendants/{id}/bail-orders/{order_id}/bonds"
    description: "Post a bond against a bail order (DRAFT)."
    roles: [BondsAgent]
    code: 201
    input: [bond_type, "premium_rate_bps?"]
    output: Bond
    side_effects: ["copy bail_amount_cents and defendant_id from the order", "compute required_collateral_cents", "ERR_BOND_TYPE_NOT_ALLOWED if type not permitted"]
  - method: GET
    path: "/bonds/{id}"
    description: "Fetch a bond with all computed financial fields and both status dimensions."
    roles: [BondsAgent, Court, ComplianceOfficer, RecoveryAgent]
    code: 200
    input: []
    output: Bond
    side_effects: []
  - method: GET
    path: "/bail-orders/{id}/bonds"
    description: "List bonds under a bail order (reverse-reachability for Bond.bail_order_id)."
    roles: [BondsAgent, Court, ComplianceOfficer, RecoveryAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: Bond[]
    side_effects: []
  - method: GET
    path: "/bonds"
    description: "List/filter bonds; reverse-reachability for Bond.defendant_id."
    roles: [BondsAgent, Court, ComplianceOfficer, RecoveryAgent]
    code: 200
    input: ["limit?", "offset?", "defendant_id?", "coverage_status?"]
    output: Bond[]
    side_effects: []
  - method: POST
    path: "/defendants/{id}/bonds/{bond_id}/activate"
    description: "Activate a DRAFT bond (collect premium, bind indemnity, begin coverage)."
    roles: [BondsAgent]
    code: 200
    input: []
    output: Bond
    side_effects: ["surety_premium", "settlement_status=PREMIUM_COLLECTED", "bind PENDING IndemnityAgreements", "ledger PREMIUM_COLLECTED", "bubble BailOrder/Defendant"]
  - method: POST
    path: "/defendants/{id}/bonds/{bond_id}/exonerate"
    description: "Exonerate an ACTIVE bond; release collateral, discharge indemnity, recognize earned premium."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Bond
    side_effects: ["earned_premium", "settlement_status=COLLATERAL_REFUNDED", "release CollateralItems + ledger COLLATERAL_REFUND", "discharge IndemnityAgreements", "return GpsDevices", "bubble BailOrder/Defendant", "ERR_SEGREGATION_OF_DUTIES if actor == activating agent"]
  - method: POST
    path: "/defendants/{id}/bonds/{bond_id}/revoke"
    description: "Revoke a DRAFT bond before activation."
    roles: [BondsAgent]
    code: 200
    input: []
    output: Bond
    side_effects: ["discharge PENDING IndemnityAgreements", "release HELD CollateralItems (no ledger)", "bubble BailOrder/Defendant"]

  # ---- Indemnitors & Agreements ----
  - method: POST
    path: "/indemnitors"
    description: "Register an indemnitor (cosigner)."
    roles: [BondsAgent]
    code: 201
    input: [full_name, phone_e164, credit_limit_cents]
    output: Indemnitor
    side_effects: []
  - method: GET
    path: "/indemnitors/{id}"
    description: "Fetch an indemnitor with computed total_exposure_cents."
    roles: [BondsAgent, ComplianceOfficer]
    code: 200
    input: []
    output: Indemnitor
    side_effects: []
  - method: POST
    path: "/defendants/{id}/bonds/{bond_id}/indemnity-agreements"
    description: "Attach an indemnitor to a DRAFT bond with a liability share (PENDING)."
    roles: [BondsAgent]
    code: 201
    input: [indemnitor_id, liability_share_cents]
    output: IndemnityAgreement
    side_effects: ["ERR_CREDIT_LIMIT_EXCEEDED if share pushes indemnitor over credit_limit_cents"]
  - method: GET
    path: "/bonds/{id}/indemnity-agreements"
    description: "List agreements on a bond (reverse-reachability for IndemnityAgreement.bond_id)."
    roles: [BondsAgent, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: IndemnityAgreement[]
    side_effects: []
  - method: GET
    path: "/indemnity-agreements/{id}"
    description: "Fetch a single indemnity agreement."
    roles: [BondsAgent, ComplianceOfficer]
    code: 200
    input: []
    output: IndemnityAgreement
    side_effects: []
  - method: GET
    path: "/indemnity-agreements"
    description: "Filtered list; reverse-reachability for IndemnityAgreement.indemnitor_id."
    roles: [BondsAgent, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "indemnitor_id?", "bond_id?"]
    output: IndemnityAgreement[]
    side_effects: []

  # ---- Collateral ----
  - method: POST
    path: "/defendants/{id}/bonds/{bond_id}/collateral"
    description: "Pledge a collateral item against a DRAFT bond (HELD)."
    roles: [BondsAgent]
    code: 201
    input: [kind, pledged_value_cents]
    output: CollateralItem
    side_effects: ["recompute Bond.collateral_held_cents (calculations.collateral_held)"]
  - method: GET
    path: "/bonds/{id}/collateral"
    description: "List collateral on a bond (reverse-reachability for CollateralItem.bond_id)."
    roles: [BondsAgent, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: CollateralItem[]
    side_effects: []

  # ---- Court Dates & Notifications ----
  - method: POST
    path: "/defendants/{id}/bonds/{bond_id}/court-dates"
    description: "Schedule a court date for a bond; rejects overlap with an existing live hearing on the same bond's docket."
    roles: [Court]
    code: 201
    input: [scheduled_utc, "duration_minutes?", "hearing_type?"]
    output: CourtDate
    side_effects: ["ERR_DOCKET_OVERLAP if the closed interval collides with another SCHEDULED/NOTIFIED hearing's buffered interval on the same bond"]
  - method: GET
    path: "/bonds/{id}/court-dates"
    description: "List court dates on a bond (reverse-reachability for CourtDate.bond_id)."
    roles: [BondsAgent, Court, ComplianceOfficer, RecoveryAgent]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: CourtDate[]
    side_effects: []
  - method: GET
    path: "/court-dates/{id}"
    description: "Fetch a court date."
    roles: [BondsAgent, Court, ComplianceOfficer, RecoveryAgent]
    code: 200
    input: []
    output: CourtDate
    side_effects: []
  - method: POST
    path: "/defendants/{id}/court-dates/{court_date_id}/notify"
    description: "Dispatch a court-date notification (SCHEDULED -> NOTIFIED)."
    roles: [Court]
    code: 200
    input: ["channel?"]
    output: CourtDate
    side_effects: ["create Notification (calculations.notification_lead)", "set notified_at"]
  - method: GET
    path: "/court-dates/{id}/notifications"
    description: "List notifications for a court date (reverse-reachability for Notification.court_date_id)."
    roles: [BondsAgent, Court, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Notification[]
    side_effects: []
  - method: POST
    path: "/defendants/{id}/court-dates/{court_date_id}/record-appearance"
    description: "Record that the defendant appeared (-> APPEARED)."
    roles: [Court]
    code: 200
    input: []
    output: CourtDate
    side_effects: []
  - method: POST
    path: "/defendants/{id}/court-dates/{court_date_id}/record-fta"
    description: "Record failure to appear (-> FAILED_TO_APPEAR); cascades Bond ACTIVE -> FORFEITED + opens proceeding."
    roles: [Court]
    code: 200
    input: []
    output: CourtDate
    side_effects: ["cascade Bond->FORFEITED", "create ForfeitureProceeding (grace_deadline)", "recompute Defendant exposure"]
  - method: POST
    path: "/defendants/{id}/court-dates/{court_date_id}/continue"
    description: "Continue/postpone a court date (-> CONTINUED)."
    roles: [Court]
    code: 200
    input: []
    output: CourtDate
    side_effects: []

  # ---- Check-ins ----
  - method: POST
    path: "/defendants/{id}/check-ins"
    description: "Record a condition-compliance check-in for a bond; GPS FAIL cascades the device to TAMPER."
    roles: [RecoveryAgent, ComplianceOfficer]
    code: 201
    input: [bond_id, condition_code, result]
    output: CheckIn
    side_effects: ["compute weight (calculations.compliance_score)", "GPS FAIL -> increment device violation_count + drive GpsDevice ACTIVE->TAMPER"]
  - method: GET
    path: "/bonds/{id}/check-ins"
    description: "List check-ins on a bond (reverse-reachability for CheckIn.bond_id)."
    roles: [BondsAgent, ComplianceOfficer, RecoveryAgent]
    code: 200
    input: ["limit?", "offset?", "condition_code?"]
    output: CheckIn[]
    side_effects: []

  # ---- GPS Devices ----
  - method: POST
    path: "/gps-devices"
    description: "Register a GPS monitoring device (UNASSIGNED)."
    roles: [BondsAgent]
    code: 201
    input: [serial_number]
    output: GpsDevice
    side_effects: ["ERR_DUPLICATE_SERIAL on collision"]
  - method: GET
    path: "/gps-devices/{id}"
    description: "Fetch a GPS device."
    roles: [BondsAgent, ComplianceOfficer, RecoveryAgent]
    code: 200
    input: []
    output: GpsDevice
    side_effects: []
  - method: POST
    path: "/defendants/{id}/bonds/{bond_id}/gps/assign"
    description: "Assign a GPS device to a bond (UNASSIGNED -> ASSIGNED)."
    roles: [BondsAgent]
    code: 200
    input: [device_id]
    output: GpsDevice
    side_effects: ["set assigned_bond_id", "ERR_GPS_NOT_REQUIRED if order does not require GPS", "ERR_DEVICE_SLOT_OCCUPIED if a non-returned device already monitors the bond (calculations.device_occupancy_check)"]
  - method: GET
    path: "/bonds/{id}/gps-devices"
    description: "List GPS devices assigned to a bond (reverse-reachability for GpsDevice.assigned_bond_id)."
    roles: [BondsAgent, ComplianceOfficer, RecoveryAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: GpsDevice[]
    side_effects: []
  - method: POST
    path: "/defendants/{id}/gps/{device_id}/activate"
    description: "Activate an assigned device (ASSIGNED -> ACTIVE)."
    roles: [BondsAgent]
    code: 200
    input: []
    output: GpsDevice
    side_effects: []
  - method: POST
    path: "/defendants/{id}/gps/{device_id}/clear-tamper"
    description: "Clear a tamper alert (TAMPER -> ACTIVE)."
    roles: [RecoveryAgent]
    code: 200
    input: []
    output: GpsDevice
    side_effects: []
  - method: POST
    path: "/defendants/{id}/gps/{device_id}/return"
    description: "Return a device (-> RETURNED)."
    roles: [BondsAgent]
    code: 200
    input: []
    output: GpsDevice
    side_effects: ["clear assigned_bond_id"]

  # ---- Forfeiture / Recovery / Exoneration ----
  - method: GET
    path: "/forfeitures/{id}"
    description: "Fetch a forfeiture proceeding."
    roles: [BondsAgent, ComplianceOfficer, RecoveryAgent]
    code: 200
    input: []
    output: ForfeitureProceeding
    side_effects: []
  - method: GET
    path: "/bonds/{id}/forfeitures"
    description: "List proceedings for a bond (reverse-reachability for ForfeitureProceeding.bond_id)."
    roles: [BondsAgent, ComplianceOfficer, RecoveryAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: ForfeitureProceeding[]
    side_effects: []
  - method: GET
    path: "/court-dates/{id}/forfeitures"
    description: "List proceedings triggered by a court date (reverse-reachability for ForfeitureProceeding.trigger_court_date_id)."
    roles: [BondsAgent, ComplianceOfficer, RecoveryAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: ForfeitureProceeding[]
    side_effects: []
  - method: POST
    path: "/defendants/{id}/forfeitures/{proceeding_id}/open-recovery"
    description: "Open the recovery effort (FORFEITED -> RECOVERY_OPEN)."
    roles: [RecoveryAgent]
    code: 200
    input: []
    output: ForfeitureProceeding
    side_effects: ["ERR_GRACE_EXPIRED if past grace_deadline_utc"]
  - method: POST
    path: "/defendants/{id}/forfeitures/{proceeding_id}/reinstate"
    description: "Reinstate a recovered bond (RECOVERY_OPEN -> REINSTATED; cascades Bond FORFEITED -> ACTIVE)."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ForfeitureProceeding
    side_effects: ["cascade Bond->ACTIVE", "recompute Defendant exposure", "ERR_GRACE_EXPIRED if past deadline"]
  - method: POST
    path: "/defendants/{id}/forfeitures/{proceeding_id}/enter-judgment"
    description: "Enter judgment after the grace period lapses (-> JUDGMENT); liquidate collateral, call indemnity."
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_bond_version]
    output: ForfeitureProceeding
    side_effects: ["judgment_amount", "settlement_status=JUDGMENT_ENTERED", "liquidate CollateralItems + ledger", "call IndemnityAgreements + recompute exposure", "increments Bond.version by 1", "ERR_STALE_VERSION on OCC mismatch", "ERR_GRACE_NOT_EXPIRED within grace"]
  - method: POST
    path: "/defendants/{id}/forfeitures/{proceeding_id}/remit"
    description: "Remit part of an entered judgment (JUDGMENT -> REMITTED)."
    roles: [ComplianceOfficer]
    code: 200
    input: [remission_pct]
    output: ForfeitureProceeding
    side_effects: ["remission_credit ledger entry", "ERR_INVALID_REMISSION if pct out of (0,100]"]

  # ---- Ledger ----
  - method: GET
    path: "/bonds/{id}/ledger"
    description: "List ledger entries for a bond (reverse-reachability for LedgerEntry.bond_id)."
    roles: [BondsAgent, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "entry_type?"]
    output: LedgerEntry[]
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: pin the system clock to a fixed ISO 8601 UTC instant for deterministic temporal tests."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["all subsequent system-clock reads return to_iso8601 until next set"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role not permitted for this endpoint."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path-referenced resource does not exist."
  - id: ERR_FK_NOT_FOUND
    http: 404
    condition: "A foreign key in the request body references a non-existent resource."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong type, or enum value outside its declared set."
  - id: ERR_DUPLICATE_CASE_NUMBER
    http: 409
    condition: "case_number already exists for this defendant."
  - id: ERR_DUPLICATE_SERIAL
    http: 409
    condition: "GpsDevice.serial_number already registered."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not defined from the resource's current state."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_bond_version does not match the bond's current version on enter-judgment."
  - id: ERR_BOND_TYPE_NOT_ALLOWED
    http: 409
    condition: "Bond.bond_type not permitted by BailOrder.bond_type_allowed."
  - id: ERR_GPS_NOT_REQUIRED
    http: 409
    condition: "GPS assignment attempted on a bond whose order does not require GPS."
  - id: ERR_DOCKET_OVERLAP
    http: 409
    condition: "New court date collides with a buffer-inflated SCHEDULED/NOTIFIED hearing on the same bond."
  - id: ERR_DEVICE_SLOT_OCCUPIED
    http: 409
    condition: "Bond already has a non-returned GPS device assigned (occupancy capacity 1)."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The ComplianceOfficer exonerating a bond is the same user who activated it."
  - id: ERR_GRACE_EXPIRED
    http: 409
    condition: "Reinstatement / open-recovery attempted after grace_deadline_utc."
  - id: ERR_GRACE_NOT_EXPIRED
    http: 409
    condition: "Judgment attempted while still within the grace period (system clock <= grace_deadline_utc)."
  - id: ERR_TIMING_VIOLATION
    http: 409
    condition: "FTA recorded before scheduled_utc, or notification attempted at/after scheduled_utc."
  - id: ERR_INSUFFICIENT_INDEMNITY
    http: 409
    condition: "SURETY activation with total PENDING liability_share_cents < bail_amount_cents."
  - id: ERR_INSUFFICIENT_COLLATERAL
    http: 409
    condition: "Activation with collateral_held_cents < required_collateral_cents."
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 409
    condition: "Indemnity agreement would push the indemnitor's exposure over credit_limit_cents."
  - id: ERR_INVALID_REMISSION
    http: 400
    condition: "remission_pct not in (0, 100]."
  - id: ERR_VALIDATION
    http: 422
    condition: "Pagination parameter out of range (limit/offset) or otherwise semantically invalid query."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: BondsAgent
    description: "Posts bonds, manages collateral/indemnity, assigns and operates GPS devices."
    identity: "opaque"
    exclusive_operations:
      - "POST /defendants/{id}/bail-orders/{order_id}/bonds"
      - "POST /defendants/{id}/bonds/{bond_id}/activate"
      - "POST /defendants/{id}/bonds/{bond_id}/revoke"
      - "POST /indemnitors"
      - "POST /defendants/{id}/bonds/{bond_id}/indemnity-agreements"
      - "POST /defendants/{id}/bonds/{bond_id}/collateral"
      - "POST /gps-devices"
      - "POST /defendants/{id}/bonds/{bond_id}/gps/assign"
      - "POST /defendants/{id}/gps/{device_id}/activate"
      - "POST /defendants/{id}/gps/{device_id}/return"
    shared_operations:
      - "POST /defendants"
      - "GET (read endpoints)"
  - name: Court
    description: "Records bail orders, schedules and resolves court dates, dispatches notifications."
    identity: "opaque"
    exclusive_operations:
      - "POST /defendants/{id}/bail-orders"
      - "POST /defendants/{id}/bonds/{bond_id}/court-dates"
      - "POST /defendants/{id}/court-dates/{court_date_id}/notify"
      - "POST /defendants/{id}/court-dates/{court_date_id}/record-appearance"
      - "POST /defendants/{id}/court-dates/{court_date_id}/record-fta"
      - "POST /defendants/{id}/court-dates/{court_date_id}/continue"
    shared_operations:
      - "POST /defendants"
      - "GET (read endpoints)"
  - name: ComplianceOfficer
    description: "Approves exoneration, reinstatement, judgment and remission; cannot post bonds (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /defendants/{id}/bonds/{bond_id}/exonerate"
      - "POST /defendants/{id}/forfeitures/{proceeding_id}/reinstate"
      - "POST /defendants/{id}/forfeitures/{proceeding_id}/enter-judgment"
      - "POST /defendants/{id}/forfeitures/{proceeding_id}/remit"
    shared_operations:
      - "POST /defendants/{id}/check-ins"
      - "GET (read endpoints)"
  - name: RecoveryAgent
    description: "Runs recovery: opens recovery effort, records check-ins, clears GPS tampers."
    identity: "opaque"
    exclusive_operations:
      - "POST /defendants/{id}/forfeitures/{proceeding_id}/open-recovery"
      - "POST /defendants/{id}/gps/{device_id}/clear-tamper"
    shared_operations:
      - "POST /defendants/{id}/check-ins"
      - "GET (read endpoints)"
  - name: SystemAdmin
    description: "Operational role for the test-driving clock endpoint."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations: []
