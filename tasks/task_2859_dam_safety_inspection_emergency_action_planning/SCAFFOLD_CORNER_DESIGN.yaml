      - name: screening_and_certified_variants_of_the_same_assessment_diverge
        claim_type: variant_divergence
        grounds:
          - calculations.breach_consequence_score.variants
          - entities.ConsequenceAssessment.fields.screening_score
          - entities.ConsequenceAssessment.fields.certified_score
        distinguishing_aspect: |
          The two declared variants of one formula must disagree on the same stored inputs and the
          divergence must be large enough to change the hazard class.
        excluded_because:
          difficulty_instance: screening_vs_certified_consequence_score_diverges_and_reclassifies_dam
          rationale: |
            That §1.8 dual_variant_calc instance pins screening 30.00 / SIGNIFICANT against
            certified 45.00 / HIGH on the same row and follows the reclassification into the dam's
            hazard class and inspection schedule, which subsumes this breadth claim.

      - name: penalty_accrual_rounds_every_day_of_the_tier_ladder_separately
        claim_type: chronological
        grounds:
          - calculations.civil_penalty_accrual
          - entities.RemediationOrder.fields.assessed_penalty_cents
        distinguishing_aspect: |
          The accrual walks day 1..overdue_days in order and rounds each day's tiered amount before
          adding it, which differs from summing unrounded amounts and rounding once.
        excluded_because:
          difficulty_instance: civil_penalty_per_day_rounding_diverges_from_sum_then_round
          rationale: |
            That §1.8 combinatorial_formula instance already pins 67 overdue days at a 6250-cent
            base rate to 65314 cents and names 65313 as the sum-then-round wrong answer, which is a
            strictly stronger form of this claim.

