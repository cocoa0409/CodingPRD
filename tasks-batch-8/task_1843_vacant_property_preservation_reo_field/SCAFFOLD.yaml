  - method: GET
    path: "/preservation/invoices/{invoiceId}/lines"
    description: "List expense lines of an invoice"
    roles: [Servicer, VendorAdmin, Dispatcher, FieldCrew, QualityReviewer]
    code: 200
    input: []
    output: ExpenseLine[]
    side_effects: []

  - method: GET
    path: "/preservation/expense-lines"
    description: "List expense lines with filters and pagination"
    roles: [Servicer, VendorAdmin, Dispatcher, FieldCrew, QualityReviewer]
    code: 200
    input: ["invoice_id?", "item_code?", "limit?", "offset?"]
    output: ExpenseLine[]
    side_effects: []

  - method: GET
    path: "/preservation/expense-lines/{expenseLineId}"
    description: "Get an expense line"
    roles: [Servicer, VendorAdmin, Dispatcher, FieldCrew, QualityReviewer]
    code: 200
    input: []
    output: ExpenseLine
    side_effects: []

  - method: POST
    path: "/preservation/invoices/{invoiceId}/submit"
    description: "Submit a DRAFT invoice; computes PROVISIONAL allowable"
    roles: [VendorAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["provisional_allowed_cents and per-line allowed_cents computed (PROVISIONAL variant)"]

  - method: POST
    path: "/preservation/invoices/{invoiceId}/approve"
    description: "Servicer approves; computes FINAL allowable, prompt-pay discount, ytd cascade"
    roles: [Servicer]
    code: 200
    input: []
