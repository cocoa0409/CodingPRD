              payload: { full_name: "Tina Ticket", email: "tina@x.com", membership_tier: "STANDARD", date_of_birth: "1990-10-10" }
              as: PlatformAdmin
              captures: { m: $.data.id }
            - call: "POST /medical-id/members/${m}/record-items"
              payload: { item_kind: "CONDITION", label: "HTN", detail: "bp", severity: "MEDIUM", provider_document_ref: "doc-h1" }
              as: Member
              as_user_id: "${m}"
              captures: { it: $.data.id }
            - call: "GET /medical-id/members/${m}/record-items/${it}/tickets"
              payload: {}
              as: RecordVerifier
              as_user_id: "rv-1"
              captures: { t1: "$.data[0].id" }
            - call: "POST /medical-id/verification-tickets/${t1}/resolve"
              payload: { decision: "REJECT", decision_note: "blurry" }
              as: RecordVerifier
              as_user_id: "rv-1"
            - call: "POST /medical-id/members/${m}/record-items/${it}/submit-for-verification"
              payload: { provider_document_ref: "doc-h2" }
              as: Member
              as_user_id: "${m}"
          trigger:
            - call: "GET /medical-id/verification-tickets"
              payload: { record_item_id: "${it}" }
              as: RecordVerifier
              as_user_id: "rv-1"
          assert:
            - "exactly 2 tickets returned, submission_rounds 1 and 2, statuses REJECTED and OPEN"

      - name: audit_trail_records_business_actions
        claim_type: Computed read
        grounds:
          - entities.AuditEvent
          - endpoints.GET_/medical-id/members/{memberId}/audit-events
        distinguishing_aspect: "After enroll + contact add + order create, the member's audit log contains ENROLL, CONTACT_ADD, and other recorded actions in chronological order with actor role and id stamped (confirm is exercised elsewhere)."
        test_recipe:
          setup:
