            - { call: "POST /feedback-panel/translations", payload: { instrument_id: "${instr_id}", locale: "en", translator_ref: "tr-1" }, as: SurveyDesigner, captures: { tr_en: $.data.id } }
            - { call: "POST /feedback-panel/translations/${tr_en}/certify", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/instruments/${instr_id}/approve", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/instruments/${instr_id}/lock", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/survey-waves", payload: { wave_code: "W1", instrument_id: "${instr_id}", opens_at: "2026-08-02T00:00:00Z", closes_at: "2026-08-10T00:00:00Z", min_response_rate: 0.5, incentive_pool_total_cents: 100000, base_incentive_cents: 1000 }, as: PanelManager, captures: { wave_id: $.data.id } }
            - { call: "POST /feedback-panel/survey-waves/${wave_id}/arm", payload: {}, as: PanelManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PanelManager }
            - { call: "POST /feedback-panel/survey-waves/${wave_id}/open-fielding", payload: {}, as: PanelManager }
            - { call: "POST /feedback-panel/invitations", payload: { wave_id: "${wave_id}", panelist_id: "${p1_id}" }, as: PanelManager, captures: { inv1: $.data.id } }
            - { call: "POST /feedback-panel/responses", payload: { invitation_id: "${inv1}", answers_payload: { q1: 1 }, completeness_pct: 30, completion_seconds: 90 }, as: PanelManager, captures: { r1: $.data.id } }
            - { call: "POST /feedback-panel/responses/${r1}/quarantine", payload: {}, as: DataAnalyst }
            - { call: "GET /feedback-panel/incentive-awards?response_id=${r1}", payload: {}, as: IncentiveClerk, captures: { award1: "$.data[0].id" } }
          trigger:
            - { call: "POST /feedback-panel/responses/${r1}/discard", payload: {}, as: DataAnalyst, captures: { r_st: $.data.status } }
            - { call: "GET /feedback-panel/incentive-awards/${award1}", payload: {}, as: IncentiveClerk, captures: { elig: $.data.eligibility_status } }
