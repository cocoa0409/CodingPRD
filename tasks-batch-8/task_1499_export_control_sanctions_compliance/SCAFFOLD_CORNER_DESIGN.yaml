scaffold_corner_design:
  # =================================================================
  # Section: entities
  # =================================================================
  - section: entities
    instances:
      - name: product_creation_applies_defaults
        claim_type: creation
        grounds: [entities.Product]
        distinguishing_aspect: "POST /products returns 201 with system/computed defaults applied: status UNCLASSIFIED, classification_count 0, active_classification_id null, version 1, server-minted id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /compliance/products"
              payload: { sku: "P-001", name: "Bolt", controlled_content_pct: 0, unit_value_cents: 50 }
              as: ComplianceAnalyst
              captures: { p_id: $.data.id, p_status: $.data.status, p_ver: $.data.version }
          assert:
            - "p_status == \"UNCLASSIFIED\""
            - "p_ver == 1"
            - "Product.${p_id}.classification_count == 0 and active_classification_id is null"

      - name: product_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Product, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent product UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /compliance/products/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ComplianceAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_NOT_FOUND\" (http 404)"

      - name: party_defaults_and_computed_posture
        claim_type: defaults
        grounds: [entities.Party.fields.is_foreign_national, entities.Party.fields.screening_posture]
        distinguishing_aspect: "Omitting is_foreign_national defaults it to false; a new party's computed screening_posture is UNSCREENED and active_grant_count is 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /compliance/parties"
              payload: { legal_name: "Acme SPA", country_code: "ITA", city: "Milan", party_type: "CUSTOMER" }
              as: TradeOpsSpecialist
              captures: { party_id: $.data.id }
          assert:
            - "Party.${party_id}.is_foreign_national == false"
            - "Party.${party_id}.screening_posture == \"UNSCREENED\""
            - "Party.${party_id}.active_grant_count == 0 and last_screened_at is null"

      - name: classification_sequence_and_count_increment
        claim_type: computed_fields
        grounds: [entities.Classification.fields.sequence, entities.Product.fields.classification_count]
        distinguishing_aspect: "Two classifications on one product get sequence 1 then 2; Product.classification_count tracks creations (2) even before any approval."
        test_recipe:
          setup: ["product P created"]
          setup_api_calls:
            - call: "POST /compliance/products"
              payload: { sku: "P-002", name: "Gear", controlled_content_pct: 5, unit_value_cents: 800 }
              as: ComplianceAnalyst
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /compliance/classifications"
              payload: { product_id: "${p_id}", expected_product_version: "${p_v}", jurisdiction: "EAR", classification_code: "EAR99", determination_basis: "SELF_CLASSIFICATION" }
              as: ComplianceAnalyst
              captures: { c1_id: $.data.id, c1_seq: $.data.sequence }
            - call: "GET /compliance/products/${p_id}"
              payload: {}
              as: ComplianceAnalyst
              captures: { p_v2: $.data.version }
          trigger:
            - call: "POST /compliance/classifications"
              payload: { product_id: "${p_id}", expected_product_version: "${p_v2}", jurisdiction: "EAR", classification_code: "5A002", determination_basis: "CCATS" }
              as: ComplianceAnalyst
              captures: { c2_seq: $.data.sequence }
          assert:
            - "c1_seq == 1"
            - "c2_seq == 2"
            - "Product.${p_id}.classification_count == 2 and version == 3 (each classification create bumps the product version)"

      - name: screening_result_clear_shape_when_no_entries
        claim_type: computed_fields
        grounds: [entities.ScreeningResult.fields.score, entities.ScreeningResult.fields.matched_entry_id, entities.ScreeningResult.fields.threshold_used]
        distinguishing_aspect: "A CLEAR screening result pins matched_entry_id=null, score=0.00, threshold_used=null — not the raw computed score."
        test_recipe:
          setup: ["party exists; no ACTIVE list entries"]
          setup_api_calls:
            - call: "POST /compliance/parties"
              payload: { legal_name: "Solo Trader KK", country_code: "JPN", city: "Osaka", party_type: "CUSTOMER" }
              as: TradeOpsSpecialist
              captures: { party_id: $.data.id }
          trigger:
            - call: "POST /compliance/parties/${party_id}/screen"
              payload: {}
              as: TradeOpsSpecialist
              captures: { r_id: $.data.id }
          assert:
            - "ScreeningResult.${r_id}.status == \"CLEAR\""
            - "ScreeningResult.${r_id}.score == 0.00 and matched_entry_id is null and threshold_used is null"
            - "ScreeningResult.${r_id}.trigger_context == \"MANUAL\" and algorithm_variant == \"FUZZY\""
            - "Party.${party_id}.screening_posture == \"CLEAR\" and last_screened_at is non-null"

      - name: audit_record_has_no_version_field
        claim_type: immutability
        grounds: [entities.AuditRecord]
        distinguishing_aspect: "AuditRecord is common_fields:false (append-only): the returned record carries id and created_at but no version or updated_at, and no update/delete endpoint exists for it."
        test_recipe:
          setup: ["a classification approval has produced one AuditRecord"]
          setup_api_calls:
            - call: "POST /compliance/products"
              payload: { sku: "P-003", name: "Seal", controlled_content_pct: 0, unit_value_cents: 10 }
              as: ComplianceAnalyst
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /compliance/classifications"
              payload: { product_id: "${p_id}", expected_product_version: "${p_v}", jurisdiction: "EAR", classification_code: "EAR99", determination_basis: "SELF_CLASSIFICATION" }
              as: ComplianceAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /compliance/classifications/${c_id}/submit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compliance/classifications/${c_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
          trigger:
            - call: "GET /compliance/audit-records?entity_type=Classification&entity_id=${c_id}"
              payload: {}
              as: ComplianceDirector
              captures: { ar_type: "$.data[0].event_type", ar_retain: "$.data[0].retain_until" }
          assert:
            - "ar_type == \"CLASSIFICATION_ACTIVATED\""
            - "ar_retain == created_at + 1825 days (2031-07-31T00:00:00Z at the default clock)"
            - "the returned record object has no 'version' and no 'updated_at' key"

      - name: invalid_enum_value_rejected
        claim_type: type_constraints
        grounds: [entities.Party.fields.party_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "party_type 'ALIEN' is outside the declared enum -> 400 ERR_VALIDATION."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /compliance/parties"
              payload: { legal_name: "X", country_code: "FRA", city: "Paris", party_type: "ALIEN" }
              as: TradeOpsSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_VALIDATION\" (http 400)"

      - name: date_range_ordering_rejected
        claim_type: type_constraints
        grounds: [entities.License.fields.valid_until, entities.AccessGrant.fields.end_date, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "valid_from > valid_until on a license is a 400; likewise an access grant with end_date <= start_date (end is exclusive) is a 400."
        test_recipe:
          setup: ["product CLASSIFIED (for the license create to reach shape validation only shape matters; existence of product satisfied)"]
          setup_api_calls:
            - call: "POST /compliance/products"
              payload: { sku: "P-004", name: "Ring", controlled_content_pct: 0, unit_value_cents: 10 }
              as: ComplianceAnalyst
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /compliance/licenses"
              payload: { product_id: "${p_id}", issuing_authority: "BIS", approved_value_cents: 1000, approved_quantity: 10, valid_from: "2026-12-31", valid_until: "2026-01-01" }
              as: ComplianceAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_VALIDATION\" (valid_from must be <= valid_until)"

      - name: fk_reference_to_missing_parent_returns_404
        claim_type: parent_relationships
        grounds: [entities.Shipment.fields.order_id, entities.AccessGrant.fields.tcp_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Flat-topology FK integrity: shipment create with a non-existent order_id and access-grant create with a non-existent tcp_id both fail 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /compliance/shipments"
              payload: { order_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", quantity: 1, planned_ship_date: "2026-08-10" }
              as: TradeOpsSpecialist
              captures: { err1: $.data.error_id }
            - call: "POST /compliance/access-grants"
              payload: { tcp_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", party_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", start_date: "2026-08-01", end_date: "2026-09-01" }
              as: ComplianceAnalyst
              captures: { err2: $.data.error_id }
          assert:
            - "err1 == \"ERR_NOT_FOUND\""
            - "err2 == \"ERR_NOT_FOUND\""

      - name: create_product_with_computed_field_rejected
        claim_type: system_fields
        grounds: [entities.Product.fields.status, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Client-supplied computed/system fields (status, version, id, classification_count) in a create body are rejected with 400 ERR_VALIDATION."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /compliance/products"
              payload: { sku: "P-005", name: "Nut", controlled_content_pct: 0, unit_value_cents: 10, status: "CLASSIFIED" }
              as: ComplianceAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_VALIDATION\""

  # =================================================================
  # Section: state_machines
  # =================================================================
  - section: state_machines
    instances:
      - name: initial_states_on_creation
        claim_type: initial_state
        grounds: [state_machines.Classification, state_machines.License, state_machines.Violation, state_machines.TechnologyControlPlan]
        distinguishing_aspect: "Newly created records start in their declared initial states: Classification DRAFT, License DRAFT, Violation IDENTIFIED, TCP DRAFT."
        test_recipe:
          setup: ["one product exists"]
          setup_api_calls:
            - call: "POST /compliance/products"
              payload: { sku: "P-010", name: "Plate", controlled_content_pct: 0, unit_value_cents: 10 }
              as: ComplianceAnalyst
              captures: { p_id: $.data.id, p_v: $.data.version }
          trigger:
            - call: "POST /compliance/classifications"
              payload: { product_id: "${p_id}", expected_product_version: "${p_v}", jurisdiction: "EAR", classification_code: "EAR99", determination_basis: "SELF_CLASSIFICATION" }
              as: ComplianceAnalyst
              captures: { c_status: $.data.status }
            - call: "POST /compliance/licenses"
              payload: { product_id: "${p_id}", issuing_authority: "BIS", approved_value_cents: 1000, approved_quantity: 10, valid_from: "2026-07-01", valid_until: "2026-12-31" }
              as: ComplianceAnalyst
              captures: { l_status: $.data.status }
            - call: "POST /compliance/violations"
              payload: { source_type: "OTHER", source_id: "n/a", severity: "MINOR", description: "test" }
              as: ComplianceAnalyst
              as_user_id: "analyst-9"
              captures: { v_status: $.data.status }
            - call: "POST /compliance/tcps"
              payload: { name: "TCP-X", enclave_id: "LAB-X", product_id: "${p_id}", segregation_level: "LEVEL_1", effective_from: "2026-01-01", effective_to: "2027-01-01" }
              as: ComplianceAnalyst
              captures: { t_status: $.data.status }
          assert:
            - "c_status == \"DRAFT\""
            - "l_status == \"DRAFT\""
            - "v_status == \"IDENTIFIED\""
            - "t_status == \"DRAFT\""

      - name: review_draft_classification_rejected_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Classification.SUBMITTED_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Reviewing a classification still in DRAFT (never submitted) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["product + DRAFT classification"]
          setup_api_calls:
            - call: "POST /compliance/products"
              payload: { sku: "P-011", name: "Washer", controlled_content_pct: 0, unit_value_cents: 10 }
              as: ComplianceAnalyst
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /compliance/classifications"
              payload: { product_id: "${p_id}", expected_product_version: "${p_v}", jurisdiction: "EAR", classification_code: "EAR99", determination_basis: "SELF_CLASSIFICATION" }
              as: ComplianceAnalyst
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /compliance/classifications/${c_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_INVALID_STATE\""
            - "Classification.${c_id}.status == \"DRAFT\" (unchanged)"

      - name: order_release_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ExportOrder, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /orders/{id}/release from DRAFT (never submitted) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["EAR99 classified product; clean party; DRAFT order"]
          setup_api_calls:
            - call: "POST /compliance/products"
              payload: { sku: "P-012", name: "Spring", controlled_content_pct: 0, unit_value_cents: 10 }
              as: ComplianceAnalyst
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /compliance/classifications"
              payload: { product_id: "${p_id}", expected_product_version: "${p_v}", jurisdiction: "EAR", classification_code: "EAR99", determination_basis: "SELF_CLASSIFICATION" }
              as: ComplianceAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /compliance/classifications/${c_id}/submit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compliance/classifications/${c_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/parties"
              payload: { legal_name: "Nord Nest AB", country_code: "SWE", city: "Lund", party_type: "CUSTOMER" }
              as: TradeOpsSpecialist
              captures: { party_id: $.data.id }
            - call: "POST /compliance/orders"
              payload: { product_id: "${p_id}", party_id: "${party_id}", destination_country: "SWE", end_use: "CIVILIAN", quantity: 1 }
              as: TradeOpsSpecialist
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /compliance/orders/${o_id}/release"
              payload: {}
              as: TradeOpsSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_INVALID_STATE\""
            - "Order.${o_id}.status == \"DRAFT\" (unchanged)"

      - name: cancel_cancelled_order_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ExportOrder.DRAFT_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal: a second cancel on the same order fails with ERR_INVALID_STATE and idempotency is NOT granted to state actions."
        test_recipe:
          setup: ["EAR99 classified product; clean party; DRAFT order"]
          setup_api_calls:
            - call: "POST /compliance/products"
              payload: { sku: "P-013", name: "Rivet", controlled_content_pct: 0, unit_value_cents: 10 }
              as: ComplianceAnalyst
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /compliance/classifications"
              payload: { product_id: "${p_id}", expected_product_version: "${p_v}", jurisdiction: "EAR", classification_code: "EAR99", determination_basis: "SELF_CLASSIFICATION" }
              as: ComplianceAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /compliance/classifications/${c_id}/submit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compliance/classifications/${c_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/parties"
              payload: { legal_name: "Delta Handel GmbH", country_code: "AUT", city: "Vienna", party_type: "CUSTOMER" }
              as: TradeOpsSpecialist
              captures: { party_id: $.data.id }
            - call: "POST /compliance/orders"
              payload: { product_id: "${p_id}", party_id: "${party_id}", destination_country: "AUT", end_use: "CIVILIAN", quantity: 1 }
              as: TradeOpsSpecialist
              captures: { o_id: $.data.id }
            - call: "POST /compliance/orders/${o_id}/cancel"
              payload: {}
              as: TradeOpsSpecialist
          trigger:
            - call: "POST /compliance/orders/${o_id}/cancel"
              payload: {}
              as: TradeOpsSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_INVALID_STATE\" (terminal CANCELLED)"
            - "Order.${o_id}.status == \"CANCELLED\""

      - name: resolve_clear_result_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ScreeningResult, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Resolve is defined only from POTENTIAL_MATCH; resolving a CLEAR result fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["party with a CLEAR manual screening result"]
          setup_api_calls:
            - call: "POST /compliance/parties"
              payload: { legal_name: "Plain Sailing Ltd", country_code: "IRL", city: "Dublin", party_type: "CUSTOMER" }
              as: TradeOpsSpecialist
              captures: { party_id: $.data.id }
            - call: "POST /compliance/parties/${party_id}/screen"
              payload: {}
              as: TradeOpsSpecialist
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /compliance/screening-results/${r_id}/resolve"
              payload: { resolution: "FALSE_POSITIVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_INVALID_STATE\""
            - "ScreeningResult.${r_id}.status == \"CLEAR\" (unchanged)"

      - name: grant_activate_from_requested_rejected
        claim_type: invalid_transition
        grounds: [state_machines.AccessGrant.APPROVED_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activating a grant that is still REQUESTED (not yet APPROVED) fails with ERR_INVALID_STATE — review is a mandatory step."
        test_recipe:
          setup: ["EAR99 classified product; ACTIVE TCP; foreign-national party; grant REQUESTED"]
          setup_api_calls:
            - call: "POST /compliance/products"
              payload: { sku: "P-014", name: "Hinge", controlled_content_pct: 0, unit_value_cents: 10 }
              as: ComplianceAnalyst
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /compliance/classifications"
              payload: { product_id: "${p_id}", expected_product_version: "${p_v}", jurisdiction: "EAR", classification_code: "EAR99", determination_basis: "SELF_CLASSIFICATION" }
              as: ComplianceAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /compliance/classifications/${c_id}/submit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compliance/classifications/${c_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/tcps"
              payload: { name: "TCP-R", enclave_id: "LAB-R", product_id: "${p_id}", segregation_level: "LEVEL_1", effective_from: "2026-01-01", effective_to: "2027-01-01" }
              as: ComplianceAnalyst
              captures: { tcp_id: $.data.id }
            - call: "POST /compliance/tcps/${tcp_id}/set-status"
              payload: { to: "ACTIVE" }
              as: ComplianceAnalyst
            - call: "POST /compliance/parties"
              payload: { legal_name: "Fatima Noor", country_code: "PAK", city: "Lahore", party_type: "FOREIGN_NATIONAL", is_foreign_national: true }
              as: ComplianceAnalyst
              captures: { party_id: $.data.id }
            - call: "POST /compliance/access-grants"
              payload: { tcp_id: "${tcp_id}", party_id: "${party_id}", start_date: "2026-08-01", end_date: "2026-12-01" }
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /compliance/access-grants/${g_id}/activate"
              payload: {}
              as: ComplianceManager
              as_user_id: "manager-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_INVALID_STATE\""
            - "AccessGrant.${g_id}.status == \"REQUESTED\" (unchanged)"

      - name: denied_license_is_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.License.SUBMITTED_to_DENIED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A DENIED license accepts no further transitions: a second review attempt fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["EAR99 classified product; license submitted then DENIED"]
          setup_api_calls:
            - call: "POST /compliance/products"
              payload: { sku: "P-015", name: "Clamp", controlled_content_pct: 0, unit_value_cents: 10 }
              as: ComplianceAnalyst
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /compliance/classifications"
              payload: { product_id: "${p_id}", expected_product_version: "${p_v}", jurisdiction: "EAR", classification_code: "EAR99", determination_basis: "SELF_CLASSIFICATION" }
              as: ComplianceAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /compliance/classifications/${c_id}/submit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compliance/classifications/${c_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/licenses"
              payload: { product_id: "${p_id}", issuing_authority: "BIS", approved_value_cents: 1000, approved_quantity: 10, valid_from: "2026-07-01", valid_until: "2026-12-31" }
              as: ComplianceAnalyst
              captures: { l_id: $.data.id }
            - call: "POST /compliance/licenses/${l_id}/submit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compliance/licenses/${l_id}/review"
              payload: { decision: "DENY" }
              as: ComplianceManager
              as_user_id: "manager-1"
          trigger:
            - call: "POST /compliance/licenses/${l_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-2"
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_INVALID_STATE\" (DENIED is terminal)"
            - "License.${l_id}.status == \"DENIED\""

      - name: license_approval_side_effects
        claim_type: side_effect_execution
        grounds: [state_machines.License.SUBMITTED_to_APPROVED, entities.License.fields.license_number]
        distinguishing_aspect: "Approval assigns license_number LIC-000001 (first approval), initializes remaining_* to approved_*, and writes AuditRecord(LICENSE_APPROVED)."
        test_recipe:
          setup: ["EAR99 classified product; submitted license (value 42000, qty 7)"]
          setup_api_calls:
            - call: "POST /compliance/products"
              payload: { sku: "P-016", name: "Latch", controlled_content_pct: 0, unit_value_cents: 10 }
              as: ComplianceAnalyst
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /compliance/classifications"
              payload: { product_id: "${p_id}", expected_product_version: "${p_v}", jurisdiction: "EAR", classification_code: "EAR99", determination_basis: "SELF_CLASSIFICATION" }
              as: ComplianceAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /compliance/classifications/${c_id}/submit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compliance/classifications/${c_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/licenses"
              payload: { product_id: "${p_id}", issuing_authority: "BIS", approved_value_cents: 42000, approved_quantity: 7, valid_from: "2026-07-01", valid_until: "2026-12-31" }
              as: ComplianceAnalyst
              captures: { l_id: $.data.id }
            - call: "POST /compliance/licenses/${l_id}/submit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /compliance/licenses/${l_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
              captures: { l_num: $.data.license_number }
          assert:
            - "l_num == \"LIC-000001\""
            - "License.${l_id}.remaining_value_cents == 42000 and remaining_quantity == 7"
            - "License.${l_id}.reviewed_by_user_id == \"manager-1\""
            - "GET /compliance/audit-records?entity_type=License&entity_id=${l_id}&event_type=LICENSE_APPROVED returns exactly 1 record"

      - name: violation_vsd_full_path_side_effects
        claim_type: valid_transition
        grounds: [state_machines.Violation, entities.Violation.fields.disclosure_reference]
        distinguishing_aspect: "The VSD path IDENTIFIED -> UNDER_REVIEW -> SUBSTANTIATED -> DISCLOSED -> CLOSED assigns disclosure_reference VSD-000001 and writes VSD_SUBMITTED then VIOLATION_CLOSED audit records; SoD satisfied by distinct user ids."
        test_recipe:
          setup: ["violation identified by analyst-1"]
          setup_api_calls:
            - call: "POST /compliance/violations"
              payload: { source_type: "SHIPMENT", source_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", severity: "CRITICAL", description: "Suspected unlicensed export of controlled encoder" }
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
              captures: { v_id: $.data.id }
            - call: "POST /compliance/violations/${v_id}/advance"
              payload: { event: "START_REVIEW" }
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/violations/${v_id}/advance"
              payload: { event: "SUBSTANTIATE" }
              as: ComplianceManager
              as_user_id: "manager-2"
          trigger:
            - call: "POST /compliance/violations/${v_id}/submit-disclosure"
              payload: {}
              as: ComplianceDirector
              as_user_id: "director-1"
              captures: { v_ref: $.data.disclosure_reference }
            - call: "POST /compliance/violations/${v_id}/advance"
              payload: { event: "CLOSE" }
              as: ComplianceManager
              as_user_id: "manager-1"
          assert:
            - "v_ref == \"VSD-000001\""
            - "Violation.${v_id}.status == \"CLOSED\""
            - "GET /compliance/audit-records?entity_type=Violation&entity_id=${v_id} returns event_types [VSD_SUBMITTED, VIOLATION_CLOSED] in created_at ASC order"

      - name: shipment_deliver_closes_order
        claim_type: side_effect_execution
        grounds: [state_machines.ExportOrder.RELEASED_to_CLOSED, state_machines.Shipment.IN_TRANSIT_to_DELIVERED]
        distinguishing_aspect: "Bubble-up: when the only shipment (qty == order qty) is DELIVERED, the parent order auto-transitions RELEASED -> CLOSED in the same request."
        test_recipe:
          setup: ["EAR99 product; clean party; NOT_REQUIRED order qty 2 -> CLEARED -> RELEASED; shipment qty 2 released and departed"]
          setup_api_calls:
            - call: "POST /compliance/products"
              payload: { sku: "P-017", name: "Knob", controlled_content_pct: 0, unit_value_cents: 10 }
              as: ComplianceAnalyst
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /compliance/classifications"
              payload: { product_id: "${p_id}", expected_product_version: "${p_v}", jurisdiction: "EAR", classification_code: "EAR99", determination_basis: "SELF_CLASSIFICATION" }
              as: ComplianceAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /compliance/classifications/${c_id}/submit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compliance/classifications/${c_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/parties"
              payload: { legal_name: "Porto Comercio LDA", country_code: "PRT", city: "Porto", party_type: "CUSTOMER" }
              as: TradeOpsSpecialist
              captures: { party_id: $.data.id }
            - call: "POST /compliance/orders"
              payload: { product_id: "${p_id}", party_id: "${party_id}", destination_country: "PRT", end_use: "CIVILIAN", quantity: 2 }
              as: TradeOpsSpecialist
              captures: { o_id: $.data.id }
            - call: "POST /compliance/orders/${o_id}/submit"
              payload: {}
              as: TradeOpsSpecialist
            - call: "POST /compliance/orders/${o_id}/release"
              payload: {}
              as: TradeOpsSpecialist
            - call: "POST /compliance/shipments"
              payload: { order_id: "${o_id}", quantity: 2, planned_ship_date: "2026-08-10" }
              as: TradeOpsSpecialist
              captures: { s_id: $.data.id }
            - call: "POST /compliance/shipments/${s_id}/screen"
              payload: {}
              as: TradeOpsSpecialist
            - call: "POST /compliance/shipments/${s_id}/release"
              payload: {}
              as: TradeOpsSpecialist
            - call: "POST /compliance/shipments/${s_id}/advance"
              payload: { event: "DEPART" }
              as: TradeOpsSpecialist
          trigger:
            - call: "POST /compliance/shipments/${s_id}/advance"
              payload: { event: "DELIVER" }
              as: TradeOpsSpecialist
          assert:
            - "Shipment.${s_id}.status == \"DELIVERED\""
            - "Order.${o_id}.status == \"CLOSED\" (all shipments terminal and delivered qty == order qty)"

      - name: tcp_suspend_reinstate_cycle
        claim_type: valid_transition
        grounds: [state_machines.TechnologyControlPlan.ACTIVE_to_SUSPENDED, state_machines.TechnologyControlPlan.SUSPENDED_to_ACTIVE]
        distinguishing_aspect: "TCP supports the ACTIVE -> SUSPENDED -> ACTIVE reinstate cycle via the same set-status endpoint."
        test_recipe:
          setup: ["EAR99 classified product; TCP enclave LAB-S in ACTIVE"]
          setup_api_calls:
            - call: "POST /compliance/products"
              payload: { sku: "P-018", name: "Lever", controlled_content_pct: 0, unit_value_cents: 10 }
              as: ComplianceAnalyst
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /compliance/classifications"
              payload: { product_id: "${p_id}", expected_product_version: "${p_v}", jurisdiction: "EAR", classification_code: "EAR99", determination_basis: "SELF_CLASSIFICATION" }
              as: ComplianceAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /compliance/classifications/${c_id}/submit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compliance/classifications/${c_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/tcps"
              payload: { name: "TCP-S", enclave_id: "LAB-S", product_id: "${p_id}", segregation_level: "LEVEL_1", effective_from: "2026-01-01", effective_to: "2027-01-01" }
              as: ComplianceAnalyst
              captures: { tcp_id: $.data.id }
            - call: "POST /compliance/tcps/${tcp_id}/set-status"
