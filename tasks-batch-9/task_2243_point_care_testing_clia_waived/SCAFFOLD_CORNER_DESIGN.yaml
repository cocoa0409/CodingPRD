            - "${status_after} == \"ACTIVE\" and ${reason_after} == null - only an oversight run converts overdue QC into a device lock"
            - "GET /poct/test-results?device_id=${dev_id} returns meta.total_count == 0"

      - name: manual_entry_gate_applies_only_when_entry_mode_is_manual
        claim_type: conditional_validation
        grounds:
          - validations[priority:66]
          - errors[ERR_MANUAL_ENTRY_NOT_PERMITTED]
          - entities.Device.fields.manual_entry_suspended
          - entities.TestSite.fields.manual_entry_blocked
        distinguishing_aspect: |
          Once three held results push the site to RESTRICTED, the MANUAL_ENTRY
          device is suspended for hand-keying: a MANUAL result on it is refused
          422 while an INTERFACED result on the SAME device in the same state is
          accepted 201. The gate is conditional on entry_mode, not on the device.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T08:00:00Z; everything happens on that date."
            - "Covered WAIVED site, trained operator, VERIFIED lot for GLUCO-9."
            - "Device D1 (INTERFACED) records LEVEL_1 and LEVEL_2 PASS (verifying the lot), then three patient results in PENDING_REVIEW, then a LEVEL_1 run at 200.0 which FAILS the 80.0/120.0 window: D1 goes QC_LOCKED with QC_FAILURE and CASCADE-A holds all three results, so held_result_count reaches 3 and the site turns RESTRICTED."
            - "Device D2 (MANUAL_ENTRY, qc_frequency_days 30, created 2026-08-01 so qc_next_due_at is 2026-08-01) picks up manual_entry_suspended true from CASCADE-A link 4 while remaining ACTIVE."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243033", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Surgical Day Unit POCT", department_code: "DEPT-2600", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2026-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Yara Costa", role_title: "MEDICAL_TECHNOLOGIST", hire_date: "2026-01-05" }
              as: ProgramAdmin
              captures: { op_id: $.data.id }
            - call: "POST /poct/operators/${op_id}/training"
              payload: { training_module_code: "POCT-GLUCO-101", completed_on: "2026-07-20" }
              as: QualityCoordinator
            - call: "POST /poct/devices"
              payload: { site_id: "${site_id}", device_model: "GLUCO-9", serial_number: "SN-GL-2601", analyte: "GLUCOSE", complexity_class: "WAIVED", connectivity_mode: "INTERFACED", qc_frequency_days: 30 }
              as: ProgramAdmin
              captures: { dev_1: $.data.id }
            - call: "POST /poct/devices"
              payload: { site_id: "${site_id}", device_model: "GLUCO-9", serial_number: "SN-GL-2602", analyte: "GLUCOSE", complexity_class: "WAIVED", connectivity_mode: "MANUAL_ENTRY", qc_frequency_days: 30 }
              as: ProgramAdmin
              captures: { dev_2: $.data.id }
            - call: "POST /poct/storage-units"
              payload: { site_id: "${site_id}", name: "Reagent Fridge 1", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: ProgramAdmin
              captures: { su_id: $.data.id }
            - call: "POST /poct/reagent-lots"
              payload: { site_id: "${site_id}", storage_unit_id: "${su_id}", device_model: "GLUCO-9", lot_number: "LOT-A1", expiration_date: "2027-01-31", received_at: "2026-08-01T08:00:00Z", control_min_level_1: 80.0, control_max_level_1: 120.0, control_min_level_2: 250.0, control_max_level_2: 350.0 }
              as: QualityCoordinator
              captures: { lot_id: $.data.id }
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev_1}", reagent_lot_id: "${lot_id}", operator_id: "${op_id}", control_level: "LEVEL_1", measured_value: 100.0 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { qc1_id: $.data.id }
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev_1}", reagent_lot_id: "${lot_id}", operator_id: "${op_id}", control_level: "LEVEL_2", measured_value: 300.0 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { qc2_id: $.data.id }
            - call: "POST /poct/reagent-lots/${lot_id}/verify"
              payload: { level_1_qc_run_id: "${qc1_id}", level_2_qc_run_id: "${qc2_id}" }
              as: QualityCoordinator
            - call: "POST /poct/test-results"
              payload: { device_id: "${dev_1}", operator_id: "${op_id}", reagent_lot_id: "${lot_id}", patient_mrn: "MRN-3301", analyte: "GLUCOSE", measured_value: 91.0, entry_mode: "INTERFACED" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { r1: $.data.id }
            - call: "POST /poct/test-results"
              payload: { device_id: "${dev_1}", operator_id: "${op_id}", reagent_lot_id: "${lot_id}", patient_mrn: "MRN-3302", analyte: "GLUCOSE", measured_value: 93.0, entry_mode: "INTERFACED" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { r2: $.data.id }
            - call: "POST /poct/test-results"
              payload: { device_id: "${dev_1}", operator_id: "${op_id}", reagent_lot_id: "${lot_id}", patient_mrn: "MRN-3303", analyte: "GLUCOSE", measured_value: 95.0, entry_mode: "INTERFACED" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { r3: $.data.id }
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev_1}", reagent_lot_id: "${lot_id}", operator_id: "${op_id}", control_level: "LEVEL_1", measured_value: 200.0 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { qc_fail_id: $.data.id, fail_result: $.data.result, fail_locked: $.data.locked_device }
            - call: "GET /poct/sites/${site_id}"
              as: QualityCoordinator
              captures: { held_now: $.data.held_result_count, posture_now: $.data.oversight_posture, blocked_now: $.data.manual_entry_blocked }
            - call: "GET /poct/devices/${dev_2}"
              as: QualityCoordinator
              captures: { d2_status: $.data.status, d2_suspended: $.data.manual_entry_suspended }
          trigger:
            - call: "POST /poct/test-results"
              payload: { device_id: "${dev_2}", operator_id: "${op_id}", reagent_lot_id: "${lot_id}", patient_mrn: "MRN-3304", analyte: "GLUCOSE", measured_value: 101.0, entry_mode: "MANUAL", manual_entry_reason: "gateway down" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { err_manual: $.data.error_id, msg_manual: $.data.message }
            - call: "POST /poct/test-results"
              payload: { device_id: "${dev_2}", operator_id: "${op_id}", reagent_lot_id: "${lot_id}", patient_mrn: "MRN-3305", analyte: "GLUCOSE", measured_value: 103.0, entry_mode: "INTERFACED" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { ok_id: $.data.id, ok_status: $.data.posting_status }
          assert:
            - "${fail_result} == \"FAIL\" and ${fail_locked} == true and Device.${dev_1}.qc_lock_reason == \"QC_FAILURE\""
            - "${held_now} == 3 and ${posture_now} == \"RESTRICTED\" and ${blocked_now} == true"
            - "${d2_status} == \"ACTIVE\" and ${d2_suspended} == true"
            - "the MANUAL request returns HTTP 422 with ${err_manual} == \"ERR_MANUAL_ENTRY_NOT_PERMITTED\" - the reason string does not rescue it"
            - "the INTERFACED request returns HTTP 201 with ${ok_status} == \"PENDING_REVIEW\""
            - "TestSite.${site_id}.held_result_count is still 3 - the new PENDING_REVIEW result on the ACTIVE device is not held"
            - "TestResult.${r1}.posting_status == HELD and .held_by_device_lock_at == \"2026-08-01T08:00:00.000Z\", same for ${r2} and ${r3}"

      - name: priority_ordering_between_certificate_expiry_and_complexity_scope
        claim_type: priority_ordering
        grounds:
          - validations[priority:57]
          - validations[priority:62]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / expired_certificate_preempts_complexity_scope_on_device_create
          rationale: "Both rules are violated by one device create there and the lower-priority error is asserted to be the one returned."

      - name: priority_conflict_between_stale_version_and_competency_methods
        claim_type: priority_conflict
        grounds:
          - validations[priority:30]
          - validations[priority:63]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / stale_version_preempts_insufficient_competency_methods_on_assessment_create
          rationale: "A single request violates priority 30 and priority 63 simultaneously there; the 412 wins."

      - name: cascading_validation_of_lot_verification_before_operator_access
        claim_type: cascading_validation
        grounds:
          - validations[priority:44]
          - validations[priority:52]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / unverified_lot_preempts_operator_access_lock_on_result_capture
          rationale: "That instance pins the order in which the lot check and the operator-access check run on one result capture."

      - name: aggregate_validation_of_open_deficiency_weight_thresholds
        claim_type: aggregate_validation
        grounds:
          - calculations.site_oversight_posture
          - entities.TestSite.fields.open_deficiency_weight
        excluded_because:
          difficulty_instance: boundary_precision_check / oversight_posture_walks_inclusive_weight_thresholds_six_and_sixteen
          rationale: "Individually acceptable findings whose SUM crosses 6.00 and then 16.00 are walked across both inclusive thresholds there."

  # ===========================================================================
  # Section 5 - Endpoints (claim-extraction-guide "From Table 5")
  # 69 endpoints. No bulk endpoint exists in §1.5, so the "Bulk action" row of the
  # guide has no applicable instance and is intentionally absent.
  # ===========================================================================
  - section: endpoints
    instances:

      - name: storage_unit_create_read_and_filtered_list_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /poct/storage-units]
          - endpoints[GET /poct/storage-units/{id}]
          - endpoints[GET /poct/storage-units]
          - endpoints[GET /poct/sites/{id}/storage-units]
        distinguishing_aspect: |
          The CRUD surface for StorageUnit is deliberately partial: create, read
          and two list routes exist but there is NO update and NO delete
          endpoint, so the round trip must be asserted through the read paths
          only, and the site_id filter must not leak the other site's unit.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z."
            - "Two sites; site A gets two storage units, site B gets one."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/sites"
              payload: { name: "Cardiology POCT", department_code: "DEPT-2700", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_a: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Oncology POCT", department_code: "DEPT-2701", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_b: $.data.id }
          trigger:
            - call: "POST /poct/storage-units"
              payload: { site_id: "${site_a}", name: "Fridge A1", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: ProgramAdmin
              captures: { su_a1: $.data.id, a1_state: $.data.excursion_state, a1_min: $.data.min_temp_c, a1_max: $.data.max_temp_c, a1_qcount: $.data.quarantined_lot_count, a1_created: $.data.created_at }
            - call: "POST /poct/storage-units"
              payload: { site_id: "${site_a}", name: "Freezer A2", min_temp_c: -25.0, max_temp_c: -15.0 }
              as: ProgramAdmin
              captures: { su_a2: $.data.id, a2_min: $.data.min_temp_c }
            - call: "POST /poct/storage-units"
              payload: { site_id: "${site_b}", name: "Fridge B1", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: ProgramAdmin
              captures: { su_b1: $.data.id }
            - call: "GET /poct/storage-units/${su_a1}"
              as: Operator
              captures: { read_id: $.data.id, read_name: $.data.name, read_site: $.data.site_id, read_min: $.data.min_temp_c, read_state: $.data.excursion_state, read_last: $.data.last_reading_c }
            - call: "GET /poct/storage-units?site_id=${site_a}"
              as: QualityCoordinator
              captures: { list_total: $.meta.total_count, list_more: $.meta.has_more, list_first: "$.data[0].id" }
            - call: "GET /poct/sites/${site_b}/storage-units"
              as: Surveyor
              captures: { sub_total: $.meta.total_count, sub_first: "$.data[0].id" }
          assert:
            - "each create returns HTTP 201 with ${a1_state} == \"IN_RANGE\", ${a1_qcount} == 0 and ${a1_created} == \"2026-09-01T08:00:00.000Z\""
            - "${a1_min} == 2.0, ${a1_max} == 8.0 and ${a2_min} == -25.0 (negative bands are legal)"
            - "the read returns HTTP 200 with ${read_id} == ${su_a1}, ${read_name} == \"Fridge A1\", ${read_site} == ${site_a}, ${read_min} == 2.0, ${read_state} == \"IN_RANGE\" and ${read_last} == null"
            - "${list_total} == 2 and ${list_more} == false; the returned ids are exactly {${su_a1}, ${su_a2}} as a set and ${su_b1} is absent"
            - "${sub_total} == 1 and ${sub_first} == ${su_b1}"
            - "§1.5 declares no PATCH and no DELETE route for StorageUnit: the only mutations are temperature-readings and excursion-resolution"

      - name: readiness_read_returns_every_penalty_term_and_matches_the_persisted_score
        claim_type: computed_read
        grounds:
          - endpoints[GET /poct/sites/{id}/readiness]
          - calculations.site_inspection_readiness_score
          - entities.TestSite.fields.inspection_readiness_score
        distinguishing_aspect: |
          The breakdown read must expose the four penalty terms separately AND
          agree with the persisted TestSite.inspection_readiness_score. Two terms
          are non-zero and the competency cap binds EXACTLY (100 * 1/1 * 0.25 =
          25.00 == COMPETENCY_PENALTY_CAP), while the qc term is 0.00 because a
          site with no device scores index 100.00 rather than 0.00.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z."
            - "Covered WAIVED site with exactly ONE operator who is never trained, so lapsed_or_locked_operator_count == total_operator_count == 1."
            - "No devices and no PT enrollments at the site."
            - "One issued CONDITION_LEVEL finding, no earlier closed finding of the same category, so weight = 8.0 * 1.0 = 8.00."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243034", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Wound Care POCT", department_code: "DEPT-2800", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2026-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Zoe Aldridge", role_title: "NURSE", hire_date: "2026-08-01" }
              as: ProgramAdmin
              captures: { op_id: $.data.id, op_access: $.data.access_status, op_reason: $.data.lockout_reason }
            - call: "POST /poct/inspections"
              payload: { site_id: "${site_id}", inspection_type: "ROUTINE_SURVEY", scheduled_date: "2026-09-01" }
              as: Surveyor
              captures: { insp_id: $.data.id }
            - call: "POST /poct/deficiencies"
              payload: { inspection_id: "${insp_id}", category: "PERSONNEL_COMPETENCY", severity: "CONDITION_LEVEL", description: "no competency record on file for the only testing operator", correction_due_date: "2026-10-01" }
              as: Surveyor
              captures: { def_id: $.data.id, def_weight_draft: $.data.weight }
            - call: "POST /poct/inspections/${insp_id}/issue"
              payload: { issued_on: "2026-09-01" }
              as: Surveyor
              captures: { issued_total: $.data.issued_weight_total, snap_score: $.data.readiness_score_at_issue }
          trigger:
            - call: "GET /poct/sites/${site_id}/readiness"
              as: Surveyor
              captures: { basis: $.data.basis, score: $.data.score, def_pen: $.data.deficiency_penalty, comp_pen: $.data.competency_penalty, qc_pen: $.data.qc_penalty, pt_pen: $.data.pt_penalty, weight: $.data.open_deficiency_weight, pt_count: $.data.pt_unsuccessful_count, index: $.data.site_qc_compliance_index, computed_at: $.data.computed_at }
            - call: "GET /poct/sites/${site_id}/readiness?basis=PRE_SURVEY_PROJECTED"
              as: Surveyor
              captures: { proj_basis: $.data.basis, proj_score: $.data.score, proj_weight: $.data.open_deficiency_weight }
            - call: "GET /poct/sites/${site_id}"
              as: QualityCoordinator
              captures: { persisted: $.data.inspection_readiness_score, posture: $.data.oversight_posture, site_weight: $.data.open_deficiency_weight, total_ops: $.data.total_operator_count, gap_ops: $.data.lapsed_or_locked_operator_count }
          assert:
            - "${op_access} == \"LOCKED_OUT\" and ${op_reason} == \"NEVER_TRAINED\"; ${def_weight_draft} == 0 while the finding is DRAFT"
            - "${issued_total} == 8.00 (CONDITION_LEVEL 8.0 x repeat_multiplier 1.0)"
            - "${basis} == \"AS_OF_ACTUAL\" and ${computed_at} == \"2026-09-01T08:00:00.000Z\""
            - "${def_pen} == 20.00 (round(8.00 * 2.5, 2), under the 50.00 cap)"
            - "${comp_pen} == 25.00 (100 * 1/1 * 0.25 == 25.00, the cap binds exactly)"
            - "${qc_pen} == 0.00 and ${index} == 100.00 - no non-RETIRED device means a perfect index, not a zero one"
            - "${pt_pen} == 0.00 and ${pt_count} == 0"
            - "${score} == 55.00 (100 - 20.00 - 25.00) and ${weight} == 8.00"
            - "${persisted} == 55.00 == ${score} and ${snap_score} == 55.00"
            - "${proj_basis} == \"PRE_SURVEY_PROJECTED\", ${proj_weight} == 8.00 and ${proj_score} == 55.00 - with no CORRECTION_SUBMITTED finding in flight the two bases agree"
            - "${posture} == \"RESTRICTED\" (weight 8.00 >= 6.0), ${site_weight} == 8.00, ${total_ops} == 1 and ${gap_ops} == 1"

      - name: qc_unlock_refused_when_lock_reason_is_certificate_scope
        claim_type: conditional_action
        grounds:
          - endpoints[POST /poct/devices/{id}/qc-unlock]
          - state_machines.Device.QC_LOCKED_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Every other qc-unlock precondition is satisfied - the confirming run is
          on this device, it PASSED, and its lot is VERIFIED - yet the action is
          refused because qc_lock_reason == CERTIFICATE_SCOPE. A scope violation
          is not clearable by quality control, only by re-certification.
        test_recipe:
          setup:
            - "Logical clock 2026-06-15T08:00:00Z at build time."
            - "MODERATE certificate CERTIFICATE_OF_COMPLIANCE effective 2026-01-01 expiring 2026-06-30 covers the site 2026-01-01..2026-06-30, so a MODERATE device CHEM-14 can be created (priority 62 passes)."
            - "LEVEL_1 and LEVEL_2 PASS runs on 2026-06-15 verify the lot; the LEVEL_2 run is kept as the confirming run."
            - "A second, WAIVED certificate covers 2026-07-02..2026-12-31 (non-touching, so no overlap collision), then the clock moves to 2026-07-05 where the MODERATE certificate has expired and the only in-window ACTIVE coverage permits WAIVED only."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
