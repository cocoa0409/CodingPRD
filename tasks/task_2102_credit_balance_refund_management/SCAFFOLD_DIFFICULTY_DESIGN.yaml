      - name: take_back_recoup_pool_conserved_across_offset_apply_and_reverse
        grounds:
          - entities.TakeBackNotice.fields.total_recoup_cents
          - entities.TakeBackNotice.fields.applied_cents
          - entities.TakeBackNotice.fields.remaining_unapplied_cents
          - state_machines.OffsetApplication.APPLIED_to_REVERSED
          - calculations.offset_waterfall_allocation
        distinguishing_aspect: |
          A different conserved quantity — the recoupment pool partition
          TakeBackNotice.total_recoup_cents == remaining_unapplied_cents +
          sum(OffsetApplication.applied_cents where state == APPLIED). It holds at
          10000 == 10000 + 0 before, 10000 == 0 + 10000 after the waterfall, and
          10000 == 3334 + 6666 after the last line is reversed.
        test_recipe:
          setup:
            - "The three-account waterfall fixture: a MEDICARE payer with take_back_allowed true, accounts OA1/OA2/OA3 created in that order with PAYER-attributed credits of 3333, 3333 and 5000 cents identified 2026-08-15."
            - "Take-back notice TB-1 for 10000 cents with admin_fee_cents 1000 recorded 2026-08-16 in state RECEIVED."
            - "One offset call applied the full pool as lines 3333 / 3333 / 3334, leaving the notice FULLY_APPLIED with remaining_unapplied_cents 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /payers"
              payload: { name: "Medicare Region A", payer_code: "MCR", payer_type: "MEDICARE", take_back_allowed: true }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { payer_med_id: "$.data.id" }
            - call: "POST /patient-accounts"
              payload: { account_number: "ACCT-OA1", mrn: "MRN-OA1", patient_name: "Otto Ames", guarantor_state_code: "CA", primary_payer_id: "${payer_med_id}", financial_class: "INPATIENT" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { acct_oa1_id: "$.data.id" }
            - call: "POST /patient-accounts"
              payload: { account_number: "ACCT-OA2", mrn: "MRN-OA2", patient_name: "Olive Ames", guarantor_state_code: "CA", primary_payer_id: "${payer_med_id}", financial_class: "INPATIENT" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { acct_oa2_id: "$.data.id" }
            - call: "POST /patient-accounts"
              payload: { account_number: "ACCT-OA3", mrn: "MRN-OA3", patient_name: "Omar Ames", guarantor_state_code: "CA", primary_payer_id: "${payer_med_id}", financial_class: "INPATIENT" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { acct_oa3_id: "$.data.id" }
            - call: "POST /patient-accounts/${acct_oa1_id}/transactions"
              payload: { txn_type: "CHARGE", amount_cents: 10000, source: "SYSTEM" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "POST /patient-accounts/${acct_oa2_id}/transactions"
              payload: { txn_type: "CHARGE", amount_cents: 10000, source: "SYSTEM" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "POST /patient-accounts/${acct_oa3_id}/transactions"
              payload: { txn_type: "CHARGE", amount_cents: 10000, source: "SYSTEM" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /patient-accounts/${acct_oa1_id}/transactions"
              payload: { txn_type: "PAYMENT", amount_cents: -13333, source: "PAYER", payer_id: "${payer_med_id}" }
              as: CreditAnalyst
