              as: Distributor
              as_user_id: "${dist2_id}"
              captures: { own6_id: $.data.id }
          assert:
            - "${own4_err} == ERR_NOT_RESOURCE_OWNER with HTTP 403 and no ALLOC-X1 row exists"
            - "${own5_id} is created with ${own5_dist} == ${dist_id} — PlantAdmin may allocate on behalf of any account"
            - "${own6_id} is created: the same Distributor may allocate for itself, so the refusal is about the mismatch and nothing else"

      - name: formulation_author_cannot_approve_their_own_recipe
        claim_type: segregation_of_duties_denial
