              as: ProjectAdmin
              captures: { site_id: $.data.id }
            - call: "POST /plants"
              payload: { site_id: "${site_id}", plant_code: "P1", receipt_point_code: "RP-7", receipt_point_mdq_dth_per_day: 4800.0, min_feed_scfm: 900.0 }
              as: ProjectAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /wells"
              payload: { site_id: "${site_id}", well_code: "W-01", target_flow_scfm: 500.0 }
              as: ProjectAdmin
              captures: { w1_id: $.data.id }
            - call: "POST /wells"
              payload: { site_id: "${site_id}", well_code: "W-02", target_flow_scfm: 500.0 }
              as: ProjectAdmin
              captures: { w2_id: $.data.id }
            - call: "POST /wells/${w1_id}/readings"
              payload: { taken_at: "2026-08-10T01:00:00Z", methane_pct: 55.0, oxygen_pct: 0.8, nitrogen_pct: 4.0, temperature_f: 118.0, flow_scfm: 480.0, vacuum_inhg: 22.5 }
              as: WellfieldTechnician
            - call: "POST /wells/${w2_id}/readings"
              payload: { taken_at: "2026-08-10T01:00:00Z", methane_pct: 55.0, oxygen_pct: 0.8, nitrogen_pct: 4.0, temperature_f: 118.0, flow_scfm: 470.0, vacuum_inhg: 22.5 }
              as: WellfieldTechnician
            - call: "POST /plants/${plant_id}/status"
              payload: { process_mode: "UPGRADING" }
              as: PlantOperator
          trigger:
            - call: "POST /injection-batches"
              payload: { plant_id: "${plant_id}", interval_start: "2026-08-10T02:00:00Z", interval_end: "2026-08-10T04:00:00Z", hourly_volumes_mscf: [110.0, 110.0], methane_pct: 94.0, oxygen_pct: 0.1, co2_pct: 1.4 }
              as: PlantOperator
              captures: { bo_id: $.data.id }
            - call: "POST /injection-batches/${bo_id}/status"
              payload: { to_status: "PENDING_ANALYSIS" }
              as: PlantOperator
            - call: "POST /plants/${plant_id}/status"
              payload: { process_mode: "FLARING" }
              as: PlantOperator
            - call: "POST /injection-batches/${bo_id}/status"
              payload: { to_status: "DIVERTED_TO_FLARE" }
              as: PlantOperator
            - call: "POST /plants/${plant_id}/status"
              payload: { spec_status: "QUARANTINE" }
              as: PlantOperator
            - call: "POST /plants/${plant_id}/status"
              payload: { spec_status: "ON_SPEC" }
              as: PlantOperator
          assert:
            - "InjectionBatch.${bo_id}.status == OFF_SPEC immediately after the PENDING_ANALYSIS call, with spec_failure_reason == LOW_METHANE"
            - "At that point ProcessingPlant.${plant_id}.spec_status == OFF_SPEC while process_mode is still UPGRADING"
            - "After the manual FLARING call ProcessingPlant.${plant_id}.process_mode == FLARING and spec_status is still OFF_SPEC"
            - "After the QUARANTINE call ProcessingPlant.${plant_id}.spec_status == QUARANTINE and process_mode is still FLARING"
            - "After the final call ProcessingPlant.${plant_id}.spec_status == ON_SPEC and process_mode == FLARING"
            - "InjectionBatch.${bo_id}.status == DIVERTED_TO_FLARE"

  - rule_id: transitive_cascade
    instances:
      - name: alarm_reading_cascades_well_site_plant_batch_nomination
        grounds:
          - state_machines.GasWell.ONLINE_to_ISOLATED
          - state_machines.ProcessingPlant.UPGRADING_to_FLARING
          - state_machines.InjectionBatch.ON_SPEC_to_DIVERTED_TO_FLARE
          - state_machines.PipelineNomination.CONFIRMED_to_CURTAILED
          - entities.LandfillSite.fields.collected_flow_scfm
          - entities.DowntimeEvent.fields.auto_generated
        distinguishing_aspect: |
          A depth-5 chain triggered by a single POST /wells/{id}/readings: the ALARM isolates the
          well (1), the isolation forces the site's collected_flow_scfm recompute (2), the
          recomputed flow falling under min_feed_scfm forces the plant UPGRADING -> FLARING and
          opens an auto_generated DowntimeEvent (3), the plant leaving UPGRADING diverts the
          in-flight NOMINATED batch to the flare (4), and the divert curtails the nomination it
          was attached to (5). Each hop is caused by the previous hop, not by the reading.
        test_recipe:
          setup:
            - "Producing site with two GasWells (collected_flow_scfm 950.0) and a plant with min_feed_scfm 900.0 in UPGRADING / ON_SPEC."
            - "One CONFIRMED PipelineNomination of 2400 dth and one InjectionBatch of gross_mmbtu 340.14 in status NOMINATED against it (committed_dth 340.14, delivered_dth 0)."
            - "LandfillSite energy ledger all zero; no DowntimeEvent exists."
