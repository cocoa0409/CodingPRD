      - name: publication_certification_enrolls_codification_and_holds_a_section_conflict
        grounds:
          - state_machines.PublicationNotice.ORDERED_to_PUBLISHED
          - state_machines.LegislativeInstrument.ADOPTED_to_PUBLISHED
          - state_machines.CodificationSubmission.PENDING_to_CONFLICT_HELD
          - entities.SupplementCycle.fields.conflict_count
          - calculations.instrument_effective_date
        distinguishing_aspect: |
          Certifying a newspaper publication reaches four hops into codification:
          hop 1 the notice becomes PUBLISHED, hop 2 the ordinance becomes
          PUBLISHED and picks the SUPPLEMENT_CERTIFIED basis with a NULL
          effective_date, hop 3 a CASCADE CodificationSubmission is auto-enrolled
          into the OPEN cycle selected by window containment (exempt from the
          client cap), and hop 4 that enrolment collides on 12.04.030 with a
          pre-existing CLIENT submission from a different instrument, driving
          BOTH rows to CONFLICT_HELD and incrementing the cycle's conflict_count.
        test_recipe:
          setup:
            - "CodeTitle 12 with an OPEN SupplementCycle 7 for the window 2026-10-01..2026-10-31."
            - "Ordinance A (CODE_AMENDMENT, section 12.04.030, 1200 characters) adopted at m1 (2026-09-15) and officialized when m1's minutes are approved at m2 (2026-10-06); its ORDINANCE_FULL_TEXT notice is ordered for 2026-10-07 and 2026-10-14."
