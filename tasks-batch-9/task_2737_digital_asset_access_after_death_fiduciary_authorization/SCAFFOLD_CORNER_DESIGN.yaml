              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { a1_access2: $.data.access_status, a1_disp2: $.data.disposition_status }
            - call: "POST /authority-grants/${grant_id}/transitions"
              payload: { action: "REVOKE", reason: "registrar suspended the letters" }
              as: CourtRegistrar
            - call: "GET /digital-assets/${a1_id}"
              payload: {}
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { a1_access3: $.data.access_status, a1_disp3: $.data.disposition_status }
            - call: "GET /estates/${est_id}"
              payload: {}
              as: Fiduciary
              as_user_id: "${fid1_id}"
