# =============================================================================
# task_2161 — Multiemployer (Taft-Hartley) Benefit Fund Administration
# Seed tables §1.0–§1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  desgin task harder than expert level.!!!!2161. Multiemployer (Taft-Hartley) Benefit Fund
  Administration: employer contribution report intake & hours crediting, delinquency
  identification, interest & liquidated damages, payroll audit program & underpayment recovery,
  participant eligibility banking hours & coverage months, pension credit accrual & vesting
  service, withdrawal liability calculation & payment schedule, trustee governance & bargaining
  party equal representation, reciprocity with sister funds

domain_name: multiemployer-taft-hartley-fund
api_prefix: ""

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint

  entity_topology: flat
  # Every entity is a peer addressed at its own top-level collection; parentage is
  # expressed exclusively through FK fields, never through nested URL paths.

  state_machine_shape: parallel
  # ContributionReport carries two independent state axes (filing_status x payment_status).
  # PayrollAudit is cyclic (FINDINGS_ISSUED -> IN_FIELDWORK rework loop).
  # WithdrawalAssessment and BoardMotion are branching fork-join.

  relationship_patterns:
    - one_to_many
    - many_to_many          # Trustee <-> BoardMotion through MotionVote
    - self_referential      # Employer.controlled_group_parent_employer_id, ContributionReport.amends_report_id
    - polymorphic           # BoardMotion.subject_ref_id resolved by subject_type
    - cross_aggregate       # BoardMotion outcome mutates DelinquencyAssessment / PayrollAudit / Fund

  role_model: segregation_of_duties
  # The PayrollAuditor who issues findings may not finalize them; the Trustee who moves a
  # motion may not vote on it; the Actuary who certifies may not demand payment.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Fund
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Legal name of the trust fund" }
      - { name: ein, type: string, source: input, description: "Employer Identification Number of the trust" }
      - { name: fund_role, type: enum, source: input, default: HOME, description: "HOME | SISTER — HOME is the fund this API administers; SISTER rows exist only as reciprocity counterparties", constraints: "HOME | SISTER" }
      - { name: plan_year_start_month, type: integer, source: input, default: 1, description: "Calendar month (1-12) on which the plan year begins", constraints: "1..12" }
      - { name: interest_rate_annual_bps, type: integer, source: input, description: "Annual delinquency interest rate in basis points", constraints: ">= 0" }
      - { name: ld_rate_bps, type: integer, source: input, description: "Statutory liquidated-damages rate in basis points", constraints: ">= 0" }
      - { name: ld_floor_cents, type: integer, source: input, description: "Minimum liquidated damages under the PLAN_SCHEDULE basis", constraints: ">= 0" }
      - { name: grace_days, type: integer, source: input, description: "Days after due_date before a report is swept DELINQUENT and before PLAN_SCHEDULE interest starts", constraints: ">= 0" }
      - { name: hours_per_coverage_month, type: integer, source: input, description: "Credited hours that purchase one CoverageMonth", constraints: ">= 1" }
      - { name: bank_cap_hours, type: number, source: input, description: "Maximum hours retainable in a Participant hour bank; excess is forfeited", constraints: ">= 0, 2 decimals" }
      - { name: max_advance_coverage_months, type: integer, source: input, description: "Maximum GRANTED CoverageMonth rows a Participant may hold beyond the current clock month", constraints: ">= 1" }
      - { name: eligibility_lag_months, type: integer, source: input, description: "Months between a work_period and the first CoverageMonth it can buy", constraints: ">= 0" }
      - { name: accrual_method, type: enum, source: input, description: "HOURS_BASED | ELAPSED_TIME — selects the pension_credit_accrual variant for every Participant of this fund", constraints: "HOURS_BASED | ELAPSED_TIME" }
      - { name: total_uvb_cents, type: integer, source: input, default: 0, description: "Unfunded vested benefit pool available for withdrawal-liability allocation", constraints: ">= 0" }
      - { name: pool_prior_year_contributions_cents, type: array, source: input, description: "Exactly 5 integers, oldest-first, of all-employer contributions for the 5 plan years preceding a withdrawal", constraints: "length == 5, each >= 0" }
      - { name: allocated_uvb_cents, type: integer, source: computed, default: 0, description: "Sum of WithdrawalAssessment.net_liability_cents over assessments of this fund's employers with status IN {CERTIFIED, DEMANDED, REVIEW_REQUESTED, PAYMENT_ACTIVE, ACCELERATED, SATISFIED}" }
      - { name: unallocated_uvb_cents, type: integer, source: computed, description: "= total_uvb_cents - allocated_uvb_cents; the pool a new allocation draws against" }
      - { name: reciprocity_agreement_status, type: enum, source: computed, default: NONE, description: "NONE | EXECUTED — flips to EXECUTED when a RECIPROCITY_AGREEMENT BoardMotion naming this fund carries", constraints: "NONE | EXECUTED" }
      - { name: active_union_trustees, type: integer, source: computed, default: 0, description: "Count of Trustee rows of this fund with appointing_party UNION and seat_status ACTIVE" }
      - { name: active_employer_trustees, type: integer, source: computed, default: 0, description: "Count of Trustee rows of this fund with appointing_party EMPLOYER and seat_status ACTIVE" }
      - { name: governance_posture, type: enum, source: computed, default: FROZEN, description: "OPEN | RESTRICTED | FROZEN — derived from trustee parity per calculations.governance_posture", constraints: "OPEN | RESTRICTED | FROZEN" }
      - { name: suspended_employer_count, type: integer, source: computed, default: 0, description: "Count of this fund's Employer rows with status SUSPENDED" }
      - { name: reciprocal_receipts_cents, type: integer, source: computed, default: 0, description: "Sum of ReciprocityTransfer.amount_cents with status ACCEPTED for participants of this fund" }
      - { name: collections_run_index, type: integer, source: system, default: 0, description: "Monotone counter incremented once per POST /funds/{id}/run-collections" }

  - name: Employer
    parent: null
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: input, description: "FK -> Fund.id; the HOME fund this employer contributes to" }
      - { name: legal_name, type: string, source: input, description: "Employer legal name" }
      - { name: ein, type: string, source: input, description: "Employer Identification Number" }
      - { name: contribution_rate_millicents_per_hour, type: integer, source: input, description: "CBA contribution rate expressed in millicents (1/1000 cent) per credited hour", constraints: ">= 1" }
      - { name: controlled_group_parent_employer_id, type: string, source: input, default: null, description: "FK -> Employer.id; null when this employer is not a controlled-group subsidiary" }
      - { name: prior_year_contributions_cents, type: array, source: input, description: "Exactly 5 integers, oldest-first, of this employer's contributions for the 5 plan years preceding a withdrawal", constraints: "length == 5, each >= 0" }
      - { name: prior_year_base_units, type: array, source: input, description: "Exactly 5 integers, oldest-first, of this employer's credited hours (contribution base units) for the same 5 plan years", constraints: "length == 5, each >= 0" }
      - { name: status, type: enum, source: computed, default: ACTIVE, description: "ACTIVE | SUSPENDED | WITHDRAWN", constraints: "ACTIVE | SUSPENDED | WITHDRAWN" }
      - { name: delinquency_strikes, type: integer, source: computed, default: 0, description: "Number of distinct ContributionReport rows this employer has had swept to payment_status DELINQUENT; reset to 0 when cumulative_delinquent_cents returns to 0" }
      - { name: cumulative_delinquent_cents, type: integer, source: computed, default: 0, description: "Employer money ledger; pinned by calculations.employer_delinquency_ledger" }

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: input, description: "FK -> Fund.id; the fund whose plans cover this participant" }
      - { name: full_name, type: string, source: input, description: "Participant full name" }
      - { name: ssn_last4, type: string, source: input, description: "Last four digits of the participant SSN", constraints: "exactly 4 digits" }
      - { name: credited_hours_total, type: number, source: computed, default: 0, description: "Sum of ContributionLine.hours over lines whose report.filing_status == POSTED; 2 decimals" }
      - { name: reciprocal_hours_total, type: number, source: computed, default: 0, description: "Sum of ReciprocityTransfer.hours over transfers of this participant with status ACCEPTED; 2 decimals" }
      - { name: hour_bank_hours, type: number, source: computed, default: 0, description: "Hours banked after coverage purchases, capped at Fund.bank_cap_hours; 2 decimals" }
      - { name: forfeited_hours_total, type: number, source: computed, default: 0, description: "Hours lost to the bank cap across the whole eligibility replay; 2 decimals" }
      - { name: coverage_through_month, type: string, source: computed, default: null, description: "Highest coverage_month (YYYY-MM) among this participant's CoverageMonth rows with status GRANTED; null when none" }
      - { name: eligibility_status, type: enum, source: computed, description: "ELIGIBLE | NOT_ELIGIBLE — derived on read: ELIGIBLE iff coverage_through_month is non-null and >= the logical clock's YYYY-MM", constraints: "ELIGIBLE | NOT_ELIGIBLE" }
      - { name: vesting_service_years, type: integer, source: computed, default: 0, description: "Count of PensionAccrual rows of this participant with vesting_year_earned == true" }
      - { name: total_pension_credits, type: number, source: computed, default: 0, description: "Sum of PensionAccrual.pension_credit over this participant's accrual rows; 2 decimals" }
      - { name: vested, type: boolean, source: computed, default: false, description: "= vesting_service_years >= VESTING_YEARS_REQUIRED (5)" }
      - { name: consecutive_break_years, type: integer, source: computed, default: 0, description: "Length of the current trailing run of FINALIZED PensionAccrual rows with break_in_service == true, in plan_year ASC order" }
      - { name: status, type: enum, source: computed, default: ACTIVE, description: "ACTIVE | BROKEN_SERVICE", constraints: "ACTIVE | BROKEN_SERVICE" }

  - name: ContributionReport
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id; the remitting employer" }
      - { name: work_period, type: string, source: input, description: "Month the hours were worked, YYYY-MM", constraints: "matches ^\\d{4}-(0[1-9]|1[0-2])$" }
      - { name: amends_report_id, type: string, source: input, default: null, description: "FK -> ContributionReport.id; the report this filing supersedes on posting, or null" }
      - { name: origin, type: enum, source: system, default: EMPLOYER, description: "EMPLOYER | AUDIT — AUDIT rows are minted by POST /payroll-audits/{id}/finalize", constraints: "EMPLOYER | AUDIT" }
      - { name: due_date, type: string, source: computed, description: "ISO date; the 20th day of the month following work_period" }
      - { name: total_hours_reported, type: number, source: computed, default: 0, description: "Sum of this report's ContributionLine.hours; 2 decimals" }
      - { name: total_contributions_due_cents, type: integer, source: computed, default: 0, description: "Sum of this report's ContributionLine.contribution_cents; pinned by calculations.contribution_due" }
      - { name: amount_remitted_cents, type: integer, source: computed, default: 0, description: "Cumulative cents remitted against this report" }
      - { name: filing_status, type: enum, source: computed, default: SUBMITTED, description: "Filing axis: SUBMITTED | POSTED | SUPERSEDED", constraints: "SUBMITTED | POSTED | SUPERSEDED" }
      - { name: payment_status, type: enum, source: computed, default: UNPAID, description: "Payment axis, independent of filing_status: UNPAID | PARTIAL | PAID_IN_FULL | DELINQUENT", constraints: "UNPAID | PARTIAL | PAID_IN_FULL | DELINQUENT" }
      - { name: posted_at, type: datetime, source: system, default: null, description: "Logical-clock instant at which filing_status became POSTED" }
      - { name: paid_in_full_at, type: datetime, source: system, default: null, description: "Logical-clock instant at which payment_status became PAID_IN_FULL" }

  - name: ContributionLine
    parent: null
    common_fields: false
    fields:
      - { name: report_id, type: string, source: system, description: "FK -> ContributionReport.id; owning report" }
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; the worker whose hours this line reports" }
      - { name: hours, type: number, source: input, description: "Credited hours for this participant in the report's work_period; 2 decimals", constraints: ">= 0" }
      - { name: gross_wages_cents, type: integer, source: input, description: "Gross wages paid, retained for payroll-audit comparison", constraints: ">= 0" }
      - { name: work_classification, type: enum, source: input, description: "JOURNEYMAN | APPRENTICE | FOREMAN — selects the rate multiplier", constraints: "JOURNEYMAN | APPRENTICE | FOREMAN" }
      - { name: contribution_cents, type: integer, source: computed, description: "Per-line contribution, rounded once at line level; see calculations.contribution_due" }

  - name: DelinquencyAssessment
    parent: null
    common_fields: true
    fields:
      - { name: report_id, type: string, source: system, description: "FK -> ContributionReport.id; the delinquent report assessed" }
      - { name: basis, type: enum, source: input, description: "STATUTORY | PLAN_SCHEDULE — selects the delinquency_charges variant", constraints: "STATUTORY | PLAN_SCHEDULE" }
      - { name: assessed_on, type: string, source: system, description: "ISO date taken from the logical clock at assessment time" }
      - { name: days_late, type: integer, source: computed, description: "Whole days from report.due_date to assessed_on, floor, never below 0" }
      - { name: principal_cents, type: integer, source: computed, description: "= report.total_contributions_due_cents - report.amount_remitted_cents at assessment time" }
      - { name: interest_cents, type: integer, source: computed, description: "Interest component; see calculations.delinquency_charges" }
      - { name: liquidated_damages_cents, type: integer, source: computed, description: "Liquidated-damages component; see calculations.delinquency_charges" }
      - { name: total_cents, type: integer, source: computed, description: "= principal_cents + interest_cents + liquidated_damages_cents" }
      - { name: status, type: enum, source: computed, default: ASSESSED, description: "ASSESSED | SETTLED | WAIVED", constraints: "ASSESSED | SETTLED | WAIVED" }
      - { name: settlement_amount_cents, type: integer, source: system, default: null, description: "Cents accepted in settlement; null unless status == SETTLED" }
      - { name: waived_cents, type: integer, source: system, default: null, description: "Cents removed from the employer ledger by a carried LD_WAIVER motion; null unless status == WAIVED" }

  - name: PayrollAudit
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id; the employer under audit" }
      - { name: auditor_user_id, type: string, source: system, description: "Opaque X-User-ID of the PayrollAuditor who opened the audit" }
      - { name: period_start_month, type: string, source: input, description: "First month of the audited window, YYYY-MM, inclusive", constraints: "matches ^\\d{4}-(0[1-9]|1[0-2])$" }
      - { name: period_end_month, type: string, source: input, description: "Last month of the audited window, YYYY-MM, inclusive", constraints: ">= period_start_month" }
      - { name: findings, type: array, source: input, default: [], description: "Latest issued findings: objects { participant_id, work_period, unreported_hours }" }
      - { name: round_count, type: integer, source: computed, default: 1, description: "Fieldwork rounds consumed; incremented each time a DISPUTE response returns the audit to IN_FIELDWORK" }
      - { name: unreported_hours_found, type: number, source: computed, default: 0, description: "Sum of findings[].unreported_hours; 2 decimals" }
      - { name: underpayment_principal_cents, type: integer, source: computed, default: 0, description: "Per-finding JOURNEYMAN contribution rounded at finding level then summed; see calculations.audit_underpayment" }
      - { name: resulting_report_id, type: string, source: system, default: null, description: "FK -> ContributionReport.id; the AUDIT-origin report minted at finalize, null before" }
      - { name: status, type: enum, source: computed, default: IN_FIELDWORK, description: "IN_FIELDWORK | FINDINGS_ISSUED | EMPLOYER_ACCEPTED | CLOSED | ABANDONED", constraints: "IN_FIELDWORK | FINDINGS_ISSUED | EMPLOYER_ACCEPTED | CLOSED | ABANDONED" }

  - name: CoverageMonth
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; covered worker" }
      - { name: coverage_month, type: string, source: system, description: "Month of welfare coverage purchased, YYYY-MM" }
      - { name: granting_report_id, type: string, source: system, default: null, description: "FK -> ContributionReport.id; the POSTED report whose replay step granted this month, null when source is RECIPROCAL" }
      - { name: source, type: enum, source: system, description: "CURRENT_HOURS | BANK_DRAW | RECIPROCAL", constraints: "CURRENT_HOURS | BANK_DRAW | RECIPROCAL" }
      - { name: hours_applied, type: number, source: system, description: "Hours consumed to purchase this month; equals Fund.hours_per_coverage_month" }
      - { name: status, type: enum, source: computed, default: GRANTED, description: "GRANTED | REVOKED — every GRANTED row is REVOKED at the start of an eligibility replay", constraints: "GRANTED | REVOKED" }

  - name: PensionAccrual
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; accruing worker" }
      - { name: plan_year, type: integer, source: system, description: "Plan year this accrual row covers" }
      - { name: hours_credited, type: number, source: computed, default: 0, description: "ContributionLine hours on POSTED reports whose work_period falls in this plan year; 2 decimals" }
      - { name: reciprocal_hours_credited, type: number, source: computed, default: 0, description: "ACCEPTED ReciprocityTransfer hours with work_period in this plan year; 2 decimals" }
      - { name: pension_credit, type: number, source: computed, default: 0, description: "Benefit accrual fraction for the year; see calculations.pension_credit_accrual", constraints: "0.00 .. 1.00" }
      - { name: vesting_year_earned, type: boolean, source: computed, default: false, description: "Whether this plan year counts as a year of vesting service" }
      - { name: break_in_service, type: boolean, source: computed, default: false, description: "Whether this plan year is a one-year break in service" }
      - { name: accrual_status, type: enum, source: computed, default: OPEN, description: "OPEN | FINALIZED — flipped by run-collections once the plan year has fully elapsed", constraints: "OPEN | FINALIZED" }

  - name: WithdrawalAssessment
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id; the withdrawing employer" }
      - { name: withdrawal_date, type: string, source: input, description: "ISO date of the complete withdrawal" }
      - { name: method, type: enum, source: input, description: "PRESUMPTIVE | ROLLING_FIVE — selects the withdrawal_liability_allocation variant", constraints: "PRESUMPTIVE | ROLLING_FIVE" }
      - { name: employer_share_fraction, type: number, source: computed, description: "Allocation fraction rounded to 10 decimal places, round_half_up" }
      - { name: raw_allocation_cents, type: integer, source: computed, description: "Pre-de-minimis share of the fund's unallocated UVB pool" }
      - { name: de_minimis_reduction_cents, type: integer, source: computed, description: "ERISA 4209 de-minimis reduction after phase-out" }
      - { name: net_liability_cents, type: integer, source: computed, description: "= raw_allocation_cents - de_minimis_reduction_cents; the amount charged against the UVB pool" }
      - { name: annual_payment_cents, type: integer, source: computed, description: "Level annual installment; see calculations.withdrawal_payment_schedule" }
      - { name: schedule_years, type: integer, source: computed, description: "Number of installments, capped at 20" }
      - { name: twenty_year_cap_applied, type: boolean, source: computed, default: false, description: "True when the uncapped schedule exceeded 20 years" }
      - { name: capped_liability_cents, type: integer, source: computed, description: "Total scheduled to be collected; = annual_payment_cents * 20 when capped, else net_liability_cents" }
      - { name: accelerated_balance_cents, type: integer, source: computed, default: null, description: "Unpaid installment principal accelerated on default; null unless status == ACCELERATED" }
      - { name: certified_by_user_id, type: string, source: system, default: null, description: "Opaque X-User-ID of the Actuary who certified" }
      - { name: demanded_on, type: string, source: system, default: null, description: "ISO date of the payment demand, taken from the logical clock" }
      - { name: review_grounds, type: string, source: system, default: null, description: "Employer grounds text captured at review-request" }
      - { name: status, type: enum, source: computed, default: DRAFT, description: "DRAFT | CERTIFIED | DEMANDED | REVIEW_REQUESTED | PAYMENT_ACTIVE | ACCELERATED | SATISFIED", constraints: "DRAFT | CERTIFIED | DEMANDED | REVIEW_REQUESTED | PAYMENT_ACTIVE | ACCELERATED | SATISFIED" }

  - name: PaymentInstallment
    parent: null
    common_fields: true
    fields:
      - { name: assessment_id, type: string, source: system, description: "FK -> WithdrawalAssessment.id; owning assessment" }
      - { name: installment_number, type: integer, source: system, description: "1-based position in the schedule" }
      - { name: due_date, type: string, source: system, description: "ISO date; = demanded_on + 60 days + (installment_number - 1) * 365 days" }
      - { name: amount_cents, type: integer, source: system, description: "Scheduled amount; annual_payment_cents for all but the final installment" }
      - { name: status, type: enum, source: computed, default: SCHEDULED, description: "SCHEDULED | PAID | MISSED | DEFAULTED", constraints: "SCHEDULED | PAID | MISSED | DEFAULTED" }
      - { name: paid_on, type: string, source: system, default: null, description: "ISO date of payment, null while unpaid" }

  - name: Trustee
    parent: null
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: input, description: "FK -> Fund.id; the board this trustee sits on" }
      - { name: full_name, type: string, source: input, description: "Trustee full name" }
      - { name: appointing_party, type: enum, source: input, description: "UNION | EMPLOYER — the bargaining party that appointed this trustee", constraints: "UNION | EMPLOYER" }
      - { name: term_expires_on, type: string, source: input, description: "ISO date on which the appointment lapses" }
      - { name: seat_status, type: enum, source: input, default: ACTIVE, description: "ACTIVE | RESIGNED", constraints: "ACTIVE | RESIGNED" }

  - name: BoardMotion
    parent: null
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: input, description: "FK -> Fund.id; the board considering the motion" }
      - { name: moved_by_trustee_id, type: string, source: system, description: "FK -> Trustee.id; taken from X-User-ID of the moving Trustee" }
      - { name: subject_type, type: enum, source: input, description: "LD_WAIVER | AUDIT_SETTLEMENT | RECIPROCITY_AGREEMENT", constraints: "LD_WAIVER | AUDIT_SETTLEMENT | RECIPROCITY_AGREEMENT" }
      - { name: subject_ref_id, type: string, source: input, description: "Polymorphic reference resolved by subject_type: DelinquencyAssessment.id for LD_WAIVER, PayrollAudit.id for AUDIT_SETTLEMENT, Fund.id (fund_role SISTER) for RECIPROCITY_AGREEMENT. Deliberately not a declared foreign key." }
      - { name: union_bloc_position, type: enum, source: computed, default: null, description: "FOR | AGAINST | TIED — union bargaining party's bloc position at tally", constraints: "FOR | AGAINST | TIED" }
      - { name: employer_bloc_position, type: enum, source: computed, default: null, description: "FOR | AGAINST | TIED — employer bargaining party's bloc position at tally", constraints: "FOR | AGAINST | TIED" }
      - { name: tallied_on, type: string, source: system, default: null, description: "ISO date of the tally, from the logical clock" }
      - { name: arbitration_award, type: enum, source: system, default: null, description: "CARRIED | FAILED — neutral arbitrator's award used to break a deadlock", constraints: "CARRIED | FAILED" }
      - { name: status, type: enum, source: computed, default: OPEN, description: "OPEN | CARRIED | FAILED | DEADLOCKED | ARBITRATION_CARRIED | ARBITRATION_FAILED", constraints: "OPEN | CARRIED | FAILED | DEADLOCKED | ARBITRATION_CARRIED | ARBITRATION_FAILED" }

  - name: MotionVote
    parent: null
    common_fields: false
    fields:
      - { name: motion_id, type: string, source: input, description: "FK -> BoardMotion.id; the motion voted on" }
      - { name: trustee_id, type: string, source: system, description: "FK -> Trustee.id; taken from X-User-ID of the voting Trustee" }
      - { name: position, type: enum, source: input, description: "FOR | AGAINST | ABSTAIN", constraints: "FOR | AGAINST | ABSTAIN" }

  - name: ReciprocityTransfer
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; the travelling worker" }
      - { name: sister_fund_id, type: string, source: input, description: "FK -> Fund.id; the sending fund, which must have fund_role SISTER" }
      - { name: transfer_type, type: enum, source: input, description: "MONEY_FOLLOWS_MAN | PRO_RATA — PRO_RATA hours additionally feed PensionAccrual", constraints: "MONEY_FOLLOWS_MAN | PRO_RATA" }
      - { name: work_period, type: string, source: input, description: "Month the travelling hours were worked, YYYY-MM", constraints: "matches ^\\d{4}-(0[1-9]|1[0-2])$" }
      - { name: hours, type: number, source: input, description: "Hours being transferred in; 2 decimals", constraints: ">= 0" }
      - { name: amount_cents, type: integer, source: input, description: "Money accompanying the hours", constraints: ">= 0" }
      - { name: applied_coverage_months, type: integer, source: computed, default: 0, description: "CoverageMonth rows this transfer purchased on acceptance" }
      - { name: status, type: enum, source: computed, default: PENDING, description: "PENDING | ACCEPTED | REJECTED", constraints: "PENDING | ACCEPTED | REJECTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  # ContributionReport carries TWO independent state axes. A report may be
  # SUPERSEDED while still UNPAID, or PAID_IN_FULL while still SUBMITTED.
  # ---------------------------------------------------------------------------
  - entity: ContributionReport
    dimension: filing_status
    initial_state: SUBMITTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: POSTED
        trigger: "POST /contribution-reports/{id}/post"
        actor: FundAdministrator
        preconditions:
          - "filing_status == SUBMITTED"
          - "the report has at least one ContributionLine"
          - "Employer.status != WITHDRAWN"
          - "if amends_report_id is non-null: that report exists, its filing_status == POSTED, its employer_id == this report's employer_id, and its work_period == this report's work_period"
        side_effects:
          - "posted_at := logical clock instant; filing_status := POSTED"
          - "CASCADE HOP 1 — if amends_report_id is non-null, the referenced report's filing_status := SUPERSEDED"
          - "CASCADE HOP 2 — for every Participant appearing on this report OR on the report just superseded, run calculations.participant_eligibility_replay: Participant.credited_hours_total, hour_bank_hours, forfeited_hours_total are rewritten and every previously GRANTED CoverageMonth of that participant is set to REVOKED before new GRANTED rows are minted"
          - "CASCADE HOP 3 — the CoverageMonth rows minted in hop 2 rewrite Participant.coverage_through_month to the highest GRANTED coverage_month (null when the replay granted none)"
          - "CASCADE HOP 4 — the coverage_through_month written in hop 3 changes Participant.eligibility_status, which is derived on read as ELIGIBLE iff coverage_through_month >= the logical clock's YYYY-MM"
          - "for every affected Participant, PensionAccrual rows for each touched plan_year are recomputed (hours_credited, pension_credit, vesting_year_earned, break_in_service), then Participant.vesting_service_years, total_pension_credits and vested are rewritten"
          - "Employer.cumulative_delinquent_cents recomputed per calculations.employer_delinquency_ledger"
          - "increments ContributionReport.version by 1"
        note: "Posting is independent of payment_status; a report may be POSTED while UNPAID."

      - from: POSTED
        to: SUPERSEDED
        trigger: "system — a later report whose amends_report_id names this row is posted"
        actor: system
        preconditions:
          - "filing_status == POSTED"
        side_effects:
          - "filing_status := SUPERSEDED; the row's ContributionLine hours leave every downstream aggregate because the eligibility replay and PensionAccrual recompute only read lines whose report.filing_status == POSTED"
          - "increments ContributionReport.version by 1"

  - entity: ContributionReport
    dimension: payment_status
    initial_state: UNPAID
    terminal_states: []
    transitions:
      - from: UNPAID
        to: PARTIAL
        trigger: "POST /contribution-reports/{id}/remit"
        actor: ContributingEmployer
        preconditions:
          - "filing_status != SUPERSEDED"
          - "0 < amount_cents < total_contributions_due_cents - amount_remitted_cents"
        side_effects:
          - "amount_remitted_cents += amount_cents"
          - "Employer.cumulative_delinquent_cents recomputed"
          - "increments ContributionReport.version by 1"
      - from: UNPAID
        to: PAID_IN_FULL
        trigger: "POST /contribution-reports/{id}/remit"
        actor: ContributingEmployer
        preconditions:
          - "filing_status != SUPERSEDED"
          - "amount_cents == total_contributions_due_cents - amount_remitted_cents"
        side_effects:
          - "amount_remitted_cents := total_contributions_due_cents; paid_in_full_at := logical clock instant"
          - "Employer.cumulative_delinquent_cents recomputed; if it reaches 0 and Employer.status == SUSPENDED then Employer.status := ACTIVE and delinquency_strikes := 0 and Fund.suspended_employer_count recomputed"
          - "increments ContributionReport.version by 1"
      - from: PARTIAL
        to: PAID_IN_FULL
        trigger: "POST /contribution-reports/{id}/remit"
        actor: ContributingEmployer
        preconditions:
          - "filing_status != SUPERSEDED"
          - "amount_cents == total_contributions_due_cents - amount_remitted_cents"
        side_effects:
          - "amount_remitted_cents := total_contributions_due_cents; paid_in_full_at := logical clock instant"
          - "Employer.cumulative_delinquent_cents recomputed"
      - from: UNPAID
        to: DELINQUENT
        trigger: "POST /funds/{id}/run-collections (sweep 1)"
        actor: system
        preconditions:
          - "payment_status IN {UNPAID, PARTIAL}"
          - "filing_status != SUPERSEDED"
          - "clock_date > due_date + Fund.grace_days"
        side_effects:
          - "CASCADE HOP 1 — payment_status := DELINQUENT"
          - "CASCADE HOP 2 — because this report flipped, Employer.delinquency_strikes += 1 and Employer.cumulative_delinquent_cents is recomputed"
          - "CASCADE HOP 3 — because delinquency_strikes reached DELINQUENCY_STRIKE_LIMIT (3), Employer.status := SUSPENDED"
          - "CASCADE HOP 4 — because an employer flipped to SUSPENDED, Fund.suspended_employer_count is recomputed"
      - from: PARTIAL
        to: DELINQUENT
        trigger: "POST /funds/{id}/run-collections (sweep 1)"
        actor: system
        preconditions:
          - "clock_date > due_date + Fund.grace_days"
        side_effects:
          - "same four-hop chain as UNPAID -> DELINQUENT"
      - from: DELINQUENT
        to: PAID_IN_FULL
        trigger: "POST /contribution-reports/{id}/remit"
        actor: ContributingEmployer
        preconditions:
          - "filing_status != SUPERSEDED"
          - "amount_cents == total_contributions_due_cents - amount_remitted_cents"
        side_effects:
          - "amount_remitted_cents := total_contributions_due_cents; paid_in_full_at := logical clock instant"
          - "Employer.cumulative_delinquent_cents recomputed; if it reaches 0 and Employer.status == SUSPENDED then Employer.status := ACTIVE, delinquency_strikes := 0, Fund.suspended_employer_count recomputed"
        note: "The payment axis is cyclic: a report can leave DELINQUENT and return to it after a later amendment raises the amount due."

  - entity: PayrollAudit
    initial_state: IN_FIELDWORK
    terminal_states: [CLOSED, ABANDONED]
    transitions:
      - from: IN_FIELDWORK
        to: FINDINGS_ISSUED
        trigger: "POST /payroll-audits/{id}/findings with a non-empty findings array"
        actor: PayrollAuditor
        preconditions:
          - "status == IN_FIELDWORK"
          - "X-User-ID == PayrollAudit.auditor_user_id"
          - "every findings[].participant_id resolves to a Participant whose fund_id == Employer.fund_id"
          - "every findings[].work_period lies within [period_start_month, period_end_month] inclusive"
        side_effects:
          - "findings := payload; unreported_hours_found and underpayment_principal_cents recomputed per calculations.audit_underpayment"
      - from: IN_FIELDWORK
        to: ABANDONED
        trigger: "POST /payroll-audits/{id}/findings with an empty findings array"
        actor: PayrollAuditor
        preconditions:
          - "status == IN_FIELDWORK"
          - "X-User-ID == PayrollAudit.auditor_user_id"
        side_effects:
          - "findings := []; unreported_hours_found := 0; underpayment_principal_cents := 0; status := ABANDONED"
        note: "An audit that finds no exceptions closes without a recovery report; its period no longer blocks a future audit."
      - from: FINDINGS_ISSUED
        to: IN_FIELDWORK
        trigger: "POST /payroll-audits/{id}/respond with response DISPUTE"
        actor: ContributingEmployer
        preconditions:
          - "status == FINDINGS_ISSUED"
          - "X-User-ID == PayrollAudit.employer_id"
          - "round_count < MAX_AUDIT_ROUNDS (3)"
        side_effects:
          - "round_count += 1; findings := []; unreported_hours_found := 0; underpayment_principal_cents := 0"
        note: "Cycle: the audit returns to fieldwork and the auditor must re-issue findings."
      - from: FINDINGS_ISSUED
        to: EMPLOYER_ACCEPTED
        trigger: "POST /payroll-audits/{id}/respond with response ACCEPT"
        actor: ContributingEmployer
        preconditions:
          - "status == FINDINGS_ISSUED"
          - "X-User-ID == PayrollAudit.employer_id"
        side_effects:
          - "status := EMPLOYER_ACCEPTED"
      - from: EMPLOYER_ACCEPTED
        to: CLOSED
        trigger: "POST /payroll-audits/{id}/finalize"
        actor: FundAdministrator
        preconditions:
          - "status == EMPLOYER_ACCEPTED"
          - "a BoardMotion of this fund exists with subject_type == AUDIT_SETTLEMENT, subject_ref_id == this audit id, and status IN {CARRIED, ARBITRATION_CARRIED}"
          - "X-User-ID != PayrollAudit.auditor_user_id (segregation of duties)"
        side_effects:
          - "CASCADE HOP 1 — a ContributionReport is minted with origin AUDIT, employer_id = this audit's employer, work_period = period_end_month, amends_report_id = null, filing_status = POSTED, payment_status = UNPAID, and one ContributionLine per finding (participant_id, hours = unreported_hours, gross_wages_cents = 0, work_classification = JOURNEYMAN); PayrollAudit.resulting_report_id := that report id"
          - "CASCADE HOP 2 — because that report is POSTED, its lines enter calculations.participant_eligibility_replay for every finding participant, rewriting Participant.credited_hours_total and hour_bank_hours"
          - "CASCADE HOP 3 — because the replay in hop 2 produced additional whole coverage months, new GRANTED CoverageMonth rows are minted and Participant.coverage_through_month advances"
          - "CASCADE HOP 4 — because coverage_through_month advanced past the logical clock month, Participant.eligibility_status reads ELIGIBLE where it previously read NOT_ELIGIBLE"
          - "Employer.cumulative_delinquent_cents recomputed to include the new UNPAID audit report"
          - "PensionAccrual rows for the touched plan_year are recomputed"

  - entity: WithdrawalAssessment
    initial_state: DRAFT
    terminal_states: [SATISFIED, ACCELERATED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /withdrawal-assessments/{id}/certify"
        actor: Actuary
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "certified_by_user_id := X-User-ID"
          - "Fund.allocated_uvb_cents += net_liability_cents and Fund.unallocated_uvb_cents recomputed"
          - "increments Fund.version by 1"
      - from: CERTIFIED
        to: DEMANDED
        trigger: "POST /withdrawal-assessments/{id}/demand"
        actor: FundAdministrator
        preconditions:
          - "status == CERTIFIED"
          - "Fund.governance_posture != FROZEN"
          - "annual_payment_cents > 0"
        side_effects:
          - "demanded_on := logical clock date"
          - "schedule_years PaymentInstallment rows are minted with status SCHEDULED per calculations.withdrawal_payment_schedule"
      - from: DEMANDED
        to: REVIEW_REQUESTED
        trigger: "POST /withdrawal-assessments/{id}/review-request"
        actor: ContributingEmployer
        preconditions:
          - "status == DEMANDED"
          - "X-User-ID == WithdrawalAssessment.employer_id"
        side_effects:
          - "review_grounds := payload grounds"
      - from: DEMANDED
        to: PAYMENT_ACTIVE
        trigger: "system — the first PaymentInstallment of this assessment reaches status PAID"
        actor: system
        preconditions:
          - "status == DEMANDED"
        side_effects:
          - "status := PAYMENT_ACTIVE"
      - from: REVIEW_REQUESTED
        to: PAYMENT_ACTIVE
        trigger: "POST /withdrawal-assessments/{id}/review-decision with decision UPHELD"
        actor: FundAdministrator
        preconditions:
          - "status == REVIEW_REQUESTED"
        side_effects:
          - "status := PAYMENT_ACTIVE; the existing PaymentInstallment schedule is untouched"
        note: "Branch join — both review branches converge on PAYMENT_ACTIVE."
      - from: REVIEW_REQUESTED
        to: CERTIFIED
        trigger: "POST /withdrawal-assessments/{id}/review-decision with decision REVISED and revised_total_uvb_cents"
        actor: FundAdministrator
        preconditions:
          - "status == REVIEW_REQUESTED"
          - "revised_total_uvb_cents is present and >= 0"
        side_effects:
          - "Fund.allocated_uvb_cents -= the assessment's current net_liability_cents (compensating step)"
          - "Fund.total_uvb_cents := revised_total_uvb_cents; Fund.unallocated_uvb_cents recomputed"
          - "the whole allocation is recomputed against the new pool (employer_share_fraction, raw_allocation_cents, de_minimis_reduction_cents, net_liability_cents, annual_payment_cents, schedule_years, twenty_year_cap_applied, capped_liability_cents)"
          - "Fund.allocated_uvb_cents += the new net_liability_cents"
          - "every PaymentInstallment of this assessment with status SCHEDULED is deleted; demanded_on := null"
          - "increments Fund.version by 1"
      - from: PAYMENT_ACTIVE
        to: SATISFIED
        trigger: "system — the final PaymentInstallment reaches status PAID"
        actor: system
        preconditions:
          - "every PaymentInstallment of this assessment has status PAID"
        side_effects:
          - "status := SATISFIED"
      - from: DEMANDED
        to: ACCELERATED
        trigger: "POST /funds/{id}/run-collections (sweep 2)"
        actor: system
        preconditions:
          - "a PaymentInstallment of this assessment moved MISSED -> DEFAULTED in this run"
        side_effects:
          - "accelerated_balance_cents := sum of amount_cents over this assessment's installments with status IN {SCHEDULED, MISSED, DEFAULTED}"
          - "Employer.status := SUSPENDED; Fund.suspended_employer_count recomputed"
      - from: PAYMENT_ACTIVE
        to: ACCELERATED
        trigger: "POST /funds/{id}/run-collections (sweep 2)"
        actor: system
        preconditions:
          - "a PaymentInstallment of this assessment moved MISSED -> DEFAULTED in this run"
        side_effects:
          - "same as DEMANDED -> ACCELERATED"

  - entity: PaymentInstallment
    initial_state: SCHEDULED
    terminal_states: [PAID, DEFAULTED]
    transitions:
      - from: SCHEDULED
        to: PAID
        trigger: "POST /payment-installments/{id}/pay"
        actor: ContributingEmployer
        preconditions:
          - "status IN {SCHEDULED, MISSED}"
          - "X-User-ID == the owning WithdrawalAssessment's employer_id"
          - "amount_cents == PaymentInstallment.amount_cents"
          - "the owning assessment's status IN {DEMANDED, PAYMENT_ACTIVE}"
        side_effects:
          - "paid_on := logical clock date"
          - "if the owning assessment was DEMANDED, it moves to PAYMENT_ACTIVE"
          - "if every installment of the assessment is now PAID, the assessment moves to SATISFIED"
      - from: MISSED
        to: PAID
        trigger: "POST /payment-installments/{id}/pay"
        actor: ContributingEmployer
        preconditions:
          - "status == MISSED"
          - "clock_date <= due_date + CURE_DAYS (60)"
          - "amount_cents == PaymentInstallment.amount_cents"
        side_effects:
          - "same as SCHEDULED -> PAID"
      - from: SCHEDULED
        to: MISSED
        trigger: "POST /funds/{id}/run-collections (sweep 2)"
        actor: system
        preconditions:
          - "clock_date > due_date"
        side_effects:
          - "status := MISSED"
      - from: MISSED
        to: DEFAULTED
        trigger: "POST /funds/{id}/run-collections (sweep 2)"
        actor: system
        preconditions:
          - "clock_date > due_date + CURE_DAYS (60)"
        side_effects:
          - "status := DEFAULTED, which drives the owning assessment to ACCELERATED"

  - entity: BoardMotion
    initial_state: OPEN
    terminal_states: [CARRIED, FAILED, ARBITRATION_CARRIED, ARBITRATION_FAILED]
    transitions:
      - from: OPEN
        to: CARRIED
        trigger: "POST /board-motions/{id}/tally"
        actor: FundAdministrator
        preconditions:
          - "status == OPEN"
          - "at least QUORUM_PER_PARTY (2) non-ABSTAIN MotionVote rows exist from UNION trustees and at least 2 from EMPLOYER trustees"
          - "union_bloc_position == FOR and employer_bloc_position == FOR per calculations.motion_bloc_tally"
        side_effects:
          - "tallied_on := logical clock date; union_bloc_position and employer_bloc_position persisted"
          - "CASCADE HOP 1 (subject_type LD_WAIVER) — the referenced DelinquencyAssessment.status := WAIVED and waived_cents := its total_cents"
          - "CASCADE HOP 2 (subject_type LD_WAIVER) — because a WAIVED assessment leaves the ledger sum, Employer.cumulative_delinquent_cents is recomputed downward by exactly waived_cents"
          - "CASCADE HOP 3 (subject_type LD_WAIVER) — because the recomputed ledger reached 0 while Employer.status == SUSPENDED, Employer.status := ACTIVE and delinquency_strikes := 0"
          - "CASCADE HOP 4 (subject_type LD_WAIVER) — because an employer left SUSPENDED, Fund.suspended_employer_count is recomputed"
          - "subject_type RECIPROCITY_AGREEMENT — the referenced SISTER Fund.reciprocity_agreement_status := EXECUTED"
          - "subject_type AUDIT_SETTLEMENT — no field on the audit changes; the carried motion is the precondition that unlocks POST /payroll-audits/{id}/finalize"
      - from: OPEN
        to: FAILED
        trigger: "POST /board-motions/{id}/tally"
        actor: FundAdministrator
        preconditions:
          - "status == OPEN"
          - "quorum met on both parties"
          - "union_bloc_position == AGAINST and employer_bloc_position == AGAINST"
        side_effects:
          - "tallied_on := logical clock date; no subject mutation"
      - from: OPEN
        to: DEADLOCKED
        trigger: "POST /board-motions/{id}/tally"
        actor: FundAdministrator
        preconditions:
          - "status == OPEN"
          - "quorum met on both parties"
          - "union_bloc_position != employer_bloc_position, or either bloc position is TIED"
        side_effects:
          - "tallied_on := logical clock date; no subject mutation"
        note: "Equal representation means neither bargaining party can outvote the other; disagreement is a deadlock, not a loss."
      - from: DEADLOCKED
        to: ARBITRATION_CARRIED
        trigger: "POST /board-motions/{id}/tally with arbitration_award CARRIED"
        actor: FundAdministrator
        preconditions:
          - "status == DEADLOCKED"
        side_effects:
          - "arbitration_award := CARRIED; the same subject cascades as the OPEN -> CARRIED transition fire"
      - from: DEADLOCKED
        to: ARBITRATION_FAILED
        trigger: "POST /board-motions/{id}/tally with arbitration_award FAILED"
        actor: FundAdministrator
        preconditions:
          - "status == DEADLOCKED"
        side_effects:
          - "arbitration_award := FAILED; no subject mutation"

  - entity: ReciprocityTransfer
    initial_state: PENDING
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /reciprocity-transfers/{id}/decision with decision ACCEPT"
        actor: FundAdministrator
        preconditions:
          - "status == PENDING"
          - "the sister Fund.reciprocity_agreement_status == EXECUTED"
          - "Participant.status == ACTIVE"
          - "floor((Participant.hour_bank_hours + hours) / Fund.hours_per_coverage_month) <= Fund.max_advance_coverage_months - the participant's outstanding_coverage_months"
        side_effects:
          - "Participant.reciprocal_hours_total recomputed; calculations.participant_eligibility_replay reruns with this transfer included, minting CoverageMonth rows with source RECIPROCAL"
          - "applied_coverage_months := the number of CoverageMonth rows this transfer's replay step granted"
          - "Fund.reciprocal_receipts_cents recomputed"
          - "if transfer_type == PRO_RATA, the PensionAccrual row for the transfer's plan year gains reciprocal_hours_credited and is re-evaluated"
      - from: PENDING
        to: REJECTED
        trigger: "POST /reciprocity-transfers/{id}/decision with decision REJECT"
        actor: FundAdministrator
        preconditions:
          - "status == PENDING"
        side_effects:
          - "status := REJECTED; no participant or fund aggregate changes"

  - entity: Employer
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /funds/{id}/run-collections (sweep 1) or (sweep 2)"
        actor: system
        preconditions:
          - "delinquency_strikes >= DELINQUENCY_STRIKE_LIMIT (3), or one of this employer's withdrawal installments reached DEFAULTED"
        side_effects:
          - "Fund.suspended_employer_count recomputed"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system — cumulative_delinquent_cents reaches 0 after a remittance, settlement or carried LD_WAIVER motion"
        actor: system
        preconditions:
          - "cumulative_delinquent_cents == 0"
        side_effects:
          - "delinquency_strikes := 0; Fund.suspended_employer_count recomputed"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /withdrawal-assessments"
        actor: FundAdministrator
        preconditions:
          - "status != WITHDRAWN"
        side_effects:
          - "status := WITHDRAWN; the employer may no longer file contribution reports"
      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "POST /withdrawal-assessments"
        actor: FundAdministrator
        preconditions:
          - "status != WITHDRAWN"
        side_effects:
          - "same as ACTIVE -> WITHDRAWN"

  - entity: Participant
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: BROKEN_SERVICE
        trigger: "POST /funds/{id}/run-collections (sweep 3)"
        actor: system
        preconditions:
          - "consecutive_break_years >= BREAK_YEARS_LIMIT (5)"
          - "vested == false"
        side_effects:
          - "every PensionAccrual row of this participant has pension_credit := 0.00 and vesting_year_earned := false"
          - "Participant.vesting_service_years := 0 and total_pension_credits := 0.00"
      - from: BROKEN_SERVICE
        to: ACTIVE
        trigger: "POST /funds/{id}/run-collections (sweep 3)"
        actor: system
        preconditions:
          - "the most recently FINALIZED PensionAccrual row has break_in_service == false"
        side_effects:
          - "consecutive_break_years := 0"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on a parent entity's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: report-intake-stale-employer
    parent_entity: Employer
    write_endpoint: "POST /contribution-reports"
    occ_field: "expected_employer_version"
    description: |
      Filing a ContributionReport against an Employer whose version has advanced since
      the client last read it is rejected. The employer row carries the contribution rate
      and the delinquency ledger that the new report's line amounts are computed from, so
      a filing built on a stale employer view would post cents derived from a rate or
      ledger the fund has since replaced.
    error_id: ERR_STALE_EMPLOYER_VERSION
    http_status: 412

  - rule_id: withdrawal-assessment-stale-fund
    parent_entity: Fund
    write_endpoint: "POST /withdrawal-assessments"
    occ_field: "expected_fund_version"
    description: |
      Creating a WithdrawalAssessment against a Fund whose version has advanced since the
      client last read it is rejected. Each certification draws net_liability_cents out of
      Fund.unallocated_uvb_cents, so an allocation computed from a stale pool would
      double-allocate unfunded vested benefits that another assessment already claimed.
    error_id: ERR_STALE_FUND_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# All money is integer cents. All hour figures carry exactly 2 decimals.
# `round_half_up(x)` means Decimal quantize to the stated precision,
# ROUND_HALF_UP, never bankers' rounding.
# =============================================================================
calculations:

  - name: contribution_due
    trigger: "on POST /contribution-reports (line intake) and re-evaluated on POST /contribution-reports/{id}/post"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: round ONCE PER LINE, THEN SUM.
      # Summing the unrounded line values and rounding the total is WRONG and
      # will differ by whole cents on realistic filings.
      for each ContributionLine L of the report, in ContributionLine.created_at ASC order:
          multiplier_bps = CLASS_MULTIPLIER_BPS[L.work_classification]
          exact = L.hours * Employer.contribution_rate_millicents_per_hour * multiplier_bps / 10_000_000
          L.contribution_cents = round_half_up(exact, 0 decimals)      # <-- per-line rounding
      report.total_contributions_due_cents = SUM(L.contribution_cents)  # <-- then sum
      report.total_hours_reported          = round_half_up(SUM(L.hours), 2 decimals)
    input_set: "every ContributionLine whose report_id equals this report; no status filter — lines are immutable and belong to exactly one report"
    constants:
      CLASS_MULTIPLIER_BPS: { JOURNEYMAN: 10000, APPRENTICE: 5000, FOREMAN: 12500 }
      MILLICENT_DIVISOR: 10000000
    precision: "contribution_cents: whole cents, round_half_up; total_hours_reported: 2 decimals, round_half_up"

  - name: audit_underpayment
    trigger: "on POST /payroll-audits/{id}/findings (non-empty findings)"
    algorithm: aggregation
    formula: |
      # Same per-item-then-sum rounding order as contribution_due. Audit findings
      # are always priced at the JOURNEYMAN multiplier regardless of the
      # classification the employer originally reported.
      for each finding F in findings, in the order supplied in the request body:
          exact_f = F.unreported_hours * Employer.contribution_rate_millicents_per_hour * 10000 / 10_000_000
          cents_f = round_half_up(exact_f, 0 decimals)
      unreported_hours_found        = round_half_up(SUM(F.unreported_hours), 2 decimals)
      underpayment_principal_cents  = SUM(cents_f)
    input_set: "the findings array supplied in the request body; findings from earlier rounds are discarded when a DISPUTE resets the audit"
    constants:
      AUDIT_CLASS_MULTIPLIER_BPS: 10000
    precision: "whole cents, round_half_up per finding"

  - name: delinquency_charges
    trigger: "on POST /contribution-reports/{id}/delinquency-assessments"
    algorithm: threshold
    formula: |
      assessed_on   = logical clock date
      days_late     = max(0, (assessed_on - report.due_date) in whole days)
      principal     = report.total_contributions_due_cents - report.amount_remitted_cents
      # variant selection comes from the request body `basis`; see variants below.
      # Both variants compute interest and liquidated damages as SEPARATE
      # round_half_up results and then add; there is no intermediate total.
      total_cents   = principal + interest_cents + liquidated_damages_cents
    input_set: "exactly one ContributionReport, identified in the path; the report must have filing_status != SUPERSEDED, days_late > 0 and principal > 0"
    constants:
      LD_TIER_BPS: { "days_late <= 30": 500, "31 <= days_late <= 60": 1000, "days_late > 60": 2000 }
      DAYS_PER_YEAR: 365
    precision: "interest_cents and liquidated_damages_cents each round_half_up to whole cents independently, then summed"
    variants:
      - name: STATUTORY
        when: "request body basis == STATUTORY — ERISA 502(g)(2)(C) doubling"
        difference: |
          interest_cents = round_half_up(principal * Fund.interest_rate_annual_bps / 10000
                                         * days_late / 365)
          liquidated_damages_cents = max(interest_cents,
                                         round_half_up(principal * Fund.ld_rate_bps / 10000))
          # No grace period: interest accrues from day 1 after due_date.
          # Fund.ld_floor_cents is NOT applied under this basis.
      - name: PLAN_SCHEDULE
        when: "request body basis == PLAN_SCHEDULE — the trust agreement's own damages schedule"
        difference: |
          effective_days = max(0, days_late - Fund.grace_days)
          interest_cents = round_half_up(principal * Fund.interest_rate_annual_bps / 10000
                                         * effective_days / 365)
          tier_bps = LD_TIER_BPS keyed on days_late (NOT on effective_days)
          liquidated_damages_cents = max(round_half_up(principal * tier_bps / 10000),
                                         Fund.ld_floor_cents)
          # Grace days shrink interest but never the tier lookup; and the floor
          # can raise damages above the tiered percentage on small principals.

  - name: employer_delinquency_ledger
    trigger: "recomputed on every mutation of a ContributionReport's payment_status or amount_remitted_cents, on every DelinquencyAssessment status change, and at the end of each POST /funds/{id}/run-collections sweep"
    algorithm: aggregation
    formula: |
      unpaid_contributions = SUM over ContributionReport R where
            R.employer_id == E.id
        AND R.filing_status != SUPERSEDED
        AND R.payment_status IN {UNPAID, PARTIAL, DELINQUENT}
        of (R.total_contributions_due_cents - R.amount_remitted_cents)

      open_assessments = SUM over DelinquencyAssessment A where
            A.report_id references a ContributionReport of employer E
        AND A.status == ASSESSED
        of A.total_cents

      E.cumulative_delinquent_cents = unpaid_contributions + open_assessments
    input_set: "reports with filing_status != SUPERSEDED and payment_status in {UNPAID, PARTIAL, DELINQUENT}; assessments with status == ASSESSED only (SETTLED and WAIVED rows leave the sum entirely)"
    constants: {}
    precision: "whole cents; the sum is order-independent, so no tie-break is required"

  - name: participant_eligibility_replay
    trigger: "on POST /contribution-reports/{id}/post (for every participant on the posted report and on the report it supersedes), and on POST /reciprocity-transfers/{id}/decision with ACCEPT"
    algorithm: chronological
    formula: |
      # STEP 0 — wipe. Every CoverageMonth of P with status GRANTED becomes REVOKED.
      #          hour_bank_hours := 0, forfeited_hours_total := 0,
      #          coverage_through_month := null.
      # STEP 1 — build the credit-event list for participant P:
      #   (a) every ContributionLine L with L.participant_id == P.id whose owning
      #       report has filing_status == POSTED  -> event(work_period = report.work_period,
      #                                                   hours = L.hours,
      #                                                   report_id = report.id,
      #                                                   kind = CONTRIBUTION)
      #   (b) every ReciprocityTransfer T with T.participant_id == P.id and
      #       T.status == ACCEPTED               -> event(work_period = T.work_period,
      #                                                   hours = T.hours,
      #                                                   report_id = null,
      #                                                   kind = RECIPROCAL)
      # STEP 2 — sort events by work_period ASC, then by the row's created_at ASC.
      #          `id` is NEVER consulted; created_at is the only tie-break.
      # STEP 3 — replay in that order:
      for event in sorted_events:
          available   = P.hour_bank_hours + event.hours
          outstanding = COUNT(CoverageMonth C where C.participant_id == P.id
                              AND C.status == GRANTED
                              AND C.coverage_month > clock_year_month)
          allowance   = Fund.max_advance_coverage_months - outstanding
          months      = min( floor(available / Fund.hours_per_coverage_month),
                             max(0, allowance) )
          consumed    = months * Fund.hours_per_coverage_month
          leftover    = available - consumed
          P.forfeited_hours_total += max(0, leftover - Fund.bank_cap_hours)
          P.hour_bank_hours        = min(Fund.bank_cap_hours, leftover)
          first_month = max( event.work_period + Fund.eligibility_lag_months,
                             (P.coverage_through_month + 1) if non-null else "0000-00" )
          mint `months` CoverageMonth rows for consecutive months starting at first_month,
               status GRANTED,
               hours_applied = Fund.hours_per_coverage_month,
               granting_report_id = event.report_id,
               source = RECIPROCAL            if event.kind == RECIPROCAL
                        else CURRENT_HOURS    if event.hours >= Fund.hours_per_coverage_month
                        else BANK_DRAW
          P.coverage_through_month = the highest coverage_month just minted, if months > 0
      # STEP 4 — totals:
      P.credited_hours_total    = round_half_up(SUM of CONTRIBUTION event hours, 2 decimals)
      P.reciprocal_hours_total  = round_half_up(SUM of RECIPROCAL   event hours, 2 decimals)
      # NOTE — asymmetry, deliberate and pinned: during this replay an event that
      # would buy more months than `allowance` is CLIPPED (the excess hours stay in
      # the bank, subject to the cap). By contrast POST /reciprocity-transfers/{id}/decision
      # REJECTS the acceptance outright with ERR_COVERAGE_HORIZON_EXCEEDED before any
      # replay runs. Clipping is the replay's behaviour; rejection is the intake gate's.
    input_set: "ContributionLine rows on reports with filing_status == POSTED (SUBMITTED and SUPERSEDED reports contribute nothing) plus ReciprocityTransfer rows with status == ACCEPTED"
    constants:
      MONTH_KEY_FORMAT: "YYYY-MM"
    precision: "hours to 2 decimals, round_half_up; month counts are integers via floor()"

  - name: pension_credit_accrual
    trigger: "recomputed for every touched plan_year on POST /contribution-reports/{id}/post, on POST /payroll-audits/{id}/finalize, and on POST /reciprocity-transfers/{id}/decision with ACCEPT"
    algorithm: threshold
    formula: |
      plan_year(work_period) = the calendar year of work_period when
                               Fund.plan_year_start_month == 1; otherwise the year of the
                               plan year that contains work_period.
      A.hours_credited = round_half_up(SUM of ContributionLine.hours for P over POSTED
                                       reports whose work_period falls in A.plan_year, 2)
      A.reciprocal_hours_credited = round_half_up(SUM of ReciprocityTransfer.hours for P
                                       with status ACCEPTED, transfer_type == PRO_RATA and
                                       work_period in A.plan_year, 2)
      countable = A.hours_credited + A.reciprocal_hours_credited
      # pension_credit and vesting_year_earned depend on Fund.accrual_method — see variants.
      A.break_in_service = (A.hours_credited + reciprocal hours of ANY transfer_type
                            in this plan year) < BREAK_HOURS
      # Participant roll-ups, always:
      P.vesting_service_years = COUNT(A where A.vesting_year_earned == true)
      P.total_pension_credits = round_half_up(SUM(A.pension_credit), 2)
      P.vested                = P.vesting_service_years >= VESTING_YEARS_REQUIRED
    input_set: "PensionAccrual rows keyed (participant_id, plan_year); a row is created the first time a POSTED line or ACCEPTED transfer lands in that plan year"
    constants:
      QUARTER_CREDIT_HOURS: 250
      FULL_CREDIT_HOURS: 1000
      VESTING_HOURS_THRESHOLD: 870
      BREAK_HOURS: 375
      BREAK_YEARS_LIMIT: 5
      VESTING_YEARS_REQUIRED: 5
    precision: "pension_credit to 2 decimals in 0.25 steps; hours to 2 decimals"
    variants:
      - name: HOURS_BASED
        when: "Fund.accrual_method == HOURS_BASED"
        difference: |
          A.pension_credit       = min(1.00, floor(countable / QUARTER_CREDIT_HOURS) * 0.25)
          A.vesting_year_earned  = countable >= VESTING_HOURS_THRESHOLD    # >= , not >
      - name: ELAPSED_TIME
        when: "Fund.accrual_method == ELAPSED_TIME"
        difference: |
          covered = there exists a CoverageMonth of P with status GRANTED whose
                    coverage_month falls in A.plan_year
          A.pension_credit       = 1.00 if (countable > 0 and covered) else 0.00
          A.vesting_year_earned  = countable > 0
          # A participant with 151.30 hours earns 0.00 credit and no vesting year under
          # HOURS_BASED, but a full 1.00 credit and a vesting year under ELAPSED_TIME.

  - name: withdrawal_liability_allocation
    trigger: "on POST /withdrawal-assessments, and re-run on POST /withdrawal-assessments/{id}/review-decision with decision REVISED"
    algorithm: waterfall_allocation
    formula: |
      pool = Fund.unallocated_uvb_cents   # total_uvb_cents minus already-allocated
      # employer_share_fraction is variant-specific (see variants) and is rounded to
      # exactly 10 decimal places BEFORE it multiplies the pool. Multiplying the
      # unrounded fraction gives different cents on realistic inputs.
      raw_allocation_cents = round_half_up(pool * employer_share_fraction, 0)
      de_minimis_cents     = min(DE_MINIMIS_CAP_CENTS,
                                 round_half_up(total_uvb_cents * DE_MINIMIS_FRACTION_BPS / 10000, 0))
      excess               = max(0, raw_allocation_cents - PHASEOUT_START_CENTS)
      de_minimis_reduction_cents = max(0, de_minimis_cents - excess)
      net_liability_cents  = raw_allocation_cents - de_minimis_reduction_cents
      # BOUNDARY: the phase-out uses `raw_allocation_cents - PHASEOUT_START_CENTS`, so a
      # raw allocation of exactly 10_000_000 keeps the FULL de minimis; 10_000_001 loses
      # exactly one cent of it.
    input_set: "the withdrawing Employer's prior_year_contributions_cents (5 entries) against the Fund's pool_prior_year_contributions_cents (5 entries), oldest-first and index-aligned"
    constants:
      DE_MINIMIS_CAP_CENTS: 750000
      DE_MINIMIS_FRACTION_BPS: 75
      PHASEOUT_START_CENTS: 10000000
      FRACTION_DECIMALS: 10
    precision: "employer_share_fraction: 10 decimals round_half_up; all cents: whole, round_half_up"
    variants:
      - name: PRESUMPTIVE
        when: "request body method == PRESUMPTIVE"
        difference: |
          employer_share_fraction = round_half_up(
              SUM(employer.prior_year_contributions_cents[0..4]) /
              SUM(fund.pool_prior_year_contributions_cents[0..4]), 10)
          # All five years, employer numerator over pool denominator.
      - name: ROLLING_FIVE
        when: "request body method == ROLLING_FIVE"
        difference: |
          # Pick the 3 CONSECUTIVE years (window start index i in {0,1,2}) that maximise
          # the employer's own 3-year contribution sum. TIE-BREAK: the LOWEST start index
          # (earliest window) wins. `id` is never consulted.
          i = argmax_over_i_in_{0,1,2}( SUM(employer.prior_year_contributions_cents[i..i+2]) ),
              ties broken by the smallest i
          employer_share_fraction = round_half_up(
              SUM(employer.prior_year_contributions_cents[i..i+2]) /
              SUM(fund.pool_prior_year_contributions_cents[i..i+2]), 10)
          # The DENOMINATOR uses the SAME index window i, not the pool's own best window.

  - name: withdrawal_payment_schedule
    trigger: "computed alongside withdrawal_liability_allocation on POST /withdrawal-assessments; the PaymentInstallment rows themselves are minted on POST /withdrawal-assessments/{id}/demand"
    algorithm: constraint_propagation
    formula: |
      # The 20-year cap looks circular: schedule_years depends on net_liability_cents,
      # while the capped amount depends on schedule_years. The evaluation order below is
      # PINNED and MUST NOT be iterated to a fixed point.
      # ORDER:
      #   (1) net_liability_cents            <- withdrawal_liability_allocation (already done)
      #   (2) high_three_base_units          <- from prior_year_base_units, INDEPENDENT of (1)
      #   (3) annual_payment_cents           <- from (2), INDEPENDENT of (1)
      #   (4) schedule_years_uncapped        <- from (1) and (3)
      #   (5) cap test and capped_liability  <- from (4) and (3)
      #   (6) de_minimis_reduction_cents is NOT recomputed after the cap applies.
      j = argmax_over_j_in_{0,1,2}( SUM(employer.prior_year_base_units[j..j+2]) ),
          ties broken by the smallest j
      high_three_avg_base_units = round_half_up(SUM(employer.prior_year_base_units[j..j+2]) / 3, 0)
      annual_payment_cents      = round_half_up(high_three_avg_base_units *
                                  Employer.contribution_rate_millicents_per_hour / 1000, 0)
      if annual_payment_cents == 0: reject with ERR_NO_PAYMENT_BASE
      schedule_years_uncapped   = ceil(net_liability_cents / annual_payment_cents)
      if schedule_years_uncapped > MAX_SCHEDULE_YEARS:
          twenty_year_cap_applied = true
          schedule_years          = MAX_SCHEDULE_YEARS
          capped_liability_cents  = annual_payment_cents * MAX_SCHEDULE_YEARS
      else:
          twenty_year_cap_applied = false
          schedule_years          = schedule_years_uncapped
          capped_liability_cents  = net_liability_cents
      # Installment k (1-based), minted at demand time:
      #   due_date    = demanded_on + INSTALLMENT_FIRST_OFFSET_DAYS + (k-1)*INSTALLMENT_INTERVAL_DAYS
      #   amount_cents = annual_payment_cents              for k < schedule_years
      #                = capped_liability_cents - annual_payment_cents * (schedule_years - 1)
      #                                                     for k == schedule_years
      # `j` (the base-unit window) is chosen INDEPENDENTLY of `i` (the contribution window
      # in withdrawal_liability_allocation); the two argmaxes may land on different indices.
    input_set: "the withdrawing Employer's prior_year_base_units (5 entries) plus the net_liability_cents produced by withdrawal_liability_allocation"
    constants:
      MAX_SCHEDULE_YEARS: 20
      INSTALLMENT_FIRST_OFFSET_DAYS: 60
      INSTALLMENT_INTERVAL_DAYS: 365
      CURE_DAYS: 60
    precision: "whole cents, round_half_up; schedule_years via ceil()"

  - name: governance_posture
    trigger: "recomputed on POST /trustees and on every read of a Fund"
    algorithm: threshold
    formula: |
      u = COUNT(Trustee T of this fund where T.appointing_party == UNION
                                        AND T.seat_status == ACTIVE)
      e = COUNT(Trustee T of this fund where T.appointing_party == EMPLOYER
                                        AND T.seat_status == ACTIVE)
      Fund.active_union_trustees    = u
      Fund.active_employer_trustees = e
      if u == 0 or e == 0:                       governance_posture = FROZEN
      elif u != e or min(u, e) < MIN_TRUSTEES_PER_PARTY: governance_posture = RESTRICTED
      else:                                      governance_posture = OPEN
      # BOUNDARY: u == e == 1 is RESTRICTED (min < 2), u == e == 2 is OPEN.
    input_set: "Trustee rows of this fund with seat_status ACTIVE; RESIGNED seats never count"
    constants:
      MIN_TRUSTEES_PER_PARTY: 2
    precision: "integer counts"

  - name: motion_bloc_tally
    trigger: "on POST /board-motions/{id}/tally when status == OPEN"
    algorithm: weighted_scoring
    formula: |
      # Taft-Hartley equal representation: each bargaining party votes as a single bloc,
      # so a 3-1 union majority does NOT outweigh a 2-0 employer bloc.
      for party in {UNION, EMPLOYER}:
          votes   = MotionVote rows on this motion whose trustee's appointing_party == party
          for_n   = COUNT(votes with position == FOR)
          agn_n   = COUNT(votes with position == AGAINST)
          counted = for_n + agn_n                       # ABSTAIN never counts
          if counted < QUORUM_PER_PARTY: reject the tally with ERR_QUORUM_NOT_MET
          bloc[party] = FOR      if for_n > agn_n
                        AGAINST  if agn_n > for_n
                        TIED     otherwise
      if bloc[UNION] == FOR     and bloc[EMPLOYER] == FOR:     status = CARRIED
      elif bloc[UNION] == AGAINST and bloc[EMPLOYER] == AGAINST: status = FAILED
      else:                                                     status = DEADLOCKED
    input_set: "every MotionVote row on this motion; the moving trustee is barred from voting at intake, so the mover contributes nothing to either bloc"
    constants:
      QUORUM_PER_PARTY: 2
    precision: "integer counts; no ordering dependence, hence no tie-break over rows"

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority; first failure wins)
# =============================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "the acting X-User-Role appears in the endpoint's declared roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 25
    category: auth
    check: "for entity_backed roles, X-User-ID owns the target: ContributingEmployer's id equals the ContributionReport / PayrollAudit / WithdrawalAssessment employer_id or the PaymentInstallment's assessment employer_id; Trustee's id equals the MotionVote trustee_id being created"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /contribution-reports, POST /contribution-reports/{id}/remit, POST /payroll-audits/{id}/respond, POST /withdrawal-assessments/{id}/review-request, POST /payment-installments/{id}/pay"

  - priority: 30
    category: existence
    check: "every id in the path resolves, validated left to right"
    error_id: "ERR_FUND_NOT_FOUND | ERR_EMPLOYER_NOT_FOUND | ERR_PARTICIPANT_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_COVERAGE_MONTH_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_AUDIT_NOT_FOUND | ERR_WITHDRAWAL_NOT_FOUND | ERR_INSTALLMENT_NOT_FOUND | ERR_MOTION_NOT_FOUND | ERR_VOTE_NOT_FOUND | ERR_TRANSFER_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 32
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row (fund_id, employer_id, participant_id, sister_fund_id, motion_id, amends_report_id, controlled_group_parent_employer_id, findings[].participant_id, lines[].participant_id)"
    error_id: "ERR_FUND_NOT_FOUND | ERR_EMPLOYER_NOT_FOUND | ERR_PARTICIPANT_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_MOTION_NOT_FOUND"
    http_status: 404
    applies_to: "all POST endpoints carrying foreign keys"

  - priority: 35
    category: business_constraint
    check: "request body shape: required fields present, types correct, enum members valid, work_period / period months match ^\\d{4}-(0[1-9]|1[0-2])$, prior_year arrays have exactly 5 entries, hours >= 0 with at most 2 decimals, cents fields are non-negative integers"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 38
    category: state
    check: "expected_employer_version equals Employer.version (report intake) / expected_fund_version equals Fund.version (withdrawal intake)"
    error_id: "ERR_STALE_EMPLOYER_VERSION | ERR_STALE_FUND_VERSION"
    http_status: 412
    applies_to: "POST /contribution-reports, POST /withdrawal-assessments"

  - priority: 40
    category: state
    check: "the target row is in a from-state declared for the requested transition in §1.2"
    error_id: "ERR_REPORT_ALREADY_POSTED | ERR_AUDIT_INVALID_STATE | ERR_WITHDRAWAL_INVALID_STATE | ERR_MOTION_INVALID_STATE | ERR_TRANSFER_INVALID_STATE | ERR_ASSESSMENT_INVALID_STATE"
    http_status: 409
    applies_to: "every action endpoint"

  - priority: 45
    category: state
    check: "payment-axis preconditions: a report whose filing_status == SUPERSEDED accepts no remittance; an installment whose status is PAID or DEFAULTED, or whose MISSED due_date + 60 days has passed, accepts no payment"
    error_id: "ERR_REPORT_NOT_REMITTABLE | ERR_INSTALLMENT_NOT_PAYABLE"
    http_status: 409
    applies_to: "POST /contribution-reports/{id}/remit, POST /payment-installments/{id}/pay"

  - priority: 50
    category: business_safety
    check: "Taft-Hartley governance and segregation of duties: the contributing employer is not WITHDRAWN; a carried AUDIT_SETTLEMENT motion exists before an audit is finalized; the finalizing administrator is not the auditor; the demanding administrator is not the certifying actuary; the moving trustee does not vote on their own motion; the voting trustee's seat_status is ACTIVE; the fund's governance_posture is OPEN before a motion may be moved and not FROZEN before a demand may issue; the sister fund's reciprocity_agreement_status is EXECUTED before a transfer may be accepted"
    error_id: "ERR_EMPLOYER_WITHDRAWN | ERR_BOARD_APPROVAL_REQUIRED | ERR_SEGREGATION_OF_DUTIES | ERR_MOVER_CANNOT_VOTE | ERR_TRUSTEE_SEAT_INACTIVE | ERR_FUND_GOVERNANCE_NOT_OPEN | ERR_FUND_GOVERNANCE_FROZEN | ERR_RECIPROCITY_AGREEMENT_NOT_EXECUTED"
    http_status: 409
    applies_to: "POST /contribution-reports, POST /payroll-audits/{id}/finalize, POST /withdrawal-assessments/{id}/demand, POST /board-motions, POST /motion-votes, POST /reciprocity-transfers/{id}/decision"

  - priority: 54
    category: business_temporal
    check: "temporal geometry: a new PayrollAudit's closed month interval [period_start_month, period_end_month] must not intersect the interval of any existing audit on the same employer whose status is not ABANDONED (adjacency, i.e. one interval starting the month after the other ends, is permitted); a delinquency assessment requires days_late > 0; an accepted reciprocity transfer must not push the participant past Fund.max_advance_coverage_months outstanding coverage months"
    error_id: "ERR_AUDIT_PERIOD_OVERLAP | ERR_REPORT_NOT_DELINQUENT | ERR_COVERAGE_HORIZON_EXCEEDED"
    http_status: 409
    applies_to: "POST /payroll-audits, POST /contribution-reports/{id}/delinquency-assessments, POST /reciprocity-transfers/{id}/decision"

  - priority: 58
    category: business_referential
    check: "cross-entity linkage: every lines[].participant_id and findings[].participant_id belongs to the employer's fund; a voting trustee belongs to the motion's fund; a reciprocity sister_fund_id row has fund_role SISTER and is not the participant's own fund; a BoardMotion's subject_ref_id resolves to a row of the type its subject_type demands"
    error_id: "ERR_PARTICIPANT_FUND_MISMATCH | ERR_TRUSTEE_FUND_MISMATCH | ERR_SISTER_FUND_INVALID | ERR_MOTION_SUBJECT_INVALID"
    http_status: 409
    applies_to: "POST /contribution-reports, POST /payroll-audits/{id}/findings, POST /motion-votes, POST /reciprocity-transfers, POST /board-motions"

  - priority: 60
    category: business_constraint
    check: "uniqueness and chain rules: an employer may hold at most one ContributionReport per work_period whose filing_status is not SUPERSEDED; an amends_report_id target must be POSTED, same employer, same work_period; a trustee may cast at most one vote per motion; a report must carry at least one line; an audit may not consume more than MAX_AUDIT_ROUNDS fieldwork rounds"
    error_id: "ERR_DUPLICATE_WORK_PERIOD | ERR_AMENDMENT_TARGET_INVALID | ERR_DUPLICATE_VOTE | ERR_EMPTY_REPORT | ERR_AUDIT_ROUND_LIMIT_REACHED"
    http_status: 409
    applies_to: "POST /contribution-reports, POST /motion-votes, POST /payroll-audits/{id}/respond"

  - priority: 61
    category: business_constraint
    check: "quorum: each bargaining party has contributed at least QUORUM_PER_PARTY (2) non-ABSTAIN votes before a tally may resolve"
    error_id: ERR_QUORUM_NOT_MET
    http_status: 409
    applies_to: "POST /board-motions/{id}/tally"

  - priority: 62
    category: business_fiscal
    check: "money bounds: a remittance may not exceed the report's outstanding balance; a settlement may not exceed the assessment total; an installment payment must equal the installment amount exactly; a delinquency assessment requires principal > 0; an allocation requires a positive unallocated UVB pool and a positive annual payment base"
    error_id: "ERR_REMITTANCE_EXCEEDS_BALANCE | ERR_SETTLEMENT_EXCEEDS_ASSESSMENT | ERR_INSTALLMENT_AMOUNT_MISMATCH | ERR_NO_DELINQUENT_PRINCIPAL | ERR_UVB_POOL_EXHAUSTED | ERR_NO_PAYMENT_BASE"
    http_status: 422
    applies_to: "POST /contribution-reports/{id}/remit, POST /delinquency-assessments/{id}/settle, POST /payment-installments/{id}/pay, POST /contribution-reports/{id}/delinquency-assessments, POST /withdrawal-assessments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- Reads -----------------------------------------------------------------
  - { method: GET, path: "/funds/{id}", description: "Read a fund including its recomputed governance posture and UVB pool split", roles: [FundAdministrator, ContributingEmployer, Trustee, PayrollAuditor, Actuary], code: 200, input: [], output: Fund, side_effects: ["recomputes governance_posture, active_union_trustees, active_employer_trustees, unallocated_uvb_cents before serialising"] }
  - { method: GET, path: "/funds/{id}/trustees", description: "List the trustees seated on a fund's board", roles: [FundAdministrator, ContributingEmployer, Trustee, PayrollAuditor, Actuary], code: 200, input: ["seat_status?", "appointing_party?", "limit?", "offset?"], output: "Trustee[]", side_effects: [] }
  - { method: GET, path: "/employers/{id}", description: "Read one contributing employer including its delinquency ledger and version", roles: [FundAdministrator, ContributingEmployer, Trustee, PayrollAuditor, Actuary], code: 200, input: [], output: Employer, side_effects: [] }
  - { method: GET, path: "/employers", description: "List employers, filterable by fund and by controlled-group parent", roles: [FundAdministrator, Trustee, PayrollAuditor, Actuary], code: 200, input: ["fund_id?", "controlled_group_parent_employer_id?", "status?", "limit?", "offset?"], output: "Employer[]", side_effects: [] }
  - { method: GET, path: "/participants/{id}", description: "Read one participant with eligibility, banking and vesting roll-ups", roles: [FundAdministrator, ContributingEmployer, Trustee, PayrollAuditor, Actuary], code: 200, input: [], output: Participant, side_effects: ["derives eligibility_status against the current logical clock month"] }
  - { method: GET, path: "/participants", description: "List participants of a fund", roles: [FundAdministrator, Trustee, PayrollAuditor, Actuary], code: 200, input: ["fund_id?", "eligibility_status?", "status?", "limit?", "offset?"], output: "Participant[]", side_effects: [] }
  - { method: GET, path: "/participants/{id}/pension-accruals", description: "List a participant's per-plan-year pension accrual rows", roles: [FundAdministrator, ContributingEmployer, Trustee, PayrollAuditor, Actuary], code: 200, input: ["plan_year?", "accrual_status?", "limit?", "offset?"], output: "PensionAccrual[]", side_effects: [] }
  - { method: GET, path: "/participants/{id}/contribution-lines", description: "List every contribution line reported for a participant across all reports", roles: [FundAdministrator, ContributingEmployer, Trustee, PayrollAuditor, Actuary], code: 200, input: ["report_id?", "limit?", "offset?"], output: "ContributionLine[]", side_effects: [] }
  - { method: GET, path: "/coverage-months/{id}", description: "Read one coverage month", roles: [FundAdministrator, ContributingEmployer, Trustee, PayrollAuditor, Actuary], code: 200, input: [], output: CoverageMonth, side_effects: [] }
  - { method: GET, path: "/coverage-months", description: "List coverage months, filterable by participant and by the report whose posting granted them", roles: [FundAdministrator, ContributingEmployer, Trustee, PayrollAuditor, Actuary], code: 200, input: ["participant_id?", "granting_report_id?", "status?", "coverage_month?", "source?", "limit?", "offset?"], output: "CoverageMonth[]", side_effects: [] }
  - { method: GET, path: "/contribution-reports/{id}", description: "Read one contribution report with both state axes", roles: [FundAdministrator, ContributingEmployer, Trustee, PayrollAuditor, Actuary], code: 200, input: [], output: ContributionReport, side_effects: [] }
  - { method: GET, path: "/contribution-reports", description: "List contribution reports, filterable by employer, amendment target, either state axis, work period and origin", roles: [FundAdministrator, ContributingEmployer, Trustee, PayrollAuditor, Actuary], code: 200, input: ["employer_id?", "amends_report_id?", "filing_status?", "payment_status?", "work_period?", "origin?", "limit?", "offset?"], output: "ContributionReport[]", side_effects: [] }
  - { method: GET, path: "/contribution-reports/{id}/lines", description: "List the lines of one contribution report", roles: [FundAdministrator, ContributingEmployer, Trustee, PayrollAuditor, Actuary], code: 200, input: ["limit?", "offset?"], output: "ContributionLine[]", side_effects: [] }
  - { method: GET, path: "/contribution-reports/{id}/delinquency-assessments", description: "List the interest and liquidated-damages assessments raised on one report", roles: [FundAdministrator, ContributingEmployer, Trustee], code: 200, input: ["status?", "basis?", "limit?", "offset?"], output: "DelinquencyAssessment[]", side_effects: [] }
  - { method: GET, path: "/payroll-audits/{id}", description: "Read one payroll audit including its round count and findings", roles: [FundAdministrator, ContributingEmployer, Trustee, PayrollAuditor], code: 200, input: [], output: PayrollAudit, side_effects: [] }
  - { method: GET, path: "/payroll-audits", description: "List payroll audits, filterable by employer, status and the recovery report they produced", roles: [FundAdministrator, ContributingEmployer, Trustee, PayrollAuditor], code: 200, input: ["employer_id?", "status?", "resulting_report_id?", "limit?", "offset?"], output: "PayrollAudit[]", side_effects: [] }
  - { method: GET, path: "/withdrawal-assessments/{id}", description: "Read one withdrawal-liability assessment with its full allocation and schedule figures", roles: [FundAdministrator, ContributingEmployer, Trustee, Actuary], code: 200, input: [], output: WithdrawalAssessment, side_effects: [] }
  - { method: GET, path: "/withdrawal-assessments", description: "List withdrawal-liability assessments", roles: [FundAdministrator, ContributingEmployer, Trustee, Actuary], code: 200, input: ["employer_id?", "status?", "method?", "limit?", "offset?"], output: "WithdrawalAssessment[]", side_effects: [] }
  - { method: GET, path: "/withdrawal-assessments/{id}/installments", description: "List the payment schedule minted for one assessment", roles: [FundAdministrator, ContributingEmployer, Trustee, Actuary], code: 200, input: ["status?", "limit?", "offset?"], output: "PaymentInstallment[]", side_effects: [] }
  - { method: GET, path: "/board-motions/{id}", description: "Read one board motion including both bargaining-party bloc positions", roles: [FundAdministrator, ContributingEmployer, Trustee, PayrollAuditor, Actuary], code: 200, input: [], output: BoardMotion, side_effects: [] }
  - { method: GET, path: "/board-motions", description: "List board motions, filterable by fund, status, subject and mover", roles: [FundAdministrator, ContributingEmployer, Trustee, PayrollAuditor, Actuary], code: 200, input: ["fund_id?", "status?", "subject_type?", "subject_ref_id?", "moved_by_trustee_id?", "limit?", "offset?"], output: "BoardMotion[]", side_effects: [] }
  - { method: GET, path: "/motion-votes/{id}", description: "Read one cast vote", roles: [FundAdministrator, Trustee], code: 200, input: [], output: MotionVote, side_effects: [] }
  - { method: GET, path: "/motion-votes", description: "List votes, filterable by motion and by trustee", roles: [FundAdministrator, Trustee], code: 200, input: ["motion_id?", "trustee_id?", "position?", "limit?", "offset?"], output: "MotionVote[]", side_effects: [] }
  - { method: GET, path: "/reciprocity-transfers/{id}", description: "Read one inbound reciprocity transfer", roles: [FundAdministrator, Trustee], code: 200, input: [], output: ReciprocityTransfer, side_effects: [] }
  - { method: GET, path: "/reciprocity-transfers", description: "List reciprocity transfers, filterable by participant and by sending sister fund", roles: [FundAdministrator, Trustee], code: 200, input: ["participant_id?", "sister_fund_id?", "status?", "transfer_type?", "limit?", "offset?"], output: "ReciprocityTransfer[]", side_effects: [] }

  # ---- Writes ----------------------------------------------------------------
  - { method: POST, path: "/funds", description: "Create a trust fund (HOME) or register a sister fund (SISTER)", roles: [FundAdministrator], code: 201, input: [name, ein, interest_rate_annual_bps, ld_rate_bps, ld_floor_cents, grace_days, hours_per_coverage_month, bank_cap_hours, max_advance_coverage_months, eligibility_lag_months, accrual_method, pool_prior_year_contributions_cents, "fund_role?", "plan_year_start_month?", "total_uvb_cents?"], output: Fund, side_effects: ["governance_posture initialises to FROZEN because no trustees are seated yet", "unallocated_uvb_cents := total_uvb_cents"] }
  - { method: POST, path: "/employers", description: "Register a contributing employer under a fund", roles: [FundAdministrator], code: 201, input: [fund_id, legal_name, ein, contribution_rate_millicents_per_hour, prior_year_contributions_cents, prior_year_base_units, "controlled_group_parent_employer_id?"], output: Employer, side_effects: ["status := ACTIVE; delinquency_strikes := 0; cumulative_delinquent_cents := 0"] }
  - { method: POST, path: "/participants", description: "Enroll a participant in a fund", roles: [FundAdministrator], code: 201, input: [fund_id, full_name, ssn_last4], output: Participant, side_effects: ["all eligibility, banking and vesting roll-ups initialise to zero/null"] }
  - { method: POST, path: "/trustees", description: "Seat a trustee appointed by one bargaining party", roles: [FundAdministrator], code: 201, input: [fund_id, full_name, appointing_party, term_expires_on, "seat_status?"], output: Trustee, side_effects: ["recomputes calculations.governance_posture on the fund", "increments Fund.version by 1"] }
  - { method: POST, path: "/contribution-reports", description: "File a monthly employer contribution report with its participant hour lines; supply amends_report_id to file an amendment that will supersede an earlier posted report", roles: [ContributingEmployer, FundAdministrator], code: 201, input: [employer_id, work_period, lines, expected_employer_version, "amends_report_id?"], output: ContributionReport, side_effects: ["creates one ContributionLine per lines[] entry and runs calculations.contribution_due", "computes due_date as the 20th of the month after work_period", "filing_status := SUBMITTED, payment_status := UNPAID", "increments Employer.version by 1"] }
  - { method: POST, path: "/contribution-reports/{id}/remit", description: "Apply a remittance against a filed report, advancing the independent payment axis", roles: [ContributingEmployer, FundAdministrator], code: 200, input: [amount_cents], output: ContributionReport, side_effects: ["amount_remitted_cents += amount_cents; payment_status advances to PARTIAL or PAID_IN_FULL", "recomputes calculations.employer_delinquency_ledger", "may restore a SUSPENDED employer to ACTIVE"] }
  - { method: POST, path: "/contribution-reports/{id}/post", description: "Post a filed report, crediting hours and running the full eligibility and accrual cascade", roles: [FundAdministrator], code: 200, input: [], output: ContributionReport, side_effects: ["filing_status := POSTED; supersedes the amends_report_id target", "runs calculations.participant_eligibility_replay for every affected participant", "recomputes PensionAccrual rows and participant vesting roll-ups", "recomputes calculations.employer_delinquency_ledger"] }
  - { method: POST, path: "/contribution-reports/{id}/delinquency-assessments", description: "Assess interest and liquidated damages on a late report under the chosen basis", roles: [FundAdministrator], code: 201, input: [basis], output: DelinquencyAssessment, side_effects: ["runs calculations.delinquency_charges", "recomputes calculations.employer_delinquency_ledger upward by total_cents"] }
  - { method: POST, path: "/delinquency-assessments/{id}/settle", description: "Record a negotiated settlement of an open assessment", roles: [FundAdministrator], code: 200, input: [settlement_amount_cents], output: DelinquencyAssessment, side_effects: ["status := SETTLED; settlement_amount_cents recorded", "recomputes calculations.employer_delinquency_ledger, which drops the assessment entirely", "may restore a SUSPENDED employer to ACTIVE"] }
  - { method: POST, path: "/payroll-audits", description: "Open a payroll audit over a closed month interval for one employer", roles: [PayrollAuditor], code: 201, input: [employer_id, period_start_month, period_end_month], output: PayrollAudit, side_effects: ["auditor_user_id := X-User-ID; status := IN_FIELDWORK; round_count := 1"] }
  - { method: POST, path: "/payroll-audits/{id}/findings", description: "Issue this round's findings; an empty findings array abandons the audit", roles: [PayrollAuditor], code: 200, input: [findings], output: PayrollAudit, side_effects: ["runs calculations.audit_underpayment", "status := FINDINGS_ISSUED, or ABANDONED when findings is empty"] }
  - { method: POST, path: "/payroll-audits/{id}/respond", description: "Employer accepts the findings or disputes them, returning the audit to fieldwork", roles: [ContributingEmployer], code: 200, input: [response, "dispute_note?"], output: PayrollAudit, side_effects: ["ACCEPT -> status := EMPLOYER_ACCEPTED", "DISPUTE -> status := IN_FIELDWORK, round_count += 1, findings cleared"] }
  - { method: POST, path: "/payroll-audits/{id}/finalize", description: "Close an accepted audit and mint the AUDIT-origin recovery report; requires a carried AUDIT_SETTLEMENT board motion", roles: [FundAdministrator], code: 200, input: [], output: PayrollAudit, side_effects: ["mints a POSTED ContributionReport with origin AUDIT and one line per finding; sets resulting_report_id", "runs calculations.participant_eligibility_replay for every finding participant", "recomputes PensionAccrual and participant eligibility roll-ups", "recomputes calculations.employer_delinquency_ledger"] }
  - { method: POST, path: "/withdrawal-assessments", description: "Open a withdrawal-liability assessment; marks the employer WITHDRAWN and computes the allocation and payment schedule", roles: [FundAdministrator], code: 201, input: [employer_id, withdrawal_date, method, expected_fund_version], output: WithdrawalAssessment, side_effects: ["Employer.status := WITHDRAWN", "runs calculations.withdrawal_liability_allocation and calculations.withdrawal_payment_schedule", "status := DRAFT; no UVB is allocated until certification", "increments Fund.version by 1"] }
  - { method: POST, path: "/withdrawal-assessments/{id}/certify", description: "Actuary certifies the assessment, charging the net liability against the fund's UVB pool", roles: [Actuary], code: 200, input: [], output: WithdrawalAssessment, side_effects: ["status := CERTIFIED; certified_by_user_id := X-User-ID", "Fund.allocated_uvb_cents += net_liability_cents; unallocated_uvb_cents recomputed", "increments Fund.version by 1"] }
  - { method: POST, path: "/withdrawal-assessments/{id}/demand", description: "Issue the payment demand and mint the installment schedule", roles: [FundAdministrator], code: 200, input: [], output: WithdrawalAssessment, side_effects: ["status := DEMANDED; demanded_on := logical clock date", "mints schedule_years PaymentInstallment rows per calculations.withdrawal_payment_schedule"] }
  - { method: POST, path: "/withdrawal-assessments/{id}/review-request", description: "Withdrawing employer requests review of the demanded assessment", roles: [ContributingEmployer], code: 200, input: [grounds], output: WithdrawalAssessment, side_effects: ["status := REVIEW_REQUESTED; review_grounds recorded; the schedule is left intact"] }
  - { method: POST, path: "/withdrawal-assessments/{id}/review-decision", description: "Uphold the assessment or revise the fund's UVB pool and recompute the whole allocation", roles: [FundAdministrator], code: 200, input: [decision, "revised_total_uvb_cents?"], output: WithdrawalAssessment, side_effects: ["UPHELD -> status := PAYMENT_ACTIVE, schedule untouched", "REVISED -> the prior net_liability_cents is returned to the pool, Fund.total_uvb_cents is replaced, the allocation and schedule are recomputed, every SCHEDULED installment is deleted, demanded_on := null, status := CERTIFIED", "increments Fund.version by 1"] }
  - { method: POST, path: "/payment-installments/{id}/pay", description: "Pay one scheduled or missed installment in full", roles: [ContributingEmployer], code: 200, input: [amount_cents], output: PaymentInstallment, side_effects: ["status := PAID; paid_on := logical clock date", "first payment moves the assessment DEMANDED -> PAYMENT_ACTIVE", "final payment moves the assessment to SATISFIED"] }
  - { method: POST, path: "/board-motions", description: "A trustee moves a motion before the joint board; requires the fund's governance_posture to be OPEN", roles: [Trustee], code: 201, input: [fund_id, subject_type, subject_ref_id], output: BoardMotion, side_effects: ["moved_by_trustee_id := X-User-ID; status := OPEN", "the mover is thereby barred from voting on this motion"] }
  - { method: POST, path: "/motion-votes", description: "A seated trustee casts one vote on an open motion", roles: [Trustee], code: 201, input: [motion_id, position], output: MotionVote, side_effects: ["trustee_id := X-User-ID"] }
  - { method: POST, path: "/board-motions/{id}/tally", description: "Tally an open motion by bargaining-party bloc, or record the arbitrator's award on a deadlocked motion", roles: [FundAdministrator], code: 200, input: ["arbitration_award?"], output: BoardMotion, side_effects: ["runs calculations.motion_bloc_tally and persists both bloc positions", "a carried LD_WAIVER cascades to the assessment, the employer ledger, the employer status and the fund's suspended-employer count", "a carried RECIPROCITY_AGREEMENT sets the sister fund's reciprocity_agreement_status to EXECUTED"] }
  - { method: POST, path: "/reciprocity-transfers", description: "Record an inbound hours-and-money transfer from a sister fund", roles: [FundAdministrator], code: 201, input: [participant_id, sister_fund_id, transfer_type, work_period, hours, amount_cents], output: ReciprocityTransfer, side_effects: ["status := PENDING; nothing is credited until the decision"] }
  - { method: POST, path: "/reciprocity-transfers/{id}/decision", description: "Accept or reject a pending reciprocity transfer", roles: [FundAdministrator], code: 200, input: [decision], output: ReciprocityTransfer, side_effects: ["ACCEPT -> reruns calculations.participant_eligibility_replay with the transfer included, mints RECIPROCAL coverage months, updates Fund.reciprocal_receipts_cents and PRO_RATA pension hours", "REJECT -> status := REJECTED with no downstream change"] }
  - { method: POST, path: "/funds/{id}/run-collections", description: "Ops-run checkpoint: sweep 1 marks overdue reports DELINQUENT, sweep 2 ages installments SCHEDULED -> MISSED -> DEFAULTED, sweep 3 finalizes elapsed plan-year accruals. Sweeps run in that order; within a sweep rows are processed by due_date ASC then created_at ASC. Sweep 2 runs two passes in order: pass A moves every SCHEDULED installment past its due_date to MISSED, then pass B moves every MISSED installment past due_date + 60 days to DEFAULTED, including rows pass A just marked, so a single run can carry one installment SCHEDULED -> MISSED -> DEFAULTED", roles: [FundAdministrator], code: 200, input: [], output: { reports_marked_delinquent: integer, installments_marked_missed: integer, installments_defaulted: integer, employers_suspended: integer, accruals_finalized: integer, collections_run_index: integer }, side_effects: ["increments Fund.collections_run_index by 1", "cascades employer suspension and assessment acceleration", "may drive a participant to BROKEN_SERVICE"] }
  - { method: POST, path: "/_clock/set_current_utc", description: "Test-driving endpoint that sets the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time", roles: [FundAdministrator], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["all due-date, lateness, coverage-month and cure-period arithmetic reads this clock"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,                 http: 401, condition: "X-User-Role or X-User-ID header missing, or the role is not one of the five declared roles" }
  - { id: ERR_ROLE_NOT_PERMITTED,              http: 403, condition: "the acting role is not listed in the endpoint's roles" }
  - { id: ERR_NOT_RESOURCE_OWNER,              http: 403, condition: "an entity_backed actor targets a resource belonging to a different Employer or Trustee" }
  - { id: ERR_FUND_NOT_FOUND,                  http: 404, condition: "no Fund exists for the supplied path or body id" }
  - { id: ERR_EMPLOYER_NOT_FOUND,              http: 404, condition: "no Employer exists for the supplied path or body id" }
  - { id: ERR_PARTICIPANT_NOT_FOUND,           http: 404, condition: "no Participant exists for the supplied path or body id" }
  - { id: ERR_REPORT_NOT_FOUND,                http: 404, condition: "no ContributionReport exists for the supplied path or body id" }
  - { id: ERR_COVERAGE_MONTH_NOT_FOUND,        http: 404, condition: "no CoverageMonth exists for the supplied path id" }
  - { id: ERR_ASSESSMENT_NOT_FOUND,            http: 404, condition: "no DelinquencyAssessment exists for the supplied path id" }
  - { id: ERR_AUDIT_NOT_FOUND,                 http: 404, condition: "no PayrollAudit exists for the supplied path id" }
  - { id: ERR_WITHDRAWAL_NOT_FOUND,            http: 404, condition: "no WithdrawalAssessment exists for the supplied path id" }
  - { id: ERR_INSTALLMENT_NOT_FOUND,           http: 404, condition: "no PaymentInstallment exists for the supplied path id" }
  - { id: ERR_MOTION_NOT_FOUND,                http: 404, condition: "no BoardMotion exists for the supplied path or body id" }
  - { id: ERR_VOTE_NOT_FOUND,                  http: 404, condition: "no MotionVote exists for the supplied path id" }
  - { id: ERR_TRANSFER_NOT_FOUND,              http: 404, condition: "no ReciprocityTransfer exists for the supplied path id" }
  - { id: ERR_INVALID_REQUEST,                 http: 400, condition: "missing required field, wrong type, invalid enum member, malformed YYYY-MM, prior-year array not exactly 5 entries, negative hours or cents" }
  - { id: ERR_STALE_EMPLOYER_VERSION,          http: 412, condition: "expected_employer_version does not equal the Employer's current version at report intake" }
  - { id: ERR_STALE_FUND_VERSION,              http: 412, condition: "expected_fund_version does not equal the Fund's current version at withdrawal-assessment intake" }
  - { id: ERR_REPORT_ALREADY_POSTED,           http: 409, condition: "post attempted on a report whose filing_status is already POSTED or SUPERSEDED" }
  - { id: ERR_REPORT_NOT_REMITTABLE,           http: 409, condition: "remittance attempted against a report whose filing_status is SUPERSEDED" }
  - { id: ERR_ASSESSMENT_INVALID_STATE,        http: 409, condition: "settle attempted on a DelinquencyAssessment whose status is not ASSESSED" }
  - { id: ERR_AUDIT_INVALID_STATE,             http: 409, condition: "an audit action is attempted from a status that does not declare that transition" }
  - { id: ERR_WITHDRAWAL_INVALID_STATE,        http: 409, condition: "a withdrawal action is attempted from a status that does not declare that transition" }
  - { id: ERR_MOTION_INVALID_STATE,            http: 409, condition: "a vote or tally is attempted on a motion that is not in the required status" }
  - { id: ERR_TRANSFER_INVALID_STATE,          http: 409, condition: "a decision is attempted on a reciprocity transfer whose status is not PENDING" }
  - { id: ERR_INSTALLMENT_NOT_PAYABLE,         http: 409, condition: "payment attempted on an installment that is PAID or DEFAULTED, or on a MISSED installment whose cure window of 60 days has closed" }
  - { id: ERR_EMPLOYER_WITHDRAWN,              http: 409, condition: "a contribution report is filed for an employer whose status is WITHDRAWN" }
  - { id: ERR_BOARD_APPROVAL_REQUIRED,         http: 409, condition: "an audit is finalized without a CARRIED or ARBITRATION_CARRIED AUDIT_SETTLEMENT motion naming it" }
  - { id: ERR_SEGREGATION_OF_DUTIES,           http: 409, condition: "the finalizing administrator is the audit's own auditor, or the demanding administrator is the assessment's certifying actuary" }
  - { id: ERR_MOVER_CANNOT_VOTE,               http: 409, condition: "the trustee who moved a motion attempts to vote on it" }
  - { id: ERR_TRUSTEE_SEAT_INACTIVE,           http: 409, condition: "a trustee whose seat_status is RESIGNED attempts to move or vote on a motion" }
  - { id: ERR_FUND_GOVERNANCE_NOT_OPEN,        http: 409, condition: "a motion is moved while the fund's governance_posture is RESTRICTED or FROZEN" }
  - { id: ERR_FUND_GOVERNANCE_FROZEN,          http: 409, condition: "a withdrawal-liability demand is issued while the fund's governance_posture is FROZEN" }
  - { id: ERR_RECIPROCITY_AGREEMENT_NOT_EXECUTED, http: 409, condition: "a reciprocity transfer is accepted while the sister fund's reciprocity_agreement_status is NONE" }
  - { id: ERR_AUDIT_PERIOD_OVERLAP,            http: 409, condition: "a new audit's closed month interval intersects a non-ABANDONED audit on the same employer; abutting intervals are permitted" }
  - { id: ERR_REPORT_NOT_DELINQUENT,           http: 409, condition: "a delinquency assessment is requested while days_late == 0" }
  - { id: ERR_COVERAGE_HORIZON_EXCEEDED,       http: 409, condition: "accepting a reciprocity transfer would buy more coverage months than Fund.max_advance_coverage_months minus the participant's outstanding months" }
  - { id: ERR_PARTICIPANT_FUND_MISMATCH,       http: 409, condition: "a reported or audited participant belongs to a different fund than the employer" }
  - { id: ERR_TRUSTEE_FUND_MISMATCH,           http: 409, condition: "a trustee votes on a motion belonging to a different fund's board" }
  - { id: ERR_SISTER_FUND_INVALID,             http: 409, condition: "sister_fund_id names a fund whose fund_role is HOME, or the participant's own fund" }
  - { id: ERR_MOTION_SUBJECT_INVALID,          http: 409, condition: "subject_ref_id does not resolve to a row of the type the subject_type requires" }
  - { id: ERR_DUPLICATE_WORK_PERIOD,           http: 409, condition: "the employer already holds a non-SUPERSEDED report for that work_period and no amends_report_id was supplied" }
  - { id: ERR_AMENDMENT_TARGET_INVALID,        http: 409, condition: "amends_report_id names a report that is not POSTED, or belongs to a different employer or work_period" }
  - { id: ERR_DUPLICATE_VOTE,                  http: 409, condition: "the trustee has already cast a vote on this motion" }
  - { id: ERR_EMPTY_REPORT,                    http: 409, condition: "a contribution report is filed or posted with zero lines" }
  - { id: ERR_AUDIT_ROUND_LIMIT_REACHED,       http: 409, condition: "a DISPUTE response is submitted when round_count already equals MAX_AUDIT_ROUNDS (3)" }
  - { id: ERR_QUORUM_NOT_MET,                  http: 409, condition: "a tally is attempted before both bargaining parties have cast at least 2 non-ABSTAIN votes" }
  - { id: ERR_REMITTANCE_EXCEEDS_BALANCE,      http: 422, condition: "amount_cents exceeds total_contributions_due_cents minus amount_remitted_cents" }
  - { id: ERR_SETTLEMENT_EXCEEDS_ASSESSMENT,   http: 422, condition: "settlement_amount_cents exceeds the assessment's total_cents" }
  - { id: ERR_INSTALLMENT_AMOUNT_MISMATCH,     http: 422, condition: "an installment payment is not exactly equal to the installment's amount_cents" }
  - { id: ERR_NO_DELINQUENT_PRINCIPAL,         http: 422, condition: "a delinquency assessment is requested when total_contributions_due_cents minus amount_remitted_cents is 0 or negative" }
  - { id: ERR_UVB_POOL_EXHAUSTED,              http: 422, condition: "a withdrawal assessment is created when Fund.unallocated_uvb_cents is 0 or negative" }
  - { id: ERR_NO_PAYMENT_BASE,                 http: 422, condition: "the computed annual_payment_cents is 0, so no finite payment schedule exists" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FundAdministrator
    description: "Third-party administrator staff who run intake, posting, delinquency identification, settlements, demands, tallies and reciprocity decisions on behalf of the joint board"
    identity: opaque
    exclusive_operations:
      - "POST /funds"
      - "POST /employers"
      - "POST /participants"
      - "POST /trustees"
      - "POST /contribution-reports/{id}/post"
      - "POST /contribution-reports/{id}/delinquency-assessments"
      - "POST /delinquency-assessments/{id}/settle"
      - "POST /payroll-audits/{id}/finalize"
      - "POST /withdrawal-assessments"
      - "POST /withdrawal-assessments/{id}/demand"
      - "POST /withdrawal-assessments/{id}/review-decision"
      - "POST /board-motions/{id}/tally"
      - "POST /reciprocity-transfers"
      - "POST /reciprocity-transfers/{id}/decision"
      - "POST /funds/{id}/run-collections"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /contribution-reports (also ContributingEmployer)"
      - "POST /contribution-reports/{id}/remit (also ContributingEmployer)"
      - "all GET endpoints"

  - name: ContributingEmployer
    description: "A signatory employer acting on its own reports, audits, withdrawal assessments and installments"
    identity: "entity_backed:Employer"
    exclusive_operations:
      - "POST /payroll-audits/{id}/respond"
      - "POST /withdrawal-assessments/{id}/review-request"
      - "POST /payment-installments/{id}/pay"
    shared_operations:
      - "POST /contribution-reports (also FundAdministrator)"
      - "POST /contribution-reports/{id}/remit (also FundAdministrator)"
      - "GET reads of funds, employers, participants, coverage months, reports, lines, delinquency assessments, payroll audits, withdrawal assessments, installments and board motions"

  - name: Trustee
    description: "A board member appointed by one bargaining party; moves motions and votes as part of that party's bloc"
    identity: "entity_backed:Trustee"
    exclusive_operations:
      - "POST /board-motions"
      - "POST /motion-votes"
    shared_operations:
      - "GET /motion-votes and GET /motion-votes/{id} (also FundAdministrator)"
      - "GET /reciprocity-transfers and GET /reciprocity-transfers/{id} (also FundAdministrator)"
      - "all other GET endpoints"

  - name: PayrollAuditor
    description: "An independent payroll auditor engaged by the board; opens audits and issues findings but may never finalize them"
    identity: opaque
    exclusive_operations:
      - "POST /payroll-audits"
      - "POST /payroll-audits/{id}/findings"
    shared_operations:
      - "GET reads of funds, employers, participants, coverage months, reports, lines, payroll audits and board motions"

  - name: Actuary
    description: "The plan's enrolled actuary; certifies withdrawal-liability allocations against the UVB pool but may never issue the demand"
    identity: opaque
    exclusive_operations:
      - "POST /withdrawal-assessments/{id}/certify"
    shared_operations:
      - "GET reads of funds, employers, participants, coverage months, reports, lines, withdrawal assessments and installments"
