scenario: "2313. Government Cloud Authorization Program (cloud service provider compliance team): authorization path selection between agency sponsorship and program board review with impact level determination, control implementation against the baseline with customer responsibility matrix documentation, third-party assessment organization engagement with assessment plan and testing schedule, plan of action and milestones management for open findings with remediation deadlines by severity, authorization package submission and review with agency risk acceptance and authorization letter issuance, continuous monitoring with monthly scan submissions, annual assessments and significant change requests, boundary changes and new service inclusion with deviation requests and approval, agency reuse of the authorization with package access and incremental review"
domain_name: "government-cloud-authorization-program"
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: flat
  # Every entity is a top-level collection joined by explicit FK fields carried in
  # request bodies (`offering_id`, `engagement_id`, `authorization_id`, ...). Only
  # append-only children and pure sub-resource reads use nested URLs; no entity is
  # addressable exclusively through a parent path.

  state_machine_shape: cyclic
  # AuthorizationPackage loops SUBMITTED -> UNDER_REVIEW -> REVISION_REQUESTED ->
  # SUBMITTED (bounded at 3 rounds), PoamItem loops AWAITING_VERIFICATION <->
  # IN_REMEDIATION and CLOSED -> IN_REMEDIATION, ReuseGrant loops
  # NOTICE_ISSUED -> REUSE_ACCEPTED, AssessmentEngagement loops
  # PLAN_SUBMITTED -> DRAFT, CloudServiceOffering loops AUTHORIZED ->
  # CHANGE_UNDER_REVIEW -> AUTHORIZED. PoamItem and Authorization additionally
  # carry two independent state dimensions on one row (see §1.2).

  relationship_patterns:
    - one_to_many          # Offering -> DataCategory / ControlImplementation / PoamItem / SCR
    - many_to_many         # ReuseGrant is the junction between Authorization and Agency
    - self_referential     # PoamItem.supersedes_item_id -> PoamItem.id
    - cross_aggregate      # ControlImplementation.inherited_from_offering_id crosses offerings

  role_model: segregation_of_duties
  # The board member who routes a deviation may not decide it; the board member who
  # performs the completeness review of a package may not issue the program-board
  # authorization decision for it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:

  - name: Agency
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Federal agency display name."
      - name: agency_code
        type: string
        source: input
        description: "Short agency code; unique across all Agency rows."
        constraints: "2-8 uppercase letters; unique"
      - name: status
        type: enum
        source: input
        description: "Whether the agency may sponsor offerings or hold reuse grants."
        default: "ACTIVE"
        constraints: "ACTIVE | INACTIVE"
      - name: sponsorship_capacity
        type: integer
        source: input
        description: "Maximum number of offerings this agency may sponsor at once."
        default: 3
        constraints: ">= 0"
      - name: sponsored_offering_count
        type: integer
        source: system
        description: "Count of CloudServiceOffering rows whose sponsor_agency_id is this agency."
        default: 0
      - name: reuse_grant_count
        type: integer
        source: system
        description: "Count of ReuseGrant rows for this agency whose access_state != REVOKED."
        default: 0
      - name: open_notice_count
        type: integer
        source: system
        description: "Count of this agency's ReuseGrant rows currently in access_state NOTICE_ISSUED."
        default: 0

  - name: ControlBaseline
    parent: null
    common_fields: false
    fields:
      - name: impact_level
        type: enum
        source: input
        description: "FIPS-199 impact level this baseline applies to."
        constraints: "LOW | MODERATE | HIGH"
      - name: version_label
        type: string
        source: input
        description: "Human label for the baseline revision, e.g. REV5-MOD."
      - name: effective_from
        type: datetime
        source: input
        description: "ISO 8601 UTC instant from which this baseline is the selectable one for its impact_level."
      - name: retired
        type: boolean
        source: input
        description: "When true the baseline is excluded from baseline selection."
        default: false
      - name: families
        type: array
        source: input
        description: "Ordered control-family requirements; each element is { family_code: string, required_control_count: integer >= 0, priority_rank: integer >= 1 }. family_code values are unique within one baseline."
        constraints: "non-empty array; family_code unique; required_control_count >= 0"
      - name: total_required_controls
        type: integer
        source: computed
        description: "Sum of families[].required_control_count."

  - name: CloudServiceOffering
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Cloud service offering name."
      - name: provider_name
        type: string
        source: input
        description: "Cloud service provider organization name."
      - name: owner_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the CspComplianceLead that created the offering; every CSP mutation on this offering must present this id."
      - name: service_model
        type: enum
        source: input
        description: "Service model of the offering."
        constraints: "IAAS | PAAS | SAAS"
      - name: deployment_model
        type: enum
        source: input
        description: "Deployment model of the offering."
        constraints: "GOV_COMMUNITY | PUBLIC | HYBRID | PRIVATE"
      - name: external_dependency_impact_level
        type: enum
        source: input
        description: "Highest impact level of the external systems this offering leans on; escalates the final impact determination."
        default: "LOW"
        constraints: "LOW | MODERATE | HIGH"
      - name: assessment_budget_usd
        type: number
        source: input
        description: "Finance-approved spend authorization for third-party assessment; gates package submission."
        constraints: "> 0; 2 decimal places"
      - name: authorization_path
        type: enum
        source: system
        description: "Selected authorization path; null until path selection."
        default: null
        constraints: "AGENCY_SPONSORED | PROGRAM_BOARD | null"
      - name: sponsor_agency_id
        type: string
        source: input
        description: "FK -> Agency.id; the sponsoring agency, required for and only for the AGENCY_SPONSORED path; null otherwise."
        default: null
      - name: baseline_id
        type: string
        source: computed
        description: "FK -> ControlBaseline.id; selected by the baseline selector at impact determination; null before that."
        default: null
      - name: preliminary_impact_level
        type: enum
        source: computed
        description: "High-water mark over DECLARED and CONFIRMED data categories; recomputed on every data-category create/confirm/withdraw."
        default: null
        constraints: "LOW | MODERATE | HIGH | null"
      - name: final_impact_level
        type: enum
        source: computed
        description: "High-water mark over CONFIRMED data categories only, escalated by external_dependency_impact_level; set at impact determination."
        default: null
        constraints: "LOW | MODERATE | HIGH | null"
      - name: status
        type: enum
        source: system
        description: "Offering lifecycle state."
        default: "DRAFT"
        constraints: "DRAFT | CATEGORIZED | PATH_SELECTED | IN_ASSESSMENT | PACKAGE_SUBMITTED | AUTHORIZED | CHANGE_UNDER_REVIEW | SUSPENDED"
      - name: boundary_version
        type: integer
        source: system
        description: "Incremented by one whenever a BOUNDARY_CHANGE or NEW_SERVICE significant change request is approved."
        default: 1
      - name: included_service_count
        type: integer
        source: system
        description: "Number of services inside the authorization boundary; increased by approved NEW_SERVICE change requests."
        default: 0
      - name: open_package_count
        type: integer
        source: system
        description: "Count of this offering's AuthorizationPackage rows in status DRAFT, SUBMITTED, UNDER_REVIEW or REVISION_REQUESTED."
        default: 0
      - name: superseded_package_count
        type: integer
        source: system
        description: "Count of this offering's AuthorizationPackage rows in status SUPERSEDED."
        default: 0

  - name: DataCategory
    parent: CloudServiceOffering
    common_fields: true
    fields:
      - name: offering_id
        type: string
        source: system
        description: "FK -> CloudServiceOffering.id; taken from the creation path."
      - name: category_code
        type: string
        source: input
        description: "Information type code, e.g. PII or FINANCIAL; unique per offering."
        constraints: "unique per offering_id"
      - name: confidentiality_impact
        type: enum
        source: input
        description: "FIPS-199 confidentiality impact for this information type."
        constraints: "LOW | MODERATE | HIGH"
      - name: integrity_impact
        type: enum
        source: input
        description: "FIPS-199 integrity impact for this information type."
        constraints: "LOW | MODERATE | HIGH"
      - name: availability_impact
        type: enum
        source: input
        description: "FIPS-199 availability impact for this information type."
        constraints: "LOW | MODERATE | HIGH"
      - name: status
        type: enum
        source: system
        description: "Categorization review state."
        default: "DECLARED"
        constraints: "DECLARED | CONFIRMED | WITHDRAWN"
      - name: confirmed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the reviewer that confirmed or withdrew the category; null while DECLARED."
        default: null

  - name: ControlImplementation
    parent: null
    common_fields: true
    fields:
      - name: offering_id
        type: string
        source: input
        description: "FK -> CloudServiceOffering.id; the offering implementing the control."
      - name: inherited_from_offering_id
        type: string
        source: input
        description: "FK -> CloudServiceOffering.id; the already-authorized offering the control is inherited from, or null for a directly implemented control."
        default: null
      - name: control_id
        type: string
        source: input
        description: "Control identifier such as AC-2; unique per offering_id."
        constraints: "unique per offering_id"
      - name: family_code
        type: string
        source: input
        description: "Control family code such as AC; must match a families[].family_code of the offering's selected baseline."
      - name: implementation_status
        type: enum
        source: input
        description: "Implementation state of the control."
        default: "PLANNED"
        constraints: "IMPLEMENTED | PARTIALLY_IMPLEMENTED | PLANNED | ALTERNATIVE_IMPLEMENTATION | NOT_APPLICABLE"
      - name: crm_documented
        type: boolean
        source: input
        description: "True when the customer responsibility matrix entry for this control is written."
        default: false
      - name: customer_responsibility_text
        type: string
        source: input
        description: "Customer responsibility matrix prose; required and non-empty whenever crm_documented is true."
        default: null

  - name: AssessmentEngagement
    parent: null
    common_fields: true
    fields:
      - name: offering_id
        type: string
        source: input
        description: "FK -> CloudServiceOffering.id; the offering being assessed."
      - name: assessor_org_name
        type: string
        source: input
        description: "Third-party assessment organization name."
      - name: assessor_user_id
        type: string
        source: input
        description: "Opaque X-User-ID of the ThirdPartyAssessor authorized to act on this engagement."
      - name: contracted_hours
        type: number
        source: input
        description: "Total assessor hours purchased for the engagement."
        constraints: "> 0; 2 decimal places"
      - name: allocated_hours
        type: number
        source: computed
        description: "Sum of TestSlot.hours for this engagement whose status is SCHEDULED or COMPLETED."
        default: 0
      - name: unallocated_hours
        type: number
        source: computed
        description: "contracted_hours - allocated_hours; never negative."
      - name: labor_cost_usd
        type: number
        source: input
        description: "Assessor labor price before program surcharge and hour overage."
        constraints: "> 0; 2 decimal places"
      - name: surcharge_rate
        type: number
        source: computed
        description: "Program surcharge rate selected from the labor_cost_usd tier."
      - name: program_surcharge_usd
        type: number
        source: computed
        description: "round(labor_cost_usd * surcharge_rate, 2)."
      - name: hour_overage_usd
        type: number
        source: computed
        description: "round(max(0, contracted_hours - impact-level hour allowance) * 120.00, 2)."
      - name: total_cost_usd
        type: number
        source: computed
        description: "round(labor_cost_usd + program_surcharge_usd + hour_overage_usd, 2)."
      - name: planned_test_start
        type: datetime
        source: input
        description: "Assessment plan testing window start; set when the plan is submitted."
        default: null
      - name: planned_test_end
        type: datetime
        source: input
        description: "Assessment plan testing window end; set when the plan is submitted."
        default: null
      - name: status
        type: enum
        source: system
        description: "Engagement lifecycle state."
        default: "DRAFT"
        constraints: "DRAFT | PLAN_SUBMITTED | PLAN_APPROVED | TESTING | REPORT_DELIVERED | VOIDED"
      - name: plan_revision_round
        type: integer
        source: system
        description: "Number of times the assessment plan was sent back to DRAFT."
        default: 0
      - name: findings_reported_count
        type: integer
        source: system
        description: "Number of PoamItem rows created by this engagement's report delivery."
        default: 0

  - name: TestSlot
    parent: AssessmentEngagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> AssessmentEngagement.id; the engagement whose hour pool funds this slot."
      - name: family_code
        type: string
        source: input
        description: "Control family being tested in this slot."
      - name: start_at
        type: datetime
        source: input
        description: "Slot start instant, inclusive."
      - name: end_at
        type: datetime
        source: input
        description: "Slot end instant, exclusive."
      - name: hours
        type: number
        source: input
        description: "Assessor hours drawn from the engagement pool for this slot."
        constraints: "> 0; 2 decimal places"
      - name: status
        type: enum
        source: system
        description: "Slot state."
        default: "SCHEDULED"
        constraints: "SCHEDULED | COMPLETED | CANCELLED"

  - name: AuthorizationPackage
    parent: null
    common_fields: true
    fields:
      - name: offering_id
        type: string
        source: input
        description: "FK -> CloudServiceOffering.id; the offering the package authorizes."
      - name: engagement_id
        type: string
        source: input
        description: "FK -> AssessmentEngagement.id; the engagement whose report backs the package."
      - name: authorization_path
        type: enum
        source: system
        description: "Copied from the offering at creation; decides who may issue the decision."
        constraints: "AGENCY_SPONSORED | PROGRAM_BOARD"
      - name: status
        type: enum
        source: system
        description: "Package review state."
        default: "DRAFT"
        constraints: "DRAFT | SUBMITTED | UNDER_REVIEW | REVISION_REQUESTED | AUTHORIZED | REJECTED | SUPERSEDED"
      - name: submission_round
        type: integer
        source: system
        description: "Number of times the package has been submitted; a fourth submission is refused."
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent submission; the as-of instant of the at_submission risk variant."
        default: null
      - name: crm_coverage_pct
        type: number
        source: computed
        description: "Customer-responsibility-matrix coverage percentage frozen at submission."
        default: null
      - name: residual_risk_score_at_submission
        type: number
        source: computed
        description: "residual_risk_score, at_submission variant, frozen at submission."
        default: null
      - name: open_findings_at_submission
        type: integer
        source: computed
        description: "Count of the offering's PoamItem rows with remediation_status != CLOSED at submission."
        default: null
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ProgramBoardReviewer that moved the package to UNDER_REVIEW."
        default: null
      - name: revision_note
        type: string
        source: input
        description: "Reviewer note recorded with the most recent revision request."
        default: null
      - name: letter_reference
        type: string
        source: system
        description: "Authorization letter reference minted on AUTHORIZE, format AUTH-LTR-<submission_round>-<agency_code or BOARD>."
        default: null

  - name: PoamItem
    parent: null
    common_fields: true
    fields:
      - name: offering_id
        type: string
        source: input
        description: "FK -> CloudServiceOffering.id; the offering carrying the finding."
      - name: supersedes_item_id
        type: string
        source: input
        description: "FK -> PoamItem.id; the earlier finding this item replaces, or null."
        default: null
      - name: control_id
        type: string
        source: input
        description: "Control identifier the finding was raised against."
      - name: severity
        type: enum
        source: input
        description: "Finding severity; drives the remediation deadline and the risk weight."
        constraints: "HIGH | MODERATE | LOW"
      - name: source
        type: enum
        source: input
        description: "Where the finding came from; ASSESSMENT items are re-anchored at authorization, others are not."
        default: "SELF_IDENTIFIED"
        constraints: "ASSESSMENT | SCAN | SELF_IDENTIFIED"
      - name: detected_at
        type: datetime
        source: input
        description: "Instant the finding was detected; must not be after the logical clock."
      - name: anchor_at
        type: datetime
        source: computed
        description: "Deadline anchor; equals detected_at at creation and is re-anchored to Authorization.authorized_at for ASSESSMENT items when authorized_at > detected_at."
      - name: granted_extension_days
        type: integer
        source: computed
        description: "Extension days granted by approved OPERATIONAL_REQUIREMENT deviations; reset to 0 when a deviation is denied."
        default: 0
      - name: deadline_at
        type: datetime
        source: computed
        description: "anchor_at + severity base days + granted_extension_days."
      - name: remediation_status
        type: enum
        source: system
        description: "Remediation dimension; evolves independently of risk_disposition on the same row."
        default: "OPEN"
        constraints: "OPEN | IN_REMEDIATION | AWAITING_VERIFICATION | CLOSED"
      - name: risk_disposition
        type: enum
        source: system
        description: "Risk-disposition dimension; evolves independently of remediation_status on the same row."
        default: "NONE"
        constraints: "NONE | DEVIATION_REQUESTED | EXTENSION_GRANTED | RISK_ACCEPTED | FALSE_POSITIVE_ACCEPTED"
      - name: closure_reason
        type: enum
        source: system
        description: "Why the item reached remediation_status CLOSED; null while not CLOSED."
        default: null
        constraints: "REMEDIATED | FALSE_POSITIVE | SUPERSEDED | null"
      - name: reopen_count
        type: integer
        source: system
        description: "Number of times the item left AWAITING_VERIFICATION or CLOSED back to IN_REMEDIATION."
        default: 0

  - name: DeviationRequest
    parent: null
    common_fields: true
    fields:
      - name: poam_item_id
        type: string
        source: input
        description: "FK -> PoamItem.id; the finding the deviation is filed against."
      - name: kind
        type: enum
        source: input
        description: "Deviation kind; decides the mandatory review queue and the approval side effects."
        constraints: "OPERATIONAL_REQUIREMENT | FALSE_POSITIVE | RISK_ADJUSTMENT"
      - name: requested_extension_days
        type: integer
        source: input
        description: "Requested remediation-deadline extension in days; only honored for kind OPERATIONAL_REQUIREMENT."
        default: 0
        constraints: "0 <= value <= 180"
      - name: justification
        type: string
        source: input
        description: "Narrative justification recorded with the request."
        constraints: "non-empty"
      - name: status
        type: enum
        source: system
        description: "Deviation review state."
        default: "SUBMITTED"
        constraints: "SUBMITTED | BOARD_REVIEW | AGENCY_REVIEW | APPROVED | DENIED"
      - name: review_queue
        type: enum
        source: system
        description: "Queue the request was routed to; null while SUBMITTED."
        default: null
        constraints: "BOARD | AGENCY | null"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the CspComplianceLead that filed the request."
      - name: routed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ProgramBoardReviewer that routed the request; null while SUBMITTED."
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the official that approved or denied the request; null before the decision."
        default: null
      - name: granted_extension_days
        type: integer
        source: computed
        description: "requested_extension_days when approved with kind OPERATIONAL_REQUIREMENT, otherwise 0."
        default: 0

  - name: Authorization
    parent: null
    common_fields: true
    fields:
      - name: offering_id
        type: string
        source: system
        description: "FK -> CloudServiceOffering.id; the authorized offering."
      - name: package_id
        type: string
        source: system
        description: "FK -> AuthorizationPackage.id; the package that produced this authorization."
      - name: authorization_path
        type: enum
        source: system
        description: "Path the authorization was granted through."
        constraints: "AGENCY_SPONSORED | PROGRAM_BOARD"
      - name: impact_level
        type: enum
        source: system
        description: "Offering final_impact_level frozen at authorization."
        constraints: "LOW | MODERATE | HIGH"
      - name: authorized_at
        type: datetime
        source: system
        description: "Logical-clock instant the authorization letter was issued."
      - name: expires_at
        type: datetime
        source: computed
        description: "authorized_at + 1095 days."
      - name: letter_reference
        type: string
        source: system
        description: "Authorization letter reference copied from the package."
      - name: authorization_status
        type: enum
        source: system
        description: "Authorization dimension; evolves independently of monitoring_posture on the same row."
        default: "AUTHORIZED"
        constraints: "AUTHORIZED | SUSPENDED | REVOKED | EXPIRED"
      - name: monitoring_posture
        type: enum
        source: system
        description: "Continuous-monitoring dimension; evolves independently of authorization_status on the same row."
        default: "ACTIVE"
        constraints: "ACTIVE | AT_RISK | ESCALATED"
      - name: consecutive_deficient_periods
        type: integer
        source: system
        description: "Run length of consecutive CLOSED_DEFICIENT monitoring periods; reset to 0 by a CLOSED_COMPLIANT close."
        default: 0
      - name: residual_risk_score
        type: number
        source: computed
        description: "Stored residual risk, at_monitoring_review variant, refreshed only by the mutations listed in §1.3; can lag the live value when the clock advances past a deadline."
        default: 0
      - name: poam_risk_tier
        type: enum
        source: computed
        description: "Tier derived from residual_risk_score."
        default: "NONE"
        constraints: "NONE | LOW | MODERATE | ELEVATED"
      - name: total_findings_count
        type: integer
        source: computed
        description: "Count of all PoamItem rows for offering_id."
        default: 0
      - name: open_findings_count
        type: integer
        source: computed
        description: "Count of PoamItem rows for offering_id with remediation_status != CLOSED."
        default: 0
      - name: closed_findings_count
        type: integer
        source: computed
        description: "Count of PoamItem rows for offering_id with remediation_status == CLOSED."
        default: 0
      - name: risk_accepted_findings_count
        type: integer
        source: computed
        description: "Count of PoamItem rows for offering_id with risk_disposition == RISK_ACCEPTED."
        default: 0
      - name: reuse_seats_total
        type: integer
        source: system
        description: "Size of the agency reuse seat pool for this authorization."
        default: 5
      - name: reuse_seats_granted
        type: integer
        source: computed
        description: "Count of this authorization's ReuseGrant rows with access_state != REVOKED."
        default: 0
      - name: reuse_seats_available
        type: integer
        source: computed
        description: "reuse_seats_total - reuse_seats_granted."
        default: 5

  - name: MonitoringPeriod
    parent: Authorization
    common_fields: true
    fields:
      - name: authorization_id
        type: string
        source: input
        description: "FK -> Authorization.id; the authorization under continuous monitoring."
      - name: period_month
        type: string
        source: input
        description: "Reporting month in YYYY-MM form; unique per authorization_id."
        constraints: "matches ^\\d{4}-(0[1-9]|1[0-2])$; unique per authorization_id"
      - name: window_start
        type: datetime
        source: computed
        description: "First instant of period_month, inclusive."
      - name: window_end
        type: datetime
        source: computed
        description: "First instant of the month after period_month, exclusive."
      - name: scan_due_at
        type: datetime
        source: computed
        description: "window_end + 5 days."
      - name: status
        type: enum
        source: system
        description: "Period state."
        default: "OPEN"
        constraints: "OPEN | CLOSED_COMPLIANT | CLOSED_DEFICIENT"
      - name: accepted_submission_count
        type: integer
        source: system
        description: "Number of ScanSubmission rows for this period with status ACCEPTED."
        default: 0
      - name: late_submission_count
        type: integer
        source: system
        description: "Number of ScanSubmission rows for this period with status LATE_ACCEPTED."
        default: 0
      - name: rejected_submission_count
        type: integer
        source: system
        description: "Number of ScanSubmission rows for this period with status REJECTED."
        default: 0
      - name: covered_scan_types
        type: array
        source: computed
        description: "Sorted union of scan_types over this period's ScanSubmission rows with status ACCEPTED or LATE_ACCEPTED."
        default: []
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the close; null while OPEN."
        default: null

  - name: ScanSubmission
    parent: MonitoringPeriod
    common_fields: false
    fields:
      - name: monitoring_period_id
        type: string
        source: system
        description: "FK -> MonitoringPeriod.id; taken from the creation path."
      - name: scan_types
        type: array
        source: input
        description: "Scan types contained in this submission; each element is one of INFRASTRUCTURE, WEB_APP, DATABASE, CONTAINER."
        constraints: "non-empty; no duplicates"
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the submission."
      - name: days_late
        type: integer
        source: computed
        description: "Whole 24-hour units by which submitted_at passes the period's scan_due_at; 0 when not late."
      - name: status
        type: enum
        source: computed
        description: "Timeliness verdict of the submission."
        constraints: "ACCEPTED | LATE_ACCEPTED | REJECTED"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the CspComplianceLead that submitted the scans."

  - name: SignificantChangeRequest
    parent: null
    common_fields: true
    fields:
      - name: offering_id
        type: string
        source: input
        description: "FK -> CloudServiceOffering.id; the authorized offering being changed."
      - name: change_kind
        type: enum
        source: input
        description: "Nature of the significant change."
        constraints: "BOUNDARY_CHANGE | NEW_SERVICE | TECH_REFRESH"
      - name: description
        type: string
        source: input
        description: "Narrative description of the change."
        constraints: "non-empty"
      - name: window_start
        type: datetime
        source: input
        description: "Implementation window start, inclusive."
      - name: window_end
        type: datetime
        source: input
        description: "Implementation window end, inclusive."
      - name: added_service_count
        type: integer
        source: input
        description: "Number of services the change adds to the boundary."
        default: 0
        constraints: ">= 0"
      - name: requires_reassessment
        type: boolean
        source: computed
        description: "True when change_kind == BOUNDARY_CHANGE or added_service_count >= 3."
      - name: status
        type: enum
        source: system
        description: "Change request review state."
        default: "SUBMITTED"
        constraints: "SUBMITTED | APPROVED | DENIED"
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the official that decided the request; null while SUBMITTED."
        default: null

  - name: ReuseGrant
    parent: null
    common_fields: true
    fields:
      - name: authorization_id
        type: string
        source: input
        description: "FK -> Authorization.id; the authorization being reused."
      - name: agency_id
        type: string
        source: input
        description: "FK -> Agency.id; the agency reusing the authorization."
      - name: access_state
        type: enum
        source: system
        description: "Reuse lifecycle state."
        default: "REQUESTED"
        constraints: "REQUESTED | PACKAGE_ACCESS_GRANTED | INCREMENTAL_REVIEW | REUSE_ACCEPTED | NOTICE_ISSUED | REVOKED"
      - name: incremental_review_findings_count
        type: integer
        source: system
        description: "Findings count recorded by the most recent incremental review."
        default: 0
      - name: reuse_accepted_at
        type: datetime
        source: system
        description: "Logical-clock instant the agency accepted the reuse; null before that."
        default: null
      - name: notice_count
        type: integer
        source: system
        description: "Number of times this grant has been moved to NOTICE_ISSUED."
        default: 0
      - name: revoked_reason
        type: enum
        source: system
        description: "Why the grant was revoked; null while not REVOKED."
        default: null
        constraints: "AGENCY_REQUEST | POSTURE_ESCALATION | AUTHORIZATION_REVOKED | null"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  - entity: CloudServiceOffering
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: CATEGORIZED
        trigger: "POST /offerings/{id}/impact-determination"
        actor: ProgramBoardReviewer
        preconditions:
          - "offering.status == DRAFT"
          - "at least one DataCategory of the offering has status == CONFIRMED, else ERR_NO_CONFIRMED_DATA_CATEGORY"
          - "the baseline selector finds a candidate, else ERR_BASELINE_NOT_AVAILABLE"
        side_effects:
          - "runs calculations.impact_level_determination variant final; writes offering.final_impact_level"
          - "writes offering.baseline_id from the baseline selector"
          - "increments offering.version by 1"
      - from: CATEGORIZED
        to: PATH_SELECTED
        trigger: "POST /offerings/{id}/path-selection"
        actor: CspComplianceLead
        preconditions:
          - "offering.status == CATEGORIZED"
          - "for AGENCY_SPONSORED: sponsor_agency_id present, that Agency.status == ACTIVE, and Agency.sponsored_offering_count < Agency.sponsorship_capacity, else ERR_SPONSORSHIP_CAPACITY_EXCEEDED"
          - "for PROGRAM_BOARD: sponsor_agency_id absent, else ERR_INVALID_REQUEST"
        side_effects:
          - "writes offering.authorization_path and offering.sponsor_agency_id"
          - "for AGENCY_SPONSORED: increments Agency.sponsored_offering_count by 1 and Agency.version by 1"
          - "increments offering.version by 1"
      - from: PATH_SELECTED
        to: IN_ASSESSMENT
        trigger: "POST /assessment-engagements/{id}/plan-approval with decision APPROVE"
        actor: ProgramBoardReviewer | AgencyAuthorizingOfficial
        preconditions:
          - "engagement.offering_id == offering.id and offering.status == PATH_SELECTED"
        side_effects:
          - "increments offering.version by 1"
        note: "Bubble-up: driven by the engagement transition PLAN_SUBMITTED -> PLAN_APPROVED."
      - from: IN_ASSESSMENT
        to: PACKAGE_SUBMITTED
        trigger: "POST /authorization-packages/{id}/submit"
        actor: CspComplianceLead
        preconditions:
          - "package.offering_id == offering.id"
          - "offering.status IN {IN_ASSESSMENT, PACKAGE_SUBMITTED}"
        side_effects:
          - "increments offering.version by 1"
      - from: PACKAGE_SUBMITTED
        to: AUTHORIZED
        trigger: "POST /authorization-packages/{id}/decision with decision AUTHORIZE"
        actor: ProgramBoardReviewer | AgencyAuthorizingOfficial
        preconditions:
          - "an Authorization row was just created for this offering"
        side_effects:
          - "increments offering.version by 1"
          - "causes the first MonitoringPeriod for the month containing Authorization.authorized_at to be created (cascade link 3 of transitive_cascade authorize_package_chain)"
        note: "Cascade link 2: caused by the Authorization row creation, not directly by the endpoint."
      - from: AUTHORIZED
        to: CHANGE_UNDER_REVIEW
        trigger: "POST /significant-change-requests"
        actor: CspComplianceLead
        preconditions:
          - "offering.status == AUTHORIZED"
        side_effects:
          - "increments offering.version by 1"
      - from: CHANGE_UNDER_REVIEW
        to: AUTHORIZED
        trigger: "POST /significant-change-requests/{id}/decision"
        actor: ProgramBoardReviewer | AgencyAuthorizingOfficial
        preconditions:
          - "no other SignificantChangeRequest of this offering remains in status SUBMITTED"
        side_effects:
          - "on APPROVED with change_kind IN {BOUNDARY_CHANGE, NEW_SERVICE}: increments offering.boundary_version by 1"
          - "on APPROVED with change_kind == NEW_SERVICE: increases offering.included_service_count by added_service_count"
          - "increments offering.version by 1"
        note: "Revision loop: the offering returns to AUTHORIZED whether the change is approved or denied."
      - from: AUTHORIZED
        to: SUSPENDED
        trigger: "system event: MonitoringPeriod close drives Authorization.authorization_status to SUSPENDED"
        actor: system
        preconditions:
          - "authorization.authorization_status just became SUSPENDED"
        side_effects:
          - "increments offering.version by 1"
      - from: SUSPENDED
        to: AUTHORIZED
        trigger: "system event: MonitoringPeriod close drives Authorization.authorization_status back to AUTHORIZED"
        actor: system
        preconditions:
          - "authorization.authorization_status just became AUTHORIZED again after a CLOSED_COMPLIANT period"
        side_effects:
          - "increments offering.version by 1"

  - entity: DataCategory
    initial_state: DECLARED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DECLARED
        to: CONFIRMED
        trigger: "POST /data-categories/{id}/confirm with decision CONFIRM"
        actor: ProgramBoardReviewer | AgencyAuthorizingOfficial
        preconditions:
          - "category.status == DECLARED"
          - "offering.status == DRAFT"
        side_effects:
          - "writes confirmed_by_user_id"
          - "recomputes offering.preliminary_impact_level (variant preliminary) and increments offering.version by 1"
      - from: DECLARED
        to: WITHDRAWN
        trigger: "POST /data-categories/{id}/confirm with decision WITHDRAW"
        actor: ProgramBoardReviewer | AgencyAuthorizingOfficial
        preconditions:
          - "category.status == DECLARED"
          - "offering.status == DRAFT"
        side_effects:
          - "writes confirmed_by_user_id"
          - "recomputes offering.preliminary_impact_level over the remaining DECLARED and CONFIRMED categories and increments offering.version by 1"

  - entity: AssessmentEngagement
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: PLAN_SUBMITTED
        trigger: "POST /assessment-engagements/{id}/plan"
        actor: ThirdPartyAssessor
        preconditions:
          - "engagement.status == DRAFT"
          - "X-User-ID == engagement.assessor_user_id, else ERR_NOT_RESOURCE_OWNER"
          - "planned_test_start < planned_test_end, else ERR_WINDOW_INVALID"
        side_effects:
          - "writes planned_test_start and planned_test_end"
      - from: PLAN_SUBMITTED
        to: DRAFT
        trigger: "POST /assessment-engagements/{id}/plan-approval with decision REJECT"
        actor: ProgramBoardReviewer | AgencyAuthorizingOfficial
        preconditions:
          - "engagement.status == PLAN_SUBMITTED"
        side_effects:
          - "increments plan_revision_round by 1"
          - "clears planned_test_start and planned_test_end"
        note: "Revision loop back to DRAFT."
      - from: PLAN_SUBMITTED
        to: PLAN_APPROVED
        trigger: "POST /assessment-engagements/{id}/plan-approval with decision APPROVE"
        actor: ProgramBoardReviewer | AgencyAuthorizingOfficial
        preconditions:
          - "engagement.status == PLAN_SUBMITTED"
          - "for offering.authorization_path == AGENCY_SPONSORED the actor must be AgencyAuthorizingOfficial with X-User-ID == offering.sponsor_agency_id, else ERR_SPONSOR_AGENCY_MISMATCH; for PROGRAM_BOARD the actor must be ProgramBoardReviewer, else ERR_WRONG_REVIEW_QUEUE"
        side_effects:
          - "drives offering PATH_SELECTED -> IN_ASSESSMENT"
      - from: PLAN_APPROVED
        to: TESTING
        trigger: "POST /test-slots (first slot of the engagement)"
        actor: ThirdPartyAssessor
        preconditions:
          - "engagement.status == PLAN_APPROVED"
        side_effects:
          - "allocates the slot hours out of the engagement pool (see calculations.engagement_hour_ledger)"
      - from: TESTING
        to: REPORT_DELIVERED
        trigger: "POST /assessment-engagements/{id}/report"
        actor: ThirdPartyAssessor
        preconditions:
          - "engagement.status == TESTING"
          - "X-User-ID == engagement.assessor_user_id, else ERR_NOT_RESOURCE_OWNER"
          - "every findings[].detected_at <= logical clock, else ERR_DETECTION_DATE_IN_FUTURE"
        side_effects:
          - "creates one PoamItem per findings[] element with source ASSESSMENT, anchor_at = detected_at, deadline_at from calculations.poam_remediation_deadline"
          - "sets findings_reported_count to the number of created items"
          - "moves every TestSlot of the engagement with status SCHEDULED to COMPLETED (allocated_hours unchanged)"
      - from: PLAN_APPROVED
        to: VOIDED
        trigger: "system event: the engagement's package is REJECTED after exhausting the revision limit"
        actor: system
        preconditions:
          - "package.status just became REJECTED with submission_round == 3"
        side_effects:
          - "cancels every TestSlot of the engagement in status SCHEDULED and returns their hours to unallocated_hours (cascade link 3 of transitive_cascade revision_limit_void_chain)"
      - from: TESTING
        to: VOIDED
        trigger: "system event: the engagement's package is REJECTED after exhausting the revision limit"
        actor: system
        preconditions:
          - "package.status just became REJECTED with submission_round == 3"
        side_effects:
          - "cancels every TestSlot of the engagement in status SCHEDULED and returns their hours to unallocated_hours (cascade link 3 of transitive_cascade revision_limit_void_chain)"
      - from: REPORT_DELIVERED
        to: VOIDED
        trigger: "system event: the engagement's package is REJECTED after exhausting the revision limit"
        actor: system
        preconditions:
          - "package.status just became REJECTED with submission_round == 3"
        side_effects:
          - "cancels every TestSlot of the engagement in status SCHEDULED and returns their hours to unallocated_hours (cascade link 3 of transitive_cascade revision_limit_void_chain)"

  - entity: TestSlot
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /test-slots/{id}/cancel"
        actor: ThirdPartyAssessor
        preconditions:
          - "slot.status == SCHEDULED, else ERR_ALREADY_TERMINAL"
          - "X-User-ID == engagement.assessor_user_id, else ERR_NOT_RESOURCE_OWNER"
        side_effects:
          - "returns slot.hours to engagement.unallocated_hours and removes them from engagement.allocated_hours (compensating_invariant engagement_hour_conservation)"
          - "increments engagement.version by 1"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "system event: POST /assessment-engagements/{id}/report"
        actor: system
        preconditions:
          - "engagement moved TESTING -> REPORT_DELIVERED"
        side_effects:
          - "engagement.allocated_hours unchanged: COMPLETED slots stay inside allocated_hours"

  - entity: AuthorizationPackage
    initial_state: DRAFT
    terminal_states: [AUTHORIZED, REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /authorization-packages/{id}/submit"
        actor: CspComplianceLead
        preconditions:
          - "package.status IN {DRAFT, REVISION_REQUESTED}"
          - "engagement.status == REPORT_DELIVERED, else ERR_ENGAGEMENT_REPORT_NOT_DELIVERED"
          - "submission_round < 3 holds by construction: a revision request raised at submission_round 3 rejects the package instead of returning it to REVISION_REQUESTED, so no submittable package ever carries submission_round 3"
          - "crm_coverage_pct >= 90.00, else ERR_CRM_COVERAGE_INSUFFICIENT"
          - "residual_risk_score_at_submission < 50.00, else ERR_RESIDUAL_RISK_TOO_HIGH"
          - "no PoamItem of the offering with severity HIGH, remediation_status != CLOSED and deadline_at <= submitted_at, else ERR_OVERDUE_HIGH_FINDINGS"
          - "engagement.total_cost_usd <= offering.assessment_budget_usd, else ERR_ASSESSMENT_BUDGET_EXCEEDED"
        side_effects:
          - "sets submitted_at to the logical clock and increments submission_round by 1"
          - "freezes crm_coverage_pct (calculations.crm_documentation_coverage), residual_risk_score_at_submission (calculations.residual_risk_score variant at_submission) and open_findings_at_submission"
          - "drives offering IN_ASSESSMENT -> PACKAGE_SUBMITTED"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /authorization-packages/{id}/submit"
        actor: CspComplianceLead
        preconditions:
          - "same preconditions as DRAFT -> SUBMITTED"
        side_effects:
          - "same side effects as DRAFT -> SUBMITTED; clears revision_note"
        note: "Cycle edge: this is the resubmission leg of the review loop."
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /authorization-packages/{id}/review"
        actor: ProgramBoardReviewer
        preconditions:
          - "package.status == SUBMITTED"
        side_effects:
          - "writes reviewed_by_user_id from X-User-ID"
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /authorization-packages/{id}/revision-request"
        actor: ProgramBoardReviewer
        preconditions:
          - "package.status == UNDER_REVIEW"
          - "submission_round < 3, else the package is REJECTED instead (see next transition)"
        side_effects:
          - "writes revision_note"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /authorization-packages/{id}/revision-request when submission_round == 3"
        actor: ProgramBoardReviewer
        preconditions:
          - "package.status == UNDER_REVIEW and submission_round == 3"
        side_effects:
          - "writes revision_note"
          - "causes the backing AssessmentEngagement to move to VOIDED (cascade link 2 of transitive_cascade revision_limit_void_chain)"
          - "decrements offering.open_package_count by 1"
      - from: UNDER_REVIEW
        to: AUTHORIZED
        trigger: "POST /authorization-packages/{id}/decision with decision AUTHORIZE"
        actor: ProgramBoardReviewer | AgencyAuthorizingOfficial
        preconditions:
          - "package.status == UNDER_REVIEW"
          - "for authorization_path == AGENCY_SPONSORED the actor must be AgencyAuthorizingOfficial with X-User-ID == offering.sponsor_agency_id, else ERR_SPONSOR_AGENCY_MISMATCH"
          - "for authorization_path == PROGRAM_BOARD the actor must be ProgramBoardReviewer, else ERR_WRONG_REVIEW_QUEUE, and X-User-ID != reviewed_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "mints letter_reference"
          - "creates an Authorization row (authorization_status AUTHORIZED, monitoring_posture ACTIVE, authorized_at = logical clock, expires_at = authorized_at + 1095 days, reuse_seats_total 5) -- cascade link 1 of transitive_cascade authorize_package_chain"
          - "decrements offering.open_package_count by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /authorization-packages/{id}/decision with decision REJECT"
        actor: ProgramBoardReviewer | AgencyAuthorizingOfficial
        preconditions:
          - "package.status == UNDER_REVIEW"
          - "same actor rules as the AUTHORIZE leg"
        side_effects:
          - "decrements offering.open_package_count by 1"
          - "no Authorization row is created and the offering stays in PACKAGE_SUBMITTED"
      - from: REVISION_REQUESTED
        to: SUPERSEDED
        trigger: "system event: POST /authorization-packages creates a newer package for the same offering"
        actor: system
        preconditions:
          - "a new AuthorizationPackage was created for the same offering_id"
        side_effects:
          - "decrements offering.open_package_count by 1 and increments offering.superseded_package_count by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system event: POST /authorization-packages creates a newer package for the same offering"
        actor: system
        preconditions:
          - "a new AuthorizationPackage was created for the same offering_id"
        side_effects:
          - "decrements offering.open_package_count by 1 and increments offering.superseded_package_count by 1"

  - entity: PoamItem
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: "remediation_status OPEN"
        to: "remediation_status IN_REMEDIATION"
        trigger: "POST /poam-items/{id}/remediation with action START"
        actor: CspComplianceLead
        preconditions:
          - "remediation_status == OPEN"
        side_effects:
          - "recomputes Authorization.residual_risk_score when the offering has an Authorization"
        note: "Remediation dimension; risk_disposition is untouched."
      - from: "remediation_status IN_REMEDIATION"
        to: "remediation_status AWAITING_VERIFICATION"
        trigger: "POST /poam-items/{id}/remediation with action SUBMIT_EVIDENCE"
        actor: CspComplianceLead
        preconditions:
          - "remediation_status == IN_REMEDIATION"
        side_effects: []
      - from: "remediation_status AWAITING_VERIFICATION"
        to: "remediation_status CLOSED"
        trigger: "POST /poam-items/{id}/remediation with action VERIFY_CLOSE"
        actor: ThirdPartyAssessor
        preconditions:
          - "remediation_status == AWAITING_VERIFICATION"
          - "no DeviationRequest of this item has status IN {SUBMITTED, BOARD_REVIEW, AGENCY_REVIEW}, else ERR_DEVIATION_PENDING_ON_ITEM"
        side_effects:
          - "sets closure_reason REMEDIATED"
          - "recomputes Authorization.open_findings_count, closed_findings_count and residual_risk_score"
      - from: "remediation_status AWAITING_VERIFICATION"
        to: "remediation_status IN_REMEDIATION"
        trigger: "POST /poam-items/{id}/remediation with action REOPEN"
        actor: ThirdPartyAssessor
        preconditions:
          - "remediation_status == AWAITING_VERIFICATION"
        side_effects:
          - "increments reopen_count by 1"
        note: "Cycle edge inside the remediation dimension."
      - from: "remediation_status CLOSED"
        to: "remediation_status IN_REMEDIATION"
        trigger: "POST /poam-items/{id}/remediation with action REOPEN"
        actor: ThirdPartyAssessor
        preconditions:
          - "remediation_status == CLOSED and closure_reason == REMEDIATED"
        side_effects:
          - "clears closure_reason"
          - "increments reopen_count by 1"
          - "recomputes Authorization.open_findings_count, closed_findings_count and residual_risk_score (compensating_invariant poam_status_partition_conservation)"
      - from: "remediation_status IN {OPEN, IN_REMEDIATION, AWAITING_VERIFICATION}"
        to: "remediation_status CLOSED"
        trigger: "system event: POST /poam-items creates a newer item whose supersedes_item_id points here"
        actor: system
        preconditions:
          - "the superseding item's offering_id == this item's offering_id, else ERR_SUPERSEDED_ITEM_MISMATCH"
          - "this item's remediation_status != CLOSED, else ERR_ALREADY_TERMINAL"
        side_effects:
          - "sets closure_reason SUPERSEDED"
          - "recomputes Authorization counters and residual_risk_score (cascade link 2 of transitive_cascade supersede_item_chain)"
      - from: "risk_disposition NONE"
        to: "risk_disposition DEVIATION_REQUESTED"
        trigger: "POST /deviation-requests"
        actor: CspComplianceLead
        preconditions:
          - "risk_disposition == NONE"
          - "remediation_status != CLOSED, else ERR_ALREADY_TERMINAL"
        side_effects: []
        note: "Risk-disposition dimension; remediation_status is untouched."
      - from: "risk_disposition DEVIATION_REQUESTED"
        to: "risk_disposition EXTENSION_GRANTED"
        trigger: "POST /deviation-requests/{id}/decision with decision APPROVE and kind OPERATIONAL_REQUIREMENT"
        actor: ProgramBoardReviewer
        preconditions:
          - "deviation.status == BOARD_REVIEW"
        side_effects:
          - "sets granted_extension_days to the requested days and recomputes deadline_at"
          - "recomputes Authorization.residual_risk_score"
      - from: "risk_disposition DEVIATION_REQUESTED"
        to: "risk_disposition RISK_ACCEPTED"
        trigger: "POST /deviation-requests/{id}/decision with decision APPROVE and kind RISK_ADJUSTMENT"
        actor: AgencyAuthorizingOfficial
        preconditions:
          - "deviation.status == AGENCY_REVIEW"
        side_effects:
          - "recomputes Authorization.risk_accepted_findings_count and residual_risk_score with disposition factor 0.5"
      - from: "risk_disposition DEVIATION_REQUESTED"
        to: "risk_disposition FALSE_POSITIVE_ACCEPTED"
        trigger: "POST /deviation-requests/{id}/decision with decision APPROVE and kind FALSE_POSITIVE"
        actor: ProgramBoardReviewer | AgencyAuthorizingOfficial
        preconditions:
          - "deviation.status IN {BOARD_REVIEW, AGENCY_REVIEW}"
        side_effects:
          - "also drives remediation_status to CLOSED with closure_reason FALSE_POSITIVE (cascade link 2 of transitive_cascade false_positive_closure_chain)"
      - from: "risk_disposition DEVIATION_REQUESTED"
        to: "risk_disposition NONE"
        trigger: "POST /deviation-requests/{id}/decision with decision DENY"
        actor: ProgramBoardReviewer | AgencyAuthorizingOfficial
        preconditions:
          - "deviation.status IN {BOARD_REVIEW, AGENCY_REVIEW}"
        side_effects:
          - "resets granted_extension_days to 0 and recomputes deadline_at"
          - "recomputes Authorization.residual_risk_score"

  - entity: DeviationRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: BOARD_REVIEW
        trigger: "POST /deviation-requests/{id}/route with review_queue BOARD"
        actor: ProgramBoardReviewer
        preconditions:
          - "deviation.status == SUBMITTED"
          - "kind != RISK_ADJUSTMENT, else ERR_WRONG_REVIEW_QUEUE"
        side_effects:
          - "writes review_queue BOARD and routed_by_user_id from X-User-ID"
      - from: SUBMITTED
        to: AGENCY_REVIEW
        trigger: "POST /deviation-requests/{id}/route with review_queue AGENCY"
        actor: ProgramBoardReviewer
        preconditions:
          - "deviation.status == SUBMITTED"
          - "kind != OPERATIONAL_REQUIREMENT, else ERR_WRONG_REVIEW_QUEUE"
          - "the item's offering has authorization_path == AGENCY_SPONSORED with a sponsor agency, else ERR_WRONG_REVIEW_QUEUE"
        side_effects:
          - "writes review_queue AGENCY and routed_by_user_id from X-User-ID"
        note: "Fork: the BOARD and AGENCY branches carry different approval side-effect sets."
      - from: BOARD_REVIEW
        to: APPROVED
        trigger: "POST /deviation-requests/{id}/decision with decision APPROVE"
        actor: ProgramBoardReviewer
        preconditions:
          - "deviation.status == BOARD_REVIEW"
          - "actor role == ProgramBoardReviewer, else ERR_WRONG_REVIEW_QUEUE"
          - "X-User-ID != routed_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "writes decided_by_user_id and granted_extension_days"
          - "BOARD branch effects: item.risk_disposition -> EXTENSION_GRANTED, item.granted_extension_days and deadline_at updated, Authorization.residual_risk_score recomputed; for kind FALSE_POSITIVE the FALSE_POSITIVE_ACCEPTED effects apply instead"
      - from: AGENCY_REVIEW
        to: APPROVED
        trigger: "POST /deviation-requests/{id}/decision with decision APPROVE"
        actor: AgencyAuthorizingOfficial
        preconditions:
          - "deviation.status == AGENCY_REVIEW"
          - "actor role == AgencyAuthorizingOfficial, else ERR_WRONG_REVIEW_QUEUE"
          - "X-User-ID == offering.sponsor_agency_id; a foreign agency official is refused at priority 33 with ERR_POAM_OFFERING_MISMATCH, because the finding's offering is not one that official may act on, before the priority 34 sponsor check is ever reached"
        side_effects:
          - "writes decided_by_user_id; granted_extension_days stays 0"
          - "AGENCY branch effects: item.risk_disposition -> RISK_ACCEPTED (kind RISK_ADJUSTMENT) or FALSE_POSITIVE_ACCEPTED plus remediation_status CLOSED (kind FALSE_POSITIVE); Authorization counters and residual_risk_score recomputed"
      - from: BOARD_REVIEW
        to: DENIED
        trigger: "POST /deviation-requests/{id}/decision with decision DENY"
        actor: ProgramBoardReviewer
        preconditions:
          - "deviation.status == BOARD_REVIEW"
          - "X-User-ID != routed_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "writes decided_by_user_id; item.risk_disposition returns to NONE and granted_extension_days resets to 0"
      - from: AGENCY_REVIEW
        to: DENIED
        trigger: "POST /deviation-requests/{id}/decision with decision DENY"
        actor: AgencyAuthorizingOfficial
        preconditions:
          - "deviation.status == AGENCY_REVIEW"
          - "X-User-ID == offering.sponsor_agency_id; a foreign agency official is refused at priority 33 with ERR_POAM_OFFERING_MISMATCH before the priority 34 sponsor check is reached"
        side_effects:
          - "writes decided_by_user_id; item.risk_disposition returns to NONE and granted_extension_days resets to 0"

  - entity: Authorization
    initial_state: AUTHORIZED
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: "authorization_status AUTHORIZED"
        to: "authorization_status SUSPENDED"
        trigger: "system event: POST /monitoring-periods/{id}/close producing CLOSED_DEFICIENT with consecutive_deficient_periods == 2"
        actor: system
        preconditions:
          - "authorization_status == AUTHORIZED and the closing period resolved to CLOSED_DEFICIENT"
        side_effects:
          - "sets monitoring_posture ESCALATED"
          - "drives offering AUTHORIZED -> SUSPENDED"
      - from: "authorization_status SUSPENDED"
        to: "authorization_status AUTHORIZED"
        trigger: "system event: POST /monitoring-periods/{id}/close producing CLOSED_COMPLIANT"
        actor: system
        preconditions:
          - "authorization_status == SUSPENDED and the closing period resolved to CLOSED_COMPLIANT"
        side_effects:
          - "resets consecutive_deficient_periods to 0 and monitoring_posture to ACTIVE"
          - "drives offering SUSPENDED -> AUTHORIZED"
        note: "Cycle edge: suspension is reversible."
      - from: "authorization_status IN {AUTHORIZED, SUSPENDED}"
        to: "authorization_status REVOKED"
        trigger: "system event: POST /monitoring-periods/{id}/close producing CLOSED_DEFICIENT with consecutive_deficient_periods >= 3"
        actor: system
        preconditions:
          - "the closing period resolved to CLOSED_DEFICIENT and consecutive_deficient_periods >= 3"
        side_effects:
          - "moves every ReuseGrant of this authorization with access_state != REVOKED to REVOKED with revoked_reason AUTHORIZATION_REVOKED, returning each seat (compensating_invariant reuse_seat_conservation)"
          - "no further MonitoringPeriod is auto-created"
      - from: "authorization_status IN {AUTHORIZED, SUSPENDED}"
        to: "authorization_status EXPIRED"
        trigger: "system event: POST /monitoring-periods/{id}/close when the logical clock >= expires_at"
        actor: system
        preconditions:
          - "logical clock >= expires_at"
        side_effects:
          - "no further MonitoringPeriod is auto-created"
      - from: "monitoring_posture ACTIVE"
        to: "monitoring_posture AT_RISK"
        trigger: "system event: POST /monitoring-periods/{id}/close producing CLOSED_DEFICIENT with consecutive_deficient_periods == 1"
        actor: system
        preconditions:
          - "monitoring_posture == ACTIVE and the closing period resolved to CLOSED_DEFICIENT"
        side_effects:
          - "moves every ReuseGrant of this authorization with access_state IN {PACKAGE_ACCESS_GRANTED, INCREMENTAL_REVIEW, REUSE_ACCEPTED} to NOTICE_ISSUED (cascade link 3 of transitive_cascade deficient_period_chain)"
        note: "Monitoring dimension moves without touching authorization_status."
      - from: "monitoring_posture AT_RISK"
        to: "monitoring_posture ACTIVE"
        trigger: "system event: POST /monitoring-periods/{id}/close producing CLOSED_COMPLIANT"
        actor: system
        preconditions:
          - "monitoring_posture == AT_RISK and the closing period resolved to CLOSED_COMPLIANT"
        side_effects:
          - "resets consecutive_deficient_periods to 0"
      - from: "monitoring_posture AT_RISK"
        to: "monitoring_posture ESCALATED"
        trigger: "system event: POST /monitoring-periods/{id}/close producing CLOSED_DEFICIENT with consecutive_deficient_periods >= 2"
        actor: system
        preconditions:
          - "monitoring_posture == AT_RISK and the closing period resolved to CLOSED_DEFICIENT"
        side_effects:
          - "moves every ReuseGrant of this authorization with access_state IN {PACKAGE_ACCESS_GRANTED, INCREMENTAL_REVIEW, REUSE_ACCEPTED} to NOTICE_ISSUED"

  - entity: MonitoringPeriod
    initial_state: OPEN
    terminal_states: [CLOSED_COMPLIANT, CLOSED_DEFICIENT]
    transitions:
      - from: OPEN
        to: CLOSED_COMPLIANT
        trigger: "POST /monitoring-periods/{id}/close"
        actor: ProgramBoardReviewer | AgencyAuthorizingOfficial
        preconditions:
          - "period.status == OPEN, else ERR_ALREADY_TERMINAL"
          - "logical clock >= window_end, else ERR_PERIOD_NOT_ENDED"
          - "covered_scan_types is a superset of {INFRASTRUCTURE, WEB_APP, DATABASE} AND rejected_submission_count == 0 AND no PoamItem of the offering has severity HIGH with remediation_status != CLOSED and deadline_at <= window_end"
        side_effects:
          - "sets closed_at to the logical clock"
          - "resets Authorization.consecutive_deficient_periods to 0; moves monitoring_posture AT_RISK -> ACTIVE and authorization_status SUSPENDED -> AUTHORIZED when applicable"
          - "creates the next MonitoringPeriod for the following calendar month when authorization_status IN {AUTHORIZED, SUSPENDED} after the close, and skips that creation when a MonitoringPeriod for that period_month already exists for the authorization"
      - from: OPEN
        to: CLOSED_DEFICIENT
        trigger: "POST /monitoring-periods/{id}/close"
        actor: ProgramBoardReviewer | AgencyAuthorizingOfficial
        preconditions:
          - "period.status == OPEN, else ERR_ALREADY_TERMINAL"
          - "logical clock >= window_end, else ERR_PERIOD_NOT_ENDED"
          - "the compliance conjunction of the CLOSED_COMPLIANT leg fails"
        side_effects:
          - "sets closed_at to the logical clock"
          - "increments Authorization.consecutive_deficient_periods by 1 (cascade link 2 of transitive_cascade deficient_period_chain)"
          - "drives the Authorization monitoring_posture and authorization_status transitions listed under Authorization"
          - "creates the next MonitoringPeriod for the following calendar month when authorization_status IN {AUTHORIZED, SUSPENDED} after the close, and skips that creation when a MonitoringPeriod for that period_month already exists for the authorization"

  - entity: SignificantChangeRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /significant-change-requests/{id}/decision with decision APPROVE"
        actor: ProgramBoardReviewer | AgencyAuthorizingOfficial
        preconditions:
          - "scr.status == SUBMITTED"
          - "for offering.authorization_path == AGENCY_SPONSORED the actor must be AgencyAuthorizingOfficial with X-User-ID == offering.sponsor_agency_id, else ERR_SPONSOR_AGENCY_MISMATCH; for PROGRAM_BOARD the actor must be ProgramBoardReviewer, else ERR_WRONG_REVIEW_QUEUE"
        side_effects:
          - "writes decided_by_user_id"
          - "increments offering.boundary_version by 1 for change_kind IN {BOUNDARY_CHANGE, NEW_SERVICE}"
          - "increases offering.included_service_count by added_service_count for change_kind == NEW_SERVICE"
          - "drives offering CHANGE_UNDER_REVIEW -> AUTHORIZED"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /significant-change-requests/{id}/decision with decision DENY"
        actor: ProgramBoardReviewer | AgencyAuthorizingOfficial
        preconditions:
          - "scr.status == SUBMITTED"
          - "same actor rules as the APPROVE leg"
        side_effects:
          - "writes decided_by_user_id"
          - "offering.boundary_version and included_service_count unchanged"
          - "drives offering CHANGE_UNDER_REVIEW -> AUTHORIZED"

  - entity: ReuseGrant
    initial_state: REQUESTED
    terminal_states: [REVOKED]
    transitions:
      - from: REQUESTED
        to: PACKAGE_ACCESS_GRANTED
        trigger: "POST /reuse-grants/{id}/package-access"
        actor: CspComplianceLead
        preconditions:
          - "grant.access_state == REQUESTED"
          - "X-User-ID == offering.owner_user_id, else ERR_NOT_RESOURCE_OWNER"
        side_effects:
          - "the grantee agency may now read the AuthorizationPackage"
      - from: PACKAGE_ACCESS_GRANTED
        to: INCREMENTAL_REVIEW
        trigger: "POST /reuse-grants/{id}/incremental-review with decision MORE_INFO"
        actor: AgencyAuthorizingOfficial
        preconditions:
          - "grant.access_state == PACKAGE_ACCESS_GRANTED"
          - "X-User-ID == grant.agency_id, else ERR_NOT_RESOURCE_OWNER"
        side_effects:
          - "writes incremental_review_findings_count"
      - from: INCREMENTAL_REVIEW
        to: INCREMENTAL_REVIEW
        trigger: "POST /reuse-grants/{id}/incremental-review with decision MORE_INFO"
        actor: AgencyAuthorizingOfficial
        preconditions:
          - "grant.access_state == INCREMENTAL_REVIEW"
        side_effects:
          - "overwrites incremental_review_findings_count"
        note: "Self-loop: the incremental review may iterate."
      - from: "access_state IN {PACKAGE_ACCESS_GRANTED, INCREMENTAL_REVIEW, NOTICE_ISSUED}"
        to: REUSE_ACCEPTED
        trigger: "POST /reuse-grants/{id}/incremental-review with decision ACCEPT"
        actor: AgencyAuthorizingOfficial
        preconditions:
          - "grant.access_state IN {PACKAGE_ACCESS_GRANTED, INCREMENTAL_REVIEW, NOTICE_ISSUED}"
          - "X-User-ID == grant.agency_id, else ERR_NOT_RESOURCE_OWNER"
          - "findings_count <= 5, else ERR_INCREMENTAL_FINDINGS_EXCEED_TOLERANCE"
          - "authorization.authorization_status == AUTHORIZED, else ERR_AUTHORIZATION_NOT_ACTIVE"
        side_effects:
          - "writes incremental_review_findings_count and reuse_accepted_at"
          - "when the previous state was NOTICE_ISSUED, decrements Agency.open_notice_count by 1"
        note: "Cycle edge from NOTICE_ISSUED back into the accepted state."
      - from: "access_state IN {PACKAGE_ACCESS_GRANTED, INCREMENTAL_REVIEW, REUSE_ACCEPTED}"
        to: NOTICE_ISSUED
        trigger: "system event: Authorization monitoring_posture moves to AT_RISK or ESCALATED"
        actor: system
        preconditions:
          - "grant.access_state IN {PACKAGE_ACCESS_GRANTED, INCREMENTAL_REVIEW, REUSE_ACCEPTED}"
        side_effects:
          - "increments notice_count by 1"
          - "increments Agency.open_notice_count by 1 (cascade link 4 of transitive_cascade deficient_period_chain)"
      - from: "access_state != REVOKED"
        to: REVOKED
        trigger: "POST /reuse-grants/{id}/revoke"
        actor: AgencyAuthorizingOfficial | ProgramBoardReviewer
        preconditions:
          - "grant.access_state != REVOKED, else ERR_ALREADY_TERMINAL"
          - "for AgencyAuthorizingOfficial: X-User-ID == grant.agency_id, else ERR_NOT_RESOURCE_OWNER"
        side_effects:
          - "writes revoked_reason"
          - "returns the seat: Authorization.reuse_seats_granted decreases by 1 and reuse_seats_available increases by 1 (compensating_invariant reuse_seat_conservation)"
          - "decrements Agency.reuse_grant_count by 1, and Agency.open_notice_count by 1 when the previous state was NOTICE_ISSUED"
          - "increments Authorization.version by 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's version -- the only sanctioned mechanism)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: package-create-stale-offering
    parent_entity: CloudServiceOffering
    write_endpoint: "POST /authorization-packages"
    occ_field: "expected_offering_version"
    description: |
      Creating an AuthorizationPackage against a CloudServiceOffering whose version
      has advanced past the value the client last observed is rejected. A newly
      created package legitimately supersedes any DRAFT or REVISION_REQUESTED
      package of the same offering, so a second creation carrying a stale
      expected_offering_version would silently discard a package the client never
      saw; the stale-version check turns that into a deterministic 412.
    error_id: ERR_STALE_OFFERING_VERSION
    http_status: 412

  - rule_id: reuse-grant-stale-authorization
    parent_entity: Authorization
    write_endpoint: "POST /reuse-grants"
    occ_field: "expected_authorization_version"
    description: |
      Creating a ReuseGrant against an Authorization whose version has advanced past
      the value the client last observed is rejected. Each grant consumes one seat
      from a finite reuse pool and a grant for a different agency would otherwise
      succeed on identical state, so the seat count the client based its request on
      must still be current; the stale-version check makes the outcome deterministic.
    error_id: ERR_STALE_AUTHORIZATION_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:

  - name: impact_level_determination
    trigger: "variant preliminary on POST /offerings/{id}/data-categories and POST /data-categories/{id}/confirm; variant final on POST /offerings/{id}/impact-determination"
    algorithm: aggregation
    formula: |
      RANK = { LOW: 1, MODERATE: 2, HIGH: 3 }
      LEVEL_OF = { 1: LOW, 2: MODERATE, 3: HIGH }

      # variant preliminary  -> writes CloudServiceOffering.preliminary_impact_level
      included = DataCategory rows where offering_id == O.id
                 and status IN {DECLARED, CONFIRMED}
      if included is empty:
          preliminary_impact_level = null
      else:
          preliminary_impact_level = LEVEL_OF[ max over included of
              max(RANK[confidentiality_impact], RANK[integrity_impact], RANK[availability_impact]) ]

      # variant final -> writes CloudServiceOffering.final_impact_level
      confirmed = DataCategory rows where offering_id == O.id and status == CONFIRMED
      if confirmed is empty:  raise ERR_NO_CONFIRMED_DATA_CATEGORY
      water_mark = max over confirmed of
          max(RANK[confidentiality_impact], RANK[integrity_impact], RANK[availability_impact])
      final_impact_level = LEVEL_OF[ max(water_mark, RANK[O.external_dependency_impact_level]) ]

      # baseline selector (deterministic, no random field participates)
      candidates = ControlBaseline rows where impact_level == final_impact_level and retired == false
      if candidates is empty: raise ERR_BASELINE_NOT_AVAILABLE
      baseline_id = the candidate with the greatest effective_from;
                    tie-break: smallest created_at; second tie-break: none needed because
                    (impact_level, effective_from, created_at) is unique by construction
    input_set: "variant preliminary includes DataCategory rows with status IN {DECLARED, CONFIRMED}; variant final includes only status == CONFIRMED. WITHDRAWN rows are excluded from both."
    constants:
      RANK_LOW: 1
      RANK_MODERATE: 2
      RANK_HIGH: 3
    precision: "enum result; no rounding"
    variants:
      - name: preliminary
        when: "recomputed on every data-category create, confirm or withdraw while the offering is DRAFT"
        difference: "counts DECLARED categories as if they were already confirmed and ignores external_dependency_impact_level; can therefore sit strictly above the final level"
      - name: final
        when: "computed once at POST /offerings/{id}/impact-determination"
        difference: "counts only CONFIRMED categories, then escalates by external_dependency_impact_level; an unconfirmed HIGH category does not raise it"

  - name: crm_documentation_coverage
    trigger: "GET /offerings/{id}/crm-coverage and POST /authorization-packages/{id}/submit (frozen into AuthorizationPackage.crm_coverage_pct)"
    algorithm: weighted_scoring
    formula: |
      baseline = ControlBaseline row referenced by O.baseline_id
      weighted_sum = 0
      weight_total = 0
      for F in baseline.families ordered by priority_rank ASC (tie-break: family_code ASC):
          if F.required_control_count == 0: continue        # zero-requirement families excluded
          implemented = count( ControlImplementation ci where
                               ci.offering_id == O.id
                               and ci.family_code == F.family_code
                               and ci.implementation_status IN {IMPLEMENTED, PARTIALLY_IMPLEMENTED}
                               and ci.crm_documented == true )
          documented = min(implemented, F.required_control_count)
          family_pct = round(documented / F.required_control_count * 100, 2)   # STEP 1 rounding
          weighted_sum = weighted_sum + family_pct * F.required_control_count
          weight_total = weight_total + F.required_control_count
      if weight_total == 0: overall_coverage_pct = 0.00
      else:                 overall_coverage_pct = round(weighted_sum / weight_total, 2)  # STEP 2 rounding

      # PINNED ORDER: round per family FIRST, then round the weighted mean.
      # The forbidden alternative round(sum(documented)/sum(required)*100, 2) yields a
      # different figure (e.g. 33.33 instead of 33.34 for AC 2/3 and SC 1/6).
    input_set: "ControlImplementation rows of the offering whose implementation_status IN {IMPLEMENTED, PARTIALLY_IMPLEMENTED} and crm_documented == true; PLANNED, ALTERNATIVE_IMPLEMENTATION and NOT_APPLICABLE rows never count. Families with required_control_count == 0 are excluded from both the numerator and the weight."
    constants:
      MIN_COVERAGE_FOR_SUBMISSION: 90.00
    precision: "2 decimal places, round_half_up, applied twice in the pinned order above"
    variants: []

  - name: engagement_cost_rollup
    trigger: "POST /assessment-engagements"
    algorithm: tiered_pricing
    formula: |
      # Circular-looking definition resolved by a pinned evaluation order:
      # total = labor + surcharge + overage, and the surcharge rate is keyed on a
      # cost tier -- but the tier is selected from labor_cost_usd, NEVER from total_cost_usd.
      # 1. labor_cost_usd            : request input
      # 2. surcharge_rate            : tier of labor_cost_usd
      if   labor_cost_usd <  250000.00: surcharge_rate = 0.06
      elif labor_cost_usd <  600000.00: surcharge_rate = 0.045     # >= 250000.00 enters this tier
      else:                             surcharge_rate = 0.03      # >= 600000.00
      # 3. program_surcharge_usd     : on labor only
      program_surcharge_usd = round(labor_cost_usd * surcharge_rate, 2)
      # 4. allowance                 : from the offering's final_impact_level
      allowance = HOUR_ALLOWANCE[O.final_impact_level]   # LOW 400, MODERATE 900, HIGH 1600
      # 5. hour_overage_usd
      hour_overage_usd = round(max(0, contracted_hours - allowance) * 120.00, 2)
      # 6. total_cost_usd
      total_cost_usd = round(labor_cost_usd + program_surcharge_usd + hour_overage_usd, 2)
    input_set: "single AssessmentEngagement row plus the offering's final_impact_level; no other engagement participates"
    constants:
      TIER_1_CEILING: 250000.00
      TIER_1_RATE: 0.06
      TIER_2_CEILING: 600000.00
      TIER_2_RATE: 0.045
      TIER_3_RATE: 0.03
      HOUR_ALLOWANCE_LOW: 400
      HOUR_ALLOWANCE_MODERATE: 900
      HOUR_ALLOWANCE_HIGH: 1600
      OVERAGE_RATE_USD_PER_HOUR: 120.00
    precision: "2 decimal places, round_half_up, applied at steps 3, 5 and 6"
    variants: []

  - name: poam_remediation_deadline
    trigger: "POST /poam-items; POST /assessment-engagements/{id}/report; POST /deviation-requests/{id}/decision; and the re-anchor step of POST /authorization-packages/{id}/decision with decision AUTHORIZE"
    algorithm: threshold
    formula: |
      BASE_DAYS = { HIGH: 30, MODERATE: 90, LOW: 180 }
      anchor_at = detected_at                                     # at creation
      # re-anchor step, ASSESSMENT items only:
      if item.source == ASSESSMENT and authorization.authorized_at > item.detected_at
         and item.remediation_status != CLOSED:
          anchor_at = authorization.authorized_at
      deadline_at = anchor_at + BASE_DAYS[severity] days + granted_extension_days days
      is_overdue(as_of) = (as_of >= deadline_at)                   # >= , not >
    input_set: "one PoamItem row; granted_extension_days comes only from DeviationRequest rows with status APPROVED and kind OPERATIONAL_REQUIREMENT on that item"
    constants:
      BASE_DAYS_HIGH: 30
      BASE_DAYS_MODERATE: 90
      BASE_DAYS_LOW: 180
    precision: "whole days; instants are exact ISO 8601 UTC"
    variants: []

  - name: residual_risk_score
    trigger: "variant at_submission on POST /authorization-packages/{id}/submit; variant at_monitoring_review on GET /authorizations/{id}/risk-summary, on Authorization creation, and on every PoamItem or DeviationRequest mutation listed in §1.2 and on MonitoringPeriod close"
    algorithm: weighted_scoring
    formula: |
      SEVERITY_WEIGHT   = { HIGH: 10.0, MODERATE: 4.0, LOW: 1.0 }
      DISPOSITION_FACTOR = { NONE: 1.0, DEVIATION_REQUESTED: 1.0, EXTENSION_GRANTED: 1.0,
                             RISK_ACCEPTED: 0.5, FALSE_POSITIVE_ACCEPTED: 0.0 }
      OVERDUE_MULTIPLIER = 1.5

      included = PoamItem rows where offering_id == O.id
                 and remediation_status IN {OPEN, IN_REMEDIATION, AWAITING_VERIFICATION}
      score = 0
      for item in included ordered by created_at ASC:
          effective_deadline = variant-specific (see variants)
          overdue = (as_of >= effective_deadline)
          contribution = round( SEVERITY_WEIGHT[item.severity]
                                * DISPOSITION_FACTOR[item.risk_disposition]
                                * (OVERDUE_MULTIPLIER if overdue else 1.0), 2)
          score = score + contribution
      residual_risk_score = min(round(score, 2), 100.00)          # floor 0.00, ceiling 100.00

      poam_risk_tier = NONE      if residual_risk_score == 0.00
                       LOW       if 0.00 <  residual_risk_score <  10.00
                       MODERATE  if 10.00 <= residual_risk_score < 30.00
                       ELEVATED  if residual_risk_score >= 30.00
    input_set: "PoamItem rows of the offering with remediation_status IN {OPEN, IN_REMEDIATION, AWAITING_VERIFICATION}; CLOSED items never contribute regardless of closure_reason"
    constants:
      SEVERITY_WEIGHT_HIGH: 10.0
      SEVERITY_WEIGHT_MODERATE: 4.0
      SEVERITY_WEIGHT_LOW: 1.0
      OVERDUE_MULTIPLIER: 1.5
      SCORE_CEILING: 100.00
      MAX_SCORE_FOR_SUBMISSION: 50.00
      TIER_LOW_FLOOR: 0.00
      TIER_MODERATE_FLOOR: 10.00
      TIER_ELEVATED_FLOOR: 30.00
    precision: "2 decimal places, round_half_up, per item then on the sum"
    variants:
      - name: at_submission
        when: "frozen into AuthorizationPackage.residual_risk_score_at_submission at submit time"
        difference: "as_of = package.submitted_at and effective_deadline = anchor_at + BASE_DAYS[severity] days, IGNORING granted_extension_days -- the package snapshot uses the assessment-time deadline"
      - name: at_monitoring_review
        when: "stored on Authorization.residual_risk_score and recomputed live by GET /authorizations/{id}/risk-summary"
        difference: "as_of = the logical clock and effective_deadline = item.deadline_at, which INCLUDES granted_extension_days -- an approved operational-requirement extension pulls an item back out of the overdue multiplier"

  - name: engagement_hour_ledger
    trigger: "POST /test-slots, POST /test-slots/{id}/cancel, and the VOIDED cascade on AssessmentEngagement"
    algorithm: aggregation
    formula: |
      allocated_hours   = round( sum(TestSlot.hours where engagement_id == E.id
                                     and status IN {SCHEDULED, COMPLETED}), 2)
      unallocated_hours = round(E.contracted_hours - allocated_hours, 2)

      # allocation guard on POST /test-slots, evaluated before the row is written:
      if requested_hours > unallocated_hours: raise ERR_ENGAGEMENT_HOURS_EXHAUSTED
      # requested_hours == unallocated_hours is allowed and drives unallocated_hours to 0.00

      INVARIANT (compensating_invariant engagement_hour_conservation):
        E.contracted_hours == E.allocated_hours + E.unallocated_hours   at all times
    input_set: "TestSlot rows of the engagement with status IN {SCHEDULED, COMPLETED}; CANCELLED slots are excluded, which is what makes cancel a true compensation"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: scan_submission_timeliness
    trigger: "POST /monitoring-periods/{id}/scan-submissions"
    algorithm: threshold
    formula: |
      REQUIRED_TYPES = {INFRASTRUCTURE, WEB_APP, DATABASE}
      if not REQUIRED_TYPES subset-of set(scan_types): raise ERR_INCOMPLETE_SCAN_SET
      submitted_at = logical clock
      if submitted_at <= period.scan_due_at: days_late = 0
      else: days_late = floor( (submitted_at - period.scan_due_at) / 86400 seconds )
      status = ACCEPTED       if days_late == 0
               LATE_ACCEPTED  if 1 <= days_late <= 3
               REJECTED       if days_late >= 4
      # counter side effects
      ACCEPTED      -> period.accepted_submission_count += 1
      LATE_ACCEPTED -> period.late_submission_count += 1
      REJECTED      -> period.rejected_submission_count += 1
      covered_scan_types = sorted union of scan_types over this period's submissions
                           with status IN {ACCEPTED, LATE_ACCEPTED}
    input_set: "one ScanSubmission plus the period's prior submissions for covered_scan_types"
    constants:
      SCAN_DUE_OFFSET_DAYS: 5
      GRACE_DAYS: 3
      REQUIRED_SCAN_TYPES: ["INFRASTRUCTURE", "WEB_APP", "DATABASE"]
    precision: "whole days, floor"
    variants: []

  - name: reuse_seat_ledger
    trigger: "POST /reuse-grants, POST /reuse-grants/{id}/revoke, and the REVOKED cascade on Authorization"
    algorithm: aggregation
    formula: |
      reuse_seats_granted   = count(ReuseGrant where authorization_id == A.id
                                    and access_state != REVOKED)
      reuse_seats_available = A.reuse_seats_total - reuse_seats_granted

      # allocation guard on POST /reuse-grants, evaluated before the row is written:
      if reuse_seats_available == 0: raise ERR_REUSE_SEATS_EXHAUSTED

      INVARIANT (compensating_invariant reuse_seat_conservation):
        A.reuse_seats_total == A.reuse_seats_granted + A.reuse_seats_available   at all times
    input_set: "ReuseGrant rows of the authorization with access_state != REVOKED"
    constants:
      DEFAULT_REUSE_SEATS_TOTAL: 5
      REUSE_FINDINGS_TOLERANCE: 5
    precision: "integers"
    variants: []

  - name: change_window_separation
    trigger: "POST /significant-change-requests"
    algorithm: interval_merge
    formula: |
      # CLOSED intervals with a mandatory quiet buffer -- deliberately different
      # interval arithmetic from the half-open, buffer-free TestSlot rule.
      BUFFER_DAYS = 7
      for X in SignificantChangeRequest rows where offering_id == new.offering_id
               and status IN {SUBMITTED, APPROVED}:
          separated = (new.window_start - X.window_end >= 7 days)
                      or (X.window_start - new.window_end >= 7 days)
          if not separated: raise ERR_CHANGE_WINDOW_BUFFER_VIOLATION
      # Exactly 7 days of separation is accepted (>=); 6 days 23:59:59 is rejected.
    input_set: "SignificantChangeRequest rows of the same offering with status IN {SUBMITTED, APPROVED}; DENIED rows never block"
    constants:
      BUFFER_DAYS: 7
    precision: "exact instants; the >= comparison is on the full timestamp difference"
    variants: []

  - name: test_slot_overlap_geometry
    trigger: "POST /test-slots"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN intervals [start_at, end_at) with no buffer -- adjacency is legal.
      for X in TestSlot rows where engagement_id == new.engagement_id
               and status IN {SCHEDULED, COMPLETED}:
          overlaps = (new.start_at < X.end_at) and (X.start_at < new.end_at)
          if overlaps: raise ERR_TEST_SLOT_OVERLAP
      # new.start_at == X.end_at is accepted (zero-gap adjacency);
      # new.start_at one second earlier than X.end_at is rejected.
      if new.start_at >= new.end_at: raise ERR_WINDOW_INVALID
    input_set: "TestSlot rows of the same engagement with status IN {SCHEDULED, COMPLETED}; CANCELLED slots free their interval"
    constants: {}
    precision: "exact instants; strict < on both sides"
    variants: []

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the four declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "the requested action is permitted for the acting role: POST /poam-items/{id}/remediation actions START and SUBMIT_EVIDENCE require CspComplianceLead, actions VERIFY_CLOSE and REOPEN require ThirdPartyAssessor"
    error_id: ERR_ACTION_ROLE_MISMATCH
    http_status: 403
    applies_to: "POST /poam-items/{id}/remediation"
  - priority: 4
    category: auth
    check: "the acting role matches the queue or path that owns the decision: deviation BOARD queue requires ProgramBoardReviewer, AGENCY queue requires AgencyAuthorizingOfficial, PROGRAM_BOARD package/change decisions require ProgramBoardReviewer, and the routed queue must be legal for the deviation kind"
    error_id: ERR_WRONG_REVIEW_QUEUE
    http_status: 403
    applies_to: "POST /deviation-requests/{id}/route, POST /deviation-requests/{id}/decision, POST /authorization-packages/{id}/decision, POST /significant-change-requests/{id}/decision, POST /assessment-engagements/{id}/plan-approval"
  - priority: 5
    category: business_constraint
    check: "request body and query shape: required fields present, enum members legal, numbers positive where required, arrays duplicate-free and non-empty except `findings` on the assessment report, which may legally be the empty array, period_month matches YYYY-MM, limit within 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 6
    category: existence
    check: "every id in the request path exists, validated left to right"
    error_id: ERR_OFFERING_NOT_FOUND | ERR_DATA_CATEGORY_NOT_FOUND | ERR_CONTROL_IMPLEMENTATION_NOT_FOUND | ERR_ENGAGEMENT_NOT_FOUND | ERR_TEST_SLOT_NOT_FOUND | ERR_PACKAGE_NOT_FOUND | ERR_POAM_ITEM_NOT_FOUND | ERR_DEVIATION_NOT_FOUND | ERR_AUTHORIZATION_NOT_FOUND | ERR_MONITORING_PERIOD_NOT_FOUND | ERR_CHANGE_REQUEST_NOT_FOUND | ERR_REUSE_GRANT_NOT_FOUND | ERR_AGENCY_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterised endpoints"
  - priority: 7
    category: existence
    check: "every foreign key in the request body resolves to an existing row, validated in the field order declared by the endpoint's input list; the same rule applies to the foreign-key filters of a list read (GET /offerings baseline_id and sponsor_agency_id), which 404 rather than returning an empty page"
    error_id: ERR_OFFERING_NOT_FOUND | ERR_ENGAGEMENT_NOT_FOUND | ERR_AGENCY_NOT_FOUND | ERR_AUTHORIZATION_NOT_FOUND | ERR_POAM_ITEM_NOT_FOUND | ERR_BASELINE_NOT_FOUND
    http_status: 404
    applies_to: "all write endpoints carrying foreign keys, plus the baseline_id and sponsor_agency_id filters of GET /offerings"
  - priority: 8
    category: auth
    check: "the acting identity owns the target: CspComplianceLead X-User-ID == offering.owner_user_id; ThirdPartyAssessor X-User-ID == engagement.assessor_user_id; AgencyAuthorizingOfficial X-User-ID == grant.agency_id for reuse-grant actions"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all CSP and assessor write endpoints, POST /reuse-grants, POST /reuse-grants/{id}/incremental-review, POST /reuse-grants/{id}/revoke"
  - priority: 9
    category: auth
    check: "an AgencyAuthorizingOfficial reading an authorization package must be the offering's sponsor agency or hold a ReuseGrant for that authorization with access_state IN {PACKAGE_ACCESS_GRANTED, INCREMENTAL_REVIEW, REUSE_ACCEPTED, NOTICE_ISSUED}"
    error_id: ERR_PACKAGE_ACCESS_DENIED
    http_status: 403
    applies_to: "GET /authorization-packages/{id}"
  - priority: 10
    category: state
    check: "expected_offering_version / expected_authorization_version equals the parent's current version"
    error_id: ERR_STALE_OFFERING_VERSION | ERR_STALE_AUTHORIZATION_VERSION
    http_status: 412
    applies_to: "POST /authorization-packages, POST /reuse-grants"
  - priority: 11
    category: state
    check: "the target row is in a state the requested transition declares as its from-state; on the five endpoints listed at priority 12 a target that is already in a terminal state is reported by priority 12 instead of here, so the two rules never both fire"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 12
    category: state
    check: "the target row is not already in a terminal state for the requested transition"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "POST /test-slots/{id}/cancel, POST /monitoring-periods/{id}/close, POST /reuse-grants/{id}/revoke, POST /poam-items (supersession target), POST /deviation-requests"
  - priority: 13
    category: state
    check: "cross-entity gate: the package's AssessmentEngagement is in status REPORT_DELIVERED"
    error_id: ERR_ENGAGEMENT_REPORT_NOT_DELIVERED
    http_status: 409
    applies_to: "POST /authorization-packages/{id}/submit"
  - priority: 14
    category: state
    check: "cross-entity gate: the Authorization is in authorization_status AUTHORIZED and monitoring_posture != ESCALATED"
    error_id: ERR_AUTHORIZATION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /reuse-grants, POST /reuse-grants/{id}/incremental-review, POST /authorizations/{id}/monitoring-periods"
  - priority: 15
    category: state
    check: "cross-entity gate: the PoamItem has no DeviationRequest in status IN {SUBMITTED, BOARD_REVIEW, AGENCY_REVIEW}"
    error_id: ERR_DEVIATION_PENDING_ON_ITEM
    http_status: 409
    applies_to: "POST /poam-items/{id}/remediation with action VERIFY_CLOSE"
  - priority: 16
    category: state
    check: "cross-entity gate: an inherited control's source offering is in status AUTHORIZED"
    error_id: ERR_INHERITED_OFFERING_NOT_AUTHORIZED
    http_status: 409
    applies_to: "POST /control-implementations, PATCH /control-implementations/{id}"
  - priority: 17
    category: business_safety
    check: "segregation of duties: the board member deciding a deviation is not the one who routed it; the board member issuing a PROGRAM_BOARD package decision is not the one who reviewed it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /deviation-requests/{id}/decision, POST /authorization-packages/{id}/decision"
  - priority: 18
    category: business_safety
    check: "at least one DataCategory of the offering has status CONFIRMED"
    error_id: ERR_NO_CONFIRMED_DATA_CATEGORY
    http_status: 422
    applies_to: "POST /offerings/{id}/impact-determination"
  - priority: 19
    category: business_safety
    check: "a non-retired ControlBaseline exists for the determined final impact level"
    error_id: ERR_BASELINE_NOT_AVAILABLE
    http_status: 422
    applies_to: "POST /offerings/{id}/impact-determination"
  - priority: 20
    category: business_safety
    check: "customer_responsibility_text is present and non-empty whenever crm_documented is true"
    error_id: ERR_CRM_TEXT_REQUIRED
    http_status: 422
    applies_to: "POST /control-implementations, PATCH /control-implementations/{id}"
  - priority: 21
    category: business_safety
    check: "scan_types contains all of INFRASTRUCTURE, WEB_APP and DATABASE"
    error_id: ERR_INCOMPLETE_SCAN_SET
    http_status: 422
    applies_to: "POST /monitoring-periods/{id}/scan-submissions"
  - priority: 22
    category: business_temporal
    check: "interval sanity: window_start < window_end for test slots and change requests, planned_test_start < planned_test_end for assessment plans"
    error_id: ERR_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /test-slots, POST /significant-change-requests, POST /assessment-engagements/{id}/plan"
  - priority: 23
    category: business_temporal
    check: "detected_at is not after the logical clock"
    error_id: ERR_DETECTION_DATE_IN_FUTURE
    http_status: 422
    applies_to: "POST /poam-items, POST /assessment-engagements/{id}/report"
  - priority: 24
    category: business_temporal
    check: "the logical clock is at or after the monitoring period's window_start"
    error_id: ERR_SCAN_WINDOW_NOT_OPEN
    http_status: 422
    applies_to: "POST /monitoring-periods/{id}/scan-submissions"
  - priority: 25
    category: business_temporal
    check: "the logical clock is at or after the monitoring period's window_end"
    error_id: ERR_PERIOD_NOT_ENDED
    http_status: 409
    applies_to: "POST /monitoring-periods/{id}/close"
  - priority: 26
    category: business_constraint
    check: "half-open interval overlap on the engagement's SCHEDULED or COMPLETED test slots"
    error_id: ERR_TEST_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /test-slots"
  - priority: 27
    category: business_constraint
    check: "closed-interval separation of at least 7 days from every SUBMITTED or APPROVED change window of the same offering"
    error_id: ERR_CHANGE_WINDOW_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /significant-change-requests"
  - priority: 28
    category: business_constraint
    check: "period_month is unique per authorization_id"
    error_id: ERR_DUPLICATE_MONITORING_PERIOD
    http_status: 409
    applies_to: "POST /authorizations/{id}/monitoring-periods"
  - priority: 29
    category: business_constraint
    check: "no existing ReuseGrant with the same (authorization_id, agency_id) and access_state != REVOKED"
    error_id: ERR_DUPLICATE_REUSE_GRANT
    http_status: 409
    applies_to: "POST /reuse-grants"
  - priority: 30
    category: business_constraint
    check: "control_id is unique per offering_id, and category_code is unique per offering_id"
    error_id: ERR_DUPLICATE_CONTROL_IMPLEMENTATION
    http_status: 409
    applies_to: "POST /control-implementations, POST /offerings/{id}/data-categories"
  - priority: 31
    category: business_constraint
    check: "the offering has fewer than 3 AuthorizationPackage rows in total, i.e. count(AuthorizationPackage where offering_id == body.offering_id) < 3, so a 4th revision package can never be opened"
    error_id: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /authorization-packages"
  - priority: 32
    category: business_referential
    check: "engagement.offering_id equals the package's offering_id"
    error_id: ERR_ENGAGEMENT_OFFERING_MISMATCH
    http_status: 409
    applies_to: "POST /authorization-packages"
  - priority: 33
    category: business_referential
    check: "the deviation's PoamItem belongs to an offering the acting official is entitled to act on"
    error_id: ERR_POAM_OFFERING_MISMATCH
    http_status: 409
    applies_to: "POST /deviation-requests, POST /deviation-requests/{id}/decision"
  - priority: 34
    category: business_referential
    check: "the acting AgencyAuthorizingOfficial's X-User-ID equals the offering's sponsor_agency_id"
    error_id: ERR_SPONSOR_AGENCY_MISMATCH
    http_status: 403
    applies_to: "POST /authorization-packages/{id}/decision, POST /assessment-engagements/{id}/plan-approval, POST /significant-change-requests/{id}/decision, POST /deviation-requests/{id}/decision"
  - priority: 35
    category: business_referential
    check: "supersedes_item_id points at a PoamItem of the same offering_id"
    error_id: ERR_SUPERSEDED_ITEM_MISMATCH
    http_status: 409
    applies_to: "POST /poam-items"
  - priority: 36
    category: business_safety
    check: "crm_coverage_pct >= 90.00 at submission"
    error_id: ERR_CRM_COVERAGE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /authorization-packages/{id}/submit"
  - priority: 37
    category: business_safety
    check: "residual_risk_score_at_submission < 50.00 at submission"
    error_id: ERR_RESIDUAL_RISK_TOO_HIGH
    http_status: 422
    applies_to: "POST /authorization-packages/{id}/submit"
  - priority: 38
    category: business_safety
    check: "no PoamItem of the offering has severity HIGH, remediation_status != CLOSED and deadline_at <= submitted_at"
    error_id: ERR_OVERDUE_HIGH_FINDINGS
    http_status: 422
    applies_to: "POST /authorization-packages/{id}/submit"
  - priority: 39
    category: business_constraint
    check: "requested slot hours <= engagement.unallocated_hours"
    error_id: ERR_ENGAGEMENT_HOURS_EXHAUSTED
    http_status: 422
    applies_to: "POST /test-slots"
  - priority: 40
    category: business_constraint
    check: "authorization.reuse_seats_available >= 1"
    error_id: ERR_REUSE_SEATS_EXHAUSTED
    http_status: 422
    applies_to: "POST /reuse-grants"
  - priority: 41
    category: business_constraint
    check: "agency.sponsored_offering_count < agency.sponsorship_capacity for the AGENCY_SPONSORED path"
    error_id: ERR_SPONSORSHIP_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /offerings/{id}/path-selection"
  - priority: 42
    category: business_constraint
    check: "findings_count <= 5 when the incremental review decision is ACCEPT"
    error_id: ERR_INCREMENTAL_FINDINGS_EXCEED_TOLERANCE
    http_status: 422
    applies_to: "POST /reuse-grants/{id}/incremental-review"
  - priority: 43
    category: business_fiscal
    check: "engagement.total_cost_usd <= offering.assessment_budget_usd"
    error_id: ERR_ASSESSMENT_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /authorization-packages/{id}/submit"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:

  # --- agencies -----------------------------------------------------------
  - method: POST
    path: "/agencies"
    description: "Register a federal agency that may sponsor offerings and hold reuse grants."
    roles: [ProgramBoardReviewer]
    code: 201
    input: ["name", "agency_code", "status?", "sponsorship_capacity?"]
    output: Agency
    side_effects: ["none"]
  - method: GET
    path: "/agencies/{id}"
    description: "Read one agency including its notice and reuse counters."
    roles: [CspComplianceLead, ThirdPartyAssessor, AgencyAuthorizingOfficial, ProgramBoardReviewer]
    code: 200
    input: []
    output: Agency
    side_effects: []

  # --- baselines ----------------------------------------------------------
  - method: POST
    path: "/control-baselines"
    description: "Publish a control baseline for one impact level, including its control-family requirements."
    roles: [ProgramBoardReviewer]
    code: 201
    input: ["impact_level", "version_label", "effective_from", "families", "retired?"]
    output: ControlBaseline
    side_effects: ["computes total_required_controls"]

  # --- offerings ----------------------------------------------------------
  - method: POST
    path: "/offerings"
    description: "Create a cloud service offering in DRAFT owned by the acting CspComplianceLead."
    roles: [CspComplianceLead]
    code: 201
    input: ["name", "provider_name", "service_model", "deployment_model", "assessment_budget_usd", "external_dependency_impact_level?"]
    output: CloudServiceOffering
    side_effects: ["sets owner_user_id from X-User-ID"]
  - method: GET
    path: "/offerings/{id}"
    description: "Read one offering including its computed impact levels and package counters."
    roles: [CspComplianceLead, ThirdPartyAssessor, AgencyAuthorizingOfficial, ProgramBoardReviewer]
    code: 200
    input: []
    output: CloudServiceOffering
    side_effects: []
  - method: GET
    path: "/offerings"
    description: "List offerings with filters and pagination."
    roles: [CspComplianceLead, ThirdPartyAssessor, AgencyAuthorizingOfficial, ProgramBoardReviewer]
    code: 200
    input: ["status?", "authorization_path?", "baseline_id?", "sponsor_agency_id?", "limit?", "offset?"]
    output: CloudServiceOffering[]
    side_effects: []
  - method: POST
    path: "/offerings/{id}/data-categories"
    description: "Declare an information type inside the offering's boundary."
    roles: [CspComplianceLead]
    code: 201
    input: [category_code, confidentiality_impact, integrity_impact, availability_impact]
    output: DataCategory
    side_effects: ["recomputes offering.preliminary_impact_level", "increments offering.version by 1"]
  - method: GET
    path: "/offerings/{id}/data-categories"
    description: "List the offering's declared information types."
    roles: [CspComplianceLead, ThirdPartyAssessor, AgencyAuthorizingOfficial, ProgramBoardReviewer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DataCategory[]
    side_effects: []
  - method: POST
    path: "/data-categories/{id}/confirm"
    description: "Confirm or withdraw a declared information type as part of categorization review."
    roles: [ProgramBoardReviewer, AgencyAuthorizingOfficial]
    code: 200
    input: [decision]
    output: DataCategory
    side_effects: ["recomputes offering.preliminary_impact_level", "increments offering.version by 1"]
  - method: POST
    path: "/offerings/{id}/impact-determination"
    description: "Determine the offering's final impact level from confirmed categories and bind the matching control baseline."
    roles: [ProgramBoardReviewer]
    code: 200
    input: []
    output: CloudServiceOffering
    side_effects: ["writes final_impact_level and baseline_id", "moves offering DRAFT -> CATEGORIZED", "increments offering.version by 1"]
  - method: POST
    path: "/offerings/{id}/path-selection"
    description: "Select the authorization path: agency sponsorship or program board review."
    roles: [CspComplianceLead]
    code: 200
    input: ["authorization_path", "sponsor_agency_id?"]
    output: CloudServiceOffering
    side_effects: ["writes authorization_path and sponsor_agency_id", "increments Agency.sponsored_offering_count for the AGENCY_SPONSORED path", "moves offering CATEGORIZED -> PATH_SELECTED", "increments offering.version by 1"]
  - method: GET
    path: "/offerings/{id}/crm-coverage"
    description: "Computed read: customer responsibility matrix coverage, per family and overall, evaluated live."
    roles: [CspComplianceLead, ThirdPartyAssessor, AgencyAuthorizingOfficial, ProgramBoardReviewer]
    code: 200
    input: []
    output: { overall_coverage_pct: number, weight_total: integer, family_breakdown: array, evaluated_at: datetime }
    side_effects: []

  # --- control implementations -------------------------------------------
  - method: POST
    path: "/control-implementations"
    description: "Record a control implementation and its customer responsibility matrix entry."
    roles: [CspComplianceLead]
    code: 201
    input: ["offering_id", "control_id", "family_code", "implementation_status?", "crm_documented?", "customer_responsibility_text?", "inherited_from_offering_id?"]
    output: ControlImplementation
    side_effects: ["none beyond the row itself; coverage is computed on read and frozen at submission"]
  - method: PATCH
    path: "/control-implementations/{id}"
    description: "Update a control implementation's status or customer responsibility matrix entry."
    roles: [CspComplianceLead]
    code: 200
    input: ["implementation_status?", "crm_documented?", "customer_responsibility_text?", "inherited_from_offering_id?"]
    output: ControlImplementation
    side_effects: ["increments the row's version by 1"]
  - method: GET
    path: "/control-implementations/{id}"
    description: "Read one control implementation."
    roles: [CspComplianceLead, ThirdPartyAssessor, AgencyAuthorizingOfficial, ProgramBoardReviewer]
    code: 200
    input: []
    output: ControlImplementation
    side_effects: []
  - method: GET
    path: "/control-implementations"
    description: "List control implementations with filters and pagination."
    roles: [CspComplianceLead, ThirdPartyAssessor, AgencyAuthorizingOfficial, ProgramBoardReviewer]
    code: 200
    input: ["offering_id?", "inherited_from_offering_id?", "family_code?", "implementation_status?", "crm_documented?", "limit?", "offset?"]
    output: ControlImplementation[]
    side_effects: []

  # --- assessment engagement --------------------------------------------
  - method: POST
    path: "/assessment-engagements"
    description: "Engage a third-party assessment organization and price the engagement."
    roles: [CspComplianceLead]
    code: 201
    input: [offering_id, assessor_org_name, assessor_user_id, contracted_hours, labor_cost_usd]
    output: AssessmentEngagement
    side_effects: ["runs calculations.engagement_cost_rollup", "sets allocated_hours 0 and unallocated_hours = contracted_hours"]
  - method: GET
    path: "/assessment-engagements/{id}"
    description: "Read one engagement including its hour ledger and cost rollup."
    roles: [CspComplianceLead, ThirdPartyAssessor, AgencyAuthorizingOfficial, ProgramBoardReviewer]
    code: 200
    input: []
    output: AssessmentEngagement
    side_effects: []
  - method: GET
    path: "/offerings/{id}/assessment-engagements"
    description: "List the engagements attached to one offering."
    roles: [CspComplianceLead, ThirdPartyAssessor, AgencyAuthorizingOfficial, ProgramBoardReviewer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AssessmentEngagement[]
    side_effects: []
  - method: POST
    path: "/assessment-engagements/{id}/plan"
    description: "Submit the assessment plan with its testing window."
    roles: [ThirdPartyAssessor]
    code: 200
    input: [planned_test_start, planned_test_end]
    output: AssessmentEngagement
    side_effects: ["moves engagement DRAFT -> PLAN_SUBMITTED"]
  - method: POST
    path: "/assessment-engagements/{id}/plan-approval"
    description: "Approve or reject the submitted assessment plan."
    roles: [ProgramBoardReviewer, AgencyAuthorizingOfficial]
    code: 200
    input: [decision]
    output: AssessmentEngagement
    side_effects: ["APPROVE moves engagement to PLAN_APPROVED and offering PATH_SELECTED -> IN_ASSESSMENT", "REJECT returns the engagement to DRAFT and increments plan_revision_round"]
  - method: POST
    path: "/test-slots"
    description: "Schedule a testing slot and draw its hours from the engagement pool."
    roles: [ThirdPartyAssessor]
    code: 201
    input: [engagement_id, family_code, start_at, end_at, hours]
    output: TestSlot
    side_effects: ["runs calculations.test_slot_overlap_geometry", "runs calculations.engagement_hour_ledger", "moves engagement PLAN_APPROVED -> TESTING on the first slot", "increments engagement.version by 1"]
  - method: POST
    path: "/test-slots/{id}/cancel"
    description: "Cancel a scheduled testing slot and return its hours to the pool."
    roles: [ThirdPartyAssessor]
    code: 200
    input: []
    output: TestSlot
    side_effects: ["returns slot.hours to engagement.unallocated_hours", "increments engagement.version by 1"]
  - method: GET
    path: "/assessment-engagements/{id}/test-slots"
    description: "List the testing schedule of one engagement."
    roles: [CspComplianceLead, ThirdPartyAssessor, AgencyAuthorizingOfficial, ProgramBoardReviewer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: TestSlot[]
    side_effects: []
  - method: POST
    path: "/assessment-engagements/{id}/report"
    description: "Deliver the security assessment report and open one plan-of-action item per finding. `findings` is an array (possibly empty) of objects {control_id: string, severity: HIGH|MODERATE|LOW, detected_at: datetime}; each element becomes one PoamItem with source ASSESSMENT."
    roles: [ThirdPartyAssessor]
    code: 200
    input: [findings]
    output: AssessmentEngagement
    side_effects: ["creates one PoamItem per finding with source ASSESSMENT", "moves every SCHEDULED TestSlot to COMPLETED", "moves engagement TESTING -> REPORT_DELIVERED"]

  # --- POA&M -------------------------------------------------------------
  - method: POST
    path: "/poam-items"
    description: "Open a plan-of-action-and-milestones item, optionally superseding an earlier one."
    roles: [CspComplianceLead]
    code: 201
    input: ["offering_id", "control_id", "severity", "detected_at", "source?", "supersedes_item_id?"]
    output: PoamItem
    side_effects: ["runs calculations.poam_remediation_deadline", "closes the superseded item with closure_reason SUPERSEDED", "recomputes Authorization counters and residual_risk_score when the offering is authorized"]
  - method: GET
    path: "/poam-items/{id}"
    description: "Read one plan-of-action item including both status dimensions and its deadline."
    roles: [CspComplianceLead, ThirdPartyAssessor, AgencyAuthorizingOfficial, ProgramBoardReviewer]
    code: 200
    input: []
    output: PoamItem
    side_effects: []
  - method: GET
    path: "/poam-items"
    description: "List plan-of-action items with filters and pagination."
    roles: [CspComplianceLead, ThirdPartyAssessor, AgencyAuthorizingOfficial, ProgramBoardReviewer]
    code: 200
    input: ["offering_id?", "supersedes_item_id?", "remediation_status?", "risk_disposition?", "severity?", "source?", "limit?", "offset?"]
    output: PoamItem[]
    side_effects: []
  - method: POST
    path: "/poam-items/{id}/remediation"
    description: "Advance the remediation dimension of a plan-of-action item."
    roles: [CspComplianceLead, ThirdPartyAssessor]
    code: 200
    input: [action]
    output: PoamItem
    side_effects: ["moves remediation_status per §1.2", "recomputes Authorization counters and residual_risk_score"]
  - method: POST
    path: "/deviation-requests"
    description: "File a deviation request against an open finding."
    roles: [CspComplianceLead]
    code: 201
    input: ["poam_item_id", "kind", "justification", "requested_extension_days?"]
    output: DeviationRequest
    side_effects: ["sets the item's risk_disposition to DEVIATION_REQUESTED", "sets submitted_by_user_id from X-User-ID"]
  - method: POST
    path: "/deviation-requests/{id}/route"
    description: "Route a submitted deviation request to the board queue or the agency queue."
    roles: [ProgramBoardReviewer]
    code: 200
    input: [review_queue]
    output: DeviationRequest
    side_effects: ["writes review_queue and routed_by_user_id", "moves the request to BOARD_REVIEW or AGENCY_REVIEW"]
  - method: POST
    path: "/deviation-requests/{id}/decision"
    description: "Approve or deny a routed deviation request; the queue decides which side effects fire."
    roles: [ProgramBoardReviewer, AgencyAuthorizingOfficial]
    code: 200
    input: [decision]
    output: DeviationRequest
    side_effects: ["writes decided_by_user_id and granted_extension_days", "applies the branch-specific PoamItem effects in §1.2", "recomputes PoamItem.deadline_at and Authorization.residual_risk_score"]
  - method: GET
    path: "/deviation-requests/{id}"
    description: "Read one deviation request."
    roles: [CspComplianceLead, ThirdPartyAssessor, AgencyAuthorizingOfficial, ProgramBoardReviewer]
    code: 200
    input: []
    output: DeviationRequest
    side_effects: []
  - method: GET
    path: "/deviation-requests"
    description: "List deviation requests with filters and pagination."
    roles: [CspComplianceLead, ThirdPartyAssessor, AgencyAuthorizingOfficial, ProgramBoardReviewer]
    code: 200
    input: ["poam_item_id?", "status?", "review_queue?", "kind?", "limit?", "offset?"]
    output: DeviationRequest[]
    side_effects: []

  # --- authorization package --------------------------------------------
  - method: POST
    path: "/authorization-packages"
    description: "Create an authorization package for an offering; supersedes the offering's prior open package."
    roles: [CspComplianceLead]
    code: 201
    input: [offering_id, engagement_id, expected_offering_version]
    output: AuthorizationPackage
    side_effects: ["supersedes any DRAFT or REVISION_REQUESTED package of the offering", "increments offering.open_package_count", "increments CloudServiceOffering.version by 1"]
  - method: POST
    path: "/authorization-packages/{id}/submit"
    description: "Submit the package for review, freezing coverage, risk and finding counts."
    roles: [CspComplianceLead]
    code: 200
    input: []
    output: AuthorizationPackage
    side_effects: ["freezes crm_coverage_pct, residual_risk_score_at_submission and open_findings_at_submission", "increments submission_round and sets submitted_at", "moves offering IN_ASSESSMENT -> PACKAGE_SUBMITTED", "increments offering.version by 1"]
  - method: POST
    path: "/authorization-packages/{id}/review"
    description: "Take the submitted package into program review and record the reviewer identity."
    roles: [ProgramBoardReviewer]
    code: 200
    input: []
    output: AuthorizationPackage
    side_effects: ["writes reviewed_by_user_id from X-User-ID"]
  - method: POST
    path: "/authorization-packages/{id}/revision-request"
    description: "Send the package back for revision, or reject it when the revision limit is exhausted."
    roles: [ProgramBoardReviewer]
    code: 200
    input: [revision_note]
    output: AuthorizationPackage
    side_effects: ["writes revision_note", "on submission_round == 3 rejects the package and voids the backing engagement, cancelling its SCHEDULED slots"]
  - method: POST
    path: "/authorization-packages/{id}/decision"
    description: "Issue the authorization decision: accept the residual risk and mint the authorization letter, or reject."
    roles: [ProgramBoardReviewer, AgencyAuthorizingOfficial]
    code: 200
    input: ["decision", "risk_acceptance_note?"]
    output: AuthorizationPackage
    side_effects: ["AUTHORIZE mints letter_reference and creates the Authorization row, drives offering to AUTHORIZED, creates the first MonitoringPeriod and re-anchors ASSESSMENT findings", "REJECT closes the package without an Authorization"]
  - method: GET
    path: "/authorization-packages/{id}"
    description: "Read one authorization package; agency access is gated by sponsorship or a reuse grant."
    roles: [CspComplianceLead, ThirdPartyAssessor, AgencyAuthorizingOfficial, ProgramBoardReviewer]
    code: 200
    input: []
    output: AuthorizationPackage
    side_effects: []
  - method: GET
    path: "/authorization-packages"
    description: "List authorization packages with filters and pagination."
    roles: [CspComplianceLead, ThirdPartyAssessor, AgencyAuthorizingOfficial, ProgramBoardReviewer]
    code: 200
    input: ["offering_id?", "engagement_id?", "status?", "limit?", "offset?"]
    output: AuthorizationPackage[]
    side_effects: []

  # --- authorization & continuous monitoring ----------------------------
  - method: GET
    path: "/authorizations/{id}"
    description: "Read one authorization including both state dimensions, the stored risk score and the seat ledger."
    roles: [CspComplianceLead, ThirdPartyAssessor, AgencyAuthorizingOfficial, ProgramBoardReviewer]
    code: 200
    input: []
    output: Authorization
    side_effects: []
  - method: GET
    path: "/authorizations"
    description: "List authorizations with filters and pagination."
    roles: [CspComplianceLead, ThirdPartyAssessor, AgencyAuthorizingOfficial, ProgramBoardReviewer]
    code: 200
    input: ["offering_id?", "package_id?", "authorization_status?", "monitoring_posture?", "limit?", "offset?"]
    output: Authorization[]
    side_effects: []
  - method: GET
    path: "/authorizations/{id}/risk-summary"
    description: "Computed read: residual risk recomputed live under the at_monitoring_review variant, next to the stored value."
    roles: [CspComplianceLead, ThirdPartyAssessor, AgencyAuthorizingOfficial, ProgramBoardReviewer]
    code: 200
    input: []
    output: { residual_risk_score: number, poam_risk_tier: string, stored_residual_risk_score: number, open_findings_count: integer, overdue_high_count: integer, evaluated_at: datetime }
    side_effects: []
  - method: POST
    path: "/authorizations/{id}/monitoring-periods"
    description: "Open a monthly continuous-monitoring period for the authorization."
    roles: [CspComplianceLead, ProgramBoardReviewer]
    code: 201
    input: [period_month]
    output: MonitoringPeriod
    side_effects: ["computes window_start, window_end and scan_due_at"]
  - method: GET
    path: "/authorizations/{id}/monitoring-periods"
    description: "List the monitoring periods of one authorization."
    roles: [CspComplianceLead, ThirdPartyAssessor, AgencyAuthorizingOfficial, ProgramBoardReviewer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: MonitoringPeriod[]
    side_effects: []
  - method: GET
    path: "/monitoring-periods/{id}"
    description: "Read one monitoring period including its submission counters and covered scan types."
    roles: [CspComplianceLead, ThirdPartyAssessor, AgencyAuthorizingOfficial, ProgramBoardReviewer]
    code: 200
    input: []
    output: MonitoringPeriod
    side_effects: []
  - method: POST
    path: "/monitoring-periods/{id}/scan-submissions"
    description: "Submit the monthly vulnerability scans for a monitoring period."
    roles: [CspComplianceLead]
    code: 201
    input: [scan_types]
    output: ScanSubmission
    side_effects: ["runs calculations.scan_submission_timeliness", "updates the period's submission counters and covered_scan_types", "increments MonitoringPeriod.version by 1"]
  - method: GET
    path: "/monitoring-periods/{id}/scan-submissions"
    description: "List the scan submissions of one monitoring period."
    roles: [CspComplianceLead, ThirdPartyAssessor, AgencyAuthorizingOfficial, ProgramBoardReviewer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ScanSubmission[]
    side_effects: []
  - method: POST
    path: "/monitoring-periods/{id}/close"
    description: "Close a monitoring period as compliant or deficient and propagate the posture consequences."
    roles: [ProgramBoardReviewer, AgencyAuthorizingOfficial]
    code: 200
    input: []
    output: MonitoringPeriod
    side_effects: ["sets status CLOSED_COMPLIANT or CLOSED_DEFICIENT", "updates Authorization.consecutive_deficient_periods, monitoring_posture and authorization_status", "issues reuse notices and updates Agency.open_notice_count", "auto-creates the next month's MonitoringPeriod while the authorization is AUTHORIZED or SUSPENDED, unless that period_month already exists", "recomputes Authorization.residual_risk_score"]

  # --- significant change -----------------------------------------------
  - method: POST
    path: "/significant-change-requests"
    description: "File a significant change request for boundary changes, new service inclusion or a technology refresh."
    roles: [CspComplianceLead]
    code: 201
    input: ["offering_id", "change_kind", "description", "window_start", "window_end", "added_service_count?"]
    output: SignificantChangeRequest
    side_effects: ["runs calculations.change_window_separation", "computes requires_reassessment", "moves offering AUTHORIZED -> CHANGE_UNDER_REVIEW", "increments offering.version by 1"]
  - method: POST
    path: "/significant-change-requests/{id}/decision"
    description: "Approve or deny a significant change request and update the authorization boundary."
    roles: [ProgramBoardReviewer, AgencyAuthorizingOfficial]
    code: 200
    input: [decision]
    output: SignificantChangeRequest
    side_effects: ["APPROVE increments offering.boundary_version and, for NEW_SERVICE, included_service_count", "returns offering CHANGE_UNDER_REVIEW -> AUTHORIZED", "increments offering.version by 1"]
  - method: GET
    path: "/significant-change-requests/{id}"
    description: "Read one significant change request."
    roles: [CspComplianceLead, ThirdPartyAssessor, AgencyAuthorizingOfficial, ProgramBoardReviewer]
    code: 200
    input: []
    output: SignificantChangeRequest
    side_effects: []
  - method: GET
    path: "/significant-change-requests"
    description: "List significant change requests with filters and pagination."
    roles: [CspComplianceLead, ThirdPartyAssessor, AgencyAuthorizingOfficial, ProgramBoardReviewer]
    code: 200
    input: ["offering_id?", "status?", "change_kind?", "limit?", "offset?"]
    output: SignificantChangeRequest[]
    side_effects: []

  # --- agency reuse ------------------------------------------------------
  - method: POST
    path: "/reuse-grants"
    description: "Request reuse of an existing authorization; consumes one seat of the reuse pool."
    roles: [AgencyAuthorizingOfficial]
    code: 201
    input: [authorization_id, agency_id, expected_authorization_version]
    output: ReuseGrant
    side_effects: ["runs calculations.reuse_seat_ledger", "increments Agency.reuse_grant_count", "increments Authorization.version by 1"]
  - method: POST
    path: "/reuse-grants/{id}/package-access"
    description: "Grant the requesting agency read access to the authorization package."
    roles: [CspComplianceLead]
    code: 200
    input: []
    output: ReuseGrant
    side_effects: ["moves access_state REQUESTED -> PACKAGE_ACCESS_GRANTED"]
  - method: POST
    path: "/reuse-grants/{id}/incremental-review"
    description: "Record the agency's incremental review outcome and accept or iterate."
    roles: [AgencyAuthorizingOfficial]
    code: 200
    input: [decision, findings_count]
    output: ReuseGrant
    side_effects: ["writes incremental_review_findings_count", "ACCEPT sets reuse_accepted_at and clears an outstanding notice on the agency"]
  - method: POST
    path: "/reuse-grants/{id}/revoke"
    description: "Revoke a reuse grant and return its seat to the pool."
    roles: [AgencyAuthorizingOfficial, ProgramBoardReviewer]
    code: 200
    input: [reason]
    output: ReuseGrant
    side_effects: ["returns the seat to Authorization.reuse_seats_available", "decrements Agency.reuse_grant_count and any outstanding notice", "increments Authorization.version by 1"]
  - method: GET
    path: "/reuse-grants/{id}"
    description: "Read one reuse grant."
    roles: [CspComplianceLead, ThirdPartyAssessor, AgencyAuthorizingOfficial, ProgramBoardReviewer]
    code: 200
    input: []
    output: ReuseGrant
    side_effects: []
  - method: GET
    path: "/reuse-grants"
    description: "List reuse grants with filters and pagination."
    roles: [CspComplianceLead, ThirdPartyAssessor, AgencyAuthorizingOfficial, ProgramBoardReviewer]
    code: 200
    input: ["authorization_id?", "agency_id?", "access_state?", "limit?", "offset?"]
    output: ReuseGrant[]
    side_effects: []

  # --- test-driving endpoint --------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to real wall-clock time."
    roles: [ProgramBoardReviewer]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["all deadline, window, timeliness and expiry comparisons use the logical clock"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the four declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed for the endpoint"
  - id: ERR_ACTION_ROLE_MISMATCH
    http: 403
    condition: "remediation action START or SUBMIT_EVIDENCE attempted by ThirdPartyAssessor, or VERIFY_CLOSE or REOPEN attempted by CspComplianceLead"
  - id: ERR_WRONG_REVIEW_QUEUE
    http: 403
    condition: "the acting role does not own the routed queue or path, or the requested queue is illegal for the deviation kind"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, illegal enum member, non-positive hours or cost, empty or duplicated array, malformed period_month, or pagination outside limit 1..100 / offset >= 0"
  - id: ERR_OFFERING_NOT_FOUND
    http: 404
    condition: "no CloudServiceOffering with the given id"
  - id: ERR_DATA_CATEGORY_NOT_FOUND
    http: 404
    condition: "no DataCategory with the given id"
  - id: ERR_BASELINE_NOT_FOUND
    http: 404
    condition: "no ControlBaseline with the given id"
  - id: ERR_CONTROL_IMPLEMENTATION_NOT_FOUND
    http: 404
    condition: "no ControlImplementation with the given id"
  - id: ERR_ENGAGEMENT_NOT_FOUND
    http: 404
    condition: "no AssessmentEngagement with the given id"
  - id: ERR_TEST_SLOT_NOT_FOUND
    http: 404
    condition: "no TestSlot with the given id"
  - id: ERR_PACKAGE_NOT_FOUND
    http: 404
    condition: "no AuthorizationPackage with the given id"
  - id: ERR_POAM_ITEM_NOT_FOUND
    http: 404
    condition: "no PoamItem with the given id, including an unresolvable supersedes_item_id"
  - id: ERR_DEVIATION_NOT_FOUND
    http: 404
    condition: "no DeviationRequest with the given id"
  - id: ERR_AUTHORIZATION_NOT_FOUND
    http: 404
    condition: "no Authorization with the given id"
  - id: ERR_MONITORING_PERIOD_NOT_FOUND
    http: 404
    condition: "no MonitoringPeriod with the given id"
  - id: ERR_CHANGE_REQUEST_NOT_FOUND
    http: 404
    condition: "no SignificantChangeRequest with the given id"
  - id: ERR_REUSE_GRANT_NOT_FOUND
    http: 404
    condition: "no ReuseGrant with the given id"
  - id: ERR_AGENCY_NOT_FOUND
    http: 404
    condition: "no Agency with the given id"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "the acting identity is not the offering owner, the engagement assessor, or the grant's agency"
  - id: ERR_PACKAGE_ACCESS_DENIED
    http: 403
    condition: "an AgencyAuthorizingOfficial reads a package without sponsorship and without a reuse grant in an access-bearing state"
  - id: ERR_STALE_OFFERING_VERSION
    http: 412
    condition: "expected_offering_version does not equal the offering's current version"
  - id: ERR_STALE_AUTHORIZATION_VERSION
    http: 412
    condition: "expected_authorization_version does not equal the authorization's current version"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target row is not in a declared from-state for the requested transition"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "the target row already sits in a terminal state for the requested transition"
  - id: ERR_ENGAGEMENT_REPORT_NOT_DELIVERED
    http: 409
    condition: "package submission attempted while the backing engagement is not REPORT_DELIVERED"
  - id: ERR_AUTHORIZATION_NOT_ACTIVE
    http: 409
    condition: "the authorization is not AUTHORIZED, or its monitoring_posture is ESCALATED"
  - id: ERR_DEVIATION_PENDING_ON_ITEM
    http: 409
    condition: "verification closure attempted while a deviation request on the item is still SUBMITTED, BOARD_REVIEW or AGENCY_REVIEW"
  - id: ERR_INHERITED_OFFERING_NOT_AUTHORIZED
    http: 409
    condition: "inherited_from_offering_id points at an offering whose status is not AUTHORIZED"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the deciding user id equals the routing user id on a deviation, or the reviewing user id on a program-board package decision"
  - id: ERR_NO_CONFIRMED_DATA_CATEGORY
    http: 422
    condition: "impact determination attempted with an empty set of CONFIRMED data categories"
  - id: ERR_BASELINE_NOT_AVAILABLE
    http: 422
    condition: "no non-retired ControlBaseline exists for the determined final impact level"
  - id: ERR_CRM_TEXT_REQUIRED
    http: 422
    condition: "crm_documented is true while customer_responsibility_text is absent or empty"
  - id: ERR_INCOMPLETE_SCAN_SET
    http: 422
    condition: "scan_types omits INFRASTRUCTURE, WEB_APP or DATABASE"
  - id: ERR_WINDOW_INVALID
    http: 422
    condition: "an interval's start is at or after its end"
  - id: ERR_DETECTION_DATE_IN_FUTURE
    http: 422
    condition: "detected_at is after the logical clock"
  - id: ERR_SCAN_WINDOW_NOT_OPEN
    http: 422
    condition: "scan submission attempted before the period's window_start"
  - id: ERR_PERIOD_NOT_ENDED
    http: 409
    condition: "period close attempted before the period's window_end"
  - id: ERR_TEST_SLOT_OVERLAP
    http: 409
    condition: "a new test slot's half-open interval intersects a SCHEDULED or COMPLETED slot of the same engagement"
  - id: ERR_CHANGE_WINDOW_BUFFER_VIOLATION
    http: 409
    condition: "a new change window is separated by less than 7 days from a SUBMITTED or APPROVED change window of the same offering"
  - id: ERR_DUPLICATE_MONITORING_PERIOD
    http: 409
    condition: "a monitoring period already exists for the same authorization and period_month"
  - id: ERR_DUPLICATE_REUSE_GRANT
    http: 409
    condition: "a non-revoked reuse grant already exists for the same authorization and agency"
  - id: ERR_DUPLICATE_CONTROL_IMPLEMENTATION
    http: 409
    condition: "control_id already recorded for the offering, or category_code already declared for the offering"
  - id: ERR_REVISION_LIMIT_EXCEEDED
    http: 409
    condition: "a 4th authorization package is created for an offering that already has 3 package rows"
  - id: ERR_ENGAGEMENT_OFFERING_MISMATCH
    http: 409
    condition: "the engagement referenced by a package belongs to a different offering"
  - id: ERR_POAM_OFFERING_MISMATCH
    http: 409
    condition: "the deviation's finding belongs to an offering the acting official is not entitled to act on"
  - id: ERR_SPONSOR_AGENCY_MISMATCH
    http: 403
    condition: "the acting AgencyAuthorizingOfficial is not the offering's sponsor agency"
  - id: ERR_SUPERSEDED_ITEM_MISMATCH
    http: 409
    condition: "supersedes_item_id points at a finding of a different offering"
  - id: ERR_CRM_COVERAGE_INSUFFICIENT
    http: 422
    condition: "customer responsibility matrix coverage is below 90.00 percent at submission"
  - id: ERR_RESIDUAL_RISK_TOO_HIGH
    http: 422
    condition: "the at_submission residual risk score is 50.00 or above"
  - id: ERR_OVERDUE_HIGH_FINDINGS
    http: 422
    condition: "at least one HIGH severity finding is open and past its deadline at submission time"
  - id: ERR_ENGAGEMENT_HOURS_EXHAUSTED
    http: 422
    condition: "requested slot hours exceed the engagement's unallocated hours"
  - id: ERR_REUSE_SEATS_EXHAUSTED
    http: 422
    condition: "the authorization's reuse seat pool has no available seat"
  - id: ERR_SPONSORSHIP_CAPACITY_EXCEEDED
    http: 422
    condition: "the sponsoring agency already sponsors as many offerings as its capacity allows"
  - id: ERR_INCREMENTAL_FINDINGS_EXCEED_TOLERANCE
    http: 422
    condition: "an incremental review acceptance carries more than 5 findings"
  - id: ERR_ASSESSMENT_BUDGET_EXCEEDED
    http: 422
    condition: "the engagement's total cost exceeds the offering's approved assessment budget at submission"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: CspComplianceLead
    description: "Cloud service provider compliance team member; owns offerings, control implementations, findings, engagements, packages, scan submissions and change requests."
    identity: "opaque"
    exclusive_operations:
      - "POST /offerings"
      - "POST /offerings/{id}/data-categories"
      - "POST /offerings/{id}/path-selection"
      - "POST /control-implementations"
      - "PATCH /control-implementations/{id}"
      - "POST /assessment-engagements"
      - "POST /poam-items"
      - "POST /deviation-requests"
      - "POST /authorization-packages"
      - "POST /authorization-packages/{id}/submit"
      - "POST /monitoring-periods/{id}/scan-submissions"
      - "POST /significant-change-requests"
      - "POST /reuse-grants/{id}/package-access"
    shared_operations:
      - "POST /poam-items/{id}/remediation (actions START and SUBMIT_EVIDENCE only)"
      - "POST /authorizations/{id}/monitoring-periods"
      - "all GET endpoints"
    note: "X-User-ID is an operator identifier compared against CloudServiceOffering.owner_user_id; it never equals any entity's id."

  - name: ThirdPartyAssessor
    description: "Accredited third-party assessment organization user; owns the assessment plan, the testing schedule, the report and verification of remediation evidence."
    identity: "opaque"
    exclusive_operations:
      - "POST /assessment-engagements/{id}/plan"
      - "POST /test-slots"
      - "POST /test-slots/{id}/cancel"
      - "POST /assessment-engagements/{id}/report"
    shared_operations:
      - "POST /poam-items/{id}/remediation (actions VERIFY_CLOSE and REOPEN only)"
      - "all GET endpoints"
    note: "X-User-ID is an operator identifier compared against AssessmentEngagement.assessor_user_id; it never equals any entity's id."

  - name: AgencyAuthorizingOfficial
    description: "Authorizing official of a federal agency; accepts residual risk on the sponsored path, decides agency-queue deviations, closes monitoring periods and drives agency reuse."
    identity: "entity_backed:Agency"
    exclusive_operations:
      - "POST /reuse-grants"
      - "POST /reuse-grants/{id}/incremental-review"
    shared_operations:
      - "POST /data-categories/{id}/confirm"
      - "POST /assessment-engagements/{id}/plan-approval"
      - "POST /authorization-packages/{id}/decision"
      - "POST /deviation-requests/{id}/decision"
      - "POST /monitoring-periods/{id}/close"
      - "POST /significant-change-requests/{id}/decision"
      - "POST /reuse-grants/{id}/revoke"
      - "all GET endpoints, with package reads gated by sponsorship or an access-bearing reuse grant"
    note: "X-User-ID equals an Agency.id; sponsorship and grant-ownership checks compare it to CloudServiceOffering.sponsor_agency_id and ReuseGrant.agency_id."

  - name: ProgramBoardReviewer
    description: "Government cloud authorization program board member; publishes baselines and agencies, determines impact levels, reviews packages, routes deviations, decides board-queue items and closes monitoring periods."
    identity: "opaque"
    exclusive_operations:
      - "POST /agencies"
      - "POST /control-baselines"
      - "POST /offerings/{id}/impact-determination"
      - "POST /authorization-packages/{id}/review"
      - "POST /authorization-packages/{id}/revision-request"
      - "POST /deviation-requests/{id}/route"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /data-categories/{id}/confirm"
      - "POST /assessment-engagements/{id}/plan-approval"
      - "POST /authorization-packages/{id}/decision"
      - "POST /deviation-requests/{id}/decision"
      - "POST /authorizations/{id}/monitoring-periods"
      - "POST /monitoring-periods/{id}/close"
      - "POST /significant-change-requests/{id}/decision"
      - "POST /reuse-grants/{id}/revoke"
      - "all GET endpoints"
    note: "X-User-ID is an operator identifier; segregation of duties compares it against AuthorizationPackage.reviewed_by_user_id and DeviationRequest.routed_by_user_id."
