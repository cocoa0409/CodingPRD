          - state_machines.Contract.ACTIVE_to_CANCELLED
        distinguishing_aspect: |
          Entity pair: (Contract, ClaimTicket). Different pair from instance A.
          Contract /cancel from ACTIVE requires NO ClaimTicket on the contract
          in {SUBMITTED, ASSESSED, DISPATCHED}. When at least one such claim
