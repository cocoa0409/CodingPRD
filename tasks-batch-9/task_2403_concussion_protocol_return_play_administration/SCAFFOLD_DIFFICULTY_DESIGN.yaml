            - *c_clock_0919
            - *c_step3
            - *c_clock_0920
            - *c_pass3
            - *c_clock_0921
            - *c_step4
            - *c_clock_0923
            - *c_pass4
            - *c_clock_0925
            - *c_step5
            - *c_clock_0927
            - *c_pass5
            - *c_get_player_v2
            - *c_retest
            - *c_get_case_v
            - *c_request_inc
            - call: "POST /concussion-program/clinicians/${inc_id}/suspend"
              payload: { reason: "license board inquiry opened" }
              as: LeagueAdmin
          trigger:
            - call: "POST /concussion-program/inc-clearances/${clearance_id}/decide"
              payload: { decision: "APPROVED", decision_notes: "attempting to clear after suspension" }
              as: IndependentConsultant
              as_user_id: "${inc_id}"
          assert:
            - "after suspend: Clinician.${inc_id}.status == SUSPENDED"
            - "after suspend: IncClearance.${clearance_id}.status == SUPERSEDED and decided_at == null"
            - "after suspend: ConcussionCase.${case_id}.case_status == RTP_IN_PROGRESS"
            - "after suspend: ConcussionCase.${case_id}.rtp_stage == 5 and earliest_return_at == 2026-09-28T12:00:00.000Z"
            - "after suspend: ReturnStep.${step5_id}.status == PASSED"
            - "trigger: response status 409 with error_id ERR_CLINICIAN_SUSPENDED"
            - "trigger: the response error_id is NOT ERR_CLEARANCE_STATE_INVALID"
            - "trigger: IncClearance.${clearance_id}.status is still SUPERSEDED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: stage_rest_buffer_half_open_admits_exact_boundary_start
        grounds:
          - calculations.rtp_stage_gating_windows
          - validations.priority_26_ERR_STAGE_REST_BUFFER_VIOLATION
          - entities.ReturnStep.fields.min_start_at
          - state_machines.ReturnStep.initial_state
        distinguishing_aspect: |
          The ConcussionCase stage timeline is a HALF-OPEN [min_start_at, infinity) window on the case
          resource: one second before min_start_at (2026-09-17T11:59:59Z) the stage-2 start is refused,
          and at exactly min_start_at (2026-09-17T12:00:00Z) it is accepted - touching the boundary is
          legal here.
        test_recipe:
          setup:
            - "The canonical case with stage 1 passed at 2026-09-16T12:00:00Z, so stage 2 has min_start_at 2026-09-17T12:00:00Z (STAGE_REST_HOURS[2] = 24)"
          setup_api_calls:
            - *c_clock_aug1
            - *c_club_h
            - *c_club_r
            - *c_doc_h
            - *c_obs
            - *c_inc
            - *c_player
            - *c_baseline
            - *c_game
            - *c_clock_kick
            - *c_game_live
            - *c_clock_1805
            - *c_eval
            - *c_screen
            - *c_clock_1810
            - *c_exam
            - *c_clock_1819
            - *c_diagnose
            - *c_clock_0915
            - *c_step1
            - *c_clock_0916
            - *c_pass1
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-17T11:59:59Z" }
              as: LeagueAdmin
          trigger:
            - call: "POST /concussion-program/concussion-cases/${case_id}/return-steps"
              payload: { stage_index: 2 }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
            - *c_clock_0917
            - call: "POST /concussion-program/concussion-cases/${case_id}/return-steps"
              payload: { stage_index: 2 }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
          assert:
            - "trigger at 11:59:59Z: response status 409 with error_id ERR_STAGE_REST_BUFFER_VIOLATION"
            - "trigger at 11:59:59Z: no ReturnStep with stage_index 2 exists"
            - "trigger at 12:00:00Z: response status 201, ReturnStep.status == IN_PROGRESS, started_at == 2026-09-17T12:00:00.000Z"
            - "trigger at 12:00:00Z: ReturnStep.min_start_at == 2026-09-17T12:00:00.000Z and dwell_complete_at == 2026-09-18T12:00:00.000Z"

      - name: consultant_exam_block_closed_interval_rejects_touching_start
        grounds:
          - calculations.inc_exam_block_conflict
          - validations.priority_25_ERR_INC_EXAM_WINDOW_CONFLICT
          - entities.SidelineEvaluation.fields.inc_block_ends_at
          - state_machines.SidelineEvaluation.SCREENED_to_LOCKER_ROOM_EXAM
        distinguishing_aspect: |
          The consultant is the contended resource and his 30-minute exam block is a CLOSED interval,
          so a second exam starting at exactly 2026-09-13T18:40:00Z - the instant the first block ends -
          collides, while 18:40:01Z is accepted; this is the opposite boundary convention from the
          half-open stage-rest window on the case.
        test_recipe:
          setup:
            - "The canonical evaluation whose locker-room exam started at 2026-09-13T18:10:00Z with Dr Osei, giving the block [18:10:00, 18:40:00]"
            - "A second Harbor City player with a club-initiated evaluation in the same live game, screened at 18:35"
          setup_api_calls:
