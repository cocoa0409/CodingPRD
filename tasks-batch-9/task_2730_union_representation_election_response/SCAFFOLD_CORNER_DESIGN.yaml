      - name: a_determined_or_settled_charge_refuses_further_dispositions
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_CHARGE_STATUS_INVALID
          - errors.ERR_INVALID_REQUEST
          - state_machines.ULPCharge
          - endpoints.POST_ulp_charges_id_determine
        distinguishing_aspect: |
          The charge lifecycle has two terminal states and both must lock: a DISMISSED charge refuses both a
          second determination and a settlement, and a SETTLED charge refuses a second settlement. A MERIT
          determination that omits the mandatory remedy_code is a 422 body error, not a 409 status error, and
          must leave the charge in FILED so the retry can succeed. Neither charge is blocking, so the case
          posture never leaves OPEN.
        test_recipe:
          setup:
            - "petition 07-RC-340502 SOI_VERIFIED with two non-blocking ULP charges docketed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-03T09:00:00Z"}
              as: LaborRelationsDirector
            - call: "POST /labor-relations/petitions"
              payload: {"case_number": "07-RC-340502", "petition_type": "RC", "union_name": "United Plant Workers Local 812", "filed_date": "2026-08-03", "proposed_unit_description": "All production and maintenance employees at Plant 1", "claimed_employee_count": 120, "payroll_period_end": "2026-08-14"}
              as: LaborRelationsDirector
              captures: {"pet_id": "$.data.id"}
            - call: "POST /labor-relations/petitions/${pet_id}/open-scope-analysis"
              payload: {}
              as: LaborRelationsDirector
            - call: "POST /labor-relations/classifications"
              payload: {"petition_id": "${pet_id}", "code": "PROD", "title": "Production Operator", "headcount": 60, "avg_hourly_wage_cents": 2400, "shift_code": "A", "work_location": "PLANT_1", "supervisory_authority_count": 0, "employer_position": "INCLUDE", "union_position": "INCLUDE", "supervision_overlap": 88, "skills_overlap": 90, "functional_integration": 92, "interchange_rate": 74, "work_conditions_overlap": 95}
              as: HRDataAnalyst
              captures: {"cls_prod_id": "$.data.id"}
            - call: "POST /labor-relations/classifications"
              payload: {"petition_id": "${pet_id}", "code": "MAINT", "title": "Maintenance Mechanic", "headcount": 30, "avg_hourly_wage_cents": 3200, "shift_code": "A", "work_location": "PLANT_1", "supervisory_authority_count": 0, "employer_position": "INCLUDE", "union_position": "INCLUDE", "supervision_overlap": 82, "skills_overlap": 78, "functional_integration": 86, "interchange_rate": 61, "work_conditions_overlap": 84}
              as: HRDataAnalyst
              captures: {"cls_maint_id": "$.data.id"}
            - call: "POST /labor-relations/classifications/${cls_prod_id}/score"
              payload: {"scoring_standard": "TRADITIONAL"}
              as: EmploymentCounsel
            - call: "POST /labor-relations/classifications/${cls_maint_id}/score"
              payload: {"scoring_standard": "TRADITIONAL"}
              as: EmploymentCounsel
            - call: "POST /labor-relations/classifications/${cls_prod_id}/rule"
              payload: {"ruling": "INCLUDED", "ruling_rationale": "Core production group"}
              as: BoardAgent
            - call: "POST /labor-relations/classifications/${cls_maint_id}/rule"
              payload: {"ruling": "INCLUDED", "ruling_rationale": "Integrated with production"}
              as: BoardAgent
            - call: "POST /labor-relations/petitions/${pet_id}/verify-showing"
              payload: {"submitted_card_count": 40, "duplicate_card_count": 3, "undated_card_count": 2, "stale_card_count": 2, "nonunit_card_count": 3}
              as: BoardAgent
            - call: "POST /labor-relations/ulp-charges"
              payload: {"petition_id": "${pet_id}", "charging_party": "UNION", "charged_party": "EMPLOYER", "section_code": "8A1", "allegation_summary": "Interrogation of two employees at the line", "conduct_occurred_at": "2026-08-05T10:00:00Z", "blocking_requested": false}
              as: UnionRepresentative
              captures: {"ulp_1": "$.data.id"}
            - call: "POST /labor-relations/ulp-charges"
              payload: {"petition_id": "${pet_id}", "charging_party": "EMPLOYER", "charged_party": "UNION", "section_code": "8B1A", "allegation_summary": "Union threats against employees who declined to sign", "conduct_occurred_at": "2026-08-06T11:00:00Z", "blocking_requested": false}
              as: LaborRelationsDirector
              captures: {"ulp_2": "$.data.id"}
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-10T09:00:00Z"}
              as: BoardAgent
          trigger:
            - call: "POST /labor-relations/ulp-charges/${ulp_1}/determine"
              payload: {"determination": "DISMISS"}
              as: BoardAgent
            - call: "POST /labor-relations/ulp-charges/${ulp_1}/determine"
              payload: {"determination": "MERIT", "remedy_code": "NOTICE_POSTING"}
              as: BoardAgent
              captures: {"err1": "$.data.error_id"}
            - call: "POST /labor-relations/ulp-charges/${ulp_1}/settle"
              payload: {"settlement_type": "NON_BOARD"}
              as: EmploymentCounsel
              captures: {"err2": "$.data.error_id"}
            - call: "POST /labor-relations/ulp-charges/${ulp_2}/determine"
              payload: {"determination": "MERIT"}
              as: BoardAgent
              captures: {"err3": "$.data.error_id"}
            - call: "POST /labor-relations/ulp-charges/${ulp_2}/determine"
              payload: {"determination": "MERIT", "remedy_code": "REINSTATEMENT"}
              as: BoardAgent
            - call: "POST /labor-relations/ulp-charges/${ulp_2}/settle"
              payload: {"settlement_type": "FORMAL"}
              as: EmploymentCounsel
            - call: "POST /labor-relations/ulp-charges/${ulp_2}/settle"
              payload: {"settlement_type": "NON_BOARD"}
              as: BoardAgent
              captures: {"err4": "$.data.error_id"}
            - call: "GET /labor-relations/petitions/${pet_id}"
              payload: {}
              as: BoardAgent
            - call: "GET /labor-relations/ulp-charges"
              payload: {"petition_id": "${pet_id}", "status": "SETTLED"}
              as: EmploymentCounsel
          assert:
            - "call 1 returns HTTP 200 with ULPCharge.${ulp_1}.status == 'DISMISSED' and determined_at == '2026-08-10T09:00:00Z'"
            - "err1 == 'ERR_CHARGE_STATUS_INVALID' with HTTP 409"
            - "err2 == 'ERR_CHARGE_STATUS_INVALID' with HTTP 409 (settlement is only defined from FILED or MERIT_FOUND)"
            - "err3 == 'ERR_INVALID_REQUEST' with HTTP 422 for the missing remedy_code, and ULPCharge.${ulp_2}.status is still 'FILED'"
            - "call 5 returns HTTP 200 with status == 'MERIT_FOUND' and remedy_code == 'REINSTATEMENT'"
            - "call 6 returns HTTP 200 with status == 'SETTLED' and settled_at == '2026-08-10T09:00:00Z'"
            - "err4 == 'ERR_CHARGE_STATUS_INVALID' with HTTP 409"
            - "after call 8: Petition.${pet_id}.case_posture == 'OPEN', blocking_charge_count == 0, notice_posting_end_at is null"
            - "call 9 returns exactly 1 row with total_count == 1"

      - name: an_election_cannot_be_directed_while_scope_is_unresolved
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_SCOPE_RULINGS_INCOMPLETE
          - endpoints.POST_election_agreements_id_direct_election
          - entities.ElectionAgreement.fields.decision_date
          - calculations.deadline_schedule
        distinguishing_aspect: |
          The hearing branch has a precondition the stipulated branch does not: every Classification must be
          out of PENDING before a Decision and Direction of Election may issue. The refusal must not disturb
          the agreement's HEARING_REQUESTED state, and once the last classification is ruled the same call
          succeeds and anchors voter_list_due_at on decision_date (Thursday 2026-08-20 plus two business days
          is Monday 2026-08-24), not on the 2026-08-24 approval clock, which would have given 2026-08-26.
        test_recipe:
          setup:
            - "petition 07-RC-340503 SOI_VERIFIED on the AS_PETITIONED basis (35 of 102 == 34.31) with QC still PENDING"
