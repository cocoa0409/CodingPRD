  - section: errors
    # Coverage audit: every one of the 53 codes in §1.6 is triggered by at least one instance in
    # this file or in SCAFFOLD_DIFFICULTY_DESIGN.yaml. The four auth codes (ERR_UNAUTHENTICATED,
    # ERR_UNKNOWN_ROLE, ERR_FORBIDDEN_ROLE, ERR_CUSTOMER_IDENTITY_UNKNOWN), ERR_ORDER_NOT_OWNED and
    # ERR_SEGREGATION_OF_DUTIES are triggered in the rbac section below; ERR_STALE_VERSION in the
    # complexity_layers section; ERR_MAINTENANCE_WINDOW_OVERLAP, ERR_DOCK_BAY_CAPACITY_EXCEEDED and
    # ERR_NO_TOTES_TO_CONSOLIDATE are triggered by the depth probe (§1.8).
    instances:
      - name: error_envelope_is_uniform_across_the_status_families
        claim_type: error_triggerable
        grounds:
          - response_envelope.error
          - validations[priority=5].ERR_<RESOURCE>_NOT_FOUND
          - validations[priority=9].ERR_INVALID_PAGINATION
          - validations[priority=11].ERR_INVALID_STATE
        distinguishing_aspect: "Whatever the family -- 404 from a path id, 422 from a bad pagination window, 422 from an unknown body field, 409 from a precondition -- the body is the same shape: response_type == \"error\" with data carrying exactly error_id and message, the meta block still present, and NO data fields from the target entity leaking into the error payload."
        test_recipe:
          setup:
            - "One AMBIENT grid zone A1 exists; nothing else is needed."
          setup_api_calls:
            - call: "POST /grid-zones"
              payload: { zone_code: "A1", temperature_zone: "AMBIENT", bot_count: 4 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { zone_amb: $.data.id }
          trigger:
            - call: "GET /grid-zones/00000000-0000-4000-8000-0000000000c1"
              as: GridEngineer
              as_user_id: "engineer-1"
              captures: { err_404: $.data.error_id }
            - call: "GET /inventory-skus"
              payload: { grid_zone_id: "${zone_amb}", limit: 101, offset: 0 }
              as: GridEngineer
              as_user_id: "engineer-1"
              captures: { err_page: $.data.error_id }
            - call: "POST /maintenance-windows"
              payload: { grid_zone_id: "${zone_amb}", window_start: "2026-08-10T03:00:00.000Z", window_end: "2026-08-10T01:00:00.000Z" }
              as: GridEngineer
              as_user_id: "engineer-1"
              captures: { err_body: $.data.error_id }
            - call: "POST /maintenance-windows/00000000-0000-4000-8000-0000000000c2/activate"
              as: GridEngineer
              as_user_id: "engineer-1"
              captures: { err_state: $.data.error_id }
          assert:
            - "trigger 1: HTTP 404, ${err_404} == ERR_ZONE_NOT_FOUND"
            - "trigger 2: HTTP 422, ${err_page} == ERR_INVALID_PAGINATION (limit 101 > max 100)"
            - "trigger 3: HTTP 422, ${err_body} == ERR_INVALID_REQUEST (window_end must be after window_start)"
            - "trigger 4: HTTP 404, ${err_state} == ERR_MAINTENANCE_WINDOW_NOT_FOUND (the path id is resolved before any state check)"
            - "every error response has response_type == \"error\" and data containing exactly the keys error_id and message"
            - "every error response still carries meta.api_request_id and meta.api_request_timestamp"
            - "no error response body contains id, created_at, updated_at or version"
            - "GridZone.${zone_amb} is unchanged: status == OPERATIONAL and last_audited_at == null"

