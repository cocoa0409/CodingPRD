  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: delinquency_tier_inclusive_boundaries
        claim_type: constants_applied
        grounds: [calculations.delinquency_tier_computation]
        distinguishing_aspect: "Delinquency thresholds are inclusive: exactly 5000 cents aged exactly 30 days is DELINQUENT; exactly 20000 aged exactly 60 days is SEVERELY_DELINQUENT."
        test_recipe:
          setup: ["account A1 charged 5000 on 2026-08-01; account A2 charged 20000 on 2026-08-01"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "20 Tier Rd A1" }
              as: ProgramAdmin
              captures: { a1: "$.data.id" }
            - call: "POST /assistance/accounts/${a1}/charges"
              payload: { charge_type: "ARREARAGE", amount_cents: 5000, effective_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "POST /assistance/accounts"
              payload: { service_address: "21 Tier Rd A2" }
              as: ProgramAdmin
              captures: { a2: "$.data.id" }
            - call: "POST /assistance/accounts/${a2}/charges"
              payload: { charge_type: "ARREARAGE", amount_cents: 20000, effective_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "POST /assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /assistance/accounts/${a1}"
              payload: {}
              as: ProgramAdmin
              captures: { a1_tier_30: "$.data.delinquency_tier" }
            - call: "GET /assistance/accounts/${a2}"
              payload: {}
              as: ProgramAdmin
              captures: { a2_tier_30: "$.data.delinquency_tier" }
            - call: "POST /assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T00:00:00Z" }
              as: ProgramAdmin
            - call: "GET /assistance/accounts/${a1}"
              payload: {}
              as: ProgramAdmin
              captures: { a1_tier_60: "$.data.delinquency_tier" }
            - call: "GET /assistance/accounts/${a2}"
              payload: {}
              as: ProgramAdmin
              captures: { a2_tier_60: "$.data.delinquency_tier" }
          assert:
            - "at age 30: A1 (5000) == DELINQUENT (inclusive); A2 (20000, age 30 < 60) == DELINQUENT"
            - "at age 60: A1 stays DELINQUENT (balance below severe floor); A2 == SEVERELY_DELINQUENT (inclusive age boundary)"

      - name: payment_waterfall_bucket_order
        claim_type: correct_result
        grounds: [calculations.payment_application_waterfall, entities.Payment.fields.applied_breakdown]
        distinguishing_aspect: "Without fee or DPA, a 5000 payment against arrearage 3000 + current charges 4000 fills arrearage first (3000), then current (2000), overpayment 0; arrearage_since clears to null."
        test_recipe:
          setup: ["account with ARREARAGE 3000 and CURRENT 4000 charges"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "22 Waterfall Way" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id" }
            - call: "POST /assistance/accounts/${acct_id}/charges"
              payload: { charge_type: "ARREARAGE", amount_cents: 3000, effective_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "POST /assistance/accounts/${acct_id}/charges"
              payload: { charge_type: "CURRENT", amount_cents: 4000 }
              as: ProgramAdmin
          trigger:
            - call: "POST /assistance/payments"
              payload: { account_id: "${acct_id}", amount_cents: 5000, tender_type: "CARD" }
              as: CustomerServiceRep
              captures: { pay_id: "$.data.id", breakdown: "$.data.applied_breakdown", dpa: "$.data.dpa_id" }
            - call: "GET /assistance/accounts/${acct_id}"
              payload: {}
              as: CustomerServiceRep
              captures: { arr: "$.data.arrearage_balance_cents", since: "$.data.arrearage_since", cur: "$.data.current_charges_balance_cents", cred: "$.data.credit_balance_cents" }
          assert:
            - "applied_breakdown == { reconnection_fee_cents: 0, down_payment_cents: 0, installment_cents: 0, dpa_extra_cents: 0, arrearage_cents: 3000, current_charges_cents: 2000, overpayment_cents: 0 }"
            - "Payment.${pay_id}.dpa_id is null (no DPA buckets touched)"
            - "account: arrearage_balance_cents == 0, arrearage_since == null, current_charges_balance_cents == 2000, credit_balance_cents == 0"

      - name: dpa_schedule_remainder_and_final_credit
        claim_type: precision
        grounds: [calculations.dpa_terms_computation, calculations.forgiveness_accrual]
        distinguishing_aspect: "Rounding remainders are absorbed by the final installment and the final credit: covered 100001, n=6, TIER_3 gives installments 10834 x5 + 10831 and credits 4167 x5 + 4165."
        test_recipe:
          setup: ["account with ACTIVE TIER_3 enrollment (household 1, annual 3500000) and arrearage 100001; DPA n=6 created; down 10000 paid 2026-08-01 (ACTIVE, first due 2026-08-31); clock 2026-08-05"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "23 Remainder Rd" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /assistance/accounts/${acct_id}/charges"
              payload: { charge_type: "ARREARAGE", amount_cents: 100001, effective_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "POST /assistance/applications"
              payload: { account_id: "${acct_id}", household_size: 1, gross_annual_income_cents: 3500000, current_month_income_cents: 300000, expected_account_version: "${acct_v} + 1" }
              as: CustomerServiceRep
              as_user_id: csr_1
              captures: { app_id: "$.data.id" }
            - call: "POST /assistance/applications/${app_id}/begin-review"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
            - call: "POST /assistance/applications/${app_id}/verify"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
            - call: "GET /assistance/enrollments"
              payload: {}
              as: EligibilitySpecialist
              captures: { enr_id: "$.data[0].id" }
            - call: "POST /assistance/enrollments/${enr_id}/activate"
              payload: {}
              as: CustomerServiceRep
              as_user_id: csr_1
            - call: "GET /assistance/accounts/${acct_id}"
              payload: {}
              as: CustomerServiceRep
              captures: { acct_v2: "$.data.version" }
            - call: "POST /assistance/dpas"
              payload: { account_id: "${acct_id}", installment_count: 6, expected_account_version: "${acct_v2}" }
              as: CustomerServiceRep
              captures: { dpa_id: "$.data.id", down: "$.data.down_payment_required_cents", pool: "$.data.forgiveness_pool_cents", inst: "$.data.installment_amount_cents", fin: "$.data.final_installment_amount_cents" }
            - call: "POST /assistance/payments"
              payload: { account_id: "${acct_id}", amount_cents: 10000, tender_type: "CASH" }
              as: CustomerServiceRep
            - call: "POST /assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /assistance/payments"
              payload: { account_id: "${acct_id}", amount_cents: 65001, tender_type: "CHECK" }
              as: CustomerServiceRep
              captures: { settled: "$.data.installments_settled_count", on_time: "$.data.on_time", credited: "$.data.credit_accrued_cents" }
            - call: "GET /assistance/dpas/${dpa_id}/forgiveness-credits"
              payload: {}
              as: CustomerServiceRep
              captures: { c5: "$.data[4].amount_cents", c6: "$.data[5].amount_cents" }
            - call: "GET /assistance/dpas/${dpa_id}"
              payload: {}
              as: CustomerServiceRep
              captures: { st: "$.data.status", forgiven: "$.data.forgiven_posted_cents", rem: "$.data.remaining_balance_cents" }
          assert:
            - "terms: down_payment_required_cents == 10000 (max(round_half_up(10000.1), 5000)), forgiveness_pool_cents == 25000, installment_amount_cents == 10834, final_installment_amount_cents == 10831 (65001 - 5*10834)"
            - "single 65001 payment settles all 6 installments on time: installments_settled_count == 6, on_time == true, credit_accrued_cents == 25000"
            - "credits 1..5 == 4167 (round_half_up(25000/6)); credit 6 == 4165 (pool remainder 25000 - 5*4167)"
            - "DPA forgiven_posted_cents == 25000, remaining_balance_cents == 0, status == COMPLETED"

      - name: fund_report_aggregation_with_disburse_remainder
        claim_type: computed_read
        grounds: [calculations.funding_report_aggregation, state_machines.FundAllocation.PLEDGED_to_DISBURSED]
        distinguishing_aspect: "Report aggregates per-status sums exactly; disburse applies min(amount, arrearage) to arrearage and routes the remainder to credit_balance_cents."
        test_recipe:
          setup: ["account with ACTIVE TIER_2 enrollment and arrearage 25000; fund FY2026 appropriated 100000; allocations 30000 (batch 1) and 20000 (batch 2) PLEDGED"]
          setup_api_calls:
