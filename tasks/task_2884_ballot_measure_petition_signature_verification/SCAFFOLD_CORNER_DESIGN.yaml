              payload: {}
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { p_raw: $.data.raw_signature_count, p_acc: $.data.accepted_raw_total, p_status: $.data.status }
          assert:
            - "${b1_status} == AFFIDAVIT_VERIFIED, ${b1_raw} == 2, ${b1_acc} == 1, ${b1_def} == 1"
            - "${b2_status} == REJECTED_FORMAT, ${b2_raw} == 1, ${b2_acc} == 0, ${b2_def} == 1 - striking every line rejects the whole batch"
            - "${l2_status} == INVALID_FORMAT_DEFECT and SignatureRecord.${b2_l1_id}.validation_status == INVALID_FORMAT_DEFECT - struck lines are marked, not deleted"
            - "${p_raw} == 3 - raw counts every non-INVALIDATED batch, REJECTED_FORMAT included"
            - "${p_acc} == 1 - accepted counts only AFFIDAVIT_VERIFIED / SAMPLED / FULLY_CHECKED batches, and only their accepted lines"
            - "${p_status} == CLEARED - verifying affidavits does not by itself advance the petition"
            - "SignatureBatch.${b1_id}.checked_signature_count == 0 - INVALID_FORMAT_DEFECT lines are excluded from the cost base, so verification_cost_cents is still 0 on both batches"

      # --- corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml -------
      - name: projection_variant_divergence_on_identical_line_data
        claim_type: variant_divergence
        grounds:
          - calculations.sample_projection.variants
          - entities.VerificationStandard.stratification_mode
        excluded_because:
          difficulty_instance: pooled_vs_stratified_projection_divergence_on_petition
          rationale: |
            Two petitions with byte-identical line data under POOLED and STRATIFIED
            standards are projected side by side in §1.8 (4 vs 3), which is exactly the
            variant-divergence claim plus the delta.

      - name: credibility_variant_selection_by_strike_count
        claim_type: variant_selection
        grounds:
          - calculations.circulator_credibility_score.variants
          - entities.Circulator.misconduct_strike_count
        excluded_because:
          difficulty_instance: provisional_vs_adjudicated_circulator_credibility
          rationale: |
            §1.8 scores the same line data before and after a substantiated referral
            (7500 provisional, 3000 adjudicated), covering variant selection, the weight
            change and the reconciliation of the score in one walk.

      - name: invoice_tier_boundaries_and_rounding
        claim_type: tiered_pricing_boundary
        grounds:
          - calculations.county_reimbursement_invoice
          - endpoints[GET /petitions/{petition_id}/verification-invoice]
        excluded_because:
          difficulty_instance: invoice_tier_keyed_on_gross_before_discount
          rationale: |
            §1.8 straddles the TIER_A floor at 19 and 20 gross cents, so both sides of the
            boundary, the floor-vs-ceil split between discount and surcharge, and the
            "tier keyed on gross, not on subtotal" trap are already asserted.

      - name: per_batch_cost_rounding_precision
        claim_type: precision
        grounds:
          - calculations.batch_verification_cost
          - entities.SignatureBatch.verification_cost_cents
        excluded_because:
          difficulty_instance: per_batch_rounding_before_summation_on_cost_ledger
          rationale: |
            The round_half_up-per-batch-then-sum order (5 + 5 vs 10 for the pooled
            equivalent) is the whole point of the §1.8 instance, including the millicent
            rate and the delta accrual.

      - name: sample_size_clamp_interaction
        claim_type: constants_applied
        grounds:
          - calculations.sample_selection
          - entities.VerificationStandard.sample_min_count
        excluded_because:
          difficulty_instance: sample_size_min_max_clamp_interaction
          rationale: |
            §1.8 drives min(N, max(sample_min_count, ceil(N * pct / 10000))) through all
            three of its regimes - percentage-bound, min-bound and N-bound - and asserts
            the systematic interval k for each.

      - name: sufficiency_band_gate_boundaries
        claim_type: threshold_boundary
        grounds:
          - calculations.sufficiency_band_determination
          - entities.VerificationRound.determination
        excluded_because:
          difficulty_instance: sufficiency_lower_gate_inclusive_boundary
          rationale: |
            The inclusive lower gate (projected == lower_gate -> INSUFFICIENT,
            projected == lower_gate + 1 -> FULL_CHECK_REQUIRED) is asserted at the exact
            boundary in §1.8; the upper gate is asserted by the SUFFICIENT paths of several
            other instances.

      - name: assignment_buffer_constant_applied
        claim_type: constants_applied
        grounds:
          - calculations.required_valid_signature_threshold.constants.ASSIGNMENT_BUFFER_DAYS
          - errors[ERR_ASSIGNMENT_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: assignment_closed_interval_buffer_on_circulator
          rationale: |
            §1.8 places a second assignment exactly ASSIGNMENT_BUFFER_DAYS after the first
            one's effective_to and one day earlier, so the constant's exact value is pinned
            from both sides.

      - name: cure_target_assumed_rate_floor
        claim_type: constants_applied
        grounds:
          - calculations.cure_target_computation
          - entities.CurePeriod.assumed_validity_rate_bps
        excluded_because:
          difficulty_instance: cure_period_half_open_adjacency_allowed_on_petition
          rationale: |
            The §1.8 cure instance opens two cure periods and asserts shortfall_at_open,
            assumed_validity_rate_bps clamped at MIN_ASSUMED_VALIDITY_BPS and
            cure_target_raw_signatures for each, alongside the half-open adjacency rule.

  # =========================================================================
  # Table 4 - Validations (15 ordered priorities)
