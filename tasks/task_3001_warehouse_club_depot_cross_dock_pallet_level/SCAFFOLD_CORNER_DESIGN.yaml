            - "err_runs == ERR_FORBIDDEN (403) — run creation is DepotPlanner-exclusive"

      - name: missing_auth_headers_rejected
        claim_type: rbac_denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role is rejected with ERR_UNAUTHENTICATED (401) before any other validation."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /wcd/regions"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED (401)"

  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: derived_fields_reconcile_on_mutation
        claim_type: derived_field_reconciliation
        grounds: ["calculations.complaint_weighted_score_calc", entities.Item.fields.complaint_weighted_score]
        distinguishing_aspect: "item.complaint_weighted_score recomputes on complaint create AND on complaint resolve: create raises it, resolve lowers it back."
        test_recipe:
          setup: ["Region, vendor, club, ACTIVE item; member household 2"]
          setup_api_calls:
            - call: "POST /wcd/regions"
              payload: { name: "RAJ", code: "RAJ", avg_member_income_cents: 100 }
              as: RegionalOps
              captures: { region_id: $.data.id }
            - call: "POST /wcd/vendors"
              payload: { name: "Vend AJ", vendor_code: "V490049" }
              as: RegionalOps
              captures: { vendor_id: $.data.id }
            - call: "POST /wcd/clubs"
              payload: { region_id: "${region_id}", name: "C AJ", club_number: 4901, floor_slot_capacity: 40, member_base: 10 }
              as: RegionalOps
              captures: { club_id: $.data.id }
            - call: "POST /wcd/items"
              payload: { vendor_id: "${vendor_id}", sku: "4900049", description: "F", case_pack_qty: 24, pallet_length_in: 40, pallet_width_in: 40, cases_per_layer: 5, max_layers: 4, item_type: "REGULAR" }
              as: CategoryManager
              captures: { item_id: $.data.id }
            - call: "POST /wcd/items/${item_id}/activate"
              payload: {}
              as: CategoryManager
            - call: "POST /wcd/members"
              payload: { club_id: "${club_id}", membership_number: "M000001401", tier: "GOLD_STAR", household_size: 2 }
              as: MembershipDesk
              captures: { member_id: $.data.id }
          trigger:
            - call: "POST /wcd/complaints"
              payload: { member_id: "${member_id}", item_id: "${item_id}", category: "SAFETY" }
              as: MembershipDesk
              captures: { complaint_id: $.data.id, weight: $.data.weight }
            - call: "GET /wcd/items/${item_id}"
              payload: {}
              as: CategoryManager
              captures: { score_open: $.data.complaint_weighted_score }
            - call: "POST /wcd/complaints/${complaint_id}/resolve"
              payload: {}
              as: MembershipDesk
            - call: "GET /wcd/items/${item_id}"
              payload: {}
              as: CategoryManager
              captures: { score_resolved: $.data.complaint_weighted_score }
          assert:
            - "weight == 8.0 (SAFETY 4.0 * household 2, frozen at creation)"
            - "score_open == 8.0"
            - "score_resolved == 0.0 (resolved complaints excluded on recompute)"

      - name: version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[allocation-create-stale-run]", "entities.CrossDockRun"]
        distinguishing_aspect: "CrossDockRun.version starts at 1 and increments on every allocation create and on commit."
        test_recipe:
          setup: ["Clock 2026-09-02T09:05:00Z; run created (version 1); one allocation added"]
          setup_api_calls:
            - call: "POST /wcd/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegionalOps
            - call: "POST /wcd/regions"
              payload: { name: "RAK", code: "RAK", avg_member_income_cents: 100 }
              as: RegionalOps
              captures: { region_id: $.data.id }
            - call: "POST /wcd/vendors"
              payload: { name: "Vend AK", vendor_code: "V500050" }
              as: RegionalOps
              captures: { vendor_id: $.data.id }
            - call: "POST /wcd/clubs"
              payload: { region_id: "${region_id}", name: "C AK", club_number: 5001, floor_slot_capacity: 40, member_base: 10 }
              as: RegionalOps
              captures: { club_id: $.data.id }
            - call: "POST /wcd/depots"
              payload: { region_id: "${region_id}", name: "D AK", dock_count: 1, dock_hours_open: "09:00", dock_hours_close: "17:00", slot_length_minutes: 30 }
              as: DepotManager
              captures: { depot_id: $.data.id }
            - call: "POST /wcd/items"
              payload: { vendor_id: "${vendor_id}", sku: "5000050", description: "E", case_pack_qty: 24, pallet_length_in: 40, pallet_width_in: 40, cases_per_layer: 5, max_layers: 4, item_type: "REGULAR" }
              as: CategoryManager
              captures: { item_id: $.data.id }
            - call: "POST /wcd/items/${item_id}/activate"
              payload: {}
              as: CategoryManager
            - call: "POST /wcd/appointments"
              payload: { depot_id: "${depot_id}", vendor_id: "${vendor_id}", delivery_date: "2026-09-02", start_time: "09:00", end_time: "09:30", pallet_count: 1 }
              as: VendorRep
              as_user_id: "${vendor_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /wcd/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T09:05:00Z" }
              as: RegionalOps
            - call: "POST /wcd/appointments/${appt_id}/check-in"
              payload: {}
              as: DepotManager
            - call: "POST /wcd/pallets"
              payload: { appointment_id: "${appt_id}", item_id: "${item_id}", unit_qty: 480 }
              as: DepotManager
              captures: { pallet_id: $.data.id }
            - call: "POST /wcd/cross-dock-runs"
              payload: { depot_id: "${depot_id}", run_date: "2026-09-02", cutoff_time: "16:00" }
              as: DepotPlanner
              captures: { run_id: $.data.id, v1: $.data.version }
            - call: "POST /wcd/cross-dock-runs/${run_id}/allocations"
              payload: { pallet_id: "${pallet_id}", club_id: "${club_id}", expected_cross_dock_run_version: "${v1}" }
              as: DepotPlanner
              captures: { v2: $.data.run_version }
          trigger:
            - call: "POST /wcd/cross-dock-runs/${run_id}/commit"
              payload: {}
              as: DepotPlanner
              captures: { v3: $.data.version }
          assert:
            - "v1 == 1"
            - "v2 == 2 (allocation create incremented run version)"
            - "v3 == 3 (commit incremented run version)"

  # ===========================================================================
