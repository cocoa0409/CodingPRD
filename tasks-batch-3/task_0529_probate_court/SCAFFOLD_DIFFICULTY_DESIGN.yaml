              as: Clerk
              captures: { v2: $.data.version }
            - call: "POST /representatives/${rep_id}/appoint"
              payload: { expected_estate_version: "${v2}" }
              as: ProbateJudge
              as_user_id: "judge-1"
            - call: "POST /beneficiaries"
              payload: { estate_id: "${est_id}", full_name: "Heir", relationship: "CHILD", share_bps: 10000 }
              as: Clerk
              captures: { ben_id: $.data.id }
            - call: "POST /assets"
              payload: { estate_id: "${est_id}", description: "Cash", asset_class: "CASH", declared_value_cents: 1000000 }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
              captures: { asset_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v3: $.data.version }
            - call: "POST /assets/${asset_id}/appraise"
              payload: { appraised_value_cents: 1000000, expected_estate_version: "${v3}" }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
            - call: "POST /accountings"
              payload: { estate_id: "${est_id}", report_type: "INVENTORY" }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
              captures: { acct_inv_id: $.data.id }
