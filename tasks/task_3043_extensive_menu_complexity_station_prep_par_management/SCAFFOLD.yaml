# =============================================================================
# SCAFFOLD.yaml — §1.0–§1.7
# Task: task_3043_extensive_menu_complexity_station_prep_par_management
# Domain: extensive-menu kitchen operations — station prep pars, forecast-driven
# prep lists, shelf-life batch sizing, allergen/modification handling, central
# bakery supply with slice-yield tracking, menu revision cycles, waste and
# throughput management.
# =============================================================================

scenario: |
  Extensive Menu Complexity & Station Prep Par Management (The Cheesecake Factory): very large menu with hundreds of made-from-scratch items requiring station-level prep pars, prep list generation from forecast with shelf-life-driven batch sizing, station mise en place layout and cook assignment by ticket mix, allergen and modification handling across a wide item set, cheesecake and bakery supply from central production with slice yield tracking, menu update cycles requiring retraining and recipe card redistribution, waste and over-prep measurement by station, kitchen throughput management during long wait-list peaks

domain_name: menu-prep-par-management
api_prefix: /api

complexity_profile:
  primary_archetype: quota_allocation        # station rack capacity + prep pars as contested finite pools
  secondary_archetype: workflow_orchestration # menu revision cycles, forecast->prep-list pipelines
  complexity_layers:
    - optimistic_concurrency                  # OCC on PrepList.version and StationPar.version
    - cascading_side_effects                  # menu publish -> retire -> suspend -> cancel chains
    - dual_variant_calculation                # OPTIMISTIC vs CONSERVATIVE prep sizing; provisional vs final slice yield
    - rate_threshold_triggers                 # over-prep penalty tiers, par_health thresholds, peak wait threshold
  entity_topology: flat                       # peer entities joined by FK references, all collections under /api
  state_machine_shape: compound               # mix of cyclic (MenuRevision, ServiceTicket, StationPar), branching (BakeryOrder), and auto-advancing (PrepList) machines
  relationship_patterns:
    - one_to_many
    - many_to_many                            # Recipe <-> PrepItem via Recipe.components array; Station <-> PrepItem via StationPar
    - cross_aggregate                         # ServiceTicket -> Recipe -> MenuRevision; PrepList -> DemandForecast
  role_model: segregation_of_duties           # par adjustment requester != approver; order confirm split from submit
  consistency_model: immediate                # all cascades and derived fields settle inside the request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (14 entities)
# =============================================================================
entities:
  - name: Restaurant
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Restaurant display name" }
      - { name: code, type: string, source: input, description: "Unique short code for the restaurant", constraints: "unique across all restaurants" }
      - { name: weekly_bakery_budget_cents, type: integer, source: input, description: "Weekly central-bakery spend cap in cents" }
      - { name: weekly_bakery_budget_spent_cents, type: integer, source: system, description: "Cents currently reserved by CONFIRMED BakeryOrders; debited on confirm, released on cancel of a CONFIRMED order", default: 0 }
      - { name: current_waitlist_minutes, type: integer, source: system, description: "Current front-of-house wait-list length in minutes; set via update-waitlist; drives peak multiplier", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE }

  - name: MenuRevision
    parent: null
    common_fields: true
    fields:
      - { name: restaurant_id, type: string, source: input, description: "FK -> Restaurant.id; owning restaurant" }
      - { name: label, type: string, source: input, description: "Human label, e.g. '2026-Fall'" }
      - { name: effective_from, type: datetime, source: input, description: "Date the revision is planned to take effect (informational)" }
      - { name: review_cycle_count, type: integer, source: system, description: "Increments by 1 on every IN_REVIEW -> DRAFT request-changes loop", default: 0 }
      - { name: retraining_required_count, type: integer, source: computed, description: "Count of the restaurant's Cooks whose certification_menu_revision_id != this revision id; recomputed on publish", default: 0 }
      - { name: recipe_card_redistribution_status, type: enum, source: computed, description: "NOT_STARTED at creation; COMPLETE when the revision is published (cards redistributed to stations)", default: NOT_STARTED, constraints: "NOT_STARTED | COMPLETE" }
      - { name: status, type: enum, source: system, description: "DRAFT | IN_REVIEW | APPROVED | PUBLISHED | SUPERSEDED", default: DRAFT }

  - name: Recipe
    parent: null
    common_fields: true
    fields:
      - { name: menu_revision_id, type: string, source: input, description: "FK -> MenuRevision.id; revision this recipe belongs to" }
      - { name: name, type: string, source: input, description: "Dish name" }
      - { name: station_type, type: enum, source: input, description: "Producing station type", constraints: "GRILL | SAUTE | FRY | BAKERY | COLD" }
      - { name: allergen_tags, type: array, source: input, description: "Allergen tags present in the standard build (e.g. [\"DAIRY\",\"GLUTEN\"])", default: [] }
      - { name: modification_policy, type: enum, source: input, description: "ALLOWED | LIMITED | FORBIDDEN — whether ticket modifications are accepted", default: ALLOWED }
      - { name: components, type: array, source: input, description: "Array of {prep_item_id, quantity_per_portion, unit}; each prep_item_id MUST reference an existing ACTIVE PrepItem (validated at recipe creation); drives forecast prep quantities", default: [] }
      - { name: status, type: enum, source: system, description: "DRAFT while owning revision unpublished; ACTIVE when owning revision PUBLISHED; SUPERSEDED when owning revision is superseded", default: DRAFT }

  - name: PrepItem
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Prep component name (e.g. 'Diced Onions')" }
      - { name: station_type, type: enum, source: input, description: "Station type that preps this item", constraints: "GRILL | SAUTE | FRY | BAKERY | COLD" }
      - { name: shelf_life_hours, type: integer, source: input, description: "Hours a prepped batch remains usable after produced_at; must be > 0" }
      - { name: min_batch_size, type: integer, source: input, description: "Smallest producible batch in batch_unit; batch sizing rounds to multiples of this; must be > 0" }
      - { name: batch_unit, type: enum, source: input, description: "OZ | EA | ML" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED; retired manually or by menu publish cascade when unreferenced", default: ACTIVE }

  - name: Station
    parent: null
    common_fields: true
    fields:
      - { name: restaurant_id, type: string, source: input, description: "FK -> Restaurant.id" }
      - { name: name, type: string, source: input, description: "Station name (e.g. 'Grill 1')" }
      - { name: station_type, type: enum, source: input, description: "GRILL | SAUTE | FRY | BAKERY | COLD" }
      - { name: rack_slot_capacity, type: integer, source: input, description: "Maximum aggregate prep quantity (summed across live batches) the station can hold; must be > 0" }
      - { name: mise_en_place_layout, type: array, source: input, description: "Ordered array of prep_item_id values describing slot layout; each element must reference an existing PrepItem", default: [] }
      - { name: par_health, type: enum, source: computed, description: "OK | BELOW_PAR | CRITICAL; derived per station_par_health calculation; recomputed on every batch mutation at this station", default: OK }
      - { name: active, type: boolean, source: system, description: "Soft-delete flag; stations are deactivated, never destroyed", default: true }

  - name: StationPar
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id" }
      - { name: prep_item_id, type: string, source: input, description: "FK -> PrepItem.id" }
      - { name: par_quantity, type: integer, source: input, description: "Effective par level (target on-hand) in the prep item's batch_unit; must be >= 0" }
      - { name: proposed_par_quantity, type: integer, source: system, description: "Pending proposed par level; set by propose-adjustment, cleared on approve/reject", default: null }
      - { name: requested_by_cook_id, type: string, source: system, description: "FK -> Cook.id; taken from the proposer's X-User-ID header, never from the request body", default: null }
      - { name: approved_by_cook_id, type: string, source: system, description: "Cook id of the KitchenManager who approved; null unless last adjustment was approved", default: null }
      - { name: adjustment_status, type: enum, source: system, description: "NONE | PENDING | APPROVED | REJECTED", default: NONE }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; SUSPENDED when the referenced PrepItem is RETIRED", default: ACTIVE }

  - name: Cook
    parent: null
    common_fields: true
    fields:
      - { name: restaurant_id, type: string, source: input, description: "FK -> Restaurant.id" }
      - { name: name, type: string, source: input, description: "Cook full name" }
      - { name: certified_station_types, type: array, source: input, description: "Array of station_type enum values the cook is certified for" }
      - { name: certification_menu_revision_id, type: string, source: system, description: "MenuRevision.id of the last completed retraining; set by complete-retraining; compared at publish to flag retraining", default: null }
      - { name: weekly_scheduled_minutes, type: integer, source: system, description: "Sum of CONFIRMED ShiftAssignment minutes; debited on confirm, credited on cancel / mark-no-show", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETRAINING_REQUIRED | INACTIVE", default: ACTIVE }

  - name: DemandForecast
    parent: null
    common_fields: true
    fields:
      - { name: restaurant_id, type: string, source: input, description: "FK -> Restaurant.id" }
      - { name: service_date, type: datetime, source: input, description: "Service date being forecast; must be strictly after the logical clock at submit time" }
      - { name: expected_covers, type: integer, source: input, description: "Total expected covers; must be > 0" }
      - { name: item_mix, type: array, source: input, description: "Array of {recipe_id, expected_count}; recipe ids must exist; expected_count must be >= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | FINALIZED", default: DRAFT }

  - name: PrepList
    parent: null
    common_fields: true
    fields:
      - { name: restaurant_id, type: string, source: input, description: "FK -> Restaurant.id" }
      - { name: demand_forecast_id, type: string, source: input, description: "FK -> DemandForecast.id" }
      - { name: generation_variant, type: enum, source: system, description: "OPTIMISTIC | CONSERVATIVE; recorded from the last generate/regenerate call; null until first generation", default: null }
      - { name: lines, type: array, source: computed, description: "Array of {prep_item_id, station_type, raw_quantity, buffered_quantity, batch_count, rounded_quantity, capped_by_shelf_life}; computed by forecast_prep_quantity per generate/regenerate; empty until generated", default: [] }
      - { name: total_rounded_quantity, type: integer, source: computed, description: "Sum of lines[].rounded_quantity (per-line round THEN sum — pinned order)", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | GENERATED | LOCKED | IN_PROGRESS | COMPLETED | SUPERSEDED", default: DRAFT }

  - name: PrepBatch
    parent: null
    common_fields: true
    fields:
      - { name: prep_list_id, type: string, source: input, description: "FK -> PrepList.id" }
      - { name: prep_item_id, type: string, source: input, description: "FK -> PrepItem.id" }
      - { name: station_id, type: string, source: input, description: "FK -> Station.id" }
      - { name: quantity, type: integer, source: input, description: "Planned batch quantity in batch_unit; must be > 0 and a multiple of the item's min_batch_size" }
      - { name: consumed_quantity, type: integer, source: system, description: "Quantity consumed via record-consumption or ticket mark-ready draw-down", default: 0 }
      - { name: wasted_quantity, type: integer, source: system, description: "Quantity written off via WasteEntry rows (any reason)", default: 0 }
      - { name: produced_at, type: datetime, source: system, description: "Logical-clock timestamp when mark-prepped fired; null while PLANNED", default: null }
      - { name: expires_at, type: datetime, source: computed, description: "produced_at + PrepItem.shelf_life_hours; null while PLANNED", default: null }
      - { name: status, type: enum, source: system, description: "PLANNED | PREPPED | DEPLETED | EXPIRED | WASTED | CANCELLED", default: PLANNED }

  - name: ShiftAssignment
    parent: null
    common_fields: true
    fields:
      - { name: cook_id, type: string, source: input, description: "FK -> Cook.id" }
      - { name: station_id, type: string, source: input, description: "FK -> Station.id" }
      - { name: shift_start, type: datetime, source: input, description: "Shift start (half-open interval start)" }
      - { name: shift_end, type: datetime, source: input, description: "Shift end (half-open interval end); must be strictly after shift_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CONFIRMED | COMPLETED | CANCELLED | NO_SHOW", default: SCHEDULED }

  - name: BakeryOrder
    parent: null
    common_fields: true
    fields:
      - { name: restaurant_id, type: string, source: input, description: "FK -> Restaurant.id" }
      - { name: cheesecake_type, type: enum, source: input, description: "ORIGINAL | CHOCOLATE | STRAWBERRY | SEASONAL" }
      - { name: whole_cakes_ordered, type: integer, source: input, description: "Whole cakes ordered from central production; must be > 0" }
      - { name: whole_cakes_received, type: integer, source: system, description: "Whole cakes received at delivery; set by receive; null until received", default: null }
      - { name: provisional_slices, type: integer, source: computed, description: "whole_cakes_received x SLICES_PER_CAKE (14); the provisional yield variant; null until received", default: null }
      - { name: final_slice_count, type: integer, source: system, description: "Actual slices yielded at reconciliation (the final yield variant); null until reconcile-yield", default: null }
      - { name: yield_variance, type: integer, source: computed, description: "final_slice_count - provisional_slices; null until reconciled", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | CONFIRMED | PARTIALLY_RECEIVED | RECEIVED | RECONCILED | CANCELLED", default: DRAFT }

  - name: WasteEntry
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id" }
      - { name: prep_batch_id, type: string, source: input, description: "FK -> PrepBatch.id" }
      - { name: quantity, type: integer, source: input, description: "Wasted quantity in batch_unit; must be > 0 and <= batch remaining (quantity - consumed - wasted)" }
      - { name: reason, type: enum, source: input, description: "OVER_PREP | EXPIRED | QUALITY | SPILLAGE; only OVER_PREP and EXPIRED count toward the over-prep penalty ratio" }
      - { name: recorded_by_cook_id, type: string, source: system, description: "FK -> Cook.id; taken from the recorder's X-User-ID header, never from the request body" }
      - { name: status, type: enum, source: system, description: "RECORDED | ATTRIBUTED; flips to ATTRIBUTED when the parent batch reaches a terminal state", default: RECORDED }

  - name: ServiceTicket
    parent: null
    common_fields: true
    fields:
      - { name: restaurant_id, type: string, source: input, description: "FK -> Restaurant.id" }
      - { name: table_ref, type: string, source: input, description: "Table/seat reference label" }
      - { name: items, type: array, source: input, description: "Array of {recipe_id, modifications[], allergen_flags[]}; recipes must belong to the restaurant's latest PUBLISHED MenuRevision" }
      - { name: allergen_review_status, type: enum, source: system, description: "NOT_REQUIRED | PENDING | CLEARED; independent state dimension from fire_status", default: NOT_REQUIRED }
      - { name: fire_status, type: enum, source: system, description: "OPEN | FIRED | READY | SERVED | VOIDED", default: OPEN }
      - { name: recall_count, type: integer, source: system, description: "Increments on every READY -> FIRED recall loop", default: 0 }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: MenuRevision
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /api/menu-revisions/{id}/submit-review"
        actor: MenuAdmin
        preconditions:
          - "Revision must be DRAFT (ERR_REVISION_NOT_DRAFT)"
        side_effects: []
      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /api/menu-revisions/{id}/request-changes"
        actor: MenuAdmin
        preconditions:
          - "Revision must be IN_REVIEW (ERR_REVISION_NOT_IN_REVIEW)"
        side_effects:
          - "review_cycle_count += 1"
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /api/menu-revisions/{id}/approve"
        actor: MenuAdmin
        preconditions:
          - "Revision must be IN_REVIEW (ERR_REVISION_NOT_IN_REVIEW)"
        side_effects: []
      - from: APPROVED
        to: PUBLISHED
        trigger: "POST /api/menu-revisions/{id}/publish"
        actor: MenuAdmin
        preconditions:
          - "Revision must be APPROVED (ERR_REVISION_NOT_APPROVED)"
        side_effects:
          - "Prior PUBLISHED MenuRevision of the same restaurant -> SUPERSEDED; its ACTIVE Recipes -> SUPERSEDED"
          - "This revision's DRAFT Recipes -> ACTIVE"
          - "Every PrepItem not referenced by any ACTIVE Recipe of this restaurant (via Recipe.components[].prep_item_id) -> RETIRED"
          - "Every StationPar with status ACTIVE whose prep_item_id was just retired -> SUSPENDED (link caused by the retirement, not by the publish directly)"
          - "Every PLANNED PrepBatch whose prep_item_id belongs to a just-suspended par -> CANCELLED, releasing its rack load (link caused by the suspension)"
          - "Every Cook of this restaurant whose certification_menu_revision_id != this revision id -> RETRAINING_REQUIRED"
          - "retraining_required_count recomputed; recipe_card_redistribution_status -> COMPLETE"

  - entity: Recipe
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "system (owning MenuRevision published)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (owning MenuRevision superseded by a newer publish)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PrepItem
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /api/prep-items/{id}/retire OR system (menu publish cascade)"
        actor: MenuAdmin
        preconditions:
          - "Item must be ACTIVE (ERR_INVALID_TRANSITION)"
        side_effects:
          - "StationPars (status ACTIVE) referencing this item -> SUSPENDED"
          - "PLANNED PrepBatches of this item at stations whose par was just suspended -> CANCELLED (rack load released)"

  - entity: DemandForecast
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/demand-forecasts/{id}/submit"
        actor: KitchenManager
        preconditions:
          - "Forecast must be DRAFT (ERR_FORECAST_NOT_DRAFT)"
          - "service_date must be strictly after the logical clock now (ERR_FORECAST_DATE_PAST)"
        side_effects: []
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /api/demand-forecasts/{id}/amend"
        actor: KitchenManager
        preconditions:
          - "Forecast must be SUBMITTED (ERR_FORECAST_NOT_SUBMITTED)"
        side_effects: []
      - from: SUBMITTED
        to: FINALIZED
        trigger: "POST /api/demand-forecasts/{id}/finalize"
        actor: KitchenManager
        preconditions:
          - "Forecast must be SUBMITTED (ERR_FORECAST_NOT_SUBMITTED)"
        side_effects: []

  - entity: PrepList
    initial_state: DRAFT
    terminal_states: [COMPLETED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: GENERATED
        trigger: "POST /api/prep-lists/{id}/generate"
        actor: KitchenManager
        preconditions:
          - "List must be DRAFT (ERR_PREP_LIST_NOT_DRAFT)"
          - "DemandForecast referenced by demand_forecast_id must be FINALIZED (ERR_FORECAST_NOT_FINALIZED) — cross-entity state dependency"
        side_effects:
          - "forecast_prep_quantity runs with the requested variant; lines and total_rounded_quantity computed"
          - "generation_variant recorded"
      - from: GENERATED
        to: GENERATED
        trigger: "POST /api/prep-lists/{id}/regenerate"
        actor: KitchenManager
        preconditions:
          - "List must be GENERATED or LOCKED (ERR_PREP_LIST_NOT_REGENERABLE)"
          - "OCC: expected_prep_list_version must equal current version (ERR_STALE_VERSION)"
        side_effects:
          - "All child PLANNED PrepBatches -> CANCELLED (rack load released)"
          - "forecast_prep_quantity re-runs with the new variant; lines, total_rounded_quantity, generation_variant replaced"
          - "increments PrepList.version by 1"
      - from: LOCKED
        to: GENERATED
        trigger: "POST /api/prep-lists/{id}/regenerate"
        actor: KitchenManager
        preconditions:
          - "Same as GENERATED -> GENERATED regenerate"
        side_effects:
          - "Same as GENERATED -> GENERATED regenerate"
      - from: GENERATED
        to: LOCKED
        trigger: "POST /api/prep-lists/{id}/lock"
        actor: KitchenManager
        preconditions:
          - "List must be GENERATED (ERR_PREP_LIST_NOT_GENERATED)"
        side_effects: []
      - from: LOCKED
        to: IN_PROGRESS
        trigger: "system (first child PrepBatch reaches PREPPED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system (all child PrepBatches reach terminal states: DEPLETED, EXPIRED, WASTED, or CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PrepBatch
    initial_state: PLANNED
    terminal_states: [DEPLETED, EXPIRED, WASTED, CANCELLED]
    transitions:
      - from: PLANNED
        to: PREPPED
        trigger: "POST /api/prep-batches/{id}/mark-prepped"
        actor: PrepCook
        preconditions:
          - "Batch must be PLANNED (ERR_BATCH_NOT_PLANNED)"
        side_effects:
          - "produced_at = logical clock now; expires_at = produced_at + shelf_life_hours"
          - "If this is the parent PrepList's first PREPPED batch: PrepList LOCKED -> IN_PROGRESS"
      - from: PREPPED
        to: DEPLETED
        trigger: "system (record-consumption or ticket draw-down brings consumed_quantity + wasted_quantity == quantity)"
        actor: system
        preconditions: []
        side_effects:
          - "Station on_hand and par_health recomputed (cascade link 1 -> 2)"
          - "If all sibling batches of the parent PrepList are terminal: PrepList IN_PROGRESS -> COMPLETED"
          - "WasteEntries on this batch: RECORDED -> ATTRIBUTED"
      - from: PREPPED
        to: WASTED
        trigger: "system (WasteEntry creation brings consumed_quantity + wasted_quantity == quantity)"
        actor: system
        preconditions: []
        side_effects:
          - "Same terminal side effects as DEPLETED"
      - from: PLANNED
        to: EXPIRED
        trigger: "POST /api/prep-batches/{id}/expire"
        actor: KitchenManager
        preconditions:
          - "Batch must be PLANNED or PREPPED (ERR_INVALID_TRANSITION)"
          - "Logical clock now must be >= expires_at; for PLANNED batches (expires_at null) expiry is never due (ERR_BATCH_NOT_PREPPED)"
        side_effects:
          - "Auto-create WasteEntry {reason: EXPIRED, quantity: remaining} on this batch (RECORDED -> ATTRIBUTED immediately)"
          - "Station on_hand and par_health recomputed — depth-2 cascade: expiry reduces on_hand, which flips Station.par_health per station_par_health"
          - "If all sibling batches of the parent PrepList are terminal: PrepList IN_PROGRESS -> COMPLETED"
      - from: PREPPED
        to: EXPIRED
        trigger: "POST /api/prep-batches/{id}/expire OR system (record-consumption attempted at clock >= expires_at)"
        actor: KitchenManager
        preconditions:
          - "Logical clock now >= expires_at (equality counts as expired)"
        side_effects:
          - "Same as PLANNED -> EXPIRED side effects"
      - from: PLANNED
        to: CANCELLED
        trigger: "system (prep list regenerate, prep item retirement cascade, or menu publish cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "Rack load released; Station par_health recomputed"

  - entity: StationPar
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: PENDING
        trigger: "POST /api/station-pars/{id}/propose-adjustment (adjustment_status dimension)"
        actor: LineCook
        preconditions:
          - "adjustment_status must be NONE, APPROVED, or REJECTED — never PENDING (ERR_PAR_ADJUSTMENT_NOT_PENDING)"
          - "OCC: expected_station_par_version must equal current version (ERR_STALE_VERSION)"
        side_effects:
          - "proposed_par_quantity set; requested_by_cook_id = proposer X-User-ID; adjustment_status -> PENDING"
          - "increments StationPar.version by 1"
      - from: APPROVED
        to: PENDING
        trigger: "POST /api/station-pars/{id}/propose-adjustment (new adjustment round)"
        actor: PrepCook
        preconditions:
          - "Same as NONE -> PENDING"
        side_effects:
          - "Same as NONE -> PENDING"
      - from: REJECTED
        to: PENDING
        trigger: "POST /api/station-pars/{id}/propose-adjustment (new adjustment round)"
        actor: KitchenManager
        preconditions:
          - "Same as NONE -> PENDING"
        side_effects:
          - "Same as NONE -> PENDING"
      - from: PENDING
        to: APPROVED
        trigger: "POST /api/station-pars/{id}/approve-adjustment"
        actor: KitchenManager
        preconditions:
          - "adjustment_status must be PENDING (ERR_PAR_ADJUSTMENT_NOT_PENDING)"
          - "Segregation of duties: approver X-User-ID must differ from requested_by_cook_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "par_quantity := proposed_par_quantity; proposed_par_quantity := null; approved_by_cook_id := approver X-User-ID"
      - from: PENDING
        to: REJECTED
        trigger: "POST /api/station-pars/{id}/reject-adjustment"
        actor: KitchenManager
        preconditions:
          - "adjustment_status must be PENDING (ERR_PAR_ADJUSTMENT_NOT_PENDING)"
        side_effects:
          - "proposed_par_quantity := null"

  - entity: Cook
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: RETRAINING_REQUIRED
        trigger: "system (a MenuRevision of the cook's restaurant is published with id != cook.certification_menu_revision_id)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RETRAINING_REQUIRED
        to: ACTIVE
        trigger: "POST /api/cooks/{id}/complete-retraining"
        actor: KitchenManager
        preconditions:
          - "Cook must be RETRAINING_REQUIRED (ERR_INVALID_TRANSITION)"
          - "menu_revision_id input must equal the restaurant's latest PUBLISHED revision (ERR_MENU_REVISION_NOT_PUBLISHED)"
        side_effects:
          - "certification_menu_revision_id := menu_revision_id"

  - entity: ShiftAssignment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /api/shift-assignments/{id}/confirm"
        actor: KitchenManager
        preconditions:
          - "Assignment must be SCHEDULED (ERR_ASSIGNMENT_NOT_SCHEDULED)"
          - "Cook must be ACTIVE (ERR_COOK_NOT_ACTIVE) — cross-entity state dependency"
        side_effects:
          - "Cook.weekly_scheduled_minutes += (shift_end - shift_start) in minutes"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /api/shift-assignments/{id}/complete"
        actor: KitchenManager
        preconditions:
          - "Assignment must be CONFIRMED (ERR_ASSIGNMENT_NOT_CONFIRMED)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/shift-assignments/{id}/cancel"
        actor: KitchenManager
        preconditions:
          - "Assignment must be SCHEDULED or CONFIRMED (ERR_INVALID_TRANSITION)"
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/shift-assignments/{id}/cancel"
        actor: KitchenManager
        preconditions:
          - "Assignment must be SCHEDULED or CONFIRMED (ERR_INVALID_TRANSITION)"
        side_effects:
          - "Cook.weekly_scheduled_minutes -= (shift_end - shift_start) in minutes (compensating action)"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /api/shift-assignments/{id}/mark-no-show"
        actor: KitchenManager
        preconditions:
          - "Assignment must be CONFIRMED (ERR_ASSIGNMENT_NOT_CONFIRMED)"
        side_effects:
          - "Cook.weekly_scheduled_minutes -= (shift_end - shift_start) in minutes (compensating action)"

  - entity: BakeryOrder
    initial_state: DRAFT
    terminal_states: [RECONCILED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/bakery-orders/{id}/submit"
        actor: PastryChef
        preconditions:
          - "Order must be DRAFT (ERR_BAKERY_ORDER_INVALID_STATE)"
        side_effects: []
      - from: SUBMITTED
        to: CONFIRMED
        trigger: "POST /api/bakery-orders/{id}/confirm"
        actor: InventoryController
        preconditions:
          - "Order must be SUBMITTED (ERR_BAKERY_ORDER_INVALID_STATE)"
          - "Restaurant.weekly_bakery_budget_spent_cents + whole_cakes_ordered x CAKE_UNIT_COST_CENTS (2500) must be <= weekly_bakery_budget_cents (ERR_BAKERY_BUDGET_EXCEEDED)"
        side_effects:
          - "Restaurant.weekly_bakery_budget_spent_cents += whole_cakes_ordered x 2500"
      - from: CONFIRMED
        to: RECEIVED
        trigger: "POST /api/bakery-orders/{id}/receive with whole_cakes_received == whole_cakes_ordered"
        actor: PastryChef
        preconditions:
          - "Order must be CONFIRMED (ERR_BAKERY_ORDER_INVALID_STATE)"
        side_effects:
          - "whole_cakes_received set; provisional_slices = whole_cakes_received x SLICES_PER_CAKE (14)"
      - from: CONFIRMED
        to: PARTIALLY_RECEIVED
        trigger: "POST /api/bakery-orders/{id}/receive with whole_cakes_received < whole_cakes_ordered"
        actor: PastryChef
        preconditions:
          - "Order must be CONFIRMED (ERR_BAKERY_ORDER_INVALID_STATE)"
          - "whole_cakes_received must be > 0 and <= whole_cakes_ordered (ERR_INVALID_REQUEST)"
        side_effects:
          - "whole_cakes_received set; provisional_slices = whole_cakes_received x SLICES_PER_CAKE (14)"
      - from: RECEIVED
        to: RECONCILED
        trigger: "POST /api/bakery-orders/{id}/reconcile-yield"
        actor: PastryChef
        preconditions:
          - "Order must be RECEIVED or PARTIALLY_RECEIVED (ERR_BAKERY_ORDER_INVALID_STATE)"
        side_effects:
          - "final_slice_count set; yield_variance = final_slice_count - provisional_slices (final variant replaces provisional)"
      - from: PARTIALLY_RECEIVED
        to: RECONCILED
        trigger: "POST /api/bakery-orders/{id}/reconcile-yield"
        actor: PastryChef
        preconditions:
          - "Order must be RECEIVED or PARTIALLY_RECEIVED (ERR_BAKERY_ORDER_INVALID_STATE)"
        side_effects:
          - "final_slice_count set; yield_variance = final_slice_count - provisional_slices"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/bakery-orders/{id}/cancel"
        actor: PastryChef
        preconditions:
          - "Order must be DRAFT, SUBMITTED, or CONFIRMED (ERR_BAKERY_ORDER_INVALID_STATE)"
        side_effects: []
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /api/bakery-orders/{id}/cancel"
        actor: InventoryController
        preconditions:
          - "Order must be DRAFT, SUBMITTED, or CONFIRMED (ERR_BAKERY_ORDER_INVALID_STATE)"
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/bakery-orders/{id}/cancel"
        actor: InventoryController
        preconditions:
          - "Order must be DRAFT, SUBMITTED, or CONFIRMED (ERR_BAKERY_ORDER_INVALID_STATE)"
        side_effects:
          - "Restaurant.weekly_bakery_budget_spent_cents -= whole_cakes_ordered x 2500 (compensating action; spent returns to its pre-confirm value)"

  - entity: WasteEntry
    initial_state: RECORDED
    terminal_states: [ATTRIBUTED]
    transitions:
      - from: RECORDED
        to: ATTRIBUTED
        trigger: "system (parent PrepBatch reaches a terminal state)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ServiceTicket
    initial_state: OPEN
    terminal_states: [SERVED, VOIDED]
    transitions:
      - from: OPEN
        to: FIRED
        trigger: "POST /api/service-tickets/{id}/fire (fire_status dimension)"
        actor: LineCook
        preconditions:
          - "fire_status must be OPEN (ERR_TICKET_INVALID_STATE)"
          - "allergen_review_status must be NOT_REQUIRED or CLEARED (ERR_ALLERGEN_REVIEW_REQUIRED) — business_safety"
        side_effects: []
      - from: FIRED
        to: READY
        trigger: "POST /api/service-tickets/{id}/mark-ready"
        actor: LineCook
        preconditions:
          - "fire_status must be FIRED (ERR_TICKET_INVALID_STATE)"
        side_effects:
          - "Station draw-down: for each ticket item, consume (components quantities) from PREPPED PrepBatches at the station whose station_type matches the recipe, ordered by expires_at ASC with ties broken by created_at ASC; batches hitting consumed+wasted==quantity -> DEPLETED (with their own cascade)"
      - from: READY
        to: FIRED
        trigger: "POST /api/service-tickets/{id}/recall"
        actor: LineCook
        preconditions:
          - "fire_status must be READY (ERR_TICKET_INVALID_STATE)"
        side_effects:
          - "recall_count += 1"
      - from: READY
        to: SERVED
        trigger: "POST /api/service-tickets/{id}/serve"
        actor: LineCook
        preconditions:
          - "fire_status must be READY (ERR_TICKET_INVALID_STATE)"
        side_effects: []
      - from: OPEN
        to: VOIDED
        trigger: "POST /api/service-tickets/{id}/void"
        actor: KitchenManager
        preconditions:
          - "fire_status must be OPEN, FIRED, or READY (ERR_TICKET_INVALID_STATE)"
        side_effects: []
      - from: FIRED
        to: VOIDED
        trigger: "POST /api/service-tickets/{id}/void"
        actor: KitchenManager
        preconditions:
          - "fire_status must be OPEN, FIRED, or READY (ERR_TICKET_INVALID_STATE)"
        side_effects: []
      - from: READY
        to: VOIDED
        trigger: "POST /api/service-tickets/{id}/void"
        actor: KitchenManager
        preconditions:
          - "fire_status must be OPEN, FIRED, or READY (ERR_TICKET_INVALID_STATE)"
        side_effects: []
      - from: OPEN
        to: OPEN
        trigger: "POST /api/service-tickets/{id}/clear-allergen-review (allergen_review_status dimension: PENDING -> CLEARED; fire_status unchanged)"
        actor: KitchenManager
        preconditions:
          - "allergen_review_status must be PENDING (ERR_TICKET_INVALID_STATE)"
        side_effects:
          - "allergen_review_status -> CLEARED"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: prep-list-regenerate-stale-version
    parent_entity: PrepList
    write_endpoint: "POST /api/prep-lists/{id}/regenerate"
    occ_field: expected_prep_list_version
    description: |
      Regenerating a PrepList with an expected_prep_list_version that no longer
      equals the list's current version is rejected. This captures the case where
      the client last observed the list before another legitimate write (e.g. a
      lock, or a prior regenerate that replaced all lines) advanced the version,
      so the client's view of the line set is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: station-par-adjustment-stale-version
    parent_entity: StationPar
    write_endpoint: "POST /api/station-pars/{id}/propose-adjustment"
    occ_field: expected_station_par_version
    description: |
      Proposing a par adjustment with an expected_station_par_version that no
      longer equals the par's current version is rejected. This captures the case
      where the client last observed the par before another legitimate write
      (e.g. an approve that set par_quantity, or a prior proposal) advanced the
      version, so the client's baseline par_quantity is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: forecast_prep_quantity
    trigger: "POST /api/prep-lists/{id}/generate and POST /api/prep-lists/{id}/regenerate"
    algorithm: forward_looking
    formula: |
      For each PrepItem p referenced by any recipe in the forecast's item_mix:
        raw(p) = SUM over item_mix entries e, over components c of recipe(e.recipe_id)
                 where c.prep_item_id == p.id:  e.expected_count * c.quantity_per_portion
      Drop items with raw == 0.
      OPTIMISTIC variant:
        buffered(p) = raw(p) * (1 + OPTIMISTIC_BUFFER_PCT)
        batch_count(p) = ceil(buffered(p) / p.min_batch_size)
        rounded(p) = batch_count(p) * p.min_batch_size
        capped_by_shelf_life(p) = false
      CONSERVATIVE variant:
        buffered(p) = raw(p) * (1 + CONSERVATIVE_BUFFER_PCT)
        cover_factor = min(1, p.shelf_life_hours / SERVICE_WINDOW_HOURS)
        cap(p) = floor(raw(p) * cover_factor / p.min_batch_size) * p.min_batch_size
        rounded(p) = min(ceil(buffered(p) / p.min_batch_size) * p.min_batch_size, cap(p))
        capped_by_shelf_life(p) = (rounded(p) < ceil(buffered(p) / p.min_batch_size) * p.min_batch_size)
      Rounding order is PINNED: round each line up to its own min_batch_size multiple
      FIRST, then total_rounded_quantity = SUM over lines of rounded(p).
      Never sum raw quantities and round once.
    input_set: "PrepItems referenced (via Recipe.components) by recipes named in the DemandForecast.item_mix of the list's FINALIZED forecast; raw == 0 lines are excluded"
    constants:
      OPTIMISTIC_BUFFER_PCT: 0.05
      CONSERVATIVE_BUFFER_PCT: 0.15
      SERVICE_WINDOW_HOURS: 12
    precision: "integer quantities; ceil/floor applied exactly as written"
    variants:
      - name: OPTIMISTIC
        when: "generation_variant == OPTIMISTIC"
        difference: "5% buffer, no shelf-life cap; always rounds up to full batches"
      - name: CONSERVATIVE
        when: "generation_variant == CONSERVATIVE"
        difference: "15% buffer, then capped at what the shelf life allows to be consumed within one 12-hour service window (cap is raw * min(1, shelf_life_hours/12) floored to full batches)"

  - name: slice_yield_reconciliation
    trigger: "POST /api/bakery-orders/{id}/receive (provisional variant) and POST /api/bakery-orders/{id}/reconcile-yield (final variant)"
    algorithm: aggregation
    formula: |
      Provisional (at receive):
        provisional_slices = whole_cakes_received * SLICES_PER_CAKE
      Final (at reconcile-yield):
        final_slice_count = client-supplied actual slice count
        yield_variance = final_slice_count - provisional_slices
        shrink_pct = yield_variance / provisional_slices   (may be negative; 4dp round_half_up)
    input_set: "the single BakeryOrder being received/reconciled"
    constants:
      SLICES_PER_CAKE: 14
    precision: "slices integer; shrink_pct 4 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "at receive, before sell-out is known"
        difference: "assumes perfect 14-slice yield per received cake"
      - name: FINAL
        when: "at reconcile-yield, after actual slicing is counted"
        difference: "uses the observed final_slice_count; produces a nonzero yield_variance whenever actual slicing diverges from 14/cake"

  - name: station_load_score
    trigger: "GET /api/stations/{id}/throughput-summary"
    algorithm: weighted_scoring
    formula: |
      Included tickets: ServiceTicket of the station's restaurant with fire_status IN {FIRED, READY}.
      base = 0
      for each included ticket t, for each item i in t.items:
        r = recipe(i.recipe_id)
        if r.station_type == station.station_type:
          complexity = len(r.components)
          mult = MODIFIER_MULT if len(i.modifications) > 0 else 1.0
          base += complexity * mult
      normalized = base / station.rack_slot_capacity
      peak_mult = PEAK_LOAD_MULTIPLIER if restaurant.current_waitlist_minutes >= PEAK_WAIT_THRESHOLD_MINUTES else 1.0
      load_score = min(normalized * peak_mult, LOAD_SCORE_CAP)
    input_set: "tickets with fire_status IN {FIRED, READY} only; items whose recipe station_type differs from the station's are excluded; OPEN/SERVED/VOIDED tickets excluded"
    constants:
      MODIFIER_MULT: 1.25
      PEAK_WAIT_THRESHOLD_MINUTES: 45
      PEAK_LOAD_MULTIPLIER: 1.5
      LOAD_SCORE_CAP: 2.0
    precision: "4 decimal places, round_half_up"

  - name: prep_batch_rounding_order
    trigger: "inside forecast_prep_quantity, on every generate/regenerate"
    algorithm: aggregation
    formula: |
      The scaffold PINS nested rounding order: each line's buffered quantity is
      rounded UP to that prep item's own min_batch_size multiple FIRST
      (rounded(p) = ceil(buffered(p) / min_batch_size(p)) * min_batch_size(p)),
      and total_rounded_quantity = SUM of the per-line rounded values.
      The alternative order (sum buffered quantities across lines, then round
      once) is FORBIDDEN — it yields different totals because batch granularity
      differs per item.
    input_set: "the lines array produced by forecast_prep_quantity"
    constants: {}
    precision: "integer; per-line ceil before summation"

  - name: overprep_waste_penalty
    trigger: "GET /api/stations/{id}/throughput-summary"
    algorithm: threshold
    formula: |
      Evaluation order is PINNED (circular-looking dependency made explicit):
      (1) wasted = SUM WasteEntry.quantity for the station where reason IN {OVER_PREP, EXPIRED}
      (2) consumed = SUM PrepBatch.consumed_quantity over all batches of the station (any status)
      (3) waste_ratio = wasted / (wasted + consumed); if denominator == 0 then waste_ratio = 0
      (4) tier selection on the UNROUNDED ratio, lower bound inclusive:
            [0.00, 0.05) -> 0 points
            [0.05, 0.12) -> 10 points
            [0.12, 0.25) -> 25 points
            >= 0.25      -> 50 points
      (5) penalty_points are reported on the summary; they NEVER feed back into
          waste_ratio (no re-derivation after tiering).
    input_set: "WasteEntry rows of the station with reason IN {OVER_PREP, EXPIRED} (QUALITY and SPILLAGE excluded from the penalty ratio); all PrepBatches of the station for the consumed denominator"
    constants:
      TIER1_UPPER: 0.05
      TIER2_UPPER: 0.12
      TIER3_UPPER: 0.25
      TIER0_POINTS: 0
      TIER1_POINTS: 10
      TIER2_POINTS: 25
      TIER3_POINTS: 50
    precision: "waste_ratio displayed at 4 decimal places, round_half_up; tier chosen on the unrounded value"

  - name: shelf_life_expiry_check
    trigger: "POST /api/prep-batches/{id}/record-consumption and POST /api/prep-batches/{id}/expire"
    algorithm: threshold
    formula: |
      expires_at = produced_at + shelf_life_hours (computed at mark-prepped)
      A batch is expired when logical_clock_now >= expires_at  (EQUALITY counts as expired).
      record-consumption at now >= expires_at: batch -> EXPIRED and the call fails with ERR_BATCH_EXPIRED.
      record-consumption at now < expires_at: allowed.
    input_set: "the single PrepBatch being consumed/expired"
    constants: {}
    precision: "ISO8601 seconds; >= comparison"

  - name: station_par_health
    trigger: "any PrepBatch mutation at the station (create, mark-prepped, record-consumption, waste, expire, cancel) and any StationPar status change"
    algorithm: aggregation
    formula: |
      on_hand(station, item) = SUM (quantity - consumed_quantity - wasted_quantity)
        over PrepBatch with station_id = station, prep_item_id = item, status IN {PLANNED, PREPPED}
      For each StationPar of the station with status ACTIVE:
        if on_hand < PAR_CRITICAL_FRACTION * par_quantity -> candidate CRITICAL
        elif on_hand < par_quantity -> candidate BELOW_PAR
        else -> candidate OK
      station.par_health = worst candidate across ACTIVE pars (CRITICAL < BELOW_PAR < OK in severity);
      if the station has no ACTIVE pars, par_health = OK.
      rack_load(station) = SUM (quantity - consumed_quantity - wasted_quantity)
        over PrepBatch with status IN {PLANNED, PREPPED} (all items).
      Batch creation is rejected when rack_load + new quantity > rack_slot_capacity
      (equality is ALLOWED: a station filled exactly to capacity is valid).
    input_set: "PrepBatches of the station with status IN {PLANNED, PREPPED}; StationPars of the station with status ACTIVE"
    constants:
      PAR_CRITICAL_FRACTION: 0.25
    precision: "integer quantities; strict < comparisons as written"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: existence
    check: "Request body must satisfy the endpoint's input schema: required fields present, types correct, enum values valid, integer positivity bounds (quantity > 0, min_batch_size > 0, shelf_life_hours > 0, expected_covers > 0, whole_cakes_ordered > 0, rack_slot_capacity > 0), shift_end strictly after shift_start"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 3
    category: auth
    check: "X-User-Role must be in the endpoint's roles list"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Path and body FK references must resolve to existing resources, validated left-to-right"
    error_id: "ERR_RESTAURANT_NOT_FOUND | ERR_MENU_REVISION_NOT_FOUND | ERR_RECIPE_NOT_FOUND | ERR_PREP_ITEM_NOT_FOUND | ERR_STATION_NOT_FOUND | ERR_STATION_PAR_NOT_FOUND | ERR_COOK_NOT_FOUND | ERR_DEMAND_FORECAST_NOT_FOUND | ERR_PREP_LIST_NOT_FOUND | ERR_PREP_BATCH_NOT_FOUND | ERR_SHIFT_ASSIGNMENT_NOT_FOUND | ERR_BAKERY_ORDER_NOT_FOUND | ERR_WASTE_ENTRY_NOT_FOUND | ERR_SERVICE_TICKET_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids or FK inputs"
  - priority: 5
    category: state
    check: "Target resource (and cross-entity guardians) must be in the required state: revision/forecast/prep-list/batch/assignment/bakery-order/ticket/par-adjustment state preconditions; generate requires FINALIZED forecast; ticket create requires recipe on latest PUBLISHED revision; assignment confirm requires ACTIVE cook"
    error_id: "ERR_REVISION_NOT_DRAFT | ERR_REVISION_NOT_IN_REVIEW | ERR_REVISION_NOT_APPROVED | ERR_FORECAST_NOT_DRAFT | ERR_FORECAST_NOT_SUBMITTED | ERR_FORECAST_NOT_FINALIZED | ERR_PREP_LIST_NOT_DRAFT | ERR_PREP_LIST_NOT_GENERATED | ERR_PREP_LIST_NOT_LOCKED | ERR_PREP_LIST_NOT_REGENERABLE | ERR_BATCH_NOT_PLANNED | ERR_BATCH_NOT_PREPPED | ERR_BATCH_EXPIRED | ERR_ASSIGNMENT_NOT_SCHEDULED | ERR_ASSIGNMENT_NOT_CONFIRMED | ERR_BAKERY_ORDER_INVALID_STATE | ERR_TICKET_INVALID_STATE | ERR_PAR_ADJUSTMENT_NOT_PENDING | ERR_RECIPE_NOT_ON_PUBLISHED_MENU | ERR_COOK_NOT_ACTIVE | ERR_MENU_REVISION_NOT_PUBLISHED | ERR_INVALID_TRANSITION"
    http_status: 409
    applies_to: "state transition and state-guarded endpoints"
  - priority: 6
    category: business_safety
    check: "Allergen gate: firing a ticket whose allergen_review_status is PENDING is forbidden; modification policy FORBIDDEN rejects any ticket item with non-empty modifications at ticket creation"
    error_id: "ERR_ALLERGEN_REVIEW_REQUIRED | ERR_TICKET_MODIFICATION_FORBIDDEN"
    http_status: 422
    applies_to: "POST /api/service-tickets, POST /api/service-tickets/{id}/fire"
  - priority: 7
    category: business_safety
    check: "Segregation of duties: par adjustment approver X-User-ID must differ from the par's requested_by_cook_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /api/station-pars/{id}/approve-adjustment"
  - priority: 8
    category: business_constraint
    check: "Cook certification: shift assignment's station station_type must be in the cook's certified_station_types"
    error_id: ERR_COOK_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /api/shift-assignments"
  - priority: 9
    category: business_temporal
    check: "Shift overlap: a cook may not hold two non-terminal assignments whose half-open intervals [shift_start, shift_end) intersect; touching intervals (end == start) do NOT intersect"
    error_id: ERR_SHIFT_OVERLAP
    http_status: 409
    applies_to: "POST /api/shift-assignments"
  - priority: 10
    category: business_temporal
    check: "Forecast service_date must be strictly after the logical clock now at submit"
    error_id: ERR_FORECAST_DATE_PAST
    http_status: 422
    applies_to: "POST /api/demand-forecasts/{id}/submit"
  - priority: 11
    category: business_constraint
    check: "Rack capacity: rack_load(station) + new batch quantity must be <= rack_slot_capacity (equality allowed)"
    error_id: ERR_RACK_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /api/prep-batches"
  - priority: 12
    category: business_fiscal
    check: "Bakery budget: weekly_bakery_budget_spent_cents + whole_cakes_ordered * 2500 must be <= weekly_bakery_budget_cents at confirm"
    error_id: ERR_BAKERY_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /api/bakery-orders/{id}/confirm"
  - priority: 13
    category: business_referential
    check: "Recipe components and station mise_en_place_layout must reference PrepItems with status ACTIVE at creation time"
    error_id: ERR_PREP_ITEM_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /api/recipes, POST /api/stations"
  - priority: 14
    category: business_constraint
    check: "OCC: expected_*_version must equal the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/prep-lists/{id}/regenerate, POST /api/station-pars/{id}/propose-adjustment"

# =============================================================================
# §1.5 API Endpoint Table (78 endpoints)
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default (before any call) is exactly 2026-09-01T00:00:00Z and NEVER falls back to wall-clock time."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Logical clock advanced; no other mutation"]

  # --- Restaurant ---
  - method: POST
    path: "/api/restaurants"
    description: "Create a restaurant"
    roles: [SystemAdmin]
    code: 201
    input: [name, code, weekly_bakery_budget_cents]
    output: Restaurant
    side_effects: ["status=ACTIVE, weekly_bakery_budget_spent_cents=0, current_waitlist_minutes=0"]
  - method: GET
    path: "/api/restaurants"
    description: "List restaurants"
    roles: [SystemAdmin, MenuAdmin, KitchenManager, PrepCook, LineCook, PastryChef, InventoryController]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Restaurant[]"
    side_effects: []
  - method: GET
    path: "/api/restaurants/{id}"
    description: "Get a restaurant"
    roles: [SystemAdmin, MenuAdmin, KitchenManager, PrepCook, LineCook, PastryChef, InventoryController]
    code: 200
    input: []
    output: Restaurant
    side_effects: []
  - method: POST
    path: "/api/restaurants/{id}/update-waitlist"
    description: "Set current_waitlist_minutes (drives peak multiplier)"
    roles: [KitchenManager]
    code: 200
    input: [waitlist_minutes]
    output: Restaurant
    side_effects: ["current_waitlist_minutes := waitlist_minutes"]

  # --- MenuRevision ---
  - method: POST
    path: "/api/menu-revisions"
    description: "Create a menu revision in DRAFT"
    roles: [MenuAdmin]
    code: 201
    input: [restaurant_id, label, effective_from]
    output: MenuRevision
    side_effects: []
  - method: GET
    path: "/api/menu-revisions"
    description: "List menu revisions"
    roles: [SystemAdmin, MenuAdmin, KitchenManager, PrepCook, LineCook, PastryChef, InventoryController]
    code: 200
    input: ["restaurant_id?", "status?", "limit?", "offset?"]
    output: "MenuRevision[]"
    side_effects: []
  - method: GET
    path: "/api/menu-revisions/{id}"
    description: "Get a menu revision"
    roles: [SystemAdmin, MenuAdmin, KitchenManager, PrepCook, LineCook, PastryChef, InventoryController]
    code: 200
    input: []
    output: MenuRevision
    side_effects: []
  - method: POST
    path: "/api/menu-revisions/{id}/submit-review"
    description: "DRAFT -> IN_REVIEW"
    roles: [MenuAdmin]
    code: 200
    input: []
    output: MenuRevision
    side_effects: []
  - method: POST
    path: "/api/menu-revisions/{id}/request-changes"
    description: "IN_REVIEW -> DRAFT (revision loop; review_cycle_count += 1)"
    roles: [MenuAdmin]
    code: 200
    input: []
    output: MenuRevision
    side_effects: ["review_cycle_count += 1"]
  - method: POST
    path: "/api/menu-revisions/{id}/approve"
    description: "IN_REVIEW -> APPROVED"
    roles: [MenuAdmin]
    code: 200
    input: []
    output: MenuRevision
    side_effects: []
  - method: POST
    path: "/api/menu-revisions/{id}/publish"
    description: "APPROVED -> PUBLISHED with full cascade (see MenuRevision state machine)"
    roles: [MenuAdmin]
    code: 200
    input: []
    output: MenuRevision
    side_effects: ["supersede prior published revision and its recipes", "retire unreferenced prep items", "suspend affected pars", "cancel affected PLANNED batches", "flag cooks RETRAINING_REQUIRED", "recipe_card_redistribution_status=COMPLETE"]

  # --- Recipe ---
  - method: POST
    path: "/api/recipes"
    description: "Create a recipe under a menu revision (revision must be DRAFT or IN_REVIEW)"
    roles: [MenuAdmin]
    code: 201
    input: [menu_revision_id, name, station_type, "allergen_tags?", "modification_policy?", "components?"]
    output: Recipe
    side_effects: ["component prep items must be ACTIVE (ERR_PREP_ITEM_NOT_ACTIVE)"]
  - method: GET
    path: "/api/recipes"
    description: "List recipes"
    roles: [SystemAdmin, MenuAdmin, KitchenManager, PrepCook, LineCook, PastryChef, InventoryController]
    code: 200
    input: ["menu_revision_id?", "status?", "station_type?", "limit?", "offset?"]
    output: "Recipe[]"
    side_effects: []
  - method: GET
    path: "/api/recipes/{id}"
    description: "Get a recipe"
    roles: [SystemAdmin, MenuAdmin, KitchenManager, PrepCook, LineCook, PastryChef, InventoryController]
    code: 200
    input: []
    output: Recipe
    side_effects: []

  # --- PrepItem ---
  - method: POST
    path: "/api/prep-items"
    description: "Create a prep item"
    roles: [MenuAdmin]
    code: 201
    input: [name, station_type, shelf_life_hours, min_batch_size, batch_unit]
    output: PrepItem
    side_effects: []
  - method: GET
    path: "/api/prep-items"
