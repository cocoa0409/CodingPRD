            - "TransferAgreement.${ta_id}.final_credit_points == null after the execute"
            - "After the execute: Institution.${sender_id}.transfer_credit_balance == 62.23"
            - "After the execute: Institution.${receiver_id}.transfer_credit_balance == -62.23, so the system-wide sum is 0.00"
