              as: Technician
            - call: "POST /payment-records"
              payload: { fill_id: "${of1}", amount_cents: 1210, tendered_by: "cash-1" }
              as: Cashier
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-02-05T00:00:00.000Z" }
              as: PharmacyAdmin
          trigger:
            - call: "POST /fills/${of1}/dispense"
              payload: {}
              as: Pharmacist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_WILL_CALL_EXPIRED"
            - "HTTP status == 409"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reverse_claim_conserves_fill_money_ledger
        grounds:
          - state_machines.FillClaim.PAID_to_REVERSED
          - entities.Fill.fields.plan_paid_cents
          - entities.Fill.fields.final_copay_cents
          - entities.Fill.fields.gross_amount_cents
        distinguishing_aspect: |
          Conserved quantity #1 — the per-fill money ledger: after a paid claim
          is reversed, plan_paid_cents returns to 0 and the PaymentRecord is
          refunded, so the invariant gross_amount_cents stays fixed while
          plan_paid_cents + collected_copay returns to 0 (no money drift).
        test_recipe:
          setup:
            - "Fill PAID (plan_paid 14480, final_copay 3620) with a PaymentRecord, not yet dispensed"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PharmacyAdmin
            - call: "POST /insurance-plans"
              payload: { bin: "610016", pcn: "PP", name: "Plan P", copay_pct: 0.20, copay_min_cents: 500, copay_max_cents: 10000, dispensing_fee_cents: 100 }
              as: PharmacyAdmin
              captures: { plan_p: $.data.id }
            - call: "POST /drug-products"
              payload: { ndc: "00000-0016-01", name: "Oscar", unit_price_cents: 800 }
              as: PharmacyAdmin
              captures: { drug_oscar: $.data.id }
            - call: "POST /formulary-entries"
              payload: { plan_id: "${plan_p}", drug_id: "${drug_oscar}", tier: 2, allowed_amount_cents: 600 }
              as: PharmacyAdmin
            - call: "POST /patients"
              payload: { full_name: "Pat Seventeen", date_of_birth: "1994-04-04", plan_id: "${plan_p}" }
              as: Technician
              captures: { pat17: $.data.id }
            - call: "POST /prescribers"
              payload: { full_name: "Dr P", npi: "1000000160" }
              as: PharmacyAdmin
              captures: { presc17: $.data.id }
            - call: "POST /prescriptions"
              payload: { patient_id: "${pat17}", prescriber_id: "${presc17}", drug_id: "${drug_oscar}", quantity_per_fill: 30, days_supply: 30, written_utc: "2026-01-01T00:00:00.000Z" }
              as: Technician
              captures: { rx17: $.data.id }
            - call: "POST /fills"
              payload: { prescription_id: "${rx17}" }
              as: Technician
              captures: { pf1: $.data.id }
            - call: "POST /fills/${pf1}/run-dur"
              payload: {}
              as: Technician
            - call: "GET /prescriptions/${rx17}"
              payload: {}
              as: Technician
              captures: { pv1: $.data.version }
            - call: "POST /fills/${pf1}/submit-claim"
              payload: { expected_prescription_version: "${pv1}" }
              as: Technician
            - call: "POST /payment-records"
              payload: { fill_id: "${pf1}", amount_cents: 3620, tendered_by: "cash-1" }
              as: Cashier
              captures: { pay17: $.data.id }
          trigger:
            - call: "POST /fills/${pf1}/reverse-claim"
              payload: {}
              as: Pharmacist
              captures: { rev_paid: $.data.plan_paid_cents, rev_claim: $.data.claim_status }
            - call: "GET /payment-records/${pay17}"
              payload: {}
              as: Pharmacist
              captures: { pay_refunded: $.data.refunded }
          assert:
            - "Fill.${pf1}.claim_status == REVERSED"
            - "Fill.${pf1}.plan_paid_cents == 0"
            - "Fill.${pf1}.gross_amount_cents == 24000"
            - "PaymentRecord.${pay17}.refunded == true"

      - name: pa_deny_conserves_refills_remaining_count
        grounds:
          - state_machines.PriorAuthRequest.PENDING_to_DENIED
          - calculations.refills_remaining_recompute
          - entities.Prescription.fields.refills_remaining
        distinguishing_aspect: |
          Conserved quantity #2 — the refills-remaining count (a different
          conserved quantity than money): a PA-referred refill that is DENIED
          cancels the fill and the compensating recompute restores
          refills_remaining to its pre-fill value, so the refill budget shows no
          drift after the forward (create refill) + compensating (deny) pair.
        test_recipe:
          setup:
            - "Prescription with refills 2; original fill DISPENSED; a refill PA-referred then DENIED"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PharmacyAdmin
            - call: "POST /insurance-plans"
              payload: { bin: "610017", pcn: "PQ", name: "Plan Q", copay_pct: 0.10, copay_max_cents: 10000, refill_too_soon_threshold_pct: 0.50 }
              as: PharmacyAdmin
              captures: { plan_q: $.data.id }
            - call: "POST /drug-products"
              payload: { ndc: "00000-0017-01", name: "Papa PA", unit_price_cents: 500, pa_required: true }
              as: PharmacyAdmin
              captures: { drug_papa: $.data.id }
            - call: "POST /formulary-entries"
              payload: { plan_id: "${plan_q}", drug_id: "${drug_papa}", tier: 4, allowed_amount_cents: 400 }
              as: PharmacyAdmin
            - call: "POST /patients"
              payload: { full_name: "Pat Eighteen", date_of_birth: "1996-06-06", plan_id: "${plan_q}" }
              as: Technician
              captures: { pat18: $.data.id }
            - call: "POST /prescribers"
              payload: { full_name: "Dr Q", npi: "1000000170" }
              as: PharmacyAdmin
              captures: { presc18: $.data.id }
            - call: "POST /prescriptions"
              payload: { patient_id: "${pat18}", prescriber_id: "${presc18}", drug_id: "${drug_papa}", quantity_per_fill: 30, days_supply: 30, refills_authorized: 2, written_utc: "2026-01-01T00:00:00.000Z" }
              as: Technician
              captures: { rx18: $.data.id }
            # original fill: PA approve then dispense
            - call: "POST /fills"
              payload: { prescription_id: "${rx18}" }
              as: Technician
              captures: { qf1: $.data.id }
            - call: "POST /fills/${qf1}/run-dur"
              payload: {}
              as: Technician
            - call: "GET /prescriptions/${rx18}"
              payload: {}
              as: Technician
              captures: { qv1: $.data.version }
            - call: "POST /fills/${qf1}/submit-claim"
              payload: { expected_prescription_version: "${qv1}" }
              as: Technician
            - call: "GET /prior-auth-requests"
              payload: { fill_id: "${qf1}" }
              as: Pharmacist
              captures: { qpa1: "$.data[0].id", qpa1v: "$.data[0].version" }
            - call: "POST /prior-auth-requests/${qpa1}/approve"
              payload: { expected_priorauthrequest_version: "${qpa1v}" }
              as: Pharmacist
            - call: "GET /prescriptions/${rx18}"
              payload: {}
              as: Technician
              captures: { qv1b: $.data.version }
            - call: "POST /fills/${qf1}/submit-claim"
              payload: { expected_prescription_version: "${qv1b}" }
              as: Technician
            - call: "POST /fills/${qf1}/stage-will-call"
              payload: {}
              as: Technician
            - call: "POST /payment-records"
              payload: { fill_id: "${qf1}", amount_cents: 410, tendered_by: "cash-1" }
              as: Cashier
            - call: "POST /fills/${qf1}/dispense"
              payload: {}
              as: Pharmacist
            - call: "GET /prescriptions/${rx18}"
              payload: {}
              as: Technician
              captures: { refills_after_first: $.data.refills_remaining }
            # advance clock past too-soon, refill -> PA referral
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-20T00:00:00.000Z" }
              as: PharmacyAdmin
            - call: "POST /fills"
              payload: { prescription_id: "${rx18}" }
              as: Technician
              captures: { qf2: $.data.id }
            - call: "POST /fills/${qf2}/run-dur"
              payload: {}
              as: Technician
            - call: "GET /prescriptions/${rx18}"
              payload: {}
              as: Technician
              captures: { qv2: $.data.version }
            - call: "POST /fills/${qf2}/submit-claim"
              payload: { expected_prescription_version: "${qv2}" }
              as: Technician
            - call: "GET /prior-auth-requests"
              payload: { fill_id: "${qf2}" }
              as: Pharmacist
              captures: { qpa2: "$.data[0].id", qpa2v: "$.data[0].version" }
          trigger:
            - call: "POST /prior-auth-requests/${qpa2}/deny"
              payload: { expected_priorauthrequest_version: "${qpa2v}" }
              as: Pharmacist
            - call: "GET /fills/${qf2}"
              payload: {}
              as: Pharmacist
              captures: { qf2_status: $.data.status }
            - call: "GET /prescriptions/${rx18}"
              payload: {}
              as: Pharmacist
              captures: { refills_after_deny: $.data.refills_remaining }
          assert:
            - "Fill.${qf2}.status == CANCELLED"
            - "Prescription.${rx18}.refills_remaining == 2"
            - "refills_after_deny (2) == refills_after_first (2)"
