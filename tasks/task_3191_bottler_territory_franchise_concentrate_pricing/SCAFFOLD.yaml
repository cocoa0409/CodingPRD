    output: BottlerAgreement
    side_effects: []
  - method: GET
    path: "/bottler/territories/{id}/agreements"
    description: "List agreements of a territory (reverse-reachability for BottlerAgreement.territory_id)"
    roles: [PlatformAdmin, BrandOwnerAdmin, BottlerOps]
    code: 200
    input: ["limit?", "offset?"]
    output: BottlerAgreement[]
    side_effects: []
  - method: GET
    path: "/bottler/bottler-agreements/{id}"
    description: "Fetch one agreement"
    roles: [PlatformAdmin, BrandOwnerAdmin, BottlerOps]
    code: 200
    input: []
    output: BottlerAgreement
    side_effects: []
