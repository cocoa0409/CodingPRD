            - { call: "POST /avionics/panel-designs/${pd_id}/submit", payload: {}, as: ShopManager }
            - { call: "POST /avionics/work-orders/${wo_id}/submit-quote", payload: {}, as: ShopManager }
            - { call: "POST /avionics/panel-designs/${pd_id}/decide", payload: { outcome: "APPROVE" }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "GET /avionics/equipment-orders", payload: { work_order_id: "${wo_id}" }, as: ShopManager, captures: { eo_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /avionics/work-orders/${wo_id}/begin-installation", payload: {}, as: ShopManager, captures: { err1: "$.data.error_id" } }
            - { call: "POST /avionics/equipment-orders/${eo_id}/mark-ordered", payload: {}, as: ShopManager }
            - { call: "POST /avionics/equipment-orders/${eo_id}/receive", payload: {}, as: ShopManager }
