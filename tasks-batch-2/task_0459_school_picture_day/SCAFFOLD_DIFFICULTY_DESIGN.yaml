              payload: {}
              as: SchoolCoordinator
            - call: "POST /api/picture-day-sessions/${sess}/open-capture"
              payload: {}
              as: StudioPhotographer
            - call: "POST /api/photos"
              payload: { picture_day_session_id: "${sess}", candidate_name: "Kid Y", candidate_grade: "4", candidate_homeroom: "Q" }
              as: StudioPhotographer
              captures: { ph: $.data.id }
            - call: "POST /api/photos/${ph}/match"
              payload: {}
              as: StudioPhotographer
            - call: "POST /api/retouch-orders"
              payload: { photo_id: "${ph}", kind: "RETOUCH", adjustment_count: 3 }
              as: StudioPhotographer
              captures: { rt: $.data.id }
            - call: "POST /api/retouch-orders/${rt}/reject"
              payload: {}
              as: StudioPhotographer
          trigger:
            - call: "POST /api/retouch-orders/${rt}/approve"
              payload: {}
              as: StudioPhotographer
              captures: { err: $.data.error_id }
          assert:
            - "RetouchOrder.${rt}.net_cost_cents == 3000 (would also violate the budget-1000 fiscal check)"
            - "approve returns ERR_RETOUCH_NOT_REQUESTED (state, priority 8) — the state error wins over the fiscal check (priority 12), HTTP 409 not 402"

      - name: state_beats_safety_on_match_after_terminal_session
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - state_machines.Photo.UNMATCHED_to_MATCHED
