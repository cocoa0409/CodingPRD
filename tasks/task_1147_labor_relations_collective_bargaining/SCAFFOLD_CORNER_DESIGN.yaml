  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: clause_list_pagination_and_fk_filter
        claim_type: pagination_with_filtering
        grounds: [response_envelope, "endpoints[GET /labor-relations/clauses]"]
        distinguishing_aspect: "Filtered list semantics: agreement_id filter narrows the set (2 of 3 clauses), limit 1 pages it (has_more true then false at offset 1), and limit 0 is rejected with ERR_PAGINATION_INVALID."
        test_recipe:
          setup: ["union U; DRAFT agreements A1 (clauses 12.1 and 12.2) and A2 (clause 12.1)"]
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union EA", union_code: "UEA-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA EA-1", effective_date: "2026-06-01T00:00:00Z", expiration_date: "2029-05-31T00:00:00Z", headcount_baseline: 50, fte_projected: 60, avg_loaded_wage_cents: 4000, costing_envelope_cents: 1000000000 }
              as: LRAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA EA-2", effective_date: "2026-06-01T00:00:00Z", expiration_date: "2029-05-31T00:00:00Z", headcount_baseline: 50, fte_projected: 60, avg_loaded_wage_cents: 4000, costing_envelope_cents: 1000000000 }
              as: LRAdmin
              captures: { a2_id: $.data.id }
            - call: "POST /labor-relations/clauses"
              payload: { agreement_id: "${a1_id}", article_ref: "12.1", title: "First", body_text: "x" }
              as: LRManager
              as_user_id: "mgr-1"
            - call: "POST /labor-relations/clauses"
              payload: { agreement_id: "${a1_id}", article_ref: "12.2", title: "Second", body_text: "x" }
              as: LRManager
              as_user_id: "mgr-1"
            - call: "POST /labor-relations/clauses"
              payload: { agreement_id: "${a2_id}", article_ref: "12.1", title: "Other", body_text: "x" }
              as: LRManager
              as_user_id: "mgr-1"
          trigger:
            - call: "GET /labor-relations/clauses"
              payload: { agreement_id: "${a1_id}", limit: 1, offset: 0 }
              as: LRManager
              as_user_id: "mgr-1"
            - call: "GET /labor-relations/clauses"
              payload: { agreement_id: "${a1_id}", limit: 1, offset: 1 }
              as: LRManager
              as_user_id: "mgr-1"
            - call: "GET /labor-relations/clauses"
              payload: { agreement_id: "${a1_id}", limit: 0 }
              as: LRManager
              as_user_id: "mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "page 1: total_count == 2 and has_more == true and exactly 1 item returned"
            - "page 2 (offset 1): total_count == 2 and has_more == false and exactly 1 item returned"
            - "err == ERR_PAGINATION_INVALID for limit 0"

      - name: response_envelope_shapes
        claim_type: creation
        grounds: [response_envelope]
        distinguishing_aspect: "Every response carries the fixed envelope: object reads use response_type object with meta.api_request_id; list reads use response_type array; failures carry data.error_id and data.message."
        test_recipe:
          setup: ["union U exists"]
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union EB", union_code: "UEB-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
          trigger:
            - call: "GET /labor-relations/unions/${u_id}"
              payload: {}
              as: LRAdmin
            - call: "GET /labor-relations/unions"
              payload: {}
              as: LRAdmin
            - call: "GET /labor-relations/unions/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: LRAdmin
              captures: { err: $.data.error_id }
          assert:
            - "object read: response_type == object and meta.api_request_id present and data.id == ${u_id}"
            - "list read: response_type == array and total_count present"
            - "error read: response_type == error and err == ERR_NOT_FOUND and data.message present"

