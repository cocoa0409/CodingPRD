  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: water_tier1_boundary_at_6000_gallons
        grounds:
          - calculations.water_tier_charge
          - entities.Bill.fields.total_due_cents
        distinguishing_aspect: |
          Consumption of exactly 6000 gal is wholly tier-1 (6.0*315 + 1000 = 2890);
          6001 gal spills one gallon into tier-2 (2890.5 -> 2891). The tier boundary
          is inclusive of 6000, reached through POST /accounts/{id}/bills.
        test_recipe:
          setup:
            - "Two water accounts, one metered 6000 gal, the other 6001 gal (ACTUAL)."
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { service_type: "WATER", unit: "GALLON", fixed_charge_cents: 1000, tiers: [{upper_bound_units: 6000, rate_cents_per_1000: 315}, {upper_bound_units: 12000, rate_cents_per_1000: 500}, {upper_bound_units: null, rate_cents_per_1000: 800}], effective_date: "2026-01-01T00:00:00Z" }
