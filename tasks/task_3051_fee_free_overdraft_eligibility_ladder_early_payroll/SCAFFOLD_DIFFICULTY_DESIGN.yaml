  # ===========================================================================
  # Rule 4 — transitive_cascade from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: deposit_return_reversal_reclaim_cascade
        grounds:
          - state_machines.DirectDeposit.POSTED_EARLY_to_RETURNED
          - state_machines.EarlyPosting.PROVISIONAL_to_REVERSED
          - calculations.calc_return_shortfall
        distinguishing_aspect: |
          Depth-3 chain triggered by deposit return: RETURNED transition ->
          EarlyPosting REVERSED with provisional_early_cents debited ->
          calc_return_shortfall converts the unrecoverable portion into a
          RECLAIM_SHORTFALL OverdraftAdvance -> account.outstanding_cushion_cents
          rises and usable_cushion_cents collapses. Each hop is caused by the
          previous hop, not by the original request.
        test_recipe:
          setup:
            - "member m7 ELIGIBLE (2 settled qualifying deposits, tenure 243d -> score 316 -> limit 2000)"
            - "payroll deposit 20000 posted early; member spends 21000 via debit (posted 20000 -> -1000, auto-advance 1000 within limit 2000)"
            - "posted_balance_cents == -1000, outstanding MEMBER advance 1000"
          setup_api_calls:
            - call: "POST /banking/members"
              payload: { external_ref: "m7", full_name: "M Seven", enrolled_at: "2026-01-01T00:00:00Z" }
              as: ProgramOps
              captures: { m7: $.data.id, m7_v0: $.data.version }
            - call: "POST /banking/members/${m7}/accounts"
              payload: { account_type: "SPENDING" }
              as: SponsorBankOps
              captures: { a7: $.data.id }
            - call: "POST /banking/accounts/${a7}/deposits"
              payload: { originator_id: "EMP7", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-20T00:00:00Z", trace_id: "m7-t1" }
              as: SponsorBankOps
              captures: { m7d1: $.data.id }
            - call: "POST /banking/accounts/${a7}/deposits"
              payload: { originator_id: "EMP7", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-28T00:00:00Z", trace_id: "m7-t2" }
              as: SponsorBankOps
              captures: { m7d2: $.data.id }
            - call: "POST /banking/deposits/${m7d1}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/deposits/${m7d2}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/members/${m7}/eligibility-evaluations"
              payload: { evaluation_mode: "BATCH", expected_member_version: "${m7_v0}" }
              as: ProgramOps
            - call: "POST /banking/accounts/${a7}/deposits"
              payload: { originator_id: "EMP7", originator_type: "PAYROLL", amount_cents: 20000, settlement_date: "2026-09-05T00:00:00Z", trace_id: "m7-t3" }
              as: SponsorBankOps
              captures: { m7d3: $.data.id }
            - call: "POST /banking/deposits/${m7d3}/post-early"
              payload: {}
              as: ProgramOps
            - call: "GET /banking/accounts/${a7}"
              payload: {}
              as: ProgramOps
              captures: { a7_v1: $.data.version }
            - call: "POST /banking/accounts/${a7}/debits"
              payload: { amount_cents: 21000, merchant_ref: "store-1", expected_account_version: "${a7_v1}" }
              as: Member
              as_user_id: "${m7}"
          trigger:
            - call: "POST /banking/deposits/${m7d3}/return"
              payload: { return_code: "R02_CLOSED" }
              as: SponsorBankOps
              captures: { ret7_shortfall: $.data.shortfall_cents }
          assert:
            - "DirectDeposit.${m7d3}.status == RETURNED"
            - "EarlyPosting for ${m7d3} status == REVERSED"
            - "DepositReturn.shortfall_cents == 20000 (posted balance was -1000, recoverable == 0)"
            - "a second OverdraftAdvance with origin == RECLAIM_SHORTFALL and principal_cents == 20000 exists for account ${a7}"
            - "DepositAccount.${a7}.outstanding_cushion_cents == 21000 (1000 member advance + 20000 reclaim advance)"
            - "DepositAccount.${a7}.usable_cushion_cents == 0 and available_optimistic_cents < 0"

      - name: abuse_event_posture_limit_collapse_cascade
        grounds:
          - state_machines.Member.RESTRICTED_to_SUSPENDED
          - state_machines.Member.SUSPENDED_to_SUSPENDED
          - state_machines.CushionLimitAdjustment
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (abuse event, not a deposit
          return): AbuseEvent -> Member RESTRICTED->SUSPENDED with
          deposit_reroute_flag set -> the next BATCH evaluation under SUSPENDED
          forces computed_limit 0 -> a DECREASE adjustment bypassing the 7-day
          notice is created EFFECTIVE immediately and member.current_limit_cents
          collapses to 0.
        test_recipe:
          setup:
            - "member m8 ELIGIBLE, limit 2000 (2 settled qualifying deposits, tenure 365d)"
            - "first abuse event (CUSHION_CYCLING) -> RESTRICTED"
          setup_api_calls:
            - call: "POST /banking/members"
              payload: { external_ref: "m8", full_name: "M Eight", enrolled_at: "2025-09-01T00:00:00Z" }
              as: ProgramOps
              captures: { m8: $.data.id, m8_v0: $.data.version }
            - call: "POST /banking/members/${m8}/accounts"
              payload: { account_type: "SPENDING" }
              as: SponsorBankOps
              captures: { a8: $.data.id }
            - call: "POST /banking/accounts/${a8}/deposits"
              payload: { originator_id: "EMP8", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-14T00:00:00Z", trace_id: "m8-t1" }
              as: SponsorBankOps
              captures: { m8d1: $.data.id }
            - call: "POST /banking/accounts/${a8}/deposits"
              payload: { originator_id: "EMP8", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-21T00:00:00Z", trace_id: "m8-t2" }
              as: SponsorBankOps
              captures: { m8d2: $.data.id }
            - call: "POST /banking/deposits/${m8d1}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/deposits/${m8d2}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/members/${m8}/eligibility-evaluations"
              payload: { evaluation_mode: "BATCH", expected_member_version: "${m8_v0}" }
              as: ProgramOps
              captures: { m8_v1: $.data.version }
            - call: "POST /banking/members/${m8}/abuse-events"
              payload: { event_type: "CUSHION_CYCLING", expected_member_version: "${m8_v1}" }
              as: ProgramOps
              captures: { m8_v2: $.data.version }
          trigger:
            - call: "POST /banking/members/${m8}/abuse-events"
              payload: { event_type: "DEPOSIT_REROUTE", expected_member_version: "${m8_v2}" }
              as: ProgramOps
            - call: "GET /banking/members/${m8}"
              payload: {}
              as: ProgramOps
              captures: { m8_v3: $.data.version }
            - call: "POST /banking/members/${m8}/eligibility-evaluations"
              payload: { evaluation_mode: "BATCH", expected_member_version: "${m8_v3}" }
              as: ProgramOps
              captures: { m8_limit_after: $.data.computed_limit_cents }
          assert:
            - "after second abuse event Member.${m8}.status == SUSPENDED and deposit_reroute_flag == true"
            - "BATCH evaluation under SUSPENDED produces computed_limit_cents == 0 (forced)"
            - "a CushionLimitAdjustment DECREASE 2000 -> 0 exists with status == EFFECTIVE immediately (suspension bypasses the 7-day notice period)"
            - "Member.${m8}.current_limit_cents == 0"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict, different category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: posture_state_vs_fiscal_limit_conflict
        grounds:
          - validations[priority=8]
          - validations[priority=14]
          - errors[ERR_MEMBER_POSTURE]
          - errors[ERR_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Pair (state vs business_fiscal): an advance that violates at once
          the member-posture gate (member SUSPENDED, priority 8) and
          exceeds the usable cushion (priority 14) returns ERR_MEMBER_POSTURE
          with http 409, not ERR_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "member m9 ELIGIBLE with limit 2000, then two abuse events -> SUSPENDED (current_limit still 2000 until an eval runs, so amount 5000 also violates fiscal headroom)"
          setup_api_calls:
            - call: "POST /banking/members"
              payload: { external_ref: "m9", full_name: "M Nine", enrolled_at: "2025-09-01T00:00:00Z" }
              as: ProgramOps
              captures: { m9: $.data.id, m9_v0: $.data.version }
            - call: "POST /banking/members/${m9}/accounts"
              payload: { account_type: "SPENDING" }
              as: SponsorBankOps
              captures: { a9: $.data.id }
            - call: "POST /banking/accounts/${a9}/deposits"
              payload: { originator_id: "EMP9", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-14T00:00:00Z", trace_id: "m9-t1" }
              as: SponsorBankOps
              captures: { m9d1: $.data.id }
            - call: "POST /banking/accounts/${a9}/deposits"
              payload: { originator_id: "EMP9", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-21T00:00:00Z", trace_id: "m9-t2" }
              as: SponsorBankOps
              captures: { m9d2: $.data.id }
            - call: "POST /banking/deposits/${m9d1}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/deposits/${m9d2}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/members/${m9}/eligibility-evaluations"
              payload: { evaluation_mode: "BATCH", expected_member_version: "${m9_v0}" }
              as: ProgramOps
              captures: { m9_v1: $.data.version }
            - call: "POST /banking/members/${m9}/abuse-events"
              payload: { event_type: "CUSHION_CYCLING", expected_member_version: "${m9_v1}" }
              as: ProgramOps
              captures: { m9_v2: $.data.version }
