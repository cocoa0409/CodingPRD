      - name: series_gross_rounds_per_race_before_summing_bonus_tie
        mode: "(b) rounding order pinned"
        grounds:
          - calculations.series_standing
          - calculations.race_points_and_places
          - entities.Entry.fields.series_points_gross
          - entities.Race.fields.points_pool_total
        distinguishing_aspect: |
          Two BONUS_POINT races each end in the same two-boat tie for slots 2 and 3, whose group value is
          mean(3.0, 5.7) = 4.35 rounded once at the group level to 4.4. Because series_standing sums the
          ALREADY ROUNDED per-race values, the tied entries carry gross 8.8 after two races. Summing the
          unrounded group averages first (4.35 + 4.35 = 8.7) and rounding the total afterwards yields 8.7,
          so the two rounding orders are 0.1 apart and only the pinned order matches this assert. The
          conservation check is exact in the pinned order as well: 8.8 + 8.8 + 0.0 == 8.8 + 8.8.
