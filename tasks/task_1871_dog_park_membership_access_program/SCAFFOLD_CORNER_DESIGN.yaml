            - call: "POST /dog-park/dogs/${d2_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ParkAdmin
          trigger:
            - call: "POST /dog-park/members/${m_id}/memberships"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { fee: $.data.charged_fee_cents }
          assert:
            - "charged_fee_cents == 6288"

      - name: rounding_order_divergence_covered
        claim_type: precision
        grounds: [calculations.initial_membership_fee]
