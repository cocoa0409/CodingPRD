# =============================================================================
# PRD Benchmark Seed Tables — Wedding-Officiant & Ceremony Service
# Difficulty tier: EXPERT
# Files: SCAFFOLD.yaml (§1.0–§1.7) + SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8)
#        + SCAFFOLD_CORNER_DESIGN.yaml (§1.9)
# =============================================================================

scenario: |
  743. Wedding-Officiant & Ceremony Service: officiant roster & style/denomination,
  couple intake & ceremony-script customization, rehearsal & timeline, booking &
  travel/date hold, marriage-license filing & return compliance, package & deposit,
  backup-officiant, review

domain_name: wedding-officiant-ceremony
api_prefix: "/"    # flat, multi-root topology (peer collections; no URL nesting)

# -----------------------------------------------------------------------------
# Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency      # OCC on Officiant.version at date-hold placement
    - selector_policy             # backup-officiant selection from candidate pool
    - cascading_side_effects      # suspend/cancel cascades across 3–4 entities
    - scheduled_actions           # date-hold TTL + license validity/return windows via logical clock
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many                 # Booking has many children (script, rehearsal, license, review, hold)
    - cross_aggregate             # Booking references Officiant/Couple/Package/Venue across aggregates
  role_model: peer_roles
  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Officiant
    parent: null
    common_fields: true          # id, created_at, updated_at, version
    fields:
      - name: full_name
        type: string
        source: input
        description: "Officiant legal name"
      - name: email
        type: string
        source: input
        description: "Contact email"
      - name: styles
        type: array
        source: input
        description: "Ceremony styles offered; subset of {RELIGIOUS, SECULAR, INTERFAITH, SPIRITUAL}"
        constraints: "non-empty; each element in {RELIGIOUS, SECULAR, INTERFAITH, SPIRITUAL}"
      - name: denomination
        type: enum
        source: input
        description: "Faith tradition"
        constraints: "one of {CHRISTIAN, JEWISH, MUSLIM, HINDU, BUDDHIST, NONDENOMINATIONAL, CIVIL}"
      - name: certified_jurisdictions
        type: array
        source: input
        description: "State codes the officiant is legally certified to solemnize in, e.g. [\"CA\",\"NY\"]"
        constraints: "non-empty; each element a 2-letter state code"
      - name: travel_buffer_minutes
        type: integer
        source: input
        default: 180
        description: "Buffer applied on BOTH sides of a ceremony window for double-booking checks (see date_hold_overlap calc)"
        constraints: ">= 0"
      - name: max_active_holds
        type: integer
        source: input
        default: 5
        description: "Capacity ceiling on the number of co-existing non-terminal date holds"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        default: PENDING_REVIEW
        description: "Roster lifecycle"
        constraints: "one of {PENDING_REVIEW, ACTIVE, SUSPENDED}"
      - name: active_hold_count
        type: integer
        source: computed
        description: "Count of this officiant's DateHolds in status IN {HELD, CONFIRMED}; conserved by hold_slot_invariant"
      - name: escrow_balance_cents
        type: integer
        source: computed
        description: "Deposit money currently retained for this officiant (captured minus refunded); see deposit_escrow_invariant"
      - name: displayed_rating
        type: number
        source: computed
        description: "Public rating = mean(rating) over Reviews (officiant_id == this.id AND status == PUBLISHED), 2dp half-up; null when count is 0 (officiant_reputation, DISPLAYED variant)"
      - name: internal_rating
        type: number
        source: computed
        description: "Ops rating = mean(rating) over Reviews (officiant_id == this.id AND status IN {SUBMITTED, PUBLISHED}), 2dp half-up; null when set empty (officiant_reputation, INTERNAL variant)"
      - name: published_review_count
        type: integer
        source: computed
        description: "Count of Reviews (officiant_id == this.id AND status == PUBLISHED)"

  - name: Couple
    parent: null
    common_fields: true
    fields:
      - name: partner_one_name
        type: string
        source: input
        description: "First partner full name"
      - name: partner_two_name
        type: string
        source: input
        description: "Second partner full name"
      - name: email
        type: string
        source: input
        description: "Primary contact email"
      - name: phone
        type: string
        source: input
        description: "Contact phone"
      - name: paid_total_cents
        type: integer
        source: computed
        description: "Sum of deposit_captured_cents across this couple's bookings (money in)"
      - name: refund_credit_cents
        type: integer
        source: computed
        description: "Sum of refund_issued_cents across this couple's cancelled bookings (money returned/credited)"

  - name: Package
    parent: null
    common_fields: true          # configuration entity, but versioned for consistency
    fields:
      - name: name
        type: string
        source: input
        description: "Package display name"
      - name: tier
        type: enum
        source: input
        description: "Pricing tier"
        constraints: "one of {ESSENTIAL, CLASSIC, PREMIUM}"
      - name: base_price_cents
        type: integer
        source: input
        description: "Base ceremony fee in cents (first line item for gratuity)"
        constraints: "> 0"
      - name: deposit_pct
        type: number
        source: input
        description: "Fraction of grand total captured as deposit at confirmation"
        constraints: "0 < deposit_pct <= 1"

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Venue name"
      - name: jurisdiction
        type: enum
        source: input
        description: "State code where the venue sits; drives officiant certification and license jurisdiction checks"
        constraints: "2-letter state code, e.g. one of {CA, NY, TX, WA, IL}"
      - name: address
        type: string
        source: input
        description: "Street address"

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - name: officiant_id
        type: string
        source: input
        description: "FK -> Officiant.id; the primary assigned officiant"
      - name: couple_id
        type: string
        source: input
        description: "FK -> Couple.id; the client couple"
      - name: package_id
        type: string
        source: input
        description: "FK -> Package.id; the selected package"
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id; ceremony venue"
      - name: backup_officiant_id
        type: string
        source: computed
        description: "FK -> Officiant.id; backup officiant chosen by backup_officiant_selection; null until assign-backup succeeds"
      - name: ceremony_start
        type: datetime
        source: input
        description: "Ceremony window start (ISO 8601 UTC)"
      - name: ceremony_end
        type: datetime
        source: input
        description: "Ceremony window end (ISO 8601 UTC)"
        constraints: "ceremony_end > ceremony_start"
      - name: travel_distance_km
        type: number
        source: input
        description: "One-way travel distance from officiant base to venue; drives travel tier"
        constraints: ">= 0"
      - name: required_style
        type: enum
        source: input
        description: "Ceremony style the couple requires; must be in officiant.styles"
        constraints: "one of {RELIGIOUS, SECULAR, INTERFAITH, SPIRITUAL}"
      - name: addon_codes
        type: array
        source: input
        default: []
        description: "Selected add-on line items; each in {UNITY_CANDLE, HANDFASTING, LIVESTREAM, SAND_CEREMONY, PREMIUM_SCRIPT, BILINGUAL_CEREMONY}"
      - name: status
        type: enum
        source: system
        default: INQUIRY
        description: "Booking lifecycle"
        constraints: "one of {INQUIRY, HOLD, CONFIRMED, BACKUP_PENDING, BACKUP_CONFIRMED, COMPLETED, CANCELLED, EXPIRED}"
      - name: quoted_subtotal_cents
        type: integer
        source: computed
        description: "base + travel + rush + interfaith + addons (booking_price_quote)"
      - name: quoted_travel_cents
        type: integer
        source: computed
        description: "Travel surcharge line item (tiered by travel_distance_km)"
      - name: quoted_rush_cents
        type: integer
        source: computed
        description: "Rush line item: RUSH_FEE_CENTS when days_until_ceremony < 30 else 0"
      - name: quoted_interfaith_cents
        type: integer
        source: computed
        description: "Interfaith surcharge line item: INTERFAITH_SURCHARGE_CENTS when required_style == INTERFAITH else 0"
      - name: quoted_addons_cents
        type: integer
        source: computed
        description: "Sum of add-on line items"
      - name: quoted_gratuity_cents
        type: integer
        source: computed
        description: "Service gratuity: per-line-item 18% rounded half-up then summed (gratuity_split; per-line-then-sum PINNED)"
      - name: quoted_total_cents
        type: integer
        source: computed
        description: "Grand total = quoted_subtotal_cents + quoted_gratuity_cents"
      - name: deposit_due_cents
        type: integer
        source: computed
        description: "round_half_up(quoted_total_cents * package.deposit_pct)"
      - name: deposit_captured_cents
        type: integer
        source: computed
        description: "Deposit actually captured at confirm (= deposit_due_cents on success); 0 until CONFIRMED"
      - name: refund_issued_cents
        type: integer
        source: computed
        description: "Total refunded/credited to the couple on cancel (cancellation_settlement)"
      - name: forfeit_retained_cents
        type: integer
        source: computed
        description: "Deposit portion retained by service on couple-initiated cancel"
      - name: cancel_initiator
        type: enum
        source: system
        description: "Set on cancel: COUPLE (couple-initiated) or SERVICE (coordinator/service-initiated); null otherwise"
        constraints: "one of {COUPLE, SERVICE} or null"
      - name: cancel_reason
        type: enum
        source: input
        description: "Reason supplied at cancel"
        constraints: "one of {COUPLE_REQUEST, OFFICIANT_UNAVAILABLE, VENUE_LOST, NO_BACKUP, OTHER}"
      - name: days_until_ceremony_at_quote
        type: integer
        source: computed
        description: "floor((ceremony_start - clock_now)/86400s) captured at booking creation; drives rush line"

  - name: DateHold
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking this hold reserves a date for"
      - name: officiant_id
        type: string
        source: computed
        description: "FK -> Officiant.id; copied from booking.officiant_id when the hold is placed"
      - name: hold_start
        type: datetime
        source: computed
        description: "Copied from booking.ceremony_start"
      - name: hold_end
        type: datetime
        source: computed
        description: "Copied from booking.ceremony_end"
      - name: expires_at
        type: datetime
        source: computed
        description: "created_at + HOLD_TTL_DAYS; hold auto-EXPIRES at/after this instant"
      - name: status
        type: enum
        source: system
        default: HELD
        description: "Hold lifecycle"
        constraints: "one of {HELD, CONFIRMED, RELEASED, EXPIRED}"

  - name: CeremonyScript
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking whose ceremony this script customizes"
      - name: opening_remarks
        type: string
        source: input
        description: "Opening remarks text"
      - name: vow_format
        type: enum
        source: input
        description: "Vow style"
        constraints: "one of {TRADITIONAL, PERSONAL, MIXED}"
      - name: readings
        type: array
        source: input
        default: []
        description: "List of reading titles"
      - name: ritual_elements
        type: array
        source: input
        default: []
        description: "Ritual inclusions, e.g. [\"UNITY_CANDLE\",\"HANDFASTING\"]"
      - name: closing_blessing
        type: string
        source: input
        description: "Closing blessing text"
      - name: officiant_notes
        type: string
        source: system
        description: "Notes recorded by officiant on a decision; null until a decision is made"
      - name: revision_count
        type: integer
        source: computed
        description: "Number of times this script has re-entered SUBMITTED after CHANGES_REQUESTED"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Script review lifecycle (revision loop)"
        constraints: "one of {DRAFT, SUBMITTED, APPROVED, CHANGES_REQUESTED}"

  - name: Rehearsal
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking this rehearsal belongs to"
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id; where the rehearsal is held (double-booking checked per venue)"
      - name: rehearsal_start
        type: datetime
        source: input
        description: "Rehearsal window start (ISO 8601 UTC)"
      - name: rehearsal_end
        type: datetime
        source: input
        description: "Rehearsal window end (ISO 8601 UTC)"
        constraints: "rehearsal_end > rehearsal_start"
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: "Rehearsal lifecycle"
        constraints: "one of {SCHEDULED, CONFIRMED, COMPLETED, NO_SHOW, CANCELLED}"

  - name: MarriageLicense
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking this license backs"
      - name: jurisdiction
        type: enum
        source: input
        description: "Issuing state code; must equal the booking venue's jurisdiction"
        constraints: "2-letter state code"
      - name: license_number
        type: string
        source: input
        description: "County-issued license number"
      - name: issued_date
        type: datetime
        source: input
        description: "Date the county issued the license (ISO 8601 UTC)"
      - name: expiry_date
        type: datetime
        source: input
        description: "License validity end; must be SIGNED at/before this instant"
        constraints: "expiry_date > issued_date"
      - name: signed_at
        type: datetime
        source: system
        description: "Clock instant the officiant signed; null until SIGNED"
      - name: return_deadline
        type: datetime
        source: computed
        description: "signed_at + LICENSE_RETURN_WINDOW_DAYS; RECORD must occur at/before this instant"
      - name: recorded_at
        type: datetime
        source: system
        description: "Clock instant the registry recorded; null until RECORDED"
      - name: status
        type: enum
        source: system
        default: NOT_FILED
        description: "Compliance lifecycle"
        constraints: "one of {NOT_FILED, FILED, SIGNED, RECORDED, REJECTED, VOIDED, EXPIRED}"

  - name: Review
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the completed booking being reviewed"
      - name: officiant_id
        type: string
        source: computed
        description: "FK -> Officiant.id; copied from booking.officiant_id at review creation"
      - name: rating
        type: integer
        source: input
        description: "Star rating"
        constraints: "integer 1..5 inclusive"
      - name: text
        type: string
        source: input
        description: "Free-text review body"
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: "Moderation lifecycle"
        constraints: "one of {SUBMITTED, PUBLISHED, REMOVED}"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Officiant (cyclic: ACTIVE <-> SUSPENDED) ----
  - entity: Officiant
    initial_state: PENDING_REVIEW
    terminal_states: []
    transitions:
      - from: PENDING_REVIEW
        to: ACTIVE
        trigger: "POST /officiants/{id}/transition (to_state=ACTIVE)"
        actor: Coordinator
        preconditions: ["Officiant.status == PENDING_REVIEW"]
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /officiants/{id}/transition (to_state=SUSPENDED)"
        actor: Coordinator
        preconditions: ["Officiant.status == ACTIVE"]
        side_effects:
          - "CASCADE-A link1: for each Booking b where b.officiant_id == this.id AND b.status IN {CONFIRMED, BACKUP_CONFIRMED}: b transitions to BACKUP_PENDING (see Booking CONFIRMED->BACKUP_PENDING, which itself fires link2)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /officiants/{id}/transition (to_state=ACTIVE)"
        actor: Coordinator
        preconditions: ["Officiant.status == SUSPENDED"]
        side_effects: []

  # ---- Booking (branching + cycle CONFIRMED<->BACKUP_PENDING) ----
  - entity: Booking
    initial_state: INQUIRY
    terminal_states: [COMPLETED, CANCELLED, EXPIRED]
    transitions:
      - from: INQUIRY
        to: HOLD
        trigger: "POST /date-holds (creates the hold for this booking)"
        actor: Couple
        preconditions:
          - "Booking.status == INQUIRY"
          - "Officiant(booking.officiant_id).status == ACTIVE (ERR_OFFICIANT_UNAVAILABLE)"
          - "required_style IN Officiant.styles (ERR_STYLE_MISMATCH)"
          - "Officiant certified for Venue(booking.venue_id).jurisdiction (ERR_OFFICIANT_NOT_CERTIFIED)"
          - "Officiant.active_hold_count < Officiant.max_active_holds (ERR_CAPACITY_EXCEEDED)"
          - "No date_hold_overlap conflict on the officiant (ERR_OFFICIANT_DOUBLE_BOOKED)"
          - "expected_officiant_version matches Officiant.version (ERR_STALE_OFFICIANT_VERSION)"
        side_effects:
          - "DateHold created in HELD; officiant_id/hold_start/hold_end copied; expires_at = created_at + HOLD_TTL_DAYS"
          - "Officiant.active_hold_count += 1 (hold_slot_invariant forward)"
          - "increments Officiant.version by 1"
      - from: HOLD
        to: CONFIRMED
        trigger: "POST /bookings/{id}/confirm"
        actor: Couple
        preconditions:
          - "Booking.status == HOLD (ERR_BOOKING_NOT_HOLD)"
          - "Officiant(booking.officiant_id).status == ACTIVE (ERR_OFFICIANT_UNAVAILABLE) [cross-entity dep: Booking<-Officiant]"
          - "The booking's DateHold is not expired: clock_now < DateHold.expires_at (ERR_HOLD_EXPIRED)"
          - "deposit_amount_cents >= deposit_due_cents (ERR_DEPOSIT_INSUFFICIENT)"
        side_effects:
          - "deposit_captured_cents = deposit_due_cents (deposit_escrow_invariant forward)"
          - "Couple.paid_total_cents += deposit_captured_cents"
          - "Officiant.escrow_balance_cents += deposit_captured_cents"
          - "The booking's DateHold transitions HELD->CONFIRMED"
      - from: HOLD
        to: EXPIRED
        trigger: "POST /_expiry/run (hold TTL elapsed)"
        actor: system
        preconditions: ["Booking.status == HOLD", "clock_now >= DateHold.expires_at"]
        side_effects:
          - "The booking's DateHold transitions HELD->EXPIRED (which decrements Officiant.active_hold_count and bumps Officiant.version)"
      - from: CONFIRMED
        to: BACKUP_PENDING
        trigger: "system cascade from Officiant ACTIVE->SUSPENDED"
        actor: system
        preconditions: ["Booking.status IN {CONFIRMED, BACKUP_CONFIRMED}"]
        side_effects:
          - "CASCADE-A link2 (caused by this booking transition): the booking's CeremonyScript, if status == APPROVED, transitions APPROVED->CHANGES_REQUESTED (new officiant must re-approve). That script transition itself fires link3."
      - from: BACKUP_CONFIRMED
        to: BACKUP_PENDING
        trigger: "system cascade from Officiant ACTIVE->SUSPENDED (backup officiant suspended)"
        actor: system
        preconditions: ["Booking.status == BACKUP_CONFIRMED"]
        side_effects:
          - "CASCADE-A link2 (caused by this booking transition): the booking's CeremonyScript, if status == APPROVED, transitions APPROVED->CHANGES_REQUESTED."
      - from: BACKUP_PENDING
        to: BACKUP_CONFIRMED
        trigger: "POST /bookings/{id}/assign-backup"
        actor: Coordinator
        preconditions:
          - "Booking.status == BACKUP_PENDING"
          - "backup_officiant_selection yields a non-empty candidate set (else ERR_NO_BACKUP_AVAILABLE)"
        side_effects:
          - "backup_officiant_id = selected officiant id"
          - "selected officiant.active_hold_count += 1; selected officiant.version += 1"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /bookings/{id}/complete"
        actor: Officiant
        preconditions:
          - "Booking.status IN {CONFIRMED, BACKUP_CONFIRMED}"
          - "clock_now >= Booking.ceremony_start"
        side_effects: []
      - from: BACKUP_CONFIRMED
        to: COMPLETED
        trigger: "POST /bookings/{id}/complete"
        actor: Officiant
        preconditions:
          - "Booking.status == BACKUP_CONFIRMED"
          - "clock_now >= Booking.ceremony_start"
        side_effects: []
      - from: HOLD
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: Couple
        preconditions: ["Booking.status == HOLD"]
        side_effects:
          - "cancel_initiator set from caller role (Couple->COUPLE, Coordinator->SERVICE)"
          - "CASCADE-B link1: the booking's DateHold, if status IN {HELD, CONFIRMED}, transitions to RELEASED (which fires link2)"
          - "no deposit captured yet -> refund_issued_cents = 0, forfeit_retained_cents = 0"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: [Couple, Coordinator]
        preconditions: ["Booking.status IN {CONFIRMED, BACKUP_PENDING, BACKUP_CONFIRMED}"]
        side_effects:
          - "cancel_initiator = COUPLE if caller is Couple else SERVICE"
          - "cancellation_settlement computes refund_issued_cents and forfeit_retained_cents (dual variant)"
          - "Couple.refund_credit_cents += refund_issued_cents"
          - "Officiant.escrow_balance_cents -= (deposit_captured_cents - forfeit_retained_cents) [i.e. escrow drops by the refunded deposit portion; forfeit stays as earned] (deposit_escrow_invariant compensation)"
          - "CASCADE-B link1: the booking's DateHold, if status IN {HELD, CONFIRMED}, transitions to RELEASED (which fires link2)"
          - "direct fan-out: the booking's Rehearsal, if status IN {SCHEDULED, CONFIRMED}, -> CANCELLED"
          - "direct fan-out: the booking's MarriageLicense, if status IN {NOT_FILED, FILED, SIGNED}, -> VOIDED"
      - from: BACKUP_PENDING
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: [Couple, Coordinator]
        preconditions: ["Booking.status == BACKUP_PENDING"]
        side_effects:
          - "cancel_initiator = SERVICE when reason == NO_BACKUP or caller is Coordinator else COUPLE"
          - "cancellation_settlement computes refund_issued_cents and forfeit_retained_cents"
          - "Couple.refund_credit_cents += refund_issued_cents"
          - "CASCADE-B link1: DateHold -> RELEASED (fires link2)"

  # ---- DateHold ----
  - entity: DateHold
    initial_state: HELD
    terminal_states: [RELEASED, EXPIRED]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "system, on Booking HOLD->CONFIRMED"
        actor: system
        preconditions: ["DateHold.status == HELD"]
        side_effects: []
      - from: HELD
        to: RELEASED
        trigger: "system cascade from Booking cancel (CASCADE-B link1)"
        actor: system
        preconditions: ["DateHold.status == HELD"]
        side_effects:
          - "CASCADE-B link2 (caused by this hold transition): Officiant.active_hold_count -= 1; increments Officiant.version by 1 (hold_slot_invariant compensation)"
      - from: CONFIRMED
        to: RELEASED
        trigger: "system cascade from Booking cancel (CASCADE-B link1)"
        actor: system
        preconditions: ["DateHold.status == CONFIRMED"]
        side_effects:
          - "CASCADE-B link2 (caused by this hold transition): Officiant.active_hold_count -= 1; increments Officiant.version by 1 (hold_slot_invariant compensation)"
      - from: HELD
        to: EXPIRED
        trigger: "POST /_expiry/run (clock_now >= expires_at)"
        actor: system
        preconditions: ["DateHold.status == HELD", "clock_now >= DateHold.expires_at"]
        side_effects:
          - "Officiant.active_hold_count -= 1; increments Officiant.version by 1 (hold_slot_invariant compensation)"
          - "the booking, if status == HOLD, transitions HOLD->EXPIRED"

  # ---- CeremonyScript (revision loop) ----
  - entity: CeremonyScript
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /ceremony-scripts/{id}/submit"
        actor: Couple
        preconditions: ["CeremonyScript.status == DRAFT"]
        side_effects: []
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /ceremony-scripts/{id}/submit"
        actor: Couple
        preconditions: ["CeremonyScript.status == CHANGES_REQUESTED"]
        side_effects: ["revision_count += 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /ceremony-scripts/{id}/decision (decision=APPROVE)"
        actor: Officiant
        preconditions: ["CeremonyScript.status == SUBMITTED"]
        side_effects: ["officiant_notes = notes"]
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /ceremony-scripts/{id}/decision (decision=REQUEST_CHANGES)"
        actor: Officiant
        preconditions: ["CeremonyScript.status == SUBMITTED"]
        side_effects: ["officiant_notes = notes"]
      - from: APPROVED
        to: CHANGES_REQUESTED
        trigger: "system cascade from Booking CONFIRMED->BACKUP_PENDING (CASCADE-A link2)"
        actor: system
        preconditions: ["CeremonyScript.status == APPROVED"]
        side_effects:
          - "CASCADE-A link3 (caused by this script transition): the booking's Rehearsal, if status == CONFIRMED, reverts CONFIRMED->SCHEDULED (timeline unlocked pending re-approval by the new officiant)"

  # ---- Rehearsal (guarded on script; revertible) ----
  - entity: Rehearsal
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /rehearsals/{id}/transition (to_state=CONFIRMED)"
        actor: Officiant
        preconditions:
          - "Rehearsal.status == SCHEDULED"
          - "The booking's CeremonyScript.status == APPROVED (ERR_SCRIPT_NOT_APPROVED) [cross-entity dep: Rehearsal<-CeremonyScript]"
        side_effects: []
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /rehearsals/{id}/transition (to_state=COMPLETED)"
        actor: Officiant
        preconditions: ["Rehearsal.status == CONFIRMED"]
        side_effects: []
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /rehearsals/{id}/transition (to_state=NO_SHOW)"
        actor: Officiant
        preconditions: ["Rehearsal.status == CONFIRMED"]
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /rehearsals/{id}/transition (to_state=CANCELLED)"
        actor: [Couple, Coordinator]
        preconditions: ["Rehearsal.status == SCHEDULED"]
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /rehearsals/{id}/transition (to_state=CANCELLED)"
        actor: [Couple, Coordinator]
        preconditions: ["Rehearsal.status == CONFIRMED"]
        side_effects: []
      - from: CONFIRMED
        to: SCHEDULED
        trigger: "system cascade from CeremonyScript APPROVED->CHANGES_REQUESTED (CASCADE-A link3)"
        actor: system
        preconditions: ["Rehearsal.status == CONFIRMED"]
        side_effects: []

  # ---- MarriageLicense (compliance; refile cycle) ----
  - entity: MarriageLicense
    initial_state: NOT_FILED
    terminal_states: [RECORDED, VOIDED, EXPIRED]
    transitions:
      - from: NOT_FILED
        to: FILED
        trigger: "POST /marriage-licenses/{id}/transition (to_state=FILED)"
        actor: Couple
        preconditions:
          - "MarriageLicense.status == NOT_FILED"
          - "Booking(license.booking_id).status IN {CONFIRMED, BACKUP_CONFIRMED} (ERR_BOOKING_NOT_CONFIRMED) [cross-entity dep: License<-Booking]"
          - "license.jurisdiction == Venue(booking.venue_id).jurisdiction (ERR_LICENSE_JURISDICTION_MISMATCH)"
        side_effects: []
      - from: FILED
        to: SIGNED
        trigger: "POST /marriage-licenses/{id}/transition (to_state=SIGNED)"
        actor: Officiant
        preconditions:
          - "MarriageLicense.status == FILED"
          - "clock_now <= license.expiry_date (ERR_LICENSE_EXPIRED)"
        side_effects:
          - "signed_at = clock_now"
          - "return_deadline = signed_at + LICENSE_RETURN_WINDOW_DAYS (license_return_compliance)"
      - from: SIGNED
        to: RECORDED
        trigger: "POST /marriage-licenses/{id}/transition (to_state=RECORDED)"
        actor: Coordinator
        preconditions:
          - "MarriageLicense.status == SIGNED"
          - "clock_now <= return_deadline (ERR_LICENSE_RETURN_OVERDUE)"
        side_effects: ["recorded_at = clock_now"]
      - from: SIGNED
        to: REJECTED
        trigger: "POST /marriage-licenses/{id}/transition (to_state=REJECTED)"
        actor: Coordinator
        preconditions: ["MarriageLicense.status == SIGNED"]
        side_effects: []
      - from: REJECTED
        to: FILED
        trigger: "POST /marriage-licenses/{id}/transition (to_state=FILED)"
        actor: Couple
        preconditions:
          - "MarriageLicense.status == REJECTED"
          - "Booking(license.booking_id).status IN {CONFIRMED, BACKUP_CONFIRMED}"
        side_effects: ["signed_at = null; return_deadline = null"]
      - from: FILED
        to: EXPIRED
        trigger: "POST /_expiry/run (clock_now >= expiry_date)"
        actor: system
        preconditions: ["MarriageLicense.status == FILED", "clock_now >= license.expiry_date"]
        side_effects: []
      - from: NOT_FILED
        to: VOIDED
        trigger: "system cascade from Booking cancel"
        actor: system
        preconditions: ["MarriageLicense.status IN {NOT_FILED, FILED, SIGNED}"]
        side_effects: []
      - from: FILED
        to: VOIDED
        trigger: "system cascade from Booking cancel"
        actor: system
        preconditions: ["MarriageLicense.status == FILED"]
        side_effects: []
      - from: SIGNED
        to: VOIDED
        trigger: "system cascade from Booking cancel"
        actor: system
        preconditions: ["MarriageLicense.status == SIGNED"]
        side_effects: []

  # ---- Review (moderation) ----
  - entity: Review
    initial_state: SUBMITTED
    terminal_states: [REMOVED]
    transitions:
      - from: SUBMITTED
        to: PUBLISHED
        trigger: "POST /reviews/{id}/moderate (decision=PUBLISH)"
        actor: Coordinator
        preconditions: ["Review.status == SUBMITTED"]
        side_effects:
          - "recompute Officiant(review.officiant_id).displayed_rating, internal_rating, published_review_count (officiant_reputation)"
      - from: SUBMITTED
        to: REMOVED
        trigger: "POST /reviews/{id}/moderate (decision=REMOVE)"
        actor: Coordinator
        preconditions: ["Review.status == SUBMITTED"]
        side_effects:
          - "recompute Officiant(review.officiant_id).displayed_rating, internal_rating, published_review_count"
      - from: PUBLISHED
        to: REMOVED
        trigger: "POST /reviews/{id}/moderate (decision=REMOVE)"
        actor: Coordinator
        preconditions: ["Review.status == PUBLISHED"]
        side_effects:
          - "recompute Officiant(review.officiant_id).displayed_rating, internal_rating, published_review_count"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC only)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: date-hold-stale-officiant
    parent_entity: Officiant
    write_endpoint: "POST /date-holds"
    occ_field: "expected_officiant_version"
    description: |
      Placing a DateHold against an Officiant whose version has advanced since
      the client last observed it is rejected. Another hold placement (or a
      release/expiry cascade) has already mutated the officiant's active_hold_count
      and bumped its version, so the current writer's view of the officiant is
      stale. Because the two holds may reserve non-overlapping dates, the second
      placement would otherwise legitimately succeed — only the stale version
      distinguishes it — so this is a genuine CREATE-with-supersede case resolved
      by OCC on the parent version, not a state precondition.
    error_id: ERR_STALE_OFFICIANT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: booking_price_quote
    trigger: "POST /bookings"
    algorithm: tiered_pricing
    input_set: "the booking's package.base_price_cents, travel_distance_km, days_until_ceremony (from clock), required_style, addon_codes"
    formula: |
      # MODE (a): >=3 inputs, non-linear (tiered selection + conditional branches)
      base       = package.base_price_cents
      travel     = TRAVEL_TIER_CENTS by travel_distance_km bucket:
                     0    <= d <= 25   -> 0
                     26   <= d <= 75   -> 15000
                     76   <= d <= 150  -> 30000
                     d    >  150       -> 45000
      days_until = floor((ceremony_start - clock_now) / 86400s)   # captured as days_until_ceremony_at_quote
      rush       = RUSH_FEE_CENTS if days_until < RUSH_THRESHOLD_DAYS else 0   # STRICT '<'
      interfaith = INTERFAITH_SURCHARGE_CENTS if required_style == 'INTERFAITH' else 0
      addons     = sum(ADDON_PRICE_CENTS[c] for c in addon_codes)
      quoted_travel_cents     = travel
      quoted_rush_cents       = rush
      quoted_interfaith_cents = interfaith
      quoted_addons_cents     = addons
      quoted_subtotal_cents   = base + travel + rush + interfaith + addons
    constants:
      TRAVEL_TIER_CENTS: { "0-25": 0, "26-75": 15000, "76-150": 30000, "151+": 45000 }
      RUSH_THRESHOLD_DAYS: 30
      RUSH_FEE_CENTS: 25000
      INTERFAITH_SURCHARGE_CENTS: 20000
      ADDON_PRICE_CENTS: { UNITY_CANDLE: 5000, HANDFASTING: 8000, LIVESTREAM: 12000, SAND_CEREMONY: 4000, PREMIUM_SCRIPT: 5025, BILINGUAL_CEREMONY: 8025 }
    precision: "integer cents; no rounding in this stage (all line items are integers)"

  - name: gratuity_split
    trigger: "POST /bookings"
    algorithm: aggregation
    input_set: "the ordered line items produced by booking_price_quote: [base, travel, rush, interfaith] ++ [ADDON_PRICE_CENTS[c] for c in addon_codes]"
    formula: |
      # MODE (b): rounding order matters. PINNED = round per line item, then sum.
      line_items = [base, quoted_travel_cents, quoted_rush_cents, quoted_interfaith_cents]
                   ++ [ADDON_PRICE_CENTS[c] for c in addon_codes]
      quoted_gratuity_cents = sum( round_half_up(li * GRATUITY_RATE) for li in line_items )
      # FORBIDDEN alternative (NOT used): round_half_up(sum(line_items) * GRATUITY_RATE)
      # e.g. lines [200000,30000,0,0,5025,8025]: per-line=43750  vs  sum-then-round=43749
      quoted_total_cents = quoted_subtotal_cents + quoted_gratuity_cents
      deposit_due_cents  = round_half_up(quoted_total_cents * package.deposit_pct)
    constants:
      GRATUITY_RATE: 0.18
    precision: "round_half_up to integer cents, applied per line item BEFORE summation"

  - name: cancellation_settlement
    trigger: "POST /bookings/{id}/cancel (from CONFIRMED / BACKUP_PENDING / BACKUP_CONFIRMED)"
    algorithm: threshold
    input_set: "booking.deposit_captured_cents, booking.quoted_subtotal_cents, days_until_ceremony at cancel time (from clock), cancel_initiator"
    formula: |
      # DUAL VARIANT #1 — same booking, two valid settlement algorithms, different results.
      days_left = floor((ceremony_start - clock_now) / 86400s)   # recomputed at cancel time
    constants:
      TIER_GTE_90_PCT: 1.0
      TIER_30_89_PCT: 0.5
      TIER_LT_30_PCT: 0.0
      GOODWILL_PCT: 0.10
    precision: "round_half_up to integer cents"
    variants:
      - name: couple_initiated
        when: "cancel_initiator == COUPLE"
        difference: |
          refund_pct = 1.0 if days_left >= 90 else (0.5 if days_left >= 30 else 0.0)
          refund_issued_cents   = round_half_up(deposit_captured_cents * refund_pct)
          forfeit_retained_cents = deposit_captured_cents - refund_issued_cents
          INVARIANT: deposit_captured_cents == refund_issued_cents + forfeit_retained_cents
      - name: service_initiated
        when: "cancel_initiator == SERVICE (coordinator cancel or NO_BACKUP)"
        difference: |
          goodwill = round_half_up(quoted_subtotal_cents * GOODWILL_PCT)
          refund_issued_cents   = deposit_captured_cents + goodwill   # full deposit + goodwill credit
          forfeit_retained_cents = 0

  - name: officiant_reputation
    trigger: "POST /reviews/{id}/moderate; POST /reviews (recompute on any review status change)"
    algorithm: aggregation
    input_set: "Reviews whose officiant_id == officiant.id, filtered by status per variant"
    formula: |
      # DUAL VARIANT #2 — same review population, two status filters, different means.
      published = [r.rating for r in Reviews if r.officiant_id==officiant.id and r.status=='PUBLISHED']
      internal  = [r.rating for r in Reviews if r.officiant_id==officiant.id and r.status IN {'SUBMITTED','PUBLISHED'}]
      published_review_count = len(published)
    precision: "mean rounded to 2 decimal places, round_half_up; null when the set is empty"
    variants:
      - name: displayed
        when: "public-facing reputation shown on the officiant profile"
        difference: "displayed_rating = round(mean(published),2) if published else null  (PUBLISHED only)"
      - name: internal
        when: "operations/moderation view"
        difference: "internal_rating = round(mean(internal),2) if internal else null  (SUBMITTED + PUBLISHED)"

  - name: backup_officiant_selection
    trigger: "POST /bookings/{id}/assign-backup"
    algorithm: weighted_scoring
    input_set: "all Officiants other than booking.officiant_id"
    formula: |
      # SELECTOR POLICY (pinned: eligibility / ranking / tie-break / empty fallback)
      eligibility (candidate must satisfy ALL):
        - status == ACTIVE
        - booking.required_style IN styles
        - certified for Venue(booking.venue_id).jurisdiction
        - active_hold_count < max_active_holds
        - no date_hold_ceremony_overlap against booking.[ceremony_start,ceremony_end] on the candidate
      ranking (over entity fields, deterministic):
        - primary:  displayed_rating DESC, with null treated as -1 (unrated sort last)
        - tie-break: created_at ASC   # NEVER id
      fallback: empty candidate set -> ERR_NO_BACKUP_AVAILABLE (booking stays BACKUP_PENDING)
    precision: "n/a"

  - name: date_hold_ceremony_overlap
    trigger: "POST /date-holds; backup_officiant_selection eligibility"
    algorithm: interval_merge
    input_set: "existing DateHolds on the same officiant with status IN {HELD, CONFIRMED}"
    formula: |
      # OVERLAP #1 — resource = Officiant. CLOSED intervals with a symmetric travel buffer.
      buffer = officiant.travel_buffer_minutes * 60 seconds
      candidate window = [ceremony_start - buffer, ceremony_end + buffer]   # CLOSED both ends
      existing window  = [h.hold_start - buffer, h.hold_end + buffer]       # CLOSED both ends
      CONFLICT iff candidate.start <= existing.end AND existing.start <= candidate.end
      (touching endpoints DO collide because intervals are closed and buffered)
      on conflict: reject with ERR_OFFICIANT_DOUBLE_BOOKED
    precision: "second resolution"

  - name: rehearsal_venue_overlap
    trigger: "POST /rehearsals"
    algorithm: interval_merge
    input_set: "existing Rehearsals at the same venue with status IN {SCHEDULED, CONFIRMED}"
    formula: |
      # OVERLAP #2 — resource = Venue. HALF-OPEN [start, end) intervals, NO buffer, adjacency ALLOWED.
      candidate window = [rehearsal_start, rehearsal_end)
      existing window  = [r.rehearsal_start, r.rehearsal_end)
      CONFLICT iff candidate.start < existing.end AND existing.start < candidate.end   # STRICT '<'
      (back-to-back rehearsals where one ends exactly when the next begins do NOT collide)
      on conflict: reject with ERR_VENUE_UNAVAILABLE
    precision: "second resolution"

  - name: hold_slot_invariant
    trigger: "invariant maintained across POST /date-holds and its compensations (cancel/expire)"
    algorithm: aggregation
    input_set: "DateHolds where officiant_id == officiant.id and status IN {HELD, CONFIRMED}"
    formula: |
      # RULE 9 INVARIANT #2 — conserved quantity: HOLD-SLOT COUNT (not money).
      officiant.active_hold_count == count(DateHold where officiant_id==officiant.id and status IN {HELD,CONFIRMED})
      Forward (place hold): active_hold_count += 1.
      Compensation (cancel->RELEASED or expiry->EXPIRED): active_hold_count -= 1.
      Therefore placing then releasing a hold returns active_hold_count to its pre-hold value (no drift).
    precision: "integer count"

  - name: deposit_escrow_invariant
    trigger: "invariant maintained across POST /bookings/{id}/confirm and POST /bookings/{id}/cancel"
    algorithm: aggregation
    input_set: "a single booking's deposit fields"
    formula: |
      # RULE 9 INVARIANT #1 — conserved quantity: DEPOSIT MONEY (cents).
      For a couple-initiated cancel of a CONFIRMED booking:
        deposit_captured_cents == refund_issued_cents + forfeit_retained_cents   (no cents lost or created)
      Officiant.escrow_balance_cents net change over confirm+cancel == forfeit_retained_cents
        (the retained portion stays as earned; the refunded portion leaves escrow).
    precision: "integer cents"

  - name: license_return_compliance
    trigger: "MarriageLicense FILED->SIGNED sets deadline; SIGNED->RECORDED checks it"
    algorithm: threshold
    input_set: "license.signed_at, clock_now"
    formula: |
      return_deadline = signed_at + LICENSE_RETURN_WINDOW_DAYS (10 days)
      RECORD allowed iff clock_now <= return_deadline (inclusive); else ERR_LICENSE_RETURN_OVERDUE.
    constants:
      LICENSE_RETURN_WINDOW_DAYS: 10
    precision: "second resolution; boundary is INCLUSIVE ('<=')"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "acting role is permitted for the operation per §1.7 RBAC (includes entity_backed ownership: acting Couple/Officiant must own the target resource)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "path-referenced and body-FK-referenced resources exist, validated left-to-right (officiant, couple, package, venue, booking, hold, script, rehearsal, license, review)"
    error_id: "ERR_<RESOURCE>_NOT_FOUND (per resource: ERR_OFFICIANT_NOT_FOUND, ERR_COUPLE_NOT_FOUND, ERR_PACKAGE_NOT_FOUND, ERR_VENUE_NOT_FOUND, ERR_BOOKING_NOT_FOUND, ERR_HOLD_NOT_FOUND, ERR_SCRIPT_NOT_FOUND, ERR_REHEARSAL_NOT_FOUND, ERR_LICENSE_NOT_FOUND, ERR_REVIEW_NOT_FOUND)"
    http_status: 404
    applies_to: "all endpoints with path/body ids"

  - priority: 4
    category: business_constraint
    check: "request body shape: required fields present, enums in range, rating in 1..5, ceremony_end>ceremony_start, expiry_date>issued_date"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all mutating endpoints"

  - priority: 5
    category: state
    check: "target resource is in a valid from-state for the requested transition (generic). NOTE: confirm and date-hold placement have dedicated state gates at priorities 6 and 7 and are NOT covered by this generic rule, so their specific errors win."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /officiants/{id}/transition, POST /ceremony-scripts/{id}/submit, POST /ceremony-scripts/{id}/decision, POST /rehearsals/{id}/transition, POST /marriage-licenses/{id}/transition, POST /reviews/{id}/moderate, POST /bookings/{id}/cancel, POST /bookings/{id}/assign-backup, POST /bookings/{id}/complete"

  - priority: 6
    category: state
    check: "confirm requires booking.status == HOLD (dedicated confirm state gate; outranks the fiscal deposit check on the same request; confirm is excluded from the priority-5 generic gate)"
    error_id: ERR_BOOKING_NOT_HOLD
    http_status: 409
    applies_to: "POST /bookings/{id}/confirm"

  - priority: 7
    category: state
    check: "date-hold placement requires booking.status == INQUIRY (dedicated place-hold state gate; date-holds is excluded from the priority-5 generic gate)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /date-holds"

  - priority: 8
    category: business_referential
    check: "cross-entity state gates: license FILE requires booking CONFIRMED/BACKUP_CONFIRMED; rehearsal CONFIRM requires script APPROVED; review requires booking COMPLETED"
    error_id: "ERR_BOOKING_NOT_CONFIRMED / ERR_SCRIPT_NOT_APPROVED / ERR_REVIEW_NOT_ALLOWED"
    http_status: 409
    applies_to: "POST /marriage-licenses/{id}/transition, POST /rehearsals/{id}/transition, POST /reviews"

  - priority: 9
    category: state
    check: "officiant availability gate: booking place-hold and confirm require the assigned officiant.status == ACTIVE"
    error_id: ERR_OFFICIANT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /date-holds, POST /bookings/{id}/confirm"

  - priority: 10
    category: business_safety
    check: "officiant certified for the venue's jurisdiction (solemnization legality)"
    error_id: ERR_OFFICIANT_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /date-holds"

  - priority: 11
    category: business_safety
    check: "required_style is offered by the officiant (styles membership)"
    error_id: ERR_STYLE_MISMATCH
    http_status: 422
    applies_to: "POST /date-holds"

  - priority: 12
    category: business_safety
    check: "license jurisdiction equals booking venue jurisdiction"
    error_id: ERR_LICENSE_JURISDICTION_MISMATCH
    http_status: 422
    applies_to: "POST /marriage-licenses/{id}/transition (to_state=FILED)"

  - priority: 13
    category: business_temporal
    check: "date hold not expired at confirm time (clock_now < DateHold.expires_at)"
    error_id: ERR_HOLD_EXPIRED
    http_status: 409
    applies_to: "POST /bookings/{id}/confirm"

  - priority: 14
    category: business_temporal
    check: "license SIGN only while valid (clock_now <= expiry_date)"
    error_id: ERR_LICENSE_EXPIRED
    http_status: 409
    applies_to: "POST /marriage-licenses/{id}/transition (to_state=SIGNED)"

  - priority: 15
    category: business_temporal
    check: "license RECORD only within return window (clock_now <= return_deadline, inclusive)"
    error_id: ERR_LICENSE_RETURN_OVERDUE
    http_status: 409
    applies_to: "POST /marriage-licenses/{id}/transition (to_state=RECORDED)"

  - priority: 16
    category: business_referential
    check: "OCC: expected_officiant_version equals current Officiant.version"
    error_id: ERR_STALE_OFFICIANT_VERSION
    http_status: 412
    applies_to: "POST /date-holds"

  - priority: 17
    category: business_constraint
    check: "officiant date double-booking (closed+buffer interval overlap on the officiant)"
    error_id: ERR_OFFICIANT_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /date-holds"

  - priority: 18
    category: business_constraint
    check: "venue rehearsal conflict (half-open, no-buffer interval overlap at the venue)"
    error_id: ERR_VENUE_UNAVAILABLE
    http_status: 409
    applies_to: "POST /rehearsals"

  - priority: 19
    category: business_constraint
    check: "officiant hold capacity (active_hold_count < max_active_holds)"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /date-holds"

  - priority: 20
    category: business_constraint
    check: "backup selection candidate pool non-empty"
    error_id: ERR_NO_BACKUP_AVAILABLE
    http_status: 409
    applies_to: "POST /bookings/{id}/assign-backup"

  - priority: 21
    category: business_fiscal
    check: "deposit_amount_cents >= deposit_due_cents"
    error_id: ERR_DEPOSIT_INSUFFICIENT
    http_status: 402
    applies_to: "POST /bookings/{id}/confirm"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Officiant ----
  - method: POST
    path: "/officiants"
    description: "Register an officiant (starts PENDING_REVIEW)"
    roles: [Coordinator]
    code: 201
    input: [full_name, email, styles, denomination, certified_jurisdictions, "travel_buffer_minutes?", "max_active_holds?"]
    output: Officiant
    side_effects: ["status=PENDING_REVIEW; active_hold_count=0; escrow_balance_cents=0; displayed_rating=null; internal_rating=null; published_review_count=0"]

  - method: GET
    path: "/officiants/{id}"
    description: "Fetch one officiant (includes computed reputation fields)"
    roles: [Coordinator, Couple, Officiant]
    code: 200
    input: []
    output: Officiant
    side_effects: []

  - method: GET
    path: "/officiants"
    description: "Browse the officiant roster; filter by style/denomination/jurisdiction/status"
    roles: [Coordinator, Couple, Officiant]
    code: 200
    input: ["style?", "denomination?", "jurisdiction?", "status?", "limit?", "offset?"]
    output: Officiant[]
    side_effects: []

  - method: POST
    path: "/officiants/{id}/transition"
    description: "Move officiant status (approve PENDING_REVIEW->ACTIVE; suspend ACTIVE->SUSPENDED; reinstate SUSPENDED->ACTIVE)"
    roles: [Coordinator]
    code: 200
    input: [to_state]
    output: Officiant
    side_effects: ["on SUSPENDED: CASCADE-A (Booking->CeremonyScript->Rehearsal); may bump many entities"]

  # ---- Couple ----
  - method: POST
    path: "/couples"
    description: "Create a couple intake record"
    roles: [Coordinator, Couple]
    code: 201
    input: [partner_one_name, partner_two_name, email, phone]
    output: Couple
    side_effects: ["paid_total_cents=0; refund_credit_cents=0"]

  - method: GET
    path: "/couples/{id}"
    description: "Fetch one couple (includes paid_total_cents / refund_credit_cents)"
    roles: [Coordinator, Couple]
    code: 200
    input: []
    output: Couple
    side_effects: []

  # ---- Package ----
  - method: POST
    path: "/packages"
    description: "Create a package/pricing tier"
    roles: [Coordinator]
    code: 201
    input: [name, tier, base_price_cents, deposit_pct]
    output: Package
    side_effects: []

  # ---- Venue ----
  - method: POST
    path: "/venues"
    description: "Create a venue"
    roles: [Coordinator]
    code: 201
    input: [name, jurisdiction, address]
    output: Venue
    side_effects: []

  # ---- Booking ----
  - method: POST
    path: "/bookings"
    description: "Create a booking (INQUIRY); computes the full price quote and deposit_due"
    roles: [Coordinator, Couple]
    code: 201
    input: [officiant_id, couple_id, package_id, venue_id, ceremony_start, ceremony_end, travel_distance_km, required_style, "addon_codes?"]
    output: Booking
    side_effects:
      - "status=INQUIRY"
      - "booking_price_quote -> quoted_* fields, days_until_ceremony_at_quote"
      - "gratuity_split -> quoted_gratuity_cents, quoted_total_cents, deposit_due_cents"

  - method: GET
    path: "/bookings/{id}"
    description: "Fetch one booking"
    roles: [Coordinator, Couple, Officiant]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: GET
    path: "/bookings"
    description: "List bookings; filter by any FK or status (reverse-reachability for officiant_id, backup_officiant_id, couple_id, package_id, venue_id)"
    roles: [Coordinator, Couple, Officiant]
    code: 200
    input: ["officiant_id?", "backup_officiant_id?", "couple_id?", "package_id?", "venue_id?", "status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []

  - method: POST
    path: "/bookings/{id}/confirm"
    description: "Pay the deposit and confirm the booking (HOLD->CONFIRMED)"
    roles: [Couple]
    code: 200
    input: [deposit_amount_cents]
    output: Booking
    side_effects:
      - "deposit_captured_cents=deposit_due_cents; Couple.paid_total_cents += ; Officiant.escrow_balance_cents += "
      - "DateHold HELD->CONFIRMED"

  - method: POST
    path: "/bookings/{id}/cancel"
    description: "Cancel a booking; runs cancellation_settlement and CASCADE-B"
    roles: [Couple, Coordinator]
    code: 200
    input: [cancel_reason]
    output: Booking
    side_effects:
      - "cancel_initiator set from role; cancellation_settlement -> refund_issued_cents, forfeit_retained_cents"
      - "Couple.refund_credit_cents += refund_issued_cents; Officiant.escrow_balance_cents adjusted"
      - "CASCADE-B: DateHold->RELEASED->(Officiant.active_hold_count--, version++); Rehearsal->CANCELLED; MarriageLicense->VOIDED"

  - method: POST
    path: "/bookings/{id}/assign-backup"
    description: "Assign a backup officiant via backup_officiant_selection (BACKUP_PENDING->BACKUP_CONFIRMED)"
    roles: [Coordinator]
    code: 200
    input: []
    output: Booking
    side_effects: ["backup_officiant_id set; selected officiant active_hold_count++/version++; else ERR_NO_BACKUP_AVAILABLE"]

  - method: POST
    path: "/bookings/{id}/complete"
    description: "Mark the ceremony performed (CONFIRMED/BACKUP_CONFIRMED->COMPLETED)"
    roles: [Officiant]
    code: 200
    input: []
    output: Booking
    side_effects: []

  # ---- DateHold ----
  - method: POST
    path: "/date-holds"
    description: "Place a date hold on the booking's officiant (INQUIRY->HOLD). OCC on Officiant.version; overlap #1 and capacity checks."
    roles: [Couple, Coordinator]
    code: 201
    input: [booking_id, expected_officiant_version]
    output: DateHold
    side_effects:
      - "DateHold created HELD; officiant_id/hold_start/hold_end/expires_at set"
      - "Booking INQUIRY->HOLD"
      - "Officiant.active_hold_count += 1; increments Officiant.version by 1"

  - method: GET
    path: "/date-holds/{id}"
    description: "Fetch one date hold"
    roles: [Coordinator, Couple, Officiant]
    code: 200
    input: []
    output: DateHold
    side_effects: []

  - method: GET
    path: "/date-holds"
    description: "List date holds; filter by officiant_id / booking_id (reverse-reachability)"
    roles: [Coordinator, Couple, Officiant]
    code: 200
    input: ["officiant_id?", "booking_id?", "status?", "limit?", "offset?"]
    output: DateHold[]
    side_effects: []

  # ---- CeremonyScript ----
  - method: POST
    path: "/ceremony-scripts"
    description: "Create a ceremony script draft for a booking"
    roles: [Couple]
    code: 201
    input: [booking_id, opening_remarks, vow_format, "readings?", "ritual_elements?", closing_blessing]
    output: CeremonyScript
    side_effects: ["status=DRAFT; revision_count=0"]

  - method: GET
    path: "/ceremony-scripts/{id}"
    description: "Fetch one ceremony script"
    roles: [Coordinator, Couple, Officiant]
    code: 200
    input: []
    output: CeremonyScript
    side_effects: []

  - method: GET
    path: "/ceremony-scripts"
    description: "List ceremony scripts; filter by booking_id (reverse-reachability)"
    roles: [Coordinator, Couple, Officiant]
    code: 200
    input: ["booking_id?", "status?", "limit?", "offset?"]
    output: CeremonyScript[]
    side_effects: []

  - method: PATCH
    path: "/ceremony-scripts/{id}"
    description: "Edit script content (only in DRAFT or CHANGES_REQUESTED)"
    roles: [Couple]
    code: 200
    input: ["opening_remarks?", "vow_format?", "readings?", "ritual_elements?", "closing_blessing?"]
    output: CeremonyScript
    side_effects: []

  - method: POST
    path: "/ceremony-scripts/{id}/submit"
    description: "Submit script for officiant review (DRAFT|CHANGES_REQUESTED->SUBMITTED)"
    roles: [Couple]
    code: 200
    input: []
    output: CeremonyScript
    side_effects: ["from CHANGES_REQUESTED: revision_count += 1"]

  - method: POST
    path: "/ceremony-scripts/{id}/decision"
    description: "Officiant decision on a submitted script (APPROVE->APPROVED; REQUEST_CHANGES->CHANGES_REQUESTED)"
    roles: [Officiant]
    code: 200
    input: [decision, "notes?"]
    output: CeremonyScript
    side_effects: ["officiant_notes = notes"]

  # ---- Rehearsal ----
  - method: POST
    path: "/rehearsals"
    description: "Schedule a rehearsal at a venue (SCHEDULED). Overlap #2 checked per venue."
    roles: [Couple]
    code: 201
    input: [booking_id, venue_id, rehearsal_start, rehearsal_end]
    output: Rehearsal
    side_effects: ["status=SCHEDULED"]

  - method: GET
    path: "/rehearsals/{id}"
    description: "Fetch one rehearsal"
    roles: [Coordinator, Couple, Officiant]
    code: 200
    input: []
    output: Rehearsal
    side_effects: []

  - method: GET
    path: "/rehearsals"
    description: "List rehearsals; filter by booking_id / venue_id (reverse-reachability)"
    roles: [Coordinator, Couple, Officiant]
    code: 200
    input: ["booking_id?", "venue_id?", "status?", "limit?", "offset?"]
    output: Rehearsal[]
    side_effects: []

  - method: POST
    path: "/rehearsals/{id}/transition"
    description: "Move rehearsal status (confirm[Officiant, requires script APPROVED]; complete/no_show[Officiant]; cancel[Couple/Coordinator])"
    roles: [Officiant, Couple, Coordinator]
    code: 200
    input: [to_state]
    output: Rehearsal
    side_effects: []

  # ---- MarriageLicense ----
  - method: POST
    path: "/marriage-licenses"
    description: "Create a marriage-license record for a booking (NOT_FILED)"
    roles: [Couple]
    code: 201
    input: [booking_id, jurisdiction, license_number, issued_date, expiry_date]
    output: MarriageLicense
    side_effects: ["status=NOT_FILED"]

  - method: GET
    path: "/marriage-licenses/{id}"
    description: "Fetch one license"
    roles: [Coordinator, Couple, Officiant]
    code: 200
    input: []
    output: MarriageLicense
    side_effects: []

  - method: GET
    path: "/marriage-licenses"
    description: "List licenses; filter by booking_id (reverse-reachability)"
    roles: [Coordinator, Couple, Officiant]
    code: 200
    input: ["booking_id?", "status?", "limit?", "offset?"]
    output: MarriageLicense[]
    side_effects: []

  - method: POST
    path: "/marriage-licenses/{id}/transition"
    description: "Compliance transition (FILE[Couple], SIGN[Officiant], RECORD/REJECT[Coordinator], refile FILE[Couple]); enforces jurisdiction/validity/return-window gates"
    roles: [Couple, Officiant, Coordinator]
    code: 200
    input: [to_state, "reason?"]
    output: MarriageLicense
    side_effects: ["SIGN: signed_at=clock_now, return_deadline=signed_at+10d; RECORD: recorded_at=clock_now"]

  # ---- Review ----
  - method: POST
    path: "/reviews"
    description: "Submit a review for a COMPLETED booking (SUBMITTED)"
    roles: [Couple]
    code: 201
    input: [booking_id, rating, text]
    output: Review
    side_effects: ["status=SUBMITTED; officiant_id copied from booking; recompute officiant internal_rating"]

  - method: GET
    path: "/reviews/{id}"
    description: "Fetch one review"
    roles: [Coordinator, Couple, Officiant]
    code: 200
    input: []
    output: Review
    side_effects: []

  - method: GET
    path: "/reviews"
    description: "List reviews; filter by officiant_id / booking_id (reverse-reachability)"
    roles: [Coordinator, Couple, Officiant]
    code: 200
    input: ["officiant_id?", "booking_id?", "status?", "limit?", "offset?"]
    output: Review[]
    side_effects: []

  - method: POST
    path: "/reviews/{id}/moderate"
    description: "Moderate a review (PUBLISH->PUBLISHED; REMOVE->REMOVED); recomputes officiant reputation"
    roles: [Coordinator]
    code: 200
    input: [decision]
    output: Review
    side_effects: ["recompute displayed_rating, internal_rating, published_review_count"]

  # ---- System / test-driving ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-03-01T00:00:00Z; before any set, the clock reads exactly this default (never wall-clock)."
    roles: [Coordinator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced/rewound to to_iso8601"]

  - method: POST
    path: "/_expiry/run"
    description: "Run the scheduled expiry sweep: HELD DateHolds past expires_at -> EXPIRED (booking HOLD->EXPIRED); FILED licenses past expiry_date -> EXPIRED"
    roles: [Coordinator]
    code: 200
    input: []
    output: null
    side_effects: ["date-hold and license expirations; officiant.active_hold_count/version adjusted per released holds"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Acting role lacks permission, or entity_backed actor is not the owner of the target resource"
  - id: ERR_VALIDATION
    http: 400
    condition: "Malformed body: missing required field, enum out of range, rating not in 1..5, ceremony_end<=ceremony_start, expiry_date<=issued_date"
  - id: ERR_OFFICIANT_NOT_FOUND
    http: 404
    condition: "Referenced officiant does not exist"
  - id: ERR_COUPLE_NOT_FOUND
    http: 404
    condition: "Referenced couple does not exist"
  - id: ERR_PACKAGE_NOT_FOUND
    http: 404
    condition: "Referenced package does not exist"
  - id: ERR_VENUE_NOT_FOUND
    http: 404
    condition: "Referenced venue does not exist"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "Referenced booking does not exist"
  - id: ERR_HOLD_NOT_FOUND
    http: 404
    condition: "Referenced date hold does not exist"
  - id: ERR_SCRIPT_NOT_FOUND
    http: 404
    condition: "Referenced ceremony script does not exist"
  - id: ERR_REHEARSAL_NOT_FOUND
    http: 404
    condition: "Referenced rehearsal does not exist"
  - id: ERR_LICENSE_NOT_FOUND
    http: 404
    condition: "Referenced marriage license does not exist"
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "Referenced review does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not valid from the resource's current state"
  - id: ERR_BOOKING_NOT_HOLD
    http: 409
    condition: "Confirm attempted on a booking whose status is not HOLD"
  - id: ERR_OFFICIANT_UNAVAILABLE
    http: 409
    condition: "Assigned officiant is not ACTIVE (place-hold/confirm blocked)"
  - id: ERR_STALE_OFFICIANT_VERSION
    http: 412
    condition: "expected_officiant_version does not match current Officiant.version (OCC)"
  - id: ERR_OFFICIANT_NOT_CERTIFIED
    http: 422
    condition: "Officiant not certified for the venue's jurisdiction"
  - id: ERR_STYLE_MISMATCH
    http: 422
    condition: "Booking required_style is not among the officiant's styles"
  - id: ERR_LICENSE_JURISDICTION_MISMATCH
    http: 422
    condition: "License jurisdiction differs from booking venue jurisdiction"
  - id: ERR_HOLD_EXPIRED
    http: 409
    condition: "Date hold has expired at confirm time (clock_now >= expires_at)"
  - id: ERR_LICENSE_EXPIRED
    http: 409
    condition: "License signed after its expiry_date (clock_now > expiry_date)"
  - id: ERR_LICENSE_RETURN_OVERDUE
    http: 409
    condition: "License recorded after return_deadline (clock_now > signed_at + 10d)"
  - id: ERR_OFFICIANT_DOUBLE_BOOKED
    http: 409
    condition: "Date-hold window (closed + travel buffer) overlaps an existing HELD/CONFIRMED hold on the officiant"
  - id: ERR_VENUE_UNAVAILABLE
    http: 409
    condition: "Rehearsal window (half-open, no buffer) overlaps an existing SCHEDULED/CONFIRMED rehearsal at the venue"
  - id: ERR_CAPACITY_EXCEEDED
    http: 409
    condition: "Officiant already at max_active_holds"
  - id: ERR_NO_BACKUP_AVAILABLE
    http: 409
    condition: "backup_officiant_selection candidate pool is empty"
  - id: ERR_SCRIPT_NOT_APPROVED
    http: 409
    condition: "Rehearsal confirm attempted while the booking's ceremony script is not APPROVED"
  - id: ERR_BOOKING_NOT_CONFIRMED
    http: 409
    condition: "License FILE attempted while the booking is not CONFIRMED/BACKUP_CONFIRMED"
  - id: ERR_REVIEW_NOT_ALLOWED
    http: 409
    condition: "Review submitted for a booking that is not COMPLETED"
  - id: ERR_DEPOSIT_INSUFFICIENT
    http: 402
    condition: "deposit_amount_cents is less than deposit_due_cents"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Coordinator
    description: "Platform operator: manages the roster, packages, venues; approves/suspends officiants; assigns backups; moderates reviews; records/rejects licenses; drives the logical clock and expiry sweep."
    identity: "opaque"
    exclusive_operations:
      - "POST /officiants (register)"
      - "POST /officiants/{id}/transition (approve/suspend/reinstate)"
      - "POST /packages"
      - "POST /venues"
      - "POST /bookings/{id}/assign-backup"
      - "POST /marriage-licenses/{id}/transition (to_state=RECORDED or REJECTED)"
      - "POST /reviews/{id}/moderate"
      - "POST /_clock/set_current_utc"
      - "POST /_expiry/run"
    shared_operations:
      - "POST /couples (with Couple)"
      - "POST /bookings (with Couple)"
      - "POST /date-holds (with Couple)"
      - "POST /bookings/{id}/cancel (with Couple)"
      - "POST /rehearsals/{id}/transition -> CANCELLED (with Couple)"
      - "GET endpoints (all)"

  - name: Couple
    description: "The client couple. Acts only on its own bookings and their children (entity_backed ownership on couple_id / the booking chain)."
    identity: "entity_backed:Couple"
    exclusive_operations:
      - "POST /bookings/{id}/confirm (pay deposit)"
      - "POST /ceremony-scripts (create) + PATCH + submit"
      - "POST /rehearsals (schedule)"
      - "POST /marriage-licenses (create) + transition (to_state=FILED, incl. refile)"
      - "POST /reviews (submit)"
    shared_operations:
      - "POST /couples (self-intake, with Coordinator)"
      - "POST /bookings (with Coordinator)"
      - "POST /date-holds (with Coordinator)"
      - "POST /bookings/{id}/cancel (with Coordinator)"
      - "POST /rehearsals/{id}/transition -> CANCELLED (with Coordinator)"
      - "GET endpoints (own resources)"

  - name: Officiant
    description: "The assigned (or backup) officiant. Reviews/approves scripts, confirms/completes rehearsals, signs licenses, performs the ceremony. Entity_backed on Officiant; acts only where officiant_id (or backup_officiant_id) matches."
    identity: "entity_backed:Officiant"
    exclusive_operations:
      - "POST /ceremony-scripts/{id}/decision (APPROVE / REQUEST_CHANGES)"
      - "POST /rehearsals/{id}/transition (to_state IN {CONFIRMED, COMPLETED, NO_SHOW})"
      - "POST /marriage-licenses/{id}/transition (to_state=SIGNED)"
      - "POST /bookings/{id}/complete"
    shared_operations:
      - "GET endpoints (own resources)"
