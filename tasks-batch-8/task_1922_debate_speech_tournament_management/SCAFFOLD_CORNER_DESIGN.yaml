            - { call: "POST /tournaments", payload: { name: "OC", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z" }, as: TournamentDirector, captures: { t: $.data.id } }
            - { call: "POST /logistics-orders", payload: { tournament_id: "${t}", kind: "CATERING" }, as: TournamentDirector }
          trigger:
            - { call: "POST /logistics-orders", payload: { tournament_id: "${t}", kind: "CATERING" }, as: TournamentDirector, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_ORDER_KIND_EXISTS (409)"]

      - name: fulfill_draft_order_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.LogisticsOrder.SUBMITTED_to_FULFILLED"]
        distinguishing_aspect: "Fulfill requires SUBMITTED: fulfilling a DRAFT order fails with ERR_ORDER_INVALID_STATE."
        test_recipe:
          setup: ["tournament with one DRAFT CATERING order"]
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "FD", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z" }, as: TournamentDirector, captures: { t: $.data.id } }
            - { call: "POST /logistics-orders", payload: { tournament_id: "${t}", kind: "CATERING" }, as: TournamentDirector, captures: { o1: $.data.id } }
          trigger:
            - { call: "POST /logistics-orders/${o1}/fulfill", as: TournamentDirector, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_ORDER_INVALID_STATE", "LogisticsOrder.${o1}.status == DRAFT"]

      - name: school_confirm_deficient_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.School.REGISTERED_to_CONFIRMED", "errors[ERR_SCHOOL_OBLIGATION_DEFICIENT]"]
        excluded_because:
          difficulty_instance: tournament_lock_gated_by_school_obligation
          rationale: "Asserted as the first trigger of the named difficulty instance (confirm with shortfall 4 -> ERR_SCHOOL_OBLIGATION_DEFICIENT)."

      - name: publish_before_completion_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Tournament.HIDDEN_to_PUBLISHED", "errors[ERR_TOURNAMENT_PHASE_FORBIDDEN]"]
        excluded_because:
          difficulty_instance: tournament_parallel_axes_independent_evolution
          rationale: "Asserted as the negative trigger of the named difficulty instance (publish from REGISTRATION_LOCKED -> ERR_TOURNAMENT_PHASE_FORBIDDEN)."
