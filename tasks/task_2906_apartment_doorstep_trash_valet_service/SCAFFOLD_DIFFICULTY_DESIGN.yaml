  - rule_id: non_linear_state_machine
    instances:

      - name: fine_dispute_cycle_reenters_disputed_twice_then_exhausts_round_budget
        grounds:
          - state_machines.ResidentFine.ASSESSED_to_DISPUTED
          - state_machines.ResidentFine.UPHELD_to_DISPUTED
          - state_machines.ResidentFine.DISPUTED_to_UPHELD
          - entities.ResidentFine.fields.dispute_round
          - validations[priority=24]
          - errors[ERR_DISPUTE_ROUNDS_EXHAUSTED]
        distinguishing_aspect: |
          CYCLIC shape: UPHELD is re-enterable input to the dispute loop, so the fine traverses
          ASSESSED -> DISPUTED -> UPHELD -> DISPUTED -> UPHELD and only the third dispute is
          rejected once dispute_round has reached MAX_DISPUTE_ROUNDS 2 — the loop is bounded by a
          counter, not by state.
