            - call: "POST /agreements"
              payload: { insured_id: "${cv_insured}", producer_agent_id: "${cv_agent_az}", state_rule_id: "${cv_az}", down_payment_cents: 100000, service_fee_cents: 2000, installment_count: 6, first_installment_due_date: "2026-10-01" }
