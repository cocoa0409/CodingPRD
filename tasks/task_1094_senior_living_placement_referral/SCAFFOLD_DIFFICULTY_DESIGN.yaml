        grounds:
          - state_machines.CaseloadAssignment.ACTIVE_to_REASSIGNED
          - state_machines.Inquiry.ASSIGNED_to_ASSIGNED
          - entities.Advisor.fields.active_caseload_count
          - calculations.advisor_load_index
        distinguishing_aspect: |
          CONSERVED QUANTITY = HEADCOUNT, a different type from money, pinned as
          sum(Advisor.active_caseload_count over all advisors) == count(CaseloadAssignment with
          status ACTIVE). Reassignment is a forward action (new ACTIVE row on Ben) paired with its
          compensating action (Ann's row -> REASSIGNED); the per-advisor counts move 1 -> 0 and
          0 -> 1 while the global total stays exactly 1 and the load indices follow.
