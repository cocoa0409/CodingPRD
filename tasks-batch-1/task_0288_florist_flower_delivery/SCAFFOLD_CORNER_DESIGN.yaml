        claim_type: Conditional validation
        grounds: ["validations[priority=8]", entities.HolidayWindow.fields.surge_cutoff_hour_utc]
        distinguishing_aspect: "For a same-day order whose delivery_date falls in a window, the effective cutoff is the window's surge_cutoff_hour_utc (20), so a quote at clock hour 16 (past zone cutoff 14 but before 20) SUCCEEDS where it would otherwise fail."
