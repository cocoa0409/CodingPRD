            - {call: "POST /protests", payload: {transfer_application_id: "${app}", protestant_claimant_id: "${cl_b}", claimed_injury_af: 78.00, basis: INJURY_TO_SENIOR_RIGHT}, as: Claimant, as_user_id: "${cl_b}", captures: {pr: "$.data.id"}}
