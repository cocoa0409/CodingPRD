              as: CDESponsor
              as_user_id: "${cde_id}"
              captures: { qlici_2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: CertifyingAgency
          trigger:
            - call: "POST /nmtc/qalicbs/${qalicb_id}/eligibility-tests"
              payload: { gross_income_lic_pct: 48.00, services_lic_pct: 65.00, tangible_property_lic_pct: 88.00, collectibles_pct: 6.00, nonqualified_financial_property_pct: 1.00, location_prong_passed: true }
              as: ComplianceReviewer
              as_user_id: "reviewer-eligibility"
              captures: { fail_test_id: $.data.id }
          assert:
            - "HOP 1 — QALICB.${qalicb_id}.eligibility_status == FAILED and consecutive_failed_test_count == 1 and eligibility_status != DISQUALIFIED"
            - "HOP 2 — QLICI.${qlici_1_id}.status == NON_QUALIFYING and non_qualifying_since_at == \"2026-10-01T00:00:00.000Z\""
            - "HOP 2 — QLICI.${qlici_2_id}.status == NON_QUALIFYING and non_qualifying_since_at == \"2026-10-01T00:00:00.000Z\""
            - "HOP 3 — QEI.${qei_1_id}.substantially_all_pct_direct == 0.00, compliance_status == AT_RISK, cure_deadline_at == \"2027-03-30T00:00:00.000Z\""
            - "HOP 3 — QEI.${qei_2_id}.substantially_all_pct_direct == 0.00, compliance_status == AT_RISK, cure_deadline_at == \"2027-03-30T00:00:00.000Z\""
            - "HOP 4 — AllocationAward.${award_id}.at_risk_qei_count == 2 and compliance_posture == RESTRICTED"
            - "AllocationAward.${award_id}.recaptured_qei_count == 0 and lifecycle_status == ACTIVE"
            - "AllocationAward.${award_id}.severe_distress_share_pct == 0.00 (no qualifying outstanding principal remains)"
            - "CommunityBenefitsAgreement.${cba_id}.status == ACTIVE (a single FAIL is not a DISQUALIFICATION, so the agreement is untouched)"
            - "QEI.${qei_1_id}.uninvested_cash_cents == 10000000 (a status cascade never moves cash)"

      - name: annual_test_failure_cascades_qei_recapture_to_award_freeze_to_blocked_deployment
        grounds:
