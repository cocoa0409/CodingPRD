            - "LaunchContract.${ct_id}.rebookings_remaining == 1 (right NOT consumed)"
            - "LaunchContract.${ct_id}.rebook_eligible == false (flag cleared by use)"
            - "LaunchContract.${ct_id}.target_mission_id == ${m2_id} and status == SIGNED"

