            - { call: "POST /plant/jobs/${job}/confirm", as: PlantManager, captures: { job_v2: $.data.version } }
            - { call: "POST /plant/jig-setups", payload: { setup_code: "JIG-ROOF-A", component_type_supported: "ROOF_TRUSS", plate_class: "P20", changeover_minutes_from: {} }, as: PlantManager, captures: { jig_roof: $.data.id } }
            - { call: "POST /plant/jobs/${job}/designs", payload: { component_ref: "TR-01", component_type: "ROOF_TRUSS", span_ft: 32.0, pitch_degrees: 26.57, design_load_psf: 40.0, lumber_grade: "SPF_MSR2400", plating: "P20", quantity_required: 10, expected_job_version: "${job_v2}" }, as: DesignEngineer, as_user_id: "${eng1}", captures: { dsg1: $.data.id } }
            - { call: "POST /plant/designs/${dsg1}/transition", payload: { to_state: "SEAL_REQUESTED" }, as: DesignEngineer, as_user_id: "${eng1}" }
            - { call: "POST /plant/designs/${dsg1}/transition", payload: { to_state: "SEALED" }, as: DesignEngineer, as_user_id: "${eng2}" }
            - { call: "POST /plant/designs/${dsg1}/cut-lists", payload: { jig_setup_id: "${jig_roof}", lines: [ { member_label: "TC-1", dimension: "L2X6", length_ft: 12.0, qty: 10 } ] }, as: ProductionPlanner, captures: { cl1: $.data.id } }
            - { call: "GET /plant/cut-list-lines", payload: { cut_list_id: "${cl1}" }, as: ProductionPlanner, captures: { line1: $.data.0.id } }
            - { call: "POST /plant/inventory-lots", payload: { lot_kind: "LUMBER", lumber_dimension: "L2X6", lumber_grade: "SPF_MSR2400", received_board_feet: 500.0 }, as: InventoryManager, captures: { lot6: $.data.id, lot6_v: $.data.version } }
          trigger:
            - { call: "POST /plant/material-reservations", payload: { lot_id: "${lot6}", cut_list_line_id: "${line1}", reserved_bf: 126.00, expected_lot_version: "${lot6_v}" }, as: ProductionPlanner, captures: { r1: $.data.id } }
            - { call: "POST /plant/material-reservations", payload: { lot_id: "${lot6}", cut_list_line_id: "${line1}", reserved_bf: 10.0, expected_lot_version: "${lot6_v}" }, as: ProductionPlanner, captures: { err: $.data.error_id } }
            - { call: "GET /plant/inventory-lots/${lot6}", as: InventoryManager, captures: { lv: $.data.version, lav: $.data.available_bf } }
          assert:
            - "first reserve created ${r1}; lot version advanced 1 -> 2 (write bumps version)"
            - "second reserve with stale ${lot6_v} (== 1) rejected: ${err} == ERR_STALE_LOT_VERSION with HTTP 412"
            - "${lv} == 2 and ${lav} == 374.00 (rejected write left no trace)"

      - name: occ_design_revision_stale_job_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[design-revision-stale-job]"]
        distinguishing_aspect: "Job read at version 1, confirm advances it to 2; a design create carrying expected_job_version 1 is rejected 412 — create-with-supersede-intent demands a fresh job view."
        test_recipe:
          setup: ["customer; job created (version captured pre-confirm)"]
          setup_api_calls:
            - { call: "POST /plant/customer-accounts", payload: { company_name: "Acme", credit_limit_cents: 500000, delivery_terms: "DELIVERED" }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /plant/engineers", payload: { full_name: "E1", license_number: "PE-1", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_AND_PANEL" }, as: PlantManager, captures: { eng1: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", job_name: "OCC2 Job", jobsite_address: "37 Nowhere", jobsite_state: "GA", delivery_window_start: "2026-08-20T00:00:00Z", delivery_window_end: "2026-08-27T00:00:00Z", contracted_value_cents: 100000 }, as: PlantManager, captures: { job: $.data.id, job_v: $.data.version } }
            - { call: "POST /plant/jobs/${job}/confirm", as: PlantManager, captures: { job_v2: $.data.version } }
          trigger:
            - { call: "POST /plant/jobs/${job}/designs", payload: { component_ref: "TR-01", component_type: "ROOF_TRUSS", span_ft: 30.0, pitch_degrees: 22.62, design_load_psf: 40.0, lumber_grade: "SYP_NO1", plating: "P18", quantity_required: 4, expected_job_version: "${job_v}" }, as: DesignEngineer, as_user_id: "${eng1}", captures: { err: $.data.error_id } }
            - { call: "POST /plant/jobs/${job}/designs", payload: { component_ref: "TR-01", component_type: "ROOF_TRUSS", span_ft: 30.0, pitch_degrees: 22.62, design_load_psf: 40.0, lumber_grade: "SYP_NO1", plating: "P18", quantity_required: 4, expected_job_version: "${job_v2}" }, as: DesignEngineer, as_user_id: "${eng1}", captures: { dsg: $.data.id } }
          assert:
            - "confirm bumped Job.version 1 -> 2 (${job_v2} == 2)"
            - "stale create rejected: ${err} == ERR_STALE_JOB_VERSION with HTTP 412"
            - "fresh create succeeds: ComponentDesign.${dsg} DRAFT, revision_no 1"

      - name: occ_crane_slot_stale_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[crane-slot-stale-crane]"]
        distinguishing_aspect: "Second, non-overlapping slot booking carrying the crane's pre-first-booking version is rejected 412 even though the interval is free — staleness, not overlap."
        test_recipe:
          setup: ["crane CR-C at version 1"]
          setup_api_calls:
            - { call: "POST /plant/cranes", payload: { crane_code: "CR-C", capacity_lbs: 8000, crane_class: "STANDARD", hourly_rate_cents: 15000 }, as: PlantManager, captures: { cr: $.data.id, cr_v: $.data.version } }
          trigger:
            - { call: "POST /plant/crane-slots", payload: { crane_id: "${cr}", purpose: "BUILD_PICK", start_at: "2026-08-12T10:00:00Z", end_at: "2026-08-12T12:00:00Z", expected_crane_version: "${cr_v}" }, as: ProductionPlanner, captures: { s1: $.data.id } }
            - { call: "POST /plant/crane-slots", payload: { crane_id: "${cr}", purpose: "BUILD_PICK", start_at: "2026-08-13T10:00:00Z", end_at: "2026-08-13T12:00:00Z", expected_crane_version: "${cr_v}" }, as: ProductionPlanner, captures: { err: $.data.error_id } }
          assert:
            - "slot ${s1} created (crane -> version 2)"
            - "second booking with stale ${cr_v} (== 1) rejected: ${err} == ERR_STALE_CRANE_VERSION with HTTP 412 (interval was free; OCC is the sole cause)"

      - name: occ_change_order_stale_job_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[change-order-stale-job]"]
        distinguishing_aspect: "Two sequential change-order creates against the same sealed design: the second carries the job version captured before the first create and is rejected 412."
        test_recipe:
          setup: ["job CONFIRMED with SEALED design dsg; job version 3 captured"]
          setup_api_calls:
            - { call: "POST /plant/customer-accounts", payload: { company_name: "Acme", credit_limit_cents: 500000, delivery_terms: "DELIVERED" }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /plant/engineers", payload: { full_name: "E1", license_number: "PE-1", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_AND_PANEL" }, as: PlantManager, captures: { eng1: $.data.id } }
            - { call: "POST /plant/engineers", payload: { full_name: "E2", license_number: "PE-2", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_AND_PANEL" }, as: PlantManager, captures: { eng2: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", job_name: "OCC3 Job", jobsite_address: "38 Nowhere", jobsite_state: "GA", delivery_window_start: "2026-08-20T00:00:00Z", delivery_window_end: "2026-08-27T00:00:00Z", contracted_value_cents: 100000 }, as: PlantManager, captures: { job: $.data.id, job_v: $.data.version } }
            - { call: "POST /plant/jobs/${job}/confirm", as: PlantManager, captures: { job_v2: $.data.version } }
            - { call: "POST /plant/jobs/${job}/designs", payload: { component_ref: "TR-01", component_type: "ROOF_TRUSS", span_ft: 30.0, pitch_degrees: 22.62, design_load_psf: 40.0, lumber_grade: "SYP_NO1", plating: "P18", quantity_required: 4, expected_job_version: "${job_v2}" }, as: DesignEngineer, as_user_id: "${eng1}", captures: { dsg: $.data.id } }
            - { call: "POST /plant/designs/${dsg}/transition", payload: { to_state: "SEAL_REQUESTED" }, as: DesignEngineer, as_user_id: "${eng1}" }
            - { call: "POST /plant/designs/${dsg}/transition", payload: { to_state: "SEALED" }, as: DesignEngineer, as_user_id: "${eng2}" }
            - { call: "GET /plant/jobs/${job}", as: PlantManager, captures: { job_v3: $.data.version } }
          trigger:
            - { call: "POST /plant/jobs/${job}/change-orders", payload: { supersedes_design_id: "${dsg}", reason: "first", expected_job_version: "${job_v3}" }, as: ProductionPlanner, captures: { co1: $.data.id } }
            - { call: "POST /plant/jobs/${job}/change-orders", payload: { supersedes_design_id: "${dsg}", reason: "second", expected_job_version: "${job_v3}" }, as: ProductionPlanner, captures: { err: $.data.error_id } }
          assert:
            - "first change order ${co1} created (Job.version advanced 3 -> 4)"
            - "second create with stale ${job_v3} rejected: ${err} == ERR_STALE_JOB_VERSION with HTTP 412"

      - name: cascading_side_effects_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: ["state_machines.DesignChangeOrder.APPROVED_to_APPLIED"]
        excluded_because:
          difficulty_instance: "transitive_cascade / change_order_apply_cascade"
          rationale: "Six-hop cascade verified hop-by-hop in the named §1.8 instance."

      - name: rate_threshold_triggers_covered_by_difficulty
        claim_type: rate_threshold_triggers
        grounds: ["calculations.storage_fee_accrual", "calculations.line_lumber_requirement"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / storage_fee_free_day_boundary"
          rationale: "Storage free-day threshold and waste length tiers asserted at exact boundaries in §1.8 (storage_fee_free_day_boundary, waste_tier_length_grade_interaction)."

