            - { call: "POST /piano-works/craftsmen", payload: { name: "Sea Master", specialty: SEASONING_CHECK }, as: WorkshopManager, captures: { cr_sea: $.data.id } }
            - { call: "POST /piano-works/build-orders", payload: { model: MODEL_B, wood_batch_id: "${wb1}" }, as: WorkshopManager, captures: { b_id: $.data.id, bv: $.data.version } }
