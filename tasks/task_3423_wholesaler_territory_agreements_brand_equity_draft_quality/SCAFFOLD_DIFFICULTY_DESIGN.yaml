              as: BrewerAdmin
            - call: "POST /retail-accounts"
              payload: { name: "Prio Bar", state_code: "TX", serving_wholesaler_id: "${wp_id}" }
              as: BrewerAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /pos-grants"
              payload: { account_id: "${ap_id}", item_description: "neon sign", value_cents: 9900 }
              as: BrewerAdmin
            - call: "POST /pos-grants"
              payload: { account_id: "${ap_id}", item_description: "tap handles", value_cents: 9900 }
              as: BrewerAdmin
            - call: "POST /pos-grants"
              payload: { account_id: "${ap_id}", item_description: "menu boards", value_cents: 9900 }
              as: BrewerAdmin
            - call: "POST /draft-audits"
              payload: { account_id: "${ap_id}", conducted_at: "2026-09-01T00:00:00Z", line_cleaning_last_at: "2026-08-25T00:00:00Z", kegs: [{ brand_code: "BUD", filled_at: "2026-05-03T00:00:00Z", volume_bbl: 15 }] }
