          max_minor_per_adult: 4
          vendor_frontage_rate_cents: 900
          vendor_multi_day_discount_pct: 0.1
          vendor_min_fee_cents: 5000
          vendor_late_insurance_surcharge_cents: 2500
          vendor_insurance_deadline_at: '2026-07-01T00:00:00Z'
        as: EventOrganizer
        captures:
          ev_id: $.data.id
          ev_v: $.data.version
      trigger:
      - call: PATCH /events/${ev_id}
        payload:
          expected_event_version: ${ev_v}
          max_minor_per_adult: 3
        as: EventOrganizer
        captures:
          v2: $.data.version
      - call: PATCH /events/${ev_id}
        payload:
          expected_event_version: ${ev_v}
          max_minor_per_adult: 2
        as: EventOrganizer
        captures:
          err: $.data.error_id
      assert:
      - 'first PATCH succeeds: version becomes 2 and max_minor_per_adult == 3'
      - second PATCH with the stale ${ev_v} is rejected 412 ERR_STALE_VERSION; max_minor_per_adult remains 3
  - name: occ_agreement_create_stale_version_rejected
    claim_type: occ_stale_version
