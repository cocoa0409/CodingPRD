      - name: empty_collection_boundary_on_cancelled_case_reversal
        grounds:
          - calculations.procedure_schedule_conflict
          - calculations.utilization_banding
          - entities.ProcedureCase.fields.case_status
          - endpoints.POST_/api/procedure-cases/{caseId}/cancel
        distinguishing_aspect: "An empty-collection boundary rather than a numeric one: with every sibling case CANCELLED the candidate's conflict set is empty, so a case may be booked into the exact slot the cancelled case vacated — but if the buffer's half-open arithmetic is read as closed, that same empty set is treated as a one-minute overlap and the booking is wrongly rejected."
