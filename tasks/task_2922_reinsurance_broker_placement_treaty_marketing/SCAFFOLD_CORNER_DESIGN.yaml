  - section: rbac
    instances:
      - name: each_of_the_seven_roles_exercises_its_own_exclusive_operations
        claim_type: exclusive_operations
        grounds:
          - roles.PlatformAdmin.exclusive_operations
          - roles.BrokerPlacementLead.exclusive_operations
          - roles.BrokerActuary.exclusive_operations
          - roles.BrokerAccountant.exclusive_operations
          - roles.ComplianceOfficer.exclusive_operations
          - roles.CedentUnderwriter.exclusive_operations
          - roles.ReinsurerUnderwriter.exclusive_operations
        distinguishing_aspect: |
          A single placement, from empty database to a reversed remittance and a resolved claim
          dispute, driven by seven different actors none of whom can do the next actor's step. The
          claim is positive coverage: every role's own exclusive operations must actually succeed
          for the correct role, which is the half of an RBAC matrix that a permissive
          implementation passes by accident and a paranoid one fails. It also pins the handoffs the
          matrix implies but never states: the actuary rejects before the cedent may revise, the
          accountant discloses before the cedent may decide, the broker files agreed wording before
          the accountant may settle a remittance, and compliance reverses what the accountant
          settled.
