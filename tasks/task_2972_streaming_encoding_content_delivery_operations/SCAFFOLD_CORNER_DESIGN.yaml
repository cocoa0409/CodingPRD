        distinguishing_aspect: "The PATCH arm of the capacity guard compares the new committed_gbps against the vendor's live reserved_gbps: 39.99 against a 40.00 hold is ERR_VENDOR_CAPACITY_EXCEEDED and leaves version untouched, while exactly 40.00 is accepted and bumps version to 2."
        test_recipe:
