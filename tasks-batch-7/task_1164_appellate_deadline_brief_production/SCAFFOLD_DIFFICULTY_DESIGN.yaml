# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN — §1.8 Test Targeting Index
# Nine Difficulty Rules × ≥2 instances each = ≥18 instances total.
# Every instance grounds into SCAFFOLD.yaml §1.1–§1.7.
# =============================================================================
scaffold_difficulty_design:
  # -------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # -------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: notice_of_appeal_provisional_vs_final_after_tolling
        grounds:
          - calculations.notice_of_appeal_deadline
          - calculations.deadline_tolling_delta
          - entities.Deadline.fields.provisional_due_at
          - entities.Deadline.fields.final_due_at
        distinguishing_aspect: |
          The NOTICE_OF_APPEAL deadline has two variants (provisional vs final)
          computed on the Deadline entity domain. Provisional uses only the
          judgment event date + court appeal_deadline_days. Final adds the
          tolling delta between POST_JUDGMENT_MOTION_FILED and POST_JUDGMENT_
          MOTION_DECIDED. Same judgment date produces different provisional vs
          final deadline once tolling lands.
        test_recipe:
          setup:
            - "Court CA9 with jurisdiction_type=FEDERAL, appeal_deadline_days=30, weekend_holiday_rollforward=false"
            - "Attorney A admitted to CA9"
            - "Case C in CA9 with judgment_entered_at=2026-06-01T12:00:00Z"
            - "Initial Deadline (NOTICE_OF_APPEAL) created with provisional=2026-07-01T12:00:00Z"
            - "Two AppealEvents: motion filed 2026-06-05T00:00:00Z; motion decided 2026-06-25T00:00:00Z (toll delta = 20 days)"
          setup_api_calls:
            - call: "POST /appellate/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CourtAdmin
            - call: "POST /appellate/courts"
              payload: { code: "CA9", name: "Ninth Circuit", jurisdiction_type: "FEDERAL", appeal_deadline_days: 30, reply_brief_window_days: 14, uses_word_count: true, max_words_opening: 14000, max_pages_opening: 0, max_words_reply: 7000, max_pages_reply: 0, efiling_required: true, weekend_holiday_rollforward: false }
              as: CourtAdmin
              captures: { court_ca9_id: $.data.id }
            - call: "POST /appellate/attorneys"
              payload: { bar_number: "BAR-001", full_name: "Alice Attorney", email: "alice@x.com", admitted_court_ids: ["${court_ca9_id}"] }
              as: CourtAdmin
              captures: { attorney_a_id: $.data.id }
            - call: "POST /appellate/cases"
              payload: { court_id: "${court_ca9_id}", docket_number: "26-1001", caption: "Smith v. Jones", lead_attorney_id: "${attorney_a_id}", appellant_side: "APPELLANT", judgment_entered_at: "2026-06-01T12:00:00Z" }
              as: Attorney
              as_user_id: "${attorney_a_id}"
              captures: { case_id: $.data.id }
            - call: "POST /appellate/cases/${case_id}/events"
              payload: { event_type: "POST_JUDGMENT_MOTION_FILED", occurred_at: "2026-06-05T00:00:00Z" }
              as: Attorney
              as_user_id: "${attorney_a_id}"
            - call: "GET /appellate/cases/${case_id}/deadlines"
              payload: {}
              as: Attorney
              as_user_id: "${attorney_a_id}"
              captures: { noa_provisional: "$.data[0].provisional_due_at", noa_final_pre_toll: "$.data[0].final_due_at" }
          trigger:
            - call: "POST /appellate/cases/${case_id}/events"
              payload: { event_type: "POST_JUDGMENT_MOTION_DECIDED", occurred_at: "2026-06-25T00:00:00Z" }
              as: Attorney
              as_user_id: "${attorney_a_id}"
            - call: "GET /appellate/cases/${case_id}/deadlines"
              payload: {}
              as: Attorney
              as_user_id: "${attorney_a_id}"
              captures: { noa_provisional_after: "$.data[0].provisional_due_at", noa_final_after: "$.data[0].final_due_at", noa_tolled_after: "$.data[0].tolled" }
          assert:
            - "Deadline.provisional_due_at == '2026-07-01T12:00:00Z' both before and after tolling event"
            - "Deadline.final_due_at before tolling == provisional == '2026-07-01T12:00:00Z'"
            - "Deadline.final_due_at after tolling == '2026-07-21T12:00:00Z' (provisional + 20 days)"
            - "Deadline.tolled after decision == false"
            - "provisional_due_at != final_due_at after tolling"

      - name: brief_limit_word_vs_page_variant_same_input
        grounds:
          - calculations.brief_limit_check
          - entities.Brief.fields.over_limit
          - entities.Court.fields.uses_word_count
        distinguishing_aspect: |
          brief_limit_check has two variants on the Brief entity domain (distinct
          from Deadline). Word-count court compares word_count to max_words_*;
          page-count court compares page_count to max_pages_*. The SAME
          page_count=50, word_count=15000 brief is over-limit in a page-limit
          court (max_pages=40) but within-limit in a word-count court
          (max_words=16000) — identical input, different verdict per variant.
        test_recipe:
          setup:
            - "Court PAGE-CT with uses_word_count=false, max_pages_opening=40, max_pages_reply=20"
            - "Court WORD-CT with uses_word_count=true, max_words_opening=16000, max_words_reply=8000"
            - "Two attorneys admitted to both courts"
            - "Two cases, one in each court; each has an active briefing schedule and a complete record"
            - "A DRAFT brief in each case with page_count=50, word_count=15000"
          setup_api_calls:
            - call: "POST /appellate/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CourtAdmin
            - call: "POST /appellate/courts"
              payload: { code: "PAGE-CT", name: "Page Court", jurisdiction_type: "STATE", appeal_deadline_days: 60, reply_brief_window_days: 21, uses_word_count: false, max_words_opening: 0, max_pages_opening: 40, max_words_reply: 0, max_pages_reply: 20, efiling_required: false, weekend_holiday_rollforward: false }
              as: CourtAdmin
              captures: { court_page_id: $.data.id }
            - call: "POST /appellate/courts"
              payload: { code: "WORD-CT", name: "Word Court", jurisdiction_type: "STATE", appeal_deadline_days: 60, reply_brief_window_days: 21, uses_word_count: true, max_words_opening: 16000, max_pages_opening: 0, max_words_reply: 8000, max_pages_reply: 0, efiling_required: false, weekend_holiday_rollforward: false }
              as: CourtAdmin
              captures: { court_word_id: $.data.id }
            - call: "POST /appellate/attorneys"
              payload: { bar_number: "BAR-P1", full_name: "Pam Page", email: "pam@x.com", admitted_court_ids: ["${court_page_id}", "${court_word_id}"] }
              as: CourtAdmin
              captures: { attorney_p_id: $.data.id }
            - call: "POST /appellate/cases"
              payload: { court_id: "${court_page_id}", docket_number: "P-1", caption: "Page Case", lead_attorney_id: "${attorney_p_id}", appellant_side: "APPELLANT", judgment_entered_at: "2026-05-02T00:00:00Z" }
              as: Attorney
              as_user_id: "${attorney_p_id}"
              captures: { case_page_id: $.data.id }
            - call: "POST /appellate/cases"
              payload: { court_id: "${court_word_id}", docket_number: "W-1", caption: "Word Case", lead_attorney_id: "${attorney_p_id}", appellant_side: "APPELLANT", judgment_entered_at: "2026-05-02T00:00:00Z" }
              as: Attorney
              as_user_id: "${attorney_p_id}"
              captures: { case_word_id: $.data.id }
            # Drive both cases to BRIEFING via notice of appeal → record complete.
            - call: "POST /appellate/cases/${case_page_id}/filings"
              payload: { filing_type: "NOTICE_OF_APPEAL", method: "EFILE", served_party_emails: ["opp@x.com"] }
              as: Attorney
              as_user_id: "${attorney_p_id}"
              captures: { filing_page_id: $.data.id }
            - call: "POST /appellate/filings/${filing_page_id}/accept"
              payload: {}
              as: CourtClerk
            - call: "POST /appellate/cases/${case_word_id}/filings"
              payload: { filing_type: "NOTICE_OF_APPEAL", method: "EFILE", served_party_emails: ["opp@x.com"] }
              as: Attorney
              as_user_id: "${attorney_p_id}"
              captures: { filing_word_id: $.data.id }
            - call: "POST /appellate/filings/${filing_word_id}/accept"
              payload: {}
              as: CourtClerk
            - call: "GET /appellate/cases/${case_page_id}/record"
              payload: {}
              as: Attorney
              as_user_id: "${attorney_p_id}"
              captures: { record_page_id: "$.data[0].id" }
            - call: "GET /appellate/cases/${case_word_id}/record"
              payload: {}
              as: Attorney
              as_user_id: "${attorney_p_id}"
              captures: { record_word_id: "$.data[0].id" }
            - call: "POST /appellate/records/${record_page_id}/designate"
              payload: {}
              as: Attorney
              as_user_id: "${attorney_p_id}"
            - call: "POST /appellate/records/${record_page_id}/transcript-orders"
              payload: { hearing_date: "2026-04-01T10:00:00Z", court_reporter: "Reporter R", estimated_pages: 100 }
              as: Attorney
              as_user_id: "${attorney_p_id}"
              captures: { to_page_id: $.data.id }
            - call: "POST /appellate/transcript-orders/${to_page_id}/begin-preparation"
              payload: {}
              as: CourtClerk
            - call: "POST /appellate/transcript-orders/${to_page_id}/deliver"
              payload: { actual_pages: 100 }
              as: CourtClerk
            - call: "POST /appellate/records/${record_word_id}/designate"
              payload: {}
              as: Attorney
              as_user_id: "${attorney_p_id}"
            - call: "POST /appellate/records/${record_word_id}/transcript-orders"
              payload: { hearing_date: "2026-04-01T10:00:00Z", court_reporter: "Reporter R", estimated_pages: 100 }
              as: Attorney
              as_user_id: "${attorney_p_id}"
              captures: { to_word_id: $.data.id }
            - call: "POST /appellate/transcript-orders/${to_word_id}/begin-preparation"
              payload: {}
              as: CourtClerk
            - call: "POST /appellate/transcript-orders/${to_word_id}/deliver"
              payload: { actual_pages: 100 }
              as: CourtClerk
            - call: "GET /appellate/cases/${case_page_id}/briefing-schedule"
              payload: {}
              as: Attorney
              as_user_id: "${attorney_p_id}"
              captures: { sched_page_id: "$.data[0].id" }
            - call: "GET /appellate/cases/${case_word_id}/briefing-schedule"
              payload: {}
              as: Attorney
              as_user_id: "${attorney_p_id}"
              captures: { sched_word_id: "$.data[0].id" }
          trigger:
            - call: "POST /appellate/cases/${case_page_id}/briefs"
              payload: { schedule_id: "${sched_page_id}", brief_type: "OPENING", author_attorney_id: "${attorney_p_id}", page_count: 50, word_count: 15000 }
              as: Attorney
              as_user_id: "${attorney_p_id}"
              captures: { brief_page_id: $.data.id, brief_page_over: $.data.over_limit }
            - call: "POST /appellate/cases/${case_word_id}/briefs"
              payload: { schedule_id: "${sched_word_id}", brief_type: "OPENING", author_attorney_id: "${attorney_p_id}", page_count: 50, word_count: 15000 }
              as: Attorney
              as_user_id: "${attorney_p_id}"
              captures: { brief_word_id: $.data.id, brief_word_over: $.data.over_limit }
          assert:
            - "Brief.${brief_page_id}.over_limit == true   (page-court: 50 > 40)"
            - "Brief.${brief_word_id}.over_limit == false  (word-court: 15000 <= 16000)"
            - "Identical (page_count=50, word_count=15000) yields divergent verdicts in the two variants"

  # -------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes
  # -------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: briefing_schedule_multi_input_cascade
        grounds:
          - calculations.briefing_schedule_dates
          - calculations.extension_cascade_delta
        distinguishing_aspect: |
          Mode (a): briefing_schedule_dates has ≥3 inputs (anchor record.completed_at,
          court.opening_brief_days, court.response_brief_days, court.reply_brief_
          window_days) plus a nested cascade through granted motions. An OPENING
          extension of 7 days produces a 7-day shift on all three dates; a
          RESPONSE extension shifts only response+reply; a REPLY extension shifts
          only reply. Three inputs interact non-linearly through conditional
          cascade branches.
        test_recipe:
          setup:
            - "Court CA9 with reply_brief_window_days=14"
            - "Case with judgment 2026-06-01; record completed 2026-07-01T00:00:00Z"
            - "Schedule ACTIVE with opening=2026-08-10T00:00:00Z, response=2026-09-09T00:00:00Z, reply=2026-09-23T00:00:00Z (40+30+14 default days)"
          setup_api_calls:
            - call: "POST /appellate/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CourtAdmin
            - call: "POST /appellate/courts"
              payload: { code: "CA9", name: "Ninth Circuit", jurisdiction_type: "FEDERAL", appeal_deadline_days: 30, reply_brief_window_days: 14, uses_word_count: true, max_words_opening: 14000, max_pages_opening: 0, max_words_reply: 7000, max_pages_reply: 0, efiling_required: true, weekend_holiday_rollforward: false }
              as: CourtAdmin
              captures: { court_ca9_id: $.data.id }
            - call: "POST /appellate/attorneys"
              payload: { bar_number: "BAR-001", full_name: "Alice", email: "a@x.com", admitted_court_ids: ["${court_ca9_id}"] }
              as: CourtAdmin
              captures: { attorney_a_id: $.data.id }
            - call: "POST /appellate/cases"
              payload: { court_id: "${court_ca9_id}", docket_number: "26-M", caption: "Multi", lead_attorney_id: "${attorney_a_id}", appellant_side: "APPELLANT", judgment_entered_at: "2026-06-01T00:00:00Z" }
              as: Attorney
              as_user_id: "${attorney_a_id}"
              captures: { case_id: $.data.id }
            - call: "POST /appellate/cases/${case_id}/filings"
              payload: { filing_type: "NOTICE_OF_APPEAL", method: "EFILE", served_party_emails: ["o@x.com"] }
              as: Attorney
              as_user_id: "${attorney_a_id}"
              captures: { f_noaid: $.data.id }
            - call: "POST /appellate/filings/${f_noaid}/accept"
              payload: {}
              as: CourtClerk
            - call: "GET /appellate/cases/${case_id}/record"
              payload: {}
              as: Attorney
              as_user_id: "${attorney_a_id}"
              captures: { rec_id: "$.data[0].id" }
            - call: "POST /appellate/records/${rec_id}/designate"
              payload: {}
              as: Attorney
              as_user_id: "${attorney_a_id}"
            - call: "POST /appellate/records/${rec_id}/transcript-orders"
              payload: { hearing_date: "2026-05-15T10:00:00Z", court_reporter: "R", estimated_pages: 50 }
              as: Attorney
              as_user_id: "${attorney_a_id}"
              captures: { to_id: $.data.id }
            - call: "POST /appellate/transcript-orders/${to_id}/begin-preparation"
              payload: {}
              as: CourtClerk
            - call: "POST /appellate/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: CourtAdmin
            - call: "POST /appellate/transcript-orders/${to_id}/deliver"
              payload: { actual_pages: 50 }
              as: CourtClerk
            - call: "GET /appellate/cases/${case_id}/briefing-schedule"
              payload: {}
              as: Attorney
              as_user_id: "${attorney_a_id}"
              captures: { sched_id: "$.data[0].id", sched_v: "$.data[0].version", open_due: "$.data[0].opening_due_at", resp_due: "$.data[0].response_due_at", reply_due: "$.data[0].reply_due_at" }
            - call: "POST /appellate/cases/${case_id}/extension-motions"
              payload: { schedule_id: "${sched_id}", target: "OPENING", requested_days: 7, reason: "good cause" }
              as: Attorney
              as_user_id: "${attorney_a_id}"
              captures: { motion_id: $.data.id }
          trigger:
            - call: "POST /appellate/extension-motions/${motion_id}/grant"
              payload: { granted_days: 7, expected_schedule_version: "${sched_v}" }
              as: CourtClerk
            - call: "GET /appellate/briefing-schedules/${sched_id}"
              payload: {}
              as: Attorney
              as_user_id: "${attorney_a_id}"
              captures: { open_after: "$.data.opening_due_at", resp_after: "$.data.response_due_at", reply_after: "$.data.reply_due_at", ext_count: "$.data.extensions_granted_count" }
          assert:
            - "BriefingSchedule.opening_due_at after grant == '2026-08-17T00:00:00Z' (opening 2026-08-10 + 7 days)"
            - "BriefingSchedule.response_due_at after grant == '2026-09-16T00:00:00Z' (cascade)"
            - "BriefingSchedule.reply_due_at after grant == '2026-09-30T00:00:00Z' (cascade depth 3)"
            - "BriefingSchedule.extensions_granted_count == 1"

      - name: rehearing_window_jurisdiction_dependent_chronological
        grounds:
          - calculations.rehearing_deadline
        distinguishing_aspect: |
          Mode (c): rehearing_deadline is a chronological calculation with a
          circular-looking evaluation-order dependency. Decision.issued_at feeds
          BOTH rehearing_deadline_at AND cert_deadline_at AND mandate_at.
          Evaluation order MUST be pinned: rehearing window (14 or 30 days
          depending on jurisdiction_type) is computed BEFORE mandate_at, because
          mandate only issues after the rehearing window closes or any granted
          petition resolves. Jurisdiction type switches between two constant
          windows — same issued_at yields different deadline.
        test_recipe:
          setup:
            - "Court FED-CT with jurisdiction_type=FEDERAL"
            - "Court ST-CT with jurisdiction_type=STATE"
            - "Identical cases in each court, decisions issued at the same instant"
          setup_api_calls:
            - call: "POST /appellate/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CourtAdmin
            - call: "POST /appellate/courts"
              payload: { code: "FED-CT", name: "Federal", jurisdiction_type: "FEDERAL", appeal_deadline_days: 30, reply_brief_window_days: 14, uses_word_count: true, max_words_opening: 14000, max_pages_opening: 0, max_words_reply: 7000, max_pages_reply: 0, efiling_required: true, weekend_holiday_rollforward: false }
              as: CourtAdmin
              captures: { court_fed_id: $.data.id }
            - call: "POST /appellate/courts"
              payload: { code: "ST-CT", name: "State", jurisdiction_type: "STATE", appeal_deadline_days: 60, reply_brief_window_days: 21, uses_word_count: true, max_words_opening: 14000, max_pages_opening: 0, max_words_reply: 7000, max_pages_reply: 0, efiling_required: true, weekend_holiday_rollforward: false }
              as: CourtAdmin
              captures: { court_st_id: $.data.id }
            - call: "POST /appellate/attorneys"
              payload: { bar_number: "BAR-R", full_name: "Rhear", email: "r@x.com", admitted_court_ids: ["${court_fed_id}", "${court_st_id}"] }
              as: CourtAdmin
              captures: { attorney_r_id: $.data.id }
            - call: "POST /appellate/cases"
              payload: { court_id: "${court_fed_id}", docket_number: "F-1", caption: "Fed Case", lead_attorney_id: "${attorney_r_id}", appellant_side: "APPELLANT", judgment_entered_at: "2026-05-02T00:00:00Z" }
              as: Attorney
              as_user_id: "${attorney_r_id}"
              captures: { case_fed_id: $.data.id }
            - call: "POST /appellate/cases"
              payload: { court_id: "${court_st_id}", docket_number: "S-1", caption: "State Case", lead_attorney_id: "${attorney_r_id}", appellant_side: "APPELLANT", judgment_entered_at: "2026-05-02T00:00:00Z" }
              as: Attorney
              as_user_id: "${attorney_r_id}"
              captures: { case_st_id: $.data.id }
          trigger:
            - call: "POST /appellate/cases/${case_fed_id}/decisions"
              payload: { outcome: "AFFIRMED", issued_at: "2026-08-01T12:00:00Z" }
              as: CourtClerk
              captures: { dec_fed_id: $.data.id, dec_fed_reh: $.data.rehearing_deadline_at }
            - call: "POST /appellate/cases/${case_st_id}/decisions"
              payload: { outcome: "AFFIRMED", issued_at: "2026-08-01T12:00:00Z" }
              as: CourtClerk
              captures: { dec_st_id: $.data.id, dec_st_reh: $.data.rehearing_deadline_at }
          assert:
            - "Decision.${dec_fed_id}.rehearing_deadline_at == '2026-08-15T12:00:00Z'  (issued + 14 days, FEDERAL)"
            - "Decision.${dec_st_id}.rehearing_deadline_at == '2026-08-31T12:00:00Z'  (issued + 30 days, STATE)"
            - "Same issued_at yields divergent rehearing deadlines across jurisdiction variants"

  # -------------------------------------------------------------------------
  # Rule 3 — Non-linear state machines on different entities
  # -------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: brief_cyclic_review_loop
        grounds:
          - state_machines.Brief
          - state_machines.Brief.IN_REVIEW_to_DRAFT
          - state_machines.Brief.DRAFT_to_IN_REVIEW
        distinguishing_aspect: |
          Brief.state exhibits a cycle DRAFT → IN_REVIEW → DRAFT → IN_REVIEW →
          READY — the same entity can loop through the same pair of states
          multiple times before exiting the cycle. A purely linear pipeline
          would forbid this.
        test_recipe:
          setup:
            - "Case in BRIEFING posture with ACTIVE schedule and COMPLETE record"
            - "Brief B in DRAFT with word_count within limit"
            - "Two attorneys A1 (author) and A2 (reviewer), both admitted"
          setup_api_calls:
            - call: "POST /appellate/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CourtAdmin
            - call: "POST /appellate/courts"
              payload: { code: "CYC-CT", name: "Cycle Court", jurisdiction_type: "FEDERAL", appeal_deadline_days: 30, reply_brief_window_days: 14, uses_word_count: true, max_words_opening: 14000, max_pages_opening: 0, max_words_reply: 7000, max_pages_reply: 0, efiling_required: false, weekend_holiday_rollforward: false }
              as: CourtAdmin
              captures: { court_cyc_id: $.data.id }
            - call: "POST /appellate/attorneys"
              payload: { bar_number: "BAR-A1", full_name: "Author One", email: "a1@x.com", admitted_court_ids: ["${court_cyc_id}"] }
              as: CourtAdmin
              captures: { att_a1: $.data.id }
            - call: "POST /appellate/attorneys"
              payload: { bar_number: "BAR-A2", full_name: "Reviewer Two", email: "a2@x.com", admitted_court_ids: ["${court_cyc_id}"] }
              as: CourtAdmin
              captures: { att_a2: $.data.id }
            - call: "POST /appellate/cases"
              payload: { court_id: "${court_cyc_id}", docket_number: "C-1", caption: "Cycle", lead_attorney_id: "${attorney_a_id}", appellant_side: "APPELLANT", judgment_entered_at: "2026-05-02T00:00:00Z" }
              as: Attorney
              as_user_id: "${att_a1}"
              captures: { case_cyc_id: $.data.id }
            - call: "POST /appellate/cases/${case_cyc_id}/filings"
              payload: { filing_type: "NOTICE_OF_APPEAL", method: "EFILE", served_party_emails: ["o@x.com"] }
              as: Attorney
              as_user_id: "${att_a1}"
              captures: { f_cyc: $.data.id }
            - call: "POST /appellate/filings/${f_cyc}/accept"
              payload: {}
              as: CourtClerk
            - call: "GET /appellate/cases/${case_cyc_id}/record"
              payload: {}
              as: Attorney
