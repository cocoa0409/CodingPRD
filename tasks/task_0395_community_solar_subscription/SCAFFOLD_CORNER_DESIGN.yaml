# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Community Solar Subscription — breadth probe. Sections / claim_types come
# verbatim from references/claim-extraction-guide.md. Every grounds[] resolves
# into SCAFFOLD.yaml §1.1–§1.7. excluded_because stubs cite §1.8 instance names.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_project_returns_201_with_derived_ledger_defaults
        claim_type: Creation
        grounds:
          - endpoints.POST./projects
          - entities.SolarProject.fields.committed_kw
          - entities.SolarProject.fields.available_kw
          - entities.SolarProject.fields.status
        distinguishing_aspect: "POST /projects with all required fields → 201; committed_kw=0, available_kw==nameplate_capacity_kw, status=OPEN, rec balances 0."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /projects"
              payload: { name: "P1", state_code: "NY", nameplate_capacity_kw: 100, credit_rate_cents_per_kwh: 10 }
              as: GridOperator
              captures: { committed: $.data.committed_kw, avail: $.data.available_kw, st: $.data.status }
          assert:
            - "Response code 201"
            - "SolarProject.committed_kw == 0"
            - "SolarProject.available_kw == 100"
            - "SolarProject.status == OPEN"
            - "SolarProject.rec_minted_total == 0 and rec_available_balance == 0"

      - name: get_subscriber_returns_stored_data
        claim_type: Retrieval
        grounds:
          - endpoints.GET./subscribers/{id}
          - entities.Subscriber.fields.full_name
        distinguishing_aspect: "GET /subscribers/{id} returns the stored full_name and utility_account_no for the created subscriber."
        test_recipe:
          setup:
            - "One subscriber registered."
          setup_api_calls:
            - call: "POST /subscribers"
              payload: { full_name: "Jane Q", utility_account_no: "ACC-C1", state_code: "NY", annual_usage_kwh: 50000 }
              as: ProgramAdmin
              captures: { sub_id: $.data.id }
          trigger:
            - call: "GET /subscribers/${sub_id}"
              payload: {}
              as: ProgramAdmin
              captures: { name: $.data.full_name }
          assert:
            - "Subscriber.full_name == 'Jane Q'"
            - "Subscriber.utility_account_no == 'ACC-C1'"

      - name: list_periods_paginated_envelope
        claim_type: Listing
        grounds:
          - endpoints.GET./periods
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /periods?project_id= returns a paginated array envelope carrying total_count and has_more."
        test_recipe:
          setup:
            - "A project with one billing period."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P2", state_code: "NY", nameplate_capacity_kw: 100, credit_rate_cents_per_kwh: 10 }
              as: GridOperator
              captures: { proj_id: $.data.id }
            - call: "POST /periods"
              payload: { project_id: "${proj_id}", period_month: "2026-01", forecast_production_kwh: 1000 }
              as: GridOperator
          trigger:
            - call: "GET /periods"
              payload: { project_id: "${proj_id}" }
              as: GridOperator
              captures: { first_id: "$.data[0].id" }
          assert:
            - "response_type == 'array' and meta.total_count == 1 and meta.has_more == false"

      - name: get_project_nonexistent_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET./projects/{id}
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /projects/{nonexistent-uuid} → 404 ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /projects/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: GridOperator
              captures: { err: $.data.error_id }
          assert:
            - "Response 404 with data.error_id == ERR_NOT_FOUND"

      - name: create_enrollment_missing_requested_share_kw_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints.POST./enrollments
          - entities.Enrollment.fields.requested_share_kw
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /enrollments omitting requested_share_kw → 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "A project and subscriber exist."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P3", state_code: "NY", nameplate_capacity_kw: 100, credit_rate_cents_per_kwh: 10 }
              as: GridOperator
              captures: { proj_id: $.data.id }
            - call: "POST /subscribers"
              payload: { full_name: "Miss Field", utility_account_no: "ACC-C2", state_code: "NY", annual_usage_kwh: 50000 }
              as: ProgramAdmin
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /enrollments"
              payload: { project_id: "${proj_id}", subscriber_id: "${sub_id}" }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response 400 with data.error_id == ERR_INVALID_REQUEST"

      - name: create_project_omitting_carve_out_pct_applies_default
        claim_type: Defaults
        grounds:
          - entities.SolarProject.fields.carve_out_pct
          - entities.SolarProject.fields.program_fee_rate
        distinguishing_aspect: "Omitting carve_out_pct/program_fee_rate applies defaults 0.40 and 0.10."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /projects"
              payload: { name: "P4", state_code: "NY", nameplate_capacity_kw: 100, credit_rate_cents_per_kwh: 10 }
              as: GridOperator
              captures: { cop: $.data.carve_out_pct, pfr: $.data.program_fee_rate }
          assert:
            - "SolarProject.carve_out_pct == 0.40"
            - "SolarProject.program_fee_rate == 0.10"

      - name: project_available_kw_computed_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.SolarProject.fields.available_kw
          - entities.SolarProject.fields.committed_kw
        distinguishing_aspect: "available_kw is computed (nameplate - committed); any input value for it is ignored and it equals nameplate at creation."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /projects"
              payload: { name: "P5", state_code: "NY", nameplate_capacity_kw: 80, credit_rate_cents_per_kwh: 10 }
              as: GridOperator
              captures: { avail: $.data.available_kw }
          assert:
            - "SolarProject.available_kw == 80 (computed = nameplate 80 - committed 0)"

      - name: subscriber_system_fields_generated
        claim_type: System Fields
        grounds:
          - entities.Subscriber.fields.churn_risk_score
          - entities.Subscriber.fields.lifetime_savings_cents
        distinguishing_aspect: "id/created_at/updated_at/version system-generated; churn_risk_score and lifetime_savings_cents initialized by system, not from input."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /subscribers"
              payload: { full_name: "Sys Gen", utility_account_no: "ACC-C3", state_code: "NY", annual_usage_kwh: 0 }
              as: ProgramAdmin
              captures: { churn: $.data.churn_risk_score, life: $.data.lifetime_savings_cents, ver: $.data.version }
          assert:
            - "Subscriber.lifetime_savings_cents == 0 and version == 1"
            - "Subscriber.churn_risk_score == 0 (no SUSPENDED, no dispute, not low-income)"

      - name: create_project_carve_out_pct_out_of_range_returns_validation
        claim_type: Type Constraints
        grounds:
          - entities.SolarProject.fields.carve_out_pct
          - validations[priority=6]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "carve_out_pct=1.5 violates [0,1] → 422 ERR_VALIDATION."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /projects"
              payload: { name: "P6", state_code: "NY", nameplate_capacity_kw: 100, carve_out_pct: 1.5, credit_rate_cents_per_kwh: 10 }
              as: GridOperator
              captures: { err: $.data.error_id }
          assert:
            - "Response 422 with data.error_id == ERR_VALIDATION"

      - name: carve_out_adjustment_immutable_append_only_resource
        claim_type: Immutability
        grounds:
          - entities.CarveOutAdjustment
          - endpoints.POST./projects/{id}/carve-out-adjustments
        distinguishing_aspect: "CarveOutAdjustment is common_fields:false (id + created_at only) — append-only audit event with no update/transition endpoint and no version field."
        test_recipe:
          setup:
            - "A project exists."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P7", state_code: "NY", nameplate_capacity_kw: 100, carve_out_pct: 0.40, credit_rate_cents_per_kwh: 10 }
              as: GridOperator
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /projects/${proj_id}/carve-out-adjustments"
              payload: { new_carve_out_pct: 0.50, reason: "expand carve-out" }
              as: ProgramAdmin
              captures: { adj_id: $.data.id, prev: $.data.previous_carve_out_pct, newp: $.data.new_carve_out_pct }
          assert:
            - "CarveOutAdjustment.previous_carve_out_pct == 0.40 and new_carve_out_pct == 0.50"
            - "Response carries id and created_at but no version field (common_fields:false)"

      - name: fk_integrity_enrollment_unknown_project_returns_reference_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Enrollment.fields.project_id
          - validations[priority=4]
          - errors[ERR_REFERENCE_NOT_FOUND]
        distinguishing_aspect: "flat topology FK validation: POST /enrollments with a non-existent project_id → 404 ERR_REFERENCE_NOT_FOUND."
        test_recipe:
          setup:
            - "One subscriber exists; project_id is fabricated."
          setup_api_calls:
            - call: "POST /subscribers"
              payload: { full_name: "Orphan", utility_account_no: "ACC-C4", state_code: "NY", annual_usage_kwh: 50000 }
              as: ProgramAdmin
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /enrollments"
              payload: { project_id: "00000000-0000-0000-0000-000000000000", subscriber_id: "${sub_id}", requested_share_kw: 5.0 }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response 404 with data.error_id == ERR_REFERENCE_NOT_FOUND"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: enrollment_initial_state_is_draft
        claim_type: Initial State
        grounds:
          - state_machines.Enrollment.initial_state
          - entities.Enrollment.fields.status
        distinguishing_aspect: "A freshly POSTed enrollment starts in DRAFT."
        test_recipe:
          setup:
            - "A project and subscriber exist."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P8", state_code: "NY", nameplate_capacity_kw: 100, credit_rate_cents_per_kwh: 10 }
              as: GridOperator
              captures: { proj_id: $.data.id }
            - call: "POST /subscribers"
              payload: { full_name: "Init Sub", utility_account_no: "ACC-C5", state_code: "NY", annual_usage_kwh: 50000 }
              as: ProgramAdmin
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /enrollments"
              payload: { project_id: "${proj_id}", subscriber_id: "${sub_id}", requested_share_kw: 5.0 }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { st: $.data.status }
          assert:
            - "Enrollment.status == DRAFT"

      - name: approve_draft_enrollment_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Enrollment.SUBMITTED_to_APPROVED
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Approving a DRAFT enrollment (approve only defined from SUBMITTED) → 409 ERR_INVALID_STATE; status stays DRAFT."
        test_recipe:
          setup:
            - "A DRAFT enrollment exists (never submitted)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P9", state_code: "NY", nameplate_capacity_kw: 100, credit_rate_cents_per_kwh: 10 }
              as: GridOperator
              captures: { proj_id: $.data.id }
            - call: "POST /subscribers"
              payload: { full_name: "Draft Sub", utility_account_no: "ACC-C6", state_code: "NY", annual_usage_kwh: 50000 }
              as: ProgramAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /enrollments"
              payload: { project_id: "${proj_id}", subscriber_id: "${sub_id}", requested_share_kw: 5.0 }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr_id}/approve"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response 409 with data.error_id == ERR_INVALID_STATE"

      - name: cancel_already_cancelled_subscription_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Subscription.terminal_states
          - state_machines.Subscription.ACTIVE_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "CANCELLED is terminal — a second cancel on an already-CANCELLED subscription → 409 ERR_INVALID_STATE; no further ledger side-effects fire."
        test_recipe:
          setup:
            - "A CANCELLED subscription (share 5.0 cancelled)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P10", state_code: "NY", nameplate_capacity_kw: 100, credit_rate_cents_per_kwh: 10 }
              as: GridOperator
              captures: { proj_id: $.data.id }
            - call: "POST /subscribers"
              payload: { full_name: "Term Sub", utility_account_no: "ACC-C7", state_code: "NY", annual_usage_kwh: 1000000 }
              as: ProgramAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /enrollments"
              payload: { project_id: "${proj_id}", subscriber_id: "${sub_id}", requested_share_kw: 5.0 }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/submit"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - call: "POST /enrollments/${enr_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { subscription_id: $.data.id }
            - call: "POST /subscriptions/${subscription_id}/cancel"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
          trigger:
            - call: "POST /subscriptions/${subscription_id}/cancel"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response 409 with data.error_id == ERR_INVALID_STATE; subscription stays CANCELLED"

      - name: enrollment_reject_resubmit_cycle_clears_rejection_reason
        claim_type: cyclic
        grounds:
          - state_machines.Enrollment.SUBMITTED_to_REJECTED
          - state_machines.Enrollment.REJECTED_to_SUBMITTED
          - entities.Enrollment.fields.rejection_reason
        distinguishing_aspect: "Cyclic revision loop: SUBMITTED→REJECTED (rejection_reason set) then REJECTED→SUBMITTED returns the enrollment to SUBMITTED with rejection_reason cleared."
        test_recipe:
          setup:
            - "A SUBMITTED enrollment on an OPEN project with sufficient capacity."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P11", state_code: "NY", nameplate_capacity_kw: 100, credit_rate_cents_per_kwh: 10 }
              as: GridOperator
              captures: { proj_id: $.data.id }
            - call: "POST /subscribers"
              payload: { full_name: "Cyc Enr", utility_account_no: "ACC-C8", state_code: "NY", annual_usage_kwh: 1000000 }
              as: ProgramAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /enrollments"
              payload: { project_id: "${proj_id}", subscriber_id: "${sub_id}", requested_share_kw: 5.0 }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/submit"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - call: "POST /enrollments/${enr_id}/reject"
              payload: { rejection_reason: "needs documents" }
              as: ProgramAdmin
          trigger:
            - call: "POST /enrollments/${enr_id}/submit"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { st: $.data.status, reason: $.data.rejection_reason }
          assert:
            - "Enrollment.status == SUBMITTED after resubmit"
            - "Enrollment.rejection_reason is null/empty (cleared on resubmit)"

      - name: meter_side_effect_switches_distributable_to_metered
        claim_type: Side Effect Execution
        grounds:
          - state_machines.BillingPeriod.OPEN_to_METERED
          - entities.BillingPeriod.fields.distributable_kwh
          - entities.Allocation.fields.allocated_kwh
        distinguishing_aspect: "Metering switches distributable_kwh from forecast (1200) to metered (1000) and re-runs the waterfall so the single allocation's allocated_kwh becomes 1000."
        test_recipe:
          setup:
            - "An OPEN period (forecast 1200) on a project with one ACTIVE share-5.0 sub."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P12", state_code: "NY", nameplate_capacity_kw: 100, credit_rate_cents_per_kwh: 10 }
              as: GridOperator
              captures: { proj_id: $.data.id }
            - call: "POST /subscribers"
              payload: { full_name: "Meter Sub", utility_account_no: "ACC-C9", state_code: "NY", annual_usage_kwh: 1000000 }
              as: ProgramAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /enrollments"
              payload: { project_id: "${proj_id}", subscriber_id: "${sub_id}", requested_share_kw: 5.0 }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/submit"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - call: "POST /enrollments/${enr_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /periods"
              payload: { project_id: "${proj_id}", period_month: "2026-02", forecast_production_kwh: 1200 }
              as: GridOperator
              captures: { per_id: $.data.id, per_ver: $.data.version }
          trigger:
            - call: "POST /periods/${per_id}/meter"
              payload: { metered_production_kwh: 1000, expected_period_version: "${per_ver}" }
              as: GridOperator
              captures: { dist: $.data.distributable_kwh }
            - call: "GET /allocations"
              payload: { period_id: "${per_id}" }
              as: GridOperator
              captures: { alloc_kwh: "$.data[0].allocated_kwh" }
          assert:
            - "BillingPeriod.distributable_kwh == 1000 (metered basis) and status == METERED"
            - "Allocation.allocated_kwh == 1000 after waterfall re-run"

      - name: apply_issued_reconciliation_ledger_sync_compound
        claim_type: Ledger sync
        grounds:
          - state_machines.Reconciliation.ISSUED_to_APPLIED
          - entities.Subscriber.fields.lifetime_savings_cents
          - entities.SolarProject.fields.total_net_savings_cents
        distinguishing_aspect: "Applying an ISSUED reconciliation increments Subscriber.lifetime_savings_cents and SolarProject.total_net_savings_cents by net_savings_cents (9100)."
        test_recipe:
          setup:
            - "A RECONCILED period with one ISSUED reconciliation, net 9100 (gross 10000, non-CO)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P13", state_code: "NY", nameplate_capacity_kw: 100, credit_rate_cents_per_kwh: 10, program_fee_rate: 0.10 }
              as: GridOperator
              captures: { proj_id: $.data.id }
            - call: "POST /subscribers"
              payload: { full_name: "Apply Sub", utility_account_no: "ACC-C10", state_code: "NY", annual_usage_kwh: 1000000 }
              as: ProgramAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /enrollments"
              payload: { project_id: "${proj_id}", subscriber_id: "${sub_id}", requested_share_kw: 5.0 }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/submit"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - call: "POST /enrollments/${enr_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /periods"
              payload: { project_id: "${proj_id}", period_month: "2026-03", forecast_production_kwh: 1000 }
              as: GridOperator
              captures: { per_id: $.data.id, per_ver: $.data.version }
            - call: "POST /periods/${per_id}/meter"
              payload: { metered_production_kwh: 1000, expected_period_version: "${per_ver}" }
              as: GridOperator
              captures: { per_ver2: $.data.version }
            - call: "POST /periods/${per_id}/reconcile"
              payload: { expected_period_version: "${per_ver2}" }
              as: GridOperator
            - call: "GET /reconciliations"
              payload: { period_id: "${per_id}" }
              as: GridOperator
              captures: { recon_id: "$.data[0].id" }
            - call: "POST /reconciliations/${recon_id}/issue"
              payload: {}
              as: GridOperator
          trigger:
            - call: "POST /reconciliations/${recon_id}/apply"
              payload: {}
              as: GridOperator
            - call: "GET /subscribers/${sub_id}"
              payload: {}
              as: GridOperator
              captures: { life: $.data.lifetime_savings_cents }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: GridOperator
              captures: { tns: $.data.total_net_savings_cents }
          assert:
            - "Subscriber.lifetime_savings_cents == 9100"
            - "SolarProject.total_net_savings_cents == 9100"

      - name: recbatch_branch_retire_vs_transfer_divergent_ledger
        claim_type: branching
        grounds:
          - state_machines.RECBatch.ALLOCATED_to_RETIRED
          - state_machines.RECBatch.ALLOCATED_to_TRANSFERRED
          - entities.SolarProject.fields.rec_retired_total
          - entities.SolarProject.fields.rec_available_balance
        distinguishing_aspect: "ALLOCATED fork: retire raises rec_retired_total (and lowers available); transfer lowers rec_available_balance but leaves rec_retired_total unchanged — divergent ledger effects per branch."
        test_recipe:
          setup:
            - "An ALLOCATED RECBatch of rec_count 10 on a project (metered 10000)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P14", state_code: "NY", nameplate_capacity_kw: 100, credit_rate_cents_per_kwh: 10, program_fee_rate: 0.10 }
              as: GridOperator
              captures: { proj_id: $.data.id }
            - call: "POST /subscribers"
              payload: { full_name: "Rec Br", utility_account_no: "ACC-C11", state_code: "NY", annual_usage_kwh: 1000000 }
              as: ProgramAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /enrollments"
              payload: { project_id: "${proj_id}", subscriber_id: "${sub_id}", requested_share_kw: 5.0 }
