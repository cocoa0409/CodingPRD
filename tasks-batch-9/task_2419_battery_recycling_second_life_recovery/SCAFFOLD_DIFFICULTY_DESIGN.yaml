            - "The 2026-08-01T00:00:00.000Z booking of 500.0 kg returns HTTP 201: valid_from is inclusive and 08-01 is an untouched bucket"
            - "${consumed_final} == 1500.0 and DischargeEvent.${ev1_id}.status == DischargeEvent.${ev2_id}.status == DischargeEvent.${ev3_id}.status == POSTED"
            - "GET /recycling/discharge-events?allotment_id=${allot_id} reports total_count == 3 - the three rejected bookings created no rows"

  - rule_id: compensating_invariant
    instances:
      - name: settlement_post_then_void_restores_supplier_obligation_invariant
        grounds:
          - invariants.supplier_obligation_invariant
          - state_machines.SupplierSettlement.POSTED_to_VOIDED
          - errors[ERR_SETTLEMENT_NOT_POSTED]
          - entities.Supplier.fields.payable_balance_cents
        distinguishing_aspect: |
          Voiding a POSTED settlement must unwind the whole money-side fan-out, not just the
          settlement row: payable_balance_cents returns to 0, posted_amount_cents is zeroed,
          paid_to_date_cents is untouched (a void is not a payment), credit_hold flips back to
          false and the intake that the credit hold had quarantined returns to RECEIVED with
          hold_reason cleared - while the already RELEASED intake is left alone. The compensation
          is also non-repeatable: a second void of the same settlement is refused with
          ERR_SETTLEMENT_NOT_POSTED, so the invariant cannot be driven negative.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-20T00:00:00.000Z after setup, one campus, supplier Northstar Automotive with credit_limit_cents 20000, NI quotes 1600 effective 2026-07-01 and 1750 effective 2026-08-15."
            - "Intake I-1 (net_mass_kg 100.0, declared NI 12.0) RELEASED and fully processed: its module was charged into lot L-1, one recovery output NI 30.000 kg at 99.20% was booked, the lot was FINALIZED with residue 67.0 kg and its settlement is DRAFT/FINAL with net_payable_cents 30723."
            - "Intake I-2 of the same supplier sits at custody_state RECEIVED so the credit-hold cascade can reach it."
            - "Supplier.payable_balance_cents 0, paid_to_date_cents 0, credit_hold false."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/facilities"
              payload: { name: "Reno Campus", state_code: "NV", mech_capacity_kg_per_day: 3000.0, hydro_capacity_kg_per_day: 2000.0 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
            - call: "POST /recycling/suppliers"
              payload: { legal_name: "Northstar Automotive", channel: "AUTOMAKER", credit_limit_cents: 20000 }
              as: PlatformAdmin
              captures: { sup_id: "$.data.id" }
            - call: "POST /recycling/metal-index-prices"
              payload: { metal: "NI", effective_date: "2026-07-01T00:00:00.000Z", price_cents_per_kg: 1600 }
              as: MarketAnalyst
            - call: "POST /recycling/metal-index-prices"
              payload: { metal: "NI", effective_date: "2026-08-15T00:00:00.000Z", price_cents_per_kg: 1750 }
              as: MarketAnalyst
            - call: "POST /recycling/intakes"
              payload: { supplier_id: "${sup_id}", facility_id: "${fac_id}", declared_chemistry: "NMC622", gross_mass_kg: 110.0, packaging_tare_kg: 10.0, declared_ni_pct: 12.0 }
              as: IntakeClerk
              captures: { i1_id: "$.data.id" }
            - call: "POST /recycling/intakes/${i1_id}/identify-chemistry"
              payload: { identified_chemistry: "NMC622" }
              as: IntakeClerk
              captures: { i1_v2: "$.data.version" }
            - call: "POST /recycling/intakes/${i1_id}/modules"
              payload: { serial_code: "M-1", mass_kg: 100.0, min_cell_capacity_pct: 58.0, mean_cell_capacity_pct: 62.0, cycle_count: 1200, expected_intake_version: "${i1_v2}" }
              as: IntakeClerk
              captures: { m1_id: "$.data.id" }
            - call: "POST /recycling/intakes/${i1_id}/discharge"
              payload: { soc_pct: 12.0 }
              as: PlantOperator
            - call: "POST /recycling/intakes/${i1_id}/package"
              payload: { packaging_type: "UN4G-STEEL-DRUM" }
              as: PlantOperator
            - call: "POST /recycling/intakes/${i1_id}/manifests"
              payload: { un_number: "UN3480", packing_group: "II", transporter_name: "Sierra Hazmat Lines" }
              as: ComplianceOfficer
              as_user_id: "co-submitter-1"
              captures: { man1_id: "$.data.id" }
            - call: "POST /recycling/intakes/${i1_id}/manifests/${man1_id}/close"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-closer-2"
            - call: "POST /recycling/intakes/${i1_id}/release"
              payload: {}
              as: PlantOperator
            - call: "POST /recycling/intakes"
              payload: { supplier_id: "${sup_id}", facility_id: "${fac_id}", declared_chemistry: "NMC622", gross_mass_kg: 60.0, packaging_tare_kg: 10.0, declared_ni_pct: 11.0 }
              as: IntakeClerk
              captures: { i2_id: "$.data.id" }
            - call: "POST /recycling/modules/${m1_id}/triage-decisions"
              payload: { scoring_variant: "CONSERVATIVE" }
              as: TriageEngineer
              as_user_id: "te-1"
            - call: "POST /recycling/processing-lines"
              payload: { facility_id: "${fac_id}", line_code: "HYD-1", line_type: "HYDROMET", chemistry_family: "NICKEL_RICH", throughput_kg_per_hour: 60.0 }
              as: PlatformAdmin
              captures: { line_id: "$.data.id" }
            - call: "POST /recycling/campaigns"
              payload: { line_id: "${line_id}", chemistry_family: "NICKEL_RICH", window_start: "2026-08-01T00:00:00.000Z", window_end: "2026-09-30T00:00:00.000Z", planned_input_kg: 5000.0 }
              as: PlantOperator
              captures: { camp_id: "$.data.id" }
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/campaigns/${camp_id}/start"
              payload: {}
              as: PlantOperator
            - call: "POST /recycling/campaigns/${camp_id}/lots"
              payload: { lot_code: "L-1" }
              as: PlantOperator
              captures: { lot_id: "$.data.id", lot_v: "$.data.version" }
            - call: "POST /recycling/lots/${lot_id}/charge"
              payload: { module_ids: ["${m1_id}"], expected_lot_version: "${lot_v}" }
              as: PlantOperator
            - call: "POST /recycling/lots/${lot_id}/recovery-outputs"
              payload: { metal: "NI", recovered_mass_kg: 30.000, assay_purity_pct: 99.20 }
              as: AssayTechnician
            - call: "POST /recycling/lots/${lot_id}/finalize"
              payload: { residue_mass_kg: 67.0 }
              as: AssayTechnician
            - call: "GET /recycling/settlements"
              payload: { intake_id: "${i1_id}" }
              as: SettlementAccountant
              captures: { st_id: "$.data[0].id", st_net: "$.data[0].net_payable_cents" }
            - call: "GET /recycling/suppliers/${sup_id}"
              payload: {}
              as: SettlementAccountant
              captures: { payable_before: "$.data.payable_balance_cents", hold_before: "$.data.credit_hold" }
          trigger:
            - call: "POST /recycling/settlements/${st_id}/post"
              payload: {}
              as: SettlementAccountant
              captures: { posted_amt: "$.data.posted_amount_cents", st_state1: "$.data.state" }
            - call: "GET /recycling/suppliers/${sup_id}"
              payload: {}
              as: SettlementAccountant
              captures: { payable_posted: "$.data.payable_balance_cents", hold_posted: "$.data.credit_hold" }
            - call: "GET /recycling/intakes/${i2_id}"
              payload: {}
              as: IntakeClerk
              captures: { i2_cust_held: "$.data.custody_state", i2_reason_held: "$.data.hold_reason" }
            - call: "POST /recycling/settlements/${st_id}/void"
              payload: { void_reason: "Booked against the wrong purchase order" }
              as: SettlementAccountant
              captures: { st_state2: "$.data.state", posted_after: "$.data.posted_amount_cents" }
            - call: "GET /recycling/suppliers/${sup_id}"
              payload: {}
              as: SettlementAccountant
              captures: { payable_after: "$.data.payable_balance_cents", paid_after: "$.data.paid_to_date_cents", hold_after: "$.data.credit_hold" }
            - call: "GET /recycling/intakes/${i2_id}"
              payload: {}
              as: IntakeClerk
              captures: { i2_cust_after: "$.data.custody_state", i2_reason_after: "$.data.hold_reason" }
            - call: "GET /recycling/intakes/${i1_id}"
              payload: {}
              as: IntakeClerk
              captures: { i1_cust_after: "$.data.custody_state" }
            - call: "POST /recycling/settlements/${st_id}/void"
              payload: { void_reason: "Duplicate reversal attempt" }
              as: SettlementAccountant
          assert:
            - "${payable_before} == 0 and ${hold_before} == false and ${st_net} == 30723"
            - "${st_state1} == POSTED and ${posted_amt} == 30723"
            - "${payable_posted} == 30723 and ${hold_posted} == true (30723 > credit_limit_cents 20000)"
            - "${i2_cust_held} == QUARANTINED and ${i2_reason_held} == SUPPLIER_CREDIT_HOLD"
            - "${st_state2} == VOIDED and ${posted_after} == 0 and SupplierSettlement.${st_id}.void_reason == 'Booked against the wrong purchase order'"
            - "${payable_after} == 0 - supplier_obligation_invariant is restored exactly, with no residual cent"
            - "${paid_after} == 0 - a void is not a payment, so paid_to_date_cents never moves"
            - "${hold_after} == false, ${i2_cust_after} == RECEIVED and ${i2_reason_after} == null"
            - "${i1_cust_after} == RELEASED - the already-released intake is untouched by the compensation"
            - "SupplierSettlement.${st_id}.net_payable_cents == 30723 - the priced amount is preserved for audit even though posted_amount_cents is 0"
            - "The second void returns HTTP 409 with error.error_id == ERR_SETTLEMENT_NOT_POSTED and Supplier.${sup_id}.payable_balance_cents stays 0"

      - name: lot_charge_then_void_restores_intake_mass_conservation_invariant
        grounds:
          - invariants.intake_mass_conservation_invariant
          - state_machines.RecoveryLot.CHARGED_to_VOIDED
          - errors[ERR_LOT_NOT_OPEN]
          - entities.Intake.fields.assigned_mass_kg
          - entities.Intake.fields.unassigned_mass_kg
        distinguishing_aspect: |
          Voiding a CHARGED lot reverses a mass ledger rather than a money ledger: both modules
          leave CHARGED for RECOVERY_QUEUE with lot_id cleared, the intake's assigned/unassigned
          split swings back from 800.0/0.0 to 0.0/800.0 while module_mass_total_kg never moves,
          and the campaign's committed_input_kg drops back to 0.000 so the plan is freed. The
          compensation is complete rather than merely arithmetic: the identical 800.0 kg can be
          re-charged into a fresh lot with no drift, while the voided lot itself is terminal and
          rejects a second charge with ERR_LOT_NOT_OPEN.
        test_recipe:
