scaffold_corner_design:
- section: entities
  instances:
  - name: create_part_returns_201_with_every_declared_field
    claim_type: creation
    grounds:
    - entities.Part
    - endpoints[POST /swiss-shop/parts]
    distinguishing_aspect: |
      POST /swiss-shop/parts with all eleven declarable fields returns 201 and echoes part_number, alloy_code, bar_diameter_mm 12.7, cycle_time_sec 42 and finished_mass_g 18.3 verbatim.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z; empty database.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: ShopPlanner
        as_user_id: planner-1
      trigger:
      - call: POST /swiss-shop/parts
        payload:
          part_number: P-4471
          alloy_code: 303SS
          bar_diameter_mm: 12.7
          cut_off_length_mm: 26.5
          cycle_time_sec: 42
          setup_hours: 3.5
          material_cost_cents_per_meter: 1850
          finished_mass_g: 18.3
          lights_out_eligible: true
          secondary_required: true
          secondary_minutes_per_piece: 0.4
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          part: $.data.id
      assert:
      - HTTP status == 201
      - Part.${part}.part_number == P-4471
      - Part.${part}.alloy_code == 303SS
      - Part.${part}.bar_diameter_mm == 12.7
      - Part.${part}.cycle_time_sec == 42
      - Part.${part}.finished_mass_g == 18.3
      - Part.${part}.observed_avg_cycle_time_sec == null
      - Part.${part}.observed_accepted_qty == 0
      - Part.${part}.version == 1
  - name: get_machine_returns_the_stored_machine
    claim_type: retrieval
    grounds:
    - entities.Machine
    - endpoints[GET /swiss-shop/machines/{id}]
    distinguishing_aspect: |
      GET /swiss-shop/machines/{id} returns the same asset_tag, max_bar_diameter_mm and AVAILABLE status that POST /swiss-shop/machines minted.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z; one machine SW-01 registered.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: ShopPlanner
        as_user_id: planner-1
      - call: POST /swiss-shop/machines
        payload:
          asset_tag: SW-01
          max_bar_diameter_mm: 20.0
          lights_out_certified: true
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          mach: $.data.id
      trigger:
      - call: GET /swiss-shop/machines/${mach}
        payload: {}
        as: Machinist
        as_user_id: op-any
        captures:
          tag: $.data.asset_tag
          st: $.data.status
          ver: $.data.version
      assert:
      - HTTP status == 200
      - ${tag} == SW-01
      - ${st} == AVAILABLE
      - ${ver} == 1
      - Machine.${mach}.coolant_makeup_liters == 0
      - Machine.${mach}.last_reclamation_credit_cents == null
  - name: list_characteristics_filtered_by_part_with_pagination
    claim_type: listing
    grounds:
    - entities.Characteristic
    - endpoints[GET /swiss-shop/characteristics]
    - response_envelope.pagination_fields
    distinguishing_aspect: |
      GET /swiss-shop/characteristics?part_id=...&limit=1&offset=0 returns exactly one of the two characteristics on that part with total_count 2 and has_more true, and none of the sibling part's characteristics.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z.
      - Part P-4471 has two characteristics OD-A and OD-B; part P-8802 has one characteristic ID-C.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: ShopPlanner
        as_user_id: planner-1
      - call: POST /swiss-shop/parts
        payload:
          part_number: P-4471
          alloy_code: 303SS
          bar_diameter_mm: 12.7
          cut_off_length_mm: 26.5
          cycle_time_sec: 42
          setup_hours: 3.5
          material_cost_cents_per_meter: 1850
          finished_mass_g: 18.3
          lights_out_eligible: true
          secondary_required: true
          secondary_minutes_per_piece: 0.4
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          part_a: $.data.id
      - call: POST /swiss-shop/parts
        payload:
          part_number: P-8802
          alloy_code: C360
          bar_diameter_mm: 16.0
          cut_off_length_mm: 32.0
          cycle_time_sec: 55
          setup_hours: 2.0
          material_cost_cents_per_meter: 2600
          finished_mass_g: 36.01
          lights_out_eligible: false
          secondary_required: false
          secondary_minutes_per_piece: 0
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          part_b: $.data.id
      - call: POST /swiss-shop/characteristics
        payload:
          part_id: ${part_a}
          char_code: OD-A
          nominal: 6.35
          usl: 6.375
          lsl: 6.325
          sample_freq_pieces: 200
          required_gauge_type: MICROMETER
          cpk_min: 1.385
          subgroup_size: 5
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          ch_a: $.data.id
      - call: POST /swiss-shop/characteristics
        payload:
          part_id: ${part_a}
          char_code: OD-B
          nominal: 6.35
          usl: 6.375
          lsl: 6.325
          sample_freq_pieces: 100
          required_gauge_type: MICROMETER
          cpk_min: 1.385
          subgroup_size: 5
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          ch_b: $.data.id
      - call: POST /swiss-shop/characteristics
        payload:
          part_id: ${part_b}
          char_code: ID-C
          nominal: 6.35
          usl: 6.375
          lsl: 6.325
          sample_freq_pieces: 50
          required_gauge_type: BORE_GAUGE
          cpk_min: 1.385
          subgroup_size: 5
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          ch_c: $.data.id
      trigger:
      - call: GET /swiss-shop/characteristics
        payload:
          part_id: ${part_a}
          limit: 1
          offset: 0
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          first: $.data[0].id
      assert:
      - HTTP status == 200
      - response meta total_count == 2
      - response meta has_more == true
      - the returned array length == 1
      - ${first} in {${ch_a}, ${ch_b}}
      - ${first} != ${ch_c}
  - name: get_work_order_with_unknown_id_returns_not_found
    claim_type: not_found
    grounds:
    - errors[ERR_WORK_ORDER_NOT_FOUND]
    - validations[priority=40]
    distinguishing_aspect: |
      GET /swiss-shop/work-orders/{id} for a well-formed UUID that names no row returns 404 with error_id ERR_WORK_ORDER_NOT_FOUND, not an empty object.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z; empty database.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: ShopPlanner
        as_user_id: planner-1
      trigger:
      - call: GET /swiss-shop/work-orders/00000000-0000-4000-8000-000000000000
        payload: {}
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_WORK_ORDER_NOT_FOUND
      - HTTP status == 404
  - name: create_quote_missing_required_lot_qty_returns_invalid_request
    claim_type: required_fields
    grounds:
    - errors[ERR_INVALID_REQUEST]
    - validations[priority=30]
    - endpoints[POST /swiss-shop/quotes]
    distinguishing_aspect: |
      lot_qty carries source input with no default, so omitting it from POST /swiss-shop/quotes returns 400 ERR_INVALID_REQUEST and no Quote row is created.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z; part P-4471 exists.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: ShopPlanner
        as_user_id: planner-1
      - call: POST /swiss-shop/parts
        payload:
          part_number: P-4471
          alloy_code: 303SS
          bar_diameter_mm: 12.7
          cut_off_length_mm: 26.5
          cycle_time_sec: 42
          setup_hours: 3.5
          material_cost_cents_per_meter: 1850
          finished_mass_g: 18.3
          lights_out_eligible: true
          secondary_required: true
          secondary_minutes_per_piece: 0.4
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          part: $.data.id
      trigger:
      - call: POST /swiss-shop/quotes
        payload:
          part_id: ${part}
          customer_code: ACME
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_INVALID_REQUEST
      - HTTP status == 400
      - GET /swiss-shop/quotes filtered by part_id returns an empty array with total_count 0
  - name: omitting_feeder_slots_defaults_to_one
    claim_type: defaults
    grounds:
    - entities.BarStockLot.fields.feeder_slots
    - endpoints[POST /swiss-shop/bar-stock-lots]
    distinguishing_aspect: |
      feeder_slots declares default 1, so a lot created without it comes back with feeder_slots 1 and single-slot feeder arithmetic; cpk_min and subgroup_size default the same way on Characteristic.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z; empty database.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: ShopPlanner
        as_user_id: planner-1
      - call: POST /swiss-shop/parts
        payload:
          part_number: P-4471
          alloy_code: 303SS
          bar_diameter_mm: 12.7
          cut_off_length_mm: 26.5
          cycle_time_sec: 42
          setup_hours: 3.5
          material_cost_cents_per_meter: 1850
          finished_mass_g: 18.3
          lights_out_eligible: true
          secondary_required: true
          secondary_minutes_per_piece: 0.4
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          part: $.data.id
      trigger:
      - call: POST /swiss-shop/bar-stock-lots
        payload:
          heat_number: H-70001
          alloy_code: 303SS
          bar_diameter_mm: 12.7
          bar_length_mm: 3600
          bars_received: 20
          mass_kg_per_meter: 0.995
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          lot: $.data.id
          slots: $.data.feeder_slots
      - call: POST /swiss-shop/characteristics
        payload:
          part_id: ${part}
          char_code: OD-A
          nominal: 6.35
          usl: 6.375
          lsl: 6.325
          sample_freq_pieces: 200
          required_gauge_type: MICROMETER
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          ch: $.data.id
          cmin: $.data.cpk_min
          ssize: $.data.subgroup_size
      assert:
      - ${slots} == 1
      - ${cmin} == 1.33
      - ${ssize} == 5
      - BarStockLot.${lot}.status == RECEIVED
      - BarStockLot.${lot}.total_length_mm == 72000
      - BarStockLot.${lot}.available_length_mm == 72000
  - name: work_order_length_fields_are_computed_from_part_and_lot
    claim_type: computed_fields
    grounds:
    - calculations.bar_length_ledger
    - entities.WorkOrder.fields.required_length_mm
    - entities.WorkOrder.fields.bars_reserved
    - entities.WorkOrder.fields.reserved_length_mm
    distinguishing_aspect: |
      required_length_mm 6000, bars_reserved 2 and reserved_length_mm 7200 are derived at creation from qty_ordered 200, cut_off_length_mm 26.5, the 2.0 mm kerf, the 300 mm setup scrap and the 3450 mm usable bar - none of them is a request field.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z.
      - A kanban release for 200 pieces exists against a certified 3600 mm x 20 bar lot.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: ShopPlanner
        as_user_id: planner-1
      - call: POST /swiss-shop/operators
        payload:
          name: Rey Molina
          badge_code: BM-01
          certifications:
          - SWISS_SETUP
          - LIGHTS_OUT
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          op_mach: $.data.id
      - call: POST /swiss-shop/operators
        payload:
          name: Ida Chen
          badge_code: BI-01
          certifications:
          - CMM
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          op_insp: $.data.id
      - call: POST /swiss-shop/machines
        payload:
          asset_tag: SW-01
          max_bar_diameter_mm: 20.0
          lights_out_certified: true
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          mach: $.data.id
      - call: POST /swiss-shop/parts
        payload:
          part_number: P-4471
          alloy_code: 303SS
          bar_diameter_mm: 12.7
          cut_off_length_mm: 26.5
          cycle_time_sec: 42
          setup_hours: 3.5
          material_cost_cents_per_meter: 1850
          finished_mass_g: 18.3
          lights_out_eligible: true
          secondary_required: true
          secondary_minutes_per_piece: 0.4
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          part: $.data.id
      - call: POST /swiss-shop/gauges
        payload:
          gauge_code: MIC-207
          gauge_type: MICROMETER
          calibrated_at: '2026-08-15T00:00:00Z'
          calibration_due_at: '2027-02-15T00:00:00Z'
          grr_pct: 6.2
        as: QualityManager
        as_user_id: qm-1
        captures:
          gauge: $.data.id
      - call: POST /swiss-shop/characteristics
        payload:
          part_id: ${part}
          char_code: OD-A
          nominal: 6.35
          usl: 6.375
          lsl: 6.325
          sample_freq_pieces: 200
          required_gauge_type: MICROMETER
          cpk_min: 1.385
          subgroup_size: 5
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          charac: $.data.id
      - call: POST /swiss-shop/bar-stock-lots
        payload:
          heat_number: H-88231
          alloy_code: 303SS
          bar_diameter_mm: 12.7
          bar_length_mm: 3600
          bars_received: 20
          mass_kg_per_meter: 0.995
          feeder_slots: 1
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          lot: $.data.id
      - call: POST /swiss-shop/bar-stock-lots/${lot}/certify
        payload:
          certificate_number: CERT-1
        as: QualityManager
        as_user_id: qm-1
      - call: POST /swiss-shop/quotes
        payload:
          part_id: ${part}
          customer_code: ACME
          lot_qty: 200
          requested_lights_out_hours: 0
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          q1: $.data.id
      - call: POST /swiss-shop/quotes/${q1}/price
        payload:
          costing_basis: STANDARD_CYCLE
        as: ShopPlanner
        as_user_id: planner-1
      - call: POST /swiss-shop/quotes/${q1}/accept
        payload:
          customer_po_number: ACME-9911
          total_committed_qty: 200
          expires_on: '2027-06-30T00:00:00Z'
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          po: $.data.id
      - call: GET /swiss-shop/blanket-pos/${po}
        payload: {}
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          po_v: $.data.version
      - call: POST /swiss-shop/kanban-releases
        payload:
          blanket_po_id: ${po}
          qty: 200
          due_at: '2026-09-10T00:00:00Z'
          expected_blanket_po_version: ${po_v}
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          rel: $.data.id
      - call: GET /swiss-shop/machines/${mach}
        payload: {}
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          mach_v: $.data.version
      - call: POST /swiss-shop/work-orders
        payload:
          release_id: ${rel}
          machine_id: ${mach}
          bar_lot_id: ${lot}
          qty_ordered: 200
          scheduled_start_at: '2026-09-02T06:00:00Z'
          scheduled_end_at: '2026-09-02T14:00:00Z'
          expected_machine_version: ${mach_v}
          lights_out_hours: 4
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          wo: $.data.id
      trigger:
      - call: GET /swiss-shop/work-orders/${wo}
        payload: {}
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          req: $.data.required_length_mm
          bars: $.data.bars_reserved
          res: $.data.reserved_length_mm
      assert:
      - ${req} == 6000
      - ${bars} == 2
      - ${res} == 7200
      - BarStockLot.${lot}.available_length_mm == 64800
      - BarStockLot.${lot}.reserved_length_mm == 7200
  - name: server_mints_id_created_at_and_version_on_every_entity
    claim_type: system_fields
    grounds:
    - entities.Operator
    - entities.Machine
    - response_envelope.success
    distinguishing_aspect: |
      Every created row comes back with a server-minted bare UUID id carrying no type prefix, an ISO 8601 created_at with three fractional digits, and version 1; the response envelope carries meta.api_request_id and meta.api_request_timestamp.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z; empty database.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: ShopPlanner
        as_user_id: planner-1
      trigger:
      - call: POST /swiss-shop/operators
        payload:
          name: Rey Molina
          badge_code: BM-01
          certifications:
          - SWISS_SETUP
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          op_mach: $.data.id
      assert:
      - Operator.${op_mach}.id matches the bare UUID form with no prefix such as op_
      - Operator.${op_mach}.version == 1
      - Operator.${op_mach}.created_at ends with .000Z style three-digit fractional seconds
      - Operator.${op_mach}.status == ACTIVE
      - the response envelope contains meta.api_request_id and meta.api_request_timestamp
      - the response envelope response_type == object
  - name: create_characteristic_invalid_enum_returns_invalid_request
