  - section: cross_cutting_complexity_layers
    instances:
      - name: underwriting_case_create_rejects_a_stale_home_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[underwriting-case-create-stale-home]
          - validations[V100]
          - errors[ERR_STALE_HOME_VERSION]
        distinguishing_aspect: |
          The OCC field is a pure version comparison, not a workflow guard: version 1 is refused with
          412 once a PATCH has moved the home to version 2, the same payload with 2 is accepted, and a
          second create with that unchanged version 2 also succeeds and supersedes the first case -
          which proves the check is about staleness rather than about a case already existing.
        test_recipe:
          setup:
            - "Market ATL, PAINT template and Home H1 exist; H1 was created at version 1 and then patched to asking rent 220000, which advanced it to version 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: System
            - call: "POST /markets"
              payload: { code: "ATL", name: "Atlanta", tax_jurisdiction_code: "GA-FULTON", millage_bps: 125, rent_index_cents: 210000, cost_index_bps: 10250, cost_variance_tolerance_bps: 1000, make_ready_target_days: 30, turn_holdback_cap_bps: 1500, showing_buffer_minutes: 30, min_showing_duration_minutes: 30, pet_deposit_per_pet_cents: 30000, pet_deposit_cap_cents: 50000, max_pets: 2, restricted_breeds: ["PIT_BULL", "ROTTWEILER"], standard_lease_term_months: 12, fraud_block_threshold_bps: 6000, rent_to_income_max_bps: 4000, vacancy_loss_bps: 500, bad_debt_bps: 100, mgmt_fee_bps: 800, underwriting_yield_floor_bps: 500, disposition_yield_floor_bps: 540, max_rent_concession_bps: 500 }
