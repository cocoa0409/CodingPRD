  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: state_salary_floor_boundary_is_exact_to_the_cent
        grounds:
          - calculations.exemption_test_evaluation
          - entities.ExemptionAnalysis.fields.applicable_salary_floor_cents
          - entities.Position.fields.weekly_salary_cents
          - constants.FEDERAL_MIN_WEEKLY_SALARY_CENTS
        distinguishing_aspect: |
          Value domain: money, at the salary-threshold boundary. Two Positions in Texas differ
          by 52 cents of annual salary, which is exactly one cent of weekly salary: 4388800 / 52
          floors to 84400 (equal to FEDERAL_MIN_WEEKLY_SALARY_CENTS, so the >= comparison
          passes) while 4388748 / 52 floors to 84399 (one cent short, so it fails). Everything
          else about the two Positions is identical, isolating the comparison operator and the
          floor-division truncation.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "StateRule TX: min_weekly_salary_cents 60000 (below the federal 84400, so the federal floor governs), duties_test_variant FEDERAL, hce_shortcut_recognized true, ic_test ECONOMIC_REALITY."
            - "One AuditProject in FIELDWORK with one JobFamily."
            - "Position A: PROFESSIONAL, requires_advanced_degree true, annual_salary_cents 4388800, incumbent_count 1, avg_weekly_hours 42, work_state_code TX."
            - "Position B: identical except annual_salary_cents 4388748."
            - "Each Position has a MANAGER and an INCUMBENT interview ATTESTED at 80.0 pct and 42 hours, so both are CORROBORATED with primary_duty_pct 80.0. Interviewer int-2 uses four back-to-back windows, which the zero-buffer calendar rule permits."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "pa-1"
