        distinguishing_aspect: "The ownership row at priority 3 compares X-User-ID with HealthVisit.nurse_id, so a second RN who is herself on ACTIVE coverage at the same building is still refused with 403 ERR_NOT_RESOURCE_OWNER rather than the priority-19 coverage error."
        test_recipe:
