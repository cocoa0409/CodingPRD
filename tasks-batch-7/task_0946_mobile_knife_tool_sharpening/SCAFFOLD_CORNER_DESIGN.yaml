scaffold_corner_design:
  - section: entities
    instances:
      - name: create_account_applies_declared_defaults_and_system_fields
        claim_type: defaults
        grounds:
          - entities.Account.fields.billing_mode
          - entities.Account.fields.tax_exempt
          - entities.Account.fields.credit_limit_cents
          - entities.Account.fields.status
          - entities.Account.fields.outstanding_balance_cents
        distinguishing_aspect: "An Account created with only the four required fields comes back with billing_mode PER_VISIT, tax_exempt false, credit_limit_cents 50000, status ACTIVE, outstanding_balance_cents 0 and version 1."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /sharpening/technicians"
              payload: { full_name: "Ada Grind" }
              as: PlatformAdmin
              captures: { tech: $.data.id }
          trigger:
            - call: "POST /sharpening/accounts"
              payload: { name: "Blue Fork Kitchen", account_type: "RESTAURANT", zone_code: "ZONE_N", contact_email: "ops@bluefork.test" }
              as: PlatformAdmin
              captures: { acct: $.data.id, v: $.data.version }
          assert:
            - "HTTP status == 201"
            - "Account.${acct}.billing_mode == PER_VISIT"
            - "Account.${acct}.tax_exempt == false"
            - "Account.${acct}.credit_limit_cents == 50000"
            - "Account.${acct}.status == ACTIVE"
            - "Account.${acct}.outstanding_balance_cents == 0"
            - "Account.${acct}.version == 1"
            - "Technician.${tech}.certifications == []"

      - name: get_service_request_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /sharpening/service-requests/{id}]
          - entities.ServiceRequest.fields.status
          - entities.ServiceRequest.fields.billing_status
        distinguishing_aspect: "A freshly created ServiceRequest reads back with status DRAFT, billing_status UNBILLED, item_count 0 and quoted_total_cents 0."
        test_recipe:
          setup:
            - "One ACTIVE Account and one DRAFT ServiceRequest with no items."
          setup_api_calls:
            - call: "POST /sharpening/accounts"
              payload: { name: "Blue Fork Kitchen", account_type: "RESTAURANT", zone_code: "ZONE_N", contact_email: "ops@bluefork.test" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /sharpening/service-requests"
              payload: { account_id: "${acct}", channel: "VAN_ROUTE", requested_date: "2026-05-04" }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { sr: $.data.id }
          trigger:
            - call: "GET /sharpening/service-requests/${sr}"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { st: $.data.status }
          assert:
            - "HTTP status == 200"
            - "ServiceRequest.${sr}.status == DRAFT"
            - "ServiceRequest.${sr}.billing_status == UNBILLED"
            - "ServiceRequest.${sr}.item_count == 0"
            - "ServiceRequest.${sr}.quoted_total_cents == 0"
            - "ServiceRequest.${sr}.priority == STANDARD"

      - name: list_request_items_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /sharpening/request-items]
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three items filtered by service_request_id with limit 2 and offset 0 return exactly 2 rows, total_count 3 and has_more true."
        test_recipe:
          setup:
            - "One DRAFT ServiceRequest holding three CHEF_KNIFE items."
          setup_api_calls:
            - call: "POST /sharpening/item-class-specs"
              payload: { item_class: "CHEF_KNIFE", bevel_angle_degrees: 20, base_service_minutes: 6, list_price_cents: 900, required_certification: "NONE", price_tier: "TIER_1", min_locker_size: "SMALL", loaner_eligible: true }
              as: PlatformAdmin
              captures: { spec_chef: $.data.id }
            - call: "POST /sharpening/accounts"
              payload: { name: "Blue Fork Kitchen", account_type: "RESTAURANT", zone_code: "ZONE_N", contact_email: "ops@bluefork.test" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /sharpening/service-requests"
              payload: { account_id: "${acct}", channel: "VAN_ROUTE", requested_date: "2026-05-04" }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { sr: $.data.id }
            - call: "POST /sharpening/service-requests/${sr}/items"
              payload: { item_class_spec_id: "${spec_chef}", item_class: "CHEF_KNIFE", declared_damage_tier: "ROUTINE_HONE" }
              as: AccountOwner
              as_user_id: "${acct}"
            - call: "POST /sharpening/service-requests/${sr}/items"
              payload: { item_class_spec_id: "${spec_chef}", item_class: "CHEF_KNIFE", declared_damage_tier: "CHIP_REPAIR" }
              as: AccountOwner
              as_user_id: "${acct}"
            - call: "POST /sharpening/service-requests/${sr}/items"
              payload: { item_class_spec_id: "${spec_chef}", item_class: "CHEF_KNIFE", declared_damage_tier: "RE_TIP" }
              as: AccountOwner
              as_user_id: "${acct}"
          trigger:
            - call: "GET /sharpening/request-items"
              payload: { service_request_id: "${sr}", limit: 2, offset: 0 }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { first_item: "$.data[0].id" }
          assert:
            - "HTTP status == 200"
            - "response_type == array"
            - "meta pagination total_count == 3"
            - "meta pagination has_more == true"
            - "len(data) == 2"
            - "ServiceRequest.${sr}.item_count == 3"
            - "ServiceRequest.${sr}.quoted_total_cents == 4365"

      - name: get_route_run_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_ROUTE_RUN_NOT_FOUND]
        distinguishing_aspect: "A GET on a well-formed but unknown RouteRun id answers 404 ERR_ROUTE_RUN_NOT_FOUND."
        test_recipe:
          setup:
            - "No RouteRun exists."
          setup_api_calls:
            - call: "POST /sharpening/vans"
              payload: { code: "VAN-01" }
              as: PlatformAdmin
              captures: { van: $.data.id }
          trigger:
            - call: "GET /sharpening/route-runs/99999999-8888-4777-8666-555555555555"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_ROUTE_RUN_NOT_FOUND"

      - name: create_service_request_missing_channel_returns_validation_error
        claim_type: required_fields
        grounds:
          - validations[priority=4]
          - errors[ERR_VALIDATION]
          - endpoints[POST /sharpening/service-requests]
        distinguishing_aspect: "Omitting the required channel field answers 400 ERR_VALIDATION and creates nothing."
        test_recipe:
          setup:
            - "One ACTIVE Account."
          setup_api_calls:
            - call: "POST /sharpening/accounts"
              payload: { name: "Blue Fork Kitchen", account_type: "RESTAURANT", zone_code: "ZONE_N", contact_email: "ops@bluefork.test" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
          trigger:
            - call: "POST /sharpening/service-requests"
              payload: { account_id: "${acct}", requested_date: "2026-05-04" }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_VALIDATION"

      - name: create_item_with_unknown_damage_tier_returns_invalid_enum
        claim_type: type_constraints
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_ENUM]
          - entities.RequestItem.fields.declared_damage_tier
        distinguishing_aspect: "declared_damage_tier is on the closed list that routes to ERR_INVALID_ENUM, so a bogus tier answers 422 ERR_INVALID_ENUM and not ERR_VALIDATION."
        test_recipe:
          setup:
            - "One CHEF_KNIFE spec and one DRAFT ServiceRequest."
          setup_api_calls:
            - call: "POST /sharpening/item-class-specs"
              payload: { item_class: "CHEF_KNIFE", bevel_angle_degrees: 20, base_service_minutes: 6, list_price_cents: 900, required_certification: "NONE", price_tier: "TIER_1", min_locker_size: "SMALL", loaner_eligible: true }
              as: PlatformAdmin
              captures: { spec_chef: $.data.id }
            - call: "POST /sharpening/accounts"
              payload: { name: "Blue Fork Kitchen", account_type: "RESTAURANT", zone_code: "ZONE_N", contact_email: "ops@bluefork.test" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /sharpening/service-requests"
              payload: { account_id: "${acct}", channel: "VAN_ROUTE", requested_date: "2026-05-04" }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { sr: $.data.id }
          trigger:
            - call: "POST /sharpening/service-requests/${sr}/items"
              payload: { item_class_spec_id: "${spec_chef}", item_class: "CHEF_KNIFE", declared_damage_tier: "POLISH" }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_INVALID_ENUM"
            - "ServiceRequest.${sr}.item_count == 0"

      - name: route_run_omitting_budget_and_cap_copies_van_defaults
        claim_type: defaults
        grounds:
          - entities.RouteRun.fields.service_minute_budget
          - entities.RouteRun.fields.stop_cap
          - entities.Van.fields.default_service_minute_budget
          - endpoints[POST /sharpening/route-runs]
        distinguishing_aspect: "A run created without service_minute_budget or stop_cap inherits the van's 300 and 5, not the global 420 and 8."
        test_recipe:
          setup:
            - "One Van with default_service_minute_budget 300 and default_stop_cap 5."
          setup_api_calls:
            - call: "POST /sharpening/vans"
              payload: { code: "VAN-07", default_service_minute_budget: 300, default_stop_cap: 5 }
              as: PlatformAdmin
              captures: { van: $.data.id }
            - call: "POST /sharpening/technicians"
              payload: { full_name: "Ada Grind", certifications: [] }
              as: PlatformAdmin
              captures: { tech: $.data.id }
          trigger:
            - call: "POST /sharpening/route-runs"
              payload: { van_id: "${van}", technician_id: "${tech}", run_date: "2026-05-04", zone_code: "ZONE_S" }
              as: Dispatcher
              captures: { run: $.data.id }
          assert:
            - "HTTP status == 201"
            - "RouteRun.${run}.service_minute_budget == 300"
            - "RouteRun.${run}.stop_cap == 5"
            - "RouteRun.${run}.day_window_start == 08:00"
            - "RouteRun.${run}.day_window_end == 17:00"
            - "RouteRun.${run}.status == PLANNED"
            - "RouteRun.${run}.committed_minutes_final == null"

      - name: item_quoted_price_and_minutes_are_computed_not_supplied
        claim_type: computed_fields
        grounds:
          - calculations.item_service_price
          - calculations.item_service_minutes
          - entities.RequestItem.fields.quoted_gross_cents
        distinguishing_aspect: "POST items accepts only the spec, class and declared tier; the response's quoted_gross_cents 2700, final_gross_cents 2700 and service_minutes_declared 26 are derived entirely from ItemClassSpec and DAMAGE_PRICE_MULT/DAMAGE_MINUTES_ADD."
        test_recipe:
          setup:
            - "One CHEF_KNIFE spec with list_price_cents 900 and base_service_minutes 6."
            - "One DRAFT ServiceRequest."
          setup_api_calls:
            - call: "POST /sharpening/item-class-specs"
              payload: { item_class: "CHEF_KNIFE", bevel_angle_degrees: 20, base_service_minutes: 6, list_price_cents: 900, required_certification: "NONE", price_tier: "TIER_1", min_locker_size: "SMALL", loaner_eligible: true }
              as: PlatformAdmin
              captures: { spec_chef: $.data.id }
            - call: "POST /sharpening/accounts"
              payload: { name: "Blue Fork Kitchen", account_type: "RESTAURANT", zone_code: "ZONE_N", contact_email: "ops@bluefork.test" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /sharpening/service-requests"
              payload: { account_id: "${acct}", channel: "VAN_ROUTE", requested_date: "2026-05-04" }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { sr: $.data.id }
          trigger:
            - call: "POST /sharpening/service-requests/${sr}/items"
              payload: { item_class_spec_id: "${spec_chef}", item_class: "CHEF_KNIFE", declared_damage_tier: "HANDLE_WORK" }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { item: $.data.id }
          assert:
            - "RequestItem.${item}.quoted_gross_cents == 2700"
            - "RequestItem.${item}.final_gross_cents == 2700"
            - "RequestItem.${item}.service_minutes_declared == 26"
            - "RequestItem.${item}.service_minutes_assessed == null"
            - "RequestItem.${item}.custody_location == CUSTOMER"
            - "RequestItem.${item}.service_status == INTAKE_PENDING"
            - "RequestItem.${item}.allowance_applied == false"

      - name: add_item_to_unknown_service_request_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=3]
          - errors[ERR_SERVICE_REQUEST_NOT_FOUND]
        distinguishing_aspect: "The parent id in the path is resolved before the body, so an unknown ServiceRequest id answers 404 ERR_SERVICE_REQUEST_NOT_FOUND even when the body's spec id is also unknown."
        test_recipe:
          setup:
            - "One ACTIVE Account exists; no ServiceRequest exists."
          setup_api_calls:
            - call: "POST /sharpening/accounts"
              payload: { name: "Blue Fork Kitchen", account_type: "RESTAURANT", zone_code: "ZONE_N", contact_email: "ops@bluefork.test" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
          trigger:
            - call: "POST /sharpening/service-requests/12121212-3434-4565-8787-909090909090/items"
              payload: { item_class_spec_id: "45454545-6767-4898-8989-101010101010", item_class: "CHEF_KNIFE", declared_damage_tier: "ROUTINE_HONE" }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_SERVICE_REQUEST_NOT_FOUND"
            - "error_id != ERR_ITEM_CLASS_SPEC_NOT_FOUND"

      - name: invoice_line_is_append_only_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.InvoiceLine.common_fields
          - endpoints[GET /sharpening/invoice-lines/{id}]
        distinguishing_aspect: "InvoiceLine is declared common_fields false, so a read of a line exposes id, created_at, invoice_id, source, amount_cents, taxable and sequence_index but no version field and no update endpoint exists for it."
        test_recipe:
          setup:
            - "One DRAFT Invoice minted by a subscription pause, holding a single PRORATION_CREDIT line of -12000."
          setup_api_calls:
            - call: "POST /sharpening/plan-tiers"
              payload: { code: "BLADE_BASIC", monthly_fee_cents: 12000, included_items_per_cycle: 2, overage_discount_pct: 0.15, allowed_cadences: ["WEEKLY", "BIWEEKLY", "MONTHLY"] }
              as: PlatformAdmin
              captures: { tier: $.data.id }
            - call: "POST /sharpening/accounts"
              payload: { name: "Blue Fork Kitchen", account_type: "RESTAURANT", zone_code: "ZONE_N", contact_email: "ops@bluefork.test" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /sharpening/subscriptions"
              payload: { account_id: "${acct}", plan_tier_id: "${tier}", cadence: "MONTHLY", anchor_date: "2026-05-01" }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { sub: $.data.id }
            - call: "POST /sharpening/subscriptions/${sub}/pause"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct}"
            - call: "GET /sharpening/invoices"
              payload: { account_id: "${acct}", status: "DRAFT" }
              as: BillingClerk
              captures: { inv: "$.data[0].id" }
          trigger:
            - call: "GET /sharpening/invoices/${inv}/lines"
              payload: {}
              as: BillingClerk
              captures: { line: "$.data[0].id", amt: "$.data[0].amount_cents" }
          assert:
            - "HTTP status == 200"
            - "InvoiceLine.${line}.source == PRORATION_CREDIT"
            - "InvoiceLine.${line}.amount_cents == -12000"
            - "InvoiceLine.${line}.taxable == true"
            - "InvoiceLine.${line}.sequence_index == 1"
            - "InvoiceLine body has no version key"
            - "Invoice.${inv}.taxable_subtotal_cents == -12000"
            - "Invoice.${inv}.tax_cents == 0"
            - "Invoice.${inv}.total_cents == -12000"

      - name: duplicate_item_class_spec_is_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=45]
          - errors[ERR_DUPLICATE_ITEM_CLASS_SPEC]
        distinguishing_aspect: "item_class is unique across ItemClassSpec, so a second CHEF_KNIFE spec answers 409 ERR_DUPLICATE_ITEM_CLASS_SPEC."
        test_recipe:
          setup:
            - "One CHEF_KNIFE ItemClassSpec already exists."
          setup_api_calls:
            - call: "POST /sharpening/item-class-specs"
              payload: { item_class: "CHEF_KNIFE", bevel_angle_degrees: 20, base_service_minutes: 6, list_price_cents: 900, required_certification: "NONE", price_tier: "TIER_1", min_locker_size: "SMALL", loaner_eligible: true }
              as: PlatformAdmin
              captures: { spec_chef: $.data.id }
          trigger:
            - call: "POST /sharpening/item-class-specs"
              payload: { item_class: "CHEF_KNIFE", bevel_angle_degrees: 22, base_service_minutes: 7, list_price_cents: 1000, required_certification: "NONE", price_tier: "TIER_1", min_locker_size: "SMALL", loaner_eligible: false }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_DUPLICATE_ITEM_CLASS_SPEC"
            - "ItemClassSpec.${spec_chef}.list_price_cents == 900"

      - name: duplicate_bench_day_date_is_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=46]
          - errors[ERR_DUPLICATE_BENCH_DAY]
        distinguishing_aspect: "bench_date is unique across BenchDay, so a second BenchDay for 2026-05-01 answers 409 ERR_DUPLICATE_BENCH_DAY."
        test_recipe:
          setup:
            - "One BenchDay for 2026-05-01 already exists."
          setup_api_calls:
            - call: "POST /sharpening/bench-days"
              payload: { bench_date: "2026-05-01", bench_minute_budget: 480 }
              as: PlatformAdmin
              captures: { bench: $.data.id }
          trigger:
            - call: "POST /sharpening/bench-days"
              payload: { bench_date: "2026-05-01", bench_minute_budget: 240 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_DUPLICATE_BENCH_DAY"
            - "BenchDay.${bench}.bench_minute_budget == 480"
            - "BenchDay.${bench}.booked_minutes == 0"

  - section: state_machines
    instances:
      - name: submitting_an_already_submitted_request_returns_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.ServiceRequest.DRAFT_to_SUBMITTED
          - validations[priority=14]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "The second submit sees status SUBMITTED, which is not a declared from-state of DRAFT -> SUBMITTED, so it answers 409 ERR_INVALID_STATE and nothing changes."
        test_recipe:
          setup:
            - "One SUBMITTED ServiceRequest holding one CHEF_KNIFE item."
          setup_api_calls:
            - call: "POST /sharpening/item-class-specs"
              payload: { item_class: "CHEF_KNIFE", bevel_angle_degrees: 20, base_service_minutes: 6, list_price_cents: 900, required_certification: "NONE", price_tier: "TIER_1", min_locker_size: "SMALL", loaner_eligible: true }
              as: PlatformAdmin
              captures: { spec_chef: $.data.id }
            - call: "POST /sharpening/accounts"
              payload: { name: "Blue Fork Kitchen", account_type: "RESTAURANT", zone_code: "ZONE_N", contact_email: "ops@bluefork.test" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /sharpening/service-requests"
              payload: { account_id: "${acct}", channel: "VAN_ROUTE", requested_date: "2026-05-04" }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { sr: $.data.id }
            - call: "POST /sharpening/service-requests/${sr}/items"
              payload: { item_class_spec_id: "${spec_chef}", item_class: "CHEF_KNIFE", declared_damage_tier: "ROUTINE_HONE" }
              as: AccountOwner
              as_user_id: "${acct}"
            - call: "POST /sharpening/service-requests/${sr}/submit"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct}"
          trigger:
            - call: "POST /sharpening/service-requests/${sr}/submit"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"
            - "ServiceRequest.${sr}.status == SUBMITTED"

      - name: cancelling_an_already_cancelled_request_returns_already_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.ServiceRequest.DRAFT_to_CANCELLED
          - validations[priority=13]
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "CANCELLED is a terminal state of the fulfillment axis, so a second cancel answers 409 ERR_ALREADY_TERMINAL rather than ERR_INVALID_STATE, because rung 13 sits above rung 14."
        test_recipe:
          setup:
            - "One CANCELLED ServiceRequest that was cancelled straight out of DRAFT."
          setup_api_calls:
            - call: "POST /sharpening/accounts"
              payload: { name: "Blue Fork Kitchen", account_type: "RESTAURANT", zone_code: "ZONE_N", contact_email: "ops@bluefork.test" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /sharpening/service-requests"
              payload: { account_id: "${acct}", channel: "VAN_ROUTE", requested_date: "2026-05-04" }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { sr: $.data.id }
            - call: "POST /sharpening/service-requests/${sr}/cancel"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct}"
          trigger:
            - call: "POST /sharpening/service-requests/${sr}/cancel"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_ALREADY_TERMINAL"
            - "error_id != ERR_INVALID_STATE"
            - "ServiceRequest.${sr}.status == CANCELLED"

      - name: resuming_an_active_subscription_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Subscription.PAUSED_to_ACTIVE
          - validations[priority=14]
        distinguishing_aspect: "resume declares PAUSED as its only from-state, so calling it on an ACTIVE subscription answers 409 ERR_INVALID_STATE with anchor_date and next_service_date untouched."
        test_recipe:
          setup:
            - "One ACTIVE MONTHLY Subscription anchored 2026-06-01 with next_service_date 2026-06-01."
          setup_api_calls:
            - call: "POST /sharpening/plan-tiers"
              payload: { code: "BLADE_BASIC", monthly_fee_cents: 12000, included_items_per_cycle: 2, overage_discount_pct: 0.15, allowed_cadences: ["WEEKLY", "BIWEEKLY", "MONTHLY"] }
              as: PlatformAdmin
              captures: { tier: $.data.id }
            - call: "POST /sharpening/accounts"
              payload: { name: "Blue Fork Kitchen", account_type: "RESTAURANT", zone_code: "ZONE_N", contact_email: "ops@bluefork.test" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
