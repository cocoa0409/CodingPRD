  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: production_unit_assembly_and_quality_dimensions_advance_independently
        grounds:
          - state_machines.ProductionUnit.IN_STATION_to_ASSEMBLED
          - state_machines.ProductionUnit.PENDING_to_SAFETY_PASSED
          - state_machines.ProductionUnit.ASSEMBLED_to_REWORK
          - state_machines.ProductionUnit.QUARANTINED_to_PENDING
          - entities.ProductionUnit.fields.rework_count
        distinguishing_aspect: |
          PARALLEL shape: assembly_status advances IN_STATION -> ASSEMBLED while
          quality_status is still SAFETY_PASSED, and a later LEAK failure drags
          the assembly dimension backwards to REWORK from ASSEMBLED, after which
          clear-quarantine returns the pair to (IN_STATION, PENDING) — a cycle no
          single-dimension machine can express.
        test_recipe:
          setup:
            - "Base fixture through unit1 released from BuildSlot index 1"
            - "unit1 has one passing ELECTRICAL_SAFETY test (0.30), so the pair is (IN_STATION, SAFETY_PASSED)"
          setup_api_calls:
            - *k_clock
            - *k_line
            - *k_st10
            - *k_st20
            - *k_sup1
            - *k_pdoor
            - *k_wmx
            - *k_bomx
            - *k_relx
            - *k_lineread
            - *k_shifta
            - *k_slot1
            - *k_seq1
            - *k_rel1
            - *k_hipot1
          trigger:
            - call: "POST /production-units/${unit1_id}/complete-assembly"
              payload: {}
              as: LineOperator
            - call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "FUNCTIONAL_CYCLE", measured_value: 3 }
              as: QualityInspector
            - call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "LEAK", measured_value: 1.10 }
              as: QualityInspector
            - call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "LEAK", measured_value: 2.50 }
              as: QualityInspector
            - call: "POST /production-units/${unit1_id}/clear-quarantine"
              payload: { note: "reseal and retest" }
              as: QualityInspector
          assert:
            - "After trigger call 1 the response has assembly_status == ASSEMBLED and quality_status == SAFETY_PASSED, and BuildSlot.${slot1_id}.status == BUILT"
            - "After trigger call 2 (FUNCTIONAL_CYCLE 3 >= 3, PASS) quality_status is still SAFETY_PASSED because WM-X.requires_leak_test is true"
            - "After trigger call 3 (LEAK 1.10 <= 2.00, PASS) quality_status == GATED while assembly_status is still ASSEMBLED"
            - "After trigger call 4 (LEAK 2.50 > 2.00, FAIL) quality_status == QUARANTINED, assembly_status == REWORK, rework_count == 1, and BuildSlot.${slot1_id}.status is still BUILT"
            - "After trigger call 5 the pair is (IN_STATION, PENDING), rework_count stays 1, GET /production-units/${unit1_id}/quality-tests shows exactly one QualityTest with status VOIDED (the LEAK 2.50 row) and the LEAK 1.10 row still RECORDED"

      - name: engineering_change_revision_loop_cancels_at_round_cap
        grounds:
          - state_machines.EngineeringChange.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.EngineeringChange.REVISION_REQUESTED_to_SUBMITTED
          - state_machines.EngineeringChange.UNDER_REVIEW_to_CANCELLED
          - entities.EngineeringChange.fields.revision_round
        distinguishing_aspect: |
          CYCLIC shape with a terminating counter: the change loops
          SUBMITTED -> UNDER_REVIEW -> REVISION_REQUESTED three times, and the
          fourth REQUEST_REVISION does NOT return to REVISION_REQUESTED but
          lands in terminal CANCELLED with revision_round 4, releasing the
          affected part back to ACTIVE.
        test_recipe:
          setup:
            - "Base fixture through WM-X RELEASED with its BOM position POS-DOOR on P-DOOR-A"
            - "A DRAFT EngineeringChange EC1 replacing POS-DOOR on WM-X, target line L1, cut_in_sequence_index 5"
          setup_api_calls:
            - *k_clock
            - *k_line
            - *k_st10
            - *k_st20
            - *k_sup1
            - *k_pdoor
            - *k_wmx
            - *k_bomx
            - *k_relx
            - &k_ec1
              call: "POST /engineering-changes"
              payload: { model_variant_id: "${wmx_id}", affected_part_id: "${p_door_id}", target_line_id: "${line_id}", bom_position_code: "POS-DOOR", cut_in_sequence_index: 5 }
              as: EngineeringLead
              captures: { ec1_id: $.data.id }
          trigger:
            - call: "POST /engineering-changes/${ec1_id}/submit"
              payload: {}
              as: EngineeringLead
              as_user_id: "eng-alice"
            - call: "POST /engineering-changes/${ec1_id}/start-review"
              payload: {}
              as: EngineeringLead
              as_user_id: "eng-alice"
            - call: "POST /engineering-changes/${ec1_id}/decide"
              payload: { decision: "REQUEST_REVISION", note: "round 1" }
              as: EngineeringLead
              as_user_id: "eng-bob"
            - call: "POST /engineering-changes/${ec1_id}/submit"
              payload: {}
              as: EngineeringLead
              as_user_id: "eng-alice"
            - call: "POST /engineering-changes/${ec1_id}/start-review"
              payload: {}
              as: EngineeringLead
              as_user_id: "eng-alice"
            - call: "POST /engineering-changes/${ec1_id}/decide"
              payload: { decision: "REQUEST_REVISION", note: "round 2" }
              as: EngineeringLead
              as_user_id: "eng-bob"
            - call: "POST /engineering-changes/${ec1_id}/submit"
              payload: {}
              as: EngineeringLead
              as_user_id: "eng-alice"
            - call: "POST /engineering-changes/${ec1_id}/start-review"
              payload: {}
              as: EngineeringLead
              as_user_id: "eng-alice"
            - call: "POST /engineering-changes/${ec1_id}/decide"
              payload: { decision: "REQUEST_REVISION", note: "round 3" }
              as: EngineeringLead
              as_user_id: "eng-bob"
            - call: "POST /engineering-changes/${ec1_id}/submit"
              payload: {}
              as: EngineeringLead
              as_user_id: "eng-alice"
            - call: "POST /engineering-changes/${ec1_id}/start-review"
              payload: {}
              as: EngineeringLead
              as_user_id: "eng-alice"
            - call: "POST /engineering-changes/${ec1_id}/decide"
              payload: { decision: "REQUEST_REVISION", note: "round 4 exceeds the cap" }
              as: EngineeringLead
              as_user_id: "eng-bob"
          assert:
            - "After the third decide, EngineeringChange.${ec1_id}.status == REVISION_REQUESTED with revision_round == 3"
            - "After the fourth decide, EngineeringChange.${ec1_id}.status == CANCELLED with revision_round == 4 — not REVISION_REQUESTED"
            - "EngineeringChange.${ec1_id}.decided_by_user_id == eng-bob and submitted_by_user_id == eng-alice"
            - "Part.${p_door_id}.lifecycle_status == ACTIVE (the CHANGE_PENDING hold placed by each submit is released by the cancellation)"
            - "A further POST /engineering-changes/${ec1_id}/submit returns 409 ERR_INVALID_STATE — CANCELLED is terminal"

      - name: warranty_disposition_branches_produce_divergent_side_effects
        grounds:
          - state_machines.WarrantyReturn.TEARDOWN_to_ANALYZED_SUPPLIER
          - state_machines.WarrantyReturn.TEARDOWN_to_ANALYZED_DESIGN
          - calculations.supplier_on_time_score
          - entities.Part.fields.field_failure_count
        distinguishing_aspect: |
          BRANCHING shape: SUPPLIER_DEFECT charges the supplier 10 score points
          and mints no EngineeringChange, while DESIGN_DEFECT leaves the supplier
          score untouched and mints a WARRANTY-origin change in SUBMITTED that
          puts the part into CHANGE_PENDING — the two branches touch disjoint
          entity sets from the same TEARDOWN state.
        test_recipe:
          setup:
            - "Base fixture with two units (indexes 1 and 2) certified, assembled and SHIPPED, clock at 2026-08-03T12:00:00Z"
            - "Two WarrantyReturns exist and are both in TEARDOWN: WR1 on unit1 (field_hours 500) and WR2 on unit2 (field_hours 400)"
          setup_api_calls:
            - *k_clock
            - *k_line
            - *k_st10
            - *k_st20
            - *k_sup1
            - *k_pdoor
            - *k_wmx
            - *k_bomx
            - *k_relx
            - *k_lineread
            - *k_shifta
            - *k_slot1
            - *k_seq1
            - *k_rel1
            - *k_hipot1
            - *k_cyc1
            - *k_leak1
            - call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "ENERGY", measured_value: 380.00 }
              as: QualityInspector
            - call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "WATER", measured_value: 184.00 }
              as: QualityInspector
            - call: "POST /production-units/${unit1_id}/certify"
              payload: {}
              as: QualityInspector
            - call: "POST /production-units/${unit1_id}/complete-assembly"
              payload: {}
              as: LineOperator
            - call: "POST /production-units/${unit1_id}/ship"
              payload: {}
              as: LineOperator
            - *k_slot2
            - *k_seq2
            - *k_rel2
            - *k_gates2a
            - *k_gates2b
            - *k_gates2c
            - *k_gates2d
            - *k_gates2e
            - *k_cert2
            - *k_assy2
            - *k_ship2
            - *k_clock12
            - *k_wr1
            - *k_wr1_teardown
            - &k_wr2
              call: "POST /warranty-returns"
              payload: { production_unit_id: "${unit2_id}", failure_code: "F-DOOR-HINGE", field_hours: 400, returned_at: "2026-08-03T11:30:00Z" }
              as: WarrantyAnalyst
              captures: { wr2_id: $.data.id }
            - &k_wr2_teardown
              call: "POST /warranty-returns/${wr2_id}/teardown"
              payload: {}
              as: WarrantyAnalyst
          trigger:
            - call: "POST /warranty-returns/${wr1_id}/analyze"
              payload: { disposition: "SUPPLIER_DEFECT", root_cause_part_id: "${p_door_id}" }
              as: WarrantyAnalyst
            - call: "POST /warranty-returns/${wr2_id}/analyze"
              payload: { disposition: "DESIGN_DEFECT", root_cause_part_id: "${p_door_id}" }
              as: WarrantyAnalyst
          assert:
            - "WarrantyReturn.${wr1_id}.status == ANALYZED_SUPPLIER and engineering_change_id is null"
            - "Supplier.${sup1_id}.quality_penalty_count == 1 and on_time_score == 90.00 with status APPROVED (100.00 - 10)"
            - "GET /engineering-changes?source_warranty_return_id=${wr1_id} returns total_count == 0"
            - "WarrantyReturn.${wr2_id}.status == ANALYZED_DESIGN and engineering_change_id is not null"
            - "GET /engineering-changes?source_warranty_return_id=${wr2_id} returns total_count == 1 with status == SUBMITTED, origin == WARRANTY, affected_part_id == ${p_door_id} and replacement_part_id null"
            - "Part.${p_door_id}.field_failure_count == 2 and cohort_failure_rate_per_1000 == 1000.00 (1000 * 2 / 2)"
            - "Part.${p_door_id}.lifecycle_status == CHANGE_PENDING (set by the minted change's SUBMITTED state, not by the SUPPLIER_DEFECT branch)"
            - "Supplier.${sup1_id}.on_time_score is still 90.00 after the DESIGN_DEFECT branch — the design branch charges no supplier"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: checkpoint_miss_demotes_supplier_and_de_sequences_slot_depth_four
        grounds:
          - state_machines.DeliveryCall.SCHEDULED_to_MISSED
          - calculations.supplier_on_time_score
          - state_machines.DeliveryCall.SCHEDULED_to_CANCELLED
          - state_machines.BuildSlot.SEQUENCED_to_PLANNED
          - endpoints["POST /lines/{id}/run-checkpoint"]
        distinguishing_aspect: |
          Trigger POST /lines/{id}/run-checkpoint drives a four-link chain:
          call MISSED -> supplier score 40.00 and status PROBATION -> that
          supplier's remaining SCHEDULED call CANCELLED with cancel_reason
          SUPPLIER_PROBATION -> the BuildSlot pinned to that call de-sequenced
          with its shift labour released.
        test_recipe:
          setup:
            - "Clock 2026-08-03T06:00:00Z, Line L1, stations ST10/ST20, Supplier SUP1, sequenced module P-MOD-1 (line_side_max_units 1)"
            - "ModelVariant WM-M RELEASED: FAM_A, 1 option point, 100 labour minutes, one BOM position POS-MOD on P-MOD-1 at ST10 qty 1"
            - "ShiftPlan A 06:00-14:00 headcount 20, available_labor_minutes 480"
            - "Two delivery calls (06:00-06:30 and 06:40-07:10) were swept as MISSED by an earlier checkpoint at 07:26, leaving SUP1 at on_time_score 60.00 and still APPROVED"
            - "Call C3 (07:30-08:00) is overdue and call C4 (09:00-10:00) covers the build slot"
            - "BuildSlot index 1 (planned_start 09:30) is SEQUENCED and pinned to C4"
            - "Clock advanced to 2026-08-03T08:16:00Z, past C3's window_end plus the 15-minute grace"
          setup_api_calls:
            - *k_clock
            - *k_line
            - *k_st10
            - *k_st20
            - *k_sup1
            - &k_pmod
              call: "POST /parts"
              payload: { part_number: "P-MOD-1", supplier_id: "${sup1_id}", is_sequenced_module: true, line_side_max_units: 1 }
              as: PlantAdmin
              captures: { p_mod_id: $.data.id }
            - &k_wmm
              call: "POST /model-variants"
