              captures: { case_b3: $.data.id }
          trigger:
            - call: "POST /v1/help-desk-cases/${case_b3}/resolve"
              payload: { resolution: "REJECTED" }
              as: HelpDeskAgent
              as_user_id: "hd1"
              captures: { err_b3: $.data.error_id }
            - call: "POST /v1/help-desk-cases/${case_b3}/resolve"
