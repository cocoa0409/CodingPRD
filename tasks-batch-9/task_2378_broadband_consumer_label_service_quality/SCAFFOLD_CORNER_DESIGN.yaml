              as: NetworkEngineer
              captures: { run_a_id: $.data.id }

            - call: "GET /service-plans/${plan_id}"
              payload: {}
              as: NetworkEngineer
              captures: { plan_v1: $.data.version }
            - call: "POST /performance-attestations"
              payload: { plan_id: "${plan_id}", methodology_doc_id: "${doc_id}", metric_variant: "PEAK_HOUR_MEDIAN", expected_plan_version: "${plan_v1}" }
              as: NetworkEngineer
              captures: { att_id: $.data.id }

            - call: "POST /performance-attestations/${att_id}/certify"
              payload: {}
              as: ComplianceOfficer

            - call: "GET /service-plans/${plan_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { plan_v2: $.data.version }
            - call: "POST /label-versions"
              payload: { plan_id: "${plan_id}", effective_from: "2026-09-01T00:00:00Z", accessibility_conformance: "WCAG_AA", expected_plan_version: "${plan_v2}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { lv1_id: $.data.id }
            - call: "POST /label-versions/${lv1_id}/translations"
              payload: { locale: "en-US", translated_summary: "Fiber 300 broadband consumer label", machine_translated: false }
              as: LocalizationSpecialist
              as_user_id: "loc-1"
              captures: { tr_en_id: $.data.id }
            - call: "POST /label-versions/${lv1_id}/translations/${tr_en_id}/verify"
              payload: {}
              as: LocalizationSpecialist
              as_user_id: "loc-2"

            - call: "POST /label-versions/${lv1_id}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-2"

            - call: "POST /subscriber-accounts"
