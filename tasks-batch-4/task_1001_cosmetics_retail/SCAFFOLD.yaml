scenario: |
  1001. Cosmetics & Beauty Retail (Sephora/Ulta style): SKU & shade/finder, sampling & tester,
  loyalty tier & points/redemption, BOPIS & ship-from-store, in-store services (brow/makeover)
  booking linkage, gift-with-purchase & bundle, hygiene/return policy, limited-launch allocation
domain_name: cosmetics-beauty-retail
api_prefix: "/"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: peer_roles
  consistency_model: immediate
  difficulty_level: Expert

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Store
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Store display name
      - name: region_code
        type: string
        source: input
        description: Two-letter region code (e.g. "CA")
      - name: status
        type: enum
        source: input
        description: Operational posture of the store
        default: ACTIVE
        constraints: "one of {ACTIVE, PAUSED}"
      - name: bopis_slot_capacity
        type: integer
        source: input
        description: Max orders that may occupy one 60-minute BOPIS pickup slot
        default: 2
        constraints: ">= 1"

  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Product (SKU family) name
      - name: brand
        type: string
        source: input
        description: Brand name
      - name: category
        type: enum
        source: input
        description: Merchandising category
        constraints: "one of {SKINCARE, MAKEUP, FRAGRANCE, HAIR}"
      - name: hygiene_class
        type: enum
        source: input
        description: Hygiene class governing tester conversion and returnability
        constraints: "one of {SEALED, TESTER_APPLIED, DIRECT_CONTACT}"
      - name: base_price_cents
        type: integer
        source: input
        description: Default price in cents inherited by variants that omit price_cents
        constraints: ">= 0"

  - name: Variant
    parent: Product
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the SKU family this shade/finish belongs to"
      - name: shade_name
        type: string
        source: input
        description: Human shade name (e.g. "Warm Sand")
      - name: shade_code
        type: string
        source: input
        description: Vendor shade code
      - name: finish
        type: enum
        source: input
        description: Finish of the shade
        constraints: "one of {MATTE, DEWY, SATIN}"
      - name: undertone
        type: enum
        source: input
        description: Undertone of the shade
        constraints: "one of {WARM, COOL, NEUTRAL}"
      - name: depth_index
        type: integer
        source: input
        description: Depth on the 1 (lightest) .. 12 (deepest) scale
        constraints: "1 <= depth_index <= 12"
      - name: price_cents
        type: integer
        source: input
        description: Selling price in cents; defaults to Product.base_price_cents when omitted
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Sellability of the variant
        default: ACTIVE
        constraints: "one of {ACTIVE, DISCONTINUED}"
      - name: is_limited_launch
        type: boolean
        source: input
        description: True when the variant is gated by limited-launch allocation
        default: false
      - name: launch_status
        type: enum
        source: system
        description: Launch gate state; NOT_LIMITED when is_limited_launch is false, else starts at SCHEDULED
        default: NOT_LIMITED
        constraints: "one of {NOT_LIMITED, SCHEDULED, TIER_ROUGE_ONLY, TIER_VIB_PLUS, PUBLIC, CLOSED}"
      - name: launch_open_rouge_at
        type: datetime
        source: input
        description: UTC instant at which the launch opens to ROUGE customers
      - name: launch_open_vib_at
        type: datetime
        source: input
        description: UTC instant at which the launch opens to VIB and ROUGE customers
      - name: launch_open_public_at
        type: datetime
        source: input
        description: UTC instant at which the launch opens to all tiers
      - name: per_customer_cap
        type: integer
        source: input
        description: Max units of this limited variant one Customer may hold across non-CANCELLED orders
        default: 2
        constraints: ">= 1"

  - name: InventoryLot
    parent: null
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; the store holding this lot"
      - name: variant_id
        type: string
        source: input
        description: "FK -> Variant.id; the SKU held in this lot"
      - name: units_received
        type: integer
        source: input
        description: Total units ever received into this lot; the conserved quantity
        constraints: ">= 0"
      - name: on_hand_units
        type: integer
        source: computed
        description: Units physically sellable and unreserved; initialised to units_received
      - name: reserved_units
        type: integer
        source: computed
        description: Units held by RESERVED / READY_FOR_PICKUP orders
        default: 0
      - name: tester_units
        type: integer
        source: computed
        description: Units converted to in-store testers; never sellable again
        default: 0
      - name: sold_units
        type: integer
        source: computed
        description: Units handed over or shipped to customers
        default: 0
      - name: destroyed_units
        type: integer
        source: computed
        description: Units destroyed on hygiene-mandated DESTROY return disposition
        default: 0
      - name: launch_reserved_units
        type: integer
        source: input
        description: Sub-count of on_hand_units earmarked for limited-launch draws (drawn first)
        default: 0
        constraints: "0 <= launch_reserved_units <= units_received"

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: Unique customer email
      - name: name
        type: string
        source: input
        description: Customer display name
      - name: tier
        type: enum
        source: system
        description: Loyalty tier; seeded from initial_tier, then driven by the tier_evaluation calculation
        default: INSIDER
        constraints: "one of {INSIDER, VIB, ROUGE}"
      - name: points_balance
        type: integer
        source: computed
        description: Current redeemable points; always equals the sum of this customer's PointsLedgerEntry.delta_points
        default: 0
      - name: qualifying_spend_cents
        type: integer
        source: computed
        description: Net cash spend inside the current loyalty cycle; drives tier_evaluation
        default: 0
      - name: lifetime_spend_cents
        type: integer
        source: computed
        description: Net cash spend across all cycles; never reset
        default: 0
      - name: cycle_started_at
        type: datetime
        source: system
        description: UTC instant the current loyalty cycle began; reset by the tier checkpoint
      - name: hygiene_strikes
        type: integer
        source: computed
        description: Count of return requests denied with deny_reason HYGIENE_VIOLATION
        default: 0
      - name: return_privilege
        type: enum
        source: computed
        description: Gate on creating new return requests; SUSPENDED once hygiene_strikes >= 3
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"

  - name: Promotion
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Promotion display name
      - name: promo_type
        type: enum
        source: input
        description: Kind of promotion
        constraints: "one of {GWP, SAMPLE, BUNDLE}"
      - name: threshold_cents
        type: integer
        source: input
        description: Minimum discounted_subtotal_cents at which a GWP/SAMPLE promotion becomes eligible
        default: 0
        constraints: ">= 0"
      - name: gift_variant_id
        type: string
        source: input
        description: "FK -> Variant.id; the gifted/sampled variant (GWP and SAMPLE only, null for BUNDLE)"
      - name: gift_quantity
        type: integer
        source: input
        description: Units of gift_variant_id attached when the promotion applies
        default: 1
        constraints: ">= 1"
      - name: bundle_variant_ids
        type: array
        source: input
        description: Array of Variant.id values that must ALL appear as SALE lines for a BUNDLE to apply; not a single-valued FK
      - name: bundle_discount_pct
        type: number
        source: input
        description: Fractional discount applied to each BUNDLE member line (e.g. 0.15)
        default: 0
        constraints: "0 <= bundle_discount_pct < 1"
      - name: priority
        type: integer
        source: input
        description: Tie-break rank when two promotions of the same type compete; lower wins
        default: 100
      - name: status
        type: enum
        source: input
        description: Whether the promotion may be selected
        default: ACTIVE
        constraints: "one of {ACTIVE, ENDED}"

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the buyer"
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; the fulfilling store"
      - name: channel
        type: enum
        source: input
        description: Fulfilment channel
        constraints: "one of {BOPIS, SHIP_FROM_STORE}"
      - name: pickup_slot_start
        type: datetime
        source: input
        description: UTC start of the 60-minute BOPIS pickup slot; required when channel is BOPIS, must be on the hour
      - name: allow_partial
        type: boolean
        source: input
        description: When true, reserve clips line quantities to available stock instead of failing
        default: false
      - name: points_redeemed
        type: integer
        source: input
        description: Points the buyer redeems on this order; must be a multiple of 100
        default: 0
        constraints: "points_redeemed % 100 == 0"
      - name: fulfillment_status
        type: enum
        source: system
        description: Fulfilment dimension of the parallel state machine
        default: DRAFT
        constraints: "one of {DRAFT, RESERVED, READY_FOR_PICKUP, PICKED_UP, SHIPPED, CANCELLED}"
      - name: payment_status
        type: enum
        source: system
        description: Payment dimension of the parallel state machine
        default: UNPAID
        constraints: "one of {UNPAID, AUTHORIZED, CAPTURED, PARTIALLY_REFUNDED, REFUNDED, VOIDED}"
      - name: pricing_variant
        type: enum
        source: computed
        description: Which variant of order_pricing produced the current money fields
        default: PROVISIONAL
        constraints: "one of {PROVISIONAL, FINAL}"
      - name: tier_at_reserve
        type: enum
        source: computed
        description: Customer.tier snapshotted at reserve; drives tier discount and points multiplier for this order
        constraints: "one of {INSIDER, VIB, ROUGE}"
      - name: subtotal_cents
        type: integer
        source: computed
        description: Sum of line_net_cents over SALE lines (per-line bundle rounding applied first)
        default: 0
      - name: tier_discount_cents
        type: integer
        source: computed
        description: Loyalty-tier discount applied to subtotal_cents
        default: 0
      - name: discounted_subtotal_cents
        type: integer
        source: computed
        description: subtotal_cents - tier_discount_cents; the base GWP/SAMPLE thresholds are tested against
        default: 0
      - name: gwp_eligible
        type: boolean
        source: computed
        description: True when a GWP promotion's threshold_cents <= discounted_subtotal_cents at the current pricing pass
        default: false
      - name: points_value_cents
        type: integer
        source: computed
        description: Cash value of points_redeemed at 500 cents per 100 points
        default: 0
      - name: total_due_cents
        type: integer
        source: computed
        description: discounted_subtotal_cents - points_value_cents; the amount charged
        default: 0
      - name: points_earned
        type: integer
        source: computed
        description: Points credited at fulfilment by the points_accrual calculation
        default: 0
      - name: refunded_cents
        type: integer
        source: computed
        description: Cumulative cash refunded through approved return requests
        default: 0
      - name: fulfilled_at
        type: datetime
        source: system
        description: Logical-clock instant the order reached PICKED_UP or SHIPPED; anchors the return window

  - name: OrderLine
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the owning order"
      - name: variant_id
        type: string
        source: input
        description: "FK -> Variant.id; the SKU on this line"
      - name: promotion_id
        type: string
        source: computed
        description: "FK -> Promotion.id; set on GWP and SAMPLE lines, null on SALE lines"
      - name: line_type
        type: enum
        source: computed
        description: Kind of line
        default: SALE
        constraints: "one of {SALE, GWP, SAMPLE}"
      - name: quantity
        type: integer
        source: input
        description: Units requested; clipped at reserve when Order.allow_partial is true
        constraints: ">= 1"
      - name: unit_price_cents
        type: integer
        source: computed
        description: Variant.price_cents snapshotted at line creation; 0 for GWP and SAMPLE lines
      - name: line_gross_cents
        type: integer
        source: computed
        description: unit_price_cents * quantity
        default: 0
      - name: line_discount_cents
        type: integer
        source: computed
        description: Bundle discount for this line, rounded HALF_UP per line
        default: 0
      - name: line_net_cents
        type: integer
        source: computed
        description: line_gross_cents - line_discount_cents
        default: 0
      - name: hygiene_class
        type: enum
        source: computed
        description: Product.hygiene_class snapshotted at line creation; governs return policy
        constraints: "one of {SEALED, TESTER_APPLIED, DIRECT_CONTACT}"
      - name: returned_quantity
        type: integer
        source: computed
        description: Units already returned through APPROVED return requests
        default: 0

  - name: PointsLedgerEntry
    parent: Customer
    common_fields: false
    fields:
      - name: customer_id
        type: string
        source: system
        description: "FK -> Customer.id; the ledger owner"
      - name: order_id
        type: string
        source: system
        description: "FK -> Order.id; the order that caused this entry, null for SEED entries"
      - name: entry_type
        type: enum
        source: system
        description: Cause of the points movement
        constraints: "one of {SEED, EARN, REDEEM, REVERSAL, CLAWBACK, SERVICE_BONUS}"
      - name: delta_points
        type: integer
        source: system
        description: Signed points movement; negative for REDEEM and CLAWBACK
      - name: balance_after
        type: integer
        source: system
        description: Customer.points_balance immediately after this entry was appended

  - name: Artist
    parent: null
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; the store the artist works at"
      - name: name
        type: string
        source: input
        description: Artist display name
      - name: skills
        type: array
        source: input
        description: Service types the artist may perform; subset of {BROW, MAKEOVER}
      - name: status
        type: enum
        source: input
        description: Whether the artist accepts bookings
        default: ACTIVE
        constraints: "one of {ACTIVE, INACTIVE}"

  - name: ServiceBooking
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; who booked"
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; where the service happens"
      - name: artist_id
        type: string
        source: input
        description: "FK -> Artist.id; who performs the service"
      - name: linked_order_id
        type: string
        source: input
        description: "FK -> Order.id; optional order this booking is attached to (service bonus on completion)"
      - name: service_type
        type: enum
        source: input
        description: Service performed
        constraints: "one of {BROW, MAKEOVER}"
      - name: start_at
        type: datetime
        source: input
        description: UTC start instant of the booking
      - name: duration_minutes
        type: integer
        source: computed
        description: 30 for BROW, 60 for MAKEOVER
      - name: proposed_start_at
        type: datetime
        source: computed
        description: Customer-proposed new start while status is RESCHEDULE_PENDING
      - name: status
        type: enum
        source: system
        description: Booking lifecycle state
        default: CONFIRMED
        constraints: "one of {CONFIRMED, RESCHEDULE_PENDING, COMPLETED, NO_SHOW, CANCELLED}"
      - name: reschedule_count
        type: integer
        source: computed
        description: Number of accepted reschedules; capped at 2
        default: 0
      - name: bonus_points_awarded
        type: integer
        source: computed
        description: Service bonus points credited on COMPLETED with an eligible linked order
        default: 0

  - name: ReturnRequest
    parent: OrderLine
    common_fields: true
    fields:
      - name: order_line_id
        type: string
        source: input
        description: "FK -> OrderLine.id; the line being returned"
      - name: quantity
        type: integer
        source: input
        description: Units returned
        constraints: ">= 1"
      - name: reason
        type: enum
        source: input
        description: Customer-stated reason
        constraints: "one of {WRONG_SHADE, DAMAGED, CHANGED_MIND, ALLERGIC_REACTION}"
      - name: status
        type: enum
        source: system
        description: Return lifecycle state
        default: REQUESTED
        constraints: "one of {REQUESTED, APPROVED, DENIED}"
      - name: deny_reason
        type: enum
        source: input
        description: Reason supplied with a DENY decision
        constraints: "one of {HYGIENE_VIOLATION, NOT_AS_DESCRIBED, OUT_OF_POLICY}"
      - name: disposition
        type: enum
        source: computed
        description: RESTOCK when the line hygiene_class is SEALED, DESTROY when TESTER_APPLIED
        constraints: "one of {RESTOCK, DESTROY}"
      - name: refund_line_cents
        type: integer
        source: computed
        description: Proportional share of OrderLine.line_net_cents, rounded HALF_UP once for the whole request
        default: 0
      - name: restocking_fee_cents
        type: integer
        source: computed
        description: 10% of refund_line_cents for TESTER_APPLIED lines, 0 for SEALED
        default: 0
      - name: refund_cents
        type: integer
        source: computed
        description: Cash refunded to the customer after tier-discount share and restocking fee
        default: 0
      - name: points_clawback
        type: integer
        source: computed
        description: Points removed from the customer for the refunded cash
        default: 0
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant the decision was recorded

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Order
    initial_state: DRAFT
    terminal_states: [PICKED_UP, SHIPPED, CANCELLED]
    note: |
      Order carries TWO independent state dimensions on the same row: `fulfillment_status`
      (DRAFT..CANCELLED, listed below) and `payment_status` (UNPAID..VOIDED, listed in the
      second machine below). They evolve independently but guard each other.
    transitions:
      - from: DRAFT
        to: RESERVED
        trigger: "POST /orders/{id}/reserve"
        actor: Customer | StoreAssociate
        preconditions:
          - "Store.status == ACTIVE (cross-entity: Order -> Store)"
          - "every SALE line's Variant.status == ACTIVE"
          - "for BOPIS channel: count of Orders at this store with the same pickup_slot_start and fulfillment_status IN {RESERVED, READY_FOR_PICKUP} < Store.bopis_slot_capacity"
          - "for each limited-launch line: Variant.launch_status permits Customer.tier (PUBLIC any; TIER_VIB_PLUS needs tier IN {VIB, ROUGE}; TIER_ROUGE_ONLY needs tier == ROUGE)"
          - "for each limited-launch line: units already held by this customer for that variant across orders with fulfillment_status != CANCELLED, plus the requested quantity, is <= Variant.per_customer_cap"
          - "stock is sufficient for every SALE line, unless Order.allow_partial is true"
          - "Customer.points_balance >= Order.points_redeemed"
          - "points_value_cents <= discounted_subtotal_cents"
        side_effects:
          - "Order.tier_at_reserve = Customer.tier"
          - "if allow_partial: each SALE line's quantity is clipped to the drawable units in the store's InventoryLot for that variant"
          - "InventoryLot: on_hand_units -= drawn, reserved_units += drawn (limited-launch draws consume launch_reserved_units first, then general on_hand); InventoryLot.version += 1"
          - "order_pricing runs with variant FINAL: bundle discounts rounded per line, tier discount, GWP/SAMPLE resolution, points value"
          - "GWP line materialised (line_type GWP, unit_price 0) only when discounted_subtotal_cents >= the selected GWP Promotion.threshold_cents AND the gift variant has drawable stock at this store; otherwise no GWP line is created"
          - "SAMPLE lines materialised for every eligible SAMPLE promotion; SAMPLE lines never touch InventoryLot"
          - "if points_redeemed > 0: append PointsLedgerEntry(entry_type=REDEEM, delta_points=-points_redeemed); Customer.points_balance -= points_redeemed"
          - "Order.pricing_variant = FINAL; Order.version += 1"
      - from: RESERVED
        to: READY_FOR_PICKUP
        trigger: "POST /orders/{id}/fulfillment (action=MARK_READY)"
        actor: StoreAssociate
        preconditions:
          - "Order.channel == BOPIS"
          - "Order.payment_status IN {AUTHORIZED, CAPTURED}"
        side_effects:
          - "Order.version += 1"
      - from: READY_FOR_PICKUP
        to: PICKED_UP
        trigger: "POST /orders/{id}/fulfillment (action=HAND_OVER)"
        actor: StoreAssociate
        preconditions:
          - "Order.payment_status == CAPTURED"
        side_effects:
          - "InventoryLot: reserved_units -= line quantity, sold_units += line quantity for every SALE and GWP line"
          - "Order.fulfilled_at = logical clock now"
          - "points_accrual runs -> Order.points_earned; append PointsLedgerEntry(entry_type=EARN, delta_points=+points_earned); Customer.points_balance += points_earned"
          - "Customer.qualifying_spend_cents += Order.total_due_cents; Customer.lifetime_spend_cents += Order.total_due_cents"
          - "tier_evaluation runs with variant ROLLING on the customer -> upgrade only (cascade hop 3)"
      - from: RESERVED
        to: SHIPPED
        trigger: "POST /orders/{id}/fulfillment (action=SHIP)"
        actor: StoreAssociate
        preconditions:
          - "Order.channel == SHIP_FROM_STORE"
          - "Order.payment_status == CAPTURED"
        side_effects:
          - "identical to READY_FOR_PICKUP -> PICKED_UP: inventory sold, points_accrual, qualifying spend, ROLLING tier_evaluation"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer | StoreAssociate
        preconditions: []
        side_effects:
          - "Order.version += 1 (no inventory or points movement: DRAFT never reserved or redeemed)"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer | StoreAssociate
        preconditions: []
        side_effects:
          - "hop 1: InventoryLot: reserved_units -= drawn, on_hand_units += drawn, launch_reserved_units restored by the units originally drawn from the launch pool; InventoryLot.version += 1"
          - "hop 2 (caused by hop 1 restoring launch units): the customer's held-unit count for the limited variant drops, re-opening per_customer_cap headroom"
          - "hop 3: if Order.points_redeemed > 0, append PointsLedgerEntry(entry_type=REVERSAL, delta_points=+points_redeemed)"
          - "hop 4 (caused by hop 3): Customer.points_balance += points_redeemed, restoring the pre-order balance exactly"
          - "payment dimension: AUTHORIZED -> VOIDED, CAPTURED -> REFUNDED (Order.refunded_cents = total_due_cents)"
      - from: READY_FOR_PICKUP
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer | StoreAssociate
        preconditions: []
        side_effects:
          - "identical cascade to RESERVED -> CANCELLED"

  - entity: Order
    initial_state: UNPAID
    terminal_states: [REFUNDED, VOIDED]
    note: "Second (payment) dimension of Order's parallel state machine; evolves independently of fulfillment_status."
    transitions:
      - from: UNPAID
        to: AUTHORIZED
        trigger: "POST /orders/{id}/payments (action=AUTHORIZE)"
        actor: Customer | StoreAssociate
        preconditions:
          - "Order.fulfillment_status == RESERVED"
        side_effects:
          - "Order.version += 1"
      - from: AUTHORIZED
        to: CAPTURED
        trigger: "POST /orders/{id}/payments (action=CAPTURE)"
        actor: Customer | StoreAssociate
        preconditions:
          - "Order.fulfillment_status IN {RESERVED, READY_FOR_PICKUP}"
        side_effects:
          - "Order.version += 1"
      - from: CAPTURED
        to: PARTIALLY_REFUNDED
        trigger: "system: ReturnRequest REQUESTED -> APPROVED with cumulative refunded_cents < total_due_cents"
        actor: system
        preconditions:
          - "Order.refunded_cents + ReturnRequest.refund_cents < Order.total_due_cents"
        side_effects:
          - "Order.refunded_cents += ReturnRequest.refund_cents"
      - from: CAPTURED
        to: REFUNDED
        trigger: "system: ReturnRequest approval settles the full amount, or POST /orders/{id}/cancel on a CAPTURED order"
        actor: system
        preconditions:
          - "Order.refunded_cents + ReturnRequest.refund_cents >= Order.total_due_cents"
        side_effects:
          - "Order.refunded_cents = Order.total_due_cents"
      - from: PARTIALLY_REFUNDED
        to: REFUNDED
        trigger: "system: a further ReturnRequest approval settles the remainder"
        actor: system
        preconditions:
          - "Order.refunded_cents + ReturnRequest.refund_cents >= Order.total_due_cents"
        side_effects:
          - "Order.refunded_cents = Order.total_due_cents"
      - from: AUTHORIZED
        to: VOIDED
        trigger: "system: POST /orders/{id}/cancel on an AUTHORIZED order"
        actor: system
        preconditions: []
        side_effects:
          - "no cash movement; Order.version += 1"

  - entity: ServiceBooking
    initial_state: CONFIRMED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    note: "Cyclic: CONFIRMED -> RESCHEDULE_PENDING -> CONFIRMED may repeat up to reschedule_count == 2."
    transitions:
      - from: CONFIRMED
        to: RESCHEDULE_PENDING
        trigger: "POST /service-bookings/{id}/reschedule"
        actor: Customer
        preconditions:
          - "ServiceBooking.reschedule_count < 2"
        side_effects:
          - "ServiceBooking.proposed_start_at = requested new start; version += 1"
      - from: RESCHEDULE_PENDING
        to: CONFIRMED
        trigger: "POST /service-bookings/{id}/confirm"
        actor: BeautyArtist
        preconditions:
          - "the artist's occupied intervals (see resource_overlap.artist_buffer) do not collide with [proposed_start_at, proposed_start_at + duration_minutes + 15min)"
        side_effects:
          - "ServiceBooking.start_at = proposed_start_at; proposed_start_at = null; reschedule_count += 1; version += 1"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /service-bookings/{id}/complete (outcome=COMPLETED)"
        actor: BeautyArtist
        preconditions:
          - "if linked_order_id is set: that Order.payment_status == CAPTURED (cross-entity: ServiceBooking -> Order)"
        side_effects:
          - "if linked_order_id is set: ServiceBooking.bonus_points_awarded = 200; append PointsLedgerEntry(entry_type=SERVICE_BONUS, delta_points=+200); Customer.points_balance += 200"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /service-bookings/{id}/complete (outcome=NO_SHOW)"
        actor: BeautyArtist
        preconditions: []
        side_effects:
          - "no points awarded; booking becomes terminal"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /service-bookings/{id}/cancel"
        actor: Customer | StoreAssociate
        preconditions: []
        side_effects:
          - "the artist's interval is released, freeing it for the artist_buffer overlap check"
      - from: RESCHEDULE_PENDING
        to: CANCELLED
        trigger: "POST /service-bookings/{id}/cancel"
        actor: Customer | StoreAssociate
        preconditions: []
        side_effects:
          - "the artist's interval (based on start_at, not proposed_start_at) is released"

  - entity: ReturnRequest
    initial_state: REQUESTED
    terminal_states: [APPROVED, DENIED]
    note: "Branching fork: the two outgoing edges carry entirely different side-effect sets."
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /return-requests/{id}/decision (decision=APPROVE)"
        actor: StoreAssociate
        preconditions:
          - "OrderLine.returned_quantity + ReturnRequest.quantity <= OrderLine.quantity"
        side_effects:
          - "hop 1: refund_settlement runs -> ReturnRequest.refund_line_cents, restocking_fee_cents, refund_cents, points_clawback, disposition"
          - "hop 2 (caused by hop 1's refund_cents): Order.refunded_cents += refund_cents; Order.payment_status CAPTURED -> PARTIALLY_REFUNDED or REFUNDED"
          - "hop 3 (caused by hop 2's refund): Customer.qualifying_spend_cents -= refund_cents; lifetime_spend_cents -= refund_cents; append PointsLedgerEntry(entry_type=CLAWBACK, delta_points=-points_clawback); Customer.points_balance -= points_clawback"
          - "hop 4 (caused by hop 3's spend drop): tier_evaluation runs with variant ROLLING -> upgrades only, never downgrades inside the cycle"
          - "InventoryLot: sold_units -= quantity; disposition RESTOCK (hygiene_class SEALED) -> on_hand_units += quantity; disposition DESTROY (hygiene_class TESTER_APPLIED) -> destroyed_units += quantity"
          - "OrderLine.returned_quantity += quantity"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /return-requests/{id}/decision (decision=DENY)"
        actor: StoreAssociate
        preconditions:
          - "deny_reason is supplied"
        side_effects:
          - "no cash, no points, no inventory movement"
          - "if deny_reason == HYGIENE_VIOLATION: Customer.hygiene_strikes += 1"
          - "if Customer.hygiene_strikes >= 3: Customer.return_privilege = SUSPENDED"

  - entity: Variant
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    note: |
      Launch gate for is_limited_launch variants. Non-limited variants are created directly in
      NOT_LIMITED and have no transitions. Advancement is system-driven by the logical clock.
    transitions:
      - from: SCHEDULED
        to: TIER_ROUGE_ONLY
        trigger: "system: POST /_clock/set_current_utc advances the clock to >= Variant.launch_open_rouge_at"
        actor: system
        preconditions:
          - "Variant.is_limited_launch == true"
        side_effects:
          - "only ROUGE customers may reserve this variant; Variant.version += 1"
      - from: TIER_ROUGE_ONLY
        to: TIER_VIB_PLUS
        trigger: "system: POST /_clock/set_current_utc advances the clock to >= Variant.launch_open_vib_at"
        actor: system
        preconditions: []
        side_effects:
          - "VIB and ROUGE customers may reserve this variant; Variant.version += 1"
      - from: TIER_VIB_PLUS
        to: PUBLIC
        trigger: "system: POST /_clock/set_current_utc advances the clock to >= Variant.launch_open_public_at"
        actor: system
        preconditions: []
        side_effects:
          - "all tiers may reserve this variant; Variant.version += 1"
      - from: PUBLIC
        to: CLOSED
        trigger: "PATCH /variants/{id} with launch_status=CLOSED"
        actor: MerchandisingAdmin
        preconditions: []
        side_effects:
          - "no further reserves may draw this variant (ERR_LAUNCH_CLOSED is not defined; reserve fails with ERR_LAUNCH_NOT_OPEN)"
      - from: SCHEDULED
        to: CLOSED
        trigger: "PATCH /variants/{id} with launch_status=CLOSED"
        actor: MerchandisingAdmin
        preconditions: []
        side_effects:
          - "the launch is abandoned before it ever opened"

  - entity: Customer
    initial_state: INSIDER
    terminal_states: []
    note: |
      Cyclic tier machine. Upgrades fire on the ROLLING variant of tier_evaluation (order fulfilment
      and return approval); downgrades fire ONLY on the CHECKPOINT variant (POST /customers/{id}/tier-checkpoint).
    transitions:
      - from: INSIDER
        to: VIB
        trigger: "system: tier_evaluation (ROLLING) after fulfilment, or tier_evaluation (CHECKPOINT)"
        actor: system
        preconditions:
          - "Customer.qualifying_spend_cents >= 35000"
        side_effects:
          - "Customer.tier = VIB (tier discount 10%, points multiplier 1.5 for subsequently reserved orders)"
      - from: VIB
        to: ROUGE
        trigger: "system: tier_evaluation (ROLLING) after fulfilment, or tier_evaluation (CHECKPOINT)"
        actor: system
        preconditions:
          - "Customer.qualifying_spend_cents >= 100000"
        side_effects:
          - "Customer.tier = ROUGE (tier discount 15%, points multiplier 2.0)"
      - from: ROUGE
        to: VIB
        trigger: "POST /customers/{id}/tier-checkpoint"
        actor: MerchandisingAdmin
        preconditions:
          - "35000 <= Customer.qualifying_spend_cents < 100000"
        side_effects:
          - "Customer.tier = VIB; qualifying_spend_cents = 0; cycle_started_at = clock now"
      - from: VIB
        to: INSIDER
        trigger: "POST /customers/{id}/tier-checkpoint"
        actor: MerchandisingAdmin
        preconditions:
          - "Customer.qualifying_spend_cents < 35000"
        side_effects:
          - "Customer.tier = INSIDER; qualifying_spend_cents = 0; cycle_started_at = clock now"
      - from: ROUGE
        to: INSIDER
        trigger: "POST /customers/{id}/tier-checkpoint"
        actor: MerchandisingAdmin
        preconditions:
          - "Customer.qualifying_spend_cents < 35000"
        side_effects:
          - "Customer.tier = INSIDER; qualifying_spend_cents = 0; cycle_started_at = clock now"

# =====================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =====================================================================
concurrency_rules:
  - rule_id: tester-conversion-stale-lot
    parent_entity: InventoryLot
    write_endpoint: "POST /inventory-lots/{id}/tester-conversions"
    occ_field: "expected_lot_version"
    description: |
      Converting sellable units into testers against an InventoryLot whose version has advanced
      since the associate last read it is rejected. A second tester conversion is legitimate on
      its own terms (multiple testers per lot are normal), so the only deterministic guard is the
      stale-version check: the request carries the version the associate observed, and the server
      rejects it when the lot has since moved (an order reserved units, a return restocked units,
      or another conversion landed).
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412

  - rule_id: line-add-stale-order
    parent_entity: Order
    write_endpoint: "POST /orders/{id}/lines"
    occ_field: "expected_order_version"
    description: |
      Adding a line to a DRAFT order whose version has advanced since the client last observed it
      is rejected. Each line addition re-runs order_pricing and supersedes the quote the client was
      looking at (bundle eligibility, GWP eligibility and totals all shift), so a client working
      from a stale quote must re-read the order before adding another line.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

# =====================================================================
# §1.2.2 Resource temporal-overlap semantics (referenced by §1.4)
# =====================================================================
resource_overlap:
  - rule_id: artist_buffer
    resource_entity: Artist
    interval_semantics: |
      Half-open interval with a trailing sanitation buffer. A booking occupies
      [start_at, start_at + duration_minutes + SANITATION_BUFFER_MINUTES). Two bookings for the same
      artist_id collide when their occupied intervals intersect. Touching endpoints do NOT collide:
      a booking starting exactly at the previous booking's buffered end is accepted.
    occupied_by: "ServiceBooking rows with status IN {CONFIRMED, RESCHEDULE_PENDING} (RESCHEDULE_PENDING still occupies its ORIGINAL start_at interval)"
    error_id: ERR_ARTIST_TIME_CONFLICT

  - rule_id: bopis_slot_capacity
    resource_entity: Store
    interval_semantics: |
      Fixed 60-minute buckets keyed by an exact on-the-hour pickup_slot_start; there is no geometric
      intersection test at all — occupancy is an aggregate COUNT within the bucket. The slot is full
      when count >= Store.bopis_slot_capacity (a >= boundary, not >).
    occupied_by: "Orders at the same store_id with identical pickup_slot_start and fulfillment_status IN {RESERVED, READY_FOR_PICKUP}"
    error_id: ERR_PICKUP_SLOT_FULL

# =====================================================================
# §1.2.3 Conserved-quantity invariants (referenced by §1.8 rule 9)
# =====================================================================
invariants:
  - invariant_id: inventory_units_conserved
    quantity: "InventoryLot.units_received"
    formula: |
      units_received == on_hand_units + reserved_units + tester_units + sold_units + destroyed_units
    note: "Holds after every reserve, cancel, tester conversion, fulfilment and return decision."
  - invariant_id: points_ledger_conserved
    quantity: "Customer.points_balance"
    formula: |
      points_balance == SUM(PointsLedgerEntry.delta_points WHERE customer_id == Customer.id)
    note: "Holds after SEED, REDEEM, REVERSAL, EARN, CLAWBACK and SERVICE_BONUS entries."

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: order_pricing
    trigger: "POST /orders (PROVISIONAL), POST /orders/{id}/lines (PROVISIONAL), POST /orders/{id}/reserve (FINAL)"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is PINNED. Executing these steps in any other order changes the answer.
      # step 1 — per SALE line gross
      line_gross_cents = unit_price_cents * quantity
      # step 2 — bundle discount, ROUNDED PER LINE (round_half_up), then summed.
      #          Applying bundle_discount_pct to the summed bundle gross and rounding once
      #          produces a DIFFERENT number of cents; that variant is WRONG.
      bundle = the ACTIVE BUNDLE Promotion whose bundle_variant_ids are ALL present as SALE lines
               with quantity >= 1; if several qualify, rank by bundle_discount_pct DESC,
               tie-break priority ASC, then created_at ASC. A line receives at most one bundle discount.
      line_discount_cents = round_half_up(line_gross_cents * bundle.bundle_discount_pct)  if the line's
                            variant_id is in bundle.bundle_variant_ids, else 0
      line_net_cents = line_gross_cents - line_discount_cents
      # step 3 — subtotal (SALE lines only; GWP and SAMPLE lines contribute 0)
      subtotal_cents = SUM(line_net_cents over SALE lines)
      # step 4 — loyalty tier discount, on the SUBTOTAL, using the tier as of reserve
      tier_pct = TIER_DISCOUNT_PCT[Order.tier_at_reserve]      # PROVISIONAL passes use Customer.tier now
      tier_discount_cents = round_half_up(subtotal_cents * tier_pct)
      discounted_subtotal_cents = subtotal_cents - tier_discount_cents
      # step 5 — GWP/SAMPLE thresholds are tested against discounted_subtotal_cents, i.e. AFTER the
      #          tier discount and BEFORE the points redemption. This is the circular-looking hop:
      #          the tier discount depends on the tier, the tier can be upgraded BY this order, and
      #          the GWP threshold depends on the tier discount. It is pinned as: the tier used is
      #          Customer.tier BEFORE this order's own upgrade; the upgrade lands only at fulfilment.
      gwp = the ACTIVE GWP Promotion with threshold_cents <= discounted_subtotal_cents, ranked by
            threshold_cents DESC, tie-break priority ASC, then created_at ASC; null if none qualifies
      gwp_eligible = (gwp is not null)
      # step 6 — points redemption converts to cash LAST; it never moves the GWP threshold
      points_value_cents = (points_redeemed / 100) * 500
      total_due_cents = discounted_subtotal_cents - points_value_cents
    input_set: |
      SALE lines of the order. During the FINAL pass at reserve, quantities have already been clipped
      to drawable stock when Order.allow_partial is true, so the FINAL pass may see a strictly smaller
      input set than the PROVISIONAL pass saw.
    constants:
      TIER_DISCOUNT_PCT: { INSIDER: 0.00, VIB: 0.10, ROUGE: 0.15 }
      POINTS_REDEEM_BLOCK: 100
      POINTS_REDEEM_VALUE_CENTS: 500
    precision: "integer cents; round_half_up at every step that names it"
    variants:
      - name: PROVISIONAL
        when: "POST /orders and POST /orders/{id}/lines — the quote a client sees before inventory is touched"
        difference: "Uses the REQUESTED quantities verbatim and ignores stock entirely; gwp_eligible is advisory and NO GWP/SAMPLE line rows are materialised."
      - name: FINAL
        when: "POST /orders/{id}/reserve — after inventory is drawn"
        difference: "Quantities may have been clipped to drawable stock (allow_partial), which can drop discounted_subtotal_cents below the GWP threshold that PROVISIONAL cleared; the gift line is then never created. Identical request payload, different money."

  - name: tier_evaluation
    trigger: "system after Order fulfilment and after ReturnRequest approval (ROLLING); POST /customers/{id}/tier-checkpoint (CHECKPOINT)"
    algorithm: threshold
    formula: |
      target_tier(spend) = ROUGE  if spend >= 100000
                           VIB    if spend >= 35000
                           INSIDER otherwise
      # ROLLING: upgrades only. A tier is sticky for the rest of the cycle once earned.
      ROLLING:    if rank(target_tier(qualifying_spend_cents)) > rank(Customer.tier):
                      Customer.tier = target_tier(qualifying_spend_cents)
                  # never downgrades, even when a refund drops qualifying_spend_cents below the threshold
      # CHECKPOINT: absolute re-derivation, then the cycle resets.
      CHECKPOINT: Customer.tier = target_tier(qualifying_spend_cents)   # may downgrade
                  Customer.qualifying_spend_cents = 0
                  Customer.cycle_started_at = clock now
    input_set: "Customer.qualifying_spend_cents, which is incremented by Order.total_due_cents at fulfilment and decremented by ReturnRequest.refund_cents at approval"
    constants:
      TIER_THRESHOLD_VIB_CENTS: 35000
      TIER_THRESHOLD_ROUGE_CENTS: 100000
      TIER_RANK: { INSIDER: 0, VIB: 1, ROUGE: 2 }
    precision: "integer cents; comparisons are >= (a customer at exactly 35000 IS VIB)"
    variants:
      - name: ROLLING
        when: "order fulfilment and return approval"
        difference: "Monotone: applies upgrades and suppresses downgrades."
      - name: CHECKPOINT
        when: "POST /customers/{id}/tier-checkpoint"
        difference: "Non-monotone: re-derives the tier from the same qualifying_spend_cents and DOES downgrade, then zeroes the cycle. Same spend value, different resulting tier."

  - name: points_accrual
    trigger: "Order fulfilment (READY_FOR_PICKUP -> PICKED_UP, RESERVED -> SHIPPED)"
    algorithm: weighted_scoring
    formula: |
      earn_base_cents = Order.total_due_cents            # points are never earned on the points-paid portion
      base_points     = floor(earn_base_cents / 100)
      multiplier      = TIER_MULTIPLIER[Order.tier_at_reserve]   # NOT the tier the order itself just unlocked
      tier_points     = floor(base_points * multiplier)
      category_bonus  = SKINCARE_BONUS_POINTS if ANY SALE line of the order has
                        Product.category == SKINCARE AND line_net_cents >= SKINCARE_BONUS_MIN_LINE_NET
                        else 0
      points_earned   = min(tier_points + category_bonus, POINTS_EARN_CAP_PER_ORDER)
    input_set: "SALE lines only (GWP and SAMPLE lines have line_net_cents == 0 and never trigger the category bonus)"
    constants:
      TIER_MULTIPLIER: { INSIDER: 1.0, VIB: 1.5, ROUGE: 2.0 }
      SKINCARE_BONUS_POINTS: 50
      SKINCARE_BONUS_MIN_LINE_NET: 5000
      POINTS_EARN_CAP_PER_ORDER: 5000
    precision: "integer points; floor after every multiplication, then the min() cap"

  - name: refund_settlement
    trigger: "POST /return-requests/{id}/decision (decision=APPROVE)"
    algorithm: waterfall_allocation
    formula: |
      line   = the ReturnRequest's OrderLine
      order  = line's Order
      # Rounding order is PINNED: the proportional share is taken on the WHOLE LINE and rounded
      # HALF_UP exactly once. Rounding the per-unit price first and multiplying by quantity is WRONG.
      refund_line_cents   = round_half_up(line.line_net_cents * ReturnRequest.quantity / line.quantity)
      tier_share_cents    = round_half_up(order.tier_discount_cents * refund_line_cents / order.subtotal_cents)
      restocking_fee_cents = 0                                   if line.hygiene_class == SEALED
                             round_half_up(refund_line_cents * 0.10) if line.hygiene_class == TESTER_APPLIED
                             # DIRECT_CONTACT never reaches here: the request is rejected at creation
      refund_cents        = refund_line_cents - tier_share_cents - restocking_fee_cents
      points_clawback     = floor( floor(refund_cents / 100) * TIER_MULTIPLIER[order.tier_at_reserve] )
      disposition         = RESTOCK if line.hygiene_class == SEALED else DESTROY
    input_set: "the single OrderLine named by ReturnRequest.order_line_id; each ReturnRequest is rounded independently — the shares of two separate requests are never re-derived from a summed base"
    constants:
      RESTOCK_FEE_PCT_TESTER_APPLIED: 0.10
    precision: "integer cents; round_half_up once per named step"

  - name: shade_match_ranking
    trigger: "POST /shade-recommendations"
    algorithm: weighted_scoring
    formula: |
      # eligibility filter (candidate set)
      candidates = Variants where
          status == ACTIVE
          AND launch_status IN {NOT_LIMITED, PUBLIC}
          AND abs(depth_index - request.depth_index) <= 2
          AND (request.store_id is null OR an InventoryLot exists for (store_id, variant_id) with
               on_hand_units - launch_reserved_units >= 1)
      # ranking expression
      score = 100
              - 10 * abs(depth_index - request.depth_index)
              + 25 if undertone == request.undertone else 0
              + 15 if finish    == request.finish_pref else 0
      # order: score DESC, then abs(depth_index - request.depth_index) ASC, then created_at ASC
      # fallback: candidates empty -> ERR_NO_SHADE_MATCH (422)
    input_set: "all Variants across all Products; the store filter is applied only when store_id is supplied"
    constants:
      DEPTH_TOLERANCE: 2
      UNDERTONE_MATCH_POINTS: 25
      FINISH_MATCH_POINTS: 15
      DEPTH_PENALTY_PER_STEP: 10
    precision: "integer score; ties resolved by the pinned tie-break chain (never by id)"

  - name: launch_allocation_draw
    trigger: "POST /orders/{id}/reserve, for every SALE line whose Variant.is_limited_launch is true"
    algorithm: waterfall_allocation
    formula: |
      lot = InventoryLot for (Order.store_id, line.variant_id)
      # gate 1 — tier window (Variant.launch_status)
      #   SCHEDULED       -> ERR_LAUNCH_NOT_OPEN
      #   CLOSED          -> ERR_LAUNCH_NOT_OPEN
      #   TIER_ROUGE_ONLY -> Customer.tier must be ROUGE            else ERR_LAUNCH_TIER_LOCKED
      #   TIER_VIB_PLUS   -> Customer.tier IN {VIB, ROUGE}          else ERR_LAUNCH_TIER_LOCKED
      #   PUBLIC          -> any tier
      # gate 2 — per-customer cap (>= boundary: held + requested must be <= cap)
      held = SUM(OrderLine.quantity) over lines with this variant_id belonging to Orders of this
             customer with fulfillment_status != CANCELLED, EXCLUDING the order being reserved
      if held + line.quantity > Variant.per_customer_cap: ERR_LAUNCH_CAP_EXCEEDED
      # gate 3 — waterfall draw
      from_launch_pool  = min(line.quantity, lot.launch_reserved_units)
      from_general_pool = line.quantity - from_launch_pool
      general_available = lot.on_hand_units - lot.launch_reserved_units
      if from_general_pool > general_available:
          if Order.allow_partial: clip line.quantity to from_launch_pool + general_available
          else: ERR_INSUFFICIENT_STOCK
      lot.launch_reserved_units -= from_launch_pool
      lot.on_hand_units         -= drawn
      lot.reserved_units        += drawn
    input_set: "the single InventoryLot at the order's store for the line's variant; non-limited lines draw only from (on_hand_units - launch_reserved_units)"
    constants:
      DEFAULT_PER_CUSTOMER_CAP: 2
    precision: "integer units; the launch pool is exhausted before the general pool, never the reverse"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every resource named in the path exists, validated left-to-right"
    error_id: ERR_STORE_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_VARIANT_NOT_FOUND | ERR_CUSTOMER_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_ORDER_LINE_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_PROMOTION_NOT_FOUND | ERR_ARTIST_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_RETURN_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "request body has every required field, enum values are legal, numeric fields are in range, points_redeemed is a multiple of 100, BOPIS orders carry an on-the-hour pickup_slot_start"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all writes"

  - priority: 5
    category: existence
    check: "every foreign key in the body resolves to an existing row"
    error_id: ERR_STORE_NOT_FOUND | ERR_VARIANT_NOT_FOUND | ERR_CUSTOMER_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_ORDER_LINE_NOT_FOUND | ERR_ARTIST_NOT_FOUND
    http_status: 404
    applies_to: "POST /orders, POST /orders/{id}/lines, POST /inventory-lots, POST /service-bookings, POST /return-requests, POST /promotions"

  - priority: 6
    category: auth
    check: "a Customer may only read or mutate resources whose customer_id equals X-User-ID"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "GET /customers/{id}, GET /points-ledger, POST /orders, POST /orders/{id}/*, POST /service-bookings, POST /service-bookings/{id}/*, POST /return-requests"

  - priority: 7
    category: state
    check: "the target resource is in a state from which this transition is declared in §1.2"
    error_id: ERR_INVALID_ORDER_STATE | ERR_INVALID_BOOKING_STATE | ERR_INVALID_RETURN_STATE
    http_status: 409
    applies_to: "POST /orders/{id}/lines, POST /orders/{id}/reserve, POST /orders/{id}/payments, POST /orders/{id}/fulfillment, POST /orders/{id}/cancel, POST /service-bookings/{id}/*, POST /return-requests, POST /return-requests/{id}/decision"

  - priority: 8
    category: state
    check: "expected_<parent>_version equals the live parent version (OCC, §1.2.1)"
    error_id: ERR_STALE_ORDER_VERSION | ERR_STALE_LOT_VERSION
    http_status: 412
    applies_to: "POST /orders/{id}/lines, POST /inventory-lots/{id}/tester-conversions"

  - priority: 9
    category: business_safety
    check: "the requesting Customer's return_privilege is ACTIVE (SUSPENDED after 3 hygiene strikes)"
    error_id: ERR_RETURN_PRIVILEGE_SUSPENDED
    http_status: 403
    applies_to: "POST /return-requests"

  - priority: 10
    category: business_safety
    check: "the OrderLine's hygiene_class is not DIRECT_CONTACT (direct-contact product, never returnable)"
    error_id: ERR_HYGIENE_NON_RETURNABLE
    http_status: 422
    applies_to: "POST /return-requests"

  - priority: 11
    category: business_safety
    check: "the lot's Product.hygiene_class is not DIRECT_CONTACT (direct-contact products may not be put out as testers)"
    error_id: ERR_TESTER_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /inventory-lots/{id}/tester-conversions"

  - priority: 12
    category: business_temporal
    check: "clock now <= Order.fulfilled_at + 30 days"
    error_id: ERR_RETURN_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /return-requests"

  - priority: 13
    category: business_temporal
    check: "resource_overlap.artist_buffer — the artist's buffered interval does not intersect an existing booking's buffered interval"
    error_id: ERR_ARTIST_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /service-bookings, POST /service-bookings/{id}/confirm"

  - priority: 14
    category: business_temporal
    check: "resource_overlap.bopis_slot_capacity — occupancy of the requested pickup slot is strictly below Store.bopis_slot_capacity"
    error_id: ERR_PICKUP_SLOT_FULL
    http_status: 409
    applies_to: "POST /orders/{id}/reserve"

  - priority: 15
    category: business_referential
    check: "a booking's linked_order_id, when supplied, names an Order with the same customer_id and store_id as the booking"
    error_id: ERR_BOOKING_ORDER_MISMATCH
    http_status: 422
    applies_to: "POST /service-bookings"

  - priority: 16
    category: business_referential
    check: "the order's Store.status is ACTIVE"
    error_id: ERR_STORE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /orders/{id}/reserve"

  - priority: 17
    category: business_referential
    check: "every SALE line's Variant.status is ACTIVE"
    error_id: ERR_VARIANT_NOT_SELLABLE
    http_status: 409
    applies_to: "POST /orders/{id}/reserve, POST /orders/{id}/lines"

  - priority: 18
    category: business_constraint
    check: "launch_allocation_draw gate 1 — a limited variant's launch_status is not SCHEDULED or CLOSED"
    error_id: ERR_LAUNCH_NOT_OPEN
    http_status: 409
    applies_to: "POST /orders/{id}/reserve"

  - priority: 19
    category: business_constraint
    check: "launch_allocation_draw gate 1 — Customer.tier clears the open tier window"
    error_id: ERR_LAUNCH_TIER_LOCKED
    http_status: 403
    applies_to: "POST /orders/{id}/reserve"

  - priority: 20
    category: business_constraint
    check: "launch_allocation_draw gate 2 — held + requested <= Variant.per_customer_cap"
    error_id: ERR_LAUNCH_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /orders/{id}/reserve"

  - priority: 21
    category: business_constraint
    check: "ReturnRequest.quantity + OrderLine.returned_quantity <= OrderLine.quantity"
    error_id: ERR_RETURN_QUANTITY_EXCEEDS_LINE
    http_status: 422
    applies_to: "POST /return-requests, POST /return-requests/{id}/decision"

  - priority: 22
    category: business_constraint
    check: "ServiceBooking.reschedule_count < 2"
    error_id: ERR_MAX_RESCHEDULES
    http_status: 409
    applies_to: "POST /service-bookings/{id}/reschedule"

  - priority: 23
    category: business_fiscal
    check: "the order's payment_status is CAPTURED where the transition demands it (HAND_OVER, SHIP, booking completion with a linked order)"
    error_id: ERR_PAYMENT_NOT_CAPTURED
    http_status: 409
    applies_to: "POST /orders/{id}/fulfillment, POST /service-bookings/{id}/complete"

  - priority: 24
    category: business_fiscal
    check: "Customer.points_balance >= Order.points_redeemed"
    error_id: ERR_INSUFFICIENT_POINTS
    http_status: 422
    applies_to: "POST /orders/{id}/reserve"

  - priority: 25
    category: business_fiscal
    check: "points_value_cents <= discounted_subtotal_cents"
    error_id: ERR_POINTS_EXCEED_SUBTOTAL
    http_status: 422
    applies_to: "POST /orders/{id}/reserve"

  - priority: 26
    category: business_constraint
    check: "drawable stock covers every SALE line (only when Order.allow_partial is false)"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    applies_to: "POST /orders/{id}/reserve, POST /inventory-lots/{id}/tester-conversions"

  - priority: 27
    category: business_constraint
    check: "shade_match_ranking's candidate set is non-empty"
    error_id: ERR_NO_SHADE_MATCH
    http_status: 422
    applies_to: "POST /shade-recommendations"

  - priority: 28
    category: business_constraint
    check: "at most one InventoryLot exists per (store_id, variant_id)"
    error_id: ERR_LOT_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /inventory-lots"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. The server boots with the clock at exactly 2026-05-01T00:00:00Z and NEVER falls back to wall-clock time; every deadline, launch window and return window is measured against this logical clock."
    roles: [MerchandisingAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime, advanced_variant_ids: string[] }"
    side_effects:
      - "advances Variant.launch_status for every is_limited_launch variant whose launch_open_* thresholds the new clock has crossed, in the order rouge -> vib -> public"

  - method: POST
    path: "/stores"
    description: "Create a store"
    roles: [MerchandisingAdmin]
    code: 201
    input: [name, region_code, "status?", "bopis_slot_capacity?"]
    output: Store
    side_effects: []

  - method: GET
    path: "/stores/{id}"
    description: "Read a store"
    roles: [MerchandisingAdmin, StoreAssociate, BeautyArtist, Customer]
    code: 200
    input: []
    output: Store
    side_effects: []

  - method: PATCH
    path: "/stores/{id}"
    description: "Update a store's operational posture or BOPIS slot capacity"
    roles: [MerchandisingAdmin]
    code: 200
    input: ["status?", "bopis_slot_capacity?"]
    output: Store
    side_effects: ["Store.version += 1"]

  - method: POST
    path: "/products"
    description: "Create a product (SKU family)"
    roles: [MerchandisingAdmin]
    code: 201
    input: [name, brand, category, hygiene_class, base_price_cents]
    output: Product
    side_effects: []

  - method: GET
    path: "/products/{id}"
    description: "Read a product"
    roles: [MerchandisingAdmin, StoreAssociate, BeautyArtist, Customer]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: POST
    path: "/products/{id}/variants"
    description: "Create a shade/finish variant under a product"
    roles: [MerchandisingAdmin]
    code: 201
    input: [shade_name, shade_code, finish, undertone, depth_index, "price_cents?", "is_limited_launch?", "launch_open_rouge_at?", "launch_open_vib_at?", "launch_open_public_at?", "per_customer_cap?"]
    output: Variant
    side_effects:
      - "launch_status = SCHEDULED when is_limited_launch is true, else NOT_LIMITED"

  - method: GET
    path: "/variants/{id}"
    description: "Read a variant"
    roles: [MerchandisingAdmin, StoreAssociate, BeautyArtist, Customer]
    code: 200
    input: []
    output: Variant
    side_effects: []

  - method: GET
    path: "/variants"
    description: "List variants, optionally filtered by product"
    roles: [MerchandisingAdmin, StoreAssociate, BeautyArtist, Customer]
    code: 200
    input: ["product_id?", "launch_status?", "limit?", "offset?"]
    output: Variant[]
    side_effects: []

  - method: PATCH
    path: "/variants/{id}"
    description: "Discontinue a variant or close its limited launch"
    roles: [MerchandisingAdmin]
    code: 200
    input: ["status?", "launch_status?", "price_cents?"]
    output: Variant
    side_effects: ["Variant.version += 1"]

  - method: POST
    path: "/shade-recommendations"
    description: "Shade finder: returns the single best-ranked Variant per the shade_match_ranking calculation"
    roles: [Customer, StoreAssociate]
    code: 200
    input: [undertone, depth_index, finish_pref, "store_id?"]
    output: Variant
    side_effects: []

  - method: POST
    path: "/inventory-lots"
    description: "Create the inventory lot for one (store, variant) pair"
    roles: [MerchandisingAdmin]
    code: 201
    input: [store_id, variant_id, units_received, "launch_reserved_units?"]
    output: InventoryLot
    side_effects: ["on_hand_units = units_received"]

  - method: GET
    path: "/inventory-lots/{id}"
    description: "Read an inventory lot (used to read the lot version before an OCC write)"
    roles: [MerchandisingAdmin, StoreAssociate]
    code: 200
    input: []
    output: InventoryLot
    side_effects: []

  - method: GET
    path: "/inventory-lots"
    description: "List inventory lots filtered by store and/or variant"
    roles: [MerchandisingAdmin, StoreAssociate]
    code: 200
    input: ["store_id?", "variant_id?", "limit?", "offset?"]
    output: InventoryLot[]
    side_effects: []

  - method: POST
    path: "/inventory-lots/{id}/tester-conversions"
    description: "Convert sellable units into in-store testers (OCC guarded on the lot version)"
    roles: [StoreAssociate]
    code: 200
    input: [units, expected_lot_version]
    output: InventoryLot
    side_effects:
      - "on_hand_units -= units; tester_units += units; InventoryLot.version += 1"

  - method: POST
    path: "/customers"
    description: "Create a loyalty customer; seed fields let an admin place the customer at a tier/points/spend position"
    roles: [MerchandisingAdmin]
    code: 201
    input: [email, name, "initial_tier?", "initial_points?", "initial_qualifying_spend_cents?"]
    output: Customer
    side_effects:
      - "cycle_started_at = clock now"
      - "if initial_points > 0: append PointsLedgerEntry(entry_type=SEED, delta_points=+initial_points) so points_balance always equals the ledger sum"

  - method: GET
    path: "/customers/{id}"
    description: "Read a customer (a Customer may only read themselves)"
    roles: [MerchandisingAdmin, StoreAssociate, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/customers/{id}/tier-checkpoint"
    description: "Run the CHECKPOINT variant of tier_evaluation: re-derive the tier (downgrades allowed) and reset the loyalty cycle"
    roles: [MerchandisingAdmin]
    code: 200
    input: []
    output: Customer
    side_effects:
      - "tier_evaluation (CHECKPOINT) -> Customer.tier may drop; qualifying_spend_cents = 0; cycle_started_at = clock now; Customer.version += 1"

  - method: GET
    path: "/points-ledger/{id}"
    description: "Read one points-ledger entry"
    roles: [MerchandisingAdmin, Customer]
    code: 200
    input: []
    output: PointsLedgerEntry
    side_effects: []

  - method: GET
    path: "/points-ledger"
    description: "List points-ledger entries filtered by customer and/or order, ordered by created_at ASC"
    roles: [MerchandisingAdmin, Customer]
    code: 200
    input: ["customer_id?", "order_id?", "limit?", "offset?"]
    output: PointsLedgerEntry[]
    side_effects: []

  - method: POST
    path: "/promotions"
    description: "Create a GWP, SAMPLE or BUNDLE promotion"
    roles: [MerchandisingAdmin]
    code: 201
    input: [name, promo_type, "threshold_cents?", "gift_variant_id?", "gift_quantity?", "bundle_variant_ids?", "bundle_discount_pct?", "priority?", "status?"]
    output: Promotion
    side_effects: []

  - method: GET
    path: "/promotions/{id}"
    description: "Read a promotion"
    roles: [MerchandisingAdmin, StoreAssociate, Customer]
    code: 200
    input: []
    output: Promotion
    side_effects: []

  - method: GET
    path: "/promotions"
    description: "List promotions, optionally filtered by the gifted variant"
    roles: [MerchandisingAdmin, StoreAssociate, Customer]
    code: 200
    input: ["gift_variant_id?", "promo_type?", "limit?", "offset?"]
    output: Promotion[]
    side_effects: []

  - method: POST
    path: "/orders"
    description: "Create a DRAFT order with its initial SALE lines; returns the PROVISIONAL quote"
    roles: [Customer, StoreAssociate]
    code: 201
    input: [customer_id, store_id, channel, lines, "pickup_slot_start?", "allow_partial?", "points_redeemed?"]
    output: Order
    side_effects:
      - "OrderLine rows created (line_type SALE), unit_price_cents and hygiene_class snapshotted"
      - "order_pricing runs with variant PROVISIONAL"

  - method: GET
    path: "/orders/{id}"
    description: "Read an order (a Customer may only read their own)"
    roles: [MerchandisingAdmin, StoreAssociate, Customer]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/orders"
    description: "List orders filtered by customer, store and/or fulfillment status"
    roles: [MerchandisingAdmin, StoreAssociate, Customer]
    code: 200
    input: ["customer_id?", "store_id?", "fulfillment_status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: POST
    path: "/orders/{id}/lines"
    description: "Add a SALE line to a DRAFT order and re-run the PROVISIONAL quote (OCC guarded on the order version)"
    roles: [Customer, StoreAssociate]
    code: 200
    input: [variant_id, quantity, expected_order_version]
    output: Order
    side_effects:
      - "a new OrderLine row is created (discoverable via GET /order-lines?order_id=...)"
      - "order_pricing re-runs with variant PROVISIONAL; Order.version += 1"

  - method: GET
    path: "/order-lines/{id}"
    description: "Read one order line"
    roles: [MerchandisingAdmin, StoreAssociate, Customer]
    code: 200
    input: []
    output: OrderLine
    side_effects: []

  - method: GET
    path: "/order-lines"
    description: "List order lines filtered by order, variant and/or promotion"
    roles: [MerchandisingAdmin, StoreAssociate, Customer]
    code: 200
    input: ["order_id?", "variant_id?", "promotion_id?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []

  - method: POST
    path: "/orders/{id}/reserve"
    description: "Reserve inventory, resolve promotions and redeem points; runs order_pricing with variant FINAL"
    roles: [Customer, StoreAssociate]
    code: 200
    input: []
    output: Order
    side_effects:
      - "see §1.2 Order DRAFT -> RESERVED"

  - method: POST
    path: "/orders/{id}/payments"
    description: "Advance the payment dimension: AUTHORIZE or CAPTURE"
    roles: [Customer, StoreAssociate]
    code: 200
    input: [action]
    output: Order
    side_effects:
      - "payment_status UNPAID -> AUTHORIZED -> CAPTURED; Order.version += 1"

  - method: POST
    path: "/orders/{id}/fulfillment"
    description: "Advance the fulfilment dimension: MARK_READY (BOPIS staging), HAND_OVER (BOPIS pickup) or SHIP (ship-from-store)"
    roles: [StoreAssociate]
    code: 200
    input: [action]
    output: Order
    side_effects:
      - "see §1.2 Order RESERVED -> READY_FOR_PICKUP / PICKED_UP / SHIPPED, including points_accrual and ROLLING tier_evaluation"

  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancel a non-terminal order and compensate every side effect it caused"
    roles: [Customer, StoreAssociate]
    code: 200
    input: ["reason?"]
    output: Order
    side_effects:
      - "see §1.2 Order RESERVED -> CANCELLED cascade (inventory release, launch headroom, points reversal, payment void/refund)"

  - method: POST
    path: "/artists"
    description: "Create a beauty artist at a store"
    roles: [MerchandisingAdmin]
    code: 201
    input: [store_id, name, skills, "status?"]
    output: Artist
    side_effects: []

  - method: GET
    path: "/artists/{id}"
    description: "Read an artist"
    roles: [MerchandisingAdmin, StoreAssociate, BeautyArtist, Customer]
    code: 200
    input: []
    output: Artist
    side_effects: []

  - method: GET
    path: "/artists"
    description: "List artists, optionally filtered by store"
    roles: [MerchandisingAdmin, StoreAssociate, BeautyArtist, Customer]
    code: 200
    input: ["store_id?", "limit?", "offset?"]
    output: Artist[]
    side_effects: []

  - method: POST
    path: "/service-bookings"
    description: "Book a brow or makeover service; optionally link it to an order"
    roles: [Customer, StoreAssociate]
    code: 201
    input: [customer_id, store_id, artist_id, service_type, start_at, "linked_order_id?"]
    output: ServiceBooking
    side_effects:
      - "duration_minutes derived from service_type (BROW 30, MAKEOVER 60); status CONFIRMED"

  - method: GET
    path: "/service-bookings/{id}"
    description: "Read a booking"
    roles: [MerchandisingAdmin, StoreAssociate, BeautyArtist, Customer]
    code: 200
    input: []
    output: ServiceBooking
    side_effects: []

  - method: GET
    path: "/service-bookings"
    description: "List bookings filtered by customer, store, artist and/or linked order"
    roles: [MerchandisingAdmin, StoreAssociate, BeautyArtist, Customer]
    code: 200
    input: ["customer_id?", "store_id?", "artist_id?", "linked_order_id?", "limit?", "offset?"]
    output: ServiceBooking[]
    side_effects: []

  - method: POST
    path: "/service-bookings/{id}/reschedule"
    description: "Customer proposes a new start; booking moves to RESCHEDULE_PENDING"
    roles: [Customer]
    code: 200
    input: [proposed_start_at]
    output: ServiceBooking
    side_effects:
      - "proposed_start_at recorded; Order of the day is untouched"

  - method: POST
    path: "/service-bookings/{id}/confirm"
    description: "Artist accepts the proposed start; booking returns to CONFIRMED (cycle) and reschedule_count increments"
    roles: [BeautyArtist]
    code: 200
    input: []
    output: ServiceBooking
    side_effects:
      - "start_at = proposed_start_at; reschedule_count += 1"

  - method: POST
    path: "/service-bookings/{id}/complete"
    description: "Artist closes the booking as COMPLETED or NO_SHOW"
    roles: [BeautyArtist]
    code: 200
    input: [outcome]
    output: ServiceBooking
    side_effects:
      - "COMPLETED with a linked, CAPTURED order awards 200 SERVICE_BONUS points"

  - method: POST
    path: "/service-bookings/{id}/cancel"
    description: "Cancel a booking and release the artist's interval"
    roles: [Customer, StoreAssociate]
    code: 200
    input: []
    output: ServiceBooking
    side_effects:
      - "status CANCELLED; the artist interval no longer occupies the buffered window"

  - method: POST
    path: "/return-requests"
    description: "Request a return against one order line"
    roles: [Customer]
    code: 201
    input: [order_line_id, quantity, reason]
    output: ReturnRequest
    side_effects: []

  - method: GET
    path: "/return-requests/{id}"
    description: "Read a return request"
    roles: [MerchandisingAdmin, StoreAssociate, Customer]
    code: 200
    input: []
    output: ReturnRequest
    side_effects: []

  - method: GET
    path: "/return-requests"
    description: "List return requests filtered by order line and/or status"
    roles: [MerchandisingAdmin, StoreAssociate, Customer]
    code: 200
    input: ["order_line_id?", "status?", "limit?", "offset?"]
    output: ReturnRequest[]
    side_effects: []

  - method: POST
    path: "/return-requests/{id}/decision"
    description: "Approve (refund + restock/destroy + clawback) or deny (possible hygiene strike) a return request"
    roles: [StoreAssociate]
    code: 200
    input: [decision, "deny_reason?"]
    output: ReturnRequest
    side_effects:
      - "see §1.2 ReturnRequest REQUESTED -> APPROVED / DENIED"

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the four declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_FORBIDDEN_OWNERSHIP
    http: 403
    condition: "a Customer acts on a resource whose customer_id is not their X-User-ID"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, illegal enum, out-of-range number, points_redeemed not a multiple of 100, BOPIS order without an on-the-hour pickup_slot_start, or an artist lacking the booked skill"
  - id: ERR_STORE_NOT_FOUND
    http: 404
    condition: "store_id does not resolve"
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "product id in the path does not resolve"
  - id: ERR_VARIANT_NOT_FOUND
    http: 404
    condition: "variant_id does not resolve"
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "customer_id does not resolve"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "order id does not resolve"
  - id: ERR_ORDER_LINE_NOT_FOUND
    http: 404
    condition: "order_line_id does not resolve"
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "inventory lot id does not resolve"
  - id: ERR_PROMOTION_NOT_FOUND
    http: 404
    condition: "promotion id does not resolve"
  - id: ERR_ARTIST_NOT_FOUND
    http: 404
    condition: "artist_id does not resolve"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "service booking id does not resolve"
  - id: ERR_RETURN_NOT_FOUND
    http: 404
    condition: "return request id does not resolve"
  - id: ERR_INVALID_ORDER_STATE
    http: 409
    condition: "the order's fulfillment_status or payment_status does not permit the requested transition"
  - id: ERR_INVALID_BOOKING_STATE
    http: 409
    condition: "the booking's status does not permit the requested transition"
  - id: ERR_INVALID_RETURN_STATE
    http: 409
    condition: "the return request is already APPROVED or DENIED, or its order is not in a returnable state"
  - id: ERR_STALE_ORDER_VERSION
    http: 412
    condition: "expected_order_version does not match Order.version on POST /orders/{id}/lines"
  - id: ERR_STALE_LOT_VERSION
    http: 412
    condition: "expected_lot_version does not match InventoryLot.version on a tester conversion"
  - id: ERR_RETURN_PRIVILEGE_SUSPENDED
    http: 403
    condition: "the customer has 3 or more hygiene strikes and return_privilege is SUSPENDED"
  - id: ERR_HYGIENE_NON_RETURNABLE
    http: 422
    condition: "a return is requested against a line whose hygiene_class is DIRECT_CONTACT"
  - id: ERR_TESTER_NOT_ALLOWED
    http: 422
    condition: "a tester conversion is requested on a lot whose product hygiene_class is DIRECT_CONTACT"
  - id: ERR_RETURN_WINDOW_EXPIRED
    http: 422
    condition: "the logical clock is more than 30 days past Order.fulfilled_at"
  - id: ERR_RETURN_QUANTITY_EXCEEDS_LINE
    http: 422
    condition: "returned_quantity + requested quantity exceeds the order line quantity"
  - id: ERR_ARTIST_TIME_CONFLICT
    http: 409
    condition: "the artist's buffered interval collides with an existing CONFIRMED / RESCHEDULE_PENDING booking"
  - id: ERR_PICKUP_SLOT_FULL
    http: 409
    condition: "the BOPIS pickup slot already holds bopis_slot_capacity orders"
  - id: ERR_MAX_RESCHEDULES
    http: 409
    condition: "a third reschedule is requested (reschedule_count is already 2)"
  - id: ERR_BOOKING_ORDER_MISMATCH
    http: 422
    condition: "linked_order_id names an order belonging to another customer or another store"
  - id: ERR_STORE_NOT_ACTIVE
    http: 409
    condition: "reserve attempted at a store whose status is PAUSED"
  - id: ERR_VARIANT_NOT_SELLABLE
    http: 409
    condition: "a SALE line names a DISCONTINUED variant"
  - id: ERR_LAUNCH_NOT_OPEN
    http: 409
    condition: "a limited-launch variant is still SCHEDULED, or its launch has been CLOSED"
  - id: ERR_LAUNCH_TIER_LOCKED
    http: 403
    condition: "the customer's tier does not clear the currently open launch window"
  - id: ERR_LAUNCH_CAP_EXCEEDED
    http: 409
    condition: "held units + requested units exceed Variant.per_customer_cap"
  - id: ERR_INSUFFICIENT_STOCK
    http: 409
    condition: "drawable units cannot cover the request and allow_partial is false"
  - id: ERR_INSUFFICIENT_POINTS
    http: 422
    condition: "points_redeemed exceeds Customer.points_balance at reserve"
  - id: ERR_POINTS_EXCEED_SUBTOTAL
    http: 422
    condition: "points_value_cents exceeds discounted_subtotal_cents"
  - id: ERR_PAYMENT_NOT_CAPTURED
    http: 409
    condition: "hand-over, ship, or linked-order booking completion attempted while payment_status is not CAPTURED"
  - id: ERR_NO_SHADE_MATCH
    http: 422
    condition: "the shade finder's candidate set is empty"
  - id: ERR_LOT_ALREADY_EXISTS
    http: 409
    condition: "an InventoryLot already exists for the (store_id, variant_id) pair"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Customer
    description: "A loyalty member who shops, redeems points, books services and requests returns"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /return-requests"
      - "POST /service-bookings/{id}/reschedule"
    shared_operations:
      - "POST /orders"
      - "POST /orders/{id}/lines"
      - "POST /orders/{id}/reserve"
      - "POST /orders/{id}/payments"
      - "POST /orders/{id}/cancel"
      - "POST /service-bookings"
      - "POST /service-bookings/{id}/cancel"
      - "POST /shade-recommendations"
      - "GET reads of their own customer, orders, order lines, points ledger, return requests and bookings"

  - name: StoreAssociate
    description: "Store staff: stages BOPIS orders, ships, converts testers, decides returns"
    identity: "opaque"
    exclusive_operations:
      - "POST /orders/{id}/fulfillment"
      - "POST /inventory-lots/{id}/tester-conversions"
      - "POST /return-requests/{id}/decision"
    shared_operations:
      - "POST /orders"
      - "POST /orders/{id}/lines"
      - "POST /orders/{id}/reserve"
      - "POST /orders/{id}/payments"
      - "POST /orders/{id}/cancel"
      - "POST /service-bookings"
      - "POST /service-bookings/{id}/cancel"
      - "POST /shade-recommendations"
      - "GET reads of stores, catalogue, inventory, orders, bookings, returns"

  - name: BeautyArtist
    description: "In-store service provider who confirms reschedules and closes bookings"
    identity: "entity_backed:Artist"
    exclusive_operations:
      - "POST /service-bookings/{id}/confirm"
      - "POST /service-bookings/{id}/complete"
    shared_operations:
      - "GET reads of stores, catalogue, artists and bookings"

  - name: MerchandisingAdmin
    description: "Catalogue, inventory, promotion, launch and loyalty-cycle operator"
    identity: "opaque"
    exclusive_operations:
      - "POST /stores"
      - "PATCH /stores/{id}"
      - "POST /products"
      - "POST /products/{id}/variants"
      - "PATCH /variants/{id}"
      - "POST /inventory-lots"
      - "POST /customers"
      - "POST /customers/{id}/tier-checkpoint"
      - "POST /promotions"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads of every resource"
