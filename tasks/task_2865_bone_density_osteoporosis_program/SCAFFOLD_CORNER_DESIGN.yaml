      - name: appointment_cancel_action_releases_the_order_and_the_counter
        claim_type: action_endpoint
        excluded_because:
          difficulty_instance: "compensating_invariant / cancelling_a_slot_restores_the_open_order_counter_and_reindexes_the_day"
          rationale: "The cancel action's full precondition and side-effect set - BOOKED-only gate, order revert to REQUESTED, open_scheduled_order_count decrement and slot_index reindexing of the surviving siblings - is already exercised end to end by that difficulty instance, so a separate endpoint-level instance would replay the same calls."
      - name: report_finalize_action_executes_its_four_side_effect_links
        claim_type: action_endpoint
        excluded_because:
          difficulty_instance: "transitive_cascade / report_finalize_cascades_four_levels_to_cancel_a_future_appointment"
          rationale: "Every side effect listed on POST /bone-density/diagnostic-reports/{id}/finalize is asserted link by link by that difficulty instance, down to the cancellation_reason_code of the appointment four levels away."
      - name: report_amend_action_reverses_the_finalize_side_effects
        claim_type: action_endpoint
        excluded_because:
          difficulty_instance: "compensating_invariant / amendment_reverses_every_finalize_side_effect_on_the_patient_ledger"
          rationale: "The amend endpoint's compensation semantics - counter decrement, re-derived baseline and last-finalized pointers, interval reset and the session returning to SUBMITTED - are the entire subject of that difficulty instance."
      - name: repeat_acquisition_action_is_allowed_only_after_a_repeat_required_review
        claim_type: conditional_action
        excluded_because:
          difficulty_instance: "non_linear_state_machine / session_repeat_cycle_reverts_acquisition_while_order_stays_terminal"
          rationale: "That difficulty instance drives the repeat action from a REPEAT_REQUIRED review and asserts the measurement supersession, the counter increment and the untouched terminal order, which is exactly the conditional-action claim for this endpoint."

  - section: errors
