            - "NOT ERR_CASE_BALANCE_INELIGIBLE (business_fiscal, priority 11) even though force_out_path == CASH_OUT also violates that rule"

      - name: transfer_safety_beats_referential
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_PRENOTICE_NOT_DELIVERED]
          - errors[ERR_RECORDKEEPER_NOT_ACTIVE]
        distinguishing_aspect: |
          Error-category pair business_safety(7) vs business_referential(9): a transfer attempted with
          NO delivered AUTO_PORTABILITY_PRENOTICE (safety) while the destination recordkeeper is
          SUSPENDED (referential) must return ERR_PRENOTICE_NOT_DELIVERED/422 — safety outranks
          referential. (SUSPEND — not EXIT — so the match stays CONFIRMED and no state error masks the pair.)
        test_recipe:
          setup:
            - "IRA ${ira} MATCHED via auto-confirmed match to plan Y at RK-B; no prenotice sent; RK-B then SUSPENDED (match survives suspension)"
