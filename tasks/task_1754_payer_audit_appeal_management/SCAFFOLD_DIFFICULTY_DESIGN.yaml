      - name: demand_hold_follows_appeal_filing
        grounds:
          - state_machines.RecoupmentDemand.DEMANDED_to_ON_HOLD
          - state_machines.Appeal.DRAFT_to_PENDING_DECISION
          - errors[ERR_DEMAND_ON_HOLD]
        distinguishing_aspect: |
          Pair RecoupmentDemand -> Appeal: whether a demand accepts offsets and
          whether it sits ON_HOLD is driven by the state of a DIFFERENT entity
          (the appeal) and the payer's hold_levels configuration — no hold when
          hold_levels is empty, hold when the filed level is listed, release
          when the appeal is withdrawn.
        test_recipe:
          setup:
            - "Payer P1 (hold_levels []) with case C1 + demand D1; payer P2 (hold_levels [LEVEL_1]) with case C2 + demand D2; both cases have one line denied 100000 and an L1 appeal"
