  # ===========================================================================
  # SECTION: cross_cutting_complexity_layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_account_version_on_grant_submit
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[grant-create-stale-account]
          - errors[ERR_STALE_ACCOUNT_VERSION]
          - endpoints.POST /daf/grants
        distinguishing_aspect: "Submitting a grant with expected_account_version one less than DonorAccount.version (stale after a prior grant bumped it) returns 412 ERR_STALE_ACCOUNT_VERSION."
        test_recipe:
          setup:
            - "Sponsor; VETTED Charity; ACTIVE account funded 1000000 cash; one grant already submitted (which bumped account version)."
          setup_api_calls:
            - call: "POST /daf/sponsors"
              payload: { name: "Occ Sponsor", ein: "27-0000001" }
              as: SponsorAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /daf/charities"
              payload: { sponsor_id: "${sponsor_id}", legal_name: "Occ Charity", ein: "27-9000001", ntee_code: "A20" }
              as: ComplianceOfficer
              captures: { charity_id: $.data.id }
            - call: "POST /daf/charities/${charity_id}/vet"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
            - call: "POST /daf/accounts"
              payload: { sponsor_id: "${sponsor_id}", account_name: "Occ Fund", primary_advisor_user_id: "adv-cc1" }
              as: SponsorAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /daf/contributions"
              payload: { donor_account_id: "${acct_id}", asset_type: "CASH", cash_amount_cents: 1000000 }
              as: DonorAdvisor
              as_user_id: "adv-cc1"
              captures: { contrib_id: $.data.id }
            - call: "POST /daf/contributions/${contrib_id}/settle"
              payload: {}
              as: ContributionAdmin
            - call: "GET /daf/accounts/${acct_id}"
              payload: {}
              as: DonorAdvisor
              as_user_id: "adv-cc1"
              captures: { ver_observed: $.data.version }
            - call: "POST /daf/grants"
              payload: { donor_account_id: "${acct_id}", charity_id: "${charity_id}", amount_cents: 100000, expected_account_version: "${ver_observed}" }
              as: DonorAdvisor
              as_user_id: "adv-cc1"
