  # ===========================================================================
  # Cross-Cutting Complexity Layers
  # ===========================================================================
  - section: cross_cutting
    instances:
      - name: occ_stale_lot_version_on_reservation_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reservation-create-stale-lot]
          - errors[ERR_STALE_LOT_VERSION]
          - entities.Lot.fields.version
        distinguishing_aspect: "After one reservation create advances Lot.version, a second create still carrying the pre-advance expected_lot_version → ERR_STALE_LOT_VERSION 412; two strictly sequential requests."
        test_recipe:
          setup:
            - "Clock 2026-06-30T09:00:00Z; SURFACE_LOT cap5; DAILY plan; two STANDARD vehicles for two customers; client observes Lot.version then books once (version advances)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /customers"
              payload: { email: "co1@x.com", full_name: "CO1" }
              as: FacilityAdmin
              captures: { c1: $.data.id }
            - call: "POST /customers"
              payload: { email: "co2@x.com", full_name: "CO2" }
              as: FacilityAdmin
              captures: { c2: $.data.id }
            - call: "POST /lots"
              payload: { name: "Locc", kind: "SURFACE_LOT", standard_capacity: 5, oversized_capacity: 0, ev_capacity: 0, in_out_allowed: false }
              as: FacilityAdmin
              captures: { lot_id: $.data.id, lot_v0: $.data.version }
            - call: "POST /rate-plans"
              payload: { lot_id: "${lot_id}", rate_mode: "DAILY", daily_cap_cents: 2000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${c1}", plate: "OCC1", size_class: "STANDARD", is_ev: false }
              as: FacilityAdmin
              captures: { v1: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${c2}", plate: "OCC2", size_class: "STANDARD", is_ev: false }
              as: FacilityAdmin
              captures: { v2: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${c1}", lot_id: "${lot_id}", vehicle_id: "${v1}", rate_plan_id: "${rp_id}", scheduled_start: "2026-07-01T10:00:00Z", scheduled_end: "2026-07-02T10:00:00Z", prepaid: false, expected_lot_version: "${lot_v0}" }
              as: FacilityAdmin
              captures: { res1: $.data.id }
          trigger:
            - call: "POST /reservations"
              payload: { customer_id: "${c2}", lot_id: "${lot_id}", vehicle_id: "${v2}", rate_plan_id: "${rp_id}", scheduled_start: "2026-07-01T11:00:00Z", scheduled_end: "2026-07-02T11:00:00Z", prepaid: false, expected_lot_version: "${lot_v0}" }
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_LOT_VERSION"
            - "HTTP status == 412"

      - name: occ_stale_shuttle_version_on_assign
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[shuttle-assign-stale-trip]
          - errors[ERR_STALE_SHUTTLE_VERSION]
          - entities.ShuttleTrip.fields.version
        distinguishing_aspect: "After one assign-shuttle advances ShuttleTrip.version, a second assign carrying the pre-advance expected_shuttle_trip_version → ERR_STALE_SHUTTLE_VERSION 412; two strictly sequential requests."
        test_recipe:
          setup:
            - "Clock 2026-06-30T09:00:00Z; SURFACE_LOT cap5; one trip seat_capacity=4; two BOOKED reservations; client observes trip.version then assigns res1 (version advances)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /customers"
              payload: { email: "cs1@x.com", full_name: "CS1" }
              as: FacilityAdmin
              captures: { c1: $.data.id }
            - call: "POST /customers"
              payload: { email: "cs2@x.com", full_name: "CS2" }
