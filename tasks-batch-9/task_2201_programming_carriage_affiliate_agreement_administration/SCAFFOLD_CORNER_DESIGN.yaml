                agreement_id: "${am_id}"
                content_title_id: "${ct_id}"
                platform: "LINEAR"
                territory_code: "US"
                window_start: "2026-10-01T00:00:00Z"
                window_end: "2026-10-31T00:00:00Z"
                exclusivity: "EXCLUSIVE"
              as: RightsAdministrator
              as_user_id: "u-rights-1"
              captures:
                wx_id: "id"
            - call: "POST /carriage/rights-windows/${wx_id}/lifecycle"
              payload:
                action: "CLEAR"
              as: RightsAdministrator
              as_user_id: "u-rights-1"
            - call: "POST /carriage/rights-windows"
              payload:
                agreement_id: "${am_id}"
                content_title_id: "${ct_id}"
                platform: "LINEAR"
                territory_code: "US"
                window_start: "2026-10-10T00:00:00Z"
                window_end: "2026-10-20T00:00:00Z"
                exclusivity: "NON_EXCLUSIVE"
              as: RightsAdministrator
              as_user_id: "u-rights-1"
              captures:
                wn_id: "id"
            - call: "GET /carriage/rights-windows/${wn_id}"
              as: RightsAdministrator
              as_user_id: "u-rights-1"
              captures:
                wn_version: "version"
          trigger:
            - call: "POST /carriage/rights-windows/${wn_id}/lifecycle"
              payload:
                action: "CLEAR"
              as: RightsAdministrator
              as_user_id: "u-rights-1"
          assert:
            - "response status code == 409"
            - "response body data.error_id == \"ERR_WINDOW_EXCLUSIVITY_CONFLICT\""
            - "GET /carriage/rights-windows/${wn_id} returns status == \"PLANNED\" and version == ${wn_version} — the refusal incremented nothing"
            - "GET /carriage/content-titles/${ct_id} returns cleared_window_count == 1 and distribution_coverage_status == \"LINEAR_ONLY\" — only the EXCLUSIVE window counts, and the failed clear did not bump the counter"
            - "GET /carriage/rights-windows with agreement_id=${am_id} and status=\"CLEARED\" and limit=10 returns total_count == 1"
            - "GET /carriage/rights-windows/${wx_id} returns status == \"CLEARED\" and block_reason == \"NONE\" — the incumbent was not disturbed by the attempt"
