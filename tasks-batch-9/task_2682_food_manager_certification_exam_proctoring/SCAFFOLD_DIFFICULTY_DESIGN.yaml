          A different conserved quantity from the inventory instance: the ledger identity
          credit_balance_cents == lifetime_credited_cents - lifetime_charged_cents. Certificate issuance
          debits CERT_ISSUANCE_FEE_CENTS (1500) and the substantiated-incident revocation credits exactly
          the same 1500 back, so credit_balance_cents returns to its pre-issuance value 496238 with zero
          drift, while BOTH lifetime counters grow (charged 3762 -> 5262, credited 500000 -> 501500).
