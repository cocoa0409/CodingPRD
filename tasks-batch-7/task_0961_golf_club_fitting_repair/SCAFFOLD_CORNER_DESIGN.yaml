              captures: { spec_v2: $.data.version }
          trigger:
            - call: "POST /golf-shop/build-specs/${spec_id}/quote"
              payload: { expected_build_spec_version: "${spec_v}" }
              as: FittingSpecialist
              as_user_id: "${fs_id}"
              captures: { err: $.data.error_id }
            - call: "POST /golf-shop/build-specs/${spec_id}/quote"
