            - call: "POST /revrec/contracts"
              payload: { customer_id: "${u1}", contract_ref: "CC-3", signed_date: "2026-05-12", fixed_consideration_cents: 70000, risk_tier: "STANDARD", package_negotiated_flag: false }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { c3: $.data.id }
          trigger:
            - call: "POST /revrec/contracts/${c1}/absorb"
              payload: { absorbed_contract_id: "${c2}" }
              as: RevenueManager
              as_user_id: "mgr-1"
              captures: { err_cross: $.data.error_id }
            - call: "POST /revrec/contracts/${c3}/absorb"
              payload: { absorbed_contract_id: "${c1}" }
