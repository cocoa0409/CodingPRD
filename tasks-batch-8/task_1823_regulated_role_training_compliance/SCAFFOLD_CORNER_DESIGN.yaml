          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /compliance/regulators", payload: { code: "REG-ANO", name: "Anon Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 5 }, as: Anonymous, captures: { err: "$.data.error_id" } }
          assert:
            - "err == \"ERR_FORBIDDEN_ROLE\" (HTTP 403)"

