# =============================================================================
# Task 1844 — Payroll Garnishment & Wage Order Processing
# Scaffold seed tables (§1.0–§1.7). Difficulty design lives in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml; corner design lives in
# SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  1844. Payroll Garnishment & Wage Order Processing (payroll operations): order
  intake & validation of issuing authority, priority ordering across multiple
  garnishments, disposable earnings & maximum withholding calculation by state,
  employee notification requirements, remittance to agencies & payment timing,
  termination/answer response to court, error correction & refund to employee,
  recordkeeping & audit trail

domain_name: payroll-garnishment-wage-orders
api_prefix: /

complexity_profile:
  primary_archetype: quota / allocation
  secondary_archetype: compliance / audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: hybrid
  # Employer → Employee tree, with GarnishmentOrder / WithholdingEvent as flat
  # FK-linked peers and Remittance as a cross-aggregate child of IssuingAuthority.

  state_machine_shape: parallel
  # GarnishmentOrder carries two independent dimensions
  # (processing_status × remit_posture); Remittance is posture_driven
  # (CONFIRMED/CANCELLED derived from member posting states).

  relationship_patterns:
    - one_to_many          # Employer→Employee, Employee→PayrollRun/PayStatement, Order→Event
    - cross_aggregate      # Remittance.authority_id crosses the Employer tree

  role_model: segregation_of_duties
  # The operator who runs payroll (PayrollSpecialist) cannot confirm remittances
  # or file answers (PayrollManager); ComplianceAuditor is read-only.
  # employer_payroll_admin pins employer-level configuration.

  consistency_model: immediate
  # All cascades complete atomically inside the triggering request.

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Employer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Employer legal name" }
      - { name: fein, type: string, source: input, description: "Federal EIN; unique across employers" }
      - { name: remittance_timing, type: enum, source: input, description: "Per-employer remittance timing policy; one of SAME_DAY | NEXT_BUSINESS_DAY | THREE_BUSINESS_DAYS" }
      - { name: payroll_calendar, type: object, source: input, description: "Semi-monthly pay calendar: { period_start: 'YYYY-MM-DD' (inclusive), period_end: 'YYYY-MM-DD' (inclusive), pay_date: 'YYYY-MM-DD' } for the seed period" }
      - { name: administrative_fee_policy, type: enum, source: input, description: "Employer fee policy per active order per paid run: NONE | PER_ORDER" }
      - { name: admin_fee_cents, type: integer, source: input, default: 0, description: "Fee in cents per active garnished order per paid run when policy=PER_ORDER; must be >= 0" }
      - { name: version, type: integer, source: system, description: "OCC counter (from common_fields); bumped by POST /payroll-runs and POST /employees (cascade)" }

  - name: Employee
    parent: Employer
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: system, description: "FK -> Employer.id" }
      - { name: full_name, type: string, source: input, description: "Employee legal name" }
      - { name: work_state_code, type: string, source: input, description: "2-letter state code governing disposable-earnings caps; must exist in StateRule" }
      - { name: pay_frequency, type: enum, source: input, description: "WEEKLY | BIWEEKLY | SEMIMONTHLY | MONTHLY; used to normalize the federal minimum-wage floor" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Hourly rate in cents; only consulted when work_state_code == 'TX' (hourly wage test)" }
      - { name: termination_date, type: string, source: input, default: null, description: "ISO date; when set, employee is terminated (immutable once set)" }
      - { name: expected_employer_version, type: integer, source: input, description: "OCC: caller's last-observed Employer.version; required on POST /employees" }

  - name: PayrollRun
    parent: Employer
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: system, description: "FK -> Employer.id" }
      - { name: period_start, type: string, source: input, description: "ISO date, inclusive; must be after employer's latest non-voided run's period_end (half-open period separation)" }
      - { name: period_end, type: string, source: input, description: "ISO date, inclusive; >= period_start" }
      - { name: pay_date, type: string, source: input, description: "ISO date the net pay is disbursed; drives remittance due-date computation" }
      - { name: status, type: enum, source: system, description: "OPEN | PAID | VOIDED (terminal: PAID, VOIDED)" }
      - { name: expected_employer_version, type: integer, source: input, description: "OCC: caller's last-observed Employer.version; required on create and on /pay and /void" }

  - name: PayStatement
    parent: PayrollRun
    common_fields: true
    fields:
      - { name: payroll_run_id, type: string, source: system, description: "FK -> PayrollRun.id" }
      - { name: employer_id, type: string, source: system, description: "FK -> Employer.id" }
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id" }
      - { name: gross_earnings_cents, type: integer, source: input, description: "Gross wages for the period, cents; > 0" }
      - { name: mandatory_deductions_cents, type: integer, source: input, description: "Taxes and other legally mandated deductions, cents; >= 0 and < gross_earnings_cents" }
      - { name: hours_worked, type: number, source: input, description: "Hours in period; required (must be > 0) iff employee.work_state_code == 'TX' for the hourly floor test; ignored otherwise" }
      - { name: disposable_earnings_cents, type: integer, source: computed, description: "= gross_earnings_cents - mandatory_deductions_cents" }
      - { name: total_withheld_cents, type: integer, source: computed, description: "Sum of withholding_events for this statement (refunds excluded)" }
      - { name: total_admin_fee_cents, type: integer, source: computed, description: "Employer fee charged on this statement" }
      - { name: net_pay_cents, type: integer, source: computed, description: "= disposable_earnings_cents - total_withheld_cents - total_admin_fee_cents; must remain >= 0" }
      - { name: computation_breakdown, type: object, source: computed, description: "Per-order allocation trace: [{order_id, awarded_cents, basis, note}] produced by the waterfall; the empirical computation_proof" }

  - name: IssuingAuthority
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Court / agency name" }
      - { name: authority_type, type: enum, source: input, description: "COURT | CHILD_SUPPORT_AGENCY | FEDERAL_AGENCY | STATE_AGENCY" }
      - { name: state_code, type: string, source: input, description: "2-letter state code of jurisdiction" }
      - { name: accepted_case_number_pattern, type: string, source: input, description: "Regex the order's case_number must match (issuing-authority validation)" }

  - name: GarnishmentOrder
    parent: Employee
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id" }
      - { name: employer_id, type: string, source: system, description: "FK -> Employer.id (denormalized for filtering)" }
      - { name: issuing_authority_id, type: string, source: input, description: "FK -> IssuingAuthority.id" }
      - { name: case_number, type: string, source: input, description: "Must match authority.accepted_case_number_pattern" }
      - { name: order_type, type: enum, source: input, description: "CHILD_SUPPORT | FEDERAL_TAX_LEVY | STUDENT_LOAN | CREDITOR" }
      - { name: amount_model, type: enum, source: input, description: "PERCENT_OF_DISPOSABLE | FIXED_AMOUNT_PER_PERIOD | LUMP_SUM_BALANCE" }
      - { name: amount_value, type: integer, source: input, description: "Percent basis points (e.g., 2500 = 25%) for PERCENT_OF_DISPOSABLE; cents per period for FIXED_AMOUNT_PER_PERIOD; ignored for LUMP_SUM_BALANCE" }
      - { name: total_balance_cents, type: integer, source: input, description: "Original ordered balance in cents; the conserved total. > 0" }
      - { name: remaining_balance_cents, type: integer, source: computed, description: "= total_balance_cents - withheld_cents + refunded_cents" }
      - { name: withheld_cents, type: integer, source: computed, description: "Cumulative posted withholding cents for this order" }
      - { name: refunded_cents, type: integer, source: computed, description: "Cumulative refunded cents for this order" }
      - { name: effective_date, type: string, source: input, description: "ISO date order takes effect; drives retroactive first-period proration" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock timestamp of receipt; priority tie-break (earlier wins)" }
      - { name: answer_due_date, type: string, source: computed, description: "= business_days(ANSWER_SLA_DAYS) after received_at" }
      - { name: notification_due_at, type: datetime, source: computed, description: "= received_at + NOTIFICATION_SLA_DAYS calendar days" }
      - { name: notification_sent_at, type: datetime, source: system, default: null, description: "When employee notification was sent (null = unsent)" }
      - { name: processing_status, type: enum, source: system, description: "RECEIVED | VALIDATED | EMPLOYEE_NOTIFIED | ACTIVE | ANSWER_FILED | SUSPENDED | SATISFIED | TERMINATED | REJECTED" }
      - { name: remit_posture, type: enum, source: system, description: "REMITTING | HELD | CLOSED — parallel dimension; withholding requires REMITTING" }
      - { name: hold_reason, type: enum, source: system, default: null, description: "Set iff remit_posture == HELD: REFUND_PENDING | DISPUTED | null" }

  - name: StateRule
    parent: null
    common_fields: false
    # Configuration entity: id + created_at only; immutable, administered.
    fields:
      - { name: state_code, type: string, source: input, description: "2-letter state code; unique" }
      - { name: caps, type: object, source: input, description: "Per-order-type cap as fraction of disposable earnings: { CHILD_SUPPORT: 0.50, FEDERAL_TAX_LEVY: 0.65, STUDENT_LOAN: 0.15, CREDITOR: 0.25 } (values vary by state; these are CA defaults)" }
      - { name: min_wage_multiplier, type: number, source: input, description: "Multiplier M of the hourly federal minimum wage for the weekly floor: floor_weekly = M * FEDERAL_MINIMUM_WAGE_CENTS * 40" }
      - { name: hourly_floor_cents, type: integer, source: input, description: "For hourly-test states (e.g., TX): disposable earnings must not fall below hours_worked * hourly_floor_cents after withholding" }
      - { name: fee_deductible_from_wages, type: boolean, source: input, description: "If false, employer admin fee may NOT be deducted from employee net pay (borne by employer; recorded but net_pay unaffected by fee)" }

  - name: WithholdingEvent
    parent: GarnishmentOrder
    common_fields: false
    # Append-only event log: no update, no version.
    fields:
      - { name: garnishment_order_id, type: string, source: system, description: "FK -> GarnishmentOrder.id" }
      - { name: employer_id, type: string, source: system, description: "FK -> Employer.id" }
      - { name: payroll_run_id, type: string, source: system, description: "FK -> PayrollRun.id" }
      - { name: pay_statement_id, type: string, source: system, description: "FK -> PayStatement.id" }
      - { name: event_type, type: enum, source: system, description: "WITHHOLD | REFUND" }
      - { name: amount_cents, type: integer, source: system, description: "WITHHOLD: > 0; REFUND: < 0 (signed)" }
      - { name: computation_proof, type: object, source: system, description: "{ disposable_earnings_cents, pool_cents, cap_fraction, cap_cents, floor_cents, rank, basis } at posting time; basis enum: FULL | PRORATED (effective_date inside period) | CAPPED_BY_STATE | CAPPED_BY_POOL | CAPPED_BY_BALANCE | FINAL_PARTIAL (award closed the balance) | BLOCKED_BY_SUPPORT (creditor non-compete)" }
      - { name: created_logical_at, type: datetime, source: system, description: "Logical-clock timestamp of posting" }

  - name: Remittance
    parent: IssuingAuthority
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: system, description: "FK -> Employer.id" }
      - { name: authority_id, type: string, source: input, description: "FK -> IssuingAuthority.id" }
      - { name: payroll_run_id, type: string, source: input, description: "FK -> PayrollRun.id; unique together with authority_id (one remittance per authority per run)" }
      - { name: amount_due_cents, type: integer, source: computed, description: "Sum of unassigned WITHHOLD events for this authority+run" }
      - { name: status, type: enum, source: system, description: "PENDING | CONFIRMED | LATE_CONFIRMED | CANCELLED" }
      - { name: due_date, type: string, source: computed, description: "business_days(payroll_run.pay_date + employer.remittance_timing)" }
      - { name: confirmed_at, type: datetime, source: system, default: null, description: "Logical timestamp of confirmation (null until confirmed)" }
      - { name: member_event_ids, type: array, source: system, description: "WithholdingEvent ids swept into this remittance at creation" }

  - name: AuditLogEntry
    parent: Employer
    common_fields: false
    # Append-only, immutable, hash-chained.
    fields:
      - { name: employer_id, type: string, source: system, description: "FK -> Employer.id" }
      - { name: entity_type, type: string, source: system, description: "Entity mutated (e.g., GarnishmentOrder)" }
      - { name: entity_id, type: string, source: system, description: "Id of mutated entity" }
      - { name: action, type: string, source: system, description: "Endpoint/action label (e.g., order.validate, run.pay)" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role of the actor (or SYSTEM)" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID of the actor (or 'system')" }
      - { name: payload_hash, type: string, source: system, description: "sha256 hex of canonical payload JSON" }
      - { name: prev_hash, type: string, source: system, description: "sha256 hex of previous AuditLogEntry for this employer ('GENESIS' for first)" }
      - { name: entry_hash, type: string, source: system, description: "sha256(prev_hash | payload_hash | created_at)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: GarnishmentOrder
    initial_state: "RECEIVED (remit_posture: REMITTING)"
    terminal_states: ["SATISFIED", "TERMINATED", "REJECTED (all with remit_posture CLOSED)"]
    note: >
      Two parallel dimensions on one entity. processing_status walks the
      legal/workflow pipeline; remit_posture independently gates whether
      withholding may post (REMITTING) and whether the order counts toward
      remittances. Withholding requires processing_status == ACTIVE AND
      remit_posture == REMITTING.
    transitions:
      # --- intake ---
      - from: RECEIVED
        to: VALIDATED
        trigger: "POST /orders/{id}/validate"
        actor: PayrollSpecialist
        preconditions:
          - "processing_status == RECEIVED"
          - "Employee.termination_date is null (else ERR_EMPLOYEE_TERMINATED_INELIGIBLE)"
          - "order_type is compatible with issuing_authority.authority_type (else ERR_AUTHORITY_MISMATCH): CHILD_SUPPORT requires CHILD_SUPPORT_AGENCY; FEDERAL_TAX_LEVY requires FEDERAL_AGENCY; CREDITOR requires COURT; STUDENT_LOAN accepts FEDERAL_AGENCY or STATE_AGENCY"
          - "A StateRule row exists for employee.work_state_code (else ERR_STATE_RULE_MISSING)"
          - "No other non-terminal GarnishmentOrder on the same employee with the same (order_type, case_number) (else ERR_DUPLICATE_ACTIVE_ORDER)"
        side_effects:
          - "processing_status = VALIDATED"
          - "AuditLogEntry appended (action=order.validate)"

      - from: RECEIVED
        to: REJECTED
        trigger: "POST /orders/{id}/reject"
        actor: PayrollSpecialist
        preconditions:
          - "processing_status == RECEIVED"
        side_effects:
          - "processing_status = REJECTED; remit_posture = CLOSED"
          - "AuditLogEntry appended (action=order.reject)"

      # --- notification & activation ---
      - from: VALIDATED
        to: EMPLOYEE_NOTIFIED
        trigger: "POST /orders/{id}/notify"
        actor: PayrollSpecialist
        preconditions:
          - "processing_status == VALIDATED"
        side_effects:
          - "notification_sent_at = current logical time; lateness vs notification_due_at recorded in computation trace"
          - "AuditLogEntry appended (action=order.notify)"

      - from: EMPLOYEE_NOTIFIED
        to: ACTIVE
        trigger: "POST /orders/{id}/activate"
        actor: PayrollSpecialist
        preconditions:
          - "processing_status == EMPLOYEE_NOTIFIED"
          - "notification_sent_at is not null"
          - "Employee.termination_date is null (else ERR_EMPLOYEE_TERMINATED_INELIGIBLE)"
        side_effects:
          - "AuditLogEntry appended (action=order.activate)"

      - from: RECEIVED
        to: ACTIVE
        trigger: "implicit — when the pay run closes (pay transition) an order may be swept into allocation even if notification/activation lapsed; the payroll engine treats RECEIVED/VALIDATED/EMPLOYEE_NOTIFIED/ACTIVE orders as WITHHOLDABLE but only orders in ACTIVE remit REMITTING posture post to remittance"
        actor: system
        preconditions: []
        side_effects: []
        note: "No-op documentation row: withhodable set = processing_status IN {RECEIVED, VALIDATED, EMPLOYEE_NOTIFIED, ACTIVE} AND remit_posture == REMITTING. Only ACTIVE orders' events are swept into Remittance on create-remittance; events of non-ACTIVE orders stay unassigned until the order reaches ACTIVE."

      # --- suspend / resume cycle (cyclic) ---
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /orders/{id}/suspend"
        actor: PayrollManager
        preconditions:
          - "processing_status == ACTIVE"
          - "suspension_count < MAX_SUSPENSIONS (3) (else ERR_SUSPEND_LIMIT_EXCEEDED)"
        side_effects:
          - "remit_posture = HELD; hold_reason = input reason (DISPUTED | REFUND_PENDING)"
          - "AuditLogEntry appended (action=order.suspend)"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /orders/{id}/resume"
        actor: PayrollManager
        preconditions:
          - "processing_status == SUSPENDED"
          - "Employee.termination_date is null"
        side_effects:
          - "remit_posture = REMITTING; hold_reason = null; suspension_count unchanged (only /suspend increments)"
          - "Any unassigned WITHHOLD events for this order become eligible for the next create-remittance sweep"
          - "AuditLogEntry appended (action=order.resume)"

      # --- answer to court ---
      - from: ACTIVE
        to: ANSWER_FILED
        trigger: "POST /orders/{id}/answer with answer_type=ACCEPTED"
        actor: PayrollManager
        preconditions:
          - "processing_status == ACTIVE"
          - "answer_date <= answer_due_date else answer is LATE (still legal; flagged)"
        side_effects:
          - "processing_status = ANSWER_FILED (continues withholding identically to ACTIVE)"
          - "AuditLogEntry appended (action=order.answer)"

      - from: ANSWER_FILED
        to: ACTIVE
        trigger: "system (no-op return: ANSWER_FILED behaves as ACTIVE for withholding; explicit un-answer not supported — this transition exists only via /suspend then /resume returning to ACTIVE)"
        actor: system
        preconditions: []
        side_effects: []
        note: "ANSWER_FILED is withholding-equivalent to ACTIVE. /suspend is legal from ANSWER_FILED (treated as ACTIVE for that check)."

      # --- satisfaction (bubble-up auto transition) ---
      - from: ACTIVE
        to: SATISFIED
        trigger: "system (during run pay waterfall, when remaining_balance_cents would reach 0 after awarding the capped final withholding)"
        actor: system
        preconditions:
          - "remaining_balance_cents > 0 and awarded amount == remaining_balance_cents (final dollar)"
        side_effects:
          - "processing_status = SATISFIED; remit_posture = CLOSED"
          - "The final WITHHOLD event is posted with basis=FINAL_PARTIAL"
          - "Sibling orders on the same employee absorb the freed pool in the same waterfall pass (no re-run needed)"
          - "AuditLogEntry appended (action=order.satisfy)"

      # --- termination paths ---
      - from: "ACTIVE | ANSWER_FILED | SUSPENDED"
        to: TERMINATED
        trigger: "POST /orders/{id}/terminate"
        actor: PayrollManager
        preconditions:
          - "processing_status IN {ACTIVE, ANSWER_FILED, SUSPENDED}"
          - "A later order on the same employee sharing (order_type, case_number) must not exist in a non-terminal state (else ERR_DUPLICATE_ACTIVE_ORDER)"
        side_effects:
          - "processing_status = TERMINATED; remit_posture = CLOSED"
          - "Employee.cascade: if employee.termination_date is set and ALL orders on the employee are now terminal, no further runs may include the employee (enforced at statement creation)"
          - "Freed pool applies from the next waterfall onward (current OPEN run unaffected unless voided and re-run)"
          - "AuditLogEntry appended (action=order.terminate)"

      - from: SATISFIED
        to: TERMINATED
        trigger: "POST /orders/{id}/terminate (administrative close of a satisfied order)"
        actor: PayrollManager
        preconditions:
          - "processing_status == SATISFIED"
        side_effects:
          - "AuditLogEntry appended (action=order.terminate)"

  - entity: PayrollRun
    initial_state: OPEN
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: OPEN
        to: PAID
        trigger: "POST /payroll-runs/{id}/pay"
        actor: PayrollSpecialist
        preconditions:
          - "status == OPEN"
          - "expected_employer_version matches Employer.version (else ERR_STALE_VERSION, 412)"
          - "Every PayStatement in the run has been created (at least one) (else ERR_RUN_EMPTY)"
        side_effects:
          - "Run the disposable-earnings waterfall per employee per statement (calc: withholding_waterfall)"
          - "Post one WITHHOLD WithholdingEvent per awarded order (idempotent per (pay_statement_id, garnishment_order_id))"
          - "GarnishmentOrder.withheld_cents / remaining_balance_cents updated; orders hitting zero auto-transition ACTIVE→SATISFIED"
          - "PayStatement.total_withheld_cents / total_admin_fee_cents / net_pay_cents / computation_breakdown finalized"
          - "status = PAID; Employer.version += 1"
          - "Remittances are NOT auto-created (explicit create-remittance step); LATE detection for existing PENDING remittances of other runs is evaluated at their confirm time"
          - "AuditLogEntry appended per statement (action=run.pay)"

      - from: OPEN
        to: VOIDED
        trigger: "POST /payroll-runs/{id}/void"
        actor: PayrollSpecialist
        preconditions:
          - "status == OPEN"
          - "No WITHHOLD events exist for any statement of this run (else ERR_RUN_HAS_POSTED_EVENTS)"
        side_effects:
          - "status = VOIDED; statements remain but are inert"
          - "Employer.version += 1"
          - "AuditLogEntry appended (action=run.void)"

  - entity: Remittance
    initial_state: PENDING
    terminal_states: [CONFIRMED, LATE_CONFIRMED, CANCELLED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /remittances/{id}/confirm"
        actor: PayrollManager
        preconditions:
          - "status == PENDING"
          - "current logical date <= due_date (else lands in LATE_CONFIRMED instead)"
          - "amount_due_cents > 0 (else ERR_REMITTANCE_EMPTY)"
        side_effects:
          - "status = CONFIRMED; confirmed_at = now"
          - "AuditLogEntry appended (action=remittance.confirm)"

      - from: PENDING
        to: LATE_CONFIRMED
        trigger: "POST /remittances/{id}/confirm when current logical date > due_date"
        actor: PayrollManager
        preconditions:
          - "status == PENDING"
        side_effects:
          - "status = LATE_CONFIRMED; confirmed_at = now; lateness recorded"
          - "AuditLogEntry appended (action=remittance.confirm)"

      - from: PENDING
        to: CANCELLED
        trigger: "system (posture-driven: when a refund-after-remit correction targets a WITHHOLD event already swept into this remittance and the refund reduces the remittance's effective total to 0) OR POST /remittances/{id}/cancel by PayrollManager when all member events have been refunded"
        actor: system | PayrollManager
        preconditions:
          - "status == PENDING"
          - "Every member WITHHOLD event has a compensating REFUND event"
        side_effects:
          - "status = CANCELLED"
          - "AuditLogEntry appended (action=remittance.cancel)"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only — OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: order-create-stale-employee
    parent_entity: Employee
    write_endpoint: "POST /employees/{employeeId}/orders"
    occ_field: "expected_employee_version"
    description: |
      Creating a GarnishmentOrder against an Employee whose version has
      advanced since the client last observed it is rejected. Another writer
      may have just created or terminated an order (mutating the Employee via
      cascade), making the current writer's view of the employee's order set
      stale (duplicate-priority and duplicate-order decisions depend on it).
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: run-pay-stale-employer
    parent_entity: Employer
    write_endpoint: "POST /payroll-runs/{runId}/pay"
    occ_field: "expected_employer_version"
    description: |
      Paying a PayrollRun against an Employer whose version has advanced
      since the client last observed it is rejected. A prior paid run or a
      configuration change (remittance_timing, admin_fee_policy) mutates
      Employer.version; paying with a stale view risks double-withholding
      across runs and wrong fee policy.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: run-create-stale-employer
    parent_entity: Employer
    write_endpoint: "POST /payroll-runs"
    occ_field: "expected_employer_version"
    description: |
      Creating a PayrollRun against an Employer whose version has advanced
      since the client last observed it is rejected, because the caller's
      period-window decision (period_start after the latest run's period_end)
      was computed from a stale view of the employer's run history.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: withholding_waterfall
    trigger: "POST /payroll-runs/{id}/pay (per employee, per statement)"
    algorithm: waterfall_allocation
    input_set: |
      All GarnishmentOrders for the employee with processing_status IN
      {RECEIVED, VALIDATED, EMPLOYEE_NOTIFIED, ACTIVE, ANSWER_FILED} AND
      remit_posture == REMITTING AND effective_date <= run.period_end.
      Only ACTIVE/ANSWER_FILED orders' events become remittance-assignable;
      others post events but stay unassigned (see create_remittance sweep).
    formula: |
      # Step 1 — disposable earnings
      DE = gross_earnings_cents - mandatory_deductions_cents          # >= 1

      # Step 2 — protected floor (state-dependent)
      weekly_floor = StateRule.min_wage_multiplier * FEDERAL_MINIMUM_WAGE_CENTS * 40
      period_floor = weekly_floor * PERIOD_WEEKS[employee.pay_frequency]  # 1, 2, 2.1667, 4.3333 → round to cents
      IF employee.work_state_code == 'TX':
          period_floor = hours_worked * StateRule.hourly_floor_cents      # hourly-test variant
      pool = max(0, DE - period_floor)

      # Step 3 — priority ordering
      rank class: CHILD_SUPPORT(1) < FEDERAL_TAX_LEVY(2) < STUDENT_LOAN(3) < CREDITOR(4)
      within class: received_at ASC, then effective_date ASC, then created_at ASC (never id)

      # Step 4 — retroactive proration factor
      For an order with effective_date inside the period:
          days_effective = period_end - max(effective_date, period_start) + 1
          days_period    = period_end - period_start + 1
          factor = days_effective / days_period        # exact rational; multiply BEFORE rounding
      Otherwise factor = 1.

      # Step 5 — waterfall with per-state caps
      remaining_pool = pool
      FOR order IN priority order:
          raw_demand =
              PERCENT_OF_DISPOSABLE : round_half_up(DE * amount_value / 10000 * factor)
              FIXED_AMOUNT_PER_PERIOD: round_half_up(amount_value * factor)
              LUMP_SUM_BALANCE      : remaining_balance_cents            # no factor
          cap_cents = round_half_up(DE * StateRule.caps[order.order_type])
          award = min(raw_demand, cap_cents, remaining_pool, remaining_balance_cents)
          # CREDITOR non-compete: if any CHILD_SUPPORT order was awarded > 0 this pass,
          # CREDITOR orders are skipped entirely (award = 0, basis=BLOCKED_BY_SUPPORT).
          post WITHHOLD(order, award) only when award > 0 (zero-award orders record a
          computation_breakdown line but no WithholdingEvent); remaining_pool -= award
          if award == remaining_balance_cents_before: order → SATISFIED

      # Step 6 — employer administrative fee (computed LAST, never reduces awards)
      IF employer.administrative_fee_policy == PER_ORDER:
          total_admin_fee_cents = admin_fee_cents * count(orders awarded > 0)
          IF StateRule.fee_deductible_from_wages:
              net_pay = DE - total_withheld - total_admin_fee_cents
              REQUIRE net_pay >= 0 else fee clipped to DE - total_withheld
          ELSE:
              net_pay = DE - total_withheld     # fee recorded, borne by employer
      ELSE: total_admin_fee_cents = 0; net_pay = DE - total_withheld

      # Invariant: total_withheld <= pool and net_pay >= period_floor (when floor < DE).
    constants:
      FEDERAL_MINIMUM_WAGE_CENTS: 725      # $7.25/hr
      PERIOD_WEEKS: { WEEKLY: 1, BIWEEKLY: 2, SEMIMONTHLY: 2.1667, MONTHLY: 4.3333 }
      ANSWER_SLA_DAYS: 10                  # business days
      NOTIFICATION_SLA_DAYS: 7             # calendar days
      MAX_SUSPENSIONS: 3
    precision: "integer cents; all intermediate multiplications at full precision, single round_half_up per award line; period_floor rounded half-up to cents before pool subtraction"
    variants:
      - name: floor_variant_weekly_normalized
        when: "employee.work_state_code != 'TX'"
        difference: "period_floor = multiplier * 725 * 40 * PERIOD_WEEKS[pay_frequency], round_half_up to cents"
      - name: floor_variant_hourly_test
        when: "employee.work_state_code == 'TX'"
        difference: "period_floor = round_half_up(hours_worked * StateRule.hourly_floor_cents); ignores pay_frequency and the federal multiplier"

  - name: remittance_due_date
    trigger: "POST /remittances (create-remittance) — computed at creation"
    algorithm: chronological
    input_set: "payroll_run.pay_date, employer.remittance_timing"
    formula: |
      offset = { SAME_DAY: 0, NEXT_BUSINESS_DAY: 1, THREE_BUSINESS_DAYS: 3 }[timing]
      due_date = advance pay_date by offset BUSINESS days (skip Sat/Sun; no holiday calendar)
      LATE determination at confirm: current logical date > due_date → LATE_CONFIRMED.
      Evaluation order is pinned: compute due_date from pay_date stored on the run
      at creation time; employer.remittance_timing is read at remittance CREATION
      (a later employer config change does NOT retroactively move due_date).
    constants:
      SAME_DAY: 0
      NEXT_BUSINESS_DAY: 1
      THREE_BUSINESS_DAYS: 3
    precision: "date granularity"
    variants:
      - name: timing_same_day
        when: "employer.remittance_timing == SAME_DAY"
        difference: "due_date == pay_date regardless of weekday (no business-day skip for offset 0)"

  - name: answer_deadline
    trigger: "POST /orders/{id}/validate (answer_due_date fixed at receipt, computed at intake)"
    algorithm: chronological
    input_set: "order.received_at date"
    formula: |
      answer_due_date = received_date + ANSWER_SLA_DAYS business days (skip Sat/Sun).
      notification_due_at = received_at + NOTIFICATION_SLA_DAYS calendar days.
      An answer with answer_date <= answer_due_date is ON_TIME, else LATE (legal; flagged).
      A notify with sent_at > notification_due_at is LATE (legal; flagged in trace).
    constants:
      ANSWER_SLA_DAYS: 10
      NOTIFICATION_SLA_DAYS: 7
    precision: "date granularity for answer; datetime for notification"

  - name: audit_chain_integrity
    trigger: "every mutation that writes an AuditLogEntry; also on GET /audit-log"
    algorithm: projection
    input_set: "all AuditLogEntry rows for employer ordered by created_at ASC, then a monotonic sequence within same timestamp"
    formula: |
      entry_hash[i] = sha256(prev_hash[i] | payload_hash[i] | created_at[i])
      prev_hash[0] = 'GENESIS'; prev_hash[i] = entry_hash[i-1]
      Chain VALID iff for all i: recomputed entry_hash[i] == stored entry_hash[i]
      AND prev_hash[i] == entry_hash[i-1]. Entries are immutable: there is no
      update or delete endpoint; any tampering breaks the chain.
    precision: "sha256 hex lowercase"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for endpoint per §1.7; segregation-of-duties: the same X-User-ID that paid a run may not confirm that run's remittances"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all (SoD check on POST /remittances/{id}/confirm)"

  - priority: 3
    category: existence
    check: "Path ids exist and belong to the declared parent chain (employer scoping); unknown ids"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: state
    check: "Target resource in a legal from-state for the requested transition (includes terminal lockdown)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 5
    category: business_temporal
    check: "PayrollRun period window: period_end >= period_start; period_start strictly after latest non-voided run's period_end (half-open separation); statement hours_worked present iff TX; order effective_date not after run period_end for award eligibility"
    error_id: ERR_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /payroll-runs, POST /payroll-runs/{id}/statements"

  - priority: 6
    category: business_referential
    check: "Order intake: issuing_authority exists; case_number matches authority.accepted_case_number_pattern; work_state_code exists in StateRule; authority_type compatible with order_type"
    error_id: "ERR_CASE_NUMBER_PATTERN (mismatch) | ERR_STATE_RULE_MISSING | ERR_AUTHORITY_MISMATCH"
    http_status: 422
    applies_to: "POST /employees/{id}/orders (pattern/state checked at intake), POST /orders/{id}/validate (compatibility re-checked)"

  - priority: 7
    category: business_safety
    check: "Duplicate active order: same employee, same (order_type, case_number), other order non-terminal"
    error_id: ERR_DUPLICATE_ACTIVE_ORDER
    http_status: 409
    applies_to: "POST /employees/{id}/orders, POST /orders/{id}/validate, POST /orders/{id}/terminate"

  - priority: 8
    category: business_fiscal
    check: "OCC: expected_*_version equals parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /employees/{id}/orders (Employee), POST /payroll-runs + /pay (Employer)"

  - priority: 9
    category: business_fiscal
    check: "Run not empty at pay; statement mandatory_deductions_cents < gross_earnings_cents; amounts > 0"
    error_id: "ERR_RUN_EMPTY | ERR_INVALID_DEDUCTIONS"
    http_status: 422
    applies_to: "POST /payroll-runs/{id}/pay, POST /payroll-runs/{id}/statements"

  - priority: 10
    category: business_safety
    check: "Employee terminated: no new orders, no new statements, no activation for terminated employees"
    error_id: ERR_EMPLOYEE_TERMINATED_INELIGIBLE
    http_status: 409
    applies_to: "POST /employees/{id}/orders, /orders/{id}/activate, POST /payroll-runs/{id}/statements"

  - priority: 11
    category: business_fiscal
    check: "Refund: refund_amount_cents > 0 and <= order's net withheld (withheld_cents - refunded_cents); reason required; order must have withheld_cents > 0"
    error_id: ERR_REFUND_EXCEEDS_WITHHELD
    http_status: 422
    applies_to: "POST /orders/{id}/refund"

  - priority: 12
    category: state
    check: "Run void: no posted WITHHOLD events in run"
    error_id: ERR_RUN_HAS_POSTED_EVENTS
    http_status: 409
    applies_to: "POST /payroll-runs/{id}/void"

  - priority: 13
    category: business_fiscal
    check: "Remittance confirm: amount_due_cents > 0 (i.e., not all member events refunded)"
    error_id: ERR_REMITTANCE_EMPTY
    http_status: 409
    applies_to: "POST /remittances/{id}/confirm"

  - priority: 14
    category: business_referential
    check: "Create-remittance: at least one unassigned WITHHOLD event exists for (authority, run) from ACTIVE/ANSWER_FILED orders; duplicate remittance for same (authority_id, payroll_run_id) rejected"
    error_id: "ERR_NO_REMITTABLE_EVENTS | ERR_DUPLICATE_REMITTANCE"
    http_status: 409
    applies_to: "POST /remittances"

