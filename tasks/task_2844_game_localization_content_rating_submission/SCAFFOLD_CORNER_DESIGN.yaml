            - "MarketPlan.${mp_jp}.voice_recorded_line_count == 100 and Title.${title_id}.release_gate_state == BLOCKED"

      - name: title_enters_cert_window_only_after_every_plan_reaches_lqa
        claim_type: bubble_up
        grounds:
          - state_machines.Title[STRINGS_LOCKED -> CERT_WINDOW]
          - state_machines.MarketPlan[IN_LOCALIZATION -> LQA].side_effects
        distinguishing_aspect: "The bubble-up is all-or-nothing over the sibling set: with two plans, the first enter-lqa must leave the Title at STRINGS_LOCKED, and only the second one flips it to CERT_WINDOW. A per-child implementation would promote the Title too early."
