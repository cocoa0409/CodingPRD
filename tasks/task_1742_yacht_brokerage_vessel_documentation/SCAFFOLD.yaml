    roles: [PlatformAdmin, ListingAgent, SellingAgent, ClosingOfficer, EscrowOfficer]
    code: 200
    input: []
    output: ClosingStatement
    side_effects: []
  - method: GET
    path: "/yacht/closing-statements"
    description: "List closing statements, filterable by offer"
    roles: [PlatformAdmin, ListingAgent, SellingAgent, ClosingOfficer, EscrowOfficer]
