      assert:
      - ${at_ct0} == ${at_vc0} == true and ${at_p0} == READY at creation
      - the undeclared component gives HTTP 422 ${at1_id} == ERR_INVALID_ENUM_VALUE; the undeclared result gives the same ${at2_id} == ERR_INVALID_ENUM_VALUE
      - ${at_ct1} == true and ${at_p1} == READY, and ${at_last1} == ${at_u0} — the two rejected attestations wrote nothing at all, not even a touch of updated_at
      - 'the valid FAIL applies: ${at_ct2} == false, ${at_p2} == DEGRADED (exactly one flag true) and ${at_ems2} == DIVERT_ADVISORY'
      - 'the REPEATED FAIL is accepted and idempotent in effect: ${at_ct3} == false and ${at_p3} == DEGRADED are unchanged, while ${at_last3} and ${at_v3} still advance because the attestation was appended'
      - failing the second component drives ${at_p4} == OFFLINE and ${at_ems4} == BYPASS
