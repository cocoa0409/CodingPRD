  - section: errors
    instances:
      - name: stale_expected_version_returns_precondition_failed
        claim_type: error_triggerable
        grounds:
          - errors[ERR_STALE_VERSION]
          - validations[priority=40]
          - concurrency_rules[propose-stale-agreement]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / stale_agreement_version_outranks_exhausted_negotiation_round_budget
          rationale: "That §1.8 instance replays a captured pre-write agreement version into POST /perks/agreements/{id}/propose and asserts ERR_STALE_VERSION with HTTP 412, so the code is already triggered from its declared write endpoint."

      - name: exhausted_negotiation_round_budget_returns_conflict
        claim_type: error_triggerable
        grounds:
          - errors[ERR_NEGOTIATION_ROUND_LIMIT]
          - validations[priority=80]
          - state_machines.PartnerAgreement.status.MERCHANT_COUNTERED_to_PROVIDER_PROPOSED
        excluded_because:
          difficulty_instance: non_linear_state_machine / agreement_negotiation_cycle_revisits_provider_proposed_and_stops_at_round_cap
          rationale: "That §1.8 instance walks the propose/counter cycle until negotiation_round_count reaches the cap and asserts ERR_NEGOTIATION_ROUND_LIMIT on the next propose, which is the only reachable trigger for this code."

      - name: verification_after_the_token_window_returns_unprocessable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_VERIFICATION_EXPIRED]
          - validations[priority=72]
          - entities.Redemption.fields.verification_expires_at
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / expired_verification_window_outranks_unmet_minimum_spend
          rationale: "That §1.8 instance advances the clock past verification_expires_at and verifies with a below-minimum gross, asserting ERR_VERIFICATION_EXPIRED wins, so the code is triggered there under a stricter ordering claim."

      - name: audit_score_at_the_block_threshold_returns_unprocessable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_FRAUD_RISK_BLOCKED]
          - validations[priority=92]
          - calculations.fraud_risk_score
        excluded_because:
          difficulty_instance: boundary_precision_check / audit_risk_score_blocks_at_exactly_seventy_and_passes_at_sixty_nine
          rationale: "That §1.8 instance builds an audit score of exactly 70 and asserts ERR_FRAUD_RISK_BLOCKED with verification_status FAILED, then repeats one cent lower for the passing side, covering the code at its exact boundary."

      - name: restricted_program_posture_returns_conflict
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PROGRAM_RESTRICTED]
          - validations[priority=66]
          - calculations.employer_program_posture
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / restricted_posture_from_stale_feed_blocks_new_redemption_while_pending_one_still_verifies
          rationale: "That §1.8 instance lets the eligibility feed go STALE so the posture projects to RESTRICTED and asserts ERR_PROGRAM_RESTRICTED on new redemption creation while the already-pending row still verifies."

      - name: suspended_merchant_returns_conflict
        claim_type: error_triggerable
        grounds:
          - errors[ERR_MERCHANT_SUSPENDED]
          - validations[priority=62]
          - calculations.merchant_fulfillment_failure_score
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / merchant_fault_score_suspension_pauses_offer_and_blocks_resume
          rationale: "That §1.8 instance drives the fault score to the suspension floor and asserts ERR_MERCHANT_SUSPENDED on the follow-up merchant-scoped write, which is the code's declared raiser."

      - name: third_overlapping_featured_run_returns_conflict
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SLOT_CAPACITY_CONFLICT]
          - validations[priority=83]
          - entities.PlacementSlot.fields.placement_tier
        excluded_because:
          difficulty_instance: resource_temporal_overlap / closed_interval_featured_slot_capacity_outranks_merchant_cooldown_separation
          rationale: "That §1.8 instance stacks two FEATURED runs in one (employer_id, category) and asserts ERR_SLOT_CAPACITY_CONFLICT on the third, including the touching-interval case that a half-open reading would admit."

      - name: featured_run_inside_the_merchant_cooldown_returns_conflict
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SLOT_COOLDOWN_CONFLICT]
          - validations[priority=84]
          - entities.PlacementSlot.fields.slot_window_start
        excluded_because:
          difficulty_instance: resource_temporal_overlap / closed_interval_featured_slot_capacity_outranks_merchant_cooldown_separation
          rationale: "The same §1.8 instance also asserts the cooldown branch in isolation, showing ERR_SLOT_COOLDOWN_CONFLICT for a gap of fewer than 7 days once the capacity rule is satisfied."

      - name: overlapping_exclusivity_windows_return_conflict
        claim_type: error_triggerable
        grounds:
          - errors[ERR_EXCLUSIVITY_OVERLAP]
          - validations[priority=76]
          - entities.PartnerAgreement.fields.exclusivity_window_start
        excluded_because:
          difficulty_instance: resource_temporal_overlap / half_open_exclusivity_windows_collide_on_overlap_but_admit_a_touching_successor
          rationale: "That §1.8 instance asserts ERR_EXCLUSIVITY_OVERLAP for a genuinely overlapping exclusive lane and then admits the successor whose window starts exactly where the incumbent's ends."

      - name: redemption_beyond_the_inventory_limit_returns_conflict
        claim_type: error_triggerable
        grounds:
          - errors[ERR_OFFER_SOLD_OUT]
          - validations[priority=81]
          - entities.Offer.fields.inventory_limit
        excluded_because:
          difficulty_instance: compensating_invariant / voided_and_verified_units_keep_offer_inventory_conserved_at_three
          rationale: "That §1.8 instance exhausts a three-unit offer, asserts ERR_OFFER_SOLD_OUT on the fourth creation and then shows a void freeing a unit so the same call succeeds, covering both sides of the code."

  - section: rbac
    instances:
      - name: a_request_missing_x_user_id_header_returns_unauthenticated
        claim_type: identity_required
        grounds:
          - validations[priority=10]
          - errors[ERR_IDENTITY_REQUIRED]
          - roles[PartnerManager].identity_notes
        distinguishing_aspect: |
          Identity is checked at priority 10, ahead of every role and payload rule, so a merchant
          creation with no X-User-ID header returns ERR_IDENTITY_REQUIRED with HTTP 401 even though
          the payload is complete, and a plain collection GET without the header fails the same way.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "POST /perks/merchants"
              payload: { legal_name: "Bistro Uno", contact_email: "ops@bistrouno.example", primary_category: "DINING", region_codes: ["CA"] }
              as: PartnerManager
              as_user_id: ""
              captures: { e_write: $.data.error_id }
            - call: "GET /perks/merchants"
              payload: { limit: 10, offset: 0 }
              as: PartnerManager
              as_user_id: ""
              captures: { e_read: $.data.error_id }
            - call: "POST /perks/merchants"
              payload: { legal_name: "Bistro Uno", contact_email: "ops@bistrouno.example", primary_category: "DINING", region_codes: ["CA"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { created_id: $.data.id, created_status: $.data.status }
          assert:
            - "${e_write} == ERR_IDENTITY_REQUIRED with HTTP 401"
            - "${e_read} == ERR_IDENTITY_REQUIRED with HTTP 401: reads are gated too"
            - "${created_id} is a UUID and ${created_status} == PROSPECT once the header is supplied: nothing else about the request changed"

      - name: role_exclusive_writes_are_refused_to_every_other_role_unauthorized
        claim_type: exclusive_operation_enforcement
        grounds:
          - validations[priority=12]
          - errors[ERR_UNAUTHORIZED]
          - roles[Employee].cannot
          - roles[EmployerAdmin].cannot
          - roles[PartnerManager].cannot
          - endpoints[POST /perks/redemptions/{id}/verify]
          - endpoints[POST /perks/employers/{id}/storefront/suspend]
        distinguishing_aspect: |
          Verification belongs to Merchant and storefront suspension to PlatformAdmin, so the
          employee verifying its own redemption, the employer suspending its own storefront and the
          partner manager reading an individual redemption all return ERR_UNAUTHORIZED, while the
          same two writes succeed the moment the correct role issues them.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; merchant Bistro Uno ACTIVE with an ACTIVE DINING/CA agreement."
            - "Employer Northwind Co LIVE with one ELIGIBLE membership E-001; one ACTIVE offer at PERCENT 2000 bps, min_spend_cents 1000."
            - "One PENDING redemption of intended gross 5000 for E-001, with its verification token captured."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/merchants"
              payload: { legal_name: "Bistro Uno", contact_email: "ops@bistrouno.example", primary_category: "DINING", region_codes: ["CA"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { merchant_id: $.data.id }
            - call: "POST /perks/agreements"
              payload: { merchant_id: "${merchant_id}", category: "DINING", region_code: "CA" }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { agreement_id: $.data.id, agreement_v0: $.data.version }
            - call: "POST /perks/agreements/${agreement_id}/propose"
              payload: { expected_agreement_version: "${agreement_v0}", commission_rate_bps: 1200, placement_fee_base_cents: 36000, employer_revenue_share_bps: 2500 }
              as: PartnerManager
              as_user_id: "pm-001"
            - call: "POST /perks/agreements/${agreement_id}/decide"
              payload: { decision: "ACCEPT" }
              as: Merchant
              as_user_id: "${merchant_id}"
            - call: "POST /perks/agreements/${agreement_id}/activate"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-001"
            - call: "POST /perks/employers"
              payload: { name: "Northwind Co", region_code: "CA", employee_count_declared: 1, revenue_share_enabled: true, privacy_min_cohort_size: 3 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { employer_id: $.data.id }
            - call: "POST /perks/employers/${employer_id}/storefront"
              payload: { brand_color_hex: "#1155CC", logo_url: "https://cdn.example/nw.png", hero_headline: "Your Northwind perks", featured_categories: ["DINING"] }
              as: EmployerAdmin
              as_user_id: "${employer_id}"
              captures: { employer_v1: $.data.version }
            - call: "POST /perks/employers/${employer_id}/eligibility-files"
              payload: { expected_employer_version: "${employer_v1}", effective_from: "2026-08-01T00:00:00Z", checksum: "sha-rbac-1", records: [{ external_employee_ref: "E-001", employment_status: "ACTIVE", region_code: "CA", eligibility_valid_from: "2026-07-01T00:00:00Z", eligibility_valid_until: "2027-07-01T00:00:00Z" }] }
              as: EmployerAdmin
              as_user_id: "${employer_id}"
              captures: { file_id: $.data.id }
            - call: "POST /perks/eligibility-files/${file_id}/validate"
              payload: {}
              as: EmployerAdmin
              as_user_id: "${employer_id}"
            - call: "POST /perks/eligibility-files/${file_id}/apply"
              payload: {}
              as: EmployerAdmin
              as_user_id: "${employer_id}"
            - call: "POST /perks/employers/${employer_id}/storefront/publish"
              payload: {}
              as: EmployerAdmin
              as_user_id: "${employer_id}"
            - call: "GET /perks/memberships"
              payload: { employer_id: "${employer_id}" }
              as: EmployerAdmin
              as_user_id: "${employer_id}"
              captures: { member_1: "$.data[0].id" }
            - call: "POST /perks/offers"
              payload: { agreement_id: "${agreement_id}", title: "20 percent off dinner", discount_type: "PERCENT", discount_value_bps: 2000, min_spend_cents: 1000, region_codes: ["CA"], window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-01T00:00:00Z" }
              as: Merchant
              as_user_id: "${merchant_id}"
              captures: { offer_id: $.data.id }
            - call: "POST /perks/offers/${offer_id}/submit"
              payload: {}
              as: Merchant
              as_user_id: "${merchant_id}"
            - call: "POST /perks/offers/${offer_id}/review"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/redemptions"
              payload: { offer_id: "${offer_id}", membership_id: "${member_1}", intended_gross_amount_cents: 5000 }
              as: Employee
              as_user_id: "${member_1}"
              captures: { redemption_id: $.data.id, token_1: $.data.verification_token }
          trigger:
            - call: "POST /perks/redemptions/${redemption_id}/verify"
              payload: { verification_token: "${token_1}", gross_amount_cents: 5000 }
              as: Employee
              as_user_id: "${member_1}"
              captures: { e_employee_verify: $.data.error_id }
            - call: "GET /perks/redemptions/${redemption_id}"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { e_pm_read: $.data.error_id }
            - call: "POST /perks/redemptions/${redemption_id}/verify"
              payload: { verification_token: "${token_1}", gross_amount_cents: 5000 }
              as: Merchant
              as_user_id: "${merchant_id}"
              captures: { verified_status: $.data.verification_status, verified_commission: $.data.commission_amount_cents }
            - call: "POST /perks/redemptions/${redemption_id}/fulfill"
              payload: {}
              as: Employee
              as_user_id: "${member_1}"
              captures: { e_employee_fulfill: $.data.error_id }
            - call: "POST /perks/employers/${employer_id}/storefront/suspend"
              payload: { suspension_reason: "PROGRAM_PAUSE" }
              as: EmployerAdmin
              as_user_id: "${employer_id}"
              captures: { e_employer_suspend: $.data.error_id }
            - call: "POST /perks/employers/${employer_id}/storefront/suspend"
              payload: { suspension_reason: "PROGRAM_PAUSE" }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { storefront_after: $.data.storefront_status, posture_after: $.data.program_posture }
          assert:
            - "${e_employee_verify} == ERR_UNAUTHORIZED with HTTP 403: only the merchant may verify, even for the employee's own redemption"
            - "${e_pm_read} == ERR_UNAUTHORIZED with HTTP 403: the partner manager is barred from individual redemption reads"
            - "${verified_status} == VERIFIED and ${verified_commission} == 480 for the merchant-issued call"
            - "${e_employee_fulfill} == ERR_UNAUTHORIZED with HTTP 403"
            - "${e_employer_suspend} == ERR_UNAUTHORIZED with HTTP 403: an employer cannot freeze its own program"
            - "${storefront_after} == SUSPENDED and ${posture_after} == FROZEN for the platform-issued call"

      - name: slot_confirmation_belongs_to_the_partner_manager_while_release_is_shared_unauthorized
        claim_type: peer_roles
        grounds:
          - complexity_profile.role_model
          - roles[Merchant].cannot
          - endpoints[POST /perks/placement-slots/{id}/confirm]
          - endpoints[POST /perks/placement-slots/{id}/release]
          - state_machines.PlacementSlot.status.RESERVED_to_CONFIRMED
          - state_machines.PlacementSlot.status.CONFIRMED_to_RELEASED
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          Reservation and confirmation are split across the two peer roles, so the merchant that
          reserved the slot gets ERR_UNAUTHORIZED when it tries to confirm it while the partner
          manager succeeds; release, by contrast, works from either peer, and only the release of a
          CONFIRMED slot refunds the 72000-cent placement fee.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; merchant Bistro Uno ACTIVE with an ACTIVE DINING/CA agreement whose placement_fee_base_cents is 36000."
            - "Employer Northwind Co LIVE with two ELIGIBLE in-window memberships, so eligible_headcount is 2 and a 2-day slot prices at 72000."
            - "One ACTIVE offer for that agreement."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/merchants"
              payload: { legal_name: "Bistro Uno", contact_email: "ops@bistrouno.example", primary_category: "DINING", region_codes: ["CA"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { merchant_id: $.data.id }
            - call: "POST /perks/agreements"
              payload: { merchant_id: "${merchant_id}", category: "DINING", region_code: "CA" }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { agreement_id: $.data.id, agreement_v0: $.data.version }
            - call: "POST /perks/agreements/${agreement_id}/propose"
              payload: { expected_agreement_version: "${agreement_v0}", commission_rate_bps: 1200, placement_fee_base_cents: 36000, employer_revenue_share_bps: 2500 }
              as: PartnerManager
              as_user_id: "pm-001"
            - call: "POST /perks/agreements/${agreement_id}/decide"
              payload: { decision: "ACCEPT" }
              as: Merchant
              as_user_id: "${merchant_id}"
            - call: "POST /perks/agreements/${agreement_id}/activate"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-001"
            - call: "POST /perks/employers"
              payload: { name: "Northwind Co", region_code: "CA", employee_count_declared: 2, revenue_share_enabled: true, privacy_min_cohort_size: 3 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { employer_id: $.data.id }
            - call: "POST /perks/employers/${employer_id}/storefront"
              payload: { brand_color_hex: "#1155CC", logo_url: "https://cdn.example/nw.png", hero_headline: "Your Northwind perks", featured_categories: ["DINING"] }
              as: EmployerAdmin
              as_user_id: "${employer_id}"
              captures: { employer_v1: $.data.version }
            - call: "POST /perks/employers/${employer_id}/eligibility-files"
              payload: { expected_employer_version: "${employer_v1}", effective_from: "2026-08-01T00:00:00Z", checksum: "sha-peer-1", records: [{ external_employee_ref: "E-001", employment_status: "ACTIVE", region_code: "CA", eligibility_valid_from: "2026-07-01T00:00:00Z", eligibility_valid_until: "2027-07-01T00:00:00Z" }, { external_employee_ref: "E-002", employment_status: "ACTIVE", region_code: "CA", eligibility_valid_from: "2026-07-01T00:00:00Z", eligibility_valid_until: "2027-07-01T00:00:00Z" }] }
              as: EmployerAdmin
              as_user_id: "${employer_id}"
              captures: { file_id: $.data.id }
            - call: "POST /perks/eligibility-files/${file_id}/validate"
              payload: {}
              as: EmployerAdmin
              as_user_id: "${employer_id}"
            - call: "POST /perks/eligibility-files/${file_id}/apply"
              payload: {}
              as: EmployerAdmin
              as_user_id: "${employer_id}"
            - call: "POST /perks/employers/${employer_id}/storefront/publish"
              payload: {}
              as: EmployerAdmin
              as_user_id: "${employer_id}"
            - call: "POST /perks/offers"
              payload: { agreement_id: "${agreement_id}", title: "20 percent off dinner", discount_type: "PERCENT", discount_value_bps: 2000, min_spend_cents: 1000, region_codes: ["CA"], window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-01T00:00:00Z" }
              as: Merchant
              as_user_id: "${merchant_id}"
              captures: { offer_id: $.data.id }
            - call: "POST /perks/offers/${offer_id}/submit"
              payload: {}
              as: Merchant
              as_user_id: "${merchant_id}"
            - call: "POST /perks/offers/${offer_id}/review"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { offer_v1: $.data.version }
          trigger:
            - call: "POST /perks/offers/${offer_id}/placement-slots"
              payload: { expected_offer_version: "${offer_v1}", employer_id: "${employer_id}", placement_tier: "STANDARD", slot_window_start: "2026-09-01T00:00:00Z", slot_window_end: "2026-09-03T00:00:00Z" }
              as: Merchant
              as_user_id: "${merchant_id}"
              captures: { slot_1: $.data.id, slot_1_fee: $.data.placement_fee_cents, slot_1_status: $.data.status }
            - call: "POST /perks/placement-slots/${slot_1}/confirm"
              payload: {}
              as: Merchant
              as_user_id: "${merchant_id}"
              captures: { e_self_confirm: $.data.error_id }
            - call: "POST /perks/placement-slots/${slot_1}/confirm"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { slot_1_confirmed: $.data.status, slot_1_confirmed_at: $.data.confirmed_at }
            - call: "GET /perks/merchants/${merchant_id}"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { payable_confirmed: $.data.accrued_commission_payable_cents }
            - call: "POST /perks/placement-slots/${slot_1}/release"
              payload: { release_reason: "EMPLOYER_REQUEST" }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { slot_1_released: $.data.status, slot_1_release_reason: $.data.release_reason }
            - call: "GET /perks/merchants/${merchant_id}"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { payable_after_release: $.data.accrued_commission_payable_cents }
            - call: "GET /perks/offers/${offer_id}"
              payload: {}
              as: Merchant
              as_user_id: "${merchant_id}"
              captures: { offer_v2: $.data.version }
            - call: "POST /perks/offers/${offer_id}/placement-slots"
              payload: { expected_offer_version: "${offer_v2}", employer_id: "${employer_id}", placement_tier: "STANDARD", slot_window_start: "2026-09-10T00:00:00Z", slot_window_end: "2026-09-12T00:00:00Z" }
              as: Merchant
              as_user_id: "${merchant_id}"
              captures: { slot_2: $.data.id, slot_2_status: $.data.status }
            - call: "POST /perks/placement-slots/${slot_2}/release"
              payload: { release_reason: "MERCHANT_WITHDRAWN" }
              as: Merchant
              as_user_id: "${merchant_id}"
              captures: { slot_2_released: $.data.status, slot_2_release_reason: $.data.release_reason }
            - call: "GET /perks/merchants/${merchant_id}"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { payable_final: $.data.accrued_commission_payable_cents }
            - call: "GET /perks/ledger-entries"
              payload: { placement_slot_id: "${slot_2}", limit: 10, offset: 0 }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { slot_2_ledger_probe: $.data }
          assert:
            - "${slot_1_fee} == 72000 and ${slot_1_status} == RESERVED"
            - "${e_self_confirm} == ERR_UNAUTHORIZED with HTTP 403: the reserving merchant cannot confirm its own slot"
            - "${slot_1_confirmed} == CONFIRMED and ${slot_1_confirmed_at} == 2026-08-01T00:00:00Z when the partner manager issues the identical call"
            - "${payable_confirmed} == 72000: confirmation wrote the PLACEMENT_FEE row"
            - "${slot_1_released} == RELEASED and ${slot_1_release_reason} == EMPLOYER_REQUEST"
            - "${payable_after_release} == 0: releasing a CONFIRMED slot wrote the PLACEMENT_FEE_REFUND of -72000"
            - "${slot_2_status} == RESERVED and ${slot_2_released} == RELEASED with ${slot_2_release_reason} == MERCHANT_WITHDRAWN: the merchant peer may release"
            - "${payable_final} == 0 and ${slot_2_ledger_probe} is an empty array with meta.total_count == 0: releasing a merely RESERVED slot writes no ledger row"

      - name: an_actor_cannot_reach_a_peer_tenants_rows_scope_violation
        claim_type: scope_isolation
        grounds:
          - validations[priority=14]
          - errors[ERR_SCOPE_VIOLATION]
          - roles[Merchant].cannot
          - roles[Employee].cannot
          - roles[EmployerAdmin].cannot
          - roles[Merchant].identity_notes
        distinguishing_aspect: |
          Scope is matched on the acting entity id at priority 14, so the second merchant verifying
          or pausing the first merchant's row, the second employee reading the first employee's
          redemption and the second employer listing the first employer's memberships all return
          ERR_SCOPE_VIOLATION, while the correctly scoped actor performs the same calls.
