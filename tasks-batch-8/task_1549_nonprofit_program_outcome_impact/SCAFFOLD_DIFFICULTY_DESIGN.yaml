            - "cycle.total_observation_count == 0, validated_observation_count == 0, active_participant_count == 0, data_completeness_pct == null"

      - name: instrument_publish_depth2
        grounds:
          - state_machines.Instrument.DRAFT_to_PUBLISHED
          - state_machines.Instrument.PUBLISHED_to_RETIRED
          - state_machines.TrainingCertification.CERTIFIED_to_STALE
        distinguishing_aspect: |
          Depth-2 chain from POST /instruments/{v2}/publish: the new revision
          publishing retires the PUBLISHED predecessor (hop 1), and that
          retirement transitions the predecessor's CERTIFIED training
          certifications to STALE (hop 2) — each hop caused by the previous
          one, not by the original request.
