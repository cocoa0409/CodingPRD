            - call: "POST /health-office/health-visits/${visit1_id}/dispose"
              payload: { disposition: "RETURN_TO_CLASS" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
            - call: "POST /health-office/health-visits"
              payload: { student_id: "${stu3_id}", school_id: "${sch_id}", nurse_id: "${rn_id}", complaint_code: "ILLNESS", acuity: "ROUTINE" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { visit3_id: $.data.id }
          assert:
            - "Two concurrent occupancies are legal: School.${sch_id}.occupied_cot_count == 2 before the trigger"
            - "School.${sch_id}.delivered_students_per_nurse_fte == 13.13 and School.${sch_id}.coverage_posture == LIMITED"
            - "Third arrival at capacity: HTTP status == 409 and data.error_id == ERR_OFFICE_CAPACITY_EXCEEDED"
            - "Third arrival at capacity: School.${sch_id}.occupied_cot_count == 2 (no cot consumed by the rejected request)"
            - "After disposing visit 1: School.${sch_id}.occupied_cot_count == 1"
            - "Retry after a cot frees: HTTP status == 201 and HealthVisit.${visit3_id}.status == OPEN"
            - "Retry after a cot frees: School.${sch_id}.occupied_cot_count == 2"

  - rule_id: compensating_invariant
    instances:

      - name: lot_unit_conservation_prepare_administer_then_void
        grounds:
          - calculations.lot_unit_conservation
          - state_machines.AdministrationRecord.PREPARED_to_ADMINISTERED
          - state_machines.AdministrationRecord.ADMINISTERED_to_VOIDED
          - entities.MedicationStockLot.fields.received_total
          - entities.MedicationStockLot.fields.quantity_on_hand
          - entities.MedicationStockLot.fields.quantity_reserved
          - entities.MedicationStockLot.fields.quantity_administered
          - entities.MedicationStockLot.fields.quantity_wasted
        distinguishing_aspect: |
          Conserved quantity = PHYSICAL MEDICATION UNITS, pinned as
          MedicationStockLot.received_total == quantity_on_hand +
          quantity_reserved + quantity_administered + quantity_wasted. The forward
          pair PREPARE(2) then ADMINISTER(2) and the compensating VOID from
          ADMINISTERED must return the lot to on_hand 4 / reserved 0 /
          administered 0 / wasted 0 with received_total still 4 — zero drift, not
          approximate return.
        test_recipe:
          setup:
            - "School OWE16 with one RN on an ACTIVE Monday block and one ENROLLED student."
            - "One AVAILABLE student-specific ALBUTEROL lot (is_stock_protocol false) with initial_quantity 4, so received_total is 4 and days_of_supply is 3.33."
            - "One SCHEDULED ALBUTEROL MedicationAuthorization at (CONSENT_GRANTED, VERIFIED) with max_doses_per_day 2 and validity 2026-07-01 .. 2027-06-30."
            - "Clock at 2026-08-03T09:00:00Z; the encounter has been assessed, one record of 2 units has been PREPARED and then moved to ADMINISTERED, leaving on_hand 2 / reserved 0 / administered 2 / wasted 0."
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Owens Elementary", building_code: "OWE16", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /health-office/nurses"
              payload: { full_name: "Rita Nolan", credential: "RN", weekly_contracted_minutes: 2400, delegation_authorized: false }
              as: DistrictHealthAdmin
              captures: { rn_id: $.data.id }
            - call: "POST /health-office/coverage-assignments"
              payload: { nurse_id: "${rn_id}", school_id: "${sch_id}", weekday: "MON", start_minute: 480, end_minute: 960, effective_from: "2026-07-01T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { cov_id: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Sana Weber", grade_level: 7, date_of_birth: "2013-09-17T00:00:00Z", allergy_severity: "NONE", chronic_condition_codes: [], immunization_status: "COMPLIANT" }
              as: DistrictHealthAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /health-office/medication-stock-lots"
              payload: { school_id: "${sch_id}", medication_code: "ALBUTEROL", lot_number: "ALB-OWE-1", is_stock_protocol: false, initial_quantity: 4, expiration_date: "2027-06-30T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { lot_id: $.data.id, received_at_create: $.data.received_total }
            - call: "POST /health-office/medication-authorizations"
              payload: { student_id: "${stu_id}", medication_code: "ALBUTEROL", route: "INHALED", dose_amount: 2, dose_unit: "PUFF", schedule_type: "SCHEDULED", max_doses_per_day: 2, valid_from: "2026-07-01T00:00:00Z", valid_until: "2027-06-30T00:00:00Z" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { auth_id: $.data.id }
            - call: "POST /health-office/medication-authorizations/${auth_id}/consent"
              payload: { decision: "GRANT" }
              as: Guardian
              as_user_id: "${stu_id}"
            - call: "POST /health-office/medication-authorizations/${auth_id}/clinical-review"
              payload: { decision: "VERIFY" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
            - call: "POST /health-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: DistrictHealthAdmin
            - call: "POST /health-office/health-visits"
              payload: { student_id: "${stu_id}", school_id: "${sch_id}", nurse_id: "${rn_id}", complaint_code: "MEDICATION", acuity: "ROUTINE" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /health-office/health-visits/${visit_id}/assess"
              payload: { assessment_note: "Scheduled inhaler dose" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
            - call: "GET /health-office/medication-authorizations/${auth_id}"
              payload: {}
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { auth_v: $.data.version }
            - call: "POST /health-office/administration-records"
              payload: { visit_id: "${visit_id}", authorization_id: "${auth_id}", units: 2, expected_authorization_version: "${auth_v}" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { adm_id: $.data.id }
            - call: "POST /health-office/administration-records/${adm_id}/outcome"
              payload: { outcome: "ADMINISTERED" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { adm_status: $.data.status }
          trigger:
            - call: "POST /health-office/administration-records/${adm_id}/void"
              payload: { reason_code: "Charted against the wrong encounter" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { void_status: $.data.status, voided_when: $.data.voided_at }
          assert:
            - "Before the void: MedicationStockLot.${lot_id}.quantity_on_hand == 2 and quantity_administered == 2 and 4 == 2 + 0 + 2 + 0"
            - "AdministrationRecord.${adm_id}.status == VOIDED"
            - "AdministrationRecord.${adm_id}.voided_at == 2026-08-03T09:00:00.000Z"
            - "MedicationStockLot.${lot_id}.received_total == 4"
            - "MedicationStockLot.${lot_id}.quantity_on_hand == 4"
            - "MedicationStockLot.${lot_id}.quantity_reserved == 0"
            - "MedicationStockLot.${lot_id}.quantity_administered == 0"
            - "MedicationStockLot.${lot_id}.quantity_wasted == 0"
            - "INVARIANT holds with zero drift: received_total (4) == quantity_on_hand (4) + quantity_reserved (0) + quantity_administered (0) + quantity_wasted (0)"
            - "MedicationStockLot.${lot_id}.days_of_supply == 3.33"
            - "MedicationStockLot.${lot_id}.status == AVAILABLE"
            - "MedicationAuthorization.${auth_id}.doses_administered_today == 0"
            - "MedicationAuthorization.${auth_id}.last_administered_at == null"
            - "Student.${stu_id}.observed_risk_score == 0 (an AUTHORIZED record never enters the OBSERVED encounter set)"

      - name: nurse_minute_conservation_create_then_end_block
        grounds:
          - calculations.nurse_minute_conservation
          - entities.Nurse.fields.weekly_contracted_minutes
          - entities.Nurse.fields.committed_weekly_minutes
          - entities.Nurse.fields.uncommitted_weekly_minutes
          - entities.Nurse.fields.assigned_school_count
          - entities.CoverageAssignment.fields.effective_to
          - calculations.school_nurse_coverage_ratio
        distinguishing_aspect: |
          Conserved quantity = CONTRACTED STAFFING MINUTES (a scheduling quantity,
          not physical units), pinned as Nurse.weekly_contracted_minutes ==
          committed_weekly_minutes + uncommitted_weekly_minutes. The forward action
          POST /health-office/coverage-assignments moves 420 minutes from
          uncommitted to committed and the compensating POST
          /health-office/coverage-assignments/{id}/end moves exactly those 420 back,
          leaving weekly_contracted_minutes untouched at 1000.
        test_recipe:
          setup:
            - "School PIE17 with no students and no stock lots."
            - "One RN with weekly_contracted_minutes 1000, so committed_weekly_minutes starts at 0 and uncommitted_weekly_minutes at 1000."
            - "One CoverageAssignment THU [480, 900) at that school, effective_from 2026-07-01, consuming 420 minutes."
            - "Logical clock left at its 2026-08-01T00:00:00Z default, so the block is ACTIVE before the trigger."
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Pierce Elementary", building_code: "PIE17", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /health-office/nurses"
              payload: { full_name: "Otto Vane", credential: "RN", weekly_contracted_minutes: 1000, delegation_authorized: false }
              as: DistrictHealthAdmin
              captures: { rn_id: $.data.id, contracted: $.data.weekly_contracted_minutes }
            - call: "POST /health-office/coverage-assignments"
              payload: { nurse_id: "${rn_id}", school_id: "${sch_id}", weekday: "THU", start_minute: 480, end_minute: 900, effective_from: "2026-07-01T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { cov_id: $.data.id, cov_dur: $.data.duration_minutes }
            - call: "GET /health-office/nurses/${rn_id}"
              payload: {}
              as: DistrictHealthAdmin
              captures: { committed_before: $.data.committed_weekly_minutes, uncommitted_before: $.data.uncommitted_weekly_minutes }
          trigger:
            - call: "POST /health-office/coverage-assignments/${cov_id}/end"
              payload: { effective_to: "2026-07-15T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { cov_status_after: $.data.status, cov_effective_to: $.data.effective_to }
          assert:
            - "Before the end: CoverageAssignment.${cov_id}.duration_minutes == 420 and CoverageAssignment.${cov_id}.status == ACTIVE"
            - "Before the end: Nurse.${rn_id}.committed_weekly_minutes == 420 and Nurse.${rn_id}.uncommitted_weekly_minutes == 580"
            - "Before the end: INVARIANT 1000 == 420 + 580"
            - "After the end: CoverageAssignment.${cov_id}.effective_to == 2026-07-15T00:00:00.000Z"
            - "After the end: CoverageAssignment.${cov_id}.status == ENDED"
            - "After the end: Nurse.${rn_id}.committed_weekly_minutes == 0"
            - "After the end: Nurse.${rn_id}.uncommitted_weekly_minutes == 1000"
            - "After the end: Nurse.${rn_id}.weekly_contracted_minutes == 1000 (unchanged, zero drift)"
            - "After the end: INVARIANT 1000 == 0 + 1000"
            - "After the end: Nurse.${rn_id}.assigned_school_count == 0"
            - "After the end: School.${sch_id}.contracted_weekly_minutes == 0 and School.${sch_id}.delivered_weekly_minutes == 0.0"
            - "After the end: School.${sch_id}.coverage_posture == UNCOVERED"
