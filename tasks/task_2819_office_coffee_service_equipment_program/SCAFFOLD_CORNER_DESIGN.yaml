      - name: corner_revise_and_respond_are_refused_outside_their_own_status_and_bounds
        claim_type: error_triggerable
        grounds:
          - validations[priority=41]
          - errors[ERR_ADJUSTMENT_STATE_INVALID]
          - errors[ERR_REVISION_OUT_OF_BOUNDS]
          - state_machines.PriceAdjustment.adj_status
        distinguishing_aspect: "The negotiation endpoints are status-scoped in opposite directions - revise only from DISPUTED, respond only from PROPOSED - and the revision bound is a closed interval [0, current adjustment_pct_bps], so 1300 and -100 are both refused against a current 1200 while 1200 itself is accepted. §1.8 covers the successful cycle; this instance pins the four refusals around it."
        test_recipe:
          setup:
            - "clock at 2026-08-03T08:00:00Z; MON route; one COFFEE product; model URN-30; one PLACEMENT asset placed at a planned site so the account is ACTIVE with escalated_site_count 0"
            - "green index moved from the account baseline 2000000 to 2400000 (movement 2000 bps), so one PROPOSED adjustment exists at adjustment_pct_bps == 1200 (2000 x 6000 / 10000, under the 1500 cap)"
          setup_api_calls:
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/routes"
              payload: { name: "Metro MON", service_day: "MON", capacity_minutes: 480, travel_buffer_minutes: 30 }
              as: ProgramAdmin
              captures: { route_id: "$.data.id" }
            - call: "POST /ocs/product-items"
              payload: { sku: "COF-HOUSE-12OZ", category: "COFFEE", base_unit_price_micros: 4500000, pack_units: 6, green_coffee_linked: true }
              as: ProgramAdmin
              captures: { p_cof_id: "$.data.id" }
            - call: "POST /ocs/equipment-models"
              payload: { model_code: "URN-30", brewer_class: "THERMAL", cups_per_hour_capacity: 30, min_headcount: 1, max_headcount: 250, monthly_rent_cents: 4500, descale_interval_days: 90, list_value_cents: 120000 }
              as: ProgramAdmin
              captures: { model_id: "$.data.id" }
            - call: "POST /ocs/equipment-assets"
              payload: { model_id: "${model_id}", serial_number: "URN30-0001", asset_role: "PLACEMENT" }
              as: ProgramAdmin
              captures: { asset_id: "$.data.id" }
            - call: "POST /ocs/accounts"
              payload: { legal_name: "Northgate Holdings LLC", billing_mode: "CONSOLIDATED", green_index_baseline_micros: 2000000, price_protection_days: 90 }
              as: AccountManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /ocs/sites"
              payload: { account_id: "${acct_id}", route_id: "${route_id}", site_name: "HQ Floor 3", headcount: 40, days_per_week: 5, consumption_model: "HEADCOUNT_MODEL", service_minutes_estimate: 45 }
              as: AccountManager
              captures: { site_id: "$.data.id" }
            - call: "POST /ocs/sites/${site_id}/size-and-plan"
              payload: { brew_style: "DRIP" }
              as: AccountManager
              captures: { site_v: "$.data.version" }
            - call: "POST /ocs/equipment-placements"
              payload: { site_id: "${site_id}", asset_id: "${asset_id}", terms_type: "RENTAL", minimum_purchase_cents: 60000, min_term_months: 12, expected_site_version: "${site_v}" }
              as: AccountManager
              captures: { plc_id: "$.data.id" }
            - call: "POST /ocs/_market/set_green_index"
              payload: { index_micros: 2400000 }
              as: BillingSpecialist
            - call: "POST /ocs/price-adjustments"
              payload: { account_id: "${acct_id}", effective_at: "2026-08-15T00:00:00Z" }
              as: BillingSpecialist
              captures: { adj_id: "$.data.id" }
          trigger:
            - call: "POST /ocs/price-adjustments/${adj_id}/revise"
              payload: { revised_adjustment_pct_bps: 600 }
              as: BillingSpecialist
              captures: { e_revise_proposed: "$.data.error_id" }
            - call: "POST /ocs/price-adjustments/${adj_id}/respond"
              payload: { disposition: "DISPUTE", dispute_reason: "Our blend is not index linked" }
              as: CustomerContact
              as_user_id: "${acct_id}"
            - call: "POST /ocs/price-adjustments/${adj_id}/revise"
              payload: { revised_adjustment_pct_bps: 1300 }
              as: BillingSpecialist
              captures: { e_above: "$.data.error_id" }
            - call: "POST /ocs/price-adjustments/${adj_id}/revise"
              payload: { revised_adjustment_pct_bps: -100 }
              as: BillingSpecialist
              captures: { e_below: "$.data.error_id" }
            - call: "POST /ocs/price-adjustments/${adj_id}/revise"
              payload: { revised_adjustment_pct_bps: 1200 }
              as: BillingSpecialist
            - call: "POST /ocs/price-adjustments/${adj_id}/respond"
              payload: { disposition: "ACCEPT" }
              as: CustomerContact
              as_user_id: "${acct_id}"
            - call: "POST /ocs/price-adjustments/${adj_id}/respond"
              payload: { disposition: "ACCEPT" }
              as: CustomerContact
              as_user_id: "${acct_id}"
              captures: { e_respond_terminal: "$.data.error_id" }
            - call: "POST /ocs/price-adjustments/${adj_id}/revise"
              payload: { revised_adjustment_pct_bps: 0 }
              as: BillingSpecialist
              captures: { e_revise_terminal: "$.data.error_id" }
          assert:
            - "the revise while still PROPOSED is HTTP 409 with data.error_id == ERR_ADJUSTMENT_STATE_INVALID, and adjustment_pct_bps is still 1200 with revision_count == 0"
            - "the DISPUTE response is 2xx (adj_status DISPUTED) and leaves Account.green_price_factor_bps at 10000"
            - "revising to 1300 is HTTP 422 with data.error_id == ERR_REVISION_OUT_OF_BOUNDS - a revision may only move toward zero, never away from it"
            - "revising to -100 is HTTP 422 with the same ERR_REVISION_OUT_OF_BOUNDS - the lower bound is 0, not the negative mirror, because the current value is positive"
            - "revising to exactly 1200 is 2xx: the closed interval includes its upper endpoint, adj_status returns to PROPOSED and revision_count == 1"
            - "the ACCEPT is 2xx: adj_status == ACCEPTED, Account.green_price_factor_bps == 11200, green_index_baseline_micros == 2400000 and price_protection_until == 2026-11-01T08:00:00Z"
            - "the second ACCEPT is HTTP 409 with data.error_id == ERR_ADJUSTMENT_STATE_INVALID (ACCEPTED is terminal)"
            - "the revise after acceptance is HTTP 409 with data.error_id == ERR_ADJUSTMENT_STATE_INVALID, and revision_count is still 1"

      - name: corner_a_deferred_adjustment_cannot_be_answered_until_the_account_recovers
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ADJUSTMENT_DEFERRED]
          - state_machines.PriceAdjustment.adj_status
          - state_machines.Account.program_posture
          - calculations.site_escalation_score
        distinguishing_aspect: "The refusal is not owned by the adjustment at all - it is produced four hops away by two sites going STOCKOUT, and it disappears again the moment one site recovers, so the same ACCEPT body is a 409 and then a 200 with nothing about the adjustment having been touched in between."
