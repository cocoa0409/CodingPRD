# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml  (SKILL.md §1.9)
#
# Breadth probe for task_2726 lifeline-prepaid-wireless-eligibility.
# Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md; no category is invented here.
#
# Every instance name is unique across the union of this file and
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Where §1.8 already asserts a corner the row
# is emitted as an `excluded_because:` stub naming the covering §1.8 instance.
#
# Shared conventions with §1.8:
#   * default logical clock 2026-08-01T00:00:00Z, moved only by
#     POST /lifeline/_clock/set_current_utc;
#   * ProviderAgent calls carry as_user_id equal to the acting Provider id;
#     Subscriber calls carry as_user_id equal to the acting Subscriber id;
#   * the eligible-subscriber ladder is
#     providers -> addresses -> subscribers -> eligibility-checks ->
#     verifier-result(MATCH) -> enrollments;
#   * every expected_*_version is sourced from a GET capture taken immediately
#     before the OCC write.
# =============================================================================

scaffold_corner_design:

  # =========================================================================
  # SECTION 1 - entities  (claim-extraction-guide Table 1)
  # =========================================================================
  - section: entities
    instances:

      - name: provider_creation_with_all_required_fields_returns_201_and_zeroed_ledger
        claim_type: creation
        grounds:
          - entities.Provider
          - endpoints[POST /lifeline/providers]
        distinguishing_aspect: |
          A carrier is created with every declared input field present and the response
          carries all seventeen Provider fields: the five inputs echoed, status defaulted,
          and all eleven computed counters at their zero/false start values with version 1.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /lifeline/providers"
              payload: { name: "SafeLink Wireless", spin_id: "143100", study_area_code: "489100", licensed_state_codes: ["TX", "NM"], enrollment_cap: 25, status: "ACTIVE" }
              as: ProgramAdministrator
              captures: { prov_id: $.data.id, prov_ver: $.data.version }
          assert:
            - "the trigger returns HTTP 201"
            - "Provider.${prov_id}.name == SafeLink Wireless"
            - "Provider.${prov_id}.spin_id == 143100"
            - "Provider.${prov_id}.study_area_code == 489100"
            - "Provider.${prov_id}.licensed_state_codes == [TX, NM]"
            - "Provider.${prov_id}.enrollment_cap == 25"
            - "Provider.${prov_id}.status == ACTIVE"
            - "Provider.${prov_id}.active_enrollment_count == 0"
            - "Provider.${prov_id}.devices_total_count == 0"
            - "Provider.${prov_id}.devices_in_stock_count == 0"
            - "Provider.${prov_id}.devices_issued_count == 0"
            - "Provider.${prov_id}.devices_reclaim_pending_count == 0"
            - "Provider.${prov_id}.devices_retired_count == 0"
            - "Provider.${prov_id}.open_claim_count == 0"
            - "Provider.${prov_id}.claim_gross_cents == 0"
            - "Provider.${prov_id}.recouped_cents == 0"
            - "Provider.${prov_id}.net_reimbursed_cents == 0"
            - "Provider.${prov_id}.audit_hold_flag == false"
            - "${prov_ver} == 1"

      - name: address_retrieval_returns_stored_row_with_computed_hash_and_slot_counters
        claim_type: retrieval
        grounds:
          - entities.HouseholdAddress
          - endpoints[GET /lifeline/addresses/{id}]
          - calculations.address_normalization_hash
        distinguishing_aspect: |
          GET /lifeline/addresses/{id} returns exactly what POST stored, including the
          computed address_hash and the three slot counters, and the sole row of its cohort
          stays UNVERIFIED with cohort_address_count 1.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, one address created and no sibling sharing its hash."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1200 N Main St", unit_designator: "Apt 4B", city: "El Paso", state_code: "TX", postal_code: "79901" }
              as: ProgramAdministrator
              captures: { addr_id: $.data.id }
          trigger:
            - call: "GET /lifeline/addresses/${addr_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { got_hash: $.data.address_hash, got_status: $.data.status, got_cohort: $.data.cohort_address_count, got_max: $.data.max_permitted_benefit_slots, got_occ: $.data.occupied_benefit_slots, got_unit: $.data.unit_designator }
          assert:
            - "the trigger returns HTTP 200"
            - "${got_hash} == 1200NMAINST|APT4B|ELPASO|TX|79901"
            - "${got_status} == UNVERIFIED"
            - "${got_cohort} == 1"
            - "${got_max} == 1"
            - "${got_occ} == 0"
            - "${got_unit} == Apt 4B"
            - "HouseholdAddress.${addr_id}.declared_household_count == null"
            - "HouseholdAddress.${addr_id}.independent_household_worksheet_ref == null"

      - name: subscriber_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /lifeline/subscribers]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          Three subscribers share one address; limit 2 offset 0 returns two rows with
          total_count 3 and has_more true, and limit 2 offset 2 returns the single
          remaining row with has_more false - the total is the filtered total, not the page
          size.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One address A1 alone in its cohort, so all three subscribers are born PROSPECT."
            - "Three subscribers created at A1 in a fixed order."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1200 N Main St", unit_designator: "Apt 4B", city: "El Paso", state_code: "TX", postal_code: "79901" }
              as: ProgramAdministrator
              captures: { addr_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Ana Ruiz", date_of_birth: "1980-04-11", last4_ssn: "4417", address_id: "${addr_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000 }
              as: ProgramAdministrator
              captures: { sub1_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Beto Ruiz", date_of_birth: "1958-12-19", last4_ssn: "2290", address_id: "${addr_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000 }
              as: ProgramAdministrator
              captures: { sub2_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Carmen Diaz", date_of_birth: "1974-02-08", last4_ssn: "8831", address_id: "${addr_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000 }
              as: ProgramAdministrator
              captures: { sub3_id: $.data.id }
          trigger:
            - call: "GET /lifeline/subscribers"
              payload: { address_id: "${addr_id}", limit: 2, offset: 0 }
              as: ProgramAdministrator
              captures: { page1_first: "$.data[0].id", page1_second: "$.data[1].id" }
            - call: "GET /lifeline/subscribers"
              payload: { address_id: "${addr_id}", limit: 2, offset: 2 }
              as: ProgramAdministrator
              captures: { page2_first: "$.data[0].id" }
          assert:
            - "the first trigger returns HTTP 200 with exactly 2 rows in data"
            - "the first trigger envelope reports limit 2, offset 0, total_count 3 and has_more true"
            - "the second trigger returns HTTP 200 with exactly 1 row in data"
            - "the second trigger envelope reports limit 2, offset 2, total_count 3 and has_more false"
            - "the three ids {${page1_first}, ${page1_second}, ${page2_first}} are exactly {${sub1_id}, ${sub2_id}, ${sub3_id}} with no repeats"
            - "every returned row has status == PROSPECT"

      - name: provider_get_with_unknown_uuid_returns_provider_not_found
        claim_type: not_found
        grounds:
          - validations[priority=22]
          - errors[ERR_PROVIDER_NOT_FOUND]
        distinguishing_aspect: |
          A well-formed but unallocated UUID in the path id segment yields
          ERR_PROVIDER_NOT_FOUND (404) rather than a 200 with an empty body or a 500.
        test_recipe:
          setup:
            - "Empty database apart from the clock, so no Provider row exists at all."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "GET /lifeline/providers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns HTTP 404"
            - "${err} == ERR_PROVIDER_NOT_FOUND"

      - name: subscriber_creation_missing_required_household_size_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=18]
          - entities.Subscriber.fields.household_size
          - endpoints[POST /lifeline/subscribers]
        distinguishing_aspect: |
          household_size carries source input with no default and is listed without the
          `?` marker, so omitting it is ERR_INVALID_REQUEST (400) - not a silent 1 - and no
          Subscriber row is created.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z and one address to reference."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1200 N Main St", city: "El Paso", state_code: "TX", postal_code: "79901" }
              as: ProgramAdministrator
              captures: { addr_id: $.data.id }
          trigger:
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Ana Ruiz", date_of_birth: "1980-04-11", last4_ssn: "4417", address_id: "${addr_id}", annual_income_cents: 3000000, last_3mo_income_cents: 750000 }
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns HTTP 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /lifeline/subscribers?address_id=${addr_id} returns total_count 0"

      - name: subscriber_and_provider_defaults_applied_when_optional_inputs_omitted
        claim_type: defaults
        grounds:
          - entities.Subscriber.fields.qualifying_benefit
          - entities.Subscriber.fields.tribal_lands_flag
          - entities.Provider.fields.status
          - entities.HouseholdAddress.fields.unit_designator
        distinguishing_aspect: |
          Three declared defaults land in one chain: Provider.status defaults to ACTIVE
          when `status` is omitted, HouseholdAddress.unit_designator defaults to null, and
          Subscriber.qualifying_benefit / tribal_lands_flag default to NONE / false - which
          in turn drives eligibility_basis NONE and the non-tribal FPG threshold.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /lifeline/providers"
              payload: { name: "SafeLink Wireless", spin_id: "143101", study_area_code: "489101", licensed_state_codes: ["TX"], enrollment_cap: 50 }
              as: ProgramAdministrator
              captures: { prov_id: $.data.id, prov_status: $.data.status, prov_cap: $.data.enrollment_cap }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1200 N Main St", city: "El Paso", state_code: "TX", postal_code: "79901" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { addr_id: $.data.id, addr_unit: $.data.unit_designator, addr_hash: $.data.address_hash }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Ana Ruiz", date_of_birth: "1980-04-11", last4_ssn: "4417", address_id: "${addr_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000 }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { sub_id: $.data.id, sub_benefit: $.data.qualifying_benefit, sub_tribal: $.data.tribal_lands_flag, sub_basis: $.data.eligibility_basis, sub_threshold: $.data.income_threshold_cents }
          assert:
            - "${prov_status} == ACTIVE"
            - "${prov_cap} == 50"
            - "${addr_unit} == null"
            - "${addr_hash} == 1200NMAINST|ELPASO|TX|79901"
            - "${sub_benefit} == NONE"
            - "${sub_tribal} == false"
            - "${sub_basis} == NONE"
            - "${sub_threshold} == 4341600"
            - "Subscriber.${sub_id}.status == PROSPECT"
            - "Subscriber.${sub_id}.de_enrollment_count == 0"

      - name: subscriber_identity_key_computed_and_client_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Subscriber.fields.identity_key
          - entities.Subscriber.fields.income_threshold_cents
          - calculations.fpg_income_threshold
        distinguishing_aspect: |
          identity_key and income_threshold_cents are source computed: a request that
          supplies both fields explicitly has them ignored, and the stored values are the
          ones the formulas derive from full_name, date_of_birth, last4_ssn and
          household_size.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, one address available."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1200 N Main St", city: "El Paso", state_code: "TX", postal_code: "79901" }
              as: ProgramAdministrator
              captures: { addr_id: $.data.id }
          trigger:
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Ana Ruiz", date_of_birth: "1980-04-11", last4_ssn: "4417", address_id: "${addr_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000, identity_key: "CLIENT-SUPPLIED-KEY", income_threshold_cents: 1 }
              as: ProgramAdministrator
              captures: { sub_id: $.data.id, got_key: $.data.identity_key, got_threshold: $.data.income_threshold_cents }
          assert:
            - "the trigger returns HTTP 201"
            - "${got_key} != CLIENT-SUPPLIED-KEY"
            - "${got_threshold} == 4341600"
            - "${got_threshold} != 1"
            - "Subscriber.${sub_id}.identity_key is the value derived by the declared identity_key formula from ANARUIZ / 1980-04-11 / 4417"

      - name: provider_system_fields_generated_and_client_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Provider
          - complexity_profile
        distinguishing_aspect: |
          id, created_at, updated_at and version are server-minted: a create request that
          supplies id and version has them ignored, the returned id is a bare UUID with no
          type prefix, and version starts at exactly 1.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /lifeline/providers"
              payload: { name: "SafeLink Wireless", spin_id: "143102", study_area_code: "489102", licensed_state_codes: ["TX"], enrollment_cap: 50, id: "00000000-0000-0000-0000-000000000001", version: 99, created_at: "1999-01-01T00:00:00.000Z" }
              as: ProgramAdministrator
              captures: { prov_id: $.data.id, prov_ver: $.data.version, prov_created: $.data.created_at, prov_updated: $.data.updated_at }
          assert:
            - "the trigger returns HTTP 201"
            - "${prov_id} != 00000000-0000-0000-0000-000000000001"
            - "${prov_id} is a bare UUID with no type prefix"
            - "${prov_ver} == 1"
            - "${prov_created} == 2026-08-01T00:00:00.000Z"
            - "${prov_updated} == 2026-08-01T00:00:00.000Z"

      - name: subscriber_type_constraints_reject_bad_enum_and_out_of_range_household_size
        claim_type: type_constraints
        grounds:
          - validations[priority=18]
          - entities.Subscriber.fields.household_size
          - entities.Subscriber.fields.qualifying_benefit
          - entities.Provider.fields.spin_id
        distinguishing_aspect: |
          Three separate declared constraints each surface as ERR_INVALID_REQUEST from the
          same priority-18 row: an out-of-ladder qualifying_benefit enum, household_size 13
          against the declared 1..12 range, and an 8-digit spin_id against the exactly-9
          rule.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, one address available."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1200 N Main St", city: "El Paso", state_code: "TX", postal_code: "79901" }
              as: ProgramAdministrator
              captures: { addr_id: $.data.id }
          trigger:
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Ana Ruiz", date_of_birth: "1980-04-11", last4_ssn: "4417", address_id: "${addr_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000, qualifying_benefit: "FOOD_STAMPS" }
              as: ProgramAdministrator
              captures: { enum_err: $.data.error_id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Ana Ruiz", date_of_birth: "1980-04-11", last4_ssn: "4417", address_id: "${addr_id}", household_size: 13, annual_income_cents: 3000000, last_3mo_income_cents: 750000 }
              as: ProgramAdministrator
              captures: { range_err: $.data.error_id }
            - call: "POST /lifeline/providers"
              payload: { name: "SafeLink Wireless", spin_id: "14310", study_area_code: "489103", licensed_state_codes: ["TX"], enrollment_cap: 50 }
              as: ProgramAdministrator
              captures: { digits_err: $.data.error_id }
          assert:
            - "all three trigger calls return HTTP 400"
            - "${enum_err} == ERR_INVALID_REQUEST"
            - "${range_err} == ERR_INVALID_REQUEST"
            - "${digits_err} == ERR_INVALID_REQUEST"
            - "GET /lifeline/subscribers?address_id=${addr_id} returns total_count 0"

      - name: eligibility_check_creation_under_unknown_parent_subscriber_not_found
        claim_type: parent_relationships
        grounds:
          - entities.EligibilityCheck.parent
          - validations[priority=22]
          - endpoints[POST /lifeline/subscribers/{id}/eligibility-checks]
        distinguishing_aspect: |
          EligibilityCheck is the one entity with a declared parent and the only nested
          route: creating a check under an unallocated subscriber id fails with
          ERR_SUBSCRIBER_NOT_FOUND (404) on the path segment, before any eligibility
          arithmetic runs.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no Subscriber row exists."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /lifeline/subscribers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/eligibility-checks"
              payload: { claimed_basis: "INCOME", proof_document_ref: "DOC-Z9" }
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns HTTP 404"
            - "${err} == ERR_SUBSCRIBER_NOT_FOUND"

      - name: enrollment_graph_junction_resolves_all_four_parents_by_filter
        claim_type: graph
        grounds:
          - complexity_profile.entity_topology
          - entities.Enrollment
          - endpoints[GET /lifeline/enrollments]
        distinguishing_aspect: |
          Enrollment is a four-way junction, and the topology claim is that each of its
          four foreign keys is independently queryable: the same row comes back when the
          list endpoint is filtered by subscriber_id, by provider_id, by
          eligibility_check_id and by certified_address_id.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE provider licensed in TX, one address, one VERIFIED_ELIGIBLE subscriber on a confirmed check, one ACTIVE enrollment joining all four."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/providers"
              payload: { name: "SafeLink Wireless", spin_id: "143104", study_area_code: "489104", licensed_state_codes: ["TX"], enrollment_cap: 50 }
              as: ProgramAdministrator
              captures: { prov_id: $.data.id }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1200 N Main St", unit_designator: "Apt 4B", city: "El Paso", state_code: "TX", postal_code: "79901" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { addr_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Ana Ruiz", date_of_birth: "1980-04-11", last4_ssn: "4417", address_id: "${addr_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000, qualifying_benefit: "NONE", tribal_lands_flag: false }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /lifeline/subscribers/${sub_id}/eligibility-checks"
              payload: { claimed_basis: "INCOME", proof_document_ref: "DOC-G1" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { chk_id: $.data.id }
            - call: "POST /lifeline/eligibility-checks/${chk_id}/verifier-result"
              payload: { verifier_outcome: "MATCH" }
              as: NationalVerifier
            - call: "POST /lifeline/enrollments"
              payload: { subscriber_id: "${sub_id}", provider_id: "${prov_id}", eligibility_check_id: "${chk_id}", certified_address_id: "${addr_id}", service_type: "VOICE", one_per_household_attested: true }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { enr_id: $.data.id }
          trigger:
            - call: "GET /lifeline/enrollments"
              payload: { subscriber_id: "${sub_id}" }
              as: ProgramAdministrator
              captures: { by_sub: "$.data[0].id" }
            - call: "GET /lifeline/enrollments"
              payload: { provider_id: "${prov_id}" }
              as: ProgramAdministrator
              captures: { by_prov: "$.data[0].id" }
            - call: "GET /lifeline/enrollments"
              payload: { eligibility_check_id: "${chk_id}" }
              as: ProgramAdministrator
              captures: { by_chk: "$.data[0].id" }
            - call: "GET /lifeline/enrollments"
              payload: { certified_address_id: "${addr_id}" }
              as: ProgramAdministrator
              captures: { by_addr: "$.data[0].id" }
          assert:
            - "each of the four trigger calls returns HTTP 200 with total_count 1"
            - "${by_sub} == ${enr_id}"
            - "${by_prov} == ${enr_id}"
            - "${by_chk} == ${enr_id}"
            - "${by_addr} == ${enr_id}"
            - "Enrollment.${enr_id}.benefit_status == ACTIVE"
            - "Enrollment.${enr_id}.usage_status == PENDING_FIRST_USE"
            - "Enrollment.${enr_id}.recert_status == NOT_DUE"
            - "Enrollment.${enr_id}.device_status == AWAITING_DEVICE"

  # =========================================================================
  # SECTION 2 - state_machines  (claim-extraction-guide Table 2)
  # =========================================================================
  - section: state_machines
    instances:

      - name: eligibility_check_documentation_loop_returns_to_pending_verifier
        claim_type: valid_transition
        grounds:
          - state_machines.EligibilityCheck.status.PENDING_VERIFIER_to_DOCUMENTATION_REQUIRED
          - state_machines.EligibilityCheck.status.DOCUMENTATION_REQUIRED_to_PENDING_VERIFIER
          - endpoints[POST /lifeline/eligibility-checks/{id}/resubmit-documentation]
        distinguishing_aspect: |
          Both edges of the screening loop fire in order: the verifier parks the check in
          DOCUMENTATION_REQUIRED, the carrier's resubmission returns it to PENDING_VERIFIER
          with resubmission_count 1, and a subsequent MATCH confirms it - proving the
          DOCUMENTATION_REQUIRED state is not terminal.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE provider, one address, one PROSPECT subscriber with an INCOME check in PENDING_VERIFIER."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/providers"
              payload: { name: "SafeLink Wireless", spin_id: "143110", study_area_code: "489110", licensed_state_codes: ["TX"], enrollment_cap: 50 }
              as: ProgramAdministrator
              captures: { prov_id: $.data.id }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1200 N Main St", city: "El Paso", state_code: "TX", postal_code: "79901" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { addr_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Ana Ruiz", date_of_birth: "1980-04-11", last4_ssn: "4417", address_id: "${addr_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000 }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /lifeline/subscribers/${sub_id}/eligibility-checks"
              payload: { claimed_basis: "INCOME", proof_document_ref: "DOC-M1" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { chk_id: $.data.id }
          trigger:
            - call: "POST /lifeline/eligibility-checks/${chk_id}/verifier-result"
              payload: { verifier_outcome: "DOCUMENTATION_REQUIRED", verifier_reason_code: "INCOME_PROOF_ILLEGIBLE" }
              as: NationalVerifier
              captures: { st1: $.data.status, sub_after_1: $.data.subscriber_id }
            - call: "POST /lifeline/eligibility-checks/${chk_id}/resubmit-documentation"
              payload: { proof_document_ref: "DOC-M1-REV2" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { st2: $.data.status, resub2: $.data.resubmission_count }
            - call: "POST /lifeline/eligibility-checks/${chk_id}/verifier-result"
              payload: { verifier_outcome: "MATCH" }
              as: NationalVerifier
              captures: { st3: $.data.status, conf3: $.data.confirmed_at, exp3: $.data.expires_at }
          assert:
            - "${st1} == DOCUMENTATION_REQUIRED"
            - "${sub_after_1} == ${sub_id}"
            - "EligibilityCheck.${chk_id}.verifier_reason_code == INCOME_PROOF_ILLEGIBLE"
            - "Subscriber.${sub_id}.status == ELIGIBILITY_PENDING after the first trigger call"
            - "${st2} == PENDING_VERIFIER"
            - "${resub2} == 1"
            - "EligibilityCheck.${chk_id}.proof_document_ref == DOC-M1-REV2"
            - "${st3} == ELIGIBLE_CONFIRMED"
            - "${conf3} == 2026-08-01T00:00:00.000Z"
            - "${exp3} == 2026-10-30T00:00:00.000Z"
            - "Subscriber.${sub_id}.status == VERIFIED_ELIGIBLE"
            - "Subscriber.${sub_id}.eligibility_basis == INCOME"

      - name: verifier_result_on_confirmed_check_returns_check_not_pending
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=42]
          - state_machines.EligibilityCheck.status.PENDING_VERIFIER_to_ELIGIBLE_CONFIRMED
          - errors[ERR_ELIGIBILITY_CHECK_NOT_PENDING]
        distinguishing_aspect: |
          The `status == PENDING_VERIFIER` precondition on the verifier edge is enforced,
          not assumed: a second verifier-result on an ELIGIBLE_CONFIRMED check is refused
          with ERR_ELIGIBILITY_CHECK_NOT_PENDING (409) and neither confirmed_at nor
          expires_at is rewritten by the later clock.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one check confirmed by MATCH so status is ELIGIBLE_CONFIRMED, confirmed_at 2026-08-01T00:00:00Z, expires_at 2026-10-30T00:00:00Z."
            - "Clock then moved to 2026-08-15T00:00:00Z."
