  # --------------------------- Calculations ----------------------------------
  - section: calculations
    instances:
      - name: cascade_cost_phone_degree2_is_1000
        claim_type: Constants Applied
        grounds: [calculations.cascade_invitation_cost, entities.CascadeInvitation.fields.estimated_cost_cents]
        distinguishing_aspect: "PHONE base 800 + degree-2 surcharge 200 = estimated_cost_cents 1000, computed at invitation creation regardless of send state."
        test_recipe:
          setup: ["Proband case with an at-risk second-degree pedigree member"]
          setup_api_calls:
            - { call: "POST /families", payload: { family_name: "Kindred P", outreach_budget_cents: 10000 }, as: ProgramAdmin, captures: { fid: $.data.id } }
            - { call: "POST /counselors", payload: { full_name: "GC AG", npi: "2000000016" }, as: ProgramAdmin, captures: { cid: $.data.id } }
            - { call: "POST /counseling-cases", payload: { family_id: "${fid}", assigned_counselor_id: "${cid}", patient_name: "P", patient_dob: "1980-01-01", sex: "FEMALE", ancestry: "EUROPEAN", referral_reason: "FHx", covered_sessions: 1 }, as: GeneticCounselor, as_user_id: "${cid}", captures: { case_id: $.data.id } }
            - { call: "POST /pedigree-members", payload: { counseling_case_id: "${case_id}", relationship: "AUNT_UNCLE", degree: 2, affected: false }, as: GeneticCounselor, as_user_id: "${cid}", captures: { mem_id: $.data.id } }
          trigger:
            - { call: "POST /cascade-invitations", payload: { family_id: "${fid}", proband_case_id: "${case_id}", pedigree_member_id: "${mem_id}", relative_name: "Rel P", relationship: "AUNT_UNCLE", degree: 2, contact_method: "PHONE", expires_at: "2026-07-01T00:00:00Z" }, as: GeneticCounselor, as_user_id: "${cid}", captures: { inv_id: $.data.id } }
          assert:
            - "CascadeInvitation.${inv_id}.estimated_cost_cents == 1000"
            - "CascadeInvitation.${inv_id}.status == DRAFT"

      - name: residual_uninformative_negative_halves_prior
        claim_type: Variant Selection
        grounds: [calculations.residual_carrier_risk, entities.CounselingCase.fields.residual_risk_pct]
        distinguishing_aspect: "NEGATIVE with familial_variant_known=false is uninformative: residual = prior * 0.5, so prior 0.2 -> residual 0.1 (MODERATE), distinct from the true-negative collapse to 0.05."
        test_recipe:
          setup: ["Proband familial_variant_known=false, prior 0.2; BENIGN result disclosed"]
          setup_api_calls:
            - { call: "POST /families", payload: { family_name: "Kindred Q", outreach_budget_cents: 10000 }, as: ProgramAdmin, captures: { fid: $.data.id } }
            - { call: "POST /counselors", payload: { full_name: "GC AH", npi: "2000000017" }, as: ProgramAdmin, captures: { cid: $.data.id } }
            - { call: "POST /labs", payload: { lab_name: "LabQ", max_concurrent_capacity: 5, turnaround_days: 14 }, as: ProgramAdmin, captures: { lid: $.data.id } }
            - { call: "POST /counseling-cases", payload: { family_id: "${fid}", assigned_counselor_id: "${cid}", patient_name: "Prob Q", patient_dob: "1980-01-01", sex: "FEMALE", ancestry: "EUROPEAN", referral_reason: "FHx", familial_variant_known: false, covered_sessions: 2 }, as: GeneticCounselor, as_user_id: "${cid}", captures: { case_id: $.data.id } }
            - { call: "POST /pedigree-members", payload: { counseling_case_id: "${case_id}", relationship: "SIBLING", degree: 1, affected: true, age_of_onset: 35 }, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /counseling-cases/${case_id}/assess-risk", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /consent-records", payload: { counseling_case_id: "${case_id}", consent_type: "TESTING" }, as: GeneticCounselor, as_user_id: "${cid}", captures: { consent_id: $.data.id } }
            - { call: "POST /consent-records/${consent_id}/sign", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /test-orders", payload: { counseling_case_id: "${case_id}", lab_id: "${lid}", panel_name: "BRCA", list_price_cents: 300000, processing_start: "2026-05-02T09:00:00Z", processing_end: "2026-05-16T09:00:00Z" }, as: GeneticCounselor, as_user_id: "${cid}", captures: { order_id: $.data.id } }
            - { call: "POST /test-orders/${order_id}/submit", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /test-results", payload: { test_order_id: "${order_id}", gene: "BRCA1", variant: "c.100A>G", classification: "BENIGN" }, as: LabTechnician, as_user_id: "${lid}", captures: { result_id: $.data.id } }
            - { call: "POST /test-results/${result_id}/release", payload: {}, as: LabTechnician, as_user_id: "${lid}" }
          trigger:
            - { call: "POST /test-results/${result_id}/disclose", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
          assert:
            - "CounselingCase.${case_id}.residual_risk_pct == 0.1"
            - "CounselingCase.${case_id}.risk_tier == MODERATE"

      - name: claim_billed_total_sums_line_items
        claim_type: Correct Result
        grounds: [calculations.claim_allowed_amount, entities.InsuranceClaim.fields.billed_total_cents]
        distinguishing_aspect: "billed_total_cents equals the sum of line_items[].billed_cents: 100000 + 50000 = 150000 at claim creation."
        test_recipe:
          setup: ["Case + order; claim with two line items"]
          setup_api_calls:
            - { call: "POST /families", payload: { family_name: "Kindred R", outreach_budget_cents: 10000 }, as: ProgramAdmin, captures: { fid: $.data.id } }
            - { call: "POST /counselors", payload: { full_name: "GC AI", npi: "2000000018" }, as: ProgramAdmin, captures: { cid: $.data.id } }
            - { call: "POST /labs", payload: { lab_name: "LabR", max_concurrent_capacity: 5, turnaround_days: 10 }, as: ProgramAdmin, captures: { lid: $.data.id } }
            - { call: "POST /counseling-cases", payload: { family_id: "${fid}", assigned_counselor_id: "${cid}", patient_name: "P", patient_dob: "1980-01-01", sex: "FEMALE", ancestry: "EUROPEAN", referral_reason: "FHx", covered_sessions: 1 }, as: GeneticCounselor, as_user_id: "${cid}", captures: { case_id: $.data.id } }
            - { call: "POST /test-orders", payload: { counseling_case_id: "${case_id}", lab_id: "${lid}", panel_name: "Panel", list_price_cents: 150000, processing_start: "2026-05-02T09:00:00Z", processing_end: "2026-05-08T09:00:00Z" }, as: GeneticCounselor, as_user_id: "${cid}", captures: { order_id: $.data.id } }
          trigger:
            - { call: "POST /insurance-claims", payload: { counseling_case_id: "${case_id}", test_order_id: "${order_id}", payer_name: "Payer", member_number: "M1", coverage_pct: 0.8, estimated_allowed_rate: 0.7, line_items: [ { cpt: "81162", billed_cents: 100000 }, { cpt: "81216", billed_cents: 50000 } ] }, as: BillingSpecialist, captures: { claim_id: $.data.id } }
          assert:
            - "InsuranceClaim.${claim_id}.billed_total_cents == 150000"

