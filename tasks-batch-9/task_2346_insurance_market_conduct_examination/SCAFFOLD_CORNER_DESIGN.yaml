  - section: calculations
    instances:

      - name: complaint_ratio_tier_boundaries_walk_all_four_bands
        claim_type: threshold
        grounds:
          - calculations.complaint_ratio_per_1k
          - entities.Insurer.fields.risk_tier
          - endpoints[PATCH /market-conduct/insurers/{id}/market-data]
        distinguishing_aspect: |
          One carrier with a fixed 100000-policy denominator is walked across every declared tier
          boundary from above and below in a single sequence: 5.00 and 2.50 and 1.00 are each
          inclusive lower bounds, so the tier only steps down one cent below each of them. This
          pins the comparison operators as >= rather than > at all three cut points at once.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /market-conduct/insurers"
              payload: { name: "Aurora Mutual Insurance Company", naic_code: "10001", annual_premium_written_cents: 1200000000, policy_count_in_force: 100000, confirmed_complaints_12mo: 500, financial_stress_score: 60, consumer_trend_score: 50 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { aurora_id: "$.data.id", r0: "$.data.complaint_ratio_per_1k", t0: "$.data.risk_tier" }
          trigger:
            - call: "PATCH /market-conduct/insurers/${aurora_id}/market-data"
              payload: { confirmed_complaints_12mo: 499 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { r1: "$.data.complaint_ratio_per_1k", t1: "$.data.risk_tier" }
            - call: "PATCH /market-conduct/insurers/${aurora_id}/market-data"
              payload: { confirmed_complaints_12mo: 250 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { r2: "$.data.complaint_ratio_per_1k", t2: "$.data.risk_tier" }
            - call: "PATCH /market-conduct/insurers/${aurora_id}/market-data"
              payload: { confirmed_complaints_12mo: 249 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { r3: "$.data.complaint_ratio_per_1k", t3: "$.data.risk_tier" }
            - call: "PATCH /market-conduct/insurers/${aurora_id}/market-data"
              payload: { confirmed_complaints_12mo: 100 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { r4: "$.data.complaint_ratio_per_1k", t4: "$.data.risk_tier" }
            - call: "PATCH /market-conduct/insurers/${aurora_id}/market-data"
              payload: { confirmed_complaints_12mo: 99 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { r5: "$.data.complaint_ratio_per_1k", t5: "$.data.risk_tier" }
          assert:
            - "500 complaints / 100000 policies -> complaint_ratio_per_1k == 5.00 and risk_tier == HIGH (5.00 is inclusive)"
            - "499 -> 4.99 and ELEVATED"
            - "250 -> 2.50 and ELEVATED (2.50 is inclusive)"
            - "249 -> 2.49 and MODERATE"
            - "100 -> 1.00 and MODERATE (1.00 is inclusive)"
            - "99 -> 0.99 and LOW"
            - "Insurer.${aurora_id}.version incremented once per PATCH, five times in total"

      - name: complaint_ratio_rounds_half_up_at_the_third_decimal
        claim_type: precision
        grounds:
          - calculations.complaint_ratio_per_1k
          - entities.Insurer.fields.complaint_ratio_per_1k
        distinguishing_aspect: |
          A 1600-policy denominator makes the ratio land exactly on a half cent (0.625), which is the
          one input class that separates round-half-up from banker's rounding: the answer must be 0.63
          and not 0.62. The same denominator then produces exact values at 1.25 and 5.00, and a
          three-policy denominator produces a repeating decimal that must truncate-with-rounding to
          333.33 rather than overflow or error.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /market-conduct/insurers"
              payload: { name: "Aurora Mutual Insurance Company", naic_code: "10001", annual_premium_written_cents: 1200000000, policy_count_in_force: 1600, confirmed_complaints_12mo: 1, financial_stress_score: 60, consumer_trend_score: 50 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { aurora_id: "$.data.id", r_half: "$.data.complaint_ratio_per_1k", t_half: "$.data.risk_tier" }
          trigger:
            - call: "PATCH /market-conduct/insurers/${aurora_id}/market-data"
              payload: { confirmed_complaints_12mo: 2 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { r_125: "$.data.complaint_ratio_per_1k", t_125: "$.data.risk_tier" }
            - call: "PATCH /market-conduct/insurers/${aurora_id}/market-data"
              payload: { confirmed_complaints_12mo: 8 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { r_500: "$.data.complaint_ratio_per_1k", t_500: "$.data.risk_tier" }
            - call: "PATCH /market-conduct/insurers/${aurora_id}/market-data"
              payload: { confirmed_complaints_12mo: 1, policy_count_in_force: 3 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { r_rep: "$.data.complaint_ratio_per_1k", t_rep: "$.data.risk_tier" }
            - call: "PATCH /market-conduct/insurers/${aurora_id}/market-data"
              payload: { policy_count_in_force: 0 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { r_zero: "$.data.complaint_ratio_per_1k", t_zero: "$.data.risk_tier" }
          assert:
            - "1 complaint / 1600 policies == 0.625 per 1k -> stored as 0.63, not 0.62 (round_half_up)"
            - "risk_tier for 0.63 is LOW"
            - "2 / 1600 == 1.25 exactly -> 1.25 and MODERATE"
            - "8 / 1600 == 5.00 exactly -> 5.00 and HIGH"
            - "1 / 3 == 333.333... -> 333.33 and HIGH"
            - "policy_count_in_force 0 -> complaint_ratio_per_1k == 0.00 and risk_tier == UNRATED (no division by zero)"

      - name: withdrawn_carriers_are_excluded_from_the_scoring_input_set
        claim_type: input_set_filtering
        grounds:
          - calculations.composite_analysis_score
          - state_machines.MarketAnalysisCycle
          - endpoints[POST /market-conduct/analysis-cycles/{id}/score]
        distinguishing_aspect: |
          Scoring is not a scan of every Insurer row: WITHDRAWN carriers are dropped from the input set
          entirely, so they get no AnalysisScore row at all - which is a different outcome from the
          SUSPENDED carrier, which is scored and only later disqualified at selection time with
          LICENSE_INELIGIBLE. scored_insurer_count must therefore read 2, not 3.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /market-conduct/insurers"
              payload: { name: "Aurora Mutual Insurance Company", naic_code: "10001", annual_premium_written_cents: 5000000000, policy_count_in_force: 100000, confirmed_complaints_12mo: 500, financial_stress_score: 100, consumer_trend_score: 100 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { a_id: "$.data.id" }
            - call: "POST /market-conduct/insurers"
              payload: { name: "Boreal Casualty Company", naic_code: "10002", annual_premium_written_cents: 1200000000, policy_count_in_force: 40000, confirmed_complaints_12mo: 120, financial_stress_score: 60, consumer_trend_score: 10, license_status: "SUSPENDED" }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { b_id: "$.data.id" }
            - call: "POST /market-conduct/insurers"
