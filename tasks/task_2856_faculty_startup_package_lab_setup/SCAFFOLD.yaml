scenario: |
  2856. Faculty Startup Package & Lab Setup (university dean's office): negotiated startup
  commitment across equipment, personnel, renovation and discretionary funds, multi-year
  commitment scheduling with departmental and college cost sharing, laboratory space assignment,
  renovation scoping and construction sequencing, equipment procurement with lead times and
  installation utility requirements, hiring of lab staff and graduate students against committed
  funds, spend-down monitoring with expiration and carryforward rules, unspent balance recapture
  on departure and transfer of equipment, retention counteroffer packages and recommitment

domain_name: faculty-startup-package
api_prefix: "/"   # flat peer collections mounted at the API root (/faculty, /startup-packages, /lab-spaces, ...)

complexity_profile:
  difficulty_level: expert
  primary_archetype: multi_party_negotiation
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  notes: |
    Flat peer collections (no nested ownership URLs except read-only sub-resource lists and
    phase actions). Two self-referential FKs: FundingUnit.parent_unit_id (college -> department)
    and StartupPackage.superseded_package_id (retention counteroffer -> predecessor package).
    Non-linear shapes: StartupPackage carries two independent state axes
    (negotiation_status x spend_status); RenovationProject cycles BID -> SCOPING via rescope;
    EquipmentOrder branches DELIVERED -> {INSTALLED | UTILITY_BLOCKED}; Faculty cycles
    DEPARTURE_NOTICE -> ACTIVE when a retention counteroffer is activated.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: FundingUnit
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: display name of the college, department, or dean's office pool
      - name: unit_type
        type: enum
        source: input
        description: which cost-sharing tier this unit represents
        constraints: "one of {COLLEGE, DEPARTMENT, DEAN_OFFICE}"
      - name: parent_unit_id
        type: string
        source: input
        description: "FK -> FundingUnit.id; owning COLLEGE unit for a DEPARTMENT or DEAN_OFFICE unit; null for a COLLEGE unit"
        default: null
        constraints: "required when unit_type IN {DEPARTMENT, DEAN_OFFICE} and MUST reference a unit with unit_type == COLLEGE; MUST be null when unit_type == COLLEGE"
      - name: cost_share_pool_cents
        type: integer
        source: input
        description: total cents this unit may reserve across all startup packages
        constraints: ">= 0"
      - name: reserved_cents
        type: integer
        source: computed
        description: "sum of this unit's largest-remainder share of total_committed_cents over every StartupPackage with negotiation_status IN {APPROVED, ACTIVE, CLOSED_OUT} naming this unit, minus its share of every EXPIRY and RECAPTURE SpendTransaction"
        default: 0
      - name: committed_cents
        type: integer
        source: computed
        description: "sum of this unit's stored share over SpendTransaction rows with kind == ENCUMBRANCE minus its share over kind IN {RELEASE, DISBURSEMENT}; i.e. share of encumbrances still open"
        default: 0
      - name: disbursed_cents
        type: integer
        source: computed
        description: "sum of this unit's stored share over SpendTransaction rows with kind == DISBURSEMENT"
        default: 0
      - name: refunded_cents
        type: integer
        source: computed
        description: "sum of this unit's stored share over SpendTransaction rows with kind IN {EXPIRY, RECAPTURE}"
        default: 0
      - name: available_pool_cents
        type: integer
        source: computed
        description: "cost_share_pool_cents - reserved_cents"
        default: 0

  - name: Faculty
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: faculty member's name
      - name: rank
        type: enum
        source: input
        description: appointment rank at hire
        constraints: "one of {ASSISTANT, ASSOCIATE, FULL}"
      - name: funding_unit_id
        type: string
        source: input
        description: "FK -> FundingUnit.id; home DEPARTMENT unit; MUST reference a unit with unit_type == DEPARTMENT"
      - name: appointment_status
        type: enum
        source: system
        description: lifecycle of the appointment
        default: CANDIDATE
        constraints: "one of {CANDIDATE, ACTIVE, DEPARTURE_NOTICE, DEPARTED, TRANSFERRED_INTERNAL}"
      - name: planned_start_date
        type: string
        source: input
        description: "calendar date (YYYY-MM-DD) the appointment is expected to begin"
      - name: activated_on
        type: datetime
        source: system
        description: logical-clock instant at which appointment_status became ACTIVE
        default: null
      - name: departure_intent
        type: enum
        source: system
        description: "intent recorded by POST /faculty/{id}/departure-notice; null while ACTIVE or CANDIDATE"
        default: null
        constraints: "one of {DEPARTURE, INTERNAL_TRANSFER, OUTSIDE_OFFER}"
      - name: departure_effective_on
        type: string
        source: system
        description: "calendar date (YYYY-MM-DD) from which separation may be executed; copied from the departure-notice payload"
        default: null
      - name: target_funding_unit_id
        type: string
        source: system
        description: "FK -> FundingUnit.id; receiving DEPARTMENT unit for departure_intent == INTERNAL_TRANSFER; null otherwise"
        default: null
      - name: separated_on
        type: datetime
        source: system
        description: logical-clock instant of DEPARTED / TRANSFERRED_INTERNAL
        default: null
      - name: retention_round
        type: integer
        source: computed
        description: "count of StartupPackage rows for this faculty with package_kind == RETENTION_COUNTEROFFER and negotiation_status IN {ACTIVE, CLOSED_OUT, SUPERSEDED}"
        default: 0

  - name: StartupPackage
    parent: null
    common_fields: true
    fields:
      - name: faculty_id
        type: string
        source: input
        description: "FK -> Faculty.id; the recruited or retained faculty member"
      - name: package_kind
        type: enum
        source: input
        description: initial recruitment package or retention counteroffer
        constraints: "one of {INITIAL, RETENTION_COUNTEROFFER}"
      - name: superseded_package_id
        type: string
        source: input
        description: "FK -> StartupPackage.id; predecessor package this counteroffer recommits; required when package_kind == RETENTION_COUNTEROFFER, MUST be null when package_kind == INITIAL"
        default: null
      - name: department_unit_id
        type: string
        source: system
        description: "FK -> FundingUnit.id; copied from Faculty.funding_unit_id at creation"
      - name: college_unit_id
        type: string
        source: system
        description: "FK -> FundingUnit.id; copied from the department unit's parent_unit_id at creation"
      - name: dean_unit_id
        type: string
        source: input
        description: "FK -> FundingUnit.id; DEAN_OFFICE unit funding the discretionary share; MUST have unit_type == DEAN_OFFICE"
      - name: dept_share_pct
        type: integer
        source: input
        description: percentage of every spend transaction charged to department_unit_id
        constraints: "0..100; dept_share_pct + college_share_pct + dean_share_pct == 100"
      - name: college_share_pct
        type: integer
        source: input
        description: percentage of every spend transaction charged to college_unit_id
        constraints: "0..100"
      - name: dean_share_pct
        type: integer
        source: input
        description: percentage of every spend transaction charged to dean_unit_id
        constraints: "0..100"
      - name: proposed_total_cents
        type: integer
        source: input
        description: negotiated headline commitment the tranche schedule must reproduce exactly at submit
        constraints: "> 0"
      - name: spend_deadline_on
        type: string
        source: input
        description: "calendar date (YYYY-MM-DD) after which no tranche of this package may be spent"
      - name: negotiation_status
        type: enum
        source: system
        description: negotiation axis of the package state machine
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, DEAN_REVIEW, COUNTERED, APPROVED, ACTIVE, CLOSED_OUT, SUPERSEDED}"
      - name: spend_status
        type: enum
        source: system
        description: spend-authority axis of the package state machine; evolves independently of negotiation_status
        default: NOT_YET_AVAILABLE
        constraints: "one of {NOT_YET_AVAILABLE, SPENDING, FROZEN, SETTLED}"
      - name: negotiation_round
        type: integer
        source: system
        description: incremented by one on every COUNTERED -> DRAFT revision
        default: 1
      - name: counter_total_cents
        type: integer
        source: system
        description: most recent dean counteroffer total; null until the first counter
        default: null
      - name: proposed_by_user_id
        type: string
        source: system
        description: "X-User-ID that called submit (segregation-of-duties subject 1)"
        default: null
      - name: endorsed_by_user_id
        type: string
        source: system
        description: "X-User-ID that called endorse (segregation-of-duties subject 2)"
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID that called approve (segregation-of-duties subject 3)"
        default: null
      - name: total_committed_cents
        type: integer
        source: computed
        description: "sum of CommitmentTranche.amount_cents over every tranche of this package regardless of tranche status"
        default: 0
      - name: total_encumbered_cents
        type: integer
        source: computed
        description: "sum of CommitmentTranche.encumbered_cents over every tranche of this package"
        default: 0
      - name: total_disbursed_cents
        type: integer
        source: computed
        description: "sum of CommitmentTranche.disbursed_cents over every tranche of this package"
        default: 0
      - name: total_available_cents
        type: integer
        source: computed
        description: "sum of CommitmentTranche.available_balance_cents over tranches with status IN {SCHEDULED, OPEN}"
        default: 0
      - name: total_expired_cents
        type: integer
        source: computed
        description: "sum of CommitmentTranche.expired_cents over every tranche of this package"
        default: 0
      - name: total_recaptured_cents
        type: integer
        source: computed
        description: "sum of CommitmentTranche.recaptured_cents over every tranche of this package"
        default: 0
      - name: spend_down_ratio
        type: number
        source: computed
        description: "(total_disbursed_cents + total_encumbered_cents) / total_committed_cents, rounded half-up to 4 decimal places; 0.0 when total_committed_cents == 0"
        default: 0.0
      - name: settlement_variant
        type: enum
        source: system
        description: which separation_settlement variant was executed
        default: null
        constraints: "one of {DEPARTURE_RECAPTURE, INTERNAL_TRANSFER}"
      - name: recaptured_unspent_cents
        type: integer
        source: system
        description: unspent cents pulled back from the tranche schedule at separation
        default: 0
      - name: transferred_balance_cents
        type: integer
        source: system
        description: unspent cents left spendable under the receiving department after an INTERNAL_TRANSFER settlement
        default: 0
      - name: college_holdback_cents
        type: integer
        source: system
        description: cents withheld to college_unit_id on an INTERNAL_TRANSFER settlement
        default: 0
      - name: activated_on
        type: datetime
        source: system
        description: logical-clock instant negotiation_status became ACTIVE
        default: null
      - name: closed_out_on
        type: datetime
        source: system
        description: logical-clock instant negotiation_status became CLOSED_OUT
        default: null

  - name: CommitmentTranche
    parent: null
    common_fields: true
    fields:
      - name: package_id
        type: string
        source: input
        description: "FK -> StartupPackage.id; owning package (path-supplied)"
      - name: category
        type: enum
        source: input
        description: commitment category this tranche funds
        constraints: "one of {EQUIPMENT, PERSONNEL, RENOVATION, DISCRETIONARY}"
      - name: fiscal_year
        type: integer
        source: input
        description: "fiscal year label; FY N runs from N-1-07-01T00:00:00Z inclusive to N-07-01T00:00:00Z exclusive"
        constraints: "2020..2100"
      - name: amount_cents
        type: integer
        source: input
        description: originally scheduled cents for this fiscal year and category
        constraints: "> 0"
      - name: available_on
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the tranche becomes spendable (inclusive bound of the half-open window)"
      - name: expires_on
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the tranche stops being spendable (exclusive bound of the half-open window); MUST be > available_on"
      - name: carryforward_policy
        type: enum
        source: input
        description: how unencumbered cents behave at year-end rollover
        constraints: "one of {NONE, CAPPED, FULL}"
      - name: carryforward_cap_pct
        type: integer
        source: input
        description: "percentage of amount_cents (NOT of amount_cents + carried_in_cents) that may be carried out; required when carryforward_policy == CAPPED, MUST be null otherwise"
        default: null
        constraints: "0..100"
      - name: status
        type: enum
        source: system
        description: tranche lifecycle
        default: SCHEDULED
        constraints: "one of {SCHEDULED, OPEN, OBLIGATED, CARRIED_FORWARD, EXPIRED, RECAPTURED}"
      - name: carried_in_cents
        type: integer
        source: computed
        description: "sum of CARRYFORWARD_IN SpendTransaction.amount_cents against this tranche"
        default: 0
      - name: carried_out_cents
        type: integer
        source: computed
        description: "sum of CARRYFORWARD_OUT SpendTransaction.amount_cents against this tranche"
        default: 0
      - name: encumbered_cents
        type: integer
        source: computed
        description: "sum of ENCUMBRANCE SpendTransaction.amount_cents minus sum of RELEASE and DISBURSEMENT amounts against this tranche"
        default: 0
      - name: disbursed_cents
        type: integer
        source: computed
        description: "sum of DISBURSEMENT SpendTransaction.amount_cents against this tranche"
        default: 0
      - name: expired_cents
        type: integer
        source: computed
        description: "sum of EXPIRY SpendTransaction.amount_cents against this tranche"
        default: 0
      - name: recaptured_cents
        type: integer
        source: computed
        description: "sum of RECAPTURE SpendTransaction.amount_cents against this tranche"
        default: 0
      - name: available_balance_cents
        type: integer
        source: computed
        description: "amount_cents + carried_in_cents - encumbered_cents - disbursed_cents - carried_out_cents - expired_cents - recaptured_cents"
        default: 0
      - name: opened_on
        type: datetime
        source: system
        description: logical-clock instant status became OPEN
        default: null

  - name: LabSpace
    parent: null
    common_fields: true
    fields:
      - name: building_code
        type: string
        source: input
        description: building identifier
        constraints: "(building_code, room_number) unique across LabSpace"
      - name: room_number
        type: string
        source: input
        description: room identifier within the building
      - name: net_sq_ft
        type: integer
        source: input
        description: assignable net square feet
        constraints: "> 0"
      - name: space_class
        type: enum
        source: input
        description: laboratory class
        constraints: "one of {WET, DRY, COMPUTATIONAL}"
      - name: status
        type: enum
        source: system
        description: space lifecycle
        default: AVAILABLE
        constraints: "one of {AVAILABLE, ASSIGNED, UNDER_RENOVATION, DECOMMISSIONED}"
      - name: power_kw_capacity
        type: number
        source: input
        description: installable equipment power capacity in kW
        constraints: "> 0"
      - name: chilled_water_available
        type: boolean
        source: input
        description: whether process chilled water is plumbed to the room
      - name: fume_hood_count
        type: integer
        source: input
        description: number of certified fume hoods in the room
        constraints: ">= 0"
      - name: floor_load_psf
        type: integer
        source: input
        description: rated floor load in pounds per square foot
        constraints: "> 0"
      - name: allocated_share_pct
        type: integer
        source: computed
        description: "sum of SpaceAssignment.share_pct over assignments on this space with status IN {PROPOSED, ACTIVE} whose half-open window contains the current logical clock instant"
        default: 0
      - name: installed_power_kw
        type: number
        source: computed
        description: "sum of EquipmentOrder.required_power_kw over orders with install_space_id == this space and status == INSTALLED"
        default: 0
      - name: installed_fume_hoods
        type: integer
        source: computed
        description: "sum of EquipmentOrder.required_fume_hoods over orders with install_space_id == this space and status == INSTALLED"
        default: 0

  - name: SpaceAssignment
    parent: null
    common_fields: true
    fields:
      - name: space_id
        type: string
        source: input
        description: "FK -> LabSpace.id; the assigned room"
      - name: faculty_id
        type: string
        source: input
        description: "FK -> Faculty.id; the occupant"
      - name: share_pct
        type: integer
        source: input
        description: percentage of the room allocated to this occupant for the window
        constraints: "1..100"
      - name: effective_from
        type: datetime
        source: input
        description: "ISO 8601 UTC inclusive start of the occupancy window"
      - name: effective_to
        type: datetime
        source: input
        description: "ISO 8601 UTC exclusive end of the occupancy window; null means open-ended (treated as +infinity); MUST be > effective_from when present"
        default: null
      - name: status
        type: enum
        source: system
        description: assignment lifecycle
        default: PROPOSED
        constraints: "one of {PROPOSED, ACTIVE, RELEASED, WITHDRAWN}"
      - name: released_on
        type: datetime
        source: system
        description: logical-clock instant status became RELEASED
        default: null

  - name: RenovationProject
    parent: null
    common_fields: true
    fields:
      - name: package_id
        type: string
        source: input
        description: "FK -> StartupPackage.id; package whose RENOVATION tranches fund the work"
      - name: space_id
        type: string
        source: input
        description: "FK -> LabSpace.id; the room being renovated"
      - name: scope_tier
        type: enum
        source: input
        description: renovation scope tier driving the college facilities subsidy percentage
        constraints: "one of {COSMETIC, MODERATE, GUT}"
      - name: estimate_cents
        type: integer
        source: input
        description: scoping estimate in cents
        constraints: "> 0"
      - name: awarded_cents
        type: integer
        source: system
        description: contract award amount recorded at award; null before award
        default: null
      - name: status
        type: enum
        source: system
        description: project lifecycle
        default: SCOPING
        constraints: "one of {SCOPING, BID, AWARDED, IN_PROGRESS, COMPLETED, CANCELLED}"
      - name: rescope_count
        type: integer
        source: system
        description: number of BID -> SCOPING rescope cycles executed
        default: 0
      - name: subsidy_estimate_cents
        type: integer
        source: computed
        description: "SCOPE_ESTIMATE variant of renovation_cost_allocation, computed at award"
        default: null
      - name: package_charge_estimate_cents
        type: integer
        source: computed
        description: "awarded_cents - subsidy_estimate_cents; the amount encumbered against RENOVATION tranches at award"
        default: null
      - name: actual_total_cents
        type: integer
        source: computed
        description: "sum of RenovationPhase.actual_cost_cents over phases of this project with status == COMPLETE; computed at substantial completion"
        default: null
      - name: subsidy_final_cents
        type: integer
        source: computed
        description: "FINAL_ACTUAL variant of renovation_cost_allocation, computed at substantial completion"
        default: null
      - name: package_charge_final_cents
        type: integer
        source: computed
        description: "actual_total_cents - subsidy_final_cents; disbursed against RENOVATION tranches at substantial completion"
        default: null
      - name: cost_variance_cents
        type: integer
        source: computed
        description: "package_charge_final_cents - package_charge_estimate_cents; positive means the package absorbs more than it encumbered"
        default: null
      - name: awarded_on
        type: datetime
        source: system
        description: logical-clock instant of award
        default: null
      - name: completed_on
        type: datetime
        source: system
        description: logical-clock instant of substantial completion
        default: null

  - name: RenovationPhase
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> RenovationProject.id; owning project (path-supplied)"
      - name: sequence_no
        type: integer
        source: input
        description: "construction sequence position; MUST be unique within the project and the project's set MUST be exactly 1..N contiguous at award time"
        constraints: ">= 1"
      - name: name
        type: string
        source: input
        description: phase label (e.g. demolition, mechanical rough-in)
      - name: planned_start
        type: datetime
        source: input
        description: "ISO 8601 UTC inclusive start of the phase occupancy of the project schedule"
      - name: planned_end
        type: datetime
        source: input
        description: "ISO 8601 UTC inclusive end of the phase occupancy of the project schedule; MUST be > planned_start"
      - name: budget_cents
        type: integer
        source: input
        description: phase budget in cents
        constraints: "> 0"
      - name: actual_cost_cents
        type: integer
        source: system
        description: actual phase cost recorded at completion
        default: null
      - name: actual_start
        type: datetime
        source: system
        description: logical-clock instant the phase started
        default: null
      - name: actual_end
        type: datetime
        source: system
        description: logical-clock instant the phase completed
        default: null
      - name: status
        type: enum
        source: system
        description: phase lifecycle
        default: PENDING
        constraints: "one of {PENDING, ACTIVE, COMPLETE}"

  - name: EquipmentOrder
    parent: null
    common_fields: true
    fields:
      - name: package_id
        type: string
        source: input
        description: "FK -> StartupPackage.id; package whose EQUIPMENT tranches fund the purchase"
      - name: install_space_id
        type: string
        source: input
        description: "FK -> LabSpace.id; room the item will be installed in"
      - name: vendor_name
        type: string
        source: input
        description: vendor
      - name: item_description
        type: string
        source: input
        description: what is being purchased
      - name: quoted_cents
        type: integer
        source: input
        description: vendor quote in cents; the amount encumbered when the order is placed
        constraints: "> 0"
      - name: lead_time_days
        type: integer
        source: input
        description: vendor lead time in whole days used to stamp expected_delivery_on at placement
        constraints: ">= 0"
      - name: required_power_kw
        type: number
        source: input
        description: continuous power draw in kW the installation requires
        constraints: ">= 0"
      - name: requires_chilled_water
        type: boolean
        source: input
        description: whether the item needs process chilled water
      - name: required_fume_hoods
        type: integer
        source: input
        description: number of fume hoods the installation consumes
        constraints: ">= 0"
      - name: required_floor_load_psf
        type: integer
        source: input
        description: minimum rated floor load the item needs
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: order lifecycle
        default: REQUESTED
        constraints: "one of {REQUESTED, ORDERED, DELIVERED, INSTALLED, UTILITY_BLOCKED, CANCELLED}"
      - name: utility_block_reason
        type: enum
        source: system
        description: first failing utility check at install; null unless status == UTILITY_BLOCKED
        default: null
        constraints: "one of {POWER, CHILLED_WATER, FUME_HOOD, FLOOR_LOAD}"
      - name: placed_on
        type: datetime
        source: system
        description: logical-clock instant the purchase order was placed
        default: null
      - name: expected_delivery_on
        type: datetime
        source: system
        description: "placed_on + lead_time_days whole days"
        default: null
      - name: delivered_on
        type: datetime
        source: system
        description: logical-clock instant of receipt
        default: null
      - name: installed_on
        type: datetime
        source: system
        description: logical-clock instant of successful installation
        default: null
      - name: encumbered_cents
        type: integer
        source: computed
        description: "quoted_cents while status IN {ORDERED, DELIVERED, UTILITY_BLOCKED}; 0 while status IN {REQUESTED, INSTALLED, CANCELLED}"
        default: 0
      - name: disbursed_cents
        type: integer
        source: computed
        description: "quoted_cents once status == INSTALLED; 0 otherwise"
        default: 0
      - name: transfer_disposition
        type: enum
        source: system
        description: disposition assigned by the separation cascade
        default: null
        constraints: "one of {RETAINED_BY_UNIT, TRANSFERRED_WITH_FACULTY, SURPLUSED}"

  - name: StaffAppointment
    parent: null
    common_fields: true
    fields:
      - name: package_id
        type: string
        source: input
        description: "FK -> StartupPackage.id; package whose PERSONNEL tranches fund the appointment"
      - name: appointment_type
        type: enum
        source: input
        description: kind of lab staff or student appointment
        constraints: "one of {LAB_MANAGER, POSTDOC, GRAD_RA, TECHNICIAN}"
      - name: fte
        type: number
        source: input
        description: full-time equivalent fraction
        constraints: "> 0 and <= 1.0"
      - name: monthly_cost_cents
        type: integer
        source: input
        description: full-time monthly cost in cents before the fte factor
        constraints: "> 0"
      - name: start_date
        type: string
        source: input
        description: "calendar date (YYYY-MM-DD) of the first committed month"
      - name: end_date
        type: string
        source: input
        description: "calendar date (YYYY-MM-DD) of the last committed month; MUST be >= start_date"
      - name: status
        type: enum
        source: system
        description: appointment lifecycle
        default: PROPOSED
        constraints: "one of {PROPOSED, ACTIVE, ENDED, CANCELLED}"
      - name: committed_months
        type: integer
        source: computed
        description: "(end_date.year - start_date.year) * 12 + (end_date.month - start_date.month) + 1"
        default: 0
      - name: encumbered_cents
        type: integer
        source: computed
        description: "staff_encumbrance_rounding output while status == ACTIVE minus amounts already disbursed; 0 while status IN {PROPOSED, CANCELLED, ENDED}"
        default: 0
      - name: disbursed_cents
        type: integer
        source: computed
        description: "cents disbursed against this appointment (posted at POST /staff-appointments/{id}/end for months actually served)"
        default: 0
      - name: ended_on
        type: datetime
        source: system
        description: logical-clock instant status became ENDED or CANCELLED
        default: null

  - name: SpendTransaction
    parent: null
    common_fields: false
    fields:
      - name: package_id
        type: string
        source: system
        description: "FK -> StartupPackage.id; package whose ledger this row belongs to"
      - name: tranche_id
        type: string
        source: system
        description: "FK -> CommitmentTranche.id; tranche this row moves cents on"
      - name: kind
        type: enum
        source: system
        description: ledger event kind; the sign is implied by the kind, amount_cents is always a positive magnitude
        constraints: "one of {ENCUMBRANCE, RELEASE, DISBURSEMENT, EXPIRY, CARRYFORWARD_OUT, CARRYFORWARD_IN, RECAPTURE}"
      - name: amount_cents
        type: integer
        source: system
        description: positive magnitude of cents moved
        constraints: "> 0"
      - name: source_kind
        type: enum
        source: system
        description: which workflow produced this row
        constraints: "one of {EQUIPMENT_ORDER, STAFF_APPOINTMENT, RENOVATION_PROJECT, ROLLOVER, SETTLEMENT}"
      - name: source_id
        type: string
        source: system
        description: "polymorphic reference resolved by source_kind (EquipmentOrder.id, StaffAppointment.id, RenovationProject.id) or null for source_kind IN {ROLLOVER, SETTLEMENT}; intentionally NOT a canonical FK - discover rows for a given source via GET /startup-packages/{id}/spend-transactions and filter on source_id"
        default: null
      - name: reverses_transaction_id
        type: string
        source: system
        description: "id of the ENCUMBRANCE SpendTransaction this row settles, set on kind IN {RELEASE, DISBURSEMENT}; null otherwise; self-reference inside SpendTransaction resolved through the same package's transaction list"
        default: null
      - name: dept_share_cents
        type: integer
        source: computed
        description: "cost_share_split output for department_unit_id, stored on the row so that RELEASE and DISBURSEMENT rows can mirror the exact split of the ENCUMBRANCE they settle"
      - name: college_share_cents
        type: integer
        source: computed
        description: "cost_share_split output for college_unit_id"
      - name: dean_share_cents
        type: integer
        source: computed
        description: "cost_share_split output for dean_unit_id"
      - name: memo
        type: string
        source: system
        description: human-readable reason string

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  # ---- StartupPackage: axis 1 of 2 (negotiation), cyclic via COUNTERED -> DRAFT ----
  - entity: StartupPackage
    axis: negotiation_status
    initial_state: DRAFT
    terminal_states: [CLOSED_OUT, SUPERSEDED]
    note: |
      Cyclic negotiation axis. This axis evolves independently of the spend_status axis on the
      same row: negotiation_status may reach ACTIVE while spend_status is still
      NOT_YET_AVAILABLE, and spend_status may become FROZEN while negotiation_status stays ACTIVE.
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /startup-packages/{id}/submit"
        actor: DeanOffice
        preconditions:
          - "negotiation_status == DRAFT"
          - "the package has >= 1 CommitmentTranche (else ERR_NO_TRANCHES_DEFINED)"
          - "sum of CommitmentTranche.amount_cents == proposed_total_cents (else ERR_TRANCHE_SUM_MISMATCH)"
        side_effects:
          - "proposed_by_user_id = X-User-ID"
          - "increments StartupPackage.version by 1"
      - from: SUBMITTED
        to: DEAN_REVIEW
        trigger: "POST /startup-packages/{id}/endorse"
        actor: DepartmentChair
        preconditions:
          - "negotiation_status == SUBMITTED"
          - "X-User-ID == department_unit_id (else ERR_UNIT_SCOPE_VIOLATION)"
          - "X-User-ID != proposed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "endorsed_by_user_id = X-User-ID"
          - "increments StartupPackage.version by 1"
      - from: DEAN_REVIEW
        to: COUNTERED
        trigger: "POST /startup-packages/{id}/counter"
        actor: Dean
        preconditions:
          - "negotiation_status == DEAN_REVIEW"
          - "X-User-ID == college_unit_id (else ERR_UNIT_SCOPE_VIOLATION)"
        side_effects:
          - "counter_total_cents = payload.counter_total_cents"
          - "endorsed_by_user_id = null (the endorsement is voided by the counter, so the next round must be endorsed again)"
          - "increments StartupPackage.version by 1"
      - from: COUNTERED
        to: DRAFT
        trigger: "POST /startup-packages/{id}/revise"
        actor: DeanOffice
        preconditions:
          - "negotiation_status == COUNTERED"
        side_effects:
          - "proposed_total_cents = payload.revised_total_cents"
          - "negotiation_round += 1"
          - "proposed_by_user_id = null (re-established on the next submit)"
          - "increments StartupPackage.version by 1"
        note: "closes the negotiation cycle DRAFT -> SUBMITTED -> DEAN_REVIEW -> COUNTERED -> DRAFT"
      - from: DEAN_REVIEW
        to: APPROVED
        trigger: "POST /startup-packages/{id}/approve"
        actor: Dean
        preconditions:
          - "negotiation_status == DEAN_REVIEW"
          - "X-User-ID == college_unit_id (else ERR_UNIT_SCOPE_VIOLATION)"
          - "X-User-ID NOT IN {proposed_by_user_id, endorsed_by_user_id} (else ERR_SEGREGATION_OF_DUTIES)"
          - "for each of the three funder units, available_pool_cents >= that unit's cost_share_split share of total_committed_cents (else ERR_UNIT_POOL_EXCEEDED)"
        side_effects:
          - "approved_by_user_id = X-User-ID"
          - "reserves each funder unit's cost_share_split share of total_committed_cents: FundingUnit.reserved_cents += share, available_pool_cents recomputed"
          - "increments StartupPackage.version by 1"
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /startup-packages/{id}/activate"
        actor: DeanOffice
        preconditions:
          - "negotiation_status == APPROVED"
          - "Faculty.appointment_status == ACTIVE when package_kind == INITIAL (else ERR_FACULTY_NOT_ACTIVE); when package_kind == RETENTION_COUNTEROFFER the faculty member is necessarily in DEPARTURE_NOTICE (that is what makes the predecessor eligible per priority 37) and this call is precisely what returns them to ACTIVE, so the gate is DEPARTURE_NOTICE for that kind. This is why priority 21's applies_to list deliberately omits POST /startup-packages/{id}/activate."
        side_effects:
          - "spend_status NOT_YET_AVAILABLE -> SPENDING (parallel axis advanced by the same call)"
          - "every CommitmentTranche of the package with status == SCHEDULED and available_on <= clock and expires_on > clock -> OPEN, stamping opened_on = clock"
          - "when package_kind == RETENTION_COUNTEROFFER: the recommitment cascade in the SUPERSEDED transition below fires on the predecessor package"
          - "activated_on = clock"
          - "increments StartupPackage.version by 1"
      - from: ACTIVE
        to: CLOSED_OUT
        trigger: "POST /startup-packages/{id}/close-out"
        actor: Dean
        preconditions:
          - "negotiation_status == ACTIVE"
          - "total_encumbered_cents == 0 (else ERR_OPEN_ENCUMBRANCES_BLOCK_CLOSEOUT)"
        side_effects:
          - "every CommitmentTranche with status IN {SCHEDULED, OPEN, OBLIGATED, CARRIED_FORWARD} and available_balance_cents > 0 -> EXPIRED with an EXPIRY SpendTransaction for the residual"
          - "each FundingUnit.reserved_cents -= its share of every EXPIRY row; refunded_cents += the same share"
          - "spend_status -> SETTLED"
          - "closed_out_on = clock"
          - "increments StartupPackage.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: activation of a RETENTION_COUNTEROFFER package whose superseded_package_id == this package"
        actor: system
        preconditions:
          - "negotiation_status == ACTIVE"
          - "total_encumbered_cents == 0 (checked on the successor's create as ERR_PREDECESSOR_HAS_OPEN_ENCUMBRANCES)"
        side_effects:
          - "for each category, the sum of available_balance_cents over this package's tranches with status IN {SCHEDULED, OPEN, CARRIED_FORWARD} is removed via RECAPTURE rows (tranche.status -> RECAPTURED) and added as a CARRYFORWARD_IN row to the successor's earliest tranche of the same category (ascending expires_on, tie ascending fiscal_year, tie ascending created_at); when the successor has no tranche in that category the amount stays recaptured and is refunded to the funder units"
          - "each FundingUnit.reserved_cents -= its share of every RECAPTURE row; refunded_cents += the same share"
          - "spend_status -> SETTLED"
          - "Faculty.appointment_status DEPARTURE_NOTICE -> ACTIVE and departure_intent/departure_effective_on/target_funding_unit_id cleared (retention cycle closed)"
          - "increments StartupPackage.version by 1 on both packages"

  # ---- StartupPackage: axis 2 of 2 (spend authority), parallel to the negotiation axis ----
  - entity: StartupPackage
    axis: spend_status
    initial_state: NOT_YET_AVAILABLE
    terminal_states: [SETTLED]
    note: |
      Second independent state dimension on the same StartupPackage row. Every spend-creating
      operation (equipment placement, renovation award, staff activation, equipment install)
      requires spend_status == SPENDING; the negotiation axis alone never authorises spend.
    transitions:
      - from: NOT_YET_AVAILABLE
        to: SPENDING
        trigger: "POST /startup-packages/{id}/activate"
        actor: DeanOffice
        preconditions:
          - "negotiation_status transition APPROVED -> ACTIVE succeeds in the same call"
        side_effects:
          - "SCHEDULED tranches whose window contains the clock become OPEN"
      - from: SPENDING
        to: FROZEN
        trigger: "POST /faculty/{id}/departure-notice"
        actor: DeanOffice
        preconditions:
          - "Faculty.appointment_status == ACTIVE"
          - "spend_status == SPENDING"
        side_effects:
          - "cascade link 1: every StaffAppointment of the package with status == PROPOSED -> CANCELLED"
          - "cascade link 1: every EquipmentOrder of the package with status == REQUESTED -> CANCELLED"
          - "already-encumbered items (ORDERED, DELIVERED, UTILITY_BLOCKED, ACTIVE appointments, AWARDED projects) are left untouched until separation"
          - "increments StartupPackage.version by 1"
      - from: FROZEN
        to: SPENDING
        trigger: "system: activation of a RETENTION_COUNTEROFFER package for the same faculty (recommitment)"
        actor: system
        preconditions:
          - "spend_status == FROZEN"
          - "the successor package reaches negotiation_status ACTIVE"
        side_effects:
          - "applies only to the successor package; this package's spend_status goes to SETTLED via the SUPERSEDED transition"
        note: "the FROZEN -> SPENDING edge is exercised by the successor package row, which is created FROZEN-free; recorded here because the freeze/unfreeze pair is what makes the axis cyclic rather than linear"
      - from: FROZEN
        to: SETTLED
        trigger: "POST /faculty/{id}/separate"
        actor: DeanOffice
        preconditions:
          - "spend_status == FROZEN"
          - "Faculty.appointment_status == DEPARTURE_NOTICE"
          - "clock >= Faculty.departure_effective_on (else ERR_SEPARATION_NOT_DUE)"
        side_effects:
          - "cascade link 2: every StaffAppointment with status == ACTIVE -> ENDED with end_date = clock, running exactly the same staff_encumbrance_rounding settlement arithmetic as POST /staff-appointments/{id}/end (DISBURSEMENT rows for the served months, RELEASE rows for the unserved remainder derived as the per-funder arithmetic remainder)"
          - "cascade link 2: every EquipmentOrder with status IN {ORDERED, DELIVERED, UTILITY_BLOCKED} -> CANCELLED, releasing its open encumbrance"
          - "cascade link 2: every RenovationProject with status IN {SCOPING, BID} -> CANCELLED; AWARDED/IN_PROGRESS projects keep their encumbrance and are released the same way as equipment"
          - "cascade link 3: each RELEASE row lowers its tranche's encumbered_cents and raises available_balance_cents; a tranche in OBLIGATED whose encumbered_cents reaches 0 auto-transitions to EXPIRED"
          - "cascade link 4: separation_settlement runs on the resulting unspent balance (variant chosen by Faculty.departure_intent) posting RECAPTURE rows, setting recaptured_unspent_cents / transferred_balance_cents / college_holdback_cents, and adjusting every FundingUnit.reserved_cents and refunded_cents"
          - "every EquipmentOrder with status == INSTALLED receives transfer_disposition = RETAINED_BY_UNIT when departure_intent == DEPARTURE, TRANSFERRED_WITH_FACULTY when departure_intent == INTERNAL_TRANSFER, or SURPLUSED when departure_intent == OUTSIDE_OFFER (the instrument was bought for a programme that left for a competing institution, so it returns to the college's shared inventory rather than to the department)"
          - "negotiation_status ACTIVE -> CLOSED_OUT, closed_out_on = clock"
          - "increments StartupPackage.version by 1"

  # ---- Faculty: cyclic (DEPARTURE_NOTICE -> ACTIVE when a retention counteroffer activates) ----
  - entity: Faculty
    axis: appointment_status
    initial_state: CANDIDATE
    terminal_states: [DEPARTED, TRANSFERRED_INTERNAL]
    transitions:
      - from: CANDIDATE
        to: ACTIVE
        trigger: "POST /faculty/{id}/activate"
        actor: DeanOffice
        preconditions:
          - "appointment_status == CANDIDATE"
        side_effects:
          - "activated_on = clock"
          - "increments Faculty.version by 1"
      - from: ACTIVE
        to: DEPARTURE_NOTICE
        trigger: "POST /faculty/{id}/departure-notice"
        actor: DeanOffice
        preconditions:
          - "appointment_status == ACTIVE"
          - "payload.departure_intent == INTERNAL_TRANSFER requires payload.target_funding_unit_id naming a FundingUnit with unit_type == DEPARTMENT (else ERR_TRANSFER_TARGET_REQUIRED)"
        side_effects:
          - "departure_intent = payload.departure_intent; departure_effective_on = payload.departure_effective_on; target_funding_unit_id = payload.target_funding_unit_id (null unless INTERNAL_TRANSFER)"
          - "cascade root: the faculty's StartupPackage with negotiation_status == ACTIVE moves spend_status SPENDING -> FROZEN, which in turn cancels its PROPOSED StaffAppointments and REQUESTED EquipmentOrders"
          - "increments Faculty.version by 1"
      - from: DEPARTURE_NOTICE
        to: ACTIVE
        trigger: "system: POST /startup-packages/{id}/activate on a RETENTION_COUNTEROFFER package for this faculty"
        actor: system
        preconditions:
          - "appointment_status == DEPARTURE_NOTICE"
          - "departure_intent == OUTSIDE_OFFER"
        side_effects:
          - "departure_intent, departure_effective_on and target_funding_unit_id cleared to null"
          - "retention_round recomputed"
          - "increments Faculty.version by 1"
        note: "closes the retention cycle ACTIVE -> DEPARTURE_NOTICE -> ACTIVE"
      - from: DEPARTURE_NOTICE
        to: DEPARTED
        trigger: "POST /faculty/{id}/separate"
        actor: DeanOffice
        preconditions:
          - "appointment_status == DEPARTURE_NOTICE"
          - "departure_intent IN {DEPARTURE, OUTSIDE_OFFER}"
          - "clock >= departure_effective_on (else ERR_SEPARATION_NOT_DUE)"
        side_effects:
          - "separated_on = clock"
          - "runs the depth-4 separation cascade on the ACTIVE package with settlement_variant = DEPARTURE_RECAPTURE"
          - "every ACTIVE SpaceAssignment of this faculty -> RELEASED, and each affected LabSpace whose allocated_share_pct falls to 0 goes ASSIGNED -> AVAILABLE"
          - "increments Faculty.version by 1"
      - from: DEPARTURE_NOTICE
        to: TRANSFERRED_INTERNAL
        trigger: "POST /faculty/{id}/separate"
        actor: DeanOffice
        preconditions:
          - "appointment_status == DEPARTURE_NOTICE"
          - "departure_intent == INTERNAL_TRANSFER"
          - "clock >= departure_effective_on (else ERR_SEPARATION_NOT_DUE)"
        side_effects:
          - "separated_on = clock; funding_unit_id = target_funding_unit_id"
          - "runs the same depth-4 separation cascade with settlement_variant = INTERNAL_TRANSFER (different refund geometry, see calculations.separation_settlement)"
          - "every ACTIVE SpaceAssignment of this faculty -> RELEASED, and each affected LabSpace whose allocated_share_pct falls to 0 goes ASSIGNED -> AVAILABLE"
          - "increments Faculty.version by 1"

  # ---- CommitmentTranche: branching terminal set with divergent side-effect sets ----
  - entity: CommitmentTranche
    axis: status
    initial_state: SCHEDULED
    terminal_states: [CARRIED_FORWARD, EXPIRED, RECAPTURED]
    note: |
      CARRIED_FORWARD is terminal: year_end_rollover always drives such a tranche's
      available_balance_cents to exactly 0 (carried_out_cents plus the expired residual consume
      it), so no later transition can move cents on it.
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /startup-packages/{id}/activate or POST /startup-packages/{id}/year-end-rollover"
        actor: DeanOffice
        preconditions:
          - "status == SCHEDULED"
          - "available_on <= clock < expires_on"
        side_effects:
          - "opened_on = clock"
          - "the tranche joins the encumbrance_waterfall candidate set"
          - "increments CommitmentTranche.version by 1"
      - from: OPEN
        to: OBLIGATED
        trigger: "system: POST /startup-packages/{id}/year-end-rollover when the tranche still carries open encumbrances"
        actor: system
        preconditions:
          - "status == OPEN"
          - "encumbered_cents > 0"
          - "the rollover run covers this tranche's fiscal_year"
        side_effects:
          - "the tranche's whole available_balance_cents is carried out and/or expired per year_end_rollover; available_balance_cents becomes 0"
          - "the tranche accepts DISBURSEMENT and RELEASE rows for its open encumbrances but is no longer an encumbrance_waterfall candidate"
          - "a RELEASE row posted against an OBLIGATED tranche is immediately followed by an EXPIRY row of the same amount (released cents can never be re-spent)"
          - "increments CommitmentTranche.version by 1"
      - from: OPEN
        to: CARRIED_FORWARD
        trigger: "POST /startup-packages/{id}/year-end-rollover"
        actor: DeanOffice
        preconditions:
          - "status == OPEN"
          - "encumbered_cents == 0"
          - "year_end_rollover computes carried_out_cents > 0 for this tranche"
        side_effects:
          - "CARRYFORWARD_OUT row for carried_out_cents on this tranche; CARRYFORWARD_IN row of the same amount on the destination tranche, raising its carried_in_cents"
          - "EXPIRY row for the uncarried residual when carried_out_cents < available_balance_cents"
          - "each FundingUnit's reserved_cents -= its share of the EXPIRY row, refunded_cents += the same share (carryforward itself moves no funder money)"
          - "increments CommitmentTranche.version by 1"
      - from: OPEN
        to: EXPIRED
        trigger: "POST /startup-packages/{id}/year-end-rollover, POST /startup-packages/{id}/close-out"
        actor: DeanOffice | Dean
        preconditions:
          - "status == OPEN"
          - "encumbered_cents == 0"
          - "year_end_rollover computes carried_out_cents == 0 for this tranche (policy NONE, cap 0, spend-down ratio below MIN_SPENDDOWN_RATIO_FOR_CARRYFORWARD, or no destination tranche)"
        side_effects:
          - "EXPIRY row for the whole available_balance_cents"
          - "each FundingUnit's reserved_cents -= its share of the EXPIRY row, refunded_cents += the same share"
          - "increments CommitmentTranche.version by 1"
      - from: OBLIGATED
        to: EXPIRED
        trigger: "system: the last open encumbrance on the tranche is settled (DISBURSEMENT) or released (RELEASE)"
        actor: system
        preconditions:
          - "status == OBLIGATED"
          - "encumbered_cents reaches 0 as a result of the settling row"
        side_effects:
          - "any residual available_balance_cents (produced by a RELEASE) is expired via an EXPIRY row so it can never be re-spent"
          - "each FundingUnit's reserved_cents -= its share of the EXPIRY row, refunded_cents += the same share"
          - "increments CommitmentTranche.version by 1"
      - from: SCHEDULED
        to: RECAPTURED
        trigger: "system: separation settlement or predecessor recommitment"
        actor: system
        preconditions:
          - "status == SCHEDULED"
          - "the owning package is being settled (separation) or superseded (recommitment)"
        side_effects:
          - "RECAPTURE row for the whole available_balance_cents"
          - "each FundingUnit's reserved_cents -= its share, refunded_cents += the same share"
          - "increments CommitmentTranche.version by 1"
      - from: OPEN
        to: RECAPTURED
        trigger: "system: separation settlement or predecessor recommitment"
        actor: system
        preconditions:
          - "status == OPEN"
          - "encumbered_cents == 0 after the cascade's RELEASE rows"
        side_effects:
          - "RECAPTURE row for the whole available_balance_cents"
          - "on a recommitment, a CARRYFORWARD_IN row of the same amount lands on the successor package's earliest tranche of the same category"
          - "each FundingUnit's reserved_cents -= its share, refunded_cents += the same share"
          - "increments CommitmentTranche.version by 1"
  # ---- LabSpace ----
  - entity: LabSpace
    axis: status
    initial_state: AVAILABLE
    terminal_states: [DECOMMISSIONED]
    note: "DECOMMISSIONED is declared but only reachable through the separation cascade path below; no endpoint decommissions a room directly."
    transitions:
      - from: AVAILABLE
        to: ASSIGNED
        trigger: "system: POST /space-assignments/{id}/activate"
        actor: system
        preconditions:
          - "status == AVAILABLE"
          - "the activating assignment's window contains the clock"
        side_effects:
          - "allocated_share_pct recomputed"
          - "increments LabSpace.version by 1"
      - from: ASSIGNED
        to: AVAILABLE
        trigger: "system: POST /space-assignments/{id}/release or the separation cascade releasing the last ACTIVE assignment"
        actor: system
        preconditions:
          - "status == ASSIGNED"
          - "allocated_share_pct reaches 0 after the release"
        side_effects:
          - "allocated_share_pct recomputed to 0"
          - "increments LabSpace.version by 1"
      - from: ASSIGNED
        to: UNDER_RENOVATION
        trigger: "system: POST /renovation-projects/{id}/award"
        actor: system
        preconditions:
          - "status IN {AVAILABLE, ASSIGNED}"
        side_effects:
          - "equipment installation into this room is refused with ERR_SPACE_NOT_READY_FOR_INSTALL while UNDER_RENOVATION"
          - "increments LabSpace.version by 1"
      - from: AVAILABLE
        to: UNDER_RENOVATION
        trigger: "system: POST /renovation-projects/{id}/award"
        actor: system
        preconditions:
          - "status == AVAILABLE"
        side_effects:
          - "increments LabSpace.version by 1"
      - from: UNDER_RENOVATION
        to: ASSIGNED
        trigger: "system: POST /renovation-projects/{id}/substantial-completion"
        actor: system
        preconditions:
          - "status == UNDER_RENOVATION"
        side_effects:
          - "cascade link 1: every SpaceAssignment on this space with status == PROPOSED whose half-open window contains the clock -> ACTIVE"
          - "allocated_share_pct recomputed"
          - "increments LabSpace.version by 1"
      - from: ASSIGNED
        to: DECOMMISSIONED
        trigger: "system: separation cascade when the departing faculty held 100% of the room and the room's last renovation project was CANCELLED"
        actor: system
        preconditions:
          - "status == ASSIGNED"
          - "allocated_share_pct == 100 held by the separating faculty"
          - "a RenovationProject on this space transitioned to CANCELLED in the same cascade"
        side_effects:
          - "every remaining SpaceAssignment on the space -> WITHDRAWN"
          - "increments LabSpace.version by 1"

  # ---- SpaceAssignment ----
  - entity: SpaceAssignment
    axis: status
    initial_state: PROPOSED
    terminal_states: [RELEASED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /space-assignments/{id}/activate or the substantial-completion cascade"
        actor: FacilitiesManager | system
        preconditions:
          - "status == PROPOSED"
          - "Faculty.appointment_status IN {CANDIDATE, ACTIVE}"
          - "LabSpace.status != DECOMMISSIONED"
          - "aggregate share over overlapping PROPOSED/ACTIVE assignments on the same space still satisfies space_share_utilization (else ERR_SPACE_SHARE_EXCEEDED)"
        side_effects:
          - "LabSpace AVAILABLE -> ASSIGNED when the window contains the clock"
          - "LabSpace.allocated_share_pct recomputed"
          - "increments SpaceAssignment.version by 1"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "system: the separation cascade or LabSpace decommissioning"
        actor: system
        preconditions:
          - "status == PROPOSED"
        side_effects:
          - "LabSpace.allocated_share_pct recomputed"
          - "increments SpaceAssignment.version by 1"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /space-assignments/{id}/release"
        actor: FacilitiesManager
        preconditions:
          - "status == ACTIVE"
          - "payload.released_on >= effective_from"
        side_effects:
          - "released_on = payload.released_on; effective_to = payload.released_on (the window closes at the release instant, exclusive)"
          - "LabSpace.allocated_share_pct recomputed; LabSpace ASSIGNED -> AVAILABLE when it reaches 0"
          - "increments SpaceAssignment.version by 1"

  # ---- RenovationProject: cyclic (BID -> SCOPING rescope loop) ----
  - entity: RenovationProject
    axis: status
    initial_state: SCOPING
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCOPING
        to: BID
        trigger: "POST /renovation-projects/{id}/solicit-bids"
        actor: FacilitiesManager
        preconditions:
          - "status == SCOPING"
          - "the project has >= 1 RenovationPhase (else ERR_NO_PHASES_DEFINED)"
        side_effects:
          - "increments RenovationProject.version by 1"
      - from: BID
        to: SCOPING
        trigger: "POST /renovation-projects/{id}/rescope"
        actor: FacilitiesManager
        preconditions:
          - "status == BID"
        side_effects:
          - "estimate_cents = payload.revised_estimate_cents; scope_tier = payload.scope_tier"
          - "rescope_count += 1"
          - "increments RenovationProject.version by 1"
        note: "closes the construction-scoping cycle SCOPING -> BID -> SCOPING"
      - from: BID
        to: AWARDED
        trigger: "POST /renovation-projects/{id}/award"
        actor: Dean
        preconditions:
          - "status == BID"
          - "StartupPackage.spend_status == SPENDING (else ERR_PACKAGE_SPEND_FROZEN)"
          - "the project's phase sequence_no set is exactly 1..N contiguous (else ERR_PHASE_SEQUENCE_GAP)"
          - "RENOVATION tranche candidates cover package_charge_estimate_cents (else ERR_INSUFFICIENT_TRANCHE_BALANCE, or ERR_NO_OPEN_TRANCHE when the candidate set is empty)"
        side_effects:
          - "awarded_cents = payload.awarded_cents; awarded_on = clock"
          - "renovation_cost_allocation SCOPE_ESTIMATE variant computes subsidy_estimate_cents and package_charge_estimate_cents"
          - "encumbrance_waterfall encumbers package_charge_estimate_cents across RENOVATION tranches, posting one ENCUMBRANCE row per tranche consumed"
          - "each FundingUnit.committed_cents += its stored share of every ENCUMBRANCE row"
          - "LabSpace status -> UNDER_RENOVATION"
          - "increments RenovationProject.version by 1"
      - from: AWARDED
        to: IN_PROGRESS
        trigger: "system: POST /renovation-projects/{id}/phases/{phase_id}/start on the phase with sequence_no == 1"
        actor: system
        preconditions:
          - "status == AWARDED"
        side_effects:
          - "increments RenovationProject.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /renovation-projects/{id}/substantial-completion"
        actor: FacilitiesManager
        preconditions:
          - "status == IN_PROGRESS"
          - "every RenovationPhase of the project has status == COMPLETE (else ERR_PHASES_INCOMPLETE)"
        side_effects:
          - "actual_total_cents = sum of phase actual_cost_cents; renovation_cost_allocation FINAL_ACTUAL variant computes subsidy_final_cents, package_charge_final_cents and cost_variance_cents"
          - "cascade link 1: the award ENCUMBRANCE rows are settled - a DISBURSEMENT row for min(package_charge_final_cents, package_charge_estimate_cents) per tranche, a RELEASE row for any unspent remainder, and, when cost_variance_cents > 0, a fresh encumbrance_waterfall pass immediately followed by DISBURSEMENT for the overrun"
          - "cascade link 2: each affected CommitmentTranche's encumbered_cents / disbursed_cents / available_balance_cents are recomputed; an OBLIGATED tranche whose encumbered_cents reaches 0 auto-transitions to EXPIRED"
          - "cascade link 3: each FundingUnit's committed_cents, disbursed_cents (and, for any EXPIRY produced by link 2, reserved_cents and refunded_cents) are recomputed from the stored per-row splits"
          - "LabSpace UNDER_RENOVATION -> ASSIGNED, promoting PROPOSED assignments whose window contains the clock to ACTIVE"
          - "completed_on = clock"
          - "increments RenovationProject.version by 1"
      - from: SCOPING
        to: CANCELLED
        trigger: "system: separation cascade (POST /faculty/{id}/separate)"
        actor: system
        preconditions:
          - "status == SCOPING"
        side_effects:
          - "no ledger movement (nothing was encumbered before award)"
          - "increments RenovationProject.version by 1"
      - from: BID
        to: CANCELLED
        trigger: "system: separation cascade (POST /faculty/{id}/separate)"
        actor: system
        preconditions:
          - "status == BID"
        side_effects:
          - "no ledger movement"
          - "increments RenovationProject.version by 1"

  # ---- RenovationPhase ----
  - entity: RenovationPhase
    axis: status
    initial_state: PENDING
    terminal_states: [COMPLETE]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /renovation-projects/{id}/phases/{phase_id}/start"
        actor: FacilitiesManager
        preconditions:
          - "status == PENDING"
          - "RenovationProject.status IN {AWARDED, IN_PROGRESS}"
          - "every phase of the project with a lower sequence_no has status == COMPLETE (construction sequencing, else ERR_RENOVATION_STATE_INVALID)"
        side_effects:
          - "actual_start = clock"
          - "RenovationProject AWARDED -> IN_PROGRESS on the sequence_no == 1 phase"
          - "increments RenovationPhase.version by 1"
      - from: ACTIVE
        to: COMPLETE
        trigger: "POST /renovation-projects/{id}/phases/{phase_id}/complete"
        actor: FacilitiesManager
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "actual_cost_cents = payload.actual_cost_cents; actual_end = clock"
          - "the next phase by sequence_no becomes startable; no ledger movement happens per phase (the ledger settles once at substantial completion)"
          - "increments RenovationPhase.version by 1"

  # ---- EquipmentOrder: branching fork (DELIVERED -> {INSTALLED | UTILITY_BLOCKED}) ----
  - entity: EquipmentOrder
    axis: status
    initial_state: REQUESTED
    terminal_states: [INSTALLED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: ORDERED
        trigger: "POST /equipment-orders/{id}/place"
        actor: DeanOffice
        preconditions:
          - "status == REQUESTED"
          - "StartupPackage.spend_status == SPENDING (else ERR_PACKAGE_SPEND_FROZEN)"
          - "payload.expected_package_version == StartupPackage.version (else ERR_STALE_PACKAGE_VERSION)"
          - "EQUIPMENT tranche candidates cover quoted_cents (else ERR_INSUFFICIENT_TRANCHE_BALANCE, or ERR_NO_OPEN_TRANCHE when the candidate set is empty)"
        side_effects:
          - "placed_on = clock; expected_delivery_on = clock + lead_time_days whole days"
          - "encumbrance_waterfall encumbers quoted_cents across EQUIPMENT tranches, posting one ENCUMBRANCE row per tranche consumed with its own cost_share_split"
          - "each FundingUnit.committed_cents += its stored share of every ENCUMBRANCE row"
          - "increments StartupPackage.version by 1"
          - "increments EquipmentOrder.version by 1"
      - from: ORDERED
        to: DELIVERED
        trigger: "POST /equipment-orders/{id}/receive"
        actor: FacilitiesManager
        preconditions:
          - "status == ORDERED"
        side_effects:
          - "delivered_on = clock (no ledger movement; the encumbrance stays open)"
          - "increments EquipmentOrder.version by 1"
      - from: DELIVERED
        to: INSTALLED
        trigger: "POST /equipment-orders/{id}/install"
        actor: FacilitiesManager
        preconditions:
          - "status IN {DELIVERED, UTILITY_BLOCKED}"
          - "StartupPackage.spend_status == SPENDING (else ERR_PACKAGE_SPEND_FROZEN)"
          - "the install space has an ACTIVE SpaceAssignment to the package's faculty whose half-open window contains the clock (else ERR_SPACE_NOT_ASSIGNED_TO_FACULTY)"
          - "LabSpace.status == ASSIGNED (else ERR_SPACE_NOT_READY_FOR_INSTALL)"
          - "equipment_utility_feasibility passes on all four checks (otherwise the call branches to UTILITY_BLOCKED instead of failing)"
        side_effects:
          - "installed_on = clock; utility_block_reason = null"
          - "cascade link 1: the order's open ENCUMBRANCE rows are settled by DISBURSEMENT rows of the same amounts on the same tranches, each mirroring the stored split of the row it reverses"
          - "cascade link 2: each affected tranche's encumbered_cents falls and disbursed_cents rises; a tranche in OBLIGATED whose encumbered_cents reaches 0 auto-transitions to EXPIRED, expiring any residual available_balance_cents via an EXPIRY row"
          - "cascade link 3: each FundingUnit's committed_cents falls and disbursed_cents rises by the stored shares; when link 2 produced an EXPIRY row, reserved_cents falls and refunded_cents rises by that row's shares"
          - "LabSpace.installed_power_kw / installed_fume_hoods recomputed"
          - "increments EquipmentOrder.version by 1"
      - from: DELIVERED
        to: UTILITY_BLOCKED
        trigger: "POST /equipment-orders/{id}/install"
        actor: FacilitiesManager
        preconditions:
          - "status == DELIVERED"
          - "all preconditions of the DELIVERED -> INSTALLED edge hold EXCEPT equipment_utility_feasibility, which fails at least one of its four checks"
        side_effects:
          - "utility_block_reason = the FIRST failing check in the pinned order POWER -> CHILLED_WATER -> FUME_HOOD -> FLOOR_LOAD"
          - "no ledger movement at all: the encumbrance stays open and nothing is disbursed (this is the divergent side-effect set that distinguishes the branch from INSTALLED)"
          - "LabSpace.installed_power_kw / installed_fume_hoods unchanged"
          - "increments EquipmentOrder.version by 1"
        note: "the fork returns HTTP 200 with the order body; it is a branch, not an error"
      - from: UTILITY_BLOCKED
        to: INSTALLED
        trigger: "POST /equipment-orders/{id}/install (retry after POST /lab-spaces/{id}/utility-upgrade raised the room's envelope, or after another order in the room was cancelled)"
        actor: FacilitiesManager
        preconditions:
          - "status == UTILITY_BLOCKED"
          - "the same preconditions as the DELIVERED -> INSTALLED edge, and equipment_utility_feasibility now passes"
        side_effects:
          - "identical to the DELIVERED -> INSTALLED edge (join point of the fork)"
          - "increments EquipmentOrder.version by 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /equipment-orders/{id}/cancel or the freeze cascade on POST /faculty/{id}/departure-notice"
        actor: DeanOffice | system
        preconditions:
          - "status == REQUESTED"
        side_effects:
          - "no ledger movement (nothing was encumbered)"
          - "increments EquipmentOrder.version by 1"
      - from: ORDERED
        to: CANCELLED
        trigger: "POST /equipment-orders/{id}/cancel or the separation cascade on POST /faculty/{id}/separate"
        actor: DeanOffice | system
        preconditions:
          - "status IN {ORDERED, DELIVERED, UTILITY_BLOCKED}"
        side_effects:
          - "compensation: one RELEASE row per open ENCUMBRANCE row of this order, each copying the exact stored per-funder split of the row it reverses with the opposite sign, so no funder cent drifts"
          - "each affected tranche's encumbered_cents falls and available_balance_cents rises; against an OBLIGATED tranche the released cents are immediately expired via an EXPIRY row of the same amount"
          - "each FundingUnit.committed_cents -= the stored shares of the released rows"
          - "increments EquipmentOrder.version by 1"
      - from: DELIVERED
        to: CANCELLED
        trigger: "POST /equipment-orders/{id}/cancel or the separation cascade"
        actor: DeanOffice | system
        preconditions:
          - "status == DELIVERED"
        side_effects:
          - "identical compensation to the ORDERED -> CANCELLED edge"
          - "increments EquipmentOrder.version by 1"
      - from: UTILITY_BLOCKED
        to: CANCELLED
        trigger: "POST /equipment-orders/{id}/cancel or the separation cascade"
        actor: DeanOffice | system
        preconditions:
          - "status == UTILITY_BLOCKED"
        side_effects:
          - "identical compensation to the ORDERED -> CANCELLED edge"
          - "increments EquipmentOrder.version by 1"

  # ---- StaffAppointment ----
  - entity: StaffAppointment
    axis: status
    initial_state: PROPOSED
    terminal_states: [ENDED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /staff-appointments/{id}/activate"
        actor: DeanOffice
        preconditions:
          - "status == PROPOSED"
          - "StartupPackage.spend_status == SPENDING (else ERR_PACKAGE_SPEND_FROZEN)"
          - "Faculty.appointment_status == ACTIVE (else ERR_FACULTY_NOT_ACTIVE)"
          - "PERSONNEL tranche candidates cover the staff_encumbrance_rounding total (else ERR_INSUFFICIENT_TRANCHE_BALANCE, or ERR_NO_OPEN_TRANCHE when the candidate set is empty)"
        side_effects:
          - "staff_encumbrance_rounding computes the total; encumbrance_waterfall encumbers it across PERSONNEL tranches, posting one ENCUMBRANCE row per tranche consumed"
          - "each FundingUnit.committed_cents += its stored share of every ENCUMBRANCE row"
          - "increments StaffAppointment.version by 1"
      - from: PROPOSED
        to: CANCELLED
        trigger: "system: the freeze cascade on POST /faculty/{id}/departure-notice"
        actor: system
        preconditions:
          - "status == PROPOSED"
        side_effects:
          - "ended_on = clock; no ledger movement (nothing was encumbered)"
          - "increments StaffAppointment.version by 1"
      - from: ACTIVE
        to: ENDED
        trigger: "POST /staff-appointments/{id}/end or the separation cascade"
        actor: DeanOffice | system
        preconditions:
          - "status == ACTIVE"
          - "payload.end_date >= start_date"
        side_effects:
          - "months_served = (payload.end_date.year - start_date.year) * 12 + (payload.end_date.month - start_date.month) + 1, clamped to committed_months"
          - "DISBURSEMENT rows for monthly_charge_cents * months_served (see staff_encumbrance_rounding), then RELEASE rows for the unserved remainder, both mirroring the stored split of the ENCUMBRANCE rows they settle"
          - "each affected tranche's encumbered_cents falls; disbursed_cents rises by the served part and available_balance_cents rises by the released part (immediately expired when the tranche is OBLIGATED)"
          - "each FundingUnit.committed_cents falls, disbursed_cents rises by the stored shares"
          - "ended_on = clock"
          - "increments StaffAppointment.version by 1"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on a parent entity's version - the only sanctioned mechanism)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: space-assignment-create-stale-space
    parent_entity: LabSpace
    write_endpoint: "POST /space-assignments"
    occ_field: "expected_space_version"
    description: |
      Creating a SpaceAssignment against a LabSpace whose version has advanced since the client
      last read the room is rejected. Two assignments whose share percentages both fit inside the
      room's 100% envelope are each legitimate on their own, so a stale writer is not caught by
      any state precondition - the version guard is what stops it from allocating share against a
      room whose occupancy picture it no longer knows.
    error_id: ERR_STALE_SPACE_VERSION
    http_status: 412
  - rule_id: equipment-place-stale-package
    parent_entity: StartupPackage
    write_endpoint: "POST /equipment-orders/{id}/place"
    occ_field: "expected_package_version"
    description: |
      Placing a purchase order against a StartupPackage whose version has advanced since the
      client last read it is rejected. Placing two different orders against the same package is
      legitimate whenever the tranche waterfall covers both, so the second placement is not
      blocked by any state precondition; the version guard is what forces the buyer to re-read
      the package (and therefore the tranche balances) after every ledger-moving event.
    error_id: ERR_STALE_PACKAGE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: cost_share_split
    trigger: "every SpendTransaction row written by any endpoint (ENCUMBRANCE, RELEASE, DISBURSEMENT, EXPIRY, CARRYFORWARD_OUT, CARRYFORWARD_IN, RECAPTURE)"
    algorithm: waterfall_allocation
    formula: |
      # Splits ONE transaction amount across the three funder units of the package.
      # Pinned rounding order: split each transaction individually and accumulate the integer
      # cents per funder. NEVER accumulate amounts first and split the accumulated total -
      # "round per transaction then sum" is the order this scaffold pins; the two orders differ
      # by up to (number_of_transactions) cents per funder.
      inputs: A = transaction.amount_cents (positive integer)
              pcts = [(DEPARTMENT, package.dept_share_pct),
                      (COLLEGE,    package.college_share_pct),
                      (DEAN_OFFICE, package.dean_share_pct)]      # sums to exactly 100
      for each funder i:
          exact_i = A * pct_i / 100                                # exact rational, no rounding
          base_i  = floor(exact_i)
          frac_i  = exact_i - base_i
      remainder = A - (base_DEPARTMENT + base_COLLEGE + base_DEAN_OFFICE)   # 0, 1 or 2
      # Largest-remainder distribution with an explicit, non-random tie-break:
      order = funders sorted by frac_i DESC, ties broken by the fixed funder ordinal
              [DEPARTMENT, COLLEGE, DEAN_OFFICE]                   # never by id, never by created_at
      give 1 cent to each of the first `remainder` funders in `order`
      result: dept_share_cents, college_share_cents, dean_share_cents  (sum == A exactly)

      # OVERRIDE for settlement rows: RELEASE and DISBURSEMENT rows do NOT freely re-run this
      # split. A settlement of the WHOLE encumbered amount copies the stored dept/college/dean
      # split of the ENCUMBRANCE row named by reverses_transaction_id verbatim. A PARTIAL
      # settlement (an appointment ended early, a renovation finishing under its estimate) runs
      # this formula on the settled part to build the DISBURSEMENT row, then derives the paired
      # RELEASE row's split as the per-funder ARITHMETIC REMAINDER
      # (stored_encumbrance_share - disbursed_share). Deriving the release by re-running the
      # formula on the released part instead would drift by up to 2 cents per funder and break the
      # conserved quantity of compensating_invariant.
    input_set: "the acting package's three share percentages, frozen at package creation; a package whose shares are edited later is not possible - the fields are input-only at POST /startup-packages"
    constants:
      FUNDER_ORDINAL: [DEPARTMENT, COLLEGE, DEAN_OFFICE]
    precision: "whole cents; floor plus largest-remainder, so the three shares always sum to the transaction amount exactly"

  - name: package_spend_rollup
    trigger: "after every SpendTransaction batch written by any endpoint, and after every CommitmentTranche create"
    algorithm: aggregation
    formula: |
      total_committed_cents  = sum(t.amount_cents            for t in tranches(package))          # all statuses
      total_encumbered_cents = sum(t.encumbered_cents        for t in tranches(package))
      total_disbursed_cents  = sum(t.disbursed_cents         for t in tranches(package))
      total_expired_cents    = sum(t.expired_cents           for t in tranches(package))
      total_recaptured_cents = sum(t.recaptured_cents        for t in tranches(package))
      total_available_cents  = sum(t.available_balance_cents for t in tranches(package)
                                   if t.status in {SCHEDULED, OPEN})
      spend_down_ratio       = round_half_up(
                                 (total_disbursed_cents + total_encumbered_cents)
                                 / total_committed_cents, 4)        # 0.0 when total_committed_cents == 0
    input_set: "every CommitmentTranche whose package_id == the package, no status filter except on total_available_cents (SCHEDULED and OPEN only - OBLIGATED, CARRIED_FORWARD, EXPIRED and RECAPTURED balances are not available)"
    constants: {}
    precision: "integers in cents; spend_down_ratio to 4 decimal places, round_half_up"

  - name: tranche_balance_identity
    trigger: "invariant re-checked after every SpendTransaction batch"
    algorithm: aggregation
    formula: |
      # Conserved quantity #1 of Rule 9: the tranche budget identity.
      amount_cents + carried_in_cents
        == available_balance_cents + encumbered_cents + disbursed_cents
           + carried_out_cents + expired_cents + recaptured_cents
      # Every ledger row moves cents between exactly two terms of this identity:
      #   ENCUMBRANCE      available -> encumbered
      #   RELEASE          encumbered -> available
      #   DISBURSEMENT     encumbered -> disbursed
      #   EXPIRY           available -> expired
      #   CARRYFORWARD_OUT available -> carried_out
      #   CARRYFORWARD_IN  (raises carried_in and available together on the destination)
      #   RECAPTURE        available -> recaptured
    input_set: "one tranche at a time; holds for every tranche in every status"
    constants: {}
    precision: "exact integer cents; zero tolerance"

  - name: encumbrance_waterfall
    trigger: "POST /equipment-orders/{id}/place, POST /renovation-projects/{id}/award, POST /staff-appointments/{id}/activate, and the overrun pass inside POST /renovation-projects/{id}/substantial-completion"
    algorithm: waterfall_allocation
    formula: |
      required = the amount to encumber (quoted_cents | package_charge_estimate_cents
                                         | staff_encumbrance_rounding total | overrun)
      candidates = [t for t in tranches(package)
                    if t.category == required_category
                    and t.status == OPEN
                    and t.available_on <= clock < t.expires_on]      # half-open window
      if candidates is empty:            reject with ERR_NO_OPEN_TRANCHE          # empty-set edge
      order candidates by expires_on ASC, then fiscal_year ASC, then created_at ASC   # never by id
      capacity = sum(t.available_balance_cents for t in candidates)
      if capacity < required:            reject with ERR_INSUFFICIENT_TRANCHE_BALANCE  # all-or-nothing
      remaining = required
      for t in ordered candidates:
          take = min(remaining, t.available_balance_cents)
          if take > 0: write ENCUMBRANCE row (tranche_id=t.id, amount_cents=take) and run
                       cost_share_split on `take` (NOT on `required`)
          remaining -= take
          if remaining == 0: break
      # capacity == required is accepted (>= boundary): the last tranche is drained to exactly 0
      # available_balance_cents and stays OPEN.
    input_set: "only OPEN tranches of the matching category whose half-open [available_on, expires_on) window contains the clock; SCHEDULED, OBLIGATED, CARRIED_FORWARD, EXPIRED and RECAPTURED tranches never participate"
    constants: {}
    precision: "exact integer cents; no partial encumbrance is ever written when capacity < required"

  - name: staff_encumbrance_rounding
    trigger: "POST /staff-appointments/{id}/activate (encumbrance) and POST /staff-appointments/{id}/end (disbursement split)"
    algorithm: aggregation
    formula: |
      # Pinned nested-rounding order: round the fte-weighted MONTHLY charge to whole cents FIRST,
      # then multiply by the month count. The other order
      # (round_half_up(monthly_cost_cents * fte * committed_months)) is explicitly NOT used and
      # produces a different total whenever monthly_cost_cents * fte has a fractional cent.
      committed_months     = (end_date.year - start_date.year) * 12
                             + (end_date.month - start_date.month) + 1
      monthly_charge_cents = round_half_up(monthly_cost_cents * fte)      # step 1: round per month
      encumbrance_total    = monthly_charge_cents * committed_months      # step 2: then multiply
      # At POST /staff-appointments/{id}/end:
      months_served        = min(committed_months,
                                (end.year - start_date.year) * 12 + (end.month - start_date.month) + 1)
      disburse_total       = monthly_charge_cents * months_served
      release_total        = encumbrance_total - disburse_total
    input_set: "the appointment's own fte, monthly_cost_cents, start_date and end_date; no other appointment participates"
    constants: {}
    precision: "monthly_charge_cents rounded half-up to whole cents before multiplication; the product is exact"

  - name: renovation_cost_allocation
    trigger: "POST /renovation-projects/{id}/award (SCOPE_ESTIMATE variant) and POST /renovation-projects/{id}/substantial-completion (FINAL_ACTUAL variant)"
    algorithm: tiered_pricing
    variants:
      - variant_id: SCOPE_ESTIMATE
        applies_when: "at award, when only awarded_cents is known and no phase actuals exist yet"
        formula: |
          subsidy_pct    = RENOVATION_SUBSIDY_PCT[project.scope_tier]        # 0 | 25 | 40
          raw_subsidy    = round_half_up(awarded_cents * subsidy_pct / 100)
          subsidy_estimate_cents      = min(raw_subsidy, RENOVATION_SUBSIDY_CAP_CENTS)
          package_charge_estimate_cents = awarded_cents - subsidy_estimate_cents
          # package_charge_estimate_cents is the amount driven through encumbrance_waterfall
          # against category RENOVATION at award time.
      - variant_id: FINAL_ACTUAL
        applies_when: "at substantial completion, when every phase is COMPLETE and actual_cost_cents is known for all of them"
        formula: |
          actual_total_cents = sum(phase.actual_cost_cents for phase in phases(project))
          allowed_overrun    = round_half_up(awarded_cents * OVERRUN_TOLERANCE_PCT / 100)
          subsidisable       = min(actual_total_cents, awarded_cents + allowed_overrun)
          # The college subsidises the tolerated overrun but not a cent beyond it.
          subsidy_pct        = RENOVATION_SUBSIDY_PCT[project.scope_tier]
          raw_subsidy        = round_half_up(subsidisable * subsidy_pct / 100)
          subsidy_final_cents      = min(raw_subsidy, RENOVATION_SUBSIDY_CAP_CENTS)
          package_charge_final_cents = actual_total_cents - subsidy_final_cents
          cost_variance_cents = package_charge_final_cents - package_charge_estimate_cents
          # Reconciliation: when cost_variance_cents > 0 the delta is encumbered through
          # encumbrance_waterfall and immediately disbursed; when < 0 the surplus is released
          # back to the tranches that carried the estimate (RELEASE rows copying their splits);
          # when == 0 no ledger row is written at all.
      - divergence_note: |
          The two variants disagree on both the base and the ceiling. SCOPE_ESTIMATE subsidises the
          awarded amount; FINAL_ACTUAL subsidises min(actual, awarded + 10% tolerance) but charges
          the package the WHOLE actual. A project that finishes exactly on budget therefore has
          cost_variance_cents == 0, an overrun inside tolerance splits the overrun between college
          and package in the tier ratio, and an overrun beyond tolerance loads 100% of the excess
          onto the package. The cap makes GUT projects diverge again: once raw_subsidy exceeds
          20_000_000 cents both variants clamp, and the variance becomes the full actual-minus-awarded
          delta with no subsidy relief at all.
    input_set: "phases(project) = every RenovationPhase whose project_id == the project; FINAL_ACTUAL requires all of them in status COMPLETE"
    constants:
      RENOVATION_SUBSIDY_PCT: { COSMETIC: 0, MODERATE: 25, GUT: 40 }
      RENOVATION_SUBSIDY_CAP_CENTS: 20000000
      OVERRUN_TOLERANCE_PCT: 10
    precision: "whole cents, round_half_up on each percentage before the cap is applied (cap after rounding, never before)"

  - name: year_end_rollover
    trigger: "POST /startup-packages/{id}/year-end-rollover"
    algorithm: threshold
    formula: |
      # Pinned six-step order. Reordering any pair changes the outcome, so the order is normative.
      # `fy` is the request's fiscal_year; the fiscal window of FY N is
      # [ (N-1)-07-01T00:00:00Z , N-07-01T00:00:00Z ), half-open.
      step 1: ratio = package.spend_down_ratio READ BEFORE any row is written by this call
              (i.e. computed from the pre-rollover ledger). Eligibility is
              ratio >= MIN_SPENDDOWN_RATIO_FOR_CARRYFORWARD (0.5000) - `>=` at the boundary is
              eligible, and 0.4999 is not.
      step 2: subjects = [t for t in tranches(package)
                          if t.fiscal_year == fy and t.status in {SCHEDULED, OPEN, OBLIGATED}]
      step 3: for each subject with encumbered_cents > 0 -> status OBLIGATED. Its
              available_balance_cents is STILL processed by steps 4-6 exactly like any other
              subject (it carries forward and/or expires, ending at 0); what an OBLIGATED tranche
              keeps is its encumbered_cents, which survives the rollover and later settles by
              DISBURSEMENT, or by RELEASE immediately followed by an EXPIRY row of the same amount.
              The OBLIGATED label outranks the CARRIED_FORWARD / EXPIRED labels of step 6: the
              status stays OBLIGATED until the last encumbrance settles, at which point the
              OBLIGATED -> EXPIRED transition of §1.2 fires.
      step 4: for each remaining subject, carry_eligible =
                  0                                                if not eligible
                  available_balance_cents                          if carryforward_policy == FULL
                  min(available_balance_cents,
                      round_half_up(amount_cents * carryforward_cap_pct / 100))
                                                                   if policy == CAPPED
                  0                                                if policy == NONE
              The CAPPED ceiling is a percentage of the tranche's ORIGINAL amount_cents, never of
              carried_in_cents and never of the current available balance.
      step 5: destination = the tranche of the SAME package with the same category,
              fiscal_year == fy + 1, chosen by expires_on ASC then created_at ASC. When no such
              tranche exists, carry_eligible collapses to 0 for that subject (money expires
              rather than being created).
              carry: write CARRYFORWARD_OUT (subject, carry_eligible) and CARRYFORWARD_IN
              (destination, carry_eligible); subject.carried_out_cents += carry_eligible;
              destination.carried_in_cents += carry_eligible.
      step 6: leftover = available_balance_cents after step 5. Write EXPIRY (subject, leftover)
              when leftover > 0. Subject status becomes CARRIED_FORWARD when carry_eligible > 0,
              else EXPIRED when leftover > 0, else EXPIRED with a zero-cent no-row outcome
              (a fully drained SCHEDULED/OPEN tranche still closes as EXPIRED) - except for the subjects
              step 3 marked OBLIGATED, whose status stays OBLIGATED.
    input_set: "only tranches of the requested fiscal_year in status SCHEDULED, OPEN or OBLIGATED; CARRIED_FORWARD, EXPIRED and RECAPTURED tranches of that year are already settled and are skipped"
    constants:
      MIN_SPENDDOWN_RATIO_FOR_CARRYFORWARD: 0.5000
    precision: "ratio compared at 4 decimal places; cap rounded half-up to whole cents"

  - name: separation_settlement
    trigger: "POST /faculty/{id}/separate"
    algorithm: aggregation
    variants:
      - variant_id: DEPARTURE_RECAPTURE
        applies_when: "faculty.departure_intent in {DEPARTURE, OUTSIDE_OFFER} - the faculty member leaves the university"
        formula: |
          unspent = sum(t.available_balance_cents for t in tranches(package)
                        if t.status in {SCHEDULED, OPEN})
          write RECAPTURE rows draining each such tranche to 0 (status -> RECAPTURED)
          package.recaptured_unspent_cents = unspent
          package.transferred_balance_cents = 0
          package.college_holdback_cents    = 0
          # Reserved-unwind (the conserved quantity): each funder's pool gets back exactly its
          # cost_share_split of every RECAPTURE row - dept, college and dean_office all recover
          # their own money.
      - variant_id: INTERNAL_TRANSFER
        applies_when: "faculty.departure_intent == INTERNAL_TRANSFER and faculty.target_funding_unit_id is set - the faculty member moves to another department in the same college"
        formula: |
          unspent = same input set as above
          write the same RECAPTURE rows with the same cost_share_split, so the three original
          funders unwind identically to DEPARTURE_RECAPTURE   # <- the conserved quantity
          college_holdback_cents    = round_half_up(unspent * COLLEGE_HOLDBACK_PCT / 100)
          transferred_balance_cents = unspent - college_holdback_cents
          recaptured_unspent_cents  = college_holdback_cents
          then credit the receiving unit:
              target_unit.cost_share_pool_cents += transferred_balance_cents
      - divergence_note: |
          Both variants unwind the three original funders by identical amounts - that is what makes
          the money conserved rather than duplicated. What diverges is where the unwound cents land
          afterwards: DEPARTURE_RECAPTURE leaves all of it in the original pools and reports
          recaptured_unspent_cents == unspent with a zero transferred balance, while
          INTERNAL_TRANSFER moves 85% of it onward into the receiving department's pool and reports
          recaptured_unspent_cents == the 15% college holdback only. Summing
          (pool deltas across all four units) is zero-sum in the first variant and zero-sum in the
          second too - the receiving unit's gain is exactly the funders' recovery minus the holdback.
    input_set: "only SCHEDULED and OPEN tranches contribute unspent, and only after cascade links 2-3 have released every open encumbrance (so encumbered_cents is 0 everywhere by the time this calculation runs); cents released back onto an OBLIGATED tranche are expired rather than recaptured, and CARRIED_FORWARD / EXPIRED / RECAPTURED tranches have no available balance to settle"
    constants:
      COLLEGE_HOLDBACK_PCT: 15
    precision: "whole cents; the holdback is rounded half-up, and the transferred balance takes the complement so the two always sum to `unspent` exactly"

  - name: equipment_utility_feasibility
    trigger: "POST /equipment-orders/{id}/install"
    algorithm: constraint_propagation
    formula: |
      # Checks run in this pinned order and the FIRST failing check is the one reported, so the
      # utility_block_reason is deterministic even when a room fails several checks at once.
      space = LabSpace(order.install_space_id)
      headroom_power = space.power_kw_capacity - space.installed_power_kw
      headroom_hoods = space.fume_hood_count  - space.installed_fume_hoods
      1. POWER          : required_power_kw     <= headroom_power        else reason = POWER
      2. CHILLED_WATER  : (not requires_chilled_water) or space.chilled_water_available
                                                                        else reason = CHILLED_WATER
      3. FUME_HOOD      : required_fume_hoods   <= headroom_hoods        else reason = FUME_HOOD
      4. FLOOR_LOAD     : required_floor_load_psf <= space.floor_load_psf else reason = FLOOR_LOAD
      # All four use `<=`, so consuming exactly the remaining headroom installs successfully and
      # leaves the headroom at 0; asking for one unit more blocks.
      on success: order -> INSTALLED; space.installed_power_kw += required_power_kw;
                  space.installed_fume_hoods += required_fume_hoods; utility_block_reason = null
      on failure: order -> UTILITY_BLOCKED with utility_block_reason set; the space is untouched
                  and the order's encumbrance is left in place (the money stays committed while
                  facilities upgrade the room).
    input_set: "the one LabSpace named by install_space_id and the one order being installed; installed_power_kw / installed_fume_hoods are the running sums over that space's INSTALLED orders only"
    constants: {}
    precision: "power in kW to 2 decimal places, round_half_up on the running sum; hoods and psf are integers"

  - name: space_share_utilization
    trigger: "POST /space-assignments and POST /space-assignments/{id}/activate"
    algorithm: interval_merge
    formula: |
      # Occupancy windows are HALF-OPEN: [effective_from, effective_to), and a null effective_to
      # means +infinity. Two assignments that merely touch (A.effective_to == B.effective_from)
      # do NOT overlap, so a room can be handed from one faculty member to the next on the same day.
      overlaps(A, B) = A.effective_from < coalesce(B.effective_to, +inf)
                   and B.effective_from < coalesce(A.effective_to, +inf)
      peers = [a for a in assignments(space)
               if a.id != candidate.id and a.status in {PROPOSED, ACTIVE}
               and overlaps(a, candidate)]
      # PROPOSED assignments hold share: a proposal already reserves the room's capacity.
      # RELEASED and WITHDRAWN assignments never hold share.
      if candidate.share_pct + sum(a.share_pct for a in peers) > 100:
          reject with ERR_SPACE_SHARE_EXCEEDED
      space.allocated_share_pct =
          sum(a.share_pct for a in assignments(space)
              if a.status in {PROPOSED, ACTIVE}
              and a.effective_from <= clock < coalesce(a.effective_to, +inf))
      # i.e. the share held AT THE CURRENT LOGICAL CLOCK INSTANT (exactly the definition of
      # LabSpace.allocated_share_pct in §1.1), not the peak over all future instants and not the
      # sum of all share percentages ever granted. A future-dated assignment therefore passes the
      # overlap check above (which compares windows, not the clock) without raising
      # allocated_share_pct until the clock enters its window.
    input_set: "for the ERR_SPACE_SHARE_EXCEEDED check: assignments(space) filtered to status IN {PROPOSED, ACTIVE} and further filtered to those whose half-open window overlaps the candidate's window. For the allocated_share_pct field: assignments(space) filtered to status IN {PROPOSED, ACTIVE} and further filtered to those whose half-open window contains the current clock instant"
    constants: {}
    precision: "integer percentage points; the sum may equal 100 exactly (boundary accepted), 101 is rejected"

  - name: retention_recommitment_floor
    trigger: "POST /startup-packages when package_kind == RETENTION_COUNTEROFFER (validated against superseded_package_id)"
    algorithm: threshold
    formula: |
      predecessor = StartupPackage(superseded_package_id)
      predecessor_unspent = sum(t.available_balance_cents for t in tranches(predecessor)
                                if t.status in {SCHEDULED, OPEN})
      floor = predecessor_unspent + MIN_NEW_MONEY_CENTS
      if proposed_total_cents < floor: reject with ERR_RECOMMITMENT_BELOW_FLOOR
      # `==` at the floor is accepted: a counteroffer that rolls the entire unspent balance forward
      # and adds exactly 2_500_000 cents of new money is the minimum viable recommitment.
      # The predecessor must be in negotiation_status ACTIVE and the faculty member in
      # appointment_status DEPARTURE_NOTICE with departure_intent OUTSIDE_OFFER, else
      # ERR_PREDECESSOR_NOT_ELIGIBLE. Any OBLIGATED predecessor tranche raises
      # ERR_PREDECESSOR_HAS_OPEN_ENCUMBRANCES.
    input_set: "SCHEDULED and OPEN tranches of the predecessor package only"
    constants:
      MIN_NEW_MONEY_CENTS: 2500000
    precision: "exact integer cents"

  - name: renovation_phase_sequencing
    trigger: "POST /renovation-projects/{id}/award (validation of the phase plan) and POST /renovation-projects/{id}/phases"
    algorithm: chronological
    formula: |
      # Phase windows are CLOSED intervals [planned_start, planned_end] on whole dates - the
      # opposite convention from space assignments, and deliberately so: a crew occupies the room
      # for the whole of its last day.
      phases = phases(project) ordered by sequence_no ASC
      1. sequence_no values must be exactly 1..len(phases) with no gap and no duplicate
         (else ERR_PHASE_SEQUENCE_GAP)
      2. for every phase: planned_start <= planned_end (else ERR_VALIDATION)
      3. no two phases may overlap as closed intervals:
             overlaps(A,B) = A.planned_start <= B.planned_end and B.planned_start <= A.planned_end
         (else ERR_PHASE_WINDOW_OVERLAP) - note that adjacent days A.end == B.start DO overlap here
      4. consecutive phases need a changeover gap of at least PHASE_BUFFER_DAYS calendar days:
             phases[i+1].planned_start - phases[i].planned_end >= PHASE_BUFFER_DAYS days
         (else ERR_PHASE_BUFFER_VIOLATION). Exactly 2 days is accepted; 1 day is not.
      5. sum(phase.budget_cents) must equal project.awarded_cents at award
         (else ERR_VALIDATION)
      # A project with zero phases cannot be awarded (ERR_NO_PHASES_DEFINED) and cannot reach
      # substantial completion with any phase not COMPLETE (ERR_PHASES_INCOMPLETE).
    input_set: "every RenovationPhase whose project_id == the project, in every status; cancelled projects are not re-validated"
    constants:
      PHASE_BUFFER_DAYS: 2
    precision: "whole calendar days; the buffer is measured end-date to start-date inclusive of neither endpoint"

  - name: package_tranche_consistency
    trigger: "POST /startup-packages/{id}/submit"
    algorithm: aggregation
    formula: |
      # Conserved quantity #2 of Rule 9: a package's proposed total must equal the money actually
      # scheduled into tranches before it can leave DRAFT.
      if len(tranches(package)) == 0:                     reject ERR_NO_TRANCHES_DEFINED
      if sum(t.amount_cents for t in tranches(package)) != package.proposed_total_cents:
                                                          reject ERR_TRANCHE_SUM_MISMATCH
      # On approval the same sum is reserved against the three funder pools:
      #   for each funder: required = cost_share_split(proposed_total_cents)[funder]
      #   if required > funder_unit.available_pool_cents: reject ERR_UNIT_POOL_EXCEEDED
      #   funder_unit.reserved_cents += required
      # available_pool_cents == cost_share_pool_cents - reserved_cents holds for every FundingUnit
      # at every instant; reserved_cents itself falls by each unit's stored share of every EXPIRY
      # and RECAPTURE row, so expired and recaptured money returns to the pool automatically.
    input_set: "every CommitmentTranche of the package regardless of status (at submit time they are all SCHEDULED)"
    constants: {}
    precision: "exact integer cents; zero tolerance on the equality"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (ordered by priority; lowest priority number wins
#     when a single request violates several rules)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role appears in the called endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "request body parses, every required input field is present and non-null, enums are members of their declared set, integer cent fields are >= 0, fte is > 0 and <= 1.00, share percentages are 1..100, dates are ISO-8601, and every interval is ordered (planned_start <= planned_end, effective_from < effective_to, available_on < expires_on, start_date <= end_date)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 4
    category: business_constraint
    check: "dept_share_pct + college_share_pct + dean_share_pct == 100 exactly"
    error_id: ERR_SHARE_PCT_SUM_INVALID
    http_status: 422
    applies_to: "POST /startup-packages"
  - priority: 5
    category: existence
    check: "the FundingUnit named by any *_unit_id path segment or body field exists, and unit_type matches the role it is used in (department_unit_id must be a DEPARTMENT, college_unit_id a COLLEGE, dean_unit_id a DEAN_OFFICE)"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /funding-units, POST /faculty, POST /startup-packages, GET /funding-units/{id}, GET /funding-units/{id}/faculty"
  - priority: 6
    category: existence
    check: "the Faculty named by the path id or by faculty_id exists"
    error_id: ERR_FACULTY_NOT_FOUND
    http_status: 404
    applies_to: "all /faculty/{id}/* endpoints, POST /startup-packages, POST /space-assignments"
  - priority: 7
    category: existence
    check: "the StartupPackage named by the path id, by package_id, or by superseded_package_id exists"
    error_id: ERR_PACKAGE_NOT_FOUND
    http_status: 404
    applies_to: "all /startup-packages/{id}/* endpoints, POST /renovation-projects, POST /equipment-orders, POST /staff-appointments"
  - priority: 8
    category: existence
    check: "the CommitmentTranche named by the path id exists and belongs to the package in the path when both appear"
    error_id: ERR_TRANCHE_NOT_FOUND
    http_status: 404
    applies_to: "GET /commitment-tranches/{id}, GET /commitment-tranches/{id}/spend-transactions"
  - priority: 9
    category: existence
    check: "the LabSpace named by the path id, by space_id, or by install_space_id exists"
    error_id: ERR_SPACE_NOT_FOUND
    http_status: 404
    applies_to: "GET /lab-spaces/{id}, POST /space-assignments, POST /renovation-projects, POST /equipment-orders"
  - priority: 10
    category: existence
    check: "the RenovationProject named by the path id exists, and the RenovationPhase named by phase_id belongs to it"
    error_id: ERR_PROJECT_NOT_FOUND
    http_status: 404
    applies_to: "all /renovation-projects/{id}/* endpoints"
  - priority: 11
    category: existence
    check: "the EquipmentOrder, StaffAppointment or SpaceAssignment named by the path id exists"
    error_id: ERR_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "all /equipment-orders/{id}/*, /staff-appointments/{id}/* and /space-assignments/{id}/* endpoints"
  - priority: 12
    category: auth
    check: "when the acting role is DepartmentChair or Dean, X-User-ID equals the id of the FundingUnit that funds the target resource (the package's department_unit_id for DepartmentChair, its college_unit_id for Dean; for FundingUnit-scoped reads, the unit itself or one of its descendants)"
    error_id: ERR_UNIT_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /startup-packages/{id}/endorse, POST /startup-packages/{id}/counter, POST /startup-packages/{id}/approve, POST /startup-packages/{id}/year-end-rollover, GET /funding-units/{id}, GET /funding-units/{id}/faculty"
  - priority: 13
    category: auth
    check: "when the acting role is Faculty, X-User-ID equals the faculty_id that owns the target resource (the package's faculty_id, the assignment's faculty_id, or the owning package of an order/appointment/project)"
    error_id: ERR_FACULTY_SCOPE_VIOLATION
    http_status: 403
    applies_to: "GET /startup-packages/{id}, GET /startup-packages/{id}/spend-summary, GET /startup-packages/{id}/tranches, GET /startup-packages/{id}/staff-appointments, GET /startup-packages/{id}/spend-transactions, POST /equipment-orders, POST /staff-appointments"
  - priority: 14
    category: auth
    check: "segregation of duties: the three negotiation steps must be performed by three distinct X-User-IDs - the endorsing user must differ from proposed_by_user_id, and the approving user must differ from both proposed_by_user_id and endorsed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /startup-packages/{id}/endorse, POST /startup-packages/{id}/approve"
  - priority: 15
    category: state
    check: "expected_space_version equals the current LabSpace.version"
    error_id: ERR_STALE_SPACE_VERSION
    http_status: 412
    applies_to: "POST /space-assignments"
  - priority: 16
    category: state
    check: "expected_package_version equals the current StartupPackage.version"
    error_id: ERR_STALE_PACKAGE_VERSION
    http_status: 412
    applies_to: "POST /equipment-orders/{id}/place"
  - priority: 17
    category: state
    check: "the StartupPackage's negotiation_status permits the requested transition (see §1.2 StartupPackage.negotiation_status)"
    error_id: ERR_PACKAGE_STATE_INVALID
    http_status: 409
    applies_to: "POST /startup-packages/{id}/tranches, /submit, /endorse, /counter, /revise, /approve, /activate, /year-end-rollover, /close-out"
  - priority: 18
    category: state
    check: "the package's spend_status is SPENDING (not NOT_YET_AVAILABLE, FROZEN or SETTLED) before any money-moving operation"
    error_id: ERR_PACKAGE_SPEND_FROZEN
    http_status: 409
    applies_to: "POST /equipment-orders/{id}/place, POST /renovation-projects/{id}/award, POST /staff-appointments/{id}/activate, POST /renovation-projects/{id}/substantial-completion"
  - priority: 19
    category: state
    check: "the EquipmentOrder, StaffAppointment or SpaceAssignment is in a status from which the requested action is declared in §1.2"
    error_id: ERR_SPEND_ITEM_STATE_INVALID
    http_status: 409
    applies_to: "POST /equipment-orders/{id}/place, /receive, /install, /cancel; POST /staff-appointments/{id}/activate, /end; POST /space-assignments/{id}/activate, /release"
  - priority: 20
    category: state
    check: "the RenovationProject is in a status from which the requested action is declared in §1.2"
    error_id: ERR_RENOVATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /renovation-projects/{id}/phases, /solicit-bids, /rescope, /award, /phases/{phase_id}/start, /phases/{phase_id}/complete, /substantial-completion"
  - priority: 21
    category: state
    check: "the Faculty concerned is in an appointment_status the operation allows: ACTIVE for every money-moving operation, and ACTIVE or CANDIDATE for space assignment (a room may be assigned before arrival). DEPARTURE_NOTICE, DEPARTED and TRANSFERRED_INTERNAL are never allowed. This rule is the only reachable gate on POST /space-assignments, which carries no spend_status precondition and is therefore not shadowed by priority 18."
    error_id: ERR_FACULTY_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /space-assignments, POST /space-assignments/{id}/activate, POST /equipment-orders/{id}/place, POST /staff-appointments/{id}/activate, POST /renovation-projects/{id}/award"
  - priority: 22
    category: business_referential
    check: "the install_space_id of the order is covered by a SpaceAssignment in status ACTIVE whose faculty_id equals the package's faculty_id and whose half-open window contains the clock"
    error_id: ERR_SPACE_NOT_ASSIGNED_TO_FACULTY
    http_status: 422
    applies_to: "POST /equipment-orders/{id}/install"
  - priority: 23
    category: business_safety
    check: "the install_space_id is in LabSpace.status ASSIGNED - a room still UNDER_RENOVATION or DECOMMISSIONED cannot receive equipment even when the faculty member holds an assignment on it"
    error_id: ERR_SPACE_NOT_READY_FOR_INSTALL
    http_status: 409
    applies_to: "POST /equipment-orders/{id}/install"
  - priority: 24
    category: business_constraint
    check: "building_code + room_number is unique across all LabSpace rows"
    error_id: ERR_SPACE_ALREADY_REGISTERED
    http_status: 409
    applies_to: "POST /lab-spaces"
  - priority: 25
    category: business_constraint
    check: "aggregate share: the candidate assignment's share_pct plus the share_pct of every PROPOSED or ACTIVE assignment on the same space whose half-open window overlaps the candidate's must not exceed 100 (see calculation space_share_utilization)"
    error_id: ERR_SPACE_SHARE_EXCEEDED
    http_status: 422
    applies_to: "POST /space-assignments, POST /space-assignments/{id}/activate"
  - priority: 26
    category: business_temporal
    check: "no two RenovationPhase rows of the same project may overlap as CLOSED intervals [planned_start, planned_end]"
    error_id: ERR_PHASE_WINDOW_OVERLAP
    http_status: 422
    applies_to: "POST /renovation-projects/{id}/phases, POST /renovation-projects/{id}/award"
  - priority: 27
    category: business_temporal
    check: "consecutive phases (by sequence_no) are separated by at least PHASE_BUFFER_DAYS (2) calendar days between the earlier phase's planned_end and the later phase's planned_start"
    error_id: ERR_PHASE_BUFFER_VIOLATION
    http_status: 422
    applies_to: "POST /renovation-projects/{id}/phases, POST /renovation-projects/{id}/award"
  - priority: 28
    category: business_constraint
    check: "phase sequence_no values of a project form the contiguous run 1..N with no gap and no duplicate"
    error_id: ERR_PHASE_SEQUENCE_GAP
    http_status: 422
    applies_to: "POST /renovation-projects/{id}/phases, POST /renovation-projects/{id}/award"
  - priority: 29
    category: business_constraint
    check: "the project has at least one phase, and the phase budgets sum to awarded_cents"
    error_id: ERR_NO_PHASES_DEFINED
    http_status: 422
    applies_to: "POST /renovation-projects/{id}/award"
  - priority: 30
    category: business_constraint
    check: "every phase of the project is in status COMPLETE with a non-null actual_cost_cents"
    error_id: ERR_PHASES_INCOMPLETE
    http_status: 409
    applies_to: "POST /renovation-projects/{id}/substantial-completion"
  - priority: 31
    category: business_constraint
    check: "the package has at least one CommitmentTranche"
    error_id: ERR_NO_TRANCHES_DEFINED
    http_status: 422
    applies_to: "POST /startup-packages/{id}/submit"
  - priority: 32
    category: business_constraint
    check: "sum of the package's tranche amount_cents equals proposed_total_cents exactly (see calculation package_tranche_consistency)"
    error_id: ERR_TRANCHE_SUM_MISMATCH
    http_status: 422
    applies_to: "POST /startup-packages/{id}/submit"
  - priority: 33
    category: business_temporal
    check: "the requested fiscal_year's window has closed - the clock is at or after fiscal_year-07-01T00:00:00Z"
    error_id: ERR_ROLLOVER_FISCAL_YEAR_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /startup-packages/{id}/year-end-rollover"
  - priority: 34
    category: business_constraint
    check: "no tranche of the requested fiscal_year is already in status CARRIED_FORWARD or EXPIRED - the rollover for a year runs at most once"
    error_id: ERR_ROLLOVER_ALREADY_RUN
    http_status: 409
    applies_to: "POST /startup-packages/{id}/year-end-rollover"
  - priority: 35
    category: business_referential
    check: "when departure_intent is INTERNAL_TRANSFER, target_funding_unit_id is present, names an existing DEPARTMENT unit other than the faculty member's current unit, and shares the same parent COLLEGE"
    error_id: ERR_TRANSFER_TARGET_REQUIRED
    http_status: 422
    applies_to: "POST /faculty/{id}/departure-notice"
  - priority: 36
    category: business_temporal
    check: "the clock is at or after the faculty member's departure_effective_on"
    error_id: ERR_SEPARATION_NOT_DUE
    http_status: 409
    applies_to: "POST /faculty/{id}/separate"
  - priority: 37
    category: business_referential
    check: "the superseded package is in negotiation_status ACTIVE, belongs to the same faculty member, and that faculty member is in appointment_status DEPARTURE_NOTICE with departure_intent OUTSIDE_OFFER"
    error_id: ERR_PREDECESSOR_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /startup-packages when package_kind == RETENTION_COUNTEROFFER"
  - priority: 38
    category: business_constraint
    check: "no tranche of the superseded package is in status OBLIGATED"
    error_id: ERR_PREDECESSOR_HAS_OPEN_ENCUMBRANCES
    http_status: 409
    applies_to: "POST /startup-packages/{id}/activate when the package supersedes another"
  - priority: 39
    category: business_constraint
    check: "no tranche of the package is in status OBLIGATED and no EquipmentOrder / StaffAppointment / RenovationProject of the package still holds an encumbrance"
    error_id: ERR_OPEN_ENCUMBRANCES_BLOCK_CLOSEOUT
    http_status: 409
    applies_to: "POST /startup-packages/{id}/close-out (NOT /faculty/{id}/separate, which releases the open encumbrances itself as cascade link 2)"
  - priority: 40
    category: business_fiscal
    check: "proposed_total_cents >= predecessor unspent balance + MIN_NEW_MONEY_CENTS (see calculation retention_recommitment_floor)"
    error_id: ERR_RECOMMITMENT_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /startup-packages when package_kind == RETENTION_COUNTEROFFER"
  - priority: 41
    category: business_fiscal
    check: "each of the three funder units has available_pool_cents >= its cost_share_split of proposed_total_cents"
    error_id: ERR_UNIT_POOL_EXCEEDED
    http_status: 422
    applies_to: "POST /startup-packages/{id}/approve"
  - priority: 42
    category: business_fiscal
    check: "at least one tranche of the required category is OPEN with the clock inside its half-open [available_on, expires_on) window"
    error_id: ERR_NO_OPEN_TRANCHE
    http_status: 422
    applies_to: "POST /equipment-orders/{id}/place, POST /renovation-projects/{id}/award, POST /staff-appointments/{id}/activate, POST /renovation-projects/{id}/substantial-completion"
  - priority: 43
    category: business_fiscal
    check: "the summed available_balance_cents of the eligible tranches is >= the amount to encumber (all-or-nothing; see calculation encumbrance_waterfall)"
    error_id: ERR_INSUFFICIENT_TRANCHE_BALANCE
    http_status: 422
    applies_to: "POST /equipment-orders/{id}/place, POST /renovation-projects/{id}/award, POST /staff-appointments/{id}/activate, POST /renovation-projects/{id}/substantial-completion"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- FundingUnit -------------------------------------------------------
  - method: POST
    path: "/funding-units"
    description: "Register a college, department or dean's-office funding unit and seed its cost-share pool."
    roles: [DeanOffice]
    code: 201
    input: [name, unit_type, "parent_unit_id?", cost_share_pool_cents]
    output: FundingUnit
    side_effects:
      - "initialises reserved_cents, committed_cents, disbursed_cents and refunded_cents to 0"
      - "sets available_pool_cents = cost_share_pool_cents"
  - method: GET
    path: "/funding-units"
    description: "List funding units, optionally filtered by parent unit or type. Reverse-reachability list for FundingUnit.parent_unit_id."
    roles: [DeanOffice, Dean, DepartmentChair]
    code: 200
    input: ["parent_unit_id?", "unit_type?", "limit?", "offset?"]
    output: FundingUnit[]
    side_effects: []
  - method: GET
    path: "/funding-units/{id}"
    description: "Read one funding unit including its live pool arithmetic."
    roles: [DeanOffice, Dean, DepartmentChair]
    code: 200
    input: []
    output: FundingUnit
    side_effects: []
  - method: GET
    path: "/funding-units/{id}/faculty"
    description: "List the faculty whose home unit is this funding unit. Reverse-reachability list for Faculty.funding_unit_id."
    roles: [DeanOffice, Dean, DepartmentChair]
    code: 200
    input: ["appointment_status?", "limit?", "offset?"]
    output: Faculty[]
    side_effects: []

  # --- Faculty -----------------------------------------------------------
  - method: POST
    path: "/faculty"
    description: "Create a faculty record for a candidate under recruitment."
    roles: [DeanOffice]
    code: 201
    input: [full_name, rank, funding_unit_id, planned_start_date]
    output: Faculty
    side_effects:
      - "sets appointment_status = CANDIDATE and retention_round = 0"
  - method: POST
    path: "/faculty/{id}/activate"
    description: "Record the faculty member's arrival on campus."
    roles: [DeanOffice]
    code: 200
    input: []
    output: Faculty
    side_effects:
      - "appointment_status CANDIDATE -> ACTIVE"
      - "stamps activated_on from the logical clock"
  - method: POST
    path: "/faculty/{id}/departure-notice"
    description: "Record a resignation, an internal transfer, or an outside offer that opens a retention negotiation. Freezes package spending."
    roles: [DeanOffice]
    code: 200
    input: [departure_intent, departure_effective_on, "target_funding_unit_id?"]
    output: Faculty
    side_effects:
      - "appointment_status ACTIVE -> DEPARTURE_NOTICE"
      - "cascade: every ACTIVE StartupPackage of this faculty moves spend_status SPENDING -> FROZEN"
      - "cascade: every REQUESTED EquipmentOrder of those packages moves to CANCELLED"
      - "cascade: every PROPOSED StaffAppointment of those packages moves to CANCELLED"
  - method: POST
    path: "/faculty/{id}/separate"
    description: "Settle the faculty member's departure or internal transfer: recapture unspent balances, release space, dispose of equipment."
    roles: [DeanOffice]
    code: 200
    input: []
    output: Faculty
    side_effects:
      - "appointment_status DEPARTURE_NOTICE -> DEPARTED or TRANSFERRED_INTERNAL by departure_intent"
      - "runs calculation separation_settlement in the matching variant and sets settlement_variant on the package"
      - "writes RECAPTURE SpendTransaction rows and moves the drained tranches to RECAPTURED"
      - "package spend_status FROZEN -> SETTLED and negotiation_status ACTIVE -> CLOSED_OUT"
      - "releases every ACTIVE SpaceAssignment of the faculty member and re-derives LabSpace.status"
      - "sets transfer_disposition on every INSTALLED EquipmentOrder of the package"
      - "unwinds reserved_cents on the three funder units and, for INTERNAL_TRANSFER, credits the receiving unit's pool"
  - method: GET
    path: "/faculty"
    description: "List faculty, optionally filtered by home unit, transfer target or appointment status. Reverse-reachability list for Faculty.funding_unit_id and Faculty.target_funding_unit_id."
    roles: [DeanOffice, Dean, DepartmentChair]
    code: 200
    input: ["funding_unit_id?", "target_funding_unit_id?", "appointment_status?", "limit?", "offset?"]
    output: Faculty[]
    side_effects: []
  - method: GET
    path: "/faculty/{id}"
    description: "Read one faculty record."
    roles: [DeanOffice, Dean, DepartmentChair, Faculty]
    code: 200
    input: []
    output: Faculty
    side_effects: []

  # --- StartupPackage: negotiation ---------------------------------------
  - method: POST
    path: "/startup-packages"
    description: "Draft a startup package (INITIAL) or a retention counteroffer (RETENTION_COUNTEROFFER) for a faculty member."
    roles: [DeanOffice]
    code: 201
    input: [faculty_id, package_kind, "superseded_package_id?", dean_unit_id, dept_share_pct, college_share_pct, dean_share_pct, proposed_total_cents, spend_deadline_on]
    output: StartupPackage
    side_effects:
      - "derives department_unit_id from Faculty.funding_unit_id and college_unit_id from that unit's parent_unit_id"
      - "sets negotiation_status = DRAFT, spend_status = NOT_YET_AVAILABLE, negotiation_round = 1"
      - "for RETENTION_COUNTEROFFER: validates retention_recommitment_floor against the predecessor and sets Faculty.retention_round = predecessor rounds + 1"
  - method: POST
    path: "/startup-packages/{id}/tranches"
    description: "Schedule one multi-year commitment tranche of the package (category x fiscal year) with its expiration and carryforward policy."
    roles: [DeanOffice]
    code: 201
    input: [category, fiscal_year, amount_cents, available_on, expires_on, carryforward_policy, "carryforward_cap_pct?"]
    output: CommitmentTranche
    side_effects:
      - "sets status = SCHEDULED and available_balance_cents = amount_cents"
      - "defaults carryforward_cap_pct to 0 when carryforward_policy != CAPPED"
      - "re-runs calculation package_spend_rollup on the package"
  - method: DELETE
    path: "/startup-packages/{id}/tranches/{tranche_id}"
    description: "Withdraw a still-SCHEDULED tranche from a package that is back in DRAFT, so a countered package can be re-submitted at a genuinely lower total."
    roles: [DeanOffice]
    code: 204
    input: []
    output: null
    side_effects:
      - "allowed only while StartupPackage.negotiation_status == DRAFT (else ERR_PACKAGE_STATE_INVALID) and CommitmentTranche.status == SCHEDULED (else ERR_SPEND_ITEM_STATE_INVALID); a tranche that has ever been OPEN carries ledger rows and can never be deleted"
      - "hard-deletes the CommitmentTranche row"
      - "re-runs calculation package_spend_rollup on the package"
  - method: POST
    path: "/startup-packages/{id}/submit"
    description: "Submit the drafted package to the department chair for endorsement."
    roles: [DeanOffice]
    code: 200
    input: []
    output: StartupPackage
    side_effects:
      - "negotiation_status DRAFT -> SUBMITTED"
      - "records proposed_by_user_id = X-User-ID"
      - "increments StartupPackage.version by 1"
  - method: POST
    path: "/startup-packages/{id}/endorse"
    description: "Department chair endorses the submitted package and forwards it to the dean."
    roles: [DepartmentChair]
    code: 200
    input: []
    output: StartupPackage
    side_effects:
      - "negotiation_status SUBMITTED -> DEAN_REVIEW"
      - "records endorsed_by_user_id = X-User-ID"
      - "increments StartupPackage.version by 1"
  - method: POST
    path: "/startup-packages/{id}/counter"
    description: "Dean counters the package with a lower total, voiding the endorsement and reopening the negotiation cycle."
    roles: [Dean]
    code: 200
    input: [counter_total_cents]
    output: StartupPackage
    side_effects:
      - "negotiation_status DEAN_REVIEW -> COUNTERED"
      - "sets counter_total_cents and clears endorsed_by_user_id"
      - "increments StartupPackage.version by 1"
  - method: POST
    path: "/startup-packages/{id}/revise"
    description: "Dean's office revises the countered package total and returns it to DRAFT for the next negotiation round."
    roles: [DeanOffice]
    code: 200
    input: [revised_total_cents]
    output: StartupPackage
    side_effects:
      - "negotiation_status COUNTERED -> DRAFT"
      - "sets proposed_total_cents = revised_total_cents, increments negotiation_round, clears proposed_by_user_id"
      - "increments StartupPackage.version by 1"
  - method: POST
    path: "/startup-packages/{id}/approve"
    description: "Dean approves the package, reserving each funder unit's cost share against its pool."
    roles: [Dean]
    code: 200
    input: []
    output: StartupPackage
    side_effects:
      - "negotiation_status DEAN_REVIEW -> APPROVED"
      - "records approved_by_user_id = X-User-ID"
      - "runs calculation cost_share_split on total_committed_cents and raises reserved_cents on the three funder units"
      - "increments StartupPackage.version by 1"
  - method: POST
    path: "/startup-packages/{id}/activate"
    description: "Activate the approved package once the faculty member has arrived: opens the in-window tranches and starts spending."
    roles: [DeanOffice]
    code: 200
    input: []
    output: StartupPackage
    side_effects:
      - "negotiation_status APPROVED -> ACTIVE and spend_status NOT_YET_AVAILABLE -> SPENDING"
      - "every SCHEDULED tranche whose half-open [available_on, expires_on) window contains the clock -> OPEN"
      - "for a RETENTION_COUNTEROFFER: supersedes the predecessor package, rolling its unspent balances forward per category and returning Faculty.appointment_status DEPARTURE_NOTICE -> ACTIVE"
      - "increments StartupPackage.version by 1"
  - method: POST
    path: "/startup-packages/{id}/year-end-rollover"
    description: "Close a fiscal year on the package: obligate tranches with open encumbrances, carry eligible balances forward, expire the rest."
    roles: [DeanOffice, Dean]
    code: 200
    input: [fiscal_year]
    output: StartupPackage
    side_effects:
      - "runs calculation year_end_rollover in its pinned six-step order"
      - "writes CARRYFORWARD_OUT / CARRYFORWARD_IN / EXPIRY SpendTransaction rows"
      - "moves the year's tranches to OBLIGATED, CARRIED_FORWARD or EXPIRED and opens next-year tranches now in window"
      - "refunds each funder unit's share of every EXPIRY row"
      - "increments StartupPackage.version by 1"
  - method: POST
    path: "/startup-packages/{id}/close-out"
    description: "Close out an active package at the end of its spend window, expiring every residual balance."
    roles: [Dean]
    code: 200
    input: []
    output: StartupPackage
    side_effects:
      - "negotiation_status ACTIVE -> CLOSED_OUT and spend_status -> SETTLED"
      - "expires every residual tranche balance with EXPIRY rows and refunds the funder units"
      - "increments StartupPackage.version by 1"

  # --- StartupPackage: reads --------------------------------------------
  - method: GET
    path: "/startup-packages"
    description: "List startup packages with filters. Reverse-reachability list for StartupPackage.faculty_id, superseded_package_id, department_unit_id, college_unit_id and dean_unit_id."
    roles: [DeanOffice, Dean, DepartmentChair]
    code: 200
    input: ["faculty_id?", "superseded_package_id?", "department_unit_id?", "college_unit_id?", "dean_unit_id?", "negotiation_status?", "spend_status?", "limit?", "offset?"]
    output: StartupPackage[]
    side_effects: []
  - method: GET
    path: "/startup-packages/{id}"
    description: "Read one startup package including its live ledger rollup and version."
    roles: [DeanOffice, Dean, DepartmentChair, Faculty]
    code: 200
    input: []
    output: StartupPackage
    side_effects: []
  - method: GET
    path: "/startup-packages/{id}/tranches"
    description: "List the package's commitment tranches. Reverse-reachability list for CommitmentTranche.package_id."
    roles: [DeanOffice, Dean, DepartmentChair, Faculty]
    code: 200
    input: ["category?", "fiscal_year?", "status?", "limit?", "offset?"]
    output: CommitmentTranche[]
    side_effects: []
  - method: GET
    path: "/startup-packages/{id}/staff-appointments"
    description: "List the package's lab staff and graduate appointments. Reverse-reachability list for StaffAppointment.package_id."
    roles: [DeanOffice, Dean, DepartmentChair, Faculty]
    code: 200
    input: ["status?", "appointment_type?", "limit?", "offset?"]
    output: StaffAppointment[]
    side_effects: []
  - method: GET
    path: "/startup-packages/{id}/spend-transactions"
    description: "List the package's immutable ledger rows in creation order. Reverse-reachability list for SpendTransaction.package_id."
    roles: [DeanOffice, Dean, DepartmentChair, Faculty]
    code: 200
    input: ["kind?", "source_kind?", "limit?", "offset?"]
    output: SpendTransaction[]
    side_effects: []
  - method: GET
    path: "/startup-packages/{id}/spend-summary"
    description: "Computed read: the package's spend-down position, per-funder totals and the tranche balance identity."
    roles: [DeanOffice, Dean, DepartmentChair, Faculty]
    code: 200
    input: []
    output: { total_committed_cents: integer, total_encumbered_cents: integer, total_disbursed_cents: integer, total_available_cents: integer, total_expired_cents: integer, total_recaptured_cents: integer, total_carried_out_cents: integer, total_carried_in_cents: integer, spend_down_ratio: number, dept_share_cents: integer, college_share_cents: integer, dean_share_cents: integer, balance_identity_holds: boolean }
    side_effects: []
  - method: GET
    path: "/commitment-tranches/{id}"
    description: "Read one commitment tranche including its full balance breakdown."
    roles: [DeanOffice, Dean, DepartmentChair, Faculty]
    code: 200
    input: []
    output: CommitmentTranche
    side_effects: []
  - method: GET
    path: "/commitment-tranches/{id}/spend-transactions"
    description: "List the ledger rows posted against one tranche. Reverse-reachability list for SpendTransaction.tranche_id."
    roles: [DeanOffice, Dean, DepartmentChair, Faculty]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: SpendTransaction[]
    side_effects: []

  # --- LabSpace and SpaceAssignment --------------------------------------
  - method: POST
    path: "/lab-spaces"
    description: "Register a laboratory room in the space inventory with its utility envelope."
    roles: [FacilitiesManager]
    code: 201
    input: [building_code, room_number, net_sq_ft, space_class, power_kw_capacity, chilled_water_available, fume_hood_count, floor_load_psf]
    output: LabSpace
    side_effects:
      - "sets status = AVAILABLE, allocated_share_pct = 0, installed_power_kw = 0.00, installed_fume_hoods = 0"
      - "rejects a duplicate building_code + room_number with ERR_SPACE_ALREADY_REGISTERED"
  - method: GET
    path: "/lab-spaces"
    description: "List laboratory rooms with their live occupancy and utility headroom."
    roles: [FacilitiesManager, DeanOffice, Dean, DepartmentChair]
    code: 200
    input: ["building_code?", "space_class?", "status?", "limit?", "offset?"]
    output: LabSpace[]
    side_effects: []
  - method: GET
    path: "/lab-spaces/{id}"
    description: "Read one laboratory room including allocated_share_pct and installed utility load."
    roles: [FacilitiesManager, DeanOffice, Dean, DepartmentChair]
    code: 200
    input: []
    output: LabSpace
    side_effects: []
  - method: POST
    path: "/lab-spaces/{id}/utility-upgrade"
    description: "Raise a room's utility envelope after an infrastructure upgrade, unblocking equipment that the room could not previously support."
    roles: [FacilitiesManager]
    code: 200
    input: [power_kw_capacity, fume_hood_count, chilled_water_available, floor_load_psf]
    output: LabSpace
    side_effects:
      - "each supplied capacity must be >= the room's currently installed load (power_kw_capacity >= installed_power_kw, fume_hood_count >= installed_fume_hoods) and chilled_water_available may not be withdrawn while any INSTALLED EquipmentOrder in the room requires it, else ERR_VALIDATION"
      - "overwrites the four envelope fields; installed_power_kw and installed_fume_hoods are untouched"
      - "does NOT change LabSpace.status"
      - "increments LabSpace.version by 1"
  - method: POST
    path: "/space-assignments"
    description: "Propose a share of a laboratory room to a faculty member for a half-open effective window. Guarded by the room's version."
    roles: [DeanOffice]
    code: 201
    input: [space_id, faculty_id, share_pct, effective_from, "effective_to?", expected_space_version]
    output: SpaceAssignment
    side_effects:
      - "sets status = PROPOSED; a null effective_to means an open-ended window"
      - "runs calculation space_share_utilization over overlapping PROPOSED/ACTIVE assignments"
      - "recomputes LabSpace.allocated_share_pct"
      - "increments LabSpace.version by 1"
      - "increments SpaceAssignment.version by 1"
  - method: POST
    path: "/space-assignments/{id}/activate"
    description: "Facilities activates a proposed room assignment once the room is ready."
    roles: [FacilitiesManager]
    code: 200
    input: []
    output: SpaceAssignment
    side_effects:
      - "status PROPOSED -> ACTIVE"
      - "LabSpace AVAILABLE -> ASSIGNED when the window contains the clock; allocated_share_pct recomputed"
      - "increments SpaceAssignment.version by 1"
  - method: POST
    path: "/space-assignments/{id}/release"
    description: "Release an active room assignment, closing its window at the release instant."
    roles: [FacilitiesManager]
    code: 200
    input: [released_on]
    output: SpaceAssignment
    side_effects:
      - "status ACTIVE -> RELEASED; effective_to = released_on (exclusive)"
      - "LabSpace ASSIGNED -> AVAILABLE when allocated_share_pct reaches 0"
      - "increments SpaceAssignment.version by 1"
  - method: GET
    path: "/space-assignments"
    description: "List room assignments. Reverse-reachability list for SpaceAssignment.space_id and SpaceAssignment.faculty_id."
    roles: [FacilitiesManager, DeanOffice, Dean, DepartmentChair]
    code: 200
    input: ["space_id?", "faculty_id?", "status?", "limit?", "offset?"]
    output: SpaceAssignment[]
    side_effects: []
  - method: GET
    path: "/space-assignments/{id}"
    description: "Read one room assignment."
    roles: [FacilitiesManager, DeanOffice, Dean, DepartmentChair, Faculty]
    code: 200
    input: []
    output: SpaceAssignment
    side_effects: []

  # --- RenovationProject and RenovationPhase -----------------------------
  - method: POST
    path: "/renovation-projects"
    description: "Open a renovation project scoping a laboratory room against a package's RENOVATION tranches."
    roles: [FacilitiesManager]
    code: 201
    input: [package_id, space_id, scope_tier, estimate_cents]
    output: RenovationProject
    side_effects:
      - "sets status = SCOPING and rescope_count = 0"
  - method: POST
    path: "/renovation-projects/{id}/phases"
    description: "Add one construction phase to the project's sequence, validated for ordering, closed-interval overlap and changeover buffer."
    roles: [FacilitiesManager]
    code: 201
    input: [sequence_no, name, planned_start, planned_end, budget_cents]
    output: RenovationPhase
    side_effects:
      - "sets status = PENDING"
      - "runs calculation renovation_phase_sequencing over every phase of the project"
  - method: POST
    path: "/renovation-projects/{id}/solicit-bids"
    description: "Send the scoped project out to bid."
    roles: [FacilitiesManager]
    code: 200
    input: []
    output: RenovationProject
    side_effects:
      - "status SCOPING -> BID"
      - "increments RenovationProject.version by 1"
  - method: POST
    path: "/renovation-projects/{id}/rescope"
    description: "Return a project out to bid back to scoping with a revised estimate and scope tier."
    roles: [FacilitiesManager]
    code: 200
    input: [revised_estimate_cents, scope_tier]
    output: RenovationProject
    side_effects:
      - "status BID -> SCOPING; rescope_count += 1"
      - "replaces estimate_cents and scope_tier"
      - "increments RenovationProject.version by 1"
  - method: POST
    path: "/renovation-projects/{id}/award"
    description: "Dean awards the construction contract, computing the college subsidy estimate and encumbering the package's share."
    roles: [Dean]
    code: 200
    input: [awarded_cents]
    output: RenovationProject
    side_effects:
      - "status BID -> AWARDED; awarded_on = clock"
      - "runs renovation_cost_allocation variant SCOPE_ESTIMATE"
      - "runs encumbrance_waterfall for package_charge_estimate_cents over RENOVATION tranches"
      - "LabSpace status -> UNDER_RENOVATION"
      - "increments RenovationProject.version by 1"
  - method: POST
    path: "/renovation-projects/{id}/phases/{phase_id}/start"
    description: "Start a pending construction phase; enforces the sequencing chain."
    roles: [FacilitiesManager]
    code: 200
    input: []
    output: RenovationPhase
    side_effects:
      - "phase status PENDING -> ACTIVE; actual_start = clock"
      - "project AWARDED -> IN_PROGRESS on the sequence_no == 1 phase"
      - "increments RenovationPhase.version by 1"
  - method: POST
    path: "/renovation-projects/{id}/phases/{phase_id}/complete"
    description: "Complete an active construction phase and record its actual cost."
    roles: [FacilitiesManager]
    code: 200
    input: [actual_cost_cents]
    output: RenovationPhase
    side_effects:
      - "phase status ACTIVE -> COMPLETE; actual_end = clock"
      - "increments RenovationPhase.version by 1"
  - method: POST
    path: "/renovation-projects/{id}/substantial-completion"
    description: "Close the project: reconcile the final subsidy against the estimate and settle the ledger."
    roles: [FacilitiesManager]
    code: 200
    input: []
    output: RenovationProject
    side_effects:
      - "status IN_PROGRESS -> COMPLETED; completed_on = clock"
      - "runs renovation_cost_allocation variant FINAL_ACTUAL and reconciles cost_variance_cents"
      - "settles the award encumbrances with DISBURSEMENT / RELEASE rows and encumbers-then-disburses any overrun"
      - "LabSpace UNDER_RENOVATION -> ASSIGNED, promoting in-window PROPOSED assignments to ACTIVE"
      - "increments RenovationProject.version by 1"
  - method: GET
    path: "/renovation-projects"
    description: "List renovation projects. Reverse-reachability list for RenovationProject.package_id and RenovationProject.space_id."
    roles: [FacilitiesManager, DeanOffice, Dean, DepartmentChair]
    code: 200
    input: ["package_id?", "space_id?", "status?", "scope_tier?", "limit?", "offset?"]
    output: RenovationProject[]
    side_effects: []
  - method: GET
    path: "/renovation-projects/{id}"
    description: "Read one renovation project including both variants of its cost allocation."
    roles: [FacilitiesManager, DeanOffice, Dean, DepartmentChair, Faculty]
    code: 200
    input: []
    output: RenovationProject
    side_effects: []
  - method: GET
    path: "/renovation-projects/{id}/phases"
    description: "List the project's construction phases in sequence order. Reverse-reachability list for RenovationPhase.project_id."
    roles: [FacilitiesManager, DeanOffice, Dean, DepartmentChair, Faculty]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RenovationPhase[]
    side_effects: []

  # --- EquipmentOrder ----------------------------------------------------
  - method: POST
    path: "/equipment-orders"
    description: "Request a piece of laboratory equipment against the package, declaring the room it will be installed in and its utility demands."
    roles: [DeanOffice, Faculty]
    code: 201
    input: [package_id, install_space_id, vendor_name, item_description, quoted_cents, lead_time_days, required_power_kw, requires_chilled_water, required_fume_hoods, required_floor_load_psf]
    output: EquipmentOrder
    side_effects:
      - "sets status = REQUESTED with no ledger movement"
  - method: POST
    path: "/equipment-orders/{id}/place"
    description: "Place the purchase order with the vendor, encumbering the quote against the package's EQUIPMENT tranches. Guarded by the package's version."
    roles: [DeanOffice]
    code: 200
    input: [expected_package_version]
    output: EquipmentOrder
    side_effects:
      - "status REQUESTED -> ORDERED; placed_on = clock; expected_delivery_on = clock + lead_time_days days"
      - "runs encumbrance_waterfall for quoted_cents over EQUIPMENT tranches with one ENCUMBRANCE row per tranche consumed"
      - "raises each funder unit's committed_cents by its stored share"
      - "increments StartupPackage.version by 1"
      - "increments EquipmentOrder.version by 1"
  - method: POST
    path: "/equipment-orders/{id}/receive"
    description: "Record delivery of the ordered item; the encumbrance stays open until installation."
    roles: [FacilitiesManager]
    code: 200
    input: []
    output: EquipmentOrder
    side_effects:
      - "status ORDERED -> DELIVERED; delivered_on = clock"
      - "increments EquipmentOrder.version by 1"
  - method: POST
    path: "/equipment-orders/{id}/install"
    description: "Attempt installation in the assigned room. Branches to INSTALLED when the room's utilities suffice, otherwise to UTILITY_BLOCKED with the first failing reason."
    roles: [FacilitiesManager]
    code: 200
    input: []
    output: EquipmentOrder
    side_effects:
      - "runs calculation equipment_utility_feasibility in its pinned check order"
      - "on pass: status -> INSTALLED, installed_on = clock, the open encumbrances are disbursed, LabSpace installed_power_kw / installed_fume_hoods rise"
      - "on fail: status -> UTILITY_BLOCKED with utility_block_reason set, no ledger movement, room untouched"
      - "increments EquipmentOrder.version by 1"
  - method: POST
    path: "/equipment-orders/{id}/cancel"
    description: "Cancel the order, compensating any open encumbrance by copying its stored per-funder split into RELEASE rows."
    roles: [DeanOffice]
    code: 200
    input: []
    output: EquipmentOrder
    side_effects:
      - "status -> CANCELLED from REQUESTED, ORDERED, DELIVERED or UTILITY_BLOCKED"
      - "one RELEASE row per open ENCUMBRANCE row, each mirroring the stored split of the row it reverses"
      - "released cents against an OBLIGATED tranche are immediately expired"
      - "lowers each funder unit's committed_cents by the stored shares"
      - "increments EquipmentOrder.version by 1"
  - method: GET
    path: "/equipment-orders"
    description: "List equipment orders. Reverse-reachability list for EquipmentOrder.package_id and EquipmentOrder.install_space_id."
    roles: [DeanOffice, FacilitiesManager, Dean, DepartmentChair]
    code: 200
    input: ["package_id?", "install_space_id?", "status?", "utility_block_reason?", "limit?", "offset?"]
    output: EquipmentOrder[]
    side_effects: []
  - method: GET
    path: "/equipment-orders/{id}"
    description: "Read one equipment order including its encumbered and disbursed amounts."
    roles: [DeanOffice, FacilitiesManager, Dean, DepartmentChair, Faculty]
    code: 200
    input: []
    output: EquipmentOrder
    side_effects: []

  # --- StaffAppointment --------------------------------------------------
  - method: POST
    path: "/staff-appointments"
    description: "Propose a lab manager, postdoc, graduate research assistant or technician appointment against the package's PERSONNEL tranches."
    roles: [DeanOffice, Faculty]
    code: 201
    input: [package_id, appointment_type, fte, monthly_cost_cents, start_date, end_date]
    output: StaffAppointment
    side_effects:
      - "sets status = PROPOSED and computes committed_months from the inclusive month span"
  - method: POST
    path: "/staff-appointments/{id}/activate"
    description: "Activate the appointment, encumbering its full committed cost against the PERSONNEL tranches."
    roles: [DeanOffice]
    code: 200
    input: []
    output: StaffAppointment
    side_effects:
      - "status PROPOSED -> ACTIVE"
      - "runs calculation staff_encumbrance_rounding then encumbrance_waterfall over PERSONNEL tranches"
      - "raises each funder unit's committed_cents by its stored share"
      - "increments StaffAppointment.version by 1"
  - method: POST
    path: "/staff-appointments/{id}/end"
    description: "End the appointment early or on schedule: disburse the served months and release the remainder."
    roles: [DeanOffice]
    code: 200
    input: [end_date]
    output: StaffAppointment
    side_effects:
      - "status ACTIVE -> ENDED; ended_on = clock"
      - "DISBURSEMENT rows for monthly_charge_cents * months_served and RELEASE rows for the unserved remainder, both copying the stored splits"
      - "released cents against an OBLIGATED tranche are immediately expired"
      - "increments StaffAppointment.version by 1"
  - method: GET
    path: "/staff-appointments/{id}"
    description: "Read one staff appointment including its committed months and encumbrance."
    roles: [DeanOffice, Dean, DepartmentChair, Faculty]
    code: 200
    input: []
    output: StaffAppointment
    side_effects: []

  # --- Test-driving endpoint (last rung of the §1.5 priority ladder) ------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock to any instant, so fiscal-year windows, tranche expirations, lead times and separation dates are deterministic. The clock's startup default is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time before the first call."
    roles: [DeanOffice, Dean, DepartmentChair, FacilitiesManager, Faculty]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime }
    side_effects:
      - "every subsequent clock read returns current_utc until the next call"
      - "no entity is mutated and no tranche is re-evaluated by this call alone; window-dependent state changes happen on the next business call"

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the called endpoint's roles"
  - id: ERR_VALIDATION
    http: 400
    condition: "malformed body, missing required field, bad enum member, negative cent amount, fte outside (0, 1.00], share_pct outside 1..100, or an inverted interval (planned_end < planned_start, effective_to <= effective_from, expires_on <= available_on, end_date < start_date)"
  - id: ERR_SHARE_PCT_SUM_INVALID
    http: 422
    condition: "dept_share_pct + college_share_pct + dean_share_pct != 100 on POST /startup-packages"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "a referenced FundingUnit, SpaceAssignment or RenovationPhase does not exist, or a referenced unit's unit_type does not match the slot it is used in"
  - id: ERR_FACULTY_NOT_FOUND
    http: 404
    condition: "the faculty id in the path or in faculty_id does not exist"
  - id: ERR_PACKAGE_NOT_FOUND
    http: 404
    condition: "the package id in the path, in package_id, or in superseded_package_id does not exist"
  - id: ERR_TRANCHE_NOT_FOUND
    http: 404
    condition: "the commitment tranche id in the path does not exist"
  - id: ERR_SPACE_NOT_FOUND
    http: 404
    condition: "the lab space id in the path, in space_id, or in install_space_id does not exist"
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "the renovation project id in the path does not exist, or phase_id does not belong to that project"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "the equipment order, staff appointment or space assignment id in the path does not exist"
  - id: ERR_UNIT_SCOPE_VIOLATION
    http: 403
    condition: "a DepartmentChair or Dean acts on a package funded by a different unit than its own X-User-ID"
  - id: ERR_FACULTY_SCOPE_VIOLATION
    http: 403
    condition: "a Faculty actor reads or writes a resource owned by a different faculty member"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the endorsing user equals proposed_by_user_id, or the approving user equals proposed_by_user_id or endorsed_by_user_id"
  - id: ERR_STALE_SPACE_VERSION
    http: 412
    condition: "expected_space_version does not equal the current LabSpace.version on POST /space-assignments"
  - id: ERR_STALE_PACKAGE_VERSION
    http: 412
    condition: "expected_package_version does not equal the current StartupPackage.version on POST /equipment-orders/{id}/place"
  - id: ERR_PACKAGE_STATE_INVALID
    http: 409
    condition: "the package's negotiation_status does not permit the requested negotiation or lifecycle action"
  - id: ERR_SPEND_ITEM_STATE_INVALID
    http: 409
    condition: "the equipment order, staff appointment or space assignment is not in a status from which the requested action is declared"
  - id: ERR_RENOVATION_STATE_INVALID
    http: 409
    condition: "the renovation project or phase is not in a status from which the requested action is declared, including starting a phase whose lower-numbered predecessors are not COMPLETE"
  - id: ERR_PACKAGE_SPEND_FROZEN
    http: 409
    condition: "a money-moving action is attempted while the package's spend_status is NOT_YET_AVAILABLE, FROZEN or SETTLED"
  - id: ERR_FACULTY_NOT_ACTIVE
    http: 409
    condition: "the package's faculty member is not in appointment_status ACTIVE when the action requires an arrived, non-departing occupant"
  - id: ERR_SPACE_NOT_ASSIGNED_TO_FACULTY
    http: 422
    condition: "the install space has no ACTIVE SpaceAssignment to the package's faculty member whose half-open window contains the clock"
  - id: ERR_SPACE_NOT_READY_FOR_INSTALL
    http: 409
    condition: "the install space is UNDER_RENOVATION or DECOMMISSIONED rather than ASSIGNED"
  - id: ERR_SPACE_ALREADY_REGISTERED
    http: 409
    condition: "a LabSpace with the same building_code and room_number already exists"
  - id: ERR_SPACE_SHARE_EXCEEDED
    http: 422
    condition: "the candidate assignment's share_pct plus the overlapping PROPOSED/ACTIVE share on the same room exceeds 100"
  - id: ERR_PHASE_WINDOW_OVERLAP
    http: 422
    condition: "two phases of the same project overlap as closed [planned_start, planned_end] intervals"
  - id: ERR_PHASE_BUFFER_VIOLATION
    http: 422
    condition: "consecutive phases are separated by fewer than PHASE_BUFFER_DAYS (2) calendar days"
  - id: ERR_PHASE_SEQUENCE_GAP
    http: 422
    condition: "the project's phase sequence_no values are not the contiguous run 1..N, or a sequence_no is duplicated"
  - id: ERR_NO_PHASES_DEFINED
    http: 422
    condition: "the project has no phases when bids are solicited or the contract is awarded, or the phase budgets do not sum to awarded_cents"
  - id: ERR_PHASES_INCOMPLETE
    http: 409
    condition: "substantial completion is requested while at least one phase is not COMPLETE"
  - id: ERR_NO_TRANCHES_DEFINED
    http: 422
    condition: "the package has no commitment tranche at submit"
  - id: ERR_TRANCHE_SUM_MISMATCH
    http: 422
    condition: "the sum of the package's tranche amount_cents does not equal proposed_total_cents at submit"
  - id: ERR_ROLLOVER_FISCAL_YEAR_NOT_ELAPSED
    http: 409
    condition: "year-end rollover is requested for a fiscal year whose 07-01 boundary the clock has not reached"
  - id: ERR_ROLLOVER_ALREADY_RUN
    http: 409
    condition: "year-end rollover is requested for a fiscal year that already has a CARRIED_FORWARD or EXPIRED tranche"
  - id: ERR_TRANSFER_TARGET_REQUIRED
    http: 422
    condition: "departure_intent is INTERNAL_TRANSFER without a valid target_funding_unit_id in the same college, or a target unit is supplied for a non-transfer intent"
  - id: ERR_SEPARATION_NOT_DUE
    http: 409
    condition: "separation is requested before the clock reaches departure_effective_on"
  - id: ERR_PREDECESSOR_NOT_ELIGIBLE
    http: 422
    condition: "the superseded package is not ACTIVE, belongs to another faculty member, or the faculty member is not in DEPARTURE_NOTICE with departure_intent OUTSIDE_OFFER"
  - id: ERR_PREDECESSOR_HAS_OPEN_ENCUMBRANCES
    http: 409
    condition: "a retention counteroffer is activated while the superseded package still has an OBLIGATED tranche or a non-zero total_encumbered_cents"
  - id: ERR_OPEN_ENCUMBRANCES_BLOCK_CLOSEOUT
    http: 409
    condition: "close-out is requested while the package's total_encumbered_cents is greater than 0 (separation is exempt: it releases the open encumbrances as part of its own cascade)"
  - id: ERR_RECOMMITMENT_BELOW_FLOOR
    http: 422
    condition: "a retention counteroffer's proposed_total_cents is below the predecessor's unspent balance plus MIN_NEW_MONEY_CENTS"
  - id: ERR_UNIT_POOL_EXCEEDED
    http: 422
    condition: "at approval, a funder unit's available_pool_cents is smaller than its cost_share_split of the package total"
  - id: ERR_NO_OPEN_TRANCHE
    http: 422
    condition: "no tranche of the required category is OPEN with the clock inside its half-open [available_on, expires_on) window - the empty-candidate-set edge of the waterfall"
  - id: ERR_INSUFFICIENT_TRANCHE_BALANCE
    http: 422
    condition: "the eligible tranches exist but their summed available_balance_cents is below the amount to encumber - the all-or-nothing edge of the waterfall"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix (segregation of duties)
# ---------------------------------------------------------------------------
roles:
  - name: DeanOffice
    description: "Dean's-office staff who draft startup packages, schedule commitment tranches, propose space, buy equipment, hire lab staff and settle departures. Holds the requester and operator role of the negotiation chain but never approves."
    identity: "opaque"
    exclusive_operations:
      - "POST /funding-units"
      - "POST /faculty"
      - "POST /faculty/{id}/activate"
      - "POST /faculty/{id}/departure-notice"
      - "POST /faculty/{id}/separate"
      - "POST /startup-packages"
      - "POST /startup-packages/{id}/tranches"
      - "DELETE /startup-packages/{id}/tranches/{tranche_id}"
      - "POST /startup-packages/{id}/submit"
      - "POST /startup-packages/{id}/revise"
      - "POST /startup-packages/{id}/activate"
      - "POST /space-assignments"
      - "POST /equipment-orders/{id}/place"
      - "POST /equipment-orders/{id}/cancel"
      - "POST /staff-appointments/{id}/activate"
      - "POST /staff-appointments/{id}/end"
    shared_operations:
      - "POST /startup-packages/{id}/year-end-rollover (with Dean)"
      - "POST /equipment-orders (with Faculty)"
      - "POST /staff-appointments (with Faculty)"
      - "every GET read endpoint"
      - "POST /_clock/set_current_utc"
  - name: DepartmentChair
    description: "Chair of the hiring department. Endorses the submitted package on behalf of the department that carries the departmental cost share, and reads its own unit's packages."
    identity: "entity_backed:FundingUnit"
    exclusive_operations:
      - "POST /startup-packages/{id}/endorse"
    shared_operations:
      - "GET /funding-units, GET /funding-units/{id}, GET /funding-units/{id}/faculty (scoped to its own unit and descendants)"
      - "GET /faculty, GET /faculty/{id}"
      - "GET /startup-packages and the package sub-resource reads (scoped to packages whose department_unit_id is its own id)"
      - "GET /lab-spaces, GET /space-assignments, GET /renovation-projects, GET /equipment-orders, GET /staff-appointments/{id}"
      - "POST /_clock/set_current_utc"
  - name: Dean
    description: "College dean who counters, approves and closes out packages, awards construction contracts and runs the fiscal-year rollover. Cannot draft or endorse, and cannot approve a package it submitted or endorsed."
    identity: "entity_backed:FundingUnit"
    exclusive_operations:
      - "POST /startup-packages/{id}/counter"
      - "POST /startup-packages/{id}/approve"
      - "POST /startup-packages/{id}/close-out"
      - "POST /renovation-projects/{id}/award"
    shared_operations:
      - "POST /startup-packages/{id}/year-end-rollover (with DeanOffice)"
      - "every GET read endpoint (scoped to packages whose college_unit_id is its own id)"
      - "POST /_clock/set_current_utc"
  - name: FacilitiesManager
    description: "Campus facilities operator who maintains the space inventory, activates and releases room assignments, scopes and sequences construction, and receives and installs equipment."
    identity: "opaque"
    exclusive_operations:
      - "POST /lab-spaces"
      - "POST /lab-spaces/{id}/utility-upgrade"
      - "POST /space-assignments/{id}/activate"
      - "POST /space-assignments/{id}/release"
      - "POST /renovation-projects"
      - "POST /renovation-projects/{id}/phases"
      - "POST /renovation-projects/{id}/solicit-bids"
      - "POST /renovation-projects/{id}/rescope"
      - "POST /renovation-projects/{id}/phases/{phase_id}/start"
      - "POST /renovation-projects/{id}/phases/{phase_id}/complete"
      - "POST /renovation-projects/{id}/substantial-completion"
      - "POST /equipment-orders/{id}/receive"
      - "POST /equipment-orders/{id}/install"
    shared_operations:
      - "GET /lab-spaces, GET /lab-spaces/{id}, GET /space-assignments, GET /space-assignments/{id}"
      - "GET /renovation-projects, GET /renovation-projects/{id}, GET /renovation-projects/{id}/phases"
      - "GET /equipment-orders, GET /equipment-orders/{id}"
      - "POST /_clock/set_current_utc"
  - name: Faculty
    description: "The recruited or retained faculty member. May request equipment and propose staff against their own package and read their own package, but may never place an order, activate an appointment or touch any negotiation step."
    identity: "entity_backed:Faculty"
    exclusive_operations: []
    shared_operations:
      - "POST /equipment-orders (with DeanOffice, own package only)"
      - "POST /staff-appointments (with DeanOffice, own package only)"
      - "GET /faculty/{id}, GET /startup-packages/{id}, GET /startup-packages/{id}/tranches, GET /startup-packages/{id}/staff-appointments, GET /startup-packages/{id}/spend-transactions, GET /startup-packages/{id}/spend-summary"
      - "GET /commitment-tranches/{id}, GET /commitment-tranches/{id}/spend-transactions"
      - "GET /space-assignments/{id}, GET /renovation-projects/{id}, GET /renovation-projects/{id}/phases, GET /equipment-orders/{id}, GET /staff-appointments/{id}"
      - "POST /_clock/set_current_utc"
