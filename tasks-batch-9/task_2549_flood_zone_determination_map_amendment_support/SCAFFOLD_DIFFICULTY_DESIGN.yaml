            - "panel 12086C0312K seq 1 EFFECTIVE, zone AE, BFE 7.75, sfha_boundary_shift_ft 0.0, horizontal_uncertainty_ft 0.0 -> buffer_ft = 25 + 0 = 25"
            - "four structures on that property at sfha_offset_ft -25.1, -25.0, +25.0, +25.1"
