  # =====================================================================================
  # RULE 6 — boundary-precision checks on DIFFERENT metrics through DISTINCT endpoints
  #   instance 1: numeric ratio exactly at TIER_2_MAX_RATIO, on POST .../close
  #   instance 2: empty-set edge, on POST .../rooming-lists
  # =====================================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: attrition_tier_boundary_at_shortfall_ratio_exactly_025
        grounds:
          - calculations.attrition_penalty_exposure
          - state_machines.HotelBlock.CUTOFF_PASSED_to_CLOSED
          - entities.HotelBlock.fields.attrition_liability_cents
        distinguishing_aspect: |
          Numeric-threshold boundary on the shortfall ratio, reached through
          POST /housing/hotel-blocks/{id}/close: adjusted contract 8 room nights, actual 4,
          protected round_half_up(8 * 0.80) == 6, shortfall 2, ratio exactly 0.25 == TIER_2_MAX_RATIO,
          so the inclusive <= must select TIER_2_PCT 0.70 and yield 30660 cents; an exclusive < would
          fall through to TIER_3_PCT 0.90 and yield 39420.
        test_recipe:
          setup:
            - "Block of 2 contracted rooms per night over the 4-night window -> contracted_room_nights 8; rate 21900."
            - "APPROVED GENERAL sub-block of 2 rooms; exactly one CONFIRMED 4-night reservation, so realised pickup is 4 room nights and no reduction was ever exercised."
            - "Clock walked to the cutoff (block CUTOFF_PASSED, one unsold room released) and then to the event end date."
          setup_api_calls:
            - call: "POST /housing/events"
              payload: { name: "Annual Summit", code: "SUM26", event_start_date: "2026-09-14", event_end_date: "2026-09-18", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
              as: BureauCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /housing/hotels"
              payload: { name: "Grand Plaza", distance_to_venue_miles: 0.3, room_tax_pct: 0.1475, total_rooms: 400 }
              as: BureauCoordinator
              captures: { hotel_id: $.data.id }
            - call: "POST /housing/hotel-blocks"
              payload: { event_id: "${event_id}", hotel_id: "${hotel_id}", contracted_rooms_per_night: 2, negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.50 }
              as: BureauCoordinator
              captures: { block_id: $.data.id, block_v1: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/terms"
              payload: { negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.50, expected_hotel_block_version: "${block_v1}" }
              as: BureauCoordinator
              captures: { block_v2: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/contract"
              payload: { confirmation_number: "CN-SUM26-004" }
              as: HotelManager
              as_user_id: "${hotel_id}"
              captures: { block_v3: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/sub-blocks"
              payload: { segment: "GENERAL", allotted_rooms: 2, expected_hotel_block_version: "${block_v3}" }
              as: BureauCoordinator
              as_user_id: "coord-1"
              captures: { gen_sb_id: $.data.id }
            - call: "POST /housing/hotel-blocks/${block_id}/open"
              payload: {}
              as: BureauCoordinator
            - call: "POST /housing/attendees"
              payload: { event_id: "${event_id}", email: "a1@example.com", full_name: "Attendee One", registration_id: "REG-1", attendee_type: "GENERAL" }
              as: BureauCoordinator
              captures: { att1_id: $.data.id }
            - call: "POST /housing/reservations"
              payload: { sub_block_id: "${gen_sb_id}", attendee_id: "${att1_id}", check_in_date: "2026-09-14", check_out_date: "2026-09-18", occupants: 1 }
              as: Attendee
              as_user_id: "${att1_id}"
              captures: { res1_id: $.data.id }
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T00:00:00Z" }
              as: BureauCoordinator
            - call: "POST /housing/hotel-blocks/${block_id}/cutoff"
              payload: {}
              as: BureauCoordinator
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-18T00:00:00Z" }
              as: BureauCoordinator
          trigger:
            - call: "POST /housing/hotel-blocks/${block_id}/close"
              payload: {}
              as: BureauCoordinator
          assert:
            - "HotelBlock.${block_id}.status == CLOSED"
            - "HotelBlock.${block_id}.contracted_rooms_per_night == 2"
            - "HotelBlock.${block_id}.attrition_liability_cents == 30660"
            - "HotelBlock.${block_id}.attrition_liability_cents != 39420"
            - "SubBlock.${gen_sb_id}.allotted_rooms == 1"
            - "HotelBlock.${block_id}.released_rooms_per_night == 1"

      - name: rooming_list_with_empty_transmission_set_rejected
        grounds:
          - calculations.rooming_list_transmission_set
          - validations[priority=92]
          - errors[ERR_NO_TRANSMITTABLE_RESERVATIONS]
        distinguishing_aspect: |
          A different metric — the empty-collection edge, not a numeric threshold — reached through a
          different endpoint, POST /housing/hotel-blocks/{id}/rooming-lists: the block is OPEN with an
          APPROVED sub-block but zero reservations, so the transmission set has count 0 and the call
          must fail with ERR_NO_TRANSMITTABLE_RESERVATIONS instead of creating a batch of size 0.
        test_recipe:
          setup:
            - "OPEN block with one APPROVED GENERAL sub-block of 6 rooms and no reservations at all."
            - "No prior RoomingListTransmission exists, so INITIAL is the type-correct request and only the empty-set rule can fire."
          setup_api_calls:
            - call: "POST /housing/events"
              payload: { name: "Annual Summit", code: "SUM26", event_start_date: "2026-09-14", event_end_date: "2026-09-18", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
              as: BureauCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /housing/hotels"
              payload: { name: "Grand Plaza", distance_to_venue_miles: 0.3, room_tax_pct: 0.1475, total_rooms: 400 }
              as: BureauCoordinator
              captures: { hotel_id: $.data.id }
            - call: "POST /housing/hotel-blocks"
              payload: { event_id: "${event_id}", hotel_id: "${hotel_id}", contracted_rooms_per_night: 10, negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20 }
              as: BureauCoordinator
              captures: { block_id: $.data.id, block_v1: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/terms"
              payload: { negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20, expected_hotel_block_version: "${block_v1}" }
              as: BureauCoordinator
              captures: { block_v2: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/contract"
              payload: { confirmation_number: "CN-SUM26-001" }
              as: HotelManager
              as_user_id: "${hotel_id}"
              captures: { block_v3: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/sub-blocks"
              payload: { segment: "GENERAL", allotted_rooms: 6, expected_hotel_block_version: "${block_v3}" }
              as: BureauCoordinator
              as_user_id: "coord-1"
              captures: { gen_sb_id: $.data.id }
            - call: "POST /housing/hotel-blocks/${block_id}/open"
              payload: {}
              as: BureauCoordinator
          trigger:
            - call: "POST /housing/hotel-blocks/${block_id}/rooming-lists"
              payload: { transmission_type: "INITIAL" }
              as: BureauCoordinator
          assert:
            - "response HTTP status == 422"
            - "response.data.error_id == ERR_NO_TRANSMITTABLE_RESERVATIONS"
            - "GET /housing/hotel-blocks/${block_id}/rooming-lists returns total_count == 0"

  # =====================================================================================
  # RULE 7 — cross-entity state dependencies across DIFFERENT entity pairs
  #   instance 1: HotelBlock depends on Hotel.standing
  #   instance 2: HotelBlock depends on SubBlock.approval_status
  # =====================================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: block_contract_blocked_by_suspended_hotel_standing
        grounds:
          - state_machines.HotelBlock.TERMS_SUBMITTED_to_CONTRACTED
          - entities.Hotel.fields.standing
          - validations[priority=52]
          - errors[ERR_HOTEL_SUSPENDED]
        distinguishing_aspect: |
          Entity pair HotelBlock -> Hotel: the block sits in the legal TERMS_SUBMITTED state with
          fully standardized terms, and the ONLY thing refusing the contract transition is the
          other entity's state, Hotel.standing == SUSPENDED; reinstating the hotel to ACTIVE makes
          the identical call succeed.
        test_recipe:
          setup:
            - "One event with standard_commission_pct 0.10, standard_rebate_per_room_night_cents 500 and cutoff_date 2026-08-21."
            - "One hotel, initially ACTIVE, then suspended by the bureau."
            - "One block whose submitted terms already satisfy standardization (commission 0.12 >= 0.10, rebate 700 >= 500, cutoff equal), so no ERR_TERMS_NOT_STANDARDIZED is possible."
          setup_api_calls:
            - call: "POST /housing/events"
              payload: { name: "Annual Summit", code: "SUM26", event_start_date: "2026-09-14", event_end_date: "2026-09-18", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
              as: BureauCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /housing/hotels"
              payload: { name: "Grand Plaza", distance_to_venue_miles: 0.3, room_tax_pct: 0.1475, total_rooms: 400, standing: "ACTIVE" }
              as: BureauCoordinator
              captures: { hotel_id: $.data.id }
            - call: "POST /housing/hotel-blocks"
              payload: { event_id: "${event_id}", hotel_id: "${hotel_id}", contracted_rooms_per_night: 10, negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20 }
              as: BureauCoordinator
              captures: { block_id: $.data.id, block_v1: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/terms"
              payload: { negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20, expected_hotel_block_version: "${block_v1}" }
              as: BureauCoordinator
              captures: { block_v2: $.data.version }
            - call: "PATCH /housing/hotels/${hotel_id}/standing"
              payload: { standing: "SUSPENDED" }
              as: BureauCoordinator
          trigger:
            - call: "POST /housing/hotel-blocks/${block_id}/contract"
              payload: { confirmation_number: "CN-SUM26-005" }
              as: HotelManager
              as_user_id: "${hotel_id}"
            - call: "PATCH /housing/hotels/${hotel_id}/standing"
              payload: { standing: "ACTIVE" }
              as: BureauCoordinator
            - call: "POST /housing/hotel-blocks/${block_id}/contract"
              payload: { confirmation_number: "CN-SUM26-005" }
              as: HotelManager
              as_user_id: "${hotel_id}"
          assert:
            - "first contract attempt returns HTTP 409 with response.data.error_id == ERR_HOTEL_SUSPENDED"
            - "after the first attempt HotelBlock.${block_id}.status == TERMS_SUBMITTED and HotelBlock.${block_id}.version == ${block_v2}"
            - "second contract attempt returns HTTP 200"
            - "HotelBlock.${block_id}.status == CONTRACTED"
            - "HotelBlock.${block_id}.unassigned_rooms_per_night == 10"
            - "HotelBlock.${block_id}.original_contracted_rooms_per_night == 10"
            - "HotelBlock.${block_id}.confirmation_number == CN-SUM26-005"

      - name: block_open_gated_on_sub_block_approval_state
        grounds:
          - state_machines.HotelBlock.CONTRACTED_to_OPEN
          - state_machines.SubBlock.PENDING_APPROVAL_to_APPROVED
          - validations[priority=52]
          - errors[ERR_NO_APPROVED_SUB_BLOCK]
        distinguishing_aspect: |
          A different entity pair, HotelBlock -> SubBlock: the CONTRACTED block cannot open while its
          only VIP sub-block is still PENDING_APPROVAL (ERR_NO_APPROVED_SUB_BLOCK), and the
          controller's approval of the child — not any change on the block itself — is what unlocks
          the identical open call.
        test_recipe:
          setup:
            - "One CONTRACTED block of 10 rooms per night whose only carve is a VIP sub-block of 4 rooms with eligibility code VIP-GOLD, carved by coord-1 and left PENDING_APPROVAL."
            - "Clock at the default 2026-08-01, well before the 2026-08-21 cutoff, so no cutoff rule can interfere."
          setup_api_calls:
            - call: "POST /housing/events"
              payload: { name: "Annual Summit", code: "SUM26", event_start_date: "2026-09-14", event_end_date: "2026-09-18", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
              as: BureauCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /housing/hotels"
              payload: { name: "Grand Plaza", distance_to_venue_miles: 0.3, room_tax_pct: 0.1475, total_rooms: 400 }
              as: BureauCoordinator
              captures: { hotel_id: $.data.id }
            - call: "POST /housing/hotel-blocks"
              payload: { event_id: "${event_id}", hotel_id: "${hotel_id}", contracted_rooms_per_night: 10, negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20 }
              as: BureauCoordinator
              captures: { block_id: $.data.id, block_v1: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/terms"
              payload: { negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20, expected_hotel_block_version: "${block_v1}" }
              as: BureauCoordinator
              captures: { block_v2: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/contract"
              payload: { confirmation_number: "CN-SUM26-006" }
              as: HotelManager
              as_user_id: "${hotel_id}"
              captures: { block_v3: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/sub-blocks"
              payload: { segment: "VIP", allotted_rooms: 4, eligibility_code: "VIP-GOLD", expected_hotel_block_version: "${block_v3}" }
              as: BureauCoordinator
              as_user_id: "coord-1"
              captures: { vip_sb_id: $.data.id }
          trigger:
            - call: "POST /housing/hotel-blocks/${block_id}/open"
              payload: {}
              as: BureauCoordinator
            - call: "POST /housing/sub-blocks/${vip_sb_id}/approve"
              payload: {}
              as: BureauController
              as_user_id: "ctrl-1"
            - call: "POST /housing/hotel-blocks/${block_id}/open"
              payload: {}
              as: BureauCoordinator
          assert:
            - "first open attempt returns HTTP 409 with response.data.error_id == ERR_NO_APPROVED_SUB_BLOCK"
            - "SubBlock.${vip_sb_id}.approval_status == APPROVED"
            - "SubBlock.${vip_sb_id}.approved_by_user_id == ctrl-1"
            - "SubBlock.${vip_sb_id}.requested_by_user_id == coord-1"
            - "second open attempt returns HTTP 200"
            - "HotelBlock.${block_id}.status == OPEN"
            - "Event.${event_id}.housing_posture == OPEN"

  # =====================================================================================
  # RULE 8 — resource temporal overlap with DIFFERENT interval semantics
  #   instance 1: SubBlock inventory, half-open per-night aggregate capacity
  #   instance 2: Attendee, closed pairwise interval inflated by a shoulder buffer
  # =====================================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: sub_block_half_open_night_capacity_admits_same_day_turnover
        grounds:
          - calculations.sub_block_night_occupancy
          - validations[priority=80]
          - errors[ERR_SUB_BLOCK_NIGHT_CAPACITY_EXCEEDED]
          - entities.SubBlock.fields.committed_rooms
        distinguishing_aspect: |
          Resource entity SubBlock with HALF-OPEN aggregate interval semantics: a stay occupies
          [check_in, check_out), so a 2026-09-16 arrival into a one-room sub-block already holding a
          2026-09-14..2026-09-16 stay is admitted (same-day turnover is not a collision), while a
          2026-09-15..2026-09-17 stay is refused because night 2026-09-15 would need a second room.
        test_recipe:
          setup:
            - "OPEN block with an APPROVED GENERAL sub-block of exactly 1 room."
            - "Reservation A (attendee 1) occupies nights 2026-09-14 and 2026-09-15 (2026-09-14..2026-09-16)."
            - "Two further attendees exist so each candidate stay belongs to a different person and the attendee-level overlap rule cannot fire."
          setup_api_calls:
            - call: "POST /housing/events"
              payload: { name: "Annual Summit", code: "SUM26", event_start_date: "2026-09-14", event_end_date: "2026-09-18", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
