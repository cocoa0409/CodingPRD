              payload: {}
              as: ProgramAdmin
            - call: "POST /benefits/employees"
              payload: { employer_id: "${er_id}", external_ref: "AUS-CG1", work_region_code: "US-TX-AUS", payroll_cycle: "MONTHLY", hire_date: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /benefits/benefit-accounts"
              payload: { employee_id: "${emp_id}", benefit_category_id: "${cat_id}" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id, acct_v1: $.data.version }
            - call: "POST /benefits/election-windows"
              payload: { employer_id: "${er_id}", benefit_month: "2026-08", opens_at: "2026-07-01T00:00:00Z", cutoff_at: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              captures: { w1_id: $.data.id }
            - call: "POST /benefits/election-windows"
              payload: { employer_id: "${er_id}", benefit_month: "2026-09", opens_at: "2026-08-20T00:00:00Z", cutoff_at: "2026-09-20T00:00:00Z" }
              as: ProgramAdmin
              captures: { w2_id: $.data.id }
            - call: "POST /benefits/election-windows/${w1_id}/open"
              payload: {}
              as: ProgramAdmin
            - call: "POST /benefits/election-windows/${w2_id}/open"
              payload: {}
              as: ProgramAdmin
            - call: "POST /benefits/elections"
              payload: { employee_id: "${emp_id}", election_window_id: "${w1_id}", benefit_category_id: "${cat_id}", pretax_amount_cents: 30000, posttax_amount_cents: 0, expected_account_version: "${acct_v1}" }
