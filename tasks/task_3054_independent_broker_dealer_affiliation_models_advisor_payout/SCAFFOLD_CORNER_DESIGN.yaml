  # ===========================================================================
  - section: errors
    instances:

      - name: duplicate_payout_period_returns_already_exists
        claim_type: violation_to_error
        grounds:
          - errors.ERR_PERIOD_ALREADY_EXISTS
          - validations[priority=2.7]
          - endpoints.POST_/payout-periods
        distinguishing_aspect: "The same branch, year, month and period index can only be opened once, so the second attempt returns 409 ERR_PERIOD_ALREADY_EXISTS, while period index 2 for the same month is accepted."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Branch SUP-1 with September 2026 period index 1 already OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /branches"
              payload: { branch_code: "SUP-1", name: "Superset Wealth", transmittal_account: "TA-4471", osj_name: "Superset OSJ" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /payout-periods"
              payload: { branch_code: "SUP-1", year: 2026, month: 9, period_index: 1 }
              as: BranchManager
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /payout-periods"
              payload: { branch_code: "SUP-1", year: 2026, month: 9, period_index: 1 }
              as: BranchManager
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_PERIOD_ALREADY_EXISTS"
            - "GET /payout-periods?branch_code=SUP-1 still returns exactly 1 row"
            - "POST /payout-periods with period_index 2 succeeds and GET /payout-periods?branch_code=SUP-1 returns 2 rows, so the uniqueness key includes the period index"
            - "a period index of 6 is refused with ERR_INVALID_REQUEST because the month only carries five periods"

      - name: branch_inactive_blocks_advisor_activation
        claim_type: violation_to_error
        grounds:
          - errors.ERR_BRANCH_NOT_ACTIVE
          - state_machines.Advisor.ONBOARDING_to_ACTIVE
          - validations[priority=3]
        distinguishing_aspect: "Affiliation requires the advisor's primary branch to be ACTIVE, so an ONBOARDING advisor whose branch is still DRAFT is refused with ERR_BRANCH_NOT_ACTIVE after the portability checks already passed."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Branch SOLO-1 is DRAFT and unsupervised. Advisor A-1016 is ONBOARDING with a 6000-bps book and protocol eligibility already satisfied."
