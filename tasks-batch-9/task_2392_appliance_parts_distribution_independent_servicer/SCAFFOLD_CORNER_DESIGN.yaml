              payload: { servicer_account_id: "${acct_s_id}", technician_name: "R. Diaz", oem_code: "WHIRLPOOL", cert_level: "ADVANCED", training_completed_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: WarrantyAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /technician-certifications/${cert_id}/revoke"
              payload: { revocation_reason: "technician left the business" }
              as: WarrantyAdmin
              captures: { cert_v_after_first: $.data.version }
          trigger:
            - call: "POST /technician-certifications/${cert_id}/revoke"
              payload: { revocation_reason: "duplicate revocation attempt" }
              as: WarrantyAdmin
              captures: { err_revoked: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_CERT_ALREADY_REVOKED"
            - "${cert_v_after_first} == 2"
            - "TechnicianCertification.${cert_id}.version == 2"
            - "TechnicianCertification.${cert_id}.cert_status == REVOKED"
            - "TechnicianCertification.${cert_id}.is_effective == false"

      - name: suspending_an_account_cancels_open_orders_and_writes_off_invoiced_ones
        claim_type: side_effect_execution
        grounds:
          - state_machines.ServicerAccount.transitions.ACTIVE_to_SUSPENDED
          - state_machines.PartOrder.transitions.INVOICED_to_WRITTEN_OFF
          - calculations.servicer_credit_exposure
          - endpoints.PATCH_/servicer-accounts/{id}
        distinguishing_aspect: "One PATCH to SUSPENDED fires both declared side effects on different rows at once: the DRAFT order (total 20798) becomes CANCELLED with its line CANCELLED, the INVOICED order (31197) becomes WRITTEN_OFF, and credit_used_cents falls from 51995 to 0."
