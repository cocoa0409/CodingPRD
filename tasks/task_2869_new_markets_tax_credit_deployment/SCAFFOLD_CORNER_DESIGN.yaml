          - errors[ERR_DUPLICATE_CERTIFICATION_NUMBER]
        distinguishing_aspect: "Uniqueness is global, not scoped: re-registering tract_code 28049000100 with entirely different demographics returns ERR_DUPLICATE_TRACT_CODE, and re-using a certification_number returns ERR_DUPLICATE_CERTIFICATION_NUMBER even for a different legal_name and scope."
        test_recipe:
          setup:
            - "One CDE with certification_number CDE-2869-113 and one tract with code 28049000100."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/cdes"
              payload: { legal_name: "Gulf Coast CDE", certification_number: "CDE-2869-113", service_area_scope: "STATEWIDE" }
              as: CertifyingAgency
            - call: "POST /nmtc/census-tracts"
              payload: { tract_code: "28049000100", state_code: "MS", poverty_rate_pct: 32.00, mfi_ratio_pct: 55.00, unemployment_ratio: 1.80 }
              as: CertifyingAgency
          trigger:
            - call: "POST /nmtc/cdes"
              payload: { legal_name: "Completely Different CDE Inc", certification_number: "CDE-2869-113", service_area_scope: "NATIONAL" }
              as: CertifyingAgency
            - call: "POST /nmtc/census-tracts"
              payload: { tract_code: "28049000100", state_code: "LA", poverty_rate_pct: 10.00, mfi_ratio_pct: 95.00, unemployment_ratio: 0.80 }
