          assert:
            - "HTTP 422 with data.error_id == ERR_WINDOW_IN_FUTURE"
            - "Customer.${cust_id}.observation_count == 0 and traffic_risk_index == 0.0 with risk_tier == LOW"
            - "GET /rmd/traffic-observations?customer_id=${cust_id} returns total_count == 0"

      - name: report_generation_for_a_period_that_has_not_elapsed_is_rejected
        claim_type: temporal_validation
        grounds:
          - "validations[priority=30]"
          - errors[ERR_REPORT_PERIOD_NOT_ELAPSED]
        distinguishing_aspect: "period_end may equal the logical clock but not exceed it: [2026-08-01, 2026-09-01) is refused 422 at a clock of 2026-08-31T23:59:59Z and accepted one second later, which also proves the boundary is inclusive."
        test_recipe:
          setup:
            - "One provider with no compliance rows; clock at 2026-08-31T23:59:59Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T23:59:59Z" }
              as: Regulator
            - call: "POST /rmd/providers"
              payload: { legal_name: "Early Report Voice", provider_type: "NON_FACILITIES_RESELLER" }
              as: Regulator
              captures: { prov_id: $.data.id }
            - call: "GET /rmd/providers/${prov_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { prov_v0: $.data.version }
          trigger:
            - call: "POST /rmd/effectiveness-reports"
              payload: { provider_id: "${prov_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", variant: "PROVISIONAL", expected_provider_version: "${prov_v0}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              expect: { status: 422, error_id: ERR_REPORT_PERIOD_NOT_ELAPSED }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Regulator
            - call: "POST /rmd/effectiveness-reports"
              payload: { provider_id: "${prov_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", variant: "PROVISIONAL", expected_provider_version: "${prov_v0}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { rep_id: $.data.id }
          assert:
            - "The first trigger is 422 with data.error_id == ERR_REPORT_PERIOD_NOT_ELAPSED and no report row is created"
            - "The second trigger is 201 (the same expected_provider_version is still current because the refusal wrote nothing)"
            - "EffectivenessReport.${rep_id}.effectiveness_score == 0.6000 with score_band == MID and data_sufficiency == INSUFFICIENT"
            - "EffectivenessReport.${rep_id}.state == GENERATED"

      - name: kyc_gate_applies_to_enable_but_not_to_terminate
        claim_type: conditional_validation
        grounds:
          - "validations[priority=24]"
          - errors[ERR_CUSTOMER_NOT_KYC_VERIFIED]
          - state_machines.Customer.origination_state.ENABLED_to_TERMINATED
        distinguishing_aspect: "Priority 24 is scoped to the ENABLE branch of the action endpoint: the same PENDING customer is refused 422 on ENABLE and accepted on TERMINATE through the very same endpoint in the same session."
        test_recipe:
          setup:
            - "One provider with one customer left at kyc_state PENDING and origination_state DISABLED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: Regulator
            - call: "POST /rmd/providers"
              payload: { legal_name: "Conditional Gate Voice", provider_type: "FACILITIES_BASED" }
              as: Regulator
              captures: { prov_id: $.data.id }
            - call: "POST /rmd/customers"
              payload: { provider_id: "${prov_id}", legal_name: "Unverified Co", contact_email: "ops@unverified.example", kyc_evidence_level: "SELF_ATTESTED" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /rmd/customers/${cust_id}/origination-actions"
              payload: { action: "ENABLE" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              expect: { status: 422, error_id: ERR_CUSTOMER_NOT_KYC_VERIFIED }
            - call: "POST /rmd/customers/${cust_id}/origination-actions"
              payload: { action: "TERMINATE" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
          assert:
            - "The ENABLE trigger is 422 with data.error_id == ERR_CUSTOMER_NOT_KYC_VERIFIED and origination_state stays DISABLED"
            - "The TERMINATE trigger is 200 and Customer.${cust_id}.origination_state == TERMINATED"
            - "Customer.${cust_id}.kyc_state == PENDING throughout (the dimension is never touched)"
            - "Provider.${prov_id}.active_assigned_number_count == 0"

      - name: assignment_surfaces_the_kyc_check_before_the_origination_check
        claim_type: cascading_validation
        grounds:
          - "validations[priority=24]"
          - "validations[priority=25]"
          - errors[ERR_ORIGINATION_NOT_ENABLED]
        distinguishing_aspect: "Both safety checks are violated by a PENDING/DISABLED customer, and the lower-numbered KYC rule must run first: the same request returns ERR_CUSTOMER_NOT_KYC_VERIFIED before verification and only then ERR_ORIGINATION_NOT_ENABLED after it."
        test_recipe:
          setup:
            - "One provider with one PENDING, DISABLED customer"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: Regulator
            - call: "POST /rmd/providers"
              payload: { legal_name: "Ordered Checks Voice", provider_type: "FACILITIES_BASED" }
              as: Regulator
              captures: { prov_id: $.data.id }
            - call: "POST /rmd/customers"
              payload: { provider_id: "${prov_id}", legal_name: "Two Faults Co", contact_email: "ops@twofaults.example", kyc_evidence_level: "CONTRACT_ONLY" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /rmd/number-assignments"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_id}", telephone_number: "+12025550801", ownership_evidence: "DIRECT_ALLOCATION", effective_from: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              expect: { status: 422, error_id: ERR_CUSTOMER_NOT_KYC_VERIFIED }
            - call: "POST /rmd/customers/${cust_id}/kyc-submit"
              payload: {}
              as: KycAnalyst
              as_user_id: "kyc-1"
            - call: "POST /rmd/customers/${cust_id}/kyc-decision"
              payload: { decision: "VERIFY" }
              as: KycAnalyst
              as_user_id: "kyc-2"
            - call: "POST /rmd/number-assignments"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_id}", telephone_number: "+12025550801", ownership_evidence: "DIRECT_ALLOCATION", effective_from: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              expect: { status: 422, error_id: ERR_ORIGINATION_NOT_ENABLED }
          assert:
            - "The first attempt is 422 ERR_CUSTOMER_NOT_KYC_VERIFIED (priority 24 wins over the equally-violated priority 25)"
            - "The second attempt, after VERIFY, is 422 ERR_ORIGINATION_NOT_ENABLED"
            - "Customer.${cust_id}.kyc_state == VERIFIED and origination_state == DISABLED"
            - "GET /rmd/number-assignments?customer_id=${cust_id} returns total_count == 0"
            - "Provider.${prov_id}.active_assigned_number_count == 0"

      - name: two_violated_rules_return_the_lower_priority_number
        claim_type: priority_ordering
        grounds:
          - "validations[priority=12]"
          - "validations[priority=24]"
        excluded_because:
          difficulty_instance: attestation_certificate_state_outranks_kyc_safety_check
          rationale: "That §1.8 instance violates priority 12 and priority 24 in one request, asserts the 409 ERR_NO_ACTIVE_CERTIFICATE, then repairs only the certificate and asserts the 422 ERR_CUSTOMER_NOT_KYC_VERIFIED — the ordering claim proved in both directions."

      - name: state_rule_outranks_referential_rule
        claim_type: priority_conflict
        grounds:
          - "validations[priority=28]"
          - "validations[priority=35]"
        excluded_because:
          difficulty_instance: traceback_window_closure_outranks_call_detail_mismatch
          rationale: "The priority-28 vs priority-35 pair is exactly that instance: the same malformed call-detail response returns ERR_RESPONSE_WINDOW_CLOSED after the hard cutoff and ERR_CALL_DETAIL_MISMATCH before it."

      - name: individually_tolerable_penalties_collectively_suspend_signing
        claim_type: aggregate_validation
        grounds:
          - calculations.provider_posture_recompute
          - "validations[priority=23]"
        excluded_because:
          difficulty_instance: attestation_refused_by_provider_posture_not_by_its_own_fields
          rationale: "The collective-limit shape is covered there: one expired notice (5 points) leaves signing available, while the second one reaches SUSPENSION_POINT_THRESHOLD = 10 and the identical request is then refused 409 ERR_SIGNING_SUSPENDED."

  - section: endpoints
    instances:
      - name: certificate_renewal_supersedes_and_opens_a_signing_gap
        claim_type: action_endpoint
        grounds:
          - "endpoints[POST /rmd/certificates/{certificateId}/renew]"
          - state_machines.Certificate.ACTIVE_to_SUPERSEDED
          - calculations.provider_posture_recompute
        distinguishing_aspect: "Renew is a CREATE-with-supersede action: one call returns a brand-new ISSUED successor at renewal_generation 2, drives the predecessor to SUPERSEDED, and nulls Provider.active_certificate_id so the posture drops to SIGNING_SUSPENDED until the successor is activated - a naive implementation that hands the successor ACTIVE status would never show the gap."
        test_recipe:
          setup:
            - "One provider with an ACCEPTED mitigation plan and one ACTIVE certificate, i.e. auth_posture FULL_ATTESTATION"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: Regulator
            - call: "POST /rmd/providers"
              payload: { legal_name: "Renewal Gap Voice", provider_type: "FACILITIES_BASED" }
              as: Regulator
              captures: { prov_id: $.data.id, prov_v0: $.data.version }
            - call: "POST /rmd/mitigation-plans"
              payload: { provider_id: "${prov_id}", prevention_practices: ["KYC_ONBOARDING", "TRACEBACK_COOPERATION", "TRAFFIC_PATTERN_MONITORING"], expected_provider_version: "${prov_v0}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { plan_id: $.data.id }
            - call: "POST /rmd/mitigation-plans/${plan_id}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /rmd/mitigation-plans/${plan_id}/decision"
              payload: { decision: "ACCEPT" }
              as: Regulator
            - call: "POST /rmd/certificates"
              payload: { provider_id: "${prov_id}", spc_token: "SPC-2001", public_key_fingerprint: "fp-2001", not_before: "2026-08-01T00:00:00Z", not_after: "2027-08-01T00:00:00Z" }
              as: PolicyAdministrator
              captures: { cert1_id: $.data.id }
            - call: "POST /rmd/certificates/${cert1_id}/issue"
              payload: {}
              as: PolicyAdministrator
            - call: "POST /rmd/certificates/${cert1_id}/activate"
              payload: {}
              as: ProviderAdmin
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /rmd/certificates/${cert1_id}/renew"
              payload: { spc_token: "SPC-2002", public_key_fingerprint: "fp-2002", not_before: "2026-08-10T00:00:00Z", not_after: "2027-08-10T00:00:00Z" }
              as: PolicyAdministrator
              captures: { cert2_id: $.data.id, cert2_status: $.data.status, cert2_generation: $.data.renewal_generation }
            - call: "GET /rmd/providers/${prov_id}"
              payload: {}
              as: Regulator
            - call: "POST /rmd/certificates/${cert2_id}/activate"
              payload: {}
              as: ProviderAdmin
              as_user_id: "${prov_id}"
            - call: "GET /rmd/providers/${prov_id}"
              payload: {}
              as: Regulator
          assert:
            - "The renew call returns 201 with data.status == ISSUED, data.renewal_generation == 2, data.predecessor_certificate_id == ${cert1_id} and data.issued_at == 2026-08-10T00:00:00Z"
            - "Certificate.${cert1_id}.status == SUPERSEDED"
            - "The first GET shows Provider.${prov_id}.active_certificate_id == null, auth_posture == SIGNING_SUSPENDED and rmd_filing_status == COMPLETE (the plan is untouched by renewal)"
            - "The second GET shows Provider.${prov_id}.active_certificate_id == ${cert2_id} and auth_posture == FULL_ATTESTATION"
            - "GET /rmd/certificates?predecessor_certificate_id=${cert1_id} returns total_count == 1 with data[0].id == ${cert2_id}"

      - name: provider_read_returns_recomputed_open_notice_count
        claim_type: computed_read
        grounds:
          - "endpoints[GET /rmd/providers/{providerId}]"
          - calculations.provider_assignment_and_blocking_metrics
          - entities.Provider.fields.open_notice_count
        distinguishing_aspect: "open_notice_count is a derived count over states {NOTIFIED, UNDER_INVESTIGATION}, not an increment-on-create counter: moving one notice to UNDER_INVESTIGATION leaves the count at 2, and only mitigating it drops the count to 1."
        test_recipe:
          setup:
            - "One provider with one customer and two illegal-traffic notices, one of which is under investigation"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: Regulator
            - call: "POST /rmd/providers"
              payload: { legal_name: "Derived Counter Voice", provider_type: "FACILITIES_BASED" }
