  - rule_id: cross_entity_state_dependency
    instances:

      - name: complaint_approve_gated_by_subscription_and_season_states
        grounds:
          - state_machines.ComplaintCase.OPEN_to_APPROVED_REFUND
          - validations[priority=16]
          - validations[priority=18]
          - calculations.blackout_refund_amount
        distinguishing_aspect: |
          Entity pair ComplaintCase → Subscription (+Season): the same APPROVE
          resolve succeeds with refund 1111 while the subscription is ACTIVE
          inside the grace window, but after the subscription is CANCELLED the
          identical resolve on a second identical complaint fails with
          ERR_REFUND_NOT_AVAILABLE — the complaint's valid transitions depend
          on the linked subscription's state and the season's grace window.
