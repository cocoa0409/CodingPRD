# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/malformed" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted, or acting user is not the designated actor for the step (e.g., wrong manager, wrong HRBP, wrong counsel, wrong employee)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource does not exist" }
  - { id: ERR_PARENT_MISMATCH, http: 404, condition: "Nested resource does not belong to declared parent" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_pip_version does not match pip.version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state that permits the requested transition" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Acting user barred by SoD (same person cannot author and approve, propose and decide, etc.)" }
  - { id: ERR_EMPLOYEE_NOT_ACTIVE, http: 409, condition: "Employee.employment_status != ACTIVE" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/malformed field, length floor violated, enum out of range" }
  - { id: ERR_COACHING_ENTRY_MISMATCH, http: 422, condition: "coaching_log_entry_ids references entries not owned by this employee" }
  - { id: ERR_COACHING_ENTRY_NOT_FORMAL, http: 422, condition: "Referenced coaching entries not in {DOCUMENTED, ESCALATED}" }
  - { id: ERR_INSUFFICIENT_COACHING_HISTORY, http: 422, condition: "Fewer than 2 qualifying coaching entries at concern submit" }
  - { id: ERR_CONCERN_NOT_ACCEPTED, http: 409, condition: "PIP references concern not in ACCEPTED state" }
  - { id: ERR_TEMPLATE_WEIGHT_SUM, http: 422, condition: "Template goal weights do not sum to 100" }
  - { id: ERR_TEMPLATE_CADENCE_MISMATCH, http: 422, condition: "duration_days not divisible by check_in_cadence_days" }
  - { id: ERR_TEMPLATE_IN_USE, http: 409, condition: "Retire blocked by in-flight PIPs referencing the template" }
  - { id: ERR_TEMPLATE_NOT_PUBLISHED, http: 409, condition: "PIP create requires PUBLISHED template" }
  - { id: ERR_ACTIVE_PIP_EXISTS, http: 409, condition: "Employee already has an in-flight PIP" }
  - { id: ERR_PIP_NOT_ACTIVE, http: 409, condition: "Operation requires PIP status IN {ACTIVE, EXTENDED}" }
  - { id: ERR_OUTCOME_ALREADY_PROPOSED, http: 409, condition: "Withdraw blocked by a PROPOSED/APPROVED outcome decision" }
  - { id: ERR_CHECKIN_TOO_EARLY, http: 409, condition: "current_utc < scheduled_for on mark-held" }
  - { id: ERR_CHECKIN_QUORUM, http: 422, condition: "manager_attended AND hrbp_attended required" }
  - { id: ERR_CHECKIN_ALREADY_HELD, http: 409, condition: "Evidence adjudication on a HELD check-in" }
  - { id: ERR_CHECKIN_CADENCE_VIOLATION, http: 422, condition: "Scheduled check-ins violate cadence or sequence contiguity" }
  - { id: ERR_REFERENTIAL_INTEGRITY, http: 422, condition: "FK body reference resolves but fails a state filter (e.g., goal not under pip, template not PUBLISHED, concern not ACCEPTED)" }
  - { id: ERR_PLAN_STILL_RUNNING, http: 409, condition: "current_utc < pip.end_date at outcome approval (or cycle still open at calibrate, etc.)" }
  - { id: ERR_ATTAINMENT_BELOW_THRESHOLD, http: 422, condition: "SUCCESS outcome requires final_attainment_ratio >= 0.80" }
  - { id: ERR_EXTENSION_LIMIT_EXCEEDED, http: 409, condition: "extension_count would exceed 1" }
  - { id: ERR_LEGAL_REVIEW_REQUIRED, http: 409, condition: "TERMINATION requires a SUBMITTED/OVERRIDDEN legal review with recommendation != REJECT (unless OVERRIDDEN)" }
  - { id: ERR_LEGAL_OVERRIDE_NOT_ALLOWED, http: 409, condition: "Only REJECT recommendations may be overridden" }
  - { id: ERR_REBUTTAL_WINDOW_CLOSED, http: 409, condition: "Rebuttal submitted after decided_at + 5 days" }
  - { id: ERR_REBUTTAL_NOT_SUBJECT, http: 403, condition: "Rebuttal submitted by someone other than the PIP's subject employee" }
  - { id: ERR_COHORT_TOO_SMALL, http: 422, condition: "Consistency cohort has fewer than 3 comparable closed PIPs" }
  - { id: ERR_CYCLE_STILL_OPEN, http: 409, condition: "calibrate requires current_utc >= window_end" }
  - { id: ERR_CYCLE_TOO_RECENT, http: 409, condition: "archive requires current_utc >= window_end + 365 days" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: HRSystemAdmin
    description: "Platform operator; provisions org units and employees; controls the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /hr-org-units"
      - "POST /hr-org-units/{ouId}/_clock/set_current_utc"
      - "POST /hr-org-units/{ouId}/employees"
    shared_operations:
      - "All GET endpoints"

  - name: Manager
    description: "Direct manager of an employee; documents concerns, authors coaching log, submits evidence"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST .../employees/{empId}/coaching-log-entries — must be employee's direct manager"
      - "POST .../employees/{empId}/performance-concerns — must be employee's direct manager"
      - "POST .../performance-concerns/{id}/submit — only the concern author"
    shared_operations:
      - "POST .../evidence — Manager or HRBP"
      - "GET endpoints (non-legal)"

  - name: HRBusinessPartner
    description: "HRBP; shepherds concern->PIP->outcome pipeline; segregated from authoring and approving"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST .../performance-concerns/{id}/accept | reject"
      - "POST .../pip-templates, publish, retire"
      - "POST .../pips, issue, withdraw"
      - "POST .../check-ins, mark-held"
      - "POST .../evidence/{id}/admit | exclude"
      - "POST .../legal-reviews"
      - "POST .../outcome-decisions"
      - "POST .../rebuttals/{id}/start-review | resolve"
      - "POST .../rating-cycles, calibrate"
      - "POST .../consistency-reviews"
    shared_operations:
      - "GET endpoints"

  - name: LegalCounsel
    description: "Employment counsel; claims and submits legal risk reviews"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST .../legal-reviews/{id}/claim"
      - "POST .../legal-reviews/{id}/submit"
    shared_operations:
      - "GET endpoints"

  - name: HRDirector
    description: "Senior HR authority; approves outcomes, overrides legal REJECT, publishes cycles, adjudicates consistency"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST .../outcome-decisions/{id}/approve | reject"
      - "POST .../legal-reviews/{id}/override"
      - "POST .../rating-cycles/{id}/publish | archive"
      - "POST .../consistency-reviews/{id}/adjudicate"
    shared_operations:
      - "GET endpoints"

  - name: Employee
    description: "Subject of a PIP; may submit a rebuttal within the window"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST .../pips/{pipId}/rebuttals — only when X-User-ID == pip.employee_id"
    shared_operations:
      - "GET endpoints on own record"
