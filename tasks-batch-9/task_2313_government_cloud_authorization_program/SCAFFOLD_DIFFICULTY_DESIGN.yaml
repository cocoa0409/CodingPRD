      setup:
      - 'Full authorization prelude: Authorization live at 2026-03-30T00:00:00Z with reuse_seats_total 5, reuse_seats_granted
        0, reuse_seats_available 5.'
      - 'Two further agencies exist: EPA and HHS, each with reuse_grant_count 0.'
      - The current Authorization version has been read into ${auth_v}.
