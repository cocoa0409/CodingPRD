      - name: restock_value_cap_exceeded_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=30]", "errors[ERR_RESTOCK_VALUE_CAP_EXCEEDED]"]
        distinguishing_aspect: "With the visit legally CHECKED_IN, a 600-cent restock against a 500 cap fails on the fiscal rule alone."
