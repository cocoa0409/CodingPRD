              as: OdfiUnderwriter
            - call: "POST /ach/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OdfiOperations
            - call: "POST /ach/ach-files"
              payload: { sec_code: "CCD", requested_window_kind: "NEXT_DAY", effective_date: "2026-08-03" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { f1_id: "$.data.id", f1_v: "$.data.version" }
            - call: "POST /ach/ach-files/${f1_id}/entries"
              payload:
                expected_file_version: "${f1_v}"
                entries:
                  - { direction: "DEBIT", amount_cents: 2000000, receiver_account: "z-x", receiver_routing: "123456789" }
              as: OriginatorOps
              as_user_id: "${org_id}"
            - call: "POST /ach/ach-files/${f1_id}/release"
              payload: {}
              as: OdfiOperations
              captures: { b1_id: "$.data.settlement_batch_id" }
            - call: "POST /ach/settlement-batches/${b1_id}/advance"
              payload: { action: "DISPATCH" }
              as: OdfiOperations
              as_user_id: "ops-1"
            - call: "POST /ach/settlement-batches/${b1_id}/advance"
              payload: { action: "SETTLE" }
              as: OdfiOperations
              as_user_id: "ops-1"
            - call: "GET /ach/ach-files/${f1_id}/entries"
              payload: {}
              as: OdfiOperations
              captures: { x_id: "$.data[0].id" }
            - call: "POST /ach/ach-entries/${x_id}/returns"
              payload: { return_code: "R01" }
              as: OdfiOperations
            - call: "POST /ach/ach-entries/${x_id}/representments"
              payload: {}
              as: OdfiOperations
            - call: "POST /ach/ach-files"
              payload: { sec_code: "CCD", requested_window_kind: "NEXT_DAY", effective_date: "2026-08-03" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { f2_id: "$.data.id", f2_v: "$.data.version" }
            - call: "POST /ach/ach-files/${f2_id}/entries"
              payload:
                expected_file_version: "${f2_v}"
                entries:
                  - { direction: "DEBIT", amount_cents: 700000, receiver_account: "z-y", receiver_routing: "123456789" }
              as: OriginatorOps
              as_user_id: "${org_id}"
            - call: "POST /ach/ach-files/${f2_id}/release"
              payload: {}
              as: OdfiOperations
              captures: { b2_id: "$.data.settlement_batch_id" }
            - call: "POST /ach/settlement-batches/${b2_id}/advance"
              payload: { action: "DISPATCH" }
              as: OdfiOperations
              as_user_id: "ops-1"
            - call: "POST /ach/settlement-batches/${b2_id}/advance"
              payload: { action: "SETTLE" }
              as: OdfiOperations
              as_user_id: "ops-1"
            - call: "POST /ach/ach-entries/${x_id}/returns"
              payload: { return_code: "R01" }
              as: OdfiOperations
            - call: "POST /ach/ach-entries/${x_id}/representments"
              payload: {}
              as: OdfiOperations
            - call: "POST /ach/ach-files"
              payload: { sec_code: "CCD", requested_window_kind: "NEXT_DAY", effective_date: "2026-08-03" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { f3_id: "$.data.id", f3_v: "$.data.version" }
            - call: "POST /ach/ach-files/${f3_id}/entries"
              payload:
                expected_file_version: "${f3_v}"
                entries:
                  - { direction: "DEBIT", amount_cents: 500000, receiver_account: "z-z", receiver_routing: "123456789" }
              as: OriginatorOps
              as_user_id: "${org_id}"
            - call: "POST /ach/ach-files/${f3_id}/release"
              payload: {}
              as: OdfiOperations
              captures: { b3_id: "$.data.settlement_batch_id" }
            - call: "POST /ach/settlement-batches/${b3_id}/advance"
              payload: { action: "DISPATCH" }
              as: OdfiOperations
              as_user_id: "ops-1"
            - call: "POST /ach/settlement-batches/${b3_id}/advance"
              payload: { action: "SETTLE" }
              as: OdfiOperations
              as_user_id: "ops-1"
            - call: "POST /ach/ach-entries/${x_id}/returns"
