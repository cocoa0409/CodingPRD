# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Matchmaking & Dating Service — 9 rules × 2 instances = 18 instances.
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1–§1.7.
# Canonical setup primitives reused across instances:
#   * a "make active member" chain = create plan -> set clock -> register ->
#     screen -> approve -> activate membership -> set preferences.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: guarantee_committed_vs_forecast_diverge
        grounds:
          - calculations.guarantee_remaining
          - entities.Member.fields.guarantee_remaining_committed
          - entities.Member.fields.guarantee_remaining_forecast
          - state_machines.Introduction.SUGGESTED_to_MUTUAL
        distinguishing_aspect: |
          On the Member/Membership guarantee pool, the committed variant (counts only MUTUAL+) and the
          forecast variant (also counts open SUGGESTED/ONE_SIDED) yield 5 vs 3 for the same data — a
          quota-allocation domain, distinct from the refund-rounding dual-variant on Membership cents.
        test_recipe:
          setup:
            - "member_a ACTIVE with a plan guaranteeing 8 introductions (priority off, standard cost 1/intro)."
            - "Three introductions reached MUTUAL (3 committed credits); two more are still SUGGESTED (2 forecast credits)."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 12000, term_months: 6, guaranteed_introductions: 8, priority_match_enabled: false, included_coaching_sessions: 3, coaching_value_cents: 5000, background_check_addon_cents: 2500 }
              as: BillingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /members"
              payload: { email: "a@x.com", full_name: "A", birth_date: "1990-01-01T00:00:00Z", city: "NYC", gender: "MALE" }
              as: ScreeningOfficer
              captures: { a_id: $.data.id }
            - call: "POST /members/${a_id}/screenings"
              payload: { questionnaire_score: 90, identity_verified: true }
              as: ScreeningOfficer
              captures: { a_scr: $.data.id }
            - call: "POST /members/${a_id}/screenings/${a_scr}/decide"
              payload: { decision: "APPROVED" }
              as: ScreeningOfficer
            - call: "POST /members/${a_id}/memberships"
              payload: { plan_id: "${plan_id}" }
              as: BillingAdmin
            - call: "PUT /members/${a_id}/preferences"
              payload: { seeking_gender: "FEMALE", min_age: 25, max_age: 45, max_distance_band: 0, attribute_weights: { education: 80, lifestyle: 80, values: 80 } }
              as: Member
              as_user_id: "${a_id}"
            # build five FEMALE counterparts, mutual-accept three, leave two SUGGESTED
            - call: "POST /members"
              payload: { email: "b1@x.com", full_name: "B1", birth_date: "1992-01-01T00:00:00Z", city: "NYC", gender: "FEMALE" }
              as: ScreeningOfficer
              captures: { b1_id: $.data.id }
            - call: "POST /members/${b1_id}/screenings"
              payload: { questionnaire_score: 90, identity_verified: true }
              as: ScreeningOfficer
              captures: { b1_scr: $.data.id }
            - call: "POST /members/${b1_id}/screenings/${b1_scr}/decide"
              payload: { decision: "APPROVED" }
              as: ScreeningOfficer
            - call: "POST /members/${b1_id}/memberships"
              payload: { plan_id: "${plan_id}" }
              as: BillingAdmin
            - call: "PUT /members/${b1_id}/preferences"
              payload: { seeking_gender: "MALE", min_age: 25, max_age: 45, max_distance_band: 0, attribute_weights: { education: 80, lifestyle: 80, values: 80 } }
              as: Member
              as_user_id: "${b1_id}"
            - call: "GET /members/${a_id}"
              payload: {}
              as: Matchmaker
              captures: { a_v1: $.data.version }
            - call: "POST /introductions"
              payload: { member_a_id: "${a_id}", member_b_id: "${b1_id}", expected_member_a_version: "${a_v1}" }
              as: Matchmaker
              captures: { intro1_id: $.data.id, intro1_v: $.data.version }
            - call: "POST /introductions/${intro1_id}/respond"
              payload: { response: "ACCEPTED", expected_introduction_version: "${intro1_v}" }
              as: Member
              as_user_id: "${a_id}"
              captures: { intro1_v2: $.data.version }
            - call: "POST /introductions/${intro1_id}/respond"
              payload: { response: "ACCEPTED", expected_introduction_version: "${intro1_v2}" }
              as: Member
              as_user_id: "${b1_id}"
            # repeat mutual-accept for b2, b3 (abbreviated to the load-bearing calls; identical pattern)
            - call: "POST /members"
              payload: { email: "b2@x.com", full_name: "B2", birth_date: "1992-02-01T00:00:00Z", city: "NYC", gender: "FEMALE" }
              as: ScreeningOfficer
              captures: { b2_id: $.data.id }
            - call: "POST /members/${b2_id}/screenings"
              payload: { questionnaire_score: 90, identity_verified: true }
              as: ScreeningOfficer
              captures: { b2_scr: $.data.id }
            - call: "POST /members/${b2_id}/screenings/${b2_scr}/decide"
              payload: { decision: "APPROVED" }
              as: ScreeningOfficer
            - call: "POST /members/${b2_id}/memberships"
              payload: { plan_id: "${plan_id}" }
              as: BillingAdmin
            - call: "PUT /members/${b2_id}/preferences"
              payload: { seeking_gender: "MALE", min_age: 25, max_age: 45, max_distance_band: 0, attribute_weights: { education: 80, lifestyle: 80, values: 80 } }
              as: Member
              as_user_id: "${b2_id}"
            - call: "GET /members/${a_id}"
              payload: {}
              as: Matchmaker
              captures: { a_v2: $.data.version }
            - call: "POST /introductions"
              payload: { member_a_id: "${a_id}", member_b_id: "${b2_id}", expected_member_a_version: "${a_v2}" }
              as: Matchmaker
              captures: { intro2_id: $.data.id, intro2_v: $.data.version }
            - call: "POST /introductions/${intro2_id}/respond"
              payload: { response: "ACCEPTED", expected_introduction_version: "${intro2_v}" }
              as: Member
              as_user_id: "${a_id}"
              captures: { intro2_v2: $.data.version }
            - call: "POST /introductions/${intro2_id}/respond"
              payload: { response: "ACCEPTED", expected_introduction_version: "${intro2_v2}" }
              as: Member
              as_user_id: "${b2_id}"
            - call: "POST /members"
              payload: { email: "b3@x.com", full_name: "B3", birth_date: "1992-03-01T00:00:00Z", city: "NYC", gender: "FEMALE" }
              as: ScreeningOfficer
              captures: { b3_id: $.data.id }
            - call: "POST /members/${b3_id}/screenings"
              payload: { questionnaire_score: 90, identity_verified: true }
              as: ScreeningOfficer
              captures: { b3_scr: $.data.id }
            - call: "POST /members/${b3_id}/screenings/${b3_scr}/decide"
              payload: { decision: "APPROVED" }
              as: ScreeningOfficer
            - call: "POST /members/${b3_id}/memberships"
              payload: { plan_id: "${plan_id}" }
              as: BillingAdmin
            - call: "PUT /members/${b3_id}/preferences"
              payload: { seeking_gender: "MALE", min_age: 25, max_age: 45, max_distance_band: 0, attribute_weights: { education: 80, lifestyle: 80, values: 80 } }
              as: Member
              as_user_id: "${b3_id}"
            - call: "GET /members/${a_id}"
              payload: {}
              as: Matchmaker
              captures: { a_v3: $.data.version }
            - call: "POST /introductions"
              payload: { member_a_id: "${a_id}", member_b_id: "${b3_id}", expected_member_a_version: "${a_v3}" }
              as: Matchmaker
              captures: { intro3_id: $.data.id, intro3_v: $.data.version }
            - call: "POST /introductions/${intro3_id}/respond"
              payload: { response: "ACCEPTED", expected_introduction_version: "${intro3_v}" }
              as: Member
              as_user_id: "${a_id}"
              captures: { intro3_v2: $.data.version }
            - call: "POST /introductions/${intro3_id}/respond"
              payload: { response: "ACCEPTED", expected_introduction_version: "${intro3_v2}" }
              as: Member
              as_user_id: "${b3_id}"
            # two more counterparts, suggest only (left SUGGESTED, not responded)
            - call: "POST /members"
              payload: { email: "b4@x.com", full_name: "B4", birth_date: "1992-04-01T00:00:00Z", city: "NYC", gender: "FEMALE" }
              as: ScreeningOfficer
              captures: { b4_id: $.data.id }
            - call: "POST /members/${b4_id}/screenings"
              payload: { questionnaire_score: 90, identity_verified: true }
              as: ScreeningOfficer
              captures: { b4_scr: $.data.id }
            - call: "POST /members/${b4_id}/screenings/${b4_scr}/decide"
              payload: { decision: "APPROVED" }
              as: ScreeningOfficer
            - call: "POST /members/${b4_id}/memberships"
              payload: { plan_id: "${plan_id}" }
              as: BillingAdmin
            - call: "PUT /members/${b4_id}/preferences"
              payload: { seeking_gender: "MALE", min_age: 25, max_age: 45, max_distance_band: 0, attribute_weights: { education: 80, lifestyle: 80, values: 80 } }
              as: Member
              as_user_id: "${b4_id}"
            - call: "GET /members/${a_id}"
              payload: {}
              as: Matchmaker
              captures: { a_v4: $.data.version }
            - call: "POST /introductions"
              payload: { member_a_id: "${a_id}", member_b_id: "${b4_id}", expected_member_a_version: "${a_v4}" }
              as: Matchmaker
            - call: "POST /members"
              payload: { email: "b5@x.com", full_name: "B5", birth_date: "1992-05-01T00:00:00Z", city: "NYC", gender: "FEMALE" }
              as: ScreeningOfficer
              captures: { b5_id: $.data.id }
            - call: "POST /members/${b5_id}/screenings"
              payload: { questionnaire_score: 90, identity_verified: true }
              as: ScreeningOfficer
              captures: { b5_scr: $.data.id }
            - call: "POST /members/${b5_id}/screenings/${b5_scr}/decide"
              payload: { decision: "APPROVED" }
              as: ScreeningOfficer
            - call: "POST /members/${b5_id}/memberships"
              payload: { plan_id: "${plan_id}" }
              as: BillingAdmin
            - call: "PUT /members/${b5_id}/preferences"
              payload: { seeking_gender: "MALE", min_age: 25, max_age: 45, max_distance_band: 0, attribute_weights: { education: 80, lifestyle: 80, values: 80 } }
              as: Member
              as_user_id: "${b5_id}"
            - call: "GET /members/${a_id}"
              payload: {}
              as: Matchmaker
              captures: { a_v5: $.data.version }
            - call: "POST /introductions"
              payload: { member_a_id: "${a_id}", member_b_id: "${b5_id}", expected_member_a_version: "${a_v5}" }
              as: Matchmaker
          trigger:
            - call: "GET /members/${a_id}"
              payload: {}
              as: Matchmaker
              captures: { final_committed: $.data.guarantee_remaining_committed, final_forecast: $.data.guarantee_remaining_forecast }
          assert:
            - "Member.${a_id}.guarantee_remaining_committed == 5"
            - "Member.${a_id}.guarantee_remaining_forecast == 3"

      - name: refund_per_line_vs_sum_rounding_diverge
        grounds:
          - calculations.refund_on_cancel
          - entities.Membership.fields.refund_cents
          - state_machines.Membership.ACTIVE_to_CANCELLED
        distinguishing_aspect: |
          On Membership cents, round-per-coaching-line-then-sum (5001) vs sum-then-round (5000) diverge by 1
          cent; the scaffold pins per-line. This is a monetary-rounding domain distinct from the integer
          guarantee-credit dual-variant on Member.
        test_recipe:
          setup:
            - "member_c ACTIVE on a plan: monthly_fee 12000, term 6, coaching_value 5000, included_coaching 3."
            - "Clock advanced to 2026-08-10 (70 days elapsed); no coaching sessions held; membership cancelled."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "ELITE", monthly_fee_cents: 12000, term_months: 6, guaranteed_introductions: 8, priority_match_enabled: false, included_coaching_sessions: 3, coaching_value_cents: 5000, background_check_addon_cents: 2500 }
              as: BillingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /members"
              payload: { email: "c@x.com", full_name: "C", birth_date: "1990-01-01T00:00:00Z", city: "NYC", gender: "MALE" }
              as: ScreeningOfficer
              captures: { c_id: $.data.id }
            - call: "POST /members/${c_id}/screenings"
              payload: { questionnaire_score: 90, identity_verified: true }
              as: ScreeningOfficer
              captures: { c_scr: $.data.id }
            - call: "POST /members/${c_id}/screenings/${c_scr}/decide"
              payload: { decision: "APPROVED" }
              as: ScreeningOfficer
            - call: "POST /members/${c_id}/memberships"
              payload: { plan_id: "${plan_id}" }
              as: BillingAdmin
              captures: { c_ms: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: BillingAdmin
          trigger:
            - call: "POST /memberships/${c_ms}/cancel"
              payload: {}
              as: BillingAdmin
              captures: { refund: $.data.refund_cents }
          assert:
            - "Membership.${c_ms}.refund_cents == 41001"
            - "Membership.${c_ms}.status == CANCELLED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: guarantee_consume_min_cap_tier_promo_nonlinear
        grounds:
          - calculations.guarantee_consume_on_suggest
          - entities.Introduction.fields.credits_consumed
          - entities.MembershipPlan.fields.priority_match_enabled
        distinguishing_aspect: |
          Mode (a): cost = f(win_back, priority, remaining) with conditional branch + min() cap (>=3
          inputs, non-linear). On a PRIORITY plan guaranteeing 3, the first suggestion consumes min(2,3)=2
          (forecast 1); the SECOND consumes min(2,1)=1 — the cap fires, NOT a full 2. This is the
          formula-interaction mode, distinct from the refund-rounding-order mode.
        test_recipe:
          setup:
            - "member_p ACTIVE on a PRIORITY plan guaranteeing 3 (priority_match_enabled=true, cost 2/intro)."
            - "One prior suggestion consumed 2 (forecast 1); a second suggestion is the unit under test and is capped to 1."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "ELITE", monthly_fee_cents: 12000, term_months: 6, guaranteed_introductions: 3, priority_match_enabled: true, included_coaching_sessions: 3, coaching_value_cents: 5000, background_check_addon_cents: 2500 }
              as: BillingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /members"
              payload: { email: "p@x.com", full_name: "P", birth_date: "1990-01-01T00:00:00Z", city: "NYC", gender: "MALE" }
              as: ScreeningOfficer
              captures: { p_id: $.data.id }
            - call: "POST /members/${p_id}/screenings"
              payload: { questionnaire_score: 90, identity_verified: true }
              as: ScreeningOfficer
              captures: { p_scr: $.data.id }
            - call: "POST /members/${p_id}/screenings/${p_scr}/decide"
              payload: { decision: "APPROVED" }
              as: ScreeningOfficer
            - call: "POST /members/${p_id}/memberships"
              payload: { plan_id: "${plan_id}" }
              as: BillingAdmin
            - call: "PUT /members/${p_id}/preferences"
              payload: { seeking_gender: "FEMALE", min_age: 25, max_age: 45, max_distance_band: 0, attribute_weights: { education: 80, lifestyle: 80, values: 80 } }
              as: Member
              as_user_id: "${p_id}"
            - call: "POST /members"
              payload: { email: "q1@x.com", full_name: "Q1", birth_date: "1992-01-01T00:00:00Z", city: "NYC", gender: "FEMALE" }
              as: ScreeningOfficer
              captures: { q1_id: $.data.id }
            - call: "POST /members/${q1_id}/screenings"
              payload: { questionnaire_score: 90, identity_verified: true }
              as: ScreeningOfficer
              captures: { q1_scr: $.data.id }
            - call: "POST /members/${q1_id}/screenings/${q1_scr}/decide"
              payload: { decision: "APPROVED" }
              as: ScreeningOfficer
            - call: "POST /members/${q1_id}/memberships"
              payload: { plan_id: "${plan_id}" }
              as: BillingAdmin
            - call: "PUT /members/${q1_id}/preferences"
              payload: { seeking_gender: "MALE", min_age: 25, max_age: 45, max_distance_band: 0, attribute_weights: { education: 80, lifestyle: 80, values: 80 } }
              as: Member
              as_user_id: "${q1_id}"
            - call: "GET /members/${p_id}"
              payload: {}
              as: Matchmaker
              captures: { p_vA: $.data.version }
            - call: "POST /introductions"
              payload: { member_a_id: "${p_id}", member_b_id: "${q1_id}", expected_member_a_version: "${p_vA}" }
              as: Matchmaker
              captures: { intro1_credits: $.data.credits_consumed }
            # first priority suggestion consumed min(2,3)=2 -> forecast 1. Now build q2 for the capped suggestion.
            - call: "POST /members"
              payload: { email: "q2@x.com", full_name: "Q2", birth_date: "1992-02-01T00:00:00Z", city: "NYC", gender: "FEMALE" }
              as: ScreeningOfficer
              captures: { q2_id: $.data.id }
            - call: "POST /members/${q2_id}/screenings"
              payload: { questionnaire_score: 90, identity_verified: true }
              as: ScreeningOfficer
              captures: { q2_scr: $.data.id }
            - call: "POST /members/${q2_id}/screenings/${q2_scr}/decide"
              payload: { decision: "APPROVED" }
              as: ScreeningOfficer
            - call: "POST /members/${q2_id}/memberships"
              payload: { plan_id: "${plan_id}" }
              as: BillingAdmin
            - call: "PUT /members/${q2_id}/preferences"
              payload: { seeking_gender: "MALE", min_age: 25, max_age: 45, max_distance_band: 0, attribute_weights: { education: 80, lifestyle: 80, values: 80 } }
              as: Member
              as_user_id: "${q2_id}"
            - call: "GET /members/${p_id}"
              payload: {}
              as: Matchmaker
              captures: { p_vB: $.data.version }
          trigger:
            - call: "POST /introductions"
              payload: { member_a_id: "${p_id}", member_b_id: "${q2_id}", expected_member_a_version: "${p_vB}" }
              as: Matchmaker
              captures: { intro2_credits: $.data.credits_consumed, intro2_id: $.data.id }
            - call: "GET /members/${p_id}"
              payload: {}
              as: Matchmaker
              captures: { p_forecast: $.data.guarantee_remaining_forecast }
          assert:
            - "Introduction.${intro2_id}.credits_consumed == 1"
            - "Member.${p_id}.guarantee_remaining_forecast == 0"

      - name: refund_rounding_order_pinned_per_line
        grounds:
          - calculations.refund_on_cancel
          - entities.Membership.fields.refund_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. round_half_up per unused-coaching line then sum =
          5001; sum-then-round = 5000. The scaffold pins per-line; the test asserts the per-line literal,
          falsifying any sum-then-round implementation. Distinct mode from the min/cap formula above.
        test_recipe:
          setup:
            - "member_d ACTIVE on plan monthly_fee 0 (isolate coaching term), coaching_value 5000, included 3, term 6."
            - "Clock at start (no months elapsed -> remaining_months term-1=5 full months at fee 0 = 0); cancel with all 3 coaching unused."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 0, term_months: 6, guaranteed_introductions: 4, priority_match_enabled: false, included_coaching_sessions: 3, coaching_value_cents: 5000, background_check_addon_cents: 2500 }
              as: BillingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /members"
              payload: { email: "d@x.com", full_name: "D", birth_date: "1990-01-01T00:00:00Z", city: "NYC", gender: "MALE" }
              as: ScreeningOfficer
              captures: { d_id: $.data.id }
            - call: "POST /members/${d_id}/screenings"
              payload: { questionnaire_score: 90, identity_verified: true }
              as: ScreeningOfficer
              captures: { d_scr: $.data.id }
            - call: "POST /members/${d_id}/screenings/${d_scr}/decide"
              payload: { decision: "APPROVED" }
              as: ScreeningOfficer
            - call: "POST /members/${d_id}/memberships"
              payload: { plan_id: "${plan_id}" }
              as: BillingAdmin
              captures: { d_ms: $.data.id }
          trigger:
            - call: "POST /memberships/${d_ms}/cancel"
              payload: {}
              as: BillingAdmin
              captures: { refund: $.data.refund_cents }
          assert:
            - "Membership.${d_ms}.refund_cents == 5001"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: introduction_branching_one_sided_to_mutual_or_declined
        grounds:
          - state_machines.Introduction.SUGGESTED_to_ONE_SIDED
          - state_machines.Introduction.SUGGESTED_to_MUTUAL
          - state_machines.Introduction.SUGGESTED_to_DECLINED
        distinguishing_aspect: |
          Introduction is a branching fork-join: SUGGESTED -> ONE_SIDED -> {MUTUAL | DECLINED} with divergent
          side-effects (MUTUAL commits credits; DECLINED refunds them). Two-party quorum, distinct entity
          from the DateEvent branch below.
        test_recipe:
          setup:
            - "An eligible pair a/b with a SUGGESTED introduction; member_a accepts (ONE_SIDED); member_b declines (DECLINED, credit refunded)."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 12000, term_months: 6, guaranteed_introductions: 8, priority_match_enabled: false, included_coaching_sessions: 3, coaching_value_cents: 5000, background_check_addon_cents: 2500 }
              as: BillingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /members"
              payload: { email: "a2@x.com", full_name: "A2", birth_date: "1990-01-01T00:00:00Z", city: "NYC", gender: "MALE" }
              as: ScreeningOfficer
              captures: { a_id: $.data.id }
            - call: "POST /members/${a_id}/screenings"
              payload: { questionnaire_score: 90, identity_verified: true }
              as: ScreeningOfficer
              captures: { a_scr: $.data.id }
            - call: "POST /members/${a_id}/screenings/${a_scr}/decide"
              payload: { decision: "APPROVED" }
              as: ScreeningOfficer
            - call: "POST /members/${a_id}/memberships"
              payload: { plan_id: "${plan_id}" }
              as: BillingAdmin
