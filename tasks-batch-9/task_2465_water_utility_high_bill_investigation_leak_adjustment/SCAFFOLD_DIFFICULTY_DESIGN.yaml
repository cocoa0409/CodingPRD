      # -------- metric: balance_cents, integer granularity, STRICT > --------
      - name: boundary_past_due_balance_strict_greater_than_five_thousand_cents
        grounds:
          - calculations.account_credit_status
          - entities.ServiceAccount.fields.balance_cents
          - entities.ServiceAccount.fields.credit_status
          - state_machines.ServiceAccount
          - endpoints[POST /service-accounts/{id}/payments]
        distinguishing_aspect: |
          METRIC balance_cents on ENDPOINT POST /service-accounts/{id}/payments — a third distinct
          metric on a third distinct endpoint. Granularity is a single cent and the comparison is
          STRICT: 5001 cents is PAST_DUE, 5000 cents is CURRENT and 4999 cents is CURRENT. The
          same one-cent step also flips service_status, because credit_status becoming CURRENT
          drives SHUTOFF_SCHEDULED to ACTIVE. An implementation using greater-than-or-equal would
          hold the account delinquent at exactly the threshold.
        test_recipe:
          setup:
            - "RS-STD-2026 and BillingPeriod 2025-06 (SUMMER) exist; the clock is 2026-08-01T00:00:00Z."
            - "ServiceAccount ACC-1007 owns a 1.0 inch POTABLE_MASTER meter with reads 100000 and 104000, so its single ISSUED bill is 4000 gallons and 5210 cents."
            - "The account is therefore PAST_DUE at 5210 and a shutoff is scheduled for 2026-08-11."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RS-STD-2026", base_charge_cents: 1200, tier1_limit_gallons: 3000, tier1_rate_cents_per_kgal: 350, tier2_limit_gallons: 10000, tier2_rate_cents_per_kgal: 520, tier3_rate_cents_per_kgal: 890, summer_surcharge_bp: 1500, sewer_rate_cents_per_kgal: 610, sewer_cap_gallons: 12000, submeter_sewer_credit_cap_gallons: 8000, admin_fee_cents: 1500, admin_fee_waiver_threshold_cents: 10000 }
