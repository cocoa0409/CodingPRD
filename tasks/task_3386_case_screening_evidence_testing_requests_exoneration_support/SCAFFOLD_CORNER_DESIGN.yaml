      - name: waitlist_tie_break_uses_created_at_not_id
        claim_type: Correct Result
        grounds:
          - "calculations.waitlist_selection"
        distinguishing_aspect: "Selector determinism: two WAITLISTED requests with identical priority scores (both 51.51) are activated strictly in created_at ASC order — the earlier-created request wins the first activation, the other wins the second; id never participates."
        test_recipe:
          setup: ["Two intake requests with identical factors (MODERATE/UNCERTAIN/30y/NONE, both non-expedited), both decided WAITLISTED, created back to back (r_a before r_b)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /jurisdictions"
              payload: { state_code: "SC", name: "South Carolina", has_post_conviction_dna_statute: true, clemency_available: true, compensation_statute_exists: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Al Poe", inmate_number: "SC-1" }
              as: IntakeSpecialist
              captures: { cl: $.data.id }
            - call: "POST /intake-requests"
              payload: { client_id: "${cl}", jurisdiction_id: "${jur_id}", conviction_date: "2010-01-01T00:00:00Z", conviction_summary: "Tie A", claim_of_actual_innocence: true, claim_strength: "MODERATE", evidence_potential: "UNCERTAIN", years_served: 30, health_urgency: "NONE" }
              as: IntakeSpecialist
              captures: { r_a: $.data.id }
            - call: "POST /intake-requests"
              payload: { client_id: "${cl}", jurisdiction_id: "${jur_id}", conviction_date: "2010-01-01T00:00:00Z", conviction_summary: "Tie B", claim_of_actual_innocence: true, claim_strength: "MODERATE", evidence_potential: "UNCERTAIN", years_served: 30, health_urgency: "NONE" }
              as: IntakeSpecialist
              captures: { r_b: $.data.id }
            - { call: "POST /intake-requests/${r_a}/advance", payload: { event: "BEGIN_SCREENING" }, as: IntakeSpecialist }
            - { call: "POST /intake-requests/${r_b}/advance", payload: { event: "BEGIN_SCREENING" }, as: IntakeSpecialist }
            - { call: "POST /intake-requests/${r_a}/advance", payload: { event: "RECOMMEND", recommendation: "WAITLIST" }, as: IntakeSpecialist, as_user_id: "spec_1" }
            - { call: "POST /intake-requests/${r_b}/advance", payload: { event: "RECOMMEND", recommendation: "WAITLIST" }, as: IntakeSpecialist, as_user_id: "spec_1" }
            - { call: "POST /intake-requests/${r_a}/decide", payload: { decision: "WAITLISTED" }, as: ManagingAttorney, as_user_id: "ma_1" }
            - { call: "POST /intake-requests/${r_b}/decide", payload: { decision: "WAITLISTED" }, as: ManagingAttorney, as_user_id: "ma_1" }
          trigger:
            - call: "POST /intake-requests/activate-waitlist-next"
              payload: {}
              as: ManagingAttorney
              captures: { first_id: $.data.id, first_score: $.data.waitlist_priority_score }
            - call: "POST /intake-requests/activate-waitlist-next"
              payload: {}
              as: ManagingAttorney
              captures: { second_id: $.data.id }
            - call: "POST /intake-requests/activate-waitlist-next"
              payload: {}
              as: ManagingAttorney
              captures: { err3: $.data.error_id }
          assert:
            - "first activation returns the EARLIER-created request (${r_a}) — tie on 51.51 broken by created_at ASC"
            - "second activation returns ${r_b}"
            - "both waitlist_priority_score == 51.51 (23.38 + 9.63 + 18.50 + 0.00)"
            - "after the second activation both requests are SCREENING and a third activation fails ERR_WAITLIST_EMPTY"

      - name: waitlist_variant_selection_flips_the_winner
        claim_type: Variant Selection
        grounds:
          - "calculations.screening_priority_score"
          - "calculations.waitlist_selection"
        distinguishing_aspect: "Variant selection is per-request: X (non-expedited) banks 66.55 STANDARD; Y (expedited, identical factors) banks 71.07 EXPEDITED, so Y is activated first — an implementation that scored Y under STANDARD would tie at 66.55 and created_at would hand the win to X."
        test_recipe:
          setup: ["Two WAITLISTED requests with fixture-A factors (STRONG/LIKELY_STORED/7y/CRITICAL): X created first, non-expedited; Y created second, expedited_review=true."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /jurisdictions"
              payload: { state_code: "ND", name: "North Dakota", has_post_conviction_dna_statute: true, clemency_available: true, compensation_statute_exists: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Cy Wren", inmate_number: "ND-1" }
              as: IntakeSpecialist
              captures: { cl: $.data.id }
            - call: "POST /intake-requests"
              payload: { client_id: "${cl}", jurisdiction_id: "${jur_id}", conviction_date: "2019-05-01T00:00:00Z", conviction_summary: "Variant X", claim_of_actual_innocence: true, claim_strength: "STRONG", evidence_potential: "LIKELY_STORED", years_served: 7, health_urgency: "CRITICAL", expedited_review: false }
              as: IntakeSpecialist
              captures: { r_x: $.data.id }
            - call: "POST /intake-requests"
              payload: { client_id: "${cl}", jurisdiction_id: "${jur_id}", conviction_date: "2019-05-01T00:00:00Z", conviction_summary: "Variant Y", claim_of_actual_innocence: true, claim_strength: "STRONG", evidence_potential: "LIKELY_STORED", years_served: 7, health_urgency: "CRITICAL", expedited_review: true }
              as: IntakeSpecialist
              captures: { r_y: $.data.id }
            - { call: "POST /intake-requests/${r_x}/advance", payload: { event: "BEGIN_SCREENING" }, as: IntakeSpecialist }
            - { call: "POST /intake-requests/${r_y}/advance", payload: { event: "BEGIN_SCREENING" }, as: IntakeSpecialist }
            - { call: "POST /intake-requests/${r_x}/advance", payload: { event: "RECOMMEND", recommendation: "WAITLIST" }, as: IntakeSpecialist, as_user_id: "spec_1" }
            - { call: "POST /intake-requests/${r_y}/advance", payload: { event: "RECOMMEND", recommendation: "WAITLIST" }, as: IntakeSpecialist, as_user_id: "spec_1" }
            - { call: "POST /intake-requests/${r_x}/decide", payload: { decision: "WAITLISTED" }, as: ManagingAttorney, as_user_id: "ma_1" }
            - { call: "POST /intake-requests/${r_y}/decide", payload: { decision: "WAITLISTED" }, as: ManagingAttorney, as_user_id: "ma_1" }
          trigger:
            - call: "POST /intake-requests/activate-waitlist-next"
              payload: {}
              as: ManagingAttorney
              captures: { winner: $.data.id }
          assert:
            - "the activated request is ${r_y} (71.07 EXPEDITED beats 66.55 STANDARD)"
            - "had Y been scored STANDARD it would tie 66.55 and lose the created_at tie-break to X — the variant choice is observable in the winner's identity"

