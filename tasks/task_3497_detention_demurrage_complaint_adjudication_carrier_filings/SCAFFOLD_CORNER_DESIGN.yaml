          - errors.ERR_BOND_REVERSAL_EXCEEDED
          - calculations.bond_coverage_tracking
        distinguishing_aspect: "The bond ledger's two fiscal guards: a draw of 8000000 against 7500000 available is 402 ERR_BOND_COVERAGE_EXCEEDED; a reversal of 1 cent against zero drawn is 402 ERR_BOND_REVERSAL_EXCEEDED; and a draw of exactly the full 7500000 available succeeds (== admitted), exhausting the bond and suspending the license."
        test_recipe:
          setup:
            - "NVOCC carrier with an ACTIVE license via one 7500000-cent bond B1."
          setup_api_calls:
            - *c_clock
            - call: "POST /fmc/carriers"
              payload: { org_name: "Ledger Limit Forwarders", org_type: "NVOCC" }
              as: CommissionAdmin
              captures: { carrier_id: $.data.id }
