      - name: every_mutation_advances_the_version_by_exactly_one
        claim_type: optimistic_concurrency
        grounds:
          - entities[PhysicalRun].common_fields
          - endpoints[POST /physical-runs/{id}/manufacture]
          - endpoints[POST /physical-runs/{id}/record-returns]
        distinguishing_aspect: |
          The OCC rules are only usable if version starts at 1 and advances by exactly one per
          mutation — including on a SELF-LOOP (record-returns leaves the fulfilment status at
          SHIPPED) and on a cascaded write (the ship hop also rewrites Release and DistributionDeal
          totals). A six-hop walk over one run pins the sequence 1..6 and checks that a plain GET
          between hops never advances it.
