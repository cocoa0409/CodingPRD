          rationale: "That instance shows the community-involvement check answering before the alternative ownership lookup resolves."

  # No bulk-mutation endpoint exists in this API (every write acts on one entity), so the
  # claim-extraction guide's "Bulk action" row has no applicable instance in this scaffold.
  - section: endpoints
    instances:

      - name: corner_site_list_filters_combine_with_pagination
        claim_type: standard_crud
        grounds:
          - endpoints[GET /sites]
          - entities.Site.fields.listing_status
          - entities.Site.fields.epa_region
          - entities.Site.fields.cost_posture
        distinguishing_aspect: "listing_status, epa_region and cost_posture filters compose with limit/offset: the filtered total_count is the filtered population (1), not the table size (3), and has_more is computed after filtering."
        test_recipe:
          setup:
            - "Three sites created in a known order: S1 region 5 LISTED, S2 region 5 PROPOSED (score below threshold), S3 region 9 LISTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-04T08:00:00Z" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites"
              payload: { name: "Alder Bay Shipyard", epa_region: 5, hrs_score: 40.00 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { site_1: $.data.id }
            - call: "POST /sites"
              payload: { name: "Bramble Lane Dry Cleaner", epa_region: 5, hrs_score: 30.00 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { site_2: $.data.id }
            - call: "POST /sites"
              payload: { name: "Cinnabar Mesa Mill Tailings", epa_region: 9, hrs_score: 60.00 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { site_3: $.data.id }
            - call: "POST /sites/${site_1}/list-on-npl"
              payload: { listing_reference: "FR-2027-ABS-0104" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites/${site_3}/list-on-npl"
              payload: { listing_reference: "FR-2027-CMM-0104" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
          trigger:
            - call: "GET /sites?listing_status=LISTED&epa_region=5"
              payload: {}
              as: CommunityMember
              as_user_id: "cm-001"
            - call: "GET /sites?limit=2&offset=0"
              payload: {}
              as: CommunityMember
              as_user_id: "cm-001"
            - call: "GET /sites?cost_posture=OPEN&limit=100"
              payload: {}
              as: CommunityMember
              as_user_id: "cm-001"
          assert:
            - "the composed filter returns HTTP 200 with exactly 1 row (${site_1}), total_count == 1, has_more == false"
            - "the unfiltered first page returns rows ${site_3} then ${site_2} - GET /sites is newest-first (created_at DESC, then name ASC) - with total_count == 3, limit == 2, offset == 0, has_more == true"
            - "the cost_posture filter returns all 3 rows: every site is OPEN because none has a decree, an over-utilised cap or a pending amendment"
            - "response_type == array on all three reads and meta.api_request_id is present on each"

      - name: corner_verification_at_a_reduced_volume_rewrites_the_derived_totals
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /waste-in-records/{id}/verification]
          - state_machines.WasteInRecord.SUBMITTED_to_VERIFIED
          - entities.WasteInRecord.fields.effective_volume_tons
          - entities.PotentiallyResponsibleParty.fields.volumetric_share_pct
          - calculations.de_minimis_eligibility
        distinguishing_aspect: "Verifying a 500-ton claim at 300 tons is accepted (300 <= 500) and every derived total follows the verified figure, not the claim: site 300 tons, party share 100.00, and de_minimis_eligible stays false because the party is far above both de minimis ceilings."
        test_recipe:
          setup:
            - "Site LISTED with one PARTICIPATING party holding a single SUBMITTED 500-ton class III record."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-01T09:00:00Z" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites"
              payload: { name: "Draper Hollow Pigment Works", epa_region: 3, hrs_score: 41.90 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { site_id: $.data.id }
            - call: "POST /sites/${site_id}/list-on-npl"
              payload: { listing_reference: "FR-2027-DHP-0201" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites/${site_id}/prps"
              payload: { legal_name: "Draper Pigment Co", party_type: "OWNER_OPERATOR", viability_score: 66 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { prp_a: $.data.id }
            - call: "POST /prps/${prp_a}/notice"
              payload: { notice_reference: "GNL-2027-6001" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /prps/${prp_a}/response"
              payload: { election: "PARTICIPATE" }
              as: PRPRepresentative
              as_user_id: "${prp_a}"
            - call: "POST /sites/${site_id}/waste-in-records"
              payload: { prp_id: "${prp_a}", volume_tons: 500, toxicity_class: "III", evidence_grade: "B", disposal_year: 1980, transporter_name: "Havers Bulk Haulage" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { w_a: $.data.id }
          trigger:
            - call: "POST /waste-in-records/${w_a}/verification"
              payload: { decision: "VERIFIED", verified_volume_tons: 300, verification_note: "Two of five manifests were duplicates." }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
          assert:
            - "HTTP 200 with WasteInRecord.${w_a}.status == VERIFIED, verified_volume_tons == 300, volume_tons still 500"
            - "WasteInRecord.${w_a}.effective_volume_tons == 300 - the verified figure wins once the record is VERIFIED"
            - "Site.${site_id}.verified_waste_volume_tons == 300"
            - "PotentiallyResponsibleParty.${prp_a}.verified_volume_tons == 300, volumetric_share_pct == 100.00, max_toxicity_class == III"
            - "PotentiallyResponsibleParty.${prp_a}.de_minimis_eligible == false: the class III test passes but the 1.00 share ceiling and the 110.00 ton ceiling both fail"

      - name: corner_rod_can_only_cite_an_investigation_of_its_own_site_not_found
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /sites/{id}/records-of-decision]
          - validations[priority=5]
          - errors[ERR_REMEDIAL_INVESTIGATION_NOT_FOUND]
          - entities.RecordOfDecision.fields.remedial_investigation_id
        distinguishing_aspect: "The payload FK is resolved within the path site: an existing RI that belongs to a different site is reported as ERR_REMEDIAL_INVESTIGATION_NOT_FOUND (404), while the same call against the site's own RI creates the association."
        test_recipe:
          setup:
            - "Two LISTED sites, each with one DRAFT RI/FS."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-01T09:00:00Z" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites"
              payload: { name: "Everly Ford Plating", epa_region: 4, hrs_score: 45.10 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { site_a: $.data.id }
            - call: "POST /sites/${site_a}/list-on-npl"
              payload: { listing_reference: "FR-2027-EFP-0201" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites/${site_a}/remedial-investigations"
              payload: { scope_summary: "OU-1 cyanide in soil", exposure_medium: "SOIL" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { ri_a: $.data.id }
            - call: "POST /sites"
              payload: { name: "Foxglove Bend Refinery", epa_region: 4, hrs_score: 49.80 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { site_b: $.data.id }
            - call: "POST /sites/${site_b}/list-on-npl"
              payload: { listing_reference: "FR-2027-FBR-0201" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites/${site_b}/remedial-investigations"
              payload: { scope_summary: "OU-1 LNAPL beneath the tank farm", exposure_medium: "GROUNDWATER" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { ri_b: $.data.id }
          trigger:
            - call: "POST /sites/${site_a}/records-of-decision"
              payload: { remedial_investigation_id: "${ri_b}", proposed_plan_summary: "Borrowed from the neighbouring site", comment_period_days: 30 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { err: $.data.error_id }
            - call: "POST /sites/${site_a}/records-of-decision"
              payload: { remedial_investigation_id: "${ri_a}", proposed_plan_summary: "Soil excavation with cyanide destruction", comment_period_days: 45 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { rod_a: $.data.id }
          assert:
            - "the foreign-RI call returns HTTP 404 with $.data.error_id == ERR_REMEDIAL_INVESTIGATION_NOT_FOUND and creates no RecordOfDecision"
            - "the own-RI call returns HTTP 201 with RecordOfDecision.${rod_a}.site_id == ${site_a}, remedial_investigation_id == ${ri_a}, status == DRAFT, comment_period_days == 45"
            - "RecordOfDecision.${rod_a}.public_comments_count == 0, comment_period_start == null, comment_period_end == null, selected_alternative_id == null"
            - "GET /sites/${site_a}/records-of-decision returns total_count == 1 and GET /sites/${site_b}/records-of-decision returns total_count == 0"

      - name: corner_cost_ledger_read_balances_before_any_round_is_adopted
        claim_type: computed_read
        grounds:
          - endpoints[GET /sites/{id}/cost-ledger]
          - calculations.cost_recovery_ledger
          - calculations.oversight_cost_reimbursement
        distinguishing_aspect: "The ledger read is derived, never stored: with one 9000000 posting and no decree, no contract and no adopted round it reports the money identity satisfied (ledger_balanced true) while the share triple is 0.00 / 0.00 / 0.00 rather than summing to 100.00, because the share identity only exists once a round is ADOPTED."
        test_recipe:
          setup:
            - "Site LISTED with a single oversight posting of 9000000 and nothing else."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-05-19T08:00:00Z" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites"
              payload: { name: "Sorrel Gap Uranium Mill", epa_region: 8, hrs_score: 57.60 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { site_id: $.data.id }
            - call: "POST /sites/${site_id}/list-on-npl"
              payload: { listing_reference: "FR-2027-SGU-0519" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites/${site_id}/oversight-costs"
              payload: { incurred_cents: 9000000, cost_category: "RI_FS_OVERSIGHT", incurred_on: "2027-05-19" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
          trigger:
            - call: "GET /sites/${site_id}/cost-ledger"
              payload: {}
              as: CommunityMember
              as_user_id: "cm-001"
          assert:
            - "HTTP 200 with oversight_direct_cents == 9000000, oversight_indirect_rate_bp == 1275, oversight_indirect_cents == 1147500, oversight_billed_cents == 10147500"
            - "total_response_cost_cents == 10147500 (no contract has been awarded, so the whole total is oversight)"
            - "recovered_cost_cents == 0, orphan_write_off_cents == 0, unrecovered_cost_cents == 10147500"
            - "ledger_balanced == true: 0 + 0 + 10147500 equals total_response_cost_cents exactly"
            - "oversight_cap_utilization_pct == null, allocated_share_total_pct == 0.00, orphan_share_pct == 0.00, settled_share_pct == 0.00"
            - "the read is available to every role and mutates nothing: Site.${site_id}.version is unchanged by the GET"

      - name: corner_five_year_review_is_only_allowed_once_the_cycle_is_due
        claim_type: conditional_action
        grounds:
          - endpoints[POST /sites/{id}/five-year-review]
          - validations[priority=28]
        excluded_because:
          difficulty_instance: transitive_cascade / not_protective_five_year_review_cascades_three_hops_into_cost_posture
          rationale: "That instance drives construction completion, the due-date arithmetic and the review itself, including the NOT_PROTECTIVE branch."

      - name: corner_de_minimis_offer_endpoint_stamps_the_frozen_premium_floor
        claim_type: conditional_action
