            - { call: "POST /api/airspace-authorizations", payload: { show_event_id: "${show_b}", window_start: "2026-08-12T18:00:00Z", window_end: "2026-08-12T21:00:00Z", altitude_ceiling_ft: 450, waiver_types: ["NIGHT_OPS"] }, as: ProductionPlanner, captures: { auth_b: $.data.id } }
            - { call: "POST /api/airspace-authorizations/${auth_b}/submit", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/airspace-authorizations/${auth_b}/decide", payload: { decision: "APPROVED" }, as: AuthorityOfficer, as_user_id: "ao-1" }
            - { call: "POST /api/show-events/${show_b}/authorize", payload: { authorization_id: "${auth_b}" }, as: ProductionPlanner }
            - { call: "POST /api/launch-grid-assignments", payload: { show_event_id: "${show_b}", drone_id: "${d1}", grid_row: 0, grid_col: 0 }, as: FleetManager, captures: { asg_b1: $.data.id } }
            - { call: "POST /api/launch-grid-assignments", payload: { show_event_id: "${show_b}", drone_id: "${d2}", grid_row: 0, grid_col: 1 }, as: FleetManager, captures: { asg_b2: $.data.id } }
            - { call: "GET /api/show-events/${show_b}", as: ProductionPlanner, captures: { b_ready: $.data.lifecycle_status } }
            - { call: "POST /api/incident-reports", payload: { show_event_id: "${show_a}", severity: "CRITICAL", description: "Mid-air collision during finale" }, as: SafetyOfficer, as_user_id: "so-1", captures: { inc_id: $.data.id } }
            - { call: "POST /api/incident-reports/${inc_id}/investigate", payload: {}, as: SafetyOfficer, as_user_id: "so-1" }
          trigger:
            - { call: "POST /api/incident-reports/${inc_id}/close", payload: { outcome: "CONFIRMED" }, as: SafetyOfficer, as_user_id: "so-2", captures: { inc_status: $.data.status } }
            - { call: "GET /api/drones/${d1}", as: FleetManager, captures: { d1_status: $.data.status } }
            - { call: "GET /api/launch-grid-assignments/${asg_b1}", as: FleetManager, captures: { asg_b1_status: $.data.status } }
            - { call: "GET /api/show-events/${show_b}", as: ProductionPlanner, captures: { b_status: $.data.lifecycle_status, b_count: $.data.assigned_count, b_posture: $.data.readiness_posture } }
            - { call: "GET /api/airspace-authorizations/${auth_a}", as: ProductionPlanner, captures: { auth_a_status: $.data.status } }
          assert:
            - "setup held: Show B reached READY (${b_ready} == READY) before the incident closed"
            - "${inc_status} == CLOSED_CONFIRMED"
            - "link 1: ${d1_status} == GROUNDED (flew Show A; CRITICAL grounds all flown drones)"
            - "link 2: ${asg_b1_status} == VOIDED (grounding voided its future ASSIGNED slot)"
            - "link 3: ${b_status} == AUTHORIZED and ${b_count} == 0 and ${b_posture} == NOT_READY (grid incomplete -> READY -> AUTHORIZED)"
            - "sibling hop: ${auth_a_status} == REVOKED (CRITICAL on the executed show revokes its authorization)"

      - name: design_relock_repin_downgrade_cascade
        grounds:
          - state_machines.ShowDesign.SIMULATED_to_LOCKED
          - state_machines.ShowDesign.LOCKED_to_SUPERSEDED
          - state_machines.ShowEvent
          - concurrency_rules[design-lock-stale-show]
        distinguishing_aspect: |
          Depth-2 chain from a second design lock (different trigger than the
          incident cascade): locking design D2 supersedes the currently LOCKED
          D1 (link 1); the supersede re-pins the show and downgrades it from
          AUTHORIZED to DESIGN_LOCKED (link 2), invalidating its readiness.
        test_recipe:
          setup:
            - "Site A; Show S (10 drones) in AUTHORIZED via design D1 (300ft/10), safety config APPROVED, authorization APPROVED"
          setup_api_calls:
