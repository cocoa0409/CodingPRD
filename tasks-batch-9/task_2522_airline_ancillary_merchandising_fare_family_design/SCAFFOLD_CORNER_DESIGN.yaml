            - "HTTP status is 201 with candidate_count 1 and one presented offer"
            - "the offer has touchpoint \"CHECKIN\", wtp_score_bp 10000 and offered_price_cents 3850 == round_half_up(3500 * 11000 / 10000)"
            - "expected_value_cents == 3850 and the price sits between the 2450 floor and the 6300 cap"
