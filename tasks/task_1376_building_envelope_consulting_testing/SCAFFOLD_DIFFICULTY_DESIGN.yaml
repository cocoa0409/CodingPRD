            - call: "POST /engagements/${eng_id}/warranty-claims/${claim2_id}/escalate"
              payload: {}
              as: Consultant
              captures: { err2: $.data.error_id }
          assert:
            - "err1 == ERR_ESCALATION_WINDOW_NOT_ELAPSED (DENIED at 2026-09-01, due 2026-10-01, clock still 2026-09-01: state passes, temporal fails)"
            - "err2 == ERR_CLAIM_NOT_ACTIONABLE (window elapsed but state precondition priority 7 fires before temporal priority 9)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (two instances, different metrics+endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: field_test_leakage_equality_passes
        grounds:
          - calculations.field_test_result_calc
          - state_machines.FieldTest.IN_PROGRESS_to_RESULT_RECORDED
        distinguishing_aspect: |
          Metric = measured vs pressure-scaled allowable leakage (continuous
          threshold), endpoint = POST .../field-tests/{id}/record-result.
          required 1.5 at 150 Pa gives allowable exactly 3.0; measured == 3.0
          is PASS (<= boundary inclusive) while 3.0001 is FAIL — one ten-
          thousandth flips the outcome and FAIL additionally spawns an anomaly
          and a -25 risk delta.
        test_recipe:
          setup:
            - "Engagement IN_PROGRESS OPEN; assembly APPROVED with required_airtightness 1.5; two field tests at pressure 150 driven to IN_PROGRESS"
          setup_api_calls:
            - call: "POST /engagements"
              payload: { name: "E11", client_name: "C11", fee_cap_cents: 50000000, labor_rate_cents_per_hour: 15000 }
              as: Principal
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Principal
            - call: "POST /engagements/${eng_id}/assemblies"
              payload: { tag: "W11", assembly_type: "WINDOW_WALL", design_u_factor: 2.0, required_airtightness_lps_m2: 1.5 }
              as: Consultant
              captures: { asm_id: $.data.id }
            - call: "POST /engagements/${eng_id}/design-reviews"
              payload: { assembly_id: "${asm_id}", barrier_scope: ["AIR"], drawing_count: 1 }
              as: Consultant
              captures: { rev_id: $.data.id }
            - call: "POST /engagements/${eng_id}/design-reviews/${rev_id}/start-review"
              payload: {}
              as: Reviewer
              as_user_id: "rev-user-1"
            - call: "POST /engagements/${eng_id}/design-reviews/${rev_id}/approve"
              payload: {}
              as: Reviewer
              as_user_id: "rev-user-1"
            - call: "POST /engagements/${eng_id}/field-tests"
              payload: { assembly_id: "${asm_id}", test_method: "ASTM_E783", test_date: "2026-09-10", test_pressure_pa: 150 }
              as: Consultant
              captures: { ft_pass_id: $.data.id }
            - call: "POST /engagements/${eng_id}/field-tests"
              payload: { assembly_id: "${asm_id}", test_method: "ASTM_E783", test_date: "2026-09-11", test_pressure_pa: 150 }
              as: Consultant
              captures: { ft_fail_id: $.data.id }
            - call: "POST /engagements/${eng_id}/field-tests/${ft_pass_id}/begin"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-user-1"
            - call: "POST /engagements/${eng_id}/field-tests/${ft_fail_id}/begin"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-user-1"
          trigger:
            - call: "POST /engagements/${eng_id}/field-tests/${ft_pass_id}/record-result"
              payload: { measured_leakage_lps_m2: 3.0 }
              as: FieldTechnician
              as_user_id: "tech-user-1"
              captures: { result_pass: $.data.result }
            - call: "POST /engagements/${eng_id}/field-tests/${ft_fail_id}/record-result"
              payload: { measured_leakage_lps_m2: 3.0001 }
              as: FieldTechnician
              as_user_id: "tech-user-1"
              captures: { result_fail: $.data.result }
          assert:
            - "FieldTest.${ft_pass_id}.result == PASS (measured == allowable 3.0, boundary inclusive)"
            - "FieldTest.${ft_pass_id}.diagnosis_status == NOT_REQUIRED"
            - "FieldTest.${ft_fail_id}.result == FAIL (3.0001 > 3.0)"
            - "FieldTest.${ft_fail_id}.diagnosis_status == UNDIAGNOSED"
            - "Engagement.${eng_id}.risk_score == 75 (single -25 from the FAIL)"
      - name: chamber_slot_adjacent_window_allowed
        grounds:
          - validations[priority=10]
          - entities.ChamberSlot.fields.end_date
        distinguishing_aspect: |
          Metric = interval adjacency on a discrete day axis (empty-intersection
          edge, not a numeric magnitude), endpoint = POST .../chamber-slots.
          Half-open [start,end): a new slot whose start_date equals the existing
          slot's end_date shares zero days and MUST be accepted; shifting one
          day earlier (end - 1) MUST be rejected with ERR_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Engagement IN_PROGRESS; existing slot CHAMBER-B [2026-09-01, 2026-09-05) RESERVED"
          setup_api_calls:
            - call: "POST /engagements"
              payload: { name: "E12", client_name: "C12", fee_cap_cents: 50000000, labor_rate_cents_per_hour: 15000 }
              as: Principal
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Principal
            - call: "POST /engagements/${eng_id}/chamber-slots"
              payload: { chamber_code: "CHAMBER-B", start_date: "2026-09-01", end_date: "2026-09-05", daily_rate_cents: 100000 }
              as: Consultant
              captures: { slot1_id: $.data.id }
          trigger:
            - call: "POST /engagements/${eng_id}/chamber-slots"
              payload: { chamber_code: "CHAMBER-B", start_date: "2026-09-05", end_date: "2026-09-08", daily_rate_cents: 100000 }
              as: Consultant
              captures: { slot2_id: $.data.id }
            - call: "POST /engagements/${eng_id}/chamber-slots"
              payload: { chamber_code: "CHAMBER-B", start_date: "2026-09-04", end_date: "2026-09-06", daily_rate_cents: 100000 }
              as: Consultant
              captures: { err: $.data.error_id }
          assert:
            - "adjacent slot [2026-09-05, 2026-09-08) created successfully (touching boundary is disjoint under half-open semantics)"
            - "ChamberSlot.${slot2_id}.status == RESERVED"
            - "overlapping slot [2026-09-04, 2026-09-06) rejected with ERR_WINDOW_OVERLAP (409)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (two instances, different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: field_test_begin_requires_assembly_approved
