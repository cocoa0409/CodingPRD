    side_effects: ["Pod.status := LICENSING_REVIEW", "Pod.posture := RESTRICTED"]
  - method: GET
    path: /pods/{id}/licensing-determinations
    description: List determinations for a pod
    roles: [PlatformAdmin, PodOperator, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "determination_status?"]
    output: LicensingDetermination[]
    side_effects: []
  - method: GET
    path: /licensing-determinations/{id}
