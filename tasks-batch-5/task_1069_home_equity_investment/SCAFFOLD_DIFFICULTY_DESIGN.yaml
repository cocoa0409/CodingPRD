        grounds:
          - validations[priority=10]
          - entities.Inspection.fields.scheduled_date
          - errors[ERR_INSPECTOR_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Whole-day-exclusivity semantics on the Inspector resource: a second inspection for the same inspector
          on the identical scheduled_date 2026-09-01 (date granularity, no time-of-day, no buffer) is rejected
          ERR_INSPECTOR_DOUBLE_BOOKED — different interval arithmetic than the appraiser buffer.
        test_recipe:
          setup:
