              captures: { pass_a_v: "$.data.version" }
            - call: "POST /season-passes/${pass_a}/payment-plans"
              payload: { down_payment_cents: 3000, installment_count: 4, first_due_date: "2026-09-01", expected_season_pass_version: "${pass_a_v}" }
              as: PassOfficeClerk
              captures: { plan_a: "$.data.id" }
            - call: "GET /installments?payment_plan_id=${plan_a}"
              as: PassOfficeClerk
              captures: { inst_1: "$.data[0].id", inst_2: "$.data[1].id", inst_3: "$.data[2].id", inst_4: "$.data[3].id" }
            - call: "POST /installments/${inst_1}/settle"
              payload: { amount_cents: 2625 }
              as: PassOfficeClerk
            - call: "POST /installments/${inst_2}/settle"
              payload: { amount_cents: 2625 }
              as: PassOfficeClerk
            - call: "POST /installments/${inst_3}/settle"
              payload: { amount_cents: 2625 }
              as: PassOfficeClerk
          trigger:
            - call: "POST /installments/${inst_4}/settle"
              payload: { amount_cents: 2625 }
              as: PassOfficeClerk
          assert:
            - "trigger response data.status == 'SETTLED' and data.settled_at == '2026-08-01T00:00:00Z' (the logical clock)"
            - "GET /payment-plans/${plan_a} → data.plan_status == 'COMPLETED', data.settled_count == 4, data.missed_count == 0"
            - "GET /season-passes/${pass_a} → data.billing_status == 'PAID_IN_FULL', data.paid_to_date_cents == 13500, data.billed_total_cents == 13500, data.outstanding_balance_cents == 0"
            - "GET /season-passes/${pass_a} → data.pass_status == 'ACTIVE' (the access dimension never moved)"
            - "a further POST /installments/${inst_4}/settle returns HTTP 409 with error_id == 'ERR_INSTALLMENT_NOT_PAYABLE'"

      - name: capacity_lock_blocks_low_ranks_and_cancels_their_reservations
        claim_type: side_effect_execution
        grounds:
          - state_machines.ParkDay.STANDARD_to_CAPACITY_LOCKED
          - state_machines.Reservation.CONFIRMED_to_CANCELLED_BY_BLOCKOUT
          - entities.BlockoutAssignment.fields.source
          - endpoints[POST /park-days/{park_day_id}/forecast]
        distinguishing_aspect: "Conditional cascade: the lock auto-blocks only PUBLISHED tiers with tier_rank <= capacity_lock_blockout_max_rank (BRONZE rank 1, not GOLD rank 3), and only the reservations of the newly blocked tier are cancelled — with the day's slot capacities re-derived from the higher forecast."
        test_recipe:
          setup:
            - "Program in SEASON_ACTIVE with PUBLISHED BRONZE (rank 1) and GOLD (rank 3); capacity_lock_blockout_max_rank 2."
            - "ParkDay 2026-09-28 with capacity_total 1000 and forecast_attendance 100 → STANDARD, reservation_slot_capacity 100."
            - "A processed ACTIVE BRONZE pass and a processed ACTIVE GOLD pass, each holding a CONFIRMED reservation for [09:00, 12:00) on that day."
          setup_api_calls:
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "BRONZE", tier_rank: 1, base_price_cents: 12000, parking_benefit: "NONE", in_park_discount_pct: 0.05, reservation_required_on_peak: true, peak_reservation_quota: 2 }
              as: ProgramAdmin
              captures: { bronze: "$.data.id" }
            - call: "POST /pass-tiers/${bronze}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "GOLD", tier_rank: 3, base_price_cents: 30000, parking_benefit: "INCLUDED", in_park_discount_pct: 0.15, reservation_required_on_peak: false, peak_reservation_quota: 5 }
              as: ProgramAdmin
              captures: { gold: "$.data.id" }
            - call: "POST /pass-tiers/${gold}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SALES_OPEN" }
              as: ProgramAdmin
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-09-28", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
              captures: { day_928: "$.data.id" }
            - call: "POST /passholders"
              payload: { full_name: "Ada Holder", email: "ada@example.com", date_of_birth: "1990-04-02" }
              as: PassOfficeClerk
              captures: { holder_a: "$.data.id" }
            - call: "POST /passholders"
              payload: { full_name: "Ben Holder", email: "ben@example.com", date_of_birth: "1988-06-11" }
              as: PassOfficeClerk
              captures: { holder_b: "$.data.id" }
            - call: "POST /season-passes"
              payload: { program_id: "${prog}", tier_id: "${bronze}", passholder_id: "${holder_a}", payment_mode: "PAY_IN_FULL" }
              as: PassOfficeClerk
              captures: { pass_bronze: "$.data.id" }
            - call: "POST /season-passes/${pass_bronze}/process"
              payload: { photo_hash: "sha256:aaa", government_id_last4: "1234" }
              as: PassOfficeClerk
            - call: "POST /season-passes"
              payload: { program_id: "${prog}", tier_id: "${gold}", passholder_id: "${holder_b}", payment_mode: "PAY_IN_FULL" }
              as: PassOfficeClerk
              captures: { pass_gold: "$.data.id" }
            - call: "POST /season-passes/${pass_gold}/process"
              payload: { photo_hash: "sha256:bbb", government_id_last4: "5678" }
              as: PassOfficeClerk
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SEASON_ACTIVE" }
              as: ProgramAdmin
            - call: "POST /reservations"
              payload: { season_pass_id: "${pass_bronze}", park_day_id: "${day_928}", arrival_window_start: "09:00", arrival_window_end: "12:00" }
              as: PassOfficeClerk
              captures: { res_bronze: "$.data.id" }
            - call: "POST /reservations"
              payload: { season_pass_id: "${pass_gold}", park_day_id: "${day_928}", arrival_window_start: "09:00", arrival_window_end: "12:00" }
              as: PassOfficeClerk
              captures: { res_gold: "$.data.id" }
          trigger:
            - call: "POST /park-days/${day_928}/forecast"
              payload: { forecast_attendance: 975 }
              as: ProgramAdmin
          assert:
            - "trigger response data.forecast_utilization_pct == 0.9750 and data.day_class == 'CAPACITY_LOCKED'"
            - "trigger response data.reservation_slot_capacity == 25 (min(floor(1000 * 0.10) == 100, 1000 - 975 == 25)) and data.window_slot_capacity == 12 (max(1, floor(25 / 2)))"
            - "GET /blockout-assignments?park_day_id=${day_928} → data.total_count == 1 with data[0].tier_id == '${bronze}' and data[0].source == 'CAPACITY_ADJUSTED'"
            - "GET /reservations/${res_bronze} → data.status == 'CANCELLED_BY_BLOCKOUT'"
            - "GET /reservations/${res_gold} → data.status == 'CONFIRMED' (GOLD rank 3 > 2 was never blocked)"
            - "GET /park-days/${day_928} → data.reserved_count == 1, data.released_count == 1, data.grant_count == 2"
            - "a new POST /reservations on this day now returns HTTP 409 with error_id == 'ERR_PARK_DAY_CAPACITY_LOCKED'"

      - name: reinstate_cures_missed_installments_without_restoring_reservations
        claim_type: side_effect_execution
        grounds:
          - state_machines.SeasonPass.SUSPENDED_to_ACTIVE
          - state_machines.Installment.MISSED_to_SETTLED
          - endpoints[POST /season-passes/{pass_id}/reinstate]
        distinguishing_aspect: "Reinstatement is a deliberately partial compensation: the two MISSED installments become SETTLED and both dimensions recover (ACTIVE / PLAN_CURRENT), but the reservation released by the suspension stays CANCELLED_BY_SUSPENSION and the ParkDay unit stays in released_count."
        test_recipe:
          setup:
            - "Program in SEASON_ACTIVE with PUBLISHED BRONZE tier; ParkDay 2026-10-20 STANDARD (100/1000)."
            - "Processed BRONZE pass on a 4-installment plan (down 3000, 2625 x 4, due 2026-09-01 / 10-01 / 11-01 / 12-01) holding a CONFIRMED reservation for [09:00, 12:00) on 2026-10-20."
            - "A billing run as_of 2026-10-02 marks two installments MISSED → billing DELINQUENT, pass SUSPENDED, reservation released."
          setup_api_calls:
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "BRONZE", tier_rank: 1, base_price_cents: 12000, parking_benefit: "NONE", in_park_discount_pct: 0.05, reservation_required_on_peak: true, peak_reservation_quota: 2 }
              as: ProgramAdmin
              captures: { bronze: "$.data.id" }
            - call: "POST /pass-tiers/${bronze}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SALES_OPEN" }
              as: ProgramAdmin
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-10-20", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
              captures: { day_1020: "$.data.id" }
            - call: "POST /passholders"
              payload: { full_name: "Ada Holder", email: "ada@example.com", date_of_birth: "1990-04-02" }
              as: PassOfficeClerk
              captures: { holder_a: "$.data.id" }
            - call: "POST /season-passes"
              payload: { program_id: "${prog}", tier_id: "${bronze}", passholder_id: "${holder_a}", payment_mode: "PAYMENT_PLAN" }
              as: PassOfficeClerk
              captures: { pass_a: "$.data.id" }
            - call: "POST /season-passes/${pass_a}/process"
              payload: { photo_hash: "sha256:aaa", government_id_last4: "1234" }
              as: PassOfficeClerk
              captures: { pass_a_v: "$.data.version" }
            - call: "POST /season-passes/${pass_a}/payment-plans"
              payload: { down_payment_cents: 3000, installment_count: 4, first_due_date: "2026-09-01", expected_season_pass_version: "${pass_a_v}" }
              as: PassOfficeClerk
              captures: { plan_a: "$.data.id" }
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SEASON_ACTIVE" }
              as: ProgramAdmin
            - call: "POST /reservations"
              payload: { season_pass_id: "${pass_a}", park_day_id: "${day_1020}", arrival_window_start: "09:00", arrival_window_end: "12:00" }
              as: PassOfficeClerk
              captures: { res_a: "$.data.id" }
            - call: "POST /pass-programs/${prog}/billing-runs"
              payload: { as_of_date: "2026-10-02" }
              as: ProgramAdmin
          trigger:
            - call: "POST /season-passes/${pass_a}/reinstate"
              payload: { cure_amount_cents: 5250 }
              as: PassOfficeClerk
          assert:
            - "trigger response data.pass_status == 'ACTIVE' and data.billing_status == 'PLAN_CURRENT'"
            - "trigger response data.paid_to_date_cents == 8250 (3000 down + 5250 cure) and data.outstanding_balance_cents == 5250"
            - "trigger response data.suspension_count == 1 (the historical counter is not undone)"
            - "GET /installments?payment_plan_id=${plan_a} → data[0].status == 'SETTLED', data[1].status == 'SETTLED', data[2].status == 'SCHEDULED', data[3].status == 'SCHEDULED'"
            - "GET /payment-plans/${plan_a} → data.missed_count == 0 and data.settled_count == 2"
            - "GET /reservations/${res_a} → data.status == 'CANCELLED_BY_SUSPENSION' (NOT restored)"
            - "GET /park-days/${day_1020} → data.reserved_count == 0, data.released_count == 1, data.grant_count == 1"

      - name: season_pass_parallel_dimensions_move_independently
        claim_type: valid_transition
        grounds:
          - state_machines.SeasonPass.billing_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / season_pass_parallel_billing_and_access_dimensions
          rationale: "The parallel state_machine_shape claim (independent dimensions, correct combined state) is exactly that instance's subject."

      - name: sharing_case_cyclic_shape_loops_back_to_under_review
        claim_type: valid_transition
        grounds:
          - state_machines.SharingCase.APPEAL_PENDING_to_UNDER_REVIEW
        excluded_because:
          difficulty_instance: non_linear_state_machine / sharing_case_appeal_cycle_returns_to_under_review
          rationale: "The cyclic-shape claim (loop back plus review_round termination condition) is asserted there end to end."

      - name: revocation_cascade_terminates_plan_and_voids_installments
        claim_type: side_effect_execution
        grounds:
          - state_machines.SeasonPass.ACTIVE_to_REVOKED
        excluded_because:
          difficulty_instance: transitive_cascade / substantiated_sharing_case_revokes_pass_terminates_plan_forfeits_revenue
          rationale: "Every level of the revocation cascade, including the VOIDED installments and the forfeited-revenue rollup, is asserted there."

      - name: blockout_lift_is_guarded_by_park_day_state
        claim_type: precondition_enforcement
        grounds:
          - state_machines.BlockoutAssignment.ACTIVE_to_LIFTED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / blockout_lift_blocked_when_park_day_capacity_locked
          rationale: "The guarded-transition claim (A→B only if entity C is in state X) is that instance's subject, including the auto-lift on release."

  # ===========================================================================
  # Calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: capacity_posture_reads_thresholds_from_the_program_row
        claim_type: constants_applied
        grounds:
          - calculations.park_day_capacity_posture
          - entities.PassProgram.fields.capacity_peak_threshold_pct
          - endpoints[POST /park-days]
        distinguishing_aspect: "The peak band comes from the program's own capacity_peak_threshold_pct, not from a hardcoded 0.85: identical 800/1000 days classify PEAK under a 0.80 program and STANDARD under a default 0.85 program, while RESERVATION_SHARE_PCT stays a global 0.10 in both."
        test_recipe:
          setup:
            - "Program TIGHT created with capacity_peak_threshold_pct 0.80; program LOOSE created with the default thresholds. Both in DESIGN."
          setup_api_calls:
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Tight Ridge", early_bird_deadline: "2026-11-15", capacity_peak_threshold_pct: 0.80 }
              as: ProgramAdmin
              captures: { prog_tight: "$.data.id" }
            - call: "POST /pass-programs"
              payload: { season_year: 2027, park_name: "Loose Ridge", early_bird_deadline: "2027-11-15" }
              as: ProgramAdmin
              captures: { prog_loose: "$.data.id" }
            - call: "POST /park-days"
              payload: { program_id: "${prog_loose}", calendar_date: "2026-09-05", capacity_total: 1000, forecast_attendance: 800 }
              as: ProgramAdmin
              captures: { day_loose: "$.data.id" }
          trigger:
            - call: "POST /park-days"
              payload: { program_id: "${prog_tight}", calendar_date: "2026-09-05", capacity_total: 1000, forecast_attendance: 800 }
              as: ProgramAdmin
              captures: { day_tight: "$.data.id" }
          assert:
            - "trigger response data.forecast_utilization_pct == 0.8000 and data.day_class == 'PEAK' (0.8000 >= 0.80, inclusive)"
            - "GET /park-days/${day_loose} → data.forecast_utilization_pct == 0.8000 and data.day_class == 'STANDARD' (0.8000 < 0.85)"
            - "both days report data.reservation_slot_capacity == 100 (min(floor(1000 * 0.10), 1000 - 800)) and data.window_slot_capacity == 50"
            - "neither day is CAPACITY_LOCKED (0.8000 < 0.95 and < 0.97 respectively)"

      - name: renewal_quote_applies_early_bird_then_capped_retention_credit
        claim_type: correct_result
        grounds:
          - calculations.renewal_quote
          - endpoints[GET /season-passes/{pass_id}/renewal-quote]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "A five-visit passholder quoted a GOLD renewal inside the early-bird window: 30000 - round_half_up(4500) = 25500, retention credit min(1500, floor(25500 * 0.20) == 5100) == 1500, quoted 24000 — and the same call one day past the inclusive deadline drops the discount but keeps the credit."
        test_recipe:
          setup:
            - "Program in SEASON_ACTIVE with early_bird_deadline 2026-11-15 and PUBLISHED BRONZE (12000) and GOLD (30000) tiers."
            - "Five STANDARD park days 2026-09-01 .. 2026-09-05."
            - "A processed ACTIVE BRONZE pass bought PAY_IN_FULL with one gate entry on each of the five days, so visit_count == 5."
            - "Logical clock left at 2026-08-01T00:00:00Z while the entries are recorded, so every entry_at is outside the trailing sharing-risk window and the risk score stays 0."
          setup_api_calls:
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "BRONZE", tier_rank: 1, base_price_cents: 12000, parking_benefit: "NONE", in_park_discount_pct: 0.05, reservation_required_on_peak: true, peak_reservation_quota: 2 }
              as: ProgramAdmin
              captures: { bronze: "$.data.id" }
            - call: "POST /pass-tiers/${bronze}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "GOLD", tier_rank: 3, base_price_cents: 30000, parking_benefit: "INCLUDED", in_park_discount_pct: 0.15, reservation_required_on_peak: false, peak_reservation_quota: 5 }
              as: ProgramAdmin
              captures: { gold: "$.data.id" }
            - call: "POST /pass-tiers/${gold}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SALES_OPEN" }
              as: ProgramAdmin
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-09-01", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
              captures: { d1: "$.data.id" }
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-09-02", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
              captures: { d2: "$.data.id" }
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-09-03", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
              captures: { d3: "$.data.id" }
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-09-04", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
              captures: { d4: "$.data.id" }
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-09-05", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
              captures: { d5: "$.data.id" }
            - call: "POST /passholders"
              payload: { full_name: "Ada Holder", email: "ada@example.com", date_of_birth: "1990-04-02" }
              as: PassOfficeClerk
              captures: { holder_a: "$.data.id" }
            - call: "POST /season-passes"
              payload: { program_id: "${prog}", tier_id: "${bronze}", passholder_id: "${holder_a}", payment_mode: "PAY_IN_FULL" }
              as: PassOfficeClerk
              captures: { pass_a: "$.data.id" }
            - call: "POST /season-passes/${pass_a}/process"
              payload: { photo_hash: "sha256:aaa", government_id_last4: "1234" }
              as: PassOfficeClerk
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SEASON_ACTIVE" }
              as: ProgramAdmin
            - call: "POST /visits"
              payload: { season_pass_id: "${pass_a}", park_day_id: "${d1}", entry_at: "2026-09-01T10:00:00Z", gate_code: "NORTH", photo_match: "MATCH" }
              as: GateAgent
            - call: "POST /visits"
              payload: { season_pass_id: "${pass_a}", park_day_id: "${d2}", entry_at: "2026-09-02T10:00:00Z", gate_code: "NORTH", photo_match: "MATCH" }
              as: GateAgent
            - call: "POST /visits"
              payload: { season_pass_id: "${pass_a}", park_day_id: "${d3}", entry_at: "2026-09-03T10:00:00Z", gate_code: "NORTH", photo_match: "MATCH" }
              as: GateAgent
            - call: "POST /visits"
              payload: { season_pass_id: "${pass_a}", park_day_id: "${d4}", entry_at: "2026-09-04T10:00:00Z", gate_code: "NORTH", photo_match: "MATCH" }
              as: GateAgent
            - call: "POST /visits"
              payload: { season_pass_id: "${pass_a}", park_day_id: "${d5}", entry_at: "2026-09-05T10:00:00Z", gate_code: "NORTH", photo_match: "MATCH" }
              as: GateAgent
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "GET /season-passes/${pass_a}/renewal-quote?target_tier_id=${gold}"
              as: PassOfficeClerk
              captures: { quoted_early: "$.data.quoted_price_cents" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-16T00:00:00Z" }
              as: ProgramAdmin
            - call: "GET /season-passes/${pass_a}/renewal-quote?target_tier_id=${gold}"
              as: PassOfficeClerk
              captures: { quoted_late: "$.data.quoted_price_cents" }
          assert:
            - "GET /season-passes/${pass_a} → data.visit_count == 5"
            - "first quote: data.standard_price_cents == 30000, data.early_bird_applied == true, data.discounted_price_cents == 25500"
            - "first quote: data.retention_credit_cents == 1500 (the MID band at 5 visits, under the 5100 cap) and data.quoted_price_cents == 24000"
            - "second quote (2026-11-16, one day past the inclusive deadline): data.early_bird_applied == false, data.discounted_price_cents == 30000"
            - "second quote: data.retention_credit_cents == 1500 (cap floor(30000 * 0.20) == 6000 does not bind) and data.quoted_price_cents == 28500"
            - "GET /passholders/${holder_a} → data.sharing_risk_score == 0 (all five entries sit outside the trailing 7-day window of the 2026-08-01 clock)"

      - name: revenue_spend_set_counts_only_closed_visits
        claim_type: input_set_filtering
        grounds:
          - calculations.program_revenue_analysis
          - endpoints[GET /pass-programs/{program_id}/revenue-summary]
          - endpoints[POST /visits/{visit_id}/close]
        distinguishing_aspect: "VISIT SET and SPEND SET are different sets: an OPEN visit counts towards total_visit_count but contributes neither to total_in_park_spend_cents nor to the spend_per_visit_cents denominator."
        test_recipe:
          setup:
            - "Program in SEASON_ACTIVE with PUBLISHED BRONZE tier and one STANDARD park day 2026-09-01."
            - "One processed ACTIVE BRONZE pass bought PAY_IN_FULL with two gate entries that day (10:00 and 12:00, more than the 90-minute anti-passback buffer apart)."
          setup_api_calls:
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
