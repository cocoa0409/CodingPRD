scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: guardian_hours_sum_then_round_vs_round_per_row
        grounds:
          - calculations.guardian_volunteer_hours
          - calculations.shift_hours
          - state_machines.VolunteerShift.CHECKED_IN_to_APPROVED
          - entities.Guardian.fields.volunteer_hours_logged
        distinguishing_aspect: |
          Operates on the Guardian entity domain (volunteer-hours aggregation). The scaffold pins
          "sum first, then round to 2 decimals half-up" as the chosen variant, where the
          alternative variant (round per row, then sum) on shifts with sub-cent fractional hours
          would yield a different Guardian.volunteer_hours_logged.
        test_recipe:
          setup:
            - "Create Season S with volunteer_hours_required_per_family=6.00 and default rainout_window_days."
            - "Create Guardian G."
            - "Create VolunteerShift V1 owned by G with scheduled_start=2026-06-01T10:00:00.000Z, scheduled_end=2026-06-01T11:30:00.000Z (delta = 1.50 hours)."
            - "Create VolunteerShift V2 owned by G with scheduled_start=2026-06-08T10:00:00.000Z, scheduled_end=2026-06-08T12:15:00.000Z (delta = 2.25 hours)."
            - "POST /_clock/advance to 2026-06-01T11:30:00.000Z."
          trigger:
            - "POST /league/volunteer-shifts/V1/check-in (Guardian G)."
            - "POST /league/volunteer-shifts/V1/approve (LeagueAdmin)."
            - "POST /_clock/advance to 2026-06-08T12:15:00.000Z."
            - "POST /league/volunteer-shifts/V2/check-in (Guardian G)."
            - "POST /league/volunteer-shifts/V2/approve (LeagueAdmin)."
          assert:
            - "VolunteerShift V1.hours_credited == 1.50."
            - "VolunteerShift V2.hours_credited == 2.25."
            - "Guardian G.volunteer_hours_logged == 3.75 (sum of approved hours, rounded half-up to 2 decimals)."
            - "Guardian G.volunteer_status == 'ON_TRACK' (3.75 >= 6.00*0.5=3.00, < 6.00)."

      - name: team_record_completed_vs_forfeit_aggregation
        grounds:
          - calculations.team_record
          - state_machines.Game.SCHEDULED_to_COMPLETED
          - state_machines.Game.SCHEDULED_to_FORFEITED
          - entities.Team.fields.wins
          - entities.Team.fields.losses
        distinguishing_aspect: |
          Operates on the Team entity domain (win/loss aggregation), distinct from the Guardian
          hours domain. The "COMPLETED" variant requires score comparison (home_score vs
          away_score), while the "FORFEITED" variant uses forfeiting_team_id and ignores scores;
          identical (home_team_id, away_team_id) inputs produce different (wins, losses) deltas
          depending on which variant fires.
        test_recipe:
          setup:
            - "Create Season S with regular_season_start=2026-05-01, regular_season_end=2026-07-31, playoff_cutoff_date=2026-08-01."
            - "Create Teams T1, T2 with valid coaches and >=8 drafted players each."
            - "Advance Season S to REGULAR_SEASON."
            - "Create Game G1 (home=T1, away=T2, field=F1, scheduled_start=2026-05-10T18:00:00.000Z, game_type=REGULAR), assign Referee R."
            - "Create Game G2 (home=T1, away=T2, field=F1, scheduled_start=2026-05-17T18:00:00.000Z, game_type=REGULAR), assign Referee R."
            - "POST /_clock/advance to 2026-05-10T19:30:00.000Z."
          trigger:
            - "POST /league/games/G1/record-result with home_score=7, away_score=3."
            - "POST /league/games/G2/forfeit with forfeiting_team_id=T2."
          assert:
            - "Team T1.wins == 2 (one COMPLETED win + one FORFEIT win)."
            - "Team T1.losses == 0."
            - "Team T2.wins == 0."
            - "Team T2.losses == 2 (one COMPLETED loss + one FORFEIT loss)."

  # =====================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: playoff_seeding_multi_key_sort_mode_a
        grounds:
          - calculations.playoff_seeding
          - state_machines.Season.REGULAR_SEASON_to_PLAYOFFS
          - entities.Team.fields.playoff_seed
          - entities.Team.fields.playoff_status
        distinguishing_aspect: |
          MODE (a): formula with ≥3 inputs (win_pct, head_to_head_wins, run_differential, team
          name) and non-linear interaction — each subsequent key is consulted only when prior
          keys tie. Conditional branching across four tiers of tie-break logic.
        test_recipe:
          setup:
            - "Create Season S; 4 teams T1,T2,T3,T4 each with >=8 drafted players."
            - "Advance Season S to REGULAR_SEASON."
            - "Schedule and record 6 regular-season games producing the following final standings:"
            - "  T1: 4 wins / 0 losses, run differential +20"
            - "  T2: 3 wins / 1 losses, run differential +10"
            - "  T3: 3 wins / 1 losses, run differential +5"
            - "  T4: 0 wins / 4 losses, run differential -35"
            - "POST /_clock/advance to Season.playoff_cutoff_date."
          trigger:
            - "POST /league/seasons/S/start-playoffs (LeagueAdmin)."
          assert:
            - "Team T1.playoff_seed == 1 (win_pct=1.0000, top)."
            - "Team T2.playoff_seed == 2 (win_pct=0.7500 tie with T3, run_diff +10 > +5)."
            - "Team T3.playoff_seed == 3 (win_pct=0.7500 tie with T2, lower run_diff)."
            - "Team T4.playoff_seed == 4 (win_pct=0.0000, bottom)."
            - "All four Teams' playoff_status == 'QUALIFIED'."

      - name: guardian_volunteer_hours_sum_then_round_mode_b
        grounds:
          - calculations.guardian_volunteer_hours
          - calculations.shift_hours
          - state_machines.VolunteerShift.CHECKED_IN_to_APPROVED
          - entities.Guardian.fields.volunteer_hours_logged
        distinguishing_aspect: |
          MODE (b): nested rounding where order matters. The scaffold pins "sum the
          per-shift hours_credited then round_half_up to 2 decimals" — rounding each summand
          before summing would yield a different cents value on aggregates with three or
          more shifts whose 2-decimal sums propagate. Distinct from MODE (a) above.
        test_recipe:
          setup:
            - "Create Season S with volunteer_hours_required_per_family=6.00."
            - "Create Guardian G."
            - "Create VolunteerShifts V1, V2, V3 owned by G, each scheduled_start..scheduled_end producing hours_credited 1.50, 1.50, 1.50 (all 90-minute shifts)."
            - "POST /_clock/advance to each shift's scheduled_end in turn."
          trigger:
            - "For each shift Vi: POST /league/volunteer-shifts/Vi/check-in then POST /league/volunteer-shifts/Vi/approve."
          assert:
            - "Each VolunteerShift Vi.hours_credited == 1.50."
            - "Guardian G.volunteer_hours_logged == 4.50 (sum 1.50+1.50+1.50 = 4.50 rounded half-up to 2 decimals)."

  # =====================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: game_postpone_reschedule_cycle
        grounds:
          - state_machines.Game.SCHEDULED_to_POSTPONED
          - state_machines.Game.POSTPONED_to_RESCHEDULED
          - entities.Game.fields.status
          - entities.Game.fields.original_scheduled_start
        distinguishing_aspect: |
          Game state machine has a cycle: SCHEDULED → POSTPONED → RESCHEDULED → SCHEDULED.
          A game may loop multiple postpone/reschedule rounds while original_scheduled_start
          remains pinned; the cycle is on the Game entity.
        test_recipe:
          setup:
            - "Create Season S spanning 2026-05-01..2026-07-31 with rainout_window_days=14, playoff_cutoff_date=2026-08-01."
            - "Create Teams T1, T2 and Referee R."
            - "Advance Season S to REGULAR_SEASON."
            - "Create Game G (home=T1, away=T2, field=F1, scheduled_start=2026-05-10T18:00:00.000Z), assign R."
          trigger:
            - "POST /league/games/G/postpone with reason='RAIN'."
            - "POST /league/games/G/reschedule with scheduled_start=2026-05-12T18:00:00.000Z."
            - "POST /league/games/G/postpone with reason='RAIN'."
            - "POST /league/games/G/reschedule with scheduled_start=2026-05-15T18:00:00.000Z."
          assert:
            - "Game G.status == 'SCHEDULED' after second reschedule (state has cycled back)."
            - "Game G.original_scheduled_start == 2026-05-10T18:00:00.000Z (unchanged across both cycles)."
            - "Game G.scheduled_start == 2026-05-15T18:00:00.000Z."
            - "Game G.referee_id == null after each postpone (cleared by side effect)."

      - name: player_branching_to_withdraw_from_three_states
        grounds:
          - state_machines.Player.PENDING_VERIFICATION_to_WITHDRAWN
          - state_machines.Player.AGE_VERIFIED_to_WITHDRAWN
          - state_machines.Player.EVALUATED_to_WITHDRAWN
          - state_machines.Player.PENDING_VERIFICATION_to_AGE_VERIFIED
          - entities.Player.fields.status
        distinguishing_aspect: |
          Player state machine is branching (fork): the WITHDRAWN terminal absorbs from three
          distinct non-terminal source states ({PENDING_VERIFICATION, AGE_VERIFIED, EVALUATED}),
          producing a fork-then-join shape — not a linear pipeline. Entity differs from Game.
        test_recipe:
          setup:
            - "Create Season S (DRAFT_OPEN) with min_birth_date=2014-01-01, max_birth_date=2015-12-31."
            - "Create Guardian G."
            - "Create Player P1, P2, P3 each owned by G with birth_date=2015-06-01, birth_certificate_uri='uri'."
          trigger:
            - "POST /league/players/P1/withdraw (Guardian G) — from PENDING_VERIFICATION."
            - "POST /league/players/P2/verify-age (LeagueAdmin) then POST /league/players/P2/withdraw (Guardian G) — from AGE_VERIFIED."
            - "POST /league/players/P3/verify-age (LeagueAdmin), POST /league/players/P3/record-evaluation (evaluation_score=80.0), then POST /league/players/P3/withdraw (Guardian G) — from EVALUATED."
          assert:
            - "Player P1.status == 'WITHDRAWN' (transitioned from PENDING_VERIFICATION)."
            - "Player P2.status == 'WITHDRAWN' (transitioned from AGE_VERIFIED)."
            - "Player P3.status == 'WITHDRAWN' (transitioned from EVALUATED)."
            - "All three withdrawals are accepted from different source states (branching shape)."

  # =====================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: game_postpone_cascade_depth_4
        grounds:
          - state_machines.Game.SCHEDULED_to_POSTPONED
          - state_machines.VolunteerShift.SCHEDULED_to_CANCELLED
          - calculations.guardian_volunteer_hours
          - calculations.volunteer_status_classification
          - entities.Game.fields.referee_id
          - entities.VolunteerShift.fields.status
          - entities.Guardian.fields.volunteer_hours_logged
          - entities.Guardian.fields.volunteer_status
        distinguishing_aspect: |
          Originates from POST /league/games/{id}/postpone. Depth ≥3: (1) Game→POSTPONED &
          Game.referee_id := null; (2) the POSTPONED mutation on Game itself causes linked
          VolunteerShifts to cascade-CANCEL (each link caused by the prior state change, not
          by the API call directly); (3) each shift-CANCEL causes Guardian.volunteer_hours_logged
          to recompute; (4) the hours change drives Guardian.volunteer_status reclassification.
        test_recipe:
          setup:
            - "Create Season S with volunteer_hours_required_per_family=6.00."
            - "Create Teams T1, T2 and Referee R; advance to REGULAR_SEASON."
            - "Create Game G (home=T1, away=T2, field=F1, scheduled_start=2026-05-10T18:00:00.000Z); POST /league/games/G/assign-referee with R."
            - "Create Guardian G1; create VolunteerShift V1 (owned by G1, game_id=G, scheduled_start=2026-05-10T17:30, scheduled_end=2026-05-10T19:30) — V1.status == SCHEDULED."
            - "Independently approve another shift V0 of G1 worth 3.00 hours so that pre-postpone G1.volunteer_hours_logged == 3.00, volunteer_status == 'ON_TRACK'."
          trigger:
            - "POST /league/games/G/postpone with reason='RAIN' (LeagueAdmin)."
          assert:
            - "Game G.status == 'POSTPONED' (depth-1 effect on triggered entity)."
            - "Game G.referee_id == null (depth-1)."
            - "VolunteerShift V1.status == 'CANCELLED' (depth-2: triggered by Game POSTPONED state change)."
            - "Guardian G1.volunteer_hours_logged == 3.00 unchanged (depth-3: recompute after V1 cancellation; V1 never APPROVED, so sum still excludes it)."
            - "Guardian G1.volunteer_status == 'ON_TRACK' (depth-4: re-classification after recompute)."

      - name: playoff_game_complete_cascade_depth_3
        grounds:
          - state_machines.Game.SCHEDULED_to_COMPLETED
          - calculations.team_record
          - calculations.playoff_bracket_advance
          - state_machines.Team.QUALIFIED_to_ELIMINATED
          - state_machines.Team.QUALIFIED_to_CHAMPION
          - entities.Team.fields.playoff_status
          - entities.Game.fields.bracket_round
        distinguishing_aspect: |
          Originates from POST /league/games/{id}/record-result on a PLAYOFF game. Depth ≥3:
          (1) Game→COMPLETED; (2) the COMPLETED mutation drives loser Team.playoff_status :=
          ELIMINATED (caused by the new completion record, not the API call); (3) the loser
          elimination state, combined with sibling completion, causes playoff_bracket_advance
          to materialize the next-round Game. Originates from a different triggering transition
          than the game_postpone cascade.
        test_recipe:
          setup:
            - "Create Season S, four Teams T1..T4 seeded for playoffs (calc playoff_seeding has run)."
            - "Bracket round 1 produced Games BR1 (T1 vs T4) and BR2 (T2 vs T3) with status=SCHEDULED and a referee each."
            - "Advance Season to PLAYOFFS."
            - "POST /_clock/advance past each game's scheduled_end."
            - "POST /league/games/BR2/record-result with home_score=5, away_score=2 (T2 wins) — sibling completes first."
          trigger:
            - "POST /league/games/BR1/record-result with home_score=8, away_score=3 (T1 wins, T4 loses)."
          assert:
            - "Game BR1.status == 'COMPLETED' (depth-1)."
            - "Team T4.playoff_status == 'ELIMINATED' (depth-2: caused by BR1 completion)."
            - "A new playoff Game exists in S with bracket_round == 2, home_team_id and away_team_id equal to {T1, T2} (depth-3: created by playoff_bracket_advance after both predecessors terminal)."

  # =====================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_birth_cert
        grounds:
          - validations[priority=21]
          - validations[priority=30]
          - state_machines.Season.DRAFT_OPEN_to_REGULAR_SEASON
          - entities.Season.fields.status
          - entities.Player.fields.birth_certificate_uri
        distinguishing_aspect: |
          Category pair (state: ERR_SEASON_NOT_DRAFT_OPEN, priority 21) vs (business_safety:
          ERR_BIRTH_CERT_REQUIRED, priority 30). When both fail simultaneously on POST
          /players/{id}/verify-age (season not DRAFT_OPEN AND no birth certificate), the
          state error wins because state precedes business_safety in §1.4 priority order.
        test_recipe:
          setup:
            - "Create Season S, advance through DRAFT_OPEN to REGULAR_SEASON (Season.status == 'REGULAR_SEASON')."
            - "Create Player P with birth_certificate_uri=null."
          trigger:
            - "POST /league/players/P/verify-age (LeagueAdmin)."
          assert:
            - "HTTP 409 returned."
            - "error_id == 'ERR_SEASON_NOT_DRAFT_OPEN' (state priority 21 wins over business_safety priority 30)."

      - name: business_temporal_vs_business_constraint_referee_overlap
        grounds:
          - validations[priority=42]
          - validations[priority=52]
          - calculations.referee_overlap_check
          - entities.Referee.fields.weekly_assignment_cap
        distinguishing_aspect: |
          Category pair (business_temporal: ERR_REFEREE_OVERLAP, priority 42) vs
          (business_constraint: ERR_REFEREE_WEEKLY_CAP_EXCEEDED, priority 52). Different
          category pair from instance #1. When both an interval overlap with an existing
          assignment AND a weekly-cap breach are present on POST /games/{id}/assign-referee,
          the temporal overlap error wins per §1.4 ordering.
        test_recipe:
          setup:
            - "Create Season S and Referee R with weekly_assignment_cap=1."
            - "Create Teams T1, T2, T3, T4; advance Season to REGULAR_SEASON."
            - "Create Game G_pre (home=T1, away=T2, field=F1, scheduled_start=2026-05-10T18:00:00.000Z) and POST /league/games/G_pre/assign-referee with R (now R has 1 assignment in week; cap exhausted)."
            - "Create Game G_new (home=T3, away=T4, field=F2, scheduled_start=2026-05-10T18:30:00.000Z) — same ISO week as G_pre, scheduled_start within 30-minute buffer of G_pre.scheduled_end=2026-05-10T19:30."
          trigger:
            - "POST /league/games/G_new/assign-referee with R (LeagueAdmin)."
          assert:
            - "HTTP 409 returned."
            - "error_id == 'ERR_REFEREE_OVERLAP' (business_temporal priority 42 wins over business_constraint priority 52)."

  # =====================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: tier_classification_inclusive_min_85
        grounds:
          - calculations.tier_classification
          - state_machines.Player.AGE_VERIFIED_to_EVALUATED
          - entities.Player.fields.evaluation_tier
        distinguishing_aspect: |
          Numeric threshold boundary: evaluation_score == TIER_A_MIN (85.0) MUST classify as
          TIER_A (>= boundary inclusive), while 84.9 classifies as TIER_B. Reached through
          POST /league/players/{id}/record-evaluation. Distinct metric (skill score) and
          distinct endpoint from the empty-set boundary below.
        test_recipe:
          setup:
            - "Create Season S (DRAFT_OPEN) with min_birth_date=2014-01-01, max_birth_date=2015-12-31."
            - "Create Guardian G; create Players Pa (birth_date=2015-06-01), Pb (birth_date=2015-06-02), both with birth_certificate_uri."
            - "POST /league/players/Pa/verify-age and POST /league/players/Pb/verify-age."
          trigger:
            - "POST /league/players/Pa/record-evaluation with evaluation_score=85.0."
            - "POST /league/players/Pb/record-evaluation with evaluation_score=84.9."
          assert:
            - "Player Pa.evaluation_tier == 'TIER_A' (score 85.0 is inclusive lower bound)."
            - "Player Pb.evaluation_tier == 'TIER_B' (score 84.9 is below the inclusive bound)."

      - name: field_overlap_touching_boundary_half_open
        grounds:
          - calculations.field_overlap_check
          - validations[priority=41]
          - state_machines.Game.POSTPONED_to_RESCHEDULED
          - entities.Game.fields.scheduled_start
          - entities.Game.fields.scheduled_end
        distinguishing_aspect: |
          Half-open interval [start, end) boundary: a new game scheduled_start == an existing
          game scheduled_end on the SAME field MUST be allowed (touching at boundary not a
          collision), while scheduled_start one millisecond earlier MUST be rejected. Distinct
          metric (interval geometry) and distinct endpoint (POST /league/games) from the
          numeric-score boundary above.
        test_recipe:
          setup:
            - "Create Season S spanning 2026-05-01..2026-07-31, advance to REGULAR_SEASON."
            - "Create Teams T1, T2, T3, T4."
            - "Create Game G_pre (home=T1, away=T2, field='F1', scheduled_start=2026-05-10T10:00:00.000Z); scheduled_end=2026-05-10T11:30:00.000Z."
          trigger:
            - "POST /league/games with (home=T3, away=T4, field='F1', scheduled_start=2026-05-10T11:30:00.000Z) — touching at boundary."
            - "POST /league/games with (home=T3, away=T4, field='F1', scheduled_start=2026-05-10T11:29:59.999Z) — one ms before boundary."
          assert:
            - "First POST returns 201; Game created successfully (touching half-open allowed)."
            - "Second POST returns 409 with error_id == 'ERR_FIELD_OVERLAP' (strict less-than violated)."

  # =====================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: player_draft_requires_season_draft_open
        grounds:
          - state_machines.Player.EVALUATED_to_DRAFTED
          - validations[priority=21]
          - entities.Season.fields.status
          - entities.Player.fields.status
        distinguishing_aspect: |
          Entity pair (Player, Season): Player EVALUATED→DRAFTED is only valid when
          Season.status == 'DRAFT_OPEN'. The Player's own state alone is insufficient.
        test_recipe:
          setup:
            - "Create Season S; create Teams T1..T4 each with head coach and >=8 EVALUATED players (so we can advance)."
            - "Create Player P (status=EVALUATED), one of the team's coaches as actor."
            - "Advance Season to REGULAR_SEASON (Season.status no longer DRAFT_OPEN)."
          trigger:
            - "POST /league/teams/T1/draft-pick with player_id=P (acting as Coach=T1.head_coach_id)."
          assert:
            - "HTTP 409 returned."
            - "error_id == 'ERR_SEASON_NOT_DRAFT_OPEN'."

      - name: game_record_requires_referee_assigned
        grounds:
          - state_machines.Game.SCHEDULED_to_COMPLETED
          - validations[priority=60]
          - entities.Game.fields.referee_id
          - entities.Game.fields.status
        distinguishing_aspect: |
          Entity pair (Game, Referee) — different from (Player, Season). Game SCHEDULED→COMPLETED
          is gated by the cross-entity referee link state: Game.referee_id MUST be non-null
          (Referee resource bound). Without a Referee bound to the Game, the transition
          rejects.
        test_recipe:
          setup:
            - "Create Season S, advance to REGULAR_SEASON."
            - "Create Teams T1, T2; create Game G (scheduled_start=2026-05-10T18:00, scheduled_end=2026-05-10T19:30) — no referee assigned (referee_id=null)."
            - "POST /_clock/advance to 2026-05-10T19:30:00.000Z."
          trigger:
            - "POST /league/games/G/record-result with home_score=5, away_score=3 (LeagueAdmin)."
          assert:
            - "HTTP 422 returned."
            - "error_id == 'ERR_GAME_REFEREE_REQUIRED'."

  # =====================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: field_overlap_half_open_no_buffer
        grounds:
          - calculations.field_overlap_check
          - validations[priority=41]
          - concurrency_rules[field_overlap]
          - entities.Game.fields.field_id
          - entities.Game.fields.scheduled_start
        distinguishing_aspect: |
          Resource entity: Field (modeled via Game.field_id token). Interval semantics:
          half-open [start, end) with NO buffer; adjacent slots touching at the boundary do
          NOT collide; strict less-than compare. (Different semantics from the referee
          buffer rule below.)
        test_recipe:
          setup:
            - "Create Season S spanning 2026-05-01..2026-07-31, advance to REGULAR_SEASON."
            - "Create Teams T1, T2, T3, T4."
            - "Create Game G_existing on field 'F1' scheduled_start=2026-05-10T10:00:00.000Z (end 11:30)."
          trigger:
            - "POST /league/games with (home=T3, away=T4, field='F1', scheduled_start=2026-05-10T11:00:00.000Z) — overlap window."
          assert:
            - "HTTP 409 returned."
            - "error_id == 'ERR_FIELD_OVERLAP'."
            - "No new Game persisted (count of Games on F1 in season unchanged at 1)."

      - name: referee_overlap_half_open_with_30_minute_buffer
        grounds:
          - calculations.referee_overlap_check
          - validations[priority=42]
          - entities.Referee.fields.weekly_assignment_cap
          - entities.Game.fields.referee_id
        distinguishing_aspect: |
          Resource entity: Referee. Interval semantics differ from field overlap: the existing
          assignment interval is expanded by ±30 minutes (BUFFER_MINUTES=30) before comparison.
          A new assignment starting exactly 30 minutes after the existing scheduled_end is
          allowed (boundary at expanded edge), while one starting 29 minutes after collides.
        test_recipe:
          setup:
            - "Create Season S, advance to REGULAR_SEASON."
            - "Create Referee R with weekly_assignment_cap=5."
            - "Create Teams T1, T2, T3, T4."
            - "Create Game G_pre on field F1 scheduled_start=2026-05-10T10:00:00.000Z (end 11:30); assign R."
            - "Create Game G_a on field F2 scheduled_start=2026-05-10T12:00:00.000Z (end 13:30) — exactly 30 min after G_pre.end."
            - "Create Game G_b on field F3 scheduled_start=2026-05-10T11:59:00.000Z (end 13:29) — 29 min after G_pre.end."
          trigger:
            - "POST /league/games/G_a/assign-referee with R (LeagueAdmin)."
            - "POST /league/games/G_b/assign-referee with R (LeagueAdmin)."
          assert:
            - "First call returns 200; Game G_a.referee_id == R.id (30-minute boundary allowed)."
            - "Second call returns 409 with error_id == 'ERR_REFEREE_OVERLAP' (within 30-minute buffer)."

  # =====================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: postpone_then_cancel_shift_leaves_volunteer_hours_unchanged
        grounds:
          - state_machines.Game.SCHEDULED_to_POSTPONED
          - state_machines.VolunteerShift.SCHEDULED_to_CANCELLED
          - calculations.guardian_volunteer_hours
          - entities.Guardian.fields.volunteer_hours_logged
        distinguishing_aspect: |
          Conserved quantity: Guardian.volunteer_hours_logged (sum over APPROVED shifts).
          Forward action: Game POSTPONE cancels linked SCHEDULED shifts (never APPROVED).
          Invariant: volunteer_hours_logged := sum(VolunteerShift.hours_credited for shifts
          with status==APPROVED) is unchanged after the cascade, because cancelled shifts
          were not APPROVED and therefore never contributed.
        test_recipe:
          setup:
            - "Create Season S with volunteer_hours_required_per_family=6.00; advance to REGULAR_SEASON."
            - "Create Guardian G1; pre-approve a baseline shift V0 that credits G1.volunteer_hours_logged == 4.50."
            - "Create Game G (Teams T1 vs T2, field F1, scheduled_start=2026-05-10T18:00); create VolunteerShift V1 owned by G1 linked to G with status=SCHEDULED."
          trigger:
            - "POST /league/games/G/postpone with reason='RAIN'."
          assert:
            - "VolunteerShift V1.status == 'CANCELLED' (cascade)."
            - "Guardian G1.volunteer_hours_logged == 4.50 (unchanged invariant: sum(hours_credited over APPROVED shifts) before and after the cascade is equal)."
            - "Sum(VolunteerShift.hours_credited where guardian_id==G1.id and status=='APPROVED') == 4.50 (matches the invariant formula)."

      - name: forfeit_then_record_total_games_played_invariant
        grounds:
          - state_machines.Game.SCHEDULED_to_COMPLETED
          - state_machines.Game.SCHEDULED_to_FORFEITED
          - calculations.team_record
          - entities.Team.fields.wins
          - entities.Team.fields.losses
        distinguishing_aspect: |
          Conserved quantity (different type from hours): for each Team T in season S,
          games_played(T) := T.wins + T.losses must equal count(Games g where g.status IN
          {'COMPLETED', 'FORFEITED'} and (g.home_team_id == T.id or g.away_team_id == T.id)).
          The team_record aggregation MUST keep wins+losses in lockstep with terminal-game
          count regardless of whether a terminal game was COMPLETED or FORFEITED — the
          terminal pair (record-result, forfeit) conserves this count.
        test_recipe:
          setup:
            - "Create Season S spanning 2026-05-01..2026-07-31; advance to REGULAR_SEASON with Teams T1, T2 each rostered."
            - "Schedule three regular-season games G1, G2, G3 all involving T1 (G1 home, G2 away, G3 home) with referees assigned."
            - "POST /_clock/advance past all three scheduled_end values."
          trigger:
            - "POST /league/games/G1/record-result with home_score=4, away_score=2 (T1 wins)."
            - "POST /league/games/G2/forfeit with forfeiting_team_id=T1 (T1 loses by forfeit)."
            - "POST /league/games/G3/record-result with home_score=1, away_score=6 (T1 loses)."
          assert:
            - "Team T1.wins == 1 and Team T1.losses == 2 (one COMPLETED win, one COMPLETED loss, one FORFEITED loss)."
            - "T1.wins + T1.losses == 3 (conserved quantity equals count of terminal games involving T1)."
            - "count(Games where status IN {'COMPLETED','FORFEITED'} and (home_team_id==T1 or away_team_id==T1)) == 3 (the invariant equates)."
