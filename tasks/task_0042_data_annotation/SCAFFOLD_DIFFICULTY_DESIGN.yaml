# =============================================================================
# Task 0042 — Data Annotation Crowdsourcing Platform (DIFFICULTY DESIGN)
# Test-targeting index. Every instance grounds in SCAFFOLD.yaml §1.1–§1.6.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across DIFFERENT entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: piece_rate_rounding_order_on_salary_ledger_entry
        grounds:
          - calculations.piece_rate_amount
          - state_machines.TaskPackage.INSPECTING_to_APPROVED
          - entities.SalaryLedgerEntry.fields.gross_amount_cents
        distinguishing_aspect: |
          piece_rate_amount pins "round_per_item then sum" on SalaryLedgerEntry
          for a TaskPackage; the alternative "sum then round" applied to the
          same inputs (unit_price=7, difficulty=MEDIUM, tier=SENIOR, package=3)
          yields 32 cents while the pinned algorithm yields 33 cents — the
          dual variant shows up on the SalaryLedgerEntry entity domain.
        test_recipe:
          setup:
            - "POST /annotation-projects with task_type=CLASSIFICATION, difficulty=MEDIUM, unit_price_cents=7, package_size=3, distribution_mode=GRAB, pass_rate_target=0.80, sample_preview_urls=[\"u1\"], guideline_doc_url=\"g1\""
            - "POST 5 GoldenSamples"
            - "POST /annotation-projects/{id}/task-packages/split with total_item_count=3"
            - "POST /annotators with entry_test_score=85 → tier=SENIOR"
            - "POST /annotation-projects/{id}/open"
            - "POST /task-packages/{packageId}/claim by the SENIOR annotator"
            - "POST /task-packages/{packageId}/submit with labels of length 3"
            - "POST /task-packages/{packageId}/start-inspection"
          trigger:
            - "POST /task-packages/{packageId}/inspections/{inspectionId}/finalize body={\"outcome\":\"PASS\",\"defects_found\":0}"
          assert:
            - "PIECE_RATE SalaryLedgerEntry.gross_amount_cents == 33"
            - "PIECE_RATE SalaryLedgerEntry.gross_amount_cents != 32"

      - name: pass_rate_chronological_vs_forward_on_annotator_profile
        grounds:
          - calculations.rolling_and_lifetime_pass_rate
          - state_machines.Appeal.UNDER_REVIEW_to_UPHELD
          - entities.AnnotatorProfile.fields.rolling_pass_rate
        distinguishing_aspect: |
          On AnnotatorProfile (different entity domain than SalaryLedgerEntry),
          the chronological_running variant exposed by GET /annotators/{id}
          stays at 0.7 after an appeal upholds a previously-FAILed inspection
          while the forward_looking variant exposed by
          GET /annotators/{id}/projected-pass-rate returns 0.8 — same inputs,
          two algorithms, different numbers.
        test_recipe:
          setup:
            - "Build an annotator with exactly 10 finalized QualityInspections: 7 PASS and 3 FAIL"
            - "Annotator's chronological rolling_pass_rate after the 10th finalize = 7/10 = 0.7000"
            - "Submit and uphold an appeal on one of the FAIL inspections (Appeal SUBMITTED→UNDER_REVIEW→UPHELD)"
          trigger:
            - "GET /annotators/{annotatorId}"
            - "GET /annotators/{annotatorId}/projected-pass-rate"
          assert:
            - "GET /annotators/{annotatorId} response.data.rolling_pass_rate == 0.7000"
            - "GET /annotators/{annotatorId}/projected-pass-rate response.data.rolling_pass_rate == 0.8000"
            - "0.7000 != 0.8000"

  # ---------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across DIFFERENT modes (a/b/c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: piece_rate_round_per_item_then_sum_mode_b
        grounds:
          - calculations.piece_rate_amount
          - state_machines.TaskPackage.INSPECTING_to_APPROVED
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. Pinned order
          "round_half_up per item, then sum" produces 33 cents for
          per_item_rate = 10.5, item_count = 3; the alternative
          "sum then round" produces 32. Scaffold pins the per-item-first
          order explicitly in calculations.piece_rate_amount.formula.
        test_recipe:
          setup:
            - "Same setup as piece_rate_rounding_order_on_salary_ledger_entry"
          trigger:
            - "POST /task-packages/{packageId}/inspections/{inspectionId}/finalize body={\"outcome\":\"PASS\",\"defects_found\":0}"
          assert:
            - "PIECE_RATE SalaryLedgerEntry.gross_amount_cents == 33"

      - name: payroll_settle_pinned_evaluation_order_mode_c
        grounds:
          - calculations.payroll_period_total
          - state_machines.PayrollPeriod.LOCKED_to_SETTLED
          - entities.SalaryLedgerEntry.fields.kind
        distinguishing_aspect: |
          Mode (c): circular-looking dependency. tax_basis depends on
          gross_total_cents; net_total_cents depends on tax_cents which
          depends on tax_basis. Scaffold pins evaluation order
          tax_basis = max(0, gross) → tax = round(tax_basis * tax_rate)
          → net = gross - tax. With gross=1760 and tax_rate=0.10 the
          unique well-defined answer is tax=176, net=1584.
        test_recipe:
          setup:
            - "Annotator has booked PIECE_RATE=+1600 and BONUS=+160 in PayrollPeriod period_id"
            - "PayrollPeriod tax_rate=0.10, closes_at advanced via POST /_clock/advance"
            - "POST /payroll-periods/{periodId}/lock"
          trigger:
            - "POST /payroll-periods/{periodId}/settle"
          assert:
            - "TAX SalaryLedgerEntry.gross_amount_cents == -176"
            - "Sum of all RELEASED entries for this annotator in the period == 1584"

      - name: bonus_penalty_three_input_branching_mode_a
        grounds:
          - calculations.bonus_penalty
          - state_machines.TaskPackage.INSPECTING_to_APPROVED
        distinguishing_aspect: |
          Mode (a): formula with ≥3 inputs (package_pass_rate, target, gross)
          and non-linear interaction — three branches gated by
          target+BONUS_BAND and target-PENALTY_BAND, each producing a
          different ledger kind with different multiplicative constants.
          A scaffold reading that only covered single-formula tiered
          piece-rate would NOT exercise this.
        test_recipe:
          setup:
            - "Project pass_rate_target = 0.80, package set up so that piece_rate gross = 1600 cents"
            - "Inspection sample_size = 20, defects_found = 3 (pass_rate exactly 0.85)"
          trigger:
            - "POST /task-packages/{packageId}/inspections/{inspectionId}/finalize body={\"outcome\":\"PASS\",\"defects_found\":3}"
          assert:
            - "BONUS SalaryLedgerEntry.gross_amount_cents == 160"
            - "No PENALTY SalaryLedgerEntry exists for this package"

  # ---------------------------------------------------------------------------
  # Rule 3 — Non-linear state machines on DIFFERENT entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: task_package_cyclic_rework_loop
        grounds:
          - state_machines.TaskPackage.INSPECTING_to_REWORK_PENDING
          - state_machines.TaskPackage.REWORK_PENDING_to_IN_PROGRESS
          - state_machines.TaskPackage.IN_PROGRESS_to_SUBMITTED
          - state_machines.TaskPackage.SUBMITTED_to_INSPECTING
        distinguishing_aspect: |
          TaskPackage exhibits a true cycle:
          INSPECTING → REWORK_PENDING → IN_PROGRESS → SUBMITTED → INSPECTING.
          The same package re-enters INSPECTING with rework_round
          incremented. This is structurally distinct from a linear
          A→B→C pipeline.
        test_recipe:
          setup:
            - "Project + package set up; package in IN_PROGRESS for owner"
          trigger:
            - "POST /task-packages/{packageId}/submit"
            - "POST /task-packages/{packageId}/start-inspection"
            - "POST /task-packages/{packageId}/inspections/{i1}/finalize body={\"outcome\":\"FAIL\",\"defects_found\":<over MAX_DEFECT_RATIO>}"
            - "POST /task-packages/{packageId}/rework-claim"
            - "POST /task-packages/{packageId}/submit"
            - "POST /task-packages/{packageId}/start-inspection"
          assert:
            - "After the second start-inspection, TaskPackage.status == INSPECTING (back to INSPECTING from REWORK_PENDING via IN_PROGRESS and SUBMITTED)"
            - "TaskPackage.rework_round == 1"

      - name: annotator_profile_parallel_dimensions_and_cycle
        grounds:
          - state_machines.AnnotatorProfile.ACTIVE_to_SUSPENDED
          - state_machines.AnnotatorProfile.SUSPENDED_to_ACTIVE
          - entities.AnnotatorProfile.fields.tier
          - entities.AnnotatorProfile.fields.status
        distinguishing_aspect: |
          AnnotatorProfile carries two parallel state dimensions on the
          same entity row: (a) tier in {JUNIOR, SENIOR, EXPERT}, evolved
          by tier_recompute, and (b) status in {ACTIVE, SUSPENDED},
          evolved by suspension/reinstatement, with status admitting a
          cycle ACTIVE→SUSPENDED→ACTIVE. Different entity from
          TaskPackage; different non-linearity (parallel + cycle vs cycle).
        test_recipe:
          setup:
            - "Annotator with tier=SENIOR, status=ACTIVE, rolling_pass_rate=0.95"
          trigger:
            - "Drive enough FAILs to push rolling_pass_rate below 0.70"
            - "POST /annotators/{annotatorId}/re-evaluate"
            - "POST /annotators/{annotatorId}/reinstate"
          assert:
            - "After re-evaluate: AnnotatorProfile.tier == JUNIOR AND AnnotatorProfile.status == SUSPENDED (parallel: both axes moved)"
            - "After reinstate: AnnotatorProfile.status == ACTIVE AND AnnotatorProfile.tier == JUNIOR (status cycled, tier independent)"

  # ---------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from DIFFERENT triggers
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: appeal_uphold_three_link_cascade_to_payroll_tax
        grounds:
          - state_machines.Appeal.UNDER_REVIEW_to_UPHELD
          - state_machines.TaskPackage.ARBITRATING_to_REJECTED
          - state_machines.PayrollPeriod.LOCKED_to_SETTLED
          - calculations.payroll_period_total
          - entities.SalaryLedgerEntry.fields.kind
        distinguishing_aspect: |
          Depth-3 transitive chain originating from appeal decide(UPHOLD):
          (link 1) Appeal UNDER_REVIEW→UPHELD mutates QualityInspection
          (outcome := DISPUTED override); (link 2) that mutation itself
          triggers SalaryLedgerEntry inserts (ADJUSTMENT_UPHELD reverses
          the prior PENALTY); (link 3) the changed ledger total itself
          drives PayrollPeriod settle to recompute tax_cents on the
          post-reversal gross_total_cents. Each link is caused by the
          previous, not by the original action.
        test_recipe:
          setup:
            - "Package previously rejected; PENALTY=-200 booked; appeal SUBMITTED then UNDER_REVIEW with arbiter assigned"
            - "PayrollPeriod opened, closes_at advanced, period locked with the PENALTY entry stamped"
          trigger:
            - "POST /appeals/{appealId}/decide body={\"decision\":\"UPHOLD\"}"
            - "POST /payroll-periods/{periodId}/settle"
          assert:
            - "ADJUSTMENT_UPHELD SalaryLedgerEntry.gross_amount_cents == 200 (link 2 caused by link 1)"
            - "TAX SalaryLedgerEntry.gross_amount_cents reflects post-reversal gross (link 3 caused by link 2)"
            - "AuditLog rows exist for the SALARY_ADJUSTMENT events on each hop"

      - name: re_evaluate_two_link_cascade_to_package_pool_revert
        grounds:
          - state_machines.AnnotatorProfile.ACTIVE_to_SUSPENDED
          - state_machines.TaskPackage.IN_PROGRESS_to_POOL
          - entities.TaskPackage.fields.assigned_annotator_id
        distinguishing_aspect: |
          Depth-2 transitive chain originating from re-evaluate (different
          trigger from appeal decide): (link 1) re-evaluate mutates
          AnnotatorProfile.status to SUSPENDED; (link 2) that suspension
          mutation itself reverts every IN_PROGRESS TaskPackage held by
          the annotator back to POOL with assigned_annotator_id := null.
          Originating trigger is distinct from the Appeal-uphold cascade.
        test_recipe:
          setup:
            - "Annotator A is ACTIVE, holds packages P1 (IN_PROGRESS) and P2 (REWORK_PENDING)"
            - "Drive A's rolling_pass_rate below 0.70 via successive FAILs on other packages"
          trigger:
            - "POST /annotators/{A}/re-evaluate"
          assert:
            - "AnnotatorProfile A.status == SUSPENDED (link 1)"
            - "TaskPackage P1.status == POOL AND P1.assigned_annotator_id IS NULL (link 2 caused by link 1)"
            - "TaskPackage P2.status == POOL AND P2.assigned_annotator_id IS NULL"

  # ---------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across DIFFERENT category pairs
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: project_state_beats_annotator_safety_on_claim
        grounds:
          - validations[priority=4]
          - validations[priority=6]
        distinguishing_aspect: |
          Pair {state, business_safety}: a SUSPENDED annotator attempting
          to /claim a package on a project that is still in DRAFT must
          receive ERR_PROJECT_NOT_OPEN (priority 4) — NOT
          ERR_ANNOTATOR_SUSPENDED (priority 6). The check ordering
          decides which error wins.
        test_recipe:
          setup:
            - "Project in DRAFT (never opened)"
            - "Annotator in status=SUSPENDED"
            - "TaskPackage exists with status=POOL"
          trigger:
            - "POST /task-packages/{packageId}/claim as the SUSPENDED annotator"
          assert:
            - "Response error_id == \"ERR_PROJECT_NOT_OPEN\""
            - "Response error_id != \"ERR_ANNOTATOR_SUSPENDED\""
            - "HTTP status == 409"

      - name: not_owner_beats_timed_out_on_submit
        grounds:
          - validations[priority=9]
          - validations[priority=10]
        distinguishing_aspect: |
          Pair {business_referential, business_temporal} — different from
          the pair above. A non-owner annotator submitting after the
          deadline must receive ERR_NOT_PACKAGE_OWNER (priority 9), not
          ERR_PACKAGE_TIMED_OUT (priority 10).
        test_recipe:
          setup:
            - "Package P claimed by annotator A; deadline_at advanced past"
            - "Annotator B != A is ACTIVE with sufficient tier"
          trigger:
            - "POST /_clock/advance to a moment past deadline_at"
            - "POST /task-packages/{packageId}/submit as annotator B with labels.length == item_count"
          assert:
            - "Response error_id == \"ERR_NOT_PACKAGE_OWNER\""
            - "Response error_id != \"ERR_PACKAGE_TIMED_OUT\""
            - "HTTP status == 403"

  # ---------------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on DIFFERENT metrics/endpoints
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: bonus_band_exact_equality_on_inspection_finalize
        grounds:
          - calculations.bonus_penalty
          - validations[priority=18]
          - state_machines.TaskPackage.INSPECTING_to_APPROVED
        distinguishing_aspect: |
          Numeric threshold crossing on the metric package_pass_rate at
          POST /task-packages/{id}/inspections/{id}/finalize. With
          target=0.80 and BONUS_BAND=0.05, pass_rate exactly 0.85 (>=
          target+BONUS_BAND) MUST trigger BONUS — not an inclusive-only
          band that would require >0.85.
        test_recipe:
          setup:
            - "Project pass_rate_target=0.80, JUNIOR annotator, EASY difficulty, unit_price_cents=100, package_size=20"
            - "Package claimed and submitted; start-inspection produces sample_size=20 (JUNIOR full inspection)"
          trigger:
            - "POST /task-packages/{packageId}/inspections/{inspectionId}/finalize body={\"outcome\":\"PASS\",\"defects_found\":3}"
          assert:
            - "Inspection.pass_rate == 0.8500"
            - "BONUS SalaryLedgerEntry.gross_amount_cents == 160"

      - name: golden_hit_rate_zero_total_empty_set_on_submit
        grounds:
          - calculations.golden_hit_rate
          - calculations.sample_size_for_inspection
          - state_machines.TaskPackage.IN_PROGRESS_to_SUBMITTED
        distinguishing_aspect: |
          Empty-collection / zero-count edge on the metric golden_total
          at POST /task-packages/{id}/submit. With package item_count=10,
          golden_inserted_count = floor(10 * 0.05) = 0; if every package
          the annotator has ever submitted has golden_inserted_count=0,
          golden_hit_rate is exactly 1.0 by the empty-set rule, NOT
          undefined or 0.
        test_recipe:
          setup:
            - "Project with package_size=10 (item_count=10 per package), no golden insertion possible"
            - "Annotator with no prior submissions"
            - "Claim and submit one package"
          trigger:
            - "POST /task-packages/{packageId}/submit with labels of length 10"
          assert:
            - "AnnotationSubmission.golden_total == 0"
            - "GET /annotators/{annotatorId} response.data.golden_hit_rate == 1.0000"

  # ---------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across DIFFERENT entity pairs
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: task_package_claim_depends_on_project_state
        grounds:
          - state_machines.TaskPackage.POOL_to_IN_PROGRESS
          - state_machines.AnnotationProject.DRAFT_to_OPEN
          - validations[priority=4]
        distinguishing_aspect: |
          Entity pair {TaskPackage, AnnotationProject}: TaskPackage's
          POOL→IN_PROGRESS transition is permitted only if the parent
          AnnotationProject.status == OPEN. While project remains DRAFT,
          /claim returns ERR_PROJECT_NOT_OPEN.
        test_recipe:
          setup:
            - "Project in DRAFT with packages in POOL"
            - "Annotator ACTIVE with sufficient tier"
          trigger:
            - "POST /task-packages/{packageId}/claim (rejected)"
            - "POST /annotation-projects/{projectId}/open"
            - "POST /task-packages/{packageId}/claim (accepted)"
          assert:
            - "First claim response.data.error_id == \"ERR_PROJECT_NOT_OPEN\""
            - "Second claim response.data.status == \"IN_PROGRESS\""

      - name: payroll_settle_depends_on_task_package_state
        grounds:
          - state_machines.PayrollPeriod.LOCKED_to_SETTLED
          - state_machines.TaskPackage.SUBMITTED_to_INSPECTING
          - validations[priority=16]
        distinguishing_aspect: |
          Entity pair {PayrollPeriod, TaskPackage} — DIFFERENT pair than
          {TaskPackage, AnnotationProject}. PayrollPeriod's LOCKED→SETTLED
          transition is permitted only if every TaskPackage referenced by
          ledger entries in the period is NOT in INSPECTING /
          REWORK_PENDING / ARBITRATING. The settle is rejected with
          ERR_REINSPECTION_PENDING when any such package exists.
        test_recipe:
          setup:
            - "PayrollPeriod LOCKED with PIECE_RATE entry referring to package P"
            - "P is currently in INSPECTING (a re-inspection started after the lock)"
          trigger:
            - "POST /payroll-periods/{periodId}/settle"
          assert:
            - "Response error_id == \"ERR_REINSPECTION_PENDING\""
            - "PayrollPeriod.status remains LOCKED"

  # ---------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across DIFFERENT semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: task_package_single_occupancy_interval
        grounds:
          - concurrency_rules[scenario=Two annotators call /claim for the same POOL package simultaneously]
          - state_machines.TaskPackage.POOL_to_IN_PROGRESS
          - validations[priority=20]
        distinguishing_aspect: |
          Resource = TaskPackage. Interval semantics: single-occupancy
          half-open [claimed_at, deadline_at) — the resource admits at
          most ONE annotator at a time; any second claim before the
          interval closes (via submit, timeout, or rework completion)
          collides and is rejected with ERR_PACKAGE_ALREADY_TAKEN. Geometric
          treatment is "occupancy" (one slot, no buffers, no aggregate
          capacity).
        test_recipe:
          setup:
            - "Project OPEN; package P in POOL"
            - "Two ACTIVE annotators A and B, both with sufficient tier"
            - "A successfully claims P"
          trigger:
            - "B issues POST /task-packages/{P}/claim while A still owns P"
          assert:
            - "B's response error_id == \"ERR_PACKAGE_ALREADY_TAKEN\""
            - "TaskPackage P.assigned_annotator_id == A.id"

      - name: payroll_period_half_open_overlap
        grounds:
          - validations[priority=19]
          - entities.PayrollPeriod.fields.opens_at
          - entities.PayrollPeriod.fields.closes_at
        distinguishing_aspect: |
          Resource = PayrollPeriod calendar (different resource entity
          from TaskPackage). Interval semantics: half-open [opens_at,
          closes_at) — DIFFERENT semantics from TaskPackage's
          single-occupancy: here the geometric test is pairwise overlap
          (a.opens_at < b.closes_at AND b.opens_at < a.closes_at) rather
          than single-slot occupancy. Adjacency case where
          new.opens_at == existing.closes_at is allowed (boundary touch
          permitted under half-open).
        test_recipe:
          setup:
            - "PayrollPeriod P1 with opens_at=2026-05-01, closes_at=2026-06-01"
          trigger:
            - "POST /payroll-periods with opens_at=2026-05-15, closes_at=2026-06-15 (overlap)"
            - "POST /payroll-periods with opens_at=2026-06-01, closes_at=2026-07-01 (adjacent, allowed)"
          assert:
            - "First create response.data.error_id == \"ERR_PERIOD_OVERLAP\" with HTTP 409"
            - "Second create response.data.status == \"OPEN\" (adjacency allowed under half-open)"

  # ---------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across DIFFERENT conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: penalty_then_appeal_uphold_zero_net_per_package
        grounds:
          - state_machines.Appeal.UNDER_REVIEW_to_UPHELD
          - state_machines.TaskPackage.ARBITRATING_to_REJECTED
          - calculations.payroll_period_total
          - entities.SalaryLedgerEntry.fields.kind
        distinguishing_aspect: |
          Conserved quantity: per-package net penalty in cents. Forward
          action = book PENALTY of -200 on rejection. Compensating action
          = appeal UPHOLD inserts ADJUSTMENT_UPHELD of +200. Pinned
          invariant:
            sum(PENALTY.gross_amount_cents)
              + sum(ADJUSTMENT_UPHELD.gross_amount_cents)
              for the package == 0
          The TAX entry on settle is recomputed on the post-reversal
          gross_total, leaving the named quantity (per-package net
          penalty) at exactly zero.
        test_recipe:
          setup:
            - "Package P arbitrate-rejected; PENALTY ledger entry of -200 booked under annotator A"
            - "Appeal SUBMITTED on the rejected inspection, arbiter assigned (UNDER_REVIEW)"
          trigger:
            - "POST /appeals/{appealId}/decide body={\"decision\":\"UPHOLD\"}"
          assert:
            - "Sum of (PENALTY + ADJUSTMENT_UPHELD).gross_amount_cents for package P == 0"
            - "ADJUSTMENT_UPHELD.gross_amount_cents == 200"
            - "PENALTY.gross_amount_cents == -200"

      - name: timeout_revert_zero_delta_pass_rate_counters
        grounds:
          - state_machines.TaskPackage.IN_PROGRESS_to_POOL
          - calculations.rolling_and_lifetime_pass_rate
          - entities.AnnotatorProfile.fields.rolling_pass_rate
          - entities.AnnotatorProfile.fields.lifetime_pass_rate
        distinguishing_aspect: |
          Conserved quantity: AnnotatorProfile pass-rate counters
          (submitted_count, approved_count) — DIFFERENT type of conserved
          quantity from per-package monetary net. Forward action = claim
          (sets assigned_annotator_id, claimed_at, deadline_at).
          Compensating action = clock-driven timeout reverts
          (assigned_annotator_id := null). Pinned invariant: across the
          (claim → timeout-revert) pair, AnnotatorProfile.submitted_count
          and approved_count remain unchanged because no submission
          occurred — the pair leaves the named quantities exactly equal
          to their pre-claim values.
        test_recipe:
          setup:
            - "Annotator A with submitted_count=S0, approved_count=K0, rolling_pass_rate=R0"
            - "Project OPEN, package P in POOL"
          trigger:
            - "POST /task-packages/{P}/claim as A"
            - "POST /_clock/advance to a moment past deadline_at"
          assert:
            - "After /_clock/advance: TaskPackage P.status == POOL AND P.assigned_annotator_id IS NULL"
            - "AnnotatorProfile A.submitted_count after revert == S0 (unchanged)"
            - "AnnotatorProfile A.approved_count after revert == K0 (unchanged)"
            - "AnnotatorProfile A.rolling_pass_rate after revert == R0 (unchanged)"
