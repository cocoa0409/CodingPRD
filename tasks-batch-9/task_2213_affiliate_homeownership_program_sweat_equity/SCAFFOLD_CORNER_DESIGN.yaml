  # ===========================================================================
  # SECTION 3 — From Table 3 (Calculations)
  # Correct Result / Input Set Filtering / Constants Applied / Precision, plus
  # the algorithm rows present in §1.3: threshold, aggregation, interval_merge,
  # weighted_scoring, decay_function, waterfall_allocation,
  # constraint_propagation. The three dual-variant rows are stubbed to §1.8,
  # which owns both variant pairs.
  # ===========================================================================
  - section: calculations
    instances:

      - name: insurance_annual_floor_and_appraisal_cap_squeeze_the_silent_second
        claim_type: constants_applied
        grounds: [calculations.affordable_payment_structure, entities.MortgageApplication.fields.escrow_monthly_cents, entities.MortgageApplication.fields.affordable_pi_payment_cents, entities.MortgageApplication.fields.first_mortgage_principal_cents, entities.MortgageApplication.fields.silent_second_amount_cents, "state_machines.MortgageApplication.status.DRAFT_to_UNDERWRITING"]
        distinguishing_aspect: "Two constants that only bite at particular magnitudes: INSURANCE_ANNUAL_FLOOR_CENTS 60000 overrides the 0.35 percent rate (which would yield only 52500 on a 15000000-cent home, i.e. 4375 a month instead of 5000), and step 7's min() clamps the first mortgage at the appraised value so silent_second_amount_cents collapses to exactly 0 — a well-off partner family consumes no subsidy at all. Each escrow component is rounded separately before the sum, so 15625 + 5000 == 20625."
        test_recipe:
          setup:
            - "Canonical program. One household verified at 3600000 cents annual income (ami_pct 0.6000, inside the band) and SELECTED with composite 87.0; self-reported income is 4000000 so the PRELIMINARY and FINAL bases genuinely differ. One site appraised at 15000000 cents advanced to READY_TO_BUILD."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
            - { call: "POST /homeownership/households", payload: { program_id: "${prog_id}", household_name: "Okafor", household_size: 4, current_bedroom_count: 1, habitability_deficiency_count: 3, self_reported_annual_income_cents: 4000000, self_reported_housing_cost_cents: 150000, monthly_debt_payment_cents: 30000, credit_score: 640, on_time_housing_payment_months: 24 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { hh_id: $.data.id } }
            - { call: "POST /homeownership/household-members", payload: { household_id: "${hh_id}", full_name: "Ada Okafor", relationship: "APPLICANT", birth_date: "1984-07-09T00:00:00.000Z", is_adult_occupant: true }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/households/${hh_id}/submit", payload: { attestation_signed: true }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/households/${hh_id}/screen", payload: { income_documents_received: true, verified_annual_income_cents: 3600000, verified_housing_cost_cents: 100000 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/households/${hh_id}/committee-referral", payload: { referral_memo: "File verified, referred to committee" }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "NEED", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-alice" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "ABILITY", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-alice" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "WILLINGNESS", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-alice" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "NEED", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-bruno" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "ABILITY", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-bruno" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "WILLINGNESS", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-bruno" }
            - { call: "POST /homeownership/households/${hh_id}/selection-decision", payload: { decision_minutes: "Committee minutes 2026-08-01: household selected for partnership" }, as: ProgramAdmin, as_user_id: "admin-1", captures: { hh_v: $.data.version } }
            - { call: "POST /homeownership/build-sites", payload: { program_id: "${prog_id}", parcel_number: "P-1001", street_address: "12 Cedar Ln", acquisition_cost_cents: 4000000, appraised_value_cents: 15000000 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { site_id: $.data.id } }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "TITLE", document_reference: "TITLE-1001" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "ENVIRONMENTAL", document_reference: "ENV-1001" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "UTILITIES", document_reference: "UTL-1001" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "GET /homeownership/households/${hh_id}", as: MortgageOfficer, as_user_id: "officer-1", captures: { hh_v2: $.data.version } }
            - { call: "POST /homeownership/mortgage-applications", payload: { household_id: "${hh_id}", build_site_id: "${site_id}", expected_household_version: "${hh_v2}", term_months: 240 }, as: MortgageOfficer, as_user_id: "officer-1", captures: { app_id: $.data.id } }
          trigger:
            - { call: "POST /homeownership/mortgage-applications/${app_id}/submit-underwriting", payload: {}, as: MortgageOfficer, as_user_id: "officer-1" }
          assert:
            - "HTTP 200 and status == UNDERWRITING"
            - "income_basis_annual_cents == 3600000 and appraised_value_cents == 15000000 (both pinned from the parents, not from the payload)"
            - "escrow_monthly_cents == 20625: tax 15625 (round_half_up(15000000 * 0.0125 / 12)) plus insurance 5000 (max(60000, 52500) / 12) — a rate-only insurance figure of 4375 would have produced 20000, so the annual floor demonstrably applied"
            - "affordable_pi_payment_cents == 69375: floor(3600000 / 12) == 300000 monthly gross, floor(300000 * 0.30) == 90000 maximum total, minus the 20625 escrow"
            - "term_months == 240: provisional principal 69375 * 360 == 24975000 is at or above round_half_up(0.90 * 15000000) == 13500000"
            - "first_mortgage_principal_cents == 15000000, NOT 16650000 — min(69375 * 240, 15000000) clamps at the appraised value"
            - "silent_second_amount_cents == 0 exactly (15000000 - 15000000), and it is the integer 0 rather than null"

      - name: shift_fill_gate_uses_the_ceiling_of_sixty_percent_of_slots
        claim_type: constants_applied
        grounds: [calculations.shift_lock_readiness, entities.ConstructionShift.fields.fill_ratio, entities.ConstructionShift.fields.confirmed_general_count, "state_machines.ConstructionShift.status.OPEN_to_LOCKED", "validations[priority=33]", errors.ERR_SHIFT_FILL_INSUFFICIENT]
        distinguishing_aspect: "The documented 5-slot boundary: MIN_GENERAL_FILL_FRACTION 0.60 times 5 is exactly 3.0, and the ceiling of an exact integer must stay 3 rather than rounding up to 4 — two confirmations are refused, the third unlocks the shift, and fill_ratio reports 0.6 rather than the 0.6667 a 3-of-... reading would give."
        test_recipe:
          setup:
            - "Canonical program with a READY_TO_BUILD site and an OPEN 4-hour shift on 2026-08-05T08:00 to 12:00 offering 5 general seats and 0 trade seats. Three volunteers hold seats; the first two have CONFIRMED, so confirmed_general_count is 2 and the third seat is still RESERVED. The shift version is re-read before each seat creation."
