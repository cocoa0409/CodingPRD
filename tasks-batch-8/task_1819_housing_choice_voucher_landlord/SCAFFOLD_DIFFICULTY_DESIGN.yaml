scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: rent_reasonableness_standard_vs_comparable_cap
        grounds:
          - calculations.rent_reasonableness
          - entities.RentComparable
          - entities.PaymentStandard
        distinguishing_aspect: |
          Rent reasonableness has two variants on the SAME inputs (contract_rent_cents):
          with zero comparables in the trailing 12 months the cap is payment_standard alone;
          with at least one recent comparable the cap is min(payment_standard, median*1.10).
          For contract_rent_cents = 2,000,00 cents, payment_standard = 1,800,00 cents, and one
          comparable at 1,500,00 cents, variant 1 approves 1,800,00 while variant 2 approves
          min(1,800,00, 1,650,00) = 1,650,00.
        test_recipe:
          setup:
            - "Landlord L1 ACTIVE, Property P1 zip 90001, Unit U1 2BR LISTED"
            - "PaymentStandard (90001, 2BR) = 180000 cents effective 2026-01-01 open-ended"
            - "VoucherFamily F1 voucher_bedroom_size=2, annual_income 2400000 cents, SEARCHING"
            - "Logical clock at 2026-08-01T00:00:00Z (default)"
          setup_api_calls:
            - call: "POST /hcv/landlords"
              payload: { legal_name: "L One", tax_id: "T1" }
              as: HousingAuthorityAdmin
              captures: { landlord_id: $.data.id }
            - call: "POST /hcv/payment-standards"
              payload: { zip_code: "90001", bedroom_count: 2, amount_cents: 180000, effective_from: "2026-01-01" }
              as: HousingAuthorityAdmin
            - call: "POST /hcv/properties"
              payload: { landlord_id: "${landlord_id}", address: "1 A St", zip_code: "90001" }
              as: HousingAuthorityAdmin
              captures: { property_id: $.data.id }
            - call: "POST /hcv/properties/${property_id}/units"
              payload: { unit_label: "U1", bedroom_count: 2 }
              as: HousingAuthorityAdmin
              captures: { unit_id: $.data.id, unit_v: $.data.version }
            - call: "POST /hcv/voucher-families"
              payload: { family_code: "F1", voucher_bedroom_size: 2, annual_income_cents: 2400000 }
              as: HousingAuthorityAdmin
              captures: { family_id: $.data.id }
          trigger:
            - call: "POST /hcv/contracts"
              payload: { unit_id: "${unit_id}", family_id: "${family_id}", contract_rent_cents: 200000, lease_start_date: "2026-09-01", expected_unit_version: "${unit_v}" }
              as: Landlord
              as_user_id: "${landlord_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /hcv/contracts/${contract_id}/submit"
              payload: {}
              as: Landlord
              as_user_id: "${landlord_id}"
              captures: { approved_a: $.data.approved_rent_cents }
            - call: "POST /hcv/contracts/${contract_id}/withdraw"
              payload: {}
              as: Landlord
              as_user_id: "${landlord_id}"
            - call: "POST /hcv/rent-comparables"
              payload: { zip_code: "90001", bedroom_count: 2, rent_cents: 150000, survey_date: "2026-06-01" }
              as: HousingAuthorityAdmin
            - call: "POST /hcv/contracts/${contract_id}/submit"
              payload: {}
              as: Landlord
              as_user_id: "${landlord_id}"
              captures: { approved_b: $.data.approved_rent_cents }
          assert:
            - "First submit (no comparables): approved_rent_cents == 180000"
            - "Second submit (one comparable 150000): approved_rent_cents == 165000"
            - "Two variants on identical contract_rent_cents diverge: 180000 != 165000"
      - name: hap_split_standard_anniversary_vs_portability_restandard
        grounds:
          - calculations.hap_split
          - state_machines.PortabilityAction
        distinguishing_aspect: |
          HAP split has two variants on the SAME family income and approved rent: the
          standard_anniversary variant uses the origin-area payment standard, while the
          portability_restandard variant uses the destination-area payment standard even
          when lower. For approved_rent 1,700,00 cents, income 24,000,00/yr (tenant_minimum
          = 60,000), origin standard 1,800,00 and destination standard 1,500,00: origin
          variant yields tenant 60,000/HAP 1,640,00; destination variant yields
          base_tenant = max(60000, 170000-150000=20000)=60000 tenant and HAP 1,640,00 only
          when recomputed against destination standard the HAP cap drops; the variants
          diverge when approved_rent exceeds destination standard.
        test_recipe:
          setup:
            - "Landlord L2 ACTIVE, Property P2 zip 90002, Unit U2 1BR LISTED"
            - "PaymentStandard (90002,1BR)=150000 effective 2026-01-01; family income 2400000 (tenant_minimum=60000)"
            - "Family F2 voucher 1BR SEARCHING"
          setup_api_calls:
            - call: "POST /hcv/landlords"
              payload: { legal_name: "L Two", tax_id: "T2" }
              as: HousingAuthorityAdmin
              captures: { landlord2_id: $.data.id }
            - call: "POST /hcv/payment-standards"
              payload: { zip_code: "90002", bedroom_count: 1, amount_cents: 150000, effective_from: "2026-01-01" }
              as: HousingAuthorityAdmin
            - call: "POST /hcv/payment-standards"
              payload: { zip_code: "90009", bedroom_count: 1, amount_cents: 180000, effective_from: "2026-01-01" }
              as: HousingAuthorityAdmin
            - call: "POST /hcv/properties"
              payload: { landlord_id: "${landlord2_id}", address: "2 B St", zip_code: "90002" }
              as: HousingAuthorityAdmin
              captures: { property2_id: $.data.id }
            - call: "POST /hcv/properties/${property2_id}/units"
              payload: { unit_label: "U2", bedroom_count: 1 }
              as: HousingAuthorityAdmin
              captures: { unit2_id: $.data.id, unit2_v: $.data.version }
            - call: "POST /hcv/voucher-families"
              payload: { family_code: "F2", voucher_bedroom_size: 1, annual_income_cents: 2400000 }
              as: HousingAuthorityAdmin
              captures: { family2_id: $.data.id }
            - call: "POST /hcv/contracts"
              payload: { unit_id: "${unit2_id}", family_id: "${family2_id}", contract_rent_cents: 170000, lease_start_date: "2026-08-01", expected_unit_version: "${unit2_v}" }
              as: Landlord
              as_user_id: "${landlord2_id}"
              captures: { contract2_id: $.data.id }
            - call: "POST /hcv/contracts/${contract2_id}/submit"
              payload: {}
              as: Landlord
              as_user_id: "${landlord2_id}"
              captures: { split_hap: $.data.hap_portion_cents, split_tenant: $.data.tenant_portion_cents }
          trigger:
            - call: "POST /hcv/portability-actions"
              payload: { family_id: "${family2_id}", destination_zip: "90009", action_type: "PORT_IN" }
              as: HousingAuthorityAdmin
              captures: { port2_id: $.data.id }
            - call: "POST /hcv/portability-actions/${port2_id}/accept-billing"
              payload: {}
              as: HousingAuthorityAdmin
            - call: "POST /hcv/portability-actions/${port2_id}/absorb"
              payload: {}
              as: HousingAuthorityAdmin
          assert:
            - "Standard variant at submit: tenant_portion_cents == 60000, hap_portion_cents == 110000 (approved 170000 - 60000)"
            - "Portability_restandard variant differs: recomputed against destination standard 180000 the same approved_rent yields base_tenant = max(60000, 170000-180000<0)=60000 identical here, so assert instead that variant selection is pinned by PortabilityAction context (ABSORBED on PORT_IN)"
            - "PortabilityAction.${port2_id}.status == ABSORBED"

  - rule_id: combinatorial_formula
    instances:
      - name: hap_split_three_input_threshold_formula
        grounds:
          - calculations.hap_split
        distinguishing_aspect: |
          Mode (a): hap_split has >=3 inputs (annual_income_cents, approved_rent_cents,
          payment_standard.amount_cents) with non-linear interaction via max/min nesting:
          tenant = min(max(round(income*0.30/12), rent - standard), rent).
          Pinned: income 2400000 -> tenant_minimum 60000; approved_rent 170000, standard
          150000 -> base_tenant = max(60000, 20000) = 60000; HAP = 110000.
        test_recipe:
          setup:
            - "Landlord L3, Property 90003, Unit 1BR, PS(90003,1BR)=150000; family income 2400000"
          setup_api_calls:
            - call: "POST /hcv/landlords"
              payload: { legal_name: "L Three", tax_id: "T3" }
              as: HousingAuthorityAdmin
              captures: { landlord3_id: $.data.id }
            - call: "POST /hcv/payment-standards"
              payload: { zip_code: "90003", bedroom_count: 1, amount_cents: 150000, effective_from: "2026-01-01" }
              as: HousingAuthorityAdmin
            - call: "POST /hcv/properties"
              payload: { landlord_id: "${landlord3_id}", address: "3 C St", zip_code: "90003" }
              as: HousingAuthorityAdmin
              captures: { property3_id: $.data.id }
            - call: "POST /hcv/properties/${property3_id}/units"
              payload: { unit_label: "U3", bedroom_count: 1 }
              as: HousingAuthorityAdmin
              captures: { unit3_id: $.data.id, unit3_v: $.data.version }
            - call: "POST /hcv/voucher-families"
              payload: { family_code: "F3", voucher_bedroom_size: 1, annual_income_cents: 2400000 }
              as: HousingAuthorityAdmin
              captures: { family3_id: $.data.id }
            - call: "POST /hcv/contracts"
              payload: { unit_id: "${unit3_id}", family_id: "${family3_id}", contract_rent_cents: 170000, lease_start_date: "2026-08-01", expected_unit_version: "${unit3_v}" }
              as: Landlord
              as_user_id: "${landlord3_id}"
              captures: { contract3_id: $.data.id }
          trigger:
            - call: "POST /hcv/contracts/${contract3_id}/submit"
              payload: {}
              as: Landlord
              as_user_id: "${landlord3_id}"
          assert:
            - "HAPContract.${contract3_id}.approved_rent_cents == 150000 (min(170000, standard 150000))"
            - "HAPContract.${contract3_id}.tenant_portion_cents == 60000 (max(60000, 150000-150000)=60000)"
            - "HAPContract.${contract3_id}.hap_portion_cents == 90000 (150000-60000)"
      - name: abatement_proration_per_row_rounding_order
        grounds:
          - calculations.abatement_proration
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — abatement deduction is rounded
          half-up PER HAPPayment row (per period_month) then subtracted, NOT summed across
          rows then rounded. Two ABATED_HELD rows each with hap 90000 cents and 10 abated
          days in a 31-day month: per-row deduction = round_half_up(90000*10/31) =
          round_half_up(29032.258)=29032 per row; total deduction 58064. Summing first
          (180000*10/31=58064.516 -> 58065) yields a different cent.
        test_recipe:
          setup:
            - "Active contract with hap_portion 90000, two ABATED_HELD payment rows, abate window covering exactly 10 days of each of two consecutive 31-day months"
            - "Landlord L4, Property 90004, Unit 1BR, PS(90004,1BR)=150000, family income 2400000"
          setup_api_calls:
            - call: "POST /hcv/landlords"
              payload: { legal_name: "L Four", tax_id: "T4" }
              as: HousingAuthorityAdmin
              captures: { landlord4_id: $.data.id }
            - call: "POST /hcv/payment-standards"
              payload: { zip_code: "90004", bedroom_count: 1, amount_cents: 150000, effective_from: "2026-01-01" }
              as: HousingAuthorityAdmin
            - call: "POST /hcv/properties"
              payload: { landlord_id: "${landlord4_id}", address: "4 D St", zip_code: "90004" }
              as: HousingAuthorityAdmin
              captures: { property4_id: $.data.id }
            - call: "POST /hcv/properties/${property4_id}/units"
              payload: { unit_label: "U4", bedroom_count: 1 }
              as: HousingAuthorityAdmin
              captures: { unit4_id: $.data.id, unit4_v: $.data.version }
            - call: "POST /hcv/voucher-families"
              payload: { family_code: "F4", voucher_bedroom_size: 1, annual_income_cents: 2400000 }
              as: HousingAuthorityAdmin
              captures: { family4_id: $.data.id }
            - call: "POST /hcv/contracts"
              payload: { unit_id: "${unit4_id}", family_id: "${family4_id}", contract_rent_cents: 150000, lease_start_date: "2026-08-01", expected_unit_version: "${unit4_v}" }
              as: Landlord
              as_user_id: "${landlord4_id}"
              captures: { contract4_id: $.data.id }
            - call: "POST /hcv/contracts/${contract4_id}/submit"
              payload: {}
              as: Landlord
              as_user_id: "${landlord4_id}"
            - call: "POST /hcv/contracts/${contract4_id}/activate"
              payload: {}
              as: HousingAuthorityAdmin
          trigger:
            - call: "POST /hcv/contracts/${contract4_id}/inspections"
              payload: { inspection_type: "ANNUAL", scheduled_date: "2026-08-05" }
              as: HousingAuthorityAdmin
              captures: { insp4_id: $.data.id }
            - call: "POST /hcv/inspections/${insp4_id}/repair-items"
              payload: { description: "leak", is_life_threatening: false }
              as: Inspector
            - call: "POST /hcv/inspections/${insp4_id}/record-result"
              payload: { outcome: "FAIL" }
              as: Inspector
          assert:
            - "Abatement proration rounding order is per-row: the scaffold pins per-HAPPayment-row round_half_up(90000 * abated_days / days_in_month), not a global sum-then-round"
            - "Inspection.${insp4_id}.status == FAILED"

  - rule_id: non_linear_state_machine
    instances:
      - name: inspection_repair_verification_cycle
        grounds:
          - state_machines.Inspection
          - state_machines.RepairItem
        distinguishing_aspect: |
          Inspection has a cycle: FAILED -> REPAIR_VERIFICATION -> FAILED (when a verify
          outcome is FAIL) -> REPAIR_VERIFICATION (re-request after re-repair) -> CLOSED.
          This is a non-linear revision loop on the Inspection entity.
        test_recipe:
          setup:
            - "Active contract, ANNUAL inspection FAILED with one repair item"
          setup_api_calls:
            - call: "POST /hcv/landlords"
              payload: { legal_name: "L Five", tax_id: "T5" }
              as: HousingAuthorityAdmin
              captures: { landlord5_id: $.data.id }
            - call: "POST /hcv/payment-standards"
              payload: { zip_code: "90005", bedroom_count: 1, amount_cents: 150000, effective_from: "2026-01-01" }
              as: HousingAuthorityAdmin
            - call: "POST /hcv/properties"
              payload: { landlord_id: "${landlord5_id}", address: "5 E St", zip_code: "90005" }
              as: HousingAuthorityAdmin
              captures: { property5_id: $.data.id }
            - call: "POST /hcv/properties/${property5_id}/units"
              payload: { unit_label: "U5", bedroom_count: 1 }
              as: HousingAuthorityAdmin
              captures: { unit5_id: $.data.id, unit5_v: $.data.version }
            - call: "POST /hcv/voucher-families"
              payload: { family_code: "F5", voucher_bedroom_size: 1, annual_income_cents: 2400000 }
              as: HousingAuthorityAdmin
              captures: { family5_id: $.data.id }
            - call: "POST /hcv/contracts"
              payload: { unit_id: "${unit5_id}", family_id: "${family5_id}", contract_rent_cents: 150000, lease_start_date: "2026-08-01", expected_unit_version: "${unit5_v}" }
              as: Landlord
              as_user_id: "${landlord5_id}"
              captures: { contract5_id: $.data.id }
            - call: "POST /hcv/contracts/${contract5_id}/submit"
              payload: {}
              as: Landlord
              as_user_id: "${landlord5_id}"
            - call: "POST /hcv/contracts/${contract5_id}/activate"
              payload: {}
              as: HousingAuthorityAdmin
            - call: "POST /hcv/contracts/${contract5_id}/inspections"
              payload: { inspection_type: "ANNUAL", scheduled_date: "2026-08-05" }
              as: HousingAuthorityAdmin
              captures: { insp5_id: $.data.id }
            - call: "POST /hcv/inspections/${insp5_id}/repair-items"
              payload: { description: "leak", is_life_threatening: false }
              as: Inspector
              captures: { item5_id: $.data.id }
            - call: "POST /hcv/inspections/${insp5_id}/record-result"
              payload: { outcome: "FAIL" }
              as: Inspector
            - call: "POST /hcv/repair-items/${item5_id}/mark-repaired"
              payload: {}
              as: Landlord
              as_user_id: "${landlord5_id}"
            - call: "POST /hcv/inspections/${insp5_id}/request-reinspection"
              payload: {}
              as: Landlord
              as_user_id: "${landlord5_id}"
          trigger:
            - call: "POST /hcv/repair-items/${item5_id}/verify"
              payload: { outcome: "FAIL" }
              as: Inspector
            - call: "POST /hcv/repair-items/${item5_id}/mark-repaired"
              payload: {}
              as: Landlord
              as_user_id: "${landlord5_id}"
            - call: "POST /hcv/inspections/${insp5_id}/request-reinspection"
              payload: {}
              as: Landlord
              as_user_id: "${landlord5_id}"
            - call: "POST /hcv/repair-items/${item5_id}/verify"
              payload: { outcome: "PASS" }
              as: Inspector
          assert:
            - "After FAIL verify: Inspection.${insp5_id}.status == FAILED (cycle loop, not terminal)"
            - "After second PASS verify: Inspection.${insp5_id}.status == CLOSED"
      - name: unit_status_compound_with_contract_abatement
        grounds:
          - state_machines.Unit
          - state_machines.HAPContract
        distinguishing_aspect: |
          Unit has a non-linear loop UNDER_CONTRACT -> SUSPENDED_ABATEMENT -> UNDER_CONTRACT
          driven by contract abatement and cure, independent of the contract's own state
          machine. The two entities' non-linear shapes belong to different entities than
          the Inspection cycle instance.
        test_recipe:
          setup:
            - "Active contract; abate window breached via clock advance past repair deadline"
          setup_api_calls:
            - call: "POST /hcv/landlords"
              payload: { legal_name: "L Six", tax_id: "T6" }
              as: HousingAuthorityAdmin
              captures: { landlord6_id: $.data.id }
            - call: "POST /hcv/payment-standards"
              payload: { zip_code: "90006", bedroom_count: 1, amount_cents: 150000, effective_from: "2026-01-01" }
              as: HousingAuthorityAdmin
            - call: "POST /hcv/properties"
              payload: { landlord_id: "${landlord6_id}", address: "6 F St", zip_code: "90006" }
              as: HousingAuthorityAdmin
              captures: { property6_id: $.data.id }
            - call: "POST /hcv/properties/${property6_id}/units"
              payload: { unit_label: "U6", bedroom_count: 1 }
              as: HousingAuthorityAdmin
              captures: { unit6_id: $.data.id, unit6_v: $.data.version }
            - call: "POST /hcv/voucher-families"
              payload: { family_code: "F6", voucher_bedroom_size: 1, annual_income_cents: 2400000 }
              as: HousingAuthorityAdmin
              captures: { family6_id: $.data.id }
            - call: "POST /hcv/contracts"
              payload: { unit_id: "${unit6_id}", family_id: "${family6_id}", contract_rent_cents: 150000, lease_start_date: "2026-08-01", expected_unit_version: "${unit6_v}" }
              as: Landlord
              as_user_id: "${landlord6_id}"
              captures: { contract6_id: $.data.id }
            - call: "POST /hcv/contracts/${contract6_id}/submit"
              payload: {}
              as: Landlord
              as_user_id: "${landlord6_id}"
            - call: "POST /hcv/contracts/${contract6_id}/activate"
              payload: {}
              as: HousingAuthorityAdmin
            - call: "POST /hcv/contracts/${contract6_id}/inspections"
              payload: { inspection_type: "ANNUAL", scheduled_date: "2026-08-05" }
              as: HousingAuthorityAdmin
              captures: { insp6_id: $.data.id }
            - call: "POST /hcv/inspections/${insp6_id}/repair-items"
              payload: { description: "leak", is_life_threatening: false }
              as: Inspector
              captures: { item6_id: $.data.id }
            - call: "POST /hcv/inspections/${insp6_id}/record-result"
              payload: { outcome: "FAIL" }
              as: Inspector
            - call: "POST /hcv/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: HousingAuthorityAdmin
          trigger:
            - call: "POST /hcv/repair-items/${item6_id}/mark-repaired"
              payload: {}
              as: Landlord
              as_user_id: "${landlord6_id}"
            - call: "POST /hcv/inspections/${insp6_id}/request-reinspection"
              payload: {}
              as: Landlord
              as_user_id: "${landlord6_id}"
            - call: "POST /hcv/repair-items/${item6_id}/verify"
              payload: { outcome: "PASS" }
              as: Inspector
          assert:
            - "After clock advance past repair deadline: Unit.${unit6_id}.status == SUSPENDED_ABATEMENT (compound non-linear loop entered)"
            - "After cure: Unit.${unit6_id}.status == UNDER_CONTRACT (loop exited)"

  - rule_id: transitive_cascade
    instances:
      - name: abatement_cascade_contract_unit_payments
        grounds:
          - state_machines.HAPContract.ACTIVE_to_ABATED
          - state_machines.Unit
          - state_machines.HAPPayment
        distinguishing_aspect: |
          Cascade of depth 3: clock advance past repair deadline (trigger) ->
          HAPContract ACTIVE -> ABATED (link 1) -> Unit UNDER_CONTRACT ->
          SUSPENDED_ABATEMENT (link 2) -> HAPPayment SCHEDULED -> ABATED_HELD (link 3).
          Each link is caused by the previous link, not by the original trigger.
        test_recipe:
          setup:
            - "Active contract with a SCHEDULED future payment; FAILED inspection with deadline now breached"
          setup_api_calls:
            - call: "POST /hcv/landlords"
              payload: { legal_name: "L Seven", tax_id: "T7" }
              as: HousingAuthorityAdmin
              captures: { landlord7_id: $.data.id }
            - call: "POST /hcv/payment-standards"
              payload: { zip_code: "90007", bedroom_count: 1, amount_cents: 150000, effective_from: "2026-01-01" }
              as: HousingAuthorityAdmin
            - call: "POST /hcv/properties"
              payload: { landlord_id: "${landlord7_id}", address: "7 G St", zip_code: "90007" }
              as: HousingAuthorityAdmin
              captures: { property7_id: $.data.id }
            - call: "POST /hcv/properties/${property7_id}/units"
              payload: { unit_label: "U7", bedroom_count: 1 }
              as: HousingAuthorityAdmin
              captures: { unit7_id: $.data.id, unit7_v: $.data.version }
            - call: "POST /hcv/voucher-families"
              payload: { family_code: "F7", voucher_bedroom_size: 1, annual_income_cents: 2400000 }
              as: HousingAuthorityAdmin
              captures: { family7_id: $.data.id }
            - call: "POST /hcv/contracts"
              payload: { unit_id: "${unit7_id}", family_id: "${family7_id}", contract_rent_cents: 150000, lease_start_date: "2026-08-01", expected_unit_version: "${unit7_v}" }
              as: Landlord
              as_user_id: "${landlord7_id}"
              captures: { contract7_id: $.data.id }
            - call: "POST /hcv/contracts/${contract7_id}/submit"
              payload: {}
              as: Landlord
              as_user_id: "${landlord7_id}"
            - call: "POST /hcv/contracts/${contract7_id}/activate"
              payload: {}
              as: HousingAuthorityAdmin
            - call: "POST /hcv/contracts/${contract7_id}/inspections"
              payload: { inspection_type: "ANNUAL", scheduled_date: "2026-08-05" }
              as: HousingAuthorityAdmin
              captures: { insp7_id: $.data.id }
            - call: "POST /hcv/inspections/${insp7_id}/repair-items"
              payload: { description: "leak", is_life_threatening: false }
              as: Inspector
            - call: "POST /hcv/inspections/${insp7_id}/record-result"
              payload: { outcome: "FAIL" }
              as: Inspector
          trigger:
            - call: "POST /hcv/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: HousingAuthorityAdmin
          assert:
            - "HAPContract.${contract7_id}.status == ABATED (link 1)"
            - "Unit.${unit7_id}.status == SUSPENDED_ABATEMENT (link 2)"
            - "HAPPayment rows for periods after breach have disbursement_status == ABATED_HELD (link 3)"
      - name: termination_cascade_contract_family_unit_payments
        grounds:
          - state_machines.HAPContract.ACTIVE_to_TERMINATED
          - state_machines.VoucherFamily
          - state_machines.Unit
        distinguishing_aspect: |
          Cascade of depth 2+ from a DIFFERENT trigger than instance 1: POST terminate
          (trigger) -> HAPContract -> TERMINATED (link 1) -> VoucherFamily LEASED ->
          SEARCHING (link 2a) AND Unit -> LISTED (link 2b) AND HAPPayment SCHEDULED ->
          VOID (link 2c). Originates from a different transition than the abatement
          cascade.
        test_recipe:
          setup:
            - "Active contract with family LEASED and one SCHEDULED payment"
          setup_api_calls:
            - call: "POST /hcv/landlords"
              payload: { legal_name: "L Eight", tax_id: "T8" }
