          trigger:
            - call: "POST /follow-up-enrollments"
              payload: { admission_id: "${adm_q1}", clinic_unit_id: "${unit_a}", target_appointment_date: "2026-09-01T09:00:00Z" }
              as: FollowUpCoordinator
              as_user_id: "fu-1"
              captures: { err_enr: $.data.error_id }
            - call: "POST /admissions/${adm_q1}/discharge"
              payload: { disposition: "HOME" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
            - call: "POST /follow-up-enrollments"
              payload: { admission_id: "${adm_q1}", clinic_unit_id: "${unit_a}", target_appointment_date: "2026-09-01T09:00:00Z" }
              as: FollowUpCoordinator
