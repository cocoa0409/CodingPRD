            - call: "POST /fleet/territories/${t_id}/deployment-waves/${w_mid_id}/activate"
              payload: {}
              as: TerritoryPlanner
              captures: { ok_status: $.data.status }
          assert:
            - "the MORNING_PEAK activation returns error_id ERR_WEATHER_SUSPENDED and http == 422"
            - "the MIDDAY activation returns ok_status == \"ACTIVE\" with no error"
            - "DeploymentWave.${w_am_id}.status == PLANNED and DeploymentWave.${w_mid_id}.status == ACTIVE"

      - name: if_match_ride_create_idempotency_key_replay
        claim_type: Satisfaction to Pass
        grounds:
          - validations[priority=4]
          - endpoints.POST_/fleet/territories/{territoryId}/ride-requests
          - entities.RideRequest.fields.idempotency_key
        distinguishing_aspect: "A repeated create with the same idempotency_key returns the original ride rather than creating a second row, while a different key creates a new one — the dedupe is scoped to the territory."
        test_recipe:
          setup: ["Logical clock at 2026-06-01T00:00:00Z. One ACTIVE territory and one REQUESTED ride created with key idem-replay."]
          setup_api_calls:
            - *c_clock
            - *c_t
            - call: "POST /fleet/territories/${t_id}/ride-requests"
              payload: { rider_name: "Rider One", sub_service_type: "STANDARD", idempotency_key: "idem-replay" }
              as: FleetOperations
              captures: { r1_id: $.data.id }
          trigger:
            - call: "POST /fleet/territories/${t_id}/ride-requests"
              payload: { rider_name: "Rider One", sub_service_type: "STANDARD", idempotency_key: "idem-replay" }
              as: FleetOperations
              captures: { r_replay_id: $.data.id }
            - call: "POST /fleet/territories/${t_id}/ride-requests"
              payload: { rider_name: "Rider Two", sub_service_type: "STANDARD", idempotency_key: "idem-fresh" }
              as: FleetOperations
              captures: { r2_id: $.data.id }
          assert:
            - "the replay returns id ${r_replay_id} == ${r1_id}"
            - "the fresh key returns a different id ${r2_id} != ${r1_id}"
            - "GET /fleet/territories/${t_id}/ride-requests returns exactly 2 rides"

      - name: if_match_safety_outranks_state_on_ride_match_stub
        claim_type: Priority Ordering
        grounds:
