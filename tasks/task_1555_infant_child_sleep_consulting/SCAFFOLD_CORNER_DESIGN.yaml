# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Infant & Child Sleep Consulting
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  # Section: entities
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: consultant_creation_computed_defaults
        claim_type: creation
        grounds:
        - "entities.Consultant.fields.active_case_count"
        distinguishing_aspect: "A freshly created consultant has active_case_count == 0 (computed), version == 1, and a server-minted UUID id."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /sleep-consulting/consultants"
              payload: { full_name: "Dana Sleep", certification_no: "CERT-200", max_active_cases: 3 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
          assert:
            - "HTTP 201; Consultant.${cons_id}.active_case_count == 0"
            - "Consultant.${cons_id}.version == 1 and id is a server-minted UUID"
            - "created_at == updated_at == 2026-08-01T00:00:00Z (default logical clock)"

      - name: family_registration_defaults
        claim_type: defaults
        grounds:
        - "entities.ClientFamily.fields.credit_balance_cents"
        - "entities.ClientFamily.fields.is_repeat_client"
        distinguishing_aspect: "Self-registration initializes the computed ledger fields: credit_balance_cents == 0 and is_repeat_client == false."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /sleep-consulting/families"
              payload: { full_name: "Fam Z", email: "z@x.com" }
              as: Anonymous
              captures: { fam_id: $.data.id }
          assert:
            - "HTTP 201; ClientFamily.${fam_id}.credit_balance_cents == 0"
            - "ClientFamily.${fam_id}.is_repeat_client == false"

      - name: case_computed_age_fields
        claim_type: computed_fields
        grounds:
        - "entities.ClientCase.fields.child_age_months"
        - "entities.ClientCase.fields.age_band"
        - "calculations.child_age_and_band"
        distinguishing_aspect: "child_age_months and age_band are computed from child_birth_date against the default clock 2026-08-01: birth 2026-05-01 -> 3 months -> NEWBORN."
        test_recipe:
          setup: ["consultant and family exist"]
          setup_api_calls:
            - call: "POST /sleep-consulting/consultants"
              payload: { full_name: "Dana Sleep", certification_no: "CERT-201", max_active_cases: 3 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /sleep-consulting/families"
              payload: { full_name: "Fam Z", email: "z@x.com" }
              as: Anonymous
              captures: { fam_id: $.data.id }
          trigger:
            - call: "POST /sleep-consulting/cases"
              payload: { family_id: "${fam_id}", consultant_id: "${cons_id}", child_birth_date: "2026-05-01", delivery_mode: "ONE_ON_ONE", guarantee_goal_night_wakings: 2 }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { case_id: $.data.id }
          assert:
            - "ClientCase.${case_id}.child_age_months == 3 (May 1 to Aug 1)"
            - "ClientCase.${case_id}.age_band == NEWBORN (<= 3 months)"
            - "ClientCase.${case_id}.status == INTAKE and completed_at == null"

      - name: clock_default_purchased_at
        claim_type: defaults
        grounds:
        - "entities.SupportPackage.fields.purchased_at"
        distinguishing_aspect: "Without any set_current_utc call the logical clock reads exactly 2026-08-01T00:00:00Z, observed through purchased_at on the first package."
        test_recipe:
          setup:
            - "case in PLANNING (questionnaire submitted and reviewed); no clock-set call has ever been made"
          setup_api_calls:
            - call: "POST /sleep-consulting/consultants"
              payload: { full_name: "Dana Sleep", certification_no: "CERT-202", max_active_cases: 3 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /sleep-consulting/families"
              payload: { full_name: "Fam Z", email: "z@x.com" }
              as: Anonymous
              captures: { fam_id: $.data.id }
            - call: "POST /sleep-consulting/cases"
              payload: { family_id: "${fam_id}", consultant_id: "${cons_id}", child_birth_date: "2026-05-01", delivery_mode: "ONE_ON_ONE", guarantee_goal_night_wakings: 2 }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { case_id: $.data.id }
            - call: "POST /sleep-consulting/cases/${case_id}/questionnaire"
              payload: { answers: { night_wakings: 2, night_feeds: 1, bedtime_resistance_minutes: 30, nap_total_minutes: 120, medical_flags: false, preterm_birth: false } }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { q_id: $.data.id }
            - call: "POST /sleep-consulting/questionnaires/${q_id}/review"
              payload: { adjustment_points: 0 }
              as: Consultant
              as_user_id: "${cons_id}"
          trigger:
            - call: "POST /sleep-consulting/cases/${case_id}/packages"
              payload: { tier: "BASIC", kind: "INITIAL", starts_on: "2026-08-01" }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { pkg_id: $.data.id }
          assert:
            - "SupportPackage.${pkg_id}.purchased_at == 2026-08-01T00:00:00Z (server startup default clock, not wall clock)"
            - "SupportPackage.${pkg_id}.expires_on == 2026-08-14 (starts_on + 2*7 - 1 days)"

  # ---------------------------------------------------------------------------
  # Section: endpoints
  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: single_resource_not_found_sweep
        claim_type: not_found
        grounds:
        - "errors[ERR_CONSULTANT_NOT_FOUND]"
        - "errors[ERR_FAMILY_NOT_FOUND]"
        - "errors[ERR_CASE_NOT_FOUND]"
        - "errors[ERR_QUESTIONNAIRE_NOT_FOUND]"
        - "errors[ERR_PLAN_NOT_FOUND]"
        - "errors[ERR_PACKAGE_NOT_FOUND]"
        - "errors[ERR_LOG_NOT_FOUND]"
        - "errors[ERR_SESSION_NOT_FOUND]"
        - "errors[ERR_MESSAGE_NOT_FOUND]"
        - "errors[ERR_REFUND_REQUEST_NOT_FOUND]"
        - "errors[ERR_COURSE_NOT_FOUND]"
        - "errors[ERR_ENROLLMENT_NOT_FOUND]"
        distinguishing_aspect: "Every per-entity 404 fires: path ids left-to-right and body FK references, each returning its domain-specific error_id inside the error envelope."
        test_recipe:
          setup: ["one consultant and one family exist (for body-FK probes)"]
          setup_api_calls:
            - call: "POST /sleep-consulting/consultants"
              payload: { full_name: "Dana Sleep", certification_no: "CERT-203", max_active_cases: 3 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /sleep-consulting/families"
              payload: { full_name: "Fam Z", email: "z@x.com" }
              as: Anonymous
              captures: { fam_id: $.data.id }
          trigger:
            - call: "GET /sleep-consulting/consultants/00000000-0000-4000-8000-0000000000aa"
              as: PracticeAdmin
              captures: { e_cons: $.data.error_id }
            - call: "GET /sleep-consulting/families/00000000-0000-4000-8000-0000000000aa"
              as: PracticeAdmin
              captures: { e_fam: $.data.error_id }
            - call: "GET /sleep-consulting/cases/00000000-0000-4000-8000-0000000000aa"
              as: PracticeAdmin
              captures: { e_case: $.data.error_id }
            - call: "POST /sleep-consulting/questionnaires/00000000-0000-4000-8000-0000000000aa/review"
              payload: { adjustment_points: 0 }
              as: Consultant
              as_user_id: "${cons_id}"
              captures: { e_q: $.data.error_id }
            - call: "POST /sleep-consulting/plans/00000000-0000-4000-8000-0000000000aa/resume"
              as: Consultant
              as_user_id: "${cons_id}"
              captures: { e_plan: $.data.error_id }
            - call: "GET /sleep-consulting/packages/00000000-0000-4000-8000-0000000000aa"
              as: PracticeAdmin
              captures: { e_pkg: $.data.error_id }
            - call: "POST /sleep-consulting/logs/00000000-0000-4000-8000-0000000000aa/review"
              payload: { outcome: "ON_TRACK" }
              as: Consultant
              as_user_id: "${cons_id}"
              captures: { e_log: $.data.error_id }
            - call: "POST /sleep-consulting/troubleshooting-sessions/00000000-0000-4000-8000-0000000000aa/complete"
              as: Consultant
              as_user_id: "${cons_id}"
              captures: { e_sess: $.data.error_id }
            - call: "POST /sleep-consulting/messages/00000000-0000-4000-8000-0000000000aa/respond"
              payload: { response_body: "hi" }
              as: Consultant
              as_user_id: "${cons_id}"
              captures: { e_msg: $.data.error_id }
            - call: "POST /sleep-consulting/refund-requests/00000000-0000-4000-8000-0000000000aa/approve"
              as: PracticeAdmin
              captures: { e_rr: $.data.error_id }
            - call: "GET /sleep-consulting/group-courses/00000000-0000-4000-8000-0000000000aa"
              as: PracticeAdmin
              captures: { e_course: $.data.error_id }
            - call: "POST /sleep-consulting/enrollments/00000000-0000-4000-8000-0000000000aa/cancel"
              as: PracticeAdmin
              captures: { e_enr: $.data.error_id }
            - call: "POST /sleep-consulting/cases"
              payload: { family_id: "00000000-0000-4000-8000-0000000000aa", consultant_id: "${cons_id}", child_birth_date: "2026-05-01", delivery_mode: "ONE_ON_ONE", guarantee_goal_night_wakings: 2 }
              as: PracticeAdmin
              captures: { e_fk_fam: $.data.error_id }
            - call: "POST /sleep-consulting/cases"
              payload: { family_id: "${fam_id}", consultant_id: "00000000-0000-4000-8000-0000000000aa", child_birth_date: "2026-05-01", delivery_mode: "ONE_ON_ONE", guarantee_goal_night_wakings: 2 }
              as: PracticeAdmin
              captures: { e_fk_cons: $.data.error_id }
          assert:
            - "e_cons == ERR_CONSULTANT_NOT_FOUND (404); e_fam == ERR_FAMILY_NOT_FOUND; e_case == ERR_CASE_NOT_FOUND"
            - "e_q == ERR_QUESTIONNAIRE_NOT_FOUND; e_plan == ERR_PLAN_NOT_FOUND; e_pkg == ERR_PACKAGE_NOT_FOUND"
            - "e_log == ERR_LOG_NOT_FOUND; e_sess == ERR_SESSION_NOT_FOUND; e_msg == ERR_MESSAGE_NOT_FOUND"
            - "e_rr == ERR_REFUND_REQUEST_NOT_FOUND; e_course == ERR_COURSE_NOT_FOUND; e_enr == ERR_ENROLLMENT_NOT_FOUND"
            - "body FK probes: e_fk_fam == ERR_FAMILY_NOT_FOUND and e_fk_cons == ERR_CONSULTANT_NOT_FOUND"
            - "every error response uses the error envelope: response_type == error with data.error_id present"

      - name: logs_listing_pagination_defaults
        claim_type: listing
        grounds:
        - "response_envelope"
        distinguishing_aspect: "List endpoint honors limit/offset with envelope fields total_count and has_more; 3 logs paginate 2 + 1."
        test_recipe:
          setup:
            - "case in ACTIVE_SUPPORT; three logs submitted for 2026-07-30, 2026-07-31, 2026-08-01"
          setup_api_calls:
            - call: "POST /sleep-consulting/consultants"
              payload: { full_name: "Dana Sleep", certification_no: "CERT-204", max_active_cases: 3 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /sleep-consulting/families"
              payload: { full_name: "Fam Z", email: "z@x.com" }
              as: Anonymous
              captures: { fam_id: $.data.id }
            - call: "POST /sleep-consulting/cases"
              payload: { family_id: "${fam_id}", consultant_id: "${cons_id}", child_birth_date: "2026-05-01", delivery_mode: "ONE_ON_ONE", guarantee_goal_night_wakings: 2 }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { case_id: $.data.id }
            - call: "POST /sleep-consulting/cases/${case_id}/questionnaire"
              payload: { answers: { night_wakings: 2, night_feeds: 1, bedtime_resistance_minutes: 30, nap_total_minutes: 120, medical_flags: false, preterm_birth: false } }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { q_id: $.data.id }
            - call: "POST /sleep-consulting/questionnaires/${q_id}/review"
              payload: { adjustment_points: 0 }
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "GET /sleep-consulting/cases/${case_id}"
              as: Consultant
              as_user_id: "${cons_id}"
              captures: { case_v: $.data.version }
            - call: "POST /sleep-consulting/cases/${case_id}/plans"
              payload: { method: "GENTLE_NO_CRY", target_night_wake_count: 2, target_longest_stretch_minutes: 240, expected_case_version: "${case_v}" }
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /sleep-consulting/cases/${case_id}/logs"
              payload: { log_date: "2026-07-30", night_wake_count: 3, longest_stretch_minutes: 120, nap_count: 2, nap_total_minutes: 130 }
              as: Parent
              as_user_id: "${fam_id}"
            - call: "POST /sleep-consulting/cases/${case_id}/logs"
              payload: { log_date: "2026-07-31", night_wake_count: 3, longest_stretch_minutes: 120, nap_count: 2, nap_total_minutes: 130 }
              as: Parent
              as_user_id: "${fam_id}"
            - call: "POST /sleep-consulting/cases/${case_id}/logs"
              payload: { log_date: "2026-08-01", night_wake_count: 3, longest_stretch_minutes: 120, nap_count: 2, nap_total_minutes: 130 }
              as: Parent
              as_user_id: "${fam_id}"
          trigger:
            - call: "GET /sleep-consulting/cases/${case_id}/logs?limit=2&offset=0"
              as: Parent
              as_user_id: "${fam_id}"
            - call: "GET /sleep-consulting/cases/${case_id}/logs?limit=2&offset=2"
              as: Parent
              as_user_id: "${fam_id}"
          assert:
            - "page 1: total_count == 3, has_more == true, exactly 2 items, response_type == array"
            - "page 2 (offset 2): exactly 1 item, has_more == false"

  # ---------------------------------------------------------------------------
  # Section: state_machines
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: initial_states_on_service_journey
        claim_type: initial_state
        grounds:
        - "state_machines.IntakeQuestionnaire"
        - "state_machines.SleepPlan"
        - "state_machines.SupportPackage"
        - "state_machines.NightlySleepLog"
        distinguishing_aspect: "Creation deposits each entity in its declared initial state: questionnaire SUBMITTED, plan ACTIVE, package ACTIVE, log PENDING_REVIEW."
        test_recipe:
          setup: ["consultant, family, case in INTAKE"]
          setup_api_calls:
            - call: "POST /sleep-consulting/consultants"
              payload: { full_name: "Dana Sleep", certification_no: "CERT-205", max_active_cases: 3 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /sleep-consulting/families"
              payload: { full_name: "Fam Z", email: "z@x.com" }
              as: Anonymous
              captures: { fam_id: $.data.id }
            - call: "POST /sleep-consulting/cases"
              payload: { family_id: "${fam_id}", consultant_id: "${cons_id}", child_birth_date: "2026-05-01", delivery_mode: "ONE_ON_ONE", guarantee_goal_night_wakings: 2 }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /sleep-consulting/cases/${case_id}/questionnaire"
              payload: { answers: { night_wakings: 2, night_feeds: 1, bedtime_resistance_minutes: 30, nap_total_minutes: 120, medical_flags: false, preterm_birth: false } }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { q_id: $.data.id, q_status: $.data.status }
            - call: "POST /sleep-consulting/questionnaires/${q_id}/review"
              payload: { adjustment_points: 0 }
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "GET /sleep-consulting/cases/${case_id}"
              as: Consultant
              as_user_id: "${cons_id}"
              captures: { case_v: $.data.version }
            - call: "POST /sleep-consulting/cases/${case_id}/plans"
              payload: { method: "GENTLE_NO_CRY", target_night_wake_count: 2, target_longest_stretch_minutes: 240, expected_case_version: "${case_v}" }
              as: Consultant
              as_user_id: "${cons_id}"
              captures: { plan_id: $.data.id, plan_status: $.data.status, plan_seq: $.data.plan_sequence }
            - call: "POST /sleep-consulting/cases/${case_id}/packages"
              payload: { tier: "BASIC", kind: "INITIAL", starts_on: "2026-08-01" }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { pkg_id: $.data.id, pkg_status: $.data.status }
            - call: "POST /sleep-consulting/cases/${case_id}/logs"
              payload: { log_date: "2026-08-01", night_wake_count: 3, longest_stretch_minutes: 120, nap_count: 2, nap_total_minutes: 130 }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { log_id: $.data.id, log_status: $.data.review_status }
          assert:
            - "IntakeQuestionnaire.${q_id}.status == SUBMITTED on creation (captured q_status)"
            - "SleepPlan.${plan_id}.status == ACTIVE on creation with plan_sequence == 1"
            - "SupportPackage.${pkg_id}.status == ACTIVE on creation"
            - "NightlySleepLog.${log_id}.review_status == PENDING_REVIEW on creation"

      - name: resume_active_plan_rejected
        claim_type: invalid_transition
        grounds:
        - "state_machines.SleepPlan.NEEDS_ADJUSTMENT_to_ACTIVE"
        - "errors[ERR_PLAN_INVALID_STATE]"
        distinguishing_aspect: "Resume is only valid from NEEDS_ADJUSTMENT; resuming an ACTIVE plan returns ERR_PLAN_INVALID_STATE and changes nothing."
        test_recipe:
          setup: ["case in ACTIVE_SUPPORT with one ACTIVE plan"]
          setup_api_calls:
            - call: "POST /sleep-consulting/consultants"
              payload: { full_name: "Dana Sleep", certification_no: "CERT-206", max_active_cases: 3 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /sleep-consulting/families"
              payload: { full_name: "Fam Z", email: "z@x.com" }
              as: Anonymous
              captures: { fam_id: $.data.id }
            - call: "POST /sleep-consulting/cases"
              payload: { family_id: "${fam_id}", consultant_id: "${cons_id}", child_birth_date: "2026-05-01", delivery_mode: "ONE_ON_ONE", guarantee_goal_night_wakings: 2 }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { case_id: $.data.id }
            - call: "POST /sleep-consulting/cases/${case_id}/questionnaire"
              payload: { answers: { night_wakings: 2, night_feeds: 1, bedtime_resistance_minutes: 30, nap_total_minutes: 120, medical_flags: false, preterm_birth: false } }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { q_id: $.data.id }
            - call: "POST /sleep-consulting/questionnaires/${q_id}/review"
              payload: { adjustment_points: 0 }
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "GET /sleep-consulting/cases/${case_id}"
              as: Consultant
              as_user_id: "${cons_id}"
              captures: { case_v: $.data.version }
            - call: "POST /sleep-consulting/cases/${case_id}/plans"
              payload: { method: "GENTLE_NO_CRY", target_night_wake_count: 2, target_longest_stretch_minutes: 240, expected_case_version: "${case_v}" }
              as: Consultant
              as_user_id: "${cons_id}"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /sleep-consulting/plans/${plan_id}/resume"
              as: Consultant
              as_user_id: "${cons_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PLAN_INVALID_STATE (HTTP 409)"
            - "SleepPlan.${plan_id}.status remains ACTIVE"

      - name: double_review_rejected
        claim_type: invalid_transition
        grounds:
        - "state_machines.IntakeQuestionnaire.SUBMITTED_to_REVIEWED"
        - "state_machines.NightlySleepLog"
        - "errors[ERR_QUESTIONNAIRE_ALREADY_REVIEWED]"
        - "errors[ERR_LOG_ALREADY_REVIEWED]"
        distinguishing_aspect: "Terminal review states reject a second review trigger on both the questionnaire (ERR_QUESTIONNAIRE_ALREADY_REVIEWED) and the nightly log (ERR_LOG_ALREADY_REVIEWED)."
        test_recipe:
          setup: ["case in ACTIVE_SUPPORT with REVIEWED questionnaire and one log already reviewed ON_TRACK"]
          setup_api_calls:
            - call: "POST /sleep-consulting/consultants"
              payload: { full_name: "Dana Sleep", certification_no: "CERT-207", max_active_cases: 3 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /sleep-consulting/families"
              payload: { full_name: "Fam Z", email: "z@x.com" }
              as: Anonymous
              captures: { fam_id: $.data.id }
            - call: "POST /sleep-consulting/cases"
              payload: { family_id: "${fam_id}", consultant_id: "${cons_id}", child_birth_date: "2026-05-01", delivery_mode: "ONE_ON_ONE", guarantee_goal_night_wakings: 2 }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { case_id: $.data.id }
            - call: "POST /sleep-consulting/cases/${case_id}/questionnaire"
              payload: { answers: { night_wakings: 2, night_feeds: 1, bedtime_resistance_minutes: 30, nap_total_minutes: 120, medical_flags: false, preterm_birth: false } }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { q_id: $.data.id }
            - call: "POST /sleep-consulting/questionnaires/${q_id}/review"
              payload: { adjustment_points: 0 }
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "GET /sleep-consulting/cases/${case_id}"
              as: Consultant
              as_user_id: "${cons_id}"
              captures: { case_v: $.data.version }
            - call: "POST /sleep-consulting/cases/${case_id}/plans"
              payload: { method: "GENTLE_NO_CRY", target_night_wake_count: 2, target_longest_stretch_minutes: 240, expected_case_version: "${case_v}" }
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /sleep-consulting/cases/${case_id}/logs"
              payload: { log_date: "2026-08-01", night_wake_count: 3, longest_stretch_minutes: 120, nap_count: 2, nap_total_minutes: 130 }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { log_id: $.data.id }
            - call: "POST /sleep-consulting/logs/${log_id}/review"
              payload: { outcome: "ON_TRACK" }
              as: Consultant
              as_user_id: "${cons_id}"
          trigger:
            - call: "POST /sleep-consulting/questionnaires/${q_id}/review"
              payload: { adjustment_points: 5 }
              as: Consultant
              as_user_id: "${cons_id}"
              captures: { err_q: $.data.error_id }
            - call: "POST /sleep-consulting/logs/${log_id}/review"
              payload: { outcome: "REGRESSION" }
              as: Consultant
              as_user_id: "${cons_id}"
              captures: { err_log: $.data.error_id }
          assert:
            - "err_q == ERR_QUESTIONNAIRE_ALREADY_REVIEWED (409)"
            - "err_log == ERR_LOG_ALREADY_REVIEWED (409); log remains REVIEWED_ON_TRACK (no REGRESSION cascade fires)"

      - name: double_respond_rejected
        claim_type: invalid_transition
        grounds:
        - "state_machines.Message.AWAITING_RESPONSE_to_RESPONDED"
        - "errors[ERR_MESSAGE_ALREADY_RESPONDED]"
