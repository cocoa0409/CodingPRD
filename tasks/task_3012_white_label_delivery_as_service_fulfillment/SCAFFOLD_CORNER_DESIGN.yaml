        distinguishing_aspect: "From DELIVERED every fulfillment trigger is closed: start-transit, report-undeliverable and cancel all fail 409 ERR_INVALID_STATE; likewise a QUOTED-cancelled order rejects cancel a second time — terminal states are absorbing on both branches."
