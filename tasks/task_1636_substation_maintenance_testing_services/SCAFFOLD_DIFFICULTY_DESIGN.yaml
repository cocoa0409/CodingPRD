  - rule_id: priority_pair_validation_conflict
    instances:
      - name: priority_state_beats_safety_on_submit_rejected
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_STATE_TRANSITION]
          - errors[ERR_CERTIFICATION_REQUIRED]
        distinguishing_aspect: |
          Error-category pair (state, business_safety): the submit call violates BOTH the state precondition
          (event already ACCEPTED) and the certification gate (cert revoked) — priority 8 state beats priority 10
          safety, so the error must be ERR_STATE_TRANSITION.
        test_recipe:
          setup:
            - "Technician with ACTIVE NETA_LEVEL_2; one oil test event fully ACCEPTED; then the certification is revoked"
          setup_api_calls:
            - call: "POST /substations"
              payload: { name: "Sub P1", code: "SUB-P1", region: "North" }
              as: OperationsManager
              captures: { sub_id: $.data.id }
            - call: "POST /asset-class-policies"
              payload: { asset_class: "POWER_TRANSFORMER", interval_months: 12, condition_escalation_threshold: 60, condition_critical_threshold: 40, oil_warn_ppm: 20, oil_critical_ppm: 35, ir_min_mohm: 1000, relay_timing_warn_pct: 5, relay_timing_fail_pct: 10, w_insulation: 0.4, w_oil: 0.35, w_relay: 0.25 }
              as: OperationsManager
            - call: "POST /assets"
              payload: { substation_id: "${sub_id}", asset_class: "POWER_TRANSFORMER", criticality: "LOW", nameplate_mva: 20, voltage_kv: 115, install_date: "2020-01-01T00:00:00Z" }
              as: OperationsManager
              captures: { asset_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech P", employee_code: "EMP-P" }
              as: OperationsManager
              captures: { tech_id: $.data.id }
            - call: "POST /technicians/${tech_id}/certifications"
              payload: { cert_type: "NETA_LEVEL_2", issued_at: "2025-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: OperationsManager
              captures: { cert_id: $.data.id }
            - call: "POST /test-events"
              payload: { asset_id: "${asset_id}", test_type: "OIL_MOISTURE", value_primary: 10, measured_at: "2026-07-01T10:00:00Z" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { te_id: $.data.id }
            - call: "POST /test-events/${te_id}/submit"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /test-events/${te_id}/review"
              payload: { decision: "ACCEPT" }
              as: ComplianceOfficer
            - call: "POST /certifications/${cert_id}/revoke"
              payload: {}
              as: OperationsManager
          trigger:
            - call: "POST /test-events/${te_id}/submit"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STATE_TRANSITION (state precondition, priority 8, evaluated before the certification gate at priority 10)"
            - "error_id != ERR_CERTIFICATION_REQUIRED although the cert is revoked"
      - name: priority_safety_beats_constraint_on_outage_create_rejected
        grounds:
          - validations[priority=12]
          - validations[priority=15]
          - errors[ERR_OPEN_CRITICAL_DEFECT]
          - errors[ERR_OUTAGE_WINDOW_CONFLICT]
        distinguishing_aspect: |
          A different error-category pair than the first instance — (business_safety, business_constraint): window
          creation violates BOTH the open-critical-defect safety rule and the overlap/buffer constraint; the safety
          error ERR_OPEN_CRITICAL_DEFECT must win.
        test_recipe:
          setup:
            - "Asset with an OPEN C1 manual defect; an existing REQUESTED window 2026-09-01 08:00-16:00; the new window overlaps it"
          setup_api_calls:
            - call: "POST /substations"
              payload: { name: "Sub P2", code: "SUB-P2", region: "East" }
              as: OperationsManager
              captures: { sub_id: $.data.id }
            - call: "POST /asset-class-policies"
              payload: { asset_class: "POWER_TRANSFORMER", interval_months: 12, condition_escalation_threshold: 60, condition_critical_threshold: 40, oil_warn_ppm: 20, oil_critical_ppm: 35, ir_min_mohm: 1000, relay_timing_warn_pct: 5, relay_timing_fail_pct: 10, w_insulation: 0.4, w_oil: 0.35, w_relay: 0.25 }
              as: OperationsManager
            - call: "POST /assets"
              payload: { substation_id: "${sub_id}", asset_class: "POWER_TRANSFORMER", criticality: "HIGH", nameplate_mva: 20, voltage_kv: 115, install_date: "2020-01-01T00:00:00Z" }
              as: OperationsManager
              captures: { asset_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech Q", employee_code: "EMP-Q" }
              as: OperationsManager
              captures: { tech_id: $.data.id }
            - call: "POST /outage-windows"
              payload: { substation_id: "${sub_id}", asset_id: "${asset_id}", start_ts: "2026-09-01T08:00:00Z", end_ts: "2026-09-01T16:00:00Z", purpose: "Existing window" }
              as: OutageCoordinator
              as_user_id: "coord-1"
              captures: { ow1_id: $.data.id }
            - call: "POST /defects"
              payload: { asset_id: "${asset_id}", title: "Active oil leak", description: "Main tank seam leak", severity: "C1" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { defect_id: $.data.id }
          trigger:
            - call: "POST /outage-windows"
              payload: { substation_id: "${sub_id}", asset_id: "${asset_id}", start_ts: "2026-09-01T12:00:00Z", end_ts: "2026-09-01T20:00:00Z", purpose: "Overlapping window" }
              as: OutageCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "trigger error_id == ERR_OPEN_CRITICAL_DEFECT (safety, priority 12, beats the window-conflict constraint at priority 15)"
            - "error_id != ERR_OUTAGE_WINDOW_CONFLICT although the windows overlap"

  - rule_id: boundary_precision_check
    instances:
      - name: oil_moisture_threshold_boundary
        grounds:
          - calculations.oil_moisture_evaluation
          - validations[priority=4]
        distinguishing_aspect: |
          Numeric threshold boundary on the ppm metric: moisture exactly equal to oil_warn_ppm (20) grades MARGINAL
          (inclusive >=), while 19.99 grades PASS — one ULP-style step across the threshold flips the grade.
        test_recipe:
          setup:
            - "Asset with oil policy warn 20 / critical 35; technician with NETA_LEVEL_2; two oil test events at 20 ppm and 19.99 ppm"
          setup_api_calls:
            - call: "POST /substations"
              payload: { name: "Sub B1", code: "SUB-B1", region: "North" }
              as: OperationsManager
              captures: { sub_id: $.data.id }
            - call: "POST /asset-class-policies"
              payload: { asset_class: "POWER_TRANSFORMER", interval_months: 12, condition_escalation_threshold: 60, condition_critical_threshold: 40, oil_warn_ppm: 20, oil_critical_ppm: 35, ir_min_mohm: 1000, relay_timing_warn_pct: 5, relay_timing_fail_pct: 10, w_insulation: 0.4, w_oil: 0.35, w_relay: 0.25 }
              as: OperationsManager
            - call: "POST /assets"
              payload: { substation_id: "${sub_id}", asset_class: "POWER_TRANSFORMER", criticality: "MEDIUM", nameplate_mva: 20, voltage_kv: 115, install_date: "2020-01-01T00:00:00Z" }
              as: OperationsManager
              captures: { asset_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech B1", employee_code: "EMP-B1" }
              as: OperationsManager
              captures: { tech_id: $.data.id }
            - call: "POST /technicians/${tech_id}/certifications"
              payload: { cert_type: "NETA_LEVEL_2", issued_at: "2025-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /test-events"
              payload: { asset_id: "${asset_id}", test_type: "OIL_MOISTURE", value_primary: 20, measured_at: "2026-07-05T10:00:00Z" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { te_at: $.data.id }
            - call: "POST /test-events"
              payload: { asset_id: "${asset_id}", test_type: "OIL_MOISTURE", value_primary: 19.99, measured_at: "2026-07-05T11:00:00Z" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { te_below: $.data.id }
          trigger:
            - call: "POST /test-events/${te_at}/submit"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { res_at: $.data.result }
            - call: "POST /test-events/${te_below}/submit"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { res_below: $.data.result }
          assert:
            - "event at exactly 20 ppm: result == MARGINAL (>= boundary is inclusive)"
            - "event at 19.99 ppm: result == PASS"
      - name: spare_reservation_zero_gap_boundary
        grounds:
          - validations[priority=16]
          - entities.SpareReservation.fields.start_ts
        distinguishing_aspect: |
          A different metric (time-interval adjacency) on a different endpoint (POST /spare-reservations): half-open
          [start, end) semantics make a zero-gap back-to-back reservation (start == prior end) legal, while a
          one-second-earlier start overlaps and is rejected.
        test_recipe:
          setup:
            - "One AVAILABLE spare unit; existing ACTIVE reservation R1 covering [2026-09-10T10:00Z, 2026-09-10T14:00Z)"
          setup_api_calls:
            - call: "POST /spare-units"
              payload: { unit_type: "SPARE_TRANSFORMER", rating_mva: 25, voltage_class_kv: 115, impedance_pct: 6.5, home_location: "Yard-A" }
              as: OperationsManager
              captures: { unit_id: $.data.id }
            - call: "POST /spare-reservations"
              payload: { spare_unit_id: "${unit_id}", unit_type: "SPARE_TRANSFORMER", required_mva: 20, required_voltage_kv: 115, start_ts: "2026-09-10T10:00:00Z", end_ts: "2026-09-10T14:00:00Z" }
              as: OutageCoordinator
              captures: { res1_id: $.data.id }
          trigger:
            - call: "POST /spare-reservations"
              payload: { spare_unit_id: "${unit_id}", unit_type: "SPARE_TRANSFORMER", required_mva: 20, required_voltage_kv: 115, start_ts: "2026-09-10T14:00:00Z", end_ts: "2026-09-10T18:00:00Z" }
              as: OutageCoordinator
              captures: { res2_id: $.data.id, res2_status: $.data.status }
            - call: "POST /spare-reservations"
              payload: { spare_unit_id: "${unit_id}", unit_type: "SPARE_TRANSFORMER", required_mva: 20, required_voltage_kv: 115, start_ts: "2026-09-10T13:59:59Z", end_ts: "2026-09-10T15:00:00Z" }
              as: OutageCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "R2 starting exactly at R1.end_ts succeeds with status == ACTIVE (adjacency allowed, zero buffer)"
            - "R3 starting one second before R1.end_ts fails with error_id == ERR_SPARE_RESERVATION_CONFLICT"

