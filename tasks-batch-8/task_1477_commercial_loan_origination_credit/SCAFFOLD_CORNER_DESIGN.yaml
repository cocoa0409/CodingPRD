          trigger:
            - { call: "GET /credit/borrowers/${bor}", as: RelationshipManager, as_user_id: "${rm}", captures: { echo: $.data.id } }
            - { call: "GET /credit/borrowers/00000000-0000-0000-0000-000000000000", as: RelationshipManager, as_user_id: "${rm}", captures: { err: $.data.error_id } }
          assert:
            - "success: response_type == 'object', meta.api_request_id and meta.api_request_timestamp present, data.id == ${bor}"
            - "error: status 404, response_type == 'error', data.error_id == ERR_NOT_FOUND, data.message present (non-empty string)"
            - "both responses carry the meta block — the envelope shape is invariant across success and failure"

