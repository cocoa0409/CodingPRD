# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 only. Deleting this file
# leaves the declared behaviour unchanged.
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: core_credit_provisional_vs_assayed_final_diverge
        grounds:
          - calculations.core_exchange_credit
          - calculations.core_lead_recovery
          - entities.CoreReturn.fields.provisional_credit_cents
          - entities.CoreReturn.fields.final_credit_cents
          - state_machines.CoreReturn.INSPECTED_to_CREDITED
        distinguishing_aspect: |
          This dual variant lives on the CoreReturn entity domain: for one and the same
          return of 10 cores, declared_provisional values them at the flat deposit
          (10 * 2200 = 22000) while assayed_final takes max(deposit value, recycled lead
          scrap value) and lands on 23643, so the two variants differ by 1643 cents on
          identical inputs.
        test_recipe:
          setup:
            - "One STANDARD TX account with a 100000000 cent credit limit, one hazmat-endorsed TX warehouse, one all-classes carrier."
            - "One FLOODED_LEAD_ACID model IB-31-FLD at 18500 cents, 26.0 kg, 12.5 kg lead, 2200 cent core deposit."
            - "One lot of 60 units manufactured 2026-06-01 (state_of_charge_pct 88.0, condition_state SELLABLE at the default clock)."
            - "One order of 10 units with core_expected_count 10, submitted, allocated, packed, certified APPROVE, dispatched and delivered on 2026-08-05."
            - "A CoreReturn declaring 10 cores, inspected with accepted_core_count 10 and still in status INSPECTED."
          setup_api_calls:
            - call: "POST /distribution/warehouses"
              payload: { code: "TX-DAL", state_code: "TX", hazmat_endorsement: true, storm_reserve_pct: 0.0, dock_capacity_kg_per_window: 100000.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { wh_tx: $.data.id }
            - call: "POST /distribution/carriers"
              payload: { code: "HAZEX", name: "Hazex Freight", accepts_hazmat_classes: ["NON_REGULATED", "UN2800_EXCEPTED", "UN2795", "UN2800", "UN2794", "UN3480_SECTION_II", "UN3480_SECTION_IA"], max_lithium_watt_hours_per_package: 5000.0, ground_only: true }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { car_haz: $.data.id }
            - call: "POST /distribution/accounts"
              payload: { name: "Delta Fleet", account_tier: "STANDARD", state_code: "TX", credit_limit_cents: 100000000, storm_priority_rank: 5 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct: $.data.id }
            - call: "POST /distribution/battery-models"
              payload: { sku: "IB-31-FLD", chemistry: "FLOODED_LEAD_ACID", nominal_voltage: 12, amp_hour_capacity: 100, peukert_exponent: 1.25, unit_weight_kg: 26.0, lead_content_kg: 12.5, core_deposit_cents: 2200, list_price_cents: 18500, warranty_free_replacement_months: 12, warranty_prorata_months: 24, shelf_life_days: 540, self_discharge_pct_per_month: 6.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { m_fld: $.data.id }
            - call: "POST /distribution/inventory-lots"
              payload: { battery_model_id: "${m_fld}", warehouse_id: "${wh_tx}", manufactured_on: "2026-06-01", quantity_on_hand: 60 }
              as: WarehouseOperator
              as_user_id: "op-1"
              captures: { lot: $.data.id }
            - call: "POST /distribution/orders"
              payload: { account_id: "${acct}", warehouse_id: "${wh_tx}", requested_ship_date: "2026-08-10" }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { ord: $.data.id }
            - call: "POST /distribution/orders/${ord}/lines"
              payload: { battery_model_id: "${m_fld}", quantity: 10, core_expected_count: 10 }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { line: $.data.id }
            - call: "POST /distribution/orders/${ord}/submit"
              payload: {}
              as: SalesRep
              as_user_id: "rep-1"
            - call: "POST /distribution/orders/${ord}/allocate"
              payload: {}
              as: WarehouseOperator
              as_user_id: "op-1"
              captures: { ord_v: $.data.version }
            - call: "POST /distribution/shipments"
              payload: { order_id: "${ord}", carrier_id: "${car_haz}", pickup_window_start: "2026-08-05T08:00:00Z", pickup_window_end: "2026-08-05T18:00:00Z", expected_order_version: "${ord_v}" }
              as: WarehouseOperator
              as_user_id: "op-1"
              captures: { shp: $.data.id }
            - call: "POST /distribution/shipments/${shp}/certify"
              payload: { certification_decision: "APPROVE" }
              as: HazmatCertifier
              as_user_id: "cert-1"
            - call: "POST /distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /distribution/shipments/${shp}/dispatch"
              payload: {}
              as: WarehouseOperator
              as_user_id: "op-1"
            - call: "POST /distribution/shipments/${shp}/deliver"
              payload: {}
              as: WarehouseOperator
              as_user_id: "op-1"
            - call: "POST /distribution/core-returns"
              payload: { account_id: "${acct}", order_id: "${ord}", battery_model_id: "${m_fld}", declared_core_count: 10 }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { cr: $.data.id, cr_prov: $.data.provisional_credit_cents }
            - call: "POST /distribution/core-returns/${cr}/inspect"
              payload: { accepted_core_count: 10 }
              as: WarehouseOperator
              as_user_id: "op-1"
          trigger:
            - call: "POST /distribution/core-returns/${cr}/credit"
              payload: {}
              as: SalesRep
              as_user_id: "rep-1"
              captures: { cr_final: $.data.final_credit_cents }
          assert:
            - "CoreReturn.${cr}.provisional_credit_cents == 22000"
            - "CoreReturn.${cr}.lead_recovered_kg == 120.625"
            - "CoreReturn.${cr}.scrap_value_cents == 23643"
            - "CoreReturn.${cr}.final_credit_cents == 23643"
            - "CoreReturn.${cr}.final_credit_cents != CoreReturn.${cr}.provisional_credit_cents"
            - "CoreReturn.${cr}.status == CREDITED"
            - "Account.${acct}.lifetime_lead_recovered_kg == 120.625"
            - "Account.${acct}.core_deposit_balance_cents == 0"

      - name: hazmat_forecast_vs_shipment_actual_diverge_on_same_order
        grounds:
          - calculations.hazmat_surcharge
          - entities.Order.fields.hazmat_fee_cents
          - entities.Shipment.fields.hazmat_surcharge_cents
          - entities.Shipment.fields.package_count
          - state_machines.Shipment.PACKED_to_CERTIFIED
        distinguishing_aspect: |
          This dual variant lives on the Order/Shipment domain, not on CoreReturn: the
          same 10 x 26.0 kg UN2794 order is charged 12708 cents by order_forecast (one
          class base fee) and 65748 cents by shipment_actual (the base fee once per each
          of the 9 thirty-kilogram packages), and certification overwrites the order's
          fee with the larger figure.
        test_recipe:
          setup:
            - "Same catalog, warehouse, carrier, account and lot as core_credit_provisional_vs_assayed_final_diverge."
            - "One order of 10 units of IB-31-FLD with core_expected_count 10, submitted and allocated, and one Shipment in status PACKED."
          setup_api_calls:
            - call: "POST /distribution/warehouses"
              payload: { code: "TX-DAL", state_code: "TX", hazmat_endorsement: true, storm_reserve_pct: 0.0, dock_capacity_kg_per_window: 100000.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { wh_tx: $.data.id }
            - call: "POST /distribution/carriers"
              payload: { code: "HAZEX", name: "Hazex Freight", accepts_hazmat_classes: ["NON_REGULATED", "UN2800_EXCEPTED", "UN2795", "UN2800", "UN2794", "UN3480_SECTION_II", "UN3480_SECTION_IA"], max_lithium_watt_hours_per_package: 5000.0, ground_only: true }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { car_haz: $.data.id }
            - call: "POST /distribution/accounts"
              payload: { name: "Delta Fleet", account_tier: "STANDARD", state_code: "TX", credit_limit_cents: 100000000, storm_priority_rank: 5 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct: $.data.id }
            - call: "POST /distribution/battery-models"
              payload: { sku: "IB-31-FLD", chemistry: "FLOODED_LEAD_ACID", nominal_voltage: 12, amp_hour_capacity: 100, peukert_exponent: 1.25, unit_weight_kg: 26.0, lead_content_kg: 12.5, core_deposit_cents: 2200, list_price_cents: 18500, warranty_free_replacement_months: 12, warranty_prorata_months: 24, shelf_life_days: 540, self_discharge_pct_per_month: 6.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { m_fld: $.data.id }
            - call: "POST /distribution/inventory-lots"
              payload: { battery_model_id: "${m_fld}", warehouse_id: "${wh_tx}", manufactured_on: "2026-06-01", quantity_on_hand: 60 }
              as: WarehouseOperator
              as_user_id: "op-1"
              captures: { lot: $.data.id }
            - call: "POST /distribution/orders"
              payload: { account_id: "${acct}", warehouse_id: "${wh_tx}", requested_ship_date: "2026-08-10" }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { ord: $.data.id }
            - call: "POST /distribution/orders/${ord}/lines"
              payload: { battery_model_id: "${m_fld}", quantity: 10, core_expected_count: 10 }
              as: SalesRep
              as_user_id: "rep-1"
            - call: "POST /distribution/orders/${ord}/submit"
              payload: {}
              as: SalesRep
              as_user_id: "rep-1"
              captures: { fee_forecast: $.data.hazmat_fee_cents, total_submit: $.data.total_cents }
            - call: "POST /distribution/orders/${ord}/allocate"
              payload: {}
              as: WarehouseOperator
              as_user_id: "op-1"
              captures: { ord_v: $.data.version }
            - call: "POST /distribution/shipments"
              payload: { order_id: "${ord}", carrier_id: "${car_haz}", pickup_window_start: "2026-08-05T08:00:00Z", pickup_window_end: "2026-08-05T18:00:00Z", expected_order_version: "${ord_v}" }
              as: WarehouseOperator
              as_user_id: "op-1"
              captures: { shp: $.data.id, pkg: $.data.package_count }
          trigger:
            - call: "POST /distribution/shipments/${shp}/certify"
              payload: { certification_decision: "APPROVE" }
              as: HazmatCertifier
              as_user_id: "cert-1"
              captures: { surcharge: $.data.hazmat_surcharge_cents }
          assert:
            - "Order.${ord}.subtotal_cents == 183150"
            - "Order.${ord}.hazmat_fee_waived == false"
            - "${fee_forecast} == 12708"
            - "${total_submit} == 195858"
            - "Shipment.${shp}.total_weight_kg == 260.0"
            - "Shipment.${shp}.package_count == 9"
            - "Shipment.${shp}.hazmat_surcharge_cents == 65748"
            - "Order.${ord}.hazmat_fee_cents == 65748"
            - "Order.${ord}.total_cents == 248898"
            - "Account.${acct}.open_receivable_cents == 248898"

  - rule_id: combinatorial_formula
    instances:

      - name: subtotal_rounds_each_line_before_summing
        grounds:
          - calculations.order_line_pricing
          - entities.OrderLine.fields.line_total_cents
          - entities.Order.fields.subtotal_cents
          - state_machines.Order.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Mode (b) - nested rounding where the order matters. Three identical lines each
          price out at exactly 26404.40 cents; rounding per line first and summing gives
          79212, while summing 79213.20 and rounding once gives 79213. The scaffold pins
          round-per-line-then-sum, so subtotal_cents must be 79212.
        test_recipe:
          setup:
            - "One PLATINUM TX account with a 100000000 cent credit limit and one hazmat-endorsed TX warehouse."
            - "One AGM model IB-MICRO-6 priced at 6001 cents, 2.5 kg, 500 cent core deposit (hazmat class UN2800_EXCEPTED)."
            - "One DRAFT order carrying three lines, each 5 units of that model with core_expected_count 0."
          setup_api_calls:
            - call: "POST /distribution/warehouses"
              payload: { code: "TX-DAL", state_code: "TX", hazmat_endorsement: true, storm_reserve_pct: 0.0, dock_capacity_kg_per_window: 100000.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { wh_tx: $.data.id }
            - call: "POST /distribution/accounts"
              payload: { name: "Pinnacle Power", account_tier: "PLATINUM", state_code: "TX", credit_limit_cents: 100000000, storm_priority_rank: 1 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct: $.data.id }
            - call: "POST /distribution/battery-models"
              payload: { sku: "IB-MICRO-6", chemistry: "AGM", nominal_voltage: 6, amp_hour_capacity: 7, peukert_exponent: 1.10, unit_weight_kg: 2.5, lead_content_kg: 1.2, core_deposit_cents: 500, list_price_cents: 6001, warranty_free_replacement_months: 12, warranty_prorata_months: 12, shelf_life_days: 730, self_discharge_pct_per_month: 3.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { m_micro: $.data.id }
            - call: "POST /distribution/orders"
              payload: { account_id: "${acct}", warehouse_id: "${wh_tx}", requested_ship_date: "2026-08-12" }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { ord: $.data.id }
            - call: "POST /distribution/orders/${ord}/lines"
              payload: { battery_model_id: "${m_micro}", quantity: 5, core_expected_count: 0 }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { l1: $.data.id }
            - call: "POST /distribution/orders/${ord}/lines"
              payload: { battery_model_id: "${m_micro}", quantity: 5, core_expected_count: 0 }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { l2: $.data.id }
            - call: "POST /distribution/orders/${ord}/lines"
              payload: { battery_model_id: "${m_micro}", quantity: 5, core_expected_count: 0 }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { l3: $.data.id }
          trigger:
            - call: "POST /distribution/orders/${ord}/submit"
              payload: {}
              as: SalesRep
              as_user_id: "rep-1"
              captures: { sub: $.data.subtotal_cents }
          assert:
            - "OrderLine.${l1}.discount_pct == 0.12"
            - "OrderLine.${l1}.line_total_cents == 26404"
            - "OrderLine.${l2}.line_total_cents == 26404"
            - "OrderLine.${l3}.line_total_cents == 26404"
            - "Order.${ord}.subtotal_cents == 79212"
            - "Order.${ord}.subtotal_cents != 79213"
            - "Order.${ord}.core_deposit_charge_cents == 7500"
            - "Order.${ord}.hazmat_fee_cents == 2210"
            - "Order.${ord}.total_cents == 88922"

      - name: hazmat_waiver_keyed_on_subtotal_not_on_total
        grounds:
          - calculations.order_total_assembly
          - entities.Order.fields.hazmat_fee_waived
          - entities.Order.fields.total_cents
          - state_machines.Order.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Mode (c) - a circular-looking dependency with a pinned evaluation order.
          subtotal_cents is 4995005, five thousand cents under the 5000000 waiver
          threshold, while total_cents finishes at 5057790, above it. Because Step 2 is
          keyed on subtotal_cents alone and runs before Steps 3 and 5, the fee is NOT
          waived and hazmat_fee_cents must be 18785, not 0.
        test_recipe:
          setup:
            - "One STANDARD TX account with a 100000000 cent credit limit and one hazmat-endorsed TX warehouse."
            - "One FLOODED_LEAD_ACID model IB-PWR-2500 priced at 252273 cents, 26.0 kg, 2200 cent core deposit."
            - "One DRAFT order carrying a single line of 20 units with core_expected_count 0."
          setup_api_calls:
            - call: "POST /distribution/warehouses"
              payload: { code: "TX-DAL", state_code: "TX", hazmat_endorsement: true, storm_reserve_pct: 0.0, dock_capacity_kg_per_window: 100000.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { wh_tx: $.data.id }
            - call: "POST /distribution/accounts"
              payload: { name: "Gulf Coast Standby", account_tier: "STANDARD", state_code: "TX", credit_limit_cents: 100000000, storm_priority_rank: 7 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct: $.data.id }
            - call: "POST /distribution/battery-models"
              payload: { sku: "IB-PWR-2500", chemistry: "FLOODED_LEAD_ACID", nominal_voltage: 12, amp_hour_capacity: 100, peukert_exponent: 1.25, unit_weight_kg: 26.0, lead_content_kg: 12.5, core_deposit_cents: 2200, list_price_cents: 252273, warranty_free_replacement_months: 12, warranty_prorata_months: 24, shelf_life_days: 540, self_discharge_pct_per_month: 6.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { m_pwr: $.data.id }
            - call: "POST /distribution/orders"
              payload: { account_id: "${acct}", warehouse_id: "${wh_tx}", requested_ship_date: "2026-08-14" }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { ord: $.data.id }
            - call: "POST /distribution/orders/${ord}/lines"
              payload: { battery_model_id: "${m_pwr}", quantity: 20, core_expected_count: 0 }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { l1: $.data.id }
          trigger:
            - call: "POST /distribution/orders/${ord}/submit"
              payload: {}
              as: SalesRep
              as_user_id: "rep-1"
              captures: { waived: $.data.hazmat_fee_waived, total: $.data.total_cents }
          assert:
            - "OrderLine.${l1}.discount_pct == 0.01"
            - "Order.${ord}.subtotal_cents == 4995005"
            - "Order.${ord}.hazmat_fee_waived == false"
            - "Order.${ord}.hazmat_fee_cents == 18785"
            - "Order.${ord}.core_deposit_charge_cents == 44000"
            - "Order.${ord}.total_cents == 5057790"
            - "Order.${ord}.total_cents > 5000000 while Order.${ord}.hazmat_fee_cents > 0"

      - name: runtime_sizing_peukert_derate_and_unit_count_tiebreak
        grounds:
          - calculations.runtime_sizing
          - calculations.runtime_sizing_selector
          - calculations.service_contract_fee
          - state_machines.ServiceContract.DRAFT_to_SIZED
        distinguishing_aspect: |
          Mode (a) - a five-input non-linear formula: load_watts, system_voltage,
          required_runtime_minutes, ambient_temp_c and the model's peukert_exponent
          combine through a fractional power, a tiered temperature derate and two nested
          ceils. AGM and lithium both land on 8 units, so the winner is decided by the
          second ranking key (unit_count * list_price_cents: 208000 beats 712000).
        test_recipe:
          setup:
            - "One GOLD-tier-eligible account and two ACTIVE catalog models: IB-AGM-95 (AGM, 12 V, 95 Ah, peukert 1.10, 26000 cents) and IB-LFP-100 (lithium iron phosphate, 12 V, 100 Ah, peukert 1.02, 89000 cents)."
            - "One DRAFT ServiceContract for 2400 W over 90 minutes on a 48 V bus at 10.0 C, allowing AGM and LITHIUM_IRON_PHOSPHATE."
          setup_api_calls:
            - call: "POST /distribution/accounts"
              payload: { name: "Metro Data Halls", account_tier: "GOLD", state_code: "TX", credit_limit_cents: 100000000, storm_priority_rank: 3 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct: $.data.id }
            - call: "POST /distribution/battery-models"
              payload: { sku: "IB-AGM-95", chemistry: "AGM", nominal_voltage: 12, amp_hour_capacity: 95, peukert_exponent: 1.10, unit_weight_kg: 28.0, lead_content_kg: 13.0, core_deposit_cents: 2500, list_price_cents: 26000, warranty_free_replacement_months: 24, warranty_prorata_months: 36, shelf_life_days: 730, self_discharge_pct_per_month: 3.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { m_agm: $.data.id }
            - call: "POST /distribution/battery-models"
              payload: { sku: "IB-LFP-100", chemistry: "LITHIUM_IRON_PHOSPHATE", nominal_voltage: 12, amp_hour_capacity: 100, peukert_exponent: 1.02, unit_weight_kg: 13.0, lead_content_kg: 0.0, core_deposit_cents: 0, list_price_cents: 89000, warranty_free_replacement_months: 36, warranty_prorata_months: 24, shelf_life_days: 1095, self_discharge_pct_per_month: 1.5 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { m_lfp: $.data.id }
            - call: "POST /distribution/service-contracts"
              payload: { account_id: "${acct}", coverage_tier: "GOLD", load_watts: 2400, required_runtime_minutes: 90, system_voltage: 48, ambient_temp_c: 10.0, allowed_chemistries: ["AGM", "LITHIUM_IRON_PHOSPHATE"] }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { sc: $.data.id }
          trigger:
            - call: "POST /distribution/service-contracts/${sc}/size"
              payload: {}
              as: SalesRep
              as_user_id: "rep-1"
              captures: { picked: $.data.sized_battery_model_id, monthly: $.data.monthly_fee_cents }
          assert:
            - "ServiceContract.${sc}.dc_load_amps == 55.556"
            - "ServiceContract.${sc}.temp_derate_factor == 0.87"
            - "ServiceContract.${sc}.required_peukert_ah == 86.782"
            - "ServiceContract.${sc}.sized_battery_model_id == ${m_agm}"
            - "ServiceContract.${sc}.sized_units_per_string == 4"
            - "ServiceContract.${sc}.sized_string_count == 2"
            - "ServiceContract.${sc}.sized_unit_count == 8"
            - "ServiceContract.${sc}.covered_value_cents == 208000"
            - "ServiceContract.${sc}.monthly_fee_cents == 9900"
            - "ServiceContract.${sc}.prepay_total_cents == 118800"
            - "ServiceContract.${sc}.status == SIZED"

  - rule_id: non_linear_state_machine
    instances:

      - name: core_return_dispute_cycle_reenters_inspected
        grounds:
          - state_machines.CoreReturn.INSPECTED_to_DISPUTED
          - state_machines.CoreReturn.DISPUTED_to_INSPECTED
          - entities.CoreReturn.fields.inspection_round
          - calculations.core_lead_recovery
        distinguishing_aspect: |
          A true cycle on the CoreReturn entity: INSPECTED -> DISPUTED -> INSPECTED
          returns the row to a state it already occupied while inspection_round strictly
          increases from 1 to 2 and the second round's assay (accepted 10, lead 120.625)
          overwrites the first round's (accepted 8, lead 96.500).
        test_recipe:
          setup:
            - "One STANDARD TX account, one hazmat-endorsed TX warehouse, one all-classes carrier, model IB-31-FLD, one 60-unit lot."
            - "One delivered order of 10 units with core_expected_count 10."
            - "One CoreReturn declaring 10 cores, inspected once with accepted_core_count 8, then disputed."
          setup_api_calls:
            - call: "POST /distribution/warehouses"
              payload: { code: "TX-DAL", state_code: "TX", hazmat_endorsement: true, storm_reserve_pct: 0.0, dock_capacity_kg_per_window: 100000.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { wh_tx: $.data.id }
            - call: "POST /distribution/carriers"
              payload: { code: "HAZEX", name: "Hazex Freight", accepts_hazmat_classes: ["NON_REGULATED", "UN2800_EXCEPTED", "UN2795", "UN2800", "UN2794", "UN3480_SECTION_II", "UN3480_SECTION_IA"], max_lithium_watt_hours_per_package: 5000.0, ground_only: true }
              as: PlatformAdmin
