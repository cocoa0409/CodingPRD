            - { call: "POST /safety/drivers", payload: { carrier_id: "${ca}", cdl_number: "CDL-2313A", full_name: "Amy Ule", hire_date: "2025-01-01T00:00:00Z" }, as: SafetyManager, captures: { da: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${cb}", cdl_number: "CDL-2313B", full_name: "Ben Ule", hire_date: "2025-01-01T00:00:00Z" }, as: SafetyManager, captures: { db: $.data.id } }
            - { call: "POST /safety/roadside-inspections", payload: { carrier_id: "${ca}", driver_id: "${da}", report_number: "R-SHARED", inspection_date: "2026-05-01T00:00:00Z", inspection_level: 1, state_code: "MO" }, as: SafetyManager }
          trigger:
            - { call: "POST /safety/roadside-inspections", payload: { carrier_id: "${ca}", driver_id: "${da}", report_number: "R-SHARED", inspection_date: "2026-06-01T00:00:00Z", inspection_level: 2, state_code: "MO" }, as: SafetyManager, captures: { err: $.data.error_id } }
            - { call: "POST /safety/roadside-inspections", payload: { carrier_id: "${cb}", driver_id: "${db}", report_number: "R-SHARED", inspection_date: "2026-05-01T00:00:00Z", inspection_level: 1, state_code: "KS" }, as: SafetyManager, captures: { ok: $.data.id } }
          assert:
            - "same carrier, same report_number -> ERR_DUPLICATE_REPORT_NUMBER (409)"
            - "different carrier, same report_number -> 201"

      - name: readiness_gate_blocks_field_work
        claim_type: cross_entity_validation
        grounds: ["errors[ERR_AUDIT_READINESS_INCOMPLETE]", "endpoints[GET /safety/carriers/{id}/audit-readiness]"]
        distinguishing_aspect: "start-field-work is gated by the computed audit readiness: one ACTIVE driver without a DQ_FILE makes ready false and blocks the transition."
        test_recipe:
          setup: ["carrier with one ACTIVE driver and NO DQ_FILE document; COMPLIANCE_REVIEW audit SCHEDULED for 2026-08-01"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2314", legal_name: "Ready Carrier", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-2314", full_name: "Cid Afe", hire_date: "2025-01-01T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
            - { call: "POST /safety/compliance-audit-cases", payload: { carrier_id: "${c_id}", audit_type: "COMPLIANCE_REVIEW", scheduled_date: "2026-08-01T00:00:00Z", field_work_duration_days: 7 }, as: SafetyAdmin, captures: { au: $.data.id } }
          trigger:
            - { call: "GET /safety/carriers/${c_id}/audit-readiness", payload: {}, as: SafetyAdmin, captures: { ready: $.data.ready, missing: $.data.missing_dq_driver_count } }
            - { call: "POST /safety/compliance-audit-cases/${au}/start-field-work", payload: {}, as: SafetyAdmin, captures: { err: $.data.error_id } }
          assert:
            - "audit-readiness: ready == false, missing_dq_driver_count == 1, accident_register_gap == 0"
            - "start-field-work -> ERR_AUDIT_READINESS_INCOMPLETE (409); audit stays SCHEDULED"

      - name: purge_blocked_by_open_audit
        claim_type: cross_entity_validation
        grounds: ["errors[ERR_AUDIT_HOLD_ACTIVE]"]
        distinguishing_aspect: "Referential hold: a PURGE_ELIGIBLE document cannot be purged while any audit of the carrier is in an open (non-terminal) status."
        test_recipe:
          setup: ["carrier; INSPECTION_REPORT filed 2025-06-01 (retention_until 2026-06-01); cycle run -> PURGE_ELIGIBLE; a SCHEDULED audit exists"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2315", legal_name: "Hold Carrier", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/document-records", payload: { carrier_id: "${c_id}", document_type: "INSPECTION_REPORT", filed_at: "2025-06-01T00:00:00Z" }, as: SafetyManager, captures: { doc: $.data.id } }
            - { call: "POST /safety/measurement-cycles", payload: { carrier_id: "${c_id}" }, as: ComplianceAnalyst, captures: { purged_n: $.data.documents_marked_purge_eligible } }
            - { call: "POST /safety/compliance-audit-cases", payload: { carrier_id: "${c_id}", audit_type: "COMPLIANCE_REVIEW", scheduled_date: "2026-09-01T00:00:00Z", field_work_duration_days: 7 }, as: SafetyAdmin, captures: { au: $.data.id } }
          trigger:
            - { call: "POST /safety/document-records/${doc}/purge", payload: {}, as: SafetyManager, captures: { err: $.data.error_id } }
          assert:
            - "cycle marked exactly 1 document PURGE_ELIGIBLE"
            - "purge while the audit is SCHEDULED -> ERR_AUDIT_HOLD_ACTIVE (409); document stays PURGE_ELIGIBLE"

      - name: purge_state_errors_and_terminal_lockdown
        claim_type: invalid_transition
        grounds: [state_machines.DocumentRecord, "errors[ERR_RETENTION_NOT_EXPIRED]", "errors[ERR_DOCUMENT_ALREADY_PURGED]"]
        distinguishing_aspect: "Purge state ladder: RETAINED -> ERR_RETENTION_NOT_EXPIRED; after the cycle sweep PURGE_ELIGIBLE -> PURGED succeeds; a second purge on the terminal PURGED -> ERR_DOCUMENT_ALREADY_PURGED."
        test_recipe:
          setup: ["carrier; INSPECTION_REPORT filed 2025-06-01 (already past retention at the default clock)"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2316", legal_name: "Purge Carrier", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/document-records", payload: { carrier_id: "${c_id}", document_type: "INSPECTION_REPORT", filed_at: "2025-06-01T00:00:00Z" }, as: SafetyManager, captures: { doc: $.data.id } }
          trigger:
            - { call: "POST /safety/document-records/${doc}/purge", payload: {}, as: SafetyManager, captures: { err1: $.data.error_id } }
            - { call: "POST /safety/measurement-cycles", payload: { carrier_id: "${c_id}" }, as: ComplianceAnalyst }
            - { call: "POST /safety/document-records/${doc}/purge", payload: {}, as: SafetyManager, captures: { st: $.data.status } }
            - { call: "POST /safety/document-records/${doc}/purge", payload: {}, as: SafetyManager, captures: { err2: $.data.error_id } }
          assert:
            - "purge while RETAINED -> ERR_RETENTION_NOT_EXPIRED (409)"
            - "after cycle: purge -> PURGED"
            - "third purge -> ERR_DOCUMENT_ALREADY_PURGED (409, terminal lockdown)"

      - name: post_accident_requires_accident_link
        claim_type: violation_to_error
        grounds: ["errors[ERR_MISSING_ACCIDENT_LINK]"]
        distinguishing_aspect: "Conditional field pairing: POST_ACCIDENT without accident_id fails; accident_id supplied on a non-POST_ACCIDENT test also fails."
        test_recipe:
          setup: ["carrier; driver; one accident"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2317", legal_name: "Link Carrier", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-2317", full_name: "Dee Udo", hire_date: "2025-01-01T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
            - { call: "POST /safety/accident-records", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", occurred_at: "2026-07-01T00:00:00Z", fatalities: 0, injuries: 1, tow_away: false }, as: SafetyManager, as_user_id: "sm-1", captures: { acc: $.data.id } }
          trigger:
            - { call: "POST /safety/drug-alcohol-tests", payload: { driver_id: "${d_id}", test_type: "POST_ACCIDENT", substance: "DRUG", collected_at: "2026-07-02T00:00:00Z" }, as: SafetyManager, captures: { err1: $.data.error_id } }
            - { call: "POST /safety/drug-alcohol-tests", payload: { driver_id: "${d_id}", test_type: "RANDOM", substance: "DRUG", collected_at: "2026-07-02T00:00:00Z", accident_id: "${acc}" }, as: SafetyManager, captures: { err2: $.data.error_id } }
          assert:
            - "POST_ACCIDENT without accident_id -> ERR_MISSING_ACCIDENT_LINK (400)"
            - "RANDOM with accident_id -> ERR_MISSING_ACCIDENT_LINK (400)"

