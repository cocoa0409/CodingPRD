      - name: pause_resume_conserve_recorded_seconds
        grounds:
          - state_machines.AudioCapture.RECORDING_to_PAUSED
          - state_machines.AudioCapture.PAUSED_to_RECORDING
          - entities.AudioCapture.fields.recorded_seconds
        distinguishing_aspect: |
          Conserved quantity: AudioCapture.recorded_seconds (a duration, a
          different quantity type from a counter). The pause/resume pair is the
          compensating pair: recorded_seconds = sum of RECORDING intervals only,
          so inserting a pause+resume cycle leaves the recorded total equal to
          wall time minus paused time (105s for a 120s window with a 15s pause).
        test_recipe:
          setup:
            - "Capture recording from 16:00:00, paused 16:01:00, resumed 16:01:15, stopped 16:02:00"
          setup_api_calls:
            - call: "POST /ambient-clinical-documentation/patients"
              payload: { mrn: "MRN-CI2-1", full_name: "Pat Ci2" }
              as: PlatformAdmin
              captures: { pat: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/physicians"
              payload: { npi: "NPI-CI2-1", full_name: "Doc Ci2", specialty_code: "CARD" }
              as: PlatformAdmin
              captures: { phy: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ambient-clinical-documentation/encounters"
              payload: { patient_id: "${pat}", physician_id: "${phy}" }
              as: Physician
              as_user_id: "${phy}"
              captures: { enc: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/consents"
              payload: { patient_id: "${pat}", signage_posted: true, captured_via: "ROOM_SIGNAGE" }
              as: Patient
              as_user_id: "${pat}"
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/start"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/audio-captures"
              payload: { planned_retention_days: 30 }
              as: Physician
              as_user_id: "${phy}"
              captures: { cap: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T16:01:00Z" }
              as: PlatformAdmin
            - call: "POST /ambient-clinical-documentation/audio-captures/${cap}/pause"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T16:01:15Z" }
              as: PlatformAdmin
            - call: "POST /ambient-clinical-documentation/audio-captures/${cap}/resume"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
          trigger:
            - call: "POST /ambient-clinical-documentation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T16:02:00Z" }
              as: PlatformAdmin
            - call: "POST /ambient-clinical-documentation/audio-captures/${cap}/stop"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
              captures: { rec_secs: "$.data.recorded_seconds", st: "$.data.status" }
          assert:
            - "rec_secs == 105 (RECORDING intervals 60s + 45s; the 15s pause is excluded — the pause/resume pair conserves the recorded quantity)"
            - "st == CAPTURED"
            - "Invariant: recorded_seconds + paused_seconds (15) == wall_seconds (120) between started_at and ended_at"
