            - "response.data.error_id == ERR_APPRAISAL_NOT_ACCEPTED"

      - name: endorsement_with_expired_appraisal
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_APPRAISAL_EXPIRED]", "state_machines.Appraisal.ACCEPTED_to_EXPIRED"]
        distinguishing_aspect: "After the clock sweep expires the case's ACCEPTED appraisal (clock at expiry_date 2026-05-01), endorsement is rejected 409 ERR_APPRAISAL_EXPIRED — the half-open window excludes the expiry date."
        test_recipe:
          setup: ["one case in UNDERWRITE_SUBMITTED; its ACCEPTED appraisal (effective 2026-01-01, expiry 2026-05-01) swept to EXPIRED by a clock advance to 2026-05-01"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-10T00:00:00Z" }, as: PlatformAdmin }
