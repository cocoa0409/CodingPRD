        grounds:
          - "state_machines.FiscalYearPeriod.OPEN_to_CLOSED"
        excluded_because:
          difficulty_instance: fiscal_close_carryforward_cascade
          rationale: "Depth-3 close cascade asserted by the named §1.8 instance."
      - name: layer_cascade_downtime
