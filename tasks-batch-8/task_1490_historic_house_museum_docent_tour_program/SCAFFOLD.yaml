# =============================================================================
# Scaffold: Historic House Museum Docent & Tour Program
# =============================================================================

scenario: |
  Historic House Museum Docent & Tour Program (historic house museum): tour schedule & capacity by room/route, docent recruitment, training & shift scheduling, script/interpretation update & accuracy review, admission ticketing & member free admission, school group booking & curriculum alignment, special/candlelight tour programming, collection safety rules during tours, visitor survey & interpretation improvement

domain_name: historic-house-museum-tours
api_prefix: /

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation        # finite per-slot seat pool: reserve / confirm / release
  secondary_archetype: temporal_windowing    # room-occupancy windows + docent shift buffers
  complexity_layers:
    - cascading_side_effects                 # incident -> room -> slots -> bookings/shifts; docent -> shifts -> slot staffing
    - dual_variant_calculation               # revenue committed vs projected; readiness standard vs apprentice
    - optimistic_concurrency                 # OCC on TourRoute.version (publish) and TourSlot.version (reschedule)
    - rate_threshold_triggers                # certification thresholds, review score floor, chaperone ratios, refund tiers
  entity_topology: flat                      # peer entities joined by foreign keys; no nested URL ownership
  state_machine_shape: cyclic                # ScriptVersion review loop; TourSlot OPEN<->FULL; Member ACTIVE<->LAPSED
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: hierarchical_override          # MuseumAdmin superset + override; peer staff roles own distinct surfaces
  consistency_model: immediate               # all cascades/derived fields settle within the triggering request

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Room
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Room display name (e.g., 'East Parlor')" }
      - { name: floor, type: integer, source: input, description: "Floor number" }
      - { name: capacity_max, type: integer, source: input, description: "Maximum persons physically allowed in the room at once; >= 1" }
      - { name: safety_max_party, type: integer, source: input, description: "Maximum size of a single tour party admitted to this room under collection-safety rules; >= 1" }
      - { name: collection_tier, type: enum, source: input, description: "STANDARD | LIGHT_SENSITIVE | HIGH_VALUE — drives safety rules and candlelight prohibition" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED_RESTORATION — CLOSED_RESTORATION set by CRITICAL safety incident cascade, reopened on resolve", default: OPEN }

  - name: TourRoute
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Route name (e.g., 'Main Floor Highlights')" }
      - { name: kind, type: enum, source: input, description: "STANDARD | SCHOOL | CANDLELIGHT — drives capacity buffer and pricing multiplier" }
      - { name: room_ids, type: array, source: input, description: "FK -> Room.id; ordered array of rooms visited, at least 1, each room must exist and determines per-room occupancy windows" }
      - { name: duration_minutes, type: integer, source: input, description: "Total in-house tour duration; >= 10" }
      - { name: base_price_cents, type: integer, source: input, description: "Base per-person admission in cents for GENERAL bookings; >= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED", default: DRAFT }
      - { name: published_script_id, type: string, source: system, description: "FK -> ScriptVersion.id; currently PUBLISHED script for this route, null until first publish" }

  - name: ScriptVersion
    parent: null
    common_fields: true
    fields:
      - { name: route_id, type: string, source: system, description: "FK -> TourRoute.id; taken from the creation path" }
      - { name: version_no, type: integer, source: system, description: "Per-route monotonic version number, starts at 1 for the route's first script" }
      - { name: content_text, type: string, source: input, description: "Docent interpretation script body" }
      - { name: curriculum_standards, type: array, source: input, description: "Array of curriculum standard codes (e.g., ['HIST-5','CIV-3']) this script is aligned to; may be empty" }
      - { name: status, type: enum, source: system, description: "DRAFT | IN_REVIEW | APPROVED | PUBLISHED | SUPERSEDED | REJECTED", default: DRAFT }
      - { name: accuracy_score, type: integer, source: system, description: "0-100 accuracy score recorded at APPROVE review; null until approved" }
      - { name: reviewer_notes, type: string, source: system, description: "Notes captured from the review decision; null until reviewed" }

  - name: TourSlot
    parent: null
    common_fields: true
    fields:
      - { name: route_id, type: string, source: input, description: "FK -> TourRoute.id; route this slot runs" }
      - { name: start_at, type: datetime, source: input, description: "Tour start (ISO 8601 UTC); must be strictly after the logical clock at creation" }
      - { name: end_at, type: datetime, source: computed, description: "start_at + route.duration_minutes, recomputed on reschedule" }
      - { name: capacity, type: integer, source: computed, description: "Snapshot at creation: min(capacity_max over route rooms) - kind buffer (STANDARD 2, SCHOOL 0, CANDLELIGHT 4), floored at 1; later room edits do NOT retroactively change it" }
      - { name: seats_reserved, type: integer, source: computed, description: "Sum of party_size over this slot's RESERVED bookings" }
      - { name: seats_confirmed, type: integer, source: computed, description: "Sum of party_size over this slot's CONFIRMED bookings" }
      - { name: seats_available, type: integer, source: computed, description: "capacity - seats_reserved - seats_confirmed; never negative" }
      - { name: revenue_committed_cents, type: integer, source: computed, description: "Sum of total_price_cents over CONFIRMED bookings (variant: committed)" }
      - { name: revenue_projected_cents, type: integer, source: computed, description: "committed + round_half_up(sum of RESERVED totals x 0.8) (variant: forward-looking)" }
      - { name: staffing_status, type: enum, source: computed, description: "STAFFED if a CONFIRMED LEAD shift exists; NEEDS_LEAD if a non-terminal ASSIGNED LEAD exists but none confirmed; UNSTAFFED otherwise" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN | FULL | IN_PROGRESS | COMPLETED | CANCELLED", default: SCHEDULED }

  - name: Docent
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Docent full name" }
      - { name: email, type: string, source: input, description: "Contact email, unique per docent" }
      - { name: status, type: enum, source: system, description: "APPLICANT | TRAINEE | CERTIFIED | INACTIVE", default: APPLICANT }
      - { name: training_hours, type: integer, source: system, description: "Accumulated training hours from HOURS training records; starts 0" }
      - { name: shadow_tours_completed, type: integer, source: system, description: "Count of SHADOW_TOUR training records; starts 0" }
      - { name: quiz_score, type: integer, source: system, description: "Latest QUIZ training record value 0-100; null until first quiz" }
      - { name: certified_route_ids, type: array, source: system, description: "FK -> TourRoute.id (array); routes granted at certification" }
      - { name: readiness_standard_score, type: integer, source: computed, description: "Weighted readiness, standard track weights (0.3 hours, 0.3 shadow, 0.4 quiz), 0-100 rounded half-up" }
      - { name: readiness_apprentice_score, type: integer, source: computed, description: "Weighted readiness, apprentice track weights (0.5 hours, 0.4 shadow, 0.1 quiz), 0-100 rounded half-up" }

  - name: ShiftAssignment
    parent: null
    common_fields: true
    fields:
      - { name: docent_id, type: string, source: input, description: "FK -> Docent.id; assigned docent" }
      - { name: slot_id, type: string, source: input, description: "FK -> TourSlot.id; assigned slot" }
      - { name: shift_role, type: enum, source: input, description: "LEAD | SHADOW — LEAD requires CERTIFIED on the slot's route; SHADOW requires TRAINEE or CERTIFIED" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | CONFIRMED | DECLINED | COMPLETED | NO_SHOW | CANCELLED", default: ASSIGNED }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: email, type: string, source: input, description: "Member email" }
      - { name: member_number, type: string, source: input, description: "External membership number, unique" }
      - { name: renews_on, type: string, source: input, description: "Membership renewal date (YYYY-MM-DD); lapses after this date" }
      - { name: status, type: enum, source: system, description: "ACTIVE | LAPSED | EXPIRED", default: ACTIVE }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: slot_id, type: string, source: input, description: "FK -> TourSlot.id; slot being booked" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; required and non-null iff booking_kind=MEMBER, otherwise must be absent" }
      - { name: booking_kind, type: enum, source: input, description: "GENERAL | MEMBER | SCHOOL" }
      - { name: visitor_name, type: string, source: input, description: "Lead visitor / school contact name" }
      - { name: party_size, type: integer, source: input, description: "Total attendees for GENERAL and MEMBER (member included); forbidden for SCHOOL where party_size is computed as student_count + chaperone_count" }
      - { name: student_count, type: integer, source: input, description: "SCHOOL only: number of students; >= 1" }
      - { name: chaperone_count, type: integer, source: input, description: "SCHOOL only: number of chaperones; >= 0" }
      - { name: grade_level, type: string, source: input, description: "SCHOOL only: grade band (e.g., '5')" }
      - { name: curriculum_standard, type: string, source: input, description: "SCHOOL only: requested curriculum standard code; must be covered by the route's PUBLISHED script" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Per-person price actually applied (after kind multiplier and rounding); 0 for the member's own seat concept" }
      - { name: total_price_cents, type: integer, source: computed, description: "Charged total per pricing rules; 0 for a solo ACTIVE member booking" }
      - { name: refund_cents, type: integer, source: computed, description: "Refund determined at cancellation by the time-tier rule; 0 until cancellation" }
      - { name: hold_expires_at, type: datetime, source: computed, description: "min(created_at + 48h, slot.start_at); RESERVED bookings expire at this instant" }
      - { name: status, type: enum, source: system, description: "RESERVED | CONFIRMED | CANCELLED | EXPIRED", default: RESERVED }

  - name: SafetyIncident
    parent: null
    common_fields: true
    fields:
      - { name: room_id, type: string, source: input, description: "FK -> Room.id; room where the incident occurred" }
      - { name: slot_id, type: string, source: input, description: "FK -> TourSlot.id; optional, the tour in progress when the incident occurred" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | CRITICAL — CRITICAL closes the room and cascades cancellations" }
      - { name: description, type: string, source: input, description: "Free-text incident description" }
      - { name: status, type: enum, source: system, description: "REPORTED | RESOLVED", default: REPORTED }

  - name: VisitorSurvey
    parent: null
    common_fields: false
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id; taken from the creation path" }
      - { name: slot_id, type: string, source: system, description: "FK -> TourSlot.id; derived from the booking's slot" }
      - { name: overall_rating, type: integer, source: input, description: "1-5 overall satisfaction" }
      - { name: interpretation_clarity, type: integer, source: input, description: "1-5 clarity of the docent's interpretation" }
      - { name: would_recommend, type: boolean, source: input, description: "Whether the visitor would recommend the tour" }
      - { name: comment, type: string, source: input, description: "Optional free-text comment" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | REVIEWED", default: SUBMITTED }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Room
    field: status
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CLOSED_RESTORATION
        trigger: "system (SafetyIncident created with severity=CRITICAL for this room)"
        actor: system
        preconditions: []
        side_effects:
          - "Room closes; cascade hop 2: every TourSlot whose route contains this room with status in {SCHEDULED, OPEN, FULL} and start_at > now -> CANCELLED"
          - "Cascade hop 3: for each such slot, its Bookings in {RESERVED, CONFIRMED} -> CANCELLED (CONFIRMED refund_cents = total_price_cents in full, bypassing time tiers) and its ShiftAssignments in {ASSIGNED, CONFIRMED} -> CANCELLED"
      - from: CLOSED_RESTORATION
        to: OPEN
        trigger: "system (POST /safety-incidents/{id}/resolve when no other REPORTED CRITICAL incident references this room)"
        actor: system
        preconditions:
          - "No other SafetyIncident with this room_id has severity=CRITICAL and status=REPORTED"
        side_effects: []

  - entity: TourRoute
    field: status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /tour-routes/{id}/activate"
        actor: MuseumAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /tour-routes/{id}/retire"
        actor: MuseumAdmin
        preconditions:
          - "No TourSlot with this route_id in status {SCHEDULED, OPEN, FULL} with start_at > now (else ERR_ROUTE_HAS_FUTURE_SLOTS)"
        side_effects: []

  - entity: ScriptVersion
    field: status
    initial_state: DRAFT
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /script-versions/{id}/submit"
        actor: Curator
        preconditions: []
        side_effects: []
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /script-versions/{id}/review with decision=APPROVE"
        actor: Curator
        preconditions:
          - "accuracy_score provided and >= 80 (else ERR_REVIEW_SCORE_TOO_LOW)"
        side_effects:
          - "Records accuracy_score and reviewer_notes on the script"
      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /script-versions/{id}/review with decision=REQUEST_REVISION"
        actor: Curator
        preconditions: []
        side_effects:
          - "Script returns to DRAFT for editing cycle; version_no unchanged"
        note: "Revision loop DRAFT -> IN_REVIEW -> DRAFT is allowed indefinitely"
      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /script-versions/{id}/review with decision=REJECT"
        actor: Curator
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: PUBLISHED
        trigger: "POST /script-versions/{id}/publish with expected_route_version"
        actor: MuseumAdmin
        preconditions:
          - "expected_route_version equals the parent TourRoute.version (else ERR_STALE_VERSION)"
        side_effects:
          - "TourRoute.published_script_id := this script; increments TourRoute.version by 1"
          - "Any other ScriptVersion of the same route in PUBLISHED -> SUPERSEDED"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (another ScriptVersion of the same route is published)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TourSlot
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /tour-slots/{id}/open"
        actor: MuseumAdmin
        preconditions:
          - "Route status == ACTIVE (else ERR_ROUTE_NOT_ACTIVE)"
          - "Route has a PUBLISHED script, i.e. route.published_script_id is non-null (else ERR_SCRIPT_NOT_PUBLISHED)"
          - "Every room on the route has status OPEN (else ERR_ROOM_CLOSED)"
          - "staffing_status == STAFFED, i.e. a CONFIRMED LEAD ShiftAssignment exists (else ERR_SLOT_NOT_STAFFED)"
        side_effects: []
      - from: OPEN
        to: FULL
        trigger: "system (booking create/confirm leaves seats_available == 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FULL
        to: OPEN
        trigger: "system (booking cancel/expire leaves seats_available > 0)"
        actor: system
        preconditions: []
        side_effects:
          - "Slot reopens for booking"
        note: "OPEN -> FULL -> OPEN cycle may repeat arbitrarily"
      - from: [OPEN, FULL]
        to: IN_PROGRESS
        trigger: "POST /tour-slots/{id}/advance with to_status=IN_PROGRESS"
        actor: "MuseumAdmin or FrontDeskStaff"
        preconditions:
          - "Logical clock now >= slot.start_at (else ERR_INVALID_STATE)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /tour-slots/{id}/advance with to_status=COMPLETED"
        actor: "MuseumAdmin or FrontDeskStaff"
        preconditions: []
        side_effects:
          - "Slot's CONFIRMED ShiftAssignments may now be resolved COMPLETED / NO_SHOW; surveys open for its CONFIRMED bookings"
      - from: [SCHEDULED, OPEN, FULL]
        to: CANCELLED
        trigger: "POST /tour-slots/{id}/cancel, or system cascade (route room closed by CRITICAL incident)"
        actor: "MuseumAdmin or system"
        preconditions: []
        side_effects:
          - "Bookings in {RESERVED, CONFIRMED} -> CANCELLED; CONFIRMED bookings get refund_cents = total_price_cents in full (manual cancel keeps time-tier rule, incident cascade forces 100%)"
          - "ShiftAssignments in {ASSIGNED, CONFIRMED} -> CANCELLED; staffing_status recomputed"

  - entity: Docent
    field: status
    initial_state: APPLICANT
    terminal_states: [INACTIVE]
    transitions:
      - from: APPLICANT
        to: TRAINEE
        trigger: "POST /docents/{id}/advance with to_status=TRAINEE"
        actor: DocentCoordinator
        preconditions: []
        side_effects: []
      - from: TRAINEE
        to: CERTIFIED
        trigger: "POST /docents/{id}/advance with to_status=CERTIFIED"
        actor: DocentCoordinator
        preconditions:
          - "training_hours >= 20 AND shadow_tours_completed >= 3 AND quiz_score >= 85 AND readiness_standard_score >= 70 (else ERR_CERTIFICATION_NOT_MET)"
          - "route_ids provided (non-empty); becomes certified_route_ids"
        side_effects:
          - "certified_route_ids := request route_ids"
      - from: [TRAINEE, CERTIFIED]
        to: INACTIVE
        trigger: "POST /docents/{id}/deactivate"
        actor: DocentCoordinator
        preconditions: []
        side_effects:
          - "Cascade hop 1: this docent's ShiftAssignments in {ASSIGNED, CONFIRMED} whose slot.start_at > now -> CANCELLED"
          - "Cascade hop 2: each affected TourSlot recomputes staffing_status (a STAFFED slot losing its only CONFIRMED LEAD becomes UNSTAFFED)"

  - entity: ShiftAssignment
    field: status
    initial_state: ASSIGNED
    terminal_states: [DECLINED, COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: ASSIGNED
        to: CONFIRMED
        trigger: "POST /shift-assignments/{id}/confirm"
        actor: Docent
        preconditions:
          - "X-User-ID == shift.docent_id (else ERR_FORBIDDEN)"
        side_effects:
          - "Slot staffing_status recomputed (a LEAD confirm moves UNSTAFFED/NEEDS_LEAD -> STAFFED)"
      - from: ASSIGNED
        to: DECLINED
        trigger: "POST /shift-assignments/{id}/decline"
        actor: Docent
        preconditions:
          - "X-User-ID == shift.docent_id (else ERR_FORBIDDEN)"
        side_effects:
          - "Slot staffing_status recomputed"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /shift-assignments/{id}/resolve with outcome=COMPLETED"
        actor: DocentCoordinator
        preconditions:
          - "Slot status == COMPLETED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /shift-assignments/{id}/resolve with outcome=NO_SHOW"
        actor: DocentCoordinator
        preconditions:
          - "Slot status == COMPLETED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: [ASSIGNED, CONFIRMED]
        to: CANCELLED
        trigger: "system cascade (slot cancelled, room closure, docent deactivated)"
        actor: system
        preconditions: []
        side_effects:
          - "Slot staffing_status recomputed"

  - entity: Booking
    field: status
    initial_state: RESERVED
    terminal_states: [CANCELLED, EXPIRED]
    transitions:
      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /bookings/{id}/confirm"
        actor: "MuseumAdmin, FrontDeskStaff, or Member (self)"
        preconditions:
          - "Slot status in {OPEN, FULL} (else ERR_INVALID_STATE)"
          - "Logical clock now < slot.start_at (else ERR_CONFIRM_WINDOW_CLOSED)"
          - "paid_cents == total_price_cents (else ERR_PAYMENT_MISMATCH)"
        side_effects:
          - "seats_reserved -= party_size; seats_confirmed += party_size; revenue fields recomputed; slot OPEN->FULL if seats_available hits 0"
      - from: RESERVED
        to: EXPIRED
        trigger: "system (POST /_ops/run_epoch when now >= hold_expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "seats_reserved -= party_size; slot FULL->OPEN if seats freed"
      - from: [RESERVED, CONFIRMED]
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel, or system cascade (slot cancelled)"
        actor: "MuseumAdmin, FrontDeskStaff, Member (self), or system"
        preconditions: []
        side_effects:
          - "Release seats from the bucket the booking occupied (reserved or confirmed)"
          - "refund_cents set per refund rule (0 for RESERVED; time-tier for CONFIRMED manual cancel; total_price_cents in full for incident cascade)"
          - "slot FULL->OPEN if seats freed; revenue fields recomputed"

  - entity: Member
    field: status
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: LAPSED
        trigger: "system (POST /_ops/run_epoch when renews_on < current date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [ACTIVE, LAPSED]
        to: ACTIVE
        trigger: "POST /members/{id}/renew"
        actor: "MuseumAdmin or FrontDeskStaff"
        preconditions:
          - "renews_on in request must be strictly after current date (else ERR_INVALID_REQUEST)"
        side_effects:
          - "renews_on := request value"
      - from: LAPSED
        to: EXPIRED
        trigger: "system (POST /_ops/run_epoch when renews_on + 30 days < current date)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SafetyIncident
    field: status
    initial_state: REPORTED
    terminal_states: [RESOLVED]
    transitions:
      - from: REPORTED
        to: RESOLVED
        trigger: "POST /safety-incidents/{id}/resolve"
        actor: "MuseumAdmin or Curator"
        preconditions: []
        side_effects:
          - "If severity=CRITICAL and no other REPORTED CRITICAL incident references the room: Room CLOSED_RESTORATION -> OPEN"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: script-publish-stale-route
    parent_entity: TourRoute
    write_endpoint: "POST /script-versions/{id}/publish"
    occ_field: expected_route_version
    description: |
      Publishing an APPROVED ScriptVersion supersedes the route's currently
      published script and advances TourRoute.version. A publish carrying an
      expected_route_version that no longer matches the route's current
      version is rejected, because another publish has legitimately
      superseded the pointer since the client last observed the route.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: slot-reschedule-stale-slot
    parent_entity: TourSlot
    write_endpoint: "POST /tour-slots/{id}/reschedule"
    occ_field: expected_slot_version
    description: |
      Rescheduling a TourSlot rewrites start_at/end_at and re-runs the
      room-occupancy conflict check, advancing TourSlot.version. A reschedule
      carrying an expected_slot_version that no longer matches the slot's
      current version is rejected, because the slot has been legitimately
      modified (e.g., a prior reschedule) since the client last observed it.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: slot_capacity
    trigger: "tour slot creation (snapshot); never recomputed afterwards"
    algorithm: threshold
    formula: |
      raw_min = min(Room.capacity_max for room_id in route.room_ids)
      buffer = 2 if route.kind == STANDARD, 0 if SCHOOL, 4 if CANDLELIGHT
      capacity = max(1, raw_min - buffer)
    input_set: "All rooms referenced by route.room_ids regardless of room status (closure is enforced separately at slot open)"
    constants:
      BUFFER_STANDARD: 2
      BUFFER_SCHOOL: 0
      BUFFER_CANDLELIGHT: 4
    precision: "integer persons"

  - name: booking_total_price_cents
    trigger: "booking creation (values frozen on the booking at that instant)"
    algorithm: tiered_pricing
    formula: |
      if booking_kind == GENERAL:
        unit = route.base_price_cents
        if route.kind == CANDLELIGHT: unit = round_half_up(base_price_cents * 1.5)   # per-person rounding FIRST
        total = party_size * unit                                                     # then multiply by headcount
      if booking_kind == MEMBER:
        unit = same as GENERAL (incl. CANDLELIGHT multiplier)
        total = (party_size - 1) * unit                                               # the member's own seat is free
      if booking_kind == SCHOOL:
        party_size = student_count + chaperone_count
        student_charge = 800*min(student_count,15) + 700*min(max(student_count-15,0),15) + 600*max(student_count-30,0)
        free_chaperones = ceil(student_count / 10)   # or /8 if any route room is HIGH_VALUE
        extra_chaperones = max(0, chaperone_count - free_chaperones)
        total = student_charge + extra_chaperones * 1000
        unit_price_cents reported on the booking = total (school pricing is a group rate; unit field carries the group total)
    input_set: "The route (kind, base_price_cents) and the booking's headcount fields at creation time"
    constants:
      CANDLELIGHT_MULTIPLIER: 1.5
      SCHOOL_TIER1_LIMIT: 15
      SCHOOL_TIER1_PRICE: 800
      SCHOOL_TIER2_LIMIT: 30
      SCHOOL_TIER2_PRICE: 700
      SCHOOL_TIER3_PRICE: 600
      FREE_CHAPERONE_DIVISOR: 10
      FREE_CHAPERONE_DIVISOR_HIGH_VALUE: 8
      EXTRA_CHAPERONE_PRICE: 1000
    precision: "integer cents; round_half_up applied per-person BEFORE multiplying by headcount (pinned order — 'round per person then multiply', never 'multiply then round')"

  - name: refund_cents
    trigger: "manual cancellation of a CONFIRMED booking"
    algorithm: threshold
    formula: |
      hours_before = (slot.start_at - now) in hours
      if hours_before >= 48: refund = total_price_cents
      elif hours_before >= 24: refund = round_half_up(total_price_cents * 0.5)
      else: refund = 0
      RESERVED bookings and MEMBER bookings that paid 0 always refund 0.
      Incident-cascade cancellations bypass tiers: refund = total_price_cents.
    input_set: "The booking being cancelled, its slot's start_at, and the logical clock"
    constants:
      FULL_REFUND_HOURS: 48
      HALF_REFUND_HOURS: 24
    precision: "integer cents, round_half_up on the 50% tier"

  - name: docent_readiness_score
    trigger: "on read of a Docent and at certification check"
    algorithm: weighted_scoring
    formula: |
      hours_term = min(training_hours, 30) / 30
      shadow_term = min(shadow_tours_completed, 5) / 5
      quiz_term = (quiz_score or 0) / 100
      score = round_half_up(100 * (w_hours*hours_term + w_shadow*shadow_term + w_quiz*quiz_term))
    input_set: "The docent's own accumulated training fields"
    constants:
      HOURS_CAP: 30
      SHADOW_CAP: 5
    precision: "integer 0-100, round_half_up"
    variants:
      - name: standard_track
        when: "readiness_standard_score; also the variant used by the CERTIFIED advance check (threshold 70)"
        difference: "weights w_hours=0.3, w_shadow=0.3, w_quiz=0.4"
      - name: apprentice_track
        when: "readiness_apprentice_score (reported alongside; never used for certification)"
        difference: "weights w_hours=0.5, w_shadow=0.4, w_quiz=0.1 — same inputs, different score"

  - name: slot_revenue_projection
    trigger: "on read of a TourSlot and after any booking create/confirm/cancel/expire on it"
    algorithm: aggregation
    formula: |
      committed = sum(total_price_cents over bookings of this slot with status == CONFIRMED)
      reserved_sum = sum(total_price_cents over bookings of this slot with status == RESERVED)
      revenue_committed_cents = committed
      revenue_projected_cents = committed + round_half_up(reserved_sum * 0.8)
    input_set: "Bookings of this slot filtered by status: CONFIRMED only for committed; RESERVED only for the projection uplift; CANCELLED/EXPIRED always excluded"
    constants:
      PROJECTED_CONVERSION: 0.8
    precision: "integer cents, round_half_up on the projection uplift"
    variants:
      - name: committed_only
        when: "revenue_committed_cents (chronological recognition: only money actually confirmed)"
        difference: "excludes RESERVED bookings entirely"
      - name: forward_looking
        when: "revenue_projected_cents"
        difference: "includes RESERVED bookings discounted by the 0.8 conversion factor — identical data, different number"

  - name: room_occupancy_windows
    trigger: "tour slot creation and reschedule (conflict check against existing slots)"
    algorithm: interval_merge
    formula: |
      n = len(route.room_ids)
      per_room = floor(duration_minutes / n); remainder = duration_minutes - per_room*n
      room i (0-based) occupies [start_at + i*per_room, start_at + (i+1)*per_room) for i < n-1
      last room occupies [start_at + (n-1)*per_room, end_at)   # absorbs the remainder
      Conflict between slots A and B exists iff they share >= 1 room and the
      occupation windows of that room overlap under HALF-OPEN semantics:
      overlap iff a.start < b.end AND b.start < a.end; touching endpoints (a.end == b.start) are NOT a conflict.
      Only slots with status in {SCHEDULED, OPEN, FULL, IN_PROGRESS} participate; CANCELLED/COMPLETED slots occupy nothing.
    input_set: "All non-terminal, non-completed slots whose routes share at least one room with the candidate slot's route"
    precision: "minute resolution"

  - name: chaperone_requirement
    trigger: "SCHOOL booking validation"
    algorithm: threshold
    formula: |
      divisor = 8 if any room on the route has collection_tier == HIGH_VALUE else 10
      required_chaperones = ceil(student_count / divisor)
      valid iff chaperone_count >= required_chaperones
    input_set: "The booking's student_count/chaperone_count and the route's room tiers"
    constants:
      CHAPERONE_DIVISOR: 10
      CHAPERONE_DIVISOR_HIGH_VALUE: 8
    precision: "integer persons; boundary is inclusive (chaperone_count == required passes)"

  - name: route_survey_summary
    trigger: "GET /tour-routes/{id}/survey-summary"
    algorithm: aggregation
    formula: |
      surveys = all VisitorSurvey with slot's route_id == this route, status in {SUBMITTED, REVIEWED}
      survey_count = len(surveys)
      avg_overall_rating = round_half_up(mean(overall_rating), 2)
      avg_interpretation_clarity = round_half_up(mean(interpretation_clarity), 2)
      empty set -> survey_count 0 and both averages 0.0
    input_set: "Surveys whose slot belongs to this route; both SUBMITTED and REVIEWED included"
    precision: "averages to 2 decimal places, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role is in the endpoint's roles list; ownership checks: Docent acting on own shifts (X-User-ID == shift.docent_id), Member acting on own bookings/surveys (X-User-ID == booking.member_id), Member role may only create booking_kind=MEMBER with member_id == X-User-ID", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path resources exist left-to-right, then body FK ids (slot_id, member_id, docent_id, room_id, route_id in route_ids/room_ids)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: existence, check: "Required fields present; enums in declared sets; integer bounds (party_size >= 1 for GENERAL/MEMBER, student_count >= 1, ratings in 1-5, quiz value in 0-100, capacity_max >= 1); SCHOOL bookings must not pass party_size; GENERAL/MEMBER bookings must not pass school fields", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 5, category: state, check: "Target resource lifecycle permits the operation: slot must be OPEN for booking create (else ERR_SLOT_NOT_OPEN); slot SCHEDULED for open; booking RESERVED for confirm; script DRAFT for submit, IN_REVIEW for review, APPROVED for publish; shift ASSIGNED for confirm/decline, CONFIRMED for resolve; slot's booking COMPLETED-slot precondition for surveys; member not EXPIRED for renew; transitions not in the machine rejected generically", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all state-transition and state-gated endpoints" }
  - { priority: 5, category: state, check: "Booking create specifically requires slot.status == OPEN (FULL is already a failed state for new bookings)", error_id: ERR_SLOT_NOT_OPEN, http_status: 409, applies_to: "POST /bookings" }
  - { priority: 6, category: state, check: "OCC: expected_route_version on publish == TourRoute.version; expected_slot_version on reschedule == TourSlot.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /script-versions/{id}/publish", "POST /tour-slots/{id}/reschedule"] }
  - { priority: 7, category: business_safety, check: "Collection safety: if any route room is HIGH_VALUE, party_size <= min(safety_max_party over HIGH_VALUE rooms on route); CANDLELIGHT routes may not include LIGHT_SENSITIVE rooms (at route creation); SCHOOL chaperone_count >= ceil(student_count/divisor) per chaperone_requirement", error_id: ERR_SAFETY_PARTY_TOO_LARGE, http_status: 422, applies_to: "POST /bookings" }
  - { priority: 7, category: business_safety, check: "CANDLELIGHT route includes a LIGHT_SENSITIVE room", error_id: ERR_CANDLELIGHT_LIGHT_SENSITIVE, http_status: 422, applies_to: "POST /tour-routes" }
  - { priority: 7, category: business_safety, check: "SCHOOL booking chaperone ratio below requirement", error_id: ERR_CHAPERONE_RATIO_VIOLATION, http_status: 422, applies_to: "POST /bookings" }
  - { priority: 8, category: business_constraint, check: "Threshold gates: docent advance to CERTIFIED requires hours>=20, shadow>=3, quiz>=85, readiness_standard>=70; script review APPROVE requires accuracy_score >= 80", error_id: ERR_CERTIFICATION_NOT_MET, http_status: 422, applies_to: "POST /docents/{id}/advance" }
  - { priority: 8, category: business_constraint, check: "Script approval accuracy floor", error_id: ERR_REVIEW_SCORE_TOO_LOW, http_status: 422, applies_to: "POST /script-versions/{id}/review" }
  - { priority: 9, category: business_referential, check: "Cross-entity references: slot open requires route ACTIVE (ERR_ROUTE_NOT_ACTIVE), published script (ERR_SCRIPT_NOT_PUBLISHED), all rooms OPEN (ERR_ROOM_CLOSED), STAFFED (ERR_SLOT_NOT_STAFFED); slot create requires route ACTIVE (ERR_ROUTE_NOT_ACTIVE); LEAD shift requires docent CERTIFIED with slot's route in certified_route_ids, SHADOW requires TRAINEE or CERTIFIED (ERR_DOCENT_NOT_QUALIFIED); SCHOOL booking curriculum_standard must appear in the route's PUBLISHED script curriculum_standards (ERR_CURRICULUM_NOT_ALIGNED); route retire requires no future non-cancelled slots (ERR_ROUTE_HAS_FUTURE_SLOTS)", error_id: ERR_ROUTE_NOT_ACTIVE, http_status: 409, applies_to: "POST /tour-slots, POST /tour-slots/{id}/open" }
  - { priority: 9, category: business_referential, check: "Docent qualification for shift_role against slot's route", error_id: ERR_DOCENT_NOT_QUALIFIED, http_status: 422, applies_to: "POST /shift-assignments" }
  - { priority: 9, category: business_referential, check: "Curriculum alignment against published script", error_id: ERR_CURRICULUM_NOT_ALIGNED, http_status: 422, applies_to: "POST /bookings" }
  - { priority: 10, category: business_temporal, check: "Time rules: slot create/reschedule start_at > now (ERR_SLOT_IN_PAST); docent shift overlap incl. 30-minute buffer (ERR_SHIFT_OVERLAP); room occupancy half-open overlap (ERR_ROOM_OCCUPANCY_CONFLICT); confirm at/after slot start (ERR_CONFIRM_WINDOW_CLOSED); survey after completion window of 14 days (ERR_SURVEY_WINDOW_CLOSED)", error_id: ERR_SLOT_IN_PAST, http_status: 422, applies_to: ["POST /tour-slots", "POST /tour-slots/{id}/reschedule"] }
  - { priority: 10, category: business_temporal, check: "Docent double-booked with buffer", error_id: ERR_SHIFT_OVERLAP, http_status: 409, applies_to: ["POST /shift-assignments", "POST /tour-slots/{id}/reschedule"] }
  - { priority: 10, category: business_temporal, check: "Room occupation window collision", error_id: ERR_ROOM_OCCUPANCY_CONFLICT, http_status: 409, applies_to: ["POST /tour-slots", "POST /tour-slots/{id}/reschedule"] }
  - { priority: 10, category: business_temporal, check: "Confirm window closed", error_id: ERR_CONFIRM_WINDOW_CLOSED, http_status: 422, applies_to: "POST /bookings/{id}/confirm" }
  - { priority: 10, category: business_temporal, check: "Survey window closed (more than 14 days after slot completion)", error_id: ERR_SURVEY_WINDOW_CLOSED, http_status: 422, applies_to: "POST /bookings/{id}/surveys" }
  - { priority: 11, category: business_fiscal, check: "Capacity and money last: party_size <= slot.seats_available (ERR_CAPACITY_EXCEEDED); at most one non-terminal LEAD shift per slot (ERR_LEAD_ALREADY_ASSIGNED); MEMBER booking requires member status == ACTIVE (ERR_MEMBER_NOT_ACTIVE); confirm paid_cents == total_price_cents (ERR_PAYMENT_MISMATCH); duplicate survey for a booking (ERR_DUPLICATE_SURVEY)", error_id: ERR_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /bookings" }
  - { priority: 11, category: business_fiscal, check: "Second LEAD on same slot", error_id: ERR_LEAD_ALREADY_ASSIGNED, http_status: 409, applies_to: "POST /shift-assignments" }
  - { priority: 11, category: business_fiscal, check: "Member standing for free admission", error_id: ERR_MEMBER_NOT_ACTIVE, http_status: 422, applies_to: "POST /bookings" }
  - { priority: 11, category: business_fiscal, check: "Payment equals computed total", error_id: ERR_PAYMENT_MISMATCH, http_status: 422, applies_to: "POST /bookings/{id}/confirm" }
  - { priority: 11, category: business_fiscal, check: "One survey per booking", error_id: ERR_DUPLICATE_SURVEY, http_status: 409, applies_to: "POST /bookings/{id}/surveys" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Rooms ---
  - { method: POST, path: "/rooms", description: "Create a room", roles: [MuseumAdmin], code: 201, input: [name, floor, capacity_max, safety_max_party, collection_tier], output: Room, side_effects: ["status=OPEN"] }
  - { method: GET, path: "/rooms/{id}", description: "Get a room", roles: [MuseumAdmin, Curator, DocentCoordinator, FrontDeskStaff, Docent, Member], code: 200, input: [], output: Room, side_effects: [] }
  - { method: GET, path: "/rooms/{id}/routes", description: "List routes whose room_ids contain this room", roles: [MuseumAdmin, Curator, DocentCoordinator, FrontDeskStaff, Docent, Member], code: 200, input: [], output: "TourRoute[]", side_effects: [] }
  - { method: GET, path: "/rooms/{id}/incidents", description: "List safety incidents for this room", roles: [MuseumAdmin, Curator], code: 200, input: [], output: "SafetyIncident[]", side_effects: [] }

  # --- Routes ---
  - { method: POST, path: "/tour-routes", description: "Create a route (DRAFT); CANDLELIGHT routes may not include LIGHT_SENSITIVE rooms", roles: [MuseumAdmin], code: 201, input: [name, kind, room_ids, duration_minutes, base_price_cents], output: TourRoute, side_effects: ["status=DRAFT, published_script_id=null"] }
  - { method: GET, path: "/tour-routes", description: "List routes; optional filter published_script_id finds the route whose current published script is the given ScriptVersion", roles: [MuseumAdmin, Curator, DocentCoordinator, FrontDeskStaff, Docent, Member], code: 200, input: ["published_script_id?"], output: "TourRoute[]", side_effects: [] }
  - { method: GET, path: "/tour-routes/{id}", description: "Get a route", roles: [MuseumAdmin, Curator, DocentCoordinator, FrontDeskStaff, Docent, Member], code: 200, input: [], output: TourRoute, side_effects: [] }
  - { method: POST, path: "/tour-routes/{id}/activate", description: "DRAFT -> ACTIVE", roles: [MuseumAdmin], code: 200, input: [], output: TourRoute, side_effects: ["increments TourRoute.version by 1"] }
  - { method: POST, path: "/tour-routes/{id}/retire", description: "ACTIVE -> RETIRED; requires no future non-cancelled slots", roles: [MuseumAdmin], code: 200, input: [], output: TourRoute, side_effects: ["increments TourRoute.version by 1"] }
  - { method: GET, path: "/tour-routes/{id}/script-versions", description: "List script versions for this route", roles: [MuseumAdmin, Curator, DocentCoordinator, FrontDeskStaff, Docent, Member], code: 200, input: [], output: "ScriptVersion[]", side_effects: [] }
  - { method: GET, path: "/tour-routes/{id}/tour-slots", description: "List slots for this route; supports limit/offset pagination", roles: [MuseumAdmin, Curator, DocentCoordinator, FrontDeskStaff, Docent, Member], code: 200, input: ["status?"], output: "TourSlot[]", side_effects: [] }
  - { method: GET, path: "/tour-routes/{id}/survey-summary", description: "Aggregated visitor survey metrics for interpretation improvement", roles: [MuseumAdmin, Curator], code: 200, input: [], output: "{ survey_count: integer, avg_overall_rating: number, avg_interpretation_clarity: number }", side_effects: [] }
  - { method: GET, path: "/tour-routes/{id}/docents", description: "List docents whose certified_route_ids contain this route", roles: [MuseumAdmin, DocentCoordinator], code: 200, input: [], output: "Docent[]", side_effects: [] }

  # --- Script versions ---
  - { method: POST, path: "/tour-routes/{id}/script-versions", description: "Create a script draft for a route; version_no assigned monotonically per route", roles: [Curator, MuseumAdmin], code: 201, input: [content_text, curriculum_standards], output: ScriptVersion, side_effects: ["status=DRAFT, version_no = max(existing for route)+1"] }
  - { method: GET, path: "/script-versions/{id}", description: "Get a script version", roles: [MuseumAdmin, Curator, DocentCoordinator, FrontDeskStaff, Docent, Member], code: 200, input: [], output: ScriptVersion, side_effects: [] }
  - { method: POST, path: "/script-versions/{id}/submit", description: "DRAFT -> IN_REVIEW", roles: [Curator], code: 200, input: [], output: ScriptVersion, side_effects: ["increments ScriptVersion.version by 1"] }
  - { method: POST, path: "/script-versions/{id}/review", description: "IN_REVIEW -> APPROVED (decision=APPROVE, accuracy_score>=80) | DRAFT (REQUEST_REVISION) | REJECTED (REJECT)", roles: [Curator], code: 200, input: [decision, "accuracy_score?", "reviewer_notes?"], output: ScriptVersion, side_effects: ["records accuracy_score/reviewer_notes on APPROVE", "increments ScriptVersion.version by 1"] }
  - { method: POST, path: "/script-versions/{id}/publish", description: "APPROVED -> PUBLISHED; supersedes route's prior PUBLISHED script (OCC on route version)", roles: [MuseumAdmin], code: 200, input: [expected_route_version], output: ScriptVersion, side_effects: ["route.published_script_id := this script", "prior PUBLISHED script of route -> SUPERSEDED", "increments TourRoute.version by 1"] }

  # --- Tour slots ---
  - { method: POST, path: "/tour-slots", description: "Create a slot (SCHEDULED); snapshots capacity; checks room-occupancy conflicts", roles: [MuseumAdmin], code: 201, input: [route_id, start_at], output: TourSlot, side_effects: ["capacity snapshot per slot_capacity", "end_at computed", "seats_reserved=seats_confirmed=0, seats_available=capacity, revenue fields 0"] }
  - { method: GET, path: "/tour-slots/{id}", description: "Get a slot with computed seat/revenue/staffing fields", roles: [MuseumAdmin, Curator, DocentCoordinator, FrontDeskStaff, Docent, Member], code: 200, input: [], output: TourSlot, side_effects: [] }
  - { method: POST, path: "/tour-slots/{id}/open", description: "SCHEDULED -> OPEN (route ACTIVE, script published, rooms OPEN, STAFFED)", roles: [MuseumAdmin], code: 200, input: [], output: TourSlot, side_effects: ["increments TourSlot.version by 1"] }
  - { method: POST, path: "/tour-slots/{id}/advance", description: "OPEN|FULL -> IN_PROGRESS (to_status=IN_PROGRESS, clock >= start_at); IN_PROGRESS -> COMPLETED (to_status=COMPLETED)", roles: [MuseumAdmin, FrontDeskStaff], code: 200, input: [to_status], output: TourSlot, side_effects: ["increments TourSlot.version by 1"] }
  - { method: POST, path: "/tour-slots/{id}/cancel", description: "SCHEDULED|OPEN|FULL -> CANCELLED; cascades bookings (time-tier refunds) and shifts", roles: [MuseumAdmin], code: 200, input: [], output: TourSlot, side_effects: ["bookings RESERVED/CONFIRMED -> CANCELLED with refund rule", "shifts ASSIGNED/CONFIRMED -> CANCELLED", "increments TourSlot.version by 1"] }
  - { method: POST, path: "/tour-slots/{id}/reschedule", description: "Change start_at (SCHEDULED/OPEN only); recomputes end_at; re-checks occupancy; OCC on slot version", roles: [MuseumAdmin], code: 200, input: [start_at, expected_slot_version], output: TourSlot, side_effects: ["end_at recomputed", "increments TourSlot.version by 1"] }
  - { method: GET, path: "/tour-slots/{id}/bookings", description: "List bookings for a slot", roles: [MuseumAdmin, FrontDeskStaff], code: 200, input: [], output: "Booking[]", side_effects: [] }
  - { method: GET, path: "/tour-slots/{id}/shifts", description: "List shift assignments for a slot", roles: [MuseumAdmin, DocentCoordinator, Docent], code: 200, input: [], output: "ShiftAssignment[]", side_effects: [] }
  - { method: GET, path: "/tour-slots/{id}/incidents", description: "List safety incidents referencing a slot", roles: [MuseumAdmin, Curator], code: 200, input: [], output: "SafetyIncident[]", side_effects: [] }
  - { method: GET, path: "/tour-slots/{id}/surveys", description: "List surveys for a slot", roles: [MuseumAdmin, Curator, DocentCoordinator, FrontDeskStaff, Docent, Member], code: 200, input: [], output: "VisitorSurvey[]", side_effects: [] }

  # --- Docents ---
  - { method: POST, path: "/docents", description: "Recruit a docent (APPLICANT)", roles: [DocentCoordinator], code: 201, input: [full_name, email], output: Docent, side_effects: ["status=APPLICANT, training_hours=0, shadow_tours_completed=0, quiz_score=null"] }
  - { method: GET, path: "/docents/{id}", description: "Get a docent with readiness scores", roles: [MuseumAdmin, DocentCoordinator, Docent], code: 200, input: [], output: Docent, side_effects: [] }
  - { method: POST, path: "/docents/{id}/advance", description: "APPLICANT->TRAINEE; TRAINEE->CERTIFIED (thresholds; route_ids required at certification)", roles: [DocentCoordinator], code: 200, input: [to_status, "route_ids?"], output: Docent, side_effects: ["certified_route_ids set on CERTIFIED", "increments Docent.version by 1"] }
  - { method: POST, path: "/docents/{id}/deactivate", description: "TRAINEE|CERTIFIED -> INACTIVE; cascades future shift cancellations and slot staffing recompute", roles: [DocentCoordinator], code: 200, input: [], output: Docent, side_effects: ["future ASSIGNED/CONFIRMED shifts -> CANCELLED", "affected slots staffing_status recomputed", "increments Docent.version by 1"] }
  - { method: POST, path: "/docents/{id}/training-records", description: "Log training: kind=HOURS (value added to training_hours), SHADOW_TOUR (value must be 1; increments shadow count), QUIZ (value 0-100 sets quiz_score)", roles: [DocentCoordinator], code: 201, input: [kind, value], output: Docent, side_effects: ["training fields updated; readiness scores recomputed"] }
  - { method: GET, path: "/docents/{id}/shifts", description: "List a docent's shift assignments", roles: [MuseumAdmin, DocentCoordinator, Docent], code: 200, input: [], output: "ShiftAssignment[]", side_effects: [] }

  # --- Shift assignments ---
  - { method: POST, path: "/shift-assignments", description: "Assign a docent to a slot (LEAD/SHADOW); checks qualification, overlap buffer, one-LEAD rule", roles: [DocentCoordinator], code: 201, input: [docent_id, slot_id, shift_role], output: ShiftAssignment, side_effects: ["status=ASSIGNED", "slot staffing_status recomputed"] }
  - { method: POST, path: "/shift-assignments/{id}/confirm", description: "Docent confirms own shift (ASSIGNED -> CONFIRMED)", roles: [Docent], code: 200, input: [], output: ShiftAssignment, side_effects: ["slot staffing_status recomputed; LEAD confirm makes slot STAFFED"] }
  - { method: POST, path: "/shift-assignments/{id}/decline", description: "Docent declines own shift (ASSIGNED -> DECLINED)", roles: [Docent], code: 200, input: [], output: ShiftAssignment, side_effects: ["slot staffing_status recomputed"] }
  - { method: POST, path: "/shift-assignments/{id}/resolve", description: "CONFIRMED -> COMPLETED | NO_SHOW after slot completed", roles: [DocentCoordinator], code: 200, input: [outcome], output: ShiftAssignment, side_effects: [] }

  # --- Members ---
  - { method: POST, path: "/members", description: "Register a member (ACTIVE)", roles: [MuseumAdmin, FrontDeskStaff], code: 201, input: [full_name, email, member_number, renews_on], output: Member, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/members/{id}", description: "Get a member", roles: [MuseumAdmin, FrontDeskStaff, Member], code: 200, input: [], output: Member, side_effects: [] }
  - { method: POST, path: "/members/{id}/renew", description: "ACTIVE|LAPSED -> ACTIVE with new renews_on (must be a future date)", roles: [MuseumAdmin, FrontDeskStaff], code: 200, input: [renews_on], output: Member, side_effects: ["increments Member.version by 1"] }
  - { method: GET, path: "/members/{id}/bookings", description: "List a member's bookings", roles: [MuseumAdmin, FrontDeskStaff, Member], code: 200, input: [], output: "Booking[]", side_effects: [] }

  # --- Bookings ---
  - { method: POST, path: "/bookings", description: "Create a booking (RESERVED): GENERAL/MEMBER/SCHOOL pricing, safety, chaperone, curriculum, capacity checks; hold_expires_at set", roles: [MuseumAdmin, FrontDeskStaff, Member], code: 201, input: [slot_id, booking_kind, visitor_name, "party_size?", "member_id?", "student_count?", "chaperone_count?", "grade_level?", "curriculum_standard?"], output: Booking, side_effects: ["seats_reserved += party_size", "slot OPEN->FULL if seats_available hits 0", "revenue fields recomputed"] }
  - { method: GET, path: "/bookings/{id}", description: "Get a booking", roles: [MuseumAdmin, FrontDeskStaff, Member], code: 200, input: [], output: Booking, side_effects: [] }
  - { method: POST, path: "/bookings/{id}/confirm", description: "RESERVED -> CONFIRMED; paid_cents must equal total_price_cents; before slot start", roles: [MuseumAdmin, FrontDeskStaff, Member], code: 200, input: [paid_cents], output: Booking, side_effects: ["seats move reserved -> confirmed", "revenue fields recomputed", "slot OPEN->FULL if full"] }
  - { method: POST, path: "/bookings/{id}/cancel", description: "RESERVED|CONFIRMED -> CANCELLED with time-tier refund; releases seats", roles: [MuseumAdmin, FrontDeskStaff, Member], code: 200, input: [], output: Booking, side_effects: ["seats released", "refund_cents set", "slot FULL->OPEN if freed", "revenue recomputed"] }
  - { method: POST, path: "/bookings/{id}/surveys", description: "Submit a survey for a CONFIRMED booking whose slot is COMPLETED (within 14 days); one per booking", roles: [Member, FrontDeskStaff], code: 201, input: [overall_rating, interpretation_clarity, would_recommend, "comment?"], output: VisitorSurvey, side_effects: ["status=SUBMITTED", "slot_id copied from booking"] }
  - { method: GET, path: "/bookings/{id}/surveys", description: "List surveys for a booking (0 or 1)", roles: [MuseumAdmin, Curator, DocentCoordinator, FrontDeskStaff, Docent, Member], code: 200, input: [], output: "VisitorSurvey[]", side_effects: [] }

  # --- Surveys ---
  - { method: POST, path: "/surveys/{id}/review", description: "Curator marks a survey REVIEWED (interpretation improvement loop)", roles: [Curator], code: 200, input: [], output: VisitorSurvey, side_effects: [] }

  # --- Safety incidents ---
  - { method: POST, path: "/safety-incidents", description: "Report an incident; CRITICAL closes the room and cascades slot/booking/shift cancellations", roles: [MuseumAdmin, Curator, FrontDeskStaff, Docent], code: 201, input: [room_id, "slot_id?", severity, description], output: SafetyIncident, side_effects: ["CRITICAL: Room -> CLOSED_RESTORATION", "future slots on routes containing room -> CANCELLED", "their bookings -> CANCELLED with full refund", "their shifts -> CANCELLED"] }
  - { method: POST, path: "/safety-incidents/{id}/resolve", description: "REPORTED -> RESOLVED; reopens the room if no other REPORTED CRITICAL incident references it", roles: [MuseumAdmin, Curator], code: 200, input: [], output: SafetyIncident, side_effects: ["room CLOSED_RESTORATION -> OPEN when clear"] }

  # --- System / test-driving ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time. All time-gated rules read this clock.", roles: [MuseumAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["logical clock advanced"] }
  - { method: POST, path: "/_ops/run_epoch", description: "Ops-run sweep: RESERVED bookings with now >= hold_expires_at -> EXPIRED (seats released, slot may reopen); ACTIVE members with renews_on < current date -> LAPSED; LAPSED members past 30-day grace -> EXPIRED", roles: [MuseumAdmin], code: 200, input: [], output: "{ expired_booking_count: integer, lapsed_member_count: integer }", side_effects: ["booking expiries", "member lapses/expiries"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not in endpoint roles, or ownership check failed (Docent acting on another's shift, Member acting on another's booking, Member role creating non-MEMBER or other-member bookings)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced path or body resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad enum, out-of-range value, or kind/field-set mismatch (e.g., party_size on SCHOOL booking, renews_on not in future)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic lifecycle violation: transition not offered from current state (e.g., submit non-DRAFT script, confirm non-RESERVED booking, resolve shift before slot COMPLETED, begin before start_at, survey when slot not COMPLETED)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_route_version / expected_slot_version does not match current entity version (OCC)" }
  - { id: ERR_SLOT_NOT_OPEN, http: 409, condition: "Booking create attempted on a slot whose status is not OPEN (SCHEDULED, FULL, IN_PROGRESS, COMPLETED, CANCELLED)" }
  - { id: ERR_ROUTE_NOT_ACTIVE, http: 409, condition: "Slot create/open while the route is not ACTIVE" }
  - { id: ERR_ROUTE_HAS_FUTURE_SLOTS, http: 409, condition: "Route retire attempted with future non-cancelled slots" }
  - { id: ERR_SCRIPT_NOT_PUBLISHED, http: 409, condition: "Slot open attempted while the route has no PUBLISHED script" }
  - { id: ERR_ROOM_CLOSED, http: 409, condition: "Slot open attempted while a route room is CLOSED_RESTORATION" }
  - { id: ERR_SLOT_NOT_STAFFED, http: 409, condition: "Slot open attempted without a CONFIRMED LEAD shift" }
  - { id: ERR_SAFETY_PARTY_TOO_LARGE, http: 422, condition: "Party exceeds min safety_max_party over HIGH_VALUE rooms on the route" }
  - { id: ERR_CHAPERONE_RATIO_VIOLATION, http: 422, condition: "SCHOOL booking chaperone_count below ceil(student_count/divisor)" }
  - { id: ERR_CURRICULUM_NOT_ALIGNED, http: 422, condition: "Requested curriculum_standard not covered by the route's PUBLISHED script" }
  - { id: ERR_CANDLELIGHT_LIGHT_SENSITIVE, http: 422, condition: "CANDLELIGHT route includes a LIGHT_SENSITIVE room" }
  - { id: ERR_DOCENT_NOT_QUALIFIED, http: 422, condition: "LEAD requires CERTIFIED with the slot's route in certified_route_ids; SHADOW requires TRAINEE or CERTIFIED" }
  - { id: ERR_SHIFT_OVERLAP, http: 409, condition: "Docent has a non-terminal shift whose slot window conflicts under the 30-minute buffer rule" }
  - { id: ERR_ROOM_OCCUPANCY_CONFLICT, http: 409, condition: "Room occupation window collides with another non-terminal slot (half-open semantics)" }
  - { id: ERR_SLOT_IN_PAST, http: 422, condition: "Slot create/reschedule with start_at not strictly after the logical clock" }
  - { id: ERR_CONFIRM_WINDOW_CLOSED, http: 422, condition: "Confirm attempted at or after slot start" }
  - { id: ERR_SURVEY_WINDOW_CLOSED, http: 422, condition: "Survey attempted more than 14 days after slot completion" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 409, condition: "party_size > slot.seats_available (booking allowed when party_size == seats_available)" }
  - { id: ERR_LEAD_ALREADY_ASSIGNED, http: 409, condition: "Slot already has a non-terminal LEAD shift" }
  - { id: ERR_MEMBER_NOT_ACTIVE, http: 422, condition: "MEMBER booking with a LAPSED or EXPIRED member" }
  - { id: ERR_PAYMENT_MISMATCH, http: 422, condition: "paid_cents != total_price_cents at confirm" }
  - { id: ERR_CERTIFICATION_NOT_MET, http: 422, condition: "Advance to CERTIFIED without hours>=20, shadow>=3, quiz>=85, readiness_standard>=70" }
  - { id: ERR_REVIEW_SCORE_TOO_LOW, http: 422, condition: "Script APPROVE with accuracy_score < 80" }
  - { id: ERR_DUPLICATE_SURVEY, http: 409, condition: "A survey already exists for the booking" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: MuseumAdmin
    description: "Museum administrator; superset of all operations with override power (rooms, routes, slots, publish, cancel)"
    identity: opaque
    exclusive_operations: ["POST /rooms", "POST /tour-routes", "POST /tour-routes/{id}/activate", "POST /tour-routes/{id}/retire", "POST /script-versions/{id}/publish", "POST /tour-slots", "POST /tour-slots/{id}/open", "POST /tour-slots/{id}/cancel", "POST /tour-slots/{id}/reschedule", "POST /_clock/set_current_utc", "POST /_ops/run_epoch"]
    shared_operations: ["bookings", "members", "script drafts", "incidents", "reads"]
  - name: Curator
    description: "Collections & interpretation curator; owns script review, accuracy scoring, safety incidents, survey review"
    identity: opaque
    exclusive_operations: ["POST /script-versions/{id}/submit", "POST /script-versions/{id}/review", "POST /surveys/{id}/review"]
    shared_operations: ["POST /tour-routes/{id}/script-versions", "POST /safety-incidents", "POST /safety-incidents/{id}/resolve", "reads"]
  - name: DocentCoordinator
    description: "Volunteer coordinator; owns docent recruitment, training records, certification, shift assignment and resolution"
    identity: opaque
    exclusive_operations: ["POST /docents", "POST /docents/{id}/advance", "POST /docents/{id}/deactivate", "POST /docents/{id}/training-records", "POST /shift-assignments", "POST /shift-assignments/{id}/resolve"]
    shared_operations: ["reads"]
  - name: FrontDeskStaff
    description: "Visitor services desk; books and confirms admissions, registers members, advances slots, submits surveys on behalf of visitors"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["POST /bookings", "POST /bookings/{id}/confirm", "POST /bookings/{id}/cancel", "POST /members", "POST /members/{id}/renew", "POST /tour-slots/{id}/advance", "POST /bookings/{id}/surveys", "POST /safety-incidents", "reads"]
  - name: Docent
    description: "Rostered docent; confirms or declines own shift assignments, reports incidents"
    identity: "entity_backed:Docent"
    exclusive_operations: ["POST /shift-assignments/{id}/confirm", "POST /shift-assignments/{id}/decline"]
    shared_operations: ["POST /safety-incidents", "reads (own record, own shifts, slots)"]
  - name: Member
    description: "Museum member; books free admission for self, confirms/cancels own bookings, submits surveys for own bookings"
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations: ["POST /bookings (MEMBER kind, member_id == self)", "POST /bookings/{id}/confirm (own)", "POST /bookings/{id}/cancel (own)", "POST /bookings/{id}/surveys (own)", "reads (own member record, own bookings)"]
