      - name: assessor_daily_capacity_aggregate_covered_by_difficulty_design
        claim_type: aggregate_validation
        grounds:
          - validations[priority=24]
          - errors[ERR_ASSESSOR_DAY_CAPACITY_EXCEEDED]
          - entities.Season.fields.assessor_daily_assessment_capacity
        excluded_because:
          difficulty_instance: resource_temporal_overlap / assessor_daily_aggregate_capacity
          rationale: "That §1.8 instance is exactly the aggregate-validation claim: three individually valid assessments are accepted and the fourth on the same UTC calendar day is refused with ERR_ASSESSOR_DAY_CAPACITY_EXCEEDED, while the same assessor's first assessment on the next UTC day is accepted, proving the counter is per-day and not global."

      - name: disqualified_beats_season_not_open_priority_covered_by_difficulty_design
        claim_type: priority_ordering
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_WRESTLER_DISQUALIFIED]
          - errors[ERR_SEASON_NOT_OPEN]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / disqualified_beats_season_not_open
          rationale: "That §1.8 instance violates both rules with one call and asserts the priority-8 ERR_WRESTLER_DISQUALIFIED is returned rather than the priority-10 ERR_SEASON_NOT_OPEN, then removes the disqualification condition to show the same call flipping to the lower-priority error."

      - name: entry_window_conflict_beats_duplicate_entry_priority_covered_by_difficulty_design
        claim_type: priority_ordering
        grounds:
          - validations[priority=25]
          - validations[priority=26]
          - errors[ERR_ENTRY_WINDOW_CONFLICT]
          - errors[ERR_DUPLICATE_ENTRY]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / entry_window_conflict_beats_duplicate_entry
          rationale: "That §1.8 instance builds a single entry attempt that is simultaneously an overlapping-window conflict and an exact duplicate, and asserts the lower-numbered ERR_ENTRY_WINDOW_CONFLICT wins, with the duplicate error surfacing only once the window overlap is removed."

  - section: endpoints
    instances:
      - name: eligibility_check_computed_read_matches_the_pinned_calculation
        claim_type: computed_read
        grounds:
          - endpoints[POST /wrestlers/{id}/eligibility-checks]
          - calculations.lowest_eligible_class_at_date
          - entities.EligibilityCheck
        distinguishing_aspect: "The certification-database check is a logging computed read that NEVER rejects: the same endpoint returns 201 three times with three different verdicts (BLOCKED_NOT_CERTIFIED, BLOCKED_CLASS_BELOW_MINIMUM, CLEARED), each carrying the blocking_error_id a real entry attempt would have raised, and each row's derived figures (as_of_date, growth_allowance_lbs 1.0, schedule_allowable_weight_lbs 147.9, lowest_eligible_class_lbs 150) match calculations.lowest_eligible_class_at_date exactly."
        test_recipe:
          setup:
            - "Open season with one growth allowance of 1.0 lb effective 2026-12-01, one team, one CERTIFIED assessor, wrestler A (initially uncertified) and one event on 2026-12-12."
