# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1180: Residential Yard Waste & Composting Program
# Breadth coverage of every §1.1–§1.7 claim not already probed by §1.8.
# Sections/claim_types follow references/claim-extraction-guide.md.
# Fixture conventions mirror SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: zone_create_applies_defaults_and_default_clock_status
        claim_type: defaults
        grounds:
          - "entities.ServiceZone.fields.max_strikes_per_season"
          - "entities.ServiceZone.fields.status"
        distinguishing_aspect: "Omitting max_strikes_per_season applies default 3; with NO clock-set call the logical clock is the fixed default 2026-05-01T00:00:00Z, so a zone with season_start_date 2026-06-01 reads OPEN_ENROLLMENT (wall-clock would read IN_SEASON — proves the pinned default)."
        test_recipe:
          setup: ["empty DB; logical clock never set (default 2026-05-01T00:00:00Z)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /service-zones", payload: { name: "East", service_model: "OPT_IN", season_start_date: "2026-06-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 10000, universal_flat_credit_cents: 400 }, as: ProgramAdmin, captures: { z: $.data.id, z_st: $.data.status, z_k: $.data.max_strikes_per_season, z_v: $.data.version } }
          assert:
            - "capture ${z_st} == OPEN_ENROLLMENT"
            - "capture ${z_k} == 3"
            - "capture ${z_v} == 1"

      - name: household_create_initial_state
        claim_type: creation
        grounds:
          - "entities.Household.fields.credit_balance_cents"
          - "entities.Household.fields.compost_entitlement_gallons"
        distinguishing_aspect: "New household starts with credit_balance_cents 0, compost_entitlement_gallons 0, version 1, server-minted UUID id."
        test_recipe:
          setup: ["one zone exists"]
          setup_api_calls:
            - { call: "POST /service-zones", payload: { name: "North", service_model: "OPT_IN", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 12000, universal_flat_credit_cents: 500 }, as: ProgramAdmin, captures: { zone_o: $.data.id } }
          trigger:
            - { call: "POST /households", payload: { address_line: "1 Oak St", zone_id: "${zone_o}" }, as: Anonymous, captures: { h: $.data.id, bal: $.data.credit_balance_cents, ent: $.data.compost_entitlement_gallons, v: $.data.version } }
          assert:
            - "capture ${bal} == 0"
            - "capture ${ent} == 0"
            - "capture ${v} == 1"

      - name: subscription_create_computes_fee_and_pending_state
        claim_type: computed_fields
        grounds:
          - "entities.Subscription.fields.base_fee_cents"
          - "entities.Subscription.fields.status"
          - "entities.Subscription.fields.service_model"
        distinguishing_aspect: "At creation (no carts) an OPT_IN subscription computes base_fee_cents 12000 == total_due_cents, pins service_model snapshot OPT_IN, and starts PENDING_PAYMENT; client-supplied computed fields are rejected as unknown fields."
        test_recipe:
          setup: ["clock 2026-04-15 (OPEN_ENROLLMENT); opt-in zone; household"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-15T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /service-zones", payload: { name: "North", service_model: "OPT_IN", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 12000, universal_flat_credit_cents: 500 }, as: ProgramAdmin, captures: { zone_o: $.data.id } }
            - { call: "POST /households", payload: { address_line: "1 Oak St", zone_id: "${zone_o}" }, as: Anonymous, captures: { hh_a: $.data.id, hh_a_v: $.data.version } }
          trigger:
            - { call: "POST /subscriptions", payload: { household_id: "${hh_a}", season_year: 2026, expected_household_version: "${hh_a_v}" }, as: Resident, as_user_id: "${hh_a}", captures: { s: $.data.id, sb: $.data.base_fee_cents, sd: $.data.total_due_cents, ss: $.data.status, sm: $.data.service_model } }
          assert:
            - "capture ${sb} == 12000"
            - "capture ${sd} == 12000"
            - "capture ${ss} == PENDING_PAYMENT"
            - "capture ${sm} == OPT_IN"

      - name: cart_create_invalid_enum_size_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - "entities.Cart.fields.size_gallons"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "size_gallons outside {35, 64, 96} is a shape error -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["opt-in zone; household with PENDING_PAYMENT subscription"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-15T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /service-zones", payload: { name: "North", service_model: "OPT_IN", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 12000, universal_flat_credit_cents: 500 }, as: ProgramAdmin, captures: { zone_o: $.data.id } }
            - { call: "POST /households", payload: { address_line: "1 Oak St", zone_id: "${zone_o}" }, as: Anonymous, captures: { hh_a: $.data.id, hh_a_v: $.data.version } }
            - { call: "POST /subscriptions", payload: { household_id: "${hh_a}", season_year: 2026, expected_household_version: "${hh_a_v}" }, as: Resident, as_user_id: "${hh_a}", captures: { sub_a: $.data.id } }
          trigger:
            - { call: "POST /carts", payload: { household_id: "${hh_a}", subscription_id: "${sub_a}", size_gallons: "50" }, as: Resident, as_user_id: "${hh_a}", captures: { err: $.data.error_id } }
          assert:
            - "capture ${err} == ERR_INVALID_REQUEST"

      - name: household_create_missing_required_field
        claim_type: required_fields
        grounds:
          - "entities.Household.fields.zone_id"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required zone_id -> ERR_INVALID_REQUEST (400), priority 5 shape before any FK existence check."
        test_recipe:
          setup: ["one zone exists"]
          setup_api_calls:
            - { call: "POST /service-zones", payload: { name: "North", service_model: "OPT_IN", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 12000, universal_flat_credit_cents: 500 }, as: ProgramAdmin, captures: { zone_o: $.data.id } }
          trigger:
            - { call: "POST /households", payload: { address_line: "1 Oak St" }, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "capture ${err} == ERR_INVALID_REQUEST"

      - name: household_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_HOUSEHOLD_NOT_FOUND]"
        distinguishing_aspect: "GET with a well-formed but unknown household UUID -> 404 ERR_HOUSEHOLD_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /households/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "capture ${err} == ERR_HOUSEHOLD_NOT_FOUND"

      - name: household_create_with_extra_field_rejected
        claim_type: system_fields
        grounds:
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Strict request shape: client-supplied system field (id) in the body is an unknown field -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["one zone exists"]
          setup_api_calls:
            - { call: "POST /service-zones", payload: { name: "North", service_model: "OPT_IN", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 12000, universal_flat_credit_cents: 500 }, as: ProgramAdmin, captures: { zone_o: $.data.id } }
          trigger:
            - { call: "POST /households", payload: { address_line: "1 Oak St", zone_id: "${zone_o}", id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2" }, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "capture ${err} == ERR_INVALID_REQUEST"

      - name: ticket_list_pagination_envelope
        claim_type: listing
        grounds:
          - "response_envelope"
        distinguishing_aspect: "List endpoint honors limit/offset and reports total_count/has_more: 3 tickets, limit 2 -> total_count 3, has_more true; offset 2 -> 1 item, has_more false."
        test_recipe:
          setup: ["universal zone; household ACTIVE; published MONDAY route; 3 tickets (05-04, 05-11, 05-18)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-15T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /service-zones", payload: { name: "South", service_model: "UNIVERSAL", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 9000, universal_flat_credit_cents: 500 }, as: ProgramAdmin, captures: { zone_u: $.data.id } }
            - { call: "POST /households", payload: { address_line: "2 Elm St", zone_id: "${zone_u}" }, as: Anonymous, captures: { hh_a: $.data.id, hh_a_v: $.data.version } }
            - { call: "POST /subscriptions", payload: { household_id: "${hh_a}", season_year: 2026, expected_household_version: "${hh_a_v}" }, as: Resident, as_user_id: "${hh_a}", captures: { sub_a: $.data.id } }
            - { call: "POST /routes", payload: { zone_id: "${zone_u}", weekday: "MONDAY", effective_start_date: "2026-05-01", effective_end_date: "2026-10-31", max_stops: 10, max_tonnage_lbs: 100000 }, as: ProgramAdmin, captures: { route_a: $.data.id } }
            - { call: "POST /routes/${route_a}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /pickup-tickets", payload: { subscription_id: "${sub_a}", route_id: "${route_a}", service_date: "2026-05-04" }, as: RouteSupervisor, as_user_id: "sup_1" }
            - { call: "POST /pickup-tickets", payload: { subscription_id: "${sub_a}", route_id: "${route_a}", service_date: "2026-05-11" }, as: RouteSupervisor, as_user_id: "sup_1" }
            - { call: "POST /pickup-tickets", payload: { subscription_id: "${sub_a}", route_id: "${route_a}", service_date: "2026-05-18" }, as: RouteSupervisor, as_user_id: "sup_1" }
          trigger:
            - { call: "GET /pickup-tickets?route_id=${route_a}&limit=2&offset=0", as: ProgramAdmin }
            - { call: "GET /pickup-tickets?route_id=${route_a}&limit=2&offset=2", as: ProgramAdmin }
          assert:
            - "page 1: response_type == array, data length == 2, total_count == 3, has_more == true"
            - "page 2: data length == 1, total_count == 3, has_more == false"

      - name: zone_status_derived_from_clock
        claim_type: computed_fields
        grounds:
          - "entities.ServiceZone.fields.status"
        distinguishing_aspect: "Same zone reads OPEN_ENROLLMENT at 2026-04-15, IN_SEASON at 2026-05-20, OFF_SEASON at 2026-11-01 — status is derived, never stored."
        test_recipe:
          setup: ["zone with season 2026-05-01..2026-10-31"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-15T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /service-zones", payload: { name: "North", service_model: "OPT_IN", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 12000, universal_flat_credit_cents: 500 }, as: ProgramAdmin, captures: { zone_o: $.data.id } }
          trigger:
            - { call: "GET /service-zones/${zone_o}", as: ProgramAdmin, captures: { st1: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: ProgramAdmin }
            - { call: "GET /service-zones/${zone_o}", as: ProgramAdmin, captures: { st2: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "GET /service-zones/${zone_o}", as: ProgramAdmin, captures: { st3: $.data.status } }
          assert:
            - "capture ${st1} == OPEN_ENROLLMENT"
            - "capture ${st2} == IN_SEASON"
            - "capture ${st3} == OFF_SEASON"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: subscription_terminal_lockdown_cancelled
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.Subscription"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "From terminal CANCELLED no further transitions: a second cancel and a pay attempt both fail with ERR_INVALID_STATE."
        test_recipe:
          setup: ["clock 2026-04-15; opt-in household with PENDING_PAYMENT subscription"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-15T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /service-zones", payload: { name: "North", service_model: "OPT_IN", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 12000, universal_flat_credit_cents: 500 }, as: ProgramAdmin, captures: { zone_o: $.data.id } }
            - { call: "POST /households", payload: { address_line: "1 Oak St", zone_id: "${zone_o}" }, as: Anonymous, captures: { hh_a: $.data.id, hh_a_v: $.data.version } }
            - { call: "POST /subscriptions", payload: { household_id: "${hh_a}", season_year: 2026, expected_household_version: "${hh_a_v}" }, as: Resident, as_user_id: "${hh_a}", captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions/${sub_a}/cancel", payload: {}, as: Resident, as_user_id: "${hh_a}", captures: { st: $.data.status } }
          trigger:
            - { call: "POST /subscriptions/${sub_a}/cancel", payload: {}, as: Resident, as_user_id: "${hh_a}", captures: { err1: $.data.error_id } }
            - { call: "POST /subscriptions/${sub_a}/pay", payload: { use_credit_balance: false }, as: Resident, as_user_id: "${hh_a}", captures: { err2: $.data.error_id } }
          assert:
            - "capture ${st} == CANCELLED"
            - "capture ${err1} == ERR_INVALID_STATE"
            - "capture ${err2} == ERR_INVALID_STATE"

      - name: report_missed_on_completed_ticket_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.PickupTicket.SCHEDULED_to_MISSED_REPORTED"
          - "errors[ERR_TICKET_NOT_SCHEDULED]"
        distinguishing_aspect: "report-missed on a COMPLETED ticket fails with ERR_TICKET_NOT_SCHEDULED (only SCHEDULED may be reported)."
        test_recipe:
          setup: ["universal household ACTIVE; published route; ticket 2026-05-04 COMPLETED at 100 lbs; clock 2026-05-05"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-15T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /service-zones", payload: { name: "South", service_model: "UNIVERSAL", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 9000, universal_flat_credit_cents: 500 }, as: ProgramAdmin, captures: { zone_u: $.data.id } }
            - { call: "POST /households", payload: { address_line: "2 Elm St", zone_id: "${zone_u}" }, as: Anonymous, captures: { hh_a: $.data.id, hh_a_v: $.data.version } }
            - { call: "POST /subscriptions", payload: { household_id: "${hh_a}", season_year: 2026, expected_household_version: "${hh_a_v}" }, as: Resident, as_user_id: "${hh_a}", captures: { sub_a: $.data.id } }
            - { call: "POST /routes", payload: { zone_id: "${zone_u}", weekday: "MONDAY", effective_start_date: "2026-05-01", effective_end_date: "2026-10-31", max_stops: 10, max_tonnage_lbs: 100000 }, as: ProgramAdmin, captures: { route_a: $.data.id } }
            - { call: "POST /routes/${route_a}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /pickup-tickets", payload: { subscription_id: "${sub_a}", route_id: "${route_a}", service_date: "2026-05-04" }, as: RouteSupervisor, as_user_id: "sup_1", captures: { t1: $.data.id } }
            - { call: "POST /pickup-tickets/${t1}/complete", payload: { weight_lbs: 100 }, as: Driver, as_user_id: "drv_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /pickup-tickets/${t1}/report-missed", payload: {}, as: Resident, as_user_id: "${hh_a}", captures: { err: $.data.error_id } }
          assert:
            - "capture ${err} == ERR_TICKET_NOT_SCHEDULED"
            - "PickupTicket.${t1}.status == COMPLETED"

      - name: validate_missed_on_scheduled_ticket_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.PickupTicket.MISSED_REPORTED_to_MISSED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "validate-missed requires MISSED_REPORTED; calling it on a SCHEDULED ticket fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["universal household ACTIVE; published route; SCHEDULED ticket 2026-05-04; clock 2026-05-05"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-15T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /service-zones", payload: { name: "South", service_model: "UNIVERSAL", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 9000, universal_flat_credit_cents: 500 }, as: ProgramAdmin, captures: { zone_u: $.data.id } }
            - { call: "POST /households", payload: { address_line: "2 Elm St", zone_id: "${zone_u}" }, as: Anonymous, captures: { hh_a: $.data.id, hh_a_v: $.data.version } }
            - { call: "POST /subscriptions", payload: { household_id: "${hh_a}", season_year: 2026, expected_household_version: "${hh_a_v}" }, as: Resident, as_user_id: "${hh_a}", captures: { sub_a: $.data.id } }
            - { call: "POST /routes", payload: { zone_id: "${zone_u}", weekday: "MONDAY", effective_start_date: "2026-05-01", effective_end_date: "2026-10-31", max_stops: 10, max_tonnage_lbs: 100000 }, as: ProgramAdmin, captures: { route_a: $.data.id } }
            - { call: "POST /routes/${route_a}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /pickup-tickets", payload: { subscription_id: "${sub_a}", route_id: "${route_a}", service_date: "2026-05-04" }, as: RouteSupervisor, as_user_id: "sup_1", captures: { t1: $.data.id } }
          trigger:
            - { call: "POST /pickup-tickets/${t1}/validate-missed", payload: { validated: true }, as: RouteSupervisor, as_user_id: "sup_1", captures: { err: $.data.error_id } }
          assert:
            - "capture ${err} == ERR_INVALID_STATE"
            - "PickupTicket.${t1}.status == SCHEDULED"

      - name: duplicate_inspection_rejected
        claim_type: idempotency
        grounds:
          - "errors[ERR_DUPLICATE_INSPECTION]"
          - "entities.ContaminationInspection.fields.pickup_ticket_id"
        distinguishing_aspect: "Exactly one inspection per ticket: a second POST for the same ticket fails with ERR_DUPLICATE_INSPECTION even when the first result was PASSED."
        test_recipe:
          setup: ["universal household ACTIVE; published route; SCHEDULED ticket; first inspection PASSED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-15T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /service-zones", payload: { name: "South", service_model: "UNIVERSAL", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 9000, universal_flat_credit_cents: 500 }, as: ProgramAdmin, captures: { zone_u: $.data.id } }
            - { call: "POST /households", payload: { address_line: "2 Elm St", zone_id: "${zone_u}" }, as: Anonymous, captures: { hh_a: $.data.id, hh_a_v: $.data.version } }
            - { call: "POST /subscriptions", payload: { household_id: "${hh_a}", season_year: 2026, expected_household_version: "${hh_a_v}" }, as: Resident, as_user_id: "${hh_a}", captures: { sub_a: $.data.id } }
            - { call: "POST /routes", payload: { zone_id: "${zone_u}", weekday: "MONDAY", effective_start_date: "2026-05-01", effective_end_date: "2026-10-31", max_stops: 10, max_tonnage_lbs: 100000 }, as: ProgramAdmin, captures: { route_a: $.data.id } }
            - { call: "POST /routes/${route_a}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /pickup-tickets", payload: { subscription_id: "${sub_a}", route_id: "${route_a}", service_date: "2026-05-04" }, as: RouteSupervisor, as_user_id: "sup_1", captures: { t1: $.data.id } }
            - { call: "POST /contamination-inspections", payload: { pickup_ticket_id: "${t1}", result: "PASSED", violation_codes: [] }, as: FieldInspector, as_user_id: "insp_1", captures: { insp: $.data.id } }
          trigger:
            - { call: "POST /contamination-inspections", payload: { pickup_ticket_id: "${t1}", result: "TAGGED_REJECTED", violation_codes: ["PLASTIC_BAG"] }, as: FieldInspector, as_user_id: "insp_1", captures: { err: $.data.error_id } }
          assert:
            - "capture ${err} == ERR_DUPLICATE_INSPECTION"
            - "PickupTicket.${t1}.status == SCHEDULED"
            - "Subscription.${sub_a}.strikes_this_season == 0"

      - name: booking_cancel_on_terminal_rejected
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.SurgeBooking.CONFIRMED_to_CANCELLED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Cancelling an already CANCELLED booking fails with ERR_INVALID_STATE and does not release a second slot."
        test_recipe:
          setup: ["universal household ACTIVE; LEAF_SURGE event capacity 3, window open at clock 2026-10-15; booking CONFIRMED then CANCELLED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-15T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /service-zones", payload: { name: "South", service_model: "UNIVERSAL", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 9000, universal_flat_credit_cents: 500 }, as: ProgramAdmin, captures: { zone_u: $.data.id } }
            - { call: "POST /households", payload: { address_line: "2 Elm St", zone_id: "${zone_u}" }, as: Anonymous, captures: { hh_a: $.data.id, hh_a_v: $.data.version } }
            - { call: "POST /subscriptions", payload: { household_id: "${hh_a}", season_year: 2026, expected_household_version: "${hh_a_v}" }, as: Resident, as_user_id: "${hh_a}", captures: { sub_a: $.data.id } }
            - { call: "POST /surge-events", payload: { zone_id: "${zone_u}", event_type: "LEAF_SURGE", service_date: "2026-11-07", capacity_slots: 3, booking_window_start: "2026-10-01T00:00:00Z", booking_window_end: "2026-11-01T00:00:00Z" }, as: ProgramAdmin, captures: { ev: $.data.id, ev_v: $.data.version } }
