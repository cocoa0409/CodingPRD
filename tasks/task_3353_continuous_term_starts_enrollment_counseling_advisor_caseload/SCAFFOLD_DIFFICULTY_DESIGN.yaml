              payload: { to_state: "IN_REVIEW" }
              as: RegistrarAdmin
          trigger:
            - call: "POST /api/enrollments"
              payload: { application_id: "${appl_id}", advisor_id: "${adv_id}", enrollment_intensity: "FULL_TIME", tuition_cents: 500000, expected_application_version: "${appl_v}" }
              as: RegistrarAdmin
              captures: { err1: "$.data.error_id" }
            - call: "POST /api/transfer-credit-evaluations/${tce_id}/advance"
              payload: { to_state: "COMPLETED" }
              as: RegistrarAdmin
            - call: "POST /api/enrollments"
              payload: { application_id: "${appl_id}", advisor_id: "${adv_id}", enrollment_intensity: "FULL_TIME", tuition_cents: 500000, expected_application_version: "${appl_v}" }
              as: RegistrarAdmin
              captures: { enr_id: "$.data.id" }
          assert:
            - "first POST /api/enrollments -> ERR_EVALUATION_INCOMPLETE (422)"
            - "after TCE COMPLETED, identical call succeeds with status REGISTERED"
            - "Application.${appl_id}.status == CONVERTED"

      - name: application_decision_requires_state_authorization
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_STATE_NOT_AUTHORIZED]
          - errors[ERR_DISCLOSURE_REQUIRED]
        distinguishing_aspect: |
          Pair Application -> StateAuthorization (different pair than
          Enrollment -> TCE): decision on an application whose (program, state)
          row is PROHIBITED fails ERR_STATE_NOT_AUTHORIZED; when the row is
          RESTRICTED the same call fails ERR_DISCLOSURE_REQUIRED unless
          disclosure_acknowledged == true, then succeeds.
        test_recipe:
          setup:
            - "Program P; state NM PROHIBITED for P; state UT RESTRICTED for P"
            - "Two applicants (NM, UT) each with SUBMITTED application in open term; UT application created without disclosure_acknowledged"
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { code: "BS-CS", title: "CS", total_credits_required: 120, licensure_flag: false }
              as: RegistrarAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /api/programs/${prog_id}/state-authorizations"
              payload: { state_code: "NM", authorization_status: "PROHIBITED", effective_from: "2026-01-01" }
              as: ComplianceOfficer
            - call: "POST /api/programs/${prog_id}/state-authorizations"
              payload: { state_code: "UT", authorization_status: "RESTRICTED", effective_from: "2026-01-01", disclosure_text: "UT disclosure" }
              as: ComplianceOfficer
            - call: "POST /api/terms"
              payload: { name: "2026 Fall A", start_date: "2026-10-05", add_drop_end_date: "2026-10-12", census_date: "2026-10-19", end_date: "2026-12-13" }
              as: RegistrarAdmin
              captures: { term_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/terms/${term_id}/advance"
              payload: { to_state: "ENROLLMENT_OPEN" }
              as: RegistrarAdmin
            - call: "POST /api/applicants"
              payload: { full_name: "NM Prospect", email: "nm@x.com", state_code: "NM" }
              as: RegistrarAdmin
              captures: { nm_id: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${nm_id}", term_id: "${term_id}", program_id: "${prog_id}" }
              as: Applicant
              as_user_id: "${nm_id}"
              captures: { nm_app: "$.data.id" }
            - call: "POST /api/applicants"
              payload: { full_name: "UT Prospect", email: "ut@x.com", state_code: "UT" }
              as: RegistrarAdmin
              captures: { ut_id: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${ut_id}", term_id: "${term_id}", program_id: "${prog_id}" }
              as: Applicant
              as_user_id: "${ut_id}"
              captures: { ut_app: "$.data.id" }
          trigger:
            - call: "POST /api/applications/${nm_app}/decision"
              payload: { decision: "ADMIT" }
              as: RegistrarAdmin
              captures: { err_nm: "$.data.error_id" }
            - call: "POST /api/applications/${ut_app}/decision"
              payload: { decision: "ADMIT" }
              as: RegistrarAdmin
              captures: { err_ut: "$.data.error_id" }
          assert:
            - "NM decision -> ERR_STATE_NOT_AUTHORIZED (422); application remains SUBMITTED"
            - "UT decision without disclosure_acknowledged -> ERR_DISCLOSURE_REQUIRED (422)"

  # ------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: state_authorization_half_open_window_overlap
        grounds:
          - validations[priority=14]
          - errors[ERR_AUTHORIZATION_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Fixed half-open interval overlap on StateAuthorization: existing row
          [2026-01-01, 2026-06-01) rejects a new row starting 2026-03-01
          (intersection non-empty) but accepts one starting exactly 2026-06-01
          (adjacent, half-open boundary touch is not overlap).
        test_recipe:
          setup:
            - "Program P with CO AUTHORIZED [2026-01-01, 2026-06-01)"
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { code: "BS-CS", title: "CS", total_credits_required: 120, licensure_flag: false }
              as: RegistrarAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /api/programs/${prog_id}/state-authorizations"
              payload: { state_code: "CO", authorization_status: "AUTHORIZED", effective_from: "2026-01-01", effective_to: "2026-06-01" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /api/programs/${prog_id}/state-authorizations"
              payload: { state_code: "CO", authorization_status: "RESTRICTED", effective_from: "2026-03-01", disclosure_text: "d" }
              as: ComplianceOfficer
              captures: { err_ov: "$.data.error_id" }
            - call: "POST /api/programs/${prog_id}/state-authorizations"
              payload: { state_code: "CO", authorization_status: "RESTRICTED", effective_from: "2026-06-01", disclosure_text: "d" }
              as: ComplianceOfficer
              captures: { ok_id: "$.data.id" }
          assert:
            - "overlapping row (from 2026-03-01) -> ERR_AUTHORIZATION_WINDOW_OVERLAP (422)"
            - "adjacent row (from 2026-06-01 == prior effective_to) succeeds (201)"

      - name: retention_outreach_rolling_14_day_exclusion
        grounds:
          - calculations.retention_cadence
          - validations[priority=16]
          - errors[ERR_OUTREACH_CADENCE]
        distinguishing_aspect: |
          Rolling recency-buffer semantics on RetentionOutreach (different
          resource and different interval semantics than fixed half-open
          windows): a second outreach < 14 days after the last SENT one is
          rejected ERR_OUTREACH_CADENCE; exactly 14 days later it is allowed
          (strict < comparison).
