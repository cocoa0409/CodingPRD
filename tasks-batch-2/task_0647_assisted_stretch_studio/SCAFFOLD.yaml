# =============================================================================
# task_0647_assisted_stretch_studio — SCAFFOLD (§1.0–§1.7)
# Recovery & Assisted-Stretch Studio (StretchLab style)
# Difficulty: Expert
# =============================================================================

scenario: |
  647. Recovery & Assisted-Stretch Studio (StretchLab style): service (assisted
  stretch/recovery) & flexologist, membership & credit packs, booking &
  room/table, intro session & mobility assessment, recurring scheduling &
  freeze, add-on (compression/percussion), multi-location, no-show

domain_name: assisted-stretch-studio
api_prefix: ""
# Flat topology: all collections are root-level (/bookings, /members, /memberships,
# /credit-packs, /recurring-series, /flexologists, /tables, /services, /locations).
# api_prefix is empty so no single collection nests the others under its path.

# Skill text (prd-bench-scaffold-generator/SKILL.md) is authoritative over the
# examples directory. This scaffold uses the current conventions: server-minted
# UUID ids with no prefix; OCC via expected_<parent>_version (412); entity_backed
# vs opaque role identity; a logical clock defaulting to 2026-04-01T00:00:00Z.

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - scheduled_deferred_actions      # recurring series materialization, freeze with future end, clock
    - rate_threshold_triggers         # no-show strike score with rolling-window decay + suspension threshold
    - optimistic_concurrency          # OCC on Membership.version for credit-pack purchase supersede race
    - cascading_side_effects          # freeze a membership -> cancel/reschedule its future bookings -> release credits
    - derived_field_reconciliation    # credit wallet (granted/held/consumed/available) reconciled on every booking event

  entity_topology: flat
  # Flat with foreign-key references. Member, Membership, CreditPack, Booking,
  # RecurringSeries, Freeze, NoShowEvent are peer top-level collections linked by
  # FK fields (member_id, location_id, flexologist_id, table_id, service_id),
  # NOT nested under a parent in the URL. Locations / Flexologists / Tables /
  # Services are catalog peers. No nested resource trees.

  state_machine_shape: parallel
  # Booking carries two independent state dimensions: schedule_status
  # (REQUESTED→CONFIRMED→COMPLETED with cancel/no-show branches) and
  # credit_status (HELD→CONSUMED with RELEASED/REFUNDED). Membership has a cyclic
  # ACTIVE↔FROZEN loop. RecurringSeries has a branching shape.

  relationship_patterns:
    - one_to_many        # Member 1..* Membership/CreditPack/Booking; Location 1..* Table/Flexologist/Service
    - cross_aggregate    # Booking references Flexologist + Table + Service across catalog boundary; consumes Membership/CreditPack wallet
    - self_referential   # RecurringSeries -> generated Bookings reference series_id; a reschedule links replacement booking to its predecessor via rescheduled_from_booking_id

  role_model: peer_roles
  # Member (entity_backed:Member) owns own bookings/memberships/packs.
  # Flexologist (entity_backed:Flexologist) acts on bookings assigned to self.
  # StudioManager (opaque) operates catalog, runs ops/no-show sweep.
  # FrontDesk (opaque) books/cancels on behalf of any member at the desk's location.

  consistency_model: immediate
  # All mutations atomic in a single request. Derived wallet/strike fields and
  # cascade side-effects are reconciled synchronously before the response returns.

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

