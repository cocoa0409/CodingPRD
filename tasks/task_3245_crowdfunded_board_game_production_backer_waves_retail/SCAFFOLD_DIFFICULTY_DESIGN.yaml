              as: FulfillmentOperator
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: PlatformAdmin
              captures: { vc2: $.data.version }
          trigger:
            - call: "POST /waves/${w1}/transition"
              payload: { action: "reassign", pledge_id: "${p1}", target_wave_id: "${w2}", expected_campaign_version: "${vc2}" }
              as: FulfillmentOperator
            - call: "GET /waves/${w1}"
              payload: {}
              as: PlatformAdmin
              captures: { w1_used: $.data.capacity_used }
            - call: "GET /waves/${w2}"
              payload: {}
              as: PlatformAdmin
              captures: { w2_used: $.data.capacity_used }
          assert:
            - "Wave.${w1}.capacity_used == 0 (decremented)"
            - "Wave.${w2}.capacity_used == 1 (incremented)"
            - "sum of capacity_used across the campaign's waves == 1 (conserved through reassign)"

      - name: replacement_approve_reopen_conserves_spare_pool
        grounds:
          - state_machines.ReplacementRequest.transitions.PENDING_to_APPROVED
          - state_machines.ReplacementRequest.transitions.APPROVED_to_PENDING
          - entities.ProductionRun.fields.spare_units_by_region
        distinguishing_aspect: |
          Conserved quantity: ProductionRun.spare_units_by_region[region]
          available pool (initial minus shipped). Forward: approve sets
          spare_units_debited=1 but does NOT decrement the run pool.
          Compensating: reopen resets spare_units_debited=0. Pool unchanged
          throughout. Different conserved quantity from wave capacity.
        test_recipe:
          setup:
            - "Run LOCKED planned_units=1 → spare NA = floor(0.05*1/4) = 0. To make the test meaningful we need a run with spares; use 100 CHARGED pledges so planned_units=100 → floor(0.05*100/4) = floor(1.25) = 1 spare per region."
            - "Simplified: level price=100c; 100 pledges all CHARGED via auto-flow. For test brevity we use 100 distinct backers b1..b100."
            - "One pledge DELIVERED (full wave pipeline). ReplacementRequest PENDING quantity=1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { title: "T19", owner_user_id: "co-1", goal_cents: 1, currency: "USD", closes_at: "2026-09-05T00:00:00Z", pledge_levels: [{name: "L", price_cents: 100, contents: ["b"], quantity_cap: null, late_pledge_premium_pct: 0.0, status: "OPEN"}] }
              as: CampaignOwner
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/transition"
              payload: { action: "launch" }
              as: CampaignOwner
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: PlatformAdmin
              captures: { v0: $.data.version }
            # 100 pledges charged — shown schematically; the unit-test generator
            # expands this loop. First pledge captured for downstream delivery.
            - call: "POST /pledges"
              payload: { campaign_id: "${camp_id}", backer_user_id: "b1", backer_email: "b1@x", region_code: "NA", pledge_level_name: "L", expected_campaign_version: "${v0}" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /pledges/${p1}/transition"
              payload: { action: "charge" }
              as: CampaignOwner
            - call: "POST /pledges/${p1}/transition"
              payload: { action: "confirm-address" }
              as: Backer
              as_user_id: "b1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /manufacturing-quotes"
              payload: { campaign_id: "${camp_id}", factory_name: "F", tier_breaks: [{min_units: 1, unit_price_cents: 5000}] }
              as: FactoryCoordinator
              captures: { q: $.data.id }
            - call: "POST /manufacturing-quotes/${q}/transition"
              payload: { action: "submit" }
              as: FactoryCoordinator
            - call: "POST /manufacturing-quotes/${q}/transition"
              payload: { action: "finalize" }
              as: FactoryCoordinator
            - call: "POST /production-runs"
              payload: { campaign_id: "${camp_id}", quote_id: "${q}" }
              as: FactoryCoordinator
              captures: { run: $.data.id }
            - call: "POST /production-runs/${run}/transition"
              payload: { action: "lock" }
              as: FactoryCoordinator
            - call: "POST /campaigns/${camp_id}/transition"
              payload: { action: "start-production" }
              as: CampaignOwner
            - call: "POST /freight-shipments"
              payload: { production_run_id: "${run}", region_code: "NA", container_count: 1, declared_value_cents: 10000, departs_at: "2026-09-07T00:00:00Z", arrives_at: "2026-09-10T00:00:00Z" }
              as: FreightBroker
              captures: { sh: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-08T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /freight-shipments/${sh}/transition"
              payload: { action: "depart" }
              as: FreightBroker
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /freight-shipments/${sh}/transition"
              payload: { action: "arrive" }
              as: FreightBroker
            - call: "POST /freight-shipments/${sh}/transition"
              payload: { action: "assess-duty" }
              as: CustomsAgent
            - call: "POST /freight-shipments/${sh}/transition"
              payload: { action: "pay-duty" }
              as: CustomsAgent
            - call: "POST /freight-shipments/${sh}/transition"
              payload: { action: "deliver-to-warehouse" }
              as: FulfillmentOperator
            - call: "POST /waves"
              payload: { campaign_id: "${camp_id}", region_code: "NA", sequence_index: 1, capacity: 200, dispatch_window_start: "2026-09-12T00:00:00Z", dispatch_window_end: "2026-09-15T00:00:00Z", address_lock_at: "2026-09-14T00:00:00Z" }
              as: FulfillmentOperator
              captures: { wv: $.data.id }
            - call: "POST /waves/${wv}/transition"
              payload: { action: "open" }
              as: FulfillmentOperator
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: PlatformAdmin
              captures: { vc: $.data.version }
            - call: "POST /waves/${wv}/transition"
              payload: { action: "assign", pledge_id: "${p1}", expected_campaign_version: "${vc}" }
              as: FulfillmentOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-13T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /waves/${wv}/transition"
              payload: { action: "pick", pledge_id: "${p1}" }
              as: FulfillmentOperator
            - call: "POST /waves/${wv}/transition"
              payload: { action: "ship", pledge_id: "${p1}" }
              as: FulfillmentOperator
            - call: "POST /waves/${wv}/transition"
              payload: { action: "deliver", pledge_id: "${p1}" }
              as: FulfillmentOperator
            - call: "POST /replacement-requests"
              payload: { campaign_id: "${camp_id}", pledge_id: "${p1}", component_sku: "b", quantity: 1 }
              as: Backer
              as_user_id: "b1"
              captures: { rr: $.data.id }
            - call: "GET /production-runs/${run}"
              payload: {}
              as: PlatformAdmin
              captures: { spares_before: $.data.spare_units_by_region }
          trigger:
            - call: "POST /replacement-requests/${rr}/transition"
              payload: { action: "approve" }
              as: CampaignOwner
              captures: { debited: $.data.spare_units_debited }
            - call: "POST /replacement-requests/${rr}/transition"
              payload: { action: "reopen" }
              as: CampaignOwner
              captures: { debited_after: $.data.spare_units_debited, st_after: $.data.status }
            - call: "GET /production-runs/${run}"
              payload: {}
              as: PlatformAdmin
              captures: { spares_after: $.data.spare_units_by_region }
          assert:
            - "after approve: spare_units_debited == 1 (earmarked) but ProductionRun.spare_units_by_region unchanged (only ship debits the pool)"
            - "after reopen: spare_units_debited == 0 AND status == PENDING (compensating action)"
            - "ProductionRun.spare_units_by_region == spares_before throughout (CONSERVED)"
