              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /permits"
              payload: { facility_id: "${fac_id}", permit_type: "ANNUAL", term_start_date: "2026-04-01" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "SUBMIT" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "START_REVIEW" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "ISSUE" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "REVOKE", refund_eligible: true }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_REFUND_NOT_ELIGIBLE"
            - "Permit.${permit_id}.status is still ISSUED and refunded == false"
            - "Operator.${op_id}.fee_balance_cents == 50000 (40000 fee plus 10000 late penalty, unrefunded)"

      - name: imminent_hazard_reading_outranks_out_of_range_on_reopen_approval
        claim_type: Priority conflict
        grounds: ["validations[priority=25]", "validations[priority=26]", "errors[ERR_IMMINENT_HEALTH_HAZARD]"]
        distinguishing_aspect: "A verification reading classified IMMINENT_HAZARD violates both the priority-25 and priority-26 checks; the response is ERR_IMMINENT_HEALTH_HAZARD, never ERR_WATER_NOT_IN_RANGE."
        test_recipe:
          setup: ["A CHEMICAL closure order is in REOPEN_REQUESTED with a verification reading of 0.2 ppm free chlorine sampled at 2026-05-01T01:30:00Z; the clock reads 02:00, past earliest_reopen_at 01:00."]
