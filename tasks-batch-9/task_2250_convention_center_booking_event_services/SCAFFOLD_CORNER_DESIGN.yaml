            - "EventBooking.${bk_id}.version == ${bk_v3}"
            - "SpaceHold.${hold_1_id}.hold_rank == 1 and SpaceHold.${hold_2_id}.hold_rank == 2"
            - "GET /convention-center/holds filtered on the booking returns total_count == 2"

      - name: exclusive_vendor_rule_binds_only_where_an_exclusive_vendor_exists
        claim_type: conditional_validation
        grounds:
          - validations[priority=62]
          - errors[ERR_EXCLUSIVE_VENDOR_REQUIRED]
          - entities.Vendor.fields.vendor_tier
        distinguishing_aspect: |
          Two orders differ only in service_category, and the same OPEN tier decides
          differently. CLEANING has an EXCLUSIVE house vendor on file, so an OPEN cleaner
          is refused; UTILITIES has no EXCLUSIVE vendor at all, so the identical OPEN tier
          is accepted and priced at the 1.25 multiplier. An unconditional exclusivity rule
          would reject both, and a missing rule would accept both.
        test_recipe:
          setup:
            - "SparkleClean Facility Services is an EXCLUSIVE CLEANING vendor"
            - "Budget Cleaners is an OPEN CLEANING vendor"
            - "Volt Open Utilities is an OPEN UTILITIES vendor and no EXCLUSIVE UTILITIES vendor exists"
            - "the Meeting Room 301 booking is TENTATIVE with order_posture OPEN and the clock is the default, so both orders are ADVANCE"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CONSUMER_SHOW", priority_rank: 3, open_months_before: 18, close_months_before: 2, max_holds_per_booking: 2, challenge_response_hours: 48, rental_discount_pct: 0.0, max_challenge_rounds: 1 }
              as: VenueAdmin
