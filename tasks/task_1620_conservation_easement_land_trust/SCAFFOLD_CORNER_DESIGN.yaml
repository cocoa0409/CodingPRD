          rationale: "Asserted as the staff-approve rejection in the named §1.8 instance."

      - name: error_baseline_not_accepted
        claim_type: violation_to_error
        grounds: ["errors[ERR_BASELINE_NOT_ACCEPTED]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / easement_record_requires_accepted_baseline"
          rationale: "Asserted as the first record attempt's error in the named §1.8 instance."

      - name: error_amendment_freeze_conflict
        claim_type: violation_to_error
        grounds: ["errors[ERR_AMENDMENT_FREEZE_CONFLICT]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / use_auth_decide_frozen_by_inflight_amendment"
          rationale: "Asserted as the decide rejection in the named §1.8 instance."

  - section: rbac
    instances:
      - name: field_monitor_cannot_create_violation
        claim_type: role_exclusive_denial
        grounds: [roles, "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "Violation creation is exclusive to StewardshipCoordinator; FieldMonitor is denied."
        test_recipe:
          setup: ["RECORDED easement"]
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-R1", grantor_name: "G", parcel_acreage: 100, permitted_use_matrix: { AGRICULTURE: PERMITTED, SUBDIVISION: PROHIBITED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "O", contact_email: "o@x.com" }, as: TrustAdmin }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 4 }, as: StewardshipCoordinator, captures: { br_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports/${br_id}/submit", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/baseline-reports/${br_id}/accept", payload: {}, as: TrustBoardReviewer, as_user_id: "board-1" }
            - { call: "POST /stewardship/easements/${e_id}/record", payload: {}, as: TrustAdmin }
          trigger:
            - { call: "POST /stewardship/violations", payload: { easement_id: "${e_id}", detected_by_user_id: "mon-1", violation_type: SUBDIVISION, severity: MINOR, detected_on: "2026-08-02" }, as: FieldMonitor, as_user_id: "mon-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INSUFFICIENT_PERMISSIONS (403)"

      - name: appraiser_cannot_certify_own_appraisal
        claim_type: role_exclusive_denial
        grounds: [roles, "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "Certify is exclusive to StewardshipCoordinator; the Appraiser role is denied even on its own engagement (delivery vs certification are segregated)."
        test_recipe:
          setup: ["RECORDED easement; appraisal DELIVERED by appr-1"]
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-R2", grantor_name: "G", parcel_acreage: 100, permitted_use_matrix: { AGRICULTURE: PERMITTED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "O", contact_email: "o@x.com" }, as: TrustAdmin }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 4 }, as: StewardshipCoordinator, captures: { br_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports/${br_id}/submit", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/baseline-reports/${br_id}/accept", payload: {}, as: TrustBoardReviewer, as_user_id: "board-1" }
            - { call: "POST /stewardship/easements/${e_id}/record", payload: {}, as: TrustAdmin }
            - { call: "POST /stewardship/appraisals", payload: { easement_id: "${e_id}", appraiser_user_id: "appr-1", effective_on: "2026-08-15", gift_on: "2026-09-01", contiguous_enhancement_applies: false }, as: StewardshipCoordinator, captures: { ap_id: $.data.id } }
            - { call: "POST /stewardship/appraisals/${ap_id}/deliver", payload: { before_value_cents: 90000000, after_value_cents: 55000000 }, as: Appraiser, as_user_id: "appr-1" }
          trigger:
            - { call: "POST /stewardship/appraisals/${ap_id}/certify", payload: {}, as: Appraiser, as_user_id: "appr-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INSUFFICIENT_PERMISSIONS (403)"

      - name: current_landowner_can_start_cure
        claim_type: role_shared_allowance
        grounds: [roles, state_machines.Violation.NOTICE_SENT_to_CURE_IN_PROGRESS]
        distinguishing_aspect: "Positive RBAC claim: the entity-backed Landowner role whose id is the easement's current landowner succeeds at start-cure."
        test_recipe:
          setup: ["RECORDED easement; violation NOTICE_SENT"]
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-R3", grantor_name: "G", parcel_acreage: 100, permitted_use_matrix: { AGRICULTURE: PERMITTED, SUBDIVISION: PROHIBITED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "O", contact_email: "o@x.com" }, as: TrustAdmin, captures: { lo_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 4 }, as: StewardshipCoordinator, captures: { br_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports/${br_id}/submit", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/baseline-reports/${br_id}/accept", payload: {}, as: TrustBoardReviewer, as_user_id: "board-1" }
            - { call: "POST /stewardship/easements/${e_id}/record", payload: {}, as: TrustAdmin }
            - { call: "POST /stewardship/violations", payload: { easement_id: "${e_id}", detected_by_user_id: "coord-9", violation_type: SUBDIVISION, severity: MINOR, detected_on: "2026-08-02" }, as: StewardshipCoordinator, captures: { v_id: $.data.id } }
            - { call: "POST /stewardship/violations/${v_id}/send-notice", payload: {}, as: StewardshipCoordinator }
          trigger:
            - { call: "POST /stewardship/violations/${v_id}/start-cure", payload: {}, as: Landowner, as_user_id: "${lo_id}", captures: { st: $.data.status } }
          assert:
            - "st == CURE_IN_PROGRESS"

  - section: cross_cutting_layers
    instances:
      - name: occ_layer_covered
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / draw_state_gate_beats_fiscal_check"
          rationale: "OCC happy-path versioning is exercised in every §1.8 draw/amendment chain; stale-version rejection is covered by corner instances occ_stale_easement_version_on_amendment_create, occ_stale_fund_version_on_draw, and occ_stale_easement_version_on_succession_record."

      - name: posture_reconciled_after_violation_resolve
        claim_type: derived_field_reconciliation
        grounds: [entities.Easement.fields.posture, state_machines.Violation.CURE_IN_PROGRESS_to_RESOLVED]
        distinguishing_aspect: "The derived posture tracks its sources in both directions: opening a violation sets VIOLATION_OPEN and resolving the last open violation recomputes it back to GOOD_STANDING with open_violation_count 0."
        test_recipe:
          setup: ["RECORDED easement; violation resolved through the full notice/cure/resolve path"]
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-PR", grantor_name: "G", parcel_acreage: 100, permitted_use_matrix: { AGRICULTURE: PERMITTED, SUBDIVISION: PROHIBITED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "O", contact_email: "o@x.com" }, as: TrustAdmin, captures: { lo_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 4 }, as: StewardshipCoordinator, captures: { br_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports/${br_id}/submit", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/baseline-reports/${br_id}/accept", payload: {}, as: TrustBoardReviewer, as_user_id: "board-1" }
            - { call: "POST /stewardship/easements/${e_id}/record", payload: {}, as: TrustAdmin }
            - { call: "POST /stewardship/violations", payload: { easement_id: "${e_id}", detected_by_user_id: "coord-9", violation_type: SUBDIVISION, severity: MINOR, detected_on: "2026-08-02" }, as: StewardshipCoordinator, captures: { v_id: $.data.id } }
            - { call: "GET /stewardship/easements/${e_id}", payload: {}, as: TrustAdmin, captures: { p_open: $.data.posture, n_open: $.data.open_violation_count } }
            - { call: "POST /stewardship/violations/${v_id}/send-notice", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/violations/${v_id}/start-cure", payload: {}, as: Landowner, as_user_id: "${lo_id}" }
          trigger:
            - { call: "POST /stewardship/violations/${v_id}/resolve", payload: {}, as: StewardshipCoordinator, as_user_id: "coord-2" }
            - { call: "GET /stewardship/easements/${e_id}", payload: {}, as: TrustAdmin, captures: { p_end: $.data.posture, n_end: $.data.open_violation_count } }
          assert:
            - "after create: p_open == VIOLATION_OPEN and n_open == 1"
            - "after resolve: p_end == GOOD_STANDING and n_end == 0 (derived fields reconciled on the same request)"

      - name: cascade_layer_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.Violation, state_machines.AmendmentRequest]
        excluded_because:
          difficulty_instance: "transitive_cascade / clock_sweep_escalation_spawns_enforcement_and_flips_posture"
          rationale: "N-level cascade verified end-to-end by both §1.8 transitive_cascade instances."

      - name: dual_variant_layer_covered
        claim_type: dual_variant_calculation
        grounds: [calculations.draw_capacity, calculations.deductible_value]
        excluded_because:
          difficulty_instance: "dual_variant_calc / endowment_draw_capacity_unitized_vs_policy"
          rationale: "Both variant pairs asserted with literal values in the two §1.8 dual_variant_calc instances."

  - section: consistency_model
    instances:
      - name: immediate_consistency_mutation_visible_in_response
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model, response_envelope]
        distinguishing_aspect: "Consistency model is immediate: the record endpoint's own response already carries status RECORDED and the computed next_monitoring_due_on, and the success envelope wraps it in meta + response_type object."
        test_recipe:
          setup: ["DRAFT easement with ACCEPTED baseline and ACTIVE landowner"]
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-IC", grantor_name: "G", parcel_acreage: 100, permitted_use_matrix: { AGRICULTURE: PERMITTED }, monitoring_interval_months: 12 }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "O", contact_email: "o@x.com" }, as: TrustAdmin }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 4 }, as: StewardshipCoordinator, captures: { br_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports/${br_id}/submit", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/baseline-reports/${br_id}/accept", payload: {}, as: TrustBoardReviewer, as_user_id: "board-1" }
          trigger:
            - { call: "POST /stewardship/easements/${e_id}/record", payload: {}, as: TrustAdmin, captures: { st: $.data.status, due: $.data.next_monitoring_due_on, rec: $.data.recorded_on } }
          assert:
            - "the record response itself shows st == RECORDED, rec == 2026-08-01, due == 2027-08-01 (no re-read or delay needed)"
            - "the response is wrapped in the fixed envelope with meta.api_request_id and response_type == object"
