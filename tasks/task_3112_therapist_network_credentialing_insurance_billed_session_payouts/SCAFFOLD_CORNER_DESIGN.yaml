              captures: { quoted_after: $.data.quoted_cost_share_cents }
          assert:
            - "before adjudication ${quoted_before} == 4900, produced by the provisional variant from the snapshot's deductible_remaining_cents of 0"
            - "after adjudication Claim.${claim_id}.patient_resp_cents == 15000, produced by the final variant from the patient's deductible_cents of 100000"
            - "after adjudication ${quoted_after} == 4900, so the session's provisional quote is preserved rather than overwritten by the final amount"
            - "the two values coexist on different entities: the session keeps the quote and the claim carries the final responsibility"
            - "Claim.${claim_id}.allowed_cents == 12000 and Claim.${claim_id}.payer_paid_cents == 0"

      - name: payout_line_applies_the_eighty_percent_ratio_to_the_billed_amount
        claim_type: Constants Applied
        grounds:
          - calculations.claim_billed_and_allowed_cents
          - entities.Claim.fields.allowed_cents
        distinguishing_aspect: "The payer-allowed constant is applied to the billed amount the rate resolver produced rather than to the rate row's raw rate_cents, so a session billed at 18000 allows 14400 while the version 1 contract rate would have allowed only 12000."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z then 2026-06-03T18:00:00Z; two rate rows with the higher version governing the service date."
          setup_api_calls:
            - *c_clock
            - *c_payer
            - *c_rate
            - call: "POST /network/payers/${payer_id}/rates"
              payload: { rate_set_version: 2, license_type: "LCSW", geography: "CA", cpt_code: "90837", rate_cents: 18000, effective_from: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - *c_clinician
            - *c_license
            - call: "POST /network/clinicians/${clinician_id}/licenses/${license_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /network/clinicians/${clinician_id}/malpractice-policies"
              payload: { carrier_name: "TherapyGuard Mutual", coverage_cents: 500000000, effective_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z", tail_coverage: false }
              as: OpsAdmin
            - *c_enroll
            - call: "POST /network/payer-enrollments/${enrollment_id}/activate"
              payload: {}
              as: OpsAdmin
            - *c_patient
            - *c_verification
            - *c_session
            - call: "POST /network/sessions/${session_id}/schedule"
              payload: {}
              as: Clinician
              as_user_id: "${clinician_id}"
              captures: { session_v1: $.data.version }
            - call: "POST /network/sessions/${session_id}/notes"
              payload: { diagnosis_code: "F41.1", duration_minutes: 60, cpt_code: "90837", narrative: "Note for the allowed-ratio corner.", expected_session_version: "${session_v1}" }
              as: Clinician
              as_user_id: "${clinician_id}"
              captures: { note_id: $.data.id }
            - call: "POST /network/sessions/${session_id}/notes/${note_id}/sign"
              payload: {}
              as: Clinician
              as_user_id: "${clinician_id}"
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-06-03T18:00:00Z" }
              as: OpsAdmin
            - call: "POST /network/sessions/${session_id}/complete"
              payload: {}
              as: Clinician
              as_user_id: "${clinician_id}"
          trigger:
            - call: "POST /network/claims"
              payload: { session_id: "${session_id}" }
              as: OpsAdmin
              captures: { claim_id: $.data.id }
          assert:
            - "Claim.${claim_id}.billed_cents == 18000, resolved from the version 2 rate row"
            - "Claim.${claim_id}.allowed_cents == 14400: round_half_up(18000 * 0.80)"
            - "Claim.${claim_id}.allowed_cents != 12000, which applying the ratio to the version 1 rate would have produced"
            - "Claim.${claim_id}.claim_status == SUBMITTED and submitted_on == 2026-06-03T18:00:00Z"
            - "Session.${session_id}.billing_state == CLAIM_SUBMITTED and Session.${session_id}.claim_id == ${claim_id}"

      - name: payout_line_records_a_post_payment_denial_as_a_clawback_on_a_later_batch
        claim_type: Reconciliation
        grounds:
          - calculations.denial_clawback_adjustment_cents
          - calculations.clinician_payout_balance_cents
          - calculations.clinician_payout_line_amount_cents
          - endpoints.POST_/network/claims/{id}/adjudicate
        distinguishing_aspect: "A denial that lands after the earning was already paid is reconciled as a negative adjustment on a later batch: the paid line keeps its gross while the new line carries adjustment_cents of -12000 and a net of -12000, which then flows into the balance unfloored."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z, then 2026-06-03T18:00:00Z, then 2026-06-09T00:00:00Z, then 2026-06-16T00:00:00Z."
            - "One completed and billed session belonging to batch B1, which is locked and paid so the earning has been disbursed."
          setup_api_calls:
            - *c_clock
            - *c_payer
            - *c_rate
            - *c_clinician
            - *c_license
            - call: "POST /network/clinicians/${clinician_id}/licenses/${license_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /network/clinicians/${clinician_id}/malpractice-policies"
              payload: { carrier_name: "TherapyGuard Mutual", coverage_cents: 500000000, effective_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z", tail_coverage: false }
              as: OpsAdmin
            - *c_enroll
            - call: "POST /network/payer-enrollments/${enrollment_id}/activate"
              payload: {}
              as: OpsAdmin
            - *c_patient
            - *c_verification
            - *c_session
            - call: "POST /network/sessions/${session_id}/schedule"
              payload: {}
              as: Clinician
              as_user_id: "${clinician_id}"
              captures: { session_v1: $.data.version }
            - call: "POST /network/sessions/${session_id}/notes"
              payload: { diagnosis_code: "F41.1", duration_minutes: 60, cpt_code: "90837", narrative: "Note for the post-payment clawback corner.", expected_session_version: "${session_v1}" }
              as: Clinician
              as_user_id: "${clinician_id}"
              captures: { note_id: $.data.id }
            - call: "POST /network/sessions/${session_id}/notes/${note_id}/sign"
              payload: {}
              as: Clinician
              as_user_id: "${clinician_id}"
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-06-03T18:00:00Z" }
              as: OpsAdmin
            - call: "POST /network/sessions/${session_id}/complete"
              payload: {}
              as: Clinician
              as_user_id: "${clinician_id}"
            - call: "POST /network/claims"
              payload: { session_id: "${session_id}" }
              as: OpsAdmin
              captures: { claim_id: $.data.id }
            - call: "POST /network/claims/${claim_id}/adjudicate"
              payload: { outcome: "PAID" }
              as: OpsAdmin
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-06-09T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /network/payout-batches"
              payload: { period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-08T00:00:00Z", schedule: "WEEKLY" }
              as: OpsAdmin
              captures: { batch_b1: $.data.id }
            - call: "POST /network/payout-batches/${batch_b1}/lock"
              payload: {}
              as: OpsAdmin
            - call: "POST /network/payout-batches/${batch_b1}/pay"
              payload: {}
              as: OpsAdmin
          trigger:
            - call: "POST /network/claims/${claim_id}/adjudicate"
              payload: { outcome: "DENIED", denial_code: "MISSING_DOCUMENTATION" }
              as: OpsAdmin
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-06-16T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /network/payout-batches"
              payload: { period_start: "2026-06-15T00:00:00Z", period_end: "2026-06-22T00:00:00Z", schedule: "WEEKLY" }
              as: OpsAdmin
              captures: { batch_b2: $.data.id }
            - call: "POST /network/payout-batches/${batch_b2}/lock"
              payload: {}
              as: OpsAdmin
              captures: { b2_adjustment: $.data.total_adjustment_cents, b2_net: $.data.total_net_cents }
          assert:
            - "the claim adjudication returns status 200 and Claim.${claim_id}.claim_status == DENIED with denial_code MISSING_DOCUMENTATION"
            - "the paid line on batch ${batch_b1} is untouched: it reads line_status PAID with gross_cents == 15000, net_cents == 15000 and adjustment_cents == 0"
            - "the later batch carries the reconciliation: ${b2_adjustment} == -15000 and ${b2_net} == -15000"
            - "the negative net is not floored, because the floor applies only to PENDING lines"
            - "Clinician.${clinician_id}.payout_balance_cents == 0, being 15000 paid less the 15000 adjustment flowing through the new line"
            - "the clawback equals the session's resolved rate, so the payer's denial reversed exactly the clinician's earning for that session"

      - name: enrollment_effective_window_days_is_null_when_the_window_is_open_ended
        claim_type: Correct Result
        grounds:
          - calculations.enrollment_effective_window_days
          - endpoints.POST_/network/payer-enrollments/{id}/activate
          - errors.ERR_ENROLLMENT_WINDOW_INVALID
        distinguishing_aspect: "A bounded window reports a whole-day count while an open-ended one reports null rather than zero or an enormous sentinel, and a zero-length window is refused at validation before the derivation could run."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z; one clinician fully credentialed and one payer."
          setup_api_calls:
            - *c_clock
            - *c_payer
            - *c_rate
            - *c_clinician
            - *c_license
            - call: "POST /network/clinicians/${clinician_id}/licenses/${license_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /network/clinicians/${clinician_id}/malpractice-policies"
              payload: { carrier_name: "TherapyGuard Mutual", coverage_cents: 500000000, effective_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z", tail_coverage: false }
              as: OpsAdmin
          trigger:
            - call: "POST /network/payer-enrollments"
              payload: { clinician_id: "${clinician_id}", payer_id: "${payer_id}", delegated: true, effective_from: "2026-01-01T00:00:00Z" }
              as: OpsAdmin
              captures: { open_enrollment: $.data.id }
            - call: "POST /network/payer-enrollments/${open_enrollment}/activate"
              payload: {}
              as: OpsAdmin
              captures: { open_window: $.data.effective_window_days }
            - call: "POST /network/payer-enrollments"
              payload: { clinician_id: "${clinician_id}", payer_id: "${payer_id}", delegated: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-07-01T00:00:00Z" }
              as: OpsAdmin
              captures: { bounded_enrollment: $.data.id }
            - call: "POST /network/payer-enrollments/${bounded_enrollment}/activate"
              payload: {}
              as: OpsAdmin
              captures: { bounded_window: $.data.effective_window_days }
            - call: "POST /network/payer-enrollments"
              payload: { clinician_id: "${clinician_id}", payer_id: "${payer_id}", delegated: false, effective_from: "2026-03-01T00:00:00Z", effective_to: "2026-03-01T00:00:00Z" }
              as: OpsAdmin
              captures: { error_id_zero: $.data.error_id }
          assert:
            - "PayerEnrollment.${open_enrollment}.status == EFFECTIVE and ${open_window} is null"
            - "PayerEnrollment.${bounded_enrollment}.effective_window_days == ${bounded_window} == 181, the whole-day distance from 2026-01-01 to the exclusive end 2026-07-01"
            - "the zero-length window is refused at creation: status 422 and ${error_id_zero} == ERR_ENROLLMENT_WINDOW_INVALID"
            - "PayerEnrollment.${open_enrollment}.rate_set_version_pinned == 1, taken from the version 1 rate row covering effective_from"
            - "Clinician.${clinician_id}.enrolled_payer_count == 2 and billing_posture == BILLABLE"

  # ===========================================================================
  - section: validations
    instances:

      - name: missing_role_header_returns_unauthenticated_before_any_lookup
        claim_type: Violation -> Error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
          - endpoints.GET_/network/clinicians/{id}
        distinguishing_aspect: "Priority 1 runs before existence, so a request with no X-User-Role header against a wholly unknown id returns 401 ERR_UNAUTHENTICATED rather than 404 ERR_CLINICIAN_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /network/clinicians/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: Anonymous
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 401 and error_id == ERR_UNAUTHENTICATED"
            - "error_id != ERR_CLINICIAN_NOT_FOUND, even though the id also does not resolve"
            - "response_type is error and data carries both error_id and message"

      - name: undeclared_role_is_rejected_at_authentication
        claim_type: Violation -> Error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
          - entities.Payer
          - endpoints.POST_/network/clinicians
        distinguishing_aspect: "A role name that is not one of the six declared roles fails the authentication check rather than the authorization check, so the status is 401 and not 403."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /network/clinicians"
              payload: { full_name: "Avery Lin", license_type: "LCSW", primary_state: "CA", specialty_tags: ["ANXIETY"], weekly_caseload_target: 5, availability_blocks: [{ weekday: 3, start_minute: 480, end_minute: 1080 }] }
              as: Anonymous
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 401 and error_id == ERR_UNAUTHENTICATED"
            - "error_id != ERR_UNAUTHORIZED and error_id != ERR_INVALID_REQUEST"
            - "GET /network/clinicians returns 0 rows, so nothing was persisted"

      - name: clinician_cannot_patch_a_payer_because_the_operation_is_ops_admin_exclusive
        claim_type: Violation -> Error
        grounds:
          - validations[priority=2]
          - errors.ERR_UNAUTHORIZED
          - endpoints.PATCH_/network/payers/{id}
          - roles
        distinguishing_aspect: "Priority 2 fires even though the caller is a well-formed declared role: a Clinician naming its own id is refused on a payer mutation with 403 ERR_UNAUTHORIZED, and the payer's status is untouched."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z; one payer and one clinician on file."
          setup_api_calls:
            - *c_clock
            - *c_payer
            - *c_clinician
          trigger:
            - call: "PATCH /network/payers/${payer_id}"
              payload: { status: "SUSPENDED_AT_PAYER" }
              as: Clinician
              as_user_id: "${clinician_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_UNAUTHORIZED"
            - "error_id != ERR_UNAUTHENTICATED, because the role and id are both well formed"
            - "Payer.${payer_id}.status == ACTIVE after the rejection"
            - "no PayerEnrollment cascade fired, so GET /network/payers/${payer_id}/payer-enrollments returns 0 rows"

      - name: compliance_officer_cannot_verify_another_clinicians_scope_through_a_mismatched_path
        claim_type: Violation -> Error
        grounds:
          - validations[priority=3]
          - errors.ERR_LICENSE_NOT_FOUND
          - endpoints.POST_/network/clinicians/{clinician_id}/licenses/{id}/verify
        distinguishing_aspect: "The license lookup is scoped to the path clinician, so a real license id paired with a different clinician's path segment produces 404 ERR_LICENSE_NOT_FOUND rather than 403 or a silent success."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z; two clinicians, each with one license."
          setup_api_calls:
            - *c_clock
            - *c_clinician
            - *c_license
            - call: "POST /network/clinicians"
              payload: { full_name: "Rafael Duarte", license_type: "LMFT", primary_state: "CA", specialty_tags: ["TRAUMA"], weekly_caseload_target: 6, availability_blocks: [{ weekday: 5, start_minute: 480, end_minute: 1080 }] }
              as: OpsAdmin
              captures: { other_clinician_id: $.data.id }
          trigger:
            - call: "POST /network/clinicians/${other_clinician_id}/licenses/${license_id}/verify"
              payload: {}
              as: ComplianceOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_LICENSE_NOT_FOUND"
            - "License.${license_id}.verification_status == UNVERIFIED, so the mismatched path did not verify it"
            - "License.${license_id}.verification_attempts == 0"
            - "error_id != ERR_UNAUTHORIZED, isolating the scoped existence check from the authorization check"

      - name: session_schedule_requires_a_unjailed_clinician_posture
        claim_type: Violation -> Error
        grounds:
          - validations[priority=5]
          - state_machines.Clinician.billing_posture
          - errors.ERR_CLINICIAN_NOT_BILLABLE
          - endpoints.POST_/network/claims
        distinguishing_aspect: "The posture gate is a safety-category check ordered ahead of the fiscal checks, so a suspended clinician's completed session is refused on the claim path with ERR_CLINICIAN_NOT_BILLABLE rather than on any capacity or window rule."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z, then 2026-06-03T18:00:00Z; a completed, signed, unbilled session for a clinician who is then suspended."
          setup_api_calls:
            - *c_clock
            - *c_payer
            - *c_rate
            - *c_clinician
            - *c_license
            - call: "POST /network/clinicians/${clinician_id}/licenses/${license_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /network/clinicians/${clinician_id}/malpractice-policies"
              payload: { carrier_name: "TherapyGuard Mutual", coverage_cents: 500000000, effective_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z", tail_coverage: false }
              as: OpsAdmin
            - *c_enroll
            - call: "POST /network/payer-enrollments/${enrollment_id}/activate"
              payload: {}
              as: OpsAdmin
            - *c_patient
            - *c_verification
            - *c_session
            - call: "POST /network/sessions/${session_id}/schedule"
              payload: {}
              as: Clinician
              as_user_id: "${clinician_id}"
              captures: { session_v1: $.data.version }
            - call: "POST /network/sessions/${session_id}/notes"
              payload: { diagnosis_code: "F41.1", duration_minutes: 60, cpt_code: "90837", narrative: "Note for the posture-gate corner.", expected_session_version: "${session_v1}" }
              as: Clinician
              as_user_id: "${clinician_id}"
              captures: { note_id: $.data.id }
            - call: "POST /network/sessions/${session_id}/notes/${note_id}/sign"
              payload: {}
              as: Clinician
              as_user_id: "${clinician_id}"
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-06-03T18:00:00Z" }
              as: OpsAdmin
            - call: "POST /network/sessions/${session_id}/complete"
              payload: {}
              as: Clinician
              as_user_id: "${clinician_id}"
            - call: "POST /network/clinicians/${clinician_id}/suspend"
              payload: {}
              as: OpsAdmin
          trigger:
            - call: "POST /network/claims"
              payload: { session_id: "${session_id}" }
              as: OpsAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_CLINICIAN_NOT_BILLABLE"
            - "Clinician.${clinician_id}.billing_posture == FROZEN and status == SUSPENDED"
            - "Session.${session_id}.status == COMPLETED and billing_state == UNBILLED, so completion survived the suspension while billing did not"
            - "the signed note is still on file: GET /network/sessions/${session_id}/notes returns 1 row in SIGNED status"
            - "error_id != ERR_SERVICE_NOT_ENROLLED, even though the enrollment is untouched and still EFFECTIVE"

      - name: cpt_code_outside_the_payers_allowed_set_returns_service_not_enrolled
        claim_type: Violation -> Error
        grounds:
          - validations[priority=6]
          - entities.Payer.fields.allowed_cpt_codes
          - errors.ERR_SERVICE_NOT_ENROLLED
          - endpoints.POST_/network/claims
        distinguishing_aspect: "The referential gate covers three conditions at once — payer status, code membership and enrollment coverage — and for a code the payer excludes the answer is ERR_SERVICE_NOT_ENROLLED even though the payment posture and enrollment are perfectly healthy."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z, then 2026-06-03T18:00:00Z; a payer whose allowed set is [90834] only, and a completed session coded 90837."
