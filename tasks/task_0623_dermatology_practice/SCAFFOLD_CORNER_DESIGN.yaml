# =============================================================================
# Task 0623 — Dermatology Practice — §1.9 Scaffold Corner Design
# Breadth probe: every other testable claim §1.1-§1.7 surfaces, beyond the nine
# Difficulty Rules. Sections/claim_types follow references/claim-extraction-guide.md.
# Every setup_api_calls chain conforms to §1.5 (lint-clean). Stubs cite §1.8 names.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_patient_minimal_required_fields
        claim_type: Creation
        grounds:
          - entities.Patient.fields.full_name
          - entities.Patient.fields.date_of_birth
        distinguishing_aspect: "POST /patients with full_name + date_of_birth -> 201; defaults applied: has_active_insurance=false, insurance_coinsurance_rate=0.2, insurance_deductible_remaining_cents=0, last_skin_check_at=null."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "New Pat", date_of_birth: "1995-06-06" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Patient.${pat_id}.has_active_insurance == false"
            - "Patient.${pat_id}.insurance_coinsurance_rate == 0.2"
            - "Patient.${pat_id}.insurance_deductible_remaining_cents == 0"
            - "Patient.${pat_id}.last_skin_check_at == null"
            - "Patient.${pat_id}.version == 1"

      - name: create_encounter_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - entities.Encounter.fields.visit_type
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /encounters omitting visit_type (no default) -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A provider and a patient exist."]
          setup_api_calls:
            - call: "POST /providers"
              payload: { full_name: "Dr Req", npi: "RQ-1", active: true }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Req Pat", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", scheduled_at: "2026-01-20T09:00:00Z" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: get_biopsy_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - "errors[ERR_BIOPSY_NOT_FOUND]"
        distinguishing_aspect: "GET /biopsies/{random-uuid} for an unknown id -> ERR_BIOPSY_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /biopsies/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Provider
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == ERR_BIOPSY_NOT_FOUND"

      - name: encounter_system_fields_ignore_client_input
        claim_type: System Fields
        grounds:
          - entities.Encounter.fields.clinical_status
          - entities.Encounter.fields.billing_status
          - entities.Encounter.fields.open_biopsy_count
        distinguishing_aspect: "On POST /encounters the server sets clinical_status=SCHEDULED, billing_status=BILLING_OPEN, open_biopsy_count=0 regardless of any client-supplied status; version starts at 1."
        test_recipe:
          setup: ["A provider and patient exist."]
          setup_api_calls:
            - call: "POST /providers"
              payload: { full_name: "Dr Sys", npi: "SY-1", active: true }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Sys Pat", date_of_birth: "1990-02-02" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "MEDICAL", scheduled_at: "2026-01-20T10:00:00Z" }
              as: FrontDesk
              captures: { enc_id: $.data.id }
          assert:
            - "Encounter.${enc_id}.clinical_status == SCHEDULED"
            - "Encounter.${enc_id}.billing_status == BILLING_OPEN"
            - "Encounter.${enc_id}.open_biopsy_count == 0"
            - "Encounter.${enc_id}.version == 1"

      - name: cosmetic_encounter_pay_path_forced_cash
        claim_type: Computed Fields
        grounds:
          - entities.Encounter.fields.pay_path
          - entities.Encounter.fields.visit_type
        distinguishing_aspect: "A COSMETIC encounter is always CASH even if pay_path=INSURANCE is supplied: server stores pay_path=CASH."
        test_recipe:
          setup: ["A provider and an insured patient exist."]
          setup_api_calls:
            - call: "POST /providers"
              payload: { full_name: "Dr Cash", npi: "CA-1", active: true }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Cash Pat2", date_of_birth: "1990-03-03", has_active_insurance: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "COSMETIC", scheduled_at: "2026-01-20T11:00:00Z", pay_path: "INSURANCE" }
              as: FrontDesk
              captures: { enc_id: $.data.id }
          assert:
            - "Encounter.${enc_id}.pay_path == CASH"

      - name: list_patients_pagination_envelope
        claim_type: Listing
        grounds:
          - entities.Patient
        distinguishing_aspect: "GET /patients returns an array envelope with pagination meta fields total_count and has_more present."
        test_recipe:
          setup: ["At least one patient exists."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "List Pat", date_of_birth: "1990-04-04" }
              as: FrontDesk
          trigger:
            - call: "GET /patients"
              payload: { limit: 10, offset: 0 }
              as: FrontDesk
          assert:
            - "HTTP status == 200"
            - "response.response_type == array"
            - "response.data has length >= 1"
            - "pagination meta includes total_count and has_more"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: biopsy_send_to_lab_from_resulted_invalid
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Biopsy.COLLECTED_to_AT_LAB
          - "errors[ERR_BIOPSY_BAD_STATE]"
        distinguishing_aspect: "send-to-lab on a Biopsy already RESULTED (not COLLECTED) -> ERR_BIOPSY_BAD_STATE (409); status stays RESULTED."
        test_recipe:
          setup: ["A biopsy driven COLLECTED -> AT_LAB -> RESULTED(BENIGN)."]
          setup_api_calls:
            - call: "POST /providers"
              payload: { full_name: "Dr Inv", npi: "IV-1", active: true }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Inv Pat", date_of_birth: "1971-05-05" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "MEDICAL", scheduled_at: "2026-01-21T09:00:00Z" }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /encounters/${enc_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /encounters/${enc_id}/start"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /biopsies"
              payload: { encounter_id: "${enc_id}", body_site: "back" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { biopsy_id: $.data.id }
            - call: "POST /biopsies/${biopsy_id}/send-to-lab"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /biopsies/${biopsy_id}/result"
              payload: { result: "BENIGN" }
              as: PathLab
          trigger:
            - call: "POST /biopsies/${biopsy_id}/send-to-lab"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_BIOPSY_BAD_STATE"

      - name: charge_pay_from_paid_terminal_locked
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Charge.POSTED_to_PAID
          - "errors[ERR_CHARGE_BAD_STATE]"
        distinguishing_aspect: "Paying a Charge already PAID (terminal) -> ERR_CHARGE_BAD_STATE (409); no further transition from PAID."
        test_recipe:
          setup: ["A CASH charge posted then paid (terminal PAID)."]
          setup_api_calls:
            - call: "POST /providers"
              payload: { full_name: "Dr Pay", npi: "PY-1", active: true }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pay Pat", date_of_birth: "1973-06-06" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "MEDICAL", scheduled_at: "2026-01-21T10:00:00Z" }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /charges"
              payload: { patient_id: "${pat_id}", encounter_id: "${enc_id}", source_kind: "ENCOUNTER", charge_kind: "OFFICE_VISIT", billed_amount_cents: 10000 }
              as: BillingSpecialist
              captures: { ch_id: $.data.id }
            - call: "POST /charges/${ch_id}/pay"
              payload: {}
              as: BillingSpecialist
          trigger:
            - call: "POST /charges/${ch_id}/pay"
              payload: {}
              as: BillingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_CHARGE_BAD_STATE"

      - name: recall_sweep_fires_only_due_pending
        claim_type: Side Effect Execution
        grounds:
          - state_machines.RecallReminder.PENDING_to_SENT
          - entities.RecallReminder.fields.due_at
        distinguishing_aspect: "POST /_recall/sweep transitions a PENDING reminder due_at <= clock to SENT; a not-yet-due reminder stays PENDING."
        test_recipe:
          setup: ["Clock 2026-03-01. Patient with a due reminder (due 2026-02-01) and a future reminder (due 2027-01-01)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /patients"
              payload: { full_name: "Swp Pat", date_of_birth: "1960-07-07" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /recall-reminders"
              payload: { patient_id: "${pat_id}", reason: "ROUTINE_SKIN_CHECK", due_at: "2026-02-01T00:00:00Z" }
              as: FrontDesk
              captures: { due_id: $.data.id }
            - call: "POST /recall-reminders"
              payload: { patient_id: "${pat_id}", reason: "ROUTINE_SKIN_CHECK", due_at: "2027-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { future_id: $.data.id }
          trigger:
            - call: "POST /_recall/sweep"
              payload: {}
              as: PracticeAdmin
          assert:
            - "RecallReminder.${due_id}.status == SENT"
            - "RecallReminder.${future_id}.status == PENDING"

      - name: skincheck_close_sets_last_skin_check_and_spawns_routine_recall
        claim_type: Cross-entity
        grounds:
          - state_machines.Encounter.IN_PROGRESS_to_CLINICALLY_CLOSED
          - entities.Patient.fields.last_skin_check_at
          - calculations.routine_recall_horizon
        distinguishing_aspect: "Closing a SKIN_CHECK encounter at clock 2026-04-01 sets Patient.last_skin_check_at=2026-04-01T00:00:00Z and spawns a ROUTINE_SKIN_CHECK RecallReminder (biopsy_id null) due 2027-04-01T00:00:00Z."
        test_recipe:
          setup: ["Clock 2026-04-01. SKIN_CHECK encounter checked in and started (IN_PROGRESS), no biopsies."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /providers"
              payload: { full_name: "Dr Skn", npi: "SK-1", active: true }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Skn Pat", date_of_birth: "1972-09-09" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "SKIN_CHECK", scheduled_at: "2026-04-01T09:00:00Z" }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /encounters/${enc_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /encounters/${enc_id}/start"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /encounters/${enc_id}/clinical-close"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
          assert:
            - "Encounter.${enc_id}.clinical_status == CLINICALLY_CLOSED"
            - "Patient.${pat_id}.last_skin_check_at == 2026-04-01T00:00:00Z"
            - "A ROUTINE_SKIN_CHECK RecallReminder for ${pat_id} with biopsy_id null and due_at 2027-04-01T00:00:00Z and status PENDING exists (via GET /recall-reminders?patient_id=${pat_id})"

      - name: pa_adjudicate_from_draft_invalid
        claim_type: Invalid Transitions
        grounds:
          - state_machines.PriorAuthorization.SUBMITTED_to_APPROVED
          - "errors[ERR_PA_BAD_STATE]"
        distinguishing_aspect: "adjudicate on a DRAFT PriorAuthorization (must be SUBMITTED) -> ERR_PA_BAD_STATE (409)."
        test_recipe:
          setup: ["A DRAFT PriorAuthorization with required_step_count 0."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Adj Pat", date_of_birth: "1961-08-08" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /prior-authorizations"
              payload: { patient_id: "${pat_id}", drug_name: "biologic-Q", required_step_count: 0, list_price_cents: 50000 }
              as: BillingSpecialist
              captures: { pa_id: $.data.id }
          trigger:
            - call: "POST /prior-authorizations/${pa_id}/adjudicate"
              payload: { decision: "APPROVE" }
              as: BillingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_PA_BAD_STATE"

      - name: open_biopsy_blocks_clinical_close
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Encounter.IN_PROGRESS_to_CLINICALLY_CLOSED
          - "validations[priority=11]"
          - "errors[ERR_OPEN_BIOPSY_BLOCKS_CLOSE]"
        distinguishing_aspect: "clinical-close while a child biopsy is COLLECTED (open_biopsy_count==1) -> ERR_OPEN_BIOPSY_BLOCKS_CLOSE (409); cancelling the biopsy then permits close."
        test_recipe:
          setup: ["MEDICAL encounter IN_PROGRESS with one COLLECTED biopsy (open_biopsy_count==1)."]
          setup_api_calls:
            - call: "POST /providers"
              payload: { full_name: "Dr Blk", npi: "BK-1", active: true }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Blk Pat", date_of_birth: "1974-09-09" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "MEDICAL", scheduled_at: "2026-01-22T09:00:00Z" }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /encounters/${enc_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /encounters/${enc_id}/start"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /biopsies"
              payload: { encounter_id: "${enc_id}", body_site: "arm" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { biopsy_id: $.data.id }
          trigger:
            - call: "POST /encounters/${enc_id}/clinical-close"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_OPEN_BIOPSY_BLOCKS_CLOSE"
            - "Encounter.${enc_id}.open_biopsy_count == 1"

      - name: membership_auto_exhausts_on_full_drain
        claim_type: Bubble up
        grounds:
          - state_machines.CosmeticMembership.ACTIVE_to_EXHAUSTED
          - calculations.cosmetic_redemption_split
          - entities.CosmeticMembership.fields.unit_balance_cents
        distinguishing_aspect: "A SILVER membership wallet exactly drained to 0 by a redemption auto-bubbles ACTIVE -> EXHAUSTED: SILVER purchased 9000 (wallet 9000), list 10000 redeems 9000 (disc 9500), wallet 0 -> EXHAUSTED."
        test_recipe:
          setup: ["COSMETIC encounter; SILVER membership purchased 9000 activated -> wallet 9000."]
          setup_api_calls:
            - call: "POST /providers"
              payload: { full_name: "Dr Exh", npi: "EX-1", active: true }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Exh Pat", date_of_birth: "1986-10-10" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "COSMETIC", scheduled_at: "2026-01-22T11:00:00Z" }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /cosmetic-memberships"
              payload: { patient_id: "${pat_id}", tier: "SILVER", purchased_unit_cents: 9000 }
              as: BillingSpecialist
              captures: { mem_id: $.data.id }
            - call: "POST /cosmetic-memberships/${mem_id}/activate"
              payload: {}
              as: BillingSpecialist
              captures: { mem_v: $.data.version }
          trigger:
            - call: "POST /cosmetic-treatments"
              payload: { encounter_id: "${enc_id}", membership_id: "${mem_id}", service_name: "peel", list_price_cents: 10000, expected_membership_version: "${mem_v}" }
              as: BillingSpecialist
              captures: { t_id: $.data.id }
          assert:
            - "CosmeticTreatment.${t_id}.redeemed_cents == 9000"
            - "CosmeticTreatment.${t_id}.out_of_pocket_cents == 500"
            - "CosmeticMembership.${mem_id}.unit_balance_cents == 0"
            - "CosmeticMembership.${mem_id}.status == EXHAUSTED"

  # ===========================================================================
  - section: calculations
    instances:
      - name: membership_grant_gold_bonus_applied
        claim_type: Correct Result
        grounds:
          - calculations.membership_wallet_grant
          - entities.CosmeticMembership.fields.unit_balance_cents
        distinguishing_aspect: "Activating a GOLD membership purchased 30000 grants wallet 33000 (10% bonus); a SILVER membership purchased 30000 grants 30000 (0% bonus)."
        test_recipe:
          setup: ["A patient; one GOLD and one SILVER membership PENDING, each purchased 30000."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Grant Pat", date_of_birth: "1982-11-11" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /cosmetic-memberships"
              payload: { patient_id: "${pat_id}", tier: "GOLD", purchased_unit_cents: 30000 }
              as: BillingSpecialist
              captures: { mem_g_id: $.data.id }
            - call: "POST /cosmetic-memberships"
              payload: { patient_id: "${pat_id}", tier: "SILVER", purchased_unit_cents: 30000 }
              as: BillingSpecialist
              captures: { mem_s_id: $.data.id }
          trigger:
            - call: "POST /cosmetic-memberships/${mem_g_id}/activate"
              payload: {}
              as: BillingSpecialist
            - call: "POST /cosmetic-memberships/${mem_s_id}/activate"
              payload: {}
              as: BillingSpecialist
          assert:
            - "CosmeticMembership.${mem_g_id}.unit_balance_cents == 33000"
            - "CosmeticMembership.${mem_s_id}.unit_balance_cents == 30000"

      - name: biopsy_recall_horizon_benign_twelve_months
        claim_type: Constants Applied
        grounds:
          - calculations.biopsy_recall_horizon
          - entities.Biopsy.fields.recall_months
        distinguishing_aspect: "Signing out a BENIGN biopsy sets recall_months=12 and spawns a BIOPSY_FOLLOWUP recall due 12 months after the clock (2026-03-01 -> 2027-03-01)."
        test_recipe:
          setup: ["Clock 2026-03-01. MEDICAL encounter IN_PROGRESS; biopsy COLLECTED->AT_LAB->RESULTED(BENIGN)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /providers"
              payload: { full_name: "Dr Ben", npi: "BN-1", active: true }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Ben Pat", date_of_birth: "1964-12-12" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "MEDICAL", scheduled_at: "2026-03-01T09:00:00Z" }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /encounters/${enc_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /encounters/${enc_id}/start"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /biopsies"
              payload: { encounter_id: "${enc_id}", body_site: "nose" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { biopsy_id: $.data.id }
            - call: "POST /biopsies/${biopsy_id}/send-to-lab"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /biopsies/${biopsy_id}/result"
              payload: { result: "BENIGN" }
              as: PathLab
          trigger:
            - call: "POST /biopsies/${biopsy_id}/sign-out"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { recall_months: $.data.recall_months }
          assert:
            - "Biopsy.${biopsy_id}.recall_months == 12"
            - "A BIOPSY_FOLLOWUP RecallReminder for biopsy_id ${biopsy_id} exists with due_at 2027-03-01T00:00:00Z and status PENDING (via GET /recall-reminders?biopsy_id=${biopsy_id})"

      - name: cosmetic_summary_order_pinned_total_due
        claim_type: Correct Result
        grounds:
          - calculations.cosmetic_total_due
          - entities.CosmeticTreatment.fields.out_of_pocket_cents
