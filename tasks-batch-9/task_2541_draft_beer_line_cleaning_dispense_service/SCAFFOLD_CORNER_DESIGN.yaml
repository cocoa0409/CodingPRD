# =============================================================================
# 1.9 SCAFFOLD CORNER DESIGN — draft-line-service-ops (task_2541)
#
# Breadth probe. The nine `section:` values and every `claim_type:` come from
# references/claim-extraction-guide.md; nothing is invented. Rows that do not
# apply to this scaffold are skipped without ceremony (no bulk_operations, no
# soft_delete, no idempotency keys, no multi-tenancy layer, no saga consistency
# model, no hierarchical/graph topology claims, no bubble-up state machine).
#
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as
# `excluded_because:` stubs naming the exact §1.8 instance.
#
# Every literal in an `assert:` was computed from the matching §1.3 formula, and
# every `${var}` is bound by a `captures:` earlier in the same instance. Every
# call carries `as_user_id` because §1.4 P1 requires both X-User-Role and
# X-User-ID to be present and non-empty.
#
# Clock discipline: the logical clock starts at 2026-08-01T00:00:00Z and any
# instance that depends on elapsed time pins it with
# POST /draft-service/_clock/set_current_utc.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 — entities
  # ===========================================================================
  - section: entities
    instances:
      - name: corner_account_create_returns_every_declared_field_with_seed_values
        claim_type: Creation
        grounds:
          - entities.ServiceAccount
          - endpoints.POST_accounts
          - response_envelope.success
        distinguishing_aspect: |
          201 plus the full ServiceAccount projection: the four input fields
          echoed, and every system/computed field seeded to its declared default
          (status ACTIVE, billing_mode DIRECT_BILL, lines_out_of_service_count 0,
          open_complaint_count 0, suspended_reason NONE, version 1).
        test_recipe:
          setup:
            - "Empty database; logical clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
          trigger:
            - call: "POST /draft-service/accounts"
              payload: { venue_name: "Corner Case Tavern", access_window_start_minute: 480, access_window_end_minute: 1080, glycol_system_present: false }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { acct: $.data.id, acct_v: $.data.version }
          assert:
            - "POST /draft-service/accounts returns HTTP 201"
            - "ServiceAccount.${acct}.venue_name == Corner Case Tavern"
            - "ServiceAccount.${acct}.access_window_start_minute == 480"
            - "ServiceAccount.${acct}.access_window_end_minute == 1080"
            - "ServiceAccount.${acct}.glycol_system_present == false"
            - "ServiceAccount.${acct}.status == ACTIVE"
            - "ServiceAccount.${acct}.billing_mode == DIRECT_BILL"
            - "ServiceAccount.${acct}.lines_out_of_service_count == 0"
            - "ServiceAccount.${acct}.open_complaint_count == 0"
            - "ServiceAccount.${acct}.suspended_reason == NONE"
            - "${acct_v} == 1"
            - "the response meta carries api_request_id and api_request_timestamp and response_type == object"

      - name: corner_beer_line_get_by_id_returns_the_stored_row
        claim_type: Retrieval
        grounds:
          - entities.BeerLine
          - endpoints.GET_beer_lines_line_id
        distinguishing_aspect: |
          A GET after create returns the same id and the same geometry, with the
          projection fields at their creation defaults (compliance_flag
          COMPLIANT, last_chemical_type NONE, last_cleaned_at null, next_due_at
          null, days_overdue 0) - i.e. reading never runs the projection.
        test_recipe:
          setup:
            - "One ACTIVE ServiceAccount with an ACTIVE contract (contracted_line_count 4) and one BeerLine 32ft/4ft/0.375in ALE."
          setup_api_calls:
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/accounts"
              payload: { venue_name: "Readback Bar", access_window_start_minute: 480, access_window_end_minute: 1080, glycol_system_present: false }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { acct: $.data.id, acct_v: $.data.version }
            - call: "POST /draft-service/contracts"
              payload: { account_id: "${acct}", cleaning_frequency_days: 21, contracted_line_count: 4, per_line_rate_cents: 4175, visit_base_fee_cents: 7500, effective_from: "2026-08-01T00:00:00Z", expected_account_version: "${acct_v}" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { ctr: $.data.id }
            - call: "POST /draft-service/contracts/${ctr}/status"
              payload: { to_status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/beer-lines"
              payload: { account_id: "${acct}", line_number: 1, run_length_feet: 32, vertical_rise_feet: 4, inner_diameter_inches: 0.375, beer_style_group: "ALE", average_daily_throughput_liters: 12.0 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { line1: $.data.id }
          trigger:
            - call: "GET /draft-service/beer-lines/${line1}"
              payload: {}
              as: ServiceTechnician
              as_user_id: "tech-probe-1"
              captures: { read_id: $.data.id, read_v: $.data.version }
          assert:
            - "GET /draft-service/beer-lines/${line1} returns HTTP 200"
            - "${read_id} == ${line1}"
            - "${read_v} == 1"
            - "BeerLine.${line1}.run_length_feet == 32"
            - "BeerLine.${line1}.inner_diameter_inches == 0.375"
            - "BeerLine.${line1}.beer_style_group == ALE"
            - "BeerLine.${line1}.status == IN_SERVICE"
            - "BeerLine.${line1}.compliance_flag == COMPLIANT"
            - "BeerLine.${line1}.last_chemical_type == NONE"
            - "BeerLine.${line1}.last_cleaned_at == null"
            - "BeerLine.${line1}.next_due_at == null"
            - "BeerLine.${line1}.days_overdue == 0"

      - name: corner_technician_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - entities.Technician
          - endpoints.GET_technicians
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          Three technicians exist; limit 2 / offset 0 returns 2 rows with
          total_count 3 and has_more true, and limit 2 / offset 2 returns the
          last row with has_more false. Pagination counts the FILTERED set, so
          the INACTIVE technician is excluded from total_count when status is
          filtered.
        test_recipe:
          setup:
            - "Three Technician rows: two ACTIVE and one INACTIVE."
          setup_api_calls:
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/technicians"
              payload: { full_name: "Dana Ruiz", certification_level: "MASTER", caustic_certified: true, status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { t1: $.data.id }
            - call: "POST /draft-service/technicians"
              payload: { full_name: "Kem Adeyemi", certification_level: "CERTIFIED", caustic_certified: false, status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { t2: $.data.id }
            - call: "POST /draft-service/technicians"
              payload: { full_name: "Sol Vranken", certification_level: "APPRENTICE", caustic_certified: false, status: "INACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { t3: $.data.id }
          trigger:
            - call: "GET /draft-service/technicians"
              payload: { limit: 2, offset: 0 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { page1_first: "$.data[0].id" }
            - call: "GET /draft-service/technicians"
              payload: { limit: 2, offset: 2 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { page2_first: "$.data[0].id" }
            - call: "GET /draft-service/technicians"
              payload: { status: "ACTIVE", limit: 10, offset: 0 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { active_first: "$.data[0].id" }
          assert:
            - "the first list response has response_type == array, 2 items, total_count 3 and has_more true"
            - "the second list response has 1 item, total_count 3 and has_more false"
            - "${page2_first} == ${t3}"
            - "the status-filtered response has 2 items, total_count 2 and has_more false"
            - "${active_first} == ${t1}"
            - "${page1_first} == ${t1}"

      - name: corner_service_visit_get_with_unknown_uuid_returns_visit_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_service_visits_visit_id
          - errors[ERR_VISIT_NOT_FOUND]
          - validations.priority_4_ERR_ACCOUNT_NOT_FOUND
        distinguishing_aspect: |
          A syntactically valid UUID that names no row returns 404 with
          ERR_VISIT_NOT_FOUND - the per-entity not-found code, not the generic
          account one - and the error envelope carries error_id and message
          under data.
        test_recipe:
          setup:
            - "Empty database except the logical clock."
          setup_api_calls:
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
          trigger:
            - call: "GET /draft-service/service-visits/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "GET /draft-service/service-visits/{unknown} returns HTTP 404"
            - "${err} == ERR_VISIT_NOT_FOUND"
            - "${msg} is a non-empty string"
            - "the response has response_type == error"

      - name: corner_contract_create_without_per_line_rate_is_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.ServiceContract.fields.per_line_rate_cents
          - endpoints.POST_contracts
          - validations.priority_5_ERR_INVALID_REQUEST
        distinguishing_aspect: |
          per_line_rate_cents has source input and no default, so omitting it is
          a 400 ERR_INVALID_REQUEST at priority 5 - ahead of every business rule,
          including the OCC check at priority 10, which is why the omission is
          reported even though the request also carries a stale version token.
        test_recipe:
          setup:
            - "One ACTIVE ServiceAccount at version 1."
          setup_api_calls:
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/accounts"
              payload: { venue_name: "Missing Field Inn", access_window_start_minute: 480, access_window_end_minute: 1080, glycol_system_present: false }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { acct: $.data.id, acct_v: $.data.version }
          trigger:
            - call: "POST /draft-service/contracts"
              payload: { account_id: "${acct}", cleaning_frequency_days: 21, contracted_line_count: 4, visit_base_fee_cents: 7500, effective_from: "2026-08-01T00:00:00Z", expected_account_version: "${acct_v}" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { err: $.data.error_id }
          assert:
            - "POST /draft-service/contracts returns HTTP 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "ServiceAccount.${acct}.version == 1 - the rejected create did not bump the parent version"
            - "GET /draft-service/contracts?account_id=${acct} returns 0 rows"

      - name: corner_optional_inputs_fall_back_to_their_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Technician.fields.caustic_certified
          - entities.Technician.fields.status
          - entities.ServiceAccount.fields.glycol_system_present
          - entities.PartCatalogItem.fields.brewer_funded_eligible
          - endpoints.POST_technicians
          - endpoints.POST_parts
        distinguishing_aspect: |
          Three creates omit every optional input at once: the technician comes
          back caustic_certified false and status ACTIVE, the account comes back
          glycol_system_present false AND with no cascaded GlycolLoop (the
          absence of the child is the observable consequence of the default), and
          the part comes back brewer_funded_eligible false.
        test_recipe:
          setup:
            - "Empty database except the logical clock."
          setup_api_calls:
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
          trigger:
            - call: "POST /draft-service/technicians"
              payload: { full_name: "Default Dana", certification_level: "CERTIFIED" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { tech: $.data.id, tech_caustic: $.data.caustic_certified, tech_state: $.data.status }
            - call: "POST /draft-service/accounts"
              payload: { venue_name: "Default Values Pub", access_window_start_minute: 480, access_window_end_minute: 1080 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { acct: $.data.id, acct_glycol: $.data.glycol_system_present }
            - call: "POST /draft-service/parts"
              payload: { sku: "FOB-12", component_type: "FOB", unit_price_cents: 890, stock_on_hand: 4 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { part: $.data.id, part_funded: $.data.brewer_funded_eligible }
            - call: "GET /draft-service/glycol-loops"
              payload: { account_id: "${acct}" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
          assert:
            - "${tech_caustic} == false"
            - "${tech_state} == ACTIVE"
            - "${acct_glycol} == false"
            - "${part_funded} == false"
            - "GET /draft-service/glycol-loops?account_id=${acct} returns 0 rows with total_count 0"
            - "Technician.${tech}.certification_level == CERTIFIED"
            - "PartCatalogItem.${part}.stock_on_hand == 4"

      - name: corner_computed_frequency_multiplier_is_derived_and_an_extra_field_is_rejected
        claim_type: Computed Fields
        grounds:
          - entities.ServiceContract.fields.frequency_multiplier
          - entities.ServiceContract.fields.funding_status
          - endpoints.POST_contracts
          - validations.priority_5_ERR_INVALID_REQUEST
        distinguishing_aspect: |
          frequency_multiplier is source computed and appears nowhere in the
          endpoint's input:, so a 21-day contract must come back at 1.10 without
          the client saying so, and a request that tries to supply the field is
          refused outright with ERR_INVALID_REQUEST (400) because §1.4 P5 forbids
          unknown body fields - a computed field cannot be steered, not even to
          the value it would have taken. funding_status NONE is proved the same
          way: it is derived from the absent brewer_program_id.
        test_recipe:
          setup:
            - "One ACTIVE ServiceAccount at version 1."
          setup_api_calls:
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/accounts"
              payload: { venue_name: "Derived Fields Hall", access_window_start_minute: 480, access_window_end_minute: 1080, glycol_system_present: false }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { acct: $.data.id, acct_v: $.data.version }
          trigger:
            - call: "POST /draft-service/contracts"
              payload: { account_id: "${acct}", cleaning_frequency_days: 21, contracted_line_count: 4, per_line_rate_cents: 4175, visit_base_fee_cents: 7500, effective_from: "2026-08-01T00:00:00Z", expected_account_version: "${acct_v}" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { ctr: $.data.id, mult: $.data.frequency_multiplier, funding: $.data.funding_status }
            - call: "GET /draft-service/accounts/${acct}"
              payload: {}
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { acct_v2: $.data.version }
            - call: "POST /draft-service/contracts"
              payload: { account_id: "${acct}", cleaning_frequency_days: 21, contracted_line_count: 4, per_line_rate_cents: 4175, visit_base_fee_cents: 7500, effective_from: "2026-08-01T00:00:00Z", expected_account_version: "${acct_v2}", frequency_multiplier: 9.99 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { err: $.data.error_id }
          assert:
            - "${mult} == 1.10"
            - "${funding} == NONE"
            - "ServiceContract.${ctr}.status == DRAFT"
            - "${acct_v2} == 2 - the accepted create bumped the parent version"
            - "the second POST /draft-service/contracts returns HTTP 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /draft-service/contracts?account_id=${acct} returns exactly 1 row"

      - name: corner_system_fields_are_server_minted_and_client_values_are_invalid_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Technician
          - endpoints.POST_technicians
          - validations.priority_5_ERR_INVALID_REQUEST
        distinguishing_aspect: |
          id / created_at / updated_at / version are minted by the server: the
          accepted create returns a bare UUID with no type prefix, version 1 and
          created_at == updated_at, while an attempt to dictate id is rejected as
          an unknown body field. The id is therefore never client-controllable
          and can never participate in a business decision.
        test_recipe:
          setup:
            - "Empty database except the logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
          trigger:
            - call: "POST /draft-service/technicians"
              payload: { full_name: "Server Minted", certification_level: "MASTER", caustic_certified: true, status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { tech: $.data.id, tech_v: $.data.version, made_at: $.data.created_at }
            - call: "POST /draft-service/technicians"
              payload: { full_name: "Client Minted", certification_level: "MASTER", caustic_certified: true, status: "ACTIVE", id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { err: $.data.error_id }
          assert:
            - "${tech_v} == 1"
            - "${tech} is a bare UUID with no type prefix"
            - "${made_at} is ISO 8601 UTC with three fractional digits"
            - "Technician.${tech}.updated_at == ${made_at} on a freshly created row"
            - "the second POST /draft-service/technicians returns HTTP 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /draft-service/technicians?limit=10&offset=0 returns total_count 1"

      - name: corner_out_of_enum_bore_and_inverted_access_window_are_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.BeerLine.fields.inner_diameter_inches
          - entities.ServiceAccount.fields.access_window_end_minute
          - validations.priority_5_ERR_INVALID_REQUEST
          - endpoints.POST_beer_lines
          - endpoints.POST_accounts
        distinguishing_aspect: |
          Two different shapes of type constraint on two endpoints: a numeric
          enum (inner_diameter_inches must be one of 0.1875 / 0.25 / 0.375, so
          0.5 is refused even though it is a plausible bore) and a cross-field
          range (access_window_end_minute must exceed access_window_start_minute,
          so 1080/480 inverted is refused). Both are P5, both 400, and neither
          leaves a row behind.
        test_recipe:
          setup:
            - "One ACTIVE ServiceAccount with an ACTIVE contract (contracted_line_count 4)."
          setup_api_calls:
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/accounts"
              payload: { venue_name: "Type Guard Taproom", access_window_start_minute: 480, access_window_end_minute: 1080, glycol_system_present: false }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { acct: $.data.id, acct_v: $.data.version }
            - call: "POST /draft-service/contracts"
              payload: { account_id: "${acct}", cleaning_frequency_days: 21, contracted_line_count: 4, per_line_rate_cents: 4175, visit_base_fee_cents: 7500, effective_from: "2026-08-01T00:00:00Z", expected_account_version: "${acct_v}" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { ctr: $.data.id }
            - call: "POST /draft-service/contracts/${ctr}/status"
              payload: { to_status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
          trigger:
            - call: "POST /draft-service/beer-lines"
              payload: { account_id: "${acct}", line_number: 1, run_length_feet: 32, vertical_rise_feet: 4, inner_diameter_inches: 0.5, beer_style_group: "ALE", average_daily_throughput_liters: 12.0 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { err_bore: $.data.error_id }
            - call: "POST /draft-service/accounts"
              payload: { venue_name: "Inverted Window Bar", access_window_start_minute: 1080, access_window_end_minute: 480, glycol_system_present: false }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { err_window: $.data.error_id }
            - call: "POST /draft-service/beer-lines"
              payload: { account_id: "${acct}", line_number: 1, run_length_feet: 32, vertical_rise_feet: 4, inner_diameter_inches: 0.375, beer_style_group: "ALE", average_daily_throughput_liters: 12.0 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { line_ok: $.data.id }
          assert:
            - "the first POST /draft-service/beer-lines returns HTTP 400"
            - "${err_bore} == ERR_INVALID_REQUEST"
            - "the POST /draft-service/accounts with an inverted window returns HTTP 400"
            - "${err_window} == ERR_INVALID_REQUEST"
            - "the third call returns HTTP 201 with the same line_number 1 - the rejected create reserved nothing"
            - "BeerLine.${line_ok}.inner_diameter_inches == 0.375"
            - "GET /draft-service/beer-lines?account_id=${acct} returns exactly 1 row"

      - name: corner_cooler_reading_is_immutable_with_no_version_and_no_update_endpoint
        claim_type: Immutability
        grounds:
          - entities.CoolerReading
          - endpoints.POST_cooler_readings
          - endpoints.GET_cooler_readings_reading_id
        distinguishing_aspect: |
          CoolerReading declares common_fields: false, so the stored row exposes
          id and created_at only - no version and no updated_at - and §1.5
          publishes no update or delete path for it. A logged reading can
          therefore only be superseded by posting a newer one, which is exactly
          why the glycol score is a window over the newest READING_WINDOW rows
          rather than a mutable field.
        test_recipe:
          setup:
            - "One ACTIVE ServiceAccount created with glycol_system_present true, which cascade-creates its GlycolLoop."
            - "One ACTIVE Technician."
          setup_api_calls:
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/accounts"
              payload: { venue_name: "Immutable Readings Inn", access_window_start_minute: 480, access_window_end_minute: 1080, glycol_system_present: true }
              as: DispatchCoordinator
