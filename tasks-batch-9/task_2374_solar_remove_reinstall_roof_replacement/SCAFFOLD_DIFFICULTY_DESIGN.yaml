              as: SolarContractor
              as_user_id: "${crew_id}"
            - call: "GET /reroof/projects/${proj_id}"
              as: ProjectCoordinator
              captures: { proj_v_a: $.data.version }
            - call: "POST /reroof/sourcing-orders"
              payload: { project_id: "${proj_id}", hardware_unit_id: "${u_dmg1}", requested_model_code: "MS-410", offered_manufacturer: "Meridian Solar", offered_model_code: "MS-412", offered_rated_watts: 412, unit_cost_cents: 30500, expected_project_version: "${proj_v_a}" }
              as: ProjectCoordinator
              captures: { o1: $.data.id }
