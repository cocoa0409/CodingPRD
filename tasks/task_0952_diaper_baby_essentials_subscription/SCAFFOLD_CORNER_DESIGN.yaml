              as: OpsAdmin
              captures: { sku_std: $.data.id }
            - call: "POST /accounts"
              payload: { email: "expcred@example.com", full_name: "Expired Credit", payment_method_on_file: true }
              as: Anonymous
              captures: { acct_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /accounts/${acct_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /credits"
              payload: { account_id: "${acct_id}", issued_cents: 5000 }
              as: SupportAgent
              as_user_id: "cs-1"
              captures: { credit_id: $.data.id, exp: $.data.expires_at }
            - call: "POST /children"
              payload: { account_id: "${acct_id}", name: "Rin", birth_date: "2025-11-01", weight_grams: 7000 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { child_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acct_id}", plan_id: "${plan_id}", child_id: "${child_id}", consumption_rate_per_day: 6, pack_count: 2 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "POST /subscriptions/${sub_id}/cycles"
              payload: {}
              as: OpsAdmin
              captures: { c1: $.data.id }
            - call: "POST /cycles/${c1}/allocate"
              payload: {}
              as: OpsAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-02T00:00:00Z" }
              as: OpsAdmin
          trigger:
            - call: "POST /cycles/${c1}/charge"
              payload: { credit_ids: ["${credit_id}"] }
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${exp} == 2027-06-01T00:00:00.000Z"
            - "${err} == ERR_CREDIT_EXPIRED"
            - "HTTP status is 409"
            - "Cycle.${c1}.payment_status == UNCHARGED"
            - "Credit.${credit_id}.consumed_cents == 0"

  # =======================================================================
  # RBAC
  # =======================================================================
  - section: rbac
    instances:
      - name: corner_request_without_role_header_is_unauthenticated
        claim_type: role_denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A GET /accounts/{id} sent with NO X-User-Role and NO X-User-ID header returns ERR_UNAUTHENTICATED (401) at rung 1, before any existence check runs."
        test_recipe:
          setup: ["One verified account exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /accounts"
              payload: { email: "noauth@example.com", full_name: "No Auth" }
              as: Anonymous
              captures: { acct_id: $.data.id }
          trigger:
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: AccountHolder
              captures: { err: $.data.error_id }
          assert:
            - "the request is sent with both X-User-Role and X-User-ID headers omitted entirely"
            - "${err} == ERR_UNAUTHENTICATED"
            - "HTTP status is 401"

      - name: corner_unknown_role_header_value_rejected
        claim_type: role_denial
        grounds: ["validations[priority=2]", "errors[ERR_UNKNOWN_ROLE]"]
        distinguishing_aspect: "A request whose X-User-Role header carries the literal string Wizard — a value outside the six declared roles — returns ERR_UNKNOWN_ROLE (401) at rung 2, distinct from the rung-5 ERR_FORBIDDEN_ROLE given to a known-but-unpermitted role."
        test_recipe:
          setup: ["One verified account exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /accounts"
              payload: { email: "wizard@example.com", full_name: "Wizard Household" }
              as: Anonymous
              captures: { acct_id: $.data.id }
          trigger:
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the request is sent with X-User-Role literally set to Wizard, overriding the declared role"
            - "${err} == ERR_UNKNOWN_ROLE"
            - "HTTP status is 401"

      - name: corner_support_agent_cannot_allocate_a_cycle
        claim_type: role_denial
        grounds: ["validations[priority=5]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "SupportAgent is a declared role but is absent from the roles list of POST /cycles/{id}/allocate, and the endpoint is neither Pipeline-R-for-a-GiftPurchaser nor a catalog write, so the generic rung 5 fires with ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["One ACTIVE subscription with its first cycle generated but not allocated."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
