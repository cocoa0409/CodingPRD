  # --- Sites ---
  - { method: POST, path: "/sites", description: "Create site", roles: [IntegratorAdmin], code: 201, input: [name, state_code, county], output: Site, side_effects: ["site_status=ACTIVE"] }
  - { method: GET, path: "/sites", description: "List sites (paginated)", roles: [IntegratorAdmin, FieldTech, Grower, FeedMill, TransportCoordinator, EnvironmentalManager], code: 200, input: ["site_status?", "limit?", "offset?"], output: "Site[]", side_effects: [] }
  - { method: GET, path: "/sites/{id}", description: "Get site", roles: [IntegratorAdmin, FieldTech, Grower, FeedMill, TransportCoordinator, EnvironmentalManager], code: 200, input: [], output: Site, side_effects: [] }
  - { method: POST, path: "/sites/{id}/suspend", description: "Suspend site", roles: [IntegratorAdmin], code: 200, input: [], output: Site, side_effects: ["site_status -> SUSPENDED"] }
  - { method: POST, path: "/sites/{id}/reinstate", description: "Reinstate site", roles: [IntegratorAdmin], code: 200, input: [], output: Site, side_effects: ["site_status -> ACTIVE"] }
  - { method: POST, path: "/sites/{id}/decommission", description: "Decommission site (terminal)", roles: [IntegratorAdmin], code: 200, input: [], output: Site, side_effects: ["site_status -> DECOMMISSIONED"] }

  # --- Growers ---
