# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-ID / X-User-Role headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist or is not nested under the parent id" }
  - { id: ERR_VALIDATION, http: 400, condition: "Required field missing, enum invalid, format invalid, sample_messages not 1-5, body not 1-1600 chars" }
  - { id: ERR_ACCOUNT_SUSPENDED, http: 409, condition: "Mutating endpoint attempted while account SUSPENDED" }
  - { id: ERR_ACCOUNT_CLOSED, http: 409, condition: "Any operation on a CLOSED account other than reads" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a valid from-state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_campaign_version does not match current Campaign.version on OCC-guarded writes" }
  - { id: ERR_BRAND_SCORE_TOO_LOW, http: 409, condition: "Brand verify attempted with identity_score < 60" }
  - { id: ERR_BRAND_NOT_VERIFIED, http: 409, condition: "Campaign submit/reactivate attempted while brand not VERIFIED" }
  - { id: ERR_BRAND_REVOKED, http: 409, condition: "Operation attempted on a REVOKED brand" }
  - { id: ERR_TOLLFREE_VETTING_INSUFFICIENT, http: 409, condition: "TOLL_FREE campaign submit with brand identity_score < 75" }
  - { id: ERR_SHORT_CODE_GEO, http: 422, condition: "SHORT_CODE path or number on non-US account, or account tier not PREMIUM" }
  - { id: ERR_SHORT_CODE_USE_CASE, http: 409, condition: "SHORT_CODE campaign with use_case other than MARKETING" }
  - { id: ERR_CAMPAIGN_RESUBMISSION_LIMIT, http: 409, condition: "Campaign resubmit when rejected_cycle_count >= 3" }
  - { id: ERR_CAMPAIGN_NOT_APPROVED, http: 409, condition: "Send/retry/attach-family operation requiring APPROVED campaign attempted otherwise" }
  - { id: ERR_CAMPAIGN_NOT_DEACTIVATABLE, http: 409, condition: "Deactivate attempted while an ACTIVE number is attached" }
  - { id: ERR_NUMBER_NOT_ATTACHED, http: 409, condition: "Send attempted with sender number not attached to the campaign" }
  - { id: ERR_NUMBER_TYPE_OCCUPIED, http: 409, condition: "Attach would give the campaign two ACTIVE numbers of the same number_type" }
  - { id: ERR_PORT_REQUIREMENTS, http: 422, condition: "PORT_IN number missing port_phone_number / port_letter_of_agency / port_losing_carrier, or country mismatch" }
  - { id: ERR_NO_CONSENT, http: 409, condition: "Send/retry to a recipient with no ACTIVE ConsentRecord for the campaign's brand" }
  - { id: ERR_THROUGHPUT_EXCEEDED, http: 429, condition: "Send/retry would meet or exceed campaign.allocated_mps within the trailing 1 second" }
  - { id: ERR_RECIPIENT_BUSY, http: 409, condition: "Recipient already has a QUEUED in-flight message from this campaign" }
  - { id: ERR_MESSAGE_NOT_RETRYABLE, http: 409, condition: "Retry attempted on FAILED message whose error_code is not in RETRYABLE_ERROR_CODES {E30034, E30007}" }
  - { id: ERR_FEE_SCHEDULE, http: 422, condition: "Internal fee schedule inconsistency detected during run_ops (no client action possible)" }
  - { id: ERR_REJECTION_REASON_INVALID, http: 400, condition: "reject called with rejection_reason_code outside REJECTION_REASON_CODES {CONTENT_VIOLATION, MISSING_CONSENT_FLOW, BRAND_MISMATCH, SAMPLE_MESSAGE_INSUFFICIENT}" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; owns accounts, ops runs, clock, and number order exceptions"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /messaging/accounts"
      - "POST /messaging/accounts/{id}/run_ops"
      - "POST /messaging/accounts/{id}/close"
    shared_operations: ["all GET endpoints", "create brand/campaign/number (co-owner)"]
  - name: BrandManager
    description: "Customer-side operator managing brand identity and consent evidence"
    identity: opaque
    exclusive_operations:
      - "POST brands/{id}/submit"
      - "POST consent_records (with CampaignManager)"
      - "POST consent_records/{id}/revoke (with ComplianceOfficer)"
    shared_operations: ["GET brand/campaign/consent resources"]
  - name: CampaignManager
    description: "Customer-side operator managing campaigns, sends, and retries"
    identity: opaque
    exclusive_operations:
      - "POST campaigns/{id}/submit, deactivate"
      - "POST messages, messages/{id}/retry, messages/{id}/cancel"
    shared_operations: ["GET campaign/message/charge resources", "POST consent_records"]
  - name: CarrierReviewer
    description: "Carrier-side reviewer approving/rejecting brands and campaigns"
    identity: opaque
    exclusive_operations:
      - "POST brands/{id}/verify, fail"
      - "POST campaigns/{id}/approve, reject"
    shared_operations: ["GET resources for review"]
  - name: NumberProvisioner
    description: "Operator provisioning, porting, attaching, releasing numbers"
    identity: opaque
    exclusive_operations:
      - "POST numbers (with PlatformAdmin)"
      - "POST numbers/{id}/activate, complete_port, fail_port, attach, detach, reinstate, release"
    shared_operations: ["GET number/campaign resources"]
  - name: ComplianceOfficer
    description: "Compliance operator; suspends/reinstates accounts and campaigns, revokes brands and consent"
    identity: opaque
    exclusive_operations:
      - "POST accounts/{id}/suspend, reinstate"
      - "POST brands/{id}/revoke"
      - "POST campaigns/{id}/suspend, reactivate"
    shared_operations: ["GET all resources", "POST consent_records/{id}/revoke"]
  - name: DeliverabilityAnalyst
    description: "Analyst computing deliverability snapshots"
    identity: opaque
    exclusive_operations:
      - "POST campaigns/{id}/snapshots (with PlatformAdmin)"
