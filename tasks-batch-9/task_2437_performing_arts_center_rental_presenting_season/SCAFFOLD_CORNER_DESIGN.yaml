            - "charges = 700000 facility + round_half_up(1.15 * 40000) = 46000 service + 100000 marketing = 846000, so balance_due_from_client_cents == 846000 - 185000 == 661000."
            - "net_to_center_cents == 806000 (846000 - 40000 labor - 0 equipment) and reserve_contribution_cents == 40300 (0.05 * 806000; the 0.10 band needs net >= 1000000 and no restoration term applies to RENTAL)."
            - "Finalize: 200 with status 'FINALIZED', finalized_by_user_id 'user-fc-1'; engagement.lifecycle_status becomes 'SETTLED' and realized_margin_cents == -140000 (0 realized gross - (0 + 0 + 40000 labor + 0 equipment + 100000 marketing))."
            - "RentalClient.outstanding_balance_cents == 661000 - the balance due was pushed onto the client ledger exactly once."
