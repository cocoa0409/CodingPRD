  # ==================================================================
  # Rule 3: non_linear_state_machine — different entities
  # ==================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: invoice_dispute_resolve_cycle
        grounds:
          - state_machines.Invoice.ISSUED_to_DISPUTED
          - state_machines.Invoice.DISPUTED_to_ISSUED
          - entities.Booking.fields.billing_status
        distinguishing_aspect: |
          Invoice has a cyclic ISSUED -> DISPUTED -> ISSUED loop (negotiation
          rounds between Organizer and PlatformAdmin). Each cycle mutates
          Booking.billing_status INVOICED <-> DISPUTED in lockstep.
          Entity = Invoice. Distinct from TherapistLicense cyclic machine.
        test_recipe:
          setup:
            - "Full pipeline run to an ISSUED Invoice on a COMPLETED Booking"
            - "Booking.billing_status == INVOICED"
          setup_api_calls:
            - { call: "POST /chair-massage/regions", payload: { code: "R0", name: "R0", base_mileage_rate_cents: 120, travel_included_miles: 20, setup_buffer_minutes: 30, teardown_buffer_minutes: 30 }, as: PlatformAdmin, captures: { region_id: "$.data.id" } }
            - { call: "POST /chair-massage/corporate-accounts", payload: { company_name: "ACME", billing_email: "ap@acme.test", region_id: "${region_id}", credit_limit_cents: 100000000 }, as: PlatformAdmin, captures: { acct_id: "$.data.id" } }
            - { call: "POST /chair-massage/therapists", payload: { full_name: "T", email: "t@x", home_region_id: "${region_id}", per_hour_rate_cents: 6000, max_minutes_per_day: 2000 }, as: PlatformAdmin, captures: { t1_id: "$.data.id" } }
            - { call: "POST /chair-massage/therapist-licenses", payload: { therapist_id: "${t1_id}", region_id: "${region_id}", license_number: "L1", issued_on: "2025-01-01", expires_on: "2027-12-31" }, as: PlatformAdmin }
            - { call: "POST /chair-massage/bookings", payload: { corporate_account_id: "${acct_id}", region_id: "${region_id}", site_address: "1 Main", event_date: "2026-06-10", window_start_minutes: 600, window_duration_minutes: 60, chair_count: 1, slot_minutes: 15, per_minute_rate_cents: 200 }, as: Organizer, as_user_id: "${acct_id}", captures: { bk_id: "$.data.id" } }
            - { call: "POST /chair-massage/bookings/${bk_id}/open-scheduling", payload: {}, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "GET /chair-massage/bookings/${bk_id}/chair-slots", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { cs0: "$.data[0].id" } }
            - { call: "POST /chair-massage/chair-slots/${cs0}/assign", payload: { therapist_id: "${t1_id}" }, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "GET /chair-massage/bookings/${bk_id}", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { bk_v: "$.data.version" } }
            - { call: "POST /chair-massage/bookings/${bk_id}/confirm", payload: { expected_booking_version: "${bk_v}" }, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "POST /chair-massage/_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T09:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /chair-massage/chair-slots/${cs0}/depart", payload: {}, as: Therapist, as_user_id: "${t1_id}" }
            - { call: "POST /chair-massage/chair-slots/${cs0}/arrive", payload: {}, as: Therapist, as_user_id: "${t1_id}" }
            - { call: "POST /chair-massage/bookings/${bk_id}/start-service", payload: {}, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "POST /chair-massage/bookings/${bk_id}/complete", payload: {}, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "POST /chair-massage/bookings/${bk_id}/invoices", payload: { pricing_variant: "FINAL" }, as: PlatformAdmin, captures: { inv_id: "$.data.id" } }
            - { call: "POST /chair-massage/invoices/${inv_id}/issue", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /chair-massage/invoices/${inv_id}/dispute", payload: { dispute_reason: "overcharged" }, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "GET /chair-massage/bookings/${bk_id}", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { bk_billing_disputed: "$.data.billing_status" } }
            - { call: "POST /chair-massage/invoices/${inv_id}/resolve-dispute", payload: {}, as: PlatformAdmin }
            - { call: "GET /chair-massage/bookings/${bk_id}", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { bk_billing_resolved: "$.data.billing_status" } }
          assert:
            - "After dispute: Invoice.${inv_id}.status == DISPUTED"
            - "After dispute: Booking.${bk_id}.billing_status == DISPUTED"
            - "After resolve-dispute: Invoice.${inv_id}.status == ISSUED"
            - "After resolve-dispute: Booking.${bk_id}.billing_status == INVOICED"
            - "Cycle can repeat: a second dispute is accepted (assert by issuing dispute again and observing status DISPUTED)"

      - name: therapist_license_suspend_reinstate_cycle
        grounds:
          - state_machines.TherapistLicense.ACTIVE_to_SUSPENDED
          - state_machines.TherapistLicense.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          TherapistLicense has a cyclic ACTIVE -> SUSPENDED -> ACTIVE loop
          driven by compliance review (suspension_reason is populated on the
          down-leg and cleared on the up-leg). Entity = TherapistLicense.
          Distinct from Invoice's dispute cycle.
        test_recipe:
          setup:
            - "Region R0; Therapist T1; TherapistLicense L1 ACTIVE expires_on=2027-12-31"
            - "Logical clock at 2026-06-01 (before expiry)"
          setup_api_calls:
            - { call: "POST /chair-massage/regions", payload: { code: "R0", name: "R0", base_mileage_rate_cents: 120, travel_included_miles: 20, setup_buffer_minutes: 30, teardown_buffer_minutes: 30 }, as: PlatformAdmin, captures: { region_id: "$.data.id" } }
            - { call: "POST /chair-massage/therapists", payload: { full_name: "T", email: "t@x", home_region_id: "${region_id}", per_hour_rate_cents: 6000, max_minutes_per_day: 480 }, as: PlatformAdmin, captures: { t1_id: "$.data.id" } }
            - { call: "POST /chair-massage/therapist-licenses", payload: { therapist_id: "${t1_id}", region_id: "${region_id}", license_number: "L1", issued_on: "2025-01-01", expires_on: "2027-12-31" }, as: PlatformAdmin, captures: { lic_id: "$.data.id" } }
            - { call: "POST /chair-massage/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /chair-massage/therapist-licenses/${lic_id}/suspend", payload: { reason: "audit flag" }, as: PlatformAdmin, captures: { st1: "$.data.status", rsn1: "$.data.suspension_reason" } }
            - { call: "POST /chair-massage/therapist-licenses/${lic_id}/reinstate", payload: {}, as: PlatformAdmin, captures: { st2: "$.data.status", rsn2: "$.data.suspension_reason" } }
            - { call: "POST /chair-massage/therapist-licenses/${lic_id}/suspend", payload: { reason: "second flag" }, as: PlatformAdmin, captures: { st3: "$.data.status", rsn3: "$.data.suspension_reason" } }
          assert:
            - "First suspend: status == SUSPENDED, suspension_reason == 'audit flag'"
            - "Reinstate: status == ACTIVE, suspension_reason == ''"
            - "Second suspend succeeds (cycle repeats): status == SUSPENDED, suspension_reason == 'second flag'"

  # ==================================================================
  # Rule 4: transitive_cascade — different triggers, depth >= 3 and >= 2
  # ==================================================================
  - rule_id: transitive_cascade
    instances:
      - name: license_revoke_cascades_chair_release_and_booking_minutes
        grounds:
          - state_machines.TherapistLicense.ACTIVE_to_REVOKED
          - state_machines.ChairSlot.ASSIGNED_to_RELEASED
          - entities.Booking.fields.booked_chair_minutes
        distinguishing_aspect: |
          Depth-3 cascade triggered by TherapistLicense revocation:
          license revoke -> ChairSlot(s) RELEASED -> therapist daily tally
          decremented AND Booking.version bumped via ledger-sync. Each link
          caused by the previous one. Trigger = license revoke.
        test_recipe:
          setup:
            - "Region R0, ACME account, Therapist T1 ACTIVE with license L1 ACTIVE in R0 (expires 2027-12-31)"
            - "Booking B1 EVENT on 2026-06-10 in SCHEDULING with chair cs0 ASSIGNED to T1"
            - "cs0 has 2 CLAIMED SlotClaims (booked_chair_minutes = 30)"
          setup_api_calls:
            - { call: "POST /chair-massage/regions", payload: { code: "R0", name: "R0", base_mileage_rate_cents: 120, travel_included_miles: 20, setup_buffer_minutes: 30, teardown_buffer_minutes: 30 }, as: PlatformAdmin, captures: { region_id: "$.data.id" } }
            - { call: "POST /chair-massage/corporate-accounts", payload: { company_name: "ACME", billing_email: "a@x", region_id: "${region_id}", credit_limit_cents: 100000000 }, as: PlatformAdmin, captures: { acct_id: "$.data.id" } }
            - { call: "POST /chair-massage/therapists", payload: { full_name: "T", email: "t@x", home_region_id: "${region_id}", per_hour_rate_cents: 6000, max_minutes_per_day: 480 }, as: PlatformAdmin, captures: { t1_id: "$.data.id" } }
            - { call: "POST /chair-massage/therapist-licenses", payload: { therapist_id: "${t1_id}", region_id: "${region_id}", license_number: "L1", issued_on: "2025-01-01", expires_on: "2027-12-31" }, as: PlatformAdmin, captures: { lic_id: "$.data.id" } }
            - { call: "POST /chair-massage/bookings", payload: { corporate_account_id: "${acct_id}", region_id: "${region_id}", site_address: "1 Main", event_date: "2026-06-10", window_start_minutes: 600, window_duration_minutes: 120, chair_count: 1, slot_minutes: 15, per_minute_rate_cents: 200 }, as: Organizer, as_user_id: "${acct_id}", captures: { bk_id: "$.data.id" } }
            - { call: "POST /chair-massage/bookings/${bk_id}/open-scheduling", payload: {}, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "GET /chair-massage/bookings/${bk_id}/chair-slots", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { cs0: "$.data[0].id" } }
            - { call: "POST /chair-massage/chair-slots/${cs0}/assign", payload: { therapist_id: "${t1_id}" }, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "GET /chair-massage/chair-slots/${cs0}", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { cs_v_cur: "$.data.version" } }
            - { call: "POST /chair-massage/chair-slots/${cs0}/claims", payload: { recipient_name: "R1", recipient_email: "r1@x", expected_chair_slot_version: "${cs_v_cur}" }, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "GET /chair-massage/chair-slots/${cs0}", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { cs_v_cur: "$.data.version" } }
            - { call: "POST /chair-massage/chair-slots/${cs0}/claims", payload: { recipient_name: "R2", recipient_email: "r2@x", expected_chair_slot_version: "${cs_v_cur}" }, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "GET /chair-massage/bookings/${bk_id}", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { bk_v_pre: "$.data.version", bk_minutes_pre: "$.data.booked_chair_minutes" } }
          trigger:
            - { call: "POST /chair-massage/therapist-licenses/${lic_id}/revoke", payload: {}, as: PlatformAdmin }
            - { call: "GET /chair-massage/chair-slots/${cs0}", payload: {}, as: PlatformAdmin, captures: { cs_status: "$.data.status" } }
            - { call: "GET /chair-massage/bookings/${bk_id}", payload: {}, as: PlatformAdmin, captures: { bk_v_post: "$.data.version", bk_minutes_post: "$.data.booked_chair_minutes" } }
          assert:
            - "TherapistLicense.${lic_id}.status == REVOKED"
            - "ChairSlot.${cs0}.status == RELEASED (cascaded by revoke)"
            - "Booking.${bk_id}.booked_chair_minutes after cascade == 0 (both CLAIMED claims became CANCELLED via cascade when their chair released)"
            - "Booking.${bk_id}.version advanced (ledger-sync from ChairSlot release)"

      - name: corporate_suspend_cascades_program_pause
        grounds:
          - state_machines.CorporateAccount.ACTIVE_to_SUSPENDED
          - state_machines.WellnessProgram.ACTIVE_to_PAUSED
        distinguishing_aspect: |
          Depth-2 cascade triggered by CorporateAccount suspend:
          account suspend -> all its ACTIVE WellnessPrograms -> PAUSED.
          Distinct trigger from the license-revoke cascade.
        test_recipe:
          setup:
            - "Region R0, CorporateAccount ACME ACTIVE"
            - "WellnessProgram P1 ACTIVE (WEEKLY) and WellnessProgram P2 ACTIVE (MONTHLY) both owned by ACME"
            - "Both have non-null next_occurrence_date"
          setup_api_calls:
            - { call: "POST /chair-massage/regions", payload: { code: "R0", name: "R0", base_mileage_rate_cents: 120, travel_included_miles: 20, setup_buffer_minutes: 30, teardown_buffer_minutes: 30 }, as: PlatformAdmin, captures: { region_id: "$.data.id" } }
