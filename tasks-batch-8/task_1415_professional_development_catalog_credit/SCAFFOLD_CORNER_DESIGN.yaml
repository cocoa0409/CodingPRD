        payload:
          offset: 10
        as: PDCoordinator
      assert:
      - 'First call: data length == 10 (default limit), total_count == 11, has_more == true, offset == 0'
      - 'Second call: data length == 1, has_more == false'
- section: state_machines
  instances:
  - name: publish_canceled_section_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.Section.CANCELED
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: CANCELED is terminal; POST /pd/sections/{id}/publish from CANCELED -> 400 ERR_INVALID_STATE, no side effects.
    test_recipe:
      setup:
      - Building B1; instructor INS1; course C1; section S1 published with meeting then canceled
      setup_api_calls:
      - call: POST /pd/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: PDCoordinator
      - call: POST /pd/buildings
        payload:
          name: SM Bldg
          building_code: SM1
        as: PDCoordinator
        captures:
          b1: $.data.id
      - call: POST /pd/employees
        payload:
          full_name: I SM
          email: ism@x.com
          employee_kind: SPECIALIST
          primary_building_id: ${b1}
          base_lane: MA
        as: PDCoordinator
        captures:
          ins1: $.data.id
      - call: POST /pd/courses
        payload:
          course_code: SM-1
          title: SM Course
          delivery_mode: IN_PERSON
          clock_hours: 5
          fee_cents: 0
        as: PDCoordinator
        captures:
          c1: $.data.id
      - call: POST /pd/sections
        payload:
          course_id: ${c1}
          term: 2026-FALL
          instructor_id: ${ins1}
          building_id: ${b1}
          room: R1
          seat_capacity: 5
          starts_at: '2026-08-15T09:00:00Z'
          ends_at: '2026-08-20T17:00:00Z'
          registration_opens_at: '2026-08-01T00:00:00Z'
          registration_closes_at: '2026-08-10T00:00:00Z'
        as: PDCoordinator
        captures:
          s1: $.data.id
      - call: POST /pd/sections/${s1}/meetings
        payload:
          starts_at: '2026-08-15T10:00:00Z'
          ends_at: '2026-08-15T12:00:00Z'
          room: R1
        as: PDCoordinator
      - call: POST /pd/sections/${s1}/publish
        payload: {}
        as: PDCoordinator
      - call: POST /pd/sections/${s1}/cancel
        payload: {}
        as: PDCoordinator
      trigger:
      - call: POST /pd/sections/${s1}/publish
        payload: {}
        as: PDCoordinator
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_STATE (terminal CANCELED accepts no transitions)
  - name: drop_completed_registration_rejected
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.Registration.COMPLETED
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: COMPLETED is terminal; POST /pd/registrations/{id}/drop after completion -> 400 ERR_INVALID_STATE.
    test_recipe:
      setup:
      - 'Full completion: T1 REGISTERED in S1 (fee 0, meeting M1), attendance VERIFIED, survey WAIVED, clock 2026-08-16, ops-run -> IN_SESSION, complete -> COMPLETED'
      setup_api_calls:
      - call: POST /pd/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: PDCoordinator
      - call: POST /pd/buildings
        payload:
          name: TL Bldg
          building_code: TL1
        as: PDCoordinator
        captures:
          b1: $.data.id
      - call: POST /pd/employees
        payload:
          full_name: T TL
          email: ttl@x.com
          employee_kind: TEACHER
          primary_building_id: ${b1}
          base_lane: BA
        as: PDCoordinator
        captures:
          t1: $.data.id
      - call: POST /pd/employees
        payload:
          full_name: I TL
          email: itl@x.com
          employee_kind: SPECIALIST
          primary_building_id: ${b1}
          base_lane: MA
        as: PDCoordinator
        captures:
          ins1: $.data.id
      - call: POST /pd/courses
        payload:
          course_code: TL-1
          title: TL Course
          delivery_mode: IN_PERSON
          clock_hours: 5
          fee_cents: 0
        as: PDCoordinator
        captures:
          c1: $.data.id
      - call: POST /pd/sections
        payload:
          course_id: ${c1}
          term: 2026-FALL
          instructor_id: ${ins1}
          building_id: ${b1}
          room: R1
          seat_capacity: 5
          starts_at: '2026-08-15T09:00:00Z'
          ends_at: '2026-08-20T17:00:00Z'
          registration_opens_at: '2026-08-01T00:00:00Z'
          registration_closes_at: '2026-08-10T00:00:00Z'
        as: PDCoordinator
        captures:
          s1: $.data.id
      - call: POST /pd/sections/${s1}/meetings
        payload:
          starts_at: '2026-08-15T10:00:00Z'
          ends_at: '2026-08-15T12:00:00Z'
          room: R1
        as: PDCoordinator
        captures:
          m1: $.data.id
      - call: POST /pd/sections/${s1}/publish
        payload: {}
        as: PDCoordinator
      - call: POST /pd/registrations
        payload:
          teacher_id: ${t1}
          section_id: ${s1}
        as: Teacher
        as_user_id: ${t1}
        captures:
          r1: $.data.id
      - call: POST /pd/meetings/${m1}/attendance
        payload:
          records:
          - registration_id: ${r1}
            mark: PRESENT
        as: Instructor
        as_user_id: ${ins1}
      - call: POST /pd/registrations/${r1}/verify-attendance
        payload: {}
        as: Instructor
        as_user_id: ${ins1}
      - call: POST /pd/registrations/${r1}/waive-survey
        payload:
          reason: w
        as: PDCoordinator
      - call: POST /pd/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-16T00:00:00Z'
        as: PDCoordinator
      - call: POST /pd/ops-runs
        payload: {}
        as: PDCoordinator
      - call: POST /pd/registrations/${r1}/complete
        payload: {}
        as: PDCoordinator
        captures:
          fin: $.data.status
      trigger:
      - call: POST /pd/registrations/${r1}/drop
        payload: {}
        as: Teacher
        as_user_id: ${t1}
        captures:
          err: $.data.error_id
      assert:
      - Registration reached COMPLETED (captured ${fin})
      - error_id == ERR_INVALID_STATE on drop from COMPLETED
  - name: approve_approved_workshop_rejected
    claim_type: idempotency
    grounds:
    - state_machines.ExternalWorkshopRequest.SUBMITTED_to_APPROVED
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: Second approve on an already-APPROVED workshop -> 400 ERR_INVALID_STATE; encumbrance applied exactly once.
    test_recipe:
      setup:
      - Building B1 budget 500000 OPEN; teacher T1; admin ADM1 (B1); workshop est 30000 starts 2026-12-01, submitted and APPROVED
      setup_api_calls:
      - call: POST /pd/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: PDCoordinator
      - call: POST /pd/buildings
        payload:
          name: ID Bldg
          building_code: ID1
        as: PDCoordinator
        captures:
          b1: $.data.id
      - call: POST /pd/budgets
        payload:
          building_id: ${b1}
          fiscal_year: 2026
          allocated_cents: 500000
        as: BusinessOfficer
        captures:
          bud1: $.data.id
      - call: POST /pd/budgets/${bud1}/open
        payload: {}
        as: BusinessOfficer
      - call: POST /pd/employees
        payload:
          full_name: T ID
          email: tid@x.com
          employee_kind: TEACHER
          primary_building_id: ${b1}
          base_lane: BA
        as: PDCoordinator
        captures:
          t1: $.data.id
      - call: POST /pd/employees
        payload:
          full_name: A ID
          email: aid@x.com
          employee_kind: ADMIN
          primary_building_id: ${b1}
          base_lane: DOC
        as: PDCoordinator
        captures:
          adm1: $.data.id
      - call: POST /pd/workshop-requests
        payload:
          teacher_id: ${t1}
          title: W ID
          provider: P
          starts_at: '2026-12-01T09:00:00Z'
          ends_at: '2026-12-02T17:00:00Z'
          est_cost_cents: 30000
          clock_hours_claimed: 8
        as: Teacher
        as_user_id: ${t1}
        captures:
          w1: $.data.id
      - call: POST /pd/workshop-requests/${w1}/submit
        payload: {}
        as: Teacher
        as_user_id: ${t1}
      - call: POST /pd/workshop-requests/${w1}/approve
        payload: {}
        as: BuildingAdmin
        as_user_id: ${adm1}
        captures:
          st1: $.data.status
      trigger:
      - call: POST /pd/workshop-requests/${w1}/approve
        payload: {}
        as: BuildingAdmin
        as_user_id: ${adm1}
        captures:
          err: $.data.error_id
      - call: GET /pd/budgets/${bud1}
        payload: {}
        as: PDCoordinator
        captures:
          enc: $.data.encumbered_cents
      assert:
      - First approve succeeded (status APPROVED)
      - Second approve -> ERR_INVALID_STATE
      - budget.encumbered_cents == 30000 exactly once (no double encumbrance)
  - name: ops_run_section_window_transitions
    claim_type: valid_transition
    grounds:
    - state_machines.Section.PUBLISHED_to_REGISTRATION_CLOSED
    - state_machines.Section.REGISTRATION_CLOSED_to_IN_SESSION
    - state_machines.Section.IN_SESSION_to_COMPLETED
    - calculations.ops_run_sweep
    distinguishing_aspect: One ops-run with the clock past ends_at walks a PUBLISHED section through REGISTRATION_CLOSED and IN_SESSION to COMPLETED in a single sweep (multi-step, pinned order).
    test_recipe:
      setup:
      - Section S1 PUBLISHED (std dates, one meeting); clock 2026-08-21T00:00:00Z (> ends_at 2026-08-20T17:00)
      setup_api_calls:
      - call: POST /pd/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: PDCoordinator
      - call: POST /pd/buildings
        payload:
          name: OP Bldg
          building_code: OP1
        as: PDCoordinator
        captures:
          b1: $.data.id
      - call: POST /pd/employees
        payload:
          full_name: I OP
          email: iop@x.com
          employee_kind: SPECIALIST
          primary_building_id: ${b1}
          base_lane: MA
        as: PDCoordinator
        captures:
          ins1: $.data.id
      - call: POST /pd/courses
        payload:
          course_code: OP-1
          title: Ops Course
          delivery_mode: IN_PERSON
          clock_hours: 5
          fee_cents: 0
        as: PDCoordinator
        captures:
          c1: $.data.id
      - call: POST /pd/sections
        payload:
          course_id: ${c1}
          term: 2026-FALL
          instructor_id: ${ins1}
          building_id: ${b1}
          room: R1
          seat_capacity: 5
          starts_at: '2026-08-15T09:00:00Z'
          ends_at: '2026-08-20T17:00:00Z'
          registration_opens_at: '2026-08-01T00:00:00Z'
          registration_closes_at: '2026-08-10T00:00:00Z'
        as: PDCoordinator
        captures:
          s1: $.data.id
      - call: POST /pd/sections/${s1}/meetings
        payload:
          starts_at: '2026-08-15T10:00:00Z'
          ends_at: '2026-08-15T12:00:00Z'
          room: R1
        as: PDCoordinator
      - call: POST /pd/sections/${s1}/publish
        payload: {}
        as: PDCoordinator
      - call: POST /pd/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-21T00:00:00Z'
        as: PDCoordinator
      trigger:
      - call: POST /pd/ops-runs
        payload: {}
        as: PDCoordinator
        captures:
          moved: $.data.transitioned_section_ids
      - call: GET /pd/sections/${s1}
        payload: {}
        as: PDCoordinator
        captures:
          st: $.data.status
      assert:
      - Section S1 status == COMPLETED after a single ops-run (PUBLISHED -> REGISTRATION_CLOSED -> IN_SESSION -> COMPLETED)
      - ops-run response transitioned_section_ids contains ${s1}
  - name: section_cancel_cascade_drops_and_expires
    claim_type: side_effect_execution
    grounds:
    - state_machines.Section.PUBLISHED_to_CANCELED
    - state_machines.Registration.REGISTERED_to_DROPPED
    - state_machines.Registration.WAITLISTED_to_EXPIRED
    distinguishing_aspect: "Cancel cascade down: the REGISTERED registration becomes DROPPED with its 10000 encumbrance released to 0, while the WAITLISTED one becomes EXPIRED (not WITHDRAWN \u2014 system\
      \ expiry)."
    test_recipe:
      setup:
      - Building B1 budget 500000 OPEN; T1 (B1) REGISTERED with fee 10000 encumbered; T2 (B1) WAITLISTED (capacity 1)
      setup_api_calls:
      - call: POST /pd/_clock/set_current_utc
