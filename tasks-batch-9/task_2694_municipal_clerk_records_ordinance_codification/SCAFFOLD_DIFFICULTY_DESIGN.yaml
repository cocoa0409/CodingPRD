  - rule_id: non_linear_state_machine
    instances:

      - name: minutes_correction_cycle_traversed_twice_with_divergent_branch_effects
        grounds:
          - state_machines.MinutesRecord.APPROVED_to_CORRECTION_PENDING
          - state_machines.MinutesRecord.CORRECTION_PENDING_to_APPROVED
          - entities.MinutesRecord.fields.revision_number
          - entities.MinutesRecord.fields.correction_count
          - entities.MinutesRecord.fields.pending_correction_text
        distinguishing_aspect: |
          The APPROVED -> CORRECTION_PENDING -> APPROVED loop is traversed twice
          and the two returns are NOT equivalent: a failing MINUTES_CORRECTION
          tally lands back on APPROVED with text_body unchanged and
          revision_number frozen, while a passing one lands on the same state
          having swapped the narrative and bumped revision_number. correction_count
          advances on both entries, so the record distinguishes "two corrections
          attempted" from "one correction adopted".
        test_recipe:
          setup:
            - "Meeting m1 (2026-09-15) adjourned; its minutes submitted and then approved by a passing MINUTES_APPROVAL motion at meeting m2 (2026-10-06)."
            - "Meeting m3 (2026-10-27) convened to hear two successive MINUTES_CORRECTION motions against the same minutes record."
