              as_user_id: "${prog_id}"
              captures: { ss_id: $.data.id }
            - call: "POST /provost/self-studies/${ss_id}/transitions"
              payload: { action: "SUBMIT" }
              as: ProgramChair
              as_user_id: "${prog_id}"
            - call: "POST /provost/self-studies/${ss_id}/transitions"
              payload: { action: "ACCEPT" }
              as: ReviewCoordinator
            - call: "POST /provost/external-reviewers"
              payload: { full_name: "Dr Nala Osei", institution: "Westmoor University", specialty_code: "HIST" }
              as: ReviewCoordinator
              captures: { rev_id: $.data.id }
            - call: "POST /provost/reviewer-visits"
              payload: { cycle_id: "${cycle_id}", reviewer_id: "${rev_id}", window_start_at: "2026-08-20T09:00:00Z", window_end_at: "2026-08-22T17:00:00Z" }
              as: ReviewCoordinator
              captures: { visit_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-23T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/reviewer-visits/${visit_id}/complete"
              payload: {}
              as: ReviewCoordinator
            - call: "POST /provost/reviewer-visits/${visit_id}/reports"
              payload: { recommendation: "IMPROVE", finding_codes: ["F-ENROLL", "F-COST"], narrative: "Initial report." }
              as: ExternalReviewer
              as_user_id: "${rev_id}"
          trigger:
            - call: "POST /provost/review-cycles/${cycle_id}/program-response"
              payload: { response_concurrence: "DISPUTE", response_text: "First dispute.", disputed_finding_codes: ["F-COST"] }
              as: ProgramChair
              as_user_id: "${prog_id}"
            - call: "POST /provost/reviewer-visits/${visit_id}/reports"
              payload: { recommendation: "IMPROVE", finding_codes: ["F-COST"], narrative: "First addendum." }
              as: ExternalReviewer
              as_user_id: "${rev_id}"
            - call: "POST /provost/review-cycles/${cycle_id}/program-response"
              payload: { response_concurrence: "DISPUTE", response_text: "Second dispute.", disputed_finding_codes: ["F-COST"] }
              as: ProgramChair
              as_user_id: "${prog_id}"
            - call: "POST /provost/reviewer-visits/${visit_id}/reports"
              payload: { recommendation: "IMPROVE", finding_codes: ["F-COST"], narrative: "Second addendum." }
              as: ExternalReviewer
              as_user_id: "${rev_id}"
            - call: "POST /provost/review-cycles/${cycle_id}/program-response"
              payload: { response_concurrence: "DISPUTE", response_text: "Third dispute.", disputed_finding_codes: ["F-COST"] }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { err: $.data.error_id }
            - call: "POST /provost/review-cycles/${cycle_id}/program-response"
              payload: { response_concurrence: "PARTIAL_CONCUR", response_text: "We accept the cost finding with reservations." }
              as: ProgramChair
              as_user_id: "${prog_id}"
          assert:
            - "after the first dispute: ReviewCycle.${cycle_id}.state == ADDENDUM_REQUESTED with addendum_round == 1"
            - "after the first addendum report: state == REPORT_RECEIVED, ReviewerVisit.${visit_id}.report_count == 2, and the new ReviewerReport.sequence_number == 2"
