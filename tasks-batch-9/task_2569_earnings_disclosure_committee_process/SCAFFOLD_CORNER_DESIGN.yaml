      - name: milestone_prerequisite_gates_and_subcertification_uniqueness_each_report_their_own_code
        claim_type: error_triggerability
        grounds:
          - validations[priority=33]
          - validations[priority=34]
          - validations[priority=14]
          - errors[ERR_MILESTONE_MISSING]
          - errors[ERR_MILESTONE_INCOMPLETE]
          - errors[ERR_DUPLICATE_SUBCERT]
          - endpoints[GET /disclosure/reporting-cycles/{id}/readiness]
        distinguishing_aspect: |
          Three codes that are easy to collapse into one another are separated here. ERR_MILESTONE_MISSING
          is about EXISTENCE and ERR_MILESTONE_INCOMPLETE about STATUS, and the second is probed twice —
          once with the CLOSE milestone PLANNED and once with it IN_PROGRESS — because only COMPLETE
          satisfies the gate, so an implementation that accepts "started" is caught. ERR_MILESTONE_MISSING
          is then re-raised from a DIFFERENT transition (OPEN_CERTIFICATION with no REVIEW milestone),
          where it must still beat ERR_FILING_DOCUMENT_INVALID at priority 36 even though the cycle also
          has no approved periodic filing. ERR_DUPLICATE_SUBCERT keys on the TRIPLE
          (cycle_id, member_id, scope_area): the same member is legitimately given a second row under a
          different scope_area, so an implementation that keys on (cycle_id, member_id) refuses it.
        test_recipe:
          setup:
            - "An ADOPTED charter with a FINANCE and a LEGAL voting member, satisfying quorum 2 and required_functions [FINANCE, LEGAL]."
            - "A FY2026-Q2 FORM_10Q cycle in PLANNING with NO milestones at all."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Gate Probe Charter", version_label: "2026.1", min_quorum_count: 2, required_functions: ["FINANCE", "LEGAL"] }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
