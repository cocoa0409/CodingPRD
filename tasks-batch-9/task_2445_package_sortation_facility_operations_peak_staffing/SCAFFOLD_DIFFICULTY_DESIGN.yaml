  # =====================================================================
  # Rule 7 - cross-entity state dependencies over different entity pairs
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: start_unload_blocked_by_out_of_service_door
        grounds:
          - state_machines.TrailerAppointment.ARRIVED_to_UNLOADING
          - validations.26_ERR_DOOR_OUT_OF_SERVICE
          - entities.DockDoor.fields.status
          - endpoints.PATCH_/sortation/dock-doors/{id}
        distinguishing_aspect: |
          Entity pair (TrailerAppointment, DockDoor): the appointment's own status is a perfectly legal
          ARRIVED, but the transition to UNLOADING reads the referenced door's status, so taking the
          door OUT_OF_SERVICE after the appointment was booked blocks the unload and restoring it
          unblocks the identical call.
        test_recipe:
          setup:
            - "Center SC1 with inbound door IN-1 (ACTIVE) and one trailer appointment on IN-1 in status ARRIVED"
            - "The door is then patched to status OUT_OF_SERVICE while the appointment stays ARRIVED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/dock-doors"
              payload: { door_number: "IN-1", kind: "INBOUND" }
              as: FacilityAdmin
              captures: { door_in_id: $.data.id }
            - call: "POST /sortation/trailer-appointments"
              payload: { sort_center_id: "${center_id}", door_id: "${door_in_id}", trailer_code: "T-IN-1", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T07:00:00Z", priority_class: "STANDARD", manifest_package_count: 1500 }
              as: InboundCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /sortation/trailer-appointments/${appt_id}/arrive"
              payload: {}
              as: InboundCoordinator
            - call: "PATCH /sortation/dock-doors/${door_in_id}"
              payload: { status: "OUT_OF_SERVICE" }
              as: FacilityAdmin
          trigger:
            - call: "POST /sortation/trailer-appointments/${appt_id}/start-unload"
              payload: {}
              as: InboundCoordinator
            - call: "PATCH /sortation/dock-doors/${door_in_id}"
              payload: { status: "ACTIVE" }
              as: FacilityAdmin
            - call: "POST /sortation/trailer-appointments/${appt_id}/start-unload"
              payload: {}
              as: InboundCoordinator
          assert:
            - "the first start-unload returns ERR_DOOR_OUT_OF_SERVICE with HTTP 409 and TrailerAppointment.${appt_id}.status stays ARRIVED with unload_sequence_rank == 1"
            - "after the door is patched back to ACTIVE the identical start-unload returns HTTP 200 with status == UNLOADING"
            - "TrailerAppointment.${appt_id}.unload_sequence_rank == null once it leaves the ARRIVED set"
            - "DockDoor.${door_in_id}.status == ACTIVE and SortCenter.${center_id}.ops_posture == OPEN throughout"

      - name: check_in_blocked_until_worker_is_certified
        grounds:
          - state_machines.StaffAssignment.ASSIGNED_to_CHECKED_IN
          - validations.25_ERR_WORKER_NOT_CLEARED
          - state_machines.Worker.CLEARED_to_CERTIFIED
          - entities.Worker.fields.training_sessions_completed
        distinguishing_aspect: |
          Entity pair (StaffAssignment, Worker), different from the appointment/door pair: assignment
          create only demands CLEARED, but check-in demands CERTIFIED, so the same assignment is
          un-checkable-in until two training sessions plus the certification event move the worker on,
          and the certification itself is guarded by the same error id at a different check.
        test_recipe:
          setup:
            - "Center SC1 (automation 70, flex_pool_total 20) with one chute C1 and an APPROVED ShiftPlan for 2026-08-03 06:00-14:00 (forecast_volume 4000, core 4, budget 100000)"
            - "One CORE worker in status CLEARED with training_sessions_completed 0"
            - "One StaffAssignment in status ASSIGNED for that worker on C1 (legal because CLEARED is enough to be assigned)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/sort-chutes"
