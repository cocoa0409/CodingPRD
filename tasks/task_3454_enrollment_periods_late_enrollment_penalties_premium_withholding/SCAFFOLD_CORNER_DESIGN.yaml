              captures: { e_coll: "$.data.collection_status", e_stat: "$.data.enrollment_status" }
          assert:
            - "after paying only the first past-due invoice the enrollment is still DELINQUENT (second remains past due)"
            - "after the second payment: collection_status == DIRECT_BILL (cured), enrollment_status == ACTIVE"
            - "both invoices PAID with paid_cents == 18500 and outstanding_cents == 0"

  # =========================================================================
  # Section: consistency_model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: enrollment_create_response_immediately_shows_computed_fields
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, entities.CoverageEnrollment.fields.effective_month]
        distinguishing_aspect: "Immediate consistency: the 201 response body itself carries the computed effective_month, both status dimensions, and enrolled_via_window — no re-read required."
        test_recipe:
          setup: ["beneficiary DOB 1961-12-14; clock 2026-12-10 (IEP, M == attainment month)"]
          setup_api_calls:
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Im Mediate", date_of_birth: "1961-12-14" }
              as: FieldOfficer
              captures: { b_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-10T00:00:00Z" }
              as: BenefitAdministrator
          trigger:
            - call: "POST /medicare/enrollments"
              payload: { beneficiary_id: "${b_id}", part: "PART_B" }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { e_eff: "$.data.effective_month", e_stat: "$.data.enrollment_status", e_coll: "$.data.collection_status", e_via: "$.data.enrolled_via_window" }
          assert:
            - "201 response body: effective_month == \"2027-01\", enrollment_status == \"PENDING\", collection_status == \"PENDING_SETUP\", enrolled_via_window == \"IEP\""
