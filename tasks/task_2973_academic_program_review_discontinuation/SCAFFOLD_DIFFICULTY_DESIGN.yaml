# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Domain: academic-program-review-discontinuation   api_prefix: /provost
# Nine §0.5 rule_ids x 2 instances = 18 instances.
# Every numeric assert literal below was produced by executing the matching
# §1.3 formula against the pinned setup inputs.
# =============================================================================

scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: program_cost_per_credit_hour_rolling_vs_latest_diverge
        grounds:
          - calculations.program_cost_per_credit_hour
          - entities.AcademicProgram.fields.cost_per_credit_hour_rolling_cents
          - entities.AcademicProgram.fields.cost_per_credit_hour_latest_cents
          - entities.ViabilityMetricSnapshot.fields.cost_per_credit_hour_cents
        distinguishing_aspect: |
          The two variants of program_cost_per_credit_hour read the SAME three
          immutable snapshots and land on different integers: the
          rolling_three_term variant sums cost and credit hours first and
          divides once (45946 cents), while the latest_term variant divides only
          the newest term (55000 cents). The forbidden divide-then-average order
          over the same three rows would yield a third distinct value, 46944,
          which the test asserts the program never reports.
        test_recipe:
          setup:
            - "Logical clock parked at the startup default 2026-08-01T00:00:00Z."
            - "One UNDERGRADUATE AcademicProgram HIST-BA with no cycle yet."
            - "Exactly three ViabilityMetricSnapshot rows, term_index 1..3, with falling headcount and credit hours and a rising per-term unit cost: (300 ch / 12000000 cents), (240 ch / 11000000 cents), (200 ch / 11000000 cents)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST", host_capacity_per_day: 2 }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2025FA", term_index: 1, enrollment_headcount: 30, credit_hours: 300, direct_cost_cents: 12000000, completions_count: 4, market_demand_index: 42 }
              as: ReviewCoordinator
              captures: { snap1_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2026SP", term_index: 2, enrollment_headcount: 24, credit_hours: 240, direct_cost_cents: 11000000, completions_count: 3, market_demand_index: 40 }
              as: ReviewCoordinator
              captures: { snap2_id: $.data.id }
          trigger:
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2026FA", term_index: 3, enrollment_headcount: 20, credit_hours: 200, direct_cost_cents: 11000000, completions_count: 2, market_demand_index: 42 }
              as: ReviewCoordinator
              captures: { snap3_cph: $.data.cost_per_credit_hour_cents }
          assert:
            - "AcademicProgram.${prog_id}.cost_per_credit_hour_rolling_cents == 45946"
            - "AcademicProgram.${prog_id}.cost_per_credit_hour_latest_cents == 55000"
            - "AcademicProgram.${prog_id}.cost_per_credit_hour_rolling_cents != 46944"
            - "AcademicProgram.${prog_id}.snapshot_count == 3"
            - "the term_index 3 snapshot's own cost_per_credit_hour_cents == 55000, the term_index 2 snapshot's == 45833, the term_index 1 snapshot's == 40000"
            - "AcademicProgram.${prog_id}.composite_score == 29.06"
            - "AcademicProgram.${prog_id}.viability_band == NONVIABLE"

      - name: displaced_student_projection_optimistic_vs_conservative_flips_approval
        grounds:
          - calculations.displaced_student_completion_projection
          - entities.DisplacedStudent.fields.projection_variant
          - entities.DisplacedStudent.fields.at_risk
          - entities.TeachOutPlan.fields.at_risk_student_count
          - validations[priority=35]
        distinguishing_aspect: |
          A different entity domain from the cost variant pair: the two variants
          of displaced_student_completion_projection read the SAME stored
          credits_remaining of 24 and produce 2 versus 3 terms remaining
          (completion term 5 versus 6), which flips at_risk from false to true
          and turns a plan APPROVE that succeeded before advising into
          ERR_AT_RISK_STUDENTS_PRESENT afterwards.
        test_recipe:
          setup:
            - "A DISCONTINUATION DecisionRecord ratified on program HIST-BA, both auto-minted agency notices acknowledged."
            - "A DRAFT TeachOutPlan with last_admit_term_index 3, first_teach_out_term_index 4, final_award_term_index 5."
            - "Two course guarantees of 6 seats each (terms 4 and 5) so guaranteed_seat_total is 12."
            - "One DisplacedStudent with credits_remaining 24 and max_credits_per_term 15, still PENDING, so required_seat_count is 8 and seat_shortfall is 0."
            - "The plan has been SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST", host_capacity_per_day: 2 }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2025FA", term_index: 1, enrollment_headcount: 30, credit_hours: 300, direct_cost_cents: 12000000, completions_count: 4, market_demand_index: 42 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2026SP", term_index: 2, enrollment_headcount: 24, credit_hours: 240, direct_cost_cents: 11000000, completions_count: 3, market_demand_index: 40 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2026FA", term_index: 3, enrollment_headcount: 20, credit_hours: 200, direct_cost_cents: 11000000, completions_count: 2, market_demand_index: 42 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/review-cycles"
              payload: { cycle_year: 2026, self_study_due_at: "2026-09-01T00:00:00Z", required_section_codes: ["S1", "S2"] }
              as: ReviewCoordinator
              captures: { cycle_id: $.data.id }
            - call: "POST /provost/review-cycles/${cycle_id}/self-studies"
              payload: { narrative: "Program self study narrative", section_codes: ["S1", "S2"] }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { ss_id: $.data.id }
            - call: "POST /provost/self-studies/${ss_id}/transitions"
              payload: { action: "SUBMIT" }
              as: ProgramChair
              as_user_id: "${prog_id}"
            - call: "POST /provost/self-studies/${ss_id}/transitions"
              payload: { action: "ACCEPT" }
              as: ReviewCoordinator
            - call: "POST /provost/external-reviewers"
              payload: { full_name: "Dr Vale", institution: "Northgate University", specialty_code: "HIST", conflict_program_codes: [], travel_buffer_hours: 48 }
              as: ReviewCoordinator
              captures: { rev_id: $.data.id }
            - call: "POST /provost/reviewer-visits"
              payload: { cycle_id: "${cycle_id}", reviewer_id: "${rev_id}", window_start_at: "2026-09-10T09:00:00Z", window_end_at: "2026-09-11T17:00:00Z" }
              as: ReviewCoordinator
              captures: { visit_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T17:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/reviewer-visits/${visit_id}/complete"
              payload: {}
              as: ReviewCoordinator
            - call: "POST /provost/reviewer-visits/${visit_id}/reports"
              payload: { recommendation: "DISCONTINUE", finding_codes: ["F1", "F2"], narrative: "Enrollment collapse and unit cost growth" }
              as: ExternalReviewer
              as_user_id: "${rev_id}"
            - call: "POST /provost/review-cycles/${cycle_id}/program-response"
              payload: { response_concurrence: "CONCUR", response_text: "The program concurs with the recommendation" }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { cyc_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T10:00:00Z" }
              as: Provost
            - call: "POST /provost/review-cycles/${cycle_id}/decision-records"
              payload: { outcome: "DISCONTINUATION", rationale: "Nonviable across all four factors", effective_term_index: 4, expected_cycle_version: "${cyc_v}" }
              as: Provost
              as_user_id: "provost-proposer"
              captures: { dec_id: $.data.id }
            - call: "POST /provost/decision-records/${dec_id}/transitions"
              payload: { action: "RATIFY", ratification_note: "Ratified by the deciding provost" }
              as: Provost
              as_user_id: "provost-ratifier"
            - call: "GET /provost/decision-records/${dec_id}/agency-notifications"
              payload: {}
              as: ReviewCoordinator
              captures: { n1_id: "$.data[0].id", n2_id: "$.data[1].id" }
            - call: "POST /provost/agency-notifications/${n1_id}/transitions"
              payload: { action: "SEND", transmitted_reference: "ACC-TX-0001" }
              as: ReviewCoordinator
            - call: "POST /provost/agency-notifications/${n1_id}/transitions"
              payload: { action: "ACKNOWLEDGE" }
              as: ReviewCoordinator
            - call: "POST /provost/agency-notifications/${n2_id}/transitions"
              payload: { action: "SEND", transmitted_reference: "CHE-TX-0001" }
              as: ReviewCoordinator
            - call: "POST /provost/agency-notifications/${n2_id}/transitions"
              payload: { action: "ACKNOWLEDGE" }
              as: ReviewCoordinator
            - call: "GET /provost/academic-programs/${prog_id}"
              payload: {}
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { prog_v: $.data.version }
            - call: "POST /provost/academic-programs/${prog_id}/teach-out-plans"
              payload: { decision_id: "${dec_id}", last_admit_term_index: 3, first_teach_out_term_index: 4, final_award_term_index: 5, expected_program_version: "${prog_v}" }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /provost/teach-out-plans/${plan_id}/course-guarantees"
              payload: { course_code: "HIST-401", term_index: 4, seats_guaranteed: 6 }
              as: ProgramChair
              as_user_id: "${prog_id}"
            - call: "POST /provost/teach-out-plans/${plan_id}/course-guarantees"
              payload: { course_code: "HIST-402", term_index: 5, seats_guaranteed: 6 }
              as: ProgramChair
              as_user_id: "${prog_id}"
            - call: "POST /provost/teach-out-plans/${plan_id}/displaced-students"
              payload: { student_number: "S-1001", credits_remaining: 24, max_credits_per_term: 15 }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /provost/teach-out-plans/${plan_id}/transitions"
              payload: { action: "SUBMIT" }
              as: ProgramChair
              as_user_id: "${prog_id}"
          trigger:
            - call: "POST /provost/displaced-students/${stu_id}/advising"
              payload: { advised_credits_per_term: 9, plan_signed: true }
              as: Registrar
            - call: "POST /provost/teach-out-plans/${plan_id}/transitions"
              payload: { action: "APPROVE" }
              as: Provost
              as_user_id: "provost-ratifier"
          assert:
            - "before the advising call: DisplacedStudent.${stu_id}.projection_variant == OPTIMISTIC_FULL_LOAD, projected_terms_remaining == 2, projected_completion_term_index == 5, at_risk == false, required_seat_count == 8, and TeachOutPlan.${plan_id}.at_risk_student_count == 0"
            - "after the advising call: DisplacedStudent.${stu_id}.projection_variant == CONSERVATIVE_ADVISED_LOAD"
            - "DisplacedStudent.${stu_id}.projected_terms_remaining == 3"
            - "DisplacedStudent.${stu_id}.projected_completion_term_index == 6"
            - "DisplacedStudent.${stu_id}.at_risk == true"
            - "DisplacedStudent.${stu_id}.required_seat_count == 8 (unchanged by the variant switch)"
            - "TeachOutPlan.${plan_id}.at_risk_student_count == 1 and seat_shortfall == 0"
            - "the APPROVE call returns 409 with error_id ERR_AT_RISK_STUDENTS_PRESENT"
            - "TeachOutPlan.${plan_id}.state == SUBMITTED"

  - rule_id: combinatorial_formula
    instances:
      - name: viability_composite_weight_vector_switches_with_degree_level
        grounds:
          - calculations.program_viability_composite
          - entities.AcademicProgram.fields.degree_level
          - entities.AcademicProgram.fields.composite_score
          - entities.AcademicProgram.fields.viability_band
        distinguishing_aspect: |
          Mode (a) multi-factor: composite_score combines four normalised
          factors (enrollment trend, completions per head, market demand, cost
          efficiency), two of which are clamped, under a weight vector selected
          by degree_level. Two programs fed byte-identical snapshot sets land on
          29.06 (UNDERGRADUATE weights 0.35/0.25/0.20/0.20) versus 35.01
          (GRADUATE weights 0.25/0.30/0.15/0.30) — a 5.95 point spread produced
          purely by the conditional weight vector, with the enrollment factor
          clamped up from -33.33 to 0 in both.
        test_recipe:
          setup:
            - "Logical clock at the startup default 2026-08-01T00:00:00Z."
            - "Two programs with identical department_code and identical three-term snapshot histories: HIST-BA declared UNDERGRADUATE and HIST-MA declared GRADUATE."
            - "Each history is (headcount 30, 300 ch, 12000000 cents, 4 completions, demand 42), (24, 240, 11000000, 3, 40), (20, 200, 11000000, 2, 42) — window headcount 74, above the MIN_VIABLE_WINDOW_HEADCOUNT floor of 60, so the small-program override is not engaged for either."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST", host_capacity_per_day: 2 }
              as: ReviewCoordinator
              captures: { ug_id: $.data.id }
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-MA", name: "History MA", degree_level: "GRADUATE", department_code: "HIST", host_capacity_per_day: 2 }
              as: ReviewCoordinator
              captures: { grad_id: $.data.id }
            - call: "POST /provost/academic-programs/${ug_id}/metric-snapshots"
              payload: { term_code: "2025FA", term_index: 1, enrollment_headcount: 30, credit_hours: 300, direct_cost_cents: 12000000, completions_count: 4, market_demand_index: 42 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${ug_id}/metric-snapshots"
              payload: { term_code: "2026SP", term_index: 2, enrollment_headcount: 24, credit_hours: 240, direct_cost_cents: 11000000, completions_count: 3, market_demand_index: 40 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${grad_id}/metric-snapshots"
              payload: { term_code: "2025FA", term_index: 1, enrollment_headcount: 30, credit_hours: 300, direct_cost_cents: 12000000, completions_count: 4, market_demand_index: 42 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${grad_id}/metric-snapshots"
              payload: { term_code: "2026SP", term_index: 2, enrollment_headcount: 24, credit_hours: 240, direct_cost_cents: 11000000, completions_count: 3, market_demand_index: 40 }
              as: ReviewCoordinator
          trigger:
            - call: "POST /provost/academic-programs/${ug_id}/metric-snapshots"
              payload: { term_code: "2026FA", term_index: 3, enrollment_headcount: 20, credit_hours: 200, direct_cost_cents: 11000000, completions_count: 2, market_demand_index: 42 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${grad_id}/metric-snapshots"
              payload: { term_code: "2026FA", term_index: 3, enrollment_headcount: 20, credit_hours: 200, direct_cost_cents: 11000000, completions_count: 2, market_demand_index: 42 }
              as: ReviewCoordinator
          assert:
            - "AcademicProgram.${ug_id}.composite_score == 29.06"
            - "AcademicProgram.${grad_id}.composite_score == 35.01"
            - "AcademicProgram.${grad_id}.composite_score - AcademicProgram.${ug_id}.composite_score == 5.95"
            - "AcademicProgram.${ug_id}.viability_band == NONVIABLE"
            - "AcademicProgram.${grad_id}.viability_band == NONVIABLE"
            - "AcademicProgram.${ug_id}.cost_per_credit_hour_rolling_cents == 45946 and AcademicProgram.${grad_id}.cost_per_credit_hour_rolling_cents == 45946 (the cost factor input is identical; only the weights differ)"

      - name: staffing_waterfall_step_order_and_cap_stop
        grounds:
          - calculations.staffing_reduction_waterfall
          - entities.FacultyAppointment.fields.reduction_sequence_position
          - entities.FacultyAppointment.fields.notice_pay_cents
          - entities.AcademicProgram.fields.severance_budget_cap_cents
          - entities.AcademicProgram.fields.deferred_fte
        distinguishing_aspect: |
          Mode (c) pinned evaluation order: staffing_reduction_waterfall's four
          steps must run in the declared order (instructional demand, then
          reducible pool, then the floored 15 percent budget cap off the rolling
          cost window, then the whole-appointment allocation ordered by tenure
          tier ASC then fte DESC then created_at ASC). Five appointments on one
          program produce positions 1, 2, 3 for the ADJUNCT, the 1.00-fte
          NON_TENURE_TRACK and the 0.50-fte NON_TENURE_TRACK, a liability of
          2745205 cents against a cap of 5100000, and deferred_fte 2.00 because
          the TENURE_TRACK holder's 4438356 would breach the cap. Computing the
          cap before the demand step, or ordering by fte before tier, changes
          both the positions and the deferred figure.
        test_recipe:
          setup:
            - "Program HIST-BA with the same three-term snapshot history as above, so the rolling direct-cost window sums to 34000000 cents and the floored 15 percent cap is 5100000 cents."
            - "No teach-out plan and therefore zero guaranteed sections, so retained_teach_out_fte is 0.00 and the whole assigned pool of 3.75 fte is reducible."
            - "Five FacultyAppointment rows created in tier-scrambled order: TENURED 1.00 fte at 12000000 cents, TENURE_TRACK 1.00 fte at 9000000, NON_TENURE_TRACK 0.50 fte at 7200000, NON_TENURE_TRACK 1.00 fte at 7200000, ADJUNCT 0.25 fte at 4000000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: HRPartner
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST", host_capacity_per_day: 2 }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2025FA", term_index: 1, enrollment_headcount: 30, credit_hours: 300, direct_cost_cents: 12000000, completions_count: 4, market_demand_index: 42 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2026SP", term_index: 2, enrollment_headcount: 24, credit_hours: 240, direct_cost_cents: 11000000, completions_count: 3, market_demand_index: 40 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2026FA", term_index: 3, enrollment_headcount: 20, credit_hours: 200, direct_cost_cents: 11000000, completions_count: 2, market_demand_index: 42 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/faculty-appointments"
              payload: { faculty_number: "F-TEN-1", tenure_status: "TENURED", fte: 1.00, annual_salary_cents: 12000000 }
              as: HRPartner
              captures: { ten_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/faculty-appointments"
              payload: { faculty_number: "F-TT-1", tenure_status: "TENURE_TRACK", fte: 1.00, annual_salary_cents: 9000000 }
              as: HRPartner
              captures: { tt_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/faculty-appointments"
              payload: { faculty_number: "F-NTT-HALF", tenure_status: "NON_TENURE_TRACK", fte: 0.50, annual_salary_cents: 7200000 }
              as: HRPartner
              captures: { ntt_half_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/faculty-appointments"
              payload: { faculty_number: "F-NTT-FULL", tenure_status: "NON_TENURE_TRACK", fte: 1.00, annual_salary_cents: 7200000 }
              as: HRPartner
              captures: { ntt_full_id: $.data.id }
          trigger:
            - call: "POST /provost/academic-programs/${prog_id}/faculty-appointments"
              payload: { faculty_number: "F-ADJ-1", tenure_status: "ADJUNCT", fte: 0.25, annual_salary_cents: 4000000 }
              as: HRPartner
              captures: { adj_id: $.data.id }
          assert:
            - "AcademicProgram.${prog_id}.faculty_fte_baseline == 3.75 and active_fte_total == 3.75 and assigned_pool_fte == 3.75"
            - "AcademicProgram.${prog_id}.retained_teach_out_fte == 0.00"
            - "AcademicProgram.${prog_id}.reducible_fte == 3.75"
            - "AcademicProgram.${prog_id}.severance_budget_cap_cents == 5100000"
            - "FacultyAppointment.${adj_id}.notice_pay_cents == 82192"
            - "FacultyAppointment.${ntt_full_id}.notice_pay_cents == 1775342"
            - "FacultyAppointment.${ntt_half_id}.notice_pay_cents == 887671"
            - "FacultyAppointment.${tt_id}.notice_pay_cents == 4438356"
            - "FacultyAppointment.${ten_id}.notice_pay_cents == 12000000"
            - "FacultyAppointment.${adj_id}.reduction_sequence_position == 1"
            - "FacultyAppointment.${ntt_full_id}.reduction_sequence_position == 2"
            - "FacultyAppointment.${ntt_half_id}.reduction_sequence_position == 3"
            - "FacultyAppointment.${tt_id}.reduction_sequence_position == null"
            - "FacultyAppointment.${ten_id}.reduction_sequence_position == null"
            - "AcademicProgram.${prog_id}.staffing_liability_cents == 2745205"
            - "AcademicProgram.${prog_id}.deferred_fte == 2.00"

  - rule_id: non_linear_state_machine
    instances:
      - name: self_study_revision_loop_bounded_at_two_returns
        grounds:
          - state_machines.SelfStudy.SUBMITTED_to_DRAFT
          - state_machines.SelfStudy.DRAFT_to_SUBMITTED
          - entities.SelfStudy.fields.revision_round
          - validations[priority=18]
        distinguishing_aspect: |
          The SelfStudy axis is cyclic, not linear: DRAFT -> SUBMITTED -> DRAFT
          is traversable twice and the third RETURN is refused with
          ERR_REVISION_LIMIT_REACHED at revision_round 2, leaving the row in
          SUBMITTED rather than looping forever.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, well before the cycle's self_study_due_at of 2026-09-01T00:00:00Z."
            - "Program HIST-BA with an open ReviewCycle in SELF_STUDY_OPEN requiring sections S1 and S2."
            - "A SelfStudy created in DRAFT covering both required sections, then pushed twice around the SUBMIT/RETURN loop so revision_round is 2 and the row is SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
