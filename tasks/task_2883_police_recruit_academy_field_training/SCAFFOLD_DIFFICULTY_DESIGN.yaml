            - "Logical clock at 2027-04-20T12:00:00Z, well before the 2027-09-30 milestone."
          setup_api_calls:
            - call: "POST /certification-standards"
              payload: { code: "TCOLE-ABT", state_code: "TX", min_total_hours: 2.00, min_passing_score: 70.00, max_remediation_attempts: 1, max_absence_hours: 4.00, topic_requirements: [{ topic_code: "PATROL", required_hours: 2.00, exam_required: false }], fitness_event_floor_points: 10, fitness_pass_score: 60 }
              as: AcademyDirector
