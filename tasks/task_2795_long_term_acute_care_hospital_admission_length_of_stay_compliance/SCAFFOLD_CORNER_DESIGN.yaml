      - name: sso_per_diem_product_and_percentage_round_half_up
        claim_type: precision
        grounds:
          - calculations.stay_payment_determination.precision
          - calculations.discharge_payment_percentage.precision
        distinguishing_aspect: "DRG 573 at 7 covered days makes the LTCH per-diem product 1,938,461.5384... cents, which must round HALF UP to 1,938,462 (truncation gives 1,938,461) and then drives discharge_payment_pct 53.85 rather than the truncated 53.84 - and the single rounding is applied to the whole product, never to the per-diem quotient first."
        test_recipe:
          setup:
            - "OPEN period FY2027, ACTIVE criteria set CS-2026A, DRG 573 (relative_weight 0.75, alos_days 13, standard_federal_rate 4,800,000c, ipps per-diem 400,000c, ipps full 3,400,000c)."
            - "Patient Xan Round is admitted 2026-08-01T00:00:00Z and discharged at clock 2026-08-08 with estimated_cost_cents 1,000,000 - covered_los_days 7 against an SSO threshold of floor(5/6 * 13) = 10."
          setup_api_calls:
            - call: "POST /ltch/cost-reporting-periods"
              payload: { period_label: "FY2027", start_date: "2026-07-01", end_date: "2027-06-30" }
              as: ComplianceOfficer
              captures: { period_id: $.data.id }
            - call: "POST /ltch/referring-hospitals"
              payload: { name: "Metro General", npi: "1000000001", hospital_type: "ACUTE_CARE", is_colocated: false }
              as: ComplianceOfficer
              captures: { rh_id: $.data.id }
            - call: "POST /ltch/admission-criteria-sets"
              payload: { label: "CS-2026A", effective_from: "2026-01-01", pmv_min_vent_hours: 96, pmv_min_icu_days: 3, wound_min_stage: 3, wound_min_count: 2 }
              as: ComplianceOfficer
              captures: { cs_a_id: $.data.id }
            - call: "POST /ltch/drg-rates"
              payload: { drg_code: "573", relative_weight: 0.75, alos_days: 13, standard_federal_rate_cents: 4800000, ipps_comparable_per_diem_cents: 400000, ipps_comparable_full_cents: 3400000 }
              as: ComplianceOfficer
              captures: { drg573_id: $.data.id }
            - call: "POST /ltch/patients"
              payload: { mrn: "MRN-430", full_name: "Xan Round", birth_date: "1950-07-10", primary_payer: "MEDICARE_FFS" }
              as: IntakeCoordinator
              captures: { pat430_id: $.data.id, pat430_v: $.data.version }
            - call: "POST /ltch/referrals"
              payload: { patient_id: "${pat430_id}", referring_hospital_id: "${rh_id}", drg_rate_id: "${drg573_id}", expected_patient_version: "${pat430_v}", vent_hours_at_referral: 240, icu_days_at_referral: 5, wound_stage: 1, wound_count: 0, prior_acute_discharge_at: "2026-07-31T00:00:00Z" }
              as: IntakeCoordinator
              captures: { ref430_id: $.data.id }
            - call: "POST /ltch/referrals/${ref430_id}/screen"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /ltch/referrals/${ref430_id}/admit"
              payload: {}
              as: IntakeCoordinator
              captures: { stay430_id: $.data.id }
            - call: "POST /ltch/_clock/set_current_utc"
              payload: { current_utc: "2026-08-08T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /ltch/stays/${stay430_id}/discharge"
              payload: { discharge_disposition: "HOME", estimated_cost_cents: 1000000 }
              as: UtilizationReviewNurse
              captures: { stay430_cov: $.data.covered_los_days, stay430_thr: $.data.sso_threshold_days, stay430_pct: $.data.discharge_payment_pct }
            - call: "GET /ltch/stays/${stay430_id}/payment-determinations"
              payload: { status: "DRAFT" }
              as: RevenueIntegrityAnalyst
              captures: { det430_id: "$.data[0].id", det430_base: "$.data[0].base_payment_cents", det430_full: "$.data[0].full_standard_amount_cents", det430_pct: "$.data[0].discharge_payment_pct" }
          assert:
            - "stay430_cov == 7 and stay430_thr == 10 - the SSO branch is taken"
            - "det430_full == 3600000 (round_half_up(4,800,000 * 0.75))"
            - "det430_base == 1938462 - round_half_up(3,600,000 / 13 * 7); 1938461 (truncation) and 1938460 (rounding the 276,923.0769 per-diem quotient first) are both wrong"
            - "det430_base != 1938461"
            - "The other two SSO candidates lose: 120% IPPS per-diem is 3,360,000 and IPPS full is 3,400,000"
            - "det430_pct == 53.85 and stay430_pct == 53.85 - round_half_up(53.846166..., 2), not the truncated 53.84"
            - "PaymentDetermination.${det430_id}.outlier_payment_cents == 0 and total_payment_cents == 1938462"

