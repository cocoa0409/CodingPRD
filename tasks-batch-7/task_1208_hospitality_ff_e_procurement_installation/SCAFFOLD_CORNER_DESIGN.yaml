            - "Event remains POSTED; line keeps qty_installable == 4 and qty_installed == 6"

      - name: claim_terminal_outcomes
        claim_type: valid_transition
        grounds: ["state_machines.DamageClaim", "errors[ERR_INVALID_CLAIM_TRANSITION]"]
        distinguishing_aspect: "The three terminal outcomes behave differently by design: DENIED changes nothing; RESOLVED_REPLACEMENT moves damaged units to credited without money; RESOLVED_CREDIT (covered in difficulty) moves money. A SHORTAGE claim type is filed against the finalized shortfall."
        test_recipe:
          setup:
            - "Full pipeline; line 40 x 15000c cube 10; receiving POSTED with 35 received / 4 damaged; shipment RECEIVED (qty_short finalized to 5)"
            - "DAMAGE claim D1 qty 2 SUBMITTED; DAMAGE claim D2 qty 2 SUBMITTED; SHORTAGE claim S1 qty 5 SUBMITTED"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-R11", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 10000000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
