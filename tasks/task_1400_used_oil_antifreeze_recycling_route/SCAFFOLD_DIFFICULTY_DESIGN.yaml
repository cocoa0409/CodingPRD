            - { call: "POST /recycle-routes/routes/${r_id}/dispatch", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/route-stops/${s_id}/arrive", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${s_id}/begin-screening", payload: {}, as: Driver, as_user_id: "${drv_id}" }
          trigger:
            - { call: "POST /recycle-routes/route-stops/${s_id}/sample-screenings", payload: { halogen_ppm: 9999, water_pct: 1.0, ph_level: 7.0 }, as: LabTech }
            - { call: "GET /recycle-routes/route-stops/${s_id}", payload: {}, as: Driver, as_user_id: "${drv_id}", captures: { s_after: "$.data.status" } }
            - { call: "GET /recycle-routes/tanks/${tank_id}", payload: {}, as: EHSOfficer, captures: { t_after: "$.data.quarantine_status" } }
            - { call: "GET /recycle-routes/customers/${cust_id}", payload: {}, as: SettlementClerk, captures: { c_after: "$.data.halogen_violation_count" } }
          assert:
            - "Link 1: SampleScreening.result == FAIL_HALOGEN"
            - "Link 2: RouteStop.${s_id}.status == CANCELLED_HALOGEN"
            - "Link 3: Tank.${tank_id}.quarantine_status == QUARANTINED"
            - "Link 4: Customer.${cust_id}.halogen_violation_count == 1"
            - "Cascade chain: screen FAIL_HALOGEN -> stop cancelled -> tank quarantined -> customer counter incremented"

      - name: spill_reportable_quantity_cascade_depth_2
        grounds:
          - state_machines.SpillIncident.transitions.OPEN_to_UNDER_INVESTIGATION
          - state_machines.TankSite.transitions.ACTIVE_to_CONTAMINATED
          - state_machines.Tank.transitions.CLEAR_to_QUARANTINED
        distinguishing_aspect: |
          Depth-2+ cascade triggered by SpillIncident create with RQ exceeded:
          spill create -> TankSite CONTAMINATED -> all Tanks at site QUARANTINED.
          Different trigger from rule-4 instance 1 (spill vs screening).
        test_recipe:
          setup:
            - "TankSite ACTIVE with two tanks T1, T2, both CLEAR"
            - "Driver on route at this site"
            - "Spill reported with gallons_spilled=30 (>= RQ threshold 25)"
          setup_api_calls:
            - { call: "POST /recycle-routes/customers", payload: { legal_name: "Cascade2", epa_generator_id: "EPAGEN000041", market_zone: "NORTH", credit_terms: "NET30" }, as: RoutePlanner, captures: { cust_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tank-sites", payload: { customer_id: "${cust_id}", site_address: "7 Spill St", density_zone: "URBAN" }, as: RoutePlanner, captures: { site_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks", payload: { tank_site_id: "${site_id}", tank_kind: "USED_OIL", capacity_gallons: 500, ownership: "CUSTOMER_OWNED" }, as: TankInstaller, captures: { t1_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks/${t1_id}/register-existing", payload: {}, as: TankInstaller }
            - { call: "POST /recycle-routes/tanks", payload: { tank_site_id: "${site_id}", tank_kind: "ANTIFREEZE", capacity_gallons: 300, ownership: "CUSTOMER_OWNED" }, as: TankInstaller, captures: { t2_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks/${t2_id}/register-existing", payload: {}, as: TankInstaller }
            - { call: "POST /recycle-routes/customers/${cust_id}/activate", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/drivers", payload: { driver_name: "Cas2", cdl_class: "B", hazmat_endorsement: true }, as: RoutePlanner, captures: { drv_id: "$.data.id" } }
            - { call: "POST /recycle-routes/routes", payload: { route_code: "CAS2", scheduled_date: "2026-08-05", driver_id: "${drv_id}", vehicle_capacity_gallons: 500, density_zone: "URBAN" }, as: RoutePlanner, captures: { r_id: "$.data.id" } }
          trigger:
            - { call: "POST /recycle-routes/spill-incidents", payload: { route_id: "${r_id}", tank_site_id: "${site_id}", gallons_spilled: 30, cause_code: "CUSTOMER_OVERFILL" }, as: Driver, as_user_id: "${drv_id}", captures: { spill_id: "$.data.id", spill_rq: "$.data.reportable_quantity_exceeded" } }
            - { call: "GET /recycle-routes/tank-sites/${site_id}", payload: {}, as: EHSOfficer, captures: { site_after: "$.data.status" } }
            - { call: "GET /recycle-routes/tanks/${t1_id}", payload: {}, as: EHSOfficer, captures: { t1_after: "$.data.quarantine_status" } }
            - { call: "GET /recycle-routes/tanks/${t2_id}", payload: {}, as: EHSOfficer, captures: { t2_after: "$.data.quarantine_status" } }
          assert:
            - "SpillIncident.${spill_id}.reportable_quantity_exceeded == true (30 >= 25)"
            - "Link 1: TankSite.${site_id}.status == CONTAMINATED"
            - "Link 2: Tank.${t1_id}.quarantine_status == QUARANTINED"
            - "Link 2 (parallel): Tank.${t2_id}.quarantine_status == QUARANTINED"
            - "Different trigger from rule-4 instance 1: this cascade fires on spill-incident create, not on screening"

  # ==========================================================================
  # RULE 5 — priority_pair_validation_conflict (different error-category pairs)
  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_arrive
        grounds:
          - validations[priority=5]
          - validations[priority=7]
        distinguishing_aspect: |
          Pair = state (priority 5) vs business_safety (priority 7).
          A request that violates both state (route not dispatched) AND safety
          (tank quarantined) must return the state error (lower priority number
          wins), not the safety error.
        test_recipe:
          setup:
            - "Tank QUARANTINED (safety violation)"
            - "Route still PLANNED (state violation — not dispatched)"
            - "Stop SCHEDULED"
            - "Driver attempts /arrive: both preconditions fail"
          setup_api_calls:
            - { call: "POST /recycle-routes/customers", payload: { legal_name: "PPC1", epa_generator_id: "EPAGEN000050", market_zone: "NORTH", credit_terms: "NET30" }, as: RoutePlanner, captures: { cust_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tank-sites", payload: { customer_id: "${cust_id}", site_address: "10 Ppc Rd", density_zone: "URBAN" }, as: RoutePlanner, captures: { site_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks", payload: { tank_site_id: "${site_id}", tank_kind: "USED_OIL", capacity_gallons: 500, ownership: "CUSTOMER_OWNED" }, as: TankInstaller, captures: { tank_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks/${tank_id}/register-existing", payload: {}, as: TankInstaller }
            - { call: "POST /recycle-routes/tanks/${tank_id}/record-intake", payload: { gallons: 100 }, as: RoutePlanner }
            - { call: "POST /recycle-routes/customers/${cust_id}/activate", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/drivers", payload: { driver_name: "Ppc", cdl_class: "B", hazmat_endorsement: true }, as: RoutePlanner, captures: { drv_id: "$.data.id" } }
            - { call: "POST /recycle-routes/market-prices", payload: { market_zone: "NORTH", tank_kind: "USED_OIL", effective_date: "2026-08-01", price_cents_per_gal: 50 }, as: Regulator }
            - { call: "POST /recycle-routes/routes", payload: { route_code: "PPC1", scheduled_date: "2026-08-05", driver_id: "${drv_id}", vehicle_capacity_gallons: 500, density_zone: "URBAN" }, as: RoutePlanner, captures: { r_id: "$.data.id", r_v: "$.data.version" } }
            - { call: "POST /recycle-routes/routes/${r_id}/route-stops", payload: { tank_site_id: "${site_id}", tank_id: "${tank_id}", scheduled_window_start: "08:00", scheduled_window_end: "09:00", sequence: 1, estimated_volume_gallons: 100, expected_route_version: "${r_v}" }, as: RoutePlanner, captures: { s_id: "$.data.id" } }
            # First quarantine the tank via a separate route + halogen screen
            - { call: "POST /recycle-routes/routes", payload: { route_code: "PPC1-Q", scheduled_date: "2026-08-04", driver_id: "${drv_id}", vehicle_capacity_gallons: 500, density_zone: "URBAN" }, as: RoutePlanner, captures: { rq_id: "$.data.id", rq_v: "$.data.version" } }
            - { call: "POST /recycle-routes/routes/${rq_id}/route-stops", payload: { tank_site_id: "${site_id}", tank_id: "${tank_id}", scheduled_window_start: "08:00", scheduled_window_end: "09:00", sequence: 1, estimated_volume_gallons: 100, expected_route_version: "${rq_v}" }, as: RoutePlanner, captures: { sq_id: "$.data.id" } }
            - { call: "POST /recycle-routes/routes/${rq_id}/dispatch", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/route-stops/${sq_id}/arrive", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${sq_id}/begin-screening", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${sq_id}/sample-screenings", payload: { halogen_ppm: 9999, water_pct: 1.0, ph_level: 7.0 }, as: LabTech }
            # Now: Tank QUARANTINED, but route R1 is still PLANNED (state violation), tank is quarantined (safety violation).
            # Note: the SCHEDULED stop S1 on R1 was cascade-cancelled to CANCELLED_HALOGEN by the quarantine.
            # Recreate a fresh SCHEDULED stop is impossible on quarantined tank; so we re-purpose the scenario:
            # instead, verify that attempting arrive on the (now CANCELLED_HALOGEN) stop returns state error.
            # Actually the cascade cancelled S1, so S1 is in CANCELLED_HALOGEN — arrive on it triggers ERR_STOP_NOT_SCHEDULED (state priority 5), which outranks any safety check.
          trigger:
            - { call: "POST /recycle-routes/route-stops/${s_id}/arrive", payload: {}, as: Driver, as_user_id: "${drv_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "Both state (stop in CANCELLED_HALOGEN, route never dispatched) AND safety (tank quarantined) violations apply"
            - "Response error_id == ERR_STOP_NOT_SCHEDULED (state priority 5 wins over business_safety priority 7)"
            - "HTTP status == 409"

      - name: business_referential_vs_business_fiscal_on_settle
        grounds:
          - validations[priority=14]
          - validations[priority=16]
        distinguishing_aspect: |
          Pair = business_referential (priority 14) vs business_fiscal
          (priority 16). A manifest-submit that fails BOTH the facility-halogen
          check (referential) AND would otherwise trigger a fiscal precondition
          is rejected with the referential error. We manifest this through a
          manifest submit that fails facility acceptance and (were it not
          blocked) would also fail a later fiscal check; the referential error
          must win because it is checked earlier.
        test_recipe:
          setup:
            - "Facility does not accept HALOGENATED stream (referential violation on a halogen-flagged manifest)"
            - "We intentionally drive halogen_flag=true on the manifest by completing a pickup on a previously-quarantined tank"
            - "Setup also has an unrelated Customer with non-zero outstanding_charge_cents to simulate a fiscal constraint that would matter only at settle (priority 16) — but the manifest submit is the endpoint under test, so priority 14 governs"
          setup_api_calls:
            - { call: "POST /recycle-routes/customers", payload: { legal_name: "PPC2", epa_generator_id: "EPAGEN000051", market_zone: "NORTH", credit_terms: "NET30" }, as: RoutePlanner, captures: { cust_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tank-sites", payload: { customer_id: "${cust_id}", site_address: "11 Ppc Rd", density_zone: "URBAN", route_eligibility_override: true }, as: RoutePlanner, captures: { site_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks", payload: { tank_site_id: "${site_id}", tank_kind: "USED_OIL", capacity_gallons: 500, ownership: "CUSTOMER_OWNED" }, as: TankInstaller, captures: { tank_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks/${tank_id}/register-existing", payload: {}, as: TankInstaller }
            - { call: "POST /recycle-routes/tanks/${tank_id}/record-intake", payload: { gallons: 200 }, as: RoutePlanner }
            - { call: "POST /recycle-routes/customers/${cust_id}/activate", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/drivers", payload: { driver_name: "Ppc2", cdl_class: "A", hazmat_endorsement: true }, as: RoutePlanner, captures: { drv_id: "$.data.id" } }
            - { call: "POST /recycle-routes/market-prices", payload: { market_zone: "NORTH", tank_kind: "USED_OIL", effective_date: "2026-08-01", price_cents_per_gal: 50 }, as: Regulator }
            - { call: "POST /recycle-routes/disposal-facilities", payload: { facility_name: "NoHalo TSDF", epa_id: "EPAID002", accepted_streams: ["USED_OIL"], daily_capacity_gallons: 10000 }, as: Regulator, captures: { fac_id: "$.data.id" } }
            # Drive tank into QUARANTINED, clear it, then complete a pickup — halogen_flag becomes true on manifest
            - { call: "POST /recycle-routes/routes", payload: { route_code: "Q-DRIVE", scheduled_date: "2026-08-04", driver_id: "${drv_id}", vehicle_capacity_gallons: 500, density_zone: "URBAN" }, as: RoutePlanner, captures: { rq_id: "$.data.id", rq_v: "$.data.version" } }
            - { call: "POST /recycle-routes/routes/${rq_id}/route-stops", payload: { tank_site_id: "${site_id}", tank_id: "${tank_id}", scheduled_window_start: "08:00", scheduled_window_end: "09:00", sequence: 1, estimated_volume_gallons: 100, expected_route_version: "${rq_v}" }, as: RoutePlanner, captures: { sq_id: "$.data.id" } }
            - { call: "POST /recycle-routes/routes/${rq_id}/dispatch", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/route-stops/${sq_id}/arrive", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${sq_id}/begin-screening", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${sq_id}/sample-screenings", payload: { halogen_ppm: 9999, water_pct: 1.0, ph_level: 7.0 }, as: LabTech }
            - { call: "POST /recycle-routes/tanks/${tank_id}/clear-quarantine", payload: {}, as: EHSOfficer }
            # Now do a real pickup
            - { call: "POST /recycle-routes/routes", payload: { route_code: "PPC2-R", scheduled_date: "2026-08-05", driver_id: "${drv_id}", vehicle_capacity_gallons: 500, density_zone: "URBAN" }, as: RoutePlanner, captures: { r_id: "$.data.id", r_v: "$.data.version" } }
            - { call: "POST /recycle-routes/routes/${r_id}/route-stops", payload: { tank_site_id: "${site_id}", tank_id: "${tank_id}", scheduled_window_start: "10:00", scheduled_window_end: "11:00", sequence: 1, estimated_volume_gallons: 100, expected_route_version: "${r_v}" }, as: RoutePlanner, captures: { s_id: "$.data.id" } }
            - { call: "POST /recycle-routes/routes/${r_id}/manifest", payload: { manifest_tracking_number: "MAN-PPC2", disposal_facility_id: "${fac_id}" }, as: RoutePlanner, captures: { man_id: "$.data.id" } }
            - { call: "POST /recycle-routes/routes/${r_id}/dispatch", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/route-stops/${s_id}/arrive", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${s_id}/begin-screening", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${s_id}/sample-screenings", payload: { halogen_ppm: 10, water_pct: 1.0, ph_level: 7.0 }, as: LabTech }
            - { call: "POST /recycle-routes/route-stops/${s_id}/pickup-tickets", payload: { client_request_id: "PT-PPC2", metered_volume_gallons: 100 }, as: Driver, as_user_id: "${drv_id}" }
            # Manifest now has halogen_flag=true (tank had been previously quarantined)
          trigger:
            - { call: "POST /recycle-routes/manifests/${man_id}/submit", payload: {}, as: RoutePlanner, captures: { err: "$.data.error_id" } }
          assert:
            - "Manifest.${man_id}.halogen_flag == true (tank previously quarantined)"
            - "DisposalFacility.accepted_streams does not include HALOGENATED"
            - "Response error_id == ERR_FACILITY_REJECTS_HALOGENATED (business_referential priority 14)"
            - "No fiscal check (priority 16+) was reached"
            - "HTTP status == 409"

  # ==========================================================================
  # RULE 6 — boundary_precision_check (different metrics/endpoints)
  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: density_zone_minimum_at_exact_threshold
        grounds:
          - calculations.density_zone_minimum
          - calculations.settlement_amount
        distinguishing_aspect: |
          Metric = density-zone minimum-pickup threshold; endpoint =
          POST /route-stops/{id}/pickup-tickets. Boundary is >= inclusive:
          metered == zone_min produces density_fee_cents == 0; metered ==
          zone_min - 1 produces density_fee_cents == 1 gal * fee rate.
        test_recipe:
          setup:
            - "URBAN site, zone_min=50, fee=20c/gal"
            - "Tank with 100 gal on hand"
            - "MarketPrice (NORTH, USED_OIL, 2026-08-01) = +10c/gal"
            - "Stop A: pickup with metered=50 (== zone_min; boundary, inclusive)"
            - "Stop B: pickup with metered=49 (one below)"
          setup_api_calls:
            - { call: "POST /recycle-routes/customers", payload: { legal_name: "Boundary", epa_generator_id: "EPAGEN000060", market_zone: "NORTH", credit_terms: "NET30" }, as: RoutePlanner, captures: { cust_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tank-sites", payload: { customer_id: "${cust_id}", site_address: "50 Bound Ln", density_zone: "URBAN" }, as: RoutePlanner, captures: { site_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks", payload: { tank_site_id: "${site_id}", tank_kind: "USED_OIL", capacity_gallons: 500, ownership: "CUSTOMER_OWNED" }, as: TankInstaller, captures: { tank_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks/${tank_id}/register-existing", payload: {}, as: TankInstaller }
            - { call: "POST /recycle-routes/tanks/${tank_id}/record-intake", payload: { gallons: 200 }, as: RoutePlanner }
            - { call: "POST /recycle-routes/customers/${cust_id}/activate", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/drivers", payload: { driver_name: "Bnd", cdl_class: "B", hazmat_endorsement: true }, as: RoutePlanner, captures: { drv_id: "$.data.id" } }
            - { call: "POST /recycle-routes/market-prices", payload: { market_zone: "NORTH", tank_kind: "USED_OIL", effective_date: "2026-08-01", price_cents_per_gal: 10 }, as: Regulator }
            # Stop A — boundary hit (50)
            - { call: "POST /recycle-routes/routes", payload: { route_code: "BND-A", scheduled_date: "2026-08-05", driver_id: "${drv_id}", vehicle_capacity_gallons: 500, density_zone: "URBAN" }, as: RoutePlanner, captures: { ra_id: "$.data.id", ra_v: "$.data.version" } }
            - { call: "POST /recycle-routes/routes/${ra_id}/route-stops", payload: { tank_site_id: "${site_id}", tank_id: "${tank_id}", scheduled_window_start: "08:00", scheduled_window_end: "09:00", sequence: 1, estimated_volume_gallons: 50, expected_route_version: "${ra_v}" }, as: RoutePlanner, captures: { sa_id: "$.data.id" } }
            - { call: "POST /recycle-routes/routes/${ra_id}/dispatch", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/route-stops/${sa_id}/arrive", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${sa_id}/begin-screening", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${sa_id}/sample-screenings", payload: { halogen_ppm: 10, water_pct: 1.0, ph_level: 7.0 }, as: LabTech }
            # Stop B — boundary miss (49)
            - { call: "POST /recycle-routes/routes", payload: { route_code: "BND-B", scheduled_date: "2026-08-05", driver_id: "${drv_id}", vehicle_capacity_gallons: 500, density_zone: "URBAN" }, as: RoutePlanner, captures: { rb_id: "$.data.id", rb_v: "$.data.version" } }
            - { call: "POST /recycle-routes/routes/${rb_id}/route-stops", payload: { tank_site_id: "${site_id}", tank_id: "${tank_id}", scheduled_window_start: "10:00", scheduled_window_end: "11:00", sequence: 1, estimated_volume_gallons: 49, expected_route_version: "${rb_v}" }, as: RoutePlanner, captures: { sb_id: "$.data.id" } }
            - { call: "POST /recycle-routes/routes/${rb_id}/dispatch", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/route-stops/${sb_id}/arrive", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${sb_id}/begin-screening", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${sb_id}/sample-screenings", payload: { halogen_ppm: 10, water_pct: 1.0, ph_level: 7.0 }, as: LabTech }
          trigger:
            - { call: "POST /recycle-routes/route-stops/${sa_id}/pickup-tickets", payload: { client_request_id: "BND-A-PT", metered_volume_gallons: 50 }, as: Driver, as_user_id: "${drv_id}", captures: { pta: "$.data.id", pta_fee: "$.data.density_fee_cents", pta_net: "$.data.net_amount_cents" } }
            - { call: "POST /recycle-routes/route-stops/${sb_id}/pickup-tickets", payload: { client_request_id: "BND-B-PT", metered_volume_gallons: 49 }, as: Driver, as_user_id: "${drv_id}", captures: { ptb: "$.data.id", ptb_fee: "$.data.density_fee_cents", ptb_net: "$.data.net_amount_cents" } }
          assert:
            - "Boundary AT threshold (metered == 50 == zone_min): PickupTicket.${pta}.density_fee_cents == 0"
            - "Boundary AT threshold: PickupTicket.${pta}.net_amount_cents == 500 (50*10 - 0 - 0)"
            - "One BELOW threshold (metered == 49): PickupTicket.${ptb}.density_fee_cents == 20 ((50-49)*20)"
            - "One BELOW threshold: PickupTicket.${ptb}.net_amount_cents == 470 (49*10 - 0 - 20)"

      - name: vehicle_capacity_at_full_load
        grounds:
          - calculations.route_posture
          - entities.Route.fields.loaded_gallons
        distinguishing_aspect: |
          Metric = route vehicle capacity (a different metric than zone
          minimum); endpoint = POST /route-stops/{id}/pickup-tickets (different
          endpoint than skip-below-minimum). Boundary: loaded_gallons ==
          vehicle_capacity_gallons triggers posture=AT_CAPACITY (>= inclusive);
          loaded == capacity - 1 keeps posture=OPEN.
        test_recipe:
          setup:
            - "Route with vehicle_capacity_gallons = 100"
            - "Two stops, each delivering 50 gal"
            - "After first pickup: loaded=50, posture=OPEN"
            - "After second pickup: loaded=100, posture=AT_CAPACITY (boundary hit)"
            - "Third pickup of 1 gal would be rejected (ERR_ROUTE_CAPACITY_EXCEEDED)"
          setup_api_calls:
            - { call: "POST /recycle-routes/customers", payload: { legal_name: "Bnd Cap", epa_generator_id: "EPAGEN000061", market_zone: "NORTH", credit_terms: "NET30" }, as: RoutePlanner, captures: { cust_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tank-sites", payload: { customer_id: "${cust_id}", site_address: "99 Cap Rd", density_zone: "URBAN", route_eligibility_override: true }, as: RoutePlanner, captures: { site_id: "$.data.id" } }
