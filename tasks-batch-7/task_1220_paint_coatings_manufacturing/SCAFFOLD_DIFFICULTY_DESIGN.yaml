              payload: { batch_id: "${b1}", measured_delta_e: 0.42 }
              as: LabTechnician
              as_user_id: "lab-1"
              captures: { cm1: $.data.id }
            - { call: "POST /coatings/color-matches/${cm1}/approve", payload: {}, as: QCInspector, as_user_id: "qc-1" }
          trigger:
            - { call: "POST /coatings/batches/${b1}/fills", payload: { size_code: "GALLON", actual_fill_g: 4531 }, as: ProductionOperator, captures: { k_edge: $.data.id, st_edge: $.data.status } }
            - { call: "POST /coatings/batches/${b1}/fills", payload: { size_code: "GALLON", actual_fill_g: 4530 }, as: ProductionOperator, captures: { k_under: $.data.id, st_under: $.data.status } }
          assert:
            - "st_edge == IN_STOCK (|4531-4600| == 69 <= tolerance 69, boundary inclusive)"
            - "Container.${k_edge}.fill_variance_g == -69"
            - "st_under == QUARANTINED (|4530-4600| == 70 > 69, one gram past the edge)"
            - "Container.${k_under}.fill_variance_g == -70"

