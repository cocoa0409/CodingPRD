            - call: "POST /settlements/${st_id}/calculate"
              payload: {}
              as: TourAccountant
              as_user_id: "acct-alice"
              captures: { final_adj: $.data.adjusted_gross_cents, final_earn: $.data.artist_earnings_cents, final_coop: $.data.artist_coop_contribution_cents }
          assert:
            - "PROVISIONAL: the settlement-projection response has id == null and status == DRAFT (transient object), gross_receipts_cents == 15915000, ticket_tax_cents == 1273200, facility_fee_cents == 836500, credit_card_fee_cents == 366045, adjusted_gross_cents == 13439255"
            - "PROVISIONAL: total_settlement_expense_cents == 3100000, allowed_expense_cents == 2500000, breakeven_cents == 7500000, artist_base_earnings_cents == 10048367, artist_coop_contribution_cents == 400000, artist_earnings_cents == 9648367"
            - "FINAL: Settlement.${st_id}.status == CALCULATED, gross_receipts_cents == 11400000, ticket_tax_cents == 912000, facility_fee_cents == 630000, credit_card_fee_cents == 262200, adjusted_gross_cents == 9595800"
            - "FINAL: Settlement.${st_id}.total_settlement_expense_cents == 3400000, allowed_expense_cents == 2800000, breakeven_cents == 7800000, artist_base_earnings_cents == 6526430, artist_coop_contribution_cents == 326322, artist_earnings_cents == 6200108"
            - "Variant divergence: ${proj_adj} - ${final_adj} == 3843455 and ${proj_earn} - ${final_earn} == 3448259"
            - "Binding-leg switch: ${proj_coop} == 400000 (50% of the 800000 BUDGETED marketing line, the SHARE leg) while ${final_coop} == 326322 (5% of the 6526430 base, the CAP leg); the two legs are not the same leg"
