# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Marriage License & Vital Records — breadth probe over §1.1-§1.7 surface.
# Walks references/claim-extraction-guide.md section-by-section. Every active
# instance's setup_api_calls is lint-clean against §1.5; excluded_because stubs
# cite a §1.8 instance by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_applicant_minimal_returns_201_and_defaults
        claim_type: Creation
        grounds: [entities.Applicant, endpoints]
        distinguishing_aspect: "POST /applicants with full_name+date_of_birth -> 201; prior_marriage_status defaults NEVER_MARRIED, has_judicial_consent defaults false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /applicants"
              payload: { full_name: "Solo One", date_of_birth: "1990-01-01" }
              as: Clerk
              captures: { aid: $.data.id, pms: $.data.prior_marriage_status, jc: $.data.has_judicial_consent }
          assert:
            - "response status == 201"
            - "Applicant.${aid}.prior_marriage_status == NEVER_MARRIED"
            - "Applicant.${aid}.has_judicial_consent == false"

      - name: create_applicant_missing_full_name_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Applicant.fields.full_name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /applicants omitting required full_name -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /applicants"
              payload: { date_of_birth: "1990-01-01" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: get_applicant_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Applicant, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /applicants/{id} with an unknown UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /applicants/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "response error_id == ERR_NOT_FOUND"

      - name: create_certified_copy_bad_enum_requester_kind_rejected
        claim_type: Type Constraints
        grounds: [entities.CertifiedCopyRequest.fields.requester_kind, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /certified-copies with requester_kind='STRANGER' (not in {PARTY,GOVERNMENT,PUBLIC}) -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A REGISTERED record exists."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-10T09:00:00Z" }
              as: Clerk
            - call: "POST /applicants"
              payload: { full_name: "En A", date_of_birth: "1990-01-01" }
              as: Clerk
              captures: { nA: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "En B", date_of_birth: "1991-02-02" }
              as: Clerk
              captures: { nB: $.data.id }
            - call: "POST /officiants"
              payload: { full_name: "Rev. En", credential_type: "CLERGY", registration_expires_on: "2030-01-01" }
              as: Clerk
              captures: { nofc: $.data.id }
            - call: "POST /applications"
              payload: { applicant_a_id: "${nA}", applicant_b_id: "${nB}", ceremony_county: "Kern" }
              as: Clerk
              captures: { nap: $.data.id }
            - call: "POST /applications/${nap}/submit"
              payload: {}
              as: Clerk
            - call: "POST /applications/${nap}/decide"
              payload: { decision: "APPROVE" }
              as: Clerk
              as_user_id: "clerk-1"
            - call: "GET /applications/${nap}/licenses"
              payload: {}
              as: Clerk
              captures: { nlc: "$.data[0].id" }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-20T12:00:00Z" }
              as: Clerk
            - call: "POST /returns"
              payload: { license_id: "${nlc}", officiant_id: "${nofc}", ceremony_date: "2026-01-20T12:00:00Z" }
              as: Officiant
              as_user_id: "${nofc}"
              captures: { nrt: $.data.id }
            - call: "POST /returns/${nrt}/accept"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
            - call: "GET /records?return_id=${nrt}"
              payload: {}
              as: Clerk
              captures: { nrc: "$.data[0].id" }
          trigger:
            - call: "POST /certified-copies"
              payload: { record_id: "${nrc}", requester_kind: "STRANGER", copies_requested: 1 }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_certified_copy_copies_zero_rejected
        claim_type: Type Constraints
        grounds: [entities.CertifiedCopyRequest.fields.copies_requested, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "copies_requested=0 violates the >=1 constraint -> ERR_INVALID_REQUEST (400); zero-quantity boundary on a distinct field/endpoint from §1.8's threshold boundaries."
        test_recipe:
          setup: ["A REGISTERED record exists."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-10T09:00:00Z" }
              as: Clerk
            - call: "POST /applicants"
              payload: { full_name: "Ze A", date_of_birth: "1990-01-01" }
              as: Clerk
              captures: { zA: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Ze B", date_of_birth: "1991-02-02" }
              as: Clerk
              captures: { zB: $.data.id }
            - call: "POST /officiants"
              payload: { full_name: "Rev. Ze", credential_type: "CLERGY", registration_expires_on: "2030-01-01" }
              as: Clerk
              captures: { zofc: $.data.id }
            - call: "POST /applications"
              payload: { applicant_a_id: "${zA}", applicant_b_id: "${zB}", ceremony_county: "Kern" }
              as: Clerk
              captures: { zap: $.data.id }
            - call: "POST /applications/${zap}/submit"
              payload: {}
              as: Clerk
            - call: "POST /applications/${zap}/decide"
              payload: { decision: "APPROVE" }
              as: Clerk
              as_user_id: "clerk-1"
            - call: "GET /applications/${zap}/licenses"
              payload: {}
              as: Clerk
              captures: { zlc: "$.data[0].id" }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-20T12:00:00Z" }
              as: Clerk
            - call: "POST /returns"
              payload: { license_id: "${zlc}", officiant_id: "${zofc}", ceremony_date: "2026-01-20T12:00:00Z" }
              as: Officiant
              as_user_id: "${zofc}"
              captures: { zrt: $.data.id }
            - call: "POST /returns/${zrt}/accept"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
            - call: "GET /records?return_id=${zrt}"
              payload: {}
              as: Clerk
              captures: { zrc: "$.data[0].id" }
          trigger:
            - call: "POST /certified-copies"
              payload: { record_id: "${zrc}", requester_kind: "PUBLIC", copies_requested: 0 }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: officiant_returns_filed_count_is_computed
        claim_type: Computed Fields
        grounds: [entities.Officiant.fields.returns_filed_count]
        distinguishing_aspect: "After one ACCEPTED return, GET /officiants/{id}.returns_filed_count == 1; the field is server-computed, not client-set."
        test_recipe:
          setup: ["One officiant with one ACCEPTED return."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-10T09:00:00Z" }
              as: Clerk
            - call: "POST /applicants"
              payload: { full_name: "Cf A", date_of_birth: "1990-01-01" }
              as: Clerk
              captures: { cfA: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Cf B", date_of_birth: "1991-02-02" }
              as: Clerk
              captures: { cfB: $.data.id }
            - call: "POST /officiants"
              payload: { full_name: "Rev. Cf", credential_type: "CLERGY", registration_expires_on: "2030-01-01" }
              as: Clerk
              captures: { cfofc: $.data.id }
            - call: "POST /applications"
              payload: { applicant_a_id: "${cfA}", applicant_b_id: "${cfB}", ceremony_county: "Kern" }
              as: Clerk
              captures: { cfap: $.data.id }
            - call: "POST /applications/${cfap}/submit"
              payload: {}
              as: Clerk
            - call: "POST /applications/${cfap}/decide"
              payload: { decision: "APPROVE" }
              as: Clerk
              as_user_id: "clerk-1"
            - call: "GET /applications/${cfap}/licenses"
              payload: {}
              as: Clerk
              captures: { cflc: "$.data[0].id" }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-20T12:00:00Z" }
              as: Clerk
            - call: "POST /returns"
              payload: { license_id: "${cflc}", officiant_id: "${cfofc}", ceremony_date: "2026-01-20T12:00:00Z" }
              as: Officiant
              as_user_id: "${cfofc}"
              captures: { cfrt: $.data.id }
            - call: "POST /returns/${cfrt}/accept"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
          trigger:
            - call: "GET /officiants/${cfofc}"
              payload: {}
              as: Clerk
              captures: { rfc: $.data.returns_filed_count }
          assert:
            - "Officiant.${cfofc}.returns_filed_count == 1"

      - name: license_computed_fields_present_on_issue
        claim_type: Computed Fields
        grounds: [entities.MarriageLicense.fields.valid_from, entities.MarriageLicense.fields.expires_at]
        distinguishing_aspect: "On issuance the license carries valid_from=2026-01-13T09:00:00Z and expires_at=2026-04-10T09:00:00Z (issued_at 2026-01-10T09:00:00Z + 72h / +90d)."
        test_recipe:
          setup: ["Clock at 2026-01-10T09:00:00Z; application approved."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-10T09:00:00Z" }
              as: Clerk
            - call: "POST /applicants"
              payload: { full_name: "Cv A", date_of_birth: "1990-01-01" }
              as: Clerk
              captures: { cvA: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Cv B", date_of_birth: "1991-02-02" }
              as: Clerk
              captures: { cvB: $.data.id }
            - call: "POST /applications"
              payload: { applicant_a_id: "${cvA}", applicant_b_id: "${cvB}", ceremony_county: "Kern" }
              as: Clerk
              captures: { cvap: $.data.id }
            - call: "POST /applications/${cvap}/submit"
              payload: {}
              as: Clerk
            - call: "POST /applications/${cvap}/decide"
              payload: { decision: "APPROVE" }
              as: Clerk
              as_user_id: "clerk-1"
          trigger:
            - call: "GET /applications/${cvap}/licenses"
              payload: {}
              as: Clerk
              captures: { cv_vf: "$.data[0].valid_from", cv_ex: "$.data[0].expires_at" }
          assert:
            - "MarriageLicense.valid_from == 2026-01-13T09:00:00Z"
            - "MarriageLicense.expires_at == 2026-04-10T09:00:00Z"

      - name: ledger_entry_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.FeeLedgerEntry]
        distinguishing_aspect: "FeeLedgerEntry has common_fields:false — it carries id+created_at only, no version, and is append-only (no update/state endpoint exists)."
        test_recipe:
          setup: ["An application chain with a license CHARGE ledger row."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-10T09:00:00Z" }
              as: Clerk
            - call: "POST /applicants"
              payload: { full_name: "Lg A", date_of_birth: "1990-01-01" }
              as: Clerk
              captures: { lgA: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Lg B", date_of_birth: "1991-02-02" }
              as: Clerk
              captures: { lgB: $.data.id }
            - call: "POST /applications"
              payload: { applicant_a_id: "${lgA}", applicant_b_id: "${lgB}", ceremony_county: "Kern" }
              as: Clerk
              captures: { lgap: $.data.id }
            - call: "POST /applications/${lgap}/submit"
              payload: {}
              as: Clerk
            - call: "POST /applications/${lgap}/decide"
              payload: { decision: "APPROVE" }
              as: Clerk
              as_user_id: "clerk-1"
          trigger:
            - call: "GET /applications/${lgap}/ledger"
              payload: {}
              as: Clerk
              captures: { lg_kind: "$.data[0].kind", lg_amt: "$.data[0].amount_cents" }
          assert:
            - "GET /applications/${lgap}/ledger returns exactly 1 FeeLedgerEntry with kind=CHARGE amount_cents=9000 source_entity=LICENSE"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: new_application_starts_in_draft
        claim_type: Initial State
        grounds: [state_machines.MarriageApplication.initial_state]
        distinguishing_aspect: "POST /applications -> the new application's status is DRAFT."
        test_recipe:
          setup: ["Two applicants exist."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_name: "Is A", date_of_birth: "1990-01-01" }
              as: Clerk
              captures: { isA: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Is B", date_of_birth: "1991-02-02" }
              as: Clerk
              captures: { isB: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { applicant_a_id: "${isA}", applicant_b_id: "${isB}", ceremony_county: "Kern" }
              as: Clerk
              captures: { isap: $.data.id, isstatus: $.data.status }
          assert:
            - "MarriageApplication.${isap}.status == DRAFT"

      - name: decide_application_from_draft_without_submit_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.MarriageApplication.UNDER_REVIEW_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /applications/{id}/decide on a DRAFT (never submitted) application -> ERR_INVALID_STATE (409); decide is only defined from UNDER_REVIEW."
        test_recipe:
          setup: ["A DRAFT application (not submitted)."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_name: "Iv A", date_of_birth: "1990-01-01" }
              as: Clerk
              captures: { ivA: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Iv B", date_of_birth: "1991-02-02" }
              as: Clerk
              captures: { ivB: $.data.id }
            - call: "POST /applications"
              payload: { applicant_a_id: "${ivA}", applicant_b_id: "${ivB}", ceremony_county: "Kern" }
              as: Clerk
              captures: { ivap: $.data.id }
          trigger:
            - call: "POST /applications/${ivap}/decide"
              payload: { decision: "APPROVE" }
              as: Clerk
              as_user_id: "clerk-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response error_id == ERR_INVALID_STATE"
            - "MarriageApplication.${ivap}.status == DRAFT"

      - name: reject_an_already_accepted_return_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.OfficiantReturn.SUBMITTED_to_REJECTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /returns/{id}/reject on an already-ACCEPTED return -> ERR_INVALID_STATE (409); reject is only defined from SUBMITTED."
        test_recipe:
          setup: ["A return already ACCEPTED."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-10T09:00:00Z" }
              as: Clerk
            - call: "POST /applicants"
              payload: { full_name: "Id A", date_of_birth: "1990-01-01" }
              as: Clerk
              captures: { idA: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Id B", date_of_birth: "1991-02-02" }
              as: Clerk
              captures: { idB: $.data.id }
            - call: "POST /officiants"
              payload: { full_name: "Rev. Id", credential_type: "CLERGY", registration_expires_on: "2030-01-01" }
              as: Clerk
              captures: { idofc: $.data.id }
            - call: "POST /applications"
              payload: { applicant_a_id: "${idA}", applicant_b_id: "${idB}", ceremony_county: "Kern" }
              as: Clerk
              captures: { idap: $.data.id }
            - call: "POST /applications/${idap}/submit"
              payload: {}
              as: Clerk
            - call: "POST /applications/${idap}/decide"
              payload: { decision: "APPROVE" }
              as: Clerk
              as_user_id: "clerk-1"
            - call: "GET /applications/${idap}/licenses"
              payload: {}
              as: Clerk
              captures: { idlc: "$.data[0].id" }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-20T12:00:00Z" }
              as: Clerk
            - call: "POST /returns"
              payload: { license_id: "${idlc}", officiant_id: "${idofc}", ceremony_date: "2026-01-20T12:00:00Z" }
              as: Officiant
              as_user_id: "${idofc}"
              captures: { idrt: $.data.id }
            - call: "POST /returns/${idrt}/accept"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
          trigger:
            - call: "POST /returns/${idrt}/reject"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response error_id == ERR_INVALID_STATE"
            - "OfficiantReturn.${idrt}.status == ACCEPTED"

      - name: seal_record_then_amend_blocked_terminal
        claim_type: Terminal State Lockdown
        grounds: [state_machines.MarriageRecord.REGISTERED_to_SEALED, state_machines.AmendmentRequest.SUBMITTED_to_APPLIED, "errors[ERR_RECORD_SEALED]"]
        distinguishing_aspect: "Applying an amendment to a SEALED record -> ERR_RECORD_SEALED (409); SEALED is terminal and blocks amendment APPLY."
        test_recipe:
          setup: ["A SEALED record with a SUBMITTED CLERICAL amendment created before sealing."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-10T09:00:00Z" }
              as: Clerk
            - call: "POST /applicants"
              payload: { full_name: "Tl A", date_of_birth: "1990-01-01" }
              as: Clerk
              captures: { tlA: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Tl B", date_of_birth: "1991-02-02" }
              as: Clerk
              captures: { tlB: $.data.id }
            - call: "POST /officiants"
              payload: { full_name: "Rev. Tl", credential_type: "CLERGY", registration_expires_on: "2030-01-01" }
              as: Clerk
              captures: { tlofc: $.data.id }
            - call: "POST /applications"
              payload: { applicant_a_id: "${tlA}", applicant_b_id: "${tlB}", ceremony_county: "Kern" }
              as: Clerk
              captures: { tlap: $.data.id }
            - call: "POST /applications/${tlap}/submit"
              payload: {}
              as: Clerk
            - call: "POST /applications/${tlap}/decide"
              payload: { decision: "APPROVE" }
              as: Clerk
              as_user_id: "clerk-1"
            - call: "GET /applications/${tlap}/licenses"
              payload: {}
              as: Clerk
              captures: { tllc: "$.data[0].id" }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-20T12:00:00Z" }
              as: Clerk
            - call: "POST /returns"
              payload: { license_id: "${tllc}", officiant_id: "${tlofc}", ceremony_date: "2026-01-20T12:00:00Z" }
              as: Officiant
              as_user_id: "${tlofc}"
              captures: { tlrt: $.data.id }
            - call: "POST /returns/${tlrt}/accept"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
            - call: "GET /records?return_id=${tlrt}"
              payload: {}
              as: Clerk
              captures: { tlrc: "$.data[0].id" }
            - call: "POST /amendments"
              payload: { record_id: "${tlrc}", amendment_type: "CLERICAL", field_path: "spouse_a_name", new_value: "Tl Alpha" }
              as: Applicant
              as_user_id: "${tlA}"
              captures: { tlam: $.data.id }
            - call: "POST /records/${tlrc}/seal"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
          trigger:
            - call: "POST /amendments/${tlam}/decide"
              payload: { decision: "APPLY" }
              as: Registrar
              as_user_id: "registrar-2"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response error_id == ERR_RECORD_SEALED"
            - "AmendmentRequest.${tlam}.status == SUBMITTED"

      - name: amendment_resubmit_limit_reached
        claim_type: cyclic
        grounds: [state_machines.AmendmentRequest.RETURNED_FOR_INFO_to_SUBMITTED, "errors[ERR_RESUBMIT_LIMIT_REACHED]"]
        distinguishing_aspect: "A third resubmit (resubmit_count already 2 == MAX_AMENDMENT_RESUBMITS) -> ERR_RESUBMIT_LIMIT_REACHED (409); cycle termination condition enforced."
        test_recipe:
          setup: ["A CLERICAL amendment cycled to resubmit_count=2, currently RETURNED_FOR_INFO again."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-10T09:00:00Z" }
              as: Clerk
            - call: "POST /applicants"
              payload: { full_name: "Rl A", date_of_birth: "1990-01-01" }
              as: Clerk
              captures: { rlA: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Rl B", date_of_birth: "1991-02-02" }
              as: Clerk
              captures: { rlB: $.data.id }
            - call: "POST /officiants"
              payload: { full_name: "Rev. Rl", credential_type: "CLERGY", registration_expires_on: "2030-01-01" }
              as: Clerk
              captures: { rlofc: $.data.id }
            - call: "POST /applications"
              payload: { applicant_a_id: "${rlA}", applicant_b_id: "${rlB}", ceremony_county: "Kern" }
              as: Clerk
              captures: { rlap: $.data.id }
            - call: "POST /applications/${rlap}/submit"
              payload: {}
              as: Clerk
            - call: "POST /applications/${rlap}/decide"
