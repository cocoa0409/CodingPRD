# ============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Human Milk Bank Donor Screening & Pasteurization (task 2821)
# 9 rule_id blocks / 19 instances. Every numeric literal in `assert:` was
# computed by executing the corresponding §1.3 formula in Python.
# ============================================================================

scaffold_difficulty_design:

  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: shipment_reimbursement_provisional_vs_final_divergence
        grounds:
          - calculations.shipment_reimbursement
          - entities.Shipment.fields.estimated_reimbursement_cents
          - entities.Shipment.fields.final_reimbursement_cents
          - entities.Shipment.fields.credited_reimbursement_cents
          - entities.Donor.fields.reimbursement_balance_cents
          - state_machines.Shipment.IN_TRANSIT_to_ACCEPTED
        distinguishing_aspect: |
          This instance is dual-variant money accounting on the Shipment entity: the
          PROVISIONAL_AT_DISPATCH variant pins excursion_penalty_rate to 0 and yields 2952,
          while FINAL_AT_RECEIPT applies min(0.60, 0.02 * 7) = 0.14 to the identical cooler
          and yields 2538, so the same stored row carries two different amounts at once.
        test_recipe:
          setup:
            - "Logical clock is 2026-08-05T08:00:00Z."
            - "Donor DNR-1004 lives in zone Z2 and is QUALIFIED with reimbursement_balance_cents 0."
            - "Shipment TRK-1004 is IN_TRANSIT with container_count 3 and uses_dry_ice true, and already carries estimated_reimbursement_cents 2952 from the PROVISIONAL_AT_DISPATCH variant."
          setup_api_calls:
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-05T08:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
            - { call: "POST /milk-bank/donors", payload: { donor_code: "DNR-1004", full_name: "Dia Vega", email: "dia.vega@example.org", zone_code: "Z2" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { dv: "$.data.id" } }
            - { call: "POST /milk-bank/donors/${dv}/health-history", payload: { medication_flag_count: 2, travel_risk_flag: false, tobacco_use: false, alcohol_units_per_week: 3, months_postpartum: 15 }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
            - { call: "POST /milk-bank/donors/${dv}/serology-panels", payload: { collected_on: "2026-07-20", hiv_result: "NON_REACTIVE", htlv_result: "NON_REACTIVE", hbv_result: "NON_REACTIVE", hcv_result: "NON_REACTIVE", syphilis_result: "NON_REACTIVE" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${dv}/physician-approvals", payload: { physician_npi: "1234567893", approved_on: "2026-07-15" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${dv}/qualify", payload: {}, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/shipments", payload: { donor_id: "${dv}", tracking_code: "TRK-1004", container_count: 3, uses_dry_ice: true, declared_volume_ml: 1200, shipped_on: "2026-08-02" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { sh: "$.data.id" } }
          trigger:
            - { call: "POST /milk-bank/shipments/${sh}/receive", payload: { excursion_minutes: 7, arrival_max_temp_celsius: -18.0, verified_volume_ml: 1200 }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
          assert:
            - "Shipment.${sh}.estimated_reimbursement_cents == 2952"
            - "Shipment.${sh}.final_reimbursement_cents == 2538"
            - "Shipment.${sh}.estimated_reimbursement_cents != Shipment.${sh}.final_reimbursement_cents"
            - "Shipment.${sh}.credited_reimbursement_cents == 2538"
            - "Shipment.${sh}.status == ACCEPTED"
            - "Donor.${dv}.reimbursement_balance_cents == 2538"

      - name: donor_risk_screening_vs_surveillance_divergence
        grounds:
          - calculations.donor_risk_score
          - entities.Donor.fields.screening_risk_score
          - entities.Donor.fields.surveillance_risk_score
          - entities.Donor.fields.temporary_deferral_count
          - state_machines.Donor.TEMPORARILY_DEFERRED_to_SCREENING
          - state_machines.Donor.SCREENING_to_INFO_REQUESTED
          - validations[priority=43]
        distinguishing_aspect: |
          This instance is dual-variant risk scoring on the Donor entity — a different entity
          domain and a different subject from the Shipment money calculation: on identical
          stored data SCREENING_WORST_CASE returns 65 (base 30 + serology penalty 20 + one
          undecayed temporary deferral 15) while SURVEILLANCE_DECAYED returns 37 (base 30 +
          15 * 0.5 ** (181/180) = 7.471174404154314, rounded half-up), and the 65 is what
          triages the questionnaire into INFO_REQUESTED.
        test_recipe:
          setup:
            - "The logical clock is never set, so it holds its mandatory startup default 2026-08-01T00:00:00Z."
            - "Donor DNR-1005 has submitted one questionnaire (2 flagged medications, no travel, no tobacco, 3 alcohol units, 15 months postpartum), giving base 30."
            - "The donor has no SerologyPanel at all, so the SCREENING_WORST_CASE variant carries the 20-point pending-serology penalty."
            - "The donor served one TEMPORARY deferral effective 2026-02-01 for 30 days and has been requalified, so temporary_deferral_count is 1 and that DeferralEvent is EXPIRED but still scored."
            - "Donor status is SCREENING."
          setup_api_calls:
            - { call: "POST /milk-bank/donors", payload: { donor_code: "DNR-1005", full_name: "Eve Nolan", email: "eve.nolan@example.org", zone_code: "Z1" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { dn: "$.data.id" } }
            - { call: "POST /milk-bank/donors/${dn}/health-history", payload: { medication_flag_count: 2, travel_risk_flag: false, tobacco_use: false, alcohol_units_per_week: 3, months_postpartum: 15 }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
            - { call: "POST /milk-bank/donors/${dn}/deferrals", payload: { reason_code: "ILLNESS", deferral_type: "TEMPORARY", effective_from: "2026-02-01", deferral_days: 30, lookback_days: 0, recall_scope: "NONE" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${dn}/requalify", payload: {}, as: MedicalDirector, as_user_id: "u-md-1" }
          trigger:
            - { call: "POST /milk-bank/donors/${dn}/health-history", payload: { medication_flag_count: 2, travel_risk_flag: false, tobacco_use: false, alcohol_units_per_week: 3, months_postpartum: 15 }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
          assert:
            - "Donor.${dn}.screening_risk_score == 65"
            - "Donor.${dn}.surveillance_risk_score == 37"
            - "Donor.${dn}.screening_risk_score != Donor.${dn}.surveillance_risk_score"
            - "Donor.${dn}.temporary_deferral_count == 1"
            - "the newest row from GET /milk-bank/donors/${dn}/health-history has status INFO_REQUESTED with base_risk_points 30 and screening_risk_score 65"
            - "Donor.${dn}.status == INFO_REQUESTED"

  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: reimbursement_per_container_rounding_order
        grounds:
          - calculations.shipment_reimbursement
          - calculations.shipment_reimbursement.precision
          - entities.Shipment.fields.container_count
          - entities.Shipment.fields.uses_dry_ice
          - entities.Donor.fields.reimbursement_balance_cents
        distinguishing_aspect: |
          Mode (b) — order of operations inside one formula. The formula rounds the
          per-container amount FIRST and multiplies the rounded cents by container_count.
          Zone Z2 with 3 containers and dry ice gives an unrounded per-container amount of
          (1850 / 3) * 1.15 + 275 = 984.1666666666667: rounding first yields 984 * 3 = 2952,
          while summing first and rounding once yields round_half_up(2952.5) = 2953. Only the
          declared order produces 2952, so a 1-cent gap convicts the wrong order.
        test_recipe:
          setup:
            - "Logical clock is 2026-08-05T08:00:00Z."
            - "Donor DNR-1006 is QUALIFIED in zone Z2 with reimbursement_balance_cents 0."
            - "Shipment TRK-1006 is IN_TRANSIT with container_count 3 and uses_dry_ice true."
            - "The cooler arrives with zero excursion minutes, so the excursion penalty rate is 0.00 and both variants collapse onto the same rounding question."
          setup_api_calls:
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-05T08:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
            - { call: "POST /milk-bank/donors", payload: { donor_code: "DNR-1006", full_name: "Fay Ibarra", email: "fay.ibarra@example.org", zone_code: "Z2" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { fi: "$.data.id" } }
            - { call: "POST /milk-bank/donors/${fi}/health-history", payload: { medication_flag_count: 2, travel_risk_flag: false, tobacco_use: false, alcohol_units_per_week: 3, months_postpartum: 15 }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
            - { call: "POST /milk-bank/donors/${fi}/serology-panels", payload: { collected_on: "2026-07-20", hiv_result: "NON_REACTIVE", htlv_result: "NON_REACTIVE", hbv_result: "NON_REACTIVE", hcv_result: "NON_REACTIVE", syphilis_result: "NON_REACTIVE" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${fi}/physician-approvals", payload: { physician_npi: "1234567893", approved_on: "2026-07-15" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${fi}/qualify", payload: {}, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/shipments", payload: { donor_id: "${fi}", tracking_code: "TRK-1006", container_count: 3, uses_dry_ice: true, declared_volume_ml: 1200, shipped_on: "2026-08-02" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { sh: "$.data.id" } }
          trigger:
            - { call: "POST /milk-bank/shipments/${sh}/receive", payload: { excursion_minutes: 0, arrival_max_temp_celsius: -18.0, verified_volume_ml: 1200 }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
          assert:
            - "Shipment.${sh}.estimated_reimbursement_cents == 2952"
            - "Shipment.${sh}.final_reimbursement_cents == 2952"
            - "Shipment.${sh}.final_reimbursement_cents != 2953"
            - "Shipment.${sh}.credited_reimbursement_cents == 2952"
            - "Donor.${fi}.reimbursement_balance_cents == 2952"

      - name: dispense_fee_tier_read_before_split
        grounds:
          - calculations.dispense_fee_allocation
          - entities.Dispense.fields.tier_discount_pct
          - entities.Dispense.fields.gross_fee_cents
          - entities.Dispense.fields.subsidy_cents
          - entities.Dispense.fields.payer_due_cents
          - entities.SubsidyProgram.fields.consumed_cents
        distinguishing_aspect: |
          Mode (c) — a pinned nine-step order, and specifically step 3: the volume discount
          tier is read from the prescription's cumulative_dispensed_ml BEFORE this fill is
          added, then the gross is split into subsidy and payer share. With 1800 ml already
          filled, the third fill of 300 ml sits below the 2000 ml tier-1 boundary and takes
          0.00 discount for gross 2400 * 0.6 = 1440 subsidy; reading the tier after the fill
          (cumulative 2100) would apply 0.05 and yield 1368 / 821 / 547 instead. This is a
          different formula and a different mode from the per-container rounding instance.
        test_recipe:
          setup:
            - "Milk lot 20260810-001-01 is RELEASED with 2100 ml available and kcal_per_oz 20.14."
            - "SubsidyProgram SUB-2026 is OPEN with coverage_pct 0.60 and annual_cap_cents 100000."
            - "Prescription RX-0002 is a CRITICAL NICU_INPATIENT order for 2100 ml (priority_tier 1) backed by SUB-2026."
            - "Two fills have already been made against it: 1000 ml then 800 ml, so cumulative_dispensed_ml is 1800 and consumed_cents is 5184."
          setup_api_calls:
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-05T08:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
