              captures: { bed_a: $.data.id }
            - call: "POST /shelter-beds"
              payload: { shelter_site: "Haven", bed_label: "B1" }
              as: ShelterCoordinator
              as_user_id: "${sc_id}"
              captures: { bed_b: $.data.id }
            - call: "POST /clients/${c_id}/shelter-stays"
              payload: { bed_id: "${bed_a}", check_in_date: "2026-08-10", planned_nights: 2 }
              as: ShelterCoordinator
              as_user_id: "${sc_id}"
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /clients/${c_id}/shelter-stays"
              payload: { bed_id: "${bed_b}", check_in_date: "2026-08-11", planned_nights: 1 }
              as: ShelterCoordinator
              as_user_id: "${sc_id}"
              captures: { overlap_err: $.data.error_id }
            - call: "POST /clients/${c_id}/shelter-stays"
              payload: { bed_id: "${bed_b}", check_in_date: "2026-08-12", planned_nights: 1 }
              as: ShelterCoordinator
              as_user_id: "${sc_id}"
              captures: { s2_id: $.data.id, s2_status: $.data.status }
          assert:
            - "check_in 2026-08-11 on bed B -> 409 ERR_CLIENT_STAY_OVERLAP (night 08-11 already occupied by stay ${s1_id})"
            - "check_in 2026-08-12 on bed B -> RESERVED (turnover day: night sets {08-10,08-11} and {08-12} are disjoint)"
            - "both stays queryable via GET /shelter-stays?client_id with statuses RESERVED"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant: fund cents conserved across approve+expire
  # vs pantry units/points conserved across checkout+void (different conserved
  # quantities).
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: approve_then_expire_restores_fund_committed_exactly
        grounds:
          - calculations.fund_remaining
          - state_machines.EmergencyGrantApplication.APPROVED_to_EXPIRED
          - state_machines.GrantFund.EXHAUSTED_to_OPEN
        distinguishing_aspect: |
          Conserved quantity = fund cents: the invariant committed + disbursed + remaining
          == allocated holds before approval, after approval, and after the compensating
          expiry; the approve(+150000 committed) paired with the sweep-expire returns every
          derived figure to its pre-approval value (committed 0, remaining 300000).
        test_recipe:
          setup:
            - "ACTIVE client with VERIFIED assessment; GrantReviewer; fund allocated 300000"
            - "Application APPROVED for 150000 at 2026-08-01T00:00:00Z (committed 150000, remaining 150000)"
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "C Co", email: "coord@hub.test", staff_role: "INTAKE_COORDINATOR" }
              as: HubAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /staff"
              payload: { full_name: "R Re", email: "rev@hub.test", staff_role: "GRANT_REVIEWER" }
              as: HubAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /clients"
              payload: { alias_name: "fenn", contact_channel: "EMAIL", population_type: "COMMUNITY_RESIDENT" }
              as: Anonymous
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /clients/${c_id}/assessments"
              payload: { household_size: 1, monthly_income_cents: 60000, housing_status: "STABLE", dependents_under_18: 0, receives_snap: false, receives_childcare_subsidy: false, food_insecurity_score: 2, consent_confidential: true }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { a_id: $.data.id }
            - call: "POST /clients/${c_id}/assessments/${a_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /clients/${c_id}/assessments/${a_id}/verify"
              payload: { expected_client_version: "${c_v}" }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /grant-funds"
              payload: { fund_name: "FY26-conserve", fiscal_year: 2026, allocated_cents: 300000 }
              as: HubAdmin
              captures: { f_id: $.data.id, f_v: $.data.version }
            - call: "POST /clients/${c_id}/grant-applications"
              payload: { fund_id: "${f_id}", category: "RENT", requested_cents: 150000, hardship_statement: "x" }
              as: Client
              as_user_id: "${c_id}"
              captures: { g_id: $.data.id }
            - call: "POST /grant-applications/${g_id}/submit"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /grant-applications/${g_id}/begin-review"
              payload: {}
              as: GrantReviewer
              as_user_id: "${rev_id}"
            - call: "POST /grant-applications/${g_id}/approve"
              payload: { expected_fund_version: "${f_v}" }
              as: GrantReviewer
              as_user_id: "${rev_id}"
              captures: { g_appr: $.data.approved_cents }
            - call: "GET /grant-funds/${f_id}"
              as: GrantReviewer
              as_user_id: "${rev_id}"
              captures: { comm_mid: $.data.committed_cents, rem_mid: $.data.remaining_committed_basis }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:01Z" }
              as: HubAdmin
            - call: "POST /_sweeps/run_pending_transitions"
              payload: {}
              as: HubAdmin
              captures: { swept: $.data.grants_expired }
            - call: "GET /grant-funds/${f_id}"
              as: GrantReviewer
              as_user_id: "${rev_id}"
              captures: { comm_end: $.data.committed_cents, disb_end: $.data.disbursed_cents, rem_end: $.data.remaining_committed_basis, st_end: $.data.status }
          assert:
            - "after approve: approved_cents == 150000, committed == 150000, remaining_committed == 150000; invariant 150000 + 0 + 150000 == 300000 holds"
            - "sweep: grants_expired == 1 (now 2026-08-04T00:00:01Z > approved_at + 72h)"
            - "after expiry: committed == 0, disbursed == 0, remaining_committed == 300000 == allocated_cents (full restoration, zero drift)"
            - "invariant holds again: 0 + 0 + 300000 == 300000; fund status OPEN"

      - name: checkout_then_void_restores_stock_points_and_frequency_slot
        grounds:
          - state_machines.PantryVisit.COMPLETED_to_VOIDED
          - calculations.pantry_points
          - calculations.visit_frequency_check
        distinguishing_aspect: |
          Conserved quantities = pantry item units AND client weekly points (distinct from
          fund cents above): a checkout of 2 units / 20 points followed by its compensating
          void returns quantity_on_hand 5 -> 3 -> 5, settled points 0 -> 20 -> 0, clears the
          restock flag set at the threshold crossing, and frees the 168h frequency slot so a
          fresh check-in succeeds immediately.
        test_recipe:
          setup:
            - "ACTIVE client hh=1 (allotment 30); PantryStaff; item cost 10, stock 5, reorder_threshold 3, per_visit_limit 5"
            - "Clock 2026-08-03T10:00:00Z"
            - "Visit v1 completed with 2 units (20 points)"
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "C Co", email: "coord@hub.test", staff_role: "INTAKE_COORDINATOR" }
              as: HubAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /staff"
              payload: { full_name: "P Pa", email: "pantry@hub.test", staff_role: "PANTRY_STAFF" }
              as: HubAdmin
              captures: { ps_id: $.data.id }
            - call: "POST /clients"
              payload: { alias_name: "hazel", contact_channel: "EMAIL", population_type: "COMMUNITY_RESIDENT" }
              as: Anonymous
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /clients/${c_id}/assessments"
              payload: { household_size: 1, monthly_income_cents: 50000, housing_status: "STABLE", dependents_under_18: 0, receives_snap: false, receives_childcare_subsidy: false, food_insecurity_score: 1, consent_confidential: true }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { a_id: $.data.id }
            - call: "POST /clients/${c_id}/assessments/${a_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /clients/${c_id}/assessments/${a_id}/verify"
              payload: { expected_client_version: "${c_v}" }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /pantry-items"
              payload: { item_name: "Oil", category: "SHELF_STABLE", point_cost: 10, quantity_on_hand: 5, reorder_threshold: 3, per_visit_limit: 5 }
              as: HubAdmin
              captures: { i_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: HubAdmin
            - call: "POST /clients/${c_id}/pantry-visits"
              payload: {}
              as: PantryStaff
              as_user_id: "${ps_id}"
              captures: { v1_id: $.data.id }
            - call: "POST /pantry-visits/${v1_id}/line-items"
              payload: { item_id: "${i_id}", quantity: 2 }
              as: PantryStaff
              as_user_id: "${ps_id}"
            - call: "POST /pantry-visits/${v1_id}/checkout"
              payload: {}
              as: PantryStaff
              as_user_id: "${ps_id}"
            - call: "GET /pantry-items"
              payload: {}
              as: PantryStaff
              as_user_id: "${ps_id}"
              captures: { qoh_mid: "$.data[0].quantity_on_hand", flag_mid: "$.data[0].restock_flag" }
          trigger:
            - call: "POST /pantry-visits/${v1_id}/void"
              payload: {}
              as: PantryStaff
              as_user_id: "${ps_id}"
              captures: { v1_status: $.data.status, v1_spent: $.data.points_spent }
            - call: "GET /pantry-items"
              payload: {}
              as: PantryStaff
              as_user_id: "${ps_id}"
              captures: { qoh_end: "$.data[0].quantity_on_hand", flag_end: "$.data[0].restock_flag" }
            - call: "GET /clients/${c_id}"
              as: PantryStaff
              as_user_id: "${ps_id}"
              captures: { settled_end: $.data.pantry_points_spent_settled }
            - call: "POST /clients/${c_id}/pantry-visits"
              payload: {}
              as: PantryStaff
              as_user_id: "${ps_id}"
              captures: { v2_id: $.data.id, v2_status: $.data.status }
          assert:
            - "after checkout: quantity_on_hand == 3 and restock_flag == true (3 <= threshold 3, inclusive crossing)"
            - "void from COMPLETED: visit status VOIDED and points_spent reset to 0"
            - "units conserved: quantity_on_hand back to 5 and restock_flag false"
            - "points conserved: pantry_points_spent_settled back to 0"
            - "frequency slot conserved: VOIDED visits are excluded from the 168h window, so the immediate re-check-in succeeds (${v2_status} == CHECKED_IN)"
