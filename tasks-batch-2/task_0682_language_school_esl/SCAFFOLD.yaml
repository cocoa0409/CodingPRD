scenario: "Language School & ESL Program: placement test & level/track, class schedule & cohort, tuition & visa (I-20/F-1) compliance for international students, attendance & progress/certification, conversation-club/tutoring add-on, immersion/abroad, makeup & withdrawal/refund, corporate/group contract 输出文件夹：tasks/task_0682_language_school_esl"
domain_name: "language-school-esl"
api_prefix: ""

complexity_profile:
  primary_archetype: "Compliance / audit"          # F-1/I-20 full-course-of-study compliance with audit trail and mandatory termination cascades
  secondary_archetype: "Quota / allocation"          # finite cohort seat capacity competed for, reserved on enroll, released on withdraw
  complexity_layers:
    - "Dual-variant calculation"                     # refund: forward-looking pro-rata vs chronological tiered withdrawal schedule (Enrollment); progress: provisional vs final certification score (Student)
    - "Rate / threshold triggers"                    # attendance_rate threshold → academic probation / F-1 termination; corporate discount tiers
    - "Cascading side effects"                        # withdraw → seat release → I-20 termination → certification voided
    - "Optimistic concurrency"                        # OCC on Cohort.version (enroll-with-supersede) and on CorporateContract.version (seat-grant draw-down)

  entity_topology: flat
  # Peer entities (Student, Cohort, Enrollment, AddOnSubscription, ...) linked by FK references, NOT nested URL paths.
  # Enrollment is a junction between Student and Cohort; CorporateContract sponsors many Students cross-cuttingly.

  state_machine_shape: branching
  # Enrollment forks: PLACEMENT_PENDING → {ENROLLED | WAITLISTED}; ENROLLED → {COMPLETED | WITHDRAWN | TERMINATED} with divergent side-effect sets per branch.
  # Student visa_status has a revision cycle (PROBATION ⇄ ACTIVE) layered on a separate dimension.

  relationship_patterns:
    - one_to_many        # Cohort has many Enrollments; Student has many Enrollments; CorporateContract sponsors many Students
    - many_to_many       # Enrollment is the Student×Cohort junction
    - cross_aggregate    # Enrollment.side_effects reach across to Cohort (seats) and Student (visa_status, certification)

  role_model: peer_roles
  # Registrar owns Cohort/Enrollment lifecycle; DSO (Designated School Official) owns I-20/visa compliance; Instructor owns AttendanceRecord/ProgressReport; Student acts on own placement test & add-ons; CorporateSponsor manages own contract. Non-overlapping ownership with a few shared reads.

  consistency_model: immediate
  # All cascades (seat release, visa termination, certification void) are atomic within the triggering request.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Student legal name"
      - name: email
        type: string
        source: input
        description: "Login/contact email; unique among Students"
        constraints: "unique (case-insensitive) across all Students"
      - name: is_international
        type: boolean
        source: input
        description: "True when the student holds (or seeks) F-1 status and requires I-20 management"
        default: false
      - name: corporate_contract_id
        type: string
        source: input
        description: "FK -> CorporateContract.id; null for self-pay students; when set, tuition is billed to the contract"
        default: null
      - name: placement_level
        type: enum
        source: computed
        description: "CEFR level assigned by the most recent SCORED PlacementTest; null until a test is scored"
        constraints: "one of {A1, A2, B1, B2, C1, C2}; null when no scored test"
        default: null
      - name: track
        type: enum
        source: input
        description: "Program track the student is studying in"
        constraints: "one of {GENERAL, ACADEMIC, BUSINESS, EXAM_PREP}"
        default: GENERAL
      - name: visa_status
        type: enum
        source: computed
        description: "F-1 compliance posture; only meaningful when is_international is true; gates new ENROLLED enrollments"
        constraints: "one of {NONE, INITIAL, ACTIVE, PROBATION, TERMINATED}; NONE for non-international"
        default: NONE
      - name: i20_required_weekly_hours
        type: integer
        source: system
        description: "Minimum instructional hours/week for full course of study (F-1); fixed at 18 for international students, 0 otherwise"
        default: 0
      - name: certification_status
        type: enum
        source: computed
        description: "Program certification posture derived from completed enrollments and final progress score"
        constraints: "one of {NONE, PROVISIONAL, CERTIFIED, VOIDED}"
        default: NONE
      - name: final_progress_score
        type: number
        source: computed
        description: "Weighted final progress score (0-100) computed at certification; null until certified"
        default: null

  - name: CorporateContract
    parent: null
    common_fields: true
    fields:
      - name: company_name
        type: string
        source: input
        description: "Sponsoring company name"
      - name: contracted_seats
        type: integer
        source: input
        description: "Total prepaid seats the contract may sponsor across all cohorts"
        constraints: "integer >= 1"
      - name: seats_consumed
        type: integer
        source: computed
        description: "Count of currently ENROLLED enrollments whose student is sponsored by this contract; released on WITHDRAWN/TERMINATED/COMPLETED"
        default: 0
      - name: discount_tier
        type: enum
        source: input
        description: "Volume discount tier applied to every sponsored tuition invoice"
        constraints: "one of {BRONZE, SILVER, GOLD}"
        default: BRONZE
      - name: status
        type: enum
        source: computed
        description: "Contract lifecycle posture"
        constraints: "one of {ACTIVE, EXHAUSTED, CLOSED}"
        default: ACTIVE

  - name: PlacementTest
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the test-taker"
      - name: raw_score
        type: integer
        source: input
        description: "Examiner-entered raw score 0-100; required only when scoring"
        default: null
        constraints: "0 <= raw_score <= 100 when present"
      - name: assigned_level
        type: enum
        source: computed
        description: "CEFR level derived from raw_score via banded thresholds at scoring time"
        constraints: "one of {A1, A2, B1, B2, C1, C2}; null until SCORED"
        default: null
      - name: status
        type: enum
        source: computed
        description: "Test lifecycle"
        constraints: "one of {REGISTERED, SCORED, VOIDED}"
        default: REGISTERED

  - name: Cohort
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Cohort label, e.g. 'B1-Academic-Spring'"
      - name: level
        type: enum
        source: input
        description: "CEFR level this cohort teaches"
        constraints: "one of {A1, A2, B1, B2, C1, C2}"
      - name: track
        type: enum
        source: input
        description: "Program track this cohort serves"
        constraints: "one of {GENERAL, ACADEMIC, BUSINESS, EXAM_PREP}"
      - name: capacity
        type: integer
        source: input
        description: "Maximum count of enrollments allowed in ENROLLED state at once"
        constraints: "integer >= 1"
      - name: weekly_hours
        type: integer
        source: input
        description: "Instructional hours per week this cohort delivers"
        constraints: "integer >= 1"
      - name: term_start
        type: datetime
        source: input
        description: "First session date (term boundary, inclusive)"
      - name: term_end
        type: datetime
        source: input
        description: "Last session date (term boundary, inclusive); term_end > term_start"
      - name: total_sessions
        type: integer
        source: input
        description: "Planned number of class sessions across the term"
        constraints: "integer >= 1"
      - name: base_tuition_cents
        type: integer
        source: input
        description: "Full-term tuition in cents before add-ons and discounts"
        constraints: "integer >= 0"
      - name: seats_taken
        type: integer
        source: computed
        description: "Count of Enrollments on this cohort currently in ENROLLED state"
        default: 0
      - name: schedule_block
        type: enum
        source: input
        description: "Time-of-day block the cohort occupies on its meeting days (used for student double-booking detection)"
        constraints: "one of {MORNING, AFTERNOON, EVENING}"
      - name: status
        type: enum
        source: computed
        description: "Cohort posture derived from seat occupancy: OPEN while seats_taken < capacity, FULL when seats_taken == capacity"
        constraints: "one of {OPEN, FULL}"
        default: OPEN

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the enrolled student"
      - name: cohort_id
        type: string
        source: input
        description: "FK -> Cohort.id; the cohort enrolled into"
      - name: status
        type: enum
        source: computed
        description: "Enrollment lifecycle posture"
        constraints: "one of {PLACEMENT_PENDING, ENROLLED, WAITLISTED, COMPLETED, WITHDRAWN, TERMINATED}"
        default: PLACEMENT_PENDING
      - name: enrolled_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when the enrollment entered ENROLLED (used for refund week computation and FIFO waitlist promotion); null until ENROLLED"
        default: null
      - name: sessions_attended
        type: integer
        source: computed
        description: "Count of AttendanceRecords with status PRESENT for this enrollment"
        default: 0
      - name: sessions_elapsed
        type: integer
        source: computed
        description: "Count of AttendanceRecords (any status) recorded for this enrollment"
        default: 0
      - name: attendance_rate
        type: number
        source: computed
        description: "sessions_attended / sessions_elapsed as a fraction 0-1; 1.0 when sessions_elapsed == 0"
        default: 1.0
      - name: tuition_invoice_cents
        type: integer
        source: computed
        description: "Net tuition billed at ENROLLED time (base + add-ons - corporate discount), pinned at enrollment"
        default: 0
      - name: refund_cents
        type: integer
        source: computed
        description: "Refund issued on WITHDRAWN; 0 in every other state"
        default: 0
      - name: completion_score
        type: number
        source: computed
        description: "Per-enrollment weighted score (attendance + latest progress assessment) computed at COMPLETED"
        default: null
      - name: termination_reason
        type: enum
        source: computed
        description: "Why the enrollment was TERMINATED; null otherwise"
        constraints: "one of {VISA_NONCOMPLIANCE, ATTENDANCE_FAILURE, CONTRACT_REVOKED}; null when not TERMINATED"
        default: null

  - name: AttendanceRecord
    parent: null
    common_fields: false
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment this session record belongs to"
      - name: session_index
        type: integer
        source: input
        description: "1-based ordinal of the session within the term"
        constraints: "1 <= session_index <= cohort.total_sessions; unique per enrollment"
      - name: status
        type: enum
        source: input
        description: "Attendance mark for the session"
        constraints: "one of {PRESENT, ABSENT, EXCUSED}"
      - name: recorded_at
        type: datetime
        source: system
        description: "Logical-clock timestamp the mark was recorded"

  - name: ProgressReport
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment assessed"
      - name: speaking
        type: integer
        source: input
        description: "Speaking sub-score 0-100"
        constraints: "0 <= speaking <= 100"
      - name: listening
        type: integer
        source: input
        description: "Listening sub-score 0-100"
        constraints: "0 <= listening <= 100"
      - name: reading
        type: integer
        source: input
        description: "Reading sub-score 0-100"
        constraints: "0 <= reading <= 100"
      - name: writing
        type: integer
        source: input
        description: "Writing sub-score 0-100"
        constraints: "0 <= writing <= 100"
      - name: assessed_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the assessment (latest-by-assessed_at wins for completion scoring; tie-break created_at ASC)"

  - name: AddOnSubscription
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the subscriber"
      - name: add_on_type
        type: enum
        source: input
        description: "Which supplementary product"
        constraints: "one of {CONVERSATION_CLUB, PRIVATE_TUTORING, IMMERSION_ABROAD}"
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment this add-on is bundled onto (its tuition invoice absorbs the add-on fee)"
      - name: units
        type: integer
        source: input
        description: "Quantity (tutoring hours, club weeks, or immersion weeks abroad)"
        constraints: "integer >= 1"
      - name: fee_cents
        type: integer
        source: computed
        description: "Computed add-on fee in cents (rate x units, with IMMERSION_ABROAD surcharge)"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Add-on lifecycle"
        constraints: "one of {ACTIVE, CANCELLED}"
        default: ACTIVE

  - name: ComplianceEvent
    parent: null
    common_fields: false
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the subject of the compliance action"
      - name: event_type
        type: enum
        source: input
        description: "The visa/compliance action recorded (append-only audit log)"
        constraints: "one of {I20_ISSUED, STATUS_ACTIVATED, PROBATION_PLACED, PROBATION_CLEARED, I20_TERMINATED}"
      - name: prior_status
        type: enum
        source: system
        description: "Student.visa_status immediately before this event"
        constraints: "one of {NONE, INITIAL, ACTIVE, PROBATION, TERMINATED}"
      - name: new_status
        type: enum
        source: system
        description: "Student.visa_status immediately after this event"
        constraints: "one of {NONE, INITIAL, ACTIVE, PROBATION, TERMINATED}"
      - name: reason
        type: string
        source: input
        description: "Free-text justification (DSO note)"
        default: null
      - name: recorded_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the event"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: PlacementTest
    initial_state: REGISTERED
    terminal_states: [SCORED, VOIDED]
    transitions:
      - from: REGISTERED
        to: SCORED
        trigger: "POST /placement-tests/{id}/score"
        actor: Instructor
        preconditions:
          - "raw_score present and 0 <= raw_score <= 100"
          - "test.status == REGISTERED"
        side_effects:
          - "set assigned_level via banded thresholds (calc: placement_band)"
          - "set Student.placement_level = assigned_level (latest scored test wins by recorded_at, tie-break created_at ASC)"
        note: "Scoring is the only path that populates Student.placement_level."
      - from: REGISTERED
        to: VOIDED
        trigger: "POST /placement-tests/{id}/void"
        actor: Registrar
        preconditions:
          - "test.status == REGISTERED"
        side_effects:
          - "no change to Student.placement_level"

  - entity: Enrollment
    initial_state: PLACEMENT_PENDING
    terminal_states: [COMPLETED, WITHDRAWN, TERMINATED]
    transitions:
      - from: PLACEMENT_PENDING
        to: ENROLLED
        trigger: "POST /enrollments/{id}/confirm"
        actor: Registrar
        preconditions:
          - "Student.placement_level == Cohort.level (placement gate)"
          - "Student.track == Cohort.track"
          - "Cohort.status IN {OPEN}"
          - "cohort.seats_taken < cohort.capacity"
          - "if Student.is_international: Student.visa_status IN {INITIAL, ACTIVE}"
          - "no other ENROLLED enrollment for this student on a cohort with the same schedule_block whose term overlaps this cohort's term (closed-interval overlap)"
          - "expected_cohort_version matches cohort.version"
        side_effects:
          - "set enrolled_at = current logical clock"
          - "compute tuition_invoice_cents (calc: tuition_invoice)"
          - "increment Cohort.seats_taken by 1; if seats_taken reaches capacity set Cohort.status = FULL"
          - "if student sponsored: increment CorporateContract.seats_consumed by 1; if it reaches contracted_seats set contract.status = EXHAUSTED"
          - "increments Cohort.version by 1"
      - from: PLACEMENT_PENDING
        to: WAITLISTED
        trigger: "POST /enrollments/{id}/confirm"
        actor: Registrar
        preconditions:
          - "Student.placement_level == Cohort.level"
          - "Student.track == Cohort.track"
          - "Cohort.status == FULL OR cohort.seats_taken >= cohort.capacity"
          - "expected_cohort_version matches cohort.version"
        side_effects:
          - "no seat consumed; enrollment parked behind any earlier WAITLISTED enrollments (FIFO by created_at ASC)"
          - "increments Cohort.version by 1"
        note: "Confirm forks ENROLLED vs WAITLISTED on remaining capacity; divergent side-effect sets."
      - from: WAITLISTED
        to: ENROLLED
        trigger: "System: promotion when a seat frees on the cohort"
        actor: system
        preconditions:
          - "a seat frees (a sibling enrollment leaves ENROLLED)"
          - "this enrollment is the earliest WAITLISTED on the cohort by created_at ASC"
          - "if Student.is_international: Student.visa_status IN {INITIAL, ACTIVE}"
        side_effects:
          - "set enrolled_at = current logical clock"
          - "compute tuition_invoice_cents (calc: tuition_invoice)"
          - "increment Cohort.seats_taken by 1"
          - "if student sponsored: increment CorporateContract.seats_consumed by 1"
        note: "Bubble-up promotion is part of the withdraw/terminate cascade chain."
      - from: ENROLLED
        to: COMPLETED
        trigger: "POST /enrollments/{id}/complete"
        actor: Registrar
        preconditions:
          - "current logical clock >= Cohort.term_end"
          - "enrollment.attendance_rate >= MIN_PASS_ATTENDANCE"
          - "at least one ProgressReport exists for this enrollment"
        side_effects:
          - "compute completion_score (calc: completion_score)"
          - "decrement Cohort.seats_taken by 1 (seat released for waitlist promotion)"
          - "if student sponsored: decrement CorporateContract.seats_consumed by 1"
          - "recompute Student.certification_status (calc: certification_rollup)"
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /enrollments/{id}/withdraw"
        actor: Registrar
        preconditions:
          - "enrollment.status == ENROLLED"
        side_effects:
          - "compute refund_cents (calc: withdrawal_refund)"
          - "decrement Cohort.seats_taken by 1; if Cohort.status was FULL set it back to OPEN"
          - "if student sponsored: decrement CorporateContract.seats_consumed by 1; if contract.status was EXHAUSTED set it back to ACTIVE"
          - "promote earliest WAITLISTED enrollment on this cohort to ENROLLED if any (cascade to WAITLISTED->ENROLLED)"
          - "if Student.is_international AND student now has zero ENROLLED enrollments: set Student.visa_status = PROBATION and append ComplianceEvent PROBATION_PLACED (cascade to Student visa dimension)"
      - from: ENROLLED
        to: TERMINATED
        trigger: "POST /enrollments/{id}/terminate"
        actor: DSO
        preconditions:
          - "enrollment.status == ENROLLED"
          - "termination_reason supplied IN {VISA_NONCOMPLIANCE, ATTENDANCE_FAILURE, CONTRACT_REVOKED}"
        side_effects:
          - "set termination_reason; refund_cents = 0 (no refund on termination)"
          - "decrement Cohort.seats_taken by 1; if Cohort.status was FULL set it back to OPEN"
          - "if student sponsored: decrement CorporateContract.seats_consumed by 1"
          - "promote earliest WAITLISTED enrollment on this cohort to ENROLLED if any (cascade to WAITLISTED->ENROLLED)"
          - "if reason == VISA_NONCOMPLIANCE: set Student.visa_status = TERMINATED, append ComplianceEvent I20_TERMINATED, AND set Student.certification_status = VOIDED for any PROVISIONAL/CERTIFIED standing (cascade Enrollment->Student->certification)"

  - entity: Student
    initial_state: NONE
    terminal_states: [TERMINATED]
    transitions:
      - from: NONE
        to: INITIAL
        trigger: "POST /students/{id}/issue-i20"
        actor: DSO
        preconditions:
          - "Student.is_international == true"
          - "Student.visa_status == NONE"
        side_effects:
          - "set i20_required_weekly_hours = 18"
          - "append ComplianceEvent I20_ISSUED (prior NONE, new INITIAL)"
      - from: INITIAL
        to: ACTIVE
        trigger: "POST /students/{id}/activate-status"
        actor: DSO
        preconditions:
          - "Student.visa_status == INITIAL"
          - "student has at least one ENROLLED enrollment whose Cohort.weekly_hours sum >= i20_required_weekly_hours (full course of study, calc: full_course_load)"
        side_effects:
          - "append ComplianceEvent STATUS_ACTIVATED (prior INITIAL, new ACTIVE)"
      - from: ACTIVE
        to: PROBATION
        trigger: "System: last ENROLLED enrollment leaves ENROLLED via withdraw, OR POST /students/{id}/place-probation"
        actor: DSO
        preconditions:
          - "Student.visa_status == ACTIVE"
        side_effects:
          - "append ComplianceEvent PROBATION_PLACED (prior ACTIVE, new PROBATION)"
        note: "Cross-entity guard: a student in PROBATION cannot confirm a new ENROLLED enrollment until cleared."
      - from: PROBATION
        to: ACTIVE
        trigger: "POST /students/{id}/clear-probation"
        actor: DSO
        preconditions:
          - "Student.visa_status == PROBATION"
          - "student has at least one ENROLLED enrollment meeting full course of study (calc: full_course_load)"
        side_effects:
          - "append ComplianceEvent PROBATION_CLEARED (prior PROBATION, new ACTIVE)"
        note: "Revision cycle ACTIVE -> PROBATION -> ACTIVE."
      - from: PROBATION
        to: TERMINATED
        trigger: "POST /students/{id}/terminate-status"
        actor: DSO
        preconditions:
          - "Student.visa_status == PROBATION"
        side_effects:
          - "append ComplianceEvent I20_TERMINATED (prior PROBATION, new TERMINATED)"
          - "terminate every ENROLLED enrollment of this student with termination_reason VISA_NONCOMPLIANCE (cascade Student->Enrollment->Cohort seat release)"
          - "set Student.certification_status = VOIDED if it was PROVISIONAL or CERTIFIED"

  - entity: CorporateContract
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "System: seats_consumed reaches contracted_seats on an enroll/promote"
        actor: system
        preconditions:
          - "seats_consumed == contracted_seats"
        side_effects:
          - "block further sponsored ENROLLED confirmations (ERR_CONTRACT_SEATS_EXHAUSTED)"
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "System: a sponsored enrollment leaves ENROLLED, freeing a contract seat"
        actor: system
        preconditions:
          - "seats_consumed < contracted_seats"
        side_effects:
          - "sponsored confirmations permitted again"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /corporate-contracts/{id}/close"
        actor: Registrar
        preconditions:
          - "contract.status IN {ACTIVE, EXHAUSTED}"
          - "expected_contract_version matches contract.version"
        side_effects:
          - "terminate every ENROLLED enrollment sponsored by this contract with termination_reason CONTRACT_REVOKED (cascade Contract->Enrollment->Cohort seat release)"
          - "increments CorporateContract.version by 1"

  - entity: AddOnSubscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /add-ons/{id}/cancel"
        actor: Student
        preconditions:
          - "add_on.status == ACTIVE"
          - "the parent Enrollment.status IN {PLACEMENT_PENDING, ENROLLED, WAITLISTED} (cannot cancel after the enrollment is terminal)"
        side_effects:
          - "no tuition reversal: the fee was already baked into tuition_invoice_cents at enrollment; cancellation only stops future delivery"

# ---------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on parent version only)
# ---------------------------------------------------------------------
concurrency_rules:
  - rule_id: enroll-confirm-stale-cohort
    parent_entity: Cohort
    write_endpoint: "POST /enrollments/{id}/confirm"
    occ_field: "expected_cohort_version"
    description: |
      Confirming a PLACEMENT_PENDING enrollment into a Cohort whose version has
      advanced since the client last read it is rejected. This captures the case
      where another confirm has already consumed the last remaining seat (which
      legitimately supersedes this client's stale view of remaining capacity), so
      the current client's belief that a seat is available is out of date. The
      rejection is a stale-version check, not a timing artifact.
    error_id: ERR_STALE_COHORT_VERSION
    http_status: 412
  - rule_id: contract-close-stale-version
    parent_entity: CorporateContract
    write_endpoint: "POST /corporate-contracts/{id}/close"
    occ_field: "expected_contract_version"
    description: |
      Closing a CorporateContract whose version has advanced since the client last
      observed it is rejected. Another writer may have just enrolled a sponsored
      student (drawing down a seat and bumping the contract version), so the closer's
      view of which enrollments will be revoked by the close cascade is stale. The
      rejection is a stale-version check on the contract.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: placement_band
    trigger: "POST /placement-tests/{id}/score (transition PlacementTest REGISTERED->SCORED)"
    algorithm: threshold
    formula: |
      # banded thresholds on raw_score (0-100); boundaries are inclusive on the lower bound (>=)
      if   raw_score >= 90: assigned_level = "C2"
      elif raw_score >= 75: assigned_level = "C1"
      elif raw_score >= 60: assigned_level = "B2"
      elif raw_score >= 45: assigned_level = "B1"
      elif raw_score >= 25: assigned_level = "A2"
      else:                 assigned_level = "A1"
    input_set: "the single raw_score on the test being scored"
    constants:
      C2_MIN: 90
      C1_MIN: 75
      B2_MIN: 60
      B1_MIN: 45
      A2_MIN: 25
    precision: "integer score; band boundaries use >= (raw_score==60 -> B2, raw_score==59 -> B1)"

  - name: tuition_invoice
    trigger: "Enrollment PLACEMENT_PENDING->ENROLLED and WAITLISTED->ENROLLED (pinned at the moment of ENROLLED)"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is PINNED and load-bearing (combinatorial mode (c) circular-looking dependency):
      # Step 1 — add_on_total_cents = sum over ACTIVE AddOnSubscriptions bundled on THIS enrollment
      #          of each add-on's fee_cents (calc: addon_fee). Per-add-on fee is rounded first, then summed.
      # Step 2 — gross_cents = cohort.base_tuition_cents + add_on_total_cents
      # Step 3 — discount_pct is selected from the SPONSORING contract's discount_tier,
      #          BUT only applies to base_tuition_cents, never to add-ons:
      #             BRONZE -> 0.00, SILVER -> 0.10, GOLD -> 0.20
      #          (self-pay students: discount_pct = 0.00)
      # Step 4 — discount_cents = round_half_up(cohort.base_tuition_cents * discount_pct)   # round the discount, not the net
      # Step 5 — tuition_invoice_cents = gross_cents - discount_cents
      # The circular look: the discount is keyed off the base tuition tier, but the *net* total includes
      # add-ons which are NOT discounted; evaluation order (discount before add-on addition vs after) changes cents.
      # PIN: discount is computed on base_tuition_cents ALONE in Step 4, then subtracted from gross in Step 5.
    input_set: "cohort.base_tuition_cents, ACTIVE add-ons on this enrollment, sponsoring contract discount_tier (if any)"
    constants:
      BRONZE_PCT: 0.00
      SILVER_PCT: 0.10
      GOLD_PCT: 0.20
    precision: "cents (integer); round_half_up applied once at Step 4 on the discount only"
    variants:
      - name: sponsored
        when: "Student.corporate_contract_id is set"
        difference: "discount_pct read from contract.discount_tier; discount applies to base tuition only"
      - name: self_pay
        when: "Student.corporate_contract_id is null"
        difference: "discount_pct = 0; tuition_invoice_cents = base_tuition_cents + add_on_total_cents"

  - name: addon_fee
    trigger: "AddOnSubscription create (POST /add-ons); also re-summed by tuition_invoice"
    algorithm: tiered_pricing
    formula: |
      # combinatorial mode (a): >=3 inputs (add_on_type, units, immersion surcharge branch) with non-linear interaction
      rate = {CONVERSATION_CLUB: 1500, PRIVATE_TUTORING: 6000, IMMERSION_ABROAD: 40000}[add_on_type]   # cents per unit
      base = rate * units
      if add_on_type == "IMMERSION_ABROAD":
          # tiered surcharge: first 2 weeks at base rate, each additional week adds 15% surcharge on that week
          if units > 2:
              surcharge = round_half_up(rate * (units - 2) * 0.15)
          else:
              surcharge = 0
          fee_cents = base + surcharge
      else:
          fee_cents = base
    input_set: "add_on_type, units"
    constants:
      CONVERSATION_CLUB_RATE: 1500
      PRIVATE_TUTORING_RATE: 6000
      IMMERSION_ABROAD_RATE: 40000
      IMMERSION_SURCHARGE_PCT: 0.15
      IMMERSION_FREE_WEEKS: 2
    precision: "cents (integer); round_half_up on the surcharge term"

  - name: withdrawal_refund
    trigger: "Enrollment ENROLLED->WITHDRAWN (POST /enrollments/{id}/withdraw)"
    algorithm: chronological
    formula: |
      # DUAL-VARIANT on the Enrollment domain. Two valid interpretations of the same prose
      # ("refund the unused portion of tuition") yield different cents.
      # The scaffold PINS the chronological tiered-schedule variant as authoritative for refund_cents.
      #
      # weeks_elapsed = floor( (current_clock - cohort.term_start) / 7 days )   # 0-based whole weeks since term start
      # Tiered withdrawal schedule (chronological, calendar-week based):
      #   weeks_elapsed == 0            -> 1.00  (full refund, before week 1 completes)
      #   weeks_elapsed == 1            -> 0.75
      #   weeks_elapsed == 2 or 3       -> 0.50
      #   weeks_elapsed in 4..5         -> 0.25
      #   weeks_elapsed >= 6            -> 0.00  (no refund)
      # refund_cents = round_half_up(enrollment.tuition_invoice_cents * schedule_pct)
      # Refund is ALWAYS computed off the NET tuition_invoice_cents already pinned (includes add-ons, minus discount).
    input_set: "enrollment.tuition_invoice_cents, cohort.term_start, current logical clock"
    constants:
      WEEK_DAYS: 7
      PCT_W0: 1.00
      PCT_W1: 0.75
      PCT_W2_3: 0.50
      PCT_W4_5: 0.25
    precision: "cents (integer); round_half_up once on the final product"
    variants:
      - name: chronological_tiered_schedule
        when: "AUTHORITATIVE — this is what refund_cents is set to"
        difference: "refund driven by calendar weeks_elapsed since term_start, independent of how many sessions actually occurred"
      - name: forward_looking_prorata
        when: "REJECTED interpretation; included to make the divergence explicit for testing"
        difference: "would prorate by (cohort.total_sessions - enrollment.sessions_elapsed)/total_sessions; produces a DIFFERENT cents value than the authoritative schedule for the same withdrawal"

  - name: completion_score
    trigger: "Enrollment ENROLLED->COMPLETED (POST /enrollments/{id}/complete)"
    algorithm: weighted_scoring
    formula: |
      # combinatorial mode (b): nested rounding where order is PINNED.
      # latest ProgressReport = the report with the greatest assessed_at; tie-break created_at ASC.
      # skill_avg = round_half_up( (speaking + listening + reading + writing) / 4 )   # ROUND PER-REPORT FIRST
      # attendance_pts = round_half_up( enrollment.attendance_rate * 100 )           # ROUND attendance component
      # completion_score = round_half_up( 0.7 * skill_avg + 0.3 * attendance_pts )    # THEN combine and round
      # PIN: round skill_avg and attendance_pts INDEPENDENTLY before the weighted combine (round-then-combine),
      #      NOT (0.7*raw_skill_sum/4 + 0.3*rate*100) then round once. The two orders differ in the last cent/point.
    input_set: "latest ProgressReport sub-scores for this enrollment, enrollment.attendance_rate"
    constants:
      SKILL_WEIGHT: 0.7
      ATTENDANCE_WEIGHT: 0.3
      MIN_PASS_ATTENDANCE: 0.70
    precision: "round_half_up at each of the three pinned steps (skill_avg, attendance_pts, final)"
    note: "MIN_PASS_ATTENDANCE (0.70) is the completion-gate floor used by the Enrollment ENROLLED->COMPLETED precondition and validation priority 13; an enrollment.attendance_rate below 0.70 fails completion with ERR_COMPLETION_REQUIREMENTS_UNMET."

  - name: certification_rollup
    trigger: "Enrollment ENROLLED->COMPLETED (recompute Student.certification_status & final_progress_score)"
    algorithm: aggregation
    formula: |
      # DUAL-VARIANT on the Student domain (different entity than withdrawal_refund's Enrollment domain).
      # PROVISIONAL vs CERTIFIED are two algorithms over the same completed-enrollment set:
      #
      # completed = student's Enrollments with status == COMPLETED, ordered by completion_score is NOT used for order;
      #             aggregate is order-independent (a mean), so no tie-break needed.
      # final_progress_score = round_half_up( mean of completion_score over all COMPLETED enrollments )
      #
      # PROVISIONAL variant: fewer than REQUIRED_COMPLETIONS completed enrollments
      #   -> certification_status = PROVISIONAL, final_progress_score = the running mean (may change as more complete)
      # CERTIFIED variant: at least REQUIRED_COMPLETIONS completed enrollments AND final_progress_score >= CERT_PASS_SCORE
      #   -> certification_status = CERTIFIED (final_progress_score frozen at this value)
      # If >= REQUIRED_COMPLETIONS completions but final_progress_score < CERT_PASS_SCORE -> stays PROVISIONAL.
    input_set: "all COMPLETED enrollments of the student and their completion_score values"
    constants:
      REQUIRED_COMPLETIONS: 2
      CERT_PASS_SCORE: 70
    precision: "round_half_up on the mean"
    variants:
      - name: provisional
        when: "completed_count < 2 OR mean < 70"
        difference: "status PROVISIONAL; final_progress_score is the current running mean and may still change"
      - name: certified
        when: "completed_count >= 2 AND mean >= 70"
        difference: "status CERTIFIED; final_progress_score frozen; differs from provisional on identical per-enrollment data once the 2nd completion crosses the threshold"

  - name: full_course_load
    trigger: "Student INITIAL->ACTIVE, PROBATION->ACTIVE (activate/clear-probation precondition check)"
    algorithm: aggregation
    formula: |
      # sum of Cohort.weekly_hours over the student's ENROLLED enrollments (status == ENROLLED only;
      # PLACEMENT_PENDING / WAITLISTED / terminal states excluded).
      enrolled_weekly_hours = sum( cohort.weekly_hours for e in student.enrollments if e.status == "ENROLLED" )
      full_course = enrolled_weekly_hours >= student.i20_required_weekly_hours    # boundary: >= (18 hours exactly passes)
    input_set: "Cohort.weekly_hours of each ENROLLED enrollment for the student"
    constants:
      DEFAULT_REQUIRED_WEEKLY_HOURS: 18
    precision: "integer hours; boundary uses >= (exactly 18 satisfies full course of study)"
    variants:
      - name: meets_full_course
        when: "enrolled_weekly_hours >= i20_required_weekly_hours"
        difference: "activation / probation-clear precondition passes"
      - name: under_full_course
        when: "enrolled_weekly_hours < i20_required_weekly_hours"
        difference: "activation blocked with ERR_NOT_FULL_COURSE_OF_STUDY"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except Anonymous-permitted endpoints (student self-register, placement-test register)"
  - priority: 2
    category: auth
    check: "the authenticated role is permitted to call this endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "for entity_backed roles acting on their own resource (Student on own add-on/placement-test; CorporateSponsor on own contract), X-User-ID matches the owning FK"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "Student- and CorporateSponsor-owned mutations"
  - priority: 4
    category: existence
    check: "all path/body referenced resources exist, validated left-to-right in the path then body FKs"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints referencing an id"
  - priority: 5
    category: state
    check: "target resource is in a valid state for the requested transition (state-machine from: matches)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: business_referential
    check: "placement gate: Student.placement_level == Cohort.level AND Student.track == Cohort.track on confirm"
    error_id: ERR_PLACEMENT_MISMATCH
    http_status: 409
    applies_to: "POST /enrollments/{id}/confirm"
  - priority: 7
    category: business_safety
    check: "F-1 visa gate: international student confirming an ENROLLED enrollment must have visa_status IN {INITIAL, ACTIVE} (PROBATION/TERMINATED/NONE blocked)"
    error_id: ERR_VISA_NONCOMPLIANT
    http_status: 409
    applies_to: "POST /enrollments/{id}/confirm"
  - priority: 8
    category: business_temporal
    check: "no schedule conflict: student has no other ENROLLED enrollment with the same Cohort.schedule_block whose term [term_start, term_end] overlaps (closed interval) the target cohort's term"
    error_id: ERR_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /enrollments/{id}/confirm (ENROLLED branch)"
  - priority: 9
    category: business_constraint
    check: "AttendanceRecord.session_index is unique per enrollment and within 1..cohort.total_sessions"
    error_id: ERR_DUPLICATE_SESSION
    http_status: 409
    applies_to: "POST /attendance"
  - priority: 10
    category: business_constraint
    check: "corporate contract seat availability: a sponsored ENROLLED confirmation requires contract.seats_consumed < contract.contracted_seats (contract not EXHAUSTED/CLOSED)"
    error_id: ERR_CONTRACT_SEATS_EXHAUSTED
    http_status: 409
    applies_to: "POST /enrollments/{id}/confirm (sponsored ENROLLED branch)"
  - priority: 11
    category: business_fiscal
    check: "cohort seat capacity: an ENROLLED confirmation requires cohort.seats_taken < cohort.capacity (else WAITLISTED branch, not an error)"
    error_id: ERR_COHORT_FULL
    http_status: 409
    applies_to: "POST /enrollments/{id}/confirm when caller forces ENROLLED via require_seat=true"
  - priority: 12
    category: state
    check: "OCC: expected_cohort_version / expected_contract_version matches the live parent version"
    error_id: ERR_STALE_COHORT_VERSION
    http_status: 412
    applies_to: "POST /enrollments/{id}/confirm, POST /corporate-contracts/{id}/close"
  - priority: 13
    category: business_constraint
    check: "completion gate: clock >= term_end, attendance_rate >= MIN_PASS_ATTENDANCE, and >=1 ProgressReport exists"
    error_id: ERR_COMPLETION_REQUIREMENTS_UNMET
    http_status: 409
    applies_to: "POST /enrollments/{id}/complete"
  - priority: 14
    category: business_constraint
    check: "full course of study: activate/clear-probation requires sum of ENROLLED Cohort.weekly_hours >= i20_required_weekly_hours"
    error_id: ERR_NOT_FULL_COURSE_OF_STUDY
    http_status: 409
    applies_to: "POST /students/{id}/activate-status, POST /students/{id}/clear-probation"
  - priority: 15
    category: business_constraint
    check: "field-level input validation (enum membership, numeric ranges, required fields present)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all create/score endpoints"
  - priority: 16
    category: business_constraint
    check: "email uniqueness (case-insensitive) across Students on registration"
    error_id: ERR_DUPLICATE_EMAIL
    http_status: 409
    applies_to: "POST /students"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- Students ----
  - method: POST
    path: "/students"
    description: "Register a student (self-pay or sponsored). Anonymous allowed for self-registration."
    roles: [Anonymous, Registrar]
    code: 201
    input: [full_name, email, "is_international?", "corporate_contract_id?", "track?"]
    output: Student
    side_effects: ["if is_international set i20_required_weekly_hours=18 lazily on issue-i20", "validate email uniqueness", "validate corporate_contract_id exists if supplied"]
  - method: GET
    path: "/students/{id}"
    description: "Fetch a student with computed placement_level, visa_status, certification_status."
    roles: [Registrar, DSO, Instructor, Student]
    code: 200
    input: []
    output: Student
    side_effects: []
  - method: GET
    path: "/students"
    description: "List students; filterable by corporate_contract_id and visa_status."
    roles: [Registrar, DSO]
    code: 200
    input: ["corporate_contract_id?", "visa_status?", "limit?", "offset?"]
    output: Student[]
    side_effects: []
  - method: GET
    path: "/students/{id}/enrollments"
    description: "Reverse-reachability: all enrollments of a student."
    roles: [Registrar, DSO, Instructor, Student]
    code: 200
    input: []
    output: Enrollment[]
    side_effects: []
  - method: GET
    path: "/students/{id}/compliance-events"
    description: "Reverse-reachability: append-only ComplianceEvent audit log for a student."
    roles: [Registrar, DSO]
    code: 200
    input: []
    output: ComplianceEvent[]
    side_effects: []
  - method: GET
    path: "/students/{id}/add-ons"
    description: "Reverse-reachability: all AddOnSubscriptions for a student."
    roles: [Registrar, Student]
    code: 200
    input: []
    output: AddOnSubscription[]
    side_effects: []
  - method: GET
    path: "/students/{id}/placement-tests"
    description: "Reverse-reachability: all PlacementTests of a student."
    roles: [Registrar, Instructor, Student]
    code: 200
    input: []
    output: PlacementTest[]
    side_effects: []
  - method: POST
    path: "/students/{id}/issue-i20"
    description: "DSO issues the I-20: Student NONE->INITIAL, sets required weekly hours to 18."
    roles: [DSO]
    code: 200
    input: ["reason?"]
    output: Student
    side_effects: ["visa_status NONE->INITIAL", "i20_required_weekly_hours=18", "append ComplianceEvent I20_ISSUED"]
  - method: POST
    path: "/students/{id}/activate-status"
    description: "DSO activates F-1 status: INITIAL->ACTIVE once full course of study is met."
    roles: [DSO]
    code: 200
    input: ["reason?"]
    output: Student
    side_effects: ["visa_status INITIAL->ACTIVE (precondition full_course_load)", "append ComplianceEvent STATUS_ACTIVATED"]
  - method: POST
    path: "/students/{id}/place-probation"
    description: "DSO places a student on academic/visa probation: ACTIVE->PROBATION."
    roles: [DSO]
    code: 200
    input: ["reason?"]
    output: Student
    side_effects: ["visa_status ACTIVE->PROBATION", "append ComplianceEvent PROBATION_PLACED"]
  - method: POST
    path: "/students/{id}/clear-probation"
    description: "DSO clears probation: PROBATION->ACTIVE once full course of study is met again."
    roles: [DSO]
    code: 200
    input: ["reason?"]
    output: Student
    side_effects: ["visa_status PROBATION->ACTIVE (precondition full_course_load)", "append ComplianceEvent PROBATION_CLEARED"]
  - method: POST
    path: "/students/{id}/terminate-status"
    description: "DSO terminates F-1 status: PROBATION->TERMINATED; cascades to enrollments and certification."
    roles: [DSO]
    code: 200
    input: ["reason?"]
    output: Student
    side_effects: ["visa_status PROBATION->TERMINATED", "terminate all ENROLLED enrollments (VISA_NONCOMPLIANCE)", "void certification if PROVISIONAL/CERTIFIED", "append ComplianceEvent I20_TERMINATED"]

  # ---- Placement Tests ----
  - method: POST
    path: "/placement-tests"
    description: "Register a placement test for a student (REGISTERED)."
    roles: [Anonymous, Registrar, Student]
    code: 201
    input: [student_id]
    output: PlacementTest
    side_effects: ["validate student_id exists"]
  - method: GET
    path: "/placement-tests/{id}"
    description: "Fetch a placement test."
    roles: [Registrar, Instructor, Student]
    code: 200
    input: []
    output: PlacementTest
    side_effects: []
  - method: POST
    path: "/placement-tests/{id}/score"
    description: "Instructor scores a test: REGISTERED->SCORED; sets assigned_level and Student.placement_level."
    roles: [Instructor]
    code: 200
    input: [raw_score]
    output: PlacementTest
    side_effects: ["compute assigned_level (calc: placement_band)", "set Student.placement_level (latest scored wins)"]
  - method: POST
    path: "/placement-tests/{id}/void"
    description: "Registrar voids a test: REGISTERED->VOIDED."
    roles: [Registrar]
    code: 200
    input: []
    output: PlacementTest
    side_effects: ["status REGISTERED->VOIDED"]

  # ---- Cohorts ----
  - method: POST
    path: "/cohorts"
    description: "Registrar creates a cohort (OPEN)."
    roles: [Registrar]
    code: 201
    input: [name, level, track, capacity, weekly_hours, term_start, term_end, total_sessions, base_tuition_cents, schedule_block]
    output: Cohort
    side_effects: ["validate term_end > term_start"]
  - method: GET
    path: "/cohorts/{id}"
    description: "Fetch a cohort with computed seats_taken and status."
    roles: [Registrar, DSO, Instructor, Student]
    code: 200
    input: []
    output: Cohort
    side_effects: []
  - method: GET
    path: "/cohorts"
    description: "List cohorts; filterable by level, track, status."
    roles: [Registrar, DSO, Instructor, Student]
    code: 200
    input: ["level?", "track?", "status?", "limit?", "offset?"]
    output: Cohort[]
    side_effects: []
  - method: GET
    path: "/cohorts/{id}/enrollments"
    description: "Reverse-reachability: all enrollments on a cohort."
    roles: [Registrar, DSO, Instructor]
    code: 200
    input: []
    output: Enrollment[]
    side_effects: []

  # ---- Enrollments ----
  - method: POST
    path: "/enrollments"
    description: "Registrar creates a PLACEMENT_PENDING enrollment linking a student to a cohort."
    roles: [Registrar]
    code: 201
    input: [student_id, cohort_id]
    output: Enrollment
    side_effects: ["validate student_id and cohort_id exist", "status=PLACEMENT_PENDING"]
  - method: GET
    path: "/enrollments/{id}"
    description: "Fetch an enrollment with computed attendance_rate, tuition_invoice_cents, refund_cents."
    roles: [Registrar, DSO, Instructor, Student]
    code: 200
    input: []
    output: Enrollment
    side_effects: []
  - method: POST
    path: "/enrollments/{id}/confirm"
    description: "Registrar confirms placement: PLACEMENT_PENDING -> ENROLLED (if seat free and require_seat or capacity available) or WAITLISTED (if full). OCC on cohort.version."
    roles: [Registrar]
    code: 200
    input: [expected_cohort_version, "require_seat?"]
    output: Enrollment
    side_effects: ["fork ENROLLED vs WAITLISTED", "compute tuition_invoice (ENROLLED)", "increment cohort.seats_taken (ENROLLED)", "increment contract.seats_consumed if sponsored (ENROLLED)", "increments Cohort.version by 1"]
  - method: POST
    path: "/enrollments/{id}/withdraw"
    description: "Registrar withdraws an enrolled student: ENROLLED->WITHDRAWN; computes refund, releases seat, promotes waitlist, may trigger PROBATION."
    roles: [Registrar]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["compute refund_cents (calc: withdrawal_refund)", "release cohort seat", "release contract seat", "promote earliest WAITLISTED", "if international with zero ENROLLED -> PROBATION + ComplianceEvent"]
  - method: POST
    path: "/enrollments/{id}/terminate"
    description: "DSO terminates an enrollment: ENROLLED->TERMINATED with a reason; no refund; releases seat, promotes waitlist; VISA_NONCOMPLIANCE also terminates the student's visa & voids certification."
    roles: [DSO]
    code: 200
    input: [termination_reason]
    output: Enrollment
    side_effects: ["refund_cents=0", "release cohort seat", "release contract seat", "promote earliest WAITLISTED", "if VISA_NONCOMPLIANCE -> Student TERMINATED + cert VOIDED"]
  - method: POST
    path: "/enrollments/{id}/complete"
    description: "Registrar completes an enrollment after term end: ENROLLED->COMPLETED; computes completion_score and rolls up certification."
    roles: [Registrar]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["compute completion_score", "release cohort seat", "release contract seat", "recompute Student.certification_status (calc: certification_rollup)"]

  # ---- Attendance ----
  - method: POST
    path: "/attendance"
    description: "Instructor records a session attendance mark for an enrollment."
    roles: [Instructor]
    code: 201
    input: [enrollment_id, session_index, status]
    output: AttendanceRecord
    side_effects: ["recompute enrollment.sessions_attended, sessions_elapsed, attendance_rate", "validate session_index unique and within range"]
  - method: GET
    path: "/enrollments/{id}/attendance"
    description: "Reverse-reachability: all AttendanceRecords for an enrollment."
    roles: [Registrar, DSO, Instructor, Student]
    code: 200
    input: []
    output: AttendanceRecord[]
    side_effects: []

  # ---- Progress Reports ----
  - method: POST
    path: "/progress-reports"
    description: "Instructor records a progress assessment for an enrollment."
    roles: [Instructor]
    code: 201
    input: [enrollment_id, speaking, listening, reading, writing]
    output: ProgressReport
    side_effects: ["stamp assessed_at from logical clock"]
  - method: GET
    path: "/enrollments/{id}/progress-reports"
    description: "Reverse-reachability: all ProgressReports for an enrollment."
    roles: [Registrar, DSO, Instructor, Student]
    code: 200
    input: []
    output: ProgressReport[]
    side_effects: []

  # ---- Add-ons ----
  - method: POST
    path: "/add-ons"
    description: "Student (or Registrar) subscribes to a conversation-club / tutoring / immersion-abroad add-on bundled onto an enrollment."
    roles: [Registrar, Student]
    code: 201
    input: [student_id, enrollment_id, add_on_type, units]
    output: AddOnSubscription
    side_effects: ["compute fee_cents (calc: addon_fee)", "validate enrollment belongs to student"]
  - method: GET
    path: "/add-ons/{id}"
    description: "Fetch an add-on subscription."
    roles: [Registrar, Student]
    code: 200
    input: []
    output: AddOnSubscription
    side_effects: []
  - method: GET
    path: "/enrollments/{id}/add-ons"
    description: "Reverse-reachability: all AddOnSubscriptions bundled onto an enrollment."
    roles: [Registrar, DSO, Student]
    code: 200
    input: []
    output: AddOnSubscription[]
    side_effects: []
  - method: POST
    path: "/add-ons/{id}/cancel"
    description: "Student cancels an add-on: ACTIVE->CANCELLED (no tuition reversal)."
    roles: [Student]
    code: 200
    input: []
    output: AddOnSubscription
    side_effects: ["status ACTIVE->CANCELLED"]

  # ---- Corporate Contracts ----
  - method: POST
    path: "/corporate-contracts"
    description: "Registrar creates a corporate/group contract with contracted seats and a discount tier."
    roles: [Registrar]
    code: 201
    input: [company_name, contracted_seats, "discount_tier?"]
    output: CorporateContract
    side_effects: ["status=ACTIVE", "seats_consumed=0"]
  - method: GET
    path: "/corporate-contracts/{id}"
    description: "Fetch a contract with computed seats_consumed and status."
    roles: [Registrar, CorporateSponsor]
    code: 200
    input: []
    output: CorporateContract
    side_effects: []
  - method: GET
    path: "/corporate-contracts/{id}/students"
    description: "Reverse-reachability: all Students sponsored by a contract."
    roles: [Registrar, CorporateSponsor]
    code: 200
    input: []
    output: Student[]
    side_effects: []
  - method: POST
    path: "/corporate-contracts/{id}/close"
    description: "Registrar closes a contract: ACTIVE/EXHAUSTED->CLOSED; cascades termination (CONTRACT_REVOKED) to all sponsored ENROLLED enrollments. OCC on contract.version."
    roles: [Registrar]
    code: 200
    input: [expected_contract_version]
    output: CorporateContract
    side_effects: ["terminate sponsored ENROLLED enrollments (CONTRACT_REVOKED)", "release cohort & contract seats", "increments CorporateContract.version by 1"]

  # ---- Test-driving / logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock to an arbitrary UTC instant for deterministic time-gated tests. Startup default is 2026-04-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock."
    roles: [Registrar, DSO]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["all subsequent logical-clock reads (enrolled_at, recorded_at, assessed_at, refund week, completion gate) use this instant"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or malformed X-User-Role / X-User-ID on an authenticated endpoint"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "role not permitted for the endpoint, or entity_backed role acting on a resource it does not own"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a referenced student/cohort/enrollment/contract/test/add-on id does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target resource not in the from-state required by the requested transition (e.g. confirm a non-PLACEMENT_PENDING enrollment, score a non-REGISTERED test)"
  - id: ERR_PLACEMENT_MISMATCH
    http: 409
    condition: "confirm where Student.placement_level != Cohort.level or Student.track != Cohort.track"
  - id: ERR_VISA_NONCOMPLIANT
    http: 409
    condition: "international student confirming an ENROLLED enrollment while visa_status not in {INITIAL, ACTIVE}"
  - id: ERR_SCHEDULE_CONFLICT
    http: 409
    condition: "ENROLLED confirm collides with an existing ENROLLED enrollment sharing schedule_block over an overlapping term (closed interval)"
  - id: ERR_DUPLICATE_SESSION
    http: 409
    condition: "attendance session_index already recorded for the enrollment, or outside 1..cohort.total_sessions"
  - id: ERR_CONTRACT_SEATS_EXHAUSTED
    http: 409
    condition: "sponsored ENROLLED confirm where contract.seats_consumed >= contracted_seats (EXHAUSTED) or contract CLOSED"
  - id: ERR_COHORT_FULL
    http: 409
    condition: "confirm with require_seat=true while cohort.seats_taken >= cohort.capacity"
  - id: ERR_STALE_COHORT_VERSION
    http: 412
    condition: "expected_cohort_version does not match the live Cohort.version on confirm"
  - id: ERR_STALE_CONTRACT_VERSION
    http: 412
    condition: "expected_contract_version does not match the live CorporateContract.version on close"
  - id: ERR_COMPLETION_REQUIREMENTS_UNMET
    http: 409
    condition: "complete before term_end, or attendance_rate < MIN_PASS_ATTENDANCE, or no ProgressReport exists"
  - id: ERR_NOT_FULL_COURSE_OF_STUDY
    http: 409
    condition: "activate-status / clear-probation while ENROLLED weekly hours sum < i20_required_weekly_hours"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, enum value out of set, or numeric value out of allowed range"
  - id: ERR_DUPLICATE_EMAIL
    http: 409
    condition: "student registration with an email already in use (case-insensitive)"
  - id: ERR_CONTRACT_REQUIRED_FOR_SPONSOR
    http: 404
    condition: "corporate_contract_id supplied on student registration does not reference an existing contract"
  - id: ERR_INVALID_TERMINATION_REASON
    http: 422
    condition: "terminate without a termination_reason in {VISA_NONCOMPLIANCE, ATTENDANCE_FAILURE, CONTRACT_REVOKED}"
  - id: ERR_ADDON_ENROLLMENT_MISMATCH
    http: 409
    condition: "add-on enrollment_id does not belong to the supplied student_id"
  - id: ERR_VALIDATION_PAGINATION
    http: 422
    condition: "limit/offset outside allowed bounds (limit 1..100, offset >= 0)"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Registrar
    description: "Owns cohort and enrollment lifecycle, tuition, withdrawal/refund, contract creation/close."
    identity: "opaque"
    exclusive_operations:
      - "POST /cohorts"
      - "POST /enrollments"
      - "POST /enrollments/{id}/confirm"
      - "POST /enrollments/{id}/withdraw"
      - "POST /enrollments/{id}/complete"
      - "POST /placement-tests/{id}/void"
      - "POST /corporate-contracts"
      - "POST /corporate-contracts/{id}/close"
    shared_operations:
      - "POST /students (also Anonymous)"
      - "POST /placement-tests (also Student, Anonymous)"
      - "GET reads across students, cohorts, enrollments, contracts"
  - name: DSO
    description: "Designated School Official: owns I-20 issuance and F-1 visa status lifecycle, visa-driven enrollment termination."
    identity: "opaque"
    exclusive_operations:
      - "POST /students/{id}/issue-i20"
      - "POST /students/{id}/activate-status"
      - "POST /students/{id}/place-probation"
      - "POST /students/{id}/clear-probation"
      - "POST /students/{id}/terminate-status"
      - "POST /enrollments/{id}/terminate"
    shared_operations:
      - "GET reads across students, enrollments, compliance-events, cohorts"
  - name: Instructor
    description: "Owns attendance marking, progress assessment, and placement-test scoring."
    identity: "opaque"
    exclusive_operations:
      - "POST /placement-tests/{id}/score"
      - "POST /attendance"
      - "POST /progress-reports"
    shared_operations:
      - "GET reads across students, cohorts, enrollments, placement-tests"
  - name: Student
    description: "Acts on own placement-test registration and own add-on subscriptions; reads own records."
    identity: "entity_backed:Student"
    exclusive_operations:
      - "POST /add-ons/{id}/cancel (own add-on)"
    shared_operations:
      - "POST /students (self-register, also Anonymous)"
      - "POST /placement-tests (own, also Registrar)"
      - "POST /add-ons (own, also Registrar)"
      - "GET own student, enrollments, add-ons, placement-tests, attendance, progress-reports"
  - name: CorporateSponsor
    description: "Reads its own corporate contract and the students it sponsors."
    identity: "entity_backed:CorporateContract"
    exclusive_operations: []
    shared_operations:
      - "GET own corporate-contract, GET own contract's sponsored students"
  - name: Anonymous
    description: "Unauthenticated public access for self-registration and placement-test registration only."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /students (self-register)"
      - "POST /placement-tests"
