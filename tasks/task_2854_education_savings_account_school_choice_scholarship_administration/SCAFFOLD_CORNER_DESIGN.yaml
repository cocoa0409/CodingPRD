      - name: third_application_appeal_is_blocked_by_the_round_limit
        claim_type: Violation -> Error
        grounds:
          - validations[priority=22]
          - errors.ERR_APPEAL_ROUNDS_EXHAUSTED
          - entities.Application.fields.appeal_round_count
        distinguishing_aspect: "appeal_round_count must be < 2 when a new APPLICATION_DENIAL appeal is filed, so after two overturned rounds the third appeal is refused 409 - the denial-appeal loop is bounded, not infinite."
        test_recipe:
          setup:
            - "Student S3 (BAND_B, no category flags) has a SUBMITTED Application in the open 2026-27 window at clock 2026-09-01."
