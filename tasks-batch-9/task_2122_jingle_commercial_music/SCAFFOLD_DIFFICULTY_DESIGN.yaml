      - name: reuse_admin_band_keyed_on_pre_admin_subtotal_not_on_total
        grounds:
          - calculations.reuse_fee
          - calculations.license_fee
          - entities.ReuseExtension.fields.admin_pct
          - entities.ReuseExtension.fields.reuse_total_cents
          - concurrency_rules[reuse-extension-stale-deal]
        distinguishing_aspect: |
          Mode (c) circular-looking dependency, a different axis from the mode (b)
          rounding instance: the admin band is a function of a subtotal that the
          admin fee itself feeds, and the pinned order (base 195000 -> band 7% ->
          admin 13650 -> total 208650) diverges from the band-on-total reading,
          which would pick 5% and yield 204750.
        test_recipe:
