scaffold_corner_design:
- section: entities
  instances:
  - name: plan_creation_applies_defaults_and_seeds_ledger
    claim_type: creation_with_defaults
    grounds:
    - entities.Plan.fields.initial_carryover_balance
    - entities.CreditBalanceLedger
    - endpoints.POST_/v1/plans
    distinguishing_aspect: Omitting optional initial balances defaults them to 0; the plan-creation side effect seeds a CreditBalanceLedger retrievable via the sub-resource GET.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls:
      - call: POST /v1/plans
        payload:
          sponsor_name: Defaults Co
          plan_year: 2028
          accrual_rate: 0.01
          normal_retirement_age: 62
          prior_aftap_pct: 90.0
        as: PlanAdmin
        captures:
          plan_id: $.data.id
      trigger:
      - call: GET /v1/plans/${plan_id}/credit-balance-ledger
        payload: {}
        as: PlanAdmin
        captures:
          led_cb: $.data[0].carryover_balance
          led_pb: $.data[0].prefunding_balance
          led_applied: $.data[0].total_applied_to_date
      assert:
      - Plan.${plan_id}.status == ACTIVE (initial state)
      - Plan.${plan_id}.current_posture == UNRESTRICTED (default)
      - Plan.${plan_id}.version == 1
      - ledger array length == 1 with carryover_balance == 0, prefunding_balance == 0, total_applied_to_date == 0
  - name: plan_missing_required_field_returns_validation_error
    claim_type: required_fields
    grounds:
    - entities.Plan.fields.plan_year
    - errors[ERR_VALIDATION]
    distinguishing_aspect: plan_year has source input and no default; omitting it yields ERR_VALIDATION 400.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /v1/plans
        payload:
          sponsor_name: Broken Co
          accrual_rate: 0.01
          normal_retirement_age: 62
          prior_aftap_pct: 90.0
        as: PlanAdmin
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_VALIDATION with http 400
  - name: plan_get_not_found_returns_404
    claim_type: not_found
    grounds:
    - errors[ERR_NOT_FOUND]
    - endpoints.GET_/v1/plans/{id}
    distinguishing_aspect: GET with a well-formed but non-existent UUID returns ERR_NOT_FOUND 404.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: GET /v1/plans/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
        payload: {}
        as: PlanAdmin
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_NOT_FOUND with http 404
  - name: plan_list_pagination_envelope
    claim_type: listing_pagination
    grounds:
    - response_envelope.pagination_fields
    - endpoints.GET_/v1/plans
    distinguishing_aspect: List endpoint honors limit/offset and returns the pinned pagination fields.
    test_recipe:
      setup:
      - three plans created
      setup_api_calls:
      - call: POST /v1/plans
        payload:
          sponsor_name: P1
          plan_year: 2028
          accrual_rate: 0.01
          normal_retirement_age: 62
          prior_aftap_pct: 90.0
        as: PlanAdmin
      - call: POST /v1/plans
        payload:
          sponsor_name: P2
          plan_year: 2028
          accrual_rate: 0.01
          normal_retirement_age: 62
          prior_aftap_pct: 90.0
        as: PlanAdmin
      - call: POST /v1/plans
        payload:
          sponsor_name: P3
          plan_year: 2028
          accrual_rate: 0.01
          normal_retirement_age: 62
          prior_aftap_pct: 90.0
        as: PlanAdmin
      trigger:
      - call: GET /v1/plans?limit=2&offset=0
        payload: {}
        as: PlanAdmin
      assert:
      - response data array length == 2
      - response contains total_count == 3 and has_more == true
  - name: participant_computed_and_system_fields
    claim_type: computed_system_fields
    grounds:
    - entities.CensusBatch.fields.participant_count
    - entities.Participant.fields.external_ref
    distinguishing_aspect: participant_count is computed from appended rows; client-supplied id/created_at values in the body are ignored by the server.
    test_recipe:
      setup:
      - plan + batch exist
      setup_api_calls:
      - call: POST /v1/plans
        payload:
          sponsor_name: Computed Co
          plan_year: 2028
          accrual_rate: 0.01
          normal_retirement_age: 62
          prior_aftap_pct: 90.0
        as: PlanAdmin
        captures:
          plan_id: $.data.id
      - call: POST /v1/plans/${plan_id}/census-batches
        payload:
          plan_year: 2028
          source_label: c1
        as: PlanAdmin
        captures:
          batch_id: $.data.id
      trigger:
      - call: POST /v1/census-batches/${batch_id}/participants
        payload:
          participants:
          - external_ref: E1
            date_of_birth: '1966-01-01'
            status: ACTIVE
            years_of_service: 1
            annual_compensation: 50000
          - external_ref: E2
            date_of_birth: '1965-01-01'
            status: RETIREE
            current_annual_benefit: 12000
        as: PlanAdmin
        captures:
          batch_count: $.data.participant_count
      assert:
      - CensusBatch.${batch_id}.participant_count == 2 after bulk append
      - CensusBatch.${batch_id}.status remains UPLOADED (append alone does not screen)
  - name: contribution_payment_immutable_event
    claim_type: immutability
    grounds:
    - entities.ContributionPayment
    distinguishing_aspect: 'ContributionPayment has common_fields false: response carries id and created_at but no version field, and no update/delete endpoint exists.'
    test_recipe:
      setup:
      - Family A plan certified with OPEN demand tentative 2839.98
      setup_api_calls:
      - call: POST /v1/plans
        payload:
          sponsor_name: Immutable Co
          plan_year: 2028
          accrual_rate: 0.01
          normal_retirement_age: 62
          prior_aftap_pct: 84.0
        as: PlanAdmin
        captures:
          plan_id: $.data.id
      - call: POST /v1/actuaries
        payload:
          full_name: Prep Act
          credential_id: EA-1
          enrollment_status: ENROLLED
        as: FirmAdmin
        captures:
          act_prep: $.data.id
      - call: POST /v1/actuaries
        payload:
          full_name: Rev Act
          credential_id: EA-2
          enrollment_status: ENROLLED
        as: FirmAdmin
        captures:
          act_rev: $.data.id
      - call: POST /v1/plans/${plan_id}/census-batches
        payload:
          plan_year: 2028
          source_label: c1
        as: PlanAdmin
        captures:
          batch_id: $.data.id
      - call: POST /v1/census-batches/${batch_id}/participants
        payload:
          participants:
          - external_ref: A1
            date_of_birth: '1966-03-10'
            status: ACTIVE
            years_of_service: 10
            annual_compensation: 100000
        as: PlanAdmin
      - call: POST /v1/census-batches/${batch_id}/submit-screening
        payload: {}
        as: PlanAdmin
      - call: POST /v1/census-batches/${batch_id}/lock
        payload: {}
        as: PlanAdmin
      - call: POST /v1/plans/${plan_id}/assumption-sets
        payload:
          plan_year: 2028
          label: base
          mortality_table: TEST_TABLE_4AGE
          funding_discount_rate: 0.05
          disclosure_discount_rate: 0.04
          retirement_age: 62
        as: Actuary
        as_user_id: ${act_prep}
        captures:
          aset_id: $.data.id
      - call: POST /v1/assumption-sets/${aset_id}/submit
        payload: {}
        as: Actuary
        as_user_id: ${act_prep}
      - call: POST /v1/assumption-sets/${aset_id}/approve
        payload: {}
        as: SeniorActuary
        as_user_id: ${act_rev}
      - call: POST /v1/assumption-sets/${aset_id}/lock
        payload: {}
        as: SeniorActuary
        as_user_id: ${act_rev}
      - call: POST /v1/plans/${plan_id}/asset-statements
        payload:
          plan_year: 2028
          market_value_begin: 100000
          contributions_received: 0
          benefits_paid: 5000
          investment_return: 5000
        as: PlanAdmin
      - call: POST /v1/plans/${plan_id}/asset-valuations
        payload:
          plan_year: 2028
        as: Actuary
        as_user_id: ${act_prep}
        captures:
          ava_id: $.data.id
      - call: POST /v1/plans/${plan_id}/valuation-runs
        payload:
          plan_year: 2028
          census_batch_id: ${batch_id}
          assumption_set_id: ${aset_id}
          asset_valuation_id: ${ava_id}
        as: Actuary
        as_user_id: ${act_prep}
        captures:
          run_id: $.data.id
      - call: POST /v1/valuation-runs/${run_id}/compute
        payload: {}
        as: Actuary
        as_user_id: ${act_prep}
      - call: GET /v1/plans/${plan_id}
        payload: {}
        as: PlanAdmin
        captures:
          plan_v: $.data.version
      - call: POST /v1/valuation-runs/${run_id}/certify
        payload:
          expected_plan_version: ${plan_v}
        as: SeniorActuary
        as_user_id: ${act_rev}
      - call: GET /v1/plans/${plan_id}/contribution-demands
        payload: {}
        as: PlanAdmin
        captures:
          demand_id: $.data[0].id
      trigger:
      - call: POST /v1/contribution-demands/${demand_id}/payments
        payload:
          amount: 100.0
          paid_on: '2028-05-01'
        as: PlanAdmin
        captures:
          pay_id: $.data.id
      assert:
      - ContributionPayment response has id and created_at fields and no version field (common_fields false)
      - GET /v1/contribution-demands/${demand_id}/payments returns exactly 1 row with amount 100.00
- section: state_machines
  instances:
  - name: census_lock_from_uploaded_is_invalid_state
    claim_type: invalid_transition
    grounds:
    - state_machines.CensusBatch.transitions
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: LOCKED is reachable only from VALIDATED; locking an UPLOADED batch fails with ERR_INVALID_STATE 409.
    test_recipe:
      setup:
      - plan + batch with one valid participant, never screened
      setup_api_calls:
      - call: POST /v1/plans
        payload:
          sponsor_name: SM Co
          plan_year: 2028
          accrual_rate: 0.01
          normal_retirement_age: 62
          prior_aftap_pct: 90.0
        as: PlanAdmin
        captures:
          plan_id: $.data.id
      - call: POST /v1/plans/${plan_id}/census-batches
        payload:
          plan_year: 2028
          source_label: c1
        as: PlanAdmin
        captures:
          batch_id: $.data.id
      - call: POST /v1/census-batches/${batch_id}/participants
        payload:
          participants:
          - external_ref: R1
            date_of_birth: '1965-01-01'
            status: RETIREE
            current_annual_benefit: 1000
        as: PlanAdmin
      trigger:
      - call: POST /v1/census-batches/${batch_id}/lock
        payload: {}
        as: PlanAdmin
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_INVALID_STATE with http 409
      - CensusBatch.${batch_id}.status remains UPLOADED
  - name: locked_census_is_terminal
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.CensusBatch.terminal_states
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: 'From LOCKED no transition exists: submit-screening and further participant posts are rejected.'
    test_recipe:
      setup:
      - plan + batch LOCKED
      setup_api_calls:
      - call: POST /v1/plans
        payload:
          sponsor_name: Terminal Co
          plan_year: 2028
          accrual_rate: 0.01
          normal_retirement_age: 62
          prior_aftap_pct: 90.0
        as: PlanAdmin
        captures:
          plan_id: $.data.id
      - call: POST /v1/plans/${plan_id}/census-batches
        payload:
          plan_year: 2028
          source_label: c1
        as: PlanAdmin
        captures:
          batch_id: $.data.id
      - call: POST /v1/census-batches/${batch_id}/participants
        payload:
          participants:
          - external_ref: R1
            date_of_birth: '1965-01-01'
            status: RETIREE
            current_annual_benefit: 1000
        as: PlanAdmin
      - call: POST /v1/census-batches/${batch_id}/submit-screening
        payload: {}
        as: PlanAdmin
      - call: POST /v1/census-batches/${batch_id}/lock
        payload: {}
        as: PlanAdmin
      trigger:
      - call: POST /v1/census-batches/${batch_id}/submit-screening
        payload: {}
        as: PlanAdmin
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_INVALID_STATE with http 409 (LOCKED is terminal)
  - name: assumption_approve_from_draft_is_invalid_state
    claim_type: invalid_transition
    grounds:
    - state_machines.AssumptionSet.transitions
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: APPROVED is reachable only from IN_REVIEW; approving a DRAFT set fails with ERR_INVALID_STATE.
    test_recipe:
      setup:
      - plan + DRAFT assumption set
      setup_api_calls:
      - call: POST /v1/plans
        payload:
          sponsor_name: SM2 Co
          plan_year: 2028
          accrual_rate: 0.01
          normal_retirement_age: 62
          prior_aftap_pct: 90.0
        as: PlanAdmin
        captures:
          plan_id: $.data.id
      - call: POST /v1/actuaries
        payload:
          full_name: Rev Act
          credential_id: EA-2
          enrollment_status: ENROLLED
        as: FirmAdmin
        captures:
          act_rev: $.data.id
      - call: POST /v1/plans/${plan_id}/assumption-sets
        payload:
          plan_year: 2028
          label: base
          mortality_table: TEST_TABLE_4AGE
          funding_discount_rate: 0.05
          disclosure_discount_rate: 0.04
          retirement_age: 62
        as: SeniorActuary
        as_user_id: ${act_rev}
        captures:
          aset_id: $.data.id
      trigger:
      - call: POST /v1/assumption-sets/${aset_id}/approve
        payload: {}
        as: SeniorActuary
        as_user_id: ${act_rev}
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_INVALID_STATE with http 409 (state check precedes SoD check)
  - name: assumption_set_initial_state_is_draft
    claim_type: initial_state
    grounds:
    - state_machines.AssumptionSet.initial_state
    distinguishing_aspect: Newly created assumption set is DRAFT with approved_by_actuary_id null and version 1.
    test_recipe:
      setup:
      - plan + actuary
      setup_api_calls:
      - call: POST /v1/plans
        payload:
          sponsor_name: Init Co
          plan_year: 2028
          accrual_rate: 0.01
          normal_retirement_age: 62
          prior_aftap_pct: 90.0
        as: PlanAdmin
        captures:
          plan_id: $.data.id
      - call: POST /v1/actuaries
        payload:
          full_name: Prep Act
          credential_id: EA-1
          enrollment_status: ENROLLED
        as: FirmAdmin
        captures:
          act_prep: $.data.id
      trigger:
      - call: POST /v1/plans/${plan_id}/assumption-sets
        payload:
          plan_year: 2028
          label: base
          mortality_table: TEST_TABLE_4AGE
          funding_discount_rate: 0.05
          disclosure_discount_rate: 0.04
          retirement_age: 62
        as: Actuary
        as_user_id: ${act_prep}
        captures:
          aset_status: $.data.status
          aset_approver: $.data.approved_by_actuary_id
          aset_prep: $.data.prepared_by_actuary_id
      assert:
      - status == DRAFT, approved_by_actuary_id == null, prepared_by_actuary_id == ${act_prep}
  - name: void_certified_run_is_invalid_state
    claim_type: invalid_transition
    grounds:
    - state_machines.ValuationRun.transitions
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: VOID is reachable only from INITIATED/COMPUTED; voiding a CERTIFIED run is rejected (supersession is the only exit).
    test_recipe:
      setup:
      - certified Family-style run
      setup_api_calls:
      - call: POST /v1/plans
        payload:
          sponsor_name: Void Co
          plan_year: 2028
          accrual_rate: 0.01
          normal_retirement_age: 62
          prior_aftap_pct: 90.0
        as: PlanAdmin
        captures:
          plan_id: $.data.id
      - call: POST /v1/actuaries
        payload:
          full_name: Prep Act
          credential_id: EA-1
