          comparison is <=, so committed == 8000 exactly is allowed while 8001
          is rejected.
        test_recipe:
          setup:
            - "Three tested 20.0% lots; tickets 4000 + 4000 + 1 bushels on 2026-09-12 against standard cap 8000"
