      - name: missing_auth_headers_unauthenticated
        claim_type: Auth required
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A protected endpoint called with no X-User-Role header returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
