    input: []
    output: CostRecovery
    side_effects: ["CostRecovery ASSESSED -> PAID; debit site.outstanding_recovery_cents; cascade linked REMEDIATED Report -> CLOSED."]

  - method: POST
    path: "/abatement/cost-recoveries/{id}/waive"
    description: "Admin waives an assessed cost recovery."
    roles: [ProgramAdmin]
    code: 200
    input: ["reason?"]
    output: CostRecovery
    side_effects: ["CostRecovery ASSESSED -> WAIVED; debit site.outstanding_recovery_cents; cascade linked REMEDIATED Report -> CLOSED."]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/unknown X-User-Role or missing X-User-ID."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Acting role not permitted for the endpoint."
  - id: ERR_OWNERSHIP_MISMATCH
    http: 403
    condition: "Entity_backed role's X-User-ID does not own the target resource."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, bad type, invalid enum, or scheduled_end <= scheduled_start."
  - id: ERR_PROPERTY_OWNER_NOT_FOUND
    http: 404
    condition: "Referenced property owner does not exist."
  - id: ERR_SITE_NOT_FOUND
    http: 404
    condition: "Referenced site does not exist."
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "Referenced report does not exist."
  - id: ERR_CREW_NOT_FOUND
    http: 404
    condition: "Referenced crew does not exist."
  - id: ERR_WORK_ORDER_NOT_FOUND
    http: 404
    condition: "Referenced work order does not exist."
  - id: ERR_MATERIAL_NOT_FOUND
    http: 404
    condition: "Referenced material does not exist."
  - id: ERR_NOTICE_NOT_FOUND
    http: 404
    condition: "Referenced notice does not exist."
  - id: ERR_COST_RECOVERY_NOT_FOUND
    http: 404
    condition: "Referenced cost recovery does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not defined from the resource's current state."
  - id: ERR_CREW_UNAVAILABLE
    http: 409
    condition: "Dispatch chosen crew is not AVAILABLE (currently DISPATCHED on an in-progress job)."
  - id: ERR_RECOVERY_NOT_ASSESSED
    http: 409
    condition: "Cost-recovery notice issued while the linked CostRecovery is not ASSESSED."
  - id: ERR_CURE_WINDOW_NOT_ELAPSED
    http: 409
    condition: "Notice expire attempted before clock_now >= cure_deadline."
  - id: ERR_CREW_NOT_CERTIFIED
    http: 422
    condition: "Dispatch to an offensive report with a crew that is not offensive-certified."
  - id: ERR_CREW_SCHEDULE_CONFLICT
    http: 409
    condition: "New work-order window overlaps another non-terminal work order of the same crew (half-open intervals)."
  - id: ERR_SITE_ABATEMENT_BUFFER_CONFLICT
    http: 409
    condition: "New work-order window for a PRIVATE site lies within the 24h buffer of another non-terminal work order on the same site."
  - id: ERR_BEFORE_PHOTO_REQUIRED
    http: 422
    condition: "Start attempted with no BEFORE photo on the work order."
  - id: ERR_AFTER_PHOTO_REQUIRED
    http: 422
    condition: "Complete attempted with no AFTER photo on the work order."
  - id: ERR_PRIVATE_SITE_REQUIRES_OWNER
    http: 422
    condition: "PRIVATE site created without property_owner_id, or PUBLIC site created with one."
  - id: ERR_STALE_SITE_VERSION
    http: 412
    condition: "Notice issuance with expected_site_version not equal to the site's current version."
  - id: ERR_INSUFFICIENT_MATERIAL
    http: 409
    condition: "Dispatch requests more of a material than its quantity_available."

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Resident
    description: "Member of the public filing 311 reports."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /abatement/reports"
      - "GET (read) endpoints"

  - name: IntakeClerk
    description: "311 operator who creates sites and reports and triages them."
    identity: opaque
    exclusive_operations:
      - "POST /abatement/reports/{id}/triage"
    shared_operations:
      - "POST /abatement/sites"
      - "POST /abatement/reports"
      - "GET (read) endpoints"

  - name: AbatementCoordinator
    description: "Dispatches crews, manages work orders, issues notices, resolves cost recovery."
    identity: opaque
    exclusive_operations:
      - "POST /abatement/work-orders"
      - "POST /abatement/work-orders/{id}/cancel"
      - "POST /abatement/work-orders/{id}/recall"
      - "POST /abatement/sites/{id}/notices"
      - "POST /abatement/notices/{id}/expire"
    shared_operations:
      - "POST /abatement/property-owners"
      - "POST /abatement/crews"
      - "POST /abatement/sites"
      - "POST /abatement/reports/{id}/triage"
      - "POST /abatement/cost-recoveries/{id}/pay"
      - "GET (read) endpoints"

  - name: CrewLead
    description: "Field lead who executes their own crew's work orders."
    identity: "entity_backed:Crew"
    exclusive_operations:
      - "POST /abatement/work-orders/{id}/start"
      - "POST /abatement/work-orders/{id}/complete"
      - "POST /abatement/work-orders/{id}/photos"
    shared_operations:
      - "GET (read) endpoints"

  - name: InventoryManager
    description: "Maintains paint/material inventory."
    identity: opaque
    exclusive_operations:
      - "POST /abatement/materials"
    shared_operations:
      - "GET (read) endpoints"

  - name: PropertyOwnerUser
    description: "Property owner responding to notices and paying recoveries for their own property."
    identity: "entity_backed:PropertyOwner"
    exclusive_operations:
      - "POST /abatement/notices/{id}/consent"
      - "POST /abatement/notices/{id}/dispute"
    shared_operations:
      - "POST /abatement/cost-recoveries/{id}/pay"
      - "GET (read) endpoints"

  - name: ProgramAdmin
    description: "Program administrator with override, clock control, and waiver authority."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /abatement/cost-recoveries/{id}/waive"
    shared_operations:
      - "POST /abatement/property-owners"
      - "POST /abatement/crews"
      - "POST /abatement/sites"
      - "POST /abatement/materials"
      - "GET (read) endpoints"
