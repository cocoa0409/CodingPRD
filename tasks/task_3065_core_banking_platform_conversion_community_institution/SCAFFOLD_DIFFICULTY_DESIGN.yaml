              as: ConversionEngineer
              captures: { gl_id: $.data.id }
            - call: "POST /api/v1/accounts"
              payload: {project_id: "${proj_id}",  legacy_account_number: "L-9001", account_type: "DEPOSIT", product_type_id: "${pt_id}", opening_principal_cents: 1000000, statement_cycle_day: 1, accrual_start_date: "2026-09-01" }
              as: ConversionEngineer
              captures: { acct_id: $.data.id }
            - call: "GET /api/v1/conversions/${proj_id}"
              payload: {}
              as: ConversionEngineer
              captures: { pv: $.data.version }
            - call: "POST /api/v1/accounts/${acct_id}/map"
              payload: { gl_account_id: "${gl_id}", expected_project_version: "${pv}" }
              as: ConversionEngineer
            - call: "POST /api/v1/conversions/${proj_id}/advance"
              payload: {}
              as: ProjectManager
              as_user_id: "pm-alice"
            - call: "POST /api/v1/conversions/${proj_id}/advance"
              payload: {}
