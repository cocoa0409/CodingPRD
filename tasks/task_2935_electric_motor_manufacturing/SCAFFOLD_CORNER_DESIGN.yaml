      - name: design_lifecycle_walks_the_full_release_revision_release_cycle
        claim_type: valid_transition
        grounds:
          - state_machines.MotorDesign
        excluded_because:
          difficulty_instance: design_request_changes_revision_cycle_hits_review_round_limit
          rationale: |
            That §1.8 instance walks DRAFT -> IN_REVIEW -> DRAFT -> IN_REVIEW -> RELEASED and then
            RELEASED -> REVISION_OPEN -> IN_REVIEW, asserting status, revision_index, review_round
            and version after every hop, so each valid design transition is already pinned.

      - name: work_order_build_and_certification_axes_advance_independently
        claim_type: parallel
        grounds:
          - state_machines.WorkOrder.dimension_note
        excluded_because:
          difficulty_instance: unauthorized_role_outranks_nameplate_not_certified_on_ship
          rationale: |
            That §1.8 instance holds a work order at build_status TESTED with certification_status
            PENDING and proves shipping is refused, which is exactly the two-axis independence
            claim; the CERTIFIED -> SUSPENDED half is pinned by the revocation cascade instance.

      - name: rotor_cage_fork_diverges_then_rejoins_at_machining
        claim_type: branching
        grounds:
          - state_machines.RotorBuild.PLANNED_to_CAST_POURED
          - state_machines.RotorBuild.PLANNED_to_BARS_BRAZED
        excluded_because:
          difficulty_instance: rotor_cage_fork_join_die_cast_vs_brazed_bar_convergence
          rationale: |
            The §1.8 instance drives both fork branches on two work orders and asserts the
            divergent side-effect sets plus the identical MACHINED join behaviour.

      - name: design_revision_loop_returns_to_in_review_repeatedly
        claim_type: cyclic
        grounds:
          - state_machines.MotorDesign.shape
        excluded_because:
          difficulty_instance: design_request_changes_revision_cycle_hits_review_round_limit
          rationale: |
            Same §1.8 instance: it traverses the loop until MAX_REVIEW_ROUNDS bites, which is the
            cyclic-shape claim together with its bound.

      - name: work_order_creation_is_guarded_by_the_pinned_design_state
        claim_type: guarded_transitions
        grounds:
          - validations[priority=40]
          - validations[priority=46]
        excluded_because:
          difficulty_instance: work_order_creation_blocked_while_pinned_design_sits_in_review
          rationale: |
            That §1.8 instance is precisely a guard test: the same POST /work-orders payload is
            refused while the design is IN_REVIEW and accepted once it is RELEASED again.

      - name: cancelling_an_order_cascades_down_three_hops
        claim_type: cascade_down
        grounds:
          - state_machines.CustomerOrder.IN_PRODUCTION_to_CANCELLED
        excluded_because:
          difficulty_instance: order_cancel_cascades_to_workorder_stator_and_oven_ledger
          rationale: |
            The §1.8 instance asserts every hop of the depth-4 cancellation cascade, including the
            rows the cascade must NOT touch.

      - name: oven_booked_minutes_stays_synchronised_with_its_stator_builds
        claim_type: ledger_sync
        grounds:
          - calculations.oven_booked_minutes_ledger
        excluded_because:
          difficulty_instance: oven_booked_minutes_returns_to_zero_after_rejection_and_rebooks_without_drift
          rationale: |
            That §1.8 instance books, rejects and re-books against the same oven and asserts the
            derived counter after each step, which is the ledger-synchronisation claim.

      - name: rejecting_a_subassembly_compensates_the_resource_it_had_booked
        claim_type: compensation
        grounds:
          - state_machines.StatorBuild.to_REJECTED
          - state_machines.WarrantyClaim.to_UNDER_ANALYSIS
        excluded_because:
          difficulty_instance: distributor_allowance_conserved_across_confirm_cancel_confirm_to_the_exact_limit
          rationale: |
            The §1.8 compensating-invariant instances cover both compensation pairs: the allowance
            debit/credit round trip and the oven booked-minutes rebooking.

      - name: revoking_a_nameplate_flags_only_the_open_warranty_claims
        claim_type: conditional_cascade
        grounds:
          - state_machines.WorkOrder.certification_status_CERTIFIED_to_SUSPENDED
        excluded_because:
          difficulty_instance: nameplate_revoke_cascades_to_certification_claim_and_distributor_counter
          rationale: |
            That §1.8 instance holds claims in SUBMITTED, CLOSED and MISUSE_DETERMINED and asserts
            that only the eligible statuses receive defect_presumption_applied.

      - name: a_design_revision_reaches_across_into_scheduled_tests
        claim_type: cross_entity
        grounds:
          - state_machines.MotorDesign.RELEASED_to_REVISION_OPEN
        excluded_because:
          difficulty_instance: design_revision_cascades_to_workorder_pin_and_scheduled_test_requalification
          rationale: |
            That §1.8 instance asserts the two-hop reach from the design into WorkOrder.design_pin_stale
            and then into PerformanceTest.requires_requalification.

  # ===========================================================================
  # Table 3 (Calculations) — 17 calcs
  # ===========================================================================
  - section: calculations
    instances:

      - name: premium_design_variant_reproduces_every_loss_component_and_both_classes
        claim_type: correct_result
        grounds:
          - calculations.design_predicted_efficiency
          - entities.MotorDesign.total_predicted_loss_w
          - entities.MotorDesign.design_estimate_class
          - entities.MotorDesign.predicted_class
        distinguishing_aspect: |
          A second design point exercises the three multiplier tables at values D1 never reaches
          (M235_35A lamination, 200 mm stack, 14.5 kg copper, FABRICATED_COPPER rotor), so a hard
          coded D1 answer cannot pass. The two classes must straddle a floor: the estimate lands
          on IE5 while the tolerance-derated guarantee lands on IE4.
        test_recipe:
          setup:
            - "Empty DB; logical clock at the 2026-08-01T00:00:00.000Z startup default."
          setup_api_calls: []
          trigger:
            - call: "POST /motor-designs"
              payload: { model_code: "WM-132M-7K5-IE4C", frame_size: "132M", poles: 4, rated_output_kw: 7.5, rated_voltage_v: 400, target_efficiency_class: "IE4", lamination_grade: "M235_35A", lamination_stack_length_mm: 200, winding_copper_kg: 14.5, winding_type: "LAP", insulation_class: "F", stator_bore_id_mm: 135.400, design_air_gap_mm: 0.450, air_gap_tolerance_mm: 0.050, rotor_construction: "FABRICATED_COPPER", rotor_bar_count: 40, shaft_diameter_mm: 38.000, shaft_tolerance_class: "k6", bearing_spec_de: "6208-2Z", bearing_spec_nde: "6206-2Z", lubrication_spec: "GREASE_REGREASABLE", duty_type: "S1", enclosure: "IP55", mounting: "B3" }
              as: DesignEngineer
              as_user_id: "u_eng_1"
              captures: { d2_id: $.data.id }
          assert:
            - "HTTP 201"
            - "MotorDesign.${d2_id}.total_predicted_loss_w == 388.8 (components 111.8 + 130.3 + 79.2 + 45.0 + 22.5, each rounded to 0.1 W before summation)"
            - "MotorDesign.${d2_id}.predicted_efficiency_pct == 95.07"
            - "MotorDesign.${d2_id}.guaranteed_efficiency_pct == 94.33"
            - "MotorDesign.${d2_id}.design_estimate_class == IE5"
            - "MotorDesign.${d2_id}.predicted_class == IE4"
            - "MotorDesign.${d2_id}.status == DRAFT and version == 1"

