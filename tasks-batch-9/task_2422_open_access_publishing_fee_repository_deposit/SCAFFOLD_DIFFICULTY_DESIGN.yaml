            - call: "POST /grants"
              payload: { funder_id: "${f14_id}", pi_author_id: "${au14a_id}", grant_number: "NRC-2026-501", award_from: "2026-01-01", award_until: "2027-12-31", apc_budget_cents: 900000 }
              as: AgreementAdmin
              captures: { g14a_id: $.data.id }
