scenario: |
  Agricultural Drone & Remote-Sensing Service (ag drone service operator): flight
  planning & FAA authorization by airspace, imagery capture window & weather
  constraint, processing to NDVI/plant-count deliverable, scouting alert &
  agronomist review, per-acre pricing & subscription, spray-drone application
  licensing & record, data storage & grower access, insurance & liability

domain_name: ag-drone-remote-sensing
api_prefix: /ag-drone

# =============================================================================
# Complexity profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit        # FAA airspace authz, spray applicator licensing, application records
  secondary_archetype: workflow_orchestration # plan -> authorize -> capture -> process -> deliver -> review
  complexity_layers:
    - optimistic_concurrency                 # OCC on FlightMission for replan-after-weather-abort
    - cascading_side_effects                 # flight complete -> deliverable -> alerts -> field health
    - dual_variant_calculation               # provisional vs final billing; NDVI vs plant-count scoring
    - temporal_windowing                     # weather capture windows; airspace authorization validity windows
    - scheduled_deferred_actions             # missions scheduled into future; clock drives expiry
  entity_topology: hybrid                    # Grower -> Field -> FlightMission tree; SubscriptionPlan / PilotProfile / AirspaceAuthorization cross-cut
  state_machine_shape: branching             # weather abort + authorization denial revert to PLANNED; alerts fork/join
  relationship_patterns:
    - one_to_many
    - cross_aggregate                        # FlightMission references AirspaceAuthorization + PilotProfile
    - polymorphic                            # ImageryDeliverable.kind drives NDVI vs PLANT_COUNT algorithms
  role_model: segregation_of_duties          # pilot who flew cannot agronomy-review own mission; applicator license != remote pilot certificate
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Grower
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Grower business legal name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: subscription_plan_id, type: string, source: input, description: "FK -> SubscriptionPlan.id; the grower's active subscription tier" }
      - { name: subscription_started_on, type: string, source: input, description: "ISO date (YYYY-MM-DD) the current subscription became effective" }
      - { name: acres_included_ytd, type: integer, source: computed, description: "Cumulative billable acres flown in current subscription year; resets on renewal anniversary" }
      - { name: credit_balance_cents, type: integer, source: computed, default: 0, description: "Prepaid credit in cents; debited by overage invoices and credited by insurance claim payouts" }
      - { name: liability_coverage_cents, type: integer, source: input, description: "Per-occurrence liability coverage cap the grower purchases (must be >= 50000000)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED", constraints: "initially ACTIVE" }

  - name: SubscriptionPlan
    parent: null
    common_fields: true
    fields:
      - { name: plan_code, type: string, source: input, description: "Unique plan code (e.g. SCOUT_BASIC, SCOUT_PRO, SPRAY_FULL)" }
      - { name: included_acres_per_year, type: integer, source: input, description: "Billable acres included in base fee before overage applies" }
      - { name: base_fee_cents, type: integer, source: input, description: "Annual base subscription fee in cents" }
      - { name: overage_rate_cents_per_acre, type: integer, source: input, description: "Cents charged per acre beyond included_acres_per_year" }
      - { name: spray_allowed, type: boolean, source: input, description: "Whether the plan authorizes spray-dispensing missions (false blocks SprayMission creation)" }
      - { name: ndvi_turnaround_hours, type: integer, source: input, description: "SLA hours from mission COMPLETED to deliverable READY" }
      - { name: storage_retention_days, type: integer, source: input, description: "Days deliverables remain accessible to the grower" }

  - name: Field
    parent: Grower
    common_fields: true
    fields:
      - { name: grower_id, type: string, source: system, description: "FK -> Grower.id; owning grower" }
      - { name: field_name, type: string, source: input, description: "Grower-facing field label" }
      - { name: legal_acres, type: integer, source: input, description: "Authoritative deeded acreage (must be > 0)" }
      - { name: surveyed_acres, type: integer, source: computed, description: "Latest surveyed acreage from the most recent COMPLETED flight; drives per-acre pricing" }
      - { name: airspace_class, type: enum, source: input, description: "G | E | D | C | B", constraints: "FAA airspace classification" }
      - { name: laanc_required, type: boolean, source: computed, description: "true iff airspace_class in {B, C, D} (controlled); false for {G, E}" }
      - { name: health_score, type: integer, source: computed, default: 100, description: "0-100 aggregate crop health; recomputed from latest deliverable + open alerts" }
      - { name: insurance_policy_no, type: string, source: input, description: "Grower's aviation liability policy number covering this field" }

  - name: PilotProfile
    parent: null
    common_fields: true
    fields:
      - { name: pilot_name, type: string, source: input, description: "Remote pilot full legal name" }
      - { name: part107_certificate_no, type: string, source: input, description: "FAA Part 107 remote pilot certificate number (unique)" }
      - { name: part107_expires_on, type: string, source: input, description: "ISO date of Part 107 currency expiration" }
      - { name: applicator_license_no, type: string, source: input, description: "State pesticide applicator license number; empty string if none", default: "" }
      - { name: applicator_license_expires_on, type: string, source: input, description: "ISO date of applicator license expiration; empty string when applicator_license_no empty", default: "" }
      - { name: night_waiver, type: boolean, source: input, default: false, description: "Whether pilot holds a Part 107.29 night operations waiver" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", constraints: "initially ACTIVE" }

  - name: AirspaceAuthorization
    parent: null
    common_fields: false
    fields:
      - { name: field_id, type: string, source: input, description: "FK -> Field.id; the field this authorization covers" }
      - { name: authorization_ref, type: string, source: input, description: "FAA LAANC / DroneZone authorization reference number" }
      - { name: max_altitude_ft, type: integer, source: input, description: "Approved ceiling in feet AGL (must be <= 400)" }
      - { name: effective_from, type: datetime, source: input, description: "ISO8601 UTC start of authorization window (inclusive)" }
      - { name: effective_until, type: datetime, source: input, description: "ISO8601 UTC end of authorization window (exclusive)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REVOKED | EXPIRED", constraints: "initially ACTIVE; EXPIRED set by clock sweep when current_utc >= effective_until" }

  - name: FlightMission
    parent: Field
    common_fields: true
    fields:
      - { name: field_id, type: string, source: system, description: "FK -> Field.id; target field" }
      - { name: mission_type, type: enum, source: input, description: "SCOUT | SPRAY", constraints: "SCOUT = imagery only; SPRAY = dispensing (requires spray plan & applicator license)" }
      - { name: pilot_id, type: string, source: input, description: "FK -> PilotProfile.id; remote pilot in command" }
      - { name: authorization_id, type: string, source: input, description: "FK -> AirspaceAuthorization.id; required when field.laanc_required, must be null otherwise", default: null }
      - { name: scheduled_start, type: datetime, source: input, description: "ISO8601 UTC planned takeoff (must be in the future at creation)" }
      - { name: scheduled_end, type: datetime, source: input, description: "ISO8601 UTC planned landing; end > start, window length <= 6 hours" }
      - { name: acres_planned, type: integer, source: input, description: "Planned coverage acres (must be <= field.legal_acres)" }
      - { name: acres_flown, type: integer, source: computed, default: 0, description: "Acres actually flown at completion (pilot-attested)" }
      - { name: wind_kt_max_observed, type: integer, source: input, default: 0, description: "Peak wind (knots) observed at capture; > 20 kt forces WEATHER_ABORTED" }
      - { name: chemical_product_label, type: string, source: input, default: "", description: "EPA-registered product label; required iff mission_type == SPRAY" }
      - { name: gallons_dispensed, type: number, source: input, default: 0, description: "Gallons actually dispensed at completion; 0 for SCOUT" }
      - { name: status, type: enum, source: system, description: "PLANNED -> AUTHORIZED -> IN_FLIGHT -> CAPTURED -> COMPLETED | WEATHER_ABORTED | CANCELLED", constraints: "see state machine" }

  - name: ImageryDeliverable
    parent: FlightMission
    common_fields: true
    fields:
      - { name: mission_id, type: string, source: system, description: "FK -> FlightMission.id; owning mission" }
      - { name: kind, type: enum, source: input, description: "NDVI | PLANT_COUNT", constraints: "processing algorithm applied" }
      - { name: ndvi_mean, type: number, source: computed, description: "Mean NDVI over the flown polygon, 3 decimal places; only for kind=NDVI" }
      - { name: plant_count_per_acre, type: integer, source: computed, description: "Estimated plants per acre; only for kind=PLANT_COUNT" }
      - { name: anomaly_count, type: integer, source: computed, description: "Cells flagged below stress threshold (NDVI) or below stand threshold (PLANT_COUNT)" }
      - { name: storage_uri, type: string, source: system, description: "Object-store URI of the processed raster/CSV bundle" }
      - { name: accessible_until, type: datetime, source: computed, description: "mission completion + grower's plan storage_retention_days; grower reads denied after this instant" }
      - { name: status, type: enum, source: system, description: "PROCESSING -> READY -> DELIVERED | EXPIRED", constraints: "EXPIRED when clock passes accessible_until" }

  - name: ScoutingAlert
    parent: Field
    common_fields: true
    fields:
      - { name: field_id, type: string, source: system, description: "FK -> Field.id; field the alert concerns" }
      - { name: deliverable_id, type: string, source: system, description: "FK -> ImageryDeliverable.id; the deliverable whose anomaly detection raised the alert" }
      - { name: severity, type: enum, source: system, description: "LOW | MEDIUM | HIGH", constraints: "derived from anomaly_count thresholds" }
      - { name: reviewing_agronomist_id, type: string, source: input, default: null, description: "FK -> PilotProfile.id of the reviewing agronomist (must differ from mission pilot)" }
      - { name: review_notes, type: string, source: input, default: "", description: "Agronomist's scouting notes" }
      - { name: review_outcome, type: enum, source: input, default: null, description: "CONFIRMED | DISMISSED | NEEDS_REFLIGHT; required to transition to REVIEWED" }
      - { name: status, type: enum, source: system, description: "OPEN -> UNDER_REVIEW -> REVIEWED", constraints: "REVIEWED requires review_outcome set" }

  - name: SprayMissionRecord
    parent: FlightMission
    common_fields: false
    fields:
      - { name: mission_id, type: string, source: system, description: "FK -> FlightMission.id; 1:1 with a SPRAY mission" }
      - { name: applicator_license_no, type: string, source: system, description: "Snapshot of pilot's applicator license at completion time" }
      - { name: chemical_product_label, type: string, source: system, description: "Snapshot of EPA product label applied" }
      - { name: gallons_dispensed, type: number, source: system, description: "Snapshot of gallons_dispensed" }
      - { name: restricted_entry_interval_hours, type: integer, source: input, description: "REI hours on the product label; re-entry forbidden until completion + REI" }
      - { name: record_locked, type: boolean, source: system, default: true, description: "Always true; application records are immutable per pesticide compliance" }

  - name: InsuranceClaim
    parent: Grower
    common_fields: true
    fields:
      - { name: grower_id, type: string, source: system, description: "FK -> Grower.id; claimant grower" }
      - { name: mission_id, type: string, source: input, description: "FK -> FlightMission.id; the mission on which the loss occurred" }
      - { name: claim_amount_cents, type: integer, source: input, description: "Claimed loss amount in cents (must be > 0)" }
      - { name: approved_amount_cents, type: integer, source: computed, default: 0, description: "Approved payout, capped at grower.liability_coverage_cents minus prior approvals on the same mission" }
      - { name: adjuster_user_id, type: string, source: input, default: null, description: "Opaque adjuster id who last touched the claim (audit)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> UNDER_REVIEW -> APPROVED | DENIED -> PAID", constraints: "PAID credits grower.credit_balance_cents" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Grower
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /ag-drone/growers/{id}/suspend
        actor: OpsAdmin
        preconditions:
          - "Grower in ACTIVE (ERR_GROWER_NOT_ACTIVE)"
        side_effects:
          - "All PLANNED or AUTHORIZED FlightMissions on this grower's fields -> CANCELLED"
          - "increments Grower.version"

      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /ag-drone/growers/{id}/reinstate
        actor: OpsAdmin
        preconditions:
          - "Grower in SUSPENDED (ERR_GROWER_NOT_SUSPENDED)"
        side_effects:
          - "increments Grower.version"

      - from: SUSPENDED
        to: TERMINATED
        trigger: POST /ag-drone/growers/{id}/terminate
        actor: OpsAdmin
        preconditions:
          - "Grower in SUSPENDED (ERR_GROWER_NOT_SUSPENDED)"
          - "No FlightMission in IN_FLIGHT on any of grower's fields (ERR_MISSION_IN_FLIGHT)"
        side_effects:
          - "All PLANNED / AUTHORIZED missions -> CANCELLED"
          - "All non-terminal InsuranceClaims -> DENIED with approved_amount_cents = 0"

  - entity: Field
    initial_state: ACTIVE
    terminal_states: []
    transitions: []
    note: "Field carries no business status enum beyond existence; health_score is the derived dimension. Declared here only to document that no state machine exists for Field."

  - entity: AirspaceAuthorization
    initial_state: ACTIVE
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: POST /ag-drone/airspace-authorizations/{id}/revoke
        actor: OpsAdmin
        preconditions:
          - "Authorization in ACTIVE (ERR_AUTH_NOT_ACTIVE)"
        side_effects:
          - "All PLANNED or AUTHORIZED FlightMissions referencing this authorization -> CANCELLED"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system clock sweep (when current_utc >= effective_until)"
        actor: system
        preconditions: []
        side_effects:
          - "All AUTHORIZED FlightMissions referencing this authorization whose scheduled_start >= current_utc -> CANCELLED"

  - entity: FlightMission
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED, WEATHER_ABORTED]
    transitions:
      - from: PLANNED
        to: AUTHORIZED
        trigger: POST /ag-drone/missions/{id}/authorize
        actor: FlightCoordinator
        preconditions:
          - "Mission in PLANNED (ERR_MISSION_NOT_PLANNED)"
          - "Grower in ACTIVE (ERR_GROWER_NOT_ACTIVE)"
          - "If field.laanc_required: authorization_id is present, its status == ACTIVE, and its [effective_from, effective_until) fully contains [scheduled_start, scheduled_end] (ERR_AUTH_WINDOW_INSUFFICIENT)"
          - "If field.laanc_required is false: authorization_id MUST be null (ERR_AUTH_NOT_PERMITTED)"
          - "Pilot status == ACTIVE and part107_expires_on >= scheduled_end date (ERR_PILOT_CERT_EXPIRED)"
          - "If mission_type == SPRAY: pilot.applicator_license_no non-empty, applicator_license_expires_on >= scheduled_end date, grower's plan spray_allowed == true, and chemical_product_label non-empty (ERR_SPRAY_NOT_LICENSED)"
          - "No other non-terminal FlightMission on the same field has [scheduled_start, scheduled_end) overlapping this mission's window with a buffer of 30 minutes on each side (ERR_MISSION_WINDOW_CONFLICT)"
        side_effects:
          - "increments FlightMission.version"

      - from: AUTHORIZED
        to: IN_FLIGHT
        trigger: POST /ag-drone/missions/{id}/launch
        actor: RemotePilot
        preconditions:
          - "Mission in AUTHORIZED (ERR_MISSION_NOT_AUTHORIZED)"
          - "X-User-ID == mission.pilot_id (ERR_NOT_ASSIGNED_PILOT)"
          - "current_utc >= scheduled_start and current_utc < scheduled_end (ERR_OUTSIDE_WINDOW)"
          - "If authorization_id present: authorization still ACTIVE (ERR_AUTH_NOT_ACTIVE)"
        side_effects:
          - "increments FlightMission.version"

      - from: IN_FLIGHT
        to: CAPTURED
        trigger: POST /ag-drone/missions/{id}/capture
        actor: RemotePilot
        preconditions:
          - "Mission in IN_FLIGHT (ERR_MISSION_NOT_IN_FLIGHT)"
          - "X-User-ID == mission.pilot_id (ERR_NOT_ASSIGNED_PILOT)"
          - "wind_kt_max_observed <= 20 (ERR_WEATHER_LIMIT_EXCEEDED)"
          - "acres_flown > 0 and acres_flown <= acres_planned (ERR_ACRES_OUT_OF_RANGE)"
        side_effects:
          - "sets acres_flown, wind_kt_max_observed, gallons_dispensed from request"
          - "increments FlightMission.version"

      - from: IN_FLIGHT
        to: WEATHER_ABORTED
        trigger: POST /ag-drone/missions/{id}/abort-weather
        actor: RemotePilot
        preconditions:
          - "Mission in IN_FLIGHT (ERR_MISSION_NOT_IN_FLIGHT)"
          - "X-User-ID == mission.pilot_id (ERR_NOT_ASSIGNED_PILOT)"
          - "wind_kt_max_observed > 20 (ERR_WEATHER_LIMIT_NOT_EXCEEDED)"
        side_effects:
          - "sets wind_kt_max_observed from request"
          - "acres_flown remains 0"
          - "increments FlightMission.version"

      - from: CAPTURED
        to: COMPLETED
        trigger: POST /ag-drone/missions/{id}/complete
        actor: FlightCoordinator
        preconditions:
          - "Mission in CAPTURED (ERR_MISSION_NOT_CAPTURED)"
        side_effects:
          - "Field.surveyed_acres := acres_flown"
          - "Grower.acres_included_ytd += acres_flown (billing recomputed, see calc mission_billing)"
          - "Creates ImageryDeliverable records for each kind in the request's deliverable_kinds list, status PROCESSING"
          - "If mission_type == SPRAY: creates SprayMissionRecord (immutable) snapshotting applicator_license_no, chemical_product_label, gallons_dispensed"
          - "increments FlightMission.version"

      - from: PLANNED
        to: CANCELLED
        trigger: POST /ag-drone/missions/{id}/cancel
        actor: FlightCoordinator
        preconditions:
          - "Mission in PLANNED or AUTHORIZED (ERR_MISSION_NOT_CANCELLABLE)"
        side_effects:
          - "increments FlightMission.version"

      - from: AUTHORIZED
        to: CANCELLED
        trigger: POST /ag-drone/missions/{id}/cancel
        actor: FlightCoordinator
        preconditions:
          - "Mission in PLANNED or AUTHORIZED (ERR_MISSION_NOT_CANCELLABLE)"
        side_effects:
          - "increments FlightMission.version"

  - entity: ImageryDeliverable
    initial_state: PROCESSING
    terminal_states: [DELIVERED, EXPIRED]
    transitions:
      - from: PROCESSING
        to: READY
        trigger: POST /ag-drone/deliverables/{id}/process
        actor: ProcessingEngine
        preconditions:
          - "Deliverable in PROCESSING (ERR_DELIV_NOT_PROCESSING)"
          - "kind == NDVI: payload provides ndvi_mean in [0.000, 1.000] (ERR_DELIV_INPUT_INVALID)"
          - "kind == PLANT_COUNT: payload provides plant_count_per_acre > 0 (ERR_DELIV_INPUT_INVALID)"
        side_effects:
          - "anomaly_count computed per calc anomaly_scoring"
          - "If anomaly_count > 0: creates ScoutingAlert on the field with severity per calc anomaly_scoring, status OPEN"
          - "Field.health_score recomputed per calc field_health_score"
          - "accessible_until := now + grower's plan storage_retention_days"

      - from: READY
        to: DELIVERED
        trigger: POST /ag-drone/deliverables/{id}/deliver
        actor: FlightCoordinator
        preconditions:
          - "Deliverable in READY (ERR_DELIV_NOT_READY)"
        side_effects: []

      - from: READY
        to: EXPIRED
        trigger: "system clock sweep (when current_utc >= accessible_until)"
        actor: system
        preconditions: []
        side_effects:
          - "Subsequent grower GETs return ERR_DELIV_EXPIRED"

      - from: DELIVERED
        to: EXPIRED
        trigger: "system clock sweep (when current_utc >= accessible_until)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ScoutingAlert
    initial_state: OPEN
    terminal_states: [REVIEWED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: POST /ag-drone/alerts/{id}/claim
        actor: Agronomist
        preconditions:
          - "Alert in OPEN (ERR_ALERT_NOT_OPEN)"
          - "X-User-ID != pilot_id of the originating FlightMission (segregation of duties) (ERR_SELF_REVIEW_FORBIDDEN)"
        side_effects:
          - "reviewing_agronomist_id := X-User-ID"

      - from: UNDER_REVIEW
        to: REVIEWED
        trigger: POST /ag-drone/alerts/{id}/review
        actor: Agronomist
        preconditions:
          - "Alert in UNDER_REVIEW (ERR_ALERT_NOT_UNDER_REVIEW)"
          - "X-User-ID == reviewing_agronomist_id (ERR_NOT_CLAIMING_AGRONOMIST)"
          - "review_outcome in {CONFIRMED, DISMISSED, NEEDS_REFLIGHT} (ERR_REVIEW_OUTCOME_INVALID)"
        side_effects:
          - "If review_outcome == DISMISSED: Field.health_score recomputed per calc field_health_score with this alert excluded"
          - "If review_outcome == NEEDS_REFLIGHT: a new FlightMission is NOT auto-created; Field.health_score recomputed per calc field_health_score with alert severity doubled weight"

      - from: UNDER_REVIEW
        to: OPEN
        trigger: POST /ag-drone/alerts/{id}/release
        actor: Agronomist
        preconditions:
          - "Alert in UNDER_REVIEW (ERR_ALERT_NOT_UNDER_REVIEW)"
          - "X-User-ID == reviewing_agronomist_id (ERR_NOT_CLAIMING_AGRONOMIST)"
        side_effects:
          - "reviewing_agronomist_id := null"

  - entity: InsuranceClaim
    initial_state: SUBMITTED
    terminal_states: [DENIED, PAID]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: POST /ag-drone/claims/{id}/open-review
        actor: ClaimsAdjuster
        preconditions:
          - "Claim in SUBMITTED (ERR_CLAIM_NOT_SUBMITTED)"
        side_effects:
          - "adjuster_user_id := X-User-ID"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: POST /ag-drone/claims/{id}/approve
        actor: ClaimsAdjuster
        preconditions:
          - "Claim in UNDER_REVIEW (ERR_CLAIM_NOT_UNDER_REVIEW)"
          - "Requested approval payload amount_cents > 0 and <= remaining liability cap on the mission (ERR_CLAIM_EXCEEDS_COVERAGE)"
          - "Referenced mission is in COMPLETED or WEATHER_ABORTED (ERR_CLAIM_MISSION_NOT_FINAL)"
        side_effects:
          - "approved_amount_cents := payload amount_cents"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: POST /ag-drone/claims/{id}/deny
        actor: ClaimsAdjuster
        preconditions:
          - "Claim in UNDER_REVIEW (ERR_CLAIM_NOT_UNDER_REVIEW)"
        side_effects:
          - "approved_amount_cents := 0"

      - from: APPROVED
        to: PAID
        trigger: POST /ag-drone/claims/{id}/pay
        actor: ClaimsAdjuster
        preconditions:
          - "Claim in APPROVED (ERR_CLAIM_NOT_APPROVED)"
        side_effects:
          - "Grower.credit_balance_cents += approved_amount_cents"

# =============================================================================
# Concurrency Rules (OCC)
# =============================================================================
concurrency_rules:
  - rule_id: mission-replan-stale-version
    parent_entity: FlightMission
    write_endpoint: "POST /ag-drone/missions/{id}/replan"
    occ_field: "expected_mission_version"
    description: |
      Replanning a WEATHER_ABORTED or CANCELLED mission into a fresh PLANNED
      revision against a stale expected_mission_version is rejected. The OCC
      check on FlightMission.version captures the case where another writer has
      already replanned the mission since the client last observed it, so the
      loser's view of which revision is current is stale.
    error_id: ERR_STALE_MISSION_VERSION
    http_status: 412

  - rule_id: grower-profile-stale-version
    parent_entity: Grower
    write_endpoint: "PATCH /ag-drone/growers/{id}"
    occ_field: "expected_grower_version"
    description: |
      Updating a grower's subscription_plan_id or liability_coverage_cents
      against a stale expected_grower_version is rejected. This captures the
      case where a suspension, reinstatement, or claim payout has advanced the
      grower's version since the client last read it, making the patch's
      assumptions (e.g. acres_included_ytd baseline) stale.
    error_id: ERR_STALE_GROWER_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: mission_billing
    description: "Billable cents for a completed mission under the grower's subscription; overage is tiered on cumulative acres within the subscription year."
    trigger: "FlightMission transitions CAPTURED -> COMPLETED (performed at mission completion; debit is realized against credit_balance at invoice run)"
    algorithm: tiered_pricing
    formula: |
      # Two variants exist; see variants[] below.
      # Both share the tier structure. Constants below.
      prior_acres = grower.acres_included_ytd   # BEFORE this mission's acres_flown is added
      new_acres   = mission.acres_flown
      included    = plan.included_acres_per_year
      # Included-tier portion:
      included_portion = max(0, min(new_acres, included - prior_acres))
      overage_acres    = new_acres - included_portion
      # Base variant (PROVISIONAL): straight overage rate
      provisional_cents = overage_acres * plan.overage_rate_cents_per_acre
      # Final variant (FINAL): overage priced with volume discount tiers on the overage band
      # tier 1: first 200 overage acres at full rate; tier 2: beyond 200 at 80% rate
      t1 = min(overage_acres, TIER1_OVERAGE_CAP)
      t2 = overage_acres - t1
      final_cents = t1 * plan.overage_rate_cents_per_acre + t2 * round(plan.overage_rate_cents_per_acre * TIER2_DISCOUNT)
      # Both variants round per-line BEFORE summing across a multi-mission invoice; line-level rounding pins order.
    input_set: "missions in COMPLETED for the grower within the current subscription year (from subscription_started_on, inclusive, to next anniversary, exclusive)"
    constants:
      TIER1_OVERAGE_CAP: 200     # acres
      TIER2_DISCOUNT: 0.80       # multiplier on overage rate beyond cap
    precision: "integer cents; per-line round_half_up BEFORE summing across lines"
    variants:
      - name: PROVISIONAL
        when: "mission completion (estimate quoted to grower immediately)"
        difference: "flat overage rate; ignores TIER2_DISCOUNT"
      - name: FINAL
        when: "monthly invoice run POST /ag-drone/growers/{id}/invoice"
        difference: "applies TIER2_DISCOUNT to overage acres beyond TIER1_OVERAGE_CAP; sum of per-line FINAL cents may differ from sum of PROVISIONAL cents for identical mission set"

  - name: anomaly_scoring
    description: "Derives anomaly_count and ScoutingAlert.severity from deliverable processing outputs."
    trigger: "ImageryDeliverable PROCESSING -> READY (via /process)"
    algorithm: threshold
    formula: |
      if kind == NDVI:
        # NDVI cells with value < NDVI_STRESS_THRESHOLD are anomalies; the payload's
        # ndvi_mean is the mean across all cells. anomaly_count = cells_below / total_cells * acres_flown,
        # rounded half-up to integer cells. The deliverable payload reports cells_below directly.
        anomaly_count = round_half_up(payload.cells_below_threshold * mission.acres_flown / 1000)
      else:  # PLANT_COUNT
        # anomaly iff plant_count_per_acre < STAND_MIN_PLANTS
        anomaly_count = 0 if payload.plant_count_per_acre >= STAND_MIN_PLANTS else mission.acres_flown
      # Severity ladder (>= boundaries are inclusive):
      #   anomaly_count == 0              -> no alert created
      #   1 <= anomaly_count < 10         -> LOW
      #   10 <= anomaly_count < 50        -> MEDIUM
      #   anomaly_count >= 50             -> HIGH
    input_set: "the single deliverable being processed"
    constants:
      NDVI_STRESS_THRESHOLD: 0.400
      STAND_MIN_PLANTS: 20000
      SEVERITY_LOW_MIN: 1
      SEVERITY_MEDIUM_MIN: 10
      SEVERITY_HIGH_MIN: 50
    precision: "anomaly_count integer; ndvi_mean 3 decimal places"

  - name: field_health_score
    description: "Aggregate 0-100 health on Field; recomputed on deliverable READY and on alert DISMISSED / NEEDS_REFLIGHT."
    trigger: "ImageryDeliverable -> READY; ScoutingAlert -> REVIEWED (outcome DISMISSED or NEEDS_REFLIGHT)"
    algorithm: weighted_scoring
    formula: |
      # Base from latest READY/DELIVERED deliverable on the field:
      #   kind == NDVI:        base = round(ndvi_mean * 100)
      #   kind == PLANT_COUNT: base = min(100, round(plant_count_per_acre / STAND_TARGET_PLANTS * 100))
      # Alert penalty: sum over OPEN and UNDER_REVIEW alerts of severity weight
      #   LOW = 2, MEDIUM = 5, HIGH = 12; if any UNDER_REVIEW alert's outcome hint is
      #   NEEDS_REFLIGHT (i.e., alert just came back from REVIEWED with that outcome), weight doubles for the next recompute.
      # Dismissed alerts contribute 0 (post-DISMISSED recompute excludes them).
      # health_score = max(0, min(100, base - alert_penalty))
    input_set: "latest deliverable by created_at (status READY or DELIVERED) on the field; alerts with status in {OPEN, UNDER_REVIEW}"
    constants:
      STAND_TARGET_PLANTS: 30000
      SEVERITY_WEIGHT_LOW: 2
      SEVERITY_WEIGHT_MEDIUM: 5
      SEVERITY_WEIGHT_HIGH: 12
    precision: "integer, floor at 0, cap at 100"

  - name: authorization_window_check
    description: "Decides whether a LAANC authorization covers a mission window, with inclusive/exclusive boundary semantics."
    trigger: "FlightMission PLANNED -> AUTHORIZE when field.laanc_required"
    algorithm: interval_merge
    formula: |
      # Authorization [effective_from, effective_until) must FULLY CONTAIN
      # mission [scheduled_start, scheduled_end):
      #   effective_from <= scheduled_start   (inclusive)
      #   scheduled_end  <  effective_until   (strict — landing at exact expiry instant is rejected)
      # Adjacency is NOT sufficient: two authorizations whose windows merely abut
      # do not merge; a mission straddling their seam fails.
    input_set: "the single authorization referenced by mission.authorization_id"
    constants: {}
    precision: "ISO8601 UTC to seconds"

  - name: mission_window_conflict
    description: "Determines whether two missions on the same field conflict. Unlike authorization_window_check (single-interval containment), this uses buffered overlap with aggregate capacity."
    trigger: "FlightMission PLANNED -> AUTHORIZED (validations), and on replan"
    algorithm: interval_merge
    formula: |
      # Two missions A, B on the same field conflict iff:
      #   A.status not in {COMPLETED, CANCELLED, WEATHER_ABORTED}
      #   AND B.status not in {COMPLETED, CANCELLED, WEATHER_ABORTED}
      #   AND A.[scheduled_start - 30min, scheduled_end + 30min)
      #       overlaps B.[scheduled_start - 30min, scheduled_end + 30min)
      # Overlap is half-open with the 30-minute pad; adjacent (gap == 0 after pad)
      # is permitted only when padded intervals are exactly back-to-back
      # (A.padded_end == B.padded_start).
    input_set: "all non-terminal FlightMissions on the same Field"
    constants:
      BUFFER_MINUTES: 30
    precision: "ISO8601 UTC to seconds"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-empty"
    error_id: ERR_MISSING_AUTH_CONTEXT
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role in X-User-Role is allowed on this endpoint per §1.5 roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every path-template id and body FK resolves to an existing entity, validated left-to-right (grower -> field -> mission -> ...)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "Target entity is in a state that admits the requested transition (state-machine preconditions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints (authorize, launch, capture, complete, abort-weather, cancel, claim, review, release, open-review, approve, deny, pay, suspend, reinstate, terminate, revoke, process, deliver, replan)"

  - priority: 5
    category: business_safety
    check: "FlightMission authorize: pilot part107_expires_on >= scheduled_end date AND pilot.status == ACTIVE; if SPRAY, applicator_license_expires_on >= scheduled_end date AND applicator_license_no non-empty AND chemical_product_label non-empty"
    error_id: ERR_PILOT_CERT_EXPIRED
    http_status: 422
    applies_to: ["POST /ag-drone/missions/{id}/authorize"]

  - priority: 6
    category: business_safety
    check: "FlightMission authorize: if field.laanc_required then authorization_id present, authorization status == ACTIVE, and authorization window fully contains mission window (inclusive start, strict end); if NOT laanc_required then authorization_id must be null"
    error_id: ERR_AUTH_WINDOW_INSUFFICIENT
    http_status: 422
    applies_to: ["POST /ag-drone/missions/{id}/authorize"]

  - priority: 7
    category: business_safety
    check: "FlightMission authorize: grower's plan spray_allowed must be true when mission_type == SPRAY"
    error_id: ERR_SPRAY_PLAN_FORBIDDEN
    http_status: 422
    applies_to: ["POST /ag-drone/missions/{id}/authorize"]

  - priority: 8
    category: business_safety
    check: "FlightMission capture: wind_kt_max_observed <= 20; abort-weather: wind_kt_max_observed > 20"
    error_id: ERR_WEATHER_LIMIT_EXCEEDED
    http_status: 422
    applies_to: ["POST /ag-drone/missions/{id}/capture", "POST /ag-drone/missions/{id}/abort-weather"]

  - priority: 9
    category: business_constraint
    check: "FlightMission authorize: no other non-terminal mission on the same field has a padded [start-30min, end+30min) window overlapping this one"
    error_id: ERR_MISSION_WINDOW_CONFLICT
    http_status: 409
    applies_to: ["POST /ag-drone/missions/{id}/authorize"]

  - priority: 10
    category: business_constraint
    check: "ScoutingAlert claim: X-User-ID != originating mission's pilot_id (segregation of duties)"
    error_id: ERR_SELF_REVIEW_FORBIDDEN
    http_status: 422
    applies_to: ["POST /ag-drone/alerts/{id}/claim"]

  - priority: 11
    category: business_constraint
    check: "ScoutingAlert review/release: X-User-ID == reviewing_agronomist_id"
    error_id: ERR_NOT_CLAIMING_AGRONOMIST
    http_status: 403
    applies_to: ["POST /ag-drone/alerts/{id}/review", "POST /ag-drone/alerts/{id}/release"]

  - priority: 12
    category: business_referential
    check: "FlightMission launch: X-User-ID == mission.pilot_id"
    error_id: ERR_NOT_ASSIGNED_PILOT
    http_status: 403
    applies_to: ["POST /ag-drone/missions/{id}/launch", "POST /ag-drone/missions/{id}/capture", "POST /ag-drone/missions/{id}/abort-weather"]

  - priority: 13
    category: business_temporal
    check: "FlightMission launch: current_utc in [scheduled_start, scheduled_end); mission create: scheduled_start > current_utc"
    error_id: ERR_OUTSIDE_WINDOW
    http_status: 422
    applies_to: ["POST /ag-drone/missions/{id}/launch", "POST /ag-drone/fields/{id}/missions", "POST /ag-drone/missions/{id}/replan"]

  - priority: 14
    category: business_temporal
    check: "Grower GET of ImageryDeliverable: current_utc < accessible_until AND status != EXPIRED"
    error_id: ERR_DELIV_EXPIRED
    http_status: 410
    applies_to: ["GET /ag-drone/deliverables/{id}"]

  - priority: 15
    category: business_fiscal
    check: "InsuranceClaim approve: amount_cents > 0 AND (sum of approved_amount_cents over all APPROVED/PAID claims on the same mission) + amount_cents <= grower.liability_coverage_cents"
    error_id: ERR_CLAIM_EXCEEDS_COVERAGE
    http_status: 422
    applies_to: ["POST /ag-drone/claims/{id}/approve"]

  - priority: 16
    category: business_fiscal
    check: "Invoice run: grower.credit_balance_cents + charge_amount_cents >= 0 is not required; instead, invoice charges debit balance possibly negative — but claim payout requires claim APPROVED"
    error_id: ERR_CLAIM_NOT_APPROVED
    http_status: 409
    applies_to: ["POST /ag-drone/claims/{id}/pay"]

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- SubscriptionPlan ---
  - method: POST
    path: "/ag-drone/subscription-plans"
    description: "Create a subscription plan"
    roles: [OpsAdmin]
    code: 201
    input: [plan_code, included_acres_per_year, base_fee_cents, overage_rate_cents_per_acre, spray_allowed, ndvi_turnaround_hours, storage_retention_days]
    output: SubscriptionPlan
    side_effects: []

  - method: GET
    path: "/ag-drone/subscription-plans/{id}"
    description: "Get a subscription plan"
    roles: [OpsAdmin, FlightCoordinator, Grower]
    code: 200
    input: []
    output: SubscriptionPlan
    side_effects: []

  - method: GET
    path: "/ag-drone/subscription-plans"
    description: "List subscription plans"
    roles: [OpsAdmin, FlightCoordinator, Grower]
    code: 200
    input: ["limit?", "offset?"]
    output: "SubscriptionPlan[]"
    side_effects: []

  # --- Grower ---
  - method: POST
    path: "/ag-drone/growers"
    description: "Register a grower"
    roles: [OpsAdmin]
    code: 201
    input: [legal_name, contact_email, subscription_plan_id, subscription_started_on, liability_coverage_cents]
    output: Grower
    side_effects:
      - "status := ACTIVE"
      - "acres_included_ytd := 0"
      - "credit_balance_cents := 0"

  - method: GET
    path: "/ag-drone/growers/{id}"
    description: "Get a grower"
    roles: [OpsAdmin, FlightCoordinator, Grower, ClaimsAdjuster]
    code: 200
    input: []
    output: Grower
    side_effects: []

  - method: GET
    path: "/ag-drone/growers"
    description: "List growers"
    roles: [OpsAdmin, FlightCoordinator]
    code: 200
    input: ["limit?", "offset?", "status?", "subscription_plan_id?"]
    output: "Grower[]"
    side_effects: []

  - method: PATCH
    path: "/ag-drone/growers/{id}"
    description: "Update grower subscription_plan_id / liability_coverage_cents with OCC"
    roles: [OpsAdmin]
    code: 200
    input: ["subscription_plan_id?", "liability_coverage_cents?", expected_grower_version]
    output: Grower
    side_effects:
      - "increments Grower.version by 1"

  - method: POST
    path: "/ag-drone/growers/{id}/suspend"
    description: "Suspend a grower; cancels non-terminal missions"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Grower
    side_effects:
      - "Grower.status -> SUSPENDED; PLANNED/AUTHORIZED missions on grower's fields -> CANCELLED"

  - method: POST
    path: "/ag-drone/growers/{id}/reinstate"
    description: "Reinstate a suspended grower"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Grower
    side_effects: ["Grower.status -> ACTIVE"]

  - method: POST
    path: "/ag-drone/growers/{id}/terminate"
    description: "Terminate a suspended grower"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Grower
    side_effects:
      - "Grower.status -> TERMINATED; non-terminal missions cancelled; non-terminal claims denied"

  - method: POST
    path: "/ag-drone/growers/{id}/invoice"
    description: "Run monthly invoice; computes FINAL billing for all COMPLETED missions in the period and debits credit_balance"
    roles: [OpsAdmin]
    code: 200
    input: [period_start, period_end]
    output: "{ invoice_cents: integer, provisional_total_cents: integer, line_items: array }"
    side_effects:
      - "Grower.credit_balance_cents -= invoice_cents"
      - "increments Grower.version by 1"

  # --- Field ---
  - method: POST
    path: "/ag-drone/growers/{id}/fields"
    description: "Create a field under a grower"
    roles: [OpsAdmin, Grower]
    code: 201
    input: [field_name, legal_acres, airspace_class, insurance_policy_no]
    output: Field
    side_effects:
      - "laanc_required computed from airspace_class"
      - "surveyed_acres := legal_acres"
      - "health_score := 100"

  - method: GET
    path: "/ag-drone/fields/{id}"
    description: "Get a field"
    roles: [OpsAdmin, FlightCoordinator, Grower, Agronomist, RemotePilot]
    code: 200
    input: []
    output: Field
    side_effects: []

  - method: GET
    path: "/ag-drone/growers/{id}/fields"
    description: "List fields for a grower"
    roles: [OpsAdmin, FlightCoordinator, Grower]
    code: 200
    input: ["limit?", "offset?"]
    output: "Field[]"
    side_effects: []

  # --- PilotProfile ---
  - method: POST
    path: "/ag-drone/pilots"
    description: "Register a pilot profile"
    roles: [OpsAdmin]
    code: 201
    input: [pilot_name, part107_certificate_no, part107_expires_on, "applicator_license_no?", "applicator_license_expires_on?", "night_waiver?"]
    output: PilotProfile
    side_effects: ["status := ACTIVE"]

  - method: GET
    path: "/ag-drone/pilots/{id}"
    description: "Get a pilot"
    roles: [OpsAdmin, FlightCoordinator, RemotePilot, Agronomist]
    code: 200
    input: []
    output: PilotProfile
    side_effects: []

  - method: GET
    path: "/ag-drone/pilots"
    description: "List pilots"
    roles: [OpsAdmin, FlightCoordinator]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "PilotProfile[]"
    side_effects: []

  # --- AirspaceAuthorization ---
  - method: POST
    path: "/ag-drone/airspace-authorizations"
    description: "Register a LAANC authorization for a field"
    roles: [OpsAdmin, FlightCoordinator]
    code: 201
    input: [field_id, authorization_ref, max_altitude_ft, effective_from, effective_until]
    output: AirspaceAuthorization
    side_effects: ["status := ACTIVE"]

  - method: GET
    path: "/ag-drone/airspace-authorizations/{id}"
    description: "Get an authorization"
    roles: [OpsAdmin, FlightCoordinator, RemotePilot]
    code: 200
    input: []
    output: AirspaceAuthorization
    side_effects: []

  - method: GET
    path: "/ag-drone/airspace-authorizations"
    description: "List authorizations; filter by field_id"
    roles: [OpsAdmin, FlightCoordinator, RemotePilot]
    code: 200
    input: ["field_id?", "status?", "limit?", "offset?"]
    output: "AirspaceAuthorization[]"
    side_effects: []

  - method: POST
    path: "/ag-drone/airspace-authorizations/{id}/revoke"
    description: "Revoke an ACTIVE authorization"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: AirspaceAuthorization
    side_effects:
      - "status -> REVOKED"
      - "PLANNED/AUTHORIZED missions referencing it -> CANCELLED"

  # --- FlightMission ---
  - method: POST
    path: "/ag-drone/fields/{id}/missions"
    description: "Plan a new mission on a field"
    roles: [FlightCoordinator]
    code: 201
    input: [mission_type, pilot_id, "authorization_id?", scheduled_start, scheduled_end, acres_planned, "chemical_product_label?", "wind_kt_max_observed?", "gallons_dispensed?"]
    output: FlightMission
    side_effects: ["status := PLANNED; acres_flown := 0"]

  - method: GET
    path: "/ag-drone/missions/{id}"
    description: "Get a mission"
    roles: [OpsAdmin, FlightCoordinator, Grower, RemotePilot, Agronomist, ClaimsAdjuster]
    code: 200
    input: []
    output: FlightMission
    side_effects: []

  - method: GET
    path: "/ag-drone/fields/{id}/missions"
    description: "List missions on a field"
    roles: [OpsAdmin, FlightCoordinator, Grower, RemotePilot]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "FlightMission[]"
    side_effects: []

  - method: GET
    path: "/ag-drone/missions"
    description: "List missions across fields; filterable by pilot_id, authorization_id, field_id, status"
    roles: [OpsAdmin, FlightCoordinator]
    code: 200
    input: ["limit?", "offset?", "status?", "field_id?", "pilot_id?", "authorization_id?"]
    output: "FlightMission[]"
    side_effects: []

  - method: POST
    path: "/ag-drone/missions/{id}/authorize"
    description: "Authorize a PLANNED mission"
    roles: [FlightCoordinator]
    code: 200
    input: []
    output: FlightMission
    side_effects: ["status -> AUTHORIZED; increments FlightMission.version"]

  - method: POST
    path: "/ag-drone/missions/{id}/launch"
    description: "Launch an AUTHORIZED mission; must be the assigned pilot"
    roles: [RemotePilot]
    code: 200
    input: []
    output: FlightMission
    side_effects: ["status -> IN_FLIGHT; increments FlightMission.version"]

  - method: POST
    path: "/ag-drone/missions/{id}/capture"
    description: "Record capture results and move IN_FLIGHT -> CAPTURED"
    roles: [RemotePilot]
    code: 200
    input: [acres_flown, wind_kt_max_observed, "gallons_dispensed?"]
    output: FlightMission
    side_effects: ["status -> CAPTURED; increments FlightMission.version"]

  - method: POST
    path: "/ag-drone/missions/{id}/abort-weather"
    description: "Abort an IN_FLIGHT mission for weather (wind > 20 kt)"
    roles: [RemotePilot]
    code: 200
    input: [wind_kt_max_observed]
    output: FlightMission
    side_effects: ["status -> WEATHER_ABORTED; increments FlightMission.version"]

  - method: POST
    path: "/ag-drone/missions/{id}/complete"
    description: "Complete a CAPTURED mission; computes billing, creates deliverables, snapshots spray record"
    roles: [FlightCoordinator]
    code: 200
    input: [deliverable_kinds]
    output: FlightMission
    side_effects:
      - "status -> COMPLETED"
      - "Field.surveyed_acres := acres_flown"
      - "Grower.acres_included_ytd += acres_flown"
      - "Creates ImageryDeliverable per kind in deliverable_kinds (status PROCESSING)"
      - "If SPRAY: creates immutable SprayMissionRecord"
      - "increments FlightMission.version; increments Grower.version; increments Field.version"

  - method: POST
    path: "/ag-drone/missions/{id}/cancel"
    description: "Cancel a PLANNED or AUTHORIZED mission"
    roles: [FlightCoordinator]
    code: 200
    input: []
    output: FlightMission
    side_effects: ["status -> CANCELLED; increments FlightMission.version"]

  - method: POST
    path: "/ag-drone/missions/{id}/replan"
    description: "Replan a WEATHER_ABORTED or CANCELLED mission into a fresh PLANNED revision (OCC)"
    roles: [FlightCoordinator]
    code: 201
    input: [scheduled_start, scheduled_end, expected_mission_version]
    output: FlightMission
    side_effects:
      - "Creates a new FlightMission with same field_id, mission_type, pilot_id, authorization_id, acres_planned, chemical_product_label; new mission status := PLANNED"
      - "increments original FlightMission.version by 1 (marks it as superseded)"

  # --- ImageryDeliverable ---
  - method: GET
    path: "/ag-drone/deliverables/{id}"
    description: "Get a deliverable (grower access gated by accessible_until)"
    roles: [OpsAdmin, FlightCoordinator, Grower, Agronomist, ProcessingEngine]
    code: 200
    input: []
    output: ImageryDeliverable
    side_effects: []

  - method: GET
    path: "/ag-drone/missions/{id}/deliverables"
    description: "List deliverables for a mission"
    roles: [OpsAdmin, FlightCoordinator, Grower, Agronomist, ProcessingEngine]
    code: 200
    input: ["limit?", "offset?"]
    output: "ImageryDeliverable[]"
    side_effects: []

  - method: POST
    path: "/ag-drone/deliverables/{id}/process"
    description: "Submit processing outputs; transitions PROCESSING -> READY; may create ScoutingAlert"
    roles: [ProcessingEngine]
    code: 200
    input: ["ndvi_mean?", "plant_count_per_acre?", "cells_below_threshold?"]
    output: ImageryDeliverable
    side_effects:
      - "status -> READY"
      - "anomaly_count computed per anomaly_scoring"
      - "If anomaly_count > 0: create ScoutingAlert (OPEN) on the field"
      - "Field.health_score recomputed"
      - "accessible_until := now + plan.storage_retention_days"

  - method: POST
    path: "/ag-drone/deliverables/{id}/deliver"
    description: "Mark READY deliverable as DELIVERED to grower"
    roles: [FlightCoordinator]
    code: 200
    input: []
    output: ImageryDeliverable
    side_effects: ["status -> DELIVERED"]

  # --- ScoutingAlert ---
  - method: GET
    path: "/ag-drone/alerts/{id}"
    description: "Get an alert"
    roles: [OpsAdmin, FlightCoordinator, Grower, Agronomist]
    code: 200
    input: []
    output: ScoutingAlert
    side_effects: []

  - method: GET
    path: "/ag-drone/fields/{id}/alerts"
    description: "List alerts on a field"
    roles: [OpsAdmin, FlightCoordinator, Grower, Agronomist]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "ScoutingAlert[]"
    side_effects: []

  - method: GET
    path: "/ag-drone/alerts"
    description: "List alerts across fields; filterable by deliverable_id, reviewing_agronomist_id, field_id, status"
    roles: [OpsAdmin, FlightCoordinator, Agronomist]
    code: 200
    input: ["limit?", "offset?", "status?", "field_id?", "deliverable_id?", "reviewing_agronomist_id?"]
    output: "ScoutingAlert[]"
    side_effects: []

  - method: POST
    path: "/ag-drone/alerts/{id}/claim"
    description: "Agronomist claims an OPEN alert; cannot be the mission's pilot"
    roles: [Agronomist]
    code: 200
    input: []
    output: ScoutingAlert
    side_effects: ["status -> UNDER_REVIEW; reviewing_agronomist_id := X-User-ID"]

  - method: POST
    path: "/ag-drone/alerts/{id}/review"
    description: "Claiming agronomist submits review outcome"
    roles: [Agronomist]
    code: 200
    input: [review_outcome, "review_notes?"]
    output: ScoutingAlert
    side_effects:
      - "status -> REVIEWED"
      - "Field.health_score recomputed (DISMISSED excludes alert; NEEDS_REFLIGHT doubles weight on next recompute)"

  - method: POST
    path: "/ag-drone/alerts/{id}/release"
    description: "Claiming agronomist releases alert back to OPEN"
    roles: [Agronomist]
    code: 200
    input: []
    output: ScoutingAlert
    side_effects: ["status -> OPEN; reviewing_agronomist_id := null"]

  # --- SprayMissionRecord ---
  - method: GET
    path: "/ag-drone/missions/{id}/spray-record"
    description: "Get the immutable spray record for a SPRAY mission (array of 0 or 1)"
    roles: [OpsAdmin, FlightCoordinator, Grower, ClaimsAdjuster]
    code: 200
    input: []
    output: "SprayMissionRecord[]"
    side_effects: []

  # --- InsuranceClaim ---
  - method: POST
    path: "/ag-drone/growers/{id}/claims"
    description: "Submit an insurance claim against a mission"
    roles: [Grower]
    code: 201
    input: [mission_id, claim_amount_cents]
    output: InsuranceClaim
    side_effects: ["status := SUBMITTED; approved_amount_cents := 0"]

  - method: GET
    path: "/ag-drone/claims/{id}"
    description: "Get a claim"
    roles: [OpsAdmin, Grower, ClaimsAdjuster]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: []

  - method: GET
    path: "/ag-drone/claims"
    description: "List claims across growers; filterable by mission_id, grower_id, status"
    roles: [OpsAdmin, ClaimsAdjuster]
    code: 200
    input: ["limit?", "offset?", "status?", "mission_id?", "grower_id?"]
    output: "InsuranceClaim[]"
    side_effects: []

  - method: GET
    path: "/ag-drone/growers/{id}/claims"
    description: "List claims for a grower"
    roles: [OpsAdmin, Grower, ClaimsAdjuster]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "InsuranceClaim[]"
    side_effects: []

  - method: POST
    path: "/ag-drone/claims/{id}/open-review"
    description: "Adjuster opens review"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: ["status -> UNDER_REVIEW; adjuster_user_id := X-User-ID"]

  - method: POST
    path: "/ag-drone/claims/{id}/approve"
    description: "Adjuster approves claim with amount"
    roles: [ClaimsAdjuster]
    code: 200
    input: [amount_cents]
    output: InsuranceClaim
    side_effects: ["status -> APPROVED; approved_amount_cents := amount_cents"]

  - method: POST
    path: "/ag-drone/claims/{id}/deny"
    description: "Adjuster denies claim"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: ["status -> DENIED; approved_amount_cents := 0"]

  - method: POST
    path: "/ag-drone/claims/{id}/pay"
    description: "Pay an APPROVED claim; credits grower credit_balance"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects:
      - "status -> PAID"
      - "Grower.credit_balance_cents += approved_amount_cents"
      - "increments Grower.version by 1"

  # --- Test-driving / clock ---
  - method: POST
    path: "/ag-drone/_clock/set_current_utc"
    description: "Set the server's logical clock (ISO8601 UTC). Server default at startup is exactly 2026-08-01T00:00:00Z; before any set_current_utc call the logical clock reads this default and never falls back to wall-clock time."
    roles: [OpsAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "Triggers clock sweeps: AirspaceAuthorization ACTIVE -> EXPIRED when current_utc >= effective_until; ImageryDeliverable READY/DELIVERED -> EXPIRED when current_utc >= accessible_until"

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # auth
  - { id: ERR_MISSING_AUTH_CONTEXT, http: 401, condition: "X-User-Role or X-User-ID header missing or empty" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted on this endpoint" }

  # existence / request shape
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, wrong type, enum out of range, or domain invariant on input (acres_planned > legal_acres, scheduled_end <= scheduled_start, window > 6h, claim_amount_cents <= 0, liability_coverage_cents < 50000000)" }

  # state machine
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state-precondition violation on an action endpoint" }
  - { id: ERR_GROWER_NOT_ACTIVE, http: 409, condition: "Operation requires Grower.status == ACTIVE" }
  - { id: ERR_GROWER_NOT_SUSPENDED, http: 409, condition: "Operation requires Grower.status == SUSPENDED" }
  - { id: ERR_MISSION_IN_FLIGHT, http: 409, condition: "Grower termination blocked: a mission on the grower's fields is IN_FLIGHT" }
  - { id: ERR_MISSION_NOT_PLANNED, http: 409, condition: "Operation requires mission PLANNED" }
  - { id: ERR_MISSION_NOT_AUTHORIZED, http: 409, condition: "Operation requires mission AUTHORIZED" }
  - { id: ERR_MISSION_NOT_IN_FLIGHT, http: 409, condition: "Operation requires mission IN_FLIGHT" }
  - { id: ERR_MISSION_NOT_CAPTURED, http: 409, condition: "Operation requires mission CAPTURED" }
  - { id: ERR_MISSION_NOT_CANCELLABLE, http: 409, condition: "Cancel requires PLANNED or AUTHORIZED" }
  - { id: ERR_DELIV_NOT_PROCESSING, http: 409, condition: "Process requires deliverable PROCESSING" }
  - { id: ERR_DELIV_NOT_READY, http: 409, condition: "Deliver requires deliverable READY" }
  - { id: ERR_ALERT_NOT_OPEN, http: 409, condition: "Claim requires alert OPEN" }
  - { id: ERR_ALERT_NOT_UNDER_REVIEW, http: 409, condition: "Review/release requires alert UNDER_REVIEW" }
  - { id: ERR_CLAIM_NOT_SUBMITTED, http: 409, condition: "Open-review requires claim SUBMITTED" }
  - { id: ERR_CLAIM_NOT_UNDER_REVIEW, http: 409, condition: "Approve/deny require claim UNDER_REVIEW" }
  - { id: ERR_CLAIM_NOT_APPROVED, http: 409, condition: "Pay requires claim APPROVED" }
  - { id: ERR_AUTH_NOT_ACTIVE, http: 409, condition: "Operation requires authorization ACTIVE" }

  # business safety / compliance
  - { id: ERR_PILOT_CERT_EXPIRED, http: 422, condition: "Pilot Part 107 expired before scheduled_end, or pilot not ACTIVE, or SPRAY mission with applicator license expired/missing" }
  - { id: ERR_SPRAY_PLAN_FORBIDDEN, http: 422, condition: "mission_type == SPRAY but grower's plan spray_allowed == false" }
  - { id: ERR_AUTH_WINDOW_INSUFFICIENT, http: 422, condition: "Authorization window does not fully contain mission window (or authorization_id supplied for non-controlled airspace)" }
  - { id: ERR_AUTH_NOT_PERMITTED, http: 422, condition: "authorization_id must be null for fields with laanc_required == false" }
  - { id: ERR_WEATHER_LIMIT_EXCEEDED, http: 422, condition: "capture with wind_kt_max_observed > 20" }
  - { id: ERR_WEATHER_LIMIT_NOT_EXCEEDED, http: 422, condition: "abort-weather with wind_kt_max_observed <= 20" }
  - { id: ERR_ACRES_OUT_OF_RANGE, http: 422, condition: "acres_flown <= 0 or > acres_planned" }
  - { id: ERR_MISSION_WINDOW_CONFLICT, http: 409, condition: "Padded [start-30m, end+30m) overlaps another non-terminal mission on the same field" }
  - { id: ERR_OUTSIDE_WINDOW, http: 422, condition: "Launch outside [scheduled_start, scheduled_end), or mission scheduled_start not in the future" }
  - { id: ERR_DELIV_EXPIRED, http: 410, condition: "Grower GET after accessible_until or deliverable EXPIRED" }
  - { id: ERR_DELIV_INPUT_INVALID, http: 422, condition: "Process payload missing/wrong for kind (ndvi_mean out of [0,1]; plant_count_per_acre <= 0)" }

  # segregation / ownership
  - { id: ERR_SELF_REVIEW_FORBIDDEN, http: 422, condition: "Mission pilot cannot claim the alert raised from own mission" }
  - { id: ERR_NOT_CLAIMING_AGRONOMIST, http: 403, condition: "Review/release by non-claiming agronomist" }
  - { id: ERR_NOT_ASSIGNED_PILOT, http: 403, condition: "Launch/capture/abort by a pilot other than mission.pilot_id" }
  - { id: ERR_REVIEW_OUTCOME_INVALID, http: 422, condition: "review_outcome not in {CONFIRMED, DISMISSED, NEEDS_REFLIGHT}" }

  # fiscal
  - { id: ERR_CLAIM_EXCEEDS_COVERAGE, http: 422, condition: "Cumulative approved claims on a mission exceed grower.liability_coverage_cents" }
  - { id: ERR_CLAIM_MISSION_NOT_FINAL, http: 409, condition: "Claim approve requires mission COMPLETED or WEATHER_ABORTED" }

  # concurrency (OCC)
  - { id: ERR_STALE_MISSION_VERSION, http: 412, condition: "expected_mission_version mismatch on replan" }
  - { id: ERR_STALE_GROWER_VERSION, http: 412, condition: "expected_grower_version mismatch on PATCH /growers/{id}" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: OpsAdmin
    description: "Platform operator; manages plans, growers, pilots, authorizations, suspensions"
    identity: opaque
    exclusive_operations:
      - "POST /ag-drone/subscription-plans"
      - "POST /ag-drone/growers"
      - "PATCH /ag-drone/growers/{id}"
      - "POST /ag-drone/growers/{id}/suspend | reinstate | terminate | invoice"
      - "POST /ag-drone/pilots"
      - "POST /ag-drone/airspace-authorizations/{id}/revoke"
      - "POST /ag-drone/_clock/set_current_utc"
    shared_operations:
      - "GET endpoints across all resources"

  - name: FlightCoordinator
    description: "Plans and authorizes missions, completes them, delivers deliverables"
    identity: opaque
    exclusive_operations:
      - "POST /ag-drone/fields/{id}/missions"
      - "POST /ag-drone/missions/{id}/authorize | complete | cancel | replan"
      - "POST /ag-drone/deliverables/{id}/deliver"
    shared_operations:
      - "GET endpoints for plans, growers, fields, pilots, authorizations, missions, deliverables, alerts"

  - name: RemotePilot
    description: "Part 107 remote pilot in command; launches, captures, aborts own missions"
    identity: "entity_backed:PilotProfile"
    exclusive_operations:
      - "POST /ag-drone/missions/{id}/launch | capture | abort-weather"
    shared_operations:
      - "GET /ag-drone/pilots/{id}, GET /ag-drone/fields/{id}, GET /ag-drone/missions/{id}, GET /ag-drone/airspace-authorizations"

  - name: Agronomist
    description: "Reviews scouting alerts; cannot review alerts from own-flown missions"
    identity: "entity_backed:PilotProfile"
    exclusive_operations:
      - "POST /ag-drone/alerts/{id}/claim | review | release"
    shared_operations:
      - "GET /ag-drone/fields/{id}, GET /ag-drone/alerts/{id}, GET /ag-drone/deliverables/{id}"

  - name: Grower
    description: "Customer; views own fields/missions/deliverables; submits insurance claims"
    identity: "entity_backed:Grower"
    exclusive_operations:
      - "POST /ag-drone/growers/{id}/claims"
    shared_operations:
      - "GET own grower record, fields, missions, deliverables (subject to accessible_until), claims"

  - name: ClaimsAdjuster
    description: "Reviews and pays insurance claims"
    identity: opaque
    exclusive_operations:
      - "POST /ag-drone/claims/{id}/open-review | approve | deny | pay"
    shared_operations:
      - "GET growers, missions, claims, spray-records"

  - name: ProcessingEngine
    description: "Automated imagery processing service account"
    identity: opaque
    exclusive_operations:
      - "POST /ag-drone/deliverables/{id}/process"
    shared_operations:
      - "GET /ag-drone/deliverables/{id}, GET /ag-drone/missions/{id}/deliverables"
