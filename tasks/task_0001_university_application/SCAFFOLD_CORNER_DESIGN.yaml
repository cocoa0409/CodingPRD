            - call: "POST /recommenders"
              payload: { applicant_id: "${applicant_id}", email: "aer@x.com", full_name: "AER", relationship: "TEACHER" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /recommenders/${rec_id}/accept"
              payload: {}
              as: Anonymous
            # App on S1
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", school_id: "${s1}", plan: "REGULAR" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app1: $.data.id }
            - call: "POST /essay-submissions"
              payload: { application_id: "${app1}", prompt_code: "P1", body: "e1" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /recommendation-letters"
              payload: { application_id: "${app1}", recommender_id: "${rec_id}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { L1: $.data.id }
            - call: "POST /recommendation-letters/${L1}/start"
              payload: {}
              as: Recommender
              as_user_id: "${rec_id}"
