# =============================================================================
# PRD Benchmark Scaffold — Municipal Parking-Enforcement & Citation Issuance
# Difficulty: Expert
# =============================================================================

scenario: |
  757. Municipal Parking-Enforcement & Citation Issuance: patrol route & beat,
  LPR/handheld citation issuance & evidence (photo), violation code & fine
  schedule, scofflaw/boot-tow threshold, online pay/contest & hearing,
  registration-hold integration, officer shift & productivity, revenue/audit

domain_name: parking-enforcement
api_prefix: "/"

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Ledger reconciliation"
  complexity_layers:
    - rate_threshold_triggers        # scofflaw / boot / tow breakpoints
    - cascading_side_effects         # issue -> escalate -> boot -> registration hold
    - dual_variant_calculation       # settled vs projected balance; gross vs net productivity
    - optimistic_concurrency         # OCC on Citation.version and Vehicle.version

  entity_topology: flat
  # Peer top-level resources linked by explicit foreign keys; no nesting in URL paths.

  state_machine_shape: branching
  # Citation forks CONTESTED -> {UPHELD, DISMISSED} with divergent side effects;
  # Hearing carries a SCHEDULED -> SCHEDULED self-cycle (adjourn / reschedule).

  relationship_patterns:
    - one_to_many          # Vehicle -> many Citations; Shift -> many Citations
    - cross_aggregate      # Citation references Officer/Shift/ViolationCode/Beat across aggregates

  role_model: peer_roles
  # Admin owns configuration; EnforcementOfficer owns shifts/citations; Supervisor owns
  # enforcement escalation; HearingOfficer owns adjudication; Motorist owns pay/contest.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Officer
    parent: null
    common_fields: true
    fields:
      - { name: badge_number, type: string, source: input, description: "Unique officer badge identifier" }
      - { name: full_name, type: string, source: input, description: "Officer full name" }

  - name: Beat
    parent: null
    common_fields: false   # immutable configuration: id + created_at only
    fields:
      - { name: beat_code, type: string, source: input, description: "Short patrol beat code" }
      - { name: name, type: string, source: input, description: "Human-readable beat / route name" }
      - { name: patrol_zone, type: enum, source: input, description: "Zone class driving fine surcharge", constraints: "one of DOWNTOWN, RESIDENTIAL, SCHOOL" }

  - name: ViolationCode
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Violation short code, e.g. EXP_METER" }
      - { name: description, type: string, source: input, description: "Human description of the violation" }
      - { name: base_fine_cents, type: integer, source: input, description: "Base fine before tier/zone adjustment, in cents", constraints: ">= 0" }
      - { name: is_booting_eligible, type: boolean, source: input, description: "Whether citations of this code count toward boot/tow escalation" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: ACTIVE, constraints: "one of ACTIVE, RETIRED" }

  - name: HearingRoom
    parent: null
    common_fields: false   # immutable configuration: id + created_at only
    fields:
      - { name: room_code, type: string, source: input, description: "Hearing room code" }
      - { name: name, type: string, source: input, description: "Hearing room name" }

  - name: Shift
    parent: null
    common_fields: true
    fields:
      - { name: officer_id, type: string, source: input, description: "FK -> Officer.id; officer working the shift" }
      - { name: beat_id, type: string, source: input, description: "FK -> Beat.id; beat/route patrolled" }
      - { name: scheduled_start, type: datetime, source: input, description: "Shift start (ISO 8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Shift end (ISO 8601 UTC), must be after scheduled_start" }
      - { name: status, type: enum, source: system, description: "Shift lifecycle", default: OPEN, constraints: "one of OPEN, CLOSED" }
      - { name: gross_citation_count, type: integer, source: computed, description: "Count of all citations issued during this shift; finalized at close" }
      - { name: net_citation_count, type: integer, source: computed, description: "Count of citations issued during this shift excluding VOID and DISMISSED; finalized at close" }
      - { name: citations_per_hour, type: number, source: computed, description: "net_citation_count / scheduled hours, 2 dp; finalized at close" }
      - { name: closed_at, type: datetime, source: system, description: "Logical clock time when the shift was closed; null while OPEN" }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: plate, type: string, source: input, description: "License plate string" }
      - { name: state, type: string, source: input, description: "Two-letter registration state code" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Sum of amount_due_cents over unpaid citations counting SETTLED payments only (settled basis). Drives scofflaw_status." }
      - { name: projected_balance_cents, type: integer, source: computed, description: "Sum of amount_due_cents over unpaid citations counting SETTLED plus PENDING payments (forward-looking basis)." }
      - { name: unpaid_citation_count, type: integer, source: computed, description: "Count of this vehicle's citations whose status is in {ISSUED, UPHELD}" }
      - { name: scofflaw_status, type: enum, source: computed, description: "Escalation tier derived from balance and unpaid count", constraints: "one of NONE, SCOFFLAW, BOOT_ELIGIBLE, TOW_ELIGIBLE" }
      - { name: has_active_registration_hold, type: boolean, source: computed, description: "True when a RegistrationHold for this vehicle is in status PLACED" }

  - name: Citation
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; cited vehicle" }
      - { name: shift_id, type: string, source: input, description: "FK -> Shift.id; shift during which citation was issued" }
      - { name: violation_code_id, type: string, source: input, description: "FK -> ViolationCode.id; the violation" }
      - { name: officer_id, type: string, source: system, description: "FK -> Officer.id; copied from the shift's officer_id" }
      - { name: beat_id, type: string, source: system, description: "FK -> Beat.id; copied from the shift's beat_id, drives zone surcharge" }
      - { name: issued_via, type: enum, source: input, description: "Issuance channel", constraints: "one of LPR, HANDHELD" }
      - { name: evidence_photo_url, type: string, source: input, description: "URL of the required evidence photo" }
      - { name: fine_amount_cents, type: integer, source: computed, description: "Assessed fine at issue (tier x base + zone, clamped); may be overridden by reassess" }
      - { name: amount_paid_cents, type: integer, source: computed, description: "Sum of SETTLED payment amounts plus supervisor waivers against this citation" }
      - { name: amount_due_cents, type: integer, source: computed, description: "max(0, fine_amount_cents - amount_paid_cents)" }
      - { name: status, type: enum, source: system, description: "Citation lifecycle", default: ISSUED, constraints: "one of ISSUED, CONTESTED, UPHELD, DISMISSED, PAID, VOID" }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock time at issue" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: citation_id, type: string, source: input, description: "FK -> Citation.id; citation being paid" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents; must be 1..citation.amount_due_cents at creation", constraints: ">= 1" }
      - { name: method, type: enum, source: input, description: "Payment method", constraints: "one of CARD, ECHECK" }
      - { name: status, type: enum, source: system, description: "Payment lifecycle", default: PENDING, constraints: "one of PENDING, SETTLED, REFUNDED" }

  - name: Contest
    parent: null
    common_fields: true
    fields:
      - { name: citation_id, type: string, source: input, description: "FK -> Citation.id; contested citation" }
      - { name: grounds, type: string, source: input, description: "Motorist's stated grounds for contest" }
      - { name: status, type: enum, source: system, description: "Contest lifecycle", default: SUBMITTED, constraints: "one of SUBMITTED, HEARING_SCHEDULED, CLOSED_UPHELD, CLOSED_DISMISSED" }

  - name: Hearing
    parent: null
    common_fields: true
    fields:
      - { name: contest_id, type: string, source: input, description: "FK -> Contest.id; contest being adjudicated" }
      - { name: room_id, type: string, source: input, description: "FK -> HearingRoom.id; room reserved for the hearing" }
      - { name: scheduled_start, type: datetime, source: input, description: "Hearing start (ISO 8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Hearing end (ISO 8601 UTC), must be after scheduled_start" }
      - { name: adjournment_count, type: integer, source: computed, description: "Number of times this hearing has been adjourned/rescheduled", default: 0 }
      - { name: decision, type: enum, source: system, description: "Adjudication outcome; null until HELD", constraints: "one of UPHELD, DISMISSED" }
      - { name: status, type: enum, source: system, description: "Hearing lifecycle", default: SCHEDULED, constraints: "one of SCHEDULED, HELD" }

  - name: BootTowOrder
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; vehicle subject to the boot/tow" }
      - { name: order_type, type: enum, source: input, description: "Enforcement action", constraints: "one of BOOT, TOW" }
      - { name: origin, type: enum, source: system, description: "How the order was created", constraints: "one of AUTO, MANUAL" }
      - { name: fee_cents, type: integer, source: computed, description: "Flat enforcement fee: BOOT_FEE_CENTS for BOOT, TOW_FEE_CENTS for TOW" }
      - { name: release_total_cents, type: integer, source: computed, description: "Amount required to release, computed at release; null until RELEASED" }
      - { name: status, type: enum, source: system, description: "Order lifecycle", default: ORDERED, constraints: "one of ORDERED, APPLIED, RELEASED, CANCELLED" }

  - name: RegistrationHold
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; vehicle whose registration is held" }
      - { name: boot_tow_order_id, type: string, source: input, description: "FK -> BootTowOrder.id; the order whose creation placed this hold" }
      - { name: reason, type: enum, source: system, description: "Why the hold was placed", constraints: "one of BOOT_TOW_ESCALATION" }
      - { name: status, type: enum, source: system, description: "Hold lifecycle", default: PLACED, constraints: "one of PLACED, CLEARED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ViolationCode
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /violation-codes/{id}/retire"
        actor: Admin
        preconditions: []
        side_effects:
          - "Existing citations of this code are unaffected; new citations referencing a RETIRED code are rejected with ERR_VIOLATION_CODE_RETIRED (validated in Citation issue)."

  - entity: Shift
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /shifts/{id}/close"
        actor: EnforcementOfficer
        preconditions:
          - "Shift is OPEN"
          - "Acting EnforcementOfficer's X-User-ID equals shift.officer_id"
        side_effects:
          - "Run shift_productivity: set gross_citation_count, net_citation_count, citations_per_hour"
          - "Set closed_at = logical clock now"

  - entity: Citation
    initial_state: ISSUED
    terminal_states: [DISMISSED, PAID, VOID]
    transitions:
      - from: ISSUED
        to: CONTESTED
        trigger: "POST /contests (filing a contest against this citation)"
        actor: Motorist
        preconditions:
          - "Citation is ISSUED (ERR_CITATION_NOT_CONTESTABLE otherwise)"
          - "No existing non-terminal Contest for this citation (ERR_CONTEST_ALREADY_EXISTS)"
        side_effects:
          - "A Contest is created in SUBMITTED"
          - "Citation excluded from vehicle unpaid set while CONTESTED -> recompute vehicle_balance, vehicle_scofflaw_status"
      - from: CONTESTED
        to: UPHELD
        trigger: "POST /hearings/{id}/decide with decision=UPHELD"
        actor: HearingOfficer
        preconditions:
          - "Hearing is SCHEDULED"
        side_effects:
          - "Contest -> CLOSED_UPHELD; citation returns to the vehicle unpaid set (payable)"
          - "Recompute vehicle_balance and vehicle_scofflaw_status (may re-escalate)"
        note: "UPHELD branch of the CONTESTED fork — citation remains owed."
      - from: CONTESTED
        to: DISMISSED
        trigger: "POST /hearings/{id}/decide with decision=DISMISSED"
        actor: HearingOfficer
        preconditions:
          - "Hearing is SCHEDULED"
        side_effects:
          - "Contest -> CLOSED_DISMISSED; citation amount_due_cents becomes 0 (terminal)"
          - "Recompute vehicle_balance and vehicle_scofflaw_status (may de-escalate)"
        note: "DISMISSED branch of the CONTESTED fork — divergent side effects vs UPHELD."
      - from: ISSUED
        to: PAID
        trigger: "POST /payments/{id}/settle that brings amount_due_cents to 0"
        actor: Motorist
        preconditions:
          - "Citation is ISSUED or UPHELD"
          - "Settling this payment makes amount_paid_cents >= fine_amount_cents"
        side_effects:
          - "Recompute vehicle_balance, vehicle_scofflaw_status; may de-escalate and clear holds/orders"
      - from: UPHELD
        to: PAID
        trigger: "POST /payments/{id}/settle that brings amount_due_cents to 0"
        actor: Motorist
        preconditions:
          - "Citation is UPHELD"
          - "Settling this payment makes amount_paid_cents >= fine_amount_cents"
        side_effects:
          - "Recompute vehicle_balance, vehicle_scofflaw_status; may de-escalate and clear holds/orders"
      - from: PAID
        to: ISSUED
        trigger: "POST /payments/{id}/refund (compensation of a settled payment)"
        actor: Supervisor
        preconditions:
          - "The refunded payment is the SETTLED payment that made the citation PAID"
        side_effects:
          - "amount_paid_cents decreases by the refunded amount; citation reverts to ISSUED"
          - "Recompute vehicle_balance, vehicle_scofflaw_status (may re-escalate)"
      - from: ISSUED
        to: VOID
        trigger: "POST /citations/{id}/void"
        actor: Supervisor
        preconditions:
          - "Citation is ISSUED"
        side_effects:
          - "Citation leaves the vehicle unpaid set; recompute vehicle_balance, vehicle_scofflaw_status (may de-escalate)"

  - entity: Payment
    initial_state: PENDING
    terminal_states: [REFUNDED]
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "POST /payments/{id}/settle"
        actor: Motorist
        preconditions:
          - "Payment is PENDING"
          - "Citation is ISSUED or UPHELD (ERR_CITATION_NOT_PAYABLE otherwise)"
        side_effects:
          - "citation.amount_paid_cents increases by amount_cents; recompute amount_due_cents"
          - "If amount_due_cents reaches 0 -> Citation -> PAID (cascade recompute vehicle + clear holds/orders)"
      - from: SETTLED
        to: REFUNDED
        trigger: "POST /payments/{id}/refund"
        actor: Supervisor
        preconditions:
          - "Payment is SETTLED (ERR_PAYMENT_NOT_REFUNDABLE otherwise)"
        side_effects:
          - "citation.amount_paid_cents decreases by amount_cents; if citation was PAID it reverts to ISSUED"
          - "Recompute vehicle_balance, vehicle_scofflaw_status"

  - entity: Contest
    initial_state: SUBMITTED
    terminal_states: [CLOSED_UPHELD, CLOSED_DISMISSED]
    transitions:
      - from: SUBMITTED
        to: HEARING_SCHEDULED
        trigger: "POST /hearings (scheduling a hearing for this contest)"
        actor: HearingOfficer
        preconditions:
          - "Contest is SUBMITTED"
        side_effects:
          - "A Hearing is created in SCHEDULED after the room-availability (buffered overlap) check passes"
      - from: HEARING_SCHEDULED
        to: CLOSED_UPHELD
        trigger: "POST /hearings/{id}/decide with decision=UPHELD"
        actor: HearingOfficer
        preconditions:
          - "Hearing is SCHEDULED"
        side_effects:
          - "Citation CONTESTED -> UPHELD"
      - from: HEARING_SCHEDULED
        to: CLOSED_DISMISSED
        trigger: "POST /hearings/{id}/decide with decision=DISMISSED"
        actor: HearingOfficer
        preconditions:
          - "Hearing is SCHEDULED"
        side_effects:
          - "Citation CONTESTED -> DISMISSED"

  - entity: Hearing
    initial_state: SCHEDULED
    terminal_states: [HELD]
    transitions:
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /hearings/{id}/adjourn (reschedule to new times)"
        actor: HearingOfficer
        preconditions:
          - "Hearing is SCHEDULED"
          - "New [scheduled_start, scheduled_end) passes the room-availability (buffered overlap) check, excluding this hearing itself"
        side_effects:
          - "scheduled_start/scheduled_end replaced with new values; adjournment_count += 1"
        note: "Self-cycle SCHEDULED -> SCHEDULED making the Hearing machine non-linear (cyclic)."
      - from: SCHEDULED
        to: HELD
        trigger: "POST /hearings/{id}/decide"
        actor: HearingOfficer
        preconditions:
          - "Hearing is SCHEDULED"
          - "decision in {UPHELD, DISMISSED} (ERR_HEARING_DECISION_INVALID otherwise)"
        side_effects:
          - "Set decision; drive the contest and citation branch transitions"

  - entity: BootTowOrder
    initial_state: ORDERED
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: ORDERED
        to: APPLIED
        trigger: "POST /boot-tow-orders/{id}/apply"
        actor: Supervisor
        preconditions:
          - "Order is ORDERED"
        side_effects: []
      - from: ORDERED
        to: RELEASED
        trigger: "POST /boot-tow-orders/{id}/release"
        actor: Supervisor
        preconditions:
          - "Order is ORDERED or APPLIED"
        side_effects:
          - "Run boot_release_total: set release_total_cents"
      - from: APPLIED
        to: RELEASED
        trigger: "POST /boot-tow-orders/{id}/release"
        actor: Supervisor
        preconditions:
          - "Order is ORDERED or APPLIED"
        side_effects:
          - "Run boot_release_total: set release_total_cents"
      - from: ORDERED
        to: CANCELLED
        trigger: "system: vehicle de-escalates below BOOT_ELIGIBLE (cascade from payment settle / refund reversal / void / dismissal)"
        actor: system
        preconditions:
          - "Order is ORDERED (an APPLIED order is not auto-cancelled)"
          - "vehicle.scofflaw_status is NONE or SCOFFLAW after recompute"
        side_effects:
          - "Any PLACED RegistrationHold whose boot_tow_order_id is this order -> CLEARED"

  - entity: RegistrationHold
    initial_state: PLACED
    terminal_states: [CLEARED]
    transitions:
      - from: PLACED
        to: CLEARED
        trigger: "system: the placing BootTowOrder transitions to CANCELLED (vehicle de-escalated)"
        actor: system
        preconditions:
          - "Hold is PLACED"
        side_effects:
          - "vehicle.has_active_registration_hold recomputed to false when no PLACED hold remains"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC — true CREATE/UPDATE-with-supersede races)
# =============================================================================
concurrency_rules:
  - rule_id: citation-reassess-stale-version
    parent_entity: Citation
    write_endpoint: "POST /citations/{id}/reassess"
    occ_field: "expected_citation_version"
    description: |
      A supervisor fine reassessment carries the citation version the supervisor
      last observed. Reassessment does not change the citation's status, and a
      second reassessment from the same observed state would itself legitimately
      succeed under natural semantics, so this is not covered by any state
      precondition. When the citation's version has advanced since it was
      observed (an intervening reassessment, waiver, payment settle, or contest
      filing bumped it), the request carries a stale expected_citation_version
      and is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: vehicle-adjustment-stale-version
    parent_entity: Vehicle
    write_endpoint: "POST /vehicles/{id}/adjustments"
    occ_field: "expected_vehicle_version"
    description: |
      A supervisor balance waiver against a citation is applied through the
      parent Vehicle and carries the vehicle version last observed. Multiple
      waivers are legitimately repeatable and change no gating state field, so a
      second sequential waiver would naturally succeed; it is therefore a true
      supersede race. When another writer (a settle, refund, void, or prior
      waiver) has advanced the vehicle version since it was observed, the request
      carries a stale expected_vehicle_version and is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: citation_fine_amount
    trigger: "POST /citations (issue); recomputed on reassess override"
    algorithm: tiered_pricing
    formula: |
      # Inputs: violation_code.base_fine_cents, repeat-offense index n, beat.patrol_zone.
      # n = count of PRIOR citations with same vehicle_id AND violation_code_id AND
      #     status != VOID, ordered by created_at ASC, strictly before this citation.
      tier_multiplier =
        1.0 if n == 0
        1.5 if n == 1
        2.0 if n >= 2
      zone_surcharge =
        ZONE_SURCHARGE_DOWNTOWN_CENTS   if patrol_zone == DOWNTOWN
        ZONE_SURCHARGE_RESIDENTIAL_CENTS if patrol_zone == RESIDENTIAL
        ZONE_SURCHARGE_SCHOOL_CENTS     if patrol_zone == SCHOOL
      # PINNED ORDER: multiply base by tier and round to cents FIRST, then add the
      # zone surcharge, then clamp. (round then add, not add then round.)
      scaled = round_half_up(base_fine_cents * tier_multiplier)   # integer cents
      raw    = scaled + zone_surcharge
      fine_amount_cents = min(max(raw, MIN_FINE_CENTS), MAX_FINE_CENTS)
    input_set: "Prior non-VOID citations of the same vehicle+violation_code define n; single beat/violation for surcharge and base."
    constants:
      REPEAT_TIER_0_MULT: 1.0
      REPEAT_TIER_1_MULT: 1.5
      REPEAT_TIER_2PLUS_MULT: 2.0
      ZONE_SURCHARGE_DOWNTOWN_CENTS: 2000
      ZONE_SURCHARGE_RESIDENTIAL_CENTS: 0
      ZONE_SURCHARGE_SCHOOL_CENTS: 5000
      MIN_FINE_CENTS: 2500
      MAX_FINE_CENTS: 25000
    precision: "integer cents, round_half_up"

  - name: citation_amount_due
    trigger: "any change to a citation's payments/waivers or status"
    algorithm: aggregation
    formula: |
      amount_paid_cents = sum(p.amount_cents for p in Payments where p.citation_id = C.id and p.status = SETTLED)
                          + sum(w.waive_amount_cents for w waivers applied via vehicle adjustments to C)
      if C.status == DISMISSED: amount_due_cents = 0
      else: amount_due_cents = max(0, fine_amount_cents - amount_paid_cents)
    input_set: "SETTLED payments and applied supervisor waivers for citation C."
    precision: "integer cents"

  - name: vehicle_balance
    trigger: "any citation status change, payment settle/refund, waiver, void, or dismissal"
    algorithm: aggregation
    formula: |
      unpaid_set = { C : C.vehicle_id = V.id and C.status in {ISSUED, UPHELD} }
      # Settled basis (used for gating). Counts only SETTLED payments/waivers.
      outstanding_balance_cents = sum(max(0, C.fine_amount_cents - settled_paid(C)) for C in unpaid_set)
      # Forward-looking basis. Counts SETTLED plus PENDING payments as if pending will settle.
      projected_balance_cents   = sum(max(0, C.fine_amount_cents - settled_and_pending_paid(C)) for C in unpaid_set)
      unpaid_citation_count     = count(unpaid_set)
    input_set: "Citations of V in {ISSUED, UPHELD}; SETTLED vs SETTLED+PENDING payments distinguish the two variants."
    precision: "integer cents"
    variants:
      - name: settled_basis
        when: "outstanding_balance_cents — the authoritative ledger used by vehicle_scofflaw_status"
        difference: "Counts only SETTLED payments and applied waivers; PENDING payments do not reduce it."
      - name: projected_basis
        when: "projected_balance_cents — an optimistic preview of the balance if all PENDING payments settle"
        difference: "Additionally subtracts PENDING payment amounts; diverges from settled_basis whenever a PENDING payment exists."

  - name: vehicle_scofflaw_status
    trigger: "recomputed after vehicle_balance"
    algorithm: threshold
    formula: |
      if outstanding_balance_cents >= TOW_BALANCE_THRESHOLD_CENTS: TOW_ELIGIBLE
      elif outstanding_balance_cents >= BOOT_BALANCE_THRESHOLD_CENTS: BOOT_ELIGIBLE
      elif unpaid_citation_count >= SCOFFLAW_UNPAID_THRESHOLD: SCOFFLAW
      else: NONE
    input_set: "outstanding_balance_cents (settled basis) and unpaid_citation_count."
    constants:
      SCOFFLAW_UNPAID_THRESHOLD: 3
      BOOT_BALANCE_THRESHOLD_CENTS: 50000
      TOW_BALANCE_THRESHOLD_CENTS: 100000
    precision: "exact integer comparison; boundary is inclusive (>=)"

  - name: shift_productivity
    trigger: "POST /shifts/{id}/close"
    algorithm: aggregation
    formula: |
      shift_citations = { C : C.shift_id = S.id }   # all citations issued during the shift
      gross_citation_count = count(shift_citations)
      net_citation_count   = count(C in shift_citations where C.status not in {VOID, DISMISSED})
      hours = (scheduled_end - scheduled_start) in hours  # > 0 by validation
      citations_per_hour = 0.00 if net_citation_count == 0 else round_half_up(net_citation_count / hours, 2)
    input_set: "Citations whose shift_id = S at the moment of close."
    precision: "counts are integers; citations_per_hour 2 dp round_half_up"
    variants:
      - name: gross
        when: "gross_citation_count — raw output volume, all citations issued"
        difference: "Includes VOID and DISMISSED citations."
      - name: net
        when: "net_citation_count and citations_per_hour — quality-adjusted productivity"
        difference: "Excludes VOID and DISMISSED citations; diverges from gross whenever any issued citation was voided or dismissed."

  - name: boot_release_total
    trigger: "POST /boot-tow-orders/{id}/release"
    algorithm: aggregation
    formula: |
      citations_subtotal = sum(C.amount_due_cents for C in Citations where C.vehicle_id = order.vehicle_id and C.status in {ISSUED, UPHELD})
      boot_fee = BOOT_FEE_CENTS if order.order_type == BOOT else TOW_FEE_CENTS
      # PINNED ORDER: sum the citation amounts FIRST, then apply the admin percentage
      # to that subtotal and round once, THEN add the flat enforcement fee.
      # (admin fee is charged on citations_subtotal only, NOT on the boot/tow fee.)
      admin_fee = round_half_up(citations_subtotal * ADMIN_FEE_PCT)
      release_total_cents = citations_subtotal + boot_fee + admin_fee
    input_set: "Unpaid citations {ISSUED, UPHELD} of the order's vehicle at release time; the order's own fee."
    constants:
      BOOT_FEE_CENTS: 7500
      TOW_FEE_CENTS: 15000
      ADMIN_FEE_PCT: 0.085
    precision: "integer cents, round_half_up on the admin percentage before summing"

  - name: interval_overlap_checks
    trigger: "POST /shifts (shift interval); POST /hearings and POST /hearings/{id}/adjourn (hearing interval)"
    algorithm: interval_merge
    formula: |
      # Shift overlap on an Officer — BARE half-open intervals, no buffer.
      #   Given a candidate [s2, e2) for officer O, reject if any existing Shift X of O
      #   with status == OPEN satisfies:  s2 < X.scheduled_end  AND  X.scheduled_start < e2
      #   Adjacency is allowed: e_prev == s_next does NOT overlap (half-open). -> ERR_SHIFT_OVERLAP
      #
      # Hearing overlap on a HearingRoom — BUFFERED intervals (ROOM_BUFFER_MIN minutes turnaround).
      #   Given a candidate [s2, e2) in room R (excluding the hearing itself on adjourn), reject if any
      #   existing Hearing X in R with status == SCHEDULED satisfies:
      #     s2 < (X.scheduled_end + ROOM_BUFFER_MIN)  AND  (X.scheduled_start - ROOM_BUFFER_MIN) < e2
      #   i.e. a gap strictly less than ROOM_BUFFER_MIN between the two hearings is rejected. -> ERR_ROOM_UNAVAILABLE
    input_set: "OPEN shifts of the officer (bare) vs SCHEDULED hearings of the room (buffered)."
    constants:
      SHIFT_BUFFER_MIN: 0
      ROOM_BUFFER_MIN: 15
    precision: "timestamp comparison at second resolution; boundaries half-open"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted to perform this operation per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path and body-referenced resources exist, validated left-to-right (path ids first, then body FKs in declared order)"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints that reference a resource id"

  - priority: 4
    category: business_referential
    check: "EnforcementOfficer ownership: X-User-ID equals the officer_id on the shift being created / on the shift referenced by a citation issue"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /shifts, POST /shifts/{id}/close, POST /citations"

  - priority: 5
    category: state
    check: "OCC version guard: for endpoints taking expected_*_version, the supplied version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /citations/{id}/reassess, POST /vehicles/{id}/adjustments"

  - priority: 6
    category: state
    check: "Target resource is in a state that permits the requested transition"
    error_id: "ERR_INVALID_STATE / ERR_SHIFT_NOT_OPEN / ERR_CITATION_NOT_PAYABLE / ERR_CITATION_NOT_CONTESTABLE / ERR_PAYMENT_NOT_REFUNDABLE / ERR_CONTEST_ALREADY_EXISTS / ERR_BOOT_ALREADY_ACTIVE"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_temporal
    check: "Interval overlap: Shift must not overlap another OPEN shift of the same officer (half-open); Hearing must not violate the buffered room-availability window"
    error_id: "ERR_SHIFT_OVERLAP / ERR_ROOM_UNAVAILABLE"
    http_status: 409
    applies_to: "POST /shifts, POST /hearings, POST /hearings/{id}/adjourn"

  - priority: 8
    category: business_safety
    check: "Enforcement eligibility: referenced ViolationCode is ACTIVE (not RETIRED); Vehicle is BOOT_ELIGIBLE or TOW_ELIGIBLE for a manual boot/tow order"
    error_id: "ERR_VIOLATION_CODE_RETIRED / ERR_VEHICLE_NOT_BOOT_ELIGIBLE"
    http_status: 422
    applies_to: "POST /citations, POST /boot-tow-orders"

  - priority: 9
    category: business_fiscal
    check: "Monetary bounds: payment amount within 1..amount_due at creation; waiver amount not exceeding the citation's amount_due; reassessed fine within [MIN_FINE_CENTS, MAX_FINE_CENTS]"
    error_id: "ERR_PAYMENT_AMOUNT_MISMATCH / ERR_ADJUSTMENT_EXCEEDS_BALANCE / ERR_VALIDATION"
    http_status: 422
    applies_to: "POST /payments, POST /vehicles/{id}/adjustments, POST /citations/{id}/reassess"

  - priority: 10
    category: business_constraint
    check: "Field-level validation: required fields present, enums valid, scheduled_end > scheduled_start, pagination within bounds"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Configuration (Admin) ----
  - { method: POST, path: "/officers", description: "Register a patrol officer", roles: [Admin], code: 201, input: [badge_number, full_name], output: Officer, side_effects: [] }
  - { method: GET,  path: "/officers/{id}", description: "Get an officer", roles: [Admin, Supervisor, EnforcementOfficer, HearingOfficer, Motorist], code: 200, input: [], output: Officer, side_effects: [] }
  - { method: POST, path: "/beats", description: "Create a patrol beat/route", roles: [Admin], code: 201, input: [beat_code, name, patrol_zone], output: Beat, side_effects: [] }
  - { method: GET,  path: "/beats/{id}", description: "Get a beat", roles: [Admin, Supervisor, EnforcementOfficer, HearingOfficer, Motorist], code: 200, input: [], output: Beat, side_effects: [] }
  - { method: POST, path: "/violation-codes", description: "Create a violation code + fine schedule entry", roles: [Admin], code: 201, input: [code, description, base_fine_cents, is_booting_eligible], output: ViolationCode, side_effects: ["status=ACTIVE"] }
  - { method: GET,  path: "/violation-codes/{id}", description: "Get a violation code", roles: [Admin, Supervisor, EnforcementOfficer, HearingOfficer, Motorist], code: 200, input: [], output: ViolationCode, side_effects: [] }
  - { method: POST, path: "/violation-codes/{id}/retire", description: "Retire a violation code", roles: [Admin], code: 200, input: [], output: ViolationCode, side_effects: ["ViolationCode ACTIVE -> RETIRED"] }
  - { method: POST, path: "/hearing-rooms", description: "Create a hearing room", roles: [Admin], code: 201, input: [room_code, name], output: HearingRoom, side_effects: [] }
  - { method: GET,  path: "/hearing-rooms/{id}", description: "Get a hearing room", roles: [Admin, Supervisor, EnforcementOfficer, HearingOfficer, Motorist], code: 200, input: [], output: HearingRoom, side_effects: [] }

  # ---- Shift (EnforcementOfficer) ----
  - { method: POST, path: "/shifts", description: "Open a shift on a beat", roles: [EnforcementOfficer], code: 201, input: [officer_id, beat_id, scheduled_start, scheduled_end], output: Shift, side_effects: ["status=OPEN", "reject if overlaps another OPEN shift of the same officer (ERR_SHIFT_OVERLAP)"] }
  - { method: GET,  path: "/shifts/{id}", description: "Get a shift", roles: [Admin, Supervisor, EnforcementOfficer, HearingOfficer, Motorist], code: 200, input: [], output: Shift, side_effects: [] }
  - { method: GET,  path: "/shifts", description: "List shifts (reverse lookup for officer_id / beat_id)", roles: [Admin, Supervisor, EnforcementOfficer, HearingOfficer, Motorist], code: 200, input: ["officer_id?", "beat_id?", "status?", "limit?", "offset?"], output: "Shift[]", side_effects: [] }
  - { method: POST, path: "/shifts/{id}/close", description: "Close a shift; finalize productivity", roles: [EnforcementOfficer], code: 200, input: [], output: Shift, side_effects: ["Shift OPEN -> CLOSED", "run shift_productivity", "set closed_at"] }

  # ---- Vehicle ----
  - { method: POST, path: "/vehicles", description: "Register a vehicle record", roles: [Admin, Supervisor, EnforcementOfficer], code: 201, input: [plate, state], output: Vehicle, side_effects: ["scofflaw_status=NONE", "balances=0"] }
  - { method: GET,  path: "/vehicles/{id}", description: "Get a vehicle with computed ledger + scofflaw fields", roles: [Admin, Supervisor, EnforcementOfficer, HearingOfficer, Motorist], code: 200, input: [], output: Vehicle, side_effects: [] }
  - { method: POST, path: "/vehicles/{id}/adjustments", description: "Apply a supervisor waiver to one of the vehicle's citations (OCC on vehicle)", roles: [Supervisor], code: 200, input: [citation_id, waive_amount_cents, expected_vehicle_version], output: Vehicle, side_effects: ["citation.amount_paid_cents += waive_amount_cents", "recompute vehicle_balance + scofflaw_status", "increments Vehicle.version by 1"] }

  # ---- Citation ----
  - { method: POST, path: "/citations", description: "Issue a citation (LPR or handheld) with evidence photo", roles: [EnforcementOfficer], code: 201, input: [vehicle_id, shift_id, violation_code_id, issued_via, evidence_photo_url], output: Citation, side_effects: ["officer_id/beat_id copied from shift", "run citation_fine_amount", "status=ISSUED", "recompute vehicle_balance + scofflaw_status", "if vehicle becomes BOOT_ELIGIBLE/TOW_ELIGIBLE -> auto-create BootTowOrder (which places a RegistrationHold)"] }
  - { method: GET,  path: "/citations/{id}", description: "Get a citation", roles: [Admin, Supervisor, EnforcementOfficer, HearingOfficer, Motorist], code: 200, input: [], output: Citation, side_effects: [] }
  - { method: GET,  path: "/citations", description: "List citations (reverse lookup for vehicle/shift/violation/officer/beat)", roles: [Admin, Supervisor, EnforcementOfficer, HearingOfficer, Motorist], code: 200, input: ["vehicle_id?", "shift_id?", "violation_code_id?", "officer_id?", "beat_id?", "status?", "limit?", "offset?"], output: "Citation[]", side_effects: [] }
  - { method: POST, path: "/citations/{id}/reassess", description: "Supervisor overrides the fine amount (OCC on citation)", roles: [Supervisor], code: 200, input: [new_fine_amount_cents, expected_citation_version], output: Citation, side_effects: ["fine_amount_cents = clamp(new_fine_amount_cents,[MIN,MAX])", "recompute amount_due + vehicle_balance + scofflaw_status", "increments Citation.version by 1"] }
  - { method: POST, path: "/citations/{id}/void", description: "Void a citation", roles: [Supervisor], code: 200, input: [], output: Citation, side_effects: ["Citation ISSUED -> VOID", "recompute vehicle_balance + scofflaw_status (may de-escalate + clear orders/holds)"] }

  # ---- Payment (Motorist online pay) ----
  - { method: POST, path: "/payments", description: "Record an online payment against a citation (created PENDING)", roles: [Motorist], code: 201, input: [citation_id, amount_cents, method], output: Payment, side_effects: ["status=PENDING", "reject if citation not payable (ERR_CITATION_NOT_PAYABLE)", "reject if amount outside 1..amount_due (ERR_PAYMENT_AMOUNT_MISMATCH)"] }
  - { method: GET,  path: "/payments/{id}", description: "Get a payment", roles: [Admin, Supervisor, EnforcementOfficer, HearingOfficer, Motorist], code: 200, input: [], output: Payment, side_effects: [] }
  - { method: GET,  path: "/payments", description: "List payments (reverse lookup for citation_id)", roles: [Admin, Supervisor, EnforcementOfficer, HearingOfficer, Motorist], code: 200, input: ["citation_id?", "status?", "limit?", "offset?"], output: "Payment[]", side_effects: [] }
  - { method: POST, path: "/payments/{id}/settle", description: "Capture/settle a pending payment", roles: [Motorist], code: 200, input: [], output: Payment, side_effects: ["Payment PENDING -> SETTLED", "citation.amount_paid_cents += amount_cents", "if amount_due reaches 0 -> Citation -> PAID; cascade recompute vehicle + cancel ORDERED boot + clear hold"] }
  - { method: POST, path: "/payments/{id}/refund", description: "Refund a settled payment (compensation)", roles: [Supervisor], code: 200, input: [], output: Payment, side_effects: ["Payment SETTLED -> REFUNDED", "citation.amount_paid_cents -= amount_cents; PAID citation reverts to ISSUED", "recompute vehicle_balance + scofflaw_status"] }

  # ---- Contest (Motorist) ----
  - { method: POST, path: "/contests", description: "File a contest against a citation", roles: [Motorist], code: 201, input: [citation_id, grounds], output: Contest, side_effects: ["status=SUBMITTED", "Citation ISSUED -> CONTESTED", "recompute vehicle_balance + scofflaw_status"] }
  - { method: GET,  path: "/contests/{id}", description: "Get a contest", roles: [Admin, Supervisor, EnforcementOfficer, HearingOfficer, Motorist], code: 200, input: [], output: Contest, side_effects: [] }
  - { method: GET,  path: "/contests", description: "List contests (reverse lookup for citation_id)", roles: [Admin, Supervisor, EnforcementOfficer, HearingOfficer, Motorist], code: 200, input: ["citation_id?", "status?", "limit?", "offset?"], output: "Contest[]", side_effects: [] }

  # ---- Hearing (HearingOfficer) ----
  - { method: POST, path: "/hearings", description: "Schedule a hearing for a contest in a room", roles: [HearingOfficer], code: 201, input: [contest_id, room_id, scheduled_start, scheduled_end], output: Hearing, side_effects: ["status=SCHEDULED", "Contest SUBMITTED -> HEARING_SCHEDULED", "reject on buffered room overlap (ERR_ROOM_UNAVAILABLE)"] }
  - { method: GET,  path: "/hearings/{id}", description: "Get a hearing", roles: [Admin, Supervisor, EnforcementOfficer, HearingOfficer, Motorist], code: 200, input: [], output: Hearing, side_effects: [] }
  - { method: GET,  path: "/hearings", description: "List hearings (reverse lookup for contest_id / room_id)", roles: [Admin, Supervisor, EnforcementOfficer, HearingOfficer, Motorist], code: 200, input: ["contest_id?", "room_id?", "status?", "limit?", "offset?"], output: "Hearing[]", side_effects: [] }
  - { method: POST, path: "/hearings/{id}/adjourn", description: "Adjourn/reschedule a hearing (self-cycle)", roles: [HearingOfficer], code: 200, input: [scheduled_start, scheduled_end], output: Hearing, side_effects: ["Hearing SCHEDULED -> SCHEDULED", "adjournment_count += 1", "re-run buffered room overlap check excluding self"] }
  - { method: POST, path: "/hearings/{id}/decide", description: "Render the hearing decision", roles: [HearingOfficer], code: 200, input: [decision], output: Hearing, side_effects: ["Hearing SCHEDULED -> HELD", "decision UPHELD -> Citation CONTESTED->UPHELD + Contest CLOSED_UPHELD", "decision DISMISSED -> Citation CONTESTED->DISMISSED + Contest CLOSED_DISMISSED", "recompute vehicle_balance + scofflaw_status"] }

  # ---- Boot/Tow (Supervisor) ----
  - { method: POST, path: "/boot-tow-orders", description: "Manually order a boot/tow on an eligible vehicle", roles: [Supervisor], code: 201, input: [vehicle_id, order_type], output: BootTowOrder, side_effects: ["origin=MANUAL", "status=ORDERED", "reject if vehicle not BOOT_ELIGIBLE/TOW_ELIGIBLE (ERR_VEHICLE_NOT_BOOT_ELIGIBLE)", "reject if an ORDERED/APPLIED order already exists for the vehicle (ERR_BOOT_ALREADY_ACTIVE)", "place a RegistrationHold (PLACED)"] }
  - { method: GET,  path: "/boot-tow-orders/{id}", description: "Get a boot/tow order", roles: [Admin, Supervisor, EnforcementOfficer, HearingOfficer, Motorist], code: 200, input: [], output: BootTowOrder, side_effects: [] }
  - { method: GET,  path: "/boot-tow-orders", description: "List boot/tow orders (reverse lookup for vehicle_id)", roles: [Admin, Supervisor, EnforcementOfficer, HearingOfficer, Motorist], code: 200, input: ["vehicle_id?", "status?", "limit?", "offset?"], output: "BootTowOrder[]", side_effects: [] }
  - { method: POST, path: "/boot-tow-orders/{id}/apply", description: "Apply the boot/tow physically", roles: [Supervisor], code: 200, input: [], output: BootTowOrder, side_effects: ["BootTowOrder ORDERED -> APPLIED"] }
  - { method: POST, path: "/boot-tow-orders/{id}/release", description: "Release the boot/tow; compute release total", roles: [Supervisor], code: 200, input: [], output: BootTowOrder, side_effects: ["BootTowOrder ORDERED/APPLIED -> RELEASED", "run boot_release_total"] }

  # ---- Registration Hold (read-only; placed/cleared via cascade) ----
  - { method: GET,  path: "/registration-holds/{id}", description: "Get a registration hold", roles: [Admin, Supervisor, EnforcementOfficer, HearingOfficer, Motorist], code: 200, input: [], output: RegistrationHold, side_effects: [] }
  - { method: GET,  path: "/registration-holds", description: "List registration holds (reverse lookup for vehicle_id / boot_tow_order_id)", roles: [Admin, Supervisor, EnforcementOfficer, HearingOfficer, Motorist], code: 200, input: ["vehicle_id?", "boot_tow_order_id?", "status?", "limit?", "offset?"], output: "RegistrationHold[]", side_effects: [] }

  # ---- Logical clock (test-driving) ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Server startup default is 2026-03-01T00:00:00Z; the clock never falls back to real wall-clock time.", roles: [Admin], code: 200, input: [to_iso8601], output: "null", side_effects: ["logical clock now = to_iso8601"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "EnforcementOfficer X-User-ID does not match the shift's officer_id" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, invalid enum, scheduled_end <= scheduled_start, pagination out of bounds, or reassessed fine out of [MIN,MAX]" }
  - { id: ERR_OFFICER_NOT_FOUND, http: 404, condition: "Referenced Officer id does not exist" }
  - { id: ERR_BEAT_NOT_FOUND, http: 404, condition: "Referenced Beat id does not exist" }
  - { id: ERR_VIOLATION_CODE_NOT_FOUND, http: 404, condition: "Referenced ViolationCode id does not exist" }
  - { id: ERR_HEARING_ROOM_NOT_FOUND, http: 404, condition: "Referenced HearingRoom id does not exist" }
  - { id: ERR_SHIFT_NOT_FOUND, http: 404, condition: "Referenced Shift id does not exist" }
  - { id: ERR_VEHICLE_NOT_FOUND, http: 404, condition: "Referenced Vehicle id does not exist" }
  - { id: ERR_CITATION_NOT_FOUND, http: 404, condition: "Referenced Citation id does not exist" }
  - { id: ERR_PAYMENT_NOT_FOUND, http: 404, condition: "Referenced Payment id does not exist" }
  - { id: ERR_CONTEST_NOT_FOUND, http: 404, condition: "Referenced Contest id does not exist" }
  - { id: ERR_HEARING_NOT_FOUND, http: 404, condition: "Referenced Hearing id does not exist" }
  - { id: ERR_BOOT_TOW_ORDER_NOT_FOUND, http: 404, condition: "Referenced BootTowOrder id does not exist" }
  - { id: ERR_REGISTRATION_HOLD_NOT_FOUND, http: 404, condition: "Referenced RegistrationHold id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource is not in a state that permits the requested transition" }
  - { id: ERR_SHIFT_NOT_OPEN, http: 409, condition: "Citation issue attempted on a shift that is not OPEN" }
  - { id: ERR_SHIFT_OVERLAP, http: 409, condition: "New shift overlaps another OPEN shift of the same officer" }
  - { id: ERR_ROOM_UNAVAILABLE, http: 409, condition: "Hearing time violates the buffered room-availability window" }
  - { id: ERR_CITATION_NOT_PAYABLE, http: 409, condition: "Payment/settle attempted against a citation not in {ISSUED, UPHELD}" }
  - { id: ERR_CITATION_NOT_CONTESTABLE, http: 409, condition: "Contest filed against a citation not in ISSUED" }
  - { id: ERR_CONTEST_ALREADY_EXISTS, http: 409, condition: "A non-terminal contest already exists for the citation" }
  - { id: ERR_PAYMENT_NOT_REFUNDABLE, http: 409, condition: "Refund attempted on a payment not in SETTLED" }
  - { id: ERR_BOOT_ALREADY_ACTIVE, http: 409, condition: "An ORDERED or APPLIED boot/tow order already exists for the vehicle" }
  - { id: ERR_HEARING_DECISION_INVALID, http: 422, condition: "decision is not one of UPHELD, DISMISSED" }
  - { id: ERR_VIOLATION_CODE_RETIRED, http: 422, condition: "Citation issue references a RETIRED violation code" }
  - { id: ERR_VEHICLE_NOT_BOOT_ELIGIBLE, http: 422, condition: "Manual boot/tow order on a vehicle whose scofflaw_status is NONE or SCOFFLAW" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "Payment amount_cents is not within 1..citation.amount_due_cents at creation" }
  - { id: ERR_ADJUSTMENT_EXCEEDS_BALANCE, http: 422, condition: "Waiver amount exceeds the citation's amount_due_cents" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Admin
    description: "Configures the enforcement system: officers, beats, violation codes / fine schedule, hearing rooms, and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /officers"
      - "POST /beats"
      - "POST /violation-codes"
      - "POST /violation-codes/{id}/retire"
      - "POST /hearing-rooms"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"

  - name: EnforcementOfficer
    description: "Patrol officer who opens/closes their own shifts and issues citations via LPR or handheld."
    identity: "entity_backed:Officer"
    exclusive_operations:
      - "POST /shifts"
      - "POST /shifts/{id}/close"
      - "POST /citations"
    shared_operations:
      - "POST /vehicles"
      - "All GET endpoints"

  - name: Supervisor
    description: "Enforcement supervisor who voids/reassesses citations, applies waivers, orders/applies/releases boots and tows, and refunds payments."
    identity: "opaque"
    exclusive_operations:
      - "POST /citations/{id}/void"
      - "POST /citations/{id}/reassess"
      - "POST /vehicles/{id}/adjustments"
      - "POST /boot-tow-orders"
      - "POST /boot-tow-orders/{id}/apply"
      - "POST /boot-tow-orders/{id}/release"
      - "POST /payments/{id}/refund"
    shared_operations:
      - "POST /vehicles"
      - "All GET endpoints"

  - name: HearingOfficer
    description: "Adjudicator who schedules, adjourns, and decides contest hearings."
    identity: "opaque"
    exclusive_operations:
      - "POST /hearings"
      - "POST /hearings/{id}/adjourn"
      - "POST /hearings/{id}/decide"
    shared_operations:
      - "All GET endpoints"

  - name: Motorist
    description: "Public self-service actor who pays and contests citations online."
    identity: "opaque"
    exclusive_operations:
      - "POST /payments"
      - "POST /payments/{id}/settle"
      - "POST /contests"
    shared_operations:
      - "All GET endpoints"
