              captures: { err: $.data.error_id }
          assert:
            - "AccountValidation.${av}.status reads EXPIRED on 2027-09-02 (one day past validated_until 2027-09-01)"
            - "the WEB entry fails 422 with ERR_ACCOUNT_VALIDATION_REQUIRED"

      - name: return_by_originating_participant_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
        distinguishing_aspect: "Self-return is barred: the entry's own ODFI attempting the return fails 422 ERR_RETURN_PARTICIPANT_CONFLICT even though the participant is ACTIVE and the window is open."
        test_recipe:
          setup: ["P1 ODFI ACTIVE with O1 APPROVED; PPD; W1; entry settled 2026-09-01; clock 2026-09-02."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/participants"
              payload: { legal_name: "Bank One", participant_type: "ODFI", routing_number: "111000025" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /network/participants/${p1}/transition"
              payload: { to_state: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /network/transaction-codes"
