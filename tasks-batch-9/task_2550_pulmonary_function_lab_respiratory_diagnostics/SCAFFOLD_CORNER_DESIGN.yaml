      - name: interpretation_pattern_is_normal_when_ratio_and_fvc_sit_exactly_on_their_boundaries
        claim_type: correct_result
        grounds:
          - calculations.interpretation_pattern_and_severity
          - endpoints[POST /pft-lab/interpretation-reports/{report_id}/sign]
          - entities.InterpretationReport.fields.pattern
          - entities.InterpretationReport.fields.severity
        distinguishing_aspect: |
          Both arms of the pattern decision table use >= on the normal side, so a session whose
          fev1_fvc_ratio is exactly ratio_lln (0.700) and whose fvc_pct_predicted is exactly
          FVC_NORMAL_PCT (80.0) is NORMAL - and because the pattern is NORMAL the severity ladder is
          short-circuited to NONE even though fev1_pct_predicted of 67.2 would otherwise read MODERATE.
