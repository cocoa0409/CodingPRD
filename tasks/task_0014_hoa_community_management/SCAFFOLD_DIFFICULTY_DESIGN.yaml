scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: late_fee_chronological_vs_forward_looking_on_same_assessment
        grounds:
          - calculations.late_fee_accrual
          - calculations.late_fee_accrual.variants.chronological_per_cycle
          - calculations.late_fee_accrual.variants.forward_looking_projection
          - endpoints[POST /hoa/payments]
          - endpoints[GET /hoa/assessments/{id}/projected-balance]
        distinguishing_aspect: |
          Same Assessment, same as-of date 2026-02-01: chronological_per_cycle pins
          Assessment.late_fee_cents == 11000 (cycles=2, per-cycle floor then sum)
          while forward_looking_projection returns projected_late_fee_cents == 16500
          (cycles=3, floor at end). The 5500-cent delta is the variant divergence
          on the SAME entity (Assessment, ledger domain).
        test_recipe:
          setup:
            - "Community exists with default late_fee_grace_days=15, late_fee_flat_cents=2500, late_fee_pct_bps=1000"
            - "Owner + Property exist"
            - "One Assessment exists: principal_cents=30000, due_date=2026-01-01"
            - "Clock advanced to 2026-02-01"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "Pinegrove", fiscal_year_start_month: 1, regular_assessment_cents: 30000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "a@x.com", full_name: "A" }
              as: PlatformAdmin
              captures: { o_id: $.data.id }
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o_id}", unit_label: "U-1" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /hoa/assessments"
              payload: { property_id: "${p_id}", kind: "REGULAR", principal_cents: 30000, due_date: "2026-01-01T00:00:00Z" }
              as: Treasurer
              captures: { a_id: $.data.id }
            - call: "POST /hoa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /hoa/assessments/${a_id}"
              payload: {}
              as: Treasurer
              captures: { actual_late_fee: $.data.late_fee_cents }
            - call: "GET /hoa/assessments/${a_id}/projected-balance"
              payload: { as_of_iso8601: "2026-02-01T00:00:00Z" }
              as: Treasurer
              captures: { projected_late_fee: $.data.projected_late_fee_cents }
          assert:
            - "Assessment.${a_id}.late_fee_cents == 11000"
            - "Assessment.${a_id}.status == OVERDUE"
            - "GET projected-balance returns projected_late_fee_cents == 16500"
            - "11000 != 16500 (variant divergence: 5500-cent delta)"

      - name: reserve_obligation_component_vs_cash_flow_on_same_community
        grounds:
          - calculations.reserve_obligation
          - calculations.reserve_obligation.variants.component_method
          - calculations.reserve_obligation.variants.cash_flow_method
          - calculations.reserve_adequacy_ratio
          - endpoints[POST /hoa/reserve-studies]
        distinguishing_aspect: |
          Same Community + same single ReserveComponent (replacement_cost_cents=1000000,
          remaining_life_years=2, useful_life_years=10) produces COMPONENT method
          projected_obligation_cents == 1060900 (single inflated replacement) vs
          CASH_FLOW method projected_obligation_cents == 4402764 (three replacements
          across 30-year horizon: years 2, 12, 22). Different entity domain than
          Rule-1 instance #1 (ReserveStudy, asset-planning domain — not Assessment
          ledger domain).
        test_recipe:
          setup:
            - "Community exists with reserve_inflation_bps=300"
            - "One ReserveComponent exists: replacement_cost=1000000, remaining=2, useful=10"
            - "Two ReserveStudies created back-to-back: method=COMPONENT then method=CASH_FLOW, each for a different fiscal_year"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "Pinegrove", fiscal_year_start_month: 1, regular_assessment_cents: 30000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hoa/reserve-components"
              payload: { community_id: "${c_id}", label: "Roof", useful_life_years: 10, remaining_life_years: 2, replacement_cost_cents: 1000000 }
              as: PlatformAdmin
              captures: { rc_id: $.data.id }
          trigger:
            - call: "POST /hoa/reserve-studies"
              payload: { community_id: "${c_id}", fiscal_year: 2026, method: "COMPONENT", accumulated_funds_cents: 2000000 }
              as: BoardPresident
              captures: { rs_component_id: $.data.id, obligation_component: $.data.projected_obligation_cents, pct_component: $.data.percent_funded_bps }
            - call: "POST /hoa/reserve-studies"
              payload: { community_id: "${c_id}", fiscal_year: 2027, method: "CASH_FLOW", accumulated_funds_cents: 2000000 }
              as: BoardPresident
              captures: { rs_cash_id: $.data.id, obligation_cash: $.data.projected_obligation_cents, pct_cash: $.data.percent_funded_bps }
          assert:
            - "ReserveStudy.${rs_component_id}.projected_obligation_cents == 1060900"
            - "ReserveStudy.${rs_component_id}.percent_funded_bps == 18852"
            - "ReserveStudy.${rs_cash_id}.projected_obligation_cents == 4402764"
            - "ReserveStudy.${rs_cash_id}.percent_funded_bps == 4542"
            - "1060900 != 4402764 (variant divergence on the same source data)"

  # =====================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: reserve_obligation_three_input_non_linear_component_method
        grounds:
          - calculations.reserve_obligation
          - entities.ReserveComponent.fields.replacement_cost_cents
          - entities.ReserveComponent.fields.remaining_life_years
          - entities.Community.fields.reserve_inflation_bps
        distinguishing_aspect: |
          Mode (a) — formula with 3+ inputs and non-linear interaction:
          projected_obligation_cents under COMPONENT method = sum over components of
          floor(replacement_cost_cents * (1 + reserve_inflation_bps/10000)^remaining_life_years).
          Three independent inputs (cost, life, inflation) interact through a
          compound-interest exponent, plus a floor at each summation step.
        test_recipe:
          setup:
            - "Community with reserve_inflation_bps=300"
            - "Three ReserveComponents: (cost=500000, remaining=3), (cost=200000, remaining=7), (cost=800000, remaining=0); all useful_life=20"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "MultiComp", fiscal_year_start_month: 1, regular_assessment_cents: 30000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hoa/reserve-components"
              payload: { community_id: "${c_id}", label: "C1", useful_life_years: 20, remaining_life_years: 3, replacement_cost_cents: 500000 }
              as: PlatformAdmin
            - call: "POST /hoa/reserve-components"
              payload: { community_id: "${c_id}", label: "C2", useful_life_years: 20, remaining_life_years: 7, replacement_cost_cents: 200000 }
              as: PlatformAdmin
            - call: "POST /hoa/reserve-components"
              payload: { community_id: "${c_id}", label: "C3", useful_life_years: 20, remaining_life_years: 0, replacement_cost_cents: 800000 }
              as: PlatformAdmin
          trigger:
            - call: "POST /hoa/reserve-studies"
              payload: { community_id: "${c_id}", fiscal_year: 2026, method: "COMPONENT", accumulated_funds_cents: 1000000 }
              as: BoardPresident
              captures: { rs_id: $.data.id, obl: $.data.projected_obligation_cents }
          assert:
            # C1: floor(500000 * 1.03^3) = floor(500000*1.092727) = floor(546363.5) = 546363
            # C2: floor(200000 * 1.03^7) = floor(200000*1.229873685...) = floor(245974.737) = 245974
            # C3: floor(800000 * 1.03^0) = floor(800000*1.0) = 800000
            # sum = 546363 + 245974 + 800000 = 1592337
            - "ReserveStudy.${rs_id}.projected_obligation_cents == 1592337"

      - name: late_fee_nested_rounding_per_cycle_floor_then_sum
        grounds:
          - calculations.late_fee_accrual
          - calculations.late_fee_accrual.variants.chronological_per_cycle
          - entities.Community.fields.late_fee_pct_bps
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: chronological_per_cycle
          floors per_cycle_pct = floor(principal*pct_bps/10000) BEFORE summing
          across cycles. With principal_cents=33333, pct_bps=1000, two cycles:
          per-cycle floor(33333*1000/10000) = floor(3333.3) = 3333 per cycle,
          then sum: 2*3333 + 2*2500 = 11666. The "sum-then-floor" alternative
          would compute exact 2*3333.3 + 2*2500 = 11666.6, floor=11666. Same
          here numerically because the fraction is small, but the AUTHORITATIVE
          order is per-cycle floor. Pinning makes intent explicit. Different
          MODE than instance #1 (rounding order vs 3-input non-linear formula).
        test_recipe:
          setup:
            - "Community defaults: late_fee_grace_days=15, late_fee_flat_cents=2500, late_fee_pct_bps=1000"
            - "Assessment principal_cents=33333, due_date=2026-01-01"
            - "Clock advanced to 2026-02-01 (cycles=2)"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "RoundTown", fiscal_year_start_month: 1, regular_assessment_cents: 33333 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "b@x.com", full_name: "B" }
              as: PlatformAdmin
              captures: { o_id: $.data.id }
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o_id}", unit_label: "U-2" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /hoa/assessments"
              payload: { property_id: "${p_id}", kind: "REGULAR", principal_cents: 33333, due_date: "2026-01-01T00:00:00Z" }
              as: Treasurer
              captures: { a_id: $.data.id }
            - call: "POST /hoa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /hoa/assessments/${a_id}"
              payload: {}
              as: Treasurer
              captures: { late_fee: $.data.late_fee_cents }
          assert:
            # per cycle: flat=2500, pct_floor = floor(33333*1000/10000) = floor(3333.3) = 3333
            # cycles=2: 2 * (2500 + 3333) = 2 * 5833 = 11666
            - "Assessment.${a_id}.late_fee_cents == 11666"
            - "Assessment.${a_id}.status == OVERDUE"

  # =====================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: acc_request_cyclic_revision_loop
        grounds:
          - state_machines.ACCRequest
          - state_machines.ACCRequest.transitions.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.ACCRequest.transitions.REVISION_REQUESTED_to_SUBMITTED
          - entities.ACCRequest.fields.revision_count
        distinguishing_aspect: |
          ACCRequest is CYCLIC: SUBMITTED → REVISION_REQUESTED → SUBMITTED.
          revision_count survives the cycle, capping at 3 (so the loop is
          bounded but explicitly non-linear). Entity domain = ACCRequest.
        test_recipe:
          setup:
            - "Community + Owner + Property exist"
            - "ACCRequest created in SUBMITTED"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "Cyclic HOA", fiscal_year_start_month: 1, regular_assessment_cents: 30000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "c@x.com", full_name: "C" }
              as: PlatformAdmin
              captures: { o_id: $.data.id }
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o_id}", unit_label: "U-3" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /hoa/acc-requests"
              payload: { property_id: "${p_id}", scope: "APPEARANCE", description: "Paint fence beige" }
              as: HomeOwner
              as_user_id: "${o_id}"
              captures: { acc_id: $.data.id }
          trigger:
            - call: "POST /hoa/acc-requests/${acc_id}/request-revision"
              payload: {}
              as: ACCMember
            - call: "POST /hoa/acc-requests/${acc_id}/resubmit"
              payload: {}
              as: HomeOwner
              as_user_id: "${o_id}"
              captures: { status_after_resub: $.data.status, rev_after_resub: $.data.revision_count }
          assert:
            - "ACCRequest.${acc_id}.status == SUBMITTED (after cycle back from REVISION_REQUESTED)"
            - "ACCRequest.${acc_id}.revision_count == 1 (incremented exactly once during request-revision; resubmit does not re-increment)"

      - name: board_election_branching_at_close
        grounds:
          - state_machines.BoardElection
          - state_machines.BoardElection.transitions.OPEN_to_CLOSED_QUORUM_MET
          - state_machines.BoardElection.transitions.OPEN_to_CLOSED_NO_QUORUM
          - state_machines.BoardElection.transitions.CLOSED_QUORUM_MET_to_CERTIFIED
          - state_machines.BoardElection.transitions.CLOSED_QUORUM_MET_to_INVALIDATED
          - state_machines.BoardElection.transitions.CLOSED_NO_QUORUM_to_INVALIDATED
        distinguishing_aspect: |
          BoardElection is BRANCHING fork-join: OPEN → {CLOSED_QUORUM_MET,
          CLOSED_NO_QUORUM} → {CERTIFIED, INVALIDATED}. Branch is selected
          by the votes_cast vs election_quorum_pct comparison at close time;
          divergent side-effect sets (CERTIFIED leaves results binding;
          INVALIDATED discards them). Different entity than ACCRequest.
        test_recipe:
          setup:
            - "Community with election_quorum_pct=33"
            - "Three Owners + Properties so eligible_voter_count snapshot = 3"
            - "Election DRAFT created with opens_at=2026-02-01 and closes_at=2026-02-16 (15 days, >= 14)"
            - "Clock set to 2026-01-15 (before opens_at)"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "VoteVille", fiscal_year_start_month: 1, regular_assessment_cents: 30000, election_quorum_pct: 33 }
              as: PlatformAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "v1@x.com", full_name: "V1" }
              as: PlatformAdmin
              captures: { o1_id: $.data.id }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "v2@x.com", full_name: "V2" }
              as: PlatformAdmin
              captures: { o2_id: $.data.id }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "v3@x.com", full_name: "V3" }
              as: PlatformAdmin
              captures: { o3_id: $.data.id }
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o1_id}", unit_label: "V-1" }
              as: PlatformAdmin
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o2_id}", unit_label: "V-2" }
              as: PlatformAdmin
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o3_id}", unit_label: "V-3" }
              as: PlatformAdmin
            - call: "POST /hoa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hoa/elections"
              payload: { community_id: "${c_id}", cycle_label: "FY2026", opens_at: "2026-02-01T00:00:00Z", closes_at: "2026-02-16T00:00:00Z" }
              as: BoardSecretary
              captures: { e_id: $.data.id }
            - call: "POST /hoa/elections/${e_id}/open"
              payload: { expected_community_version: "${c_v}" }
              as: BoardSecretary
            - call: "POST /hoa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hoa/votes"
              payload: { election_id: "${e_id}", owner_id: "${o1_id}", candidate_name: "Alice" }
              as: HomeOwner
              as_user_id: "${o1_id}"
            - call: "POST /hoa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-17T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /hoa/elections/${e_id}/close"
              payload: {}
              as: BoardSecretary
              captures: { close_status: $.data.status, votes: $.data.votes_cast, eligible: $.data.eligible_voter_count }
          assert:
            - "BoardElection.${e_id}.eligible_voter_count == 3"
            - "BoardElection.${e_id}.votes_cast == 1"
            # 1*100 = 100; 3*33 = 99 → 100 >= 99 → CLOSED_QUORUM_MET branch
            - "BoardElection.${e_id}.status == CLOSED_QUORUM_MET (branch selected because 1*100 >= 3*33)"

  # =====================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: clock_advance_to_lien_to_property_suspension_depth_3
        grounds:
          - state_machines.Assessment.transitions.DUE_to_OVERDUE
          - entities.Property.fields.account_balance_cents
          - entities.Property.fields.compliance_posture
          - entities.Lien
          - endpoints[POST /hoa/_clock/set_current_utc]
        distinguishing_aspect: |
          DEPTH=3 chain triggered by /_clock/set_current_utc:
          (hop 1) Assessment.DUE→OVERDUE accrues late_fee_cents (mutation on Assessment);
          (hop 2) that Assessment mutation pushes Property.account_balance_cents
          past lien_threshold_cents and the system auto-creates Lien.status=FILED
          (mutation on Lien, CAUSED BY hop-1 not by the clock call directly);
          (hop 3) the new FILED Lien causes Property.compliance_posture to flip
          to SUSPENDED (mutation on Property, CAUSED BY hop-2).
        test_recipe:
          setup:
            - "Community with lien_threshold_cents=250000"
            - "Owner + Property exist"
            - "One large SPECIAL Assessment principal_cents=250000, due_date=2026-01-01"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "LienVille", fiscal_year_start_month: 1, regular_assessment_cents: 30000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "d@x.com", full_name: "D" }
              as: PlatformAdmin
              captures: { o_id: $.data.id }
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o_id}", unit_label: "U-4" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /hoa/assessments"
              payload: { property_id: "${p_id}", kind: "SPECIAL", principal_cents: 250000, due_date: "2026-01-01T00:00:00Z" }
              as: Treasurer
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /hoa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
          assert:
            # cycles=2, per cycle: 2500 + floor(250000*1000/10000) = 2500 + 25000 = 27500
            # late_fee = 55000; outstanding = 250000+55000 = 305000 ; balance = 305000 >= 250000
            - "Assessment.${a_id}.status == OVERDUE"
            - "Assessment.${a_id}.late_fee_cents == 55000"
            - "Property.${p_id}.account_balance_cents == 305000"
            - "Property.${p_id}.compliance_posture == SUSPENDED"
            - "Exactly one Lien exists for Property.${p_id} with status == FILED"

      - name: violation_uphold_to_active_to_property_under_review_depth_2
        grounds:
          - state_machines.Violation.transitions.CONTESTED_to_UPHELD
          - entities.Violation.fields.status
          - entities.Property.fields.compliance_posture
        distinguishing_aspect: |
          DEPTH=2 chain triggered by /violations/{id}/uphold (DIFFERENT trigger
          than instance #1's clock-advance):
          (hop 1) Violation.CONTESTED→UPHELD mutation sets status to a sub-state
          considered ACTIVE for posture rollup;
          (hop 2) that Violation status change CAUSES Property.compliance_posture
          to be recomputed from COMPLIANT to UNDER_REVIEW. Two distinct entity
          mutations chained.
        test_recipe:
          setup:
            - "Community + Owner + Property exist (no Liens; posture == COMPLIANT initially)"
            - "Violation in CONTESTED state"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "Posture Ville", fiscal_year_start_month: 1, regular_assessment_cents: 30000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "e@x.com", full_name: "E" }
              as: PlatformAdmin
              captures: { o_id: $.data.id }
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o_id}", unit_label: "U-5" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /hoa/violations"
              payload: { property_id: "${p_id}", category: "NOISE" }
              as: BoardSecretary
              captures: { v_id: $.data.id }
            - call: "POST /hoa/violations/${v_id}/contest"
              payload: {}
              as: HomeOwner
              as_user_id: "${o_id}"
          trigger:
            - call: "POST /hoa/violations/${v_id}/uphold"
              payload: {}
              as: BoardSecretary
          assert:
            - "Violation.${v_id}.status == ACTIVE (UPHELD sub-state)"
            - "Property.${p_id}.compliance_posture == UNDER_REVIEW (cascaded from UPHELD)"

  # =====================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_overpay_on_already_paid_returns_invalid_state
        grounds:
          - validations[priority=5]
          - validations[priority=13]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_OVERPAYMENT]
        distinguishing_aspect: |
          Pair = (state, business_fiscal). A payment with amount_cents far above
          remaining outstanding AGAINST an Assessment already in PAID state
          would simultaneously satisfy both rules' violation conditions. The
          state-precondition (priority 5) MUST fire first, returning
          ERR_INVALID_STATE — not the priority-13 ERR_OVERPAYMENT — even though
          the payload also violates the fiscal cap.
        test_recipe:
          setup:
            - "Assessment fully paid (status == PAID)"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "Prio1", fiscal_year_start_month: 1, regular_assessment_cents: 10000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "p1@x.com", full_name: "P1" }
              as: PlatformAdmin
              captures: { o_id: $.data.id }
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o_id}", unit_label: "P-1" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /hoa/assessments"
              payload: { property_id: "${p_id}", kind: "REGULAR", principal_cents: 10000, due_date: "2026-06-01T00:00:00Z" }
              as: Treasurer
              captures: { a_id: $.data.id, a_v: $.data.version }
            - call: "POST /hoa/payments"
              payload: { assessment_id: "${a_id}", amount_cents: 10000, expected_assessment_version: "${a_v}" }
              as: Treasurer
            - call: "GET /hoa/assessments/${a_id}"
              payload: {}
              as: Treasurer
              captures: { a_v_post: $.data.version }
          trigger:
            - call: "POST /hoa/payments"
              payload: { assessment_id: "${a_id}", amount_cents: 999999, expected_assessment_version: "${a_v_post}" }
              as: Treasurer
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "Response error_id == ERR_INVALID_STATE (priority-5 fires before priority-13 ERR_OVERPAYMENT)"

      - name: business_safety_vs_business_temporal_acc_approve_on_suspended_property_in_window_returns_property_suspended
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_PROPERTY_SUSPENDED]
          - errors[ERR_ACC_REVISION_LIMIT]
        distinguishing_aspect: |
          Pair = (business_safety, business_temporal) — DIFFERENT pair than
          instance #1. A SUBMITTED ACCRequest on a SUSPENDED Property is
          subjected to /approve: priority-6 business_safety (ERR_PROPERTY_SUSPENDED)
          fires. (Priority-8 ERR_ACC_REVISION_LIMIT does not apply to /approve,
          but is the next-category temporal rule on the same entity, exercised
          in instance #2 of Rule 8 below.)
        test_recipe:
          setup:
            - "Property exists with compliance_posture == SUSPENDED (via FILED Lien from balance overrun)"
            - "ACCRequest in SUBMITTED state on that Property"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "Susp", fiscal_year_start_month: 1, regular_assessment_cents: 30000, lien_threshold_cents: 250000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "s@x.com", full_name: "S" }
              as: PlatformAdmin
              captures: { o_id: $.data.id }
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o_id}", unit_label: "S-1" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /hoa/assessments"
              payload: { property_id: "${p_id}", kind: "SPECIAL", principal_cents: 250000, due_date: "2026-01-01T00:00:00Z" }
              as: Treasurer
              captures: { a_id: $.data.id }
            - call: "POST /hoa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hoa/acc-requests"
              payload: { property_id: "${p_id}", scope: "LANDSCAPING", description: "Plant olive tree" }
              as: HomeOwner
              as_user_id: "${o_id}"
              captures: { acc_id: $.data.id }
          trigger:
            - call: "POST /hoa/acc-requests/${acc_id}/approve"
              payload: {}
              as: ACCMember
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 422"
            - "Response error_id == ERR_PROPERTY_SUSPENDED (priority-6 business_safety)"
            - "ACCRequest.${acc_id}.status == SUBMITTED (unchanged)"

  # =====================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: lien_threshold_exact_equality_triggers_filed
        grounds:
          - entities.Community.fields.lien_threshold_cents
          - state_machines.Assessment.transitions.DUE_to_OVERDUE.side_effects
          - errors[ERR_BALANCE_BELOW_THRESHOLD]
        distinguishing_aspect: |
          Metric = Property.account_balance_cents vs Community.lien_threshold_cents.
          Boundary: lien auto-creation uses `>=` (NOT `>`). With
          lien_threshold_cents=300000 and a SPECIAL principal=300000 paid down
          to exactly 300000 outstanding (no late fee yet, clock still within
          grace), the OVERDUE transition with late_fee makes balance > threshold.
          We construct the exact-equality case: principal=300000, due_date in
          past but clock still within grace_days → outstanding == 300000 == threshold.
          No lien fires because no OVERDUE transition yet (within grace). Then
          advance clock by 1 day past grace; first OVERDUE adds late fee, pushing
          balance to 327500 (> threshold) → lien fires.
        test_recipe:
          setup:
            - "Community with lien_threshold_cents=300000"
            - "Owner + Property exist"
            - "Assessment principal=300000, due_date=2026-01-01"
            - "Clock at 2026-01-15 (exactly grace_days=15, so NOT yet OVERDUE because elapsed_days==15==grace and per formula elapsed_days<grace fails only when strictly less, but condition is current_utc > due_date + grace, i.e. > 2026-01-16. At 2026-01-15 → still DUE.)"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "Bound1", fiscal_year_start_month: 1, regular_assessment_cents: 30000, lien_threshold_cents: 300000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "b1@x.com", full_name: "B1" }
              as: PlatformAdmin
              captures: { o_id: $.data.id }
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o_id}", unit_label: "B-1" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /hoa/assessments"
              payload: { property_id: "${p_id}", kind: "SPECIAL", principal_cents: 300000, due_date: "2026-01-01T00:00:00Z" }
              as: Treasurer
              captures: { a_id: $.data.id }
            - call: "POST /hoa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /hoa/properties/${p_id}"
              payload: {}
              as: Treasurer
              captures: { bal_before: $.data.account_balance_cents, posture_before: $.data.compliance_posture }
            - call: "POST /hoa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-17T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /hoa/properties/${p_id}"
              payload: {}
              as: Treasurer
              captures: { bal_after: $.data.account_balance_cents, posture_after: $.data.compliance_posture }
          assert:
            - "Property.${p_id}.account_balance_cents at 2026-01-15 == 300000 (exact threshold; balance == threshold, but no OVERDUE yet → no late fee, no lien)"
            - "Property.${p_id}.compliance_posture at 2026-01-15 == COMPLIANT"
            # at 2026-01-17 (> due_date+grace 2026-01-16), OVERDUE fires
            # cycles=1 (elapsed_days=16, (16-15)/15=0 cycles, +1 = 1)
            # late_fee = 2500 + floor(300000*0.1) = 2500 + 30000 = 32500
            # balance = 300000 + 32500 = 332500 >= 300000 → lien fires
            - "Property.${p_id}.account_balance_cents at 2026-01-17 == 332500"
            - "Property.${p_id}.compliance_posture at 2026-01-17 == SUSPENDED"

      - name: vote_uniqueness_at_zero_eligible_voter_count_returns_voter_ineligible
        grounds:
          - validations[priority=11]
          - errors[ERR_VOTER_INELIGIBLE]
          - endpoints[POST /hoa/votes]
          - entities.Owner.fields.is_eligible_voter
        distinguishing_aspect: |
          DIFFERENT metric (empty-set / zero-count, not a numeric threshold)
          on a DIFFERENT endpoint (POST /hoa/votes, not POST /assessments).
          Owner WITH zero Properties → is_eligible_voter == false →
          ERR_VOTER_INELIGIBLE. Tests the empty-collection edge.
        test_recipe:
          setup:
            - "Community + Election OPEN"
            - "An Owner exists but owns ZERO Properties (empty collection)"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "Bound2", fiscal_year_start_month: 1, regular_assessment_cents: 30000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "voter@x.com", full_name: "Voter1" }
              as: PlatformAdmin
              captures: { o_property_id: $.data.id }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "noprop@x.com", full_name: "NoProp" }
              as: PlatformAdmin
              captures: { o_empty_id: $.data.id }
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o_property_id}", unit_label: "B2-1" }
              as: PlatformAdmin
            - call: "POST /hoa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hoa/elections"
              payload: { community_id: "${c_id}", cycle_label: "FY-bound2", opens_at: "2026-02-01T00:00:00Z", closes_at: "2026-02-16T00:00:00Z" }
              as: BoardSecretary
              captures: { e_id: $.data.id }
            - call: "POST /hoa/elections/${e_id}/open"
              payload: { expected_community_version: "${c_v}" }
              as: BoardSecretary
            - call: "POST /hoa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /hoa/votes"
              payload: { election_id: "${e_id}", owner_id: "${o_empty_id}", candidate_name: "Alice" }
              as: HomeOwner
              as_user_id: "${o_empty_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 422"
            - "Response error_id == ERR_VOTER_INELIGIBLE (owner has empty property collection → ineligible)"

  # =====================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: acc_approve_requires_property_compliance_posture_not_suspended
        grounds:
          - state_machines.ACCRequest.transitions.SUBMITTED_to_APPROVED.preconditions
          - entities.Property.fields.compliance_posture
          - errors[ERR_PROPERTY_SUSPENDED]
        distinguishing_aspect: |
          Entity pair: ACCRequest ← Property. ACCRequest.SUBMITTED→APPROVED is
          gated on Property.compliance_posture != SUSPENDED — a state on a
          DIFFERENT entity than the one transitioning.
        test_recipe:
          setup:
            - "Property compliance_posture == COMPLIANT (control case)"
            - "ACCRequest SUBMITTED"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "X-pair-1", fiscal_year_start_month: 1, regular_assessment_cents: 30000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "x1@x.com", full_name: "X1" }
              as: PlatformAdmin
              captures: { o_id: $.data.id }
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o_id}", unit_label: "X1-1" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /hoa/acc-requests"
              payload: { property_id: "${p_id}", scope: "APPEARANCE", description: "Paint trim" }
              as: HomeOwner
              as_user_id: "${o_id}"
              captures: { acc_id: $.data.id }
          trigger:
            - call: "POST /hoa/acc-requests/${acc_id}/approve"
              payload: {}
              as: ACCMember
              captures: { final_status: $.data.status }
          assert:
            - "ACCRequest.${acc_id}.status == APPROVED (cross-entity precondition satisfied because Property.compliance_posture == COMPLIANT)"

      - name: lien_satisfy_requires_property_account_balance_zero
        grounds:
          - state_machines.Lien.transitions.FILED_to_SATISFIED.preconditions
          - entities.Property.fields.account_balance_cents
          - errors[ERR_BALANCE_NONZERO]
        distinguishing_aspect: |
          Entity pair: Lien ← Property — DIFFERENT pair than instance #1.
          Lien.FILED→SATISFIED requires Property.account_balance_cents == 0 on
          a different entity. The Lien itself has no balance field; the gate
          lives on the Property.
        test_recipe:
          setup:
            - "Lien.status == FILED on a Property"
            - "Property.account_balance_cents > 0"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "X-pair-2", fiscal_year_start_month: 1, regular_assessment_cents: 30000, lien_threshold_cents: 250000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "x2@x.com", full_name: "X2" }
              as: PlatformAdmin
              captures: { o_id: $.data.id }
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o_id}", unit_label: "X2-1" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /hoa/assessments"
              payload: { property_id: "${p_id}", kind: "SPECIAL", principal_cents: 250000, due_date: "2026-01-01T00:00:00Z" }
              as: Treasurer
              captures: { a_id: $.data.id }
            - call: "POST /hoa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /hoa/liens"
              payload: { property_id: "${p_id}" }
              as: BoardSecretary
              captures: { lien_id: "$.data[0].id" }
          trigger:
            - call: "POST /hoa/liens/${lien_id}/satisfy"
              payload: {}
              as: BoardSecretary
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 422"
            - "Response error_id == ERR_BALANCE_NONZERO (cross-entity precondition: Property.account_balance_cents > 0)"

  # =====================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: reserve_study_uniqueness_per_community_year_unique_collision
        grounds:
          - validations[priority=15]
          - errors[ERR_DUPLICATE_RESERVE_STUDY]
          - entities.ReserveStudy.fields.fiscal_year
        distinguishing_aspect: |
          Interval semantics #1: integer-fiscal-year cells (closed, point-equality
          collision). Two ReserveStudies for the same (community_id, fiscal_year)
          conflict because the fiscal-year axis is discrete and each year cell is
          owned by at most one study. Resource entity: ReserveStudy.
        test_recipe:
          setup:
            - "ReserveStudy for (community, fiscal_year=2026) already exists"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "Overlap1", fiscal_year_start_month: 1, regular_assessment_cents: 30000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hoa/reserve-components"
              payload: { community_id: "${c_id}", label: "RoofA", useful_life_years: 20, remaining_life_years: 5, replacement_cost_cents: 500000 }
              as: PlatformAdmin
            - call: "POST /hoa/reserve-studies"
              payload: { community_id: "${c_id}", fiscal_year: 2026, method: "COMPONENT", accumulated_funds_cents: 100000 }
              as: BoardPresident
              captures: { first_id: $.data.id }
          trigger:
            - call: "POST /hoa/reserve-studies"
              payload: { community_id: "${c_id}", fiscal_year: 2026, method: "CASH_FLOW", accumulated_funds_cents: 200000 }
              as: BoardPresident
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "Response error_id == ERR_DUPLICATE_RESERVE_STUDY (point-equality collision on integer year axis)"

      - name: election_window_must_be_at_least_14_days_aggregate_capacity_check
        grounds:
          - validations[priority=9]
          - errors[ERR_INVALID_ELECTION_WINDOW]
          - entities.BoardElection.fields.opens_at
          - entities.BoardElection.fields.closes_at
        distinguishing_aspect: |
          Interval semantics #2 — DIFFERENT from instance #1's point-equality cells:
          minimum DURATION (aggregate capacity) on a continuous time interval.
          The (opens_at, closes_at) interval is rejected if (closes_at - opens_at)
          < 14 days regardless of whether it overlaps another election. Resource
          entity: BoardElection (different from ReserveStudy).
        test_recipe:
          setup:
            - "Community + Owner exist"
            - "Election DRAFT with opens_at=2026-02-01, closes_at=2026-02-10 (9 days)"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "Overlap2", fiscal_year_start_month: 1, regular_assessment_cents: 30000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "ov2@x.com", full_name: "OV2" }
              as: PlatformAdmin
              captures: { o_id: $.data.id }
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o_id}", unit_label: "OV2-1" }
              as: PlatformAdmin
            - call: "POST /hoa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hoa/elections"
              payload: { community_id: "${c_id}", cycle_label: "FY-short", opens_at: "2026-02-01T00:00:00Z", closes_at: "2026-02-10T00:00:00Z" }
              as: BoardSecretary
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /hoa/elections/${e_id}/open"
              payload: { expected_community_version: "${c_v}" }
              as: BoardSecretary
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 422"
            - "Response error_id == ERR_INVALID_ELECTION_WINDOW (duration 9 < 14 days)"

  # =====================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: payment_reverse_preserves_property_account_balance
        grounds:
          - endpoints[POST /hoa/payments/{id}/reverse]
          - entities.Property.fields.account_balance_cents
          - entities.PaymentApplication.fields.state
        distinguishing_aspect: |
          Conserved quantity: Property.account_balance_cents (a CENTS-VALUED
          MONETARY ledger). Forward action POST /payments reduces the balance;
          compensating action POST /payments/{id}/reverse MUST restore the
          balance to its pre-payment value EXACTLY (no drift). Formula pin:
          balance_after_reverse == balance_before_payment.
        test_recipe:
          setup:
            - "Assessment with principal=10000, no fees"
            - "Property.account_balance_cents == 10000 initially"
            - "Payment of 4000 applied; balance now 6000"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "Inv1", fiscal_year_start_month: 1, regular_assessment_cents: 10000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "inv1@x.com", full_name: "INV1" }
              as: PlatformAdmin
              captures: { o_id: $.data.id }
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o_id}", unit_label: "INV1-1" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /hoa/assessments"
              payload: { property_id: "${p_id}", kind: "REGULAR", principal_cents: 10000, due_date: "2026-06-01T00:00:00Z" }
              as: Treasurer
              captures: { a_id: $.data.id, a_v: $.data.version }
            - call: "GET /hoa/properties/${p_id}"
              payload: {}
              as: Treasurer
              captures: { bal_before: $.data.account_balance_cents }
            - call: "POST /hoa/payments"
              payload: { assessment_id: "${a_id}", amount_cents: 4000, expected_assessment_version: "${a_v}" }
              as: Treasurer
              captures: { pa_id: $.data.id }
            - call: "GET /hoa/properties/${p_id}"
              payload: {}
              as: Treasurer
              captures: { bal_mid: $.data.account_balance_cents }
          trigger:
            - call: "POST /hoa/payments/${pa_id}/reverse"
              payload: {}
              as: Treasurer
              captures: { final_state: $.data.state }
            - call: "GET /hoa/properties/${p_id}"
              payload: {}
              as: Treasurer
              captures: { bal_after: $.data.account_balance_cents }
          assert:
            - "Property.${p_id}.account_balance_cents before payment == 10000"
            - "Property.${p_id}.account_balance_cents mid (after pay 4000) == 6000"
            - "Property.${p_id}.account_balance_cents after reverse == 10000 (compensating invariant: balance_after_reverse == balance_before_payment)"
            - "PaymentApplication state == REVERSED"

      - name: vote_retract_preserves_votes_cast_invariant
        grounds:
          - endpoints[POST /hoa/votes/{id}/retract]
          - entities.BoardElection.fields.votes_cast
        distinguishing_aspect: |
          Conserved quantity #2 — DIFFERENT type than instance #1 (a COUNT of
          ballots, not a cents-valued ledger). Forward action POST /votes
          increments votes_cast; compensating POST /votes/{id}/retract MUST
          restore votes_cast to its pre-cast value. Formula pin:
          votes_cast_after_retract == votes_cast_before_cast.
        test_recipe:
          setup:
            - "Election OPEN with eligible_voter_count==1"
            - "votes_cast == 0 initially"
            - "Owner casts vote; votes_cast == 1"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "Inv2", fiscal_year_start_month: 1, regular_assessment_cents: 30000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "inv2@x.com", full_name: "INV2" }
              as: PlatformAdmin
              captures: { o_id: $.data.id }
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o_id}", unit_label: "INV2-1" }
              as: PlatformAdmin
            - call: "POST /hoa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hoa/elections"
              payload: { community_id: "${c_id}", cycle_label: "INV2-FY", opens_at: "2026-02-01T00:00:00Z", closes_at: "2026-02-16T00:00:00Z" }
              as: BoardSecretary
              captures: { e_id: $.data.id }
            - call: "POST /hoa/elections/${e_id}/open"
              payload: { expected_community_version: "${c_v}" }
              as: BoardSecretary
              captures: { e_open_status: $.data.status, votes_pre: $.data.votes_cast }
            - call: "POST /hoa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hoa/votes"
              payload: { election_id: "${e_id}", owner_id: "${o_id}", candidate_name: "Alice" }
              as: HomeOwner
              as_user_id: "${o_id}"
              captures: { v_id: $.data.id }
            - call: "GET /hoa/elections/${e_id}"
              payload: {}
              as: HomeOwner
              as_user_id: "${o_id}"
              captures: { votes_mid: $.data.votes_cast }
          trigger:
            # Vote.common_fields=false but still has id. We need Vote.id from create
            # response — captured below via the list endpoint
            - call: "POST /hoa/votes/${v_id}/retract"
              payload: {}
              as: HomeOwner
              as_user_id: "${o_id}"
              captures: { v_state: $.data.state }
            - call: "GET /hoa/elections/${e_id}"
              payload: {}
              as: HomeOwner
              as_user_id: "${o_id}"
              captures: { votes_post: $.data.votes_cast }
          assert:
            - "BoardElection.${e_id}.votes_cast before cast == 0"
            - "BoardElection.${e_id}.votes_cast after cast == 1"
            - "BoardElection.${e_id}.votes_cast after retract == 0 (compensating invariant: votes_cast_after_retract == votes_cast_before_cast)"
            - "Vote.${v_id} state == RETRACTED"
