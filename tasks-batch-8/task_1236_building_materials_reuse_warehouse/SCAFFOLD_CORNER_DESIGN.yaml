            - call: "POST /reuse/items"
              payload: { category_id: "${cat_id}", description_text: "splittable", condition_grade: "A", measure_qty: 12, measure_unit: "SQFT", pre_1978_flag: false, estimated_weight_lbs: 50 }
              as: IntakeStaff
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /reuse/items/${item_id}/split"
              payload: { split_qty: 12 }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "422 ERR_SPLIT_INVALID_QUANTITY (split_qty must be strictly between 0 and measure_qty)"

      - name: split_creates_remainder_lineage
        claim_type: cross_aggregate_integrity
        grounds: ["entities.Item.fields.parent_item_id", "state_machines.Item"]
        distinguishing_aspect: "Valid split of 12 SQFT by 5 creates a remainder item (parent_item_id set, 5 SQFT, UNPRICED, BACKROOM) and reduces the parent to 7 SQFT, parent reverting to UNPRICED."
        test_recipe:
          setup: ["item 12 SQFT PRICED (override 2400) in BACKROOM"]
          setup_api_calls:
            - call: "POST /reuse/categories"
              payload: { code: "SPLC2", display_name: "Split Cat 2", pricing_model: "PER_SQFT", base_rate_cents: 200, hazmat_risk_flag: false, markdown_after_days: 30, markdown_step_pct: 0.20, markdown_interval_days: 15, max_markdown_steps: 2, floor_price_pct: 0.40, target_turn_days: 45 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /reuse/items"
              payload: { category_id: "${cat_id}", description_text: "split parent", condition_grade: "A", measure_qty: 12, measure_unit: "SQFT", pre_1978_flag: false, estimated_weight_lbs: 50 }
              as: IntakeStaff
              captures: { item_id: $.data.id }
            - call: "POST /reuse/items/${item_id}/price"
              payload: { price_override_cents: 2400 }
              as: StoreManager
          trigger:
            - call: "POST /reuse/items/${item_id}/split"
              payload: { split_qty: 5 }
              as: StoreManager
              captures: { rem_id: $.data.id, rem_qty: $.data.measure_qty, rem_parent: $.data.parent_item_id, rem_ps: $.data.pricing_status }
            - call: "GET /reuse/items/${item_id}"
              as: StoreManager
              captures: { p_qty: $.data.measure_qty, p_ps: $.data.pricing_status }
          assert:
            - "remainder: measure_qty == 5, parent_item_id == parent id, pricing_status == UNPRICED, sales_status == BACKROOM"
            - "parent: measure_qty == 7 and pricing_status reverted to UNPRICED (price no longer matches quantity)"

