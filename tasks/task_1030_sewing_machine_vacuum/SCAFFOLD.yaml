# =============================================================================
# SCAFFOLD.yaml — Sewing-Machine & Vacuum Sales/Service (task_1030)
# Difficulty tier: Expert
# =============================================================================

scenario: |
  1030. Sewing-Machine & Vacuum Sales/Service: sales & trade-in, repair ticket &
  parts, class/lesson, warranty & recall, rental/loaner, subscription (tune-up),
  inventory, special order

domain_name: sewing-machine-vacuum
api_prefix: "/"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat            # peer entities linked by foreign keys, no URL nesting for parents
  state_machine_shape: cyclic      # RepairTicket revision loop + InventoryItem loan round-trip
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate
  # Honest structural dimensions (this domain spans 8 mandated workflows, so it
  # sits at the top of the Expert band):
  entity_count: 10
  state_machine_count: 9
  calculation_count: 10
  endpoint_count: 55   # includes one /_clock test-driving endpoint
  error_code_count: 27
  role_count: 4

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Product
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: model_name, type: string, source: input, description: "Catalog model name" }
      - { name: category, type: enum, source: input, description: "One of SEWING_MACHINE | VACUUM | PART | ACCESSORY", constraints: "enum: SEWING_MACHINE|VACUUM|PART|ACCESSORY" }
      - { name: brand, type: string, source: input, description: "Manufacturer brand" }
      - { name: msrp_cents, type: integer, source: input, description: "Manufacturer suggested retail price in cents", constraints: ">= 0" }
      - { name: warranty_months, type: integer, source: input, default: 12, description: "Length of factory warranty in whole months", constraints: ">= 0" }
      - { name: recall_status, type: enum, source: system, default: "NONE", description: "Recall lifecycle state; NONE at creation, RECALLED after a recall is issued", constraints: "enum: NONE|RECALLED" }
      - { name: recall_reason, type: string, source: system, default: null, description: "Reason text captured when recall_status becomes RECALLED; null while NONE" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Customer full name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: store_credit_cents, type: integer, source: computed, default: 0, description: "Ledger balance of store credit in cents; mutated by trade-in grants, sale credit application, and refund cascades" }
      - { name: lifetime_spend_cents, type: integer, source: computed, default: 0, description: "Cumulative total_due_cents of the customer's COMPLETED sales; drives loyalty_tier" }
      - { name: loyalty_tier, type: enum, source: computed, default: "STANDARD", description: "Derived from lifetime_spend_cents thresholds; recomputed whenever lifetime_spend_cents changes", constraints: "enum: STANDARD|GOLD|PLATINUM" }

  - name: InventoryItem
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the catalog model this physical unit is an instance of" }
      - { name: serial_number, type: string, source: input, default: null, description: "Serial number for serialized units; null for bulk parts/accessories" }
      - { name: condition, type: enum, source: input, default: "NEW", description: "Physical condition grade", constraints: "enum: NEW|REFURBISHED|USED_TRADE_IN" }
      - { name: acquisition_cost_cents, type: integer, source: input, description: "Cost the store paid to acquire the unit, in cents", constraints: ">= 0" }
      - { name: list_price_cents, type: integer, source: input, description: "Current sticker/list price in cents; also the part price charged when consumed on a repair", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: "IN_STOCK", description: "Allocation lifecycle state. Rentals do NOT change this field (loaner availability is governed purely by temporal overlap of ACTIVE rentals); only sales, part-consumption, and scrapping mutate it.", constraints: "enum: IN_STOCK|RESERVED|SOLD|SCRAPPED" }

  - name: SalesOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the buyer" }
      - { name: inventory_item_id, type: string, source: input, description: "FK -> InventoryItem.id; the machine being sold" }
      - { name: sale_price_cents, type: integer, source: input, description: "Negotiated pre-tax sale price in cents", constraints: ">= 0" }
      - { name: trade_in_model, type: string, source: input, default: null, description: "Free-text description of a machine the customer trades in; null when no trade-in" }
      - { name: trade_in_condition, type: enum, source: input, default: null, description: "Grade of the traded-in machine; null when no trade-in", constraints: "enum: GOOD|FAIR|POOR|null" }
      - { name: trade_in_estimate_cents, type: integer, source: computed, default: 0, description: "Provisional trade-in appraisal from the fixed condition schedule, set at reservation; 0 when no trade-in" }
      - { name: trade_in_final_cents, type: integer, source: computed, default: null, description: "Final manager appraisal supplied at completion; null until COMPLETED (or no trade-in)" }
      - { name: loyalty_discount_cents, type: integer, source: computed, default: 0, description: "Discount applied from the buyer's pre-sale loyalty_tier, computed at completion" }
      - { name: tax_cents, type: integer, source: computed, default: 0, description: "Sales tax on the taxable amount, computed at completion" }
      - { name: credit_applied_cents, type: integer, source: computed, default: 0, description: "Store credit consumed by this order at completion = min(buyer pre-order store_credit, taxable + tax); retained so cancellation can reverse it exactly" }
      - { name: total_due_cents, type: integer, source: computed, default: 0, description: "Net amount charged to the buyer at completion (see sales_total calculation)" }
      - { name: warranty_expires_at, type: datetime, source: computed, default: null, description: "Completion time plus Product.warranty_months; null until COMPLETED" }
      - { name: status, type: enum, source: system, default: "RESERVED", description: "Order lifecycle state", constraints: "enum: RESERVED|COMPLETED|CANCELLED" }

  - name: RepairTicket
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the owner of the machine under repair" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the model being repaired (used for recall/warranty checks)" }
      - { name: is_warranty, type: boolean, source: input, default: false, description: "Whether the customer claims warranty coverage; labor is waived on the final invoice when true" }
      - { name: diagnosis, type: string, source: input, default: null, description: "Technician diagnosis text, set on quote" }
      - { name: labor_hours, type: number, source: input, default: null, description: "Estimated labor hours, set on quote", constraints: ">= 0" }
      - { name: labor_estimate_cents, type: integer, source: computed, default: 0, description: "Provisional labor cost from labor_hours * LABOR_RATE_CENTS, set on quote" }
      - { name: parts_cost_cents, type: integer, source: computed, default: 0, description: "Running sum of list_price_cents of InventoryItems consumed as parts on this ticket" }
      - { name: final_invoice_cents, type: integer, source: computed, default: null, description: "Final amount owed, set at completion (see repair_invoice calculation); null until READY" }
      - { name: status, type: enum, source: system, default: "INTAKE", description: "Repair lifecycle state; AWAITING_APPROVAL can revert to INTAKE on customer rejection", constraints: "enum: INTAKE|AWAITING_APPROVAL|IN_REPAIR|READY|CLOSED|CANCELLED" }

  - name: RentalAgreement
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the renter" }
      - { name: inventory_item_id, type: string, source: input, description: "FK -> InventoryItem.id; the loaner unit" }
      - { name: start_at, type: datetime, source: input, description: "Loan start instant (inclusive)" }
      - { name: due_at, type: datetime, source: input, description: "Loan due instant (exclusive); must be strictly after start_at" }
      - { name: daily_rate_cents, type: integer, source: input, description: "Rental price per day in cents", constraints: ">= 0" }
      - { name: deposit_cents, type: integer, source: input, description: "Refundable deposit held for the duration in cents", constraints: ">= 0" }
      - { name: returned_at, type: datetime, source: computed, default: null, description: "Actual return instant, set on return; null while ACTIVE" }
      - { name: rental_days, type: integer, source: computed, default: 0, description: "Billable whole days = ceil((due_at - start_at) / 1 day)" }
      - { name: late_fee_cents, type: integer, source: computed, default: 0, description: "Late penalty computed at return (see rental_late_fee calculation); 0 if on time" }
      - { name: total_charge_cents, type: integer, source: computed, default: 0, description: "rental_days * daily_rate_cents + late_fee_cents, finalized at return" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "Rental lifecycle state", constraints: "enum: ACTIVE|RETURNED|CANCELLED" }

  - name: ClassSession
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Class/lesson title" }
      - { name: machine_type, type: enum, source: input, description: "Focus machine family", constraints: "enum: SEWING|VACUUM" }
      - { name: start_at, type: datetime, source: input, description: "Session start instant" }
      - { name: end_at, type: datetime, source: input, description: "Session end instant; must be strictly after start_at" }
      - { name: capacity, type: integer, source: input, description: "Max ENROLLED seats", constraints: ">= 1" }
      - { name: fee_cents, type: integer, source: input, description: "Per-seat fee in cents", constraints: ">= 0" }
      - { name: enrolled_count, type: integer, source: computed, default: 0, description: "Count of enrollments in ENROLLED status" }
      - { name: waitlist_count, type: integer, source: computed, default: 0, description: "Count of enrollments in WAITLISTED status" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "Session lifecycle state", constraints: "enum: SCHEDULED|COMPLETED|CANCELLED" }

  - name: ClassEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: class_session_id, type: string, source: input, description: "FK -> ClassSession.id; the session enrolled into" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the enrollee" }
      - { name: fee_charged_cents, type: integer, source: computed, default: 0, description: "Fee debited from the customer's store_credit at enrollment (ClassSession.fee_cents at time of enroll)" }
      - { name: status, type: enum, source: system, default: "ENROLLED", description: "Enrollment lifecycle state; WAITLISTED when session was full at enroll", constraints: "enum: ENROLLED|WAITLISTED|ATTENDED|CANCELLED" }

  - name: TuneUpSubscription
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the subscriber" }
      - { name: plan_tier, type: enum, source: input, description: "Subscription plan", constraints: "enum: BASIC|PRO" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Monthly fee in cents", constraints: ">= 0" }
      - { name: tune_ups_included, type: integer, source: input, description: "Number of tune-ups allowed per billing period", constraints: ">= 0" }
      - { name: tune_ups_used, type: integer, source: computed, default: 0, description: "Tune-ups redeemed in the current period; reset to 0 is out of scope (single-period model)" }
      - { name: current_period_start, type: datetime, source: computed, description: "Start of the current billing period, set to the logical clock at creation" }
      - { name: current_period_end, type: datetime, source: computed, description: "current_period_start + PERIOD_DAYS days" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "Subscription lifecycle state", constraints: "enum: ACTIVE|PAST_DUE|CANCELLED" }

  - name: SpecialOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the requester" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the model being special-ordered" }
      - { name: quantity, type: integer, source: input, description: "Units requested", constraints: ">= 1" }
      - { name: unit_price_cents, type: integer, source: input, description: "Agreed per-unit price in cents", constraints: ">= 0" }
      - { name: deposit_cents, type: integer, source: input, description: "Non-refundable-on-fulfillment deposit in cents", constraints: ">= 0" }
      - { name: balance_due_cents, type: integer, source: computed, default: 0, description: "quantity * unit_price_cents - deposit_cents; recomputed on amend" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "Special-order lifecycle state", constraints: "enum: REQUESTED|RECEIVED|FULFILLED|CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Product
    field: recall_status
    initial_state: NONE
    terminal_states: [RECALLED]
    transitions:
      - from: NONE
        to: RECALLED
        trigger: "POST /products/{id}/recall"
        actor: StoreManager
        preconditions:
          - "Product.recall_status == NONE (else ERR_ALREADY_RECALLED)"
        side_effects:
          - "recall_reason set from request body"
          - "Subsequent SalesOrder reserve/complete and RepairTicket approve on this product are blocked (see validations)"

  - entity: InventoryItem
    field: status
    initial_state: IN_STOCK
    terminal_states: [SOLD, SCRAPPED]
    transitions:
      - from: IN_STOCK
        to: RESERVED
        trigger: "system (POST /sales-orders reserves the unit at order creation)"
        actor: system
        preconditions:
          - "InventoryItem.status == IN_STOCK (else ERR_ITEM_NOT_AVAILABLE)"
        side_effects: []
      - from: RESERVED
        to: SOLD
        trigger: "system (POST /sales-orders/{id}/complete)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RESERVED
        to: IN_STOCK
        trigger: "system (POST /sales-orders/{id}/cancel releases a RESERVED order)"
        actor: system
        preconditions: []
        note: "IN_STOCK->RESERVED->IN_STOCK is a genuine cycle: a released unit can be reserved again by a new order (non-linear)."
        side_effects: []
      - from: SOLD
        to: IN_STOCK
        trigger: "system (POST /sales-orders/{id}/cancel reverses a COMPLETED order)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_STOCK
        to: SOLD
        trigger: "system (POST /repair-tickets/{id}/consume-part consumes a PART unit)"
        actor: system
        preconditions:
          - "InventoryItem.status == IN_STOCK (else ERR_ITEM_NOT_AVAILABLE)"
          - "Product.category == PART (else ERR_NOT_A_PART)"
        side_effects: []
      - from: IN_STOCK
        to: SCRAPPED
        trigger: "POST /inventory-items/{id}/scrap"
        actor: StoreManager
        preconditions:
          - "InventoryItem.status == IN_STOCK (else ERR_ITEM_NOT_AVAILABLE)"
        side_effects: []

  - entity: SalesOrder
    field: status
    initial_state: RESERVED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: RESERVED
        to: COMPLETED
        trigger: "POST /sales-orders/{id}/complete"
        actor: SalesAssociate
        preconditions:
          - "SalesOrder.status == RESERVED (else ERR_INVALID_STATE)"
          - "Product of the reserved InventoryItem has recall_status == NONE (else ERR_PRODUCT_RECALLED)"
          - "If trade-in present, trade_in_final_cents (request) is within TRADE_IN_BAND of trade_in_estimate_cents (else ERR_TRADE_IN_OUT_OF_BAND)"
        side_effects:
          - "loyalty_discount_cents, tax_cents, credit_applied_cents, total_due_cents computed via sales_total using the buyer's PRE-sale loyalty_tier"
          - "warranty_expires_at = clock_now + Product.warranty_months"
          - "InventoryItem RESERVED -> SOLD"
          - "Customer.store_credit_cents -= credit_applied_cents (the store credit consumed by this order)"
          - "If trade-in present: Customer.store_credit_cents += trade_in_final_cents"
          - "Customer.lifetime_spend_cents += total_due_cents; Customer.loyalty_tier recomputed"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /sales-orders/{id}/cancel"
        actor: SalesAssociate
        preconditions:
          - "SalesOrder.status == RESERVED (else ERR_INVALID_STATE)"
        side_effects:
          - "InventoryItem RESERVED -> IN_STOCK"
      - from: COMPLETED
        to: CANCELLED
        trigger: "POST /sales-orders/{id}/cancel"
        actor: StoreManager
        preconditions:
          - "SalesOrder.status == COMPLETED (else ERR_INVALID_STATE)"
        note: "Reversal/return path; keeps store_credit conserved (see compensating_invariant)."
        side_effects:
          - "InventoryItem SOLD -> IN_STOCK"
          - "Customer.store_credit_cents += credit_applied_cents (refund the credit consumed by this order)"
          - "If trade-in present: Customer.store_credit_cents -= trade_in_final_cents (claw back the trade-in grant)"
          - "Customer.lifetime_spend_cents -= total_due_cents; Customer.loyalty_tier recomputed"

  - entity: RepairTicket
    field: status
    initial_state: INTAKE
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: INTAKE
        to: AWAITING_APPROVAL
        trigger: "POST /repair-tickets/{id}/quote"
        actor: ServiceTech
        preconditions:
          - "RepairTicket.status == INTAKE (else ERR_INVALID_STATE)"
        side_effects:
          - "diagnosis and labor_hours stored"
          - "labor_estimate_cents = labor_hours * LABOR_RATE_CENTS"
      - from: AWAITING_APPROVAL
        to: IN_REPAIR
        trigger: "POST /repair-tickets/{id}/approve"
        actor: Customer
        preconditions:
          - "RepairTicket.status == AWAITING_APPROVAL (else ERR_INVALID_STATE)"
          - "Acting Customer owns the ticket (X-User-ID == customer_id) unless actor is SalesAssociate (else ERR_FORBIDDEN)"
          - "Product.recall_status == NONE (else ERR_PRODUCT_RECALLED)"
        side_effects: []
      - from: AWAITING_APPROVAL
        to: INTAKE
        trigger: "POST /repair-tickets/{id}/reject"
        actor: Customer
        preconditions:
          - "RepairTicket.status == AWAITING_APPROVAL (else ERR_INVALID_STATE)"
          - "Acting Customer owns the ticket unless actor is SalesAssociate (else ERR_FORBIDDEN)"
        note: "Revision loop: rejected quote returns to INTAKE so the technician can re-quote (cyclic)."
        side_effects:
          - "diagnosis cleared to null; labor_hours cleared to null; labor_estimate_cents reset to 0"
      - from: IN_REPAIR
        to: READY
        trigger: "POST /repair-tickets/{id}/complete"
        actor: ServiceTech
        preconditions:
          - "RepairTicket.status == IN_REPAIR (else ERR_INVALID_STATE)"
        side_effects:
          - "final_invoice_cents computed via repair_invoice (labor waived when is_warranty)"
      - from: READY
        to: CLOSED
        trigger: "POST /repair-tickets/{id}/close"
        actor: SalesAssociate
        preconditions:
          - "RepairTicket.status == READY (else ERR_INVALID_STATE)"
        side_effects:
          - "Customer.store_credit_cents -= min(store_credit_cents, final_invoice_cents) (credit applied toward invoice)"
      - from: [INTAKE, AWAITING_APPROVAL, IN_REPAIR]
        to: CANCELLED
        trigger: "POST /repair-tickets/{id}/cancel"
        actor: SalesAssociate
        preconditions:
          - "RepairTicket.status IN {INTAKE, AWAITING_APPROVAL, IN_REPAIR} (else ERR_INVALID_STATE)"
        side_effects: []

  - entity: RentalAgreement
    field: status
    initial_state: ACTIVE
    terminal_states: [RETURNED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: RETURNED
        trigger: "POST /rental-agreements/{id}/return"
        actor: SalesAssociate
        preconditions:
          - "RentalAgreement.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "returned_at = request.returned_at or clock_now"
          - "late_fee_cents computed via rental_late_fee"
          - "total_charge_cents = rental_days * daily_rate_cents + late_fee_cents"
          - "Customer.store_credit_cents += (deposit_cents - late_fee_cents)  # deposit hold released net of late fee"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /rental-agreements/{id}/cancel"
        actor: SalesAssociate
        preconditions:
          - "RentalAgreement.status == ACTIVE (else ERR_INVALID_STATE)"
        note: "Cancellation releases the full deposit hold; the deposit hold is conserved."
        side_effects:
          - "Customer.store_credit_cents += deposit_cents (full deposit hold released)"

  - entity: ClassSession
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /class-sessions/{id}/complete"
        actor: StoreManager
        preconditions:
          - "ClassSession.status == SCHEDULED (else ERR_INVALID_STATE)"
        side_effects:
          - "Every ClassEnrollment in ENROLLED status -> ATTENDED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /class-sessions/{id}/cancel"
        actor: StoreManager
        preconditions:
          - "ClassSession.status == SCHEDULED (else ERR_INVALID_STATE)"
        side_effects:
          - "Every ClassEnrollment in {ENROLLED, WAITLISTED} -> CANCELLED (cascade)"
          - "Each such cancellation refunds fee_charged_cents to that Customer.store_credit_cents (transitive cascade, depth 3: session -> enrollment -> customer)"

  - entity: ClassEnrollment
    field: status
    initial_state: ENROLLED
    terminal_states: [ATTENDED, CANCELLED]
    transitions:
      - from: null
        to: ENROLLED
        trigger: "POST /class-sessions/{id}/enrollments (when enrolled_count < capacity)"
        actor: Customer
        preconditions:
          - "ClassSession.status == SCHEDULED (else ERR_SESSION_NOT_OPEN)"
          - "enrolled_count < capacity"
          - "No schedule conflict for the customer (see class_schedule_overlap)"
        side_effects:
          - "fee_charged_cents = ClassSession.fee_cents; Customer.store_credit_cents -= fee_charged_cents"
          - "ClassSession.enrolled_count += 1"
      - from: null
        to: WAITLISTED
        trigger: "POST /class-sessions/{id}/enrollments (when enrolled_count >= capacity)"
        actor: Customer
        preconditions:
          - "ClassSession.status == SCHEDULED (else ERR_SESSION_NOT_OPEN)"
          - "enrolled_count >= capacity"
          - "No schedule conflict for the customer"
        side_effects:
          - "fee_charged_cents = ClassSession.fee_cents; Customer.store_credit_cents -= fee_charged_cents"
          - "ClassSession.waitlist_count += 1"
      - from: ENROLLED
        to: CANCELLED
        trigger: "POST /class-enrollments/{id}/cancel"
        actor: Customer
        preconditions:
          - "ClassEnrollment.status == ENROLLED (else ERR_INVALID_STATE)"
          - "Acting Customer owns the enrollment unless actor is SalesAssociate (else ERR_FORBIDDEN)"
        side_effects:
          - "Customer.store_credit_cents += fee_charged_cents (refund)"
          - "ClassSession.enrolled_count -= 1"
          - "Promote the earliest-created WAITLISTED enrollment (order by created_at ASC) to ENROLLED: waitlist_count -= 1, enrolled_count += 1 (transitive cascade)"
      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /class-enrollments/{id}/cancel"
        actor: Customer
        preconditions:
          - "ClassEnrollment.status == WAITLISTED (else ERR_INVALID_STATE)"
          - "Acting Customer owns the enrollment unless actor is SalesAssociate (else ERR_FORBIDDEN)"
        side_effects:
          - "Customer.store_credit_cents += fee_charged_cents (refund)"
          - "ClassSession.waitlist_count -= 1"

  - entity: TuneUpSubscription
    field: status
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAST_DUE
        trigger: "POST /tune-up-subscriptions/{id}/lapse"
        actor: StoreManager
        preconditions:
          - "TuneUpSubscription.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects: []
      - from: PAST_DUE
        to: ACTIVE
        trigger: "POST /tune-up-subscriptions/{id}/reinstate"
        actor: SalesAssociate
        preconditions:
          - "TuneUpSubscription.status == PAST_DUE (else ERR_INVALID_STATE)"
        side_effects: []
      - from: [ACTIVE, PAST_DUE]
        to: CANCELLED
        trigger: "POST /tune-up-subscriptions/{id}/cancel"
        actor: Customer
        preconditions:
          - "TuneUpSubscription.status IN {ACTIVE, PAST_DUE} (else ERR_INVALID_STATE)"
          - "Acting Customer owns the subscription unless actor is SalesAssociate (else ERR_FORBIDDEN)"
        side_effects:
          - "Prorated refund via subscription_proration credited to Customer.store_credit_cents (only when cancelling from ACTIVE and clock_now < current_period_end; PAST_DUE yields 0 refund)"

  - entity: SpecialOrder
    field: status
    initial_state: REQUESTED
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: RECEIVED
        trigger: "POST /special-orders/{id}/receive"
        actor: SalesAssociate
        preconditions:
          - "SpecialOrder.status == REQUESTED (else ERR_INVALID_STATE)"
        side_effects:
          - "increments SpecialOrder.version by 1"
      - from: RECEIVED
        to: FULFILLED
        trigger: "POST /special-orders/{id}/fulfill"
        actor: SalesAssociate
        preconditions:
          - "SpecialOrder.status == RECEIVED (else ERR_INVALID_STATE)"
        side_effects:
          - "increments SpecialOrder.version by 1"
      - from: [REQUESTED, RECEIVED]
        to: CANCELLED
        trigger: "POST /special-orders/{id}/cancel"
        actor: SalesAssociate
        preconditions:
          - "SpecialOrder.status IN {REQUESTED, RECEIVED} (else ERR_INVALID_STATE)"
        side_effects:
          - "increments SpecialOrder.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: special-order-amend-stale
    parent_entity: SpecialOrder
    write_endpoint: "PATCH /special-orders/{id}"
    occ_field: "expected_special_order_version"
    description: |
      Amending a SpecialOrder (quantity / deposit) against a version that has
      advanced since the client last read it is rejected. A prior amend or a
      state transition legitimately superseded the client's view, so the client
      is working from a stale snapshot and must re-read before amending again.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: trade_in_appraisal
    trigger: "SalesOrder reservation (estimate) and completion (final)"
    algorithm: dual_variant
    formula: |
      # Provisional estimate, computed at reservation from a fixed schedule keyed on condition:
      trade_in_estimate_cents = TRADE_IN_SCHEDULE[trade_in_condition]   # 0 when no trade-in
      # Final appraisal, supplied by StoreManager at completion:
      trade_in_final_cents = request.trade_in_final_cents
      # Store credit granted at completion uses the FINAL value.
    input_set: "Single SalesOrder; trade_in_condition and the manager-supplied final value."
    constants:
      TRADE_IN_SCHEDULE: { GOOD: 40000, FAIR: 25000, POOR: 10000 }
      TRADE_IN_BAND: 15000   # |final - estimate| must be <= this at completion
    precision: "integer cents"
    variants:
      - name: provisional_estimate
        when: "at reservation"
        difference: "derived from the fixed condition schedule; no human judgement"
      - name: final_appraisal
        when: "at completion"
        difference: "manager-supplied value; must fall within TRADE_IN_BAND of the estimate; this value (not the estimate) is credited"

  - name: repair_invoice
    trigger: "RepairTicket quote (labor estimate) and completion (final invoice)"
    algorithm: dual_variant
    formula: |
      # Provisional labor estimate at quote:
      labor_estimate_cents = round_half_up(labor_hours * LABOR_RATE_CENTS)
      # Final invoice at completion:
      if is_warranty:
        final_invoice_cents = parts_cost_cents            # labor waived under warranty
      else:
        final_invoice_cents = labor_estimate_cents + parts_cost_cents
    input_set: "Single RepairTicket; labor_hours (from quote), accumulated parts_cost_cents, is_warranty flag."
    constants:
      LABOR_RATE_CENTS: 9000   # $90.00 / hour
    precision: "2 decimal places on the hours product, round_half_up, then integer cents"
    variants:
      - name: provisional_labor
        when: "at quote"
        difference: "labor only, before any parts are consumed; ignores warranty"
      - name: final_invoice
        when: "at completion"
        difference: "adds accumulated parts_cost_cents and waives labor entirely when is_warranty is true"

  - name: sales_total
    trigger: "SalesOrder completion"
    algorithm: threshold
    formula: |
      # (Rule 2 mode (a): >=3 inputs with nested min + conditional.)
      taxable_cents      = sale_price_cents - loyalty_discount_cents
      tax_cents          = round_half_up(taxable_cents * TAX_RATE)
      credit_applied_cents = min(customer.store_credit_cents, taxable_cents + tax_cents)   # store credit as it stood BEFORE this order's trade-in grant
      total_due_cents      = taxable_cents + tax_cents - credit_applied_cents
    input_set: "Single SalesOrder plus the buyer Customer's pre-order store_credit_cents and pre-order loyalty_tier."
    constants:
      TAX_RATE: 0.08
    precision: "round_half_up to integer cents on tax; all other terms integer cents"
    note: "The store credit CONSUMED (credit_applied) is deducted from the buyer's balance; any trade-in grant is added AFTER and does not offset this same order."

  - name: loyalty_pricing
    trigger: "SalesOrder completion (evaluated before sales_total)"
    algorithm: constraint_propagation
    formula: |
      # (Rule 2 mode (c): circular-looking dependency; evaluation order pinned.)
      # loyalty_tier depends on lifetime_spend_cents; lifetime_spend_cents is
      # increased by THIS order's total_due_cents; total_due_cents depends on
      # loyalty_discount_cents which depends on loyalty_tier. Pin the order:
      #   1. Read loyalty_tier from lifetime_spend_cents AS IT STANDS NOW (pre-sale).
      #   2. loyalty_discount_cents = round_half_up(sale_price_cents * DISCOUNT_PCT[pre_sale_tier]).
      #   3. Run sales_total.
      #   4. AFTER completion, lifetime_spend_cents += total_due_cents and loyalty_tier is
      #      recomputed (may promote the tier used by the NEXT order only).
      pre_sale_tier          = tier_of(customer.lifetime_spend_cents)
      loyalty_discount_cents = round_half_up(sale_price_cents * DISCOUNT_PCT[pre_sale_tier])
    input_set: "Single SalesOrder; buyer's lifetime_spend_cents as of completion (before this order is added)."
    constants:
      TIER_THRESHOLDS: { STANDARD_below: 500000, GOLD_at: 500000, PLATINUM_at: 1500000 }
      DISCOUNT_PCT: { STANDARD: 0.0, GOLD: 0.05, PLATINUM: 0.10 }
    precision: "round_half_up to integer cents"
    note: "tier_of(spend): PLATINUM if spend >= 1500000; GOLD if spend >= 500000; else STANDARD (>= boundaries)."

  - name: subscription_proration
    trigger: "TuneUpSubscription cancel from ACTIVE"
    algorithm: aggregation
    formula: |
      # (Rule 2 mode (b): rounding order is pinned.)
      period_days = (current_period_end - current_period_start) / 1 day     # whole days
      unused_days = max(0, ceil((current_period_end - clock_now) / 1 day))
      # Pin: multiply the integer fee by integer unused_days FIRST, divide by
      # period_days, THEN round_half_up. Do NOT round the per-day rate first.
      refund_cents = round_half_up( (monthly_fee_cents * unused_days) / period_days )
    input_set: "Single TuneUpSubscription; logical clock position at cancel."
    constants:
      PERIOD_DAYS: 30
    precision: "round_half_up to integer cents, applied ONCE at the end"
    note: "Cancelling from PAST_DUE yields refund_cents = 0."

  - name: rental_late_fee
    trigger: "RentalAgreement return"
    algorithm: threshold
    formula: |
      days_late = max(0, ceil((returned_at - due_at) / 1 day))   # 0 when returned on/before due_at
      late_fee_cents = round_half_up(days_late * daily_rate_cents * LATE_MULTIPLIER)
    input_set: "Single RentalAgreement; returned_at vs due_at."
    constants:
      LATE_MULTIPLIER: 1.5
    precision: "round_half_up to integer cents"
    note: "Boundary: returned exactly at due_at => days_late 0 => late_fee 0. due_at is exclusive."

  - name: rental_days
    trigger: "RentalAgreement creation"
    algorithm: aggregation
    formula: |
      rental_days = ceil((due_at - start_at) / 1 day)   # >= 1 for a valid interval
    input_set: "Single RentalAgreement."
    precision: "integer days"

  - name: loyalty_tier_recompute
    trigger: "Any change to Customer.lifetime_spend_cents (sale complete/cancel)"
    algorithm: threshold
    formula: |
      loyalty_tier = PLATINUM if lifetime_spend_cents >= 1500000
                     else GOLD if lifetime_spend_cents >= 500000
                     else STANDARD
    input_set: "Single Customer."
    constants:
      GOLD_THRESHOLD_CENTS: 500000
      PLATINUM_THRESHOLD_CENTS: 1500000
    precision: "exact integer comparison, >= boundaries inclusive"

  - name: rental_overlap_check
    trigger: "RentalAgreement creation (before the deposit hold)"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN interval semantics [start_at, due_at). Two rentals of the SAME
      # InventoryItem conflict iff their half-open intervals intersect:
      #   conflict(R_new, R_existing) := (R_new.start_at < R_existing.due_at)
      #                                  AND (R_existing.start_at < R_new.due_at)
      # Adjacency (R_new.start_at == R_existing.due_at, or vice versa) is NOT a
      # conflict — the intervals only touch at the open endpoint.
      # Only rentals in status ACTIVE participate.
    input_set: "All ACTIVE RentalAgreements whose inventory_item_id == candidate.inventory_item_id."
    precision: "instant comparison; due_at is exclusive"
    note: "On conflict -> ERR_RENTAL_OVERLAP. Resource entity: InventoryItem."

  - name: class_schedule_overlap_check
    trigger: "ClassEnrollment creation"
    algorithm: interval_merge
    formula: |
      # CLOSED interval semantics [start_at, end_at] WITH a symmetric buffer.
      # A customer's new enrollment conflicts with any of their existing
      # non-cancelled enrollments' sessions iff the sessions are not separated
      # by at least SCHEDULE_BUFFER_MINUTES:
      #   ok := (existing.end_at + BUFFER <= new.start_at)
      #         OR (new.end_at + BUFFER <= existing.start_at)
      #   conflict := NOT ok
      # Because the boundary is inclusive-with-buffer, back-to-back sessions
      # (existing.end_at == new.start_at) DO conflict (buffer not satisfied) —
      # the opposite adjacency treatment from rental_overlap_check.
    input_set: "All ClassEnrollments in {ENROLLED, WAITLISTED} for the same customer_id, joined to their ClassSession start_at/end_at."
    constants:
      SCHEDULE_BUFFER_MINUTES: 30
    precision: "instant comparison; both endpoints inclusive; 30-minute buffer required between sessions"
    note: "On conflict -> ERR_SCHEDULE_CONFLICT. Resource entity: Customer (the customer's personal schedule)."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted to perform this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "For Customer-role actions on an owned resource, X-User-ID equals the resource's customer_id (approve/reject repair, cancel enrollment, cancel subscription)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "POST /repair-tickets/{id}/approve, POST /repair-tickets/{id}/reject, POST /class-enrollments/{id}/cancel, POST /tune-up-subscriptions/{id}/cancel"

  - priority: 4
    category: existence
    check: "Path resource ids exist, validated left-to-right; body FK ids (customer_id, inventory_item_id, product_id, class_session_id) reference existing entities"
    error_id: "ERR_PRODUCT_NOT_FOUND | ERR_CUSTOMER_NOT_FOUND | ERR_INVENTORY_ITEM_NOT_FOUND | ERR_SALES_ORDER_NOT_FOUND | ERR_REPAIR_TICKET_NOT_FOUND | ERR_RENTAL_NOT_FOUND | ERR_CLASS_SESSION_NOT_FOUND | ERR_ENROLLMENT_NOT_FOUND | ERR_SUBSCRIPTION_NOT_FOUND | ERR_SPECIAL_ORDER_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"

  - priority: 5
    category: state
    check: "Request body is well-formed: required fields present, enums valid, integer fields >= 0, end/due strictly after start"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST/PATCH with a body"

  - priority: 6
    category: state
    check: "Target resource is in a state that permits the requested transition (per §1.2 preconditions)"
    error_id: "ERR_INVALID_STATE | ERR_ITEM_NOT_AVAILABLE | ERR_ALREADY_RECALLED | ERR_SESSION_NOT_OPEN"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_safety
    check: "SalesOrder complete and RepairTicket approve are blocked when the referenced Product.recall_status == RECALLED"
    error_id: ERR_PRODUCT_RECALLED
    http_status: 409
    applies_to: "POST /sales-orders/{id}/complete, POST /repair-tickets/{id}/approve"

  - priority: 8
    category: business_temporal
    check: "New RentalAgreement interval [start_at, due_at) must not overlap any existing ACTIVE rental of the same InventoryItem (half-open; adjacency due==start allowed)"
    error_id: ERR_RENTAL_OVERLAP
    http_status: 409
    applies_to: "POST /rental-agreements"

  - priority: 9
    category: business_temporal
    check: "A customer cannot enroll in a ClassSession whose [start_at, end_at] plus SCHEDULE_BUFFER_MINUTES conflicts with another of the customer's non-cancelled enrollments' sessions (closed interval with buffer)"
    error_id: ERR_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /class-sessions/{id}/enrollments"

  - priority: 10
    category: business_constraint
    check: "PART consumption requires the InventoryItem's Product.category == PART"
    error_id: ERR_NOT_A_PART
    http_status: 409
    applies_to: "POST /repair-tickets/{id}/consume-part"

  - priority: 11
    category: business_constraint
    check: "Tune-up redemption requires tune_ups_used < tune_ups_included (boundary: used == included is rejected)"
    error_id: ERR_TUNE_UPS_EXHAUSTED
    http_status: 409
    applies_to: "POST /tune-up-subscriptions/{id}/redeem"

  - priority: 12
    category: business_constraint
    check: "At completion with a trade-in, |trade_in_final_cents - trade_in_estimate_cents| <= TRADE_IN_BAND"
    error_id: ERR_TRADE_IN_OUT_OF_BAND
    http_status: 409
    applies_to: "POST /sales-orders/{id}/complete"

  - priority: 13
    category: business_fiscal
    check: "OCC: PATCH /special-orders/{id} requires expected_special_order_version to equal the current SpecialOrder.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /special-orders/{id}"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving: logical clock ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server logical clock (test-driving endpoint). The startup default before any call is exactly 2026-07-01T00:00:00Z; the clock never falls back to wall-clock time. All clock_now references (subscription periods, warranty expiry, proration, late-fee) read this logical clock.", roles: [SalesAssociate, ServiceTech, StoreManager, Customer], code: 200, input: [to_iso8601], output: null, side_effects: ["logical clock advanced to to_iso8601"] }

  # ---- Product ----
  - { method: POST, path: "/products", description: "Create a catalog product", roles: [StoreManager], code: 201, input: [model_name, category, brand, msrp_cents, "warranty_months?"], output: Product, side_effects: ["recall_status=NONE"] }
  - { method: GET, path: "/products", description: "List products", roles: [SalesAssociate, ServiceTech, StoreManager, Customer], code: 200, input: ["category?", "limit?", "offset?"], output: "Product[]", side_effects: [] }
  - { method: GET, path: "/products/{id}", description: "Get a product", roles: [SalesAssociate, ServiceTech, StoreManager, Customer], code: 200, input: [], output: Product, side_effects: [] }
  - { method: POST, path: "/products/{id}/recall", description: "Issue a recall on a product", roles: [StoreManager], code: 200, input: [recall_reason], output: Product, side_effects: ["recall_status NONE -> RECALLED", "recall_reason stored"] }

  # ---- InventoryItem ----
  - { method: POST, path: "/inventory-items", description: "Intake a physical unit into inventory", roles: [StoreManager], code: 201, input: [product_id, "serial_number?", "condition?", acquisition_cost_cents, list_price_cents], output: InventoryItem, side_effects: ["status=IN_STOCK"] }
  - { method: GET, path: "/inventory-items", description: "List/filter inventory items", roles: [SalesAssociate, ServiceTech, StoreManager, Customer], code: 200, input: ["product_id?", "status?", "limit?", "offset?"], output: "InventoryItem[]", side_effects: [] }
  - { method: GET, path: "/inventory-items/{id}", description: "Get an inventory item", roles: [SalesAssociate, ServiceTech, StoreManager, Customer], code: 200, input: [], output: InventoryItem, side_effects: [] }
  - { method: POST, path: "/inventory-items/{id}/scrap", description: "Scrap an in-stock unit", roles: [StoreManager], code: 200, input: [], output: InventoryItem, side_effects: ["status IN_STOCK -> SCRAPPED"] }

  # ---- Customer ----
  - { method: POST, path: "/customers", description: "Register a customer", roles: [SalesAssociate, StoreManager], code: 201, input: [full_name, email], output: Customer, side_effects: ["store_credit_cents=0, lifetime_spend_cents=0, loyalty_tier=STANDARD"] }
  - { method: GET, path: "/customers/{id}", description: "Get a customer", roles: [SalesAssociate, ServiceTech, StoreManager, Customer], code: 200, input: [], output: Customer, side_effects: [] }
  - { method: POST, path: "/customers/{id}/store-credit/adjustments", description: "Manually adjust a customer's store credit (admin/goodwill)", roles: [StoreManager], code: 200, input: [amount_cents, reason], output: Customer, side_effects: ["store_credit_cents += amount_cents (may be negative)"] }

  # ---- SalesOrder ----
  - { method: POST, path: "/sales-orders", description: "Open a sales order and reserve the unit", roles: [SalesAssociate], code: 201, input: [customer_id, inventory_item_id, sale_price_cents, "trade_in_model?", "trade_in_condition?"], output: SalesOrder, side_effects: ["status=RESERVED", "InventoryItem IN_STOCK -> RESERVED", "trade_in_estimate_cents computed from schedule"] }
  - { method: GET, path: "/sales-orders", description: "List/filter sales orders", roles: [SalesAssociate, ServiceTech, StoreManager, Customer], code: 200, input: ["customer_id?", "inventory_item_id?", "limit?", "offset?"], output: "SalesOrder[]", side_effects: [] }
  - { method: GET, path: "/sales-orders/{id}", description: "Get a sales order", roles: [SalesAssociate, ServiceTech, StoreManager, Customer], code: 200, input: [], output: SalesOrder, side_effects: [] }
  - { method: POST, path: "/sales-orders/{id}/complete", description: "Complete the sale and finalize pricing", roles: [SalesAssociate], code: 200, input: ["trade_in_final_cents?"], output: SalesOrder, side_effects: ["loyalty_pricing + sales_total computed", "InventoryItem RESERVED -> SOLD", "store credit consumed/granted", "lifetime_spend + loyalty_tier updated", "warranty_expires_at set"] }
  - { method: POST, path: "/sales-orders/{id}/cancel", description: "Cancel a sales order (reversal when already completed)", roles: [SalesAssociate, StoreManager], code: 200, input: [], output: SalesOrder, side_effects: ["status -> CANCELLED", "InventoryItem released to IN_STOCK", "store credit / lifetime_spend reversed if it was COMPLETED"] }

  # ---- RepairTicket ----
  - { method: POST, path: "/repair-tickets", description: "Open a repair ticket", roles: [ServiceTech, SalesAssociate], code: 201, input: [customer_id, product_id, "is_warranty?"], output: RepairTicket, side_effects: ["status=INTAKE"] }
  - { method: GET, path: "/repair-tickets", description: "List/filter repair tickets", roles: [SalesAssociate, ServiceTech, StoreManager, Customer], code: 200, input: ["customer_id?", "product_id?", "limit?", "offset?"], output: "RepairTicket[]", side_effects: [] }
  - { method: GET, path: "/repair-tickets/{id}", description: "Get a repair ticket", roles: [SalesAssociate, ServiceTech, StoreManager, Customer], code: 200, input: [], output: RepairTicket, side_effects: [] }
  - { method: POST, path: "/repair-tickets/{id}/quote", description: "Record diagnosis and quote", roles: [ServiceTech], code: 200, input: [diagnosis, labor_hours], output: RepairTicket, side_effects: ["status INTAKE -> AWAITING_APPROVAL", "labor_estimate_cents computed"] }
  - { method: POST, path: "/repair-tickets/{id}/approve", description: "Customer approves the quote", roles: [Customer, SalesAssociate], code: 200, input: [], output: RepairTicket, side_effects: ["status AWAITING_APPROVAL -> IN_REPAIR"] }
  - { method: POST, path: "/repair-tickets/{id}/reject", description: "Customer rejects the quote (re-quote loop)", roles: [Customer, SalesAssociate], code: 200, input: [], output: RepairTicket, side_effects: ["status AWAITING_APPROVAL -> INTAKE", "diagnosis/labor_hours/labor_estimate_cents cleared"] }
  - { method: POST, path: "/repair-tickets/{id}/consume-part", description: "Consume a stocked PART unit onto the ticket", roles: [ServiceTech], code: 200, input: [inventory_item_id], output: RepairTicket, side_effects: ["InventoryItem IN_STOCK -> SOLD", "parts_cost_cents += that item's list_price_cents"] }
  - { method: POST, path: "/repair-tickets/{id}/complete", description: "Finish the repair and finalize the invoice", roles: [ServiceTech], code: 200, input: [], output: RepairTicket, side_effects: ["status IN_REPAIR -> READY", "final_invoice_cents computed"] }
  - { method: POST, path: "/repair-tickets/{id}/close", description: "Hand over and charge the customer", roles: [SalesAssociate], code: 200, input: [], output: RepairTicket, side_effects: ["status READY -> CLOSED", "store credit applied toward final_invoice_cents"] }
  - { method: POST, path: "/repair-tickets/{id}/cancel", description: "Cancel a non-terminal repair ticket", roles: [SalesAssociate], code: 200, input: [], output: RepairTicket, side_effects: ["status -> CANCELLED"] }

  # ---- RentalAgreement ----
  - { method: POST, path: "/rental-agreements", description: "Create a loaner rental (temporal reservation; does not change the unit's inventory status)", roles: [SalesAssociate], code: 201, input: [customer_id, inventory_item_id, start_at, due_at, daily_rate_cents, deposit_cents], output: RentalAgreement, side_effects: ["status=ACTIVE", "rental_days computed", "Customer.store_credit_cents -= deposit_cents (deposit hold)", "requires InventoryItem.status == IN_STOCK and no ACTIVE-rental interval overlap"] }
  - { method: GET, path: "/rental-agreements", description: "List/filter rentals", roles: [SalesAssociate, ServiceTech, StoreManager, Customer], code: 200, input: ["customer_id?", "inventory_item_id?", "limit?", "offset?"], output: "RentalAgreement[]", side_effects: [] }
  - { method: GET, path: "/rental-agreements/{id}", description: "Get a rental", roles: [SalesAssociate, ServiceTech, StoreManager, Customer], code: 200, input: [], output: RentalAgreement, side_effects: [] }
  - { method: POST, path: "/rental-agreements/{id}/return", description: "Return a loaner and settle charges", roles: [SalesAssociate], code: 200, input: ["returned_at?"], output: RentalAgreement, side_effects: ["status ACTIVE -> RETURNED", "late_fee + total_charge computed", "deposit refunded net of late fee to store credit"] }
  - { method: POST, path: "/rental-agreements/{id}/cancel", description: "Cancel an active rental", roles: [SalesAssociate], code: 200, input: [], output: RentalAgreement, side_effects: ["status ACTIVE -> CANCELLED", "full deposit hold released to store credit"] }

  # ---- ClassSession ----
  - { method: POST, path: "/class-sessions", description: "Schedule a class/lesson", roles: [StoreManager], code: 201, input: [title, machine_type, start_at, end_at, capacity, fee_cents], output: ClassSession, side_effects: ["status=SCHEDULED, enrolled_count=0, waitlist_count=0"] }
  - { method: GET, path: "/class-sessions", description: "List class sessions", roles: [SalesAssociate, ServiceTech, StoreManager, Customer], code: 200, input: ["machine_type?", "limit?", "offset?"], output: "ClassSession[]", side_effects: [] }
  - { method: GET, path: "/class-sessions/{id}", description: "Get a class session", roles: [SalesAssociate, ServiceTech, StoreManager, Customer], code: 200, input: [], output: ClassSession, side_effects: [] }
  - { method: POST, path: "/class-sessions/{id}/complete", description: "Mark a session completed", roles: [StoreManager], code: 200, input: [], output: ClassSession, side_effects: ["status SCHEDULED -> COMPLETED", "ENROLLED enrollments -> ATTENDED"] }
  - { method: POST, path: "/class-sessions/{id}/cancel", description: "Cancel a session and refund enrollees", roles: [StoreManager], code: 200, input: [], output: ClassSession, side_effects: ["status SCHEDULED -> CANCELLED", "ENROLLED/WAITLISTED enrollments -> CANCELLED with fee refunds (cascade)"] }

  # ---- ClassEnrollment ----
  - { method: POST, path: "/class-sessions/{id}/enrollments", description: "Enroll a customer (or waitlist when full)", roles: [Customer, SalesAssociate], code: 201, input: [customer_id], output: ClassEnrollment, side_effects: ["status=ENROLLED or WAITLISTED", "fee_charged_cents debited from store credit", "session counters updated"] }
  - { method: GET, path: "/class-enrollments", description: "List/filter enrollments", roles: [SalesAssociate, ServiceTech, StoreManager, Customer], code: 200, input: ["class_session_id?", "customer_id?", "limit?", "offset?"], output: "ClassEnrollment[]", side_effects: [] }
  - { method: GET, path: "/class-enrollments/{id}", description: "Get an enrollment", roles: [SalesAssociate, ServiceTech, StoreManager, Customer], code: 200, input: [], output: ClassEnrollment, side_effects: [] }
  - { method: POST, path: "/class-enrollments/{id}/cancel", description: "Cancel an enrollment (promotes earliest waitlisted)", roles: [Customer, SalesAssociate], code: 200, input: [], output: ClassEnrollment, side_effects: ["status -> CANCELLED", "fee refunded", "earliest WAITLISTED promoted to ENROLLED if cancelling an ENROLLED seat"] }

  # ---- TuneUpSubscription ----
  - { method: POST, path: "/tune-up-subscriptions", description: "Start a tune-up subscription", roles: [SalesAssociate], code: 201, input: [customer_id, plan_tier, monthly_fee_cents, tune_ups_included], output: TuneUpSubscription, side_effects: ["status=ACTIVE", "current_period_start=clock_now, current_period_end=+PERIOD_DAYS", "tune_ups_used=0"] }
  - { method: GET, path: "/tune-up-subscriptions", description: "List/filter subscriptions", roles: [SalesAssociate, ServiceTech, StoreManager, Customer], code: 200, input: ["customer_id?", "limit?", "offset?"], output: "TuneUpSubscription[]", side_effects: [] }
  - { method: GET, path: "/tune-up-subscriptions/{id}", description: "Get a subscription", roles: [SalesAssociate, ServiceTech, StoreManager, Customer], code: 200, input: [], output: TuneUpSubscription, side_effects: [] }
  - { method: POST, path: "/tune-up-subscriptions/{id}/redeem", description: "Redeem one included tune-up", roles: [ServiceTech, SalesAssociate], code: 200, input: [], output: TuneUpSubscription, side_effects: ["tune_ups_used += 1 (only if ACTIVE, within period, and used < included)"] }
  - { method: POST, path: "/tune-up-subscriptions/{id}/lapse", description: "Mark a subscription past due", roles: [StoreManager], code: 200, input: [], output: TuneUpSubscription, side_effects: ["status ACTIVE -> PAST_DUE"] }
  - { method: POST, path: "/tune-up-subscriptions/{id}/reinstate", description: "Reinstate a past-due subscription", roles: [SalesAssociate], code: 200, input: [], output: TuneUpSubscription, side_effects: ["status PAST_DUE -> ACTIVE"] }
  - { method: POST, path: "/tune-up-subscriptions/{id}/cancel", description: "Cancel a subscription (prorated refund from ACTIVE)", roles: [Customer, SalesAssociate], code: 200, input: [], output: TuneUpSubscription, side_effects: ["status -> CANCELLED", "prorated refund to store credit when cancelling from ACTIVE"] }

  # ---- SpecialOrder ----
  - { method: POST, path: "/special-orders", description: "Place a special order", roles: [SalesAssociate], code: 201, input: [customer_id, product_id, quantity, unit_price_cents, deposit_cents], output: SpecialOrder, side_effects: ["status=REQUESTED", "balance_due_cents computed"] }
  - { method: GET, path: "/special-orders", description: "List/filter special orders", roles: [SalesAssociate, ServiceTech, StoreManager, Customer], code: 200, input: ["customer_id?", "product_id?", "limit?", "offset?"], output: "SpecialOrder[]", side_effects: [] }
  - { method: GET, path: "/special-orders/{id}", description: "Get a special order", roles: [SalesAssociate, ServiceTech, StoreManager, Customer], code: 200, input: [], output: SpecialOrder, side_effects: [] }
  - { method: PATCH, path: "/special-orders/{id}", description: "Amend quantity/deposit (OCC-guarded)", roles: [SalesAssociate], code: 200, input: ["quantity?", "deposit_cents?", expected_special_order_version], output: SpecialOrder, side_effects: ["balance_due_cents recomputed", "increments SpecialOrder.version by 1"] }
  - { method: POST, path: "/special-orders/{id}/receive", description: "Mark special order stock received", roles: [SalesAssociate], code: 200, input: [], output: SpecialOrder, side_effects: ["status REQUESTED -> RECEIVED", "increments SpecialOrder.version by 1"] }
  - { method: POST, path: "/special-orders/{id}/fulfill", description: "Hand over the special order", roles: [SalesAssociate], code: 200, input: [], output: SpecialOrder, side_effects: ["status RECEIVED -> FULFILLED", "increments SpecialOrder.version by 1"] }
  - { method: POST, path: "/special-orders/{id}/cancel", description: "Cancel a special order", roles: [SalesAssociate], code: 200, input: [], output: SpecialOrder, side_effects: ["status -> CANCELLED", "increments SpecialOrder.version by 1"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-ID or X-User-Role header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the operation, or Customer acting on a resource they do not own" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, bad enum, negative amount, or end/due not after start" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "Product id does not exist" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Customer id does not exist" }
  - { id: ERR_INVENTORY_ITEM_NOT_FOUND, http: 404, condition: "InventoryItem id does not exist" }
  - { id: ERR_SALES_ORDER_NOT_FOUND, http: 404, condition: "SalesOrder id does not exist" }
  - { id: ERR_REPAIR_TICKET_NOT_FOUND, http: 404, condition: "RepairTicket id does not exist" }
  - { id: ERR_RENTAL_NOT_FOUND, http: 404, condition: "RentalAgreement id does not exist" }
  - { id: ERR_CLASS_SESSION_NOT_FOUND, http: 404, condition: "ClassSession id does not exist" }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "ClassEnrollment id does not exist" }
  - { id: ERR_SUBSCRIPTION_NOT_FOUND, http: 404, condition: "TuneUpSubscription id does not exist" }
  - { id: ERR_SPECIAL_ORDER_NOT_FOUND, http: 404, condition: "SpecialOrder id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a state that permits the requested transition" }
  - { id: ERR_ITEM_NOT_AVAILABLE, http: 409, condition: "InventoryItem is not IN_STOCK when a reserve/loan/consume/scrap requires it" }
  - { id: ERR_ALREADY_RECALLED, http: 409, condition: "Recall issued on a product already RECALLED" }
  - { id: ERR_SESSION_NOT_OPEN, http: 409, condition: "Enrollment attempted on a session not in SCHEDULED status" }
  - { id: ERR_PRODUCT_RECALLED, http: 409, condition: "Sale completion or repair approval on a RECALLED product" }
  - { id: ERR_RENTAL_OVERLAP, http: 409, condition: "New rental interval overlaps an existing ACTIVE rental of the same unit (half-open)" }
  - { id: ERR_SCHEDULE_CONFLICT, http: 409, condition: "Customer's enrollment would conflict (within buffer) with another of their sessions" }
  - { id: ERR_NOT_A_PART, http: 409, condition: "consume-part targeted an InventoryItem whose product category is not PART" }
  - { id: ERR_TUNE_UPS_EXHAUSTED, http: 409, condition: "Redeem attempted when tune_ups_used >= tune_ups_included" }
  - { id: ERR_TRADE_IN_OUT_OF_BAND, http: 409, condition: "Final trade-in appraisal deviates from the estimate by more than TRADE_IN_BAND" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_special_order_version does not match current SpecialOrder.version" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Generic resource-not-found fallback for unmatched routes" }
  - { id: ERR_INVALID_PAGINATION, http: 400, condition: "limit/offset outside allowed bounds (limit 1..100, offset >= 0)" }
  - { id: ERR_INVALID_TRADE_IN, http: 400, condition: "trade_in_condition supplied without trade_in_model or vice versa" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SalesAssociate
    description: "Front-of-house sales; owns sales orders, rentals, special orders, subscriptions, enrollments on behalf of customers"
    identity: "opaque"
    exclusive_operations:
      - "POST /sales-orders and its complete/cancel"
      - "POST /rental-agreements and its return/cancel"
      - "POST /special-orders, PATCH, receive/fulfill/cancel"
      - "POST /tune-up-subscriptions, reinstate"
      - "POST /repair-tickets/{id}/close"
    shared_operations:
      - "POST /customers (with StoreManager)"
      - "POST /repair-tickets (with ServiceTech)"
      - "approve/reject repair, cancel enrollment, cancel subscription, enroll (shared with Customer)"
      - "POST /tune-up-subscriptions/{id}/redeem (with ServiceTech)"
      - "all GET reads"

  - name: ServiceTech
    description: "Repair technician; owns diagnosis, parts, repair completion, tune-up redemption"
    identity: "opaque"
    exclusive_operations:
      - "POST /repair-tickets/{id}/quote"
      - "POST /repair-tickets/{id}/consume-part"
      - "POST /repair-tickets/{id}/complete"
    shared_operations:
      - "POST /repair-tickets (with SalesAssociate)"
      - "POST /tune-up-subscriptions/{id}/redeem (with SalesAssociate)"
      - "all GET reads"

  - name: StoreManager
    description: "Store management; owns catalog, inventory, recalls, class scheduling, credit adjustments, sale reversals, subscription lapse"
    identity: "opaque"
    exclusive_operations:
      - "POST /products, POST /products/{id}/recall"
      - "POST /inventory-items, POST /inventory-items/{id}/scrap"
      - "POST /customers/{id}/store-credit/adjustments"
      - "POST /class-sessions and its complete/cancel"
      - "POST /tune-up-subscriptions/{id}/lapse"
    shared_operations:
      - "POST /customers (with SalesAssociate)"
      - "POST /sales-orders/{id}/cancel (reversal path, with SalesAssociate)"
      - "all GET reads"

  - name: Customer
    description: "The buyer/enrollee/subscriber acting on their own resources"
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "POST /repair-tickets/{id}/approve, POST /repair-tickets/{id}/reject (own ticket)"
      - "POST /class-sessions/{id}/enrollments (own enrollment)"
      - "POST /class-enrollments/{id}/cancel (own enrollment)"
      - "POST /tune-up-subscriptions/{id}/cancel (own subscription)"
      - "all GET reads"

