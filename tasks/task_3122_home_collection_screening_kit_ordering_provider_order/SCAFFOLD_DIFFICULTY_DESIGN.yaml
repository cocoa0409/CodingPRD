              captures: { err: $.data.error_id }
          assert:
            - "O1 process rejected with ERR_STABILIZATION_EXPIRED at exactly returned_at + 72h"
            - "O2 process at returned_at + 71h59m59s succeeded: LabSpecimen.${s2_id}.status == PROCESSING"

      - name: age_boundary_45_and_75_inclusive
        grounds:
          - validations[priority=7]
          - constants.MIN_AGE
          - constants.MAX_AGE
        distinguishing_aspect: |
          Metric: patient age on the eligibility-confirm endpoint (different
          metric and endpoint from the stabilization instance). Bounds are
          inclusive: age exactly 45 and exactly 75 pass; 44 and 76 fail.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Four patients with DOBs yielding ages 44 (1982-09-02), 45 (1981-09-01), 75 (1951-09-01), 76 (1950-08-31) at the order date"
            - "One order per patient, all PENDING_ELIGIBILITY"
          setup_api_calls:
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
