          trigger:
            - { call: "POST /tool-transfers/${tt_id}/complete", payload: { expected_mold_version: "${mold_v_pre}" }, as: PlantAdmin, captures: { err_id: $.data.error_id } }
            - { call: "GET /molds/${mold_id}", payload: {}, as: PlantAdmin, captures: { mold_v_now: $.data.version } }
            - { call: "POST /tool-transfers/${tt_id}/complete", payload: { expected_mold_version: "${mold_v_now}" }, as: PlantAdmin }
          assert:
            - "the stale completion returns status 412 and ${err_id} == ERR_STALE_MOLD_VERSION"
            - "after the rejection ToolTransfer.${tt_id}.status == APPROVED and Mold.${mold_id}.ownership == SHOP_OWNED"
            - "${mold_v_now} > ${mold_v_pre}"
            - "the retry returns 200, ToolTransfer.${tt_id}.status == COMPLETED and Mold.${mold_id}.status == TRANSFERRED"

      - name: multi_level_cascade_chains_run_end_to_end
        claim_type: cascading_side_effects
        grounds: ["state_machines.Mold.SERVICEABLE_to_PM_DUE", "state_machines.PressQualification.QUALIFIED_to_REVOKED"]
        excluded_because:
          difficulty_instance: transitive_cascade / report_pm_threshold_blocks_sibling_job_and_releases_press_minutes
          rationale: "Both declared depth-3 chains are asserted hop by hop by the two transitive_cascade instances."

      - name: two_variants_of_one_formula_diverge_on_identical_inputs
        claim_type: dual_variant_calculation
        grounds: ["calculations.quote_piece_price", "calculations.capacity_commit_settlement"]
        excluded_because:
          difficulty_instance: dual_variant_calc / capacity_commit_strict_vs_goodwill_shortfall
          rationale: "The two dual_variant_calc instances already assert both divergences with literal cent values."

      - name: mold_list_combines_status_filter_ownership_filter_and_pagination
        claim_type: pagination_with_filtering
        grounds: ["endpoints[GET /molds]", "entities.Mold.fields.ownership", "entities.Mold.fields.status", "response_envelope.pagination_fields"]
        distinguishing_aspect: "Filters compose before pagination: with four molds of mixed ownership under one customer, customer_id + ownership CUSTOMER_OWNED + limit 1 reports total_count 2 (the filtered population, not 4) and has_more true."
        test_recipe:
          setup: ["Customer ACME with molds M-S1 and M-S2 SHOP_OWNED and M-C1 and M-C2 CUSTOMER_OWNED; customer BETA with one SHOP_OWNED mold M-B1."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /customers", payload: { name: "Acme Controls", code: "ACME" }, as: PlantAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /customers", payload: { name: "Beta Devices", code: "BETA" }, as: PlantAdmin, captures: { cust2_id: $.data.id } }
            - { call: "POST /molds", payload: { mold_code: "M-S1", customer_id: "${cust_id}", cavity_count: 2, shot_weight_grams: 90, required_min_tonnage: 60, required_max_tonnage: 120, pm_interval_shots: 5000, tooling_cost_cents: 100000, ownership: "SHOP_OWNED" }, as: PlantAdmin }
            - { call: "POST /molds", payload: { mold_code: "M-S2", customer_id: "${cust_id}", cavity_count: 2, shot_weight_grams: 90, required_min_tonnage: 60, required_max_tonnage: 120, pm_interval_shots: 5000, tooling_cost_cents: 100000, ownership: "SHOP_OWNED" }, as: PlantAdmin }
            - { call: "POST /molds", payload: { mold_code: "M-C1", customer_id: "${cust_id}", cavity_count: 2, shot_weight_grams: 90, required_min_tonnage: 60, required_max_tonnage: 120, pm_interval_shots: 5000, tooling_cost_cents: 100000, ownership: "CUSTOMER_OWNED" }, as: PlantAdmin }
            - { call: "POST /molds", payload: { mold_code: "M-C2", customer_id: "${cust_id}", cavity_count: 2, shot_weight_grams: 90, required_min_tonnage: 60, required_max_tonnage: 120, pm_interval_shots: 5000, tooling_cost_cents: 100000, ownership: "CUSTOMER_OWNED" }, as: PlantAdmin }
            - { call: "POST /molds", payload: { mold_code: "M-B1", customer_id: "${cust2_id}", cavity_count: 2, shot_weight_grams: 90, required_min_tonnage: 60, required_max_tonnage: 120, pm_interval_shots: 5000, tooling_cost_cents: 100000, ownership: "SHOP_OWNED" }, as: PlantAdmin }
          trigger:
            - { call: "GET /molds", payload: { customer_id: "${cust_id}", ownership: "CUSTOMER_OWNED", limit: 1, offset: 0 }, as: PlantAdmin }
            - { call: "GET /molds", payload: { customer_id: "${cust_id}", status: "NEW", limit: 100, offset: 0 }, as: PlantAdmin }
            - { call: "GET /molds", payload: { limit: 101, offset: 0 }, as: PlantAdmin }
          assert:
            - "the first list returns total_count 2, has_more true and exactly 1 row, all with ownership CUSTOMER_OWNED and customer_id ${cust_id}"
            - "the second list returns total_count 4 and has_more false"
            - "the third call returns status 400 with error_id ERR_INVALID_REQUEST because limit exceeds the maximum of 100"

  # ==========================================================================
  - section: consistency_model
    instances:

      - name: schedule_response_body_already_reflects_every_side_effect
        claim_type: immediate
        grounds: ["state_machines.ProductionJob.DRAFT_to_SCHEDULED", "calculations.press_capacity_ledger", "entities.ProductionJob.fields.run_status"]
        distinguishing_aspect: "The consistency model is immediate: the 200 body of POST /production-jobs/{id}/schedule already carries run_status SCHEDULED and version 2, and an immediately following GET /presses/{id} already reports committed_minutes_scheduled 480 with no settling delay."
        test_recipe:
          setup: ["Standard approval chain; one DRAFT job for 2026-09-10T08:00Z-16:00Z on P-150."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /customers", payload: { name: "Acme Controls", code: "ACME" }, as: PlantAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /presses", payload: { press_code: "P-150", tonnage: 150, shot_size_grams_max: 400, hourly_rate_cents: 7200 }, as: PlantAdmin, captures: { p150_id: $.data.id } }
            - { call: "POST /molds", payload: { mold_code: "M-1", customer_id: "${cust_id}", cavity_count: 4, shot_weight_grams: 180, required_min_tonnage: 120, required_max_tonnage: 200, pm_interval_shots: 5000, tooling_cost_cents: 2500000, ownership: "SHOP_OWNED" }, as: PlantAdmin, captures: { mold_id: $.data.id } }
            - { call: "POST /press-qualifications", payload: { mold_id: "${mold_id}", press_id: "${p150_id}" }, as: ProcessEngineer, captures: { pq_id: $.data.id } }
            - { call: "POST /press-qualifications/${pq_id}/schedule-run-at-rate", payload: { scheduled_start: "2026-09-02T08:00:00Z", scheduled_end: "2026-09-02T12:00:00Z", target_parts_per_hour: 400 }, as: ProcessEngineer }
            - { call: "POST /press-qualifications/${pq_id}/record-run-at-rate", payload: { actual_parts_per_hour: 380 }, as: QualityEngineer }
            - { call: "POST /quotes", payload: { customer_id: "${cust_id}", mold_id: "${mold_id}", part_weight_grams: 32, cycle_time_sec: 38, cavitation: 4, resin_grade: "PP-H", resin_price_cents_per_kg: 210, annual_volume: 120000 }, as: SalesEngineer, captures: { quote_id: $.data.id } }
            - { call: "POST /quotes/${quote_id}/price", payload: { press_id: "${p150_id}" }, as: SalesEngineer }
            - { call: "POST /quotes/${quote_id}/submit", payload: {}, as: SalesEngineer }
            - { call: "GET /molds/${mold_id}", payload: {}, as: SalesEngineer, captures: { mold_v1: $.data.version } }
            - { call: "POST /quotes/${quote_id}/customer-decision", payload: { decision: "ACCEPT", expected_mold_version: "${mold_v1}" }, as: CustomerRep, as_user_id: "${cust_id}" }
            - { call: "POST /ppap-submissions", payload: { mold_id: "${mold_id}", quote_id: "${quote_id}", level: 3, max_regrind_bp: 2000 }, as: QualityEngineer, as_user_id: "qe-alice", captures: { ppap_id: $.data.id } }
            - { call: "POST /ppap-submissions/${ppap_id}/submit", payload: { fai_dimensional_pass: true, fai_sample_shots: 30 }, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /ppap-submissions/${ppap_id}/internal-review", payload: { decision: "ENDORSE" }, as: QualityEngineer, as_user_id: "qe-bob" }
            - { call: "GET /molds/${mold_id}", payload: {}, as: QualityEngineer, captures: { mold_v2: $.data.version } }
            - { call: "POST /ppap-submissions/${ppap_id}/customer-decision", payload: { decision: "APPROVE", expected_mold_version: "${mold_v2}" }, as: CustomerRep, as_user_id: "${cust_id}" }
            - { call: "POST /production-jobs", payload: { quote_id: "${quote_id}", planned_qty: 20000, scheduled_start: "2026-09-10T08:00:00Z", scheduled_end: "2026-09-10T16:00:00Z", press_id: "${p150_id}" }, as: ProcessEngineer, captures: { job_id: $.data.id } }
            - { call: "GET /presses/${p150_id}", payload: {}, as: ProcessEngineer, captures: { press_v1: $.data.version } }
          trigger:
            - { call: "POST /production-jobs/${job_id}/schedule", payload: { expected_press_version: "${press_v1}" }, as: ProcessEngineer, captures: { returned_status: $.data.run_status, returned_version: $.data.version } }
            - { call: "GET /presses/${p150_id}", payload: {}, as: ProcessEngineer, captures: { press_v2: $.data.version } }
          assert:
            - "${returned_status} == SCHEDULED and ${returned_version} == 2 in the schedule response body itself"
            - "the immediately following GET reports Press.${p150_id}.committed_minutes_scheduled == 480"
            - "${press_v2} == ${press_v1} + 1"
            - "the response envelope carries meta.api_request_id and meta.api_request_timestamp on both calls"
