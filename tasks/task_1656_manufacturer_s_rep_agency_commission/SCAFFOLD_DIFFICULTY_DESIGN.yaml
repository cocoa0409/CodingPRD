          Entity = CommissionStatement, shape = branching cycle: IN_RECONCILIATION
          -> DISPUTED -> IN_RECONCILIATION -> SETTLED. Settle allocates the +25c
          matched-tolerance delta pro-rata (R1 +15, R2 +10), posts
          STATEMENT_PAYMENT -34,815 / -23,210, and zeroes both rep balances.
