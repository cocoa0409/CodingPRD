# ============================================================================
# §1.9 Scaffold Corner Design — Employee Perks & Discount Marketplace
# Breadth probe: references/claim-extraction-guide.md walked section by section
# against SCAFFOLD.yaml §1.1-§1.7. §1.8 is the depth probe; corners it already
# asserts are emitted here as excluded_because stubs with no test_recipe.
# Every grounds ref resolves into SCAFFOLD.yaml §1.1-§1.7; every numeric assert
# was computed by executing the §1.3 formula with its declared constants.
# Logical clock default before any /_clock call: 2026-08-01T00:00:00Z.
# ============================================================================

scaffold_corner_design:

  # ==========================================================================
  - section: entities
    instances:

      - name: merchant_creation_returns_prospect_defaults_and_version_one
        claim_type: creation
        grounds:
          - entities.Merchant.fields.status
          - entities.Merchant.fields.fault_event_count
          - entities.Merchant.fields.fulfillment_failure_score
          - entities.Merchant.fields.accrued_commission_payable_cents
          - entities.Merchant.fields.active_agreement_count
          - endpoints[POST /perks/merchants]
          - response_envelope.success
        distinguishing_aspect: |
          A merchant created with the four declared input fields comes back inside the §1.0
          success envelope with status PROSPECT, version 1 and all four counters at 0 -
          the row is created in the state machine's initial_state and nothing is accrued yet.
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "POST /perks/merchants"
              payload: { legal_name: "Bistro Uno", contact_email: "ops@bistrouno.example", primary_category: "DINING", region_codes: ["CA"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { merchant_id: $.data.id, m_status: $.data.status, m_version: $.data.version, m_faults: $.data.fault_event_count, m_score: $.data.fulfillment_failure_score, m_payable: $.data.accrued_commission_payable_cents, m_agreements: $.data.active_agreement_count }
          assert:
            - "the response carries response_type == object, meta.api_request_id and meta.api_request_timestamp, and data holds the created row"
            - "${m_status} == PROSPECT"
            - "${m_version} == 1"
            - "${m_faults} == 0 and ${m_score} == 0"
            - "${m_payable} == 0 and ${m_agreements} == 0"
            - "Merchant.${merchant_id}.legal_name == Bistro Uno, contact_email == ops@bistrouno.example, primary_category == DINING, region_codes == [CA]"
            - "Merchant.${merchant_id}.suspended_at is null"
            - "Merchant.${merchant_id}.created_at == 2026-08-01T00:00:00Z and updated_at == 2026-08-01T00:00:00Z"

      - name: merchant_retrieval_returns_the_stored_row_unchanged
        claim_type: retrieval
        grounds:
          - endpoints[GET /perks/merchants/{id}]
          - entities.Merchant.fields.primary_category
          - response_envelope.success
        distinguishing_aspect: |
          GET /perks/merchants/{id} returns exactly the row POST created - same id, same
          primary_category, same version 1 - so the read path adds no mutation of its own.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one merchant Bistro Uno created in DINING/CA and never touched again."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/merchants"
              payload: { legal_name: "Bistro Uno", contact_email: "ops@bistrouno.example", primary_category: "DINING", region_codes: ["CA"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { merchant_id: $.data.id }
          trigger:
            - call: "GET /perks/merchants/${merchant_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { read_id: $.data.id, read_category: $.data.primary_category, read_version: $.data.version }
          assert:
            - "${read_id} == ${merchant_id}"
            - "${read_category} == DINING"
            - "${read_version} == 1"
            - "Merchant.${merchant_id}.status == PROSPECT after the read"

      - name: merchant_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /perks/merchants]
          - response_envelope.pagination_fields
          - response_envelope.list_shape
        distinguishing_aspect: |
          With three merchants stored, GET /perks/merchants?limit=2&offset=0 returns exactly
          2 elements with meta.total_count 3 and meta.has_more true, and offset=2 returns the
          single remaining element with has_more false.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; three merchants created in creation order Bistro Uno, Cafe Duo, Deli Tres."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/merchants"
              payload: { legal_name: "Bistro Uno", contact_email: "ops@bistrouno.example", primary_category: "DINING", region_codes: ["CA"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { m1_id: $.data.id }
            - call: "POST /perks/merchants"
              payload: { legal_name: "Cafe Duo", contact_email: "ops@cafeduo.example", primary_category: "DINING", region_codes: ["CA"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { m2_id: $.data.id }
            - call: "POST /perks/merchants"
              payload: { legal_name: "Deli Tres", contact_email: "ops@delitres.example", primary_category: "WELLNESS", region_codes: ["TX"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { m3_id: $.data.id }
          trigger:
            - call: "GET /perks/merchants"
              payload: { limit: 2, offset: 0 }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { page1_first: "$.data[0].id" }
            - call: "GET /perks/merchants"
              payload: { limit: 2, offset: 2 }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { page2_first: "$.data[0].id" }
            - call: "GET /perks/merchants"
              payload: { primary_category: "WELLNESS" }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { filtered_first: "$.data[0].id" }
          assert:
            - "the first call returns response_type == array with 2 elements, meta.limit == 2, meta.offset == 0, meta.total_count == 3, meta.has_more == true"
            - "${page1_first} == ${m1_id} because the default sort is created_at ASC"
            - "the second call returns 1 element with meta.offset == 2, meta.total_count == 3, meta.has_more == false"
            - "${page2_first} == ${m3_id}"
            - "the primary_category filter returns exactly 1 element with meta.total_count == 1 and ${filtered_first} == ${m3_id}"

      - name: absent_ids_return_each_entity_own_not_found_code
        claim_type: not_found
        grounds:
          - validations[priority=20]
          - errors[ERR_MERCHANT_NOT_FOUND]
          - errors[ERR_AGREEMENT_NOT_FOUND]
          - errors[ERR_EMPLOYER_NOT_FOUND]
          - errors[ERR_ELIGIBILITY_FILE_NOT_FOUND]
          - errors[ERR_MEMBERSHIP_NOT_FOUND]
          - errors[ERR_OFFER_NOT_FOUND]
          - errors[ERR_PLACEMENT_SLOT_NOT_FOUND]
          - errors[ERR_REDEMPTION_NOT_FOUND]
          - errors[ERR_DISPUTE_NOT_FOUND]
          - errors[ERR_STATEMENT_NOT_FOUND]
          - errors[ERR_LEDGER_ENTRY_NOT_FOUND]
        distinguishing_aspect: |
          Eleven detail reads against one syntactically valid but absent uuid each return
          404 with the OWN not-found code of the addressed collection - never a shared
          generic ERR_NOT_FOUND and never 500 - proving §1.6 carries one code per entity.
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at 2026-08-01T00:00:00Z; the uuid 00000000-0000-4000-8000-000000000000 names no row in any collection."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "GET /perks/merchants/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { e_merchant: $.data.error_id }
            - call: "GET /perks/agreements/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { e_agreement: $.data.error_id }
            - call: "GET /perks/employers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { e_employer: $.data.error_id }
            - call: "GET /perks/eligibility-files/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { e_file: $.data.error_id }
            - call: "GET /perks/memberships/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { e_membership: $.data.error_id }
            - call: "GET /perks/offers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { e_offer: $.data.error_id }
            - call: "GET /perks/placement-slots/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { e_slot: $.data.error_id }
            - call: "GET /perks/redemptions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { e_redemption: $.data.error_id }
            - call: "GET /perks/disputes/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { e_dispute: $.data.error_id }
            - call: "GET /perks/revenue-share-statements/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { e_statement: $.data.error_id }
            - call: "GET /perks/ledger-entries/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { e_ledger: $.data.error_id }
          assert:
            - "every one of the eleven calls answers HTTP 404 with response_type == error"
            - "${e_merchant} == ERR_MERCHANT_NOT_FOUND"
            - "${e_agreement} == ERR_AGREEMENT_NOT_FOUND"
            - "${e_employer} == ERR_EMPLOYER_NOT_FOUND"
            - "${e_file} == ERR_ELIGIBILITY_FILE_NOT_FOUND"
            - "${e_membership} == ERR_MEMBERSHIP_NOT_FOUND"
            - "${e_offer} == ERR_OFFER_NOT_FOUND"
            - "${e_slot} == ERR_PLACEMENT_SLOT_NOT_FOUND"
            - "${e_redemption} == ERR_REDEMPTION_NOT_FOUND"
            - "${e_dispute} == ERR_DISPUTE_NOT_FOUND"
            - "${e_statement} == ERR_STATEMENT_NOT_FOUND"
            - "${e_ledger} == ERR_LEDGER_ENTRY_NOT_FOUND"

      - name: merchant_creation_missing_required_primary_category_returns_validation_error
        claim_type: required_fields
        grounds:
          - validations[priority=30]
          - errors[ERR_VALIDATION]
          - entities.Merchant.fields.primary_category
          - entities.Merchant.fields.region_codes
        distinguishing_aspect: |
          primary_category has source input and no default, so omitting it returns 422
          ERR_VALIDATION and creates no Merchant row; an empty region_codes array fails the
          same rule through its non-empty constraint rather than through absence.
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "POST /perks/merchants"
              payload: { legal_name: "Bistro Uno", contact_email: "ops@bistrouno.example", region_codes: ["CA"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { e_missing: $.data.error_id }
            - call: "POST /perks/merchants"
              payload: { legal_name: "Bistro Uno", contact_email: "ops@bistrouno.example", primary_category: "DINING", region_codes: [] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { e_empty_regions: $.data.error_id }
            - call: "POST /perks/merchants"
              payload: { legal_name: "Bistro Uno", contact_email: "no-at-sign.example", primary_category: "DINING", region_codes: ["CA"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { e_bad_email: $.data.error_id }
            - call: "GET /perks/merchants"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-001"
          assert:
            - "${e_missing} == ERR_VALIDATION with HTTP 422"
            - "${e_empty_regions} == ERR_VALIDATION with HTTP 422"
            - "${e_bad_email} == ERR_VALIDATION with HTTP 422"
            - "the final list call returns meta.total_count == 0: none of the three refused requests created a Merchant"

      - name: employer_and_agreement_defaults_apply_when_optional_inputs_are_omitted
        claim_type: defaults
        grounds:
          - entities.Employer.fields.revenue_share_enabled
          - entities.Employer.fields.privacy_min_cohort_size
          - entities.Employer.fields.integration_status
          - entities.Employer.fields.storefront_status
          - entities.Employer.fields.program_posture
          - entities.PartnerAgreement.fields.exclusivity_requested
          - calculations.engagement_analytics
        distinguishing_aspect: |
          Omitting revenue_share_enabled and privacy_min_cohort_size yields false and the
          declared DEFAULT_PRIVACY_MIN_COHORT_SIZE of 8 - not null and not the two-employer
          partner floor - while an agreement created without exclusivity_requested defaults
          to false and therefore never needs exclusivity windows to activate.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one merchant Bistro Uno in DINING/CA exists so an agreement can be created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/merchants"
              payload: { legal_name: "Bistro Uno", contact_email: "ops@bistrouno.example", primary_category: "DINING", region_codes: ["CA"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { merchant_id: $.data.id }
          trigger:
            - call: "POST /perks/employers"
              payload: { name: "Northwind Co", region_code: "CA", employee_count_declared: 40 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { employer_id: $.data.id, share_flag: $.data.revenue_share_enabled, cohort: $.data.privacy_min_cohort_size, integration: $.data.integration_status, storefront: $.data.storefront_status, posture: $.data.program_posture, headcount: $.data.eligible_headcount }
            - call: "POST /perks/agreements"
              payload: { merchant_id: "${merchant_id}", category: "DINING", region_code: "CA" }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { agreement_id: $.data.id, excl_flag: $.data.exclusivity_requested, rounds: $.data.round_count, terms_commission: $.data.commission_rate_bps }
          assert:
            - "${share_flag} == false"
            - "${cohort} == 8"
            - "${integration} == NOT_CONFIGURED and ${storefront} == DRAFT and ${posture} == SETUP"
            - "${headcount} == 0 and Employer.${employer_id}.accrued_share_cents == 0 and last_sync_at is null"
            - "${excl_flag} == false"
            - "${rounds} == 0 and ${terms_commission} is null"
            - "PartnerAgreement.${agreement_id}.status == DRAFT and exclusivity_granted == false"

      - name: offer_merchant_id_and_category_are_computed_from_the_agreement_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Offer.fields.merchant_id
          - entities.Offer.fields.category
          - entities.Offer.fields.inventory_reserved
          - entities.Offer.fields.inventory_redeemed
          - entities.Offer.fields.sold_out
          - endpoints[POST /perks/offers]
        distinguishing_aspect: |
          Offer.merchant_id and Offer.category are source computed: they are copied from the
          referenced PartnerAgreement, so client-supplied merchant_id and category values in
          the create payload are ignored and the stored row shows the agreement's own
          merchant and DINING rather than the WELLNESS the caller sent.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; merchant Bistro Uno has an ACTIVE DINING/CA agreement with standing terms commission 1200 bps, placement base 36000 and share 2500 bps."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/merchants"
              payload: { legal_name: "Bistro Uno", contact_email: "ops@bistrouno.example", primary_category: "DINING", region_codes: ["CA"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { merchant_id: $.data.id }
            - call: "POST /perks/merchants"
              payload: { legal_name: "Cafe Duo", contact_email: "ops@cafeduo.example", primary_category: "WELLNESS", region_codes: ["CA"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { other_merchant_id: $.data.id }
            - call: "POST /perks/agreements"
              payload: { merchant_id: "${merchant_id}", category: "DINING", region_code: "CA" }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { agreement_id: $.data.id, agreement_v0: $.data.version }
            - call: "POST /perks/agreements/${agreement_id}/propose"
              payload: { expected_agreement_version: "${agreement_v0}", commission_rate_bps: 1200, placement_fee_base_cents: 36000, employer_revenue_share_bps: 2500 }
              as: PartnerManager
              as_user_id: "pm-001"
            - call: "POST /perks/agreements/${agreement_id}/decide"
              payload: { decision: "ACCEPT" }
              as: Merchant
              as_user_id: "${merchant_id}"
            - call: "POST /perks/agreements/${agreement_id}/activate"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-001"
          trigger:
            - call: "POST /perks/offers"
              payload: { agreement_id: "${agreement_id}", merchant_id: "${other_merchant_id}", category: "WELLNESS", title: "20 percent off dinner", discount_type: "PERCENT", discount_value_bps: 2000, min_spend_cents: 1000, region_codes: ["CA"], window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-01T00:00:00Z" }
              as: Merchant
              as_user_id: "${merchant_id}"
              captures: { offer_id: $.data.id, offer_merchant: $.data.merchant_id, offer_category: $.data.category, reserved: $.data.inventory_reserved, redeemed: $.data.inventory_redeemed, sold: $.data.sold_out, offer_status: $.data.status }
          assert:
            - "${offer_merchant} == ${merchant_id}"
            - "${offer_merchant} != ${other_merchant_id}"
            - "${offer_category} == DINING"
            - "${reserved} == 0 and ${redeemed} == 0 and ${sold} == false"
            - "${offer_status} == DRAFT"
            - "Offer.${offer_id}.per_member_limit == 1 and min_spend_cents == 1000 and inventory_limit is null"

      - name: employer_creation_ignores_client_supplied_id_and_version_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Employer.fields.integration_status
          - entities.Employer.fields.storefront_status
          - endpoints[POST /perks/employers]
          - response_envelope.success
        distinguishing_aspect: |
          id, created_at, updated_at and version are minted by the server: a create payload
          carrying id, version and storefront_status is accepted with those keys ignored, so
          the stored row has version 1, storefront_status DRAFT and an id different from the
          one the caller sent.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "POST /perks/employers"
              payload: { name: "Northwind Co", region_code: "CA", employee_count_declared: 5, id: "11111111-1111-4111-8111-111111111111", version: 77, storefront_status: "PUBLISHED", created_at: "2020-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { employer_id: $.data.id, e_version: $.data.version, e_storefront: $.data.storefront_status, e_created: $.data.created_at }
          assert:
            - "${employer_id} != 11111111-1111-4111-8111-111111111111"
            - "${e_version} == 1"
            - "${e_storefront} == DRAFT"
            - "${e_created} == 2026-08-01T00:00:00Z, the logical clock value, not the 2020 date in the payload"
            - "Employer.${employer_id}.program_posture == SETUP"

      - name: enum_members_and_numeric_ranges_are_constrained_on_create
        claim_type: type_constraints
        grounds:
          - validations[priority=32]
          - validations[priority=30]
          - errors[ERR_INVALID_ENUM_VALUE]
          - errors[ERR_VALIDATION]
          - entities.Merchant.fields.primary_category
          - entities.Employer.fields.employee_count_declared
          - entities.Employer.fields.privacy_min_cohort_size
        distinguishing_aspect: |
          An out-of-set enum member returns ERR_INVALID_ENUM_VALUE while an in-type but
          out-of-range integer returns ERR_VALIDATION: the two 422 codes are not
          interchangeable, and a region_codes element outside {CA,TX,NY,WA,IL} takes the
          enum code even though the field itself is an array.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "POST /perks/merchants"
              payload: { legal_name: "Bistro Uno", contact_email: "ops@bistrouno.example", primary_category: "SPACE_TRAVEL", region_codes: ["CA"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { e_category: $.data.error_id }
            - call: "POST /perks/merchants"
              payload: { legal_name: "Bistro Uno", contact_email: "ops@bistrouno.example", primary_category: "DINING", region_codes: ["ZZ"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { e_region: $.data.error_id }
            - call: "POST /perks/employers"
              payload: { name: "Northwind Co", region_code: "CA", employee_count_declared: 0 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { e_headcount: $.data.error_id }
            - call: "POST /perks/employers"
              payload: { name: "Northwind Co", region_code: "CA", employee_count_declared: 5, privacy_min_cohort_size: 26 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { e_cohort: $.data.error_id }
          assert:
            - "${e_category} == ERR_INVALID_ENUM_VALUE with HTTP 422"
            - "${e_region} == ERR_INVALID_ENUM_VALUE with HTTP 422"
            - "${e_headcount} == ERR_VALIDATION with HTTP 422 because employee_count_declared is outside 1..1000000"
            - "${e_cohort} == ERR_VALIDATION with HTTP 422 because privacy_min_cohort_size is outside 2..25"
            - "GET /perks/merchants returns meta.total_count == 0 and GET /perks/employers returns meta.total_count == 0"

      - name: negotiation_round_is_immutable_with_no_version_and_no_write_endpoint
        claim_type: immutability
        grounds:
          - entities.NegotiationRound
          - entities.NegotiationRound.fields.round_number
          - entities.NegotiationRound.fields.proposer_role
          - endpoints[GET /perks/agreements/{id}/negotiation-rounds]
        distinguishing_aspect: |
          NegotiationRound declares common_fields false: the listed row exposes round_number,
          proposer_role and the three term columns but no version key, and §1.5 declares no
          PATCH or DELETE for negotiation rounds, so a round can only be superseded by
          proposing a new one.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; merchant Bistro Uno with a DRAFT DINING/CA agreement that has received exactly one provider proposal."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/merchants"
              payload: { legal_name: "Bistro Uno", contact_email: "ops@bistrouno.example", primary_category: "DINING", region_codes: ["CA"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { merchant_id: $.data.id }
            - call: "POST /perks/agreements"
              payload: { merchant_id: "${merchant_id}", category: "DINING", region_code: "CA" }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { agreement_id: $.data.id, agreement_v0: $.data.version }
            - call: "POST /perks/agreements/${agreement_id}/propose"
              payload: { expected_agreement_version: "${agreement_v0}", commission_rate_bps: 1200, placement_fee_base_cents: 36000, employer_revenue_share_bps: 2500, note: "opening terms" }
              as: PartnerManager
              as_user_id: "pm-001"
          trigger:
            - call: "GET /perks/agreements/${agreement_id}/negotiation-rounds"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { round_no: "$.data[0].round_number", round_role: "$.data[0].proposer_role", round_commission: "$.data[0].commission_rate_bps" }
          assert:
            - "the list returns meta.total_count == 1"
            - "${round_no} == 1 and ${round_role} == PARTNER_MANAGER and ${round_commission} == 1200"
            - "the returned round object carries no version key and no updated_at key, because NegotiationRound declares common_fields false"
            - "§1.5 declares no PATCH and no DELETE endpoint whose path contains negotiation-rounds, so the round cannot be rewritten"

      - name: eligibility_file_and_membership_rows_belong_only_to_their_parent_employer
        claim_type: parent_relationships
        grounds:
          - entities.EligibilityFile
          - entities.EmployeeMembership
          - endpoints[POST /perks/employers/{id}/eligibility-files]
          - endpoints[GET /perks/employers/{id}/eligibility-files]
          - endpoints[GET /perks/memberships]
          - errors[ERR_EMPLOYER_NOT_FOUND]
        distinguishing_aspect: |
          EligibilityFile and EmployeeMembership both declare parent Employer: a file loaded
          under employer A is invisible in employer B's file list and its membership carries
          employer_id A, while the same load against an absent employer id returns
          ERR_EMPLOYER_NOT_FOUND rather than creating an orphan file.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; two employers exist, Northwind Co and Southgate LLC, and Northwind has loaded and applied a one-record eligibility file."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/employers"
              payload: { name: "Northwind Co", region_code: "CA", employee_count_declared: 1, revenue_share_enabled: true, privacy_min_cohort_size: 3 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { employer_a: $.data.id, employer_a_v0: $.data.version }
            - call: "POST /perks/employers"
              payload: { name: "Southgate LLC", region_code: "CA", employee_count_declared: 1 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { employer_b: $.data.id }
            - call: "POST /perks/employers/${employer_a}/eligibility-files"
              payload: { expected_employer_version: "${employer_a_v0}", effective_from: "2026-08-01T00:00:00Z", checksum: "sha-parent-1", records: [{ external_employee_ref: "E-001", employment_status: "ACTIVE", region_code: "CA", eligibility_valid_from: "2026-07-01T00:00:00Z", eligibility_valid_until: "2027-07-01T00:00:00Z" }] }
              as: EmployerAdmin
              as_user_id: "${employer_a}"
              captures: { file_a: $.data.id, file_employer: $.data.employer_id }
            - call: "POST /perks/eligibility-files/${file_a}/validate"
              payload: {}
              as: EmployerAdmin
              as_user_id: "${employer_a}"
            - call: "POST /perks/eligibility-files/${file_a}/apply"
              payload: {}
              as: EmployerAdmin
              as_user_id: "${employer_a}"
          trigger:
            - call: "GET /perks/employers/${employer_b}/eligibility-files"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "GET /perks/memberships"
              payload: { employer_id: "${employer_a}" }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { m_employer: "$.data[0].employer_id", m_source: "$.data[0].source_file_id" }
            - call: "GET /perks/memberships"
              payload: { employer_id: "${employer_b}" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/employers/00000000-0000-4000-8000-000000000000/eligibility-files"
              payload: { expected_employer_version: "${employer_a_v0}", effective_from: "2026-08-01T00:00:00Z", checksum: "sha-parent-2", records: [{ external_employee_ref: "E-009", employment_status: "ACTIVE", region_code: "CA", eligibility_valid_from: "2026-07-01T00:00:00Z", eligibility_valid_until: "2027-07-01T00:00:00Z" }] }
              as: EmployerAdmin
              as_user_id: "${employer_a}"
              captures: { e_absent_parent: $.data.error_id }
          assert:
            - "${file_employer} == ${employer_a}"
            - "employer B's file list returns meta.total_count == 0"
            - "${m_employer} == ${employer_a} and ${m_source} == ${file_a}"
            - "the membership list for employer B returns meta.total_count == 0"
            - "${e_absent_parent} == ERR_EMPLOYER_NOT_FOUND with HTTP 404"

      - name: foreign_key_references_are_validated_before_any_business_rule
        claim_type: flat
        grounds:
          - validations[priority=20]
          - errors[ERR_MERCHANT_NOT_FOUND]
          - errors[ERR_AGREEMENT_NOT_FOUND]
          - errors[ERR_EMPLOYER_NOT_FOUND]
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          The topology is flat, so cross-references travel in request bodies: an absent
          merchant_id on POST /perks/agreements, an absent agreement_id on POST /perks/offers
          and an absent employer_id on POST /perks/revenue-share-statements each return that
          entity's own 404 at priority 20, before duplicate-lane, region or window checks run.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; exactly one merchant Bistro Uno exists in DINING/CA and no agreement, offer, employer or statement exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/merchants"
              payload: { legal_name: "Bistro Uno", contact_email: "ops@bistrouno.example", primary_category: "DINING", region_codes: ["CA"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { merchant_id: $.data.id }
          trigger:
            - call: "POST /perks/agreements"
              payload: { merchant_id: "00000000-0000-4000-8000-000000000000", category: "DINING", region_code: "CA" }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { e_merchant_fk: $.data.error_id }
            - call: "POST /perks/offers"
              payload: { agreement_id: "00000000-0000-4000-8000-000000000000", title: "20 percent off dinner", discount_type: "PERCENT", discount_value_bps: 2000, region_codes: ["CA"], window_start: "2026-12-01T00:00:00Z", window_end: "2026-08-01T00:00:00Z" }
              as: Merchant
              as_user_id: "${merchant_id}"
              captures: { e_agreement_fk: $.data.error_id }
            - call: "POST /perks/revenue-share-statements"
              payload: { employer_id: "00000000-0000-4000-8000-000000000000", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", basis: "ACCRUAL" }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { e_employer_fk: $.data.error_id }
          assert:
            - "${e_merchant_fk} == ERR_MERCHANT_NOT_FOUND with HTTP 404"
            - "${e_agreement_fk} == ERR_AGREEMENT_NOT_FOUND with HTTP 404, not ERR_INVALID_WINDOW, even though window_end precedes window_start in the same payload"
            - "${e_employer_fk} == ERR_EMPLOYER_NOT_FOUND with HTTP 404"
            - "no PartnerAgreement, Offer or RevenueShareStatement row exists afterwards"

  # ==========================================================================
  - section: state_machines
    instances:

      - name: eligibility_file_starts_in_received_with_computed_record_counts
        claim_type: initial_state
        grounds:
          - state_machines.EligibilityFile.status
          - state_machines.Employer.integration_status.NOT_CONFIGURED_to_FILE_RECEIVED
          - entities.EligibilityFile.fields.record_count
          - entities.EligibilityFile.fields.invalid_record_count
          - entities.EligibilityFile.fields.valid_record_count
          - calculations.eligibility_file_validation_ratio
        distinguishing_aspect: |
          A freshly loaded file is created in EligibilityFile's declared initial_state RECEIVED
          with record_count 3, invalid_record_count 1 and valid_record_count 2 already
          computed at load time, and it drives Employer.integration_status to FILE_RECEIVED
          while leaving created_membership_count at 0 because nothing is applied yet.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; employer Northwind Co exists with integration_status NOT_CONFIGURED."
            - "The batch holds three records, one of which is invalid because its region_code ZZ is outside {CA,TX,NY,WA,IL}."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/employers"
              payload: { name: "Northwind Co", region_code: "CA", employee_count_declared: 3, revenue_share_enabled: true, privacy_min_cohort_size: 3 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { employer_id: $.data.id, employer_v0: $.data.version }
          trigger:
            - call: "POST /perks/employers/${employer_id}/eligibility-files"
              payload: { expected_employer_version: "${employer_v0}", effective_from: "2026-08-01T00:00:00Z", checksum: "sha-initial-1", records: [{ external_employee_ref: "E-001", employment_status: "ACTIVE", region_code: "CA", eligibility_valid_from: "2026-07-01T00:00:00Z", eligibility_valid_until: "2027-07-01T00:00:00Z" }, { external_employee_ref: "E-002", employment_status: "LEAVE", region_code: "CA", eligibility_valid_from: "2026-07-01T00:00:00Z", eligibility_valid_until: "2027-07-01T00:00:00Z" }, { external_employee_ref: "E-003", employment_status: "ACTIVE", region_code: "ZZ", eligibility_valid_from: "2026-07-01T00:00:00Z", eligibility_valid_until: "2027-07-01T00:00:00Z" }] }
              as: EmployerAdmin
              as_user_id: "${employer_id}"
              captures: { file_id: $.data.id, f_status: $.data.status, f_total: $.data.record_count, f_invalid: $.data.invalid_record_count, f_valid: $.data.valid_record_count, f_created: $.data.created_membership_count }
            - call: "GET /perks/employers/${employer_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { integration: $.data.integration_status, posture: $.data.program_posture, headcount: $.data.eligible_headcount }
          assert:
            - "${f_status} == RECEIVED"
            - "${f_total} == 3, ${f_invalid} == 1 and ${f_valid} == 2"
            - "${f_created} == 0 and EligibilityFile.${file_id}.applied_at is null"
            - "${integration} == FILE_RECEIVED"
            - "${posture} == SETUP and ${headcount} == 0"

      - name: first_proposal_moves_agreement_to_provider_proposed_and_merchant_to_in_negotiation
        claim_type: valid_transition
        grounds:
          - state_machines.PartnerAgreement.status.DRAFT_to_PROVIDER_PROPOSED
          - state_machines.Merchant.status.PROSPECT_to_IN_NEGOTIATION
          - entities.PartnerAgreement.fields.round_count
          - entities.PartnerAgreement.fields.commission_rate_bps
          - entities.NegotiationRound.fields.proposer_role
        distinguishing_aspect: |
          One propose call moves PartnerAgreement DRAFT -> PROVIDER_PROPOSED, creates round 1
          with proposer_role PARTNER_MANAGER, copies that round's three terms onto the
          agreement's standing terms, bumps PartnerAgreement.version from 1 to 2 and drags the
          Merchant from PROSPECT to IN_NEGOTIATION in the same request.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; merchant Bistro Uno is PROSPECT and owns one DRAFT DINING/CA agreement at version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/merchants"
              payload: { legal_name: "Bistro Uno", contact_email: "ops@bistrouno.example", primary_category: "DINING", region_codes: ["CA"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { merchant_id: $.data.id }
            - call: "POST /perks/agreements"
              payload: { merchant_id: "${merchant_id}", category: "DINING", region_code: "CA" }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { agreement_id: $.data.id, agreement_v0: $.data.version }
          trigger:
            - call: "POST /perks/agreements/${agreement_id}/propose"
              payload: { expected_agreement_version: "${agreement_v0}", commission_rate_bps: 1200, placement_fee_base_cents: 36000, employer_revenue_share_bps: 2500, note: "opening terms" }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { a_status: $.data.status, a_rounds: $.data.round_count, a_commission: $.data.commission_rate_bps, a_base: $.data.placement_fee_base_cents, a_share: $.data.employer_revenue_share_bps, a_version: $.data.version }
            - call: "GET /perks/merchants/${merchant_id}"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { m_status: $.data.status, m_agreements: $.data.active_agreement_count }
            - call: "GET /perks/agreements/${agreement_id}/negotiation-rounds"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { r_number: "$.data[0].round_number", r_role: "$.data[0].proposer_role" }
          assert:
            - "${a_status} == PROVIDER_PROPOSED"
            - "${a_rounds} == 1"
            - "${a_commission} == 1200, ${a_base} == 36000 and ${a_share} == 2500"
            - "${a_version} == 2, exactly one more than ${agreement_v0}"
            - "${m_status} == IN_NEGOTIATION and ${m_agreements} == 0"
            - "${r_number} == 1 and ${r_role} == PARTNER_MANAGER"
            - "PartnerAgreement.${agreement_id}.accepted_by_role is null and activated_at is null"

      - name: exclusivity_activation_requires_negotiated_windows_on_the_standing_round
        claim_type: precondition_enforcement
        grounds:
          - state_machines.PartnerAgreement.status.ACCEPTED_to_ACTIVE
          - validations[priority=94]
          - errors[ERR_EXCLUSIVITY_TERMS_MISSING]
          - entities.PartnerAgreement.fields.exclusivity_requested
          - entities.PartnerAgreement.fields.exclusivity_window_start
          - entities.PartnerAgreement.fields.exclusivity_granted
        distinguishing_aspect: |
          Activation of an agreement whose exclusivity_requested is true but whose standing
          round carries null exclusivity windows returns 422 ERR_EXCLUSIVITY_TERMS_MISSING and
          leaves the agreement ACCEPTED with exclusivity_granted false, while an otherwise
          identical agreement whose round did supply both windows activates and flips
          exclusivity_granted to true.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; merchant Bistro Uno holds an ACCEPTED DINING/CA agreement created with exclusivity_requested true whose single round supplied no exclusivity windows."
            - "Merchant Cafe Duo holds an ACCEPTED DINING/CA agreement created with exclusivity_requested true whose round supplied the window 2026-09-01 to 2026-10-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/merchants"
              payload: { legal_name: "Bistro Uno", contact_email: "ops@bistrouno.example", primary_category: "DINING", region_codes: ["CA"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { merchant_a: $.data.id }
            - call: "POST /perks/merchants"
              payload: { legal_name: "Cafe Duo", contact_email: "ops@cafeduo.example", primary_category: "DINING", region_codes: ["CA"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { merchant_b: $.data.id }
            - call: "POST /perks/agreements"
              payload: { merchant_id: "${merchant_a}", category: "DINING", region_code: "CA", exclusivity_requested: true }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { agreement_a: $.data.id, agreement_a_v0: $.data.version }
            - call: "POST /perks/agreements/${agreement_a}/propose"
              payload: { expected_agreement_version: "${agreement_a_v0}", commission_rate_bps: 1200, placement_fee_base_cents: 36000, employer_revenue_share_bps: 2500 }
              as: PartnerManager
              as_user_id: "pm-001"
            - call: "POST /perks/agreements/${agreement_a}/decide"
              payload: { decision: "ACCEPT" }
              as: Merchant
              as_user_id: "${merchant_a}"
            - call: "POST /perks/agreements"
              payload: { merchant_id: "${merchant_b}", category: "DINING", region_code: "CA", exclusivity_requested: true }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { agreement_b: $.data.id, agreement_b_v0: $.data.version }
            - call: "POST /perks/agreements/${agreement_b}/propose"
              payload: { expected_agreement_version: "${agreement_b_v0}", commission_rate_bps: 1200, placement_fee_base_cents: 36000, employer_revenue_share_bps: 2500, exclusivity_window_start: "2026-09-01T00:00:00Z", exclusivity_window_end: "2026-10-01T00:00:00Z" }
              as: PartnerManager
              as_user_id: "pm-001"
            - call: "POST /perks/agreements/${agreement_b}/decide"
              payload: { decision: "ACCEPT" }
              as: Merchant
              as_user_id: "${merchant_b}"
          trigger:
            - call: "POST /perks/agreements/${agreement_a}/activate"
              payload: {}
              as: PartnerManager
