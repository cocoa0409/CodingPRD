        grounds:
          - validations[priority=31]
          - errors[ERR_TEAM_SESSION_OVERLAP]
          - entities.ManualTally.fields.session_start_at
          - entities.TallyTeam.fields.status
        distinguishing_aspect: |
          Resource: the TallyTeam's counting time. Interval semantics are half-open [session_start_at,
          session_end_at), so a session starting exactly when the previous one ends is accepted while a session
          starting one hour before that end is refused.
        test_recipe:
          setup:
            - "Election ST-01 contest C1 canvassed with six 1000-ballot batches; audit A1 RISK_LIMITING alpha 0.05 seeded 0459231087 drew B-003, B-004, B-005."
            - "All three drawn batches are CHECKED_OUT against SEAL-003, SEAL-004 and SEAL-005, so custody never blocks a tally."
            - "Bipartisan team T-1 already holds a live DRAFT tally of B-003 for 2026-11-05T09:00:00Z - 2026-11-05T11:00:00Z."
            - "The two trigger sessions are booked on different physical batches, so the batch reseal-buffer rule cannot fire and only the team's own calendar is at issue."
