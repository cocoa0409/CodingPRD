              captures: { comm_version: $.data.version }
            - call: "POST /floodplain/higher-standards"
              payload: { community_id: "${comm_id}", activity_code: "A430_FREEBOARD", documentation_cycle_year: 2026, claimed_points: 100, expected_community_version: "${comm_version}" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { std_id: $.data.id }
            - call: "POST /floodplain/higher-standards/${std_id}/submit"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/crs-cycles"
              payload: { community_id: "${comm_id}", cycle_year: 2026, cycle_start_date: "2026-01-01T00:00:00Z", cycle_end_date: "2026-12-31T00:00:00Z", due_at: "2026-09-30T00:00:00Z" }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { cycle_id: $.data.id }
            - call: "POST /floodplain/crs-cycles/${cycle_id}/submit"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
          trigger:
            - call: "POST /floodplain/crs-cycles/${cycle_id}/submit"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_CYCLE_NOT_OPEN"
            - "CrsCycle.${cycle_id}.status == SUBMITTED"
            - "CrsCycle.${cycle_id}.total_claimed_points == 100"
            - "CrsCycle.${cycle_id}.provisional_class == 10"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: cumulative_window_lower_bound_is_inclusive_to_the_day
        grounds:
          - calculations.structure_improvement_aggregates
          - entities.Community.fields.cumulative_period_years
          - entities.ImprovementRecord.fields.event_date
        distinguishing_aspect: |
          With the anchor at 2026-03-01 and cumulative_period_years 10 the window start is
          exactly 2016-03-01: the 30000.00 record dated 2016-03-01 is summed while the
          30000.00 record dated 2016-02-28 is not, so cumulative_counted_cost_usd is
          75000.00 (37.50 percent) instead of 105000.00 (52.50 percent).
        test_recipe:
          setup:
            - "Community with cumulative_period_years 10; one RESIDENTIAL structure with market_value_usd 200000.00."
            - "Counted records appended out of chronological order: 30000.00 on 2016-03-01, then 45000.00 on 2026-03-01 (which becomes the anchor)."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0121", mapped_area_code: "RLA-1", owner_name: "P Owner", owner_email: "p@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/structures"
              payload: { property_id: "${prop_id}", structure_use: "RESIDENTIAL", pre_firm: true, construction_year: 1955, market_value_usd: 200000.00, highest_adjacent_grade_ft: 10.0 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_id: $.data.id }
            - call: "POST /floodplain/improvement-records"
              payload: { structure_id: "${struct_id}", record_type: "IMPROVEMENT", event_date: "2016-03-01T00:00:00Z", cost_usd: 30000.00 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { rec_in_id: $.data.id }
            - call: "POST /floodplain/improvement-records"
              payload: { structure_id: "${struct_id}", record_type: "IMPROVEMENT", event_date: "2026-03-01T00:00:00Z", cost_usd: 45000.00 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { rec_anchor_id: $.data.id }
          trigger:
            - call: "POST /floodplain/improvement-records"
              payload: { structure_id: "${struct_id}", record_type: "IMPROVEMENT", event_date: "2016-02-28T00:00:00Z", cost_usd: 30000.00 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { rec_out_id: $.data.id }
          assert:
            - "ImprovementRecord.${rec_out_id}.counted_in_cumulative == true"
            - "Structure.${struct_id}.anchor_record_id == ${rec_anchor_id}"
            - "Structure.${struct_id}.cumulative_counted_cost_usd == 75000.00"
            - "Structure.${struct_id}.cumulative_improvement_pct == 37.50"
            - "Structure.${struct_id}.single_event_improvement_pct == 22.50"
            - "GET /floodplain/structures/${struct_id}/improvement-summary returns window_start_date 2016-03-01T00:00:00Z, window_end_date 2026-03-01T00:00:00Z and counted_record_count 2"
            - "GET /floodplain/determination-cases?structure_id=${struct_id} returns total_count == 0"

      - name: counted_cost_threshold_includes_exactly_five_hundred_excludes_499_99
        grounds:
          - calculations.structure_improvement_aggregates
          - entities.ImprovementRecord.fields.counted_in_cumulative
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          MIN_COUNTED_COST_USD is inclusive at the cent: a 500.00 record sets
          counted_in_cumulative true and becomes the anchor, while a later 499.99 record sets
          it false and leaves the anchor and the 25.00 percent ratio untouched.
        test_recipe:
          setup:
            - "One RESIDENTIAL structure with market_value_usd 2000.00 (an accessory cabin appraisal)."
            - "One ImprovementRecord of exactly 500.00 dated 2026-05-01."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0131", mapped_area_code: "RLA-1", owner_name: "Q Owner", owner_email: "q@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/structures"
              payload: { property_id: "${prop_id}", structure_use: "ACCESSORY", pre_firm: true, construction_year: 1970, market_value_usd: 2000.00, highest_adjacent_grade_ft: 10.0 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_id: $.data.id }
            - call: "POST /floodplain/improvement-records"
              payload: { structure_id: "${struct_id}", record_type: "IMPROVEMENT", event_date: "2026-05-01T00:00:00Z", cost_usd: 500.00 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { rec_at_id: $.data.id }
          trigger:
            - call: "POST /floodplain/improvement-records"
              payload: { structure_id: "${struct_id}", record_type: "IMPROVEMENT", event_date: "2026-06-01T00:00:00Z", cost_usd: 499.99 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { rec_below_id: $.data.id }
          assert:
            - "ImprovementRecord.${rec_at_id}.counted_in_cumulative == true"
            - "ImprovementRecord.${rec_below_id}.counted_in_cumulative == false"
            - "Structure.${struct_id}.anchor_record_id == ${rec_at_id}"
            - "Structure.${struct_id}.cumulative_counted_cost_usd == 500.00"
            - "Structure.${struct_id}.cumulative_improvement_pct == 25.00"
            - "Structure.${struct_id}.single_event_improvement_pct == 25.00"

      - name: crs_class_boundary_exactly_five_hundred_points_yields_class_nine
        grounds:
          - calculations.crs_class_determination
          - calculations.higher_standard_credit
          - entities.CrsCycle.fields.resulting_class
        distinguishing_aspect: |
          CRS_POINTS_PER_CLASS is an inclusive divisor: freeboard_ft 5.0 caps A430_FREEBOARD at
          floor(100 * 5.0) = 500 and exactly 500 verified points yield class 9, whereas
          freeboard_ft 4.99 would cap at 499 and leave the class at 10.
        test_recipe:
          setup:
            - "Community with freeboard_ft 5.0 and no violations, so compliance_posture is GOOD_STANDING."
            - "A HigherStandard for A430_FREEBOARD claiming exactly 500 points, submitted, then CrsCycle 2026 submitted (prior_class 10, provisional_class 9), the standard verified, and the verification visit recorded."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 5.0, cumulative_period_years: 10 }
              as: StateNfipCoordinator
