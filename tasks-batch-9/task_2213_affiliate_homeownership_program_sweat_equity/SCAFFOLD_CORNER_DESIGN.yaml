          setup:
            - "Canonical program (pool 5000000). One household verified at 3000000 cents and SELECTED with composite 91.0; no education enrollment and no credited hours, so partnership_readiness stays NOT_READY and the approval will NOT auto-advance to CLEARED_TO_CLOSE. One site appraised at 15000000 advanced to READY_TO_BUILD. officer-1 creates and structures the application; officer-2 approves it, satisfying segregation of duties."
