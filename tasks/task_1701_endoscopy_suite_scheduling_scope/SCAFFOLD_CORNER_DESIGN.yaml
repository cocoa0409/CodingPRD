        claim_type: immediate
        grounds: [complexity_profile, "endpoints[PATCH /endoscopy/bookings/{id}]"]
        distinguishing_aspect: "Immediate consistency: the POST /bookings 201 response already contains the computed window fields (procedure_minutes 40, scheduled_end, room_block_end) and version 1; the PATCH 200 response contains the new notes and version 2 without any re-fetch."
        test_recipe:
          setup: ["patient, provider, COLONO type, room"]
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "MRN-ICM", full_name: "Pat Icm", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr Icm", specialty: "GASTROENTEROLOGY" }, as: UnitAdmin, captures: { dr1: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "COLONO", display_name: "Colonoscopy", base_duration_minutes: 40, prep_protocol: "SPLIT_DOSE", colonoscopy_family: true, adr_relevant: true, required_scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { t_col: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "R-ICM", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${r1}", scheduled_start: "2026-08-03T09:00:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { b1: $.data.id, c_pm: $.data.procedure_minutes, c_se: $.data.scheduled_end, c_rbe: $.data.room_block_end, c_v: $.data.version } }
            - { call: "PATCH /endoscopy/bookings/${b1}", payload: { expected_booking_version: "${c_v}", notes: "visible now" }, as: SchedulingCoordinator, captures: { p_notes: $.data.notes, p_v: $.data.version } }
          assert:
            - "Create response itself: procedure_minutes == 40, scheduled_end == 2026-08-03T09:40:00Z, room_block_end == 2026-08-03T09:55:00Z, version == 1"
            - "PATCH response itself: notes == 'visible now', version == 2 — no GET needed to observe the mutation"

  - section: state_machines
    instances:
      - name: prep_assessment_requires_in_progress_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ProcedureBookingPrep, "errors[ERR_BOOKING_NOT_IN_PROGRESS]"]
        distinguishing_aspect: "record-prep-assessment on a booking still SCHEDULED (prep confirmed but never started) is rejected 409 ERR_BOOKING_NOT_IN_PROGRESS — the prep axis is gated by the booking axis."
        test_recipe:
          setup: ["booking SCHEDULED with prep confirmed"]
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "MRN-NIP", full_name: "Pat Nip", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr Nip", specialty: "GASTROENTEROLOGY" }, as: UnitAdmin, captures: { dr1: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "COLONO", display_name: "Colonoscopy", base_duration_minutes: 40, prep_protocol: "SPLIT_DOSE", colonoscopy_family: true, adr_relevant: true, required_scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { t_col: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "R-NIP", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { r1: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${r1}", scheduled_start: "2026-08-03T09:00:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { b1: $.data.id } }
            - { call: "POST /endoscopy/bookings/${b1}/confirm-prep", payload: {}, as: SchedulingCoordinator }
          trigger:
            - { call: "POST /endoscopy/bookings/${b1}/record-prep-assessment", payload: { bbps_left: 2, bbps_right: 2, bbps_transverse: 2 }, as: Endoscopist, as_user_id: "${dr1}", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_BOOKING_NOT_IN_PROGRESS (409); prep_status stays PREP_CONFIRMED"]
      - name: release_without_open_quarantine_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Scope.QUARANTINED_to_AVAILABLE, "errors[ERR_NO_OPEN_QUARANTINE]"]
        distinguishing_aspect: "release-quarantine on an AVAILABLE scope that has no open QuarantineCase passes OCC (fresh version) and is then rejected 409 ERR_NO_OPEN_QUARANTINE."
        test_recipe:
          setup: ["fresh scope S (AVAILABLE, version 1)"]
          setup_api_calls:
            - { call: "POST /endoscopy/scopes", payload: { serial_number: "SC-NOQ", scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { s1: $.data.id } }
            - { call: "GET /endoscopy/scopes/${s1}", payload: {}, as: UnitAdmin, captures: { sv: $.data.version } }
          trigger:
            - { call: "POST /endoscopy/scopes/${s1}/release-quarantine", payload: { expected_scope_version: "${sv}" }, as: InfectionControlNurse, as_user_id: "nurse-1", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_NO_OPEN_QUARANTINE (409); scope stays AVAILABLE"]
