              as_user_id: "csr-1"
            - call: "POST /investigations/${inv_id}/determine"
              payload: { leak_determination: "CUSTOMER_SIDE_LEAK" }
              as: CustomerServiceRep
              as_user_id: "csr-1"
              captures: { inv_v: $.data.version }
            - call: "POST /leak-adjustments"
              payload: { investigation_id: "${inv_id}", bill_id: "${bill_p4_id}", leak_type: "SERVICE_LINE", expected_investigation_version: "${inv_v}" }
              as: CustomerServiceRep
              as_user_id: "csr-1"
              captures: { adj_id: $.data.id }
            - call: "POST /leak-adjustments/${adj_id}/submit"
              as: CustomerServiceRep
              as_user_id: "csr-1"
            - call: "GET /service-accounts/${acct_a_id}"
              as: CustomerServiceRep
              captures: { acct_v_before: $.data.version }
          trigger:
            - call: "POST /payment-arrangements"
              payload: { account_id: "${acct_a_id}", bill_id: "${bill_p4_id}", total_amount_cents: 44939, down_payment_cents: 9000, installment_count: 12, expected_account_version: "${acct_v_before}" }
              as: CustomerServiceRep
              captures: { arr_before_id: $.data.id }
            - call: "POST /leak-adjustments/${adj_id}/approve"
              as: BillingSupervisor
              as_user_id: "sup-1"
            - call: "GET /service-accounts/${acct_a_id}"
              as: CustomerServiceRep
              captures: { acct_v_after: $.data.version }
            - call: "POST /payment-arrangements"
              payload: { account_id: "${acct_a_id}", bill_id: "${bill_p4_id}", total_amount_cents: 44939, down_payment_cents: 9000, installment_count: 12, expected_account_version: "${acct_v_after}" }
              as: CustomerServiceRep
            - call: "POST /payment-arrangements"
              payload: { account_id: "${acct_a_id}", bill_id: "${bill_p4_id}", total_amount_cents: 17976, down_payment_cents: 4000, installment_count: 6, expected_account_version: "${acct_v_after}" }
              as: CustomerServiceRep
              captures: { arr_after_id: $.data.id }
          assert:
            - "DEPENDENCY STATE 1 — adjustment PENDING_APPROVAL: Bill.${bill_p4_id}.adjusted_total_cents == 44939, and the 44939 arrangement is accepted, PaymentArrangement.${arr_before_id}.status == PROPOSED with installment_cents 2994 and final_installment_cents 3005"
            - "LeakAdjustment.${adj_id}.status == POSTED and net_credit_cents == 26963 after the approve"
            - "DEPENDENCY STATE 2 — adjustment POSTED: Bill.${bill_p4_id}.adjusted_total_cents == 17976 and billing_status == ADJUSTED"
            - "The identical 44939 arrangement request now returns HTTP 422 with error_id ERR_ARRANGEMENT_AMOUNT_MISMATCH, even though it was accepted moments earlier and nothing in its own payload changed"
            - "PaymentArrangement.${arr_before_id}.status == CANCELLED — it was superseded when a newer arrangement was created for the account, and the refused request created nothing"
            - "The 17976 arrangement is accepted: PaymentArrangement.${arr_after_id}.total_amount_cents == 17976, installment_cents == 2329, final_installment_cents == 2331"
            - "PaymentArrangement.${arr_after_id}.installment_cents * 5 + final_installment_cents == 13976, the financed amount after the 4000 down payment"
            - "down_payment_cents 4000 clears the minimum round_half_up(17976 * 2000 / 10000) == 3595"
            - "ServiceAccount.${acct_a_id}.balance_cents == 33606 and credit_status == PAST_DUE — proposing arrangements moved no money"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      # -------- resource: BillingPeriod calendar; semantics CLOSED-CLOSED, day granularity --------
      - name: resource_overlap_billing_calendar_closed_closed_shared_endpoint_date_conflicts
        grounds:
          - validations[ERR_BILLING_PERIOD_OVERLAP]
          - entities.BillingPeriod.fields.start_date
          - entities.BillingPeriod.fields.end_date
          - endpoints[POST /billing-periods]
        distinguishing_aspect: |
          RESOURCE: the utility's billing calendar, held by BillingPeriod rows. INTERVAL SEMANTICS:
          CLOSED-CLOSED [start_date, end_date] at day granularity, so sharing a single endpoint
          date already counts as an intersection. A candidate 2025-06-30..2025-07-15 conflicts with
          2025-06-01..2025-06-30 on exactly one shared day, while 2025-07-01..2025-07-31 is
          accepted because it begins the day after. Containment and straddling candidates are
          rejected too, so the check cannot be passing by comparing only start dates.
        test_recipe:
          setup:
            - "The clock is 2026-08-01T00:00:00Z and one BillingPeriod 2025-06 spanning 2025-06-01..2025-06-30 (SUMMER) already exists."
            - "No other period exists, so every rejection below is attributable to the single existing interval."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /billing-periods"
              payload: { period_code: "2025-06", start_date: "2025-06-01", end_date: "2025-06-30", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /billing-periods"
              payload: { period_code: "2025-06B", start_date: "2025-06-30", end_date: "2025-07-15", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
            - call: "POST /billing-periods"
              payload: { period_code: "2025-06C", start_date: "2025-05-15", end_date: "2025-06-01", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
            - call: "POST /billing-periods"
              payload: { period_code: "2025-06D", start_date: "2025-06-10", end_date: "2025-06-20", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
            - call: "POST /billing-periods"
              payload: { period_code: "2025-07", start_date: "2025-07-01", end_date: "2025-07-31", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2025-05", start_date: "2025-05-01", end_date: "2025-05-31", season: "WINTER", rebilling_deadline_date: "2026-11-30" }
              as: SystemAdmin
              captures: { p0_id: $.data.id }
          assert:
            - "SHARED END DATE: the 2025-06-30..2025-07-15 candidate returns HTTP 409 with error_id ERR_BILLING_PERIOD_OVERLAP"
            - "SHARED START DATE: the 2025-05-15..2025-06-01 candidate returns HTTP 409 with error_id ERR_BILLING_PERIOD_OVERLAP"
            - "FULLY CONTAINED: the 2025-06-10..2025-06-20 candidate returns HTTP 409 with error_id ERR_BILLING_PERIOD_OVERLAP"
            - "TOUCHING WITHOUT SHARING A DAY, forward: 2025-07-01..2025-07-31 is accepted and BillingPeriod.${p2_id}.status == OPEN"
            - "TOUCHING WITHOUT SHARING A DAY, backward: 2025-05-01..2025-05-31 is accepted and BillingPeriod.${p0_id}.status == OPEN"
            - "GET /billing-periods returns total_count 3 — exactly the three accepted rows, the three refusals created nothing"
            - "BillingPeriod.${p1_id}.start_date == 2025-06-01 and end_date == 2025-06-30, unchanged by the refused attempts"

      # -------- resource: Meter test bench; semantics HALF-OPEN plus a trailing buffer --------
      - name: resource_overlap_meter_test_window_half_open_touching_allowed_plus_quarantine_buffer
        grounds:
          - validations[ERR_METER_TEST_WINDOW_CONFLICT]
          - validations[ERR_METER_TEST_QUARANTINE]
          - state_machines.MeterTestRequest
          - entities.Meter.fields.last_test_completed_at
          - endpoints[POST /meter-test-requests/{id}/schedule-field-test]
        distinguishing_aspect: |
          RESOURCE: a physical Meter, reserved for field testing — a different resource from the
          billing calendar. INTERVAL SEMANTICS: HALF-OPEN [window_start, window_end) at instant
          granularity, the OPPOSITE convention to the closed-closed calendar, so two windows that
          touch at 12:00Z do NOT conflict while a window straddling 10:00Z-14:00Z does. The meter
          additionally carries a trailing METER_TEST_QUARANTINE_HOURS buffer that is not an
          interval reservation at all: after a test completes at 09:00Z, a window opening
          2026-08-04T09:00Z is refused ERR_METER_TEST_QUARANTINE even though it overlaps nothing,
          and 2026-08-05T09:00Z is accepted at exactly 48 hours.
        test_recipe:
          setup:
            - "The full ACC-1001 fixture is in place with four ISSUED bills, and an investigation on the 2026-07 bill is in EVIDENCE_REQUESTED."
            - "Five UTILITY-requested FIELD MeterTestRequests with deposit_cents 0 exist on the master meter, all in REQUESTED."
            - "Meter.last_test_completed_at is null at the start, so the quarantine rule is dormant for the first three scheduling calls."
