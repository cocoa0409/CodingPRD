  - rule_id: cross_entity_state_dependency
    instances:
      - name: permit_issue_gated_on_accepted_estimate_state
        grounds:
          - validations[priority=11]
          - errors[ERR_NO_ACCEPTED_ESTIMATE]
          - state_machines.ReclamationCostEstimate.SUBMITTED_to_ACCEPTED
          - state_machines.Permit.status.APPLICATION_SUBMITTED_to_ISSUED
          - calculations.bond_required_amount
        distinguishing_aspect: |
          Entity pair Permit x ReclamationCostEstimate: the permit's own state is
          legal for issuance and nothing about its own fields changes, yet
          POST /mining/permits/{id}/decide with ISSUE fails while the estimate
          sits in SUBMITTED and succeeds only after the estimate reaches
          ACCEPTED — the gate lives entirely in the other entity's state.
        test_recipe:
          setup:
            - "An APPLICATION_SUBMITTED permit for 120 acres."
            - "One ReclamationCostEstimate for that permit at direct_cost_per_acre 6000.00, still in status SUBMITTED (never accepted)."
          setup_api_calls:
            - call: "POST /mining/operators"
              payload: { legal_name: "Cedar Bluff Minerals", tangible_net_worth: 18000000.00, fixed_assets_in_state: 9000000.00, total_liabilities: 6000000.00, net_income_prior_year: 900000.00, elected_financial_test: "NET_WORTH_TEST" }
