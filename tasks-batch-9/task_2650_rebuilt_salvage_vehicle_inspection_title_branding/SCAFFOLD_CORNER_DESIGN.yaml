          assert:
            - "every call in the chain returns 200 or 201; no call returns 401 or 403"
            - "PartsDocument.${doc_id}.status == VERIFIED and verified_by_inspector_id == ${insp_id}"
            - "TitleRecord.${title_id}.brand_code == SALVAGE"
            - "FraudReferral.${ref_id}.status == INVESTIGATING and origin == MANUAL and opened_by_user_id == ${insp_id} and investigator_user_id == fraud-01"
            - "Vehicle.${veh_id}.fraud_hold == UNDER_REFERRAL"
            - "Rebuilder.${rb_id}.open_referral_count == 1 (the referral names an application)"

      - name: every_role_outside_the_declared_list_is_forbidden
        claim_type: role_permission_negative
        grounds:
          - validations[priority=20]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - roles.HearingOfficer
        distinguishing_aspect: "Six writes are attempted by a role that is neither in the endpoint's §1.5 list nor an owner of the operation, and each returns ERR_ROLE_NOT_PERMITTED (403) before any path id is resolved, so unknown ids in the paths never surface as 404s."
        test_recipe:
          setup: ["no fixtures; every path id below is the unknown literal 00000000-0000-0000-0000-000000009999"]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/vehicles"
              payload: { vin: "1HGCM82633A007332", model_year: 2019, make: "Honda", model: "Accord", body_class: "SEDAN", registered_state_code: "NV" }
              as: HearingOfficer
              as_user_id: "hear-01"
              captures: { e1: $.data.error_id }
            - call: "POST /v1/damage-reports"
              payload: { vehicle_id: "00000000-0000-0000-0000-000000009999", insurer_name: "Cascade Mutual", claim_number: "CM-93032", basis_code: "GROSS_ESTIMATE", acv_cents: 400000, repair_estimate_cents: 320000, damage_type: "COLLISION", odometer_reading_miles: 0, report_effective_at: "2026-07-20T00:00:00Z", total_loss_declared: true }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { e2: $.data.error_id }
            - call: "POST /v1/applications/00000000-0000-0000-0000-000000009999/submit"
              payload: { attestation_signed: true }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { e3: $.data.error_id }
            - call: "POST /v1/inspections/00000000-0000-0000-0000-000000009999/start"
              payload: { start_note: "not my role" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { e4: $.data.error_id }
            - call: "POST /v1/appeals/00000000-0000-0000-0000-000000009999/decide"
              payload: { decision: "GRANTED", decision_note: "not my role" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { e5: $.data.error_id }
            - call: "POST /v1/fraud-referrals/00000000-0000-0000-0000-000000009999/resolve"
              payload: { outcome: "SUBSTANTIATED", resolution_note: "not my role" }
              as: HearingOfficer
              as_user_id: "hear-01"
              captures: { e6: $.data.error_id }
          assert:
            - "all six responses have status 403 and error_id == ERR_ROLE_NOT_PERMITTED"
            - "none of the six returns a 404, proving priority 20 precedes priority 30"
            - "no Vehicle, InsurerDamageReport, Appeal or FraudReferral row was created or modified"

      - name: fraud_investigator_cannot_open_the_referral_it_would_investigate
        claim_type: role_permission_negative
        grounds:
          - roles.FraudInvestigator
          - roles.Inspector
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "Opening a referral is a shared_operation of Inspector and StateTitleClerk only: the FraudInvestigator who owns investigate and resolve cannot originate the case, so the referral pipeline always starts with a different role than the one that closes it."
        test_recipe:
          setup: ["one registered vehicle with no referral against it"]
          setup_api_calls:
            - call: "POST /v1/vehicles"
              payload: { vin: "1HGCM82633A007333", model_year: 2019, make: "Honda", model: "Accord", body_class: "SEDAN", registered_state_code: "NV" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { veh_id: $.data.id }
          trigger:
            - call: "POST /v1/fraud-referrals"
              payload: { vehicle_id: "${veh_id}", referral_type: "ODOMETER", evidence_summary: "self-originated case" }
              as: FraudInvestigator
              as_user_id: "fraud-01"
              captures: { e1: $.data.error_id }
          assert:
            - "response status is 403 and error_id == ERR_ROLE_NOT_PERMITTED"
            - "GET /v1/fraud-referrals?vehicle_id=${veh_id} returns 0 rows"
            - "Vehicle.${veh_id}.fraud_hold == NONE"

      - name: both_inspector_and_clerk_may_open_a_fraud_referral
        claim_type: shared_operation
        grounds:
          - roles.Inspector
          - roles.StateTitleClerk
          - state_machines.FraudReferral
        distinguishing_aspect: "POST /v1/fraud-referrals is the only write declared as a shared_operation for two roles, and the duplicate guard is keyed on (vehicle_id, referral_type) rather than on the opener, so a clerk-opened ODOMETER case and an inspector-opened IDENTITY_TAMPERING case coexist on the same vehicle with different opened_by_user_id values."
        test_recipe:
          setup: ["one registered vehicle and one commissioned inspector"]
          setup_api_calls:
            - call: "POST /v1/vehicles"
              payload: { vin: "1HGCM82633A007334", model_year: 2019, make: "Honda", model: "Accord", body_class: "SEDAN", registered_state_code: "NV" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { veh_id: $.data.id }
            - call: "POST /v1/inspectors"
              payload: { full_name: "Dana Ruiz", badge_number: "INS-9334", credential_expires_at: "2027-01-01T00:00:00Z", certifications: ["STRUCTURAL", "VIN"], home_state_code: "NV" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /v1/fraud-referrals"
              payload: { vehicle_id: "${veh_id}", referral_type: "ODOMETER", evidence_summary: "title history shows a lower reading in 2025" }
              as: StateTitleClerk
