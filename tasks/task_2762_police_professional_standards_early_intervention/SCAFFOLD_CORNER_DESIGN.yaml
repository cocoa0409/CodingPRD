              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { inv_ca_id: $.data.id, inv_ca_v: $.data.version }
            - call: "POST /complaints"
              payload: { intake_channel: "SUPERVISOR", narrative: "File B: reports not filed.", incident_datetime: "2026-07-16T20:00:00Z", alleged_injury: false, reported_allegation_types: ["NEGLECT_OF_DUTY"], subject_unit_id: "${patrol_unit_id}", complainant_name: "Sergeant Doyle", complainant_contact: "doyle@dept.gov", reporting_supervisor_officer_id: "${sup_id}" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { cb_id: $.data.id }
            - call: "POST /complaints/${cb_id}/allegations"
              payload: { subject_officer_id: "${subj_id}", allegation_type: "NEGLECT_OF_DUTY", narrative: "File B allegation.", offense_class: "C" }
