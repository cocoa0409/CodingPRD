# =============================================================================
# Task 1135: Community College Contract Training — seed tables
# =============================================================================

scenario: |
  1135. Community College Contract Training (community college workforce division): employer needs assessment & customized curriculum, quote & training agreement with delivery schedule, state training-grant application & reimbursement, instructor sourcing & credential match, on-site vs campus delivery logistics, participant roster/attendance & completion credential, invoicing by cohort & grant offset, outcome reporting & follow-on sales

domain_name: community-college-contract-training
api_prefix: /ct

# =============================================================================
# Complexity Profile (§0)
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation        # grant fund pool: reserve/commit/reimburse/release
  secondary_archetype: compliance_audit      # credential matching + segregation of duties
  complexity_layers:
    - cascading_side_effects                 # agreement cancel -> cohort -> session -> assignment -> instructor hours
    - dual_variant_calculation               # PER_PARTICIPANT vs FLAT_COHORT; provisional vs final grant award
    - rate_threshold_triggers                # attendance 80.00% boundary; enrollment floor; grant caps
    - optimistic_concurrency                 # OCC on TrainingAgreement.version and Cohort.version
  entity_topology: hybrid                    # tree under Employer/Agreement/Cohort + flat FK refs (Instructor, Venue, GrantProgram)
  state_machine_shape: cyclic                # QUOTED<->NEGOTIATING loop; GrantApplication RETURNED->SUBMITTED; Employer ACTIVE<->DORMANT; plus parallel dims on Cohort/Agreement
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - many_to_many                           # InstructorAssignment junction (Session x Instructor)
  role_model: segregation_of_duties          # proposer of an instructor assignment cannot confirm it; grant officer disjoint from coordinator pipeline
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Employer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Employer legal name" }
      - { name: industry_code, type: string, source: input, description: "NAICS-style industry code" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: status, type: enum, source: system, description: "PROSPECT | ACTIVE | DORMANT; PROSPECT at creation, ACTIVE on first agreement SIGNED, DORMANT via clock sweep" }
      - { name: lifetime_billed_cents, type: integer, source: computed, description: "Sum of net_due_cents over all PAID invoices of this employer's cohorts", default: 0 }
      - { name: follow_on_pipeline_cents, type: integer, source: computed, description: "Sum of follow_on_opportunity_cents over this employer's ACCEPTED outcome reports", default: 0 }

  - name: NeedsAssessment
    parent: Employer
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: system, description: "FK -> Employer.id" }
      - { name: title, type: string, source: input, description: "Assessment title" }
      - { name: skill_gaps, type: array, source: input, description: "List of skill-gap strings" }
      - { name: target_roles, type: array, source: input, description: "List of target job role strings" }
      - { name: curriculum_modules, type: array, source: input, description: "Customized curriculum: list of { code, hours, required_credential_codes[] }" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REVISION_REQUESTED" }
      - { name: revision_round, type: integer, source: system, description: "Number of completed revision cycles", default: 0 }
      - { name: approved_at, type: datetime, source: system, description: "Timestamp of latest approval" }

  - name: TrainingAgreement
    parent: Employer
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: system, description: "FK -> Employer.id" }
      - { name: needs_assessment_id, type: string, source: input, description: "FK -> NeedsAssessment.id; must reference an assessment of the same employer (approval is enforced at quote time, version currency at sign time)" }
      - { name: assessment_version_pinned, type: integer, source: system, description: "NeedsAssessment.version captured at agreement creation; signing requires it to still equal the assessment's current version" }
      - { name: pricing_model, type: enum, source: input, description: "PER_PARTICIPANT | FLAT_COHORT" }
      - { name: delivery_mode, type: enum, source: input, description: "ON_SITE | ON_CAMPUS" }
      - { name: est_participant_count, type: integer, source: input, description: "Estimated total trainees across cohorts" }
      - { name: est_delivery_hours, type: number, source: input, description: "Estimated total contact hours" }
      - { name: target_start_date, type: datetime, source: input, description: "First planned session date; drives rush uplift" }
      - { name: max_cohorts, type: integer, source: input, description: "Maximum number of cohorts allowed under this agreement" }
      - { name: quoted_total_cents, type: integer, source: computed, description: "Result of quote_pricing for the current round; 0 until first quote" }
      - { name: quote_issued_at, type: datetime, source: system, description: "When the current quote was issued" }
      - { name: quote_expires_at, type: datetime, source: computed, description: "= quote_issued_at + 30 days" }
      - { name: negotiation_round, type: integer, source: system, description: "Increments on every revise transition", default: 0 }
      - { name: contract_status, type: enum, source: system, description: "DRAFT | QUOTED | NEGOTIATING | SIGNED | IN_DELIVERY | COMPLETED | CANCELLED" }
      - { name: billing_status, type: enum, source: system, description: "UNBILLED | PARTIALLY_BILLED | SETTLED (parallel dimension)" }
      - { name: signed_at, type: datetime, source: system, description: "Signature timestamp" }

  - name: GrantProgram
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique program code" }
      - { name: name, type: string, source: input, description: "Program name" }
      - { name: appropriation_cents, type: integer, source: input, description: "Total state appropriation for the fiscal year" }
      - { name: max_share_pct, type: number, source: input, description: "Max fraction of eligible training cost the grant covers (e.g. 0.5)" }
      - { name: cap_per_trainee_cents, type: integer, source: input, description: "Per-trainee award ceiling" }
      - { name: application_window_end, type: datetime, source: input, description: "Last instant a SUBMIT transition is accepted" }
      - { name: claim_deadline_days, type: integer, source: input, description: "Days after approval within which reimbursement must be claimed" }
      - { name: available_cents, type: integer, source: computed, description: "Unencumbered funds; = appropriation - reserved - committed - reimbursed" }
      - { name: reserved_cents, type: integer, source: computed, description: "Sum over APPROVED applications of reserved_cents" }
      - { name: committed_cents, type: integer, source: computed, description: "Sum over CLAIMED applications of committed_cents" }
      - { name: reimbursed_cents, type: integer, source: computed, description: "Sum over PAID applications of reimbursed_cents" }
      - { name: status, type: enum, source: system, description: "OPEN | SUSPENDED | CLOSED" }

  - name: GrantApplication
    parent: Cohort
    common_fields: true
    fields:
      - { name: cohort_id, type: string, source: system, description: "FK -> Cohort.id" }
      - { name: program_id, type: string, source: input, description: "FK -> GrantProgram.id" }
      - { name: requested_cents, type: integer, source: input, description: "Amount requested by the college" }
      - { name: provisional_award_cents, type: integer, source: computed, description: "Award computed at approval from quoted/estimated inputs" }
      - { name: final_award_cents, type: integer, source: computed, description: "Award recomputed at claim from actual completers and FINAL invoice gross" }
      - { name: reserved_cents, type: integer, source: system, description: "Funds currently reserved on the program by this application" }
      - { name: committed_cents, type: integer, source: system, description: "Funds committed at claim" }
      - { name: reimbursed_cents, type: integer, source: system, description: "Funds disbursed at mark_paid" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | UNDER_REVIEW | RETURNED | APPROVED | DENIED | CLAIMED | PAID | EXPIRED | WITHDRAWN" }
      - { name: submitted_at, type: datetime, source: system, description: "Latest submission timestamp" }
      - { name: decided_at, type: datetime, source: system, description: "Approval/denial timestamp" }
      - { name: claim_by, type: datetime, source: computed, description: "= decided_at + program.claim_deadline_days, set at approval" }
      - { name: claimed_at, type: datetime, source: system, description: "Claim timestamp" }

  - name: Instructor
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Instructor name" }
      - { name: credentials, type: array, source: input, description: "List of { code, expires_on } credential records" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Bill rate per contact hour" }
      - { name: committed_hours, type: number, source: computed, description: "Sum of hours of PLANNED sessions on which this instructor holds a CONFIRMED assignment", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE", default: "ACTIVE" }

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Venue name" }
      - { name: kind, type: enum, source: input, description: "CAMPUS_LAB | EMPLOYER_SITE" }
      - { name: capacity, type: integer, source: input, description: "Seat capacity (enforced for CAMPUS_LAB)" }
      - { name: hourly_cost_cents, type: integer, source: input, description: "Internal facility cost per hour (quoted for ON_CAMPUS delivery)" }
      - { name: turnover_buffer_minutes, type: integer, source: system, description: "Required gap between consecutive bookings", default: 30 }

  - name: Cohort
    parent: TrainingAgreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> TrainingAgreement.id" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; primary delivery venue" }
      - { name: delivery_mode, type: enum, source: input, description: "ON_SITE | ON_CAMPUS; must equal agreement.delivery_mode" }
      - { name: min_enrollment, type: integer, source: input, description: "Minimum enrolled participants required to launch" }
      - { name: start_date, type: datetime, source: input, description: "Cohort start date" }
      - { name: end_date, type: datetime, source: input, description: "Cohort end date" }
      - { name: enrolled_count, type: integer, source: computed, description: "Count of participants with completion_status == ENROLLED", default: 0 }
      - { name: completer_count, type: integer, source: computed, description: "Count of participants with completion_status == COMPLETED", default: 0 }
      - { name: delivery_status, type: enum, source: system, description: "SCHEDULED | LAUNCHED | IN_PROGRESS | DELIVERED | CREDENTIALED | CANCELLED" }
      - { name: billing_status, type: enum, source: system, description: "UNBILLED | INVOICED | PAID (parallel dimension)" }

  - name: Session
    parent: Cohort
    common_fields: true
    fields:
      - { name: cohort_id, type: string, source: system, description: "FK -> Cohort.id" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; venue kind must match cohort delivery_mode" }
      - { name: start_at, type: datetime, source: input, description: "Session start (UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Session end (UTC); must be after start_at" }
      - { name: hours, type: number, source: computed, description: "= (end_at - start_at) in hours" }
      - { name: status, type: enum, source: system, description: "PLANNED | HELD | CANCELLED" }
      - { name: attendance_closed, type: boolean, source: system, description: "True once close_attendance succeeded", default: false }

  - name: InstructorAssignment
    parent: Session
    common_fields: true
    fields:
      - { name: session_id, type: string, source: system, description: "FK -> Session.id" }
      - { name: instructor_id, type: string, source: input, description: "FK -> Instructor.id" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of the proposing WorkforceCoordinator" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the confirming CredentialOfficer" }
      - { name: match_score, type: integer, source: computed, description: "credential_match_score result (0-100) computed at confirm time" }
      - { name: status, type: enum, source: system, description: "PROPOSED | CONFIRMED | RELEASED | COMPLETED" }

  - name: Participant
    parent: Cohort
    common_fields: true
    fields:
      - { name: cohort_id, type: string, source: system, description: "FK -> Cohort.id" }
      - { name: external_employee_ref, type: string, source: input, description: "Employer-side employee id; unique per cohort" }
      - { name: full_name, type: string, source: input, description: "Participant name" }
      - { name: attended_hours, type: number, source: computed, description: "Sum of attended_hours recorded across HELD sessions", default: 0 }
      - { name: attendance_pct, type: number, source: computed, description: "attendance_completion result, 2 decimal places", default: 0 }
      - { name: completion_status, type: enum, source: system, description: "ENROLLED | COMPLETED | DROPPED | NO_SHOW" }
      - { name: credential_code, type: string, source: system, description: "Issued at cohort credentialing for COMPLETED participants; format CTC-<cohort start yyyymmdd>-<external_employee_ref>" }

  - name: Invoice
    parent: Cohort
    common_fields: true
    fields:
      - { name: cohort_id, type: string, source: system, description: "FK -> Cohort.id" }
      - { name: agreement_id, type: string, source: system, description: "FK -> TrainingAgreement.id (denormalized from cohort)" }
      - { name: variant, type: enum, source: input, description: "PROVISIONAL | FINAL" }
      - { name: lines, type: array, source: computed, description: "Per-session lines: { session_id, instruction_cents, materials_cents, line_cents }" }
      - { name: gross_cents, type: integer, source: computed, description: "Sum of per-line rounded line_cents (invoice_gross)" }
      - { name: grant_offset_cents, type: integer, source: computed, description: "invoice_grant_offset result; 0 when no APPROVED/CLAIMED/PAID application covers the cohort" }
      - { name: net_due_cents, type: integer, source: computed, description: "= gross_cents - grant_offset_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PAID | VOID" }

  - name: OutcomeReport
    parent: TrainingAgreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> TrainingAgreement.id" }
      - { name: completers_employed_90d, type: integer, source: input, description: "Completers verified employed 90 days after credentialing" }
      - { name: satisfaction_avg, type: number, source: input, description: "Average employer satisfaction score 0-5" }
      - { name: follow_on_opportunity_cents, type: integer, source: input, description: "Estimated value of follow-on training pipeline identified" }
      - { name: placement_pct, type: number, source: computed, description: "placement_rate result, 2 decimal places" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACCEPTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Employer
    initial_state: PROSPECT
    terminal_states: []
    transitions:
      - from: PROSPECT
        to: ACTIVE
        trigger: "POST /ct/training-agreements/{id}/sign (first signature on any agreement of this employer)"
        actor: EmployerContact
        preconditions: []
        side_effects: ["Employer.status -> ACTIVE"]

      - from: ACTIVE
        to: DORMANT
        trigger: "system (clock sweep on POST /ct/_clock/set_current_utc)"
        actor: system
        preconditions:
          - "No cohort of any agreement of this employer reached CREDENTIALED within the trailing 365 days"
          - "No agreement of this employer is in contract_status IN {QUOTED, NEGOTIATING, SIGNED, IN_DELIVERY}"
        side_effects: ["Employer.status -> DORMANT"]

      - from: DORMANT
        to: ACTIVE
        trigger: "POST /ct/training-agreements/{id}/sign"
        actor: EmployerContact
        preconditions: []
        side_effects: ["Employer.status -> ACTIVE"]

  - entity: NeedsAssessment
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /ct/needs-assessments/{id}/submit"
        actor: WorkforceCoordinator
        preconditions: ["curriculum_modules non-empty (ERR_INVALID_REQUEST)"]
        side_effects: []

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /ct/needs-assessments/{id}/approve"
        actor: CollegeAdmin
        preconditions: []
        side_effects: ["approved_at = now"]

      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /ct/needs-assessments/{id}/request_revision"
        actor: CollegeAdmin
        preconditions: []
        side_effects: ["revision_round += 1"]

      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /ct/needs-assessments/{id}/submit (revision cycle)"
        actor: WorkforceCoordinator
        preconditions: ["curriculum_modules non-empty (ERR_INVALID_REQUEST)"]
        side_effects: []

  - entity: TrainingAgreement
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /ct/training-agreements/{id}/quote"
        actor: WorkforceCoordinator
        preconditions:
          - "needs_assessment_id references an APPROVED assessment (ERR_ASSESSMENT_NOT_APPROVED)"
        side_effects:
          - "quoted_total_cents = quote_pricing(agreement)"
          - "quote_issued_at = now; quote_expires_at = now + 30 days"

      - from: QUOTED
        to: NEGOTIATING
        trigger: "POST /ct/training-agreements/{id}/negotiate"
        actor: EmployerContact
        preconditions:
          - "now <= quote_expires_at (ERR_QUOTE_EXPIRED)"
        side_effects: []

      - from: NEGOTIATING
        to: QUOTED
        trigger: "POST /ct/training-agreements/{id}/revise (cyclic revision round; OCC-guarded)"
        actor: WorkforceCoordinator
        preconditions:
          - "expected_agreement_version == agreement.version (ERR_STALE_VERSION)"
        side_effects:
          - "negotiation_round += 1"
          - "quoted_total_cents recomputed via quote_pricing with revised inputs"
          - "quote_issued_at = now; quote_expires_at = now + 30 days"
          - "increments TrainingAgreement.version by 1"

      - from: QUOTED
        to: SIGNED
        trigger: "POST /ct/training-agreements/{id}/sign"
        actor: EmployerContact
        preconditions:
          - "X-User-ID == agreement.employer_id (ERR_FORBIDDEN_FOR_ROLE)"
          - "now <= quote_expires_at (ERR_QUOTE_EXPIRED)"
          - "assessment_version_pinned == needs_assessment.version and assessment.status == APPROVED (ERR_STALE_ASSESSMENT)"
        side_effects:
          - "signed_at = now"
          - "Employer.status PROSPECT|DORMANT -> ACTIVE"

      - from: SIGNED
        to: IN_DELIVERY
        trigger: "system (automatic when the first child cohort transitions SCHEDULED -> LAUNCHED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_DELIVERY
        to: COMPLETED
        trigger: "system (automatic on POST /ct/outcome-reports/{id}/accept when every cohort of this agreement is in a terminal delivery_status {CREDENTIALED, CANCELLED})"
        actor: system
        preconditions:
          - "All cohorts of this agreement have delivery_status IN {CREDENTIALED, CANCELLED}"
          - "An OutcomeReport of this agreement just reached ACCEPTED"
        side_effects: ["billing_status -> SETTLED when every non-CANCELLED cohort has billing_status == PAID"]

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /ct/training-agreements/{id}/cancel"
        actor: WorkforceCoordinator | CollegeAdmin
        preconditions: []
        side_effects: []

      - from: QUOTED
        to: CANCELLED
        trigger: "POST /ct/training-agreements/{id}/cancel"
        actor: WorkforceCoordinator | CollegeAdmin
        preconditions: []
        side_effects: []

      - from: NEGOTIATING
        to: CANCELLED
        trigger: "POST /ct/training-agreements/{id}/cancel"
        actor: WorkforceCoordinator | CollegeAdmin
        preconditions: []
        side_effects: []

      - from: SIGNED
        to: CANCELLED
        trigger: "POST /ct/training-agreements/{id}/cancel"
        actor: WorkforceCoordinator | CollegeAdmin
        preconditions: []
        side_effects:
          - "Every child cohort with delivery_status IN {SCHEDULED, LAUNCHED, IN_PROGRESS} transitions to CANCELLED (link 1)"
          - "Each such cohort cancellation transitions its PLANNED sessions to CANCELLED (link 2)"
          - "Each such session cancellation transitions its InstructorAssignments in {PROPOSED, CONFIRMED} to RELEASED and decrements Instructor.committed_hours by the session hours for CONFIRMED ones (link 3)"
          - "Each such cohort cancellation transitions its GrantApplications in {DRAFT, SUBMITTED, UNDER_REVIEW, RETURNED} to WITHDRAWN; APPROVED applications release reserved_cents to the program and transition to WITHDRAWN (link 2')"
          - "Each such cohort cancellation with billing_status == INVOICED voids its open DRAFT/ISSUED Invoice (link 2'')"

      - from: IN_DELIVERY
        to: CANCELLED
        trigger: "POST /ct/training-agreements/{id}/cancel"
        actor: WorkforceCoordinator | CollegeAdmin
        preconditions: []
        side_effects:
          - "Every child cohort with delivery_status IN {SCHEDULED, LAUNCHED, IN_PROGRESS} transitions to CANCELLED (link 1); CREDENTIALED cohorts are terminal and untouched"
          - "Each such cohort cancellation transitions its PLANNED sessions to CANCELLED (link 2); HELD sessions are untouched"
          - "Each such session cancellation transitions its InstructorAssignments in {PROPOSED, CONFIRMED} to RELEASED and decrements Instructor.committed_hours by the session hours for CONFIRMED ones (link 3)"
          - "Each such cohort cancellation transitions its GrantApplications in {DRAFT, SUBMITTED, UNDER_REVIEW, RETURNED} to WITHDRAWN; APPROVED applications release reserved_cents to the program and transition to WITHDRAWN (link 2')"
          - "Each such cohort cancellation with billing_status == INVOICED voids its open DRAFT/ISSUED Invoice (link 2'')"
    note: "billing_status dimension: UNBILLED -> PARTIALLY_BILLED when the first cohort invoice is ISSUED; -> SETTLED when every non-CANCELLED cohort has billing_status == PAID. Evolves independently of contract_status."

  - entity: GrantProgram
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: SUSPENDED
        trigger: "POST /ct/grant-programs/{id}/suspend"
        actor: CollegeAdmin
        preconditions: []
        side_effects: []

      - from: SUSPENDED
        to: OPEN
        trigger: "POST /ct/grant-programs/{id}/reopen (cyclic)"
        actor: CollegeAdmin
        preconditions: []
        side_effects: []

      - from: OPEN
        to: CLOSED
        trigger: "POST /ct/grant-programs/{id}/close"
        actor: CollegeAdmin
        preconditions: ["reserved_cents == 0 and committed_cents == 0 (ERR_INVALID_STATE)"]
        side_effects: []

      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /ct/grant-programs/{id}/close"
        actor: CollegeAdmin
        preconditions: ["reserved_cents == 0 and committed_cents == 0 (ERR_INVALID_STATE)"]
        side_effects: []

  - entity: GrantApplication
    initial_state: DRAFT
    terminal_states: [DENIED, PAID, EXPIRED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /ct/grant-applications/{id}/submit"
        actor: WorkforceCoordinator
        preconditions:
          - "program.status == OPEN (ERR_GRANT_PROGRAM_NOT_OPEN)"
          - "now <= program.application_window_end (ERR_GRANT_WINDOW_CLOSED)"
        side_effects: ["submitted_at = now"]

      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /ct/grant-applications/{id}/submit (cyclic resubmission)"
        actor: WorkforceCoordinator
        preconditions:
          - "program.status == OPEN (ERR_GRANT_PROGRAM_NOT_OPEN)"
          - "now <= program.application_window_end (ERR_GRANT_WINDOW_CLOSED)"
        side_effects: ["submitted_at = now"]

      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /ct/grant-applications/{id}/start_review"
        actor: GrantOfficer
        preconditions: []
        side_effects: []

      - from: UNDER_REVIEW
        to: RETURNED
        trigger: "POST /ct/grant-applications/{id}/return"
        actor: GrantOfficer
        preconditions: []
        side_effects: []

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /ct/grant-applications/{id}/approve"
        actor: GrantOfficer
        preconditions:
          - "cohort.delivery_status NOT IN {CANCELLED} (ERR_INVALID_STATE)"
          - "provisional_award_cents <= program.available_cents (ERR_GRANT_CAPACITY_EXCEEDED)"
        side_effects:
          - "provisional_award_cents computed via grant_award PROVISIONAL variant"
          - "reserved_cents = provisional_award_cents"
          - "GrantProgram.reserved_cents += provisional_award_cents; GrantProgram.available_cents -= provisional_award_cents"
          - "decided_at = now; claim_by = now + program.claim_deadline_days"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /ct/grant-applications/{id}/deny"
        actor: GrantOfficer
        preconditions: []
        side_effects: ["decided_at = now"]

      - from: APPROVED
        to: CLAIMED
        trigger: "POST /ct/grant-applications/{id}/claim"
        actor: WorkforceCoordinator
        preconditions:
          - "cohort.delivery_status == CREDENTIALED (ERR_COHORT_NOT_CREDENTIALED)"
          - "now <= claim_by (ERR_GRANT_WINDOW_CLOSED)"
        side_effects:
          - "final_award_cents computed via grant_award FINAL variant"
          - "GrantProgram.reserved_cents -= reserved_cents; GrantProgram.available_cents += (reserved_cents - final_award_cents)"
          - "committed_cents = final_award_cents; reserved_cents = 0"
          - "GrantProgram.committed_cents += final_award_cents"
          - "claimed_at = now"

      - from: CLAIMED
        to: PAID
        trigger: "POST /ct/grant-applications/{id}/mark_paid"
        actor: GrantOfficer
        preconditions: []
        side_effects:
          - "GrantProgram.committed_cents -= committed_cents; GrantProgram.reimbursed_cents += committed_cents"
          - "reimbursed_cents = committed_cents; committed_cents = 0"

      - from: APPROVED
        to: EXPIRED
        trigger: "system (clock sweep on POST /ct/_clock/set_current_utc when now > claim_by)"
        actor: system
        preconditions: []
        side_effects:
          - "GrantProgram.reserved_cents -= reserved_cents; GrantProgram.available_cents += reserved_cents; reserved_cents = 0"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "system (cascade from cohort cancellation)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "system (cascade from cohort cancellation)"
        actor: system
        preconditions: []
        side_effects: []

      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "system (cascade from cohort cancellation)"
        actor: system
        preconditions: []
        side_effects: []

      - from: RETURNED
        to: WITHDRAWN
        trigger: "system (cascade from cohort cancellation)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Cohort
    initial_state: SCHEDULED
    terminal_states: [CREDENTIALED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: LAUNCHED
        trigger: "POST /ct/cohorts/{id}/launch"
        actor: WorkforceCoordinator
        preconditions:
          - "agreement.contract_status IN {SIGNED, IN_DELIVERY} (ERR_AGREEMENT_NOT_SIGNED)"
          - "enrolled_count >= min_enrollment (ERR_BELOW_MIN_ENROLLMENT)"
          - "every PLANNED session has at least one CONFIRMED InstructorAssignment (ERR_CREDENTIAL_MISMATCH)"
          - "for CAMPUS_LAB venues: venue.capacity >= enrolled_count (ERR_VENUE_CAPACITY_EXCEEDED)"
        side_effects:
          - "If agreement.contract_status == SIGNED: agreement.contract_status -> IN_DELIVERY"

      - from: LAUNCHED
        to: IN_PROGRESS
        trigger: "system (automatic on the first session close_attendance of this cohort)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_PROGRESS
        to: DELIVERED
        trigger: "system (automatic when every session of this cohort is in {HELD, CANCELLED} and at least one is HELD)"
        actor: system
        preconditions: []
        side_effects:
          - "attendance_completion runs for every ENROLLED participant: attendance_pct >= 80.00 -> COMPLETED, attended_hours == 0 -> NO_SHOW, otherwise -> DROPPED"
          - "completer_count recomputed"

      - from: DELIVERED
        to: CREDENTIALED
        trigger: "POST /ct/cohorts/{id}/issue_credentials"
        actor: CredentialOfficer
        preconditions: ["completer_count >= 1 (ERR_NO_COMPLETERS)"]
        side_effects:
          - "credential_code = CTC-<cohort start_date yyyymmdd>-<external_employee_ref> assigned to every COMPLETED participant"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /ct/cohorts/{id}/cancel OR system cascade from agreement cancellation"
        actor: WorkforceCoordinator | CollegeAdmin | system
        preconditions: []
        side_effects:
          - "PLANNED sessions -> CANCELLED (link 2 of agreement cascade; link 1 of cohort cascade)"
          - "Session cancellations release InstructorAssignments in {PROPOSED, CONFIRMED} -> RELEASED; CONFIRMED releases decrement Instructor.committed_hours by session.hours (link 3)"
          - "GrantApplications in {DRAFT, SUBMITTED, UNDER_REVIEW, RETURNED} -> WITHDRAWN; APPROVED applications release reserved_cents to program and -> WITHDRAWN"
          - "Open DRAFT/ISSUED Invoice -> VOID; if billing_status was INVOICED it returns to UNBILLED"

      - from: LAUNCHED
        to: CANCELLED
        trigger: "POST /ct/cohorts/{id}/cancel OR system cascade from agreement cancellation"
        actor: WorkforceCoordinator | CollegeAdmin | system
        preconditions: []
        side_effects: ["same cascade set as SCHEDULED -> CANCELLED"]

      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "system cascade from agreement cancellation only (a cohort with a HELD session cannot be cancelled directly: ERR_INVALID_STATE)"
        actor: system
        preconditions: []
        side_effects: ["same cascade set as SCHEDULED -> CANCELLED; HELD sessions are left untouched"]
    note: "billing_status dimension: UNBILLED -> INVOICED on invoice issue; INVOICED -> PAID on mark_paid; INVOICED -> UNBILLED on invoice void. Evolves independently of delivery_status."

  - entity: Session
    initial_state: PLANNED
    terminal_states: [HELD, CANCELLED]
    note: "Invoking close_attendance on a HELD session returns the specialized ERR_ATTENDANCE_ALREADY_CLOSED (not generic ERR_INVALID_STATE); invoking on a CANCELLED session returns ERR_INVALID_STATE."
    transitions:
      - from: PLANNED
        to: HELD
        trigger: "POST /ct/sessions/{id}/close_attendance"
        actor: Instructor
        preconditions:
          - "cohort.delivery_status IN {LAUNCHED, IN_PROGRESS} (ERR_INVALID_STATE)"
          - "X-User-ID equals instructor_id of a CONFIRMED InstructorAssignment on this session (ERR_FORBIDDEN_FOR_ROLE)"
          - "attendance_closed == false (ERR_ATTENDANCE_ALREADY_CLOSED)"
        side_effects:
          - "attendance_closed = true; Participant.attended_hours updated per attendance payload (link 1 of attendance cascade)"
          - "InstructorAssignments in CONFIRMED -> COMPLETED; Instructor.committed_hours -= session.hours (link 1')"
          - "If first HELD session of cohort: cohort LAUNCHED -> IN_PROGRESS (link 2)"
          - "If all sessions now in {HELD, CANCELLED} and >= 1 HELD: cohort -> DELIVERED and attendance_completion evaluates participants (link 3)"

      - from: PLANNED
        to: CANCELLED
        trigger: "POST /ct/sessions/{id}/cancel OR system cascade from cohort cancellation"
        actor: WorkforceCoordinator | system
        preconditions: []
        side_effects:
          - "InstructorAssignments in {PROPOSED, CONFIRMED} -> RELEASED; CONFIRMED releases decrement Instructor.committed_hours by session.hours"

  - entity: Instructor
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /ct/instructors/{id}/deactivate"
        actor: CollegeAdmin
        preconditions: ["No CONFIRMED assignments on PLANNED sessions (ERR_INVALID_STATE — release them first)"]
        side_effects: []

      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /ct/instructors/{id}/reactivate"
        actor: CollegeAdmin
        preconditions: []
        side_effects: []

  - entity: InstructorAssignment
    initial_state: PROPOSED
    terminal_states: [RELEASED, COMPLETED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /ct/instructor-assignments/{id}/confirm"
        actor: CredentialOfficer
        preconditions:
          - "X-User-ID != proposed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "No required credential of the cohort curriculum is expired at session start (ERR_CREDENTIAL_EXPIRED)"
          - "match_score >= 80 (ERR_CREDENTIAL_MISMATCH)"
          - "Instructor.status == ACTIVE (ERR_INVALID_STATE)"
          - "No half-open overlap with another CONFIRMED assignment session of the same instructor (ERR_INSTRUCTOR_DOUBLE_BOOKED)"
          - "session.status == PLANNED (ERR_INVALID_STATE)"
        side_effects:
          - "match_score computed via credential_match_score and persisted"
          - "approved_by_user_id = X-User-ID"
          - "Instructor.committed_hours += session.hours"

      - from: PROPOSED
        to: RELEASED
        trigger: "POST /ct/instructor-assignments/{id}/release OR system cascade from session cancellation"
        actor: WorkforceCoordinator | CredentialOfficer | system
        preconditions: []
        side_effects: []

      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /ct/instructor-assignments/{id}/release OR system cascade from session cancellation"
        actor: WorkforceCoordinator | CredentialOfficer | system
        preconditions: ["session.status == PLANNED (ERR_INVALID_STATE)"]
        side_effects: ["Instructor.committed_hours -= session.hours"]

      - from: CONFIRMED
        to: COMPLETED
        trigger: "system (automatic on session close_attendance)"
        actor: system
        preconditions: []
        side_effects: ["Instructor.committed_hours -= session.hours"]

  - entity: Participant
    initial_state: ENROLLED
    terminal_states: [COMPLETED, DROPPED, NO_SHOW]
    transitions:
      - from: ENROLLED
        to: COMPLETED
        trigger: "system (attendance_completion when cohort reaches DELIVERED)"
        actor: system
        preconditions: ["attendance_pct >= 80.00"]
        side_effects: ["cohort.completer_count recomputed"]

      - from: ENROLLED
        to: DROPPED
        trigger: "POST /ct/participants/{id}/drop OR system (attendance_completion: 0 < attendance_pct < 80.00)"
        actor: WorkforceCoordinator | system
        preconditions: []
        side_effects: ["cohort.enrolled_count recomputed on manual drop"]

      - from: ENROLLED
        to: NO_SHOW
        trigger: "system (attendance_completion: attended_hours == 0)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    note: "mark_paid on a non-ISSUED invoice returns the specialized ERR_INVOICE_NOT_PAYABLE; void on PAID/VOID returns generic ERR_INVALID_STATE."
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /ct/invoices/{id}/issue"
        actor: BillingClerk
        preconditions: []
        side_effects:
          - "cohort.billing_status UNBILLED -> INVOICED"
          - "agreement.billing_status UNBILLED -> PARTIALLY_BILLED"

      - from: ISSUED
        to: PAID
        trigger: "POST /ct/invoices/{id}/mark_paid"
        actor: BillingClerk
        preconditions: []
        side_effects:
          - "cohort.billing_status -> PAID"
          - "Employer.lifetime_billed_cents += net_due_cents"
          - "If every non-CANCELLED cohort of the agreement is PAID: agreement.billing_status -> SETTLED"

      - from: DRAFT
        to: VOID
        trigger: "POST /ct/invoices/{id}/void"
        actor: BillingClerk
        preconditions: []
        side_effects: []

      - from: ISSUED
        to: VOID
        trigger: "POST /ct/invoices/{id}/void"
        actor: BillingClerk
        preconditions: []
        side_effects: ["cohort.billing_status INVOICED -> UNBILLED"]

  - entity: OutcomeReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /ct/outcome-reports/{id}/submit"
        actor: WorkforceCoordinator
        preconditions: ["every cohort of the agreement is in terminal delivery_status {CREDENTIALED, CANCELLED} (ERR_OUTCOME_INCOMPLETE)"]
        side_effects: ["placement_pct computed via placement_rate"]

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /ct/outcome-reports/{id}/accept"
        actor: CollegeAdmin
        preconditions: []
        side_effects:
          - "Employer.follow_on_pipeline_cents += follow_on_opportunity_cents"
          - "If all cohorts terminal: agreement.contract_status -> COMPLETED"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: quote-revise-stale-agreement
    parent_entity: TrainingAgreement
    write_endpoint: "POST /ct/training-agreements/{id}/revise"
    occ_field: "expected_agreement_version"
    description: |
      Revising a quote against a TrainingAgreement whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just revised the quote (which legitimately
      supersedes the prior quote round) and the current writer's view of the
      agreement is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: grant-create-stale-cohort
    parent_entity: Cohort
    write_endpoint: "POST /ct/cohorts/{id}/grant-applications"
    occ_field: "expected_cohort_version"
    description: |
      Creating a GrantApplication against a Cohort whose version has advanced
      since the client last observed it is rejected. Award math is computed
      from cohort state (enrolled_count, agreement quote), so a writer whose
      view of the cohort predates the latest roster or schedule mutation
      would compute against superseded inputs.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: quote_pricing
    trigger: "POST /ct/training-agreements/{id}/quote and POST /ct/training-agreements/{id}/revise"
    algorithm: tiered_pricing
    formula: |
      n = agreement.est_participant_count
      VARIANT PER_PARTICIPANT:
        tuition_cents = 45000*min(n,10) + 40000*max(0,min(n-10,15)) + 35000*max(0,n-25)
        materials_cents = n * 7500
        base = tuition_cents + materials_cents
      VARIANT FLAT_COHORT:
        base = 480000 + 38000*max(0, n-12)
      MODE ADJUSTMENT:
        if delivery_mode == ON_SITE:   base += 25000
        if delivery_mode == ON_CAMPUS: base += est_delivery_hours * campus_venue.hourly_cost_cents
        (campus_venue resolved via agreement.campus_venue_id; if absent, the venue cost term is 0)
      RUSH: if (target_start_date - quote_date) < 14 days: base = round_half_up(base * 1.10) to whole cents
      FLOOR: quoted_total_cents = max(base, 150000)
      Evaluation order pinned: tuition/materials -> mode adjustment -> rush uplift (round_half_up once, here) -> floor.
    input_set: "The agreement's own estimate fields (est_participant_count, est_delivery_hours, pricing_model, delivery_mode, target_start_date) and the campus venue's hourly_cost_cents when ON_CAMPUS. No cohort/session rows are read — the quote is forward-looking."
    constants:
      TIER1_LIMIT: 10
      TIER1_RATE_CENTS: 45000
      TIER2_LIMIT: 15
      TIER2_RATE_CENTS: 40000
      TIER3_RATE_CENTS: 35000
      MATERIALS_PER_HEAD_CENTS: 7500
      FLAT_BASE_CENTS: 480000
      FLAT_INCLUDED_HEADS: 12
      FLAT_OVERAGE_PER_HEAD_CENTS: 38000
      ON_SITE_SURCHARGE_CENTS: 25000
      MIN_CONTRACT_CENTS: 150000
      RUSH_THRESHOLD_DAYS: 14
      RUSH_UPLIFT_PCT: 0.10
    precision: "whole cents, round_half_up applied once after rush uplift"
    variants:
      - name: PER_PARTICIPANT
        when: "agreement.pricing_model == PER_PARTICIPANT"
        difference: "Tiered marginal per-head tuition plus per-head materials; scales linearly-ish with headcount"
      - name: FLAT_COHORT
        when: "agreement.pricing_model == FLAT_COHORT"
        difference: "Flat base covering 12 heads plus flat overage per extra head; identical inputs produce a different total than PER_PARTICIPANT"

  - name: invoice_gross
    trigger: "POST /ct/cohorts/{id}/invoices"
    algorithm: aggregation
    formula: |
      For each session line:
        VARIANT FINAL (cohort DELIVERED/CREDENTIALED):
          hours_used = session.hours for sessions with status == HELD only
          attendees  = count of participants whose recorded attended_hours > 0 for that session
        VARIANT PROVISIONAL (cohort LAUNCHED/IN_PROGRESS):
          hours_used = session.hours for sessions with status == PLANNED only
          attendees  = cohort.enrolled_count
        instruction_cents = round_half_up(hours_used * instructor.hourly_rate_cents * 1.15)
          where instructor = the instructor of the session's COMPLETED-or-CONFIRMED assignment (exactly one required)
        materials_cents   = round_half_up(attendees * 7500)
        line_cents = instruction_cents + materials_cents
      gross_cents = SUM(line_cents)          # PINNED ROUNDING ORDER: round per line, then sum.
                                             # round_half_up(SUM(unrounded lines)) is FORBIDDEN and
                                             # yields a different cent total (e.g. 175012 vs 175013).
    input_set: "Sessions of the cohort filtered by status per variant (FINAL: HELD only; PROVISIONAL: PLANNED only); participants filtered per variant (FINAL: attended_hours > 0 per session; PROVISIONAL: enrolled_count)."
    constants:
      LOAD_FACTOR: 1.15
      MATERIALS_PER_HEAD_CENTS: 7500
    precision: "whole cents, round_half_up per line, then integer sum"
    variants:
      - name: PROVISIONAL
        when: "cohort.delivery_status IN {LAUNCHED, IN_PROGRESS} at invoice creation"
        difference: "Uses PLANNED session hours and enrolled_count; produced before delivery completes"
      - name: FINAL
        when: "cohort.delivery_status IN {DELIVERED, CREDENTIALED} at invoice creation"
        difference: "Uses HELD session hours and actual per-session attendees; drops reduce it relative to PROVISIONAL"

  - name: invoice_grant_offset
    trigger: "POST /ct/cohorts/{id}/invoices (after invoice_gross)"
    algorithm: constraint_propagation
    formula: |
      PINNED EVALUATION ORDER (removes the circular reading):
        step 1: gross_cents  = invoice_gross(cohort, variant)
        step 2: award = cohort's GrantApplication in status IN {APPROVED, CLAIMED, PAID}
                award_basis = final_award_cents if status IN {CLAIMED, PAID} else provisional_award_cents
                grant_offset_cents = min(award_basis,
                                         floor(gross_cents * program.max_share_pct),
                                         program.cap_per_trainee_cents * cohort.completer_count_at_invoice)
                where completer_count_at_invoice = completer_count for FINAL, enrolled_count for PROVISIONAL
                if no such application: grant_offset_cents = 0
        step 3: net_due_cents = gross_cents - grant_offset_cents
      grant_offset never feeds back into gross_cents; the three steps run exactly once, in this order.
    input_set: "The cohort's single open GrantApplication in {APPROVED, CLAIMED, PAID} (at most one open application per cohort+program is allowed); the program constants."
    constants: {}
    precision: "whole cents; floor() for the share term"

  - name: grant_award
    trigger: "POST /ct/grant-applications/{id}/approve (PROVISIONAL) and POST /ct/grant-applications/{id}/claim (FINAL)"
    algorithm: waterfall_allocation
    formula: |
      VARIANT PROVISIONAL (at approve):
        provisional_award_cents = min(application.requested_cents,
                                      floor(agreement.quoted_total_cents * program.max_share_pct),
                                      program.cap_per_trainee_cents * cohort.enrolled_count)
      VARIANT FINAL (at claim):
        final_award_cents = min(application.requested_cents,
                                floor(final_invoice.gross_cents * program.max_share_pct),
                                program.cap_per_trainee_cents * cohort.completer_count)
        where final_invoice = the cohort's FINAL-variant Invoice in status IN {DRAFT, ISSUED, PAID};
        if none exists, gross term = 0.
    input_set: "PROVISIONAL: agreement.quoted_total_cents + cohort.enrolled_count. FINAL: cohort's FINAL invoice gross + completer_count. Both filter to the application's own cohort and program."
    constants: {}
    precision: "whole cents; floor() on the share term"
    variants:
      - name: PROVISIONAL
        when: "approval time, before delivery"
        difference: "Estimated basis (quoted total, enrolled headcount) — forward-looking"
      - name: FINAL
        when: "claim time, after credentialing"
        difference: "Actual basis (FINAL invoice gross, completer_count) — diverges from PROVISIONAL whenever participants drop or sessions are cancelled"

  - name: credential_match_score
    trigger: "POST /ct/instructor-assignments/{id}/confirm"
    algorithm: weighted_scoring
    formula: |
      required_codes = union of required_credential_codes over the cohort's agreement's
                       assessment's curriculum_modules
      For each code in required_codes:
        credential = instructor.credentials entry with that code
        weight = 0.0  if no such credential
               = 0.0  if credential.expires_on < session.start_at            (expired -> ERR_CREDENTIAL_EXPIRED)
               = 0.5  if session.start_at <= expires_on < session.start_at + 30 days
               = 1.0  if expires_on >= session.start_at + 30 days
      match_score = round_half_up(100 * SUM(weights) / COUNT(required_codes)) to integer
      Confirm requires match_score >= 80 (ERR_CREDENTIAL_MISMATCH otherwise).
      If required_codes is empty: match_score = 100.
    input_set: "Instructor.credentials; the cohort curriculum's required codes; the session's start_at."
    constants:
      FULL_WEIGHT_HORIZON_DAYS: 30
      CONFIRM_THRESHOLD: 80
    precision: "integer percent, round_half_up"

  - name: attendance_completion
    trigger: "system, when cohort reaches DELIVERED"
    algorithm: threshold
    formula: |
      scheduled_held_hours = SUM(session.hours) over the cohort's HELD sessions
      attendance_pct = round_half_up(100 * participant.attended_hours / scheduled_held_hours, 2)
      if attended_hours == 0: completion_status = NO_SHOW
      elif attendance_pct >= 80.00: completion_status = COMPLETED    # boundary: exactly 80.00 qualifies
      else: completion_status = DROPPED
    input_set: "Participants with completion_status == ENROLLED of the DELIVERED cohort; HELD sessions only."
    constants:
      COMPLETION_THRESHOLD_PCT: 80.00
    precision: "2 decimal places, round_half_up; comparison is >= on the rounded value"

  - name: instructor_committed_hours
    trigger: "assignment confirm (+=), assignment release from CONFIRMED (-=), session close_attendance (-= via COMPLETED), cascade release (-=)"
    algorithm: aggregation
    formula: |
      instructor.committed_hours = SUM(session.hours) over assignments where
        assignment.instructor_id == instructor.id AND
        assignment.status == CONFIRMED AND
        session.status == PLANNED
      INVARIANT: instructor.committed_hours always equals this sum; a confirm followed by
      its compensating release leaves committed_hours unchanged.
    input_set: "InstructorAssignments in CONFIRMED joined to PLANNED sessions for the instructor."
    constants: {}
    precision: "1 decimal place hours"

  - name: grant_program_fund_rollup
    trigger: "application approve / claim / mark_paid / expire / withdraw"
    algorithm: aggregation
    formula: |
      program.reserved_cents   = SUM(app.reserved_cents)   over applications with status == APPROVED
      program.committed_cents  = SUM(app.committed_cents)  over applications with status == CLAIMED
      program.reimbursed_cents = SUM(app.reimbursed_cents) over applications with status == PAID
      program.available_cents  = appropriation_cents - reserved_cents - committed_cents - reimbursed_cents
      INVARIANT: available + reserved + committed + reimbursed == appropriation_cents at all times;
      an approve followed by its compensating withdraw/expire/deny-style release leaves the tuple unchanged.
    input_set: "All GrantApplications of the program, filtered by status as shown."
    constants: {}
    precision: "whole cents"

  - name: placement_rate
    trigger: "POST /ct/outcome-reports/{id}/submit"
    algorithm: aggregation
    formula: |
      total_completers = SUM(cohort.completer_count) over cohorts of the agreement
                         with delivery_status == CREDENTIALED
      placement_pct = round_half_up(100 * completers_employed_90d / total_completers, 2)
      Requires total_completers > 0 (guaranteed by submit precondition ERR_OUTCOME_INCOMPLETE
      only when at least one CREDENTIALED cohort exists with completers; if total_completers == 0: ERR_INVALID_REQUEST).
    input_set: "CREDENTIALED cohorts of the agreement."
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: employer_rollup
    trigger: "invoice mark_paid; outcome report accept"
    algorithm: aggregation
    formula: |
      employer.lifetime_billed_cents = SUM(invoice.net_due_cents) over invoices with status == PAID
        whose cohort belongs to an agreement of this employer
      employer.follow_on_pipeline_cents = SUM(report.follow_on_opportunity_cents) over
        OutcomeReports with status == ACCEPTED of agreements of this employer
    input_set: "PAID invoices only (DRAFT/ISSUED/VOID excluded); ACCEPTED outcome reports only (DRAFT/SUBMITTED excluded)."
    constants: {}
    precision: "whole cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Caller role must be listed in the endpoint's roles; entity-backed ownership (EmployerContact X-User-ID == agreement.employer_id; Instructor X-User-ID == CONFIRMED assignment instructor_id on the session)"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every path id must exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: business_referential
    check: "Request body shape: required fields present, types valid, enum values in domain, end_at > start_at, attended_hours <= session.hours, counts > 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"

  - priority: 5
    category: state
    check: "Target entity is in a state from which the requested transition exists (covers ERR_INVALID_STATE and the specific state errors below at 6)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "Cross-entity state gates: agreement SIGNED/IN_DELIVERY for cohort create/launch (ERR_AGREEMENT_NOT_SIGNED); assessment APPROVED for quote (ERR_ASSESSMENT_NOT_APPROVED); cohort CREDENTIALED for claim (ERR_COHORT_NOT_CREDENTIALED); program OPEN for submit (ERR_GRANT_PROGRAM_NOT_OPEN); agreement/entity not terminal (ERR_AGREEMENT_TERMINAL); invoice variant allowed for cohort delivery state (ERR_INVOICE_VARIANT_NOT_ALLOWED); session PLANNED for confirm/close (ERR_SESSION_NOT_PLANNED / ERR_ATTENDANCE_ALREADY_CLOSED); invoice ISSUED for mark_paid (ERR_INVOICE_NOT_PAYABLE)"
    error_id: "ERR_AGREEMENT_NOT_SIGNED | ERR_ASSESSMENT_NOT_APPROVED | ERR_COHORT_NOT_CREDENTIALED | ERR_GRANT_PROGRAM_NOT_OPEN | ERR_AGREEMENT_TERMINAL | ERR_INVOICE_VARIANT_NOT_ALLOWED | ERR_SESSION_NOT_PLANNED | ERR_ATTENDANCE_ALREADY_CLOSED | ERR_INVOICE_NOT_PAYABLE"
    http_status: 409
    applies_to: "cohort create/launch, quote, grant submit/approve/claim, invoice create, assignment confirm, close_attendance"

  - priority: 7
    category: business_safety
    check: "Credential compliance and duty segregation at assignment confirm: no expired required credential (ERR_CREDENTIAL_EXPIRED), match_score >= 80 (ERR_CREDENTIAL_MISMATCH), confirmer is not the proposer (ERR_SEGREGATION_OF_DUTIES)"
    error_id: "ERR_CREDENTIAL_EXPIRED | ERR_CREDENTIAL_MISMATCH | ERR_SEGREGATION_OF_DUTIES"
    http_status: 409
    applies_to: "POST /ct/instructor-assignments/{id}/confirm"

  - priority: 8
    category: business_temporal
    check: "Temporal windows and overlaps: quote still valid (ERR_QUOTE_EXPIRED); grant window open (ERR_GRANT_WINDOW_CLOSED); instructor half-open overlap (ERR_INSTRUCTOR_DOUBLE_BOOKED); venue closed-interval + 30-minute turnover overlap (ERR_VENUE_OVERLAP)"
    error_id: "ERR_QUOTE_EXPIRED | ERR_GRANT_WINDOW_CLOSED | ERR_INSTRUCTOR_DOUBLE_BOOKED | ERR_VENUE_OVERLAP"
    http_status: 409
    applies_to: "sign, negotiate, grant submit/claim, assignment confirm, session create"

  - priority: 9
    category: business_referential
    check: "Reference integrity: assessment version pin current at sign (ERR_STALE_ASSESSMENT); OCC version match (ERR_STALE_VERSION); duplicate participant ref per cohort (ERR_DUPLICATE_PARTICIPANT); cohort/session delivery_mode vs venue kind consistency (ERR_DELIVERY_MODE_MISMATCH); one open application per cohort+program (ERR_INVALID_REQUEST)"
    error_id: "ERR_STALE_ASSESSMENT | ERR_STALE_VERSION | ERR_DUPLICATE_PARTICIPANT | ERR_DELIVERY_MODE_MISMATCH | ERR_INVALID_REQUEST"
    http_status: "409 | 412"
    applies_to: "sign, revise, grant-application create, participant create, cohort/session create"

  - priority: 10
    category: business_constraint
    check: "Capacity and threshold constraints: enrolled_count >= min_enrollment at launch (ERR_BELOW_MIN_ENROLLMENT); venue capacity >= enrolled_count (ERR_VENUE_CAPACITY_EXCEEDED); completer_count >= 1 at credentialing (ERR_NO_COMPLETERS)"
    error_id: "ERR_BELOW_MIN_ENROLLMENT | ERR_VENUE_CAPACITY_EXCEEDED | ERR_NO_COMPLETERS"
    http_status: 409
    applies_to: "cohort launch, issue_credentials"

  - priority: 11
    category: business_fiscal
    check: "Fiscal capacity: provisional_award_cents <= program.available_cents at approve (ERR_GRANT_CAPACITY_EXCEEDED)"
    error_id: ERR_GRANT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /ct/grant-applications/{id}/approve"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving; default time 2026-05-01T00:00:00Z) ---
  - method: POST
    path: "/ct/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the clock reads exactly 2026-05-01T00:00:00Z and never falls back to wall-clock time. Advancing the clock runs the dormancy and grant-expiry sweeps."
    roles: [CollegeAdmin]
    code: 200
    input: [to_iso8601]
    output: { now: string }
    side_effects: ["Employer dormancy sweep", "GrantApplication expiry sweep (APPROVED past claim_by -> EXPIRED, reserved released)"]

  # --- Employer ---
  - method: POST
    path: "/ct/employers"
    description: "Create an Employer (status = PROSPECT)"
    roles: [CollegeAdmin, WorkforceCoordinator]
    code: 201
    input: [legal_name, industry_code, contact_email]
    output: Employer
    side_effects: ["status=PROSPECT, rollups 0"]

  - method: GET
    path: "/ct/employers/{id}"
    description: "Get an Employer"
    roles: [CollegeAdmin, WorkforceCoordinator, CredentialOfficer, GrantOfficer, EmployerContact, BillingClerk, Instructor]
    code: 200
    input: []
    output: Employer
    side_effects: []

  - method: GET
    path: "/ct/employers/{id}/needs-assessments"
    description: "List NeedsAssessments of an Employer"
    roles: [CollegeAdmin, WorkforceCoordinator, CredentialOfficer, GrantOfficer, EmployerContact, BillingClerk, Instructor]
    code: 200
    input: ["limit?", "offset?"]
    output: "NeedsAssessment[]"
    side_effects: []

  - method: GET
    path: "/ct/employers/{id}/training-agreements"
    description: "List TrainingAgreements of an Employer"
    roles: [CollegeAdmin, WorkforceCoordinator, CredentialOfficer, GrantOfficer, EmployerContact, BillingClerk, Instructor]
    code: 200
    input: ["limit?", "offset?"]
    output: "TrainingAgreement[]"
    side_effects: []

  # --- NeedsAssessment ---
  - method: POST
    path: "/ct/employers/{id}/needs-assessments"
    description: "Create a NeedsAssessment (status = DRAFT)"
    roles: [WorkforceCoordinator]
    code: 201
    input: [title, skill_gaps, target_roles, curriculum_modules]
    output: NeedsAssessment
    side_effects: ["status=DRAFT, revision_round=0"]

  - method: GET
    path: "/ct/needs-assessments/{id}"
    description: "Get a NeedsAssessment"
    roles: [CollegeAdmin, WorkforceCoordinator, CredentialOfficer, GrantOfficer, EmployerContact, BillingClerk, Instructor]
    code: 200
    input: []
    output: NeedsAssessment
    side_effects: []

  - method: POST
    path: "/ct/needs-assessments/{id}/submit"
    description: "Submit a NeedsAssessment (DRAFT or REVISION_REQUESTED -> SUBMITTED)"
    roles: [WorkforceCoordinator]
    code: 200
    input: []
    output: NeedsAssessment
    side_effects: ["status -> SUBMITTED"]

  - method: POST
    path: "/ct/needs-assessments/{id}/approve"
    description: "Approve a NeedsAssessment (SUBMITTED -> APPROVED)"
    roles: [CollegeAdmin]
    code: 200
    input: []
    output: NeedsAssessment
    side_effects: ["status -> APPROVED, approved_at = now"]

  - method: POST
    path: "/ct/needs-assessments/{id}/request_revision"
    description: "Request revision (SUBMITTED -> REVISION_REQUESTED, revision_round += 1)"
    roles: [CollegeAdmin]
    code: 200
    input: ["notes?"]
    output: NeedsAssessment
    side_effects: ["status -> REVISION_REQUESTED, revision_round += 1"]

  # --- TrainingAgreement ---
  - method: POST
    path: "/ct/employers/{id}/training-agreements"
    description: "Create a TrainingAgreement pinned to the current assessment version (status = DRAFT)"
    roles: [WorkforceCoordinator]
    code: 201
    input: [needs_assessment_id, pricing_model, delivery_mode, est_participant_count, est_delivery_hours, target_start_date, max_cohorts, "campus_venue_id?"]
    output: TrainingAgreement
    side_effects: ["contract_status=DRAFT, billing_status=UNBILLED, negotiation_round=0, assessment_version_pinned = assessment.version"]

  - method: GET
    path: "/ct/training-agreements/{id}"
    description: "Get a TrainingAgreement"
    roles: [CollegeAdmin, WorkforceCoordinator, CredentialOfficer, GrantOfficer, EmployerContact, BillingClerk, Instructor]
    code: 200
    input: []
    output: TrainingAgreement
    side_effects: []

  - method: GET
    path: "/ct/training-agreements"
    description: "List TrainingAgreements with filters and pagination"
    roles: [CollegeAdmin, WorkforceCoordinator, CredentialOfficer, GrantOfficer, EmployerContact, BillingClerk, Instructor]
    code: 200
    input: ["needs_assessment_id?", "employer_id?", "contract_status?", "limit?", "offset?"]
    output: "TrainingAgreement[]"
    side_effects: []

  - method: POST
    path: "/ct/training-agreements/{id}/quote"
    description: "Generate the initial quote (DRAFT -> QUOTED)"
    roles: [WorkforceCoordinator]
    code: 200
    input: []
    output: TrainingAgreement
    side_effects: ["quoted_total_cents = quote_pricing; quote_issued_at = now; quote_expires_at = now + 30 days"]

  - method: POST
    path: "/ct/training-agreements/{id}/revise"
    description: "Revise the quote (NEGOTIATING -> QUOTED, new round; OCC-guarded)"
    roles: [WorkforceCoordinator]
    code: 200
    input: [expected_agreement_version, "est_participant_count?", "est_delivery_hours?", "pricing_model?", "delivery_mode?", "target_start_date?"]
    output: TrainingAgreement
    side_effects: ["negotiation_round += 1; quoted_total_cents recomputed; quote window re-issued; increments TrainingAgreement.version by 1"]

  - method: POST
    path: "/ct/training-agreements/{id}/negotiate"
    description: "Employer requests changes (QUOTED -> NEGOTIATING)"
    roles: [EmployerContact]
    code: 200
    input: []
    output: TrainingAgreement
    side_effects: ["contract_status -> NEGOTIATING"]

  - method: POST
    path: "/ct/training-agreements/{id}/sign"
    description: "Employer signs (QUOTED -> SIGNED); activates employer"
    roles: [EmployerContact]
    code: 200
    input: []
    output: TrainingAgreement
    side_effects: ["contract_status -> SIGNED, signed_at = now, Employer.status -> ACTIVE"]

  - method: POST
    path: "/ct/training-agreements/{id}/cancel"
    description: "Cancel an agreement (DRAFT/QUOTED/NEGOTIATING/SIGNED -> CANCELLED) with full cascade"
    roles: [WorkforceCoordinator, CollegeAdmin]
    code: 200
    input: []
    output: TrainingAgreement
    side_effects: ["contract_status -> CANCELLED; cohort/session/assignment/grant/invoice cascade per §1.2"]

  - method: POST
    path: "/ct/training-agreements/{id}/refresh_assessment_pin"
    description: "Re-pin assessment_version_pinned to the assessment's current version (DRAFT/QUOTED/NEGOTIATING only)"
    roles: [WorkforceCoordinator]
    code: 200
    input: []
    output: TrainingAgreement
    side_effects: ["assessment_version_pinned = needs_assessment.version; requires assessment.status == APPROVED (ERR_ASSESSMENT_NOT_APPROVED)"]

  - method: GET
    path: "/ct/training-agreements/{id}/cohorts"
    description: "List Cohorts of a TrainingAgreement"
    roles: [CollegeAdmin, WorkforceCoordinator, CredentialOfficer, GrantOfficer, EmployerContact, BillingClerk, Instructor]
    code: 200
    input: ["limit?", "offset?"]
    output: "Cohort[]"
    side_effects: []

  - method: GET
    path: "/ct/training-agreements/{id}/outcome-reports"
    description: "List OutcomeReports of a TrainingAgreement"
    roles: [CollegeAdmin, WorkforceCoordinator, CredentialOfficer, GrantOfficer, EmployerContact, BillingClerk, Instructor]
    code: 200
    input: ["limit?", "offset?"]
    output: "OutcomeReport[]"
    side_effects: []

  # --- GrantProgram ---
  - method: POST
    path: "/ct/grant-programs"
    description: "Create a GrantProgram (status = OPEN; available = appropriation)"
    roles: [CollegeAdmin]
    code: 201
    input: [code, name, appropriation_cents, max_share_pct, cap_per_trainee_cents, application_window_end, claim_deadline_days]
    output: GrantProgram
    side_effects: ["status=OPEN; reserved/committed/reimbursed = 0; available = appropriation_cents"]

  - method: GET
    path: "/ct/grant-programs/{id}"
    description: "Get a GrantProgram"
    roles: [CollegeAdmin, WorkforceCoordinator, CredentialOfficer, GrantOfficer, EmployerContact, BillingClerk, Instructor]
    code: 200
    input: []
    output: GrantProgram
    side_effects: []

  - method: POST
    path: "/ct/grant-programs/{id}/suspend"
    description: "Suspend a program (OPEN -> SUSPENDED)"
    roles: [CollegeAdmin]
    code: 200
    input: []
    output: GrantProgram
    side_effects: ["status -> SUSPENDED"]

  - method: POST
    path: "/ct/grant-programs/{id}/reopen"
    description: "Reopen a program (SUSPENDED -> OPEN)"
    roles: [CollegeAdmin]
    code: 200
    input: []
    output: GrantProgram
    side_effects: ["status -> OPEN"]

  - method: POST
    path: "/ct/grant-programs/{id}/close"
    description: "Close a program (OPEN/SUSPENDED -> CLOSED) when no reserved or committed funds"
    roles: [CollegeAdmin]
    code: 200
    input: []
    output: GrantProgram
    side_effects: ["status -> CLOSED"]

  # --- GrantApplication ---
  - method: POST
    path: "/ct/cohorts/{id}/grant-applications"
    description: "Create a GrantApplication for a cohort (status = DRAFT; OCC-guarded on the cohort)"
    roles: [WorkforceCoordinator]
    code: 201
    input: [program_id, requested_cents, expected_cohort_version]
    output: GrantApplication
    side_effects: ["status=DRAFT; cohort must be in delivery_status {SCHEDULED, LAUNCHED, IN_PROGRESS} (ERR_INVALID_STATE); at most one application in status IN {DRAFT, SUBMITTED, UNDER_REVIEW, RETURNED, APPROVED, CLAIMED} per cohort+program (ERR_INVALID_REQUEST); increments Cohort.version by 1"]

  - method: GET
    path: "/ct/grant-applications/{id}"
    description: "Get a GrantApplication"
    roles: [CollegeAdmin, WorkforceCoordinator, CredentialOfficer, GrantOfficer, EmployerContact, BillingClerk, Instructor]
    code: 200
    input: []
    output: GrantApplication
    side_effects: []

  - method: GET
    path: "/ct/grant-applications"
    description: "List GrantApplications with filters"
    roles: [CollegeAdmin, WorkforceCoordinator, CredentialOfficer, GrantOfficer, EmployerContact, BillingClerk, Instructor]
    code: 200
    input: ["program_id?", "cohort_id?", "status?", "limit?", "offset?"]
    output: "GrantApplication[]"
    side_effects: []

  - method: GET
    path: "/ct/cohorts/{id}/grant-applications"
    description: "List GrantApplications of a Cohort"
    roles: [CollegeAdmin, WorkforceCoordinator, CredentialOfficer, GrantOfficer, EmployerContact, BillingClerk, Instructor]
    code: 200
    input: ["limit?", "offset?"]
    output: "GrantApplication[]"
    side_effects: []

  - method: POST
    path: "/ct/grant-applications/{id}/submit"
    description: "Submit (DRAFT or RETURNED -> SUBMITTED)"
    roles: [WorkforceCoordinator]
    code: 200
    input: []
    output: GrantApplication
    side_effects: ["status -> SUBMITTED, submitted_at = now"]

  - method: POST
    path: "/ct/grant-applications/{id}/start_review"
    description: "Start review (SUBMITTED -> UNDER_REVIEW)"
    roles: [GrantOfficer]
    code: 200
    input: []
    output: GrantApplication
    side_effects: ["status -> UNDER_REVIEW"]

  - method: POST
    path: "/ct/grant-applications/{id}/return"
    description: "Return for changes (UNDER_REVIEW -> RETURNED)"
    roles: [GrantOfficer]
    code: 200
    input: ["notes?"]
    output: GrantApplication
    side_effects: ["status -> RETURNED"]

  - method: POST
    path: "/ct/grant-applications/{id}/approve"
    description: "Approve and reserve funds (UNDER_REVIEW -> APPROVED)"
    roles: [GrantOfficer]
    code: 200
    input: []
    output: GrantApplication
    side_effects: ["provisional_award_cents computed; reserved on program; claim_by set"]

  - method: POST
    path: "/ct/grant-applications/{id}/deny"
    description: "Deny (UNDER_REVIEW -> DENIED)"
    roles: [GrantOfficer]
    code: 200
    input: ["reason?"]
    output: GrantApplication
    side_effects: ["status -> DENIED, decided_at = now"]

  - method: POST
    path: "/ct/grant-applications/{id}/claim"
    description: "Claim reimbursement (APPROVED -> CLAIMED); computes FINAL award, converts reservation"
    roles: [WorkforceCoordinator]
    code: 200
    input: []
    output: GrantApplication
    side_effects: ["final_award_cents computed; reserved -> committed with difference released to available"]

  - method: POST
    path: "/ct/grant-applications/{id}/mark_paid"
    description: "Mark reimbursed (CLAIMED -> PAID)"
    roles: [GrantOfficer]
    code: 200
    input: []
    output: GrantApplication
    side_effects: ["committed -> reimbursed on program"]

  # --- Instructor & Venue ---
  - method: POST
    path: "/ct/instructors"
    description: "Create an Instructor (status = ACTIVE)"
    roles: [CollegeAdmin]
    code: 201
    input: [full_name, credentials, hourly_rate_cents]
    output: Instructor
    side_effects: ["status=ACTIVE, committed_hours=0"]

  - method: GET
    path: "/ct/instructors/{id}"
    description: "Get an Instructor"
    roles: [CollegeAdmin, WorkforceCoordinator, CredentialOfficer, GrantOfficer, EmployerContact, BillingClerk, Instructor]
    code: 200
    input: []
    output: Instructor
    side_effects: []

  - method: POST
    path: "/ct/instructors/{id}/deactivate"
    description: "Deactivate an instructor (ACTIVE -> INACTIVE); blocked while CONFIRMED assignments on PLANNED sessions exist"
    roles: [CollegeAdmin]
    code: 200
    input: []
    output: Instructor
    side_effects: ["status -> INACTIVE"]

  - method: POST
    path: "/ct/instructors/{id}/reactivate"
    description: "Reactivate an instructor (INACTIVE -> ACTIVE)"
    roles: [CollegeAdmin]
    code: 200
    input: []
    output: Instructor
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/ct/venues"
    description: "Create a Venue"
    roles: [CollegeAdmin]
    code: 201
    input: [name, kind, capacity, hourly_cost_cents]
    output: Venue
    side_effects: ["turnover_buffer_minutes = 30"]

  - method: GET
    path: "/ct/venues/{id}"
    description: "Get a Venue"
    roles: [CollegeAdmin, WorkforceCoordinator, CredentialOfficer, GrantOfficer, EmployerContact, BillingClerk, Instructor]
    code: 200
    input: []
    output: Venue
    side_effects: []

  # --- Cohort ---
  - method: POST
    path: "/ct/training-agreements/{id}/cohorts"
    description: "Create a Cohort under a SIGNED/IN_DELIVERY agreement (status = SCHEDULED)"
    roles: [WorkforceCoordinator]
    code: 201
    input: [delivery_mode, min_enrollment, start_date, end_date, "venue_id?"]
    output: Cohort
    side_effects: ["delivery_status=SCHEDULED, billing_status=UNBILLED; agreement must be QUOTED, NEGOTIATING, SIGNED or IN_DELIVERY (ERR_INVALID_STATE); cohort count < agreement.max_cohorts (ERR_INVALID_REQUEST); delivery_mode must equal agreement.delivery_mode (ERR_DELIVERY_MODE_MISMATCH)"]

  - method: GET
    path: "/ct/cohorts/{id}"
    description: "Get a Cohort"
    roles: [CollegeAdmin, WorkforceCoordinator, CredentialOfficer, GrantOfficer, EmployerContact, BillingClerk, Instructor]
    code: 200
    input: []
    output: Cohort
    side_effects: []

  - method: GET
    path: "/ct/cohorts"
    description: "List Cohorts with filters"
    roles: [CollegeAdmin, WorkforceCoordinator, CredentialOfficer, GrantOfficer, EmployerContact, BillingClerk, Instructor]
    code: 200
    input: ["venue_id?", "agreement_id?", "delivery_status?", "limit?", "offset?"]
    output: "Cohort[]"
    side_effects: []

  - method: POST
    path: "/ct/cohorts/{id}/launch"
    description: "Launch a cohort (SCHEDULED -> LAUNCHED)"
    roles: [WorkforceCoordinator]
    code: 200
    input: []
    output: Cohort
    side_effects: ["delivery_status -> LAUNCHED; agreement SIGNED -> IN_DELIVERY on first launch"]

  - method: POST
    path: "/ct/cohorts/{id}/cancel"
    description: "Cancel a cohort (SCHEDULED/LAUNCHED -> CANCELLED) with cascade"
    roles: [WorkforceCoordinator, CollegeAdmin]
    code: 200
    input: []
    output: Cohort
    side_effects: ["delivery_status -> CANCELLED; session/assignment/grant/invoice cascade per §1.2"]

  - method: POST
    path: "/ct/cohorts/{id}/issue_credentials"
    description: "Issue completion credentials (DELIVERED -> CREDENTIALED)"
    roles: [CredentialOfficer]
    code: 200
    input: []
    output: Cohort
    side_effects: ["delivery_status -> CREDENTIALED; credential_code assigned to COMPLETED participants"]

  - method: GET
    path: "/ct/cohorts/{id}/sessions"
    description: "List Sessions of a Cohort"
    roles: [CollegeAdmin, WorkforceCoordinator, CredentialOfficer, GrantOfficer, EmployerContact, BillingClerk, Instructor]
    code: 200
    input: ["limit?", "offset?"]
    output: "Session[]"
    side_effects: []

  - method: GET
    path: "/ct/cohorts/{id}/participants"
    description: "List Participants of a Cohort"
    roles: [CollegeAdmin, WorkforceCoordinator, CredentialOfficer, GrantOfficer, EmployerContact, BillingClerk, Instructor]
    code: 200
    input: ["limit?", "offset?"]
    output: "Participant[]"
    side_effects: []

  - method: GET
    path: "/ct/cohorts/{id}/invoices"
    description: "List Invoices of a Cohort (0..n)"
    roles: [CollegeAdmin, WorkforceCoordinator, CredentialOfficer, GrantOfficer, EmployerContact, BillingClerk, Instructor]
    code: 200
    input: ["limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []

  # --- Session ---
  - method: POST
    path: "/ct/cohorts/{id}/sessions"
    description: "Plan a Session on a SCHEDULED cohort; venue kind must match cohort delivery_mode; venue turnover-buffer overlap enforced"
    roles: [WorkforceCoordinator]
    code: 201
    input: [venue_id, start_at, end_at]
    output: Session
    side_effects: ["status=PLANNED; hours computed; cohort must be SCHEDULED (ERR_INVALID_STATE); venue kind match (ERR_DELIVERY_MODE_MISMATCH); ERR_VENUE_OVERLAP on closed-interval+30min conflict"]

  - method: GET
    path: "/ct/sessions/{id}"
    description: "Get a Session"
    roles: [CollegeAdmin, WorkforceCoordinator, CredentialOfficer, GrantOfficer, EmployerContact, BillingClerk, Instructor]
    code: 200
    input: []
    output: Session
    side_effects: []

  - method: GET
    path: "/ct/sessions"
    description: "List Sessions with filters"
    roles: [CollegeAdmin, WorkforceCoordinator, CredentialOfficer, GrantOfficer, EmployerContact, BillingClerk, Instructor]
    code: 200
    input: ["venue_id?", "cohort_id?", "status?", "limit?", "offset?"]
    output: "Session[]"
    side_effects: []

  - method: POST
    path: "/ct/sessions/{id}/cancel"
    description: "Cancel a PLANNED session; releases its assignments"
    roles: [WorkforceCoordinator]
    code: 200
    input: []
    output: Session
    side_effects: ["status -> CANCELLED; assignments {PROPOSED, CONFIRMED} -> RELEASED; committed_hours decremented"]

  - method: POST
    path: "/ct/sessions/{id}/close_attendance"
    description: "Instructor closes attendance (PLANNED -> HELD); attendance is a list of { external_employee_ref, attended_hours } with attended_hours <= session.hours (ERR_INVALID_REQUEST)"
    roles: [Instructor]
    code: 200
    input: [attendance]
    output: Session
    side_effects: ["attendance_closed=true; participant attended_hours updated; CONFIRMED assignments -> COMPLETED; cohort LAUNCHED->IN_PROGRESS then possibly -> DELIVERED with attendance_completion"]

  - method: GET
    path: "/ct/sessions/{id}/instructor-assignments"
    description: "List InstructorAssignments of a Session"
    roles: [CollegeAdmin, WorkforceCoordinator, CredentialOfficer, GrantOfficer, EmployerContact, BillingClerk, Instructor]
    code: 200
    input: ["limit?", "offset?"]
    output: "InstructorAssignment[]"
    side_effects: []

  # --- InstructorAssignment ---
  - method: POST
    path: "/ct/sessions/{id}/instructor-assignments"
    description: "Propose an instructor for a session (status = PROPOSED)"
    roles: [WorkforceCoordinator]
    code: 201
    input: [instructor_id]
    output: InstructorAssignment
    side_effects: ["status=PROPOSED; proposed_by_user_id = X-User-ID; session must be PLANNED (ERR_INVALID_STATE)"]

  - method: GET
    path: "/ct/instructor-assignments/{id}"
    description: "Get an InstructorAssignment"
    roles: [CollegeAdmin, WorkforceCoordinator, CredentialOfficer, GrantOfficer, EmployerContact, BillingClerk, Instructor]
    code: 200
    input: []
    output: InstructorAssignment
    side_effects: []

  - method: GET
    path: "/ct/instructor-assignments"
    description: "List InstructorAssignments with filters"
    roles: [CollegeAdmin, WorkforceCoordinator, CredentialOfficer, GrantOfficer, EmployerContact, BillingClerk, Instructor]
    code: 200
    input: ["instructor_id?", "session_id?", "status?", "limit?", "offset?"]
    output: "InstructorAssignment[]"
    side_effects: []

  - method: POST
    path: "/ct/instructor-assignments/{id}/confirm"
    description: "Confirm a proposed assignment (PROPOSED -> CONFIRMED); credential, segregation, and overlap gates"
    roles: [CredentialOfficer]
    code: 200
    input: []
    output: InstructorAssignment
    side_effects: ["match_score persisted; approved_by_user_id set; Instructor.committed_hours += session.hours"]

  - method: POST
    path: "/ct/instructor-assignments/{id}/release"
    description: "Release an assignment (PROPOSED/CONFIRMED -> RELEASED)"
    roles: [WorkforceCoordinator, CredentialOfficer]
    code: 200
    input: []
    output: InstructorAssignment
    side_effects: ["status -> RELEASED; committed_hours -= session.hours when released from CONFIRMED"]

  # --- Participant ---
  - method: POST
    path: "/ct/cohorts/{id}/participants"
    description: "Enroll a participant on a SCHEDULED cohort"
    roles: [WorkforceCoordinator]
    code: 201
    input: [external_employee_ref, full_name]
    output: Participant
    side_effects: ["completion_status=ENROLLED; cohort.enrolled_count += 1; cohort must be SCHEDULED (ERR_INVALID_STATE); duplicate external_employee_ref per cohort rejected (ERR_DUPLICATE_PARTICIPANT)"]

  - method: GET
    path: "/ct/participants/{id}"
    description: "Get a Participant"
    roles: [CollegeAdmin, WorkforceCoordinator, CredentialOfficer, GrantOfficer, EmployerContact, BillingClerk, Instructor]
    code: 200
    input: []
    output: Participant
    side_effects: []

  - method: POST
    path: "/ct/participants/{id}/drop"
    description: "Drop an ENROLLED participant (ENROLLED -> DROPPED)"
    roles: [WorkforceCoordinator]
    code: 200
    input: []
    output: Participant
    side_effects: ["completion_status -> DROPPED; cohort.enrolled_count -= 1"]

  # --- Invoice ---
  - method: POST
    path: "/ct/cohorts/{id}/invoices"
    description: "Generate an invoice for a cohort; variant gates on delivery state; per-line rounding; grant offset applied"
    roles: [BillingClerk]
    code: 201
    input: [variant]
    output: Invoice
    side_effects: ["status=DRAFT; lines/gross/offset/net computed via invoice_gross + invoice_grant_offset; ERR_INVOICE_VARIANT_NOT_ALLOWED when variant mismatches cohort state; at most one invoice in status IN {DRAFT, ISSUED} per cohort (ERR_INVALID_STATE)"]

  - method: GET
    path: "/ct/invoices/{id}"
    description: "Get an Invoice"
    roles: [CollegeAdmin, WorkforceCoordinator, CredentialOfficer, GrantOfficer, EmployerContact, BillingClerk, Instructor]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/ct/invoices"
    description: "List Invoices with filters"
    roles: [CollegeAdmin, WorkforceCoordinator, CredentialOfficer, GrantOfficer, EmployerContact, BillingClerk, Instructor]
    code: 200
    input: ["agreement_id?", "cohort_id?", "status?", "limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []

  - method: POST
    path: "/ct/invoices/{id}/issue"
    description: "Issue an invoice (DRAFT -> ISSUED)"
    roles: [BillingClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: ["cohort.billing_status -> INVOICED; agreement.billing_status -> PARTIALLY_BILLED"]

  - method: POST
    path: "/ct/invoices/{id}/mark_paid"
    description: "Mark an invoice paid (ISSUED -> PAID)"
    roles: [BillingClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: ["cohort.billing_status -> PAID; Employer.lifetime_billed_cents += net_due_cents; agreement may -> SETTLED"]

  - method: POST
    path: "/ct/invoices/{id}/void"
    description: "Void an invoice (DRAFT/ISSUED -> VOID)"
    roles: [BillingClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status -> VOID; cohort.billing_status INVOICED -> UNBILLED"]

  # --- OutcomeReport ---
  - method: POST
    path: "/ct/training-agreements/{id}/outcome-reports"
    description: "Create an OutcomeReport (status = DRAFT); agreement must be IN_DELIVERY or later"
    roles: [WorkforceCoordinator]
    code: 201
    input: [completers_employed_90d, satisfaction_avg, follow_on_opportunity_cents]
    output: OutcomeReport
    side_effects: ["status=DRAFT; agreement must be IN_DELIVERY (ERR_INVALID_STATE)"]

  - method: GET
    path: "/ct/outcome-reports/{id}"
    description: "Get an OutcomeReport"
    roles: [CollegeAdmin, WorkforceCoordinator, CredentialOfficer, GrantOfficer, EmployerContact, BillingClerk, Instructor]
    code: 200
    input: []
    output: OutcomeReport
    side_effects: []

  - method: POST
    path: "/ct/outcome-reports/{id}/submit"
    description: "Submit an OutcomeReport (DRAFT -> SUBMITTED); requires all cohorts terminal"
    roles: [WorkforceCoordinator]
    code: 200
    input: []
    output: OutcomeReport
    side_effects: ["status -> SUBMITTED; placement_pct computed"]

  - method: POST
    path: "/ct/outcome-reports/{id}/accept"
    description: "Accept an OutcomeReport (SUBMITTED -> ACCEPTED); completes the agreement"
    roles: [CollegeAdmin]
    code: 200
    input: []
    output: OutcomeReport
    side_effects: ["status -> ACCEPTED; Employer.follow_on_pipeline_cents += follow_on_opportunity_cents; agreement -> COMPLETED when all cohorts terminal"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not allowed for endpoint, or entity-backed ownership check failed (EmployerContact not the agreement's employer; Instructor not CONFIRMED-assigned to the session)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, invalid enum value, end_at <= start_at, attended_hours > session.hours, duplicate open application per cohort+program, cohort count >= max_cohorts" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a state from which the transition exists (generic invalid transition, incl. duplicate transitions, terminal lockdown, cohort create/launch on unsigned agreement path variants not otherwise specialized)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match the parent entity's current version" }
  - { id: ERR_AGREEMENT_NOT_SIGNED, http: 409, condition: "Cohort create/launch requires agreement contract_status IN {SIGNED, IN_DELIVERY}" }
  - { id: ERR_AGREEMENT_TERMINAL, http: 409, condition: "Operation targets an agreement in COMPLETED or CANCELLED" }
  - { id: ERR_ASSESSMENT_NOT_APPROVED, http: 409, condition: "Quote or pin-refresh requires the linked assessment to be APPROVED" }
  - { id: ERR_STALE_ASSESSMENT, http: 409, condition: "At sign time the assessment's current version differs from assessment_version_pinned" }
  - { id: ERR_QUOTE_EXPIRED, http: 409, condition: "Sign/negotiate after quote_expires_at" }
  - { id: ERR_DELIVERY_MODE_MISMATCH, http: 409, condition: "Cohort delivery_mode differs from agreement delivery_mode, or session venue kind inconsistent with cohort mode (ON_CAMPUS requires CAMPUS_LAB, ON_SITE requires EMPLOYER_SITE)" }
  - { id: ERR_BELOW_MIN_ENROLLMENT, http: 409, condition: "Cohort launch with enrolled_count < min_enrollment (boundary: enrolled_count == min_enrollment passes)" }
  - { id: ERR_VENUE_CAPACITY_EXCEEDED, http: 409, condition: "CAMPUS_LAB venue capacity < enrolled_count at launch" }
  - { id: ERR_CREDENTIAL_EXPIRED, http: 409, condition: "A required credential has expires_on < session.start_at at confirm time" }
  - { id: ERR_CREDENTIAL_MISMATCH, http: 409, condition: "match_score < 80 at confirm, or a PLANNED session lacks any CONFIRMED assignment at cohort launch" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Confirm attempted by the same X-User-ID that proposed the assignment" }
  - { id: ERR_INSTRUCTOR_DOUBLE_BOOKED, http: 409, condition: "Half-open [start_at, end_at) overlap with another CONFIRMED assignment session of the same instructor; touching endpoints (prev.end_at == next.start_at) are allowed" }
  - { id: ERR_VENUE_OVERLAP, http: 409, condition: "Venue booking conflict under closed-interval semantics with a 30-minute turnover buffer: a new session conflicts when start_at < existing.end_at + 30min; exactly 30 minutes after the previous end is allowed" }
  - { id: ERR_DUPLICATE_PARTICIPANT, http: 409, condition: "external_employee_ref already enrolled (completion_status == ENROLLED) on this cohort" }
  - { id: ERR_ATTENDANCE_ALREADY_CLOSED, http: 409, condition: "close_attendance on a session whose attendance is already closed" }
  - { id: ERR_SESSION_NOT_PLANNED, http: 409, condition: "Operation requires a PLANNED session" }
  - { id: ERR_COHORT_NOT_CREDENTIALED, http: 409, condition: "Grant claim requires cohort delivery_status == CREDENTIALED" }
  - { id: ERR_GRANT_PROGRAM_NOT_OPEN, http: 409, condition: "Grant submit requires program status == OPEN" }
  - { id: ERR_GRANT_WINDOW_CLOSED, http: 409, condition: "Submit after application_window_end, or claim after claim_by" }
  - { id: ERR_GRANT_CAPACITY_EXCEEDED, http: 409, condition: "provisional_award_cents > program.available_cents at approve" }
  - { id: ERR_INVOICE_VARIANT_NOT_ALLOWED, http: 409, condition: "PROVISIONAL invoice requires cohort LAUNCHED/IN_PROGRESS; FINAL requires DELIVERED/CREDENTIALED" }
  - { id: ERR_INVOICE_NOT_PAYABLE, http: 409, condition: "mark_paid on an invoice not in ISSUED" }
  - { id: ERR_NO_COMPLETERS, http: 409, condition: "issue_credentials with completer_count == 0" }
  - { id: ERR_OUTCOME_INCOMPLETE, http: 409, condition: "Outcome report submit while any cohort is in a non-terminal delivery_status" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CollegeAdmin
    description: "College workforce-division administrator; owns configuration (programs, venues, instructors), approves assessments and outcome reports, sets the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /ct/_clock/set_current_utc"
      - "POST /ct/grant-programs and /suspend /reopen /close"
      - "POST /ct/instructors"
      - "POST /ct/instructors/{id}/deactivate and /reactivate"
      - "POST /ct/venues"
      - "POST /ct/needs-assessments/{id}/approve and /request_revision"
      - "POST /ct/outcome-reports/{id}/accept"
    shared_operations:
      - "POST /ct/employers (with WorkforceCoordinator)"
      - "POST /ct/training-agreements/{id}/cancel (with WorkforceCoordinator)"
      - "POST /ct/cohorts/{id}/cancel (with WorkforceCoordinator)"
      - "All GET endpoints"

  - name: WorkforceCoordinator
    description: "Runs the employer pipeline: assessments, agreements, quotes, cohorts, sessions, rosters; proposes instructor assignments; submits and claims grant applications"
    identity: opaque
    exclusive_operations:
      - "POST /ct/employers/{id}/needs-assessments and /submit"
      - "POST /ct/employers/{id}/training-agreements, /quote, /revise, /refresh_assessment_pin"
      - "POST /ct/training-agreements/{id}/cohorts, /launch, cohort sessions, participants, /drop"
      - "POST /ct/sessions/{id}/instructor-assignments (propose only — never confirm own proposal)"
      - "POST /ct/cohorts/{id}/grant-applications, /submit, /claim"
    shared_operations:
      - "POST /ct/employers (with CollegeAdmin)"
      - "POST /ct/training-agreements/{id}/cancel and /ct/cohorts/{id}/cancel (with CollegeAdmin)"
      - "POST /ct/sessions/{id}/cancel"
      - "POST /ct/instructor-assignments/{id}/release (with CredentialOfficer)"
      - "POST /ct/training-agreements/{id}/outcome-reports and /submit"
      - "All GET endpoints"

  - name: CredentialOfficer
    description: "Compliance gate for instructor credentialing; confirms assignments and issues completion credentials. Segregation of duties: may not confirm an assignment proposed by the same X-User-ID"
    identity: opaque
    exclusive_operations:
      - "POST /ct/instructor-assignments/{id}/confirm"
      - "POST /ct/cohorts/{id}/issue_credentials"
    shared_operations:
      - "POST /ct/instructor-assignments/{id}/release (with WorkforceCoordinator)"
      - "All GET endpoints"

  - name: GrantOfficer
    description: "State grant counterpart: reviews, approves, returns, denies applications; disburses reimbursement"
    identity: opaque
    exclusive_operations:
      - "POST /ct/grant-applications/{id}/start_review, /return, /approve, /deny, /mark_paid"
    shared_operations:
      - "All GET endpoints"

  - name: EmployerContact
    description: "Employer-side signatory; negotiates and signs agreements for the employer it belongs to"
    identity: "entity_backed:Employer"
    exclusive_operations:
      - "POST /ct/training-agreements/{id}/negotiate"
      - "POST /ct/training-agreements/{id}/sign"
    shared_operations:
      - "All GET endpoints (own employer scope)"

  - name: BillingClerk
    description: "Generates, issues, settles, and voids cohort invoices"
    identity: opaque
    exclusive_operations:
      - "POST /ct/cohorts/{id}/invoices"
      - "POST /ct/invoices/{id}/issue, /mark_paid, /void"
    shared_operations:
      - "All GET endpoints"

  - name: Instructor
    description: "Delivers sessions; closes attendance on sessions where the instructor holds a CONFIRMED assignment (X-User-ID == instructor_id of that assignment)"
    identity: "entity_backed:Instructor"
    exclusive_operations:
      - "POST /ct/sessions/{id}/close_attendance"
    shared_operations:
      - "All GET endpoints"
