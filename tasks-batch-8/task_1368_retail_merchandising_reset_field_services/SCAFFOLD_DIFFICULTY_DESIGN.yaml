  - rule_id: compensating_invariant
    instances:
      - name: store_list_count_conserved_under_cancel_and_drop
        grounds:
          - state_machines.Assignment.SCHEDULED_to_CANCELLED
          - state_machines.ProjectStore.ASSIGNED_to_DROPPED
        distinguishing_aspect: |
          Conserved quantity #1: store-list cardinality —
          count(ProjectStore with status != DROPPED) + count(DROPPED) is
          invariant under cancel/drop compensation, and
          count(status == ASSIGNED) after a cancel returns to its
          pre-assignment value (assigned_rep_id cleared, store PENDING).
          Assignment-cancel followed by store-drop leaves the non-DROPPED
          count exactly one lower than before the drop, with zero ASSIGNMENT
          rows in non-terminal states for that store.
        test_recipe:
          setup:
            - "Two-store project SCOPED; store A ASSIGNED to rep; store B PENDING"
          setup_api_calls:
            - call: "POST /retail-reset/clients"
              payload: { name: "Inv Client", billing_model: "PER_STORE", per_store_rate_cents: 3500 }
              as: ProjectManager
              captures: { client_id: "$.data.id" }
