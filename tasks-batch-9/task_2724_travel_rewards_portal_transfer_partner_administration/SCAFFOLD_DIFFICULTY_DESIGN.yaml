  - rule_id: priority_pair_validation_conflict
    instances:
      - name: priority_posture_locked_outranks_below_min_transfer
        grounds:
          - validations[priority=42]
          - validations[priority=65]
          - errors.ERR_ACCOUNT_POSTURE_LOCKED
          - errors.ERR_BELOW_MIN_TRANSFER
        distinguishing_aspect: |
          Category pair `state` (priority 42, ERR_ACCOUNT_POSTURE_LOCKED, 409) versus
          `business_constraint` (priority 65, ERR_BELOW_MIN_TRANSFER, 422) on
          POST /rewards/transfer-requests. Both predicates are false in the same call and the
          lower-numbered state check must win, so the response is 409 ERR_ACCOUNT_POSTURE_LOCKED
          and never the 422.
        test_recipe:
          setup:
            - "One CORE account holding 20000 points whose posture has been driven to LOCKED by a CONFIRMED FraudCase."
            - "One ACTIVE PartnerAgreement whose min_transfer_points is 5000 and transfer_increment_points is 1000."
            - "The account's current version is read after the lock so the OCC check at priority 36 cannot fire first."
          setup_api_calls:
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/merchant-categories"
              payload: { mcc_code: "5411", display_name: "Grocery Stores", base_category: "GROCERY", base_multiplier: 1.0, is_fallback: false }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/accounts"
              payload: { cardholder_name: "Ravi Lund", email: "ravi@example.com", card_product_code: "CORE", enrolled_at: "2025-02-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { a_id: $.data.id }
            - call: "POST /rewards/transactions"
