        distinguishing_aspect: "Customer is entity_backed, so the role check passes (Customer may open returns) and ownership fails: X-User-ID belonging to customer B against customer A's order yields 403 ERR_NOT_OWNER, a different error id from the ERR_UNAUTHORIZED a wrong role would get."
