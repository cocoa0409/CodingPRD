            - "both variant fields agree in this fixture: fraud_score_rolling_window == fraud_score_lifetime_weighted for each retailer, because every item sits in decay bucket 0 and inside the 90-day window"
            - "Retailer.${ret1_id}.last_rescored_at == 2026-08-01T00:00:00Z"

      - name: sample_threshold_forty_inclusive_vs_fortyone
        grounds:
          - calculations.lot_sample_size
          - entities.SubmissionLot.fields.sample_size
          - entities.SubmissionLot.fields.valuation_variant
          - endpoints.POST./submissions/{id}/lots
        distinguishing_aspect: |
          SAMPLE_THRESHOLD_QTY is inclusive on the FULL_COUNT side, and the step
          is enormous: counted_qty 40 keeps sample_size 40 and variant
          FULL_COUNT, counted_qty 41 flips to sample_size ceil_div(410, 100) == 5
          and variant SAMPLED_EXTRAPOLATION. Three lots created on one submission
          at counted_qty 39, 40 and 41 pin threshold-1, threshold and
          threshold+1 in a single pass, and because sample_size is written at lot
          creation the boundary is observable without capturing a single image.
          A `<` comparison would give counted_qty 40 a sample_size of 4.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z default; offer face 50, expiration 2026-12-31, grace 30 so nothing is near the grace boundary"
            - "submission declared 120 / verified 120, so 39 + 40 + 41 == 120 exactly closes it to SORTED on the third lot"
