            - {call: "POST /false-alarm-program/alarm-sites", payload: {address_key: "2507-PB-31-LEDGER-AVE", street_address: "31 Ledger Ave", city: "Fairview", zip_code: "44012", occupancy_class: "COMMERCIAL", police_beat: "B03"}, as: PermitClerk, captures: {site_b: $.data.id}}
            - {call: "POST /false-alarm-program/site-contacts", payload: {alarm_site_id: "${site_b}", full_name: "Rita Cole", phone_number: "+15550103102", relationship: "MANAGER", contact_priority: 1, is_ecv_callable: true}, as: PermitClerk, captures: {bc1: $.data.id}}
            - {call: "POST /false-alarm-program/site-contacts", payload: {alarm_site_id: "${site_b}", full_name: "Sam Cole", phone_number: "+15550103103", relationship: "KEYHOLDER", contact_priority: 2, is_ecv_callable: true}, as: PermitClerk, captures: {bc2: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-systems", payload: {alarm_site_id: "${site_b}", monitoring_company_id: "${company_b}", system_type: "BURGLARY", zone_count: 12, ecv_enabled: true, verified_response_mode: "NONE", installed_at: "2025-12-15T00:00:00Z"}, as: ProgramAdministrator, captures: {sys_pb: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-systems/${sys_pb}/approve-registration", payload: {}, as: PermitClerk, captures: {permit_pb: $.data.id}}
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-01-02T00:00:00Z"}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/_program-runs/nightly", payload: {}, as: ProgramAdministrator}
