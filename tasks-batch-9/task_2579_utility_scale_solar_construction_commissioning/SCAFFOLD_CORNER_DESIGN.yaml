  - section: calculations
    instances:
      - name: performance_ratio_is_computed_from_raw_measurements_and_ignores_the_variant
        claim_type: correct_result
        grounds:
          - calculations.performance_ratio_result
          - entities.CommissioningTest.fields.reported_performance_ratio
          - entities.Project.fields.guaranteed_performance_ratio
        distinguishing_aspect: "reported_performance_ratio is 161.00 / 221.00 = 0.7285 at four decimals — the sums are taken over RAW measurements with a single final rounding, and correction_variant is ignored for PERFORMANCE_RATIO tests even when the test declares WEATHER_CORRECTED."
        test_recipe:
          setup:
            - "One project with dc_capacity_kw 130 and guaranteed_performance_ratio 0.69, and an ENERGIZED substation (clock at 2026-08-10T02:00:00Z)"
            - "One IN_PROGRESS WEATHER_CORRECTED PERFORMANCE_RATIO test holding three intervals: (800 W/m2, 76.00 kW), (900 W/m2, 85.00 kW) and an invalid (500 W/m2, 10.00 kW)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: UtilityCoordinator
            - call: "POST /solar/projects"
              payload: { name: "Ratio Mesa", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { proj: $.data.id }
            - call: "POST /solar/projects/${proj}/substations"
              payload: { substation_code: "S1", interconnection_voltage_kv: 138.0, mv_collection_km: 12.5 }
              as: UtilityCoordinator
              captures: { sub: $.data.id }
            - call: "POST /solar/substations/${sub}/outage-windows"
              payload: { start_at: "2026-08-10T00:00:00Z", end_at: "2026-08-10T04:00:00Z", purpose: "BACKFEED" }
              as: UtilityCoordinator
              captures: { ow: $.data.id }
            - call: "POST /solar/outage-windows/${ow}/utility-response"
              payload: { decision: "APPROVE", utility_reference: "SO-4471" }
              as: UtilityCoordinator
            - call: "POST /solar/substations/${sub}/status-advances"
              payload: { to_status: "STEEL_ERECTED", utility_witness_ref: "W-1" }
              as: UtilityCoordinator
            - call: "POST /solar/substations/${sub}/status-advances"
              payload: { to_status: "EQUIPMENT_SET", utility_witness_ref: "W-2" }
              as: UtilityCoordinator
            - call: "POST /solar/substations/${sub}/status-advances"
              payload: { to_status: "BACKFEED_REQUESTED", utility_witness_ref: "W-3" }
              as: UtilityCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-10T02:00:00Z" }
              as: UtilityCoordinator
            - call: "POST /solar/substations/${sub}/status-advances"
              payload: { to_status: "ENERGIZED", utility_witness_ref: "W-4" }
              as: UtilityCoordinator
            - call: "GET /solar/projects/${proj}"
              payload: {}
              as: CommissioningEngineer
              captures: { pv: $.data.version }
            - call: "POST /solar/commissioning-tests"
              payload: { project_id: "${proj}", test_type: "PERFORMANCE_RATIO", correction_variant: "WEATHER_CORRECTED", scheduled_at: "2026-08-10T02:30:00Z", expected_project_version: "${pv}" }
              as: CommissioningEngineer
              captures: { test: $.data.id }
            - call: "POST /solar/commissioning-tests/${test}/intervals"
              payload: { sampled_at: "2026-08-10T02:35:00Z", irradiance_w_m2: 800, measured_kw_ac: 76.00, ambient_c: 30, wind_m_s: 3.0 }
              as: CommissioningEngineer
              captures: { iv1_valid: $.data.is_valid }
            - call: "POST /solar/commissioning-tests/${test}/intervals"
              payload: { sampled_at: "2026-08-10T02:40:00Z", irradiance_w_m2: 900, measured_kw_ac: 85.00, ambient_c: 30, wind_m_s: 3.0 }
              as: CommissioningEngineer
              captures: { iv2_valid: $.data.is_valid }
            - call: "POST /solar/commissioning-tests/${test}/intervals"
              payload: { sampled_at: "2026-08-10T02:45:00Z", irradiance_w_m2: 500, measured_kw_ac: 10.00, ambient_c: 30, wind_m_s: 3.0 }
              as: CommissioningEngineer
              captures: { iv3_valid: $.data.is_valid }
          trigger:
            - call: "POST /solar/commissioning-tests/${test}/finalization"
              payload: {}
              as: CommissioningEngineer
              captures: { pr: $.data.reported_performance_ratio, st: $.data.status, vc: $.data.valid_interval_count, ic: $.data.interval_count, kw: $.data.reported_kw_ac }
          assert:
            - "${iv1_valid} == true, ${iv2_valid} == true and ${iv3_valid} == false (500 < MIN_IRRADIANCE_W_M2 600)"
            - "${vc} == 2 and ${ic} == 3"
            - "${pr} == 0.7285 — numerator 76.00 + 85.00 == 161.00, denominator 130 * 0.8 + 130 * 0.9 == 221.00, rounded once to four decimals"
            - "the 500 W/m2 sample is excluded from BOTH sums: including it would give 171.00 / 286.00 == 0.5979 and flip the verdict"
            - "${st} == PASSED because 0.7285 >= 0.69"
            - "${kw} is null — the capacity fields are not populated by a PERFORMANCE_RATIO test, and the declared WEATHER_CORRECTED variant changed nothing"

