              as: Perfusionist
              as_user_id: "${p1}"
              captures: { chk_a: $.data.id }
            - call: "POST /bypass-cases/${case1}/pump-checklists"
              payload: { check_results: [ { check_code: "ACT_BASELINE", passed: true, note: "ok" }, { check_code: "CIRCUIT_INTEGRITY", passed: true, note: "ok" }, { check_code: "GAS_LINE", passed: true, note: "ok" } ], blood_management_protocol: "ANTIFIBRINOLYTIC", hematocrit_pct: 18 }
              as: Perfusionist
              as_user_id: "${p1}"
              captures: { chk_b: $.data.id }
            - call: "POST /bypass-cases/${case1}/pump-checklists"
              payload: { check_results: [ { check_code: "ACT_BASELINE", passed: true, note: "ok" }, { check_code: "CIRCUIT_INTEGRITY", passed: true, note: "ok" }, { check_code: "GAS_LINE", passed: true, note: "ok" } ], blood_management_protocol: "STANDARD", hematocrit_pct: 21 }
              as: Perfusionist
              as_user_id: "${p1}"
              captures: { chk_c: $.data.id }
            - call: "POST /bypass-cases/${case1}/pump-checklists"
