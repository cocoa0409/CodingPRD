scenario: |
  Airline Crew Scheduling: FAA Duty Time, Pairing construction, Bidding/Reserve,
  Deadhead, Sick Call, union rules, Crew Rest minimum interval, Trip Trade.

domain_name: "airline-crew-scheduling"
api_prefix: "/crew-scheduling"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - dual_variant_calculation
    - selector_policy

  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate

  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CrewMember
    parent: null
    common_fields: true
    fields:
      - name: employee_no
        type: string
        source: input
        description: Unique employee identifier assigned by HR.
        constraints: "Unique; pattern ^E\\d{6}$."
      - name: rank
        type: enum
        source: input
        description: Crew rank category.
        constraints: "Enum: CAPTAIN, FIRST_OFFICER, PURSER, FLIGHT_ATTENDANT."
      - name: base_airport
        type: string
        source: input
        description: IATA code of the crew member's home base.
        constraints: "3-letter IATA code."
      - name: union_seniority_number
        type: integer
        source: input
        description: Union seniority rank used for bid awarding (lower = more senior).
        constraints: "> 0; unique within rank."
      - name: union_local_id
        type: string
        source: input
        description: ID of the union local the crew member belongs to.
      - name: status
        type: enum
        source: computed
        description: Current employment/availability status.
        default: ACTIVE
        constraints: "Enum: ACTIVE, ON_SICK_CALL, ON_LEAVE, INACTIVE."
      - name: cumulative_duty_minutes_7d
        type: integer
        source: computed
        description: Sum of duty minutes from all assigned duty periods in the rolling 7-day window ending now.
        default: 0
      - name: cumulative_block_minutes_30d
        type: integer
        source: computed
        description: Sum of scheduled block minutes across the rolling 30-day window ending now.
        default: 0
      - name: last_duty_end_at
        type: datetime
        source: computed
        description: End timestamp of the most recent completed duty period (used for crew rest interval).
        default: null

  - name: Pairing
    parent: null
    common_fields: true
    fields:
      - name: pairing_code
        type: string
        source: input
        description: Human-readable pairing identifier (e.g., P-2026-0517-001).
        constraints: "Unique."
      - name: base_airport
        type: string
        source: input
        description: Base airport the pairing departs from and returns to.
      - name: start_at
        type: datetime
        source: computed
        description: UTC start of the first duty period in the pairing.
      - name: end_at
        type: datetime
        source: computed
        description: UTC end of the last duty period in the pairing.
      - name: required_rank_composition
        type: object
        source: input
        description: Required headcount per rank (e.g., {CAPTAIN:1, FIRST_OFFICER:1, FLIGHT_ATTENDANT:3}).
      - name: total_block_minutes
        type: integer
        source: computed
        description: Sum of scheduled block_minutes across all flight legs (excludes deadheads).
        default: 0
      - name: total_duty_minutes
        type: integer
        source: computed
        description: Sum of duty_minutes across all DutyPeriod children.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Pairing lifecycle state.
        default: DRAFT
        constraints: "Enum: DRAFT, PUBLISHED, BIDDING_OPEN, AWARDED, IN_PROGRESS, CLOSED, CANCELLED."

  - name: DutyPeriod
    parent: Pairing
    common_fields: false
    fields:
      - name: pairing_id
        type: string
        source: input
        description: FK to parent Pairing.id.
      - name: sequence_no
        type: integer
        source: input
        description: 1-based ordinal within the pairing.
        constraints: ">= 1; unique within pairing."
      - name: report_at
        type: datetime
        source: input
        description: UTC report time (start of duty).
      - name: release_at
        type: datetime
        source: input
        description: UTC release time (end of duty).
      - name: duty_minutes
        type: integer
        source: computed
        description: release_at minus report_at in minutes.
      - name: block_minutes
        type: integer
        source: computed
        description: Sum of FlightLeg.block_minutes for non-deadhead legs in this duty period.
        default: 0

  - name: FlightLeg
    parent: DutyPeriod
    common_fields: false
    fields:
      - name: duty_period_id
        type: string
        source: input
        description: FK to parent DutyPeriod.id.
      - name: leg_sequence_no
        type: integer
        source: input
        description: 1-based ordinal within the duty period.
        constraints: ">= 1; unique within duty period."
      - name: flight_number
        type: string
        source: input
        description: Flight identifier (e.g., AA1234).
      - name: dep_airport
        type: string
        source: input
        description: IATA code.
      - name: arr_airport
        type: string
        source: input
        description: IATA code.
      - name: dep_at
        type: datetime
        source: input
        description: UTC scheduled departure.
      - name: arr_at
        type: datetime
        source: input
        description: UTC scheduled arrival.
      - name: block_minutes
        type: integer
        source: computed
        description: arr_at minus dep_at in minutes.
      - name: leg_type
        type: enum
        source: input
        description: Whether the leg counts as flying or transport-only deadhead.
        default: REVENUE
        constraints: "Enum: REVENUE, DEADHEAD."

  - name: Bid
    parent: null
    common_fields: true
    fields:
      - name: crew_member_id
        type: string
        source: input
        description: FK to CrewMember.id submitting the bid.
      - name: pairing_id
        type: string
        source: input
        description: FK to Pairing.id being bid on.
      - name: preference_rank
        type: integer
        source: input
        description: Bidder's preference order (1 = highest) within their bid set.
        constraints: ">= 1; unique per (crew_member_id, bid_window)."
      - name: bid_window_id
        type: string
        source: input
        description: Identifier of the open bidding window the bid belongs to.
      - name: status
        type: enum
        source: computed
        description: Outcome of the bid after the awarding sweep.
        default: SUBMITTED
        constraints: "Enum: SUBMITTED, AWARDED, NOT_AWARDED, WITHDRAWN."

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - name: pairing_id
        type: string
        source: input
        description: FK to Pairing.id.
      - name: crew_member_id
        type: string
        source: input
        description: FK to CrewMember.id.
      - name: assigned_rank_slot
        type: enum
        source: input
        description: Which rank slot the crew member fills in the pairing.
        constraints: "Enum: CAPTAIN, FIRST_OFFICER, PURSER, FLIGHT_ATTENDANT."
      - name: source
        type: enum
        source: input
        description: How the assignment was made.
        constraints: "Enum: BID_AWARD, RESERVE_CALLOUT, TRADE, ADMIN_OVERRIDE."
      - name: status
        type: enum
        source: computed
        description: Assignment lifecycle state.
        default: SCHEDULED
        constraints: "Enum: SCHEDULED, IN_PROGRESS, COMPLETED, RELEASED, NO_SHOW."
      - name: scheduled_block_minutes
        type: integer
        source: computed
        description: Snapshot of Pairing.total_block_minutes at assignment time.
      - name: actual_block_minutes
        type: integer
        source: computed
        description: Sum of FlightLeg.block_minutes for REVENUE legs actually flown by this crew member; finalized at COMPLETED.
        default: 0
      - name: pay_credit_minutes
        type: integer
        source: computed
        description: Final credited block minutes after applying minimum-credit floor and deadhead pay rule.
        default: 0

  - name: ReservePool
    parent: null
    common_fields: true
    fields:
      - name: crew_member_id
        type: string
        source: input
        description: FK to CrewMember.id on reserve.
        constraints: "Unique per (crew_member_id, reserve_date)."
      - name: reserve_date
        type: datetime
        source: input
        description: Calendar date (UTC midnight-aligned) of reserve availability.
      - name: standby_start_at
        type: datetime
        source: input
        description: UTC start of the standby block.
      - name: standby_end_at
        type: datetime
        source: input
        description: UTC end of the standby block.
      - name: state
        type: enum
        source: computed
        description: Reserve availability state.
        default: AVAILABLE
        constraints: "Enum: AVAILABLE, CALLED_OUT, RELEASED, EXPIRED."

  - name: SickCall
    parent: null
    common_fields: false
    fields:
      - name: crew_member_id
        type: string
        source: input
        description: FK to CrewMember.id reporting sick.
      - name: assignment_id
        type: string
        source: input
        description: FK to Assignment.id being vacated (nullable if no current assignment).
        default: null
      - name: reported_at
        type: datetime
        source: system
        description: Server-stamped UTC timestamp when sick call was registered.
      - name: effective_from
        type: datetime
        source: input
        description: UTC start of the sick-out period.
      - name: expected_return_at
        type: datetime
        source: input
        description: UTC expected return-to-duty time.
      - name: covered_by_assignment_id
        type: string
        source: computed
        description: New Assignment.id created from reserve callout that covers the vacated slot.
        default: null

  - name: TradeRequest
    parent: null
    common_fields: true
    fields:
      - name: initiator_assignment_id
        type: string
        source: input
        description: FK to Assignment.id offered by the initiator.
      - name: counterparty_assignment_id
        type: string
        source: input
        description: FK to Assignment.id offered by the counterparty.
      - name: initiator_id
        type: string
        source: input
        description: FK to CrewMember.id initiating the trade.
      - name: counterparty_id
        type: string
        source: input
        description: FK to CrewMember.id who must accept.
      - name: state
        type: enum
        source: computed
        description: Trade lifecycle state.
        default: PROPOSED
        constraints: "Enum: PROPOSED, COUNTER_PROPOSED, ACCEPTED, REJECTED, APPROVED, EXECUTED, EXPIRED, CANCELLED."
      - name: revision_count
        type: integer
        source: computed
        description: Number of counter-proposal rounds executed.
        default: 0

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Pairing
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /pairings/{id}/publish"
        actor: CrewScheduler
        preconditions:
          - "Pairing has >=1 DutyPeriod with >=1 FlightLeg."
          - "Pairing.total_duty_minutes recomputed and stored."
          - "Pairing.start_at and end_at recomputed from min(report_at) / max(release_at)."
        side_effects:
          - "Recompute Pairing.total_block_minutes (sum of REVENUE FlightLeg.block_minutes)."
          - "Recompute Pairing.total_duty_minutes (sum of DutyPeriod.duty_minutes)."

      - from: PUBLISHED
        to: BIDDING_OPEN
        trigger: "POST /pairings/{id}/open-bidding"
        actor: CrewScheduler
        preconditions:
          - "Pairing.start_at >= now + 24h."
        side_effects:
          - "Bids referencing this pairing become acceptable."

      - from: BIDDING_OPEN
        to: AWARDED
        trigger: "POST /bid-windows/{id}/award"
        actor: CrewScheduler
        preconditions:
          - "Bid window closed."
        side_effects:
          - "Award by ascending CrewMember.union_seniority_number among SUBMITTED bids for this pairing."
          - "Create Assignment(source=BID_AWARD) for each awarded rank slot."
          - "Update awarded Bid.status=AWARDED; remaining bids on the pairing -> NOT_AWARDED."

      - from: AWARDED
        to: IN_PROGRESS
        trigger: "POST /_clock/advance (clock crosses Pairing.start_at)"
        actor: system
        preconditions:
          - "now >= Pairing.start_at."
          - "All required rank slots have an Assignment in SCHEDULED."
        side_effects:
          - "All SCHEDULED Assignment rows on this pairing -> IN_PROGRESS."

      - from: IN_PROGRESS
        to: CLOSED
        trigger: "POST /_clock/advance (clock crosses Pairing.end_at)"
        actor: system
        preconditions:
          - "now >= Pairing.end_at."
        side_effects:
          - "Each IN_PROGRESS Assignment on this pairing -> COMPLETED."
          - "For each completed Assignment, run pay_credit_calc to compute pay_credit_minutes."

      - from: BIDDING_OPEN
        to: CANCELLED
        trigger: "POST /pairings/{id}/cancel"
        actor: CrewScheduler
        preconditions:
          - "Pairing.status in {DRAFT, PUBLISHED, BIDDING_OPEN, AWARDED}."
        side_effects:
          - "All SUBMITTED bids on this pairing -> NOT_AWARDED."
          - "Any AWARDED bids on this pairing -> NOT_AWARDED, and their Assignments -> RELEASED."

      - from: AWARDED
        to: CANCELLED
        trigger: "POST /pairings/{id}/cancel"
        actor: CrewScheduler
        preconditions:
          - "Pairing.status=AWARDED."
        side_effects:
          - "All AWARDED Assignment rows -> RELEASED."
          - "For each released Assignment, debit CrewMember.cumulative_block_minutes_30d by scheduled_block_minutes (compensation)."
          - "For each released Assignment, debit CrewMember.cumulative_duty_minutes_7d by Pairing.total_duty_minutes if Pairing.end_at within 7d."

  - entity: Bid
    initial_state: SUBMITTED
    terminal_states: [AWARDED, NOT_AWARDED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "DELETE /bids/{id}"
        actor: Pilot
        preconditions:
          - "Bid.crew_member_id == X-User-ID."
          - "Pairing.status == BIDDING_OPEN."
        side_effects: []

      - from: SUBMITTED
        to: AWARDED
        trigger: "POST /bid-windows/{id}/award"
        actor: system
        preconditions:
          - "Bid is the seniority-winner among SUBMITTED bids for the rank slot."
          - "CrewMember would not breach FAA duty/rest limits if assigned (faa_compliance_check passes)."
        side_effects:
          - "Create Assignment(source=BID_AWARD)."
          - "Increment CrewMember.cumulative_block_minutes_30d by Pairing.total_block_minutes (only the portion within rolling 30d window from Pairing.start_at)."

      - from: SUBMITTED
        to: NOT_AWARDED
        trigger: "POST /bid-windows/{id}/award"
        actor: system
        preconditions:
          - "Not seniority-winner OR faa_compliance_check would fail."
        side_effects: []

  - entity: Assignment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, RELEASED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: RELEASED
        trigger: "POST /assignments/{id}/release (e.g., sick call, trade approval, pairing cancel)"
        actor: CrewScheduler
        preconditions:
          - "Assignment.status == SCHEDULED."
        side_effects:
          - "If released due to sick call: open ReservePool callout for the rank slot (run reserve_selection_calc)."
          - "Debit CrewMember.cumulative_block_minutes_30d by Assignment.scheduled_block_minutes if Pairing.start_at within rolling 30d."
          - "Debit CrewMember.cumulative_duty_minutes_7d by Pairing.total_duty_minutes if Pairing.end_at within rolling 7d."

      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /_clock/advance (Pairing transitions DRAFT/AWARDED->IN_PROGRESS)"
        actor: system
        preconditions:
          - "Parent Pairing.status == IN_PROGRESS."
        side_effects: []

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /assignments/{id}/mark-no-show"
        actor: CrewScheduler
        preconditions:
          - "now >= Pairing.start_at."
          - "CrewMember did not check in."
        side_effects:
          - "Open ReservePool callout for the rank slot (run reserve_selection_calc)."
          - "Update CrewMember.status remains ACTIVE; pay_credit not granted for this assignment."

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /_clock/advance (Pairing transitions IN_PROGRESS->CLOSED)"
        actor: system
        preconditions:
          - "Parent Pairing.status == CLOSED."
        side_effects:
          - "Compute Assignment.actual_block_minutes from completed REVENUE legs."
          - "Compute Assignment.pay_credit_minutes via pay_credit_calc."
          - "Set CrewMember.last_duty_end_at = max(last_duty_end_at, Pairing.end_at)."

  - entity: TradeRequest
    initial_state: PROPOSED
    terminal_states: [EXECUTED, EXPIRED, CANCELLED, REJECTED]
    transitions:
      - from: PROPOSED
        to: COUNTER_PROPOSED
        trigger: "POST /trade-requests/{id}/counter"
        actor: Pilot
        preconditions:
          - "Acting user == counterparty_id."
          - "revision_count < 3."
          - "TradeRequest.state == PROPOSED."
        side_effects:
          - "Swap initiator_assignment_id and counterparty_assignment_id with new offer."
          - "Increment revision_count by 1."
          - "Swap initiator_id and counterparty_id roles (counterparty becomes the new proposer)."

      - from: COUNTER_PROPOSED
        to: PROPOSED
        trigger: "POST /trade-requests/{id}/counter"
        actor: Pilot
        preconditions:
          - "Acting user == counterparty_id (the original initiator after the previous swap)."
          - "revision_count < 3."
          - "TradeRequest.state == COUNTER_PROPOSED."
        side_effects:
          - "Swap assignment ids and roles again; increment revision_count by 1 (cyclic loop allowed up to 3 rounds)."

      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /trade-requests/{id}/accept"
        actor: Pilot
        preconditions:
          - "Acting user == counterparty_id."
          - "TradeRequest.state == PROPOSED."
        side_effects: []

      - from: COUNTER_PROPOSED
        to: ACCEPTED
        trigger: "POST /trade-requests/{id}/accept"
        actor: Pilot
        preconditions:
          - "Acting user == counterparty_id."
          - "TradeRequest.state == COUNTER_PROPOSED."
        side_effects: []

      - from: PROPOSED
        to: REJECTED
        trigger: "POST /trade-requests/{id}/reject"
        actor: Pilot
        preconditions:
          - "Acting user == counterparty_id."
        side_effects: []

      - from: COUNTER_PROPOSED
        to: REJECTED
        trigger: "POST /trade-requests/{id}/reject"
        actor: Pilot
        preconditions:
          - "Acting user == counterparty_id."
        side_effects: []

      - from: ACCEPTED
        to: APPROVED
        trigger: "POST /trade-requests/{id}/approve"
        actor: CrewScheduler
        preconditions:
          - "Both assignments still SCHEDULED."
          - "trade_legality_check passes for both crew members (FAA + rank slot + same union local OR cross-local with union_steward_check)."
        side_effects: []

      - from: APPROVED
        to: EXECUTED
        trigger: "system finalize (within same approve request)"
        actor: system
        preconditions: []
        side_effects:
          - "Swap Assignment.crew_member_id between initiator_assignment_id and counterparty_assignment_id."
          - "Recompute cumulative_block_minutes_30d for both crew members."
          - "Recompute cumulative_duty_minutes_7d for both crew members."

      - from: PROPOSED
        to: CANCELLED
        trigger: "DELETE /trade-requests/{id}"
        actor: Pilot
        preconditions:
          - "Acting user == initiator_id."
        side_effects: []

      - from: PROPOSED
        to: EXPIRED
        trigger: "POST /_clock/advance (24h after created_at)"
        actor: system
        preconditions:
          - "now >= TradeRequest.created_at + 24h."
          - "TradeRequest.state in {PROPOSED, COUNTER_PROPOSED}."
        side_effects: []

  - entity: ReservePool
    initial_state: AVAILABLE
    terminal_states: [CALLED_OUT, RELEASED, EXPIRED]
    transitions:
      - from: AVAILABLE
        to: CALLED_OUT
        trigger: "POST /reserve-pool/{id}/call-out (or system, via reserve_selection_calc)"
        actor: CrewScheduler
        preconditions:
          - "now within [standby_start_at, standby_end_at]."
          - "CrewMember.status == ACTIVE."
          - "faa_compliance_check passes for the candidate Pairing."
        side_effects:
          - "Create Assignment(source=RESERVE_CALLOUT) linking this CrewMember to the vacated Pairing slot."
          - "Update SickCall.covered_by_assignment_id (if callout was triggered by a sick call)."
          - "Increment CrewMember.cumulative_block_minutes_30d by Pairing.total_block_minutes."

      - from: AVAILABLE
        to: EXPIRED
        trigger: "POST /_clock/advance (clock passes standby_end_at)"
        actor: system
        preconditions:
          - "now > standby_end_at."
        side_effects: []

      - from: AVAILABLE
        to: RELEASED
        trigger: "POST /reserve-pool/{id}/release"
        actor: CrewScheduler
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two CrewSchedulers run bid-award sweep on the same window concurrently"
    guarantee: "Awarding sweep executes exactly once per bid window; second call rejected"
    error_id: ERR_BID_WINDOW_ALREADY_AWARDED
    http_status: 409
    serialization: "First-writer-wins on Pairing.status transition BIDDING_OPEN -> AWARDED"

  - scenario: "Two reserve callouts target the same vacated pairing slot simultaneously"
    guarantee: "At most one Assignment(source=RESERVE_CALLOUT) is created per (pairing_id, assigned_rank_slot); second call rejected"
    error_id: ERR_SLOT_ALREADY_COVERED
    http_status: 409
    serialization: "First-writer-wins on Assignment row insertion keyed by (pairing_id, assigned_rank_slot)"

  - scenario: "Trade approval and sick call on the same assignment occur simultaneously"
    guarantee: "Whichever transitions the Assignment first wins; the other gets a state error"
    error_id: ERR_INVALID_ASSIGNMENT_STATE
    http_status: 409
    serialization: "First-writer-wins on Assignment.status field"

  - scenario: "Two pilots submit bids racing the bid-window-close instant"
    guarantee: "Bids whose write commits before the BIDDING_OPEN -> AWARDED transition succeed; later bids rejected"
    error_id: ERR_BID_WINDOW_CLOSED
    http_status: 409
    serialization: "First-writer-wins on Pairing.status field"

  - scenario: "Two trade-counter-proposals on the same request from the same actor"
    guarantee: "OCC on TradeRequest.version; stale version rejected"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "Optimistic concurrency control via TradeRequest.version"

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: faa_duty_rest_check
    trigger: "Before any Assignment creation (bid award, reserve callout, trade execution, admin override)."
    algorithm: threshold
    formula: |
      # All checks must pass; first failure raises ERR_FAA_DUTY_VIOLATION
      # 1) Crew rest: candidate.report_at - CrewMember.last_duty_end_at >= CREW_REST_MIN_MINUTES
      # 2) 7-day duty cap: CrewMember.cumulative_duty_minutes_7d + Pairing.total_duty_minutes <= MAX_DUTY_MINUTES_7D
      # 3) 30-day block cap: CrewMember.cumulative_block_minutes_30d + Pairing.total_block_minutes <= MAX_BLOCK_MINUTES_30D
      # 4) Single duty period cap: every DutyPeriod.duty_minutes in pairing <= MAX_DUTY_MINUTES_SINGLE
      # All four conditions use >= / <= boundaries inclusive. The first inequality that
      # evaluates false is the one reported.
    input_set: "CrewMember (with cumulative counters), Pairing (with totals), all DutyPeriod children."
    constants:
      CREW_REST_MIN_MINUTES: 600          # 10 hours
      MAX_DUTY_MINUTES_7D: 3600           # 60 hours
      MAX_BLOCK_MINUTES_30D: 6000         # 100 hours
      MAX_DUTY_MINUTES_SINGLE: 840        # 14 hours
    precision: "Integer minutes; no rounding."

  - name: pay_credit_calc
    trigger: "When Assignment transitions IN_PROGRESS -> COMPLETED (system, at Pairing close)."
    algorithm: aggregation
    formula: |
      # Step 1: revenue_minutes = sum(FlightLeg.block_minutes WHERE leg_type=REVENUE for crew member)
      # Step 2: deadhead_minutes = sum(FlightLeg.block_minutes WHERE leg_type=DEADHEAD for crew member)
      # Step 3: deadhead_credit = floor(deadhead_minutes * DEADHEAD_PAY_RATIO)
      #   (Pin: multiply integer minutes by ratio, then floor; do NOT round per-leg first.)
      # Step 4: raw_credit = revenue_minutes + deadhead_credit
      # Step 5: pay_credit_minutes = max(raw_credit, MIN_PAY_CREDIT_FLOOR_MINUTES)
      #
      # Step 3 ordering is pinned: aggregate-then-floor, not floor-per-leg-then-sum.
      # Two legs of 35 min DEADHEAD each at ratio 0.5 -> aggregate=35 (floor(70*0.5)),
      # NOT 34 (floor(35*0.5)+floor(35*0.5)=17+17=34).
    input_set: "All FlightLeg rows under all DutyPeriod rows of the pairing whose Assignment belongs to the crew member."
    constants:
      DEADHEAD_PAY_RATIO: 0.5
      MIN_PAY_CREDIT_FLOOR_MINUTES: 240   # 4-hour minimum credit per pairing
    precision: "Integer minutes; pin floor after aggregation."
    variants:
      - name: scheduled
        when: "Read via GET /assignments/{id}/pay-credit-estimate before COMPLETED."
        difference: |
          Uses ALL FlightLeg rows in the pairing as if they were flown (forward-looking).
          Does not apply MIN_PAY_CREDIT_FLOOR_MINUTES (estimate is purely the formula
          on scheduled legs).
      - name: actual
        when: "Computed when Assignment transitions to COMPLETED."
        difference: |
          Uses only FlightLeg rows in DutyPeriods whose release_at <= Pairing.end_at and
          whose Assignment had status IN_PROGRESS at release time (chronological filter:
          excludes legs cancelled / not flown because of an intra-pairing sick call).
          Applies MIN_PAY_CREDIT_FLOOR_MINUTES floor.
          Result MAY differ from scheduled variant when a leg is dropped.

  - name: reserve_selection_calc
    trigger: "When a vacated rank slot on a Pairing must be filled (sick call, no-show, cancel-and-recover)."
    algorithm: weighted_scoring
    formula: |
      # Eligibility (all must hold):
      #   ReservePool.state == AVAILABLE
      #   now in [standby_start_at, standby_end_at]
      #   CrewMember.rank matches the vacated assigned_rank_slot
      #   CrewMember.base_airport == Pairing.base_airport
      #   faa_duty_rest_check passes for the candidate against the Pairing
      # Ranking key (ascending, lower wins):
      #   primary: CrewMember.cumulative_block_minutes_30d (least-used first)
      #   tie-break 1: CrewMember.union_seniority_number (more senior wins, lower number)
      #   tie-break 2: CrewMember.created_at (older wins)
      # Empty-pool fallback:
      #   raise ERR_NO_RESERVE_AVAILABLE; SickCall.covered_by_assignment_id stays null;
      #   Pairing remains AWARDED but with an uncovered slot until a manual ADMIN_OVERRIDE.
    input_set: "All ReservePool rows on reserve_date matching the pairing day."
    constants: {}
    precision: "Integer comparison; no rounding."

  - name: trade_legality_check
    trigger: "Before TradeRequest transitions ACCEPTED -> APPROVED."
    algorithm: constraint_propagation
    formula: |
      # Both legs of the swap must independently pass faa_duty_rest_check
      # against the OTHER crew member's pairing.
      # Additional union rules:
      #   1) Both crew members must hold the same rank.
      #   2) assigned_rank_slot must match for both Assignments (after swap).
      #   3) If crew members are in different union_local_id, both legs require
      #      that a UnionSteward (one per affected local) has called POST /trade-requests/{id}/union-bless
      #      before approval (segregation of duties: a CrewScheduler cannot bless).
      # Compensating invariant: the SUM of CrewMember.cumulative_block_minutes_30d
      # across the two crew members BEFORE the trade equals the SUM AFTER the trade.
      # (The named conserved quantity is sum_block_30d_both = m1.block_30d + m2.block_30d.)
    input_set: "TradeRequest (both assignment ids), the two Assignments, the two Pairings, both CrewMembers, any UnionStewardBlessing records."
    constants: {}
    precision: "Boolean checks; sums in integer minutes."

  - name: bid_award_calc
    trigger: "POST /bid-windows/{id}/award (BIDDING_OPEN -> AWARDED on every pairing in the window)."
    algorithm: chronological
    formula: |
      # For each Pairing in window, for each rank slot required:
      #   candidates = Bids on this pairing in SUBMITTED whose
      #     CrewMember.rank == required rank slot
      #     and CrewMember.status == ACTIVE
      #   sort candidates ascending by CrewMember.union_seniority_number
      #   iterate in sorted order; for each candidate:
      #     if faa_duty_rest_check would pass for (candidate, pairing): award and break
      #     else: skip (their bid -> NOT_AWARDED with reason FAA), continue
      # If the loop completes without an award, slot remains uncovered and
      # the pairing keeps moving to AWARDED state with the awarded slots that succeeded.
      # Tie-break on union_seniority_number is impossible (unique).
      # Pin: pairings are processed in ascending Pairing.start_at order, then ascending
      # Pairing.created_at as secondary tie-break. This matters because awarding earlier
      # pairings raises the candidate's cumulative_block_minutes_30d / cumulative_duty_minutes_7d
      # counters, which can disqualify them for later pairings in the same sweep.
    input_set: "All Pairings in BIDDING_OPEN whose bid_window_id equals the awarded window; all SUBMITTED Bids on those pairings."
    constants: {}
    precision: "Integer counters; ordering is pinned."
    variants:
      - name: seniority_first
        when: "Default awarding policy."
        difference: |
          Candidates ranked by union_seniority_number alone, then FAA check applied last.
          A senior bidder who fails FAA simply yields to the next senior bidder.
      - name: load_balanced
        when: "Set via Pairing.required_rank_composition having flag bid_award_mode=LOAD_BALANCED
          (recorded in Pairing.required_rank_composition object as {mode:'LOAD_BALANCED'})."
        difference: |
          Candidates ranked first by CrewMember.cumulative_block_minutes_30d ASCENDING,
          then by union_seniority_number ASCENDING. Same FAA check still applies.
          Identical Bids can yield different awards under the two variants because
          a high-seniority bidder with high recent block hours loses to a junior bidder
          with low block hours under load_balanced; the seniority_first variant awards
          the senior bidder.

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty."
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of {CrewScheduler, Pilot, FlightAttendant, UnionSteward}."
    error_id: ERR_AUTH_INVALID_ROLE
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "X-User-Role permitted for this endpoint per §1.7."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 4
    category: existence
    check: "Path-referenced resources exist (Pairing, Assignment, Bid, etc.), validated left-to-right."
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: existence
    check: "Body-referenced foreign keys (crew_member_id, pairing_id, etc.) resolve to existing rows."
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /bids, POST /reserve-pool, POST /trade-requests, POST /sick-calls, POST /assignments"

  - priority: 6
    category: state
    check: "Target resource in a state where the requested operation is defined."
    error_id: ERR_INVALID_ASSIGNMENT_STATE
    http_status: 409
    applies_to: "POST /assignments/{id}/release, POST /assignments/{id}/mark-no-show, POST /trade-requests/{id}/accept, etc."

  - priority: 7
    category: state
    check: "Pairing in correct state for action (e.g., must be BIDDING_OPEN for bid submission)."
    error_id: ERR_PAIRING_INVALID_STATE
    http_status: 409
    applies_to: "POST /bids, POST /pairings/{id}/open-bidding, POST /pairings/{id}/cancel, POST /bid-windows/{id}/award"

  - priority: 8
    category: state
    check: "TradeRequest.state matches the action transition (e.g., must be ACCEPTED for approve)."
    error_id: ERR_INVALID_TRADE_STATE
    http_status: 409
    applies_to: "POST /trade-requests/{id}/*"

  - priority: 9
    category: business_safety
    check: "FAA crew rest interval >= CREW_REST_MIN_MINUTES (boundary inclusive)."
    error_id: ERR_FAA_CREW_REST_VIOLATION
    http_status: 422
    applies_to: "POST /bid-windows/{id}/award, POST /reserve-pool/{id}/call-out, POST /trade-requests/{id}/approve, POST /assignments"

  - priority: 10
    category: business_safety
    check: "FAA 7-day duty cap and 30-day block cap not exceeded; per-DutyPeriod single-period cap respected."
    error_id: ERR_FAA_DUTY_VIOLATION
    http_status: 422
    applies_to: "POST /bid-windows/{id}/award, POST /reserve-pool/{id}/call-out, POST /trade-requests/{id}/approve, POST /assignments"

  - priority: 11
    category: business_referential
    check: "Trade legality: identical ranks, matching assigned_rank_slot, same union local OR UnionSteward blessings present."
    error_id: ERR_TRADE_RULE_VIOLATION
    http_status: 422
    applies_to: "POST /trade-requests/{id}/approve"

  - priority: 12
    category: business_temporal
    check: "ReservePool callout occurs strictly within [standby_start_at, standby_end_at] (start inclusive, end exclusive)."
    error_id: ERR_RESERVE_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /reserve-pool/{id}/call-out"

  - priority: 13
    category: business_temporal
    check: "Bid submission occurs strictly before Pairing.start_at - 24h (inclusive)."
    error_id: ERR_BID_TOO_LATE
    http_status: 422
    applies_to: "POST /bids"

  - priority: 14
    category: business_constraint
    check: "Pairing's DutyPeriod sequence has no overlap and inter-period rest >= CREW_REST_MIN_MINUTES."
    error_id: ERR_PAIRING_INTERNAL_OVERLAP
    http_status: 422
    applies_to: "POST /pairings/{id}/publish, POST /pairings/{id}/duty-periods"

  - priority: 15
    category: business_constraint
    check: "FlightLeg dep_at < arr_at; sequential legs in a DutyPeriod have arr_at <= next dep_at (no buffer enforced inside duty period)."
    error_id: ERR_FLIGHT_LEG_INVALID
    http_status: 422
    applies_to: "POST /duty-periods/{id}/flight-legs"

  - priority: 16
    category: business_constraint
    check: "preference_rank unique within (crew_member_id, bid_window_id)."
    error_id: ERR_DUPLICATE_BID_PREFERENCE
    http_status: 409
    applies_to: "POST /bids"

  - priority: 17
    category: business_constraint
    check: "CrewMember.status == ACTIVE for any award, callout, trade execution."
    error_id: ERR_CREW_NOT_AVAILABLE
    http_status: 422
    applies_to: "POST /bids, POST /reserve-pool/{id}/call-out, POST /trade-requests/{id}/approve, POST /assignments"

  - priority: 18
    category: business_constraint
    check: "Body fields conform to declared types and constraints (e.g., IATA 3-letter, employee_no pattern)."
    error_id: ERR_VALIDATION_FAILED
    http_status: 400
    applies_to: all

  - priority: 19
    category: business_referential
    check: "OCC version on PATCH/PUT mutations matches current entity version."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "PATCH /trade-requests/{id}, PATCH /assignments/{id}, PATCH /pairings/{id}"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # Crew member
  - method: POST
    path: "/crew-members"
    description: "Register a new crew member."
    roles: [CrewScheduler]
    code: 201
    input: [employee_no, rank, base_airport, union_seniority_number, union_local_id]
    output: CrewMember
    side_effects: []

  - method: GET
    path: "/crew-members/{id}"
    description: "Get crew member with computed cumulative counters."
    roles: [CrewScheduler, Pilot, FlightAttendant, UnionSteward]
    code: 200
    input: []
    output: CrewMember
    side_effects: []

  - method: GET
    path: "/crew-members"
    description: "List crew members; supports filter by rank/base_airport/status."
    roles: [CrewScheduler]
    code: 200
    input: []
    output: CrewMember[]
    side_effects: []

  # Pairing construction
  - method: POST
    path: "/pairings"
    description: "Create a Pairing in DRAFT state."
    roles: [CrewScheduler]
    code: 201
    input: [pairing_code, base_airport, required_rank_composition]
    output: Pairing
    side_effects: []

  - method: POST
    path: "/pairings/{id}/duty-periods"
    description: "Append a DutyPeriod to a DRAFT pairing."
    roles: [CrewScheduler]
    code: 201
    input: [sequence_no, report_at, release_at]
    output: DutyPeriod
    side_effects:
      - "Recompute Pairing.total_duty_minutes and Pairing.start_at / end_at."

  - method: POST
    path: "/duty-periods/{id}/flight-legs"
    description: "Append a FlightLeg to a DutyPeriod of a DRAFT pairing."
    roles: [CrewScheduler]
    code: 201
    input: [leg_sequence_no, flight_number, dep_airport, arr_airport, dep_at, arr_at, "leg_type?"]
    output: FlightLeg
    side_effects:
      - "Recompute DutyPeriod.block_minutes and Pairing.total_block_minutes."

  - method: POST
    path: "/pairings/{id}/publish"
    description: "Move pairing DRAFT -> PUBLISHED."
    roles: [CrewScheduler]
    code: 200
    input: []
    output: Pairing
    side_effects:
      - "Pairing totals recomputed and frozen."

  - method: POST
    path: "/pairings/{id}/open-bidding"
    description: "Move PUBLISHED -> BIDDING_OPEN."
    roles: [CrewScheduler]
    code: 200
    input: [bid_window_id]
    output: Pairing
    side_effects: []

  - method: POST
    path: "/pairings/{id}/cancel"
    description: "Cancel pairing in DRAFT/PUBLISHED/BIDDING_OPEN/AWARDED states; releases assignments."
    roles: [CrewScheduler]
    code: 200
    input: []
    output: Pairing
    side_effects:
      - "AWARDED assignments -> RELEASED; cumulative counters debited."

  - method: GET
    path: "/pairings/{id}"
    description: "Retrieve a pairing with computed totals."
    roles: [CrewScheduler, Pilot, FlightAttendant, UnionSteward]
    code: 200
    input: []
    output: Pairing
    side_effects: []

  - method: GET
    path: "/pairings"
    description: "List pairings; filter by status/base_airport."
    roles: [CrewScheduler, Pilot, FlightAttendant, UnionSteward]
    code: 200
    input: []
    output: Pairing[]
    side_effects: []

  # Bidding
  - method: POST
    path: "/bids"
    description: "Pilot/FA submits a bid on a BIDDING_OPEN pairing."
    roles: [Pilot, FlightAttendant]
    code: 201
    input: [pairing_id, preference_rank, bid_window_id]
    output: Bid
    side_effects: []

  - method: DELETE
    path: "/bids/{id}"
    description: "Withdraw a SUBMITTED bid (only by its owner)."
    roles: [Pilot, FlightAttendant]
    code: 204
    input: []
    output: null
    side_effects: []

  - method: POST
    path: "/bid-windows/{id}/award"
    description: "Run awarding sweep across all BIDDING_OPEN pairings in the window."
    roles: [CrewScheduler]
    code: 200
    input: []
    output: "object"
    side_effects:
      - "bid_award_calc runs (chronological, pairing-by-pairing in pinned order)."
      - "Pairings BIDDING_OPEN -> AWARDED; Bids SUBMITTED -> AWARDED or NOT_AWARDED."
      - "Assignments (source=BID_AWARD) created; cumulative counters incremented."

  # Reserve pool
  - method: POST
    path: "/reserve-pool"
    description: "Place a crew member on reserve for a specific date and standby window."
    roles: [CrewScheduler]
    code: 201
    input: [crew_member_id, reserve_date, standby_start_at, standby_end_at]
    output: ReservePool
    side_effects: []

  - method: POST
    path: "/reserve-pool/{id}/call-out"
    description: "Manually call out a specific reserve crew member to cover a pairing slot."
    roles: [CrewScheduler]
    code: 201
    input: [pairing_id, assigned_rank_slot, "sick_call_id?"]
    output: Assignment
    side_effects:
      - "ReservePool AVAILABLE -> CALLED_OUT."
      - "New Assignment(source=RESERVE_CALLOUT) created."
      - "If sick_call_id provided, SickCall.covered_by_assignment_id set."
      - "CrewMember.cumulative_block_minutes_30d incremented."

  - method: POST
    path: "/reserve-pool/{id}/release"
    description: "Release a reserve crew member (manual)."
    roles: [CrewScheduler]
    code: 200
    input: []
    output: ReservePool
    side_effects: []

  - method: GET
    path: "/reserve-pool"
    description: "List reserve pool entries; filter by reserve_date / state."
    roles: [CrewScheduler]
    code: 200
    input: []
    output: ReservePool[]
    side_effects: []

  # Sick call
  - method: POST
    path: "/sick-calls"
    description: "Crew member reports sick; system auto-runs reserve_selection_calc to cover assignment."
    roles: [Pilot, FlightAttendant, CrewScheduler]
    code: 201
    input: [crew_member_id, "assignment_id?", effective_from, expected_return_at]
    output: SickCall
    side_effects:
      - "CrewMember.status -> ON_SICK_CALL."
      - "If assignment_id provided and Assignment.status == SCHEDULED, release assignment."
      - "Auto reserve_selection_calc runs; on match, create Assignment(source=RESERVE_CALLOUT)."
      - "If no match, SickCall.covered_by_assignment_id remains null; ERR_NO_RESERVE_AVAILABLE returned (HTTP 201 still — sick call recorded, but Pairing has uncovered slot)."

  - method: GET
    path: "/sick-calls/{id}"
    description: "Read a sick call record."
    roles: [CrewScheduler, Pilot, FlightAttendant]
    code: 200
    input: []
    output: SickCall
    side_effects: []

  # Assignment
  - method: POST
    path: "/assignments"
    description: "Admin override — directly create an Assignment without going through bid or reserve."
    roles: [CrewScheduler]
    code: 201
    input: [pairing_id, crew_member_id, assigned_rank_slot]
    output: Assignment
    side_effects:
      - "faa_duty_rest_check enforced."
      - "Assignment.source = ADMIN_OVERRIDE."
      - "CrewMember.cumulative_block_minutes_30d incremented."

  - method: POST
    path: "/assignments/{id}/release"
    description: "Release a SCHEDULED Assignment (admin action)."
    roles: [CrewScheduler]
    code: 200
    input: []
    output: Assignment
    side_effects:
      - "Cumulative counters debited."

  - method: POST
    path: "/assignments/{id}/mark-no-show"
    description: "Mark a crew member no-show at start of duty."
    roles: [CrewScheduler]
    code: 200
    input: []
    output: Assignment
    side_effects:
      - "Trigger reserve_selection_calc."

  - method: GET
    path: "/assignments/{id}"
    description: "Read an assignment."
    roles: [CrewScheduler, Pilot, FlightAttendant]
    code: 200
    input: []
    output: Assignment
    side_effects: []

  - method: GET
    path: "/assignments/{id}/pay-credit-estimate"
    description: "Forward-looking pay-credit estimate (scheduled variant of pay_credit_calc)."
    roles: [CrewScheduler, Pilot, FlightAttendant]
    code: 200
    input: []
    output: "object {scheduled_pay_credit_minutes:int}"
    side_effects: []

  - method: GET
    path: "/assignments"
    description: "List assignments; filter by crew_member_id / pairing_id / status."
    roles: [CrewScheduler, Pilot, FlightAttendant]
    code: 200
    input: []
    output: Assignment[]
    side_effects: []

  # Trade
  - method: POST
    path: "/trade-requests"
    description: "Initiator proposes a trade between two Assignments."
    roles: [Pilot, FlightAttendant]
    code: 201
    input: [initiator_assignment_id, counterparty_assignment_id, counterparty_id]
    output: TradeRequest
    side_effects: []

  - method: POST
    path: "/trade-requests/{id}/counter"
    description: "Counterparty proposes alternative assignment ids (cyclic, up to 3 revisions)."
    roles: [Pilot, FlightAttendant]
    code: 200
    input: [new_initiator_assignment_id, new_counterparty_assignment_id]
    output: TradeRequest
    side_effects:
      - "Swap initiator/counterparty roles; revision_count++."

  - method: POST
    path: "/trade-requests/{id}/accept"
    description: "Counterparty accepts the current proposal."
    roles: [Pilot, FlightAttendant]
    code: 200
    input: []
    output: TradeRequest
    side_effects: []

  - method: POST
    path: "/trade-requests/{id}/reject"
    description: "Counterparty rejects."
    roles: [Pilot, FlightAttendant]
    code: 200
    input: []
    output: TradeRequest
    side_effects: []

  - method: POST
    path: "/trade-requests/{id}/union-bless"
    description: "UnionSteward blesses a cross-local trade (required for cross-union trades)."
    roles: [UnionSteward]
    code: 200
    input: []
    output: TradeRequest
    side_effects:
      - "Mark UnionStewardBlessing for the steward's union_local_id on this trade."

  - method: POST
    path: "/trade-requests/{id}/approve"
    description: "Scheduler approves an ACCEPTED trade; executes swap atomically."
    roles: [CrewScheduler]
    code: 200
    input: []
    output: TradeRequest
    side_effects:
      - "trade_legality_check runs."
      - "Assignment.crew_member_id swapped on both sides."
      - "Cumulative counters recomputed for both crew members."
      - "TradeRequest.state ACCEPTED -> APPROVED -> EXECUTED."

  - method: DELETE
    path: "/trade-requests/{id}"
    description: "Initiator cancels a PROPOSED trade request."
    roles: [Pilot, FlightAttendant]
    code: 204
    input: []
    output: null
    side_effects: []

  - method: GET
    path: "/trade-requests/{id}"
    description: "Read a trade request."
    roles: [Pilot, FlightAttendant, CrewScheduler, UnionSteward]
    code: 200
    input: []
    output: TradeRequest
    side_effects: []

  # Test-driving endpoints
  - method: POST
    path: "/_clock/advance"
    description: "Advance the server clock to a specific UTC instant; drives all time-gated transitions (Pairing IN_PROGRESS, CLOSED; ReservePool EXPIRED; TradeRequest EXPIRED)."
    roles: [CrewScheduler]
    code: 200
    input: [target_at]
    output: "object {now:ISO8601}"
    side_effects:
      - "Run all time-gated transitions in pinned order: Pairing.AWARDED->IN_PROGRESS, Pairing.IN_PROGRESS->CLOSED (triggers pay_credit_calc per assignment), ReservePool.AVAILABLE->EXPIRED, TradeRequest.PROPOSED->EXPIRED."

  - method: POST
    path: "/_clock/now"
    description: "Read current server clock."
    roles: [CrewScheduler, Pilot, FlightAttendant, UnionSteward]
    code: 200
    input: []
    output: "object {now:ISO8601}"
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "Missing or empty X-User-ID / X-User-Role header."
  - id: ERR_AUTH_INVALID_ROLE
    http: 401
    condition: "X-User-Role value not in allowed set."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for this endpoint per RBAC."
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "Path-referenced resource id not found."
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "Foreign key in body does not resolve."
  - id: ERR_VALIDATION_FAILED
    http: 400
    condition: "Request body field types/constraints fail (e.g., bad IATA code, malformed datetime)."
  - id: ERR_INVALID_ASSIGNMENT_STATE
    http: 409
    condition: "Assignment is not in a state where the action is valid."
  - id: ERR_PAIRING_INVALID_STATE
    http: 409
    condition: "Pairing not in a state for the action (e.g., bid on a CANCELLED pairing)."
  - id: ERR_INVALID_TRADE_STATE
    http: 409
    condition: "TradeRequest not in a state for the requested transition."
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "OCC version mismatch on mutation."
  - id: ERR_BID_WINDOW_CLOSED
    http: 409
    condition: "Bid submission after window closed (or pairing left BIDDING_OPEN)."
  - id: ERR_BID_WINDOW_ALREADY_AWARDED
    http: 409
    condition: "Second award sweep attempted on the same bid window."
  - id: ERR_DUPLICATE_BID_PREFERENCE
    http: 409
    condition: "preference_rank already used by this crew member in the same bid_window."
  - id: ERR_SLOT_ALREADY_COVERED
    http: 409
    condition: "Concurrent reserve callouts: a second Assignment(source=RESERVE_CALLOUT) would duplicate (pairing_id, assigned_rank_slot)."
  - id: ERR_FAA_CREW_REST_VIOLATION
    http: 422
    condition: "Candidate's prior duty release_at to new report_at < CREW_REST_MIN_MINUTES (10h)."
  - id: ERR_FAA_DUTY_VIOLATION
    http: 422
    condition: "7-day duty cap, 30-day block cap, or single-period 14h cap would be exceeded."
  - id: ERR_TRADE_RULE_VIOLATION
    http: 422
    condition: "Trade fails union rules (rank mismatch, slot mismatch, cross-local without blessings)."
  - id: ERR_RESERVE_OUTSIDE_WINDOW
    http: 422
    condition: "Reserve callout attempted outside [standby_start_at, standby_end_at)."
  - id: ERR_NO_RESERVE_AVAILABLE
    http: 422
    condition: "reserve_selection_calc found no eligible candidate."
  - id: ERR_BID_TOO_LATE
    http: 422
    condition: "Bid submission after Pairing.start_at - 24h cutoff."
  - id: ERR_PAIRING_INTERNAL_OVERLAP
    http: 422
    condition: "DutyPeriod overlap or insufficient inter-period rest (< CREW_REST_MIN_MINUTES)."
  - id: ERR_FLIGHT_LEG_INVALID
    http: 422
    condition: "FlightLeg dep_at >= arr_at, or sequential legs overlap inside DutyPeriod."
  - id: ERR_CREW_NOT_AVAILABLE
    http: 422
    condition: "CrewMember.status != ACTIVE for an operation requiring an active crew member."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CrewScheduler
    description: "Operational scheduler; constructs pairings, runs bid awards, manages reserve, approves trades. Cannot bless cross-local trades (SoD: blessing belongs to UnionSteward)."
    identity: opaque
    exclusive_operations:
      - "POST /pairings"
      - "POST /pairings/{id}/duty-periods"
      - "POST /duty-periods/{id}/flight-legs"
      - "POST /pairings/{id}/publish"
      - "POST /pairings/{id}/open-bidding"
      - "POST /pairings/{id}/cancel"
      - "POST /bid-windows/{id}/award"
      - "POST /reserve-pool"
      - "POST /reserve-pool/{id}/call-out"
      - "POST /reserve-pool/{id}/release"
      - "POST /assignments"
      - "POST /assignments/{id}/release"
      - "POST /assignments/{id}/mark-no-show"
      - "POST /trade-requests/{id}/approve"
      - "POST /crew-members"
      - "POST /_clock/advance"
      - "GET /reserve-pool"
      - "GET /crew-members"
    shared_operations:
      - "GET /pairings, /pairings/{id}"
      - "GET /crew-members/{id}"
      - "GET /assignments, /assignments/{id}, /assignments/{id}/pay-credit-estimate"
      - "GET /sick-calls/{id}"
      - "GET /trade-requests/{id}"
      - "POST /sick-calls"
      - "POST /_clock/now"

  - name: Pilot
    description: "Captain or first officer; bids on pairings, reports sick calls, initiates / counters / accepts trades."
    identity: "entity_backed:CrewMember"
    exclusive_operations: []
    shared_operations:
      - "POST /bids (own bids only)"
      - "DELETE /bids/{id} (own bids only)"
      - "POST /sick-calls (own only)"
      - "POST /trade-requests (own only)"
      - "POST /trade-requests/{id}/counter (must be current counterparty)"
      - "POST /trade-requests/{id}/accept (must be counterparty)"
      - "POST /trade-requests/{id}/reject (must be counterparty)"
      - "DELETE /trade-requests/{id} (must be initiator, state=PROPOSED)"
      - "GET /pairings, /pairings/{id}"
      - "GET /crew-members/{id} (own only)"
      - "GET /assignments (own only), /assignments/{id} (own), /assignments/{id}/pay-credit-estimate (own)"
      - "GET /sick-calls/{id} (own only)"
      - "GET /trade-requests/{id} (party only)"
      - "POST /_clock/now"

  - name: FlightAttendant
    description: "Cabin crew (Purser, Flight Attendant); same operations as Pilot but for FLIGHT_ATTENDANT/PURSER ranks."
    identity: "entity_backed:CrewMember"
    exclusive_operations: []
    shared_operations:
      - "POST /bids (own bids only)"
      - "DELETE /bids/{id} (own bids only)"
      - "POST /sick-calls (own only)"
      - "POST /trade-requests (own only)"
      - "POST /trade-requests/{id}/counter (must be current counterparty)"
      - "POST /trade-requests/{id}/accept (must be counterparty)"
      - "POST /trade-requests/{id}/reject (must be counterparty)"
      - "DELETE /trade-requests/{id} (must be initiator, state=PROPOSED)"
      - "GET /pairings, /pairings/{id}"
      - "GET /crew-members/{id} (own only)"
      - "GET /assignments (own only), /assignments/{id} (own), /assignments/{id}/pay-credit-estimate (own)"
      - "GET /sick-calls/{id} (own only)"
      - "GET /trade-requests/{id} (party only)"
      - "POST /_clock/now"

  - name: UnionSteward
    description: "Union local representative. Sole role that can bless a cross-local trade (segregation of duties from CrewScheduler approval). Identity is opaque — operational role keyed by union_local_id passed via X-Union-Local-Id."
    identity: opaque
    exclusive_operations:
      - "POST /trade-requests/{id}/union-bless"
    shared_operations:
      - "GET /trade-requests/{id}"
      - "GET /pairings, /pairings/{id}"
      - "GET /crew-members/{id}"
      - "POST /_clock/now"
