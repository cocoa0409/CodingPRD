            - { call: "POST /api/modification-requests/${m1}/submit", payload: {}, as: GrantCoordinator }
            - { call: "POST /api/modification-requests/${m1}/internal-approve", payload: {}, as: SponsoredProgramsOfficer, captures: { st1: $.data.status } }
            - { call: "GET /api/awards/${aw}", as: GrantsAccountant, captures: { end1: $.data.current_end_date, nce1: $.data.nce_count, v2: $.data.version } }
            - { call: "POST /api/modification-requests", payload: { award_id: "${aw}", mod_type: "NO_COST_EXTENSION", extension_months: 3, justification: "second no-cost extension request here", expected_award_version: "${v2}" }, as: GrantCoordinator, captures: { m2: $.data.id, rs2: $.data.requires_sponsor } }
            - { call: "POST /api/modification-requests/${m2}/submit", payload: {}, as: GrantCoordinator }
