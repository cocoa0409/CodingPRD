  - rule_id: resource_temporal_overlap
    instances:
      - name: stop_loss_policy_period_overlap_half_open_adjacency_allowed
        grounds:
          - validations[priority=8]
          - state_machines.StopLossPolicy.DRAFT_to_ACTIVE
          - entities.StopLossPolicy.fields.effective_date
          - entities.StopLossPolicy.fields.expiry_date
        distinguishing_aspect: |
          Policy periods on one plan use half-open [effective,expiry): activating a second policy
          [2026-06-01,2027-01-01) while an ACTIVE [2026-01-01,2026-12-31) exists overlaps ->
          ERR_POLICY_PERIOD_OVERLAP; but a policy [2026-12-31,2027-06-30) whose start touches the prior
          expiry is adjacency-allowed and activates cleanly.
        test_recipe:
          setup:
            - "Plan with an ACTIVE policy A [2026-01-01,2026-12-31); a DRAFT overlapping policy B [2026-06-01,2027-01-01); a DRAFT adjacent policy C [2026-12-31,2027-06-30)."
          setup_api_calls:
            - call: "POST /plans"
              payload: { sponsor_name: "Acme", sponsor_tax_id: "11-1111111", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", individual_deductible_cents: 100000, oop_max_cents: 500000, plan_coinsurance_pct: 0.80, run_out_days: 90 }
              as: TPAAdmin
