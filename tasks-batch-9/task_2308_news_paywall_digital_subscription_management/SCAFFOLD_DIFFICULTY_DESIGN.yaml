              captures: { seat_e1: "$.data.id" }
            - call: "GET /paywall/group-accounts/${grp_e}"
              payload: {}
              as: GroupAdmin
              as_user_id: "${grp_e}"
              captures: { grp_e_v2: "$.data.version" }
            - call: "POST /paywall/group-accounts/${grp_e}/seats"
              payload: { reader_id: "${re2}", starts_on: "2026-09-10", ends_on: "2026-09-25", expected_group_account_version: "${grp_e_v2}" }
              as: GroupAdmin
              as_user_id: "${grp_e}"
              captures: { seat_e2: "$.data.id" }
            - call: "POST /paywall/seats/${seat_e1}/reclaim"
              payload: {}
              as: GroupAdmin
              as_user_id: "${grp_e}"
          assert:
            - "before the invites GroupAccount.${grp_e}.seats_assigned_count == 0 and seats_available_count == 3"
            - "after both invites the peak concurrency is 2, so seats_assigned_count == 2 and seats_available_count == 1 (2 + 1 == 3)"
            - "Seat.${seat_e1}.status == RECLAIMED"
            - "Seat.${seat_e1}.ends_on == 2026-09-01"
            - "Seat.${seat_e1}.claimed_on == null"
            - "Seat.${seat_e2}.status == INVITED"
            - "GroupAccount.${grp_e}.seats_assigned_count == 1"
            - "GroupAccount.${grp_e}.seats_available_count == 2"
            - "GroupAccount.${grp_e}.seat_capacity == 3"
            - "Reader.${re1}.entitlement_source == NONE"

      - name: hold_credit_money_conserved_across_release_and_sweep
        grounds:
          - calculations.hold_credit_computation
          - calculations.invoice_total_assembly
          - entities.Subscription.fields.pending_credit_cents
          - entities.Subscription.fields.lifetime_credit_cents
          - state_machines.Hold.SCHEDULED_to_RELEASED
        distinguishing_aspect: |
          Conserved quantity = MONEY (credit cents), not a seat count: every cent of
          hold credit is either pending, landed on exactly one invoice, or annihilated
          by a release - a released 450 leaves pending and lifetime at 0, while a
          completed 450 moves out of pending into lifetime and into
          Invoice.credit_line_cents exactly once.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-09-01T00:00:00Z."
            - "ACTIVE PRINT_DIGITAL plan (intro 999 for cycle 1, standard 1899 from cycle 2, print_component_cents 900, 4 deliveries per cycle, SUN delivery, cycle_days 30) -> daily print rate 225."
            - "Subscription ACTIVE with the cycle-1 invoice of 999 PAID, paid_through_on 2026-10-01."
            - "Hold H1 over 2026-09-06..2026-09-13 (2 Sundays -> credit 450) is created and then RELEASED before it ever activates."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/offer-plans"
              payload: { name: "Print + Digital P8", bundle_type: "PRINT_DIGITAL", intro_price_cents: 999, intro_cycles: 1, standard_price_cents: 1899, standard_from_cycle: 2, cycle_days: 30, print_component_cents: 900, print_deliveries_per_cycle: 4, print_delivery_days: ["SUN"] }
              as: RevenueManager
              captures: { plan_p8: "$.data.id" }
            - call: "POST /paywall/offer-plans/${plan_p8}/activate"
              payload: {}
              as: RevenueManager
              captures: { plan_p8_v2: "$.data.version" }
            - call: "POST /paywall/readers"
              payload: { email: "reader12@mail.test", is_registered: true, propensity_band: "MEDIUM" }
              as: SubscriptionOpsAgent
              captures: { rd12: "$.data.id" }
            - call: "POST /paywall/subscriptions"
              payload: { reader_id: "${rd12}", offer_plan_id: "${plan_p8}", expected_offer_plan_version: "${plan_p8_v2}" }
              as: SubscriptionOpsAgent
              captures: { sub12: "$.data.id" }
            - call: "GET /paywall/subscriptions/${sub12}/invoices"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { inv12a: "$.data[0].id" }
            - call: "POST /paywall/invoices/${inv12a}/payment-attempts"
              payload: { outcome: "SUCCEEDED", amount_cents: 999 }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/subscriptions/${sub12}/holds"
              payload: { hold_type: "VACATION_DELIVERY", start_date: "2026-09-06", end_date: "2026-09-13" }
              as: Reader
              as_user_id: "${rd12}"
              captures: { hold12a: "$.data.id" }
            - call: "POST /paywall/holds/${hold12a}/release"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { hold12a_status: "$.data.status" }
          trigger:
            - call: "POST /paywall/subscriptions/${sub12}/holds"
              payload: { hold_type: "VACATION_DELIVERY", start_date: "2026-09-16", end_date: "2026-09-27" }
              as: Reader
              as_user_id: "${rd12}"
              captures: { hold12b: "$.data.id" }
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-16T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/billing-runs"
              payload: { scope: "HOLDS_ONLY" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-28T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/billing-runs"
              payload: { scope: "HOLDS_ONLY" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/billing-runs"
              payload: { scope: "BILLING_ONLY" }
              as: SubscriptionOpsAgent
            - call: "GET /paywall/subscriptions/${sub12}/invoices"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { inv12b: "$.data[1].id" }
          assert:
            - "Hold.${hold12a}.status == RELEASED"
            - "Hold.${hold12a}.credit_cents == 450"
            - "Hold.${hold12a}.credit_applied == false"
            - "Hold.${hold12b}.status == COMPLETED"
            - "Hold.${hold12b}.delivery_days_credited == 2"
            - "Hold.${hold12b}.credit_cents == 450"
            - "Hold.${hold12b}.credit_applied == true"
            - "Hold.${hold12b}.credit_applied_cycle_index == 2"
            - "Invoice.${inv12b}.base_line_cents == 1899"
            - "Invoice.${inv12b}.discount_line_cents == 0"
            - "Invoice.${inv12b}.credit_line_cents == 450"
            - "Invoice.${inv12b}.total_cents == 1449"
            - "Invoice.${inv12b}.status == OPEN"
            - "Subscription.${sub12}.pending_credit_cents == 0"
            - "Subscription.${sub12}.lifetime_credit_cents == 450"
            - "Subscription.${sub12}.print_fulfillment_status == ACTIVE"
            - "Subscription.${sub12}.vacation_days_used_365 == 12"
