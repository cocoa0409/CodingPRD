# =============================================================================
# PRD Benchmark Scaffold — Sod Farm & Turf Supply
# =============================================================================

scenario: "Sod Farm & Turf Supply (regional sod farm): field inventory by variety & maturity, harvest scheduling by weather & order book, pallet yield & slab/roll configuration, same-day delivery & freshness window, installation crew referral & scheduling, re-seeding rotation & field recovery, warranty on establishment & watering compliance, price by square foot with freight zone"

domain_name: "sod-farm-turf-supply"
api_prefix: "/"

complexity_profile:
  primary_archetype: quota_allocation          # finite harvestable sqft + truck capacity competed for by the order book
  secondary_archetype: temporal_windowing      # harvest windows, delivery windows, cutoff deadlines, freshness windows, warranty windows
  complexity_layers:
    - optimistic_concurrency                   # OCC on Field.version guards same-day harvest allocation against the order book
    - cascading_side_effects                   # maturity-scan and crew-deactivate cascades traverse 3 / 2 entity hops
    - dual_variant_calculation                 # tiered-ladder vs additive-flat pricing; cumulative vs strict delivery windows; CARD vs CASH_CHECK
    - derived_field_reconciliation             # Order.chargeable_amount / amount_due / payment_status recomputed by checks and payments
  entity_topology: hybrid                      # flat peers (Field, Customer, Crew, configs) + cross-cutting FK graph (Order hub)
  state_machine_shape: parallel                # Order carries status x payment_status as independent dimensions with an auto-join at CLOSED
  relationship_patterns:
    - one_to_many                              # Field -> HarvestBatch, Order -> Payment/DeliveryCheck/WarrantyClaim
    - cross_aggregate                          # HarvestBatch.order_id, WarrantyClaim.customer_id, Order.quote_id cross aggregate roots
  role_model: peer_roles                       # FarmManager / SalesRep / HarvestSupervisor / FleetManager / Customer own disjoint operations
  consistency_model: immediate                 # all mutations + cascades atomic within the request

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: PriceConfig
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Human label for the rate card" }
      - { name: slab_sqft, type: number, source: input, default: 5, description: "Square feet per slab" }
      - { name: roll_sqft, type: number, source: input, default: 10, description: "Square feet per roll" }
      - { name: pallet_sqft_premium, type: number, source: input, default: 100, description: "Full pallet sqft, grade PREMIUM" }
      - { name: pallet_sqft_standard, type: number, source: input, default: 50, description: "Full pallet sqft, grade STANDARD" }
      - { name: pallet_sqft_economy, type: number, source: input, default: 20, description: "Full pallet sqft, grade ECONOMY" }
      - { name: rate_premium, type: number, source: input, default: 0.855, description: "USD per sqft, grade PREMIUM" }
      - { name: rate_standard, type: number, source: input, default: 0.70, description: "USD per sqft, grade STANDARD" }
      - { name: rate_economy, type: number, source: input, default: 0.50, description: "USD per sqft, grade ECONOMY" }
      - { name: zone1_rate, type: number, source: input, default: 1.20, description: "Freight USD per freight_sqft_unit for zone 1 pallets" }
      - { name: zone2_rate, type: number, source: input, default: 1.80, description: "Freight USD per freight_sqft_unit for zone 2 pallets" }
      - { name: zone3_rate, type: number, source: input, default: 2.60, description: "Freight USD per freight_sqft_unit for zone 3 pallets" }
      - { name: freight_sqft_unit, type: integer, source: input, default: 500, description: "Sqft unit denominator for freight cell rates" }
      - { name: zone_truck_capacity, type: integer, source: input, default: 4, description: "Trucks available per freight zone per overlapping delivery window" }
      - { name: delivery_window_hours, type: integer, source: input, default: 2, description: "Fixed length of a booked delivery window in hours" }
      - { name: delivery_earliest_start_hour, type: integer, source: input, default: 6, description: "Earliest delivery window start hour (06:00)" }
      - { name: delivery_latest_start_hour, type: integer, source: input, default: 16, description: "Latest delivery window start hour (16:00, so window ends by 18:00)" }
      - { name: same_day_cutoff_hours, type: integer, source: input, default: 2, description: "Same-day orders: confirm deadline = order created_at + this many hours" }
      - { name: future_day_cutoff_hour, type: integer, source: input, default: 14, description: "Future-day orders: confirm deadline = day before delivery_date at this hour (14:00)" }
      - { name: freshness_limit_hours, type: number, source: input, default: 24, description: "Max hours from harvest end to delivery before sod is stale" }
      - { name: card_fee_pct, type: number, source: input, default: 0.02, description: "Card processing surcharge fraction, applied to post-discount gross" }
      - { name: cash_discount_pct, type: number, source: input, default: 0.03, description: "CASH_CHECK settlement: flat discount fraction off pre_discount_subtotal (replaces volume tier and card fee)" }
      - { name: volume_t1_turf_min, type: number, source: input, default: 2000, description: "Tier T1 minimum turf_sqft (inclusive)" }
      - { name: volume_t1_pre_min, type: number, source: input, default: 4000, description: "Tier T1 minimum pre_discount_subtotal (inclusive)" }
      - { name: volume_t1_pct, type: number, source: input, default: 0.06, description: "Tier T1 volume discount fraction" }
      - { name: volume_t2_turf_min, type: number, source: input, default: 8000, description: "Tier T2 minimum turf_sqft (inclusive)" }
      - { name: volume_t2_pre_min, type: number, source: input, default: 15000, description: "Tier T2 minimum pre_discount_subtotal (inclusive)" }
      - { name: volume_t2_pct, type: number, source: input, default: 0.15, description: "Tier T2 volume discount fraction" }
      - { name: harvest_earliest_start_hour, type: integer, source: input, default: 6, description: "Harvest actual_start time-of-day lower bound (inclusive, 06:00)" }
      - { name: harvest_latest_end_hour, type: integer, source: input, default: 18, description: "Harvest actual_end time-of-day upper bound (inclusive, 18:00)" }
      - { name: is_current, type: boolean, source: system, default: false, description: "Exactly one PriceConfig has is_current=true: the most recently created; creating a new config sets it true and flips all others false" }

  - name: VarietyConfig
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Turf variety name; unique across VarietyConfig (duplicate -> ERR_INVALID_REQUEST)" }
      - { name: germination_max_days, type: integer, source: input, default: 14, description: "SEEDED maturity while age_days <= this" }
      - { name: growing_max_days, type: integer, source: input, default: 60, description: "GROWING maturity while age_days <= this" }
      - { name: ready_max_days, type: integer, source: input, default: 150, description: "READY maturity while age_days <= this" }
      - { name: mature_max_days, type: integer, source: input, default: 240, description: "MATURE maturity while age_days <= this; older -> OVERAGED" }
      - { name: seed_lbs_per_1000_sqft, type: number, source: input, default: 6, description: "Re-seed application rate (lbs per 1000 sqft)" }

  - name: Field
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Field label" }
      - { name: variety_id, type: string, source: input, description: "FK -> VarietyConfig.id; planted variety" }
      - { name: field_sqft, type: number, source: input, description: "Total plantable square feet; must be > 0" }
      - { name: last_planted_at, type: datetime, source: input, description: "When the current crop was planted/sprigged; drives age_days" }
      - { name: mow_count, type: integer, source: input, description: "Mows this cycle; quality gate requires >= 3", constraints: ">= 0" }
      - { name: last_mowed_at, type: datetime, source: input, description: "Last mow timestamp; quality gate requires < 3 days before harvest batch creation" }
      - { name: soil_moisture_pct, type: number, source: input, description: "Soil moisture percent; quality gate requires 35 <= x <= 55", constraints: "0..100" }
      - { name: health_score, type: number, source: input, description: "Agronomist health score; quality gate requires >= 70", constraints: "0..100" }
      - { name: maturity_state, type: enum, source: computed, description: "SEEDED | GROWING | READY | MATURE | OVERAGED — derived from age_days vs variety windows (see maturity_classification)", constraints: "enum: SEEDED, GROWING, READY, MATURE, OVERAGED" }
      - { name: age_days, type: integer, source: computed, description: "floor((clock now - last_planted_at) / 24h)" }
      - { name: remaining_sqft, type: number, source: system, description: "Unharvested sqft this cycle; initialized to field_sqft at creation and at re-seed completion; decremented by sellable_sqft when a HarvestBatch completes" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | ARCHIVED", constraints: "enum: ACTIVE, ARCHIVED" }

  - name: ReSeedPlan
    parent: Field
    common_fields: true
    fields:
      - { name: field_id, type: string, source: input, description: "FK -> Field.id; field being rotated" }
      - { name: planned_date, type: datetime, source: input, description: "Planned re-seed date" }
      - { name: target_seed_lbs, type: number, source: computed, description: "round2(field_sqft * seed_lbs_per_1000_sqft / 1000)" }
      - { name: actual_seed_lbs, type: number, source: system, description: "Set from payload at complete; must be >= target_seed_lbs" }
      - { name: status, type: enum, source: system, default: PLANNING, description: "PLANNING | IN_PROGRESS | COMPLETED", constraints: "enum: PLANNING, IN_PROGRESS, COMPLETED" }
      - { name: completed_at, type: datetime, source: system, description: "Set on completion" }

  - name: HarvestBatch
    parent: Field
    common_fields: true
    fields:
      - { name: field_id, type: string, source: input, description: "FK -> Field.id; source field" }
      - { name: variety_id, type: string, source: system, description: "FK -> VarietyConfig.id; copied from Field.variety_id at creation" }
      - { name: grade, type: enum, source: input, description: "Harvest grade", constraints: "enum: PREMIUM, STANDARD, ECONOMY" }
      - { name: pallet_count, type: integer, source: input, description: "Pallets cut; >= 1" }
      - { name: shortfall_slabs, type: integer, source: input, description: "Slabs rejected at QC; >= 0" }
      - { name: shortfall_rolls, type: integer, source: input, description: "Rolls rejected at QC; >= 0" }
      - { name: full_sqft, type: number, source: computed, description: "pallet_count * pallet_sqft(grade) from the current PriceConfig" }
      - { name: yield_sqft, type: number, source: computed, description: "full_sqft - shortfall_slabs*slab_sqft - shortfall_rolls*roll_sqft; must be > 0 else ERR_INVALID_REQUEST" }
      - { name: sellable_sqft, type: number, source: computed, description: "Equals yield_sqft (all QC-passing sod is sellable)" }
      - { name: scheduled_date, type: string, source: input, description: "Planned harvest date (YYYY-MM-DD); must be >= current clock date" }
      - { name: actual_harvest_start, type: datetime, source: system, description: "Set from complete payload" }
      - { name: actual_harvest_end, type: datetime, source: system, description: "Set from complete payload; freshness basis" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | COMPLETE | CANCELLED", constraints: "enum: PENDING, COMPLETE, CANCELLED" }
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; set when allocated to an order at confirm; NULL while unallocated" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Customer name" }
      - { name: email, type: string, source: input, description: "Unique across Customers (duplicate -> ERR_INVALID_REQUEST)" }
      - { name: phone, type: string, source: input, description: "Contact phone" }
      - { name: freight_zone, type: integer, source: input, description: "Delivery freight zone", constraints: "1..3 (else ERR_INVALID_REQUEST)" }
      - { name: address, type: string, source: input, description: "Delivery address" }

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Installation crew name" }
      - { name: service_zones, type: array, source: input, description: "Array of integer freight zones the crew serves; each member in 1..3" }
      - { name: active, type: boolean, source: input, default: true, description: "Inactive crews cannot receive new referrals" }

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: price_config_id, type: string, source: system, description: "FK -> PriceConfig.id; snapshot of the is_current config at creation" }
      - { name: delivery_date, type: string, source: input, description: "Requested delivery date (YYYY-MM-DD); must be >= current clock date else ERR_DELIVERY_DATE_TOO_SOON" }
      - { name: settlement_method, type: enum, source: input, description: "CARD | CASH_CHECK", constraints: "enum: CARD, CASH_CHECK" }
      - { name: z1_pallets, type: integer, source: input, description: "Planned route mix: pallets delivered into zone 1; >= 0" }
      - { name: z2_pallets, type: integer, source: input, description: "Zone 2 pallets; >= 0" }
      - { name: z3_pallets, type: integer, source: input, description: "Zone 3 pallets; >= 0" }
      - { name: lines, type: array, source: input, description: "Array of {variety_id, grade, pallet_count, shortfall_slabs, shortfall_rolls}; at least one line; pallet_count >= 1; shortfalls >= 0" }
      - { name: total_pallets, type: integer, source: computed, description: "sum(lines.pallet_count)" }
      - { name: capacity_zone, type: integer, source: computed, description: "Zone consuming truck capacity: argmax over (z1,z2,z3)_pallets; ties broken to the lowest zone number" }
      - { name: turf_sqft, type: number, source: computed, description: "sum over lines of round2(line_yield_sqft * grade_rate) — per-line rounding THEN sum (see turf_contribution)" }
      - { name: freight_amount, type: number, source: computed, description: "round2(turf_sqft * freight_cell(total_pallets, zone split) / freight_sqft_unit) — see freight_cell" }
      - { name: pre_discount_subtotal, type: number, source: computed, description: "turf_sqft + freight_amount" }
      - { name: volume_tier, type: enum, source: computed, description: "T0 | T1 | T2 from volume thresholds evaluated on PRE-discount subtotal", constraints: "enum: T0, T1, T2" }
      - { name: volume_discount, type: number, source: computed, description: "round2(pre_discount_subtotal * tier pct); 0.00 for CASH_CHECK settlement" }
      - { name: card_fee, type: number, source: computed, description: "round2((pre_discount_subtotal - volume_discount) * card_fee_pct); 0.00 for CASH_CHECK" }
      - { name: total_price, type: number, source: computed, description: "CARD: round2(pre - volume_discount + card_fee). CASH_CHECK: cash_price (authoritative for that settlement)" }
      - { name: additive_total, type: number, source: computed, description: "Informational dual variant: CARD -> round2(pre * (1+tier_pct) * (1+card_fee_pct)); CASH_CHECK -> round2(pre * (1 - cash_discount_pct))" }
      - { name: cash_price, type: number, source: computed, description: "Informational dual variant: round2(pre_discount_subtotal * (1 - cash_discount_pct)); no volume tier, no card fee" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACCEPTED | SUPERSEDED | EXPIRED", constraints: "enum: DRAFT, ACCEPTED, SUPERSEDED, EXPIRED" }
      - { name: superseded_by_id, type: string, source: system, description: "Quote.id of the newer DRAFT that superseded this one; NULL unless SUPERSEDED" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: quote_id, type: string, source: system, description: "FK -> Quote.id; unique — one order per accepted quote" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; copied from quote" }
      - { name: price_config_id, type: string, source: system, description: "FK -> PriceConfig.id; copied from quote (snapshot)" }
      - { name: delivery_date, type: string, source: system, description: "Copied from quote" }
      - { name: settlement_method, type: enum, source: system, description: "Copied from quote", constraints: "enum: CARD, CASH_CHECK" }
      - { name: freight_zone, type: integer, source: system, description: "Copied from customer at accept" }
      - { name: capacity_zone, type: integer, source: system, description: "Copied from quote.capacity_zone" }
      - { name: turf_sqft, type: number, source: system, description: "Copied from quote (promised sqft A)" }
      - { name: freight_amount, type: number, source: system, description: "Copied from quote" }
      - { name: pre_discount_subtotal, type: number, source: system, description: "Copied from quote" }
      - { name: volume_tier, type: enum, source: system, description: "Copied from quote", constraints: "enum: T0, T1, T2" }
      - { name: volume_discount, type: number, source: system, description: "Copied from quote" }
      - { name: card_fee, type: number, source: system, description: "Copied from quote" }
      - { name: total_price, type: number, source: system, description: "Copied from quote" }
      - { name: total_pallets, type: integer, source: system, description: "Copied from quote" }
      - { name: delivery_window_start, type: datetime, source: system, description: "Set at confirm from payload; must fall on delivery_date with hour-aligned start in [06:00, 16:00]" }
      - { name: delivery_window_end, type: datetime, source: computed, description: "delivery_window_start + delivery_window_hours" }
      - { name: status, type: enum, source: system, default: PLACED, description: "PLACED | CONFIRMED | OUT_FOR_DELIVERY | DELIVERED | INSTALLING | INSTALLED | CLOSED | CANCELLED", constraints: "enum: PLACED, CONFIRMED, OUT_FOR_DELIVERY, DELIVERED, INSTALLING, INSTALLED, CLOSED, CANCELLED" }
      - { name: payment_status, type: enum, source: system, default: PENDING, description: "PENDING | PAID — independent parallel dimension", constraints: "enum: PENDING, PAID" }
      - { name: crew_referral_status, type: enum, source: system, default: NONE, description: "NONE | CREW_REFERRED | CREW_SCHEDULED", constraints: "enum: NONE, CREW_REFERRED, CREW_SCHEDULED" }
      - { name: allocated_sqft, type: number, source: computed, description: "sum of sellable_sqft over HarvestBatches with order_id == this order and status != CANCELLED" }
      - { name: delivered_sqft, type: number, source: system, description: "Cumulative customer-accepted sqft across mark-delivered calls; 0 before first delivery" }
      - { name: actual_delivered_at, type: datetime, source: system, description: "Timestamp of first mark-delivered" }
      - { name: freshness_hours, type: number, source: computed, description: "Latest delivery: round2-hours(actual delivery time - min(actual_harvest_end) over linked batches)" }
      - { name: install_started_at, type: datetime, source: system, description: "Set at install-start" }
      - { name: installed_at, type: datetime, source: system, description: "Set at install-complete" }
      - { name: chargeable_amount, type: number, source: system, description: "Initially total_price; recomputed by each DeliveryCheck as total_price - shortfall_credit" }
      - { name: total_paid, type: number, source: computed, description: "sum of Payment.amount for the order" }
      - { name: amount_due, type: number, source: computed, description: "max(0, chargeable_amount - total_paid)" }
      - { name: credit_balance, type: number, source: computed, description: "max(0, total_paid - chargeable_amount) — overpayment credit" }
      - { name: delivery_flagged, type: boolean, source: system, default: false, description: "Set true by an out-of-window DeliveryCheck; cleared by an in-window DeliveryCheck" }

  - name: Payment
    parent: Order
    common_fields: false
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id (path)" }
      - { name: amount, type: number, source: input, description: "Must equal the order's current amount_due exactly, else ERR_PAYMENT_AMOUNT_MISMATCH" }
      - { name: method, type: enum, source: input, description: "CHECK | CARD", constraints: "enum: CHECK, CARD" }
      - { name: received_at, type: datetime, source: system, description: "Server clock at creation" }

  - name: DeliveryCheck
    parent: Order
    common_fields: false
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id (path)" }
      - { name: check_index, type: integer, source: computed, description: "1 for the first check on the order, 2 for the second; a third is rejected (ERR_INVALID_STATE)" }
      - { name: promised_sqft, type: number, source: computed, description: "A = order.turf_sqft at check time" }
      - { name: delivered_cumulative, type: number, source: computed, description: "P = order.delivered_sqft at check time" }
      - { name: prior_payments, type: number, source: computed, description: "B = order.total_paid at check time" }
      - { name: baseline_sqft, type: number, source: computed, description: "round2(0.95 * A)" }
      - { name: window_size, type: number, source: computed, description: "round2((baseline_sqft + B) * 0.60) — cumulative weighted window (authoritative)" }
      - { name: in_window, type: boolean, source: computed, description: "P >= window_size (cumulative variant; drives order.delivery_flagged)" }
      - { name: strict_in_window, type: boolean, source: computed, description: "Informational dual variant: latest delivery chunk (delivered_cumulative delta since previous check, or full P for check 1) >= round2(baseline_sqft * 0.60)" }
      - { name: shortfall_sqft, type: number, source: computed, description: "max(0, A - P)" }
      - { name: blended_rate, type: number, source: computed, description: "round4(order.total_price / order.turf_sqft)" }
      - { name: shortfall_credit, type: number, source: computed, description: "round2(shortfall_sqft * blended_rate)" }
      - { name: chargeable_after, type: number, source: computed, description: "order.total_price - shortfall_credit; written to order.chargeable_amount" }

  - name: CrewReferral
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id (path)" }
      - { name: crew_id, type: string, source: input, description: "FK -> Crew.id; crew must be active and serve the customer's freight_zone" }
      - { name: status, type: enum, source: system, default: REFERRED, description: "REFERRED | SCHEDULED | REPLACED", constraints: "enum: REFERRED, SCHEDULED, REPLACED" }
      - { name: scheduled_date, type: string, source: system, description: "Set by crew-schedule" }

  - name: WarrantyClaim
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id (path)" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; copied from order" }
      - { name: weather_case, type: enum, source: input, description: "Weather adjustment bucket for the watering target", constraints: "enum: W1, W2, W3" }
      - { name: eligible_turf_sqft, type: number, source: system, description: "Copied from order.delivered_sqft at claim creation" }
      - { name: target_credits, type: integer, source: computed, description: "W1 -> 500, W2 -> 400, W3 -> 300" }
      - { name: total_credits, type: integer, source: computed, description: "sum of credits_awarded over the claim's WateringLogs" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | COMPLIANT | INSUFFICIENT", constraints: "enum: SUBMITTED, COMPLIANT, INSUFFICIENT" }
      - { name: resolution, type: enum, source: system, default: NONE, description: "NONE | CREDIT_ISSUED | REJECTED", constraints: "enum: NONE, CREDIT_ISSUED, REJECTED" }
      - { name: credit_amount, type: number, source: computed, description: "COMPLIANT -> round2(eligible_turf_sqft * 0.50); INSUFFICIENT -> 0.00" }
      - { name: evaluated_at, type: datetime, source: system, description: "Set at evaluate" }

  - name: WateringLog
    parent: WarrantyClaim
    common_fields: false
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> WarrantyClaim.id (path)" }
      - { name: log_date, type: string, source: input, description: "YYYY-MM-DD; must lie within [installed_at date, installed_at + 30 days] else ERR_INVALID_REQUEST; one log per calendar date per claim (duplicate date -> ERR_INVALID_REQUEST)" }
      - { name: moisture_reading, type: number, source: input, description: "Soil moisture percent 0..100" }
      - { name: credits_awarded, type: integer, source: computed, description: "moisture >= 40 -> 140; 30 <= moisture < 40 -> 120; moisture < 30 -> 60" }

  - name: TruckBlock
    parent: null
    common_fields: true
    fields:
      - { name: freight_zone, type: integer, source: input, description: "Zone whose fleet is blocked", constraints: "1..3" }
      - { name: window_start, type: datetime, source: input, description: "Block start; hour-aligned" }
      - { name: window_end, type: datetime, source: input, description: "Block end; must be > window_start" }
      - { name: reason, type: string, source: input, description: "Maintenance / hold reason", default: "" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Field
    initial_state: ACTIVE
    terminal_states: [ARCHIVED]
    transitions:
      - from: ACTIVE
        to: ARCHIVED
        trigger: "POST /fields/{id}/archive"
        actor: FarmManager
        preconditions:
          - "status == ACTIVE"
          - "no HarvestBatch with field_id == id and status in {PENDING, COMPLETE}"
          - "no ReSeedPlan with field_id == id and status in {PLANNING, IN_PROGRESS}"
        side_effects:
          - "status <- ARCHIVED; version += 1"
        note: "ARCHIVED fields are excluded from GET /fields unless status=ARCHIVED filter is passed."
    # Maturity lifecycle (computed dimension on Field) — cyclic via re-seeding
  - entity: FieldMaturity
    initial_state: SEEDED
    terminal_states: []
    transitions:
      - from: SEEDED
        to: GROWING
        trigger: "system recompute (POST /fields/{id}/maturity-scan, or lazily on read/precondition evaluation)"
        actor: system
        preconditions: ["age_days > variety.germination_max_days"]
        side_effects: ["maturity_state <- GROWING"]
      - from: GROWING
        to: READY
        trigger: "system recompute"
        actor: system
        preconditions: ["age_days > variety.growing_max_days"]
        side_effects: ["maturity_state <- READY"]
      - from: READY
        to: MATURE
        trigger: "system recompute"
        actor: system
        preconditions: ["age_days > variety.ready_max_days"]
        side_effects: ["maturity_state <- MATURE"]
      - from: MATURE
        to: OVERAGED
        trigger: "system recompute"
        actor: system
        preconditions: ["age_days > variety.mature_max_days"]
        side_effects:
          - "maturity_state <- OVERAGED"
          - "CASCADE link 2: every HarvestBatch of this field with status == PENDING becomes CANCELLED (field is no longer harvestable)"
          - "CASCADE link 3: every Order in status CONFIRMED whose allocated_sqft after those cancellations falls below its turf_sqft reverts to PLACED — delivery_window_start/end cleared (capacity released), ALL its batch links removed (order_id <- NULL on remaining COMPLETE batches), allocated_sqft recomputes to 0"
        note: "The OVERAGED hop fires only when the persisted maturity_state actually changes into OVERAGED (conditional cascade). Recompute of maturity_state does NOT increment Field.version."
      - from: OVERAGED
        to: SEEDED
        trigger: "POST /reseed-plans/{id}/complete (cycle reset — see ReSeedPlan)"
        actor: FarmManager
        preconditions: ["the completing ReSeedPlan belongs to this field and is IN_PROGRESS"]
        side_effects:
          - "maturity_state <- SEEDED; last_planted_at <- clock now; remaining_sqft <- field_sqft; mow_count <- 0"
          - "CASCADE: every HarvestBatch of this field with status == PENDING, or status == COMPLETE and order_id IS NULL, becomes CANCELLED (stubble plowed under)"

  - entity: ReSeedPlan
    initial_state: PLANNING
    terminal_states: [COMPLETED]
    transitions:
      - from: PLANNING
        to: IN_PROGRESS
        trigger: "POST /reseed-plans/{id}/start"
        actor: FarmManager
        preconditions: ["status == PLANNING"]
        side_effects: ["status <- IN_PROGRESS; version += 1"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /reseed-plans/{id}/complete"
        actor: FarmManager
        preconditions:
          - "status == IN_PROGRESS"
          - "payload actual_seed_lbs >= target_seed_lbs (else ERR_SEED_SHORTFALL)"
        side_effects:
          - "status <- COMPLETED; completed_at <- now; actual_seed_lbs <- payload"
          - "field maturity cycle hop OVERAGED|MATURE -> SEEDED with the cascade declared on FieldMaturity"

  - entity: HarvestBatch
    initial_state: PENDING
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: PENDING
        to: COMPLETE
        trigger: "POST /harvest-batches/{id}/complete"
        actor: HarvestSupervisor
        preconditions:
          - "status == PENDING"
          - "actual_harvest_start time-of-day >= harvest_earliest_start_hour and actual_harvest_end time-of-day <= harvest_latest_end_hour and actual_harvest_end > actual_harvest_start (else ERR_HARVEST_WINDOW)"
        side_effects:
          - "status <- COMPLETE; actual_harvest_start/end <- payload; version += 1"
          - "field.remaining_sqft <- field.remaining_sqft - sellable_sqft (decrement at completion only; PENDING batches never decrement)"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /harvest-batches/{id}/cancel OR FieldMaturity OVERAGED cascade OR re-seed completion cascade"
        actor: HarvestSupervisor | system
        preconditions:
          - "status == PENDING"
          - "order_id IS NULL for the direct endpoint (linked batches are released only via order cancel/revert cascades)"
        side_effects:
          - "status <- CANCELLED; version += 1"
          - "no change to field.remaining_sqft (PENDING never decremented) — availability accounting stays conserved"

  - entity: Quote
    initial_state: DRAFT
    terminal_states: [ACCEPTED, SUPERSEDED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /quotes (creating a new DRAFT quote for the same customer)"
        actor: SalesRep
        preconditions: ["an existing quote of this customer is in DRAFT"]
        side_effects: ["old quote status <- SUPERSEDED; superseded_by_id <- new quote id; version += 1"]
      - from: DRAFT
        to: ACCEPTED
        trigger: "POST /quotes/{id}/accept"
        actor: SalesRep
        preconditions:
          - "status == DRAFT (SUPERSEDED/EXPIRED -> ERR_INVALID_STATE; actions on terminal quotes -> ERR_ALREADY_TERMINAL)"
          - "delivery_date >= current clock date (else quote auto-transitions to EXPIRED and ERR_QUOTE_EXPIRED is returned)"
        side_effects:
          - "status <- ACCEPTED; version += 1"
          - "create Order (status PLACED, payment_status PENDING) copying quote pricing fields; chargeable_amount <- total_price"
      - from: DRAFT
        to: EXPIRED
        trigger: "system (lazy): any accept attempt when delivery_date < current clock date"
        actor: system
        preconditions: ["delivery_date < current clock date"]
        side_effects: ["status <- EXPIRED; version += 1"]

  - entity: Order
    initial_state: PLACED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      # --- fulfillment dimension (status) ---
      - from: PLACED
        to: CONFIRMED
        trigger: "POST /orders/{id}/confirm"
        actor: SalesRep
        preconditions:
          - "status == PLACED"
          - "clock now < confirm_cutoff(delivery_date, created_at): same-day (delivery_date == clock date) -> created_at + same_day_cutoff_hours; future-day -> (delivery_date - 1 day) at future_day_cutoff_hour — STRICT <, so confirm exactly at the cutoff fails with ERR_CUTOFF_PASSED"
          - "zone capacity: count of orders in {CONFIRMED, OUT_FOR_DELIVERY} with same capacity_zone whose [delivery_window_start, delivery_window_end) overlaps the requested window, plus TruckBlocks in that zone overlapping it, must be < zone_truck_capacity (else ERR_CAPACITY_EXCEEDED); overlap is half-open [start, end) — touching endpoints do NOT overlap"
          - "allocation succeeds (see allocation_selector): per quote line, cumulative sellable_sqft of selected batches >= line yield_sqft; freshness failures -> ERR_BATCH_NOT_FRESH; quantity shortfall -> ERR_ORDER_UNDER_ALLOCATED"
        side_effects:
          - "status <- CONFIRMED; delivery_window_start <- payload; version += 1"
          - "allocation: selected HarvestBatches get order_id <- this order (their status unchanged); allocated_sqft recomputed"
      - from: CONFIRMED
        to: PLACED
        trigger: "system cascade (FieldMaturity OVERAGED)"
        actor: system
        preconditions: ["order lost PENDING batch allocation to an OVERAGED cascade and allocated_sqft < turf_sqft"]
        side_effects:
          - "status <- PLACED; delivery_window_start/end cleared; all batch links removed; allocated_sqft <- 0; version += 1"
      - from: CONFIRMED
        to: OUT_FOR_DELIVERY
        trigger: "POST /orders/{id}/dispatch"
        actor: FleetManager
        preconditions:
          - "status == CONFIRMED"
          - "every linked HarvestBatch has status == COMPLETE (else ERR_INVALID_STATE)"
          - "clock date == delivery_date (else ERR_INVALID_STATE)"
        side_effects: ["status <- OUT_FOR_DELIVERY; version += 1"]
      - from: OUT_FOR_DELIVERY
        to: DELIVERED
        trigger: "POST /orders/{id}/mark-delivered"
        actor: FleetManager
        preconditions:
          - "status in {OUT_FOR_DELIVERY, DELIVERED} (DELIVERED -> DELIVERED is the top-up re-delivery self-loop)"
          - "payload accepted_sqft >= 0 and delivered_sqft + accepted_sqft <= allocated_sqft (else ERR_INVALID_REQUEST)"
          - "freshness: (clock now - min(actual_harvest_end over linked batches)) <= freshness_limit_hours (else ERR_DELIVERY_STALE; order stays OUT_FOR_DELIVERY)"
        side_effects:
          - "status <- DELIVERED; delivered_sqft += accepted_sqft; actual_delivered_at <- now (first delivery only); freshness_hours recomputed; version += 1"
      - from: DELIVERED
        to: DELIVERED
        trigger: "POST /orders/{id}/mark-delivered (top-up delivery)"
        actor: FleetManager
        preconditions: ["same as OUT_FOR_DELIVERY -> DELIVERED"]
        side_effects: ["delivered_sqft += accepted_sqft; freshness_hours recomputed; version += 1"]
      - from: DELIVERED
        to: INSTALLING
        trigger: "POST /orders/{id}/install-start"
        actor: Customer
        preconditions:
          - "status == DELIVERED"
          - "acting Customer id == order.customer_id (else ERR_UNAUTHORIZED_ROLE)"
        side_effects: ["status <- INSTALLING; install_started_at <- now; version += 1"]
      - from: INSTALLING
        to: INSTALLED
        trigger: "POST /orders/{id}/install-complete"
        actor: Customer
        preconditions: ["status == INSTALLING", "acting Customer id == order.customer_id"]
        side_effects:
          - "status <- INSTALLED; installed_at <- now; version += 1"
          - "AUTO-JOIN: if payment_status == PAID, status <- CLOSED instead (terminal)"
      - from: INSTALLED
        to: CLOSED
        trigger: "system auto-transition when a Payment flips payment_status to PAID while INSTALLED"
        actor: system
        preconditions: ["payment_status == PAID"]
        side_effects: ["status <- CLOSED; version += 1"]
      - from: DELIVERED
        to: CLOSED
        trigger: "POST /orders/{id}/close (no-install path)"
        actor: SalesRep
        preconditions: ["status == DELIVERED", "payment_status == PAID (else ERR_INVALID_STATE)"]
        side_effects: ["status <- CLOSED; version += 1"]
      - from: PLACED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: SalesRep
        preconditions: ["status in {PLACED, CONFIRMED, OUT_FOR_DELIVERY}", "total_paid == 0 (else ERR_INVALID_STATE — paid orders need a credit workflow, out of scope)"]
        side_effects:
          - "status <- CANCELLED; version += 1"
          - "release allocation: linked HarvestBatches order_id <- NULL; delivery window released (capacity freed); crew referrals in REFERRED/SCHEDULED -> REPLACED; crew_referral_status <- NONE"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: SalesRep
        preconditions: ["same as PLACED -> CANCELLED"]
        side_effects: ["same as PLACED -> CANCELLED"]
      - from: OUT_FOR_DELIVERY
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: SalesRep
        preconditions: ["same as PLACED -> CANCELLED"]
        side_effects: ["same as PLACED -> CANCELLED"]
      # --- payment dimension (payment_status) — parallel, independent ---
      - from: PENDING
        to: PAID
        trigger: "POST /orders/{id}/payments when amount == amount_due and amount_due > 0"
        actor: SalesRep
        preconditions: ["status not in {CLOSED, CANCELLED}", "amount == amount_due (else ERR_PAYMENT_AMOUNT_MISMATCH)"]
        side_effects:
          - "payment_status <- PAID; version += 1"
          - "AUTO-JOIN: if status == INSTALLED, status <- CLOSED"
      - from: PAID
        to: PENDING
        trigger: "system recompute after POST /orders/{id}/delivery-checks raises chargeable_amount above total_paid"
        actor: system
        preconditions: ["amount_due recomputed > 0"]
        side_effects: ["payment_status <- PENDING; version += 1"]

  - entity: CrewReferral
    initial_state: REFERRED
    terminal_states: [SCHEDULED, REPLACED]
    transitions:
      - from: REFERRED
        to: SCHEDULED
        trigger: "POST /orders/{id}/crew-schedule"
        actor: SalesRep
        preconditions:
          - "the order's unique non-terminal referral (status in {REFERRED, SCHEDULED}; at most one exists at any time by construction, since creating a referral replaces the previous one) is this one and is REFERRED"
          - "scheduled_date >= order.delivery_date (else ERR_INVALID_REQUEST)"
          - "no other CrewReferral for the same crew with status == SCHEDULED and scheduled_date == payload date (else ERR_CREW_DATE_CONFLICT)"
        side_effects:
          - "status <- SCHEDULED; scheduled_date <- payload; version += 1"
          - "order.crew_referral_status <- CREW_SCHEDULED"
      - from: REFERRED
        to: REPLACED
        trigger: "POST /orders/{id}/crew-referrals (new referral supersedes) OR POST /crews/{id}/deactivate cascade"
        actor: SalesRep | system
        preconditions: ["status in {REFERRED, SCHEDULED}"]
        side_effects:
          - "status <- REPLACED; version += 1"
          - "order.crew_referral_status <- NONE (system cascade) or CREW_REFERRED (supersede by new referral)"
      - from: SCHEDULED
        to: REPLACED
        trigger: "POST /orders/{id}/crew-referrals OR POST /crews/{id}/deactivate cascade"
        actor: SalesRep | system
        preconditions: ["status in {REFERRED, SCHEDULED}"]
        side_effects: ["same as REFERRED -> REPLACED"]

  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [COMPLIANT, INSUFFICIENT]
    transitions:
      - from: SUBMITTED
        to: COMPLIANT
        trigger: "POST /warranty-claims/{id}/evaluate"
        actor: FarmManager
        preconditions: ["status == SUBMITTED", "at least one WateringLog exists (else ERR_INVALID_STATE)"]
        side_effects:
          - "status <- COMPLIANT when total_credits >= target_credits; resolution <- CREDIT_ISSUED; credit_amount <- round2(eligible_turf_sqft * 0.50); evaluated_at <- now; version += 1"
      - from: SUBMITTED
        to: INSUFFICIENT
        trigger: "POST /warranty-claims/{id}/evaluate"
        actor: FarmManager
        preconditions: ["status == SUBMITTED", "at least one WateringLog exists"]
        side_effects:
          - "status <- INSUFFICIENT when total_credits < target_credits; resolution <- REJECTED; credit_amount <- 0.00; evaluated_at <- now; version += 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only — see mandatory filter)
# =============================================================================
concurrency_rules:
  - rule_id: harvest-batch-create-stale-field
    parent_entity: Field
    write_endpoint: "POST /harvest-batches"
    occ_field: "expected_field_version"
    description: |
      Creating a HarvestBatch against a Field whose version has advanced since the
      client last observed it is rejected. The client's basis for the create — the
      field's remaining_sqft and harvestable maturity — may have been invalidated
      by an intervening write (another batch create bumping the version, a quality
      PATCH, an archive). A second strictly-sequential create carrying the older
      version deterministically fails; nothing about wall-clock overlap is involved.
    error_id: ERR_STALE_FIELD_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: maturity_classification
    trigger: "Field read (GET), POST /fields/{id}/maturity-scan, and precondition evaluation at harvest-batch create / reseed create"
    algorithm: threshold
    formula: |
      age_days = floor((clock_now - field.last_planted_at) / 86400s)
      w = VarietyConfig of field.variety_id
      if age_days <= w.germination_max_days: SEEDED
      elif age_days <= w.growing_max_days: GROWING
      elif age_days <= w.ready_max_days: READY
      elif age_days <= w.mature_max_days: MATURE
      else: OVERAGED
    input_set: "single Field + its VarietyConfig; boundaries inclusive on the lower band (age == growing_max_days is still GROWING)"
    constants: {}
    precision: "integer days, floor"

  - name: pallet_yield
    trigger: "HarvestBatch creation and Quote line yield computation"
    algorithm: aggregation
    formula: |
      full_sqft = pallet_count * PALLET_SQFT[grade]
      yield_sqft = full_sqft - shortfall_slabs * SLAB_SQFT - shortfall_rolls * ROLL_SQFT
      sellable_sqft = yield_sqft   # must be > 0
    input_set: "one batch config or one quote line; rates from the current PriceConfig snapshot"
    constants:
      SLAB_SQFT: 5
      ROLL_SQFT: 10
      PALLET_SQFT_PREMIUM: 100
      PALLET_SQFT_STANDARD: 50
      PALLET_SQFT_ECONOMY: 20
    precision: "integer sqft (inputs are integers)"

  - name: turf_contribution
    trigger: "Quote creation (per line, then summed)"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER: round each line to 2dp FIRST, then sum.
      # round-per-line-then-sum != sum-then-round; the per-line order is authoritative.
      line_contribution_i = round2(line_yield_sqft_i * GRADE_RATE[grade_i])
      turf_sqft = sum(line_contribution_i)
    input_set: "all lines of the quote"
    constants:
      GRADE_RATE_PREMIUM: 0.855
      GRADE_RATE_STANDARD: 0.70
      GRADE_RATE_ECONOMY: 0.50
    precision: "2 decimal places per line, round_half_up; sum of rounded lines is exact"

  - name: freight_cell
    trigger: "Quote creation"
    algorithm: tiered_pricing
    formula: |
      d = z1_pallets * ZONE1_RATE + z2_pallets * ZONE2_RATE + z3_pallets * ZONE3_RATE
      freight_amount = round2(turf_sqft * d / FREIGHT_SQFT_UNIT)
    input_set: "quote zone split (pallet counts per zone) and turf_sqft"
    constants:
      ZONE1_RATE: 1.20
      ZONE2_RATE: 1.80
      ZONE3_RATE: 2.60
      FREIGHT_SQFT_UNIT: 500
    precision: "2 decimal places, round_half_up (freight rounded BEFORE entering pre_discount_subtotal)"

  - name: order_pricing_ladder
    trigger: "Quote creation (fields copied to Order at accept)"
    algorithm: tiered_pricing
    formula: |
      # PINNED EVALUATION ORDER (resolves the apparent circularity tier<->fee):
      # 1. turf_sqft  (turf_contribution, per-line rounded)
      # 2. freight_amount = round2(turf_sqft * d / FREIGHT_SQFT_UNIT)
      # 3. pre_discount_subtotal = turf_sqft + freight_amount
      # 4. volume_tier from thresholds evaluated on PRE-discount values:
      #      T2 if turf_sqft >= 8000 AND pre_discount_subtotal >= 15000
      #      elif T1 if turf_sqft >= 2000 AND pre_discount_subtotal >= 4000
      #      else T0
      # 5. volume_discount = round2(pre_discount_subtotal * tier_pct)   [CARD only]
      # 6. gross = pre_discount_subtotal - volume_discount
      # 7. card_fee = round2(gross * CARD_FEE_PCT)                      [CARD only]
      # 8. total_price = round2(gross + card_fee)
      # CASH_CHECK: steps 5 and 7 skipped; total_price = cash_price (see variants).
      pre = turf_sqft + freight_amount
      if settlement == CARD:   total = round2(pre - round2(pre*tier_pct) + round2((pre - round2(pre*tier_pct)) * 0.02))
      if settlement == CASH_CHECK: total = round2(pre * 0.97)
    input_set: "quote lines, zone split, settlement method, PriceConfig snapshot"
    constants:
      CARD_FEE_PCT: 0.02
      CASH_DISCOUNT_PCT: 0.03
      T1_TURF_MIN: 2000
      T1_PRE_MIN: 4000
      T1_PCT: 0.06
      T2_TURF_MIN: 8000
      T2_PRE_MIN: 15000
      T2_PCT: 0.15
    precision: "2 decimal places, round_half_up at each pinned step (1,2,5,7,8)"
    variants:
      - name: additive_flat
        when: "always computed on the quote as additive_total (informational dual variant; NEVER authoritative)"
        difference: "CARD: round2(pre * (1 + tier_pct) * (1 + CARD_FEE_PCT)) — markup-style instead of discount-then-fee; CASH_CHECK: round2(pre * (1 - CASH_DISCOUNT_PCT)) — identical to cash_price. Diverges from the ladder whenever tier_pct > 0."
      - name: cash_check
        when: "settlement_method == CASH_CHECK (authoritative for that settlement)"
        difference: "cash_price = round2(pre * (1 - CASH_DISCOUNT_PCT)); volume tier and card fee do NOT apply. Exposed as quote.cash_price on every quote regardless of settlement."

  - name: freshness_projection
    trigger: "allocation at order confirm (projected) and mark-delivered (actual)"
    algorithm: threshold
    formula: |
      # confirm-time projection per candidate batch:
      projected_end = batch.actual_harvest_end            if batch.status == COMPLETE
                      batch.scheduled_date + 08:00:00Z    if batch.status == PENDING
      projected_freshness_hours = (order.delivery_window_end - projected_end) / 3600s
      eligible iff 0 <= projected_freshness_hours <= FRESHNESS_LIMIT_HOURS
      # negative projection = batch not ready by window end -> ineligible
      # 24.0 exactly is ELIGIBLE (<=)
      # delivery-time actual:
      freshness_hours = round2((delivery_time - min(actual_harvest_end over linked batches)) / 3600s)
      delivery rejected with ERR_DELIVERY_STALE iff freshness_hours > FRESHNESS_LIMIT_HOURS
    input_set: "candidate batches (confirm) / linked batches (delivery)"
    constants:
      FRESHNESS_LIMIT_HOURS: 24
      DEFAULT_PENDING_HARVEST_END_HOUR: 8
    precision: "hours to 2 decimal places, round_half_up"

  - name: zone_capacity_overlap
    trigger: "POST /orders/{id}/confirm and POST /truck-blocks"
    algorithm: interval_merge
    formula: |
      # Half-open intervals: [s1, e1) overlaps [s2, e2) iff s1 < e2 AND s2 < e1.
      # Touching endpoints (e1 == s2) do NOT overlap.
      consumers(zone, window) =
          count(Order o: o.capacity_zone == zone
                AND o.status IN {CONFIRMED, OUT_FOR_DELIVERY}
                AND overlap(o.window, request_window))
        + count(TruckBlock t: t.freight_zone == zone AND overlap(t.window, request_window))
      request rejected with ERR_CAPACITY_EXCEEDED iff consumers >= ZONE_TRUCK_CAPACITY
    input_set: "orders with active bookings + truck blocks, per zone, overlapping the request window"
    constants:
      ZONE_TRUCK_CAPACITY: 4
    precision: "integer count; boundary at exactly 4 existing consumers (the 5th fails)"

  - name: allocation_selector
    trigger: "POST /orders/{id}/confirm — selects HarvestBatches per quote line"
    algorithm: waterfall_allocation
    formula: |
      for each quote line (in line order):
        candidates = HarvestBatch b where b.status IN {PENDING, COMPLETE}
                     AND b.order_id IS NULL
                     AND b.variety_id == line.variety_id AND b.grade == line.grade
                     AND freshness_projection(b) <= FRESHNESS_LIMIT_HOURS
        rank: projected_harvest_end DESC (freshest first);
              tie 1: sellable_sqft ASC (minimize waste);
              tie 2: created_at ASC
        accumulate whole batches until cumulative sellable_sqft >= line yield_sqft
        (the final batch may over-allocate; partial batch consumption is not allowed)
      if candidates exhausted before meeting a line:
        if any variety+grade-matched unlinked batch was excluded solely by freshness
          -> ERR_BATCH_NOT_FRESH
        else -> ERR_ORDER_UNDER_ALLOCATED
    input_set: "batches per line per above filter"
    constants: {}
    precision: "n/a (selection only)"

  - name: delivery_check_window
    trigger: "POST /orders/{id}/delivery-checks"
    algorithm: weighted_scoring
    formula: |
      A = order.turf_sqft                       # promised
      P = order.delivered_sqft                  # cumulative delivered
      B = order.total_paid                      # prior verified payments
      baseline_sqft = round2(0.95 * A)
      window_size   = round2((baseline_sqft + B) * 0.60)
      in_window     = (P >= window_size)                      # AUTHORITATIVE (cumulative weighted)
      strict_in_window = (latest_chunk >= round2(baseline_sqft * 0.60))
        where latest_chunk = P - P_at_previous_check (P for check 1)
      shortfall_sqft  = max(0, A - P)
      blended_rate    = round4(order.total_price / order.turf_sqft)
      shortfall_credit = round2(shortfall_sqft * blended_rate)
      chargeable_after = order.total_price - shortfall_credit
      # side effects: order.chargeable_amount <- chargeable_after;
      #               order.delivery_flagged <- (NOT in_window);
      #               amount_due / credit_balance / payment_status recompute (order_balance_reconciliation)
    input_set: "the order's current money/delivery fields; at most 2 checks per order (check_index 1, 2; third -> ERR_INVALID_STATE)"
    constants:
      BASELINE_PCT: 0.95
      WINDOW_WEIGHT: 0.60
    precision: "2 dp round_half_up for money/sqft; 4 dp round_half_up for blended_rate"
    variants:
      - name: strict_per_delivery
        when: "always computed as strict_in_window (informational dual variant)"
        difference: "each delivery chunk must independently reach round2(baseline_sqft * 0.60); a late small top-up fails strict even when the cumulative window passes — e.g. chunks 500+400 against an 855.00 threshold: cumulative in_window=true, strict_in_window=false"

  - name: order_balance_reconciliation
    trigger: "after every Payment creation and every DeliveryCheck creation"
    algorithm: aggregation
    formula: |
      chargeable_amount = (initially total_price; overwritten by each DeliveryCheck.chargeable_after)
      total_paid   = sum(Payment.amount)
      amount_due   = max(0, chargeable_amount - total_paid)
      credit_balance = max(0, total_paid - chargeable_amount)
      payment_status = PAID iff amount_due == 0 else PENDING
      # CONSERVED QUANTITY: total_paid + amount_due - credit_balance == chargeable_amount (always)
    input_set: "single order's payments and latest check"
    constants: {}
    precision: "2 dp round_half_up"

  - name: watering_compliance_score
    trigger: "WateringLog creation (credits_awarded) and warranty evaluate (verdict)"
    algorithm: threshold
    formula: |
      per log: credits = 140 if moisture_reading >= 40
                         120 if 30 <= moisture_reading < 40
                         60  if moisture_reading < 30
      target_credits = 500 (W1) | 400 (W2) | 300 (W3)
      total_credits = sum(credits over the claim's logs)
      verdict: COMPLIANT iff total_credits >= target_credits else INSUFFICIENT
      credit_amount = round2(eligible_turf_sqft * 0.50) if COMPLIANT else 0.00
    input_set: "the claim's WateringLogs (log_date within [installed_at date, installed_at + 30d])"
    constants:
      CREDITS_GREEN: 140
      CREDITS_MARGINAL: 120
      CREDITS_DRY: 60
      MOISTURE_GREEN_MIN: 40
      MOISTURE_MARGINAL_MIN: 30
      TARGET_W1: 500
      TARGET_W2: 400
      TARGET_W3: 300
      WARRANTY_CREDIT_PER_SQFT: 0.50
    precision: "integer credits; money 2 dp round_half_up"

  - name: reseed_seed_requirement
    trigger: "ReSeedPlan creation"
    algorithm: aggregation
    formula: |
      target_seed_lbs = round2(field.field_sqft * variety.seed_lbs_per_1000_sqft / 1000)
      # complete precondition: actual_seed_lbs >= target_seed_lbs else ERR_SEED_SHORTFALL
    input_set: "the plan's field and its variety"
    constants:
      SEED_LBS_PER_1000_SQFT: 6
    precision: "2 dp round_half_up"

  - name: field_availability
    trigger: "HarvestBatch creation"
    algorithm: aggregation
    formula: |
      pending_reserved = sum(sellable_sqft of HarvestBatch where field_id == field
                             AND status == PENDING)
      available = field.remaining_sqft - pending_reserved
      new batch rejected with ERR_BATCH_YIELD_EXCEEDS_AVAILABLE iff new.sellable_sqft > available
      # CONSERVED QUANTITY per crop cycle (since last re-seed completion or field creation):
      # remaining_sqft + sum(sellable_sqft of non-CANCELLED COMPLETE batches this cycle) == field_sqft
    input_set: "one field's batches in PENDING (reservation) and COMPLETE (realized)"
    constants: {}
    precision: "integer sqft"

  - name: confirm_cutoff
    trigger: "POST /orders/{id}/confirm"
    algorithm: threshold
    formula: |
      if order.delivery_date == clock_date:  cutoff = order.created_at + SAME_DAY_CUTOFF_HOURS
      else:                                  cutoff = (order.delivery_date - 1 day) at FUTURE_DAY_CUTOFF_HOUR:00
      confirm allowed iff clock_now < cutoff     # STRICT inequality: now == cutoff -> ERR_CUTOFF_PASSED
    input_set: "the order"
    constants:
      SAME_DAY_CUTOFF_HOURS: 2
      FUTURE_DAY_CUTOFF_HOUR: 14
    precision: "second precision on comparison"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "role permitted for the endpoint; Customer role additionally requires X-User-ID == the resource's customer_id (ownership)"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path parameters resolve to existing entities, left-to-right; body FK references (customer_id, variety_id, field_id, crew_id, line variety_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK inputs"
  - priority: 4
    category: business_constraint
    check: "request shape: required fields present, types valid, ranges valid (pallet_count >= 1, shortfalls >= 0, freight_zone in 1..3, moisture 0..100, window_end > window_start, hour-aligned window starts, delivery window start hour in [06:00,16:00] on delivery_date, email/variety-name uniqueness, accepted_sqft within remaining allocated, log_date within claim window and unique per claim per date, yield_sqft > 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PATCH endpoints"
  - priority: 5
    category: business_constraint
    check: "enum fields carry a declared member (grade, settlement_method, weather_case, payment method)"
    error_id: ERR_INVALID_ENUM
    http_status: 400
    applies_to: "endpoints with enum inputs"
  - priority: 6
    category: state
    check: "target entity is not in a terminal state for this action (CANCELLED/CLOSED order, CANCELLED/COMPLETE batch, terminal quote, ARCHIVED field, terminal claim)"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: state
    check: "entity in the required `from` state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 8
    category: state
    check: "OCC: expected_field_version == field.version on harvest-batch create"
    error_id: ERR_STALE_FIELD_VERSION
    http_status: 412
    applies_to: "POST /harvest-batches"
  - priority: 9
    category: business_temporal
    check: "quote delivery_date >= clock date (ERR_DELIVERY_DATE_TOO_SOON); accept with delivery_date < clock date (ERR_QUOTE_EXPIRED, quote -> EXPIRED); confirm before cutoff (ERR_CUTOFF_PASSED); harvest actual times within [06:00, 18:00] window and end > start (ERR_HARVEST_WINDOW); claim created within 30 days of installed_at (ERR_CLAIM_WINDOW_EXPIRED)"
    error_id: ERR_DELIVERY_DATE_TOO_SOON
    http_status: 422
    applies_to: "POST /quotes, POST /quotes/{id}/accept, POST /orders/{id}/confirm, POST /harvest-batches/{id}/complete, POST /orders/{id}/warranty-claims"
  - priority: 10
    category: business_constraint
    check: "quote zone split sums to total_pallets (ERR_ZONE_SPLIT_MISMATCH); one claim per order (ERR_DUPLICATE_CLAIM); reseed allowed — maturity in {MATURE, OVERAGED}, no batch of the field linked to an order in {PLACED, CONFIRMED, OUT_FOR_DELIVERY, DELIVERED, INSTALLING, INSTALLED}, no plan of the field in {PLANNING, IN_PROGRESS} (ERR_RESEED_NOT_ALLOWED); actual_seed_lbs >= target (ERR_SEED_SHORTFALL); referral crew active (ERR_INVALID_REQUEST) and serving the customer zone (ERR_CREW_ZONE_MISMATCH); crew not already scheduled that date (ERR_CREW_DATE_CONFLICT)"
    error_id: ERR_ZONE_SPLIT_MISMATCH
    http_status: 422
    applies_to: "POST /quotes, POST /orders/{id}/confirm, POST /orders/{id}/warranty-claims, POST /fields/{id}/reseed-plans, POST /reseed-plans/{id}/complete, POST /orders/{id}/crew-referrals, POST /orders/{id}/crew-schedule"
  - priority: 11
    category: business_safety
    check: "field maturity in {READY, MATURE} at batch create (ERR_FIELD_NOT_HARVESTABLE); field quality gate mow_count >= 3 AND days_since_mow < 3 AND 35 <= moisture <= 55 AND health >= 70 (ERR_FIELD_QUALITY_GATE); allocation freshness — candidates exist but all stale (ERR_BATCH_NOT_FRESH); delivery freshness <= 24h (ERR_DELIVERY_STALE)"
    error_id: ERR_FIELD_NOT_HARVESTABLE
    http_status: 409
    applies_to: "POST /harvest-batches, POST /orders/{id}/confirm, POST /orders/{id}/mark-delivered"
  - priority: 12
    category: business_fiscal
    check: "zone truck capacity < 4 (ERR_CAPACITY_EXCEEDED); batch sellable <= availability net of pending (ERR_BATCH_YIELD_EXCEEDS_AVAILABLE); allocation meets line quantities (ERR_ORDER_UNDER_ALLOCATED); payment amount == amount_due (ERR_PAYMENT_AMOUNT_MISMATCH); warranty claim requires payment_status == PAID (ERR_ORDER_NOT_SETTLED)"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /orders/{id}/confirm, POST /truck-blocks, POST /harvest-batches, POST /orders/{id}/payments, POST /orders/{id}/warranty-claims"

# =============================================================================
# 1.5 API Endpoint Table
#
# Global list convention: every list endpoint sorts by created_at ASC (ties
# cannot occur — the server stamps created_at at millisecond precision and
# guarantees uniqueness per row) and applies the response_envelope pagination
# defaults. Archived fields are excluded from GET /fields unless
# status=ARCHIVED is passed explicitly.
# =============================================================================
endpoints:
  # --- configuration ---
  - method: POST
    path: "/price-configs"
    description: "Create a rate card; the new card becomes is_current=true and every other PriceConfig flips to is_current=false"
    roles: [FarmManager]
    code: 201
    input: ["name", "slab_sqft?", "roll_sqft?", "pallet_sqft_premium?", "pallet_sqft_standard?", "pallet_sqft_economy?", "rate_premium?", "rate_standard?", "rate_economy?", "zone1_rate?", "zone2_rate?", "zone3_rate?", "freight_sqft_unit?", "zone_truck_capacity?", "delivery_window_hours?", "delivery_earliest_start_hour?", "delivery_latest_start_hour?", "same_day_cutoff_hours?", "future_day_cutoff_hour?", "freshness_limit_hours?", "card_fee_pct?", "cash_discount_pct?", "volume_t1_turf_min?", "volume_t1_pre_min?", "volume_t1_pct?", "volume_t2_turf_min?", "volume_t2_pre_min?", "volume_t2_pct?", "harvest_earliest_start_hour?", "harvest_latest_end_hour?"]
    output: PriceConfig
    side_effects: ["supersede prior current config (is_current flags)"]
  - method: GET
    path: "/price-configs"
    description: "List price configs"
    roles: [FarmManager, SalesRep]
    code: 200
    input: ["limit?", "offset?"]
    output: PriceConfig[]
    side_effects: []
  - method: POST
    path: "/variety-configs"
    description: "Register a turf variety with maturity windows and seed rate"
    roles: [FarmManager]
    code: 201
    input: ["name", "germination_max_days?", "growing_max_days?", "ready_max_days?", "mature_max_days?", "seed_lbs_per_1000_sqft?"]
    output: VarietyConfig
    side_effects: []
  - method: GET
    path: "/variety-configs"
    description: "List varieties"
    roles: [FarmManager, SalesRep, HarvestSupervisor]
    code: 200
    input: ["limit?", "offset?"]
    output: VarietyConfig[]
    side_effects: []

  # --- customers & crews ---
  - method: POST
    path: "/customers"
    description: "Register a customer"
    roles: [SalesRep]
    code: 201
    input: ["full_name", "email", "phone", "freight_zone", "address"]
    output: Customer
    side_effects: []
  - method: GET
    path: "/customers/{id}"
    description: "Fetch a customer"
    roles: [SalesRep, FarmManager, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: POST
    path: "/crews"
    description: "Register an installation crew"
    roles: [FarmManager]
    code: 201
    input: ["name", "service_zones", "active?"]
    output: Crew
    side_effects: []
  - method: GET
    path: "/crews"
    description: "List crews"
    roles: [SalesRep, FarmManager]
    code: 200
    input: ["active?", "limit?", "offset?"]
    output: Crew[]
    side_effects: []
  - method: GET
    path: "/crews/{id}"
    description: "Fetch a crew"
    roles: [SalesRep, FarmManager]
    code: 200
    input: []
    output: Crew
    side_effects: []
  - method: POST
    path: "/crews/{id}/deactivate"
    description: "Deactivate a crew; cascades: its REFERRED/SCHEDULED referrals -> REPLACED, affected orders' crew_referral_status -> NONE"
    roles: [FarmManager]
    code: 200
    input: []
    output: Crew
    side_effects: ["crew cascade (2 hops): referrals REPLACED -> order crew_referral_status NONE"]
  - method: GET
    path: "/crews/{id}/crew-referrals"
    description: "List referrals pointing at a crew"
    roles: [SalesRep, FarmManager]
    code: 200
    input: ["limit?", "offset?"]
    output: CrewReferral[]
    side_effects: []

  # --- fields & re-seeding ---
  - method: POST
    path: "/fields"
    description: "Create a field (status ACTIVE; remaining_sqft initialized to field_sqft; maturity derived)"
    roles: [FarmManager]
    code: 201
    input: ["name", "variety_id", "field_sqft", "last_planted_at", "mow_count", "last_mowed_at", "soil_moisture_pct", "health_score"]
    output: Field
    side_effects: ["remaining_sqft <- field_sqft"]
  - method: GET
    path: "/fields"
    description: "Field inventory by variety & maturity (filters compose)"
    roles: [FarmManager, SalesRep, HarvestSupervisor]
    code: 200
    input: ["variety_id?", "maturity_state?", "status?", "limit?", "offset?"]
    output: Field[]
    side_effects: []
  - method: GET
    path: "/fields/{id}"
    description: "Fetch a field (maturity_state recomputed lazily against the clock)"
    roles: [FarmManager, SalesRep, HarvestSupervisor]
    code: 200
    input: []
    output: Field
    side_effects: []
  - method: PATCH
    path: "/fields/{id}/quality"
    description: "Update agronomic quality inputs (mow log, moisture, health)"
    roles: [FarmManager]
    code: 200
    input: ["mow_count?", "last_mowed_at?", "soil_moisture_pct?", "health_score?"]
    output: Field
    side_effects: ["increments Field.version by 1"]
  - method: POST
    path: "/fields/{id}/maturity-scan"
    description: "Persist the recomputed maturity_state; fires the OVERAGED cascade (PENDING batches CANCELLED -> under-allocated CONFIRMED orders revert to PLACED) when the persisted value transitions into OVERAGED"
    roles: [FarmManager]
    code: 200
    input: []
    output: Field
    side_effects: ["maturity recompute (no version bump)", "conditional OVERAGED cascade (3 hops: field -> batches -> orders)"]
  - method: POST
    path: "/fields/{id}/archive"
    description: "Archive a field with no live batches and no active re-seed plan"
    roles: [FarmManager]
    code: 200
    input: []
    output: Field
    side_effects: ["status <- ARCHIVED; version += 1"]
  - method: POST
    path: "/fields/{id}/reseed-plans"
    description: "Open a re-seed rotation plan for a MATURE/OVERAGED field"
    roles: [FarmManager]
    code: 201
    input: ["planned_date"]
    output: ReSeedPlan
    side_effects: ["target_seed_lbs computed"]
  - method: GET
    path: "/fields/{id}/reseed-plans"
    description: "List a field's re-seed plans"
    roles: [FarmManager]
    code: 200
    input: ["limit?", "offset?"]
    output: ReSeedPlan[]
    side_effects: []
  - method: POST
    path: "/reseed-plans/{id}/start"
    description: "Begin field work"
    roles: [FarmManager]
    code: 200
    input: []
    output: ReSeedPlan
    side_effects: ["status <- IN_PROGRESS"]
  - method: POST
    path: "/reseed-plans/{id}/complete"
    description: "Complete re-seeding; resets the field crop cycle (maturity SEEDED, remaining_sqft = field_sqft, mow_count = 0, last_planted_at = now) and cancels the field's PENDING and unlinked-COMPLETE batches"
    roles: [FarmManager]
    code: 200
    input: ["actual_seed_lbs"]
    output: ReSeedPlan
    side_effects: ["field cycle reset cascade", "batch cancellations"]

  # --- harvest ---
  - method: POST
    path: "/harvest-batches"
    description: "Schedule a harvest batch against a field (OCC on Field.version via expected_field_version); computes full/yield/sellable sqft"
    roles: [HarvestSupervisor]
    code: 201
    input: ["field_id", "grade", "pallet_count", "shortfall_slabs", "shortfall_rolls", "scheduled_date", "expected_field_version"]
    output: HarvestBatch
    side_effects: ["increments Field.version by 1", "availability check nets PENDING reservations"]
  - method: GET
    path: "/harvest-batches"
    description: "List/filter harvest batches"
    roles: [HarvestSupervisor, FarmManager, SalesRep]
    code: 200
    input: ["field_id?", "order_id?", "variety_id?", "status?", "limit?", "offset?"]
    output: HarvestBatch[]
    side_effects: []
  - method: GET
    path: "/harvest-batches/{id}"
    description: "Fetch a harvest batch"
    roles: [HarvestSupervisor, FarmManager]
    code: 200
    input: []
    output: HarvestBatch
    side_effects: []
  - method: POST
    path: "/harvest-batches/{id}/complete"
    description: "Record actual harvest times; enforces the 06:00-18:00 harvest window; decrements field.remaining_sqft by sellable_sqft"
    roles: [HarvestSupervisor]
    code: 200
    input: ["actual_harvest_start", "actual_harvest_end"]
    output: HarvestBatch
    side_effects: ["status <- COMPLETE", "field.remaining_sqft -= sellable_sqft"]
  - method: POST
    path: "/harvest-batches/{id}/cancel"
    description: "Cancel a PENDING, unlinked batch; leaves field.remaining_sqft unchanged (compensating invariant)"
    roles: [HarvestSupervisor]
    code: 200
    input: []
    output: HarvestBatch
    side_effects: ["status <- CANCELLED"]

  # --- quotes & orders ---
  - method: POST
    path: "/quotes"
    description: "Price a turf order (snapshot of current PriceConfig); a new DRAFT supersedes the customer's existing DRAFT quote"
    roles: [SalesRep]
    code: 201
    input: ["customer_id", "delivery_date", "settlement_method", "z1_pallets", "z2_pallets", "z3_pallets", "lines"]
    output: Quote
    side_effects: ["pricing ladder computed", "prior DRAFT quote of this customer -> SUPERSEDED"]
  - method: GET
    path: "/quotes"
    description: "List quotes"
    roles: [SalesRep, FarmManager]
    code: 200
    input: ["customer_id?", "status?", "price_config_id?", "limit?", "offset?"]
    output: Quote[]
    side_effects: []
  - method: GET
    path: "/quotes/{id}"
    description: "Fetch a quote with all computed pricing fields"
    roles: [SalesRep, FarmManager]
    code: 200
    input: []
    output: Quote
    side_effects: []
  - method: POST
    path: "/quotes/{id}/accept"
    description: "Accept a DRAFT quote; creates the Order in PLACED with pricing copied"
    roles: [SalesRep]
    code: 201
    input: []
    output: Order
    side_effects: ["quote -> ACCEPTED", "Order created (PLACED, payment_status PENDING, chargeable_amount = total_price)"]
  - method: GET
    path: "/quotes/{id}/orders"
    description: "List the order created from this quote (0 or 1 elements)"
    roles: [SalesRep, FarmManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: GET
    path: "/orders"
    description: "List orders"
    roles: [SalesRep, FarmManager]
    code: 200
    input: ["customer_id?", "status?", "price_config_id?", "limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: GET
    path: "/orders/{id}"
    description: "Fetch an order (Customer role restricted to own orders)"
    roles: [SalesRep, FarmManager, Customer]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: POST
    path: "/orders/{id}/confirm"
    description: "Book the delivery window: enforces cutoff, zone truck capacity, and runs batch allocation (freshness-aware)"
    roles: [SalesRep]
    code: 200
    input: ["delivery_window_start"]
    output: Order
    side_effects: ["status <- CONFIRMED", "batches linked (order_id set)", "capacity consumed"]
  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancel an unpaid order before delivery completes; releases batch links and window capacity"
    roles: [SalesRep]
    code: 200
    input: []
    output: Order
    side_effects: ["status <- CANCELLED", "batch links released", "crew referrals REPLACED"]
  - method: POST
    path: "/orders/{id}/dispatch"
    description: "Mark out-for-delivery (delivery date only; all linked batches must be COMPLETE)"
    roles: [FleetManager]
    code: 200
    input: []
    output: Order
    side_effects: ["status <- OUT_FOR_DELIVERY"]
  - method: POST
    path: "/orders/{id}/mark-delivered"
    description: "Record a (possibly partial) customer-accepted delivery; enforces the 24h freshness window; DELIVERED->DELIVERED self-loop supports top-up deliveries"
    roles: [FleetManager]
    code: 200
    input: ["accepted_sqft"]
    output: Order
    side_effects: ["status <- DELIVERED", "delivered_sqft += accepted_sqft", "freshness_hours recomputed"]
  - method: POST
    path: "/orders/{id}/install-start"
    description: "Customer marks installation started"
    roles: [Customer]
    code: 200
    input: []
    output: Order
    side_effects: ["status <- INSTALLING", "install_started_at set"]
  - method: POST
    path: "/orders/{id}/install-complete"
    description: "Customer marks installation complete; auto-CLOSED if already PAID"
    roles: [Customer]
    code: 200
    input: []
    output: Order
    side_effects: ["status <- INSTALLED or CLOSED", "installed_at set"]
  - method: POST
    path: "/orders/{id}/close"
    description: "Close a delivered, fully-paid order that took no installation"
    roles: [SalesRep]
    code: 200
    input: []
    output: Order
    side_effects: ["status <- CLOSED"]
  - method: POST
    path: "/orders/{id}/delivery-checks"
    description: "Record a weighted delivery-window check (max 2 per order); recomputes chargeable_amount, delivery_flagged, and payment_status"
    roles: [SalesRep]
    code: 201
    input: []
    output: DeliveryCheck
    side_effects: ["delivery_check_window calculation", "order money reconciliation (possible PAID->PENDING reversion)"]
  - method: GET
    path: "/orders/{id}/delivery-checks"
    description: "List an order's delivery checks"
    roles: [SalesRep, FarmManager, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: DeliveryCheck[]
    side_effects: []
  - method: POST
    path: "/orders/{id}/payments"
    description: "Record a payment equal to the current amount_due"
    roles: [SalesRep]
    code: 201
    input: ["amount", "method"]
    output: Payment
    side_effects: ["payment_status recompute", "auto-CLOSED when INSTALLED"]
  - method: GET
    path: "/orders/{id}/payments"
    description: "List an order's payments"
    roles: [SalesRep, FarmManager, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: Payment[]
    side_effects: []

  # --- crew referral & scheduling ---
  - method: POST
    path: "/orders/{id}/crew-referrals"
    description: "Refer an installation crew to a CONFIRMED-or-later order; supersedes the order's existing non-terminal referral"
    roles: [SalesRep]
    code: 201
    input: ["crew_id"]
    output: CrewReferral
    side_effects: ["existing REFERRED/SCHEDULED referral -> REPLACED", "order.crew_referral_status <- CREW_REFERRED"]
  - method: GET
    path: "/orders/{id}/crew-referrals"
    description: "List an order's crew referrals"
    roles: [SalesRep, FarmManager, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: CrewReferral[]
    side_effects: []
  - method: POST
    path: "/orders/{id}/crew-schedule"
    description: "Schedule the referred crew on a date; one crew per calendar date across all orders"
    roles: [SalesRep]
    code: 200
    input: ["scheduled_date"]
    output: CrewReferral
    side_effects: ["referral -> SCHEDULED", "order.crew_referral_status <- CREW_SCHEDULED"]

  # --- warranty ---
  - method: POST
    path: "/orders/{id}/warranty-claims"
    description: "Customer files an establishment warranty claim (order installed, PAID, within 30 days of installed_at, not delivery-flagged, one claim per order)"
    roles: [Customer]
    code: 201
    input: ["weather_case"]
    output: WarrantyClaim
    side_effects: ["claim created SUBMITTED with eligible_turf_sqft = order.delivered_sqft"]
  - method: GET
    path: "/orders/{id}/warranty-claims"
    description: "List an order's warranty claims"
    roles: [SalesRep, FarmManager, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []
  - method: GET
    path: "/warranty-claims"
    description: "List warranty claims"
    roles: [SalesRep, FarmManager]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []
  - method: GET
    path: "/warranty-claims/{id}"
    description: "Fetch a claim"
    roles: [SalesRep, FarmManager, Customer]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/warranty-claims/{id}/watering-logs"
    description: "Customer logs a watering day (one per calendar date, within 30 days of installation)"
    roles: [Customer]
    code: 201
    input: ["log_date", "moisture_reading"]
    output: WateringLog
    side_effects: ["credits_awarded computed", "claim.total_credits recomputed"]
  - method: GET
    path: "/warranty-claims/{id}/watering-logs"
    description: "List a claim's watering logs"
    roles: [SalesRep, FarmManager, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: WateringLog[]
    side_effects: []
  - method: POST
    path: "/warranty-claims/{id}/evaluate"
    description: "Evaluate watering compliance against the weather-adjusted target; issues or rejects the establishment credit"
    roles: [FarmManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status <- COMPLIANT | INSUFFICIENT", "resolution + credit_amount set"]

  # --- fleet ---
  - method: POST
    path: "/truck-blocks"
    description: "Block a zone's truck capacity over a window (maintenance/hold); consumes the same capacity pool as order windows"
    roles: [FleetManager]
    code: 201
    input: ["freight_zone", "window_start", "window_end", "reason?"]
    output: TruckBlock
    side_effects: ["capacity consumed (ERR_CAPACITY_EXCEEDED at the 4-consumer boundary)"]
  - method: GET
    path: "/truck-blocks"
    description: "List truck blocks"
    roles: [FleetManager, FarmManager]
    code: 200
    input: ["freight_zone?", "limit?", "offset?"]
    output: TruckBlock[]
    side_effects: []

  # --- test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. DEFAULT: before any set call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [FarmManager]
    code: 200
    input: ["to_iso8601"]
    output: null
    side_effects: ["logical clock advanced"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for the endpoint, or Customer acting on another customer's resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed/missing fields, out-of-range values, uniqueness violations (customer email, variety name), misaligned windows, non-positive yield, watering-log date outside window or duplicated, inactive crew on referral" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum input carries an undeclared member (grade, settlement_method, weather_case, payment method)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in the required from-state for the requested transition (incl. dispatch before completion/wrong date, third delivery check, cancel of paid order, close of unpaid order, evaluate without logs, accept of SUPERSEDED quote)" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Action attempted on a terminal entity (CLOSED/CANCELLED order, COMPLETE/CANCELLED batch, ACCEPTED/SUPERSEDED/EXPIRED quote, ARCHIVED field, evaluated claim)" }
  - { id: ERR_STALE_FIELD_VERSION, http: 412, condition: "expected_field_version != field.version on harvest-batch create (OCC)" }
  - { id: ERR_DELIVERY_DATE_TOO_SOON, http: 422, condition: "Quote delivery_date before the current clock date" }
  - { id: ERR_CUTOFF_PASSED, http: 409, condition: "Confirm at or after the order's confirm cutoff (strict <)" }
  - { id: ERR_QUOTE_EXPIRED, http: 409, condition: "Accept attempted on/after delivery_date has passed; quote transitions to EXPIRED" }
  - { id: ERR_HARVEST_WINDOW, http: 422, condition: "Harvest actual_start before 06:00, actual_end after 18:00, or end <= start" }
  - { id: ERR_CLAIM_WINDOW_EXPIRED, http: 409, condition: "Warranty claim created more than 30 days after installed_at" }
  - { id: ERR_ZONE_SPLIT_MISMATCH, http: 422, condition: "z1+z2+z3 pallets != total_pallets computed from quote lines" }
  - { id: ERR_DUPLICATE_CLAIM, http: 409, condition: "Second warranty claim on the same order" }
  - { id: ERR_RESEED_NOT_ALLOWED, http: 409, condition: "Re-seed plan on a field whose maturity is not MATURE/OVERAGED, with batches linked to non-terminal orders, or with an active plan already" }
  - { id: ERR_SEED_SHORTFALL, http: 422, condition: "Re-seed completion with actual_seed_lbs < target_seed_lbs" }
  - { id: ERR_FIELD_NOT_HARVESTABLE, http: 409, condition: "Harvest batch on a field whose maturity_state is not READY or MATURE" }
  - { id: ERR_FIELD_QUALITY_GATE, http: 409, condition: "Harvest batch blocked: mow_count < 3, last mow >= 3 days ago, moisture outside [35,55], or health < 70" }
  - { id: ERR_BATCH_NOT_FRESH, http: 422, condition: "Allocation: variety/grade-matched unlinked batches exist but every one fails the projected 24h freshness window" }
  - { id: ERR_DELIVERY_STALE, http: 409, condition: "mark-delivered when now - min(linked harvest end) > 24h" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 409, condition: "Zone truck capacity (4) reached for the overlapping window (orders in CONFIRMED/OUT_FOR_DELIVERY + truck blocks)" }
  - { id: ERR_BATCH_YIELD_EXCEEDS_AVAILABLE, http: 422, condition: "Batch sellable_sqft exceeds field availability net of PENDING reservations" }
  - { id: ERR_ORDER_UNDER_ALLOCATED, http: 409, condition: "Allocation cannot meet a line's yield_sqft from eligible batches" }
  - { id: ERR_ORDER_NOT_SETTLED, http: 409, condition: "Warranty claim while payment_status != PAID" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "Payment amount != current amount_due (or amount_due == 0)" }
  - { id: ERR_CREW_DATE_CONFLICT, http: 409, condition: "Crew already SCHEDULED for another order on the requested scheduled_date" }
  - { id: ERR_CREW_ZONE_MISMATCH, http: 422, condition: "Referred crew's service_zones do not include the customer's freight_zone" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FarmManager
    description: "Farm operator: owns rate cards, varieties, fields, re-seeding, crews, warranty evaluation, truck-block visibility, and the test clock"
    identity: opaque
    exclusive_operations:
      - "POST /price-configs, POST /variety-configs"
      - "POST /fields, PATCH /fields/{id}/quality, POST /fields/{id}/maturity-scan, POST /fields/{id}/archive"
      - "POST /fields/{id}/reseed-plans, POST /reseed-plans/{id}/start, POST /reseed-plans/{id}/complete"
      - "POST /crews, POST /crews/{id}/deactivate"
      - "POST /warranty-claims/{id}/evaluate"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET endpoints for fields, harvest-batches, orders, quotes, warranty-claims, watering-logs, delivery-checks, payments, crews, truck-blocks, price/variety configs"
  - name: SalesRep
    description: "Order book owner: customers, quotes, order confirmation/cancellation, delivery checks, payments, crew referral & scheduling"
    identity: opaque
    exclusive_operations:
      - "POST /customers"
      - "POST /quotes, POST /quotes/{id}/accept"
      - "POST /orders/{id}/confirm, POST /orders/{id}/cancel, POST /orders/{id}/close"
      - "POST /orders/{id}/delivery-checks, POST /orders/{id}/payments"
      - "POST /orders/{id}/crew-referrals, POST /orders/{id}/crew-schedule"
    shared_operations:
      - "GET endpoints for customers, orders, quotes, fields, harvest-batches, crews, referrals, claims, checks, payments"
  - name: HarvestSupervisor
    description: "Field harvest lead: schedules, completes, and cancels harvest batches"
    identity: opaque
    exclusive_operations:
      - "POST /harvest-batches, POST /harvest-batches/{id}/complete, POST /harvest-batches/{id}/cancel"
    shared_operations:
      - "GET /harvest-batches, GET /harvest-batches/{id}, GET /fields, GET /fields/{id}, GET /variety-configs"
  - name: FleetManager
    description: "Delivery fleet dispatcher: dispatch, delivery recording, truck blocks"
    identity: opaque
    exclusive_operations:
      - "POST /orders/{id}/dispatch, POST /orders/{id}/mark-delivered"
      - "POST /truck-blocks"
    shared_operations:
      - "GET /truck-blocks, GET /orders/{id}"
  - name: Customer
    description: "Buyer: tracks own orders, records installation progress, files warranty claims, logs watering"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /orders/{id}/install-start, POST /orders/{id}/install-complete"
      - "POST /orders/{id}/warranty-claims, POST /warranty-claims/{id}/watering-logs"
    shared_operations:
      - "GET /orders/{id}, GET /customers/{id}, GET /orders/{id}/payments, GET /orders/{id}/delivery-checks, GET /orders/{id}/crew-referrals, GET /orders/{id}/warranty-claims, GET /warranty-claims/{id}, GET /warranty-claims/{id}/watering-logs (own resources only)"
