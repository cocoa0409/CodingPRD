  # =========================================================================
  - section: errors
    instances:
      - name: error_attorney_not_active_covered_by_difficulty
        claim_type: Violation → Error
        grounds: ["errors[ERR_ATTORNEY_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: state_beats_business_safety_on_file
          rationale: "ERR_ATTORNEY_NOT_ACTIVE is the lower-priority losing branch of that priority-pair conflict; the suspended-attorney path is exercised by that §1.8 instance."

      - name: error_response_deadline_passed_covered_by_difficulty
        claim_type: Violation → Error
        grounds: ["errors[ERR_RESPONSE_DEADLINE_PASSED]"]
        excluded_because:
          difficulty_instance: final_office_action_response_one_day_late_rejected
          rationale: "ERR_RESPONSE_DEADLINE_PASSED is asserted as the failure of the boundary-precision §1.8 instance."

      - name: error_stale_version_application_covered_by_difficulty
        claim_type: Violation → Error
        grounds: ["concurrency_rules[sou-create-stale-application]", "errors[ERR_STALE_VERSION]"]
        excluded_because:
          difficulty_instance: open_application_count_conserved_file_then_abandon
          rationale: "ERR_STALE_VERSION on the registration parent is exercised by occ_stale_maintenance_create_rejected_412; the SOU-parent OCC is the same mechanism on a sibling parent and is enumerated here only as a stub to avoid redundant duplication of an already-covered behavior."

  # =========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_filing_fee_visible_in_same_response
        claim_type: immediate
        grounds: ["endpoints[POST /applications/{id}/file]", entities.TrademarkApplication.fields.filing_fee_cents]
        distinguishing_aspect: "The DRAFT->FILED response surfaces the computed filing_fee_cents immediately (35000 for a USE TEAS_STANDARD single-class app) — no read-after-write lag."
        test_recipe:
          setup: ["clock 2026-01-01; class 9; Attorney; US Applicant; a DRAFT USE TEAS_STANDARD app with one class-9 item"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Examiner
            - call: "POST /nice-classes"
              payload: { class_number: 9, title: "Software" }
              as: Examiner
              captures: { nc9: $.data.id }
            - call: "POST /attorneys"
              payload: { full_name: "A. Counsel", bar_number: "BAR-900", bar_state: "NY" }
              as: Attorney
              captures: { att_id: $.data.id }
            - call: "POST /applicants"
