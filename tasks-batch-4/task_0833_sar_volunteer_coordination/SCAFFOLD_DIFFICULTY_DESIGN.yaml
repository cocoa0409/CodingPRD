# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Search & Rescue / Emergency Volunteer Coordination — Expert
# 9 rule_ids x 2 instances = 18 instances. Every ground resolves into
# SCAFFOLD.yaml §1.1-§1.7. Every setup_api_calls chain drives empty-DB -> setup.
# =============================================================================
scaffold_difficulty_design:

  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: reimbursement_estimate_vs_final_diverge
        grounds:
          - calculations.reimbursement_amount
          - entities.ReimbursementClaim.fields.estimated_amount_cents
          - entities.ReimbursementClaim.fields.final_amount_cents
          - state_machines.ReimbursementClaim.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Financial domain (ReimbursementClaim): estimate uses member-declared
          mileage (60mi -> 30650c) while final uses track-reconciled mileage
          (45mi -> 29925c); same claim, two variants, different cents.
        test_recipe:
          setup:
            - "ACTIVE incident with one member who logged two GroundTracks summing 72.0 km (=45 whole miles); a claim declaring 60 miles, 8 meals, 2 lodging nights."
          setup_api_calls:
            - call: "POST /sar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /sar/incidents"
              payload: { name: "Ridge Search", incident_type: "WILDERNESS_SEARCH", ics_incident_number: "OR-2026-0001" }
              as: Coordinator
              captures: { inc_id: $.data.id }
            - call: "POST /sar/incidents/${inc_id}/activate"
              payload: {}
              as: IncidentCommander
            - call: "POST /sar/teams"
              payload: { name: "Alpha Ground", team_type: "GROUND", base_location: "Bend" }
              as: Coordinator
              captures: { team_id: $.data.id }
            - call: "POST /sar/members"
              payload: { team_id: "${team_id}", full_name: "Jo Searcher", email: "jo@x.org", member_role: "SEARCHER" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /sar/tasks"
              payload: { incident_id: "${inc_id}", task_number: "T-1", task_type: "GRID_SEARCH", segment_area_sqkm: 10.0, planned_searcher_hours: 8, planned_start: "2026-05-02T08:00:00Z", planned_end: "2026-05-02T16:00:00Z" }
              as: Coordinator
              captures: { task_id: $.data.id }
            - call: "POST /sar/ground-tracks"
              payload: { task_id: "${task_id}", member_id: "${m_id}", recorded_at: "2026-05-02T10:00:00Z", distance_km: 30.0, duration_min: 90, coverage_area_sqkm: 3.0 }
              as: Coordinator
            - call: "POST /sar/ground-tracks"
              payload: { task_id: "${task_id}", member_id: "${m_id}", recorded_at: "2026-05-02T12:00:00Z", distance_km: 42.0, duration_min: 90, coverage_area_sqkm: 4.0 }
              as: Coordinator
            - call: "POST /sar/reimbursement-claims"
              payload: { member_id: "${m_id}", incident_id: "${inc_id}", declared_mileage_miles: 60, meal_count: 8, lodging_nights: 2 }
              as: Coordinator
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /sar/reimbursement-claims/${claim_id}/submit"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /sar/incidents/${inc_id}/demobilize"
              payload: {}
              as: IncidentCommander
            - call: "POST /sar/reimbursement-claims/${claim_id}/approve"
              payload: {}
              as: FinanceOfficer
          assert:
            - "ReimbursementClaim.${claim_id}.estimated_amount_cents == 30650"
            - "ReimbursementClaim.${claim_id}.final_amount_cents == 29925"
            - "ReimbursementClaim.${claim_id}.estimated_amount_cents != ReimbursementClaim.${claim_id}.final_amount_cents"

      - name: task_coverage_estimate_vs_actual_diverge
        grounds:
          - calculations.task_coverage_pct
          - entities.Task.fields.estimated_coverage_pct
          - entities.Task.fields.actual_coverage_pct
          - state_machines.Task.IN_PROGRESS_to_DEBRIEFED
        distinguishing_aspect: |
          Operational domain (Task): estimate from planned effort (8h*0.5/10 =
          40.00%) vs actual from recorded GroundTracks (70.38%); same task, two
          variants, different percentages.
        test_recipe:
          setup:
            - "Task (segment 10 sqkm, 8 planned searcher-hours) assigned then driven IN_PROGRESS with a deployed member, three GroundTracks of coverage 1.23456/2.34567/3.45678 sqkm, then debriefed."
          setup_api_calls:
            - call: "POST /sar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /sar/incidents"
              payload: { name: "Canyon Search", incident_type: "WILDERNESS_SEARCH", ics_incident_number: "OR-2026-0002" }
              as: Coordinator
              captures: { inc_id: $.data.id }
            - call: "POST /sar/incidents/${inc_id}/activate"
              payload: {}
              as: IncidentCommander
            - call: "POST /sar/teams"
              payload: { name: "Bravo Ground", team_type: "GROUND", base_location: "Sisters" }
              as: Coordinator
              captures: { team_id: $.data.id }
            - call: "POST /sar/members"
              payload: { team_id: "${team_id}", full_name: "Al Field", email: "al@x.org", member_role: "SEARCHER" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /sar/tasks"
              payload: { incident_id: "${inc_id}", task_number: "T-1", task_type: "GRID_SEARCH", segment_area_sqkm: 10.0, planned_searcher_hours: 8, planned_start: "2026-05-02T08:00:00Z", planned_end: "2026-05-02T16:00:00Z" }
              as: Coordinator
              captures: { task_id: $.data.id }
            - call: "POST /sar/tasks/${task_id}/assign"
              payload: {}
              as: IncidentCommander
            - call: "POST /sar/callouts"
              payload: { task_id: "${task_id}", member_id: "${m_id}" }
              as: Coordinator
              captures: { co_id: $.data.id }
            - call: "POST /sar/callouts/${co_id}/acknowledge"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /sar/callouts/${co_id}/standby"
              payload: {}
              as: Coordinator
            - call: "POST /sar/callouts/${co_id}/deploy"
              payload: {}
              as: Coordinator
            - call: "POST /sar/tasks/${task_id}/start"
              payload: {}
              as: Coordinator
            - call: "POST /sar/ground-tracks"
              payload: { task_id: "${task_id}", member_id: "${m_id}", recorded_at: "2026-05-02T10:00:00Z", distance_km: 5.0, duration_min: 60, coverage_area_sqkm: 1.23456 }
              as: Coordinator
            - call: "POST /sar/ground-tracks"
              payload: { task_id: "${task_id}", member_id: "${m_id}", recorded_at: "2026-05-02T11:00:00Z", distance_km: 6.0, duration_min: 60, coverage_area_sqkm: 2.34567 }
              as: Coordinator
            - call: "POST /sar/ground-tracks"
              payload: { task_id: "${task_id}", member_id: "${m_id}", recorded_at: "2026-05-02T12:00:00Z", distance_km: 7.0, duration_min: 60, coverage_area_sqkm: 3.45678 }
              as: Coordinator
          trigger:
            - call: "POST /sar/tasks/${task_id}/debrief"
              payload: {}
              as: IncidentCommander
          assert:
            - "Task.${task_id}.estimated_coverage_pct == 40.00"
            - "Task.${task_id}.actual_coverage_pct == 70.38"
            - "Task.${task_id}.estimated_coverage_pct != Task.${task_id}.actual_coverage_pct"

  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: reimbursement_tiered_mileage_and_caps_mode_a
        grounds:
          - calculations.reimbursement_amount
          - entities.ReimbursementClaim.fields.estimated_amount_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs with tiered-rate selection AND min-caps — mileage
          splits 50@65 + 10@40, meals min(8,6)*1500, lodging 2*9000 => 30650c.
        test_recipe:
          setup:
            - "A DRAFT claim declaring 60 miles, 8 meals, 2 lodging nights."
          setup_api_calls:
            - call: "POST /sar/incidents"
              payload: { name: "Meadow Search", incident_type: "URBAN", ics_incident_number: "OR-2026-0003" }
              as: Coordinator
              captures: { inc_id: $.data.id }
            - call: "POST /sar/teams"
              payload: { name: "Charlie", team_type: "GROUND", base_location: "Redmond" }
              as: Coordinator
              captures: { team_id: $.data.id }
            - call: "POST /sar/members"
              payload: { team_id: "${team_id}", full_name: "Bo Hiker", email: "bo@x.org", member_role: "SEARCHER" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /sar/reimbursement-claims"
              payload: { member_id: "${m_id}", incident_id: "${inc_id}", declared_mileage_miles: 60, meal_count: 8, lodging_nights: 2 }
              as: Coordinator
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /sar/reimbursement-claims/${claim_id}/submit"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "ReimbursementClaim.${claim_id}.estimated_amount_cents == 30650"

      - name: coverage_per_track_rounding_order_mode_b
        grounds:
          - calculations.task_coverage_pct
          - entities.Task.fields.actual_coverage_pct
          - state_machines.Task.IN_PROGRESS_to_DEBRIEFED
        distinguishing_aspect: |
          Mode (b): nested rounding order matters — round each track fraction to
          4dp THEN sum yields 70.38%, whereas sum-then-round yields 70.37%; the
          scaffold pins round-per-track-then-sum.
        test_recipe:
          setup:
            - "Task (segment 10 sqkm) IN_PROGRESS with three GroundTracks of coverage 1.23456/2.34567/3.45678 sqkm, then debriefed."
          setup_api_calls:
            - call: "POST /sar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /sar/incidents"
              payload: { name: "Bluff Search", incident_type: "WILDERNESS_SEARCH", ics_incident_number: "OR-2026-0004" }
              as: Coordinator
              captures: { inc_id: $.data.id }
            - call: "POST /sar/incidents/${inc_id}/activate"
              payload: {}
              as: IncidentCommander
            - call: "POST /sar/teams"
              payload: { name: "Delta Ground", team_type: "GROUND", base_location: "Prineville" }
              as: Coordinator
              captures: { team_id: $.data.id }
            - call: "POST /sar/members"
              payload: { team_id: "${team_id}", full_name: "Cy Ranger", email: "cy@x.org", member_role: "SEARCHER" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /sar/tasks"
              payload: { incident_id: "${inc_id}", task_number: "T-1", task_type: "GRID_SEARCH", segment_area_sqkm: 10.0, planned_searcher_hours: 8, planned_start: "2026-05-02T08:00:00Z", planned_end: "2026-05-02T16:00:00Z" }
              as: Coordinator
              captures: { task_id: $.data.id }
            - call: "POST /sar/tasks/${task_id}/assign"
              payload: {}
              as: IncidentCommander
            - call: "POST /sar/callouts"
              payload: { task_id: "${task_id}", member_id: "${m_id}" }
              as: Coordinator
              captures: { co_id: $.data.id }
            - call: "POST /sar/callouts/${co_id}/acknowledge"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /sar/callouts/${co_id}/standby"
              payload: {}
              as: Coordinator
            - call: "POST /sar/callouts/${co_id}/deploy"
              payload: {}
              as: Coordinator
            - call: "POST /sar/tasks/${task_id}/start"
              payload: {}
              as: Coordinator
            - call: "POST /sar/ground-tracks"
              payload: { task_id: "${task_id}", member_id: "${m_id}", recorded_at: "2026-05-02T10:00:00Z", distance_km: 5.0, duration_min: 60, coverage_area_sqkm: 1.23456 }
              as: Coordinator
            - call: "POST /sar/ground-tracks"
              payload: { task_id: "${task_id}", member_id: "${m_id}", recorded_at: "2026-05-02T11:00:00Z", distance_km: 6.0, duration_min: 60, coverage_area_sqkm: 2.34567 }
              as: Coordinator
            - call: "POST /sar/ground-tracks"
              payload: { task_id: "${task_id}", member_id: "${m_id}", recorded_at: "2026-05-02T12:00:00Z", distance_km: 7.0, duration_min: 60, coverage_area_sqkm: 3.45678 }
              as: Coordinator
          trigger:
            - call: "POST /sar/tasks/${task_id}/debrief"
              payload: {}
              as: IncidentCommander
          assert:
            - "Task.${task_id}.actual_coverage_pct == 70.38"

  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: task_suspend_resume_cycle
        grounds:
          - state_machines.Task.IN_PROGRESS_to_SUSPENDED
          - state_machines.Task.SUSPENDED_to_IN_PROGRESS
          - entities.Task.fields.status
        distinguishing_aspect: |
          Cyclic machine on Task: IN_PROGRESS -> SUSPENDED -> IN_PROGRESS
          re-enters a non-terminal state, proving the machine is not linear.
        test_recipe:
          setup:
            - "A task driven IN_PROGRESS with a deployed member."
          setup_api_calls:
            - call: "POST /sar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /sar/incidents"
              payload: { name: "Loop Search", incident_type: "WILDERNESS_SEARCH", ics_incident_number: "OR-2026-0005" }
              as: Coordinator
              captures: { inc_id: $.data.id }
            - call: "POST /sar/incidents/${inc_id}/activate"
              payload: {}
              as: IncidentCommander
            - call: "POST /sar/teams"
              payload: { name: "Echo Ground", team_type: "GROUND", base_location: "Madras" }
              as: Coordinator
              captures: { team_id: $.data.id }
            - call: "POST /sar/members"
              payload: { team_id: "${team_id}", full_name: "Di Scout", email: "di@x.org", member_role: "SEARCHER" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /sar/tasks"
              payload: { incident_id: "${inc_id}", task_number: "T-1", task_type: "GRID_SEARCH", segment_area_sqkm: 5.0, planned_searcher_hours: 4, planned_start: "2026-05-02T08:00:00Z", planned_end: "2026-05-02T16:00:00Z" }
              as: Coordinator
              captures: { task_id: $.data.id }
            - call: "POST /sar/tasks/${task_id}/assign"
              payload: {}
              as: IncidentCommander
            - call: "POST /sar/callouts"
              payload: { task_id: "${task_id}", member_id: "${m_id}" }
              as: Coordinator
              captures: { co_id: $.data.id }
            - call: "POST /sar/callouts/${co_id}/acknowledge"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /sar/callouts/${co_id}/standby"
              payload: {}
              as: Coordinator
            - call: "POST /sar/callouts/${co_id}/deploy"
              payload: {}
              as: Coordinator
            - call: "POST /sar/tasks/${task_id}/start"
              payload: {}
              as: Coordinator
          trigger:
            - call: "POST /sar/tasks/${task_id}/suspend"
              payload: {}
              as: Coordinator
              captures: { susp_status: $.data.status }
            - call: "POST /sar/tasks/${task_id}/resume"
              payload: {}
              as: Coordinator
          assert:
            - "susp_status == SUSPENDED"
            - "Task.${task_id}.status == IN_PROGRESS"

      - name: claim_return_resubmit_cycle
        grounds:
          - state_machines.ReimbursementClaim.SUBMITTED_to_RETURNED
          - state_machines.ReimbursementClaim.RETURNED_to_SUBMITTED
          - entities.ReimbursementClaim.fields.status
        distinguishing_aspect: |
          Cyclic machine on ReimbursementClaim (different entity than Task):
          SUBMITTED -> RETURNED -> SUBMITTED revision loop re-enters SUBMITTED.
        test_recipe:
          setup:
            - "A SUBMITTED claim."
          setup_api_calls:
            - call: "POST /sar/incidents"
              payload: { name: "Cycle Search", incident_type: "URBAN", ics_incident_number: "OR-2026-0006" }
              as: Coordinator
              captures: { inc_id: $.data.id }
            - call: "POST /sar/teams"
              payload: { name: "Foxtrot", team_type: "GROUND", base_location: "Bend" }
              as: Coordinator
              captures: { team_id: $.data.id }
            - call: "POST /sar/members"
              payload: { team_id: "${team_id}", full_name: "Ed Vol", email: "ed@x.org", member_role: "SEARCHER" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /sar/reimbursement-claims"
              payload: { member_id: "${m_id}", incident_id: "${inc_id}", declared_mileage_miles: 20, meal_count: 1, lodging_nights: 0 }
              as: Coordinator
              captures: { claim_id: $.data.id }
            - call: "POST /sar/reimbursement-claims/${claim_id}/submit"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /sar/reimbursement-claims/${claim_id}/return"
              payload: {}
              as: FinanceOfficer
              captures: { ret_status: $.data.status }
            - call: "POST /sar/reimbursement-claims/${claim_id}/submit"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "ret_status == RETURNED"
            - "ReimbursementClaim.${claim_id}.status == SUBMITTED"

  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: incident_cancel_cascade_depth3
        grounds:
          - state_machines.Incident.ACTIVE_to_CANCELLED
          - state_machines.Task.IN_PROGRESS_to_CANCELLED
          - state_machines.Callout.DEPLOYED_to_DEMOBILIZED
          - entities.Member.fields.status
        distinguishing_aspect: |
          Depth-3 chain from incident cancel: Incident->CANCELLED causes
          Task->CANCELLED, which causes Callout->DEMOBILIZED, which causes
          Member->ACTIVE; each link is caused by the prior link.
        test_recipe:
          setup:
            - "ACTIVE incident with an ASSIGNED task carrying one DEPLOYED callout (member DEPLOYED)."
          setup_api_calls:
            - call: "POST /sar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /sar/incidents"
              payload: { name: "Cascade Search", incident_type: "WILDERNESS_SEARCH", ics_incident_number: "OR-2026-0007" }
              as: Coordinator
              captures: { inc_id: $.data.id }
            - call: "POST /sar/incidents/${inc_id}/activate"
              payload: {}
              as: IncidentCommander
            - call: "POST /sar/teams"
              payload: { name: "Golf Ground", team_type: "GROUND", base_location: "Bend" }
              as: Coordinator
              captures: { team_id: $.data.id }
            - call: "POST /sar/members"
              payload: { team_id: "${team_id}", full_name: "Fi Track", email: "fi@x.org", member_role: "SEARCHER" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /sar/tasks"
              payload: { incident_id: "${inc_id}", task_number: "T-1", task_type: "GRID_SEARCH", segment_area_sqkm: 5.0, planned_searcher_hours: 4, planned_start: "2026-05-02T08:00:00Z", planned_end: "2026-05-02T16:00:00Z" }
              as: Coordinator
              captures: { task_id: $.data.id }
            - call: "POST /sar/tasks/${task_id}/assign"
              payload: {}
              as: IncidentCommander
            - call: "POST /sar/callouts"
              payload: { task_id: "${task_id}", member_id: "${m_id}" }
              as: Coordinator
              captures: { co_id: $.data.id }
            - call: "POST /sar/callouts/${co_id}/acknowledge"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /sar/callouts/${co_id}/standby"
              payload: {}
              as: Coordinator
            - call: "POST /sar/callouts/${co_id}/deploy"
              payload: {}
              as: Coordinator
          trigger:
            - call: "POST /sar/incidents/${inc_id}/cancel"
              payload: {}
              as: IncidentCommander
          assert:
            - "Incident.${inc_id}.status == CANCELLED"
            - "Task.${task_id}.status == CANCELLED"
            - "Callout.${co_id}.status == DEMOBILIZED"
            - "Member.${m_id}.status == ACTIVE"

      - name: task_suspend_cascade_depth2
        grounds:
          - state_machines.Task.IN_PROGRESS_to_SUSPENDED
          - state_machines.ResourceAssignment.ACTIVE_to_RELEASED
          - entities.Resource.fields.active_assignment_count
          - calculations.resource_active_assignment_count
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (task suspend):
          Task->SUSPENDED causes ResourceAssignment->RELEASED, which causes
          Resource.active_assignment_count -1 and Resource->AVAILABLE.
        test_recipe:
          setup:
            - "Task IN_PROGRESS with one ACTIVE ResourceAssignment (Resource count 1)."
          setup_api_calls:
            - call: "POST /sar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /sar/incidents"
              payload: { name: "Air Support", incident_type: "AIR_SEARCH", ics_incident_number: "OR-2026-0008" }
              as: Coordinator
              captures: { inc_id: $.data.id }
            - call: "POST /sar/incidents/${inc_id}/activate"
              payload: {}
              as: IncidentCommander
            - call: "POST /sar/teams"
              payload: { name: "Hotel Air", team_type: "AIR", base_location: "Redmond" }
              as: Coordinator
              captures: { team_id: $.data.id }
            - call: "POST /sar/members"
              payload: { team_id: "${team_id}", full_name: "Gwen Pilot", email: "gwen@x.org", member_role: "PILOT" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /sar/tasks"
              payload: { incident_id: "${inc_id}", task_number: "T-1", task_type: "AIR_RECON", segment_area_sqkm: 20.0, planned_searcher_hours: 4, planned_start: "2026-05-02T08:00:00Z", planned_end: "2026-05-02T16:00:00Z" }
              as: Coordinator
              captures: { task_id: $.data.id }
            - call: "POST /sar/tasks/${task_id}/assign"
              payload: {}
              as: IncidentCommander
            - call: "POST /sar/callouts"
              payload: { task_id: "${task_id}", member_id: "${m_id}" }
              as: Coordinator
              captures: { co_id: $.data.id }
            - call: "POST /sar/callouts/${co_id}/acknowledge"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /sar/callouts/${co_id}/standby"
              payload: {}
              as: Coordinator
            - call: "POST /sar/callouts/${co_id}/deploy"
              payload: {}
              as: Coordinator
            - call: "POST /sar/tasks/${task_id}/start"
              payload: {}
              as: Coordinator
            - call: "POST /sar/resources"
              payload: { name: "Helo N123", resource_type: "HELICOPTER" }
              as: Coordinator
