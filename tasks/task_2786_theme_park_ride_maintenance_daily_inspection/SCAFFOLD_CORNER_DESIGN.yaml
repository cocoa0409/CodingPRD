      - name: downtime_awaiting_parts_loop_returns_to_diagnosed_when_the_part_arrives
        claim_type: cyclic
        grounds:
          - "state_machines.DowntimeEvent.transitions.DIAGNOSED_to_AWAITING_PARTS"
          - "state_machines.DowntimeEvent.transitions.AWAITING_PARTS_to_DIAGNOSED"
          - "state_machines.PartRequisition.transitions.REQUESTED_to_BACKORDERED"
          - "state_machines.PartRequisition.transitions.BACKORDERED_to_RECEIVED"
        distinguishing_aspect: "The DIAGNOSED -> AWAITING_PARTS -> DIAGNOSED loop is driven entirely by the linked requisition (backorder then receive), the loop is traversable twice with a second requisition, and the event's posture contribution stays DOWN for the whole cycle while committed budget only ever grows by the two requisition totals (40000 then 70000)."
        test_recipe:
          setup:
            - "One attraction with parts_budget_cents 1000000, one DIAGNOSED downtime event and two requisitions linked to that event."
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Loop Ride", park_area: "LAGOON", manufacturer: "Mack", model_code: "LP-1", ride_class: "WATER", theoretical_hourly_capacity: 600, min_operators_required: 2, parts_budget_cents: 1000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a_id: "$.data.id" }
            - call: "POST /park-ops/downtime-events"
              payload: { attraction_id: "${a_id}", started_at: "2026-08-01T11:00:00.000Z", cause_category: "MECHANICAL" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
              captures: { d_id: "$.data.id" }
            - call: "POST /park-ops/downtime-events/${d_id}/diagnose"
              payload: { root_cause_code: "PUMP-SEAL-LEAK" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "POST /park-ops/part-requisitions"
              payload: { attraction_id: "${a_id}", part_number: "PN-SEAL", quantity: 2, unit_cost_cents: 20000, needed_by_date: "2026-08-05", downtime_event_id: "${d_id}" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
              captures: { r1: "$.data.id" }
            - call: "POST /park-ops/part-requisitions"
              payload: { attraction_id: "${a_id}", part_number: "PN-IMPELLER", quantity: 1, unit_cost_cents: 30000, needed_by_date: "2026-08-07", downtime_event_id: "${d_id}" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
              captures: { r2: "$.data.id" }
          trigger:
            - call: "POST /park-ops/part-requisitions/${r1}/backorder"
              payload: { expected_availability_date: "2026-08-04" }
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "POST /park-ops/part-requisitions/${r1}/receive"
              payload: {}
              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "POST /park-ops/part-requisitions/${r2}/backorder"
              payload: { expected_availability_date: "2026-08-06" }
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "POST /park-ops/part-requisitions/${r2}/receive"
              payload: {}
              as: MaintenanceTechnician
              as_user_id: "tech-1"
          assert:
            - "After trigger 1: DowntimeEvent.${d_id}.status == \"AWAITING_PARTS\"; PartRequisition.${r1}.status == \"BACKORDERED\" and expected_availability_date == \"2026-08-04\"; Attraction.${a_id}.parts_budget_committed_cents == 40000"
            - "After trigger 2: DowntimeEvent.${d_id}.status == \"DIAGNOSED\"; PartRequisition.${r1}.status == \"RECEIVED\"; Attraction.${a_id}.parts_budget_committed_cents == 40000 (RECEIVED stays committed)"
            - "After trigger 3: DowntimeEvent.${d_id}.status == \"AWAITING_PARTS\" (second traversal of the loop); Attraction.${a_id}.parts_budget_committed_cents == 70000"
            - "After trigger 4: DowntimeEvent.${d_id}.status == \"DIAGNOSED\" and root_cause_code == \"PUMP-SEAL-LEAK\" and ended_at is null"
            - "Attraction.${a_id}.operational_posture == \"DOWN\" after every one of the four triggers"
            - "Attraction.${a_id}.ytd_downtime_minutes == 0 (nothing is CLOSED)"

      - name: backorder_parks_only_a_diagnosed_event_and_cancel_walks_it_back
        claim_type: conditional_cascade
        grounds:
          - "state_machines.PartRequisition.transitions.REQUESTED_to_BACKORDERED"
          - "state_machines.PartRequisition.transitions.BACKORDERED_to_CANCELLED"
          - "state_machines.DowntimeEvent.transitions.DIAGNOSED_to_AWAITING_PARTS"
        distinguishing_aspect: "The AWAITING_PARTS side effect fires only when the linked event is exactly DIAGNOSED: backordering against an OPEN event leaves it OPEN, backordering an unlinked requisition touches no event at all, and cancelling a BACKORDERED requisition whose event is AWAITING_PARTS returns that event to DIAGNOSED while releasing exactly 50000 cents."
        test_recipe:
          setup:
            - "Attraction A1 with an OPEN (undiagnosed) event and two requisitions; attraction A2 with a DIAGNOSED event and one requisition."
