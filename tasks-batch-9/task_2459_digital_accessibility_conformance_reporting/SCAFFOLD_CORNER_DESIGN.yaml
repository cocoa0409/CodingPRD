          assert:
            - "${cov} == 45.00"
            - "${units} == 40"
            - "AssessmentRun.${run_kb}.status == SCHEDULED"
            - "ProductComponent.${comp_id}.validated_disability_categories contains exactly VISION and COGNITIVE; MOTOR from the still-scheduled run is absent"

      - name: corner_magnification_only_manual_evidence_weight
        claim_type: correct_result
        grounds:
