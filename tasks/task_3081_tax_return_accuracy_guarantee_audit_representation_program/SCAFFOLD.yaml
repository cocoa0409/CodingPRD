scenario: 'Tax Return Accuracy Guarantee & Audit Representation Program (H&R Block): return preparation with preparer credential tiering and complexity-based pricing, optional protection product sold at
  filing covering interest, penalties and representation, claim intake when a taxing authority notices a client with scope determination against the product terms, representation assignment to an enrolled
  agent with power of attorney execution, reimbursement calculation for preparer error versus taxpayer-provided data error, product liability accrual and claim frequency monitoring by office, prior-year
  return review and amended return handling, office-level quality review and preparer remediation'
domain_name: tax-return-accuracy-guarantee
api_prefix: /tax
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
  - optimistic_concurrency
  - cascading_side_effects
  - dual_variant_calculation
  - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
  - one_to_many
  - self_referential
  - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\": \"object\" | \"array\", \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\" } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
entities:
- name: Office
  parent: null
  common_fields: true
  fields:
  - name: name
    type: string
    source: input
    description: Office display name
  - name: region_code
    type: string
    source: input
    description: Two-letter region code, e.g. CA
  - name: posture
    type: enum
    source: computed
    description: Derived office posture gating product sales and preparer upgrades
    constraints: one of {OK, WATCH, PROBATION}; recomputed by POST /tax/offices/{id}/quality-close; starts OK
    default: OK
  - name: last_close_period
    type: string
    source: computed
    description: Last closed YYYY-MM period; null before first close
    default: null
- name: Preparer
  parent: null
  common_fields: true
  fields:
  - name: office_id
    type: string
    source: input
    description: FK -> Office.id; employing office
  - name: full_name
    type: string
    source: input
    description: Preparer legal name
  - name: tier
    type: enum
    source: input
    description: Credential tier driving the fee multiplier
    constraints: one of {ASSOCIATE, SENIOR, MASTER, ENROLLED_AGENT}
  - name: credential_status
    type: enum
    source: computed
    description: Credential standing; independent of remediation_status (parallel dimension)
    constraints: one of {ACTIVE, SUSPENDED}
    default: ACTIVE
  - name: remediation_status
    type: enum
    source: computed
    description: Remediation standing; parallel dimension to credential_status
    constraints: one of {NONE, ACTIVE, COMPLETED}
    default: NONE
- name: Client
  parent: null
  common_fields: true
  fields:
  - name: full_name
    type: string
    source: input
    description: Taxpayer legal name
  - name: email
    type: string
    source: input
    description: Contact email; unique across clients
    constraints: unique
- name: TaxReturn
  parent: null
  common_fields: true
  fields:
  - name: client_id
    type: string
    source: input
    description: FK -> Client.id; taxpayer
  - name: office_id
    type: string
    source: input
    description: FK -> Office.id; preparing office
  - name: preparer_id
    type: string
    source: input
    description: FK -> Preparer.id; assigned preparer
  - name: tax_year
    type: integer
    source: input
    description: Calendar tax year, e.g. 2025
  - name: components
    type: array
    source: input
    description: Complexity component codes driving quote, premium, and eligibility
    constraints: non-empty array of enum {1040_SIMPLE, 1040_ITEMIZED, 1040_BUSINESS, 1040_MULTI_STATE, AMENDED_RETURN, PRIOR_YEAR_REVIEW}; no duplicates
  - name: filing_kind
    type: enum
    source: input
    description: ORIGINAL or AMENDED
    constraints: one of {ORIGINAL, AMENDED}
    default: ORIGINAL
  - name: original_return_id
    type: string
    source: input
    description: FK -> TaxReturn.id; required and must reference a FILED return when filing_kind == AMENDED; null otherwise
    default: null
  - name: status
    type: enum
    source: computed
    description: Return lifecycle
    constraints: one of {PREPARING, FILED}
    default: PREPARING
  - name: quoted_fee_cents
    type: integer
    source: computed
    description: Quote at creation / PATCH using preparer tier at that moment (prep_fee_quote)
  - name: final_fee_cents
    type: integer
    source: computed
    description: Fee locked at filing using preparer tier at filing time (prep_fee_final); null until FILED
    default: null
- name: ProtectionProduct
  parent: null
  common_fields: true
  fields:
  - name: return_id
    type: string
    source: input
    description: FK -> TaxReturn.id; exactly one product per return
    constraints: unique per return_id
  - name: tier
    type: enum
    source: input
    description: PLUS adds penalty coverage on top of STANDARD
    constraints: one of {STANDARD, PLUS}
  - name: premium_cents
    type: integer
    source: computed
    description: protection_premium at purchase time
  - name: status
    type: enum
    source: computed
    description: ACTIVE products back claims; VOID after a denied-as-ineligible purchase reversal
    constraints: one of {ACTIVE, VOID}
    default: ACTIVE
- name: AuthorityNotice
  parent: null
  common_fields: true
  fields:
  - name: return_id
    type: string
    source: input
    description: FK -> TaxReturn.id; noticed return (must be FILED)
  - name: claim_id
    type: string
    source: computed
    description: FK -> Claim.id; set when a claim intake links this notice; null until linked
    default: null
  - name: authority_type
    type: enum
    source: input
    description: Taxing authority family
    constraints: one of {FEDERAL, STATE}
  - name: notice_reference
    type: string
    source: input
    description: Authority's notice identifier (free text)
  - name: tax_delta_cents
    type: integer
    source: input
    description: Additional tax assessed; >= 0
    constraints: '>= 0'
  - name: penalty_cents
    type: integer
    source: input
    description: Penalty assessed by authority; >= 0
    constraints: '>= 0'
  - name: issued_at
    type: datetime
    source: input
    description: Notice issue date (ISO8601)
  - name: due_at
    type: datetime
    source: input
    description: Authority payment due date; interest accrues from due_at to paid_at
  - name: interest_cents
    type: integer
    source: computed
    description: interest_accrual result at payment time; null until PAID
    default: null
  - name: paid_at
    type: datetime
    source: computed
    description: Set to logical clock when payment recorded; null until PAID
    default: null
  - name: status
    type: enum
    source: computed
    description: Notice lifecycle
    constraints: one of {OPEN, PAID, ABATED, WITHDRAWN}
    default: OPEN
- name: Claim
  parent: null
  common_fields: true
  fields:
  - name: return_id
    type: string
    source: input
    description: FK -> TaxReturn.id; claimed return
  - name: notice_id
    type: string
    source: input
    description: FK -> AuthorityNotice.id; triggering notice (OPEN, not already linked)
  - name: protection_product_id
    type: string
    source: computed
    description: FK -> ProtectionProduct.id; resolved from return_id at intake
  - name: status
    type: enum
    source: computed
    description: Claim lifecycle with INFO_NEEDED loop and REOPENED cycle
    constraints: one of {TRIAGE, INFO_NEEDED, SCOPE_CONFIRMED, ASSIGNED, REPRESENTING, RESOLVED, REOPENED, DENIED}
    default: TRIAGE
  - name: scope
    type: enum
    source: computed
    description: Scope determination against product terms
    constraints: one of {IN_SCOPE, OUT_OF_SCOPE}; null until scoped
    default: null
  - name: error_attribution
    type: enum
    source: computed
    description: Root-cause attribution driving reimbursement variant
    constraints: one of {PREPARER_ERROR, CLIENT_DATA_ERROR}; required when scope == IN_SCOPE; null until scoped
    default: null
  - name: scoped_by_user_id
    type: string
    source: computed
    description: X-User-ID of the CaseManager who scoped the claim; segregation-of-duties anchor
    default: null
  - name: payout_interest_cents
    type: integer
    source: computed
    description: reimbursement_payout interest component; 0 for CLIENT_DATA_ERROR
    default: 0
  - name: payout_penalty_cents
    type: integer
    source: computed
    description: Penalty component; PLUS tier only, PREPARER_ERROR only
    default: 0
  - name: payout_base_cents
    type: integer
    source: computed
    description: Additional-tax component reimbursed; PREPARER_ERROR only
    default: 0
  - name: payout_total_cents
    type: integer
    source: computed
    description: Sum of the three payout components; recomputed on each linked-notice status change
    default: 0
  - name: final_liability_cents
    type: integer
    source: computed
    description: 'Amount debited from escrow at RESOLVED: payout_total_cents + (payout_base_cents > 0 ? payout_base_cents : 0) folded per reimbursement_payout; null until RESOLVED'
    default: null
- name: EnrolledAgent
  parent: null
  common_fields: true
  fields:
  - name: full_name
    type: string
    source: input
    description: Agent legal name
  - name: license_number
    type: string
    source: input
    description: EA license; unique
    constraints: unique
  - name: max_parallel
    type: integer
    source: input
    description: Cap on claims held in REPRESENTING under this agent; >= 1
    constraints: '>= 1'
    default: 3
- name: RepresentationAssignment
  parent: null
  common_fields: true
  fields:
  - name: claim_id
    type: string
    source: input
    description: FK -> Claim.id
  - name: agent_id
    type: string
    source: input
    description: FK -> EnrolledAgent.id
  - name: window_start
    type: datetime
    source: input
    description: Representation window start (ISO8601); half-open [start, end)
  - name: window_end
    type: datetime
    source: input
    description: Representation window end; must be > window_start
  - name: status
    type: enum
    source: computed
    description: Assignment lifecycle
    constraints: one of {ACTIVE, COMPLETED, CANCELLED}
    default: ACTIVE
- name: PowerOfAttorney
  parent: null
  common_fields: true
  fields:
  - name: claim_id
    type: string
    source: input
    description: FK -> Claim.id; new POA supersedes any existing DRAFT POA on the claim
  - name: agent_id
    type: string
    source: input
    description: FK -> EnrolledAgent.id; attorney-in-fact
  - name: expires_at
    type: datetime
    source: input
    description: POA expiry (ISO8601); execution requires expires_at > logical clock
  - name: executed_at
    type: datetime
    source: computed
    description: Logical clock at execution; null until EXECUTED
    default: null
  - name: status
    type: enum
    source: computed
    description: POA lifecycle
    constraints: one of {DRAFT, EXECUTED, REVOKED, EXPIRED}
    default: DRAFT
- name: RemediationAction
  parent: null
  common_fields: true
  fields:
  - name: preparer_id
    type: string
    source: input
    description: FK -> Preparer.id; remediated preparer
  - name: due_at
    type: datetime
    source: input
    description: Completion deadline; overdue when logical clock > due_at and status == OPEN
  - name: completed_at
    type: datetime
    source: computed
    description: Logical clock at completion; null until COMPLETED
    default: null
  - name: status
    type: enum
    source: computed
    description: Remediation lifecycle; OVERDUE is derived (clock > due_at and not COMPLETED), never stored
    constraints: stored one of {OPEN, COMPLETED}
    default: OPEN
- name: OfficeEscrow
  parent: null
  common_fields: true
  fields:
  - name: office_id
    type: string
    source: input
    description: FK -> Office.id; one escrow per office
    constraints: unique per office_id
  - name: funded_cents
    type: integer
    source: input
    description: Total program funding; > 0
    constraints: '> 0'
  - name: paid_out_cents
    type: integer
    source: computed
    description: Sum of final_liability_cents over RESOLVED claims of this office minus credited reversals
    default: 0
  - name: expected_accrual_cents
    type: integer
    source: computed
    description: 'escrow_accrual_expected: per-claim round_half_up(payout_total_cents * 1.10) summed over RESOLVED claims'
    default: 0
- name: OfficeQualitySnapshot
  parent: null
  common_fields: true
  fields:
  - name: office_id
    type: string
    source: computed
    description: FK -> Office.id
  - name: period_month
    type: string
    source: input
    description: Closed period, YYYY-MM
  - name: returns_examined
    type: integer
    source: input
    description: Returns sampled in the period; > 0
    constraints: '> 0'
  - name: returns_with_defects
    type: integer
    source: input
    description: Sampled returns with defects; 0 <= x <= returns_examined
    constraints: 0 <= x <= returns_examined
  - name: defect_rate
    type: number
    source: computed
    description: returns_with_defects / returns_examined, exact decimal
  - name: quality_score
    type: integer
    source: computed
    description: office_quality_score result, 0..100
  - name: posture_after
    type: string
    source: computed
    description: Office.posture immediately after this close
state_machines:
- entity: TaxReturn
  initial_state: PREPARING
  terminal_states:
  - FILED
  transitions:
  - from: PREPARING
    to: FILED
    trigger: POST /tax/returns/{id}/file
    actor: OfficeManager
    preconditions:
    - Return.status == PREPARING
    - Return.preparer_id resolves to a Preparer with credential_status == ACTIVE
    - If filing_kind == AMENDED then original_return_id is non-null and the referenced return is FILED
    side_effects:
    - Computes final_fee_cents via prep_fee_final using the preparer's tier at filing time
    - Sets status := FILED; increments Return.version by 1
    note: A PATCH to preparer_id between quote and filing makes quoted_fee_cents and final_fee_cents diverge.
- entity: ProtectionProduct
  initial_state: ACTIVE
  terminal_states:
  - VOID
  transitions:
  - from: ACTIVE
    to: VOID
    trigger: system side effect of POST /tax/products on a return that already has an ACTIVE product
    actor: system
    preconditions:
    - The conflicting purchase is rejected with ERR_DUPLICATE_PRODUCT
    side_effects:
    - None to the existing product (it stays ACTIVE); VOID is only reachable via admin reversal POST /tax/products/{id}/void on a product with no non-terminal claims
    note: VOID transition is implemented by the void endpoint, not by duplicate-purchase attempts.
  - from: ACTIVE
    to: VOID
    trigger: POST /tax/products/{id}/void
    actor: ProgramAdmin
    preconditions:
    - Product.status == ACTIVE
    - No Claim with protection_product_id == product.id in status {TRIAGE, INFO_NEEDED, SCOPE_CONFIRMED, ASSIGNED, REPRESENTING, REOPENED}
    side_effects:
    - Product.status := VOID; increments Product.version by 1
- entity: AuthorityNotice
  initial_state: OPEN
  terminal_states:
  - PAID
  - ABATED
  - WITHDRAWN
  transitions:
  - from: OPEN
    to: PAID
    trigger: POST /tax/notices/{id}/pay
    actor: OfficeManager
    preconditions:
    - Notice.status == OPEN
    side_effects:
    - Computes interest_cents via interest_accrual with paid_at := logical clock
    - 'CASCADE hop 2: linked Claim (notice.claim_id) recomputes payout_interest_cents/payout_base_cents/payout_penalty_cents via reimbursement_payout and payout_total_cents'
    - 'CASCADE hop 3 (only if the linked Claim is RESOLVED): Claim REOPENED-rescale bookkeeping — reopen is a separate endpoint; a pay on a RESOLVED claim''s notice is rejected (see validations)'
    - Notice.status := PAID; increments version by 1
    note: Payment on a notice whose linked claim is RESOLVED is rejected with ERR_CLAIM_ALREADY_RESOLVED; use claim reopen first.
  - from: OPEN
    to: ABATED
    trigger: POST /tax/notices/{id}/abate
    actor: EnrolledAgent
    preconditions:
    - Notice.status == OPEN
    - Notice is linked to a Claim in status REPRESENTING (the acting agent must hold the ACTIVE assignment on that claim)
    side_effects:
    - Sets interest_cents := 0, penalty_cents := 0 (authority granted abatement)
    - 'CASCADE hop 2: linked Claim recomputes payout components via reimbursement_payout'
    - Notice.status := ABATED; increments version by 1
  - from: OPEN
    to: WITHDRAWN
    trigger: POST /tax/notices/{id}/withdraw
    actor: OfficeManager
    preconditions:
    - Notice.status == OPEN
    - Notice.claim_id is null (a claim-linked notice must be resolved through the claim, not withdrawn)
    side_effects:
    - Notice.status := WITHDRAWN; increments version by 1
- entity: Claim
  initial_state: TRIAGE
  terminal_states:
  - RESOLVED
  - DENIED
  transitions:
  - from: TRIAGE
    to: SCOPE_CONFIRMED
    trigger: POST /tax/claims/{id}/scope with scope == IN_SCOPE
    actor: CaseManager
    preconditions:
    - Claim.status in {TRIAGE, REOPENED}
    - payload.error_attribution present (required when scope == IN_SCOPE)
    side_effects:
    - Sets scope := IN_SCOPE, error_attribution, scoped_by_user_id := acting X-User-ID
    - Increments Claim.version by 1
  - from: TRIAGE
    to: DENIED
    trigger: POST /tax/claims/{id}/scope with scope == OUT_OF_SCOPE
    actor: CaseManager
    preconditions:
    - Claim.status in {TRIAGE, REOPENED}
    side_effects:
    - Sets scope := OUT_OF_SCOPE; payout fields remain 0
    - Claim.status := DENIED; increments version by 1
  - from: TRIAGE
    to: INFO_NEEDED
    trigger: POST /tax/claims/{id}/request-info
    actor: CaseManager
    preconditions:
    - Claim.status in {TRIAGE, REOPENED}
    side_effects:
    - Increments Claim.version by 1
  - from: INFO_NEEDED
    to: TRIAGE
    trigger: POST /tax/claims/{id}/provide-info
    actor: Client
    preconditions:
    - Claim.status == INFO_NEEDED
    - Acting X-User-ID equals the owning Client.id (Client is entity_backed)
    side_effects:
    - Claim.status := TRIAGE; increments version by 1
    note: The TRIAGE <-> INFO_NEEDED pair forms the info loop; INFO_NEEDED is non-terminal.
  - from: REOPENED
    to: SCOPE_CONFIRMED
    trigger: POST /tax/claims/{id}/scope with scope == IN_SCOPE (re-scope path)
    actor: CaseManager
    preconditions:
    - Claim.status in {TRIAGE, REOPENED}
    - payload.error_attribution present
    side_effects:
    - Re-sets scope/error_attribution/scoped_by_user_id; payout fields will be recomputed at next resolve
    - Claim.status := SCOPE_CONFIRMED; increments version by 1
  - from: REOPENED
    to: DENIED
    trigger: POST /tax/claims/{id}/scope with scope == OUT_OF_SCOPE (re-scope denial)
    actor: CaseManager
    preconditions:
    - Claim.status in {TRIAGE, REOPENED}
    side_effects:
    - Claim.status := DENIED; increments version by 1
  - from: SCOPE_CONFIRMED
    to: ASSIGNED
    trigger: POST /tax/claims/{id}/assign
    actor: CaseManager
    preconditions:
    - Claim.status == SCOPE_CONFIRMED
    - Claim.scope == IN_SCOPE
    - 'EnrolledAgent parallel capacity: count of claims in REPRESENTING under agent < agent.max_parallel'
    - No ACTIVE RepresentationAssignment on this claim
    side_effects:
    - Creates RepresentationAssignment(status := ACTIVE) with the payload window
    - Claim.status := ASSIGNED; increments version by 1
  - from: ASSIGNED
    to: REPRESENTING
    trigger: POST /tax/claims/{id}/poa/execute
    actor: CaseManager
    preconditions:
    - Claim.status == ASSIGNED
    - Claim has a PowerOfAttorney in DRAFT
    - payload.expected_poa_version equals that POA's current version (OCC)
    - POA.expires_at > logical clock
    - POA.agent_id == agent of the claim's ACTIVE assignment
    side_effects:
    - POA.status := EXECUTED, executed_at := logical clock; increments POA.version by 1
    - Claim.status := REPRESENTING; increments Claim.version by 1
  - from: REPRESENTING
    to: RESOLVED
    trigger: POST /tax/claims/{id}/resolve
    actor: CaseManager
    preconditions:
    - Claim.status == REPRESENTING
    - Acting X-User-ID != Claim.scoped_by_user_id (segregation of duties)
    - Every linked AuthorityNotice is terminal (PAID, ABATED, or WITHDRAWN)
    side_effects:
    - Computes payout components and payout_total_cents via reimbursement_payout
    - Sets final_liability_cents via reimbursement_payout liability formula
    - 'CASCADE hop 2: ACTIVE RepresentationAssignment on this claim -> COMPLETED'
    - 'CASCADE hop 3: OfficeEscrow of the claim''s office: paid_out_cents += final_liability_cents; expected_accrual_cents += round_half_up(payout_total_cents * 1.10); escrow version += 1'
    - 'CASCADE hop 4: Office accrual_coverage recomputed on next read (expected_accrual vs funded - paid_out)'
    - Claim.status := RESOLVED; increments version by 1
  - from: RESOLVED
    to: REOPENED
    trigger: POST /tax/claims/{id}/reopen
    actor: CaseManager
    preconditions:
    - Claim.status == RESOLVED
    side_effects:
    - 'CASCADE hop 2: OfficeEscrow.paid_out_cents -= final_liability_cents (credit-back); escrow version += 1 (expected_accrual_cents NOT reduced — accrual is historical)'
    - Claim.status := REOPENED; final_liability_cents retained for audit; increments version by 1
    note: RESOLVED -> REOPENED -> SCOPE_CONFIRMED -> ... -> RESOLVED forms the claim cycle.
  - from: DENIED
    to: DENIED
    trigger: any further transition attempt
    actor: system
    preconditions: []
    side_effects: []
    note: 'DENIED is terminal: every transition attempt returns ERR_INVALID_STATE.'
- entity: RepresentationAssignment
  initial_state: ACTIVE
  terminal_states:
  - COMPLETED
  - CANCELLED
  transitions:
  - from: ACTIVE
    to: COMPLETED
    trigger: system side effect of POST /tax/claims/{id}/resolve
    actor: system
    preconditions:
    - Assignment.claim_id == resolved claim
    side_effects:
    - Assignment.status := COMPLETED; increments version by 1
  - from: ACTIVE
    to: CANCELLED
    trigger: POST /tax/assignments/{id}/cancel
    actor: CaseManager
    preconditions:
    - Assignment.status == ACTIVE
    - Assignment.claim_id resolves to a Claim in status ASSIGNED (cannot cancel once REPRESENTING)
    side_effects:
    - 'CASCADE: Claim.status := ASSIGNED remains; claim may be re-assigned to another agent'
    - Assignment.status := CANCELLED; increments version by 1
- entity: PowerOfAttorney
  initial_state: DRAFT
  terminal_states:
  - EXECUTED
  - REVOKED
  - EXPIRED
  transitions:
  - from: DRAFT
    to: EXECUTED
    trigger: POST /tax/claims/{id}/poa/execute
    actor: CaseManager
    preconditions:
    - See Claim ASSIGNED -> REPRESENTING
    side_effects:
    - executed_at := logical clock
  - from: DRAFT
    to: REVOKED
    trigger: POST /tax/poas/{id}/revoke
    actor: CaseManager
    preconditions:
    - POA.status == DRAFT
    side_effects:
    - POA.status := REVOKED; increments version by 1
  - from: EXECUTED
    to: EXPIRED
    trigger: system lazy expiry on read or on claim transition attempts when logical clock > POA.expires_at
    actor: system
    preconditions:
    - logical clock > expires_at
    side_effects:
    - POA.status := EXPIRED; the claim remains REPRESENTING but a new POA may be drafted
- entity: RemediationAction
  initial_state: OPEN
  terminal_states:
  - COMPLETED
  transitions:
  - from: OPEN
    to: COMPLETED
    trigger: POST /tax/remediations/{id}/complete
    actor: Preparer
    preconditions:
    - Remediation.status == OPEN
    - logical clock <= due_at (overdue remediation cannot be completed; quality close with overdue remediation suspends instead)
    - Acting X-User-ID equals Remediation.preparer_id (Preparer is entity_backed)
    side_effects:
    - completed_at := logical clock; status := COMPLETED
    - 'CASCADE hop 2: Preparer.remediation_status := COMPLETED (from ACTIVE); preparer version += 1'
  - from: OPEN
    to: OPEN
    trigger: system side effect of POST /tax/remediations (auto-close rule)
    actor: system
    preconditions:
    - Existing OPEN remediation on the same preparer
    side_effects:
    - Existing remediation auto-closes to COMPLETED with completed_at := logical clock; the new remediation starts OPEN
    note: 'Self-overwrite chain: creating a remediation while one is OPEN completes the old one, which cascades to Preparer.remediation_status, which is then set ACTIVE again by the new OPEN remediation
      (preparer ends remediation_status == ACTIVE).'
- entity: Office
  initial_state: OK
  terminal_states: []
  transitions:
  - from: OK
    to: WATCH
    trigger: POST /tax/offices/{id}/quality-close recomputes posture (see office_quality_score)
    actor: OfficeManager
    preconditions: []
    side_effects:
    - Office.posture := WATCH; version += 1
  - from: OK
    to: PROBATION
    trigger: POST /tax/offices/{id}/quality-close
    actor: OfficeManager
    preconditions: []
    side_effects:
    - Office.posture := PROBATION; version += 1
  - from: WATCH
    to: OK
    trigger: POST /tax/offices/{id}/quality-close
    actor: OfficeManager
    preconditions: []
    side_effects:
    - Office.posture := OK; version += 1
  - from: WATCH
    to: PROBATION
    trigger: POST /tax/offices/{id}/quality-close
    actor: OfficeManager
    preconditions: []
    side_effects:
    - Office.posture := PROBATION; version += 1
  - from: PROBATION
    to: OK
    trigger: POST /tax/offices/{id}/quality-close
    actor: OfficeManager
    preconditions: []
    side_effects:
    - Office.posture := OK; version += 1
  - from: PROBATION
    to: WATCH
    trigger: POST /tax/offices/{id}/quality-close
    actor: OfficeManager
    preconditions: []
    side_effects:
    - Office.posture := WATCH; version += 1
    note: Office posture is a fully-connected recomputation machine driven solely by quality-close; no direct set endpoint exists.
- entity: Preparer
  initial_state: NONE
  terminal_states: []
  transitions:
  - from: NONE
    to: ACTIVE
    trigger: POST /tax/remediations creates an OPEN remediation for this preparer (remediation_status dimension)
    actor: OfficeManager
    preconditions:
    - remediation_status in {NONE, COMPLETED}
    side_effects:
    - Preparer.remediation_status := ACTIVE; version += 1
  - from: ACTIVE
    to: COMPLETED
    trigger: POST /tax/remediations/{id}/complete or auto-close side effect (remediation_status dimension)
    actor: Preparer
    preconditions:
    - remediation_status == ACTIVE
    side_effects:
    - Preparer.remediation_status := COMPLETED; version += 1
  - from: COMPLETED
    to: ACTIVE
    trigger: POST /tax/remediations creates another remediation (remediation_status dimension cycle)
    actor: OfficeManager
    preconditions:
    - remediation_status in {NONE, COMPLETED}
    side_effects:
    - Preparer.remediation_status := ACTIVE; version += 1
    note: 'credential_status (ACTIVE/SUSPENDED) evolves independently: quality-close may flip it to SUSPENDED on overdue remediation while remediation_status stays ACTIVE; the two dimensions never block
      each other''s transitions.'
concurrency_rules:
- rule_id: claim-intake-stale-return
  parent_entity: TaxReturn
  write_endpoint: POST /tax/claims
  occ_field: expected_return_version
  description: 'Creating a Claim against a TaxReturn whose version has advanced since the

    client last observed it is rejected: another claim intake may have just

    superseded the client''s view of the return (e.g. the return was re-quoted

    by PATCH /tax/returns/{id}), so the request is refused as stale rather

    than attaching a claim to a return the client no longer recognizes.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
- rule_id: poa-execute-stale-poa
  parent_entity: PowerOfAttorney
  write_endpoint: POST /tax/claims/{id}/poa/execute
  occ_field: expected_poa_version
  description: 'Executing a PowerOfAttorney whose version has advanced since the client

    last observed it is rejected: a newer DRAFT POA created for the same

    claim supersedes the prior draft, so execution of the stale draft view

    is refused.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
calculations:
- name: prep_fee_quote
  trigger: On POST /tax/returns and on every PATCH /tax/returns/{id} (components or preparer change)
  algorithm: tiered_pricing
  formula: 'credits = sum(COMPONENT_CREDITS[c] for c in components)            # integer cents

    raw = credits * TIER_MULTIPLIER[preparer.tier]                     # may be fractional cents

    quoted_fee_cents = round_half_up_to_100(raw)                       # nearest whole dollar (100 cents)

    # rounding order is pinned: multiply the TOTAL credits by the multiplier, THEN round once.

    # Do NOT round per component and sum — that yields different cents (see variants).

    '
  input_set: Return.components (non-empty) and the tier of Preparer referenced by preparer_id at the moment of the call
  constants:
    COMPONENT_CREDITS:
      1040_SIMPLE: 7500
      1040_ITEMIZED: 15000
      1040_BUSINESS: 30000
      1040_MULTI_STATE: 20000
      AMENDED_RETURN: 12000
      PRIOR_YEAR_REVIEW: 8000
    TIER_MULTIPLIER:
      ASSOCIATE: 1.0
      SENIOR: 1.25
      MASTER: 1.5
      ENROLLED_AGENT: 1.75
  precision: integer cents; single round_half_up to nearest 100 cents at the end
  variants:
  - name: quote
    when: Return.status == PREPARING (creation and PATCH re-quote)
    difference: Uses the preparer's CURRENT tier; overwritten on every PATCH
  - name: final
    when: POST /tax/returns/{id}/file
    difference: Recomputes with the preparer's tier AT FILING TIME and locks the value into final_fee_cents; identical inputs with an intervening preparer PATCH produce quoted != final
- name: prep_fee_final
  trigger: POST /tax/returns/{id}/file
  algorithm: tiered_pricing
  formula: 'final_fee_cents = prep_fee_quote evaluated with tier(preparer at filing time)

    '
  input_set: Same as prep_fee_quote, evaluated at filing time
  constants:
    COMPONENT_CREDITS: {1040_SIMPLE: 7500, 1040_ITEMIZED: 15000, 1040_BUSINESS: 30000, 1040_MULTI_STATE: 20000, AMENDED_RETURN: 12000, PRIOR_YEAR_REVIEW: 8000}
  precision: integer cents; round_half_up to nearest 100
  variants:
  - name: final
    when: always at filing
    difference: Locks value; never recomputed afterwards
- name: protection_premium
  trigger: POST /tax/products
  algorithm: threshold
  formula: 'credits = sum(COMPONENT_CREDITS[c] for c in return.components)

    if credits <= SIMPLE_CAP: premium = BASE_PREMIUM[tier]

    elif credits <= STANDARD_CAP: premium = BASE_PREMIUM[tier] * 1.5   # round_half_up to cents

    else: premium = BASE_PREMIUM[tier] * 2.0

    # tier boundary rule: credits exactly equal to a cap fall into the LOWER band (<=).

    '
  input_set: The target return's components at purchase time (must be FILED, no AMENDED_RETURN component)
  constants:
    BASE_PREMIUM:
      STANDARD: 4900
      PLUS: 9900
    SIMPLE_CAP: 15000
    STANDARD_CAP: 30000
  precision: integer cents; round_half_up where fractional
- name: interest_accrual
  trigger: POST /tax/notices/{id}/pay
  algorithm: chronological
  formula: 'days = calendar_days_between(notice.due_at, paid_at)   # due_at exclusive, paid_at inclusive; days == 0 when paid_at <= due_at

    if days <= 0: interest_cents = 0

    else: interest_cents = round_half_up(tax_delta_cents * DAILY_RATE * days)

    # pinned rounding: compute the full float product and round ONCE to cents (round_half_up).

    # Do NOT round a per-day amount and multiply — that diverges (see §1.8 interest_boundary).

    '
  input_set: The notice's tax_delta_cents, due_at, and the logical clock at payment (paid_at)
  constants:
    DAILY_RATE: 0.000273972602739726
  precision: integer cents; round_half_up applied once to the full product
- name: reimbursement_payout
  trigger: On POST /tax/claims/{id}/resolve; recomputed on every linked-notice status change (pay/abate)
  algorithm: waterfall_allocation
  formula: "n = claim's linked AuthorityNotice (1:1)\nif claim.error_attribution == PREPARER_ERROR:\n    payout_base_cents     = n.tax_delta_cents\n    payout_interest_cents = n.interest_cents (0 while\
    \ n.status == OPEN)\n    payout_penalty_cents  = n.penalty_cents if product.tier == PLUS else 0\nelse (CLIENT_DATA_ERROR):\n    payout_base_cents     = 0\n    payout_interest_cents = n.interest_cents\
    \ (0 while n.status == OPEN)\n    payout_penalty_cents  = 0\npayout_total_cents = payout_base_cents + payout_interest_cents + payout_penalty_cents\n# liability fold (pinned evaluation order — see §1.8\
    \ accrual_vs_payout):\n#   final_liability_cents = payout_total_cents + payout_base_cents\n# i.e. the additional-tax component is counted TWICE in the escrow debit (reimbursement\n# to taxpayer + make-whole\
    \ cost), while interest and penalty count once.\nfinal_liability_cents = payout_total_cents + payout_base_cents\n"
  input_set: Claim (scope == IN_SCOPE), its product tier, its error_attribution, and the linked notice's terminal fields
  constants: {}
  precision: integer cents; no rounding (all inputs already integer cents)
  variants:
  - name: preparer_error
    when: error_attribution == PREPARER_ERROR
    difference: Base tax + interest + (penalty if PLUS) are covered
  - name: client_data_error
    when: error_attribution == CLIENT_DATA_ERROR
    difference: Interest only; base tax and penalty remain the taxpayer's own liability
- name: escrow_accrual_expected
  trigger: On every claim resolution and reopen (cascade) for the claim's office
  algorithm: aggregation
  formula: "expected_accrual_cents = sum over all RESOLVED claims c of office O:\n    round_half_up(c.payout_total_cents * ACCRUAL_MARKUP)\n# pinned: round PER CLAIM, then sum (sum-then-round is forbidden\
    \ — different cents).\n# Reopen credits paid_out_cents but does NOT decrement expected_accrual_cents (historical).\n"
  input_set: Claims of office O whose current status == RESOLVED, plus claims RESOLVED-then-REOPENED (their accrual contribution persists)
  constants:
    ACCRUAL_MARKUP: 1.1
  precision: integer cents; per-claim round_half_up
- name: office_quality_score
  trigger: POST /tax/offices/{id}/quality-close
  algorithm: weighted_scoring
  formula: 'claims   = count of office claims with status RESOLVED whose resolution falls inside the closed period

    examined = snapshot.returns_examined

    defects  = snapshot.returns_with_defects

    defect_rate = defects / examined                      # exact decimal, no intermediate rounding

    claim_rate  = claims / examined                       # exact decimal

    quality_score = round_half_up(100 - 400 * defect_rate - 300 * claim_rate)   # clamp to [0, 100]

    # posture thresholds (pinned, >= semantics):

    #   quality_score >= 80 -> OK

    #   60 <= quality_score < 80 -> WATCH

    #   quality_score < 60 -> PROBATION

    # probation cascade: for each preparer of the office with an OPEN remediation whose

    # due_at < logical clock, set credential_status := SUSPENDED (preparer version += 1).

    # POSTURE_GATING: when resulting posture == PROBATION, new POST /tax/products sales

    # for returns of this office are rejected with ERR_OFFICE_POSTURE_BLOCKED and preparer

    # upgrades (POST /tax/preparers/{id}/upgrade) are rejected with ERR_OFFICE_POSTURE_BLOCKED.

    '
  input_set: Office's claims resolved within the closed period; snapshot defect counts; office preparers' open remediations
  constants:
    DEFECT_WEIGHT: 400
    CLAIM_WEIGHT: 300
    OK_THRESHOLD: 80
    WATCH_THRESHOLD: 60
  precision: 'score: integer, round_half_up; rates: exact decimals, no intermediate rounding'
validations:
- priority: 1
  category: auth
  check: X-User-Role and X-User-ID headers present; X-User-Role is a declared role
  error_id: ERR_UNAUTHENTICATED
  http_status: 401
  applies_to: all
- priority: 2
  category: auth
  check: Role is permitted for the endpoint per §1.5 roles list; for entity_backed roles, ownership rules (Client acts on own claim info, Preparer completes own remediation, EnrolledAgent abates only own
    assignment's notice)
  error_id: ERR_FORBIDDEN
  http_status: 403
  applies_to: all
- priority: 3
  category: existence
  check: 'All path and body ids resolve to existing resources, validated left-to-right: return_id, preparer_id, office_id, client_id, agent_id, notice_id, claim_id, poa_id, original_return_id'
  error_id: ERR_NOT_FOUND
  http_status: 404
  applies_to: all
- priority: 4
  category: state
  check: Target resource state precondition for the endpoint (return PREPARING for PATCH/file; claim in the transition's from-state; notice OPEN for pay/abate/withdraw; POA DRAFT for execute; product ACTIVE
    for void; etc.)
  error_id: ERR_INVALID_STATE
  http_status: 409
  applies_to: all action endpoints
- priority: 5
  category: state
  check: 'Terminal-state lockdown: FILED return cannot be PATCHed or re-filed; DENIED/RESOLVED (except reopen) claim immutable; terminal notice/POA/assignment/product immutable'
  error_id: ERR_ALREADY_TERMINAL
  http_status: 409
  applies_to: all action endpoints
- priority: 6
  category: state
  check: 'OCC: expected_return_version / expected_poa_version equals the parent entity''s current version'
  error_id: ERR_STALE_VERSION
  http_status: 412
  applies_to: POST /tax/claims, POST /tax/claims/{id}/poa/execute
- priority: 7
  category: business_safety
  check: 'Segregation of duties: POST /tax/claims/{id}/resolve requires acting X-User-ID != claim.scoped_by_user_id'
  error_id: ERR_SEGREGATION_OF_DUTIES
  http_status: 403
  applies_to: POST /tax/claims/{id}/resolve
- priority: 8
  category: business_safety
  check: 'Office posture gating: POST /tax/products and POST /tax/preparers/{id}/upgrade rejected while the office posture == PROBATION'
  error_id: ERR_OFFICE_POSTURE_BLOCKED
  http_status: 409
  applies_to: POST /tax/products, POST /tax/preparers/{id}/upgrade
- priority: 9
  category: business_safety
  check: 'POA temporal validity at execution: POA.expires_at must be strictly > logical clock'
  error_id: ERR_POA_EXPIRED
  http_status: 422
  applies_to: POST /tax/claims/{id}/poa/execute
- priority: 10
  category: business_referential
  check: Claim resolution requires every linked AuthorityNotice in a terminal state {PAID, ABATED, WITHDRAWN}
  error_id: ERR_NOTICE_NOT_TERMINAL
  http_status: 409
  applies_to: POST /tax/claims/{id}/resolve
- priority: 11
  category: business_referential
  check: Pay/abate on a notice whose linked claim is RESOLVED is rejected (reopen the claim first)
  error_id: ERR_CLAIM_ALREADY_RESOLVED
  http_status: 409
  applies_to: POST /tax/notices/{id}/pay, POST /tax/notices/{id}/abate
- priority: 12
  category: business_referential
  check: 'Claim intake: return must be FILED; notice must be OPEN and not already linked; return must have an ACTIVE ProtectionProduct'
  error_id: ERR_PROTECTION_REQUIRED
  http_status: 422
  applies_to: POST /tax/claims
- priority: 13
  category: business_constraint
  check: 'Product purchase: exactly one ACTIVE product per return (non-terminal claims block void, duplicates blocked at purchase)'
  error_id: ERR_DUPLICATE_PRODUCT
  http_status: 409
  applies_to: POST /tax/products
- priority: 14
  category: business_constraint
  check: 'Product eligibility: return must be FILED and must NOT contain the AMENDED_RETURN component'
  error_id: ERR_PRODUCT_INELIGIBLE
  http_status: 422
  applies_to: POST /tax/products
- priority: 15
  category: business_constraint
  check: 'Enrolled agent parallel capacity: count of claims in REPRESENTING assigned to agent must be < agent.max_parallel at assignment'
  error_id: ERR_AGENT_CAPACITY
  http_status: 409
  applies_to: POST /tax/claims/{id}/assign
- priority: 16
  category: business_temporal
  check: Assignment window half-open [window_start, window_end) must not overlap another ACTIVE assignment window for the same agent; touching endpoints (a.end == b.start) do NOT overlap
  error_id: ERR_WINDOW_OVERLAP
  http_status: 409
  applies_to: POST /tax/claims/{id}/assign
- priority: 17
  category: business_temporal
  check: window_end must be strictly > window_start
  error_id: ERR_INVALID_WINDOW
  http_status: 422
  applies_to: POST /tax/claims/{id}/assign
- priority: 18
  category: business_temporal
  check: 'Quality close: period_month strictly greater than office.last_close_period (null means any); periods are YYYY-MM strings compared lexicographically'
  error_id: ERR_CLOSE_PERIOD_REGRESSION
  http_status: 422
  applies_to: POST /tax/offices/{id}/quality-close
- priority: 19
  category: business_fiscal
  check: 'Return create/PATCH: components non-empty, values from the declared enum, no duplicates; filing_kind == AMENDED requires original_return_id referencing a FILED return (checked here after state
    of the original is confirmed FILED at existence/state steps)'
  error_id: ERR_INVALID_COMPONENTS
  http_status: 422
  applies_to: POST /tax/returns, PATCH /tax/returns/{id}
- priority: 20
  category: business_fiscal
  check: 'Generic malformed input: missing required fields, wrong types, negative amounts where >= 0 required, bad enum'
  error_id: ERR_VALIDATION
  http_status: 400
  applies_to: all
endpoints:
- method: POST
  path: /tax/offices
  description: Create an office
  roles:
  - ProgramAdmin
  code: 201
  input:
  - name
  - region_code
  output: Office
  side_effects:
  - posture starts OK; version 1
- method: GET
  path: /tax/offices
  description: List offices
  roles:
  - ProgramAdmin
  - OfficeManager
  - CaseManager
  code: 200
  input:
  - limit?
  - offset?
  - region_code?
  output: Office[]
  side_effects: []
- method: GET
  path: /tax/offices/{id}
  description: Get one office
  roles:
  - ProgramAdmin
  - OfficeManager
  - CaseManager
  - Preparer
  - EnrolledAgent
  code: 200
  input: []
  output: Office
  side_effects: []
- method: POST
  path: /tax/offices/{id}/quality-close
  description: 'Close a quality period: creates OfficeQualitySnapshot, recomputes posture via office_quality_score, suspends preparers with overdue open remediations when posture becomes PROBATION'
  roles:
  - OfficeManager
  code: 201
  input:
  - period_month
  - returns_examined
  - returns_with_defects
  output: OfficeQualitySnapshot
  side_effects:
  - office_quality_score; Office.posture recomputed; overdue-remediation preparers suspended (credential_status := SUSPENDED) when posture becomes PROBATION
- method: GET
  path: /tax/offices/{id}/snapshots
  description: List quality snapshots for an office
  roles:
  - ProgramAdmin
  - OfficeManager
  - CaseManager
  code: 200
  input:
  - limit?
  - offset?
  output: OfficeQualitySnapshot[]
  side_effects: []
- method: POST
  path: /tax/preparers
  description: Create a preparer
  roles:
  - OfficeManager
  code: 201
  input:
  - office_id
  - full_name
  - tier
  output: Preparer
  side_effects:
  - credential_status ACTIVE, remediation_status NONE
- method: GET
  path: /tax/preparers
  description: List preparers (filterable by office)
  roles:
  - ProgramAdmin
  - OfficeManager
  - CaseManager
  code: 200
  input:
  - office_id?
  - limit?
  - offset?
  output: Preparer[]
  side_effects: []
- method: GET
  path: /tax/preparers/{id}
  description: Get one preparer
  roles:
  - ProgramAdmin
  - OfficeManager
  - CaseManager
  - Preparer
  code: 200
  input: []
  output: Preparer
  side_effects: []
- method: POST
  path: /tax/preparers/{id}/upgrade
  description: 'Upgrade preparer credential tier (one-way: to a strictly higher multiplier tier); blocked while office posture == PROBATION'
  roles:
  - OfficeManager
  code: 200
  input:
  - tier
  output: Preparer
  side_effects:
  - tier updated; affects future quotes and filings only; version += 1
- method: POST
  path: /tax/clients
  description: Register a client
  roles:
  - OfficeManager
  - CaseManager
  code: 201
  input:
  - full_name
  - email
  output: Client
  side_effects: []
- method: GET
  path: /tax/clients/{id}
  description: Get one client
  roles:
  - OfficeManager
  - CaseManager
  - Client
  code: 200
  input: []
  output: Client
  side_effects: []
- method: GET
  path: /tax/clients/{id}/returns
  description: List a client's returns
  roles:
  - OfficeManager
  - CaseManager
  - Client
  code: 200
  input:
  - limit?
  - offset?
  output: TaxReturn[]
  side_effects: []
- method: POST
  path: /tax/returns
  description: Create a return; computes quoted_fee_cents via prep_fee_quote
  roles:
  - OfficeManager
  code: 201
  input:
  - client_id
  - office_id
  - preparer_id
  - tax_year
  - components
  - filing_kind?
  - original_return_id?
  output: TaxReturn
  side_effects:
  - prep_fee_quote
- method: GET
  path: /tax/returns/{id}
  description: Get one return
  roles:
  - ProgramAdmin
  - OfficeManager
  - CaseManager
  - Client
  - Preparer
  - EnrolledAgent
  code: 200
  input: []
  output: TaxReturn
  side_effects: []
- method: GET
  path: /tax/returns/{id}/products
  description: List protection products for a return (0 or 1 active)
  roles:
  - ProgramAdmin
  - OfficeManager
  - CaseManager
  code: 200
  input:
  - limit?
  - offset?
  output: ProtectionProduct[]
  side_effects: []
- method: GET
  path: /tax/returns/{id}/notices
  description: List authority notices for a return
  roles:
  - OfficeManager
  - CaseManager
  - EnrolledAgent
  code: 200
  input:
  - limit?
  - offset?
  output: AuthorityNotice[]
  side_effects: []
- method: PATCH
  path: /tax/returns/{id}
  description: Update components or preparer while PREPARING; re-quotes
  roles:
  - OfficeManager
  code: 200
  input:
  - components?
  - preparer_id?
  output: TaxReturn
  side_effects:
  - prep_fee_quote recomputed; version += 1
- method: POST
  path: /tax/returns/{id}/file
  description: File the return; locks final_fee_cents via prep_fee_final
  roles:
  - OfficeManager
  code: 200
  input: []
  output: TaxReturn
  side_effects:
  - prep_fee_final; status := FILED
- method: POST
  path: /tax/products
  description: Sell a protection product for a FILED return; premium via protection_premium
  roles:
  - OfficeManager
  code: 201
  input:
  - return_id
  - tier
  output: ProtectionProduct
  side_effects:
  - protection_premium; posture gate (PROBATION blocks)
- method: POST
  path: /tax/products/{id}/void
  description: Void an ACTIVE product with no non-terminal claims
  roles:
  - ProgramAdmin
  code: 200
  input: []
  output: ProtectionProduct
  side_effects:
  - status := VOID
- method: POST
  path: /tax/notices
  description: Register an authority notice against a FILED return
  roles:
  - CaseManager
  code: 201
  input:
  - return_id
  - authority_type
  - notice_reference
  - tax_delta_cents
  - penalty_cents
  - issued_at
  - due_at
  output: AuthorityNotice
  side_effects:
  - status := OPEN
- method: GET
  path: /tax/notices/{id}
  description: Get one notice
  roles:
  - OfficeManager
  - CaseManager
  - EnrolledAgent
  code: 200
  input: []
  output: AuthorityNotice
  side_effects: []
- method: POST
  path: /tax/notices/{id}/pay
  description: Record payment at logical clock; computes interest_cents via interest_accrual
  roles:
  - OfficeManager
  code: 200
  input: []
  output: AuthorityNotice
  side_effects:
  - interest_accrual; reimbursement_payout recompute on linked claim; status := PAID
- method: POST
  path: /tax/notices/{id}/abate
  description: 'Enrolled agent (holding the ACTIVE assignment on the linked claim in REPRESENTING) wins abatement: interest and penalty zeroed'
  roles:
  - EnrolledAgent
  code: 200
  input: []
  output: AuthorityNotice
  side_effects:
  - interest_cents := 0, penalty_cents := 0; reimbursement_payout recompute; status := ABATED
- method: POST
  path: /tax/notices/{id}/withdraw
  description: Withdraw an unlinked OPEN notice
  roles:
  - OfficeManager
  code: 200
  input: []
  output: AuthorityNotice
  side_effects:
  - status := WITHDRAWN
- method: POST
  path: /tax/claims
  description: Open a claim for a noticed, protected return; OCC on expected_return_version; links the notice (notice.claim_id set)
  roles:
  - CaseManager
  code: 201
  input:
  - return_id
  - notice_id
  - expected_return_version
  output: Claim
  side_effects:
  - notice.claim_id := claim id; notice version += 1; return version += 1
- method: GET
  path: /tax/claims/{id}
  description: Get one claim
  roles:
  - ProgramAdmin
  - OfficeManager
  - CaseManager
  - Client
  - EnrolledAgent
  code: 200
  input: []
  output: Claim
  side_effects: []
- method: GET
  path: /tax/claims
  description: List claims (filterable by return, office)
  roles:
  - ProgramAdmin
  - OfficeManager
  - CaseManager
  code: 200
  input:
  - return_id?
  - office_id?
  - notice_id?
  - protection_product_id?
  - limit?
  - offset?
  output: Claim[]
  side_effects: []
- method: GET
  path: /tax/claims/{id}/poas
  description: List POAs for a claim
  roles:
  - OfficeManager
  - CaseManager
  - EnrolledAgent
  code: 200
  input:
  - limit?
  - offset?
  output: PowerOfAttorney[]
  side_effects: []
- method: GET
  path: /tax/claims/{id}/assignments
  description: List assignments for a claim
  roles:
  - OfficeManager
  - CaseManager
  - EnrolledAgent
  code: 200
  input:
  - limit?
  - offset?
  output: RepresentationAssignment[]
  side_effects: []
- method: POST
  path: /tax/claims/{id}/scope
  description: 'Scope determination: IN_SCOPE (requires error_attribution) -> SCOPE_CONFIRMED; OUT_OF_SCOPE -> DENIED'
  roles:
  - CaseManager
  code: 200
  input:
  - scope
  - error_attribution?
  output: Claim
  side_effects:
  - records scoped_by_user_id := acting X-User-ID
- method: POST
  path: /tax/claims/{id}/request-info
  description: Move claim to INFO_NEEDED
  roles:
  - CaseManager
  code: 200
  input: []
  output: Claim
  side_effects: []
- method: POST
  path: /tax/claims/{id}/provide-info
  description: Client returns claim to TRIAGE
  roles:
  - Client
  code: 200
  input: []
  output: Claim
  side_effects: []
- method: POST
  path: /tax/claims/{id}/assign
  description: Assign an enrolled agent with a half-open representation window; capacity and overlap enforced
  roles:
  - CaseManager
  code: 201
  input:
  - agent_id
  - window_start
  - window_end
  output: RepresentationAssignment
  side_effects:
  - claim -> ASSIGNED
- method: POST
  path: /tax/claims/{id}/poa
  description: Draft a POA for the claim; supersedes any existing DRAFT POA (old draft auto-REVOKED)
  roles:
  - CaseManager
  code: 201
  input:
  - agent_id
  - expires_at
  output: PowerOfAttorney
  side_effects:
  - existing DRAFT POA on the claim -> REVOKED
- method: POST
  path: /tax/claims/{id}/poa/execute
  description: Execute the claim's DRAFT POA (OCC on expected_poa_version); moves claim ASSIGNED -> REPRESENTING
  roles:
  - CaseManager
  code: 200
  input:
  - expected_poa_version
  output: Claim
  side_effects:
  - POA := EXECUTED with executed_at; claim := REPRESENTING
- method: POST
  path: /tax/poas/{id}/revoke
  description: Revoke a DRAFT POA
  roles:
  - CaseManager
  code: 200
  input: []
  output: PowerOfAttorney
  side_effects: []
- method: POST
  path: /tax/claims/{id}/resolve
  description: 'Resolve claim: computes payouts and final_liability, completes assignment, debits escrow; requires all linked notices terminal and SoD'
  roles:
  - CaseManager
  code: 200
  input: []
  output: Claim
  side_effects:
  - reimbursement_payout; assignment -> COMPLETED; escrow paid_out += final_liability; escrow expected_accrual += round_half_up(payout_total * 1.10)
- method: POST
  path: /tax/claims/{id}/reopen
  description: Reopen a RESOLVED claim; credits escrow paid_out (accrual unchanged)
  roles:
  - CaseManager
  code: 200
  input: []
  output: Claim
  side_effects:
  - escrow paid_out -= final_liability_cents
- method: POST
  path: /tax/assignments/{id}/cancel
  description: Cancel an ACTIVE assignment while claim still ASSIGNED
  roles:
  - CaseManager
  code: 200
  input: []
  output: RepresentationAssignment
  side_effects:
  - status := CANCELLED
- method: POST
  path: /tax/agents
  description: Create an enrolled agent
  roles:
  - ProgramAdmin
  code: 201
  input:
  - full_name
  - license_number
  - max_parallel?
  output: EnrolledAgent
  side_effects: []
- method: GET
  path: /tax/agents/{id}
  description: Get one enrolled agent
  roles:
  - ProgramAdmin
  - OfficeManager
  - CaseManager
  - EnrolledAgent
  code: 200
  input: []
  output: EnrolledAgent
  side_effects: []
- method: GET
  path: /tax/agents/{id}/assignments
  description: List assignments for an enrolled agent
  roles:
  - ProgramAdmin
  - OfficeManager
  - CaseManager
  - EnrolledAgent
  code: 200
  input:
  - limit?
  - offset?
  output: RepresentationAssignment[]
  side_effects: []
- method: POST
  path: /tax/remediations
  description: Open a remediation for a preparer; auto-completes any existing OPEN remediation on that preparer
  roles:
  - OfficeManager
  code: 201
  input:
  - preparer_id
  - due_at
  output: RemediationAction
  side_effects:
  - 'existing OPEN remediation auto-COMPLETED (cascade: preparer remediation_status toggles COMPLETED then ACTIVE); preparer remediation_status := ACTIVE'
- method: GET
  path: /tax/remediations
  description: List remediations (filterable by preparer)
  roles:
  - OfficeManager
  - CaseManager
  - Preparer
  code: 200
  input:
  - preparer_id?
  - limit?
  - offset?
  output: RemediationAction[]
  side_effects: []
- method: POST
  path: /tax/remediations/{id}/complete
  description: Preparer completes own remediation before due_at
  roles:
  - Preparer
  code: 200
  input: []
  output: RemediationAction
  side_effects:
  - completed_at := clock; preparer remediation_status := COMPLETED
- method: POST
  path: /tax/escrows
  description: Fund an office escrow (one per office)
  roles:
  - ProgramAdmin
  code: 201
  input:
  - office_id
  - funded_cents
  output: OfficeEscrow
  side_effects:
  - paid_out 0; expected_accrual 0
- method: GET
  path: /tax/escrows/{id}
  description: Get one escrow
  roles:
  - ProgramAdmin
  - OfficeManager
  - CaseManager
  code: 200
  input: []
  output: OfficeEscrow
  side_effects: []
- method: GET
  path: /tax/escrows
  description: List escrows (filterable by office)
  roles:
  - ProgramAdmin
  - OfficeManager
  - CaseManager
  code: 200
  input:
  - office_id?
  - limit?
  - offset?
  output: OfficeEscrow[]
  side_effects: []
- method: POST
  path: /tax/_clock/set_current_utc
  description: 'Test-driving endpoint: set the logical clock. Before any call, the logical clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time.'
  roles:
  - ProgramAdmin
  code: 200
  input:
  - to_iso8601
  output:
    current_utc: datetime
  side_effects:
  - logical clock advanced; lazy POA expiry evaluated on subsequent reads
- method: GET
  path: /tax/returns
  description: List returns (filterable by office, preparer, client, original return)
  roles:
  - ProgramAdmin
  - OfficeManager
  - CaseManager
  code: 200
  input:
  - office_id?
  - preparer_id?
  - client_id?
  - original_return_id?
  - limit?
  - offset?
  output: TaxReturn[]
  side_effects: []
- method: GET
  path: /tax/notices
  description: List notices (filterable by return, claim)
  roles:
  - OfficeManager
  - CaseManager
  - EnrolledAgent
  code: 200
  input:
  - return_id?
  - claim_id?
  - limit?
  - offset?
  output: AuthorityNotice[]
  side_effects: []
- method: GET
  path: /tax/poas/{id}
  description: Get one POA
  roles:
  - OfficeManager
  - CaseManager
  - EnrolledAgent
  code: 200
  input: []
  output: PowerOfAttorney
  side_effects: []
- method: GET
  path: /tax/poas
  description: List POAs (filterable by agent, claim)
  roles:
  - OfficeManager
  - CaseManager
  - EnrolledAgent
  code: 200
  input:
  - agent_id?
  - claim_id?
  - limit?
  - offset?
  output: PowerOfAttorney[]
  side_effects: []
- method: GET
  path: /tax/remediations/{id}
  description: Get one remediation action
  roles:
  - OfficeManager
  - CaseManager
  - Preparer
  code: 200
  input: []
  output: RemediationAction
  side_effects: []
errors:
- id: ERR_UNAUTHENTICATED
  http: 401
  condition: Missing/invalid X-User-Role or X-User-ID headers
- id: ERR_FORBIDDEN
  http: 403
  condition: Role not permitted for endpoint, or entity_backed ownership check failed
- id: ERR_NOT_FOUND
  http: 404
  condition: Referenced resource id does not exist
- id: ERR_VALIDATION
  http: 400
  condition: Missing required field, wrong type, negative amount, bad enum, empty components array
- id: ERR_INVALID_STATE
  http: 409
  condition: Target resource not in a state from which the requested transition is defined
- id: ERR_ALREADY_TERMINAL
  http: 409
  condition: Target resource in a terminal state; no further transitions
- id: ERR_STALE_VERSION
  http: 412
  condition: OCC expected_*_version does not match the parent's current version
- id: ERR_SEGREGATION_OF_DUTIES
  http: 403
  condition: Resolver's X-User-ID equals claim.scoped_by_user_id
- id: ERR_OFFICE_POSTURE_BLOCKED
  http: 409
  condition: Office posture == PROBATION blocks product sales and preparer upgrades
- id: ERR_POA_EXPIRED
  http: 422
  condition: POA expires_at <= logical clock at execution
- id: ERR_POA_NOT_DRAFT
  http: 409
  condition: No DRAFT POA exists on the claim at execution
- id: ERR_NOTICE_NOT_TERMINAL
  http: 409
  condition: Claim resolution attempted with a linked notice still OPEN
- id: ERR_CLAIM_ALREADY_RESOLVED
  http: 409
  condition: Pay/abate on a notice whose linked claim is RESOLVED
- id: ERR_PROTECTION_REQUIRED
  http: 422
  condition: 'Claim intake: return lacks an ACTIVE ProtectionProduct, return not FILED, or notice already linked/not OPEN'
- id: ERR_DUPLICATE_PRODUCT
  http: 409
  condition: Return already has an ACTIVE ProtectionProduct
- id: ERR_PRODUCT_INELIGIBLE
  http: 422
  condition: Return contains AMENDED_RETURN component or is not FILED at purchase
- id: ERR_AGENT_CAPACITY
  http: 409
  condition: Agent's REPRESENTING claim count >= max_parallel
- id: ERR_WINDOW_OVERLAP
  http: 409
  condition: Half-open window overlaps another ACTIVE assignment window for the same agent
- id: ERR_INVALID_WINDOW
  http: 422
  condition: window_end <= window_start
- id: ERR_CLOSE_PERIOD_REGRESSION
  http: 422
  condition: period_month <= office.last_close_period
- id: ERR_INVALID_COMPONENTS
  http: 422
  condition: 'Components invalid: unknown code, duplicates, or AMENDED filing without a FILED original_return_id'
- id: ERR_AMEND_REQUIRES_ORIGINAL
  http: 422
  condition: filing_kind == AMENDED but original_return_id missing, or original not FILED
- id: ERR_DUPLICATE_ESCROW
  http: 409
  condition: Office already has an escrow
- id: ERR_REMEDIATION_OVERDUE
  http: 422
  condition: Complete attempted when logical clock > due_at
- id: ERR_DUPLICATE_CLIENT_EMAIL
  http: 409
  condition: Client email already registered
- id: ERR_DOWNGRADE_FORBIDDEN
  http: 422
  condition: Upgrade target tier not strictly higher than current tier
- id: ERR_VOID_CLAIMS_OPEN
  http: 409
  condition: Product void attempted while non-terminal claims reference it
roles:
- name: ProgramAdmin
  description: Corporate program administrator; offices, agents, escrows, product voids, clock
  identity: opaque
  exclusive_operations:
  - POST /tax/offices
  - POST /tax/agents
  - POST /tax/escrows
  - POST /tax/products/{id}/void
  - POST /tax/_clock/set_current_utc
  shared_operations:
  - GET reads
- name: OfficeManager
  description: Office operator; preparers, clients, returns, filing, product sales, notices pay/withdraw, quality close, remediations
  identity: opaque
  exclusive_operations:
  - POST /tax/preparers
  - POST /tax/preparers/{id}/upgrade
  - POST /tax/returns
  - PATCH /tax/returns/{id}
  - POST /tax/returns/{id}/file
  - POST /tax/products
  - POST /tax/notices/{id}/pay
  - POST /tax/notices/{id}/withdraw
  - POST /tax/offices/{id}/quality-close
  - POST /tax/remediations
  shared_operations:
  - POST /tax/clients
  - GET reads
- name: CaseManager
  description: Claims case manager; notices intake, claim lifecycle, scoping, assignment, POA, resolution (subject to SoD)
  identity: opaque
  exclusive_operations:
  - POST /tax/notices
  - POST /tax/claims
  - POST /tax/claims/{id}/scope
  - POST /tax/claims/{id}/request-info
  - POST /tax/claims/{id}/assign
  - POST /tax/claims/{id}/poa
  - POST /tax/claims/{id}/poa/execute
  - POST /tax/poas/{id}/revoke
  - POST /tax/claims/{id}/resolve
  - POST /tax/claims/{id}/reopen
  - POST /tax/assignments/{id}/cancel
  shared_operations:
  - POST /tax/clients
  - GET reads
- name: Client
  description: Taxpayer; responds to info requests on own claims
  identity: entity_backed:Client
  exclusive_operations:
  - POST /tax/claims/{id}/provide-info
  shared_operations:
  - GET own records
- name: Preparer
  description: Credential-tiered tax preparer; completes own remediation actions
  identity: entity_backed:Preparer
  exclusive_operations:
  - POST /tax/remediations/{id}/complete
  shared_operations:
  - GET own records
- name: EnrolledAgent
  description: Enrolled agent; abates notices on claims under own ACTIVE assignment
  identity: entity_backed:EnrolledAgent
  exclusive_operations:
  - POST /tax/notices/{id}/abate
  shared_operations:
  - GET own records
