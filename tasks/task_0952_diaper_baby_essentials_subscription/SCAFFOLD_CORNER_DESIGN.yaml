            - "no Sku row exists with code BAD-STAGE"

  # =======================================================================
  # State machines
  # =======================================================================
  - section: state_machines
    instances:
      - name: corner_verify_with_wrong_token_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.Account.PENDING_VERIFICATION_to_ACTIVE", "errors[ERR_INVALID_VERIFICATION_TOKEN]"]
        distinguishing_aspect: "A verification token that does not match Account.verification_token leaves the account in PENDING_VERIFICATION and returns ERR_INVALID_VERIFICATION_TOKEN (422)."
        test_recipe:
          setup: ["One unverified account in PENDING_VERIFICATION."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /accounts"
              payload: { email: "badtok@example.com", full_name: "Bad Token" }
              as: Anonymous
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/verify"
              payload: { verification_token: "not-the-real-token" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_VERIFICATION_TOKEN"
            - "HTTP status is 422"
            - "Account.${acct_id}.status == PENDING_VERIFICATION"

      - name: corner_verify_twice_cannot_replay_consumed_token
        claim_type: idempotency
        grounds: ["state_machines.Account.PENDING_VERIFICATION_to_ACTIVE", "entities.Account.fields.verification_token"]
        distinguishing_aspect: "Verification clears Account.verification_token, so replaying the same token a second time fails with ERR_INVALID_VERIFICATION_TOKEN while the account stays ACTIVE."
        test_recipe:
          setup: ["One account already verified with its minted token."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /accounts"
              payload: { email: "replay@example.com", full_name: "Replay Household" }
              as: Anonymous
              captures: { acct_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /accounts/${acct_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
          trigger:
            - call: "POST /accounts/${acct_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_VERIFICATION_TOKEN"
            - "Account.${acct_id}.status == ACTIVE"
            - "Account.${acct_id}.verification_token == null"

      - name: corner_suspend_unverified_account_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Account.ACTIVE_to_SUSPENDED", "errors[ERR_ACCOUNT_NOT_ACTIVE]"]
        distinguishing_aspect: "Suspend requires from-state ACTIVE; an account still in PENDING_VERIFICATION returns ERR_ACCOUNT_NOT_ACTIVE (409) and keeps suspended_reason null."
        test_recipe:
          setup: ["One unverified account."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /accounts"
              payload: { email: "unver@example.com", full_name: "Unverified Household" }
              as: Anonymous
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/suspend"
              payload: { reason: "Too early" }
              as: SupportAgent
              as_user_id: "cs-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ACCOUNT_NOT_ACTIVE"
            - "Account.${acct_id}.status == PENDING_VERIFICATION"
            - "Account.${acct_id}.suspended_reason == null"

      - name: corner_close_account_holding_active_subscription_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.Account.ACTIVE_to_CLOSED", "errors[ERR_ACCOUNT_HAS_ACTIVE_SUBSCRIPTIONS]"]
        distinguishing_aspect: "Closing an account with a subscription in lifecycle_state ACTIVE returns ERR_ACCOUNT_HAS_ACTIVE_SUBSCRIPTIONS (409) and archives no children."
        test_recipe:
          setup: ["One verified account with one ACTIVE subscription."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Plan", default_pack_count: 2, promo_discount_pct: 0, allows_hypoallergenic: true }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "close1@example.com", full_name: "Close One", payment_method_on_file: true }
              as: Anonymous
              captures: { acct_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /accounts/${acct_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /children"
              payload: { account_id: "${acct_id}", name: "Rin", birth_date: "2025-11-01", weight_grams: 7000 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { child_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acct_id}", plan_id: "${plan_id}", child_id: "${child_id}", consumption_rate_per_day: 6, pack_count: 2 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /accounts/${acct_id}/close"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ACCOUNT_HAS_ACTIVE_SUBSCRIPTIONS"
            - "Account.${acct_id}.status == ACTIVE"
            - "Child.${child_id}.archived == false"

      - name: corner_archived_child_blocks_weight_measurement
        claim_type: precondition_enforcement
        grounds: ["validations[priority=23]", "state_machines.Account.ACTIVE_to_CLOSED", "errors[ERR_CHILD_ARCHIVED]"]
        distinguishing_aspect: "Closing an account sets Child.archived true, after which POST /children/{id}/weight-measurements returns ERR_CHILD_ARCHIVED (409) and the recorded weight is unchanged."
        test_recipe:
          setup: ["One verified account with an S2 child and NO subscriptions, then closed."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
