  - rule_id: non_linear_state_machine
    instances:

      - name: vehicle_fleet_and_condition_dimensions_advance_independently
        grounds:
          - state_machines[Vehicle.fleet_status]
          - state_machines[Vehicle.condition_status]
          - complexity_profile.state_machine_shape
          - endpoints[POST /fleet/redistribution-orders/{order_id}/depart]
          - endpoints[POST /fleet/damage-events/{damage_event_id}/settle-recovery]
        distinguishing_aspect: |
          This instance exercises the PARALLEL shape: one vehicle carries two orthogonal
          status dimensions that advance on unrelated triggers. A damage report moves
          condition SOUND -> DAMAGE_REPORTED with fleet_status pinned at IN_SERVICE; a
          depart then moves fleet_status IN_SERVICE -> IN_TRANSIT with condition pinned at
          DAMAGE_REPORTED; settling the recovery mid-haul moves condition back to SOUND
          while the vehicle is still IN_TRANSIT. An implementation with a single status
          column cannot represent the intermediate combined states at all.
        test_recipe:
          setup:
            - "Vehicle VA is IN_SERVICE at ATL with condition SOUND; DFW is an ACTIVE destination market."
            - "A 200 km redistribution order is drafted, proposed by u-plan-1 and authorized by u-ctl-a so the SoD check passes."
            - "Damage estimate 300000 against a net book value near 2296000 keeps total_loss_required false, so no TOTALED short-circuit interferes."
            - "recovered_cents 200000 is under the recovery cap round_half_up(300000 * 1.25) = 375000."
