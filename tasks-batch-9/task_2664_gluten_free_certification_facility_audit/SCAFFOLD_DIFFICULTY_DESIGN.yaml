      - name: complaint_substantiation_cascades_through_critical_nc_to_probation
        grounds:
          - state_machines.ConsumerComplaint.RECEIVED_to_INVESTIGATING
          - state_machines.ConsumerComplaint.INVESTIGATING_to_SUBSTANTIATED
          - calculations.recall_scope_determination
          - state_machines.Certificate.ISSUED_to_SUSPENDED
          - state_machines.Product.label_dimension.APPROVED_to_FROZEN
          - calculations.open_nc_penalty_points
          - calculations.applicant_compliance_posture
          - entities.ConsumerComplaint.fields.recall_action
        distinguishing_aspect: |
          A single investigation outcome fans out in the opposite direction from the supplier
          cascade: complaint -> newly created CRITICAL nonconformance -> certificate suspension with
          suspension_reason SUBSTANTIATED_COMPLAINT -> label freeze -> three independent posture
          penalties that must all land in the same response (25 nonconformance points, 5 for the
          suspended certificate, 15 for the substantiated complaint, giving 55 and PROBATION).
