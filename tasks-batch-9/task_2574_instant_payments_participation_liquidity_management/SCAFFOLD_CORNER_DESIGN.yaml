              payload: { certification_test_suite_version: "CERT-2026.2" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants/${pa_id}/certification-results"
              payload: { outcome: "PASS" }
              as: NetworkOperator
