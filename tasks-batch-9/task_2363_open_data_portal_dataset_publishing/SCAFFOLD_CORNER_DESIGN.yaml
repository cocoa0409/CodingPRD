      - name: arm_priority_conflict_between_state_and_credit_rules
        claim_type: priority_conflict
        grounds:
          - validations[priority=13]
          - validations[priority=34]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / arm_state_gate_outranks_credit_shortfall
          rationale: "That instance violates the state gate and the credit gate in one call and asserts the lower-priority error wins."

      - name: mark_ready_cross_entity_readiness_gates
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=14]
          - errors.ERR_METADATA_NOT_ACCEPTED
          - errors.ERR_PRIVACY_CLEARANCE_REQUIRED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / mark_ready_requires_accepted_metadata_and_cleared_privacy
          rationale: "That instance walks both missing-prerequisite variants and the success case on the same dataset."

      - name: department_window_capacity_is_an_aggregate_limit
        claim_type: aggregate_validation
        grounds:
          - validations[priority=24]
          - errors.ERR_DEPARTMENT_WINDOW_CAPACITY
        excluded_because:
          difficulty_instance: resource_temporal_overlap / department_window_closed_interval_capacity_cap
          rationale: "Two individually legal windows that jointly cover the same minute are asserted there, including the closed-interval touching-endpoint behaviour."

      - name: clearance_refused_above_risk_ceiling
        claim_type: violation_to_error
        grounds:
          - validations[priority=16]
          - errors.ERR_REIDENTIFICATION_RISK_TOO_HIGH
        excluded_because:
          difficulty_instance: dual_variant_calc / reidentification_screening_vs_clearance_flips_aggregation_requirement
          rationale: "That instance drives clearance_risk_score to 80.00 and asserts the CLEAR decision is refused at the CLEARANCE_RISK_MAX ceiling."

      - name: publish_safety_rule_outranks_temporal_rule
        claim_type: priority_ordering
        grounds:
          - validations[priority=15]
          - validations[priority=19]
          - errors.ERR_AGGREGATION_UNMET
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / publish_aggregation_safety_outranks_embargo_window
          rationale: "That instance violates the aggregation gate and the embargo gate in a single publish call and asserts ERR_AGGREGATION_UNMET wins."

  - section: endpoints
    instances:
      - name: runner_patch_updates_status_and_cooldown
        claim_type: standard_crud
        grounds:
          - endpoints.PATCH /open-data/ingest-runners/{runnerId}
          - entities.IngestRunner
        distinguishing_aspect: "The PATCH accepts either optional field, bumps version to 2 and the change is visible on a subsequent GET; armed_window_count is untouched because no pipeline exists."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "Runner 'ingest-runner-a' registered with cooldown_minutes 15 and status ACTIVE"
          setup_api_calls:
            - call: "POST /open-data/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortalAdmin
            - call: "POST /open-data/ingest-runners"
              payload: { name: "ingest-runner-a", cooldown_minutes: 15 }
              as: PortalAdmin
              captures: { runner_id: "$.data.id" }
          trigger:
            - call: "PATCH /open-data/ingest-runners/${runner_id}"
              payload: { status: "DRAINING", cooldown_minutes: 30 }
              as: PortalAdmin
          assert:
            - "Response is 200 with response.data.status == DRAINING and cooldown_minutes == 30"
            - "response.data.version == 2 and armed_window_count == 0"
            - "GET /open-data/ingest-runners/${runner_id} returns the same status DRAINING and cooldown_minutes 30"
            - "GET /open-data/ingest-runners with status == ACTIVE returns total_count 0"

      - name: license_retire_action_flips_retired_flag_only
        claim_type: action_endpoint
        grounds:
          - endpoints.POST /open-data/licenses/{licenseId}/retire
          - entities.LicenseTerm.fields.retired
        distinguishing_aspect: "Retirement is a one-field action: retired flips to true and version bumps to 2, while code, name, the three permission flags and reuse_permission_class are all preserved, and the licence stays visible in the catalogue behind the retired filter."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "Licence CC-BY-4.0 created with attribution_required true, commercial_use_allowed true, share_alike false"
          setup_api_calls:
            - call: "POST /open-data/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortalAdmin
            - call: "POST /open-data/licenses"
              payload: { code: "CC-BY-4.0", name: "Creative Commons Attribution 4.0", attribution_required: true, commercial_use_allowed: true, share_alike: false, attribution_text_template: "Source: City of Example, {dataset_title}" }
              as: PortalAdmin
              captures: { lic_id: "$.data.id" }
          trigger:
            - call: "POST /open-data/licenses/${lic_id}/retire"
              as: PortalAdmin
          assert:
            - "Response is 200 with response.data.retired == true and version == 2"
            - "response.data.code == CC-BY-4.0 and reuse_permission_class == ATTRIBUTION"
            - "GET /open-data/licenses with retired == true returns total_count 1"
