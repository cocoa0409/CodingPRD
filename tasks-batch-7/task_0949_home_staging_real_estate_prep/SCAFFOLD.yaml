    side_effects: ["Listing UNDER_CONTRACT -> BACK_ON_MARKET with fallout_count += 1", "Project DESTAGE_PENDING -> RESTAGE_REQUIRED with restage_count += 1", "the SCHEDULED Pickup -> CANCELLED", "Lease ENDING -> ACTIVE", "calculations.restage_availability_recheck re-derives the pull's fill_rate"]
