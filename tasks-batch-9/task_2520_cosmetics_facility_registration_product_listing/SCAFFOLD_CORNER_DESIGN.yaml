          assert:
            - "${retention_before} == \"2029-08-05\" (3-year consumer horizon before reclassification)"
            - "${status_after} == \"REPORT_DUE\" and seriousness == \"SERIOUS\""
            - "${reclassified} == \"2026-08-25T09:30:00Z\" and ${basis_after} == \"2026-08-25T09:30:00Z\" — the basis is the reclassification instant, not received_at"
            - "${deadline_after} == \"2026-09-09T23:59:59.999Z\" (NOT the received_at-based 2026-08-20T23:59:59.999Z, which had already passed)"
            - "${retention_after} == \"2032-08-05\" — six years from received_at, which is retained as the retention anchor"
            - "Facility.open_serious_event_count == 1 after the reclassification, and GET /cosmetics/listings/${lst_id}/adverse-events?report_status=REPORT_DUE returns exactly this event"
            - "Facility.serious_event_points is still 0.00 — the rebased event is REPORT_DUE and therefore out of the points input set"

      - name: data_gap_penalty_pushes_a_sixty_five_point_dossier_to_deficient
        claim_type: constants_applied
        grounds:
          - calculations.substantiation_adequacy_score
          - errors[ERR_FULL_REVIEW_REQUIRED_FOR_DATA_GAP]
          - validations[priority=36]
        distinguishing_aspect: |
          One is_data_gap_flag ingredient does two things at once: it forbids the SCREENING variant
          outright (ERR_FULL_REVIEW_REQUIRED_FOR_DATA_GAP, 422) and it subtracts DATA_GAP_PENALTY 15.00
          inside the FULL variant, turning the canonical 40.00 + 25.00 = 65.00 pass into 50.00 — below
          ADEQUACY_PASS — so the dossier lands DEFICIENT and the listing's safety dimension becomes
          SUBSTANTIATION_FAILED.
        test_recipe:
          setup:
            - "one REGISTERED facility, one consumer listing carrying one is_data_gap_flag ingredient, and a two-item dossier submitted for review"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Aster Brands Inc", us_address_line: "12 Market St, Newark NJ 07102", contact_phone: "+1-202-555-0110", contact_email: "safety@aster.example" }
              as: ResponsiblePersonAgent
              captures: { rp_id: $.data.id }
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_id}", product_name: "Aster Blush Powder", category_code: "07A", product_form: "LEAVE_ON", label_contact_type: "ELECTRONIC_CONTACT", label_contact_value: "safety@aster.example" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
