      assert:
      - ${rt} == object
      - ${n0} == 0
  - name: closed_account_refuses_new_lease
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.PortfolioAccount.terminal_states
    - validations[priority=7]
    - errors[ERR_ACCOUNT_CLOSED]
    distinguishing_aspect: Once an account reaches CLOSED_CONVERTED every child mutation is refused, so a new lease sees ERR_ACCOUNT_CLOSED.
    test_recipe:
      setup:
      - PortfolioAccount CLOSED_CONVERTED with completion_pct_bps 10000
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          account_name: Closed Co
          client_name: GlobalTech Industries
