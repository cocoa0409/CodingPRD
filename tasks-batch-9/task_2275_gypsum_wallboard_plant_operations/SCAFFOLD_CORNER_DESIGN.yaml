      - name: outage_window_must_end_strictly_after_it_starts
        claim_type: temporal_validation
        grounds:
          - validations[priority 12, ERR_INVALID_WINDOW]
          - endpoints[POST /plant-ops/maintenance-outages]
        distinguishing_aspect: |
          window_end must be strictly after window_start, so a reversed window and a zero-length window
          are both refused with ERR_INVALID_WINDOW (400) — the check runs before the seasonality index is
          ever computed, so no outage row and no index appear.
        test_recipe:
          setup:
            - "Plant GYP-1 with LINE-1 AVAILABLE."
          setup_api_calls:
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-1", name: "Front Range Wallboard", calciner_capacity_tph: 60, stucco_silo_capacity_tons: 1200, energy_price_per_mmbtu: 4.20, contribution_margin_per_msf: 38.50 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /plant-ops/plants/${plant_id}/board-lines"
              payload: { designation: "LINE-1", max_speed_fpm: 500, web_width_in: 54.0 }
              as: PlantAdmin
              captures: { line_id: $.data.id }
          trigger:
            - call: "POST /plant-ops/maintenance-outages"
              payload: { line_id: "${line_id}", outage_type: "PLANNED", window_start: "2026-10-07T06:00:00Z", window_end: "2026-10-05T06:00:00Z", scope_note: "reversed window" }
              as: MaintenancePlanner
              as_user_id: "u_planner"
              captures: { err_reversed: $.data.error_id }
            - call: "POST /plant-ops/maintenance-outages"
              payload: { line_id: "${line_id}", outage_type: "PLANNED", window_start: "2026-10-05T06:00:00Z", window_end: "2026-10-05T06:00:00Z", scope_note: "zero length window" }
              as: MaintenancePlanner
              as_user_id: "u_planner"
              captures: { err_zero: $.data.error_id }
          assert:
            - "both calls returned status 400"
            - "${err_reversed} == ERR_INVALID_WINDOW and ${err_zero} == ERR_INVALID_WINDOW"
            - "GET /plant-ops/maintenance-outages?line_id=${line_id} returns total_count == 0"
            - "BoardLine.${line_id}.status == AVAILABLE"

