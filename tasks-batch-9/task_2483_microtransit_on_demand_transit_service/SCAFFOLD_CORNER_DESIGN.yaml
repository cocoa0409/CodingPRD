            - call: "POST /vehicles"
              payload: { zone_id: "${z_id}", vehicle_code: "V1", seat_capacity: 6, wav_positions: 2 }
              as: ZoneAdmin
              captures: { v1_id: $.data.id }
            - call: "POST /drivers"
              payload: { zone_id: "${z_id}", driver_code: "D1", wav_certified: true }
              as: ZoneAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /riders"
              payload: { zone_id: "${z_id}", rider_code: "R1", fare_category: "FULL", mobility_device: "WHEELCHAIR" }
              as: ZoneAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /vehicle-blocks"
              payload: { zone_id: "${z_id}", vehicle_id: "${v1_id}", driver_id: "${d1_id}", block_type: "BASE", start_utc: "2026-08-03T06:00:00Z", end_utc: "2026-08-03T10:00:00Z" }
              as: Dispatcher
              captures: { b1_id: $.data.id }
            - call: "POST /vehicle-blocks/${b1_id}/open"
              payload: {}
              as: Dispatcher
              captures: { b1_v: $.data.version }
            - call: "POST /trip-requests"
              payload: { zone_id: "${z_id}", rider_id: "${r1_id}", origin_stop_id: "${s0_id}", destination_stop_id: "${s4_id}", requested_pickup_utc: "2026-08-03T07:00:00Z", party_size: 2 }
              as: Rider
              as_user_id: "${r1_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /pool-assignments"
              payload: { trip_request_id: "${t1_id}", block_id: "${b1_id}", expected_vehicle_block_version: "${b1_v}" }
              as: Dispatcher
              captures: { pa1_id: $.data.id }
            - call: "GET /vehicle-blocks/${b1_id}"
              payload: {}
              as: Dispatcher
              captures: { b1_v_offered: $.data.version }
          trigger:
            - call: "POST /trip-requests/${t1_id}/cancel"
              payload: { note: "rider no longer needs the ride" }
              as: Rider
              as_user_id: "${r1_id}"
            - call: "GET /pool-assignments/${pa1_id}"
              payload: {}
              as: Dispatcher
            - call: "GET /vehicle-blocks/${b1_id}"
              payload: {}
              as: Dispatcher
              captures: { b1_v_released: $.data.version }
          assert:
            - "before the cancel, VehicleBlock.${b1_id}.seats_committed == 2, wav_positions_committed == 1, committed_index_min == 0 and committed_index_max == 4"
            - "the cancel response body itself shows status == CANCELLED, assigned_block_id == null, fare_status == UNPRICED, quoted_fare_cents == null, promised_pickup_utc == null and promised_dropoff_utc == null"
            - "the immediate re-read shows PoolAssignment.${pa1_id}.state == RELEASED"
            - "the immediate re-read shows VehicleBlock.${b1_id}.seats_committed == 0, wav_positions_committed == 0, committed_index_min == null and committed_index_max == null"
            - "${b1_v_released} == ${b1_v_offered} + 1 (the release wrote the block once, in the same request)"
            - "GET /fare-transactions?trip_request_id=${t1_id} returns total_count == 0 — an unsettled cancel writes no ledger row"
