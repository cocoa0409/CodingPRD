# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3149_resuscitation_training_center_authorization_card_issuance
#
# Breadth probe: every claim §1.1–§1.7 declares that §1.8 does not already
# exercise. Corners already covered by §1.8 appear as `excluded_because:` stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: training_center_create_returns_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.TrainingCenter
          - endpoints.POST_/aha/training-centers
        distinguishing_aspect: "A center created with only legal_name/region/contact_email returns 201 with status PROVISIONAL, version 1, cards_issued_count 0, active_card_count 0, null probation_started_at / last_audit_opened_at, and system-minted id/created_at/updated_at."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /aha/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NationalAdmin
          trigger:
            - &c_center
              call: "POST /aha/training-centers"
              payload: { legal_name: "Prairie Heart Training Center", region: "MIDWEST", contact_email: "ops@prairie-htc.example" }
              as: NationalAdmin
              captures: { center_id: $.data.id, center_status: $.data.status, center_v: $.data.version, center_issued: $.data.cards_issued_count, center_active_cards: $.data.active_card_count }
          assert:
            - "the response status is 201 and response_type is object"
            - "center_status == PROVISIONAL and center_v == 1"
            - "center_issued == 0 and center_active_cards == 0"
            - "TrainingCenter.${center_id}.probation_started_at is null and last_audit_opened_at is null"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: guidelines_version_get_roundtrips_all_fields
        claim_type: Retrieval
        grounds:
          - entities.GuidelinesVersion
          - endpoints.GET_/aha/guidelines-versions/{id}
        distinguishing_aspect: "Every stored GuidelinesVersion field round-trips through GET exactly as posted, with status DRAFT before activation."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DRAFT guidelines version exists."
          setup_api_calls:
            - *c_clock
            - &c_gv
              call: "POST /aha/guidelines-versions"
              payload: { code: "G2025", title: "2025 AHA Guidelines", published_at: "2025-10-01T00:00:00Z", transition_deadline_at: "2027-03-01T00:00:00Z" }
              as: NationalAdmin
              captures: { gv_id: $.data.id }
          trigger:
            - call: "GET /aha/guidelines-versions/${gv_id}"
              payload: {}
              as: TCCoordinator
              captures: { gv_code: $.data.code, gv_status: $.data.status, gv_deadline: $.data.transition_deadline_at }
          assert:
            - "the response status is 200"
            - "gv_code == G2025 and gv_status == DRAFT"
            - "gv_deadline == \"2027-03-01T00:00:00Z\""
            - "GuidelinesVersion.${gv_id}.title == \"2025 AHA Guidelines\" and published_at == \"2025-10-01T00:00:00Z\""

      - name: sessions_list_paginates_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/aha/training-centers/{id}/course-sessions
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three sessions on a center, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns the last row with has_more false; total_count counts the whole filtered set, not the page."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Full base chain; three SCHEDULED sessions on distinct days."
          setup_api_calls:
            - *c_clock
            - *c_center
            - &c_faculty
              call: "POST /aha/instructors"
              payload: { full_name: "Fiona Faculty", email: "fiona@x.example", discipline: "BLS", home_training_center_id: "${center_id}", legacy_certified: true }
              as: NationalAdmin
              captures: { faculty_id: $.data.id }
            - &c_grant
              call: "POST /aha/instructors/${faculty_id}/grant-faculty"
              payload: {}
              as: NationalAdmin
            - &c_falign
              call: "POST /aha/training-centers/${center_id}/alignments"
              payload: { instructor_id: "${faculty_id}", as_faculty: true }
              as: TCAdmin
            - &c_cv
              call: "GET /aha/training-centers/${center_id}"
              payload: {}
              as: TCAdmin
              captures: { center_v: $.data.version }
            - &c_site
              call: "POST /aha/training-centers/${center_id}/sites"
              payload: { name: "Main Lab", street_address: "100 CPR Way", city: "Austin", state_code: "TX", capacity_students: 24 }
              as: TCAdmin
              captures: { site_id: $.data.id }
            - &c_align
              call: "POST /aha/training-sites/${site_id}/align"
              payload: { expected_training_center_version: "${center_v}" }
              as: TCAdmin
            - &c_activate
              call: "POST /aha/training-centers/${center_id}/activate"
              payload: {}
              as: NationalAdmin
            - &c_gva
              call: "POST /aha/guidelines-versions"
              payload: { code: "G2025", title: "2025 AHA Guidelines", published_at: "2025-10-01T00:00:00Z", transition_deadline_at: "2027-03-01T00:00:00Z" }
              as: NationalAdmin
              captures: { gv_id: $.data.id }
            - &c_gva_activate
              call: "POST /aha/guidelines-versions/${gv_id}/activate"
              payload: {}
              as: NationalAdmin
            - &c_lead
              call: "POST /aha/instructors"
              payload: { full_name: "Carl Certified", email: "carl@x.example", discipline: "BLS", home_training_center_id: "${center_id}", legacy_certified: true }
              as: NationalAdmin
              captures: { cand_id: $.data.id }
            - &c_lalign
              call: "POST /aha/training-centers/${center_id}/alignments"
              payload: { instructor_id: "${cand_id}", as_faculty: false }
              as: TCAdmin
            - &c_s1
              call: "POST /aha/course-sessions"
              payload: { training_center_id: "${center_id}", site_id: "${site_id}", primary_instructor_id: "${cand_id}", guidelines_version_id: "${gv_id}", course_type: "BLS_PROVIDER", delivery_format: "CLASSROOM", start_at: "2026-10-10T14:00:00Z", end_at: "2026-10-10T18:00:00Z", capacity: 6, manikin_count: 2, aed_trainer_count: 1, assisting_instructor_count: 0 }
              as: TCCoordinator
              captures: { c_s1_id: $.data.id }
            - call: "POST /aha/course-sessions"
              payload: { training_center_id: "${center_id}", site_id: "${site_id}", primary_instructor_id: "${cand_id}", guidelines_version_id: "${gv_id}", course_type: "BLS_PROVIDER", delivery_format: "CLASSROOM", start_at: "2026-10-11T14:00:00Z", end_at: "2026-10-11T18:00:00Z", capacity: 6, manikin_count: 2, aed_trainer_count: 1, assisting_instructor_count: 0 }
              as: TCCoordinator
            - call: "POST /aha/course-sessions"
              payload: { training_center_id: "${center_id}", site_id: "${site_id}", primary_instructor_id: "${cand_id}", guidelines_version_id: "${gv_id}", course_type: "BLS_PROVIDER", delivery_format: "CLASSROOM", start_at: "2026-10-12T14:00:00Z", end_at: "2026-10-12T18:00:00Z", capacity: 6, manikin_count: 2, aed_trainer_count: 1, assisting_instructor_count: 0 }
              as: TCCoordinator
          trigger:
            - call: "GET /aha/training-centers/${center_id}/course-sessions"
              payload: { limit: 2, offset: 0 }
              as: TCAdmin
          assert:
            - "the response status is 200 and response_type is array"
            - "the response returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET with limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET with no parameters returns 3 rows (defaults limit 10, offset 0)"
            - "GET with status=SCHEDULED returns 3 rows; status=CANCELLED returns 0 rows with total_count 0"

      - name: instructor_get_with_unknown_id_returns_instructor_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/aha/instructors/{id}
          - errors.ERR_INSTRUCTOR_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated instructor id returns the entity-specific 404 ERR_INSTRUCTOR_NOT_FOUND, not generic ERR_NOT_FOUND and not a 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /aha/instructors/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: TCAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_INSTRUCTOR_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: session_create_missing_capacity_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.CourseSession.fields.capacity
          - validations[priority=3.2]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "capacity is a required input with no default; omitting it entirely is a 400 ERR_INVALID_REQUEST from the body-shape check — NOT the 422 ERR_CAPACITY_EXCEEDS_SITE that a present-but-too-large value produces."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Full base chain ready for session creation."
          setup_api_calls:
            - *c_clock
            - *c_center
            - *c_faculty
            - *c_grant
            - *c_falign
            - *c_cv
            - *c_site
            - *c_align
            - *c_activate
            - *c_gva
            - *c_lead
            - *c_lalign
          trigger:
            - call: "POST /aha/course-sessions"
              payload: { training_center_id: "${center_id}", site_id: "${site_id}", primary_instructor_id: "${cand_id}", guidelines_version_id: "${gv_id}", course_type: "BLS_PROVIDER", delivery_format: "CLASSROOM", start_at: "2026-10-10T14:00:00Z", end_at: "2026-10-10T18:00:00Z", manikin_count: 2, aed_trainer_count: 1 }
              as: TCCoordinator
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "error_id != ERR_CAPACITY_EXCEEDS_SITE"
            - "GET /aha/training-centers/${center_id}/course-sessions returns 0 rows"

      - name: roster_entry_omitting_prior_card_defaults_to_non_renewal
        claim_type: Defaults
        grounds:
          - entities.RosterEntry.fields.prior_card_id
          - entities.CourseCompletionCard.fields.is_renewal
        distinguishing_aspect: "prior_card_id declares default null; omitting it stores null and the card issued at completion carries is_renewal == false with the initial_issue expiry variant."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Full base chain; SCHEDULED session capacity 6."
          setup_api_calls:
            - *c_clock
            - *c_center
            - *c_faculty
            - *c_grant
            - *c_falign
            - *c_cv
            - *c_site
            - *c_align
            - *c_activate
            - *c_gva
            - *c_lead
            - *c_lalign
            - *c_s1
          trigger:
            - call: "POST /aha/course-sessions/${c_s1_id}/roster"
              payload: { student_name: "Sam Student", student_email: "sam@x.example" }
              as: TCCoordinator
              captures: { entry_id: $.data.id, entry_prior: $.data.prior_card_id }
          assert:
            - "the response status is 201"
            - "entry_prior is null"
            - "RosterEntry.${entry_id}.remediation_used == false and status == ENROLLED"

      - name: seats_available_is_computed_and_client_value_ignored
        claim_type: Computed Fields
        grounds:
          - entities.CourseSession.fields.seats_available
          - calculations.seats_available_reconciliation
        distinguishing_aspect: "seats_available is source: computed — a client that smuggles seats_available=0 into the create payload is ignored; the session is created with seats_available == capacity."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Full base chain ready for session creation."
          setup_api_calls:
            - *c_clock
            - *c_center
            - *c_faculty
            - *c_grant
            - *c_falign
            - *c_cv
            - *c_site
            - *c_align
            - *c_activate
            - *c_gva
            - *c_lead
            - *c_lalign
          trigger:
            - call: "POST /aha/course-sessions"
              payload: { training_center_id: "${center_id}", site_id: "${site_id}", primary_instructor_id: "${cand_id}", guidelines_version_id: "${gv_id}", course_type: "BLS_PROVIDER", delivery_format: "CLASSROOM", start_at: "2026-10-10T14:00:00Z", end_at: "2026-10-10T18:00:00Z", capacity: 6, manikin_count: 2, aed_trainer_count: 1, assisting_instructor_count: 0 }
              as: TCCoordinator
              captures: { sess_id: $.data.id, seats: $.data.seats_available }
          assert:
            - "the response status is 201"
            - "seats == 6 (capacity - 0 enrolled; any client-supplied seats value is ignored)"
            - "CourseSession.${sess_id}.status == SCHEDULED"

      - name: session_create_system_fields_status_and_version_are_server_owned
        claim_type: System Fields
        grounds:
          - entities.CourseSession.fields.status
          - endpoints.POST_/aha/course-sessions
        distinguishing_aspect: "status is source: system with initial SCHEDULED; a client sending status IN_PROGRESS and version 99 is ignored — the row is created SCHEDULED at version 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Full base chain ready for session creation."
          setup_api_calls:
            - *c_clock
            - *c_center
            - *c_faculty
            - *c_grant
            - *c_falign
            - *c_cv
            - *c_site
            - *c_align
            - *c_activate
            - *c_gva
            - *c_lead
            - *c_lalign
          trigger:
            - call: "POST /aha/course-sessions"
              payload: { training_center_id: "${center_id}", site_id: "${site_id}", primary_instructor_id: "${cand_id}", guidelines_version_id: "${gv_id}", course_type: "BLS_PROVIDER", delivery_format: "CLASSROOM", start_at: "2026-10-10T14:00:00Z", end_at: "2026-10-10T18:00:00Z", capacity: 6, manikin_count: 2, aed_trainer_count: 1, assisting_instructor_count: 0 }
              as: TCCoordinator
              captures: { sess_id: $.data.id, sess_status: $.data.status, sess_v: $.data.version }
          assert:
            - "the response status is 201"
            - "sess_status == SCHEDULED and sess_v == 1"
            - "CourseSession.${sess_id}.cancel_reason is null"

      - name: instructor_create_with_out_of_enum_discipline_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Instructor.fields.discipline
          - validations[priority=3.2]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "discipline is a closed enum {BLS, ACLS, PALS, HEARTSAVER}; a value such as FIRST_AID is rejected at priority 3.2 with 400 ERR_INVALID_REQUEST rather than being coerced."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One training center exists."
          setup_api_calls:
            - *c_clock
            - *c_center
          trigger:
            - call: "POST /aha/instructors"
              payload: { full_name: "Ned Newbie", email: "ned@x.example", discipline: "FIRST_AID", home_training_center_id: "${center_id}" }
              as: NationalAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /aha/training-centers/${center_id}/instructors returns 0 rows"

      - name: site_create_under_unknown_center_returns_center_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.TrainingSite.fields.training_center_id
          - validations[priority=3]
          - errors.ERR_TRAINING_CENTER_NOT_FOUND
          - complexity_profile.entity_topology
        distinguishing_aspect: "The hierarchical topology puts the parent in the path; a well-formed body under an unknown center id is a 404 ERR_TRAINING_CENTER_NOT_FOUND before any body validation runs."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /aha/training-centers/00000000-0000-4000-8000-000000000000/sites"
              payload: { name: "Ghost Lab", street_address: "1 Nowhere Rd", city: "Austin", state_code: "TX", capacity_students: 10 }
              as: TCAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_TRAINING_CENTER_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: revoked_center_is_terminal_and_rejects_reinstate
        claim_type: invalid_transition
        grounds:
          - state_machines.TrainingCenter.terminal_states
          - errors.ERR_CENTER_REVOKED
        distinguishing_aspect: "REVOKED is terminal: reinstate on a REVOKED center fails with 409 ERR_CENTER_REVOKED and no transition fires."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Center activated, suspended, then revoked."
          setup_api_calls:
            - *c_clock
            - *c_center
            - *c_faculty
            - *c_grant
            - *c_falign
            - *c_cv
            - *c_site
            - *c_align
            - *c_activate
            - call: "POST /aha/training-centers/${center_id}/suspend"
              payload: {}
              as: QAAuditor
            - call: "POST /aha/training-centers/${center_id}/revoke"
              payload: {}
              as: NationalAdmin
              captures: { revoked_status: $.data.status }
          trigger:
            - call: "POST /aha/training-centers/${center_id}/reinstate"
              payload: {}
              as: NationalAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "revoked_status == REVOKED"
            - "the trigger returns 409 and error_id == ERR_CENTER_REVOKED"
            - "TrainingCenter.${center_id}.status is still REVOKED after the failed call"

      - name: certify_from_candidate_returns_not_monitored
        claim_type: invalid_transition
        grounds:
          - state_machines.Instructor.MONITORED_to_CERTIFIED
          - errors.ERR_INSTRUCTOR_NOT_MONITORED
        distinguishing_aspect: "Skipping the monitoring step: certify against a CANDIDATE instructor fails with ERR_INSTRUCTOR_NOT_MONITORED even when two teaching evaluations already exist."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Center, legacy faculty, and a CANDIDATE instructor with two evaluations but no monitoring."
          setup_api_calls:
            - *c_clock
            - *c_center
            - *c_faculty
            - *c_grant
            - call: "POST /aha/instructors"
              payload: { full_name: "Carl Candidate", email: "carl@x.example", discipline: "BLS", home_training_center_id: "${center_id}" }
              as: NationalAdmin
              captures: { cand_id: $.data.id }
            - call: "POST /aha/instructors/${cand_id}/teaching-evaluations"
              payload: { score: 5, notes: "Strong lecture." }
              as: TrainingFaculty
              as_user_id: "${faculty_id}"
            - call: "POST /aha/instructors/${cand_id}/teaching-evaluations"
              payload: { score: 5, notes: "Strong skills station." }
              as: TrainingFaculty
              as_user_id: "${faculty_id}"
          trigger:
            - call: "POST /aha/instructors/${cand_id}/certify"
              payload: {}
              as: TCAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the trigger returns 409 and error_id == ERR_INSTRUCTOR_NOT_MONITORED"
            - "Instructor.${cand_id}.status is still CANDIDATE"
            - "error_id != ERR_EVALUATION_AVERAGE_BELOW_THRESHOLD"

      - name: roster_entry_starts_enrolled_with_remediation_unused
        claim_type: valid_transition
        grounds:
          - state_machines.RosterEntry.initial_state
          - entities.RosterEntry.fields.remediation_used
        distinguishing_aspect: "Every new roster entry starts exactly ENROLLED with remediation_used false; no input can change the initial state."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Full base chain; SCHEDULED session."
          setup_api_calls:
            - *c_clock
            - *c_center
            - *c_faculty
            - *c_grant
            - *c_falign
            - *c_cv
            - *c_site
            - *c_align
            - *c_activate
            - *c_gva
            - *c_lead
            - *c_lalign
            - *c_s1
          trigger:
            - call: "POST /aha/course-sessions/${c_s1_id}/roster"
              payload: { student_name: "Sam Student", student_email: "sam@x.example" }
              as: TCCoordinator
              captures: { entry_status: $.data.status, entry_remediation: $.data.remediation_used }
          assert:
            - "entry_status == ENROLLED and entry_remediation == false"

      - name: card_second_revoke_fails_not_active
        claim_type: idempotency
        grounds:
          - state_machines.CourseCompletionCard.ACTIVE_to_REVOKED
          - errors.ERR_CARD_NOT_ACTIVE
        distinguishing_aspect: "The revoke trigger is not idempotent: a second revoke on an already-REVOKED card returns 409 ERR_CARD_NOT_ACTIVE and active_card_count is decremented exactly once."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Full base chain; session completed with one PASSED entry (one ACTIVE card issued; center active_card_count == 1)."
          setup_api_calls:
            - *c_clock
            - *c_center
            - *c_faculty
            - *c_grant
            - *c_falign
            - *c_cv
            - *c_site
            - *c_align
            - *c_activate
            - *c_gva
            - *c_lead
            - *c_lalign
            - *c_s1
            - call: "POST /aha/course-sessions/${c_s1_id}/roster"
              payload: { student_name: "Sam Student", student_email: "sam@x.example" }
              as: TCCoordinator
              captures: { entry_id: $.data.id }
            - call: "POST /aha/course-sessions/${c_s1_id}/start"
              payload: {}
              as: TCCoordinator
            - call: "POST /aha/roster-entries/${entry_id}/skills-evaluations"
              payload: { items: [{ item_code: "SCENE", critical: true, passed: true }, { item_code: "COMP", critical: false, passed: true }] }
              as: Instructor
              as_user_id: "${cand_id}"
            - call: "POST /aha/course-sessions/${c_s1_id}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${cand_id}"
            - call: "GET /aha/roster-entries/${entry_id}/cards"
              payload: {}
              as: TCAdmin
              captures: { card_id: $.data.0.id }
            - call: "POST /aha/cards/${card_id}/revoke"
              payload: {}
              as: QAAuditor
              captures: { first_revoke_status: $.data.status }
          trigger:
            - call: "POST /aha/cards/${card_id}/revoke"
              payload: {}
              as: QAAuditor
              captures: { error_id: $.data.error_id }
            - call: "GET /aha/training-centers/${center_id}"
              payload: {}
              as: QAAuditor
              captures: { active_cards: $.data.active_card_count, issued: $.data.cards_issued_count }
          assert:
            - "first_revoke_status == REVOKED"
            - "the second revoke returns 409 and error_id == ERR_CARD_NOT_ACTIVE"
            - "active_cards == 0 (decremented exactly once) and issued == 1"

      - name: critical_finding_then_clean_close_is_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.QualityAudit.OPEN_to_CLOSED_CLEAN
          - errors.ERR_AUDIT_HAS_OPEN_CRITICAL_FINDINGS
        distinguishing_aspect: "CLOSE with outcome CLEAN is rejected while any CRITICAL finding exists on the audit; the same audit later closes CORRECTIVE_ACTION."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Activated center; OPEN audit with one MINOR finding then one CRITICAL finding (the CRITICAL suspends the center)."
          setup_api_calls:
            - *c_clock
            - *c_center
            - *c_faculty
            - *c_grant
            - *c_falign
            - *c_cv
            - *c_site
            - *c_align
            - *c_activate
            - call: "GET /aha/training-centers/${center_id}"
              payload: {}
              as: QAAuditor
              captures: { center_v_now: $.data.version }
            - call: "POST /aha/quality-audits"
              payload: { target_training_center_id: "${center_id}", expected_training_center_version: "${center_v_now}" }
              as: QAAuditor
              captures: { audit_id: $.data.id }
            - call: "POST /aha/quality-audits/${audit_id}/findings"
              payload: { severity: "MINOR", description: "Sign-in sheet gaps." }
              as: QAAuditor
            - call: "POST /aha/quality-audits/${audit_id}/findings"
              payload: { severity: "CRITICAL", description: "Unmonitored instructor teaching." }
              as: QAAuditor
          trigger:
            - call: "POST /aha/quality-audits/${audit_id}/close"
              payload: { outcome: "CLEAN" }
              as: QAAuditor
              captures: { error_id: $.data.error_id }
            - call: "POST /aha/quality-audits/${audit_id}/close"
              payload: { outcome: "CORRECTIVE_ACTION" }
              as: QAAuditor
              captures: { close_status: $.data.status }
          assert:
            - "the CLEAN close returns 409 and error_id == ERR_AUDIT_HAS_OPEN_CRITICAL_FINDINGS"
            - "the CORRECTIVE_ACTION close returns 200 and close_status == CLOSED_CORRECTIVE"
            - "TrainingCenter.${center_id}.status == SUSPENDED (a corrective close never un-suspends)"

      - name: guidelines_activation_terminal_lockout
        claim_type: invalid_transition
        grounds:
          - state_machines.GuidelinesVersion.DRAFT_to_ACTIVE
          - errors.ERR_GUIDELINES_VERSION_CONFLICT
        distinguishing_aspect: "A SUPERSEDED version cannot be re-activated: the second activation attempt fails with 409 ERR_GUIDELINES_VERSION_CONFLICT, keeping exactly one ACTIVE version."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. G2025 ACTIVE, then G2030 created and activated, superseding G2025."
          setup_api_calls:
            - *c_clock
            - *c_gv
            - *c_gva
            - call: "POST /aha/guidelines-versions"
              payload: { code: "G2030", title: "2030 AHA Guidelines", published_at: "2030-10-01T00:00:00Z", transition_deadline_at: "2027-03-01T00:00:00Z" }
              as: NationalAdmin
              captures: { gv2030_id: $.data.id }
            - call: "POST /aha/guidelines-versions/${gv2030_id}/activate"
              payload: {}
              as: NationalAdmin
          trigger:
            - call: "POST /aha/guidelines-versions/${gv_id}/activate"
              payload: {}
              as: NationalAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the trigger returns 409 and error_id == ERR_GUIDELINES_VERSION_CONFLICT"
            - "GuidelinesVersion.${gv_id}.status is still SUPERSEDED"
            - "GuidelinesVersion.${gv2030_id}.status is still ACTIVE"

  # ===========================================================================
  - section: calculations
    instances:

      - name: equipment_manikin_ceil_boundary
        claim_type: Correct Result
        grounds:
          - calculations.equipment_sufficiency
          - errors.ERR_EQUIPMENT_RATIO_VIOLATION
        distinguishing_aspect: "The ceil(capacity/3) manikin tier boundary: capacity 3 needs exactly 1 manikin and capacity 4 needs exactly 2 — a capacity-4 session with manikin_count 1 is rejected while the same session with 2 succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Full base chain ready for session creation."
          setup_api_calls:
            - *c_clock
            - *c_center
            - *c_faculty
            - *c_grant
            - *c_falign
            - *c_cv
            - *c_site
            - *c_align
            - *c_activate
            - *c_gva
            - *c_lead
            - *c_lalign
          trigger:
            - call: "POST /aha/course-sessions"
              payload: { training_center_id: "${center_id}", site_id: "${site_id}", primary_instructor_id: "${cand_id}", guidelines_version_id: "${gv_id}", course_type: "BLS_PROVIDER", delivery_format: "CLASSROOM", start_at: "2026-10-10T14:00:00Z", end_at: "2026-10-10T16:00:00Z", capacity: 3, manikin_count: 1, aed_trainer_count: 1, assisting_instructor_count: 0 }
              as: TCCoordinator
              captures: { s3_id: $.data.id }
            - call: "POST /aha/course-sessions"
              payload: { training_center_id: "${center_id}", site_id: "${site_id}", primary_instructor_id: "${cand_id}", guidelines_version_id: "${gv_id}", course_type: "BLS_PROVIDER", delivery_format: "CLASSROOM", start_at: "2026-10-11T14:00:00Z", end_at: "2026-10-11T16:00:00Z", capacity: 4, manikin_count: 1, aed_trainer_count: 1, assisting_instructor_count: 0 }
              as: TCCoordinator
              captures: { err4: $.data.error_id }
            - call: "POST /aha/course-sessions"
              payload: { training_center_id: "${center_id}", site_id: "${site_id}", primary_instructor_id: "${cand_id}", guidelines_version_id: "${gv_id}", course_type: "BLS_PROVIDER", delivery_format: "CLASSROOM", start_at: "2026-10-11T14:00:00Z", end_at: "2026-10-11T16:00:00Z", capacity: 4, manikin_count: 2, aed_trainer_count: 1, assisting_instructor_count: 0 }
              as: TCCoordinator
              captures: { s4_id: $.data.id }
          assert:
            - "the capacity-3 create returns 201 (ceil(3/3) == 1 manikin suffices)"
            - "the capacity-4 / 1-manikin create returns 422 and err4 == ERR_EQUIPMENT_RATIO_VIOLATION (ceil(4/3) == 2)"
            - "the capacity-4 / 2-manikin create returns 201"

      - name: renewal_early_window_boundary
        claim_type: Correct Result
        grounds:
          - calculations.renewal_eligibility_window
          - errors.ERR_RENEWAL_WINDOW_CLOSED
        distinguishing_aspect: "The renewal window is [renewal_due_at - 90 days, renewal_due_at] inclusive: at exactly due-90d renewal succeeds (renewal_due_at recomputed from the clock), at due-91d it fails with ERR_RENEWAL_WINDOW_CLOSED."
