              as: Bidder
              captures: { u_id: "$.data.id" }
            - call: "POST /spectrum-auctions/applicants/${u_id}/upfront-payments"
              payload: { amount_cents: 31250000000 }
              as: Bidder
              as_user_id: "${u_id}"
            - call: "POST /spectrum-auctions/applicants"
              payload: { auction_id: "${auction_id}", legal_name: "V Verified", claims_small_business: false, claims_rural_credit: false, own_annual_revenue_cents: 0, service_population: 0, ownership_interests: [{ holder_name: "V Owner", stake_pct: 100, holder_annual_revenue_cents: 0 }] }
              as: Bidder
              captures: { v_id: "$.data.id" }
            - call: "POST /spectrum-auctions/applicants/${v_id}/upfront-payments"
              payload: { amount_cents: 31250000000 }
              as: Bidder
              as_user_id: "${v_id}"
            - call: "POST /spectrum-auctions/applicants/${v_id}/review"
              payload: { action: "START_REVIEW" }
              as: AuctionAdmin
            - call: "POST /spectrum-auctions/applicants/${v_id}/review"
              payload: { action: "QUALIFY" }
              as: AuctionAdmin
            - *c_clock_quiet
            - *c_begin_quiet
            - *c_start_clock
            - *c_get_rounds
          trigger:
            - call: "POST /spectrum-auctions/rounds/${r1_id}/bids"
              payload: { area_code: "PEA001", category: "CATEGORY_A", quantity: 1 }
              as: Bidder
              as_user_id: "${u_id}"
              captures: { u_bid_err: "$.data.error_id" }
            - call: "POST /spectrum-auctions/rounds/${r1_id}/bids"
              payload: { area_code: "PEA001", category: "CATEGORY_A", quantity: 1 }
              as: Bidder
              as_user_id: "${v_id}"
              captures: { v_bid_id: "$.data.id" }
          assert:
            - "u_bid_err == ERR_APPLICANT_INVALID_STATE (U is SUBMITTED, not QUALIFIED — the applicant's state gates the bid)"
            - "U's upfront payment does NOT substitute for qualification (eligibility alone is insufficient)"
            - "Bid.${v_bid_id}.status == SUBMITTED (the qualified bidder succeeds in the same round)"
            - "GET /spectrum-auctions/applicants/${u_id}/bids returns an empty array"

