      - name: access_code_mismatch_rejections_wrong_candidate_then_wrong_form
        claim_type: violation_to_error
        grounds:
          - validations[priority=28]
          - validations[priority=29]
          - errors.ERR_ACCESS_CODE_CANDIDATE_MISMATCH
          - errors.ERR_ACCESS_CODE_FORM_MISMATCH
        distinguishing_aspect: |
          An access code carries two independent bindings and each has its own error: the code's candidate_id
          must equal the sitting's candidate_id (priority 28) and the code's BATCH exam_form_id — one hop away,
          not a field on the code — must equal the sitting's exam_form_id (priority 29). Both codes involved
          are legitimately ASSIGNED, so a naive AccessCode.status check would let both requests through.
        test_recipe:
          setup:
            - "A jurisdiction / provider prepaid 500000 / two ACTIVE EN forms F1 and F2 / 2-seat EN site / REGISTERED EN proctor / candidates A and B."
            - "Batch1 purchased for F1 with 2 EXAM_ONLY codes: code1 assigned to A, code2 assigned to B."
            - "Batch2 purchased for F2 with 1 EXAM_ONLY code assigned to A."
