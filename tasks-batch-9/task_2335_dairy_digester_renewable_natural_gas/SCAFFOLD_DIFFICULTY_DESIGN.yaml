  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cf_ci_score_nested_cap_binds_over_three_input_families
        grounds:
          - calculations.pathway_ci_score
          - calculations.gas_conditioning_yield
          - calculations.organic_loading_rate
          - calculations.biological_stability_assessment
          - entities.CreditPathway.fields.certified_ci_score
        distinguishing_aspect: |
          Mode (a) - a single expression nesting min() inside max() over three independent
          input families (volatile-solids mass 26.240 t, haul work 400.00 tonne-km, gas
          energy 24.547 MMBtu): the raw avoidance credit of 2706.82 g/MJ is clamped by the
          cap min(2706.82, 337.40) and the CI_FLOOR max(..., -400.00) then does NOT bind,
          giving exactly -320.53 rather than -2689.95 (uncapped) or -400.00 (floored).
        test_recipe:
          setup:
            - "One mesophilic 6000 m3 facility fed by a single LAGOON dairy 1.0 km away, on a non-curtailable agreement."
            - "One CLOSED, deliberately overloaded operations day 2026-08-03: a single 400.000 t delivery at 8.0 percent total solids and 82.0 percent volatile solids gives 26.240 t VS and an organic_loading_rate of 4.373 against a design_max_olr of 3.500."
            - "Gas output on that day is small relative to the feed (40000.000 scf raw biogas), so the avoided-methane credit per MJ is enormous and the cap must bind."
