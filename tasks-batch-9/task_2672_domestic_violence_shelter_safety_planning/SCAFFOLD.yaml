# =============================================================================
# SCAFFOLD.yaml — Domestic Violence Shelter & Safety Planning
# Sections §1.0 – §1.7 (see prd-bench-scaffold-generator/SKILL.md)
# §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml, §1.9 in SCAFFOLD_CORNER_DESIGN.yaml
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2672. Domestic Violence Shelter & Safety Planning (domestic violence services agency):
  crisis hotline operation with risk assessment, safety planning and shelter screening,
  shelter admission with capacity, accessibility and family composition considerations plus
  confidentiality of location, individualized safety planning covering relocation,
  communication, technology safety and workplace notification, advocacy for protective
  orders, court accompaniment and criminal justice system navigation, children's services
  with trauma-informed programming and school enrollment support, transitional housing and
  rapid rehousing referrals with landlord engagement, confidentiality requirements limiting
  information sharing including in homeless data systems, staff safety, secondary trauma
  support and mandated reporting obligations

domain_name: domestic-violence-shelter-safety-planning
api_prefix: ""

complexity_profile:
  difficulty_level: expert_plus          # above the §0.4 Expert band: 15 entities, 56 endpoints, 30 errors, 7 calculations
  primary_archetype: compliance_audit    # confidentiality gating + mandated-reporting deadlines + segregation of duties
  secondary_archetype: quota_allocation  # shelter bed pool and landlord pledged-unit pool competed for, reserved, committed, released
  complexity_layers:
    - cascading_side_effects             # 5-link chains: compromise -> seal -> plan -> referral -> landlord ledger
    - optimistic_concurrency             # OCC on ShelterUnit.version, Client.version, LandlordPartner.version
    - dual_variant_calculation           # danger_score (snapshot vs corroborated), stay cost (projected vs settled)
    - derived_field_reconciliation       # bed ledgers, coverage_score, secondary_trauma_index, landlord counters
    - rate_threshold_triggers            # risk bands, wellness postures, capacity postures, incentive tiers

  entity_topology: flat
  # Every entity is a top-level collection joined by explicit FK fields; the only nested
  # URL paths are creation/read sub-resources of an owning aggregate (units under a
  # shelter, components under a plan, risk assessments under a call, wellness checks
  # under a staff member). No entity is addressed through a multi-level ownership chain.

  state_machine_shape: branching
  # Non-linear in three independent ways: HotlineCall forks into three dispositions with
  # divergent side-effect sets; SafetyPlan cycles ACTIVE -> UNDER_REVISION -> ACTIVE;
  # ShelterAdmission carries two independent dimensions (occupancy_status x
  # location_security_status); ProtectiveOrderCase loops DENIED -> PETITION_DRAFTED.

  relationship_patterns:
    - one_to_many          # Shelter -> ShelterUnit, SafetyPlan -> PlanComponent, StaffMember -> WellnessCheck
    - cross_aggregate      # ShelterAdmission references ScreeningRequest, ShelterUnit and Client
    - self_referential     # SafetyPlan.superseded_by_plan_id -> SafetyPlan.id
    - polymorphic          # DisclosureEvent.kind switches the entire rule set applied to one row shape

  role_model: segregation_of_duties
  # Five entity_backed operational roles plus one opaque administrator. Two hard SoD
  # rules: the staff member who created a ScreeningRequest may not decide it, and the
  # staff member who requested a DisclosureEvent may not decide it.

  consistency_model: immediate
  # Every derived field (bed ledgers, postures, coverage_score, trauma index, landlord
  # counters) is recomputed inside the same request that mutates its source rows.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: StaffMember
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: full_name
        type: string
        source: input
        description: Advocate or operator display name.
        constraints: 1..120 chars
      - name: role_type
        type: enum
        source: input
        description: >
          Job family recorded for reporting only. Request authority comes exclusively from
          the X-User-Role header (see §1.7); the server never compares role_type to the
          header, which is what makes the segregation-of-duties rules observable.
        constraints: HOTLINE_ADVOCATE | SHELTER_MANAGER | LEGAL_ADVOCATE | HOUSING_SPECIALIST | PRIVACY_OFFICER
      - name: max_caseload
        type: integer
        source: input
        description: Ceiling on concurrent approved screenings this staff member may hold.
        default: 8
        constraints: 1..50
      - name: active_caseload_count
        type: integer
        source: computed
        description: >
          COUNT(ScreeningRequest WHERE assigned_advocate_id == this.id AND status IN
          {APPROVED, ADMITTED} AND NOT EXISTS(ShelterAdmission WHERE screening_request_id ==
          that request.id AND occupancy_status == EXITED)). Recomputed by calculation
          staff_caseload_and_trauma_index.
        default: 0
      - name: secondary_trauma_index
        type: number
        source: computed
        description: >
          0.0..100.0 with one decimal, produced by calculation staff_caseload_and_trauma_index
          over this staff member's WellnessCheck rows plus active_caseload_count.
        default: 0.0
      - name: wellness_posture
        type: enum
        source: computed
        description: >
          Threshold band over secondary_trauma_index: FROZEN when index >= 70.0, RESTRICTED
          when 40.0 <= index < 70.0, OPEN when index < 40.0. Gates screening approval.
        default: OPEN
        constraints: OPEN | RESTRICTED | FROZEN
      - name: last_wellness_check_at
        type: datetime
        source: computed
        description: >
          MAX(WellnessCheck.checked_on_utc) over WellnessCheck WHERE staff_member_id ==
          this.id; null when no check exists. Ties impossible (single MAX value).
        default: null

  - name: WellnessCheck
    parent: StaffMember
    common_fields: false
    kind: event
    fields:
      - name: staff_member_id
        type: string
        source: input
        description: FK -> StaffMember.id; the staff member this secondary-trauma screening covers. Taken from the path segment.
      - name: checked_on_utc
        type: datetime
        source: input
        description: When the debrief screening happened; must be <= the logical clock (§1.5 POST /_clock/set_current_utc).
      - name: exposure_hours
        type: number
        source: input
        description: Hours of direct survivor-contact exposure in the review window.
        constraints: 0..200, one decimal
      - name: distress_scale
        type: integer
        source: input
        description: Self-reported distress, 0 (none) to 10 (severe).
        constraints: 0..10
      - name: debrief_completed
        type: boolean
        source: input
        description: True when a clinical debrief accompanied the screening; applies the 0.70 mitigation factor.
        default: false
      - name: contribution_points
        type: number
        source: computed
        description: >
          This row's undecayed contribution at creation time, (distress_scale * 6 +
          exposure_hours * 0.5) * (0.70 when debrief_completed else 1.00), one decimal.

  - name: Client
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: client_code
        type: string
        source: input
        description: Pseudonymous survivor identifier used in every external artifact.
        constraints: unique across all Client rows regardless of status; 3..40 chars
      - name: legal_name
        type: string
        source: input
        description: Legal name held in the confidential record; never releasable in an HMIS_EXPORT disclosure.
        constraints: 1..120 chars
      - name: household_size
        type: integer
        source: input
        description: Total people (survivor plus dependents) needing shelter beds.
        constraints: 1..12
      - name: minor_children_count
        type: integer
        source: input
        description: Dependent children under 18 inside household_size; drives family-composition unit fit and school-enrollment support.
        default: 0
        constraints: 0..10 AND minor_children_count <= household_size - 1
      - name: accessibility_required
        type: boolean
        source: input
        description: True when the household needs an ADA_ACCESSIBLE unit.
        default: false
      - name: location_confidential
        type: boolean
        source: input
        description: True when the survivor's shelter location must never be disclosed outside the agency.
        default: true
      - name: hmis_disclosure_consent
        type: enum
        source: input
        description: >
          Written consent state for homeless-data-system participation. GRANTED and DENIED
          are settable at creation; REVOKED is produced only by POST /clients/{id}/consent.
        default: DENIED
        constraints: GRANTED | DENIED | REVOKED
      - name: status
        type: enum
        source: system
        description: >
          INTAKE at creation; ACTIVE set by POST /hotline-calls/{id}/dispose (any
          disposition); EXITED set by POST /housing-referrals/{id}/lease.
        default: INTAKE
        constraints: INTAKE | ACTIVE | EXITED
      - name: confidentiality_posture
        type: enum
        source: computed
        description: >
          Derived gate recomputed by calculation client_confidentiality_posture from this
          client's ShelterAdmission, DisclosureEvent and ProtectiveOrderCase rows.
        default: NORMAL
        constraints: NORMAL | HEIGHTENED | SEALED
      - name: current_danger_score
        type: number
        source: computed
        description: >
          danger_score of the RiskAssessment with the greatest created_at among assessments
          whose HotlineCall.client_id == this.id; null when none exists.
        default: null
      - name: current_risk_band
        type: enum
        source: computed
        description: risk_band of that same latest-by-created_at RiskAssessment; null when none exists.
        default: null
        constraints: LOW | MODERATE | ELEVATED | IMMINENT
      - name: protective_order_active
        type: boolean
        source: computed
        description: >
          True when COUNT(ProtectiveOrderCase WHERE client_id == this.id AND status IN
          {FILED, GRANTED}) >= 1.
        default: false
      - name: resource_referral_count
        type: integer
        source: computed
        description: COUNT(HotlineCall WHERE client_id == this.id AND status == RESOURCE_REFERRED).
        default: 0

  - name: HotlineCall
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: client_id
        type: string
        source: input
        description: FK -> Client.id; the survivor record this crisis call belongs to.
      - name: taken_by_staff_id
        type: string
        source: system
        description: FK -> StaffMember.id; copied from the X-User-ID header of the creating request.
      - name: caller_type
        type: enum
        source: input
        description: Who is on the line; PROFESSIONAL_REFERRAL callers can trigger mandated-reporting duties.
        constraints: SURVIVOR | FAMILY_MEMBER | PROFESSIONAL_REFERRAL
      - name: presenting_concerns
        type: string
        source: input
        description: Free-text summary of the presenting crisis.
        constraints: 1..2000 chars
      - name: received_at_utc
        type: datetime
        source: system
        description: Logical-clock reading at creation.
      - name: status
        type: enum
        source: system
        description: >
          RECEIVED at creation; RISK_ASSESSED after POST /hotline-calls/{id}/risk-assessments;
          one of SCREENING_REFERRED, SAFETY_PLAN_ONLY, RESOURCE_REFERRED after
          POST /hotline-calls/{id}/dispose. The three disposition states are terminal.
        default: RECEIVED
        constraints: RECEIVED | RISK_ASSESSED | SCREENING_REFERRED | SAFETY_PLAN_ONLY | RESOURCE_REFERRED
      - name: disposed_at
        type: datetime
        source: computed
        description: Logical-clock reading when dispose ran; null while status IN {RECEIVED, RISK_ASSESSED}.
        default: null

  - name: RiskAssessment
    parent: HotlineCall
    common_fields: false
    kind: event
    fields:
      - name: hotline_call_id
        type: string
        source: input
        description: FK -> HotlineCall.id; the call being assessed. Taken from the path segment.
      - name: weapon_access
        type: boolean
        source: input
        description: Abuser has access to a firearm or other weapon; 25 base points.
      - name: strangulation_history
        type: boolean
        source: input
        description: Prior non-fatal strangulation; 20 base points.
      - name: separation_recent
        type: boolean
        source: input
        description: Separation within the last 90 days; 15 base points.
      - name: threats_to_kill
        type: boolean
        source: input
        description: Explicit threats to kill the survivor, children or pets; 18 base points.
      - name: stalking_frequency_per_week
        type: integer
        source: input
        description: Stalking contacts per week; contributes 2 * min(value, 7) base points.
        constraints: 0..40
      - name: corroborate_with_history
        type: boolean
        source: input
        description: >
          Selects the calculation variant of lethality_danger_score. false -> INTAKE_SNAPSHOT,
          true -> CORROBORATED_REVIEW.
        default: false
      - name: variant_applied
        type: enum
        source: computed
        description: Variant of lethality_danger_score actually used for this row.
        constraints: INTAKE_SNAPSHOT | CORROBORATED_REVIEW
      - name: corroborating_fact_count
        type: integer
        source: computed
        description: >
          0 under INTAKE_SNAPSHOT. Under CORROBORATED_REVIEW, the count of the three
          corroborating facts enumerated in calculation lethality_danger_score.
        constraints: 0..3
      - name: base_subtotal
        type: number
        source: computed
        description: Weighted answer points plus 6 * corroborating_fact_count, before the escalation multiplier.
      - name: escalation_multiplier
        type: number
        source: computed
        description: 1.25 when weapon_access AND strangulation_history, 1.10 when exactly one holds, 1.00 when neither.
        constraints: one of 1.00 | 1.10 | 1.25
      - name: danger_score
        type: number
        source: computed
        description: min(100.0, round(base_subtotal * escalation_multiplier, 1)) with round_half_up.
      - name: risk_band
        type: enum
        source: computed
        description: IMMINENT when danger_score >= 75.0, ELEVATED when >= 50.0, MODERATE when >= 25.0, else LOW.
        constraints: LOW | MODERATE | ELEVATED | IMMINENT

  - name: SafetyPlan
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: client_id
        type: string
        source: input
        description: FK -> Client.id; the survivor this individualized plan belongs to.
      - name: based_on_risk_assessment_id
        type: string
        source: input
        description: FK -> RiskAssessment.id; the assessment whose risk_band drives the coverage uplift.
      - name: authored_by_staff_id
        type: string
        source: system
        description: FK -> StaffMember.id; copied from X-User-ID at creation and the only identity allowed to implement this plan's components.
      - name: superseded_by_plan_id
        type: string
        source: computed
        description: FK -> SafetyPlan.id; set on the older plan when a newer plan for the same client supersedes it. Null while this plan is the newest.
        default: null
      - name: status
        type: enum
        source: system
        description: >
          DRAFT at creation; ACTIVE after activate; UNDER_REVISION after revise or after the
          location-compromise cascade; ACTIVE again after reactivate; ARCHIVED when superseded.
        default: DRAFT
        constraints: DRAFT | ACTIVE | UNDER_REVISION | ARCHIVED
      - name: coverage_score
        type: number
        source: computed
        description: 0.00..11.10 index produced by calculation safety_plan_coverage_score; two decimals.
        default: 0.00
      - name: revision_count
        type: integer
        source: computed
        description: Incremented by one on every UNDER_REVISION -> ACTIVE reactivate transition.
        default: 0
      - name: archived_at
        type: datetime
        source: computed
        description: Logical-clock reading when this plan moved to ARCHIVED; null otherwise.
        default: null

  - name: PlanComponent
    parent: SafetyPlan
    common_fields: true
    kind: resource
    fields:
      - name: safety_plan_id
        type: string
        source: input
        description: FK -> SafetyPlan.id; owning plan. Taken from the path segment.
      - name: component_type
        type: enum
        source: input
        description: The safety-planning domain this component covers.
        constraints: RELOCATION | COMMUNICATION | TECHNOLOGY | WORKPLACE_NOTIFICATION; at most one row per (safety_plan_id, component_type)
      - name: detail
        type: string
        source: input
        description: The individualized step written for this domain.
        constraints: 1..2000 chars
      - name: target_completion_date
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) the component is meant to be in place by.
      - name: status
        type: enum
        source: system
        description: >
          DRAFT at creation; IMPLEMENTED after implement; REVIEW_REQUIRED when the
          location-compromise cascade touches an IMPLEMENTED row; BLOCKED when that cascade
          touches a DRAFT WORKPLACE_NOTIFICATION row; REVIEW_REQUIRED -> IMPLEMENTED allowed.
        default: DRAFT
        constraints: DRAFT | IMPLEMENTED | REVIEW_REQUIRED | BLOCKED
      - name: weight_effective
        type: number
        source: computed
        description: Base type weight from calculation safety_plan_coverage_score, multiplied by 1.2 for RELOCATION and TECHNOLOGY when the plan's client_risk_band is IMMINENT.
      - name: subscore
        type: number
        source: computed
        description: round(weight_effective * status_factor / 10, 2) with round_half_up; the per-component term of coverage_score.
        default: 0.00

  - name: Shelter
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: Internal facility name; never released in a COURT_SUBPOENA or HMIS_EXPORT disclosure.
        constraints: 1..120 chars
      - name: confidential_location
        type: boolean
        source: input
        description: True when the street address is suppressed agency-wide; required for clients whose confidentiality_posture IN {HEIGHTENED, SEALED}.
        default: true
      - name: nightly_rate_cents
        type: integer
        source: input
        description: Per-night base rate charged to the agency's shelter grant.
        constraints: 1000..100000
      - name: weekend_surcharge_cents
        type: integer
        source: input
        description: Extra cents added for any night whose start date falls on Friday or Saturday.
        default: 0
        constraints: 0..50000
      - name: child_supplement_cents
        type: integer
        source: input
        description: Extra cents per minor child per night (children's programming supplement).
        default: 0
        constraints: 0..50000
      - name: total_bed_capacity
        type: integer
        source: computed
        description: SUM(ShelterUnit.bed_capacity) over units WHERE shelter_id == this.id (all unit statuses included).
        default: 0
      - name: available_beds
        type: integer
        source: computed
        description: SUM(ShelterUnit.available_beds) over units WHERE shelter_id == this.id.
        default: 0
      - name: capacity_posture
        type: enum
        source: computed
        description: >
          FULL when available_beds == 0; NEAR_CAPACITY when 0 < available_beds <=
          ceil(0.20 * total_bed_capacity); OPEN otherwise. A shelter with zero units is FULL.
        default: FULL
        constraints: OPEN | NEAR_CAPACITY | FULL
      - name: settled_revenue_cents
        type: integer
        source: computed
        description: Running SUM(ShelterAdmission.settled_stay_cost_cents) over admissions in this shelter WHERE occupancy_status == EXITED.
        default: 0

  - name: ShelterUnit
    parent: Shelter
    common_fields: true
    kind: resource
    fields:
      - name: shelter_id
        type: string
        source: input
        description: FK -> Shelter.id; owning facility. Taken from the path segment.
      - name: unit_label
        type: string
        source: input
        description: Room or apartment label.
        constraints: unique within a shelter_id; 1..20 chars
      - name: unit_type
        type: enum
        source: input
        description: >
          Accessibility and family-composition class. ADA_ACCESSIBLE satisfies both
          accessibility_required and minor-children placement; FAMILY_SUITE satisfies only
          minor-children placement; STANDARD satisfies neither.
        constraints: STANDARD | ADA_ACCESSIBLE | FAMILY_SUITE
      - name: bed_capacity
        type: integer
        source: input
        description: Physical beds in the unit.
        constraints: 1..8
      - name: reserved_beds
        type: integer
        source: computed
        description: SUM(ShelterAdmission.household_size) over admissions WHERE shelter_unit_id == this.id AND occupancy_status == RESERVED.
        default: 0
      - name: occupied_beds
        type: integer
        source: computed
        description: SUM(ShelterAdmission.household_size) over admissions WHERE shelter_unit_id == this.id AND occupancy_status == CHECKED_IN.
        default: 0
      - name: available_beds
        type: integer
        source: computed
        description: bed_capacity - reserved_beds - occupied_beds.
        default: 0
      - name: status
        type: enum
        source: system
        description: >
          OCCUPIED when occupied_beds > 0; HOLD when occupied_beds == 0 AND reserved_beds > 0;
          AVAILABLE when both are 0. Recomputed by calculation unit_bed_ledger.
        default: AVAILABLE
        constraints: AVAILABLE | HOLD | OCCUPIED

  - name: ScreeningRequest
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: client_id
        type: string
        source: input
        description: FK -> Client.id; household being screened for shelter.
      - name: hotline_call_id
        type: string
        source: input
        description: FK -> HotlineCall.id; the assessed call that generated this screening.
      - name: requested_shelter_id
        type: string
        source: input
        description: FK -> Shelter.id; the facility screened against.
      - name: created_by_staff_id
        type: string
        source: system
        description: FK -> StaffMember.id; X-User-ID of the creator (or of the disposing advocate when auto-created by dispose). May not decide this request.
      - name: assigned_advocate_id
        type: string
        source: system
        description: FK -> StaffMember.id; advocate carrying this case, set by decide for decisions APPROVED and WAITLISTED. Null while PENDING or DENIED.
        default: null
      - name: offered_shelter_unit_id
        type: string
        source: computed
        description: FK -> ShelterUnit.id; unit offered by the waitlist-promotion cascade. Null unless promoted_from_waitlist is true.
        default: null
      - name: household_size
        type: integer
        source: input
        description: Household size screened; defaults to the Client's household_size when omitted.
        constraints: 1..12
      - name: minor_children_count
        type: integer
        source: input
        description: Minor children screened; defaults to the Client's minor_children_count when omitted.
        constraints: 0..10
      - name: accessibility_required
        type: boolean
        source: input
        description: ADA requirement for this screening; defaults to the Client's accessibility_required when omitted.
        default: false
      - name: requested_entry_date
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) the household needs a bed; also the waitlist-expiry anchor.
      - name: status
        type: enum
        source: system
        description: >
          PENDING at creation; APPROVED, DENIED or WAITLISTED after decide; WAITLISTED ->
          APPROVED via the waitlist-promotion cascade; WAITLISTED -> EXPIRED via the clock
          checkpoint; APPROVED -> ADMITTED when a ShelterAdmission is created against it.
        default: PENDING
        constraints: PENDING | APPROVED | DENIED | WAITLISTED | ADMITTED | EXPIRED
      - name: waitlist_position
        type: integer
        source: computed
        description: >
          1 + COUNT(ScreeningRequest WHERE requested_shelter_id == this.requested_shelter_id
          AND status == WAITLISTED AND created_at < this.created_at). Null unless status == WAITLISTED.
        default: null
      - name: promoted_from_waitlist
        type: boolean
        source: computed
        description: True when this request reached APPROVED through the waitlist-promotion cascade rather than through decide.
        default: false
      - name: denial_reason
        type: string
        source: input
        description: Reason recorded by decide when decision == DENIED; null otherwise.
        default: null
      - name: decided_at
        type: datetime
        source: computed
        description: Logical-clock reading of the transition out of PENDING or WAITLISTED; null while PENDING.
        default: null

  - name: ShelterAdmission
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: screening_request_id
        type: string
        source: input
        description: FK -> ScreeningRequest.id; the APPROVED screening this admission consumes.
      - name: client_id
        type: string
        source: computed
        description: FK -> Client.id; copied from the screening request at creation.
      - name: shelter_unit_id
        type: string
        source: input
        description: FK -> ShelterUnit.id; unit the household occupies.
      - name: shelter_id
        type: string
        source: computed
        description: FK -> Shelter.id; copied from the unit's shelter_id at creation.
      - name: prior_unit_id
        type: string
        source: computed
        description: FK -> ShelterUnit.id; unit vacated by complete-relocation. Null until a relocation runs.
        default: null
      - name: household_size
        type: integer
        source: computed
        description: Copied from ScreeningRequest.household_size at creation; the quantity charged against unit beds.
      - name: minor_children_count
        type: integer
        source: computed
        description: Copied from ScreeningRequest.minor_children_count at creation; drives the child supplement and school-enrollment duty.
      - name: entry_date
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) the stay window opens; inclusive.
      - name: planned_exit_date
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) the stay window closes; exclusive. Must be strictly after entry_date.
      - name: actual_exit_date
        type: string
        source: input
        description: ISO 8601 date supplied by exit; exclusive end of the settled window. Null until EXITED.
        default: null
      - name: occupancy_status
        type: enum
        source: system
        description: >
          Dimension 1 of two independent dimensions. RESERVED at creation; CHECKED_IN after
          check-in; EXITED after exit; CANCELLED after cancel. EXITED and CANCELLED are terminal.
        default: RESERVED
        constraints: RESERVED | CHECKED_IN | EXITED | CANCELLED
      - name: location_security_status
        type: enum
        source: system
        description: >
          Dimension 2 of two independent dimensions, evolving without regard to
          occupancy_status. SECURE at creation; COMPROMISED after
          report-location-compromise; RELOCATED after complete-relocation.
        default: SECURE
        constraints: SECURE | COMPROMISED | RELOCATED
      - name: compromise_source
        type: enum
        source: input
        description: How the confidential location leaked; recorded by report-location-compromise. Null while SECURE.
        default: null
        constraints: ABUSER_CONTACT | DATA_BREACH | COURT_FILING | SOCIAL_MEDIA
      - name: school_enrollment_status
        type: enum
        source: system
        description: >
          NOT_APPLICABLE when minor_children_count == 0 at creation; otherwise PENDING at
          creation and ENROLLED when check-in is called with school_enrollment_confirmed true.
        default: NOT_APPLICABLE
        constraints: NOT_APPLICABLE | PENDING | ENROLLED
      - name: projected_stay_cost_cents
        type: integer
        source: computed
        description: PROJECTED variant of calculation shelter_stay_cost, computed once at creation from entry_date and planned_exit_date.
      - name: settled_stay_cost_cents
        type: integer
        source: computed
        description: SETTLED variant of calculation shelter_stay_cost, computed at exit from entry_date and actual_exit_date. Null until EXITED.
        default: null
      - name: exit_destination
        type: enum
        source: input
        description: Where the household went; recorded by exit.
        default: null
        constraints: PERMANENT_HOUSING | TRANSITIONAL_HOUSING | FAMILY_FRIENDS | UNKNOWN
      - name: cancel_reason
        type: string
        source: input
        description: Reason recorded by cancel; null unless occupancy_status == CANCELLED.
        default: null

  - name: ProtectiveOrderCase
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: client_id
        type: string
        source: input
        description: FK -> Client.id; petitioner.
      - name: accompanying_advocate_id
        type: string
        source: input
        description: FK -> StaffMember.id; advocate committed to court accompaniment for the scheduled hearing. Null while PETITION_DRAFTED.
        default: null
      - name: order_type
        type: enum
        source: input
        description: Relief sought.
        constraints: EMERGENCY_EX_PARTE | FULL_ORDER | MODIFICATION
      - name: status
        type: enum
        source: system
        description: >
          PETITION_DRAFTED at creation; FILED after file; GRANTED after record-outcome with
          outcome GRANTED; back to PETITION_DRAFTED after record-outcome with outcome DENIED
          while refile_count < 2; DENIED_FINAL once refile_count == 2 and outcome is DENIED.
        default: PETITION_DRAFTED
        constraints: PETITION_DRAFTED | FILED | GRANTED | DENIED_FINAL
      - name: filed_court
        type: string
        source: input
        description: Court of filing recorded by file; null while never filed.
        default: null
      - name: hearing_start_utc
        type: datetime
        source: input
        description: Inclusive start of the hearing window recorded by file; null while never filed.
        default: null
      - name: hearing_end_utc
        type: datetime
        source: input
        description: Inclusive end of the hearing window recorded by file; must be strictly after hearing_start_utc.
        default: null
      - name: refile_count
        type: integer
        source: computed
        description: Number of DENIED outcomes already absorbed by this case; 0, 1 or 2.
        default: 0
      - name: outcome_recorded_at
        type: datetime
        source: computed
        description: Logical-clock reading of the most recent record-outcome call; null until one runs.
        default: null

  - name: LandlordPartner
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: Landlord or property-management partner name.
        constraints: 1..120 chars
      - name: units_pledged
        type: integer
        source: input
        description: Units the partner has pledged to the agency's rapid-rehousing and transitional-housing pool.
        constraints: 1..50
      - name: accepts_subsidy_type
        type: enum
        source: input
        description: Subsidy the partner accepts; a referral whose subsidy_type differs is rejected at creation.
        constraints: HOUSING_CHOICE_VOUCHER | RAPID_REHOUSING_SUBSIDY | NONE
      - name: base_incentive_cents
        type: integer
        source: input
        description: Landlord-engagement incentive before the tier multiplier and program bonus.
        constraints: 0..500000
      - name: units_committed
        type: integer
        source: computed
        description: COUNT(HousingReferral WHERE landlord_partner_id == this.id AND status IN {MATCHED, LEASED}).
        default: 0
      - name: units_available
        type: integer
        source: computed
        description: units_pledged - units_committed.
        default: 0
      - name: engagement_score
        type: number
        source: computed
        description: round(100 * units_committed / units_pledged, 1) with round_half_up; 0.0 when units_pledged == 0.
        default: 0.0
      - name: incentive_tier
        type: enum
        source: computed
        description: Tier of the current engagement_score - PLATINUM >= 60.0, GOLD >= 30.0, SILVER >= 10.0, else BASE.
        default: BASE
        constraints: BASE | SILVER | GOLD | PLATINUM
      - name: incentive_accrued_cents
        type: integer
        source: computed
        description: SUM(HousingReferral.incentive_fee_cents) over referrals WHERE landlord_partner_id == this.id AND status IN {MATCHED, LEASED}.
        default: 0

  - name: HousingReferral
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: client_id
        type: string
        source: input
        description: FK -> Client.id; household referred to housing.
      - name: landlord_partner_id
        type: string
        source: input
        description: FK -> LandlordPartner.id; partner whose pledged pool this referral draws from.
      - name: created_by_staff_id
        type: string
        source: system
        description: FK -> StaffMember.id; X-User-ID of the housing specialist who created the referral.
      - name: program_type
        type: enum
        source: input
        description: RAPID_REHOUSING adds a 15000-cent bonus to the incentive fee; TRANSITIONAL_HOUSING adds 0.
        constraints: TRANSITIONAL_HOUSING | RAPID_REHOUSING
      - name: subsidy_type
        type: enum
        source: input
        description: Subsidy attached to the referral; must equal the partner's accepts_subsidy_type.
        constraints: HOUSING_CHOICE_VOUCHER | RAPID_REHOUSING_SUBSIDY | NONE
      - name: status
        type: enum
        source: system
        description: >
          SUBMITTED at creation; MATCHED after match; back to SUBMITTED after
          withdraw-match; LEASED after lease; REJECTED when the safety-plan-suspension
          cascade closes it. LEASED and REJECTED are terminal.
        default: SUBMITTED
        constraints: SUBMITTED | MATCHED | REJECTED | LEASED
      - name: monthly_rent_cents
        type: integer
        source: input
        description: Contract rent recorded by match; null while SUBMITTED.
        default: null
      - name: incentive_fee_cents
        type: integer
        source: computed
        description: Fee locked by calculation landlord_engagement_incentive at match; reversed to null by withdraw-match and by the cascade rejection.
        default: null
      - name: incentive_tier_applied
        type: enum
        source: computed
        description: Tier selected from the partner's pre-commit engagement_score at match; null while no fee is locked.
        default: null
        constraints: BASE | SILVER | GOLD | PLATINUM
      - name: rejection_reason
        type: enum
        source: computed
        description: Reason the cascade or the specialist closed the referral; null unless status == REJECTED.
        default: null
        constraints: SAFETY_PLAN_SUSPENDED | LANDLORD_WITHDREW | CLIENT_DECLINED
      - name: lease_start_date
        type: string
        source: input
        description: ISO 8601 date recorded by lease; null unless status == LEASED.
        default: null
      - name: withdraw_count
        type: integer
        source: computed
        description: Number of completed MATCHED -> SUBMITTED withdraw-match transitions on this referral.
        default: 0

  - name: DisclosureEvent
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: client_id
        type: string
        source: input
        description: FK -> Client.id; survivor whose confidential record is at stake.
      - name: requested_by_staff_id
        type: string
        source: input
        description: FK -> StaffMember.id; staff member who logged the request. May not decide it.
      - name: decided_by_staff_id
        type: string
        source: system
        description: FK -> StaffMember.id; X-User-ID of the privacy officer who decided. Null while REQUESTED.
        default: null
      - name: kind
        type: enum
        source: input
        description: >
          Switches the entire rule set - PARTNER_AGENCY and COURT_SUBPOENA need an unexpired
          release of information, HMIS_EXPORT needs GRANTED consent and allows only the
          HMIS-allowed key set, MANDATED_REPORT needs no release but carries a 24-hour
          decision deadline and may never be denied.
        constraints: PARTNER_AGENCY | COURT_SUBPOENA | HMIS_EXPORT | MANDATED_REPORT
      - name: requester_org
        type: string
        source: input
        description: Organization asking for information, or the mandated-report recipient agency.
        constraints: 1..120 chars
      - name: requested_field_keys
        type: array
        source: input
        description: Field keys the requester asked for; each element is one of the ten keys enumerated in calculation disclosure_field_projection.
        constraints: 1..10 elements, no duplicates
      - name: roi_signed_on
        type: string
        source: input
        description: ISO 8601 date the survivor signed the release of information; null when no release exists.
        default: null
      - name: roi_expires_on
        type: string
        source: input
        description: ISO 8601 date the release lapses; compared against the logical clock date at decide time.
        default: null
      - name: status
        type: enum
        source: system
        description: REQUESTED at creation; RELEASED, PARTIALLY_RELEASED or DENIED after decide. All three decision states are terminal.
        default: REQUESTED
        constraints: REQUESTED | RELEASED | PARTIALLY_RELEASED | DENIED
      - name: released_field_keys
        type: array
        source: computed
        description: Keys actually released, produced by calculation disclosure_field_projection. Empty array while REQUESTED and after DENIED.
        default: []
      - name: suppressed_field_keys
        type: array
        source: computed
        description: Requested keys withheld, produced by calculation disclosure_field_projection. Empty array while REQUESTED.
        default: []
      - name: decision_deadline_utc
        type: datetime
        source: computed
        description: created_at + 24 hours when kind == MANDATED_REPORT; null for every other kind.
        default: null
      - name: decided_at
        type: datetime
        source: computed
        description: Logical-clock reading at decide; null while REQUESTED.
        default: null
      - name: late_filed
        type: boolean
        source: computed
        description: True when kind == MANDATED_REPORT AND decided_at > decision_deadline_utc; false at exactly the deadline.
        default: false
      - name: denial_reason
        type: string
        source: input
        description: Reason recorded by decide when decision == DENIED; null otherwise.
        default: null


# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: HotlineCall
    field: status
    shape: branching_fork_with_divergent_side_effects
    initial_state: RECEIVED
    terminal_states: [SCREENING_REFERRED, SAFETY_PLAN_ONLY, RESOURCE_REFERRED]
    transitions:
      - from: RECEIVED
        to: RISK_ASSESSED
        trigger: "POST /hotline-calls/{id}/risk-assessments"
        actor: HotlineAdvocate
        preconditions:
          - "HotlineCall.status == RECEIVED"
        side_effects:
          - "Creates one RiskAssessment row; calculation lethality_danger_score fills variant_applied, corroborating_fact_count, base_subtotal, escalation_multiplier, danger_score and risk_band."
          - "Recomputes Client.current_danger_score and Client.current_risk_band from the assessment with the greatest created_at for that client."
          - "Recomputes Client.confidentiality_posture via calculation client_confidentiality_posture (risk_band IMMINENT lifts NORMAL to HEIGHTENED)."
          - "Increments Client.version and HotlineCall.version by 1 each."
        note: "A second risk assessment on the same call is rejected because status is no longer RECEIVED."

      - from: RISK_ASSESSED
        to: SCREENING_REFERRED
        trigger: "POST /hotline-calls/{id}/dispose with disposition == SCREENING_REFERRED"
        actor: HotlineAdvocate
        preconditions:
          - "HotlineCall.status == RISK_ASSESSED"
          - "requested_shelter_id is present in the body and names an existing Shelter"
          - "requested_entry_date is present in the body"
        side_effects:
          - "Branch-exclusive: creates one ScreeningRequest with status PENDING, client_id = HotlineCall.client_id, hotline_call_id = this call, requested_shelter_id and requested_entry_date from the body, household_size / minor_children_count / accessibility_required copied from the Client row, created_by_staff_id = X-User-ID."
          - "Sets HotlineCall.disposed_at to the logical clock reading."
          - "Sets Client.status to ACTIVE when it was INTAKE."
          - "Increments Client.version by 1 and HotlineCall.version by 1."
        note: "Divergent branch A of three: the only branch that creates a ScreeningRequest."

      - from: RISK_ASSESSED
        to: SAFETY_PLAN_ONLY
        trigger: "POST /hotline-calls/{id}/dispose with disposition == SAFETY_PLAN_ONLY"
        actor: HotlineAdvocate
        preconditions:
          - "HotlineCall.status == RISK_ASSESSED"
        side_effects:
          - "Branch-exclusive: creates one SafetyPlan with status DRAFT, client_id = HotlineCall.client_id, based_on_risk_assessment_id = the RiskAssessment of this call with the greatest created_at, authored_by_staff_id = X-User-ID, coverage_score 0.00, revision_count 0."
          - "Applies the supersede rule: every other SafetyPlan of the same client whose status IN {DRAFT, ACTIVE, UNDER_REVISION} moves to ARCHIVED with archived_at set to the clock reading and superseded_by_plan_id set to the new plan's id."
          - "Sets HotlineCall.disposed_at to the logical clock reading."
          - "Sets Client.status to ACTIVE when it was INTAKE."
          - "Increments Client.version by 1 and HotlineCall.version by 1."
        note: "Divergent branch B of three: the only branch that creates a SafetyPlan; no ScreeningRequest is created."

      - from: RISK_ASSESSED
        to: RESOURCE_REFERRED
        trigger: "POST /hotline-calls/{id}/dispose with disposition == RESOURCE_REFERRED"
        actor: HotlineAdvocate
        preconditions:
          - "HotlineCall.status == RISK_ASSESSED"
          - "Client.current_risk_band != IMMINENT (a warm hand-off may not close an imminent-danger call)"
        side_effects:
          - "Branch-exclusive: creates no child row at all; only recomputes Client.resource_referral_count as COUNT(HotlineCall WHERE client_id == this client AND status == RESOURCE_REFERRED)."
          - "Sets HotlineCall.disposed_at to the logical clock reading."
          - "Sets Client.status to ACTIVE when it was INTAKE."
          - "Increments Client.version by 1 and HotlineCall.version by 1."
        note: "Divergent branch C of three: no child row, and the only branch carrying a risk-band precondition."

  - entity: Client
    field: status
    shape: linear_with_derived_posture_overlay
    initial_state: INTAKE
    terminal_states: [EXITED]
    transitions:
      - from: INTAKE
        to: ACTIVE
        trigger: "POST /hotline-calls/{id}/dispose (any of the three dispositions)"
        actor: HotlineAdvocate
        preconditions:
          - "Client.status == INTAKE"
        side_effects:
          - "Increments Client.version by 1."
      - from: ACTIVE
        to: EXITED
        trigger: "POST /housing-referrals/{id}/lease"
        actor: HousingSpecialist
        preconditions:
          - "Client.status == ACTIVE"
          - "HousingReferral.status == MATCHED"
        side_effects:
          - "Sets HousingReferral.status to LEASED and lease_start_date from the body."
          - "Increments Client.version and HousingReferral.version by 1 each."
    note: >
      confidentiality_posture is an independent derived overlay, not part of this status chain:
      calculation client_confidentiality_posture re-derives it after every mutation of the
      client's RiskAssessment, ShelterAdmission, ProtectiveOrderCase and DisclosureEvent rows,
      in any status including EXITED.

  - entity: SafetyPlan
    field: status
    shape: cyclic_revision_loop
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /safety-plans/{id}/activate"
        actor: HotlineAdvocate
        preconditions:
          - "SafetyPlan.status == DRAFT"
          - "COUNT(PlanComponent WHERE safety_plan_id == this plan) >= 1"
        side_effects:
          - "Recomputes coverage_score via calculation safety_plan_coverage_score."
          - "Increments SafetyPlan.version by 1."
      - from: ACTIVE
        to: UNDER_REVISION
        trigger: "POST /safety-plans/{id}/revise, or link 3 of the location-compromise cascade"
        actor: HotlineAdvocate | system
        preconditions:
          - "SafetyPlan.status == ACTIVE"
        side_effects:
          - "On the cascade path only (link 4): every HousingReferral of the same client whose status IN {SUBMITTED, MATCHED} moves to REJECTED with rejection_reason SAFETY_PLAN_SUSPENDED."
          - "Recomputes coverage_score via calculation safety_plan_coverage_score after the component statuses settle."
          - "Increments SafetyPlan.version by 1."
      - from: UNDER_REVISION
        to: ACTIVE
        trigger: "POST /safety-plans/{id}/reactivate"
        actor: HotlineAdvocate
        preconditions:
          - "SafetyPlan.status == UNDER_REVISION"
          - "COUNT(PlanComponent WHERE safety_plan_id == this plan AND status == BLOCKED) == 0"
        side_effects:
          - "Increments revision_count by 1."
          - "Recomputes coverage_score via calculation safety_plan_coverage_score."
          - "Increments SafetyPlan.version by 1."
        note: "Closes the cycle ACTIVE -> UNDER_REVISION -> ACTIVE; the loop may run any number of times and revision_count records how many."
      - from: DRAFT
        to: ARCHIVED
        trigger: "POST /safety-plans, or the SAFETY_PLAN_ONLY dispose branch, creating a newer plan for the same client"
        actor: HotlineAdvocate | system
        preconditions:
          - "SafetyPlan.status == DRAFT"
          - "A newer SafetyPlan row for the same client_id has just been created"
        side_effects:
          - "Sets archived_at to the clock reading and superseded_by_plan_id to the newer plan's id."
          - "Increments SafetyPlan.version by 1."
      - from: ACTIVE
        to: ARCHIVED
        trigger: "POST /safety-plans, or the SAFETY_PLAN_ONLY dispose branch, creating a newer plan for the same client"
        actor: HotlineAdvocate | system
        preconditions:
          - "SafetyPlan.status == ACTIVE"
          - "A newer SafetyPlan row for the same client_id has just been created"
        side_effects:
          - "Sets archived_at to the clock reading and superseded_by_plan_id to the newer plan's id."
          - "Every HousingReferral of the same client whose status IN {SUBMITTED, MATCHED} moves to REJECTED with rejection_reason SAFETY_PLAN_SUSPENDED, because the client no longer has an ACTIVE plan."
          - "Increments SafetyPlan.version by 1."
      - from: UNDER_REVISION
        to: ARCHIVED
        trigger: "POST /safety-plans, or the SAFETY_PLAN_ONLY dispose branch, creating a newer plan for the same client"
        actor: HotlineAdvocate | system
        preconditions:
          - "SafetyPlan.status == UNDER_REVISION"
          - "A newer SafetyPlan row for the same client_id has just been created"
        side_effects:
          - "Sets archived_at to the clock reading and superseded_by_plan_id to the newer plan's id."
          - "Increments SafetyPlan.version by 1."

  - entity: PlanComponent
    field: status
    shape: cyclic_with_conditional_cascade_entry
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: IMPLEMENTED
        trigger: "POST /safety-plans/{id}/components/{component_id}/implement"
        actor: HotlineAdvocate
        preconditions:
          - "PlanComponent.status == DRAFT"
          - "SafetyPlan.status IN {DRAFT, ACTIVE, UNDER_REVISION}"
          - "X-User-ID == SafetyPlan.authored_by_staff_id"
        side_effects:
          - "Recomputes this row's weight_effective and subscore and the owning plan's coverage_score via calculation safety_plan_coverage_score."
          - "Increments PlanComponent.version and SafetyPlan.version by 1 each."
      - from: IMPLEMENTED
        to: REVIEW_REQUIRED
        trigger: "link 3 of the location-compromise cascade, conditional on this row's status"
        actor: system
        preconditions:
          - "PlanComponent.status == IMPLEMENTED"
          - "The owning SafetyPlan.status == ACTIVE and its client just became SEALED"
        side_effects:
          - "Recomputes subscore (status factor drops from 1.000 to 0.175) and the plan's coverage_score."
          - "Increments PlanComponent.version by 1."
      - from: DRAFT
        to: BLOCKED
        trigger: "link 3 of the location-compromise cascade, conditional on component_type"
        actor: system
        preconditions:
          - "PlanComponent.status == DRAFT AND component_type == WORKPLACE_NOTIFICATION"
          - "The owning SafetyPlan.status == ACTIVE and its client just became SEALED"
        side_effects:
          - "Recomputes subscore (status factor 0.000) and the plan's coverage_score."
          - "Increments PlanComponent.version by 1."
        note: "Conditional cascade: DRAFT rows of the other three component types stay at DRAFT and keep factor 0.350."
      - from: REVIEW_REQUIRED
        to: IMPLEMENTED
        trigger: "POST /safety-plans/{id}/components/{component_id}/implement"
        actor: HotlineAdvocate
        preconditions:
          - "PlanComponent.status == REVIEW_REQUIRED"
          - "X-User-ID == SafetyPlan.authored_by_staff_id"
        side_effects:
          - "Recomputes subscore and the plan's coverage_score."
          - "Increments PlanComponent.version and SafetyPlan.version by 1 each."
        note: "Closes the component cycle DRAFT -> IMPLEMENTED -> REVIEW_REQUIRED -> IMPLEMENTED."
      - from: BLOCKED
        to: IMPLEMENTED
        trigger: "POST /safety-plans/{id}/components/{component_id}/implement"
        actor: HotlineAdvocate
        preconditions:
          - "PlanComponent.status == BLOCKED"
          - "Client.confidentiality_posture != SEALED for the plan's client"
          - "X-User-ID == SafetyPlan.authored_by_staff_id"
        side_effects:
          - "Recomputes subscore and the plan's coverage_score."
          - "Increments PlanComponent.version and SafetyPlan.version by 1 each."
        note: "The BLOCKED exit is gated on the client leaving SEALED, which only complete-relocation can achieve."

  - entity: ShelterUnit
    field: status
    shape: compound_derived_from_children
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: HOLD
        trigger: "POST /shelter-admissions (a RESERVED admission is created against this unit)"
        actor: ShelterManager
        preconditions:
          - "After the child change, calculation unit_bed_ledger yields occupied_beds == 0 AND reserved_beds > 0"
        side_effects:
          - "Recomputes reserved_beds, occupied_beds and available_beds via calculation unit_bed_ledger."
          - "Recomputes Shelter.available_beds and Shelter.capacity_posture."
          - "Increments ShelterUnit.version and Shelter.version by 1 each."
        note: "Status is never written by a client; it is always re-derived from the unit's ShelterAdmission children."
      - from: HOLD
        to: OCCUPIED
        trigger: "POST /shelter-admissions/{id}/check-in"
        actor: ShelterManager
        preconditions:
          - "After the child change, calculation unit_bed_ledger yields occupied_beds > 0"
        side_effects:
          - "Moves the household's beds from reserved_beds to occupied_beds and recomputes available_beds."
          - "Recomputes Shelter.available_beds and Shelter.capacity_posture."
          - "Increments ShelterUnit.version and Shelter.version by 1 each."
      - from: HOLD
        to: AVAILABLE
        trigger: "POST /shelter-admissions/{id}/cancel (the last RESERVED admission on the unit is withdrawn)"
        actor: ShelterManager
        preconditions:
          - "After the child change, calculation unit_bed_ledger yields reserved_beds == 0 AND occupied_beds == 0"
        side_effects:
          - "Recomputes the three bed counters; the compensating invariant bed_capacity == available_beds + reserved_beds + occupied_beds holds again with available_beds == bed_capacity."
          - "Recomputes Shelter.available_beds and Shelter.capacity_posture."
          - "Increments ShelterUnit.version and Shelter.version by 1 each."
      - from: AVAILABLE
        to: OCCUPIED
        trigger: "POST /shelter-admissions/{id}/complete-relocation naming this unit while the admission is CHECKED_IN"
        actor: ShelterManager
        preconditions:
          - "After the child change, calculation unit_bed_ledger yields occupied_beds > 0"
        side_effects:
          - "Recomputes the three bed counters for this unit and for the vacated prior_unit_id."
          - "Recomputes Shelter.available_beds and Shelter.capacity_posture for both shelters involved."
          - "Increments ShelterUnit.version for both units and Shelter.version by 1 each."
      - from: OCCUPIED
        to: AVAILABLE
        trigger: "POST /shelter-admissions/{id}/exit, or POST /shelter-admissions/{id}/complete-relocation vacating this unit"
        actor: ShelterManager
        preconditions:
          - "After the child change, calculation unit_bed_ledger yields occupied_beds == 0 AND reserved_beds == 0"
        side_effects:
          - "Recomputes the three bed counters; the compensating invariant is restored with available_beds == bed_capacity."
          - "Recomputes Shelter.available_beds and Shelter.capacity_posture."
          - "On the exit path, link 3 of the exit cascade runs waitlist promotion for this unit."
          - "Increments ShelterUnit.version and Shelter.version by 1 each."
      - from: OCCUPIED
        to: HOLD
        trigger: "POST /shelter-admissions/{id}/exit on a unit that still carries a RESERVED admission"
        actor: ShelterManager
        preconditions:
          - "After the child change, calculation unit_bed_ledger yields occupied_beds == 0 AND reserved_beds > 0"
        side_effects:
          - "Recomputes the three bed counters."
          - "Recomputes Shelter.available_beds and Shelter.capacity_posture."
          - "Increments ShelterUnit.version and Shelter.version by 1 each."

  - entity: ScreeningRequest
    field: status
    shape: branching_with_promotion_and_expiry
    initial_state: PENDING
    terminal_states: [DENIED, EXPIRED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /screening-requests/{id}/decide with decision == APPROVE"
        actor: ShelterManager
        preconditions:
          - "ScreeningRequest.status == PENDING"
          - "X-User-ID != ScreeningRequest.created_by_staff_id (segregation of duties)"
          - "assigned_advocate_id is present in the body and names a StaffMember whose wellness_posture != FROZEN"
          - "The requested Shelter's capacity_posture != FULL"
        side_effects:
          - "Sets assigned_advocate_id from the body and decided_at to the clock reading; leaves waitlist_position null."
          - "Recomputes that advocate's active_caseload_count, secondary_trauma_index and wellness_posture via calculation staff_caseload_and_trauma_index."
          - "Increments ScreeningRequest.version and StaffMember.version by 1 each."
      - from: PENDING
        to: DENIED
        trigger: "POST /screening-requests/{id}/decide with decision == DENY"
        actor: ShelterManager
        preconditions:
          - "ScreeningRequest.status == PENDING"
          - "X-User-ID != ScreeningRequest.created_by_staff_id (segregation of duties)"
          - "denial_reason is present in the body"
        side_effects:
          - "Sets denial_reason and decided_at; assigned_advocate_id stays null and no caseload anywhere changes."
          - "Increments ScreeningRequest.version by 1."
      - from: PENDING
        to: WAITLISTED
        trigger: "POST /screening-requests/{id}/decide with decision == WAITLIST"
        actor: ShelterManager
        preconditions:
          - "ScreeningRequest.status == PENDING"
          - "X-User-ID != ScreeningRequest.created_by_staff_id (segregation of duties)"
          - "assigned_advocate_id is present in the body and names a StaffMember whose wellness_posture != FROZEN"
        side_effects:
          - "Sets assigned_advocate_id and decided_at, and computes waitlist_position as 1 + COUNT(ScreeningRequest WHERE requested_shelter_id == this.requested_shelter_id AND status == WAITLISTED AND created_at < this.created_at)."
          - "Does not change any active_caseload_count: WAITLISTED is outside the counted status set {APPROVED, ADMITTED}."
          - "Increments ScreeningRequest.version by 1."
      - from: WAITLISTED
        to: APPROVED
        trigger: "link 3 of POST /shelter-admissions/{id}/exit (automatic waitlist promotion)"
        actor: system
        preconditions:
          - "ScreeningRequest.status == WAITLISTED"
          - "requested_shelter_id == the freed ShelterUnit's shelter_id"
          - "household_size <= the freed unit's available_beds after the ledger recompute"
          - "accessibility_required == false OR the freed unit's unit_type == ADA_ACCESSIBLE"
          - "minor_children_count == 0 OR the freed unit's unit_type IN {ADA_ACCESSIBLE, FAMILY_SUITE}"
          - "The request's assigned_advocate_id names a StaffMember whose wellness_posture != FROZEN"
        selector:
          eligibility_filter: "Every WAITLISTED ScreeningRequest row satisfying all six preconditions above."
          ranking: "Client.current_risk_band DESC by the fixed order IMMINENT > ELEVATED > MODERATE > LOW, then requested_entry_date ASC, then created_at ASC."
          tie_break: "created_at ASC (total and final)."
          empty_pool_fallback: "No promotion occurs, no error is raised, and the exit still returns 200."
          selected_count: 1
        side_effects:
          - "Sets promoted_from_waitlist to true, offered_shelter_unit_id to the freed unit, decided_at to the clock reading, and clears waitlist_position to null."
          - "Link 4: recomputes the assigned advocate's active_caseload_count, secondary_trauma_index and wellness_posture; an index of 39.0 becomes 41.5, flipping OPEN to RESTRICTED."
          - "Recomputes waitlist_position for every remaining WAITLISTED request of the same shelter."
          - "Increments ScreeningRequest.version for the promoted and the renumbered rows, and StaffMember.version, by 1 each."
      - from: WAITLISTED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "ScreeningRequest.status == WAITLISTED"
          - "The new clock reading is strictly greater than requested_entry_date + 14 days at 00:00:00Z"
        side_effects:
          - "Clears waitlist_position to null and counts into the response field expired_screening_request_count."
          - "Recomputes waitlist_position for every remaining WAITLISTED request of the same shelter."
          - "Increments ScreeningRequest.version by 1 for every row touched."
      - from: APPROVED
        to: ADMITTED
        trigger: "POST /shelter-admissions"
        actor: ShelterManager
        preconditions:
          - "ScreeningRequest.status == APPROVED"
          - "No other ShelterAdmission exists for this screening_request_id whose occupancy_status != CANCELLED"
        side_effects:
          - "Creates the ShelterAdmission with occupancy_status RESERVED and location_security_status SECURE."
          - "Recomputes the target ShelterUnit's bed ledger and status, and the Shelter's counters."
          - "Increments ScreeningRequest.version by 1."
        note: "The placement lifecycle continues on ShelterAdmission once the request is ADMITTED."
      - from: ADMITTED
        to: APPROVED
        trigger: "POST /shelter-admissions/{id}/cancel"
        actor: ShelterManager
        preconditions:
          - "ScreeningRequest.status == ADMITTED"
          - "The linked ShelterAdmission.occupancy_status == RESERVED"
        side_effects:
          - "Keeps assigned_advocate_id and decided_at, so the advocate's active_caseload_count is unchanged by the round trip (the counted status set covers both APPROVED and ADMITTED)."
          - "Increments ScreeningRequest.version by 1."
        note: "The only re-entry into APPROVED; lets a household be re-placed in another unit after a withdrawn reservation."

  - entity: ShelterAdmission
    field: occupancy_status
    dimension: 1_of_2
    shape: parallel_dimension_one
    initial_state: RESERVED
    terminal_states: [EXITED, CANCELLED]
    transitions:
      - from: RESERVED
        to: CHECKED_IN
        trigger: "POST /shelter-admissions/{id}/check-in"
        actor: ShelterManager
        preconditions:
          - "ShelterAdmission.occupancy_status == RESERVED"
          - "ShelterAdmission.location_security_status == SECURE (a compromised reservation may not be checked in until relocation completes)"
          - "The logical clock reading, taken as a UTC calendar date, is >= entry_date"
        side_effects:
          - "Moves household_size beds from the unit's reserved_beds to its occupied_beds and re-derives ShelterUnit.status via calculation unit_bed_ledger."
          - "When school_enrollment_status == PENDING and the body sets school_enrollment_confirmed == true, moves school_enrollment_status to ENROLLED; when minor_children_count == 0 the field stays NOT_APPLICABLE."
          - "Recomputes Shelter.available_beds and Shelter.capacity_posture."
          - "Increments ShelterAdmission.version, ShelterUnit.version and Shelter.version by 1 each."
      - from: CHECKED_IN
        to: EXITED
        trigger: "POST /shelter-admissions/{id}/exit"
        actor: ShelterManager
        preconditions:
          - "ShelterAdmission.occupancy_status == CHECKED_IN"
          - "actual_exit_date > entry_date"
          - "exit_destination is present in the body"
        side_effects:
          - "Link 1: sets actual_exit_date and exit_destination, computes settled_stay_cost_cents with the SETTLED variant of calculation shelter_stay_cost over the actual nights, and adds that amount to Shelter.settled_revenue_cents. projected_stay_cost_cents is left untouched so the two variants stay comparable."
          - "Link 2: releases household_size beds from the unit's occupied_beds, recomputes the ledger via calculation unit_bed_ledger and re-derives ShelterUnit.status, restoring the compensating invariant bed_capacity == available_beds + reserved_beds + occupied_beds."
          - "Link 3: runs waitlist promotion for the freed unit (see the ScreeningRequest WAITLISTED -> APPROVED transition); an empty eligible pool is a silent no-op."
          - "Link 4: recomputes the promoted request's assigned advocate active_caseload_count, secondary_trauma_index and wellness_posture via calculation staff_caseload_and_trauma_index."
          - "Recomputes Shelter.available_beds and Shelter.capacity_posture."
          - "Increments ShelterAdmission.version, ShelterUnit.version, Shelter.version and, when a promotion ran, ScreeningRequest.version and StaffMember.version by 1 each."
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /shelter-admissions/{id}/cancel"
        actor: ShelterManager
        preconditions:
          - "ShelterAdmission.occupancy_status == RESERVED"
          - "cancel_reason is present in the body"
        side_effects:
          - "Sets cancel_reason and leaves settled_stay_cost_cents null; projected_stay_cost_cents is retained as the historical estimate."
          - "Releases household_size beds from the unit's reserved_beds, recomputes the ledger and re-derives ShelterUnit.status."
          - "Returns the linked ScreeningRequest from ADMITTED to APPROVED so the household can be placed in another unit."
          - "Recomputes Shelter.available_beds and Shelter.capacity_posture."
          - "Increments ShelterAdmission.version, ShelterUnit.version, ScreeningRequest.version and Shelter.version by 1 each."
        note: "A CHECKED_IN admission can no longer be cancelled; it must be exited. No waitlist promotion runs on cancel - promotion is exclusive to exit."

  - entity: ShelterAdmission
    field: location_security_status
    dimension: 2_of_2
    shape: parallel_dimension_two
    initial_state: SECURE
    terminal_states: [RELOCATED]
    transitions:
      - from: SECURE
        to: COMPROMISED
        trigger: "POST /shelter-admissions/{id}/report-location-compromise"
        actor: ShelterManager
        preconditions:
          - "ShelterAdmission.location_security_status == SECURE"
          - "ShelterAdmission.occupancy_status IN {RESERVED, CHECKED_IN} (an exited or cancelled placement has no location left to protect)"
          - "compromise_source is present in the body"
        side_effects:
          - "Link 1: sets compromise_source. Neither bed counter moves and occupancy_status is untouched, so a CHECKED_IN household stays CHECKED_IN while COMPROMISED."
          - "Link 2: sets Client.confidentiality_posture to SEALED via calculation client_confidentiality_posture."
          - "Link 3: the client's SafetyPlan whose status == ACTIVE moves to UNDER_REVISION; inside it every IMPLEMENTED PlanComponent moves to REVIEW_REQUIRED and every DRAFT PlanComponent whose component_type == WORKPLACE_NOTIFICATION moves to BLOCKED; coverage_score is recomputed from the new status factors."
          - "Link 4: every HousingReferral of that client whose status IN {SUBMITTED, MATCHED} moves to REJECTED with rejection_reason SAFETY_PLAN_SUSPENDED and incentive_fee_cents / incentive_tier_applied cleared to null."
          - "Link 5: for each referral that was MATCHED, the LandlordPartner's units_committed drops by 1, units_available rises by 1, incentive_accrued_cents drops by the cleared fee, and engagement_score / incentive_tier are recomputed by calculation landlord_engagement_incentive."
          - "Increments the version of ShelterAdmission, Client, SafetyPlan, every touched PlanComponent, every touched HousingReferral and every touched LandlordPartner by 1."
      - from: COMPROMISED
        to: RELOCATED
        trigger: "POST /shelter-admissions/{id}/complete-relocation"
        actor: ShelterManager
        preconditions:
          - "ShelterAdmission.location_security_status == COMPROMISED"
          - "ShelterAdmission.occupancy_status IN {RESERVED, CHECKED_IN}"
          - "new_shelter_unit_id names an existing ShelterUnit other than the current shelter_unit_id"
          - "expected_shelter_unit_version matches the new unit's current version"
          - "The new unit's available_beds >= household_size"
          - "accessibility_required of the linked ScreeningRequest == false OR the new unit's unit_type == ADA_ACCESSIBLE"
          - "minor_children_count == 0 OR the new unit's unit_type IN {ADA_ACCESSIBLE, FAMILY_SUITE}"
        side_effects:
          - "Sets prior_unit_id to the vacated unit and re-points shelter_unit_id at the new unit."
          - "Recomputes the bed ledger and status of both units via calculation unit_bed_ledger; the household's beds move as reserved_beds or occupied_beds according to the unchanged occupancy_status."
          - "Recomputes Client.confidentiality_posture: with no remaining COMPROMISED admission and no DENIED HMIS_EXPORT disclosure, SEALED falls back to HEIGHTENED or NORMAL, which is what unblocks BLOCKED plan components."
          - "Recomputes Shelter.available_beds and Shelter.capacity_posture for the shelters of both units."
          - "Increments ShelterAdmission.version, both ShelterUnit versions, Client.version and Shelter.version by 1 each."
        note: "RELOCATED is terminal for this dimension: a second compromise on the same admission is rejected, so each placement may be relocated at most once."

  - entity: ProtectiveOrderCase
    field: status
    shape: cyclic_refile_loop
    initial_state: PETITION_DRAFTED
    terminal_states: [GRANTED, DENIED_FINAL]
    transitions:
      - from: PETITION_DRAFTED
        to: FILED
        trigger: "POST /protective-order-cases/{id}/file"
        actor: LegalAdvocate
        preconditions:
          - "ProtectiveOrderCase.status == PETITION_DRAFTED"
          - "filed_court, hearing_start_utc, hearing_end_utc and accompanying_advocate_id are all present in the body"
          - "hearing_start_utc < hearing_end_utc"
          - "hearing_start_utc is strictly greater than the logical clock reading"
          - "The accompanying advocate has no other FILED ProtectiveOrderCase whose hearing window, expanded by the 60-minute travel buffer on both sides, overlaps or merely touches this one"
          - "The accompanying advocate's wellness_posture != FROZEN"
        side_effects:
          - "Records filed_court, hearing_start_utc, hearing_end_utc and accompanying_advocate_id on the case."
          - "Sets Client.protective_order_active to true and recomputes Client.confidentiality_posture."
          - "Increments ProtectiveOrderCase.version and Client.version by 1 each."
      - from: FILED
        to: GRANTED
        trigger: "POST /protective-order-cases/{id}/record-outcome with outcome == GRANTED"
        actor: LegalAdvocate
        preconditions:
          - "ProtectiveOrderCase.status == FILED"
          - "The logical clock reading is >= hearing_end_utc"
        side_effects:
          - "Sets outcome_recorded_at to the clock reading; the hearing window is kept as the record of the accompaniment that was provided."
          - "Keeps Client.protective_order_active true and recomputes Client.confidentiality_posture."
          - "Increments ProtectiveOrderCase.version and Client.version by 1 each."
      - from: FILED
        to: PETITION_DRAFTED
        trigger: "POST /protective-order-cases/{id}/record-outcome with outcome == DENIED while refile_count < 2"
        actor: LegalAdvocate
        preconditions:
          - "ProtectiveOrderCase.status == FILED"
          - "The logical clock reading is >= hearing_end_utc"
          - "refile_count < 2"
        side_effects:
          - "Increments refile_count by 1, sets outcome_recorded_at, and clears filed_court, hearing_start_utc, hearing_end_utc and accompanying_advocate_id, which frees that advocate's travel-buffer calendar."
          - "Sets Client.protective_order_active to false when no other FILED or GRANTED case remains, and recomputes Client.confidentiality_posture."
          - "Increments ProtectiveOrderCase.version and Client.version by 1 each."
        note: "Closes the loop PETITION_DRAFTED -> FILED -> PETITION_DRAFTED; the loop may run at most twice."
      - from: FILED
        to: DENIED_FINAL
        trigger: "POST /protective-order-cases/{id}/record-outcome with outcome == DENIED while refile_count == 2"
        actor: LegalAdvocate
        preconditions:
          - "ProtectiveOrderCase.status == FILED"
          - "The logical clock reading is >= hearing_end_utc"
          - "refile_count == 2"
        side_effects:
          - "Sets outcome_recorded_at and leaves refile_count at 2; clears the hearing window and accompanying_advocate_id."
          - "Sets Client.protective_order_active to false when no other FILED or GRANTED case remains, and recomputes Client.confidentiality_posture."
          - "Increments ProtectiveOrderCase.version and Client.version by 1 each."
        note: "Same trigger and same source state as the refile transition; only refile_count decides which target state applies, which is the non-linear branch of this machine."

  - entity: HousingReferral
    field: status
    shape: cyclic_withdraw_loop
    initial_state: SUBMITTED
    terminal_states: [LEASED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: MATCHED
        trigger: "POST /housing-referrals/{id}/match"
        actor: HousingSpecialist
        preconditions:
          - "HousingReferral.status == SUBMITTED"
          - "The client has exactly one SafetyPlan whose status == ACTIVE"
          - "Client.confidentiality_posture != SEALED"
          - "The LandlordPartner's units_available >= 1"
          - "The LandlordPartner's accepts_subsidy_type == the referral's subsidy_type"
          - "expected_landlord_partner_version matches the partner's current version"
        side_effects:
          - "Locks incentive_fee_cents and incentive_tier_applied from calculation landlord_engagement_incentive, evaluated against the partner's engagement_score before this commitment is counted."
          - "Raises the partner's units_committed by 1, lowers units_available by 1, adds the locked fee to incentive_accrued_cents, then recomputes engagement_score and incentive_tier from the new units_committed."
          - "Increments HousingReferral.version and LandlordPartner.version by 1 each."
      - from: MATCHED
        to: SUBMITTED
        trigger: "POST /housing-referrals/{id}/withdraw-match"
        actor: HousingSpecialist
        preconditions:
          - "HousingReferral.status == MATCHED"
          - "withdraw_reason is present in the body"
        side_effects:
          - "Increments withdraw_count by 1 and clears incentive_fee_cents and incentive_tier_applied to null."
          - "Lowers the partner's units_committed by 1, raises units_available by 1, subtracts the cleared fee from incentive_accrued_cents, and recomputes engagement_score and incentive_tier, restoring the compensating invariants units_pledged == units_available + units_committed and incentive_accrued_cents == SUM of the fees of MATCHED and LEASED referrals."
          - "Increments HousingReferral.version and LandlordPartner.version by 1 each."
        note: "Closes the loop SUBMITTED -> MATCHED -> SUBMITTED; a re-match after a withdraw re-derives the fee from the then-current engagement_score, which may differ from the first fee."
      - from: MATCHED
        to: LEASED
        trigger: "POST /housing-referrals/{id}/lease"
        actor: HousingSpecialist
        preconditions:
          - "HousingReferral.status == MATCHED"
          - "lease_start_date is present in the body and is >= the logical clock reading taken as a UTC calendar date"
        side_effects:
          - "Sets lease_start_date; incentive_fee_cents stays locked and the partner's ledger is unchanged because LEASED remains inside the counted status set {MATCHED, LEASED}."
          - "Sets Client.status to EXITED."
          - "Increments HousingReferral.version and Client.version by 1 each."
      - from: SUBMITTED
        to: REJECTED
        trigger: "link 4 of the location-compromise cascade, or archiving the client's ACTIVE safety plan"
        actor: system
        preconditions:
          - "HousingReferral.status == SUBMITTED"
          - "The client lost its ACTIVE SafetyPlan (moved to UNDER_REVISION or ARCHIVED)"
        side_effects:
          - "Sets rejection_reason to SAFETY_PLAN_SUSPENDED; no fee was locked, so the partner's ledger does not move."
          - "Increments HousingReferral.version by 1."
      - from: MATCHED
        to: REJECTED
        trigger: "link 4 of the location-compromise cascade, or archiving the client's ACTIVE safety plan"
        actor: system
        preconditions:
          - "HousingReferral.status == MATCHED"
          - "The client lost its ACTIVE SafetyPlan (moved to UNDER_REVISION or ARCHIVED)"
        side_effects:
          - "Sets rejection_reason to SAFETY_PLAN_SUSPENDED and clears incentive_fee_cents and incentive_tier_applied to null."
          - "Link 5: lowers the partner's units_committed by 1, raises units_available by 1, subtracts the cleared fee from incentive_accrued_cents, and recomputes engagement_score and incentive_tier."
          - "Increments HousingReferral.version and LandlordPartner.version by 1 each."
        note: "The cascade rejection reverses the same ledger deltas as withdraw-match, but does not touch withdraw_count, which counts only specialist-initiated withdrawals."

  - entity: DisclosureEvent
    field: status
    shape: branching_with_derived_target_state
    initial_state: REQUESTED
    terminal_states: [RELEASED, PARTIALLY_RELEASED, DENIED]
    transitions:
      - from: REQUESTED
        to: RELEASED
        trigger: "POST /disclosure-events/{id}/decide with decision == RELEASE, when the projection suppresses nothing"
        actor: PrivacyOfficer
        preconditions:
          - "DisclosureEvent.status == REQUESTED"
          - "X-User-ID != DisclosureEvent.requested_by_staff_id (segregation of duties)"
          - "Client.confidentiality_posture != SEALED"
          - "kind == MANDATED_REPORT, or roi_expires_on is >= the logical clock reading taken as a UTC calendar date"
          - "calculation disclosure_field_projection, applied to requested_field_keys, leaves suppressed_field_keys empty"
        side_effects:
          - "Sets decided_by_staff_id, decided_at, released_field_keys (all requested keys) and suppressed_field_keys (empty array)."
          - "Sets late_filed to true when kind == MANDATED_REPORT and decided_at is strictly after decision_deadline_utc; exactly at the deadline it stays false."
          - "Increments DisclosureEvent.version by 1."
      - from: REQUESTED
        to: PARTIALLY_RELEASED
        trigger: "POST /disclosure-events/{id}/decide with decision == RELEASE, when the projection suppresses at least one key"
        actor: PrivacyOfficer
        preconditions:
          - "DisclosureEvent.status == REQUESTED"
          - "X-User-ID != DisclosureEvent.requested_by_staff_id (segregation of duties)"
          - "Client.confidentiality_posture != SEALED"
          - "kind == MANDATED_REPORT, or roi_expires_on is >= the logical clock reading taken as a UTC calendar date"
          - "calculation disclosure_field_projection places at least one requested key in suppressed_field_keys"
        side_effects:
          - "Sets decided_by_staff_id, decided_at, and the released / suppressed key arrays exactly as the projection computed them."
          - "Sets late_filed by the same MANDATED_REPORT deadline rule."
          - "Increments DisclosureEvent.version by 1."
        note: "Same trigger as the RELEASED transition; the target state is decided by the projection result, never by the caller."
      - from: REQUESTED
        to: DENIED
        trigger: "POST /disclosure-events/{id}/decide with decision == DENY"
        actor: PrivacyOfficer
        preconditions:
          - "DisclosureEvent.status == REQUESTED"
          - "X-User-ID != DisclosureEvent.requested_by_staff_id (segregation of duties)"
          - "denial_reason is present in the body"
        side_effects:
          - "Sets decided_by_staff_id, decided_at and denial_reason; released_field_keys stays an empty array and suppressed_field_keys receives every requested key."
          - "When kind == HMIS_EXPORT, recomputes Client.confidentiality_posture, which pins the client at SEALED for as long as the denial stands."
          - "Increments DisclosureEvent.version and Client.version by 1 each."
        note: "All three decision states are terminal: a second decide call on the same event is rejected."

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:

  - rule_id: admission-create-stale-unit
    parent_entity: ShelterUnit
    write_endpoint: "POST /shelter-admissions"
    occ_field: "expected_shelter_unit_version"
    description: |
      Creating a ShelterAdmission against a ShelterUnit whose version has advanced since the
      client last read it is rejected. Two managers may each hold an APPROVED screening request
      whose household legitimately fits the unit's remaining beds when each of them read it, so
      the second create is not blocked by any state precondition - the unit is still AVAILABLE or
      HOLD and the request is still APPROVED. The stale version is the only observable evidence
      that the bed ledger moved under the second writer, so OCC on ShelterUnit.version decides it.
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412

  - rule_id: safety-plan-create-stale-client
    parent_entity: Client
    write_endpoint: "POST /safety-plans"
    occ_field: "expected_client_version"
    description: |
      Creating a SafetyPlan supersedes every earlier DRAFT, ACTIVE or UNDER_REVISION plan of the
      same client, so a second create against a client whose version already advanced would
      silently archive a plan the writer never saw. Nothing in the state machine forbids the
      second create - superseding is the sanctioned semantics - so the stale expected_client_version
      is the only signal that the writer's view of the client is out of date.
    error_id: ERR_STALE_CLIENT_VERSION
    http_status: 412

  - rule_id: referral-match-stale-landlord
    parent_entity: LandlordPartner
    write_endpoint: "POST /housing-referrals/{id}/match"
    occ_field: "expected_landlord_partner_version"
    description: |
      Matching a referral to a LandlordPartner locks an incentive fee from the partner's
      engagement_score as it stood before the commitment. A specialist who read the partner
      earlier would lock a fee off a superseded score while units_available is still positive and
      the referral is still SUBMITTED, so no state precondition catches it. OCC on
      LandlordPartner.version rejects the stale fee computation.
    error_id: ERR_STALE_LANDLORD_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: lethality_danger_score
    trigger: "POST /hotline-calls/{id}/risk-assessments, once per RiskAssessment row, immediately before the HotlineCall moves to RISK_ASSESSED"
    algorithm: weighted_scoring
    formula: |
      # 1. factor points (each boolean contributes its full weight or zero)
      base_points = 25 * (1 if weapon_access else 0)
                  + 20 * (1 if strangulation_history else 0)
                  + 15 * (1 if separation_recent else 0)
                  + 18 * (1 if threats_to_kill else 0)
                  +  2 * min(stalking_frequency_per_week, STALKING_CAP)

      # 2. corroboration bonus, applied only by the CORROBORATED_REVIEW variant
      corroborating_fact_count =
            (1 if EXISTS(ProtectiveOrderCase WHERE client_id == call.client_id
                                              AND status IN {FILED, GRANTED}) else 0)
          + (1 if EXISTS(ShelterAdmission    WHERE client_id == call.client_id
                                              AND occupancy_status IN {CHECKED_IN, EXITED}) else 0)
          + (1 if COUNT(HotlineCall WHERE client_id == call.client_id
                                     AND id != call.id
                                     AND status IN {SCREENING_REFERRED, SAFETY_PLAN_ONLY,
                                                    RESOURCE_REFERRED}) >= 2 else 0)
      bonus = (CORROBORATION_POINTS * corroborating_fact_count) if variant_applied == CORROBORATED_REVIEW else 0

      base_subtotal = base_points + bonus            # stored on the row

      # 3. escalation multiplier over the two lethality co-factors
      if weapon_access and strangulation_history:      escalation_multiplier = 1.25
      elif weapon_access or strangulation_history:     escalation_multiplier = 1.10
      else:                                            escalation_multiplier = 1.00

      # 4. score and band
      danger_score = min(100.0, round_half_up(base_subtotal * escalation_multiplier, 1))
      risk_band = IMMINENT if danger_score >= 75.0
             else ELEVATED if danger_score >= 50.0
             else MODERATE if danger_score >= 25.0
             else LOW
    input_set: >
      The five factor inputs of this RiskAssessment row, plus - for the CORROBORATED_REVIEW
      variant only - the client's ProtectiveOrderCase rows in status FILED or GRANTED, the
      client's ShelterAdmission rows in occupancy_status CHECKED_IN or EXITED, and the client's
      other HotlineCall rows in a disposed status. PETITION_DRAFTED and DENIED_FINAL cases,
      RESERVED and CANCELLED admissions, and RECEIVED or RISK_ASSESSED calls are excluded.
    constants:
      WEAPON_POINTS: 25
      STRANGULATION_POINTS: 20
      SEPARATION_POINTS: 15
      THREATS_TO_KILL_POINTS: 18
      STALKING_POINTS_PER_EVENT: 2
      STALKING_CAP: 7
      CORROBORATION_POINTS: 6
      BOTH_COFACTOR_MULTIPLIER: 1.25
      ONE_COFACTOR_MULTIPLIER: 1.10
      NO_COFACTOR_MULTIPLIER: 1.00
      SCORE_CEILING: 100.0
      BAND_IMMINENT_MIN: 75.0
      BAND_ELEVATED_MIN: 50.0
      BAND_MODERATE_MIN: 25.0
    precision: "danger_score and base_subtotal to 1 decimal place, round_half_up; the ceiling is applied after rounding"
    variants:
      - name: INTAKE_SNAPSHOT
        when: "the request body sets corroborate_with_history == false (the default) - the standard first-contact triage read"
        difference: "bonus is 0 and corroborating_fact_count is stored as 0 even when corroborating rows exist; only the five factor inputs move the score"
      - name: CORROBORATED_REVIEW
        when: "the request body sets corroborate_with_history == true - a supervisory re-read against the client's own history"
        difference: >
          Adds CORROBORATION_POINTS per corroborating fact to base_subtotal before the
          multiplier, so identical factor inputs can land in a different risk_band. Worked
          divergence with weapon_access true, strangulation_history false, separation_recent
          true, threats_to_kill false, stalking_frequency_per_week 2 and exactly one
          corroborating fact: INTAKE_SNAPSHOT gives 44 * 1.10 = 48.4 (MODERATE) while
          CORROBORATED_REVIEW gives (44 + 6) * 1.10 = 55.0 (ELEVATED).

  - name: unit_bed_ledger
    trigger: "every ShelterAdmission create, check-in, exit, cancel and complete-relocation, on each unit the admission touches"
    algorithm: aggregation
    formula: |
      reserved_beds  = SUM(ShelterAdmission.household_size
                           WHERE shelter_unit_id == unit.id AND occupancy_status == RESERVED)
      occupied_beds  = SUM(ShelterAdmission.household_size
                           WHERE shelter_unit_id == unit.id AND occupancy_status == CHECKED_IN)
      available_beds = unit.bed_capacity - reserved_beds - occupied_beds

      status = OCCUPIED  if occupied_beds > 0
          else HOLD      if reserved_beds > 0
          else AVAILABLE

      # shelter roll-up
      shelter.total_bed_capacity = SUM(ShelterUnit.bed_capacity WHERE shelter_id == shelter.id)
      shelter.available_beds     = SUM(ShelterUnit.available_beds WHERE shelter_id == shelter.id)
      shelter.capacity_posture   = FULL          if shelter.available_beds == 0
                              else NEAR_CAPACITY if shelter.available_beds <= ceil(NEAR_CAPACITY_RATIO * shelter.total_bed_capacity)
                              else OPEN
    input_set: >
      Only ShelterAdmission rows in occupancy_status RESERVED or CHECKED_IN consume beds.
      EXITED and CANCELLED rows are excluded entirely, which is what makes the exit and cancel
      transitions restore the compensating invariant
      bed_capacity == available_beds + reserved_beds + occupied_beds.
    constants:
      NEAR_CAPACITY_RATIO: 0.20
    precision: "integer bed counts; ceil() on the near-capacity threshold; a shelter with zero units has total_bed_capacity 0, available_beds 0 and capacity_posture FULL"

  - name: safety_plan_coverage_score
    trigger: "SafetyPlan activate, revise, reactivate; PlanComponent create and implement; and link 3 of the location-compromise cascade"
    algorithm: weighted_scoring
    formula: |
      # per-component effective weight
      base_weight = { RELOCATION: 30, COMMUNICATION: 25, TECHNOLOGY: 25, WORKPLACE_NOTIFICATION: 20 }[component_type]
      uplift_applies = (client.current_risk_band == IMMINENT
                        and component_type in {RELOCATION, TECHNOLOGY})
      weight_effective = round_half_up(base_weight * IMMINENT_UPLIFT, 2) if uplift_applies else base_weight

      status_factor = { IMPLEMENTED: 1.000, DRAFT: 0.350, REVIEW_REQUIRED: 0.175, BLOCKED: 0.000 }[status]

      # MANDATORY evaluation order: round each component, THEN sum, THEN round the total.
      subscore       = round_half_up(weight_effective * status_factor / SCORE_DIVISOR, 2)
      coverage_score = round_half_up(SUM(subscore over every PlanComponent of the plan), 2)
    input_set: >
      Every PlanComponent row of this safety_plan_id in any status, including BLOCKED rows
      (which contribute exactly 0.00). A plan with no components scores 0.00. Components of
      other plans of the same client, including ARCHIVED ones, are excluded.
    constants:
      WEIGHT_RELOCATION: 30
      WEIGHT_COMMUNICATION: 25
      WEIGHT_TECHNOLOGY: 25
      WEIGHT_WORKPLACE_NOTIFICATION: 20
      IMMINENT_UPLIFT: 1.2
      FACTOR_IMPLEMENTED: 1.000
      FACTOR_DRAFT: 0.350
      FACTOR_REVIEW_REQUIRED: 0.175
      FACTOR_BLOCKED: 0.000
      SCORE_DIVISOR: 10
    precision: >
      Two decimal places, round_half_up, applied per component and then once to the sum. The
      order is load-bearing: two DRAFT components of type COMMUNICATION and TECHNOLOGY on a
      non-IMMINENT client score round(0.875,2) + round(0.875,2) = 0.88 + 0.88 = 1.76, whereas
      summing first and rounding once would give round(1.75, 2) = 1.75. The maximum attainable
      score is 11.10 (all four components IMPLEMENTED on an IMMINENT client).

  - name: shelter_stay_cost
    trigger: "PROJECTED at POST /shelter-admissions; SETTLED at POST /shelter-admissions/{id}/exit"
    algorithm: chronological
    formula: |
      per_night_base = shelter.nightly_rate_cents
                     + shelter.child_supplement_cents * admission.minor_children_count

      # PROJECTED variant - forward-looking, planned window, statistical weekend estimate
      nights_planned    = (planned_exit_date - entry_date) in whole days
      weekend_projected = round_half_up(nights_planned * WEEKEND_NIGHTS_PER_WEEK / DAYS_PER_WEEK, 0)
      projected_stay_cost_cents = nights_planned * per_night_base
                                + weekend_projected * shelter.weekend_surcharge_cents

      # SETTLED variant - chronological walk over the nights actually stayed
      settled = 0
      for night_date in [entry_date .. actual_exit_date - 1 day]:      # half-open window
          settled += per_night_base
          if weekday(night_date) in {FRIDAY, SATURDAY}:
              settled += shelter.weekend_surcharge_cents
      settled_stay_cost_cents = settled
    input_set: >
      One admission and its shelter's three rate fields. The PROJECTED variant reads
      entry_date and planned_exit_date; the SETTLED variant reads entry_date and
      actual_exit_date. Both windows are half-open: the exit night is never charged.
    constants:
      WEEKEND_NIGHTS_PER_WEEK: 2
      DAYS_PER_WEEK: 7
      SURCHARGE_WEEKDAYS: [FRIDAY, SATURDAY]
    precision: "integer cents; weekend_projected is rounded to a whole number of nights with round_half_up before it is multiplied by the surcharge"
    variants:
      - name: PROJECTED
        when: "at creation, stored in projected_stay_cost_cents and never revised afterwards"
        difference: "estimates weekend nights as a 2-in-7 proportion of the planned nights instead of inspecting the calendar"
      - name: SETTLED
        when: "at exit, stored in settled_stay_cost_cents and added to Shelter.settled_revenue_cents"
        difference: >
          Walks the actual calendar. With nightly_rate_cents 8500, weekend_surcharge_cents 2500,
          child_supplement_cents 1200, minor_children_count 2, entry_date 2026-08-07 (a Friday)
          and exit 2026-08-12, the five nights cost 5 * 10900 = 54500 either way, but PROJECTED
          charges round_half_up(5 * 2 / 7) = 1 surcharge night for 57000 while SETTLED finds two
          real surcharge nights (Fri 08-07 and Sat 08-08) for 59500.

  - name: landlord_engagement_incentive
    trigger: "POST /housing-referrals/{id}/match, and the reversal on withdraw-match or cascade rejection"
    algorithm: threshold
    formula: |
      # MANDATORY evaluation order - the tier is read BEFORE this referral is committed.
      # 1. pre-commit score
      score_before = round_half_up(100 * partner.units_committed / partner.units_pledged, 1)   # 0.0 when units_pledged == 0
      # 2. tier and multiplier from score_before
      tier       = PLATINUM if score_before >= TIER_PLATINUM_MIN
              else GOLD     if score_before >= TIER_GOLD_MIN
              else SILVER   if score_before >= TIER_SILVER_MIN
              else BASE
      multiplier = { PLATINUM: 1.50, GOLD: 1.25, SILVER: 1.10, BASE: 1.00 }[tier]
      # 3. fee locked on the referral
      incentive_fee_cents   = round_half_up(partner.base_incentive_cents * multiplier, 0)
                            + (RAPID_REHOUSING_BONUS_CENTS if program_type == RAPID_REHOUSING else 0)
      incentive_tier_applied = tier
      # 4. commit, 5. accrue, 6. re-derive - strictly after the fee is locked
      partner.units_committed        += 1
      partner.units_available         = partner.units_pledged - partner.units_committed
      partner.incentive_accrued_cents = SUM(HousingReferral.incentive_fee_cents
                                            WHERE landlord_partner_id == partner.id
                                              AND status IN {MATCHED, LEASED})
      partner.engagement_score        = round_half_up(100 * partner.units_committed / partner.units_pledged, 1)
      partner.incentive_tier          = tier band of partner.engagement_score
    input_set: >
      HousingReferral rows of this partner whose status IN {MATCHED, LEASED} define
      units_committed and incentive_accrued_cents. SUBMITTED and REJECTED referrals are excluded,
      which is what lets withdraw-match and the cascade rejection restore both partner invariants.
    constants:
      TIER_PLATINUM_MIN: 60.0
      TIER_GOLD_MIN: 30.0
      TIER_SILVER_MIN: 10.0
      MULT_PLATINUM: 1.50
      MULT_GOLD: 1.25
      MULT_SILVER: 1.10
      MULT_BASE: 1.00
      RAPID_REHOUSING_BONUS_CENTS: 15000
    precision: >
      engagement_score to 1 decimal place, round_half_up; incentive_fee_cents to whole cents.
      The pinned order is load-bearing: with units_pledged 4 and base_incentive_cents 40000, a
      first TRANSITIONAL_HOUSING match locks 40000 at BASE and leaves engagement_score 25.0, and
      a second RAPID_REHOUSING match then locks round(40000 * 1.10) + 15000 = 59000 at SILVER.
      Reading the tier after the commitment would give GOLD (score 50.0) and 65000.

  - name: staff_caseload_and_trauma_index
    trigger: "WellnessCheck create, screening decide (APPROVE or WAITLIST), link 4 of the exit cascade, and every POST /_clock/set_current_utc"
    algorithm: decay_function
    formula: |
      contribution_points = round_half_up(
            (check.distress_scale * DISTRESS_POINTS + check.exposure_hours * HOURS_POINTS)
            * (DEBRIEF_FACTOR if check.debrief_completed else 1.00), 1)      # stored on the row

      days_since = whole days from date(check.checked_on_utc) to date(logical_clock)
      decay      = 1.0 if days_since <= FRESH_WINDOW_DAYS
              else 0.6 if days_since <= STALE_WINDOW_DAYS
              else 0.0

      secondary_trauma_index = min(INDEX_CEILING, round_half_up(
            SUM(check.contribution_points * decay over every WellnessCheck of this staff member)
          + CASELOAD_POINTS * staff.active_caseload_count, 1))

      wellness_posture = FROZEN     if secondary_trauma_index >= POSTURE_FROZEN_MIN
                    else RESTRICTED if secondary_trauma_index >= POSTURE_RESTRICTED_MIN
                    else OPEN
    input_set: >
      Every WellnessCheck row of this staff member (none are ever excluded; checks older than
      STALE_WINDOW_DAYS simply decay to a 0.0 factor), plus active_caseload_count, which counts
      ScreeningRequest rows assigned to this member in status APPROVED or ADMITTED whose
      admission has not yet EXITED.
    constants:
      DISTRESS_POINTS: 6
      HOURS_POINTS: 0.5
      DEBRIEF_FACTOR: 0.70
      FRESH_WINDOW_DAYS: 7
      STALE_WINDOW_DAYS: 30
      CASELOAD_POINTS: 2.5
      INDEX_CEILING: 100.0
      POSTURE_FROZEN_MIN: 70.0
      POSTURE_RESTRICTED_MIN: 40.0
    precision: >
      One decimal place, round_half_up, applied per check and once to the total. Boundary
      behaviour is exact: distress_scale 10 with exposure_hours 20.0, no debrief and a
      same-day check gives 70.0 and FROZEN, while exposure_hours 19.8 gives 69.9 and only
      RESTRICTED. The same check read 8 days later contributes 42.0, and 31 days later 0.0.

  - name: disclosure_field_projection
    trigger: "POST /disclosure-events/{id}/decide, before the target status is chosen"
    algorithm: projection
    formula: |
      KEY_VOCABULARY = [ client_code, legal_name, household_size, minor_children_count,
                         program_type, entry_date, planned_exit_date, shelter_unit_label,
                         shelter_street_address, hotline_call_transcript ]   # canonical order

      allowed = {
        HMIS_EXPORT:     { client_code, household_size, minor_children_count, program_type, entry_date },
        COURT_SUBPOENA:  KEY_VOCABULARY - { shelter_unit_label, shelter_street_address },
        PARTNER_AGENCY:  KEY_VOCABULARY - { hotline_call_transcript },
        MANDATED_REPORT: KEY_VOCABULARY
      }[event.kind]

      if decision == DENY:
          released_field_keys  = []
          suppressed_field_keys = event.requested_field_keys in KEY_VOCABULARY order
      else:
          released_field_keys   = [k for k in KEY_VOCABULARY if k in requested_field_keys and k in allowed]
          suppressed_field_keys = [k for k in KEY_VOCABULARY if k in requested_field_keys and k not in allowed]

      target_status = DENIED             if decision == DENY
                 else RELEASED           if suppressed_field_keys is empty
                 else PARTIALLY_RELEASED
    input_set: >
      Only this DisclosureEvent's requested_field_keys and kind. No other client data is read,
      which is what keeps a SEALED client's location out of a homeless-data-system export even
      when the requester asked for it by name.
    constants:
      KEY_COUNT: 10
      HMIS_ALLOWED_COUNT: 5
      COURT_SUPPRESSED_COUNT: 2
      PARTNER_SUPPRESSED_COUNT: 1
      MANDATED_SUPPRESSED_COUNT: 0
    precision: >
      Both arrays are emitted in KEY_VOCABULARY order, never in request order, so the response
      is byte-stable for a given request set. Duplicate keys are rejected upstream by the
      requested_field_keys constraint.

  - name: client_confidentiality_posture
    trigger: "every RiskAssessment create, hotline dispose, protective-order file and record-outcome, shelter-admission compromise and complete-relocation, and disclosure decide"
    algorithm: constraint_propagation
    formula: |
      sealed = EXISTS(ShelterAdmission WHERE client_id == client.id
                                         AND location_security_status == COMPROMISED)
            or EXISTS(DisclosureEvent  WHERE client_id == client.id
                                         AND kind == HMIS_EXPORT AND status == DENIED)

      heightened = client.current_risk_band == IMMINENT
                or client.protective_order_active == true

      confidentiality_posture = SEALED     if sealed
                           else HEIGHTENED if heightened
                           else NORMAL
    input_set: >
      The client's ShelterAdmission rows (any occupancy_status), the client's HMIS_EXPORT
      DisclosureEvent rows in status DENIED, the latest-by-created_at RiskAssessment of the
      client, and its ProtectiveOrderCase rows in status FILED or GRANTED. RELOCATED admissions
      no longer count as compromised, which is the single path out of SEALED.
    constants:
      SEALED_RANK: 3
      HEIGHTENED_RANK: 2
      NORMAL_RANK: 1
    precision: "enum-valued; the checks are evaluated strictly in the order sealed, then heightened, then normal, so SEALED always wins over HEIGHTENED"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================
validations:

  - priority: 10
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and X-User-Role is one of the six roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "The X-User-Role value appears in the called endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 25
    category: auth
    check: >
      Segregation of duties. On POST /screening-requests/{id}/decide, X-User-ID may not equal
      ScreeningRequest.created_by_staff_id. On POST /disclosure-events/{id}/decide, X-User-ID may
      not equal DisclosureEvent.requested_by_staff_id.
    error_id: ERR_SELF_DECISION_FORBIDDEN
    http_status: 403
    applies_to: "POST /screening-requests/{id}/decide, POST /disclosure-events/{id}/decide"

  - priority: 28
    category: auth
    check: "Only the plan's author may move its components: X-User-ID == SafetyPlan.authored_by_staff_id"
    error_id: ERR_NOT_PLAN_AUTHOR
    http_status: 403
    applies_to: "POST /safety-plans/{id}/components, POST /safety-plans/{id}/components/{component_id}/implement, POST /safety-plans/{id}/activate, POST /safety-plans/{id}/revise, POST /safety-plans/{id}/reactivate"

  - priority: 30
    category: existence
    check: >
      Request shape: every non-optional field of the endpoint's §1.5 input is present, enum values
      are drawn from the field's §1.1 constraints, integers and numbers fall inside their declared
      ranges, dates parse as YYYY-MM-DD and datetimes as ISO 8601 UTC, and requested_field_keys
      holds 1..10 distinct keys from the disclosure_field_projection vocabulary.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 40
    category: existence
    check: "Every id in the path resolves to an existing row, validated left to right"
    error_id: "ERR_CLIENT_NOT_FOUND | ERR_HOTLINE_CALL_NOT_FOUND | ERR_SAFETY_PLAN_NOT_FOUND | ERR_PLAN_COMPONENT_NOT_FOUND | ERR_SHELTER_NOT_FOUND | ERR_SHELTER_UNIT_NOT_FOUND | ERR_SCREENING_REQUEST_NOT_FOUND | ERR_SHELTER_ADMISSION_NOT_FOUND | ERR_PROTECTIVE_ORDER_CASE_NOT_FOUND | ERR_LANDLORD_PARTNER_NOT_FOUND | ERR_HOUSING_REFERRAL_NOT_FOUND | ERR_DISCLOSURE_EVENT_NOT_FOUND | ERR_STAFF_MEMBER_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying a path id"

  - priority: 45
    category: existence
    check: >
      Every foreign key carried in the request body resolves to an existing row - client_id,
      hotline_call_id, based_on_risk_assessment_id, requested_shelter_id, shelter_unit_id,
      new_shelter_unit_id, screening_request_id, landlord_partner_id, assigned_advocate_id,
      accompanying_advocate_id, requested_by_staff_id, staff_member_id.
    error_id: "ERR_CLIENT_NOT_FOUND | ERR_HOTLINE_CALL_NOT_FOUND | ERR_RISK_ASSESSMENT_NOT_FOUND | ERR_SHELTER_NOT_FOUND | ERR_SHELTER_UNIT_NOT_FOUND | ERR_SCREENING_REQUEST_NOT_FOUND | ERR_LANDLORD_PARTNER_NOT_FOUND | ERR_STAFF_MEMBER_NOT_FOUND"
    http_status: 404
    applies_to: "all write endpoints carrying a body foreign key"

  - priority: 46
    category: existence
    check: >
      Cross-reference integrity across body foreign keys. On POST /screening-requests the named
      HotlineCall.client_id must equal the body client_id; on POST /safety-plans the named
      RiskAssessment must belong to a HotlineCall whose client_id equals the body client_id; on
      POST /shelter-admissions/{id}/complete-relocation the new unit must belong to a Shelter.
      Existence is settled at priority 45 first, so this rule only compares owners.
    error_id: ERR_CROSS_REFERENCE_MISMATCH
    http_status: 422
    applies_to: "POST /screening-requests, POST /safety-plans"

  - priority: 50
    category: state
    check: "expected_shelter_unit_version, expected_client_version and expected_landlord_partner_version each equal the current version of the named parent row (§1.2.1)"
    error_id: "ERR_STALE_UNIT_VERSION | ERR_STALE_CLIENT_VERSION | ERR_STALE_LANDLORD_VERSION"
    http_status: 412
    applies_to: "POST /shelter-admissions, POST /shelter-admissions/{id}/complete-relocation, POST /safety-plans, POST /housing-referrals/{id}/match"

  - priority: 54
    category: business_referential
    check: >
      At most one ShelterAdmission per screening_request_id may exist in a status other than
      CANCELLED. Evaluated ahead of the APPROVED-status check at priority 56, because a duplicate
      necessarily implies the request already moved to ADMITTED and the duplicate diagnosis is the
      more specific one.
    error_id: ERR_DUPLICATE_ADMISSION
    http_status: 409
    applies_to: "POST /shelter-admissions"

  - priority: 55
    category: state
    check: >
      The target row is in a state from which the requested transition is declared in §1.2. Covers
      a second risk assessment on a RISK_ASSESSED call, a dispose on an already-disposed call, an
      activate on a non-DRAFT plan, a reactivate on a non-UNDER_REVISION plan, an implement on an
      already-IMPLEMENTED component, a check-in / cancel / exit / compromise / relocation against
      the wrong admission state, a file on a FILED or terminal protective-order case, a
      record-outcome on a case that is not FILED, a match / withdraw-match / lease against the
      wrong referral state, and a second decide on a decided disclosure event.
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 56
    category: state
    check: "POST /shelter-admissions requires the named ScreeningRequest to be in status APPROVED"
    error_id: ERR_SCREENING_NOT_APPROVED
    http_status: 409
    applies_to: "POST /shelter-admissions"

  - priority: 57
    category: state
    check: "POST /shelter-admissions/{id}/check-in requires location_security_status == SECURE; a COMPROMISED reservation must be relocated first"
    error_id: ERR_LOCATION_COMPROMISED
    http_status: 409
    applies_to: "POST /shelter-admissions/{id}/check-in"

  - priority: 58
    category: state
    check: "POST /safety-plans/{id}/reactivate requires zero PlanComponent rows in status BLOCKED on that plan"
    error_id: ERR_PLAN_HAS_BLOCKED_COMPONENT
    http_status: 409
    applies_to: "POST /safety-plans/{id}/reactivate"

  - priority: 59
    category: state
    check: "POST /safety-plans/{id}/activate requires at least one PlanComponent on the plan; the empty component set is the exact boundary that blocks activation"
    error_id: ERR_PLAN_HAS_NO_COMPONENTS
    http_status: 422
    applies_to: "POST /safety-plans/{id}/activate"

  - priority: 60
    category: business_safety
    check: >
      Confidentiality hold: no information may leave the agency for a client whose
      confidentiality_posture == SEALED, no housing match may be locked for such a client, and a
      BLOCKED PlanComponent may not be implemented while the client is still SEALED. Evaluated
      before any release-of-information check.
    error_id: ERR_CONFIDENTIALITY_HOLD
    http_status: 409
    applies_to: "POST /disclosure-events/{id}/decide, POST /housing-referrals/{id}/match, POST /safety-plans/{id}/components/{component_id}/implement"

  - priority: 62
    category: business_safety
    check: "A hotline call may not be disposed as RESOURCE_REFERRED while the client's current_risk_band == IMMINENT"
    error_id: ERR_IMMINENT_RISK_REFERRAL_FORBIDDEN
    http_status: 409
    applies_to: "POST /hotline-calls/{id}/dispose"

  - priority: 64
    category: business_safety
    check: "A StaffMember whose wellness_posture == FROZEN may not be assigned a screening request nor committed to court accompaniment"
    error_id: ERR_ADVOCATE_FROZEN
    http_status: 409
    applies_to: "POST /screening-requests/{id}/decide, POST /protective-order-cases/{id}/file"

  - priority: 66
    category: business_safety
    check: "A HMIS_EXPORT disclosure may only be released while the client's hmis_disclosure_consent == GRANTED; DENIED and REVOKED both block release"
    error_id: ERR_HMIS_CONSENT_ABSENT
    http_status: 409
    applies_to: "POST /disclosure-events/{id}/decide"

  - priority: 70
    category: business_referential
    check: "For kind PARTNER_AGENCY and COURT_SUBPOENA, roi_expires_on must be present and >= the logical clock date at decide time; MANDATED_REPORT needs no release of information"
    error_id: ERR_ROI_EXPIRED
    http_status: 409
    applies_to: "POST /disclosure-events/{id}/decide"

  - priority: 72
    category: business_referential
    check: "A housing referral may only be created or matched while the client has exactly one SafetyPlan in status ACTIVE"
    error_id: ERR_NO_ACTIVE_SAFETY_PLAN
    http_status: 409
    applies_to: "POST /housing-referrals, POST /housing-referrals/{id}/match"

  - priority: 74
    category: business_referential
    check: "HousingReferral.subsidy_type must equal the LandlordPartner's accepts_subsidy_type"
    error_id: ERR_SUBSIDY_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /housing-referrals"

  - priority: 76
    category: business_temporal
    check: >
      Date and window sanity: hearing_start_utc < hearing_end_utc and hearing_start_utc strictly
      after the logical clock; entry_date < planned_exit_date; actual_exit_date > entry_date;
      lease_start_date >= the logical clock date; WellnessCheck.checked_on_utc <= the logical clock.
    error_id: ERR_INVALID_DATE_WINDOW
    http_status: 422
    applies_to: "POST /protective-order-cases/{id}/file, POST /shelter-admissions, POST /shelter-admissions/{id}/exit, POST /housing-referrals/{id}/lease, POST /staff-members/{id}/wellness-checks"

  - priority: 78
    category: business_temporal
    check: >
      Court-accompaniment overlap: expanded by TRAVEL_BUFFER_MINUTES = 60 on both sides, the new
      hearing window may not overlap or even touch the buffered window of any other FILED
      ProtectiveOrderCase carrying the same accompanying_advocate_id. Touching endpoints conflict.
    error_id: ERR_ADVOCATE_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /protective-order-cases/{id}/file"

  - priority: 80
    category: business_constraint
    check: "A unit whose unit_type == STANDARD may not host a household with accessibility_required == true; only ADA_ACCESSIBLE satisfies that need"
    error_id: ERR_UNIT_ACCESSIBILITY_MISMATCH
    http_status: 422
    applies_to: "POST /shelter-admissions, POST /shelter-admissions/{id}/complete-relocation"

  - priority: 82
    category: business_constraint
    check: "A household with minor_children_count > 0 requires a unit whose unit_type IN {ADA_ACCESSIBLE, FAMILY_SUITE}"
    error_id: ERR_UNIT_COMPOSITION_MISMATCH
    http_status: 422
    applies_to: "POST /shelter-admissions, POST /shelter-admissions/{id}/complete-relocation"

  - priority: 84
    category: business_constraint
    check: "At most one PlanComponent per (safety_plan_id, component_type); unit_label is unique within a shelter_id; client_code is unique agency-wide"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /safety-plans/{id}/components, POST /shelters/{id}/units, POST /clients"

  - priority: 86
    category: business_constraint
    check: "POST /shelter-admissions/{id}/complete-relocation must name a ShelterUnit other than the admission's current shelter_unit_id"
    error_id: ERR_SAME_UNIT_RELOCATION
    http_status: 422
    applies_to: "POST /shelter-admissions/{id}/complete-relocation"

  - priority: 88
    category: business_fiscal
    check: "A screening request may not be APPROVED into a Shelter whose capacity_posture == FULL"
    error_id: ERR_SHELTER_FULL
    http_status: 409
    applies_to: "POST /screening-requests/{id}/decide"

  - priority: 89
    category: business_fiscal
    check: "An advocate may not be assigned a screening request once active_caseload_count >= max_caseload"
    error_id: ERR_CASELOAD_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /screening-requests/{id}/decide"

  - priority: 90
    category: business_fiscal
    check: >
      Aggregate stay-window capacity. Over the half-open day window [entry_date, planned_exit_date)
      of the requested placement, SUM(household_size) of every ShelterAdmission on that unit whose
      occupancy_status IN {RESERVED, CHECKED_IN} and whose own half-open window overlaps the
      requested one, plus the requesting household_size, may not exceed ShelterUnit.bed_capacity.
      Windows that merely touch (one ends on the day the other starts) do not overlap.
    error_id: ERR_UNIT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /shelter-admissions, POST /shelter-admissions/{id}/complete-relocation"

  - priority: 92
    category: business_fiscal
    check: "A LandlordPartner with units_available == 0 may not take another match"
    error_id: ERR_LANDLORD_NO_UNITS_AVAILABLE
    http_status: 409
    applies_to: "POST /housing-referrals/{id}/match"

  - priority: 94
    category: business_temporal
    check: "POST /_clock/set_current_utc may only move the logical clock forward or leave it unchanged; the startup default is 2026-08-01T00:00:00Z"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- StaffMember and secondary-trauma support -------------------------------
  - method: POST
    path: "/staff-members"
    description: "Register an agency staff member. active_caseload_count starts at 0, secondary_trauma_index at 0.0 and wellness_posture at OPEN."
    roles: [AgencyAdmin]
    code: 201
    input: ["full_name", "role_type", "max_caseload?"]
    output: StaffMember
    side_effects: ["initializes active_caseload_count 0, secondary_trauma_index 0.0, wellness_posture OPEN, last_wellness_check_at null, version 1"]

  - method: GET
    path: "/staff-members/{id}"
    description: "Read a staff member including the live secondary-trauma index and wellness posture."
    roles: [AgencyAdmin, ShelterManager, HotlineAdvocate, LegalAdvocate, HousingSpecialist, PrivacyOfficer]
    code: 200
    input: []
    output: StaffMember
    side_effects: []

  - method: POST
    path: "/staff-members/{id}/wellness-checks"
    description: "Record a secondary-trauma wellness check for the staff member."
    roles: [AgencyAdmin, ShelterManager]
    code: 201
    input: ["checked_on_utc", "exposure_hours", "distress_scale", "debrief_completed?"]
    output: WellnessCheck
    side_effects:
      - "computes contribution_points via calculation staff_caseload_and_trauma_index"
      - "recomputes StaffMember.secondary_trauma_index, wellness_posture and last_wellness_check_at"
      - "increments StaffMember.version by 1"

  - method: GET
    path: "/staff-members/{id}/wellness-checks"
    description: "List the wellness checks of one staff member, newest first by checked_on_utc then created_at ASC."
    roles: [AgencyAdmin, ShelterManager]
    code: 200
    input: ["limit?", "offset?"]
    output: WellnessCheck[]
    side_effects: []

  # --- Client -----------------------------------------------------------------
  - method: POST
    path: "/clients"
    description: "Open a survivor record. status starts at INTAKE and confidentiality_posture at NORMAL."
    roles: [HotlineAdvocate, AgencyAdmin]
    code: 201
    input: ["client_code", "legal_name", "household_size", "minor_children_count?", "accessibility_required?", "location_confidential?", "hmis_disclosure_consent?"]
    output: Client
    side_effects:
      - "initializes status INTAKE, confidentiality_posture NORMAL, current_danger_score null, current_risk_band null, protective_order_active false, resource_referral_count 0, version 1"
      - "hmis_disclosure_consent defaults to DENIED when omitted; REVOKED is rejected here"

  - method: GET
    path: "/clients/{id}"
    description: "Read a survivor record including the derived confidentiality posture and latest risk band. Returns version for OCC use."
    roles: [HotlineAdvocate, ShelterManager, LegalAdvocate, HousingSpecialist, PrivacyOfficer, AgencyAdmin]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: POST
    path: "/clients/{id}/consent"
    description: "Record a change of homeless-data-system consent. REVOKED may only be set here."
    roles: [PrivacyOfficer, AgencyAdmin]
    code: 200
    input: ["hmis_disclosure_consent"]
    output: Client
    side_effects: ["sets hmis_disclosure_consent", "increments Client.version by 1"]

  # --- Hotline calls and risk assessment --------------------------------------
  - method: POST
    path: "/hotline-calls"
    description: "Log an inbound crisis-hotline call. status starts at RECEIVED and received_at_utc is the logical clock reading."
    roles: [HotlineAdvocate]
    code: 201
    input: ["client_id", "caller_type", "presenting_concerns"]
    output: HotlineCall
    side_effects: ["sets taken_by_staff_id to X-User-ID", "sets received_at_utc to the logical clock reading", "initializes status RECEIVED, disposed_at null, version 1"]

  - method: GET
    path: "/hotline-calls/{id}"
    description: "Read one hotline call."
    roles: [HotlineAdvocate, ShelterManager, AgencyAdmin]
    code: 200
    input: []
    output: HotlineCall
    side_effects: []

  - method: GET
    path: "/hotline-calls"
    description: "List hotline calls, filterable by client and by the advocate who took them. Ordered created_at ASC."
    roles: [HotlineAdvocate, ShelterManager, AgencyAdmin]
    code: 200
    input: ["client_id?", "taken_by_staff_id?", "status?", "limit?", "offset?"]
    output: HotlineCall[]
    side_effects: []

  - method: POST
    path: "/hotline-calls/{id}/risk-assessments"
    description: "Score lethality risk for a RECEIVED call and move it to RISK_ASSESSED. corroborate_with_history selects the CORROBORATED_REVIEW variant and defaults to false."
    roles: [HotlineAdvocate]
    code: 201
    input: ["weapon_access", "strangulation_history", "separation_recent", "threats_to_kill", "stalking_frequency_per_week", "corroborate_with_history?"]
    output: RiskAssessment
    side_effects:
      - "runs calculation lethality_danger_score to set variant_applied, corroborating_fact_count, base_subtotal, escalation_multiplier, danger_score and risk_band"
      - "moves HotlineCall.status from RECEIVED to RISK_ASSESSED"
      - "recomputes Client.current_danger_score, Client.current_risk_band and Client.confidentiality_posture"
      - "increments HotlineCall.version and Client.version by 1 each"

  - method: GET
    path: "/hotline-calls/{id}/risk-assessments"
    description: "List the risk assessments of one call, created_at ASC."
    roles: [HotlineAdvocate, ShelterManager, AgencyAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: RiskAssessment[]
    side_effects: []

  - method: POST
    path: "/hotline-calls/{id}/dispose"
    description: "Close a RISK_ASSESSED call down one of three divergent branches. SCREENING_REFERRED requires requested_shelter_id and requested_entry_date; the other two ignore them."
    roles: [HotlineAdvocate]
    code: 200
    input: ["disposition", "requested_shelter_id?", "requested_entry_date?"]
    output: HotlineCall
    side_effects:
      - "SCREENING_REFERRED: creates one ScreeningRequest in status PENDING with created_by_staff_id = X-User-ID and the household fields copied from the Client"
      - "SAFETY_PLAN_ONLY: creates one SafetyPlan in status DRAFT and archives every earlier DRAFT, ACTIVE or UNDER_REVISION plan of the client"
      - "RESOURCE_REFERRED: creates no child row and recomputes Client.resource_referral_count"
      - "sets disposed_at to the logical clock reading and moves Client.status from INTAKE to ACTIVE"
      - "increments HotlineCall.version and Client.version by 1 each"

  # --- Safety planning --------------------------------------------------------
  - method: POST
    path: "/safety-plans"
    description: "Author a safety plan for a client, superseding any earlier live plan. OCC-guarded on Client.version (§1.2.1 safety-plan-create-stale-client)."
    roles: [HotlineAdvocate]
    code: 201
    input: ["client_id", "based_on_risk_assessment_id", "expected_client_version"]
    output: SafetyPlan
    side_effects:
      - "initializes status DRAFT, coverage_score 0.00, revision_count 0, authored_by_staff_id = X-User-ID, version 1"
      - "archives every earlier DRAFT, ACTIVE or UNDER_REVISION plan of the client, setting their archived_at and superseded_by_plan_id"
      - "rejects every HousingReferral of the client in status SUBMITTED or MATCHED with rejection_reason SAFETY_PLAN_SUSPENDED when an ACTIVE plan was archived"
      - "increments Client.version by 1"

  - method: GET
    path: "/safety-plans/{id}"
    description: "Read one safety plan with its live coverage score."
    roles: [HotlineAdvocate, ShelterManager, HousingSpecialist, AgencyAdmin]
    code: 200
    input: []
    output: SafetyPlan
    side_effects: []

  - method: GET
    path: "/safety-plans"
    description: "List safety plans filterable by client, source assessment, author and superseding plan. Ordered created_at ASC."
    roles: [HotlineAdvocate, ShelterManager, HousingSpecialist, AgencyAdmin]
    code: 200
    input: ["client_id?", "based_on_risk_assessment_id?", "authored_by_staff_id?", "superseded_by_plan_id?", "status?", "limit?", "offset?"]
    output: SafetyPlan[]
    side_effects: []

  - method: POST
    path: "/safety-plans/{id}/components"
    description: "Add one safety-planning component to a plan. At most one row per component_type per plan."
    roles: [HotlineAdvocate]
    code: 201
    input: ["component_type", "detail", "target_completion_date"]
    output: PlanComponent
    side_effects:
      - "initializes status DRAFT and runs calculation safety_plan_coverage_score to set weight_effective, subscore and the plan's coverage_score"
      - "increments SafetyPlan.version by 1"

  - method: GET
    path: "/safety-plans/{id}/components"
    description: "List the components of one plan, created_at ASC."
    roles: [HotlineAdvocate, ShelterManager, HousingSpecialist, AgencyAdmin]
    code: 200
    input: ["component_type?", "status?", "limit?", "offset?"]
    output: PlanComponent[]
    side_effects: []

  - method: POST
    path: "/safety-plans/{id}/components/{component_id}/implement"
    description: "Mark a component implemented. Allowed from DRAFT, REVIEW_REQUIRED, and from BLOCKED only once the client leaves SEALED."
    roles: [HotlineAdvocate]
    code: 200
    input: []
    output: PlanComponent
    side_effects:
      - "sets status IMPLEMENTED and recomputes subscore and SafetyPlan.coverage_score"
      - "increments PlanComponent.version and SafetyPlan.version by 1 each"

  - method: POST
    path: "/safety-plans/{id}/activate"
    description: "Activate a DRAFT plan. Requires at least one component."
    roles: [HotlineAdvocate]
    code: 200
    input: []
    output: SafetyPlan
    side_effects: ["sets status ACTIVE", "recomputes coverage_score", "increments SafetyPlan.version by 1"]

  - method: POST
    path: "/safety-plans/{id}/revise"
    description: "Suspend an ACTIVE plan for revision. Rejects the client's live housing referrals."
    roles: [HotlineAdvocate]
    code: 200
    input: []
    output: SafetyPlan
    side_effects:
      - "sets status UNDER_REVISION"
      - "rejects every HousingReferral of the client in status SUBMITTED or MATCHED with rejection_reason SAFETY_PLAN_SUSPENDED and reverses the landlord ledger for the matched ones"
      - "recomputes coverage_score and increments SafetyPlan.version by 1"

  - method: POST
    path: "/safety-plans/{id}/reactivate"
    description: "Return an UNDER_REVISION plan to ACTIVE. Requires zero BLOCKED components."
    roles: [HotlineAdvocate]
    code: 200
    input: []
    output: SafetyPlan
    side_effects: ["sets status ACTIVE", "increments revision_count by 1", "recomputes coverage_score", "increments SafetyPlan.version by 1"]

  # --- Shelters and units -----------------------------------------------------
  - method: POST
    path: "/shelters"
    description: "Open a shelter facility with its nightly rate, weekend surcharge and per-child supplement."
    roles: [ShelterManager, AgencyAdmin]
    code: 201
    input: ["name", "confidential_location?", "nightly_rate_cents", "weekend_surcharge_cents?", "child_supplement_cents?"]
    output: Shelter
    side_effects: ["initializes total_bed_capacity 0, available_beds 0, capacity_posture FULL, settled_revenue_cents 0, version 1"]

  - method: GET
    path: "/shelters/{id}"
    description: "Read a shelter with its rolled-up bed capacity, availability and capacity posture."
    roles: [ShelterManager, HotlineAdvocate, HousingSpecialist, AgencyAdmin]
    code: 200
    input: []
    output: Shelter
    side_effects: []

  - method: POST
    path: "/shelters/{id}/units"
    description: "Add a unit to a shelter. unit_label is unique within the shelter and unit_type encodes both accessibility and family-composition fitness."
    roles: [ShelterManager, AgencyAdmin]
    code: 201
    input: ["unit_label", "unit_type", "bed_capacity"]
    output: ShelterUnit
    side_effects:
      - "initializes reserved_beds 0, occupied_beds 0, available_beds = bed_capacity, status AVAILABLE, version 1"
      - "recomputes Shelter.total_bed_capacity, Shelter.available_beds and Shelter.capacity_posture"
      - "increments Shelter.version by 1"

  - method: GET
    path: "/shelters/{id}/units"
    description: "List the units of one shelter with their live bed ledger. Ordered unit_label ASC. Returns version for OCC use."
    roles: [ShelterManager, HotlineAdvocate, AgencyAdmin]
    code: 200
    input: ["unit_label?", "unit_type?", "status?", "limit?", "offset?"]
    output: ShelterUnit[]
    side_effects: []

  - method: GET
    path: "/shelter-units/{id}"
    description: "Read one unit with its live bed ledger and derived status. Returns version for OCC use."
    roles: [ShelterManager, HotlineAdvocate, AgencyAdmin]
    code: 200
    input: []
    output: ShelterUnit
    side_effects: []

  # --- Shelter screening ------------------------------------------------------
  - method: POST
    path: "/screening-requests"
    description: "Open a shelter screening request for a client whose call has been risk-assessed. Household fields are copied from the Client row, not accepted from the body."
    roles: [HotlineAdvocate]
    code: 201
    input: ["client_id", "hotline_call_id", "requested_shelter_id", "requested_entry_date"]
    output: ScreeningRequest
    side_effects:
      - "requires HotlineCall.status IN {RISK_ASSESSED, SCREENING_REFERRED} and HotlineCall.client_id == client_id"
      - "copies household_size, minor_children_count and accessibility_required from the Client row"
      - "sets created_by_staff_id to X-User-ID and initializes status PENDING, waitlist_position null, promoted_from_waitlist false, version 1"

  - method: GET
    path: "/screening-requests/{id}"
    description: "Read one screening request including waitlist position and promotion provenance."
    roles: [ShelterManager, HotlineAdvocate, AgencyAdmin]
    code: 200
    input: []
    output: ScreeningRequest
    side_effects: []

  - method: GET
    path: "/screening-requests"
    description: "List screening requests filterable by client, call, shelter, creator, assigned advocate, offered unit and status. Ordered created_at ASC."
    roles: [ShelterManager, HotlineAdvocate, AgencyAdmin]
    code: 200
    input: ["client_id?", "hotline_call_id?", "requested_shelter_id?", "created_by_staff_id?", "assigned_advocate_id?", "offered_shelter_unit_id?", "status?", "limit?", "offset?"]
    output: ScreeningRequest[]
    side_effects: []

  - method: POST
    path: "/screening-requests/{id}/decide"
    description: "Decide a PENDING request. decision is APPROVE, DENY or WAITLIST. APPROVE and WAITLIST require assigned_advocate_id; DENY requires denial_reason. The decider may not be the creator."
    roles: [ShelterManager]
    code: 200
    input: ["decision", "assigned_advocate_id?", "denial_reason?"]
    output: ScreeningRequest
    side_effects:
      - "APPROVE: sets assigned_advocate_id and decided_at, then recomputes that advocate's active_caseload_count, secondary_trauma_index and wellness_posture"
      - "DENY: sets denial_reason and decided_at and touches no caseload"
      - "WAITLIST: sets assigned_advocate_id, decided_at and waitlist_position, and touches no caseload"
      - "increments ScreeningRequest.version by 1 and, on APPROVE, StaffMember.version by 1"

  # --- Shelter admission ------------------------------------------------------
  - method: POST
    path: "/shelter-admissions"
    description: "Reserve a unit for an APPROVED screening request. OCC-guarded on ShelterUnit.version (§1.2.1 admission-create-stale-unit)."
    roles: [ShelterManager]
    code: 201
    input: ["screening_request_id", "shelter_unit_id", "entry_date", "planned_exit_date", "expected_shelter_unit_version"]
    output: ShelterAdmission
    side_effects:
      - "copies client_id, household_size and minor_children_count from the screening request and shelter_id from the unit"
      - "initializes occupancy_status RESERVED, location_security_status SECURE, prior_unit_id null, version 1"
      - "sets school_enrollment_status to PENDING when minor_children_count > 0, otherwise NOT_APPLICABLE"
      - "computes projected_stay_cost_cents with the PROJECTED variant of calculation shelter_stay_cost"
      - "moves the linked ScreeningRequest from APPROVED to ADMITTED"
      - "recomputes the unit's bed ledger and status via calculation unit_bed_ledger and the shelter's roll-up"
      - "increments ShelterUnit.version by 1, and ScreeningRequest.version and Shelter.version by 1 each"

  - method: GET
    path: "/shelter-admissions/{id}"
    description: "Read one admission with both status dimensions and both cost variants."
    roles: [ShelterManager, HotlineAdvocate, HousingSpecialist, AgencyAdmin]
    code: 200
    input: []
    output: ShelterAdmission
    side_effects: []

  - method: GET
    path: "/shelter-admissions"
    description: "List admissions filterable by screening request, client, unit, shelter, vacated unit and either status dimension. Ordered created_at ASC."
    roles: [ShelterManager, HotlineAdvocate, HousingSpecialist, AgencyAdmin]
    code: 200
    input: ["screening_request_id?", "client_id?", "shelter_unit_id?", "shelter_id?", "prior_unit_id?", "occupancy_status?", "location_security_status?", "limit?", "offset?"]
    output: ShelterAdmission[]
    side_effects: []

  - method: POST
    path: "/shelter-admissions/{id}/check-in"
    description: "Check a reserved household into the unit. school_enrollment_confirmed defaults to false and only matters when children are present."
    roles: [ShelterManager]
    code: 200
    input: ["school_enrollment_confirmed?"]
    output: ShelterAdmission
    side_effects:
      - "sets occupancy_status CHECKED_IN and moves household_size from the unit's reserved_beds to its occupied_beds"
      - "moves school_enrollment_status from PENDING to ENROLLED when school_enrollment_confirmed is true"
      - "recomputes the unit's status and the shelter's roll-up"
      - "increments ShelterUnit.version by 1 and Shelter.version by 1"

  - method: POST
    path: "/shelter-admissions/{id}/exit"
    description: "Exit a checked-in household. Settles the stay cost, frees the beds and promotes the top eligible waitlisted request for the freed unit."
    roles: [ShelterManager]
    code: 200
    input: ["actual_exit_date", "exit_destination"]
    output: ShelterAdmission
    side_effects:
      - "link 1: sets occupancy_status EXITED, computes settled_stay_cost_cents with the SETTLED variant of calculation shelter_stay_cost and adds it to Shelter.settled_revenue_cents"
      - "link 2: releases the beds and re-derives the unit's ledger and status via calculation unit_bed_ledger"
      - "link 3: promotes the top eligible WAITLISTED ScreeningRequest of the freed unit to APPROVED, setting promoted_from_waitlist and offered_shelter_unit_id; an empty eligible pool is a no-op"
      - "link 4: recomputes the promoted advocate's active_caseload_count, secondary_trauma_index and wellness_posture"
      - "increments ShelterUnit.version and Shelter.version by 1 each, plus ScreeningRequest.version and StaffMember.version when a promotion ran"

  - method: POST
    path: "/shelter-admissions/{id}/cancel"
    description: "Withdraw a reservation before check-in and return the screening request to APPROVED."
    roles: [ShelterManager]
    code: 200
    input: ["cancel_reason"]
    output: ShelterAdmission
    side_effects:
      - "sets occupancy_status CANCELLED and releases the reserved beds"
      - "returns the linked ScreeningRequest from ADMITTED to APPROVED"
      - "recomputes the unit's ledger and status and the shelter's roll-up"
      - "increments ShelterUnit.version, ScreeningRequest.version and Shelter.version by 1 each"

  - method: POST
    path: "/shelter-admissions/{id}/report-location-compromise"
    description: "Record that the shelter location has been compromised. Seals the client and unwinds safety planning and housing downstream."
    roles: [ShelterManager]
    code: 200
    input: ["compromise_source"]
    output: ShelterAdmission
    side_effects:
      - "link 1: sets location_security_status COMPROMISED and compromise_source, leaving occupancy_status and both bed counters untouched"
      - "link 2: sets Client.confidentiality_posture to SEALED"
      - "link 3: moves the client's ACTIVE SafetyPlan to UNDER_REVISION, its IMPLEMENTED components to REVIEW_REQUIRED and its DRAFT WORKPLACE_NOTIFICATION component to BLOCKED, then recomputes coverage_score"
      - "link 4: rejects every HousingReferral of the client in status SUBMITTED or MATCHED with rejection_reason SAFETY_PLAN_SUSPENDED and clears their incentive_fee_cents and incentive_tier_applied"
      - "link 5: reverses units_committed, units_available, incentive_accrued_cents, engagement_score and incentive_tier on every affected LandlordPartner"
      - "increments the version of Client, SafetyPlan, each touched PlanComponent, each touched HousingReferral and each touched LandlordPartner by 1"

  - method: POST
    path: "/shelter-admissions/{id}/complete-relocation"
    description: "Move a compromised placement into a different unit. OCC-guarded on the destination ShelterUnit.version."
    roles: [ShelterManager]
    code: 200
    input: ["new_shelter_unit_id", "expected_shelter_unit_version"]
    output: ShelterAdmission
    side_effects:
      - "sets location_security_status RELOCATED, prior_unit_id to the vacated unit and shelter_unit_id to the destination"
      - "recomputes the ledger and status of both units and the roll-up of both shelters"
      - "recomputes Client.confidentiality_posture, which drops out of SEALED when no compromised admission and no denied HMIS export remain"
      - "increments the version of both ShelterUnit rows, Client and Shelter by 1 each"

  # --- Protective orders and court accompaniment ------------------------------
  - method: POST
    path: "/protective-order-cases"
    description: "Draft a protective-order petition for a client. Starts at PETITION_DRAFTED with no hearing scheduled."
    roles: [LegalAdvocate]
    code: 201
    input: ["client_id", "order_type"]
    output: ProtectiveOrderCase
    side_effects: ["initializes status PETITION_DRAFTED, refile_count 0, accompanying_advocate_id null, outcome_recorded_at null, version 1"]

  - method: GET
    path: "/protective-order-cases/{id}"
    description: "Read one protective-order case with its hearing window and refile count."
    roles: [LegalAdvocate, HotlineAdvocate, AgencyAdmin]
    code: 200
    input: []
    output: ProtectiveOrderCase
    side_effects: []

  - method: GET
    path: "/protective-order-cases"
    description: "List protective-order cases filterable by client and accompanying advocate. Ordered created_at ASC."
    roles: [LegalAdvocate, HotlineAdvocate, AgencyAdmin]
    code: 200
    input: ["client_id?", "accompanying_advocate_id?", "status?", "limit?", "offset?"]
    output: ProtectiveOrderCase[]
    side_effects: []

  - method: POST
    path: "/protective-order-cases/{id}/file"
    description: "File the petition and commit an advocate to court accompaniment. The hearing window is checked against that advocate's other filed hearings expanded by a 60-minute travel buffer on both sides."
    roles: [LegalAdvocate]
    code: 200
    input: ["filed_court", "hearing_start_utc", "hearing_end_utc", "accompanying_advocate_id"]
    output: ProtectiveOrderCase
    side_effects:
      - "sets status FILED and records filed_court, the hearing window and accompanying_advocate_id"
      - "sets Client.protective_order_active to true and recomputes Client.confidentiality_posture"
      - "increments ProtectiveOrderCase.version and Client.version by 1 each"

  - method: POST
    path: "/protective-order-cases/{id}/record-outcome"
    description: "Record the hearing outcome. outcome GRANTED ends the case; outcome DENIED returns it to PETITION_DRAFTED while refile_count < 2 and lands on DENIED_FINAL once refile_count == 2."
    roles: [LegalAdvocate]
    code: 200
    input: ["outcome"]
    output: ProtectiveOrderCase
    side_effects:
      - "GRANTED: sets status GRANTED and outcome_recorded_at, keeps the hearing window and keeps Client.protective_order_active true"
      - "DENIED with refile_count < 2: increments refile_count, sets status PETITION_DRAFTED, clears filed_court, both hearing timestamps and accompanying_advocate_id"
      - "DENIED with refile_count == 2: sets status DENIED_FINAL and clears the hearing window and accompanying_advocate_id"
      - "recomputes Client.protective_order_active and Client.confidentiality_posture"
      - "increments ProtectiveOrderCase.version and Client.version by 1 each"

  # --- Landlord engagement and housing referrals ------------------------------
  - method: POST
    path: "/landlord-partners"
    description: "Register a landlord partner with its pledged units, accepted subsidy type and base engagement incentive."
    roles: [HousingSpecialist, AgencyAdmin]
    code: 201
    input: ["name", "units_pledged", "accepts_subsidy_type", "base_incentive_cents"]
    output: LandlordPartner
    side_effects: ["initializes units_committed 0, units_available = units_pledged, engagement_score 0.0, incentive_tier BASE, incentive_accrued_cents 0, version 1"]

  - method: GET
    path: "/landlord-partners/{id}"
    description: "Read a landlord partner with its live engagement score, tier and accrued incentive. Returns version for OCC use."
    roles: [HousingSpecialist, AgencyAdmin]
    code: 200
    input: []
    output: LandlordPartner
    side_effects: []

  - method: POST
    path: "/housing-referrals"
    description: "Refer a client to a landlord partner for transitional housing or rapid rehousing. Requires an ACTIVE safety plan and a subsidy type the partner accepts."
    roles: [HousingSpecialist]
    code: 201
    input: ["client_id", "landlord_partner_id", "program_type", "subsidy_type"]
    output: HousingReferral
    side_effects:
      - "sets created_by_staff_id to X-User-ID and initializes status SUBMITTED, incentive_fee_cents null, incentive_tier_applied null, rejection_reason null, withdraw_count 0, version 1"

  - method: GET
    path: "/housing-referrals/{id}"
    description: "Read one housing referral with its locked incentive fee and tier."
    roles: [HousingSpecialist, AgencyAdmin]
    code: 200
    input: []
    output: HousingReferral
    side_effects: []

  - method: GET
    path: "/housing-referrals"
    description: "List housing referrals filterable by client, landlord partner and creator. Ordered created_at ASC."
    roles: [HousingSpecialist, AgencyAdmin]
    code: 200
    input: ["client_id?", "landlord_partner_id?", "created_by_staff_id?", "status?", "limit?", "offset?"]
    output: HousingReferral[]
    side_effects: []

  - method: POST
    path: "/housing-referrals/{id}/match"
    description: "Match a submitted referral to the partner's unit and lock the incentive fee from the partner's pre-commit engagement score. OCC-guarded on LandlordPartner.version (§1.2.1 referral-match-stale-landlord)."
    roles: [HousingSpecialist]
    code: 200
    input: ["monthly_rent_cents", "expected_landlord_partner_version"]
    output: HousingReferral
    side_effects:
      - "sets status MATCHED and monthly_rent_cents"
      - "locks incentive_fee_cents and incentive_tier_applied from calculation landlord_engagement_incentive read before the commitment"
      - "raises the partner's units_committed and incentive_accrued_cents, lowers units_available, then re-derives engagement_score and incentive_tier"
      - "increments HousingReferral.version and LandlordPartner.version by 1 each"

  - method: POST
    path: "/housing-referrals/{id}/withdraw-match"
    description: "Withdraw a match and restore both landlord invariants."
    roles: [HousingSpecialist]
    code: 200
    input: ["withdraw_reason"]
    output: HousingReferral
    side_effects:
      - "sets status back to SUBMITTED, increments withdraw_count and clears incentive_fee_cents and incentive_tier_applied"
      - "lowers the partner's units_committed and incentive_accrued_cents, raises units_available, then re-derives engagement_score and incentive_tier"
      - "increments HousingReferral.version and LandlordPartner.version by 1 each"

  - method: POST
    path: "/housing-referrals/{id}/lease"
    description: "Record the signed lease. The client exits agency services."
    roles: [HousingSpecialist]
    code: 200
    input: ["lease_start_date"]
    output: HousingReferral
    side_effects:
      - "sets status LEASED and lease_start_date, leaving the locked fee and the partner ledger untouched"
      - "sets Client.status to EXITED"
      - "increments HousingReferral.version and Client.version by 1 each"

  # --- Confidentiality, disclosure and mandated reporting ---------------------
  - method: POST
    path: "/disclosure-events"
    description: "Log a request to share client information - a partner-agency request, a court subpoena, a homeless-data-system export or a mandated report. MANDATED_REPORT sets a 24-hour decision deadline."
    roles: [PrivacyOfficer, HotlineAdvocate, LegalAdvocate, ShelterManager]
    code: 201
    input: ["client_id", "requested_by_staff_id", "kind", "requester_org", "requested_field_keys", "roi_signed_on?", "roi_expires_on?"]
    output: DisclosureEvent
    side_effects:
      - "initializes status REQUESTED, released_field_keys [], suppressed_field_keys [], decided_by_staff_id null, decided_at null, late_filed false, version 1"
      - "sets decision_deadline_utc to created_at plus 24 hours when kind == MANDATED_REPORT, otherwise null"

  - method: GET
    path: "/disclosure-events/{id}"
    description: "Read one disclosure event with its released and suppressed key projections."
    roles: [PrivacyOfficer, LegalAdvocate, AgencyAdmin]
    code: 200
    input: []
    output: DisclosureEvent
    side_effects: []

  - method: GET
    path: "/disclosure-events"
    description: "List disclosure events filterable by client, requester and decider. Ordered created_at ASC."
    roles: [PrivacyOfficer, LegalAdvocate, AgencyAdmin]
    code: 200
    input: ["client_id?", "requested_by_staff_id?", "decided_by_staff_id?", "kind?", "status?", "limit?", "offset?"]
    output: DisclosureEvent[]
    side_effects: []

  - method: POST
    path: "/disclosure-events/{id}/decide"
    description: "Decide a requested disclosure. decision is RELEASE or DENY; DENY requires denial_reason. The deciding officer may not be the requester. The released and suppressed key sets are computed by the projection, never supplied by the caller."
    roles: [PrivacyOfficer]
    code: 200
    input: ["decision", "denial_reason?"]
    output: DisclosureEvent
    side_effects:
      - "runs calculation disclosure_field_projection over requested_field_keys to fill released_field_keys and suppressed_field_keys"
      - "sets status RELEASED when nothing is suppressed, PARTIALLY_RELEASED when something is, DENIED on decision DENY"
      - "sets decided_by_staff_id to X-User-ID and decided_at to the logical clock reading"
      - "sets late_filed to true when kind == MANDATED_REPORT and decided_at is strictly after decision_deadline_utc"
      - "recomputes Client.confidentiality_posture when kind == HMIS_EXPORT and the decision is DENY, which pins the client at SEALED"
      - "increments DisclosureEvent.version and Client.version by 1 each"

  # --- Test-driving endpoint --------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. The startup default is 2026-08-01T00:00:00Z and the clock never falls back to wall-clock time; the value may only move forward or stay equal."
    roles: [AgencyAdmin]
    code: 200
    input: ["to_iso8601"]
    output:
      current_utc: datetime
      expired_screening_request_count: integer
      restaffed_posture_count: integer
    side_effects:
      - "expires every WAITLISTED ScreeningRequest whose requested_entry_date plus 14 days at 00:00:00Z is strictly before the new reading, clearing waitlist_position and renumbering the survivors"
      - "recomputes secondary_trauma_index and wellness_posture for every StaffMember, since the wellness-check decay factor is clock-relative; restaffed_posture_count counts the members whose wellness_posture changed"
      - "increments the version of every ScreeningRequest and StaffMember it changes by 1"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- authentication and authorization ---------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The X-User-Role value is not listed in the called endpoint's roles"
  - id: ERR_SELF_DECISION_FORBIDDEN
    http: 403
    condition: "The acting staff id equals the screening request's created_by_staff_id or the disclosure event's requested_by_staff_id"
  - id: ERR_NOT_PLAN_AUTHOR
    http: 403
    condition: "A safety-plan or component operation is attempted by someone other than the plan's authored_by_staff_id"

  # --- request shape ----------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required field missing, unknown enum value, number outside its declared range, malformed date or datetime, or requested_field_keys empty, over ten elements, duplicated, or containing a key outside the projection vocabulary"

  # --- existence --------------------------------------------------------------
  - id: ERR_STAFF_MEMBER_NOT_FOUND
    http: 404
    condition: "No StaffMember with the given id, in a path segment or in a body foreign key"
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "No Client with the given id"
  - id: ERR_HOTLINE_CALL_NOT_FOUND
    http: 404
    condition: "No HotlineCall with the given id"
  - id: ERR_RISK_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "based_on_risk_assessment_id names no RiskAssessment"
  - id: ERR_SAFETY_PLAN_NOT_FOUND
    http: 404
    condition: "No SafetyPlan with the given id"
  - id: ERR_PLAN_COMPONENT_NOT_FOUND
    http: 404
    condition: "No PlanComponent with the given component_id on that plan"
  - id: ERR_SHELTER_NOT_FOUND
    http: 404
    condition: "No Shelter with the given id, in a path segment or as requested_shelter_id"
  - id: ERR_SHELTER_UNIT_NOT_FOUND
    http: 404
    condition: "No ShelterUnit with the given id, as shelter_unit_id or as new_shelter_unit_id"
  - id: ERR_SCREENING_REQUEST_NOT_FOUND
    http: 404
    condition: "No ScreeningRequest with the given id"
  - id: ERR_SHELTER_ADMISSION_NOT_FOUND
    http: 404
    condition: "No ShelterAdmission with the given id"
  - id: ERR_PROTECTIVE_ORDER_CASE_NOT_FOUND
    http: 404
    condition: "No ProtectiveOrderCase with the given id"
  - id: ERR_LANDLORD_PARTNER_NOT_FOUND
    http: 404
    condition: "No LandlordPartner with the given id or landlord_partner_id"
  - id: ERR_HOUSING_REFERRAL_NOT_FOUND
    http: 404
    condition: "No HousingReferral with the given id"
  - id: ERR_DISCLOSURE_EVENT_NOT_FOUND
    http: 404
    condition: "No DisclosureEvent with the given id"

  # --- optimistic concurrency -------------------------------------------------
  - id: ERR_CROSS_REFERENCE_MISMATCH
    http: 422
    condition: "A body foreign key resolves to a row owned by a different client - a hotline call of another client on POST /screening-requests, or a risk assessment of another client on POST /safety-plans"

  - id: ERR_STALE_UNIT_VERSION
    http: 412
    condition: "expected_shelter_unit_version does not equal the named unit's current version"
  - id: ERR_STALE_CLIENT_VERSION
    http: 412
    condition: "expected_client_version does not equal the named client's current version"
  - id: ERR_STALE_LANDLORD_VERSION
    http: 412
    condition: "expected_landlord_partner_version does not equal the partner's current version"

  # --- state ------------------------------------------------------------------
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "The target row is not in a state from which the requested transition is declared in §1.2"
  - id: ERR_SCREENING_NOT_APPROVED
    http: 409
    condition: "POST /shelter-admissions names a ScreeningRequest whose status is not APPROVED"
  - id: ERR_LOCATION_COMPROMISED
    http: 409
    condition: "Check-in attempted on an admission whose location_security_status is COMPROMISED"
  - id: ERR_PLAN_HAS_BLOCKED_COMPONENT
    http: 409
    condition: "Reactivate attempted while at least one PlanComponent of the plan is BLOCKED"
  - id: ERR_PLAN_HAS_NO_COMPONENTS
    http: 422
    condition: "Activate attempted on a plan with zero PlanComponent rows"

  # --- safety and compliance --------------------------------------------------
  - id: ERR_CONFIDENTIALITY_HOLD
    http: 409
    condition: "A disclosure release, a housing match, or the implementation of a BLOCKED plan component is attempted for a client whose confidentiality_posture is SEALED"
  - id: ERR_IMMINENT_RISK_REFERRAL_FORBIDDEN
    http: 409
    condition: "Disposition RESOURCE_REFERRED attempted while the client's current_risk_band is IMMINENT"
  - id: ERR_ADVOCATE_FROZEN
    http: 409
    condition: "A StaffMember whose wellness_posture is FROZEN is named as assigned_advocate_id or accompanying_advocate_id"
  - id: ERR_HMIS_CONSENT_ABSENT
    http: 409
    condition: "A HMIS_EXPORT disclosure release is attempted while the client's hmis_disclosure_consent is DENIED or REVOKED"

  # --- referential and temporal -----------------------------------------------
  - id: ERR_ROI_EXPIRED
    http: 409
    condition: "A PARTNER_AGENCY or COURT_SUBPOENA release is attempted with roi_expires_on absent or earlier than the logical clock date"
  - id: ERR_NO_ACTIVE_SAFETY_PLAN
    http: 409
    condition: "A housing referral is created or matched while the client has no SafetyPlan in status ACTIVE"
  - id: ERR_SUBSIDY_TYPE_MISMATCH
    http: 422
    condition: "The referral's subsidy_type differs from the partner's accepts_subsidy_type"
  - id: ERR_DUPLICATE_ADMISSION
    http: 409
    condition: "A second ShelterAdmission in a status other than CANCELLED is created for the same screening_request_id"
  - id: ERR_INVALID_DATE_WINDOW
    http: 422
    condition: "hearing_start_utc not before hearing_end_utc, hearing_start_utc not after the clock, entry_date not before planned_exit_date, actual_exit_date not after entry_date, lease_start_date before the clock date, or checked_on_utc after the clock"
  - id: ERR_ADVOCATE_DOUBLE_BOOKED
    http: 409
    condition: "The advocate's buffered hearing windows overlap or touch, using a 60-minute travel buffer on both sides"
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "POST /_clock/set_current_utc names an instant earlier than the current logical clock reading"

  # --- constraint and capacity ------------------------------------------------
  - id: ERR_UNIT_ACCESSIBILITY_MISMATCH
    http: 422
    condition: "A household with accessibility_required true is placed in a unit whose unit_type is not ADA_ACCESSIBLE"
  - id: ERR_UNIT_COMPOSITION_MISMATCH
    http: 422
    condition: "A household with minor_children_count greater than zero is placed in a STANDARD unit"
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "A second PlanComponent of the same component_type on one plan, a duplicate unit_label within a shelter, or a duplicate client_code"
  - id: ERR_SAME_UNIT_RELOCATION
    http: 422
    condition: "complete-relocation names the unit the admission already occupies"
  - id: ERR_SHELTER_FULL
    http: 409
    condition: "A screening request is approved into a shelter whose capacity_posture is FULL"
  - id: ERR_CASELOAD_LIMIT_EXCEEDED
    http: 409
    condition: "The named advocate's active_caseload_count already equals or exceeds max_caseload"
  - id: ERR_UNIT_CAPACITY_EXCEEDED
    http: 409
    condition: "The aggregate household_size of the overlapping stay windows on the unit plus the requesting household exceeds bed_capacity"
  - id: ERR_LANDLORD_NO_UNITS_AVAILABLE
    http: 409
    condition: "A match is attempted against a partner whose units_available is zero"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: HotlineAdvocate
    description: "Crisis-line advocate: takes calls, scores lethality risk, disposes calls down one of three branches, and authors and maintains safety plans."
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /clients"
      - "POST /hotline-calls"
      - "POST /hotline-calls/{id}/risk-assessments"
      - "POST /hotline-calls/{id}/dispose"
      - "POST /screening-requests"
      - "POST /safety-plans"
      - "POST /safety-plans/{id}/components"
      - "POST /safety-plans/{id}/components/{component_id}/implement"
      - "POST /safety-plans/{id}/activate"
      - "POST /safety-plans/{id}/revise"
      - "POST /safety-plans/{id}/reactivate"
    shared_operations:
      - "GET /clients/{id}"
      - "GET /hotline-calls/{id}"
      - "GET /hotline-calls"
      - "GET /hotline-calls/{id}/risk-assessments"
      - "GET /safety-plans/{id}"
      - "GET /safety-plans"
      - "GET /safety-plans/{id}/components"
      - "GET /shelters/{id}"
      - "GET /shelters/{id}/units"
      - "GET /shelter-units/{id}"
      - "GET /screening-requests/{id}"
      - "GET /screening-requests"
      - "GET /shelter-admissions/{id}"
      - "GET /shelter-admissions"
      - "GET /protective-order-cases/{id}"
      - "GET /protective-order-cases"
      - "GET /staff-members/{id}"
      - "POST /disclosure-events"

  - name: ShelterManager
    description: "Runs shelter capacity: decides screening requests, places and moves households, and records wellness checks for staff."
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /screening-requests/{id}/decide"
      - "POST /shelter-admissions"
      - "POST /shelter-admissions/{id}/check-in"
      - "POST /shelter-admissions/{id}/exit"
      - "POST /shelter-admissions/{id}/cancel"
      - "POST /shelter-admissions/{id}/report-location-compromise"
      - "POST /shelter-admissions/{id}/complete-relocation"
    shared_operations:
      - "POST /shelters"
      - "POST /shelters/{id}/units"
      - "POST /staff-members/{id}/wellness-checks"
      - "GET /staff-members/{id}"
      - "GET /staff-members/{id}/wellness-checks"
      - "GET /clients/{id}"
      - "GET /hotline-calls/{id}"
      - "GET /hotline-calls"
      - "GET /hotline-calls/{id}/risk-assessments"
      - "GET /safety-plans/{id}"
      - "GET /safety-plans"
      - "GET /safety-plans/{id}/components"
      - "GET /shelters/{id}"
      - "GET /shelters/{id}/units"
      - "GET /shelter-units/{id}"
      - "GET /screening-requests/{id}"
      - "GET /screening-requests"
      - "GET /shelter-admissions/{id}"
      - "GET /shelter-admissions"
      - "POST /disclosure-events"

  - name: LegalAdvocate
    description: "Handles protective-order petitions, hearing scheduling and court accompaniment, and criminal-justice navigation."
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /protective-order-cases"
      - "POST /protective-order-cases/{id}/file"
      - "POST /protective-order-cases/{id}/record-outcome"
    shared_operations:
      - "GET /protective-order-cases/{id}"
      - "GET /protective-order-cases"
      - "GET /clients/{id}"
      - "GET /staff-members/{id}"
      - "GET /disclosure-events/{id}"
      - "GET /disclosure-events"
      - "POST /disclosure-events"

  - name: HousingSpecialist
    description: "Cultivates landlord partners and drives transitional-housing and rapid-rehousing referrals to lease."
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /housing-referrals"
      - "POST /housing-referrals/{id}/match"
      - "POST /housing-referrals/{id}/withdraw-match"
      - "POST /housing-referrals/{id}/lease"
    shared_operations:
      - "POST /landlord-partners"
      - "GET /landlord-partners/{id}"
      - "GET /housing-referrals/{id}"
      - "GET /housing-referrals"
      - "GET /clients/{id}"
      - "GET /safety-plans/{id}"
      - "GET /safety-plans"
      - "GET /safety-plans/{id}/components"
      - "GET /shelters/{id}"
      - "GET /shelter-admissions/{id}"
      - "GET /shelter-admissions"
      - "GET /staff-members/{id}"

  - name: PrivacyOfficer
    description: "Guards confidentiality: decides every disclosure request and records consent changes for homeless-data-system participation."
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /disclosure-events/{id}/decide"
      - "POST /clients/{id}/consent"
    shared_operations:
      - "POST /disclosure-events"
      - "GET /disclosure-events/{id}"
      - "GET /disclosure-events"
      - "GET /clients/{id}"
      - "GET /staff-members/{id}"

  - name: AgencyAdmin
    description: "Operational administrator: onboards staff, opens shelters and landlord partners, reads everything, and drives the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /staff-members"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /clients"
      - "POST /clients/{id}/consent"
      - "POST /shelters"
