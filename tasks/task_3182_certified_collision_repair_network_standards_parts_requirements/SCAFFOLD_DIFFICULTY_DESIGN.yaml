    grounds:
    - validations[priority=5]
    - validations[priority=8]
    - errors[ERR_INVALID_STATE]
    - errors[ERR_PRE_SCAN_REQUIRED]
    distinguishing_aspect: 'Category pair (state vs business_safety): an approve call on an order

      that is BOTH in the wrong state (IN_REPAIR, not ESTIMATE) AND missing

      its PRE_SCAN must return the state error ERR_INVALID_STATE (priority 5

      beats priority 8).

      '
    test_recipe:
      setup:
      - "CERTIFIED shop; non-ADAS order approved WITHOUT pre-scan is impossible, so instead: order already APPROVED and started (IN_REPAIR); it has NO PRE_SCAN? \u2014 approve already passed, so PRE_SCAN\
        \ existed. To create the dual failure deterministically the order is left in ESTIMATE for trigger 1 (ERR_PRE_SCAN_REQUIRED alone), then a second order in IN_REPAIR receives an approve call (wrong\
        \ state) \u2014 that order DID have a pre-scan, so to force BOTH failures on one request we call approve on the ESTIMATE order twice: first call fails pre-scan; then a pre-scan is recorded and approve\
        \ succeeds; then a THIRD approve call hits IN_REPAIR... simpler: dual failure = approve on an order in VOIDED state (wrong state) that never had a pre-scan."
      - Order O1 in VOIDED (voided from ESTIMATE) with NO ProcedureStep rows
