              as: ComplianceOfficer
              captures: { sa_id: $.data.id }
            - call: "POST /selling-agreements/${sa_id}/status"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /investors"
              payload: { legal_name: "Lena Marchetti", email: "lena.marchetti@example.com", state_code: "TX", net_worth_cents: 2600000, annual_income_cents: 900000 }
              as: SponsorOperator
              captures: { tx_id: $.data.id, tx_basis_limit: $.data.concentration_limit_cents }
            - call: "POST /investors/${tx_id}/suitability-documentation"
              payload: { documentation_reference: "SUIT-LENA-2026-08" }
              as: ComplianceOfficer
            - call: "POST /investors"
              payload: { legal_name: "Milo Bergstrom", email: "milo.bergstrom@example.com", state_code: "OH", net_worth_cents: 2600000, annual_income_cents: 2500000 }
              as: SponsorOperator
              captures: { oh_id: $.data.id, oh_basis_limit: $.data.concentration_limit_cents }
            - call: "POST /investors/${oh_id}/suitability-documentation"
              payload: { documentation_reference: "SUIT-MILO-2026-08" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /subscriptions"
              payload: { offering_id: "${off_id}", share_class_id: "${sc_id}", investor_id: "${tx_id}", selling_agreement_id: "${sa_id}", gross_investment_cents: 260001 }
              as: SponsorOperator
              captures: { tx_over_error: $.error.error_id }
            - call: "POST /subscriptions"
              payload: { offering_id: "${off_id}", share_class_id: "${sc_id}", investor_id: "${tx_id}", selling_agreement_id: "${sa_id}", gross_investment_cents: 260000 }
              as: SponsorOperator
              captures: { tx_at_id: $.data.id, tx_at_status: $.data.status }
            - call: "POST /subscriptions"
