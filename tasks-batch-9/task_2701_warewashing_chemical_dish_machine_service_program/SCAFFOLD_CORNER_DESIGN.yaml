      - name: the_adjusted_dose_requirement_depends_on_the_drift_verdict_computed_first
        claim_type: Cascading validation
        grounds:
          - validations.adjusted_dose_required_when_out_of_tolerance
          - calculations.concentration_drift_verdict
          - errors[ERR_ADJUSTED_DOSE_REQUIRED]
        distinguishing_aspect: |
          Whether adjusted_dose_ml_per_rack is required is not a property of the request - it is the
          output of the drift calculation that must run first. 1344 ppm against a 1200 ppm target is
          drift 12.00, outside the 10.00 tolerance, so the field becomes mandatory and its absence is
          ERR_ADJUSTED_DOSE_REQUIRED (422); 1320 ppm is drift exactly 10.00, verdict PASS, and the same
          payload shape is accepted. A dependent check that runs before its input is computed cannot
          distinguish these two requests.
        test_recipe:
          setup:
            - "One IN_PROGRESS visit on an INSTALLED DT-88 placement with one ACTIVE DET-100 dispenser (target 1200 ppm, tolerance 10.00)."
          setup_api_calls:
