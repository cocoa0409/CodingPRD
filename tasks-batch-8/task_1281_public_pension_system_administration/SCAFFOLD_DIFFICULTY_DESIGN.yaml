  - rule_id: priority_pair_validation_conflict
    instances:
      - name: approve_cancelled_application_with_outstanding_balance_state_wins
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_OUTSTANDING_BALANCE]
        distinguishing_aspect: |
          Error-category pair state(4) vs business_fiscal(9): the application is
          CANCELLED (state violation) AND the member has a PLAN_ACTIVE purchase
          (fiscal violation) — the state error ERR_INVALID_STATE must win.
          Companion instance accept_expired_quote_with_overlapping_period uses the
          temporal vs constraint pair.
        test_recipe:
          setup:
            - "Vested member (6.0 years, salary 6,000,000) with a PLAN_ACTIVE purchase (ACTUARIAL quote 2,640,000 = 6,000,000 x 2.0 x 0.22, balance 2,640,000)"
