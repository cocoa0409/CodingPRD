  - rule_id: transitive_cascade
    instances:
      - name: cascade_a_failed_reinspection_revokes_pto_suspends_enrollment_cancels_performance
        grounds:
          - state_machines.Permit.INSPECTION_PASSED_to_INSPECTION_FAILED
          - state_machines.InterconnectionApplication.PTO_GRANTED_to_SUPPLEMENTAL_REVIEW
          - state_machines.BatterySystem.grid_status.PTO_GRANTED_to_APPLICATION_SUBMITTED
          - state_machines.ByodEnrollment.ENROLLED_to_SUSPENDED
          - state_machines.DispatchPerformance.PENDING_to_CANCELLED
          - entities.DispatchEvent.fields.enrolled_pledged_kw
        distinguishing_aspect: |
          One authority write propagates five hops, each caused by the previous one: permit ->
          INSPECTION_FAILED forces the application out of PTO_GRANTED into SUPPLEMENTAL_REVIEW, which drags the
          system's grid_status back to APPLICATION_SUBMITTED, which suspends the BYOD enrollment, which cancels
          its PENDING dispatch performance and returns 5.0 kW to the event's enrolled_pledged_kw ledger — while
          build_status stays COMMISSIONED throughout.
        test_recipe:
          setup:
            - "A 2-unit PWX_A system is COMMISSIONED with grid_status PTO_GRANTED and an INSPECTION_PASSED permit."
            - "The system is ENROLLED in SUMMER_2026 with pledged_kw 5.0 and homeowner consent recorded."
            - "A 2 h ECONOMIC dispatch event has one PENDING performance for that enrollment, so the event's enrolled_pledged_kw is 5.0."
          setup_api_calls:
            - call: "POST /installers"
              payload: { company_name: "Volt Home Energy", certification_level: "ADVANCED", certified_model_codes: ["PWX_A", "PWX_B", "PWX_C"], certification_expires_on: "2027-06-30" }
