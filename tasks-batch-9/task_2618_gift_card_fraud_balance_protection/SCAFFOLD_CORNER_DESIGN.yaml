      - name: ledger_event_is_immutable_with_no_version_and_no_write_endpoint
        claim_type: immutability
        grounds:
          - entities.LedgerEvent.fields.type
          - endpoints[GET /ledger-events/{id}]
          - endpoints[POST /ledger-events/{id}/reverse]
        distinguishing_aspect: "LedgerEvent is declared common_fields: false, so GET /ledger-events/{id} returns no version and no updated_at, and §1.5 exposes no PUT, PATCH or DELETE for it — correction happens only by appending a REDEMPTION_REVERSAL."
        test_recipe:
          setup:
            - "One RetailStore, one CardRack, one ACTIVE PHYSICAL GiftCard with face value 6000 cents, and one redemption of 1000 cents."
