  # ---- FeeReconciliation
  - method: POST
    path: "/fee-reconciliations"
    description: "Reconciles a completed lease year: aggregates the year's accepted and restated periods, prices them on the annual tier ladder, applies the (possibly prorated) minimum annual guarantee and invoices or credits the difference against what was remitted. Carries expected_lease_version — the Lease.version the client last observed (see §1.2.1)."
    roles: [ContractingOfficer]
    code: 201
    input: [lease_id, expected_lease_version, lease_year_start, lease_year_end]
    output: FeeReconciliation
    side_effects: ["FeeReconciliation created by calculations.annual_fee_reconciliation, in PENDING_PAYMENT when additional_fee_due_cents > 0 and in CREDIT_ISSUED otherwise", "any existing PENDING_PAYMENT reconciliation for the same lease and lease_year_start transitions to SUPERSEDED with superseded_by_id set to the new row", "Lease.outstanding_fee_balance_cents recomputed", "increments Lease.version by 1"]
  - method: POST
    path: "/fee-reconciliations/{id}/settle"
    description: "The concessionaire pays the reconciliation in full; a payment that does not match additional_fee_due_cents exactly is rejected."
    roles: [Concessionaire]
    code: 200
    input: [payment_amount_cents]
    output: FeeReconciliation
    side_effects: ["status PENDING_PAYMENT -> SETTLED", "Lease.outstanding_fee_balance_cents recomputed", "when audit_engagement_id is set and that audit is FINAL, the audit transitions FINAL -> CLOSED", "increments FeeReconciliation.version by 1"]
  - method: GET
    path: "/fee-reconciliations"
    description: "Lists fee reconciliations; filter by lease, by the audit that minted the row, or by the row that superseded it."
    roles: [ProgramAdministrator, ConcessionSpecialist, ContractingOfficer, EvaluationPanelist, AuditorGeneral, Concessionaire]
    code: 200
    input: ["lease_id?", "audit_engagement_id?", "superseded_by_id?", "status?", "limit?", "offset?"]
    output: FeeReconciliation[]
    side_effects: []
  - method: GET
    path: "/fee-reconciliations/{id}"
    description: "Reads one reconciliation including base_delta_cents, penalty_cents, interest_cents and additional_fee_due_cents."
    roles: [ProgramAdministrator, ConcessionSpecialist, ContractingOfficer, EvaluationPanelist, AuditorGeneral, Concessionaire]
    code: 200
    input: []
    output: FeeReconciliation
    side_effects: []

  # ---- AuditEngagement
  - method: POST
    path: "/audit-engagements"
    description: "The auditor general opens an audit of a reporting window under the lease's audit-rights clause."
    roles: [AuditorGeneral]
    code: 201
    input: [lease_id, audit_period_start, audit_period_end, scope_note]
    output: AuditEngagement
    side_effects: ["AuditEngagement created in OPENED"]
  - method: POST
    path: "/audit-engagements/{id}/begin-fieldwork"
    description: "Begins fieldwork, freezing reported_gross_receipts_cents as the sum of the accepted periods inside the window."
    roles: [AuditorGeneral]
    code: 200
    input: []
    output: AuditEngagement
    side_effects: ["status OPENED -> FIELDWORK", "reported_gross_receipts_cents frozen", "increments AuditEngagement.version by 1"]
  - method: POST
    path: "/audit-engagements/{id}/issue-findings"
    description: "Issues findings with the substantiated gross receipts. underreport_pct and penalty_applies are computed here; nothing is restated yet."
    roles: [AuditorGeneral]
    code: 200
    input: [adjusted_gross_receipts_cents, finding_note]
    output: AuditEngagement
    side_effects: ["status FIELDWORK -> FINDINGS_ISSUED", "adjusted_gross_receipts_cents and finding_note persisted", "underreport_pct and penalty_applies set by calculations.audit_underreport_assessment", "increments AuditEngagement.version by 1"]
  - method: POST
    path: "/audit-engagements/{id}/contest"
    description: "The concessionaire contests the findings."
    roles: [Concessionaire]
    code: 200
    input: [contest_basis]
    output: AuditEngagement
    side_effects: ["status FINDINGS_ISSUED -> CONTESTED", "contest_basis persisted", "increments AuditEngagement.version by 1"]
  - method: POST
    path: "/audit-engagements/{id}/finalize"
    description: "Finalizes the audit and runs the four-hop restatement cascade: periods are restated, the lease year's reconciliation is superseded by an audit reconciliation carrying penalty and interest, the lease's outstanding balance is recomputed, and a deficiency notice is issued when that balance clears the threshold."
    roles: [AuditorGeneral]
    code: 200
    input: []
    output: AuditEngagement
    side_effects: ["status FINDINGS_ISSUED|CONTESTED -> FINAL", "hop 1: each ACCEPTED report inside the window becomes RESTATED with its allocated restated_receipts_cents", "hop 2: the lease year's PENDING_PAYMENT reconciliation becomes SUPERSEDED and a replacement is minted with audit_engagement_id, penalty_cents and interest_cents", "hop 3: Lease.outstanding_fee_balance_cents recomputed", "hop 4: when that balance exceeds DEFICIENCY_NOTICE_THRESHOLD_CENTS, Lease.compliance_status COMPLIANT -> DEFICIENT and a SYSTEM_ISSUED FEE_DELINQUENCY ComplianceAction is minted with cure_deadline = logical clock + CURE_PERIOD_DAYS", "increments AuditEngagement.version by 1"]
  - method: POST
    path: "/audit-engagements/{id}/withdraw-findings"
    description: "Withdraws a final audit and unwinds the entire restatement: the audit reconciliation is voided, the superseded one is restored, restated periods return to ACCEPTED, and the system-issued notice is rescinded."
    roles: [AuditorGeneral]
    code: 200
    input: [withdrawal_basis]
    output: AuditEngagement
    side_effects: ["status FINAL -> WITHDRAWN", "the audit's reconciliation PENDING_PAYMENT -> VOIDED", "the reconciliation it superseded SUPERSEDED -> PENDING_PAYMENT with superseded_by_id cleared", "each RESTATED report inside the window returns to ACCEPTED with restated_receipts_cents null", "the SYSTEM_ISSUED notice on the voided row becomes RESCINDED", "Lease.outstanding_fee_balance_cents recomputed and compliance_status DEFICIENT -> COMPLIANT when no notice remains", "withdrawal_basis persisted", "increments AuditEngagement.version by 1"]
  - method: GET
    path: "/audit-engagements"
    description: "Lists audit engagements; filter by lease."
    roles: [ProgramAdministrator, ConcessionSpecialist, ContractingOfficer, EvaluationPanelist, AuditorGeneral, Concessionaire]
    code: 200
    input: ["lease_id?", "status?", "limit?", "offset?"]
    output: AuditEngagement[]
    side_effects: []
  - method: GET
    path: "/audit-engagements/{id}"
    description: "Reads one audit including reported and adjusted receipts, underreport_pct and penalty_applies."
    roles: [ProgramAdministrator, ConcessionSpecialist, ContractingOfficer, EvaluationPanelist, AuditorGeneral, Concessionaire]
    code: 200
    input: []
    output: AuditEngagement
    side_effects: []

  # ---- ComplianceAction
  - method: POST
    path: "/compliance-actions"
    description: "The agency issues a notice of deficiency with a cure deadline, optionally tied to the unpaid reconciliation that provoked it."
    roles: [ContractingOfficer]
    code: 201
    input: [lease_id, action_type, deficiency_note, cure_deadline, "reconciliation_id?"]
