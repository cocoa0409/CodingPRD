# =============================================================================
# PRD Benchmark Seed Tables — Structural Steel Fabricator & Erector
# =============================================================================

scenario: |
  Structural Steel Fabricator & Erector (AISC-certified fabricator): shop drawing
  & detailer approval cycle, mill order & advance-bill of material, piece-mark
  tracking & sequence release, weld procedure & welder qualification, AISC
  certification & inspection hold, shipping load list & erection sequence,
  field fix/backcharge, retainage & progress payment

domain_name: structural-steel-fabrication
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - version_pinning_on_approval
    - derived_field_reconciliation
  entity_topology: flat            # all 12 entities are top-level collections linked by FKs in request bodies
  state_machine_shape: cyclic      # Piece rework loop and Weld repair loop; compound bubble-ups on Sequence/Job
  relationship_patterns:
    - one_to_many                  # Job -> drawings/pieces/loads/billings/...
    - self_referential             # ShopDrawing.supersedes_id -> ShopDrawing.id (revision chain DAG)
    - polymorphic                  # Inspection targets piece_id XOR weld_id XOR job-only (AISC audit)
    - cross_aggregate              # Piece pins an approved ShopDrawing revision; Load lines reference Pieces
  role_model: segregation_of_duties  # detailer != drawing approver; welder != weld inspector
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Job
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Job / project name" }
      - { name: contract_value_cents, type: integer, source: input, description: "Contract value in cents; must be > 0" }
      - { name: billing_basis, type: enum, source: input, description: "WEIGHT | COUNT — selects the percent-complete variant used by all billings for this job" }
      - { name: requires_aisc_hold, type: boolean, source: input, default: false, description: "When true, load shipment is blocked until a PASSED non-VOIDED AISC_AUDIT inspection exists for the job" }
      - { name: status, type: enum, source: system, description: "ESTIMATING | AWARDED | FABRICATING | ERECTING | COMPLETE" }
      - { name: total_weight_lbs, type: integer, source: computed, description: "Sum of weight_lbs over all Pieces of the job" }
      - { name: erected_weight_lbs, type: integer, source: computed, description: "Sum of weight_lbs over Pieces of the job with status ERECTED" }
      - { name: pct_complete, type: number, source: computed, description: "Per piece_percent_complete using job.billing_basis; 4 decimal places" }
      - { name: billed_to_date_cents, type: integer, source: computed, description: "Sum of net_due_cents over billings with status IN {APPROVED, PAID}" }
      - { name: retainage_held_cents, type: integer, source: computed, description: "Sum of retainage_cum_cents delta booked per billing: Σ retainage_booked_cents over billings IN {APPROVED, PAID}" }
      - { name: pending_backcharge_cents, type: integer, source: computed, description: "Sum of amount_cents over Backcharges of the job with status IN {PENDING, ACCEPTED, DISPUTED}" }
      - { name: settled_backcharge_cents, type: integer, source: computed, description: "Sum of settled_amount_cents over Backcharges of the job with status SETTLED" }
      - { name: retainage_releasable_cents, type: integer, source: computed, default: 0, description: "Set to retainage_held_cents at the moment job auto-transitions to COMPLETE" }

  - name: ShopDrawing
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id" }
      - { name: drawing_number, type: string, source: input, description: "Fabricator drawing number; (job_id, drawing_number, revision) unique" }
      - { name: revision, type: integer, source: system, description: "1 on create; revise creates a new row with revision = source.revision + 1" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | SUPERSEDED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID captured on submit; used for self-approval segregation" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID captured on decide" }
      - { name: supersedes_id, type: string, source: system, description: "FK -> ShopDrawing.id; set on rows created by revise; null on revision 1" }

  - name: MillOrder
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id" }
      - { name: material_grade, type: enum, source: input, description: "A36 | A572 | A992" }
      - { name: ordered_weight_lbs, type: integer, source: input, description: "Advance-bill-of-material order weight; must be > 0" }
      - { name: unit_price_per_cwt_cents, type: integer, source: input, description: "Mill price per hundredweight, in cents; must be > 0" }
      - { name: billing_mode, type: enum, source: input, description: "NOMINAL | ACTUAL — selects invoice variant" }
      - { name: received_weight_lbs, type: integer, source: input, description: "Scale weight recorded at receive" }
      - { name: invoice_amount_cents, type: integer, source: computed, description: "Per mill_order_invoice at receive time" }
      - { name: status, type: enum, source: system, description: "PLACED | RECEIVED" }

  - name: ErectionSequence
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id" }
      - { name: seq_number, type: integer, source: input, description: "Sequence number; unique per job" }
      - { name: status, type: enum, source: system, description: "PLANNED | RELEASED | ERECTED (ERECTED is automatic when all its pieces are ERECTED)" }

  - name: Piece
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id" }
      - { name: piece_mark, type: string, source: input, description: "Piece mark; unique per job" }
      - { name: weight_lbs, type: integer, source: input, description: "Piece weight; must be > 0" }
      - { name: drawing_id, type: string, source: input, description: "FK -> ShopDrawing.id; pinned revision the piece is detailed from" }
      - { name: sequence_id, type: string, source: input, description: "FK -> ErectionSequence.id" }
      - { name: load_id, type: string, source: system, description: "FK -> ShippingLoad.id; null until added to a load; cleared on removal" }
      - { name: stale_revision, type: boolean, source: computed, default: false, description: "True once the pinned drawing revision is SUPERSEDED and piece not yet SHIPPED/ERECTED" }
      - { name: status, type: enum, source: system, description: "DETAILED | IN_SHOP | AWAITING_INSPECTION | REWORK | INSPECTED | READY_TO_SHIP | SHIPPED | ERECTED" }

  - name: Welder
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Welder name" }
      - { name: qual_process, type: enum, source: input, description: "SMAW | FCAW | GMAW — qualified welding process" }
      - { name: qual_expires_on, type: string, source: input, description: "ISO date (YYYY-MM-DD); qualification valid through this date" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }

  - name: Weld
    parent: null
    common_fields: true
    fields:
      - { name: piece_id, type: string, source: input, description: "FK -> Piece.id" }
      - { name: welder_id, type: string, source: input, description: "FK -> Welder.id; must equal X-User-ID of the WELDER caller" }
      - { name: process, type: enum, source: input, description: "SMAW | FCAW | GMAW; must equal welder.qual_process" }
      - { name: weld_date, type: string, source: input, description: "ISO date the weld is performed; must be <= logical clock date" }
      - { name: window_start, type: string, source: input, description: "ISO8601 datetime; half-open window start" }
      - { name: window_end, type: string, source: input, description: "ISO8601 datetime; must be > window_start" }
      - { name: repair_count, type: integer, source: system, default: 0, description: "Number of repairs performed; repair rejected when repair_count >= 2" }
      - { name: status, type: enum, source: system, description: "WELDED | VISUAL_PASSED | NDT_PASSED | VISUAL_REJECTED | NDT_REJECTED" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id" }
      - { name: kind, type: enum, source: input, description: "FINAL_PIECE | WELD_VISUAL | WELD_NDT | AISC_AUDIT" }
      - { name: piece_id, type: string, source: input, description: "FK -> Piece.id; required iff kind == FINAL_PIECE" }
      - { name: weld_id, type: string, source: input, description: "FK -> Weld.id; required iff kind IN {WELD_VISUAL, WELD_NDT}" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | PASSED | FAILED | VOIDED" }
      - { name: inspector_user_id, type: string, source: system, description: "X-User-ID captured on submit" }

  - name: ShippingLoad
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id" }
      - { name: load_number, type: string, source: input, description: "Load identifier; unique per job" }
      - { name: laydown_slot, type: string, source: input, description: "Yard laydown slot code; buffered-date conflict checked across all jobs" }
      - { name: delivery_date, type: string, source: input, description: "ISO date of planned delivery" }
      - { name: trailer_capacity_lbs, type: integer, source: input, description: "Trailer capacity; must be > 0" }
      - { name: total_weight_lbs, type: integer, source: computed, default: 0, description: "Sum of weight_lbs over Pieces with load_id == this load" }
      - { name: status, type: enum, source: system, description: "STAGING | LOADING | SHIPPED" }

  - name: FieldFix
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id" }
      - { name: piece_id, type: string, source: input, description: "FK -> Piece.id; piece must be SHIPPED or ERECTED" }
      - { name: description, type: string, source: input, description: "Field problem description" }
      - { name: repair_lines, type: array, source: input, description: "Array of { labor_hours: number, labor_rate_cents: integer, material_cents: integer }; must be non-empty" }
      - { name: amount_cents, type: integer, source: computed, description: "Per backcharge_amount calculation (per-line rounding then markup)" }
      - { name: status, type: enum, source: system, description: "PRICED | APPROVED | RESOLVED" }

  - name: Backcharge
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: system, description: "FK -> Job.id; copied from the FieldFix" }
      - { name: field_fix_id, type: string, source: system, description: "FK -> FieldFix.id; created by field-fix approve" }
      - { name: amount_cents, type: integer, source: system, description: "Claim amount copied from FieldFix.amount_cents at creation" }
      - { name: settled_amount_cents, type: integer, source: input, description: "Negotiated amount recorded at settle" }
      - { name: status, type: enum, source: system, description: "PENDING | ACCEPTED | DISPUTED | SETTLED" }

  - name: ProgressBilling
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id" }
      - { name: period_label, type: string, source: input, description: "Billing period label; unique per job among non-VOIDED billings" }
      - { name: pct_complete_snapshot, type: number, source: computed, description: "Job pct_complete frozen at creation (4 dp)" }
      - { name: earned_cum_cents, type: integer, source: computed, description: "Cumulative earned value at creation" }
      - { name: retainage_cum_cents, type: integer, source: computed, description: "Cumulative retainage at creation per tiered rate" }
      - { name: retainage_booked_cents, type: integer, source: computed, description: "retainage_cum_cents minus sum of retainage_cum_cents of prior billings IN {APPROVED, PAID}" }
      - { name: net_due_cents, type: integer, source: computed, description: "Amount payable this period per net_progress_billing" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | PAID | VOIDED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID captured on submit" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Job
    initial_state: ESTIMATING
    terminal_states: [COMPLETE]
    transitions:
      - from: ESTIMATING
        to: AWARDED
        trigger: "POST /jobs/{id}/award"
        actor: FABRICATOR_ADMIN
        preconditions: []
        side_effects: ["increments Job.version"]
      - from: AWARDED
        to: FABRICATING
        trigger: "POST /jobs/{id}/start-fabrication"
        actor: FABRICATOR_ADMIN
        preconditions:
          - "At least one ShopDrawing of the job has status APPROVED (ERR_DRAWING_NOT_APPROVED)"
        side_effects: ["increments Job.version"]
      - from: FABRICATING
        to: ERECTING
        trigger: "POST /jobs/{id}/start-erection"
        actor: FABRICATOR_ADMIN
        preconditions:
          - "At least one ErectionSequence of the job has status RELEASED (ERR_SEQUENCE_NOT_RELEASED)"
        side_effects: ["increments Job.version"]
      - from: ERECTING
        to: COMPLETE
        trigger: "system (automatic compound check, re-evaluated after every piece erect, sequence auto-ERECTED, billing pay/void, backcharge settle)"
        actor: system
        preconditions:
          - "job.status == ERECTING"
          - "At least one ErectionSequence exists for the job AND every ErectionSequence has status ERECTED"
          - "At least one ProgressBilling exists for the job AND every ProgressBilling has status IN {PAID, VOIDED}"
          - "Every Backcharge of the job has status SETTLED (vacuously true when none exist)"
        side_effects:
          - "retainage_releasable_cents := retainage_held_cents"
          - "increments Job.version"
        note: "Compound transition — this is hop C->D of the erect cascade (Piece -> Sequence -> Job)."

  - entity: ShopDrawing
    initial_state: DRAFT
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /shop-drawings/{id}/submit"
        actor: DETAILER
        preconditions: []
        side_effects: ["submitted_by_user_id := X-User-ID"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /shop-drawings/{id}/decide (decision=APPROVE)"
        actor: EOR
        preconditions:
          - "decided_by X-User-ID != submitted_by_user_id (ERR_SELF_APPROVAL_FORBIDDEN)"
        side_effects:
          - "decided_by_user_id := X-User-ID"
          - "If supersedes_id references a ShopDrawing still in APPROVED: that drawing -> SUPERSEDED (hop A->B)"
          - "Every Piece with drawing_id == the superseded drawing AND status NOT IN {SHIPPED, ERECTED}: stale_revision := true (hop B->C)"
          - "Any such stale Piece with load_id set: removed from its load (load_id := null); the load's total_weight_lbs recomputed; if the load had status LOADING and its line count is now 0, the load -> STAGING (hop C->D)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /shop-drawings/{id}/decide (decision=REJECT)"
        actor: EOR
        preconditions:
          - "decided_by X-User-ID != submitted_by_user_id (ERR_SELF_APPROVAL_FORBIDDEN)"
        side_effects: ["decided_by_user_id := X-User-ID"]
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (a newer revision of the same drawing_number is APPROVED)"
        actor: system
        preconditions: []
        side_effects: ["See APPROVE side effects: piece staleness + load removal cascade"]

  - entity: MillOrder
    initial_state: PLACED
    terminal_states: [RECEIVED]
    transitions:
      - from: PLACED
        to: RECEIVED
        trigger: "POST /mill-orders/{id}/receive"
        actor: FABRICATOR_ADMIN
        preconditions:
          - "abs(received_weight_lbs - ordered_weight_lbs) <= 0.10 * ordered_weight_lbs (ERR_WEIGHT_OUT_OF_TOLERANCE); boundary: exactly +/-10% is accepted"
        side_effects: ["invoice_amount_cents computed per mill_order_invoice (variant = billing_mode)"]

  - entity: ErectionSequence
    initial_state: PLANNED
    terminal_states: [ERECTED]
    transitions:
      - from: PLANNED
        to: RELEASED
        trigger: "POST /erection-sequences/{id}/release"
        actor: FOREMAN
        preconditions:
          - "Job of the sequence has status IN {FABRICATING, ERECTING} (ERR_JOB_NOT_FABRICATING)"
        side_effects: []
      - from: RELEASED
        to: ERECTED
        trigger: "system (a piece erects and every Piece with sequence_id == this sequence has status ERECTED)"
        actor: system
        preconditions: []
        side_effects: ["Job compound COMPLETE check runs (Piece -> Sequence -> Job cascade hop)"]

  - entity: Piece
    initial_state: DETAILED
    terminal_states: [ERECTED]
    transitions:
      - from: DETAILED
        to: IN_SHOP
        trigger: "POST /pieces/{id}/start"
        actor: FOREMAN
        preconditions:
          - "stale_revision == false (ERR_PIECE_STALE_REVISION)"
          - "Pinned ShopDrawing has status APPROVED (ERR_DRAWING_NOT_APPROVED)"
          - "ErectionSequence of the piece has status RELEASED (ERR_SEQUENCE_NOT_RELEASED)"
          - "At least one MillOrder of the job has status RECEIVED (ERR_MATERIAL_NOT_RECEIVED)"
        side_effects: []
      - from: REWORK
        to: IN_SHOP
        trigger: "POST /pieces/{id}/start"
        actor: FOREMAN
        preconditions: ["Same four preconditions as DETAILED -> IN_SHOP"]
        side_effects: []
      - from: IN_SHOP
        to: AWAITING_INSPECTION
        trigger: "system (creation of a FINAL_PIECE Inspection for this piece)"
        actor: system
        preconditions:
          - "Every Weld with piece_id == this piece has status NDT_PASSED (ERR_WELDS_INCOMPLETE)"
        side_effects: ["Inspection created with status SCHEDULED"]
      - from: AWAITING_INSPECTION
        to: INSPECTED
        trigger: "system (the piece's FINAL_PIECE inspection is submitted PASSED)"
        actor: system
        preconditions: []
        side_effects: ["Piece immediately auto-advances INSPECTED -> READY_TO_SHIP"]
      - from: INSPECTED
        to: READY_TO_SHIP
        trigger: "system (automatic, same request as the passing FINAL_PIECE submit)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AWAITING_INSPECTION
        to: REWORK
        trigger: "system (the piece's FINAL_PIECE inspection is submitted FAILED)"
        actor: system
        preconditions: []
        side_effects: ["Piece REWORK -> IN_SHOP restart allowed via POST /pieces/{id}/start (cyclic loop)"]
      - from: READY_TO_SHIP
        to: SHIPPED
        trigger: "system (the load containing this piece is shipped)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SHIPPED
        to: ERECTED
        trigger: "POST /pieces/{id}/erect"
        actor: FOREMAN
        preconditions: []
        side_effects:
          - "Job.erected_weight_lbs recomputed (hop A->B)"
          - "If every Piece of the piece's sequence is ERECTED: sequence -> ERECTED (hop B->C)"
          - "Job compound COMPLETE check runs (hop C->D)"

  - entity: Welder
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /welders/{id}/suspend"
        actor: FABRICATOR_ADMIN
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (not exposed — no endpoint reinstates)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Declared for completeness; SUSPENDED is effectively terminal via the API surface."

  - entity: Weld
    initial_state: WELDED
    terminal_states: [NDT_PASSED]
    transitions:
      - from: WELDED
        to: VISUAL_PASSED
        trigger: "system (WELD_VISUAL inspection submitted PASSED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: WELDED
        to: VISUAL_REJECTED
        trigger: "system (WELD_VISUAL inspection submitted FAILED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: VISUAL_PASSED
        to: NDT_PASSED
        trigger: "system (WELD_NDT inspection submitted PASSED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: VISUAL_PASSED
        to: NDT_REJECTED
        trigger: "system (WELD_NDT inspection submitted FAILED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: VISUAL_REJECTED
        to: WELDED
        trigger: "POST /welds/{id}/repair"
        actor: WELDER
        preconditions:
          - "repair_count < 2 (ERR_WELD_REPAIR_LIMIT)"
          - "caller X-User-ID == weld.welder_id (ERR_FORBIDDEN)"
        side_effects: ["repair_count += 1"]
      - from: NDT_REJECTED
        to: WELDED
        trigger: "POST /welds/{id}/repair"
        actor: WELDER
        preconditions:
          - "repair_count < 2 (ERR_WELD_REPAIR_LIMIT)"
          - "caller X-User-ID == weld.welder_id (ERR_FORBIDDEN)"
        side_effects: ["repair_count += 1"]

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /inspections/{id}/submit (outcome=PASSED)"
        actor: QC_INSPECTOR
        preconditions:
          - "For WELD_VISUAL / WELD_NDT: X-User-ID != weld.welder_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "inspector_user_id := X-User-ID"
          - "FINAL_PIECE: piece AWAITING_INSPECTION -> INSPECTED -> READY_TO_SHIP"
          - "WELD_VISUAL: weld WELDED -> VISUAL_PASSED"
          - "WELD_NDT: weld VISUAL_PASSED -> NDT_PASSED"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /inspections/{id}/submit (outcome=FAILED)"
        actor: QC_INSPECTOR
        preconditions:
          - "For WELD_VISUAL / WELD_NDT: X-User-ID != weld.welder_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "inspector_user_id := X-User-ID"
          - "FINAL_PIECE: piece AWAITING_INSPECTION -> REWORK"
          - "WELD_VISUAL: weld WELDED -> VISUAL_REJECTED"
          - "WELD_NDT: weld VISUAL_PASSED -> NDT_REJECTED"
      - from: PASSED
        to: VOIDED
        trigger: "POST /inspections/{id}/void"
        actor: QC_INSPECTOR
        preconditions:
          - "FINAL_PIECE: piece status must be READY_TO_SHIP with load_id null (ERR_INSPECTION_LOCKED)"
          - "WELD_VISUAL: weld status must be VISUAL_PASSED (no NDT submitted since) (ERR_INSPECTION_LOCKED)"
          - "WELD_NDT: weld status must be NDT_PASSED (ERR_INSPECTION_LOCKED)"
        side_effects:
          - "FINAL_PIECE: piece reverts READY_TO_SHIP -> AWAITING_INSPECTION"
          - "WELD_VISUAL: weld reverts VISUAL_PASSED -> WELDED"
          - "WELD_NDT: weld reverts NDT_PASSED -> VISUAL_PASSED"
      - from: FAILED
        to: VOIDED
        trigger: "POST /inspections/{id}/void"
        actor: QC_INSPECTOR
        preconditions: []
        side_effects: ["No dependent reversion (rework/rejection states stand)"]

  - entity: ShippingLoad
    initial_state: STAGING
    terminal_states: [SHIPPED]
    transitions:
      - from: STAGING
        to: LOADING
        trigger: "system (first line added via POST /shipping-loads/{id}/lines)"
        actor: system
        preconditions: []
        side_effects: ["total_weight_lbs recomputed"]
      - from: LOADING
        to: STAGING
        trigger: "system (last line removed, by DELETE line or by the drawing-supersede cascade)"
        actor: system
        preconditions: []
        side_effects: ["total_weight_lbs recomputed to 0"]
      - from: LOADING
        to: SHIPPED
        trigger: "POST /shipping-loads/{id}/ship"
        actor: FOREMAN
        preconditions:
          - "Load has at least one line (ERR_PIECES_NOT_READY)"
          - "Every piece on the load has status READY_TO_SHIP and stale_revision == false (ERR_PIECES_NOT_READY)"
          - "If job.requires_aisc_hold: a PASSED non-VOIDED AISC_AUDIT inspection exists for the job (ERR_AISC_HOLD_ACTIVE)"
        side_effects:
          - "Every piece on the load: READY_TO_SHIP -> SHIPPED"

  - entity: FieldFix
    initial_state: PRICED
    terminal_states: [RESOLVED]
    transitions:
      - from: PRICED
        to: APPROVED
        trigger: "POST /field-fixes/{id}/approve"
        actor: GC_PM
        preconditions: []
        side_effects:
          - "amount_cents computed per backcharge_amount"
          - "Backcharge created: status PENDING, amount_cents := FieldFix.amount_cents (hop A->B)"
          - "Job.pending_backcharge_cents recomputed (hop B->C)"
      - from: APPROVED
        to: RESOLVED
        trigger: "POST /field-fixes/{id}/resolve"
        actor: FOREMAN
        preconditions:
          - "The Backcharge with field_fix_id == this fix has status SETTLED (ERR_BACKCHARGE_OPEN)"
        side_effects: []

  - entity: Backcharge
    initial_state: PENDING
    terminal_states: [SETTLED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /backcharges/{id}/respond (response=ACCEPT)"
        actor: GC_PM
        preconditions: []
        side_effects: []
      - from: PENDING
        to: DISPUTED
        trigger: "POST /backcharges/{id}/respond (response=DISPUTE)"
        actor: GC_PM
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: SETTLED
        trigger: "POST /backcharges/{id}/settle"
        actor: FABRICATOR_ADMIN
        preconditions:
          - "job.settled_backcharge_cents + settled_amount_cents <= job.billed_to_date_cents (ERR_BACKCHARGE_EXCEEDS_EARNED)"
        side_effects:
          - "Job.pending_backcharge_cents -= amount_cents; Job.settled_backcharge_cents += settled_amount_cents"
          - "Job compound COMPLETE check runs"
      - from: DISPUTED
        to: SETTLED
        trigger: "POST /backcharges/{id}/settle"
        actor: FABRICATOR_ADMIN
        preconditions:
          - "job.settled_backcharge_cents + settled_amount_cents <= job.billed_to_date_cents (ERR_BACKCHARGE_EXCEEDS_EARNED)"
        side_effects:
          - "Job.pending_backcharge_cents -= amount_cents; Job.settled_backcharge_cents += settled_amount_cents"
          - "Job compound COMPLETE check runs"

  - entity: ProgressBilling
    initial_state: DRAFT
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /progress-billings/{id}/submit"
        actor: FABRICATOR_ADMIN
        preconditions: []
        side_effects: ["submitted_by_user_id := X-User-ID"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /progress-billings/{id}/approve"
        actor: GC_PM
        preconditions: []
        side_effects:
          - "Job.billed_to_date_cents += net_due_cents"
          - "Job.retainage_held_cents += retainage_booked_cents"
          - "increments Job.version"
      - from: APPROVED
        to: PAID
        trigger: "POST /progress-billings/{id}/pay"
        actor: GC_PM
        preconditions: []
        side_effects: ["Job compound COMPLETE check runs"]
      - from: APPROVED
        to: VOIDED
        trigger: "POST /progress-billings/{id}/void"
        actor: GC_PM
        preconditions: []
        side_effects:
          - "Job.billed_to_date_cents -= net_due_cents (exact reversal)"
          - "Job.retainage_held_cents -= retainage_booked_cents (exact reversal)"
          - "increments Job.version"
          - "Job compound COMPLETE check runs"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version — true races only)
# =============================================================================
concurrency_rules:
  - rule_id: drawing-revise-stale-version
    parent_entity: ShopDrawing
    write_endpoint: "POST /shop-drawings/{id}/revise"
    occ_field: expected_drawing_version
    description: |
      Revising a ShopDrawing whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      just created revision N+1 from the same source revision (which
      legitimately supersedes the client's plan) and the current writer's view
      of the source drawing is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: billing-create-stale-job
    parent_entity: Job
    write_endpoint: "POST /progress-billings"
    occ_field: expected_job_version
    description: |
      Creating a ProgressBilling against a Job whose version has advanced since
      the client last observed it is rejected. Billing creation snapshots job
      aggregates (pct_complete, billed_to_date_cents, settled_backcharge_cents),
      so a stale job view would produce a billing computed from superseded
      aggregates.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: piece_percent_complete
    trigger: "Job.pct_complete read; ProgressBilling creation"
    algorithm: aggregation
    formula: |
      denominator_set = all Pieces with job_id == job.id
      numerator_set   = denominator_set with status == ERECTED
      basis WEIGHT: pct = erected_weight_sum / total_weight_sum
      basis COUNT:  pct = erected_count / total_count
      empty denominator_set -> pct = 0.0000
    input_set: "Pieces of the job; numerator restricted to status ERECTED; all other statuses contribute only to the denominator"
    precision: "4 decimal places, round_half_up"
    variants:
      - name: WEIGHT
        when: "job.billing_basis == WEIGHT"
        difference: "weights each piece by weight_lbs"
      - name: COUNT
        when: "job.billing_basis == COUNT"
        difference: "weights each piece equally regardless of weight_lbs"

  - name: net_progress_billing
    trigger: "ProgressBilling creation (values frozen on the billing row)"
    algorithm: tiered_pricing
    formula: |
      pct = piece_percent_complete(job)                       # 4 dp
      earned_cum_cents  = round_half_up(job.contract_value_cents * pct)
      rate = 0.05 if pct >= RETAINAGE_THRESHOLD else 0.10     # whole-amount rate, NOT marginal
      retainage_cum_cents = round_half_up(earned_cum_cents * rate)
      prior = billings of job with status IN {APPROVED, PAID}  # DRAFT/SUBMITTED/VOIDED excluded
      previously_billed_net_cents = sum(prior.net_due_cents)
      previously_booked_retainage_cents = sum(prior.retainage_cum_cents)
      net_due_cents = earned_cum_cents - retainage_cum_cents
                      - job.settled_backcharge_cents - previously_billed_net_cents
      retainage_booked_cents = retainage_cum_cents - previously_booked_retainage_cents
      Evaluation order pinned: pct -> earned -> rate -> retainage -> prior sums -> net/booked.
    input_set: "Job aggregates + prior billings in {APPROVED, PAID} only"
    constants:
      RETAINAGE_RATE_HIGH: 0.10
      RETAINAGE_RATE_LOW: 0.05
      RETAINAGE_THRESHOLD: 0.5000
    precision: "integer cents; percent input at 4 decimal places, round_half_up"

  - name: mill_order_invoice
    trigger: "POST /mill-orders/{id}/receive"
    algorithm: aggregation
    formula: |
      cwt(weight_lbs) = weight_lbs / 100                      # exact division, weights are multiples of 100 in practice
      NOMINAL: invoice_amount_cents = round_half_up(ordered_weight_lbs / 100 * unit_price_per_cwt_cents)
      ACTUAL:  invoice_amount_cents = round_half_up(received_weight_lbs / 100 * unit_price_per_cwt_cents)
      tolerance gate (applies to both): abs(received - ordered) <= 0.10 * ordered
    input_set: "the MillOrder being received"
    constants:
      MILL_TOLERANCE: 0.10
    precision: "integer cents, round_half_up"
    variants:
      - name: NOMINAL
        when: "mill_order.billing_mode == NOMINAL"
        difference: "bills the ordered weight regardless of scale weight"
      - name: ACTUAL
        when: "mill_order.billing_mode == ACTUAL"
        difference: "bills the received (scale) weight"

  - name: backcharge_amount
    trigger: "POST /field-fixes/{id}/approve"
    algorithm: aggregation
    formula: |
      Per line i:  line_cents_i = round_half_up(labor_hours_i * labor_rate_cents_i) + material_cents_i
      subtotal_cents = sum(line_cents_i)
      markup_cents   = round_half_up(subtotal_cents * BACKCHARGE_MARKUP)
      amount_cents   = subtotal_cents + markup_cents
      Rounding order PINNED: round labor per line -> add material per line -> sum -> markup -> round markup.
      (Sum-then-round of labor produces a different subtotal and is FORBIDDEN.)
    input_set: "FieldFix.repair_lines (non-empty)"
    constants:
      BACKCHARGE_MARKUP: 0.15
    precision: "integer cents, round_half_up"

  - name: load_weight
    trigger: "POST /shipping-loads/{id}/lines, DELETE /shipping-loads/{id}/lines/{piece_id}, drawing-supersede cascade"
    algorithm: aggregation
    formula: |
      total_weight_lbs = sum(weight_lbs of Pieces with load_id == load.id)
      add-line gate: total_weight_lbs + candidate.weight_lbs <= trailer_capacity_lbs
      boundary: total exactly == capacity is ACCEPTED; capacity + 1 rejected (ERR_LOAD_OVERWEIGHT)
    input_set: "Pieces with load_id == load.id, any status"
    precision: "integer lbs, exact"

  - name: welder_continuity
    trigger: "POST /welds"
    algorithm: threshold
    formula: |
      qualified(welder, process, now):
        welder.status == ACTIVE
        AND welder.qual_process == process
        AND current_utc_date <= welder.qual_expires_on
        AND (no prior Weld with welder_id == welder.id and process == process
             OR max(weld_date of such prior welds) >= current_utc_date - WELDER_CONTINUITY_DAYS)
      tie-break for "max weld_date": greatest weld_date; ties broken by greatest created_at
    input_set: "Welder + all Welds with welder_id == welder.id and process == weld.process, any status"
    constants:
      WELDER_CONTINUITY_DAYS: 183
    precision: "whole days"

  - name: laydown_slot_conflict
    trigger: "POST /shipping-loads"
    algorithm: interval_merge
    formula: |
      conflict(new_load, existing):
        existing.laydown_slot == new_load.laydown_slot
        AND existing.status IN {STAGING, LOADING}         # SHIPPED frees the slot
        AND abs(delivery_date_new - delivery_date_existing) <= LAYDOWN_BUFFER_DAYS
      Buffered closed semantics: deliveries exactly LAYDOWN_BUFFER_DAYS+1 days apart are ALLOWED;
      exactly LAYDOWN_BUFFER_DAYS apart are REJECTED (ERR_LAYDOWN_SLOT_CONFLICT).
    input_set: "All ShippingLoads (any job) sharing the laydown_slot with status IN {STAGING, LOADING}"
    constants:
      LAYDOWN_BUFFER_DAYS: 2
    precision: "whole days"

  - name: welder_window_overlap
    trigger: "POST /welds"
    algorithm: interval_merge
    formula: |
      overlap(new_weld, existing):
        existing.welder_id == new_weld.welder_id
        AND NOT (new_weld.window_end <= existing.window_start
                 OR new_weld.window_start >= existing.window_end)
      Half-open semantics: a new weld starting exactly when an existing one ends is ALLOWED.
      Overlap -> ERR_WELDER_DOUBLE_BOOKED.
    input_set: "All Welds with welder_id == new weld's welder_id, any status (rejected welds still occupied the time)"
    precision: "ISO8601 datetimes, exact"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles; X-User-ID present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC; WELDER ownership: weld.welder_id must equal X-User-ID on POST /welds and POST /welds/{id}/repair"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right; body FK references exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: existence
    check: "Request shape: required fields present, types correct, enum values in range, positive integers where required, repair_lines non-empty, window_end > window_start"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 5
    category: state
    check: "OCC: expected_shop_drawing_version / expected_job_version matches current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /shop-drawings/{id}/revise, POST /progress-billings"
  - priority: 6
    category: state
    check: "Target entity in a valid from-state for the transition (incl. mill-order job not ESTIMATING, load STAGING/LOADING for line edits, piece SHIPPED for field fix)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state transition endpoints
  - priority: 7
    category: business_safety
    check: "Safety/compliance: welder qualification+continuity (ERR_WELDER_NOT_QUALIFIED), drawing self-approval (ERR_SELF_APPROVAL_FORBIDDEN), weld-inspector segregation (ERR_SEGREGATION_OF_DUTIES), AISC audit hold (ERR_AISC_HOLD_ACTIVE)"
    error_id: "ERR_WELDER_NOT_QUALIFIED | ERR_SELF_APPROVAL_FORBIDDEN | ERR_SEGREGATION_OF_DUTIES | ERR_AISC_HOLD_ACTIVE"
    http_status: 409
    applies_to: "POST /welds, POST /shop-drawings/{id}/decide, POST /inspections/{id}/submit, POST /shipping-loads/{id}/ship"
  - priority: 8
    category: business_referential
    check: "Cross-entity state gates and FK consistency; within this priority, checks evaluate in the listed order: piece not stale (ERR_PIECE_STALE_REVISION), drawing APPROVED (ERR_DRAWING_NOT_APPROVED), sequence RELEASED (ERR_SEQUENCE_NOT_RELEASED), mill order RECEIVED (ERR_MATERIAL_NOT_RECEIVED), job FABRICATING for sequence release (ERR_JOB_NOT_FABRICATING), job billable (ERR_JOB_NOT_BILLABLE), body FKs belong to the same job (ERR_CROSS_JOB_REFERENCE), inspection target matches kind (ERR_INSPECTION_TARGET_INVALID), inspection not locked by downstream progress (ERR_INSPECTION_LOCKED)"
    error_id: "ERR_PIECE_STALE_REVISION | ERR_DRAWING_NOT_APPROVED | ERR_SEQUENCE_NOT_RELEASED | ERR_MATERIAL_NOT_RECEIVED | ERR_JOB_NOT_FABRICATING | ERR_JOB_NOT_BILLABLE | ERR_CROSS_JOB_REFERENCE | ERR_INSPECTION_TARGET_INVALID | ERR_INSPECTION_LOCKED"
    http_status: 409
    applies_to: "POST /pieces/{id}/start, POST /erection-sequences/{id}/release, POST /progress-billings, POST /inspections, POST /inspections/{id}/void"
  - priority: 9
    category: business_constraint
    check: "Constraint satisfaction: piece_mark unique per job (ERR_PIECE_MARK_NOT_UNIQUE), (job_id, drawing_number, revision) unique (ERR_DRAWING_NOT_UNIQUE), seq_number unique per job (ERR_SEQUENCE_NUMBER_NOT_UNIQUE), load_number unique per job (ERR_LOAD_NUMBER_NOT_UNIQUE), period_label unique per job among non-VOIDED billings (ERR_DUPLICATE_BILLING_PERIOD), welder window overlap (ERR_WELDER_DOUBLE_BOOKED), laydown buffered conflict (ERR_LAYDOWN_SLOT_CONFLICT), load capacity (ERR_LOAD_OVERWEIGHT), all welds NDT_PASSED before final inspection (ERR_WELDS_INCOMPLETE), repair limit (ERR_WELD_REPAIR_LIMIT), mill tolerance (ERR_WEIGHT_OUT_OF_TOLERANCE), backcharge settled before fix resolve (ERR_BACKCHARGE_OPEN)"
    error_id: "ERR_PIECE_MARK_NOT_UNIQUE | ERR_DRAWING_NOT_UNIQUE | ERR_SEQUENCE_NUMBER_NOT_UNIQUE | ERR_LOAD_NUMBER_NOT_UNIQUE | ERR_DUPLICATE_BILLING_PERIOD | ERR_WELDER_DOUBLE_BOOKED | ERR_LAYDOWN_SLOT_CONFLICT | ERR_LOAD_OVERWEIGHT | ERR_WELDS_INCOMPLETE | ERR_WELD_REPAIR_LIMIT | ERR_WEIGHT_OUT_OF_TOLERANCE | ERR_BACKCHARGE_OPEN"
    http_status: 409
    applies_to: various
  - priority: 10
    category: business_fiscal
    check: "Fiscal limits: settled backcharge total must not exceed billed_to_date_cents"
    error_id: ERR_BACKCHARGE_EXCEEDS_EARNED
    http_status: 409
    applies_to: "POST /backcharges/{id}/settle"

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [FABRICATOR_ADMIN]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: []

  # --- Job ---
  - method: POST
    path: "/jobs"
    description: "Create a job"
    roles: [FABRICATOR_ADMIN]
    code: 201
    input: [name, contract_value_cents, billing_basis, "requires_aisc_hold?"]
    output: Job
    side_effects: ["status=ESTIMATING, aggregates initialized to 0"]
  - method: GET
    path: "/jobs"
    description: "List jobs (paginated)"
    roles: [FABRICATOR_ADMIN, DETAILER, EOR, FOREMAN, WELDER, QC_INSPECTOR, GC_PM]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Job[]
    side_effects: []
  - method: GET
    path: "/jobs/{id}"
    description: "Get a job with computed aggregates"
    roles: [FABRICATOR_ADMIN, DETAILER, EOR, FOREMAN, WELDER, QC_INSPECTOR, GC_PM]
    code: 200
    input: []
    output: Job
    side_effects: []
  - method: POST
    path: "/jobs/{id}/award"
    description: "ESTIMATING -> AWARDED"
    roles: [FABRICATOR_ADMIN]
    code: 200
    input: []
    output: Job
    side_effects: ["increments Job.version"]
  - method: POST
    path: "/jobs/{id}/start-fabrication"
    description: "AWARDED -> FABRICATING; requires >= 1 APPROVED drawing"
    roles: [FABRICATOR_ADMIN]
    code: 200
    input: []
    output: Job
    side_effects: ["increments Job.version"]
  - method: POST
    path: "/jobs/{id}/start-erection"
    description: "FABRICATING -> ERECTING; requires >= 1 RELEASED sequence"
    roles: [FABRICATOR_ADMIN]
    code: 200
    input: []
    output: Job
    side_effects: ["increments Job.version"]

  # --- ShopDrawing ---
  - method: POST
    path: "/shop-drawings"
    description: "Create drawing revision 1 (status DRAFT)"
    roles: [DETAILER]
    code: 201
    input: [job_id, drawing_number]
    output: ShopDrawing
    side_effects: ["revision=1, status=DRAFT"]
  - method: GET
    path: "/shop-drawings"
    description: "List drawings (FK reverse-reachability for job_id and supersedes_id)"
    roles: [FABRICATOR_ADMIN, DETAILER, EOR, FOREMAN, WELDER, QC_INSPECTOR, GC_PM]
    code: 200
    input: ["job_id?", "supersedes_id?", "status?", "limit?", "offset?"]
    output: ShopDrawing[]
    side_effects: []
  - method: GET
    path: "/shop-drawings/{id}"
    description: "Get a drawing"
    roles: [FABRICATOR_ADMIN, DETAILER, EOR, FOREMAN, WELDER, QC_INSPECTOR, GC_PM]
    code: 200
    input: []
    output: ShopDrawing
    side_effects: []
  - method: POST
    path: "/shop-drawings/{id}/submit"
    description: "DRAFT -> SUBMITTED; records submitted_by_user_id"
    roles: [DETAILER]
    code: 200
    input: []
    output: ShopDrawing
    side_effects: ["submitted_by_user_id := X-User-ID"]
  - method: POST
    path: "/shop-drawings/{id}/decide"
    description: "SUBMITTED -> APPROVED | REJECTED; approval of a revision supersedes the prior APPROVED revision and fires the staleness cascade"
    roles: [EOR]
    code: 200
    input: [decision]
    output: ShopDrawing
    side_effects: ["decided_by_user_id := X-User-ID", "supersede + piece stale + load removal cascade on APPROVE"]
  - method: POST
    path: "/shop-drawings/{id}/revise"
    description: "Create the next revision (DRAFT) from an APPROVED or REJECTED drawing; OCC on source drawing version"
    roles: [DETAILER]
    code: 201
    input: [expected_drawing_version]
    output: ShopDrawing
    side_effects: ["new row: revision = source.revision + 1, supersedes_id = source.id, status=DRAFT", "increments source ShopDrawing.version by 1"]

  # --- MillOrder ---
  - method: POST
    path: "/mill-orders"
    description: "Place a mill order against the advance bill of material; job must not be ESTIMATING"
    roles: [FABRICATOR_ADMIN]
    code: 201
    input: [job_id, material_grade, ordered_weight_lbs, unit_price_per_cwt_cents, billing_mode]
    output: MillOrder
    side_effects: ["status=PLACED"]
  - method: GET
    path: "/mill-orders"
    description: "List mill orders"
    roles: [FABRICATOR_ADMIN, DETAILER, EOR, FOREMAN, WELDER, QC_INSPECTOR, GC_PM]
    code: 200
    input: ["job_id?", "status?", "limit?", "offset?"]
    output: MillOrder[]
    side_effects: []
  - method: GET
    path: "/mill-orders/{id}"
    description: "Get a mill order"
    roles: [FABRICATOR_ADMIN, DETAILER, EOR, FOREMAN, WELDER, QC_INSPECTOR, GC_PM]
    code: 200
    input: []
    output: MillOrder
    side_effects: []
  - method: POST
    path: "/mill-orders/{id}/receive"
    description: "PLACED -> RECEIVED with scale weight; computes invoice_amount_cents per billing_mode"
    roles: [FABRICATOR_ADMIN]
    code: 200
    input: [received_weight_lbs]
    output: MillOrder
    side_effects: ["invoice_amount_cents computed per mill_order_invoice"]

  # --- ErectionSequence ---
  - method: POST
    path: "/erection-sequences"
    description: "Create an erection sequence (PLANNED); seq_number unique per job"
    roles: [FOREMAN]
    code: 201
    input: [job_id, seq_number]
    output: ErectionSequence
    side_effects: ["status=PLANNED"]
  - method: GET
    path: "/erection-sequences"
    description: "List sequences"
    roles: [FABRICATOR_ADMIN, DETAILER, EOR, FOREMAN, WELDER, QC_INSPECTOR, GC_PM]
    code: 200
    input: ["job_id?", "status?", "limit?", "offset?"]
    output: ErectionSequence[]
    side_effects: []
  - method: GET
    path: "/erection-sequences/{id}"
    description: "Get an erection sequence"
    roles: [FABRICATOR_ADMIN, DETAILER, EOR, FOREMAN, WELDER, QC_INSPECTOR, GC_PM]
    code: 200
    input: []
    output: ErectionSequence
    side_effects: []
  - method: POST
    path: "/erection-sequences/{id}/release"
    description: "PLANNED -> RELEASED; job must be FABRICATING or ERECTING"
    roles: [FOREMAN]
    code: 200
    input: []
    output: ErectionSequence
    side_effects: []

  # --- Piece ---
  - method: POST
    path: "/pieces"
    description: "Create a piece (DETAILED); piece_mark unique per job; drawing and sequence must belong to the same job"
    roles: [FOREMAN]
    code: 201
    input: [job_id, piece_mark, weight_lbs, drawing_id, sequence_id]
    output: Piece
    side_effects: ["status=DETAILED, stale_revision=false", "Job.total_weight_lbs recomputed"]
  - method: GET
    path: "/pieces"
    description: "List pieces (FK reverse-reachability for job_id, drawing_id, sequence_id, load_id)"
    roles: [FABRICATOR_ADMIN, DETAILER, EOR, FOREMAN, WELDER, QC_INSPECTOR, GC_PM]
    code: 200
    input: ["job_id?", "drawing_id?", "sequence_id?", "load_id?", "status?", "limit?", "offset?"]
    output: Piece[]
    side_effects: []
  - method: GET
    path: "/pieces/{id}"
    description: "Get a piece"
    roles: [FABRICATOR_ADMIN, DETAILER, EOR, FOREMAN, WELDER, QC_INSPECTOR, GC_PM]
    code: 200
    input: []
    output: Piece
    side_effects: []
  - method: POST
    path: "/pieces/{id}/start"
    description: "DETAILED or REWORK -> IN_SHOP; gated on drawing APPROVED, not stale, sequence RELEASED, material RECEIVED"
    roles: [FOREMAN]
    code: 200
    input: []
    output: Piece
    side_effects: []
  - method: POST
    path: "/pieces/{id}/erect"
    description: "SHIPPED -> ERECTED; fires sequence/job compound cascade"
    roles: [FOREMAN]
    code: 200
    input: []
    output: Piece
    side_effects: ["Job.erected_weight_lbs recomputed", "sequence auto-ERECTED when all pieces ERECTED", "Job compound COMPLETE check"]

  # --- Welder ---
  - method: POST
    path: "/welders"
    description: "Register a welder with qualification (ACTIVE)"
    roles: [FABRICATOR_ADMIN]
    code: 201
    input: [full_name, qual_process, qual_expires_on]
    output: Welder
    side_effects: ["status=ACTIVE"]
  - method: POST
    path: "/welders/{id}/suspend"
    description: "ACTIVE -> SUSPENDED"
    roles: [FABRICATOR_ADMIN]
    code: 200
    input: []
    output: Welder
    side_effects: []

  # --- Weld ---
  - method: POST
    path: "/welds"
    description: "Log a weld on a piece in IN_SHOP; welder_id must equal X-User-ID; qualification/continuity and half-open window overlap enforced"
    roles: [WELDER]
    code: 201
    input: [piece_id, welder_id, process, weld_date, window_start, window_end]
    output: Weld
    side_effects: ["status=WELDED, repair_count=0"]
  - method: GET
    path: "/welds"
    description: "List welds (FK reverse-reachability for piece_id and welder_id)"
    roles: [FABRICATOR_ADMIN, DETAILER, EOR, FOREMAN, WELDER, QC_INSPECTOR, GC_PM]
    code: 200
    input: ["piece_id?", "welder_id?", "status?", "limit?", "offset?"]
    output: Weld[]
    side_effects: []
  - method: GET
    path: "/welds/{id}"
    description: "Get a weld"
    roles: [FABRICATOR_ADMIN, DETAILER, EOR, FOREMAN, WELDER, QC_INSPECTOR, GC_PM]
    code: 200
    input: []
    output: Weld
    side_effects: []
  - method: POST
    path: "/welds/{id}/repair"
    description: "VISUAL_REJECTED or NDT_REJECTED -> WELDED; repair_count limit 2"
    roles: [WELDER]
    code: 200
    input: []
    output: Weld
    side_effects: ["repair_count += 1"]

  # --- Inspection ---
  - method: POST
    path: "/inspections"
    description: "Schedule an inspection; target shape depends on kind; FINAL_PIECE creation advances piece IN_SHOP -> AWAITING_INSPECTION"
    roles: [QC_INSPECTOR]
    code: 201
    input: [job_id, kind, "piece_id?", "weld_id?"]
    output: Inspection
    side_effects: ["status=SCHEDULED", "FINAL_PIECE: piece -> AWAITING_INSPECTION"]
  - method: GET
    path: "/inspections"
    description: "List inspections (FK reverse-reachability for job_id, piece_id, weld_id)"
    roles: [FABRICATOR_ADMIN, DETAILER, EOR, FOREMAN, WELDER, QC_INSPECTOR, GC_PM]
    code: 200
    input: ["job_id?", "piece_id?", "weld_id?", "kind?", "status?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []
  - method: GET
    path: "/inspections/{id}"
    description: "Get an inspection"
    roles: [FABRICATOR_ADMIN, DETAILER, EOR, FOREMAN, WELDER, QC_INSPECTOR, GC_PM]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: POST
    path: "/inspections/{id}/submit"
    description: "SCHEDULED -> PASSED | FAILED; segregation vs weld.welder_id; dependent piece/weld transitions fire"
    roles: [QC_INSPECTOR]
    code: 200
    input: [outcome]
    output: Inspection
    side_effects: ["inspector_user_id := X-User-ID", "piece/weld dependent transitions per kind"]
  - method: POST
    path: "/inspections/{id}/void"
    description: "PASSED/FAILED -> VOIDED with dependent reversion; locked once downstream progress consumed the result"
    roles: [QC_INSPECTOR]
    code: 200
    input: []
    output: Inspection
    side_effects: ["dependent piece/weld reversion per kind"]

  # --- ShippingLoad ---
  - method: POST
    path: "/shipping-loads"
    description: "Create a load (STAGING); buffered laydown-slot conflict enforced across all jobs"
    roles: [FOREMAN]
    code: 201
    input: [job_id, load_number, laydown_slot, delivery_date, trailer_capacity_lbs]
    output: ShippingLoad
    side_effects: ["status=STAGING, total_weight_lbs=0"]
  - method: GET
    path: "/shipping-loads"
    description: "List loads"
    roles: [FABRICATOR_ADMIN, DETAILER, EOR, FOREMAN, WELDER, QC_INSPECTOR, GC_PM]
    code: 200
    input: ["job_id?", "status?", "limit?", "offset?"]
    output: ShippingLoad[]
    side_effects: []
  - method: GET
    path: "/shipping-loads/{id}"
    description: "Get a shipping load"
    roles: [FABRICATOR_ADMIN, DETAILER, EOR, FOREMAN, WELDER, QC_INSPECTOR, GC_PM]
    code: 200
    input: []
    output: ShippingLoad
    side_effects: []
  - method: GET
    path: "/shipping-loads/{id}/lines"
    description: "List pieces on the load"
    roles: [FABRICATOR_ADMIN, DETAILER, EOR, FOREMAN, WELDER, QC_INSPECTOR, GC_PM]
    code: 200
    input: []
    output: Piece[]
    side_effects: []
  - method: POST
    path: "/shipping-loads/{id}/lines"
    description: "Add a READY_TO_SHIP piece to the load; capacity gate; first line flips STAGING -> LOADING"
    roles: [FOREMAN]
    code: 201
    input: [piece_id]
    output: ShippingLoad
    side_effects: ["piece.load_id := load.id", "total_weight_lbs recomputed", "first line: STAGING -> LOADING"]
  - method: DELETE
    path: "/shipping-loads/{id}/lines/{piece_id}"
    description: "Remove a piece from the load; last line flips LOADING -> STAGING"
    roles: [FOREMAN]
    code: 200
    input: []
    output: ShippingLoad
    side_effects: ["piece.load_id := null", "total_weight_lbs recomputed", "empty load: LOADING -> STAGING"]
  - method: POST
    path: "/shipping-loads/{id}/ship"
    description: "LOADING -> SHIPPED; all pieces READY_TO_SHIP and not stale; AISC hold enforced"
    roles: [FOREMAN]
    code: 200
    input: []
    output: ShippingLoad
    side_effects: ["every line piece: READY_TO_SHIP -> SHIPPED"]

  # --- FieldFix ---
  - method: POST
    path: "/field-fixes"
    description: "Report a field fix on a SHIPPED or ERECTED piece; enters as PRICED with repair_lines"
    roles: [FOREMAN]
    code: 201
    input: [job_id, piece_id, description, repair_lines]
    output: FieldFix
    side_effects: ["status=PRICED"]
  - method: GET
    path: "/field-fixes"
    description: "List field fixes"
    roles: [FABRICATOR_ADMIN, DETAILER, EOR, FOREMAN, WELDER, QC_INSPECTOR, GC_PM]
    code: 200
    input: ["job_id?", "piece_id?", "status?", "limit?", "offset?"]
    output: FieldFix[]
    side_effects: []
  - method: GET
    path: "/field-fixes/{id}"
    description: "Get a field fix"
    roles: [FABRICATOR_ADMIN, DETAILER, EOR, FOREMAN, WELDER, QC_INSPECTOR, GC_PM]
    code: 200
    input: []
    output: FieldFix
    side_effects: []
  - method: POST
    path: "/field-fixes/{id}/approve"
    description: "PRICED -> APPROVED; computes amount and creates the PENDING Backcharge"
    roles: [GC_PM]
    code: 200
    input: []
    output: FieldFix
    side_effects: ["amount_cents computed per backcharge_amount", "Backcharge created PENDING", "Job.pending_backcharge_cents recomputed"]
  - method: POST
    path: "/field-fixes/{id}/resolve"
    description: "APPROVED -> RESOLVED; requires the linked backcharge SETTLED"
    roles: [FOREMAN]
    code: 200
    input: []
    output: FieldFix
    side_effects: []

  # --- Backcharge ---
  - method: GET
    path: "/backcharges"
    description: "List backcharges (FK reverse-reachability for job_id and field_fix_id)"
    roles: [FABRICATOR_ADMIN, DETAILER, EOR, FOREMAN, WELDER, QC_INSPECTOR, GC_PM]
    code: 200
    input: ["job_id?", "field_fix_id?", "status?", "limit?", "offset?"]
    output: Backcharge[]
    side_effects: []
  - method: GET
    path: "/backcharges/{id}"
    description: "Get a backcharge"
    roles: [FABRICATOR_ADMIN, DETAILER, EOR, FOREMAN, WELDER, QC_INSPECTOR, GC_PM]
    code: 200
    input: []
    output: Backcharge
    side_effects: []
  - method: POST
    path: "/backcharges/{id}/respond"
    description: "PENDING -> ACCEPTED | DISPUTED"
    roles: [GC_PM]
    code: 200
    input: [response]
    output: Backcharge
    side_effects: []
  - method: POST
    path: "/backcharges/{id}/settle"
    description: "ACCEPTED or DISPUTED -> SETTLED; fiscal cap vs billed_to_date_cents"
    roles: [FABRICATOR_ADMIN]
    code: 200
    input: [settled_amount_cents]
    output: Backcharge
    side_effects: ["Job.pending/settled backcharge aggregates updated", "Job compound COMPLETE check"]

  # --- ProgressBilling ---
  - method: POST
    path: "/progress-billings"
    description: "Create a DRAFT billing snapshotting job aggregates; OCC on Job version; period unique per job among non-VOIDED"
    roles: [FABRICATOR_ADMIN]
    code: 201
    input: [job_id, period_label, expected_job_version]
    output: ProgressBilling
    side_effects: ["snapshot fields computed per net_progress_billing", "increments Job.version by 1"]
  - method: GET
    path: "/progress-billings"
    description: "List billings"
    roles: [FABRICATOR_ADMIN, DETAILER, EOR, FOREMAN, WELDER, QC_INSPECTOR, GC_PM]
    code: 200
    input: ["job_id?", "status?", "limit?", "offset?"]
    output: ProgressBilling[]
    side_effects: []
  - method: GET
    path: "/progress-billings/{id}"
    description: "Get a progress billing"
    roles: [FABRICATOR_ADMIN, DETAILER, EOR, FOREMAN, WELDER, QC_INSPECTOR, GC_PM]
    code: 200
    input: []
    output: ProgressBilling
    side_effects: []
  - method: POST
    path: "/progress-billings/{id}/submit"
    description: "DRAFT -> SUBMITTED"
    roles: [FABRICATOR_ADMIN]
    code: 200
    input: []
    output: ProgressBilling
    side_effects: ["submitted_by_user_id := X-User-ID"]
  - method: POST
    path: "/progress-billings/{id}/approve"
    description: "SUBMITTED -> APPROVED; books net_due and retainage onto the job"
    roles: [GC_PM]
    code: 200
    input: []
    output: ProgressBilling
    side_effects: ["Job.billed_to_date_cents += net_due_cents", "Job.retainage_held_cents += retainage_booked_cents", "increments Job.version"]
  - method: POST
    path: "/progress-billings/{id}/pay"
    description: "APPROVED -> PAID"
    roles: [GC_PM]
    code: 200
    input: []
    output: ProgressBilling
    side_effects: ["Job compound COMPLETE check"]
  - method: POST
    path: "/progress-billings/{id}/void"
    description: "APPROVED -> VOIDED; exactly reverses the booked amounts"
    roles: [GC_PM]
    code: 200
    input: []
    output: ProgressBilling
    side_effects: ["Job.billed_to_date_cents -= net_due_cents", "Job.retainage_held_cents -= retainage_booked_cents", "increments Job.version", "Job compound COMPLETE check"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role / X-User-ID header missing or role unknown" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on endpoint, or WELDER caller acting on another welder's weld" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body reference does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad type, enum out of range, non-positive integer, empty repair_lines, window_end <= window_start" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a valid from-state for the requested transition" }
  - { id: ERR_SELF_APPROVAL_FORBIDDEN, http: 409, condition: "EOR deciding a drawing they themselves submitted" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Inspector X-User-ID equals weld.welder_id on weld inspection submit" }
  - { id: ERR_WELDER_NOT_QUALIFIED, http: 409, condition: "Welder SUSPENDED, process mismatch, qualification expired, or 183-day continuity lapsed" }
  - { id: ERR_WELDER_DOUBLE_BOOKED, http: 409, condition: "New weld window overlaps an existing weld of the same welder (half-open arithmetic)" }
  - { id: ERR_WELD_REPAIR_LIMIT, http: 409, condition: "Repair attempted when repair_count >= 2" }
  - { id: ERR_WELDS_INCOMPLETE, http: 409, condition: "FINAL_PIECE inspection created while some weld of the piece is not NDT_PASSED" }
  - { id: ERR_INSPECTION_TARGET_INVALID, http: 409, condition: "piece_id/weld_id presence does not match the inspection kind" }
  - { id: ERR_INSPECTION_LOCKED, http: 409, condition: "Void blocked because downstream progress consumed the result (piece shipped/on load, later weld stage passed)" }
  - { id: ERR_DRAWING_NOT_APPROVED, http: 409, condition: "Piece start requires pinned drawing APPROVED; job start-fabrication requires >= 1 APPROVED drawing" }
  - { id: ERR_PIECE_STALE_REVISION, http: 409, condition: "Piece start blocked because its pinned drawing revision is SUPERSEDED" }
  - { id: ERR_SEQUENCE_NOT_RELEASED, http: 409, condition: "Piece start requires sequence RELEASED; job start-erection requires >= 1 RELEASED sequence" }
  - { id: ERR_MATERIAL_NOT_RECEIVED, http: 409, condition: "Piece start requires >= 1 RECEIVED mill order for the job" }
  - { id: ERR_PIECE_MARK_NOT_UNIQUE, http: 409, condition: "piece_mark already exists within the job" }
  - { id: ERR_DRAWING_NOT_UNIQUE, http: 409, condition: "(job_id, drawing_number, revision) already exists" }
  - { id: ERR_SEQUENCE_NUMBER_NOT_UNIQUE, http: 409, condition: "seq_number already exists within the job" }
  - { id: ERR_LOAD_NUMBER_NOT_UNIQUE, http: 409, condition: "load_number already exists within the job" }
  - { id: ERR_CROSS_JOB_REFERENCE, http: 409, condition: "Body FKs reference entities belonging to a different job than job_id" }
  - { id: ERR_LOAD_OVERWEIGHT, http: 409, condition: "Load total plus candidate piece exceeds trailer_capacity_lbs" }
  - { id: ERR_PIECES_NOT_READY, http: 409, condition: "Ship blocked: load empty, or a line piece not READY_TO_SHIP, or a line piece stale" }
  - { id: ERR_LAYDOWN_SLOT_CONFLICT, http: 409, condition: "Another STAGING/LOADING load holds the same laydown_slot within +/-2 days" }
  - { id: ERR_JOB_NOT_FABRICATING, http: 409, condition: "Sequence release requires job FABRICATING or ERECTING" }
  - { id: ERR_JOB_NOT_BILLABLE, http: 409, condition: "Billing creation requires job FABRICATING, ERECTING, or COMPLETE" }
  - { id: ERR_DUPLICATE_BILLING_PERIOD, http: 409, condition: "period_label already used by a non-VOIDED billing of the job" }
  - { id: ERR_BACKCHARGE_EXCEEDS_EARNED, http: 409, condition: "settled_backcharge_cents + settled_amount_cents would exceed billed_to_date_cents" }
  - { id: ERR_BACKCHARGE_OPEN, http: 409, condition: "Field fix resolve blocked: linked backcharge not SETTLED" }
  - { id: ERR_WEIGHT_OUT_OF_TOLERANCE, http: 409, condition: "received_weight_lbs outside +/-10% of ordered_weight_lbs" }
  - { id: ERR_AISC_HOLD_ACTIVE, http: 409, condition: "requires_aisc_hold job has no PASSED non-VOIDED AISC_AUDIT inspection at ship time" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: FABRICATOR_ADMIN
    description: "Fabricator operations manager: contracts, material, welders, billing creation, backcharge settlement"
    identity: opaque
    exclusive_operations:
      - "POST /jobs, /jobs/{id}/award, /start-fabrication, /start-erection"
      - "POST /mill-orders, /mill-orders/{id}/receive"
      - "POST /welders, /welders/{id}/suspend"
      - "POST /progress-billings, /progress-billings/{id}/submit"
      - "POST /backcharges/{id}/settle"
      - "POST /_clock/set_current_utc"
    shared_operations: ["All GET endpoints"]
  - name: DETAILER
    description: "In-house detailer running the shop drawing cycle"
    identity: opaque
    exclusive_operations:
      - "POST /shop-drawings, /shop-drawings/{id}/submit, /shop-drawings/{id}/revise"
    shared_operations: ["All GET endpoints"]
  - name: EOR
    description: "Engineer of record approving or rejecting submitted drawings; must not be the submitter"
    identity: opaque
    exclusive_operations:
      - "POST /shop-drawings/{id}/decide"
    shared_operations: ["All GET endpoints"]
  - name: FOREMAN
    description: "Shop and field foreman: sequences, pieces, loads, field fixes"
    identity: opaque
    exclusive_operations:
      - "POST /erection-sequences, /erection-sequences/{id}/release"
      - "POST /pieces, /pieces/{id}/start, /pieces/{id}/erect"
      - "POST /shipping-loads, /shipping-loads/{id}/lines, DELETE /shipping-loads/{id}/lines/{piece_id}, /shipping-loads/{id}/ship"
      - "POST /field-fixes, /field-fixes/{id}/resolve"
    shared_operations: ["All GET endpoints"]
  - name: WELDER
    description: "Certified welder; acts only on own welds (welder_id == X-User-ID)"
    identity: "entity_backed:Welder"
    exclusive_operations:
      - "POST /welds"
      - "POST /welds/{id}/repair"
    shared_operations: ["All GET endpoints"]
  - name: QC_INSPECTOR
    description: "Quality control inspector; must not inspect a weld they performed"
    identity: opaque
    exclusive_operations:
      - "POST /inspections, /inspections/{id}/submit, /inspections/{id}/void"
    shared_operations: ["All GET endpoints"]
  - name: GC_PM
    description: "General contractor project manager: approves field fixes, responds to backcharges, approves/pays/voids billings"
    identity: opaque
    exclusive_operations:
      - "POST /field-fixes/{id}/approve"
      - "POST /backcharges/{id}/respond"
      - "POST /progress-billings/{id}/approve, /pay, /void"
    shared_operations: ["All GET endpoints"]
