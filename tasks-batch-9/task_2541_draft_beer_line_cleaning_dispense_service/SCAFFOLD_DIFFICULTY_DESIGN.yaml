          trigger:
            - call: "POST /draft-service/component-inspections"
              payload: { visit_id: "${visit}", line_id: "${line1}", component_type: "FAUCET", condition_grade: "WORN", action_taken: "REPLACED", part_sku_id: "${coupler_part}" }
