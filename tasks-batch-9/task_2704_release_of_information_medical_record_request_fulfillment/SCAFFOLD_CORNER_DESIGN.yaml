            - "other facility, same MRN: HTTP 201 and the new Patient id differs from ${pat_a}"
            - "GET /roi/patients?facility_id=${fac_a}&mrn=MRN-3001 returns total_count == 1"
            - "GET /roi/patients?mrn=MRN-3001 across facilities returns total_count == 2"

