  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: press_buffered_adjacency_conflict
        grounds:
          - validations[priority=11]
          - entities.Press.fields.teardown_buffer_min
          - errors[ERR_PRESS_WINDOW_CONFLICT]
          - entities.ProductionRun.fields.window_start
        distinguishing_aspect: "Press interval semantics include a 30-minute teardown buffer: run A [10:00,12:00) and run B [12:15,13:00) have a 15-minute gap < 30-minute buffer, so B is rejected with ERR_PRESS_WINDOW_CONFLICT even though the windows do not literally overlap (buffered adjacency)."
        test_recipe:
          setup:
            - "Order CONFIRMED (line {L:30}); Press P with teardown_buffer_min 30; run A scheduled [10:00,12:00)."
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Ink Co" }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", name: "Acme", email: "a@x.com" }
              as: ShopManager
