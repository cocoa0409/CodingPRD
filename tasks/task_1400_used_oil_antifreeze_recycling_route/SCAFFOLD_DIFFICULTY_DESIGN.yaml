          assert:
            - "After first pickup (loaded=50 < 100): Route.posture == OPEN"
            - "After second pickup (loaded=100 == 100, boundary hit): Route.posture == AT_CAPACITY"
            - "Route.loaded_gallons == 100"
            - "Third pickup of 1 gal (would push to 101 > 100): error_id == ERR_ROUTE_CAPACITY_EXCEEDED, HTTP 422"
            - "Boundary is >= inclusive: 100==capacity triggers AT_CAPACITY; 101 would exceed"

  # ==========================================================================
  # RULE 7 — cross_entity_state_dependency (different entity pairs)
  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: manifest_submit_depends_on_facility_state
        grounds:
          - state_machines.Manifest.transitions.DRAFT_to_SUBMITTED
          - entities.DisposalFacility.fields.status
        distinguishing_aspect: |
          Pair = Manifest -> DisposalFacility. Manifest's DRAFT -> SUBMITTED
          transition is gated on DisposalFacility.status == ACTIVE and on
          facility capacity/stream acceptance — a cross-entity dependency.
        test_recipe:
          setup:
            - "DisposalFacility status=ACTIVE (initially)"
            - "Manifest DRAFT for a COMPLETED route"
            - "Then flip facility to SUSPENDED (simulated by registering then having Regulator suspend via direct DB manipulation OR we expose facility-suspend endpoint)"
            - "NOTE: we do not expose a suspend endpoint in §1.5 — instead we demonstrate the dependency via the capacity and stream checks"
          setup_api_calls:
            - { call: "POST /recycle-routes/customers", payload: { legal_name: "Cross1", epa_generator_id: "EPAGEN000070", market_zone: "NORTH", credit_terms: "NET30" }, as: RoutePlanner, captures: { cust_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tank-sites", payload: { customer_id: "${cust_id}", site_address: "1 X Rd", density_zone: "URBAN", route_eligibility_override: true }, as: RoutePlanner, captures: { site_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks", payload: { tank_site_id: "${site_id}", tank_kind: "USED_OIL", capacity_gallons: 500, ownership: "CUSTOMER_OWNED" }, as: TankInstaller, captures: { tank_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks/${tank_id}/register-existing", payload: {}, as: TankInstaller }
            - { call: "POST /recycle-routes/tanks/${tank_id}/record-intake", payload: { gallons: 200 }, as: RoutePlanner }
            - { call: "POST /recycle-routes/customers/${cust_id}/activate", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/drivers", payload: { driver_name: "X1", cdl_class: "A", hazmat_endorsement: true }, as: RoutePlanner, captures: { drv_id: "$.data.id" } }
            - { call: "POST /recycle-routes/market-prices", payload: { market_zone: "NORTH", tank_kind: "USED_OIL", effective_date: "2026-08-01", price_cents_per_gal: 50 }, as: Regulator }
            # Facility 1: capacity 100 gal/day. Fill it by submitting a manifest for 100.
            - { call: "POST /recycle-routes/disposal-facilities", payload: { facility_name: "Tiny TSDF", epa_id: "EPAID010", accepted_streams: ["USED_OIL"], daily_capacity_gallons: 100 }, as: Regulator, captures: { fac_id: "$.data.id" } }
            - { call: "POST /recycle-routes/routes", payload: { route_code: "X1", scheduled_date: "2026-08-05", driver_id: "${drv_id}", vehicle_capacity_gallons: 500, density_zone: "URBAN" }, as: RoutePlanner, captures: { r1_id: "$.data.id", r1_v: "$.data.version" } }
            - { call: "POST /recycle-routes/routes/${r1_id}/route-stops", payload: { tank_site_id: "${site_id}", tank_id: "${tank_id}", scheduled_window_start: "08:00", scheduled_window_end: "09:00", sequence: 1, estimated_volume_gallons: 100, expected_route_version: "${r1_v}" }, as: RoutePlanner, captures: { s1: "$.data.id" } }
            - { call: "POST /recycle-routes/routes/${r1_id}/manifest", payload: { manifest_tracking_number: "MAN-X1", disposal_facility_id: "${fac_id}" }, as: RoutePlanner, captures: { man1_id: "$.data.id" } }
            - { call: "POST /recycle-routes/routes/${r1_id}/dispatch", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/route-stops/${s1}/arrive", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${s1}/begin-screening", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${s1}/sample-screenings", payload: { halogen_ppm: 10, water_pct: 1.0, ph_level: 7.0 }, as: LabTech }
            - { call: "POST /recycle-routes/route-stops/${s1}/pickup-tickets", payload: { client_request_id: "X1-PT", metered_volume_gallons: 100 }, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/manifests/${man1_id}/submit", payload: {}, as: RoutePlanner }
            # Facility now has scheduled_gallons_today = 100 = capacity (boundary). Now build a second route + manifest for another 100 gal and try to submit — should fail.
            - { call: "POST /recycle-routes/routes", payload: { route_code: "X2", scheduled_date: "2026-08-05", driver_id: "${drv_id}", vehicle_capacity_gallons: 500, density_zone: "URBAN" }, as: RoutePlanner, captures: { r2_id: "$.data.id", r2_v: "$.data.version" } }
            - { call: "POST /recycle-routes/routes/${r2_id}/route-stops", payload: { tank_site_id: "${site_id}", tank_id: "${tank_id}", scheduled_window_start: "10:00", scheduled_window_end: "11:00", sequence: 1, estimated_volume_gallons: 50, expected_route_version: "${r2_v}" }, as: RoutePlanner, captures: { s2: "$.data.id" } }
            - { call: "POST /recycle-routes/routes/${r2_id}/manifest", payload: { manifest_tracking_number: "MAN-X2", disposal_facility_id: "${fac_id}" }, as: RoutePlanner, captures: { man2_id: "$.data.id" } }
            - { call: "POST /recycle-routes/routes/${r2_id}/dispatch", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/route-stops/${s2}/arrive", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${s2}/begin-screening", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${s2}/sample-screenings", payload: { halogen_ppm: 10, water_pct: 1.0, ph_level: 7.0 }, as: LabTech }
            - { call: "POST /recycle-routes/route-stops/${s2}/pickup-tickets", payload: { client_request_id: "X2-PT", metered_volume_gallons: 50 }, as: Driver, as_user_id: "${drv_id}" }
          trigger:
            - { call: "POST /recycle-routes/manifests/${man2_id}/submit", payload: {}, as: RoutePlanner, captures: { err: "$.data.error_id" } }
          assert:
            - "Facility.scheduled_gallons_today == 100 after first submit"
            - "Second manifest has total_gallons_manifested == 50"
            - "100 + 50 = 150 > daily_capacity_gallons = 100"
            - "Manifest submit blocked with ERR_FACILITY_CAPACITY_EXCEEDED"
            - "Cross-entity dependency: Manifest transition gated by DisposalFacility aggregate state"

      - name: route_stop_arrive_depends_on_tank_quarantine_state
        grounds:
          - state_machines.RouteStop.transitions.SCHEDULED_to_EN_ROUTE
          - entities.Tank.fields.quarantine_status
        distinguishing_aspect: |
          Pair = RouteStop -> Tank (different from rule-7 instance 1's
          Manifest -> DisposalFacility). RouteStop's SCHEDULED -> EN_ROUTE
          transition is gated on Tank.quarantine_status == CLEAR.
        test_recipe:
          setup:
            - "Route dispatched; Stop SCHEDULED at Tank T"
            - "Tank T placed in QUARANTINED via a prior halogen screen at another route"
            - "Driver attempts /arrive on the still-SCHEDULED stop"
            - "Note: in this scaffold the cascade on QUARANTINED already moves the stop to CANCELLED_HALOGEN — so we test the inverse: create the stop AFTER the tank is quarantined is impossible (would cascade); instead we test the arrive precondition by creating the stop first, quarantining via a different tank at the same site — no, quarantine is per-tank. We therefore construct: stop SCHEDULED at T, then we drive T into QUARANTINED through a separate route — cascade CANCELS this stop. So the dependency is observed through the cascade: stop becomes CANCELLED_HALOGEN, and any further arrive attempt gets ERR_STOP_NOT_SCHEDULED (state error)."
            - "Alternative valid construction: stop SCHEDULED at tank T2 (different tank, same site); tank T1 at same site gets quarantined — T2 stays CLEAR; arrive on T2's stop succeeds. That tests the dependency's POSITIVE direction."
          setup_api_calls:
            - { call: "POST /recycle-routes/customers", payload: { legal_name: "Cross2", epa_generator_id: "EPAGEN000071", market_zone: "NORTH", credit_terms: "NET30" }, as: RoutePlanner, captures: { cust_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tank-sites", payload: { customer_id: "${cust_id}", site_address: "2 X Rd", density_zone: "URBAN" }, as: RoutePlanner, captures: { site_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks", payload: { tank_site_id: "${site_id}", tank_kind: "USED_OIL", capacity_gallons: 500, ownership: "CUSTOMER_OWNED" }, as: TankInstaller, captures: { t1_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks/${t1_id}/register-existing", payload: {}, as: TankInstaller }
            - { call: "POST /recycle-routes/tanks", payload: { tank_site_id: "${site_id}", tank_kind: "USED_OIL", capacity_gallons: 500, ownership: "CUSTOMER_OWNED" }, as: TankInstaller, captures: { t2_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks/${t2_id}/register-existing", payload: {}, as: TankInstaller }
            - { call: "POST /recycle-routes/tanks/${t1_id}/record-intake", payload: { gallons: 100 }, as: RoutePlanner }
            - { call: "POST /recycle-routes/tanks/${t2_id}/record-intake", payload: { gallons: 100 }, as: RoutePlanner }
            - { call: "POST /recycle-routes/customers/${cust_id}/activate", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/drivers", payload: { driver_name: "X2", cdl_class: "B", hazmat_endorsement: true }, as: RoutePlanner, captures: { drv_id: "$.data.id" } }
            - { call: "POST /recycle-routes/market-prices", payload: { market_zone: "NORTH", tank_kind: "USED_OIL", effective_date: "2026-08-01", price_cents_per_gal: 50 }, as: Regulator }
            # Route A: stop at T1, will be quarantined
            - { call: "POST /recycle-routes/routes", payload: { route_code: "X-A", scheduled_date: "2026-08-05", driver_id: "${drv_id}", vehicle_capacity_gallons: 500, density_zone: "URBAN" }, as: RoutePlanner, captures: { ra_id: "$.data.id", ra_v: "$.data.version" } }
            - { call: "POST /recycle-routes/routes/${ra_id}/route-stops", payload: { tank_site_id: "${site_id}", tank_id: "${t1_id}", scheduled_window_start: "08:00", scheduled_window_end: "09:00", sequence: 1, estimated_volume_gallons: 100, expected_route_version: "${ra_v}" }, as: RoutePlanner, captures: { sa_id: "$.data.id" } }
            - { call: "POST /recycle-routes/routes/${ra_id}/dispatch", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/route-stops/${sa_id}/arrive", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${sa_id}/begin-screening", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${sa_id}/sample-screenings", payload: { halogen_ppm: 9999, water_pct: 1.0, ph_level: 7.0 }, as: LabTech }
            # T1 is now QUARANTINED. T2 is still CLEAR.
            # Route B: stop at T2 — arrive should succeed (T2 CLEAR, site ACTIVE)
            - { call: "POST /recycle-routes/routes", payload: { route_code: "X-B", scheduled_date: "2026-08-05", driver_id: "${drv_id}", vehicle_capacity_gallons: 500, density_zone: "URBAN" }, as: RoutePlanner, captures: { rb_id: "$.data.id", rb_v: "$.data.version" } }
            - { call: "POST /recycle-routes/routes/${rb_id}/route-stops", payload: { tank_site_id: "${site_id}", tank_id: "${t2_id}", scheduled_window_start: "10:00", scheduled_window_end: "11:00", sequence: 1, estimated_volume_gallons: 100, expected_route_version: "${rb_v}" }, as: RoutePlanner, captures: { sb_id: "$.data.id" } }
            - { call: "POST /recycle-routes/routes/${rb_id}/dispatch", payload: {}, as: RoutePlanner }
          trigger:
            - { call: "POST /recycle-routes/route-stops/${sb_id}/arrive", payload: {}, as: Driver, as_user_id: "${drv_id}", captures: { s_b_after: "$.data.status" } }
            - { call: "GET /recycle-routes/tanks/${t1_id}", payload: {}, as: EHSOfficer, captures: { t1_q: "$.data.quarantine_status" } }
            - { call: "GET /recycle-routes/tanks/${t2_id}", payload: {}, as: EHSOfficer, captures: { t2_q: "$.data.quarantine_status" } }
          assert:
            - "Tank.${t1_id}.quarantine_status == QUARANTINED (halogen reject at T1)"
            - "Tank.${t2_id}.quarantine_status == CLEAR (different tank, unaffected)"
            - "RouteStop.${sb_id}.status == EN_ROUTE (arrive succeeded on T2 because T2 is CLEAR)"
            - "Cross-entity dependency: arrive on RouteStop gated by Tank.quarantine_status — passes only when CLEAR"

  # ==========================================================================
  # RULE 8 — resource_temporal_overlap (different interval semantics)
  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: route_capacity_aggregate_overlap
        grounds:
          - calculations.route_posture
          - entities.Route.fields.loaded_gallons
        distinguishing_aspect: |
          Interval semantics = aggregate-capacity (not adjacency): multiple
