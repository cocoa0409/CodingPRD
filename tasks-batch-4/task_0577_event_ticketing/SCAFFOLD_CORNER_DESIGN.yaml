            - { call: "POST /events/${ev}/price-levels", payload: { name: "GA", base_face_value_cents: 9990, is_platinum: false, service_fee_pct: 0.15, service_fee_flat_cents: 500, dynamic_pricing_enabled: false }, as: Promoter, as_user_id: "prm_1", captures: { pl: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "1" }, as: BoxOffice, captures: { s1: $.data.id } }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ANNOUNCED" }, as: Promoter, as_user_id: "prm_1" }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ONSALE" }, as: Promoter, as_user_id: "prm_1", captures: { ev_v1: $.data.version } }
            - { call: "POST /events/${ev}/queue-tokens", payload: { buyer_id: "${b}" }, as: Buyer, as_user_id: "${b}", captures: { tk: $.data.id } }
            - { call: "POST /queue-tokens/${tk}/admit", payload: {}, as: BoxOffice }
            - { call: "POST /events/${ev}/holds", payload: { seat_ids: ["${s1}"], buyer_id: "${b}", expected_event_version: "${ev_v1}" }, as: Buyer, as_user_id: "${b}", captures: { h: $.data.id } }
            - { call: "POST /orders", payload: { hold_id: "${h}", delivery_method: "MOBILE" }, as: Buyer, as_user_id: "${b}", captures: { o: $.data.id } }
            - { call: "POST /orders/${o}/pay", payload: {}, as: Buyer, as_user_id: "${b}" }
          trigger:
            - { call: "GET /events/${ev}", payload: {}, as: BoxOffice, captures: { sold: $.data.seats_sold, held: $.data.seats_held } }
          assert:
