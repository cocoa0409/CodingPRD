  - section: validations
    instances:

      - name: fair_use_acceptance_at_the_exact_score_threshold_passes_every_gate
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=42]
          - validations[priority=22]
          - validations[priority=23]
          - state_machines.FairUseAnalysis.transitions.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: "The threshold is inclusive: factors (60, 60, 60, 60) under the TRANSFORMATIVE_WEIGHTED variant score exactly 0.6000, and with an ISSUED letter and a different acting user id all three gates (42, 22, 23) are satisfied, so the asset clears on FAIR_USE with no licence at all."
        test_recipe:
          setup: ["A production in CLEARANCE with one 45-second CRITICAL_COMMENTARY asset, no licence, one SUBMITTED fair-use analysis scored (60, 60, 60, 60), and one ISSUED opinion letter authored by LegalCounsel user 'counsel-a'."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Exact Sixty", delivery_deadline_date: "2027-06-30" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/state"
              payload: { to_status: "CLEARANCE" }
              as: ProductionAdmin
            - call: "POST /productions/${prod_id}/assets"
              payload: { asset_type: "ARCHIVAL_FOOTAGE", title: "Newsreel excerpt", timecode_in_seconds: 0, timecode_out_seconds: 45, usage_purpose: "CRITICAL_COMMENTARY" }
              as: ArchiveResearcher
              captures: { asset_id: $.data.id }
            - call: "POST /assets/${asset_id}/fair-use-analyses"
              payload: { transformative_score: 60, nature_score: 60, amount_used_score: 60, market_harm_score: 60 }
              as: LegalCounsel
              as_user_id: "counsel-a"
              captures: { fua_id: $.data.id, score: $.data.strength_score }
            - call: "POST /fair-use-analyses/${fua_id}/state"
              payload: { to_status: "SUBMITTED" }
              as: LegalCounsel
              as_user_id: "counsel-a"
            - call: "POST /fair-use-analyses/${fua_id}/opinion-letters"
              payload: { counsel_firm: "Marsh & Keel LLP", letter_reference: "OL-4471", risk_rating: "LOW" }
              as: LegalCounsel
              as_user_id: "counsel-a"
              captures: { ol_id: $.data.id }
            - call: "POST /opinion-letters/${ol_id}/state"
              payload: { to_status: "ISSUED" }
              as: LegalCounsel
              as_user_id: "counsel-a"
          trigger:
            - call: "POST /fair-use-analyses/${fua_id}/state"
              payload: { to_status: "ACCEPTED", decision_rationale: "Four-factor analysis supports the use." }
              as: LegalCounsel
              as_user_id: "counsel-b"
          assert:
            - "FairUseAnalysis.${fua_id}.strength_score == 0.6000 and weighting_variant == TRANSFORMATIVE_WEIGHTED"
            - "the trigger returns 200 with status ACCEPTED — 0.6000 >= 0.6000 satisfies priority 42 at the inclusive edge"
            - "Asset.${asset_id}.licensing_status == CLEARED and rights_basis == FAIR_USE, with no License row in existence"
            - "Production.${prod_id}.posture == OPEN (0 open assets, no PENDING depiction)"
            - "OpinionLetter.${ol_id}.issued_by_user_id == 'counsel-a' and the accepting user 'counsel-b' differs, so priority 23 does not fire"

      - name: music_leg_requirement_is_conditional_on_the_asset_type
        claim_type: conditional_validation
        grounds:
          - validations[priority=36]
          - entities.Asset.fields.asset_type
          - entities.License.fields.rights_leg
        distinguishing_aspect: "Priority 36 is a two-way conditional keyed on the PARENT asset's type: MUSIC accepts only MASTER/PUBLISHING and ARCHIVAL_FOOTAGE only FOOTAGE, so the same error id must fire from both mismatched directions while the matching pairs pass."
        test_recipe:
          setup: ["A production in CLEARANCE with one MUSIC asset and one ARCHIVAL_FOOTAGE asset (the footage asset has a SELECTED AVAILABLE candidate) and one ACTIVE archive with the standard rate card."]
          setup_api_calls:
            - call: "POST /productions"
