              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_p37_id: "$.data.id" }
            - call: "POST /permittees"
              payload: { name: "Immediate Consistency Ranch", contact_email: "immediate@example.com" }
