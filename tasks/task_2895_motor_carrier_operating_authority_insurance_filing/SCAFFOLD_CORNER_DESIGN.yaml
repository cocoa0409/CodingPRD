            - "${new_with_predecessor_error} == 'ERR_PREDECESSOR_INVALID' with HTTP 422 — the row exists, so priority 25 runs and rejects a NEW application that carries a predecessor at all"
            - "GET /authority-applications?carrier_id=${c49_id} still returns total_count == 1 (only the original PUBLISHED application)"
            - "GET /authority-applications?predecessor_authority_id=${auth49_id} returns total_count == 0"

