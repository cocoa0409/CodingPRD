              captures: { cust_id: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust_id}", gear_unit_id: "${gu_id}", pickup_at: "2026-05-07T08:00:00Z", due_at: "2026-05-07T10:00:00Z", damage_waiver_opted: false, expected_gear_unit_version: "${gu_v}" }
              as: RentalAgent
              captures: { res_id: $.data.id }
            - call: "POST /rental/reservations/${res_id}/confirm"
              payload: {}
              as: RentalAgent
            - call: "POST /rental/reservations/${res_id}/checkout"
              payload: { condition_rating: "GOOD" }
              as: RentalAgent
            - call: "POST /rental/_clock/set"
              payload: { to_iso8601: "2026-05-07T09:30:00Z" }
              as: ShopAdmin
            - call: "POST /rental/reservations/${res_id}/checkin"
              payload: { condition_rating: "DAMAGED" }
              as: RentalAgent
            - call: "GET /rental/damage-assessments?reservation_id=${res_id}"
              payload: {}
              as: RentalAgent
              captures: { da_id: $.data.0.id, da_v: $.data.0.version }
            - call: "POST /rental/damage-assessments/${da_id}/dispute"
              payload: { expected_damage_assessment_version: "${da_v}" }
              as: Renter
