              captures: { lot_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${comm_id}", full_name: "ROa", household_size: 2 }
              as: ParkManager
              captures: { res_a: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${comm_id}", full_name: "ROb", household_size: 2 }
              as: ParkManager
              captures: { res_b: $.data.id }
            - call: "POST /lot-leases"
              payload: { lot_id: "${lot_id}", resident_id: "${res_a}", start_date: "2026-01-01" }
              as: ParkManager
              captures: { lease_a: $.data.id }
            - call: "POST /lot-leases/${lease_a}/activate"
              payload: {}
              as: ParkManager
              captures: { lot_v_stale: $.data.version }
            - call: "POST /rent-schedules"
              payload: { lot_id: "${lot_id}", proposed_rent_cents: 62000, effective_date: "2027-01-01" }
              as: ParkManager
              captures: { sched_id: $.data.id }
            - call: "POST /rent-schedules/${sched_id}/accept"
              payload: {}
              as: Resident
              as_user_id: "${res_a}"
            - call: "POST /rent-schedules/${sched_id}/apply"
              payload: {}
              as: ParkManager
            - call: "POST /lot-leases"
              payload: { lot_id: "${lot_id}", resident_id: "${res_b}", start_date: "2026-02-01", supersedes_lease_id: "${lease_a}", expected_lot_version: "${lot_v_stale}" }
