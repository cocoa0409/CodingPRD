              as: Artist
              as_user_id: "u-artist-01"
              captures: { asset_a_id: "$.data.id" }
            - call: "POST /studio/assets/${asset_a_id}/advance-build"
              payload: { to_build_status: "MODELING" }
              as: Artist
              as_user_id: "u-artist-01"
            - call: "POST /studio/assets/${asset_a_id}/advance-build"
              payload: { to_build_status: "RIGGING" }
              as: Artist
              as_user_id: "u-artist-01"
            - call: "POST /studio/assets/${asset_a_id}/advance-build"
              payload: { to_build_status: "SURFACING" }
              as: Artist
              as_user_id: "u-artist-01"
            - call: "POST /studio/assets/${asset_a_id}/advance-build"
              payload: { to_build_status: "PUBLISHED" }
              as: Artist
              as_user_id: "u-artist-01"
            - call: "POST /studio/assets/${asset_a_id}/library-submit"
              payload: {}
              as: Artist
              as_user_id: "u-artist-01"
            - call: "POST /studio/assets/${asset_a_id}/library-decision"
              payload: { decision: "APPROVED" }
              as: Supervisor
              as_user_id: "u-sup-01"
              captures: { a_lib_before: "$.data.library_status" }
            - call: "POST /studio/assets"
              payload: { production_id: "${prod_id}", asset_code: "AD01_CHAR_SIDEKICK", asset_type: "CHARACTER_MODEL", base_complexity_points: 200.00, derived_from_asset_id: "${asset_a_id}" }
              as: Artist
              as_user_id: "u-artist-01"
              captures: { asset_b_id: "$.data.id", b_depth_before: "$.data.reuse_depth", b_discount_before: "$.data.reuse_discount_pct", b_points_before: "$.data.effective_complexity_points", b_stale_before: "$.data.reuse_source_stale" }
            - call: "POST /studio/assets"
              payload: { production_id: "${prod_id}", asset_code: "AD01_PROP_01", asset_type: "PROP", base_complexity_points: 50.00 }
              as: Artist
              as_user_id: "u-artist-01"
              captures: { asset_p_id: "$.data.id" }
            - call: "POST /studio/assets/${asset_p_id}/advance-build"
              payload: { to_build_status: "MODELING" }
              as: Artist
              as_user_id: "u-artist-01"
            - call: "POST /studio/assets/${asset_p_id}/advance-build"
              payload: { to_build_status: "RIGGING" }
              as: Artist
              as_user_id: "u-artist-01"
            - call: "POST /studio/assets/${asset_p_id}/advance-build"
              payload: { to_build_status: "SURFACING" }
              as: Artist
              as_user_id: "u-artist-01"
            - call: "POST /studio/assets/${asset_p_id}/advance-build"
              payload: { to_build_status: "PUBLISHED" }
              as: Artist
              as_user_id: "u-artist-01"
          trigger:
            - call: "POST /studio/assets/${asset_a_id}/advance-build"
              payload: { to_build_status: "RETIRED" }
              as: Artist
              as_user_id: "u-artist-01"
              captures: { a_build_after: "$.data.build_status", a_lib_after: "$.data.library_status" }
            - call: "GET /studio/assets/${asset_b_id}"
              as: Artist
              captures: { b_depth_after: "$.data.reuse_depth", b_discount_after: "$.data.reuse_discount_pct", b_points_after: "$.data.effective_complexity_points", b_stale_after: "$.data.reuse_source_stale" }
            - call: "POST /studio/assets/${asset_p_id}/advance-build"
              payload: { to_build_status: "RETIRED" }
              as: Artist
              as_user_id: "u-artist-01"
              captures: { p_build_after: "$.data.build_status", p_lib_after: "$.data.library_status" }
            - call: "GET /studio/assets?derived_from_asset_id=${asset_a_id}"
              as: Artist
              captures: { desc_code: "$.data[0].asset_code" }
          assert:
            - "${a_lib_before} == LIBRARY_APPROVED"
            - "${b_depth_before} == 1, ${b_discount_before} == 0.40, ${b_points_before} == 120.00 and ${b_stale_before} == false"
            - "${a_build_after} == RETIRED and ${a_lib_after} == LIBRARY_DEPRECATED"
            - "${b_stale_after} == true, ${b_discount_after} == 0.00 and ${b_points_after} == 200.00 (full points restored)"
            - "${b_depth_after} == 1 (the edge survives; only the credit is withdrawn)"
            - "${p_build_after} == RETIRED and ${p_lib_after} == PRIVATE — a PRIVATE asset is never deprecated and no descendant recomputation occurs"
            - "${desc_code} == AD01_CHAR_SIDEKICK, so the descendant remains reachable through the reuse-source filter"
