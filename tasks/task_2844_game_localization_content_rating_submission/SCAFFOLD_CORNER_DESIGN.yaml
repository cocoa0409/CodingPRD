            - "footage_asset_count 2 satisfies priority 53 because the disclosed set now intersects FOOTAGE_MANDATORY_CODES via GAMBLING_SIM - had it stayed 0 the winning error would have been ERR_FOOTAGE_EVIDENCE_MISSING"

      - name: content_edit_apply_and_withdraw_both_require_the_proposed_state
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CONTENT_EDIT_NOT_PROPOSED]
          - state_machines.ContentEdit
          - endpoints[POST /rating-submissions/{rating_submission_id}/withdraw]
        distinguishing_aspect: "PROPOSED is the only live ContentEdit state, and WITHDRAWN is terminal for both verbs - a withdrawn edit can be neither applied nor withdrawn again. The submission's own withdraw must also cascade PROPOSED edits to WITHDRAWN, which is how a second edit becomes non-applicable without ever being touched directly."
