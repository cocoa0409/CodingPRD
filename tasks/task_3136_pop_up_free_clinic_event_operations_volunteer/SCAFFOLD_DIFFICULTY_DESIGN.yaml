  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: license_expiry_exactly_on_service_date_rejected
        grounds:
          - validations[priority=8]
          - errors[ERR_LICENSE_EXPIRED]
          - state_machines.Volunteer.VERIFIED_to_AUTHORIZED
        distinguishing_aspect: |
          Half-open interval semantics on the license-validity resource:
          authorization requires license_expiry_date > service_date (strictly
          greater). A license expiring exactly ON the service date
          (2026-10-03 vs 2026-10-03) is rejected — the interval is open at the
          service-date end, so adjacency does not count as coverage.
        test_recipe:
          setup:
            - "Event ev15 SITE_LOCKED with service_date 2026-10-03; VERIFIED dental volunteer whose license_expiry_date == 2026-10-03"
