      - name: cn_response_envelope_shape
        claim_type: standard_crud
        grounds: ["response_envelope"]
        distinguishing_aspect: "Success and error envelopes are fixed: success carries meta.api_request_id + response_type 'object' + data; errors carry response_type 'error' + data.error_id + data.message."
        test_recipe:
          setup: ["one school"]
          setup_api_calls:
            - { call: "POST /schools", payload: { school_name: "Lone Star Realty School", school_code: "LSRS", home_state_code: "TX" }, as: SchoolDirector, captures: { sch: $.data.id } }
          trigger:
            - { call: "GET /schools/${sch}", as: Registrar }
            - { call: "GET /schools/00000000-0000-0000-0000-000000000000", as: Registrar, captures: { err: $.data.error_id } }
          assert:
            - "success response: meta.api_request_id present, response_type == 'object', data holds the School"
            - "error response: response_type == 'error', data.error_id == ERR_SCHOOL_NOT_FOUND, data.message present"

