# =============================================================================
# Task 0500 — Greenhouse & Nursery Grower (wholesale)
# SCAFFOLD.yaml — §1.0 through §1.7
# =============================================================================

scenario: |
  500. Greenhouse & Nursery Grower (wholesale): crop/variety & propagation
  schedule, bench/zone space allocation, plug/liner sourcing & transplant,
  climate/irrigation & input log, grow-cycle & ship-ready grade, availability
  list & broker order, shrink/cull, phytosanitary certificate & shipping

domain_name: greenhouse-nursery-grower
api_prefix: /nursery

# Difficulty: EXPERT. Quota/allocation primary (finite bench-zone space and
# finite ship-ready saleable inventory are competed for, reserved, committed,
# released), blended with workflow-orchestration (the propagation batch grow
# cycle is a branching pipeline with compensation on cull/void). Five cross-
# cutting layers stack on top.
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency       # OCC on Zone.version (space) and BrokerOrder.version (allocation)
    - cascading_side_effects       # transplant/cull/ship cascades across Zone, Batch, AvailabilityEntry, OrderLine
    - dual_variant_calculation     # saleable-count: provisional (forward) vs final (graded) on Batch; loss-cost: standard vs actual on Batch
    - rate_threshold_triggers      # ship-ready grade gate, shrink auto-cull threshold, congestion fill cap
    - derived_field_reconciliation # Zone occupancy fields, Batch live_count, AvailabilityEntry quantity reconciliation

  entity_topology: flat
  # Flat peer entities linked by foreign keys (Zone, CropVariety, PropagationBatch,
  # InputLog, AvailabilityEntry, BrokerOrder, OrderLine, Shipment, PhytoCertificate,
  # Broker). No deep URL nesting; everything under /nursery/<collection>.

  state_machine_shape: branching
  # PropagationBatch is a branching fork-join pipeline (grade splits SALEABLE vs
  # HELD-for-regrade vs CULLED, with compensation on void). BrokerOrder is
  # branching-with-revert (confirm → fulfilling → shipped, with cancel/revert).
  # Shipment is linear-with-compensation. CropVariety is linear lifecycle.

  relationship_patterns:
    - one_to_many        # Zone 1..* PropagationBatch; CropVariety 1..* PropagationBatch; BrokerOrder 1..* OrderLine
    - cross_aggregate    # OrderLine references both BrokerOrder and AvailabilityEntry; Shipment references BrokerOrder and PhytoCertificate
    - many_to_many       # OrderLine is the junction associating a BrokerOrder to an AvailabilityEntry (saleable lot)

  role_model: peer_roles
  # GrowerManager owns crop schedule + zones + grow ops; ProductionTech logs
  # climate/irrigation/cull and runs grading; SalesCoordinator owns availability
  # lists, broker orders and shipping; Broker (entity-backed) places/cancels
  # their own orders. Plus a system actor for the ops checkpoint.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---------------------------------------------------------------------------
  - name: CropVariety
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: common_name, type: string, source: input, description: "Marketing name, e.g. 'Calibrachoa Superbells'" }
      - { name: cultivar_code, type: string, source: input, description: "Unique cultivar code within the nursery", constraints: "uppercase alphanumeric; unique among non-RETIRED varieties" }
      - { name: propagation_form, type: enum, source: input, description: "Sourcing form for new batches", constraints: "PLUG | LINER | BARE_ROOT" }
      - { name: grow_cycle_days, type: integer, source: input, description: "Nominal days from transplant to ship-ready", constraints: ">= 1" }
      - { name: container_footprint_units, type: integer, source: input, description: "Bench-space units one finished plant occupies (a tray/pot footprint)", constraints: ">= 1" }
      - { name: ship_ready_grade_min_height_cm, type: number, source: input, description: "Minimum mean height (cm) for a SALEABLE grade", constraints: "> 0" }
      - { name: ship_ready_min_live_pct, type: number, source: input, description: "Minimum live fraction of started count required to pass grading", constraints: "0 < x <= 1; e.g. 0.80" }
      - { name: requires_phyto, type: boolean, source: input, description: "Whether interstate shipment of this variety requires a phytosanitary certificate", default: false }
      - { name: status, type: enum, source: system, description: "Lifecycle of the variety in the catalog", default: "DRAFT", constraints: "DRAFT | ACTIVE | SUSPENDED | RETIRED" }

  # ---------------------------------------------------------------------------
  - name: Zone
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Greenhouse zone / bench-range label, e.g. 'GH3 Bench A'" }
      - { name: climate_class, type: enum, source: input, description: "Climate compatibility class", constraints: "WARM | COOL | MIXED" }
      - { name: capacity_units, type: integer, source: input, description: "Total bench-space footprint units in this zone", constraints: ">= 1" }
      - { name: occupied_units, type: integer, source: computed, default: 0, description: "Footprint units physically planted (sum over GROWING/GRADING/SALEABLE/HELD batches of live_count * variety.container_footprint_units)" }
      - { name: reserved_units, type: integer, source: computed, default: 0, description: "Footprint units promised to PLANNED batches not yet transplanted" }
      - { name: free_units, type: integer, source: computed, default: 0, description: "= capacity_units - occupied_units - reserved_units" }
      - { name: fill_state, type: enum, source: computed, default: "OPEN", description: "Derived congestion posture gating new placements: OPEN | TIGHT | FULL" }
      - { name: status, type: enum, source: system, description: "OPEN_FOR_USE | QUARANTINED | DECOMMISSIONED", default: "OPEN_FOR_USE" }

  # ---------------------------------------------------------------------------
  - name: PropagationBatch
    parent: null
    common_fields: true
    fields:
      - { name: variety_id, type: string, source: input, description: "FK -> CropVariety.id; the variety being grown" }
      - { name: zone_id, type: string, source: input, description: "FK -> Zone.id; the zone reserved/occupied by this batch" }
      - { name: lot_code, type: string, source: system, description: "Server-minted traceability lot code, unique within the nursery" }
      - { name: source_supplier, type: string, source: input, description: "Plug/liner supplier name" }
      - { name: sourced_count, type: integer, source: input, description: "Number of plugs/liners ordered/received to start the batch", constraints: ">= 1" }
      - { name: started_count, type: integer, source: computed, default: 0, description: "Count actually stuck/transplanted into the zone (set at transplant)" }
      - { name: cull_count, type: integer, source: computed, default: 0, description: "Cumulative units culled/dead removed across the grow cycle" }
      - { name: live_count, type: integer, source: computed, default: 0, description: "= started_count - cull_count - shipped_count; current living plants on the bench" }
      - { name: shipped_count, type: integer, source: computed, default: 0, description: "Cumulative units committed to shipments out of this batch" }
      - { name: saleable_count, type: integer, source: computed, default: 0, description: "Units available to sell after grading (provisional before grade, final after)" }
      - { name: mean_height_cm, type: number, source: computed, default: 0, description: "Latest recorded mean plant height (cm) from a GRADE input event" }
      - { name: stick_date, type: datetime, source: computed, description: "UTC timestamp of transplant (when batch entered GROWING)" }
      - { name: target_ship_date, type: datetime, source: computed, description: "= stick_date + variety.grow_cycle_days (computed at transplant)" }
      - { name: status, type: enum, source: system, description: "Grow-cycle state", default: "PLANNED", constraints: "PLANNED | GROWING | GRADING | SALEABLE | HELD | CULLED | VOIDED" }

  # ---------------------------------------------------------------------------
  - name: InputLog
    parent: null
    common_fields: false   # append-only event: id + created_at only
    fields:
      - { name: batch_id, type: string, source: input, description: "FK -> PropagationBatch.id; the batch this event applies to" }
      - { name: event_type, type: enum, source: input, description: "CLIMATE | IRRIGATION | FERTILIZER | SCOUTING | GRADE", constraints: "one of the five enum members" }
      - { name: recorded_at, type: datetime, source: computed, description: "Logical-clock timestamp when this event was recorded" }
      - { name: temperature_c, type: number, source: input, description: "Air temperature (C) — for CLIMATE events", default: null }
      - { name: irrigation_liters, type: number, source: input, description: "Water volume applied (L) — for IRRIGATION events", default: null }
      - { name: fertilizer_ppm_n, type: number, source: input, description: "Feed nitrogen concentration (ppm) — for FERTILIZER events", default: null }
      - { name: mean_height_cm, type: number, source: input, description: "Measured mean plant height (cm) — required for GRADE events", default: null }
      - { name: dead_observed, type: integer, source: input, description: "Units observed dead/unsaleable in a SCOUTING or GRADE event (drives cull)", default: 0 }
      - { name: note, type: string, source: input, description: "Free-text observation", default: null }

  # ---------------------------------------------------------------------------
  - name: Broker
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Broker / re-wholesaler company name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: ship_to_state, type: string, source: input, description: "Two-letter destination state code", constraints: "two uppercase letters" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Open-order credit ceiling in cents", constraints: ">= 0" }
      - { name: open_balance_cents, type: integer, source: computed, default: 0, description: "Sum of order_total_cents over this broker's CONFIRMED + FULFILLING orders not yet fully shipped" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ON_HOLD", default: "ACTIVE" }

  # ---------------------------------------------------------------------------
  - name: AvailabilityEntry
    parent: null
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: input, description: "FK -> PropagationBatch.id; the saleable lot this entry publishes" }
      - { name: variety_id, type: string, source: computed, description: "FK -> CropVariety.id; copied from the batch at publish time" }
      - { name: unit_price_cents, type: integer, source: input, description: "Wholesale price per finished plant in cents", constraints: ">= 1" }
      - { name: published_quantity, type: integer, source: computed, default: 0, description: "Saleable units offered = batch.saleable_count snapshot at publish, refreshed on regrade" }
      - { name: committed_quantity, type: integer, source: computed, default: 0, description: "Units committed to CONFIRMED/FULFILLING order lines drawing on this entry" }
      - { name: available_quantity, type: integer, source: computed, default: 0, description: "= published_quantity - committed_quantity; sellable remainder" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED", default: "OPEN" }

  # ---------------------------------------------------------------------------
  - name: BrokerOrder
    parent: null
    common_fields: true
    fields:
      - { name: broker_id, type: string, source: input, description: "FK -> Broker.id; the ordering broker" }
      - { name: requested_ship_date, type: datetime, source: input, description: "Requested ship date (UTC)" }
      - { name: order_subtotal_cents, type: integer, source: computed, default: 0, description: "Sum of line extended prices before freight" }
      - { name: freight_cents, type: integer, source: computed, default: 0, description: "Computed freight charge per freight schedule" }
      - { name: order_total_cents, type: integer, source: computed, default: 0, description: "= order_subtotal_cents + freight_cents" }
      - { name: status, type: enum, source: system, description: "Order lifecycle", default: "DRAFT", constraints: "DRAFT | CONFIRMED | FULFILLING | SHIPPED | CANCELLED" }

  # ---------------------------------------------------------------------------
  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> BrokerOrder.id; the parent order" }
      - { name: availability_entry_id, type: string, source: input, description: "FK -> AvailabilityEntry.id; the saleable lot drawn from" }
      - { name: quantity, type: integer, source: input, description: "Finished plants requested on this line", constraints: ">= 1" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Price-per-unit snapshot copied from the availability entry at line creation" }
      - { name: extended_cents, type: integer, source: computed, default: 0, description: "= quantity * unit_price_cents" }
      - { name: shipped_quantity, type: integer, source: computed, default: 0, description: "Units of this line dispatched on a shipment" }
      - { name: status, type: enum, source: system, description: "PENDING | COMMITTED | SHIPPED | RELEASED", default: "PENDING" }

  # ---------------------------------------------------------------------------
  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> BrokerOrder.id; order being dispatched" }
      - { name: phyto_certificate_id, type: string, source: input, description: "FK -> PhytoCertificate.id; attached cert (required when any line variety requires_phyto)", default: null }
      - { name: ship_units, type: integer, source: computed, default: 0, description: "Total finished plants on this shipment (sum of dispatched line quantities)" }
      - { name: shipped_at, type: datetime, source: computed, description: "Logical-clock timestamp when shipment dispatched" }
      - { name: status, type: enum, source: system, description: "DRAFT | DISPATCHED | VOIDED", default: "DRAFT" }

  # ---------------------------------------------------------------------------
  - name: PhytoCertificate
    parent: null
    common_fields: true
    fields:
      - { name: broker_id, type: string, source: input, description: "FK -> Broker.id; destination broker (its ship_to_state is certified)" }
      - { name: certificate_number, type: string, source: input, description: "State-issued phytosanitary certificate number", constraints: "unique among non-EXPIRED certs" }
      - { name: origin_state, type: string, source: input, description: "Two-letter issuing/origin state code", constraints: "two uppercase letters" }
      - { name: destination_state, type: string, source: computed, description: "Copied from broker.ship_to_state at issue" }
      - { name: inspected_at, type: datetime, source: computed, description: "Logical-clock timestamp of inspection (issue time)" }
      - { name: valid_until, type: datetime, source: input, description: "Certificate expiry (UTC); shipment must dispatch on or before this instant" }
      - { name: status, type: enum, source: system, description: "VALID | CONSUMED | EXPIRED", default: "VALID" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  - entity: CropVariety
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /nursery/varieties/{id}/activate"
        actor: GrowerManager
        preconditions:
          - "All required agronomy fields present (grow_cycle_days, ship_ready_grade_min_height_cm, ship_ready_min_live_pct, container_footprint_units)"
          - "cultivar_code unique among varieties whose status != RETIRED (ERR_DUPLICATE_CULTIVAR)"
        side_effects:
          - "Variety becomes eligible to back new PropagationBatch creation"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /nursery/varieties/{id}/suspend"
        actor: GrowerManager
        preconditions: []
        side_effects:
          - "New PropagationBatch creation against this variety is blocked while SUSPENDED; existing batches continue"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /nursery/varieties/{id}/activate"
        actor: GrowerManager
        preconditions:
          - "cultivar_code still unique among non-RETIRED varieties (ERR_DUPLICATE_CULTIVAR)"
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /nursery/varieties/{id}/retire"
        actor: GrowerManager
        preconditions:
          - "No PropagationBatch referencing this variety is in {PLANNED, GROWING, GRADING, SALEABLE, HELD} (ERR_VARIETY_IN_USE)"
        side_effects:
          - "cultivar_code freed for reuse by future varieties (uniqueness ignores RETIRED)"
      - from: SUSPENDED
        to: RETIRED
        trigger: "POST /nursery/varieties/{id}/retire"
        actor: GrowerManager
        preconditions:
          - "No PropagationBatch referencing this variety is in {PLANNED, GROWING, GRADING, SALEABLE, HELD} (ERR_VARIETY_IN_USE)"
        side_effects: []

  # ---------------------------------------------------------------------------
  - entity: Zone
    initial_state: OPEN_FOR_USE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: OPEN_FOR_USE
        to: QUARANTINED
        trigger: "POST /nursery/zones/{id}/quarantine"
        actor: GrowerManager
        preconditions: []
        side_effects:
          - "New PropagationBatch placement (PLANNED create + transplant) into this zone is blocked while QUARANTINED (ERR_ZONE_NOT_OPEN); existing batches keep growing"
      - from: QUARANTINED
        to: OPEN_FOR_USE
        trigger: "POST /nursery/zones/{id}/release-quarantine"
        actor: GrowerManager
        preconditions: []
        side_effects: []
      - from: OPEN_FOR_USE
        to: DECOMMISSIONED
        trigger: "POST /nursery/zones/{id}/decommission"
        actor: GrowerManager
        preconditions:
          - "occupied_units == 0 and reserved_units == 0 (ERR_ZONE_NOT_EMPTY)"
        side_effects:
          - "Zone removed from placement candidate set permanently"

  # ---------------------------------------------------------------------------
  - entity: PropagationBatch
    initial_state: PLANNED
    terminal_states: [CULLED, VOIDED]
    transitions:
      - from: PLANNED
        to: GROWING
        trigger: "POST /nursery/batches/{id}/transplant"
        actor: ProductionTech
        preconditions:
          - "variety.status == ACTIVE (ERR_VARIETY_NOT_ACTIVE)"
          - "zone.status == OPEN_FOR_USE (ERR_ZONE_NOT_OPEN)"
          - "Climate compatibility: zone.climate_class == MIXED OR matches variety propagation requirement (ERR_CLIMATE_MISMATCH)"
          - "started_count (request body) in [1, sourced_count] (ERR_INVALID_STARTED_COUNT)"
          - "started_count * variety.container_footprint_units <= zone.free_units + this batch's prior reserved_units (ERR_ZONE_CAPACITY_EXCEEDED)"
          - "OCC: expected_zone_version matches zone.version (ERR_STALE_VERSION)"
        side_effects:
          - "started_count set; live_count = started_count; cull_count = 0; saleable_count = 0"
          - "stick_date = clock now; target_ship_date = stick_date + variety.grow_cycle_days days"
          - "Zone reserved_units -= prior reservation for this batch; Zone occupied_units += started_count * container_footprint_units; Zone free_units, fill_state recomputed (CASCADE to Zone)"
          - "Zone.version increments by 1"
      - from: GROWING
        to: GRADING
        trigger: "POST /nursery/batches/{id}/start-grading"
        actor: ProductionTech
        preconditions:
          - "clock now >= target_ship_date (ERR_GROW_CYCLE_INCOMPLETE)"
          - "At least one GRADE InputLog with mean_height_cm recorded (ERR_NO_GRADE_MEASUREMENT)"
        side_effects:
          - "saleable_count recomputed via provisional saleable-count calc (forward-looking)"
      - from: GRADING
        to: SALEABLE
        trigger: "POST /nursery/batches/{id}/finalize-grade"
        actor: ProductionTech
        preconditions:
          - "mean_height_cm >= variety.ship_ready_grade_min_height_cm (ERR_GRADE_BELOW_SPEC)"
          - "live_count / started_count >= variety.ship_ready_min_live_pct (ERR_LIVE_PCT_BELOW_SPEC)"
        side_effects:
          - "saleable_count recomputed via FINAL graded saleable-count calc (= live_count); becomes immutable until regrade"
          - "Batch becomes publishable to an AvailabilityEntry"
      - from: GRADING
        to: HELD
        trigger: "POST /nursery/batches/{id}/finalize-grade"
        actor: ProductionTech
        preconditions:
          - "mean_height_cm < variety.ship_ready_grade_min_height_cm OR live_count / started_count < variety.ship_ready_min_live_pct"
        side_effects:
          - "saleable_count = 0; batch held back for re-grow (no availability published)"
      - from: HELD
        to: GRADING
        trigger: "POST /nursery/batches/{id}/start-grading"
        actor: ProductionTech
        preconditions:
          - "A newer GRADE InputLog recorded since entering HELD (ERR_NO_GRADE_MEASUREMENT)"
        side_effects:
          - "saleable_count recomputed via provisional calc; re-grade loop (HELD->GRADING->{SALEABLE|HELD})"
      - from: SALEABLE
        to: GRADING
        trigger: "POST /nursery/batches/{id}/start-grading"
        actor: ProductionTech
        preconditions:
          - "No OrderLine drawing on this batch's AvailabilityEntry is in COMMITTED state (ERR_BATCH_HAS_COMMITMENTS)"
          - "A newer GRADE InputLog recorded since entering SALEABLE (ERR_NO_GRADE_MEASUREMENT)"
        side_effects:
          - "Re-grade after a fresh measurement; AvailabilityEntry.published_quantity will be refreshed on next finalize"
      - from: GROWING
        to: CULLED
        trigger: "POST /nursery/batches/{id}/cull-batch"
        actor: ProductionTech
        preconditions:
          - "No COMMITTED OrderLine draws on this batch (ERR_BATCH_HAS_COMMITMENTS)"
        side_effects:
          - "cull_count += live_count; live_count = 0; saleable_count = 0"
          - "Zone occupied_units -= released footprint; free_units, fill_state recomputed (CASCADE to Zone)"
          - "Zone.version increments by 1"
      - from: HELD
        to: CULLED
        trigger: "POST /nursery/batches/{id}/cull-batch"
        actor: ProductionTech
        preconditions: []
        side_effects:
          - "cull_count += live_count; live_count = 0"
          - "Zone occupied_units -= released footprint; recompute (CASCADE to Zone); Zone.version increments by 1"
      - from: SALEABLE
        to: CULLED
        trigger: "POST /nursery/batches/{id}/cull-batch"
        actor: ProductionTech
        preconditions:
          - "No COMMITTED OrderLine draws on this batch's AvailabilityEntry (ERR_BATCH_HAS_COMMITMENTS)"
        side_effects:
          - "cull_count += live_count; live_count = 0; saleable_count = 0"
          - "Any OPEN AvailabilityEntry for this batch -> CLOSED, published_quantity = 0 (CASCADE)"
          - "Zone occupied_units -= released footprint; recompute (CASCADE to Zone); Zone.version increments by 1"
      - from: PLANNED
        to: VOIDED
        trigger: "POST /nursery/batches/{id}/void"
        actor: GrowerManager
        preconditions: []
        side_effects:
          - "Zone reserved_units -= this batch's reservation; free_units, fill_state recomputed (CASCADE to Zone); Zone.version increments by 1"

  # ---------------------------------------------------------------------------
  - entity: BrokerOrder
    initial_state: DRAFT
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /nursery/orders/{id}/confirm"
        actor: SalesCoordinator
        preconditions:
          - "Order has >= 1 OrderLine (ERR_EMPTY_ORDER)"
          - "broker.status == ACTIVE (ERR_BROKER_ON_HOLD)"
          - "For each line: line.quantity <= entry.available_quantity (ERR_INSUFFICIENT_AVAILABILITY)"
          - "broker.open_balance_cents + order_total_cents <= broker.credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
          - "OCC: expected_order_version matches order.version (ERR_STALE_VERSION)"
        side_effects:
          - "Each line PENDING -> COMMITTED; entry.committed_quantity += line.quantity, available_quantity recomputed (CASCADE to AvailabilityEntry)"
          - "order_subtotal_cents, freight_cents, order_total_cents finalized via order-pricing calc"
          - "broker.open_balance_cents += order_total_cents (CASCADE to Broker)"
          - "order.version increments by 1"
      - from: CONFIRMED
        to: FULFILLING
        trigger: "POST /nursery/shipments (first DISPATCHED shipment for the order)"
        actor: SalesCoordinator
        preconditions:
          - "All committed lines draw on batches that are SALEABLE"
        side_effects:
          - "Order enters partial fulfillment"
      - from: FULFILLING
        to: SHIPPED
        trigger: "system (automatic when every COMMITTED line has shipped_quantity == quantity)"
        actor: system
        preconditions: []
        side_effects:
          - "broker.open_balance_cents -= order_total_cents (CASCADE to Broker)"
          - "Each fully shipped line -> SHIPPED"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /nursery/orders/{id}/cancel"
        actor: SalesCoordinator
        preconditions:
          - "No Shipment for this order is DISPATCHED (ERR_ORDER_HAS_SHIPMENT)"
        side_effects:
          - "Each COMMITTED line -> RELEASED; entry.committed_quantity -= line.quantity, available_quantity recomputed (CASCADE to AvailabilityEntry)"
          - "broker.open_balance_cents -= order_total_cents (CASCADE to Broker); COMPENSATION of confirm"
          - "order.version increments by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /nursery/orders/{id}/cancel"
        actor: SalesCoordinator
        preconditions: []
        side_effects:
          - "Each PENDING line -> RELEASED (no commitments existed; no ledger change)"

  # ---------------------------------------------------------------------------
  - entity: Shipment
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: DISPATCHED
        trigger: "POST /nursery/shipments/{id}/dispatch"
        actor: SalesCoordinator
        preconditions:
          - "order.status in {CONFIRMED, FULFILLING} (ERR_ORDER_NOT_FULFILLABLE)"
          - "Every line in the dispatch draws on a batch in SALEABLE with live_count >= remaining line quantity (ERR_BATCH_NOT_SALEABLE / ERR_INSUFFICIENT_LIVE_STOCK)"
          - "If any line's variety.requires_phyto: phyto_certificate_id present, cert.status == VALID, cert.destination_state == broker.ship_to_state, clock now <= cert.valid_until (ERR_PHYTO_REQUIRED / ERR_PHYTO_INVALID / ERR_PHYTO_EXPIRED / ERR_PHYTO_DESTINATION_MISMATCH)"
        side_effects:
          - "For each dispatched line: line.shipped_quantity += dispatched qty; batch.shipped_count += qty; batch.live_count -= qty (CASCADE to PropagationBatch)"
          - "Zone occupied_units -= shipped footprint; recompute (CASCADE to Zone); Zone.version increments by 1"
          - "order: CONFIRMED -> FULFILLING (first dispatch); SHIPPED when all lines fully shipped (CASCADE to BrokerOrder, then Broker ledger)"
          - "If phyto attached: PhytoCertificate VALID -> CONSUMED (CASCADE)"
          - "shipped_at = clock now; ship_units recorded"
      - from: DISPATCHED
        to: VOIDED
        trigger: "POST /nursery/shipments/{id}/void"
        actor: SalesCoordinator
        preconditions:
          - "order.status != SHIPPED (ERR_ORDER_ALREADY_CLOSED)"
        side_effects:
          - "COMPENSATION: each line.shipped_quantity -= dispatched qty; batch.shipped_count -= qty; batch.live_count += qty (CASCADE to PropagationBatch)"
          - "Zone occupied_units += restored footprint; recompute (CASCADE to Zone); Zone.version increments by 1"
          - "order FULFILLING -> stays FULFILLING or reverts toward CONFIRMED semantics; broker ledger restored if it had closed"
          - "If a PhytoCertificate was CONSUMED by this shipment: revert CONSUMED -> VALID (CASCADE)"

  # ---------------------------------------------------------------------------
  - entity: PhytoCertificate
    initial_state: VALID
    terminal_states: [EXPIRED]
    transitions:
      - from: VALID
        to: CONSUMED
        trigger: "system (on Shipment dispatch consuming this cert)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONSUMED
        to: VALID
        trigger: "system (on Shipment void releasing this cert)"
        actor: system
        preconditions: []
        side_effects: []
      - from: VALID
        to: EXPIRED
        trigger: "system (during ops checkpoint when clock now > valid_until)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version — true CREATE-with-supersede races)
# =============================================================================
concurrency_rules:
  - rule_id: transplant-stale-zone
    parent_entity: Zone
    write_endpoint: "POST /nursery/batches/{id}/transplant"
    occ_field: "expected_zone_version"
    description: |
      Transplanting a PLANNED batch into a Zone whose version has advanced
      since the client last observed it is rejected. Another transplant or
      cull just changed the zone's occupied/free footprint, so the client's
      view of available space is stale and the new placement may legitimately
      over-fill the zone under the fresh occupancy.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: confirm-stale-order
    parent_entity: BrokerOrder
    write_endpoint: "POST /nursery/orders/{id}/confirm"
    occ_field: "expected_order_version"
    description: |
      Confirming a DRAFT order whose version has advanced since the client
      last observed it is rejected. A line add/remove or a prior confirm has
      changed the order's lines/totals, so the credit-and-availability snapshot
      the client confirmed against is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- DUAL-VARIANT #1 (PropagationBatch domain): saleable count ---------------
  - name: saleable_count
    trigger: "batch grading (start-grading recompute provisional; finalize-grade recompute final)"
    algorithm: forward_looking
    formula: |
      # PROVISIONAL (forward-looking, at start-grading): projects how many
      # plants WILL pass grade, discounting expected scouting shrink that has
      # not yet been culled.
      provisional_saleable = floor( live_count * variety.ship_ready_min_live_pct )
      # FINAL (at finalize-grade -> SALEABLE): the actual graded count is the
      # whole living stand, because plants below spec were already culled
      # during GRADING via scouting cull events.
      final_saleable = live_count
    input_set: "live_count = started_count - cull_count - shipped_count at the moment of the trigger"
    constants: {}
    precision: "integer plants; floor on provisional projection"
    variants:
      - name: provisional
        when: "GROWING->GRADING and HELD->GRADING transitions (start-grading)"
        difference: "floor(live_count * ship_ready_min_live_pct) — a forward projection that is strictly <= final whenever ship_ready_min_live_pct < 1"
      - name: final
        when: "GRADING->SALEABLE transition (finalize-grade)"
        difference: "= live_count exactly; the realized graded stand after scouting culls, with no min-live discount applied"

  # --- DUAL-VARIANT #2 (Broker domain): loss-cost charge-back ------------------
  - name: shrink_loss_cost
    trigger: "batch cull (cull-batch) and on ops-checkpoint shrink sweep"
    algorithm: aggregation
    formula: |
      # STANDARD-cost variant: values culled plants at a flat standard plug cost.
      standard_loss_cents = culled_now * STANDARD_PLUG_COST_CENTS
      # ACTUAL-cost variant: amortizes the batch's real sourcing spend across the
      # plants that were actually started, then charges the culled fraction.
      actual_unit_cost_cents = round_half_up( (sourced_count * STANDARD_PLUG_COST_CENTS) / started_count )
      actual_loss_cents = culled_now * actual_unit_cost_cents
    input_set: "culled_now = units removed by THIS cull action (live_count just before the cull for a full cull; dead_observed delta for a partial scouting cull)"
    constants:
      STANDARD_PLUG_COST_CENTS: 35
    precision: "integer cents; round_half_up on per-unit amortization BEFORE multiplying by culled_now"
    variants:
      - name: standard
        when: "default loss accounting (flat plug cost per culled unit)"
        difference: "culled_now * 35 — ignores how many plugs were actually bought vs started"
      - name: actual
        when: "when batch over-sourced (sourced_count > started_count): the real per-plant cost is higher"
        difference: "amortizes total plug spend over started_count, rounds per-unit, then multiplies — diverges from standard whenever sourced_count != started_count"

  # --- COMBINATORIAL #1 (mode b: nested rounding, order pinned) -----------------
  - name: order_pricing
    trigger: "BrokerOrder DRAFT->CONFIRMED (confirm) and recompute on any line add/remove while DRAFT"
    algorithm: aggregation
    formula: |
      # ORDER PINNED (round-per-line THEN sum), then freight, then volume rebate:
      # 1. For each line: extended_cents = quantity * unit_price_cents  (exact, no rounding needed — cents)
      # 2. order_subtotal_cents = sum(extended_cents over all lines)     (sum of exact integers)
      # 3. freight_cents = freight_for(total_units, broker.ship_to_state)  (see freight_charge calc)
      # 4. volume_rebate_cents = rebate tier applied to order_subtotal_cents:
      #       if total_units >= 5000: rebate = round_half_up(order_subtotal_cents * 0.05)
      #       elif total_units >= 2000: rebate = round_half_up(order_subtotal_cents * 0.02)
      #       else: rebate = 0
      #    Rounding of the rebate is computed on the SUMMED subtotal (sum-then-round),
      #    NOT per line; the two orders ("round each line's rebate then sum" vs
      #    "sum then round") differ by up to (#lines - 1) cents — this calc pins SUM-THEN-ROUND.
      # 5. order_total_cents = order_subtotal_cents - volume_rebate_cents + freight_cents
      total_units = sum(line.quantity over all lines)
    input_set: "all OrderLine rows on the order (status PENDING at confirm time)"
    constants:
      REBATE_TIER_1_UNITS: 2000
      REBATE_TIER_1_PCT: 0.02
      REBATE_TIER_2_UNITS: 5000
      REBATE_TIER_2_PCT: 0.05
    precision: "integer cents; rebate uses round_half_up on the SUMMED subtotal (sum-then-round, pinned); evaluation order is steps 1->5 exactly"

  # --- COMBINATORIAL #2 (mode a: >=3 inputs, nested min/tier interaction) -------
  - name: freight_charge
    trigger: "order_pricing step 3 (on confirm and on DRAFT line recompute)"
    algorithm: tiered_pricing
    formula: |
      # freight depends on three interacting inputs: total_units, destination
      # zone band (derived from broker.ship_to_state), and an oversize surcharge.
      zone_band = freight_band_for(ship_to_state)   # IN_STATE | NEIGHBOR | FAR  (constants below)
      base = FREIGHT_BASE_CENTS[zone_band]
      # per-rack: 50 finished plants per rack, ceil
      racks = ceil(total_units / 50)
      per_rack = FREIGHT_PER_RACK_CENTS[zone_band]
      raw_freight = base + racks * per_rack
      # nested cap/floor: freight is capped at a band ceiling but never below band floor
      freight_cents = min( FREIGHT_CAP_CENTS[zone_band], max(FREIGHT_FLOOR_CENTS[zone_band], raw_freight) )
    input_set: "total_units across order lines; broker.ship_to_state -> zone_band"
    constants:
      RACK_CAPACITY: 50
      FREIGHT_BASE_CENTS: { IN_STATE: 2500, NEIGHBOR: 4000, FAR: 7000 }
      FREIGHT_PER_RACK_CENTS: { IN_STATE: 600, NEIGHBOR: 1100, FAR: 1900 }
      FREIGHT_FLOOR_CENTS: { IN_STATE: 2500, NEIGHBOR: 4000, FAR: 7000 }
      FREIGHT_CAP_CENTS: { IN_STATE: 9000, NEIGHBOR: 16000, FAR: 28000 }
      IN_STATE_CODES: "broker.ship_to_state == origin reference state 'OR'"
      NEIGHBOR_CODES: ["WA", "CA", "ID", "NV"]
    precision: "integer cents; ceil on rack count; min/max applied AFTER raw freight"

  # --- ZONE OCCUPANCY RECONCILIATION (derived-field) ---------------------------
  - name: zone_occupancy
    trigger: "any batch transplant, cull, ship, void, or shipment void touching a zone"
    algorithm: aggregation
    formula: |
      occupied_units = sum( b.live_count * v.container_footprint_units
                            for b in batches where b.zone_id == zone.id
                            and b.status in {GROWING, GRADING, SALEABLE, HELD}
                            and v = variety_of(b) )
      reserved_units = sum( b.sourced_count * v.container_footprint_units
                            for b in batches where b.zone_id == zone.id
                            and b.status == PLANNED )
      free_units = capacity_units - occupied_units - reserved_units
    input_set: "all non-terminal batches assigned to the zone; PLANNED reserve by sourced_count, live batches occupy by live_count"
    constants: {}
    precision: "integer footprint units; full recompute (not incremental) on every triggering event to avoid drift"

  # --- ZONE FILL POSTURE (threshold / boundary) --------------------------------
  - name: zone_fill_state
    trigger: "any change to zone.free_units (recomputed by zone_occupancy)"
    algorithm: threshold
    formula: |
      if free_units <= 0:
        fill_state = FULL
      elif free_units <= floor(capacity_units * TIGHT_FRACTION):
        fill_state = TIGHT
      else:
        fill_state = OPEN
      # TIGHT gates new PLANNED placements: when fill_state == TIGHT, a new batch's
      # reservation footprint must not exceed floor(free_units / 2) (ERR_ZONE_TIGHT_FILL_CAP);
      # when FULL, no new PLANNED placement at all (ERR_ZONE_CAPACITY_EXCEEDED).
    input_set: "zone.free_units, zone.capacity_units"
    constants:
      TIGHT_FRACTION: 0.15
    precision: "boundary: free_units == 0 is FULL (<=, not <); free_units == floor(capacity*0.15) is TIGHT (<=, not <)"

  # --- BATCH SHRINK / SCOUTING CULL (threshold trigger) ------------------------
  - name: scouting_shrink
    trigger: "a SCOUTING or GRADE InputLog with dead_observed > 0 recorded against a GROWING/GRADING/HELD batch"
    algorithm: threshold
    formula: |
      newly_dead = dead_observed                      # units reported on the event
      cull_count += newly_dead
      live_count = started_count - cull_count - shipped_count
      cumulative_shrink_pct = cull_count / started_count
      # AUTO-CULL gate: if cumulative shrink reaches/exceeds AUTO_CULL_PCT the whole
      # batch is auto-culled (system cull): live_count -> 0 added to cull_count.
      if cumulative_shrink_pct >= AUTO_CULL_PCT and batch.status in {GROWING, GRADING, HELD}:
        cull remaining live_count -> CULLED (system); cascade zone release
    input_set: "dead_observed on the event; started_count, cull_count, shipped_count on the batch"
    constants:
      AUTO_CULL_PCT: 0.50
    precision: "integer plants; boundary: cumulative_shrink_pct == 0.50 triggers auto-cull (>=)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted to perform the operation per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body referenced resources exist (validated left-to-right in path, then body FKs)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "Body required fields present and well-typed; enums in allowed set; numeric ranges honored"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 5
    category: business_referential
    check: "Broker acting on an order must own it (order.broker_id == X-User-ID); cert/order FK targets belong to the same broker"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "Broker-role order operations"

  - priority: 6
    category: state
    check: "Target resource is in a state from which this transition is defined (§1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_constraint
    check: "cultivar_code unique among non-RETIRED varieties on activate"
    error_id: ERR_DUPLICATE_CULTIVAR
    http_status: 409
    applies_to: "POST /nursery/varieties/{id}/activate"

  - priority: 8
    category: business_referential
    check: "Variety must be ACTIVE to create/transplant a batch against it"
    error_id: ERR_VARIETY_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /nursery/batches, POST /nursery/batches/{id}/transplant"

  - priority: 9
    category: business_referential
    check: "Zone must be OPEN_FOR_USE to place a new PLANNED batch or transplant into it"
    error_id: ERR_ZONE_NOT_OPEN
    http_status: 409
    applies_to: "POST /nursery/batches, POST /nursery/batches/{id}/transplant"

  - priority: 10
    category: business_safety
    check: "Climate compatibility between variety and zone on transplant (zone MIXED accepts all)"
    error_id: ERR_CLIMATE_MISMATCH
    http_status: 409
    applies_to: "POST /nursery/batches/{id}/transplant"

  - priority: 11
    category: business_safety
    check: "Phytosanitary cert required/valid/non-expired/destination-matched before dispatch when any line variety requires_phyto"
    error_id: "ERR_PHYTO_REQUIRED / ERR_PHYTO_INVALID / ERR_PHYTO_EXPIRED / ERR_PHYTO_DESTINATION_MISMATCH"
    http_status: 409
    applies_to: "POST /nursery/shipments/{id}/dispatch"

  - priority: 12
    category: business_temporal
    check: "Grow cycle complete (clock now >= target_ship_date) before start-grading"
    error_id: ERR_GROW_CYCLE_INCOMPLETE
    http_status: 409
    applies_to: "POST /nursery/batches/{id}/start-grading"

  - priority: 13
    category: business_constraint
    check: "Grade gates: mean_height_cm >= spec AND live_pct >= spec to reach SALEABLE; a GRADE measurement must exist before grading"
    error_id: "ERR_GRADE_BELOW_SPEC / ERR_LIVE_PCT_BELOW_SPEC / ERR_NO_GRADE_MEASUREMENT"
    http_status: 409
    applies_to: "POST /nursery/batches/{id}/start-grading, POST /nursery/batches/{id}/finalize-grade"

  - priority: 14
    category: business_constraint
    check: "Batch must have no COMMITTED order-line draws before regrade or cull from a saleable state"
    error_id: ERR_BATCH_HAS_COMMITMENTS
    http_status: 409
    applies_to: "POST /nursery/batches/{id}/start-grading, POST /nursery/batches/{id}/cull-batch"

  - priority: 15
    category: business_constraint
    check: "Order availability: each line.quantity <= entry.available_quantity at confirm"
    error_id: ERR_INSUFFICIENT_AVAILABILITY
    http_status: 409
    applies_to: "POST /nursery/orders/{id}/confirm"

  - priority: 16
    category: business_constraint
    check: "Dispatch stock: each shipping line draws on a SALEABLE batch with live_count >= remaining quantity"
    error_id: "ERR_BATCH_NOT_SALEABLE / ERR_INSUFFICIENT_LIVE_STOCK"
    http_status: 409
    applies_to: "POST /nursery/shipments/{id}/dispatch"

  - priority: 17
    category: business_temporal
    check: "Zone fill cap: TIGHT zone limits a new PLANNED reservation to floor(free_units/2); FULL zone forbids new placement; transplant must fit free_units"
    error_id: "ERR_ZONE_TIGHT_FILL_CAP / ERR_ZONE_CAPACITY_EXCEEDED"
    http_status: 409
    applies_to: "POST /nursery/batches, POST /nursery/batches/{id}/transplant"

  - priority: 18
    category: business_fiscal
    check: "Broker credit: open_balance_cents + order_total_cents <= credit_limit_cents at confirm"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /nursery/orders/{id}/confirm"

  - priority: 19
    category: state
    check: "OCC: expected_<parent>_version matches the current parent version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /nursery/batches/{id}/transplant, POST /nursery/orders/{id}/confirm"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- CropVariety ---------------------------------------------------------
  - method: POST
    path: "/nursery/varieties"
    description: "Create a crop variety in DRAFT"
    roles: [GrowerManager]
    code: 201
    input: [common_name, cultivar_code, propagation_form, grow_cycle_days, container_footprint_units, ship_ready_grade_min_height_cm, ship_ready_min_live_pct, "requires_phyto?"]
    output: CropVariety
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/nursery/varieties/{id}"
    description: "Get one variety"
    roles: [GrowerManager, ProductionTech, SalesCoordinator, Broker]
    code: 200
    input: []
    output: CropVariety
    side_effects: []
  - method: GET
    path: "/nursery/varieties"
    description: "List varieties (paginated; filter by status)"
    roles: [GrowerManager, ProductionTech, SalesCoordinator, Broker]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CropVariety[]
    side_effects: []
  - method: POST
    path: "/nursery/varieties/{id}/activate"
    description: "Activate a variety (DRAFT/SUSPENDED -> ACTIVE)"
    roles: [GrowerManager]
    code: 200
    input: []
    output: CropVariety
    side_effects: ["status -> ACTIVE", "cultivar_code uniqueness enforced among non-RETIRED"]
  - method: POST
    path: "/nursery/varieties/{id}/suspend"
    description: "Suspend an ACTIVE variety"
    roles: [GrowerManager]
    code: 200
    input: []
    output: CropVariety
    side_effects: ["status -> SUSPENDED"]
  - method: POST
    path: "/nursery/varieties/{id}/retire"
    description: "Retire a variety (terminal)"
    roles: [GrowerManager]
    code: 200
    input: []
    output: CropVariety
    side_effects: ["status -> RETIRED", "cultivar_code freed for reuse"]

  # ----- Zone ----------------------------------------------------------------
  - method: POST
    path: "/nursery/zones"
    description: "Create a greenhouse zone"
    roles: [GrowerManager]
    code: 201
    input: [name, climate_class, capacity_units]
    output: Zone
    side_effects: ["occupied_units=0, reserved_units=0, free_units=capacity_units, fill_state=OPEN, status=OPEN_FOR_USE"]
  - method: GET
    path: "/nursery/zones/{id}"
    description: "Get one zone with live occupancy fields"
    roles: [GrowerManager, ProductionTech, SalesCoordinator]
    code: 200
    input: []
    output: Zone
    side_effects: []
  - method: GET
    path: "/nursery/zones"
    description: "List zones (paginated; filter by status, fill_state)"
    roles: [GrowerManager, ProductionTech, SalesCoordinator]
    code: 200
    input: ["status?", "fill_state?", "limit?", "offset?"]
    output: Zone[]
    side_effects: []
  - method: GET
    path: "/nursery/zones/{id}/batches"
    description: "List batches assigned to a zone (reverse-reachability for PropagationBatch.zone_id)"
    roles: [GrowerManager, ProductionTech, SalesCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PropagationBatch[]
    side_effects: []
  - method: POST
    path: "/nursery/zones/{id}/quarantine"
    description: "Quarantine a zone (blocks new placement)"
    roles: [GrowerManager]
    code: 200
    input: []
    output: Zone
    side_effects: ["status -> QUARANTINED"]
  - method: POST
    path: "/nursery/zones/{id}/release-quarantine"
    description: "Release a quarantined zone"
    roles: [GrowerManager]
    code: 200
    input: []
    output: Zone
    side_effects: ["status -> OPEN_FOR_USE"]
  - method: POST
    path: "/nursery/zones/{id}/decommission"
    description: "Decommission an empty zone (terminal)"
    roles: [GrowerManager]
    code: 200
    input: []
    output: Zone
    side_effects: ["status -> DECOMMISSIONED (requires occupied_units==0 and reserved_units==0)"]

  # ----- PropagationBatch ----------------------------------------------------
  - method: POST
    path: "/nursery/batches"
    description: "Create a PLANNED batch (reserves zone footprint by sourced_count)"
    roles: [GrowerManager, ProductionTech]
    code: 201
    input: [variety_id, zone_id, source_supplier, sourced_count]
    output: PropagationBatch
    side_effects:
      - "status=PLANNED; lot_code minted; live_count=0; saleable_count=0"
      - "zone.reserved_units += sourced_count * variety.container_footprint_units (subject to fill-state cap); recompute zone free_units/fill_state (CASCADE to Zone)"
  - method: GET
    path: "/nursery/batches/{id}"
    description: "Get one batch with computed counts"
    roles: [GrowerManager, ProductionTech, SalesCoordinator]
    code: 200
    input: []
    output: PropagationBatch
    side_effects: []
  - method: GET
    path: "/nursery/batches"
    description: "List batches (paginated; filter by status, variety_id, zone_id)"
    roles: [GrowerManager, ProductionTech, SalesCoordinator]
    code: 200
    input: ["status?", "variety_id?", "zone_id?", "limit?", "offset?"]
    output: PropagationBatch[]
    side_effects: []
  - method: POST
    path: "/nursery/batches/{id}/transplant"
    description: "Transplant a PLANNED batch into its zone (PLANNED -> GROWING); OCC-guarded on zone"
    roles: [ProductionTech]
    code: 200
    input: [started_count, expected_zone_version]
    output: PropagationBatch
    side_effects:
      - "started_count set; live_count=started_count; stick_date, target_ship_date set"
      - "zone.reserved_units -= prior reservation; zone.occupied_units += started_count*footprint; recompute (CASCADE to Zone); zone.version increments by 1"
  - method: POST
    path: "/nursery/batches/{id}/start-grading"
    description: "Begin grading (GROWING/HELD/SALEABLE -> GRADING); recompute provisional saleable_count"
    roles: [ProductionTech]
    code: 200
    input: []
    output: PropagationBatch
    side_effects: ["status -> GRADING", "saleable_count = provisional"]
  - method: POST
    path: "/nursery/batches/{id}/finalize-grade"
    description: "Finalize grade: pass -> SALEABLE (final saleable_count) or fail -> HELD"
    roles: [ProductionTech]
    code: 200
    input: []
    output: PropagationBatch
    side_effects:
      - "If meets height+live spec: status -> SALEABLE, saleable_count=live_count, refresh any AvailabilityEntry.published_quantity (CASCADE)"
      - "Else: status -> HELD, saleable_count=0"
  - method: POST
    path: "/nursery/batches/{id}/cull-batch"
    description: "Cull the whole living stand of a batch (-> CULLED); compute shrink_loss_cost"
    roles: [ProductionTech]
    code: 200
    input: ["loss_basis?"]
    output: PropagationBatch
    side_effects:
      - "cull_count += live_count; live_count=0; saleable_count=0; status -> CULLED"
      - "Close any OPEN AvailabilityEntry for this batch (CASCADE); release zone footprint (CASCADE to Zone); zone.version increments by 1"
  - method: POST
    path: "/nursery/batches/{id}/void"
    description: "Void a PLANNED batch (-> VOIDED); releases its zone reservation"
    roles: [GrowerManager]
    code: 200
    input: []
    output: PropagationBatch
    side_effects:
      - "status -> VOIDED"
      - "zone.reserved_units -= this batch's reservation; recompute free_units/fill_state (CASCADE to Zone); zone.version increments by 1"
  - method: GET
    path: "/nursery/batches/{id}/input-logs"
    description: "List input-log events for a batch (reverse-reachability for InputLog.batch_id)"
    roles: [GrowerManager, ProductionTech, SalesCoordinator]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: InputLog[]
    side_effects: []
  - method: POST
    path: "/nursery/batches/{id}/input-logs"
    description: "Record a climate/irrigation/fertilizer/scouting/grade event; SCOUTING/GRADE with dead_observed drives shrink/auto-cull"
    roles: [ProductionTech]
    code: 201
    input: [event_type, "temperature_c?", "irrigation_liters?", "fertilizer_ppm_n?", "mean_height_cm?", "dead_observed?", "note?"]
    output: InputLog
    side_effects:
      - "recorded_at = clock now"
      - "GRADE: batch.mean_height_cm updated"
      - "SCOUTING/GRADE with dead_observed>0: batch.cull_count += dead_observed; recompute live_count; if cumulative shrink >= 0.50 auto-cull batch -> CULLED (CASCADE to Zone)"

  # ----- Broker --------------------------------------------------------------
  - method: POST
    path: "/nursery/brokers"
    description: "Create a broker account"
    roles: [SalesCoordinator]
    code: 201
    input: [company_name, contact_email, ship_to_state, credit_limit_cents]
    output: Broker
    side_effects: ["status=ACTIVE, open_balance_cents=0"]
  - method: GET
    path: "/nursery/brokers/{id}"
    description: "Get one broker with open-balance ledger"
    roles: [SalesCoordinator, Broker]
    code: 200
    input: []
    output: Broker
    side_effects: []
  - method: GET
    path: "/nursery/brokers"
    description: "List brokers (paginated; filter by status)"
    roles: [SalesCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Broker[]
    side_effects: []
  - method: POST
    path: "/nursery/brokers/{id}/hold"
    description: "Put a broker ON_HOLD (blocks new order confirms)"
    roles: [SalesCoordinator]
    code: 200
    input: []
    output: Broker
    side_effects: ["status -> ON_HOLD"]
  - method: POST
    path: "/nursery/brokers/{id}/reinstate"
    description: "Reinstate an ON_HOLD broker"
    roles: [SalesCoordinator]
    code: 200
    input: []
    output: Broker
    side_effects: ["status -> ACTIVE"]

  # ----- AvailabilityEntry ---------------------------------------------------
  - method: POST
    path: "/nursery/availability"
    description: "Publish a saleable batch to the availability list"
    roles: [SalesCoordinator]
    code: 201
    input: [batch_id, unit_price_cents]
    output: AvailabilityEntry
    side_effects:
      - "Requires batch.status==SALEABLE (ERR_BATCH_NOT_SALEABLE); variety_id copied"
      - "published_quantity = batch.saleable_count; committed_quantity=0; available_quantity=published_quantity; status=OPEN"
  - method: GET
    path: "/nursery/availability/{id}"
    description: "Get one availability entry with committed/available quantities"
    roles: [SalesCoordinator, Broker]
    code: 200
    input: []
    output: AvailabilityEntry
    side_effects: []
  - method: GET
    path: "/nursery/availability"
    description: "List availability entries (paginated; filter by status, variety_id, batch_id)"
    roles: [SalesCoordinator, Broker]
    code: 200
    input: ["status?", "variety_id?", "batch_id?", "limit?", "offset?"]
    output: AvailabilityEntry[]
    side_effects: []
  - method: POST
    path: "/nursery/availability/{id}/close"
    description: "Manually close an availability entry (no further commitments)"
    roles: [SalesCoordinator]
    code: 200
    input: []
    output: AvailabilityEntry
    side_effects: ["status -> CLOSED"]

  # ----- BrokerOrder + OrderLine ---------------------------------------------
  - method: POST
    path: "/nursery/orders"
    description: "Create a DRAFT broker order"
    roles: [SalesCoordinator, Broker]
    code: 201
    input: [broker_id, requested_ship_date]
    output: BrokerOrder
    side_effects: ["status=DRAFT; totals=0"]
  - method: GET
    path: "/nursery/orders/{id}"
    description: "Get one order with computed totals"
    roles: [SalesCoordinator, Broker]
    code: 200
    input: []
    output: BrokerOrder
    side_effects: []
  - method: GET
    path: "/nursery/orders"
    description: "List orders (paginated; filter by status, broker_id)"
    roles: [SalesCoordinator, Broker]
    code: 200
    input: ["status?", "broker_id?", "limit?", "offset?"]
    output: BrokerOrder[]
    side_effects: []
  - method: POST
    path: "/nursery/orders/{id}/lines"
    description: "Add a line to a DRAFT order; snapshots unit price; recompute order totals"
    roles: [SalesCoordinator, Broker]
    code: 201
    input: [availability_entry_id, quantity]
    output: OrderLine
    side_effects:
      - "unit_price_cents snapshot from entry; extended_cents=quantity*unit_price_cents; status=PENDING"
      - "recompute order_subtotal_cents, freight_cents, order_total_cents (order_pricing); order.version increments by 1"
  - method: GET
    path: "/nursery/orders/{id}/lines"
    description: "List lines on an order (reverse-reachability for OrderLine.order_id)"
    roles: [SalesCoordinator, Broker]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []
  - method: GET
    path: "/nursery/order-lines/{id}"
    description: "Get one order line"
    roles: [SalesCoordinator, Broker]
    code: 200
    input: []
    output: OrderLine
    side_effects: []
  - method: GET
    path: "/nursery/order-lines"
    description: "List order lines (filter by order_id, availability_entry_id, status) — reverse-reachability for OrderLine.availability_entry_id"
    roles: [SalesCoordinator, Broker]
    code: 200
    input: ["order_id?", "availability_entry_id?", "status?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []
  - method: DELETE
    path: "/nursery/order-lines/{id}"
    description: "Remove a PENDING line from a DRAFT order; recompute totals"
    roles: [SalesCoordinator, Broker]
    code: 200
    input: []
    output: OrderLine
    side_effects: ["status -> RELEASED; recompute order totals (order_pricing); order.version increments by 1"]
  - method: POST
    path: "/nursery/orders/{id}/confirm"
    description: "Confirm a DRAFT order (commit lines, charge credit); OCC-guarded on order"
    roles: [SalesCoordinator]
    code: 200
    input: [expected_order_version]
    output: BrokerOrder
    side_effects:
      - "lines PENDING -> COMMITTED; entry.committed_quantity += qty (CASCADE to AvailabilityEntry)"
      - "broker.open_balance_cents += order_total_cents (CASCADE to Broker); status -> CONFIRMED; order.version increments by 1"
  - method: POST
    path: "/nursery/orders/{id}/cancel"
    description: "Cancel a DRAFT or CONFIRMED order; releases commitments and credit"
    roles: [SalesCoordinator]
    code: 200
    input: []
    output: BrokerOrder
    side_effects:
      - "COMMITTED lines -> RELEASED; entry.committed_quantity -= qty (CASCADE); broker.open_balance_cents -= order_total_cents (CASCADE)"
      - "status -> CANCELLED"

  # ----- PhytoCertificate ----------------------------------------------------
  - method: POST
    path: "/nursery/phyto-certificates"
    description: "Issue a phytosanitary certificate for a broker destination"
    roles: [SalesCoordinator]
    code: 201
    input: [broker_id, certificate_number, origin_state, valid_until]
    output: PhytoCertificate
    side_effects: ["status=VALID; destination_state copied from broker.ship_to_state; inspected_at=clock now"]
  - method: GET
    path: "/nursery/phyto-certificates/{id}"
    description: "Get one phyto certificate"
    roles: [SalesCoordinator, Broker]
    code: 200
    input: []
    output: PhytoCertificate
    side_effects: []
  - method: GET
    path: "/nursery/phyto-certificates"
    description: "List phyto certificates (filter by broker_id, status) — reverse-reachability for PhytoCertificate.broker_id"
    roles: [SalesCoordinator, Broker]
    code: 200
    input: ["broker_id?", "status?", "limit?", "offset?"]
    output: PhytoCertificate[]
    side_effects: []

  # ----- Shipment ------------------------------------------------------------
  - method: POST
    path: "/nursery/shipments"
    description: "Create a DRAFT shipment for a CONFIRMED/FULFILLING order, naming the lines+quantities to dispatch"
    roles: [SalesCoordinator]
    code: 201
    input: [order_id, "phyto_certificate_id?", lines]
    output: Shipment
    side_effects: ["status=DRAFT; ship_units=sum of requested line quantities (validated <= remaining committed)"]
  - method: GET
    path: "/nursery/shipments/{id}"
    description: "Get one shipment"
    roles: [SalesCoordinator, Broker]
    code: 200
    input: []
    output: Shipment
    side_effects: []
  - method: GET
    path: "/nursery/shipments"
    description: "List shipments (filter by order_id, status, phyto_certificate_id) — reverse-reachability for Shipment.order_id and Shipment.phyto_certificate_id"
    roles: [SalesCoordinator, Broker]
    code: 200
    input: ["order_id?", "status?", "phyto_certificate_id?", "limit?", "offset?"]
    output: Shipment[]
    side_effects: []
  - method: POST
    path: "/nursery/shipments/{id}/dispatch"
    description: "Dispatch a DRAFT shipment (DRAFT -> DISPATCHED); deduct live stock, advance order, consume phyto"
    roles: [SalesCoordinator]
    code: 200
    input: []
    output: Shipment
    side_effects:
      - "line.shipped_quantity += qty; batch.shipped_count += qty; batch.live_count -= qty (CASCADE to Batch); release zone footprint (CASCADE to Zone); zone.version increments by 1"
      - "order CONFIRMED -> FULFILLING, or -> SHIPPED when all lines fully shipped (CASCADE to Broker ledger)"
      - "If phyto attached: cert VALID -> CONSUMED (CASCADE); shipped_at=clock now"
  - method: POST
    path: "/nursery/shipments/{id}/void"
    description: "Void a DISPATCHED shipment (compensation: restore stock, ledger, cert)"
    roles: [SalesCoordinator]
    code: 200
    input: []
    output: Shipment
    side_effects:
      - "COMPENSATION: line.shipped_quantity -= qty; batch.shipped_count -= qty; batch.live_count += qty (CASCADE to Batch); restore zone footprint (CASCADE to Zone); zone.version increments by 1"
      - "order reverts from SHIPPED/FULFILLING; broker ledger restored; consumed cert VALID restored (CASCADE)"

  # ----- Ops / clock (test-driving + ops checkpoint) -------------------------
  - method: POST
    path: "/nursery/run-ops"
    description: "Run periodic ops checkpoint: expire phyto certs past valid_until; sweep auto-cull on batches at/over shrink threshold"
    roles: [GrowerManager]
    code: 200
    input: []
    output: null
    side_effects:
      - "Each VALID PhytoCertificate with clock now > valid_until -> EXPIRED"
      - "Each GROWING/GRADING/HELD batch with cull_count/started_count >= 0.50 auto-culled -> CULLED (CASCADE to Zone)"
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving: set the server logical clock. Startup default is 2026-01-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [GrowerManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601 for all subsequent recorded_at / stick_date / dispatch / expiry comparisons"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers; unknown role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Acting role not permitted for this operation, or Broker acting on an order it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing required field, bad type, enum out of set, or numeric range violation" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the current parent version (OCC)" }
  - { id: ERR_DUPLICATE_CULTIVAR, http: 409, condition: "cultivar_code already used by a non-RETIRED variety on activate" }
  - { id: ERR_VARIETY_NOT_ACTIVE, http: 409, condition: "Variety is not ACTIVE when creating/transplanting a batch against it" }
  - { id: ERR_VARIETY_IN_USE, http: 409, condition: "Retire blocked: variety still backs a non-terminal batch" }
  - { id: ERR_ZONE_NOT_OPEN, http: 409, condition: "Zone is QUARANTINED or DECOMMISSIONED when placing/transplanting a batch" }
  - { id: ERR_ZONE_NOT_EMPTY, http: 409, condition: "Decommission blocked: zone still has occupied or reserved units" }
  - { id: ERR_CLIMATE_MISMATCH, http: 409, condition: "Zone climate_class incompatible with the variety on transplant" }
  - { id: ERR_INVALID_STARTED_COUNT, http: 422, condition: "started_count not in [1, sourced_count] on transplant" }
  - { id: ERR_ZONE_CAPACITY_EXCEEDED, http: 409, condition: "Placement/transplant footprint exceeds zone free_units (FULL zone or overflow)" }
  - { id: ERR_ZONE_TIGHT_FILL_CAP, http: 409, condition: "New PLANNED reservation exceeds floor(free_units/2) while zone fill_state is TIGHT" }
  - { id: ERR_GROW_CYCLE_INCOMPLETE, http: 409, condition: "start-grading before clock now >= target_ship_date" }
  - { id: ERR_NO_GRADE_MEASUREMENT, http: 409, condition: "Grading attempted without a qualifying GRADE InputLog measurement" }
  - { id: ERR_GRADE_BELOW_SPEC, http: 409, condition: "mean_height_cm below variety ship_ready_grade_min_height_cm at finalize" }
  - { id: ERR_LIVE_PCT_BELOW_SPEC, http: 409, condition: "live_count/started_count below variety ship_ready_min_live_pct at finalize" }
  - { id: ERR_BATCH_HAS_COMMITMENTS, http: 409, condition: "Regrade/cull blocked: a COMMITTED order line draws on this batch" }
  - { id: ERR_BATCH_NOT_SALEABLE, http: 409, condition: "Publishing/dispatching requires the batch to be SALEABLE" }
  - { id: ERR_EMPTY_ORDER, http: 409, condition: "Confirm blocked: order has no lines" }
  - { id: ERR_BROKER_ON_HOLD, http: 409, condition: "Confirm blocked: broker is ON_HOLD" }
  - { id: ERR_INSUFFICIENT_AVAILABILITY, http: 409, condition: "Confirm blocked: a line quantity exceeds entry.available_quantity" }
  - { id: ERR_INSUFFICIENT_LIVE_STOCK, http: 409, condition: "Dispatch blocked: batch live_count below the dispatched quantity" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Confirm blocked: open_balance + order_total exceeds broker credit_limit" }
  - { id: ERR_ORDER_NOT_FULFILLABLE, http: 409, condition: "Dispatch blocked: order is not CONFIRMED/FULFILLING" }
  - { id: ERR_ORDER_HAS_SHIPMENT, http: 409, condition: "Cancel blocked: order already has a DISPATCHED shipment" }
  - { id: ERR_ORDER_ALREADY_CLOSED, http: 409, condition: "Void blocked: order already SHIPPED-closed beyond reversal point" }
  - { id: ERR_PHYTO_REQUIRED, http: 409, condition: "Dispatch needs a phyto cert (a line variety requires_phyto) but none attached" }
  - { id: ERR_PHYTO_INVALID, http: 409, condition: "Attached phyto cert is not VALID (already CONSUMED)" }
  - { id: ERR_PHYTO_EXPIRED, http: 409, condition: "Attached phyto cert is past valid_until / EXPIRED at dispatch" }
  - { id: ERR_PHYTO_DESTINATION_MISMATCH, http: 409, condition: "Cert destination_state != broker.ship_to_state at dispatch" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: GrowerManager
    description: "Owns the crop catalog, zones, and production governance. Creates varieties/zones, manages their lifecycles, voids planned batches, and runs the ops checkpoint."
    identity: opaque
    exclusive_operations:
      - "POST /nursery/varieties (+ /activate, /suspend, /retire)"
      - "POST /nursery/zones (+ /quarantine, /release-quarantine, /decommission)"
      - "POST /nursery/batches/{id}/void"
      - "POST /nursery/run-ops"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /nursery/batches (create PLANNED batch — shared with ProductionTech)"
      - "GET endpoints on varieties, zones, batches"

  - name: ProductionTech
    description: "Runs grow operations: creates and transplants batches, records climate/irrigation/fertilizer/scouting/grade input logs, grades and culls batches."
    identity: opaque
    exclusive_operations:
      - "POST /nursery/batches/{id}/transplant"
      - "POST /nursery/batches/{id}/start-grading"
      - "POST /nursery/batches/{id}/finalize-grade"
      - "POST /nursery/batches/{id}/cull-batch"
      - "POST /nursery/batches/{id}/input-logs"
    shared_operations:
      - "POST /nursery/batches (create PLANNED batch — shared with GrowerManager)"
      - "GET endpoints on varieties, zones, batches, input-logs"

  - name: SalesCoordinator
    description: "Owns the commercial side: brokers, availability list, broker orders/lines, phyto certificates, and shipments."
    identity: opaque
    exclusive_operations:
      - "POST /nursery/brokers (+ /hold, /reinstate)"
      - "POST /nursery/availability (+ /close)"
      - "POST /nursery/orders/{id}/confirm, /cancel"
      - "POST /nursery/phyto-certificates"
      - "POST /nursery/shipments (+ /dispatch, /void)"
    shared_operations:
      - "POST /nursery/orders, POST /nursery/orders/{id}/lines, DELETE /nursery/order-lines/{id} (shared with Broker)"
      - "GET endpoints on commercial resources"

  - name: Broker
    description: "An external re-wholesaler placing orders. Entity-backed: X-User-ID equals the Broker.id it acts as. May create and edit its own DRAFT orders/lines and read its own commercial data; cannot confirm/ship."
    identity: "entity_backed:Broker"
    exclusive_operations: []
    shared_operations:
      - "POST /nursery/orders (broker_id must equal X-User-ID), POST /nursery/orders/{id}/lines, DELETE /nursery/order-lines/{id} (own DRAFT orders only)"
      - "GET own brokers/{id}, orders, order-lines, availability, varieties, phyto-certificates, shipments"
