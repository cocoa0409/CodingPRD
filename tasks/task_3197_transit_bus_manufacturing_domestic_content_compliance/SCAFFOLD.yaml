  - method: GET
    path: "/api/contracts/{id}/bus-units"
    description: "List bus units of a contract"
    roles: [PlatformAdmin, ProcurementOfficer, ProductionPlanner, AgencyInspector, Auditor, WarrantyAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BusUnit[]
    side_effects: []

  - method: GET
    path: "/api/contracts/{id}/audit-records"
    description: "List audit records of a contract"
    roles: [PlatformAdmin, ProcurementOfficer, Auditor]
    code: 200
    input: ["audit_type?", "limit?", "offset?"]
    output: AuditRecord[]
    side_effects: []

  - method: POST
    path: "/api/option-orders/{optionOrderId}/exercise"
    description: "Exercise an AVAILABLE option order (OCC-guarded on Contract)"
    roles: [ProcurementOfficer]
    code: 200
    input: [expected_contract_version]
    output: OptionOrder
    side_effects: ["runs option_escalation -> exercised_unit_price_cents", "increments Contract.version by 1", "recomputes agency projected_zev_ratio"]

  - method: GET
    path: "/api/option-orders/{optionOrderId}"
    description: "Get an option order"
    roles: [PlatformAdmin, ProcurementOfficer, AgencyAdmin]
    code: 200
    input: []
    output: OptionOrder
    side_effects: []

  - method: POST
    path: "/api/bus-configurations"
    description: "Create a bus configuration in DRAFT"
    roles: [ConfigEngineer]
    code: 201
    input: [contract_id, propulsion_type, seating_layout, fare_equipment, accessibility_features, component_ids]
    output: BusConfiguration
    side_effects: []

  - method: GET
    path: "/api/bus-configurations/{busConfigurationId}"
    description: "Get a bus configuration"
    roles: [PlatformAdmin, ConfigEngineer, ProcurementOfficer, Auditor]
    code: 200
    input: []
    output: BusConfiguration
    side_effects: []

  - method: POST
    path: "/api/bus-configurations/{busConfigurationId}/submit-review"
    description: "Submit configuration for engineering review"
    roles: [ConfigEngineer]
    code: 200
    input: []
    output: BusConfiguration
    side_effects: []

  - method: POST
    path: "/api/bus-configurations/{busConfigurationId}/freeze"
    description: "Freeze configuration (OCC-guarded on Contract); locks seat_count"
    roles: [ConfigEngineer]
    code: 200
    input: [expected_contract_version]
    output: BusConfiguration
    side_effects: ["seat_count computed and locked", "freeze_version += 1"]

  - method: POST
    path: "/api/bus-configurations/{busConfigurationId}/return-to-draft"
    description: "Reopen configuration for revision"
    roles: [ConfigEngineer]
    code: 200
    input: []
    output: BusConfiguration
    side_effects: []

  - method: POST
    path: "/api/bus-configurations/{busConfigurationId}/obsolete"
    description: "Mark configuration obsolete"
    roles: [ConfigEngineer]
    code: 200
    input: []
    output: BusConfiguration
    side_effects: []

  - method: GET
