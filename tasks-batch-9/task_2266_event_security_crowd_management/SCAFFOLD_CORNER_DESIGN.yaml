  - name: density_reading_outside_window_returns_reading_timestamp_out_of_range
    claim_type: violation_to_error
    grounds:
    - validations[priority=34]
    - errors.ERR_READING_TIMESTAMP_OUT_OF_RANGE
    - entities.DensityReading.fields.observed_at
    distinguishing_aspect: |
      READING_WINDOW_MIN 120 is the only allowance in §1.4 applied SYMMETRICALLY around a pair of stored instants, so both edges of the closed interval have to be probed independently: one minute before doors_open_at minus 120 and one minute after event_end_at plus 120 must both fail, while the two boundary instants themselves must both be accepted.
    test_recipe:
      setup:
