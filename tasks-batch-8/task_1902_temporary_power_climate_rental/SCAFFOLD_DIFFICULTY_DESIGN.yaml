          Depth-2 chain from a different trigger (contract off-hire, not
          incident creation): contract ON_RENT->OFF_HIRE (link 1) finalizes each
          ON_RENT RentalLine with a computed final_charge_cents, and each line's
          own transition (link 2) flips its EquipmentUnit DEPLOYED->OFF_RENT.
        test_recipe:
          setup:
            - "Customer C1, Site S1 (TX-TCEQ), Unit U1 (200 kW, rates 12000/60000/200000, demob 35000), Kit K (400 A, rates 3000/15000/50000)"
            - "Contract K1 ON_RENT, window 2026-09-01..2026-09-08, lines L1 (EQUIPMENT U1) and L2 (KIT x1) both ON_RENT; clock at 2026-09-04 (day 3)"
          setup_api_calls:
