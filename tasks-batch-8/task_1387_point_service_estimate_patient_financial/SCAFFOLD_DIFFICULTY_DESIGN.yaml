# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) — patient-financial-clearance
# Test Targeting Index: 9 Difficulty Rules x 2 instances each.
# All money in integer cents. All setup chains start from empty DB.
# Verified literals (computed by executing the §1.3 formulas):
#   INS-A (ded 150000/50000, oop 600000/100000, coins 20, rate 3000000):
#     allowed 3000000, deductible 100000, coinsurance 580000,
#     resp 500000 (OOP-capped from 680000), insurance_pays 2500000,
#     required_deposit 125000
#   GFE on list 5000000 @25%: 3750000; required_deposit 937500
#   MPR bundle [27447+29881]: 3500000 ; NONE: 4000000
#   Plan 100001/3: [33333, 33333, 33335]
#   High-dollar: 2000000@50% -> 1000000 (ON) ; 1999998@50% -> 999999 (OFF)
#   Variance baselines INS-V: first 680000, accepted 640000, actual 700000
#     -> 20000 vs 60000 (9.38%)
#   GFE dispute: delta 40000 -> eligible ; 39999 -> not
#   Refund windows vs service 2026-08-20 (Thu): refund 2026-08-18 -> 2 BD ->
#     100%; 2026-08-19 -> 1 BD -> 50%; 2026-08-20 -> 0
#   GFE deadline: created Mon 2026-08-03, service 2026-08-20 -> 13 BD ->
#     deadline 2026-08-06T23:59:59.999Z
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: insured_contract_vs_uninsured_gfe_same_lines
        grounds:
          - calculations.estimate_patient_responsibility
          - entities.Estimate.fields.pricing_mode
        distinguishing_aspect: |
          One calculation, two variant algorithms on the SAME line items:
          insured_contract (contracted rate + deductible/coinsurance/OOP math)
          yields 500000 cents while uninsured_good_faith (charge-master list
          minus per-line 25% discount) yields 3750000 cents. This instance's
          entity domain is Estimate pricing; the sibling instance's domain is
          VarianceRecord baselines.
        test_recipe:
          setup:
            - "Charge master: CPT 27447 list 5000000, requires_auth_prior true"
            - "Contract ACME (MPR 50%) with rate 27447 = 3000000 effective 2026-01-01 open-ended"
            - "Patient I with ACTIVE snapshot (ded 150000/50000, oop 600000/100000, coins 20) and case I (service 2026-08-20) holding a DRAFT INSURED estimate [27447 x1]"
            - "Patient U with case U (service 2026-08-20) holding a DRAFT UNINSURED_GFE estimate [27447 x1]"
            - "Clock at 2026-08-03T09:00:00Z"
          setup_api_calls:
            - call: "POST /clearance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /clearance/charge-items"
              payload: { cpt_code: "27447", description: "Total knee arthroplasty", list_price_cents: 5000000, requires_auth_prior: true }
              as: SystemAdmin
            - call: "POST /clearance/payer-contracts"
              payload: { payer_code: "ACME", payer_name: "Acme Health", bundling_rule: "MULTIPLE_PROCEDURE_REDUCTION", reduction_pct: 50 }
              as: SystemAdmin
              captures: { pc_id: $.data.id }
            - call: "POST /clearance/payer-contracts/${pc_id}/rates"
              payload: { cpt_code: "27447", rate_cents: 3000000, effective_from: "2026-01-01" }
              as: SystemAdmin
            - call: "POST /clearance/patients"
              payload: { mrn: "MRN-I-1", full_name: "Pat Insured", date_of_birth: "1970-01-01" }
              as: Registrar
              captures: { pat_i_id: $.data.id, pat_i_v: $.data.version }
            - call: "POST /clearance/patients/${pat_i_id}/eligibility-snapshots"
              payload: { expected_patient_version: "${pat_i_v}", payer_code: "ACME", member_id: "M-1", deductible_total_cents: 150000, deductible_met_cents: 50000, oop_max_cents: 600000, oop_met_cents: 100000, coinsurance_pct: 20 }
              as: Registrar
              captures: { snap_i_id: $.data.id }
            - call: "POST /clearance/patients/${pat_i_id}/cases"
              payload: { service_date: "2026-08-20", service_description: "Knee replacement" }
              as: Registrar
              captures: { case_i_id: $.data.id, case_i_v: $.data.version }
            - call: "POST /clearance/cases/${case_i_id}/estimates"
              payload: { expected_case_version: "${case_i_v}", pricing_mode: "INSURED", eligibility_snapshot_id: "${snap_i_id}", lines: [{ cpt_code: "27447", quantity: 1 }] }
              as: FinancialCounselor
              captures: { est_i_id: $.data.id }
            - call: "POST /clearance/patients"
              payload: { mrn: "MRN-U-1", full_name: "Pat Uninsured", date_of_birth: "1980-02-02" }
              as: Registrar
              captures: { pat_u_id: $.data.id }
            - call: "POST /clearance/patients/${pat_u_id}/cases"
              payload: { service_date: "2026-08-20", service_description: "Knee replacement" }
              as: Registrar
              captures: { case_u_id: $.data.id, case_u_v: $.data.version }
            - call: "POST /clearance/cases/${case_u_id}/estimates"
              payload: { expected_case_version: "${case_u_v}", pricing_mode: "UNINSURED_GFE", lines: [{ cpt_code: "27447", quantity: 1 }] }
              as: FinancialCounselor
              captures: { est_u_id: $.data.id }
          trigger:
            - call: "POST /clearance/estimates/${est_i_id}/price"
              payload: {}
              as: FinancialCounselor
              captures: { resp_i: $.data.patient_responsibility_cents, allowed_i: $.data.allowed_amount_cents }
            - call: "POST /clearance/estimates/${est_u_id}/price"
              payload: {}
              as: FinancialCounselor
              captures: { resp_u: $.data.patient_responsibility_cents, gfe_u: $.data.gfe_total_cents }
          assert:
            - "Estimate.${est_i_id}.patient_responsibility_cents == 500000 (insured variant: 3000000 allowed, 100000 to deductible, 580000 coinsurance, OOP-capped at 500000)"
            - "Estimate.${est_i_id}.allowed_amount_cents == 3000000"
            - "Estimate.${est_u_id}.patient_responsibility_cents == 3750000 (GFE variant: 5000000 list minus 1250000 discount)"
            - "Estimate.${est_u_id}.gfe_total_cents == 3750000 and Estimate.${est_u_id}.allowed_amount_cents == 5000000"
            - "${resp_i} != ${resp_u} — identical lines, two valid pricing algorithms, different patient responsibility"

      - name: variance_first_presented_vs_last_accepted_baseline
        grounds:
          - calculations.estimate_variance
          - entities.VarianceRecord.fields.variance_vs_first_cents
          - entities.VarianceRecord.fields.variance_vs_accepted_cents
        distinguishing_aspect: |
          One finalize produces two variance numbers from two valid baselines on
          the VarianceRecord domain: 20000 cents vs the first-presented baseline
          (680000) and 60000 cents vs the last-accepted baseline (640000) for the
          same actual_billed_cents 700000. Entity domain differs from the sibling
          instance (Estimate pricing).
        test_recipe:
          setup:
            - "Charge 27447 list 5000000; contract ACME (MPR 50) rate 3000000 from 2026-01-01"
            - "Patient V; snapshot S1 (ded 150000/50000, oop 700000/0, coins 20); case service 2026-08-20"
            - "Estimate E1 on S1 priced (resp 680000) and PRESENTED (first-presented baseline pinned at 680000)"
            - "Snapshot S2 (ded_met raised to 100000) supersedes S1; estimate E2 on S2 supersedes E1; E2 priced (resp 640000), PRESENTED, ACCEPTED"
            - "Clock at 2026-08-03T09:00:00Z"
          setup_api_calls:
            - call: "POST /clearance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /clearance/charge-items"
              payload: { cpt_code: "27447", description: "Total knee arthroplasty", list_price_cents: 5000000, requires_auth_prior: true }
              as: SystemAdmin
            - call: "POST /clearance/payer-contracts"
              payload: { payer_code: "ACME", payer_name: "Acme Health", bundling_rule: "MULTIPLE_PROCEDURE_REDUCTION", reduction_pct: 50 }
              as: SystemAdmin
              captures: { pc_id: $.data.id }
            - call: "POST /clearance/payer-contracts/${pc_id}/rates"
              payload: { cpt_code: "27447", rate_cents: 3000000, effective_from: "2026-01-01" }
              as: SystemAdmin
            - call: "POST /clearance/patients"
              payload: { mrn: "MRN-V-1", full_name: "Pat Variance", date_of_birth: "1965-03-03" }
              as: Registrar
              captures: { pat_id: $.data.id, pat_v1: $.data.version }
            - call: "POST /clearance/patients/${pat_id}/eligibility-snapshots"
              payload: { expected_patient_version: "${pat_v1}", payer_code: "ACME", member_id: "M-9", deductible_total_cents: 150000, deductible_met_cents: 50000, oop_max_cents: 700000, oop_met_cents: 0, coinsurance_pct: 20 }
              as: Registrar
              captures: { snap1_id: $.data.id }
            - call: "POST /clearance/patients/${pat_id}/cases"
              payload: { service_date: "2026-08-20", service_description: "Knee replacement" }
              as: Registrar
              captures: { case_id: $.data.id, case_v1: $.data.version }
            - call: "POST /clearance/cases/${case_id}/estimates"
              payload: { expected_case_version: "${case_v1}", pricing_mode: "INSURED", eligibility_snapshot_id: "${snap1_id}", lines: [{ cpt_code: "27447", quantity: 1 }] }
              as: FinancialCounselor
              captures: { est1_id: $.data.id }
            - call: "POST /clearance/estimates/${est1_id}/price"
              payload: {}
              as: FinancialCounselor
            - call: "POST /clearance/estimates/${est1_id}/present"
              payload: {}
              as: FinancialCounselor
            - call: "GET /clearance/patients/${pat_id}"
              as: Registrar
              captures: { pat_v2: $.data.version }
            - call: "POST /clearance/patients/${pat_id}/eligibility-snapshots"
              payload: { expected_patient_version: "${pat_v2}", payer_code: "ACME", member_id: "M-9", deductible_total_cents: 150000, deductible_met_cents: 100000, oop_max_cents: 700000, oop_met_cents: 0, coinsurance_pct: 20 }
              as: Registrar
              captures: { snap2_id: $.data.id }
            - call: "GET /clearance/cases/${case_id}"
              as: FinancialCounselor
              captures: { case_v2: $.data.version }
            - call: "POST /clearance/cases/${case_id}/estimates"
              payload: { expected_case_version: "${case_v2}", pricing_mode: "INSURED", eligibility_snapshot_id: "${snap2_id}", lines: [{ cpt_code: "27447", quantity: 1 }] }
              as: FinancialCounselor
              captures: { est2_id: $.data.id }
            - call: "POST /clearance/estimates/${est2_id}/price"
              payload: {}
              as: FinancialCounselor
            - call: "POST /clearance/estimates/${est2_id}/present"
              payload: {}
              as: FinancialCounselor
            - call: "POST /clearance/estimates/${est2_id}/accept"
              payload: {}
              as: FinancialCounselor
          trigger:
            - call: "POST /clearance/estimates/${est2_id}/finalize"
              payload: { actual_billed_cents: 700000 }
              as: FinancialCounselor
            - call: "GET /clearance/estimates/${est2_id}/variance-records"
              as: ClearanceSupervisor
              captures: { vr_first: "$.data[0].variance_vs_first_cents", vr_acc: "$.data[0].variance_vs_accepted_cents", vr_pct: "$.data[0].variance_pct", vr_class: "$.data[0].classification" }
          assert:
            - "Estimate.${est1_id}.status == SUPERSEDED after E2 creation"
            - "VarianceRecord.variance_vs_first_cents == 20000 (700000 - 680000 first-presented baseline)"
            - "VarianceRecord.variance_vs_accepted_cents == 60000 (700000 - 640000 accepted baseline)"
            - "VarianceRecord.variance_pct == 9.38 (60000/640000, round_half_up 2dp)"
            - "VarianceRecord.classification == WITHIN_TOLERANCE (9.38 <= 10.00)"
            - "${vr_first} != ${vr_acc} — same finalize, two valid baselines, different variance"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: insured_responsibility_nested_min_max_oop_cap
        grounds:
          - calculations.estimate_patient_responsibility
          - entities.EligibilitySnapshot.fields.oop_max_cents
        distinguishing_aspect: |
          Mode (a): five inputs (allowed, deductible_total, deductible_met,
          coinsurance_pct, oop window) interact through nested min/max with a
          conditional OOP-cap branch — here the cap branch fires: raw
          100000+580000=680000 is capped to the 500000 OOP remainder. The
          sibling instance exercises mode (b) rounding-order on PaymentPlan.
        test_recipe:
          setup:
            - "Charge 27447 list 5000000; contract ACME (MPR 50) rate 3000000 from 2026-01-01"
            - "Patient with snapshot (ded 150000/50000, oop 600000/100000, coins 20); case service 2026-08-20; DRAFT INSURED estimate [27447 x1]"
          setup_api_calls:
            - call: "POST /clearance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /clearance/charge-items"
              payload: { cpt_code: "27447", description: "Total knee arthroplasty", list_price_cents: 5000000, requires_auth_prior: true }
              as: SystemAdmin
            - call: "POST /clearance/payer-contracts"
              payload: { payer_code: "ACME", payer_name: "Acme Health", bundling_rule: "MULTIPLE_PROCEDURE_REDUCTION", reduction_pct: 50 }
              as: SystemAdmin
              captures: { pc_id: $.data.id }
            - call: "POST /clearance/payer-contracts/${pc_id}/rates"
              payload: { cpt_code: "27447", rate_cents: 3000000, effective_from: "2026-01-01" }
              as: SystemAdmin
            - call: "POST /clearance/patients"
              payload: { mrn: "MRN-C-1", full_name: "Pat Combo", date_of_birth: "1971-04-04" }
              as: Registrar
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /clearance/patients/${pat_id}/eligibility-snapshots"
              payload: { expected_patient_version: "${pat_v}", payer_code: "ACME", member_id: "M-C", deductible_total_cents: 150000, deductible_met_cents: 50000, oop_max_cents: 600000, oop_met_cents: 100000, coinsurance_pct: 20 }
              as: Registrar
              captures: { snap_id: $.data.id }
            - call: "POST /clearance/patients/${pat_id}/cases"
              payload: { service_date: "2026-08-20", service_description: "Knee replacement" }
              as: Registrar
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /clearance/cases/${case_id}/estimates"
              payload: { expected_case_version: "${case_v}", pricing_mode: "INSURED", eligibility_snapshot_id: "${snap_id}", lines: [{ cpt_code: "27447", quantity: 1 }] }
              as: FinancialCounselor
              captures: { est_id: $.data.id }
          trigger:
            - call: "POST /clearance/estimates/${est_id}/price"
              payload: {}
              as: FinancialCounselor
              captures: { resp: $.data.patient_responsibility_cents }
          assert:
            - "Estimate.${est_id}.allowed_amount_cents == 3000000"
            - "Estimate.${est_id}.deductible_applied_cents == 100000 (min(3000000, 150000-50000))"
            - "Estimate.${est_id}.coinsurance_cents == 580000 (20% of 2900000)"
            - "Estimate.${est_id}.patient_responsibility_cents == 500000 (min(680000, oop_remaining 500000) — cap branch)"
            - "Estimate.${est_id}.insurance_pays_cents == 2500000"

      - name: installment_schedule_floor_last_remainder
        grounds:
          - calculations.installment_schedule
          - entities.PaymentPlan.fields.installments
        distinguishing_aspect: |
          Mode (b): rounding order is pinned — floor division then remainder on
          the LAST installment. principal 100001 over 3 installments yields
          [33333, 33333, 33335]; the naive round-each-installment order yields
          33334 x3 = 100002 which overshoots principal. Different combinatorial
          mode than the sibling's nested-min/max mode (a).
        test_recipe:
          setup:
            - "Patient with an OPEN case (service 2026-08-20); no estimate needed for a DRAFT plan"
          setup_api_calls:
            - call: "POST /clearance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /clearance/patients"
              payload: { mrn: "MRN-P-1", full_name: "Pat Plan", date_of_birth: "1972-05-05" }
              as: Registrar
              captures: { pat_id: $.data.id }
            - call: "POST /clearance/patients/${pat_id}/cases"
              payload: { service_date: "2026-08-20", service_description: "Arthroscopy" }
              as: Registrar
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /clearance/cases/${case_id}/payment-plans"
              payload: { principal_cents: 100001, num_installments: 3 }
              as: FinancialCounselor
              captures: { plan_id: $.data.id, inst_amt: $.data.installment_amount_cents, sched: $.data.installments }
          assert:
            - "PaymentPlan.${plan_id}.installment_amount_cents == 33333 (floor(100001/3))"
            - "PaymentPlan.${plan_id}.installments amounts == [33333, 33333, 33335] (remainder 33335 on LAST installment)"
            - "sum(PaymentPlan.${plan_id}.installments.amount_cents) == 100001 == principal_cents"
            - "PaymentPlan.${plan_id}.principal_outstanding_cents == 100001"
            - "PaymentPlan.${plan_id}.status == DRAFT (amounts fixed at create, due dates only at activate)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: estimate_presented_fork_divergent_side_effects
        grounds:
          - state_machines.Estimate.PRESENTED_to_ACCEPTED
          - state_machines.Estimate.PRESENTED_to_SUPERSEDED
        distinguishing_aspect: |
          Estimate's machine is a branching fork at PRESENTED with divergent
          side-effect sets: the ACCEPTED branch mutates the case (deposit
          requirement 125000, OPEN->IN_REVIEW) while the SUPERSEDED branch
          leaves the case untouched (required_deposit stays 0, status stays
          OPEN). The sibling instance's non-linear machine lives on PaymentPlan
          (a true cycle), a different entity.
        test_recipe:
          setup:
            - "Charge 27447; contract ACME (MPR 50) rate 3000000; patient P with snapshot (ded 150000/50000, oop 600000/100000, coins 20)"
            - "Case A with estimate EA priced (resp 500000) and PRESENTED"
            - "Case B with estimate EB priced (resp 500000) and PRESENTED"
            - "Clock at 2026-08-03T09:00:00Z"
          setup_api_calls:
            - call: "POST /clearance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /clearance/charge-items"
              payload: { cpt_code: "27447", description: "Total knee arthroplasty", list_price_cents: 5000000, requires_auth_prior: false }
              as: SystemAdmin
            - call: "POST /clearance/payer-contracts"
              payload: { payer_code: "ACME", payer_name: "Acme Health", bundling_rule: "MULTIPLE_PROCEDURE_REDUCTION", reduction_pct: 50 }
              as: SystemAdmin
              captures: { pc_id: $.data.id }
            - call: "POST /clearance/payer-contracts/${pc_id}/rates"
              payload: { cpt_code: "27447", rate_cents: 3000000, effective_from: "2026-01-01" }
              as: SystemAdmin
            - call: "POST /clearance/patients"
              payload: { mrn: "MRN-F-1", full_name: "Pat Fork", date_of_birth: "1973-06-06" }
              as: Registrar
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /clearance/patients/${pat_id}/eligibility-snapshots"
              payload: { expected_patient_version: "${pat_v}", payer_code: "ACME", member_id: "M-F", deductible_total_cents: 150000, deductible_met_cents: 50000, oop_max_cents: 600000, oop_met_cents: 100000, coinsurance_pct: 20 }
              as: Registrar
              captures: { snap_id: $.data.id }
            - call: "POST /clearance/patients/${pat_id}/cases"
              payload: { service_date: "2026-08-20", service_description: "Knee A" }
              as: Registrar
              captures: { case_a: $.data.id, case_a_v: $.data.version }
            - call: "POST /clearance/cases/${case_a}/estimates"
              payload: { expected_case_version: "${case_a_v}", pricing_mode: "INSURED", eligibility_snapshot_id: "${snap_id}", lines: [{ cpt_code: "27447", quantity: 1 }] }
              as: FinancialCounselor
              captures: { est_a: $.data.id }
            - call: "POST /clearance/estimates/${est_a}/price"
              payload: {}
              as: FinancialCounselor
            - call: "POST /clearance/estimates/${est_a}/present"
              payload: {}
              as: FinancialCounselor
            - call: "POST /clearance/patients/${pat_id}/cases"
              payload: { service_date: "2026-08-21", service_description: "Knee B" }
              as: Registrar
              captures: { case_b: $.data.id, case_b_v: $.data.version }
            - call: "POST /clearance/cases/${case_b}/estimates"
              payload: { expected_case_version: "${case_b_v}", pricing_mode: "INSURED", eligibility_snapshot_id: "${snap_id}", lines: [{ cpt_code: "27447", quantity: 1 }] }
              as: FinancialCounselor
              captures: { est_b: $.data.id }
            - call: "POST /clearance/estimates/${est_b}/price"
              payload: {}
              as: FinancialCounselor
            - call: "POST /clearance/estimates/${est_b}/present"
              payload: {}
              as: FinancialCounselor
            - call: "GET /clearance/cases/${case_b}"
              as: FinancialCounselor
              captures: { case_b_v2: $.data.version }
          trigger:
            - call: "POST /clearance/estimates/${est_a}/accept"
              payload: {}
              as: FinancialCounselor
            - call: "POST /clearance/cases/${case_b}/estimates"
              payload: { expected_case_version: "${case_b_v2}", pricing_mode: "INSURED", eligibility_snapshot_id: "${snap_id}", lines: [{ cpt_code: "27447", quantity: 1 }] }
              as: FinancialCounselor
              captures: { est_b2: $.data.id }
            - call: "GET /clearance/cases/${case_a}"
              as: FinancialCounselor
              captures: { case_a_dep: $.data.required_deposit_cents, case_a_status: $.data.status }
            - call: "GET /clearance/cases/${case_b}"
              as: FinancialCounselor
              captures: { case_b_dep: $.data.required_deposit_cents, case_b_status: $.data.status }
          assert:
            - "Case A required_deposit_cents == 125000 and status == IN_REVIEW (ACCEPTED branch side effects fired)"
            - "Case B required_deposit_cents == 0 and status == OPEN (SUPERSEDED branch carried no case-level financial side effects)"
            - "Estimate.${est_b}.status == SUPERSEDED and Estimate.${est_b2}.status == DRAFT"
            - "Case B active_estimate_id == ${est_b2}"

      - name: payment_plan_default_reinstate_cycle
        grounds:
          - state_machines.PaymentPlan.ACTIVE_to_DEFAULTED
          - state_machines.PaymentPlan.DEFAULTED_to_ACTIVE
        distinguishing_aspect: |
          PaymentPlan's machine is a true cycle (ACTIVE -> DEFAULTED -> ACTIVE)
          driven by the clock sweep and a cure payment, terminating in COMPLETED.
          The sibling instance is a branching fork on Estimate — different
          entity, different non-linear shape.
        test_recipe:
          setup:
            - "Charge 27447; contract ACME (MPR 50) rate 3000000; patient with snapshot (ded 150000/50000, oop 600000/100000, coins 20); case service 2026-08-20"
            - "Estimate priced/presented/ACCEPTED (resp 500000)"
            - "Plan principal 100001 over 3 installments, ACTIVATED at 2026-08-03 (due dates 2026-09-02, 2026-10-02, 2026-11-02)"
          setup_api_calls:
            - call: "POST /clearance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /clearance/charge-items"
              payload: { cpt_code: "27447", description: "Total knee arthroplasty", list_price_cents: 5000000, requires_auth_prior: false }
              as: SystemAdmin
            - call: "POST /clearance/payer-contracts"
