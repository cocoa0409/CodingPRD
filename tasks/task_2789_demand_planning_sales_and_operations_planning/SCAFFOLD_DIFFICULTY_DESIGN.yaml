# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Nine §0.5 rule_ids x 2 instances = 18 instances. Every `grounds:` ref resolves into
# SCAFFOLD.yaml §1.1-§1.6; every `setup_api_calls` chain is executable from an empty DB
# using only endpoints declared in §1.5; every numeric literal in `assert:` is pre-computed
# from the §1.3 formulas (Decimal, ROUND_HALF_UP).
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: accuracy_mape_vs_wmape_diverge_on_same_records
        grounds:
          - calculations.calc_accuracy_rollup
          - calculations.calc_accuracy_record
          - entities.ProductFamily.fields.rolling_wmape_pct
          - entities.ProductFamily.fields.accuracy_grade
          - entities.AccuracyRecord.fields.ape_pct
        distinguishing_aspect: |
          The two variants differ in WEIGHTING and in ROUNDING ORDER, not merely in inputs:
          unweighted MAPE averages the per-record ape_pct values that were ALREADY rounded to
          2dp by calc_accuracy_record (round-then-average), while volume-weighted WMAPE divides
          the raw unrounded sum of abs_error_units by the raw sum of actual_units
          (aggregate-then-round). On the same two records they return 17.00 and 4.51, and only
          WMAPE feeds accuracy_grade, so the grade is A where the MAPE variant would say B.
        test_recipe:
          setup:
            - "One ProductFamily and one MATURE Item in it; two Customers."
            - "One PlanningCycle over the single month 2026-09 with financial_commitment_cents = 0, driven all the way to PUBLISHED so accuracy records may be posted."
            - "Two CONSENSUS_LOCKED forecast lines on that item: customer A consensus_units = 130, customer B consensus_units = 5200."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-SNACK", name: "Salty Snacks", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-CHIP-1", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, service_level_target_pct: 95.0, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-A", name: "Alpha Grocery", channel: "GROCERY", priority_rank: 1 }
              as: SopAdmin
              captures: { cust_a_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-B", name: "Beta Club", channel: "CLUB", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_b_id: $.data.id }
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "SOP-2026-09", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_a_id}", month: "2026-09", level_units: 130, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_a_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_b_id}", month: "2026-09", level_units: 5200, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_b_id: $.data.id }
            - call: "POST /sop/demand-forecasts/${fc_a_id}/transitions"
              payload: { target_status: "UNDER_CONSENSUS" }
              as: DemandPlanner
              as_user_id: "planner-1"
            - call: "POST /sop/demand-forecasts/${fc_a_id}/transitions"
              payload: { target_status: "CONSENSUS_LOCKED" }
              as: DemandReviewLead
              as_user_id: "lead-1"
            - call: "POST /sop/demand-forecasts/${fc_b_id}/transitions"
              payload: { target_status: "UNDER_CONSENSUS" }
              as: DemandPlanner
              as_user_id: "planner-1"
            - call: "POST /sop/demand-forecasts/${fc_b_id}/transitions"
              payload: { target_status: "CONSENSUS_LOCKED" }
              as: DemandReviewLead
              as_user_id: "lead-1"
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SCENARIO_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "EXECUTIVE_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "PUBLISHED" }
              as: ExecutiveSponsor
              as_user_id: "exec-1"
          trigger:
            - call: "POST /sop/accuracy-records"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_a_id}", actual_units: 100 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { rec_a_id: $.data.id }
            - call: "POST /sop/accuracy-records"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_b_id}", actual_units: 5000 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { rec_b_id: $.data.id }
            - call: "GET /sop/planning-cycles/${cycle_id}/accuracy-summary"
              payload: {}
              as: ExecutiveSponsor
              as_user_id: "exec-1"
              captures: { sum_mape: $.data.mape_pct, sum_wmape: $.data.wmape_pct, sum_grade: $.data.accuracy_grade }
          assert:
            - "AccuracyRecord.${rec_a_id}.forecast_units_snapshot == 130 and signed_error_units == 30 and abs_error_units == 30 and ape_pct == 30.00"
            - "AccuracyRecord.${rec_b_id}.forecast_units_snapshot == 5200 and signed_error_units == 200 and abs_error_units == 200 and ape_pct == 4.00"
            - "accuracy-summary record_count == 2, total_actual_units == 5100, total_abs_error_units == 230"
            - "${sum_mape} == 17.00 — unweighted variant: (30.00 + 4.00) / 2, averaging the already-rounded per-record ape_pct values"
            - "${sum_wmape} == 4.51 — weighted variant: 230 / 5100 * 100 = 4.5098... rounded half-up to 2dp"
            - "${sum_grade} == \"A\" because the grade tier reads WMAPE (4.51 <= 10.00); the unweighted variant's 17.00 would have produced \"B\", so the two variants disagree on the accountability outcome for identical records"
            - "accuracy-summary bias_pct == 4.51 and bias_flag == \"NONE\" (4.51 < BIAS_THRESHOLD_PCT 5.00)"
            - "ProductFamily.${fam_id}.rolling_wmape_pct == 4.51 and rolling_bias_pct == 4.51 and bias_flag == \"NONE\" and accuracy_grade == \"A\" and scored_record_count == 2"

      - name: supply_constraint_net_inventory_first_vs_gross_capacity_first
        grounds:
          - calculations.calc_constrained_supply
          - calculations.calc_inventory_policy
          - entities.PlanningCycle.fields.supply_review_policy
          - entities.SupplyPlan.fields.constraint_type
          - entities.SupplyPlan.fields.constrained_units
        distinguishing_aspect: |
          The two variants differ in the ORDER of the netting and the capping operations, not in
          their inputs: NET_INVENTORY_FIRST subtracts on_hand_units BEFORE taking
          min(demand, capacity, material), GROSS_CAPACITY_FIRST subtracts it AFTER. Fed identical
          demand (1000), inventory target (330), on-hand (500), capacity (900 units) and material
          cap (100000), they return constrained_units 830 vs 400 and, more sharply, different
          binding constraints — INVENTORY_TARGET vs CAPACITY — because demand_side_units itself
          means the NET requirement in one variant and the GROSS requirement in the other.
        test_recipe:
          setup:
            - "One ProductFamily at 100 units/hour with a single 9-hour CapacityBlock fully inside the 2026-09 horizon window, i.e. 900 available units."
            - "One MATURE Item with on_hand_units = 500, avg_monthly_demand_units = 1000, demand_cv = 0.20, service_level_target_pct = 95.0, lead_time_days = 30 (so safety_stock_units = 330) and material_supply_cap_units = 100000."
            - "Two PlanningCycles over the identical horizon 2026-09..2026-09, one with supply_review_policy NET_INVENTORY_FIRST and one with GROSS_CAPACITY_FIRST, each holding one CONSENSUS_LOCKED forecast line of 1000 units for the same item and customer, and each advanced to SUPPLY_REVIEW."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BEV", name: "Beverages", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-COLA-1", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 500, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, service_level_target_pct: 95.0, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-A", name: "Alpha Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/capacity-blocks"
              payload: { family_id: "${fam_id}", start_date: "2026-09-01", end_date: "2026-09-30", available_hours: 9 }
              as: SupplyPlanner
              as_user_id: "supply-1"
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "SOP-NET-09", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cyc_net_id: $.data.id }
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "SOP-GROSS-09", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "GROSS_CAPACITY_FIRST" }
              as: SopAdmin
              captures: { cyc_gross_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cyc_net_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_net_id: $.data.id }
            - call: "POST /sop/demand-forecasts/${fc_net_id}/transitions"
              payload: { target_status: "UNDER_CONSENSUS" }
              as: DemandPlanner
              as_user_id: "planner-1"
            - call: "POST /sop/demand-forecasts/${fc_net_id}/transitions"
              payload: { target_status: "CONSENSUS_LOCKED" }
              as: DemandReviewLead
              as_user_id: "lead-1"
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cyc_gross_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_gross_id: $.data.id }
            - call: "POST /sop/demand-forecasts/${fc_gross_id}/transitions"
              payload: { target_status: "UNDER_CONSENSUS" }
              as: DemandPlanner
              as_user_id: "planner-1"
            - call: "POST /sop/demand-forecasts/${fc_gross_id}/transitions"
              payload: { target_status: "CONSENSUS_LOCKED" }
              as: DemandReviewLead
              as_user_id: "lead-1"
            - call: "POST /sop/planning-cycles/${cyc_net_id}/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cyc_gross_id}/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
              as: SopAdmin
          trigger:
            - call: "POST /sop/supply-plans"
              payload: { cycle_id: "${cyc_net_id}", item_id: "${item_id}" }
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { plan_net_id: $.data.id }
            - call: "POST /sop/supply-plans"
              payload: { cycle_id: "${cyc_gross_id}", item_id: "${item_id}" }
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { plan_gross_id: $.data.id }
          assert:
            - "Item.${item_id}.safety_stock_units == 330 and reorder_point_units == 1330"
            - "Both plans agree on the raw inputs: gross_requirement_units == 1000, target_build_units == 330, available_units == 900, material_cap_units == 100000"
            - "SupplyPlan.${plan_net_id}.demand_side_units == 830 (NET: 1000 + 330 - 500) and constrained_units == 830 and shortfall_units == 0 and unallocated_units == 830"
            - "SupplyPlan.${plan_net_id}.constraint_type == \"INVENTORY_TARGET\" because capacity never binds (900 >= 830) yet 830 < gross_requirement_units 1000"
            - "SupplyPlan.${plan_gross_id}.demand_side_units == 1330 (GROSS: 1000 + 330) and constrained_units == 400 (min(1330,900,100000) = 900, then 900 - 500) and shortfall_units == 930 and unallocated_units == 400"
            - "SupplyPlan.${plan_gross_id}.constraint_type == \"CAPACITY\" because 900 < 1330 — the same on-hand position flips the binding constraint between variants"
            - "PlanningCycle.${cyc_net_id}.plan_value_cents == 830000 while PlanningCycle.${cyc_gross_id}.plan_value_cents == 400000, both cycles carrying constrained_plan_count == 1 and posture == \"AT_RISK\""

  - rule_id: combinatorial_formula
    instances:
      - name: consensus_units_per_adjustment_rounding_then_sum
        grounds:
          - calculations.calc_consensus_units
          - calculations.calc_statistical_baseline
          - entities.ConsensusAdjustment.fields.applied_delta_units
          - entities.DemandForecast.fields.consensus_units
          - state_machines.ConsensusAdjustment.PROPOSED_to_ENDORSED
        distinguishing_aspect: |
          Mode (a) rounding order: a PROMOTION adjustment's lift term and cannibalization term are
          each rounded half-up to integer units BEFORE being subtracted, then the already-integer
          per-adjustment deltas are summed into the forecast. On baseline 333 with lift 11% and
          cannibalization 4% this yields 37 - 13 = 24, whereas the forbidden alternative
          (rounding the net 7% in one pass, round_half_up(333 * 7 / 100) = 23) is off by one unit
          and propagates into consensus_units. Neither operand order nor a different formula
          selection is at stake here — only where the rounding boundary sits.
        test_recipe:
          setup:
            - "One ProductFamily, one MATURE Item, one Customer, one PlanningCycle in DEMAND_REVIEW over 2026-09..2026-09."
            - "One APPROVED Promotion for that (item, customer) covering 2026-09 with lift_pct = 11 and cannibalization_pct = 4."
            - "One DemandForecast for (cycle, item, customer, 2026-09) whose baseline_units == 333 and which is still in BASELINE."
            - "Logical clock left at its 2026-08-01T00:00:00Z default, so the 2026-09 promotion window is still ahead of the frozen horizon."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-CANDY", name: "Confections", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BAR-1", family_id: "${fam_id}", unit_price_cents: 500, unit_cost_cents: 200, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, service_level_target_pct: 95.0, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-A", name: "Alpha Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/promotions"
              payload: { item_id: "${item_id}", customer_id: "${cust_id}", start_month: "2026-09", end_month: "2026-09", lift_pct: 11, cannibalization_pct: 4 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { promo_id: $.data.id }
            - call: "POST /sop/promotions/${promo_id}/approve"
              payload: {}
              as: DemandReviewLead
              as_user_id: "lead-1"
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "SOP-COMB-09", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 333, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_id: $.data.id, fc_v1: $.data.version }
          trigger:
            - call: "POST /sop/consensus-adjustments"
              payload: { demand_forecast_id: "${fc_id}", adjustment_type: "PROMOTION", delta_units: 0, rationale: "Q3 feature display", promotion_id: "${promo_id}", expected_demand_forecast_version: "${fc_v1}" }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { adj_promo_id: $.data.id }
            - call: "POST /sop/consensus-adjustments/${adj_promo_id}/reviews"
              payload: { decision: "ENDORSE", review_note: "agreed" }
              as: DemandReviewLead
              as_user_id: "lead-1"
            - call: "GET /sop/demand-forecasts/${fc_id}"
              payload: {}
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_v2: $.data.version }
            - call: "POST /sop/consensus-adjustments"
              payload: { demand_forecast_id: "${fc_id}", adjustment_type: "SALES_INTELLIGENCE", delta_units: 10, rationale: "new door count from field sales", expected_demand_forecast_version: "${fc_v2}" }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { adj_si_id: $.data.id }
            - call: "POST /sop/consensus-adjustments/${adj_si_id}/reviews"
              payload: { decision: "ENDORSE" }
              as: DemandReviewLead
              as_user_id: "lead-1"
          assert:
            - "DemandForecast.${fc_id}.baseline_units == 333 and method == \"HOLT_WINTERS\""
            - "ConsensusAdjustment.${adj_promo_id}.applied_delta_units == 24 — round_half_up(333 * 11 / 100) = 37 minus round_half_up(333 * 4 / 100) = 13; the single-pass alternative 23 is wrong"
            - "ConsensusAdjustment.${adj_promo_id}.status == \"ENDORSED\" and the supplied delta_units of 0 is ignored for PROMOTION-type adjustments"
            - "ConsensusAdjustment.${adj_si_id}.applied_delta_units == 10 — SALES_INTELLIGENCE deltas are used verbatim with no rounding"
            - "DemandForecast.${fc_id}.consensus_units == 367 (333 + 24 + 10) and endorsed_adjustment_count == 2 and status == \"UNDER_CONSENSUS\""
            - "Both adjustments cleared the MAX_SWING_PCT guardrail whose limit here is round_half_up(333 * 25 / 100) = 83 units"

      - name: scenario_trade_rate_tier_pinned_to_pre_trade_closure
        grounds:
          - calculations.calc_scenario_gap_closure
          - calculations.calc_cycle_financials
          - entities.Scenario.fields.trade_rate_pct
          - entities.Scenario.fields.pre_trade_closure_cents
          - state_machines.Scenario.DRAFT_to_EVALUATED
        distinguishing_aspect: |
          Mode (b) input selection: the trade-rate tier is selected from pre_trade_closure_cents
          (gross uplift MINUS investment cost) while the trade spend it drives is a percentage of
          gross_uplift_cents. With gross 5_200_000 and investment 1_300_000 the pre-trade figure
          3_900_000 lands in the 6.0% tier, whereas tiering off the gross 5_200_000 would select
          8.0% and off the final net would be circular. The 6.0/8.0 choice changes net closure
          from 3_588_000 to 3_484_000, so picking the wrong tier input is observable.
        test_recipe:
          setup:
            - "One ProductFamily at 100 units/hour and one MATURE Item priced at 1000 cents with on_hand_units = 0, material_supply_cap_units = 100000 and safety_stock_units = 330."
            - "A single 10-hour CapacityBlock inside the 2026-09 horizon window, i.e. 1000 available units."
            - "A PlanningCycle with financial_commitment_cents = 10_000_000 and NET_INVENTORY_FIRST, holding one CONSENSUS_LOCKED forecast of 7000 units, whose SupplyPlan is therefore constrained to 1000 units with shortfall_units = 6330."
            - "The cycle advanced to SCENARIO_REVIEW."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-FROZ", name: "Frozen", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-PIZZA-1", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, service_level_target_pct: 95.0, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-A", name: "Alpha Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/capacity-blocks"
              payload: { family_id: "${fam_id}", start_date: "2026-09-01", end_date: "2026-09-30", available_hours: 10 }
              as: SupplyPlanner
              as_user_id: "supply-1"
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "SOP-GAP-09", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 10000000, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 7000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_id: $.data.id }
            - call: "POST /sop/demand-forecasts/${fc_id}/transitions"
              payload: { target_status: "UNDER_CONSENSUS" }
              as: DemandPlanner
              as_user_id: "planner-1"
            - call: "POST /sop/demand-forecasts/${fc_id}/transitions"
              payload: { target_status: "CONSENSUS_LOCKED" }
              as: DemandReviewLead
              as_user_id: "lead-1"
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
