        distinguishing_aspect: |
          Mode (c): a circular-looking dependency (fee included in the total the guest
          pays, fee computed from the sale amount) resolved by pinned evaluation order:
          fee = max(50, round_half_up(pre-fee subtotal * 0.06)). A 990 subtotal yields
