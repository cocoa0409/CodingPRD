# =============================================================================
# §1.8 Scaffold Difficulty Design — task_1525 School Spirit Store
# 9 rules x >=2 instances = 20 instances (2 bonus beyond the 18 floor)
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: campaign_units_provisional_vs_final
        grounds:
          - calculations.campaign_units_projection
          - state_machines.PreOrderCampaign.OPEN_to_IN_PRODUCTION
          - entities.PreOrderCampaign.fields.placed_units
          - entities.PreOrderCampaign.fields.paid_units
        distinguishing_aspect: |
          Same preorder population, two algorithms: provisional placed_units counts PLACED+PAID (12 units)
          while final paid_units counts PAID only (10 units) — the campaign domain's dual variant, distinct
          from the inventory-valuation domain of the sibling instance.
        test_recipe:
          setup:
            - "Program ACTIVE; design APPROVED; campaign OPEN with goal_units=10, unit_price 2500, deposit_pct 0.4, window [2026-08-01, 2026-09-01)"
            - "Variants M and S exist for the design; vendor APPROVED with ACTIVE quote (min 2, cost 500) so the lock selector succeeds"
            - "PreOrders: P1 M qty 6 PAID (deposit 6000), P2 S qty 4 PAID (deposit 4000), P3 M qty 2 left PLACED (unpaid)"
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/designs", payload: { program_id: "${prog}", name: "Eagle Logo", artwork_ref: "eagle.png", royalty_pct: 0, licensing_fee_cents: 0 }, as: StoreManager, captures: { des: $.data.id, des_v: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: SUBMITTED, expected_design_version: "${des_v}" }, as: LicensingCoordinator, captures: { des_v2: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: APPROVED, expected_design_version: "${des_v2}" }, as: LicensingCoordinator }
            - { call: "POST /spirit-store/product-variants", payload: { program_id: "${prog}", design_id: "${des}", size: "M", unit_price_cents: 2500 }, as: StoreManager, captures: { var_m: $.data.id } }
            - { call: "POST /spirit-store/product-variants", payload: { program_id: "${prog}", design_id: "${des}", size: "S", unit_price_cents: 2500 }, as: StoreManager, captures: { var_s: $.data.id } }
            - { call: "POST /spirit-store/vendors", payload: { program_id: "${prog}", name: "PrintCo", contact_email: "p@co.com", quotes: [ { design_id: "${des}", unit_cost_cents: 500, min_order_qty: 2, production_days: 10, status: ACTIVE } ] }, as: StoreManager, captures: { ven: $.data.id } }
            - { call: "PATCH /spirit-store/vendors/${ven}", payload: { status: APPROVED }, as: StoreManager }
            - { call: "POST /spirit-store/preorder-campaigns", payload: { program_id: "${prog}", design_id: "${des}", unit_price_cents: 2500, deposit_pct: 0.4, goal_units: 10, opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-09-01T00:00:00Z" }, as: StoreManager, captures: { camp: $.data.id } }
            - { call: "POST /spirit-store/preorder-campaigns/${camp}/open", payload: {}, as: StoreManager }
            - { call: "POST /spirit-store/preorders", payload: { program_id: "${prog}", campaign_id: "${camp}", variant_id: "${var_m}", customer_user_id: "cust-01", qty: 6 }, as: Customer, as_user_id: "cust-01", captures: { p1: $.data.id } }
            - { call: "POST /spirit-store/preorders/${p1}/pay", payload: { phase: DEPOSIT, amount_cents: 6000 }, as: Customer, as_user_id: "cust-01" }
            - { call: "POST /spirit-store/preorders", payload: { program_id: "${prog}", campaign_id: "${camp}", variant_id: "${var_s}", customer_user_id: "cust-02", qty: 4 }, as: Customer, as_user_id: "cust-02", captures: { p2: $.data.id } }
            - { call: "POST /spirit-store/preorders/${p2}/pay", payload: { phase: DEPOSIT, amount_cents: 4000 }, as: Customer, as_user_id: "cust-02" }
            - { call: "POST /spirit-store/preorders", payload: { program_id: "${prog}", campaign_id: "${camp}", variant_id: "${var_m}", customer_user_id: "cust-03", qty: 2 }, as: Customer, as_user_id: "cust-03" }
            - { call: "GET /spirit-store/preorder-campaigns/${camp}", payload: {}, as: StoreManager, captures: { placed_pre: $.data.placed_units, paid_pre: $.data.paid_units } }
          trigger:
            - { call: "POST /spirit-store/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/preorder-campaigns/${camp}/lock", payload: {}, as: StoreManager, captures: { camp_status: $.data.status, sel_ven: $.data.selected_vendor_id } }
          assert:
            - "Pre-lock capture: placed_pre == 12 AND paid_pre == 10 — provisional and final disagree on identical preorder data"
            - "camp_status == IN_PRODUCTION — lock used the FINAL variant (paid_units 10 >= goal 10), ignoring the 2 unpaid PLACED units that only the provisional variant counts"
            - "sel_ven == ${ven}"

      - name: inventory_valuation_fifo_vs_weighted_avg
        grounds:
          - calculations.stock_valuation_calc
          - endpoints: "GET /spirit-store/programs/{programId}/valuation"
          - entities.ProductVariant.fields.landed_unit_cost_cents
        distinguishing_aspect: |
          Same receipt layers and same sales, two valuation algorithms: FIFO remaining value 70000 cents
          (newest layer survives) vs WEIGHTED_AVG 60000 cents (blended 600/unit) — inventory-valuation domain,
          distinct from the campaign-demand domain of the sibling instance.
        test_recipe:
          setup:
            - "Program ACTIVE with valuation_method FIFO; design APPROVED with licensing_fee_cents=0 (landed == unit cost)"
            - "Variant ONE_SIZE price 1000; vendor A APPROVED quote cost 500; vendor B APPROVED quote cost 700 (both min 25)"
            - "PO1 from A qty 100 fully received (landed 500); PO2 from B qty 100 fully received (landed 700); on_hand 200"
            - "POS event open; CASH sale of 100 units consumes stock (event totals irrelevant here)"
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/designs", payload: { program_id: "${prog}", name: "Block S", artwork_ref: "s.png", royalty_pct: 0, licensing_fee_cents: 0 }, as: StoreManager, captures: { des: $.data.id, des_v: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: SUBMITTED, expected_design_version: "${des_v}" }, as: LicensingCoordinator, captures: { des_v2: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: APPROVED, expected_design_version: "${des_v2}" }, as: LicensingCoordinator }
            - { call: "POST /spirit-store/product-variants", payload: { program_id: "${prog}", design_id: "${des}", size: "ONE_SIZE", unit_price_cents: 1000 }, as: StoreManager, captures: { var: $.data.id } }
            - { call: "POST /spirit-store/vendors", payload: { program_id: "${prog}", name: "VendorA", contact_email: "a@co.com", quotes: [ { design_id: "${des}", unit_cost_cents: 500, min_order_qty: 25, production_days: 10, status: ACTIVE } ] }, as: StoreManager, captures: { ven_a: $.data.id } }
            - { call: "PATCH /spirit-store/vendors/${ven_a}", payload: { status: APPROVED }, as: StoreManager }
            - { call: "POST /spirit-store/vendors", payload: { program_id: "${prog}", name: "VendorB", contact_email: "b@co.com", quotes: [ { design_id: "${des}", unit_cost_cents: 700, min_order_qty: 25, production_days: 5, status: ACTIVE } ] }, as: StoreManager, captures: { ven_b: $.data.id } }
            - { call: "PATCH /spirit-store/vendors/${ven_b}", payload: { status: APPROVED }, as: StoreManager }
            - { call: "POST /spirit-store/purchase-orders", payload: { program_id: "${prog}", variant_id: "${var}", vendor_id: "${ven_a}", qty_ordered: 100 }, as: StoreManager, captures: { po1: $.data.id } }
            - { call: "POST /spirit-store/purchase-orders/${po1}/submit", payload: {}, as: StoreManager }
            - { call: "POST /spirit-store/purchase-orders/${po1}/receive", payload: { qty: 100 }, as: StoreManager }
            - { call: "POST /spirit-store/purchase-orders", payload: { program_id: "${prog}", variant_id: "${var}", vendor_id: "${ven_b}", qty_ordered: 100 }, as: StoreManager, captures: { po2: $.data.id } }
            - { call: "POST /spirit-store/purchase-orders/${po2}/submit", payload: {}, as: StoreManager }
            - { call: "POST /spirit-store/purchase-orders/${po2}/receive", payload: { qty: 100 }, as: StoreManager }
            - { call: "POST /spirit-store/event-sales", payload: { program_id: "${prog}", name: "Game 1", register_location: "GYM-A", starts_at: "2026-09-05T14:00:00Z", ends_at: "2026-09-05T16:00:00Z" }, as: StoreManager, captures: { ev: $.data.id } }
            - { call: "POST /spirit-store/event-sales/${ev}/open-drawer", payload: { opening_float_cents: 10000 }, as: StudentCashier, as_user_id: "cashier-01" }
            - { call: "POST /spirit-store/orders", payload: { program_id: "${prog}", channel: EVENT_POS, event_id: "${ev}", customer_user_id: "walkup", payment_method: CASH, lines: [ { variant_id: "${var}", qty: 100 } ] }, as: StudentCashier, as_user_id: "cashier-01" }
          trigger:
            - { call: "GET /spirit-store/programs/${prog}/valuation", payload: { method: FIFO }, as: Treasurer, captures: { val_fifo: $.data.total_value_cents } }
            - { call: "GET /spirit-store/programs/${prog}/valuation", payload: { method: WEIGHTED_AVG }, as: Treasurer, captures: { val_wavg: $.data.total_value_cents } }
          assert:
            - "val_fifo == 70000 (100 remaining units all from the 700-cost layer; the 100 sold consumed the earlier 500-cost layer)"
            - "val_wavg == 60000 (avg = (50000+70000)/200 = 600; 100 x 600)"
            - "val_fifo != val_wavg — identical inputs, divergent dual-variant outputs"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: order_total_per_line_rounding
        grounds:
          - calculations.order_total_calc
          - endpoints: "POST /spirit-store/orders"
        distinguishing_aspect: |
          Mode (b) nested rounding: 3 lines of 333c at 10% discount — pinned per-line-then-sum gives 900
          (round_half_up(299.7)=300 x3); the alternative sum-then-round gives 899. Mode differs from the
          sibling instance's mode (a) multi-input waterfall.
        test_recipe:
          setup:
            - "Program ACTIVE; design APPROVED (fee 0, royalty 0); variant M price 333 with 25 units on hand (vendor cost 100, min 25)"
            - "POS event open with float 10000"
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/designs", payload: { program_id: "${prog}", name: "Paw", artwork_ref: "paw.png", royalty_pct: 0, licensing_fee_cents: 0 }, as: StoreManager, captures: { des: $.data.id, des_v: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: SUBMITTED, expected_design_version: "${des_v}" }, as: LicensingCoordinator, captures: { des_v2: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: APPROVED, expected_design_version: "${des_v2}" }, as: LicensingCoordinator }
            - { call: "POST /spirit-store/product-variants", payload: { program_id: "${prog}", design_id: "${des}", size: "M", unit_price_cents: 333 }, as: StoreManager, captures: { var: $.data.id } }
            - { call: "POST /spirit-store/vendors", payload: { program_id: "${prog}", name: "PrintCo", contact_email: "p@co.com", quotes: [ { design_id: "${des}", unit_cost_cents: 100, min_order_qty: 25, production_days: 10, status: ACTIVE } ] }, as: StoreManager, captures: { ven: $.data.id } }
            - { call: "PATCH /spirit-store/vendors/${ven}", payload: { status: APPROVED }, as: StoreManager }
            - { call: "POST /spirit-store/purchase-orders", payload: { program_id: "${prog}", variant_id: "${var}", vendor_id: "${ven}", qty_ordered: 25 }, as: StoreManager, captures: { po: $.data.id } }
            - { call: "POST /spirit-store/purchase-orders/${po}/submit", payload: {}, as: StoreManager }
            - { call: "POST /spirit-store/purchase-orders/${po}/receive", payload: { qty: 25 }, as: StoreManager }
            - { call: "POST /spirit-store/event-sales", payload: { program_id: "${prog}", name: "Game 1", register_location: "GYM-A", starts_at: "2026-09-05T14:00:00Z", ends_at: "2026-09-05T16:00:00Z" }, as: StoreManager, captures: { ev: $.data.id } }
            - { call: "POST /spirit-store/event-sales/${ev}/open-drawer", payload: { opening_float_cents: 10000 }, as: StudentCashier, as_user_id: "cashier-01" }
          trigger:
            - { call: "POST /spirit-store/orders", payload: { program_id: "${prog}", channel: EVENT_POS, event_id: "${ev}", customer_user_id: "walkup", payment_method: CASH, lines: [ { variant_id: "${var}", qty: 1, discount_pct: 0.10 }, { variant_id: "${var}", qty: 1, discount_pct: 0.10 }, { variant_id: "${var}", qty: 1, discount_pct: 0.10 } ] }, as: StudentCashier, as_user_id: "cashier-01", captures: { ord_total: $.data.total_cents } }
            - { call: "GET /spirit-store/event-sales/${ev}", payload: {}, as: Treasurer, captures: { ev_cash: $.data.cash_sales_cents } }
          assert:
            - "ord_total == 900 (per-line round_half_up(333*0.9)=300, summed: 300+300+300; NOT 899 from sum-then-round)"
            - "ev_cash == 900"

      - name: allocation_waterfall_caps_overflow
        grounds:
          - calculations.allocation_waterfall_calc
          - endpoints: "POST /spirit-store/allocation-runs"
        distinguishing_aspect: |
          Mode (a) multi-input non-linear: waterfall with 3+ inputs (profit, weights, caps), nested min() per
          capped account plus iterative overflow redistribution — A capped at 30000 (raw 50000), overflow 20000
          redistributed 30:20 to B and C. Mode differs from sibling's rounding-order mode (b).
        test_recipe:
          setup:
            - "Program ACTIVE with undistributed profit exactly 100000 (via profit adjustment)"
            - "Accounts: A weight 50 cap 30000; B weight 30 uncapped; C weight 20 uncapped; all balances 0"
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/programs/${prog}/profit-adjustments", payload: { amount_cents: 100000, reason: "donation" }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/activity-accounts", payload: { program_id: "${prog}", name: "Band", allocation_weight: 50, cap_cents: 30000 }, as: ActivitiesDirector, captures: { acc_a: $.data.id } }
            - { call: "POST /spirit-store/activity-accounts", payload: { program_id: "${prog}", name: "Drama", allocation_weight: 30 }, as: ActivitiesDirector, captures: { acc_b: $.data.id } }
            - { call: "POST /spirit-store/activity-accounts", payload: { program_id: "${prog}", name: "Robotics", allocation_weight: 20 }, as: ActivitiesDirector, captures: { acc_c: $.data.id } }
          trigger:
            - { call: "POST /spirit-store/allocation-runs", payload: { program_id: "${prog}", distributable_cents: 100000 }, as: Treasurer, captures: { run: $.data.id } }
            - { call: "GET /spirit-store/allocation-runs/${run}", payload: {}, as: Treasurer }
          assert:
            - "AllocationRun.lines for ${acc_a}: credit_cents == 30000 AND capped == true (raw 50000 capped at 30000)"
            - "AllocationRun.lines for ${acc_b}: credit_cents == 42000 (30000 raw + floor(20000*30/50)=12000 overflow share)"
            - "AllocationRun.lines for ${acc_c}: credit_cents == 28000 (20000 raw + floor(20000*20/50)=8000 overflow share)"
            - "sum(lines.credit_cents) == 100000 — conservation holds exactly with zero rounding dust"
            - "Program.undistributed_profit_cents still == 100000 (lines frozen at DRAFT; nothing moves until post)"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: design_resubmission_cycle
        grounds:
          - state_machines.Design.REJECTED_to_SUBMITTED
          - state_machines.Design.SUBMITTED_to_REJECTED
          - entities.Design.fields.revision_count
        distinguishing_aspect: |
          Cyclic machine on Design: SUBMITTED -> REJECTED -> SUBMITTED -> REJECTED -> SUBMITTED -> APPROVED,
          revision_count accruing per loop — a revision cycle, structurally distinct from the sibling's
          parallel-dimension machine on Order.
        test_recipe:
          setup:
            - "Program ACTIVE; design created (DRAFT, version 1, revision_count 0)"
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/designs", payload: { program_id: "${prog}", name: "Mascot v1", artwork_ref: "m1.png", royalty_pct: 0.05, licensing_fee_cents: 2000 }, as: StoreManager, captures: { des: $.data.id, v1: $.data.version } }
          trigger:
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: SUBMITTED, expected_design_version: "${v1}" }, as: LicensingCoordinator, captures: { v2: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: REJECTED, expected_design_version: "${v2}", note: "colors off-brand" }, as: LicensingCoordinator, captures: { v3: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: SUBMITTED, expected_design_version: "${v3}" }, as: LicensingCoordinator, captures: { v4: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: REJECTED, expected_design_version: "${v4}", note: "font not licensed" }, as: LicensingCoordinator, captures: { v5: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: SUBMITTED, expected_design_version: "${v5}" }, as: LicensingCoordinator, captures: { v6: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: APPROVED, expected_design_version: "${v6}" }, as: LicensingCoordinator, captures: { final_st: $.data.status, rev: $.data.revision_count, rej: $.data.rejection_reason } }
          assert:
            - "final_st == APPROVED after two full REJECTED->SUBMITTED loops"
            - "rev == 2 (revision_count increments exactly once per resubmission)"
            - "rej == null (cleared on last resubmission)"

      - name: order_parallel_payment_fulfillment_dims
        grounds:
          - state_machines.Order (payment_status x fulfillment_status parallel dimensions)
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: |
          Parallel state dimensions on Order: a partial refund moves payment_status PAID -> PARTIALLY_REFUNDED
          while fulfillment_status stays READY_FOR_PICKUP — independent axes on one row, structurally distinct
          from the sibling's cyclic loop on Design.
        test_recipe:
          setup:
            - "Program ACTIVE; design APPROVED (fee 0, royalty 0); variant M price 2500, 25 on hand (landed 500)"
            - "ONLINE CARD order qty 2 (total 5000, margin 4000): payment PAID x fulfillment PICKUP_PENDING; reserved_online_qty 2"
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/designs", payload: { program_id: "${prog}", name: "Stripe", artwork_ref: "st.png", royalty_pct: 0, licensing_fee_cents: 0 }, as: StoreManager, captures: { des: $.data.id, des_v: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: SUBMITTED, expected_design_version: "${des_v}" }, as: LicensingCoordinator, captures: { des_v2: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: APPROVED, expected_design_version: "${des_v2}" }, as: LicensingCoordinator }
            - { call: "POST /spirit-store/product-variants", payload: { program_id: "${prog}", design_id: "${des}", size: "M", unit_price_cents: 2500 }, as: StoreManager, captures: { var: $.data.id } }
            - { call: "POST /spirit-store/vendors", payload: { program_id: "${prog}", name: "PrintCo", contact_email: "p@co.com", quotes: [ { design_id: "${des}", unit_cost_cents: 500, min_order_qty: 25, production_days: 10, status: ACTIVE } ] }, as: StoreManager, captures: { ven: $.data.id } }
            - { call: "PATCH /spirit-store/vendors/${ven}", payload: { status: APPROVED }, as: StoreManager }
            - { call: "POST /spirit-store/purchase-orders", payload: { program_id: "${prog}", variant_id: "${var}", vendor_id: "${ven}", qty_ordered: 25 }, as: StoreManager, captures: { po: $.data.id } }
            - { call: "POST /spirit-store/purchase-orders/${po}/submit", payload: {}, as: StoreManager }
            - { call: "POST /spirit-store/purchase-orders/${po}/receive", payload: { qty: 25 }, as: StoreManager }
            - { call: "POST /spirit-store/orders", payload: { program_id: "${prog}", channel: ONLINE, customer_user_id: "cust-10", payment_method: CARD, lines: [ { variant_id: "${var}", qty: 2 } ] }, as: Customer, as_user_id: "cust-10", captures: { ord: $.data.id, ord_pay0: $.data.payment_status, ord_ful0: $.data.fulfillment_status } }
            - { call: "POST /spirit-store/orders/${ord}/fulfillment-transition", payload: { to_state: READY_FOR_PICKUP }, as: StoreManager }
          trigger:
            - { call: "POST /spirit-store/orders/${ord}/refund", payload: { amount_cents: 1000 }, as: Treasurer, captures: { pay1: $.data.payment_status, ful1: $.data.fulfillment_status, ref1: $.data.refunded_cents } }
            - { call: "GET /spirit-store/programs/${prog}", payload: {}, as: Treasurer, captures: { profit: $.data.undistributed_profit_cents } }
          assert:
            - "ord_pay0 == PAID AND ord_ful0 == PICKUP_PENDING (initial parallel state)"
            - "pay1 == PARTIALLY_REFUNDED AND ful1 == READY_FOR_PICKUP — payment dim moved, fulfillment dim untouched"
            - "ref1 == 1000"
            - "profit == 3200 (margin 4000 recognized at sale; reversal round_half_up(4000*1000/5000)=800)"
            - "ProductVariant.${var}.reserved_online_qty still == 2 (1000 cents covers no whole unit at 2500)"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: design_revoke_cascade_depth3
        grounds:
          - state_machines.Design.APPROVED_to_REVOKED
          - state_machines.PreOrderCampaign.OPEN_to_CANCELLED
          - state_machines.PreOrder.PAID_to_REFUNDED
        distinguishing_aspect: |
          Depth-3 chain from the REVOKED trigger: design revocation recomputes variant sellable (link 1);
          an unsellable design auto-cancels its OPEN campaign (link 2, caused by link 1); campaign cancellation
          refunds its PAID preorders and cancels PLACED ones (link 3, caused by link 2). Distinct trigger from
          the sibling's PO-receipt chain.
        test_recipe:
          setup:
            - "Program ACTIVE; design APPROVED; variants M and S exist (no stock needed)"
            - "Campaign OPEN (goal 100 so it cannot accidentally produce): preorder P1 M qty 2 PAID (deposit 2000), P2 S qty 1 PLACED"
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/designs", payload: { program_id: "${prog}", name: "Eagle", artwork_ref: "e.png", royalty_pct: 0, licensing_fee_cents: 0 }, as: StoreManager, captures: { des: $.data.id, v1: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: SUBMITTED, expected_design_version: "${v1}" }, as: LicensingCoordinator, captures: { v2: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: APPROVED, expected_design_version: "${v2}" }, as: LicensingCoordinator, captures: { v3: $.data.version } }
            - { call: "POST /spirit-store/product-variants", payload: { program_id: "${prog}", design_id: "${des}", size: "M", unit_price_cents: 2500 }, as: StoreManager, captures: { var_m: $.data.id } }
            - { call: "POST /spirit-store/product-variants", payload: { program_id: "${prog}", design_id: "${des}", size: "S", unit_price_cents: 2500 }, as: StoreManager, captures: { var_s: $.data.id } }
            - { call: "POST /spirit-store/preorder-campaigns", payload: { program_id: "${prog}", design_id: "${des}", unit_price_cents: 2500, deposit_pct: 0.4, goal_units: 100, opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-09-01T00:00:00Z" }, as: StoreManager, captures: { camp: $.data.id } }
            - { call: "POST /spirit-store/preorder-campaigns/${camp}/open", payload: {}, as: StoreManager }
            - { call: "POST /spirit-store/preorders", payload: { program_id: "${prog}", campaign_id: "${camp}", variant_id: "${var_m}", customer_user_id: "cust-01", qty: 2 }, as: Customer, as_user_id: "cust-01", captures: { p1: $.data.id } }
            - { call: "POST /spirit-store/preorders/${p1}/pay", payload: { phase: DEPOSIT, amount_cents: 2000 }, as: Customer, as_user_id: "cust-01" }
            - { call: "POST /spirit-store/preorders", payload: { program_id: "${prog}", campaign_id: "${camp}", variant_id: "${var_s}", customer_user_id: "cust-02", qty: 1 }, as: Customer, as_user_id: "cust-02", captures: { p2: $.data.id } }
          trigger:
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: REVOKED, expected_design_version: "${v3}", note: "trademark dispute" }, as: LicensingCoordinator }
            - { call: "GET /spirit-store/product-variants/${var_m}", payload: {}, as: StoreManager, captures: { m_sellable: $.data.sellable } }
            - { call: "GET /spirit-store/preorder-campaigns/${camp}", payload: {}, as: StoreManager, captures: { camp_st: $.data.status } }
            - { call: "GET /spirit-store/preorders/${p1}", payload: {}, as: Treasurer, captures: { p1_st: $.data.status, p1_ref: $.data.refunded_cents } }
            - { call: "GET /spirit-store/preorders/${p2}", payload: {}, as: Treasurer, captures: { p2_st: $.data.status } }
          assert:
            - "m_sellable == false (link 1: variant recomputed unsellable)"
            - "camp_st == CANCELLED (link 2: OPEN campaign auto-cancelled because its design became unsellable)"
            - "p1_st == REFUNDED AND p1_ref == 2000 (link 3: PAID preorder auto-refunded deposit+balance)"
            - "p2_st == CANCELLED (PLACED preorder cancelled, no money moved)"

      - name: po_receipt_triggers_campaign_fulfillment
        grounds:
          - state_machines.PurchaseOrder.SUBMITTED_to_RECEIVED
          - state_machines.PreOrderCampaign.IN_PRODUCTION_to_FULFILLING
          - calculations.landed_cost_calc
        distinguishing_aspect: |
          Depth-2 chain from the receive trigger: final receipt increments variant.on_hand_qty (link 1) and the
          campaign's all-POs-received condition auto-advances IN_PRODUCTION -> FULFILLING (link 2, caused by
          link 1). Originates from POST .../receive — a different trigger than the sibling's design revoke.
        test_recipe:
          setup:
            - "Program ACTIVE; design APPROVED (fee 0); variant M price 2500; vendor APPROVED quote cost 500 min 2"
            - "Campaign OPEN goal 2 price 2500 deposit 0.4 window [2026-08-01, 2026-09-01); preorder qty 2 PAID (deposit 2000)"
            - "Clock advanced to 2026-09-01; campaign locked -> IN_PRODUCTION with one auto-created PO qty 2 (max(2, min 2)) status SUBMITTED"
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/designs", payload: { program_id: "${prog}", name: "Star", artwork_ref: "s.png", royalty_pct: 0, licensing_fee_cents: 0 }, as: StoreManager, captures: { des: $.data.id, v1: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: SUBMITTED, expected_design_version: "${v1}" }, as: LicensingCoordinator, captures: { v2: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: APPROVED, expected_design_version: "${v2}" }, as: LicensingCoordinator }
            - { call: "POST /spirit-store/product-variants", payload: { program_id: "${prog}", design_id: "${des}", size: "M", unit_price_cents: 2500 }, as: StoreManager, captures: { var: $.data.id } }
            - { call: "POST /spirit-store/vendors", payload: { program_id: "${prog}", name: "PrintCo", contact_email: "p@co.com", quotes: [ { design_id: "${des}", unit_cost_cents: 500, min_order_qty: 2, production_days: 10, status: ACTIVE } ] }, as: StoreManager, captures: { ven: $.data.id } }
            - { call: "PATCH /spirit-store/vendors/${ven}", payload: { status: APPROVED }, as: StoreManager }
            - { call: "POST /spirit-store/preorder-campaigns", payload: { program_id: "${prog}", design_id: "${des}", unit_price_cents: 2500, deposit_pct: 0.4, goal_units: 2, opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-09-01T00:00:00Z" }, as: StoreManager, captures: { camp: $.data.id } }
            - { call: "POST /spirit-store/preorder-campaigns/${camp}/open", payload: {}, as: StoreManager }
            - { call: "POST /spirit-store/preorders", payload: { program_id: "${prog}", campaign_id: "${camp}", variant_id: "${var}", customer_user_id: "cust-01", qty: 2 }, as: Customer, as_user_id: "cust-01", captures: { p1: $.data.id } }
            - { call: "POST /spirit-store/preorders/${p1}/pay", payload: { phase: DEPOSIT, amount_cents: 2000 }, as: Customer, as_user_id: "cust-01" }
            - { call: "POST /spirit-store/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/preorder-campaigns/${camp}/lock", payload: {}, as: StoreManager }
            - { call: "GET /spirit-store/purchase-orders?campaign_id=${camp}", payload: {}, as: StoreManager, captures: { po: "$.data[0].id", po_qty: "$.data[0].qty_ordered", po_auto: "$.data[0].auto_created" } }
          trigger:
            - { call: "POST /spirit-store/purchase-orders/${po}/receive", payload: { qty: 2 }, as: StoreManager, captures: { po_st: $.data.status } }
            - { call: "GET /spirit-store/preorder-campaigns/${camp}", payload: {}, as: StoreManager, captures: { camp_st: $.data.status } }
            - { call: "GET /spirit-store/product-variants/${var}", payload: {}, as: StoreManager, captures: { v_onhand: $.data.on_hand_qty, v_landed: $.data.landed_unit_cost_cents } }
          assert:
            - "po_auto == true AND po_qty == 2 (selector-created PO: max(demand 2, min 2))"
            - "po_st == RECEIVED (qty_received 2 == qty_ordered 2, exact-equality completion)"
            - "v_onhand == 2 (link 1: receipt incremented stock)"
            - "camp_st == FULFILLING (link 2: all campaign POs RECEIVED auto-advanced the campaign)"
            - "v_landed == 500 (fee 0 amortization adds nothing)"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_on_preorder_pay
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - errors[ERR_PREORDER_NOT_PAYABLE]
          - errors[ERR_DEPOSIT_SHORTFALL]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: paying a CANCELLED preorder with a wrong amount violates
          both ERR_PREORDER_NOT_PAYABLE (priority 7, state) and ERR_DEPOSIT_SHORTFALL (priority 11, fiscal);
          the state error must win. Pair differs from the sibling's safety-vs-temporal pair.
        test_recipe:
          setup:
            - "Program ACTIVE; design APPROVED; campaign OPEN; preorder qty 1 PLACED (deposit_due 1000) then cancelled by the customer"
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/designs", payload: { program_id: "${prog}", name: "Eagle", artwork_ref: "e.png", royalty_pct: 0, licensing_fee_cents: 0 }, as: StoreManager, captures: { des: $.data.id, v1: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: SUBMITTED, expected_design_version: "${v1}" }, as: LicensingCoordinator, captures: { v2: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: APPROVED, expected_design_version: "${v2}" }, as: LicensingCoordinator }
            - { call: "POST /spirit-store/product-variants", payload: { program_id: "${prog}", design_id: "${des}", size: "M", unit_price_cents: 2500 }, as: StoreManager, captures: { var: $.data.id } }
            - { call: "POST /spirit-store/preorder-campaigns", payload: { program_id: "${prog}", design_id: "${des}", unit_price_cents: 2500, deposit_pct: 0.4, goal_units: 10, opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-09-01T00:00:00Z" }, as: StoreManager, captures: { camp: $.data.id } }
            - { call: "POST /spirit-store/preorder-campaigns/${camp}/open", payload: {}, as: StoreManager }
            - { call: "POST /spirit-store/preorders", payload: { program_id: "${prog}", campaign_id: "${camp}", variant_id: "${var}", customer_user_id: "cust-01", qty: 1 }, as: Customer, as_user_id: "cust-01", captures: { p1: $.data.id, due: $.data.deposit_due_cents } }
            - { call: "POST /spirit-store/preorders/${p1}/cancel", payload: {}, as: Customer, as_user_id: "cust-01" }
          trigger:
            - { call: "POST /spirit-store/preorders/${p1}/pay", payload: { phase: DEPOSIT, amount_cents: 1 }, as: Customer, as_user_id: "cust-01", captures: { err: $.data.error_id } }
          assert:
            - "due == 1000 (max(floor 500, round(2500*1*0.4)=1000)) — the fiscal shortfall (1 < 1000) is real"
            - "err == ERR_PREORDER_NOT_PAYABLE — priority-7 state beats priority-11 fiscal, NOT ERR_DEPOSIT_SHORTFALL"

      - name: safety_vs_temporal_on_order_create
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_LICENSE_REVOKED]
          - errors[ERR_DROP_NOT_OPEN]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_temporal: an online order for a variant whose design
          is REVOKED and whose drop is CLOSED violates both; ERR_LICENSE_REVOKED (priority 8, safety) must win
          over ERR_DROP_NOT_OPEN (priority 9, temporal). Pair differs from the sibling's state-vs-fiscal pair.
        test_recipe:
          setup:
            - "Program ACTIVE; design APPROVED; drop created [2026-09-01, 2026-10-01), opened (clock set 2026-09-05), then CLOSED"
            - "Variant M attached to the drop with 25 units stocked (PO completed before revocation)"
            - "Design then REVOKED (no campaigns exist, so the cascade touches only variant sellability)"
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector, captures: { prog_v: $.data.version } }
            - { call: "POST /spirit-store/designs", payload: { program_id: "${prog}", name: "DropArt", artwork_ref: "d.png", royalty_pct: 0, licensing_fee_cents: 0 }, as: StoreManager, captures: { des: $.data.id, v1: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: SUBMITTED, expected_design_version: "${v1}" }, as: LicensingCoordinator, captures: { v2: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: APPROVED, expected_design_version: "${v2}" }, as: LicensingCoordinator, captures: { v3: $.data.version } }
            - { call: "POST /spirit-store/seasonal-drops", payload: { program_id: "${prog}", name: "Fall Drop", opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-10-01T00:00:00Z", expected_program_version: "${prog_v}" }, as: StoreManager, captures: { drop: $.data.id } }
            - { call: "POST /spirit-store/product-variants", payload: { program_id: "${prog}", design_id: "${des}", size: "M", unit_price_cents: 3000, drop_id: "${drop}" }, as: StoreManager, captures: { var: $.data.id } }
            - { call: "POST /spirit-store/vendors", payload: { program_id: "${prog}", name: "PrintCo", contact_email: "p@co.com", quotes: [ { design_id: "${des}", unit_cost_cents: 500, min_order_qty: 25, production_days: 10, status: ACTIVE } ] }, as: StoreManager, captures: { ven: $.data.id } }
            - { call: "PATCH /spirit-store/vendors/${ven}", payload: { status: APPROVED }, as: StoreManager }
            - { call: "POST /spirit-store/purchase-orders", payload: { program_id: "${prog}", variant_id: "${var}", vendor_id: "${ven}", qty_ordered: 25 }, as: StoreManager, captures: { po: $.data.id } }
            - { call: "POST /spirit-store/purchase-orders/${po}/submit", payload: {}, as: StoreManager }
            - { call: "POST /spirit-store/purchase-orders/${po}/receive", payload: { qty: 25 }, as: StoreManager }
            - { call: "POST /spirit-store/_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T12:00:00Z" }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/seasonal-drops/${drop}/transition", payload: { to_state: OPEN }, as: StoreManager }
            - { call: "POST /spirit-store/seasonal-drops/${drop}/transition", payload: { to_state: CLOSED }, as: StoreManager }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: REVOKED, expected_design_version: "${v3}", note: "licensor pulled rights" }, as: LicensingCoordinator }
          trigger:
            - { call: "POST /spirit-store/orders", payload: { program_id: "${prog}", channel: ONLINE, customer_user_id: "cust-20", payment_method: CARD, lines: [ { variant_id: "${var}", qty: 1 } ] }, as: Customer, as_user_id: "cust-20", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_LICENSE_REVOKED — priority-8 safety beats priority-9 temporal (drop CLOSED would otherwise yield ERR_DROP_NOT_OPEN)"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: over_short_exactly_at_tolerance_reconciles
        grounds:
          - calculations.cash_over_short_calc
          - state_machines.EventSale.OPEN_to_COUNTED
          - entities.MerchProgram.fields.over_short_tolerance_cents
        distinguishing_aspect: |
          Cash-metric boundary on the close-count endpoint: over_short of exactly +500 cents equals the default
          tolerance and RECONCILES (<= semantics); the sibling instance exercises a units metric on the lock
          endpoint. Metric and endpoint both differ.
        test_recipe:
          setup:
            - "Program ACTIVE (default tolerance 500); design APPROVED; variant M price 2500 stocked 25"
            - "Event on register GYM-B 2026-09-05 14:00-16:00; drawer opened with float 10000 by cashier-01"
            - "One CASH POS sale of qty 1 (total 2500) -> expected drawer 12500"
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/designs", payload: { program_id: "${prog}", name: "Eagle", artwork_ref: "e.png", royalty_pct: 0, licensing_fee_cents: 0 }, as: StoreManager, captures: { des: $.data.id, v1: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: SUBMITTED, expected_design_version: "${v1}" }, as: LicensingCoordinator, captures: { v2: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: APPROVED, expected_design_version: "${v2}" }, as: LicensingCoordinator }
            - { call: "POST /spirit-store/product-variants", payload: { program_id: "${prog}", design_id: "${des}", size: "M", unit_price_cents: 2500 }, as: StoreManager, captures: { var: $.data.id } }
            - { call: "POST /spirit-store/vendors", payload: { program_id: "${prog}", name: "PrintCo", contact_email: "p@co.com", quotes: [ { design_id: "${des}", unit_cost_cents: 500, min_order_qty: 25, production_days: 10, status: ACTIVE } ] }, as: StoreManager, captures: { ven: $.data.id } }
            - { call: "PATCH /spirit-store/vendors/${ven}", payload: { status: APPROVED }, as: StoreManager }
            - { call: "POST /spirit-store/purchase-orders", payload: { program_id: "${prog}", variant_id: "${var}", vendor_id: "${ven}", qty_ordered: 25 }, as: StoreManager, captures: { po: $.data.id } }
            - { call: "POST /spirit-store/purchase-orders/${po}/submit", payload: {}, as: StoreManager }
            - { call: "POST /spirit-store/purchase-orders/${po}/receive", payload: { qty: 25 }, as: StoreManager }
            - { call: "POST /spirit-store/event-sales", payload: { program_id: "${prog}", name: "Game 1", register_location: "GYM-B", starts_at: "2026-09-05T14:00:00Z", ends_at: "2026-09-05T16:00:00Z" }, as: StoreManager, captures: { ev: $.data.id } }
            - { call: "POST /spirit-store/event-sales/${ev}/open-drawer", payload: { opening_float_cents: 10000 }, as: StudentCashier, as_user_id: "cashier-01" }
            - { call: "POST /spirit-store/orders", payload: { program_id: "${prog}", channel: EVENT_POS, event_id: "${ev}", customer_user_id: "walkup", payment_method: CASH, lines: [ { variant_id: "${var}", qty: 1 } ] }, as: StudentCashier, as_user_id: "cashier-01" }
          trigger:
            - { call: "POST /spirit-store/event-sales/${ev}/close-count", payload: { closing_counted_cents: 13000 }, as: Treasurer, as_user_id: "treas-01", captures: { ev_st: $.data.status, oshort: $.data.over_short_cents } }
          assert:
            - "oshort == 500 (13000 - (10000 + 2500 - 0))"
            - "ev_st == RECONCILED — |500| <= 500 tolerance: exactly-at-boundary passes (>=-style boundary, not >)"

      - name: campaign_goal_exact_units_locks_into_production
        grounds:
          - calculations.campaign_units_projection
          - state_machines.PreOrderCampaign.OPEN_to_IN_PRODUCTION
          - entities.PreOrderCampaign.fields.goal_units
        distinguishing_aspect: |
          Units-metric boundary on the lock endpoint: paid_units exactly equal to goal_units (2 == 2) takes the
          IN_PRODUCTION branch (>= semantics); differs from the sibling's cash-cents metric on close-count.
        test_recipe:
          setup:
            - "Program ACTIVE; design APPROVED; variant M; vendor APPROVED quote min 2 cost 500"
            - "Campaign OPEN goal 2 price 2500 deposit 0.4; one preorder qty 2 PAID -> paid_units exactly 2"
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/designs", payload: { program_id: "${prog}", name: "Eagle", artwork_ref: "e.png", royalty_pct: 0, licensing_fee_cents: 0 }, as: StoreManager, captures: { des: $.data.id, v1: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: SUBMITTED, expected_design_version: "${v1}" }, as: LicensingCoordinator, captures: { v2: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: APPROVED, expected_design_version: "${v2}" }, as: LicensingCoordinator }
            - { call: "POST /spirit-store/product-variants", payload: { program_id: "${prog}", design_id: "${des}", size: "M", unit_price_cents: 2500 }, as: StoreManager, captures: { var: $.data.id } }
            - { call: "POST /spirit-store/vendors", payload: { program_id: "${prog}", name: "PrintCo", contact_email: "p@co.com", quotes: [ { design_id: "${des}", unit_cost_cents: 500, min_order_qty: 2, production_days: 10, status: ACTIVE } ] }, as: StoreManager, captures: { ven: $.data.id } }
            - { call: "PATCH /spirit-store/vendors/${ven}", payload: { status: APPROVED }, as: StoreManager }
            - { call: "POST /spirit-store/preorder-campaigns", payload: { program_id: "${prog}", design_id: "${des}", unit_price_cents: 2500, deposit_pct: 0.4, goal_units: 2, opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-09-01T00:00:00Z" }, as: StoreManager, captures: { camp: $.data.id } }
            - { call: "POST /spirit-store/preorder-campaigns/${camp}/open", payload: {}, as: StoreManager }
            - { call: "POST /spirit-store/preorders", payload: { program_id: "${prog}", campaign_id: "${camp}", variant_id: "${var}", customer_user_id: "cust-01", qty: 2 }, as: Customer, as_user_id: "cust-01", captures: { p1: $.data.id } }
            - { call: "POST /spirit-store/preorders/${p1}/pay", payload: { phase: DEPOSIT, amount_cents: 2000 }, as: Customer, as_user_id: "cust-01" }
            - { call: "POST /spirit-store/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ActivitiesDirector }
          trigger:
            - { call: "POST /spirit-store/preorder-campaigns/${camp}/lock", payload: {}, as: StoreManager, captures: { st: $.data.status, paid: $.data.paid_units } }
          assert:
            - "paid == 2 AND goal_units == 2 — equality satisfies >= (not >)"
            - "st == IN_PRODUCTION"

      - name: min_order_qty_boundary_exact_vs_below
        grounds:
          - state_machines.PurchaseOrder.DRAFT_to_SUBMITTED
          - errors[ERR_MIN_ORDER_QTY]
        distinguishing_aspect: |
          Quantity-metric boundary on the PO submit endpoint: qty_ordered == min_order_qty (25) submits
          successfully; 24 rejects with ERR_MIN_ORDER_QTY. Bonus third boundary instance; the rule's >=2 are
          carried by the two siblings above.
        test_recipe:
          setup:
            - "Program ACTIVE; design APPROVED; variant M; vendor APPROVED quote min_order_qty 25 cost 500"
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/designs", payload: { program_id: "${prog}", name: "Eagle", artwork_ref: "e.png", royalty_pct: 0, licensing_fee_cents: 0 }, as: StoreManager, captures: { des: $.data.id, v1: $.data.version } }
