            - "VendorInclusion.${inc_id}.inclusion_status == PROPOSED"
            - "Vendor.${ven1_id}.active_sales_relationship_count == 1"
            - "SalesRelationship.${sr_id}.status == ACTIVE"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_precedes_referential_on_sponsorship_activation
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors.ERR_INVALID_STATE
          - errors.ERR_EVENT_AGENDA_LOCKED
          - state_machines.Sponsorship.PENDING_to_ACTIVE
        distinguishing_aspect: "Error-category pair state vs business_referential: a CANCELLED sponsorship on an agenda-locked event violates both the terminal-state rule (priority 5) and the event-state rule (priority 9), and the state error is the one returned."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One event; a GOLD sponsorship that has been activated and then cancelled; a second SILVER sponsorship still PENDING."
          setup_api_calls:
            - *k_clock
            - *k_an1
            - *k_ven1
            - *k_ven2
            - call: "POST /research/conference-events"
              payload: { event_name: "Symposium 2026", venue_region: "NA", start_utc: "2026-10-20T09:00:00Z", end_utc: "2026-10-22T17:00:00Z" }
              as: EventProgrammer
              captures: { ev_id: $.data.id, ev_v: $.data.version }
            - call: "POST /research/sponsorships"
              payload: { conference_event_id: "${ev_id}", vendor_id: "${ven1_id}", tier: "GOLD", amount_cents: 2500000, exclusivity_start_utc: "2026-10-20T09:00:00Z", exclusivity_end_utc: "2026-10-22T17:00:00Z", expected_conference_event_version: "${ev_v}" }
              as: SalesRep
              captures: { sp1_id: $.data.id }
            - call: "POST /research/sponsorships/${sp1_id}/activate"
              payload: {}
              as: EventProgrammer
            - call: "POST /research/sponsorships/${sp1_id}/cancel"
              payload: { cancel_reason: "Vendor withdrew" }
              as: EventProgrammer
            - call: "GET /research/conference-events/${ev_id}"
              payload: {}
              as: EventProgrammer
              captures: { ev_v2: $.data.version }
            - call: "POST /research/sponsorships"
              payload: { conference_event_id: "${ev_id}", vendor_id: "${ven2_id}", tier: "SILVER", amount_cents: 400000, exclusivity_start_utc: "2026-10-20T09:00:00Z", exclusivity_end_utc: "2026-10-22T17:00:00Z", expected_conference_event_version: "${ev_v2}" }
              as: SalesRep
              captures: { sp2_id: $.data.id }
            - call: "POST /research/conference-events/${ev_id}/sessions"
              payload: { session_title: "Opening research keynote", session_kind: "RESEARCH_SESSION", duration_minutes: 60 }
              as: EventProgrammer
            - call: "POST /research/conference-events/${ev_id}/lock-agenda"
              payload: {}
              as: EventProgrammer
          trigger:
            - call: "POST /research/sponsorships/${sp1_id}/activate"
              payload: {}
              as: EventProgrammer
              captures: { err_state_wins: $.data.error_id }
            - call: "POST /research/sponsorships/${sp2_id}/activate"
              payload: {}
              as: EventProgrammer
              captures: { err_referential_only: $.data.error_id }
          assert:
            - "ConferenceEvent.${ev_id}.sponsorship_revenue_cents == 0 after the cancel"
            - "the first activation attempt returns 409 and err_state_wins == ERR_INVALID_STATE"
            - "err_state_wins != ERR_EVENT_AGENDA_LOCKED"
            - "the second activation attempt returns 409 and err_referential_only == ERR_EVENT_AGENDA_LOCKED"
            - "Sponsorship.${sp2_id}.status == PENDING"

      - name: temporal_precedes_fiscal_on_inquiry_schedule
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors.ERR_INQUIRY_START_IN_PAST
          - errors.ERR_INQUIRY_ALLOWANCE_EXHAUSTED
          - calculations.inquiry_allowance_ledger
        distinguishing_aspect: "Error-category pair business_temporal vs business_fiscal: a schedule request with a past slot on an exhausted allowance violates both the past-slot rule (priority 7) and the reservation-ledger rule (priority 10), and the temporal error is the one returned."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Account with inquiry_allowance_total 1; one ACTIVE seat; one analyst."
            - "One inquiry already SCHEDULED for 2026-09-05, so remaining_reserved_units is exactly 0; a second inquiry still ROUTED."
          setup_api_calls:
            - *k_clock
            - *k_an1
            - call: "POST /research/clients"
              payload: { legal_name: "Vantage Retail Group", industry: "Retail", region: "NA", contract_start_utc: "2026-07-01T00:00:00Z", contract_end_utc: "2027-06-30T00:00:00Z", seat_count_contracted: 5, inquiry_allowance_total: 1, reprint_tier: "NONE" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - *k_seat
            - *k_seat_act
            - call: "POST /research/inquiry-requests"
              payload: { seat_id: "${seat_id}", topic_route: "CLOUD_COST", question_summary: "First inquiry", requested_start_utc: "2026-09-05T10:00:00Z", duration_minutes: 45, preparation_notes: "Brief attached." }
              as: SeatHolder
              as_user_id: "${seat_id}"
              captures: { inq_a_id: $.data.id }
            - call: "POST /research/inquiry-requests/${inq_a_id}/schedule"
              payload: { scheduled_start_utc: "2026-09-05T10:00:00Z" }
              as: Analyst
              as_user_id: "${an1_id}"
            - call: "POST /research/inquiry-requests"
              payload: { seat_id: "${seat_id}", topic_route: "CLOUD_COST", question_summary: "Second inquiry", requested_start_utc: "2026-09-06T10:00:00Z", duration_minutes: 45, preparation_notes: "Brief attached." }
              as: SeatHolder
              as_user_id: "${seat_id}"
              captures: { inq_b_id: $.data.id }
          trigger:
            - call: "POST /research/inquiry-requests/${inq_b_id}/schedule"
              payload: { scheduled_start_utc: "2026-08-31T10:00:00Z" }
              as: Analyst
              as_user_id: "${an1_id}"
              captures: { err_temporal_wins: $.data.error_id }
            - call: "POST /research/inquiry-requests/${inq_b_id}/schedule"
              payload: { scheduled_start_utc: "2026-09-06T10:00:00Z" }
              as: Analyst
              as_user_id: "${an1_id}"
              captures: { err_fiscal_only: $.data.error_id }
          assert:
            - "the past-slot attempt returns 400 and err_temporal_wins == ERR_INQUIRY_START_IN_PAST"
            - "err_temporal_wins != ERR_INQUIRY_ALLOWANCE_EXHAUSTED"
            - "the future-slot attempt returns 409 and err_fiscal_only == ERR_INQUIRY_ALLOWANCE_EXHAUSTED"
            - "ClientAccount.${acct_id}.remaining_reserved_units == 0"
            - "InquiryRequest.${inq_b_id}.status == ROUTED"

      - name: state_precedes_safety_on_submit_for_review
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors.ERR_INVALID_STATE
          - errors.ERR_SEPARATION_OF_DUTIES_VIOLATION
          - state_machines.ResearchDocument.DRAFT_to_PEER_REVIEW
        distinguishing_aspect: "Error-category pair state vs business_safety: re-submitting a document that is already in PEER_REVIEW with the lead analyst named as reviewer violates both the state rule (priority 5) and the self-review rule (priority 6), and the state error is the one returned."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Two analysts; document A already in PEER_REVIEW; document B still DRAFT with the same lead analyst."
          setup_api_calls:
            - *k_clock
            - *k_an1
            - *k_an2
            - call: "POST /research/documents"
              payload: { title: "Comparative Matrix: Observability", doc_type: "COMPARATIVE_MATRIX", practice_area: "CIO_TECH", lead_analyst_id: "${an1_id}", embargo_days: 14, peer_reviewer_analyst_id: "" }
              as: Analyst
              as_user_id: "${an1_id}"
              captures: { doc_a_id: $.data.id }
            - call: "POST /research/documents/${doc_a_id}/submit-for-review"
              payload: { peer_reviewer_analyst_id: "${an2_id}" }
              as: Analyst
              as_user_id: "${an1_id}"
            - call: "POST /research/documents"
              payload: { title: "Comparative Matrix: Data Platforms", doc_type: "COMPARATIVE_MATRIX", practice_area: "CIO_TECH", lead_analyst_id: "${an1_id}", embargo_days: 14, peer_reviewer_analyst_id: "" }
              as: Analyst
              as_user_id: "${an1_id}"
              captures: { doc_b_id: $.data.id }
          trigger:
            - call: "POST /research/documents/${doc_a_id}/submit-for-review"
              payload: { peer_reviewer_analyst_id: "${an1_id}" }
              as: Analyst
              as_user_id: "${an1_id}"
              captures: { err_state_wins: $.data.error_id }
            - call: "POST /research/documents/${doc_b_id}/submit-for-review"
              payload: { peer_reviewer_analyst_id: "${an1_id}" }
              as: Analyst
              as_user_id: "${an1_id}"
              captures: { err_safety_only: $.data.error_id }
          assert:
            - "the re-submission returns 409 and err_state_wins == ERR_INVALID_STATE"
            - "err_state_wins != ERR_SEPARATION_OF_DUTIES_VIOLATION"
            - "the self-review submission returns 403 and err_safety_only == ERR_SEPARATION_OF_DUTIES_VIOLATION"
            - "ResearchDocument.${doc_a_id}.editorial_status == PEER_REVIEW and peer_review_round == 1"
            - "ResearchDocument.${doc_b_id}.editorial_status == DRAFT"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: allowance_reservation_boundary_at_zero_units
        grounds:
          - calculations.inquiry_allowance_ledger
          - validations[priority=10]
          - errors.ERR_INQUIRY_ALLOWANCE_EXHAUSTED
          - state_machines.InquiryRequest.ROUTED_to_SCHEDULED
        distinguishing_aspect: "Numeric threshold crossing on the reservation ledger reached through the scheduling endpoint: a remainder of exactly 1 admits the booking and leaves exactly 0, and the next booking at exactly 0 is the one rejected — the boundary is >= 1, not > 1."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Account with inquiry_allowance_total 2; one ACTIVE seat; one analyst."
            - "One inquiry already SCHEDULED, leaving exactly 1 reserved unit free; two more inquiries ROUTED."
          setup_api_calls:
            - *k_clock
            - *k_an1
            - call: "POST /research/clients"
              payload: { legal_name: "Harbor Logistics", industry: "Transport", region: "EMEA", contract_start_utc: "2026-07-01T00:00:00Z", contract_end_utc: "2027-06-30T00:00:00Z", seat_count_contracted: 3, inquiry_allowance_total: 2, reprint_tier: "STANDARD" }
