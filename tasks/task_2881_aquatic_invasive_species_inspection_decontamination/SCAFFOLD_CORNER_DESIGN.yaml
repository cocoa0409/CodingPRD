          - state_machines.InspectionStation.CLOSED_to_CLOSED
          - errors.ERR_INVALID_STATION_STATE
        distinguishing_aspect: "CLOSED is the station's only terminal state: OPEN, SUSPENDED and CLOSED are all rejected with 409 ERR_INVALID_STATION_STATE and the version is not bumped, so a closed station can never be revived."
        test_recipe:
          setup:
