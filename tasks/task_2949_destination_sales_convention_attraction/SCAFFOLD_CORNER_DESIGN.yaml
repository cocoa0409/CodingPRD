          assert:
            - "${bid_status_0} == DRAFT and ${bid_status_1} == DECLINED with ${decline_reason} == RATE_TOO_HIGH"
            - "all three writes: HTTP 409 with error_id ERR_INVALID_BID_STATE - ${err_letter}, ${err_incentive}, ${err_response}"
            - "GET /bid-packages/${bid_id}/support-letters returns total_count == 0 and support_letter_type_count == 0"

  - section: calculations
    instances:
      - name: impact_components_round_half_up_before_the_indirect_multiplier
        claim_type: precision
        grounds:
          - calculations.economic_impact_estimate
          - global_constants.INDIRECT_MULTIPLIER
          - global_constants.LODGING_TAX_RATE
        distinguishing_aspect: "A fixture engineered to land on exact half-cents proves the declared rounding mode: lodging 1000.10 gives a yield of 150.015 which must become 150.02 (half up, not 150.01), and a direct spend of 6320.10 gives 10428.165 which must become 10428.17. Truncation or banker's rounding both produce a cent less on both fields."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; planner CDA; one QUALIFIED opportunity with total_room_nights_requested 10, rate_ceiling_amount 100.01, attendance_estimate 1, exhibit_sqft_requested 1000, arrival 2028-04-10, departure 2028-04-12 (event_nights 2)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /meeting-planners"
              payload: { org_name: "Half Cent Society", contact_email: "chair@halfcent.org" }
              as: BureauAdmin
              captures: { planner_id: $.data.id }
            - call: "POST /opportunities"
              payload: { planner_id: "${planner_id}", event_name: "Half Cent Colloquium", arrival_date: "2028-04-10", departure_date: "2028-04-12", peak_rooms_requested: 5, total_room_nights_requested: 10, attendance_estimate: 1, exhibit_sqft_requested: 1000, rate_ceiling_amount: 100.01 }
              as: SalesManager
              captures: { opp_id: $.data.id }
            - call: "POST /opportunities/${opp_id}/qualify"
              payload: {}
              as: SalesManager
          trigger:
            - call: "POST /economic-impact-estimates"
              payload: { opportunity_id: "${opp_id}", variant: "PROVISIONAL" }
              as: BoardAnalyst
              captures: { basis: $.data.room_nights_basis, lodging: $.data.lodging_spend_amount, delegate: $.data.delegate_spend_amount, exhibitor: $.data.exhibitor_spend_amount, direct: $.data.direct_spend_amount, total: $.data.total_impact_amount, yield_amt: $.data.lodging_tax_yield_amount, variant: $.data.variant, computed: $.data.computed_at }
          assert:
            - "${basis} == 10 and ${lodging} == 1000.10 (10 * 100.01)"
            - "${delegate} == 570.00 (1 attendee * 2 event nights * 285.00) and ${exhibitor} == 4750.00 (1000 * 4.75)"
            - "${direct} == 6320.10 - the three already-rounded components summed"
            - "${total} == 10428.17 - 6320.10 * 1.65 == 10428.165 rounded HALF UP, never 10428.16"
            - "${yield_amt} == 150.02 - 1000.10 * 0.15 == 150.015 rounded HALF UP, never 150.01"
            - "${variant} == PROVISIONAL and ${computed} == 2026-08-01T00:00:00Z (the system clock, not a client value)"

      - name: final_variant_without_any_pickup_returns_estimate_variant_not_available
        claim_type: variant_selection
        grounds:
          - calculations.economic_impact_estimate.variants
          - errors[ERR_ESTIMATE_VARIANT_NOT_AVAILABLE]
        distinguishing_aspect: "The FINAL variant has an input-set precondition the PROVISIONAL one does not: with no PickupRecord anywhere on the opportunity it fails 422 ERR_ESTIMATE_VARIANT_NOT_AVAILABLE, while the PROVISIONAL variant computes happily from the same QUALIFIED row."
        test_recipe:
          setup:
            - "the setup of impact_components_round_half_up_before_the_indirect_multiplier - a QUALIFIED opportunity with no commitments and no pickup rows"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
          trigger:
            - call: "POST /economic-impact-estimates"
              payload: { opportunity_id: "${opp_id}", variant: "FINAL" }
              as: SalesManager
              captures: { err: $.data.error_id }
            - call: "POST /economic-impact-estimates"
              payload: { opportunity_id: "${opp_id}", variant: "PROVISIONAL" }
              as: SalesManager
              captures: { prov_id: $.data.id }
            - call: "GET /opportunities/${opp_id}/economic-impact-estimates?variant=FINAL"
              payload: {}
              as: BoardAnalyst
          assert:
            - "FINAL: HTTP 422 and ${err} == ERR_ESTIMATE_VARIANT_NOT_AVAILABLE"
            - "PROVISIONAL: HTTP 201 with a new id ${prov_id}"
            - "the FINAL-filtered list returns total_count == 0 - the rejected request stored nothing"

      - name: attrition_skips_commitments_that_reported_no_pickup_at_all
        claim_type: input_set_filtering
        grounds:
          - calculations.attrition_settlement.input_set
          - global_constants.ATTRITION_ALLOWANCE_PCT
        distinguishing_aspect: "A commitment with zero PickupRecord rows is skipped entirely rather than charged its full 80% allowance: with Harborview and Bayside reporting pickup but Cityline reporting none, the settlement is 24112.13 + 23599.13 = 47711.26 and Cityline's own attrition_damages_amount stays 0.00 - not the 22444.88 a naive full-shortfall reading would add."
        test_recipe:
          setup:
            - "CANONICAL DEFINITE CHAIN, but the Cityline pickup row is NOT reported: only ${c_a_id} (400 + 250 rooms at 214.33) and ${c_b_id} (180 + 150 rooms at 209.77) have PickupRecords"
          setup_api_calls:
