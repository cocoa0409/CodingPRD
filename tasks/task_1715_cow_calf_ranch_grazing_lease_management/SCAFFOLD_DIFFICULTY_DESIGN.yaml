            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:00Z" }, as: RanchManager }
            - { call: "POST /api/calf-crops/${crop_id}/record-weaning", payload: { weaning_date: "2026-09-15", avg_wean_weight_lbs: 540, avg_wean_age_days: 195, avg_birth_weight_lbs: 80, avg_dam_age_years: 5 }, as: HerdManager }
            - { call: "POST /api/sale-lots", payload: { calf_crop_id: "${crop_id}", ranch_id: "${ranch_id}", lot_class: "STEER", head_count: 40, base_price_cents_per_cwt: 23000, slide_cents_per_lb: 10, base_weight_lbs: 520, shrink_pct: 0.03, precon_claim: "NONE", freight_cents_per_head: 3000, commission_pct: 0.025 }, as: SalesAgent, as_user_id: "u-sale-1", captures: { lot_id: $.data.id } }
            - { call: "POST /api/sale-lots/${lot_id}/offer", payload: {}, as: SalesAgent, as_user_id: "u-sale-1" }
            - { call: "POST /api/sale-lots/${lot_id}/contract", payload: { buyer_name: "CattCo" }, as: SalesAgent, as_user_id: "u-sale-1" }
            - { call: "POST /api/sale-lots/${lot_id}/deliver", payload: { delivered_avg_weight_lbs: 500 }, as: SalesAgent, as_user_id: "u-sale-1" }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "Replacement Heifers", animal_class: "REPLACEMENT_HEIFER", head_count: 0, avg_weight_lbs: 650 }, as: HerdManager, captures: { repl_group: $.data.id } }
          trigger:
            - { call: "POST /api/sale-lots/${lot_id}/settle", payload: {}, as: RanchManager, as_user_id: "u-ranch-9" }
            - { call: "POST /api/calf-crops/${crop_id}/retain-heifers", payload: { head_count: 20, target_herd_group_id: "${repl_group}" }, as: HerdManager }
            - { call: "POST /api/sale-lots", payload: { calf_crop_id: "${crop_id}", ranch_id: "${ranch_id}", lot_class: "STEER", head_count: 1, base_price_cents_per_cwt: 23000, slide_cents_per_lb: 10, base_weight_lbs: 520, shrink_pct: 0.03, precon_claim: "NONE", freight_cents_per_head: 3000, commission_pct: 0.025 }, as: SalesAgent, as_user_id: "u-sale-1", captures: { closed_err: $.data.error_id } }
          assert:
            - "After settle (link 1): CalfCrop.${crop_id}.marketed_steer_head == 40 and reserved_steer_head == 0; net_settlement_cents == 4296652.5 on the lot"
            - "Crop still lifecycle_status == ACTIVE after settle alone (20 heifers unaccounted) — closure is NOT a direct effect of settle"
            - "After retain-heifers (link 2): available_steer_head == 0 AND available_heifer_head == 0 with no non-terminal lots => lifecycle_status == CLOSED; HerdGroup.${repl_group}.head_count == 20 and retained_from_crop_id == ${crop_id}"
            - "Guarded gate: ${closed_err} == ERR_ALREADY_TERMINAL (new SaleLot against a CLOSED crop rejected)"

  # ---------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (two different category pairs)
  # ---------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: resting_closed_pasture_vs_budget_state_wins
        grounds:
          - validations[priority=8]
          - validations[priority=19]
          - errors[ERR_PASTURE_NOT_GRAZEABLE]
          - errors[ERR_AUM_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Pair (state vs business_fiscal): one request violates BOTH the pasture-CLOSED state gate
          (priority 8) and the AUM budget (priority 19, reserved 63.6 > available 10.0) — the state
          error ERR_PASTURE_NOT_GRAZEABLE must win.
        test_recipe:
          setup:
            - "Ranch R; DEEDED pasture P base 50, min_rest_days 45; group G1 20 MATURE_COW @1000"
            - "Assignment A1 on P 2026-05-01..2026-06-30 completed on schedule (consumed 40.0); P then closed via POST /api/pastures/{id}/close (no ACTIVE assignments)"
            - "Group G2: 30 MATURE_COW @1200 (AU 1.06)"
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "Prio Ranch", hq_state: "MT" }, as: RanchManager, captures: { ranch_id: $.data.id } }
            - { call: "POST /api/pastures", payload: { ranch_id: "${ranch_id}", name: "Trap", acreage: 300, tenure: "DEEDED", forage_type: "NATIVE_RANGE", base_capacity_aum: 50, min_rest_days: 45 }, as: RangeManager, captures: { pasture_id: $.data.id } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "Cows A", animal_class: "MATURE_COW", head_count: 20, avg_weight_lbs: 1000 }, as: HerdManager, captures: { g1: $.data.id } }
            - { call: "POST /api/grazing-assignments", payload: { pasture_id: "${pasture_id}", herd_group_id: "${g1}", ranch_id: "${ranch_id}", start_date: "2026-05-01", planned_end_date: "2026-06-30" }, as: RangeManager, captures: { a1: $.data.id } }
            - { call: "POST /api/grazing-assignments/${a1}/complete", payload: { actual_end_date: "2026-06-30" }, as: RangeManager }
            - { call: "POST /api/pastures/${pasture_id}/close", payload: {}, as: RangeManager }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "Cows B", animal_class: "MATURE_COW", head_count: 30, avg_weight_lbs: 1200 }, as: HerdManager, captures: { g2: $.data.id } }
          trigger:
            - { call: "POST /api/grazing-assignments", payload: { pasture_id: "${pasture_id}", herd_group_id: "${g2}", ranch_id: "${ranch_id}", start_date: "2026-09-01", planned_end_date: "2026-10-31" }, as: RangeManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_PASTURE_NOT_GRAZEABLE (state, priority 8) — NOT ERR_AUM_BUDGET_EXCEEDED (fiscal, priority 19), though reserved 63.6 > available 10.0 (50 effective - 40.0 consumed) also fails"
            - "Pasture.${pasture_id}.condition_status == CLOSED and committed_aum == 0.0 (no side effects leaked from the rejected request)"

      - name: segregation_vs_terminal_state_auth_wins
        grounds:
          - validations[priority=3]
          - validations[priority=6]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          Pair (auth vs state): approving an already-APPROVED statement AS the recording user violates
          segregation-of-duties (priority 3) and the state machine (priority 6) in the same request —
          the auth-layer ERR_SEGREGATION_OF_DUTIES must win over ERR_INVALID_STATE_TRANSITION.
        test_recipe:
          setup:
            - "Ranch R; LEASED pasture P base 100; lease L (allotment 50, ACTUAL_USE, min_commit 10, window 2026) ACTIVE"
            - "Statement ST for (L, 2026) created AND issued by RangeManager with X-User-ID 'u-range-1' (recorded_by_user_id == 'u-range-1'); usage 0 -> total 25000.0 (max(0,10) x 2500)"
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "Seg Ranch", hq_state: "ID" }, as: RanchManager, captures: { ranch_id: $.data.id } }
            - { call: "POST /api/pastures", payload: { ranch_id: "${ranch_id}", name: "Meadow", acreage: 400, tenure: "LEASED", forage_type: "IMPROVED", base_capacity_aum: 100 }, as: RangeManager, captures: { pasture_id: $.data.id } }
            - { call: "POST /api/grazing-leases", payload: { ranch_id: "${ranch_id}", pasture_id: "${pasture_id}", lessor_name: "Smith", start_date: "2026-01-01", end_date: "2026-12-31", aum_allotment: 50, rate_per_aum_cents: 2500, minimum_commit_aum: 10, overage_tier1_cap_aum: 10, overage_tier1_rate_cents: 3000, overage_tier2_rate_cents: 3750, settlement_basis: "ACTUAL_USE" }, as: RangeManager, captures: { lease_id: $.data.id } }
            - { call: "POST /api/grazing-leases/${lease_id}/activate", payload: {}, as: RangeManager }
            - { call: "POST /api/lease-statements", payload: { lease_id: "${lease_id}", ranch_id: "${ranch_id}", period_year: 2026 }, as: RangeManager, as_user_id: "u-range-1", captures: { stmt_id: $.data.id } }
            - { call: "POST /api/lease-statements/${stmt_id}/issue", payload: {}, as: RangeManager, as_user_id: "u-range-1" }
          trigger:
            - { call: "POST /api/lease-statements/${stmt_id}/approve", payload: {}, as: RanchManager, as_user_id: "u-range-1", captures: { err1: $.data.error_id } }
            - { call: "POST /api/lease-statements/${stmt_id}/approve", payload: {}, as: RanchManager, as_user_id: "u-ranch-1" }
            - { call: "POST /api/lease-statements/${stmt_id}/approve", payload: {}, as: RanchManager, as_user_id: "u-range-1", captures: { err2: $.data.error_id } }
          assert:
            - "${err1} == ERR_SEGREGATION_OF_DUTIES (recorder cannot approve own statement); statement stays ISSUED"
            - "Approval by a different RanchManager succeeds: statement_status == APPROVED, approved_by_user_id == 'u-ranch-1'"
            - "${err2} == ERR_SEGREGATION_OF_DUTIES — on the already-APPROVED statement the auth rule (pri 3) preempts the state rule (pri 6/7)"

  # ---------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics + endpoints)
  # ---------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: aum_budget_exact_equality_boundary
        grounds:
          - validations[priority=19]
          - calculations.effective_pasture_capacity
          - errors[ERR_AUM_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Metric AUM-quantity on POST /api/grazing-assignments: the budget predicate is INCLUSIVE
          (reserved <= available passes). With available exactly 40.00, a demand of 40.01 (20 cows
          @1001 lbs: AU 1.0003) is rejected while exactly 40.00 (20 cows @1000 lbs: AU 1.0000) succeeds.
        test_recipe:
          setup:
            - "Ranch R (NORMAL); DEEDED pasture P base 100, min_rest 45; groups: GA 30 cows @1000, GB 20 cows @1001, GC 20 cows @1000"
            - "Assignment A (GA) 2026-06-01..2026-07-31 (60 d) reserved 60.00 -> available 40.00; rest gap to 2026-09-15 is 46 days (>= 45)"
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "Edge Ranch", hq_state: "MT" }, as: RanchManager, captures: { ranch_id: $.data.id } }
            - { call: "POST /api/pastures", payload: { ranch_id: "${ranch_id}", name: "Exact", acreage: 500, tenure: "DEEDED", forage_type: "NATIVE_RANGE", base_capacity_aum: 100, min_rest_days: 45 }, as: RangeManager, captures: { pasture_id: $.data.id } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "A", animal_class: "MATURE_COW", head_count: 30, avg_weight_lbs: 1000 }, as: HerdManager, captures: { ga: $.data.id } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "B", animal_class: "MATURE_COW", head_count: 20, avg_weight_lbs: 1001 }, as: HerdManager, captures: { gb: $.data.id } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "C", animal_class: "MATURE_COW", head_count: 20, avg_weight_lbs: 1000 }, as: HerdManager, captures: { gc: $.data.id } }
            - { call: "POST /api/grazing-assignments", payload: { pasture_id: "${pasture_id}", herd_group_id: "${ga}", ranch_id: "${ranch_id}", start_date: "2026-06-01", planned_end_date: "2026-07-31" }, as: RangeManager }
          trigger:
            - { call: "POST /api/grazing-assignments", payload: { pasture_id: "${pasture_id}", herd_group_id: "${gb}", ranch_id: "${ranch_id}", start_date: "2026-09-15", planned_end_date: "2026-11-14" }, as: RangeManager, captures: { err: $.data.error_id } }
            - { call: "POST /api/grazing-assignments", payload: { pasture_id: "${pasture_id}", herd_group_id: "${gc}", ranch_id: "${ranch_id}", start_date: "2026-09-15", planned_end_date: "2026-11-14" }, as: RangeManager, captures: { asg_c: $.data.id } }
          assert:
            - "${err} == ERR_AUM_BUDGET_EXCEEDED (40.01 > 40.00 fails)"
            - "GrazingAssignment.${asg_c}.reserved_aum == 40.0 — exact equality with available passes (<= is inclusive)"
            - "Pasture.${pasture_id}.available_aum == 0.0 and committed_aum == 100.0 afterwards"

      - name: precon_certify_45_day_boundary
        grounds:
          - validations[priority=20]
          - state_machines.CalfCrop.ENROLLED_to_CERTIFIED
          - errors[ERR_PRECON_DAYS_INSUFFICIENT]
        distinguishing_aspect: |
          Metric WHOLE-DAY-COUNT on POST /api/calf-crops/{id}/certify-preconditioning (different metric
          and endpoint than the AUM boundary): weaned 2026-09-15, certification at 2026-10-29 is day 44
          and fails; at 2026-10-30 is exactly day 45 and succeeds (>= is inclusive).
        test_recipe:
          setup:
            - "Ranch R; season S in GESTATION (2 bulls); crop C 100/60 WEANED 2026-09-15, ENROLLED, vaccine rounds 2026-09-20 and 2026-10-10"
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "Day45 Ranch", hq_state: "CO" }, as: RanchManager, captures: { ranch_id: $.data.id } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "Cows", animal_class: "MATURE_COW", head_count: 60, avg_weight_lbs: 1000 }, as: HerdManager, captures: { group_id: $.data.id } }
            - { call: "POST /api/breeding-seasons", payload: { ranch_id: "${ranch_id}", herd_group_id: "${group_id}", season_year: 2026, planned_turnout_date: "2026-04-15", planned_removal_date: "2026-06-15", exposed_head_count: 50 }, as: HerdManager, captures: { season_id: $.data.id } }
            - { call: "POST /api/bulls", payload: { ranch_id: "${ranch_id}", tag: "B601", breed: "ANGUS", birth_year: 2021 }, as: HerdManager, captures: { bull1: $.data.id } }
            - { call: "POST /api/bulls", payload: { ranch_id: "${ranch_id}", tag: "B602", breed: "ANGUS", birth_year: 2020 }, as: HerdManager, captures: { bull2: $.data.id } }
            - { call: "POST /api/bulls/${bull1}/record-bse", payload: { result: "PASSED", exam_date: "2026-03-01", scrotal_cm: 35.0 }, as: HerdManager }
            - { call: "POST /api/bulls/${bull2}/record-bse", payload: { result: "PASSED", exam_date: "2026-03-01", scrotal_cm: 36.0 }, as: HerdManager }
            - { call: "POST /api/bull-turnouts", payload: { bull_id: "${bull1}", breeding_season_id: "${season_id}", ranch_id: "${ranch_id}", turnout_date: "2026-04-15", planned_removal_date: "2026-06-15" }, as: HerdManager, captures: { to1: $.data.id } }
            - { call: "POST /api/bull-turnouts", payload: { bull_id: "${bull2}", breeding_season_id: "${season_id}", ranch_id: "${ranch_id}", turnout_date: "2026-04-15", planned_removal_date: "2026-06-15" }, as: HerdManager, captures: { to2: $.data.id } }
            - { call: "POST /api/bull-turnouts/${to1}/turn-in", payload: {}, as: HerdManager }
            - { call: "POST /api/bull-turnouts/${to2}/turn-in", payload: {}, as: HerdManager }
            - { call: "POST /api/breeding-seasons/${season_id}/begin-breeding", payload: {}, as: HerdManager }
            - { call: "POST /api/bull-turnouts/${to1}/remove", payload: { removal_date: "2026-06-15" }, as: HerdManager }
            - { call: "POST /api/bull-turnouts/${to2}/remove", payload: { removal_date: "2026-06-15" }, as: HerdManager }
            - { call: "POST /api/breeding-seasons/${season_id}/end-breeding", payload: {}, as: HerdManager }
            - { call: "POST /api/calf-crops", payload: { breeding_season_id: "${season_id}", ranch_id: "${ranch_id}", crop_year: 2026, steer_head: 100, heifer_head: 60 }, as: HerdManager, captures: { crop_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:00Z" }, as: RanchManager }
            - { call: "POST /api/calf-crops/${crop_id}/record-weaning", payload: { weaning_date: "2026-09-15", avg_wean_weight_lbs: 560, avg_wean_age_days: 200, avg_birth_weight_lbs: 80, avg_dam_age_years: 5 }, as: HerdManager }
            - { call: "POST /api/calf-crops/${crop_id}/enroll-preconditioning", payload: {}, as: HerdManager }
            - { call: "POST /api/calf-crops/${crop_id}/record-vaccine", payload: { round_number: 1, vaccine_date: "2026-09-20" }, as: HerdManager }
            - { call: "POST /api/calf-crops/${crop_id}/record-vaccine", payload: { round_number: 2, vaccine_date: "2026-10-10" }, as: HerdManager }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-29T00:00:00Z" }, as: RanchManager }
            - { call: "POST /api/calf-crops/${crop_id}/certify-preconditioning", payload: {}, as: HerdManager, captures: { err44: $.data.error_id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-30T00:00:00Z" }, as: RanchManager }
            - { call: "POST /api/calf-crops/${crop_id}/certify-preconditioning", payload: {}, as: HerdManager }
          assert:
            - "${err44} == ERR_PRECON_DAYS_INSUFFICIENT at day 44; precon_status remains ENROLLED"
            - "At exactly day 45 certification succeeds: precon_status == CERTIFIED"

      - name: destock_zero_deficit_no_order
        grounds:
          - calculations.destock_required_reduction
          - state_machines.DroughtAssessment.DRAFT_to_FINALIZED
        distinguishing_aspect: |
          Metric AUM-DEFICIT on POST /api/drought-assessments/{id}/finalize (different boundary
          semantics than the two above): the destock trigger is STRICTLY greater-than-zero —
          demand 100.0 == supply 100.0 yields deficit 0.0 and NO DestockOrder is created.
        test_recipe:
          setup:
            - "Ranch R; pastures P1 base 300, P2 base 200 (DEEDED); single group 100 MATURE_COW @1000 -> demand exactly 100.0/mo"
            - "Assessment with both pastures at 95 pct -> posture NORMAL -> supply 500 x 1.0 / 5 = 100.0"
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "ZeroDef Ranch", hq_state: "MT" }, as: RanchManager, captures: { ranch_id: $.data.id, ranch_v: $.data.version } }
            - { call: "POST /api/pastures", payload: { ranch_id: "${ranch_id}", name: "N", acreage: 1500, tenure: "DEEDED", forage_type: "NATIVE_RANGE", base_capacity_aum: 300 }, as: RangeManager, captures: { p1: $.data.id } }
            - { call: "POST /api/pastures", payload: { ranch_id: "${ranch_id}", name: "S", acreage: 1000, tenure: "DEEDED", forage_type: "NATIVE_RANGE", base_capacity_aum: 200 }, as: RangeManager, captures: { p2: $.data.id } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "Cows", animal_class: "MATURE_COW", head_count: 100, avg_weight_lbs: 1000 }, as: HerdManager, captures: { g1: $.data.id } }
            - { call: "POST /api/drought-assessments", payload: { ranch_id: "${ranch_id}", assessment_date: "2026-08-01", pasture_measurements: [ { pasture_id: "${p1}", production_pct_of_normal: 95 }, { pasture_id: "${p2}", production_pct_of_normal: 95 } ] }, as: RangeManager, captures: { asm_id: $.data.id } }
          trigger:
            - { call: "POST /api/drought-assessments/${asm_id}/finalize", payload: { expected_ranch_version: "${ranch_v}" }, as: RangeManager }
            - { call: "GET /api/destock-orders?ranch_id=${ranch_id}", payload: {}, as: RangeManager }
          assert:
            - "DroughtAssessment.${asm_id}.deficit_aum_per_30d == 0.0 and resulting_posture == NORMAL"
            - "GET /api/destock-orders?ranch_id returns total_count == 0 — deficit == 0 does NOT trigger (strictly-greater rule)"
            - "HerdGroup.${g1}.group_status == ACTIVE (no DESTOCKING flip)"
            - "Ranch.${ranch_id}.drought_posture == NORMAL and version == ${ranch_v} + 1"

  # ---------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (three different entity pairs)
  # ---------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: assignment_requires_active_covering_lease
        grounds:
          - state_machines.GrazingLease (ACTIVE gate note)
          - validations[priority=8]
          - errors[ERR_LEASE_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair GrazingAssignment -> GrazingLease: creating an assignment on a LEASED pasture is
          gated by the lease's lifecycle state — DRAFT rejects, ACTIVE admits, and SUSPENDED rejects
          again after reinstatement-free suspension.
        test_recipe:
          setup:
            - "Ranch R; LEASED pasture P base 200; lease L window 2026-01-01..2026-12-31 allotment 200 (starts DRAFT)"
            - "Group G: 10 MATURE_COW @1000"
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "Gate Ranch", hq_state: "OR" }, as: RanchManager, captures: { ranch_id: $.data.id } }
            - { call: "POST /api/pastures", payload: { ranch_id: "${ranch_id}", name: "Leased Bench", acreage: 800, tenure: "LEASED", forage_type: "NATIVE_RANGE", base_capacity_aum: 200 }, as: RangeManager, captures: { pasture_id: $.data.id } }
            - { call: "POST /api/grazing-leases", payload: { ranch_id: "${ranch_id}", pasture_id: "${pasture_id}", lessor_name: "Taylor", start_date: "2026-01-01", end_date: "2026-12-31", aum_allotment: 200, rate_per_aum_cents: 2400, minimum_commit_aum: 100, overage_tier1_cap_aum: 30, overage_tier1_rate_cents: 2800, overage_tier2_rate_cents: 3500, settlement_basis: "ACTUAL_USE" }, as: RangeManager, captures: { lease_id: $.data.id } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "Cows", animal_class: "MATURE_COW", head_count: 10, avg_weight_lbs: 1000 }, as: HerdManager, captures: { group_id: $.data.id } }
          trigger:
            - { call: "POST /api/grazing-assignments", payload: { pasture_id: "${pasture_id}", herd_group_id: "${group_id}", ranch_id: "${ranch_id}", start_date: "2026-06-01", planned_end_date: "2026-06-30" }, as: RangeManager, captures: { err_draft: $.data.error_id } }
            - { call: "POST /api/grazing-leases/${lease_id}/activate", payload: {}, as: RangeManager }
            - { call: "POST /api/grazing-assignments", payload: { pasture_id: "${pasture_id}", herd_group_id: "${group_id}", ranch_id: "${ranch_id}", start_date: "2026-06-01", planned_end_date: "2026-07-01" }, as: RangeManager, captures: { asg_ok: $.data.id } }
            - { call: "POST /api/grazing-leases/${lease_id}/suspend", payload: {}, as: RangeManager }
            - { call: "POST /api/grazing-assignments", payload: { pasture_id: "${pasture_id}", herd_group_id: "${group_id}", ranch_id: "${ranch_id}", start_date: "2026-08-01", planned_end_date: "2026-08-31" }, as: RangeManager, captures: { err_susp: $.data.error_id } }
          assert:
            - "${err_draft} == ERR_LEASE_NOT_ACTIVE (lease DRAFT blocks)"
            - "GrazingAssignment.${asg_ok}.assignment_status == ACTIVE with reserved_aum == 10.0 (lease ACTIVE admits)"
            - "${err_susp} == ERR_LEASE_NOT_ACTIVE (lease SUSPENDED blocks again — cycle-sensitive gate)"

      - name: begin_breeding_requires_bull_battery
        grounds:
          - state_machines.BreedingSeason.PLANNED_to_BREEDING
          - validations[priority=11]
          - errors[ERR_BULL_BATTERY_INSUFFICIENT]
        distinguishing_aspect: |
          Entity pair BreedingSeason -> Bull: begin-breeding is gated by the per-bull bse_status/life_status
          of turned-in bulls — 2 qualified bulls against a required_bull_count of 3 (exposed 51) rejects;
          qualifying a third bull (retest FAILED -> PASSED) flips the same transition to success.
        test_recipe:
          setup:
            - "Ranch R; group G 60 MATURE_COW @1000; season S exposed 51 -> required_bull_count == ceil(51/25) == 3"
            - "Bulls B1, B2 PASSED (2026-03-01) and TURNED_IN; bull B3 FAILED at BSE and TURNED_IN (does not qualify)"
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "Battery Ranch", hq_state: "MT" }, as: RanchManager, captures: { ranch_id: $.data.id } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "Cows", animal_class: "MATURE_COW", head_count: 60, avg_weight_lbs: 1000 }, as: HerdManager, captures: { group_id: $.data.id } }
            - { call: "POST /api/breeding-seasons", payload: { ranch_id: "${ranch_id}", herd_group_id: "${group_id}", season_year: 2026, planned_turnout_date: "2026-04-15", planned_removal_date: "2026-06-15", exposed_head_count: 51 }, as: HerdManager, captures: { season_id: $.data.id } }
            - { call: "POST /api/bulls", payload: { ranch_id: "${ranch_id}", tag: "B1", breed: "ANGUS", birth_year: 2021 }, as: HerdManager, captures: { b1: $.data.id } }
            - { call: "POST /api/bulls", payload: { ranch_id: "${ranch_id}", tag: "B2", breed: "ANGUS", birth_year: 2021 }, as: HerdManager, captures: { b2: $.data.id } }
            - { call: "POST /api/bulls", payload: { ranch_id: "${ranch_id}", tag: "B3", breed: "ANGUS", birth_year: 2022 }, as: HerdManager, captures: { b3: $.data.id } }
            - { call: "POST /api/bulls/${b1}/record-bse", payload: { result: "PASSED", exam_date: "2026-03-01", scrotal_cm: 35.0 }, as: HerdManager }
            - { call: "POST /api/bulls/${b2}/record-bse", payload: { result: "PASSED", exam_date: "2026-03-01", scrotal_cm: 35.5 }, as: HerdManager }
            - { call: "POST /api/bulls/${b3}/record-bse", payload: { result: "FAILED", exam_date: "2026-03-01", scrotal_cm: 29.0 }, as: HerdManager }
            - { call: "POST /api/bull-turnouts", payload: { bull_id: "${b1}", breeding_season_id: "${season_id}", ranch_id: "${ranch_id}", turnout_date: "2026-04-15", planned_removal_date: "2026-06-15" }, as: HerdManager, captures: { t1: $.data.id } }
            - { call: "POST /api/bull-turnouts", payload: { bull_id: "${b2}", breeding_season_id: "${season_id}", ranch_id: "${ranch_id}", turnout_date: "2026-04-15", planned_removal_date: "2026-06-15" }, as: HerdManager, captures: { t2: $.data.id } }
            - { call: "POST /api/bull-turnouts", payload: { bull_id: "${b3}", breeding_season_id: "${season_id}", ranch_id: "${ranch_id}", turnout_date: "2026-04-15", planned_removal_date: "2026-06-15" }, as: HerdManager, captures: { t3: $.data.id } }
            - { call: "POST /api/bull-turnouts/${t1}/turn-in", payload: {}, as: HerdManager }
            - { call: "POST /api/bull-turnouts/${t2}/turn-in", payload: {}, as: HerdManager }
            - { call: "POST /api/bull-turnouts/${t3}/turn-in", payload: {}, as: HerdManager }
          trigger:
            - { call: "POST /api/breeding-seasons/${season_id}/begin-breeding", payload: {}, as: HerdManager, captures: { err: $.data.error_id } }
            - { call: "POST /api/bulls/${b3}/record-bse", payload: { result: "PASSED", exam_date: "2026-04-20", scrotal_cm: 31.0 }, as: HerdManager }
            - { call: "POST /api/breeding-seasons/${season_id}/begin-breeding", payload: {}, as: HerdManager }
          assert:
            - "${err} == ERR_BULL_BATTERY_INSUFFICIENT — only 2 of 3 TURNED_IN bulls qualified (B3 FAILED does not count)"
            - "BreedingSeason.${season_id}.required_bull_count == 3 (ceil(51/25))"
            - "After B3 retest PASSED: begin-breeding succeeds and season_status == BREEDING"

      - name: assignment_blocked_by_drought_posture
        grounds:
          - validations[priority=10]
          - state_machines.Ranch (posture machine)
          - errors[ERR_DROUGHT_POSTURE_BLOCKS_COMMITMENT]
        distinguishing_aspect: |
          Entity pair GrazingAssignment -> Ranch (different pair than the lease/bull gates): once an
          assessment finalizes the ranch posture to ALERT (with NO deficit, so no destock order
          confound), new grazing commitments are rejected even though pasture budget is ample.
        test_recipe:
          setup:
            - "Ranch R; pastures P1 base 300, P2 base 200 (DEEDED); group G 30 GROWING @800 (demand 22.5/mo)"
            - "Assessment: both pastures 70 pct -> ranch pct 70.0 -> ALERT; supply 500x0.7/5 = 70.0 > 22.5 -> deficit negative -> NO DestockOrder"
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "Alert Ranch", hq_state: "WY" }, as: RanchManager, captures: { ranch_id: $.data.id, ranch_v: $.data.version } }
            - { call: "POST /api/pastures", payload: { ranch_id: "${ranch_id}", name: "N", acreage: 1500, tenure: "DEEDED", forage_type: "NATIVE_RANGE", base_capacity_aum: 300 }, as: RangeManager, captures: { p1: $.data.id } }
            - { call: "POST /api/pastures", payload: { ranch_id: "${ranch_id}", name: "S", acreage: 1000, tenure: "DEEDED", forage_type: "NATIVE_RANGE", base_capacity_aum: 200 }, as: RangeManager, captures: { p2: $.data.id } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "Stockers", animal_class: "GROWING", head_count: 30, avg_weight_lbs: 800 }, as: HerdManager, captures: { g1: $.data.id } }
            - { call: "POST /api/drought-assessments", payload: { ranch_id: "${ranch_id}", assessment_date: "2026-08-01", pasture_measurements: [ { pasture_id: "${p1}", production_pct_of_normal: 70 }, { pasture_id: "${p2}", production_pct_of_normal: 70 } ] }, as: RangeManager, captures: { asm_id: $.data.id } }
          trigger:
            - { call: "POST /api/drought-assessments/${asm_id}/finalize", payload: { expected_ranch_version: "${ranch_v}" }, as: RangeManager }
            - { call: "POST /api/grazing-assignments", payload: { pasture_id: "${p1}", herd_group_id: "${g1}", ranch_id: "${ranch_id}", start_date: "2026-08-05", planned_end_date: "2026-09-04" }, as: RangeManager, captures: { err: $.data.error_id } }
          assert:
            - "DroughtAssessment.${asm_id}.resulting_posture == ALERT and deficit_aum_per_30d == -47.5 (no DestockOrder created — GET /api/destock-orders?ranch_id is empty)"
            - "${err} == ERR_DROUGHT_POSTURE_BLOCKS_COMMITMENT — posture gate fires with no destock-order confound"
            - "Ranch.${ranch_id}.drought_posture == ALERT"

  # ---------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (three different interval semantics)
  # ---------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: pasture_assignment_rest_buffer
        grounds:
          - validations[priority=12]
          - errors[ERR_PASTURE_WINDOW_OVERLAP]
          - errors[ERR_PASTURE_REST_VIOLATION]
        distinguishing_aspect: |
          Resource Pasture with HALF-OPEN windows plus a mandatory rest buffer: overlap is checked
          geometrically ([start,end) intersection), then a separate buffer rule requires
          gap >= min_rest_days (45) from EVERY other non-terminal window on the pasture —
          gap 30 rejects with REST_VIOLATION while gap exactly 45 admits.
        test_recipe:
          setup:
            - "Ranch R; DEEDED pasture P base 500, min_rest_days 45; group G 10 MATURE_COW @1000"
            - "A1 2026-05-01..2026-06-01 completed on 2026-06-01 (resting_until 2026-07-16); A2 ACTIVE 2026-08-20..2026-09-20 (gap 80 from A1 — admitted)"
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "Rest Ranch", hq_state: "MT" }, as: RanchManager, captures: { ranch_id: $.data.id } }
            - { call: "POST /api/pastures", payload: { ranch_id: "${ranch_id}", name: "Rotational 4", acreage: 900, tenure: "DEEDED", forage_type: "NATIVE_RANGE", base_capacity_aum: 500, min_rest_days: 45 }, as: RangeManager, captures: { pasture_id: $.data.id } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "Cows", animal_class: "MATURE_COW", head_count: 10, avg_weight_lbs: 1000 }, as: HerdManager, captures: { g: $.data.id } }
            - { call: "POST /api/grazing-assignments", payload: { pasture_id: "${pasture_id}", herd_group_id: "${g}", ranch_id: "${ranch_id}", start_date: "2026-05-01", planned_end_date: "2026-06-01" }, as: RangeManager, captures: { a1: $.data.id } }
            - { call: "POST /api/grazing-assignments/${a1}/complete", payload: { actual_end_date: "2026-06-01" }, as: RangeManager }
            - { call: "POST /api/grazing-assignments", payload: { pasture_id: "${pasture_id}", herd_group_id: "${g}", ranch_id: "${ranch_id}", start_date: "2026-08-20", planned_end_date: "2026-09-20" }, as: RangeManager, captures: { a2: $.data.id } }
          trigger:
            - { call: "POST /api/grazing-assignments", payload: { pasture_id: "${pasture_id}", herd_group_id: "${g}", ranch_id: "${ranch_id}", start_date: "2026-09-01", planned_end_date: "2026-10-01" }, as: RangeManager, captures: { err_overlap: $.data.error_id } }
            - { call: "POST /api/grazing-assignments", payload: { pasture_id: "${pasture_id}", herd_group_id: "${g}", ranch_id: "${ranch_id}", start_date: "2026-07-01", planned_end_date: "2026-07-10" }, as: RangeManager, captures: { err_rest: $.data.error_id } }
            - { call: "POST /api/grazing-assignments", payload: { pasture_id: "${pasture_id}", herd_group_id: "${g}", ranch_id: "${ranch_id}", start_date: "2026-11-04", planned_end_date: "2026-11-14" }, as: RangeManager, captures: { a3: $.data.id } }
          assert:
            - "${err_overlap} == ERR_PASTURE_WINDOW_OVERLAP (09-01..10-01 intersects A2's 08-20..09-20 half-open window)"
            - "${err_rest} == ERR_PASTURE_REST_VIOLATION (07-01 is only 30 days after A1's 06-01 grazed end; also 41 days before A2's 08-20 start — gap < 45 in both directions)"
            - "GrazingAssignment.${a3} created: start 2026-11-04 is exactly 45 days after A2's 09-20 end — buffer >= min_rest_days is inclusive"
            - "Pasture.${pasture_id}.committed_aum == 13.66 afterwards (A2 10.33 + A3 3.33), consumed_total_aum == 10.33 (A1), available_aum == 476.01"

      - name: bull_turnout_closed_interval_turnaround
        grounds:
          - validations[priority=13]
          - errors[ERR_BULL_TURNOUT_OVERLAP]
          - errors[ERR_BULL_TURNAROUND_TOO_SHORT]
        distinguishing_aspect: |
          Resource Bull with CLOSED intervals plus a fixed turnaround gap (different semantics than the
          pasture's half-open+buffer): a second turnout inside [2026-04-15, 2026-06-15] rejects as
          OVERLAP; turnout on 2026-06-21 (6 days after removal) rejects as TURNAROUND_TOO_SHORT;
          2026-06-22 (exactly 7 days) is admitted — closed-interval adjacency arithmetic.
        test_recipe:
          setup:
            - "Ranch R; group G 60 MATURE_COW @1000; season S1 window 2026-04-15..2026-06-15 (exposed 25 -> required 1); season S2 window 2026-06-21..2026-08-15 (exposed 25)"
            - "Bull B1 with turnout T1 on S1: 2026-04-15..2026-06-15 (SCHEDULED)"
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "Turn Ranch", hq_state: "CO" }, as: RanchManager, captures: { ranch_id: $.data.id } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "Cows", animal_class: "MATURE_COW", head_count: 60, avg_weight_lbs: 1000 }, as: HerdManager, captures: { g: $.data.id } }
            - { call: "POST /api/breeding-seasons", payload: { ranch_id: "${ranch_id}", herd_group_id: "${g}", season_year: 2026, planned_turnout_date: "2026-04-15", planned_removal_date: "2026-06-15", exposed_head_count: 25 }, as: HerdManager, captures: { s1: $.data.id } }
            - { call: "POST /api/breeding-seasons", payload: { ranch_id: "${ranch_id}", herd_group_id: "${g}", season_year: 2026, planned_turnout_date: "2026-06-21", planned_removal_date: "2026-08-15", exposed_head_count: 25 }, as: HerdManager, captures: { s2: $.data.id } }
            - { call: "POST /api/bulls", payload: { ranch_id: "${ranch_id}", tag: "B777", breed: "CHAR", birth_year: 2020 }, as: HerdManager, captures: { b1: $.data.id } }
            - { call: "POST /api/bull-turnouts", payload: { bull_id: "${b1}", breeding_season_id: "${s1}", ranch_id: "${ranch_id}", turnout_date: "2026-04-15", planned_removal_date: "2026-06-15" }, as: HerdManager, captures: { t1: $.data.id } }
          trigger:
            - { call: "POST /api/bull-turnouts", payload: { bull_id: "${b1}", breeding_season_id: "${s1}", ranch_id: "${ranch_id}", turnout_date: "2026-06-10", planned_removal_date: "2026-06-15" }, as: HerdManager, captures: { err_overlap: $.data.error_id } }
            - { call: "POST /api/bull-turnouts", payload: { bull_id: "${b1}", breeding_season_id: "${s2}", ranch_id: "${ranch_id}", turnout_date: "2026-06-21", planned_removal_date: "2026-06-25" }, as: HerdManager, captures: { err_gap: $.data.error_id } }
            - { call: "POST /api/bull-turnouts", payload: { bull_id: "${b1}", breeding_season_id: "${s2}", ranch_id: "${ranch_id}", turnout_date: "2026-06-22", planned_removal_date: "2026-06-25" }, as: HerdManager, captures: { t_ok: $.data.id } }
          assert:
            - "${err_overlap} == ERR_BULL_TURNOUT_OVERLAP (06-10..06-15 intersects T1's closed interval)"
            - "${err_gap} == ERR_BULL_TURNAROUND_TOO_SHORT (6 days < MIN_BULL_TURNAROUND_DAYS 7)"
            - "BullTurnout.${t_ok} created with turnout_status == SCHEDULED — gap of exactly 7 days passes (>= is inclusive)"

      - name: lease_allotment_aggregate_capacity
        grounds:
          - validations[priority=15]
          - errors[ERR_LEASE_CAPACITY_EXCEEDED]
          - state_machines.GrazingLease.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          Resource Pasture under AGGREGATE-CAPACITY semantics (different from both interval schemes
          above): leases on one pasture may overlap in time without any geometric exclusion — only the
          SUM of ACTIVE allotments is constrained (<= base_capacity_aum, inclusive). 60 + 40 == 100
          passes; adding 1 more rejects.
        test_recipe:
          setup:
            - "Ranch R; LEASED pasture P base_capacity_aum 100; three leases with fully overlapping 2026 windows: L1 allotment 60, L2 allotment 40, L3 allotment 1"
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "Split Ranch", hq_state: "ID" }, as: RanchManager, captures: { ranch_id: $.data.id } }
            - { call: "POST /api/pastures", payload: { ranch_id: "${ranch_id}", name: "Split Section", acreage: 640, tenure: "LEASED", forage_type: "NATIVE_RANGE", base_capacity_aum: 100 }, as: RangeManager, captures: { pasture_id: $.data.id } }
            - { call: "POST /api/grazing-leases", payload: { ranch_id: "${ranch_id}", pasture_id: "${pasture_id}", lessor_name: "L1", start_date: "2026-01-01", end_date: "2026-12-31", aum_allotment: 60, rate_per_aum_cents: 2400, minimum_commit_aum: 40, overage_tier1_cap_aum: 10, overage_tier1_rate_cents: 2800, overage_tier2_rate_cents: 3500, settlement_basis: "ACTUAL_USE" }, as: RangeManager, captures: { l1: $.data.id } }
            - { call: "POST /api/grazing-leases", payload: { ranch_id: "${ranch_id}", pasture_id: "${pasture_id}", lessor_name: "L2", start_date: "2026-01-01", end_date: "2026-12-31", aum_allotment: 40, rate_per_aum_cents: 2400, minimum_commit_aum: 20, overage_tier1_cap_aum: 10, overage_tier1_rate_cents: 2800, overage_tier2_rate_cents: 3500, settlement_basis: "ACTUAL_USE" }, as: RangeManager, captures: { l2: $.data.id } }
            - { call: "POST /api/grazing-leases", payload: { ranch_id: "${ranch_id}", pasture_id: "${pasture_id}", lessor_name: "L3", start_date: "2026-01-01", end_date: "2026-12-31", aum_allotment: 1, rate_per_aum_cents: 2400, minimum_commit_aum: 0, overage_tier1_cap_aum: 1, overage_tier1_rate_cents: 2800, overage_tier2_rate_cents: 3500, settlement_basis: "ACTUAL_USE" }, as: RangeManager, captures: { l3: $.data.id } }
          trigger:
            - { call: "POST /api/grazing-leases/${l1}/activate", payload: {}, as: RangeManager }
            - { call: "POST /api/grazing-leases/${l2}/activate", payload: {}, as: RangeManager }
            - { call: "POST /api/grazing-leases/${l3}/activate", payload: {}, as: RangeManager, captures: { err: $.data.error_id } }
          assert:
            - "L1 and L2 both reach ACTIVE despite fully overlapping windows — aggregate-capacity, not interval exclusion (60 + 40 == 100 <= 100, inclusive)"
            - "${err} == ERR_LEASE_CAPACITY_EXCEEDED (101 > 100) and L3 remains DRAFT"

  # ---------------------------------------------------------------------
  # Rule 9 — compensating_invariant (two different conserved quantities)
  # ---------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: aum_reserve_cancel_conservation
        grounds:
          - calculations.effective_pasture_capacity
          - state_machines.GrazingAssignment.ACTIVE_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity FORAGE AUM: invariant available_aum + committed_aum + consumed_total_aum
          == effective_capacity_aum at every step. The forward action (create, -40.00 available) paired
          with its compensating action (cancel before start) restores available to EXACTLY 200.0 with
          zero drift — and the consumed-consumption variant (shorten at day 14) releases exactly
          30.67, leaving available 190.67.
        test_recipe:
          setup:
            - "Ranch R; DEEDED pasture P base 200 (effective 200.0 at NORMAL); group G 20 MATURE_COW @1000 (daily demand 0.6667 AUM)"
            - "Clock pinned at 2026-05-01 so the 2026-06-01 window can be cancelled (current_date < start_date)"
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "Conserve Ranch", hq_state: "MT" }, as: RanchManager, captures: { ranch_id: $.data.id } }
            - { call: "POST /api/pastures", payload: { ranch_id: "${ranch_id}", name: "Ledger", acreage: 900, tenure: "DEEDED", forage_type: "NATIVE_RANGE", base_capacity_aum: 200 }, as: RangeManager, captures: { pasture_id: $.data.id } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "Cows", animal_class: "MATURE_COW", head_count: 20, avg_weight_lbs: 1000 }, as: HerdManager, captures: { g: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: RanchManager }
          trigger:
            - { call: "POST /api/grazing-assignments", payload: { pasture_id: "${pasture_id}", herd_group_id: "${g}", ranch_id: "${ranch_id}", start_date: "2026-06-01", planned_end_date: "2026-07-31" }, as: RangeManager, captures: { a1: $.data.id } }
            - { call: "POST /api/grazing-assignments/${a1}/cancel", payload: {}, as: RangeManager }
            - { call: "POST /api/grazing-assignments", payload: { pasture_id: "${pasture_id}", herd_group_id: "${g}", ranch_id: "${ranch_id}", start_date: "2026-06-01", planned_end_date: "2026-07-31" }, as: RangeManager, captures: { a2: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: RanchManager }
            - { call: "POST /api/grazing-assignments/${a2}/complete", payload: { actual_end_date: "2026-06-15" }, as: RangeManager }
          assert:
            - "After create A1: Pasture.${pasture_id}.available_aum == 160.0 and committed_aum == 40.0 (invariant: 160 + 40 + 0 == 200)"
            - "After cancel A1: available_aum == 200.0, committed_aum == 0.0, consumed_total_aum == 0.0 — forward+compensating pair restores the conserved total exactly"
            - "After shorten A2 at day 14: consumed_aum == 9.33 (20 x 1.0 x 14/30); available_aum == 190.67 (200 - 9.33) — only the UNUSED 30.67 returns"
            - "GrazingAssignment.${a2}.assignment_status == SHORTENED; Pasture.${pasture_id}.resting_until == 2026-07-30 (2026-06-15 + 45)"

      - name: heifer_retain_unretain_head_conservation
        grounds:
          - entities.CalfCrop.fields.retained_heifer_head
          - entities.HerdGroup.fields.head_count
          - validations[priority=18]
        distinguishing_aspect: |
          Conserved quantity ANIMAL HEAD (different quantity than AUM): retention moves head between
          the crop pool and the herd group without changing the system total —
          group.head_count + crop.available_heifer_head == 70 before, between, and after the
          retain-25 / unretain-10 pair.
        test_recipe:
          setup:
            - "Ranch R; season S in GESTATION (2 bulls); crop C: 40 steers / 60 heifers; group H REPLACEMENT_HEIFER with head_count 10"
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "Retain Ranch", hq_state: "WY" }, as: RanchManager, captures: { ranch_id: $.data.id } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "Cows", animal_class: "MATURE_COW", head_count: 60, avg_weight_lbs: 1000 }, as: HerdManager, captures: { group_id: $.data.id } }
            - { call: "POST /api/breeding-seasons", payload: { ranch_id: "${ranch_id}", herd_group_id: "${group_id}", season_year: 2026, planned_turnout_date: "2026-04-15", planned_removal_date: "2026-06-15", exposed_head_count: 50 }, as: HerdManager, captures: { season_id: $.data.id } }
            - { call: "POST /api/bulls", payload: { ranch_id: "${ranch_id}", tag: "B901", breed: "ANGUS", birth_year: 2021 }, as: HerdManager, captures: { bull1: $.data.id } }
            - { call: "POST /api/bulls", payload: { ranch_id: "${ranch_id}", tag: "B902", breed: "ANGUS", birth_year: 2020 }, as: HerdManager, captures: { bull2: $.data.id } }
            - { call: "POST /api/bulls/${bull1}/record-bse", payload: { result: "PASSED", exam_date: "2026-03-01", scrotal_cm: 35.0 }, as: HerdManager }
            - { call: "POST /api/bulls/${bull2}/record-bse", payload: { result: "PASSED", exam_date: "2026-03-01", scrotal_cm: 36.0 }, as: HerdManager }
            - { call: "POST /api/bull-turnouts", payload: { bull_id: "${bull1}", breeding_season_id: "${season_id}", ranch_id: "${ranch_id}", turnout_date: "2026-04-15", planned_removal_date: "2026-06-15" }, as: HerdManager, captures: { to1: $.data.id } }
            - { call: "POST /api/bull-turnouts", payload: { bull_id: "${bull2}", breeding_season_id: "${season_id}", ranch_id: "${ranch_id}", turnout_date: "2026-04-15", planned_removal_date: "2026-06-15" }, as: HerdManager, captures: { to2: $.data.id } }
            - { call: "POST /api/bull-turnouts/${to1}/turn-in", payload: {}, as: HerdManager }
            - { call: "POST /api/bull-turnouts/${to2}/turn-in", payload: {}, as: HerdManager }
            - { call: "POST /api/breeding-seasons/${season_id}/begin-breeding", payload: {}, as: HerdManager }
            - { call: "POST /api/bull-turnouts/${to1}/remove", payload: { removal_date: "2026-06-15" }, as: HerdManager }
            - { call: "POST /api/bull-turnouts/${to2}/remove", payload: { removal_date: "2026-06-15" }, as: HerdManager }
            - { call: "POST /api/breeding-seasons/${season_id}/end-breeding", payload: {}, as: HerdManager }
            - { call: "POST /api/calf-crops", payload: { breeding_season_id: "${season_id}", ranch_id: "${ranch_id}", crop_year: 2026, steer_head: 40, heifer_head: 60 }, as: HerdManager, captures: { crop_id: $.data.id } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "Replacement Heifers", animal_class: "REPLACEMENT_HEIFER", head_count: 10, avg_weight_lbs: 650 }, as: HerdManager, captures: { h: $.data.id } }
          trigger:
            - { call: "POST /api/calf-crops/${crop_id}/retain-heifers", payload: { head_count: 25, target_herd_group_id: "${h}" }, as: HerdManager }
            - { call: "POST /api/calf-crops/${crop_id}/unretain-heifers", payload: { head_count: 10, source_herd_group_id: "${h}" }, as: HerdManager }
          assert:
            - "Initially: HerdGroup.${h}.head_count == 10 and CalfCrop.${crop_id}.available_heifer_head == 60 (total tracked heifers 70)"
            - "After retain 25: group head_count == 35, crop.retained_heifer_head == 25, available_heifer_head == 35 (35 + 35 == 70 — conserved)"
            - "HerdGroup.${h}.retained_from_crop_id == ${crop_id}"
            - "After unretain 10: group head_count == 25, crop.retained_heifer_head == 15, available_heifer_head == 45 (25 + 45 == 70 — compensation leaves zero drift)"
