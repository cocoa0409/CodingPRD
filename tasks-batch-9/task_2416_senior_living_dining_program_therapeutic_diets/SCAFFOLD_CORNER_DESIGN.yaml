          - validations[priority=10]
          - errors[id=ERR_STALE_VERSION]
        distinguishing_aspect: "The stale-version refusal is decided on Resident.version even though the write creates a DietOrder, and the version advances on writes the client never touched (the dining-status changes), so a client holding the create-time version must re-read before ordering."
        test_recipe:
          setup:
            - "One community and one resident created at version 1."
