      - name: a_machine_taken_down_refuses_to_start_its_scheduled_run
        claim_type: conditional_action
        grounds:
          - endpoints.PATCH_paper_machines_id_status
          - validations.priority_31
          - state_machines.ProductionRun.SCHEDULED_to_RUNNING
          - entities.PaperMachine.fields.status
        distinguishing_aspect: "The run itself is perfectly SCHEDULED and the pulp is sufficient; only PaperMachine.status == DOWN blocks it, so the start returns ERR_RUN_INVALID_STATE and PulpBatch.consumed_tons stays 0.000. Returning the machine to RUNNABLE with the version read after the DOWN patch is what makes the identical call succeed, which is the conditional half of the claim."
        test_recipe:
          setup: ["The spine with an APPROVED 18.000-ton batch and a SCHEDULED run on PM1 reserving 15.000 tons; PM1 has then been patched to DOWN using the version read after the run was scheduled."]
