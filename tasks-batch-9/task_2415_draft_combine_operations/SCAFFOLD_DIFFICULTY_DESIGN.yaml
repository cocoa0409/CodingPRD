              payload: { draft_cycle_id: "${cycle_id}", club_code: "ELM", market_name: "Elmwood", prior_season_win_pct: 0.500, strength_of_schedule: 0.470, head_to_head_rank: 5, rookie_pool_total_cents: 896721432, lottery_combinations: 75 }
              as: LeagueDraftAdmin
              captures: { elm_id: $.data.id }
            - call: "POST /draft-ops/clubs"
              payload: { draft_cycle_id: "${cycle_id}", club_code: "HAR", market_name: "Harbor City", prior_season_win_pct: 0.125, strength_of_schedule: 0.520, head_to_head_rank: 1, rookie_pool_total_cents: 500000000, lottery_combinations: 140 }
              as: LeagueDraftAdmin
              captures: { har_id: $.data.id }
