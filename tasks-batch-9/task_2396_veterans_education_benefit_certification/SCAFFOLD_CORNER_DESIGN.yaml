              as: SupervisorySCO
              as_user_id: "${sup1}"
              captures: { term1: $.data.id }
            - call: "POST /veteran-students"
              payload: { student_number: "V-1001", full_name: "Alex Rivera", chapter: "CH33", benefit_level_pct: 100, entitlement_days_granted: 1080, delimiting_date: "2030-06-30" }
              as: SchoolCertifyingOfficial
              as_user_id: "${sco1}"
              captures: { stu1: $.data.id }
            - call: "POST /enrollment-certifications"
              payload: { student_id: "${stu1}", term_id: "${term1}", program_id: "${prog1}", credit_hours_total: 12, credit_hours_online: 0, term_start_certified: "2026-08-24", term_end_certified: "2026-12-11" }
              as: SchoolCertifyingOfficial
              as_user_id: "${sco1}"
              captures: { cert1: $.data.id, cert1_v: $.data.version }
          trigger:
            - call: "POST /academic-terms"
              payload: { term_code: "SP2027", academic_year: "2026-2027", term_type: "SPRING" }
              as: BursarOfficer
              captures: { e_role: $.data.error_id }
            - call: "POST /enrollment-certifications"
              payload: { student_id: "00000000-0000-0000-0000-0000000000c1", term_id: "${term1}", program_id: "${prog1}", credit_hours_online: 0, term_start_certified: "2026-08-24", term_end_certified: "2026-12-11" }
              as: SchoolCertifyingOfficial
              as_user_id: "${sco1}"
              captures: { e_body: $.data.error_id }
            - call: "POST /veteran-students"
              payload: { student_number: "V-1001", full_name: "Alex Rivera Again", chapter: "CH33", benefit_level_pct: 100, entitlement_days_granted: 1080, delimiting_date: "2030-06-30" }
