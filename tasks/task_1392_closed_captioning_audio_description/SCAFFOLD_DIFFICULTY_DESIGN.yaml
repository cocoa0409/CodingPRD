# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Closed Captioning & Audio Description Services
# 9 Difficulty Rules × 2 instances = 18 instances.
# All numeric literals were pre-computed by executing the §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: sla_clock_basis_business_vs_wall
        grounds:
          - calculations.sla_turnaround_window
          - state_machines.WorkOrder.QUOTED_to_CONFIRMED
        distinguishing_aspect: |
          WorkOrder-domain dual variant: two orders with identical duration (60 min)
          confirmed at the identical instant diverge purely because the tier selects
          the clock basis — EXPRESS consumes business hours (Mon-Fri 09:00-17:00 UTC)
          and lands at 2026-08-11T10:00:00Z, while RUSH consumes wall-clock hours and
          lands at 2026-08-04T16:00:00Z.
        test_recipe:
          setup:
            - "Clock pinned at Monday 2026-08-03T10:00:00Z"
            - "One FCC client; two CLEARED 3600-second media assets"
            - "Work order A tier EXPRESS confirmed at the pinned instant; work order B tier RUSH confirmed at the pinned instant"
          setup_api_calls:
            - call: "POST /caption-ad/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OperationsManager
            - call: "POST /caption-ad/clients"
              payload: { name: "FCC Client", compliance_standard: "FCC_BROADCAST" }
              as: OperationsManager
              captures: { c_id: $.data.id }
            - call: "POST /caption-ad/media-assets"
              payload: { client_id: "${c_id}", title: "Prog A", media_kind: "FILE_BASED", duration_seconds: 3600, frame_rate: "FPS_29_97_DF" }
              as: IntakeCoordinator
              captures: { m_a: $.data.id }
            - call: "POST /caption-ad/media-assets/${m_a}/begin-inspection"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/media-assets/${m_a}/clear"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/media-assets"
              payload: { client_id: "${c_id}", title: "Prog B", media_kind: "FILE_BASED", duration_seconds: 3600, frame_rate: "FPS_29_97_DF" }
              as: IntakeCoordinator
              captures: { m_b: $.data.id }
            - call: "POST /caption-ad/media-assets/${m_b}/begin-inspection"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/media-assets/${m_b}/clear"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/work-orders"
              payload: { client_id: "${c_id}", media_asset_id: "${m_a}", service_type: "CAPTIONS", turnaround_tier: "EXPRESS", language: "en-US" }
              as: IntakeCoordinator
              captures: { wo_a: $.data.id }
            - call: "POST /caption-ad/work-orders/${wo_a}/quote"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/work-orders"
              payload: { client_id: "${c_id}", media_asset_id: "${m_b}", service_type: "CAPTIONS", turnaround_tier: "RUSH", language: "en-US" }
              as: IntakeCoordinator
              captures: { wo_b: $.data.id }
            - call: "POST /caption-ad/work-orders/${wo_b}/quote"
              payload: {}
              as: IntakeCoordinator
          trigger:
            - call: "POST /caption-ad/work-orders/${wo_a}/confirm"
              payload: {}
              as: ClientContact
              as_user_id: "${c_id}"
            - call: "POST /caption-ad/work-orders/${wo_b}/confirm"
              payload: {}
              as: ClientContact
              as_user_id: "${c_id}"
          assert:
            - "WorkOrder.${wo_a}.due_at == '2026-08-11T10:00:00Z' (48 business hours from Mon 10:00: 7h Mon + 8h Tue-Mon + 1h final Tue)"
            - "WorkOrder.${wo_b}.due_at == '2026-08-04T16:00:00Z' (24 + 6*ceil(30/30) = 30 wall hours)"
            - "WorkOrder.${wo_a}.due_at != WorkOrder.${wo_b}.due_at — identical inputs, tier-selected clock basis alone diverges"

      - name: accuracy_mode_full_vs_sampled
        grounds:
          - calculations.caption_accuracy
          - state_machines.CaptionTrack.QC_QUEUED_to_QC_PASSED
          - state_machines.CaptionTrack.QC_QUEUED_to_QC_FAILED
        distinguishing_aspect: |
          QC-domain dual variant (different entity domain from the WorkOrder SLA
          variant): two twin INTERNAL-client tracks with the same error profile are
          scored FULL_REVIEW (denominator 10000 -> 95.10, PASS) vs SAMPLED_REVIEW
          (denominator 2000 -> 93.55, FAIL) — the review_mode variant alone flips the
          track's QC outcome.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T10:00:00Z"
            - "INTERNAL client with two CLEARED assets and two work orders IN_PRODUCTION, each with a caption track in QC_QUEUED authored by editor-1"
          setup_api_calls:
            - call: "POST /caption-ad/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OperationsManager
            - call: "POST /caption-ad/clients"
              payload: { name: "Internal Client", compliance_standard: "INTERNAL" }
              as: OperationsManager
              captures: { c_id: $.data.id }
            - call: "POST /caption-ad/media-assets"
              payload: { client_id: "${c_id}", title: "Prog A", media_kind: "FILE_BASED", duration_seconds: 3600, frame_rate: "FPS_30" }
              as: IntakeCoordinator
              captures: { m_a: $.data.id }
            - call: "POST /caption-ad/media-assets/${m_a}/begin-inspection"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/media-assets/${m_a}/clear"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/media-assets"
              payload: { client_id: "${c_id}", title: "Prog B", media_kind: "FILE_BASED", duration_seconds: 3600, frame_rate: "FPS_30" }
              as: IntakeCoordinator
              captures: { m_b: $.data.id }
            - call: "POST /caption-ad/media-assets/${m_b}/begin-inspection"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/media-assets/${m_b}/clear"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/work-orders"
              payload: { client_id: "${c_id}", media_asset_id: "${m_a}", service_type: "CAPTIONS", turnaround_tier: "STANDARD", language: "en-US" }
              as: IntakeCoordinator
              captures: { wo_a: $.data.id }
            - call: "POST /caption-ad/work-orders/${wo_a}/quote"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/work-orders/${wo_a}/confirm"
              payload: {}
              as: ClientContact
              as_user_id: "${c_id}"
            - call: "POST /caption-ad/work-orders/${wo_a}/start-production"
              payload: {}
              as: CaptionEditor
              captures: { wo_a_v: $.data.version }
            - call: "POST /caption-ad/work-orders/${wo_a}/caption-tracks"
              payload: { language: "en-US", caption_format: "SRT", speaker_id_style: "CHEVRON", expected_work_order_version: "${wo_a_v}" }
              as: CaptionEditor
              as_user_id: "editor-1"
              captures: { t_a: $.data.id }
            - call: "POST /caption-ad/caption-tracks/${t_a}/submit-review"
              payload: {}
              as: CaptionEditor
              as_user_id: "editor-1"
            - call: "POST /caption-ad/caption-tracks/${t_a}/enqueue-qc"
              payload: {}
              as: CaptionEditor
              as_user_id: "editor-1"
            - call: "POST /caption-ad/work-orders"
              payload: { client_id: "${c_id}", media_asset_id: "${m_b}", service_type: "CAPTIONS", turnaround_tier: "STANDARD", language: "en-US" }
              as: IntakeCoordinator
              captures: { wo_b: $.data.id }
            - call: "POST /caption-ad/work-orders/${wo_b}/quote"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/work-orders/${wo_b}/confirm"
              payload: {}
              as: ClientContact
              as_user_id: "${c_id}"
            - call: "POST /caption-ad/work-orders/${wo_b}/start-production"
              payload: {}
              as: CaptionEditor
              captures: { wo_b_v: $.data.version }
            - call: "POST /caption-ad/work-orders/${wo_b}/caption-tracks"
              payload: { language: "en-US", caption_format: "SRT", speaker_id_style: "CHEVRON", expected_work_order_version: "${wo_b_v}" }
              as: CaptionEditor
              as_user_id: "editor-1"
              captures: { t_b: $.data.id }
            - call: "POST /caption-ad/caption-tracks/${t_b}/submit-review"
              payload: {}
              as: CaptionEditor
              as_user_id: "editor-1"
            - call: "POST /caption-ad/caption-tracks/${t_b}/enqueue-qc"
              payload: {}
              as: CaptionEditor
              as_user_id: "editor-1"
          trigger:
            - call: "POST /caption-ad/caption-tracks/${t_a}/qc-reviews"
              payload: { review_mode: "FULL_REVIEW", total_words: 10000, minor_errors: 450, major_errors: 10, critical_errors: 1 }
              as: QCSpecialist
              as_user_id: "qc-1"
              captures: { acc_full: $.data.accuracy_pct, out_full: $.data.outcome }
            - call: "POST /caption-ad/caption-tracks/${t_b}/qc-reviews"
              payload: { review_mode: "SAMPLED_REVIEW", total_words: 10000, sampled_words: 2000, minor_errors: 110, major_errors: 3, critical_errors: 1 }
              as: QCSpecialist
              as_user_id: "qc-1"
              captures: { acc_samp: $.data.accuracy_pct, out_samp: $.data.outcome }
          assert:
            - "QCReview(full).accuracy_pct == 95.10 (weighted 490/10000) and outcome == PASS (>= 95.00 INTERNAL threshold)"
            - "QCReview(sampled).accuracy_pct == 93.55 (weighted 129/2000) and outcome == FAIL"
            - "CaptionTrack.${t_a}.track_status == QC_PASSED; CaptionTrack.${t_b}.track_status == QC_FAILED with qc_attempts == 1"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes: (c) evaluation order, (b) nested rounding)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: quote_evaluation_order_pinned
        grounds:
          - calculations.work_order_quote
          - state_machines.WorkOrder.DRAFT_to_QUOTED
        distinguishing_aspect: |
          Mode (c): the quote's circular-looking dependency is pinned to multiply
          before discounting with ytd read pre-order — a 91-minute EXPRESS order
          from a client with ytd 5000 yields exactly 55969 cents, while the reversed
          order (discount before multiplier) yields 55970 and average-rate brackets
          yield yet another value.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T10:00:00Z"
            - "SECTION_508 client whose ytd_completed_minutes is exactly 5000 from one delivered STANDARD order over a 300000-second asset"
            - "Second CLEARED asset of 5460 seconds (91 minutes); new EXPRESS order in DRAFT"
          setup_api_calls:
            - call: "POST /caption-ad/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OperationsManager
            - call: "POST /caption-ad/clients"
              payload: { name: "508 Client", compliance_standard: "SECTION_508" }
              as: OperationsManager
              captures: { c_id: $.data.id }
            - call: "POST /caption-ad/media-assets"
              payload: { client_id: "${c_id}", title: "Long Program", media_kind: "FILE_BASED", duration_seconds: 300000, frame_rate: "FPS_24" }
              as: IntakeCoordinator
              captures: { m_1: $.data.id }
            - call: "POST /caption-ad/media-assets/${m_1}/begin-inspection"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/media-assets/${m_1}/clear"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/work-orders"
              payload: { client_id: "${c_id}", media_asset_id: "${m_1}", service_type: "CAPTIONS", turnaround_tier: "STANDARD", language: "en-US" }
              as: IntakeCoordinator
              captures: { wo_1: $.data.id }
            - call: "POST /caption-ad/work-orders/${wo_1}/quote"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/work-orders/${wo_1}/confirm"
              payload: {}
              as: ClientContact
              as_user_id: "${c_id}"
            - call: "POST /caption-ad/work-orders/${wo_1}/start-production"
              payload: {}
              as: CaptionEditor
              captures: { wo_1_v: $.data.version }
            - call: "POST /caption-ad/work-orders/${wo_1}/caption-tracks"
              payload: { language: "en-US", caption_format: "SRT", speaker_id_style: "DASH", expected_work_order_version: "${wo_1_v}" }
              as: CaptionEditor
              as_user_id: "editor-1"
              captures: { t_1: $.data.id }
            - call: "POST /caption-ad/caption-tracks/${t_1}/submit-review"
              payload: {}
              as: CaptionEditor
              as_user_id: "editor-1"
            - call: "POST /caption-ad/caption-tracks/${t_1}/enqueue-qc"
              payload: {}
              as: CaptionEditor
              as_user_id: "editor-1"
            - call: "POST /caption-ad/caption-tracks/${t_1}/qc-reviews"
              payload: { review_mode: "FULL_REVIEW", total_words: 40000, minor_errors: 100, major_errors: 0, critical_errors: 0 }
              as: QCSpecialist
              as_user_id: "qc-1"
            - call: "POST /caption-ad/caption-tracks/${t_1}/mark-conformed"
              payload: {}
              as: CaptionEditor
              as_user_id: "editor-1"
            - call: "POST /caption-ad/work-orders/${wo_1}/deliver"
              payload: {}
              as: OperationsManager
            - call: "POST /caption-ad/media-assets"
              payload: { client_id: "${c_id}", title: "Show 91", media_kind: "FILE_BASED", duration_seconds: 5460, frame_rate: "FPS_24" }
              as: IntakeCoordinator
              captures: { m_2: $.data.id }
            - call: "POST /caption-ad/media-assets/${m_2}/begin-inspection"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/media-assets/${m_2}/clear"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/work-orders"
              payload: { client_id: "${c_id}", media_asset_id: "${m_2}", service_type: "CAPTIONS", turnaround_tier: "EXPRESS", language: "en-US" }
              as: IntakeCoordinator
              captures: { wo_2: $.data.id }
          trigger:
            - call: "POST /caption-ad/work-orders/${wo_2}/quote"
              payload: {}
              as: IntakeCoordinator
          assert:
            - "Client.${c_id}.ytd_completed_minutes == 5000 after the first delivery (ceil(300000/60))"
            - "WorkOrder.${wo_2}.quoted_price_cents == 55969 — duration_charge 28750 (10500+18000+250), tiered 43125, discounted ROUND_HALF_UP(43125*0.95)=40969, +15000 setup"
            - "Reversed order (discount first: 27313*1.5=40970) and average-rate readings are excluded by the pinned evaluation order"

      - name: ad_gap_coverage_nested_rounding
        grounds:
          - calculations.ad_gap_coverage
          - state_machines.AudioDescriptionTrack.SCRIPTING_to_SCRIPT_REVIEW
        distinguishing_aspect: |
          Mode (b): nested rounding where the order matters — per-gap utilizations
          34.85/34.95/34.95 round to 34.9/35.0/35.0 whose mean rounds to 35.0 (PASS
          at the inclusive lower band edge), while the sum-then-divide reading of the
          same segments yields 34.9 (would FAIL); the scaffold pins per-gap-first.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T10:00:00Z"
            - "INTERNAL client, CLEARED 3600s asset, AUDIO_DESCRIPTION work order IN_PRODUCTION"
            - "AD track with three 100000ms gaps and segments of 34850/34950/34950 ms"
          setup_api_calls:
            - call: "POST /caption-ad/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OperationsManager
            - call: "POST /caption-ad/clients"
              payload: { name: "Internal Client", compliance_standard: "INTERNAL" }
              as: OperationsManager
              captures: { c_id: $.data.id }
            - call: "POST /caption-ad/media-assets"
              payload: { client_id: "${c_id}", title: "Prog AD", media_kind: "FILE_BASED", duration_seconds: 3600, frame_rate: "FPS_25" }
              as: IntakeCoordinator
              captures: { m_a: $.data.id }
            - call: "POST /caption-ad/media-assets/${m_a}/begin-inspection"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/media-assets/${m_a}/clear"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/work-orders"
              payload: { client_id: "${c_id}", media_asset_id: "${m_a}", service_type: "AUDIO_DESCRIPTION", turnaround_tier: "STANDARD", language: "en-US" }
              as: IntakeCoordinator
              captures: { wo_a: $.data.id }
            - call: "POST /caption-ad/work-orders/${wo_a}/quote"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/work-orders/${wo_a}/confirm"
              payload: {}
              as: ClientContact
              as_user_id: "${c_id}"
            - call: "POST /caption-ad/work-orders/${wo_a}/start-production"
              payload: {}
              as: CaptionEditor
            - call: "POST /caption-ad/work-orders/${wo_a}/audio-description-tracks"
              payload:
                language: "en-US"
                narrator_name: "Narrator One"
                gaps: [ { start_ms: 5000, end_ms: 105000 }, { start_ms: 200000, end_ms: 300000 }, { start_ms: 400000, end_ms: 500000 } ]
                segments: [ { gap_index: 0, duration_ms: 34850, text: "seg-A" }, { gap_index: 1, duration_ms: 34950, text: "seg-B" }, { gap_index: 2, duration_ms: 34950, text: "seg-C" } ]
              as: ADProducer
              as_user_id: "ad-1"
              captures: { ad_a: $.data.id }
          trigger:
            - call: "POST /caption-ad/audio-description-tracks/${ad_a}/submit-script"
              payload: {}
              as: ADProducer
              as_user_id: "ad-1"
          assert:
            - "AudioDescriptionTrack.${ad_a}.gap_coverage_pct == 35.0 (per-gap 34.9/35.0/35.0 -> mean 35.0)"
            - "AudioDescriptionTrack.${ad_a}.ad_status == SCRIPT_REVIEW — passes at the inclusive 35.0 lower band edge"
            - "Sum-then-divide of the same inputs is 34.9, which would have been rejected; only the pinned per-gap-first order passes"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities: CaptionTrack, Complaint)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: caption_track_qc_rework_cycle
        grounds:
          - state_machines.CaptionTrack.QC_FAILED_to_AUTHORING
          - state_machines.CaptionTrack.QC_FAILED_to_QC_FAILED_PERMANENT
          - entities.CaptionTrack.fields.qc_attempts
        distinguishing_aspect: |
          Cyclic machine on CaptionTrack: AUTHORING -> ... -> QC_FAILED -> AUTHORING
          loops twice (qc_attempts 1, 2), and the third FAIL lands in
          QC_FAILED_PERMANENT (terminal) — the cycle has a hidden iteration cap that
          converts the loop into a terminal absorbing state.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T10:00:00Z"
            - "INTERNAL client, CLEARED asset, CAPTIONS work order IN_PRODUCTION, one track authored by editor-1"
          setup_api_calls:
            - call: "POST /caption-ad/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OperationsManager
            - call: "POST /caption-ad/clients"
              payload: { name: "Internal Client", compliance_standard: "INTERNAL" }
              as: OperationsManager
              captures: { c_id: $.data.id }
            - call: "POST /caption-ad/media-assets"
              payload: { client_id: "${c_id}", title: "Prog", media_kind: "FILE_BASED", duration_seconds: 3600, frame_rate: "FPS_30" }
              as: IntakeCoordinator
              captures: { m_a: $.data.id }
            - call: "POST /caption-ad/media-assets/${m_a}/begin-inspection"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/media-assets/${m_a}/clear"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/work-orders"
              payload: { client_id: "${c_id}", media_asset_id: "${m_a}", service_type: "CAPTIONS", turnaround_tier: "STANDARD", language: "en-US" }
              as: IntakeCoordinator
              captures: { wo_a: $.data.id }
            - call: "POST /caption-ad/work-orders/${wo_a}/quote"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/work-orders/${wo_a}/confirm"
              payload: {}
              as: ClientContact
              as_user_id: "${c_id}"
            - call: "POST /caption-ad/work-orders/${wo_a}/start-production"
              payload: {}
              as: CaptionEditor
              captures: { wo_a_v: $.data.version }
            - call: "POST /caption-ad/work-orders/${wo_a}/caption-tracks"
              payload: { language: "en-US", caption_format: "SRT", speaker_id_style: "DASH", expected_work_order_version: "${wo_a_v}" }
              as: CaptionEditor
              as_user_id: "editor-1"
              captures: { t_a: $.data.id }
          trigger:
            - call: "POST /caption-ad/caption-tracks/${t_a}/submit-review"
              payload: {}
              as: CaptionEditor
              as_user_id: "editor-1"
            - call: "POST /caption-ad/caption-tracks/${t_a}/enqueue-qc"
              payload: {}
              as: CaptionEditor
              as_user_id: "editor-1"
            - call: "POST /caption-ad/caption-tracks/${t_a}/qc-reviews"
              payload: { review_mode: "FULL_REVIEW", total_words: 10000, minor_errors: 600, major_errors: 0, critical_errors: 0 }
              as: QCSpecialist
              as_user_id: "qc-1"
            - call: "POST /caption-ad/caption-tracks/${t_a}/begin-rework"
              payload: {}
              as: CaptionEditor
              as_user_id: "editor-1"
            - call: "POST /caption-ad/caption-tracks/${t_a}/submit-review"
              payload: {}
              as: CaptionEditor
              as_user_id: "editor-1"
            - call: "POST /caption-ad/caption-tracks/${t_a}/enqueue-qc"
              payload: {}
              as: CaptionEditor
              as_user_id: "editor-1"
            - call: "POST /caption-ad/caption-tracks/${t_a}/qc-reviews"
              payload: { review_mode: "FULL_REVIEW", total_words: 10000, minor_errors: 550, major_errors: 0, critical_errors: 0 }
              as: QCSpecialist
              as_user_id: "qc-1"
            - call: "POST /caption-ad/caption-tracks/${t_a}/begin-rework"
              payload: {}
              as: CaptionEditor
              as_user_id: "editor-1"
            - call: "POST /caption-ad/caption-tracks/${t_a}/submit-review"
              payload: {}
              as: CaptionEditor
              as_user_id: "editor-1"
            - call: "POST /caption-ad/caption-tracks/${t_a}/enqueue-qc"
              payload: {}
              as: CaptionEditor
              as_user_id: "editor-1"
            - call: "POST /caption-ad/caption-tracks/${t_a}/qc-reviews"
              payload: { review_mode: "FULL_REVIEW", total_words: 10000, minor_errors: 520, major_errors: 0, critical_errors: 0 }
              as: QCSpecialist
              as_user_id: "qc-1"
            - call: "POST /caption-ad/caption-tracks/${t_a}/begin-rework"
              payload: {}
              as: CaptionEditor
              as_user_id: "editor-1"
              captures: { err: $.data.error_id }
          assert:
            - "After FAIL #1: track QC_FAILED, qc_attempts == 1; begin-rework succeeds (cycle re-entry to AUTHORING)"
            - "After FAIL #2: track QC_FAILED, qc_attempts == 2; begin-rework succeeds again"
            - "After FAIL #3 (94.80 < 95.00): track skips QC_FAILED rest state and lands terminal QC_FAILED_PERMANENT with qc_attempts == 3"
