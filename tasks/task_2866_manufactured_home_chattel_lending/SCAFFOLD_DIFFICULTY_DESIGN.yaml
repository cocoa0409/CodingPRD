        distinguishing_aspect: "The contended resource is ONE LOAN'S INSURANCE COVERAGE TIMELINE and the interval semantics are half-open [effective_date, expiry_date) with abutment allowed: a candidate policy running 2027-01-01 -> 2028-01-01 intersects the incumbent 2026-08-01 -> 2027-08-01 and is refused, while 2027-08-01 -> 2028-08-01 shares only the endpoint and is accepted, superseding the incumbent."
