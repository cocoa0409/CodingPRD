# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3162_direct_vehicle_sales_delivery_appointment_mobile_service
#
# Breadth probe over the §1.1–§1.7 surface. Corners already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as `excluded_because:` stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: buyer_create_returns_declared_fields_and_starts_pending
        claim_type: Creation
        grounds:
          - entities.Buyer
          - endpoints.POST_/v1/buyers
          - errors[ERR_INVALID_USER_CONTEXT]
        distinguishing_aspect: "A buyer created with three input fields comes back 201 with status PENDING_VERIFICATION, identity_verified false, credit_band UNRATED, order_credit_balance_cents 0 and version 1 — identity_verified and status are never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &c_buyer
              call: "POST /v1/buyers"
              payload: { full_name: "Nora New", email: "nora.new@example.com", residency_state_code: "TX" }
              as: Anonymous
              captures: { byr_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Buyer.${byr_id}.full_name == \"Nora New\" and residency_state_code == \"TX\""
            - "Buyer.${byr_id}.status == PENDING_VERIFICATION and identity_verified == false"
            - "Buyer.${byr_id}.credit_band == UNRATED and order_credit_balance_cents == 0"
            - "Buyer.${byr_id}.version == 1 and created_at and updated_at are both populated"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: configuration_options_list_filters_by_software_entitlement_flag
        claim_type: Listing
        grounds:
          - endpoints.GET_/v1/configuration-options
          - entities.ConfigurationOption.fields.is_software_entitlement
          - entities.VehicleConfiguration.fields.option_count
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three options on one configuration, is_software_entitlement=true returns exactly the one SOFTWARE_FEATURE row while the unfiltered list returns all three and reports total_count 3 with has_more false at the default limit."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One configuration carrying PAINT_WHITE 100000, TOW_HITCH 130000 and FSD_SUPERVISED 800000."
          setup_api_calls:
            - *c_clock
            - &c_cfg
              call: "POST /v1/vehicle-configurations"
              payload: { model_code: "MODEL_Y_LR_AWD", base_price_cents: 4799000 }
              as: PlatformAdmin
              captures: { cfg_id: $.data.id }
            - call: "POST /v1/vehicle-configurations/${cfg_id}/options"
              payload: { option_sku: "PAINT_WHITE", option_category: "PAINT", price_cents: 100000 }
              as: PlatformAdmin
            - call: "POST /v1/vehicle-configurations/${cfg_id}/options"
              payload: { option_sku: "TOW_HITCH", option_category: "TOWING", price_cents: 130000 }
              as: PlatformAdmin
            - call: "POST /v1/vehicle-configurations/${cfg_id}/options"
              payload: { option_sku: "FSD_SUPERVISED", option_category: "SOFTWARE_FEATURE", price_cents: 800000 }
              as: PlatformAdmin
              captures: { opt_fsd_id: $.data.id }
          trigger:
            - call: "GET /v1/configuration-options"
              payload: { configuration_id: "${cfg_id}" }
              as: PlatformAdmin
            - call: "GET /v1/configuration-options"
              payload: { configuration_id: "${cfg_id}", is_software_entitlement: true }
              as: PlatformAdmin
              captures: { sw_id: "$.data[0].id", sw_flag: "$.data[0].is_software_entitlement" }
          assert:
            - "the unfiltered list returns exactly 3 rows with total_count 3 and has_more false"
            - "the filtered list returns exactly 1 row and \"${sw_id}\" == \"${opt_fsd_id}\""
            - "\"${sw_flag}\" == true"
            - "VehicleConfiguration.${cfg_id}.configured_price_cents == 4929000 (base plus PAINT_WHITE and TOW_HITCH; the SOFTWARE_FEATURE option contributes 0)"
            - "VehicleConfiguration.${cfg_id}.option_count == 3"

      - name: vehicle_order_get_with_an_unknown_id_returns_order_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/v1/orders/{id}
          - errors[ERR_ORDER_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated id on the order path produces the entity-specific 404 ERR_ORDER_NOT_FOUND rather than a generic not-found or a 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. No order has been created."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /v1/orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_ORDER_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: order_create_missing_required_configuration_id_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.VehicleOrder.fields.configuration_id
          - validations[priority=1]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "configuration_id is a required input with no default, so omitting it entirely is a 400 ERR_INVALID_REQUEST from the required-field check and no order row is created."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a TX regime, a delivery center, a configuration and a verified buyer."
          setup_api_calls:
            - *c_clock
            - &c_jur
              call: "POST /v1/jurisdictions"
              payload: { state_code: "TX", direct_sales_permitted: true, gallery_only_required: false, out_of_state_delivery_required: false, cooling_off_days: 3, doc_fee_cap_cents: 7500, mobile_service_permitted: true, delivery_buffer_minutes: 60, allocation_window_days: 14, transport_lead_days: 7 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - &c_center
              call: "POST /v1/delivery-centers"
              payload: { center_name: "Austin Delivery", center_kind: "DELIVERY_CENTER", state_code: "TX", bay_count: 4, home_delivery_radius_miles: 50, van_count: 3 }
              as: PlatformAdmin
              captures: { ctr_id: $.data.id }
            - *c_cfg
            - *c_buyer
          trigger:
            - call: "POST /v1/orders"
              payload: { buyer_id: "${byr_id}", jurisdiction_id: "${jur_id}", delivery_center_id: "${ctr_id}" }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /v1/orders?buyer_id=${byr_id} returns 0 rows"

      - name: delivery_center_create_applies_home_delivery_defaults
        claim_type: Defaults
        grounds:
          - entities.DeliveryCenter.fields.home_delivery_radius_miles
          - entities.DeliveryCenter.fields.van_count
          - entities.DeliveryCenter.fields.booked_slot_count
        distinguishing_aspect: "Omitting home_delivery_radius_miles and van_count stores 0 on both rather than null, so a GALLERY site reports no home-delivery reach and a booked_slot_count of 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /v1/delivery-centers"
              payload: { center_name: "Phoenix Gallery", center_kind: "GALLERY", state_code: "AZ", bay_count: 0 }
              as: PlatformAdmin
              captures: { gal_id: $.data.id }
          assert:
            - "the response status is 201"
            - "DeliveryCenter.${gal_id}.home_delivery_radius_miles == 0 and van_count == 0"
            - "DeliveryCenter.${gal_id}.booked_slot_count == 0 and status == ACTIVE"
            - "DeliveryCenter.${gal_id}.center_kind == GALLERY and state_code == AZ"

      - name: delivery_estimates_list_filters_by_notification_state
        claim_type: Listing
        grounds:
          - endpoints.GET_/v1/delivery-estimates
          - entities.DeliveryEstimate.fields.notification_state
          - entities.DeliveryEstimate.fields.estimate_state
        distinguishing_aspect: "notification_state is a second independent axis: after placement the single estimate reads PROVISIONAL and UNNOTIFIED, and filtering notification_state=NOTIFIED returns 0 rows while estimate_state=PROVISIONAL returns the same row."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; TX regime, delivery center, configuration, verified buyer, order placed."
          setup_api_calls:
            - *c_clock
            - *c_jur
            - &c_enact
              call: "POST /v1/jurisdictions/${jur_id}/enact"
              payload: {}
              as: PlatformAdmin
            - *c_center
            - *c_cfg
            - *c_buyer
            - &c_verify
              call: "POST /v1/buyers/${byr_id}/identity-verification"
              payload: {}
              as: PlatformAdmin
            - &c_order
              call: "POST /v1/orders"
              payload: { buyer_id: "${byr_id}", configuration_id: "${cfg_id}", jurisdiction_id: "${jur_id}", delivery_center_id: "${ctr_id}", order_fee_cents: 25000 }
              as: PlatformAdmin
              captures: { ord_id: $.data.id, ord_v: $.data.version }
            - &c_place
              call: "POST /v1/orders/${ord_id}/place"
              payload: { expected_order_version: "${ord_v}" }
              as: Buyer
              as_user_id: "${byr_id}"
              captures: { ord_v: $.data.version }
          trigger:
            - call: "GET /v1/delivery-estimates"
              payload: { order_id: "${ord_id}" }
              as: PlatformAdmin
              captures: { est_id: "$.data[0].id", est_state: "$.data[0].estimate_state", est_notif: "$.data[0].notification_state" }
            - call: "GET /v1/delivery-estimates"
              payload: { order_id: "${ord_id}", notification_state: "NOTIFIED" }
              as: PlatformAdmin
          assert:
            - "the unfiltered list returns exactly 1 row with total_count 1"
            - "\"${est_state}\" == PROVISIONAL and \"${est_notif}\" == UNNOTIFIED"
            - "the notification_state=NOTIFIED filter returns 0 rows"
            - "DeliveryEstimate.${est_id}.prior_estimate_id is null"
            - "DeliveryEstimate.${est_id}.shift_days == 0"

      - name: vehicle_get_returns_the_stored_entitlement_and_hold_state
        claim_type: Retrieval
        grounds:
          - endpoints.GET_/v1/vehicles/{id}
          - entities.Vehicle.fields.service_hold_state
          - errors[ERR_VEHICLE_NOT_FOUND]
        distinguishing_aspect: "A delivered vehicle round-trips odometer_miles, software_version and service_hold_state exactly, and its order linkage is discoverable through the order sub-resource and the filtered list alike."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; full arrival chain plus a capped payment so delivery readiness is READY."
          setup_api_calls:
            - *c_clock
            - *c_jur
            - *c_enact
            - *c_center
            - *c_cfg
            - *c_buyer
            - *c_verify
            - *c_order
            - *c_place
            - &c_pay
              call: "POST /v1/_payments/simulate"
              payload: { order_id: "${ord_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - &c_lock
              call: "POST /v1/orders/${ord_id}/lock-configuration"
              payload: { expected_order_version: "${ord_v}" }
              as: PlatformAdmin
              captures: { ord_v: $.data.version }
            - &c_batch
              call: "POST /v1/production-batches"
              payload: { factory_code: "AUSTIN", model_code: "MODEL_Y_LR_AWD", unit_capacity: 2, planned_completion_at: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { bch_id: $.data.id }
            - call: "POST /v1/production-batches/${bch_id}/start"
              payload: {}
              as: PlatformAdmin
            - &c_unit
              call: "POST /v1/production-batches/${bch_id}/allocation-units"
              payload: { vin: "7SAYGDEE1PF000120" }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - &c_alloc
              call: "POST /v1/orders/${ord_id}/allocation"
              payload: { batch_id: "${bch_id}", expected_order_version: "${ord_v}" }
              as: PlatformAdmin
              captures: { ord_v: $.data.version, est_id: $.data.id }
            - &c_disp
              call: "POST /v1/orders/${ord_id}/dispatch-to-transport"
              payload: {}
              as: PlatformAdmin
            - &c_arrive
              call: "POST /v1/orders/${ord_id}/arrive-at-center"
              payload: {}
              as: PlatformAdmin
              captures: { veh_id: $.data.id, ord_v: $.data.version }
          trigger:
            - call: "GET /v1/vehicles/${veh_id}"
              payload: {}
              as: ServiceTechnician
            - call: "GET /v1/vehicles"
              payload: { order_id: "${ord_id}" }
              as: ServiceTechnician
          assert:
            - "Vehicle.${veh_id}.vin == \"7SAYGDEE1PF000120\""
            - "Vehicle.${veh_id}.odometer_miles == 0 and service_hold_state == NONE and status == IN_SERVICE"
            - "Vehicle.${veh_id}.delivered_at is null because the handover has not completed"
            - "GET /v1/vehicles?order_id=${ord_id} returns exactly 1 row, the same vehicle"
            - "GET /v1/vehicles/00000000-0000-4000-8000-000000000000 returns 404 with error_id == ERR_VEHICLE_NOT_FOUND"

      - name: venue_get_does_not_reveal_services_the_tier_has_not_unlocked
        claim_type: Type Constraints
        grounds:
          - entities.DeliveryCenter.fields.center_kind
          - endpoints.GET_/v1/delivery-centers/{id}
          - errors[ERR_CENTER_NOT_FOUND_FOR_KIND]
        distinguishing_aspect: "center_kind is a closed enum of four values, so a site created as GALLERY can never be read back as SERVICE_CENTER and an attempt to occupy its bay fails with the kind-specific 409 rather than a not-found."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a GALLERY site in AZ."
          setup_api_calls:
            - *c_clock
            - call: "POST /v1/delivery-centers"
              payload: { center_name: "Phoenix Gallery", center_kind: "GALLERY", state_code: "AZ", bay_count: 0 }
              as: PlatformAdmin
              captures: { gal_id: $.data.id }
          trigger:
            - call: "GET /v1/delivery-centers/${gal_id}"
              payload: {}
              as: PlatformAdmin
              captures: { kind: $.data.center_kind, bays: $.data.bay_count }
            - call: "POST /v1/delivery-centers/${gal_id}/suspend"
              payload: {}
              as: PlatformAdmin
              captures: { sus_state: $.data.status }
          assert:
            - "\"${kind}\" == GALLERY and \"${bays}\" == 0"
            - "\"${sus_state}\" == SUSPENDED"
            - "GET /v1/delivery-centers?center_kind=GALLERY returns exactly 1 row while ?center_kind=SERVICE_CENTER returns 0 rows"
            - "POST /v1/delivery-centers/${gal_id}/suspend called a second time returns 409 with error_id == ERR_INVALID_STATE"

      - name: buyer_get_cannot_read_another_buyers_account
        claim_type: Parent Relationships
        grounds:
          - roles[Buyer].identity
          - endpoints.GET_/v1/buyers/{id}
          - entities.Buyer.fields.email
        distinguishing_aspect: "Buyer is entity_backed, so an authenticated buyer reading a different buyer's account is rejected with ERR_INSUFFICIENT_PERMISSIONS rather than being served the other account's ledger balance."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; two verified buyers."
          setup_api_calls:
            - *c_clock
            - *c_buyer
            - call: "POST /v1/buyers/${byr_id}/identity-verification"
              payload: {}
              as: PlatformAdmin
            - &c_buyer2
              call: "POST /v1/buyers"
              payload: { full_name: "Omar Other", email: "omar.other@example.com", residency_state_code: "TX" }
              as: Anonymous
              captures: { byr2_id: $.data.id }
            - call: "POST /v1/buyers/${byr2_id}/identity-verification"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "GET /v1/buyers/${byr2_id}"
              payload: {}
              as: Buyer
              as_user_id: "${byr_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "the error body does not contain the string \"omar.other@example.com\""
            - "GET /v1/buyers/${byr_id} with the same credentials returns 200 and Buyer.${byr_id}.email == \"nora.new@example.com\""

      - name: order_created_with_a_nonexistent_configuration_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.POST_/v1/orders
          - errors[ERR_CONFIGURATION_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "Path-and-body references are validated left to right, so a well-formed but unallocated configuration_id yields the configuration-specific 404 rather than the order being created with a dangling reference."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a jurisdiction, a center and a verified buyer exist but no configuration."
          setup_api_calls:
            - *c_clock
            - *c_jur
            - *c_center
            - *c_buyer
          trigger:
            - call: "POST /v1/orders"
              payload: { buyer_id: "${byr_id}", configuration_id: "00000000-0000-4000-8000-000000000001", jurisdiction_id: "${jur_id}", delivery_center_id: "${ctr_id}", order_fee_cents: 25000 }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_CONFIGURATION_NOT_FOUND"
            - "GET /v1/orders returns 0 rows"

      - name: order_fee_cents_defaults_to_25000_when_omitted
        claim_type: Defaults
        grounds:
          - entities.VehicleOrder.fields.order_fee_cents
          - calculations.order_total_due_cents
          - endpoints.POST_/v1/orders
        distinguishing_aspect: "Omitting order_fee_cents stores the declared default 25000 rather than null or 0, so the provisional total still includes the order fee line."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; TX regime ENACTED, a delivery center, a configuration with no options, and a verified buyer."
          setup_api_calls:
            - *c_clock
            - *c_jur
            - *c_enact
            - *c_center
            - *c_cfg
            - *c_buyer
            - *c_verify
          trigger:
            - call: "POST /v1/orders"
              payload: { buyer_id: "${byr_id}", configuration_id: "${cfg_id}", jurisdiction_id: "${jur_id}", delivery_center_id: "${ctr_id}" }
              as: PlatformAdmin
              captures: { ord2_id: $.data.id, fee: $.data.order_fee_cents, total: $.data.order_total_due_cents }
          assert:
            - "\"${fee}\" == 25000"
            - "\"${total}\" == 4824000 (base 4799000 plus the defaulted 25000 order fee, 0 late fee, 7500 doc fee and 2500 delivery fee)"
            - "VehicleOrder.${ord2_id}.order_fee_paid_cents == 0 and status == DRAFT"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: order_placement_without_a_settled_order_fee_returns_fee_unpaid
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.VehicleOrder.DRAFT_to_PLACED
          - errors[ERR_ORDER_FEE_UNPAID]
          - validations[priority=5]
        distinguishing_aspect: "The DRAFT to PLACED transition demands a settled ORDER_FEE_PAYMENT, so placement with no ledger entry fails 402 with ERR_ORDER_FEE_UNPAID and the order stays DRAFT with no configuration_lock_deadline."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; TX regime ENACTED, a center, a configuration and a verified buyer; an order created but not yet paid."
          setup_api_calls:
            - *c_clock
            - *c_jur
            - *c_enact
            - *c_center
            - *c_cfg
            - *c_buyer
            - *c_verify
            - *c_order
          trigger:
            - call: "POST /v1/orders/${ord_id}/place"
              payload: { expected_order_version: "${ord_v}" }
              as: Buyer
              as_user_id: "${byr_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 402 and error_id == ERR_ORDER_FEE_UNPAID"
            - "GET /v1/orders/${ord_id} reports status DRAFT and configuration_lock_deadline null"
            - "GET /v1/orders/${ord_id}/delivery-estimates returns 0 rows"

      - name: allocation_on_a_draft_order_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.VehicleOrder.CONFIG_LOCKED_to_ALLOCATED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Allocation is only reachable from CONFIG_LOCKED, so calling it on a DRAFT order fails 409 with ERR_INVALID_STATE and neither the order nor the batch's allocated_unit_count moves."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a started batch with one unassigned unit; an order still DRAFT."
          setup_api_calls:
            - *c_clock
            - *c_jur
            - *c_enact
            - *c_center
            - *c_cfg
            - *c_buyer
            - *c_verify
            - *c_order
            - *c_batch
            - call: "POST /v1/production-batches/${bch_id}/start"
              payload: {}
              as: PlatformAdmin
            - *c_unit
          trigger:
            - call: "POST /v1/orders/${ord_id}/allocation"
              payload: { batch_id: "${bch_id}", expected_order_version: "${ord_v}" }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "GET /v1/orders/${ord_id} reports status DRAFT"
            - "GET /v1/production-batches/${bch_id} reports allocated_unit_count == 0 and unallocated_unit_count == 2"
            - "GET /v1/allocation-units/${unit_id} reports status UNASSIGNED and order_id null"

      - name: cancellation_of_a_delivered_order_returns_already_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.VehicleOrder.terminal_states
          - state_machines.VehicleOrder.PLACED_to_CANCELLED
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "DELIVERED is terminal, so the cancel endpoint rejects it with ERR_ALREADY_TERMINAL and no compensating ORDER_FEE_REFUND is written — the ledger and the buyer balance are untouched."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a fully delivered order."
          setup_api_calls:
            - *c_clock
            - *c_jur
            - *c_enact
            - *c_center
            - *c_cfg
            - *c_buyer
            - *c_verify
            - *c_order
            - *c_place
            - *c_pay
            - *c_lock
            - *c_batch
            - call: "POST /v1/production-batches/${bch_id}/start"
              payload: {}
              as: PlatformAdmin
            - *c_unit
            - *c_alloc
            - *c_disp
            - *c_arrive
            - &c_appt
              call: "POST /v1/delivery-appointments"
              payload: { order_id: "${ord_id}", delivery_center_id: "${ctr_id}", delivery_mode: "CENTER", scheduled_start: "2026-09-24T15:00:00Z", scheduled_end: "2026-09-24T16:00:00Z", expected_order_version: "${ord_v}" }
              as: DeliveryAdvisor
              captures: { apt_id: $.data.id, ord_v: $.data.version }
            - &c_confirm
              call: "POST /v1/delivery-appointments/${apt_id}/confirm"
              payload: {}
              as: DeliveryAdvisor
            - &c_complete
              call: "POST /v1/delivery-appointments/${apt_id}/complete"
              payload: { acceptance_inspection_result: "CLEAN", documented_issues: [], expected_order_version: "${ord_v}" }
              as: DeliveryAdvisor
              captures: { ord_v: $.data.version }
          trigger:
            - call: "POST /v1/orders/${ord_id}/cancel"
              payload: {}
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
            - call: "GET /v1/orders/${ord_id}/fee-ledger-entries"
              payload: {}
              as: PlatformAdmin
              captures: { first_entry_id: "$.data[0].id" }
          assert:
            - "the response status is 409 and error_id == ERR_ALREADY_TERMINAL"
            - "GET /v1/orders/${ord_id} still reports status DELIVERED"
            - "the ledger listing reports total_count 2 — the ORDER_FEE_PAYMENT and the DELIVERY_FEE_CHARGE, with no refund added"
            - "OrderFeeLedgerEntry.${first_entry_id}.entry_type == ORDER_FEE_PAYMENT"
            - "VehicleOrder.${ord_id}.version == \"${ord_v}\" — the rejected call did not advance the version"

      - name: repeat_appraisal_on_an_already_appraised_row_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.TradeInAppraisal.DRAFT_to_APPRAISED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Appraising twice is not idempotent: the second call fails 409 with ERR_INVALID_STATE and leaves net_credit_cents frozen at the first appraisal's value."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a placed order with one DRAFT appraisal at 90000 miles."
          setup_api_calls:
            - *c_clock
            - *c_jur
            - *c_enact
            - *c_center
            - *c_cfg
            - *c_buyer
            - *c_verify
            - *c_order
            - *c_place
            - &c_appraisal
              call: "POST /v1/orders/${ord_id}/trade-in-appraisals"
              payload: { trade_vin: "5YJ3E1EA7PF000910", mileage: 90000, gross_offer_cents: 1200000, reconditioning_estimate_cents: 60000, offer_valid_until: "2026-10-15T00:00:00Z" }
              as: TradeInSpecialist
              captures: { apr_id: $.data.id }
            - &c_appraise
              call: "POST /v1/orders/${ord_id}/trade-in-appraisals/${apr_id}/appraise"
              payload: {}
              as: TradeInSpecialist
              captures: { net_first: $.data.net_credit_cents }
          trigger:
            - call: "POST /v1/orders/${ord_id}/trade-in-appraisals/${apr_id}/appraise"
              payload: {}
              as: TradeInSpecialist
              captures: { error_id: $.data.error_id }
          assert:
            - "\"${net_first}\" == 940000 (1140000 raw less the 200000-cent capped mileage deduction)"
            - "the second call returns 409 with error_id == ERR_INVALID_STATE"
            - "TradeInAppraisal.${apr_id}.net_credit_cents == 940000 and status == APPRAISED"

      - name: center_transition_with_the_wrong_selected_value_is_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.DeliveryEstimate.PROVISIONAL_to_FIRM
          - errors[ERR_ESTIMATE_WINDOW_EXPIRED]
          - entities.DeliveryEstimate.fields.window_end
        distinguishing_aspect: "A superseded estimate can only be restored while its window_start is still at or after the clock; once the clock passes that instant the restore fails with ERR_ESTIMATE_WINDOW_EXPIRED and the accumulator unwinding is not applied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; an order allocated so estimate A reads 2026-09-15 to 2026-09-22, then superseded by estimate B."
          setup_api_calls:
            - *c_clock
            - *c_jur
            - *c_enact
            - *c_center
            - *c_cfg
            - *c_buyer
            - *c_verify
            - *c_order
            - *c_place
            - *c_pay
            - *c_lock
            - *c_batch
            - call: "POST /v1/production-batches/${bch_id}/start"
              payload: {}
              as: PlatformAdmin
            - *c_unit
            - *c_alloc
            - call: "POST /v1/orders/${ord_id}/delivery-estimates"
              payload: { basis_iso8601: "2026-09-21T00:00:00Z", window_days: 7 }
              as: PlatformAdmin
              captures: { est_b_id: $.data.id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-30T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/delivery-estimates/${est_id}/restore"
              payload: {}
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_ESTIMATE_WINDOW_EXPIRED"
            - "DeliveryEstimate.${est_id}.estimate_state == SUPERSEDED"
            - "DeliveryEstimate.${est_b_id}.estimate_state is still PROVISIONAL"
            - "VehicleOrder.${ord_id}.estimate_shift_days_cumulative is unchanged by the rejected restore"

      - name: batch_resume_from_a_scheduled_batch_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ProductionBatch.DELAYED_to_IN_PRODUCTION
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Resume is only reachable from DELAYED, so calling it on a freshly scheduled batch fails 409 with ERR_INVALID_STATE and the batch's delay_days stays 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a SCHEDULED batch with no units."
          setup_api_calls:
            - *c_clock
            - *c_batch
          trigger:
            - call: "POST /v1/production-batches/${bch_id}/resume"
              payload: {}
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "ProductionBatch.${bch_id}.status == SCHEDULED and delay_days == 0"
            - "ProductionBatch.${bch_id}.planned_completion_at == 2026-09-10T00:00:00Z"

      - name: entitlement_state_axis_reads_active_immediately_after_grant
        claim_type: Initial State
        grounds:
          - state_machines.SoftwareEntitlement
          - endpoints.POST_/v1/vehicles/{id}/software-entitlements
          - entities.SoftwareEntitlement.fields.expires_at
        distinguishing_aspect: "A newly granted entitlement starts ACTIVE with effective_at set to the clock instant and expires_at null for a non-TRIAL source, while a TRIAL source sets expires_at to effective_at plus trial_days."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a delivered vehicle."
          setup_api_calls:
            - *c_clock
            - *c_jur
            - *c_enact
            - *c_center
            - *c_cfg
            - *c_buyer
            - *c_verify
            - *c_order
            - *c_place
            - *c_pay
            - *c_lock
            - *c_batch
            - call: "POST /v1/production-batches/${bch_id}/start"
              payload: {}
              as: PlatformAdmin
            - *c_unit
            - *c_alloc
            - *c_disp
            - *c_arrive
            - *c_appt
            - *c_confirm
            - *c_complete
          trigger:
            - call: "POST /v1/vehicles/${veh_id}/software-entitlements"
              payload: { feature_entries: [{ feature_code: "PREMIUM_CONNECTIVITY", price_cents: 100000 }], entitlement_source: "PURCHASE" }
              as: PlatformAdmin
              captures: { ent_purchase_id: "$.data[0].id", ent_expires: "$.data[0].expires_at" }
            - call: "POST /v1/vehicles/${veh_id}/software-entitlements"
              payload: { feature_entries: [{ feature_code: "FSD_TRIAL", price_cents: 0 }], entitlement_source: "TRIAL", trial_days: 30 }
              as: PlatformAdmin
              captures: { ent_trial_expires: "$.data[0].expires_at" }
          assert:
            - "SoftwareEntitlement.${ent_purchase_id}.status == ACTIVE and effective_at == 2026-09-01T00:00:00Z"
            - "\"${ent_expires}\" is null"
            - "\"${ent_trial_expires}\" == 2026-10-01T00:00:00Z"
            - "GET /v1/software-entitlements?vehicle_id=${veh_id} returns exactly 2 rows with total_count 2"

  # ===========================================================================
  - section: calculations
    instances:

      - name: delivery_fee_leaves_the_total_when_the_buyer_pays_up_front
        claim_type: Correct Result
        grounds:
          - calculations.order_total_due_cents
          - entities.Buyer.fields.order_credit_balance_cents
          - endpoints.POST_/v1/delivery-appointments/{id}/complete
        distinguishing_aspect: "With no accepted appraisal the final variant subtracts nothing, so the total after completion is 4934000 cents and the buyer's ledger holds only the 25000-cent order fee against a 2500-cent delivery-fee charge."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a fully arrived order with PAINT_WHITE selected and no trade-in appraisal."
          setup_api_calls:
            - *c_clock
            - *c_jur
            - *c_enact
            - *c_center
            - *c_cfg
            - call: "POST /v1/vehicle-configurations/${cfg_id}/options"
              payload: { option_sku: "PAINT_WHITE", option_category: "PAINT", price_cents: 100000 }
              as: PlatformAdmin
            - *c_buyer
            - *c_verify
            - *c_order
            - *c_place
            - *c_pay
            - *c_lock
            - *c_batch
            - call: "POST /v1/production-batches/${bch_id}/start"
              payload: {}
              as: PlatformAdmin
            - *c_unit
            - *c_alloc
            - *c_disp
            - *c_arrive
            - *c_appt
            - *c_confirm
          trigger:
            - call: "POST /v1/delivery-appointments/${apt_id}/complete"
              payload: { acceptance_inspection_result: "CLEAN", documented_issues: [], expected_order_version: "${ord_v}" }
              as: DeliveryAdvisor
              captures: { final_total: $.data.order_total_due_cents, final_status: $.data.status }
          assert:
            - "\"${final_total}\" == 4934000"
            - "\"${final_status}\" == DELIVERED"
            - "GET /v1/buyers/${byr_id} reports order_credit_balance_cents == 22500 (25000 order fee settlement less the 2500-cent delivery-fee charge)"
            - "VehicleOrder.${ord_id}.order_fee_paid_cents == 25000 and Buyer.${byr_id}.order_credit_balance_cents == 22500"
            - "Vehicle.${veh_id}.delivered_at == 2026-09-01T00:00:00Z and Vehicle.${veh_id}.status == IN_SERVICE"

      - name: doc_fee_cap_of_zero_suppresses_the_documentation_fee
        claim_type: Constants Applied
        grounds:
          - calculations.order_total_due_cents
          - entities.StateJurisdiction.fields.doc_fee_cap_cents
          - endpoints.POST_/v1/jurisdictions
        distinguishing_aspect: "A jurisdiction whose doc_fee_cap_cents is 0 forces the documentation fee to 0 rather than to the 7500-cent constant, so the same configuration totals 3051500 cents in that state instead of 3059000."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; an AZ regime ENACTED with doc_fee_cap_cents 0 and a GALLERY plus an out-of-state delivery center; a configuration with no options."
          setup_api_calls:
            - *c_clock
            - &c_jur_az
              call: "POST /v1/jurisdictions"
              payload: { state_code: "AZ", direct_sales_permitted: false, gallery_only_required: true, out_of_state_delivery_required: true, cooling_off_days: 5, doc_fee_cap_cents: 0, mobile_service_permitted: false, delivery_buffer_minutes: 45, allocation_window_days: 14, transport_lead_days: 10 }
              as: PlatformAdmin
              captures: { jur_az_id: $.data.id }
            - call: "POST /v1/jurisdictions/${jur_az_id}/enact"
              payload: {}
              as: PlatformAdmin
            - &c_center_nv
              call: "POST /v1/delivery-centers"
              payload: { center_name: "Las Vegas Delivery", center_kind: "DELIVERY_CENTER", state_code: "NV", bay_count: 3, home_delivery_radius_miles: 40, van_count: 1 }
              as: PlatformAdmin
              captures: { ctr_nv_id: $.data.id }
            - call: "POST /v1/vehicle-configurations"
              payload: { model_code: "MODEL_3_LR_RWD", base_price_cents: 2999000 }
              as: PlatformAdmin
              captures: { cfg3_id: $.data.id }
            - &c_buyer_az
              call: "POST /v1/buyers"
              payload: { full_name: "Ana Arizona", email: "ana.arizona@example.com", residency_state_code: "AZ" }
              as: Anonymous
              captures: { byr_az_id: $.data.id }
            - call: "POST /v1/buyers/${byr_az_id}/identity-verification"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/orders"
              payload: { buyer_id: "${byr_az_id}", configuration_id: "${cfg3_id}", jurisdiction_id: "${jur_az_id}", delivery_center_id: "${ctr_nv_id}" }
              as: PlatformAdmin
              captures: { ord_az_id: $.data.id, total_az: $.data.order_total_due_cents }
          assert:
            - "\"${total_az}\" == 3051500 (2999000 base plus 25000 order fee, 0 doc fee because the cap is 0, and 2500 delivery fee)"
            - "StateJurisdiction.${jur_az_id}.doc_fee_cap_cents == 0 and direct_sales_permitted == false"
            - "VehicleOrder.${ord_az_id}.delivery_readiness_posture == FROZEN"

      - name: estimate_input_set_excludes_superseded_rows_from_the_live_window
        claim_type: Input Set Filtering
        grounds:
          - calculations.delivery_estimate_window
          - entities.DeliveryEstimate.fields.estimate_state
          - endpoints.GET_/v1/delivery-estimates
        distinguishing_aspect: "Only the PROVISIONAL or FIRM estimate defines the live window, so after superseding, the order's live estimate is the newer row and the older one is excluded from window projection even though both are still queryable."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; an order placed and allocated so estimate A is FIRM at 2026-09-15 to 2026-09-22."
          setup_api_calls:
            - *c_clock
            - *c_jur
            - *c_enact
            - *c_center
            - *c_cfg
            - *c_buyer
            - *c_verify
            - *c_order
            - *c_place
            - *c_pay
            - *c_lock
            - *c_batch
            - call: "POST /v1/production-batches/${bch_id}/start"
              payload: {}
              as: PlatformAdmin
            - *c_unit
            - *c_alloc
          trigger:
            - call: "POST /v1/orders/${ord_id}/delivery-estimates"
              payload: { basis_iso8601: "2026-09-21T00:00:00Z", window_days: 7 }
              as: PlatformAdmin
              captures: { est_new_id: $.data.id }
            - call: "GET /v1/delivery-estimates"
              payload: { order_id: "${ord_id}", estimate_state: "FIRM" }
              as: PlatformAdmin
          assert:
            - "the FIRM filter now returns 0 rows"
            - "GET /v1/delivery-estimates?order_id=${ord_id} returns exactly 2 rows"
            - "DeliveryEstimate.${est_id}.estimate_state == SUPERSEDED and DeliveryEstimate.${est_new_id}.estimate_state == PROVISIONAL"
            - "DeliveryEstimate.${est_new_id}.window_start == 2026-09-21T00:00:00Z and window_end == 2026-09-28T00:00:00Z"
            - "DeliveryEstimate.${est_new_id}.basis_equipment_at == 2026-09-21T00:00:00Z"

      - name: shift_days_honours_the_floor_to_whole_days
        claim_type: Precision
        grounds:
          - calculations.delivery_estimate_window
          - entities.DeliveryEstimate.fields.shift_days
        distinguishing_aspect: "shift_days floors to whole days against the prior window_end, so a 36-hour slip records 1 rather than 2 and a 252-hour slip records 10."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; an order placed and allocated so the live estimate ends at 2026-09-22T00:00:00Z."
          setup_api_calls:
            - *c_clock
            - *c_jur
            - *c_enact
            - *c_center
            - *c_cfg
            - *c_buyer
            - *c_verify
            - *c_order
            - *c_place
            - *c_pay
            - *c_lock
            - *c_batch
            - call: "POST /v1/production-batches/${bch_id}/start"
              payload: {}
              as: PlatformAdmin
            - *c_unit
            - *c_alloc
          trigger:
            - call: "POST /v1/orders/${ord_id}/delivery-estimates"
              payload: { basis_iso8601: "2026-09-23T12:00:00Z", window_days: 7 }
              as: PlatformAdmin
              captures: { est_36h: $.data.id }
          assert:
            - "DeliveryEstimate.${est_36h}.window_start == 2026-09-23T12:00:00Z"
            - "DeliveryEstimate.${est_36h}.shift_days == 1 (36 hours after the prior window_end floors to 1 day)"
            - "a further estimate projected with basis_iso8601 2026-10-03T00:00:00Z reports shift_days == 10 (252 hours after 2026-09-23T12:00:00Z floors to 10 days)"
            - "VehicleOrder.${ord_id}.estimate_shift_days_cumulative == 11 after both projections"

  # ===========================================================================
  - section: validations
    instances:

      - name: missing_role_header_returns_invalid_user_context
        claim_type: Violation -> Error
        grounds:
          - validations[priority=1]
          - errors[ERR_INVALID_USER_CONTEXT]
        distinguishing_aspect: "With no X-User-Role header the request fails 400 with ERR_INVALID_USER_CONTEXT before any existence or state check runs, so the same call with a valid role later returns 200."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one configuration on file."
          setup_api_calls:
            - *c_clock
            - *c_cfg
          trigger:
            - call: "GET /v1/vehicle-configurations/${cfg_id}"
              payload: {}
              as: NotARole
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_USER_CONTEXT"
            - "the same call with as: PlatformAdmin returns 200 and VehicleConfiguration.${cfg_id}.base_price_cents == 4799000"

      - name: buyer_role_cannot_create_a_jurisdiction
        claim_type: Violation -> Error
        grounds:
          - validations[priority=2]
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
          - roles[Buyer].exclusive_operations
        distinguishing_aspect: "POST /v1/jurisdictions is a PlatformAdmin-exclusive operation, so the Buyer role is refused with 403 ERR_INSUFFICIENT_PERMISSIONS rather than passing the role layer and failing later on a business rule."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a verified buyer."
          setup_api_calls:
            - *c_clock
            - *c_buyer
            - call: "POST /v1/buyers/${byr_id}/identity-verification"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/jurisdictions"
              payload: { state_code: "NV", direct_sales_permitted: true, gallery_only_required: false, out_of_state_delivery_required: false, cooling_off_days: 3, doc_fee_cap_cents: 5000, mobile_service_permitted: true, delivery_buffer_minutes: 30, allocation_window_days: 14, transport_lead_days: 5 }
              as: Buyer
              as_user_id: "${byr_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "GET /v1/jurisdictions?state_code=NV returns 0 rows"

      - name: suspended_buyer_cannot_place_an_order
        claim_type: Violation -> Error
        grounds:
          - validations[priority=5]
          - errors[ERR_BUYER_SUSPENDED]
          - state_machines.Buyer.ACTIVE_to_SUSPENDED
        distinguishing_aspect: "A suspended account outranks the fee precondition: even with the order fee settled, placement fails 403 with ERR_BUYER_SUSPENDED instead of succeeding or returning ERR_ORDER_FEE_UNPAID."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a paid, unplaced order whose buyer is then suspended."
          setup_api_calls:
            - *c_clock
            - *c_jur
            - *c_enact
            - *c_center
            - *c_cfg
            - *c_buyer
            - *c_verify
            - *c_order
            - *c_pay
            - call: "POST /v1/buyers/${byr_id}/suspend"
              payload: {}
              as: PlatformAdmin
              captures: { buyer_state: $.data.status }
          trigger:
            - call: "POST /v1/orders/${ord_id}/place"
              payload: { expected_order_version: "${ord_v}" }
              as: Buyer
              as_user_id: "${byr_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "\"${buyer_state}\" == SUSPENDED"
            - "the response status is 403 and error_id == ERR_BUYER_SUSPENDED"
            - "error_id != ERR_ORDER_FEE_UNPAID — the account check precedes the fiscal check"
            - "GET /v1/orders/${ord_id} still reports status DRAFT"

      - name: gallery_only_jurisdiction_refuses_a_gallery_handover
        claim_type: Cross-entity Validation
        grounds:
          - validations[priority=8]
          - errors[ERR_GALLERY_HANDOVER_FORBIDDEN]
          - entities.StateJurisdiction.fields.gallery_only_required
        distinguishing_aspect: "gallery_only_required true makes a GALLERY site an illegal handover venue, so arrival is refused 403 with ERR_GALLERY_HANDOVER_FORBIDDEN while the same order arriving at a DELIVERY_CENTER succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a WA regime ENACTED with gallery_only_required true and direct_sales_permitted true; a GALLERY site in WA; an order allocated to a unit and already in transit."
