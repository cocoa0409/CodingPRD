    roles: [Liaison, StateCoordinator]
    code: 200
    input: [liaison_id]
    output: Student
    side_effects: ["Student.liaison_id set", "Liaison.current_caseload recomputed"]
  - method: POST
    path: "/mv/students/{studentId}/eligibility-determinations"
    description: "Create a DRAFT eligibility determination (OCC on Student.version; new determination supersedes prior DRAFT)"
    roles: [Liaison, StateCoordinator]
    code: 201
    input: [category, basis, decision, effective_date, expected_student_version]
    output: EligibilityDetermination
    side_effects: ["status=DRAFT", "increments Student.version by 1"]

  # ---- EligibilityDetermination ----
  - method: GET
