  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: project_creation_requires_verified_employment
        grounds:
          - validations[priority=6]
          - errors.ERR_TEACHER_NOT_VERIFIED
          - state_machines.Teacher
        distinguishing_aspect: |
          Project -> Teacher dependency: POST /giving/projects reads the acting
          teacher's employment_status; a PENDING_VERIFICATION teacher is rejected
          with ERR_TEACHER_NOT_VERIFIED and only employment-review VERIFY unlocks
          project creation.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; school exists; teacher registered but NOT yet verified."
          setup_api_calls:
