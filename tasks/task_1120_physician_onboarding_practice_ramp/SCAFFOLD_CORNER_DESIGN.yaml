scaffold_corner_design:
  - section: entities
    instances:
      - name: physician_create_defaults_and_initial_state
        claim_type: creation
        grounds: ["entities.Physician", "state_machines.Physician"]
        distinguishing_aspect: "A freshly registered physician carries system defaults: status PROSPECT, version 1, server-minted UUID id, created_at from the logical clock default 2026-05-01T00:00:00Z."
        test_recipe:
          setup: ["Empty database; logical clock unset (default 2026-05-01T00:00:00Z)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Ann", specialty: "PEDIATRICS", email: "ann@x.com", hire_type: "NEW_GRAD" }, as: Recruiter, captures: { phys_id: "$.data.id", st: "$.data.status", ver: "$.data.version", ts: "$.data.created_at" } }
          assert:
            - "Response 201; data.status == PROSPECT and data.version == 1"
            - "data.created_at == 2026-05-01T00:00:00.000Z (logical clock default, not wall clock)"
            - "data.id is a type-prefix-free UUID"

      - name: case_duplicate_for_same_physician_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=10]", "errors[ERR_DUPLICATE_CASE]"]
        distinguishing_aspect: "The one-case-per-physician uniqueness rule fires on the second create with ERR_DUPLICATE_CASE (409)."
        test_recipe:
          setup: ["Physician with an existing OnboardingCase"]
          setup_api_calls:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Bo", specialty: "CARDIOLOGY", email: "bo@x.com", hire_type: "EXPERIENCED" }, as: Recruiter, captures: { phys_id: "$.data.id" } }
            - { call: "POST /onboarding/onboarding-cases", payload: { physician_id: "${phys_id}", target_start_date: "2027-06-01" }, as: Recruiter }
          trigger:
            - { call: "POST /onboarding/onboarding-cases", payload: { physician_id: "${phys_id}", target_start_date: "2027-07-01" }, as: Recruiter, captures: { err: "$.data.error_id" } }
          assert:
            - "Response error_id == ERR_DUPLICATE_CASE (HTTP 409)"

      - name: case_create_unknown_physician_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_PHYSICIAN_NOT_FOUND]"]
        distinguishing_aspect: "A body FK that does not resolve is a 404 ERR_PHYSICIAN_NOT_FOUND, not a 400."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /onboarding/onboarding-cases", payload: { physician_id: "00000000-0000-0000-0000-000000000000", target_start_date: "2027-06-01" }, as: Recruiter, captures: { err: "$.data.error_id" } }
          assert:
            - "Response error_id == ERR_PHYSICIAN_NOT_FOUND (HTTP 404)"

      - name: case_create_posture_input_ignored
        claim_type: computed_fields
        grounds: ["entities.OnboardingCase.fields.posture"]
        distinguishing_aspect: "Client-supplied computed fields are ignored: passing posture LIVE at creation still yields the computed PRE_CONTRACT."
        test_recipe:
          setup: ["Physician exists"]
          setup_api_calls:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Cy", specialty: "PEDIATRICS", email: "cy@x.com", hire_type: "NEW_GRAD" }, as: Recruiter, captures: { phys_id: "$.data.id" } }
          trigger:
            - { call: "POST /onboarding/onboarding-cases", payload: { physician_id: "${phys_id}", target_start_date: "2027-06-01", posture: "LIVE" }, as: Recruiter, captures: { case_id: "$.data.id", post: "$.data.posture" } }
          assert:
            - "Response data.posture == PRE_CONTRACT (client input for the computed field ignored)"
            - "OnboardingCase.${case_id}: credential_status == NOT_STARTED, training_status == NOT_STARTED, practice_status == PLANNING, weekly_active_minutes == 0, at_risk == false"

      - name: checkin_immutable_shape_has_no_version
        claim_type: immutability
        grounds: ["entities.CheckIn"]
        distinguishing_aspect: "CheckIn declares common_fields false: the persisted row exposes id and created_at but no version or updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["Physician + case; mentor physician marked ACTIVE; ACTIVE mentorship assignment"]
          setup_api_calls:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Di", specialty: "FAMILY_MEDICINE", email: "di@x.com", hire_type: "EXPERIENCED" }, as: Recruiter, captures: { phys_id: "$.data.id" } }
            - { call: "POST /onboarding/onboarding-cases", payload: { physician_id: "${phys_id}", target_start_date: "2027-06-01" }, as: Recruiter, captures: { case_id: "$.data.id" } }
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Mentor", specialty: "FAMILY_MEDICINE", email: "mentor@x.com", hire_type: "LEADERSHIP" }, as: Recruiter, captures: { mentor_id: "$.data.id" } }
            - { call: "POST /onboarding/physicians/${mentor_id}/mark-active", payload: {}, as: OnboardingDirector }
            - { call: "GET /onboarding/onboarding-cases/${case_id}", payload: {}, as: OnboardingDirector, captures: { case_v: "$.data.version" } }
            - { call: "POST /onboarding/mentorship-assignments", payload: { onboarding_case_id: "${case_id}", mentor_physician_id: "${mentor_id}", expected_onboarding_case_version: "${case_v}" }, as: OnboardingDirector, captures: { ma_id: "$.data.id" } }
            - { call: "POST /onboarding/mentorship-assignments/${ma_id}/check-ins", payload: { day_marker: "D30", sentiment: "POSITIVE" }, as: MentorPhysician, as_user_id: "${mentor_id}" }
          trigger:
            - { call: "GET /onboarding/mentorship-assignments/${ma_id}/check-ins", payload: {}, as: OnboardingDirector }
          assert:
            - "data[0] contains id, created_at, mentorship_id, day_marker D30, sentiment POSITIVE, occurred_on"
            - "data[0] has no version key and no updated_at key (common_fields false)"

      - name: module_listing_ordered_by_module_code
        claim_type: listing
        grounds: ["entities.TrainingModule", "endpoints"]
        distinguishing_aspect: "The modules list of an EXPERIENCED physician's plan is deterministically ordered module_code ASC: EHR_FUNDAMENTALS, NOTE_TEMPLATES, ORDER_ENTRY."
        test_recipe:
          setup: ["Executed offer pipeline for an EXPERIENCED physician (three required modules auto-created)"]
          setup_api_calls:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Ed", specialty: "FAMILY_MEDICINE", email: "ed@x.com", hire_type: "EXPERIENCED" }, as: Recruiter, captures: { phys_id: "$.data.id" } }
            - { call: "POST /onboarding/onboarding-cases", payload: { physician_id: "${phys_id}", target_start_date: "2027-06-01" }, as: Recruiter, captures: { case_id: "$.data.id", case_v: "$.data.version" } }
            - { call: "POST /onboarding/offers", payload: { onboarding_case_id: "${case_id}", expected_onboarding_case_version: "${case_v}", base_salary_cents: 25000000, signing_bonus_cents: 2000000, guarantee_monthly_cents: 2000000, guarantee_term_months: 12, panel_capacity: 1000, proposed_start_date: "2027-06-01", expires_at: "2026-08-01T00:00:00Z" }, as: Recruiter, captures: { offer_id: "$.data.id" } }
            - { call: "POST /onboarding/offers/${offer_id}/extend", payload: {}, as: Recruiter }
            - { call: "POST /onboarding/offers/${offer_id}/accept", payload: {}, as: Physician, as_user_id: "${phys_id}" }
            - { call: "POST /onboarding/offers/${offer_id}/execute", payload: {}, as: ContractAdministrator }
            - { call: "GET /onboarding/training-plans?onboarding_case_id=${case_id}", payload: {}, as: PracticeManager, captures: { plan_id: "$.data[0].id" } }
          trigger:
            - { call: "GET /onboarding/training-modules?training_plan_id=${plan_id}", payload: {}, as: PracticeManager, captures: { c0: "$.data[0].module_code", c1: "$.data[1].module_code", c2: "$.data[2].module_code" } }
          assert:
            - "data[0].module_code == EHR_FUNDAMENTALS, data[1].module_code == NOTE_TEMPLATES, data[2].module_code == ORDER_ENTRY"
            - "All three rows have status == NOT_STARTED and required == true (EXPERIENCED requires exactly 3 modules; BILLING absent)"

      - name: new_grad_requires_four_modules_and_five_templates
        claim_type: defaults
        grounds: ["entities.TrainingPlan.fields.required_module_count", "entities.TrainingPlan.fields.templates_required"]
        distinguishing_aspect: "Hire-type conditional provisioning: a NEW_GRAD offer execution auto-creates 4 required modules (BILLING added) and sets templates_required 5, versus 3 modules and 3 templates for EXPERIENCED."
        test_recipe:
          setup: ["Executed offer pipeline for a NEW_GRAD physician"]
          setup_api_calls:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Fi", specialty: "PEDIATRICS", email: "fi@x.com", hire_type: "NEW_GRAD" }, as: Recruiter, captures: { phys_id: "$.data.id" } }
            - { call: "POST /onboarding/onboarding-cases", payload: { physician_id: "${phys_id}", target_start_date: "2027-06-01" }, as: Recruiter, captures: { case_id: "$.data.id", case_v: "$.data.version" } }
            - { call: "POST /onboarding/offers", payload: { onboarding_case_id: "${case_id}", expected_onboarding_case_version: "${case_v}", base_salary_cents: 20000000, signing_bonus_cents: 1000000, guarantee_monthly_cents: 1500000, guarantee_term_months: 12, panel_capacity: 800, proposed_start_date: "2027-06-01", expires_at: "2026-08-01T00:00:00Z" }, as: Recruiter, captures: { offer_id: "$.data.id" } }
            - { call: "POST /onboarding/offers/${offer_id}/extend", payload: {}, as: Recruiter }
            - { call: "POST /onboarding/offers/${offer_id}/accept", payload: {}, as: Physician, as_user_id: "${phys_id}" }
            - { call: "POST /onboarding/offers/${offer_id}/execute", payload: {}, as: ContractAdministrator }
          trigger:
            - { call: "GET /onboarding/training-plans?onboarding_case_id=${case_id}", payload: {}, as: PracticeManager, captures: { plan_id: "$.data[0].id", req: "$.data[0].required_module_count", tpl: "$.data[0].templates_required" } }
          assert:
            - "TrainingPlan.required_module_count == 4 and templates_required == 5 for NEW_GRAD"
            - "GET /onboarding/training-modules?training_plan_id=${plan_id} returns 4 rows all with required == true, including BILLING"

      - name: create_physician_invalid_enum_returns_validation
        claim_type: type_constraints
        grounds: ["validations[priority=5]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "An out-of-enum specialty is a 400 ERR_VALIDATION at schema validation, before any business rule runs."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Zed", specialty: "DERMATOLOGY", email: "zed@x.com", hire_type: "EXPERIENCED" }, as: Recruiter, captures: { err: "$.data.error_id" } }
          assert:
            - "Response error_id == ERR_VALIDATION (HTTP 400)"

  - section: state_machines
    instances:
      - name: offer_initial_state_is_draft
        claim_type: initial_state
        grounds: ["state_machines.Offer"]
        distinguishing_aspect: "A created offer starts DRAFT with negotiation_round 0; accept from DRAFT is rejected because the negotiation was never opened."
        test_recipe:
          setup: ["Physician + case"]
          setup_api_calls:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Gil", specialty: "INTERNAL_MEDICINE", email: "gil@x.com", hire_type: "EXPERIENCED" }, as: Recruiter, captures: { phys_id: "$.data.id" } }
            - { call: "POST /onboarding/onboarding-cases", payload: { physician_id: "${phys_id}", target_start_date: "2027-06-01" }, as: Recruiter, captures: { case_id: "$.data.id", case_v: "$.data.version" } }
            - { call: "POST /onboarding/offers", payload: { onboarding_case_id: "${case_id}", expected_onboarding_case_version: "${case_v}", base_salary_cents: 25000000, signing_bonus_cents: 2000000, guarantee_monthly_cents: 2000000, guarantee_term_months: 12, panel_capacity: 1000, proposed_start_date: "2027-06-01", expires_at: "2026-08-01T00:00:00Z" }, as: Recruiter, captures: { offer_id: "$.data.id", st: "$.data.status", round0: "$.data.negotiation_round" } }
          trigger:
            - { call: "POST /onboarding/offers/${offer_id}/accept", payload: {}, as: Physician, as_user_id: "${phys_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "Created offer: status == DRAFT and negotiation_round == 0"
            - "accept from DRAFT rejected with error_id == ERR_NEGOTIATION_NOT_OPEN (HTTP 409)"

      - name: offer_execute_from_draft_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Offer.ACCEPTED_to_EXECUTED", "errors[ERR_OFFER_NOT_ACCEPTED]"]
        distinguishing_aspect: "execute on a DRAFT offer fails the state precondition with ERR_OFFER_NOT_ACCEPTED; no provisioning side effects fire."
        test_recipe:
          setup: ["Physician + case + DRAFT offer"]
          setup_api_calls:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Han", specialty: "INTERNAL_MEDICINE", email: "han@x.com", hire_type: "EXPERIENCED" }, as: Recruiter, captures: { phys_id: "$.data.id" } }
            - { call: "POST /onboarding/onboarding-cases", payload: { physician_id: "${phys_id}", target_start_date: "2027-06-01" }, as: Recruiter, captures: { case_id: "$.data.id", case_v: "$.data.version" } }
            - { call: "POST /onboarding/offers", payload: { onboarding_case_id: "${case_id}", expected_onboarding_case_version: "${case_v}", base_salary_cents: 25000000, signing_bonus_cents: 2000000, guarantee_monthly_cents: 2000000, guarantee_term_months: 12, panel_capacity: 1000, proposed_start_date: "2027-06-01", expires_at: "2026-08-01T00:00:00Z" }, as: Recruiter, captures: { offer_id: "$.data.id" } }
          trigger:
            - { call: "POST /onboarding/offers/${offer_id}/execute", payload: {}, as: ContractAdministrator, captures: { err: "$.data.error_id" } }
          assert:
            - "Response error_id == ERR_OFFER_NOT_ACCEPTED (HTTP 409)"
            - "GET /onboarding/income-guarantees?onboarding_case_id=${case_id} returns an empty array (no cascade fired)"

      - name: offer_withdraw_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Offer", "errors[ERR_OFFER_NOT_EXTENDABLE]"]
        distinguishing_aspect: "A WITHDRAWN offer is terminal: extend, counter, accept, decline and execute all fail; extend is shown with ERR_OFFER_NOT_EXTENDABLE."
        test_recipe:
          setup: ["Physician + case + offer extended then withdrawn"]
          setup_api_calls:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Ivy", specialty: "INTERNAL_MEDICINE", email: "ivy@x.com", hire_type: "EXPERIENCED" }, as: Recruiter, captures: { phys_id: "$.data.id" } }
            - { call: "POST /onboarding/onboarding-cases", payload: { physician_id: "${phys_id}", target_start_date: "2027-06-01" }, as: Recruiter, captures: { case_id: "$.data.id", case_v: "$.data.version" } }
            - { call: "POST /onboarding/offers", payload: { onboarding_case_id: "${case_id}", expected_onboarding_case_version: "${case_v}", base_salary_cents: 25000000, signing_bonus_cents: 2000000, guarantee_monthly_cents: 2000000, guarantee_term_months: 12, panel_capacity: 1000, proposed_start_date: "2027-06-01", expires_at: "2026-08-01T00:00:00Z" }, as: Recruiter, captures: { offer_id: "$.data.id" } }
            - { call: "POST /onboarding/offers/${offer_id}/extend", payload: {}, as: Recruiter }
            - { call: "POST /onboarding/offers/${offer_id}/withdraw", payload: { reason: "candidate ghosted" }, as: Recruiter, captures: { st: "$.data.status" } }
          trigger:
            - { call: "POST /onboarding/offers/${offer_id}/extend", payload: {}, as: Recruiter, captures: { err: "$.data.error_id" } }
          assert:
            - "Withdraw returned status == WITHDRAWN"
            - "Subsequent extend rejected with error_id == ERR_OFFER_NOT_EXTENDABLE (HTTP 409)"

      - name: credential_item_resubmit_loop_after_reject
        claim_type: valid_transition
        grounds: ["state_machines.CredentialItem.REJECTED_to_DOCS_SUBMITTED"]
        distinguishing_aspect: "The reject path is a loop, not a dead end: REJECTED -> submit-docs -> DOCS_SUBMITTED, and the item can then be verified (by a different user) and driven to APPROVED."
        test_recipe:
          setup: ["Physician + case; STATE_LICENSE item submitted by cs-1 then rejected"]
          setup_api_calls:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Jay", specialty: "CARDIOLOGY", email: "jay@x.com", hire_type: "EXPERIENCED" }, as: Recruiter, captures: { phys_id: "$.data.id" } }
            - { call: "POST /onboarding/onboarding-cases", payload: { physician_id: "${phys_id}", target_start_date: "2027-06-01" }, as: Recruiter, captures: { case_id: "$.data.id" } }
            - { call: "POST /onboarding/credential-items", payload: { onboarding_case_id: "${case_id}", item_type: "STATE_LICENSE", expires_on: "2028-06-01", document_ref: "doc-lic" }, as: CredentialingSpecialist, captures: { lic: "$.data.id" } }
            - { call: "POST /onboarding/credential-items/${lic}/submit-docs", payload: {}, as: CredentialingSpecialist, as_user_id: "cs-1" }
            - { call: "POST /onboarding/credential-items/${lic}/reject", payload: { reason: "blurry" }, as: OnboardingDirector }
          trigger:
            - { call: "POST /onboarding/credential-items/${lic}/submit-docs", payload: { document_ref: "doc-lic-v2" }, as: CredentialingSpecialist, as_user_id: "cs-1", captures: { st1: "$.data.status" } }
            - { call: "POST /onboarding/credential-items/${lic}/verify", payload: {}, as: CredentialingSpecialist, as_user_id: "cs-2", captures: { st2: "$.data.status" } }
            - { call: "POST /onboarding/credential-items/${lic}/file", payload: {}, as: CredentialingSpecialist, as_user_id: "cs-1" }
            - { call: "POST /onboarding/credential-items/${lic}/approve", payload: {}, as: OnboardingDirector, captures: { st3: "$.data.status" } }
          assert:
            - "Resubmission from REJECTED succeeds: status == DOCS_SUBMITTED (submitted_by_user_id refreshed to cs-1)"
            - "Verify by cs-2 (different from submitter) succeeds: status == VERIFIED"
            - "Item reaches APPROVED after file + approve"

      - name: module_failed_retake_cycle
        claim_type: valid_transition
        grounds: ["state_machines.TrainingModule.FAILED_to_SCHEDULED"]
        distinguishing_aspect: "FAILED is not terminal: the module can be re-scheduled and completed on retake, exercising the FAILED -> SCHEDULED -> COMPLETED cycle."
        test_recipe:
          setup: ["Executed offer pipeline; EHR_FUNDAMENTALS module scheduled then failed with score 70"]
          setup_api_calls:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Kat", specialty: "FAMILY_MEDICINE", email: "kat@x.com", hire_type: "EXPERIENCED" }, as: Recruiter, captures: { phys_id: "$.data.id" } }
            - { call: "POST /onboarding/onboarding-cases", payload: { physician_id: "${phys_id}", target_start_date: "2027-06-01" }, as: Recruiter, captures: { case_id: "$.data.id", case_v: "$.data.version" } }
            - { call: "POST /onboarding/offers", payload: { onboarding_case_id: "${case_id}", expected_onboarding_case_version: "${case_v}", base_salary_cents: 25000000, signing_bonus_cents: 2000000, guarantee_monthly_cents: 2000000, guarantee_term_months: 12, panel_capacity: 1000, proposed_start_date: "2027-06-01", expires_at: "2026-08-01T00:00:00Z" }, as: Recruiter, captures: { offer_id: "$.data.id" } }
            - { call: "POST /onboarding/offers/${offer_id}/extend", payload: {}, as: Recruiter }
            - { call: "POST /onboarding/offers/${offer_id}/accept", payload: {}, as: Physician, as_user_id: "${phys_id}" }
            - { call: "POST /onboarding/offers/${offer_id}/execute", payload: {}, as: ContractAdministrator }
            - { call: "GET /onboarding/training-plans?onboarding_case_id=${case_id}", payload: {}, as: PracticeManager, captures: { plan_id: "$.data[0].id" } }
            - { call: "GET /onboarding/training-modules?training_plan_id=${plan_id}&module_code=EHR_FUNDAMENTALS", payload: {}, as: PracticeManager, captures: { mod1: "$.data[0].id" } }
            - { call: "POST /onboarding/training-modules/${mod1}/schedule", payload: {}, as: PracticeManager }
            - { call: "POST /onboarding/training-modules/${mod1}/complete", payload: { score: 70 }, as: Physician, as_user_id: "${phys_id}", captures: { st_fail: "$.data.status" } }
          trigger:
            - { call: "POST /onboarding/training-modules/${mod1}/schedule", payload: { scheduled_on: "2026-05-20" }, as: PracticeManager, captures: { st1: "$.data.status" } }
            - { call: "POST /onboarding/training-modules/${mod1}/complete", payload: { score: 85 }, as: Physician, as_user_id: "${phys_id}", captures: { st2: "$.data.status" } }
          assert:
            - "First completion with 70 leaves status == FAILED"
            - "Retake schedule from FAILED succeeds: status == SCHEDULED"
            - "Second completion with 85 succeeds: status == COMPLETED"

      - name: held_event_cannot_be_cancelled
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.CampaignEvent", "errors[ERR_EVENT_NOT_PLANNED]"]
        distinguishing_aspect: "HELD is terminal for cancellation: costs of held events are sunk and cancel is rejected with ERR_EVENT_NOT_PLANNED; spent_cents is not refunded."
        test_recipe:
          setup: ["Physician + case; ACTIVE campaign; event created then held with 12 referrals"]
          setup_api_calls:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Lee", specialty: "PEDIATRICS", email: "lee@x.com", hire_type: "NEW_GRAD" }, as: Recruiter, captures: { phys_id: "$.data.id" } }
            - { call: "POST /onboarding/onboarding-cases", payload: { physician_id: "${phys_id}", target_start_date: "2027-06-01" }, as: Recruiter, captures: { case_id: "$.data.id" } }
            - { call: "POST /onboarding/referral-campaigns", payload: { onboarding_case_id: "${case_id}", name: "Launch", budget_cents: 1000000 }, as: PracticeManager, captures: { camp_id: "$.data.id" } }
            - { call: "POST /onboarding/referral-campaigns/${camp_id}/activate", payload: {}, as: PracticeManager }
            - { call: "POST /onboarding/campaign-events", payload: { campaign_id: "${camp_id}", event_type: "OPEN_HOUSE", start_date: "2027-04-05", end_date: "2027-04-05", cost_cents: 200000, venue: "Clinic" }, as: PracticeManager, captures: { ev1: "$.data.id" } }
            - { call: "POST /onboarding/campaign-events/${ev1}/hold", payload: { referrals_generated: 12 }, as: PracticeManager, captures: { st: "$.data.status" } }
          trigger:
            - { call: "POST /onboarding/campaign-events/${ev1}/cancel", payload: {}, as: PracticeManager, captures: { err: "$.data.error_id" } }
          assert:
            - "Hold succeeded with status == HELD; campaign.referrals_attributed == 12"
            - "Cancel rejected with error_id == ERR_EVENT_NOT_PLANNED (HTTP 409)"
            - "ReferralCampaign.${camp_id}.spent_cents == 200000 unchanged (held costs are not refunded)"

      - name: guarantee_settles_after_all_months_lapsed
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.IncomeGuarantee.ACTIVE_to_SETTLED", "state_machines.RampMilestone.PENDING_to_LAPSED"]
        distinguishing_aspect: "Epoch lapse of all 12 term months drives months_reconciled to 12 and reconcile settles the guarantee; each LAPSED month draws the full guarantee (total_advanced 24000000, forgiveness 0); a further reconcile on SETTLED fails with ERR_GUARANTEE_NOT_ACTIVE."
        test_recipe:
          setup:
            - "Executed offer pipeline (start 2027-06-01, monthly 2000000, term 12); guarantee ACTIVE at clock 2027-06-05"
            - "Clock advanced to 2028-08-01 (every reporting window closed) and epoch sweep run: all 12 milestones LAPSED"
          setup_api_calls:
