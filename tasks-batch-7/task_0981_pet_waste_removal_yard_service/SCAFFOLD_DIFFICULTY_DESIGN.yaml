  # =========================================================================
  # Rule 8 — resource_temporal_overlap (2 instances, different interval semantics)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: vacation_window_closed_interval_overlap
        grounds:
          - validations[priority=13]
          - errors[ERR_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource: Subscription. Interval semantics: closed-closed overlap on
          [start_date, end_date]. Two windows touching at a single shared date
          (end_date1 == start_date2) count as overlapping.
        test_recipe:
          setup:
            - "Subscription sub_n ACTIVE"
            - "VacationWindow vw_n1 SCHEDULED covering 2026-05-10..2026-05-15"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "N", email: "n@x.com", phone: "+14155550114" }
              as: OperationsManager
              captures: { cu_n: $.data.id }
            - call: "POST /api/yards"
              payload: { customer_id: "${cu_n}", address_line1: "12 Main", city: "SF", state_code: "CA", postal_code: "94110", yard_size_sqft: 1500, pet_count: 1, service_region_code: "R1" }
              as: OperationsManager
              captures: { y_n: $.data.id }
            - call: "POST /api/yards/${y_n}/access-profile"
              payload: { gate_access_code: "1", gate_instructions: "", pet_on_premises: false, pet_aggression_flag: "NONE" }
              as: OperationsManager
              captures: { pap_n: $.data.id }
            - call: "POST /api/property-access-profiles/${pap_n}/verify"
              payload: {}
              as: OperationsManager
            - call: "POST /api/subscription-plans"
              payload: { plan_code: "WN", display_name: "WN", visit_frequency: "WEEKLY", applies_to_multifamily: false, base_monthly_fee_cents: 10000, yard_tier_thresholds: [], yard_tier_surcharges_cents: [0], pet_tier_thresholds: [], pet_tier_surcharges_cents: [0] }
              as: OperationsManager
              captures: { pl_n: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/subscriptions"
              payload: { customer_id: "${cu_n}", yard_id: "${y_n}", plan_id: "${pl_n}" }
              as: Customer
              as_user_id: "${cu_n}"
              captures: { sub_n: $.data.id }
            - call: "POST /api/subscriptions/${sub_n}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cu_n}"
            - call: "POST /api/vacation-windows"
              payload: { subscription_id: "${sub_n}", start_date: "2026-05-10T00:00:00Z", end_date: "2026-05-15T00:00:00Z", skip_reason: "VACATION" }
              as: Customer
              as_user_id: "${cu_n}"
              captures: { vw_n1: $.data.id }
          trigger:
            - call: "POST /api/vacation-windows"
              payload: { subscription_id: "${sub_n}", start_date: "2026-05-15T00:00:00Z", end_date: "2026-05-20T00:00:00Z", skip_reason: "VACATION" }
              as: Customer
              as_user_id: "${cu_n}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_WINDOW_OVERLAP (closed-interval: shared endpoint 2026-05-15 counts as overlap)"
      - name: visit_window_overlap_with_buffer_half_open
        grounds:
          - validations[priority=15]
          - errors[ERR_VISIT_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Resource: ServiceRoute (different entity from Subscription). Interval
          semantics: half-open with 15-minute buffer. A new visit window
          [start, end) conflicts with an existing one if it intersects
          [existing.start - 15min, existing.end + 15min). Two visits scheduled
          back-to-back with a 20-minute gap DO conflict (gap < 30min buffer
          sum); two visits scheduled with a 30-minute gap do NOT conflict.
        test_recipe:
          setup:
            - "Subscription sub_o ACTIVE"
            - "Route rt_o cap 10"
            - "Visit v_o1 SCHEDULED 09:00-10:00 on 2026-05-08"
