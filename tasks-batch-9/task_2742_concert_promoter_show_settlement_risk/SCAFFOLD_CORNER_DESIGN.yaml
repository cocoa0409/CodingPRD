              captures: { fk_ttp_id: $.data.id }
            - call: "POST /shows/${fk_shp_id}/on-sale"
              payload: {}
              as: TalentBuyer
            - call: "POST /ticket-tiers/${fk_ttp_id}/sales"
              payload: { qty: 200 }
              as: TalentBuyer
            # ---- show Q: the future refund / insurance path -------------
            - call: "POST /shows"
              payload: { artist_id: "${fk_arq_id}", venue_id: "${fk_vn_id}", event_at: "2026-10-12T02:00:00.000Z", load_in_at: "2026-10-11T14:00:00.000Z", load_out_at: "2026-10-12T08:00:00.000Z", announce_at: "2026-08-01T00:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 0 }
              as: TalentBuyer
              captures: { fk_shq_id: $.data.id, fk_shq_v: $.data.version }
            - call: "POST /offers"
              payload: { show_id: "${fk_shq_id}", expected_show_version: "${fk_shq_v}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 1000000, deposit_cents: 100000, expense_cap_cents: 2000000 }
              as: TalentBuyer
              captures: { fk_ofq_id: $.data.id }
            - call: "POST /offers/${fk_ofq_id}/submit"
              payload: {}
              as: TalentBuyer
            - call: "POST /offers/${fk_ofq_id}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${fk_arq_id}"
            - call: "POST /budget-lines"
              payload: { show_id: "${fk_shq_id}", category: "PRODUCTION", description: "Staging and lights", budgeted_cents: 1000000, is_artist_deductible: false }
              as: TourAccountant
              captures: { fk_blq_id: $.data.id }
            - call: "POST /vendor-invoices"
              payload: { show_id: "${fk_shq_id}", budget_line_id: "${fk_blq_id}", vendor_name: "Staging Partners", amount_cents: 1000000, invoice_date: "2026-08-01T00:00:00.000Z", documentation_ref: "PKT-Q-01" }
              as: TourAccountant
              captures: { fk_viq_id: $.data.id }
            - call: "POST /vendor-invoices/${fk_viq_id}/verify"
              payload: {}
