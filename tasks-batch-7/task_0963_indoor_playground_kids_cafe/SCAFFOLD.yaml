scenario: "963. Indoor Playground & Kids' Café: timed-session & capacity, sock/waiver & membership, party room & package, café order & allergen, walk-in vs reservation, staff & sanitation, lost-child & incident, loyalty"

domain_name: indoor-playground-kids-cafe
api_prefix: "/"

# =============================================================================
# Complexity Profile (harder-than-expert calibration: dense coupling, flat
# topology, temporal-windowing + quota allocation, 15 entities / 74 endpoints)
# =============================================================================
complexity_profile:
  primary_archetype: "Temporal windowing"
  secondary_archetype: "Quota / allocation"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: flat            # peer entities joined by FK references; no URL nesting for identity
  state_machine_shape: parallel    # Visit carries admission_status x payment_status; PartyBooking cyclic; Incident cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: hierarchical_override  # Manager superset of FrontDesk + CafeStaff; Admin config-only; Guardian self-service
  consistency_model: immediate
  entity_count: 15
  state_machine_count: 8
  calculation_count: 7
  endpoint_count: 74
  error_code_count: 32
  role_count: 6

# =============================================================================
# §1.1 Entity-Relationship Table
# common_fields: true => id (UUID, no prefix), created_at, updated_at (ISO8601
# UTC, 3 fractional digits), version (integer, starts 1, +1 per mutation).
# =============================================================================
entities:
  - name: MembershipPlan
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Plan display name" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Monthly price in cents" }
      - { name: included_session_credits, type: integer, source: input, description: "Play-session credits granted once at enrollment" }
      - { name: party_discount_pct, type: number, source: input, description: "Party booking discount fraction, e.g. 0.10" }
      - { name: cafe_discount_pct, type: number, source: input, description: "Per-line cafe discount fraction, e.g. 0.10" }
      - { name: socks_included, type: boolean, source: input, description: "Whether grip socks are provided free at check-in" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED", default: ACTIVE }

  - name: Guardian
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Guardian display name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: phone, type: string, source: input, description: "Contact phone" }
      - { name: membership_plan_id, type: string, source: input, description: "FK -> MembershipPlan.id; null when no membership", default: null }
      - { name: membership_status, type: enum, source: system, description: "NONE | ACTIVE | CANCELLED", default: NONE }
      - { name: credits_granted, type: integer, source: system, description: "Session credits granted at enrollment", default: 0 }
      - { name: credits_consumed, type: integer, source: computed, description: "Credits consumed by COMPLETED or NO_SHOW credit visits (calc membership_credit_balance)" }
      - { name: credits_held, type: integer, source: computed, description: "Credits held by RESERVED or CHECKED_IN credit visits" }
      - { name: credits_available, type: integer, source: computed, description: "AVAILABLE_NOW variant: credits_granted - credits_consumed - credits_held" }
      - { name: credits_statement, type: integer, source: computed, description: "STATEMENT variant: credits_granted - credits_consumed (excludes holds)" }
      - { name: lifetime_points, type: integer, source: computed, description: "Cumulative loyalty points ever earned plus positive adjustments minus reversals (floor 0); drives loyalty_tier" }
      - { name: points_balance, type: integer, source: computed, description: "Spendable points: sum(EARN) - sum(REDEEM) + sum(signed ADJUSTMENT/REVERSAL) over LoyaltyTransaction" }
      - { name: loyalty_tier, type: enum, source: computed, description: "BRONZE | SILVER | GOLD from lifetime_points thresholds (calc loyalty_tier_assignment)", default: BRONZE }

  - name: Child
    parent: null
    common_fields: true
    fields:
      - { name: guardian_id, type: string, source: input, description: "FK -> Guardian.id; owning guardian" }
      - { name: full_name, type: string, source: input, description: "Child display name" }
      - { name: birth_date, type: string, source: input, description: "ISO date of birth; age at slot date must be 1..12 inclusive" }
      - { name: allergies, type: array, source: input, description: "Allergen codes: PEANUT | TREE_NUT | MILK | EGG | WHEAT | SOY | FISH | SESAME", default: [] }

  - name: Waiver
    parent: null
    common_fields: true
    fields:
      - { name: guardian_id, type: string, source: input, description: "FK -> Guardian.id; signing guardian" }
      - { name: signed_at, type: datetime, source: system, description: "Logical clock time at signing" }
      - { name: expires_at, type: datetime, source: system, description: "signed_at + 365 days" }
      - { name: status, type: enum, source: system, description: "SIGNED | SUPERSEDED | EXPIRED", default: SIGNED }

  - name: SessionSlot
    parent: null
    common_fields: true
    fields:
      - { name: slot_date, type: string, source: input, description: "ISO date of the slot" }
      - { name: start_at, type: datetime, source: input, description: "Slot start (UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Slot end (UTC); half-open [start_at, end_at); adjacency allowed" }
      - { name: capacity, type: integer, source: input, description: "Max children occupancy at any moment" }
      - { name: reservation_quota, type: integer, source: computed, description: "floor(capacity * 0.7); recomputed on capacity change" }
      - { name: reserved_count, type: integer, source: computed, description: "Visits on slot with admission_status RESERVED" }
      - { name: checked_in_count, type: integer, source: computed, description: "Visits on slot with admission_status CHECKED_IN" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN | CLOSED", default: SCHEDULED }
      - { name: close_reason, type: string, source: system, description: "MANAGER_CLOSE | EMERGENCY | OPS_ENDED, null until closed", default: null }

  - name: Visit
    parent: null
    common_fields: true
    fields:
      - { name: session_slot_id, type: string, source: input, description: "FK -> SessionSlot.id" }
      - { name: child_id, type: string, source: input, description: "FK -> Child.id" }
      - { name: guardian_id, type: string, source: input, description: "FK -> Guardian.id" }
      - { name: visit_type, type: enum, source: input, description: "RESERVATION | WALK_IN" }
      - { name: booked_duration_minutes, type: integer, source: input, description: "Booked length; required for RESERVATION, optional for WALK_IN" }
      - { name: use_credit, type: boolean, source: input, description: "Consume a membership credit instead of payment", default: false }
      - { name: admission_status, type: enum, source: system, description: "RESERVED | CHECKED_IN | COMPLETED | CANCELLED | NO_SHOW | EVACUATED" }
      - { name: payment_status, type: enum, source: system, description: "PENDING | PREPAID | SETTLED | REFUNDED (parallel dimension, independent of admission_status)" }
      - { name: sock_method, type: enum, source: system, description: "NONE | OWN_GRIP_SOCKS | PURCHASED | MEMBERSHIP_PROVIDED; set at check-in", default: NONE }
      - { name: grip_socks_order_id, type: string, source: input, description: "CafeOrder id proving sock purchase when sock_method=PURCHASED", default: null }
      - { name: quoted_cents, type: integer, source: computed, description: "PROVISIONAL block-price quote (calc visit_session_charge); null for WALK_IN" }
      - { name: final_charge_cents, type: integer, source: computed, description: "FINAL tiered per-minute charge at check-out/evacuation; null until then" }
      - { name: refund_delta_cents, type: integer, source: computed, description: "quoted_cents - final_charge_cents when PREPAID overpaid; 0 otherwise" }
      - { name: checked_in_at, type: datetime, source: system, description: "Logical clock at check-in", default: null }
      - { name: checked_out_at, type: datetime, source: system, description: "Logical clock at check-out/evacuation", default: null }

  - name: PartyRoom
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Room name" }
      - { name: capacity_children, type: integer, source: input, description: "Max children for a party" }
      - { name: status, type: enum, source: system, description: "ACTIVE | MAINTENANCE | CLOSED", default: ACTIVE }

  - name: PartyPackage
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Package name" }
      - { name: duration_minutes, type: integer, source: input, description: "Party duration; booking end_at = start_at + duration" }
      - { name: base_price_cents, type: integer, source: input, description: "Base package price" }
      - { name: included_children, type: integer, source: input, description: "Children covered by base price" }
      - { name: extra_child_price_cents, type: integer, source: input, description: "Per-child price beyond included_children" }
      - { name: cafe_credit_cents, type: integer, source: input, description: "Informational cafe credit bundled with package" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED", default: ACTIVE }

  - name: PartyBooking
    parent: null
    common_fields: true
    fields:
      - { name: party_room_id, type: string, source: input, description: "FK -> PartyRoom.id" }
      - { name: party_package_id, type: string, source: input, description: "FK -> PartyPackage.id" }
      - { name: guardian_id, type: string, source: input, description: "FK -> Guardian.id" }
      - { name: start_at, type: datetime, source: input, description: "Party start (UTC)" }
      - { name: end_at, type: datetime, source: computed, description: "start_at + package.duration_minutes" }
      - { name: child_count, type: integer, source: input, description: "Expected children; must be <= room capacity_children" }
      - { name: status, type: enum, source: system, description: "HELD | CONFIRMED | RESCHEDULE_REQUESTED | COMPLETED | CANCELLED | EXPIRED" }
      - { name: quoted_total_cents, type: integer, source: computed, description: "Full quote (calc party_booking_quote)" }
      - { name: deposit_cents, type: integer, source: computed, description: "max(5000, round_half_up(0.20 * quoted_total_cents))" }
      - { name: deposit_paid, type: boolean, source: system, description: "Set true by confirm", default: false }
      - { name: proposed_start_at, type: datetime, source: input, description: "Requested new start while RESCHEDULE_REQUESTED", default: null }
      - { name: refund_cents, type: integer, source: computed, description: "Deposit refunded on cancel per cancellation waterfall", default: 0 }

  - name: CafeMenuItem
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Menu item name" }
      - { name: price_cents, type: integer, source: input, description: "Unit price" }
      - { name: allergen_tags, type: array, source: input, description: "Allergen codes present in this item", default: [] }
      - { name: is_grip_socks, type: boolean, source: input, description: "True for the grip-socks retail item", default: false }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED", default: ACTIVE }

  - name: CafeOrder
    parent: null
    common_fields: true
    fields:
      - { name: guardian_id, type: string, source: input, description: "FK -> Guardian.id" }
      - { name: visit_id, type: string, source: input, description: "FK -> Visit.id; optional link to a visit", default: null }
      - { name: party_booking_id, type: string, source: input, description: "FK -> PartyBooking.id; optional party pre-order link", default: null }
      - { name: child_ids, type: array, source: input, description: "Child ids the food is for; drives allergen safety check", default: [] }
      - { name: lines, type: array, source: input, description: "[{menu_item_id, quantity, unit_price_cents, line_total_cents}]; unit/line totals system-filled" }
      - { name: points_to_redeem, type: integer, source: input, description: "Points to redeem (1 point = 1 cent)", default: 0 }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of per-line rounded discounted line totals (calc cafe_order_total)" }
      - { name: points_redeemed, type: integer, source: computed, description: "Points actually applied", default: 0 }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents - points_redeemed" }
      - { name: points_earned, type: integer, source: computed, description: "floor(total_cents/100) * tier multiplier, granted at serve", default: 0 }
      - { name: status, type: enum, source: system, description: "PLACED | PREPARING | SERVED | CANCELLED" }

  - name: LoyaltyTransaction
    parent: null
    common_fields: false
    fields:
      - { name: guardian_id, type: string, source: input, description: "FK -> Guardian.id" }
      - { name: kind, type: enum, source: system, description: "EARN | REDEEM | REVERSAL | ADJUSTMENT" }
      - { name: points, type: integer, source: system, description: "Signed points (EARN positive, REDEEM negative, REVERSAL sign restoring balance, ADJUSTMENT signed)" }
      - { name: balance_after, type: integer, source: computed, description: "points_balance immediately after this transaction" }
      - { name: note, type: string, source: input, description: "Free-text reason" }

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Staff name" }
      - { name: role, type: enum, source: input, description: "FRONT_DESK | CAFE_STAFF | MANAGER; must match X-User-Role when acting" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE", default: ACTIVE }

  - name: SanitationTask
    parent: null
    common_fields: true
    fields:
      - { name: party_room_id, type: string, source: input, description: "FK -> PartyRoom.id; room to sanitize" }
      - { name: kind, type: enum, source: input, description: "DEEP_CLEAN | BALL_PIT_WASH | SURFACE_WIPE" }
      - { name: due_at, type: datetime, source: input, description: "Deadline (UTC); ops run flags OVERDUE when passed" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | OVERDUE | COMPLETED" }
      - { name: checklist_passed, type: boolean, source: input, description: "Required true at completion" }
      - { name: completed_at, type: datetime, source: system, description: "Logical clock at completion", default: null }

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - { name: visit_id, type: string, source: input, description: "FK -> Visit.id; optional linked visit (required for LOST_CHILD)", default: null }
      - { name: kind, type: enum, source: input, description: "LOST_CHILD | INJURY | PROPERTY_DAMAGE | BEHAVIOR" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | CRITICAL" }
      - { name: description, type: string, source: input, description: "Free-text description" }
      - { name: status, type: enum, source: system, description: "OPEN | TRIAGED | RESOLVED | CLOSED" }
      - { name: child_reunited, type: boolean, source: input, description: "Required true to resolve a LOST_CHILD incident" }
      - { name: resolution_note, type: string, source: input, description: "Resolution free text", default: null }
      - { name: resolved_at, type: datetime, source: system, description: "Logical clock at resolution", default: null }
      - { name: reported_by_staff_id, type: string, source: system, description: "X-User-ID of the reporting staff member (audit only, not an FK)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SessionSlot
    field: status
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /session-slots/{id}/open"
        actor: Manager
        preconditions:
          - "slot.status == SCHEDULED"
        side_effects:
          - "slot.status = OPEN; bumps SessionSlot.version"
      - from: [SCHEDULED, OPEN]
        to: CLOSED
        trigger: "POST /session-slots/{id}/close (Manager, reason MANAGER_CLOSE|EMERGENCY) or system ops run when end_at <= now (reason OPS_ENDED)"
        actor: "Manager or system"
        preconditions: []
        side_effects:
          - "Hop 1 (cascade down): every Visit on the slot in RESERVED -> CANCELLED; every Visit in CHECKED_IN -> EVACUATED with checked_out_at = now"
          - "Hop 2a (compensation): each cancelled RESERVED credit visit releases its credit hold (Guardian.credits_held -= 1); each cancelled PREPAID visit flips payment_status -> REFUNDED"
          - "Hop 2b: each EVACUATED visit computes final_charge_cents = round_half_up(0.5 * tiered_charge(elapsed_minutes)) and, if PREPAID, refund_delta_cents = quoted_cents - final_charge_cents, payment_status -> REFUNDED; credit visits restore the held credit (credits_held -= 1, never consumed)"
          - "Hop 3 (cross-entity): every Guardian with a visit cancelled or evacuated by this close receives a +200-point LoyaltyTransaction ADJUSTMENT (compensation), recomputing points_balance and lifetime_points"
          - "COMPLETED/CANCELLED/NO_SHOW visits are untouched"
          - "slot.close_reason set; bumps SessionSlot.version"

  - entity: Visit
    field: admission_status
    initial_state: RESERVED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW, EVACUATED]
    note: "WALK_IN visits are created directly in CHECKED_IN (desk admission performs all check-in validations at creation). Parallel dimension payment_status evolves independently (see below)."
    transitions:
      - from: RESERVED
        to: CHECKED_IN
        trigger: "POST /visits/{id}/check-in"
        actor: "FrontDesk (Manager override)"
        preconditions:
          - "session slot status == OPEN (else ERR_SLOT_NOT_OPEN)"
          - "now within [slot.start_at - 10min, slot.start_at + 15min] (else ERR_CHECKIN_WINDOW_CLOSED)"
          - "guardian has a current waiver (status SIGNED, expires_at > now) (else ERR_WAIVER_INVALID)"
          - "sock_method resolvable: OWN_GRIP_SOCKS always ok; MEMBERSHIP_PROVIDED requires guardian membership ACTIVE on a plan with socks_included=true (else ERR_GRIP_SOCKS_REQUIRED); PURCHASED requires grip_socks_order_id referencing a SERVED CafeOrder of this guardian, created on the slot date, containing an is_grip_socks line (else ERR_GRIP_SOCKS_REQUIRED)"
        side_effects:
          - "admission_status = CHECKED_IN; checked_in_at = now; sock_method recorded"
          - "slot.checked_in_count +1 / reserved_count -1 (derived recomputation)"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /visits/{id}/check-out"
        actor: "FrontDesk (Manager override)"
        preconditions:
          - "no Incident with kind=LOST_CHILD and status in {OPEN, TRIAGED} linked to this visit (else ERR_LOST_CHILD_UNRESOLVED)"
        side_effects:
          - "checked_out_at = now; final_charge_cents = FINAL tiered charge over elapsed minutes (calc visit_session_charge), membership cafe/visit discounts applied where eligible"
          - "payment reconciliation: PENDING -> SETTLED (collect final); PREPAID -> SETTLED with refund_delta_cents = max(0, quoted_cents - final_charge_cents)"
          - "credit visits: held credit becomes consumed (Guardian.credits_held -1, credits_consumed +1); monetary charge waived"
          - "loyalty: non-credit visits earn floor(final_charge_cents/100) * tier_multiplier points (EARN transaction)"
          - "slot.checked_in_count -1"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /visits/{id}/cancel or system (slot close, quota-reduction cascade)"
        actor: "Guardian (own), FrontDesk, Manager, system"
        preconditions:
          - "Guardian-initiated cancel requires now < slot.start_at (else ERR_CANCEL_CUTOFF); staff/system cancel unrestricted"
        side_effects:
          - "credit hold released if use_credit; PREPAID payment_status -> REFUNDED; slot.reserved_count -1"
      - from: RESERVED
        to: NO_SHOW
        trigger: "system ops run: RESERVED and now >= slot.start_at + 15min"
        actor: system
        preconditions: []
        side_effects:
          - "credit visit: held credit becomes consumed (no-show penalty); PREPAID visit forfeits payment (payment_status stays PREPAID, no refund)"
          - "slot.reserved_count -1"
      - from: CHECKED_IN
        to: EVACUATED
        trigger: "system (slot emergency/manager close)"
        actor: system
        preconditions: []
        side_effects:
          - "see SessionSlot close cascade (50% tiered charge, compensation points, credit restore)"

  - entity: Visit
    field: payment_status
    initial_state: PENDING
    terminal_states: [SETTLED, REFUNDED]
    note: "Parallel dimension: evolves independently of admission_status. Credit visits stay PENDING until completion (then SETTLED with 0 monetary charge)."
    transitions:
      - from: PENDING
        to: PREPAID
        trigger: "POST /visits/{id}/pay"
        actor: "Guardian (own), FrontDesk"
        preconditions:
          - "admission_status == RESERVED"
          - "use_credit == false (credit visits cannot be prepaid)"
        side_effects:
          - "collect quoted_cents"
      - from: [PENDING, PREPAID]
        to: SETTLED
        trigger: "check-out reconciliation (system, inside POST /visits/{id}/check-out)"
        actor: system
        preconditions: []
        side_effects:
          - "final charge collected or refund_delta_cents recorded"
      - from: [PENDING, PREPAID]
        to: REFUNDED
        trigger: "system (cancel / slot close / quota-reduction cascade) — PENDING->REFUNDED only for EVACUATED-or-cancelled prepaid; PENDING unpaid visits are simply CANCELLED without refund record"
        actor: system
        preconditions:
          - "payment_status == PREPAID for REFUNDED; PENDING visits skip this transition"
        side_effects:
          - "quoted_cents (or refund_delta-adjusted remainder) returned"

  - entity: PartyBooking
    field: status
    initial_state: HELD
    terminal_states: [COMPLETED, CANCELLED, EXPIRED]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /party-bookings/{id}/confirm"
        actor: "Guardian (own)"
        preconditions:
          - "PartyRoom.status == ACTIVE (else ERR_ROOM_INACTIVE)"
          - "no SanitationTask on the room with status OVERDUE (else ERR_SANITATION_OVERDUE)"
          - "room time window still conflict-free (re-checked)"
        side_effects:
          - "deposit_paid = true (collect deposit_cents); status = CONFIRMED"
      - from: CONFIRMED
        to: RESCHEDULE_REQUESTED
        trigger: "POST /party-bookings/{id}/request-reschedule"
        actor: "Guardian (own)"
        preconditions:
          - "now <= start_at - 48h (else ERR_RESCHEDULE_CUTOFF)"
        side_effects:
          - "proposed_start_at recorded"
      - from: RESCHEDULE_REQUESTED
        to: CONFIRMED
        trigger: "POST /party-bookings/{id}/approve-reschedule"
        actor: Manager
        preconditions:
          - "room conflict-free for proposed window incl. cleanup buffer (else ERR_ROOM_TIME_CONFLICT)"
        side_effects:
          - "start_at = proposed_start_at; end_at recomputed; quote re-computed (peak flag may change); status returns to CONFIRMED (cyclic loop)"
      - from: RESCHEDULE_REQUESTED
        to: CONFIRMED
        trigger: "POST /party-bookings/{id}/approve-reschedule with approval=false is NOT offered; rejection is implicit: Guardian cancels the request by calling cancel or awaiting ops; NOT a separate endpoint"
        actor: system
        preconditions: []
        side_effects: []
        note: "Placeholder kept out of the API surface; only the approve path exists."
      - from: [HELD, CONFIRMED]
        to: CANCELLED
        trigger: "POST /party-bookings/{id}/cancel"
        actor: "Guardian (own), Manager"
        preconditions: []
        side_effects:
          - "Hop 1: status = CANCELLED; refund waterfall on deposit: now <= start_at - 7d => 100%; start_at - 7d < now <= start_at - 48h => 50% (round_half_up); now > start_at - 48h => 0%. refund_cents recorded."
          - "Hop 2 (cascade): every linked CafeOrder (party_booking_id == this) in PLACED or PREPARING -> CANCELLED"
          - "Hop 3 (compensation): each cancelled CafeOrder restores its points_redeemed via a REVERSAL LoyaltyTransaction (+points_redeemed), recomputing Guardian.points_balance; SERVED orders keep earned points"
          - "HOLD deposit unpaid => refund_cents = 0"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /party-bookings/{id}/complete"
        actor: Manager
        preconditions:
          - "now >= end_at (party has run)"
        side_effects:
          - "remaining balance (quoted_total_cents - deposit_cents) collected"
      - from: HELD
        to: EXPIRED
        trigger: "system ops run: HELD and now >= created_at + 24h"
        actor: system
        preconditions: []
        side_effects:
          - "hold released; no refund (deposit never paid)"

  - entity: CafeOrder
    field: status
    initial_state: PLACED
    terminal_states: [SERVED, CANCELLED]
    transitions:
      - from: PLACED
        to: PREPARING
        trigger: "POST /cafe-orders/{id}/start-preparing"
        actor: "CafeStaff (Manager override)"
        preconditions: []
        side_effects: []
      - from: PREPARING
        to: SERVED
        trigger: "POST /cafe-orders/{id}/serve"
        actor: "CafeStaff (Manager override)"
        preconditions: []
        side_effects:
          - "points_earned = floor(total_cents/100) * tier_multiplier(loyalty_tier at serve time); EARN LoyaltyTransaction; Guardian.points_balance/lifetime_points recomputed"
      - from: [PLACED, PREPARING]
        to: CANCELLED
        trigger: "POST /cafe-orders/{id}/cancel or system (party booking cancel cascade)"
        actor: "Guardian (own), Manager, system"
        preconditions: []
        side_effects:
          - "points_redeemed restored via REVERSAL (+points_redeemed); earned points (if any) reversed"

  - entity: SanitationTask
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /sanitation-tasks/{id}/start"
        actor: "FrontDesk, Manager"
        preconditions: []
        side_effects: []
      - from: [SCHEDULED, IN_PROGRESS]
        to: OVERDUE
        trigger: "system ops run: due_at <= now and status != COMPLETED"
        actor: system
        preconditions: []
        side_effects:
          - "blocks PartyBooking confirm on the room (ERR_SANITATION_OVERDUE)"
      - from: [SCHEDULED, IN_PROGRESS, OVERDUE]
        to: COMPLETED
        trigger: "POST /sanitation-tasks/{id}/complete"
        actor: "FrontDesk, Manager"
        preconditions:
          - "checklist_passed == true (else ERR_VALIDATION)"
        side_effects:
          - "completed_at = now"

  - entity: Incident
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: TRIAGED
        trigger: "POST /incidents/{id}/triage"
        actor: Manager
        preconditions: []
        side_effects:
          - "LOST_CHILD incidents gate the linked visit's check-out (ERR_LOST_CHILD_UNRESOLVED)"
      - from: TRIAGED
        to: RESOLVED
        trigger: "POST /incidents/{id}/resolve"
        actor: Manager
        preconditions:
          - "kind == LOST_CHILD requires child_reunited == true (else ERR_CHILD_NOT_REUNITED)"
        side_effects:
          - "resolved_at = now; linked-visit check-out gate lifted"
      - from: RESOLVED
        to: TRIAGED
        trigger: "POST /incidents/{id}/reopen (cyclic revision loop)"
        actor: Manager
        preconditions: []
        side_effects:
          - "resolved_at cleared; LOST_CHILD gate re-engages"
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /incidents/{id}/close"
        actor: Manager
        preconditions: []
        side_effects: []

  - entity: Waiver
    field: status
    initial_state: SIGNED
    terminal_states: [SUPERSEDED, EXPIRED]
    transitions:
      - from: SIGNED
        to: SUPERSEDED
        trigger: "system (new waiver created for the same guardian — create-with-supersede, guarded by OCC rule waiver-create-stale-guardian)"
        actor: system
        preconditions: []
        side_effects:
          - "only the newest waiver may remain SIGNED"
      - from: SIGNED
        to: EXPIRED
        trigger: "system ops run: expires_at <= now"
        actor: system
        preconditions: []
        side_effects:
          - "check-in blocked until a new waiver is signed (ERR_WAIVER_INVALID)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version; stale-view rejection only)
# =============================================================================
concurrency_rules:
  - rule_id: waiver-create-stale-guardian
    parent_entity: Guardian
    write_endpoint: "POST /guardians/{id}/waivers"
    occ_field: "expected_guardian_version"
    description: |
      Creating a waiver for a Guardian whose version has advanced since the
      client last observed it is rejected: a newer waiver may already have
      superseded the client's view, so the stale writer must re-read before
      signing. Expressed purely as a stale-version check on Guardian.version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: slot-update-stale-version
    parent_entity: SessionSlot
    write_endpoint: "PATCH /session-slots/{id}"
    occ_field: "expected_session_slot_version"
    description: |
      Updating a SessionSlot's capacity against a version the client no longer
      holds is rejected; the client must re-read the slot (counters may have
      moved) before resizing, so the quota-reduction cascade never runs from a
      stale view.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: party-booking-create-stale-room
    parent_entity: PartyRoom
    write_endpoint: "POST /party-bookings"
    occ_field: "expected_party_room_version"
    description: |
      Creating a PartyBooking against a PartyRoom whose version has advanced
      since the client last read it is rejected; the room's booking-derived
      state may have changed (each created booking bumps PartyRoom.version),
      so a stale availability view cannot anchor a new booking.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: visit_session_charge
    trigger: "visit creation (PROVISIONAL quote) and check-out / evacuation (FINAL charge)"
    algorithm: tiered_pricing
    formula: |
      PROVISIONAL (at RESERVATION creation, from booked_duration_minutes):
        blocks = ceil(booked_duration_minutes / 60)
        quoted_cents = 1200 + (blocks - 1) * 900
      FINAL (at check-out, from actual elapsed minutes = ceil((checked_out_at - checked_in_at)/60s)):
        m = elapsed_minutes
        tiered = min(m,60)*20 + max(0,min(m,120)-60)*15 + max(0,m-120)*10
        if guardian membership ACTIVE: tiered = round_half_up(tiered * (1 - 0.10))
        final_charge_cents = tiered
      EVACUATION (slot close while CHECKED_IN):
        final_charge_cents = round_half_up(0.5 * tiered(elapsed_minutes))
    input_set: "the Visit, its Guardian.membership_status"
    constants:
      FIRST_BLOCK_CENTS: 1200
      EXTRA_BLOCK_CENTS: 900
      BLOCK_MINUTES: 60
      TIER1_CENTS_PER_MIN: 20
      TIER2_CENTS_PER_MIN: 15
      TIER3_CENTS_PER_MIN: 10
      MEMBER_VISIT_DISCOUNT_PCT: 0.10
      EVACUATION_CHARGE_PCT: 0.50
    precision: "integer cents, round_half_up at each multiplication"
    variants:
      - name: PROVISIONAL
        when: "reservation creation / display before check-out"
        difference: "flat per-started-60-min-block price; for a 90-minute booking yields 2100"
      - name: FINAL
        when: "check-out / evacuation"
        difference: "per-minute tiered price over actual elapsed minutes; for the same 90 minutes yields 1650 (member: 1485)"

  - name: membership_credit_balance
    trigger: "guardian read, credit visit create/cancel/complete/no-show/slot-close"
    algorithm: aggregation
    formula: |
      credits_consumed = count of guardian's use_credit visits with admission_status in {COMPLETED, NO_SHOW}
      credits_held     = count of guardian's use_credit visits with admission_status in {RESERVED, CHECKED_IN}
      credits_granted  = plan.included_session_credits if membership ACTIVE else 0 (frozen at grant; cancel forfeits available)
    input_set: "Visits of the guardian filtered by admission_status as above"
    variants:
      - name: AVAILABLE_NOW
        when: "real-time availability checks (credit reservation gate)"
        difference: "credits_available = credits_granted - credits_consumed - credits_held (forward-looking: holds count)"
      - name: STATEMENT
        when: "statement/reporting view"
        difference: "credits_statement = credits_granted - credits_consumed (chronological: only settled consumption counts; a held-but-unused credit still shows as available on the statement)"

  - name: party_booking_quote
    trigger: "party booking creation and reschedule approval"
    algorithm: tiered_pricing
    formula: |
      extra_children  = max(0, child_count - package.included_children)
      subtotal        = package.base_price_cents + extra_children * package.extra_child_price_cents
      peak_surcharge  = round_half_up(subtotal * 0.15) if start_at falls on Saturday/Sunday (UTC) else 0
      discount_pct    = min(guardian plan.party_discount_pct if membership ACTIVE else 0, 0.25)
      discount        = round_half_up((subtotal + peak_surcharge) * discount_pct)
      quoted_total_cents = subtotal + peak_surcharge - discount
      deposit_cents   = max(5000, round_half_up(0.20 * quoted_total_cents))
    input_set: "PartyBooking inputs, PartyPackage, Guardian membership plan"
    constants:
      PEAK_SURCHARGE_PCT: 0.15
      MAX_PARTY_DISCOUNT_PCT: 0.25
      MIN_DEPOSIT_CENTS: 5000
      DEPOSIT_PCT: 0.20
    precision: "integer cents, round_half_up per stage in the order shown (surcharge, then discount, then deposit)"

  - name: cafe_order_total
    trigger: "cafe order creation"
    algorithm: aggregation
    formula: |
      PINNED ROUNDING ORDER (per-line first, then sum — never sum-then-round):
        for each line: line_total = round_half_up(unit_price_cents * quantity * (1 - cafe_discount_pct))
          where cafe_discount_pct = guardian plan.cafe_discount_pct if membership ACTIVE else 0
        subtotal_cents = sum(line_total)
      redemption: points_redeemed = min(points_to_redeem, guardian.points_balance, floor(subtotal_cents / 2))
        requesting points_to_redeem > floor(subtotal_cents/2) => ERR_REDEMPTION_CAP_EXCEEDED
        requesting points_to_redeem > balance => ERR_INSUFFICIENT_POINTS
      total_cents = subtotal_cents - points_redeemed
    input_set: "order lines, CafeMenuItem prices, Guardian membership + points"
    precision: "integer cents, round_half_up per line BEFORE summing"

  - name: loyalty_redemption_and_earn
    trigger: "cafe order placement (redeem) and serve (earn); visit check-out (earn)"
    algorithm: threshold
    formula: |
      CIRCULAR-LOOKING DEPENDENCY, PINNED ORDER:
        1. compute subtotal and total (cafe_order_total)
        2. apply redemption (REDEEM transaction, -points_redeemed)
        3. points_earned = floor(total_cents / 100) * tier_multiplier  -- earned on the POST-redemption amount only
      tier_multiplier: BRONZE=1, SILVER=2, GOLD=3 (tier read at the moment of earning)
      Visit completion earns floor(final_charge_cents/100) * tier_multiplier; credit visits earn 0.
    input_set: "CafeOrder/Visit monetary totals, Guardian.loyalty_tier"
    constants:
      CENTS_PER_POINT: 100
      MULTIPLIER_BRONZE: 1
      MULTIPLIER_SILVER: 2
      MULTIPLIER_GOLD: 3
    precision: "integer points, floor division"

  - name: loyalty_tier_assignment
    trigger: "ops run (recompute) — reads lifetime_points"
    algorithm: threshold
    formula: |
      GOLD   if lifetime_points >= 5000
      SILVER if lifetime_points >= 1000
      BRONZE otherwise
      Boundary is inclusive (>=): exactly 1000 => SILVER, exactly 5000 => GOLD.
    input_set: "Guardian.lifetime_points"
    constants:
      SILVER_THRESHOLD: 1000
      GOLD_THRESHOLD: 5000

  - name: session_slot_load
    trigger: "visit create/check-in/check-out/cancel/no-show; slot capacity patch"
    algorithm: aggregation
    formula: |
      reservation_quota = floor(capacity * 0.7)
      reserved_count    = count(visits on slot with admission_status == RESERVED)
      checked_in_count  = count(visits on slot with admission_status == CHECKED_IN)
      reservation create allowed iff reserved_count < reservation_quota   (boundary: reserved_count == quota => full)
      walk-in create allowed iff reserved_count + checked_in_count < capacity (boundary: == capacity => full)
      capacity PATCH: new capacity < checked_in_count => ERR_CAPACITY_BELOW_OCCUPANCY;
        if reserved_count > new quota: cancel RESERVED visits newest-first
        (Visit.created_at DESC, tie-break quoted_cents DESC) until reserved_count <= new quota
    input_set: "Visits on the slot filtered by admission_status"
    constants:
      RESERVATION_QUOTA_PCT: 0.7

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number wins)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and a declared role; X-User-ID present for entity_backed roles", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all except endpoints listing Anonymous" }
  - { priority: 2, category: auth, check: "Role permitted per endpoint roles; staff roles require an ACTIVE StaffMember whose role matches X-User-Role; Guardian may only act on own resources (guardian_id path/body == X-User-ID)", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path ids and body FK references exist (left-to-right)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: state, check: "Target resource in a valid from-state for the transition (incl. slot OPEN for check-in, order PLACED/PREPARING, booking HELD/CONFIRMED)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 4, category: state, check: "Session slot must be OPEN for check-in and for new visits", error_id: ERR_SLOT_NOT_OPEN, http_status: 409, applies_to: "POST /visits, POST /visits/{id}/check-in" }
  - { priority: 5, category: business_safety, check: "Guardian holds a current waiver (SIGNED, expires_at > now)", error_id: ERR_WAIVER_INVALID, http_status: 422, applies_to: "POST /visits (WALK_IN), POST /visits/{id}/check-in" }
  - { priority: 5, category: business_safety, check: "Grip-sock compliance resolvable per sock_method (membership socks_included or SERVED same-day grip-socks order)", error_id: ERR_GRIP_SOCKS_REQUIRED, http_status: 422, applies_to: "POST /visits (WALK_IN), POST /visits/{id}/check-in" }
  - { priority: 5, category: business_safety, check: "Child age at slot_date between 1 and 12 inclusive", error_id: ERR_CHILD_AGE_OUT_OF_RANGE, http_status: 422, applies_to: "POST /visits" }
  - { priority: 5, category: business_safety, check: "No order line's menu-item allergen_tags intersect the union of listed child_ids' allergies (empty child_ids skips the check)", error_id: ERR_ALLERGEN_CONFLICT, http_status: 422, applies_to: "POST /cafe-orders" }
  - { priority: 5, category: business_safety, check: "LOST_CHILD resolve requires child_reunited=true", error_id: ERR_CHILD_NOT_REUNITED, http_status: 422, applies_to: "POST /incidents/{id}/resolve" }
  - { priority: 5, category: business_safety, check: "Check-out blocked while a LOST_CHILD incident in {OPEN, TRIAGED} is linked to the visit", error_id: ERR_LOST_CHILD_UNRESOLVED, http_status: 409, applies_to: "POST /visits/{id}/check-out" }
  - { priority: 6, category: business_constraint, check: "New session slot [start_at,end_at) must not overlap any non-CLOSED slot on the same slot_date (half-open; adjacency allowed)", error_id: ERR_SLOT_OVERLAP, http_status: 409, applies_to: "POST /session-slots" }
  - { priority: 6, category: business_constraint, check: "Party room occupied interval [start_at, end_at+30min cleanup) must not intersect any non-terminal booking on the room (half-open at both ends of the occupied interval)", error_id: ERR_ROOM_TIME_CONFLICT, http_status: 409, applies_to: "POST /party-bookings, POST /party-bookings/{id}/approve-reschedule" }
  - { priority: 6, category: business_constraint, check: "No second visit for the same child+slot while a visit exists in {RESERVED, CHECKED_IN}", error_id: ERR_DUPLICATE_VISIT, http_status: 409, applies_to: "POST /visits" }
  - { priority: 6, category: business_constraint, check: "PartyRoom.status == ACTIVE at booking creation; PartyPackage.status == ACTIVE; MembershipPlan.status == ACTIVE at enrollment; CafeMenuItem.status == ACTIVE in order lines", error_id: ERR_ROOM_INACTIVE, http_status: 422, applies_to: "POST /party-bookings (ERR_ROOM_INACTIVE | ERR_PACKAGE_RETIRED | ERR_PLAN_RETIRED | ERR_MENU_ITEM_RETIRED per resource)" }
  - { priority: 6, category: business_constraint, check: "No OVERDUE SanitationTask on the room at confirm time", error_id: ERR_SANITATION_OVERDUE, http_status: 422, applies_to: "POST /party-bookings/{id}/confirm" }
  - { priority: 6, category: business_constraint, check: "Slot capacity patch cannot go below checked_in_count; child_count <= room capacity_children", error_id: ERR_CAPACITY_BELOW_OCCUPANCY, http_status: 422, applies_to: "PATCH /session-slots/{id}, POST /party-bookings" }
  - { priority: 7, category: business_temporal, check: "Check-in within [start-10min, start+15min]", error_id: ERR_CHECKIN_WINDOW_CLOSED, http_status: 422, applies_to: "POST /visits/{id}/check-in" }
  - { priority: 7, category: business_temporal, check: "Reschedule request requires now <= start_at - 48h", error_id: ERR_RESCHEDULE_CUTOFF, http_status: 422, applies_to: "POST /party-bookings/{id}/request-reschedule" }
  - { priority: 7, category: business_temporal, check: "Guardian-initiated visit cancel requires now < slot.start_at", error_id: ERR_CANCEL_CUTOFF, http_status: 422, applies_to: "POST /visits/{id}/cancel" }
  - { priority: 8, category: business_fiscal, check: "Reservation quota: reserved_count < reservation_quota", error_id: ERR_RESERVATION_QUOTA_FULL, http_status: 409, applies_to: "POST /visits (RESERVATION)" }
  - { priority: 8, category: business_fiscal, check: "Walk-in capacity: reserved_count + checked_in_count < capacity", error_id: ERR_SLOT_AT_CAPACITY, http_status: 409, applies_to: "POST /visits (WALK_IN)" }
  - { priority: 8, category: business_fiscal, check: "use_credit requires membership ACTIVE", error_id: ERR_MEMBERSHIP_REQUIRED, http_status: 422, applies_to: "POST /visits" }
  - { priority: 8, category: business_fiscal, check: "use_credit requires credits_available >= 1", error_id: ERR_INSUFFICIENT_CREDITS, http_status: 402, applies_to: "POST /visits" }
  - { priority: 8, category: business_fiscal, check: "points_to_redeem <= points_balance", error_id: ERR_INSUFFICIENT_POINTS, http_status: 402, applies_to: "POST /cafe-orders" }
  - { priority: 8, category: business_fiscal, check: "points_to_redeem <= floor(subtotal_cents/2)", error_id: ERR_REDEMPTION_CAP_EXCEEDED, http_status: 422, applies_to: "POST /cafe-orders" }
  - { priority: 9, category: business_referential, check: "Malformed payloads: missing required fields, wrong types", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 9, category: business_referential, check: "Enum fields carry declared members only", error_id: ERR_INVALID_ENUM, http_status: 400, applies_to: "all" }

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
