          Parallel dimensions on one row: the plan dimension cycles ESC_REVIEW -> RETURNED ->
          ESC_REVIEW -> APPROVED (plan_review_round 2) while the field dimension is driven by a
          different actor, and the operator stop-work leaves plan_status APPROVED untouched —
          the combined state (APPROVED, STOP_WORK) is reachable and is not a single linear path.
