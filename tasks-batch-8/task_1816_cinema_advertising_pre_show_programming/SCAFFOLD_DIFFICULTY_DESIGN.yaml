            - { call: "GET /network/showtimes/${st_id}/reel", payload: {}, as: NetworkOps, captures: { r_id: "$.data[0].id", rv: "$.data[0].version" } }
            - { call: "POST /network/advertisers", payload: { name: "AutoCo", advertiser_type: NATIONAL, category: AUTOMOTIVE }, as: SalesManager, captures: { a1: "$.data.id" } }
