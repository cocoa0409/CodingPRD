            - "${policy} == DIFFERENCE_ONLY, ${cap} == 5000 and ${budget} == 100000 (jurisdiction defaults)"
            - "${var_over} == 199 with ${cls_over} == OVERCHARGE, ${cls_match} == MATCH, and ${au1_status} == SCANNING after two scan lines while ${au2_status} == OPEN"
            - "Claim against the SCANNING audit: HTTP 409 with ${e_not_closed} == ERR_AUDIT_NOT_CLOSED, even though the version supplied was current"
            - "Closing the untouched AU2: HTTP 422 with ${e_empty} == ERR_AUDIT_SAMPLE_EMPTY — an OPEN audit has zero scan lines, so this is reported as an empty sample rather than as ERR_AUDIT_INVALID_STATE"
            - "${au1_closed} == CLOSED, ${rate_1} == 50.00 (1 of 2 lines in error) and ${out_1} == FAIL"
            - "Claim against the MATCH line: HTTP 422 with ${e_not_over} == ERR_NOT_AN_OVERCHARGE"
            - "Claim against the OVERCHARGE line: HTTP 201, ${amt_1} == 199 == min(199, 5000), ${pol_1} == DIFFERENCE_ONLY, ${st_1} == PENDING"
            - "Same (scan_line, customer_ref) again: HTTP 409 with ${e_dup_claim} == ERR_DUPLICATE_RESOURCE"
            - "A second customer on the same line: HTTP 201 with ${amt_2} == 199, and the reused ${ver_closed} is still accepted — filing a claim does not bump the audit's version"
            - "${outstanding_1} == 398 == 199 + 199 and ${paid_1} == 0 (PENDING claims are outstanding)"
            - "Paying a PENDING claim: HTTP 409 with ${e_not_approved} == ERR_REFUND_NOT_APPROVED"
            - "Denying without a reason: HTTP 422 with ${e_no_reason} == ERR_DENIAL_REASON_REQUIRED"
            - "${st_approved} == APPROVED, then ${st_paid} == PAID with ${paid_at_1} == 2026-08-01T00:00:00Z, and the third settle to PAID returns HTTP 409 with ${e_again} == ERR_TRANSITION_ALREADY_APPLIED"
            - "${st_denied} == DENIED with ${reason_2} == 'Customer withdrew the complaint'"
            - "${outstanding_2} == 0 (PAID left the outstanding sum, DENIED released the other claim) and ${paid_2} == 199"

