          - endpoints[POST /compliance-sweeps].side_effects
        distinguishing_aspect: "The posture ladder is evaluated top-down: an exceedance on a control-linked event drives the site to RESTRICTED, and a later defence-critical lapse must make it FROZEN rather than leaving it RESTRICTED — impaired_control_count stays 1 while the posture is FROZEN, proving FORFEITED dominates impairment instead of the two conditions competing."
        test_recipe:
          setup:
