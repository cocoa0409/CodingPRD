            - call: "POST /pep/plan-design-elections/${elec_a_id}/submit"
              payload: { signatory_name: "J. Palisade" }
              as: AdoptingEmployer
              as_user_id: "${emp_p_id}"
            - call: "POST /pep/plan-design-elections"
              payload: { adopting_employer_id: "${emp_p_id}", eligibility_min_age: 21, eligibility_service_months: 6, vesting_schedule: "IMMEDIATE", match_formula_code: "SAFE_HARBOR_ENHANCED", expected_adopting_employer_version: "${emp_v1}" }
              as: AdoptingEmployer
              as_user_id: "${emp_p_id}"
              expect_error: ERR_STALE_EMPLOYER_VERSION
            - call: "GET /pep/adopting-employers/${emp_p_id}"
              as: AdoptingEmployer
              as_user_id: "${emp_p_id}"
              captures: { emp_v2: $.data.version }
            - call: "POST /pep/plan-design-elections"
              payload: { adopting_employer_id: "${emp_p_id}", eligibility_min_age: 21, eligibility_service_months: 6, vesting_schedule: "IMMEDIATE", match_formula_code: "SAFE_HARBOR_ENHANCED", expected_adopting_employer_version: "${emp_v2}" }
              as: AdoptingEmployer
              as_user_id: "${emp_p_id}"
              captures: { elec_b_id: $.data.id }
            - call: "POST /pep/plan-design-elections"
              payload: { adopting_employer_id: "${emp_p_id}", eligibility_min_age: 21, eligibility_service_months: 3, vesting_schedule: "IMMEDIATE", match_formula_code: "NONE", expected_adopting_employer_version: "${emp_v2}" }
              as: AdoptingEmployer
              as_user_id: "${emp_p_id}"
              expect_error: ERR_STALE_EMPLOYER_VERSION
            - call: "GET /pep/adopting-employers/${emp_p_id}"
              as: AdoptingEmployer
              as_user_id: "${emp_p_id}"
              captures: { emp_v3: $.data.version }
            - call: "POST /pep/plan-design-elections"
              payload: { adopting_employer_id: "${emp_p_id}", eligibility_min_age: 21, eligibility_service_months: 3, vesting_schedule: "IMMEDIATE", match_formula_code: "NONE", expected_adopting_employer_version: "${emp_v3}" }
              as: AdoptingEmployer
              as_user_id: "${emp_p_id}"
              captures: { elec_c_id: $.data.id }
            - call: "POST /pep/plan-design-elections"
              payload: { adopting_employer_id: "${emp_p_id}", eligibility_min_age: 21, eligibility_service_months: 0, vesting_schedule: "IMMEDIATE", match_formula_code: "SAFE_HARBOR_BASIC", expected_adopting_employer_version: "${emp_v3}" }
              as: AdoptingEmployer
              as_user_id: "${emp_p_id}"
              captures: { elec_d_id: $.data.id }
            - call: "GET /pep/adopting-employers/${emp_p_id}/design-elections"
              payload: { limit: 10, offset: 0 }
              as: AdoptingEmployer
              as_user_id: "${emp_p_id}"
          assert:
            - "the first election is created with the employer's initial version and does not itself advance that version: creating an election from APPLIED is not an employer transition"
            - "submitting it advances the employer to ELECTIONS_SUBMITTED and its version to 2, so the replacement create carrying version 1 returns 412 ERR_STALE_EMPLOYER_VERSION"
            - "the 412 leaves everything untouched: election A is still SUBMITTED, the employer is still ELECTIONS_SUBMITTED at version 2, and no election B row exists"
            - "the same replacement carrying the re-read version 2 is accepted 201, supersedes A and resets the employer to APPLIED at version 3"
            - "the next create reusing version 2 returns 412 — a successful write invalidated the caller's token, which is the whole point of the rule"
            - "the create carrying version 3 is accepted, supersedes the DRAFT election B, and leaves the employer at version 3 because superseding a DRAFT election while the employer is already APPLIED fires no employer transition"
            - "the fourth create therefore also carries version 3 and is also accepted 201: the token's lifetime is governed by employer transitions, not by election churn"
            - "the listing returns total_count 4 with election_sequence 1, 2, 3, 4; A, B and C are SUPERSEDED and only D is DRAFT"

      - name: corner_layer_occ_stale_plan_version_rejected_before_window_checks
