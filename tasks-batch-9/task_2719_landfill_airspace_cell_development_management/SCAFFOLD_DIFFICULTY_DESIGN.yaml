            - "operating_status is NOT 'RESTRICTED_AIRSPACE' despite remaining_life_years being under 2.0, because link 3 had already moved it off OPEN"
            - "WasteLoad.${l1_id}.billing_status == 'FINALIZED' and its final_charge_amount == 8073.39"

