            - { call: "POST /v1/evaluations/${e1}/schedule", payload: { evaluator_id: "${ev}", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /v1/evaluations/${e2}/schedule", payload: { evaluator_id: "${ev}", scheduled_start: "2026-08-03T11:00:00Z", scheduled_end: "2026-08-03T12:00:00Z" }, as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_EVALUATOR_DAILY_CAP_EXCEEDED (422; buffer gap is satisfied but the daily cap is 1)"

      - name: score_before_conclusion_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_EVALUATION_NOT_CONCLUDED]
        distinguishing_aspect: "Scoring while the logical clock is before scheduled_end is rejected even though the evaluation is SCHEDULED."
        test_recipe:
          setup: ["evaluation e SCHEDULED for 2026-08-03T10:00:00Z-11:00:00Z; clock at 2026-08-03T10:30:00Z (mid-evaluation)"]
          setup_api_calls:
            - { call: "POST /v1/handlers", payload: { full_name: "H SC", email: "hsc@x.com", region_code: "WA", volunteer_since: "2024-08-01" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /v1/handlers/${h}/approve", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/animals", payload: { name: "D", species: "DOG", breed: "Beagle", date_of_birth: "2021-01-01" }, as: Handler, as_user_id: "${h}", captures: { a: $.data.id } }
            - { call: "POST /v1/teams", payload: { animal_id: "${a}", team_name: "TSC" }, as: Handler, as_user_id: "${h}", captures: { t: $.data.id } }
            - { call: "POST /v1/evaluations", payload: { team_id: "${t}" }, as: Handler, as_user_id: "${h}", captures: { e: $.data.id } }
            - { call: "POST /v1/evaluators", payload: { full_name: "Ev SC", email: "evsc@x.com", region_code: "WA", specializations: ["DOG"] }, as: ProgramAdmin, captures: { ev: $.data.id } }
            - { call: "POST /v1/evaluations/${e}/schedule", payload: { evaluator_id: "${ev}", scheduled_start: "2026-08-03T10:00:00Z", scheduled_end: "2026-08-03T11:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:30:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /v1/evaluations/${e}/score", payload: { aptitude_score: 90, obedience_score: 90 }, as: Evaluator, as_user_id: "${ev}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_EVALUATION_NOT_CONCLUDED (409)"

      - name: invalid_adjustment_floor_and_zero
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_ADJUSTMENT]
          - calculations.recognition_lifetime_and_tier
        distinguishing_aspect: "An adjustment of 0 minutes is rejected, and a negative adjustment that would push lifetime_minutes below 0 is rejected (floor at 0)."
        test_recipe:
          setup: ["handler h ACTIVE with lifetime 30 (one +30 adjustment posted)"]
          setup_api_calls:
            - { call: "POST /v1/handlers", payload: { full_name: "H AD", email: "had@x.com", region_code: "WA", volunteer_since: "2024-08-01" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /v1/handlers/${h}/approve", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/hour-credits/adjustments", payload: { handler_id: "${h}", minutes: 30, reason: "seed" }, as: ComplianceOfficer, as_user_id: "co-1" }
          trigger:
            - { call: "POST /v1/hour-credits/adjustments", payload: { handler_id: "${h}", minutes: 0, reason: "noop" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { err1: $.data.error_id } }
            - { call: "POST /v1/hour-credits/adjustments", payload: { handler_id: "${h}", minutes: -50, reason: "overdraw" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { err2: $.data.error_id } }
            - { call: "GET /v1/handlers/${h}", payload: {}, as: ProgramAdmin, captures: { lt: $.data.lifetime_minutes } }
          assert:
            - "err1 == ERR_INVALID_ADJUSTMENT (0 minutes)"
            - "err2 == ERR_INVALID_ADJUSTMENT (30 - 50 < 0 floor)"
            - "lt == 30 (both rejected; no partial application)"

      - name: second_agreement_for_facility_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ACTIVE_AGREEMENT_EXISTS]
        distinguishing_aspect: "A facility with an agreement in DRAFT/PENDING_*/ACTIVE cannot get a second concurrent agreement."
        test_recipe:
          setup: ["facility f with agreement ag ACTIVE"]
          setup_api_calls:
            - { call: "POST /v1/facilities", payload: { name: "Fac AG", facility_type: "SCHOOL", region_code: "WA", max_visit_minutes: 60, allowed_species: ["DOG"], min_liability_coverage_cents: 100000000, max_overlapping_teams: 2, visits_per_week_cap: 5 }, as: ProgramAdmin, captures: { f: $.data.id } }
            - { call: "POST /v1/facility-agreements", payload: { facility_id: "${f}", start_on: "2026-07-01", end_on: "2027-06-30", agreed_max_visit_minutes: 90, insurance_minimum_cents: 100000000, terms_version: "t1" }, as: ProgramAdmin, captures: { ag: $.data.id } }
            - { call: "POST /v1/facility-agreements/${ag}/submit", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/facility-agreements/${ag}/sign-facility", payload: {}, as: FacilityCoordinator, as_user_id: "${f}" }
            - { call: "POST /v1/facility-agreements/${ag}/sign-program", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /v1/facility-agreements", payload: { facility_id: "${f}", start_on: "2026-08-01", end_on: "2028-07-31", agreed_max_visit_minutes: 60, insurance_minimum_cents: 100000000, terms_version: "t2" }, as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_ACTIVE_AGREEMENT_EXISTS (422)"

      - name: facility_reinstate_requires_active_agreement
        claim_type: violation_to_error
        grounds:
          - errors[ERR_NO_ACTIVE_AGREEMENT]
          - state_machines.Facility.SUSPENDED_to_ACTIVE
        distinguishing_aspect: "A facility left SUSPENDED by agreement expiry cannot be reinstated until a new agreement is activated."
        test_recipe:
          setup: ["facility f with agreement end_on 2026-08-10 ACTIVE; clock 2026-08-11; sweep ran (agreement EXPIRED, facility SUSPENDED via cascade)"]
          setup_api_calls:
            - { call: "POST /v1/facilities", payload: { name: "Fac RA", facility_type: "SCHOOL", region_code: "WA", max_visit_minutes: 60, allowed_species: ["DOG"], min_liability_coverage_cents: 100000000, max_overlapping_teams: 2, visits_per_week_cap: 5 }, as: ProgramAdmin, captures: { f: $.data.id } }
            - { call: "POST /v1/facility-agreements", payload: { facility_id: "${f}", start_on: "2026-07-01", end_on: "2026-08-10", agreed_max_visit_minutes: 90, insurance_minimum_cents: 100000000, terms_version: "t1" }, as: ProgramAdmin, captures: { ag: $.data.id } }
            - { call: "POST /v1/facility-agreements/${ag}/submit", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/facility-agreements/${ag}/sign-facility", payload: {}, as: FacilityCoordinator, as_user_id: "${f}" }
            - { call: "POST /v1/facility-agreements/${ag}/sign-program", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/_sweeps/run", payload: {}, as: ProgramAdmin, captures: { ax: $.data.agreements_expired } }
          trigger:
            - { call: "POST /v1/facilities/${f}/reinstate", payload: {}, as: ComplianceOfficer, as_user_id: "co-1", captures: { err: $.data.error_id } }
          assert:
            - "ax == 1 (agreement swept to EXPIRED; facility cascaded to SUSPENDED)"
            - "err == ERR_NO_ACTIVE_AGREEMENT (409)"

