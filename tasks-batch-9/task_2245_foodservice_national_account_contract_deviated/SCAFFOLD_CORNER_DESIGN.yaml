        grounds:
          - complexity_profile.complexity_layers
          - calculations.contract_line_price
        excluded_because:
          difficulty_instance: order_line_price_prospective_vs_retroactive_tier
          rationale: |
            That §1.8 instance computes both variants over identical data and asserts the
            delta the switch produces, which is exactly this layer's claim.

