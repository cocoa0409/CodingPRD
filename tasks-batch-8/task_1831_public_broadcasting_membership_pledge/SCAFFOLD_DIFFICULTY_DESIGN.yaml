              as: StationAdmin
              captures: { drv11_id: $.data.id, drv11_v: $.data.version }
            - call: "POST /station/pledge-drives/${drv11_id}/breaks"
              payload: { starts_at: "2026-08-02T18:00:00Z", ends_at: "2026-08-02T18:20:00Z", program_title: "Evening Pledge", pitch_level_code: "BASIC", expected_drive_version: "${drv11_v}" }
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv11_id}/schedule"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv11_id}/go-live"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv11_id}/matching-challenges"
              payload: { sponsor_name: "Acme Corp", goal_cents: 10000, match_cents: 50000 }
              as: StationAdmin
              captures: { mc_id: $.data.id }
            - call: "POST /station/pledges"
              payload: { donor_id: "${donor11_id}", membership_id: "${mem11_id}", drive_id: "${drv11_id}", matching_challenge_id: "${mc_id}", channel: "PHONE", kind: "ONE_TIME", amount_cents: 9999 }
              as: PhoneVolunteer
            - call: "GET /station/matching-challenges/${mc_id}"
              payload: {}
              as: StationAdmin
              captures: { mc_status_below: $.data.status, mc_progress_below: $.data.progress_cents }
          trigger:
            - call: "POST /station/pledges"
              payload: { donor_id: "${donor11_id}", membership_id: "${mem11_id}", drive_id: "${drv11_id}", matching_challenge_id: "${mc_id}", channel: "WEB", kind: "ONE_TIME", amount_cents: 1 }
              as: PhoneVolunteer
            - call: "GET /station/matching-challenges/${mc_id}"
              payload: {}
              as: StationAdmin
              captures: { mc_status_at: $.data.status, mc_progress_at: $.data.progress_cents }
          assert:
            - "at progress 9999 (< goal 10000) challenge remains OPEN (${mc_status_below} == OPEN, ${mc_progress_below} == 9999)"
            - "the 1-cent pledge lands progress exactly on 10000 and flips challenge to MET (>= boundary)"
            - "${mc_progress_at} == 10000 and ${mc_status_at} == MET"

      - name: reservation_rejected_at_exact_zero_available
        grounds:
          - entities.PremiumInventoryLot.fields.available_qty
          - errors[ERR_INSUFFICIENT_INVENTORY]
        distinguishing_aspect: |
          Boundary on the inventory-available metric via a different endpoint
