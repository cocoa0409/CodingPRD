        distinguishing_aspect: >-
          POST /carriage/distributors accepts exactly two roles and the record it
          produces is indistinguishable between them — both land status ACTIVE,
          credit_hold_reason NONE and executed_agreement_count 0 — while the other four
          roles are 403.
        test_recipe:
          setup:
            - "Empty distributor store."
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Meridian Broadband"
