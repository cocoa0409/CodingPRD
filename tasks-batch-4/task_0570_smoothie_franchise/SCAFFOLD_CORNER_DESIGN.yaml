        claim_type: peer_roles
        grounds: [roles, "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "GET /customers/{B} as Customer A (X-User-ID != path id) returns ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup: ["Two registered customers A and B."]
          setup_api_calls:
