# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7 via the claim-extraction-guide
# taxonomy. Every test_recipe chain drives empty-DB -> precondition using only
# §1.5 endpoints; excluded_because stubs cite a §1.8 instance by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_program_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Program, endpoints]
        distinguishing_aspect: "POST /vms/programs with all required fields -> 201; response carries id, status=ACTIVE, current_clock, version=1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /vms/programs"
              payload: { name: "P", client_name: "C", default_markup_pct: 0.45, max_markup_pct: 0.60, coemployment_tenure_limit_days: 180, tenure_warning_threshold_days: 120 }
              as: ProgramManager
              captures: { prog_id: $.data.id, st: $.data.status, ver: $.data.version }
          assert:
            - "HTTP 201"
            - "Program.status == ACTIVE"
            - "Program.version == 1"
            - "Program.current_clock == 1970-01-01T00:00:00.000Z"

      - name: get_program_not_found_returns_404
        claim_type: Not Found
        grounds: ["entities.Program", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /vms/programs/{nonexistent-uuid} -> ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /vms/programs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "error_id == ERR_NOT_FOUND"

      - name: create_supplier_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.Supplier", "validations[priority=17]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /vms/suppliers omitting required `tier` -> ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["one Program"]
          setup_api_calls:
            - call: "POST /vms/programs"
              payload: { name: "P", client_name: "C", default_markup_pct: 0.45, max_markup_pct: 0.60, coemployment_tenure_limit_days: 180, tenure_warning_threshold_days: 120 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /vms/suppliers"
              payload: { program_id: "${prog_id}", name: "Acme" }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: program_threshold_warning_not_less_than_limit_rejected
        claim_type: Type Constraints
        grounds: ["entities.Program.fields.tenure_warning_threshold_days", "errors[ERR_THRESHOLD_INVALID]"]
        distinguishing_aspect: "POST /vms/programs with tenure_warning_threshold_days >= coemployment_tenure_limit_days -> ERR_THRESHOLD_INVALID 400."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /vms/programs"
              payload: { name: "P", client_name: "C", default_markup_pct: 0.45, max_markup_pct: 0.60, coemployment_tenure_limit_days: 100, tenure_warning_threshold_days: 100 }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == ERR_THRESHOLD_INVALID"

      - name: supplier_tier_below_one_rejected
        claim_type: Type Constraints
        grounds: ["entities.Supplier.fields.tier", "errors[ERR_TIER_INVALID]"]
        distinguishing_aspect: "POST /vms/suppliers with tier 0 -> ERR_TIER_INVALID 400 (tier >= 1)."
        test_recipe:
          setup: ["one Program"]
          setup_api_calls:
            - call: "POST /vms/programs"
              payload: { name: "P", client_name: "C", default_markup_pct: 0.45, max_markup_pct: 0.60, coemployment_tenure_limit_days: 180, tenure_warning_threshold_days: 120 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /vms/suppliers"
              payload: { program_id: "${prog_id}", name: "Acme", tier: 0 }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == ERR_TIER_INVALID"

      - name: worker_computed_fields_initialized_input_ignored
        claim_type: Computed Fields
        grounds: [entities.WorkerProfile.fields.cumulative_engaged_days, entities.WorkerProfile.fields.tenure_status]
        distinguishing_aspect: "POST /vms/workers -> cumulative_engaged_days=0 and tenure_status=CLEAR are server-computed; any client-sent values for them are ignored."
        test_recipe:
          setup: ["one Program"]
          setup_api_calls:
            - call: "POST /vms/programs"
              payload: { name: "P", client_name: "C", default_markup_pct: 0.45, max_markup_pct: 0.60, coemployment_tenure_limit_days: 180, tenure_warning_threshold_days: 120 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /vms/workers"
              payload: { program_id: "${prog_id}", full_name: "W", national_id_hash: "h1" }
              as: ProgramManager
              captures: { wkr_id: $.data.id, cum: $.data.cumulative_engaged_days, ts: $.data.tenure_status }
          assert:
            - "WorkerProfile.cumulative_engaged_days == 0"
            - "WorkerProfile.tenure_status == CLEAR"

      - name: duplicate_national_id_hash_rejected
        claim_type: Type Constraints
        grounds: ["entities.WorkerProfile.fields.national_id_hash", "errors[ERR_DUPLICATE_WORKER]"]
        distinguishing_aspect: "Second WorkerProfile with an already-used national_id_hash in the same program -> ERR_DUPLICATE_WORKER 409."
        test_recipe:
          setup: ["Program with one worker national_id_hash=h1"]
          setup_api_calls:
            - call: "POST /vms/programs"
              payload: { name: "P", client_name: "C", default_markup_pct: 0.45, max_markup_pct: 0.60, coemployment_tenure_limit_days: 180, tenure_warning_threshold_days: 120 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /vms/workers"
              payload: { program_id: "${prog_id}", full_name: "W1", national_id_hash: "h1" }
              as: ProgramManager
          trigger:
            - call: "POST /vms/workers"
              payload: { program_id: "${prog_id}", full_name: "W2", national_id_hash: "h1" }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_DUPLICATE_WORKER"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: shortlist_from_already_shortlisted_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Submittal.SUBMITTED_to_SHORTLISTED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling shortlist twice: the second call finds the submittal already SHORTLISTED (no SHORTLISTED->SHORTLISTED transition) -> ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["SHORTLISTED submittal"]
          setup_api_calls:
            - call: "POST /vms/programs"
              payload: { name: "P", client_name: "C", default_markup_pct: 0.45, max_markup_pct: 0.60, coemployment_tenure_limit_days: 180, tenure_warning_threshold_days: 120 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /vms/suppliers"
              payload: { program_id: "${prog_id}", name: "Acme", tier: 1 }
              as: ProgramManager
              captures: { sup_id: $.data.id }
            - call: "POST /vms/workers"
              payload: { program_id: "${prog_id}", full_name: "W", national_id_hash: "h1" }
              as: ProgramManager
              captures: { wkr_id: $.data.id }
            - call: "POST /vms/requisitions"
              payload: { program_id: "${prog_id}", title: "Eng", openings: 1, max_pay_rate_cents: 20000 }
              as: ProgramManager
              captures: { req_id: $.data.id }
            - call: "POST /vms/requisitions/${req_id}/distribute"
              payload: { supplier_ids: ["${sup_id}"] }
              as: ProgramManager
            - call: "POST /vms/submittals"
              payload: { requisition_id: "${req_id}", supplier_id: "${sup_id}", worker_profile_id: "${wkr_id}", pay_rate_cents: 8000 }
              as: Supplier
              as_user_id: "${sup_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /vms/submittals/${sub_id}/shortlist"
              payload: {}
              as: HiringManager
          trigger:
            - call: "POST /vms/submittals/${sub_id}/shortlist"
              payload: {}
              as: HiringManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE"

      - name: hire_from_non_offered_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Submittal.OFFERED_to_HIRED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "hire on a SUBMITTED (not OFFERED) submittal -> ERR_INVALID_STATE 409; the OCC version still references a captured value."
        test_recipe:
          setup: ["SUBMITTED submittal on a distributed requisition"]
          setup_api_calls:
            - call: "POST /vms/programs"
              payload: { name: "P", client_name: "C", default_markup_pct: 0.45, max_markup_pct: 0.60, coemployment_tenure_limit_days: 180, tenure_warning_threshold_days: 120 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /vms/suppliers"
              payload: { program_id: "${prog_id}", name: "Acme", tier: 1 }
              as: ProgramManager
              captures: { sup_id: $.data.id }
            - call: "POST /vms/workers"
              payload: { program_id: "${prog_id}", full_name: "W", national_id_hash: "h1" }
              as: ProgramManager
              captures: { wkr_id: $.data.id }
            - call: "POST /vms/requisitions"
              payload: { program_id: "${prog_id}", title: "Eng", openings: 1, max_pay_rate_cents: 20000 }
              as: ProgramManager
              captures: { req_id: $.data.id }
            - call: "POST /vms/requisitions/${req_id}/distribute"
              payload: { supplier_ids: ["${sup_id}"] }
              as: ProgramManager
              captures: { req_v: $.data.version }
            - call: "POST /vms/submittals"
              payload: { requisition_id: "${req_id}", supplier_id: "${sup_id}", worker_profile_id: "${wkr_id}", pay_rate_cents: 8000 }
              as: Supplier
              as_user_id: "${sup_id}"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /vms/submittals/${sub_id}/hire"
              payload: { expected_requisition_version: "${req_v}", start_date: "2026-01-01T00:00:00.000Z", planned_end_date: "2026-06-01T00:00:00.000Z" }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE"

      - name: invoice_milestone_from_terminal_invoiced_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Milestone.ACCEPTED_to_INVOICED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Re-invoicing an already-INVOICED (terminal) milestone -> ERR_INVALID_STATE 409; terminal states accept no transitions."
        test_recipe:
          setup: ["INVOICED milestone under an ACTIVE SOW"]
          setup_api_calls:
            - call: "POST /vms/programs"
              payload: { name: "P", client_name: "C", default_markup_pct: 0.45, max_markup_pct: 0.60, coemployment_tenure_limit_days: 180, tenure_warning_threshold_days: 120 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /vms/suppliers"
              payload: { program_id: "${prog_id}", name: "Acme", tier: 1 }
              as: ProgramManager
              captures: { sup_id: $.data.id }
            - call: "POST /vms/statements-of-work"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", title: "Build", total_value_cents: 100000 }
              as: ProgramManager
              captures: { sow_id: $.data.id }
            - call: "POST /vms/milestones"
              payload: { statement_of_work_id: "${sow_id}", name: "M1", milestone_amount_cents: 40000, sequence: 1 }
              as: ProgramManager
              captures: { m1: $.data.id }
            - call: "POST /vms/statements-of-work/${sow_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /vms/milestones/${m1}/start"
              payload: {}
              as: Supplier
              as_user_id: "${sup_id}"
            - call: "POST /vms/milestones/${m1}/submit"
              payload: {}
              as: Supplier
              as_user_id: "${sup_id}"
            - call: "POST /vms/milestones/${m1}/accept"
              payload: {}
              as: HiringManager
            - call: "POST /vms/milestones/${m1}/invoice"
              payload: {}
              as: Finance
          trigger:
            - call: "POST /vms/milestones/${m1}/invoice"
              payload: {}
              as: Finance
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE"

      - name: milestone_initial_state_is_pending
        claim_type: Initial State
        grounds: [state_machines.Milestone, entities.Milestone.fields.status]
        distinguishing_aspect: "POST /vms/milestones -> newly created milestone status == PENDING (the declared initial_state)."
        test_recipe:
          setup: ["DRAFT SOW"]
          setup_api_calls:
            - call: "POST /vms/programs"
              payload: { name: "P", client_name: "C", default_markup_pct: 0.45, max_markup_pct: 0.60, coemployment_tenure_limit_days: 180, tenure_warning_threshold_days: 120 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /vms/suppliers"
              payload: { program_id: "${prog_id}", name: "Acme", tier: 1 }
              as: ProgramManager
              captures: { sup_id: $.data.id }
            - call: "POST /vms/statements-of-work"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", title: "Build", total_value_cents: 100000 }
              as: ProgramManager
              captures: { sow_id: $.data.id }
          trigger:
            - call: "POST /vms/milestones"
              payload: { statement_of_work_id: "${sow_id}", name: "M1", milestone_amount_cents: 40000, sequence: 1 }
              as: ProgramManager
              captures: { m1: $.data.id, st: $.data.status }
          assert:
            - "Milestone.status == PENDING"

      - name: timesheet_reject_then_reopen_returns_to_draft
        claim_type: Valid Transition
        grounds: [state_machines.Timesheet.SUBMITTED_to_REJECTED, state_machines.Timesheet.REJECTED_to_DRAFT, entities.Timesheet.fields.submitted_at]
        distinguishing_aspect: "Reject a SUBMITTED timesheet then reopen -> status DRAFT and submitted_at cleared (the branching-with-revert rework path)."
        test_recipe:
          setup: ["SUBMITTED timesheet on an ACTIVE assignment"]
          setup_api_calls:
            - call: "POST /vms/programs"
              payload: { name: "P", client_name: "C", default_markup_pct: 0.45, max_markup_pct: 0.60, coemployment_tenure_limit_days: 3650, tenure_warning_threshold_days: 3000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /vms/suppliers"
              payload: { program_id: "${prog_id}", name: "Acme", tier: 1 }
              as: ProgramManager
              captures: { sup_id: $.data.id }
            - call: "POST /vms/workers"
              payload: { program_id: "${prog_id}", full_name: "W", national_id_hash: "h1" }
              as: ProgramManager
              captures: { wkr_id: $.data.id }
            - call: "POST /vms/requisitions"
              payload: { program_id: "${prog_id}", title: "Eng", openings: 1, max_pay_rate_cents: 20000 }
              as: ProgramManager
              captures: { req_id: $.data.id }
            - call: "POST /vms/requisitions/${req_id}/distribute"
              payload: { supplier_ids: ["${sup_id}"] }
              as: ProgramManager
              captures: { req_v: $.data.version }
            - call: "POST /vms/submittals"
              payload: { requisition_id: "${req_id}", supplier_id: "${sup_id}", worker_profile_id: "${wkr_id}", pay_rate_cents: 8000 }
              as: Supplier
              as_user_id: "${sup_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /vms/submittals/${sub_id}/shortlist"
              payload: {}
              as: HiringManager
            - call: "POST /vms/submittals/${sub_id}/start_interview"
              payload: {}
              as: HiringManager
            - call: "POST /vms/submittals/${sub_id}/propose_rate"
              payload: { pay_rate_cents: 8000 }
              as: Supplier
              as_user_id: "${sup_id}"
            - call: "POST /vms/submittals/${sub_id}/offer"
              payload: {}
              as: HiringManager
            - call: "POST /vms/submittals/${sub_id}/hire"
              payload: { expected_requisition_version: "${req_v}", start_date: "2026-01-01T00:00:00.000Z", planned_end_date: "2026-06-01T00:00:00.000Z" }
              as: ProgramManager
              captures: { asg_id: $.data.id }
            - call: "POST /vms/timesheets"
              payload: { assignment_id: "${asg_id}", week_start_date: "2026-01-05T00:00:00.000Z", regular_hours: 40 }
              as: Supplier
              as_user_id: "${sup_id}"
              captures: { ts_id: $.data.id }
            - call: "POST /vms/timesheets/${ts_id}/submit"
              payload: {}
              as: Supplier
              as_user_id: "${sup_id}"
            - call: "POST /vms/timesheets/${ts_id}/reject"
              payload: {}
              as: HiringManager
          trigger:
            - call: "POST /vms/timesheets/${ts_id}/reopen"
              payload: {}
              as: Supplier
              as_user_id: "${sup_id}"
              captures: { st: $.data.status, sa: $.data.submitted_at }
          assert:
            - "Timesheet.status == DRAFT"
            - "Timesheet.submitted_at == null"

      - name: milestone_sequence_violation_blocks_out_of_order_submit
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Milestone.IN_PROGRESS_to_SUBMITTED", "errors[ERR_MILESTONE_SEQUENCE_VIOLATION]"]
        distinguishing_aspect: "Submitting milestone sequence 2 while sequence 1 is still IN_PROGRESS (not ACCEPTED/INVOICED) -> ERR_MILESTONE_SEQUENCE_VIOLATION 409."
        test_recipe:
          setup: ["ACTIVE SOW with milestones seq 1 (IN_PROGRESS) and seq 2 (IN_PROGRESS)"]
          setup_api_calls:
            - call: "POST /vms/programs"
              payload: { name: "P", client_name: "C", default_markup_pct: 0.45, max_markup_pct: 0.60, coemployment_tenure_limit_days: 180, tenure_warning_threshold_days: 120 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /vms/suppliers"
              payload: { program_id: "${prog_id}", name: "Acme", tier: 1 }
              as: ProgramManager
              captures: { sup_id: $.data.id }
            - call: "POST /vms/statements-of-work"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", title: "Build", total_value_cents: 100000 }
              as: ProgramManager
              captures: { sow_id: $.data.id }
            - call: "POST /vms/milestones"
              payload: { statement_of_work_id: "${sow_id}", name: "M1", milestone_amount_cents: 30000, sequence: 1 }
              as: ProgramManager
              captures: { m1: $.data.id }
            - call: "POST /vms/milestones"
              payload: { statement_of_work_id: "${sow_id}", name: "M2", milestone_amount_cents: 30000, sequence: 2 }
              as: ProgramManager
              captures: { m2: $.data.id }
            - call: "POST /vms/statements-of-work/${sow_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /vms/milestones/${m1}/start"
              payload: {}
              as: Supplier
              as_user_id: "${sup_id}"
            - call: "POST /vms/milestones/${m2}/start"
              payload: {}
              as: Supplier
              as_user_id: "${sup_id}"
          trigger:
            - call: "POST /vms/milestones/${m2}/submit"
              payload: {}
              as: Supplier
              as_user_id: "${sup_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_MILESTONE_SEQUENCE_VIOLATION"

      - name: counter_rate_rounds_cap_exceeded_at_five
        claim_type: cyclic
        grounds: ["state_machines.Submittal.RATE_PROPOSED_to_INTERVIEWING", "errors[ERR_NEGOTIATION_ROUNDS_EXCEEDED]"]
        distinguishing_aspect: "After 5 completed counter_rate rounds, a 6th counter_rate (from RATE_PROPOSED) -> ERR_NEGOTIATION_ROUNDS_EXCEEDED 409 (cycle termination condition)."
        test_recipe:
          setup: ["Submittal looped through 5 negotiation rounds, currently RATE_PROPOSED with rounds==5"]
          setup_api_calls:
            - call: "POST /vms/programs"
              payload: { name: "P", client_name: "C", default_markup_pct: 0.45, max_markup_pct: 0.60, coemployment_tenure_limit_days: 180, tenure_warning_threshold_days: 120 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /vms/suppliers"
              payload: { program_id: "${prog_id}", name: "Acme", tier: 1 }
              as: ProgramManager
              captures: { sup_id: $.data.id }
            - call: "POST /vms/workers"
              payload: { program_id: "${prog_id}", full_name: "W", national_id_hash: "h1" }
              as: ProgramManager
              captures: { wkr_id: $.data.id }
            - call: "POST /vms/requisitions"
              payload: { program_id: "${prog_id}", title: "Eng", openings: 1, max_pay_rate_cents: 20000 }
              as: ProgramManager
