# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml - task 2194 New-Teacher Induction & Mentorship
# Section 1.9 breadth index. Section values and claim_type values are taken
# verbatim from references/claim-extraction-guide.md; no categories are invented.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml are emitted as
# excluded_because stubs naming the covering §1.8 instance.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: create_site_returns_envelope_and_system_defaults
        claim_type: creation
        grounds:
          - entities.Site.fields.status
          - entities.Site.fields.active_match_count
          - endpoints[POST /sites]
        distinguishing_aspect: "POST /sites with name, site_code, region_code and mentor_slot_cap returns 201 with status OPEN, active_match_count 0, closed_at null and version 1 inside the standard success envelope."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /sites"
              payload: { name: "Northgate High", site_code: "NG-001", region_code: "NORTH", mentor_slot_cap: 6 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
          assert:
            - "response status code == 201"
            - "response body carries meta.api_request_id and meta.api_request_timestamp"
            - "response_type == object"
            - "Site.${site_id}.status == OPEN"
            - "Site.${site_id}.active_match_count == 0"
            - "Site.${site_id}.closed_at == null"
            - "Site.${site_id}.mentor_slot_cap == 6"
            - "Site.${site_id}.version == 1"

      - name: retrieve_mentor_returns_stored_and_derived_fields
        claim_type: retrieval
        grounds:
          - entities.Mentor.fields.certification_status
          - entities.Mentor.fields.training_hours_current_cycle
          - endpoints[GET /mentors/{id}]
        distinguishing_aspect: "GET /mentors/{id} echoes the stored subject_endorsements and caseload_cap and the derived training_hours_current_cycle 18.00 accumulated from the three training-credit posts."
        test_recipe:
          setup:
            - "One open Site and one Mentor endorsed in MATH with caseload_cap 2 and 18.00 training hours across FOUNDATIONS, OBSERVATION_PROTOCOL and EQUITY, still UNCERTIFIED."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Northgate High", site_code: "NG-001", region_code: "NORTH", mentor_slot_cap: 6 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /mentors"
              payload: { site_id: "${site_id}", full_name: "Rosa Alvarez", subject_endorsements: ["MATH"], caseload_cap: 2 }
              as: ProgramAdmin
              captures: { mentor_id: $.data.id }
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "FOUNDATIONS", hours: 8.00, completed_on: "2026-07-10" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "OBSERVATION_PROTOCOL", hours: 6.00, completed_on: "2026-07-11" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "EQUITY", hours: 4.00, completed_on: "2026-07-12" }
              as: ProgramAdmin
          trigger:
            - call: "GET /mentors/${mentor_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "response status code == 200"
            - "Mentor.${mentor_id}.site_id == ${site_id}"
            - "Mentor.${mentor_id}.subject_endorsements == [MATH]"
            - "Mentor.${mentor_id}.caseload_cap == 2"
            - "Mentor.${mentor_id}.certification_status == UNCERTIFIED"
            - "Mentor.${mentor_id}.training_hours_current_cycle == 18.00"
            - "Mentor.${mentor_id}.active_caseload_count == 0"
            - "Mentor.${mentor_id}.certification_expires_on == null"

      - name: list_mentors_returns_pagination_envelope
        claim_type: listing
        grounds:
          - endpoints[GET /mentors]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /mentors?limit=2&offset=0 over three mentors returns exactly 2 rows with total_count 3 and has_more true, and offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "One open Site with three UNCERTIFIED mentors created in a known order."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Northgate High", site_code: "NG-001", region_code: "NORTH", mentor_slot_cap: 6 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /mentors"
              payload: { site_id: "${site_id}", full_name: "Rosa Alvarez", subject_endorsements: ["MATH"], caseload_cap: 2 }
              as: ProgramAdmin
              captures: { mentor_a_id: $.data.id }
            - call: "POST /mentors"
              payload: { site_id: "${site_id}", full_name: "Ken Ito", subject_endorsements: ["SCIENCE"], caseload_cap: 2 }
              as: ProgramAdmin
              captures: { mentor_b_id: $.data.id }
            - call: "POST /mentors"
              payload: { site_id: "${site_id}", full_name: "Ana Ruiz", subject_endorsements: ["ELA"], caseload_cap: 2 }
              as: ProgramAdmin
              captures: { mentor_c_id: $.data.id }
          trigger:
            - call: "GET /mentors?limit=2&offset=0"
              payload: {}
              as: ProgramAdmin
            - call: "GET /mentors?limit=2&offset=2"
              payload: {}
              as: ProgramAdmin
          assert:
            - "the first list call returns response_type == array with 2 data rows, total_count == 3, limit == 2, offset == 0 and has_more == true"
            - "the second list call returns 1 data row, total_count == 3, offset == 2 and has_more == false"
            - "the union of the two pages is exactly {${mentor_a_id}, ${mentor_b_id}, ${mentor_c_id}}"

      - name: get_novice_teacher_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /novice-teachers/{id}]
          - validations[priority=5]
          - errors[ERR_NOVICE_NOT_FOUND]
        distinguishing_aspect: "GET /novice-teachers/{id} with an id that was never minted returns 404 ERR_NOVICE_NOT_FOUND and no data payload."
        test_recipe:
          setup:
            - "One open Site and one Cohort exist so the database is non-empty, but no NoviceTeacher has ever been created."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Northgate High", site_code: "NG-001", region_code: "NORTH", mentor_slot_cap: 6 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /cohorts"
              payload: { name: "Induction 2026-27", program_year: 2026, region_code: "NORTH", seminar_sessions_required: 1 }
              as: ProgramAdmin
              captures: { cohort_id: $.data.id }
          trigger:
            - call: "GET /novice-teachers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
          assert:
            - "response status code == 404"
            - "response_type == error"
            - "data.error_id == ERR_NOVICE_NOT_FOUND"

      - name: create_mentor_without_full_name_rejected
        claim_type: required_fields
        grounds:
          - entities.Mentor.fields.full_name
          - validations[priority=7]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /mentors omitting the required full_name returns 400 ERR_INVALID_REQUEST and creates no Mentor row."
        test_recipe:
          setup:
            - "One open Site exists."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Northgate High", site_code: "NG-001", region_code: "NORTH", mentor_slot_cap: 6 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /mentors"
              payload: { site_id: "${site_id}", subject_endorsements: ["MATH"], caseload_cap: 2 }
              as: ProgramAdmin
          assert:
            - "response status code == 400"
            - "data.error_id == ERR_INVALID_REQUEST"
            - "GET /mentors?site_id=${site_id} returns total_count == 0"

      - name: cohort_seminar_sessions_required_defaults_to_six
        claim_type: defaults
        grounds:
          - entities.Cohort.fields.seminar_sessions_required
          - entities.Cohort.fields.status
          - endpoints[POST /cohorts]
        distinguishing_aspect: "POST /cohorts omitting seminar_sessions_required stores the declared default 6, while status defaults to FORMING and enrolled_novice_count to 0."
        test_recipe:
          setup:
            - "Empty database with the clock at its startup default."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /cohorts"
              payload: { name: "Induction 2026-27", program_year: 2026, region_code: "NORTH" }
              as: ProgramAdmin
              captures: { cohort_id: $.data.id }
          assert:
            - "Cohort.${cohort_id}.seminar_sessions_required == 6"
            - "Cohort.${cohort_id}.status == FORMING"
            - "Cohort.${cohort_id}.enrolled_novice_count == 0"
            - "Cohort.${cohort_id}.closed_at == null"

      - name: site_active_match_count_is_computed_from_matches
        claim_type: computed_fields
        grounds:
          - entities.Site.fields.active_match_count
          - entities.Mentor.fields.active_caseload_count
          - state_machines.MentorMatch.PROPOSED_to_ACTIVE
        distinguishing_aspect: "Site.active_match_count and Mentor.active_caseload_count are computed counters: both read 0 while the match is PROPOSED and both read 1 once it is ACTIVE, without any client ever supplying them."
        test_recipe:
          setup:
            - "Open Site, CERTIFIED MATH Mentor, MATH NoviceTeacher and a MentorMatch left in PROPOSED."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Northgate High", site_code: "NG-001", region_code: "NORTH", mentor_slot_cap: 6 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /cohorts"
              payload: { name: "Induction 2026-27", program_year: 2026, region_code: "NORTH", seminar_sessions_required: 1 }
              as: ProgramAdmin
              captures: { cohort_id: $.data.id }
            - call: "POST /mentors"
              payload: { site_id: "${site_id}", full_name: "Rosa Alvarez", subject_endorsements: ["MATH"], caseload_cap: 2 }
              as: ProgramAdmin
              captures: { mentor_id: $.data.id }
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "FOUNDATIONS", hours: 8.00, completed_on: "2026-07-10" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "OBSERVATION_PROTOCOL", hours: 6.00, completed_on: "2026-07-11" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "EQUITY", hours: 4.00, completed_on: "2026-07-12" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/certification"
              payload: { action: "CERTIFY" }
              as: ProgramAdmin
              captures: { mentor_v1: $.data.version }
            - call: "POST /novice-teachers"
              payload: { site_id: "${site_id}", cohort_id: "${cohort_id}", full_name: "Dana Pike", subject_area: "MATH", induction_year: 1 }
              as: ProgramAdmin
              captures: { novice_id: $.data.id }
            - call: "POST /mentor-matches"
              payload: { novice_id: "${novice_id}", mentor_id: "${mentor_id}", expected_mentor_version: "${mentor_v1}" }
              as: ProgramAdmin
              captures: { match_id: $.data.id }
          trigger:
            - call: "GET /sites/${site_id}"
              payload: {}
              as: ProgramAdmin
            - call: "POST /mentor-matches/${match_id}/disposition"
              payload: { decision: "ACTIVATE" }
              as: ProgramAdmin
            - call: "GET /sites/${site_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "before the ACTIVATE, Site.${site_id}.active_match_count == 0 and Mentor.${mentor_id}.active_caseload_count == 0"
            - "after the ACTIVATE, Site.${site_id}.active_match_count == 1 and Mentor.${mentor_id}.active_caseload_count == 1"
            - "MentorMatch.${match_id}.match_status == ACTIVE"

      - name: system_fields_are_server_minted_on_novice_creation
        claim_type: system_fields
        grounds:
          - entities.NoviceTeacher.fields.program_status
          - entities.NoviceTeacher.fields.license_stage
          - entities.NoviceTeacher.fields.retention_outcome
        distinguishing_aspect: "A newly created NoviceTeacher carries server-minted id, created_at, updated_at and version 1, plus the system-owned program_status ENROLLED, license_stage PRELIMINARY, license_advancement_status NOT_ELIGIBLE and retention_outcome UNKNOWN, none of which the create payload can name."
        test_recipe:
          setup:
            - "One open Site and one FORMING Cohort in region NORTH."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Northgate High", site_code: "NG-001", region_code: "NORTH", mentor_slot_cap: 6 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /cohorts"
              payload: { name: "Induction 2026-27", program_year: 2026, region_code: "NORTH", seminar_sessions_required: 1 }
              as: ProgramAdmin
              captures: { cohort_id: $.data.id }
          trigger:
            - call: "POST /novice-teachers"
              payload: { site_id: "${site_id}", cohort_id: "${cohort_id}", full_name: "Dana Pike", subject_area: "MATH", induction_year: 1 }
              as: ProgramAdmin
              captures: { novice_id: $.data.id }
          assert:
            - "NoviceTeacher.${novice_id}.version == 1"
            - "NoviceTeacher.${novice_id}.created_at == 2026-08-01T00:00:00Z"
            - "NoviceTeacher.${novice_id}.program_status == ENROLLED"
            - "NoviceTeacher.${novice_id}.license_stage == PRELIMINARY"
            - "NoviceTeacher.${novice_id}.license_advancement_status == NOT_ELIGIBLE"
            - "NoviceTeacher.${novice_id}.retention_outcome == UNKNOWN"
            - "NoviceTeacher.${novice_id}.verified_contact_minutes == 0"
            - "NoviceTeacher.${novice_id}.readiness_index_live == 0.00"
            - "Cohort.${cohort_id}.enrolled_novice_count == 1"

      - name: novice_subject_area_outside_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.NoviceTeacher.fields.subject_area
          - validations[priority=7]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /novice-teachers with subject_area PHYSICAL_EDUCATION, which is outside the declared enum {MATH, SCIENCE, ELA, SOCIAL_STUDIES, SPED, WORLD_LANGUAGE, CTE}, returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "One open Site and one FORMING Cohort in region NORTH."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Northgate High", site_code: "NG-001", region_code: "NORTH", mentor_slot_cap: 6 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /cohorts"
              payload: { name: "Induction 2026-27", program_year: 2026, region_code: "NORTH", seminar_sessions_required: 1 }
              as: ProgramAdmin
              captures: { cohort_id: $.data.id }
          trigger:
            - call: "POST /novice-teachers"
              payload: { site_id: "${site_id}", cohort_id: "${cohort_id}", full_name: "Dana Pike", subject_area: "PHYSICAL_EDUCATION", induction_year: 1 }
              as: ProgramAdmin
          assert:
            - "response status code == 400"
            - "data.error_id == ERR_INVALID_REQUEST"
            - "Cohort.${cohort_id}.enrolled_novice_count == 0"

      - name: milestone_is_immutable_config_without_version
        claim_type: immutability
        grounds:
          - entities.Milestone.fields.code
          - entities.Milestone.fields.sequence_index
          - endpoints[GET /milestones/{id}]
        distinguishing_aspect: "Milestone is declared common_fields false: the created row exposes no version field, the endpoint surface offers only POST /milestones, GET /milestones/{id} and GET /milestones with no mutation or delete route, and a re-read returns byte-identical field values."
        test_recipe:
          setup:
            - "Empty database with the clock at its startup default."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /milestones"
              payload: { code: "M1-ENTRY", title: "Entry conference complete", sequence_index: 1, required_contact_minutes: 0, required_observation_cycles: 0, required_credited_seminars: 0, license_stage_unlocked: "PROVISIONAL", gates_license_recommendation: false }
              as: ProgramAdmin
              captures: { m1_id: $.data.id }
            - call: "GET /milestones/${m1_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Milestone.${m1_id} response body has no version field"
            - "Milestone.${m1_id} response body has no updated_at field"
            - "Milestone.${m1_id}.code == M1-ENTRY"
            - "Milestone.${m1_id}.sequence_index == 1"
            - "Milestone.${m1_id}.prerequisite_milestone_id == null"
            - "the §1.5 surface declares no PATCH, PUT or DELETE route on /milestones or /milestones/{id}"

      - name: novice_creation_with_unknown_cohort_id_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.NoviceTeacher.fields.cohort_id
          - validations[priority=6]
          - errors[ERR_COHORT_NOT_FOUND]
        distinguishing_aspect: "A body foreign key that names no existing row is an existence failure, not a validation failure: POST /novice-teachers with a fabricated cohort_id returns 404 ERR_COHORT_NOT_FOUND even though every other field is well formed."
        test_recipe:
          setup:
            - "One open Site exists; no Cohort has ever been created."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Northgate High", site_code: "NG-001", region_code: "NORTH", mentor_slot_cap: 6 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /novice-teachers"
              payload: { site_id: "${site_id}", cohort_id: "00000000-0000-4000-8000-0000000000ff", full_name: "Dana Pike", subject_area: "MATH", induction_year: 1 }
              as: ProgramAdmin
          assert:
            - "response status code == 404"
            - "data.error_id == ERR_COHORT_NOT_FOUND"

      - name: contact_log_match_fk_is_reverse_reachable
        claim_type: foreign_key_integrity
        grounds:
          - entities.ContactLog.fields.match_id
          - endpoints[GET /contact-logs]
        distinguishing_aspect: "Flat topology: ContactLog.match_id is reverse-reachable through the filtered list GET /contact-logs?match_id=..., which returns exactly the two logs of that match and excludes the log belonging to a second match."
        test_recipe:
          setup:
            - "Open Site with a CERTIFIED MATH Mentor of caseload_cap 2 and two MATH novices, each on its own ACTIVE MentorMatch."
            - "Clock advanced to 2026-08-04T12:00:00Z."
            - "Two contact logs on match A dated 2026-08-02 and 2026-08-03, and one contact log on match B dated 2026-08-03."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Northgate High", site_code: "NG-001", region_code: "NORTH", mentor_slot_cap: 6 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /cohorts"
              payload: { name: "Induction 2026-27", program_year: 2026, region_code: "NORTH", seminar_sessions_required: 1 }
              as: ProgramAdmin
              captures: { cohort_id: $.data.id }
            - call: "POST /mentors"
              payload: { site_id: "${site_id}", full_name: "Rosa Alvarez", subject_endorsements: ["MATH"], caseload_cap: 2 }
              as: ProgramAdmin
              captures: { mentor_id: $.data.id }
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "FOUNDATIONS", hours: 8.00, completed_on: "2026-07-10" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "OBSERVATION_PROTOCOL", hours: 6.00, completed_on: "2026-07-11" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "EQUITY", hours: 4.00, completed_on: "2026-07-12" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/certification"
              payload: { action: "CERTIFY" }
              as: ProgramAdmin
              captures: { mentor_v1: $.data.version }
            - call: "POST /novice-teachers"
              payload: { site_id: "${site_id}", cohort_id: "${cohort_id}", full_name: "Dana Pike", subject_area: "MATH", induction_year: 1 }
              as: ProgramAdmin
              captures: { novice_id: $.data.id }
            - call: "POST /mentor-matches"
              payload: { novice_id: "${novice_id}", mentor_id: "${mentor_id}", expected_mentor_version: "${mentor_v1}" }
              as: ProgramAdmin
              captures: { match_id: $.data.id }
            - call: "POST /mentor-matches/${match_id}/disposition"
              payload: { decision: "ACTIVATE" }
              as: ProgramAdmin
            - call: "POST /novice-teachers"
              payload: { site_id: "${site_id}", cohort_id: "${cohort_id}", full_name: "Eli Navarro", subject_area: "MATH", induction_year: 1 }
              as: ProgramAdmin
              captures: { novice_b_id: $.data.id }
            - call: "GET /mentors/${mentor_id}"
              payload: {}
              as: ProgramAdmin
              captures: { mentor_v2: $.data.version }
            - call: "POST /mentor-matches"
              payload: { novice_id: "${novice_b_id}", mentor_id: "${mentor_id}", expected_mentor_version: "${mentor_v2}" }
              as: ProgramAdmin
              captures: { match_b_id: $.data.id }
            - call: "POST /mentor-matches/${match_b_id}/disposition"
              payload: { decision: "ACTIVATE" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /contact-logs"
              payload: { match_id: "${match_id}", contact_date: "2026-08-02", minutes: 60, contact_type: "ONE_ON_ONE", description: "Planning conference with the first novice teacher" }
              as: Mentor
              as_user_id: "${mentor_id}"
              captures: { la1_id: $.data.id }
            - call: "POST /contact-logs"
              payload: { match_id: "${match_id}", contact_date: "2026-08-03", minutes: 45, contact_type: "CO_PLANNING", description: "Co-planning session with the first novice teacher" }
              as: Mentor
              as_user_id: "${mentor_id}"
              captures: { la2_id: $.data.id }
            - call: "POST /contact-logs"
              payload: { match_id: "${match_b_id}", contact_date: "2026-08-03", minutes: 30, contact_type: "DEBRIEF", description: "Debrief conversation with the second novice teacher" }
              as: Mentor
              as_user_id: "${mentor_id}"
              captures: { lb1_id: $.data.id }
          trigger:
            - call: "GET /contact-logs?match_id=${match_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "response_type == array and total_count == 2"
            - "the returned ids are exactly {${la1_id}, ${la2_id}}"
            - "${lb1_id} is absent from the response"
            - "GET /contact-logs?match_id=${match_b_id} returns total_count == 1"

  - section: state_machines
    instances:
      - name: mentor_certify_transitions_uncertified_to_certified
        claim_type: valid_transition
        grounds: [state_machines.Mentor.transitions.UNCERTIFIED_to_CERTIFIED, "endpoints[POST /mentors/{id}/certification]", calculations.mentor_certification_hour_ledger]
        distinguishing_aspect: "The happy-path certification: with 18.00 accumulated hours and all three required modules posted, action=CERTIFY moves UNCERTIFIED->CERTIFIED, stamps certification_expires_on exactly CERT_TERM_DAYS=365 days after the logical clock, and executes the ledger RESET EVENT so the consumed credits cannot be reused for the next cycle."
        test_recipe:
          setup: ["A Mentor sits at certification_status UNCERTIFIED with training_hours_current_cycle 18.00 and training_modules_current_cycle holding FOUNDATIONS, OBSERVATION_PROTOCOL and EQUITY. The logical clock is at its startup default 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Northgate High", site_code: "NG-001", region_code: "NORTH", mentor_slot_cap: 6 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /mentors"
              payload: { site_id: "${site_id}", full_name: "Rosa Alvarez", subject_endorsements: ["MATH"], caseload_cap: 2 }
              as: ProgramAdmin
              captures: { mentor_id: $.data.id }
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "FOUNDATIONS", hours: 8.00, completed_on: "2026-07-10" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "OBSERVATION_PROTOCOL", hours: 6.00, completed_on: "2026-07-11" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "EQUITY", hours: 4.00, completed_on: "2026-07-12" }
              as: ProgramAdmin
          trigger:
            - call: "POST /mentors/${mentor_id}/certification"
              payload: { action: "CERTIFY" }
              as: ProgramAdmin
          assert:
            - "response_type == \"object\" and HTTP 200"
            - "data.certification_status == \"CERTIFIED\""
            - "data.certification_expires_on == \"2027-08-01T00:00:00Z\" (2026-08-01T00:00:00Z + 365 days)"
            - "data.training_hours_current_cycle == 0.00 — the ledger reset fired"
            - "data.training_modules_current_cycle == [] — the reset also clears the module set"
            - "data.suspension_reason == null"

