  - rule_id: boundary_precision_check
    instances:
      - name: late_fee_tier_boundary_silver_threshold_exact
        grounds:
          - calculations.late_fee
          - entities.Show.fields.lifetime_billed_cents
          - entities.Invoice.fields.late_fee_cents
          - state_machines.Episode.SCHEDULED_to_PUBLISHED
        distinguishing_aspect: |
          Metric = show.lifetime_billed_cents snapshot crossing SILVER_THRESHOLD_CENTS
          (40000), reached via POST /episodes/{id}/publish. At snapshot exactly
          40000 the tier is SILVER (>=), so a late delivery of subtotal 15000 yields
          late_fee_cents = round_half_up(15000*0.035) = 525; at snapshot 39999 it
          would be BRONZE (0.02) -> 300. The >= boundary is the precision point.
        test_recipe:
          setup:
            - "Show S (PER_EPISODE), STANDARD contract. First episode published late but with prior lifetime arranged so that the SECOND episode's snapshot is exactly 40000."
