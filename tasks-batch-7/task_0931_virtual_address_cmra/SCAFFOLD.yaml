    roles: [CmraOperator]
    code: 200
    input: []
    output: DispositionRequest
    side_effects:
      - "DispositionRequest.status PENDING -> EXECUTED"
      - "MailItem.handling_status PENDING_DISPOSITION -> SHREDDED or RETURNED, storage_status -> DESTROYED or RELEASED"
      - "increments DispositionRequest.version by 1"

