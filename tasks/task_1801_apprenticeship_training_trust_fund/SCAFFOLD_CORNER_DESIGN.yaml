  # ===========================================================================
  # Section: roles — RBAC denials and ownership
  # ===========================================================================
  - section: roles
    instances:
      - name: allocation_approve_by_employer_rep_forbidden
        claim_type: role_denial
        grounds: ["roles.CommitteeMember.exclusive_operations", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "An EmployerRep calling allocation approve is rejected with ERR_FORBIDDEN_ROLE before any state or fiscal check."
        test_recipe:
          setup: ["Fund with a PROPOSED allocation; employer E1 exists."]
          setup_api_calls:
            - call: "POST /trust-funds"
              payload: { name: "JATC Training Fund" }
              as: TrustAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /employers"
              payload: { trust_fund_id: "${fund_id}", legal_name: "Ampere Electric LLC", agreement_rate_cents_per_hour: 500 }
              as: TrustAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /funding-allocations"
              payload: { trust_fund_id: "${fund_id}", category: "EQUIPMENT", fiscal_year: 2026, amount_cents: 1000 }
              as: TrustAdmin
              captures: { alloc_id: $.data.id }
            - call: "GET /trust-funds/${fund_id}"
              as: TrustAdmin
              captures: { fund_v: $.data.version }
          trigger:
            - call: "POST /funding-allocations/${alloc_id}/approve"
              payload: { expected_trust_fund_version: "${fund_v}" }
              as: EmployerRep
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_ROLE"
            - "HTTP status == 403"

      - name: report_submit_by_non_owner_forbidden
        claim_type: role_denial
        grounds: ["roles.EmployerRep", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "An EmployerRep whose X-User-ID is a different employer's id cannot submit E1's report: ERR_NOT_RESOURCE_OWNER."
        test_recipe:
          setup: ["Employers E1 (report owner) and E2 exist; report R belongs to E1 and is DRAFT."]
          setup_api_calls:
            - call: "POST /trust-funds"
              payload: { name: "JATC Training Fund" }
              as: TrustAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /employers"
              payload: { trust_fund_id: "${fund_id}", legal_name: "Ampere Electric LLC", agreement_rate_cents_per_hour: 500 }
              as: TrustAdmin
              captures: { emp1_id: $.data.id }
            - call: "POST /employers"
              payload: { trust_fund_id: "${fund_id}", legal_name: "Beacon Mechanical", agreement_rate_cents_per_hour: 500 }
              as: TrustAdmin
              captures: { emp2_id: $.data.id }
            - call: "POST /apprentices"
              payload: { trust_fund_id: "${fund_id}", employer_id: "${emp1_id}", full_name: "App One", trade: "INSIDE_WIREMAN", journeyman_base_rate_cents: 4000 }
              as: TrustAdmin
              captures: { app_id: $.data.id }
            - call: "POST /contribution-reports"
              payload: { employer_id: "${emp1_id}", period_year: 2026, period_month: 6, lines: [{ apprentice_id: "${app_id}", ojt_hours: 10 }] }
              as: EmployerRep
              as_user_id: "${emp1_id}"
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /contribution-reports/${rep_id}/submit"
              payload: {}
              as: EmployerRep
              as_user_id: "${emp2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_RESOURCE_OWNER"
            - "ContributionReport.${rep_id}.status == DRAFT"

      - name: unauthenticated_request_rejected
        claim_type: role_denial
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-Role / X-User-ID headers is rejected with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any other processing."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /trust-funds"
              payload: { name: "No Auth Fund" }
              as: TrustAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
            - "HTTP status == 400"

  # ===========================================================================
  # Section: cross-cutting complexity layers — OCC
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: allocation_approve_stale_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[allocation-approve-stale-fund]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Approving with a fund version captured before another approval succeeded fails with ERR_STALE_VERSION (412); re-reading the fund and retrying with the current version succeeds."
        test_recipe:
          setup: ["Funded fund (available 500000). Allocations A1 (100000) and A2 (50000) PROPOSED. Client read fund version before A1's approval."]
          setup_api_calls:
            - call: "POST /trust-funds"
              payload: { name: "JATC Training Fund" }
              as: TrustAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /employers"
              payload: { trust_fund_id: "${fund_id}", legal_name: "Ampere Electric LLC", agreement_rate_cents_per_hour: 500 }
              as: TrustAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /apprentices"
              payload: { trust_fund_id: "${fund_id}", employer_id: "${emp_id}", full_name: "App One", trade: "INSIDE_WIREMAN", journeyman_base_rate_cents: 4000 }
              as: TrustAdmin
              captures: { app_id: $.data.id }
            - call: "POST /apprentices/${app_id}/submit-registration"
              payload: { agency: "STATE" }
              as: TrustAdmin
            - call: "POST /apprentices/${app_id}/record-registration-decision"
              payload: { outcome: "REGISTERED" }
              as: TrustAdmin
            - call: "POST /apprentices/${app_id}/indenture"
              payload: {}
              as: TrustAdmin
            - call: "POST /contribution-reports"
              payload: { employer_id: "${emp_id}", period_year: 2026, period_month: 3, lines: [{ apprentice_id: "${app_id}", ojt_hours: 1000 }] }
              as: EmployerRep
              as_user_id: "${emp_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /contribution-reports/${rep_id}/submit"
              payload: {}
              as: EmployerRep
              as_user_id: "${emp_id}"
            - call: "POST /contribution-reports/${rep_id}/remit"
              payload: { amount_tendered_cents: 500000 }
              as: EmployerRep
              as_user_id: "${emp_id}"
            - call: "GET /trust-funds/${fund_id}"
              as: TrustAdmin
              captures: { fund_v_pre: $.data.version }
            - call: "POST /funding-allocations"
              payload: { trust_fund_id: "${fund_id}", category: "EQUIPMENT", fiscal_year: 2026, amount_cents: 100000 }
              as: TrustAdmin
              captures: { alloc1_id: $.data.id }
            - call: "POST /funding-allocations"
              payload: { trust_fund_id: "${fund_id}", category: "INSTRUCTION", fiscal_year: 2026, amount_cents: 50000 }
              as: TrustAdmin
              captures: { alloc2_id: $.data.id }
            - call: "POST /funding-allocations/${alloc1_id}/approve"
              payload: { expected_trust_fund_version: "${fund_v_pre}" }
              as: CommitteeMember
              as_user_id: "cm-1"
            - call: "GET /trust-funds/${fund_id}"
              as: TrustAdmin
              captures: { fund_v_post: $.data.version }
          trigger:
            - call: "POST /funding-allocations/${alloc2_id}/approve"
              payload: { expected_trust_fund_version: "${fund_v_pre}" }
              as: CommitteeMember
              as_user_id: "cm-1"
              captures: { err: $.data.error_id }
            - call: "POST /funding-allocations/${alloc2_id}/approve"
              payload: { expected_trust_fund_version: "${fund_v_post}" }
              as: CommitteeMember
              as_user_id: "cm-1"
          assert:
            - "err == ERR_STALE_VERSION"
            - "HTTP status of first trigger call == 412"
            - "FundingAllocation.${alloc2_id}.status == ACTIVE after retry"
            - "TrustFund.${fund_id}.allocated_remaining_cents == 150000"
