            - call: "POST /gaps/${gap_s}/resolve"
              payload: { resolution_kind: "CONTINGENCY_DRAW", priced_amount_cents: 200000 }
              as: BuyoutLead
          trigger:
            - call: "POST /subcontracts/${sub_x}/award"
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION (state check at priority 5 masks the fiscal breach at priority 9: projected 0 + 0 + 10000000 > 9900000 + 0)"
            - "Subcontract.${sub_x}.status == DRAFT (no state drift from the rejected award)"
            - "Subcontract.${sub_m}.status == PENDING_AWARD (sibling untouched)"

      - name: safety_beats_fiscal_life_safety_gap_over_contingency_exceeded
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_UNRESOLVED_LIFE_SAFETY_GAP]
          - errors[ERR_AWARD_EXCEEDS_BUDGET]
        distinguishing_aspect: |
          Pair = business_safety (priority 8) vs business_fiscal (priority 9) —
          a different pair than the sibling's state/fiscal: awarding a
          PENDING_AWARD subcontract with an OPEN LIFE_SAFETY gap AND a fully
          drawn contingency pool (headline 10000000 > 9900000 + 0) MUST return
          ERR_UNRESOLVED_LIFE_SAFETY_GAP, not ERR_AWARD_EXCEEDS_BUDGET.
        test_recipe:
          setup:
            - "Package: estimated_budget_cents=9900000, budgeted_contingency_cents=200000 fully consumed by a CONTINGENCY_DRAW resolution"
            - "sub_m PENDING_AWARD at 10000000 (recommended while contingency was intact)"
            - "One OPEN ScopeGap category=LIFE_SAFETY on the package"
          setup_api_calls:
            - call: "POST /projects"
