        claim_type: role_exclusive_denied
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Requests without X-User-Role / X-User-ID headers fail authentication at priority 1, before any role or business check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /students"
              payload: { full_name: "No Headers", date_of_birth: "2010-05-01T00:00:00Z", grade_level: 9, demographic_group: "WHITE", guardian_id: "gnh" }
          assert:
            - "error_id == ERR_UNAUTHENTICATED with HTTP 401 (request sent with no X-User-Role / X-User-ID headers)"

  # ---------------------------------------------------------------------------
  # Section: cross_cutting_layers
  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_reclassify_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[case-reclassify-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two sequential reclassifications: the first advances case.version; the second, carrying the pre-first expected_case_version, is rejected with 412. Also pins that every mutation increments version by exactly 1."
        test_recipe:
          setup: ["offense codes DISR-01 and DISR-02 (same category); case created by admin_ref_1 (version 1)"]
          setup_api_calls:
            - call: "POST /offense-codes"
              payload: { code: "DISR-01", title: "Disruption", category: "DISRUPTION", severity_level: 2, expellable: false }
              as: DistrictAdmin
              captures: { oc1_id: $.data.id }
            - call: "POST /offense-codes"
              payload: { code: "DISR-02", title: "Disruption other", category: "DISRUPTION", severity_level: 2, expellable: false }
              as: DistrictAdmin
              captures: { oc2_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu OCC", date_of_birth: "2010-05-01T00:00:00Z", grade_level: 9, demographic_group: "WHITE", guardian_id: "gocc" }
              as: SchoolAdministrator
              captures: { stu_id: $.data.id }
            - call: "POST /cases"
              payload: { student_id: "${stu_id}", incident_date: "2026-05-04T08:00:00Z", description: "d" }
              as: SchoolAdministrator
              as_user_id: "admin_ref_1"
              captures: { case_id: $.data.id, v1: $.data.version }
            - call: "POST /cases/${case_id}/classify"
              payload: { offense_code_id: "${oc1_id}", expected_case_version: "${v1}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { v2: $.data.version }
          trigger:
            - call: "POST /cases/${case_id}/classify"
              payload: { offense_code_id: "${oc2_id}", expected_case_version: "${v2}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { v3: $.data.version }
            - call: "POST /cases/${case_id}/classify"
              payload: { offense_code_id: "${oc1_id}", expected_case_version: "${v2}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { err: $.data.error_id }
          assert:
            - "version progression: ${v1} == 1, ${v2} == 2, ${v3} == 3 (each mutation increments by exactly 1)"
            - "reclassify to DISR-02 with current version succeeded (200); reclassify back with the now-stale ${v2} returns error_id == ERR_STALE_VERSION with HTTP 412"
            - "after the 412, case still carries offense DISR-02 (the stale write changed nothing)"

      - name: occ_sanction_adjust_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[case-sanction-reproposal-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Same OCC mechanism on the sanction self-loop: a proposal adjustment carrying the version from before a prior successful adjustment is rejected with 412."
        test_recipe:
          setup: ["offense DISR-01 band occ1 [1,3]; case classified (version 2)"]
          setup_api_calls:
            - call: "POST /offense-codes"
              payload: { code: "DISR-01", title: "Disruption", category: "DISRUPTION", severity_level: 2, expellable: false }
              as: DistrictAdmin
              captures: { oc_id: $.data.id }
            - { call: "POST /offense-codes/${oc_id}/sanction-bands", payload: { occurrence_index: 1, min_days: 1, max_days: 3 }, as: DistrictAdmin }
            - call: "POST /students"
              payload: { full_name: "Stu OCC2", date_of_birth: "2010-05-01T00:00:00Z", grade_level: 9, demographic_group: "WHITE", guardian_id: "gocc2" }
              as: SchoolAdministrator
              captures: { stu_id: $.data.id }
            - call: "POST /cases"
              payload: { student_id: "${stu_id}", incident_date: "2026-05-04T08:00:00Z", description: "d" }
              as: SchoolAdministrator
              as_user_id: "admin_ref_1"
              captures: { case_id: $.data.id, v1: $.data.version }
            - call: "POST /cases/${case_id}/classify"
              payload: { offense_code_id: "${oc_id}", expected_case_version: "${v1}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { v2: $.data.version }
            - call: "POST /cases/${case_id}/sanction"
              payload: { sanction_days: 2, sanction_type: "OUT_OF_SCHOOL", expected_case_version: "${v2}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { v3: $.data.version }
          trigger:
            - call: "POST /cases/${case_id}/sanction"
              payload: { sanction_days: 3, sanction_type: "OUT_OF_SCHOOL", expected_case_version: "${v3}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { v4: $.data.version }
            - call: "POST /cases/${case_id}/sanction"
              payload: { sanction_days: 3, sanction_type: "OUT_OF_SCHOOL", expected_case_version: "${v3}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { err: $.data.error_id }
          assert:
            - "first adjustment (3 days, current version ${v3}) succeeds and returns version ${v4} == ${v3} + 1"
            - "second adjustment replaying the stale ${v3} returns error_id == ERR_STALE_VERSION with HTTP 412"
            - "proposed_sanction_days remains 3 from the accepted adjustment"

      - name: appeal_reversal_cascade_coverage
        claim_type: cascading_side_effects
        grounds: [state_machines.Appeal.FILED_to_REVERSED]
        excluded_because:
          difficulty_instance: appeal_reversal_cascade_case_notice_conference
          rationale: "The 3-level cascade (appeal -> case -> notice -> conference) is asserted hop-by-hop in the named §1.8 instance."

      - name: dual_variant_calculation_coverage
        claim_type: dual_variant_calculation
        grounds: [calculations.occurrence_count, calculations.disproportionality_report]
        excluded_because:
          difficulty_instance: occurrence_window_variants_diverge_on_summer_incident
          rationale: "Both dual-variant calculations are exercised by §1.8 rule-1 instances."

      - name: mdr_threshold_rate_trigger_coverage
        claim_type: rate_threshold_triggers
        grounds: [calculations.sanction_determination]
        excluded_because:
          difficulty_instance: mdr_threshold_exactly_ten_days_not_triggered
          rationale: "The 10-day threshold trigger is pinned at the exact boundary by the named §1.8 instance; this corner file adds the MDR-cap and deadline consequences as separate instances."

      - name: derived_field_reconciliation_coverage
        claim_type: derived_field_reconciliation
        grounds: [entities.Student.fields.cumulative_suspension_days, entities.AltEdSite.fields.seats_occupied]
        excluded_because:
          difficulty_instance: suspension_day_ledger_confirm_then_expunge_restores_zero
          rationale: "Both derived ledgers are reconciled before/after mutating chains in the two §1.8 rule-9 instances."

  # ---------------------------------------------------------------------------
  # Section: consistency_model
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_visibility_classify_response
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: the classify mutation's full effects (status, offense link, both occurrence indices, version bump) are visible in the very response of the same request, no re-read needed."
        test_recipe:
          setup: ["offense DISR-01 with band occ1 [1,3]; case SUBMITTED (version 1)"]
          setup_api_calls:
            - call: "POST /offense-codes"
              payload: { code: "DISR-01", title: "Disruption", category: "DISRUPTION", severity_level: 2, expellable: false }
              as: DistrictAdmin
              captures: { oc_id: $.data.id }
            - { call: "POST /offense-codes/${oc_id}/sanction-bands", payload: { occurrence_index: 1, min_days: 1, max_days: 3 }, as: DistrictAdmin }
            - call: "POST /students"
              payload: { full_name: "Stu Imm", date_of_birth: "2010-05-01T00:00:00Z", grade_level: 9, demographic_group: "WHITE", guardian_id: "gimm" }
              as: SchoolAdministrator
              captures: { stu_id: $.data.id }
            - call: "POST /cases"
              payload: { student_id: "${stu_id}", incident_date: "2026-05-04T08:00:00Z", description: "d" }
              as: SchoolAdministrator
              as_user_id: "admin_ref_1"
              captures: { case_id: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /cases/${case_id}/classify"
              payload: { offense_code_id: "${oc_id}", expected_case_version: "${v1}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { st_after: $.data.status, occ: $.data.occurrence_index, occ_ay: $.data.occurrence_index_ay, v_after: $.data.version }
          assert:
            - "response shows status == CLASSIFIED (got ${st_after}), occurrence_index == 1 (got ${occ}), occurrence_index_ay == 1 (got ${occ_ay}), version == 2 (got ${v_after}) — all effects visible immediately"
