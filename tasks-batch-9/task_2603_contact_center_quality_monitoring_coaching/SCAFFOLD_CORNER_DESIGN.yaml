            - call: "POST /evaluations/${e1}/deliver"
              payload: {}
              as: QualityEvaluator
              as_user_id: "${ev1}"
              captures: { e1v: $.data.version }
            - call: "POST /disputes"
              payload: { evaluation_id: "${e1}", disputed_behavior_codes: ["RESOLVE"], rationale: "The next step was agreed with the customer.", expected_evaluation_version: "${e1v}" }
              as: Agent
              as_user_id: "${ag1}"
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /disputes/${d1}/resolve"
              payload: { outcome: "REJECTED", outcome_note: "Too early to say." }
              as: QualityEvaluator
              as_user_id: "${ev2}"
            - call: "POST /disputes/${d1}/respond"
              payload: { additional_rationale: "Adding detail nobody asked for." }
              as: Agent
              as_user_id: "${ag1}"
            - call: "GET /evaluations/${e1}"
              payload: {}
              as: Agent
              as_user_id: "${ag1}"
              captures: { e1v2: $.data.version }
            - call: "POST /disputes"
              payload: { evaluation_id: "${e1}", disputed_behavior_codes: ["GREET"], rationale: "A second, parallel complaint.", expected_evaluation_version: "${e1v2}" }
              as: Agent
              as_user_id: "${ag1}"
            - call: "POST /disputes/${d1}/review"
              payload: {}
              as: QualityEvaluator
              as_user_id: "${ev1}"
            - call: "POST /disputes/${d1}/review"
              payload: {}
              as: QualityEvaluator
              as_user_id: "${ev2}"
            - call: "POST /disputes/${d1}/review"
              payload: {}
              as: QualityEvaluator
              as_user_id: "${ev2}"
            - call: "POST /disputes/${d1}/respond"
              payload: { additional_rationale: "Still out of turn." }
              as: Agent
              as_user_id: "${ag1}"
            - call: "POST /disputes/${d1}/resolve"
              payload: { outcome: "NEEDS_MORE_INFO", outcome_note: "Which part of the call are you referring to?" }
              as: QualityEvaluator
              as_user_id: "${ev2}"
            - call: "POST /disputes/${d1}/respond"
              payload: { additional_rationale: "Minutes 04:10 to 05:00 of the recording." }
              as: Agent
              as_user_id: "${ag1}"
          assert:
            - "setup sanity -- Dispute.${d1}.status == SUBMITTED, round_count == 0, reviewer_evaluator_id == null and Evaluation.${e1}.feedback_status == DISPUTED"
            - "trigger 1 -> HTTP 409 ERR_DISPUTE_NOT_RESOLVABLE: resolve demands UNDER_REVIEW, and nobody has picked the dispute up"
            - "trigger 2 -> HTTP 409 ERR_DISPUTE_NOT_RESPONDABLE: respond demands NEEDS_MORE_INFO"
            - "trigger 4 -> HTTP 409 ERR_DISPUTE_ALREADY_OPEN: ${d1} is non-terminal, and because the payload carried the current version ${e1v2} the OCC rule at priority 8 passed first -- so this is rule 41 talking, not a stale-version or feedback-status refusal"
            - "trigger 5 -> HTTP 403 ERR_SEGREGATION_OF_DUTIES: ${ev1} authored ${e1}, so the author may not review the dispute even though the status is SUBMITTED and reviewable"
            - "trigger 6 -> HTTP 200: Dispute.${d1}.status == UNDER_REVIEW and reviewer_evaluator_id == ${ev2}"
            - "trigger 7 -> HTTP 409 ERR_DISPUTE_NOT_REVIEWABLE: review is not idempotent, and reviewer_evaluator_id is still ${ev2}"
            - "trigger 8 -> HTTP 409 ERR_DISPUTE_NOT_RESPONDABLE: UNDER_REVIEW is not NEEDS_MORE_INFO either"
            - "trigger 9 -> HTTP 200: status == NEEDS_MORE_INFO and round_count == 1"
            - "trigger 10 -> HTTP 200: status back to SUBMITTED with reviewer_evaluator_id == null and the rationale extended by the agent's additional text -- the cycle is legal exactly once the status says so"
            - "GET /disputes?evaluation_id=${e1} returns total_count 1 for the whole sequence, and Evaluation.${e1}.feedback_status is DISPUTED throughout (the NEEDS_MORE_INFO loop never returns feedback to the agent)"
