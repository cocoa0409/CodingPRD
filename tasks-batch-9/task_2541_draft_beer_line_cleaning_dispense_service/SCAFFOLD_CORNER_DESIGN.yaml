      - name: corner_error_technician_route_conflict_is_triggerable
        claim_type: Triggerability
        grounds:
          - errors.ERR_TECHNICIAN_ROUTE_CONFLICT
          - validations[34].ERR_TECHNICIAN_ROUTE_CONFLICT
        excluded_because:
          difficulty_instance: "boundary_precision_check / technician_route_gap_of_exactly_thirty_minutes_is_accepted_and_twenty_nine_is_rejected"
          rationale: |
            §1.8 rule 6 already books back-to-back stops for one technician at a
            29-minute and a 30-minute gap, so the code's trigger and its exact
            TRAVEL_BUFFER_MINUTES edge are both asserted there.

      - name: corner_error_venue_slot_conflict_is_triggerable
        claim_type: Triggerability
        grounds:
          - errors.ERR_VENUE_SLOT_CONFLICT
          - validations[33].ERR_VENUE_SLOT_CONFLICT
        excluded_because:
          difficulty_instance: "boundary_precision_check / venue_slots_that_merely_touch_at_the_minute_boundary_conflict"
          rationale: |
            §1.8 rule 6 books two visits on one venue floor whose intervals share
            a single minute boundary and asserts the CLOSED-interval refusal.

      - name: corner_error_glycol_alarm_block_is_triggerable
        claim_type: Triggerability
        grounds:
          - errors.ERR_GLYCOL_ALARM_BLOCK
          - validations[37].ERR_GLYCOL_ALARM_BLOCK
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / cleaning_cycle_blocked_while_the_accounts_glycol_loop_sits_in_the_alarm_band"
          rationale: |
            §1.8 rule 7 drives the account's loop into ALARM with cooler
            readings, asserts the blocked cycle, then services the loop back into
            band and re-runs the cycle successfully.

      - name: corner_error_diagnostic_rounds_exhausted_is_triggerable
        claim_type: Triggerability
        grounds:
          - errors.ERR_DIAGNOSTIC_ROUNDS_EXHAUSTED
          - validations[49].ERR_DIAGNOSTIC_ROUNDS_EXHAUSTED
        excluded_because:
          difficulty_instance: "non_linear_state_machine / complaint_alternates_diagnosing_and_awaiting_parts_until_round_cap_then_reopens"
          rationale: |
            §1.8 rule 3 walks a complaint through MAX_DIAGNOSTIC_ROUNDS and
            asserts the refusal of the fourth round.

      - name: corner_error_program_not_active_is_triggerable
        claim_type: Triggerability
        grounds:
          - errors.ERR_PROGRAM_NOT_ACTIVE
          - validations[26].ERR_PROGRAM_NOT_ACTIVE
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / contract_activation_blocked_because_its_brewer_program_was_ended"
          rationale: |
            §1.8 rule 7 ends the brewer program and asserts that the contract's
            DRAFT_to_ACTIVE transition is refused with this code until the
            program dependency is repaired.

      - name: corner_voiding_a_cycle_on_a_settled_visit_is_refused
        claim_type: Triggerability
        grounds:
          - errors.ERR_VISIT_ALREADY_SETTLED
          - validations[25].ERR_VISIT_ALREADY_SETTLED
          - state_machines.CleaningCycle.POSTED_to_VOIDED
        distinguishing_aspect: |
          The auditor's void is legal while the visit is merely WORK_COMPLETE but
          becomes ERR_VISIT_ALREADY_SETTLED (409) the moment the venue signs and
          settlement_state flips to SETTLED — the cycle stays POSTED and the lot
          volume is not handed back, so the settled compliance record is frozen.
        test_recipe:
          setup:
            - "ServiceAccount 'Anchor Alehouse' ACTIVE with an ACTIVE contract (21 days -> multiplier 1.10, 4 lines, 4175, 7500) and no brewer program."
            - "BeerLine #1 32ft/4ft/0.375in ALE; Technician 'Dana Ruiz'; CAUSTIC lot C-2001 20.0 L."
