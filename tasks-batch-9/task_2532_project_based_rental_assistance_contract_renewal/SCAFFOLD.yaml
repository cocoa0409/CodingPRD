  # ---- renewal cases ----------------------------------------------------
  - method: POST
    path: /pbra/renewal-cases
    purpose: "Open a renewal case for a contract whose expiration falls inside the renewal window."
    input: [contract_id]
    output: RenewalCase
    roles: [OwnerAgent]
    side_effects:
      - "Creates RenewalCase with rent_track_status TERMS_PENDING, notice_track_status NOTICES_PENDING, opened_on_date = clock date, days_to_expiration_at_open = whole days from the clock date to HapContract.expiration_date, rcs_required = false."
      - "Sets HapContract.lifecycle_status = RENEWAL_PENDING and increments HapContract.version by 1."
  - method: GET
    path: /pbra/renewal-cases/{id}
    purpose: "Read one renewal case, including both track states and all four rent figures."
    input: []
    output: RenewalCase
    roles: [OwnerAgent, ContractAdministrator, HudFieldOffice, PhaAdministrator]
    side_effects: []
  - method: POST
    path: /pbra/renewal-cases/{id}/select-option
    purpose: "Select the renewal option permitted for the contract type."
    input: [renewal_option]
    output: RenewalCase
    roles: [OwnerAgent]
    side_effects:
      - "Sets renewal_option and rent_track_status = OPTION_SELECTED."
      - "Recomputes rcs_required = (renewal_option == OPTION_1_MARK_UP_TO_MARKET) OR (adjustment_method == BUDGET_BASED); selecting OPTION_1_MARK_UP_TO_MARKET therefore makes an ACCEPTED study mandatory before approve-rents."
  - method: POST
    path: /pbra/renewal-cases/{id}/elect-adjustment
    purpose: "Elect the rent adjustment method (OCAF or budget-based) and compute both candidate rents."
    input: [adjustment_method]
    output: RenewalCase
    roles: [OwnerAgent]
    side_effects:
      - "Sets adjustment_method; keeps rent_track_status at OPTION_SELECTED (self-transition, re-electable while the track has not advanced)."
      - "Recomputes ocaf_rent_per_unit_cents via calculations.ocaf_adjusted_rent and budget_rent_per_unit_cents via calculations.budget_based_rent from the contract's current per-unit components."
      - "Recomputes rcs_required = (renewal_option == OPTION_1_MARK_UP_TO_MARKET) OR (adjustment_method == BUDGET_BASED), so electing BUDGET_BASED makes an ACCEPTED study mandatory and re-electing OCAF on a non-MUTM option releases the requirement."
  - method: POST
    path: /pbra/renewal-cases/{id}/approve-rents
    purpose: "Contract administrator approves the renewal rent produced by the elected variant."
    input: []
    output: RenewalCase
    roles: [ContractAdministrator]
    side_effects:
      - "Sets approved_rent_per_unit_cents = calculations.renewal_rent_determination output for the elected adjustment_method."
      - "Sets rents_approver_user_id = X-User-ID and rent_track_status = RENTS_APPROVED."
  - method: POST
    path: /pbra/renewal-cases/{id}/execute-renewal
    purpose: "Execute the renewed contract, writing the approved rent and the new expiration date onto the contract."
    input: [expected_contract_version]
    output: RenewalCase
    roles: [ContractAdministrator]
    side_effects:
      - "Sets rent_track_status = EXECUTED."
      - "Sets HapContract.contract_rent_per_unit_cents and renewed_rent_per_unit_cents to RenewalCase.approved_rent_per_unit_cents, renewed_option = RenewalCase.renewal_option, renewed_expiration_date = expiration_date advanced by term_months whole months, expiration_date = renewed_expiration_date, lifecycle_status = RENEWED, and increments HapContract.version by 1."
      - "Requires notice_track_status == RENEWAL_NOTICED (guarded cross-track transition)."
  - method: POST
    path: /pbra/renewal-cases/{id}/record-opt-out
    purpose: "Record the owner's opt-out after the one-year notice, releasing units and minting enhanced vouchers for the assisted households."
    input: []
    output: RenewalCase
    roles: [OwnerAgent]
    side_effects:
      - "Sets notice_track_status = OPT_OUT_NOTICED."
      - "Sets HapContract.lifecycle_status = OPT_OUT_PENDING and increments HapContract.version by 1."
      - "Sets status = OPT_OUT_NOTICED and ev_eligible = true on every TenantHousehold of the property whose status is ACTIVE, and increments each household's version by 1."
      - "Creates one EnhancedVoucher in state PENDING per household transitioned, whose payment_standard_cents, ttp_snapshot_cents and entitlement_cents all come from calculations.enhanced_voucher_entitlement."
      - "Moves no unit counters: a noticed household is still project-based assisted until its enhanced voucher is issued or it moves out."
  - method: POST
    path: /pbra/renewal-cases/{id}/finalize-opt-out
    purpose: "Finalize the opt-out once the notice period has fully elapsed and every noticed household holds an issued voucher."
    input: []
    output: RenewalCase
    roles: [ContractAdministrator]
    side_effects:
      - "Sets notice_track_status = OPT_OUT_FINALIZED."
      - "Sets HapContract.lifecycle_status = EXPIRED_OPT_OUT, hap_ledger_balance_cents = 0 and increments HapContract.version by 1."
      - "Adds the pre-transition Property.units_under_hap_count to Property.released_unit_count, sets units_under_hap_count = 0 and increments Property.version by 1, preserving calculations.assisted_unit_conservation."
  - method: GET
    path: /pbra/renewal-cases/{id}/rent-comparability-studies
    purpose: "List the rent comparability studies of one renewal case, ordered by created_at ASC."
    input: ["state?", "limit?", "offset?"]
    output: RentComparabilityStudy[]
    roles: [OwnerAgent, ContractAdministrator, HudFieldOffice, PhaAdministrator]
    side_effects: []
  - method: GET
    path: /pbra/renewal-cases/{id}/tenant-notices
    purpose: "List the notices issued under one renewal case, ordered by created_at ASC."
    input: ["notice_type?", "status?", "limit?", "offset?"]
    output: TenantNotice[]
    roles: [OwnerAgent, ContractAdministrator, HudFieldOffice, PhaAdministrator]
    side_effects: []
  - method: GET
    path: /pbra/renewal-cases/{id}/restructuring-determinations
    purpose: "List the restructuring determinations of one renewal case, ordered by created_at ASC."
    input: ["limit?", "offset?"]
    output: RestructuringDetermination[]
    roles: [OwnerAgent, ContractAdministrator, HudFieldOffice]
    side_effects: []
  - method: GET
    path: /pbra/renewal-cases/{id}/enhanced-vouchers
    purpose: "List the enhanced vouchers minted by one renewal case, ordered by created_at ASC."
    input: ["state?", "limit?", "offset?"]
    output: EnhancedVoucher[]
    roles: [OwnerAgent, ContractAdministrator, HudFieldOffice, PhaAdministrator]
    side_effects: []

  # ---- rent comparability studies ---------------------------------------
  - method: POST
    path: /pbra/rent-comparability-studies
    purpose: "Start a rent comparability study for the case, optionally superseding a rejected study."
    input: [renewal_case_id, appraiser_name, "supersedes_study_id?"]
    output: RentComparabilityStudy
    roles: [OwnerAgent]
    side_effects:
      - "Creates RentComparabilityStudy in state DRAFT with challenge_round = 0, accepted_comparable_count = 0, estimated_market_rent_cents = 0."
      - "When supersedes_study_id is present, sets that study's state to SUPERSEDED and increments its version by 1."
  - method: GET
    path: /pbra/rent-comparability-studies/{id}
    purpose: "Read one rent comparability study."
    input: []
    output: RentComparabilityStudy
    roles: [OwnerAgent, ContractAdministrator, HudFieldOffice, PhaAdministrator]
    side_effects: []
  - method: GET
    path: /pbra/rent-comparability-studies
    purpose: "List rent comparability studies filtered by case, by superseded predecessor or by state, ordered by created_at ASC."
    input: ["renewal_case_id?", "supersedes_study_id?", "state?", "limit?", "offset?"]
    output: RentComparabilityStudy[]
    roles: [OwnerAgent, ContractAdministrator, HudFieldOffice, PhaAdministrator]
    side_effects: []
  - method: POST
    path: /pbra/comparables
    purpose: "Add one comparable unit with its gross rent adjustments to a draft study."
    input: [study_id, address_label, raw_rent_cents, adjustment_total_cents, utility_adjustment_cents, weight]
    output: Comparable
    roles: [OwnerAgent]
    side_effects:
      - "Creates Comparable in status ACCEPTED with adjusted_rent_cents per calculations.comparable_market_rent step 1."
      - "Recomputes RentComparabilityStudy.estimated_market_rent_cents and accepted_comparable_count over the study's ACCEPTED comparables and increments the study's version by 1."
      - "Requires the study to be in state DRAFT."
  - method: GET
    path: /pbra/rent-comparability-studies/{id}/comparables
    purpose: "List the comparables of one study, ordered by created_at ASC."
    input: ["status?", "limit?", "offset?"]
    output: Comparable[]
    roles: [OwnerAgent, ContractAdministrator, HudFieldOffice, PhaAdministrator]
    side_effects: []
  - method: POST
    path: /pbra/rent-comparability-studies/{id}/submit
    purpose: "Submit the study for contract-administrator review."
    input: []
    output: RentComparabilityStudy
    roles: [OwnerAgent]
    side_effects:
      - "Sets state = SUBMITTED and submitted_on_date = clock date."
      - "Writes RentComparabilityStudy.estimated_market_rent_cents onto RenewalCase.comparable_market_rent_cents and increments the case's version by 1."
  - method: POST
    path: /pbra/rent-comparability-studies/{id}/challenge
    purpose: "Reviewer challenge: strike named comparables and return the study to the owner-agent."
    input: [reason, struck_comparable_ids]
    output: RentComparabilityStudy
    roles: [ContractAdministrator]
    side_effects:
      - "Sets state = CHALLENGED, increments challenge_round by 1 and sets last_challenge_reason = reason."
      - "Sets status = STRUCK on every named comparable of this study and increments each comparable's version by 1."
      - "Recomputes estimated_market_rent_cents and accepted_comparable_count over the study's remaining ACCEPTED comparables."
      - "Writes the recomputed estimated_market_rent_cents onto RenewalCase.comparable_market_rent_cents, sets RenewalCase.challenge_reviewer_user_id = X-User-ID and increments the case's version by 1."
  - method: POST
    path: /pbra/rent-comparability-studies/{id}/decide
    purpose: "Accept or reject a submitted study."
    input: [decision, "reason?"]
    output: RentComparabilityStudy
    roles: [ContractAdministrator]
    side_effects:
      - "Sets state = ACCEPTED when decision is ACCEPT and REJECTED when decision is REJECT."
      - "On ACCEPT the RenewalCase is not moved: the accepted study is what satisfies the priority-40 guard on approve-rents, and RenewalCase.comparable_market_rent_cents keeps the value written at submit."
      - "On REJECT, RenewalCase.comparable_market_rent_cents keeps the rejected study's value until a superseding study is submitted."

  # ---- utility allowance analyses ----------------------------------------
  - method: POST
    path: /pbra/utility-allowance-analyses
    purpose: "Open a utility allowance analysis for the property using the factor-based or engineering-based method."
    input: [property_id, method, effective_date, "utility_rate_change_pct?", "engineering_estimate_cents?"]
    output: UtilityAllowanceAnalysis
    roles: [OwnerAgent]
    side_effects:
      - "Creates UtilityAllowanceAnalysis in state DRAFT with baseline_allowance_cents = Property.current_utility_allowance_cents, proposed_allowance_cents and change_pct per calculations.utility_allowance_adjustment, requires_field_office_approval = (change_pct magnitude > UA_FIELD_OFFICE_THRESHOLD_PCT), recertified_tenant_count = 0."
  - method: GET
    path: /pbra/utility-allowance-analyses/{id}
    purpose: "Read one utility allowance analysis."
    input: []
    output: UtilityAllowanceAnalysis
    roles: [OwnerAgent, ContractAdministrator, HudFieldOffice, PhaAdministrator]
    side_effects: []
  - method: POST
    path: /pbra/utility-allowance-analyses/{id}/submit
    purpose: "Submit the analysis for review."
    input: []
    output: UtilityAllowanceAnalysis
    roles: [OwnerAgent]
    side_effects:
      - "Sets state = SUBMITTED."
  - method: POST
    path: /pbra/utility-allowance-analyses/{id}/decide
    purpose: "Accept or reject a submitted analysis (decision is ACCEPT or REJECT); accepting a change above the field-office threshold is reserved to HudFieldOffice."
    input: [decision, "reason?"]
    output: UtilityAllowanceAnalysis
    roles: [ContractAdministrator, HudFieldOffice]
    side_effects:
      - "Sets state = APPROVED when decision is ACCEPT and REJECTED when decision is REJECT."
      - "On ACCEPT, sets approver_user_id = X-User-ID."
  - method: POST
    path: /pbra/utility-allowance-analyses/{id}/apply
    purpose: "Apply an approved allowance to the property and recertify every active household."
    input: [expected_property_version]
    output: UtilityAllowanceAnalysis
    roles: [ContractAdministrator]
    side_effects:
      - "Sets state = APPLIED, applied_on_date = clock date."
      - "Sets Property.current_utility_allowance_cents = proposed_allowance_cents, last_applied_ua_effective_date = effective_date, and increments Property.version by 1."
      - "For every TenantHousehold of the property with status ACTIVE, creates a TenantCertification with cert_type UA_ADJUSTMENT and effective_date = the analysis effective_date whose money fields come from calculations.tenant_rent_recalculation, sets the household's previous ACTIVE certification to SUPERSEDED, updates TenantHousehold.current_ttp_cents and current_hap_cents, and increments the household's version by 1."
      - "Sets recertified_tenant_count = the number of certifications created."

  # ---- tenant households and certifications -----------------------------
  - method: POST
    path: /pbra/tenant-households
    purpose: "Add an assisted household with the income figures that drive its total tenant payment."
    input: [property_id, unit_number, household_name, annual_adjusted_income_cents, annual_gross_income_cents, family_size]
    output: TenantHousehold
    roles: [OwnerAgent]
    side_effects:
      - "Creates TenantHousehold in status ACTIVE with move_out_date = null, current_ttp_cents = null, current_hap_cents = null, ev_eligible = false."
  - method: GET
    path: /pbra/tenant-households/{id}
    purpose: "Read one household, including its current total tenant payment and HAP figures."
    input: []
    output: TenantHousehold
    roles: [OwnerAgent, ContractAdministrator, HudFieldOffice, PhaAdministrator]
    side_effects: []
  - method: POST
    path: /pbra/tenant-households/{id}/move-out
    purpose: "Record a household move-out, releasing its unit from the project-based ledger."
    input: [move_out_date]
    output: TenantHousehold
    roles: [OwnerAgent]
    side_effects:
      - "Sets status = MOVED_OUT and move_out_date = the supplied date."
      - "Increments Property.released_unit_count by 1; decrements Property.enhanced_voucher_unit_count by 1 when the household was EV_ISSUED, otherwise decrements Property.units_under_hap_count by 1; increments Property.version by 1."
      - "Leaves every TenantCertification of the household untouched so that already-closed voucher periods still reconcile."
  - method: POST
    path: /pbra/tenant-certifications
    purpose: "Certify a household, recomputing its total tenant payment, tenant rent, utility reimbursement and HAP."
    input: [tenant_id, cert_type, effective_date, expected_tenant_version]
    output: TenantCertification
    roles: [OwnerAgent]
    side_effects:
      - "Creates TenantCertification in status ACTIVE with the money fields from calculations.tenant_rent_recalculation and snapshots of Property.current_utility_allowance_cents and the contract's in-force per-unit rent."
      - "Sets the household's previous ACTIVE certification to SUPERSEDED and increments that certification's version by 1."
      - "Sets TenantHousehold.current_ttp_cents = ttp_cents, current_hap_cents = hap_cents and increments TenantHousehold.version by 1."
  - method: GET
    path: /pbra/tenant-certifications/{id}
    purpose: "Read one certification."
    input: []
    output: TenantCertification
    roles: [OwnerAgent, ContractAdministrator, HudFieldOffice, PhaAdministrator]
    side_effects: []
  - method: GET
    path: /pbra/tenant-households/{id}/certifications
    purpose: "List the certifications of one household, ordered by effective_date ASC then created_at ASC."
    input: ["status?", "cert_type?", "limit?", "offset?"]
    output: TenantCertification[]
    roles: [OwnerAgent, ContractAdministrator, HudFieldOffice, PhaAdministrator]
    side_effects: []
  - method: GET
    path: /pbra/tenant-households/{id}/notices
    purpose: "List the notices addressed to one household, ordered by created_at ASC."
    input: ["status?", "limit?", "offset?"]
    output: TenantNotice[]
    roles: [OwnerAgent, ContractAdministrator, HudFieldOffice, PhaAdministrator]
    side_effects: []
  - method: GET
    path: /pbra/tenant-households/{id}/enhanced-vouchers
    purpose: "List the enhanced vouchers of one household, ordered by created_at ASC."
    input: ["state?", "limit?", "offset?"]
    output: EnhancedVoucher[]
    roles: [OwnerAgent, ContractAdministrator, HudFieldOffice, PhaAdministrator]
    side_effects: []

  # ---- tenant notices ---------------------------------------------------
  - method: POST
    path: /pbra/tenant-notices
    purpose: "Issue a statutory notice (renewal intent, one-year opt-out, 120-day termination or rent change) under a renewal case."
    input: [renewal_case_id, notice_type, effective_date, "tenant_id?"]
    output: TenantNotice
    roles: [OwnerAgent]
    side_effects:
      - "Creates TenantNotice in status ISSUED with issued_date = clock date, lead_days and required_lead_days per calculations.notice_window_compliance."
      - "When notice_type == RENEWAL_INTENT and the case notice track is NOTICES_PENDING, sets RenewalCase.notice_track_status = RENEWAL_NOTICED and increments the case's version by 1."
      - "When notice_type == OPT_OUT_ONE_YEAR, sets RenewalCase.opt_out_notice_id = this notice id and increments the case's version by 1; the notice track only moves later, on record-opt-out."
  - method: GET
    path: /pbra/tenant-notices/{id}
    purpose: "Read one notice, including its computed and required lead days."
    input: []
    output: TenantNotice
    roles: [OwnerAgent, ContractAdministrator, HudFieldOffice, PhaAdministrator]
    side_effects: []
  - method: POST
    path: /pbra/tenant-notices/{id}/rescind
    purpose: "Rescind an issued notice; rescinding the case's one-year opt-out notice compensates the whole opt-out cascade."
    input: [reason]
    output: TenantNotice
    roles: [OwnerAgent]
    side_effects:
      - "Sets status = RESCINDED and rescind_reason = reason."
      - "When this notice is the RenewalCase.opt_out_notice_id and the case notice track is OPT_OUT_NOTICED: sets notice_track_status = NOTICES_PENDING, clears opt_out_notice_id, and increments the case's version by 1."
      - "In that same case, sets HapContract.lifecycle_status back to RENEWAL_PENDING and increments the contract's version by 1."
      - "In that same case, returns every TenantHousehold with status OPT_OUT_NOTICED to ACTIVE with ev_eligible = false and increments each household's version by 1."
      - "In that same case, sets every EnhancedVoucher in state PENDING to RESCINDED and increments each voucher's version by 1; no unit counter moves because PENDING vouchers never moved one."
      - "When notice_type == RENEWAL_INTENT, only the notice row changes: notice_track_status stays at RENEWAL_NOTICED because the renewal-intent notification requirement is discharged by the act of noticing, and no NOTICES_PENDING return transition is declared for that state."

  # ---- restructuring determinations --------------------------------------
