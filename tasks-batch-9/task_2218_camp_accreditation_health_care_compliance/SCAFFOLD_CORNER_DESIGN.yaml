              payload: { visit_id: "${visit_id}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { def_id: "$.data[0].id" }
            - call: "POST /accreditation/cycles/${cycle_id}/decision"
              as: AccreditationOfficer
              as_user_id: "officer-2"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-31T00:00:00Z" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/deficiencies/${def_id}/correction-plan"
              payload: { correction_plan_text: "too late to matter" }
              as: CampDirector
              as_user_id: "${camp_id}"
          assert:
            - "before the trigger: Deficiency.${def_id}.severity == SCORED, base_points == 2, penalty_points == 2, correction_due_date == 2026-10-30 (tier 0, 90 days from 2026-08-01)"
            - "before the trigger: AccreditationCycle.${cycle_id}.final_mandatory_pct == 100.00, final_weighted_pct == 95.00, decision_level == ACCREDITED, status == IN_CORRECTION, assessed_fee_cents == 203700, correction_deadline_at == 2026-10-30T23:59:59.999Z"
            - "before the trigger: Camp.${camp_id}.accreditation_status == ACCREDITED, prior_accredited_cycle_count == 1, last_accredited_year == 2026, penalty_point_balance == 2, compliance_posture == OPEN"
            - "clock call: 200 with current_utc == 2026-10-31T00:00:00Z, escalated_deficiency_count == 1, terminated_cycle_count == 1"
            - "Deficiency.${def_id}.status == ESCALATED"
            - "AccreditationCycle.${cycle_id}.status == TERMINATED with decision_level still ACCREDITED"
            - "Camp.${camp_id}.accreditation_status == REVOKED and compliance_posture == FROZEN and health_intake_status == SUSPENDED - the ESCALATED deficiency alone freezes the camp"
            - "Camp.${camp_id}.penalty_point_balance == 2 - ESCALATED stays inside the counted set"
            - "second trigger call: 409 ERR_DEFICIENCY_INVALID_STATE - correction-plan demands OPEN, and the state check outranks the priority-54 expired-window check"

      - name: parallel_state_dimensions_on_standard_evaluation
        claim_type: Valid Transition
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines[StandardEvaluation.self_status]
          - state_machines[StandardEvaluation.visit_status]
        excluded_because:
          difficulty_instance: standard_evaluation_parallel_dimensions_evolve_independently
          rationale: "The parallel-shape claim - both dimensions advancing without interference and the combined state staying correct - is the whole subject of the named 1.8 instance."

      - name: cyclic_deficiency_revision_loop_terminates
        claim_type: Valid Transition
        grounds:
          - state_machines[Deficiency].transitions.PLAN_SUBMITTED_to_OPEN
        excluded_because:
          difficulty_instance: deficiency_plan_revision_cycle_returns_to_open_then_escalates_on_third_rejection
          rationale: "The loop-back edge and its third-revision termination condition are asserted end-to-end by the named 1.8 instance."

      - name: cascade_down_from_visitor_deactivation_to_cycle
        claim_type: Side Effect Execution
        grounds:
          - state_machines[Visitor].transitions.ACTIVE_to_INACTIVE
          - state_machines[VisitAssignment]
          - state_machines[AccreditationVisit].transitions.SCHEDULED_to_DRAFT
        excluded_because:
          difficulty_instance: visitor_deactivation_cascade_reverts_visit_and_cycle
          rationale: "The four-hop backward cascade including the cycle revert is the named 1.8 instance's subject."

      - name: ledger_sync_from_finalize_scoring_to_camp_posture
        claim_type: Side Effect Execution
        grounds:
          - endpoints[POST /accreditation/visits/{visitId}/finalize-scoring]
          - calculations.camp_compliance_posture
        excluded_because:
          difficulty_instance: finalize_scoring_cascade_freezes_camp_and_rejects_verified_self_assessment
          rationale: "The penalty-balance roll-up into FROZEN posture and the downstream plan and evaluation knock-backs are asserted by the named 1.8 instance."

      - name: compensation_of_the_controlled_ledger_on_void
        claim_type: Side Effect Execution
        grounds:
          - entities.MedicationAdministrationRecord.fields.record_status
          - endpoints[POST /accreditation/medication-records/{recordId}/void]
          - calculations.controlled_substance_ledger
        excluded_because:
          difficulty_instance: controlled_ledger_and_dosing_window_restored_exactly_after_void
          rationale: "Undo semantics - stock and dosing-window occupancy both restored with no drift - are the named 1.8 instance's subject."

  # ------------------------------------------------------------------ 1.3 ---
  - section: calculations
    instances:
      - name: standard_applicability_gates_are_independent_and_the_verdict_is_frozen_at_pin_time
        claim_type: Correct Result
        grounds:
          - calculations.standard_applicability_determination
          - entities.StandardEvaluation.fields.applicable
        distinguishing_aspect: "Six standards exercise all four gates plus the any-of intersection semantics against two differently-configured camps sharing one edition; then a later license change proves the verdict is frozen rather than re-derived on read."
        test_recipe:
          setup:
            - "camp 1 is RESIDENT / YOUTH_ONLY with program [AQUATICS_POOL] and an ACTIVE state license; camp 2 is DAY / YOUTH_ONLY with no program elements and no license"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/camps"
              payload: { name: "Gate Camp Resident", camp_type: "RESIDENT", state_code: "OH", population_served: "YOUTH_ONLY", program_elements: ["AQUATICS_POOL"], health_staffing_level: "RN_ONSITE" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp1_id: "$.data.id" }
            - call: "PATCH /accreditation/camps/${camp1_id}/state-license"
              payload: { state_license_status: "ACTIVE", state_license_number: "OH-CAMP-20001" }
              as: StateLicensingAgent
              as_user_id: "state-agent-1"
            - call: "POST /accreditation/camps"
              payload: { name: "Gate Camp Day", camp_type: "DAY", state_code: "OH", population_served: "YOUTH_ONLY", health_staffing_level: "FIRST_AIDER_ONLY" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp2_id: "$.data.id" }
            - call: "POST /accreditation/standards-sets"
              payload: { edition_code: "ACA-2026-GATE", effective_year: 2026 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { set_id: "$.data.id" }
            - call: "POST /accreditation/standards"
              payload: { standards_set_id: "${set_id}", code: "G1", title: "Applies to every camp", domain: "SUPERVISION", mandatory: true, scoring_weight: 1 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/standards"
              payload: { standards_set_id: "${set_id}", code: "G2", title: "Day camps only", domain: "OPERATIONS", mandatory: false, scoring_weight: 1, applies_to_camp_types: ["DAY"] }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/standards"
              payload: { standards_set_id: "${set_id}", code: "G3", title: "Open water only", domain: "AQUATICS", mandatory: false, scoring_weight: 1, requires_program_elements_any: ["AQUATICS_OPEN_WATER"] }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/standards"
              payload: { standards_set_id: "${set_id}", code: "G4", title: "Any aquatics element", domain: "AQUATICS", mandatory: false, scoring_weight: 1, requires_program_elements_any: ["AQUATICS_POOL", "AQUATICS_OPEN_WATER"] }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/standards"
              payload: { standards_set_id: "${set_id}", code: "G5", title: "Medically fragile populations", domain: "HEALTH_WELLNESS", mandatory: false, scoring_weight: 1, applies_to_populations: ["MEDICALLY_FRAGILE"] }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/standards"
              payload: { standards_set_id: "${set_id}", code: "G6", title: "State licensed camps only", domain: "OPERATIONS", mandatory: false, scoring_weight: 1, requires_state_licensed: true }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/standards-sets/${set_id}/publish"
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "GET /accreditation/camps/${camp1_id}"
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp1_version: "$.data.version" }
            - call: "GET /accreditation/camps/${camp2_id}"
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp2_version: "$.data.version" }
          trigger:
            - call: "POST /accreditation/cycles"
              payload: { camp_id: "${camp1_id}", standards_set_id: "${set_id}", cycle_year: 2026, expected_camp_version: "${camp1_version}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { cycle1_id: "$.data.id" }
            - call: "POST /accreditation/cycles"
              payload: { camp_id: "${camp2_id}", standards_set_id: "${set_id}", cycle_year: 2026, expected_camp_version: "${camp2_version}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { cycle2_id: "$.data.id" }
            - call: "GET /accreditation/standard-evaluations"
              payload: { cycle_id: "${cycle1_id}", applicable: true }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "GET /accreditation/standard-evaluations"
              payload: { cycle_id: "${cycle2_id}", applicable: true }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "PATCH /accreditation/camps/${camp2_id}/state-license"
              payload: { state_license_status: "ACTIVE", state_license_number: "OH-CAMP-20002" }
              as: StateLicensingAgent
              as_user_id: "state-agent-1"
            - call: "GET /accreditation/standard-evaluations"
              payload: { cycle_id: "${cycle2_id}", applicable: true }
              as: AccreditationOfficer
              as_user_id: "officer-1"
          assert:
            - "both cycles materialise 6 StandardEvaluation rows each - inapplicable rows are persisted with applicable false, not skipped"
            - "cycle ${cycle1_id}: applicable rows are exactly G1, G4 and G6 - G2 fails the camp-type gate, G3 fails the program gate because the intersection is empty, G5 fails the population gate"
            - "cycle ${cycle1_id}: applicable_standard_count == 3 and applicable_mandatory_count == 1"
            - "cycle ${cycle2_id}: applicable rows are exactly G1 and G2 - G4 fails the any-of gate with no program elements at all, G6 fails the licensure gate at NONE"
            - "cycle ${cycle2_id}: applicable_standard_count == 2 and applicable_mandatory_count == 1"
            - "after camp 2 is licensed ACTIVE the third listing is unchanged: G6 stays applicable false and applicable_standard_count stays 2 - the verdict was frozen at pin time"
            - "every row carries the pinned mandatory and scoring_weight copies: G1 -> (true, 1), G2..G6 -> (false, 1)"

      - name: required_health_staffing_level_walks_the_census_and_distance_break_boundaries
        claim_type: Constants Applied
        grounds:
          - calculations.required_health_staffing_level
          - calculations.required_health_staffing_level.constants.CENSUS_BREAKS
          - calculations.required_health_staffing_level.constants.DISTANCE_BREAKS_KM
        distinguishing_aspect: "CENSUS_BREAKS [50,120] and DISTANCE_BREAKS_KM [20,40] are inclusive-lower-tier breaks: census 50 stays rank 1 while 51 becomes rank 2, and distance exactly 20 becomes rank 2 while 19.5 stays rank 1 - five DAY camps isolate each break with every other component pinned at 1."
        test_recipe:
          setup:
            - "five DAY / YOUTH_ONLY camps differing only in resident_census, distance_to_hospital_km and program_elements"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /accreditation/camps"
              payload: { name: "Break Camp A", camp_type: "DAY", state_code: "OH", population_served: "YOUTH_ONLY", resident_census: 50, distance_to_hospital_km: 19.5 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_a_id: "$.data.id" }
            - call: "POST /accreditation/camps"
              payload: { name: "Break Camp B", camp_type: "DAY", state_code: "OH", population_served: "YOUTH_ONLY", resident_census: 51, distance_to_hospital_km: 19.5 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_b_id: "$.data.id" }
            - call: "POST /accreditation/camps"
              payload: { name: "Break Camp C", camp_type: "DAY", state_code: "OH", population_served: "YOUTH_ONLY", resident_census: 120, distance_to_hospital_km: 20 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_c_id: "$.data.id" }
            - call: "POST /accreditation/camps"
              payload: { name: "Break Camp D", camp_type: "DAY", state_code: "OH", population_served: "YOUTH_ONLY", resident_census: 121, distance_to_hospital_km: 40 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_d_id: "$.data.id" }
            - call: "POST /accreditation/camps"
              payload: { name: "Break Camp E", camp_type: "DAY", state_code: "OH", population_served: "YOUTH_ONLY", resident_census: 121, distance_to_hospital_km: 40, program_elements: ["AQUATICS_OPEN_WATER"] }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_e_id: "$.data.id" }
          assert:
            - "Camp.${camp_a_id}.required_health_staffing_level == FIRST_AIDER_ONLY - components [1,1,1,1,1], base 1, bump 0"
            - "Camp.${camp_b_id}.required_health_staffing_level == LPN_ONSITE - census 51 crosses the first break to rank 2, base 2, only one component >= 2 so no bump"
            - "Camp.${camp_c_id}.required_health_staffing_level == LPN_ONSITE - census exactly 120 stays rank 2 and distance exactly 20 reaches rank 2, base 2, two components >= 2 so still no bump"
            - "Camp.${camp_d_id}.required_health_staffing_level == RN_ONSITE - census 121 and distance 40 both reach rank 3, base 3, two components >= 2 so no bump"
            - "Camp.${camp_e_id}.required_health_staffing_level == PHYSICIAN_ONSITE - the open-water element lifts r_prog to 3, giving three components >= 2 and a bump to min(4, 3+1)"
            - "all five camps report compliance_posture RESTRICTED because health_staffing_level defaulted to NONE, and none of them reports a required level above PHYSICIAN_ONSITE"

      - name: camp_risk_index_incident_component_rounds_per_disclosure_and_honours_the_three_year_window
        claim_type: Input Set Filtering
        grounds:
          - calculations.camp_risk_index
          - calculations.camp_risk_index.constants.INCIDENT_WINDOW_YEARS
          - calculations.camp_risk_index.constants.LATE_DISCLOSURE_MULT
          - endpoints[GET /accreditation/camps/{campId}/risk-index]
          - state_machines[AnnualReport]
        distinguishing_aspect: "Four disclosures across three report years: the 2023 one falls outside the three-year window and must be excluded, and the one filed against an already-ACCEPTED report must be weighted by LATE_DISCLOSURE_MULT 1.5 - 12 becomes 18.00 - which a naive sum-then-multiply implementation gets wrong."
        test_recipe:
          setup:
            - "logical clock 2026-08-01 so the window admits occurred_at years 2024 and later; camp is DAY / YOUTH_ONLY, ACTIVE license, no program elements, no accreditation cycle"
