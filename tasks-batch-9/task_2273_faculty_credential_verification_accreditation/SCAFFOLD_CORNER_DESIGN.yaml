            - "Trigger 1: HTTP 422 with e_att == ERR_ATTESTATION_MISSING even though every numeric gate is satisfied; status stays UNDER_REVIEW with decided_by_user_id == null"
            - "Trigger 1: CourseAssignment.${asn_d_df_id}.status is still EXCEPTION_FLAGGED and FacultyRoster.${roster_df_id}.flagged_exception_count is still 2"
            - "Trigger 2: att_status == APPROVED with decided_by_user_id == analyst-02"
            - "Trigger 2 CASCADE-B HOP 1: CourseAssignment.${asn_x_id}.status == VERIFIED_QUALIFIED with qualification_basis == TESTED_EXPERIENCE, exception_code == null, remediation_action == null"
            - "Trigger 2 CASCADE-B HOP 2: FacultyRoster.${roster_df_id}.flagged_exception_count == 1 while adequacy_ratio_snapshot stays 0.0000 and terminal_qualified_headcount stays 0 — TESTED_EXPERIENCE never enters the qualified numerator"
            - "Trigger 2 CASCADE-B HOP 3: Program.${prog_df_id}.unqualified_assignment_count == 1, adequacy_status == INSUFFICIENT, and certification_readiness stays BLOCKED with blocking_reason_codes == [EXCEPTIONS_OUTSTANDING, ADEQUACY_BELOW_MINIMUM]"

  # ===========================================================================
  # RBAC
  # ===========================================================================
  - section: rbac
    instances:
      - name: each_role_is_locked_out_of_the_other_roles_exclusive_operations
        claim_type: exclusive_operation_denied
        grounds:
          - roles[SystemAdmin].exclusive_operations
          - roles[RegistrarOfficer].exclusive_operations
          - roles[CredentialAnalyst].exclusive_operations
          - roles[ProgramDean].exclusive_operations
          - roles[AccreditationLiaison].exclusive_operations
          - roles[AccreditorReviewer].exclusive_operations
          - validations[priority=2].ERR_FORBIDDEN_ROLE
        distinguishing_aspect: |
          Six cross-role attempts are made against six different exclusive operations in one
          fixture, each by a role that has legitimate business in the workflow, so a blanket
          "any authenticated actor may write" implementation fails six times over rather than once.
        test_recipe:
          setup:
            - "The taxonomy, both programs, the OPEN 2026FA term, Morgan Ellis with a VERIFIED Journalism MASTERS dossier, the MONDAY 3-credit Journalism section and a DRAFT roster for (DEGREE_FIELD program, 2026FA) all exist."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_pr
            - *c_prog_df
            - *c_prog_cw
            - *c_term
            - *c_term_open
            - *c_fac_m
            - *c_rec_m_journ
            - *c_tr_m_journ
            - *c_vf_m_journ
            - *c_sec_df
            - *c_roster_df
          trigger:
            - call: "POST /disciplines"
              payload: { code: "09.09", name: "Sports Journalism", required_terminal_degree_level: MASTERS }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { e_r1: $.data.error_id }
            - call: "POST /faculty-members"
              payload: { full_name: "Unauthorized Hire", email: "unauth@example.edu", employment_class: ADJUNCT, home_program_id: "${prog_df_id}" }
              as: CredentialAnalyst
              as_user_id: "analyst-01"
              captures: { e_r2: $.data.error_id }
            - call: "POST /credential-records/${rec_m_journ_id}/verification"
              payload: { decision: VERIFY }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
              captures: { e_r3: $.data.error_id }
            - call: "POST /course-sections"
              payload: { course_code: "JOUR199", title: "Unauthorized Section", program_id: "${prog_df_id}", term_id: "${term_id}", discipline_id: "${journ_id}", course_level: LOWER_DIVISION, credit_hours: 3, delivery_mode: ONLINE_ASYNC, building_code: "HALL-Z", meeting_days: ["FR"], meeting_start_minute: 540, meeting_end_minute: 620 }
              as: AccreditationLiaison
              as_user_id: "liaison-01"
              captures: { e_r4: $.data.error_id }
            - call: "POST /faculty-rosters/${roster_df_id}/generate"
              payload: {}
              as: AccreditorReviewer
              as_user_id: "reviewer-01"
              captures: { e_r5: $.data.error_id }
            - call: "POST /accreditor-reviews"
              payload: { program_id: "${prog_df_id}", review_type: FOCUSED_FOLLOWUP, window_start_date: "2026-08-05", window_end_date: "2026-08-09" }
              as: AccreditationLiaison
              as_user_id: "liaison-01"
              captures: { e_r6: $.data.error_id }
          assert:
            - "e_r1 == ERR_FORBIDDEN_ROLE with HTTP 403 — POST /disciplines is SystemAdmin-exclusive"
            - "e_r2 == ERR_FORBIDDEN_ROLE — POST /faculty-members is RegistrarOfficer-exclusive"
            - "e_r3 == ERR_FORBIDDEN_ROLE — verification is CredentialAnalyst-exclusive, and CredentialRecord.${rec_m_journ_id}.verification_status is unchanged (already VERIFIED from setup, still verified_by_user_id analyst-01)"
            - "e_r4 == ERR_FORBIDDEN_ROLE — section creation is ProgramDean-exclusive and no CourseSection with course_code JOUR199 exists"
            - "e_r5 == ERR_FORBIDDEN_ROLE — roster generation is AccreditationLiaison-exclusive and FacultyRoster.${roster_df_id}.status is still DRAFT with generation_epoch 0"
            - "e_r6 == ERR_FORBIDDEN_ROLE — review scheduling is AccreditorReviewer-exclusive and no AccreditorReview exists for ${prog_df_id}"
            - "No entity version anywhere advanced across the six rejected calls"

      - name: entity_backed_roles_cannot_reach_across_to_another_owners_resource
        claim_type: resource_ownership
        grounds:
          - validations[priority=3].ERR_NOT_RESOURCE_OWNER
          - roles[ProgramDean].identity
          - roles[Instructor].identity
        distinguishing_aspect: |
          Ownership is checked against the addressed resource, not the caller's payload: the dean
          of the COURSEWORK program is refused a section in the DEGREE_FIELD program even though
          the role name matches, an instructor is refused another instructor's contract and
          faculty record, and each rightful owner then succeeds on the identical call shape.
        test_recipe:
          setup:
            - "Two programs exist: the DEGREE_FIELD program and the COURSEWORK_18 program, each addressable as a distinct ProgramDean identity."
            - "Morgan Ellis (home program = COURSEWORK_18) has a VERIFIED dossier and an ISSUED contract for 2026FA issued by that program's dean."
            - "Dana Reyes (home program = DEGREE_FIELD) has a VERIFIED dossier and no contract."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_pr
            - *c_prog_df
            - *c_prog_cw
            - *c_term
            - *c_fac_m
            - *c_rec_m_journ
            - *c_tr_m_journ
            - *c_vf_m_journ
            - *c_fac_d
            - *c_rec_d_pr
            - *c_tr_d_pr
            - *c_vf_d_pr
            - call: "GET /faculty-members/${fac_m_id}"
              payload: {}
              as: RegistrarOfficer
              as_user_id: "registrar-01"
              captures: { fac_m_v_own: $.data.version }
            - call: "POST /faculty-contracts"
              payload: { faculty_member_id: "${fac_m_id}", term_id: "${term_id}", employment_class: FULL_TIME, contract_credit_hours: 9, expected_faculty_version: "${fac_m_v_own}" }
              as: ProgramDean
              as_user_id: "${prog_cw_id}"
              captures: { contract_own_id: $.data.id }
          trigger:
            - call: "POST /course-sections"
              payload: { course_code: "JOUR210", title: "Cross-Program Section", program_id: "${prog_df_id}", term_id: "${term_id}", discipline_id: "${journ_id}", course_level: UPPER_DIVISION, credit_hours: 3, delivery_mode: IN_PERSON, building_code: "HALL-B", meeting_days: ["MO"], meeting_start_minute: 660, meeting_end_minute: 740 }
              as: ProgramDean
              as_user_id: "${prog_cw_id}"
              captures: { e_o1: $.data.error_id }
            - call: "GET /faculty-contracts/${contract_own_id}"
              payload: {}
              as: Instructor
              as_user_id: "${fac_d_id}"
              captures: { e_o2: $.data.error_id }
            - call: "GET /faculty-members/${fac_m_id}"
              payload: {}
              as: Instructor
              as_user_id: "${fac_d_id}"
              captures: { e_o3: $.data.error_id }
            - call: "POST /course-sections"
              payload: { course_code: "JOUR210", title: "Cross-Program Section", program_id: "${prog_df_id}", term_id: "${term_id}", discipline_id: "${journ_id}", course_level: UPPER_DIVISION, credit_hours: 3, delivery_mode: IN_PERSON, building_code: "HALL-B", meeting_days: ["MO"], meeting_start_minute: 660, meeting_end_minute: 740 }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { sec_own_id: $.data.id }
            - call: "GET /faculty-contracts/${contract_own_id}"
              payload: {}
              as: Instructor
              as_user_id: "${fac_m_id}"
              captures: { own_contract_status: $.data.status }
          assert:
            - "e_o1 == ERR_NOT_RESOURCE_OWNER with HTTP 403 — the body names the DEGREE_FIELD program while X-User-ID is the COURSEWORK_18 program id"
            - "e_o2 == ERR_NOT_RESOURCE_OWNER — Dana cannot read Morgan's contract, even though Instructor is an authorized role for that endpoint"
            - "e_o3 == ERR_NOT_RESOURCE_OWNER — the same rule guards the faculty read; a non-entity-backed role such as RegistrarOfficer reads it freely"
            - "sec_own_id was created with HTTP 201 by the rightful dean using the identical body — the refusal was about identity, not about the payload"
            - "own_contract_status == ISSUED — Morgan reads his own contract successfully"
            - "No CourseSection with course_code JOUR210 existed before trigger 4, so trigger 1 wrote nothing"

      - name: missing_user_identity_outranks_role_and_ownership_checks
        claim_type: authentication_required
        grounds:
          - validations[priority=1].ERR_UNAUTHENTICATED
          - validations[priority=2].ERR_FORBIDDEN_ROLE
          - validations[priority=3].ERR_NOT_RESOURCE_OWNER
        distinguishing_aspect: |
          The request that omits X-User-ID also carries a role that is not authorized for the
          endpoint AND addresses a resource it could not own; priority 1 must still win with
          ERR_UNAUTHENTICATED (401) rather than the 403 that either later rule would produce.
        test_recipe:
          setup:
            - "The taxonomy, both programs and the OPEN 2026FA term exist."
            - "One request will be sent with an empty X-User-ID header, an X-Role of AccreditationLiaison (not authorized for section creation) and a body naming the DEGREE_FIELD program."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_pr
            - *c_prog_df
            - *c_prog_cw
            - *c_term
            - *c_term_open
          trigger:
            - call: "POST /course-sections"
              payload: { course_code: "JOUR220", title: "Anonymous Section", program_id: "${prog_df_id}", term_id: "${term_id}", discipline_id: "${journ_id}", course_level: LOWER_DIVISION, credit_hours: 3, delivery_mode: IN_PERSON, building_code: "HALL-B", meeting_days: ["FR"], meeting_start_minute: 540, meeting_end_minute: 620 }
              as: AccreditationLiaison
              as_user_id: ""
              captures: { e_anon: $.data.error_id }
            - call: "GET /faculty-members"
              payload: { limit: 10, offset: 0 }
              as: RegistrarOfficer
              as_user_id: ""
              captures: { e_anon_read: $.data.error_id }
          assert:
            - "Trigger 1 sends an empty X-User-ID header: HTTP 401 with e_anon == ERR_UNAUTHENTICATED, not the 403 ERR_FORBIDDEN_ROLE that the AccreditationLiaison role would otherwise earn and not ERR_NOT_RESOURCE_OWNER"
            - "Trigger 2 sends an empty X-User-ID on a read whose role IS authorized: HTTP 401 with e_anon_read == ERR_UNAUTHENTICATED — authentication is enforced on reads too"
            - "No CourseSection with course_code JOUR220 exists"
            - "Program.${prog_df_id}.version is unchanged by both rejected calls"

      - name: one_user_cannot_both_decide_a_justification_and_certify_the_roster
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=13].ERR_SEGREGATION_OF_DUTIES
          - state_machines.TestedExperienceJustification.UNDER_REVIEW_to_APPROVED
          - state_machines.FacultyRoster.GENERATED_to_CERTIFIED
        distinguishing_aspect: |
          Segregation is enforced on X-User-ID across role boundaries and across two different
          endpoints: the analyst who verified the credential cannot decide the justification, and
          the user who did decide it cannot later certify the covering roster even while wearing
          the AccreditationLiaison role — and priority 13 fires ahead of the priority 33 readiness
          error the same BLOCKED roster would otherwise raise.
        test_recipe:
          setup:
            - "Alex Stone's single Public Relations MASTERS record was verified by user analyst-01, and he is EXCEPTION_FLAGGED on the TUESDAY 3-credit Journalism section of the DEGREE_FIELD program."
            - "The roster for (DEGREE_FIELD program, 2026FA) has been generated, so it is BLOCKED with EXCEPTIONS_OUTSTANDING and ADEQUACY_BELOW_MINIMUM."
            - "A strong justification (8 years, four codes, BOARD_CERTIFIED, attestation on file, score 1.0000) is UNDER_REVIEW."
            - "User shared-user-1 will act as CredentialAnalyst for the decision and then as AccreditationLiaison for the certification."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_pr
            - *c_prog_df
            - *c_prog_cw
            - *c_term
            - *c_term_open
            - *c_fac_x
            - *c_rec_x_pr
            - *c_tr_x_pr
            - *c_vf_x_pr
            - *c_sec_df_b
            - *c_asn_x_df_b
            - *c_roster_df
            - *c_roster_df_gen
            - call: "POST /tested-experience-justifications"
              payload: { course_assignment_id: "${asn_x_id}", narrative: "Eight years running a wire desk", alternative_credential_codes: ["SPJ-CERT", "AP-STYLE", "INVEST-01", "DIGITAL-02"], documented_years_experience: 8, industry_certification_level: BOARD_CERTIFIED, supervisor_attestation_on_file: true }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { just_sod_id: $.data.id }
            - call: "POST /tested-experience-justifications/${just_sod_id}/status"
              payload: { to_status: SUBMITTED }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
            - call: "POST /tested-experience-justifications/${just_sod_id}/review"
              payload: {}
              as: CredentialAnalyst
              as_user_id: "analyst-01"
          trigger:
            - call: "POST /tested-experience-justifications/${just_sod_id}/decision"
              payload: { decision: APPROVE, decision_rationale: "Self-review attempt by the verifying analyst" }
              as: CredentialAnalyst
              as_user_id: "analyst-01"
              captures: { e_sod1: $.data.error_id }
            - call: "POST /tested-experience-justifications/${just_sod_id}/decision"
              payload: { decision: APPROVE, decision_rationale: "Independent analyst approves the tested experience" }
              as: CredentialAnalyst
              as_user_id: "shared-user-1"
              captures: { sod_status: $.data.status }
            - call: "POST /faculty-rosters/${roster_df_id}/certification"
              payload: { attestation_note: "Certifying the roster I just decided on" }
              as: AccreditationLiaison
              as_user_id: "shared-user-1"
              captures: { e_sod2: $.data.error_id }
            - call: "POST /faculty-rosters/${roster_df_id}/certification"
              payload: { attestation_note: "Independent liaison attempt" }
              as: AccreditationLiaison
              as_user_id: "liaison-02"
              captures: { e_ready: $.data.error_id }
          assert:
            - "e_sod1 == ERR_SEGREGATION_OF_DUTIES with HTTP 409 — analyst-01 is the verified_by_user_id of Alex's only CredentialRecord, so the same user may not decide the justification"
            - "sod_status == APPROVED with decided_by_user_id == shared-user-1; CourseAssignment.${asn_x_id}.status == VERIFIED_QUALIFIED / TESTED_EXPERIENCE"
            - "e_sod2 == ERR_SEGREGATION_OF_DUTIES — shared-user-1 decided a justification covered by this roster, and priority 13 outranks the priority 33 readiness failure the roster also has"
            - "e_ready == ERR_ROSTER_NOT_READY — a clean user reaches the later rule, proving the previous 409 was the segregation rule and not the readiness rule"
            - "FacultyRoster.${roster_df_id}.status is still GENERATED with certified_by_user_id == null and blocking_reason_codes == [ADEQUACY_BELOW_MINIMUM] after the approval removed the exception"
            - "TestedExperienceJustification.${just_sod_id}.version incremented exactly once across the two decision attempts"

  # ===========================================================================
  # CROSS-CUTTING COMPLEXITY LAYERS
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_section_version_blocks_assignment_creation_then_refresh_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[assignment-create-stale-section]
          - endpoints[POST /course-assignments]
          - errors[ERR_STALE_SECTION_VERSION]
        distinguishing_aspect: |
          The OCC guard is on the section, not on the assignment: the version the dean read at
          section creation is invalidated by the first assignment, so replaying that same
          expected_section_version is refused with 412, the refusal itself does NOT advance the
          version, and re-reading the section makes the identical body succeed.
        test_recipe:
          setup:
            - "The DEGREE_FIELD program owns the MONDAY 3-credit Journalism section, created with version v0 which the dean captured."
            - "Morgan Ellis (Journalism MASTERS) and Dana Reyes (Public Relations MASTERS) both have VERIFIED dossiers."
            - "Morgan has already been made INSTRUCTOR_OF_RECORD of that section using v0, so the section version is now v0 + 1."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_pr
            - *c_prog_df
            - *c_prog_cw
            - *c_term
            - *c_term_open
            - *c_fac_m
            - *c_rec_m_journ
            - *c_tr_m_journ
            - *c_vf_m_journ
            - *c_fac_d
            - *c_rec_d_pr
            - *c_tr_d_pr
            - *c_vf_d_pr
            - *c_sec_df
            - *c_asn_m_df
          trigger:
            - call: "POST /course-assignments"
              payload: { course_section_id: "${sec_df_id}", faculty_member_id: "${fac_d_id}", assignment_role: CO_INSTRUCTOR, expected_section_version: "${sec_df_v}" }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { e_occ_sec: $.data.error_id }
            - call: "GET /course-sections/${sec_df_id}"
              payload: {}
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { sec_df_v_fresh: $.data.version }
            - call: "POST /course-assignments"
              payload: { course_section_id: "${sec_df_id}", faculty_member_id: "${fac_d_id}", assignment_role: CO_INSTRUCTOR, expected_section_version: "${sec_df_v_fresh}" }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { asn_occ_id: $.data.id }
          assert:
            - "Trigger 1: HTTP 412 with e_occ_sec == ERR_STALE_SECTION_VERSION — ${sec_df_v} is one behind after Morgan's assignment"
            - "Trigger 1 wrote nothing: no assignment exists for (${sec_df_id}, ${fac_d_id}) and FacultyMember.${fac_d_id}.assigned_credit_hours == 0"
            - "sec_df_v_fresh == ${sec_df_v} + 1 — the refusal did not itself advance the OCC parent"
            - "Trigger 3: HTTP 201 with the identical body except the refreshed version; CourseAssignment.${asn_occ_id}.status == EXCEPTION_FLAGGED / DISCIPLINE_MISALIGNED with alignment_score 0.6500"
            - "After trigger 3: CourseSection.${sec_df_id}.version == ${sec_df_v} + 2 and instructor_of_record_id is still ${fac_m_id} — a CO_INSTRUCTOR does not re-point it"
            - "CourseAssignment.${asn_m_df_id}.status is still VERIFIED_QUALIFIED — a CO_INSTRUCTOR assignment supersedes nothing"

      - name: stale_faculty_version_blocks_contract_issuance_after_dossier_movement
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[contract-issue-stale-faculty]
          - endpoints[POST /faculty-contracts]
          - errors[ERR_STALE_FACULTY_VERSION]
        distinguishing_aspect: |
          The second concurrency rule guards a different parent with a different field: the dean
          reads the faculty version, a later credential verification advances it (the credentialing
          evidence moved), and the contract request carrying the pre-verification version is
          refused with 412 — while the section-level guard is untouched.
        test_recipe:
          setup:
            - "Morgan Ellis is FULL_TIME in the COURSEWORK_18 program with one VERIFIED Journalism MASTERS record; the dean captured his version before any further dossier movement."
            - "A second credential record (a DOCTORATE in Journalism with an official transcript) is then verified, advancing FacultyMember.version."
            - "The clock is 2026-08-01, strictly before Term 2026FA's start_date 2026-09-15, so the contract window is open."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_pr
            - *c_prog_df
            - *c_prog_cw
            - *c_term
            - *c_term_open
            - *c_fac_m
            - *c_rec_m_journ
            - *c_tr_m_journ
            - *c_vf_m_journ
            - *c_fac_m_read
            - call: "POST /credential-records"
              payload: { faculty_member_id: "${fac_m_id}", degree_level: DOCTORATE, discipline_id: "${journ_id}", conferring_institution: "Lakeside University", is_foreign_institution: false, graduate_credit_hours_in_discipline: 54 }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
              captures: { rec_m_doc_id: $.data.id }
            - call: "POST /credential-records/${rec_m_doc_id}/transcript"
              payload: { transcript_status: OFFICIAL_RECEIVED }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
            - call: "POST /credential-records/${rec_m_doc_id}/verification"
              payload: { decision: VERIFY }
              as: CredentialAnalyst
              as_user_id: "analyst-01"
          trigger:
            - call: "POST /faculty-contracts"
              payload: { faculty_member_id: "${fac_m_id}", term_id: "${term_id}", employment_class: FULL_TIME, contract_credit_hours: 9, expected_faculty_version: "${fac_m_v}" }
              as: ProgramDean
              as_user_id: "${prog_cw_id}"
              captures: { e_occ_fac: $.data.error_id }
            - call: "GET /faculty-members/${fac_m_id}"
              payload: {}
              as: ProgramDean
              as_user_id: "${prog_cw_id}"
              captures: { fac_m_v_fresh: $.data.version }
            - call: "POST /faculty-contracts"
              payload: { faculty_member_id: "${fac_m_id}", term_id: "${term_id}", employment_class: FULL_TIME, contract_credit_hours: 9, expected_faculty_version: "${fac_m_v_fresh}" }
              as: ProgramDean
              as_user_id: "${prog_cw_id}"
              captures: { contract_occ_id: $.data.id, contract_snap_v: $.data.credential_snapshot_version }
          assert:
            - "Trigger 1: HTTP 412 with e_occ_fac == ERR_STALE_FACULTY_VERSION — verifying the doctorate advanced FacultyMember.version past ${fac_m_v}"
            - "Trigger 1 wrote nothing: no FacultyContract exists for (${fac_m_id}, ${term_id}) and FacultyMember.${fac_m_id}.appointment_status is still CREDENTIALED_ELIGIBLE"
            - "fac_m_v_fresh > ${fac_m_v} and the refusal itself did not advance it"
            - "Trigger 3: HTTP 201 with FacultyContract.${contract_occ_id}.status == ISSUED, dossier_snapshot_status == VERIFIED and contract_snap_v == ${fac_m_v_fresh}"
            - "FacultyMember.${fac_m_id}.appointment_status == CONTRACT_ISSUED after trigger 3"
            - "CredentialRecord.${rec_m_doc_id}.verification_status == VERIFIED and the earlier ${rec_m_journ_id} is untouched"

      - name: every_accepted_write_advances_its_own_version_by_exactly_one
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers.optimistic_concurrency
          - entities.CourseSection.fields.version
          - entities.FacultyMember.fields.version
        distinguishing_aspect: |
          Version movement is audited as a ledger rather than spot-checked: across one section
          creation, two accepted assignments and one refused assignment the section version must
          advance by exactly 2 and never by 3, while the faculty versions advance only for the
          faculty actually touched.
        test_recipe:
          setup:
            - "Morgan Ellis and Alex Stone both have VERIFIED dossiers and no assignments; Dana Reyes has a VERIFIED dossier and will never be touched."
            - "The DEGREE_FIELD program owns the MONDAY 3-credit Journalism section at version v0."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_pr
            - *c_prog_df
            - *c_prog_cw
            - *c_term
            - *c_term_open
            - *c_fac_m
            - *c_rec_m_journ
            - *c_tr_m_journ
            - *c_vf_m_journ
            - *c_fac_x
            - *c_rec_x_pr
            - *c_tr_x_pr
            - *c_vf_x_pr
            - *c_fac_d
            - *c_rec_d_pr
            - *c_tr_d_pr
            - *c_vf_d_pr
            - *c_sec_df
            - call: "GET /faculty-members/${fac_d_id}"
              payload: {}
              as: RegistrarOfficer
              as_user_id: "registrar-01"
              captures: { fac_d_v_base: $.data.version }
          trigger:
            - *c_asn_m_df
            - call: "POST /course-assignments"
              payload: { course_section_id: "${sec_df_id}", faculty_member_id: "${fac_x_id}", assignment_role: CO_INSTRUCTOR, expected_section_version: "${sec_df_v}" }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { e_ver_stale: $.data.error_id }
            - call: "GET /course-sections/${sec_df_id}"
              payload: {}
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { sec_v_mid: $.data.version }
            - call: "POST /course-assignments"
              payload: { course_section_id: "${sec_df_id}", faculty_member_id: "${fac_x_id}", assignment_role: CO_INSTRUCTOR, expected_section_version: "${sec_v_mid}" }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { asn_ver_id: $.data.id }
            - call: "GET /course-sections/${sec_df_id}"
              payload: {}
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { sec_v_end: $.data.version }
          assert:
            - "e_ver_stale == ERR_STALE_SECTION_VERSION — the reused ${sec_df_v} was consumed by the first assignment"
            - "sec_v_mid == ${sec_df_v} + 1 and sec_v_end == ${sec_df_v} + 2 — two accepted writes, two increments; the 412 contributed nothing"
            - "GET calls contributed no increments: sec_v_end is unchanged by the two reads themselves"
            - "FacultyMember.${fac_m_id}.assigned_credit_hours == 3 and FacultyMember.${fac_x_id}.assigned_credit_hours == 3, each with version advanced by exactly 1 from its post-verification value"
            - "FacultyMember.${fac_d_id}.version == ${fac_d_v_base} and assigned_credit_hours == 0 — an untouched faculty never moves"
            - "CourseAssignment.${asn_ver_id}.version == 1 at creation and CourseAssignment.${asn_m_df_id}.status is still VERIFIED_QUALIFIED"

      - name: substantive_change_flag_adds_a_review_precondition_to_launch_approval
        claim_type: conditional_feature_flags
        grounds:
          - entities.Program.fields.is_substantive_change
          - state_machines.Program.ADEQUACY_REVIEW_to_APPROVED_TO_LAUNCH
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Two programs with byte-identical adequacy evidence diverge on one boolean: the program
          with is_substantive_change true is refused APPROVE with ERR_INVALID_STATE until a
          CLOSED_ACCEPTED SUBSTANTIVE_CHANGE review exists for it, while the program that omitted
          the flag (defaulting to false) is approved immediately.
        test_recipe:
          setup:
            - "Two HEADCOUNT programs with min_terminal_ratio 0.60 exist: the DEGREE_FIELD program (is_substantive_change omitted, so false) and 'MS Journalism (New Program)' created with is_substantive_change true."
            - "Morgan Ellis (Journalism MASTERS) is the sole terminal-qualified INSTRUCTOR_OF_RECORD in each program — the MONDAY 3-credit section in the DEGREE_FIELD program and a FRIDAY 3-credit section in the new program — so both programs compute adequacy 1.0000 / ADEQUATE with zero unqualified assignments."
            - "Both rosters have been generated and both programs have been moved to ADEQUACY_REVIEW."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_pr
            - *c_prog_df
            - *c_prog_cw
            - *c_term
            - *c_term_open
            - *c_fac_m
            - *c_rec_m_journ
            - *c_tr_m_journ
            - *c_vf_m_journ
            - *c_sec_df
            - *c_asn_m_df
            - *c_roster_df
            - *c_roster_df_gen
            - call: "POST /programs"
              payload: { name: "MS Journalism (New Program)", discipline_id: "${journ_id}", degree_level: MASTERS, qualification_policy: DEGREE_FIELD, adequacy_basis: HEADCOUNT, min_terminal_ratio: 0.60, is_substantive_change: true, credential_budget_cents: 500000 }
              as: SystemAdmin
              as_user_id: "admin-01"
              captures: { prog_sc_id: $.data.id }
            - call: "POST /course-sections"
              payload: { course_code: "JOUR501", title: "Graduate Reporting", program_id: "${prog_sc_id}", term_id: "${term_id}", discipline_id: "${journ_id}", course_level: GRADUATE, credit_hours: 3, delivery_mode: IN_PERSON, building_code: "HALL-D", meeting_days: ["FR"], meeting_start_minute: 540, meeting_end_minute: 620 }
              as: ProgramDean
              as_user_id: "${prog_sc_id}"
              captures: { sec_sc_id: $.data.id, sec_sc_v: $.data.version }
            - call: "POST /course-assignments"
              payload: { course_section_id: "${sec_sc_id}", faculty_member_id: "${fac_m_id}", assignment_role: INSTRUCTOR_OF_RECORD, expected_section_version: "${sec_sc_v}" }
              as: ProgramDean
              as_user_id: "${prog_sc_id}"
              captures: { asn_sc_id: $.data.id }
            - call: "POST /faculty-rosters"
              payload: { program_id: "${prog_sc_id}", term_id: "${term_id}" }
              as: AccreditationLiaison
              as_user_id: "liaison-01"
              captures: { roster_sc_id: $.data.id }
            - call: "POST /faculty-rosters/${roster_sc_id}/generate"
              payload: {}
              as: AccreditationLiaison
              as_user_id: "liaison-01"
            - call: "POST /programs/${prog_df_id}/launch-review"
              payload: { term_id: "${term_id}" }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
            - call: "POST /programs/${prog_sc_id}/launch-review"
              payload: { term_id: "${term_id}" }
              as: ProgramDean
              as_user_id: "${prog_sc_id}"
          trigger:
            - call: "POST /programs/${prog_df_id}/launch-decision"
              payload: { decision: APPROVE, rationale: "Not a substantive change" }
              as: AccreditationLiaison
              as_user_id: "liaison-01"
              captures: { flag_off_status: $.data.launch_status }
            - call: "POST /programs/${prog_sc_id}/launch-decision"
              payload: { decision: APPROVE, rationale: "Requesting approval before the accreditor closes" }
              as: AccreditationLiaison
              as_user_id: "liaison-01"
              captures: { e_flag: $.data.error_id }
            - call: "POST /accreditor-reviews"
              payload: { program_id: "${prog_sc_id}", review_type: SUBSTANTIVE_CHANGE, window_start_date: "2026-07-28", window_end_date: "2026-08-03" }
              as: AccreditorReviewer
              as_user_id: "reviewer-01"
              captures: { review_sc_id: $.data.id }
            - call: "POST /accreditor-reviews/${review_sc_id}/status"
              payload: { to_status: IN_PROGRESS }
              as: AccreditorReviewer
              as_user_id: "reviewer-01"
            - call: "POST /accreditor-reviews/${review_sc_id}/findings"
              payload: { finding_count: 0, narrative: "No findings on the substantive change" }
              as: AccreditorReviewer
              as_user_id: "reviewer-01"
            - call: "POST /accreditor-reviews/${review_sc_id}/status"
              payload: { to_status: CLOSED_ACCEPTED, note: "Substantive change accepted" }
              as: AccreditorReviewer
              as_user_id: "reviewer-01"
            - call: "POST /programs/${prog_sc_id}/launch-decision"
              payload: { decision: APPROVE, rationale: "Substantive change accepted by the accreditor" }
              as: AccreditationLiaison
              as_user_id: "liaison-01"
              captures: { flag_on_status: $.data.launch_status }
          assert:
            - "Both programs entered ADEQUACY_REVIEW with adequacy_ratio 1.0000, adequacy_status ADEQUATE and unqualified_assignment_count 0 — the evidence is identical"
            - "Trigger 1: flag_off_status == APPROVED_TO_LAUNCH — with the flag absent (default false) the adequacy check is the only gate"
            - "Trigger 2: HTTP 409 with e_flag == ERR_INVALID_STATE and Program.${prog_sc_id}.launch_status still ADEQUACY_REVIEW — the flag added a second gate that adequacy alone cannot open"
            - "Trigger 5: AccreditorReview.${review_sc_id}.status == FINDINGS_ISSUED with finding_count 0; trigger 6 moves it to CLOSED_ACCEPTED because the program is ADEQUATE with zero unqualified assignments"
            - "Trigger 7: flag_on_status == APPROVED_TO_LAUNCH — the identical APPROVE body now succeeds"
            - "Program.${prog_sc_id}.is_substantive_change is still true — approval does not clear the flag"

      - name: repudiation_cascade_runs_end_to_end_through_five_hops
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers.cascading_side_effects]
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_a_repudiation_five_hops_to_accreditor_review_bounce_back
          rationale: "That instance walks all five CASCADE-A hops in order and asserts each hop's entity state and version movement."

      - name: both_calculation_variants_produce_their_declared_results
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers.dual_variant_calculation]
        excluded_because:
          difficulty_instance: dual_variant_calc / qualification_policy_degree_field_vs_coursework_18_diverge_on_identical_dossier
          rationale: "Both §1.8 dual_variant_calc instances assert each variant's result and the delta between them on identical inputs."

      - name: derived_fields_reconcile_after_create_update_and_reversal
        claim_type: derived_field_reconciliation
        grounds: [complexity_profile.complexity_layers.derived_field_reconciliation]
        excluded_because:
          difficulty_instance: compensating_invariant / assigned_credit_hours_ledger_conserved_across_supersession_and_withdrawal
          rationale: "That instance reconciles the derived credit-hour ledger after creation, transfer and reversal with exact literals."

  # ===========================================================================
  # CONSISTENCY MODEL
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: computed_and_cascaded_fields_are_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /course-assignments]
          - endpoints[POST /credential-records/{credentialRecordId}/verification]
          - calculations.roster_snapshot_recompute
        distinguishing_aspect: |
          Nothing is allowed to lag by a request: the assignment POST already carries its decided
          status, qualification_basis, exception_code and alignment_score in its own 201 body, and
          the very next GET of the roster and program — with no intervening write — already shows
          the recomputed snapshot and adequacy.
        test_recipe:
          setup:
            - "Morgan Ellis (Journalism MASTERS, verified) is INSTRUCTOR_OF_RECORD of the MONDAY 3-credit Journalism section of the DEGREE_FIELD program and the roster is GENERATED with adequacy 1.0000 / READY."
            - "Alex Stone has a VERIFIED Public Relations MASTERS dossier and no assignment; the TUESDAY 3-credit Journalism section is unassigned."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_pr
            - *c_prog_df
            - *c_prog_cw
            - *c_term
            - *c_term_open
            - *c_fac_m
            - *c_rec_m_journ
            - *c_tr_m_journ
            - *c_vf_m_journ
            - *c_fac_x
            - *c_rec_x_pr
            - *c_tr_x_pr
            - *c_vf_x_pr
            - *c_sec_df
            - *c_sec_df_b
            - *c_asn_m_df
            - *c_roster_df
            - *c_roster_df_gen
          trigger:
            - *c_asn_x_df_b
            - call: "GET /faculty-rosters/${roster_df_id}"
              payload: {}
              as: AccreditationLiaison
              as_user_id: "liaison-01"
              captures: { imm_flagged: $.data.flagged_exception_count, imm_ratio: $.data.adequacy_ratio_snapshot, imm_ready: $.data.certification_readiness }
            - call: "GET /programs/${prog_df_id}"
              payload: {}
              as: AccreditationLiaison
              as_user_id: "liaison-01"
              captures: { imm_prog_unq: $.data.unqualified_assignment_count, imm_prog_status: $.data.adequacy_status }
          assert:
            - "The 201 body of the assignment POST already contains status == EXCEPTION_FLAGGED, qualification_basis == NONE, exception_code == DISCIPLINE_MISALIGNED and alignment_score == 0.6500 — no second read is needed to learn the decision"
            - "imm_flagged == 1, imm_ratio == 0.5000 and imm_ready == BLOCKED on the first read after the write, with no intervening generate call"
            - "imm_prog_unq == 1 and imm_prog_status == AT_RISK — 0.5000 is above the AT_RISK floor 0.60 - 0.15 = 0.45 yet below the 0.60 minimum"
            - "FacultyRoster.${roster_df_id}.blocking_reason_codes == [EXCEPTIONS_OUTSTANDING, ADEQUACY_BELOW_MINIMUM] in the declared append order, and generation_epoch is still 1 — the recompute was a cascade, not a regeneration"
            - "FacultyMember.${fac_x_id}.assigned_credit_hours == 3 in the same request cycle as the assignment creation"
