scenario: |
  440. Contract Electronics / PCB Assembly (EMS): BOM & approved-vendor list (AVL),
  kitting & component shortage, SMT line & program setup, AOI/ICT test & yield,
  serialization & traceability, ECO/rework, RoHS/conflict-minerals compliance,
  RMA/field return

domain_name: ems-pcb-assembly
api_prefix: ""

complexity_profile:
  primary_archetype: graph_constraint
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - rate_threshold_triggers

  entity_topology: graph
  # BOM lines reference Parts; AVL approvals link Part<->Vendor (many-to-many);
  # InventoryLots belong to Parts; KitRequirements derive from BOM lines and
  # consume InventoryLots; Units serialize against a WorkOrder; ReworkOrders /
  # RMAs reference Units and ECOs. The reference web is a graph, not a tree.

  state_machine_shape: branching
  # WorkOrder lifecycle forks (PASS vs FAIL at AOI/ICT) and Unit has parallel
  # quality + disposition dimensions; ECO has a revise->resubmit cycle.

  relationship_patterns:
    - one_to_many        # WorkOrder -> Unit; Part -> InventoryLot; Bom -> BomLine
    - many_to_many       # Part <-> Vendor via AvlEntry
    - cross_aggregate    # KitRequirement consumes InventoryLot across the Part aggregate
    - self_referential   # Bom revisions chain via supersedes_bom_id (revision history)

  role_model: segregation_of_duties
  # The engineer who authors/approves an ECO cannot be the operator who closes the
  # rework it triggers; quality and production are distinct roles.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Part
    parent: null
    common_fields: true
    fields:
      - name: internal_pn
        type: string
        source: input
        description: "Manufacturer-agnostic internal part number; unique across all Parts."
        constraints: "unique; non-empty"
      - name: description
        type: string
        source: input
        description: "Human-readable part description."
      - name: package_type
        type: enum
        source: input
        description: "Footprint family used by SMT placement."
        constraints: "one of {0402, 0603, 0805, SOT23, QFN, BGA, THT}"
      - name: is_rohs_required
        type: boolean
        source: input
        description: "If true, only RoHS-compliant lots may be consumed for this part."
        default: true
      - name: contains_conflict_minerals
        type: boolean
        source: input
        description: "If true, every consumed lot must carry a CMRT (conflict-minerals) declaration."
        default: false
      - name: standard_cost_cents
        type: integer
        source: input
        description: "Catalog standard unit cost in integer cents; used as the fallback cost basis when no consumed lots exist."
        constraints: ">= 0"
      - name: total_on_hand_qty
        type: integer
        source: computed
        description: "Sum of remaining_qty over this Part's InventoryLot rows in status IN {AVAILABLE, QUARANTINED} (physical stock on the floor; excludes DEPLETED). Recomputed on every lot mutation."
        default: 0
      - name: available_qty
        type: integer
        source: computed
        description: "Sum of remaining_qty over this Part's InventoryLot rows in status == AVAILABLE minus qty currently RESERVED by open KitRequirements. Recomputed on reserve/consume/release."
        default: 0

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Vendor / distributor legal name; unique."
        constraints: "unique; non-empty"
      - name: cage_code
        type: string
        source: input
        description: "Vendor commercial-and-government entity code."
      - name: is_rohs_certified
        type: boolean
        source: input
        description: "Whether the vendor is certified to supply RoHS-compliant material."
        default: false
      - name: status
        type: enum
        source: system
        description: "Lifecycle status of the vendor record."
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}; SUSPENDED set via POST /vendors/{id}/suspend"

  - name: AvlEntry
    parent: null
    common_fields: true
    fields:
      - name: part_id
        type: string
        source: input
        description: "FK -> Part.id; the part this approval covers."
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the approved vendor for the part."
      - name: vendor_pn
        type: string
        source: input
        description: "Vendor's own part number for this part."
      - name: approval_rank
        type: integer
        source: input
        description: "Sourcing preference rank (1 = primary). Lower rank is preferred when auto-selecting a source."
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Approval status; gates whether lots from this vendor may be received/consumed."
        default: APPROVED
        constraints: "one of {APPROVED, REVOKED}; REVOKED via POST /avl-entries/{id}/revoke"

  - name: InventoryLot
    parent: null
    common_fields: true
    fields:
      - name: part_id
        type: string
        source: input
        description: "FK -> Part.id; the part this lot stocks."
      - name: avl_entry_id
        type: string
        source: input
        description: "FK -> AvlEntry.id; the approved part/vendor pairing this lot was received against."
      - name: lot_code
        type: string
        source: input
        description: "Vendor lot / date code; unique per part."
        constraints: "unique within part_id"
      - name: received_qty
        type: integer
        source: input
        description: "Quantity received into the lot."
        constraints: "> 0"
      - name: remaining_qty
        type: integer
        source: computed
        description: "received_qty minus the sum of consumed quantities charged to this lot. Floored at 0."
        default: 0
      - name: unit_cost_cents
        type: integer
        source: input
        description: "Actual purchased unit cost in integer cents for this lot."
        constraints: ">= 0"
      - name: is_rohs_compliant
        type: boolean
        source: input
        description: "Whether the physical material in this lot is RoHS compliant."
        default: false
      - name: has_cmrt
        type: boolean
        source: input
        description: "Whether a conflict-minerals reporting template accompanies this lot."
        default: false
      - name: received_at
        type: datetime
        source: input
        description: "Logical receipt timestamp; drives FIFO consumption order (oldest received_at consumed first)."
      - name: status
        type: enum
        source: system
        description: "Lot lifecycle status."
        default: AVAILABLE
        constraints: "one of {AVAILABLE, QUARANTINED, DEPLETED}; QUARANTINED via POST /inventory-lots/{id}/quarantine; DEPLETED when remaining_qty reaches 0"

  - name: Bom
    parent: null
    common_fields: true
    fields:
      - name: product_code
        type: string
        source: input
        description: "Product / assembly this BOM builds."
      - name: revision
        type: string
        source: input
        description: "BOM revision label, e.g. A, B, C."
        constraints: "unique within product_code"
      - name: supersedes_bom_id
        type: string
        source: input
        description: "FK -> Bom.id; the prior revision this BOM supersedes (self-referential revision chain); null for the first revision."
      - name: status
        type: enum
        source: system
        description: "BOM lifecycle status; only RELEASED BOMs may anchor a WorkOrder."
        default: DRAFT
        constraints: "one of {DRAFT, RELEASED, OBSOLETE}; RELEASED via POST /boms/{id}/release; OBSOLETE set as a cascade when a superseding BOM is released"
      - name: line_count
        type: integer
        source: computed
        description: "Number of BomLine rows under this BOM. Recomputed when a line is added."
        default: 0

  - name: BomLine
    parent: Bom
    common_fields: true
    fields:
      - name: bom_id
        type: string
        source: input
        description: "FK -> Bom.id; the BOM this line belongs to."
      - name: part_id
        type: string
        source: input
        description: "FK -> Part.id; the part placed at these reference designators."
      - name: ref_designators
        type: array
        source: input
        description: "List of reference designator strings, e.g. [R1, R2, R3]."
        constraints: "non-empty; each designator unique within the BOM"
      - name: qty_per_assembly
        type: integer
        source: input
        description: "Placements of this part per finished assembly; MUST equal len(ref_designators)."
        constraints: "> 0; == len(ref_designators)"
      - name: is_dnp
        type: boolean
        source: input
        description: "Do-Not-Place: line is documented but not placed; consumes zero inventory."
        default: false

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - name: bom_id
        type: string
        source: input
        description: "FK -> Bom.id; the RELEASED BOM this work order builds."
      - name: planned_qty
        type: integer
        source: input
        description: "Number of finished assemblies planned for this run."
        constraints: "> 0"
      - name: line_program_id
        type: string
        source: input
        description: "FK -> LineProgram.id; the SMT line program assigned at setup; null until setup."
      - name: status
        type: enum
        source: system
        description: "Work-order lifecycle status."
        default: PLANNED
        constraints: "one of {PLANNED, KITTED, SETUP, RUNNING, AT_TEST, PASSED, FAILED, CLOSED, CANCELLED}"
      - name: kit_shortage_count
        type: integer
        source: computed
        description: "Number of KitRequirement rows under this WorkOrder whose status == SHORT after the latest kitting attempt."
        default: 0
      - name: built_qty
        type: integer
        source: computed
        description: "Count of Unit rows under this WorkOrder. Recomputed when a unit is serialized."
        default: 0
      - name: passed_qty
        type: integer
        source: computed
        description: "Count of Unit rows under this WorkOrder whose quality_status == PASS. Recomputed on each test result."
        default: 0
      - name: first_pass_yield_pct
        type: number
        source: computed
        description: "First-pass yield percentage for the run; see calculations.first_pass_yield. Recomputed on each test result and on rework close."
        default: 0
      - name: material_cost_cents
        type: integer
        source: computed
        description: "Consumed-material cost rolled up from KitRequirement consumption; see calculations.work_order_material_cost. Recomputed on kitting and on rework consumption."
        default: 0

  - name: KitRequirement
    parent: WorkOrder
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the work order this requirement serves."
      - name: part_id
        type: string
        source: input
        description: "FK -> Part.id; the part required."
      - name: required_qty
        type: integer
        source: computed
        description: "qty_per_assembly (summed over non-DNP BomLines for this part) * WorkOrder.planned_qty. Computed at kitting."
        default: 0
      - name: reserved_qty
        type: integer
        source: computed
        description: "Quantity reserved from AVAILABLE lots toward required_qty at kitting. Released on cancel."
        default: 0
      - name: consumed_qty
        type: integer
        source: computed
        description: "Quantity actually charged to lots when the run consumes material. Recomputed on consume and rework consumption."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Requirement fulfillment status."
        default: PENDING
        constraints: "one of {PENDING, RESERVED, SHORT, CONSUMED, RELEASED}; SHORT when AVAILABLE < required_qty at kitting"

  - name: LineProgram
    parent: null
    common_fields: true
    fields:
      - name: bom_id
        type: string
        source: input
        description: "FK -> Bom.id; the BOM this placement program targets."
      - name: line_code
        type: string
        source: input
        description: "Physical SMT line identifier, e.g. LINE-A."
      - name: feeder_slot_count
        type: integer
        source: input
        description: "Number of feeder slots the program occupies."
        constraints: "> 0"
      - name: program_checksum
        type: string
        source: input
        description: "Checksum of the placement program file; used for setup verification."
      - name: status
        type: enum
        source: system
        description: "Program verification status; only VERIFIED programs may be assigned at setup."
        default: UNVERIFIED
        constraints: "one of {UNVERIFIED, VERIFIED}; VERIFIED via POST /line-programs/{id}/verify"

  - name: Unit
    parent: WorkOrder
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the run this serialized unit belongs to."
      - name: serial_number
        type: string
        source: system
        description: "Server-minted traceability serial, unique across all Units."
        constraints: "unique; immutable"
      - name: quality_status
        type: enum
        source: system
        description: "Test/quality dimension; evolves independently of disposition."
        default: BUILT
        constraints: "one of {BUILT, PASS, FAIL, REWORKED}"
      - name: disposition
        type: enum
        source: system
        description: "Material-disposition dimension; evolves independently of quality_status."
        default: IN_PROCESS
        constraints: "one of {IN_PROCESS, SHIPPED, SCRAPPED, RETURNED}"
      - name: defect_code
        type: string
        source: input
        description: "AOI/ICT defect code recorded on a FAIL result; null when PASS."
      - name: rework_count
        type: integer
        source: computed
        description: "Number of ReworkOrders that have closed against this unit. Incremented on rework close."
        default: 0

  - name: ReworkOrder
    parent: null
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; the failed unit being reworked."
      - name: eco_id
        type: string
        source: input
        description: "FK -> Eco.id; the ECO authorizing this rework; null for non-ECO defect rework."
      - name: defect_code
        type: string
        source: input
        description: "Defect code being addressed."
      - name: added_material_cost_cents
        type: integer
        source: computed
        description: "Cost of replacement material consumed during rework; see calculations.rework_material_cost. Rolls up into WorkOrder.material_cost_cents on close."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Rework lifecycle status."
        default: OPEN
        constraints: "one of {OPEN, CLOSED, ABANDONED}; CLOSED via POST /rework-orders/{id}/close; ABANDONED via POST /rework-orders/{id}/abandon"

  - name: Eco
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: "Engineering change order title."
      - name: bom_id
        type: string
        source: input
        description: "FK -> Bom.id; the BOM the change targets."
      - name: change_summary
        type: string
        source: input
        description: "Description of the engineering change."
      - name: authored_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ProcessEngineer who created the ECO; recorded for segregation-of-duties checks."
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the QualityEngineer who approved the ECO; MUST differ from authored_by_user_id."
      - name: status
        type: enum
        source: system
        description: "ECO lifecycle status."
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, APPROVED, REJECTED, IMPLEMENTED}; cyclic via REJECTED->SUBMITTED resubmission"

  - name: Rma
    parent: null
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; the field-returned unit (must have disposition == SHIPPED)."
      - name: reported_defect_code
        type: string
        source: input
        description: "Customer-reported defect code."
      - name: failure_class
        type: enum
        source: input
        description: "Triaged failure class."
        constraints: "one of {WORKMANSHIP, COMPONENT, DESIGN, NO_FAULT_FOUND}"
      - name: status
        type: enum
        source: system
        description: "RMA lifecycle status."
        default: RECEIVED
        constraints: "one of {RECEIVED, TRIAGED, REPAIRED, SCRAPPED, CLOSED}"
      - name: warranty_credit_cents
        type: integer
        source: computed
        description: "Warranty credit owed for this return; see calculations.rma_warranty_credit. Computed at triage."
        default: 0

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Bom
    initial_state: DRAFT
    terminal_states: [OBSOLETE]
    transitions:
      - from: DRAFT
        to: RELEASED
        trigger: "POST /boms/{id}/release"
        actor: ProcessEngineer
        preconditions:
          - "bom.status == DRAFT"
          - "line_count >= 1 (at least one BomLine exists)"
          - "every BomLine.part_id references a Part that has >= 1 AvlEntry in status == APPROVED"
        side_effects:
          - "set bom.status = RELEASED"
          - "if supersedes_bom_id is not null AND that prior Bom.status == RELEASED: set prior Bom.status = OBSOLETE (cascade hop 1)"
          - "for the now-OBSOLETE prior Bom: every WorkOrder referencing it in status == PLANNED is set to CANCELLED, releasing any reservations (cascade hop 2)"
          - "increments Bom.version by 1"
      - from: RELEASED
        to: OBSOLETE
        trigger: "system cascade when a superseding Bom is released"
        actor: system
        preconditions:
          - "a newer Bom with supersedes_bom_id == this.id transitions DRAFT->RELEASED"
        side_effects:
          - "set bom.status = OBSOLETE"
          - "cancel PLANNED WorkOrders that anchor this BOM (see release cascade)"

  - entity: WorkOrder
    initial_state: PLANNED
    terminal_states: [PASSED, FAILED, CLOSED, CANCELLED]
    transitions:
      - from: PLANNED
        to: KITTED
        trigger: "POST /work-orders/{id}/kit"
        actor: ProductionPlanner
        preconditions:
          - "work_order.status == PLANNED"
          - "anchoring Bom.status == RELEASED"
        side_effects:
          - "create one KitRequirement per distinct non-DNP BomLine part on the BOM"
          - "compute required_qty per KitRequirement (calculations.kit_required_qty)"
          - "reserve from AVAILABLE lots FIFO; set each KitRequirement.status = RESERVED or SHORT"
          - "recompute WorkOrder.kit_shortage_count"
          - "if kit_shortage_count == 0: set work_order.status = KITTED; else remain PLANNED and reject with ERR_KIT_SHORTAGE"
          - "increments WorkOrder.version by 1"
      - from: KITTED
        to: SETUP
        trigger: "POST /work-orders/{id}/setup"
        actor: ProductionPlanner
        preconditions:
          - "work_order.status == KITTED"
          - "referenced LineProgram.status == VERIFIED"
          - "referenced LineProgram.bom_id == work_order.bom_id"
        side_effects:
          - "set work_order.line_program_id = provided program"
          - "set work_order.status = SETUP"
          - "increments WorkOrder.version by 1"
      - from: SETUP
        to: RUNNING
        trigger: "POST /work-orders/{id}/start"
        actor: ProductionPlanner
        preconditions:
          - "work_order.status == SETUP"
        side_effects:
          - "consume reserved material FIFO: charge each KitRequirement.consumed_qty against lots, decrement lot.remaining_qty, set KitRequirement.status = CONSUMED"
          - "recompute each consumed lot.remaining_qty; set lot.status = DEPLETED where it hits 0 (cascade)"
          - "recompute Part.available_qty / total_on_hand_qty for affected parts (cascade)"
          - "recompute WorkOrder.material_cost_cents (calculations.work_order_material_cost)"
          - "set work_order.status = RUNNING"
          - "increments WorkOrder.version by 1"
      - from: RUNNING
        to: AT_TEST
        trigger: "POST /work-orders/{id}/units (serialize all planned units, then advance)"
        actor: ProductionPlanner
        preconditions:
          - "work_order.status == RUNNING"
          - "built_qty == planned_qty (every planned unit serialized)"
        side_effects:
          - "set work_order.status = AT_TEST"
          - "increments WorkOrder.version by 1"
      - from: AT_TEST
        to: PASSED
        trigger: "POST /work-orders/{id}/finalize-test"
        actor: QualityEngineer
        preconditions:
          - "work_order.status == AT_TEST"
          - "every Unit under this WO has quality_status IN {PASS, REWORKED} (no BUILT or FAIL remaining)"
        side_effects:
          - "recompute WorkOrder.first_pass_yield_pct (calculations.first_pass_yield)"
          - "set work_order.status = PASSED"
          - "increments WorkOrder.version by 1"
      - from: AT_TEST
        to: FAILED
        trigger: "POST /work-orders/{id}/finalize-test"
        actor: QualityEngineer
        preconditions:
          - "work_order.status == AT_TEST"
          - "first_pass_yield_pct (calculations.first_pass_yield) < MIN_YIELD_PCT (70)"
        side_effects:
          - "recompute WorkOrder.first_pass_yield_pct"
          - "set work_order.status = FAILED"
          - "increments WorkOrder.version by 1"
      - from: PASSED
        to: CLOSED
        trigger: "POST /work-orders/{id}/close"
        actor: ProductionPlanner
        preconditions:
          - "work_order.status == PASSED"
          - "no ReworkOrder under this WO is in status == OPEN"
        side_effects:
          - "set work_order.status = CLOSED"
          - "increments WorkOrder.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel OR system cascade on BOM obsolescence"
        actor: ProductionPlanner
        preconditions:
          - "work_order.status == PLANNED"
        side_effects:
          - "set work_order.status = CANCELLED"
          - "increments WorkOrder.version by 1"
      - from: KITTED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: ProductionPlanner
        preconditions:
          - "work_order.status == KITTED"
        side_effects:
          - "for each KitRequirement in status == RESERVED: set status = RELEASED, reserved_qty -> 0 (compensation)"
          - "recompute Part.available_qty for affected parts (cascade)"
          - "set work_order.status = CANCELLED"
          - "increments WorkOrder.version by 1"

  - entity: Unit
    initial_state: BUILT
    terminal_states: []
    note: "Two independent dimensions: quality_status (BUILT/PASS/FAIL/REWORKED) and disposition (IN_PROCESS/SHIPPED/SCRAPPED/RETURNED). They evolve in parallel on the same row."
    transitions:
      - from: BUILT
        to: PASS
        trigger: "POST /units/{id}/test-result with result=PASS"
        actor: QualityEngineer
        preconditions:
          - "unit.quality_status == BUILT"
          - "parent WorkOrder.status == AT_TEST"
        side_effects:
          - "set unit.quality_status = PASS"
          - "recompute parent WorkOrder.passed_qty and first_pass_yield_pct (ledger sync)"
          - "increments Unit.version by 1"
      - from: BUILT
        to: FAIL
        trigger: "POST /units/{id}/test-result with result=FAIL"
        actor: QualityEngineer
        preconditions:
          - "unit.quality_status == BUILT"
          - "parent WorkOrder.status == AT_TEST"
          - "defect_code provided"
        side_effects:
          - "set unit.quality_status = FAIL; set unit.defect_code"
          - "recompute parent WorkOrder.first_pass_yield_pct (ledger sync)"
          - "increments Unit.version by 1"
      - from: FAIL
        to: REWORKED
        trigger: "system cascade on POST /rework-orders/{id}/close"
        actor: system
        preconditions:
          - "unit.quality_status == FAIL"
          - "the closing ReworkOrder.unit_id == this unit"
        side_effects:
          - "set unit.quality_status = REWORKED"
          - "increment unit.rework_count by 1"
          - "increments Unit.version by 1"
      - from: REWORKED
        to: REWORKED
        trigger: "system cascade on POST /rework-orders/{id}/close (re-rework of an already-reworked unit)"
        actor: system
        preconditions:
          - "unit.quality_status == REWORKED"
          - "the closing ReworkOrder.unit_id == this unit"
        side_effects:
          - "keep unit.quality_status = REWORKED"
          - "increment unit.rework_count by 1"
          - "increments Unit.version by 1"
        note: "Re-rework loop: a unit reworked once can be reworked again; rework_count accumulates, first_pass_yield is unaffected (the unit was already excluded from first_pass)."

  - entity: Eco
    initial_state: DRAFT
    terminal_states: [IMPLEMENTED]
    note: "Cyclic: REJECTED can return to SUBMITTED for resubmission."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /ecos/{id}/submit"
        actor: ProcessEngineer
        preconditions:
          - "eco.status == DRAFT"
          - "acting user_id == eco.authored_by_user_id"
        side_effects:
          - "set eco.status = SUBMITTED"
          - "increments Eco.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /ecos/{id}/approve"
        actor: QualityEngineer
        preconditions:
          - "eco.status == SUBMITTED"
          - "acting user_id != eco.authored_by_user_id (segregation of duties)"
        side_effects:
          - "set eco.status = APPROVED; set approved_by_user_id = acting user_id"
          - "increments Eco.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /ecos/{id}/reject"
        actor: QualityEngineer
        preconditions:
          - "eco.status == SUBMITTED"
        side_effects:
          - "set eco.status = REJECTED"
          - "increments Eco.version by 1"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /ecos/{id}/submit (resubmission)"
        actor: ProcessEngineer
        preconditions:
          - "eco.status == REJECTED"
          - "acting user_id == eco.authored_by_user_id"
        side_effects:
          - "set eco.status = SUBMITTED"
          - "increments Eco.version by 1"
      - from: APPROVED
        to: IMPLEMENTED
        trigger: "POST /ecos/{id}/implement"
        actor: ProcessEngineer
        preconditions:
          - "eco.status == APPROVED"
        side_effects:
          - "set eco.status = IMPLEMENTED"
          - "increments Eco.version by 1"

  - entity: ReworkOrder
    initial_state: OPEN
    terminal_states: [CLOSED, ABANDONED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /rework-orders/{id}/close"
        actor: ProductionPlanner
        preconditions:
          - "rework_order.status == OPEN"
          - "if eco_id is not null: that Eco.status == APPROVED"
          - "acting user_id != linked Eco.authored_by_user_id when eco_id is not null (segregation of duties)"
          - "the target Unit.quality_status IN {FAIL, REWORKED}"
        side_effects:
          - "compute added_material_cost_cents (calculations.rework_material_cost)"
          - "consume replacement lots FIFO; decrement lot.remaining_qty (cascade hop 1)"
          - "set depleted lots to DEPLETED; recompute Part.available_qty (cascade hop 2)"
          - "roll added_material_cost_cents into parent WorkOrder.material_cost_cents (cascade hop 3 = ledger sync)"
          - "set target Unit.quality_status = REWORKED; increment Unit.rework_count (cascade hop 4)"
          - "set rework_order.status = CLOSED"
          - "increments ReworkOrder.version by 1"
      - from: OPEN
        to: ABANDONED
        trigger: "POST /rework-orders/{id}/abandon"
        actor: ProductionPlanner
        preconditions:
          - "rework_order.status == OPEN"
        side_effects:
          - "set target Unit.disposition = SCRAPPED (cascade)"
          - "set rework_order.status = ABANDONED"
          - "increments ReworkOrder.version by 1"

  - entity: Rma
    initial_state: RECEIVED
    terminal_states: [CLOSED]
    transitions:
      - from: RECEIVED
        to: TRIAGED
        trigger: "POST /rmas/{id}/triage"
        actor: QualityEngineer
        preconditions:
          - "rma.status == RECEIVED"
          - "failure_class provided"
        side_effects:
          - "compute warranty_credit_cents (calculations.rma_warranty_credit)"
          - "set rma.status = TRIAGED"
          - "increments Rma.version by 1"
      - from: TRIAGED
        to: REPAIRED
        trigger: "POST /rmas/{id}/repair"
        actor: ProductionPlanner
        preconditions:
          - "rma.status == TRIAGED"
          - "rma.failure_class != NO_FAULT_FOUND"
        side_effects:
          - "set the returned Unit.disposition = IN_PROCESS, quality_status = REWORKED (cross-entity cascade)"
          - "set rma.status = REPAIRED"
          - "increments Rma.version by 1"
      - from: TRIAGED
        to: SCRAPPED
        trigger: "POST /rmas/{id}/scrap"
        actor: QualityEngineer
        preconditions:
          - "rma.status == TRIAGED"
        side_effects:
          - "set the returned Unit.disposition = SCRAPPED (cross-entity cascade)"
          - "set rma.status = SCRAPPED"
          - "increments Rma.version by 1"
      - from: REPAIRED
        to: CLOSED
        trigger: "POST /rmas/{id}/close"
        actor: ProductionPlanner
        preconditions:
          - "rma.status == REPAIRED"
        side_effects:
          - "set the returned Unit.disposition = SHIPPED (re-ship after repair)"
          - "set rma.status = CLOSED"
          - "increments Rma.version by 1"
      - from: SCRAPPED
        to: CLOSED
        trigger: "POST /rmas/{id}/close"
        actor: ProductionPlanner
        preconditions:
          - "rma.status == SCRAPPED"
        side_effects:
          - "set rma.status = CLOSED"
          - "increments Rma.version by 1"

  - entity: AvlEntry
    initial_state: APPROVED
    terminal_states: [REVOKED]
    transitions:
      - from: APPROVED
        to: REVOKED
        trigger: "POST /avl-entries/{id}/revoke"
        actor: ProcessEngineer
        preconditions:
          - "avl_entry.status == APPROVED"
        side_effects:
          - "set avl_entry.status = REVOKED"
          - "increments AvlEntry.version by 1"

  - entity: InventoryLot
    initial_state: AVAILABLE
    terminal_states: [DEPLETED]
    note: "QUARANTINED is reached by an explicit quality action; DEPLETED is reached automatically when remaining_qty hits 0 during consumption."
    transitions:
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "POST /inventory-lots/{id}/quarantine"
        actor: QualityEngineer
        preconditions:
          - "lot.status == AVAILABLE"
        side_effects:
          - "set lot.status = QUARANTINED"
          - "recompute owning Part.available_qty (the lot's remaining_qty leaves AVAILABLE but stays in total_on_hand_qty)"
      - from: AVAILABLE
        to: DEPLETED
        trigger: "system: consumption (work order start or rework close) drives remaining_qty to 0"
        actor: system
        preconditions:
          - "lot.status == AVAILABLE"
          - "remaining_qty reaches 0 after a consumption draw"
        side_effects:
          - "set lot.status = DEPLETED"
          - "recompute owning Part.total_on_hand_qty/available_qty"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: ship-unit-stale-work-order
    parent_entity: WorkOrder
    write_endpoint: "POST /work-orders/{id}/ship"
    occ_field: "expected_work_order_version"
    description: |
      Shipping the PASS/REWORKED units of a WorkOrder against a WorkOrder whose
      version has advanced since the client last observed it is rejected. This
      captures the case where another writer has just closed a rework on the
      same run (which legitimately advances the WorkOrder's version and may move
      a unit from FAIL to REWORKED, changing the shippable set) and the current
      writer's view of the work order is therefore stale.
    error_id: ERR_STALE_WORK_ORDER_VERSION
    http_status: 412

  - rule_id: receive-lot-stale-avl
    parent_entity: AvlEntry
    write_endpoint: "POST /avl-entries/{id}/receive-lot"
    occ_field: "expected_avl_entry_version"
    description: |
      Receiving an InventoryLot against an AvlEntry whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just revoked-then-reinstated or otherwise mutated
      the approval (legitimately advancing the AvlEntry's version) so the current
      writer's view of the approval is stale.
    error_id: ERR_STALE_AVL_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: kit_required_qty
    trigger: "POST /work-orders/{id}/kit (during PLANNED->KITTED)"
    algorithm: aggregation
    formula: |
      For each distinct part_id appearing on a non-DNP BomLine of the anchoring BOM:
        per_assembly = SUM(BomLine.qty_per_assembly) over all non-DNP BomLines
                       with that part_id          # a part may appear on multiple lines
        required_qty = per_assembly * WorkOrder.planned_qty
      DNP lines (is_dnp == true) contribute 0 and create no KitRequirement.
    input_set: "non-DNP BomLines of the RELEASED anchoring BOM, grouped by part_id"
    constants: {}
    precision: "integer quantities; no rounding"

  - name: work_order_material_cost
    trigger: "POST /work-orders/{id}/start (RUNNING) and recomputed on rework close"
    algorithm: chronological
    formula: |
      FIFO consumption, lots ordered by received_at ASC, tie-break created_at ASC:
      consumed-cost is computed PER LOT-DRAW then summed (round per draw is moot —
      all integer cents; the pinned order is: charge each KitRequirement against the
      oldest AVAILABLE lots of its part first, accumulate cents draw-by-draw):
        material_cost_cents = SUM over every lot-draw d of
                               (d.qty_drawn * d.lot.unit_cost_cents)
      A single KitRequirement may straddle multiple lots; each straddle segment is a
      separate draw priced at that lot's unit_cost_cents. The evaluation order is
      pinned (FIFO by received_at, then created_at) so the per-draw decomposition —
      and therefore the summed cost when lot costs differ — is well-defined.
    input_set: "KitRequirements in status CONSUMED for this WorkOrder; their lot-draws"
    constants: {}
    precision: "integer cents; sum of integer products, no rounding"
    variants:
      - name: planned_standard_cost
        when: "at PLANNED->KITTED, before any lot is consumed"
        difference: "uses Part.standard_cost_cents * required_qty (catalog basis), NOT actual lot unit_cost_cents; this is the planning estimate surfaced as a what-if, distinct from the consumed actual"
      - name: consumed_actual_cost
        when: "at RUNNING (start) after FIFO consumption"
        difference: "uses actual lot.unit_cost_cents per draw; differs from planned whenever any consumed lot's unit_cost_cents != that part's standard_cost_cents"

  - name: first_pass_yield
    trigger: "recomputed on every POST /units/{id}/test-result and on finalize-test"
    algorithm: aggregation
    formula: |
      Let total_tested = count of Units under the WO whose quality_status != BUILT
                         (i.e. PASS, FAIL, or REWORKED have all been tested).
      Let first_pass = count of Units whose quality_status == PASS
                       AND rework_count == 0          # passed on the FIRST test, never reworked
      first_pass_yield_pct = (first_pass / total_tested) * 100   if total_tested > 0 else 0
    input_set: "Units under the WorkOrder; first_pass excludes any unit that was reworked"
    constants:
      MIN_YIELD_PCT: 70
    precision: "2 decimal places, round_half_up"
    variants:
      - name: instantaneous_fpy
        when: "after each individual test-result, before all units tested"
        difference: "total_tested counts only units tested so far; the running value can exceed or undercut the final"
      - name: final_fpy
        when: "at finalize-test, all units tested"
        difference: "total_tested == planned_qty; REWORKED units count in total_tested but NOT in first_pass, so a run that reworked failures has final_fpy strictly below pass-rate"

  - name: rework_material_cost
    trigger: "POST /rework-orders/{id}/close"
    algorithm: tiered_pricing
    formula: |
      added_material_cost_cents = base_part_cost + handling_surcharge
      where:
        base_part_cost = SUM over replacement draws d of (d.qty_drawn * d.lot.unit_cost_cents)
                         (FIFO, received_at ASC, created_at ASC tie-break)
        handling_surcharge is tiered on base_part_cost:
          base_part_cost <= 5000 cents            -> surcharge = HANDLING_FLAT_CENTS (1500)
          5001 <= base_part_cost <= 20000 cents   -> surcharge = round_half_up(base_part_cost * MID_RATE 0.20)
          base_part_cost > 20000 cents            -> surcharge = round_half_up(base_part_cost * HIGH_RATE 0.30)
        Boundaries are inclusive on the upper bound: exactly 5000 -> flat; exactly 20000 -> MID_RATE.
    input_set: "replacement lot-draws charged to the rework; tier selected from base_part_cost"
    constants:
      HANDLING_FLAT_CENTS: 1500
      MID_RATE: 0.20
      HIGH_RATE: 0.30
      LOW_TIER_MAX: 5000
      MID_TIER_MAX: 20000
    precision: "integer cents; surcharge rounded half-up to whole cents, then summed"

  - name: rma_warranty_credit
    trigger: "POST /rmas/{id}/triage"
    algorithm: weighted_scoring
    formula: |
      unit_build_cost = the consumed material cost attributable to the returned Unit
                        = WorkOrder.material_cost_cents / WorkOrder.built_qty   (integer floor division)
      credit_factor by failure_class:
        WORKMANSHIP     -> 1.00   (full build cost credited)
        COMPONENT       -> 0.60
        DESIGN          -> 0.80
        NO_FAULT_FOUND  -> 0.00   (no credit; customer error)
      warranty_credit_cents = round_half_up(unit_build_cost * credit_factor)
      Additionally, if Unit.rework_count > 0 a REWORK_PENALTY (0.10 of unit_build_cost,
      round_half_up) is SUBTRACTED, floored at 0 — a previously-reworked unit yields
      less warranty credit. Final = max(0, round_half_up(unit_build_cost*credit_factor)
                                            - round_half_up(unit_build_cost*0.10) if rework_count>0 else 0)
    input_set: "the returned Unit, its parent WorkOrder's material_cost_cents and built_qty, the RMA.failure_class"
    constants:
      WORKMANSHIP_FACTOR: 1.00
      COMPONENT_FACTOR: 0.60
      DESIGN_FACTOR: 0.80
      NO_FAULT_FACTOR: 0.00
      REWORK_PENALTY: 0.10
    precision: "2-step round_half_up to integer cents (round factor product, round penalty, subtract, floor at 0)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "acting role is permitted to perform this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every resource referenced in the path exists (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterized endpoints"

  - priority: 4
    category: existence
    check: "every FK referenced in the body resolves to an existing resource"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "all create/action endpoints with FK body fields"

  - priority: 5
    category: state
    check: "target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_referential
    check: "OCC: expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_WORK_ORDER_VERSION
    http_status: 412
    applies_to: "POST /work-orders/{id}/ship"

  - priority: 6
    category: business_referential
    check: "OCC: expected_avl_entry_version equals the AvlEntry's current version"
    error_id: ERR_STALE_AVL_VERSION
    http_status: 412
    applies_to: "POST /avl-entries/{id}/receive-lot"

  - priority: 7
    category: business_safety
    check: "ECO approver X-User-ID must differ from the ECO's authored_by_user_id (segregation of duties)"
    error_id: ERR_SOD_VIOLATION
    http_status: 409
    applies_to: "POST /ecos/{id}/approve, POST /rework-orders/{id}/close"

  - priority: 8
    category: business_safety
    check: "RoHS: if Part.is_rohs_required, every lot consumed/reserved for it must have is_rohs_compliant == true"
    error_id: ERR_ROHS_VIOLATION
    http_status: 422
    applies_to: "POST /work-orders/{id}/kit, POST /work-orders/{id}/start, POST /rework-orders/{id}/close"

  - priority: 9
    category: business_safety
    check: "Conflict minerals: if Part.contains_conflict_minerals, every consumed lot must have has_cmrt == true"
    error_id: ERR_CMRT_MISSING
    http_status: 422
    applies_to: "POST /work-orders/{id}/start, POST /rework-orders/{id}/close"

  - priority: 10
    category: business_referential
    check: "a lot may only be received against an AvlEntry whose status == APPROVED and whose vendor.status == ACTIVE"
    error_id: ERR_AVL_NOT_APPROVED
    http_status: 422
    applies_to: "POST /avl-entries/{id}/receive-lot"

  - priority: 11
    category: business_constraint
    check: "BomLine.qty_per_assembly must equal len(ref_designators); designators unique within the BOM"
    error_id: ERR_DESIGNATOR_MISMATCH
    http_status: 422
    applies_to: "POST /boms/{id}/lines"

  - priority: 12
    category: business_constraint
    check: "a BOM may only be released if every non-DNP line's part has >= 1 APPROVED AvlEntry"
    error_id: ERR_NO_APPROVED_SOURCE
    http_status: 422
    applies_to: "POST /boms/{id}/release"

  - priority: 13
    category: business_constraint
    check: "LineProgram assigned at setup must be VERIFIED and target the same bom_id as the work order"
    error_id: ERR_PROGRAM_NOT_READY
    http_status: 422
    applies_to: "POST /work-orders/{id}/setup"

  - priority: 14
    category: business_temporal
    check: "an RMA may only be opened for a Unit whose disposition == SHIPPED"
    error_id: ERR_UNIT_NOT_SHIPPED
    http_status: 422
    applies_to: "POST /rmas"

  - priority: 15
    category: business_fiscal
    check: "kitting must fully reserve every requirement; if any AVAILABLE < required_qty the kit is short"
    error_id: ERR_KIT_SHORTAGE
    http_status: 409
    applies_to: "POST /work-orders/{id}/kit"

  - priority: 16
    category: business_constraint
    check: "request body field types/enums valid and required fields present"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/action endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Part ----
  - method: POST
    path: "/parts"
    description: "Create a part master record."
    roles: [ProcessEngineer]
    code: 201
    input: ["internal_pn", "description", "package_type", "standard_cost_cents", "is_rohs_required?", "contains_conflict_minerals?"]
    output: Part
    side_effects: ["initialize total_on_hand_qty=0, available_qty=0"]
  - method: GET
    path: "/parts/{id}"
    description: "Fetch a part, including computed inventory rollups."
    roles: [ProcessEngineer, ProductionPlanner, QualityEngineer]
    code: 200
    input: []
    output: Part
    side_effects: []
  - method: GET
    path: "/parts"
    description: "List parts (paginated)."
    roles: [ProcessEngineer, ProductionPlanner, QualityEngineer]
    code: 200
    input: ["limit?", "offset?"]
    output: Part[]
    side_effects: []

  # ---- Vendor ----
  - method: POST
    path: "/vendors"
    description: "Create a vendor."
    roles: [ProcessEngineer]
    code: 201
    input: ["name", "cage_code", "is_rohs_certified?"]
    output: Vendor
    side_effects: []
  - method: GET
    path: "/vendors/{id}"
    description: "Fetch a vendor."
    roles: [ProcessEngineer, ProductionPlanner, QualityEngineer]
    code: 200
    input: []
    output: Vendor
    side_effects: []
  - method: POST
    path: "/vendors/{id}/suspend"
    description: "Suspend a vendor; suspended vendors cannot back lot receipts."
    roles: [ProcessEngineer]
    code: 200
    input: []
    output: Vendor
    side_effects: ["set vendor.status=SUSPENDED"]

  # ---- AVL ----
  - method: POST
    path: "/avl-entries"
    description: "Approve a part/vendor pairing (add to AVL)."
    roles: [ProcessEngineer]
    code: 201
    input: [part_id, vendor_id, vendor_pn, approval_rank]
    output: AvlEntry
    side_effects: []
  - method: GET
    path: "/avl-entries/{id}"
    description: "Fetch an AVL entry."
    roles: [ProcessEngineer, ProductionPlanner, QualityEngineer]
    code: 200
    input: []
    output: AvlEntry
    side_effects: []
  - method: GET
    path: "/avl-entries"
    description: "List AVL entries; filter by part_id or vendor_id."
    roles: [ProcessEngineer, ProductionPlanner, QualityEngineer]
    code: 200
    input: ["part_id?", "vendor_id?", "limit?", "offset?"]
    output: AvlEntry[]
    side_effects: []
  - method: POST
    path: "/avl-entries/{id}/revoke"
    description: "Revoke an AVL approval."
    roles: [ProcessEngineer]
    code: 200
    input: []
    output: AvlEntry
    side_effects: ["set avl_entry.status=REVOKED", "increments AvlEntry.version by 1"]
  - method: POST
    path: "/avl-entries/{id}/receive-lot"
    description: "Receive an inventory lot against this approved part/vendor pairing. OCC-guarded on the AvlEntry version."
    roles: [ProductionPlanner]
    code: 201
    input: ["lot_code", "received_qty", "unit_cost_cents", "is_rohs_compliant?", "has_cmrt?", "received_at", "expected_avl_entry_version"]
    output: InventoryLot
    side_effects: ["create InventoryLot (part_id and avl_entry_id derived from the AvlEntry)", "recompute Part.total_on_hand_qty/available_qty", "increments AvlEntry.version by 1"]

  # ---- InventoryLot ----
  - method: GET
    path: "/inventory-lots/{id}"
    description: "Fetch an inventory lot."
    roles: [ProcessEngineer, ProductionPlanner, QualityEngineer]
    code: 200
    input: []
    output: InventoryLot
    side_effects: []
  - method: GET
    path: "/inventory-lots"
    description: "List inventory lots; filter by part_id or avl_entry_id."
    roles: [ProcessEngineer, ProductionPlanner, QualityEngineer]
    code: 200
    input: ["part_id?", "avl_entry_id?", "limit?", "offset?"]
    output: InventoryLot[]
    side_effects: []
  - method: POST
    path: "/inventory-lots/{id}/quarantine"
    description: "Quarantine a lot so it cannot be reserved/consumed."
    roles: [QualityEngineer]
    code: 200
    input: []
    output: InventoryLot
    side_effects: ["set lot.status=QUARANTINED", "recompute Part.available_qty"]

  # ---- BOM ----
  - method: POST
    path: "/boms"
    description: "Create a BOM (draft)."
    roles: [ProcessEngineer]
    code: 201
    input: ["product_code", "revision", "supersedes_bom_id?"]
    output: Bom
    side_effects: ["initialize status=DRAFT, line_count=0"]
  - method: GET
    path: "/boms/{id}"
    description: "Fetch a BOM."
    roles: [ProcessEngineer, ProductionPlanner, QualityEngineer]
    code: 200
    input: []
    output: Bom
    side_effects: []
  - method: GET
    path: "/boms"
    description: "List BOMs; filter by supersedes_bom_id to walk the revision chain."
    roles: [ProcessEngineer, ProductionPlanner, QualityEngineer]
    code: 200
    input: ["supersedes_bom_id?", "product_code?", "limit?", "offset?"]
    output: Bom[]
    side_effects: []
  - method: POST
    path: "/boms/{id}/lines"
    description: "Add a line to a draft BOM."
    roles: [ProcessEngineer]
    code: 201
    input: ["part_id", "ref_designators", "qty_per_assembly", "is_dnp?"]
    output: BomLine
    side_effects: ["increment Bom.line_count", "increments Bom.version by 1"]
  - method: GET
    path: "/boms/{id}/lines"
    description: "List the lines of a BOM (reverse reachability for BomLine.bom_id)."
    roles: [ProcessEngineer, ProductionPlanner, QualityEngineer]
    code: 200
    input: []
    output: BomLine[]
    side_effects: []
  - method: GET
    path: "/bom-lines"
    description: "List BOM lines; filter by part_id (reverse reachability for BomLine.part_id)."
    roles: [ProcessEngineer, ProductionPlanner, QualityEngineer]
    code: 200
    input: ["part_id?", "bom_id?", "limit?", "offset?"]
    output: BomLine[]
    side_effects: []
  - method: GET
    path: "/bom-lines/{id}"
    description: "Fetch a single BOM line by id."
    roles: [ProcessEngineer, ProductionPlanner, QualityEngineer]
    code: 200
    input: []
    output: BomLine
    side_effects: []
  - method: POST
    path: "/boms/{id}/release"
    description: "Release a draft BOM; cascades obsolescence onto the superseded revision."
    roles: [ProcessEngineer]
    code: 200
    input: []
    output: Bom
    side_effects: ["set status=RELEASED", "obsolete superseded BOM", "cancel PLANNED WorkOrders on obsoleted BOM", "increments Bom.version by 1"]

  # ---- LineProgram ----
  - method: POST
    path: "/line-programs"
    description: "Create an SMT line program (unverified)."
    roles: [ProcessEngineer]
    code: 201
    input: [bom_id, line_code, feeder_slot_count, program_checksum]
    output: LineProgram
    side_effects: ["initialize status=UNVERIFIED"]
  - method: GET
    path: "/line-programs/{id}"
    description: "Fetch a line program."
    roles: [ProcessEngineer, ProductionPlanner, QualityEngineer]
    code: 200
    input: []
    output: LineProgram
    side_effects: []
  - method: GET
    path: "/line-programs"
    description: "List line programs; filter by bom_id (reverse reachability for LineProgram.bom_id)."
    roles: [ProcessEngineer, ProductionPlanner, QualityEngineer]
    code: 200
    input: ["bom_id?", "limit?", "offset?"]
    output: LineProgram[]
    side_effects: []
  - method: POST
    path: "/line-programs/{id}/verify"
    description: "Verify a line program so it may be assigned at setup."
    roles: [ProcessEngineer]
    code: 200
    input: []
    output: LineProgram
    side_effects: ["set status=VERIFIED"]

  # ---- WorkOrder ----
  - method: POST
    path: "/work-orders"
    description: "Create a work order against a RELEASED BOM."
    roles: [ProductionPlanner]
    code: 201
    input: [bom_id, planned_qty]
    output: WorkOrder
    side_effects: ["initialize status=PLANNED, computed counters at 0"]
  - method: GET
    path: "/work-orders/{id}"
    description: "Fetch a work order including computed rollups."
    roles: [ProcessEngineer, ProductionPlanner, QualityEngineer]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []
  - method: GET
    path: "/work-orders"
    description: "List work orders; filter by bom_id (reverse reachability for WorkOrder.bom_id) or line_program_id."
    roles: [ProcessEngineer, ProductionPlanner, QualityEngineer]
    code: 200
    input: ["bom_id?", "line_program_id?", "status?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []
  - method: POST
    path: "/work-orders/{id}/kit"
    description: "Kit the work order: build requirements, reserve material FIFO."
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["create KitRequirements", "compute required_qty", "reserve FIFO", "set status KITTED or reject ERR_KIT_SHORTAGE", "increments WorkOrder.version by 1"]
  - method: POST
    path: "/work-orders/{id}/setup"
    description: "Assign a VERIFIED line program; KITTED->SETUP."
    roles: [ProductionPlanner]
    code: 200
    input: [line_program_id]
    output: WorkOrder
    side_effects: ["set line_program_id", "set status=SETUP", "increments WorkOrder.version by 1"]
  - method: POST
    path: "/work-orders/{id}/start"
    description: "Start the run: consume reserved material FIFO; SETUP->RUNNING."
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["consume FIFO", "deplete lots", "recompute Part.available_qty", "recompute material_cost_cents", "set status=RUNNING", "increments WorkOrder.version by 1"]
  - method: POST
    path: "/work-orders/{id}/units"
    description: "Serialize one finished unit under a RUNNING work order; when built_qty reaches planned_qty advance RUNNING->AT_TEST."
    roles: [ProductionPlanner]
    code: 201
    input: []
    output: Unit
    side_effects: ["mint serial_number", "increment built_qty", "advance to AT_TEST when built_qty==planned_qty", "increments WorkOrder.version by 1"]
  - method: GET
    path: "/work-orders/{id}/units"
    description: "List the units of a work order (reverse reachability for Unit.work_order_id)."
    roles: [ProcessEngineer, ProductionPlanner, QualityEngineer]
    code: 200
    input: []
    output: Unit[]
    side_effects: []
  - method: GET
    path: "/work-orders/{id}/kit-requirements"
    description: "List the kit requirements of a work order (reverse reachability for KitRequirement.work_order_id)."
    roles: [ProcessEngineer, ProductionPlanner, QualityEngineer]
    code: 200
    input: []
    output: KitRequirement[]
    side_effects: []
  - method: POST
    path: "/work-orders/{id}/finalize-test"
    description: "Finalize testing: compute FPY, branch AT_TEST->PASSED or AT_TEST->FAILED on the MIN_YIELD_PCT threshold."
    roles: [QualityEngineer]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["recompute first_pass_yield_pct", "branch PASSED/FAILED", "increments WorkOrder.version by 1"]
  - method: POST
    path: "/work-orders/{id}/close"
    description: "Close a PASSED work order."
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["set status=CLOSED", "increments WorkOrder.version by 1"]
  - method: POST
    path: "/work-orders/{id}/cancel"
    description: "Cancel a PLANNED or KITTED work order; releases reservations."
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["release reservations (KITTED)", "recompute Part.available_qty", "set status=CANCELLED", "increments WorkOrder.version by 1"]
  - method: POST
    path: "/work-orders/{id}/ship"
    description: "Ship the PASS/REWORKED units of a PASSED or CLOSED work order. OCC-guarded on WorkOrder.version."
    roles: [ProductionPlanner]
    code: 200
    input: [expected_work_order_version]
    output: WorkOrder
    side_effects: ["set every shippable Unit.disposition=SHIPPED", "increments WorkOrder.version by 1"]

  # ---- KitRequirement (read) ----
  - method: GET
    path: "/kit-requirements/{id}"
    description: "Fetch a kit requirement."
    roles: [ProcessEngineer, ProductionPlanner, QualityEngineer]
    code: 200
    input: []
    output: KitRequirement
    side_effects: []
  - method: GET
    path: "/kit-requirements"
    description: "List kit requirements; filter by part_id (reverse reachability for KitRequirement.part_id) or work_order_id."
    roles: [ProcessEngineer, ProductionPlanner, QualityEngineer]
    code: 200
    input: ["part_id?", "work_order_id?", "limit?", "offset?"]
    output: KitRequirement[]
    side_effects: []

  # ---- Unit ----
  - method: GET
    path: "/units/{id}"
    description: "Fetch a unit by id."
    roles: [ProcessEngineer, ProductionPlanner, QualityEngineer]
    code: 200
    input: []
    output: Unit
    side_effects: []
  - method: POST
    path: "/units/{id}/test-result"
    description: "Record AOI/ICT test result; BUILT->PASS or BUILT->FAIL."
    roles: [QualityEngineer]
    code: 200
    input: ["result", "defect_code?"]
    output: Unit
    side_effects: ["set quality_status", "recompute parent passed_qty/first_pass_yield_pct", "increments Unit.version by 1"]

  # ---- ReworkOrder ----
  - method: POST
    path: "/rework-orders"
    description: "Open a rework order against a unit whose quality_status is FAIL or REWORKED (re-rework loop). Rejects with ERR_INVALID_STATE for PASS/BUILT units."
    roles: [ProductionPlanner]
    code: 201
    input: ["unit_id", "defect_code", "eco_id?"]
    output: ReworkOrder
    side_effects: ["initialize status=OPEN"]
  - method: GET
    path: "/rework-orders/{id}"
    description: "Fetch a rework order."
    roles: [ProcessEngineer, ProductionPlanner, QualityEngineer]
    code: 200
    input: []
    output: ReworkOrder
    side_effects: []
  - method: GET
    path: "/rework-orders"
    description: "List rework orders; filter by unit_id or eco_id (reverse reachability for ReworkOrder.unit_id and ReworkOrder.eco_id)."
    roles: [ProcessEngineer, ProductionPlanner, QualityEngineer]
    code: 200
    input: ["unit_id?", "eco_id?", "limit?", "offset?"]
    output: ReworkOrder[]
    side_effects: []
  - method: POST
    path: "/rework-orders/{id}/close"
    description: "Close a rework: consume replacement material, roll cost into the WO, mark unit REWORKED. SoD-checked against the linked ECO author."
    roles: [ProductionPlanner]
    code: 200
    input: [replacement_part_id, replacement_qty, acting_user_id]
    output: ReworkOrder
    side_effects: ["compute added_material_cost_cents", "consume FIFO", "deplete lots", "recompute Part.available_qty", "roll cost into WorkOrder.material_cost_cents", "set Unit.quality_status=REWORKED", "increment Unit.rework_count", "set status=CLOSED", "increments ReworkOrder.version by 1"]
  - method: POST
    path: "/rework-orders/{id}/abandon"
    description: "Abandon a rework: scrap the unit."
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: ReworkOrder
    side_effects: ["set Unit.disposition=SCRAPPED", "set status=ABANDONED", "increments ReworkOrder.version by 1"]

  # ---- ECO ----
  - method: POST
    path: "/ecos"
    description: "Create an ECO (draft). Records authored_by_user_id from X-User-ID."
    roles: [ProcessEngineer]
    code: 201
    input: [title, bom_id, change_summary]
    output: Eco
    side_effects: ["set authored_by_user_id=X-User-ID", "initialize status=DRAFT"]
  - method: GET
    path: "/ecos/{id}"
    description: "Fetch an ECO."
    roles: [ProcessEngineer, ProductionPlanner, QualityEngineer]
    code: 200
    input: []
    output: Eco
    side_effects: []
  - method: GET
    path: "/ecos"
    description: "List ECOs; filter by bom_id (reverse reachability for Eco.bom_id)."
    roles: [ProcessEngineer, ProductionPlanner, QualityEngineer]
    code: 200
    input: ["bom_id?", "status?", "limit?", "offset?"]
    output: Eco[]
    side_effects: []
  - method: POST
    path: "/ecos/{id}/submit"
    description: "Submit a DRAFT or RESUBMIT a REJECTED ECO (author only)."
    roles: [ProcessEngineer]
    code: 200
    input: [acting_user_id]
    output: Eco
    side_effects: ["set status=SUBMITTED", "increments Eco.version by 1"]
  - method: POST
    path: "/ecos/{id}/approve"
    description: "Approve a SUBMITTED ECO (must not be the author — SoD)."
    roles: [QualityEngineer]
    code: 200
    input: [acting_user_id]
    output: Eco
    side_effects: ["set status=APPROVED", "set approved_by_user_id", "increments Eco.version by 1"]
  - method: POST
    path: "/ecos/{id}/reject"
    description: "Reject a SUBMITTED ECO back to REJECTED."
    roles: [QualityEngineer]
    code: 200
    input: []
    output: Eco
    side_effects: ["set status=REJECTED", "increments Eco.version by 1"]
  - method: POST
    path: "/ecos/{id}/implement"
    description: "Mark an APPROVED ECO IMPLEMENTED."
    roles: [ProcessEngineer]
    code: 200
    input: []
    output: Eco
    side_effects: ["set status=IMPLEMENTED", "increments Eco.version by 1"]

  # ---- RMA ----
  - method: POST
    path: "/rmas"
    description: "Open an RMA for a SHIPPED unit (field return)."
    roles: [QualityEngineer]
    code: 201
    input: [unit_id, reported_defect_code]
    output: Rma
    side_effects: ["initialize status=RECEIVED"]
  - method: GET
    path: "/rmas/{id}"
    description: "Fetch an RMA."
    roles: [ProcessEngineer, ProductionPlanner, QualityEngineer]
    code: 200
    input: []
    output: Rma
    side_effects: []
  - method: GET
    path: "/rmas"
    description: "List RMAs; filter by unit_id (reverse reachability for Rma.unit_id)."
    roles: [ProcessEngineer, ProductionPlanner, QualityEngineer]
    code: 200
    input: ["unit_id?", "status?", "limit?", "offset?"]
    output: Rma[]
    side_effects: []
  - method: POST
    path: "/rmas/{id}/triage"
    description: "Triage an RMA: assign failure_class, compute warranty credit."
    roles: [QualityEngineer]
    code: 200
    input: [failure_class]
    output: Rma
    side_effects: ["compute warranty_credit_cents", "set status=TRIAGED", "increments Rma.version by 1"]
  - method: POST
    path: "/rmas/{id}/repair"
    description: "Route a TRIAGED RMA to repair; unit returns to process."
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: Rma
    side_effects: ["set Unit.disposition=IN_PROCESS, quality_status=REWORKED", "set status=REPAIRED", "increments Rma.version by 1"]
  - method: POST
    path: "/rmas/{id}/scrap"
    description: "Scrap a TRIAGED RMA unit."
    roles: [QualityEngineer]
    code: 200
    input: []
    output: Rma
    side_effects: ["set Unit.disposition=SCRAPPED", "set status=SCRAPPED", "increments Rma.version by 1"]
  - method: POST
    path: "/rmas/{id}/close"
    description: "Close a REPAIRED or SCRAPPED RMA."
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: Rma
    side_effects: ["set Unit.disposition=SHIPPED if REPAIRED", "set status=CLOSED", "increments Rma.version by 1"]

  # ---- Test-driving endpoint (outside public business surface; §1.5 priority-ladder rung 3) ----
  - method: POST
    path: "/_test/build-and-test-units"
    description: |
      Deterministic helper to drive a RUNNING WorkOrder to AT_TEST with a precise
      first-pass-yield mix without hand-issuing every unit/test call. Serializes
      exactly planned_qty units, marks the first `pass_first_count` units PASS on the
      first test (rework_count stays 0), and for the next `rework_from_fail_count`
      units records FAIL then opens-and-closes a non-ECO ReworkOrder so each becomes
      quality_status REWORKED (rework_count 1), consuming `replacement_part_id` qty 1
      per reworked unit FIFO. Requires pass_first_count + rework_from_fail_count ==
      planned_qty. Leaves the WorkOrder at AT_TEST so finalize-test can branch on FPY.
    roles: [ProductionPlanner]
    code: 200
    input: [work_order_id, pass_first_count, rework_from_fail_count, replacement_part_id]
    output: WorkOrder
    side_effects: ["serialize planned_qty Units", "record PASS/FAIL+rework results per the mix", "consume replacement lots FIFO for reworked units", "recompute passed_qty/first_pass_yield_pct/material_cost_cents", "advance RUNNING->AT_TEST", "increments WorkOrder.version accordingly"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role / X-User-ID headers missing or role unknown"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "acting role not permitted for this operation"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "path-referenced resource does not exist"
  - id: ERR_FK_NOT_FOUND
    http: 404
    condition: "a foreign-key field in the body references a non-existent resource"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "requested transition not defined from the resource's current state"
  - id: ERR_STALE_WORK_ORDER_VERSION
    http: 412
    condition: "expected_work_order_version != WorkOrder.version on ship"
  - id: ERR_STALE_AVL_VERSION
    http: 412
    condition: "expected_avl_entry_version != AvlEntry.version on receive-lot"
  - id: ERR_SOD_VIOLATION
    http: 409
    condition: "segregation of duties: ECO approver or rework closer equals the ECO author"
  - id: ERR_ROHS_VIOLATION
    http: 422
    condition: "a RoHS-required part would reserve/consume a non-RoHS-compliant lot"
  - id: ERR_CMRT_MISSING
    http: 422
    condition: "a conflict-minerals part would consume a lot lacking a CMRT declaration"
  - id: ERR_AVL_NOT_APPROVED
    http: 422
    condition: "lot receipt against a non-APPROVED AvlEntry or a SUSPENDED vendor"
  - id: ERR_DESIGNATOR_MISMATCH
    http: 422
    condition: "qty_per_assembly != len(ref_designators) or duplicate designator within BOM"
  - id: ERR_NO_APPROVED_SOURCE
    http: 422
    condition: "BOM release attempted while some non-DNP line's part has no APPROVED AvlEntry"
  - id: ERR_PROGRAM_NOT_READY
    http: 422
    condition: "setup line program is UNVERIFIED or targets a different bom_id"
  - id: ERR_UNIT_NOT_SHIPPED
    http: 422
    condition: "RMA opened for a unit whose disposition != SHIPPED"
  - id: ERR_KIT_SHORTAGE
    http: 409
    condition: "kitting cannot fully reserve one or more requirements"
  - id: ERR_REWORK_ECO_NOT_APPROVED
    http: 422
    condition: "rework close references an ECO that is not APPROVED"
  - id: ERR_OPEN_REWORK_BLOCKS_CLOSE
    http: 409
    condition: "work order close attempted while an OPEN ReworkOrder remains"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, bad type, or invalid enum value"
  - id: ERR_VALIDATION
    http: 422
    condition: "generic business-rule violation not covered by a more specific code (e.g. received_qty <= 0)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProcessEngineer
    description: "Owns part masters, vendors, AVL, BOMs, line programs, and ECO authoring/implementation."
    identity: opaque
    exclusive_operations:
      - "POST /parts"
      - "POST /vendors"
      - "POST /vendors/{id}/suspend"
      - "POST /avl-entries"
      - "POST /avl-entries/{id}/revoke"
      - "POST /boms"
      - "POST /boms/{id}/lines"
      - "POST /boms/{id}/release"
      - "POST /line-programs"
      - "POST /line-programs/{id}/verify"
      - "POST /ecos"
      - "POST /ecos/{id}/submit"
      - "POST /ecos/{id}/implement"
    shared_operations:
      - "GET (all read endpoints)"
  - name: ProductionPlanner
    description: "Owns work-order execution: kitting, setup, start, serialization, close/cancel/ship, lot receipt, and rework execution; routes RMA repair/close."
    identity: opaque
    exclusive_operations:
      - "POST /avl-entries/{id}/receive-lot"
      - "POST /work-orders"
      - "POST /work-orders/{id}/kit"
      - "POST /work-orders/{id}/setup"
      - "POST /work-orders/{id}/start"
      - "POST /work-orders/{id}/units"
      - "POST /work-orders/{id}/close"
      - "POST /work-orders/{id}/cancel"
      - "POST /work-orders/{id}/ship"
      - "POST /rework-orders"
      - "POST /rework-orders/{id}/close"
      - "POST /rework-orders/{id}/abandon"
      - "POST /rmas/{id}/repair"
      - "POST /rmas/{id}/close"
    shared_operations:
      - "GET (all read endpoints)"
  - name: QualityEngineer
    description: "Owns test, quality gating, quarantine, ECO approval/rejection, and RMA receipt/triage/scrap."
    identity: opaque
    exclusive_operations:
      - "POST /inventory-lots/{id}/quarantine"
      - "POST /units/{id}/test-result"
      - "POST /work-orders/{id}/finalize-test"
      - "POST /ecos/{id}/approve"
      - "POST /ecos/{id}/reject"
      - "POST /rmas"
      - "POST /rmas/{id}/triage"
      - "POST /rmas/{id}/scrap"
    shared_operations:
      - "GET (all read endpoints)"
