# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3002_flat_pack_self_serve_warehouse_home_assembly
# Depth probe: 9 Difficulty Rules x 2 instances, each grounded in SCAFFOLD.yaml
# §1.1–§1.7 and replayable from empty-DB via §1.5 endpoints only.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: assembly_estimate_vs_capped_billing_diverge
        grounds:
          - calculations.assembly_labor_estimate
          - entities.AssemblyJob.fields.estimated_minutes
          - entities.AssemblyJob.fields.billed_minutes
          - state_machines.AssemblyJob.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Dual-variant calculation in the AssemblyJob (labor) domain: the
          standard_estimate variant (table sum 2 x 45 = 90) and the
          capped_actual_billing variant (min(200, ceil(90*1.5)) = 135) produce
          three pairwise-distinct numbers (90 estimate, 200 actual, 135 billed)
          for one job on identical order data.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001 (threshold 5). Member customer M. FURNITURE article ASM (price 1000, requires_assembly) with one carton and stock 5; AssemblyStandard 45 min/unit. Order of qty 2 checked out CARRYOUT and FULFILLED. Job dispatched, started, then completed with actual_minutes 200."
          setup_api_calls:
            - &c_clock
              call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &c_store
              call: "POST /api/stores"
              payload: { name: "Renton", code: "ST-001", low_stock_threshold: 5 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - &c_cust
              call: "POST /api/customers"
              payload: { email: "m@example.com", full_name: "Member One" }
              as: StoreOps
              captures: { cust_id: $.data.id }
            - &c_enroll
              call: "POST /api/customers/${cust_id}/enroll"
              payload: {}
              as: StoreOps
            - call: "POST /api/articles"
              payload: { article_number: "ASM-1", name: "Wardrobe", category: "FURNITURE", pick_policy: "SELF_SERVE", price_cents: 1000, requires_assembly: true }
              as: PlatformAdmin
              captures: { art_id: $.data.id }
            - call: "POST /api/articles/${art_id}/cartons"
              payload: { carton_seq: 1, aisle: "10", bin: "04", weight_kg: 20, volume_m3: 0.2 }
              as: PlatformAdmin
              captures: { carton_id: $.data.id }
            - call: "POST /api/bin-stock"
              payload: { store_id: "${store_id}", carton_id: "${carton_id}", on_hand: 5 }
              as: StoreOps
            - call: "POST /api/assembly-standards"
              payload: { article_id: "${art_id}", minutes_per_unit: 45 }
              as: PlatformAdmin
            - call: "POST /api/orders"
              payload: { store_id: "${store_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /api/orders/${order_id}/lines"
              payload: { article_id: "${art_id}", qty: 2 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /api/orders/${order_id}/checkout"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /api/orders/${order_id}/pickup-complete"
              payload: {}
              as: StoreOps
            - call: "POST /api/orders/${order_id}/assembly-jobs"
              payload: { provider_id: "CREW-A", window_start: "2026-09-10T10:00:00Z", window_end: "2026-09-10T12:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id, est: $.data.estimated_minutes }
            - call: "POST /api/assembly-jobs/${job_id}/dispatch"
              payload: {}
              as: AssemblyProvider
            - call: "POST /api/assembly-jobs/${job_id}/start"
              payload: {}
              as: AssemblyProvider
          trigger:
            - call: "POST /api/assembly-jobs/${job_id}/complete"
              payload: { actual_minutes: 200 }
              as: AssemblyProvider
              captures: { billed: $.data.billed_minutes, job_status: $.data.status }
          assert:
            - "AssemblyJob.${job_id}.estimated_minutes == 90 (standard table sum: 2 x 45)"
            - "AssemblyJob.${job_id}.billed_minutes == 135 (min(200, ceil(90 * 1.5)))"
            - "billed_minutes 135 != actual 200 and != estimate 90: the two variants diverge on identical inputs"
            - "AssemblyJob.${job_id}.status == COMPLETED"

      - name: receipted_vs_no_receipt_refund_diverge
        grounds:
          - calculations.return_refund
          - entities.ReturnLine.fields.unit_basis_cents
          - entities.ReturnLine.fields.refund_cents
          - state_machines.ReturnRequest.GRADING_to_SETTLED
        distinguishing_aspect: |
          Dual-variant calculation in the ReturnRequest (money) domain — a
          different entity domain from assembly labor: a receipted line and a
          no-receipt line for articles with the same nominal price 1000 and the
          same grade OPEN_BOX refund 850 (= round(1000 x 0.85)) vs 765
          (= round(round(1000 x 0.9) x 0.85)), proving the no-receipt variant's
          lowest-price-plus-10%-penalty basis diverges from the paid-price basis.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Member customer M. Article A (ACCESSORY, price 1000, no family price, SELF_SERVE) with carton and stock 5; article B (price 1000, lowest_price_365d_cents 1000). Order of 2 x A checked out CARRYOUT and FULFILLED. Two returns: R1 receipted with 1 x A graded OPEN_BOX; R2 no-receipt with 1 x B graded OPEN_BOX."
          setup_api_calls:
            - *c_clock
            - *c_store
            - *c_cust
            - *c_enroll
            - call: "POST /api/articles"
              payload: { article_number: "ART-A", name: "Shelf", category: "ACCESSORY", pick_policy: "SELF_SERVE", price_cents: 1000 }
              as: PlatformAdmin
              captures: { art_a: $.data.id }
            - call: "POST /api/articles/${art_a}/cartons"
              payload: { carton_seq: 1, aisle: "01", bin: "01", weight_kg: 5, volume_m3: 0.05 }
              as: PlatformAdmin
              captures: { carton_a: $.data.id }
            - call: "POST /api/bin-stock"
              payload: { store_id: "${store_id}", carton_id: "${carton_a}", on_hand: 5 }
              as: StoreOps
            - call: "POST /api/articles"
              payload: { article_number: "ART-B", name: "Lamp", category: "ACCESSORY", pick_policy: "SELF_SERVE", price_cents: 1000, lowest_price_365d_cents: 1000 }
              as: PlatformAdmin
              captures: { art_b: $.data.id }
            - call: "POST /api/orders"
              payload: { store_id: "${store_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /api/orders/${order_id}/lines"
              payload: { article_id: "${art_a}", qty: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_a: $.data.id }
            - call: "POST /api/orders/${order_id}/checkout"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /api/orders/${order_id}/pickup-complete"
              payload: {}
              as: StoreOps
            - call: "POST /api/returns"
              payload: { order_id: "${order_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ret1: $.data.id }
            - call: "POST /api/returns/${ret1}/lines"
              payload: { article_id: "${art_a}", qty: 1, assembly_state: "UNOPENED", order_line_id: "${line_a}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rl1: $.data.id }
            - call: "POST /api/returns/${ret1}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /api/returns/${ret1}/lines/${rl1}/grade"
              payload: { condition_grade: "OPEN_BOX" }
              as: StoreOps
            - call: "POST /api/returns/${ret1}/settle"
              payload: {}
              as: StoreOps
              captures: { refund1: $.data.refund_total_cents }
            - call: "POST /api/returns"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ret2: $.data.id }
            - call: "POST /api/returns/${ret2}/lines"
              payload: { article_id: "${art_b}", qty: 1, assembly_state: "UNOPENED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rl2: $.data.id }
            - call: "POST /api/returns/${ret2}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /api/returns/${ret2}/lines/${rl2}/grade"
              payload: { condition_grade: "OPEN_BOX" }
              as: StoreOps
          trigger:
            - call: "POST /api/returns/${ret2}/settle"
              payload: {}
              as: StoreOps
              captures: { refund2: $.data.refund_total_cents }
          assert:
            - "ReturnRequest.${ret1}.refund_total_cents == 850 (receipted: round_half_up(1000 x 0.85))"
            - "ReturnRequest.${ret2}.refund_total_cents == 765 (no-receipt: round_half_up(round_half_up(1000 x 0.9) x 0.85) = round_half_up(900 x 0.85))"
            - "850 != 765 for identical nominal price and grade: the two refund variants diverge"
            - "ReturnRequest.${ret1}.writeoff_total_cents == 150 and ReturnRequest.${ret2}.writeoff_total_cents == 0 (no-receipt lines carry no ledger writeoff)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: food_discount_rounded_per_line_then_summed
        grounds:
          - calculations.order_pricing
          - entities.Order.fields.discount_cents
          - entities.OrderLine.fields.line_discount_cents
        distinguishing_aspect: |
          Combinatorial mode (b) nested rounding: the family food offer is
          rounded half-up PER LINE then summed — two FOOD lines at 115 cents
          give discount 12 + 12 = 24, where the alternative sum-then-round
          order would give round(230 x 0.10) = 23; the scaffold pins per-line
          and the test pins the 24-cent answer.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Member customer M (enrolled). FOOD articles F1 and F2, price 115 each, no family price, each with a carton and stock 10. Order with one line of each, qty 1."
          setup_api_calls:
            - *c_clock
            - *c_store
            - *c_cust
            - *c_enroll
            - call: "POST /api/articles"
              payload: { article_number: "FOOD-1", name: "Meatballs", category: "FOOD", pick_policy: "SELF_SERVE", price_cents: 115 }
              as: PlatformAdmin
              captures: { f1: $.data.id }
            - call: "POST /api/articles/${f1}/cartons"
              payload: { carton_seq: 1, aisle: "F1", bin: "01", weight_kg: 1, volume_m3: 0.01 }
              as: PlatformAdmin
              captures: { f1_carton: $.data.id }
            - call: "POST /api/bin-stock"
              payload: { store_id: "${store_id}", carton_id: "${f1_carton}", on_hand: 10 }
              as: StoreOps
            - call: "POST /api/articles"
              payload: { article_number: "FOOD-2", name: "Gravy", category: "FOOD", pick_policy: "SELF_SERVE", price_cents: 115 }
              as: PlatformAdmin
              captures: { f2: $.data.id }
            - call: "POST /api/articles/${f2}/cartons"
              payload: { carton_seq: 1, aisle: "F2", bin: "01", weight_kg: 1, volume_m3: 0.01 }
              as: PlatformAdmin
              captures: { f2_carton: $.data.id }
            - call: "POST /api/bin-stock"
              payload: { store_id: "${store_id}", carton_id: "${f2_carton}", on_hand: 10 }
              as: StoreOps
            - call: "POST /api/orders"
              payload: { store_id: "${store_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /api/orders/${order_id}/lines"
              payload: { article_id: "${f1}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /api/orders/${order_id}/lines"
              payload: { article_id: "${f2}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /api/orders/${order_id}/checkout"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub: $.data.subtotal_cents, disc: $.data.discount_cents, tot: $.data.total_cents }
          assert:
            - "Order.${order_id}.subtotal_cents == 230"
            - "Order.${order_id}.discount_cents == 24 (12 per line; sum-then-round would give 23)"
            - "Order.${order_id}.total_cents == 206"
            - "each OrderLine.line_discount_cents == 12 (round_half_up(115 x 0.10) = round_half_up(11.5))"
            - "Order.${order_id}.points_discount_cents == 0 and status == PAID"

      - name: delivery_fee_tier_zone_weight_access_membership
        grounds:
          - calculations.delivery_fee_quote
          - entities.DeliveryBooking.fields.fee_cents
          - endpoints.POST_/api/orders/{id}/delivery-bookings
        distinguishing_aspect: |
          Combinatorial mode (a) — a formula with >= 3 inputs and non-linear
          interaction (tiered weight surcharge with flat + per-kg overage,
          zone base, conditional access fee, member 20% off applied last):
          ZONE_B + 160 kg + WALKUP_LOW yields 7900 + 2500 + ceil(10)*15 = 10550
          for a non-member and round_half_up(10550 x 0.80) = 8440 for a member,
          a different mode from per-line rounding.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Non-member customer N and member customer M. FURNITURE article HVY (price 5000) whose single carton weighs 160 kg, volume 0.5, stock 4. ZONE_B slot on 2026-09-10 with capacity 500 kg / 10 m3. Two DELIVERY-channel orders of qty 1."
          setup_api_calls:
            - *c_clock
            - *c_store
            - *c_cust
            - call: "POST /api/customers"
              payload: { email: "n@example.com", full_name: "Non Member" }
              as: StoreOps
              captures: { cust_n: $.data.id }
            - *c_enroll
            - call: "POST /api/articles"
              payload: { article_number: "HVY-1", name: "Sofa", category: "FURNITURE", pick_policy: "FULL_SERVE", price_cents: 5000 }
              as: PlatformAdmin
              captures: { hvy: $.data.id }
            - call: "POST /api/articles/${hvy}/cartons"
              payload: { carton_seq: 1, aisle: "FS", bin: "01", weight_kg: 160, volume_m3: 0.5 }
              as: PlatformAdmin
              captures: { hvy_carton: $.data.id }
            - call: "POST /api/bin-stock"
              payload: { store_id: "${store_id}", carton_id: "${hvy_carton}", on_hand: 4 }
              as: StoreOps
            - call: "POST /api/delivery-slots"
              payload: { store_id: "${store_id}", service_date: "2026-09-10", vehicle_id: "VAN-1", zone: "ZONE_B", capacity_weight_kg: 500, capacity_volume_m3: 10 }
              as: DeliveryCoordinator
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /api/orders"
              payload: { store_id: "${store_id}" }
              as: Customer
              as_user_id: "${cust_n}"
              captures: { ord_n: $.data.id }
            - call: "POST /api/orders/${ord_n}/lines"
              payload: { article_id: "${hvy}", qty: 1 }
              as: Customer
              as_user_id: "${cust_n}"
            - call: "POST /api/orders/${ord_n}/checkout"
              payload: { fulfillment_channel: "DELIVERY" }
              as: Customer
              as_user_id: "${cust_n}"
            - call: "POST /api/orders"
              payload: { store_id: "${store_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_m: $.data.id }
            - call: "POST /api/orders/${ord_m}/lines"
              payload: { article_id: "${hvy}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /api/orders/${ord_m}/checkout"
              payload: { fulfillment_channel: "DELIVERY" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /api/orders/${ord_n}/delivery-bookings"
              payload: { slot_id: "${slot_id}", access_type: "WALKUP_LOW", floor: 2, expected_slot_version: "${slot_v}" }
              as: Customer
              as_user_id: "${cust_n}"
              captures: { fee_n: $.data.fee_cents, bk_n: $.data.id }
            - call: "GET /api/delivery-slots/${slot_id}"
              payload: {}
              as: DeliveryCoordinator
              captures: { slot_v2: $.data.version }
            - call: "POST /api/orders/${ord_m}/delivery-bookings"
              payload: { slot_id: "${slot_id}", access_type: "WALKUP_LOW", floor: 2, expected_slot_version: "${slot_v2}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { fee_m: $.data.fee_cents }
          assert:
            - "DeliveryBooking.${bk_n}.fee_cents == 10550 (7900 base + 2500 tier2 flat + 10 kg overage x 15, no access fee, no member discount)"
            - "member booking fee_cents == 8440 (round_half_up(10550 x 0.80))"
            - "both bookings CONFIRMED (160 + 160 = 320 <= 500 kg)"
            - "DeliverySlot.${slot_id}.used_weight_kg == 320"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: assembly_job_hold_resume_cycle
        grounds:
          - state_machines.AssemblyJob.IN_PROGRESS_to_ON_HOLD
          - state_machines.AssemblyJob.ON_HOLD_to_IN_PROGRESS
          - state_machines.AssemblyJob.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Non-linear shape on AssemblyJob: a true cycle IN_PROGRESS -> ON_HOLD
          -> IN_PROGRESS that may repeat before COMPLETED; completion after the
          loop still computes billed_minutes and cascades the order to CLOSED,
          proving the loop does not corrupt the linear completion path.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Member customer M. Article ASM (price 1000, requires_assembly, standard 45 min/unit), stock 5. Order qty 2 FULFILLED; job (estimate 90) dispatched and started."
          setup_api_calls:
            - *c_clock
            - *c_store
            - *c_cust
            - *c_enroll
            - call: "POST /api/articles"
              payload: { article_number: "ASM-1", name: "Wardrobe", category: "FURNITURE", pick_policy: "SELF_SERVE", price_cents: 1000, requires_assembly: true }
              as: PlatformAdmin
              captures: { art_id: $.data.id }
            - call: "POST /api/articles/${art_id}/cartons"
              payload: { carton_seq: 1, aisle: "10", bin: "04", weight_kg: 20, volume_m3: 0.2 }
              as: PlatformAdmin
              captures: { carton_id: $.data.id }
            - call: "POST /api/bin-stock"
              payload: { store_id: "${store_id}", carton_id: "${carton_id}", on_hand: 5 }
              as: StoreOps
            - call: "POST /api/assembly-standards"
              payload: { article_id: "${art_id}", minutes_per_unit: 45 }
              as: PlatformAdmin
            - call: "POST /api/orders"
              payload: { store_id: "${store_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /api/orders/${order_id}/lines"
              payload: { article_id: "${art_id}", qty: 2 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /api/orders/${order_id}/checkout"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /api/orders/${order_id}/pickup-complete"
              payload: {}
              as: StoreOps
            - call: "POST /api/orders/${order_id}/assembly-jobs"
              payload: { provider_id: "CREW-A", window_start: "2026-09-10T10:00:00Z", window_end: "2026-09-10T12:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
            - call: "POST /api/assembly-jobs/${job_id}/dispatch"
              payload: {}
              as: AssemblyProvider
            - call: "POST /api/assembly-jobs/${job_id}/start"
              payload: {}
              as: AssemblyProvider
          trigger:
            - call: "POST /api/assembly-jobs/${job_id}/hold"
              payload: { hold_reason: "missing cam locks" }
              as: AssemblyProvider
              captures: { st_hold: $.data.status }
            - call: "POST /api/assembly-jobs/${job_id}/resume"
              payload: {}
              as: AssemblyProvider
              captures: { st_resumed: $.data.status }
            - call: "POST /api/assembly-jobs/${job_id}/complete"
              payload: { actual_minutes: 60 }
              as: AssemblyProvider
              captures: { st_done: $.data.status, billed: $.data.billed_minutes }
          assert:
            - "status after hold == ON_HOLD and after resume == IN_PROGRESS (cycle traversed)"
            - "status after complete == COMPLETED with billed_minutes == 60 (actual under the 135 cap)"
            - "Order.${order_id}.assembly_status == COMPLETED and status == CLOSED (auto-close)"
            - "Order.${order_id}.points_earned == 20 and Customer.${cust_id}.points_balance == 20 (floor(2000/100))"

      - name: return_settle_dispute_regrade_cycle
        grounds:
          - state_machines.ReturnRequest.SETTLED_to_DISPUTED
          - state_machines.ReturnRequest.DISPUTED_to_GRADING
          - state_machines.ReturnRequest.GRADING_to_SETTLED
          - calculations.return_refund
        distinguishing_aspect: |
          Non-linear shape on ReturnRequest — a different entity from
          AssemblyJob: the cycle SETTLED -> DISPUTED -> GRADING -> SETTLED
          reverses the first settlement (LIKE_NEW restock undone) and re-settles
          at OPEN_BOX, changing refund_total_cents from 1000 to 850 with a
          150-cent writeoff, all on the same return request.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Non-member customer N. Article A (ACCESSORY, price 1000), stock 3. Order qty 1 checked out (on_hand 2) and FULFILLED. Receipted return of 1 unit, graded LIKE_NEW and settled (on_hand back to 3)."
          setup_api_calls:
            - *c_clock
            - *c_store
            - *c_cust
            - call: "POST /api/articles"
              payload: { article_number: "ART-A", name: "Shelf", category: "ACCESSORY", pick_policy: "SELF_SERVE", price_cents: 1000 }
              as: PlatformAdmin
              captures: { art_a: $.data.id }
            - call: "POST /api/articles/${art_a}/cartons"
              payload: { carton_seq: 1, aisle: "01", bin: "01", weight_kg: 5, volume_m3: 0.05 }
              as: PlatformAdmin
              captures: { carton_a: $.data.id }
            - call: "POST /api/bin-stock"
              payload: { store_id: "${store_id}", carton_id: "${carton_a}", on_hand: 3 }
              as: StoreOps
              captures: { bs_id: $.data.id }
            - call: "POST /api/orders"
              payload: { store_id: "${store_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /api/orders/${order_id}/lines"
              payload: { article_id: "${art_a}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_a: $.data.id }
            - call: "POST /api/orders/${order_id}/checkout"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /api/orders/${order_id}/pickup-complete"
              payload: {}
              as: StoreOps
            - call: "POST /api/returns"
              payload: { order_id: "${order_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ret1: $.data.id }
