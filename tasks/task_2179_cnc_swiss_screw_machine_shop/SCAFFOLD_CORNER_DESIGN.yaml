        payload: {}
        as: ShopPlanner
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_UNAUTHENTICATED
      - HTTP status == 401
      - the error is 401 rather than the 400 the empty body would otherwise cause
