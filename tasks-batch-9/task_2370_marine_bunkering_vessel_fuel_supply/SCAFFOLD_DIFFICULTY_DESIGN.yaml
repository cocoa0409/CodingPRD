  - rule_id: transitive_cascade
    instances:
      - name: spill_quarantine_cascade_depth_four
        grounds:
          - endpoints["POST /spill-incidents"].side_effects
          - state_machines.DeliveryOrder.CLEARED_to_SUSPENDED
          - state_machines.DeliveryAsset.AVAILABLE_to_QUARANTINED
          - state_machines.DeliveryOrder.SCHEDULED_to_CANCELLED
          - state_machines.Nomination.SCHEDULED_to_AWAITING_SCHEDULE
          - calculations.asset_compliance_score
          - entities.SpillIncident.fields.severity
        distinguishing_aspect: |
          A five-node chain rooted in a single POST /spill-incidents:
          SpillIncident(MAJOR) -> the reporting DeliveryOrder becomes SUSPENDED -> its
          DeliveryAsset becomes QUARANTINED -> that asset's OTHER CLEARED/SCHEDULED order
          becomes CANCELLED -> that order's Nomination falls back to AWAITING_SCHEDULE, while
          the reporting order's own nomination deliberately does NOT move; the asset's
          compliance_score is re-derived to 55.00 in the same request.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T06:30:00Z"
            - "Port NLRTM with concurrent_ops_capacity 2, grade MGO-DMA, index quote 705.00 dated 2026-08-03, customer with credit_limit_usd 5000000.00"
            - "One barge Alpha (3000.000 mt, boom certified, turnaround buffer 90 minutes) carrying two orders"
            - "Order A for 1200.000 mt on nomination A, slot 06:00-12:00, logistics_status CLEARED"
            - "Order B for 800.000 mt on nomination B, slot 13:31-17:00 (gap 91 minutes, clear of the 90-minute buffer), logistics_status SCHEDULED"
            - "Asset compliance_score 100.00 and committed_quantity_mt 2000.000 before the incident"
