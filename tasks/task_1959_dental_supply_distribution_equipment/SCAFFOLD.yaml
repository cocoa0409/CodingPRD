scenario: "1959. Dental Supply Distribution & Equipment Service (Henry Schein/Patterson): consumable auto-order & practice usage profile, equipment sale with installation & training, service technician dispatch & parts van, warranty vs service-plan coverage, promotional bundle & manufacturer rebate, sterilization/regulated item handling, practice-startup package, equipment trade-in & disposal"

domain_name: dental-supply-distribution
api_prefix: /api

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - selector_policy
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; all linkage via FK fields)
# =============================================================================
entities:
  - name: Practice
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Practice display name" }
      - { name: region, type: string, source: input, description: "Service region code; used for technician dispatch eligibility" }
      - { name: practice_tier, type: enum, source: input, default: STANDARD, constraints: "STANDARD | PREMIER | ELITE", description: "Commercial tier; drives rebate multiplier and bundle bonus" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum open-order credit in cents; must be >= 0" }
      - { name: credit_available_cents, type: integer, source: computed, description: "credit_limit_cents minus sum of total_cents of this practice's orders in status SUBMITTED" }
      - { name: regulated_license_expiry, type: datetime, source: input, default: null, description: "Expiry of the practice's regulated-items handling license; null or past expiry blocks REGULATED order lines" }
      - { name: sterilization_compliant, type: boolean, source: input, default: false, description: "True when the practice is certified to receive products requiring sterilization-cycle handling" }
      - { name: status, type: enum, source: system, default: ACTIVE, constraints: "ACTIVE | SUSPENDED", description: "SUSPENDED blocks new orders, equipment-sale confirmation, and trade-ins" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Catalog stock-keeping unit; unique" }
      - { name: name, type: string, source: input, description: "Product display name" }
      - { name: kind, type: enum, source: input, constraints: "CONSUMABLE | EQUIPMENT | PART | REGULATED", description: "CONSUMABLE/REGULATED feed usage profiles; EQUIPMENT sold via EquipmentSale (STARTUP orders excepted); PART stocked on technician vans" }
      - { name: unit_price_cents, type: integer, source: input, description: "Catalog unit price in cents; snapshotted onto order lines at order creation" }
      - { name: manufacturer, type: string, source: input, description: "Manufacturer name (rebate counterparty)" }
      - { name: max_qty_per_order, type: integer, source: input, default: null, description: "Maximum units per order line; enforced only for kind == REGULATED; null means unlimited" }
      - { name: sterilization_cycle_required, type: boolean, source: input, default: false, description: "True when handling requires a documented sterilization cycle; gated on Practice.sterilization_compliant" }
      - { name: warranty_months, type: integer, source: input, default: 0, description: "Manufacturer warranty duration for EQUIPMENT; warranty CoverageAgreement end = acceptance + warranty_months" }

  - name: UsageProfile
    parent: null
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: input, description: "FK -> Practice.id; unique together with product_id (one profile per practice+product)" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; product must be CONSUMABLE or REGULATED" }
      - { name: reorder_point, type: number, source: input, description: "Auto-replenish triggers when on_hand_estimate <= reorder_point" }
      - { name: target_stock_level, type: number, source: input, description: "Reorder quantity tops stock up to this level; must be > reorder_point" }
      - { name: auto_replenish_enabled, type: boolean, source: input, default: false, description: "When true, threshold breaches create a DRAFT order of kind AUTO" }
      - { name: average_daily_usage, type: number, source: computed, default: 0, description: "Total delivered quantity of this product in the trailing 28-day window / 28; 4 decimal places, round_half_up" }
      - { name: on_hand_estimate, type: number, source: computed, default: 0, description: "Delivered quantity minus accrued consumption; 4 decimal places, round_half_up" }
      - { name: last_evaluated_at, type: datetime, source: system, description: "Logical-clock timestamp of last consumption accrual; set at profile creation and at each replenishment run" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: input, description: "FK -> Practice.id" }
      - { name: kind, type: enum, source: input, constraints: "MANUAL | AUTO | STARTUP | BUNDLE", description: "AUTO is system-created only (client-supplied AUTO rejected with ERR_INVALID_REQUEST); STARTUP may contain EQUIPMENT lines and is limited to one per practice within 90 days of practice creation" }
      - { name: promotion_id, type: string, source: input, default: null, description: "FK -> Promotion.id; only BUNDLE_DISCOUNT promotions may attach to orders" }
      - { name: lines, type: array, source: input, description: "Array of { product_id, quantity } (quantity integer > 0); server enriches each entry with unit_price_cents snapshot and line_total_cents" }
      - { name: status, type: enum, source: system, default: DRAFT, constraints: "DRAFT | SUBMITTED | DELIVERED | CANCELLED", description: "Lifecycle state" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of line_total_cents" }
      - { name: volume_discount_cents, type: integer, source: computed, default: 0, description: "Tiered discount keyed on pre-discount subtotal_cents" }
      - { name: bundle_discount_cents, type: integer, source: computed, default: 0, description: "Bundle discount from attached BUNDLE_DISCOUNT promotion; 0 when required products missing or no promotion" }
      - { name: discount_cents, type: integer, source: computed, default: 0, description: "volume + bundle when promotion.stacking_allowed, else max(volume, bundle)" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents - discount_cents" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of submission" }
      - { name: delivered_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of delivery; drives usage-profile windows" }

  - name: EquipmentSale
    parent: null
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: input, description: "FK -> Practice.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; product must be kind EQUIPMENT" }
      - { name: sale_price_cents, type: integer, source: input, description: "Agreed sale price in cents; must be > 0" }
      - { name: status, type: enum, source: system, default: QUOTE, constraints: "QUOTE | CONFIRMED | INSTALL_SCHEDULED | INSTALLED | TRAINED | ACCEPTED", description: "Pipeline state with install rework cycle INSTALLED -> INSTALL_SCHEDULED" }
      - { name: installer_technician_id, type: string, source: system, default: null, description: "FK -> Technician.id; set by schedule-install" }
      - { name: install_window_start, type: datetime, source: system, default: null, description: "Install window start; set by schedule-install" }
      - { name: install_window_end, type: datetime, source: system, default: null, description: "Install window end; set by schedule-install" }
      - { name: install_rework_count, type: integer, source: system, default: 0, description: "Increments each time an INSTALLED sale is rescheduled for rework" }
      - { name: training_minutes, type: integer, source: system, default: null, description: "Delivered training duration; set by complete-training" }
      - { name: trade_in_id, type: string, source: system, default: null, description: "FK -> TradeIn.id; set by trade-in apply-to-sale; at most one per sale" }
      - { name: trade_in_credit_cents, type: integer, source: system, default: null, description: "Credited trade-in value; set by trade-in apply-to-sale" }
      - { name: warranty_agreement_id, type: string, source: system, default: null, description: "FK -> CoverageAgreement.id; manufacturer warranty created by accept" }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Technician display name" }
      - { name: region, type: string, source: input, description: "Home service region; dispatch eligibility requires region == Practice.region" }
      - { name: certifications, type: array, source: input, description: "Array of enum INSTALL | REPAIR | STERILIZATION; installs need INSTALL, repair dispatch needs REPAIR" }
      - { name: status, type: enum, source: input, default: ACTIVE, constraints: "ACTIVE | INACTIVE", description: "INACTIVE technicians are ineligible for scheduling" }
      - { name: van_stock, type: array, source: system, default: [], description: "Parts van contents: array of { product_id, quantity_on_van, min_quantity }; mutated by van-stock load, ticket resolve (debit) and reopen (restore)" }

  - name: ServiceTicket
    parent: null
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: input, description: "FK -> Practice.id; must equal the equipment sale's practice" }
      - { name: equipment_sale_id, type: string, source: input, description: "FK -> EquipmentSale.id; sale must be ACCEPTED (equipment in service)" }
      - { name: issue_description, type: string, source: input, description: "Free-text problem report" }
      - { name: status, type: enum, source: system, default: OPEN, constraints: "OPEN | COVERAGE_ASSESSED | AWAITING_APPROVAL | DISPATCHED | RESOLVED | CLOSED", description: "Branching lifecycle: OPEN -> COVERAGE_ASSESSED (covered) or OPEN -> AWAITING_APPROVAL (billable); RESOLVED -> OPEN rework cycle via reopen" }
      - { name: coverage_determination, type: enum, source: system, default: null, constraints: "WARRANTY | SERVICE_PLAN | BILLABLE | null", description: "Set by assess-coverage; cleared by reopen" }
      - { name: coverage_agreement_id, type: string, source: system, default: null, description: "FK -> CoverageAgreement.id; the agreement selected by assess-coverage; null when BILLABLE" }
      - { name: estimate_cents, type: integer, source: computed, default: null, description: "Flat diagnostic estimate shown when BILLABLE; constant 7500" }
      - { name: parts_used, type: array, source: system, default: null, description: "Array of { product_id, quantity } recorded at resolve; debited from assigned technician's van_stock" }
      - { name: labor_minutes, type: integer, source: system, default: null, description: "Labor recorded at resolve" }
      - { name: customer_due_cents, type: integer, source: computed, default: null, description: "Amount owed by practice after coverage; set at resolve; cleared by reopen" }
      - { name: resolved_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of resolution; reopen allowed while now - resolved_at <= 30 days" }

  - name: DispatchJob
    parent: null
    common_fields: true
    fields:
      - { name: service_ticket_id, type: string, source: system, description: "FK -> ServiceTicket.id; at most one SCHEDULED job per ticket" }
      - { name: technician_id, type: string, source: system, description: "FK -> Technician.id; chosen by dispatch selector policy" }
      - { name: scheduled_start, type: datetime, source: input, description: "Requested window start (half-open interval start)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Requested window end (half-open interval end; must be > start)" }
      - { name: status, type: enum, source: system, default: SCHEDULED, constraints: "SCHEDULED | COMPLETED", description: "COMPLETED when the parent ticket is resolved" }

  - name: CoverageAgreement
    parent: null
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: input, description: "FK -> Practice.id" }
      - { name: equipment_sale_id, type: string, source: input, description: "FK -> EquipmentSale.id; the covered equipment" }
      - { name: coverage_type, type: enum, source: input, constraints: "WARRANTY | SERVICE_PLAN", description: "WARRANTY created by equipment accept (deductible 0, cap null); SERVICE_PLAN purchased via POST" }
      - { name: start_date, type: datetime, source: input, description: "Coverage start (inclusive)" }
      - { name: end_date, type: datetime, source: input, description: "Coverage end (inclusive); now > end_date lazily flips status to EXPIRED" }
      - { name: deductible_cents, type: integer, source: input, default: 0, description: "Per-claim deductible; 0 for WARRANTY" }
      - { name: coverage_cap_cents, type: integer, source: input, default: null, description: "Lifetime payout cap for SERVICE_PLAN; null means uncapped (WARRANTY)" }
      - { name: used_cents, type: integer, source: computed, default: 0, description: "Cumulative plan_share paid under this agreement; debited at resolve, credited at reopen" }
      - { name: status, type: enum, source: system, default: ACTIVE, constraints: "ACTIVE | EXPIRED | EXHAUSTED", description: "EXHAUSTED when used_cents >= coverage_cap_cents (capped plans only)" }

  - name: Promotion
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program display name" }
      - { name: promo_kind, type: enum, source: input, constraints: "BUNDLE_DISCOUNT | MANUFACTURER_REBATE", description: "BUNDLE_DISCOUNT attaches to orders; MANUFACTURER_REBATE attaches to rebate claims" }
      - { name: required_product_ids, type: array, source: input, default: null, description: "Product ids that must all be present in a BUNDLE order (list of Product ids; data only)" }
      - { name: eligible_product_ids, type: array, source: input, default: null, description: "Product ids whose order lines accrue manufacturer rebate (list of Product ids; data only)" }
      - { name: discount_pct, type: number, source: input, default: null, description: "Bundle discount fraction of the component-line subtotal (e.g. 0.15)" }
      - { name: max_discount_cents, type: integer, source: input, default: null, description: "Cap on bundle_discount_cents per order" }
      - { name: rebate_per_unit_cents, type: integer, source: input, default: null, description: "Manufacturer rebate per eligible unit" }
      - { name: stacking_allowed, type: boolean, source: input, default: false, description: "When false, order discount = max(volume, bundle); when true, volume + bundle" }
      - { name: fund_total_cents, type: integer, source: input, default: null, description: "Manufacturer rebate fund; required for MANUFACTURER_REBATE" }
      - { name: fund_remaining_cents, type: integer, source: computed, default: null, description: "fund_total minus amounts reserved by SUBMITTED/PAID claims; debited at submit, credited at deny" }
      - { name: start_date, type: datetime, source: input, description: "Program window start (inclusive)" }
      - { name: end_date, type: datetime, source: input, description: "Program window end (inclusive); use outside [start_date, end_date] lazily flips status EXPIRED" }
      - { name: status, type: enum, source: system, default: ACTIVE, constraints: "ACTIVE | EXPIRED | EXHAUSTED", description: "EXHAUSTED when fund_remaining_cents <= 0; returns to ACTIVE if a deny restores funds" }

  - name: RebateClaim
    parent: null
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: input, description: "FK -> Practice.id; must equal the order's practice" }
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; unique together with promotion_id among non-DENIED claims" }
      - { name: promotion_id, type: string, source: input, description: "FK -> Promotion.id; must be MANUFACTURER_REBATE" }
      - { name: claim_amount_cents, type: integer, source: computed, description: "Sum of per-line rounded rebates (see rebate_payout calculation)" }
      - { name: status, type: enum, source: system, default: DRAFT, constraints: "DRAFT | SUBMITTED | DENIED | PAID", description: "DENIED -> DRAFT via revise (resubmission cycle)" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of last submit" }
      - { name: paid_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of settlement" }
      - { name: denial_reason, type: string, source: system, default: null, description: "Manufacturer-supplied reason at deny" }

  - name: TradeIn
    parent: null
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: input, description: "FK -> Practice.id" }
      - { name: description, type: string, source: input, description: "Free-text description of the used equipment" }
      - { name: equipment_age_months, type: integer, source: input, description: "Age in whole months; drives MARKET_VALUE depreciation" }
      - { name: condition, type: enum, source: input, constraints: "WORKING | NEEDS_REPAIR | SCRAP", description: "Physical condition grade" }
      - { name: category_base_value_cents, type: integer, source: input, description: "As-new market reference value for this equipment category" }
      - { name: valuation_method, type: enum, source: system, default: null, constraints: "MARKET_VALUE | SCRAP_VALUE | null", description: "Chosen by SalesRep at appraisal" }
      - { name: appraised_value_cents, type: integer, source: computed, default: null, description: "Result of trade_in_valuation under the chosen method" }
      - { name: applied_to_equipment_sale_id, type: string, source: system, default: null, description: "FK -> EquipmentSale.id; set by apply-to-sale" }
      - { name: disposal_method, type: enum, source: system, default: null, constraints: "RECYCLE | RESALE_PARTS | HAZMAT | null", description: "Recorded at dispose" }
      - { name: status, type: enum, source: system, default: REQUESTED, constraints: "REQUESTED | APPRAISED | ACCEPTED | CREDITED | DISPOSED", description: "Trade-in lifecycle" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Practice
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/practices/{id}/suspend"
        actor: DistributionAdmin
        preconditions: ["Practice.status == ACTIVE"]
        side_effects: ["Practice.version += 1", "updated_at refreshed"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/practices/{id}/reinstate"
        actor: DistributionAdmin
        preconditions: ["Practice.status == SUSPENDED"]
        side_effects: ["Practice.version += 1", "updated_at refreshed"]

  - entity: Order
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/orders/{id}/submit"
        actor: PracticeManager | SalesRep
        preconditions:
          - "Order.status == DRAFT"
          - "Order.lines non-empty"
          - "Practice.status == ACTIVE (else ERR_PRACTICE_SUSPENDED)"
          - "kind == BUNDLE implies attached promotion's required_product_ids all present in lines (else ERR_BUNDLE_INCOMPLETE)"
          - "total_cents <= Practice.credit_available_cents (else ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "Practice.credit_available_cents -= Order.total_cents (credit reservation)"
          - "submitted_at = logical clock now; Practice.version += 1"
      - from: SUBMITTED
        to: DELIVERED
        trigger: "POST /api/orders/{id}/deliver"
        actor: DistributionAdmin
        preconditions: ["Order.status == SUBMITTED"]
        side_effects:
          - "delivered_at = logical clock now (hop 1: Order mutated)"
          - "hop 2: for each line whose product is CONSUMABLE or REGULATED and a UsageProfile exists for (practice_id, product_id): on_hand_estimate += line quantity, average_daily_usage recomputed per usage_average calculation"
          - "hop 3: for each UsageProfile mutated in hop 2 with auto_replenish_enabled and on_hand_estimate <= reorder_point and no existing DRAFT AUTO order for (practice_id, product_id): create Order kind=AUTO status=DRAFT with one line, quantity = ceiling(target_stock_level - on_hand_estimate) per auto_reorder_quantity calculation (skip when quantity < 1)"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/orders/{id}/cancel"
        actor: PracticeManager | SalesRep
        preconditions: ["Order.status == DRAFT"]
        side_effects: ["updated_at refreshed"]
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /api/orders/{id}/cancel"
        actor: PracticeManager | SalesRep
        preconditions: ["Order.status == SUBMITTED"]
        side_effects:
          - "Practice.credit_available_cents += Order.total_cents (compensation restores the submit reservation)"
          - "Practice.version += 1"

  - entity: EquipmentSale
    initial_state: QUOTE
    terminal_states: [ACCEPTED]
    transitions:
      - from: QUOTE
        to: CONFIRMED
        trigger: "POST /api/equipment-sales/{id}/confirm"
        actor: SalesRep
        preconditions:
          - "EquipmentSale.status == QUOTE"
          - "Practice.status == ACTIVE (else ERR_PRACTICE_SUSPENDED)"
        side_effects: ["updated_at refreshed"]
      - from: CONFIRMED
        to: INSTALL_SCHEDULED
        trigger: "POST /api/equipment-sales/{id}/schedule-install"
        actor: SalesRep
        preconditions:
          - "EquipmentSale.status == CONFIRMED"
          - "Technician.status == ACTIVE and INSTALL in Technician.certifications (else ERR_CERTIFICATION_MISSING)"
          - "window_end > window_start"
          - "no half-open overlap for the technician against their SCHEDULED DispatchJobs and other INSTALL_SCHEDULED sales (else ERR_TECHNICIAN_SCHEDULE_CONFLICT)"
          - "no closed-interval overlap at the practice against other INSTALL_SCHEDULED sales (else ERR_INSTALL_WINDOW_CONFLICT)"
        side_effects: ["installer_technician_id, install_window_start, install_window_end set"]
      - from: INSTALL_SCHEDULED
        to: INSTALLED
        trigger: "POST /api/equipment-sales/{id}/complete-install"
        actor: FieldTechnician
        preconditions:
          - "EquipmentSale.status == INSTALL_SCHEDULED"
          - "caller X-User-ID == EquipmentSale.installer_technician_id (else ERR_FORBIDDEN)"
        side_effects: ["updated_at refreshed"]
      - from: INSTALLED
        to: INSTALL_SCHEDULED
        trigger: "POST /api/equipment-sales/{id}/schedule-install (install rework cycle)"
        actor: SalesRep
        preconditions: ["same technician/certification/overlap checks as CONFIRMED -> INSTALL_SCHEDULED"]
        side_effects: ["install_rework_count += 1", "install window fields overwritten"]
      - from: INSTALLED
        to: TRAINED
        trigger: "POST /api/equipment-sales/{id}/complete-training"
        actor: FieldTechnician
        preconditions:
          - "EquipmentSale.status == INSTALLED"
          - "caller X-User-ID == EquipmentSale.installer_technician_id (else ERR_FORBIDDEN)"
          - "training_minutes > 0"
        side_effects: ["training_minutes recorded"]
      - from: TRAINED
        to: ACCEPTED
        trigger: "POST /api/equipment-sales/{id}/accept"
        actor: PracticeManager
        preconditions:
          - "EquipmentSale.status == TRAINED"
          - "caller X-User-ID == EquipmentSale.practice_id (else ERR_FORBIDDEN)"
        side_effects:
          - "create CoverageAgreement coverage_type=WARRANTY, deductible_cents=0, coverage_cap_cents=null, start_date = logical clock now, end_date = now + Product.warranty_months calendar months, status=ACTIVE"
          - "warranty_agreement_id set to the new agreement"

  - entity: ServiceTicket
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: COVERAGE_ASSESSED
        trigger: "POST /api/service-tickets/{id}/assess-coverage (determination WARRANTY or SERVICE_PLAN)"
        actor: ServiceDispatcher
        preconditions: ["ServiceTicket.status == OPEN"]
        side_effects: ["coverage_determination and coverage_agreement_id set per coverage_determination calculation"]
      - from: OPEN
        to: AWAITING_APPROVAL
        trigger: "POST /api/service-tickets/{id}/assess-coverage (determination BILLABLE — fork branch)"
        actor: ServiceDispatcher
        preconditions: ["ServiceTicket.status == OPEN", "no ACTIVE agreement covers the equipment at logical clock now"]
        side_effects: ["coverage_determination = BILLABLE", "estimate_cents = 7500 (flat diagnostic estimate)"]
      - from: AWAITING_APPROVAL
        to: COVERAGE_ASSESSED
        trigger: "POST /api/service-tickets/{id}/approve-estimate"
        actor: PracticeManager
        preconditions:
          - "ServiceTicket.status == AWAITING_APPROVAL"
          - "caller X-User-ID == ServiceTicket.practice_id (else ERR_FORBIDDEN)"
        side_effects: ["updated_at refreshed (join: both branches reach COVERAGE_ASSESSED)"]
      - from: COVERAGE_ASSESSED
        to: DISPATCHED
        trigger: "POST /api/service-tickets/{id}/dispatch"
        actor: ServiceDispatcher
        preconditions:
          - "ServiceTicket.status == COVERAGE_ASSESSED"
          - "no existing SCHEDULED DispatchJob for this ticket (else ERR_INVALID_STATE)"
          - "dispatch_technician_selection candidate pool non-empty (else ERR_TECHNICIAN_UNAVAILABLE)"
        side_effects: ["create DispatchJob status=SCHEDULED with selector-chosen technician_id and requested window"]
      - from: DISPATCHED
        to: RESOLVED
        trigger: "POST /api/service-tickets/{id}/resolve"
        actor: FieldTechnician
        preconditions:
          - "ServiceTicket.status == DISPATCHED"
          - "caller X-User-ID == technician_id of the ticket's SCHEDULED DispatchJob (else ERR_FORBIDDEN)"
          - "each parts_used entry has sufficient quantity_on_van on that technician (else ERR_PARTS_NOT_ON_VAN)"
        side_effects:
          - "hop 1: Technician.van_stock debited per parts_used"
          - "hop 2: customer_due_cents computed per repair_cost calculation under coverage_determination; SERVICE_PLAN agreement used_cents += plan_share"
          - "hop 3: if used_cents >= coverage_cap_cents the agreement flips ACTIVE -> EXHAUSTED"
          - "linked DispatchJob SCHEDULED -> COMPLETED; resolved_at = logical clock now"
      - from: RESOLVED
        to: OPEN
        trigger: "POST /api/service-tickets/{id}/reopen (rework cycle)"
        actor: PracticeManager | ServiceDispatcher
        preconditions:
          - "ServiceTicket.status == RESOLVED"
          - "logical clock now - resolved_at <= 30 days (else ERR_REOPEN_WINDOW_EXPIRED)"
        side_effects:
          - "compensation: parts_used quantities credited back to the resolving technician's van_stock"
          - "compensation: SERVICE_PLAN used_cents -= prior plan_share (floor 0); if agreement was EXHAUSTED and used_cents drops below cap it returns to ACTIVE"
          - "coverage_determination, coverage_agreement_id, customer_due_cents, parts_used, labor_minutes, resolved_at cleared to null"
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /api/service-tickets/{id}/close"
        actor: PracticeManager | ServiceDispatcher
        preconditions: ["ServiceTicket.status == RESOLVED"]
        side_effects: ["updated_at refreshed"]

  - entity: DispatchJob
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "system cascade from POST /api/service-tickets/{id}/resolve"
        actor: system
        preconditions: ["parent ServiceTicket resolved"]
        side_effects: ["updated_at refreshed"]

  - entity: CoverageAgreement
    initial_state: ACTIVE
    terminal_states: [EXPIRED, EXHAUSTED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system lazy evaluation whenever the agreement is read or used and logical clock now > end_date"
        actor: system
        preconditions: ["status == ACTIVE", "now > end_date"]
        side_effects: ["status persisted as EXPIRED"]
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system cascade from POST /api/service-tickets/{id}/resolve"
        actor: system
        preconditions: ["coverage_type == SERVICE_PLAN", "coverage_cap_cents != null", "used_cents >= coverage_cap_cents"]
        side_effects: ["status persisted as EXHAUSTED"]
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system compensation cascade from POST /api/service-tickets/{id}/reopen"
        actor: system
        preconditions: ["used_cents credited below coverage_cap_cents"]
        side_effects: ["status persisted as ACTIVE"]

  - entity: Promotion
    initial_state: ACTIVE
    terminal_states: [EXPIRED, EXHAUSTED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system cascade from POST /api/rebate-claims/{id}/submit when fund_remaining_cents reaches <= 0"
        actor: system
        preconditions: ["promo_kind == MANUFACTURER_REBATE", "fund_remaining_cents <= 0"]
        side_effects: ["status persisted as EXHAUSTED"]
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system compensation cascade from POST /api/rebate-claims/{id}/deny when the release lifts fund_remaining_cents above 0"
        actor: system
        preconditions: ["fund_remaining_cents > 0 after release"]
        side_effects: ["status persisted as ACTIVE"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system lazy evaluation whenever the promotion is attached/read and logical clock now > end_date"
        actor: system
        preconditions: ["status == ACTIVE", "now > end_date"]
        side_effects: ["status persisted as EXPIRED"]

  - entity: RebateClaim
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/rebate-claims/{id}/submit"
        actor: PracticeManager
        preconditions:
          - "RebateClaim.status == DRAFT"
          - "caller X-User-ID == RebateClaim.practice_id (else ERR_FORBIDDEN)"
          - "Order.status == DELIVERED (else ERR_ORDER_NOT_DELIVERED)"
          - "Promotion.status == ACTIVE after lazy expiry check (else ERR_PROMOTION_INACTIVE)"
          - "Promotion.fund_remaining_cents >= claim_amount_cents (else ERR_REBATE_FUND_EXHAUSTED)"
        side_effects:
          - "hop 1: claim SUBMITTED, submitted_at = now"
          - "hop 2: Promotion.fund_remaining_cents -= claim_amount_cents (reservation)"
          - "hop 3: if fund_remaining_cents <= 0 the promotion flips ACTIVE -> EXHAUSTED"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /api/rebate-claims/{id}/deny"
        actor: ManufacturerAgent
        preconditions: ["RebateClaim.status == SUBMITTED"]
        side_effects:
          - "denial_reason recorded"
          - "compensation: Promotion.fund_remaining_cents += claim_amount_cents"
          - "compensation cascade: if promotion was EXHAUSTED and fund_remaining_cents > 0 it returns to ACTIVE"
      - from: DENIED
        to: DRAFT
        trigger: "POST /api/rebate-claims/{id}/revise (resubmission cycle)"
        actor: PracticeManager
        preconditions:
          - "RebateClaim.status == DENIED"
          - "caller X-User-ID == RebateClaim.practice_id (else ERR_FORBIDDEN)"
        side_effects: ["denial_reason cleared", "revision_note recorded in updated_at audit"]
      - from: SUBMITTED
        to: PAID
        trigger: "POST /api/rebate-claims/{id}/settle"
        actor: ManufacturerAgent
        preconditions: ["RebateClaim.status == SUBMITTED"]
        side_effects: ["paid_at = logical clock now"]

  - entity: TradeIn
    initial_state: REQUESTED
    terminal_states: [DISPOSED]
    transitions:
      - from: REQUESTED
        to: APPRAISED
        trigger: "POST /api/trade-ins/{id}/appraise"
        actor: SalesRep
        preconditions: ["TradeIn.status == REQUESTED"]
        side_effects: ["appraised_value_cents computed per trade_in_valuation under the chosen valuation_method"]
      - from: APPRAISED
        to: ACCEPTED
        trigger: "POST /api/trade-ins/{id}/accept"
        actor: PracticeManager
        preconditions:
          - "TradeIn.status == APPRAISED"
          - "caller X-User-ID == TradeIn.practice_id (else ERR_FORBIDDEN)"
        side_effects: ["updated_at refreshed"]
      - from: ACCEPTED
        to: CREDITED
        trigger: "POST /api/trade-ins/{id}/apply-to-sale"
        actor: SalesRep
        preconditions:
          - "TradeIn.status == ACCEPTED"
          - "EquipmentSale.status in {QUOTE, CONFIRMED} (else ERR_INVALID_STATE)"
          - "EquipmentSale.trade_in_id is null (else ERR_TRADE_IN_ALREADY_APPLIED)"
          - "appraised_value_cents <= EquipmentSale.sale_price_cents (else ERR_TRADE_IN_CREDIT_EXCEEDS_PRICE)"
        side_effects:
          - "EquipmentSale.trade_in_id = this TradeIn; trade_in_credit_cents = appraised_value_cents"
          - "applied_to_equipment_sale_id set"
      - from: CREDITED
        to: DISPOSED
        trigger: "POST /api/trade-ins/{id}/dispose"
        actor: DistributionAdmin
        preconditions: ["TradeIn.status == CREDITED"]
        side_effects: ["disposal_method recorded"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: usage-profile-upsert-stale-practice
    parent_entity: Practice
    write_endpoint: "PUT /api/usage-profiles"
    occ_field: expected_practice_version
    description: |
      Upserting a UsageProfile against a Practice whose version has advanced
      since the client last observed it is rejected. The upsert legitimately
      creates-or-supersedes the profile for (practice_id, product_id), so a
      writer holding a stale Practice.version would silently overwrite a
      profile written against newer practice state.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: usage_average
    trigger: "on order deliver (per affected profile) and on replenishment run before accrual"
    algorithm: chronological
    formula: |
      window = [now - 28 days, now]  (both bounds inclusive, logical clock)
      total_qty = sum of line quantities for this product across this practice's
                  orders with status == DELIVERED and delivered_at inside window
      average_daily_usage = round_half_up(total_qty / 28, 4)
    input_set: "Orders of this practice with status DELIVERED and delivered_at in the trailing 28-day window; DRAFT/SUBMITTED/CANCELLED excluded"
    constants: { WINDOW_DAYS: 28 }
    precision: "4 decimal places, round_half_up"

  - name: on_hand_accrual
    trigger: "on replenishment run, per UsageProfile, before threshold evaluation"
    algorithm: aggregation
    formula: |
      elapsed_days = floor((now - last_evaluated_at) / 86400 seconds)
      on_hand_estimate = round_half_up(max(0, on_hand_estimate - average_daily_usage * elapsed_days), 4)
      last_evaluated_at = now
    input_set: "Every UsageProfile row"
    constants: { SECONDS_PER_DAY: 86400 }
    precision: "4 decimal places, round_half_up"
    note: "Deliveries add full line quantity to on_hand_estimate without accrual; accrual happens only at run time"

  - name: auto_reorder_quantity
    trigger: "whenever a UsageProfile is evaluated (deliver cascade hop 3, or replenishment run after accrual)"
    algorithm: threshold
    formula: |
      if auto_replenish_enabled AND on_hand_estimate <= reorder_point
         AND no existing DRAFT order of kind AUTO for (practice_id, product_id):
          qty = ceiling(target_stock_level - on_hand_estimate)
          if qty >= 1: create Order(kind=AUTO, status=DRAFT, lines=[{product_id, qty}])
      Boundary: on_hand_estimate EXACTLY EQUAL to reorder_point triggers (<=).
    input_set: "The single UsageProfile under evaluation"
    constants: {}
    precision: "quantity integer, ceiling"

  - name: order_volume_discount
    trigger: "on order creation (lines priced) and reused by AUTO order creation"
    algorithm: tiered_pricing
    formula: |
      Evaluation order is pinned: the tier is keyed on the PRE-DISCOUNT subtotal_cents,
      the discount is then computed from that same subtotal, and only then is
      total_cents derived. This removes the circular reading in which the tier
      would depend on the discounted total.
      subtotal_cents = sum(line.quantity * line.unit_price_cents)
      if subtotal_cents >= 500000: pct = 0.10
      elif subtotal_cents >= 200000: pct = 0.05
      else: pct = 0
      volume_discount_cents = round_half_up(subtotal_cents * pct, 0)
    input_set: "The order's own lines"
    constants: { TIER1_THRESHOLD_CENTS: 500000, TIER1_PCT: 0.10, TIER2_THRESHOLD_CENTS: 200000, TIER2_PCT: 0.05 }
    precision: "0 decimal places (whole cents), round_half_up"

  - name: bundle_discount
    trigger: "on order creation when a BUNDLE_DISCOUNT promotion is attached"
    algorithm: tiered_pricing
    formula: |
      if promotion_id is null or not all promotion.required_product_ids appear in lines:
          bundle_discount_cents = 0
      else:
          component_subtotal = sum(line_total for lines whose product_id in required_product_ids)
          tier_bonus = 0.02 if Practice.practice_tier == ELITE else 0
          raw = round_half_up(component_subtotal * (promotion.discount_pct + tier_bonus), 0)
          bundle_discount_cents = min(raw, promotion.max_discount_cents) if max_discount_cents != null else raw
      Non-linear interaction of 4 inputs: component_subtotal, discount_pct,
      tier_bonus (conditional on practice state), max_discount_cents (nested min).
    input_set: "The order's lines, the attached Promotion, the ordering Practice"
    constants: { ELITE_TIER_BONUS: 0.02 }
    precision: "0 decimal places (whole cents), round_half_up"

  - name: order_total
    trigger: "on order creation after order_volume_discount and bundle_discount"
    algorithm: aggregation
    formula: |
      if promotion attached and promotion.stacking_allowed == false:
          discount_cents = max(volume_discount_cents, bundle_discount_cents)
      elif promotion attached and stacking_allowed == true:
          discount_cents = volume_discount_cents + bundle_discount_cents
      else (no promotion):
          discount_cents = volume_discount_cents
      total_cents = subtotal_cents - discount_cents
    input_set: "The order's computed discount fields and attached promotion"
    constants: {}
    precision: "0 decimal places (whole cents)"

  - name: rebate_payout
    trigger: "on rebate claim creation"
    algorithm: aggregation
    formula: |
      tier_multiplier = { STANDARD: 1.0, PREMIER: 1.1, ELITE: 1.25 }[Practice.practice_tier]
      Rounding order is pinned: round EACH eligible line first, then sum.
      for each order line whose product_id is in promotion.eligible_product_ids:
          line_rebate = round_half_up(line.quantity * promotion.rebate_per_unit_cents * tier_multiplier, 0)
      claim_amount_cents = sum(line_rebate)
      (Sum-then-round is a different, rejected reading: e.g. two lines of
      1 x 50 x 1.25 give 63 + 63 = 126 per-line vs round(125.0) = 125 summed.)
    input_set: "Lines of the referenced order whose product is eligible; practice tier at claim creation"
    constants: { MULT_STANDARD: 1.0, MULT_PREMIER: 1.1, MULT_ELITE: 1.25 }
    precision: "0 decimal places (whole cents), round_half_up per line before summation"

  - name: repair_cost
    trigger: "on service ticket resolve"
    algorithm: aggregation
    formula: |
      parts_cost = sum(entry.quantity * Product.unit_price_cents at resolve time for entry in parts_used)
      gross_cost_cents = parts_cost + labor_minutes * LABOR_RATE_CENTS_PER_MINUTE
      WARRANTY variant:      customer_due_cents = 0
      SERVICE_PLAN variant:  remaining_cap = coverage_cap_cents - used_cents (infinite when cap null)
                             plan_share = min(max(0, gross_cost_cents - deductible_cents), max(0, remaining_cap))
                             customer_due_cents = gross_cost_cents - plan_share
      BILLABLE variant:      customer_due_cents = gross_cost_cents
    input_set: "parts_used, labor_minutes, the selected CoverageAgreement (when not BILLABLE)"
    constants: { LABOR_RATE_CENTS_PER_MINUTE: 200, DIAGNOSTIC_ESTIMATE_CENTS: 7500 }
    precision: "0 decimal places (whole cents)"
    variants:
      - name: WARRANTY
        when: "an ACTIVE manufacturer warranty covers the equipment at now"
        difference: "practice pays 0 regardless of gross cost; used_cents unchanged"
      - name: SERVICE_PLAN
        when: "no ACTIVE warranty but an ACTIVE service plan covers the equipment"
        difference: "practice pays gross minus min(gross - deductible, remaining cap); used_cents debited by plan_share"
      - name: BILLABLE
        when: "no ACTIVE agreement covers the equipment"
        difference: "practice pays full gross cost"

  - name: trade_in_valuation
    trigger: "on trade-in appraise"
    algorithm: decay_function
    formula: |
      MARKET_VALUE variant:
          condition_factor = { WORKING: 1.0, NEEDS_REPAIR: 0.6, SCRAP: 0.2 }[condition]
          raw = category_base_value_cents * (0.98 ^ equipment_age_months) * condition_factor
          appraised_value_cents = max(round_half_up(raw, 0), round_half_up(0.10 * category_base_value_cents, 0))
      SCRAP_VALUE variant:
          appraised_value_cents = { WORKING: 25000, NEEDS_REPAIR: 10000, SCRAP: 4000 }[condition]
    input_set: "The TradeIn's category_base_value_cents, equipment_age_months, condition"
    constants: { MONTHLY_DEPRECIATION: 0.02, FLOOR_FRACTION: 0.10, SCRAP_WORKING: 25000, SCRAP_NEEDS_REPAIR: 10000, SCRAP_SCRAP: 4000 }
    precision: "0 decimal places (whole cents), round_half_up"
    variants:
      - name: MARKET_VALUE
        when: "SalesRep selects MARKET_VALUE at appraisal"
        difference: "exponential age depreciation with condition factor and a 10% floor; age-sensitive"
      - name: SCRAP_VALUE
        when: "SalesRep selects SCRAP_VALUE at appraisal"
        difference: "flat salvage table keyed only on condition; ignores age and base value"

  - name: coverage_determination
    trigger: "on service ticket assess-coverage"
    algorithm: priority_selection
    formula: |
      candidates = CoverageAgreements with equipment_sale_id == ticket.equipment_sale_id
                   after lazy expiry (ACTIVE rows with now > end_date flip to EXPIRED and drop out)
                   and status == ACTIVE and start_date <= now <= end_date (both inclusive)
      if any candidate has coverage_type == WARRANTY: pick it (determination WARRANTY)
      elif any candidate has coverage_type == SERVICE_PLAN:
          pick earliest end_date; tie-break earliest created_at (determination SERVICE_PLAN)
      else: determination BILLABLE, coverage_agreement_id = null
    input_set: "CoverageAgreements for the ticket's equipment sale"
    constants: {}
    precision: "n/a"

  - name: dispatch_technician_selection
    trigger: "on service ticket dispatch"
    algorithm: priority_selection
    formula: |
      eligibility filter:
        Technician.status == ACTIVE
        AND 'REPAIR' in certifications
        AND region == Practice.region of the ticket's practice
        AND no half-open overlap: for every SCHEDULED DispatchJob and every
            INSTALL_SCHEDULED EquipmentSale install window [s, e) of the technician,
            NOT (s < requested_end AND requested_start < e)
            (adjacent windows where requested_start == e or requested_end == s are allowed)
      ranking: total scheduled minutes of the technician intersecting the requested
               calendar day [day 00:00, next day 00:00), ascending
      tie-break: Technician.created_at ascending
      empty pool: reject with ERR_TECHNICIAN_UNAVAILABLE
    input_set: "All Technician rows, their SCHEDULED jobs and scheduled install windows"
    constants: {}
    precision: "n/a"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Caller role is in the endpoint's roles; entity-backed ownership: PracticeManager may only touch resources whose practice_id == X-User-ID; FieldTechnician may only complete installs/trainings/resolutions assigned to X-User-ID", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Every path id and body foreign key references an existing resource", error_id: ERR_RESOURCE_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: business_constraint, check: "Request shape: required fields present, enum members valid, quantities > 0, datetimes well-formed, window_end > window_start, client-supplied kind != AUTO", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 5, category: state, check: "Target resource is in a state from which the requested transition exists (terminal states reject all transitions)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: state, check: "expected_practice_version equals Practice.version (OCC)", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PUT /api/usage-profiles" }
  - { priority: 7, category: business_safety, check: "Every REGULATED line requires Practice.regulated_license_expiry non-null and >= now", error_id: ERR_REGULATED_LICENSE_MISSING, http_status: 422, applies_to: "POST /api/orders" }
  - { priority: 8, category: business_safety, check: "Every line whose product has sterilization_cycle_required requires Practice.sterilization_compliant == true", error_id: ERR_STERILIZATION_NOT_CERTIFIED, http_status: 422, applies_to: "POST /api/orders" }
  - { priority: 9, category: business_constraint, check: "REGULATED line quantity <= Product.max_qty_per_order when set", error_id: ERR_REGULATED_QTY_LIMIT, http_status: 422, applies_to: "POST /api/orders" }
  - { priority: 10, category: business_constraint, check: "EQUIPMENT lines are permitted only on orders of kind STARTUP", error_id: ERR_EQUIPMENT_NOT_ORDERABLE, http_status: 422, applies_to: "POST /api/orders" }
  - { priority: 11, category: business_temporal, check: "STARTUP orders require logical clock now <= Practice.created_at + 90 days", error_id: ERR_STARTUP_WINDOW_EXPIRED, http_status: 422, applies_to: "POST /api/orders" }
  - { priority: 12, category: business_constraint, check: "At most one non-CANCELLED STARTUP order per practice", error_id: ERR_STARTUP_PACKAGE_LIMIT, http_status: 409, applies_to: "POST /api/orders" }
  - { priority: 13, category: business_constraint, check: "target_stock_level > reorder_point; UsageProfile product is CONSUMABLE or REGULATED", error_id: ERR_REORDER_TARGET_INVALID, http_status: 422, applies_to: "PUT /api/usage-profiles" }
  - { priority: 14, category: business_temporal, check: "Attached promotion is ACTIVE after lazy expiry and now within [start_date, end_date]", error_id: ERR_PROMOTION_INACTIVE, http_status: 422, applies_to: "POST /api/orders, POST /api/rebate-claims/{id}/submit" }
  - { priority: 15, category: business_constraint, check: "Promotion kind matches usage: orders accept only BUNDLE_DISCOUNT; claims accept only MANUFACTURER_REBATE", error_id: ERR_PROMOTION_NOT_APPLICABLE, http_status: 422, applies_to: "POST /api/orders, POST /api/rebate-claims" }
  - { priority: 16, category: business_constraint, check: "BUNDLE order lines include every product in the attached promotion's required_product_ids", error_id: ERR_BUNDLE_INCOMPLETE, http_status: 422, applies_to: "POST /api/orders/{id}/submit" }
  - { priority: 17, category: business_temporal, check: "Technician holds the required certification (INSTALL for schedule-install, REPAIR for dispatch)", error_id: ERR_CERTIFICATION_MISSING, http_status: 422, applies_to: "POST /api/equipment-sales/{id}/schedule-install, POST /api/service-tickets/{id}/dispatch" }
  - { priority: 18, category: business_temporal, check: "Half-open interval overlap for the technician across SCHEDULED DispatchJobs and INSTALL_SCHEDULED install windows: conflict iff existing.start < new.end AND new.start < existing.end", error_id: ERR_TECHNICIAN_SCHEDULE_CONFLICT, http_status: 409, applies_to: "POST /api/equipment-sales/{id}/schedule-install" }
  - { priority: 19, category: business_temporal, check: "Closed-interval overlap at the practice install bay across other INSTALL_SCHEDULED sales: conflict iff new.start <= existing.end AND existing.start <= new.end (touching endpoints conflict)", error_id: ERR_INSTALL_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /api/equipment-sales/{id}/schedule-install" }
  - { priority: 20, category: business_temporal, check: "dispatch_technician_selection candidate pool is non-empty", error_id: ERR_TECHNICIAN_UNAVAILABLE, http_status: 409, applies_to: "POST /api/service-tickets/{id}/dispatch" }
  - { priority: 21, category: business_temporal, check: "Reopen within 30 days: logical clock now - resolved_at <= 30 days", error_id: ERR_REOPEN_WINDOW_EXPIRED, http_status: 422, applies_to: "POST /api/service-tickets/{id}/reopen" }
  - { priority: 22, category: business_referential, check: "Referenced order belongs to the claim's practice; ticket practice matches equipment sale practice", error_id: ERR_PRACTICE_MISMATCH, http_status: 422, applies_to: "POST /api/rebate-claims, POST /api/service-tickets" }
  - { priority: 23, category: business_referential, check: "No other non-DENIED RebateClaim exists for (order_id, promotion_id)", error_id: ERR_DUPLICATE_CLAIM, http_status: 409, applies_to: "POST /api/rebate-claims" }
  - { priority: 24, category: business_referential, check: "Referenced order is DELIVERED before a claim can be submitted", error_id: ERR_ORDER_NOT_DELIVERED, http_status: 409, applies_to: "POST /api/rebate-claims/{id}/submit" }
  - { priority: 25, category: business_referential, check: "Practice.status == ACTIVE for new commercial activity", error_id: ERR_PRACTICE_SUSPENDED, http_status: 409, applies_to: "POST /api/orders, POST /api/equipment-sales, POST /api/equipment-sales/{id}/confirm, POST /api/trade-ins" }
  - { priority: 26, category: business_referential, check: "EquipmentSale has no trade-in yet (at most one per sale)", error_id: ERR_TRADE_IN_ALREADY_APPLIED, http_status: 409, applies_to: "POST /api/trade-ins/{id}/apply-to-sale" }
  - { priority: 27, category: business_constraint, check: "Every parts_used entry is sufficiently stocked on the assigned technician's van", error_id: ERR_PARTS_NOT_ON_VAN, http_status: 422, applies_to: "POST /api/service-tickets/{id}/resolve" }
  - { priority: 28, category: business_fiscal, check: "total_cents <= Practice.credit_available_cents at submit", error_id: ERR_CREDIT_LIMIT_EXCEEDED, http_status: 422, applies_to: "POST /api/orders/{id}/submit" }
  - { priority: 29, category: business_fiscal, check: "Promotion.fund_remaining_cents >= claim_amount_cents at claim submit", error_id: ERR_REBATE_FUND_EXHAUSTED, http_status: 422, applies_to: "POST /api/rebate-claims/{id}/submit" }
  - { priority: 30, category: business_fiscal, check: "appraised_value_cents <= EquipmentSale.sale_price_cents when applying a trade-in", error_id: ERR_TRADE_IN_CREDIT_EXCEEDS_PRICE, http_status: 422, applies_to: "POST /api/trade-ins/{id}/apply-to-sale" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/api/practices", description: "Onboard a dental practice", roles: [DistributionAdmin], code: 201, input: [name, region, "practice_tier?", credit_limit_cents, "regulated_license_expiry?", "sterilization_compliant?"], output: Practice, side_effects: ["credit_available_cents initialized to credit_limit_cents"] }
  - { method: GET, path: "/api/practices/{id}", description: "Read a practice (PracticeManager restricted to own id)", roles: [DistributionAdmin, SalesRep, PracticeManager], code: 200, input: [], output: Practice, side_effects: [] }
  - { method: POST, path: "/api/practices/{id}/suspend", description: "Suspend a practice (credit hold)", roles: [DistributionAdmin], code: 200, input: [], output: Practice, side_effects: ["status -> SUSPENDED; Practice.version += 1"] }
  - { method: POST, path: "/api/practices/{id}/reinstate", description: "Reinstate a suspended practice", roles: [DistributionAdmin], code: 200, input: [], output: Practice, side_effects: ["status -> ACTIVE; Practice.version += 1"] }

  - { method: POST, path: "/api/products", description: "Create a catalog product", roles: [DistributionAdmin], code: 201, input: [sku, name, kind, unit_price_cents, manufacturer, "max_qty_per_order?", "sterilization_cycle_required?", "warranty_months?"], output: Product, side_effects: [] }
  - { method: GET, path: "/api/products/{id}", description: "Read a product", roles: [DistributionAdmin, SalesRep, PracticeManager, ServiceDispatcher, FieldTechnician, ManufacturerAgent], code: 200, input: [], output: Product, side_effects: [] }

  - { method: PUT, path: "/api/usage-profiles", description: "Create-or-supersede the usage profile for (practice_id, product_id); OCC-guarded on Practice.version", roles: [PracticeManager, SalesRep], code: 200, input: [practice_id, product_id, reorder_point, target_stock_level, "auto_replenish_enabled?", expected_practice_version], output: UsageProfile, side_effects: ["increments Practice.version by 1", "on create: on_hand_estimate = 0, average_daily_usage = 0, last_evaluated_at = logical clock now"] }
  - { method: GET, path: "/api/usage-profiles/{id}", description: "Read a usage profile", roles: [DistributionAdmin, SalesRep, PracticeManager], code: 200, input: [], output: UsageProfile, side_effects: [] }
  - { method: GET, path: "/api/usage-profiles", description: "List usage profiles (reverse-reachability for practice_id/product_id FKs); results ordered by created_at ASC, tie-break updated_at ASC", roles: [DistributionAdmin, SalesRep, PracticeManager], code: 200, input: ["practice_id?", "product_id?", "limit?", "offset?"], output: "UsageProfile[]", side_effects: [] }

  - { method: POST, path: "/api/orders", description: "Create an order (MANUAL, STARTUP, or BUNDLE) with inline lines; lines priced and totals computed", roles: [PracticeManager, SalesRep], code: 201, input: [practice_id, kind, "promotion_id?", lines], output: Order, side_effects: ["order_volume_discount, bundle_discount, order_total computed", "line unit prices snapshotted from Product"] }
  - { method: GET, path: "/api/orders/{id}", description: "Read an order (PracticeManager restricted to own practice)", roles: [DistributionAdmin, SalesRep, PracticeManager], code: 200, input: [], output: Order, side_effects: [] }
  - { method: GET, path: "/api/orders", description: "List orders with filters; results ordered by created_at ASC, tie-break updated_at ASC", roles: [DistributionAdmin, SalesRep, PracticeManager], code: 200, input: ["practice_id?", "promotion_id?", "kind?", "limit?", "offset?"], output: "Order[]", side_effects: [] }
  - { method: POST, path: "/api/orders/{id}/submit", description: "Submit a DRAFT order; reserves practice credit", roles: [PracticeManager, SalesRep], code: 200, input: [], output: Order, side_effects: ["DRAFT -> SUBMITTED", "credit_available_cents -= total_cents", "Practice.version += 1"] }
  - { method: POST, path: "/api/orders/{id}/deliver", description: "Mark a SUBMITTED order delivered; runs the usage-profile and auto-reorder cascade", roles: [DistributionAdmin], code: 200, input: [], output: Order, side_effects: ["SUBMITTED -> DELIVERED", "delivered_at set", "UsageProfile on_hand_estimate/average_daily_usage updated", "AUTO DRAFT orders created per auto_reorder_quantity"] }
  - { method: POST, path: "/api/orders/{id}/cancel", description: "Cancel a DRAFT or SUBMITTED order; restores reserved credit", roles: [PracticeManager, SalesRep], code: 200, input: [], output: Order, side_effects: ["-> CANCELLED", "credit_available_cents += total_cents when cancelling from SUBMITTED", "Practice.version += 1"] }

  - { method: POST, path: "/api/_replenishment/run", description: "Ops-run sweep: accrue consumption on every UsageProfile (on_hand_accrual), then evaluate auto_reorder_quantity per profile; returns counts", roles: [DistributionAdmin], code: 200, input: [], output: { evaluated_profile_count: integer, created_order_ids: array }, side_effects: ["on_hand_accrual on all profiles", "AUTO DRAFT orders created where threshold breached"] }

  - { method: POST, path: "/api/equipment-sales", description: "Create an equipment sale quote", roles: [SalesRep], code: 201, input: [practice_id, product_id, sale_price_cents], output: EquipmentSale, side_effects: [] }
  - { method: GET, path: "/api/equipment-sales/{id}", description: "Read an equipment sale", roles: [DistributionAdmin, SalesRep, PracticeManager, ServiceDispatcher, FieldTechnician], code: 200, input: [], output: EquipmentSale, side_effects: [] }
  - { method: GET, path: "/api/equipment-sales", description: "List equipment sales with filters; results ordered by created_at ASC, tie-break updated_at ASC", roles: [DistributionAdmin, SalesRep, PracticeManager, ServiceDispatcher, FieldTechnician], code: 200, input: ["practice_id?", "product_id?", "installer_technician_id?", "trade_in_id?", "warranty_agreement_id?", "limit?", "offset?"], output: "EquipmentSale[]", side_effects: [] }
  - { method: POST, path: "/api/equipment-sales/{id}/confirm", description: "Confirm a quote into a sale", roles: [SalesRep], code: 200, input: [], output: EquipmentSale, side_effects: ["QUOTE -> CONFIRMED"] }
  - { method: POST, path: "/api/equipment-sales/{id}/schedule-install", description: "Schedule (or re-schedule for rework) the installation window with an explicit technician", roles: [SalesRep], code: 200, input: [technician_id, window_start, window_end], output: EquipmentSale, side_effects: ["CONFIRMED -> INSTALL_SCHEDULED, or INSTALLED -> INSTALL_SCHEDULED with install_rework_count += 1"] }
  - { method: POST, path: "/api/equipment-sales/{id}/complete-install", description: "Assigned technician marks installation complete", roles: [FieldTechnician], code: 200, input: [], output: EquipmentSale, side_effects: ["INSTALL_SCHEDULED -> INSTALLED"] }
  - { method: POST, path: "/api/equipment-sales/{id}/complete-training", description: "Assigned technician records delivered training", roles: [FieldTechnician], code: 200, input: [training_minutes], output: EquipmentSale, side_effects: ["INSTALLED -> TRAINED"] }
  - { method: POST, path: "/api/equipment-sales/{id}/accept", description: "Practice accepts the installation; spawns the manufacturer warranty", roles: [PracticeManager], code: 200, input: [], output: EquipmentSale, side_effects: ["TRAINED -> ACCEPTED", "create WARRANTY CoverageAgreement", "warranty_agreement_id set"] }

  - { method: POST, path: "/api/technicians", description: "Onboard a field technician", roles: [DistributionAdmin], code: 201, input: [name, region, certifications, "status?"], output: Technician, side_effects: [] }
  - { method: GET, path: "/api/technicians/{id}", description: "Read a technician including van_stock", roles: [DistributionAdmin, SalesRep, ServiceDispatcher, FieldTechnician], code: 200, input: [], output: Technician, side_effects: [] }
  - { method: PUT, path: "/api/technicians/{id}/van-stock", description: "Load or adjust one part line on the technician's van (upsert by product_id)", roles: [DistributionAdmin], code: 200, input: [product_id, quantity_on_van, min_quantity], output: Technician, side_effects: ["van_stock entry created or overwritten"] }

  - { method: POST, path: "/api/service-tickets", description: "Open a service ticket against accepted equipment", roles: [PracticeManager, ServiceDispatcher], code: 201, input: [practice_id, equipment_sale_id, issue_description], output: ServiceTicket, side_effects: [] }
  - { method: GET, path: "/api/service-tickets/{id}", description: "Read a service ticket", roles: [DistributionAdmin, ServiceDispatcher, PracticeManager, FieldTechnician], code: 200, input: [], output: ServiceTicket, side_effects: [] }
  - { method: GET, path: "/api/service-tickets", description: "List service tickets with filters; results ordered by created_at ASC, tie-break updated_at ASC", roles: [DistributionAdmin, ServiceDispatcher, PracticeManager, FieldTechnician], code: 200, input: ["practice_id?", "equipment_sale_id?", "coverage_agreement_id?", "limit?", "offset?"], output: "ServiceTicket[]", side_effects: [] }
  - { method: POST, path: "/api/service-tickets/{id}/assess-coverage", description: "Determine coverage: WARRANTY or SERVICE_PLAN -> COVERAGE_ASSESSED; BILLABLE -> AWAITING_APPROVAL", roles: [ServiceDispatcher], code: 200, input: [], output: ServiceTicket, side_effects: ["coverage_determination calculation", "lazy expiry of agreements", "estimate_cents = 7500 when BILLABLE"] }
  - { method: POST, path: "/api/service-tickets/{id}/approve-estimate", description: "Practice approves the billable estimate", roles: [PracticeManager], code: 200, input: [], output: ServiceTicket, side_effects: ["AWAITING_APPROVAL -> COVERAGE_ASSESSED"] }
  - { method: POST, path: "/api/service-tickets/{id}/dispatch", description: "Select a technician by selector policy and create a DispatchJob", roles: [ServiceDispatcher], code: 200, input: [scheduled_start, scheduled_end], output: DispatchJob, side_effects: ["COVERAGE_ASSESSED -> DISPATCHED", "DispatchJob created SCHEDULED"] }
  - { method: POST, path: "/api/service-tickets/{id}/resolve", description: "Assigned technician resolves the ticket with parts and labor", roles: [FieldTechnician], code: 200, input: [parts_used, labor_minutes], output: ServiceTicket, side_effects: ["DISPATCHED -> RESOLVED", "van_stock debited", "repair_cost computed", "plan used_cents debited", "DispatchJob -> COMPLETED"] }
  - { method: POST, path: "/api/service-tickets/{id}/reopen", description: "Reopen a resolved ticket within 30 days; compensates parts and plan usage", roles: [PracticeManager, ServiceDispatcher], code: 200, input: [], output: ServiceTicket, side_effects: ["RESOLVED -> OPEN", "van_stock restored", "used_cents credited", "coverage fields cleared"] }
  - { method: POST, path: "/api/service-tickets/{id}/close", description: "Close a resolved ticket", roles: [PracticeManager, ServiceDispatcher], code: 200, input: [], output: ServiceTicket, side_effects: ["RESOLVED -> CLOSED"] }

  - { method: GET, path: "/api/dispatch-jobs/{id}", description: "Read a dispatch job", roles: [DistributionAdmin, ServiceDispatcher, FieldTechnician], code: 200, input: [], output: DispatchJob, side_effects: [] }
  - { method: GET, path: "/api/dispatch-jobs", description: "List dispatch jobs with filters; results ordered by created_at ASC, tie-break updated_at ASC", roles: [DistributionAdmin, ServiceDispatcher, FieldTechnician], code: 200, input: ["service_ticket_id?", "technician_id?", "limit?", "offset?"], output: "DispatchJob[]", side_effects: [] }

  - { method: POST, path: "/api/coverage-agreements", description: "Sell/register a SERVICE_PLAN coverage agreement (WARRANTY rows are system-created by equipment accept)", roles: [SalesRep], code: 201, input: [practice_id, equipment_sale_id, coverage_type, start_date, end_date, "deductible_cents?", "coverage_cap_cents?"], output: CoverageAgreement, side_effects: [] }
  - { method: GET, path: "/api/coverage-agreements/{id}", description: "Read a coverage agreement (applies lazy expiry)", roles: [DistributionAdmin, SalesRep, ServiceDispatcher, PracticeManager], code: 200, input: [], output: CoverageAgreement, side_effects: ["lazy EXPIRED flip when now > end_date"] }
  - { method: GET, path: "/api/coverage-agreements", description: "List coverage agreements with filters; results ordered by created_at ASC, tie-break updated_at ASC", roles: [DistributionAdmin, SalesRep, ServiceDispatcher, PracticeManager], code: 200, input: ["practice_id?", "equipment_sale_id?", "limit?", "offset?"], output: "CoverageAgreement[]", side_effects: [] }

  - { method: POST, path: "/api/promotions", description: "Create a promotion program (bundle discount or manufacturer rebate)", roles: [DistributionAdmin], code: 201, input: [name, promo_kind, "required_product_ids?", "eligible_product_ids?", "discount_pct?", "max_discount_cents?", "rebate_per_unit_cents?", "stacking_allowed?", "fund_total_cents?", start_date, end_date], output: Promotion, side_effects: ["fund_remaining_cents initialized to fund_total_cents for MANUFACTURER_REBATE"] }
  - { method: GET, path: "/api/promotions/{id}", description: "Read a promotion (applies lazy expiry)", roles: [DistributionAdmin, SalesRep, PracticeManager, ServiceDispatcher, ManufacturerAgent], code: 200, input: [], output: Promotion, side_effects: ["lazy EXPIRED flip when now > end_date"] }

  - { method: POST, path: "/api/rebate-claims", description: "File a manufacturer rebate claim against an order; amount computed per rebate_payout", roles: [PracticeManager], code: 201, input: [practice_id, order_id, promotion_id], output: RebateClaim, side_effects: ["rebate_payout computed"] }
  - { method: GET, path: "/api/rebate-claims/{id}", description: "Read a rebate claim", roles: [DistributionAdmin, PracticeManager, ManufacturerAgent], code: 200, input: [], output: RebateClaim, side_effects: [] }
  - { method: GET, path: "/api/rebate-claims", description: "List rebate claims with filters; results ordered by created_at ASC, tie-break updated_at ASC", roles: [DistributionAdmin, PracticeManager, ManufacturerAgent], code: 200, input: ["practice_id?", "order_id?", "promotion_id?", "limit?", "offset?"], output: "RebateClaim[]", side_effects: [] }
  - { method: POST, path: "/api/rebate-claims/{id}/submit", description: "Submit a claim to the manufacturer; reserves promotion funds", roles: [PracticeManager], code: 200, input: [], output: RebateClaim, side_effects: ["DRAFT -> SUBMITTED", "fund_remaining_cents -= claim_amount_cents", "promotion EXHAUSTED at <= 0"] }
  - { method: POST, path: "/api/rebate-claims/{id}/revise", description: "Return a DENIED claim to DRAFT for correction (resubmission cycle)", roles: [PracticeManager], code: 200, input: [revision_note], output: RebateClaim, side_effects: ["DENIED -> DRAFT"] }
  - { method: POST, path: "/api/rebate-claims/{id}/deny", description: "Manufacturer denies a submitted claim; releases reserved funds", roles: [ManufacturerAgent], code: 200, input: [denial_reason], output: RebateClaim, side_effects: ["SUBMITTED -> DENIED", "fund_remaining_cents += claim_amount_cents", "EXHAUSTED promotion may return to ACTIVE"] }
  - { method: POST, path: "/api/rebate-claims/{id}/settle", description: "Manufacturer pays a submitted claim", roles: [ManufacturerAgent], code: 200, input: [], output: RebateClaim, side_effects: ["SUBMITTED -> PAID", "paid_at set"] }

  - { method: POST, path: "/api/trade-ins", description: "Request an equipment trade-in", roles: [PracticeManager, SalesRep], code: 201, input: [practice_id, description, equipment_age_months, condition, category_base_value_cents], output: TradeIn, side_effects: [] }
  - { method: GET, path: "/api/trade-ins/{id}", description: "Read a trade-in", roles: [DistributionAdmin, SalesRep, PracticeManager], code: 200, input: [], output: TradeIn, side_effects: [] }
  - { method: GET, path: "/api/trade-ins", description: "List trade-ins with filters; results ordered by created_at ASC, tie-break updated_at ASC", roles: [DistributionAdmin, SalesRep, PracticeManager], code: 200, input: ["practice_id?", "applied_to_equipment_sale_id?", "limit?", "offset?"], output: "TradeIn[]", side_effects: [] }
  - { method: POST, path: "/api/trade-ins/{id}/appraise", description: "SalesRep appraises under MARKET_VALUE or SCRAP_VALUE", roles: [SalesRep], code: 200, input: [valuation_method], output: TradeIn, side_effects: ["REQUESTED -> APPRAISED", "appraised_value_cents computed"] }
  - { method: POST, path: "/api/trade-ins/{id}/accept", description: "Practice accepts the appraisal", roles: [PracticeManager], code: 200, input: [], output: TradeIn, side_effects: ["APPRAISED -> ACCEPTED"] }
  - { method: POST, path: "/api/trade-ins/{id}/apply-to-sale", description: "Apply the accepted trade-in credit to an open equipment sale", roles: [SalesRep], code: 200, input: [equipment_sale_id], output: TradeIn, side_effects: ["ACCEPTED -> CREDITED", "EquipmentSale.trade_in_id and trade_in_credit_cents set"] }
  - { method: POST, path: "/api/trade-ins/{id}/dispose", description: "Record final disposal of the traded equipment", roles: [DistributionAdmin], code: 200, input: [disposal_method], output: TradeIn, side_effects: ["CREDITED -> DISPOSED"] }

  - { method: POST, path: "/api/_clock/set_current_utc", description: "Set the server's logical clock (test-driving endpoint). Startup default before any call is exactly 2026-08-01T00:00:00Z; the logical clock never falls back to wall-clock time.", roles: [DistributionAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["logical clock advanced"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on the endpoint, or entity-backed ownership check failed (PracticeManager on another practice's resource; FieldTechnician on another technician's assignment)" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "Path id or body foreign key does not reference an existing resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, non-positive quantity, malformed datetime, window_end <= window_start, or client-supplied order kind AUTO" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition does not exist from the resource's current state (including all transitions from terminal states)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_practice_version does not equal the Practice's current version (OCC)" }
  - { id: ERR_REGULATED_LICENSE_MISSING, http: 422, condition: "Order contains a REGULATED line and the practice's regulated license is missing or expired at logical clock now" }
  - { id: ERR_STERILIZATION_NOT_CERTIFIED, http: 422, condition: "Order contains a sterilization_cycle_required product and the practice is not sterilization compliant" }
  - { id: ERR_REGULATED_QTY_LIMIT, http: 422, condition: "REGULATED line quantity exceeds Product.max_qty_per_order" }
  - { id: ERR_EQUIPMENT_NOT_ORDERABLE, http: 422, condition: "Order of kind MANUAL/AUTO/BUNDLE contains an EQUIPMENT line" }
  - { id: ERR_STARTUP_WINDOW_EXPIRED, http: 422, condition: "STARTUP order attempted more than 90 days after practice creation" }
  - { id: ERR_STARTUP_PACKAGE_LIMIT, http: 409, condition: "Practice already has a non-CANCELLED STARTUP order" }
  - { id: ERR_REORDER_TARGET_INVALID, http: 422, condition: "target_stock_level <= reorder_point, or usage-profile product is not CONSUMABLE/REGULATED" }
  - { id: ERR_PROMOTION_INACTIVE, http: 422, condition: "Promotion is EXPIRED/EXHAUSTED or logical clock now is outside [start_date, end_date]" }
  - { id: ERR_PROMOTION_NOT_APPLICABLE, http: 422, condition: "Promotion kind mismatched: BUNDLE_DISCOUNT on a claim, or MANUFACTURER_REBATE on an order" }
  - { id: ERR_BUNDLE_INCOMPLETE, http: 422, condition: "BUNDLE order submit lacks one or more required bundle products" }
  - { id: ERR_CERTIFICATION_MISSING, http: 422, condition: "Technician lacks the required certification (INSTALL or REPAIR)" }
  - { id: ERR_TECHNICIAN_SCHEDULE_CONFLICT, http: 409, condition: "Half-open overlap on the technician's existing SCHEDULED jobs or install windows" }
  - { id: ERR_INSTALL_WINDOW_CONFLICT, http: 409, condition: "Closed-interval overlap with another install scheduled at the same practice (touching endpoints conflict)" }
  - { id: ERR_TECHNICIAN_UNAVAILABLE, http: 409, condition: "Dispatch selector pool is empty (no eligible/free technician)" }
  - { id: ERR_REOPEN_WINDOW_EXPIRED, http: 422, condition: "Reopen attempted more than 30 days after resolved_at" }
  - { id: ERR_PRACTICE_MISMATCH, http: 422, condition: "Referenced resource belongs to a different practice (claim vs order, ticket vs equipment sale)" }
  - { id: ERR_DUPLICATE_CLAIM, http: 409, condition: "A non-DENIED claim already exists for (order_id, promotion_id)" }
  - { id: ERR_ORDER_NOT_DELIVERED, http: 409, condition: "Claim submit while the referenced order is not DELIVERED" }
  - { id: ERR_PRACTICE_SUSPENDED, http: 409, condition: "Practice is SUSPENDED; new commercial activity blocked" }
  - { id: ERR_TRADE_IN_ALREADY_APPLIED, http: 409, condition: "Equipment sale already carries a trade-in credit" }
  - { id: ERR_PARTS_NOT_ON_VAN, http: 422, condition: "Resolve lists parts exceeding the assigned technician's van stock" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 422, condition: "Order total exceeds the practice's available credit at submit" }
  - { id: ERR_REBATE_FUND_EXHAUSTED, http: 422, condition: "Promotion fund_remaining_cents is below the claim amount at submit" }
  - { id: ERR_TRADE_IN_CREDIT_EXCEEDS_PRICE, http: 422, condition: "Trade-in appraised value exceeds the equipment sale price" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DistributionAdmin
    description: "Distributor back-office operator: catalog, practices, promotions, technicians, warehouse delivery, replenishment runs, logical clock"
    identity: opaque
    exclusive_operations: [create/suspend/reinstate practices, create products, create promotions, create technicians, manage van stock, deliver orders, run replenishment, set logical clock, dispose trade-ins]
    shared_operations: [read any resource]
  - name: SalesRep
    description: "Distributor field sales representative: quotes, orders on behalf of practices, service plans, trade-in appraisals"
    identity: opaque
    exclusive_operations: [create/confirm/schedule equipment sales, create coverage agreements, appraise trade-ins, apply trade-ins to sales]
    shared_operations: [create/submit/cancel orders for any practice, upsert usage profiles, create trade-ins, read catalog and commercial resources]
  - name: PracticeManager
    description: "The dental practice's office manager; X-User-ID is the Practice id"
    identity: entity_backed:Practice
    exclusive_operations: [accept equipment sales, approve billable estimates, file/submit/revise rebate claims, accept trade-ins]
    shared_operations: [create/submit/cancel orders for own practice, upsert usage profiles for own practice, open service tickets for own practice, create trade-ins, read own resources]
  - name: ServiceDispatcher
    description: "Distributor service coordinator: coverage assessment and technician dispatch"
    identity: opaque
    exclusive_operations: [assess coverage, dispatch tickets]
    shared_operations: [open service tickets, reopen/close tickets, read service resources]
  - name: FieldTechnician
    description: "Field service/installation technician; X-User-ID is the Technician id"
    identity: entity_backed:Technician
    exclusive_operations: [complete installs, complete trainings, resolve assigned tickets]
    shared_operations: [read own dispatch jobs, read tickets and equipment sales]
  - name: ManufacturerAgent
    description: "Manufacturer representative adjudicating rebate claims"
    identity: opaque
    exclusive_operations: [deny rebate claims, settle rebate claims]
    shared_operations: [read rebate claims and promotions]
