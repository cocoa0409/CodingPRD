      - name: corner_layer_occ_stale_block_version_rejected
        claim_type: Stale expected_<parent>_version rejected
        grounds:
          - complexity_profile.complexity_layers[optimistic_concurrency]
          - concurrency_rules[stay-create-stale-block]
          - validations[priority=26]
          - validations[priority=72]
          - errors[ERR_STALE_BLOCK_VERSION]
          - endpoints[POST /senior-games/village-stays]
        distinguishing_aspect: "Ordering proof for the OCC layer: the stale expected_block_version is refused at priority 26 even when the SAME request also violates the priority-72 village window, and once the version is refreshed the identical out-of-window body finally answers ERR_STAY_OUTSIDE_VILLAGE_WINDOW — so the 412 was genuinely hiding a pending 422, not standing in for it. Neither refusal moves AccommodationBlock.reserved_bed_nights, and the guard fires while bed capacity still has room, which separates it from ERR_BLOCK_NIGHT_FULL at priority 78."
