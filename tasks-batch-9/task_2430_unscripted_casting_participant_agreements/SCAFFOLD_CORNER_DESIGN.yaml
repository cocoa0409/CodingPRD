              captures: { call_id: $.data.id }
            - call: "POST /casting/casting-calls/${call_id}/publish"
              payload: {}
              as: CastingDirector
          trigger:
            - call: "POST /casting/applicants"
              payload: { casting_call_id: "${call_id}", legal_name: "Mika Vance", date_of_birth: "2011-05-20", residency_state_code: "GA" }
              as: CastingDirector
              captures: { err_id: $.data.error_id }
            - call: "POST /casting/applicants"
