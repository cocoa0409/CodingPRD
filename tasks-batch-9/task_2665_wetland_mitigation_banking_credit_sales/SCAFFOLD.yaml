# ============================================================================
# SCAFFOLD.yaml — Wetland Mitigation Banking & Credit Sales
# Sections §1.0–§1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# ============================================================================

scenario: |
  Generate task harder than expert level!

  2665. Wetland Mitigation Banking & Credit Sales (mitigation bank sponsor): bank site selection,
  prospectus submission and interagency review team approval, mitigation work plan with hydrology
  restoration, planting and invasive control, credit release schedule tied to construction and
  performance milestones, service area definition limiting where credits may be sold, performance
  standard monitoring, remedial action and credit release deferral, ledger administration of credits
  generated, sold and remaining with permittee assignment, long-term stewardship funding and
  conservation easement recording, credit pricing and demand forecasting against permitting activity

domain_name: wetland-mitigation-banking
api_prefix: "/mitigation"

complexity_profile:
  difficulty_level: beyond_expert     # §0.4 Expert band deliberately exceeded per request
  primary_archetype: ledger_reconciliation
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  # Every entity is a peer collection at `/mitigation/<collection>`; parentage is expressed by
  # FK fields in request bodies, never by nested creation paths. Reads use flat filtered lists
  # plus a small number of computed sub-resource reads on MitigationBank.

  state_machine_shape: cyclic
  # Prospectus (REVISION_REQUESTED -> SUBMITTED) and RemedialAction (REINSPECTION -> OPEN) are true
  # cycles with round counters; MonitoringReport carries two independent state dimensions
  # (review_status x compliance_status); ReleaseMilestone forks CLAIMED -> {APPROVED, DEFERRED}
  # with disjoint side-effect sets; MitigationBank.sales_posture is a derived posture that gates
  # every CreditSale operation.

  relationship_patterns:
    - one_to_many          # MitigationBank -> Prospectus / WorkPlan / ReleaseMilestone / MonitoringReport / CreditLedgerEntry
    - self_referential     # ReleaseMilestone.predecessor_milestone_id -> ReleaseMilestone.id
    - polymorphic          # CreditLedgerEntry.source_entity_type + source_id
    - cross_aggregate      # CreditSale spans MitigationBank and Permittee aggregates
    - many_to_many         # ProspectusVote is the junction of Prospectus and IRTMember

  role_model: segregation_of_duties
  # The IRTMember who verifies a RemedialAction may never be the IRTMember who approves the release
  # of the milestone that action deferred; IRTChair finalizes but may never cast a ProspectusVote.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# §1.1 Entity-Relationship Table
# ============================================================================
entities:

  - name: Sponsor
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the mitigation bank sponsor.
        constraints: non-empty, max 160 chars
      - name: legal_entity_type
        type: enum
        source: input
        description: Sponsor category recognised by the interagency review team.
        constraints: "one of {PRIVATE_ENTREPRENEURIAL, PUBLIC_AGENCY, NGO}"
      - name: performance_bond_cents
        type: integer
        source: input
        default: 0
        description: Posted performance assurance in cents; gates instrument execution.
        constraints: ">= 0"
      - name: banks_count
        type: integer
        source: computed
        default: 0
        description: Count of MitigationBank rows whose sponsor_id equals this Sponsor.id, all statuses included.
      - name: good_standing
        type: boolean
        source: computed
        default: true
        description: "true iff COUNT(MitigationBank WHERE sponsor_id == this.id AND status == SUSPENDED) == 0."

  - name: Permittee
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: organization_name
        type: string
        source: input
        description: Name of the permit holder buying compensatory mitigation credits.
        constraints: non-empty, max 160 chars
      - name: permit_number
        type: string
        source: input
        description: Corps permit identifier; globally unique across Permittee rows.
        constraints: "non-empty, matches ^[A-Z]{3}-[0-9]{4}-[0-9]{5}$, unique"
      - name: impact_huc8_code
        type: string
        source: input
        description: HUC-8 watershed code where the authorised impacts occur.
        constraints: "matches ^[0-9]{8}$"
      - name: required_credits
        type: number
        source: input
        description: Total compensatory mitigation requirement in credits imposed by the permit.
        constraints: "> 0, 2 decimal places"
      - name: deposited_cents
        type: integer
        source: computed
        default: 0
        description: Cumulative sum of all escrow deposits recorded for this Permittee.
      - name: escrow_balance_cents
        type: integer
        source: computed
        default: 0
        description: "deposited_cents - SUM(CreditSale.executed_price_cents WHERE permittee_id == this.id AND status IN {EXECUTED, ASSIGNED})."
      - name: assigned_credits
        type: number
        source: computed
        default: 0
        description: "SUM(CreditSale.credits_requested WHERE permittee_id == this.id AND status == ASSIGNED)."
      - name: unmet_requirement_credits
        type: number
        source: computed
        description: "max(0, required_credits - assigned_credits), 2 decimal places."

  - name: IRTMember
    parent: null
    common_fields: true
    kind: configuration
    fields:
      - name: member_name
        type: string
        source: input
        description: Name of the seated interagency review team member.
        constraints: non-empty, max 120 chars
      - name: agency
        type: enum
        source: input
        description: Agency the member represents on the interagency review team.
        constraints: "one of {USACE, EPA, USFWS, STATE_DEQ, TRIBAL}; unique per agency is NOT enforced"
      - name: veto_authority
        type: boolean
        source: computed
        description: "true iff agency == USACE (the chartering agency holds veto power over a prospectus)."
      - name: roster_status
        type: enum
        source: input
        default: SEATED
        description: Roster participation state of the member.
        constraints: "one of {SEATED, RECUSED}"

  - name: MitigationBank
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: sponsor_id
        type: string
        source: input
        description: FK -> Sponsor.id; the sponsor that owns and operates this bank site.
      - name: site_name
        type: string
        source: input
        description: Name of the selected bank site.
        constraints: non-empty, max 160 chars
      - name: site_huc8_code
        type: string
        source: input
        description: HUC-8 watershed code the bank site physically sits in (the primary service-area watershed).
        constraints: "matches ^[0-9]{8}$"
      - name: service_area_huc8_codes
        type: array
        source: input
        description: "Explicit list of HUC-8 codes in which credits from this bank may be sold; MUST contain site_huc8_code."
        constraints: "array of ^[0-9]{8}$ strings, length 1..8, no duplicates"
      - name: hgm_class
        type: enum
        source: input
        description: Hydrogeomorphic class of the restored wetland; selects the base credit price.
        constraints: "one of {RIVERINE, DEPRESSIONAL, SLOPE, FLATS, ESTUARINE}"
      - name: annual_stewardship_cost_cents
        type: integer
        source: input
        description: Estimated annual long-term stewardship cost in cents; input to stewardship_endowment_requirement.
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Bank lifecycle state; see §1.2 MitigationBank state machine.
        constraints: "one of {DRAFT, PROSPECTUS_REVIEW, INSTRUMENT_EXECUTED, MONITORING, SUSPENDED, CLOSED}"
      - name: sales_posture
        type: enum
        source: computed
        default: FROZEN
        description: Derived posture gating every CreditSale operation; recomputed by credit_sales_posture (§1.3).
        constraints: "one of {OPEN, RESTRICTED, SOLD_OUT, FROZEN}"
      - name: total_authorized_credits
        type: number
        source: computed
        default: 0
        description: Credits authorised by the executed banking instrument; copied from the APPROVED WorkPlan.total_planned_credits at instrument execution.
      - name: credits_released
        type: number
        source: computed
        default: 0
        description: "SUM(CreditLedgerEntry.delta_credits WHERE bank_id == this.id AND entry_type == RELEASED)."
      - name: credits_sold
        type: number
        source: computed
        default: 0
        description: "-1 * SUM(CreditLedgerEntry.delta_credits WHERE bank_id == this.id AND entry_type IN {SOLD, SALE_REVERSED})."
      - name: credits_on_hold
        type: number
        source: computed
        default: 0
        description: "-1 * SUM(CreditLedgerEntry.delta_credits WHERE bank_id == this.id AND entry_type IN {HOLD_PLACED, HOLD_RELEASED})."
      - name: credits_available
        type: number
        source: computed
        default: 0
        description: "credits_released - credits_sold - credits_on_hold; equals balance_after of this bank's highest sequence_number CreditLedgerEntry."
      - name: stewardship_required_cents
        type: integer
        source: computed
        default: 0
        description: Non-wasting endowment requirement in cents from stewardship_endowment_requirement (§1.3).
      - name: stewardship_funded_cents
        type: integer
        source: computed
        default: 0
        description: Cumulative sum of stewardship contributions recorded against this bank.
      - name: easement_recorded
        type: boolean
        source: computed
        default: false
        description: true once a conservation easement deed reference has been recorded for the site.
      - name: easement_recorded_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant at which the conservation easement was recorded; null until recorded.
      - name: easement_deed_reference
        type: string
        source: computed
        default: null
        description: Recorded deed book/page reference for the conservation easement; null until recorded.
      - name: deferral_count
        type: integer
        source: computed
        default: 0
        description: Number of times a ReleaseMilestone on this bank has entered DEFERRED.
      - name: open_quote_count
        type: integer
        source: computed
        default: 0
        description: "COUNT(CreditSale WHERE bank_id == this.id AND status IN {QUOTED, RESERVED})."
      - name: instrument_executed_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant the banking instrument was executed; null before execution.
      - name: closed_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant the bank reached CLOSED; null otherwise.

  - name: Prospectus
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: bank_id
        type: string
        source: input
        description: FK -> MitigationBank.id; the bank site this prospectus proposes.
      - name: objective_summary
        type: string
        source: input
        description: Narrative of restoration objectives, site selection rationale and watershed needs.
        constraints: non-empty, max 2000 chars
      - name: proposed_credits
        type: number
        source: input
        description: Credits the sponsor proposes to generate; informational, never the authorised total.
        constraints: "> 0, 2 decimal places"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Prospectus review state; see §1.2 Prospectus state machine.
        constraints: "one of {DRAFT, SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, APPROVED, REJECTED}"
      - name: revision_round
        type: integer
        source: computed
        default: 1
        description: One-based review round; stamped 1 at creation and incremented each time the IRT requests a revision, so at most one revision cycle is possible.
        constraints: "1..2 (MAX_REVISION_ROUNDS = 2)"
      - name: submitted_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant of the most recent submission of this prospectus.
      - name: review_opened_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant the first vote of the current revision_round was cast.
      - name: concur_count
        type: integer
        source: computed
        default: 0
        description: "COUNT(ProspectusVote WHERE prospectus_id == this.id AND revision_round == this.revision_round AND position == CONCUR)."
      - name: object_count
        type: integer
        source: computed
        default: 0
        description: "COUNT(ProspectusVote WHERE prospectus_id == this.id AND revision_round == this.revision_round AND position == OBJECT)."
      - name: abstain_count
        type: integer
        source: computed
        default: 0
        description: "COUNT(ProspectusVote WHERE prospectus_id == this.id AND revision_round == this.revision_round AND position == ABSTAIN)."
      - name: veto_recorded
        type: boolean
        source: computed
        default: false
        description: "true iff any ProspectusVote for this prospectus and this revision_round has is_veto == true."
      - name: decision_recorded_by
        type: string
        source: computed
        default: null
        description: Opaque X-User-ID of the IRTChair that finalized the most recent review round; null before finalization.
      - name: decided_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant of the most recent finalization of this prospectus.

  - name: ProspectusVote
    parent: null
    common_fields: false
    kind: event
    fields:
      - name: prospectus_id
        type: string
        source: input
        description: FK -> Prospectus.id; the prospectus being voted on.
      - name: irt_member_id
        type: string
        source: input
        description: FK -> IRTMember.id; the member casting the vote.
      - name: revision_round
        type: integer
        source: computed
        description: Copy of Prospectus.revision_round at cast time; votes are scoped to a single round.
      - name: position
        type: enum
        source: input
        description: The member's recorded position for this round.
        constraints: "one of {CONCUR, OBJECT, ABSTAIN}"
      - name: comment
        type: string
        source: input
        default: null
        description: Optional written comment supporting the position.
        constraints: max 1000 chars
      - name: is_veto
        type: boolean
        source: computed
        description: "true iff position == OBJECT AND the casting IRTMember.veto_authority == true."

  - name: WorkPlan
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: bank_id
        type: string
        source: input
        description: FK -> MitigationBank.id; the bank whose mitigation work this plan specifies.
      - name: hydrology_restoration_acres
        type: number
        source: input
        description: Acres subject to hydrologic restoration (ditch plugging, tile breaking, microtopography).
        constraints: ">= 0, 2 decimal places"
      - name: planting_acres
        type: number
        source: input
        description: Acres subject to native woody and herbaceous planting.
        constraints: ">= 0, 2 decimal places"
      - name: invasive_control_acres
        type: number
        source: input
        description: Acres under the invasive species control regime.
        constraints: ">= 0, 2 decimal places"
      - name: invasive_control_protocol
        type: enum
        source: input
        description: Control regime committed to for invasive species.
        constraints: "one of {MECHANICAL, HERBICIDE, INTEGRATED}"
      - name: credit_strata
        type: array
        source: input
        description: "Array of objects {stratum_code, acres, lift_factor}: the functional-lift strata that generate credits."
        constraints: "length 1..6; stratum_code one of {UPLAND_BUFFER, EMERGENT_MARSH, FORESTED_WETLAND, SCRUB_SHRUB, OPEN_WATER}, unique per plan; acres > 0 with 2 decimals; 0 < lift_factor <= 1 with 3 decimals"
      - name: performance_standards
        type: array
        source: input
        description: "Array of objects {standard_code, comparator, threshold_value, weight, effective_from_year} materialised into PerformanceStandard rows when the plan is APPROVED."
        constraints: "length 1..6; SUM(weight) == 1.000; standard_code unique per plan"
      - name: total_planned_credits
        type: number
        source: computed
        description: Output of work_plan_credit_yield (§1.3) — per-stratum rounding then summation.
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Work plan review state; see §1.2 WorkPlan state machine.
        constraints: "one of {DRAFT, SUBMITTED, APPROVED, RETURNED}"
      - name: submitted_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant of submission to the IRT.
      - name: decided_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant of the IRTChair decision.
      - name: return_reason
        type: string
        source: computed
        default: null
        description: Reason text supplied by the IRTChair when the plan was RETURNED; null otherwise.

  - name: PerformanceStandard
    parent: null
    common_fields: true
    kind: configuration
    fields:
      - name: bank_id
        type: string
        source: input
        description: FK -> MitigationBank.id; the bank this ecological performance standard binds.
      - name: standard_code
        type: enum
        source: input
        description: The measured ecological attribute.
        constraints: "one of {HYDROPERIOD_DAYS, INVASIVE_COVER_PCT, NATIVE_COVER_PCT, STEM_DENSITY_PER_ACRE}; unique per bank_id"
      - name: comparator
        type: enum
        source: input
        description: Direction of attainment; GTE means measured >= threshold is met, LTE means measured <= threshold is met.
        constraints: "one of {GTE, LTE}"
      - name: threshold_value
        type: number
        source: input
        description: Numeric threshold the measurement is compared against.
        constraints: "> 0"
      - name: weight
        type: number
        source: input
        description: Weight of this standard inside performance_attainment_score.
        constraints: "> 0, 3 decimal places, weights of one bank sum to 1.000"
      - name: effective_from_year
        type: integer
        source: input
        description: First monitoring_year in which this standard is evaluated.
        constraints: ">= 1"

  - name: ReleaseMilestone
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: bank_id
        type: string
        source: input
        description: FK -> MitigationBank.id; the bank whose credit release schedule this milestone belongs to.
      - name: predecessor_milestone_id
        type: string
        source: input
        default: null
        description: "FK -> ReleaseMilestone.id; self-referential predecessor that MUST be APPROVED before this milestone may be claimed. null for the first milestone of a bank."
      - name: milestone_code
        type: enum
        source: input
        description: Construction or performance milestone this release is tied to.
        constraints: "one of {INSTRUMENT_EXECUTION, CONSTRUCTION_COMPLETE, PERF_YEAR_3, PERF_YEAR_5, PERF_YEAR_10}; unique per bank_id"
      - name: release_pct
        type: number
        source: input
        description: Fraction of total_authorized_credits released when this milestone is approved.
        constraints: "> 0 and <= 1, 3 decimal places; SUM(release_pct) over a bank's milestones <= 1.000"
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the performance window during which this milestone may be claimed.
      - name: window_end
        type: datetime
        source: input
        description: Exclusive end of the performance window; window_end MUST be strictly after window_start.
      - name: status
        type: enum
        source: system
        default: PENDING
        description: Milestone state; see §1.2 ReleaseMilestone state machine.
        constraints: "one of {PENDING, CLAIMED, APPROVED, DEFERRED}"
      - name: provisional_release_credits
        type: number
        source: computed
        default: 0
        description: PROVISIONAL variant of milestone_credit_release (§1.3), stamped at claim time.
      - name: final_release_credits
        type: number
        source: computed
        default: 0
        description: FINAL variant of milestone_credit_release (§1.3), stamped at release approval; 0 until approved.
      - name: attainment_factor_applied
        type: number
        source: computed
        default: null
        description: The attainment factor (1.00 or 0.90) actually applied by the FINAL variant; null until approved.
      - name: claimed_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant the sponsor claimed this milestone.
      - name: approved_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant the release was approved.
      - name: deferred_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant the release was most recently deferred.

  - name: MonitoringReport
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: bank_id
        type: string
        source: input
        description: FK -> MitigationBank.id; the bank monitored by this report.
      - name: monitoring_year
        type: integer
        source: input
        description: Monitoring year the report covers; selects which PerformanceStandard rows are evaluated.
        constraints: ">= 1; unique per bank_id across reports whose review_status IN {DRAFT, SUBMITTED, ACCEPTED}"
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the field monitoring window covered by this report.
      - name: window_end
        type: datetime
        source: input
        description: Exclusive end of the field monitoring window; half-open interval semantics.
      - name: measurements
        type: array
        source: input
        description: "Array of objects {standard_code, measured_value} — one entry per PerformanceStandard evaluated this year."
        constraints: "length 1..6; standard_code unique within the array; measured_value >= 0"
      - name: review_status
        type: enum
        source: system
        default: DRAFT
        description: First state dimension — IRT review track. Evolves independently of compliance_status.
        constraints: "one of {DRAFT, SUBMITTED, ACCEPTED, RETURNED}"
      - name: compliance_status
        type: enum
        source: system
        default: UNEVALUATED
        description: Second state dimension — ecological compliance track, written only when the report is ACCEPTED.
        constraints: "one of {UNEVALUATED, PASS, PARTIAL, FAIL}"
      - name: attainment_score
        type: number
        source: computed
        default: null
        description: Output of performance_attainment_score (§1.3), 4 decimal places; null until ACCEPTED.
      - name: failed_standard_codes
        type: array
        source: computed
        default: []
        description: standard_code values not met by this report, ordered by standard_code ASC; empty until ACCEPTED.
      - name: reviewed_by_member_id
        type: string
        source: computed
        default: null
        description: FK -> IRTMember.id; the member who accepted or returned this report. null before review.
      - name: submitted_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant of the most recent submission.
      - name: reviewed_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant of the most recent IRT review decision.
      - name: return_count
        type: integer
        source: computed
        default: 0
        description: Number of times this report has been RETURNED to the sponsor.

  - name: RemedialAction
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: monitoring_report_id
        type: string
        source: computed
        description: FK -> MonitoringReport.id; the FAIL report that caused this remedial action to be opened.
      - name: deferred_milestone_id
        type: string
        source: computed
        default: null
        description: "FK -> ReleaseMilestone.id; the milestone whose release this action deferred. null when the bank had no non-terminal milestone to defer."
      - name: verified_by_member_id
        type: string
        source: computed
        default: null
        description: FK -> IRTMember.id; the member who performed the clearing reinspection. null until CLEARED.
      - name: status
        type: enum
        source: system
        default: OPEN
        description: Remedial action state; see §1.2 RemedialAction state machine.
        constraints: "one of {OPEN, WORK_SUBMITTED, REINSPECTION, CLEARED, FAILED}"
      - name: round_number
        type: integer
        source: computed
        default: 1
        description: Remediation round; incremented each time a reinspection is not cleared.
        constraints: "1..3 (MAX_REMEDIAL_ROUNDS = 3)"
      - name: corrective_scope
        type: string
        source: computed
        description: "Auto-generated scope text listing the failed standard codes, format: 'REMEDIATE: <code>,<code>'."
      - name: held_credits
        type: number
        source: computed
        default: 0
        description: "Credits frozen by this action: MitigationBank.credits_released - MitigationBank.credits_sold evaluated when the action was created, or 0.00 when the deferred milestone had never been claimed. Restored by the HOLD_RELEASED entry when the action clears."
      - name: due_at
        type: datetime
        source: computed
        description: Logical clock at opening plus REMEDIAL_DUE_DAYS (365) days.
      - name: opened_at
        type: datetime
        source: computed
        description: Logical-clock instant the action was opened by the cascade.
      - name: work_submitted_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant of the most recent corrective-work submission.
      - name: cleared_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant the action reached CLEARED; null otherwise.

  - name: CreditSale
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: bank_id
        type: string
        source: input
        description: FK -> MitigationBank.id; the bank whose credits are being sold.
      - name: permittee_id
        type: string
        source: input
        description: FK -> Permittee.id; the permit holder purchasing the credits.
      - name: credits_requested
        type: number
        source: input
        description: Credits requested by the permittee.
        constraints: "> 0, 2 decimal places"
      - name: impact_huc8_code
        type: string
        source: input
        description: HUC-8 code of the impact site the credits will compensate; must fall inside the bank's service area.
        constraints: "matches ^[0-9]{8}$"
      - name: service_area_tier
        type: enum
        source: computed
        description: "PRIMARY when impact_huc8_code == bank.site_huc8_code, SECONDARY when it is another member of bank.service_area_huc8_codes."
        constraints: "one of {PRIMARY, SECONDARY}"
      - name: status
        type: enum
        source: system
        default: QUOTED
        description: Sale state; see §1.2 CreditSale state machine.
        constraints: "one of {QUOTED, RESERVED, EXECUTED, ASSIGNED, CANCELLED, EXPIRED}"
      - name: quoted_demand_index
        type: number
        source: computed
        description: service_area_demand_index (§1.3) evaluated at quote time, 4 decimal places.
      - name: quoted_price_cents
        type: integer
        source: computed
        description: QUOTED variant of credit_sale_price (§1.3), stamped at quote creation.
      - name: executed_price_cents
        type: integer
        source: computed
        default: null
        description: EXECUTED variant of credit_sale_price (§1.3), stamped at execution; null before execution.
      - name: hold_start_at
        type: datetime
        source: computed
        default: null
        description: Inclusive start of the reservation hold interval; null until RESERVED.
      - name: hold_expires_at
        type: datetime
        source: computed
        default: null
        description: Inclusive end of the reservation hold interval (hold_start_at + RESERVATION_HOLD_DAYS); null until RESERVED.
      - name: executed_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant of execution; the quarter this falls in feeds service_area_demand_index.
      - name: assigned_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant the credits were assigned to the permittee's permit.
      - name: assignment_reference
        type: string
        source: computed
        default: null
        description: "Assignment reference stamped at assignment, format '<permit_number>/<bank site_huc8_code>/<credits_requested>'."
      - name: cancelled_reason
        type: enum
        source: computed
        default: null
        description: Why the sale left the active path; null while active.
        constraints: "one of {BUYER_WITHDREW, SPONSOR_WITHDREW, BANK_POSTURE_RESTRICTED, HOLD_EXPIRED, IRT_REVERSAL}"
      - name: cancelled_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant the sale was cancelled, expired or reversed.

  - name: CreditLedgerEntry
    parent: null
    common_fields: false
    kind: event
    fields:
      - name: bank_id
        type: string
        source: computed
        description: FK -> MitigationBank.id; the bank ledger this immutable entry belongs to.
      - name: sequence_number
        type: integer
        source: computed
        description: Per-bank monotonically increasing sequence starting at 1; assigned in append order.
      - name: entry_type
        type: enum
        source: computed
        description: Ledger event class.
        constraints: "one of {GENERATED, RELEASED, HOLD_PLACED, HOLD_RELEASED, SOLD, SALE_REVERSED, ASSIGNED}"
      - name: delta_credits
        type: number
        source: computed
        description: "Signed change to credits_available: RELEASED +credits, HOLD_PLACED -credits, HOLD_RELEASED +credits, SOLD -credits, SALE_REVERSED +credits, GENERATED 0, ASSIGNED 0."
      - name: balance_after
        type: number
        source: computed
        description: credits_available immediately after this entry was appended (running accumulator over sequence_number ASC).
      - name: source_entity_type
        type: enum
        source: computed
        description: Polymorphic discriminator naming the entity that caused this entry.
        constraints: "one of {MITIGATION_BANK, RELEASE_MILESTONE, CREDIT_SALE, REMEDIAL_ACTION}"
      - name: source_id
        type: string
        source: computed
        description: "Polymorphic id of the causing row, resolved against source_entity_type (NOT an FK-prefixed field; no reverse-reachability contract)."
      - name: memo
        type: string
        source: computed
        description: Human-readable memo, e.g. 'RELEASE PERF_YEAR_3 factor=0.90'.

# ============================================================================
# §1.2 State Machine Table
# ============================================================================
state_machines:

  - entity: MitigationBank
    initial_state: DRAFT
    terminal_states: [CLOSED]
    shape: compound_posture_driven
    note: |
      MitigationBank.status is advanced almost entirely by side effects of writes on other entities.
      Orthogonally, sales_posture is a DERIVED field (never written directly) recomputed by
      credit_sales_posture (§1.3) after every mutation that touches status, credits_on_hold,
      credits_available, easement_recorded, or the set of non-terminal RemedialAction rows.
    transitions:
      - from: DRAFT
        to: PROSPECTUS_REVIEW
        trigger: "POST /mitigation/prospectuses/{id}/submit (side effect on the referenced bank)"
        actor: system
        preconditions:
          - "bank.status == DRAFT"
        side_effects:
          - "recompute MitigationBank.sales_posture -> FROZEN (status is not a sales-eligible status)"
          - "increments MitigationBank.version by 1"
      - from: PROSPECTUS_REVIEW
        to: INSTRUMENT_EXECUTED
        trigger: "POST /mitigation/banks/{id}/execute-instrument"
        actor: IRTChair
        preconditions:
          - "bank.status == PROSPECTUS_REVIEW"
          - "exists Prospectus WHERE bank_id == bank.id AND status == APPROVED"
          - "exists WorkPlan WHERE bank_id == bank.id AND status == APPROVED"
          - "Sponsor(bank.sponsor_id).performance_bond_cents >= MIN_PERFORMANCE_BOND_CENTS"
        side_effects:
          - "MitigationBank.total_authorized_credits = the APPROVED WorkPlan.total_planned_credits"
          - "MitigationBank.stewardship_required_cents = stewardship_endowment_requirement(bank) (§1.3)"
          - "MitigationBank.instrument_executed_at = current logical clock"
          - "append CreditLedgerEntry {entry_type: GENERATED, delta_credits: 0, balance_after: 0, source_entity_type: MITIGATION_BANK, source_id: bank.id, memo: 'INSTRUMENT EXECUTED authorized=<total_authorized_credits>'}"
          - "recompute MitigationBank.sales_posture (RESTRICTED while easement_recorded == false)"
          - "increments MitigationBank.version by 1"
      - from: INSTRUMENT_EXECUTED
        to: MONITORING
        trigger: "POST /mitigation/monitoring-reports/{id}/review with decision ACCEPT (first accepted report of the bank)"
        actor: system
        preconditions:
          - "bank.status == INSTRUMENT_EXECUTED"
          - "no other MonitoringReport of this bank has review_status == ACCEPTED"
        side_effects:
          - "recompute MitigationBank.sales_posture"
          - "increments MitigationBank.version by 1"
      - from: MONITORING
        to: SUSPENDED
        trigger: "POST /mitigation/remedial-actions/{id}/inspect with outcome NOT_CLEARED at round_number == MAX_REMEDIAL_ROUNDS (system cascade)"
        actor: system
        preconditions:
          - "RemedialAction.round_number == 3 AND outcome == NOT_CLEARED"
        side_effects:
          - "recompute MitigationBank.sales_posture -> FROZEN"
          - "cascade: every CreditSale of this bank with status IN {QUOTED, RESERVED} -> CANCELLED (cancelled_reason BANK_POSTURE_RESTRICTED); each formerly RESERVED sale appends HOLD_RELEASED"
          - "Sponsor(bank.sponsor_id).good_standing recomputed to false"
          - "increments MitigationBank.version by 1"
      - from: SUSPENDED
        to: MONITORING
        trigger: "POST /mitigation/remedial-actions/{id}/inspect with outcome CLEARED on a superseding action (cycle back)"
        actor: system
        preconditions:
          - "bank.status == SUSPENDED"
          - "no RemedialAction of this bank has status IN {OPEN, WORK_SUBMITTED, REINSPECTION, FAILED}"
        side_effects:
          - "recompute MitigationBank.sales_posture"
          - "Sponsor(bank.sponsor_id).good_standing recomputed to true when no other bank of the sponsor is SUSPENDED"
          - "increments MitigationBank.version by 1"
      - from: MONITORING
        to: CLOSED
        trigger: "POST /mitigation/banks/{id}/close"
        actor: IRTChair
        preconditions:
          - "bank.status == MONITORING"
          - "every ReleaseMilestone of this bank has status == APPROVED"
          - "bank.easement_recorded == true"
          - "bank.stewardship_funded_cents >= bank.stewardship_required_cents"
          - "no RemedialAction linked to this bank has status IN {OPEN, WORK_SUBMITTED, REINSPECTION}"
        side_effects:
          - "MitigationBank.closed_at = current logical clock"
          - "recompute MitigationBank.sales_posture -> FROZEN"
          - "cascade: every CreditSale of this bank with status IN {QUOTED, RESERVED} -> CANCELLED (cancelled_reason SPONSOR_WITHDREW); each formerly RESERVED sale appends HOLD_RELEASED"
          - "increments MitigationBank.version by 1"

  - entity: Prospectus
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    shape: cyclic
    note: "REVISION_REQUESTED -> SUBMITTED is a true cycle bounded by MAX_REVISION_ROUNDS = 2."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /mitigation/prospectuses/{id}/submit"
        actor: Sponsor
        preconditions:
          - "prospectus.status == DRAFT"
          - "acting Sponsor owns MitigationBank(prospectus.bank_id)"
          - "MitigationBank(prospectus.bank_id).status == DRAFT"
          - "MitigationBank.service_area_huc8_codes contains MitigationBank.site_huc8_code"
        side_effects:
          - "Prospectus.submitted_at = current logical clock"
          - "MitigationBank.status DRAFT -> PROSPECTUS_REVIEW"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /mitigation/prospectuses/{id}/submit (resubmission of a revised prospectus)"
        actor: Sponsor
        preconditions:
          - "prospectus.status == REVISION_REQUESTED"
          - "prospectus.revision_round <= MAX_REVISION_ROUNDS"
          - "acting Sponsor owns MitigationBank(prospectus.bank_id)"
        side_effects:
          - "Prospectus.submitted_at = current logical clock"
          - "Prospectus.review_opened_at = null (a fresh round has no opened review yet)"
          - "concur_count / object_count / abstain_count / veto_recorded recomputed against the new revision_round (all zero until votes are cast)"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /mitigation/prospectuses/{id}/votes (auto-transition on the first vote of the current round)"
        actor: system
        preconditions:
          - "prospectus.status == SUBMITTED"
        side_effects:
          - "Prospectus.review_opened_at = current logical clock"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /mitigation/prospectuses/{id}/finalize-review"
        actor: IRTChair
        preconditions:
          - "prospectus.status == UNDER_REVIEW"
          - "votes_cast(current revision_round) >= IRT_QUORUM_MIN (3)"
          - "prospectus.veto_recorded == false"
          - "concur_count >= ceil(2/3 * votes_cast(current revision_round))"
          - "exists WorkPlan WHERE bank_id == prospectus.bank_id AND status IN {SUBMITTED, APPROVED}"
        side_effects:
          - "Prospectus.decision_recorded_by = acting X-User-ID; Prospectus.decided_at = current logical clock"
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /mitigation/prospectuses/{id}/finalize-review"
        actor: IRTChair
        preconditions:
          - "prospectus.status == UNDER_REVIEW"
          - "votes_cast(current revision_round) >= IRT_QUORUM_MIN (3)"
          - "prospectus.veto_recorded == false"
          - "concur_count < ceil(2/3 * votes_cast(current revision_round))"
          - "prospectus.revision_round < MAX_REVISION_ROUNDS (2)"
        side_effects:
          - "Prospectus.revision_round += 1"
          - "Prospectus.decision_recorded_by = acting X-User-ID; Prospectus.decided_at = current logical clock"
          - "concur_count / object_count / abstain_count / veto_recorded recomputed against the new revision_round (all zero)"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /mitigation/prospectuses/{id}/finalize-review"
        actor: IRTChair
        preconditions:
          - "prospectus.status == UNDER_REVIEW"
          - "votes_cast(current revision_round) >= IRT_QUORUM_MIN (3)"
          - "prospectus.veto_recorded == true OR (concur_count < ceil(2/3 * votes_cast) AND prospectus.revision_round == MAX_REVISION_ROUNDS)"
        side_effects:
          - "Prospectus.decision_recorded_by = acting X-User-ID; Prospectus.decided_at = current logical clock"
          - "MitigationBank(prospectus.bank_id) stays in PROSPECTUS_REVIEW; no instrument may ever be executed from a REJECTED prospectus"

  - entity: WorkPlan
    initial_state: DRAFT
    terminal_states: [APPROVED]
    shape: branching_with_revert
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /mitigation/work-plans/{id}/submit"
        actor: Sponsor
        preconditions:
          - "work_plan.status == DRAFT"
          - "acting Sponsor owns MitigationBank(work_plan.bank_id)"
          - "work_plan.hydrology_restoration_acres + work_plan.planting_acres > 0"
        side_effects:
          - "WorkPlan.submitted_at = current logical clock"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /mitigation/work-plans/{id}/submit (resubmission after return)"
        actor: Sponsor
        preconditions:
          - "work_plan.status == RETURNED"
          - "acting Sponsor owns MitigationBank(work_plan.bank_id)"
        side_effects:
          - "WorkPlan.submitted_at = current logical clock; WorkPlan.return_reason = null"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /mitigation/work-plans/{id}/decide with decision APPROVE"
        actor: IRTChair
        preconditions:
          - "work_plan.status == SUBMITTED"
          - "exists Prospectus WHERE bank_id == work_plan.bank_id AND status == APPROVED"
          - "no other WorkPlan of the same bank has status == APPROVED"
        side_effects:
          - "WorkPlan.decided_at = current logical clock"
          - "materialise one PerformanceStandard row per entry of WorkPlan.performance_standards (bank_id = work_plan.bank_id); these rows have no create endpoint and are discoverable only via GET /mitigation/banks/{id}/performance-standards"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /mitigation/work-plans/{id}/decide with decision RETURN"
        actor: IRTChair
        preconditions:
          - "work_plan.status == SUBMITTED"
          - "return_reason supplied in the request body"
        side_effects:
          - "WorkPlan.decided_at = current logical clock; WorkPlan.return_reason = supplied reason"
          - "NO PerformanceStandard rows are materialised (divergent side-effect set vs the APPROVE branch)"

  - entity: ReleaseMilestone
    initial_state: PENDING
    terminal_states: [APPROVED]
    shape: branching_fork_with_revert
    note: |
      CLAIMED forks to APPROVED (credits released, ledger RELEASED appended, bank version bumped) or
      to DEFERRED (credits placed on hold, ledger HOLD_PLACED appended, bank posture RESTRICTED) —
      two disjoint side-effect sets from the same source state.
    transitions:
      - from: PENDING
        to: CLAIMED
        trigger: "POST /mitigation/milestones/{id}/claim"
        actor: Sponsor
        preconditions:
          - "milestone.status == PENDING"
          - "acting Sponsor owns MitigationBank(milestone.bank_id)"
          - "MitigationBank(milestone.bank_id).status IN {INSTRUMENT_EXECUTED, MONITORING}"
          - "current logical clock >= milestone.window_start"
          - "milestone.predecessor_milestone_id is null OR ReleaseMilestone(milestone.predecessor_milestone_id).status == APPROVED"
        side_effects:
          - "ReleaseMilestone.provisional_release_credits = milestone_credit_release PROVISIONAL variant (§1.3)"
          - "ReleaseMilestone.claimed_at = current logical clock"
      - from: CLAIMED
        to: APPROVED
        trigger: "POST /mitigation/milestones/{id}/approve-release"
        actor: IRTMember
        preconditions:
          - "milestone.status == CLAIMED"
          - "payload expected_bank_version == MitigationBank(milestone.bank_id).version (OCC, §1.2.1)"
          - "MitigationBank.easement_recorded == true"
          - "acting IRTMember.id != any RemedialAction.verified_by_member_id among actions whose deferred_milestone_id == milestone.id (segregation of duties)"
          - "milestone.milestone_code IN {INSTRUMENT_EXECUTION, CONSTRUCTION_COMPLETE} OR the latest ACCEPTED MonitoringReport of the bank has compliance_status IN {PASS, PARTIAL}"
          - "MitigationBank.stewardship_funded_cents >= required stewardship gate for this milestone_code (§1.4 priority 80)"
        side_effects:
          - "ReleaseMilestone.attainment_factor_applied and ReleaseMilestone.final_release_credits = milestone_credit_release FINAL variant (§1.3)"
          - "append CreditLedgerEntry {entry_type: RELEASED, delta_credits: +final_release_credits, source_entity_type: RELEASE_MILESTONE, source_id: milestone.id}"
          - "MitigationBank.credits_released and credits_available recomputed from the ledger"
          - "recompute MitigationBank.sales_posture (RESTRICTED -> OPEN once credits exist and no remedial action is open)"
          - "ReleaseMilestone.approved_at = current logical clock"
          - "increments MitigationBank.version by 1"
      - from: CLAIMED
        to: DEFERRED
        trigger: "system cascade from RemedialAction creation (see MonitoringReport review ACCEPT with compliance_status FAIL)"
        actor: system
        preconditions:
          - "milestone.status == CLAIMED"
          - "milestone is the earliest non-terminal milestone of the bank ordered by window_start ASC, tie-break created_at ASC"
        side_effects:
          - "ReleaseMilestone.deferred_at = current logical clock"
          - "RemedialAction.deferred_milestone_id = milestone.id; RemedialAction.held_credits = MitigationBank.credits_released - MitigationBank.credits_sold evaluated at cascade time (every unsold released credit of the bank is frozen; the quantity is 0.00 when nothing has been released yet, so credits_available can never go negative)"
          - "append CreditLedgerEntry {entry_type: HOLD_PLACED, delta_credits: -remedial_action.held_credits, source_entity_type: REMEDIAL_ACTION, source_id: remedial_action.id} — appended ONLY when held_credits > 0"
          - "MitigationBank.credits_on_hold and credits_available recomputed; deferral_count += 1"
      - from: PENDING
        to: DEFERRED
        trigger: "system cascade from RemedialAction creation when the earliest non-terminal milestone is still PENDING"
        actor: system
        preconditions:
          - "milestone.status == PENDING"
          - "milestone is the earliest non-terminal milestone of the bank ordered by window_start ASC, tie-break created_at ASC"
        side_effects:
          - "ReleaseMilestone.deferred_at = current logical clock"
          - "RemedialAction.deferred_milestone_id = milestone.id; RemedialAction.held_credits = 0"
          - "NO ledger entry is appended (nothing was ever provisionally computed to hold)"
          - "MitigationBank.deferral_count += 1"
      - from: DEFERRED
        to: CLAIMED
        trigger: "system cascade from POST /mitigation/remedial-actions/{id}/inspect with outcome CLEARED, when the milestone had already been claimed before it was deferred (milestone.claimed_at is not null)"
        actor: system
        preconditions:
          - "milestone.status == DEFERRED"
          - "milestone.claimed_at is not null"
          - "the RemedialAction whose deferred_milestone_id == milestone.id has status == CLEARED"
        side_effects:
          - "append CreditLedgerEntry {entry_type: HOLD_RELEASED, delta_credits: +remedial_action.held_credits, source_entity_type: REMEDIAL_ACTION, source_id: remedial_action.id} — appended ONLY when held_credits > 0"
          - "MitigationBank.credits_on_hold and credits_available recomputed"
          - "recompute MitigationBank.sales_posture"
      - from: DEFERRED
        to: PENDING
        trigger: "system cascade from POST /mitigation/remedial-actions/{id}/inspect with outcome CLEARED, when the milestone had never been claimed before it was deferred (milestone.claimed_at is null)"
        actor: system
        preconditions:
          - "milestone.status == DEFERRED"
          - "milestone.claimed_at is null"
          - "the RemedialAction whose deferred_milestone_id == milestone.id has status == CLEARED"
        side_effects:
          - "no ledger entry (a never-claimed milestone froze nothing: held_credits == 0)"
          - "recompute MitigationBank.sales_posture"

  - entity: MonitoringReport
    initial_state: "review_status=DRAFT x compliance_status=UNEVALUATED"
    terminal_states: []
    shape: parallel_dimensions
    note: |
      Two independent state dimensions on one row. review_status walks the IRT paperwork track
      (DRAFT -> SUBMITTED -> {ACCEPTED, RETURNED -> SUBMITTED}); compliance_status walks the
      ecological track and is written ONLY by the ACCEPT branch. A RETURNED report keeps
      compliance_status == UNEVALUATED forever unless it is resubmitted and accepted, and a report
      may therefore be ACCEPTED with compliance_status FAIL — the two dimensions never gate each other.
    transitions:
      - from: "review_status=DRAFT"
        to: "review_status=SUBMITTED"
        trigger: "POST /mitigation/monitoring-reports/{id}/submit"
        actor: Sponsor
        preconditions:
          - "report.review_status == DRAFT"
          - "acting Sponsor owns MitigationBank(report.bank_id)"
          - "MitigationBank(report.bank_id).status IN {INSTRUMENT_EXECUTED, MONITORING, SUSPENDED}"
          - "report.measurements contains one entry for every PerformanceStandard of the bank with effective_from_year <= report.monitoring_year"
        side_effects:
          - "MonitoringReport.submitted_at = current logical clock"
      - from: "review_status=RETURNED"
        to: "review_status=SUBMITTED"
        trigger: "POST /mitigation/monitoring-reports/{id}/submit (resubmission after return)"
        actor: Sponsor
        preconditions:
          - "report.review_status == RETURNED"
          - "acting Sponsor owns MitigationBank(report.bank_id)"
        side_effects:
          - "MonitoringReport.submitted_at = current logical clock"
      - from: "review_status=SUBMITTED"
        to: "review_status=ACCEPTED, compliance_status=PASS|PARTIAL|FAIL"
        trigger: "POST /mitigation/monitoring-reports/{id}/review with decision ACCEPT"
        actor: IRTMember
        preconditions:
          - "report.review_status == SUBMITTED"
          - "every PerformanceStandard of the bank with effective_from_year <= report.monitoring_year has a matching measurement"
        side_effects:
          - "MonitoringReport.attainment_score, failed_standard_codes and compliance_status = performance_attainment_score (§1.3)"
          - "MonitoringReport.reviewed_by_member_id = acting IRTMember.id; reviewed_at = current logical clock"
          - "if this is the bank's first ACCEPTED report: MitigationBank.status INSTRUMENT_EXECUTED -> MONITORING"
          - "CASCADE HOP 1->2: because compliance_status became FAIL, create RemedialAction {monitoring_report_id: report.id, status: OPEN, round_number: 1, corrective_scope: 'REMEDIATE: <failed_standard_codes joined by comma>', due_at: clock + 365 days}"
          - "CASCADE HOP 2->3: because a non-terminal RemedialAction now exists, MitigationBank.sales_posture is recomputed to RESTRICTED"
          - "CASCADE HOP 3->4: because sales_posture became RESTRICTED, every CreditSale of the bank with status IN {QUOTED, RESERVED} -> CANCELLED (cancelled_reason BANK_POSTURE_RESTRICTED); each formerly RESERVED sale appends HOLD_RELEASED restoring its held credits to credits_available"
          - "CASCADE HOP 4->5: because the remedial action exists, the earliest non-terminal ReleaseMilestone of the bank (window_start ASC, tie-break created_at ASC) transitions to DEFERRED, freezing every unsold released credit of the bank via HOLD_PLACED. The freeze quantity is evaluated at THIS point in the chain, i.e. AFTER hop 3->4 released the cancelled sales' holds, so at the end of the request credits_on_hold == RemedialAction.held_credits and credits_available == 0.00 exactly; nothing is frozen and no ledger entry is appended when that milestone had never been claimed"
          - "increments MitigationBank.version by 1"
      - from: "review_status=SUBMITTED"
        to: "review_status=RETURNED"
        trigger: "POST /mitigation/monitoring-reports/{id}/review with decision RETURN"
        actor: IRTMember
        preconditions:
          - "report.review_status == SUBMITTED"
          - "return_reason supplied in the request body"
        side_effects:
          - "MonitoringReport.return_count += 1; reviewed_by_member_id = acting IRTMember.id; reviewed_at = current logical clock"
          - "compliance_status is NOT written and stays UNEVALUATED (divergent side-effect set vs the ACCEPT branch)"
          - "no RemedialAction is created, no milestone is deferred, no posture change, MitigationBank.version is NOT incremented"

  - entity: RemedialAction
    initial_state: OPEN
    terminal_states: [CLEARED, FAILED]
    shape: cyclic
    note: "REINSPECTION -> OPEN is a true cycle bounded by MAX_REMEDIAL_ROUNDS = 3."
    transitions:
      - from: OPEN
        to: WORK_SUBMITTED
        trigger: "POST /mitigation/remedial-actions/{id}/submit-work"
        actor: Sponsor
        preconditions:
          - "action.status == OPEN"
          - "acting Sponsor owns the bank of MonitoringReport(action.monitoring_report_id)"
          - "current logical clock <= action.due_at"
        side_effects:
          - "RemedialAction.work_submitted_at = current logical clock"
      - from: WORK_SUBMITTED
        to: REINSPECTION
        trigger: "POST /mitigation/remedial-actions/{id}/inspect (the inspection is recorded before its outcome is applied)"
        actor: IRTMember
        preconditions:
          - "action.status == WORK_SUBMITTED"
        side_effects:
          - "RemedialAction passes through REINSPECTION within the same request and immediately resolves to CLEARED or OPEN/FAILED per the outcome"
      - from: REINSPECTION
        to: CLEARED
        trigger: "POST /mitigation/remedial-actions/{id}/inspect with outcome CLEARED"
        actor: IRTMember
        preconditions:
          - "action.status == WORK_SUBMITTED (evaluated at request entry)"
          - "acting IRTMember.roster_status == SEATED"
        side_effects:
          - "RemedialAction.verified_by_member_id = acting IRTMember.id; cleared_at = current logical clock"
          - "CASCADE HOP 1->2: because no non-terminal RemedialAction remains for the bank, the DEFERRED milestone returns to CLAIMED (milestone.claimed_at is not null) or PENDING (claimed_at is null), appending HOLD_RELEASED when held_credits > 0"
          - "CASCADE HOP 2->3: because credits_on_hold returned to its pre-deferral value, MitigationBank.credits_available is recomputed and sales_posture recomputed to OPEN; if bank.status == SUSPENDED it returns to MONITORING"
          - "increments MitigationBank.version by 1"
      - from: REINSPECTION
        to: OPEN
        trigger: "POST /mitigation/remedial-actions/{id}/inspect with outcome NOT_CLEARED and round_number < MAX_REMEDIAL_ROUNDS"
        actor: IRTMember
        preconditions:
          - "action.status == WORK_SUBMITTED (evaluated at request entry)"
          - "action.round_number < 3"
        side_effects:
          - "RemedialAction.round_number += 1; work_submitted_at = null"
          - "the deferred milestone stays DEFERRED and its hold stays in place (no ledger entry)"
      - from: REINSPECTION
        to: FAILED
        trigger: "POST /mitigation/remedial-actions/{id}/inspect with outcome NOT_CLEARED and round_number == MAX_REMEDIAL_ROUNDS"
        actor: IRTMember
        preconditions:
          - "action.status == WORK_SUBMITTED (evaluated at request entry)"
          - "action.round_number == 3"
        side_effects:
          - "MitigationBank.status MONITORING -> SUSPENDED (or stays SUSPENDED)"
          - "recompute MitigationBank.sales_posture -> FROZEN; cascade-cancel all QUOTED/RESERVED sales of the bank"
          - "Sponsor.good_standing recomputed to false"
          - "increments MitigationBank.version by 1"

  - entity: CreditSale
    initial_state: QUOTED
    terminal_states: [ASSIGNED, CANCELLED, EXPIRED]
    shape: branching_with_compensation
    transitions:
      - from: QUOTED
        to: RESERVED
        trigger: "POST /mitigation/credit-sales/{id}/reserve"
        actor: Permittee
        preconditions:
          - "sale.status == QUOTED"
          - "acting Permittee.id == sale.permittee_id"
          - "MitigationBank(sale.bank_id).sales_posture == OPEN"
          - "sale.credits_requested <= MitigationBank.credits_available (re-checked at reserve time)"
          - "no other CreditSale of the same permittee_id with status == RESERVED has a hold interval [hold_start_at, hold_expires_at] (CLOSED, endpoints inclusive) intersecting [now, now + 30 days]"
        side_effects:
          - "CreditSale.hold_start_at = current logical clock; hold_expires_at = hold_start_at + RESERVATION_HOLD_DAYS (30) days"
          - "append CreditLedgerEntry {entry_type: HOLD_PLACED, delta_credits: -credits_requested, source_entity_type: CREDIT_SALE, source_id: sale.id}"
          - "MitigationBank.credits_on_hold and credits_available recomputed; sales_posture recomputed"
          - "increments MitigationBank.version by 1"
      - from: RESERVED
        to: EXECUTED
        trigger: "POST /mitigation/credit-sales/{id}/execute"
        actor: Sponsor
        preconditions:
          - "sale.status == RESERVED (after the lazy expiry sweep has run)"
          - "acting Sponsor owns MitigationBank(sale.bank_id)"
          - "MitigationBank.sales_posture == OPEN"
          - "current logical clock <= sale.hold_expires_at"
          - "Permittee(sale.permittee_id).escrow_balance_cents >= the EXECUTED-variant price computed for this request"
        side_effects:
          - "CreditSale.executed_price_cents = credit_sale_price EXECUTED variant (§1.3); executed_at = current logical clock"
          - "append CreditLedgerEntry {entry_type: HOLD_RELEASED, delta_credits: +credits_requested, source_entity_type: CREDIT_SALE, source_id: sale.id} FIRST"
          - "append CreditLedgerEntry {entry_type: SOLD, delta_credits: -credits_requested, source_entity_type: CREDIT_SALE, source_id: sale.id} SECOND (pinned order; balance_after of the two entries differs even though the net is zero)"
          - "MitigationBank.credits_on_hold, credits_sold and credits_available recomputed"
          - "Permittee.escrow_balance_cents recomputed (deposited_cents minus executed prices)"
          - "recompute MitigationBank.sales_posture -> SOLD_OUT when credits_available == 0"
          - "increments MitigationBank.version by 1"
      - from: EXECUTED
        to: ASSIGNED
        trigger: "POST /mitigation/credit-sales/{id}/assign"
        actor: Sponsor
        preconditions:
          - "sale.status == EXECUTED"
          - "acting Sponsor owns MitigationBank(sale.bank_id)"
          - "sale.credits_requested <= Permittee(sale.permittee_id).unmet_requirement_credits"
        side_effects:
          - "CreditSale.assignment_reference = '<permittee.permit_number>/<bank.site_huc8_code>/<credits_requested>'; assigned_at = current logical clock"
          - "append CreditLedgerEntry {entry_type: ASSIGNED, delta_credits: 0, source_entity_type: CREDIT_SALE, source_id: sale.id} (bookkeeping only; balance_after unchanged)"
          - "Permittee.assigned_credits and unmet_requirement_credits recomputed"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /mitigation/credit-sales/{id}/cancel"
        actor: Permittee | Sponsor
        preconditions:
          - "sale.status == QUOTED"
          - "acting Permittee.id == sale.permittee_id OR acting Sponsor owns MitigationBank(sale.bank_id)"
        side_effects:
          - "CreditSale.cancelled_reason = supplied reason; cancelled_at = current logical clock"
          - "MitigationBank.open_quote_count recomputed; no ledger entry (no hold existed)"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /mitigation/credit-sales/{id}/cancel"
        actor: Permittee | Sponsor
        preconditions:
          - "sale.status == RESERVED"
          - "acting Permittee.id == sale.permittee_id OR acting Sponsor owns MitigationBank(sale.bank_id)"
        side_effects:
          - "append CreditLedgerEntry {entry_type: HOLD_RELEASED, delta_credits: +credits_requested, source_entity_type: CREDIT_SALE, source_id: sale.id}"
          - "MitigationBank.credits_on_hold and credits_available recomputed; sales_posture recomputed"
          - "CreditSale.cancelled_reason = supplied reason; cancelled_at = current logical clock"
      - from: RESERVED
        to: EXPIRED
        trigger: "system: lazy expiry sweep run at the START of every POST under /mitigation/credit-sales (create, reserve, execute, assign, cancel, reverse)"
        actor: system
        preconditions:
          - "sale.status == RESERVED"
          - "sale.hold_expires_at < current logical clock (STRICTLY before — at exactly hold_expires_at the hold is still live)"
        side_effects:
          - "append CreditLedgerEntry {entry_type: HOLD_RELEASED, delta_credits: +credits_requested, source_entity_type: CREDIT_SALE, source_id: sale.id}"
          - "CreditSale.cancelled_reason = HOLD_EXPIRED; cancelled_at = current logical clock"
          - "MitigationBank.credits_on_hold and credits_available recomputed; sales_posture recomputed"
      - from: QUOTED
        to: CANCELLED
        trigger: "system cascade: MitigationBank.sales_posture became RESTRICTED or FROZEN"
        actor: system
        preconditions:
          - "sale.status == QUOTED"
        side_effects:
          - "CreditSale.cancelled_reason = BANK_POSTURE_RESTRICTED; cancelled_at = current logical clock"
      - from: RESERVED
        to: CANCELLED
        trigger: "system cascade: MitigationBank.sales_posture became RESTRICTED or FROZEN"
        actor: system
        preconditions:
          - "sale.status == RESERVED"
        side_effects:
          - "append CreditLedgerEntry {entry_type: HOLD_RELEASED, delta_credits: +credits_requested, source_entity_type: CREDIT_SALE, source_id: sale.id}"
          - "CreditSale.cancelled_reason = BANK_POSTURE_RESTRICTED; cancelled_at = current logical clock"
      - from: EXECUTED
        to: CANCELLED
        trigger: "POST /mitigation/credit-sales/{id}/reverse"
        actor: IRTChair
        preconditions:
          - "sale.status == EXECUTED (an ASSIGNED sale can never be reversed)"
        side_effects:
          - "append CreditLedgerEntry {entry_type: SALE_REVERSED, delta_credits: +credits_requested, source_entity_type: CREDIT_SALE, source_id: sale.id}"
          - "MitigationBank.credits_sold and credits_available recomputed (compensation restores the pre-execution ledger balance exactly)"
          - "Permittee.escrow_balance_cents recomputed — the reversed sale leaves the EXECUTED/ASSIGNED set so the full executed_price_cents returns to escrow"
          - "CreditSale.cancelled_reason = IRT_REVERSAL; cancelled_at = current logical clock; executed_price_cents is RETAINED for audit"
          - "recompute MitigationBank.sales_posture; increments MitigationBank.version by 1"

# ============================================================================
# §1.2.1 Concurrency Rules — OCC on MitigationBank.version only
# ============================================================================
concurrency_rules:
  - rule_id: quote-create-stale-bank
    parent_entity: MitigationBank
    write_endpoint: "POST /mitigation/credit-sales"
    occ_field: "expected_bank_version"
    description: |
      Creating a CreditSale quote against a MitigationBank whose version has advanced since the
      client last read it is rejected with a stale-version error. A quote is priced from the bank's
      credits_available, stewardship funding gap and demand index at quote time, and any other
      writer's release approval, reservation or reversal legitimately supersedes that view; the
      quote must therefore be re-derived from a fresh read rather than priced off stale inputs.
    error_id: ERR_STALE_BANK_VERSION
    http_status: 412

  - rule_id: release-approval-stale-bank
    parent_entity: MitigationBank
    write_endpoint: "POST /mitigation/milestones/{id}/approve-release"
    occ_field: "expected_bank_version"
    description: |
      Approving a credit release against a MitigationBank whose version has advanced since the
      approving member last read it is rejected with a stale-version error. Releases of two
      different milestones are each independently valid, so a second approval carrying the version
      observed before the first one landed is rejected on the stale version rather than on state.
    error_id: ERR_STALE_BANK_VERSION
    http_status: 412

# ============================================================================
# §1.3 Calculation Rules Table
# All money is integer cents. All decimal arithmetic is exact (Decimal), never binary float.
# ============================================================================
calculations:

  - name: work_plan_credit_yield
    trigger: "POST /mitigation/work-plans (at creation, stamped onto WorkPlan.total_planned_credits) and re-stamped on every POST /mitigation/work-plans/{id}/submit"
    algorithm: weighted_scoring
    formula: |
      # PINNED ROUNDING ORDER (combinatorial mode (b)): round PER STRATUM, then sum.
      # Iterate work_plan.credit_strata ordered by stratum_code ASC (order is irrelevant to the
      # result because addition is associative once each term is rounded, but it is pinned anyway).
      stratum_credits[i] = round_half_up(strata[i].acres * strata[i].lift_factor, 2)
      total_planned_credits = SUM(stratum_credits)      # sum of ALREADY-ROUNDED terms
      # FORBIDDEN alternative that yields a different number:
      #   total = round_half_up(SUM(acres_i * lift_i), 2)
      # Worked divergence: strata (101.50 x 0.375), (70.50 x 0.625), (33.30 x 0.500)
      #   pinned  : 38.06 + 44.06 + 16.65 = 98.77
      #   forbidden: round(38.0625 + 44.0625 + 16.65) = round(98.775) = 98.78
    input_set: "Every entry of WorkPlan.credit_strata; no status filter (the array is immutable input on the row)."
    constants:
      MAX_STRATA: 6
    precision: "credits carry 2 decimal places, round_half_up, applied per stratum BEFORE summation"
    variants: []

  - name: stewardship_endowment_requirement
    trigger: "POST /mitigation/banks (stamped onto MitigationBank.stewardship_required_cents at creation) and re-stamped at POST /mitigation/banks/{id}/execute-instrument"
    algorithm: constraint_propagation
    formula: |
      # Combinatorial mode (c): CIRCULAR-LOOKING dependency with a PINNED evaluation order.
      # The administrative fee is itself an annual stewardship cost, so a naive reading would
      # re-enter the endowment formula (fee -> higher endowment -> higher fee -> ...).
      # PINNED: the fee is derived ONCE from the fee-free base endowment and added afterwards.
      # NO fixed-point iteration is performed.
      base_endowment_cents = ceil(bank.annual_stewardship_cost_cents / STEWARDSHIP_PAYOUT_RATE)
      admin_fee_cents      = round_half_up(base_endowment_cents * STEWARDSHIP_ADMIN_FEE_PCT, 0)
      stewardship_required_cents = base_endowment_cents + admin_fee_cents
      # Worked example: annual_stewardship_cost_cents = 4200000
      #   base = ceil(4200000 / 0.0375) = 112000000
      #   fee  = round(112000000 * 0.0150) = 1680000
      #   required = 113680000
      # FORBIDDEN fixed-point reading: treating the admin fee as an annual cost that re-enters the
      #   capitalisation, i.e. solving x = (4200000 + 0.0150*x) / 0.0375, converges to 186666667 —
      #   a wildly different number. The pinned single-pass order is normative.
      #
      # Release gates derived from the same field (evaluated at approve-release):
      first_gate_cents = round_half_up(stewardship_required_cents * STEWARDSHIP_INTERIM_GATE_PCT, 0)   # 28420000
      final_gate_cents = stewardship_required_cents                                                    # 113680000
    input_set: "MitigationBank.annual_stewardship_cost_cents only; independent of credits and of any child entity."
    constants:
      STEWARDSHIP_PAYOUT_RATE: 0.0375
      STEWARDSHIP_ADMIN_FEE_PCT: 0.0150
      STEWARDSHIP_INTERIM_GATE_PCT: 0.25
    precision: "whole cents; ceil for the capitalisation step, round_half_up for the fee"
    variants: []

  - name: milestone_credit_release
    trigger: "PROVISIONAL variant at POST /mitigation/milestones/{id}/claim; FINAL variant at POST /mitigation/milestones/{id}/approve-release"
    algorithm: threshold
    formula: |
      provisional_release_credits = round_half_up(bank.total_authorized_credits * milestone.release_pct, 2)

      # attainment_factor selection (FINAL variant only):
      if milestone.milestone_code IN {INSTRUMENT_EXECUTION, CONSTRUCTION_COMPLETE}:
          attainment_factor = 1.00                      # construction milestones need no monitoring
      else:
          report = the MonitoringReport of this bank with review_status == ACCEPTED having the
                   highest monitoring_year; tie-break created_at ASC then take the LAST row
                   (i.e. most recently created among equal monitoring_year)
          if report is null                       -> reject ERR_NO_ACCEPTED_MONITORING_REPORT
          elif report.compliance_status == FAIL   -> reject ERR_COMPLIANCE_FAILED (release is deferred, never scaled)
          elif report.attainment_score >= 0.95    -> attainment_factor = 1.00     # BOUNDARY: >= not >
          elif report.attainment_score >= 0.85    -> attainment_factor = 0.90     # BOUNDARY: >= not >
          else                                    -> reject ERR_COMPLIANCE_FAILED

      final_release_credits = round_half_up(provisional_release_credits * attainment_factor, 2)
      # Worked divergence on identical data (total_authorized_credits = 98.77, release_pct = 0.250,
      # latest ACCEPTED report PARTIAL with attainment_score 0.9350):
      #   PROVISIONAL = round(98.77 * 0.250, 2) = 24.69
      #   FINAL       = round(24.69 * 0.90,  2) = 22.22   -> the two variants differ by 2.47 credits
      # The FINAL variant rounds the ALREADY-ROUNDED provisional value (pinned two-step rounding);
      # round(98.77 * 0.250 * 0.90, 2) = round(22.22325, 2) = 22.22 agrees here, but the pinned
      # order is normative wherever the two disagree.
    input_set: "MitigationBank.total_authorized_credits, the milestone's release_pct and milestone_code, and (for PERF_* codes) the bank's ACCEPTED MonitoringReport with the highest monitoring_year."
    constants:
      ATTAINMENT_FULL_RELEASE_MIN: 0.95
      ATTAINMENT_PARTIAL_RELEASE_MIN: 0.85
      PARTIAL_RELEASE_FACTOR: 0.90
    precision: "2 decimal places, round_half_up, applied at each of the two steps"
    variants:
      - name: PROVISIONAL
        when: "Stamped at claim time onto provisional_release_credits; also the value held on hold if the milestone is later DEFERRED."
        difference: "Always uses attainment_factor 1.00 and consults NO MonitoringReport, so a claim never fails on ecological grounds."
      - name: FINAL
        when: "Stamped at release-approval time onto final_release_credits and used as the RELEASED ledger delta."
        difference: "Selects attainment_factor from the latest ACCEPTED report's attainment_score tier, so for a PARTIAL report in [0.85, 0.95) it releases 90% of the provisional credits; the 10% difference is never released and never re-enters credits_available."

  - name: service_area_demand_index
    trigger: "Evaluated at POST /mitigation/credit-sales (stamped onto quoted_demand_index), at POST /mitigation/credit-sales/{id}/execute (EXECUTED price variant), and at GET /mitigation/banks/{id}/credit-forecast"
    algorithm: chronological
    formula: |
      now = current logical clock
      # Four consecutive half-open 90-day quarters ending at `now`, oldest first:
      q[0] = [now - 360d, now - 270d)   weight 0.10
      q[1] = [now - 270d, now - 180d)   weight 0.20
      q[2] = [now - 180d, now -  90d)   weight 0.30
      q[3] = [now -  90d, now)          weight 0.40
      # PINNED ROUNDING ORDER: round PER QUARTER, then sum.
      quarter_credits[i] = SUM(CreditSale.credits_requested
                               WHERE bank_id == bank.id
                                 AND status IN {EXECUTED, ASSIGNED}
                                 AND executed_at IN q[i])
      weighted[i] = round_half_up(quarter_credits[i] * weight[i], 2)
      demand_pressure = SUM(weighted[i]) over i = 0..3
      demand_index = round_half_up(min(DEMAND_INDEX_CEILING, demand_pressure / DEMAND_NORMALIZER_CREDITS), 4)
      # Worked example: a single 8.00-credit sale executed 5 days ago and nothing else ->
      #   weighted = [0, 0, 0, round(8.00*0.40,2)=3.20]; pressure 3.20; index = round(3.20/10.00,4) = 0.3200
      # Sales in CANCELLED / EXPIRED / QUOTED / RESERVED status are EXCLUDED; a REVERSED sale
      # (status CANCELLED, reason IRT_REVERSAL) therefore drops straight out of the index.
    input_set: "CreditSale rows of the same bank with status IN {EXECUTED, ASSIGNED} whose executed_at falls in the 360-day trailing window; all other statuses excluded."
    constants:
      QUARTER_DAYS: 90
      QUARTER_WEIGHTS: [0.10, 0.20, 0.30, 0.40]
      DEMAND_NORMALIZER_CREDITS: 10.00
      DEMAND_INDEX_CEILING: 3.0
    precision: "per-quarter weighted credits at 2 decimals round_half_up; demand_index at 4 decimals round_half_up"
    variants: []

  - name: credit_sale_price
    trigger: "QUOTED variant at POST /mitigation/credit-sales; EXECUTED variant at POST /mitigation/credit-sales/{id}/execute"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial mode (a): 4 inputs (credits, hgm_class, service_area_tier, funding state) plus a
      # chronological demand index, interacting non-linearly through marginal tier selection, a
      # conditional surcharge branch on bank state, and a nested min() cap.
      base = BASE_PRICE_CENTS_PER_CREDIT[bank.hgm_class]
      # marginal tiers over credits_requested, evaluated tier1 -> tier2 -> tier3:
      t1 = min(credits_requested, 5.00)                          multiplier 1.000
      t2 = min(max(credits_requested - 5.00, 0), 10.00)          multiplier 0.950
      t3 = max(credits_requested - 15.00, 0)                     multiplier 0.900
      # PINNED: round each non-zero tier amount to whole cents, THEN sum the tier amounts.
      tiered_subtotal_cents = SUM over non-zero tiers of round_half_up(tier_credits * base * multiplier, 0)

      secondary_pct   = 0.12 if sale.service_area_tier == SECONDARY else 0.00
      stewardship_pct = 0.08 if bank.stewardship_funded_cents < bank.stewardship_required_cents else 0.00
      premium_cents   = round_half_up(tiered_subtotal_cents * (secondary_pct + stewardship_pct), 0)
      demand_cents    = round_half_up(tiered_subtotal_cents * min(DEMAND_ADJUSTMENT_CAP_PCT,
                                                                  DEMAND_SENSITIVITY * demand_index), 0)
      gross_cents     = tiered_subtotal_cents + premium_cents + demand_cents
      cap_cents       = round_half_up(tiered_subtotal_cents * PRICE_CAP_MULTIPLIER, 0)
      price_cents     = min(gross_cents, cap_cents)
      # Worked example (DEPRESSIONAL, 8.00 credits, PRIMARY, stewardship underfunded, index 0.0000):
      #   tiers    = round(5.00*3800000*1.000)=19000000 + round(3.00*3800000*0.950)=10830000
      #   subtotal = 29830000; premium = round(29830000*0.08) = 2386400; demand = 0
      #   gross    = 32216400; cap = round(29830000*1.15) = 34304500; price = 32216400
    input_set: "The sale's credits_requested and service_area_tier, the bank's hgm_class and stewardship funding state, and service_area_demand_index over the bank's EXECUTED/ASSIGNED sales."
    constants:
      BASE_PRICE_CENTS_PER_CREDIT:
        RIVERINE: 4250000
        DEPRESSIONAL: 3800000
        SLOPE: 3600000
        FLATS: 3300000
        ESTUARINE: 5100000
      TIER1_MAX_CREDITS: 5.00
      TIER2_MAX_CREDITS: 10.00
      TIER1_MULTIPLIER: 1.000
      TIER2_MULTIPLIER: 0.950
      TIER3_MULTIPLIER: 0.900
      SECONDARY_SERVICE_AREA_PREMIUM_PCT: 0.12
      STEWARDSHIP_SURCHARGE_PCT: 0.08
      DEMAND_SENSITIVITY: 0.10
      DEMAND_ADJUSTMENT_CAP_PCT: 0.30
      PRICE_CAP_MULTIPLIER: 1.15
      EXECUTION_REPRICE_CAP_MULTIPLIER: 1.10
    precision: "whole cents throughout; per-tier rounding BEFORE summation; premium and demand rounded from the subtotal, never from each other"
    variants:
      - name: QUOTED
        when: "Computed at POST /mitigation/credit-sales and frozen onto quoted_price_cents together with quoted_demand_index."
        difference: "Uses the bank's stewardship funding state and demand index as they stand at quote time; the result never changes afterwards."
      - name: EXECUTED
        when: "Recomputed at POST /mitigation/credit-sales/{id}/execute and stamped onto executed_price_cents."
        difference: "Re-reads the stewardship funding state and re-runs service_area_demand_index at execution time, then applies a second nested cap: executed_price_cents = min(recomputed_price_cents, round_half_up(quoted_price_cents * 1.10, 0)). It may land BELOW the quote (surcharge cleared) or above it (demand risen), so the same sale row can hold two different prices."

  - name: performance_attainment_score
    trigger: "POST /mitigation/monitoring-reports/{id}/review with decision ACCEPT (stamps attainment_score, failed_standard_codes and compliance_status)"
    algorithm: weighted_scoring
    formula: |
      standards = PerformanceStandard rows WHERE bank_id == report.bank_id
                    AND effective_from_year <= report.monitoring_year
                  ordered by standard_code ASC
      if standards is empty -> reject ERR_NO_EFFECTIVE_STANDARDS
      for each s in standards:
          m = the entry of report.measurements with standard_code == s.standard_code
          if m is missing -> reject ERR_MEASUREMENT_MISSING
          if s.comparator == GTE:
              ratio = min(1.0, m.measured_value / s.threshold_value)
              met   = (m.measured_value >= s.threshold_value)          # BOUNDARY: >= not >
          else:  # LTE
              ratio = 1.0 if m.measured_value <= s.threshold_value
                      else max(0.0, 1.0 - (m.measured_value - s.threshold_value) / s.threshold_value)
              met   = (m.measured_value <= s.threshold_value)          # BOUNDARY: <= not <
          contribution = round_half_up(ratio * s.weight, 4)            # PINNED: round per standard
      attainment_score = round_half_up(SUM(contribution) / SUM(s.weight), 4)
      failed_standard_codes = [s.standard_code for s where met == false], ordered by standard_code ASC
      compliance_status = PASS    if failed_standard_codes is empty
                          PARTIAL if attainment_score >= COMPLIANCE_PARTIAL_MIN   # BOUNDARY: >= not >
                          FAIL    otherwise
      # Worked examples with the standard set
      #   HYDROPERIOD_DAYS GTE 120 w0.300 y1 | INVASIVE_COVER_PCT LTE 10.0 w0.250 y1
      #   NATIVE_COVER_PCT GTE 80.0 w0.300 y3 | STEM_DENSITY_PER_ACRE GTE 400 w0.150 y3
      #   year 3, (120, 10.0, 80.0, 400) -> every standard exactly at threshold -> score 1.0000, PASS
      #   year 3, (114, 12.0, 80.0, 400) -> score 0.9350, failed [HYDROPERIOD_DAYS, INVASIVE_COVER_PCT], PARTIAL
      #   year 3, (117, 11.0, 80.0, 400) -> score 0.9675, failed [HYDROPERIOD_DAYS, INVASIVE_COVER_PCT], PARTIAL
      #   year 3, ( 96, 20.0, 60.0, 400) -> score 0.6150, failed [HYDROPERIOD_DAYS, INVASIVE_COVER_PCT, NATIVE_COVER_PCT], FAIL
      #   year 1, (120,  8.0)            -> denominator is 0.550 (only year-1 standards) -> score 1.0000, PASS
    input_set: "PerformanceStandard rows of the bank with effective_from_year <= monitoring_year (all of them; no other status filter exists on that entity) matched against report.measurements."
    constants:
      COMPLIANCE_PARTIAL_MIN: 0.85
    precision: "per-standard contribution at 4 decimals round_half_up; attainment_score at 4 decimals round_half_up; the denominator is the sum of the UNROUNDED effective weights"
    variants: []

  - name: credit_sales_posture
    trigger: "Recomputed after every mutation that changes MitigationBank.status, credits_on_hold, credits_available, easement_recorded, or the set of RemedialAction rows with status IN {OPEN, WORK_SUBMITTED, REINSPECTION, FAILED}"
    algorithm: aggregation
    formula: |
      # First matching branch wins; the order is normative.
      if bank.status IN {DRAFT, PROSPECTUS_REVIEW, SUSPENDED, CLOSED}:                     FROZEN
      elif bank.easement_recorded == false:                                                RESTRICTED
      elif EXISTS RemedialAction ra WHERE MonitoringReport(ra.monitoring_report_id).bank_id == bank.id
             AND ra.status IN {OPEN, WORK_SUBMITTED, REINSPECTION, FAILED}:                RESTRICTED
      elif bank.credits_available == 0:                                                    SOLD_OUT
      else:                                                                                OPEN
    input_set: "MitigationBank.status / easement_recorded / credits_available plus every RemedialAction reachable through the bank's MonitoringReport rows; CLEARED actions are excluded."
    constants: {}
    precision: "exact enum, no arithmetic"
    variants: []

  - name: credit_ledger_balance
    trigger: "Recomputed after every CreditLedgerEntry append (release approval, reservation, execution, assignment, cancellation, expiry, reversal, deferral hold)"
    algorithm: aggregation
    formula: |
      entries = CreditLedgerEntry WHERE bank_id == bank.id, ordered by sequence_number ASC
      balance_after[n] = SUM(delta_credits of entries 1..n)          # running accumulator
      credits_released = SUM(delta_credits WHERE entry_type == RELEASED)
      credits_sold     = -1 * SUM(delta_credits WHERE entry_type IN {SOLD, SALE_REVERSED})
      credits_on_hold  = -1 * SUM(delta_credits WHERE entry_type IN {HOLD_PLACED, HOLD_RELEASED})
      credits_available = credits_released - credits_sold - credits_on_hold
      # CONSERVED-QUANTITY INVARIANT (never violated by any endpoint):
      #   credits_released == credits_sold + credits_on_hold + credits_available
      #   AND credits_available == balance_after of the highest sequence_number entry of the bank
      # Sequence numbers are assigned per bank starting at 1 in append order; when one request
      # appends several entries (execute appends HOLD_RELEASED then SOLD) the pinned append order
      # determines their sequence_number values and their balance_after values.
    input_set: "Every CreditLedgerEntry of the bank, all of them — the ledger is append-only, so there is no status filter and no entry is ever deleted or mutated."
    constants: {}
    precision: "2 decimal places on every credit quantity; sums of already-2dp values are exact"
    variants: []

  - name: credit_demand_forecast
    trigger: "GET /mitigation/banks/{id}/credit-forecast"
    algorithm: forward_looking
    formula: |
      demand_index = service_area_demand_index(bank)
      trailing_quarter_average_credits = round_half_up(
          SUM(CreditSale.credits_requested WHERE bank_id == bank.id
              AND status IN {EXECUTED, ASSIGNED}
              AND executed_at IN [now - 360d, now)) / 4, 2)
      forecast_horizon_credits = round_half_up(trailing_quarter_average_credits * 4, 2)
      projected_quarters_to_sellout =
          0 if bank.credits_available == 0
          else min(FORECAST_HORIZON_QUARTERS,
                   ceil(bank.credits_available / max(0.01, trailing_quarter_average_credits)))
      # Worked example: no sales at all, credits_available 14.82 ->
      #   trailing average 0.00 -> denominator max(0.01, 0.00) = 0.01 -> ceil(1482) = 1482 -> capped to 40
      # Worked example: one 8.00-credit sale in the window, credits_available 6.82 ->
      #   trailing average = round(8.00/4, 2) = 2.00 -> ceil(6.82/2.00) = ceil(3.41) = 4
    input_set: "CreditSale rows of the bank with status IN {EXECUTED, ASSIGNED} and executed_at inside the trailing 360-day window; plus the bank's current credits_available."
    constants:
      FORECAST_HORIZON_QUARTERS: 40
    precision: "credits at 2 decimals round_half_up; projected_quarters_to_sellout is an integer via ceil"
    variants: []

# ============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority; first failure wins)
# ============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the §1.7 role names."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting role appears in the target endpoint's roles list in §1.5."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 10
    category: existence
    check: "Request body/query conforms to the endpoint's input schema: required fields present, types correct, enum members valid, HUC-8 codes match ^[0-9]{8}$, credits > 0 with at most 2 decimals, cents integers >= 0, release_pct in (0,1], limit in 1..100, offset >= 0, window_end strictly after window_start, credit_strata non-empty with unique stratum_code, measurements with unique standard_code."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 20
    category: existence
    check: "Every id in the path resolves to a live row, validated left-to-right, returning the entity-specific not-found error (ERR_BANK_NOT_FOUND, ERR_PROSPECTUS_NOT_FOUND, ERR_WORK_PLAN_NOT_FOUND, ERR_MILESTONE_NOT_FOUND, ERR_MONITORING_REPORT_NOT_FOUND, ERR_REMEDIAL_ACTION_NOT_FOUND, ERR_CREDIT_SALE_NOT_FOUND, ERR_SPONSOR_NOT_FOUND, ERR_PERMITTEE_NOT_FOUND, ERR_IRT_MEMBER_NOT_FOUND)."
    error_id: ERR_BANK_NOT_FOUND
    http_status: 404
    applies_to: "all paths carrying an {id} segment"

  - priority: 25
    category: existence
    check: "Every foreign key supplied in a request body resolves to a live row (bank_id, permittee_id, sponsor_id, predecessor_milestone_id), returning that entity's not-found error."
    error_id: ERR_BANK_NOT_FOUND
    http_status: 404
    applies_to: "POST /mitigation/banks, /mitigation/prospectuses, /mitigation/work-plans, /mitigation/milestones, /mitigation/monitoring-reports, /mitigation/credit-sales"

  - priority: 30
    category: auth
    check: "Sponsor ownership: the acting Sponsor's X-User-ID equals the sponsor_id of the MitigationBank the operation targets (directly, or via the target row's bank_id, or via MonitoringReport(action.monitoring_report_id).bank_id)."
    error_id: ERR_NOT_BANK_SPONSOR
    http_status: 403
    applies_to: "POST /mitigation/banks, /mitigation/prospectuses*, /mitigation/work-plans*, /mitigation/milestones*, /mitigation/monitoring-reports*, /mitigation/remedial-actions/{id}/submit-work, /mitigation/banks/{id}/conservation-easement, /mitigation/banks/{id}/stewardship-contributions, /mitigation/credit-sales/{id}/execute, /mitigation/credit-sales/{id}/assign"

  - priority: 31
    category: auth
    check: "Permittee ownership: when the acting role is Permittee, X-User-ID equals CreditSale.permittee_id (or the body's permittee_id on quote creation, or the {id} on a deposit)."
    error_id: ERR_NOT_SALE_PERMITTEE
    http_status: 403
    applies_to: "POST /mitigation/credit-sales, /mitigation/credit-sales/{id}/reserve, /mitigation/credit-sales/{id}/cancel, /mitigation/permittees/{id}/deposits"

  - priority: 32
    category: auth
    check: "The acting IRTMember's roster_status is SEATED; a RECUSED member may neither vote nor review a monitoring report nor inspect a remedial action nor approve a release."
    error_id: ERR_MEMBER_RECUSED
    http_status: 403
    applies_to: "POST /mitigation/prospectuses/{id}/votes, /mitigation/monitoring-reports/{id}/review, /mitigation/remedial-actions/{id}/inspect, /mitigation/milestones/{id}/approve-release"

  - priority: 40
    category: state
    check: "The target row is in a state from which the requested transition exists in §1.2, returning the entity-specific state error (ERR_BANK_STATE_INVALID, ERR_PROSPECTUS_STATE_INVALID, ERR_WORK_PLAN_STATE_INVALID, ERR_MILESTONE_STATE_INVALID, ERR_REPORT_STATE_INVALID, ERR_REMEDIAL_STATE_INVALID, ERR_SALE_STATE_INVALID)."
    error_id: ERR_MILESTONE_STATE_INVALID
    http_status: 409
    applies_to: "every state-transition endpoint"

  - priority: 41
    category: state
    check: "Quote creation and reservation require MitigationBank.sales_posture == OPEN; execution requires sales_posture IN {OPEN, SOLD_OUT}. The rejection is keyed on the posture value: FROZEN -> ERR_BANK_SALES_FROZEN, RESTRICTED -> ERR_BANK_SALES_RESTRICTED, SOLD_OUT -> ERR_BANK_SOLD_OUT."
    error_id: ERR_BANK_SALES_RESTRICTED
    http_status: 409
    applies_to: "POST /mitigation/credit-sales, /mitigation/credit-sales/{id}/reserve, /mitigation/credit-sales/{id}/execute"

  - priority: 45
    category: state
    check: "OCC: payload expected_bank_version equals MitigationBank.version at request time (§1.2.1)."
    error_id: ERR_STALE_BANK_VERSION
    http_status: 412
    applies_to: "POST /mitigation/credit-sales, POST /mitigation/milestones/{id}/approve-release"

  - priority: 50
    category: business_safety
    check: "The conservation easement must be recorded before any credit is released: MitigationBank.easement_recorded == true."
    error_id: ERR_EASEMENT_NOT_RECORDED
    http_status: 422
    applies_to: "POST /mitigation/milestones/{id}/approve-release, POST /mitigation/banks/{id}/close"

  - priority: 51
    category: business_safety
    check: "Credits may only be sold into the bank's service area: CreditSale.impact_huc8_code IN MitigationBank.service_area_huc8_codes."
    error_id: ERR_OUTSIDE_SERVICE_AREA
    http_status: 422
    applies_to: "POST /mitigation/credit-sales"

  - priority: 52
    category: business_safety
    check: "Segregation of duties: the acting IRTMember's X-User-ID must not equal verified_by_member_id of any RemedialAction whose deferred_milestone_id is the milestone being released."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /mitigation/milestones/{id}/approve-release"

  - priority: 53
    category: business_safety
    check: "MitigationBank.service_area_huc8_codes must contain MitigationBank.site_huc8_code."
    error_id: ERR_SERVICE_AREA_MISSING_SITE_HUC
    http_status: 422
    applies_to: "POST /mitigation/banks"

  - priority: 55
    category: business_temporal
    check: "MonitoringReport windows of one bank may not overlap. Intervals are HALF-OPEN [window_start, window_end): a new window whose start equals an existing window's end is ACCEPTED (adjacency allowed); any positive-length intersection is rejected. Occupying rows are those with review_status IN {DRAFT, SUBMITTED, ACCEPTED}; RETURNED rows release their slot."
    error_id: ERR_MONITORING_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /mitigation/monitoring-reports"

  - priority: 56
    category: business_temporal
    check: "A reservation hold may not collide with another RESERVED hold of the SAME Permittee. Intervals are CLOSED [hold_start_at, hold_expires_at]: touching endpoints DO collide (a new hold starting exactly at an existing hold's expiry instant is rejected), because the lazy expiry sweep only releases holds whose hold_expires_at is STRICTLY before the clock."
    error_id: ERR_RESERVATION_HOLD_CONFLICT
    http_status: 409
    applies_to: "POST /mitigation/credit-sales/{id}/reserve"

  - priority: 57
    category: business_temporal
    check: "Consecutive ReleaseMilestone performance windows on one bank must be separated by a buffer: new.window_start >= MAX(existing.window_end) + MILESTONE_WINDOW_BUFFER_DAYS (365). Exactly 365 days is ACCEPTED (>=, not >)."
    error_id: ERR_MILESTONE_WINDOW_BUFFER
    http_status: 409
    applies_to: "POST /mitigation/milestones"

  - priority: 58
    category: business_temporal
    check: "A milestone may only be claimed once its window has opened: current logical clock >= milestone.window_start."
    error_id: ERR_MILESTONE_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST /mitigation/milestones/{id}/claim"

  - priority: 59
    category: business_temporal
    check: "Corrective work may only be submitted on or before the remedial due date: current logical clock <= RemedialAction.due_at."
    error_id: ERR_REMEDIAL_PAST_DUE
    http_status: 409
    applies_to: "POST /mitigation/remedial-actions/{id}/submit-work"

  - priority: 60
    category: business_constraint
    check: "MonitoringReport.monitoring_year is unique per bank among reports whose review_status IN {DRAFT, SUBMITTED, ACCEPTED}."
    error_id: ERR_DUPLICATE_MONITORING_YEAR
    http_status: 409
    applies_to: "POST /mitigation/monitoring-reports"

  - priority: 61
    category: business_constraint
    check: "ReleaseMilestone.milestone_code is unique per bank_id."
    error_id: ERR_DUPLICATE_MILESTONE_CODE
    http_status: 409
    applies_to: "POST /mitigation/milestones"

  - priority: 62
    category: business_constraint
    check: "SUM(release_pct) over all ReleaseMilestone rows of the bank, including the row being created, must be <= 1.000."
    error_id: ERR_RELEASE_SCHEDULE_OVERSUBSCRIBED
    http_status: 422
    applies_to: "POST /mitigation/milestones"

  - priority: 63
    category: business_constraint
    check: "A milestone may only be claimed after its predecessor has been released: predecessor_milestone_id is null OR ReleaseMilestone(predecessor_milestone_id).status == APPROVED."
    error_id: ERR_PREDECESSOR_NOT_RELEASED
    http_status: 409
    applies_to: "POST /mitigation/milestones/{id}/claim"

  - priority: 64
    category: business_constraint
    check: "One ProspectusVote per (prospectus_id, irt_member_id, revision_round)."
    error_id: ERR_DUPLICATE_VOTE
    http_status: 409
    applies_to: "POST /mitigation/prospectuses/{id}/votes"

  - priority: 65
    category: business_constraint
    check: "Permittee.permit_number is globally unique."
    error_id: ERR_DUPLICATE_PERMIT_NUMBER
    http_status: 409
    applies_to: "POST /mitigation/permittees"

  - priority: 66
    category: business_constraint
    check: "At most one WorkPlan per bank may reach APPROVED; SUM of WorkPlan.performance_standards[].weight must equal exactly 1.000 (ERR_STANDARD_WEIGHTS_INVALID)."
    error_id: ERR_WORK_PLAN_ALREADY_APPROVED
    http_status: 409
    applies_to: "POST /mitigation/work-plans, POST /mitigation/work-plans/{id}/decide"

  - priority: 70
    category: business_referential
    check: "Prospectus approval requires an existing WorkPlan for the same bank with status IN {SUBMITTED, APPROVED}; instrument execution requires a Prospectus with status == APPROVED (ERR_PROSPECTUS_NOT_APPROVED) and an APPROVED WorkPlan."
    error_id: ERR_WORK_PLAN_MISSING
    http_status: 422
    applies_to: "POST /mitigation/prospectuses/{id}/finalize-review, POST /mitigation/banks/{id}/execute-instrument"

  - priority: 71
    category: business_referential
    check: "Finalizing a review requires votes_cast for the current revision_round >= IRT_QUORUM_MIN (3); exactly 3 is sufficient (>=, not >)."
    error_id: ERR_IRT_QUORUM_NOT_MET
    http_status: 422
    applies_to: "POST /mitigation/prospectuses/{id}/finalize-review"

  - priority: 72
    category: business_referential
    check: "Accepting a monitoring report requires at least one PerformanceStandard with effective_from_year <= monitoring_year (ERR_NO_EFFECTIVE_STANDARDS) and a measurement for every such standard (ERR_MEASUREMENT_MISSING)."
    error_id: ERR_MEASUREMENT_MISSING
    http_status: 422
    applies_to: "POST /mitigation/monitoring-reports/{id}/submit, POST /mitigation/monitoring-reports/{id}/review"

  - priority: 73
    category: business_referential
    check: "Approving a PERF_* milestone release requires an ACCEPTED MonitoringReport for the bank (ERR_NO_ACCEPTED_MONITORING_REPORT) whose compliance_status is PASS or PARTIAL with attainment_score >= 0.85 (ERR_COMPLIANCE_FAILED)."
    error_id: ERR_COMPLIANCE_FAILED
    http_status: 422
    applies_to: "POST /mitigation/milestones/{id}/approve-release"

  - priority: 74
    category: business_referential
    check: "Assignment may not exceed the permit's outstanding obligation: CreditSale.credits_requested <= Permittee.unmet_requirement_credits, checked both at quote creation and at assignment."
    error_id: ERR_ASSIGNMENT_EXCEEDS_REQUIREMENT
    http_status: 422
    applies_to: "POST /mitigation/credit-sales, POST /mitigation/credit-sales/{id}/assign"

  - priority: 75
    category: business_constraint
    check: "Closing a bank requires every ReleaseMilestone of the bank to be APPROVED and no RemedialAction of the bank to be in {OPEN, WORK_SUBMITTED, REINSPECTION, FAILED}."
    error_id: ERR_MILESTONES_INCOMPLETE
    http_status: 409
    applies_to: "POST /mitigation/banks/{id}/close"

  - priority: 80
    category: business_fiscal
    check: "Credit availability: CreditSale.credits_requested <= MitigationBank.credits_available, checked at quote creation and re-checked at reservation. Requesting exactly credits_available is ACCEPTED (<=, not <)."
    error_id: ERR_INSUFFICIENT_CREDITS
    http_status: 422
    applies_to: "POST /mitigation/credit-sales, POST /mitigation/credit-sales/{id}/reserve"

  - priority: 81
    category: business_fiscal
    check: "Escrow sufficiency at execution: Permittee.escrow_balance_cents >= the EXECUTED-variant price computed for this request."
    error_id: ERR_INSUFFICIENT_ESCROW
    http_status: 402
    applies_to: "POST /mitigation/credit-sales/{id}/execute"

  - priority: 82
    category: business_fiscal
    check: "Stewardship funding gate: for milestone_code != PERF_YEAR_10, stewardship_funded_cents >= round_half_up(stewardship_required_cents * 0.25); for PERF_YEAR_10 and for bank closure, stewardship_funded_cents >= stewardship_required_cents."
    error_id: ERR_STEWARDSHIP_UNDERFUNDED
    http_status: 402
    applies_to: "POST /mitigation/milestones/{id}/approve-release, POST /mitigation/banks/{id}/close"

  - priority: 83
    category: business_fiscal
    check: "Instrument execution requires Sponsor.performance_bond_cents >= MIN_PERFORMANCE_BOND_CENTS (25000000)."
    error_id: ERR_PERFORMANCE_BOND_INSUFFICIENT
    http_status: 402
    applies_to: "POST /mitigation/banks/{id}/execute-instrument"

# ============================================================================
# §1.5 Endpoint Inventory
#   All business paths live under api_prefix "/mitigation"; every single-row read
#   is shaped "<prefix>/<collection>/{id}" so that each entity has exactly one
#   canonical collection segment. The only path outside the prefix is the
#   mandatory logical-clock endpoint.
# ============================================================================
endpoints:

  # ---------------------------- reads: parties ----------------------------
  - method: GET
    path: /mitigation/sponsors/{id}
    purpose: "Read one mitigation bank sponsor, including derived banks_count and good_standing."
    input: []
    output: Sponsor
    roles: [ProgramAdmin, Sponsor, IRTChair, IRTMember]
    side_effects: []
    status_codes: {200: "found", 404: "ERR_SPONSOR_NOT_FOUND"}

  - method: GET
    path: /mitigation/permittees/{id}
    purpose: "Read one permittee, including deposited_cents, escrow_balance_cents, assigned_credits and unmet_requirement_credits."
    input: []
    output: Permittee
    roles: [ProgramAdmin, Permittee, Sponsor, IRTChair]
    side_effects: []
    status_codes: {200: "found", 404: "ERR_PERMITTEE_NOT_FOUND"}

  - method: GET
    path: /mitigation/irt-members/{id}
    purpose: "Read one interagency review team member, including veto_authority and roster_status."
    input: []
    output: IRTMember
    roles: [ProgramAdmin, IRTChair, IRTMember]
    side_effects: []
    status_codes: {200: "found", 404: "ERR_IRT_MEMBER_NOT_FOUND"}

  - method: GET
    path: /mitigation/irt-members/{id}/votes
    purpose: "List every prospectus vote cast by one IRT member, ordered by created_at ascending. Reverse-reachability for ProspectusVote.irt_member_id."
    input: ["limit?", "offset?"]
    output: ProspectusVote[]
    roles: [ProgramAdmin, IRTChair, IRTMember]
    side_effects: []
    status_codes: {200: "ok", 404: "ERR_IRT_MEMBER_NOT_FOUND"}

  # ----------------------------- reads: bank ------------------------------
  - method: GET
    path: /mitigation/banks/{id}
    purpose: "Read one mitigation bank with the full credit ledger projection (credits_released / credits_sold / credits_on_hold / credits_available), stewardship funding state, easement state and sales_posture. Also the OCC read for expected_bank_version."
    input: []
    output: MitigationBank
    roles: [ProgramAdmin, Sponsor, Permittee, IRTChair, IRTMember]
    side_effects: []
    status_codes: {200: "found", 404: "ERR_BANK_NOT_FOUND"}

  - method: GET
    path: /mitigation/banks
    purpose: "List mitigation banks, filterable by sponsor. Reverse-reachability for MitigationBank.sponsor_id."
    input: ["sponsor_id?", "status?", "sales_posture?", "limit?", "offset?"]
    output: MitigationBank[]
    roles: [ProgramAdmin, Sponsor, Permittee, IRTChair, IRTMember]
    side_effects: []
    status_codes: {200: "ok", 400: "ERR_INVALID_REQUEST"}

  - method: GET
    path: /mitigation/banks/{id}/prospectuses
    purpose: "List the prospectus revisions of one bank, newest revision_round last. Reverse-reachability for Prospectus.bank_id."
    input: ["status?", "limit?", "offset?"]
    output: Prospectus[]
    roles: [ProgramAdmin, Sponsor, IRTChair, IRTMember]
    side_effects: []
    status_codes: {200: "ok", 404: "ERR_BANK_NOT_FOUND"}

  - method: GET
    path: /mitigation/banks/{id}/work-plans
    purpose: "List the mitigation work plans of one bank. Reverse-reachability for WorkPlan.bank_id."
    input: ["status?", "limit?", "offset?"]
    output: WorkPlan[]
    roles: [ProgramAdmin, Sponsor, IRTChair, IRTMember]
    side_effects: []
    status_codes: {200: "ok", 404: "ERR_BANK_NOT_FOUND"}

  - method: GET
    path: /mitigation/banks/{id}/performance-standards
    purpose: "List the performance standards materialised for one bank when its work plan was approved, ordered by (effective_from_year, standard_code). This is the ONLY way to observe PerformanceStandard rows — they have no create endpoint. Reverse-reachability for PerformanceStandard.bank_id."
    input: ["limit?", "offset?"]
    output: PerformanceStandard[]
    roles: [ProgramAdmin, Sponsor, IRTChair, IRTMember]
    side_effects: []
    status_codes: {200: "ok", 404: "ERR_BANK_NOT_FOUND"}

  - method: GET
    path: /mitigation/banks/{id}/ledger
    purpose: "List the append-only credit ledger of one bank ordered by sequence_number ascending. Reverse-reachability for CreditLedgerEntry.bank_id."
    input: ["entry_type?", "limit?", "offset?"]
    output: CreditLedgerEntry[]
    roles: [ProgramAdmin, Sponsor, IRTChair, IRTMember]
    side_effects: []
    status_codes: {200: "ok", 404: "ERR_BANK_NOT_FOUND"}

  - method: GET
    path: /mitigation/banks/{id}/credit-forecast
    purpose: "Computed read: the credit_demand_forecast calculation for one bank (service-area demand index over the trailing four 90-day quarters, forward-looking horizon and projected quarters to sell-out)."
    input: []
    output: { demand_index: number, trailing_quarter_average_credits: number, forecast_horizon_credits: number, projected_quarters_to_sellout: number, credits_available: number, credits_released: number, credits_sold: number, credits_on_hold: number }
    roles: [ProgramAdmin, Sponsor, IRTChair, IRTMember]
    side_effects: []
    status_codes: {200: "ok", 404: "ERR_BANK_NOT_FOUND"}

  # -------------------- reads: review / performance -----------------------
  - method: GET
    path: /mitigation/prospectuses/{id}
    purpose: "Read one prospectus with its vote tallies, revision_round and veto flag."
    input: []
    output: Prospectus
    roles: [ProgramAdmin, Sponsor, IRTChair, IRTMember]
    side_effects: []
    status_codes: {200: "found", 404: "ERR_PROSPECTUS_NOT_FOUND"}

  - method: GET
    path: /mitigation/prospectuses/{id}/votes
    purpose: "List the votes recorded against one prospectus across all revision rounds. Reverse-reachability for ProspectusVote.prospectus_id."
    input: ["limit?", "offset?"]
    output: ProspectusVote[]
