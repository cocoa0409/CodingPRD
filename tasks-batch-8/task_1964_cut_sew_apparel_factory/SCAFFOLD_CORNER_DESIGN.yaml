# =============================================================================
# Task 1964 — Cut-&-Sew Apparel Factory — §1.9 Scaffold Corner Design
# (Breadth coverage of §1.1–§1.7 claims not exercised by §1.8)
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_style_applies_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.Style]
        distinguishing_aspect: "201 create returns server-minted id, version == 1, created_at present; status DRAFT, certification_status UNCERTIFIED, content_qualification UNDETERMINED, active_tech_pack_id null; created_by_user_id echoes X-User-ID."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /styles", payload: { style_code: "ST-E1", base_size: "M", size_run: ["S","M","L"], declared_fabric_domestic: true, target_content_claim: "NONE" }, as: Merchandiser, as_user_id: u-m1, captures: { st: $.data.id } }
          assert:
            - "Style.${st}.version == 1 and id/created_at/updated_at populated (created_at == updated_at)"
            - "status == DRAFT; certification_status == UNCERTIFIED; content_qualification == UNDETERMINED"
            - "domestic_content_pct_cost == null; domestic_component_ratio == null; active_tech_pack_id == null"
            - "created_by_user_id == 'u-m1'"

      - name: create_style_missing_required_style_code_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Style.fields.style_code, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting style_code (source input, no default) rejects with ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /styles", payload: { base_size: "M", size_run: ["M"], declared_fabric_domestic: true, target_content_claim: "NONE" }, as: Merchandiser, captures: { err: $.data.error_id } }
          assert: ["err == ERR_INVALID_REQUEST"]

      - name: create_operation_spec_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.OperationSpec.fields.machine_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "machine_type 'GLUE' is outside the declared enum -> ERR_INVALID_REQUEST before any state check."
        test_recipe:
          setup: ["style + DRAFT pack"]
          setup_api_calls:
            - { call: "POST /styles", payload: { style_code: "ST-E2", base_size: "M", size_run: ["M"], declared_fabric_domestic: true, target_content_claim: "NONE" }, as: Merchandiser, captures: { st: $.data.id } }
            - { call: "POST /tech-packs", payload: { style_id: "${st}", version_no: 1, base_measurements: [{ point: "chest", base_value_in: 20.0 }], grade_rules: [], labor_cost_cents_per_unit: 800, fabric_cost_cents_per_unit: 500 }, as: Merchandiser, as_user_id: u-m1, captures: { tp: $.data.id } }
          trigger:
            - { call: "POST /operation-specs", payload: { tech_pack_id: "${tp}", sequence_no: 1, name: "glue seam", machine_type: "GLUE", sam_seconds: 60, piece_rate_cents: 10 }, as: Merchandiser, captures: { err: $.data.error_id } }
          assert: ["err == ERR_INVALID_REQUEST"]

      - name: trim_item_computed_quantities_track_receipts
        claim_type: computed_fields
        grounds: [entities.TrimItem.fields.qty_available]
        distinguishing_aspect: "qty_on_hand starts 0 regardless of client input; receive +7 yields qty_on_hand == 7, qty_reserved == 0, qty_available == 7."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /trim-items", payload: { sku_code: "TI-E4", description: "button", origin_country: "US", unit_cost_cents: 10 }, as: MaterialsPlanner, captures: { ti: $.data.id } }
          trigger:
            - { call: "POST /trim-items/${ti}/receive", payload: { qty: 7 }, as: MaterialsPlanner }
          assert:
            - "at create: qty_on_hand == 0, qty_available == 0"
            - "after receive: TrimItem.${ti}.qty_on_hand == 7, qty_reserved == 0, qty_available == 7, version incremented"

      - name: create_tech_pack_with_bogus_style_returns_not_found
        claim_type: parent_relationships
        grounds: [entities.TechPack.fields.style_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Body FK style_id referencing a missing style -> ERR_NOT_FOUND 404 (existence priority 3)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /tech-packs", payload: { style_id: "00000000-0000-4000-8000-000000000000", version_no: 1, base_measurements: [{ point: "chest", base_value_in: 20.0 }], grade_rules: [], labor_cost_cents_per_unit: 800, fabric_cost_cents_per_unit: 500 }, as: Merchandiser, captures: { err: $.data.error_id } }
          assert: ["err == ERR_NOT_FOUND"]

      - name: get_missing_marker_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but absent marker id -> ERR_NOT_FOUND 404 with error envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /markers/00000000-0000-4000-8000-000000000000", as: Any, captures: { err: $.data.error_id } }
          assert: ["err == ERR_NOT_FOUND and http status 404"]

  - section: state_machines
    instances:
      - name: submit_pending_pack_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.TechPack.DRAFT_to_PENDING_APPROVAL, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "submit from PENDING_APPROVAL (not DRAFT) -> ERR_INVALID_STATE_TRANSITION 409; pack state unchanged."
        test_recipe:
          setup: ["pack with one op, submitted once"]
          setup_api_calls:
            - { call: "POST /styles", payload: { style_code: "ST-S1", base_size: "M", size_run: ["M"], declared_fabric_domestic: true, target_content_claim: "NONE" }, as: Merchandiser, captures: { st: $.data.id } }
            - { call: "POST /tech-packs", payload: { style_id: "${st}", version_no: 1, base_measurements: [{ point: "chest", base_value_in: 20.0 }], grade_rules: [], labor_cost_cents_per_unit: 800, fabric_cost_cents_per_unit: 500 }, as: Merchandiser, as_user_id: u-m1, captures: { tp: $.data.id } }
            - { call: "POST /operation-specs", payload: { tech_pack_id: "${tp}", sequence_no: 1, name: "join", machine_type: "MANUAL", sam_seconds: 60, piece_rate_cents: 10 }, as: Merchandiser }
            - { call: "POST /tech-packs/${tp}/submit", payload: {}, as: Merchandiser }
          trigger:
            - { call: "POST /tech-packs/${tp}/submit", payload: {}, as: Merchandiser, captures: { err: $.data.error_id } }
          assert: ["err == ERR_INVALID_STATE_TRANSITION", "TechPack.${tp}.status == PENDING_APPROVAL"]

      - name: cut_cancelled_marker_returns_marker_not_approved
        claim_type: terminal_lockdown
        grounds: [state_machines.Marker.APPROVED_to_CUT, "errors[ERR_MARKER_NOT_APPROVED]"]
        distinguishing_aspect: "cancel from DRAFT lands in terminal CANCELLED; subsequent cut -> ERR_MARKER_NOT_APPROVED."
        test_recipe:
          setup: ["order + roll AVAILABLE + DRAFT marker, then cancelled"]
          setup_api_calls:
            - { call: "POST /styles", payload: { style_code: "ST-S2", base_size: "M", size_run: ["M"], declared_fabric_domestic: true, target_content_claim: "NONE" }, as: Merchandiser, captures: { st: $.data.id } }
            - { call: "POST /production-orders", payload: { style_id: "${st}", color: "navy", size_quantities: [{ size: "M", qty: 10 }] }, as: ProductionPlanner, captures: { po: $.data.id } }
            - { call: "POST /fabric-rolls", payload: { roll_code: "R1", fabric_code: "DEN", origin_country: "US", cost_cents_per_yard: 200, received_yards: 41.3 }, as: MaterialsPlanner, captures: { fr: $.data.id } }
            - { call: "POST /fabric-rolls/${fr}/record-qc", payload: { result: "PASS" }, as: MaterialsPlanner }
            - { call: "POST /markers", payload: { production_order_id: "${po}", fabric_roll_id: "${fr}", marker_length_yards: 40.0, planned_pieces: 10 }, as: CuttingManager, captures: { mk: $.data.id } }
            - { call: "POST /markers/${mk}/cancel", payload: {}, as: CuttingManager }
          trigger:
            - { call: "POST /markers/${mk}/cut", payload: { size_quantities: [{ size: "M", qty: 10 }] }, as: CuttingManager, captures: { err: $.data.error_id } }
          assert: ["err == ERR_MARKER_NOT_APPROVED", "Marker.${mk}.status == CANCELLED"]

      - name: pay_open_run_returns_payroll_not_approved
        claim_type: invalid_transition
        grounds: [state_machines.PayrollRun.APPROVED_to_PAID, "errors[ERR_PAYROLL_NOT_APPROVED]"]
        distinguishing_aspect: "pay from OPEN (skipping calculate/decide) -> ERR_PAYROLL_NOT_APPROVED 409."
        test_recipe:
          setup: ["OPEN payroll run"]
          setup_api_calls:
            - { call: "POST /payroll-runs", payload: { period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollClerk, as_user_id: u-pc1, captures: { pr: $.data.id } }
          trigger:
            - { call: "POST /payroll-runs/${pr}/pay", payload: {}, as: PayrollClerk, as_user_id: u-pc1, captures: { err: $.data.error_id } }
          assert: ["err == ERR_PAYROLL_NOT_APPROVED"]

      - name: record_qc_on_rejected_roll_returns_invalid_state
        claim_type: terminal_lockdown
        grounds: [state_machines.FabricRoll.RECEIVED_to_REJECTED, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "REJECTED is terminal: a second record-qc -> ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["roll QC-failed"]
          setup_api_calls:
            - { call: "POST /fabric-rolls", payload: { roll_code: "R1", fabric_code: "DEN", origin_country: "US", cost_cents_per_yard: 200, received_yards: 41.3 }, as: MaterialsPlanner, captures: { fr: $.data.id } }
            - { call: "POST /fabric-rolls/${fr}/record-qc", payload: { result: "FAIL" }, as: MaterialsPlanner }
          trigger:
            - { call: "POST /fabric-rolls/${fr}/record-qc", payload: { result: "PASS" }, as: MaterialsPlanner, captures: { err: $.data.error_id } }
          assert: ["err == ERR_INVALID_STATE_TRANSITION", "FabricRoll.${fr}.status == REJECTED and usable_yards == 0"]

      - name: review_superseded_pack_returns_not_pending_review
        claim_type: terminal_lockdown
        grounds: [state_machines.TechPack.APPROVED_to_SUPERSEDED, "errors[ERR_TECH_PACK_NOT_PENDING_REVIEW]"]
        distinguishing_aspect: "Reviewing a SUPERSEDED pack -> ERR_TECH_PACK_NOT_PENDING_REVIEW (terminal state lockdown)."
        test_recipe:
          setup: ["packs v1 and v2 both approved in turn; v1 SUPERSEDED"]
          setup_api_calls:
            - { call: "POST /styles", payload: { style_code: "ST-S5", base_size: "M", size_run: ["M"], declared_fabric_domestic: true, target_content_claim: "NONE" }, as: Merchandiser, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /tech-packs", payload: { style_id: "${st}", version_no: 1, base_measurements: [{ point: "chest", base_value_in: 20.0 }], grade_rules: [], labor_cost_cents_per_unit: 800, fabric_cost_cents_per_unit: 500 }, as: Merchandiser, as_user_id: u-m1, captures: { tpA: $.data.id } }
            - { call: "POST /operation-specs", payload: { tech_pack_id: "${tpA}", sequence_no: 1, name: "join", machine_type: "MANUAL", sam_seconds: 60, piece_rate_cents: 10 }, as: Merchandiser }
            - { call: "POST /tech-packs/${tpA}/submit", payload: {}, as: Merchandiser }
            - { call: "POST /tech-packs/${tpA}/review", payload: { decision: "APPROVE", expected_style_version: "${st_v}" }, as: PlantManager, as_user_id: u-pm1 }
            - { call: "POST /tech-packs", payload: { style_id: "${st}", version_no: 2, base_measurements: [{ point: "chest", base_value_in: 20.0 }], grade_rules: [], labor_cost_cents_per_unit: 800, fabric_cost_cents_per_unit: 500 }, as: Merchandiser, as_user_id: u-m1, captures: { tpB: $.data.id } }
            - { call: "POST /operation-specs", payload: { tech_pack_id: "${tpB}", sequence_no: 1, name: "join", machine_type: "MANUAL", sam_seconds: 60, piece_rate_cents: 10 }, as: Merchandiser }
            - { call: "POST /tech-packs/${tpB}/submit", payload: {}, as: Merchandiser }
            - { call: "GET /styles/${st}", as: Any, captures: { st_v2: $.data.version } }
            - { call: "POST /tech-packs/${tpB}/review", payload: { decision: "APPROVE", expected_style_version: "${st_v2}" }, as: PlantManager, as_user_id: u-pm1 }
            - { call: "GET /styles/${st}", as: Any, captures: { st_v3: $.data.version } }
          trigger:
            - { call: "POST /tech-packs/${tpA}/review", payload: { decision: "APPROVE", expected_style_version: "${st_v3}" }, as: PlantManager, as_user_id: u-pm1, captures: { err: $.data.error_id } }
          assert: ["err == ERR_TECH_PACK_NOT_PENDING_REVIEW", "TechPack.${tpA}.status == SUPERSEDED"]

      - name: bundle_created_in_ticketed_initial_state
        claim_type: initial_state
        grounds: [state_machines.Bundle, entities.Bundle.fields.ticket_no]
        distinguishing_aspect: "Bundles created by cut start TICKETED with version 1, server-minted ticket_no, completed_through_seq == 0, pre_rework_status null."
        test_recipe:
          setup: ["approved 1-op pack; planned order 4xM; approved marker; order CUTTING"]
          setup_api_calls:
            - { call: "POST /styles", payload: { style_code: "ST-S6", base_size: "M", size_run: ["M"], declared_fabric_domestic: true, target_content_claim: "NONE" }, as: Merchandiser, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /tech-packs", payload: { style_id: "${st}", version_no: 1, base_measurements: [{ point: "chest", base_value_in: 20.0 }], grade_rules: [], labor_cost_cents_per_unit: 800, fabric_cost_cents_per_unit: 500 }, as: Merchandiser, as_user_id: u-m1, captures: { tp: $.data.id } }
            - { call: "POST /operation-specs", payload: { tech_pack_id: "${tp}", sequence_no: 1, name: "join", machine_type: "MANUAL", sam_seconds: 60, piece_rate_cents: 10 }, as: Merchandiser }
            - { call: "POST /tech-packs/${tp}/submit", payload: {}, as: Merchandiser }
            - { call: "POST /tech-packs/${tp}/review", payload: { decision: "APPROVE", expected_style_version: "${st_v}" }, as: PlantManager, as_user_id: u-pm1 }
            - { call: "POST /production-orders", payload: { style_id: "${st}", color: "navy", size_quantities: [{ size: "M", qty: 4 }] }, as: ProductionPlanner, captures: { po: $.data.id } }
            - { call: "POST /production-orders/${po}/plan", payload: { tech_pack_id: "${tp}" }, as: ProductionPlanner }
            - { call: "POST /fabric-rolls", payload: { roll_code: "R1", fabric_code: "DEN", origin_country: "US", cost_cents_per_yard: 200, received_yards: 41.3 }, as: MaterialsPlanner, captures: { fr: $.data.id } }
            - { call: "POST /fabric-rolls/${fr}/record-qc", payload: { result: "PASS" }, as: MaterialsPlanner, captures: { fr_v: $.data.version } }
            - { call: "POST /markers", payload: { production_order_id: "${po}", fabric_roll_id: "${fr}", marker_length_yards: 40.0, planned_pieces: 4 }, as: CuttingManager, captures: { mk: $.data.id } }
            - { call: "POST /markers/${mk}/approve", payload: { expected_fabric_roll_version: "${fr_v}" }, as: CuttingManager }
            - { call: "POST /production-orders/${po}/start-cutting", payload: {}, as: ProductionPlanner }
          trigger:
            - { call: "POST /markers/${mk}/cut", payload: { size_quantities: [{ size: "M", qty: 4 }] }, as: CuttingManager }
            - { call: "GET /bundles?marker_id=${mk}", as: Any, captures: { b1: "$.data[0].id" } }
          assert:
            - "Bundle.${b1}.status == TICKETED, version == 1, qty == 4, size == 'M'"
            - "ticket_no non-empty and unique; completed_through_seq == 0; pre_rework_status == null"

      - name: bundle_auto_in_progress_on_first_piece_work_log
        claim_type: side_effect_execution
        grounds: [state_machines.Bundle.RELEASED_to_IN_PROGRESS]
        distinguishing_aspect: "First LOGGED entry flips RELEASED -> IN_PROGRESS automatically; order already SEWING from release."
        test_recipe:
          setup: ["approved 1-op pack; order 4xM; bundle released; operator with assignment on 2026-08-03"]
          setup_api_calls:
            - { call: "POST /styles", payload: { style_code: "ST-S7", base_size: "M", size_run: ["M"], declared_fabric_domestic: true, target_content_claim: "NONE" }, as: Merchandiser, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /tech-packs", payload: { style_id: "${st}", version_no: 1, base_measurements: [{ point: "chest", base_value_in: 20.0 }], grade_rules: [], labor_cost_cents_per_unit: 800, fabric_cost_cents_per_unit: 500 }, as: Merchandiser, as_user_id: u-m1, captures: { tp: $.data.id } }
            - { call: "POST /operation-specs", payload: { tech_pack_id: "${tp}", sequence_no: 1, name: "join", machine_type: "MANUAL", sam_seconds: 60, piece_rate_cents: 10 }, as: Merchandiser, captures: { op1: $.data.id } }
            - { call: "POST /tech-packs/${tp}/submit", payload: {}, as: Merchandiser }
            - { call: "POST /tech-packs/${tp}/review", payload: { decision: "APPROVE", expected_style_version: "${st_v}" }, as: PlantManager, as_user_id: u-pm1 }
            - { call: "POST /production-orders", payload: { style_id: "${st}", color: "navy", size_quantities: [{ size: "M", qty: 4 }] }, as: ProductionPlanner, captures: { po: $.data.id } }
            - { call: "POST /production-orders/${po}/plan", payload: { tech_pack_id: "${tp}" }, as: ProductionPlanner }
            - { call: "POST /fabric-rolls", payload: { roll_code: "R1", fabric_code: "DEN", origin_country: "US", cost_cents_per_yard: 200, received_yards: 41.3 }, as: MaterialsPlanner, captures: { fr: $.data.id } }
            - { call: "POST /fabric-rolls/${fr}/record-qc", payload: { result: "PASS" }, as: MaterialsPlanner, captures: { fr_v: $.data.version } }
            - { call: "POST /markers", payload: { production_order_id: "${po}", fabric_roll_id: "${fr}", marker_length_yards: 40.0, planned_pieces: 4 }, as: CuttingManager, captures: { mk: $.data.id } }
            - { call: "POST /markers/${mk}/approve", payload: { expected_fabric_roll_version: "${fr_v}" }, as: CuttingManager }
            - { call: "POST /production-orders/${po}/start-cutting", payload: {}, as: ProductionPlanner }
            - { call: "POST /markers/${mk}/cut", payload: { size_quantities: [{ size: "M", qty: 4 }] }, as: CuttingManager }
            - { call: "GET /bundles?marker_id=${mk}", as: Any, captures: { b1: "$.data[0].id" } }
            - { call: "POST /bundles/${b1}/release", payload: {}, as: LineSupervisor }
            - { call: "POST /operators", payload: { employee_no: "E1", full_name: "Ann" }, as: LineSupervisor, captures: { opr: $.data.id } }
            - { call: "POST /sewing-lines", payload: { line_code: "L1", station_count: 2, shift_minutes: 480 }, as: ProductionPlanner, captures: { ln: $.data.id } }
            - { call: "POST /line-assignments", payload: { sewing_line_id: "${ln}", production_order_id: "${po}", operation_spec_id: "${op1}", operator_id: "${opr}", shift_date: "2026-08-03", start_minute: 480, end_minute: 580, assigned_pieces: 4 }, as: LineSupervisor }
          trigger:
            - { call: "POST /piece-work-entries", payload: { bundle_id: "${b1}", operation_spec_id: "${op1}", work_date: "2026-08-03", qty: 1 }, as: SewingOperator, as_user_id: "${opr}", captures: { pe: $.data.id } }
          assert:
            - "Bundle.${b1}.status == IN_PROGRESS (auto on first log)"
            - "ProductionOrder.${po}.production_status == SEWING (auto on first release, still SEWING)"
            - "PieceWorkEntry.${pe}.status == LOGGED, piece_earnings_cents == 10, earned_minutes == 1.0"

      - name: bundle_auto_completed_when_all_operations_verified
        claim_type: side_effect_execution
        grounds: [state_machines.Bundle.IN_PROGRESS_to_COMPLETED, entities.Bundle.fields.completed_through_seq]
        distinguishing_aspect: "Bubble-up: verifying the last operation's full qty auto-completes the bundle; completed_through_seq jumps 0 -> 1 only at verification, not at log."
        test_recipe:
          setup: ["as previous; entry qty 4 (full bundle) LOGGED but not yet verified"]
          setup_api_calls:
            - { call: "POST /styles", payload: { style_code: "ST-S8", base_size: "M", size_run: ["M"], declared_fabric_domestic: true, target_content_claim: "NONE" }, as: Merchandiser, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /tech-packs", payload: { style_id: "${st}", version_no: 1, base_measurements: [{ point: "chest", base_value_in: 20.0 }], grade_rules: [], labor_cost_cents_per_unit: 800, fabric_cost_cents_per_unit: 500 }, as: Merchandiser, as_user_id: u-m1, captures: { tp: $.data.id } }
            - { call: "POST /operation-specs", payload: { tech_pack_id: "${tp}", sequence_no: 1, name: "join", machine_type: "MANUAL", sam_seconds: 60, piece_rate_cents: 10 }, as: Merchandiser, captures: { op1: $.data.id } }
            - { call: "POST /tech-packs/${tp}/submit", payload: {}, as: Merchandiser }
            - { call: "POST /tech-packs/${tp}/review", payload: { decision: "APPROVE", expected_style_version: "${st_v}" }, as: PlantManager, as_user_id: u-pm1 }
            - { call: "POST /production-orders", payload: { style_id: "${st}", color: "navy", size_quantities: [{ size: "M", qty: 4 }] }, as: ProductionPlanner, captures: { po: $.data.id } }
            - { call: "POST /production-orders/${po}/plan", payload: { tech_pack_id: "${tp}" }, as: ProductionPlanner }
            - { call: "POST /fabric-rolls", payload: { roll_code: "R1", fabric_code: "DEN", origin_country: "US", cost_cents_per_yard: 200, received_yards: 41.3 }, as: MaterialsPlanner, captures: { fr: $.data.id } }
            - { call: "POST /fabric-rolls/${fr}/record-qc", payload: { result: "PASS" }, as: MaterialsPlanner, captures: { fr_v: $.data.version } }
            - { call: "POST /markers", payload: { production_order_id: "${po}", fabric_roll_id: "${fr}", marker_length_yards: 40.0, planned_pieces: 4 }, as: CuttingManager, captures: { mk: $.data.id } }
            - { call: "POST /markers/${mk}/approve", payload: { expected_fabric_roll_version: "${fr_v}" }, as: CuttingManager }
            - { call: "POST /production-orders/${po}/start-cutting", payload: {}, as: ProductionPlanner }
            - { call: "POST /markers/${mk}/cut", payload: { size_quantities: [{ size: "M", qty: 4 }] }, as: CuttingManager }
            - { call: "GET /bundles?marker_id=${mk}", as: Any, captures: { b1: "$.data[0].id" } }
            - { call: "POST /bundles/${b1}/release", payload: {}, as: LineSupervisor }
            - { call: "POST /operators", payload: { employee_no: "E1", full_name: "Ann" }, as: LineSupervisor, captures: { opr: $.data.id } }
            - { call: "POST /sewing-lines", payload: { line_code: "L1", station_count: 2, shift_minutes: 480 }, as: ProductionPlanner, captures: { ln: $.data.id } }
            - { call: "POST /line-assignments", payload: { sewing_line_id: "${ln}", production_order_id: "${po}", operation_spec_id: "${op1}", operator_id: "${opr}", shift_date: "2026-08-03", start_minute: 480, end_minute: 580, assigned_pieces: 4 }, as: LineSupervisor }
