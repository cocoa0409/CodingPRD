  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_split_set_create_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[split-set-create-stale-work]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on Work.version: a second split-set create carrying the pre-first-create version is rejected with 412; the same create with the fresh version succeeds."
        test_recipe:
          setup: ["Writer W1; Work K (version v0 captured at create)"]
          setup_api_calls:
            - { call: "POST /writers", payload: { legal_name: "W1", ipi_number: "00000060001", pro_affiliation: "ASCAP" }, as: PublisherAdmin, captures: { w1: $.data.id } }
            - { call: "POST /works", payload: { title: "OCC Song", grant_date: "1990-06-15T00:00:00Z" }, as: PublisherAdmin, captures: { k: $.data.id, k_v0: $.data.version } }
          trigger:
            - { call: "POST /split-sets", payload: { work_id: "${k}", expected_work_version: "${k_v0}", lines: [ { participant_type: WRITER, writer_id: "${w1}", share_bp: 10000 }, { participant_type: PUBLISHER, publisher_name: "OurPub", share_bp: 10000 } ] }, as: PublisherAdmin, captures: { ssa: $.data.id } }
            - { call: "POST /split-sets", payload: { work_id: "${k}", expected_work_version: "${k_v0}", lines: [ { participant_type: WRITER, writer_id: "${w1}", share_bp: 10000 }, { participant_type: PUBLISHER, publisher_name: "OurPub", share_bp: 10000 } ] }, as: PublisherAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /works/${k}", as: PublisherAdmin, captures: { k_v1: $.data.version } }
            - { call: "POST /split-sets", payload: { work_id: "${k}", expected_work_version: "${k_v1}", lines: [ { participant_type: WRITER, writer_id: "${w1}", share_bp: 10000 }, { participant_type: PUBLISHER, publisher_name: "OurPub", share_bp: 10000 } ] }, as: PublisherAdmin, captures: { ssb: $.data.id } }
            - { call: "GET /works/${k}", as: PublisherAdmin, captures: { k_v2: $.data.version } }
          assert:
            - "${ssa} created (201): first create at the observed version succeeds and increments Work.version"
            - "${err} == ERR_STALE_VERSION (412): the second create's ${k_v0} is stale after the first create bumped the version"
            - "${ssb} created (201) with the fresh version ${k_v1}"
            - "${k_v2} == ${k_v1} + 1 (every successful create bumps the parent version)"

      - name: occ_advance_create_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[advance-create-stale-writer]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on Writer.version (different parent entity than the split-set rule): stale expected_writer_version yields 412."
        test_recipe:
          setup: ["Writer W (version w_v0 captured at create)"]
          setup_api_calls:
            - { call: "POST /writers", payload: { legal_name: "W", ipi_number: "00000060002", pro_affiliation: "ASCAP" }, as: PublisherAdmin, captures: { w: $.data.id, w_v0: $.data.version } }
          trigger:
            - { call: "POST /advances", payload: { writer_id: "${w}", expected_writer_version: "${w_v0}", agreement_ref: "A1", amount_cents: 1000 }, as: PublisherAdmin, captures: { a1: $.data.id } }
            - { call: "POST /advances", payload: { writer_id: "${w}", expected_writer_version: "${w_v0}", agreement_ref: "A2", amount_cents: 2000 }, as: PublisherAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /writers/${w}", as: PublisherAdmin, captures: { w_v1: $.data.version } }
            - { call: "POST /advances", payload: { writer_id: "${w}", expected_writer_version: "${w_v1}", agreement_ref: "A2", amount_cents: 2000 }, as: PublisherAdmin, captures: { a2: $.data.id } }
          assert:
            - "${err} == ERR_STALE_VERSION (412) for the stale second create"
            - "${a2} created (201) once the fresh version ${w_v1} is supplied"

      - name: derived_fields_reconciled_after_amendment_supersede
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.work_royalty_rollup
          - calculations.writer_balance_rollup
          - state_machines.RoyaltyStatement.FINALIZED_to_SUPERSEDED
          - entities.AllocationLine.fields.status
        distinguishing_aspect: "Derived-field reconciliation across a compensating pair: finalize raises work/writer rollups; amendment-supersede recomputes them back to zero and marks the allocation rows REVERSED."
        test_recipe:
          setup: ["Writer W (no advances); REGISTERED work K (W 10000bp); S1 (Q1, one line 2000) FINALIZED; then S2 created amending S1"]
          setup_api_calls:
            - { call: "POST /writers", payload: { legal_name: "W", ipi_number: "00000060003", pro_affiliation: "ASCAP" }, as: PublisherAdmin, captures: { w: $.data.id } }
            - { call: "POST /works", payload: { title: "Reconcile Song", grant_date: "1990-06-15T00:00:00Z" }, as: PublisherAdmin, captures: { k: $.data.id, k_code: $.data.work_code, k_v: $.data.version } }
            - { call: "POST /split-sets", payload: { work_id: "${k}", expected_work_version: "${k_v}", lines: [ { participant_type: WRITER, writer_id: "${w}", share_bp: 10000 }, { participant_type: PUBLISHER, publisher_name: "OurPub", share_bp: 10000 } ] }, as: PublisherAdmin, captures: { ss: $.data.id } }
            - { call: "POST /split-sets/${ss}/submit", payload: {}, as: PublisherAdmin }
            - { call: "GET /split-lines?split_set_id=${ss}", as: PublisherAdmin, captures: { l1: "$.data[0].id", l2: "$.data[1].id" } }
            - { call: "POST /split-lines/${l1}/confirm", payload: {}, as: Writer, as_user_id: "${w}" }
            - { call: "POST /split-lines/${l2}/confirm", payload: {}, as: PublisherAdmin }
            - { call: "POST /societies", payload: { name: "ASCAP", code: "ASCAP", society_type: "PRO", territory_code: "US" }, as: PublisherAdmin, captures: { soc: $.data.id } }
            - { call: "POST /society-registrations", payload: { work_id: "${k}", society_id: "${soc}" }, as: CopyrightSpecialist, captures: { reg: $.data.id } }
            - { call: "POST /society-registrations/${reg}/submit", payload: {}, as: CopyrightSpecialist }
            - { call: "POST /society-registrations/${reg}/acknowledge", payload: { society_work_number: "880000600" }, as: CopyrightSpecialist }
            - { call: "POST /society-registrations/${reg}/register", payload: { iswc: "T-900000600-6" }, as: CopyrightSpecialist }
            - { call: "POST /licensees", payload: { name: "StreamCo", licensee_type: "STREAMING" }, as: PublisherAdmin, captures: { lic: $.data.id } }
            - { call: "POST /royalty-statements", payload: { source_type: "LICENSEE", source_id: "${lic}", income_type: "PERFORMANCE", territory_code: "US", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T23:59:59Z", gross_amount_cents: 2000, lines: [ { line_number: 1, reported_title: "Reconcile Song", reported_work_code: "${k_code}", gross_cents: 2000 } ] }, as: RoyaltyAnalyst, captures: { s1: $.data.id } }
            - { call: "POST /royalty-statements/${s1}/match", payload: {}, as: RoyaltyAnalyst }
            - { call: "POST /royalty-statements/${s1}/allocate", payload: {}, as: RoyaltyAnalyst }
            - { call: "POST /royalty-statements/${s1}/finalize", payload: {}, as: RoyaltyAnalyst }
          trigger:
            - { call: "POST /royalty-statements", payload: { source_type: "LICENSEE", source_id: "${lic}", income_type: "PERFORMANCE", territory_code: "US", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T23:59:59Z", gross_amount_cents: 2000, amends_statement_id: "${s1}", lines: [ { line_number: 1, reported_title: "Reconcile Song", reported_work_code: "${k_code}", gross_cents: 2000 } ] }, as: RoyaltyAnalyst, captures: { s2: $.data.id } }
            - { call: "GET /allocation-lines?statement_id=${s1}", as: RoyaltyAnalyst, captures: { al0: "$.data[0].status", al1: "$.data[1].status" } }
            - { call: "GET /works/${k}", as: PublisherAdmin, captures: { coll: $.data.total_collected_cents } }
            - { call: "GET /writers/${w}", as: PublisherAdmin, captures: { pay: $.data.payable_balance_cents, life: $.data.lifetime_earned_cents } }
          assert:
            - "Before supersede (post-finalize): work.total_collected_cents was 2000, writer payable 1000, lifetime 1000"
            - "${al0} == REVERSED and ${al1} == REVERSED (both allocation rows reversed)"
            - "${coll} == 0 and ${pay} == 0 and ${life} == 0 (rollups fully reconciled after the compensating action)"

      - name: cascading_side_effects_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.RoyaltyStatement.ALLOCATED_to_FINALIZED
          - state_machines.TerminationClaim.NOTICE_FILED_to_EFFECTIVE
        excluded_because:
          difficulty_instance: "transitive_cascade / statement_finalize_recoupment_chain and termination_effective_rights_reversion_chain"
          rationale: "The two depth>=3 cascade chains are asserted hop-by-hop as §1.8 instances."

