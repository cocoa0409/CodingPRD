# =============================================================================
# task_0788 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids × 2 instances = 18 instances. Grounds resolve into SCAFFOLD.yaml.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: subscription_refund_prorata_variant_on_subscription
        grounds:
          - calculations.subscription_refund
          - entities.Subscription.fields.refund_policy
          - entities.Subscription.fields.last_refund_cents
          - state_machines.Subscription.TRIALING_to_CANCELED
        distinguishing_aspect: |
          The dual-variant calc operates on the Subscription (fiscal) domain: with identical inputs
          IMMEDIATE_PRORATA refunds 800 cents whereas FORFEIT refunds 0 for the same period and fee.
        test_recipe:
          setup:
            - "Clock at 2026-06-01; a PLUS subscription (monthly_fee 1200, refund_policy=IMMEDIATE_PRORATA) with period [2026-06-01, 2026-07-01), status TRIALING; clock then advanced to 2026-06-11 (20 days remain)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /legacy/plans"
              payload: { owner_full_name: "Ada Owner", owner_email: "ada@x.com" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /legacy/subscriptions"
              payload: { plan_id: "${plan_id}", tier: "PLUS", refund_policy: "IMMEDIATE_PRORATA" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /legacy/subscriptions/${sub_id}/cancel"
              payload: {}
              as: Owner
              as_user_id: "${plan_id}"
          assert:
            - "Subscription.${sub_id}.last_refund_cents == 800"
            - "Subscription.${sub_id}.status == CANCELED"

      - name: beneficiary_allocation_net_variant_on_estate
        grounds:
          - calculations.beneficiary_allocation
          - entities.VaultItem.fields.distribution_basis
          - entities.Beneficiary.fields.allocated_value_cents
          - state_machines.VaultItem.SEALED_to_RELEASED
        distinguishing_aspect: |
          The dual-variant calc operates on the Beneficiary/ASSET estate domain (a different domain than
          the subscription refund): NET distribution deducts the 1-cent liability so B3 receives 1999,
          whereas GROSS would give B3 2000 for identical allocation_pct.
        test_recipe:
          setup:
            - "Deceased plan with a SEALED ASSET (gross 10000, liability 1, distribution_basis=NET, net 9999) and three NOMINATED beneficiaries linked to it (50/30/20, created in that order); an approved ON_DEATH release for scope ASSET."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /legacy/plans"
              payload: { owner_full_name: "Ada Owner", owner_email: "ada@x.com" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /legacy/subscriptions"
              payload: { plan_id: "${plan_id}", tier: "PLUS" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /legacy/deputies"
              payload: { plan_id: "${plan_id}", full_name: "Dee One", email: "d1@x.com", deputy_role: "EXECUTOR", access_scope: ["ACCOUNT","ASSET","DOCUMENT"], release_trigger: "ON_DEATH", authority_start_at: "2026-06-01T00:00:00Z", authority_end_at: "2027-06-01T00:00:00Z" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /legacy/deputies/${d1_id}/accept"
              payload: {}
              as: Deputy
              as_user_id: "${d1_id}"
            - call: "POST /legacy/vault-items"
              payload: { plan_id: "${plan_id}", kind: "ASSET", category: "estate", title: "House", secret_ref: "vault://house", gross_value_cents: 10000, liability_cents: 1, distribution_basis: "NET" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { item_id: $.data.id }
            - call: "POST /legacy/beneficiaries"
              payload: { plan_id: "${plan_id}", full_name: "Ben One", relationship: "child", allocation_pct: 50, asset_vault_item_id: "${item_id}" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /legacy/beneficiaries"
              payload: { plan_id: "${plan_id}", full_name: "Ben Two", relationship: "child", allocation_pct: 30, asset_vault_item_id: "${item_id}" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { b2_id: $.data.id }
            - call: "POST /legacy/beneficiaries"
              payload: { plan_id: "${plan_id}", full_name: "Ben Three", relationship: "child", allocation_pct: 20, asset_vault_item_id: "${item_id}" }
              as: Owner
              as_user_id: "${plan_id}"
              captures: { b3_id: $.data.id }
            - call: "POST /legacy/vault-items/${item_id}/seal"
              payload: {}
              as: Owner
              as_user_id: "${plan_id}"
            - call: "POST /legacy/plans/${plan_id}/life-status"
              payload: { new_status: "DECEASED", evidence_ref: "cert-001" }
              as: PlatformAdmin
            - call: "POST /legacy/release-requests"
              payload: { plan_id: "${plan_id}", trigger_type: "ON_DEATH", scope_kinds: ["ASSET"] }
              as: Deputy
              as_user_id: "${d1_id}"
              captures: { rr_id: $.data.id }
            - call: "POST /legacy/release-requests/${rr_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /legacy/release-requests/${rr_id}/approve"
              payload: { decision: "APPROVE" }
              as: Deputy
              as_user_id: "${d1_id}"
          trigger:
            - call: "POST /legacy/release-requests/${rr_id}/grant"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Beneficiary.${b1_id}.allocated_value_cents == 5000"
            - "Beneficiary.${b3_id}.allocated_value_cents == 1999"
            - "Beneficiary.${b3_id}.status == VESTED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: plan_completeness_weighted_tiered_score
        grounds:
          - calculations.plan_completeness_pct
          - entities.Plan.fields.completeness_pct
          - entities.Subscription.fields.tier
        distinguishing_aspect: |
          Mode (a): completeness is a >=3-input weighted score with min() clamps and tier-conditional
          weights; PLUS inputs (2 sealed, 1 active directive, 1 accepted deputy, 3 beneficiaries) yield
          exactly 66 = round(40*0.4 + 20*0.5 + 20*1 + 20*1).
        test_recipe:
          setup:
            - "PLUS plan with 2 SEALED DOCUMENT items, 1 ACTIVE directive, 1 ACCEPTED deputy, 3 NOMINATED beneficiaries; life_status ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
