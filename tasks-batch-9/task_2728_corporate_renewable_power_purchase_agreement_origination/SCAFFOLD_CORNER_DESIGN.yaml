      - name: pricing_node_names_are_globally_unique_across_isos
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DUPLICATE_PRICING_NODE]
          - validations.priority_27_ERR_DUPLICATE_PRICING_NODE
          - endpoints.POST_/ppa/pricing-nodes
        distinguishing_aspect: |
          Uniqueness is declared over PricingNode.name alone, so it is NOT scoped by iso
          or settlement_point_type: re-using the name under a different ISO and a
          different point type is still a conflict, and the response is 409 rather than
          the 422 used by the business-fiscal family. A genuinely different name is
          accepted immediately afterwards, which shows the rule is name equality and not
          a rate limit on creation.
        test_recipe:
          setup:
