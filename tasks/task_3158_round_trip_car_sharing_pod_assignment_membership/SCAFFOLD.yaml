    roles: [PodOperator]
    code: 200
    input: []
    output: MaintenanceOrder
    side_effects: ["MaintenanceOrder.status = COMPLETED", "Vehicle.use_status = AVAILABLE when it was CLEANING", "Vehicle.cleanliness_state resolves by reason", "supplies the C10 residual-release delta", "credits Member.wallet_credit_cents by released_cents", "closes the linked Incident when incident_id is set", "thaws every FROZEN membership preserved for the linked incident", "sets Vehicle.next_service_miles when reason == UTILIZATION_SERVICE", "recompute Pod.utilization_score and Pod.available_bays", "increments Vehicle.version by 1", "increments MaintenanceOrder.version by 1"]
  - method: POST
    path: "/car-share/maintenance-orders/{id}/cancel"
