              payload: { email: "i1@x.com", full_name: "Instr One" }
              as: StudioManager
              captures: { instr_id: $.data.id }
            - call: "POST /studios/${studio_id}/sessions"
              payload: { room_id: "${room1_id}", instructor_id: "${instr_id}", start_utc: "2026-06-15T18:00:00Z", end_utc: "2026-06-15T19:00:00Z" }
              as: StudioManager
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /studios/${studio_id}/sessions"
              payload: { room_id: "${room2_id}", instructor_id: "${instr_id}", start_utc: "2026-06-15T18:30:00Z", end_utc: "2026-06-15T19:30:00Z" }
