          trigger:
            - call: "POST /plate-orders"
              payload: {artwork_version_id: "${v1_id}", printer_id: "${printer_id}", printer_proof_id: "${proof_id}", plate_set_count: 6, expedite: false}
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { order_a: "$.data.id" }
            - call: "POST /plate-orders"
              payload: {artwork_version_id: "${v1_id}", printer_id: "${printer_id}", printer_proof_id: "${proof_id}", plate_set_count: 10, expedite: true}
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { order_b: "$.data.id" }
