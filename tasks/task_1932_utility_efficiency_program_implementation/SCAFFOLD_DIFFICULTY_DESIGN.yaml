              payload: {}
              as: ProgramManager
            - call: "POST /efficiency/programs/${prog_id}/suspend"
              payload: {}
              as: ProgramManager
            - call: "POST /efficiency/contractors"
              payload: { legal_name: "X1", license_number: "L-X1", sector: "RESIDENTIAL", service_zip_codes: ["94110"] }
              as: ProgramManager
              captures: { ctr_id: $.data.id }
            - call: "POST /efficiency/certifications"
