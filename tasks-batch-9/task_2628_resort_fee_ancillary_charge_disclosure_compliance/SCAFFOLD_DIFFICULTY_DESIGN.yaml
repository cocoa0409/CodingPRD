          assert:
            - "the trigger returns HTTP 200 — priority 22 does not fire, because it quantifies over an empty MANDATORY set"
            - "FeeProgram.${fp_opt}.status == PUBLISHED"
            - "FeeProgram.${fp_opt}.fee_count == 1 and FeeProgram.${fp_opt}.mandatory_fee_count == 0"
            - "FeeProgram.${fp_opt}.inclusion_coverage_ratio == 0.0000 exactly — not 1.0000, not null, and no divide-by-zero"
            - "FeeProgram.${fp_opt}.total_mandatory_fee_cents_per_night == 0"
            - "Property.${p1}.published_fee_program_count == 1"
            - "a profile created on ${fp_opt} with first_quote_shows_total true, itemized_at_first_quote true and disclosure_placement RATE_DETAILS scores 40 + 25 + 15 + 0 = 80 exactly, not 90, because the coverage bonus is min(10, floor(0.0000 * 10)) == 0"
            - "deploying that profile leaves Property.${p1}.min_channel_disclosure_score == 80 and Property.${p1}.disclosure_posture == COMPLIANT, because exactly 80 satisfies the non-strict side of DISCLOSURE_CONFIRM_THRESHOLD"
            - "adding one MANDATORY fee to a separate program with one value-bearing inclusion gives inclusion_coverage_ratio 1.0000, confirming 0.0000 was not a formatting artefact"

