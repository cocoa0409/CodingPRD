            - { call: "POST /farm/sanitation-cycles", payload: { water_loop_id: "${wl_a}", scheduled_start_at: "2026-08-24T13:00:00Z", scheduled_end_at: "2026-08-24T15:00:00Z" }, as: SanitationLead, captures: { cy2: "$.data.id" } }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-24T13:00:00Z" }, as: FarmManager }
