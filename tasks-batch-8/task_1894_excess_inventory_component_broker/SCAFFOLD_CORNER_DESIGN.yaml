  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: listing_patch_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[listing-update-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH /listings/{id} with expected_listing_version equal to the pre-write version succeeds and bumps version; replaying the same stale version fails ERR_STALE_VERSION (412) — OCC on Listing.version, deterministic over two sequential requests."
        test_recipe:
          setup: ["lot IN_STOCK; DRAFT listing asking 8000 at version v"]
          setup_api_calls:
            - call: "POST /sellers"
              payload: { name: "Oc Ollie", contact_email: "ollie@x.com" }
              as: BrokerOps
              captures: { s_id: $.data.id }
            - call: "POST /storage-bins"
              payload: { bin_code: "BIN-OC1", capacity_units: 20 }
              as: BrokerOps
              captures: { b_id: $.data.id }
            - call: "POST /buy-offers"
              payload: { seller_id: "${s_id}", mpn: "ULN2003", quantity: 5, ask_price_per_unit_cents: 5000, provenance_doc_url: "https://docs.x.com/poc.pdf" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { o_id: $.data.id }
            - call: "POST /buy-offers/${o_id}/accept"
              payload: { agreed_unit_price_cents: 5000, acquisition_mode: "BROKER_OWNED" }
              as: BrokerOps
            - call: "POST /buy-offers/${o_id}/receive"
              payload: {}
              as: BrokerOps
            - call: "POST /buy-offers/${o_id}/inspect"
              payload: { outcome: "PASS" }
              as: Inspector
            - call: "POST /buy-offers/${o_id}/convert-to-lot"
              payload: { storage_bin_id: "${b_id}" }
              as: BrokerOps
              captures: { lot_id: $.data.id }
            - call: "POST /listings"
              payload: { lot_id: "${lot_id}", asking_price_per_unit_cents: 8000 }
              as: BrokerOps
              captures: { l_id: $.data.id, l_ver: $.data.version }
          trigger:
            - call: "PATCH /listings/${l_id}"
              payload: { asking_price_per_unit_cents: 8500, expected_listing_version: "${l_ver}" }
              as: BrokerOps
              captures: { v_after: $.data.version }
            - call: "PATCH /listings/${l_id}"
              payload: { asking_price_per_unit_cents: 9000, expected_listing_version: "${l_ver}" }
              as: BrokerOps
              captures: { err_id: $.data.error_id }
          assert:
            - "v_after == ${l_ver} + 1 (first patch succeeded and bumped version)"
            - "err_id == ERR_STALE_VERSION on the replayed stale write"
            - "Listing.${l_id}.asking_price_per_unit_cents == 8500 (the losing write did not apply)"

      - name: derived_field_reconciliation_on_cancel
        claim_type: derived_field_reconciliation
        grounds: ["calculations.customer_credit_exposure", "calculations.lot_posture_derivation"]
        distinguishing_aspect: "Derived fields on two entities reconcile after the source mutation: cancelling the only open order returns customer exposure to 0 and lot posture to LISTED."
