              captures: { err: $.data.error_id }
            - { call: "POST /books/${b}/positions", payload: { category: DEPOSIT, deposit_segment: RETAIL_NONMATURITY, balance_cents: 80000000, rate_bps: 50, scheduled_runoff_pct: 0.0, duration_years: 0.5 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/activate", payload: {}, as: TreasuryAnalyst }
          assert:
            - "err == ERR_BOOK_ACTIVATION_INCOMPLETE"
            - "AlmBook.${b}.status == ACTIVE after liability added"

      - name: retire_position_with_open_hedge_rejected
        claim_type: cross_reference_link
        grounds: ["errors[ERR_POSITION_HAS_ACTIVE_HEDGE]", state_machines.Position.ACTIVE_to_RETIRED]
        distinguishing_aspect: "Retire is blocked while a PROPOSED hedge references the position (ERR_POSITION_HAS_ACTIVE_HEDGE); the position stays ACTIVE."
        test_recipe:
          setup: ["Book1 ACTIVE; hedge PROPOSED on L1"]
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400, min_hedged_notional_cents: 0 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
