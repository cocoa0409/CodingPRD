        as: CaseManager
        as_user_id: cm-1
        captures:
          p1_id: $.data.id
      - call: POST /grants
        payload:
          funder_name: Statewide Reentry Fund
          program_year: 2026
          authorized_cents: 5000000
          allowed_categories:
          - TOOLS
          - UNIFORM
          - TRANSIT_PASS
          - ID_FEE
          - LICENSE_FEE
          - WAGE_SUBSIDY
          per_participant_cap_cents: 60000
          retention_benchmark_pct: 50.0
        as: FunderAnalyst
        as_user_id: analyst-1
        captures:
          g1_id: $.data.id
      - call: GET /grants/${g1_id}
        as: CaseManager
        as_user_id: cm-1
        captures:
          g1_v_a: $.data.version
      trigger:
      - call: POST /support-requests
        payload:
          participant_id: ${p1_id}
          grant_id: ${g1_id}
          category: TOOLS
          expected_grant_version: ${g1_v_a}
          line_items:
          - description: Impact driver
            unit_cost_cents: 4550
            quantity: 1
          - description: Tool belt and hand tools
            unit_cost_cents: 5550
            quantity: 1
          - description: Steel-toe boots
            unit_cost_cents: 3750
            quantity: 1
          - description: Safety glasses and gloves
            unit_cost_cents: 2570
            quantity: 1
          justification: Starter tool kit required by the warehouse maintenance placement
        as: CaseManager
        as_user_id: cm-1
        captures:
          sr1_id: $.data.id
      assert:
      - SupportRequest.${sr1_id}.line_items[0].line_award_cents == 3868
      - SupportRequest.${sr1_id}.line_items[1].line_award_cents == 4718
      - SupportRequest.${sr1_id}.line_items[2].line_award_cents == 3188
      - SupportRequest.${sr1_id}.line_items[3].line_award_cents == 2185
      - SupportRequest.${sr1_id}.requested_cents == 13959
      - SupportRequest.${sr1_id}.requested_cents != 13957 (the aggregate-rounded answer)
      - SupportRequest.${sr1_id}.admin_fee_cents == 419
      - SupportRequest.${sr1_id}.total_charge_cents == 14378
      - SupportRequest.${sr1_id}.status == SUBMITTED
      - FunderGrant.${g1_id}.committed_cents == 0 (a SUBMITTED request commits nothing)
      - FunderGrant.${g1_id}.open_request_count == 1
