              as: Recommender
              as_user_id: "${rec_id}"
            - call: "POST /applications/${app1}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app1}/start-review"
              payload: {}
              as: AdmissionsOfficer
              captures: { v1: $.data.version }
            - call: "POST /applications/${app1}/decide"
              payload: { decision: "ADMIT", expected_application_version: "${v1}" }
              as: AdmissionsOfficer
            # App on S2
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", school_id: "${s2}", plan: "REGULAR" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app2: $.data.id }
            - call: "POST /essay-submissions"
              payload: { application_id: "${app2}", prompt_code: "P2", body: "e2" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /recommendation-letters"
              payload: { application_id: "${app2}", recommender_id: "${rec_id}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { L2: $.data.id }
            - call: "POST /recommendation-letters/${L2}/start"
              payload: {}
              as: Recommender
              as_user_id: "${rec_id}"
            - call: "POST /recommendation-letters/${L2}/submit"
              payload: { body: "Letter L2 body content extending past two hundred characters for the second application with substantive observation about the applicant's strengths in academic discipline and personal character." }
              as: Recommender
              as_user_id: "${rec_id}"
            - call: "POST /applications/${app2}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app2}/start-review"
              payload: {}
              as: AdmissionsOfficer
              captures: { v2: $.data.version }
            - call: "POST /applications/${app2}/decide"
              payload: { decision: "ADMIT", expected_application_version: "${v2}" }
              as: AdmissionsOfficer
            - call: "POST /applications/${app1}/accept-offer"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
          trigger:
            - call: "POST /applications/${app2}/accept-offer"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == 'ERR_ALREADY_ENROLLED'"

