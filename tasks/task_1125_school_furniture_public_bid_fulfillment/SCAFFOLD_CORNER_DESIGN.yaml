            - "Remediation shipment was schedulable despite AT_RISK (lines BACKORDERED -> exempt)"
            - "cnt_end == 0 and posture_end == ON_TRACK (threshold reset)"
            - "n1_status == RESOLVED and n2_status == RESOLVED"

