# =============================================================================
# Scaffold: task_0001_meeting_room (v1)
# Shared Meeting Room Management System
# =============================================================================

scenario: |
  Shared meeting room management system. Organizations manage a pool of meeting
  rooms with varying capacities and amenities. Users book rooms through a
  reservation workflow (TENTATIVE -> CONFIRMED -> CHECKED_IN -> COMPLETED) with
  conflict detection on overlapping time windows, recurring booking series,
  approval chains for premium rooms, automatic no-show cancellation via ops runs,
  capacity-based pricing with peak/off-peak tiers, waitlist promotion when
  cancellations free slots, and audit logging of all booking mutations. Roles:
  employee (book standard rooms), manager (approve premium bookings, override
  conflicts), facility_admin (manage rooms, run ops, view reports).

domain_name: meeting-room
api_prefix: /rooms

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: null
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_deferred_actions

  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: approval_chain
  consistency_model: immediate

  entity_count: 5
  state_machine_count: 3
  calculation_count: 5
  validation_layers: 5
  endpoint_count: 22
  error_code_count: 22
  role_count: 3

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Room
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Unique room identifier" }
      - { name: name, type: string, source: input, description: "Human-readable room name (unique)" }
      - { name: capacity, type: integer, source: input, description: "Maximum occupants" }
      - { name: floor, type: integer, source: input, description: "Building floor number" }
      - { name: amenities, type: array, source: input, description: "List of amenity tags (e.g. PROJECTOR, WHITEBOARD, VIDEO_CONF, PHONE)" }
      - { name: tier, type: enum, source: input, description: "STANDARD | PREMIUM — premium rooms require manager approval" }
      - { name: status, type: enum, source: system, description: "ACTIVE | MAINTENANCE | DECOMMISSIONED" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Base cost per hour in cents" }
      - { name: peak_multiplier, type: number, source: input, description: "Multiplier applied during peak hours (e.g. 1.5)", default: 1.0 }
      - { name: peak_hours_start, type: string, source: input, description: "Peak window start in HH:MM 24h format (e.g. 09:00)" }
      - { name: peak_hours_end, type: string, source: input, description: "Peak window end in HH:MM 24h format (e.g. 17:00)" }
      - { name: ops_run_index, type: integer, source: system, description: "Monotonic counter, increments on run_ops" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Unique booking identifier" }
      - { name: room_id, type: string, source: input, description: "Reference to room being booked" }
      - { name: organizer_id, type: string, source: input, description: "User ID of the booking organizer" }
      - { name: title, type: string, source: input, description: "Meeting title" }
      - { name: start_time, type: datetime, source: input, description: "Booking start (ISO 8601, inclusive)" }
      - { name: end_time, type: datetime, source: input, description: "Booking end (ISO 8601, exclusive)" }
      - { name: attendee_count, type: integer, source: input, description: "Expected number of attendees" }
      - { name: status, type: enum, source: system, description: "TENTATIVE | PENDING_APPROVAL | CONFIRMED | CHECKED_IN | COMPLETED | CANCELLED | NO_SHOW" }
      - { name: series_id, type: string, source: system, description: "Links bookings in a recurring series, null for one-off bookings" }
      - { name: cost_cents, type: integer, source: computed, description: "Computed cost based on duration, rate, and peak multiplier" }
      - { name: rejection_reason, type: string, source: input, description: "Reason if booking was rejected by manager, null otherwise" }
      - { name: checked_in_at, type: datetime, source: system, description: "Timestamp of check-in, null until checked in" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Series
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Unique series identifier" }
      - { name: room_id, type: string, source: input, description: "Reference to room" }
      - { name: organizer_id, type: string, source: input, description: "User ID of the series organizer" }
      - { name: title, type: string, source: input, description: "Recurring meeting title" }
      - { name: recurrence_rule, type: string, source: input, description: "DAILY | WEEKLY | BIWEEKLY" }
      - { name: start_time, type: string, source: input, description: "Time of day for each occurrence (HH:MM)" }
      - { name: duration_minutes, type: integer, source: input, description: "Duration per occurrence" }
      - { name: attendee_count, type: integer, source: input, description: "Expected attendees per occurrence" }
      - { name: series_start_date, type: string, source: input, description: "First occurrence date (YYYY-MM-DD)" }
      - { name: series_end_date, type: string, source: input, description: "Last occurrence date (YYYY-MM-DD)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CANCELLED" }
      - { name: total_bookings, type: integer, source: computed, description: "Number of bookings generated" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Waitlist
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Unique waitlist entry identifier" }
      - { name: room_id, type: string, source: input, description: "Desired room" }
      - { name: requester_id, type: string, source: input, description: "User ID of the requester" }
      - { name: title, type: string, source: input, description: "Meeting title" }
      - { name: start_time, type: datetime, source: input, description: "Desired start (ISO 8601)" }
      - { name: end_time, type: datetime, source: input, description: "Desired end (ISO 8601)" }
      - { name: attendee_count, type: integer, source: input, description: "Expected attendees" }
      - { name: status, type: enum, source: system, description: "WAITING | PROMOTED | EXPIRED | CANCELLED" }
      - { name: position, type: integer, source: system, description: "Queue position (1-indexed, lower is earlier)" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Unique log entry identifier" }
      - { name: timestamp, type: datetime, source: system, description: "When the action occurred" }
      - { name: actor_id, type: string, source: system, description: "User who performed the action" }
      - { name: actor_role, type: enum, source: system, description: "Role used: employee | manager | facility_admin" }
      - { name: action, type: string, source: system, description: "Action performed (e.g. booking.created, booking.confirmed)" }
      - { name: resource_type, type: string, source: system, description: "Entity type (Room, Booking, Series, Waitlist)" }
      - { name: resource_id, type: string, source: system, description: "ID of the affected resource" }
      - { name: details, type: object, source: system, description: "JSON object with before/after state snapshot" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Room
    field: status
    initial_state: ACTIVE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: ACTIVE
        to: MAINTENANCE
        trigger: "PUT /rooms/{room_id} with status=MAINTENANCE"
        actor: facility_admin
        preconditions: []
        side_effects:
          - "All TENTATIVE and PENDING_APPROVAL bookings in future -> CANCELLED"
          - "CONFIRMED bookings in future -> CANCELLED, waitlist entries notified"
          - "Audit log entry created"

      - from: MAINTENANCE
        to: ACTIVE
        trigger: "PUT /rooms/{room_id} with status=ACTIVE"
        actor: facility_admin
        preconditions: []
        side_effects:
          - "Room becomes available for new bookings"
          - "Audit log entry created"

      - from: [ACTIVE, MAINTENANCE]
        to: DECOMMISSIONED
        trigger: "PUT /rooms/{room_id} with status=DECOMMISSIONED"
        actor: facility_admin
        preconditions:
          - "No CHECKED_IN bookings currently active"
        side_effects:
          - "All future non-terminal bookings -> CANCELLED"
          - "All WAITING waitlist entries -> EXPIRED"
          - "Audit log entry created"

  - entity: Booking
    field: status
    initial_state: TENTATIVE
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: TENTATIVE
        to: PENDING_APPROVAL
        trigger: "system (auto-transition when room tier is PREMIUM)"
        actor: system
        preconditions:
          - "Room tier is PREMIUM"
        side_effects:
          - "Audit log entry created"

      - from: TENTATIVE
        to: CONFIRMED
        trigger: "system (auto-transition when room tier is STANDARD)"
        actor: system
        preconditions:
          - "Room tier is STANDARD"
          - "No time overlap with existing CONFIRMED or CHECKED_IN bookings"
        side_effects:
          - "cost_cents computed based on duration and rate"
          - "Audit log entry created"

      - from: PENDING_APPROVAL
        to: CONFIRMED
        trigger: "POST /bookings/{booking_id}/approve"
        actor: manager
        preconditions:
          - "No time overlap with existing CONFIRMED or CHECKED_IN bookings for the same room"
          - "Room is ACTIVE"
        side_effects:
          - "cost_cents computed based on duration and rate"
          - "Audit log entry created"

      - from: PENDING_APPROVAL
        to: CANCELLED
        trigger: "POST /bookings/{booking_id}/reject"
        actor: manager
        preconditions: []
        side_effects:
          - "rejection_reason recorded"
          - "Promote first eligible waitlist entry if time slot freed"
          - "Audit log entry created"

      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /bookings/{booking_id}/check-in"
        actor: employee
        preconditions:
          - "Current time is within 15 minutes before start_time through end_time"
          - "Booking has not yet ended"
        side_effects:
          - "checked_in_at set to current time"
          - "Audit log entry created"

      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /bookings/{booking_id}/check-out or system (end_time reached)"
        actor: "employee or system"
        preconditions: []
        side_effects:
          - "Room freed for next booking"
          - "Audit log entry created"

      - from: [TENTATIVE, PENDING_APPROVAL, CONFIRMED]
        to: CANCELLED
        trigger: "POST /bookings/{booking_id}/cancel"
        actor: "employee or manager or facility_admin"
        preconditions: []
        side_effects:
          - "Release time slot"
          - "Promote first eligible waitlist entry for same room and overlapping time"
          - "If part of series: only this occurrence cancelled, series remains"
          - "Audit log entry created"

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "system (ops run: booking start_time + 15 min passed without check-in)"
        actor: system
        preconditions:
          - "Current time > start_time + 15 minutes"
          - "No check-in recorded"
        side_effects:
          - "Release time slot"
          - "Promote first eligible waitlist entry"
          - "Audit log entry created"

  - entity: Waitlist
    field: status
    initial_state: WAITING
    terminal_states: [PROMOTED, EXPIRED, CANCELLED]
    transitions:
      - from: WAITING
        to: PROMOTED
        trigger: "system (slot freed by cancellation, rejection, or no-show)"
        actor: system
        preconditions:
          - "Room is ACTIVE"
          - "Time slot is now available"
          - "Attendee count <= room capacity"
        side_effects:
          - "New TENTATIVE booking auto-created from waitlist entry"
          - "Remaining waitlist entries for same slot re-positioned"
          - "Audit log entry created"

      - from: WAITING
        to: EXPIRED
        trigger: "system (ops run: start_time passed without promotion)"
        actor: system
        preconditions:
          - "start_time is in the past"
        side_effects:
          - "Audit log entry created"

      - from: WAITING
        to: CANCELLED
        trigger: "DELETE /waitlist/{waitlist_id}"
        actor: "employee or manager or facility_admin"
        preconditions: []
        side_effects:
          - "Remaining waitlist entries for same slot re-positioned"
          - "Audit log entry created"

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: booking_cost
    trigger: "booking confirmed (auto or via approval)"
    algorithm: tiered_pricing
    formula: |
      Split booking [start_time, end_time) into minute-by-minute intervals.
      For each minute:
        if minute falls within [peak_hours_start, peak_hours_end):
          rate_per_minute = (hourly_rate_cents / 60) * peak_multiplier
        else:
          rate_per_minute = hourly_rate_cents / 60
      cost_cents = round_half_up(sum of all minute rates))
    input_set: "room.hourly_rate_cents, room.peak_multiplier, room.peak_hours_start, room.peak_hours_end, booking.start_time, booking.end_time"
    constants:
      MINUTES_PER_HOUR: 60
    precision: "integer cents, round_half_up at the end"
    variants:
      - name: fully_off_peak
        when: "Entire booking outside peak window"
        difference: "Simple: (duration_minutes / 60) * hourly_rate_cents, no multiplier"
      - name: fully_peak
        when: "Entire booking within peak window"
        difference: "Simple: (duration_minutes / 60) * hourly_rate_cents * peak_multiplier"
      - name: straddling_peak
        when: "Booking spans peak boundary"
        difference: "Must split at boundary — two different rates. This is the hard case: rounding after summing, not per-segment."

  - name: no_show_detection
    trigger: "ops run"
    algorithm: threshold
    formula: |
      For each CONFIRMED booking on this room:
        if current_time > booking.start_time + NO_SHOW_GRACE_MINUTES:
          booking.status -> NO_SHOW
          Trigger waitlist promotion
    constants:
      NO_SHOW_GRACE_MINUTES: 15
    precision: "minute-level comparison"

  - name: waitlist_promotion
    trigger: "booking cancelled, rejected, or marked no-show"
    algorithm: waterfall_allocation
    formula: |
      1. Find all WAITING entries for the same room whose [start_time, end_time)
         is fully contained within the freed slot.
      2. Sort by position (ascending = FIFO).
      3. Promote the first entry whose attendee_count <= room.capacity.
      4. Skip entries that would overlap with other CONFIRMED/CHECKED_IN bookings.
      5. Only one promotion per cancellation event.
    input_set: "waitlist entries with status=WAITING, same room_id, overlapping time"

  - name: overlap_detection
    trigger: "booking creation, approval, waitlist promotion"
    algorithm: interval_merge
    formula: |
      Two bookings overlap if and only if:
        booking_a.start_time < booking_b.end_time
        AND booking_b.start_time < booking_a.end_time
      (Half-open interval: start is inclusive, end is exclusive.)
      Only CONFIRMED and CHECKED_IN bookings count as occupying a slot.
      TENTATIVE and PENDING_APPROVAL bookings do NOT block the slot
      (they are speculative until confirmed).
    input_set: "all bookings for the same room with status in (CONFIRMED, CHECKED_IN)"
    variants:
      - name: adjacent_bookings
        when: "booking_a.end_time == booking_b.start_time"
        difference: "NOT an overlap — half-open semantics allow back-to-back bookings at exact boundaries"
      - name: zero_duration
        when: "start_time == end_time"
        difference: "Rejected at validation — minimum 15-minute booking enforced"

  - name: waitlist_expiry
    trigger: "ops run"
    algorithm: threshold
    formula: |
      For each WAITING entry:
        if current_time > entry.start_time:
          entry.status -> EXPIRED

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and valid"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role must be one of employee, manager, facility_admin"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "Operation requires sufficient role level"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "role-restricted endpoints (room management, approve/reject)"

  - priority: 4
    category: existence
    check: "Referenced room must exist"
    error_id: ERR_ROOM_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints referencing a room_id"

  - priority: 5
    category: existence
    check: "Referenced booking must exist"
    error_id: ERR_BOOKING_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints referencing a booking_id"

  - priority: 6
    category: existence
    check: "Referenced waitlist entry must exist"
    error_id: ERR_WAITLIST_NOT_FOUND
    http_status: 404
    applies_to: "waitlist endpoints"

  - priority: 7
    category: existence
    check: "Referenced series must exist"
    error_id: ERR_SERIES_NOT_FOUND
    http_status: 404
    applies_to: "series endpoints"

  - priority: 8
    category: state
    check: "Room must be ACTIVE for new bookings and waitlist entries"
    error_id: ERR_ROOM_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /bookings, POST /waitlist, POST /series"

  - priority: 9
    category: state
    check: "Booking must be in valid state for requested transition"
    error_id: ERR_INVALID_BOOKING_STATE
    http_status: 409
    applies_to: "booking action endpoints (approve, reject, check-in, check-out, cancel)"

  - priority: 10
    category: state
    check: "Waitlist entry must be WAITING for cancellation"
    error_id: ERR_INVALID_WAITLIST_STATE
    http_status: 409
    applies_to: "DELETE /waitlist/{id}"

  - priority: 11
    category: business_temporal
    check: "Booking end_time must be after start_time"
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 400
    applies_to: "POST /bookings, POST /waitlist, POST /series"

  - priority: 12
    category: business_temporal
    check: "Booking must be at least 15 minutes long"
    error_id: ERR_BOOKING_TOO_SHORT
    http_status: 400
    applies_to: "POST /bookings, POST /series"

  - priority: 13
    category: business_temporal
    check: "Booking must not exceed 8 hours"
    error_id: ERR_BOOKING_TOO_LONG
    http_status: 400
    applies_to: "POST /bookings, POST /series"

  - priority: 14
    category: business_temporal
    check: "Booking start_time must be in the future"
    error_id: ERR_BOOKING_IN_PAST
    http_status: 400
    applies_to: "POST /bookings, POST /waitlist, POST /series"

  - priority: 15
    category: business_constraint
    check: "No time overlap with existing CONFIRMED or CHECKED_IN bookings for the same room"
    error_id: ERR_TIME_CONFLICT
    http_status: 409
    applies_to: "booking confirmation (auto for STANDARD, manual for PREMIUM)"

  - priority: 16
    category: business_constraint
    check: "Attendee count must not exceed room capacity"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 400
    applies_to: "POST /bookings, POST /waitlist, POST /series"

  - priority: 17
    category: business_constraint
    check: "Check-in only allowed within 15 minutes before start_time through end_time"
    error_id: ERR_CHECKIN_WINDOW
    http_status: 400
    applies_to: "POST /bookings/{id}/check-in"

  - priority: 18
    category: business_constraint
    check: "Series end date must be after series start date"
    error_id: ERR_INVALID_SERIES_RANGE
    http_status: 400
    applies_to: "POST /series"

  - priority: 19
    category: business_constraint
    check: "Series must generate at least one booking occurrence"
    error_id: ERR_EMPTY_SERIES
    http_status: 400
    applies_to: "POST /series"

  - priority: 20
    category: business_referential
    check: "If-Match header must match current version on mutations"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "PUT on rooms, booking actions, waitlist cancellation"

  - priority: 21
    category: business_referential
    check: "Room decommission blocked while CHECKED_IN bookings exist"
    error_id: ERR_ROOM_HAS_ACTIVE_BOOKINGS
    http_status: 409
    applies_to: "PUT /rooms/{id} with status=DECOMMISSIONED"

  - priority: 22
    category: business_constraint
    check: "Duplicate waitlist entry (same requester, room, and exact time window) not allowed"
    error_id: ERR_DUPLICATE_WAITLIST
    http_status: 409
    applies_to: "POST /waitlist"

# =============================================================================
# Table 5: API Endpoint Table (22 endpoints)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 20, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Rooms ---
  - method: POST
    path: "/rooms"
    description: "Create a new meeting room"
    authorized_roles: [facility_admin]
    success_code: 201
    request_body:
      - { field: name, type: string, required: true }
      - { field: capacity, type: integer, required: true }
      - { field: floor, type: integer, required: true }
      - { field: amenities, type: array, required: false }
      - { field: tier, type: enum, required: true }
      - { field: hourly_rate_cents, type: integer, required: true }
      - { field: peak_multiplier, type: number, required: false }
      - { field: peak_hours_start, type: string, required: false }
      - { field: peak_hours_end, type: string, required: false }
    response: Room
    side_effects: ["status=ACTIVE, ops_run_index=0"]

  - method: GET
    path: "/rooms"
    description: "List all rooms with optional filters"
    authorized_roles: [employee, manager, facility_admin]
    success_code: 200
    request_body: []
    query_params: ["status?", "tier?", "min_capacity?", "floor?", "amenity?", "limit?", "offset?"]
    response: "Room[]"
    side_effects: []

  - method: GET
    path: "/rooms/{room_id}"
    description: "Get room details"
    authorized_roles: [employee, manager, facility_admin]
    success_code: 200
    request_body: []
    response: Room
    side_effects: []

  - method: PUT
    path: "/rooms/{room_id}"
    description: "Update room details (name, capacity, amenities, tier, rates, status)"
    authorized_roles: [facility_admin]
    success_code: 200
    request_body:
      - { field: name, type: string, required: false }
      - { field: capacity, type: integer, required: false }
      - { field: amenities, type: array, required: false }
      - { field: tier, type: enum, required: false }
      - { field: hourly_rate_cents, type: integer, required: false }
      - { field: peak_multiplier, type: number, required: false }
      - { field: peak_hours_start, type: string, required: false }
      - { field: peak_hours_end, type: string, required: false }
      - { field: status, type: enum, required: false }
    response: Room
    side_effects:
      - "Status change to MAINTENANCE/DECOMMISSIONED cascades to bookings"
      - "Capacity reduction does NOT cancel existing bookings (only blocks new ones exceeding)"
      - "Audit log entry created"

  - method: POST
    path: "/rooms/{room_id}/run_ops"
    description: "Run operations housekeeping on a room"
    authorized_roles: [facility_admin]
    success_code: 200
    request_body: []
    response: Room
    side_effects:
      - "Increments ops_run_index"
      - "No-show detection: CONFIRMED bookings past grace period -> NO_SHOW"
      - "Waitlist expiry: WAITING entries whose start_time has passed -> EXPIRED"
      - "Waitlist promotion after no-show frees slots"

  # --- Bookings ---
  - method: POST
    path: "/bookings"
    description: "Create a new booking"
    authorized_roles: [employee, manager, facility_admin]
    success_code: 201
    request_body:
      - { field: room_id, type: string, required: true }
      - { field: title, type: string, required: true }
      - { field: start_time, type: datetime, required: true }
      - { field: end_time, type: datetime, required: true }
      - { field: attendee_count, type: integer, required: true }
    response: Booking
    side_effects:
      - "STANDARD room: TENTATIVE -> CONFIRMED (if no overlap) with cost computed"
      - "PREMIUM room: TENTATIVE -> PENDING_APPROVAL"
      - "Audit log entry created"

  - method: GET
    path: "/bookings"
    description: "List bookings with optional filters"
    authorized_roles: [employee, manager, facility_admin]
    success_code: 200
    request_body: []
    query_params: ["room_id?", "organizer_id?", "status?", "start_after?", "start_before?", "limit?", "offset?"]
    response: "Booking[]"
    side_effects: []

  - method: GET
    path: "/bookings/{booking_id}"
    description: "Get booking details"
    authorized_roles: [employee, manager, facility_admin]
    success_code: 200
    request_body: []
    response: Booking
    side_effects: []

  - method: POST
    path: "/bookings/{booking_id}/approve"
    description: "Approve a PENDING_APPROVAL booking"
    authorized_roles: [manager, facility_admin]
    success_code: 200
    request_body: []
    response: Booking
    side_effects:
      - "status -> CONFIRMED"
      - "cost_cents computed"
      - "Overlap check at approval time (slot may have been taken since request)"
      - "Audit log entry created"

  - method: POST
    path: "/bookings/{booking_id}/reject"
    description: "Reject a PENDING_APPROVAL booking"
    authorized_roles: [manager, facility_admin]
    success_code: 200
    request_body:
      - { field: rejection_reason, type: string, required: true }
    response: Booking
    side_effects:
      - "status -> CANCELLED"
      - "Waitlist promotion triggered"
      - "Audit log entry created"

  - method: POST
    path: "/bookings/{booking_id}/check-in"
    description: "Check in to a confirmed booking"
    authorized_roles: [employee, manager, facility_admin]
    success_code: 200
    request_body: []
    response: Booking
    side_effects:
      - "status -> CHECKED_IN"
      - "checked_in_at set"
      - "Audit log entry created"

  - method: POST
    path: "/bookings/{booking_id}/check-out"
    description: "Check out of a booking (early release)"
    authorized_roles: [employee, manager, facility_admin]
    success_code: 200
    request_body: []
    response: Booking
    side_effects:
      - "status -> COMPLETED"
      - "Room freed"
      - "Audit log entry created"

  - method: POST
    path: "/bookings/{booking_id}/cancel"
    description: "Cancel a booking"
    authorized_roles: [employee, manager, facility_admin]
    success_code: 200
    request_body: []
    response: Booking
    side_effects:
      - "status -> CANCELLED"
      - "Release time slot"
      - "Waitlist promotion triggered"
      - "Audit log entry created"

  # --- Series ---
  - method: POST
    path: "/series"
    description: "Create a recurring booking series"
    authorized_roles: [employee, manager, facility_admin]
    success_code: 201
    request_body:
      - { field: room_id, type: string, required: true }
      - { field: title, type: string, required: true }
      - { field: recurrence_rule, type: enum, required: true }
      - { field: start_time, type: string, required: true }
      - { field: duration_minutes, type: integer, required: true }
      - { field: attendee_count, type: integer, required: true }
      - { field: series_start_date, type: string, required: true }
      - { field: series_end_date, type: string, required: true }
    response: Series
    side_effects:
      - "Generate individual Booking records for each occurrence"
      - "Each booking follows normal TENTATIVE -> CONFIRMED/PENDING_APPROVAL flow"
      - "Bookings that would conflict are created as TENTATIVE (skipped for auto-confirm) and flagged"
      - "Audit log entry created"

  - method: GET
    path: "/series/{series_id}"
    description: "Get series details including linked bookings"
    authorized_roles: [employee, manager, facility_admin]
    success_code: 200
    request_body: []
    response: Series
    side_effects: []

  - method: POST
    path: "/series/{series_id}/cancel"
    description: "Cancel entire series (all future non-terminal bookings)"
    authorized_roles: [employee, manager, facility_admin]
    success_code: 200
    request_body: []
    response: Series
    side_effects:
      - "Series status -> CANCELLED"
      - "All future TENTATIVE, PENDING_APPROVAL, CONFIRMED bookings in series -> CANCELLED"
      - "Past COMPLETED, NO_SHOW bookings unaffected"
      - "Waitlist promotions triggered for freed slots"
      - "Audit log entry created"

  # --- Waitlist ---
  - method: POST
    path: "/waitlist"
    description: "Join the waitlist for a room and time slot"
    authorized_roles: [employee, manager, facility_admin]
    success_code: 201
    request_body:
      - { field: room_id, type: string, required: true }
      - { field: title, type: string, required: true }
      - { field: start_time, type: datetime, required: true }
      - { field: end_time, type: datetime, required: true }
      - { field: attendee_count, type: integer, required: true }
    response: Waitlist
    side_effects:
      - "status=WAITING, position assigned (append to queue for that room+slot)"
      - "Audit log entry created"

  - method: GET
    path: "/waitlist"
    description: "List waitlist entries with optional filters"
    authorized_roles: [employee, manager, facility_admin]
    success_code: 200
    request_body: []
    query_params: ["room_id?", "requester_id?", "status?", "limit?", "offset?"]
    response: "Waitlist[]"
    side_effects: []

  - method: DELETE
    path: "/waitlist/{waitlist_id}"
    description: "Cancel a waitlist entry"
    authorized_roles: [employee, manager, facility_admin]
    success_code: 200
    request_body: []
    response: Waitlist
    side_effects:
      - "status -> CANCELLED"
      - "Remaining entries re-positioned"
      - "Audit log entry created"

  # --- Audit Logs ---
  - method: GET
    path: "/audit-logs"
    description: "List audit log entries with optional filters"
    authorized_roles: [facility_admin]
    success_code: 200
    request_body: []
    query_params: ["resource_type?", "resource_id?", "actor_id?", "action?", "start_after?", "start_before?", "limit?", "offset?"]
    response: "AuditLog[]"
    side_effects: []

  - method: GET
    path: "/audit-logs/{log_id}"
    description: "Get a single audit log entry"
    authorized_roles: [facility_admin]
    success_code: 200
    request_body: []
    response: AuditLog
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog (22 error codes)
# =============================================================================
errors:
  # --- Auth ---
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "Missing or invalid X-User-ID or X-User-Role header"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "User role insufficient for the requested operation"

  # --- Request ---
  - id: ERR_BAD_REQUEST
    http: 400
    condition: "Malformed request body, missing required fields, invalid field types"

  # --- Not Found ---
  - id: ERR_ROOM_NOT_FOUND
    http: 404
    condition: "Room with given ID does not exist"

  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "Booking with given ID does not exist"

  - id: ERR_WAITLIST_NOT_FOUND
    http: 404
    condition: "Waitlist entry with given ID does not exist"

  - id: ERR_SERIES_NOT_FOUND
    http: 404
    condition: "Series with given ID does not exist"

  # --- Concurrency ---
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "If-Match header value does not match current resource version"

  # --- State ---
  - id: ERR_ROOM_NOT_ACTIVE
    http: 409
    condition: "Room is not ACTIVE; cannot create bookings or waitlist entries"

  - id: ERR_INVALID_BOOKING_STATE
    http: 409
    condition: "Booking not in valid state for requested action"

  - id: ERR_INVALID_WAITLIST_STATE
    http: 409
    condition: "Waitlist entry not in valid state for requested action"

  - id: ERR_INVALID_SERIES_STATE
    http: 409
    condition: "Series not in valid state for requested action"

  # --- Temporal ---
  - id: ERR_INVALID_TIME_RANGE
    http: 400
    condition: "end_time is not after start_time"

  - id: ERR_BOOKING_TOO_SHORT
    http: 400
    condition: "Booking duration is less than 15 minutes"

  - id: ERR_BOOKING_TOO_LONG
    http: 400
    condition: "Booking duration exceeds 8 hours"

  - id: ERR_BOOKING_IN_PAST
    http: 400
    condition: "Booking start_time is in the past"

  - id: ERR_CHECKIN_WINDOW
    http: 400
    condition: "Check-in attempted outside the allowed window (15 min before start through end)"

  # --- Conflict ---
  - id: ERR_TIME_CONFLICT
    http: 409
    condition: "Booking overlaps with an existing CONFIRMED or CHECKED_IN booking on the same room"

  - id: ERR_CAPACITY_EXCEEDED
    http: 400
    condition: "Attendee count exceeds room capacity"

  - id: ERR_ROOM_HAS_ACTIVE_BOOKINGS
    http: 409
    condition: "Cannot decommission room while CHECKED_IN bookings exist"

  - id: ERR_DUPLICATE_WAITLIST
    http: 409
    condition: "Duplicate waitlist entry for same requester, room, and exact time window"

  # --- Series ---
  - id: ERR_INVALID_SERIES_RANGE
    http: 400
    condition: "Series end_date is not after series_start_date"

  - id: ERR_EMPTY_SERIES
    http: 400
    condition: "Series dates and recurrence rule produce zero booking occurrences"

  - id: ERR_ROOM_NAME_TAKEN
    http: 409
    condition: "Room name already exists (names must be unique)"

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: employee
    description: "Standard user who can book rooms, check in/out, and manage their own waitlist entries"
    exclusive_operations: []
    shared_operations:
      - "GET /rooms — List rooms"
      - "GET /rooms/{id} — View room details"
      - "POST /bookings — Create booking"
      - "GET /bookings — List bookings"
      - "GET /bookings/{id} — View booking details"
      - "POST /bookings/{id}/check-in — Check in"
      - "POST /bookings/{id}/check-out — Check out"
      - "POST /bookings/{id}/cancel — Cancel own booking"
      - "POST /series — Create recurring series"
      - "GET /series/{id} — View series"
      - "POST /series/{id}/cancel — Cancel own series"
      - "POST /waitlist — Join waitlist"
      - "GET /waitlist — List waitlist entries"
      - "DELETE /waitlist/{id} — Cancel own waitlist entry"

  - name: manager
    description: "Can approve/reject premium room bookings and perform all employee operations"
    exclusive_operations:
      - "POST /bookings/{id}/approve — Approve premium booking"
      - "POST /bookings/{id}/reject — Reject premium booking"
    shared_operations:
      - "All employee operations"
      - "POST /bookings/{id}/cancel — Cancel any booking"
      - "POST /series/{id}/cancel — Cancel any series"
      - "DELETE /waitlist/{id} — Cancel any waitlist entry"

  - name: facility_admin
    description: "Full system access: manage rooms, run ops, view audit logs, plus all manager operations"
    exclusive_operations:
      - "POST /rooms — Create room"
      - "PUT /rooms/{id} — Update room (including status transitions)"
      - "POST /rooms/{id}/run_ops — Run operations housekeeping"
      - "GET /audit-logs — View audit logs"
      - "GET /audit-logs/{id} — View audit log entry"
    shared_operations:
      - "All manager operations"
