            - "sh1_status == SCHEDULED (window start 2026-06-15 inclusive)"
            - "sh2_status == SCHEDULED (window end 2026-08-15 inclusive)"
            - "err == ERR_OUTSIDE_DELIVERY_WINDOW (2026-08-16 one day past end)"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: list_polines_paginates_and_filters_by_po
        claim_type: pagination_with_filtering
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "GET /v1/po-lines honors purchase_order_id filter plus limit/offset: page 1 of 2 over a 3-line PO returns 2 records with has_more true and total_count 3; offset 2 returns the final record with has_more false."
        test_recipe:
          setup: ["District D1; flat award accepted; PO-1 with three lines (qty 3, 3, 3); PO-2 with one line"]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /v1/districts", payload: { name: "District D1", annual_cap_cents: 100000000 }, as: ContractorAdmin, captures: { d1: $.data.id } }
            - { call: "POST /v1/bid-specs", payload: { district_id: "${d1}", title: "Spec A", bid_due_date: "2026-04-01", delivery_window_start: "2026-06-15", delivery_window_end: "2026-08-15" }, as: DistrictBuyer, as_user_id: "${d1}", captures: { specA: $.data.id } }
            - { call: "POST /v1/spec-lines", payload: { bid_spec_id: "${specA}", manufacturer: "Acme", model: "Desk-100", qty: 500, max_unit_price_cents: 13000 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { slA: $.data.id } }
            - { call: "POST /v1/bid-specs/${specA}/publish", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/bid-specs/${specA}/close", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/awards", payload: { bid_spec_id: "${specA}", district_id: "${d1}", pricing_mode: "AWARD_FLAT", flat_unit_price_cents: 11000, install_rate_cents: 25125, order_by_date: "2026-06-01", warranty_years: 5 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { awardA: $.data.id } }
            - { call: "POST /v1/awards/${awardA}/accept", payload: {}, as: ContractManager }
            - { call: "POST /v1/purchase-orders", payload: { award_id: "${awardA}", po_number: "PO-1", fiscal_year: 2026 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { po1: $.data.id } }
            - { call: "POST /v1/po-lines", payload: { purchase_order_id: "${po1}", spec_line_id: "${slA}", ordered_qty: 3 }, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/po-lines", payload: { purchase_order_id: "${po1}", spec_line_id: "${slA}", ordered_qty: 3 }, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/po-lines", payload: { purchase_order_id: "${po1}", spec_line_id: "${slA}", ordered_qty: 3 }, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/purchase-orders", payload: { award_id: "${awardA}", po_number: "PO-2", fiscal_year: 2026 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { po2: $.data.id } }
            - { call: "POST /v1/po-lines", payload: { purchase_order_id: "${po2}", spec_line_id: "${slA}", ordered_qty: 7 }, as: DistrictBuyer, as_user_id: "${d1}" }
          trigger:
            - { call: "GET /v1/po-lines", payload: { purchase_order_id: "${po1}", limit: 2, offset: 0 }, as: FulfillmentCoordinator, captures: { page1_first : "$.data[0].id" } }
            - { call: "GET /v1/po-lines", payload: { purchase_order_id: "${po1}", limit: 2, offset: 2 }, as: FulfillmentCoordinator, captures: { page2_first : "$.data[0].id" } }
          assert:
            - "Page 1: 2 records, total_count == 3, has_more == true (envelope pagination fields per §1.0)"
            - "Page 2 (offset 2): 1 record, has_more == false"
            - "page1_first != page2_first and both belong to ${po1}; ${po2}'s line never appears under the ${po1} filter"

      - name: declare_backorder_on_fully_delivered_line_rejected
        claim_type: conditional_action
        grounds: [state_machines.POLine.ORDERED_to_BACKORDERED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "declare-backorder requires an undelivered remainder; on a fully DELIVERED line (ordered 10, delivered 10) it is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["District D1; flat award; PO line qty 10 fully delivered 2026-07-01"]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /v1/districts", payload: { name: "District D1", annual_cap_cents: 100000000 }, as: ContractorAdmin, captures: { d1: $.data.id } }
