      - name: fee_recomputed_when_assigned_category_differs
        claim_type: derived_field_reconciliation
        grounds: [entities.EntryApplication.fields.fee_cents, calculations.entry_fee, state_machines.EntryApplication.UNDER_REVIEW_to_APPROVED]
        distinguishing_aspect: "Derived-field reconciliation: the committee assigns a different category than requested, and fee_cents is recomputed on the new basis — 79000 (FLOAT) becomes 69000 (VEHICLE) for the same 120 participants."
        test_recipe:
          setup: ["One parade; entry requested FLOAT with 120 participants (fee 79000), now UNDER_REVIEW"]
          setup_api_calls:
            - { call: "POST /parades", payload: { name: "Recat Parade", parade_date: "2026-07-04T10:00:00Z", entry_deadline: "2026-06-20T23:59:59Z" }, as: CommitteeAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /parades/${p_id}/entries", payload: { org_name: "Recat Floats", requested_category: "FLOAT", estimated_participants: 120 }, as: Entrant, as_user_id: "entrant_1", captures: { en_id: $.data.id, fee_pre: $.data.fee_cents } }
            - { call: "POST /entries/${en_id}/start-review", payload: {}, as: CommitteeAdmin }
          trigger:
            - { call: "POST /entries/${en_id}/approve", payload: { assigned_category: "VEHICLE" }, as: CommitteeAdmin, captures: { fee_post: $.data.fee_cents, cat: $.data.assigned_category } }
          assert:
            - "fee_cents before approve == 79000 (FLOAT basis)"
            - "fee_cents after approve == 69000 (VEHICLE base 40000 + 50x300 + 70x200) — recomputed from assigned_category"
            - "assigned_category == VEHICLE"

