  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: nl_case_parallel_dimensions_clearance_cycle
        grounds:
          - state_machines[ProcedureCase.schedule_status]
          - state_machines[ProcedureCase.clearance_status]
          - complexity_profile.state_machine_shape
          - endpoints[POST /urology/procedure-cases/{id}/reschedule]
          - endpoints[POST /urology/procedure-cases/{id}/clearance-review]
        distinguishing_aspect: |
          Non-linearity of the PARALLEL kind plus a genuine cycle inside one
          dimension: clearance_status walks CLEARED -> BLOCKED -> CLEARED while
          schedule_status never leaves SCHEDULED, and schedule_status separately
          takes its SCHEDULED -> SCHEDULED self-loop via reschedule while
          clearance_status stays CLEARED. Neither dimension is a function of the
          other, and both revisit a state they already occupied. The other
          instance is non-linear in a different way: a five-stage reprocessing
          cycle that returns a single dimension to its initial state.
        test_recipe:
          setup:
            - "one urologist, one scheduler, one procedure nurse"
            - "patient Dana Wray, egfr 60"
            - "room Cysto A: CYSTO_SUITE, turnover_minutes 10"
            - "type CYSTOSCOPY: base 20, cleanup HIGH, no scope, no antibiotic, required_prep_codes []"
            - "clock at 2026-09-14T07:00:00Z so both windows are in the future"
            - "turnover is max(10 * 2, 15) + 0 = 20, so the block is procedure 20 + turnover 20 = 40 minutes"
          setup_api_calls:
            - call: "POST /urology/providers"
              payload: { full_name: "Dr Ada Nour", npi: "1000000001", role_type: "UROLOGIST" }
              as: PracticeAdmin
