      - name: contract_execute_side_effects_fire_in_the_declared_order
        claim_type: side_effect_execution
        grounds:
          - state_machines.Contract.transitions.SENT_to_EXECUTED.side_effects
          - state_machines.RouteStop.transitions.PLANNED_to_CONFIRMED.side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / contract_execute_cascades_four_hops_to_inspection_slots_and_posture
          rationale: "That §1.8 instance asserts every hop of the execute cascade (guarantee ledger, stop CONFIRMED, allocations COMMITTED in created_at order, inspection slot assignment, posture recomputation) with literal values."

      - name: contract_negotiation_loop_terminates_at_the_round_budget
        claim_type: cyclic
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Contract.transitions.COUNTERED_to_SENT
          - errors[ERR_NEGOTIATION_ROUNDS_EXHAUSTED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / contract_negotiation_cycle_dead_ends_at_the_round_budget
          rationale: "That §1.8 instance walks SENT -> COUNTERED -> SENT twice and asserts the third send fails with ERR_NEGOTIATION_ROUNDS_EXHAUSTED, which is exactly the cyclic loop-budget claim."

      - name: settlement_dispute_loop_returns_to_provisional_and_recomputes
        claim_type: cyclic
        grounds:
          - state_machines.Settlement.transitions.DISPUTED_to_PROVISIONAL
          - endpoints[POST /settlements/{id}/reconcile]
        excluded_because:
          difficulty_instance: non_linear_state_machine / settlement_dispute_reconcile_cycle_recomputes_amounts_and_clears_the_reason
          rationale: "The PROVISIONAL -> DISPUTED -> PROVISIONAL loop, the cleared dispute_reason and the recomputed money fields are all asserted there."

      - name: stop_cancel_compensates_every_prior_side_effect
        claim_type: compensation
        grounds:
          - state_machines.RouteStop.transitions.PLANNED_to_DARK.side_effects
          - entities.RouteStop.fields.allocated_sqft_used
          - entities.Route.fields.total_guaranteed_cents
        excluded_because:
          difficulty_instance: compensating_invariant / stop_cancel_reverses_the_lot_footprint_and_power_ledger_to_zero
          rationale: "Cancel-as-compensation (lot ledgers back to 0, allocations RELEASED, ride AVAILABLE, no drift) is the whole subject of that §1.8 instance."

      - name: route_closes_when_every_stop_reaches_a_terminal_state
          # bubble-up: children terminal -> parent auto-transitions
        claim_type: bubble_up
        grounds:
          - state_machines.Route.transitions.IN_PROGRESS_to_CLOSED
          - state_machines.RouteStop.transitions.TEARDOWN_to_CLOSED.side_effects
          - entities.Route.fields.closed_stop_count
        excluded_because:
          difficulty_instance: transitive_cascade / settlement_finalize_cascades_three_hops_to_crew_worker_and_route_closure
          rationale: "That §1.8 instance drives the settlement to FINAL and asserts the stop CLOSED, crew COMPLETED, worked_days_count and the Route bubbling IN_PROGRESS -> CLOSED once closed_stop_count reaches stop_count."

      - name: guarded_execute_requires_the_parent_route_state
        claim_type: guarded_transitions
        grounds:
          - state_machines.Contract.transitions.SENT_to_EXECUTED.preconditions
          - errors[ERR_ROUTE_STATE_INVALID]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / contract_execute_requires_the_parent_route_to_be_committed
          rationale: "The cross-entity guard (contract transition gated on Route.status == COMMITTED) is asserted there in both the blocked and the unblocked direction."

  # ===========================================================================
  # SECTION 3 — Calculations
  # ===========================================================================
  - section: calculations
    instances:

      - name: sequencing_pads_a_495_mile_haul_with_one_mandated_rest_block
        claim_type: correct_result
        grounds:
          - calculations.route_travel_feasibility
          - entities.RouteStop.fields.travel_hours_from_previous
          - entities.RouteStop.fields.sequence_index
          - entities.Route.fields.total_travel_hours
          - entities.Route.fields.total_haul_miles
          - endpoints[POST /routes/{id}/sequence]
        distinguishing_aspect: |
          495 miles at 45 mph is exactly 11.0 raw drive hours, which is exactly MAX_DRIVE_HOURS_PER_SHIFT, so
          floor(11.0 / 11) = 1 rest block fires and travel_hours_from_previous becomes 11.0 + 10 = 21.00 — not
          11.00 (rest ignored) and not 31.00 (two blocks). The head stop keeps travel_hours 0 and the route
          totals sum only the chained stops.
        test_recipe:
          setup:
            - "Jurisdiction OH, Venue V1 and Venue V2, Route R1 in DRAFT."
            - "Stop A (head): load-in 2026-09-01T06:00Z, open 2026-09-04T12:00Z, close 2026-09-07T12:00Z, teardown 2026-09-08T12:00Z, haul 0."
            - "Stop B: previous_stop_id = A, haul_miles_from_previous 495, load-in 2026-09-09T15:00Z — exactly 27 h after A's teardown_deadline, which equals the required 21.00 + 6 h."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", permit_lead_days: 10, amusement_tax_pct: 6.5, permit_fee_cents: 50000 }
              as: PlatformAdmin
              captures: { jur_c1: "$.data.id" }
            - call: "POST /venues"
              payload: { jurisdiction_id: "${jur_c1}", name: "Franklin County Fairgrounds", city: "Columbus", lot_area_sqft: 100000, power_amps_available: 1200, expected_attendance: 20001, lot_surface: "GRAVEL" }
              as: PlatformAdmin
              captures: { ven_c1a: "$.data.id" }
            - call: "POST /venues"
              payload: { jurisdiction_id: "${jur_c1}", name: "Union County Fairgrounds", city: "Marysville", lot_area_sqft: 200000, power_amps_available: 1000, expected_attendance: 10001, lot_surface: "PAVED" }
              as: PlatformAdmin
              captures: { ven_c1b: "$.data.id" }
            - call: "POST /routes"
              payload: { name: "2026 Midwest Swing", season_year: 2026, home_base_state: "OH" }
              as: RouteManager
              captures: { route_c1: "$.data.id" }
            - call: "POST /route-stops"
              payload: { route_id: "${route_c1}", venue_id: "${ven_c1a}", load_in_start: "2026-09-01T06:00:00Z", open_date: "2026-09-04T12:00:00Z", close_date: "2026-09-07T12:00:00Z", teardown_deadline: "2026-09-08T12:00:00Z", haul_miles_from_previous: 0 }
              as: RouteManager
              captures: { stop_c1a: "$.data.id" }
            - call: "POST /route-stops"
              payload: { route_id: "${route_c1}", venue_id: "${ven_c1b}", previous_stop_id: "${stop_c1a}", haul_miles_from_previous: 495, load_in_start: "2026-09-09T15:00:00Z", open_date: "2026-09-12T12:00:00Z", close_date: "2026-09-15T12:00:00Z", teardown_deadline: "2026-09-16T12:00:00Z" }
              as: RouteManager
              captures: { stop_c1b: "$.data.id" }
          trigger:
            - call: "POST /routes/${route_c1}/sequence"
              payload: {}
              as: RouteManager
          assert:
            - "HTTP 200 and Route.${route_c1}.status == \"SEQUENCED\""
            - "RouteStop.${stop_c1a}.sequence_index == 0 and travel_hours_from_previous == 0"
            - "RouteStop.${stop_c1b}.sequence_index == 1 and travel_hours_from_previous == 21.0"
            - "Route.${route_c1}.total_haul_miles == 495 and total_travel_hours == 21.0"
            - "Route.${route_c1}.stop_count == 2 and closed_stop_count == 0"

      - name: sequencing_rejects_a_load_in_one_hour_short_of_the_required_gap
        claim_type: constants_applied
        grounds:
          - calculations.route_travel_feasibility.constants.LOAD_OUT_BUFFER_HOURS
          - validations[priority=74]
          - errors[ERR_INSUFFICIENT_TRAVEL_WINDOW]
        distinguishing_aspect: |
          The gap test is travel_hours_from_previous + LOAD_OUT_BUFFER_HOURS = 21.00 + 6 = 27.00 h, so a 26 h gap
          (load-in 2026-09-09T14:00Z) fails with ERR_INSUFFICIENT_TRAVEL_WINDOW (422) while the 27 h gap one hour
          later is admitted. A server that forgets the 6 h load-out buffer, or that measures the gap from the
          previous stop's close_date instead of its teardown_deadline, admits this fixture and fails.
        test_recipe:
          setup:
            - "Identical fixture to sequencing_pads_a_495_mile_haul_with_one_mandated_rest_block except stop B's load_in_start is 2026-09-09T14:00Z, giving a 26 h gap."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", permit_lead_days: 10, amusement_tax_pct: 6.5, permit_fee_cents: 50000 }
              as: PlatformAdmin
              captures: { jur_c2: "$.data.id" }
            - call: "POST /venues"
              payload: { jurisdiction_id: "${jur_c2}", name: "Franklin County Fairgrounds", city: "Columbus", lot_area_sqft: 100000, power_amps_available: 1200, expected_attendance: 20001, lot_surface: "GRAVEL" }
              as: PlatformAdmin
              captures: { ven_c2a: "$.data.id" }
            - call: "POST /venues"
              payload: { jurisdiction_id: "${jur_c2}", name: "Union County Fairgrounds", city: "Marysville", lot_area_sqft: 200000, power_amps_available: 1000, expected_attendance: 10001, lot_surface: "PAVED" }
              as: PlatformAdmin
              captures: { ven_c2b: "$.data.id" }
            - call: "POST /routes"
              payload: { name: "2026 Midwest Swing", season_year: 2026, home_base_state: "OH" }
              as: RouteManager
              captures: { route_c2: "$.data.id" }
            - call: "POST /route-stops"
              payload: { route_id: "${route_c2}", venue_id: "${ven_c2a}", load_in_start: "2026-09-01T06:00:00Z", open_date: "2026-09-04T12:00:00Z", close_date: "2026-09-07T12:00:00Z", teardown_deadline: "2026-09-08T12:00:00Z", haul_miles_from_previous: 0 }
              as: RouteManager
              captures: { stop_c2a: "$.data.id" }
            - call: "POST /route-stops"
              payload: { route_id: "${route_c2}", venue_id: "${ven_c2b}", previous_stop_id: "${stop_c2a}", haul_miles_from_previous: 495, load_in_start: "2026-09-09T14:00:00Z", open_date: "2026-09-12T12:00:00Z", close_date: "2026-09-15T12:00:00Z", teardown_deadline: "2026-09-16T12:00:00Z" }
              as: RouteManager
              captures: { stop_c2b: "$.data.id" }
          trigger:
            - call: "POST /routes/${route_c2}/sequence"
              payload: {}
              as: RouteManager
              captures: { err_c2: "$.data.error_id" }
          assert:
            - "HTTP 422 with data.error_id == \"ERR_INSUFFICIENT_TRAVEL_WINDOW\""
            - "Route.${route_c2}.status == \"DRAFT\" (the sequence attempt is atomic — no partial write)"
            - "Route.${route_c2}.total_haul_miles == 0 and total_travel_hours == 0"
            - "RouteStop.${stop_c2b}.sequence_index == 0 and travel_hours_from_previous == 0"

      - name: darkened_stops_drop_out_of_the_route_travel_totals
        claim_type: input_set_filtering
        grounds:
          - calculations.route_travel_feasibility.input_set
          - state_machines.RouteStop.transitions.PLANNED_to_DARK
          - entities.Route.fields.stop_count
          - entities.Route.fields.closed_stop_count
        distinguishing_aspect: |
          The chain walk and both route totals read only stops with status != DARK. Cancelling the tail stop C
          (300 haul miles) before sequencing must leave total_haul_miles at 495 and total_travel_hours at 21.00,
          keep the A -> B chain valid (the cancelled stop is not treated as a missing chain member), and move
          stop_count to 2 with closed_stop_count 1.
        test_recipe:
          setup:
            - "Jurisdiction OH, Venues V1/V2/V3, Route R1 in DRAFT with three chained stops A -> B -> C."
