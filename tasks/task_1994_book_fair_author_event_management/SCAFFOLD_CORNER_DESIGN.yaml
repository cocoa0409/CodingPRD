          - "endpoints.POST /_clock/set_current_utc"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "System transition: advancing the logical clock past offer_expires_at sweeps the agreement to EXPIRED; any later counter is a terminal-state rejection."
        test_recipe:
          setup: ["agreement PROPOSED with offer_expiry_hours 1 (expires 2026-08-01T01:00:00Z under the default clock)"]
          setup_api_calls:
            - { call: "POST /parties", payload: { kind: SCHOOL, name: "Ridgeview Elementary", contact_email: "pta@ridgeview.example" }, as: Organizer, captures: { school_id: "$.data.id" } }
