  - rule_id: cross_entity_state_dependency
    instances:
      - name: pick_blocked_when_section_under_renovation
        grounds:
          - validations.priority_11
          - state_machines.Section.NONE_to_SURVEYED
          - state_machines.SelectionSlot.SCHEDULED_to_CONSUMED
          - errors.ERR_SECTION_UNDER_RENOVATION
        distinguishing_aspect: |
          The pick request names only a slot and a seat, yet its legality is
          decided two hops away by the Section the seat belongs to: with the
          section's status flipped to UNDER_RENOVATION by a SURVEY the pick is
          refused with ERR_SECTION_UNDER_RENOVATION even though the slot, the
