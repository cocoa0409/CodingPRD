# =============================================================================
# SCAFFOLD — task_3378 Business Accreditation, Complaint Mediation & Rating
# Methodology (Better Business Bureau style)
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Business Accreditation, Complaint Mediation & Rating Methodology (Better
  Business Bureau): business accreditation application with standards review on
  advertising practices, complaint history and licensing verification,
  accreditation dues by business size with local bureau territory assignment,
  complaint intake from consumers with forwarding to the business and a defined
  response window, mediation and arbitration offerings when a complaint is not
  resolved directly, rating computation from complaint volume, resolution
  behavior, business age, transparency and advertising review findings,
  business response, rebuttal and rating dispute process with appeal to the
  bureau, advertising review referrals to regulators for deceptive claims,
  scam reporting collection and pattern publication.

domain_name: business-accreditation-complaints-ratings
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
    - derived_field_reconciliation
    - rate_threshold_triggers
  entity_topology: hybrid          # bureaus assign businesses; complaints cross-reference consumers x businesses; cases nest under complaints
  state_machine_shape: compound    # cyclic complaint rebuttal loop + cyclic accreditation reapply + parallel Business dimensions
  relationship_patterns:
    - one_to_many
    - cross_aggregate              # Complaint references both Consumer and Business; MediationCase/ArbitrationCase hang off Complaint
  role_model: hierarchical_override  # BureauAdmin superset; StandardsReviewer exclusive on decisions; entity-backed parties act on own resources
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
# Logical clock: the server runs on a simulated clock. Startup default is
# exactly 2026-09-01T00:00:00Z (pinned); it never falls back to wall-clock.
# All "now" below means the logical clock. All durations are pinned literals.
entities:
  - name: Bureau
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Bureau display name" }
      - { name: territory_state_codes, type: array, source: input, description: "Array of 2-letter US state codes this bureau serves; each state code may appear in at most one bureau (ERR_STATE_ALREADY_ASSIGNED)" }
      - { name: local_dues_fee_cents, type: integer, source: input, default: 0, description: "Bureau-local flat fee added to base accreditation dues; >= 0" }
      - { name: dues_collected_cents, type: integer, source: computed, default: 0, description: "Sum over all non-VOID DuesInvoice rows of businesses assigned to this bureau of (paid_cents - refunded_cents)" }
      - { name: ops_day_index, type: integer, source: system, default: 0, description: "Monotone counter incremented by run_daily_close" }

  - name: Consumer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Consumer full name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across consumers (ERR_INVALID_REQUEST on duplicate)" }
      - { name: home_state_code, type: string, source: input, description: "2-letter US state code of residence" }
      - { name: complaints_filed_count, type: integer, source: computed, default: 0, description: "Count of Complaint rows with consumer_id == this consumer" }

  - name: Business
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered legal name" }
      - { name: home_state_code, type: string, source: input, description: "2-letter state of principal place of business; drives territory assignment" }
      - { name: employee_count, type: integer, source: input, description: "Headcount >= 1; determines size_tier" }
      - { name: founded_on, type: datetime, source: input, description: "Founding date (ISO8601); drives business-age rating factor and accreditation eligibility" }
      - { name: bureau_id, type: string, source: computed, description: "FK -> Bureau.id; assigned at creation to the unique bureau whose territory_state_codes contains home_state_code (ERR_TERRITORY_UNCOVERED if none)" }
      - { name: size_tier, type: enum, source: computed, description: "MICRO (1-4 employees) | SMALL (5-19) | MEDIUM (20-99) | LARGE (>=100)" }
      - { name: accreditation_status, type: enum, source: system, default: "NOT_ACCREDITED", description: "NOT_ACCREDITED | ACCREDITED | SUSPENDED | REVOKED (parallel dimension 1)" }
      - { name: advertising_compliance_status, type: enum, source: system, default: "CLEAR", description: "CLEAR | UNDER_AD_REVIEW | REFERRED_TO_REGULATOR (parallel dimension 2)" }
      - { name: suspension_count_24m, type: integer, source: system, default: 0, description: "Suspensions entered within trailing 730 days; reaching 2 forces REVOKED instead of SUSPENDED" }
      - { name: last_suspension_at, type: datetime, source: system, description: "Logical-clock instant of most recent suspension; null if never suspended; suspensions older than 730 days drop out of suspension_count_24m", default: null }
      - { name: complaints_received_36m, type: integer, source: computed, default: 0, description: "Count of complaints with filed_at within trailing 1095 days in a rating outcome state {RESOLVED, UNANSWERED, UNRESOLVED, MEDIATION_RESOLVED, MEDIATION_FAILED, ARBITRATED}" }
      - { name: complaints_unanswered_36m, type: integer, source: computed, default: 0, description: "Count of complaints in trailing 1095 days with status UNANSWERED" }
      - { name: complaints_unresolved_36m, type: integer, source: computed, default: 0, description: "Count of complaints in trailing 1095 days with status in {UNRESOLVED, MEDIATION_FAILED}" }
      - { name: complaints_open_count, type: integer, source: computed, default: 0, description: "Count of complaints in open states {RECEIVED, FORWARDED, RESPONSE_RECEIVED, CONSUMER_REBUTTED, MEDIATION_OFFERED, IN_MEDIATION, UNRESOLVED, MEDIATION_FAILED, IN_ARBITRATION}" }
      - { name: complaints_closed_count, type: integer, source: computed, default: 0, description: "Count of complaints in closed states {RESOLVED, UNANSWERED, MEDIATION_RESOLVED, ARBITRATED}" }
      - { name: published_scam_count_12m, type: integer, source: computed, default: 0, description: "Count of ScamReport rows for this business with status PUBLISHED and published_at within trailing 365 days" }
      - { name: current_published_score, type: integer, source: computed, description: "Score of the latest PUBLISHED RatingSnapshot (by published_at, tie-break created_at DESC); null until first publish", default: null }
      - { name: current_published_grade, type: string, source: computed, description: "Letter grade of latest PUBLISHED snapshot; null until first publish", default: null }
      - { name: current_provisional_score, type: integer, source: computed, description: "Score of the latest PROVISIONAL RatingSnapshot (auto-regenerated on every complaint-counter / ad-status / scam-count change); null until first computation", default: null }
      - { name: current_provisional_grade, type: string, source: computed, description: "Letter grade of latest PROVISIONAL snapshot; null until first computation", default: null }

  - name: AccreditationApplication
    parent: null
    common_fields: true
    fields:
      - { name: business_id, type: string, source: input, description: "FK -> Business.id; applicant business" }
      - { name: billing_plan, type: enum, source: input, description: "ANNUAL_PREPAID | QUARTERLY; copied onto the issued DuesInvoice" }
      - { name: license_number, type: string, source: input, description: "Business license number presented for verification" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | APPROVED_PENDING_DUES | ACCREDITED | DENIED | EXPIRED" }
      - { name: reapplication_count, type: integer, source: system, default: 0, description: "Increments each time a DENIED application is reopened to DRAFT" }
      - { name: submitted_at, type: datetime, source: system, description: "Clock instant of latest DRAFT -> SUBMITTED", default: null }
      - { name: decided_at, type: datetime, source: system, description: "Clock instant of latest decision (APPROVE or DENY)", default: null }
      - { name: denial_reason, type: string, source: system, description: "Reviewer-supplied reason when decision == DENY; null otherwise", default: null }
      - { name: advertising_practices_result, type: enum, source: system, description: "PASS | FAIL — set by reviewer in decision payload", default: null }
      - { name: complaint_history_result, type: enum, source: system, description: "PASS | FAIL — set by reviewer in decision payload", default: null }
      - { name: licensing_result, type: enum, source: system, description: "PASS | FAIL — set by reviewer in decision payload", default: null }
      - { name: dues_invoice_id, type: string, source: system, description: "Informational id of the DuesInvoice issued at APPROVE; null until approved", default: null }

  - name: DuesInvoice
    parent: null
    common_fields: true
    fields:
      - { name: business_id, type: string, source: system, description: "FK -> Business.id; invoiced business" }
      - { name: application_id, type: string, source: system, description: "Informational lineage id of the AccreditationApplication whose approval issued this invoice (not a referential key)" }
      - { name: billing_plan, type: enum, source: system, description: "ANNUAL_PREPAID | QUARTERLY — copied from the application" }
      - { name: size_tier_at_issue, type: enum, source: system, description: "Business.size_tier frozen at issue time: MICRO | SMALL | MEDIUM | LARGE" }
      - { name: base_amount_cents, type: integer, source: system, description: "Tier base dues: MICRO 42500 | SMALL 68000 | MEDIUM 115000 | LARGE 240000" }
      - { name: local_fee_cents, type: integer, source: system, description: "Bureau.local_dues_fee_cents frozen at issue time" }
      - { name: amount_due_cents, type: integer, source: computed, description: "Plan-adjusted total per calculation dues_amount" }
      - { name: installments, type: array, source: computed, description: "QUARTERLY: array of 4 objects {installment, amount_cents} per dues_amount; ANNUAL_PREPAID: single-element array" }
      - { name: paid_cents, type: integer, source: system, default: 0, description: "Sum of PAYMENT ledger entries" }
      - { name: refunded_cents, type: integer, source: system, default: 0, description: "Sum of REFUND ledger entries" }
      - { name: balance_cents, type: integer, source: computed, description: "= amount_due_cents - (paid_cents - refunded_cents); never negative" }
      - { name: status, type: enum, source: system, default: "ISSUED", description: "ISSUED | PARTIALLY_PAID | PAID | OVERDUE | REFUNDED | VOID" }
      - { name: issued_at, type: datetime, source: system, description: "Clock instant of issuance (decision time)" }
      - { name: due_date, type: datetime, source: system, description: "= issued_at + 30 days" }
      - { name: voided_at, type: datetime, source: system, default: null, description: "Clock instant of VOID transition; unpaid VOID invoices gate future applications for 365 days" }

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - { name: consumer_id, type: string, source: input, description: "FK -> Consumer.id; filing consumer (must equal X-User-ID for Consumer role)" }
      - { name: business_id, type: string, source: input, description: "FK -> Business.id; subject business" }
      - { name: category, type: enum, source: input, description: "SERVICE | PRODUCT | BILLING | ADVERTISING | DELIVERY | WARRANTY | OTHER" }
      - { name: description, type: string, source: input, description: "Free-text complaint body" }
      - { name: status, type: enum, source: system, default: "RECEIVED", description: "RECEIVED | FORWARDED | RESPONSE_RECEIVED | CONSUMER_REBUTTED | RESOLVED | UNRESOLVED | UNANSWERED | MEDIATION_OFFERED | IN_MEDIATION | MEDIATION_RESOLVED | MEDIATION_FAILED | IN_ARBITRATION | ARBITRATED" }
      - { name: filed_at, type: datetime, source: system, description: "Clock instant at creation" }
      - { name: forwarded_at, type: datetime, source: system, default: null, description: "Clock instant of latest forward to the business" }
      - { name: response_deadline_at, type: datetime, source: system, default: null, description: "= forwarded_at + 14 days; business responses with received_at <= response_deadline_at are on time (inclusive boundary)" }
      - { name: last_unresolved_at, type: datetime, source: system, default: null, description: "Clock instant of the first entry into UNRESOLVED; mediation offer window anchor (not refreshed by mediation decline)" }
      - { name: resolution_outcome, type: enum, source: system, default: null, description: "CONSUMER_ACCEPTED | CONSUMER_REJECTED | AUTO_UNANSWERED | MEDIATION_AGREEMENT | MEDIATION_NO_AGREEMENT | ARBITRATION_ADVERSE | ARBITRATION_NO_FAULT; null while open" }
      - { name: rebuttal_count, type: integer, source: system, default: 0, description: "Number of CONSUMER_REBUTTAL responses; hard cap 3" }
      - { name: reopen_count, type: integer, source: system, default: 0, description: "Number of times reopened from {RESOLVED, UNANSWERED}" }
      - { name: closed_at, type: datetime, source: system, default: null, description: "Clock instant of entry into a closed state; cleared on reopen" }
      - { name: responses, type: array, source: system, default: [], description: "Append-only embedded list of {kind: BUSINESS_RESPONSE | CONSUMER_REBUTTAL | CONSUMER_ACCEPT | CONSUMER_REJECT, body, received_at, on_time}; on_time = received_at <= response_deadline_at" }

  - name: MediationCase
    parent: null
    common_fields: true
    fields:
      - { name: complaint_id, type: string, source: input, description: "FK -> Complaint.id; complaint under mediation (implied by creation path)" }
      - { name: status, type: enum, source: system, default: "OFFERED", description: "OFFERED | ACCEPTED | DECLINED | DECLINED_EXPIRED | SCHEDULED | CONCLUDED_AGREEMENT | CONCLUDED_NO_AGREEMENT" }
      - { name: offered_at, type: datetime, source: system, description: "Clock instant of creation" }
      - { name: offer_deadline_at, type: datetime, source: system, description: "= offered_at + 7 days; sweep flips unanswered OFFERED cases to DECLINED_EXPIRED" }
      - { name: business_response, type: enum, source: system, default: "PENDING", description: "PENDING | ACCEPTED | DECLINED" }
      - { name: consumer_response, type: enum, source: system, default: "PENDING", description: "PENDING | ACCEPTED | DECLINED" }
      - { name: mediator_id, type: string, source: input, description: "Opaque staff identifier of the assigned mediator; set at schedule" , default: null }
      - { name: session_start_at, type: datetime, source: input, default: null, description: "Mediation session start (ISO8601); sessions are half-open [start, end)" }
      - { name: session_end_at, type: datetime, source: input, default: null, description: "Mediation session end; must be strictly after session_start_at" }

  - name: ArbitrationCase
    parent: null
    common_fields: true
    fields:
      - { name: complaint_id, type: string, source: input, description: "FK -> Complaint.id; complaint under arbitration (implied by creation path)" }
      - { name: source_mediation_case_id, type: string, source: system, description: "Informational lineage id of the failed MediationCase (not a referential key)" }
      - { name: status, type: enum, source: system, default: "FILED", description: "FILED | HEARING_SCHEDULED | DECIDED" }
      - { name: hearing_room_id, type: string, source: input, default: null, description: "Opaque hearing-room identifier; hearings in the same room need a 30-minute buffer on both sides" }
      - { name: hearing_start_at, type: datetime, source: input, default: null, description: "Hearing start (ISO8601)" }
      - { name: hearing_end_at, type: datetime, source: input, default: null, description: "Hearing end; must be strictly after hearing_start_at" }
      - { name: outcome, type: enum, source: system, default: null, description: "ADVERSE_TO_BUSINESS | NO_FAULT; set by render-decision" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Clock instant of decision" }

  - name: RatingSnapshot
    parent: null
    common_fields: true
    fields:
      - { name: business_id, type: string, source: system, description: "FK -> Business.id; rated business (implied by creation path)" }
      - { name: variant, type: enum, source: input, description: "PROVISIONAL | PUBLISHED; same underlying data, different input sets per rating_score" }
      - { name: volume_deduction, type: integer, source: computed, description: "Complaint-volume deduction component" }
      - { name: unanswered_deduction, type: integer, source: computed, description: "Unanswered-complaint deduction component" }
      - { name: unresolved_deduction, type: integer, source: computed, description: "Unresolved-complaint deduction component" }
      - { name: arbitration_deduction, type: integer, source: computed, description: "Adverse-arbitration deduction component" }
      - { name: age_deduction, type: integer, source: computed, description: "Business-age deduction component" }
      - { name: advertising_deduction, type: integer, source: computed, description: "Advertising-compliance deduction component" }
      - { name: scam_deduction, type: integer, source: computed, description: "Scam-pattern deduction component" }
      - { name: pending_deduction, type: integer, source: computed, description: "Open-complaint pending deduction (PROVISIONAL only; 0 for PUBLISHED)" }
      - { name: total_deductions, type: integer, source: computed, description: "Sum of all deduction components" }
      - { name: score, type: integer, source: computed, description: "= max(0, 100 - total_deductions)" }
      - { name: grade, type: enum, source: computed, description: "A_PLUS | A | A_MINUS | B_PLUS | B | B_MINUS | C_PLUS | C | C_MINUS | D_PLUS | D | F" }
      - { name: window_start_at, type: datetime, source: computed, description: "= computed_at - 1095 days" }
      - { name: computed_at, type: datetime, source: system, description: "Clock instant of computation" }
      - { name: published_at, type: datetime, source: system, default: null, description: "Clock instant of publication; set only on PUBLISHED" }
      - { name: excluded_complaint_id, type: string, source: system, default: null, description: "Complaint excluded from input set because an OVERRULED dispute removed it; null otherwise" }
      - { name: superseded_by_id, type: string, source: system, default: null, description: "Informational id of the replacement snapshot after an OVERRULED dispute; null otherwise" }

  - name: RatingDispute
    parent: null
    common_fields: true
    fields:
      - { name: business_id, type: string, source: system, description: "FK -> Business.id; disputing business (implied by creation path)" }
      - { name: snapshot_id, type: string, source: input, description: "Informational id of the disputed PUBLISHED RatingSnapshot (validated to belong to the business)" }
      - { name: reason, type: string, source: input, description: "Free-text dispute rationale" }
      - { name: disputed_complaint_id, type: string, source: input, default: null, description: "Complaint the business contests; excluded from the recomputation when the dispute is OVERRULED" }
      - { name: status, type: enum, source: system, default: "FILED", description: "FILED | UNDER_APPEAL_REVIEW | UPHELD | OVERRULED" }
      - { name: filed_at, type: datetime, source: system, description: "Clock instant of filing" }

  - name: AdvertisingReview
    parent: null
    common_fields: true
    fields:
      - { name: business_id, type: string, source: system, description: "FK -> Business.id; reviewed business (implied by creation path)" }
      - { name: claim_description, type: string, source: input, description: "The advertising claim under review" }
      - { name: status, type: enum, source: system, default: "UNDER_REVIEW", description: "UNDER_REVIEW | CLEARED | REFERRED_TO_REGULATOR" }
      - { name: regulator_name, type: string, source: input, default: null, description: "Regulator receiving the referral; required when conclude outcome is SUBSTANTIATED_DECEPTIVE" }
      - { name: opened_at, type: datetime, source: system, description: "Clock instant of creation" }
      - { name: concluded_at, type: datetime, source: system, default: null, description: "Clock instant of conclusion" }
      - { name: referred_at, type: datetime, source: system, default: null, description: "Clock instant of regulator referral (== concluded_at when deceptive)" }

  - name: ScamReport
    parent: null
    common_fields: true
    fields:
      - { name: consumer_id, type: string, source: input, description: "Lineage id of the reporting Consumer (must equal X-User-ID for Consumer role); consumers have no scam-report read surface" }
      - { name: business_id, type: string, source: input, description: "FK -> Business.id; reported business" }
      - { name: description, type: string, source: input, description: "Free-text scam description" }
      - { name: incident_date, type: datetime, source: input, description: "Date the alleged scam occurred (ISO8601)" }
      - { name: status, type: enum, source: system, default: "RECEIVED", description: "RECEIVED | PUBLISHED" }
      - { name: published_at, type: datetime, source: system, default: null, description: "Clock instant of publication" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Business
    note: "PARALLEL DIMENSIONS — accreditation_status and advertising_compliance_status evolve independently on the same row; a transition on one never reads or writes the other except where explicitly stated."
    dimension: accreditation_status
    initial_state: NOT_ACCREDITED
    terminal_states: [REVOKED]
    transitions:
      - from: NOT_ACCREDITED
        to: ACCREDITED
        trigger: "system (automatic when an AccreditationApplication reaches ACCREDITED on full dues payment)"
        actor: system
        preconditions: []
        side_effects: ["Business.version increments by 1"]
      - from: ACCREDITED
        to: SUSPENDED
        trigger: "system (run_daily_close: latest PUBLISHED snapshot score < 75)"
        actor: system
        preconditions: ["suspension_count_24m < 2 after increment (else REVOKED)"]
        side_effects:
          - "suspension_count_24m += 1; last_suspension_at = now"
          - "Business.version increments by 1"
      - from: ACCREDITED
        to: REVOKED
        trigger: "system (run_daily_close: latest PUBLISHED snapshot score < 75 and suspension_count_24m would reach 2)"
        actor: system
        preconditions: []
        side_effects:
          - "suspension_count_24m += 1; last_suspension_at = now"
          - "Business.version increments by 1"
      - from: SUSPENDED
        to: ACCREDITED
        trigger: "system (run_daily_close: latest PUBLISHED snapshot score >= 80)"
        actor: system
        preconditions: []
        side_effects: ["Business.version increments by 1"]
      - from: SUSPENDED
        to: REVOKED
        trigger: "system (run_daily_close: latest PUBLISHED snapshot score < 75 while already SUSPENDED and suspension_count_24m reaches 2)"
        actor: system
        preconditions: []
        side_effects: ["Business.version increments by 1"]

  - entity: Business
    dimension: advertising_compliance_status
    initial_state: CLEAR
    terminal_states: []
    transitions:
      - from: CLEAR
        to: UNDER_AD_REVIEW
        trigger: "POST /businesses/{id}/advertising-reviews"
        actor: BureauAdmin | StandardsReviewer
        preconditions: []
        side_effects: ["Business.version increments by 1"]
      - from: UNDER_AD_REVIEW
        to: CLEAR
        trigger: "POST /advertising-reviews/{id}/conclude with outcome CLEARED, when no other AdvertisingReview of the business is still UNDER_REVIEW"
        actor: StandardsReviewer
        preconditions: []
        side_effects: ["provisional rating recompute (rating_score) and new PROVISIONAL RatingSnapshot"]
      - from: UNDER_AD_REVIEW
        to: UNDER_AD_REVIEW
        trigger: "POST /advertising-reviews/{id}/conclude with outcome CLEARED, when another AdvertisingReview is still UNDER_REVIEW"
        actor: StandardsReviewer
        preconditions: []
        side_effects: ["status stays UNDER_AD_REVIEW (self-loop)", "provisional rating recompute and new PROVISIONAL RatingSnapshot"]
      - from: UNDER_AD_REVIEW
        to: REFERRED_TO_REGULATOR
        trigger: "POST /advertising-reviews/{id}/conclude with outcome SUBSTANTIATED_DECEPTIVE"
        actor: StandardsReviewer
        preconditions: ["regulator_name must be present in the payload (ERR_INVALID_REQUEST)"]
        side_effects:
          - "AdvertisingReview.status -> REFERRED_TO_REGULATOR, referred_at = now"
          - "provisional rating recompute (rating_score) and new PROVISIONAL RatingSnapshot"
      - from: REFERRED_TO_REGULATOR
        to: UNDER_AD_REVIEW
        trigger: "POST /businesses/{id}/advertising-reviews (a fresh review opens against an already-referred business)"
        actor: BureauAdmin | StandardsReviewer
        preconditions: []
        side_effects: ["status stays REFERRED_TO_REGULATOR until the new review concludes CLEARED with no other open reviews — concluding CLEARED from a referred business moves CLEAR only when no other review is UNDER_REVIEW"]
        note: "REFERRED is sticky: a CLEARED conclusion moves REFERRED_TO_REGULATOR -> CLEAR only when no other review remains UNDER_REVIEW."

  - entity: AccreditationApplication
    initial_state: DRAFT
    terminal_states: [ACCREDITED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /accreditation-applications/{id}/submit"
        actor: BusinessRep
        preconditions:
          - "acting BusinessRep owns the application business (ERR_FORBIDDEN_OWNERSHIP)"
          - "business age >= 183 days at submit (founded_on <= now - 183 days; ERR_BUSINESS_TOO_YOUNG)"
        side_effects: ["submitted_at = now"]
      - from: SUBMITTED
        to: APPROVED_PENDING_DUES
        trigger: "POST /accreditation-applications/{id}/decision with decision APPROVE"
        actor: StandardsReviewer
        preconditions:
          - "all three checklist results in payload are PASS (else must DENY: ERR_INVALID_REQUEST)"
          - "no AdvertisingReview of the business in {UNDER_REVIEW, REFERRED_TO_REGULATOR} (ERR_ADVERTISING_REVIEW_ADVERSE)"
          - "business complaints_unanswered_36m == 0 and complaints_unresolved_36m == 0 (ERR_ADVERSE_COMPLAINT_HISTORY)"
          - "no DuesInvoice of the business with balance_cents > 0 in status OVERDUE, or status VOID with voided_at within trailing 365 days (ERR_OUTSTANDING_DUES_BALANCE)"
        side_effects:
          - "decided_at = now; checklist results persisted"
          - "create DuesInvoice (size_tier_at_issue = Business.size_tier, local_fee_cents = Bureau.local_dues_fee_cents, amount_due_cents per dues_amount, issued_at = now, due_date = now + 30 days, status ISSUED)"
          - "dues_invoice_id set to the new invoice id"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /accreditation-applications/{id}/decision with decision DENY"
        actor: StandardsReviewer
        preconditions: ["denial_reason must be present (ERR_INVALID_REQUEST)"]
        side_effects: ["decided_at = now; checklist results and denial_reason persisted"]
      - from: DENIED
        to: DRAFT
        trigger: "POST /businesses/{id}/accreditation-applications with application_id of this DENIED application"
        actor: BusinessRep
        preconditions:
          - "now >= decided_at + 30 days (ERR_REAPPLICATION_COOLING)"
          - "acting BusinessRep owns the business (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects: ["reapplication_count += 1", "billing_plan and license_number overwritten from payload", "submitted_at/decided_at/denial_reason/checklist results cleared to null"]
      - from: APPROVED_PENDING_DUES
        to: ACCREDITED
        trigger: "system (automatic when the linked DuesInvoice reaches PAID)"
        actor: system
        preconditions: []
        side_effects:
          - "Business.accreditation_status NOT_ACCREDITED -> ACCREDITED (or SUSPENDED -> ACCREDITED)"
          - "Business.version increments by 1"
      - from: APPROVED_PENDING_DUES
        to: EXPIRED
        trigger: "system (run_daily_close: linked DuesInvoice flips to VOID)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Complaint
    initial_state: RECEIVED
    terminal_states: [RESOLVED, UNANSWERED, MEDIATION_RESOLVED, ARBITRATED]
    transitions:
      - from: RECEIVED
        to: FORWARDED
        trigger: "POST /complaints/{id}/forward"
        actor: BureauAdmin
        preconditions: []
        side_effects:
          - "forwarded_at = now; response_deadline_at = now + 14 days"
          - "Business complaint counters recompute (rating input set)"
      - from: FORWARDED
        to: RESPONSE_RECEIVED
        trigger: "POST /complaints/{id}/responses with kind BUSINESS_RESPONSE"
        actor: BusinessRep
        preconditions:
          - "acting BusinessRep owns the complaint business (ERR_FORBIDDEN_OWNERSHIP)"
          - "now <= response_deadline_at (ERR_RESPONSE_WINDOW_EXPIRED) — inclusive boundary: exactly at the deadline is on time"
        side_effects: ["append response {kind: BUSINESS_RESPONSE, received_at: now, on_time: true}"]
      - from: CONSUMER_REBUTTED
        to: RESPONSE_RECEIVED
        trigger: "POST /complaints/{id}/responses with kind BUSINESS_RESPONSE"
        actor: BusinessRep
        preconditions:
          - "acting BusinessRep owns the complaint business (ERR_FORBIDDEN_OWNERSHIP)"
          - "now <= response_deadline_at (ERR_RESPONSE_WINDOW_EXPIRED)"
        side_effects: ["append response {kind: BUSINESS_RESPONSE, received_at: now, on_time: computed}"]
      - from: RESPONSE_RECEIVED
        to: CONSUMER_REBUTTED
        trigger: "POST /complaints/{id}/responses with kind CONSUMER_REBUTTAL"
        actor: Consumer
        preconditions:
          - "acting Consumer is the complaint filer (ERR_FORBIDDEN_OWNERSHIP)"
          - "rebuttal_count < 3 (ERR_REBUTTAL_LIMIT_REACHED)"
        side_effects: ["append response {kind: CONSUMER_REBUTTAL, received_at: now, on_time: true}", "rebuttal_count += 1"]
      - from: RESPONSE_RECEIVED
        to: RESOLVED
        trigger: "POST /complaints/{id}/responses with kind CONSUMER_ACCEPT"
        actor: Consumer
        preconditions: ["acting Consumer is the complaint filer (ERR_FORBIDDEN_OWNERSHIP)"]
        side_effects:
          - "append response {kind: CONSUMER_ACCEPT, received_at: now, on_time: true}"
          - "resolution_outcome = CONSUMER_ACCEPTED; closed_at = now"
          - "Business.complaints_open_count -= 1, complaints_closed_count += 1, complaints_received_36m recompute"
          - "provisional rating recompute and new PROVISIONAL RatingSnapshot"
      - from: RESPONSE_RECEIVED
        to: UNRESOLVED
        trigger: "POST /complaints/{id}/responses with kind CONSUMER_REJECT"
        actor: Consumer
        preconditions: ["acting Consumer is the complaint filer (ERR_FORBIDDEN_OWNERSHIP)"]
        side_effects:
          - "append response {kind: CONSUMER_REJECT, received_at: now, on_time: true}"
          - "resolution_outcome = CONSUMER_REJECTED; last_unresolved_at = now (first entry only)"
          - "Business.complaints_unresolved_36m += 1, complaints_received_36m recompute"
          - "provisional rating recompute and new PROVISIONAL RatingSnapshot"
      - from: FORWARDED
        to: UNANSWERED
        trigger: "system (run_daily_close: now > response_deadline_at)"
        actor: system
        preconditions: []
        side_effects:
          - "resolution_outcome = AUTO_UNANSWERED; closed_at = now"
          - "Business.complaints_unanswered_36m += 1, complaints_open_count -= 1, complaints_closed_count += 1, complaints_received_36m recompute"
          - "provisional rating recompute and new PROVISIONAL RatingSnapshot"
      - from: UNRESOLVED
        to: MEDIATION_OFFERED
        trigger: "POST /complaints/{id}/mediation-cases"
        actor: BureauAdmin
        preconditions:
          - "now <= last_unresolved_at + 14 days (ERR_MEDIATION_WINDOW_EXPIRED)"
          - "the complaint state gate already excludes a second concurrent mediation: any live case leaves the complaint in MEDIATION_OFFERED/IN_MEDIATION, not UNRESOLVED"
        side_effects: ["create MediationCase OFFERED (offered_at = now, offer_deadline_at = now + 7 days)"]
      - from: MEDIATION_OFFERED
        to: IN_MEDIATION
        trigger: "system (automatic when the MediationCase reaches ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: MEDIATION_OFFERED
        to: UNRESOLVED
        trigger: "system (MediationCase DECLINED by a party, or DECLINED_EXPIRED by sweep)"
        actor: system
        preconditions: []
        side_effects: ["last_unresolved_at NOT refreshed"]
      - from: IN_MEDIATION
        to: MEDIATION_RESOLVED
        trigger: "system (MediationCase concludes AGREEMENT)"
        actor: system
        preconditions: []
        side_effects:
          - "resolution_outcome = MEDIATION_AGREEMENT; closed_at = now"
          - "Business.complaints_open_count -= 1, complaints_closed_count += 1, complaints_received_36m recompute"
          - "provisional rating recompute and new PROVISIONAL RatingSnapshot"
      - from: IN_MEDIATION
        to: MEDIATION_FAILED
        trigger: "system (MediationCase concludes NO_AGREEMENT)"
        actor: system
        preconditions: []
        side_effects:
          - "resolution_outcome = MEDIATION_NO_AGREEMENT"
          - "Business.complaints_unresolved_36m += 1 (recompute), complaints_received_36m recompute"
          - "provisional rating recompute and new PROVISIONAL RatingSnapshot"
      - from: MEDIATION_FAILED
        to: IN_ARBITRATION
        trigger: "POST /complaints/{id}/arbitration-cases"
        actor: BureauAdmin
        preconditions: ["the complaint state gate already excludes a second concurrent arbitration: any live case leaves the complaint in IN_ARBITRATION, not MEDIATION_FAILED"]
        side_effects: ["create ArbitrationCase FILED with source_mediation_case_id of the latest CONCLUDED_NO_AGREEMENT case"]
      - from: IN_ARBITRATION
        to: ARBITRATED
        trigger: "system (ArbitrationCase render-decision)"
        actor: system
        preconditions: []
        side_effects:
          - "resolution_outcome = ARBITRATION_ADVERSE or ARBITRATION_NO_FAULT per decision; closed_at = now"
          - "Business.complaints_open_count -= 1, complaints_closed_count += 1, complaints_received_36m recompute"
          - "provisional rating recompute and new PROVISIONAL RatingSnapshot"
      - from: RESOLVED
        to: FORWARDED
        trigger: "POST /complaints/{id}/reopen"
        actor: BureauAdmin
        preconditions: ["now <= closed_at + 30 days (ERR_REOPEN_WINDOW_EXPIRED)"]
        side_effects:
          - "reopen_count += 1; resolution_outcome = null; closed_at = null"
          - "forwarded_at = now; response_deadline_at = now + 14 days"
          - "Business.complaints_open_count += 1, complaints_closed_count -= 1, complaints_received_36m recompute"
          - "provisional rating recompute and new PROVISIONAL RatingSnapshot"
      - from: UNANSWERED
        to: FORWARDED
        trigger: "POST /complaints/{id}/reopen"
        actor: BureauAdmin
        preconditions: ["now <= closed_at + 30 days (ERR_REOPEN_WINDOW_EXPIRED)"]
        side_effects:
          - "reopen_count += 1; resolution_outcome = null; closed_at = null"
          - "forwarded_at = now; response_deadline_at = now + 14 days"
          - "Business.complaints_unanswered_36m -= 1 (recompute), complaints_open_count += 1, complaints_closed_count -= 1"
          - "provisional rating recompute and new PROVISIONAL RatingSnapshot"

  - entity: MediationCase
    initial_state: OFFERED
    terminal_states: [DECLINED, DECLINED_EXPIRED, CONCLUDED_AGREEMENT, CONCLUDED_NO_AGREEMENT]
    transitions:
      - from: OFFERED
        to: OFFERED
        trigger: "POST /mediation-cases/{id}/party-response (one party responds, other still PENDING)"
        actor: BusinessRep | Consumer
        preconditions:
          - "party BUSINESS: acting BusinessRep owns the complaint business; party CONSUMER: acting Consumer is the complaint filer (ERR_FORBIDDEN_OWNERSHIP)"
          - "the responding party's response field is still PENDING (ERR_MEDIATION_INVALID_STATE)"
        side_effects: ["set business_response or consumer_response per payload"]
      - from: OFFERED
        to: ACCEPTED
        trigger: "system (automatic when both business_response and consumer_response are ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: ["Complaint MEDIATION_OFFERED -> IN_MEDIATION"]
      - from: OFFERED
        to: DECLINED
        trigger: "system (automatic when any party response is DECLINED)"
        actor: system
        preconditions: []
        side_effects: ["Complaint MEDIATION_OFFERED -> UNRESOLVED (last_unresolved_at NOT refreshed)"]
      - from: OFFERED
        to: DECLINED_EXPIRED
        trigger: "system (run_daily_close: now > offer_deadline_at and not both accepted)"
        actor: system
        preconditions: []
        side_effects: ["Complaint MEDIATION_OFFERED -> UNRESOLVED (last_unresolved_at NOT refreshed)"]
      - from: ACCEPTED
        to: SCHEDULED
        trigger: "POST /mediation-cases/{id}/schedule"
        actor: BureauAdmin
        preconditions:
          - "session_end_at strictly after session_start_at (ERR_INVALID_REQUEST)"
          - "mediator overlap: no other MediationCase in status SCHEDULED with the same mediator_id whose [session_start_at, session_end_at) intersects [new_start, new_end); adjacency (end == other start) is NOT a conflict (ERR_MEDIATOR_SCHEDULE_CONFLICT)"
        side_effects: ["mediator_id, session_start_at, session_end_at persisted"]
      - from: SCHEDULED
        to: CONCLUDED_AGREEMENT
        trigger: "POST /mediation-cases/{id}/conclude with outcome AGREEMENT"
        actor: BureauAdmin
        preconditions: []
        side_effects: ["Complaint IN_MEDIATION -> MEDIATION_RESOLVED (see Complaint side effects)"]
      - from: SCHEDULED
        to: CONCLUDED_NO_AGREEMENT
        trigger: "POST /mediation-cases/{id}/conclude with outcome NO_AGREEMENT"
        actor: BureauAdmin
        preconditions: []
        side_effects: ["Complaint IN_MEDIATION -> MEDIATION_FAILED (see Complaint side effects)"]

  - entity: ArbitrationCase
    initial_state: FILED
    terminal_states: [DECIDED]
    transitions:
      - from: FILED
        to: HEARING_SCHEDULED
        trigger: "POST /arbitration-cases/{id}/schedule-hearing"
        actor: BureauAdmin
        preconditions:
          - "hearing_end_at strictly after hearing_start_at (ERR_INVALID_REQUEST)"
          - "room buffer: for every other ArbitrationCase in status HEARING_SCHEDULED with the same hearing_room_id, require new.start >= other.end + 30 minutes OR new.end + 30 minutes <= other.start (ERR_HEARING_ROOM_CONFLICT); unlike mediation, adjacency IS a conflict"
        side_effects: ["hearing_room_id, hearing_start_at, hearing_end_at persisted"]
      - from: HEARING_SCHEDULED
        to: DECIDED
        trigger: "POST /arbitration-cases/{id}/render-decision"
        actor: BureauAdmin
        preconditions: []
        side_effects:
          - "outcome and decided_at = now persisted"
          - "Complaint IN_ARBITRATION -> ARBITRATED with resolution_outcome ARBITRATION_ADVERSE (outcome ADVERSE_TO_BUSINESS) or ARBITRATION_NO_FAULT (outcome NO_FAULT) — see Complaint side effects"

  - entity: DuesInvoice
    initial_state: ISSUED
    terminal_states: [PAID, REFUNDED, VOID]
    transitions:
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /dues-invoices/{id}/ledger-entries kind PAYMENT with amount_cents < balance_cents"
        actor: BusinessRep
        preconditions: ["amount_cents >= 1 (ERR_INVALID_REQUEST)", "amount_cents <= balance_cents (ERR_PAYMENT_EXCEEDS_BALANCE)"]
        side_effects: ["paid_cents += amount_cents", "Bureau.dues_collected_cents recompute"]
      - from: ISSUED
        to: PAID
        trigger: "POST /dues-invoices/{id}/ledger-entries kind PAYMENT with amount_cents == balance_cents"
        actor: BusinessRep
        preconditions: ["amount_cents >= 1 (ERR_INVALID_REQUEST)", "amount_cents <= balance_cents (ERR_PAYMENT_EXCEEDS_BALANCE)"]
        side_effects:
          - "paid_cents += amount_cents; balance_cents = 0"
          - "Bureau.dues_collected_cents recompute"
          - "AccreditationApplication APPROVED_PENDING_DUES -> ACCREDITED (cascade to Business accreditation)"
      - from: PARTIALLY_PAID
        to: PARTIALLY_PAID
        trigger: "POST /dues-invoices/{id}/ledger-entries kind PAYMENT with amount_cents < balance_cents"
        actor: BusinessRep
        preconditions: ["amount_cents <= balance_cents (ERR_PAYMENT_EXCEEDS_BALANCE)"]
        side_effects: ["paid_cents += amount_cents", "Bureau.dues_collected_cents recompute"]
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /dues-invoices/{id}/ledger-entries kind PAYMENT with amount_cents == balance_cents"
        actor: BusinessRep
        preconditions: ["amount_cents <= balance_cents (ERR_PAYMENT_EXCEEDS_BALANCE)"]
        side_effects:
          - "paid_cents += amount_cents; balance_cents = 0"
          - "Bureau.dues_collected_cents recompute"
          - "AccreditationApplication APPROVED_PENDING_DUES -> ACCREDITED (cascade to Business accreditation)"
      - from: PARTIALLY_PAID
        to: PARTIALLY_PAID
        trigger: "POST /dues-invoices/{id}/ledger-entries kind REFUND with amount_cents < paid_cents - refunded_cents"
        actor: BureauAdmin
        preconditions: ["amount_cents <= paid_cents - refunded_cents (ERR_REFUND_EXCEEDS_PAID)"]
        side_effects: ["refunded_cents += amount_cents; balance_cents recomputes upward", "Bureau.dues_collected_cents recompute"]
      - from: PARTIALLY_PAID
        to: ISSUED
        trigger: "POST /dues-invoices/{id}/ledger-entries kind REFUND with amount_cents == paid_cents - refunded_cents"
        actor: BureauAdmin
        preconditions: ["amount_cents <= paid_cents - refunded_cents (ERR_REFUND_EXCEEDS_PAID)"]
        side_effects: ["refunded_cents += amount_cents; balance_cents == amount_due_cents", "Bureau.dues_collected_cents recompute"]
      - from: PAID
        to: PARTIALLY_PAID
        trigger: "POST /dues-invoices/{id}/ledger-entries kind REFUND with amount_cents < paid_cents - refunded_cents"
        actor: BureauAdmin
        preconditions: ["amount_cents <= paid_cents - refunded_cents (ERR_REFUND_EXCEEDS_PAID)"]
        side_effects: ["refunded_cents += amount_cents; balance_cents recomputes upward", "Bureau.dues_collected_cents recompute"]
        note: "Refunds NEVER revert the linked AccreditationApplication or Business.accreditation_status — once ACCREDITED, accreditation is governed only by suspension_scan."
      - from: PAID
        to: REFUNDED
        trigger: "POST /dues-invoices/{id}/ledger-entries kind REFUND with amount_cents == paid_cents - refunded_cents"
        actor: BureauAdmin
        preconditions: ["amount_cents <= paid_cents - refunded_cents (ERR_REFUND_EXCEEDS_PAID)"]
        side_effects: ["refunded_cents += amount_cents; balance_cents == amount_due_cents", "Bureau.dues_collected_cents recompute"]
      - from: ISSUED
        to: OVERDUE
        trigger: "system (run_daily_close: now > due_date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_PAID
        to: OVERDUE
        trigger: "system (run_daily_close: now > due_date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OVERDUE
        to: PAID
        trigger: "POST /dues-invoices/{id}/ledger-entries kind PAYMENT with amount_cents == balance_cents (late payment still accepted while not VOID)"
        actor: BusinessRep
        preconditions: ["amount_cents <= balance_cents (ERR_PAYMENT_EXCEEDS_BALANCE)"]
        side_effects:
          - "paid_cents += amount_cents; balance_cents = 0"
          - "Bureau.dues_collected_cents recompute"
          - "AccreditationApplication APPROVED_PENDING_DUES -> ACCREDITED (cascade)"
      - from: OVERDUE
        to: OVERDUE
        trigger: "POST /dues-invoices/{id}/ledger-entries kind PAYMENT with amount_cents < balance_cents"
        actor: BusinessRep
        preconditions: ["amount_cents <= balance_cents (ERR_PAYMENT_EXCEEDS_BALANCE)"]
        side_effects: ["paid_cents += amount_cents; status stays OVERDUE until balance hits 0", "Bureau.dues_collected_cents recompute"]
        note: "Self-loop: partial payments after due_date mutate balances but never move the invoice back to PARTIALLY_PAID."
      - from: OVERDUE
        to: VOID
        trigger: "system (run_daily_close: now > due_date + 15 days)"
        actor: system
        preconditions: []
        side_effects:
          - "voided_at = now"
          - "linked AccreditationApplication APPROVED_PENDING_DUES -> EXPIRED"
          - "unpaid balance (balance_cents > 0) counts against future applications for 365 days"

  - entity: AdvertisingReview
    initial_state: UNDER_REVIEW
    terminal_states: [CLEARED, REFERRED_TO_REGULATOR]
    transitions:
      - from: UNDER_REVIEW
        to: CLEARED
        trigger: "POST /advertising-reviews/{id}/conclude with outcome CLEARED"
        actor: StandardsReviewer
        preconditions: []
        side_effects:
          - "concluded_at = now"
          - "Business.advertising_compliance_status -> CLEAR when no other review UNDER_REVIEW (see Business machine; REFERRED businesses also return to CLEAR under the same condition)"
          - "provisional rating recompute and new PROVISIONAL RatingSnapshot"
      - from: UNDER_REVIEW
        to: REFERRED_TO_REGULATOR
        trigger: "POST /advertising-reviews/{id}/conclude with outcome SUBSTANTIATED_DECEPTIVE"
        actor: StandardsReviewer
        preconditions: ["regulator_name present (ERR_INVALID_REQUEST)"]
        side_effects:
          - "concluded_at = now; referred_at = now; regulator_name persisted"
          - "Business.advertising_compliance_status -> REFERRED_TO_REGULATOR"
          - "provisional rating recompute and new PROVISIONAL RatingSnapshot"

  - entity: RatingDispute
    initial_state: FILED
    terminal_states: [UPHELD, OVERRULED]
    transitions:
      - from: FILED
        to: UNDER_APPEAL_REVIEW
        trigger: "POST /rating-disputes/{id}/appeal-decision is NOT used for this hop; a dispute enters UNDER_APPEAL_REVIEW automatically at filing (FILED -> UNDER_APPEAL_REVIEW is immediate)"
        actor: system
        preconditions: []
        side_effects: []
        note: "FILED is a zero-duration state: creation commits the dispute directly into UNDER_APPEAL_REVIEW."
      - from: UNDER_APPEAL_REVIEW
        to: UPHELD
        trigger: "POST /rating-disputes/{id}/appeal-decision with decision UPHELD"
        actor: BureauAdmin
        preconditions: []
        side_effects: ["disputed snapshot unchanged"]
      - from: UNDER_APPEAL_REVIEW
        to: OVERRULED
        trigger: "POST /rating-disputes/{id}/appeal-decision with decision OVERRULED"
        actor: BureauAdmin
        preconditions: ["disputed_complaint_id must name a complaint of this business (ERR_SNAPSHOT_BUSINESS_MISMATCH)"]
        side_effects:
          - "recompute rating_score with the disputed complaint excluded from every input set"
          - "write a new RatingSnapshot (variant PUBLISHED, published_at = now, excluded_complaint_id = disputed_complaint_id)"
          - "old snapshot superseded_by_id = new snapshot id"
          - "Business.current_published_score/grade updated; Business.version increments by 1"

  - entity: ScamReport
    initial_state: RECEIVED
    terminal_states: [PUBLISHED]
    transitions:
      - from: RECEIVED
        to: PUBLISHED
        trigger: "POST /scam-reports/{id}/publish"
        actor: BureauAdmin
        preconditions: []
        side_effects:
          - "published_at = now"
          - "Business.published_scam_count_12m recompute"
          - "provisional rating recompute and new PROVISIONAL RatingSnapshot"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version — true create-with-supersede races only)
# =============================================================================
concurrency_rules:
  - rule_id: rating-dispute-stale-business-version
    parent_entity: Business
    write_endpoint: "POST /businesses/{id}/rating-disputes"
    occ_field: "expected_business_version"
    description: |
      Filing a RatingDispute against a Business whose version has advanced
      since the client last observed it is rejected. Publishing a new
      PUBLISHED RatingSnapshot (or an OVERRULED appeal recomputation)
      legitimately supersedes the rating the client read and increments
      Business.version; a dispute minted against the pre-publish version
      therefore refers to stale rating state and must be refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: territory_assignment
    trigger: "POST /businesses (business creation)"
    algorithm: constraint_propagation
    formula: |
      candidates = [bureau for bureau in Bureau if business.home_state_code in bureau.territory_state_codes]
      if len(candidates) == 0: reject ERR_TERRITORY_UNCOVERED (422)
      # state codes are unique across bureaus (enforced at bureau creation),
      # so len(candidates) is always <= 1; no ranking or tie-break is needed
      business.bureau_id = candidates[0].id
      business.size_tier = tier_of(employee_count): 1-4 MICRO | 5-19 SMALL | 20-99 MEDIUM | >=100 LARGE
    input_set: "all Bureau rows"
    constants:
      TIER_MICRO_MAX_EMPLOYEES: 4
      TIER_SMALL_MAX_EMPLOYEES: 19
      TIER_MEDIUM_MAX_EMPLOYEES: 99
    precision: "not applicable (assignment, not arithmetic)"

  - name: dues_amount
    trigger: "AccreditationApplication decision APPROVE (DuesInvoice issuance)"
    algorithm: tiered_pricing
    formula: |
      base = base_amount_cents(size_tier_at_issue)   # MICRO 42500 | SMALL 68000 | MEDIUM 115000 | LARGE 240000
      subtotal = base + local_fee_cents
      if billing_plan == ANNUAL_PREPAID:
        # 5% prepay discount, rounded once at the total
        amount_due_cents = round_half_up(subtotal * 0.95)
        installments = [{installment: 1, amount_cents: amount_due_cents}]
      else:  # QUARTERLY
        # 4% plan surcharge rounded at the TOTAL first, then per-installment;
        # rounding order is pinned: surcharge-total -> per-installment -> remainder on last.
        S = round_half_up(subtotal * 1.04)
        P = round_half_up(S / 4)
        installments = [{installment: 1, amount_cents: P},
                        {installment: 2, amount_cents: P},
                        {installment: 3, amount_cents: P},
                        {installment: 4, amount_cents: S - 3*P}]
        amount_due_cents = S
      # Worked literals (bureau local fee 333 cents, MEDIUM base 115000):
      #   subtotal = 115333
      #   ANNUAL_PREPAID: round_half_up(115333 * 0.95) = round_half_up(109566.35) = 109566
      #   QUARTERLY: S = round_half_up(115333 * 1.04) = round_half_up(119946.32) = 119946
      #              P = round_half_up(119946 / 4) = round_half_up(29986.5) = 29987
      #              installments = [29987, 29987, 29987, 29985]; total 119946
    input_set: "the issuing Business (size_tier, bureau) and its Bureau (local_dues_fee_cents) at issue time"
    constants:
      DUES_BASE_MICRO_CENTS: 42500
      DUES_BASE_SMALL_CENTS: 68000
      DUES_BASE_MEDIUM_CENTS: 115000
      DUES_BASE_LARGE_CENTS: 240000
      ANNUAL_PREPAID_DISCOUNT_RATE: 0.05
      QUARTERLY_SURCHARGE_RATE: 1.04
      QUARTERLY_INSTALLMENT_COUNT: 4
    precision: "integer cents; round_half_up at the two pinned rounding points only"
    variants:
      - name: annual_prepaid
        when: "application billing_plan == ANNUAL_PREPAID"
        difference: "5% discount on (base + local fee), one rounding at the total, single installment"
      - name: quarterly
        when: "application billing_plan == QUARTERLY"
        difference: "4% surcharge rounded at the total, then per-installment rounding with the rounding remainder absorbed by the 4th installment — a different total than ANNUAL_PREPAID for identical base and fee"

  - name: rating_score
    trigger: "POST /businesses/{id}/rating-snapshots (manual compute/publish); system auto-recompute (PROVISIONAL) whenever a complaint counter, advertising_compliance_status, or published_scam_count_12m changes; run_daily_close suspension scan reads the latest PUBLISHED snapshot"
    algorithm: weighted_scoring
    formula: |
      # Window: complaints with filed_at in [now - 1095 days, now] (inclusive both ends).
      # OUTCOME set (counts in BOTH variants): status in
      #   {RESOLVED, UNANSWERED, UNRESOLVED, MEDIATION_RESOLVED, MEDIATION_FAILED, ARBITRATED}
      # PENDING set (PROVISIONAL only): status in
      #   {RECEIVED, FORWARDED, RESPONSE_RECEIVED, CONSUMER_REBUTTED, MEDIATION_OFFERED, IN_MEDIATION, IN_ARBITRATION}
      # A complaint named by an OVERRULED dispute's excluded_complaint_id is removed
      # from BOTH sets for the recomputed snapshot.
      T = complaint_volume_threshold(size_tier)   # MICRO 3 | SMALL 6 | MEDIUM 12 | LARGE 24
      received_n = count(OUTCOME)                          # PUBLISHED
      received_n_prov = count(OUTCOME) + count(PENDING)    # PROVISIONAL
      volume_deduction  = min(30, 6 * max(0, received_n - T))              # PUBLISHED
      volume_deduction  = min(30, 6 * max(0, received_n_prov - T))         # PROVISIONAL
      unanswered_deduction = min(36, 12 * count(status == UNANSWERED))
      unresolved_deduction = min(24, 8 * count(status in {UNRESOLVED, MEDIATION_FAILED}))
      arbitration_deduction = min(20, 10 * count(status == ARBITRATED and resolution_outcome == ARBITRATION_ADVERSE))
      age_years = floor(full years between founded_on and now)
      age_deduction = min(6, 2 * max(0, 3 - age_years))
      advertising_deduction = 15 if advertising_compliance_status == REFERRED_TO_REGULATOR
                              else 5 if advertising_compliance_status == UNDER_AD_REVIEW else 0
      scam_deduction = 10 if published_scam_count_12m >= 3 else 0
      pending_deduction = 0                                                 # PUBLISHED
      pending_deduction = min(12, 4 * count(PENDING))                       # PROVISIONAL
      total_deductions = sum of the eight components
      score = max(0, 100 - total_deductions)
      grade = A_PLUS if score >= 97; A if >= 94; A_MINUS if >= 90; B_PLUS if >= 85;
              B if >= 80; B_MINUS if >= 75; C_PLUS if >= 70; C if >= 65;
              C_MINUS if >= 60; D_PLUS if >= 55; D if >= 50; else F
      # grade boundaries are inclusive on the lower bound: score exactly 90 -> A_MINUS, 89 -> B_PLUS
    input_set: "complaints of the business filed within trailing 1095 days, partitioned into OUTCOME and PENDING by status; Business.size_tier, founded_on, advertising_compliance_status, published_scam_count_12m at compute time"
    constants:
      RATING_WINDOW_DAYS: 1095
      VOLUME_THRESHOLD_MICRO: 3
      VOLUME_THRESHOLD_SMALL: 6
      VOLUME_THRESHOLD_MEDIUM: 12
      VOLUME_THRESHOLD_LARGE: 24
      VOLUME_POINTS_PER_EXCESS: 6
      VOLUME_CAP: 30
      UNANSWERED_POINTS_EACH: 12
      UNANSWERED_CAP: 36
      UNRESOLVED_POINTS_EACH: 8
      UNRESOLVED_CAP: 24
      ARBITRATION_ADVERSE_POINTS_EACH: 10
      ARBITRATION_CAP: 20
      AGE_POINTS_PER_YEAR_UNDER_3: 2
      AGE_CAP: 6
      ADVERTISING_REFERRED_POINTS: 15
      ADVERTISING_UNDER_REVIEW_POINTS: 5
      SCAM_PATTERN_MIN_REPORTS: 3
      SCAM_PATTERN_WINDOW_DAYS: 365
      SCAM_PATTERN_POINTS: 10
      PENDING_POINTS_EACH: 4
      PENDING_CAP: 12
      GRADE_A_PLUS_MIN: 97
      GRADE_A_MIN: 94
      GRADE_A_MINUS_MIN: 90
      GRADE_B_PLUS_MIN: 85
      GRADE_B_MIN: 80
      GRADE_B_MINUS_MIN: 75
      GRADE_C_PLUS_MIN: 70
      GRADE_C_MIN: 65
      GRADE_C_MINUS_MIN: 60
      GRADE_D_PLUS_MIN: 55
      GRADE_D_MIN: 50
    precision: "integer arithmetic throughout; no rounding"
    variants:
      - name: provisional
        when: "variant == PROVISIONAL (auto-regenerated on counter changes; also manually via POST with variant PROVISIONAL)"
        difference: "PENDING complaints add 4 points each (cap 12) and count toward the volume input; produces a different score than PUBLISHED for identical underlying data whenever any complaint is open"
      - name: published
        when: "variant == PUBLISHED (manual publish by BureauAdmin; the only variant the suspension scan reads)"
        difference: "PENDING complaints are invisible: no pending deduction, no volume contribution; score reflects closed outcomes only"

  - name: suspension_scan
    trigger: "run_daily_close (per business assigned to the bureau)"
    algorithm: threshold
    formula: |
      latest = latest PUBLISHED RatingSnapshot by published_at DESC, tie-break created_at DESC
      if latest is null: no change
      if accreditation_status == ACCREDITED and latest.score < 75:
        if suspension_count_24m + 1 >= 2: accreditation_status -> REVOKED
        else: accreditation_status -> SUSPENDED
        suspension_count_24m += 1; last_suspension_at = now
      elif accreditation_status == SUSPENDED and latest.score >= 80:
        accreditation_status -> ACCREDITED
      # hysteresis band: scores in [75, 79] neither suspend nor reinstate
      # suspensions older than 730 days drop out of suspension_count_24m before the check
    input_set: "Business rows with bureau_id == this bureau and accreditation_status in {ACCREDITED, SUSPENDED}; each business's latest PUBLISHED snapshot"
    constants:
      SUSPEND_SCORE_THRESHOLD: 75
      REINSTATE_SCORE_THRESHOLD: 80
      REVOKE_SUSPENSION_COUNT: 2
      SUSPENSION_WINDOW_DAYS: 730
    precision: "integer comparison, strict < for suspension, >= for reinstatement"

  - name: response_deadline
    trigger: "POST /complaints/{id}/forward and POST /complaints/{id}/reopen"
    algorithm: threshold
    formula: |
      response_deadline_at = forwarded_at + 14 days (exactly 1209600 seconds)
      a BUSINESS_RESPONSE with received_at <= response_deadline_at is accepted and on_time = true
      # boundary is INCLUSIVE: received_at == response_deadline_at is on time;
      # one second later the sweep has already flipped the complaint to UNANSWERED
    input_set: "the complaint being forwarded or reopened"
    constants:
      RESPONSE_WINDOW_DAYS: 14
    precision: "second precision on ISO8601 instants"

  - name: scam_pattern_aggregation
    trigger: "GET /scam-patterns"
    algorithm: aggregation
    formula: |
      for each business:
        n = count(ScamReport with business_id == business.id, status == PUBLISHED,
                  published_at in [now - 365 days, now])
        include row {business_id, legal_name, published_report_count_12m: n,
                     pattern_flag: n >= 3} when n >= 1
      sort: published_report_count_12m DESC, tie-break legal_name ASC (never id)
    input_set: "all PUBLISHED ScamReport rows within trailing 365 days"
    constants:
      SCAM_PATTERN_MIN_REPORTS: 3
      SCAM_PATTERN_WINDOW_DAYS: 365
    precision: "integer counts"

  - name: business_age_years
    trigger: "rating_score and POST /accreditation-applications/{id}/submit"
    algorithm: chronological
    formula: |
      age_years = full calendar years elapsed between founded_on and now
      (a year has elapsed when the calendar anniversary of founded_on has been reached)
      accreditation eligibility gate: founded_on must be <= now - 183 days (ERR_BUSINESS_TOO_YOUNG)
    input_set: "Business.founded_on and the logical clock"
    constants:
      ACCREDITATION_MIN_AGE_DAYS: 183
    precision: "calendar-year granularity for age_years; second precision for the 183-day gate"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number wins when
# a single request violates several rules)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is one of BureauAdmin, StandardsReviewer, BusinessRep, Consumer"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: auth
    check: "Ownership: BusinessRep's X-User-ID must equal the target Business.id; Consumer's X-User-ID must equal the filing consumer's id (consumer_id on create, complaint.consumer_id on responses)"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "POST /businesses/{id}/accreditation-applications, POST /accreditation-applications/{id}/submit, POST /dues-invoices/{id}/ledger-entries (PAYMENT), POST /complaints, POST /complaints/{id}/responses, POST /mediation-cases/{id}/party-response, POST /businesses/{id}/rating-disputes, POST /scam-reports"
  - priority: 4
    category: existence
    check: "Every path id exists, validated left-to-right; nested resources must belong to the path parent"
    error_id: "ERR_BUREAU_NOT_FOUND | ERR_BUSINESS_NOT_FOUND | ERR_CONSUMER_NOT_FOUND | ERR_COMPLAINT_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_MEDIATION_NOT_FOUND | ERR_ARBITRATION_NOT_FOUND | ERR_SNAPSHOT_NOT_FOUND | ERR_DISPUTE_NOT_FOUND | ERR_AD_REVIEW_NOT_FOUND | ERR_SCAM_REPORT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 5
    category: business_constraint
    check: "Request body schema: required fields present, enum values in range, integer bounds (employee_count >= 1, amount_cents >= 1, local_dues_fee_cents >= 0), decision DENY requires denial_reason, decision APPROVE requires all three checklist results PASS (else use DENY), deceptive ad conclusion requires regulator_name, mediation/arbitration end strictly after start"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 6
    category: state
    check: "OCC: expected_business_version equals Business.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /businesses/{id}/rating-disputes"
  - priority: 7
    category: state
    check: "Target resource in a valid from-state for the requested transition (includes: application not DRAFT for submit / not SUBMITTED for decision / not DENIED for reapply; complaint not RECEIVED for forward, not FORWARDED-or-CONSUMER_REBUTTED for BUSINESS_RESPONSE, not RESPONSE_RECEIVED for rebuttal or verdict, not {RESOLVED, UNANSWERED} for reopen, not UNRESOLVED for mediation create, not MEDIATION_FAILED for arbitration create; invoice VOID/PAID/REFUNDED reject new entries except the PAID/PARTIALLY_PAID refund paths; mediation/arbitration/dispute/ad-review/scam-report invalid from-states)"
    error_id: "ERR_APPLICATION_INVALID_STATE | ERR_COMPLAINT_INVALID_STATE | ERR_INVOICE_INVALID_STATE | ERR_MEDIATION_INVALID_STATE | ERR_ARBITRATION_INVALID_STATE | ERR_DISPUTE_INVALID_STATE | ERR_AD_REVIEW_INVALID_STATE | ERR_SCAM_REPORT_INVALID_STATE"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 8
    category: business_compliance
    check: "Accreditation gates at submit/decision: business age >= 183 days at submit; at APPROVE — no AdvertisingReview in {UNDER_REVIEW, REFERRED_TO_REGULATOR}, complaints_unanswered_36m == 0 and complaints_unresolved_36m == 0"
    error_id: "ERR_BUSINESS_TOO_YOUNG | ERR_ADVERTISING_REVIEW_ADVERSE | ERR_ADVERSE_COMPLAINT_HISTORY"
    http_status: 422
    applies_to: "POST /accreditation-applications/{id}/submit, POST /accreditation-applications/{id}/decision"
  - priority: 9
    category: business_referential
    check: "Referential integrity: business home state covered by exactly one bureau; no second application while one is in {DRAFT, SUBMITTED, APPROVED_PENDING_DUES}; disputed snapshot and disputed complaint belong to this business; state code not already assigned to another bureau"
    error_id: "ERR_TERRITORY_UNCOVERED | ERR_APPLICATION_ALREADY_ACTIVE | ERR_SNAPSHOT_BUSINESS_MISMATCH | ERR_STATE_ALREADY_ASSIGNED"
    http_status: 409
    applies_to: "creation and decision endpoints"
  - priority: 10
    category: business_temporal
    check: "Window checks: business response now <= response_deadline_at; mediation create now <= last_unresolved_at + 14 days; reapply now >= decided_at + 30 days; reopen now <= closed_at + 30 days; rating dispute filed_at <= snapshot.published_at + 10 days; rebuttal_count < 3"
    error_id: "ERR_RESPONSE_WINDOW_EXPIRED | ERR_MEDIATION_WINDOW_EXPIRED | ERR_REAPPLICATION_COOLING | ERR_REOPEN_WINDOW_EXPIRED | ERR_DISPUTE_WINDOW_EXPIRED | ERR_REBUTTAL_LIMIT_REACHED"
    http_status: 409
    applies_to: "windowed action endpoints"
  - priority: 11
    category: business_fiscal
    check: "Money bounds: PAYMENT amount_cents <= balance_cents; REFUND amount_cents <= paid_cents - refunded_cents; at APPROVE no invoice with balance_cents > 0 in OVERDUE or VOID (voided within 365 days)"
    error_id: "ERR_PAYMENT_EXCEEDS_BALANCE | ERR_REFUND_EXCEEDS_PAID | ERR_OUTSTANDING_DUES_BALANCE"
    http_status: 422
    applies_to: "POST /dues-invoices/{id}/ledger-entries, POST /accreditation-applications/{id}/decision"
  - priority: 12
    category: business_constraint
    check: "Scheduling overlaps: mediator half-open [start, end) intersection on status SCHEDULED (adjacency allowed); hearing-room closed-with-buffer: new.start >= other.end + 30 min OR new.end + 30 min <= other.start (adjacency conflicts)"
    error_id: "ERR_MEDIATOR_SCHEDULE_CONFLICT | ERR_HEARING_ROOM_CONFLICT"
    http_status: 409
    applies_to: "POST /mediation-cases/{id}/schedule, POST /arbitration-cases/{id}/schedule-hearing"

# =============================================================================
# §1.5 API Endpoint Table (exactly 40 endpoints)
# =============================================================================
endpoints:
  # --- Bureau & operations ---
  - method: POST
    path: "/bureaus"
    description: "Create a bureau with its territory state codes and optional local dues fee"
    roles: [BureauAdmin]
    code: 201
    input: [name, territory_state_codes, "local_dues_fee_cents?"]
    output: Bureau
    side_effects: ["state codes must not overlap any existing bureau (ERR_STATE_ALREADY_ASSIGNED)"]

  - method: POST
    path: "/bureaus/{id}/run_daily_close"
    description: "Advance the bureau's operations day against the logical clock: expire unanswered complaints past their 14-day window (FORWARDED -> UNANSWERED), expire mediation offers (OFFERED -> DECLINED_EXPIRED when now > offer_deadline_at), mark invoices OVERDUE (now > due_date) then VOID (now > due_date + 15 days, cascading the application to EXPIRED), and run suspension_scan for every business in the territory. Increments ops_day_index by 1."
    roles: [BureauAdmin]
    code: 200
    input: []
    output: Bureau
    side_effects:
      - "ops_day_index += 1"
      - "complaint expiries recompute Business counters and auto-regenerate PROVISIONAL RatingSnapshots"
      - "suspension_scan applies ACCREDITED -> SUSPENDED/REVOKED and SUSPENDED -> ACCREDITED per pinned thresholds"

  # --- Consumers ---
  - method: POST
    path: "/consumers"
    description: "Register a consumer"
    roles: [BureauAdmin]
    code: 201
    input: [full_name, email, home_state_code]
    output: Consumer
    side_effects: []

  # --- Businesses ---
  - method: POST
    path: "/businesses"
    description: "Create a business; bureau_id and size_tier are computed via territory_assignment"
    roles: [BureauAdmin]
    code: 201
    input: [legal_name, home_state_code, employee_count, founded_on]
    output: Business
    side_effects: ["bureau_id assigned (ERR_TERRITORY_UNCOVERED if no bureau covers home_state_code)", "size_tier computed from employee_count"]

  - method: GET
    path: "/businesses/{id}"
    description: "Read a business including computed counters and current scores"
    roles: [BureauAdmin, StandardsReviewer, BusinessRep, Consumer]
    code: 200
    input: []
    output: Business
    side_effects: []

  - method: GET
    path: "/businesses"
    description: "List businesses with filters and pagination"
    roles: [BureauAdmin, StandardsReviewer, BusinessRep, Consumer]
    code: 200
    input: ["bureau_id?", "accreditation_status?", "home_state_code?", "limit?", "offset?"]
    output: Business[]
    side_effects: []

  # --- Accreditation applications ---
  - method: POST
    path: "/businesses/{id}/accreditation-applications"
    description: "Create a DRAFT application; with application_id naming a DENIED application past its 30-day cooling, instead resets that application to DRAFT (reapplication_count += 1)"
    roles: [BusinessRep]
    code: 201
    input: [billing_plan, license_number, "application_id?"]
    output: AccreditationApplication
    side_effects: ["rejects creation while another application is in {DRAFT, SUBMITTED, APPROVED_PENDING_DUES} (ERR_APPLICATION_ALREADY_ACTIVE)"]

  - method: GET
    path: "/businesses/{id}/accreditation-applications"
    description: "List a business's accreditation applications"
    roles: [BureauAdmin, StandardsReviewer, BusinessRep]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AccreditationApplication[]
    side_effects: []

  - method: POST
    path: "/accreditation-applications/{id}/submit"
    description: "Submit a DRAFT application (requires business age >= 183 days)"
    roles: [BusinessRep]
    code: 200
    input: []
    output: AccreditationApplication
    side_effects: ["status DRAFT -> SUBMITTED, submitted_at = now"]

  - method: POST
    path: "/accreditation-applications/{id}/decision"
    description: "Standards decision: APPROVE (all checklist PASS + compliance/fiscal gates) issues the DuesInvoice; DENY requires denial_reason"
    roles: [StandardsReviewer]
    code: 200
    input: [decision, advertising_practices_result, complaint_history_result, licensing_result, "denial_reason?"]
    output: AccreditationApplication
    side_effects: ["APPROVE: create DuesInvoice per dues_amount and set dues_invoice_id", "DENY: decided_at set; reapply gated 30 days"]

  # --- Dues invoices ---
  - method: GET
    path: "/businesses/{id}/dues-invoices"
    description: "List a business's dues invoices"
    roles: [BureauAdmin, StandardsReviewer, BusinessRep]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DuesInvoice[]
    side_effects: []

  - method: POST
    path: "/dues-invoices/{id}/ledger-entries"
    description: "Post a PAYMENT (BusinessRep owner) or REFUND (BureauAdmin) against an invoice; full payment cascades application -> ACCREDITED"
    roles: [BureauAdmin, BusinessRep]
    code: 201
    input: [kind, amount_cents]
    output: DuesInvoice
    side_effects: ["paid_cents/refunded_cents and balance_cents recompute", "Bureau.dues_collected_cents recompute", "full payment: application ACCREDITED and Business.accreditation_status ACCREDITED, increments Business.version by 1"]

  # --- Complaints ---
  - method: POST
    path: "/complaints"
    description: "Consumer files a complaint against a business"
    roles: [Consumer]
    code: 201
    input: [consumer_id, business_id, category, description]
    output: Complaint
    side_effects: ["status RECEIVED, filed_at = now", "Business.complaints_open_count += 1"]

  - method: GET
    path: "/complaints/{id}"
    description: "Read a complaint including embedded responses"
    roles: [BureauAdmin, StandardsReviewer, BusinessRep, Consumer]
    code: 200
    input: []
    output: Complaint
    side_effects: []

  - method: GET
    path: "/complaints"
    description: "List complaints with filters and pagination"
    roles: [BureauAdmin, StandardsReviewer, BusinessRep, Consumer]
    code: 200
    input: ["business_id?", "consumer_id?", "status?", "limit?", "offset?"]
    output: Complaint[]
    side_effects: []

  - method: POST
    path: "/complaints/{id}/forward"
    description: "Forward a RECEIVED complaint to the business; sets the 14-day response window"
    roles: [BureauAdmin]
    code: 200
    input: []
    output: Complaint
    side_effects: ["status RECEIVED -> FORWARDED, forwarded_at = now, response_deadline_at = now + 14 days"]

  - method: POST
    path: "/complaints/{id}/responses"
    description: "Append a response: BUSINESS_RESPONSE (BusinessRep owner), CONSUMER_REBUTTAL / CONSUMER_ACCEPT / CONSUMER_REJECT (filing Consumer)"
    roles: [BusinessRep, Consumer]
    code: 201
    input: [kind, body]
    output: Complaint
    side_effects: ["state transition per Complaint machine", "on terminal verdicts: Business counters recompute + PROVISIONAL snapshot regenerated"]

  - method: POST
    path: "/complaints/{id}/reopen"
    description: "Reopen a RESOLVED or UNANSWERED complaint within 30 days of closed_at; restarts the 14-day response window"
    roles: [BureauAdmin]
    code: 200
    input: []
    output: Complaint
    side_effects: ["status -> FORWARDED with fresh deadline", "open/closed counters rebalance", "PROVISIONAL snapshot regenerated"]

  # --- Mediation ---
  - method: POST
    path: "/complaints/{id}/mediation-cases"
    description: "Offer mediation on an UNRESOLVED complaint within 14 days of last_unresolved_at"
    roles: [BureauAdmin]
    code: 201
    input: []
    output: MediationCase
    side_effects: ["complaint UNRESOLVED -> MEDIATION_OFFERED", "case OFFERED with offer_deadline_at = now + 7 days"]

  - method: GET
    path: "/complaints/{id}/mediation-cases"
    description: "List mediation cases of a complaint"
    roles: [BureauAdmin, StandardsReviewer, BusinessRep, Consumer]
    code: 200
    input: ["limit?", "offset?"]
    output: MediationCase[]
    side_effects: []

  - method: POST
    path: "/mediation-cases/{id}/party-response"
    description: "A party accepts or declines the mediation offer; both ACCEPT -> ACCEPTED, any DECLINE -> DECLINED"
    roles: [BusinessRep, Consumer]
    code: 200
    input: [party, response]
    output: MediationCase
    side_effects: ["party response recorded", "on ACCEPTED: complaint -> IN_MEDIATION", "on DECLINED: complaint -> UNRESOLVED"]

  - method: POST
    path: "/mediation-cases/{id}/schedule"
    description: "Schedule the mediation session; mediator half-open overlap check on SCHEDULED cases"
    roles: [BureauAdmin]
    code: 200
    input: [mediator_id, session_start_at, session_end_at]
    output: MediationCase
    side_effects: ["status ACCEPTED -> SCHEDULED"]

  - method: POST
    path: "/mediation-cases/{id}/conclude"
    description: "Conclude a SCHEDULED mediation with AGREEMENT or NO_AGREEMENT"
    roles: [BureauAdmin]
    code: 200
    input: [outcome]
    output: MediationCase
    side_effects: ["AGREEMENT: complaint -> MEDIATION_RESOLVED (closed)", "NO_AGREEMENT: complaint -> MEDIATION_FAILED (arbitrable)"]

  # --- Arbitration ---
  - method: POST
    path: "/complaints/{id}/arbitration-cases"
    description: "Escalate a MEDIATION_FAILED complaint to binding arbitration"
    roles: [BureauAdmin]
    code: 201
    input: []
    output: ArbitrationCase
    side_effects: ["complaint MEDIATION_FAILED -> IN_ARBITRATION"]

  - method: GET
    path: "/complaints/{id}/arbitration-cases"
    description: "List arbitration cases of a complaint"
    roles: [BureauAdmin, StandardsReviewer, BusinessRep, Consumer]
    code: 200
    input: ["limit?", "offset?"]
    output: ArbitrationCase[]
    side_effects: []

  - method: POST
    path: "/arbitration-cases/{id}/schedule-hearing"
    description: "Schedule the hearing; same-room hearings require a 30-minute buffer on both sides (adjacency conflicts)"
    roles: [BureauAdmin]
    code: 200
    input: [hearing_room_id, hearing_start_at, hearing_end_at]
    output: ArbitrationCase
    side_effects: ["status FILED -> HEARING_SCHEDULED"]

  - method: POST
    path: "/arbitration-cases/{id}/render-decision"
    description: "Render the arbitration decision; complaint closes ARBITRATED"
    roles: [BureauAdmin]
    code: 200
    input: [outcome]
    output: ArbitrationCase
    side_effects: ["status HEARING_SCHEDULED -> DECIDED", "complaint -> ARBITRATED with resolution_outcome per outcome", "Business counters recompute + PROVISIONAL snapshot regenerated"]

  # --- Rating ---
  - method: POST
    path: "/businesses/{id}/rating-snapshots"
    description: "Compute a RatingSnapshot: variant PROVISIONAL (open complaints count as pending) or PUBLISHED (closed outcomes only; updates Business.current_published_* and increments Business.version by 1)"
    roles: [BureauAdmin]
    code: 201
    input: [variant]
    output: RatingSnapshot
    side_effects: ["PUBLISHED: published_at = now, Business.current_published_score/grade updated, increments Business.version by 1", "PROVISIONAL: Business.current_provisional_score/grade updated"]

  - method: GET
    path: "/businesses/{id}/rating-snapshots"
    description: "List a business's rating snapshots (filter by variant)"
    roles: [BureauAdmin, StandardsReviewer, BusinessRep]
    code: 200
    input: ["variant?", "limit?", "offset?"]
    output: RatingSnapshot[]
    side_effects: []

  - method: POST
    path: "/businesses/{id}/rating-disputes"
    description: "Business disputes a PUBLISHED snapshot within 10 days of published_at; OCC on expected_business_version"
    roles: [BusinessRep]
    code: 201
    input: [snapshot_id, reason, expected_business_version, "disputed_complaint_id?"]
    output: RatingDispute
    side_effects: ["dispute created in UNDER_APPEAL_REVIEW (FILED is zero-duration)", "increments Business.version by 1"]

  - method: POST
    path: "/rating-disputes/{id}/appeal-decision"
    description: "Bureau appeal ruling: UPHELD leaves the snapshot; OVERRULED recomputes excluding disputed_complaint_id and publishes a superseding snapshot"
    roles: [BureauAdmin]
    code: 200
    input: [decision]
    output: RatingDispute
    side_effects: ["OVERRULED: new PUBLISHED snapshot with excluded_complaint_id; old snapshot superseded_by_id set; Business.version increments by 1"]

  - method: GET
    path: "/businesses/{id}/rating-disputes"
    description: "List a business's rating disputes"
    roles: [BureauAdmin, StandardsReviewer, BusinessRep]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RatingDispute[]
    side_effects: []

  # --- Advertising reviews ---
  - method: POST
    path: "/businesses/{id}/advertising-reviews"
    description: "Open an advertising-practices review against a business"
    roles: [BureauAdmin, StandardsReviewer]
    code: 201
    input: [claim_description]
    output: AdvertisingReview
    side_effects: ["Business.advertising_compliance_status -> UNDER_AD_REVIEW (from CLEAR)", "PROVISIONAL snapshot regenerated"]

  - method: POST
    path: "/advertising-reviews/{id}/conclude"
    description: "Conclude a review: CLEARED or SUBSTANTIATED_DECEPTIVE (requires regulator_name; auto-refers to the regulator)"
    roles: [StandardsReviewer]
    code: 200
    input: [outcome, "regulator_name?"]
    output: AdvertisingReview
    side_effects: ["CLEARED: business status -> CLEAR when no other review open", "SUBSTANTIATED_DECEPTIVE: review -> REFERRED_TO_REGULATOR, business -> REFERRED_TO_REGULATOR", "PROVISIONAL snapshot regenerated"]

  - method: GET
    path: "/businesses/{id}/advertising-reviews"
    description: "List a business's advertising reviews"
    roles: [BureauAdmin, StandardsReviewer, BusinessRep]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AdvertisingReview[]
    side_effects: []

  # --- Scam reports ---
  - method: POST
    path: "/scam-reports"
    description: "Consumer files a scam report against a business"
    roles: [Consumer]
    code: 201
    input: [consumer_id, business_id, description, incident_date]
    output: ScamReport
    side_effects: []

  - method: GET
    path: "/businesses/{id}/scam-reports"
    description: "List a business's scam reports (filter by status)"
    roles: [BureauAdmin, StandardsReviewer, BusinessRep, Consumer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ScamReport[]
    side_effects: []

  - method: POST
    path: "/scam-reports/{id}/publish"
    description: "Publish a RECEIVED scam report; contributes to the business's 12-month scam count"
    roles: [BureauAdmin]
    code: 200
    input: []
    output: ScamReport
    side_effects: ["status RECEIVED -> PUBLISHED, published_at = now", "Business.published_scam_count_12m recompute", "PROVISIONAL snapshot regenerated"]

  - method: GET
    path: "/scam-patterns"
    description: "Computed scam-pattern publication: per-business published counts over trailing 365 days, count >= 1, pattern_flag at >= 3; sorted count DESC then legal_name ASC"
    roles: [BureauAdmin, StandardsReviewer, BusinessRep, Consumer]
    code: 200
    input: ["limit?", "offset?"]
    output: { patterns: array }
    side_effects: []

  # --- Test-driving: logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (ISO8601, may move forward or backward). Server startup default before any call is exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time."
    roles: [BureauAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["no entity mutations; auto-transitions fire only via run_daily_close"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or role value unknown" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Entity-backed role acting on a resource it does not own (BusinessRep != business, Consumer != filer)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, amount_cents < 1, employee_count < 1, DENY without denial_reason, APPROVE with a FAIL checklist result, deceptive conclusion without regulator_name, session/hearing end not strictly after start, duplicate consumer email" }
  - { id: ERR_BUREAU_NOT_FOUND, http: 404, condition: "Bureau path id does not exist" }
  - { id: ERR_BUSINESS_NOT_FOUND, http: 404, condition: "Business path/body id does not exist" }
  - { id: ERR_CONSUMER_NOT_FOUND, http: 404, condition: "Consumer path/body id does not exist" }
  - { id: ERR_COMPLAINT_NOT_FOUND, http: 404, condition: "Complaint path id does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "AccreditationApplication path/body id does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "DuesInvoice path id does not exist" }
  - { id: ERR_MEDIATION_NOT_FOUND, http: 404, condition: "MediationCase path id does not exist" }
  - { id: ERR_ARBITRATION_NOT_FOUND, http: 404, condition: "ArbitrationCase path id does not exist" }
  - { id: ERR_SNAPSHOT_NOT_FOUND, http: 404, condition: "RatingSnapshot id does not exist" }
  - { id: ERR_DISPUTE_NOT_FOUND, http: 404, condition: "RatingDispute path id does not exist" }
  - { id: ERR_AD_REVIEW_NOT_FOUND, http: 404, condition: "AdvertisingReview path id does not exist" }
  - { id: ERR_SCAM_REPORT_NOT_FOUND, http: 404, condition: "ScamReport path id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_business_version does not match Business.version (rating-dispute filing against superseded rating state)" }
  - { id: ERR_TERRITORY_UNCOVERED, http: 422, condition: "No bureau's territory_state_codes contains the business home_state_code" }
  - { id: ERR_STATE_ALREADY_ASSIGNED, http: 409, condition: "Bureau creation includes a state code already claimed by another bureau" }
  - { id: ERR_APPLICATION_ALREADY_ACTIVE, http: 409, condition: "Business already has an application in {DRAFT, SUBMITTED, APPROVED_PENDING_DUES}" }
  - { id: ERR_APPLICATION_INVALID_STATE, http: 409, condition: "Application not in the required from-state (submit needs DRAFT, decision needs SUBMITTED, reapply needs DENIED)" }
  - { id: ERR_REAPPLICATION_COOLING, http: 409, condition: "Fewer than 30 days since decided_at of the DENIED application" }
  - { id: ERR_BUSINESS_TOO_YOUNG, http: 422, condition: "founded_on is less than 183 days before the submit instant" }
  - { id: ERR_ADVERTISING_REVIEW_ADVERSE, http: 422, condition: "APPROVE blocked: an AdvertisingReview of the business is UNDER_REVIEW or REFERRED_TO_REGULATOR" }
  - { id: ERR_ADVERSE_COMPLAINT_HISTORY, http: 422, condition: "APPROVE blocked: complaints_unanswered_36m or complaints_unresolved_36m is non-zero" }
  - { id: ERR_OUTSTANDING_DUES_BALANCE, http: 422, condition: "APPROVE blocked: an invoice of the business has balance_cents > 0 in OVERDUE, or VOID with voided_at within trailing 365 days" }
  - { id: ERR_INVOICE_INVALID_STATE, http: 409, condition: "Ledger entry against a VOID or REFUNDED invoice" }
  - { id: ERR_PAYMENT_EXCEEDS_BALANCE, http: 422, condition: "PAYMENT amount_cents > balance_cents" }
  - { id: ERR_REFUND_EXCEEDS_PAID, http: 422, condition: "REFUND amount_cents > paid_cents - refunded_cents" }
  - { id: ERR_COMPLAINT_INVALID_STATE, http: 409, condition: "Complaint not in the required from-state for forward/respond/verdict/reopen/mediation/arbitration" }
  - { id: ERR_RESPONSE_WINDOW_EXPIRED, http: 409, condition: "BUSINESS_RESPONSE received after response_deadline_at while complaint still FORWARDED/CONSUMER_REBUTTED (boundary inclusive: exactly at deadline is on time)" }
  - { id: ERR_REBUTTAL_LIMIT_REACHED, http: 409, condition: "CONSUMER_REBUTTAL when rebuttal_count == 3" }
  - { id: ERR_REOPEN_WINDOW_EXPIRED, http: 409, condition: "Reopen attempted more than 30 days after closed_at" }
  - { id: ERR_MEDIATION_WINDOW_EXPIRED, http: 409, condition: "Mediation offer attempted more than 14 days after last_unresolved_at" }
  - { id: ERR_MEDIATION_INVALID_STATE, http: 409, condition: "Mediation action from a wrong state (respond when not OFFERED, schedule when not ACCEPTED, conclude when not SCHEDULED, party already responded)" }
  - { id: ERR_MEDIATOR_SCHEDULE_CONFLICT, http: 409, condition: "Mediator already has a SCHEDULED session whose half-open [start, end) intersects the requested one" }
  - { id: ERR_ARBITRATION_INVALID_STATE, http: 409, condition: "Arbitration action from a wrong state (schedule when not FILED, decide when not HEARING_SCHEDULED)" }
  - { id: ERR_HEARING_ROOM_CONFLICT, http: 409, condition: "Same-room hearing violates the 30-minute buffer rule (adjacency counts as conflict)" }
  - { id: ERR_DISPUTE_WINDOW_EXPIRED, http: 409, condition: "Rating dispute filed more than 10 days after the snapshot's published_at" }
  - { id: ERR_DISPUTE_INVALID_STATE, http: 409, condition: "Appeal decision on a dispute not in UNDER_APPEAL_REVIEW" }
  - { id: ERR_SNAPSHOT_BUSINESS_MISMATCH, http: 422, condition: "snapshot_id or disputed_complaint_id does not belong to the disputing business" }
  - { id: ERR_AD_REVIEW_INVALID_STATE, http: 409, condition: "Conclude on an AdvertisingReview not in UNDER_REVIEW" }
  - { id: ERR_SCAM_REPORT_INVALID_STATE, http: 409, condition: "Publish on a ScamReport not in RECEIVED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: BureauAdmin
    description: "Bureau operations staff: territory and bureau config, complaint forwarding, mediation/arbitration scheduling and decisions, rating publication, appeal rulings, scam-report publication, daily close, clock control"
    identity: opaque
    exclusive_operations:
      - "POST /bureaus"
      - "POST /bureaus/{id}/run_daily_close"
      - "POST /consumers"
      - "POST /businesses"
      - "POST /complaints/{id}/forward"
      - "POST /complaints/{id}/reopen"
      - "POST /complaints/{id}/mediation-cases"
      - "POST /complaints/{id}/arbitration-cases"
      - "POST /mediation-cases/{id}/schedule"
      - "POST /mediation-cases/{id}/conclude"
      - "POST /arbitration-cases/{id}/schedule-hearing"
      - "POST /arbitration-cases/{id}/render-decision"
      - "POST /businesses/{id}/rating-snapshots"
      - "POST /rating-disputes/{id}/appeal-decision"
      - "POST /scam-reports/{id}/publish"
      - "POST /dues-invoices/{id}/ledger-entries (kind REFUND)"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across businesses, complaints, invoices, snapshots, disputes, reviews, scam reports, scam patterns"
      - "POST /businesses/{id}/advertising-reviews (shared with StandardsReviewer)"

  - name: StandardsReviewer
    description: "Accreditation standards reviewer: owns application decisions and advertising-review conclusions (segregated from bureau operations)"
    identity: opaque
    exclusive_operations:
      - "POST /accreditation-applications/{id}/decision"
      - "POST /advertising-reviews/{id}/conclude"
    shared_operations:
      - "GET reads across businesses, applications, complaints, invoices, snapshots, disputes, reviews, scam reports, scam patterns"
      - "POST /businesses/{id}/advertising-reviews (shared with BureauAdmin)"

  - name: BusinessRep
    description: "Representative of a Business; X-User-ID equals the Business.id and ownership is enforced on every write"
    identity: entity_backed:Business
    exclusive_operations:
      - "POST /businesses/{id}/accreditation-applications"
      - "POST /accreditation-applications/{id}/submit"
      - "POST /dues-invoices/{id}/ledger-entries (kind PAYMENT)"
      - "POST /complaints/{id}/responses (kind BUSINESS_RESPONSE)"
      - "POST /businesses/{id}/rating-disputes"
      - "POST /mediation-cases/{id}/party-response (party BUSINESS)"
    shared_operations:
      - "GET reads of own business, its applications, invoices, complaints, snapshots, disputes, reviews, scam reports, scam patterns"

  - name: Consumer
    description: "Filing consumer; X-User-ID equals the Consumer.id"
    identity: entity_backed:Consumer
    exclusive_operations:
      - "POST /complaints"
      - "POST /complaints/{id}/responses (kinds CONSUMER_REBUTTAL, CONSUMER_ACCEPT, CONSUMER_REJECT)"
      - "POST /scam-reports"
      - "POST /mediation-cases/{id}/party-response (party CONSUMER)"
    shared_operations:
      - "GET reads of own complaints, businesses, scam reports, scam patterns"
