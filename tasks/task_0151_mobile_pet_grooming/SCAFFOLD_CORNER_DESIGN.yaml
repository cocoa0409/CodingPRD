        distinguishing_aspect: "A Groomer completing an appointment assigned to a DIFFERENT groomer (X-User-ID != appointment.groomer_id) gets ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["A SCHEDULED appointment assigned to groomer A; groomer B acts."]
