      - name: cascading_validation_bundled_axes_rejected_before_the_collection_consent_check
        claim_type: cascading_validation
        grounds: ["validations[priority=14]", "validations[priority=15]", "errors[ERR_CONSENT_BUNDLING_PROHIBITED]"]
        distinguishing_aspect: "A single grants call carrying both COLLECT and SHARE violates the priority-14 bundling rule and the priority-15 collection-consent prerequisite at once; the bundling error must come back and no axis may move."
        test_recipe:
          setup: ["logical clock at 2026-08-20T00:00:00Z", "one ADULT Consumer with a fresh ACTIVE ConsentRecord whose three axes are NOT_REQUESTED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /health-data/consumers"
              payload: { app_product_id: "${prod_id}", external_ref: "acct-1", residency_state_code: "WA", age_band: "ADULT" }
              as: PlatformAdmin
              captures: { cons_id: $.data.id, cons_v: $.data.version }
            - call: "POST /health-data/consent-records"
              payload: { consumer_id: "${cons_id}", expected_consumer_version: "${cons_v}" }
              as: PrivacyOfficer
              captures: { cr_id: $.data.id }
          trigger:
            - call: "POST /health-data/consent-records/${cr_id}/grants"
              payload: { axes: ["COLLECT", "SHARE"] }
              as: Consumer
              as_user_id: "${cons_id}"
          assert:
            - "error_id == ERR_CONSENT_BUNDLING_PROHIBITED"
            - "http_status == 409"
            - "ConsentRecord.${cr_id}.collection_state == NOT_REQUESTED"
            - "ConsentRecord.${cr_id}.sharing_state == NOT_REQUESTED"
            - "ConsentRecord.${cr_id}.sale_state == NOT_REQUESTED"
            - "AppProduct.${prod_id}.active_share_consent_count == 0"

