# =============================================================================
# task_2320 — Hazardous Waste Treatment Facility Operations (TSDF)
# Seed tables §1.0–§1.7. Difficulty design → SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# corner design → SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2320. Hazardous Waste Treatment Facility Operations (permitted treatment, storage and disposal facility): waste profile approval with generator characterization, sampling verification and acceptance criteria, manifest receipt, discrepancy resolution and ten-day transfer facility rules, storage limits by container and tank with inspection frequency, aisle spacing and compatibility segregation, treatment processes with permit-authorized methods, land disposal restriction treatment standards and verification, container management, labeling and accumulation time limits with reporting requirements, air emission controls on tanks and containers with monitoring and repair requirements, financial assurance, closure plan and corrective action for prior releases, biennial reporting, inspection response and permit renewal

domain_name: hazardous-waste-tsdf
api_prefix: /tsdf

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  difficulty_band: expert_plus   # above the §0.4 Expert band: 13 entities, 58 endpoints, 46 errors, 15 calculations, 35 ordered validations, 11 state machine dimensions
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency
    - scheduled_deferred_actions   # logical clock drives accumulation / repair / recertification deadlines

  entity_topology: flat
  # Every entity is addressed by its own top-level collection under /tsdf and linked
  # by explicit foreign keys in request bodies. No entity id appears twice in a path.
  # Two read-only sub-resource GETs exist purely as reverse-reachability channels.

  state_machine_shape: parallel
  # Container carries two independent dimensions (custody_state x compliance_state);
  # WasteProfile and ComplianceFinding are cyclic; Manifest is branching fork-join;
  # StorageUnit.posture is a derived posture gate over Container/TreatmentBatch/EmissionRepairOrder.

  relationship_patterns:
    - one_to_many          # Facility -> StorageUnit / Manifest / TreatmentBatch / ComplianceFinding
    - cross_aggregate      # Container -> ManifestLine (receipt aggregate) and -> StorageUnit (storage aggregate)
    - self_referential     # FinancialAssuranceInstrument.superseded_by_instrument_id -> FinancialAssuranceInstrument.id
    - polymorphic_scope    # InspectionEvent / EmissionRepairOrder attach to a StorageUnit, optionally narrowed to one Container

  role_model: segregation_of_duties
  # The chemist who records the verification sample may not sign the profile decision;
  # the operator who completes a treatment batch may not sign its LDR verification.

  consistency_model: immediate
  # All cascades complete inside the triggering request. Clock-dependent derived fields
  # (Container.accumulation_days, StorageUnit.inspection_overdue, EmissionRepairOrder.is_overdue,
  # StorageUnit.posture, Facility.permit_status, WasteProfile expiry) are recomputed on every
  # read AND every mutation, so no derived value ever lags the logical clock.

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Facility legal name", constraints: "1..120 chars" }
      - { name: epa_id, type: string, source: input, description: "EPA handler identifier", constraints: "unique across Facility; 12 chars" }
      - { name: permit_number, type: string, source: input, description: "RCRA Part B permit number" }
      - { name: permit_expires_at, type: datetime, source: input, description: "Instant the current permit lapses; compared against the logical clock" }
      - { name: permitted_methods, type: array, source: input, description: "Permit-authorized treatment methods; subset of {INCINERATION, STABILIZATION, NEUTRALIZATION, FUEL_BLENDING, MACROENCAPSULATION}", constraints: "non-empty" }
      - { name: max_concurrent_treatment_batches, type: integer, source: input, description: "Permit cap on simultaneously scheduled treatment batches facility-wide", constraints: ">= 1" }
      - { name: post_closure_cost_cents, type: integer, source: input, description: "Approved post-closure care cost estimate in cents", constraints: ">= 0" }
      - { name: permit_status, type: enum, source: system, description: "ACTIVE | RENEWAL_PENDING | EXPIRED | TERMINATED", default: ACTIVE }
      - { name: renewal_requested_at, type: datetime, source: system, description: "Clock instant the renewal application was filed; null when never filed" }
      - { name: requested_permit_expires_at, type: datetime, source: system, description: "Expiry requested in the pending renewal application; null when none pending" }
      - { name: open_snc_finding_count, type: integer, source: computed, description: "count(ComplianceFinding where facility_id == this.id AND finding_class == SNC AND status IN {OPEN, RESPONDED, REOPENED})" }
      - { name: corrective_action_status, type: enum, source: computed, description: "NONE | OPEN | IN_PROGRESS | COMPLETED — derived from this facility's ComplianceFinding rows (see calculations.corrective_action_status)" }
      - { name: received_mass_kg, type: number, source: computed, description: "Sum of ManifestLine.received_quantity_kg over lines of this facility's manifests with status IN {DISCREPANT, VERIFIED, CERTIFIED, REJECTED_RETURNED}; 3 decimals" }
      - { name: held_mass_kg, type: number, source: computed, description: "Sum of StorageUnit.stored_kg over this facility's storage units; 3 decimals" }
      - { name: unallocated_receipt_kg, type: number, source: computed, description: "Sum over this facility's ManifestLine rows of (accepted_quantity_kg - allocated_container_mass_kg); 3 decimals" }
      - { name: returned_mass_kg, type: number, source: computed, description: "Sum of ManifestLine.returned_quantity_kg over this facility's manifest lines; 3 decimals" }
      - { name: treated_residue_kg, type: number, source: computed, description: "Sum of TreatmentBatch.residue_mass_kg over this facility's batches with status IN {TREATED, LDR_FAILED, VERIFIED}; 3 decimals" }
      - { name: destroyed_mass_kg, type: number, source: computed, description: "Sum of (input_mass_kg - residue_mass_kg) over this facility's batches with status IN {TREATED, LDR_FAILED, VERIFIED}; 3 decimals" }
      - { name: mass_ledger_kg, type: number, source: computed, description: "= held_mass_kg + unallocated_receipt_kg + returned_mass_kg + treated_residue_kg + destroyed_mass_kg; invariant: equals received_mass_kg at all times" }
      - { name: closure_base_cost_cents, type: integer, source: computed, description: "= 25000000 + round_half_up(held_mass_kg * 1800); inventory-driven closure cost BEFORE the tier surcharge" }
      - { name: assurance_tier, type: enum, source: computed, description: "TIER_1 | TIER_2 | TIER_3 — keyed on closure_base_cost_cents only; never on the surcharged closure_cost_estimate_cents (circular) and never on required_assurance_cents" }
      - { name: closure_cost_estimate_cents, type: integer, source: computed, description: "= round_half_up(closure_base_cost_cents * (1 + tier surcharge rate)); see calculations.financial_assurance_requirement" }
      - { name: corrective_action_reserve_cents, type: integer, source: computed, description: "See calculations.financial_assurance_requirement step 4" }
      - { name: active_treatment_liability_cents, type: integer, source: computed, description: "Sum of TreatmentBatch.estimated_treatment_liability_cents over this facility's batches with status IN {PLANNED, IN_TREATMENT}" }
      - { name: required_assurance_cents, type: integer, source: computed, description: "= closure_cost_estimate_cents + post_closure_cost_cents + corrective_action_reserve_cents + active_treatment_liability_cents" }
      - { name: posted_assurance_cents, type: integer, source: computed, description: "Sum of FinancialAssuranceInstrument.face_amount_cents for this facility with status == ACTIVE" }
      - { name: assurance_shortfall_cents, type: integer, source: computed, description: "= max(0, required_assurance_cents - posted_assurance_cents)" }

  - name: Generator
    parent: null
    common_fields: true
    fields:
      - { name: epa_id, type: string, source: input, description: "Generator EPA identifier", constraints: "unique across Generator" }
      - { name: name, type: string, source: input, description: "Generator legal name" }
      - { name: generator_category, type: enum, source: input, description: "LQG | SQG | VSQG" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code of the generation site" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED", default: ACTIVE }
      - { name: suspension_reason_code, type: string, source: system, description: "Reason code recorded on the last ACTIVE -> SUSPENDED transition; null while ACTIVE" }
      - { name: open_charge_cents, type: integer, source: system, description: "Provisional acceptance charges accrued at manifest receipt and not yet certified or voided", default: 0 }
      - { name: settled_charge_cents, type: integer, source: system, description: "Final acceptance charges moved here at manifest certification", default: 0 }
      - { name: voided_charge_cents, type: integer, source: system, description: "Provisional charges reversed when a shipment is returned or a line is rejected", default: 0 }
      - { name: charge_adjustment_cents, type: integer, source: system, description: "Cumulative (final_charge_cents - provisional_charge_cents) applied at certification; may be negative", default: 0 }
      - { name: reliability_score_rolling, type: integer, source: computed, description: "weighted_scoring over the ROLLING_WINDOW variant (3 most recent closed manifests); see calculations.generator_reliability_score" }
      - { name: reliability_score_lifetime, type: integer, source: computed, description: "weighted_scoring over the LIFETIME variant (all closed manifests); see calculations.generator_reliability_score" }

  - name: FinancialAssuranceInstrument
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; facility whose closure/post-closure obligation this instrument funds" }
      - { name: instrument_type, type: enum, source: input, description: "TRUST_FUND | SURETY_BOND | LETTER_OF_CREDIT | INSURANCE" }
      - { name: face_amount_cents, type: integer, source: input, description: "Face value of the instrument in cents", constraints: ">= 0" }
      - { name: effective_on, type: string, source: input, description: "Effective date, ISO 8601 date (YYYY-MM-DD)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED | CANCELLED", default: ACTIVE }
      - { name: superseded_by_instrument_id, type: string, source: system, description: "FK -> FinancialAssuranceInstrument.id; set on the prior ACTIVE instrument when a new one supersedes it; null otherwise" }
      - { name: superseded_at, type: datetime, source: system, description: "Clock instant this instrument was superseded or cancelled; null while ACTIVE" }

  - name: WasteProfile
    parent: null
    common_fields: true
    fields:
      - { name: generator_id, type: string, source: input, description: "FK -> Generator.id; generator that characterized this waste stream" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; receiving facility the profile is filed with" }
      - { name: waste_codes, type: array, source: input, description: "EPA waste codes, e.g. [\"D001\", \"F003\"]", constraints: "non-empty; sorted ascending on write" }
      - { name: physical_form, type: enum, source: input, description: "BULK_LIQUID | SLUDGE | SOLID | LAB_PACK" }
      - { name: compatibility_class, type: enum, source: input, description: "ACID | ALKALINE | OXIDIZER | CYANIDE_BEARING | WATER_REACTIVE | ORGANIC_SOLVENT" }
      - { name: ldr_subcategory, type: enum, source: input, description: "NONE | D001_IGNITABLE | D008_LEAD | F001_SOLVENTS — land disposal restriction treatment standard family" }
      - { name: declared_constituent_ppm, type: number, source: input, description: "Generator-characterized regulated constituent concentration in ppm", constraints: ">= 0" }
      - { name: declared_flash_point_c, type: number, source: input, description: "Generator-characterized closed-cup flash point in degrees Celsius" }
      - { name: declared_ph, type: number, source: input, description: "Generator-characterized pH", constraints: "0..14" }
      - { name: requested_treatment_method, type: enum, source: input, description: "Treatment method the generator requests; same domain as Facility.permitted_methods" }
      - { name: recertification_months, type: integer, source: input, description: "Calendar months an approval stays valid before recertification is required", constraints: "1..24", default: 12 }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | SAMPLE_PASSED | SAMPLE_FAILED | APPROVED | SUSPENDED | EXPIRED | REJECTED", default: DRAFT }
      - { name: required_sample_type, type: enum, source: computed, description: "FINGERPRINT | FULL — recomputed on every DRAFT/SAMPLE_FAILED/EXPIRED -> SUBMITTED transition; the tolerance set applied to a sample is chosen by THIS field, never by ProfileSample.sample_type" }
      - { name: sample_attempt_count, type: integer, source: system, description: "Number of ProfileSample rows recorded against this profile", default: 0 }
      - { name: latest_sample_result, type: enum, source: system, description: "NONE | PASS | FAIL — result of the most recent ProfileSample by created_at ASC", default: NONE }
      - { name: approved_treatment_method, type: enum, source: system, description: "Method locked in at approval; null until APPROVED" }
      - { name: approved_at, type: datetime, source: system, description: "Clock instant of the most recent approval; null until APPROVED" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the WasteApprovalChemist who signed the decision; null until APPROVED" }
      - { name: recertification_due_at, type: datetime, source: system, description: "= approved_at + recertification_months (calendar months); profile is treated as EXPIRED once the clock passes it" }
      - { name: suspension_reason_code, type: string, source: system, description: "Reason code recorded on the APPROVED -> SUSPENDED transition; null otherwise" }

  - name: ProfileSample
    parent: null
    common_fields: false
    fields:
      - { name: waste_profile_id, type: string, source: input, description: "FK -> WasteProfile.id; profile this verification sample checks" }
      - { name: sample_type, type: enum, source: input, description: "FINGERPRINT | FULL — recorded for the audit trail only; tolerance selection uses WasteProfile.required_sample_type" }
      - { name: measured_constituent_ppm, type: number, source: input, description: "Laboratory constituent concentration in ppm", constraints: ">= 0" }
      - { name: measured_flash_point_c, type: number, source: input, description: "Laboratory closed-cup flash point in degrees Celsius" }
      - { name: measured_ph, type: number, source: input, description: "Laboratory pH", constraints: "0..14" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the WasteApprovalChemist who recorded the sample; blocks that user from signing the decision" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical clock instant the sample was recorded" }
      - { name: applied_tolerance_type, type: enum, source: computed, description: "FINGERPRINT | FULL — copy of WasteProfile.required_sample_type at record time, i.e. the tolerance set actually applied" }
      - { name: constituent_deviation_pct, type: number, source: computed, description: "= abs(measured_constituent_ppm - profile.declared_constituent_ppm) / max(profile.declared_constituent_ppm, 1), 4 decimals" }
      - { name: result, type: enum, source: computed, description: "PASS | FAIL" }
      - { name: failure_reason_code, type: enum, source: computed, description: "NONE | CONSTITUENT_DEVIATION | FLASH_POINT_DEVIATION | PH_DEVIATION — first breach in that fixed order" }

  - name: StorageUnit
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; facility the permitted unit belongs to" }
      - { name: unit_code, type: string, source: input, description: "Permit unit designation", constraints: "unique per facility_id" }
      - { name: unit_type, type: enum, source: input, description: "CONTAINER_AREA | TANK_SYSTEM | TEN_DAY_TRANSFER" }
      - { name: permitted_capacity_kg, type: number, source: input, description: "Permitted maximum stored plus reserved mass in kg", constraints: "> 0" }
      - { name: aisle_width_cm, type: number, source: input, description: "Surveyed aisle width in cm with the unit at or below aisle_free_container_capacity" }
      - { name: aisle_free_container_capacity, type: integer, source: input, description: "Container count the surveyed aisle width tolerates before encroachment begins", constraints: ">= 0" }
      - { name: inspection_frequency_days, type: integer, source: input, description: "Permit-required inspection interval in days", constraints: ">= 1; <= 7 for CONTAINER_AREA and TEN_DAY_TRANSFER, <= 1 for TANK_SYSTEM" }
      - { name: allowed_compatibility_classes, type: array, source: input, description: "Compatibility classes the permit authorizes in this unit", constraints: "non-empty subset of the WasteProfile.compatibility_class domain" }
      - { name: air_emission_control_level, type: enum, source: input, description: "LEVEL_1 | LEVEL_2 | LEVEL_3 — Subpart CC control level fixing the leak definition" }
      - { name: containment_volume_l, type: number, source: input, description: "Secondary containment volume in litres", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLOSING | CLOSED", default: ACTIVE }
      - { name: closure_plan_ref, type: string, source: system, description: "Closure plan document reference recorded on ACTIVE -> CLOSING; null while ACTIVE" }
      - { name: last_inspection_at, type: datetime, source: system, description: "Clock instant of the most recent InspectionEvent on this unit; initialized to the unit's created_at" }
      - { name: container_count, type: integer, source: computed, description: "count(Container where storage_unit_id == this.id AND custody_state IN {FILLING, SEALED, STAGED})" }
      - { name: stored_kg, type: number, source: computed, description: "Sum of Container.net_weight_kg where storage_unit_id == this.id AND custody_state IN {FILLING, SEALED, STAGED}; 3 decimals" }
      - { name: reserved_kg, type: number, source: computed, description: "Sum of TreatmentBatch.input_mass_kg for batches on this unit with status IN {PLANNED, IN_TREATMENT}; 3 decimals" }
      - { name: utilization_pct, type: number, source: computed, description: "= (stored_kg + reserved_kg) / permitted_capacity_kg, 4 decimals" }
      - { name: effective_aisle_width_cm, type: number, source: computed, description: "= aisle_width_cm - 6 * max(0, container_count - aisle_free_container_capacity)" }
      - { name: inspection_overdue, type: boolean, source: computed, description: "= current_utc > last_inspection_at + inspection_frequency_days (strictly greater)" }
      - { name: posture, type: enum, source: computed, description: "OPEN | RESTRICTED | SUSPENDED | CLOSED — see calculations.storage_unit_posture; gates container placement and treatment scheduling" }

  - name: Manifest
    parent: null
    common_fields: true
    fields:
      - { name: generator_id, type: string, source: input, description: "FK -> Generator.id; offeror on the manifest" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; designated receiving facility" }
      - { name: manifest_tracking_number, type: string, source: input, description: "Uniform hazardous waste manifest tracking number", constraints: "unique across Manifest" }
      - { name: transporter_epa_id, type: string, source: input, description: "EPA identifier of the delivering transporter" }
      - { name: shipped_on, type: string, source: input, description: "Date the shipment left the generator, ISO 8601 date (YYYY-MM-DD)" }
      - { name: status, type: enum, source: system, description: "EN_ROUTE | DISCREPANT | VERIFIED | CERTIFIED | REJECTED_RETURNED", default: EN_ROUTE }
      - { name: arrived_at, type: datetime, source: system, description: "Logical clock instant the shipment was received; null while EN_ROUTE" }
      - { name: discrepancy_type, type: enum, source: computed, description: "NONE | QUANTITY_SIGNIFICANT | COUNT_MISMATCH | UNDOCUMENTED — highest-priority line significance at receipt" }
      - { name: discrepancy_report_due_at, type: datetime, source: system, description: "= arrived_at + 15 days; null when discrepancy_type == NONE" }
      - { name: discrepancy_report_filed, type: boolean, source: system, description: "Set true by the discrepancy resolution that files the exception report", default: false }
      - { name: discrepancy_resolved_at, type: datetime, source: system, description: "Clock instant the discrepancy was resolved; null otherwise" }
      - { name: resolution_type, type: enum, source: system, description: "NONE | ACCEPT_ADJUSTED | PARTIAL_REJECT | REJECT_RETURN", default: NONE }
      - { name: provisional_charge_cents, type: integer, source: computed, description: "PROVISIONAL variant of calculations.acceptance_charge, frozen at receipt" }
      - { name: final_charge_cents, type: integer, source: computed, description: "FINAL variant of calculations.acceptance_charge, frozen at certification; null until CERTIFIED" }
      - { name: line_count, type: integer, source: computed, description: "count(ManifestLine where manifest_id == this.id)" }
      - { name: received_mass_kg, type: number, source: computed, description: "Sum of ManifestLine.received_quantity_kg for this manifest; 3 decimals" }

  - name: ManifestLine
    parent: null
    common_fields: true
    fields:
      - { name: manifest_id, type: string, source: system, description: "FK -> Manifest.id; manifest this line belongs to" }
      - { name: waste_profile_id, type: string, source: input, description: "FK -> WasteProfile.id; approved profile the line ships under" }
      - { name: line_number, type: integer, source: system, description: "1-based position assigned in request order; the deterministic ordering key for discrepancy priority and charge summation" }
      - { name: declared_quantity_kg, type: number, source: input, description: "Quantity declared on the manifest in kg", constraints: ">= 0" }
      - { name: declared_container_count, type: integer, source: input, description: "Container count declared on the manifest", constraints: ">= 0" }
      - { name: is_bulk, type: boolean, source: input, description: "True for bulk shipments (10% variance tolerance), false for containerized (2% tolerance plus count match)" }
      - { name: received_quantity_kg, type: number, source: system, description: "Quantity weighed in at receipt; 0 until received", default: 0 }
      - { name: received_container_count, type: integer, source: system, description: "Container count counted at receipt; 0 until received", default: 0 }
      - { name: accepted_quantity_kg, type: number, source: system, description: "Quantity the facility accepts into storage; set to received_quantity_kg at receipt, adjusted or zeroed by discrepancy resolution", default: 0 }
      - { name: returned_quantity_kg, type: number, source: system, description: "Quantity rejected back to the generator; = received_quantity_kg - accepted_quantity_kg", default: 0 }
      - { name: line_status, type: enum, source: system, description: "DECLARED | RECEIVED | ACCEPTED | ADJUSTED | RETURNED", default: DECLARED }
      - { name: variance_pct, type: number, source: computed, description: "= (declared_quantity_kg - received_quantity_kg) / declared_quantity_kg, 4 decimals; null when declared_quantity_kg == 0" }
      - { name: significance, type: enum, source: computed, description: "NONE | QUANTITY_SIGNIFICANT | COUNT_MISMATCH | UNDOCUMENTED — see calculations.discrepancy_classification" }
      - { name: provisional_line_charge_cents, type: integer, source: computed, description: "Per-line PROVISIONAL charge, rounded to whole cents before summation" }
      - { name: final_line_charge_cents, type: integer, source: computed, description: "Per-line FINAL charge, rounded to whole cents before summation; null until certification" }
      - { name: allocated_container_mass_kg, type: number, source: computed, description: "Sum of Container.net_weight_kg for containers on this line with custody_state != VOIDED; 3 decimals" }

  - name: Container
    parent: null
    common_fields: true
    fields:
      - { name: manifest_line_id, type: string, source: input, description: "FK -> ManifestLine.id; receipt line the container's mass is drawn from" }
      - { name: waste_profile_id, type: string, source: system, description: "FK -> WasteProfile.id; copied from the manifest line at creation and used for compatibility, labeling and LDR checks" }
      - { name: storage_unit_id, type: string, source: input, description: "FK -> StorageUnit.id; unit the container currently occupies" }
      - { name: treatment_batch_id, type: string, source: system, description: "FK -> TreatmentBatch.id; batch that staged this container; null when unstaged" }
      - { name: container_type, type: enum, source: input, description: "DRUM_55G | TOTE | CUBIC_YARD_BOX | LAB_PACK_DRUM" }
      - { name: capacity_kg, type: number, source: input, description: "Container rated capacity in kg", constraints: "> 0" }
      - { name: net_weight_kg, type: number, source: input, description: "Net waste mass in kg; the 95% headspace ceiling against capacity_kg is a cross-field rule owned solely by validation priority 19 (ERR_CONTAINER_OVERFILLED, 422), NOT by the priority-4 schema pass", constraints: "> 0" }
      - { name: accumulation_start_date, type: datetime, source: input, description: "Date marked on the container when accumulation began; drives accumulation_days and the ten-day transfer rule" }
      - { name: label_waste_codes, type: array, source: input, description: "Waste codes marked on the label; must equal the profile's waste_codes as a set" }
      - { name: label_hazard_class, type: string, source: input, description: "DOT hazard class marked on the label", constraints: "non-empty" }
      - { name: label_accumulation_start_marked, type: boolean, source: input, description: "Whether the accumulation start date is legibly marked on the container" }
      - { name: custody_state, type: enum, source: system, description: "FILLING | SEALED | STAGED | EMPTIED | VOIDED — physical custody dimension", default: FILLING }
      - { name: compliance_state, type: enum, source: system, description: "COMPLIANT | DEFICIENT | CONDEMNED — condition dimension, evolves independently of custody_state", default: COMPLIANT }
      - { name: last_finding_code, type: string, source: system, description: "Finding code from the most recent compliance_state change; null while never changed" }
      - { name: fill_ratio, type: number, source: computed, description: "= net_weight_kg / capacity_kg, 4 decimals" }
      - { name: accumulation_days, type: integer, source: computed, description: "= floor((current_utc - accumulation_start_date) / 86400 seconds); recomputed on every read" }
      - { name: ten_day_overdue, type: boolean, source: computed, description: "= (storage unit's unit_type == TEN_DAY_TRANSFER AND accumulation_days > 10)" }

  - name: TreatmentBatch
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; facility whose permit authorizes the run" }
      - { name: storage_unit_id, type: string, source: input, description: "FK -> StorageUnit.id; unit the run occupies for its window" }
      - { name: treatment_method, type: enum, source: input, description: "INCINERATION | STABILIZATION | NEUTRALIZATION | FUEL_BLENDING | MACROENCAPSULATION" }
      - { name: container_ids, type: array, source: input, description: "Ids of Container rows staged into this batch; each must be SEALED and COMPLIANT in the target unit", constraints: "non-empty" }
      - { name: window_start, type: datetime, source: input, description: "Scheduled start of the run (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Scheduled end of the run (exclusive for the unit-level pairwise check, inclusive for the facility-level aggregate check)", constraints: "> window_start" }
      - { name: dominant_compatibility_class, type: enum, source: computed, description: "compatibility_class of the staged container with the greatest net_weight_kg; tie-break: lowest Container.created_at" }
      - { name: input_mass_kg, type: number, source: computed, description: "Sum of net_weight_kg of the staged containers, frozen at creation; 3 decimals" }
      - { name: estimated_treatment_liability_cents, type: integer, source: computed, description: "= round_half_up(input_mass_kg * 220), frozen at creation" }
      - { name: status, type: enum, source: system, description: "PLANNED | HELD | IN_TREATMENT | TREATED | VERIFIED | LDR_FAILED | ABORTED", default: PLANNED }
      - { name: residue_constituent_ppm, type: number, source: input, description: "Operator-reported residue constituent concentration; supplied on the COMPLETE action, never at creation", default: null }
      - { name: residue_flash_point_c, type: number, source: input, description: "Operator-reported residue flash point; supplied on the COMPLETE action, required when the batch's LDR family is D001_IGNITABLE", default: null }
      - { name: residue_mass_kg, type: number, source: input, description: "Residue mass in kg; supplied on the COMPLETE action, must be <= input_mass_kg", default: 0 }
      - { name: verification_sample_ppm, type: number, source: input, description: "Independent verification sample concentration; supplied on the LDR verification action, never at creation", default: null }
      - { name: ldr_standard_ppm, type: number, source: computed, description: "Universal treatment standard applied, from the batch's LDR family; null for D001_IGNITABLE which uses the flash-point criterion" }
      - { name: ldr_result, type: enum, source: computed, description: "PENDING | PASS | FAIL", default: PENDING }
      - { name: completed_by_user_id, type: string, source: system, description: "X-User-ID of the TreatmentOperator who completed the run; blocks that user from signing verification" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceManager who signed the LDR verification; null before verification" }
      - { name: retreat_count, type: integer, source: system, description: "Number of LDR_FAILED -> PLANNED retreat cycles", default: 0 }
      - { name: held_reason_code, type: enum, source: system, description: "NONE | UNIT_POSTURE | PROFILE_SUSPENDED — why the batch was moved to HELD", default: NONE }

  - name: InspectionEvent
    parent: null
    common_fields: false
    fields:
      - { name: storage_unit_id, type: string, source: input, description: "FK -> StorageUnit.id; unit inspected" }
      - { name: container_id, type: string, source: input, description: "FK -> Container.id; container the finding is narrowed to; null for unit-wide inspections" }
      - { name: inspection_type, type: enum, source: input, description: "WEEKLY_CONTAINER_AREA | DAILY_TANK | AISLE_CLEARANCE | AIR_MONITORING" }
      - { name: finding_code, type: enum, source: input, description: "NONE | CONTAINER_LEAK | TANK_SHELL_CORROSION | LABEL_DEFICIENT | AISLE_OBSTRUCTED | OVERFILL" }
      - { name: measured_organic_vapor_ppm, type: number, source: input, description: "Organic vapor reading in ppm; required when inspection_type == AIR_MONITORING", constraints: ">= 0" }
      - { name: measured_aisle_width_cm, type: number, source: input, description: "Surveyed aisle width in cm; required when inspection_type == AISLE_CLEARANCE" }
      - { name: performed_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceManager who performed the inspection" }
      - { name: inspected_at, type: datetime, source: system, description: "Logical clock instant of the inspection" }
      - { name: leak_detected, type: boolean, source: computed, description: "= measured_organic_vapor_ppm >= leak definition of the unit's air_emission_control_level, OR finding_code IN {CONTAINER_LEAK, TANK_SHELL_CORROSION}" }
      - { name: aisle_compliant, type: boolean, source: computed, description: "= measured_aisle_width_cm >= 76; null when inspection_type != AISLE_CLEARANCE" }

  - name: EmissionRepairOrder
    parent: null
    common_fields: true
    fields:
      - { name: storage_unit_id, type: string, source: system, description: "FK -> StorageUnit.id; unit whose air emission control leaked" }
      - { name: container_id, type: string, source: system, description: "FK -> Container.id; leaking container; null for tank-level leaks" }
      - { name: source_inspection_event_id, type: string, source: system, description: "FK -> InspectionEvent.id; inspection that detected the leak and auto-created this order" }
      - { name: leak_type, type: enum, source: system, description: "CONTAINER_LEAK | TANK_LEAK" }
      - { name: detected_at, type: datetime, source: system, description: "Clock instant of detection, copied from the inspection event" }
      - { name: detected_ppm, type: number, source: system, description: "Organic vapor reading that triggered the order" }
      - { name: leak_definition_ppm, type: number, source: system, description: "Leak threshold applied, from the unit's air_emission_control_level" }
      - { name: first_attempt_due_at, type: datetime, source: system, description: "= detected_at + 5 days" }
      - { name: repair_due_at, type: datetime, source: system, description: "= detected_at + 15 days" }
      - { name: delayed_due_at, type: datetime, source: system, description: "Extended deadline granted by a delay of repair; null unless status == DELAYED" }
      - { name: justification_code, type: enum, source: system, description: "NONE | UNIT_SHUTDOWN_REQUIRED | PART_UNAVAILABLE — justification recorded with the delay of repair", default: NONE }
      - { name: status, type: enum, source: system, description: "OPEN | FIRST_ATTEMPTED | DELAYED | REPAIRED", default: OPEN }
      - { name: attempt_count, type: integer, source: system, description: "Number of repair attempts recorded", default: 0 }
      - { name: last_monitored_ppm, type: number, source: system, description: "Organic vapor reading from the most recent attempt or closure; null before the first attempt" }
      - { name: is_overdue, type: boolean, source: computed, description: "= status != REPAIRED AND current_utc > (delayed_due_at when status == DELAYED else repair_due_at); recomputed on every read" }

  - name: ComplianceFinding
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; cited facility" }
      - { name: storage_unit_id, type: string, source: input, description: "FK -> StorageUnit.id; unit the citation names; null for facility-wide citations" }
      - { name: finding_class, type: enum, source: input, description: "MINOR | SIGNIFICANT | SNC — significant non-complier" }
      - { name: citation_code, type: string, source: input, description: "Regulatory citation, e.g. \"264.174\"" }
      - { name: corrective_action_due_at, type: datetime, source: input, description: "Deadline the inspector sets for corrective action completion" }
      - { name: is_prior_release, type: boolean, source: input, description: "Whether the citation concerns a prior release requiring corrective action", default: false }
      - { name: status, type: enum, source: system, description: "OPEN | RESPONDED | CLOSED | REOPENED", default: OPEN }
      - { name: cited_at, type: datetime, source: system, description: "Logical clock instant the finding was filed" }
      - { name: response_submitted_at, type: datetime, source: system, description: "Clock instant of the most recent facility response; null while OPEN" }
      - { name: corrective_action_completed_on, type: string, source: system, description: "Date the facility reports corrective action complete, ISO 8601 date; null while OPEN" }
      - { name: reopen_count, type: integer, source: system, description: "Number of CLOSED -> REOPENED cycles", default: 0 }
      - { name: is_overdue, type: boolean, source: computed, description: "= status IN {OPEN, REOPENED} AND current_utc > corrective_action_due_at" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Facility
    dimension: permit_status
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: RENEWAL_PENDING
        trigger: "POST /tsdf/facilities/{id}/permit-renewal-request"
        actor: ComplianceManager
        preconditions:
          - "No ComplianceFinding of this facility with finding_class == SNC and is_overdue == true (ERR_CORRECTIVE_ACTION_OVERDUE)"
          - "assurance_shortfall_cents == 0 (ERR_FINANCIAL_ASSURANCE_SHORTFALL)"
        side_effects:
          - "renewal_requested_at = current_utc; requested_permit_expires_at = requested_permit_expires_at from body"
      - from: EXPIRED
        to: RENEWAL_PENDING
        trigger: "POST /tsdf/facilities/{id}/permit-renewal-request"
        actor: ComplianceManager
        preconditions:
          - "No ComplianceFinding of this facility with finding_class == SNC and is_overdue == true (ERR_CORRECTIVE_ACTION_OVERDUE)"
          - "assurance_shortfall_cents == 0 (ERR_FINANCIAL_ASSURANCE_SHORTFALL)"
        side_effects:
          - "renewal_requested_at = current_utc; requested_permit_expires_at = requested_permit_expires_at from body"
      - from: RENEWAL_PENDING
        to: ACTIVE
        trigger: "POST /tsdf/facilities/{id}/permit-decision (decision == GRANT)"
        actor: RegulatoryInspector
        preconditions:
          - "new_permit_expires_at > current_utc (ERR_INVALID_REQUEST)"
        side_effects:
          - "permit_expires_at = new_permit_expires_at; renewal_requested_at = null; requested_permit_expires_at = null"
      - from: RENEWAL_PENDING
        to: EXPIRED
        trigger: "POST /tsdf/facilities/{id}/permit-decision (decision == DENY)"
        actor: RegulatoryInspector
        preconditions: []
        side_effects:
          - "requested_permit_expires_at = null; treatment scheduling and batch start are blocked while EXPIRED"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: evaluated on every read of or mutation touching the facility when current_utc > permit_expires_at"
        actor: system
        preconditions: []
        side_effects:
          - "No cascade: already-PLANNED batches keep status PLANNED but cannot start (ERR_PERMIT_NOT_ACTIVE)"
        note: "Lazy derivation, so the transition is observable purely by moving the logical clock."
      - from: RENEWAL_PENDING
        to: EXPIRED
        trigger: "system: evaluated on every read of or mutation touching the facility when current_utc > permit_expires_at"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXPIRED
        to: TERMINATED
        trigger: "POST /tsdf/facilities/{id}/permit-decision (decision == TERMINATE)"
        actor: RegulatoryInspector
        preconditions: []
        side_effects:
          - "All StorageUnit rows of the facility with status == ACTIVE -> CLOSING with closure_plan_ref = \"PERMIT_TERMINATION\""

  - entity: Generator
    dimension: status
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /tsdf/generators/{id}/status (to_status == SUSPENDED)"
        actor: ComplianceManager
        preconditions: []
        side_effects:
          - "suspension_reason_code = reason_code; new WasteProfile approval decisions for this generator are blocked (ERR_GENERATOR_SUSPENDED)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /tsdf/generators/{id}/status (to_status == ACTIVE)"
        actor: ComplianceManager
        preconditions: []
        side_effects: ["suspension_reason_code = null"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /tsdf/generators/{id}/status (to_status == TERMINATED)"
        actor: ComplianceManager
        preconditions:
          - "No Manifest of this generator with status IN {EN_ROUTE, DISCREPANT, VERIFIED} (ERR_INVALID_STATE)"
        side_effects: []
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /tsdf/generators/{id}/status (to_status == TERMINATED)"
        actor: ComplianceManager
        preconditions:
          - "No Manifest of this generator with status IN {EN_ROUTE, DISCREPANT, VERIFIED} (ERR_INVALID_STATE)"
        side_effects: []

  - entity: WasteProfile
    dimension: status
    initial_state: DRAFT
    terminal_states: [REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /tsdf/waste-profiles/{id}/submit"
        actor: Generator
        preconditions:
          - "Acting Generator owns the profile: X-User-ID == waste_profile.generator_id (ERR_GENERATOR_SCOPE_VIOLATION)"
          - "Generator.status == ACTIVE (ERR_GENERATOR_SUSPENDED)"
        side_effects:
          - "required_sample_type = calculations.required_sample_type (FULL when the generator's ROLLING_WINDOW reliability score < 60 OR sample_attempt_count >= 1, else FINGERPRINT)"
      - from: SAMPLE_FAILED
        to: SUBMITTED
        trigger: "POST /tsdf/waste-profiles/{id}/submit (resubmission with revised characterization)"
        actor: Generator
        preconditions:
          - "Acting Generator owns the profile (ERR_GENERATOR_SCOPE_VIOLATION)"
          - "sample_attempt_count <= 2 (ERR_SAMPLE_LIMIT_EXCEEDED)"
        side_effects:
          - "Any supplied revised_declared_* value overwrites the corresponding declared_* field"
          - "required_sample_type recomputed; escalates to FULL because sample_attempt_count >= 1"
        note: "Revision loop — this is the cycle in the WasteProfile machine."
      - from: EXPIRED
        to: SUBMITTED
        trigger: "POST /tsdf/waste-profiles/{id}/submit (recertification)"
        actor: Generator
        preconditions:
          - "Acting Generator owns the profile (ERR_GENERATOR_SCOPE_VIOLATION)"
        side_effects:
          - "required_sample_type recomputed; approved_treatment_method retained until the next decision"
      - from: SUBMITTED
        to: SAMPLE_PASSED
        trigger: "POST /tsdf/waste-profiles/{id}/samples (result == PASS)"
        actor: WasteApprovalChemist
        preconditions:
          - "expected_waste_profile_version == waste_profile.version (ERR_STALE_VERSION)"
        side_effects:
          - "sample_attempt_count += 1; latest_sample_result = PASS; version += 1"
      - from: SUBMITTED
        to: SAMPLE_FAILED
        trigger: "POST /tsdf/waste-profiles/{id}/samples (result == FAIL and sample_attempt_count < 3 after increment)"
        actor: WasteApprovalChemist
        preconditions:
          - "expected_waste_profile_version == waste_profile.version (ERR_STALE_VERSION)"
        side_effects:
          - "sample_attempt_count += 1; latest_sample_result = FAIL; required_sample_type = FULL; version += 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /tsdf/waste-profiles/{id}/samples (result == FAIL and sample_attempt_count == 3 after increment)"
        actor: WasteApprovalChemist
        preconditions:
          - "expected_waste_profile_version == waste_profile.version (ERR_STALE_VERSION)"
        side_effects:
          - "sample_attempt_count += 1; latest_sample_result = FAIL; profile is terminal — three failed verifications exhaust the characterization"
      - from: SAMPLE_PASSED
        to: APPROVED
        trigger: "POST /tsdf/waste-profiles/{id}/decision (decision == APPROVE)"
        actor: WasteApprovalChemist
        preconditions:
          - "X-User-ID != recorded_by_user_id of the most recent ProfileSample by created_at ASC (ERR_SEGREGATION_OF_DUTIES)"
          - "Generator.status == ACTIVE (ERR_GENERATOR_SUSPENDED)"
          - "approved_treatment_method IN Facility.permitted_methods for the profile's facility_id (ERR_METHOD_NOT_PERMITTED)"
        side_effects:
          - "approved_at = current_utc; approved_by_user_id = X-User-ID; approved_treatment_method = body value"
          - "recertification_due_at = approved_at + recertification_months calendar months"
      - from: SAMPLE_PASSED
        to: REJECTED
        trigger: "POST /tsdf/waste-profiles/{id}/decision (decision == REJECT)"
        actor: WasteApprovalChemist
        preconditions: []
        side_effects: ["Terminal; reason_code stored in suspension_reason_code for the audit trail"]
      - from: SAMPLE_FAILED
        to: REJECTED
        trigger: "POST /tsdf/waste-profiles/{id}/decision (decision == REJECT)"
        actor: WasteApprovalChemist
        preconditions: []
        side_effects: ["Terminal"]
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /tsdf/waste-profiles/{id}/status (to_status == SUSPENDED)"
        actor: ComplianceManager
        preconditions: []
        side_effects:
          - "CASCADE-2 link 1: every Container with waste_profile_id == this profile and custody_state IN {FILLING, SEALED, STAGED} and compliance_state == COMPLIANT -> compliance_state = DEFICIENT, last_finding_code = \"PROFILE_SUSPENDED\""
          - "CASCADE-2 link 2 (caused by link 1): each StorageUnit holding one of those now-DEFICIENT containers recomputes posture; OPEN -> RESTRICTED"
          - "CASCADE-2 link 3 (caused by link 2): every TreatmentBatch on a unit that just became RESTRICTED with status == PLANNED -> HELD with held_reason_code = PROFILE_SUSPENDED, which drops the batch out of StorageUnit.reserved_kg and out of Facility.active_treatment_liability_cents"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /tsdf/waste-profiles/{id}/status (to_status == APPROVED)"
        actor: ComplianceManager
        preconditions: []
        side_effects:
          - "Every Container with this waste_profile_id and compliance_state == DEFICIENT and last_finding_code == \"PROFILE_SUSPENDED\" -> compliance_state = COMPLIANT"
          - "Caused by the line above: affected StorageUnit rows recompute posture; RESTRICTED -> OPEN when no other restriction holds"
          - "Caused by the posture recovery: every TreatmentBatch on those units with status == HELD and held_reason_code == PROFILE_SUSPENDED -> PLANNED, re-entering reserved_kg and active_treatment_liability_cents"
        note: "Reinstatement is the exact compensation of the suspension cascade — this is the cycle in the WasteProfile machine."
      - from: APPROVED
        to: EXPIRED
        trigger: "system: evaluated on every read of or mutation touching the profile when current_utc > recertification_due_at"
        actor: system
        preconditions: []
        side_effects:
          - "No cascade on already-placed containers; new container placement under this profile is rejected with ERR_PROFILE_EXPIRED"
        note: "Lazy derivation — observable by moving the logical clock only."

  - entity: Manifest
    dimension: status
    initial_state: EN_ROUTE
    terminal_states: [CERTIFIED, REJECTED_RETURNED]
    transitions:
      - from: EN_ROUTE
        to: VERIFIED
        trigger: "POST /tsdf/manifests/{id}/receive (computed discrepancy_type == NONE)"
        actor: ReceivingClerk
        preconditions:
          - "Facility.permit_status IN {ACTIVE, RENEWAL_PENDING} (ERR_PERMIT_NOT_ACTIVE)"
        side_effects:
          - "arrived_at = current_utc; each ManifestLine.received_quantity_kg / received_container_count set from received_lines; accepted_quantity_kg = received_quantity_kg; line_status = RECEIVED"
          - "provisional_charge_cents = PROVISIONAL variant of calculations.acceptance_charge; each line's provisional_line_charge_cents stored"
          - "Generator.open_charge_cents += provisional_charge_cents"
        note: "Fork branch A of the receipt fork-join."
      - from: EN_ROUTE
        to: DISCREPANT
        trigger: "POST /tsdf/manifests/{id}/receive (computed discrepancy_type != NONE)"
        actor: ReceivingClerk
        preconditions:
          - "Facility.permit_status IN {ACTIVE, RENEWAL_PENDING} (ERR_PERMIT_NOT_ACTIVE)"
        side_effects:
          - "arrived_at = current_utc; lines updated exactly as in the VERIFIED branch; accepted_quantity_kg = received_quantity_kg; line_status = RECEIVED"
          - "discrepancy_type = highest-priority line significance; discrepancy_report_due_at = arrived_at + 15 days"
          - "An UNDOCUMENTED received line is appended as a new ManifestLine with line_number = max(line_number) + 1, declared_quantity_kg = 0, declared_container_count = 0, variance_pct = null"
          - "provisional_charge_cents computed and Generator.open_charge_cents += provisional_charge_cents (same as branch A)"
        note: "Fork branch B — divergent side-effect set: it additionally stamps the exception-report deadline and may append a line."
      - from: DISCREPANT
        to: VERIFIED
        trigger: "POST /tsdf/manifests/{id}/discrepancy-resolution (resolution_type IN {ACCEPT_ADJUSTED, PARTIAL_REJECT})"
        actor: ComplianceManager
        preconditions:
          - "current_utc <= discrepancy_report_due_at (ERR_DISCREPANCY_REPORT_OVERDUE)"
          - "discrepancy_report_filed in body == true (ERR_INVALID_REQUEST)"
        side_effects:
          - "ACCEPT_ADJUSTED: every line_status RECEIVED -> ACCEPTED with accepted_quantity_kg taken from the matching `adjusted_lines` entry when one is supplied for that line_number and received_quantity_kg otherwise, and returned_quantity_kg = received_quantity_kg - accepted_quantity_kg"
          - "PARTIAL_REJECT: lines named in rejected_line_numbers -> RETURNED with accepted_quantity_kg = 0 and returned_quantity_kg = received_quantity_kg; all other lines -> ADJUSTED with accepted_quantity_kg = received_quantity_kg"
          - "discrepancy_resolved_at = current_utc; discrepancy_report_filed = true; resolution_type stored"
        note: "Join point of the fork — both branches converge here before certification."
      - from: DISCREPANT
        to: REJECTED_RETURNED
        trigger: "POST /tsdf/manifests/{id}/discrepancy-resolution (resolution_type == REJECT_RETURN)"
        actor: ComplianceManager
        preconditions:
          - "current_utc <= discrepancy_report_due_at (ERR_DISCREPANCY_REPORT_OVERDUE)"
        side_effects:
          - "CASCADE-3 link 1: every ManifestLine -> RETURNED with accepted_quantity_kg = 0 and returned_quantity_kg = received_quantity_kg"
          - "CASCADE-3 link 2 (caused by link 1): every Container whose manifest_line_id is one of those returned lines and whose custody_state IN {FILLING, SEALED} -> custody_state = VOIDED"
          - "CASCADE-3 link 3 (caused by link 2): each StorageUnit that held a voided container recomputes container_count / stored_kg / effective_aisle_width_cm / posture"
          - "Also caused by link 1: Generator.open_charge_cents -= provisional_charge_cents and Generator.voided_charge_cents += provisional_charge_cents"
      - from: VERIFIED
        to: REJECTED_RETURNED
        trigger: "POST /tsdf/manifests/{id}/discrepancy-resolution (resolution_type == REJECT_RETURN)"
        actor: ComplianceManager
        preconditions:
          - "No Container of this manifest's lines has custody_state IN {STAGED, EMPTIED} (ERR_INVALID_STATE)"
        side_effects:
          - "Identical CASCADE-3 chain as from DISCREPANT"
      - from: VERIFIED
        to: CERTIFIED
        trigger: "POST /tsdf/manifests/{id}/certify"
        actor: ReceivingClerk
        preconditions:
          - "discrepancy_type == NONE OR discrepancy_report_filed == true (ERR_DISCREPANCY_REPORT_OVERDUE)"
        side_effects:
          - "final_charge_cents = FINAL variant of calculations.acceptance_charge; each line's final_line_charge_cents stored"
          - "Generator.open_charge_cents -= provisional_charge_cents; Generator.settled_charge_cents += final_charge_cents; Generator.charge_adjustment_cents += (final_charge_cents - provisional_charge_cents)"
          - "Every line with line_status IN {RECEIVED, ADJUSTED} -> ACCEPTED"

  - entity: StorageUnit
    dimension: status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSING
        trigger: "POST /tsdf/storage-units/{id}/status (to_status == CLOSING)"
        actor: ComplianceManager
        preconditions:
          - "closure_plan_ref present in body (ERR_INVALID_REQUEST)"
        side_effects:
          - "closure_plan_ref stored; posture recomputed — placements are refused while CLOSING because posture is at least RESTRICTED"
      - from: CLOSING
        to: CLOSED
        trigger: "POST /tsdf/storage-units/{id}/status (to_status == CLOSED)"
        actor: ComplianceManager
        preconditions:
          - "container_count == 0 (ERR_INVALID_STATE)"
          - "No TreatmentBatch on this unit with status IN {PLANNED, HELD, IN_TREATMENT, TREATED, LDR_FAILED} (ERR_INVALID_STATE)"
          - "No EmissionRepairOrder on this unit with status != REPAIRED (ERR_INVALID_STATE)"
        side_effects:
          - "posture = CLOSED; unit no longer contributes to Facility.held_mass_kg"
      - from: CLOSING
        to: ACTIVE
        trigger: "POST /tsdf/storage-units/{id}/status (to_status == ACTIVE)"
        actor: ComplianceManager
        preconditions: []
        side_effects: ["closure_plan_ref = null; posture recomputed"]

  - entity: Container
    dimension: custody_state
    initial_state: FILLING
    terminal_states: [EMPTIED, VOIDED]
    transitions:
      - from: FILLING
        to: SEALED
        trigger: "POST /tsdf/containers/{id}/custody-state (to_custody_state == SEALED)"
        actor: ReceivingClerk
        preconditions:
          - "label_accumulation_start_marked == true (ERR_LABEL_INCOMPLETE)"
        side_effects: ["No change to compliance_state — the dimensions are independent"]
      - from: SEALED
        to: STAGED
        trigger: "POST /tsdf/treatment-batches (container listed in container_ids)"
        actor: TreatmentOperator
        preconditions:
          - "compliance_state == COMPLIANT (ERR_INVALID_STATE)"
        side_effects: ["treatment_batch_id = the new batch id; the container's mass enters StorageUnit.reserved_kg via the batch"]
      - from: STAGED
        to: SEALED
        trigger: "POST /tsdf/treatment-batches/{id}/operations (action IN {ABORT, RETREAT_RESET})"
        actor: TreatmentOperator
        preconditions: []
        side_effects: ["treatment_batch_id = null on ABORT; retained on RETREAT_RESET"]
      - from: STAGED
        to: EMPTIED
        trigger: "POST /tsdf/containers/{id}/custody-state (to_custody_state == EMPTIED)"
        actor: TreatmentOperator
        preconditions:
          - "The container's TreatmentBatch.status IN {VERIFIED, LDR_FAILED}, i.e. the batch has been through verification: PLANNED, HELD, IN_TREATMENT and TREATED are refused (ERR_INVALID_STATE)"
          - "The batch's ldr_result != FAIL (ERR_LDR_STANDARD_NOT_MET). The state check above deliberately admits LDR_FAILED so that this rule, not priority 9, is the one that reports a residue failing its land disposal restriction standard"
        side_effects:
          - "Container leaves StorageUnit.stored_kg; the unit recomputes container_count / effective_aisle_width_cm / posture"
      - from: FILLING
        to: VOIDED
        trigger: "POST /tsdf/containers/{id}/custody-state (to_custody_state == VOIDED) or CASCADE-3 link 2"
        actor: ReceivingClerk
        preconditions: []
        side_effects:
          - "Container leaves StorageUnit.stored_kg and ManifestLine.allocated_container_mass_kg, so the mass returns to Facility.unallocated_receipt_kg — Facility.mass_ledger_kg is unchanged"
          - "Facility.closure_cost_estimate_cents and required_assurance_cents recomputed downward"
      - from: SEALED
        to: VOIDED
        trigger: "POST /tsdf/containers/{id}/custody-state (to_custody_state == VOIDED) or CASCADE-3 link 2"
        actor: ReceivingClerk
        preconditions: []
        side_effects: ["Identical to FILLING -> VOIDED"]

  - entity: Container
    dimension: compliance_state
    initial_state: COMPLIANT
    terminal_states: []
    transitions:
      - from: COMPLIANT
        to: DEFICIENT
        trigger: "POST /tsdf/containers/{id}/compliance-state (to_compliance_state == DEFICIENT), POST /tsdf/inspection-events (finding_code IN {LABEL_DEFICIENT, OVERFILL}), or CASCADE-2 link 1"
        actor: ComplianceManager
        preconditions: []
        side_effects:
          - "last_finding_code stored; custody_state untouched"
          - "The holding StorageUnit recomputes posture; OPEN -> RESTRICTED"
          - "Caused by the posture change: PLANNED batches on that unit -> HELD with held_reason_code = UNIT_POSTURE"
      - from: DEFICIENT
        to: COMPLIANT
        trigger: "POST /tsdf/containers/{id}/compliance-state (to_compliance_state == COMPLIANT)"
        actor: ComplianceManager
        preconditions: []
        side_effects:
          - "last_finding_code = null; holding unit recomputes posture; HELD batches with held_reason_code == UNIT_POSTURE -> PLANNED when posture returns to OPEN"
      - from: COMPLIANT
        to: CONDEMNED
        trigger: "POST /tsdf/inspection-events (finding_code == CONTAINER_LEAK) or POST /tsdf/containers/{id}/compliance-state (to_compliance_state == CONDEMNED)"
        actor: ComplianceManager
        preconditions: []
        side_effects:
          - "CASCADE-1 link 1: compliance_state = CONDEMNED, last_finding_code = finding_code"
          - "CASCADE-1 link 2 (caused by link 1): the holding StorageUnit recomputes posture -> SUSPENDED, because condemned_count >= 1"
          - "CASCADE-1 link 3 (caused by link 2): every TreatmentBatch on that unit with status == PLANNED -> HELD with held_reason_code = UNIT_POSTURE"
          - "CASCADE-1 link 4 (caused by link 3): each HELD batch drops out of StorageUnit.reserved_kg and out of Facility.active_treatment_liability_cents, so Facility.required_assurance_cents falls by the batch's estimated_treatment_liability_cents"
      - from: DEFICIENT
        to: CONDEMNED
        trigger: "POST /tsdf/inspection-events (finding_code == CONTAINER_LEAK) or POST /tsdf/containers/{id}/compliance-state (to_compliance_state == CONDEMNED)"
        actor: ComplianceManager
        preconditions: []
        side_effects: ["Identical CASCADE-1 chain as from COMPLIANT"]
      - from: CONDEMNED
        to: COMPLIANT
        trigger: "POST /tsdf/containers/{id}/compliance-state (to_compliance_state == COMPLIANT)"
        actor: ComplianceManager
        preconditions:
          - "No EmissionRepairOrder for this container with status != REPAIRED (ERR_INVALID_STATE)"
        side_effects: ["Holding unit recomputes posture; HELD batches with held_reason_code == UNIT_POSTURE -> PLANNED when posture returns to OPEN"]

  - entity: TreatmentBatch
    dimension: status
    initial_state: PLANNED
    terminal_states: [VERIFIED, ABORTED]
    transitions:
      - from: PLANNED
        to: IN_TREATMENT
        trigger: "POST /tsdf/treatment-batches/{id}/operations (action == START)"
        actor: TreatmentOperator
        preconditions:
          - "Facility.permit_status IN {ACTIVE, RENEWAL_PENDING} (ERR_PERMIT_NOT_ACTIVE)"
          - "treatment_method IN Facility.permitted_methods (ERR_METHOD_NOT_PERMITTED)"
          - "StorageUnit.posture == OPEN (ERR_UNIT_POSTURE_BLOCKED)"
          - "StorageUnit.inspection_overdue == false (ERR_INSPECTION_OVERDUE)"
          - "current_utc >= window_start (ERR_INVALID_STATE)"
        side_effects: ["No mass movement; the unit's reserved_kg already carries input_mass_kg"]
      - from: IN_TREATMENT
        to: TREATED
        trigger: "POST /tsdf/treatment-batches/{id}/operations (action == COMPLETE)"
        actor: TreatmentOperator
        preconditions:
          - "residue_mass_kg <= input_mass_kg (ERR_MASS_BALANCE_INVALID)"
          - "residue_flash_point_c present when the batch's LDR family is D001_IGNITABLE (ERR_INVALID_REQUEST)"
        side_effects:
          - "residue_* fields stored; completed_by_user_id = X-User-ID; ldr_result stays PENDING"
          - "Every staged Container -> custody_state EMPTIED is NOT applied here; containers stay STAGED until verification"
          - "Facility.treated_residue_kg += residue_mass_kg and Facility.destroyed_mass_kg += (input_mass_kg - residue_mass_kg), keeping mass_ledger_kg unchanged"
      - from: TREATED
        to: VERIFIED
        trigger: "POST /tsdf/treatment-batches/{id}/ldr-verification (verification passes the standard)"
        actor: ComplianceManager
        preconditions:
          - "X-User-ID != completed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "ldr_result = PASS; verified_by_user_id = X-User-ID; batch leaves StorageUnit.reserved_kg and Facility.active_treatment_liability_cents"
      - from: TREATED
        to: LDR_FAILED
        trigger: "POST /tsdf/treatment-batches/{id}/ldr-verification (verification fails the standard)"
        actor: ComplianceManager
        preconditions:
          - "X-User-ID != completed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "ldr_result = FAIL; verified_by_user_id = X-User-ID; residue may not be released — container EMPTIED is refused with ERR_LDR_STANDARD_NOT_MET"
      - from: LDR_FAILED
        to: PLANNED
        trigger: "POST /tsdf/treatment-batches/{id}/operations (action == RETREAT_RESET)"
        actor: TreatmentOperator
        preconditions:
          - "retreat_count <= 1 (ERR_INVALID_STATE)"
        side_effects:
          - "retreat_count += 1; ldr_result = PENDING; residue_* and verification_sample_ppm cleared; verified_by_user_id = null"
          - "input_mass_kg is NOT recomputed; Facility.treated_residue_kg and destroyed_mass_kg lose this batch's contribution again, so mass_ledger_kg is unchanged"
        note: "Re-treatment cycle — LDR_FAILED returns to PLANNED."
      - from: PLANNED
        to: HELD
        trigger: "system: CASCADE-1 link 3 or CASCADE-2 link 3 (holding unit posture leaves OPEN)"
        actor: system
        preconditions: []
        side_effects:
          - "held_reason_code set; batch leaves StorageUnit.reserved_kg and Facility.active_treatment_liability_cents"
      - from: HELD
        to: PLANNED
        trigger: "system: holding unit posture returns to OPEN via container compliance recovery or profile reinstatement"
        actor: system
        preconditions: []
        side_effects: ["held_reason_code = NONE; batch re-enters reserved_kg and active_treatment_liability_cents"]
      - from: PLANNED
        to: ABORTED
        trigger: "POST /tsdf/treatment-batches/{id}/operations (action == ABORT)"
        actor: TreatmentOperator
        preconditions: []
        side_effects:
          - "Every staged Container -> SEALED with treatment_batch_id = null"
          - "Batch leaves StorageUnit.reserved_kg and Facility.active_treatment_liability_cents; Facility.required_assurance_cents returns exactly to its pre-creation value with no rounding drift"
      - from: HELD
        to: ABORTED
        trigger: "POST /tsdf/treatment-batches/{id}/operations (action == ABORT)"
        actor: TreatmentOperator
        preconditions: []
        side_effects: ["Same as PLANNED -> ABORTED (the batch already left reserved_kg when it was held)"]
      - from: IN_TREATMENT
        to: ABORTED
        trigger: "POST /tsdf/treatment-batches/{id}/operations (action == ABORT)"
        actor: TreatmentOperator
        preconditions: []
        side_effects: ["Same as PLANNED -> ABORTED"]

  - entity: EmissionRepairOrder
    dimension: status
    initial_state: OPEN
    terminal_states: [REPAIRED]
    transitions:
      - from: OPEN
        to: FIRST_ATTEMPTED
        trigger: "POST /tsdf/emission-repair-orders/{id}/actions (action == FIRST_ATTEMPT)"
        actor: TreatmentOperator
        preconditions:
          - "current_utc <= first_attempt_due_at (ERR_REPAIR_ATTEMPT_LATE)"
        side_effects: ["attempt_count += 1; last_monitored_ppm = monitored_ppm"]
      - from: FIRST_ATTEMPTED
        to: FIRST_ATTEMPTED
        trigger: "POST /tsdf/emission-repair-orders/{id}/actions (action == REPAIR_ATTEMPT)"
        actor: TreatmentOperator
        preconditions:
          - "is_overdue == false (ERR_REPAIR_ATTEMPT_LATE)"
        side_effects: ["attempt_count += 1; last_monitored_ppm = monitored_ppm"]
      - from: OPEN
        to: DELAYED
        trigger: "POST /tsdf/emission-repair-orders/{id}/actions (action == DELAY)"
        actor: ComplianceManager
        preconditions:
          - "justification_code IN {UNIT_SHUTDOWN_REQUIRED, PART_UNAVAILABLE} (ERR_DELAY_JUSTIFICATION_INVALID)"
          - "delayed_due_at <= detected_at + 180 days (ERR_DELAY_JUSTIFICATION_INVALID)"
        side_effects: ["delayed_due_at and justification_code stored; is_overdue now measures against delayed_due_at"]
      - from: FIRST_ATTEMPTED
        to: DELAYED
        trigger: "POST /tsdf/emission-repair-orders/{id}/actions (action == DELAY)"
        actor: ComplianceManager
        preconditions:
          - "justification_code IN {UNIT_SHUTDOWN_REQUIRED, PART_UNAVAILABLE} (ERR_DELAY_JUSTIFICATION_INVALID)"
          - "delayed_due_at <= detected_at + 180 days (ERR_DELAY_JUSTIFICATION_INVALID)"
        side_effects: ["delayed_due_at and justification_code stored"]
      - from: FIRST_ATTEMPTED
        to: REPAIRED
        trigger: "POST /tsdf/emission-repair-orders/{id}/actions (action == CLOSE)"
        actor: ComplianceManager
        preconditions:
          - "monitored_ppm < leak_definition_ppm, strictly (ERR_LEAK_PERSISTS)"
        side_effects:
          - "last_monitored_ppm = monitored_ppm; is_overdue becomes false"
          - "The unit recomputes posture: with no unrepaired order and no condemned container it returns to OPEN, which un-holds its HELD batches"
      - from: DELAYED
        to: REPAIRED
        trigger: "POST /tsdf/emission-repair-orders/{id}/actions (action == CLOSE)"
        actor: ComplianceManager
        preconditions:
          - "monitored_ppm < leak_definition_ppm, strictly (ERR_LEAK_PERSISTS)"
        side_effects: ["Same as FIRST_ATTEMPTED -> REPAIRED"]
      - from: OPEN
        to: REPAIRED
        trigger: "POST /tsdf/emission-repair-orders/{id}/actions (action == CLOSE)"
        actor: ComplianceManager
        preconditions:
          - "attempt_count >= 1 (ERR_INVALID_STATE)"
          - "monitored_ppm < leak_definition_ppm, strictly (ERR_LEAK_PERSISTS)"
        side_effects: ["Unreachable in practice because attempt_count == 0 while OPEN; kept explicit so the precondition is testable"]

  - entity: ComplianceFinding
    dimension: status
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESPONDED
        trigger: "POST /tsdf/compliance-findings/{id}/status (to_status == RESPONDED)"
        actor: ComplianceManager
        preconditions:
          - "corrective_action_completed_on present in body (ERR_INVALID_REQUEST)"
        side_effects:
          - "response_submitted_at = current_utc; corrective_action_completed_on stored"
          - "Facility.corrective_action_status recomputed to IN_PROGRESS when no other finding is OPEN or REOPENED. open_snc_finding_count and Facility.corrective_action_reserve_cents do NOT change: calculations.corrective_action_status counts SNC findings in {OPEN, RESPONDED, REOPENED}, so the reserve is held until the inspector closes the finding"
      - from: RESPONDED
        to: CLOSED
        trigger: "POST /tsdf/compliance-findings/{id}/status (to_status == CLOSED)"
        actor: RegulatoryInspector
        preconditions: []
        side_effects:
          - "Facility.open_snc_finding_count falls and corrective_action_reserve_cents drops by 5000000 for an SNC finding, since CLOSED is the only status outside the counted set; permit renewal is no longer blocked by this finding"
      - from: CLOSED
        to: REOPENED
        trigger: "POST /tsdf/compliance-findings/{id}/status (to_status == REOPENED)"
        actor: RegulatoryInspector
        preconditions:
          - "reopen_count <= 2 (ERR_INVALID_STATE)"
        side_effects:
          - "reopen_count += 1; corrective_action_due_at = current_utc + 30 days"
          - "For finding_class == SNC this raises Facility.open_snc_finding_count and Facility.corrective_action_reserve_cents by 5000000"
        note: "Cycle: CLOSED -> REOPENED -> RESPONDED -> CLOSED."
      - from: REOPENED
        to: RESPONDED
        trigger: "POST /tsdf/compliance-findings/{id}/status (to_status == RESPONDED)"
        actor: ComplianceManager
        preconditions:
          - "corrective_action_completed_on present in body (ERR_INVALID_REQUEST)"
        side_effects: ["response_submitted_at = current_utc; corrective_action_status recomputed as in OPEN -> RESPONDED, with the SNC reserve likewise held rather than released"]

  - entity: FinancialAssuranceInstrument
    dimension: status
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /tsdf/financial-assurance-instruments (a newer instrument for the same facility supersedes this one)"
        actor: ComplianceManager
        preconditions: []
        side_effects:
          - "superseded_by_instrument_id = the new instrument's id; superseded_at = current_utc"
          - "Facility.posted_assurance_cents recomputed from the new ACTIVE instrument only"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /tsdf/financial-assurance-instruments/{id}/cancel"
        actor: ComplianceManager
        preconditions:
          - "Facility.required_assurance_cents == 0 OR another ACTIVE instrument covers required_assurance_cents (ERR_FINANCIAL_ASSURANCE_SHORTFALL)"
        side_effects: ["superseded_at = current_utc; Facility.posted_assurance_cents recomputed"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` — the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: instrument-create-stale-facility
    parent_entity: Facility
    write_endpoint: "POST /tsdf/financial-assurance-instruments"
    occ_field: "expected_facility_version"
    description: |
      Posting a FinancialAssuranceInstrument against a Facility whose version has
      advanced since the client last read it is rejected. A new instrument
      legitimately supersedes the facility's prior ACTIVE instrument, so a client
      working from a stale facility view would silently retire an instrument it
      never saw; the stale-version check forces it to re-read first.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: sample-create-stale-profile
    parent_entity: WasteProfile
    write_endpoint: "POST /tsdf/waste-profiles/{id}/samples"
    occ_field: "expected_waste_profile_version"
    description: |
      Recording a ProfileSample against a WasteProfile whose version has advanced
      since the client last read it is rejected. The newest sample supersedes the
      previous one as the profile's latest_sample_result and can drive the profile
      to SAMPLE_PASSED, SAMPLE_FAILED or REJECTED, so a sample written from a stale
      view of the declared characterization would be evaluated against superseded
      tolerances.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules
#
# All money is integer cents. All rate multipliers are exact decimals evaluated
# with decimal (not binary float) arithmetic. `round_half_up(x)` rounds to the
# nearest integer with ties away from zero. `current_utc` is the logical clock.
# =============================================================================
calculations:
  - name: acceptance_charge
    trigger: "POST /tsdf/manifests/{id}/receive (PROVISIONAL) and POST /tsdf/manifests/{id}/certify (FINAL)"
    algorithm_type: aggregation
    combinatorial_mode: "b — the per-line result is rounded to whole cents BEFORE summation; summing raw line values and rounding once at the end is wrong"
    inputs:
      - "ManifestLine rows of the manifest, ordered by line_number ASC"
      - "WasteProfile.physical_form, .compatibility_class, .ldr_subcategory of each line's waste_profile_id"
    constants:
      BASE_RATE_CENTS_PER_KG: { BULK_LIQUID: 40, SLUDGE: 55, SOLID: 30, LAB_PACK: 120 }
      HAZARD_MULTIPLIER: { ACID: 1.10, ALKALINE: 1.10, OXIDIZER: 1.35, CYANIDE_BEARING: 1.50, WATER_REACTIVE: 1.45, ORGANIC_SOLVENT: 1.20 }
      LDR_SURCHARGE_CENTS_PER_KG: 12
      CONTAINER_HANDLING_FEE_CENTS: 750
    formula: |
      For each included line, in line_number ASC order:
        rate_cents_per_kg = BASE_RATE_CENTS_PER_KG[profile.physical_form]
                            * HAZARD_MULTIPLIER[profile.compatibility_class]
                            + (LDR_SURCHARGE_CENTS_PER_KG if profile.ldr_subcategory != NONE else 0)
        line_charge_cents = round_half_up(quantity_kg * rate_cents_per_kg)
                            + CONTAINER_HANDLING_FEE_CENTS * received_container_count
      total = sum(line_charge_cents)          # sum of already-rounded per-line values
    variants:
      PROVISIONAL:
        context: "Frozen at receipt into Manifest.provisional_charge_cents and ManifestLine.provisional_line_charge_cents"
        included_lines: "line_status == RECEIVED"
        quantity_kg: "received_quantity_kg"
      FINAL:
        context: "Frozen at certification into Manifest.final_charge_cents and ManifestLine.final_line_charge_cents"
        included_lines: "line_status IN {RECEIVED, ACCEPTED, ADJUSTED} — RETURNED lines are excluded entirely"
        quantity_kg: "accepted_quantity_kg"
    reconciliation: |
      At certification: Generator.open_charge_cents -= provisional_charge_cents,
      Generator.settled_charge_cents += final_charge_cents,
      Generator.charge_adjustment_cents += (final_charge_cents - provisional_charge_cents).
    precision: "Whole cents per line; quantities carry 3 decimals"
    worked_examples:
      - "Single BULK_LIQUID / ORGANIC_SOLVENT / NONE line (rate 48), received 1250.5 kg in 5 containers: provisional = round_half_up(60024.0) + 3750 = 63774. Discrepancy resolution ACCEPT_ADJUSTED with accepted 1180.0 kg: final = round_half_up(56640.0) + 3750 = 60390, charge_adjustment_cents = -3384."
      - "Two lines: L1 SOLID / WATER_REACTIVE / NONE (rate 43.50) 23.0 kg in 1 container -> round_half_up(1000.5) + 750 = 1751; L2 SLUDGE / ACID / NONE (rate 60.50) 33.0 kg in 1 container -> round_half_up(1996.5) + 750 = 2747; total = 4498. Summing raw (2997.0) and rounding once yields 4497 — off by one cent."

  - name: financial_assurance_requirement
    trigger: "Recomputed on every read of a Facility and after any change to stored mass, treatment batches, financial assurance instruments or compliance findings"
    algorithm_type: tiered_pricing
    combinatorial_mode: "c — the surcharge tier looks self-referential (it prices the closure cost) but is resolved in a fixed order: the tier is selected from the PRE-surcharge closure_base_cost_cents and never re-derived from the surcharged result"
    inputs:
      - "Facility.held_mass_kg (sum of StorageUnit.stored_kg)"
      - "Facility.post_closure_cost_cents"
      - "Facility.open_snc_finding_count"
      - "Facility.active_treatment_liability_cents"
    constants:
      CLOSURE_BASE_CENTS: 25000000
      CLOSURE_CENTS_PER_KG: 1800
      TIER_1_MAX_CENTS: 30000000
      TIER_2_MAX_CENTS: 60000000
      TIER_SURCHARGE_RATE: { TIER_1: 0.05, TIER_2: 0.10, TIER_3: 0.18 }
      SNC_RESERVE_CENTS_EACH: 5000000
    formula: |
      step 1: closure_base_cost_cents = CLOSURE_BASE_CENTS + round_half_up(held_mass_kg * CLOSURE_CENTS_PER_KG)
      step 2: assurance_tier = TIER_1 if closure_base_cost_cents <  TIER_1_MAX_CENTS
                          else TIER_2 if closure_base_cost_cents <  TIER_2_MAX_CENTS
                          else TIER_3                                   # keyed on step 1 ONLY
      step 3: closure_cost_estimate_cents = round_half_up(closure_base_cost_cents * (1 + TIER_SURCHARGE_RATE[assurance_tier]))
      step 4: corrective_action_reserve_cents = open_snc_finding_count * SNC_RESERVE_CENTS_EACH
      step 5: required_assurance_cents = closure_cost_estimate_cents + post_closure_cost_cents
                                       + corrective_action_reserve_cents + active_treatment_liability_cents
      step 6: assurance_shortfall_cents = max(0, required_assurance_cents - posted_assurance_cents)
    precision: "Integer cents; round_half_up at steps 1 and 3 only"
    edge_cases:
      - "held_mass_kg == 0: closure_base = 25000000 -> TIER_1 -> closure_estimate = 26250000; with post_closure 8000000 required = 34250000"
      - "held_mass_kg == 200: base 25360000 -> TIER_1 -> 26628000; required = 34628000"
      - "held_mass_kg == 200 plus one PLANNED batch of 200.0 kg (liability 44000): required = 34672000"
      - "held_mass_kg == 200 plus one OPEN SNC finding: required = 39628000"
      - "held_mass_kg == 2700: base 29860000 (< 30000000, still TIER_1) -> 31353000; required = 39353000. Re-deriving the tier from the surcharged 31353000 would give TIER_2 and 40846000 — wrong."

  - name: generator_reliability_score
    trigger: "Recomputed on every read of a Generator and used by required_sample_type"
    algorithm_type: weighted_scoring
    inputs:
      - "Manifest rows of the generator with status IN {CERTIFIED, REJECTED_RETURNED} (closed manifests)"
      - "WasteProfile rows of the generator with status != DRAFT"
    constants:
      ROLLING_WINDOW_SIZE: 3
      W_DISCREPANCY: 45
      W_RETURN: 35
      W_PROFILE_FAIL: 20
      SCORE_MAX: 100
      SCORE_MIN: 0
    formula: |
      n = count(closed manifests in the variant's manifest set)
      if n == 0: score = SCORE_MAX
      else:
        discrepancy_rate  = count(manifests in set with discrepancy_type != NONE) / n
        return_rate       = count(manifests in set with status == REJECTED_RETURNED) / n
        profile_fail_rate = count(profiles with status IN {SAMPLE_FAILED, REJECTED}) / count(profiles with status != DRAFT)
                            (0 when the denominator is 0; identical in both variants)
        score = clamp(round_half_up(SCORE_MAX
                                    - W_DISCREPANCY  * discrepancy_rate
                                    - W_RETURN       * return_rate
                                    - W_PROFILE_FAIL * profile_fail_rate), SCORE_MIN, SCORE_MAX)
    variants:
      ROLLING_WINDOW:
        context: "Generator.reliability_score_rolling; also the gate used by required_sample_type"
        manifest_set: "The ROLLING_WINDOW_SIZE most recent closed manifests, ordered arrived_at DESC with created_at DESC as tie-break"
      LIFETIME:
        context: "Generator.reliability_score_lifetime; reported, never used as a gate"
        manifest_set: "Every closed manifest of the generator"
    precision: "Integer score; rates carry full precision until the single round_half_up"
    edge_cases:
      - "Brand-new generator (n == 0): both variants are 100"
      - "4 closed manifests where only the OLDEST is DISCREPANT-resolved: rolling = 100 (the window excludes it), lifetime = round_half_up(100 - 45*0.25) = round_half_up(88.75) = 89"

  - name: required_sample_type
    trigger: "Every DRAFT | SAMPLE_FAILED | EXPIRED -> SUBMITTED transition of a WasteProfile"
    algorithm_type: threshold
    inputs: ["Generator.reliability_score_rolling", "WasteProfile.sample_attempt_count"]
    constants: { RELIABILITY_FULL_SAMPLE_THRESHOLD: 60 }
    formula: |
      required_sample_type = FULL if (reliability_score_rolling < RELIABILITY_FULL_SAMPLE_THRESHOLD
                                      OR sample_attempt_count >= 1)
                             else FINGERPRINT
    precision: "n/a"
    edge_cases:
      - "reliability_score_rolling exactly 60 with sample_attempt_count 0 -> FINGERPRINT (threshold is strict)"
      - "Any resubmission after a failed sample -> FULL, permanently for that profile"

  - name: sample_acceptance_evaluation
    trigger: "POST /tsdf/waste-profiles/{id}/samples"
    algorithm_type: threshold
    inputs:
      - "ProfileSample.measured_constituent_ppm / measured_flash_point_c / measured_ph"
      - "WasteProfile.declared_constituent_ppm / declared_flash_point_c / declared_ph"
      - "WasteProfile.required_sample_type (the tolerance selector — ProfileSample.sample_type is audit metadata only)"
    constants:
      TOLERANCE:
        FINGERPRINT: { constituent_pct: 0.15, flash_point_c: 5.0, ph: 1.0 }
        FULL:        { constituent_pct: 0.10, flash_point_c: 3.0, ph: 0.5 }
    formula: |
      applied_tolerance_type   = profile.required_sample_type
      T                        = TOLERANCE[applied_tolerance_type]
      constituent_deviation_pct = abs(measured_constituent_ppm - declared_constituent_ppm)
                                  / max(declared_constituent_ppm, 1)      # 4 decimals
      Evaluated in this fixed order, first breach wins:
        1. constituent_deviation_pct > T.constituent_pct            -> FAIL, CONSTITUENT_DEVIATION
        2. abs(measured_flash_point_c - declared_flash_point_c) > T.flash_point_c -> FAIL, FLASH_POINT_DEVIATION
        3. abs(measured_ph - declared_ph) > T.ph                    -> FAIL, PH_DEVIATION
        otherwise                                                    -> PASS, NONE
    precision: "constituent_deviation_pct to 4 decimals, half-up, before comparison"
    edge_cases:
      - "declared 12000 ppm, measured 12500 -> 0.0417 -> PASS under either tolerance"
      - "declared 12000 ppm, measured 13200 -> exactly 0.1000 -> PASS even under FULL (comparison is strictly greater)"
      - "declared 12000 ppm, measured 13400 -> 0.1167 -> PASS under FINGERPRINT, FAIL under FULL: the divergence is driven by the profile's required_sample_type, not by the sample's own sample_type"
      - "declared 12000 ppm, measured 15000 -> 0.2500 -> FAIL under either tolerance"

  - name: discrepancy_classification
    trigger: "POST /tsdf/manifests/{id}/receive"
    algorithm_type: threshold
    inputs: ["ManifestLine.declared_quantity_kg / declared_container_count / is_bulk", "received_lines payload"]
    constants:
      BULK_VARIANCE_TOLERANCE: 0.10
      CONTAINERIZED_VARIANCE_TOLERANCE: 0.02
      DISCREPANCY_REPORT_DAYS: 15
    formula: |
      Per line, in line_number ASC order:
        variance_pct = (declared_quantity_kg - received_quantity_kg) / declared_quantity_kg   # 4 decimals
                     = null when declared_quantity_kg == 0
        A received line with no matching declared line   -> significance = UNDOCUMENTED, variance_pct = null
        else if not is_bulk and received_container_count != declared_container_count
                                                          -> significance = COUNT_MISMATCH
        else if abs(variance_pct) >= (BULK_VARIANCE_TOLERANCE if is_bulk else CONTAINERIZED_VARIANCE_TOLERANCE)
                                                          -> significance = QUANTITY_SIGNIFICANT
        else                                              -> significance = NONE
      Manifest.discrepancy_type = highest-priority line significance under
        UNDOCUMENTED > COUNT_MISMATCH > QUANTITY_SIGNIFICANT > NONE
      When discrepancy_type != NONE: discrepancy_report_due_at = arrived_at + DISCREPANCY_REPORT_DAYS days
    precision: "variance_pct to 4 decimals, half-up, before comparison"
    edge_cases:
      - "Bulk line declared 1000.0, received 900.0 -> variance exactly 0.1000 -> QUANTITY_SIGNIFICANT (the tolerance is inclusive)"
      - "Bulk line declared 1000.0, received 905.0 -> 0.0950 -> NONE"
      - "Containerized line declared 1000.0 / 4 containers, received 1000.0 / 4 -> NONE; received 1000.0 / 3 -> COUNT_MISMATCH even with zero quantity variance"
      - "An undocumented received line outranks a COUNT_MISMATCH on line 1, so discrepancy_type == UNDOCUMENTED"

  - name: effective_aisle_clearance
    trigger: "Recomputed on every read of a StorageUnit and before every container placement"
    algorithm_type: constraint_propagation
    inputs: ["StorageUnit.aisle_width_cm", "StorageUnit.aisle_free_container_capacity", "StorageUnit.container_count"]
    constants:
      ENCROACHMENT_CM_PER_CONTAINER: 6
      MIN_AISLE_WIDTH_CM: 76
    formula: |
      effective_aisle_width_cm = aisle_width_cm
                                 - ENCROACHMENT_CM_PER_CONTAINER * max(0, container_count - aisle_free_container_capacity)
      A placement is refused when the effective width computed with the container INCLUDED
      would fall below MIN_AISLE_WIDTH_CM (ERR_AISLE_CLEARANCE_VIOLATION).
    precision: "cm, 1 decimal"
    edge_cases:
      - "aisle_width_cm 78, aisle_free_container_capacity 4: container_count 0 -> 78 (the max(0, ...) guard makes the empty unit pass rather than credit width); count 4 -> 78; count 5 -> 72, so placing the 5th container is refused"
      - "A unit whose surveyed aisle_width_cm is already 76 accepts containers up to aisle_free_container_capacity and refuses the next one"

  - name: compatibility_segregation
    trigger: "POST /tsdf/containers"
    algorithm_type: constraint_propagation
    inputs:
      - "WasteProfile.compatibility_class of the incoming container's manifest line"
      - "StorageUnit.allowed_compatibility_classes"
      - "compatibility_class of every non-VOIDED, non-EMPTIED container already in the unit"
    constants:
      INCOMPATIBLE_CLASS_PAIRS:
        - [ACID, ALKALINE]
        - [ACID, CYANIDE_BEARING]
        - [ACID, WATER_REACTIVE]
        - [OXIDIZER, ORGANIC_SOLVENT]
        - [OXIDIZER, WATER_REACTIVE]
        - [WATER_REACTIVE, ALKALINE]
    formula: |
      A placement is permitted only when BOTH hold:
        (i)  candidate.compatibility_class IN StorageUnit.allowed_compatibility_classes
        (ii) for every resident container R with custody_state NOT IN {VOIDED, EMPTIED}:
             {candidate.compatibility_class, R.compatibility_class} is NOT a member of
             INCOMPATIBLE_CLASS_PAIRS (the table is symmetric; a class is never
             incompatible with itself)
      Violation of either clause -> ERR_INCOMPATIBLE_SEGREGATION (validation priority 17).
      Pairs absent from the table are compatible, so e.g. ORGANIC_SOLVENT and ACID may share
      a unit even though neither may share one with OXIDIZER or ALKALINE respectively.
    precision: "n/a — set membership only"
    edge_cases:
      - "Two containers of the SAME class always co-locate: a class is not incompatible with itself"
      - "A resident VOIDED or EMPTIED container is ignored, so an ACID drum may follow a voided WATER_REACTIVE drum in the same unit"
      - "Clause (i) is checked first: a class outside allowed_compatibility_classes is refused even in an empty unit"

  - name: storage_unit_posture
    trigger: "Recomputed on every read of a StorageUnit and after any change to its containers, batches, inspections or repair orders"
    algorithm_type: constraint_propagation
    inputs:
      - "StorageUnit.status, .utilization_pct"
      - "Container rows in the unit (compliance_state)"
      - "EmissionRepairOrder rows on the unit (status, is_overdue)"
    constants: { RESTRICTED_UTILIZATION_THRESHOLD: 0.90 }
    formula: |
      posture = CLOSED      if status IN {CLOSING, CLOSED}
              = SUSPENDED   else if any Container in the unit has compliance_state == CONDEMNED
                                 OR any EmissionRepairOrder on the unit has is_overdue == true
              = RESTRICTED  else if any Container in the unit has compliance_state == DEFICIENT
                                 OR utilization_pct >= RESTRICTED_UTILIZATION_THRESHOLD
              = OPEN        otherwise
      inspection_overdue deliberately does NOT enter posture: lateness of inspection is enforced
      by validation priority 23 (ERR_INSPECTION_OVERDUE) at treatment START. Folding it into
      posture would make priority 10 (ERR_UNIT_POSTURE_BLOCKED) mask priority 23 on every START
      and leave ERR_INSPECTION_OVERDUE untriggerable.
      Gates: container placement requires posture == OPEN or RESTRICTED and refuses SUSPENDED/CLOSED;
             treatment batch creation and START require posture == OPEN.
    precision: "utilization_pct to 4 decimals"
    edge_cases:
      - "utilization_pct exactly 0.9000 -> RESTRICTED (inclusive)"
      - "A CONDEMNED container outranks every RESTRICTED reason, so posture is SUSPENDED even on a lightly loaded unit"
      - "A unit whose last_inspection_at is older than inspection_frequency_days still reads posture OPEN: inspection_overdue is enforced at treatment START by validation priority 23, not by posture"
      - "status CLOSING outranks everything else, so a unit being closed reads CLOSED-posture while still holding containers"

  - name: ldr_treatment_standard
    trigger: "POST /tsdf/treatment-batches/{id}/ldr-verification"
    algorithm_type: threshold
    inputs: ["TreatmentBatch.verification_sample_ppm", "TreatmentBatch.residue_flash_point_c", "the batch's dominant LDR family"]
    constants:
      UNIVERSAL_TREATMENT_STANDARD_PPM: { D008_LEAD: 750, F001_SOLVENTS: 560 }
      D001_MIN_RESIDUE_FLASH_POINT_C: 60.0
    formula: |
      ldr_family = ldr_subcategory of the WasteProfile of the staged container with the greatest
                   net_weight_kg (same selector as dominant_compatibility_class, same tie-break)
      if ldr_family == NONE:            ldr_standard_ppm = null; ldr_result = PASS
      elif ldr_family == D001_IGNITABLE: ldr_standard_ppm = null
                                         ldr_result = PASS if residue_flash_point_c >= D001_MIN_RESIDUE_FLASH_POINT_C else FAIL
      else:                              ldr_standard_ppm = UNIVERSAL_TREATMENT_STANDARD_PPM[ldr_family]
                                         ldr_result = PASS if verification_sample_ppm <= ldr_standard_ppm else FAIL
      PASS -> batch VERIFIED. FAIL -> batch LDR_FAILED; its containers may not be EMPTIED
      (ERR_LDR_STANDARD_NOT_MET) until a RETREAT_RESET and a passing verification.
    precision: "ppm to 1 decimal; flash point to 1 decimal"
    edge_cases:
      - "D008_LEAD with verification_sample_ppm exactly 750.0 -> PASS (the standard is inclusive)"
      - "D008_LEAD with 750.1 -> FAIL"
      - "D001_IGNITABLE with residue_flash_point_c exactly 60.0 -> PASS; 59.9 -> FAIL"

  - name: air_emission_leak_evaluation
    trigger: "POST /tsdf/inspection-events (inspection_type == AIR_MONITORING or a leak finding_code) and every POST /tsdf/emission-repair-orders/{id}/actions"
    algorithm_type: threshold
    inputs: ["InspectionEvent.measured_organic_vapor_ppm", "StorageUnit.air_emission_control_level", "EmissionRepairOrder timestamps"]
    constants:
      LEAK_DEFINITION_PPM: { LEVEL_1: 500, LEVEL_2: 250, LEVEL_3: 100 }
      FIRST_ATTEMPT_DAYS: 5
      REPAIR_DAYS: 15
      MAX_DELAY_DAYS: 180
      ALLOWED_DELAY_JUSTIFICATIONS: [UNIT_SHUTDOWN_REQUIRED, PART_UNAVAILABLE]
    formula: |
      leak_definition_ppm = LEAK_DEFINITION_PPM[unit.air_emission_control_level]
      leak_detected = (measured_organic_vapor_ppm >= leak_definition_ppm)      # detection is inclusive
                      OR finding_code IN {CONTAINER_LEAK, TANK_SHELL_CORROSION}
      On leak_detected an EmissionRepairOrder is auto-created with
        detected_at           = inspected_at
        first_attempt_due_at  = detected_at + FIRST_ATTEMPT_DAYS days
        repair_due_at         = detected_at + REPAIR_DAYS days
        leak_type             = CONTAINER_LEAK when container_id is present else TANK_LEAK
      Closure requires monitored_ppm < leak_definition_ppm (STRICTLY less), so a reading
      exactly at the leak definition both opens an order and refuses to close it.
      A delay of repair requires justification_code IN ALLOWED_DELAY_JUSTIFICATIONS and
      delayed_due_at <= detected_at + MAX_DELAY_DAYS days.
    precision: "ppm to 1 decimal"
    edge_cases:
      - "LEVEL_2 unit, reading exactly 250.0 -> leak_detected true, order created; a closure attempt at 250.0 -> ERR_LEAK_PERSISTS; 249.9 closes it"
      - "LEVEL_3 unit, reading 100.0 -> leak; 99.9 -> no leak and no order"

  - name: treatment_window_conflict
    trigger: "POST /tsdf/treatment-batches"
    algorithm_type: interval_merge
    inputs: ["window_start / window_end of the candidate batch", "existing TreatmentBatch rows with status IN {PLANNED, HELD, IN_TREATMENT, TREATED, LDR_FAILED}"]
    constants:
      DECONTAMINATION_BUFFER_MINUTES: 240
    formula: |
      Check A — unit-level pairwise, HALF-OPEN intervals [window_start, window_end):
        For each existing non-terminal batch B on the same storage_unit_id:
          effective_end(B) = B.window_end + (DECONTAMINATION_BUFFER_MINUTES minutes
                             if B.dominant_compatibility_class != candidate.dominant_compatibility_class
                             else 0 minutes)
            The buffer models the decontamination a unit needs between runs of DIFFERENT
            compatibility classes. It is keyed on class INEQUALITY, not on the
            INCOMPATIBLE_CLASS_PAIRS table of `compatibility_segregation`: two batches whose
            classes form an incompatible pair could never share a unit in the first place,
            because validation priority 17 refuses to co-locate their containers.
          conflict when candidate.window_start < effective_end(B)
                    AND B.window_start        < candidate.window_end
        Any conflict -> ERR_TREATMENT_WINDOW_CONFLICT.
      Check B — facility-level aggregate, CLOSED intervals [window_start, window_end]:
        overlapping = count of non-terminal batches B with facility_id == candidate.facility_id and
                      B.window_start <= candidate.window_end AND candidate.window_start <= B.window_end
        overlapping >= Facility.max_concurrent_treatment_batches -> ERR_FACILITY_CONCURRENCY_EXCEEDED.
      Check A runs before check B (validation priorities 27 then 28).
    precision: "Whole minutes"
    edge_cases:
      - "Same unit, SAME dominant class, candidate.window_start == existing.window_end: no conflict, because check A is half-open and no buffer applies"
      - "Same unit, DIFFERENT dominant classes, candidate.window_start == existing.window_end + 180 minutes: conflict, because the 240-minute decontamination buffer still covers it"
      - "Different units, max_concurrent_treatment_batches == 1, candidate.window_start == existing.window_end: check A does not apply and check B DOES count the touching endpoint -> ERR_FACILITY_CONCURRENCY_EXCEEDED"

  - name: facility_mass_ledger
    trigger: "Recomputed on every read of a Facility"
    algorithm_type: aggregation
    inputs: ["ManifestLine rows of the facility", "StorageUnit.stored_kg", "TreatmentBatch residue figures"]
    constants: {}
    formula: |
      received_mass_kg       = sum(ManifestLine.received_quantity_kg) over lines of manifests with
                               status IN {DISCREPANT, VERIFIED, CERTIFIED, REJECTED_RETURNED}
      held_mass_kg           = sum(StorageUnit.stored_kg)
      unallocated_receipt_kg = sum(accepted_quantity_kg - allocated_container_mass_kg) over those lines
      returned_mass_kg       = sum(ManifestLine.returned_quantity_kg)
      treated_residue_kg     = sum(TreatmentBatch.residue_mass_kg) over batches IN {TREATED, LDR_FAILED, VERIFIED}
      destroyed_mass_kg      = sum(input_mass_kg - residue_mass_kg) over those same batches
      mass_ledger_kg         = held_mass_kg + unallocated_receipt_kg + returned_mass_kg
                               + treated_residue_kg + destroyed_mass_kg
      INVARIANT: mass_ledger_kg == received_mass_kg after every operation, with no rounding drift.
    precision: "3 decimals on every component"
    edge_cases:
      - "Creating a container moves mass from unallocated_receipt_kg to held_mass_kg; voiding it moves the identical figure back and mass_ledger_kg never changes"
      - "Completing a batch splits input_mass_kg into treated_residue_kg and destroyed_mass_kg; the sum is unchanged"
      - "REJECT_RETURN moves accepted mass into returned_mass_kg while voiding the containers, so held_mass_kg and unallocated_receipt_kg both fall"

  - name: corrective_action_status
    trigger: "Recomputed on every read of a Facility"
    algorithm_type: projection
    inputs: ["ComplianceFinding rows of the facility"]
    constants: {}
    formula: |
      corrective_action_status = NONE        if the facility has no ComplianceFinding rows
                              = OPEN        else if any finding has status IN {OPEN, REOPENED}
                              = IN_PROGRESS else if any finding has status == RESPONDED
                              = COMPLETED   otherwise (every finding CLOSED)
      open_snc_finding_count  = count(findings with finding_class == SNC AND status IN {OPEN, RESPONDED, REOPENED})
    precision: "n/a"
    edge_cases:
      - "A finding that is REOPENED after being CLOSED pulls the facility back from COMPLETED to OPEN and re-adds its SNC reserve"

  - name: biennial_report_totals
    trigger: "GET /tsdf/facilities/{id}/biennial-report"
    algorithm_type: chronological
    inputs: ["report_year query parameter", "Manifest / ManifestLine / TreatmentBatch rows of the facility"]
    constants: {}
    formula: |
      in_scope_manifests = manifests of the facility with arrived_at != null whose arrived_at falls in
                           the calendar year report_year (UTC), ordered arrived_at ASC then created_at ASC
      manifest_count       = count(in_scope_manifests)
      generator_count      = count(distinct generator_id over in_scope_manifests)
      total_received_kg    = sum(ManifestLine.received_quantity_kg) over their lines
      total_accepted_kg    = sum(ManifestLine.accepted_quantity_kg) over their lines
      total_returned_kg    = sum(ManifestLine.returned_quantity_kg) over their lines
      total_residue_kg     = sum(TreatmentBatch.residue_mass_kg) over batches of the facility with
                             status IN {TREATED, LDR_FAILED, VERIFIED} whose window_start falls in report_year
      waste_code_totals    = map waste_code -> summed received_quantity_kg, keys sorted ascending,
                             a line contributing its full quantity to each of its profile's waste_codes
    precision: "3 decimals on masses"
    edge_cases:
      - "A manifest still EN_ROUTE (arrived_at null) is excluded regardless of shipped_on"
      - "A manifest that arrived on 31 December of report_year is included; one that arrived on 1 January of the following year is not"
      - "Manifests created out of chronological order still report in arrived_at order"

# =============================================================================
# §1.4 Validation Rules (evaluated in ascending priority; the FIRST violated rule wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    rule: "X-User-ID and X-User-Role headers are present and well formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "every endpoint except POST /_clock/set_current_utc"
  - priority: 2
    category: auth
    rule: "X-User-Role is one of the seven declared roles AND appears in the endpoint's allowed roles"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "every endpoint"
  - priority: 3
    category: auth
    rule: "A caller with role Generator may only address rows whose generator_id equals X-User-ID (WasteProfile, Manifest and their sub-resources)"
    error_id: ERR_GENERATOR_SCOPE_VIOLATION
    http_status: 403
    applies_to: "every endpoint reachable by Generator"
  - priority: 4
    category: schema
    rule: "Request body and query parameters are well formed: required fields present, types correct, enums in range, numeric constraints satisfied, window_end > window_start, accepted_quantity_kg <= received_quantity_kg, unknown fields rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "every write endpoint and every list endpoint with query parameters"
  - priority: 5
    category: existence
    rule: "The {id} addressed in the path exists"
    error_id: "the entity's specific NOT_FOUND error (ERR_FACILITY_NOT_FOUND, ERR_GENERATOR_NOT_FOUND, ERR_WASTE_PROFILE_NOT_FOUND, ERR_MANIFEST_NOT_FOUND, ERR_STORAGE_UNIT_NOT_FOUND, ERR_CONTAINER_NOT_FOUND, ERR_TREATMENT_BATCH_NOT_FOUND, ERR_RESOURCE_NOT_FOUND)"
    http_status: 404
    applies_to: "every endpoint with a path parameter"
  - priority: 6
    category: existence
    rule: "Every foreign key in the request body resolves to an existing row"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "every write endpoint carrying a foreign key"
  - priority: 7
    category: concurrency
    rule: "expected_<parent>_version equals the parent's current version (see §1.2.1)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /tsdf/financial-assurance-instruments, POST /tsdf/waste-profiles/{id}/samples"
  - priority: 8
    category: integrity
    rule: "All referenced rows belong to the same facility: a Container's storage_unit_id and its manifest line's manifest.facility_id agree; a TreatmentBatch's storage_unit_id belongs to its facility_id; a ManifestLine's profile facility_id equals the manifest's facility_id; a ComplianceFinding's storage_unit_id belongs to its facility_id"
    error_id: ERR_FACILITY_SCOPE_MISMATCH
    http_status: 409
    applies_to: "POST /tsdf/containers, POST /tsdf/treatment-batches, POST /tsdf/manifests, POST /tsdf/compliance-findings"
  - priority: 9
    category: state
    rule: "The target entity is in a state from which the requested transition or write is defined (§1.2), including terminal-state lockdown, retreat_count <= 1, reopen_count <= 2 and container_count == 0 before CLOSED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint and every write against a child of a terminal parent"
  - priority: 10
    category: state
    rule: "The target StorageUnit.posture permits the operation: placement requires OPEN or RESTRICTED, treatment creation and START require OPEN"
    error_id: ERR_UNIT_POSTURE_BLOCKED
    http_status: 409
    applies_to: "POST /tsdf/containers, POST /tsdf/treatment-batches, POST /tsdf/treatment-batches/{id}/operations"
  - priority: 11
    category: business_safety
    rule: "Facility.permit_status IN {ACTIVE, RENEWAL_PENDING} for waste acceptance and treatment"
    error_id: ERR_PERMIT_NOT_ACTIVE
    http_status: 403
    applies_to: "POST /tsdf/manifests/{id}/receive, POST /tsdf/treatment-batches, POST /tsdf/treatment-batches/{id}/operations"
  - priority: 12
    category: business_safety
    rule: "The Generator on the operation's path is not SUSPENDED or TERMINATED"
    error_id: ERR_GENERATOR_SUSPENDED
    http_status: 409
    applies_to: "POST /tsdf/waste-profiles/{id}/submit, POST /tsdf/waste-profiles/{id}/decision, POST /tsdf/manifests"
  - priority: 13
    category: authorization_sod
    rule: "The acting X-User-ID is not the user who performed the incompatible prior step: the chemist who recorded the latest ProfileSample may not sign that profile's decision, and the operator who completed a TreatmentBatch may not sign its LDR verification"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /tsdf/waste-profiles/{id}/decision, POST /tsdf/treatment-batches/{id}/ldr-verification"
  - priority: 14
    category: business_safety
    rule: "The WasteProfile of a manifest line or container has status IN {APPROVED, EXPIRED}: a profile that never reached approval, or that was suspended or rejected, is refused here. A merely lapsed recertification is deliberately NOT this rule's business — it carries status EXPIRED and is reported one rung lower by priority 15, so that ERR_PROFILE_EXPIRED is reachable instead of being masked by this rule"
    error_id: ERR_PROFILE_NOT_APPROVED
    http_status: 409
    applies_to: "POST /tsdf/manifests, POST /tsdf/containers"
  - priority: 15
    category: business_safety
    rule: "The WasteProfile's recertification_due_at has not passed the logical clock"
    error_id: ERR_PROFILE_EXPIRED
    http_status: 409
    applies_to: "POST /tsdf/manifests, POST /tsdf/containers"
  - priority: 16
    category: business_constraint
    rule: "A ProfileSample may only be recorded while the profile is SUBMITTED and sample_attempt_count < 3 (ERR_SAMPLE_LIMIT_EXCEEDED, 409); at manifest receipt every received line's WasteProfile must still be APPROVED, because a suspension or expiry after shipment fails the acceptance criteria (ERR_ACCEPTANCE_CRITERIA_FAILED, 422)"
    error_id: ERR_SAMPLE_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /tsdf/waste-profiles/{id}/samples, POST /tsdf/manifests/{id}/receive"
  - priority: 17
    category: business_safety
    rule: "A container's compatibility_class satisfies `compatibility_segregation`: it is in the unit's allowed_compatibility_classes AND forms no INCOMPATIBLE_CLASS_PAIRS pair with any non-VOIDED, non-EMPTIED container already in that unit"
    error_id: ERR_INCOMPATIBLE_SEGREGATION
    http_status: 409
    applies_to: "POST /tsdf/containers"
  - priority: 18
    category: business_constraint
    rule: "label_waste_codes equals the profile's waste_codes as a set (ERR_LABEL_CODE_MISMATCH) and label_hazard_class is non-empty with label_accumulation_start_marked true before SEALED (ERR_LABEL_INCOMPLETE)"
    error_id: ERR_LABEL_CODE_MISMATCH
    http_status: 422
    applies_to: "POST /tsdf/containers, POST /tsdf/containers/{id}/custody-state"
  - priority: 19
    category: business_constraint
    rule: "net_weight_kg <= capacity_kg * 0.95 (headspace rule)"
    error_id: ERR_CONTAINER_OVERFILLED
    http_status: 422
    applies_to: "POST /tsdf/containers"
  - priority: 20
    category: business_safety
    rule: "The requested or approved treatment method is in Facility.permitted_methods"
    error_id: ERR_METHOD_NOT_PERMITTED
    http_status: 403
    applies_to: "POST /tsdf/waste-profiles/{id}/decision, POST /tsdf/treatment-batches, POST /tsdf/treatment-batches/{id}/operations"
  - priority: 21
    category: business_safety
    rule: "Residue from a batch whose ldr_result == FAIL may not leave storage"
    error_id: ERR_LDR_STANDARD_NOT_MET
    http_status: 409
    applies_to: "POST /tsdf/containers/{id}/custody-state (to_custody_state == EMPTIED)"
  - priority: 22
    category: business_temporal
    rule: "No container in a TEN_DAY_TRANSFER unit has accumulation_days > 10 when staging, treating or adding to that unit"
    error_id: ERR_TEN_DAY_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /tsdf/containers, POST /tsdf/treatment-batches"
  - priority: 23
    category: business_temporal
    rule: "The StorageUnit is not inspection_overdue when treatment starts"
    error_id: ERR_INSPECTION_OVERDUE
    http_status: 409
    applies_to: "POST /tsdf/treatment-batches/{id}/operations (action == START)"
  - priority: 24
    category: business_temporal
    rule: "Repair actions respect their deadlines: a FIRST_ATTEMPT after first_attempt_due_at or any attempt while is_overdue is refused (ERR_REPAIR_ATTEMPT_LATE); closure requires monitored_ppm strictly below leak_definition_ppm (ERR_LEAK_PERSISTS); a delay needs an allowed justification within 180 days of detection (ERR_DELAY_JUSTIFICATION_INVALID)"
    error_id: ERR_REPAIR_ATTEMPT_LATE
    http_status: 409
    applies_to: "POST /tsdf/emission-repair-orders/{id}/actions"
  - priority: 25
    category: business_temporal
    rule: "A discrepancy is resolved on or before discrepancy_report_due_at, and certification requires the exception report to have been filed"
    error_id: ERR_DISCREPANCY_REPORT_OVERDUE
    http_status: 409
    applies_to: "POST /tsdf/manifests/{id}/discrepancy-resolution, POST /tsdf/manifests/{id}/certify"
  - priority: 26
    category: business_temporal
    rule: "The facility has no SNC ComplianceFinding whose corrective action is overdue when a permit renewal is filed"
    error_id: ERR_CORRECTIVE_ACTION_OVERDUE
    http_status: 409
    applies_to: "POST /tsdf/facilities/{id}/permit-renewal-request"
  - priority: 27
    category: business_temporal
    rule: "Unit-level pairwise window check (half-open, with the 240-minute decontamination buffer appended when the two batches' dominant_compatibility_class values differ) finds no conflict"
    error_id: ERR_TREATMENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /tsdf/treatment-batches"
  - priority: 28
    category: business_constraint
    rule: "Facility-level aggregate window check (closed intervals) counts fewer than max_concurrent_treatment_batches overlapping non-terminal batches"
    error_id: ERR_FACILITY_CONCURRENCY_EXCEEDED
    http_status: 409
    applies_to: "POST /tsdf/treatment-batches"
  - priority: 29
    category: business_constraint
    rule: "The effective aisle width with the new container included stays at or above 76 cm"
    error_id: ERR_AISLE_CLEARANCE_VIOLATION
    http_status: 409
    applies_to: "POST /tsdf/containers"
  - priority: 30
    category: business_constraint
    rule: "manifest_tracking_number is unique across Manifest; epa_id is unique across Facility and across Generator; unit_code is unique per facility_id"
    error_id: ERR_DUPLICATE_MANIFEST_NUMBER
    http_status: 409
    applies_to: "POST /tsdf/manifests, POST /tsdf/facilities, POST /tsdf/generators, POST /tsdf/storage-units"
  - priority: 31
    category: business_constraint
    rule: "A container may not draw more mass from its line than remains: net_weight_kg <= accepted_quantity_kg - allocated_container_mass_kg"
    error_id: ERR_LINE_MASS_OVER_ALLOCATED
    http_status: 422
    applies_to: "POST /tsdf/containers"
  - priority: 32
    category: business_constraint
    rule: "residue_mass_kg <= input_mass_kg at batch completion"
    error_id: ERR_MASS_BALANCE_INVALID
    http_status: 422
    applies_to: "POST /tsdf/treatment-batches/{id}/operations (action == COMPLETE)"
  - priority: 33
    category: business_constraint
    rule: "inspection_frequency_days respects the unit type ceiling (<= 7 for CONTAINER_AREA and TEN_DAY_TRANSFER, <= 1 for TANK_SYSTEM)"
    error_id: ERR_INSPECTION_FREQUENCY_INVALID
    http_status: 422
    applies_to: "POST /tsdf/storage-units"
  - priority: 34
    category: business_constraint
    rule: "stored_kg + reserved_kg including the new container or batch stays at or below permitted_capacity_kg"
    error_id: ERR_STORAGE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /tsdf/containers, POST /tsdf/treatment-batches"
  - priority: 35
    category: business_fiscal
    rule: "The facility's assurance_shortfall_cents is 0 before waste acceptance, container placement, permit renewal filing or instrument cancellation"
    error_id: ERR_FINANCIAL_ASSURANCE_SHORTFALL
    http_status: 402
    applies_to: "POST /tsdf/manifests/{id}/receive, POST /tsdf/containers, POST /tsdf/facilities/{id}/permit-renewal-request, POST /tsdf/financial-assurance-instruments/{id}/cancel"

# =============================================================================
# §1.5 Endpoint Table
#
# Every addressed resource id is the literal placeholder `{id}`. Every list
# endpoint accepts `limit?` / `offset?` and returns the paginated envelope.
# =============================================================================
endpoints:
  # --- logical clock (mandatory test-driving endpoint) ---------------------
  - method: POST
    path: /_clock/set_current_utc
    roles: [PlatformAdmin, ComplianceManager, ReceivingClerk, WasteApprovalChemist, TreatmentOperator, RegulatoryInspector, Generator]
    input: [current_utc]
    output: "{ current_utc: datetime }"
    description: |
      Sets the logical clock every derived field and deadline is evaluated against.
      The clock starts at 2026-08-01T00:00:00Z on server startup. Time never advances
      on its own: accumulation_days, inspection_overdue, is_overdue, permit expiry and
      profile recertification all move only when this endpoint is called.
    side_effects: ["No stored row is mutated; all clock-derived fields are recomputed on the next read"]

  # --- Facility ------------------------------------------------------------
  - method: POST
    path: /tsdf/facilities
    roles: [PlatformAdmin]
    input: [name, epa_id, permit_number, permit_expires_at, permitted_methods, max_concurrent_treatment_batches, post_closure_cost_cents]
    output: Facility
    side_effects: ["permit_status = ACTIVE; all derived assurance and mass figures computed from an empty inventory"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_DUPLICATE_MANIFEST_NUMBER]
  - method: GET
    path: /tsdf/facilities/{id}
    roles: [PlatformAdmin, ComplianceManager, ReceivingClerk, WasteApprovalChemist, TreatmentOperator, RegulatoryInspector]
    input: []
    output: Facility
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_FACILITY_NOT_FOUND]
  - method: GET
    path: /tsdf/facilities
    roles: [PlatformAdmin, ComplianceManager, ReceivingClerk, WasteApprovalChemist, TreatmentOperator, RegulatoryInspector]
    input: ["permit_status?", "epa_id?", "limit?", "offset?"]
    output: "Facility[]"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]
  - method: POST
    path: /tsdf/facilities/{id}/permit-renewal-request
    roles: [ComplianceManager]
    input: [requested_permit_expires_at]
    output: Facility
    side_effects: ["ACTIVE|EXPIRED -> RENEWAL_PENDING; renewal_requested_at = current_utc"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_FACILITY_NOT_FOUND, ERR_INVALID_STATE, ERR_CORRECTIVE_ACTION_OVERDUE, ERR_FINANCIAL_ASSURANCE_SHORTFALL]
  - method: POST
    path: /tsdf/facilities/{id}/permit-decision
    roles: [RegulatoryInspector]
    input: [decision, "new_permit_expires_at?", "reason_code?"]
    output: Facility
    side_effects: ["GRANT -> ACTIVE with the new expiry; DENY -> EXPIRED; TERMINATE -> TERMINATED and every ACTIVE storage unit moves to CLOSING"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_FACILITY_NOT_FOUND, ERR_INVALID_STATE]
  - method: GET
    path: /tsdf/facilities/{id}/financial-assurance-summary
    roles: [PlatformAdmin, ComplianceManager, RegulatoryInspector]
    input: []
    output: Facility
    description: "Computed read: the facility projection with closure_base_cost_cents, assurance_tier, closure_cost_estimate_cents, corrective_action_reserve_cents, active_treatment_liability_cents, required_assurance_cents, posted_assurance_cents and assurance_shortfall_cents recomputed at the current clock"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_FACILITY_NOT_FOUND]
  - method: GET
    path: /tsdf/facilities/{id}/biennial-report
    roles: [PlatformAdmin, ComplianceManager, RegulatoryInspector]
    input: [report_year]
    output: "{ facility_id: string, report_year: integer, manifest_count: integer, generator_count: integer, total_received_kg: number, total_accepted_kg: number, total_returned_kg: number, total_residue_kg: number, waste_code_totals: object }"
    description: "Computed read implementing calculations.biennial_report_totals"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_FACILITY_NOT_FOUND]

  # --- FinancialAssuranceInstrument ----------------------------------------
  - method: POST
    path: /tsdf/financial-assurance-instruments
    roles: [ComplianceManager]
    input: [facility_id, instrument_type, face_amount_cents, effective_on, expected_facility_version]
    output: FinancialAssuranceInstrument
    side_effects:
      - "status = ACTIVE; the facility's prior ACTIVE instrument -> SUPERSEDED with superseded_by_instrument_id set to the new row"
      - "Facility.version += 1; Facility.posted_assurance_cents and assurance_shortfall_cents recomputed"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_REFERENCE_NOT_FOUND, ERR_STALE_VERSION]
  - method: GET
    path: /tsdf/financial-assurance-instruments/{id}
    roles: [PlatformAdmin, ComplianceManager, RegulatoryInspector]
    input: []
    output: FinancialAssuranceInstrument
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_RESOURCE_NOT_FOUND]
  - method: GET
    path: /tsdf/financial-assurance-instruments
    roles: [PlatformAdmin, ComplianceManager, RegulatoryInspector]
    input: ["facility_id?", "superseded_by_instrument_id?", "status?", "limit?", "offset?"]
    output: "FinancialAssuranceInstrument[]"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]
  - method: POST
    path: /tsdf/financial-assurance-instruments/{id}/cancel
    roles: [ComplianceManager]
    input: ["reason_code?"]
    output: FinancialAssuranceInstrument
    side_effects: ["ACTIVE -> CANCELLED; Facility.posted_assurance_cents recomputed"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_RESOURCE_NOT_FOUND, ERR_INVALID_STATE, ERR_FINANCIAL_ASSURANCE_SHORTFALL]

  # --- Generator -----------------------------------------------------------
  - method: POST
    path: /tsdf/generators
    roles: [PlatformAdmin, ComplianceManager]
    input: [epa_id, name, generator_category, state_code]
    output: Generator
    side_effects: ["status = ACTIVE; both reliability scores start at 100 because no manifest is closed yet"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_DUPLICATE_MANIFEST_NUMBER]
  - method: GET
    path: /tsdf/generators/{id}
    roles: [PlatformAdmin, ComplianceManager, ReceivingClerk, WasteApprovalChemist, RegulatoryInspector, Generator]
    input: []
    output: Generator
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_GENERATOR_SCOPE_VIOLATION, ERR_GENERATOR_NOT_FOUND]
  - method: GET
    path: /tsdf/generators
    roles: [PlatformAdmin, ComplianceManager, ReceivingClerk, WasteApprovalChemist, RegulatoryInspector]
    input: ["status?", "epa_id?", "generator_category?", "limit?", "offset?"]
    output: "Generator[]"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]
  - method: POST
    path: /tsdf/generators/{id}/status
    roles: [ComplianceManager]
    input: [to_status, "reason_code?"]
    output: Generator
    side_effects: ["ACTIVE <-> SUSPENDED or -> TERMINATED per §1.2; suspension_reason_code stored"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_GENERATOR_NOT_FOUND, ERR_INVALID_STATE]
  - method: GET
    path: /tsdf/generators/{id}/reliability-score
    roles: [PlatformAdmin, ComplianceManager, WasteApprovalChemist, RegulatoryInspector, Generator]
    input: []
    output: Generator
    description: "Computed read: the generator projection with both variants of calculations.generator_reliability_score recomputed"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_GENERATOR_SCOPE_VIOLATION, ERR_GENERATOR_NOT_FOUND]

  # --- WasteProfile --------------------------------------------------------
  - method: POST
    path: /tsdf/waste-profiles
    roles: [Generator, ComplianceManager]
    input: [generator_id, facility_id, waste_codes, physical_form, compatibility_class, ldr_subcategory, declared_constituent_ppm, declared_flash_point_c, declared_ph, requested_treatment_method, "recertification_months?"]
    output: WasteProfile
    side_effects: ["status = DRAFT; waste_codes stored sorted ascending; recertification_months defaults to 12"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_GENERATOR_SCOPE_VIOLATION, ERR_INVALID_REQUEST, ERR_REFERENCE_NOT_FOUND]
  - method: GET
    path: /tsdf/waste-profiles/{id}
    roles: [PlatformAdmin, ComplianceManager, ReceivingClerk, WasteApprovalChemist, TreatmentOperator, RegulatoryInspector, Generator]
    input: []
    output: WasteProfile
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_GENERATOR_SCOPE_VIOLATION, ERR_WASTE_PROFILE_NOT_FOUND]
  - method: GET
    path: /tsdf/waste-profiles
    roles: [PlatformAdmin, ComplianceManager, ReceivingClerk, WasteApprovalChemist, TreatmentOperator, RegulatoryInspector, Generator]
    input: ["generator_id?", "facility_id?", "status?", "required_sample_type?", "limit?", "offset?"]
    output: "WasteProfile[]"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]
  - method: POST
    path: /tsdf/waste-profiles/{id}/submit
    roles: [Generator]
    input: ["revised_declared_constituent_ppm?", "revised_declared_flash_point_c?", "revised_declared_ph?"]
    output: WasteProfile
    side_effects: ["DRAFT|SAMPLE_FAILED|EXPIRED -> SUBMITTED; required_sample_type recomputed by calculations.required_sample_type; supplied revised_* values overwrite the declared_* fields"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_GENERATOR_SCOPE_VIOLATION, ERR_INVALID_REQUEST, ERR_WASTE_PROFILE_NOT_FOUND, ERR_INVALID_STATE, ERR_GENERATOR_SUSPENDED, ERR_SAMPLE_LIMIT_EXCEEDED]
  - method: POST
    path: /tsdf/waste-profiles/{id}/samples
    roles: [WasteApprovalChemist]
    input: [sample_type, measured_constituent_ppm, measured_flash_point_c, measured_ph, expected_waste_profile_version]
    output: ProfileSample
    side_effects:
      - "ProfileSample created with applied_tolerance_type = profile.required_sample_type, evaluated by calculations.sample_acceptance_evaluation"
      - "WasteProfile.sample_attempt_count += 1, latest_sample_result set, version += 1, status -> SAMPLE_PASSED | SAMPLE_FAILED | REJECTED"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_WASTE_PROFILE_NOT_FOUND, ERR_STALE_VERSION, ERR_INVALID_STATE, ERR_SAMPLE_LIMIT_EXCEEDED]
  - method: GET
    path: /tsdf/waste-profiles/{id}/samples
    roles: [PlatformAdmin, ComplianceManager, WasteApprovalChemist, RegulatoryInspector, Generator]
    input: ["limit?", "offset?"]
    output: "ProfileSample[]"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_GENERATOR_SCOPE_VIOLATION, ERR_WASTE_PROFILE_NOT_FOUND]
  - method: POST
    path: /tsdf/waste-profiles/{id}/decision
    roles: [WasteApprovalChemist]
    input: [decision, "approved_treatment_method?", "reason_code?"]
    output: WasteProfile
    side_effects: ["SAMPLE_PASSED -> APPROVED with approved_at / approved_by_user_id / recertification_due_at, or -> REJECTED"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_WASTE_PROFILE_NOT_FOUND, ERR_INVALID_STATE, ERR_GENERATOR_SUSPENDED, ERR_SEGREGATION_OF_DUTIES, ERR_METHOD_NOT_PERMITTED]
  - method: POST
    path: /tsdf/waste-profiles/{id}/status
    roles: [ComplianceManager]
    input: [to_status, "reason_code?"]
    output: WasteProfile
    side_effects: ["APPROVED <-> SUSPENDED; the suspension fires CASCADE-2 (containers DEFICIENT -> units RESTRICTED -> PLANNED batches HELD) and the reinstatement reverses it exactly"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_WASTE_PROFILE_NOT_FOUND, ERR_INVALID_STATE]
  - method: GET
    path: /tsdf/waste-profiles/{id}/manifest-lines
    roles: [PlatformAdmin, ComplianceManager, ReceivingClerk, RegulatoryInspector, Generator]
    input: ["line_status?", "limit?", "offset?"]
    output: "ManifestLine[]"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_GENERATOR_SCOPE_VIOLATION, ERR_WASTE_PROFILE_NOT_FOUND]

  # --- StorageUnit ---------------------------------------------------------
  - method: POST
    path: /tsdf/storage-units
    roles: [PlatformAdmin, ComplianceManager]
    input: [facility_id, unit_code, unit_type, permitted_capacity_kg, aisle_width_cm, aisle_free_container_capacity, inspection_frequency_days, allowed_compatibility_classes, air_emission_control_level, containment_volume_l]
    output: StorageUnit
    side_effects: ["status = ACTIVE; last_inspection_at = created_at; posture = OPEN"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_REFERENCE_NOT_FOUND, ERR_INSPECTION_FREQUENCY_INVALID, ERR_DUPLICATE_MANIFEST_NUMBER]
  - method: GET
    path: /tsdf/storage-units/{id}
    roles: [PlatformAdmin, ComplianceManager, ReceivingClerk, TreatmentOperator, RegulatoryInspector]
    input: []
    output: StorageUnit
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_STORAGE_UNIT_NOT_FOUND]
  - method: GET
    path: /tsdf/storage-units
    roles: [PlatformAdmin, ComplianceManager, ReceivingClerk, TreatmentOperator, RegulatoryInspector]
    input: ["facility_id?", "unit_type?", "status?", "posture?", "limit?", "offset?"]
    output: "StorageUnit[]"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]
  - method: POST
    path: /tsdf/storage-units/{id}/status
    roles: [ComplianceManager]
    input: [to_status, "closure_plan_ref?"]
    output: StorageUnit
    side_effects: ["ACTIVE <-> CLOSING -> CLOSED per §1.2; posture recomputed"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_STORAGE_UNIT_NOT_FOUND, ERR_INVALID_STATE]
  - method: GET
    path: /tsdf/storage-units/{id}/containers
    roles: [PlatformAdmin, ComplianceManager, ReceivingClerk, TreatmentOperator, RegulatoryInspector]
    input: ["custody_state?", "compliance_state?", "limit?", "offset?"]
    output: "Container[]"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_STORAGE_UNIT_NOT_FOUND]

  # --- Manifest / ManifestLine --------------------------------------------
  - method: POST
    path: /tsdf/manifests
    roles: [Generator, ReceivingClerk]
    input: [generator_id, facility_id, manifest_tracking_number, transporter_epa_id, shipped_on, lines]
    output: Manifest
    description: "`lines` is an ordered array of { waste_profile_id, declared_quantity_kg, declared_container_count, is_bulk }; line_number is assigned 1-based in request order"
    side_effects: ["status = EN_ROUTE; one ManifestLine per element of lines with line_status = DECLARED"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_GENERATOR_SCOPE_VIOLATION, ERR_INVALID_REQUEST, ERR_REFERENCE_NOT_FOUND, ERR_FACILITY_SCOPE_MISMATCH, ERR_GENERATOR_SUSPENDED, ERR_PROFILE_NOT_APPROVED, ERR_PROFILE_EXPIRED, ERR_DUPLICATE_MANIFEST_NUMBER]
  - method: GET
    path: /tsdf/manifests/{id}
    roles: [PlatformAdmin, ComplianceManager, ReceivingClerk, RegulatoryInspector, Generator]
    input: []
    output: Manifest
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_GENERATOR_SCOPE_VIOLATION, ERR_MANIFEST_NOT_FOUND]
  - method: GET
    path: /tsdf/manifests
    roles: [PlatformAdmin, ComplianceManager, ReceivingClerk, RegulatoryInspector, Generator]
    input: ["generator_id?", "facility_id?", "status?", "discrepancy_type?", "limit?", "offset?"]
    output: "Manifest[]"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]
  - method: GET
    path: /tsdf/manifests/{id}/lines
    roles: [PlatformAdmin, ComplianceManager, ReceivingClerk, TreatmentOperator, RegulatoryInspector, Generator]
    input: ["line_status?", "limit?", "offset?"]
    output: "ManifestLine[]"
    description: "Lines are always returned in line_number ASC order"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_GENERATOR_SCOPE_VIOLATION, ERR_MANIFEST_NOT_FOUND]
  - method: POST
    path: /tsdf/manifests/{id}/receive
    roles: [ReceivingClerk]
    input: [received_lines]
    output: Manifest
    description: "`received_lines` is an array of { line_number, received_quantity_kg, received_container_count }; a line_number beyond the declared lines is an undocumented receipt"
    side_effects:
      - "arrived_at = current_utc; lines updated and classified by calculations.discrepancy_classification"
      - "EN_ROUTE -> VERIFIED when discrepancy_type == NONE, otherwise -> DISCREPANT with discrepancy_report_due_at"
      - "provisional_charge_cents frozen from the PROVISIONAL variant and added to Generator.open_charge_cents"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_MANIFEST_NOT_FOUND, ERR_INVALID_STATE, ERR_PERMIT_NOT_ACTIVE, ERR_ACCEPTANCE_CRITERIA_FAILED, ERR_FINANCIAL_ASSURANCE_SHORTFALL]
  - method: POST
    path: /tsdf/manifests/{id}/discrepancy-resolution
    roles: [ComplianceManager]
    input: [resolution_type, "discrepancy_report_filed?", "adjusted_lines?", "rejected_line_numbers?"]
    output: Manifest
    description: "`adjusted_lines` is an array of { line_number, accepted_quantity_kg } used by ACCEPT_ADJUSTED; `rejected_line_numbers` is used by PARTIAL_REJECT"
    side_effects:
      - "ACCEPT_ADJUSTED / PARTIAL_REJECT -> VERIFIED with per-line accepted and returned quantities set"
      - "REJECT_RETURN -> REJECTED_RETURNED and fires CASCADE-3 (lines RETURNED -> containers VOIDED -> unit figures recomputed) plus the open->voided charge move"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_MANIFEST_NOT_FOUND, ERR_INVALID_STATE, ERR_DISCREPANCY_REPORT_OVERDUE]
  - method: POST
    path: /tsdf/manifests/{id}/certify
    roles: [ReceivingClerk]
    input: ["certifier_note?"]
    output: Manifest
    side_effects:
      - "VERIFIED -> CERTIFIED; final_charge_cents frozen from the FINAL variant"
      - "Generator.open_charge_cents, settled_charge_cents and charge_adjustment_cents reconciled"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_MANIFEST_NOT_FOUND, ERR_INVALID_STATE, ERR_DISCREPANCY_REPORT_OVERDUE]

  # --- Container -----------------------------------------------------------
  - method: POST
    path: /tsdf/containers
    roles: [ReceivingClerk]
    input: [manifest_line_id, storage_unit_id, container_type, capacity_kg, net_weight_kg, accumulation_start_date, label_waste_codes, label_hazard_class, label_accumulation_start_marked]
    output: Container
    side_effects:
      - "custody_state = FILLING, compliance_state = COMPLIANT; waste_profile_id copied from the manifest line"
      - "StorageUnit.container_count / stored_kg / utilization_pct / effective_aisle_width_cm / posture recomputed"
      - "Facility mass ledger shifts unallocated_receipt_kg into held_mass_kg; closure and assurance figures recomputed"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_REFERENCE_NOT_FOUND, ERR_FACILITY_SCOPE_MISMATCH, ERR_INVALID_STATE, ERR_UNIT_POSTURE_BLOCKED, ERR_PROFILE_NOT_APPROVED, ERR_PROFILE_EXPIRED, ERR_INCOMPATIBLE_SEGREGATION, ERR_LABEL_CODE_MISMATCH, ERR_LABEL_INCOMPLETE, ERR_CONTAINER_OVERFILLED, ERR_TEN_DAY_LIMIT_EXCEEDED, ERR_AISLE_CLEARANCE_VIOLATION, ERR_LINE_MASS_OVER_ALLOCATED, ERR_STORAGE_CAPACITY_EXCEEDED, ERR_FINANCIAL_ASSURANCE_SHORTFALL]
  - method: GET
    path: /tsdf/containers/{id}
    roles: [PlatformAdmin, ComplianceManager, ReceivingClerk, TreatmentOperator, RegulatoryInspector]
    input: []
    output: Container
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_CONTAINER_NOT_FOUND]
  - method: GET
    path: /tsdf/containers
    roles: [PlatformAdmin, ComplianceManager, ReceivingClerk, TreatmentOperator, RegulatoryInspector]
    input: ["manifest_line_id?", "waste_profile_id?", "storage_unit_id?", "treatment_batch_id?", "custody_state?", "compliance_state?", "limit?", "offset?"]
    output: "Container[]"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]
  - method: POST
    path: /tsdf/containers/{id}/custody-state
    roles: [ReceivingClerk, TreatmentOperator]
    input: [to_custody_state, "reason_code?"]
    output: Container
    side_effects: ["Custody dimension moves per §1.2 without touching compliance_state; unit and facility mass figures recomputed"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_CONTAINER_NOT_FOUND, ERR_INVALID_STATE, ERR_LABEL_INCOMPLETE, ERR_LDR_STANDARD_NOT_MET]
  - method: POST
    path: /tsdf/containers/{id}/compliance-state
    roles: [ComplianceManager]
    input: [to_compliance_state, "finding_code?"]
    output: Container
    side_effects: ["Compliance dimension moves per §1.2 without touching custody_state; CONDEMNED fires CASCADE-1 through the unit posture to PLANNED batches and the facility's assurance figures"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_CONTAINER_NOT_FOUND, ERR_INVALID_STATE]

  # --- TreatmentBatch ------------------------------------------------------
  - method: POST
    path: /tsdf/treatment-batches
    roles: [TreatmentOperator]
    input: [facility_id, storage_unit_id, treatment_method, container_ids, window_start, window_end]
    output: TreatmentBatch
    side_effects:
      - "status = PLANNED; input_mass_kg, dominant_compatibility_class and estimated_treatment_liability_cents frozen"
      - "Each listed container SEALED -> STAGED with treatment_batch_id set"
      - "StorageUnit.reserved_kg and Facility.active_treatment_liability_cents / required_assurance_cents rise"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_REFERENCE_NOT_FOUND, ERR_FACILITY_SCOPE_MISMATCH, ERR_INVALID_STATE, ERR_UNIT_POSTURE_BLOCKED, ERR_PERMIT_NOT_ACTIVE, ERR_METHOD_NOT_PERMITTED, ERR_TEN_DAY_LIMIT_EXCEEDED, ERR_TREATMENT_WINDOW_CONFLICT, ERR_FACILITY_CONCURRENCY_EXCEEDED, ERR_STORAGE_CAPACITY_EXCEEDED]
  - method: GET
    path: /tsdf/treatment-batches/{id}
    roles: [PlatformAdmin, ComplianceManager, TreatmentOperator, RegulatoryInspector]
    input: []
    output: TreatmentBatch
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_TREATMENT_BATCH_NOT_FOUND]
  - method: GET
    path: /tsdf/treatment-batches
    roles: [PlatformAdmin, ComplianceManager, TreatmentOperator, RegulatoryInspector]
    input: ["facility_id?", "storage_unit_id?", "status?", "ldr_result?", "limit?", "offset?"]
    output: "TreatmentBatch[]"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]
  - method: POST
    path: /tsdf/treatment-batches/{id}/operations
    roles: [TreatmentOperator]
    input: [action, "residue_mass_kg?", "residue_constituent_ppm?", "residue_flash_point_c?", "reason_code?"]
    output: TreatmentBatch
    description: "action IN {START, COMPLETE, ABORT, RETREAT_RESET}"
    side_effects:
      - "START: PLANNED -> IN_TREATMENT; COMPLETE: IN_TREATMENT -> TREATED with the residue figures and completed_by_user_id, splitting input_mass_kg into treated_residue_kg and destroyed_mass_kg"
      - "ABORT: -> ABORTED, staged containers return to SEALED and every reserved figure is released with no drift; RETREAT_RESET: LDR_FAILED -> PLANNED with retreat_count += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_TREATMENT_BATCH_NOT_FOUND, ERR_INVALID_STATE, ERR_UNIT_POSTURE_BLOCKED, ERR_PERMIT_NOT_ACTIVE, ERR_METHOD_NOT_PERMITTED, ERR_INSPECTION_OVERDUE, ERR_MASS_BALANCE_INVALID]
  - method: POST
    path: /tsdf/treatment-batches/{id}/ldr-verification
    roles: [ComplianceManager]
    input: ["verification_sample_ppm?", "verification_note?"]
    output: TreatmentBatch
    side_effects: ["TREATED -> VERIFIED (ldr_result = PASS) or -> LDR_FAILED (ldr_result = FAIL) per calculations.ldr_treatment_standard; a PASS releases reserved_kg and the treatment liability"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_TREATMENT_BATCH_NOT_FOUND, ERR_INVALID_STATE, ERR_SEGREGATION_OF_DUTIES]

  # --- InspectionEvent -----------------------------------------------------
  - method: POST
    path: /tsdf/inspection-events
    roles: [ComplianceManager, RegulatoryInspector]
    input: [storage_unit_id, inspection_type, finding_code, "container_id?", "measured_organic_vapor_ppm?", "measured_aisle_width_cm?"]
    output: InspectionEvent
    side_effects:
      - "inspected_at = current_utc; StorageUnit.last_inspection_at = inspected_at, clearing inspection_overdue"
      - "finding_code CONTAINER_LEAK fires CASCADE-1: the container is CONDEMNED, the unit posture becomes SUSPENDED, PLANNED batches on the unit become HELD and the facility's reserved figures fall"
      - "finding_code IN {LABEL_DEFICIENT, OVERFILL} marks the container DEFICIENT and the unit RESTRICTED"
      - "A leak by calculations.air_emission_leak_evaluation auto-creates an EmissionRepairOrder"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_REFERENCE_NOT_FOUND, ERR_STORAGE_UNIT_NOT_FOUND, ERR_INVALID_STATE]
  - method: GET
    path: /tsdf/inspection-events/{id}
    roles: [PlatformAdmin, ComplianceManager, TreatmentOperator, RegulatoryInspector]
    input: []
    output: InspectionEvent
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_RESOURCE_NOT_FOUND]
  - method: GET
    path: /tsdf/inspection-events
    roles: [PlatformAdmin, ComplianceManager, TreatmentOperator, RegulatoryInspector]
    input: ["storage_unit_id?", "container_id?", "inspection_type?", "finding_code?", "limit?", "offset?"]
    output: "InspectionEvent[]"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  # --- EmissionRepairOrder (created only by the inspection cascade) --------
  - method: GET
    path: /tsdf/emission-repair-orders/{id}
    roles: [PlatformAdmin, ComplianceManager, TreatmentOperator, RegulatoryInspector]
    input: []
    output: EmissionRepairOrder
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_RESOURCE_NOT_FOUND]
  - method: GET
    path: /tsdf/emission-repair-orders
    roles: [PlatformAdmin, ComplianceManager, TreatmentOperator, RegulatoryInspector]
    input: ["storage_unit_id?", "container_id?", "source_inspection_event_id?", "status?", "limit?", "offset?"]
    output: "EmissionRepairOrder[]"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]
  - method: POST
    path: /tsdf/emission-repair-orders/{id}/actions
    roles: [ComplianceManager, TreatmentOperator]
    input: [action, "monitored_ppm?", "justification_code?", "delayed_due_at?"]
    output: EmissionRepairOrder
    description: "action IN {FIRST_ATTEMPT, REPAIR_ATTEMPT, DELAY, CLOSE}"
    side_effects: ["Status moves per §1.2; CLOSE requires monitored_ppm strictly below leak_definition_ppm and lets the unit posture recover, which un-holds HELD batches"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_RESOURCE_NOT_FOUND, ERR_INVALID_STATE, ERR_REPAIR_ATTEMPT_LATE, ERR_LEAK_PERSISTS, ERR_DELAY_JUSTIFICATION_INVALID]

  # --- ComplianceFinding ---------------------------------------------------
  - method: POST
    path: /tsdf/compliance-findings
    roles: [RegulatoryInspector]
    input: [facility_id, finding_class, citation_code, corrective_action_due_at, "storage_unit_id?", "is_prior_release?"]
    output: ComplianceFinding
    side_effects: ["status = OPEN, cited_at = current_utc; an SNC finding raises Facility.open_snc_finding_count and corrective_action_reserve_cents by 5000000"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_REFERENCE_NOT_FOUND, ERR_FACILITY_SCOPE_MISMATCH]
  - method: GET
    path: /tsdf/compliance-findings/{id}
    roles: [PlatformAdmin, ComplianceManager, RegulatoryInspector]
    input: []
    output: ComplianceFinding
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_RESOURCE_NOT_FOUND]
  - method: GET
    path: /tsdf/compliance-findings
    roles: [PlatformAdmin, ComplianceManager, RegulatoryInspector]
    input: ["facility_id?", "storage_unit_id?", "finding_class?", "status?", "limit?", "offset?"]
    output: "ComplianceFinding[]"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]
  - method: POST
    path: /tsdf/compliance-findings/{id}/status
    roles: [ComplianceManager, RegulatoryInspector]
    input: [to_status, "corrective_action_completed_on?", "reason_code?"]
    output: ComplianceFinding
    side_effects: ["Status moves per §1.2; Facility.open_snc_finding_count, corrective_action_reserve_cents, corrective_action_status and required_assurance_cents recomputed"]
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_RESOURCE_NOT_FOUND, ERR_INVALID_STATE]

# =============================================================================
# §1.6 Error Catalog
# =============================================================================
