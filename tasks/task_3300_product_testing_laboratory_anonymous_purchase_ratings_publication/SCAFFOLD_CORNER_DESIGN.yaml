scaffold_corner_design:
  - section: entities
    instances:
      - name: category_create_success_and_defaults
        claim_type: creation_defaults
        grounds: [entities.ProductCategory]
        distinguishing_aspect: "POST /product-categories with all required fields -> 201; status defaults ACTIVE; selection_score computed with null last_published_at (urgency from cap 60)."
        test_recipe:
          setup: ["empty DB, default clock 2026-09-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /product-categories"
              payload: { name: "Vacuums", refresh_cycle_months: 24, market_share_pct: 50, member_interest_pct: 50 }
              as: LabManager
              captures: { cat_id: $.data.id, st: $.data.status, score: $.data.selection_score }
          assert:
            - "response status 201; status == ACTIVE"
            - "selection_score == 62.5 (urgency=100 from cap: 0.40*50+0.35*50+0.25*100)"
            - "last_published_at is null; version == 1"
      - name: category_duplicate_name_rejected
        claim_type: uniqueness
        grounds: ["validations[priority=17]", "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "Second category with identical name -> ERR_DUPLICATE 422."
        test_recipe:
          setup: ["one category named Vacuums"]
          setup_api_calls:
            - call: "POST /product-categories"
              payload: { name: "Vacuums", refresh_cycle_months: 24, market_share_pct: 50, member_interest_pct: 50 }
              as: LabManager
          trigger:
            - call: "POST /product-categories"
              payload: { name: "Vacuums", refresh_cycle_months: 12, market_share_pct: 10, member_interest_pct: 10 }
              as: LabManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE"
      - name: program_get_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /test-programs/{random uuid} -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /test-programs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: LabManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"
      - name: measurement_immutable_no_version
        claim_type: immutability
        grounds: [entities.Measurement]
        distinguishing_aspect: "Measurement has common_fields false: response carries id and created_at but no version/updated_at; no update endpoint exists."
        test_recipe:
          setup: ["sample IN_LAB (full pipeline to TESTING)"]
          setup_api_calls:
            - call: "POST /product-categories"
              payload: { name: "Washers", refresh_cycle_months: 24, market_share_pct: 50, member_interest_pct: 50 }
              as: LabManager
              captures: { cat_id: $.data.id, cat_v: $.data.version }
            - call: "POST /test-programs"
              payload: { category_id: "${cat_id}", fiscal_year: 2026, budget_cents: 500000 }
              as: LabManager
              as_user_id: "lm-1"
              captures: { prog_id: $.data.id }
            - call: "POST /lab-protocols"
              payload: { category_id: "${cat_id}", protocol_code: "WSH-01", measurement_repeat_min: 1, perf_weight_pct: 60, reliability_weight_pct: 30 }
              as: LabManager
              captures: { proto_id: $.data.id }
            - call: "POST /lab-protocols/${proto_id}/transitions"
              payload: { action: "submit_review" }
              as: LabManager
            - call: "POST /lab-protocols/${proto_id}/transitions"
              payload: { action: "activate", expected_category_version: "${cat_v}" }
              as: MethodologyOfficer
            - call: "POST /test-programs/${prog_id}/transitions"
              payload: { action: "approve" }
              as: EditorialDirector
              as_user_id: "ed-1"
            - call: "POST /test-samples"
              payload: { program_id: "${prog_id}", model_label: "WashA", required_units: 1 }
              as: LabManager
              captures: { samp_id: $.data.id }
            - call: "POST /test-programs/${prog_id}/transitions"
              payload: { action: "start_sourcing" }
              as: LabManager
            - call: "POST /purchase-orders"
              payload: { program_id: "${prog_id}", buyer_alias: "alias-1", retailer_name: "HomeDepot", receipt_doc_ref: "R1", shipping_cents: 0, lines: [ { sample_id: "${samp_id}", unit_price_cents: 50000, qty: 1, tax_rate_bp: 0 } ] }
              as: PurchasingAgent
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/transitions"
              payload: { action: "place" }
              as: PurchasingAgent
              as_user_id: "pa-1"
            - call: "POST /purchase-orders/${po_id}/transitions"
              payload: { action: "receive" }
              as: PurchasingAgent
              as_user_id: "pa-1"
            - call: "POST /test-programs/${prog_id}/transitions"
              payload: { action: "start_testing" }
              as: LabManager
          trigger:
            - call: "POST /measurements"
              payload: { sample_id: "${samp_id}", unit_index: 1, metric_code: "WASH", value_num: 90 }
              as: LabTechnician
              captures: { meas_id: $.data.id }
          assert:
            - "201 response has id and created_at; no version field present"
            - "sample tested_units == 1, testing_complete == true (repeat_min 1, required_units 1)"
      - name: member_create_duplicate_email
        claim_type: uniqueness
        grounds: [entities.Member, "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "Registering two members with the same email -> second call ERR_DUPLICATE."
        test_recipe:
          setup: ["member registered"]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "dup@x.com", full_name: "Dup" }
              as: Member
          trigger:
            - call: "POST /members"
              payload: { email: "dup@x.com", full_name: "Dup Two" }
              as: Member
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE"
  - section: state_machines
    instances:
      - name: protocol_terminal_retired_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.LabProtocol]
        distinguishing_aspect: "RETIRED protocol rejects every further action with ERR_INVALID_STATE."
        test_recipe:
          setup: ["protocol DRAFT retired"]
          setup_api_calls:
            - call: "POST /product-categories"
              payload: { name: "Dryers", refresh_cycle_months: 24, market_share_pct: 20, member_interest_pct: 20 }
              as: LabManager
              captures: { cat_id: $.data.id }
            - call: "POST /lab-protocols"
              payload: { category_id: "${cat_id}", protocol_code: "DRY-01", measurement_repeat_min: 1, perf_weight_pct: 50, reliability_weight_pct: 25 }
              as: LabManager
              captures: { proto_id: $.data.id }
            - call: "POST /lab-protocols/${proto_id}/transitions"
              payload: { action: "retire" }
              as: MethodologyOfficer
          trigger:
            - call: "POST /lab-protocols/${proto_id}/transitions"
              payload: { action: "submit_review" }
              as: LabManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE; protocol.status stays RETIRED"
      - name: publication_submit_from_approved_invalid
        claim_type: invalid_transition
        grounds: [state_machines.RatingPublication]
        distinguishing_aspect: "submit is valid only from DRAFT/REVISION_REQUESTED; from APPROVED -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["publication APPROVED (full pipeline with sample, publication submitted then approved)"]
          setup_api_calls:
            - call: "POST /product-categories"
              payload: { name: "Washers", refresh_cycle_months: 24, market_share_pct: 50, member_interest_pct: 50 }
              as: LabManager
              captures: { cat_id: $.data.id, cat_v: $.data.version }
            - call: "POST /test-programs"
              payload: { category_id: "${cat_id}", fiscal_year: 2026, budget_cents: 500000 }
              as: LabManager
              as_user_id: "lm-1"
              captures: { prog_id: $.data.id }
            - call: "POST /lab-protocols"
              payload: { category_id: "${cat_id}", protocol_code: "WSH-01", measurement_repeat_min: 1, perf_weight_pct: 60, reliability_weight_pct: 30 }
              as: LabManager
              captures: { proto_id: $.data.id }
            - call: "POST /lab-protocols/${proto_id}/transitions"
              payload: { action: "submit_review" }
              as: LabManager
            - call: "POST /lab-protocols/${proto_id}/transitions"
              payload: { action: "activate", expected_category_version: "${cat_v}" }
              as: MethodologyOfficer
            - call: "POST /test-programs/${prog_id}/transitions"
              payload: { action: "approve" }
              as: EditorialDirector
              as_user_id: "ed-1"
            - call: "POST /test-samples"
              payload: { program_id: "${prog_id}", model_label: "WashA", required_units: 1 }
              as: LabManager
              captures: { samp_id: $.data.id }
            - call: "POST /test-programs/${prog_id}/transitions"
              payload: { action: "start_sourcing" }
              as: LabManager
            - call: "POST /purchase-orders"
              payload: { program_id: "${prog_id}", buyer_alias: "alias-1", retailer_name: "HomeDepot", receipt_doc_ref: "R1", shipping_cents: 0, lines: [ { sample_id: "${samp_id}", unit_price_cents: 50000, qty: 1, tax_rate_bp: 0 } ] }
              as: PurchasingAgent
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/transitions"
              payload: { action: "place" }
              as: PurchasingAgent
              as_user_id: "pa-1"
            - call: "POST /purchase-orders/${po_id}/transitions"
              payload: { action: "receive" }
              as: PurchasingAgent
              as_user_id: "pa-1"
            - call: "POST /purchase-orders/${po_id}/transitions"
              payload: { action: "verify" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /test-programs/${prog_id}/transitions"
              payload: { action: "start_testing" }
              as: LabManager
            - call: "POST /measurements"
              payload: { sample_id: "${samp_id}", unit_index: 1, metric_code: "WASH", value_num: 90 }
              as: LabTechnician
            - call: "POST /test-programs/${prog_id}/transitions"
              payload: { action: "start_scoring" }
              as: LabManager
            - call: "POST /test-programs/${prog_id}/transitions"
              payload: { action: "ready" }
              as: LabManager
            - call: "POST /rating-publications"
              payload: { program_id: "${prog_id}", embargo_until: "2026-09-01T00:00:00Z", version_note: "v1" }
              as: ContentEditor
              captures: { pub_id: $.data.id }
            - call: "POST /rating-publications/${pub_id}/transitions"
              payload: { action: "add_rated_model", sample_id: "${samp_id}" }
              as: ContentEditor
            - call: "POST /rating-publications/${pub_id}/transitions"
              payload: { action: "submit" }
              as: ContentEditor
            - call: "GET /test-programs/${prog_id}"
              as: EditorialDirector
              captures: { prog_v: $.data.version }
            - call: "POST /rating-publications/${pub_id}/transitions"
              payload: { action: "approve", expected_program_version: "${prog_v}" }
              as: EditorialDirector
          trigger:
            - call: "POST /rating-publications/${pub_id}/transitions"
              payload: { action: "submit" }
              as: ContentEditor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (APPROVED is not a submit from-state)"
      - name: finding_close_open_tier1_invalid
        claim_type: precondition_enforcement
        grounds: [state_machines.SafetyFinding.OPEN_to_CLOSED]
        distinguishing_aspect: "close from OPEN requires escalation_tier == 0; a MAJOR finding (tier 1) in OPEN cannot be closed directly -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["program with sample; MAJOR finding created (tier 1)"]
          setup_api_calls:
            - call: "POST /product-categories"
              payload: { name: "Dryers", refresh_cycle_months: 24, market_share_pct: 20, member_interest_pct: 20 }
              as: LabManager
              captures: { cat_id: $.data.id }
            - call: "POST /test-programs"
              payload: { category_id: "${cat_id}", fiscal_year: 2026, budget_cents: 500000 }
              as: LabManager
              as_user_id: "lm-1"
              captures: { prog_id: $.data.id }
            - call: "POST /test-samples"
              payload: { program_id: "${prog_id}", model_label: "Dry1", required_units: 1 }
              as: LabManager
              captures: { samp_id: $.data.id }
            - call: "POST /safety-findings"
              payload: { program_id: "${prog_id}", sample_id: "${samp_id}", severity: "MAJOR", description_text: "door latch", hazard_flag: false }
              as: SafetyOfficer
              captures: { sf_id: $.data.id, tier: $.data.escalation_tier }
          trigger:
            - call: "POST /safety-findings/${sf_id}/transitions"
              payload: { action: "close" }
              as: SafetyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "escalation_tier == 1 at create"
            - "close from OPEN with tier 1 -> error_id == ERR_INVALID_STATE"
      - name: po_verify_requires_distinct_officer
        claim_type: side_effect_execution
        grounds: [state_machines.PurchaseOrder.RECEIVED_to_VERIFIED, "validations[priority=6]"]
        distinguishing_aspect: "verify sets verified_by_user_id; re-verify from VERIFIED rejected ERR_INVALID_STATE (terminal)."
        test_recipe:
          setup: ["PO RECEIVED"]
          setup_api_calls:
            - call: "POST /product-categories"
              payload: { name: "Mowers", refresh_cycle_months: 36, market_share_pct: 30, member_interest_pct: 30 }
              as: LabManager
              captures: { cat_id: $.data.id, cat_v: $.data.version }
            - call: "POST /test-programs"
              payload: { category_id: "${cat_id}", fiscal_year: 2026, budget_cents: 500000 }
              as: LabManager
              as_user_id: "lm-1"
              captures: { prog_id: $.data.id }
            - call: "POST /lab-protocols"
              payload: { category_id: "${cat_id}", protocol_code: "MOW-01", measurement_repeat_min: 1, perf_weight_pct: 40, reliability_weight_pct: 40 }
              as: LabManager
              captures: { proto_id: $.data.id }
            - call: "POST /lab-protocols/${proto_id}/transitions"
              payload: { action: "submit_review" }
              as: LabManager
            - call: "POST /lab-protocols/${proto_id}/transitions"
              payload: { action: "activate", expected_category_version: "${cat_v}" }
              as: MethodologyOfficer
            - call: "POST /test-programs/${prog_id}/transitions"
              payload: { action: "approve" }
              as: EditorialDirector
              as_user_id: "ed-1"
            - call: "POST /test-samples"
              payload: { program_id: "${prog_id}", model_label: "Mow1", required_units: 1 }
              as: LabManager
              captures: { samp_id: $.data.id }
            - call: "POST /test-programs/${prog_id}/transitions"
              payload: { action: "start_sourcing" }
              as: LabManager
            - call: "POST /purchase-orders"
              payload: { program_id: "${prog_id}", buyer_alias: "alias-a", retailer_name: "ToolMart", receipt_doc_ref: "RA", shipping_cents: 0, lines: [ { sample_id: "${samp_id}", unit_price_cents: 1000, qty: 1, tax_rate_bp: 0 } ] }
              as: PurchasingAgent
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/transitions"
              payload: { action: "place" }
              as: PurchasingAgent
              as_user_id: "pa-1"
            - call: "POST /purchase-orders/${po_id}/transitions"
              payload: { action: "receive" }
              as: PurchasingAgent
              as_user_id: "pa-1"
          trigger:
            - call: "POST /purchase-orders/${po_id}/transitions"
              payload: { action: "verify" }
              as: ComplianceOfficer
              as_user_id: "co-9"
              captures: { st: $.data.status, ver: $.data.verified_by_user_id }
            - call: "POST /purchase-orders/${po_id}/transitions"
              payload: { action: "verify" }
              as: ComplianceOfficer
              as_user_id: "co-10"
              captures: { err: $.data.error_id }
          assert:
            - "first verify: status == VERIFIED, verified_by_user_id == 'co-9'"
            - "second verify: error_id == ERR_INVALID_STATE (VERIFIED terminal)"
  - section: calculations
    instances:
      - name: selection_score_excludes_retired
        claim_type: input_set_filtering
        grounds: [calculations.selection_score]
        distinguishing_aspect: "POST /_cycle/run rescores only status != RETIRED categories; RETIRED category's selection_score untouched (cycle output categories_rescored counts only non-RETIRED)."
        test_recipe:
          setup: ["two categories; category B manually RETIRED is impossible via API (no status write endpoint) — use one ACTIVE category only and assert rescored == 1"]
          setup_api_calls:
            - call: "POST /product-categories"
              payload: { name: "Vacuums", refresh_cycle_months: 24, market_share_pct: 50, member_interest_pct: 50 }
              as: LabManager
              captures: { cat_id: $.data.id }
          trigger:
            - call: "POST /_cycle/run"
              payload: {}
              as: LabManager
              captures: { rescored: $.data.categories_rescored }
          assert:
            - "categories_rescored == 1 (only the ACTIVE category)"
      - name: grace_boundary_one_second_past
        claim_type: boundary_condition
        grounds: [calculations.grace_window]
        distinguishing_aspect: "At grace_until + 1 second the subscription flips EXPIRED and member LAPSED on cycle run — complementary to the difficulty instance that holds at exactly grace_until."
        test_recipe:
          setup: ["member subscription term_end 2026-09-02 (grace_until 2026-09-16T00:00:00Z); clock 2026-09-16T00:00:01Z"]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "g2@x.com", full_name: "G Two" }
              as: Member
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/transitions"
              payload: { action: "add_subscription", plan_tier: "DIGITAL", term_start: "2026-09-01T00:00:00Z", term_end: "2026-09-02T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:01Z" }
              as: LabManager
          trigger:
            - call: "POST /_cycle/run"
              payload: {}
              as: LabManager
              captures: { transitioned: $.data.subscriptions_transitioned, lapsed: $.data.members_lapsed }
          assert:
            - "subscriptions_transitioned == 1 and members_lapsed == 1 (EXPIRED + LAPSED cascade)"
  - section: validations
    instances:
      - name: sod_program_approve_same_actor
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_SOD_VIOLATION]"]
        distinguishing_aspect: "EditorialDirector with X-User-ID equal to program.proposed_by_user_id -> ERR_SOD_VIOLATION; a different director succeeds."
        test_recipe:
          setup: ["program PROPOSED by lm-1"]
          setup_api_calls:
            - call: "POST /product-categories"
              payload: { name: "Dryers", refresh_cycle_months: 24, market_share_pct: 20, member_interest_pct: 20 }
              as: LabManager
              captures: { cat_id: $.data.id }
            - call: "POST /test-programs"
              payload: { category_id: "${cat_id}", fiscal_year: 2026, budget_cents: 500000 }
              as: LabManager
              as_user_id: "lm-1"
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /test-programs/${prog_id}/transitions"
              payload: { action: "approve" }
              as: EditorialDirector
              as_user_id: "lm-1"
              captures: { err: $.data.error_id }
            - call: "POST /test-programs/${prog_id}/transitions"
              payload: { action: "approve" }
              as: EditorialDirector
              as_user_id: "ed-2"
              captures: { st: $.data.status }
          assert:
            - "first approve error_id == ERR_SOD_VIOLATION"
            - "second approve (different actor) -> status == APPROVED"
      - name: sod_po_verify_placer_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_SOD_VIOLATION]"]
        distinguishing_aspect: "ComplianceOfficer whose X-User-ID equals po.placed_by_user_id -> ERR_SOD_VIOLATION on verify."
        test_recipe:
          setup: ["PO RECEIVED placed by pa-1"]
          setup_api_calls:
            - call: "POST /product-categories"
              payload: { name: "Mowers", refresh_cycle_months: 36, market_share_pct: 30, member_interest_pct: 30 }
              as: LabManager
              captures: { cat_id: $.data.id, cat_v: $.data.version }
            - call: "POST /test-programs"
              payload: { category_id: "${cat_id}", fiscal_year: 2026, budget_cents: 500000 }
              as: LabManager
              as_user_id: "lm-1"
              captures: { prog_id: $.data.id }
            - call: "POST /lab-protocols"
              payload: { category_id: "${cat_id}", protocol_code: "MOW-01", measurement_repeat_min: 1, perf_weight_pct: 40, reliability_weight_pct: 40 }
              as: LabManager
              captures: { proto_id: $.data.id }
            - call: "POST /lab-protocols/${proto_id}/transitions"
              payload: { action: "submit_review" }
              as: LabManager
            - call: "POST /lab-protocols/${proto_id}/transitions"
              payload: { action: "activate", expected_category_version: "${cat_v}" }
              as: MethodologyOfficer
            - call: "POST /test-programs/${prog_id}/transitions"
              payload: { action: "approve" }
              as: EditorialDirector
              as_user_id: "ed-1"
            - call: "POST /test-samples"
              payload: { program_id: "${prog_id}", model_label: "Mow1", required_units: 1 }
              as: LabManager
              captures: { samp_id: $.data.id }
            - call: "POST /test-programs/${prog_id}/transitions"
              payload: { action: "start_sourcing" }
              as: LabManager
            - call: "POST /purchase-orders"
              payload: { program_id: "${prog_id}", buyer_alias: "alias-a", retailer_name: "ToolMart", receipt_doc_ref: "RA", shipping_cents: 0, lines: [ { sample_id: "${samp_id}", unit_price_cents: 1000, qty: 1, tax_rate_bp: 0 } ] }
              as: PurchasingAgent
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/transitions"
              payload: { action: "place" }
              as: PurchasingAgent
              as_user_id: "pa-1"
            - call: "POST /purchase-orders/${po_id}/transitions"
              payload: { action: "receive" }
              as: PurchasingAgent
              as_user_id: "pa-1"
          trigger:
            - call: "POST /purchase-orders/${po_id}/transitions"
              payload: { action: "verify" }
              as: ComplianceOfficer
              as_user_id: "pa-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SOD_VIOLATION; PO stays RECEIVED"
      - name: sourcing_integrity_manufacturer_direct
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_SOURCING_INTEGRITY]"]
        distinguishing_aspect: "PO with retailer_name ending '-direct' (manufacturer-direct channel) -> ERR_SOURCING_INTEGRITY at create."
        test_recipe:
          setup: ["program SAMPLE_SOURCING with sample"]
          setup_api_calls:
            - call: "POST /product-categories"
              payload: { name: "Mowers", refresh_cycle_months: 36, market_share_pct: 30, member_interest_pct: 30 }
              as: LabManager
              captures: { cat_id: $.data.id, cat_v: $.data.version }
            - call: "POST /test-programs"
              payload: { category_id: "${cat_id}", fiscal_year: 2026, budget_cents: 500000 }
              as: LabManager
              as_user_id: "lm-1"
              captures: { prog_id: $.data.id }
            - call: "POST /lab-protocols"
