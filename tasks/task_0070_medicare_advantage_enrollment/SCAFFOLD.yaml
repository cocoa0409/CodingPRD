scenario: "Medicare Advantage Enrollment: Parts A/B/C/D, Initial Enrollment Period (IEP), Annual Enrollment Period (AEP), Late Enrollment Penalty, Medigap guaranteed issue, Donut Hole drug tiers, Star Rating"
domain_name: medicare-advantage-enrollment
api_prefix: /

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =====================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =====================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Beneficiary
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix. Identity only; never a business-decision input."
      - name: full_name
        type: string
        source: input
        description: "Beneficiary legal name."
      - name: date_of_birth
        type: datetime
        source: input
        description: "DOB as ISO 8601 date-time UTC. Drives IEP window computation. Day-of-month MUST NOT be the 1st (the 'first-of-month' Medicare nuance is out of scope); a DOB on the 1st is rejected."
      - name: part_a_status
        type: enum
        source: computed
        description: "Hospital insurance status. One of {NONE, ENROLLED}. Set to ENROLLED by the establish-part-a action; NONE at creation."
        default: NONE
        constraints: "enum: NONE, ENROLLED"
      - name: part_b_status
        type: enum
        source: computed
        description: "Medical insurance status. One of {NONE, ENROLLED}. Driven by the PartBEnrollment state machine reaching ACTIVE / dropping back."
        default: NONE
        constraints: "enum: NONE, ENROLLED"
      - name: part_b_effective_date
        type: datetime
        source: computed
        description: "First-of-month date Part B coverage became effective; null until PartBEnrollment reaches ACTIVE. Used as the prior-coverage anchor for Medigap guaranteed-issue."
      - name: part_d_creditable_since
        type: datetime
        source: input
        description: "Date from which the beneficiary held creditable prescription drug coverage (employer/VA), or null if never. Anchor for Part D LEP uncovered-month counting."
      - name: enrollment_lock
        type: boolean
        source: computed
        description: "When true, all new Part C / Part D enrollment-creating actions are gated off (see Beneficiary posture). Set true on FRAUD_HOLD."
        default: false
      - name: status
        type: enum
        source: computed
        description: "Account posture. ACTIVE at creation; FRAUD_HOLD freezes new enrollments; DECEASED is terminal and disenrolls all active coverage."
        default: ACTIVE
        constraints: "enum: ACTIVE, FRAUD_HOLD, DECEASED"

  - name: Plan
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix. Identity only."
      - name: name
        type: string
        source: input
        description: "Plan marketing name."
      - name: part_type
        type: enum
        source: input
        description: "Which Medicare part this plan provides. PART_C = Medicare Advantage (bundles medical), PART_D = standalone prescription drug plan."
        constraints: "enum: PART_C, PART_D"
      - name: monthly_premium_cents
        type: integer
        source: input
        description: "Plan monthly premium in integer cents (>= 0)."
        constraints: ">= 0"
      - name: star_rating
        type: number
        source: input
        description: "CMS Star Rating, one of {1.0,1.5,2.0,2.5,3.0,3.5,4.0,4.5,5.0}. A rating of exactly 5.0 makes the plan eligible for the 5-Star SEP."
        constraints: "enum: 1.0,1.5,2.0,2.5,3.0,3.5,4.0,4.5,5.0"
      - name: includes_drug_coverage
        type: boolean
        source: input
        description: "For PART_C plans: whether the MA plan bundles Part D (an MAPD). PART_D plans MUST set this true; bare PART_C (MA-only) sets it false."
        default: false
      - name: status
        type: enum
        source: computed
        description: "Plan availability. ACTIVE at creation; RETIRED removes it from new enrollment but keeps existing enrollments intact."
        default: ACTIVE
        constraints: "enum: ACTIVE, RETIRED"

  - name: EnrollmentPeriod
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix."
      - name: beneficiary_id
        type: string
        source: input
        description: "FK -> Beneficiary.id; the beneficiary this window belongs to."
      - name: period_type
        type: enum
        source: input
        description: "Window kind. IEP (Initial Enrollment, derived from DOB), AEP (Annual, fixed Oct 15–Dec 7), SEP_5STAR (5-Star Special Enrollment), GI_MEDIGAP (Medigap 63-day guaranteed-issue)."
        constraints: "enum: IEP, AEP, SEP_5STAR, GI_MEDIGAP"
      - name: window_start
        type: datetime
        source: computed
        description: "Inclusive first instant the window is open (ISO 8601 UTC). For IEP, first-of-month 3 months before birth month."
      - name: window_end
        type: datetime
        source: computed
        description: "Inclusive last instant the window is open (ISO 8601 UTC). AEP/IEP windows are CLOSED intervals [start,end]; an action whose effective clock time equals window_end to the second is still inside the window."
      - name: source_event_date
        type: datetime
        source: input
        description: "For GI_MEDIGAP only: the qualifying-event date (e.g., loss of employer coverage) from which the 63-day guaranteed-issue clock runs; null for other period types."

  - name: PartBEnrollment
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix."
      - name: beneficiary_id
        type: string
        source: input
        description: "FK -> Beneficiary.id; the enrolling beneficiary."
      - name: enrollment_period_id
        type: string
        source: input
        description: "FK -> EnrollmentPeriod.id; the window under which this Part B enrollment is filed. MUST be an IEP period."
      - name: requested_at
        type: datetime
        source: computed
        description: "Clock time the enrollment request was filed (copied from system clock)."
      - name: effective_date
        type: datetime
        source: computed
        description: "First-of-month date Part B coverage becomes effective, derived from the IEP effective-date rule (see calc partb_effective_date)."
      - name: status
        type: enum
        source: computed
        description: "FILED at creation; ACTIVE once activated; DROPPED if voluntarily disenrolled; VOIDED if cascaded-cancelled by a DECEASED beneficiary."
        default: FILED
        constraints: "enum: FILED, ACTIVE, DROPPED, VOIDED"

  - name: PartCEnrollment
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix."
      - name: beneficiary_id
        type: string
        source: input
        description: "FK -> Beneficiary.id; the enrolling beneficiary."
      - name: plan_id
        type: string
        source: input
        description: "FK -> Plan.id; the chosen PART_C plan."
      - name: enrollment_period_id
        type: string
        source: input
        description: "FK -> EnrollmentPeriod.id; the window justifying this enrollment (IEP, AEP, or SEP_5STAR)."
      - name: requested_at
        type: datetime
        source: computed
        description: "Clock time the request was filed."
      - name: effective_date
        type: datetime
        source: computed
        description: "First-of-month date the MA enrollment becomes effective (see calc partc_effective_date)."
      - name: status
        type: enum
        source: computed
        description: "PENDING at creation; ACTIVE once confirmed; SUPERSEDED when a later PartCEnrollment for the same beneficiary takes over; DISENROLLED when voluntarily dropped; VOIDED on beneficiary death."
        default: PENDING
        constraints: "enum: PENDING, ACTIVE, SUPERSEDED, DISENROLLED, VOIDED"

  - name: PartDEnrollment
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix."
      - name: beneficiary_id
        type: string
        source: input
        description: "FK -> Beneficiary.id; the enrolling beneficiary."
      - name: plan_id
        type: string
        source: input
        description: "FK -> Plan.id; a PART_D plan."
      - name: enrollment_period_id
        type: string
        source: input
        description: "FK -> EnrollmentPeriod.id; window justifying this drug enrollment."
      - name: requested_at
        type: datetime
        source: computed
        description: "Clock time the request was filed."
      - name: uncovered_months
        type: integer
        source: computed
        description: "Count of full calendar months between part_d_creditable_since (or IEP end if never creditable) and this enrollment's effective month; drives Part D LEP. Computed once at confirmation."
      - name: lep_premium_cents
        type: integer
        source: computed
        description: "Part D Late Enrollment Penalty in cents, computed from uncovered_months (see calc partd_lep). 0 if no penalty."
        default: 0
      - name: total_drug_cost_cents
        type: integer
        source: computed
        description: "Running sum of all posted DrugClaim list-price amounts for this enrollment (year-to-date). Drives donut-hole phase."
        default: 0
      - name: member_oop_cents
        type: integer
        source: computed
        description: "Running True-Out-Of-Pocket accumulator across posted DrugClaims; drives the catastrophic-phase threshold."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "PENDING at creation; ACTIVE once confirmed; DISENROLLED when dropped; VOIDED on beneficiary death."
        default: PENDING
        constraints: "enum: PENDING, ACTIVE, DISENROLLED, VOIDED"

  - name: DrugClaim
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix."
      - name: part_d_enrollment_id
        type: string
        source: input
        description: "FK -> PartDEnrollment.id; the drug enrollment this claim posts against."
      - name: list_price_cents
        type: integer
        source: input
        description: "Full negotiated drug list price in integer cents (> 0)."
        constraints: "> 0"
      - name: incurred_at
        type: datetime
        source: input
        description: "Clock date the prescription was filled; claims post in chronological incurred_at order (tie-break created_at ASC) for donut-hole phase computation."
      - name: phase_at_post
        type: enum
        source: computed
        description: "Coverage phase the claim was adjudicated in. DEDUCTIBLE / INITIAL / GAP / CATASTROPHIC. A claim straddling a boundary records the phase of its FIRST cent."
        constraints: "enum: DEDUCTIBLE, INITIAL, GAP, CATASTROPHIC"
      - name: member_share_cents
        type: integer
        source: computed
        description: "Member cost-share for this claim in cents, summed across the phase segments the claim straddled (see calc donut_hole_member_share)."

  - name: MedigapPolicy
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix."
      - name: beneficiary_id
        type: string
        source: input
        description: "FK -> Beneficiary.id; the policyholder."
      - name: enrollment_period_id
        type: string
        source: input
        description: "FK -> EnrollmentPeriod.id; MUST be a GI_MEDIGAP period for guaranteed issue."
      - name: requested_at
        type: datetime
        source: computed
        description: "Clock time the application was filed."
      - name: coverage_start
        type: datetime
        source: input
        description: "Inclusive first instant of the supplement coverage interval (ISO 8601 UTC)."
      - name: coverage_end
        type: datetime
        source: input
        description: "Exclusive last instant of the supplement coverage interval (ISO 8601 UTC). The Medigap coverage interval is HALF-OPEN [coverage_start, coverage_end): two policies whose intervals touch at a single instant (one ends exactly where the next begins) do NOT overlap."
      - name: guaranteed_issue
        type: boolean
        source: computed
        description: "True when the application landed within the 63-day window of its GI_MEDIGAP period (see validation/state machine); false applications are rejected, so a persisted policy is always guaranteed_issue=true."
        default: true
      - name: status
        type: enum
        source: computed
        description: "ISSUED at creation; LAPSED when terminated; VOIDED on beneficiary death."
        default: ISSUED
        constraints: "enum: ISSUED, LAPSED, VOIDED"

  - name: PenaltyAssessment
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix."
      - name: beneficiary_id
        type: string
        source: input
        description: "FK -> Beneficiary.id; whose penalty this assesses."
      - name: penalty_type
        type: enum
        source: input
        description: "PART_B (10% per full 12-month uncovered period of standard Part B premium) or PART_D (1% of national base beneficiary premium per uncovered month)."
        constraints: "enum: PART_B, PART_D"
      - name: uncovered_months
        type: integer
        source: input
        description: "Count of full uncovered months supplied by the caller (the auditor has already counted them off the record)."
        constraints: ">= 0"
      - name: monthly_penalty_cents
        type: integer
        source: computed
        description: "Computed penalty amount in cents (see calc partb_lep / partd_lep selected by penalty_type)."
      - name: status
        type: enum
        source: computed
        description: "ASSESSED at creation; WAIVED if an appeal is granted (penalty zeroed)."
        default: ASSESSED
        constraints: "enum: ASSESSED, WAIVED"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Beneficiary
    initial_state: ACTIVE
    terminal_states: [DECEASED]
    transitions:
      - from: ACTIVE
        to: FRAUD_HOLD
        trigger: "POST /beneficiaries/{id}/fraud-hold"
        actor: ComplianceOfficer
        preconditions: ["beneficiary.status == ACTIVE"]
        side_effects:
          - "sets enrollment_lock = true"
          - "increments Beneficiary.version by 1"
        note: "Freezes creation of new Part C / Part D enrollments; existing enrollments are untouched."
      - from: FRAUD_HOLD
        to: ACTIVE
        trigger: "POST /beneficiaries/{id}/clear-hold"
        actor: ComplianceOfficer
        preconditions: ["beneficiary.status == FRAUD_HOLD"]
        side_effects:
          - "sets enrollment_lock = false"
          - "increments Beneficiary.version by 1"
      - from: ACTIVE
        to: DECEASED
        trigger: "POST /beneficiaries/{id}/record-death"
        actor: EnrollmentAdmin
        preconditions: ["beneficiary.status == ACTIVE"]
        side_effects:
          - "CASCADE: every PartCEnrollment of this beneficiary in status {PENDING, ACTIVE} transitions to VOIDED"
          - "CASCADE: every PartDEnrollment of this beneficiary in status {PENDING, ACTIVE} transitions to VOIDED"
          - "CASCADE: every MedigapPolicy of this beneficiary in status {ISSUED} transitions to VOIDED"
          - "CASCADE: every PartBEnrollment of this beneficiary in status {FILED, ACTIVE} transitions to VOIDED"
          - "increments Beneficiary.version by 1"
        note: "Death is terminal; all coverage voided in one cascade."
      - from: FRAUD_HOLD
        to: DECEASED
        trigger: "POST /beneficiaries/{id}/record-death"
        actor: EnrollmentAdmin
        preconditions: ["beneficiary.status == FRAUD_HOLD"]
        side_effects:
          - "CASCADE: same voiding cascade as the ACTIVE->DECEASED transition"
          - "increments Beneficiary.version by 1"

  - entity: PartBEnrollment
    initial_state: FILED
    terminal_states: [VOIDED]
    transitions:
      - from: FILED
        to: ACTIVE
        trigger: "POST /part-b-enrollments/{id}/activate"
        actor: EnrollmentAdmin
        preconditions:
          - "partBEnrollment.status == FILED"
          - "beneficiary.status == ACTIVE"
          - "beneficiary.part_a_status == ENROLLED (Part A must be established before Part B activates)"
        side_effects:
          - "sets Beneficiary.part_b_status = ENROLLED"
          - "sets Beneficiary.part_b_effective_date = partBEnrollment.effective_date"
          - "increments PartBEnrollment.version by 1"
        note: "Cross-entity guard on Beneficiary.part_a_status."
      - from: ACTIVE
        to: DROPPED
        trigger: "POST /part-b-enrollments/{id}/drop"
        actor: EnrollmentAdmin
        preconditions: ["partBEnrollment.status == ACTIVE", "beneficiary.status != DECEASED"]
        side_effects:
          - "sets Beneficiary.part_b_status = NONE"
          - "CASCADE: opens a GI_MEDIGAP loss-of-coverage window? NO — drop does not auto-open a window"
          - "increments PartBEnrollment.version by 1"
      - from: FILED
        to: VOIDED
        trigger: "system: Beneficiary record-death cascade"
        actor: system
        preconditions: ["partBEnrollment.status == FILED"]
        side_effects: ["increments PartBEnrollment.version by 1"]
      - from: ACTIVE
        to: VOIDED
        trigger: "system: Beneficiary record-death cascade"
        actor: system
        preconditions: ["partBEnrollment.status == ACTIVE"]
        side_effects:
          - "sets Beneficiary.part_b_status = NONE"
          - "increments PartBEnrollment.version by 1"

  - entity: PartCEnrollment
    initial_state: PENDING
    terminal_states: [SUPERSEDED, DISENROLLED, VOIDED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /part-c-enrollments/{id}/confirm"
        actor: EnrollmentAdmin
        preconditions:
          - "partCEnrollment.status == PENDING"
          - "beneficiary.status == ACTIVE"
          - "beneficiary.part_b_status == ENROLLED (Part C requires active Part B)"
          - "plan.status == ACTIVE"
        side_effects:
          - "CASCADE: any OTHER PartCEnrollment of this beneficiary in status ACTIVE transitions to SUPERSEDED, which itself triggers (if that superseded enrollment's plan.includes_drug_coverage == false) no further hop; if the superseded MA plan was an MAPD, its bundled drug coverage ends with it"
          - "increments PartCEnrollment.version by 1"
        note: "Confirming a new MA enrollment supersedes the prior active one (a beneficiary may hold at most one ACTIVE Part C)."
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: a newer PartCEnrollment for the same beneficiary was confirmed"
        actor: system
        preconditions: ["partCEnrollment.status == ACTIVE"]
        side_effects:
          - "CASCADE: if this enrollment's plan.includes_drug_coverage == true, the beneficiary's ACTIVE bundled-MAPD PartDEnrollment (if any) transitions to DISENROLLED, which itself frees the donut-hole accumulators for the new year"
          - "increments PartCEnrollment.version by 1"
      - from: ACTIVE
        to: DISENROLLED
        trigger: "POST /part-c-enrollments/{id}/disenroll"
        actor: EnrollmentAdmin
        preconditions: ["partCEnrollment.status == ACTIVE", "beneficiary.status != DECEASED"]
        side_effects: ["increments PartCEnrollment.version by 1"]
      - from: PENDING
        to: VOIDED
        trigger: "system: Beneficiary record-death cascade"
        actor: system
        preconditions: ["partCEnrollment.status == PENDING"]
        side_effects: ["increments PartCEnrollment.version by 1"]
      - from: ACTIVE
        to: VOIDED
        trigger: "system: Beneficiary record-death cascade"
        actor: system
        preconditions: ["partCEnrollment.status == ACTIVE"]
        side_effects: ["increments PartCEnrollment.version by 1"]

  - entity: PartDEnrollment
    initial_state: PENDING
    terminal_states: [DISENROLLED, VOIDED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /part-d-enrollments/{id}/confirm"
        actor: EnrollmentAdmin
        preconditions:
          - "partDEnrollment.status == PENDING"
          - "beneficiary.status == ACTIVE"
          - "plan.status == ACTIVE"
        side_effects:
          - "computes uncovered_months and sets lep_premium_cents (calc partd_lep)"
          - "increments PartDEnrollment.version by 1"
      - from: ACTIVE
        to: DISENROLLED
        trigger: "POST /part-d-enrollments/{id}/disenroll OR system: bundled MA supersede cascade"
        actor: EnrollmentAdmin | system
        preconditions: ["partDEnrollment.status == ACTIVE"]
        side_effects: ["increments PartDEnrollment.version by 1"]
      - from: PENDING
        to: VOIDED
        trigger: "system: Beneficiary record-death cascade"
        actor: system
        preconditions: ["partDEnrollment.status == PENDING"]
        side_effects: ["increments PartDEnrollment.version by 1"]
      - from: ACTIVE
        to: VOIDED
        trigger: "system: Beneficiary record-death cascade"
        actor: system
        preconditions: ["partDEnrollment.status == ACTIVE"]
        side_effects: ["increments PartDEnrollment.version by 1"]

  - entity: MedigapPolicy
    initial_state: ISSUED
    terminal_states: [LAPSED, VOIDED]
    transitions:
      - from: ISSUED
        to: LAPSED
        trigger: "POST /medigap-policies/{id}/lapse"
        actor: EnrollmentAdmin
        preconditions: ["medigapPolicy.status == ISSUED", "beneficiary.status != DECEASED"]
        side_effects: ["increments MedigapPolicy.version by 1"]
      - from: ISSUED
        to: VOIDED
        trigger: "system: Beneficiary record-death cascade"
        actor: system
        preconditions: ["medigapPolicy.status == ISSUED"]
        side_effects: ["increments MedigapPolicy.version by 1"]

  - entity: PenaltyAssessment
    initial_state: ASSESSED
    terminal_states: [WAIVED]
    transitions:
      - from: ASSESSED
        to: WAIVED
        trigger: "POST /penalty-assessments/{id}/waive"
        actor: ComplianceOfficer
        preconditions: ["penaltyAssessment.status == ASSESSED"]
        side_effects:
          - "sets monthly_penalty_cents = 0"
          - "increments PenaltyAssessment.version by 1"

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: partc-confirm-stale-beneficiary
    parent_entity: Beneficiary
    write_endpoint: "POST /part-c-enrollments/{id}/confirm"
    occ_field: "expected_beneficiary_version"
    description: |
      Confirming a PartCEnrollment against a Beneficiary whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another writer has already confirmed a different
      PartCEnrollment for the same beneficiary (which legitimately supersedes
      any prior active enrollment under the supersede cascade) so the current
      writer's view of the beneficiary — including which enrollment is active
      — is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: partd_lep
    trigger: "PartDEnrollment PENDING->ACTIVE confirm; and PenaltyAssessment creation when penalty_type == PART_D"
    algorithm: threshold
    formula: |
      # Part D Late Enrollment Penalty.
      # uncovered_months = full calendar months the beneficiary lacked creditable
      #   Part D coverage. On confirm it is computed (see partd_uncovered_months);
      #   on PenaltyAssessment it is supplied by the auditor.
      raw_cents = 0.01 * NBBP_CENTS * uncovered_months      # 1% of national base premium per month
      # round to the NEAREST DIME (10 cents), round_half_up
      dimes = round_half_up(raw_cents / 10)
      lep_premium_cents = int(dimes) * 10
    input_set: "uncovered_months (integer >= 0)"
    constants:
      NBBP_CENTS: 3470
    precision: "round to nearest 10 cents (dime), round_half_up; result is an integer number of cents"
    variants:
      - name: from_confirm
        when: "PartDEnrollment confirm — uncovered_months is computed by partd_uncovered_months"
        difference: "uncovered_months derived from creditable-coverage anchor, not supplied"
      - name: from_assessment
        when: "PenaltyAssessment.penalty_type == PART_D"
        difference: "uncovered_months supplied verbatim by the caller"

  - name: partb_lep
    trigger: "PenaltyAssessment creation when penalty_type == PART_B"
    algorithm: threshold
    formula: |
      # Part B Late Enrollment Penalty.
      # 10% of the standard Part B premium for EACH FULL 12-month period uncovered.
      # Partial 12-month periods do NOT count: integer-divide.
      full_periods = uncovered_months // 12        # floor division
      penalty_pct  = 10 * full_periods              # e.g. 13 uncovered months -> 1 period -> 10%
      monthly_penalty_cents = (PARTB_STD_CENTS * penalty_pct) // 100   # integer cents, floor
    input_set: "uncovered_months (integer >= 0) supplied by caller"
    constants:
      PARTB_STD_CENTS: 17470
    precision: "integer cents; floor division by 100 after applying integer percent"

  - name: partd_uncovered_months
    trigger: "PartDEnrollment PENDING->ACTIVE confirm (feeds partd_lep)"
    algorithm: chronological
    formula: |
      # Determine the uncovered-month count for a confirming Part D enrollment.
      # anchor_date = beneficiary.part_d_creditable_since
      #   if part_d_creditable_since is null -> anchor_date = the last day of the
      #   beneficiary's IEP window (EnrollmentPeriod of type IEP) — i.e. the point
      #   after which gaps start counting.
      # effective_month = first day of the month of system-clock 'now' at confirm.
      # uncovered_months = number of WHOLE calendar months strictly between
      #   anchor month-end and effective_month, floored at 0.
      months_between = (effective_year*12 + effective_month_index)
                     - (anchor_year*12   + anchor_month_index) - 1
      uncovered_months = max(0, months_between)
    input_set: "beneficiary.part_d_creditable_since OR the IEP EnrollmentPeriod.window_end; system clock at confirm"
    constants: {}
    precision: "integer count of full months, floored at 0"

  - name: donut_hole_member_share
    trigger: "POST /part-d-enrollments/{id}/claims (each DrugClaim post)"
    algorithm: tiered_pricing
    formula: |
      # Drug benefit phases, processed against the enrollment's running accumulators
      # total_drug_cost_cents (T) and member_oop_cents (O). A single claim's
      # list_price_cents is consumed cent-by-cent, splitting at phase boundaries.
      # phase_at_post = the phase of the claim's FIRST cent.
      # Cost-share rules (2024 design, pinned):
      #   DEDUCTIBLE phase   (T <  DEDUCTIBLE_CENTS): member pays 100% of the segment
      #   INITIAL phase      (DEDUCTIBLE_CENTS <= T < ICL_CENTS): member pays 25% (round_half_up per segment)
      #   GAP phase          (T >= ICL_CENTS and O < TROOP_CENTS): member pays 25% (round_half_up per segment)
      #   CATASTROPHIC phase (O >= TROOP_CENTS): member pays 0%
      # Boundary checks are: deductible crossed when T reaches DEDUCTIBLE_CENTS (>=);
      #   initial->gap crossed when T reaches ICL_CENTS (>=);
      #   gap->catastrophic crossed when O reaches TROOP_CENTS (>=).
      # member_share_cents = sum of per-segment member shares for this claim.
      # T and O are then advanced by list_price_cents and member_share_cents respectively.
    input_set: "the PartDEnrollment's current total_drug_cost_cents and member_oop_cents; this claim's list_price_cents"
    constants:
      DEDUCTIBLE_CENTS: 54500
      ICL_CENTS: 503000
      TROOP_CENTS: 800000
    precision: "per-segment 25% coinsurance rounded round_half_up to whole cents, then segments summed (round-per-segment-then-sum, NOT sum-then-round)"

# =====================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/set_current_utc which still requires headers"
  - priority: 2
    category: auth
    check: "X-User-Role is permitted to perform this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "All path-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: existence
    check: "All body-referenced FK resources (beneficiary_id, plan_id, enrollment_period_id, part_d_enrollment_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all create endpoints"
  - priority: 5
    category: business_constraint
    check: "Required body fields present and well-typed; enums in range; date_of_birth day-of-month != 1; cents fields integer and within stated bounds"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all create endpoints"
  - priority: 6
    category: state
    check: "Target resource is in the correct from-state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action/transition endpoints"
  - priority: 7
    category: state
    check: "OCC: expected_beneficiary_version matches current Beneficiary.version on POST /part-c-enrollments/{id}/confirm"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /part-c-enrollments/{id}/confirm"
  - priority: 8
    category: business_referential
    check: "enrollment_period_id belongs to the same beneficiary_id named on the enrollment"
    error_id: ERR_PERIOD_BENEFICIARY_MISMATCH
    http_status: 422
    applies_to: "POST /part-b-enrollments, POST /part-c-enrollments, POST /part-d-enrollments, POST /medigap-policies"
  - priority: 9
    category: business_referential
    check: "enrollment_period_id is of the period_type required for this enrollment: Part B requires IEP; Medigap requires GI_MEDIGAP; Part C/D require one of {IEP, AEP, SEP_5STAR}"
    error_id: ERR_WRONG_PERIOD_TYPE
    http_status: 422
    applies_to: "POST /part-b-enrollments, POST /part-c-enrollments, POST /part-d-enrollments, POST /medigap-policies"
  - priority: 10
    category: business_safety
    check: "Beneficiary.enrollment_lock == false (FRAUD_HOLD freezes new enrollments) for any new Part B/C/D/Medigap enrollment create"
    error_id: ERR_ENROLLMENT_LOCKED
    http_status: 409
    applies_to: "POST /part-b-enrollments, POST /part-c-enrollments, POST /part-d-enrollments, POST /medigap-policies"
  - priority: 11
    category: business_temporal
    check: "System clock 'now' falls within [window_start, window_end] CLOSED interval of the named enrollment_period for Part B/C/D enrollment creation (AEP/IEP/SEP_5STAR)"
    error_id: ERR_OUTSIDE_ENROLLMENT_WINDOW
    http_status: 422
    applies_to: "POST /part-b-enrollments, POST /part-c-enrollments, POST /part-d-enrollments"
  - priority: 12
    category: business_temporal
    check: "Medigap guaranteed issue: system clock 'now' is within 63 days AFTER GI_MEDIGAP.source_event_date (inclusive of day 63, half-open at start: now >= source_event_date AND now <= source_event_date + 63 days)"
    error_id: ERR_GI_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /medigap-policies"
  - priority: 13
    category: business_constraint
    check: "SEP_5STAR enrollment_period may only justify a PartCEnrollment whose plan.star_rating == 5.0 (PartDEnrollment under SEP_5STAR likewise requires the PART_D plan.star_rating == 5.0)"
    error_id: ERR_NOT_FIVE_STAR
    http_status: 422
    applies_to: "POST /part-c-enrollments, POST /part-d-enrollments"
  - priority: 14
    category: business_constraint
    check: "PartCEnrollment.plan must be PART_C; PartDEnrollment.plan must be PART_D; a PartDEnrollment is forbidden when the beneficiary already holds an ACTIVE PartCEnrollment whose plan.includes_drug_coverage == true (cannot stack standalone PDP on an MAPD)"
    error_id: ERR_DRUG_COVERAGE_CONFLICT
    http_status: 409
    applies_to: "POST /part-d-enrollments, POST /part-c-enrollments"
  - priority: 15
    category: business_temporal
    check: "EnrollmentPeriod overlap: a new IEP or AEP period for a beneficiary may not overlap an existing same-type period for that beneficiary. Interval semantics are CLOSED [window_start, window_end]: two periods that touch at a single instant (one's window_end == the other's window_start) DO collide."
    error_id: ERR_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /beneficiaries/{id}/enrollment-periods"
  - priority: 16
    category: business_temporal
    check: "Medigap coverage overlap: a new MedigapPolicy may not overlap an existing ISSUED MedigapPolicy of the same beneficiary. Interval semantics are HALF-OPEN [coverage_start, coverage_end): two policies that touch at a single instant (one's coverage_end == the other's coverage_start) do NOT collide."
    error_id: ERR_MEDIGAP_OVERLAP
    http_status: 409
    applies_to: "POST /medigap-policies"
  - priority: 17
    category: business_constraint
    check: "DrugClaim may only post to a PartDEnrollment in status ACTIVE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /part-d-enrollments/{id}/claims"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- Beneficiary ----
  - method: POST
    path: "/beneficiaries"
    description: "Create a beneficiary."
    roles: [EnrollmentAdmin]
    code: 201
    input: [full_name, date_of_birth, "part_d_creditable_since?"]
    output: Beneficiary
    side_effects: ["status=ACTIVE, part_a_status=NONE, part_b_status=NONE, enrollment_lock=false"]
  - method: GET
    path: "/beneficiaries/{id}"
    description: "Fetch a beneficiary."
    roles: [EnrollmentAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: Beneficiary
    side_effects: []
  - method: GET
    path: "/beneficiaries"
    description: "List beneficiaries (paginated)."
    roles: [EnrollmentAdmin, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Beneficiary[]
    side_effects: []
  - method: POST
    path: "/beneficiaries/{id}/establish-part-a"
    description: "Establish Part A (hospital) coverage; prerequisite for Part B activation."
    roles: [EnrollmentAdmin]
    code: 200
    input: []
    output: Beneficiary
    side_effects: ["sets part_a_status=ENROLLED", "increments Beneficiary.version by 1"]
  - method: POST
    path: "/beneficiaries/{id}/fraud-hold"
    description: "Place beneficiary on FRAUD_HOLD."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Beneficiary
    side_effects: ["status=FRAUD_HOLD", "enrollment_lock=true", "increments Beneficiary.version by 1"]
  - method: POST
    path: "/beneficiaries/{id}/clear-hold"
    description: "Clear FRAUD_HOLD back to ACTIVE."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Beneficiary
    side_effects: ["status=ACTIVE", "enrollment_lock=false", "increments Beneficiary.version by 1"]
  - method: POST
    path: "/beneficiaries/{id}/record-death"
    description: "Record beneficiary death; cascades VOIDED to all active coverage."
    roles: [EnrollmentAdmin]
    code: 200
    input: []
    output: Beneficiary
    side_effects:
      - "status=DECEASED"
      - "CASCADE void of all PartB/PartC/PartD/Medigap as in §1.2"
      - "increments Beneficiary.version by 1"

  # ---- EnrollmentPeriod ----
  - method: POST
    path: "/beneficiaries/{id}/enrollment-periods"
    description: "Compute and persist an enrollment period for a beneficiary. IEP/AEP windows are server-derived; GI_MEDIGAP requires source_event_date."
    roles: [EnrollmentAdmin]
    code: 201
    input: [period_type, "source_event_date?", "aep_year?"]
    output: EnrollmentPeriod
    side_effects:
      - "IEP: window derived from beneficiary DOB"
      - "AEP: window_start=Oct 15 of aep_year, window_end=Dec 7 of aep_year"
      - "SEP_5STAR: window_start=Dec 8 of aep_year, window_end=Nov 30 of aep_year+1"
      - "GI_MEDIGAP: window_start=source_event_date, window_end=source_event_date+63 days"
  - method: GET
    path: "/beneficiaries/{id}/enrollment-periods"
    description: "List a beneficiary's enrollment periods (reverse-reachability for EnrollmentPeriod.beneficiary_id)."
    roles: [EnrollmentAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: EnrollmentPeriod[]
    side_effects: []
  - method: GET
    path: "/enrollment-periods/{id}"
    description: "Fetch an enrollment period."
    roles: [EnrollmentAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: EnrollmentPeriod
    side_effects: []

  # ---- Plan ----
  - method: POST
    path: "/plans"
    description: "Create a plan offering."
    roles: [EnrollmentAdmin]
    code: 201
    input: [name, part_type, monthly_premium_cents, star_rating, "includes_drug_coverage?"]
    output: Plan
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/plans/{id}"
    description: "Fetch a plan."
    roles: [EnrollmentAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: Plan
    side_effects: []
  - method: POST
    path: "/plans/{id}/retire"
    description: "Retire a plan (removes from new enrollment; existing enrollments untouched)."
    roles: [EnrollmentAdmin]
    code: 200
    input: []
    output: Plan
    side_effects: ["status=RETIRED", "increments Plan.version by 1"]

  # ---- PartBEnrollment ----
  - method: POST
    path: "/part-b-enrollments"
    description: "File a Part B enrollment under an IEP window."
    roles: [EnrollmentAdmin]
    code: 201
    input: [beneficiary_id, enrollment_period_id]
    output: PartBEnrollment
    side_effects: ["status=FILED", "computes effective_date (calc partb_effective_date is partc_effective_date analog)", "requested_at=clock now"]
  - method: GET
    path: "/part-b-enrollments"
    description: "List/filter Part B enrollments (reverse-reachability for beneficiary_id, enrollment_period_id)."
    roles: [EnrollmentAdmin, ComplianceOfficer]
    code: 200
    input: ["beneficiary_id?", "enrollment_period_id?", "limit?", "offset?"]
    output: PartBEnrollment[]
    side_effects: []
  - method: GET
    path: "/part-b-enrollments/{id}"
    description: "Fetch a Part B enrollment."
    roles: [EnrollmentAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: PartBEnrollment
    side_effects: []
  - method: POST
    path: "/part-b-enrollments/{id}/activate"
    description: "Activate a FILED Part B enrollment (requires Part A established)."
    roles: [EnrollmentAdmin]
    code: 200
    input: []
    output: PartBEnrollment
    side_effects: ["status=ACTIVE", "Beneficiary.part_b_status=ENROLLED", "Beneficiary.part_b_effective_date set", "increments PartBEnrollment.version by 1"]
  - method: POST
    path: "/part-b-enrollments/{id}/drop"
    description: "Voluntarily drop active Part B."
    roles: [EnrollmentAdmin]
    code: 200
    input: []
    output: PartBEnrollment
    side_effects: ["status=DROPPED", "Beneficiary.part_b_status=NONE", "increments PartBEnrollment.version by 1"]

  # ---- PartCEnrollment ----
  - method: POST
    path: "/part-c-enrollments"
    description: "File a Part C (Medicare Advantage) enrollment."
    roles: [EnrollmentAdmin]
    code: 201
    input: [beneficiary_id, plan_id, enrollment_period_id]
    output: PartCEnrollment
    side_effects: ["status=PENDING", "computes effective_date", "requested_at=clock now"]
  - method: GET
    path: "/part-c-enrollments"
    description: "List/filter Part C enrollments (reverse-reachability for beneficiary_id, plan_id, enrollment_period_id)."
    roles: [EnrollmentAdmin, ComplianceOfficer]
    code: 200
    input: ["beneficiary_id?", "plan_id?", "enrollment_period_id?", "limit?", "offset?"]
    output: PartCEnrollment[]
    side_effects: []
  - method: GET
    path: "/part-c-enrollments/{id}"
    description: "Fetch a Part C enrollment."
    roles: [EnrollmentAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: PartCEnrollment
    side_effects: []
  - method: POST
    path: "/part-c-enrollments/{id}/confirm"
    description: "Confirm a PENDING Part C enrollment; supersedes prior active; OCC-guarded on Beneficiary.version."
    roles: [EnrollmentAdmin]
    code: 200
    input: [expected_beneficiary_version]
    output: PartCEnrollment
    side_effects:
      - "status=ACTIVE"
      - "CASCADE supersede of prior ACTIVE Part C -> SUPERSEDED -> bundled MAPD PartD -> DISENROLLED"
      - "increments Beneficiary.version by 1"
      - "increments PartCEnrollment.version by 1"
  - method: POST
    path: "/part-c-enrollments/{id}/disenroll"
    description: "Voluntarily disenroll an active Part C enrollment."
    roles: [EnrollmentAdmin]
    code: 200
    input: []
    output: PartCEnrollment
    side_effects: ["status=DISENROLLED", "increments PartCEnrollment.version by 1"]

  # ---- PartDEnrollment ----
  - method: POST
    path: "/part-d-enrollments"
    description: "File a Part D (drug) enrollment."
    roles: [EnrollmentAdmin]
    code: 201
    input: [beneficiary_id, plan_id, enrollment_period_id]
    output: PartDEnrollment
    side_effects: ["status=PENDING", "requested_at=clock now", "total_drug_cost_cents=0, member_oop_cents=0, lep_premium_cents=0"]
  - method: GET
    path: "/part-d-enrollments"
    description: "List/filter Part D enrollments (reverse-reachability for beneficiary_id, plan_id, enrollment_period_id)."
    roles: [EnrollmentAdmin, ComplianceOfficer]
    code: 200
    input: ["beneficiary_id?", "plan_id?", "enrollment_period_id?", "limit?", "offset?"]
    output: PartDEnrollment[]
    side_effects: []
  - method: GET
    path: "/part-d-enrollments/{id}"
    description: "Fetch a Part D enrollment."
    roles: [EnrollmentAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: PartDEnrollment
    side_effects: []
  - method: POST
    path: "/part-d-enrollments/{id}/confirm"
    description: "Confirm a PENDING Part D enrollment; computes uncovered_months and Part D LEP."
    roles: [EnrollmentAdmin]
    code: 200
    input: []
    output: PartDEnrollment
    side_effects: ["status=ACTIVE", "computes uncovered_months + lep_premium_cents (calc partd_lep)", "increments PartDEnrollment.version by 1"]
  - method: POST
    path: "/part-d-enrollments/{id}/disenroll"
    description: "Voluntarily disenroll an active Part D enrollment."
    roles: [EnrollmentAdmin]
    code: 200
    input: []
    output: PartDEnrollment
    side_effects: ["status=DISENROLLED", "increments PartDEnrollment.version by 1"]
  - method: POST
    path: "/part-d-enrollments/{id}/claims"
    description: "Post a DrugClaim against an ACTIVE Part D enrollment; adjudicates donut-hole phase and member share, advances accumulators."
    roles: [EnrollmentAdmin]
    code: 201
    input: [list_price_cents, incurred_at]
    output: DrugClaim
    side_effects:
      - "computes phase_at_post + member_share_cents (calc donut_hole_member_share)"
      - "advances PartDEnrollment.total_drug_cost_cents and member_oop_cents"
      - "increments PartDEnrollment.version by 1"
  - method: GET
    path: "/part-d-enrollments/{id}/claims"
    description: "List drug claims for an enrollment (reverse-reachability for DrugClaim.part_d_enrollment_id)."
    roles: [EnrollmentAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: DrugClaim[]
    side_effects: []

  # ---- MedigapPolicy ----
  - method: POST
    path: "/medigap-policies"
    description: "Apply for a Medigap policy under a GI_MEDIGAP guaranteed-issue window."
    roles: [EnrollmentAdmin]
    code: 201
    input: [beneficiary_id, enrollment_period_id, coverage_start, coverage_end]
    output: MedigapPolicy
    side_effects: ["status=ISSUED", "guaranteed_issue=true", "requested_at=clock now"]
  - method: GET
    path: "/medigap-policies"
    description: "List/filter Medigap policies (reverse-reachability for beneficiary_id, enrollment_period_id)."
    roles: [EnrollmentAdmin, ComplianceOfficer]
    code: 200
    input: ["beneficiary_id?", "enrollment_period_id?", "limit?", "offset?"]
    output: MedigapPolicy[]
    side_effects: []
  - method: GET
    path: "/medigap-policies/{id}"
    description: "Fetch a Medigap policy."
    roles: [EnrollmentAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: MedigapPolicy
    side_effects: []
  - method: POST
    path: "/medigap-policies/{id}/lapse"
    description: "Lapse an issued Medigap policy."
    roles: [EnrollmentAdmin]
    code: 200
    input: []
    output: MedigapPolicy
    side_effects: ["status=LAPSED", "increments MedigapPolicy.version by 1"]

  # ---- PenaltyAssessment ----
  - method: POST
    path: "/penalty-assessments"
    description: "Assess a Part B or Part D late enrollment penalty for a beneficiary."
    roles: [ComplianceOfficer]
    code: 201
    input: [beneficiary_id, penalty_type, uncovered_months]
    output: PenaltyAssessment
    side_effects: ["status=ASSESSED", "computes monthly_penalty_cents (calc partb_lep or partd_lep by penalty_type)"]
  - method: GET
    path: "/penalty-assessments"
    description: "List/filter penalty assessments (reverse-reachability for beneficiary_id)."
    roles: [EnrollmentAdmin, ComplianceOfficer]
    code: 200
    input: ["beneficiary_id?", "limit?", "offset?"]
    output: PenaltyAssessment[]
    side_effects: []
  - method: GET
    path: "/penalty-assessments/{id}"
    description: "Fetch a penalty assessment."
    roles: [EnrollmentAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: PenaltyAssessment
    side_effects: []
  - method: POST
    path: "/penalty-assessments/{id}/waive"
    description: "Waive an assessed penalty (zeroes monthly_penalty_cents)."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: PenaltyAssessment
    side_effects: ["status=WAIVED", "monthly_penalty_cents=0", "increments PenaltyAssessment.version by 1"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the system clock used for window checks, requested_at stamps, and uncovered-month computation."
    roles: [EnrollmentAdmin, ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["sets system clock 'now' to the supplied instant"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing X-User-Role or X-User-ID header."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted for this operation per §1.7."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path- or body-referenced resource does not exist."
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing/ill-typed field, out-of-range enum, date_of_birth on the 1st, or invalid cents."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource not in the required from-state for the transition (or DrugClaim posted to a non-ACTIVE Part D enrollment)."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC: expected_beneficiary_version does not match current Beneficiary.version on Part C confirm."
  - id: ERR_PERIOD_BENEFICIARY_MISMATCH
    http: 422
    condition: "enrollment_period_id belongs to a different beneficiary than the enrollment."
  - id: ERR_WRONG_PERIOD_TYPE
    http: 422
    condition: "The enrollment period's period_type is not valid for this enrollment kind."
  - id: ERR_ENROLLMENT_LOCKED
    http: 409
    condition: "Beneficiary is on FRAUD_HOLD (enrollment_lock=true); new enrollments frozen."
  - id: ERR_OUTSIDE_ENROLLMENT_WINDOW
    http: 422
    condition: "System clock is outside the [window_start, window_end] closed interval of the named period."
  - id: ERR_GI_WINDOW_EXPIRED
    http: 422
    condition: "Medigap application landed outside the 63-day guaranteed-issue window."
  - id: ERR_NOT_FIVE_STAR
    http: 422
    condition: "SEP_5STAR period used for a plan whose star_rating != 5.0."
  - id: ERR_DRUG_COVERAGE_CONFLICT
    http: 409
    condition: "Standalone Part D filed for a beneficiary already holding an ACTIVE MAPD, or wrong part_type for the enrollment kind."
  - id: ERR_PART_A_REQUIRED
    http: 409
    condition: "Part B activation attempted before Part A established."
  - id: ERR_PART_B_REQUIRED
    http: 409
    condition: "Part C confirm attempted while Beneficiary.part_b_status != ENROLLED."
  - id: ERR_PLAN_RETIRED
    http: 409
    condition: "Confirm references a plan whose status is RETIRED."
  - id: ERR_VALIDATION_PAGINATION
    http: 422
    condition: "limit/offset out of pagination bounds (limit 1–100, offset >= 0)."
  - id: ERR_MISSING_SOURCE_EVENT_DATE
    http: 422
    condition: "GI_MEDIGAP enrollment-period created without source_event_date."
  - id: ERR_PERIOD_OVERLAP
    http: 409
    condition: "A new same-type EnrollmentPeriod overlaps an existing one (CLOSED-interval semantics; adjacency collides)."
  - id: ERR_MEDIGAP_OVERLAP
    http: 409
    condition: "A new MedigapPolicy coverage interval overlaps an existing ISSUED policy of the beneficiary (HALF-OPEN semantics; adjacency allowed)."

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: EnrollmentAdmin
    description: "Operations staff who create beneficiaries, plans, periods, and drive all enrollment lifecycles and drug-claim posting."
    identity: "opaque"
    exclusive_operations:
      - "POST /beneficiaries"
      - "POST /beneficiaries/{id}/establish-part-a"
      - "POST /beneficiaries/{id}/record-death"
      - "POST /beneficiaries/{id}/enrollment-periods"
      - "POST /plans"
      - "POST /plans/{id}/retire"
      - "POST /part-b-enrollments and lifecycle (activate, drop)"
      - "POST /part-c-enrollments and lifecycle (confirm, disenroll)"
      - "POST /part-d-enrollments and lifecycle (confirm, disenroll, claims)"
      - "POST /medigap-policies and lifecycle (lapse)"
    shared_operations:
      - "all GET reads"
      - "POST /_clock/set_current_utc"
  - name: ComplianceOfficer
    description: "Audit/compliance staff who place fraud holds, assess and waive late-enrollment penalties."
    identity: "opaque"
    exclusive_operations:
      - "POST /beneficiaries/{id}/fraud-hold"
      - "POST /beneficiaries/{id}/clear-hold"
      - "POST /penalty-assessments"
      - "POST /penalty-assessments/{id}/waive"
    shared_operations:
      - "all GET reads"
      - "POST /_clock/set_current_utc"
