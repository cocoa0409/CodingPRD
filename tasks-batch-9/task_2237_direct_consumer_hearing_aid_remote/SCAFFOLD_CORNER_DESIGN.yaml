            - { call: "POST /screening-sessions/${scr_l2}/submit", payload: {}, as: Patient, as_user_id: "${pat_l2}" }
            - { call: "POST /patients/${pat_l2}/device-orders", payload: { model: "NEO", dome_size: "M", tip_type: "OPEN", list_price_cents: 200000, discount_cents: 0, accessory_subtotal_cents: 0, shipping_cents: 1495 }, as: Patient, as_user_id: "${pat_l2}", captures: { ord_l2: "$.data.id" } }
            - { call: "POST /_payments/simulate", payload: { device_order_id: "${ord_l2}", outcome: "AUTHORIZED" }, as: PlatformAdmin }
            - { call: "POST /device-orders/${ord_l2}/confirm-fit", payload: {}, as: CareOpsAgent }
            - { call: "POST /device-orders/${ord_l2}/ship", payload: {}, as: CareOpsAgent }
            - { call: "POST /_shipments/scan", payload: { device_order_id: "${ord_l2}", event: "DELIVERED" }, as: PlatformAdmin }
            - { call: "GET /device-orders/${ord_l2}", payload: {}, as: Patient, as_user_id: "${pat_l2}", captures: { ord_l2_v0: "$.data.version" } }
            - { call: "POST /device-orders/${ord_l2}/fit-exchanges", payload: { to_dome_size: "L", to_tip_type: "OPEN", expected_device_order_version: "${ord_l2_v0}" }, as: Patient, as_user_id: "${pat_l2}", note: "201 RESERVED, exchange_fee_cents 0 inside the ACTIVE trial, order version -> v0+1" }
          trigger:
            - { call: "POST /device-orders/${ord_l2}/fit-exchanges", payload: { to_dome_size: "S", to_tip_type: "OPEN", expected_device_order_version: "${ord_l2_v0}" }, as: Patient, as_user_id: "${pat_l2}" }
          assert:
            - "HTTP 412"
            - "data.error_id == \"ERR_STALE_ORDER_VERSION\""
            - "GET /inventory-pools/${pool_so} returns data.on_hand_units == 5 and data.reserved_units == 0"
            - "GET /fit-exchanges?device_order_id=${ord_l2}&limit=10&offset=0 returns data.total_count == 1"
            - "GET /device-orders/${ord_l2} returns data.version == ${ord_l2_v0} + 1, data.dome_size == \"M\" (the order is only rewritten on exchange confirm)"
            - "replaying with expected_device_order_version = ${ord_l2_v0} + 1 returns 201 and reserves one S/OPEN unit"

      - name: layer_occ_stale_subscription_version_on_change_tier
