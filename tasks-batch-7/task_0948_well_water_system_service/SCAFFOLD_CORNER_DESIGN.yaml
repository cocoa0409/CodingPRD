              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /water-service/well-profiles"
              payload: { property_id: "${prop_id}", jurisdiction_code: "JUR_ALPHA", well_type: "DRILLED", depth_feet: 200.0 }
              as: PlatformAdmin
              captures: { well_a: $.data.id }
            - call: "POST /water-service/well-profiles"
              payload: { property_id: "${prop_id}", jurisdiction_code: "JUR_ALPHA", well_type: "DRILLED", depth_feet: 200.0 }
              as: PlatformAdmin
              captures: { well_b: $.data.id }
            - call: "POST /water-service/well-profiles"
              payload: { property_id: "${prop_id}", jurisdiction_code: "JUR_ALPHA", well_type: "DRILLED", depth_feet: 200.0 }
              as: PlatformAdmin
              captures: { well_c: $.data.id }
            - call: "POST /water-service/technicians"
              payload: { full_name: "Filter Tech", tier: "MASTER", home_jurisdiction_code: "JUR_ALPHA", status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /water-service/emergency-tickets"
