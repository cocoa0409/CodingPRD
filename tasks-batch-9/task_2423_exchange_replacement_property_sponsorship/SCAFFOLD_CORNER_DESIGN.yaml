    grounds:
    - validations[priority=2]
    - errors[ERR_UNAUTHORIZED]
    - roles
    - endpoints[POST /properties]
    - endpoints[POST /offerings/{offering_id}/declare-effective]
    - endpoints[POST /subscriptions]
    - endpoints[POST /distributions]
    - endpoints[POST /loan-facilities]
