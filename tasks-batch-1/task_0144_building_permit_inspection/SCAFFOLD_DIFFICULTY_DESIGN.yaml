# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Grounds resolve into SCAFFOLD.yaml §1.1-§1.7. All formula-derived asserts are
# precomputed literals (round_half_up, 2dp). Jurisdiction config reused across
# instances: valuation_fee_rate_per_1000=10, minimum_permit_fee=100,
# plan_review_fee_pct=0.65, renewal_fee_pct=0.5, square_foot_rate=120,
# permit_valid_days=180.
# Fee literals (computed): val=600000 -> base 4700.00, total 7755.00;
# sqft 2000 (assessed 240000) -> base 2020.00, total 3333.00;
# val=53333 -> base 526.66, pr 342.33, total 868.99;
# val=2000 -> min-floor base 100.00, pr 65.00, total 165.00.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: assessed_valuation_method_vs_square_foot_method
        grounds:
          - calculations.assessed_valuation
          - calculations.base_permit_fee
          - calculations.total_permit_fee
          - entities.PermitApplication.fields.fee_method
          - entities.PermitApplication.fields.total_permit_fee
        distinguishing_aspect: |
          Two valid fee algorithms on the PermitApplication fee-accounting domain diverge:
          a VALUATION permit declaring 600000 yields total 7755.00, while a SQUARE_FOOT permit
          with floor_area_sqft=2000 imputes assessed 240000 and yields total 3333.00 - the
          algorithms read different inputs (declared vs imputed) for the identical fee pipeline.
        test_recipe:
          setup:
            - "Jurisdiction (rate 10, min 100, pr_pct 0.65, sqft_rate 120); a Contractor; Permit V (VALUATION, declared 600000)."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "City", code_edition: "IBC-2021", valuation_fee_rate_per_1000: 10, square_foot_rate: 120, plan_review_fee_pct: 0.65, minimum_permit_fee: 100 }
              as: BuildingOfficial
              captures: { jur_id: $.data.id }
            - call: "POST /contractors"
              payload: { business_name: "Acme", license_number: "L-1", license_status: "ACTIVE", license_expiry: "2030-01-01T00:00:00Z", bond_amount: 20000, bond_status: "VERIFIED" }
              as: PermitClerk
              captures: { con_id: $.data.id }
            - call: "POST /permits"
              payload: { jurisdiction_id: "${jur_id}", contractor_id: "${con_id}", work_class: "NEW_CONSTRUCTION", fee_method: "VALUATION", declared_valuation: 600000 }
              as: Applicant
              captures: { permit_v_id: $.data.id }
          trigger:
            - call: "POST /permits"
              payload: { jurisdiction_id: "${jur_id}", contractor_id: "${con_id}", work_class: "ALTERATION", fee_method: "SQUARE_FOOT", floor_area_sqft: 2000 }
              as: Applicant
              captures: { permit_s_id: $.data.id }
          assert:
            - "PermitApplication.${permit_v_id}.assessed_valuation == 600000"
            - "PermitApplication.${permit_v_id}.total_permit_fee == 7755.00"
            - "PermitApplication.${permit_s_id}.assessed_valuation == 240000"
            - "PermitApplication.${permit_s_id}.total_permit_fee == 3333.00"

      - name: contractor_verification_posture_license_vs_bond
        grounds:
          - calculations.contractor_verification_posture
          - entities.Contractor.fields.verification_status
          - entities.Contractor.fields.license_status
          - entities.Contractor.fields.bond_amount
        distinguishing_aspect: |
          On the Contractor risk-scoring domain (distinct from PermitApplication fee accounting),
          two valid eligibility computations diverge: an ACTIVE+current license with bond_amount
          14999 (< 15000 floor) scores FAILED, while bond_amount 15000 scores VERIFIED - license
          posture and bond posture are independent legs of one boolean composition.
        test_recipe:
          setup:
            - "Two Contractors, identical ACTIVE current licenses, differing only in bond_amount (14999 vs 15000), both bond VERIFIED."
          setup_api_calls:
            - call: "POST /contractors"
              payload: { business_name: "LowBond", license_number: "L-2", license_status: "ACTIVE", license_expiry: "2030-01-01T00:00:00Z", bond_amount: 14999, bond_status: "VERIFIED" }
              as: PermitClerk
              captures: { con_low_id: $.data.id }
          trigger:
            - call: "POST /contractors"
              payload: { business_name: "OkBond", license_number: "L-3", license_status: "ACTIVE", license_expiry: "2030-01-01T00:00:00Z", bond_amount: 15000, bond_status: "VERIFIED" }
              as: PermitClerk
              captures: { con_ok_id: $.data.id }
          assert:
            - "Contractor.${con_low_id}.verification_status == FAILED"
            - "Contractor.${con_ok_id}.verification_status == VERIFIED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: base_permit_fee_three_tier_marginal_selection
        grounds:
          - calculations.base_permit_fee
          - entities.PermitApplication.fields.assessed_valuation
          - entities.PermitApplication.fields.base_permit_fee
        distinguishing_aspect: |
          MODE (a): base_permit_fee is a non-linear >=3-input marginal selection - assessed value
          600000 is split across three bands via nested min/max (50000@1.00 + 450000@0.80 +
          100000@0.60) so the result 4700.00 is NOT a flat rate*value; the marginal multiplier
          depends on which band each dollar falls in.
        test_recipe:
          setup:
            - "Jurisdiction (rate 10, min 100, pr_pct 0.65); a Contractor; Permit VALUATION declared 600000 spanning all three tiers."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "City2", code_edition: "IBC-2021", valuation_fee_rate_per_1000: 10, square_foot_rate: 120, plan_review_fee_pct: 0.65, minimum_permit_fee: 100 }
              as: BuildingOfficial
              captures: { jur_id: $.data.id }
            - call: "POST /contractors"
              payload: { business_name: "Acme2", license_number: "L-4", license_status: "ACTIVE", license_expiry: "2030-01-01T00:00:00Z", bond_amount: 20000, bond_status: "VERIFIED" }
              as: PermitClerk
              captures: { con_id: $.data.id }
          trigger:
            - call: "POST /permits"
              payload: { jurisdiction_id: "${jur_id}", contractor_id: "${con_id}", work_class: "NEW_CONSTRUCTION", fee_method: "VALUATION", declared_valuation: 600000 }
              as: Applicant
              captures: { permit_id: $.data.id }
          assert:
            - "PermitApplication.${permit_id}.assessed_valuation == 600000"
            - "PermitApplication.${permit_id}.base_permit_fee == 4700.00"

      - name: total_permit_fee_rounding_order_round_each_then_sum
        grounds:
          - calculations.total_permit_fee
          - calculations.base_permit_fee
          - entities.PermitApplication.fields.plan_review_fee
          - entities.PermitApplication.fields.total_permit_fee
        distinguishing_aspect: |
          MODE (b): rounding order pinned to round-base, then round-surcharge-of-rounded-base,
          then sum. With valuation 53333 the raw 526.664 rounds to base 526.66, surcharge
          round(526.66*0.65)=342.33, total 868.99 - strictly different from sum-then-round
          (round(526.664*1.65)=869.00); the scaffold's pinned order yields 868.99.
        test_recipe:
          setup:
            - "Jurisdiction (rate 10, min 100, pr_pct 0.65); a Contractor; Permit VALUATION declared 53333."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "City3", code_edition: "IBC-2021", valuation_fee_rate_per_1000: 10, square_foot_rate: 120, plan_review_fee_pct: 0.65, minimum_permit_fee: 100 }
              as: BuildingOfficial
              captures: { jur_id: $.data.id }
            - call: "POST /contractors"
              payload: { business_name: "Acme3", license_number: "L-5", license_status: "ACTIVE", license_expiry: "2030-01-01T00:00:00Z", bond_amount: 20000, bond_status: "VERIFIED" }
              as: PermitClerk
              captures: { con_id: $.data.id }
          trigger:
            - call: "POST /permits"
              payload: { jurisdiction_id: "${jur_id}", contractor_id: "${con_id}", work_class: "ADDITION", fee_method: "VALUATION", declared_valuation: 53333 }
              as: Applicant
              captures: { permit_id: $.data.id }
          assert:
            - "PermitApplication.${permit_id}.base_permit_fee == 526.66"
            - "PermitApplication.${permit_id}.plan_review_fee == 342.33"
            - "PermitApplication.${permit_id}.total_permit_fee == 868.99"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: permit_cyclic_corrections_review_loop
        grounds:
          - state_machines.PermitApplication.UNDER_REVIEW_to_CORRECTIONS_REQUIRED
          - state_machines.PermitApplication.CORRECTIONS_REQUIRED_to_UNDER_REVIEW
          - entities.PermitApplication.fields.review_cycle
        distinguishing_aspect: |
          CYCLE on PermitApplication: UNDER_REVIEW -> CORRECTIONS_REQUIRED -> UNDER_REVIEW
          re-enters the review loop (a back-edge, not a one-way pipeline); review_cycle
          increments from 0 to 1 on the RESUBMIT hop, proving the back-edge fired.
        test_recipe:
          setup:
            - "Jurisdiction + Contractor + PlanReviewer. Permit SUBMITTED; review opened (UNDER_REVIEW); reviewer attaches a correction notice then decides CORRECTIONS (-> CORRECTIONS_REQUIRED); applicant resolves the notice."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "City4", code_edition: "IBC-2021", valuation_fee_rate_per_1000: 10, square_foot_rate: 120, plan_review_fee_pct: 0.65, minimum_permit_fee: 100 }
              as: BuildingOfficial
              captures: { jur_id: $.data.id }
            - call: "POST /contractors"
              payload: { business_name: "Acme4", license_number: "L-6", license_status: "ACTIVE", license_expiry: "2030-01-01T00:00:00Z", bond_amount: 20000, bond_status: "VERIFIED" }
              as: PermitClerk
              captures: { con_id: $.data.id }
            - call: "POST /plan-reviewers"
              payload: { full_name: "Rev A", cert_number: "C-1" }
              as: BuildingOfficial
              captures: { rev_id: $.data.id }
            - call: "POST /permits"
              payload: { jurisdiction_id: "${jur_id}", contractor_id: "${con_id}", work_class: "ALTERATION", fee_method: "VALUATION", declared_valuation: 100000 }
              as: Applicant
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/reviews"
              payload: { reviewer_id: "${rev_id}" }
              as: PlanReviewer
              as_user_id: "${rev_id}"
              captures: { review_id: $.data.id }
            - call: "POST /reviews/${review_id}/correction-notices"
              payload: { code_section: "R311.7", description: "Stair rise/run noncompliant" }
              as: PlanReviewer
              as_user_id: "${rev_id}"
              captures: { cn_id: $.data.id }
            - call: "POST /reviews/${review_id}/decide"
              payload: { decision: "CORRECTIONS" }
              as: PlanReviewer
              as_user_id: "${rev_id}"
            - call: "POST /correction-notices/${cn_id}/resolve"
              payload: {}
              as: Applicant
          trigger:
            - call: "POST /permits/${permit_id}/resubmit"
              payload: {}
              as: Applicant
              captures: { status_after: $.data.status, cycle_after: $.data.review_cycle }
          assert:
            - "PermitApplication.${permit_id}.status == UNDER_REVIEW"
            - "PermitApplication.${permit_id}.review_cycle == 1"

      - name: inspection_branching_pass_vs_fail_fork
        grounds:
          - state_machines.Inspection.SCHEDULED_to_PASSED
          - state_machines.Inspection.SCHEDULED_to_FAILED
          - entities.Inspection.fields.inspection_status
        distinguishing_aspect: |
          BRANCHING fork on the Inspection entity (different entity from the cyclic permit
          machine): SCHEDULED -> {PASSED, FAILED} from the same state with divergent side
          effects; this instance exercises the FAIL leg, leaving the inspection FAILED
          (non-terminal, re-requestable) rather than cascading a certificate.
        test_recipe:
          setup:
            - "An ISSUED permit (jurisdiction, verified contractor, approved+paid+issued), an Inspector, and a SCHEDULED ROUGH inspection."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "City5", code_edition: "IBC-2021", valuation_fee_rate_per_1000: 10, square_foot_rate: 120, plan_review_fee_pct: 0.65, minimum_permit_fee: 100 }
              as: BuildingOfficial
              captures: { jur_id: $.data.id }
            - call: "POST /contractors"
              payload: { business_name: "Acme5", license_number: "L-7", license_status: "ACTIVE", license_expiry: "2030-01-01T00:00:00Z", bond_amount: 20000, bond_status: "VERIFIED" }
              as: PermitClerk
              captures: { con_id: $.data.id }
            - call: "POST /plan-reviewers"
              payload: { full_name: "Rev B", cert_number: "C-2" }
              as: BuildingOfficial
              captures: { rev_id: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Insp B", badge_number: "B-1" }
              as: BuildingOfficial
              captures: { insp_id: $.data.id }
            - call: "POST /permits"
              payload: { jurisdiction_id: "${jur_id}", contractor_id: "${con_id}", work_class: "REPAIR", fee_method: "VALUATION", declared_valuation: 2000 }
              as: Applicant
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/reviews"
              payload: { reviewer_id: "${rev_id}" }
              as: PlanReviewer
              as_user_id: "${rev_id}"
              captures: { review_id: $.data.id }
            - call: "POST /reviews/${review_id}/decide"
              payload: { decision: "APPROVED" }
              as: PlanReviewer
              as_user_id: "${rev_id}"
            - call: "POST /permits/${permit_id}/payments"
              payload: { amount: 165.00 }
              as: Applicant
            - call: "GET /permits/${permit_id}"
              payload: {}
              as: PermitClerk
              captures: { pv: $.data.version }
            - call: "POST /permits/${permit_id}/issue"
              payload: { expected_permit_application_version: "${pv}" }
              as: PermitClerk
            - call: "POST /inspection-slots"
              payload: { inspector_id: "${insp_id}", window_start: "2026-07-01T08:00:00Z", window_end: "2026-07-01T17:00:00Z", max_inspections: 2 }
              as: BuildingOfficial
              captures: { slot_id: $.data.id }
            - call: "POST /permits/${permit_id}/inspections"
              payload: { slot_id: "${slot_id}", inspection_type: "ROUGH", scheduled_start: "2026-07-01T09:00:00Z", scheduled_end: "2026-07-01T10:00:00Z" }
              as: Applicant
              captures: { insp_row_id: $.data.id }
          trigger:
            - call: "POST /inspections/${insp_row_id}/result"
              payload: { outcome: "FAIL" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { status_after: $.data.inspection_status }
          assert:
            - "Inspection.${insp_row_id}.inspection_status == FAILED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: stop_work_cancels_inspection_frees_slot_depth3
        grounds:
          - state_machines.PermitApplication.ACTIVE_to_STOPPED
          - state_machines.Inspection.SCHEDULED_to_CANCELLED
          - calculations.slot_booked_count
          - entities.InspectionSlot.fields.booked_count
        distinguishing_aspect: |
          DEPTH-3 cascade from STOP_WORK_ISSUED: issuing the stop-work mutates the permit
          (work_status->STOPPED); that change cancels each SCHEDULED Inspection
          (Inspection->CANCELLED); each cancel itself decrements its InspectionSlot.booked_count
          from 1 to 0 - each link caused by the previous, not by the original action.
        test_recipe:
          setup:
            - "ISSUED permit, work_status ACTIVE; an Inspector + slot (max 2); one SCHEDULED ROUGH (booked_count 1)."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "City6", code_edition: "IBC-2021", valuation_fee_rate_per_1000: 10, square_foot_rate: 120, plan_review_fee_pct: 0.65, minimum_permit_fee: 100 }
              as: BuildingOfficial
              captures: { jur_id: $.data.id }
            - call: "POST /contractors"
              payload: { business_name: "Acme6", license_number: "L-8", license_status: "ACTIVE", license_expiry: "2030-01-01T00:00:00Z", bond_amount: 20000, bond_status: "VERIFIED" }
              as: PermitClerk
              captures: { con_id: $.data.id }
            - call: "POST /plan-reviewers"
              payload: { full_name: "Rev C", cert_number: "C-3" }
              as: BuildingOfficial
              captures: { rev_id: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Insp C", badge_number: "B-2" }
              as: BuildingOfficial
              captures: { insp_id: $.data.id }
            - call: "POST /permits"
              payload: { jurisdiction_id: "${jur_id}", contractor_id: "${con_id}", work_class: "REPAIR", fee_method: "VALUATION", declared_valuation: 2000 }
              as: Applicant
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/reviews"
              payload: { reviewer_id: "${rev_id}" }
              as: PlanReviewer
              as_user_id: "${rev_id}"
              captures: { review_id: $.data.id }
            - call: "POST /reviews/${review_id}/decide"
              payload: { decision: "APPROVED" }
              as: PlanReviewer
              as_user_id: "${rev_id}"
            - call: "POST /permits/${permit_id}/payments"
              payload: { amount: 165.00 }
              as: Applicant
            - call: "GET /permits/${permit_id}"
              payload: {}
              as: PermitClerk
              captures: { pv: $.data.version }
            - call: "POST /permits/${permit_id}/issue"
              payload: { expected_permit_application_version: "${pv}" }
              as: PermitClerk
            - call: "POST /inspection-slots"
              payload: { inspector_id: "${insp_id}", window_start: "2026-07-01T08:00:00Z", window_end: "2026-07-01T17:00:00Z", max_inspections: 2 }
              as: BuildingOfficial
              captures: { slot_id: $.data.id }
            - call: "POST /permits/${permit_id}/inspections"
              payload: { slot_id: "${slot_id}", inspection_type: "ROUGH", scheduled_start: "2026-07-01T09:00:00Z", scheduled_end: "2026-07-01T10:00:00Z" }
              as: Applicant
              captures: { insp_row_id: $.data.id }
          trigger:
            - call: "POST /permits/${permit_id}/stop-work-orders"
              payload: { reason: "Unsafe scaffolding observed" }
              as: BuildingOfficial
              captures: { swo_id: $.data.id }
          assert:
            - "PermitApplication.${permit_id}.work_status == STOPPED"
            - "Inspection.${insp_row_id}.inspection_status == CANCELLED"
            - "InspectionSlot.${slot_id}.booked_count == 0"

      - name: final_pass_creates_certificate_depth2
        grounds:
          - state_machines.Inspection.SCHEDULED_to_PASSED
          - state_machines.CertificateOfOccupancy.transitions
          - entities.CertificateOfOccupancy.fields.co_status
        distinguishing_aspect: |
          DEPTH-2 cascade from a different trigger (INSPECTION_PASSED on a FINAL inspection):
          the PASS mutates the Inspection (->PASSED); that mutation itself creates a
          CertificateOfOccupancy with co_status=ISSUED whose final_inspection_id points back at
          the inspection - the certificate is created by the inspection's transition, not by the
          original API caller.
        test_recipe:
          setup:
            - "ISSUED permit with a PASSED ROUGH inspection and a SCHEDULED FINAL inspection (same inspector, not the plan approver)."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "City7", code_edition: "IBC-2021", valuation_fee_rate_per_1000: 10, square_foot_rate: 120, plan_review_fee_pct: 0.65, minimum_permit_fee: 100 }
              as: BuildingOfficial
              captures: { jur_id: $.data.id }
            - call: "POST /contractors"
              payload: { business_name: "Acme7", license_number: "L-9", license_status: "ACTIVE", license_expiry: "2030-01-01T00:00:00Z", bond_amount: 20000, bond_status: "VERIFIED" }
              as: PermitClerk
              captures: { con_id: $.data.id }
            - call: "POST /plan-reviewers"
              payload: { full_name: "Rev D", cert_number: "C-4" }
              as: BuildingOfficial
              captures: { rev_id: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Insp D", badge_number: "B-3" }
              as: BuildingOfficial
              captures: { insp_id: $.data.id }
            - call: "POST /permits"
              payload: { jurisdiction_id: "${jur_id}", contractor_id: "${con_id}", work_class: "REPAIR", fee_method: "VALUATION", declared_valuation: 2000 }
              as: Applicant
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/reviews"
              payload: { reviewer_id: "${rev_id}" }
              as: PlanReviewer
              as_user_id: "${rev_id}"
              captures: { review_id: $.data.id }
            - call: "POST /reviews/${review_id}/decide"
              payload: { decision: "APPROVED" }
              as: PlanReviewer
              as_user_id: "${rev_id}"
            - call: "POST /permits/${permit_id}/payments"
              payload: { amount: 165.00 }
              as: Applicant
            - call: "GET /permits/${permit_id}"
              payload: {}
              as: PermitClerk
              captures: { pv: $.data.version }
            - call: "POST /permits/${permit_id}/issue"
              payload: { expected_permit_application_version: "${pv}" }
              as: PermitClerk
            - call: "POST /inspection-slots"
              payload: { inspector_id: "${insp_id}", window_start: "2026-07-01T08:00:00Z", window_end: "2026-07-01T17:00:00Z", max_inspections: 5 }
              as: BuildingOfficial
              captures: { slot_id: $.data.id }
            - call: "POST /permits/${permit_id}/inspections"
              payload: { slot_id: "${slot_id}", inspection_type: "ROUGH", scheduled_start: "2026-07-01T09:00:00Z", scheduled_end: "2026-07-01T10:00:00Z" }
              as: Applicant
              captures: { rough_id: $.data.id }
            - call: "POST /inspections/${rough_id}/result"
              payload: { outcome: "PASS" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /permits/${permit_id}/inspections"
              payload: { slot_id: "${slot_id}", inspection_type: "FINAL", scheduled_start: "2026-07-01T11:00:00Z", scheduled_end: "2026-07-01T12:00:00Z" }
              as: Applicant
              captures: { final_id: $.data.id }
          trigger:
            - call: "POST /inspections/${final_id}/result"
              payload: { outcome: "PASS" }
              as: Inspector
              as_user_id: "${insp_id}"
          assert:
            - "Inspection.${final_id}.inspection_status == PASSED"
            - "exactly one CertificateOfOccupancy exists with permit_id == ${permit_id}, co_status == ISSUED, final_inspection_id == ${final_id}"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_issue
        grounds:
          - validations[priority=6]
          - validations[priority=17]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_BALANCE_DUE]
        distinguishing_aspect: |
          Category pair STATE vs BUSINESS_FISCAL: a SUBMITTED permit (status != APPROVED) with
          balance_due > 0 fails both the state precondition (p6) and the zero-balance gate (p17);
          the lower-priority-number STATE check wins so the response is ERR_INVALID_STATE, not
          ERR_BALANCE_DUE.
        test_recipe:
          setup:
            - "A SUBMITTED permit (never reviewed/approved), total_permit_fee 165.00, no payments (balance_due 165.00)."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "City8", code_edition: "IBC-2021", valuation_fee_rate_per_1000: 10, square_foot_rate: 120, plan_review_fee_pct: 0.65, minimum_permit_fee: 100 }
              as: BuildingOfficial
