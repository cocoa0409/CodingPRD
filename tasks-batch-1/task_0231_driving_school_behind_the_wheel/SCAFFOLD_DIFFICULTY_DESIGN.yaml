  - rule_id: transitive_cascade
    instances:
      - name: refund_cascade_depth3_lesson_ledger_wallet
        grounds:
          - state_machines.Enrollment.ACTIVE_to_REFUNDED
          - state_machines.Lesson.SCHEDULED_to_CANCELLED
          - entities.WalletEntry.fields.amount_cents
          - entities.Student.fields.scheduled_road_hours
        distinguishing_aspect: |
          Depth-3 chain triggered by refund: (1) Enrollment ACTIVE->REFUNDED causes
          (2) each SCHEDULED Lesson -> CANCELLED, which itself causes (3) Student.scheduled_road_hours
          to decrement AND a REFUND_CREDIT WalletEntry that raises wallet_balance_cents. Each link
          is caused by the prior link, not directly by the refund call.
        test_recipe:
          setup:
            - "ACTIVE enrollment (final 85000, fee 5000) with one SCHEDULED 2h ROAD lesson (scheduled_road_hours=2) and 0 completed; activated 2026-06-01, clock 2026-06-02 (elapsed 1 day -> SCHEDULE_TIER 100%)."
