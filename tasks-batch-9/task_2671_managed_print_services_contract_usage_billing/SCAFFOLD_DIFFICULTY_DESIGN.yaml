              payload: { contract_id: "${c1}", quarter_label: "2026-Q3" }
              as: AccountManager
              as_user_id: "am-1"
              captures: { qr1: $.data.id }
          assert:
            - "QuarterlyReview.${qr1}.baseline_savings_cents == 20114"
            - "QuarterlyReview.${qr1}.realized_savings_cents == 25020"
            - "QuarterlyReview.${qr1}.baseline_savings_cents != QuarterlyReview.${qr1}.realized_savings_cents"
            - "QuarterlyReview.${qr1}.volume_trend_pct == 0"
            - "QuarterlyReview.${qr1}.retain_count == 1"
            - "QuarterlyReview.${qr1}.downgrade_count == 1"
            - "QuarterlyReview.${qr1}.upgrade_count == 0"
            - "QuarterlyReview.${qr1}.consolidate_count == 0"
            - "QuarterlyReview.${qr1}.refresh_due_device_count == 0"
