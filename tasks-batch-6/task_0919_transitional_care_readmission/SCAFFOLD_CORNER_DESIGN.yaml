          rationale: "Asserted for both the calendar-overlap and the contact-cooldown loci across the two instances of that rule."
      - name: error_navigator_cap_exceeded_trigger
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_NAVIGATOR_CAP_EXCEEDED]"
        excluded_because:
          difficulty_instance: dual_variant_calc / navigator_cap_count_policy_vs_weighted_policy
          rationale: "Asserted as the rejection of the fourth handoff acceptance there."
      - name: error_appeal_limit_reached_trigger
        claim_type: violation_to_error
