            - { call: "POST /v1/pickup-appointments", payload: { return_order_id: "${ro_id}", zone_id: "${zone_id}", window_start: "2026-05-01T00:30:00Z", window_end: "2026-05-01T02:30:00Z" }, as: Shopper, as_user_id: "${sh_id}", captures: { ap: $.data.id } }
            - { call: "POST /v1/pickup-appointments/${ap}/start", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/pickup-appointments/${ap}/collect", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/return-orders/${ro_id}/receive", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/return-orders/${ro_id}/items", payload: {}, as: PlatformAdmin, captures: { it1: "$.data[0].id" } }
            - { call: "POST /v1/return-items/${it1}/inspect", payload: { condition: WRONG_ITEM }, as: PlatformAdmin }
            - { call: "GET /v1/return-orders/${ro_id}/exception-cases", payload: {}, as: PlatformAdmin, captures: { ex_id: "$.data[0].id" } }
            - { call: "POST /v1/exception-cases/${ex_id}/start-investigation", payload: {}, as: SupportAgent, as_user_id: "agent-a", captures: { ex_v: $.data.version } }
          trigger:
            - { call: "POST /v1/exception-cases/${ex_id}/resolve", payload: { resolution: REJECTED, expected_exception_case_version: "${ex_v}" }, as: SupportAgent, as_user_id: "agent-b" }
            - { call: "GET /v1/return-orders/${ro_id}/refund-projection", payload: {}, as: PlatformAdmin, captures: { fin: $.data.final_cents, pay: $.data.payable_cents, st: $.data.refund_status } }
