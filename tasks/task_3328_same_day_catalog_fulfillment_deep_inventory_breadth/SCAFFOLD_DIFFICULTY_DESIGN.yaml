  # ===========================================================================
  # Rule 3 — non-linear state-machine shape on different entities
  #   CatalogOrder : parallel dimensions (order_status x fulfillment_status)
  #   PickTask     : cycle (a short-closed pick reopens while the order holds)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: order_parallel_status_dimensions_move_independently
        grounds:
          - state_machines.CatalogOrder
          - state_machines.CatalogOrder.RELEASED_ALLOCATED_to_CANCELLED_AWAITING_RELEASE
          - entities.CatalogOrder.fields.order_status
          - entities.CatalogOrder.fields.fulfillment_status
          - entities.CatalogOrder.fields.allocated_dc_id
        distinguishing_aspect: "CatalogOrder carries two independent status axes: a cancel taken while fulfillment_status is ALLOCATED keeps order_status CANCELLED while fulfillment_status falls BACK to AWAITING_RELEASE, so the pair (CANCELLED, AWAITING_RELEASE) is reachable and is not any of the three pairs the linear reading of the machine would produce."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T08:00:00Z (Monday), DC BOS local 04:00 before its 06:00:00 cutoff."
            - "Account Riverside Machine in region NORTHEAST; one curated item priced 8000 cents with curation_bundle_size 8; BOS holds 12 units."
            - "One order with a single line of 4 units, released and allocated to BOS."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /distribution-centers"
              payload: { code: "BOS", region: "NORTHEAST", local_zone: "America/New_York", local_cutoff_time: "06:00:00", utc_offset_minutes: -240, inbound_capacity_units: 900, transit_seconds: 86400 }
              as: PlatformAdmin
              captures: { bos_dc_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_name: "Riverside Machine", delivery_zone: "America/New_York", home_region: "NORTHEAST" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-3001", description: "Thrust bearing 6203", material_spec: "bearing steel", long_tail: false, unit_price_cents: 8000, unit_weight_kg: 0.20, curation_bundle_size: 8, curated_dimension_json: { nominal_length_mm: 40, nominal_width_mm: 40, nominal_height_mm: 12, drawing_revision: 1 } }
              as: CatalogCurator
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/attributes"
              payload: { attribute_name: "Bore Diameter", attribute_value: "17.00 mm", unit_of_measure: "mm" }
              as: CatalogCurator
            - call: "POST /curation-reviews"
              payload: { item_ids: ["${item_id}"] }
              as: CatalogCurator
            - call: "POST /stock"
              payload: { item_id: "${item_id}", dc_id: "${bos_dc_id}", account_id: "${acct_id}", on_hand_units: 12, daily_demand_units: 3, inbound_daily_units: 3 }
              as: DCManager
              captures: { stock_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", lines: [{ item_id: "${item_id}", quantity: 4 }] }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/release"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_v: $.data.version }
            - call: "POST /orders/${order_id}/allocate"
              payload: { expected_order_version: "${order_v}" }
              as: CustomerAccount
              as_user_id: "${acct_id}"
          trigger:
            - call: "GET /orders/${order_id}"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
            - call: "GET /orders/${order_id}"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
          assert:
            - "before the cancel, CatalogOrder.${order_id}.order_status == RELEASED and fulfillment_status == ALLOCATED"
            - "before the cancel, InventoriedStock.${stock_id}.reserved_units == 4 and available_units == 8"
            - "after the cancel, CatalogOrder.${order_id}.order_status == CANCELLED"
            - "after the cancel, CatalogOrder.${order_id}.fulfillment_status == AWAITING_RELEASE — the fulfillment axis rolled back independently of the order axis, so the pair (CANCELLED, AWAITING_RELEASE) is observable"
            - "after the cancel, InventoriedStock.${stock_id}.reserved_units == 0 and available_units == 12"
            - "after the cancel, the order's single CatalogOrderLine.line_status == PENDING and allocated_units == 0"

      - name: pick_task_reopens_after_a_short_closed_pick
        grounds:
          - state_machines.PickTask
          - state_machines.PickTask.SHORT_CLOSED_to_PICKING
          - entities.PickTask.fields.pick_status
          - entities.CatalogOrderLine.fields.line_status
        distinguishing_aspect: "PickTask is cyclic rather than a pipeline: a SHORT_CLOSED pick is reopened to PICKING by a second POST /orders/{id}/lines/{line_id}/pick while the owning order is still at fulfillment_status ALLOCATED, so PICKING is reachable twice along two different paths (QUEUED->PICKING and SHORT_CLOSED->PICKING) and the pick does not end where a linear reading would leave it."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T08:00:00Z (Monday), DC BOS local 04:00 before its 06:00:00 cutoff."
            - "Account Riverside Machine in region NORTHEAST; one curated item priced 6000 cents with curation_bundle_size 8; BOS holds 10 units."
            - "One order with a single line of 5 units, released and allocated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /distribution-centers"
              payload: { code: "BOS", region: "NORTHEAST", local_zone: "America/New_York", local_cutoff_time: "06:00:00", utc_offset_minutes: -240, inbound_capacity_units: 900, transit_seconds: 86400 }
              as: PlatformAdmin
              captures: { bos_dc_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_name: "Riverside Machine", delivery_zone: "America/New_York", home_region: "NORTHEAST" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-3101", description: "Roller chain 08B", material_spec: "carbon steel", long_tail: false, unit_price_cents: 6000, unit_weight_kg: 0.60, curation_bundle_size: 8, curated_dimension_json: { nominal_length_mm: 300, nominal_width_mm: 60, nominal_height_mm: 20, drawing_revision: 1 } }
              as: CatalogCurator
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/attributes"
              payload: { attribute_name: "Pitch", attribute_value: "12.70 mm", unit_of_measure: "mm" }
              as: CatalogCurator
            - call: "POST /curation-reviews"
              payload: { item_ids: ["${item_id}"] }
              as: CatalogCurator
            - call: "POST /stock"
              payload: { item_id: "${item_id}", dc_id: "${bos_dc_id}", account_id: "${acct_id}", on_hand_units: 10, daily_demand_units: 2, inbound_daily_units: 2 }
              as: DCManager
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", lines: [{ item_id: "${item_id}", quantity: 5 }] }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/release"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_v: $.data.version }
            - call: "POST /orders/${order_id}/allocate"
              payload: { expected_order_version: "${order_v}" }
              as: CustomerAccount
              as_user_id: "${acct_id}"
            - call: "GET /orders/${order_id}/lines"
              payload: { limit: 10, offset: 0 }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { line_id: "$.data[0].id" }
            - call: "POST /orders/${order_id}/lines/${line_id}/pick"
              payload: { requested_units: 5 }
              as: WarehousePicker
              captures: { task_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/lines/${line_id}/pick_complete"
              payload: { actual_units: 3 }
              as: WarehousePicker
            - call: "POST /orders/${order_id}/lines/${line_id}/pick"
              payload: { requested_units: 2 }
              as: WarehousePicker
          assert:
            - "after the short pick, PickTask.${task_id}.pick_status == SHORT_CLOSED"
            - "after the short pick, PickTask.${task_id}.picked_units == 3 and shortage_units == 2"
            - "after the reopening pick, PickTask.${task_id}.pick_status == PICKING — the same task row, not a new one"
            - "after the reopening pick, CatalogOrderLine.${line_id}.line_status == ALLOCATED"
            - "CatalogOrder.${order_id}.fulfillment_status is still ALLOCATED, so the order never left the state that permits the cycle"

  # ===========================================================================
  # Rule 4 — transitive cascade chains from different triggers
  #   depth 7 from POST /returns/{id}/receive
  #   depth 4 from POST /distribution-centers/{id}/reeducate
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: return_receipt_seven_hop_cascade
        grounds:
          - state_machines.ReturnAuthorization.APPROVED_to_RECEIVED
          - state_machines.CatalogItem.UNREVIEWED_to_APPROVED
          - entities.CatalogOrderLine.fields.restocked_units
          - entities.CatalogOrderLine.fields.damaged_units
          - entities.DamageClaim.fields.damage_value_cents
          - entities.Supplier.fields.performance_rating_units
          - entities.CatalogItem.fields.catalog_status
          - calculations.restock_cap_allocation
          - calculations.damaged_value_and_suspension
        distinguishing_aspect: "Depth 7 and every hop is caused by the previous hop, not by the original action: receive(1) mutates the line's restocked_units(2), which restores on_hand at the DC(3), while the damaged share opens a DamageClaim(4) that bumps the account's open_claim_count(5) and breaches the long-tail supplier's commitment(6), and the damaged-cent trigger then suspends the item(7)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T10:05:00Z (Monday), DC BOS local 06:05, after its 06:00:00 cutoff."
            - "Account Riverside Machine in region NORTHEAST; supplier Long Tail Fasteners authorized for long-tail with a 50-unit commitment."
            - "One long-tail item priced 10000 cents with curation_bundle_size 8; BOS holds 10 units."
            - "One order of 5 units, picked in full and cut off, so fulfillment_status is SHIPPED and the line is PICKED."
            - "Return R1 for 5 units approved (restock 4, damaged 1) and a second return R2 for 2 units approved."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T10:05:00Z" }
              as: PlatformAdmin
            - call: "POST /distribution-centers"
              payload: { code: "BOS", region: "NORTHEAST", local_zone: "America/New_York", local_cutoff_time: "06:00:00", utc_offset_minutes: -240, inbound_capacity_units: 900, transit_seconds: 86400 }
              as: PlatformAdmin
              captures: { bos_dc_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_name: "Riverside Machine", delivery_zone: "America/New_York", home_region: "NORTHEAST" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /suppliers"
              payload: { supplier_name: "Long Tail Fasteners", home_dc_id: "${bos_dc_id}", primary_attribute_name: "Thread Pitch", primary_attribute_value: "1.25 mm", long_tail_authorized: true, min_stock_commitment_units: 50 }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-4001", description: "Precision shoulder screw M6x30", material_spec: "4140 alloy steel", long_tail: true, unit_price_cents: 10000, unit_weight_kg: 0.10, curation_bundle_size: 8, curated_dimension_json: { nominal_length_mm: 30, nominal_width_mm: 6, nominal_height_mm: 6, drawing_revision: 1 } }
              as: CatalogCurator
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/attributes"
              payload: { attribute_name: "Thread Pitch", attribute_value: "1.00 mm", unit_of_measure: "mm" }
              as: CatalogCurator
            - call: "POST /curation-reviews"
              payload: { item_ids: ["${item_id}"] }
              as: CatalogCurator
            - call: "POST /stock"
              payload: { item_id: "${item_id}", dc_id: "${bos_dc_id}", account_id: "${acct_id}", on_hand_units: 10, daily_demand_units: 2, inbound_daily_units: 2 }
              as: DCManager
              captures: { stock_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", lines: [{ item_id: "${item_id}", quantity: 5 }] }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/release"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_v: $.data.version }
            - call: "POST /orders/${order_id}/allocate"
              payload: { expected_order_version: "${order_v}" }
              as: CustomerAccount
              as_user_id: "${acct_id}"
            - call: "GET /orders/${order_id}/lines"
              payload: { limit: 10, offset: 0 }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { line_id: "$.data[0].id" }
            - call: "POST /orders/${order_id}/lines/${line_id}/pick"
              payload: { requested_units: 5 }
              as: WarehousePicker
            - call: "POST /orders/${order_id}/lines/${line_id}/pick_complete"
              payload: { actual_units: 5 }
              as: WarehousePicker
            - call: "GET /orders/${order_id}"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_v_ready: $.data.version }
            - call: "POST /orders/${order_id}/confirm_cutoff"
              payload: { expected_order_version: "${order_v_ready}", service_level: "GROUND" }
              as: DCManager
            - call: "POST /returns"
              payload: { order_id: "${order_id}", lines: [{ line_id: "${line_id}", requested_return_units: 5 }] }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { ret1_id: $.data.id }
            - call: "POST /returns/${ret1_id}/approve"
              payload: {}
              as: DCManager
            - call: "POST /returns"
              payload: { order_id: "${order_id}", lines: [{ line_id: "${line_id}", requested_return_units: 2 }] }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { ret2_id: $.data.id }
            - call: "POST /returns/${ret2_id}/approve"
              payload: {}
              as: DCManager
          trigger:
            - call: "POST /returns/${ret1_id}/receive"
              payload: { removed_manufacturer_part_numbers: { "${line_id}": "SS-M6X30-4140" } }
              as: DCManager
          assert:
            - "hop 1: ReturnAuthorization.${ret1_id}.return_status == RECEIVED"
            - "hop 2: CatalogOrderLine.${line_id}.returned_units == 5, restocked_units == 4 and damaged_units == 1"
            - "hop 3: InventoriedStock.${stock_id}.on_hand_units == 9 (5 left after the pick, 4 restored), available_units == 9"
            - "hop 4: GET /damage-claims?order_id=${order_id} returns exactly one claim with claim_units == 1 and damage_value_cents == 6000"
            - "hop 5: CustomerAccount.${acct_id}.open_claim_count == 1"
            - "hop 6: the long-tail item triggers Supplier.${sup_id}.commitment_breach_count == 1 and performance_rating_units == 90"
            - "hop 7: CatalogItem.${item_id}.catalog_status == SUSPENDED, because 1 damaged unit at 10000 cents reaches the 10000-cent inclusive trigger"
            - "the transition's own side effect: ReturnAuthorization.${ret2_id}.return_status == CANCELLED, because it still held an APPROVED restock authorization for the same order"
            - "compensating counterpart: GET /orders/${order_id} shows fulfillment_status == RETURNED, and GET /returns?order_id=${order_id} shows no return still holding APPROVED"

      - name: dc_lockdown_posture_four_hop_cascade
        grounds:
          - state_machines.DistributionCenter.OPEN_to_LOCKDOWN
          - state_machines.DistributionCenter.LOCKDOWN_to_OPEN
          - state_machines.Shipment.CUTOFF_CONFIRMED_to_HELD
          - entities.DistributionCenter.fields.operations_posture
          - entities.Shipment.fields.shipment_status
          - entities.CatalogOrder.fields.fulfillment_status
          - entities.PickTask.fields.pick_status
        distinguishing_aspect: "Depth 4 from a posture change: POST /distribution-centers/{id}/reeducate flips operations_posture(1), which is what drives the DC's shipments to HELD(2), which is what reverts each owning order PICKED -> ALLOCATED(3), which is what reopens the order's pick tasks(4) — clearing the hold walks the exact same four hops back."
