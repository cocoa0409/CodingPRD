            - "Referral.${ref_a}.status == COMPLETED"
            - "RETENTION milestone amount_cents == 350000 with status EARNED"
            - "Campaign.spent_cents == 200000 (60000 hire share + 140000 retention share)"
            - "Campaign.reserved_cents == 0 and remaining_cents == 0"
            - "Campaign.status == EXHAUSTED — the auto-transition fired as the third link of the cascade"

      - name: abuse_confirm_forfeits_batched_milestone
        grounds:
          - state_machines.AbuseCase.OPEN_to_CONFIRMED
          - state_machines.Referral.HIRED_to_FORFEITED
          - state_machines.BonusMilestone.BATCHED_to_FORFEITED
