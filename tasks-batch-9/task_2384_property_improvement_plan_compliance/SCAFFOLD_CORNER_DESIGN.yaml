              captures: { fr_id: $.data.id }
            - call: "POST /pip/properties"
              payload: { franchisee_id: "${fr_id}", brand_code: "HRB", name: "Dunmarsh Embankment", room_count: 200, adr_baseline_cents: 18000, occupancy_baseline_pct: 0.70, reserve_balance_cents: 50000000, minimum_retention_cents: 5000000 }
