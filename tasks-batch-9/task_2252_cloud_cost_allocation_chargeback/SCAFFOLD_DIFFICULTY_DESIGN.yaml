scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: allocation_run_provisional_vs_final_total_divergence
        grounds:
          - calculations.allocation_run_totals
          - calculations.commitment_application_waterfall
          - state_machines.AllocationRun.DRAFT_to_COMPUTED_PROVISIONAL
          - state_machines.AllocationRun.COMPUTED_PROVISIONAL_to_COMPUTED_FINAL
          - entities.AllocationRun.fields.variant_applied
          - entities.AllocationRun.fields.total_allocated_cents
        distinguishing_aspect: |
          Dual-variant logic on the cost-accounting domain (AllocationRun over CostRecord): the identical
          in-scope record set yields total_allocated_cents 35301 under PROVISIONAL (list basis) and 26967
          under FINAL (effective basis), a divergence of exactly 8334 cents - the commitment discount.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "Two ACTIVE, chargeback-enabled business units: Platform BU (headcount 40) and Data BU (headcount 10)."
            - "Three PROVISIONED COMPUTE resources, two owned by Platform BU and one by Data BU."
            - "Three COMPUTE cost records of list_cost_cents 10100 covering 2026-07-01..2026-08-01, plus one resource-less STORAGE record of 5001."
            - "An ACTIVE SAVINGS_PLAN commitment with committed_capacity_cents 36000 that has discounted all three COMPUTE records to effective_cost_cents 7322 each."
            - "A DRAFT CHARGEBACK run for 2026-07-01..2026-08-01 with one SEALED PROPORTIONAL pool on HEADCOUNT holding the 5001 untagged record."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /finops/business-units"
              payload: { name: "Platform BU", cost_center_code: "CC-100", chargeback_enabled: true, headcount: 40 }
              as: PlatformAdmin
              captures: { bu_a_id: "$.data.id" }
            - call: "POST /finops/business-units"
              payload: { name: "Data BU", cost_center_code: "CC-200", chargeback_enabled: true, headcount: 10 }
              as: PlatformAdmin
              captures: { bu_b_id: "$.data.id" }
            - call: "POST /finops/tagging-policies"
              payload: { name: "core-tags", mandatory_dimensions: ["team", "environment", "application"], enforcement_mode: "BLOCKING" }
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
              captures: { pol_id: "$.data.id" }
            - call: "POST /finops/tagging-policies/${pol_id}/activate"
              payload: {}
              as: FinOpsController
              as_user_id: "controller-1"
            - call: "POST /finops/provisioning-requests"
              payload: { tagging_policy_id: "${pol_id}", business_unit_id: "${bu_a_id}", resource_kind: "COMPUTE", requested_tags: { team: "platform", environment: "dev", application: "api" }, monthly_run_rate_cents: 1000000, owner_user_id: "owner-1" }
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
              captures: { pr1_id: "$.data.id" }
            - call: "POST /finops/provisioning-requests/${pr1_id}/approve"
              payload: {}
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
            - call: "POST /finops/provisioning-requests/${pr1_id}/provision"
              payload: {}
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
            - call: "GET /finops/cloud-resources"
              payload: { provisioning_request_id: "${pr1_id}" }
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
              captures: { res1_id: "$.data[0].id" }
            - call: "POST /finops/provisioning-requests"
              payload: { tagging_policy_id: "${pol_id}", business_unit_id: "${bu_a_id}", resource_kind: "COMPUTE", requested_tags: { team: "platform", environment: "prod", application: "api" }, monthly_run_rate_cents: 30000, owner_user_id: "owner-1" }
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
              captures: { pr2_id: "$.data.id" }
            - call: "POST /finops/provisioning-requests/${pr2_id}/approve"
              payload: {}
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
            - call: "POST /finops/provisioning-requests/${pr2_id}/provision"
              payload: {}
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
            - call: "GET /finops/cloud-resources"
              payload: { provisioning_request_id: "${pr2_id}" }
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
              captures: { res2_id: "$.data[0].id" }
            - call: "POST /finops/provisioning-requests"
              payload: { tagging_policy_id: "${pol_id}", business_unit_id: "${bu_b_id}", resource_kind: "COMPUTE", requested_tags: { team: "data", environment: "prod", application: "etl" }, monthly_run_rate_cents: 30000, owner_user_id: "owner-2" }
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
              captures: { pr3_id: "$.data.id" }
            - call: "POST /finops/provisioning-requests/${pr3_id}/approve"
              payload: {}
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
            - call: "POST /finops/provisioning-requests/${pr3_id}/provision"
              payload: {}
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
            - call: "GET /finops/cloud-resources"
              payload: { provisioning_request_id: "${pr3_id}" }
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
              captures: { res3_id: "$.data[0].id" }
            - call: "POST /finops/cost-records"
              payload: { cloud_resource_id: "${res1_id}", billing_period_start: "2026-07-01T00:00:00Z", billing_period_end: "2026-08-01T00:00:00Z", resource_kind: "COMPUTE", list_cost_cents: 10100 }
              as: PlatformAdmin
              captures: { cr1_id: "$.data.id" }
            - call: "POST /finops/cost-records"
              payload: { cloud_resource_id: "${res2_id}", billing_period_start: "2026-07-01T00:00:00Z", billing_period_end: "2026-08-01T00:00:00Z", resource_kind: "COMPUTE", list_cost_cents: 10100 }
              as: PlatformAdmin
              captures: { cr2_id: "$.data.id" }
            - call: "POST /finops/cost-records"
              payload: { cloud_resource_id: "${res3_id}", billing_period_start: "2026-07-01T00:00:00Z", billing_period_end: "2026-08-01T00:00:00Z", resource_kind: "COMPUTE", list_cost_cents: 10100 }
              as: PlatformAdmin
              captures: { cr3_id: "$.data.id" }
            - call: "POST /finops/cost-records"
              payload: { billing_period_start: "2026-07-01T00:00:00Z", billing_period_end: "2026-08-01T00:00:00Z", resource_kind: "STORAGE", list_cost_cents: 5001 }
              as: PlatformAdmin
              captures: { cr4_id: "$.data.id" }
            - call: "POST /finops/commitments"
              payload: { commitment_type: "SAVINGS_PLAN", region: "us-east-1", term_start: "2026-06-30T00:00:00Z", term_end: "2026-09-01T00:00:00Z", hourly_commit_cents: 50, coverage_target_pct: 80.00, utilization_target_pct: 80.00 }
              as: FinOpsController
              as_user_id: "controller-1"
              captures: { com_id: "$.data.id" }
            - call: "POST /finops/commitments/${com_id}/activate"
              payload: {}
              as: FinOpsController
              as_user_id: "controller-1"
            - call: "POST /finops/allocation-runs"
              payload: { mode: "CHARGEBACK", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
              captures: { run_id: "$.data.id" }
            - call: "POST /finops/allocation-runs/${run_id}/shared-cost-pools"
              payload: { name: "untagged-absorption", methodology: "PROPORTIONAL", participant_business_unit_ids: ["${bu_a_id}", "${bu_b_id}"], proportional_basis: "HEADCOUNT" }
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
              captures: { pool_id: "$.data.id" }
            - call: "POST /finops/shared-cost-pools/${pool_id}/absorb-untagged"
              payload: { cost_record_ids: ["${cr4_id}"] }
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
            - call: "POST /finops/shared-cost-pools/${pool_id}/seal"
              payload: {}
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /finops/allocation-runs/${run_id}/compute"
              payload: { variant: "PROVISIONAL" }
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
              captures: { prov_total: "$.data.total_allocated_cents" }
            - call: "POST /finops/allocation-runs/${run_id}/compute"
              payload: { variant: "FINAL" }
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
              captures: { final_total: "$.data.total_allocated_cents" }
          assert:
            - "After the PROVISIONAL compute, AllocationRun.${run_id}.variant_applied == PROVISIONAL and total_allocated_cents == 35301"
            - "After the PROVISIONAL compute, AllocationRun.${run_id}.scoped_effective_cost_cents == 26967"
            - "After the FINAL compute, AllocationRun.${run_id}.variant_applied == FINAL and total_allocated_cents == 26967"
            - "${prov_total} - ${final_total} == 8334, equal to Commitment.${com_id}.total_discount_cents"
            - "AllocationRun.${run_id}.line_count == 4 after each compute (two DIRECT lines, two SHARED lines)"
            - "GET /finops/allocation-lines?allocation_run_id=${run_id}&line_kind=DIRECT returns the Platform BU line with method_applied == EFFECTIVE_BASIS and allocated_cents == 14644 after the FINAL compute"

      - name: budget_forecast_accuracy_mape_vs_period_end_divergence
        grounds:
          - calculations.forecast_accuracy_and_variance
          - entities.Budget.fields.accuracy_basis
          - entities.Budget.fields.forecast_history
          - entities.Budget.fields.forecast_accuracy_pct
          - concurrency_rules[budget-revise-stale-budget]
        distinguishing_aspect: |
          Dual-variant logic on a different entity domain - forecast quality scoring on Budget, not cost
          accounting on AllocationRun: with the identical revision trail [26000, 24000, 17000], standing
          forecast 28000 and actual spend 21000, MAPE_BASIS scores 80.95 while PERIOD_END_BASIS scores 66.67.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "One ACTIVE business unit Analytics BU with one PROVISIONED COMPUTE resource."
            - "Two non-overlapping budgets on that BU, each amount_cents 25610, each revised three times so forecast_history == [26000, 24000, 17000] and forecast_cents == 28000."
            - "Budget one covers 2026-08-01..2026-09-01 with accuracy_basis MAPE_BASIS; budget two covers 2026-09-01..2026-10-01 with accuracy_basis PERIOD_END_BASIS."
            - "Each budget period holds exactly one UNALLOCATED cost record of 21000 cents, so actual_spend_cents == 21000 for both."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /finops/business-units"
              payload: { name: "Analytics BU", cost_center_code: "CC-300", chargeback_enabled: true, headcount: 12 }
              as: PlatformAdmin
              captures: { bu_c_id: "$.data.id" }
            - call: "POST /finops/tagging-policies"
              payload: { name: "core-tags", mandatory_dimensions: ["team", "environment", "application"], enforcement_mode: "ADVISORY" }
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
              captures: { pol_id: "$.data.id" }
            - call: "POST /finops/tagging-policies/${pol_id}/activate"
              payload: {}
              as: FinOpsController
              as_user_id: "controller-1"
            - call: "POST /finops/provisioning-requests"
              payload: { tagging_policy_id: "${pol_id}", business_unit_id: "${bu_c_id}", resource_kind: "COMPUTE", requested_tags: { team: "analytics", environment: "prod", application: "warehouse" }, monthly_run_rate_cents: 21000, owner_user_id: "owner-3" }
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
              captures: { pr_c_id: "$.data.id" }
            - call: "POST /finops/provisioning-requests/${pr_c_id}/approve"
              payload: {}
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
            - call: "POST /finops/provisioning-requests/${pr_c_id}/provision"
              payload: {}
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
            - call: "GET /finops/cloud-resources"
              payload: { provisioning_request_id: "${pr_c_id}" }
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
              captures: { res_c_id: "$.data[0].id" }
            - call: "POST /finops/cost-records"
              payload: { cloud_resource_id: "${res_c_id}", billing_period_start: "2026-08-01T00:00:00Z", billing_period_end: "2026-09-01T00:00:00Z", resource_kind: "COMPUTE", list_cost_cents: 21000 }
              as: PlatformAdmin
            - call: "POST /finops/cost-records"
              payload: { cloud_resource_id: "${res_c_id}", billing_period_start: "2026-09-01T00:00:00Z", billing_period_end: "2026-10-01T00:00:00Z", resource_kind: "COMPUTE", list_cost_cents: 21000 }
              as: PlatformAdmin
            - call: "POST /finops/budgets"
              payload: { business_unit_id: "${bu_c_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", amount_cents: 25610, forecast_cents: 26000, accuracy_basis: "MAPE_BASIS" }
              as: FinOpsController
              as_user_id: "controller-1"
              captures: { b1_id: "$.data.id" }
            - call: "POST /finops/budgets/${b1_id}/activate"
              payload: {}
              as: FinOpsController
              as_user_id: "controller-1"
              captures: { b1_v1: "$.data.version" }
            - call: "POST /finops/budgets/${b1_id}/revise"
              payload: { expected_budget_version: "${b1_v1}", forecast_cents: 24000 }
              as: FinOpsController
              as_user_id: "controller-1"
              captures: { b1_v2: "$.data.version" }
            - call: "POST /finops/budgets/${b1_id}/revise"
              payload: { expected_budget_version: "${b1_v2}", forecast_cents: 17000 }
              as: FinOpsController
              as_user_id: "controller-1"
              captures: { b1_v3: "$.data.version" }
            - call: "POST /finops/budgets/${b1_id}/revise"
              payload: { expected_budget_version: "${b1_v3}", forecast_cents: 28000 }
              as: FinOpsController
              as_user_id: "controller-1"
            - call: "POST /finops/budgets"
              payload: { business_unit_id: "${bu_c_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", amount_cents: 25610, forecast_cents: 26000, accuracy_basis: "PERIOD_END_BASIS" }
              as: FinOpsController
              as_user_id: "controller-1"
              captures: { b2_id: "$.data.id" }
            - call: "POST /finops/budgets/${b2_id}/activate"
              payload: {}
              as: FinOpsController
              as_user_id: "controller-1"
              captures: { b2_v1: "$.data.version" }
            - call: "POST /finops/budgets/${b2_id}/revise"
              payload: { expected_budget_version: "${b2_v1}", forecast_cents: 24000 }
              as: FinOpsController
              as_user_id: "controller-1"
              captures: { b2_v2: "$.data.version" }
            - call: "POST /finops/budgets/${b2_id}/revise"
              payload: { expected_budget_version: "${b2_v2}", forecast_cents: 17000 }
              as: FinOpsController
              as_user_id: "controller-1"
              captures: { b2_v3: "$.data.version" }
            - call: "POST /finops/budgets/${b2_id}/revise"
              payload: { expected_budget_version: "${b2_v3}", forecast_cents: 28000 }
              as: FinOpsController
              as_user_id: "controller-1"
          trigger:
            - call: "POST /finops/budgets/${b1_id}/evaluate"
              payload: {}
              as: FinOpsController
              as_user_id: "controller-1"
            - call: "POST /finops/budgets/${b2_id}/evaluate"
              payload: {}
              as: FinOpsController
              as_user_id: "controller-1"
          assert:
            - "Budget.${b1_id}.actual_spend_cents == 21000 and Budget.${b2_id}.actual_spend_cents == 21000"
            - "Budget.${b1_id}.variance_cents == -4610 and Budget.${b1_id}.variance_pct == -18.00"
            - "Budget.${b1_id}.forecast_accuracy_pct == 80.95 and Budget.${b1_id}.accuracy_basis_applied == MAPE_BASIS"
            - "Budget.${b2_id}.forecast_accuracy_pct == 66.67 and Budget.${b2_id}.accuracy_basis_applied == PERIOD_END_BASIS"
            - "Budget.${b1_id}.forecast_history == [26000, 24000, 17000] and Budget.${b1_id}.revision_count == 3"
            - "Budget.${b1_id}.status == ACTIVE and Budget.${b1_id}.warning_flag == false"
  - rule_id: combinatorial_formula
    instances:
      - name: commitment_discount_round_per_record_then_sum
        mode: b
        grounds:
          - calculations.commitment_application_waterfall
          - calculations.commitment_application_waterfall.constants.DISCOUNT_RATE
          - state_machines.Commitment.PENDING_to_ACTIVE
          - entities.Commitment.fields.total_discount_cents
          - entities.CostRecord.fields.effective_cost_cents
        distinguishing_aspect: |
          Mode (b) - operation ordering: the discount must be rounded per cost record and only then summed.
          Three records of 10100 at SAVINGS_PLAN rate 0.275 give round(2777.5)=2778 each, so
          total_discount_cents == 8334; summing first (30300 * 0.275 = 8332.5) and rounding once gives 8333.
          The one-cent gap is the only observable difference, and it also shifts effective_cost_cents per record.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "One ACTIVE chargeback-enabled business unit with two PROVISIONED COMPUTE resources, plus a second unit with one."
            - "Exactly three COMPUTE cost records of list_cost_cents 10100 for 2026-07-01..2026-08-01, all UNALLOCATED."
            - "One PENDING SAVINGS_PLAN commitment in us-east-1, hourly_commit_cents 50 (committed_capacity_cents 36000), term 2026-06-30..2026-09-01, utilization_target_pct 80.00."
