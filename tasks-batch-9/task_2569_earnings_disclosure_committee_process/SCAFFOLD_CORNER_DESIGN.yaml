              payload: { action: "START" }
              as: Controller
              as_user_id: "${fin_b_id}"
              captures: { err_milestone: $.data.error_id }
          assert:
            - "${err_charter} == ERR_ENTITY_TERMINAL with HTTP 409"
            - "${err_member} == ERR_ENTITY_TERMINAL with HTTP 409"
            - "${err_milestone} == ERR_ENTITY_TERMINAL with HTTP 409"
