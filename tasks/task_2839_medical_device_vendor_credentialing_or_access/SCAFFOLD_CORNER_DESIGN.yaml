            - call: "POST /vendor-access/credentials"
              payload: { vendor_rep_id: "${rep_ada_id}", credential_type: "TRAINING_BLOODBORNE_PATHOGENS", issued_at_utc: "2026-07-01T00:00:00Z", expires_at_utc: "2027-07-01T00:00:00Z", document_reference: "BBP-AP-01" }
              as: CredentialingOfficer
