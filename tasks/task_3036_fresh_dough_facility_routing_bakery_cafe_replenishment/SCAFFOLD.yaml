# =============================================================================
# PRD Benchmark Seed Tables — task_3036
# Fresh Dough Facility Routing & Bakery-Cafe Replenishment (Panera Bread)
# =============================================================================

scenario: |
  Fresh Dough Facility Routing & Bakery-Cafe Replenishment (Panera Bread): regional dough
  facility production planning against next-day cafe orders, overnight delivery routes with
  time-window commitments to each cafe, dough shelf-life constraints driving order cutoffs
  and no-substitution rules, cafe-level baking schedules with proofing, bake-off and discard
  timing, day-end unsold bakery donation program with partner pickup logging, order accuracy
  adjustment when weather or events shift demand, facility capacity balancing across cafes
  in a district, cost allocation of dough facility overhead to company and franchise cafes.

domain_name: dough-facility-replenishment
api_prefix: /dough-ops

complexity_profile:
  primary_archetype: quota / allocation
  secondary_archetype: posture-driven gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops-run checkpoint

  entity_topology: hierarchical          # DoughFacility -> DeliveryRoute -> RouteStop tree; Cafe/DoughType flat peers; orders/invoices/schedules/pickups cross-referenced by FK
  state_machine_shape: branching         # Order amendment cycle + approval fork; parallel billing_status axis; route cancel cascading fork

  relationship_patterns:
    - one_to_many                        # Facility -> Route -> Stop
    - cross_aggregate                    # CafeOrder -> Cafe/DoughType/ProductionPlan; BakeEntry -> CafeSchedule; SettlementLine -> Invoice + Cafe

  role_model: peer_roles                 # FacilityPlanner, RouteDispatcher, CafeManager, DonationCoordinator each own distinct resources; FinanceAdmin overrides

  consistency_model: immediate

# All cafe-local times in this deployment are UTC; the logical clock (default
# 2026-09-01T00:00:00Z) is the only time source for cutoffs, windows, proofing,
# shelf-life, and schedule open/close decisions.
timezone_note: "cafe-local == UTC; logical clock governs all temporal rules"

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: DoughFacility
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Facility display name" }
      - { name: effective_capacity_units, type: integer, source: input, description: "Max effective units (conventional=1, artisan=2) the facility can produce per production date", constraints: "must be > 0" }

  - name: DoughType
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique dough type code, e.g. WHITE-CONV", constraints: "globally unique" }
      - { name: category, type: enum, source: input, description: "CONVENTIONAL | ARTISAN — ARTISAN occupies 2 effective capacity units per unit ordered" }
      - { name: shelf_life_hours, type: integer, source: input, description: "Hours from production start until dough expires", constraints: "must be > 0" }
      - { name: order_cutoff_local, type: string, source: input, description: "Cafe-local cutoff time 'HH:MM' on the day before production_date; orders and amendments at or after this instant are rejected", constraints: "format HH:MM, 00:00-23:59" }
      - { name: substitution_allowed, type: boolean, source: input, description: "No-substitution rule: when false, a shorted line ships short (SHIPPED_SHORT) and no other dough type may fill it" }
      - { name: flat_transfer_price, type: number, source: input, description: "Facility base transfer price per unit in dollars, before ownership markup; also the per-unit basis of donation credits", constraints: "must be > 0" }

  - name: Cafe
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Cafe display name" }
      - { name: facility_id, type: string, source: input, description: "FK -> DoughFacility.id; home facility that supplies this cafe" }
      - { name: ownership_type, type: enum, source: input, description: "COMPANY | FRANCHISE — drives transfer-pricing markup and overhead burden share" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Max outstanding receivable balance in cents; new order lines are rejected when exceeded", constraints: "must be > 0" }
      - { name: credit_balance_cents, type: integer, source: system, description: "Outstanding receivable: +invoice totals at INVOICED, -payments, -donation credits (floor 0); starts at 0" }

  - name: DemandAdjustment
    parent: null
    common_fields: true
    fields:
      - { name: cafe_id, type: string, source: input, description: "FK -> Cafe.id; cafe whose demand is adjusted" }
      - { name: production_date, type: string, source: input, description: "YYYY-MM-DD production date the adjustment applies to" }
      - { name: reason, type: enum, source: input, description: "WEATHER | EVENT — order accuracy adjustments when weather or events shift demand" }
      - { name: demand_delta_pct, type: integer, source: input, description: "Signed whole-percent demand shift, e.g. 20 or -40", constraints: "between -80 and +100" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED | RESCINDED" }
      - { name: superseded_by_id, type: string, source: system, description: "FK -> DemandAdjustment.id; set on the older ACTIVE adjustment when a new one is created for the same (cafe, production_date) — at most one adjustment is ACTIVE per (cafe, production_date)", default: null }

  - name: CafeOrder
    parent: null
    common_fields: true
    fields:
      - { name: cafe_id, type: string, source: input, description: "FK -> Cafe.id; ordering cafe" }
      - { name: dough_type_id, type: string, source: input, description: "FK -> DoughType.id; one order = one dough type line" }
      - { name: production_date, type: string, source: input, description: "YYYY-MM-DD date the dough is produced and delivered" }
      - { name: quantity, type: integer, source: input, description: "Requested units, > 0" }
      - { name: adjusted_quantity, type: integer, source: computed, description: "Planned units after the ACTIVE DemandAdjustment: floor(quantity * (100 + demand_delta_pct)/100), minimum 0; equals quantity when no adjustment is ACTIVE; recomputed on amendment and on adjustment activation" }
      - { name: expected_cafe_version, type: integer, source: input, description: "OCC token: Cafe.version the client last observed; rejected when stale" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> LOCKED -> PLANNED -> ROUTED -> DELIVERED / SHIPPED_SHORT / CANCELLED" }
      - { name: billing_status, type: enum, source: system, description: "UNBILLED -> INVOICED -> PAID / CREDITED; evolves independently of status", default: UNBILLED }
      - { name: actual_quantity, type: integer, source: system, description: "Units actually delivered; equals planned quantity except on SHIPPED_SHORT", default: null }

  - name: ProductionPlan
    parent: DoughFacility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: system, description: "FK -> DoughFacility.id; owning facility (path parent)" }
      - { name: production_date, type: string, source: input, description: "YYYY-MM-DD production date; unique per facility", constraints: "unique per facility_id" }
      - { name: status, type: enum, source: system, description: "OPEN -> LOCKED -> RELEASED -> CLOSED" }
      - { name: total_effective_units, type: integer, source: computed, description: "Sum over planned lines: conventional adjusted_quantity x1 + artisan adjusted_quantity x2" }
      - { name: over_capacity, type: boolean, source: computed, description: "total_effective_units > facility.effective_capacity_units" }

  - name: DeliveryRoute
    parent: DoughFacility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: system, description: "FK -> DoughFacility.id; owning facility (path parent)" }
      - { name: production_date, type: string, source: input, description: "YYYY-MM-DD; route runs overnight before this date" }
      - { name: status, type: enum, source: system, description: "DRAFT -> PUBLISHED -> IN_TRANSIT -> COMPLETED / CANCELLED" }
      - { name: vehicle_capacity_units, type: integer, source: input, description: "Raw units the truck carries (both categories count x1)", constraints: "must be > 0" }

  - name: RouteStop
    parent: DeliveryRoute
    common_fields: true
    fields:
      - { name: route_id, type: string, source: system, description: "FK -> DeliveryRoute.id; owning route (path parent)" }
      - { name: seq, type: integer, source: input, description: "Visit order on the route, unique per route, starts at 1" }
      - { name: cafe_id, type: string, source: input, description: "FK -> Cafe.id; stop's cafe" }
      - { name: planned_arrival, type: datetime, source: input, description: "Committed arrival instant; must fall inside the cafe's (window_start_local, window_end_local] half-open window" }
      - { name: window_start_local, type: string, source: input, description: "Cafe-local 'HH:MM' window open bound (exclusive)" }
      - { name: window_end_local, type: string, source: input, description: "Cafe-local 'HH:MM' window close bound (inclusive)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> ARRIVED -> ON_TIME / LATE / MISSED; CANCELLED" }
      - { name: actual_arrival, type: datetime, source: system, description: "Arrival timestamp recorded at arrival", default: null }
      - { name: planned_units, type: integer, source: input, description: "Raw units (both categories count x1) this stop will deliver; counts against the route's vehicle_capacity_units", constraints: "must be > 0" }
      - { name: loaded_units, type: integer, source: system, description: "Raw units actually loaded onto the truck for this stop; set at arrival (defaults to planned_units when the arrive payload omits it)", default: null }

  - name: CafeSchedule
    parent: Cafe
    common_fields: true
    fields:
      - { name: cafe_id, type: string, source: system, description: "FK -> Cafe.id; owning cafe (path parent)" }
      - { name: business_date, type: string, source: input, description: "YYYY-MM-DD bake day; unique per cafe", constraints: "unique per cafe_id" }
      - { name: status, type: enum, source: system, description: "PLANNED -> OPEN -> CLOSED" }

  - name: BakeEntry
    parent: CafeSchedule
    common_fields: true
    fields:
      - { name: schedule_id, type: string, source: system, description: "FK -> CafeSchedule.id; owning schedule (path parent)" }
      - { name: cafe_order_id, type: string, source: input, description: "FK -> CafeOrder.id; delivered/shipped-short order supplying the dough" }
      - { name: quantity, type: integer, source: input, description: "Units committed to this entry, > 0" }
      - { name: proof_start_at, type: datetime, source: input, description: "Proofing start instant" }
      - { name: proof_minutes, type: integer, source: input, description: "Proof duration; bake starts at proof_start_at + proof_minutes" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> PROOFING -> BAKING -> COMPLETED / DISCARDED" }

  - name: DonationPickup
    parent: Cafe
    common_fields: true
    fields:
      - { name: cafe_id, type: string, source: system, description: "FK -> Cafe.id; donating cafe (path parent)" }
      - { name: schedule_id, type: string, source: input, description: "FK -> CafeSchedule.id; day whose unsold goods are donated" }
      - { name: partner_name, type: string, source: input, description: "Donation partner organization name" }
      - { name: unsold_conventional, type: integer, source: input, description: "Unsold conventional units logged at pickup, >= 0" }
      - { name: unsold_artisan, type: integer, source: input, description: "Unsold artisan units logged at pickup, >= 0" }
      - { name: credit_amount, type: number, source: computed, description: "Donation credit in dollars: (unsold_conventional + unsold_artisan) x conventional flat_transfer_price of the facility's reference dough x 0.25, computed per formula donation_credit_calc; 2dp round_half_up" }
      - { name: status, type: enum, source: system, description: "LOGGED -> CONFIRMED / VOIDED" }

  - name: BillingPeriod
    parent: DoughFacility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: system, description: "FK -> DoughFacility.id; owning facility (path parent)" }
      - { name: period_start, type: string, source: input, description: "YYYY-MM-DD inclusive period start" }
      - { name: period_end, type: string, source: input, description: "YYYY-MM-DD inclusive period end" }
      - { name: status, type: enum, source: system, description: "OPEN -> CLOSED -> SETTLED" }
      - { name: admin_pool_cents, type: integer, source: input, description: "Facility administrative overhead pool for the period, in cents" }
      - { name: total_cafe_hours, type: integer, source: computed, description: "Sum of cafe_hours across the period's settlement lines, including zero-hour cafes" }

  - name: SettlementLine
    parent: BillingPeriod
    common_fields: true
    fields:
      - { name: billing_period_id, type: string, source: system, description: "FK -> BillingPeriod.id; owning period (path parent)" }
      - { name: cafe_id, type: string, source: input, description: "FK -> Cafe.id; cafe this line settles" }
      - { name: cafe_hours, type: integer, source: input, description: "Labor hours the cafe consumed in the period, >= 0" }
      - { name: direct_invoice_cents, type: integer, source: computed, description: "Sum of invoice totals for the cafe's INVOICED/PAID/CREDITED lines whose production_date falls in [period_start, period_end]" }
      - { name: allocated_indirect_cents, type: integer, source: computed, description: "admin_pool_cents x cafe_hours / total_cafe_hours, round_half_up" }
      - { name: burden_share, type: number, source: computed, description: "0.60 for FRANCHISE cafes, 0.45 for COMPANY cafes" }
      - { name: allocated_amount_cents, type: integer, source: computed, description: "Floor of allocated_indirect_cents x burden_share" }
      - { name: unit_allocated_cost, type: number, source: computed, description: "(direct_invoice_cents + allocated_amount_cents) / cafe_total_units, 2dp round_half_up; null when cafe_total_units is 0" }
      - { name: cafe_total_units, type: integer, source: computed, description: "FRANCHISE: all delivered units; COMPANY: artisan delivered units only (diverges from transfer_pricing's all-units divisor)" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: DemandAdjustment
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, RESCINDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (a new DemandAdjustment is created for the same (cafe_id, production_date) while this one is ACTIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "superseded_by_id set to the new adjustment's id"
          - "every affected CafeOrder in DRAFT/SUBMITTED/LOCKED for the same cafe+date recomputes adjusted_quantity from the new ACTIVE adjustment"

      - from: ACTIVE
        to: RESCINDED
        trigger: "POST /dough-ops/demand-adjustments/{adjustment_id}/rescind"
        actor: FacilityPlanner
        preconditions:
          - "Adjustment is ACTIVE"
        side_effects:
          - "every affected CafeOrder in DRAFT/SUBMITTED/LOCKED for the same cafe+date recomputes adjusted_quantity = quantity"

  - entity: CafeOrder
    initial_state: DRAFT
    terminal_states: [DELIVERED, SHIPPED_SHORT, CANCELLED]
    note: "status and billing_status are parallel state dimensions on one entity and evolve independently"
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /dough-ops/cafe-orders/{order_id}/submit"
        actor: CafeManager
        preconditions:
          - "Order is DRAFT"
          - "cafe.ownership_type is resolvable and credit check passes: cafe.credit_balance_cents + provisional invoice total <= cafe.credit_limit_cents (provisional total = quantity x current unit transfer price)"
          - "current cafe-local time is strictly before dough_type.order_cutoff_local on the day before production_date"
        side_effects:
          - "increments Cafe.version by 1 (order write touches the cafe aggregate)"

      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /dough-ops/cafe-orders/{order_id}/amend"
        actor: CafeManager
        preconditions:
          - "Order is SUBMITTED"
          - "current cafe-local time is strictly before the order cutoff"
        side_effects:
          - "quantity and adjusted_quantity replaced by payload values"
          - "increments Cafe.version by 1"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /dough-ops/cafe-orders/{order_id}/cancel"
        actor: CafeManager
        preconditions:
          - "Order is DRAFT or SUBMITTED"
        side_effects:
          - "increments Cafe.version by 1"

      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /dough-ops/cafe-orders/{order_id}/cancel"
        actor: CafeManager
        preconditions:
          - "Order is DRAFT or SUBMITTED"
        side_effects:
          - "increments Cafe.version by 1"

      - from: SUBMITTED
        to: LOCKED
        trigger: "POST /dough-ops/cafe-orders/{order_id}/submit when the submission is the last amendment window close, or system at order cutoff (auto-lock sweep)"
        actor: system
        preconditions:
          - "Order is SUBMITTED"
          - "current cafe-local time >= dough_type.order_cutoff_local on the day before production_date"
        side_effects:
          - "order becomes immutable; further amend/cancel rejected with ERR_ORDER_LOCKED"

      - from: LOCKED
        to: PLANNED
        trigger: "POST /dough-ops/facilities/{facility_id}/production-plans (plan create sweeps all LOCKED orders for the facility+date)"
        actor: FacilityPlanner
        preconditions:
          - "ProductionPlan for (facility, production_date) exists and is OPEN"
        side_effects:
          - "order attached to the plan"
          - "ProductionPlan.total_effective_units recomputed"
          - "ProductionPlan.over_capacity recomputed"

      - from: PLANNED
        to: ROUTED
        trigger: "POST /dough-ops/facilities/{facility_id}/production-plans/{plan_id}/release"
        actor: FacilityPlanner
        preconditions:
          - "ProductionPlan is LOCKED and not over_capacity"
        side_effects:
          - "each planned order moves to ROUTED"
          - "planned quantities become the route load plan"

      - from: ROUTED
        to: DELIVERED
        trigger: "POST /dough-ops/facilities/{facility_id}/routes/{route_id}/stops/{stop_id}/arrive (stop arrival with all of the stop's order lines intact)"
        actor: RouteDispatcher
        preconditions:
          - "Route is IN_TRANSIT or COMPLETED-eligible"
          - "dough_type.substitution_allowed is true OR full planned quantity is on the truck"
        side_effects:
          - "actual_quantity set to planned quantity"
          - "billing_status stays UNBILLED until plan CLOSE invoices the day"

      - from: ROUTED
        to: SHIPPED_SHORT
        trigger: "POST /dough-ops/facilities/{facility_id}/routes/{route_id}/stops/{stop_id}/arrive (stop arrival with a shortage on a no-substitution dough type)"
        actor: RouteDispatcher
        preconditions:
          - "dough_type.substitution_allowed is false and loaded quantity < planned quantity"
        side_effects:
          - "actual_quantity set to loaded quantity"
          - "invoice will bill actual_quantity only"

      - from: DRAFT
        to: CANCELLED
        trigger: "system (route CANCELLED cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "billing_status forced to CREDITED with a zero invoice (no charge for undelivered day)"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "system (route CANCELLED cascade)"
        actor: system
        preconditions: []
        side_effects: ["same as DRAFT -> CANCELLED"]
      - from: LOCKED
        to: CANCELLED
        trigger: "system (route CANCELLED cascade)"
        actor: system
        preconditions: []
        side_effects: ["same as DRAFT -> CANCELLED"]
      - from: PLANNED
        to: CANCELLED
        trigger: "system (route CANCELLED cascade)"
        actor: system
        preconditions: []
        side_effects: ["same as DRAFT -> CANCELLED"]
      - from: ROUTED
        to: CANCELLED
        trigger: "system (route CANCELLED cascade)"
        actor: system
        preconditions: []
        side_effects: ["same as DRAFT -> CANCELLED"]

  - entity: ProductionPlan
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /dough-ops/facilities/{facility_id}/production-plans/{plan_id}/lock"
        actor: FacilityPlanner
        preconditions:
          - "Plan is OPEN"
          - "total_effective_units <= facility.effective_capacity_units (hard gate; over-capacity plans cannot lock)"
        side_effects:
          - "attached orders already PLANNED; late LOCKED orders after lock are rejected with ERR_PLAN_LOCKED"

      - from: LOCKED
        to: RELEASED
        trigger: "POST /dough-ops/facilities/{facility_id}/production-plans/{plan_id}/release"
        actor: FacilityPlanner
        preconditions:
          - "Plan is LOCKED"
          - "over_capacity is false"
        side_effects:
          - "each attached order PLANNED -> ROUTED"
          - "route stop availability becomes the delivery constraint"

      - from: RELEASED
        to: CLOSED
        trigger: "POST /dough-ops/facilities/{facility_id}/production-plans/{plan_id}/close"
        actor: FacilityPlanner
        preconditions:
          - "Plan is RELEASED"
          - "every attached order is in a terminal state (DELIVERED / SHIPPED_SHORT / CANCELLED)"
        side_effects:
          - "creates one invoice line per delivered/shipped-short order via transfer_pricing"
          - "each billed order billing_status UNBILLED -> INVOICED"
          - "cafe.credit_balance_cents increases by each invoice total"

  - entity: DeliveryRoute
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /dough-ops/facilities/{facility_id}/routes/{route_id}/publish"
        actor: RouteDispatcher
        preconditions:
          - "Route is DRAFT"
          - "at least one RouteStop exists"
          - "sum of stop planned raw units <= vehicle_capacity_units"
        side_effects: []

      - from: PUBLISHED
        to: IN_TRANSIT
        trigger: "POST /dough-ops/facilities/{facility_id}/routes/{route_id}/depart"
        actor: RouteDispatcher
        preconditions:
          - "Route is PUBLISHED"
        side_effects: []

      - from: IN_TRANSIT
        to: COMPLETED
        trigger: "system (when every RouteStop reaches ON_TIME / LATE / MISSED / CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /dough-ops/facilities/{facility_id}/routes/{route_id}/cancel"
        actor: RouteDispatcher
        preconditions: ["Route is DRAFT or PUBLISHED"]
        side_effects:
          - "each RouteStop -> CANCELLED"
          - "each stop's orders -> CANCELLED"
          - "each cancelled order billing_status -> CREDITED with a zero invoice"
          - "cafe.credit_balance_cents unchanged (zero invoice)"

      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /dough-ops/facilities/{facility_id}/routes/{route_id}/cancel"
        actor: RouteDispatcher
        preconditions: ["Route is DRAFT or PUBLISHED"]
        side_effects: ["same cascade as DRAFT -> CANCELLED"]

  - entity: RouteStop
    initial_state: SCHEDULED
    terminal_states: [ON_TIME, LATE, MISSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ARRIVED
        trigger: "POST /dough-ops/facilities/{facility_id}/routes/{route_id}/stops/{stop_id}/arrive"
        actor: RouteDispatcher
        preconditions:
          - "Route is IN_TRANSIT"
          - "all earlier-seq stops on the route are in a terminal state (in-order arrival)"
        side_effects:
          - "actual_arrival set to current clock"
          - "stop's orders ROUTED -> DELIVERED (or SHIPPED_SHORT when short on no-substitution dough)"
          - "auto-resolve: if actual_arrival inside (window_start_local, window_end_local] -> ON_TIME; if before window open -> rejected ERR_STOP_WINDOW_VIOLATION; if after window_end_local -> LATE; if after midnight local -> MISSED"

      - from: ARRIVED
        to: ON_TIME
        trigger: "system (window auto-resolution on arrival)"
        actor: system
        preconditions: ["actual_arrival within (window_start_local, window_end_local]"]
        side_effects: []

      - from: ARRIVED
        to: LATE
        trigger: "system (window auto-resolution on arrival)"
        actor: system
        preconditions: ["actual_arrival after window_end_local, same local day"]
        side_effects: []

      - from: ARRIVED
        to: MISSED
        trigger: "system (window auto-resolution on arrival)"
        actor: system
        preconditions: ["actual_arrival on a later local day than planned"]
        side_effects: []

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (route CANCELLED cascade)"
        actor: system
        preconditions: []
        side_effects: ["stop's orders -> CANCELLED; billing_status -> CREDITED (zero invoice)"]

  - entity: CafeSchedule
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "POST /dough-ops/cafes/{cafe_id}/schedules/{schedule_id}/open"
        actor: CafeManager
        preconditions:
          - "Schedule is PLANNED"
          - "current cafe-local date == business_date"
        side_effects: []

      - from: OPEN
        to: CLOSED
        trigger: "POST /dough-ops/cafes/{cafe_id}/schedules/{schedule_id}/close"
        actor: CafeManager
        preconditions:
          - "Schedule is OPEN"
          - "every BakeEntry is COMPLETED or DISCARDED"
        side_effects:
          - "unsold counts become available for DonationPickup logging"

  - entity: BakeEntry
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, DISCARDED]
    transitions:
      - from: SCHEDULED
        to: PROOFING
        trigger: "POST /dough-ops/cafes/{cafe_id}/schedules/{schedule_id}/entries/{entry_id}/start-proof"
        actor: CafeManager
        preconditions:
          - "Schedule is OPEN"
          - "cafe_order is DELIVERED or SHIPPED_SHORT"
          - "current time >= proof_start_at"
        side_effects: []

      - from: PROOFING
        to: BAKING
        trigger: "POST /dough-ops/cafes/{cafe_id}/schedules/{schedule_id}/entries/{entry_id}/start-bake"
        actor: CafeManager
        preconditions:
          - "Entry is PROOFING"
          - "current time >= proof_start_at + proof_minutes"
          - "dough not expired: current time < order.production_date 00:00 local + dough_type.shelf_life_hours"
        side_effects: []

      - from: BAKING
        to: COMPLETED
        trigger: "POST /dough-ops/cafes/{cafe_id}/schedules/{schedule_id}/entries/{entry_id}/complete"
        actor: CafeManager
        preconditions: ["Entry is BAKING"]
        side_effects: []

      - from: PROOFING
        to: DISCARDED
        trigger: "POST /dough-ops/cafes/{cafe_id}/schedules/{schedule_id}/entries/{entry_id}/discard"
        actor: CafeManager
        preconditions:
          - "Entry is PROOFING or BAKING"
        side_effects: []

      - from: BAKING
        to: DISCARDED
        trigger: "POST /dough-ops/cafes/{cafe_id}/schedules/{schedule_id}/entries/{entry_id}/discard"
        actor: CafeManager
        preconditions:
          - "Entry is PROOFING or BAKING"
        side_effects: []

  - entity: DonationPickup
    initial_state: LOGGED
    terminal_states: [CONFIRMED, VOIDED]
    transitions:
      - from: LOGGED
        to: CONFIRMED
        trigger: "POST /dough-ops/cafes/{cafe_id}/donation-pickups/{pickup_id}/confirm"
        actor: DonationCoordinator
        preconditions:
          - "Pickup is LOGGED"
          - "CafeSchedule is CLOSED"
        side_effects:
          - "credit_amount computed via donation_credit_calc"
          - "cafe.credit_balance_cents decreases by credit_amount (floor 0)"
          - "CREDITED billing lines remain CREDITED (donation credit does not reopen invoices)"

      - from: LOGGED
        to: VOIDED
        trigger: "POST /dough-ops/cafes/{cafe_id}/donation-pickups/{pickup_id}/void"
        actor: DonationCoordinator
        preconditions: ["Pickup is LOGGED"]
        side_effects: []

  - entity: BillingPeriod
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /dough-ops/facilities/{facility_id}/billing-periods/{period_id}/close"
        actor: FinanceAdmin
        preconditions:
          - "Period is OPEN"
          - "at least one SettlementLine exists"
        side_effects:
          - "computes direct_invoice_cents, allocated_indirect_cents, allocated_amount_cents, unit_allocated_cost per line via overhead_allocation"
          - "total_cafe_hours recomputed"

      - from: CLOSED
        to: SETTLED
        trigger: "POST /dough-ops/facilities/{facility_id}/billing-periods/{period_id}/settle"
        actor: FinanceAdmin
        preconditions: ["Period is CLOSED"]
        side_effects:
          - "settlement amounts become authoritative; lines immutable"

  - entity: CafeOrder.billing_status
    initial_state: UNBILLED
    terminal_states: [PAID, CREDITED]
    note: "parallel state dimension; transitions here are disjoint from status transitions"
    transitions:
      - from: UNBILLED
        to: INVOICED
        trigger: "system (ProductionPlan CLOSE invoices the order)"
        actor: system
        preconditions: ["order.status is DELIVERED or SHIPPED_SHORT"]
        side_effects:
          - "cafe.credit_balance_cents += invoice_total_cents"

      - from: INVOICED
        to: PAID
        trigger: "POST /dough-ops/cafes/{cafe_id}/payments"
        actor: FinanceAdmin
        preconditions:
          - "payment amount_cents > 0"
        side_effects:
          - "cafe.credit_balance_cents -= amount_cents"
          - "orders with billing_status INVOICED are settled oldest-first (earliest CafeOrder.created_at first) until the payment is exhausted; an order moves to PAID only when its invoice is fully covered; a partial remainder leaves the oldest unpaid order INVOICED"

      - from: UNBILLED
        to: CREDITED
        trigger: "system (route CANCELLED zero-invoice, or donation credit posts against an unbilled order)"
        actor: system
        preconditions: []
        side_effects:
          - "no charge; cafe.credit_balance_cents unchanged for zero invoices"

# =============================================================================
# Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: order-write-stale-cafe
    parent_entity: Cafe
    write_endpoint: "POST /dough-ops/cafe-orders"
    occ_field: "expected_cafe_version"
    description: |
      Creating or amending a CafeOrder against a Cafe whose version has advanced
      since the client last observed it is rejected. A prior order submit/amend/
      cancel or payment has legitimately moved the cafe aggregate (credit balance
      or version) and the current writer's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: plan-release-stale-facility
    parent_entity: DoughFacility
    write_endpoint: "POST /dough-ops/facilities/{facility_id}/production-plans/{plan_id}/release"
    occ_field: "expected_facility_version"
    description: |
      Releasing a ProductionPlan against a DoughFacility whose version has
      advanced since the client last observed it is rejected; capacity or an
      overlapping plan changed under the client's feet.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: effective_units
    trigger: "production plan create, order attach, order amendment while plan OPEN"
    algorithm: aggregation
    formula: |
      total_effective_units = sum over attached orders:
        dough_type.category == CONVENTIONAL -> adjusted_quantity x 1
        dough_type.category == ARTISAN      -> adjusted_quantity x 2
      over_capacity = total_effective_units > facility.effective_capacity_units
    input_set: "CafeOrder in PLANNED status attached to this plan only"
    constants:
      ARTISAN_UNIT_WEIGHT: 2
      CONVENTIONAL_UNIT_WEIGHT: 1
    precision: "integer units"

  - name: capacity_tiebreak
    trigger: "production plan lock when total_effective_units exceeds capacity"
    algorithm: threshold
    formula: |
      Lock is a hard gate: over_capacity plans cannot lock at all. Before lock,
      the planner may detach orders to fit; detachment picks the smallest
      effective-unit order first; ties break by earliest CafeOrder.created_at.
    input_set: "PLANNED orders attached to the plan"
    constants: {}
    precision: "integer units"
    variants: []

  - name: transfer_pricing
    trigger: "production plan close — invoice line creation per order"
    algorithm: tiered_pricing
    formula: |
      unit_price = round_half_up(flat_transfer_price x (1 + markup_pct/100), 2)
      where markup_pct = 18 when cafe.ownership_type == COMPANY, else 12 (FRANCHISE)
      unit_price = max(unit_price, price_floor)
      invoice_total_cents = unit_price x actual_quantity (x100, integer cents)
      price_floor = 4.00 when category == ARTISAN else 3.50
    input_set: "orders in DELIVERED or SHIPPED_SHORT attached to the closing plan"
    constants:
      COMPANY_MARKUP_PCT: 18
      FRANCHISE_MARKUP_PCT: 12
      ARTISAN_PRICE_FLOOR: 4.00
      CONVENTIONAL_PRICE_FLOOR: 3.50
    precision: "2 decimal places on unit_price, round_half_up; invoice_total_cents is an exact integer (round unit THEN multiply — pinned order)"
    variants:
      - name: provisional_at_submit
        when: "credit-check at order submit"
        difference: "uses quantity (not actual_quantity) and the current unit price to project the invoice; provisional and final diverge when a demand adjustment changes adjusted_quantity before close, or when the line ships short"
      - name: final_at_close
        when: "production plan close"
        difference: "uses actual_quantity (planned minus shortage) — the authoritative invoice amount"

  - name: donation_credit_calc
    trigger: "donation pickup confirm"
    algorithm: aggregation
    formula: |
      credit_amount = round_half_up((unsold_conventional + unsold_artisan)
                        x conventional_flat_transfer_price x 0.25, 2)
      conventional_flat_transfer_price = the facility's reference CONVENTIONAL
      dough type's flat_transfer_price (lowest shelf_life_hours; ties: earliest
      DoughType.created_at). Donation credit always prices at the conventional
      rate even when the unsold units are artisan.
    input_set: "the pickup's unsold unit counts only"
    constants:
      DONATION_CREDIT_RATE: 0.25
    precision: "2 decimal places, round_half_up"

  - name: overhead_allocation
    trigger: "billing period close"
    algorithm: waterfall_allocation
    formula: |
      total_cafe_hours = sum of SettlementLine.cafe_hours over the period (zero included)
      per line:
        allocated_indirect_cents = round_half_up(admin_pool_cents x cafe_hours / total_cafe_hours, 0)
        burden_share = 0.60 if cafe.ownership_type == FRANCHISE else 0.45
        allocated_amount_cents = floor(allocated_indirect_cents x burden_share)
        cafe_total_units:
            FRANCHISE -> all delivered units in the period
            COMPANY   -> artisan delivered units only
        unit_allocated_cost = round_half_up((direct_invoice_cents + allocated_amount_cents) / cafe_total_units, 2)   # null when cafe_total_units == 0
      # circular-looking dependency pinned: total_cafe_hours is computed in pass 1
      # over all lines BEFORE any per-line allocation in pass 2; per-line values
      # never feed back into total_cafe_hours.
    input_set: "settlement lines of the closing period; invoices with production_date inside [period_start, period_end] and billing_status IN {INVOICED, PAID, CREDITED}"
    constants:
      FRANCHISE_BURDEN_SHARE: 0.60
      COMPANY_BURDEN_SHARE: 0.45
    precision: "integer cents for allocated amounts (round_half_up on the indirect share, floor on the burden multiplication); 2dp round_half_up on unit_allocated_cost"
    variants:
      - name: franchise_all_units
        when: "cafe.ownership_type == FRANCHISE"
        difference: "unit_allocated_cost divides by ALL delivered units"
      - name: company_artisan_only
        when: "cafe.ownership_type == COMPANY"
        difference: "unit_allocated_cost divides by ARTISAN delivered units only — same ledger data, different denominator, different unit cost from transfer_pricing's all-units basis"

  - name: payment_waterfall
    trigger: "cafe payment post"
    algorithm: waterfall_allocation
    formula: |
      Apply amount_cents to the cafe's INVOICED orders oldest-first by
      CafeOrder.created_at (ties impossible — server timestamps are unique).
      An order becomes PAID only when fully covered; any remainder stays on the
      oldest partially-paid order, which remains INVOICED.
    input_set: "orders of this cafe with billing_status == INVOICED"
    constants: {}
    precision: "integer cents"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and names a declared role; X-User-ID present for entity_backed roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per the RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every id in the path exists (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: business_referential
    check: "Body foreign keys resolve (cafe_id, dough_type_id, schedule_id, cafe_order_id) and belong to the path parent"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all creation endpoints"

  - priority: 5
    category: state
    check: "Target resource is in a state that permits this transition per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "Order is not LOCKED (or later) for amend/cancel; plan not LOCKED for attach"
    error_id: ERR_ORDER_LOCKED
    http_status: 409
    applies_to: "order amend/cancel; plan attach"

  - priority: 7
    category: business_temporal
    check: "Order submit/amend happens strictly before dough_type.order_cutoff_local on the day before production_date"
    error_id: ERR_ORDER_CUTOFF_PASSED
    http_status: 409
    applies_to: "order submit, order amend"

  - priority: 8
    category: business_safety
    check: "No-substitution rule: a short shipment on a dough type with substitution_allowed=false cannot be filled by another dough type; line must ship SHIPPED_SHORT"
    error_id: ERR_SUBSTITUTION_FORBIDDEN
    http_status: 422
    applies_to: "stop arrive"

  - priority: 9
    category: business_safety
    check: "Shelf-life: bake start must be strictly before production_date 00:00 local + shelf_life_hours"
    error_id: ERR_SHELF_LIFE_EXCEEDED
    http_status: 422
    applies_to: "bake entry start-bake"

  - priority: 10
    category: business_temporal
    check: "RouteStop planned_arrival must fall inside (window_start_local, window_end_local]; two stops on the same cafe must not have overlapping windows with zero gap"
    error_id: ERR_STOP_WINDOW_VIOLATION
    http_status: 422
    applies_to: "route stop create, stop arrive"

  - priority: 11
    category: business_fiscal
    check: "Credit limit: cafe.credit_balance_cents + provisional invoice total <= cafe.credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "order submit"

  - priority: 12
    category: business_constraint
    check: "Capacity: plan lock requires total_effective_units <= effective_capacity_units; route publish requires stop load <= vehicle_capacity_units"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "plan lock, route publish"

  - priority: 13
    category: business_constraint
    check: "Uniqueness: one ProductionPlan per (facility, production_date); one CafeSchedule per (cafe, business_date); one ACTIVE DemandAdjustment per (cafe, production_date)"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "plan create, schedule create, adjustment create"

  - priority: 14
    category: business_temporal
    check: "Proof timing: start-proof requires now >= proof_start_at; start-bake requires now >= proof_start_at + proof_minutes"
    error_id: ERR_TOO_EARLY
    http_status: 409
    applies_to: "bake entry start-proof, start-bake"

  - priority: 15
    category: business_fiscal
    check: "OCC: expected_*_version must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "order create/amend, plan release"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- test-driving clock (mandatory default: 2026-09-01T00:00:00Z) ---
  - method: POST
    path: "/dough-ops/_clock/set_current_utc"
    description: "Set the logical clock. Before any call the clock reads exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [FacilityPlanner, RouteDispatcher, CafeManager, DonationCoordinator, FinanceAdmin]
    code: 200
    input: [to_iso8601]
    output: { now_iso8601: string }
    side_effects: ["logical clock advanced"]

  # --- DoughFacility ---
  - method: POST
    path: "/dough-ops/facilities"
    description: "Create a dough facility"
    roles: [FacilityPlanner]
    code: 201
    input: [name, effective_capacity_units]
    output: DoughFacility
    side_effects: []

  - method: GET
    path: "/dough-ops/facilities/{facility_id}"
    description: "Get a facility"
    roles: [FacilityPlanner, RouteDispatcher, CafeManager, DonationCoordinator, FinanceAdmin]
    code: 200
    input: []
    output: DoughFacility
    side_effects: []

  # --- DoughType ---
  - method: POST
    path: "/dough-ops/dough-types"
    description: "Create a dough type"
    roles: [FacilityPlanner]
    code: 201
    input: [code, category, shelf_life_hours, order_cutoff_local, substitution_allowed, flat_transfer_price]
    output: DoughType
    side_effects: []

  - method: GET
    path: "/dough-ops/dough-types"
    description: "List dough types"
    roles: [FacilityPlanner, RouteDispatcher, CafeManager, DonationCoordinator, FinanceAdmin]
    code: 200
    input: ["category?", "limit?", "offset?"]
    output: DoughType[]
    side_effects: []

  - method: GET
    path: "/dough-ops/dough-types/{dough_type_id}"
    description: "Get a dough type"
    roles: [FacilityPlanner, RouteDispatcher, CafeManager, DonationCoordinator, FinanceAdmin]
    code: 200
    input: []
    output: DoughType
    side_effects: []

  # --- Cafe ---
  - method: POST
    path: "/dough-ops/cafes"
    description: "Create a cafe"
    roles: [FacilityPlanner]
    code: 201
    input: [name, facility_id, ownership_type, credit_limit_cents]
    output: Cafe
    side_effects: ["credit_balance_cents initialized to 0"]

  - method: GET
    path: "/dough-ops/cafes"
    description: "List cafes"
    roles: [FacilityPlanner, RouteDispatcher, CafeManager, DonationCoordinator, FinanceAdmin]
    code: 200
    input: ["facility_id?", "ownership_type?", "limit?", "offset?"]
    output: Cafe[]
    side_effects: []

  - method: GET
    path: "/dough-ops/cafes/{cafe_id}"
    description: "Get a cafe"
    roles: [FacilityPlanner, RouteDispatcher, CafeManager, DonationCoordinator, FinanceAdmin]
    code: 200
    input: []
    output: Cafe
    side_effects: []

  - method: POST
    path: "/dough-ops/cafes/{cafe_id}/payments"
    description: "Post a payment against the cafe's outstanding invoices (oldest-first waterfall)"
    roles: [FinanceAdmin]
    code: 201
    input: [amount_cents]
    output: { applied_cents: integer, settled_order_ids: "string[]", credit_balance_cents: integer }
    side_effects:
      - "payment_waterfall applied"
      - "cafe.credit_balance_cents -= amount_cents"
      - "fully covered INVOICED orders -> PAID"
      - "increments Cafe.version by 1"

  # --- DemandAdjustment ---
  - method: POST
    path: "/dough-ops/demand-adjustments"
    description: "Create a weather/event demand adjustment for a cafe+date; supersedes any ACTIVE adjustment for the same (cafe, date)"
    roles: [FacilityPlanner]
    code: 201
    input: [cafe_id, production_date, reason, demand_delta_pct]
    output: DemandAdjustment
    side_effects:
      - "prior ACTIVE adjustment for same (cafe, production_date) -> SUPERSEDED with superseded_by_id set"
      - "affected orders in DRAFT/SUBMITTED/LOCKED recompute adjusted_quantity"

  - method: GET
    path: "/dough-ops/demand-adjustments"
    description: "List demand adjustments"
    roles: [FacilityPlanner, RouteDispatcher, CafeManager, DonationCoordinator, FinanceAdmin]
    code: 200
    input: ["cafe_id?", "production_date?", "status?", "superseded_by_id?", "limit?", "offset?"]
    output: DemandAdjustment[]
    side_effects: []

  - method: GET
    path: "/dough-ops/demand-adjustments/{adjustment_id}"
    description: "Get a demand adjustment"
    roles: [FacilityPlanner, RouteDispatcher, CafeManager, DonationCoordinator, FinanceAdmin]
    code: 200
    input: []
    output: DemandAdjustment
    side_effects: []

  - method: POST
    path: "/dough-ops/demand-adjustments/{adjustment_id}/rescind"
    description: "Rescind an ACTIVE adjustment; affected orders revert to adjusted_quantity = quantity"
    roles: [FacilityPlanner]
    code: 200
    input: []
    output: DemandAdjustment
    side_effects: ["affected orders recompute adjusted_quantity = quantity"]

  # --- CafeOrder ---
  - method: POST
    path: "/dough-ops/cafe-orders"
    description: "Create a next-day dough order (OCC on Cafe.version)"
    roles: [CafeManager]
    code: 201
    input: [cafe_id, dough_type_id, production_date, quantity, expected_cafe_version]
    output: CafeOrder
    side_effects:
      - "adjusted_quantity initialized from ACTIVE DemandAdjustment if any"
      - "increments Cafe.version by 1"

  - method: GET
    path: "/dough-ops/cafe-orders"
    description: "List orders"
    roles: [FacilityPlanner, RouteDispatcher, CafeManager, DonationCoordinator, FinanceAdmin]
    code: 200
    input: ["cafe_id?", "dough_type_id?", "production_date?", "status?", "billing_status?", "limit?", "offset?"]
    output: CafeOrder[]
    side_effects: []

  - method: GET
    path: "/dough-ops/cafe-orders/{order_id}"
    description: "Get an order"
    roles: [FacilityPlanner, RouteDispatcher, CafeManager, DonationCoordinator, FinanceAdmin]
    code: 200
    input: []
    output: CafeOrder
    side_effects: []

  - method: POST
    path: "/dough-ops/cafe-orders/{order_id}/submit"
    description: "Submit a DRAFT order (credit check + cutoff check)"
    roles: [CafeManager]
    code: 200
    input: []
    output: CafeOrder
    side_effects:
      - "increments Cafe.version by 1"
      - "system: when the order cutoff has already passed, SUBMITTED -> LOCKED (auto-lock sweep)"

  - method: POST
    path: "/dough-ops/cafe-orders/{order_id}/amend"
    description: "Amend a SUBMITTED order quantity (before cutoff)"
    roles: [CafeManager]
    code: 200
    input: [quantity, expected_cafe_version]
    output: CafeOrder
    side_effects: ["adjusted_quantity recomputed", "increments Cafe.version by 1"]

  - method: POST
    path: "/dough-ops/cafe-orders/{order_id}/cancel"
    description: "Cancel a DRAFT or SUBMITTED order (before cutoff)"
    roles: [CafeManager]
    code: 200
    input: []
    output: CafeOrder
    side_effects: ["increments Cafe.version by 1"]

  # --- ProductionPlan ---
  - method: POST
    path: "/dough-ops/facilities/{facility_id}/production-plans"
    description: "Create a production plan; sweeps all LOCKED orders for the facility+date into the plan"
    roles: [FacilityPlanner]
    code: 201
    input: [production_date]
    output: ProductionPlan
    side_effects:
      - "matching LOCKED CafeOrders -> PLANNED"
      - "total_effective_units and over_capacity computed"
      - "increments DoughFacility.version by 1"

  - method: GET
    path: "/dough-ops/facilities/{facility_id}/production-plans"
    description: "List production plans for a facility"
    roles: [FacilityPlanner, RouteDispatcher, CafeManager, DonationCoordinator, FinanceAdmin]
    code: 200
    input: ["production_date?", "status?", "limit?", "offset?"]
    output: ProductionPlan[]
    side_effects: []

  - method: GET
    path: "/dough-ops/production-plans"
    description: "Flat list of production plans across facilities"
    roles: [FacilityPlanner, RouteDispatcher, CafeManager, DonationCoordinator, FinanceAdmin]
    code: 200
    input: ["facility_id?", "production_date?", "status?", "limit?", "offset?"]
    output: ProductionPlan[]
    side_effects: []

  - method: GET
    path: "/dough-ops/production-plans/{plan_id}"
    description: "Get a production plan"
    roles: [FacilityPlanner, RouteDispatcher, CafeManager, DonationCoordinator, FinanceAdmin]
    code: 200
    input: []
    output: ProductionPlan
    side_effects: []

  - method: POST
    path: "/dough-ops/facilities/{facility_id}/production-plans/{plan_id}/lock"
    description: "Lock an OPEN plan (capacity hard gate)"
    roles: [FacilityPlanner]
    code: 200
    input: []
    output: ProductionPlan
    side_effects: ["increments DoughFacility.version by 1"]

  - method: POST
    path: "/dough-ops/facilities/{facility_id}/production-plans/{plan_id}/release"
    description: "Release a LOCKED plan; attached orders PLANNED -> ROUTED (OCC on DoughFacility.version)"
    roles: [FacilityPlanner]
    code: 200
    input: [expected_facility_version]
    output: ProductionPlan
    side_effects:
      - "attached orders PLANNED -> ROUTED"
      - "increments DoughFacility.version by 1"

  - method: POST
    path: "/dough-ops/facilities/{facility_id}/production-plans/{plan_id}/close"
    description: "Close a RELEASED plan once all orders are terminal; invoices each delivered/shipped-short order"
    roles: [FacilityPlanner]
    code: 200
    input: []
    output: ProductionPlan
    side_effects:
      - "transfer_pricing per order; billing_status -> INVOICED"
      - "cafe.credit_balance_cents += invoice totals"
      - "increments DoughFacility.version by 1"

  # --- DeliveryRoute ---
  - method: POST
    path: "/dough-ops/facilities/{facility_id}/routes"
    description: "Create an overnight delivery route"
    roles: [RouteDispatcher]
    code: 201
    input: [production_date, vehicle_capacity_units]
    output: DeliveryRoute
