            - call: "POST /institutions/enrollments"
              payload: { student_id: "${stu_17}", term_id: "${term_q}", plan_template_id: "${tpl_q}" }
              as: Registrar
              captures: { enr_17: $.data.id }
            - call: "POST /institutions/charges"
              payload: { enrollment_id: "${enr_17}", kind: "TUITION", amount_cents: 500000 }
              as: Registrar
            - call: "POST /institutions/aids"
              payload: { enrollment_id: "${enr_17}", source: "GRANT", amount_cents: 100000 }
              as: Registrar
            - call: "GET /institutions/enrollments/${enr_17}"
              as: Registrar
              captures: { enr17_v0: $.data.version }
            - call: "POST /institutions/enrollments/${enr_17}/activate"
              payload: { expected_enrollment_version: "${enr17_v0}" }
              as: Registrar
            - call: "POST /institutions/payments"
              payload: { enrollment_id: "${enr_17}", purpose: "DOWN_PAYMENT", amount_cents: 80000 }
              as: Bursar
              captures: { pay_q: $.data.id }
            - call: "POST /institutions/payments/${pay_q}/settle"
              as: Bursar
            - call: "POST /institutions/${inst_q}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-07T00:00:00.000Z" }
              as: Registrar
