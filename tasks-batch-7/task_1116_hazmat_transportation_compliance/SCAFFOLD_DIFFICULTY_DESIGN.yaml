              as: CarrierAdmin
            - call: "POST /hazmat/hazmat-materials"
              payload: { un_na_number: "UN1993", proper_shipping_name: "FLAMMABLE LIQUID, N.O.S.", hazard_class: "CLASS_3", packing_group: "PG_II", placard_table: "TABLE_2", transport_category: "FLAMMABLE_LIQUID", reportable_quantity_lbs: 100, is_inhalation_hazard: false, segregation_group: "SG_NONE", erg_guide_number: "128" }
              as: Regulator
              captures: { m_id: "$.data.id" }
            - call: "POST /hazmat/packaging-specs"
              payload: { spec_code: "UN4G", authorized_hazard_classes: ["CLASS_3"], max_packing_group: "PG_II", max_net_quantity_kg: 500.0 }
              as: Regulator
              captures: { s_id: "$.data.id" }
            - call: "POST /hazmat/carriers/${c_id}/shipments"
              payload: { material_id: "${m_id}", packaging_spec_id: "${s_id}", declared_shipping_name: "FLAMMABLE LIQUID, N.O.S.", quantity_kg: 100.0, declared_value_cents: 1000 }
              as: ShipperComplianceOfficer
              captures: { sh_id: "$.data.id" }
            - call: "POST /hazmat/shipments/${sh_id}/incident-reports"
              payload: { occurred_at: "2026-05-02T00:00:00Z", severity: "MAJOR" }
              as: ShipperComplianceOfficer
              captures: { i_id: "$.data.id" }
            - call: "POST /hazmat/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T01:00:00Z" }
              as: Regulator
            - call: "POST /hazmat/incident-reports/${i_id}/record-phone-report"
              payload: {}
              as: ShipperComplianceOfficer
            - call: "POST /hazmat/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-03T00:00:00Z" }
              as: Regulator
            - call: "POST /hazmat/incident-reports/${i_id}/file-written"
              payload: {}
              as: ShipperComplianceOfficer
            - call: "POST /hazmat/incident-reports/${i_id}/close"
              payload: { confirmed_severity: "MAJOR", adjustment_percent: 0 }
              as: Regulator
            - call: "POST /hazmat/_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-15T00:00:00Z" }
              as: Regulator
            - call: "GET /hazmat/carriers/${c_id}"
              as: Regulator
              captures: { c_v2: "$.data.version", c_rating: "$.data.safety_rating" }
          trigger:
            - call: "POST /hazmat/carriers/${c_id}/registration/submit"
              payload: { expected_carrier_version: "${c_v2}" }
              as: CarrierAdmin
            - call: "POST /hazmat/carriers/${c_id}/registration/approve"
              payload: { verified_fleet_size: 25 }
              as: Regulator
            - call: "GET /hazmat/carriers/${c_id}/registration-invoices"
              as: Regulator
              captures: { inv1_final: "$.data[0].final_total_cents", inv2_final: "$.data[1].final_total_cents", inv2_prov: "$.data[1].provisional_total_cents" }
          assert:
            - "captured c_rating == 90 (100 - 10 MAJOR)"
            - "captured inv1_final == 97500 (INITIAL: subtotal 95000 after 5% discount; flat processing 2500)"
            - "captured inv2_prov == 103000 (RENEWAL provisional: no discount, months_late 0; subtotal 100000 >= 100000 => 3% processing 3000)"
            - "captured inv2_final == 100000 (RENEWAL final: base 100000 - 2.5% discount 2500 = subtotal 97500 < 100000 => flat 2500; bracket keyed on pre-fee subtotal)"

  # ---------------------------------------------------------------- rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: shipment_reject_rework_cycle
        grounds:
          - state_machines.Shipment.DOCUMENTED_to_REJECTED
          - state_machines.Shipment.REJECTED_to_DRAFT
          - state_machines.ShippingPaper.CERTIFIED_to_UNDER_AMENDMENT
        distinguishing_aspect: |
          Shipment machine is cyclic: DOCUMENTED -> REJECTED -> DRAFT -> full
          re-walk back to DOCUMENTED, with the shipping paper forced through
          UNDER_AMENDMENT before re-certification.
        test_recipe:
          setup:
            - "Carrier APPROVED_ACTIVE, fees paid; one shipment walked to DOCUMENTED with a CERTIFIED paper"
          setup_api_calls:
            - call: "POST /hazmat/carriers"
