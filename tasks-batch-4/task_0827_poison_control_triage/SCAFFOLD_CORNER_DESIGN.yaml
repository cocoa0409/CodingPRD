      - name: npds_without_active_assessment_rejected
        claim_type: Cross-entity validation
        grounds: ["validations[priority=16]", "errors[ERR_NO_ACTIVE_ASSESSMENT]"]
        distinguishing_aspect: "Submitting an NPDS report for a case with no RiskAssessment returns ERR_NO_ACTIVE_ASSESSMENT (409)."
