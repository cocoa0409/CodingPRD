            - "the third trigger returns HTTP 200 and ${chk_status} == ELIGIBLE_CONFIRMED"
            - "the fourth trigger returns HTTP 403 with ${e_enroll} == ERR_UNAUTHORIZED and no Enrollment row exists"
            - "the fifth trigger returns HTTP 201 and ${benefit} == ACTIVE"
            - "the sixth trigger returns HTTP 403 with ${e_sweep} == ERR_UNAUTHORIZED"
            - "the seventh trigger returns HTTP 403 with ${e_recert} == ERR_UNAUTHORIZED, not ERR_RECERT_NOT_NOTICED - the role check at priority 15 precedes the state check"
            - "the eighth trigger returns HTTP 200 and ${usage_status} == USING - usage is a shared operation"
            - "the ninth trigger returns HTTP 200 and ${read_benefit} == ACTIVE - every GET is shared with all five roles"
            - "Enrollment.${enr_id}.recert_status == NOT_DUE and last_usage_at == 2026-08-01T00:00:00.000Z"

      - name: entity_backed_roles_cannot_reach_a_peers_rows
        claim_type: peer_roles
        grounds:
          - roles[ProviderAgent].notes
          - validations[priority=30]
          - errors[ERR_UNAUTHORIZED]
          - state_machines.ServiceTransfer.status.REQUESTED_to_ACCEPTED_COMPLETED
        distinguishing_aspect: |
          Ownership is checked per row, not per role, and the port endpoints invert which
          side owns the call: issuing a handset to a rival carrier's enrollment is refused,
          the port REQUEST must come from the source carrier and the ACCEPT from the target
          carrier, so P1 and P2 each get a 403 on exactly the endpoint the other one owns.
          The accepted port then re-parents the enrollment and reclaims the source carrier's
          handset in one call.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; carrier P1 (holding) and carrier P2 (gaining), both ACTIVE, licensed in TX, cap 50."
            - "P1 owns handset D1; one VOICE enrollment E1 on P1 starting 2026-08-01, so port_freeze_until is 2026-09-30."
            - "Clock advanced to 2026-10-01T00:00:00Z so the porting freeze is over."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
