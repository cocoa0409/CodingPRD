      rationale: Asserted as the winning error of the §1.8 state-vs-fiscal priority instance.
  - name: err_enrollment_not_ready_for_shipment_trigger_coverage
    claim_type: violation_to_error
    grounds:
    - errors[ERR_ENROLLMENT_NOT_READY_FOR_SHIPMENT]
    excluded_because:
      difficulty_instance: shipment_creation_gated_on_enrollment_state
      rationale: Asserted as the INTAKE-arm failure of the §1.8 cross-entity dependency instance.
  - name: err_pa_not_required_trigger_coverage
    claim_type: violation_to_error
    grounds:
    - errors[ERR_PA_NOT_REQUIRED]
    excluded_because:
      difficulty_instance: pa_creation_gated_on_bi_requires_prior_auth
      rationale: Asserted as the failure path of the §1.8 cross-entity dependency instance.
