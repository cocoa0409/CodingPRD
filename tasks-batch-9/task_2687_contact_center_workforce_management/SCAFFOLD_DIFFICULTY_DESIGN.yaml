  - rule_id: boundary_precision_check
    instances:
      - name: adherence_threshold_exactly_85_not_flagged
        grounds:
          - calculations.shift_adherence_score
          - global_constants.COACHING_ADHERENCE_THRESHOLD
          - state_machines.ScheduleShift.adherence_status.PENDING_to_ON_TRACK
          - state_machines.ScheduleShift.adherence_status.ON_TRACK_to_OUT_OF_ADHERENCE
          - entities.Agent.fields.coaching_flag_count
        distinguishing_aspect: |
          4050 out-of-adherence seconds against 27000 scheduled seconds is exactly 0.8500, and the
          coaching comparison is a strict `<`, so the shift lands ON_TRACK with coaching_flag_count
          0. Fifty seconds more (4100) gives 0.8481 and flips the shift to OUT_OF_ADHERENCE with a
          flag. An implementation using `<=` flags the boundary case; one that truncates instead of
          rounding half up reports 0.8499 for the first observation and also flags it.
        test_recipe:
