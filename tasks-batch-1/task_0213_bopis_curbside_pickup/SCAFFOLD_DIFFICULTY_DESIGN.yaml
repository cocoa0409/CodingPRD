              payload: {}
              as: StoreManager
              captures: { sv1: $.data.version }
          trigger:
            - call: "POST /orders/${o2_id}/submit"
              payload: { slot_id: "${slot_id}", expected_slot_version: "${sv1}" }
              as: Customer
              as_user_id: "${c2_id}"
