            - { call: "POST /submission-rounds/${r2}/open", payload: { expected_submission_round_version: "${rv2}" }, as: Agent, as_user_id: "${agent1}" }
          trigger:
            - { call: "POST /submissions/${s2}/send", payload: {}, as: Agent, as_user_id: "${agent1}", captures: { errP0: $.data.error_id } }
            - { call: "POST /agencies/${ag}/close-period", payload: {}, as: AgencyAdmin, as_user_id: "admin-1" }
            - { call: "POST /submissions/${s2}/send", payload: {}, as: Agent, as_user_id: "${agent1}", captures: { errP1: $.data.error_id } }
            - { call: "POST /agencies/${ag}/close-period", payload: {}, as: AgencyAdmin, as_user_id: "admin-1" }
            - { call: "POST /submissions/${s2}/send", payload: {}, as: Agent, as_user_id: "${agent1}", captures: { stP2: $.data.status, spP2: $.data.sent_period_index } }
          assert:
            - "${errP0} == ERR_EDITOR_EXCLUSIVE_WINDOW   # period 0 inside [0,2)"
            - "${errP1} == ERR_EDITOR_EXCLUSIVE_WINDOW   # period 1 still inside [0,2)"
            - "${stP2} == SENT and ${spP2} == 2   # period 2 == p+2: adjacency allowed, half-open boundary"

      - name: books_closed_prefix_boundary_touch_rejected
        grounds:
          - validations[priority=17]
          - errors[ERR_BOOKS_CLOSED]
          - "endpoints: POST /royalty-statements"
        distinguishing_aspect: |
          Interval semantic B — CLOSED-prefix overlap on the Deal/Agency
          reporting timeline (a DIFFERENT resource than the sibling's Editor):
          closed books occupy the inclusive prefix (-inf, books_closed_through];
          a statement whose period_index TOUCHES the boundary
          (== books_closed_through) collides and is rejected
          ERR_BOOKS_CLOSED, while the adjacent period above it is accepted —
          the opposite adjacency treatment from the half-open editor window.
        test_recipe:
          setup:
            - "Signed pipeline to a NEGOTIATING deal (offer accepted at period 0)"
            - "Agency advanced: close-period (0->1), close-period (1->2), close-books -> books_closed_through_period_index == 1"
