            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-06T00:00:00Z" }, as: FaireOperator, captures: { d1: $.data.id } }
            - { call: "POST /seasons/${s_id}/begin-build", payload: {}, as: FaireOperator }
            - { call: "POST /seasons/${s_id}/open", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d1}/open-sales", payload: {}, as: FaireOperator }
            - { call: "POST /volunteer-shifts", payload: { season_id: "${s_id}", faire_day_id: "${d1}", role: "GATE", start_time: "2026-06-06T08:00:00Z", end_time: "2026-06-06T12:00:00Z" }, as: Volunteer, as_user_id: "vol-k", captures: { sh: $.data.id } }
            - { call: "POST /volunteer-shifts/${sh}/confirm", payload: {}, as: VolunteerCoordinator }
          trigger:
            - { call: "POST /faire-days/${d1}/complete", payload: {}, as: FaireOperator, captures: { err1: $.data.error_id } }
            - { call: "POST /faire-days/${d1}/open-gates", payload: {}, as: FaireOperator, captures: { err2: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-06T07:00:00Z" }, as: FaireOperator }
            - { call: "POST /faire-days/${d1}/open-gates", payload: {}, as: FaireOperator, captures: { day_st: $.data.status } }
            - { call: "POST /volunteer-shifts", payload: { season_id: "${s_id}", faire_day_id: "${d1}", role: "INFO", start_time: "2026-06-06T13:00:00Z", end_time: "2026-06-06T17:00:00Z" }, as: Volunteer, as_user_id: "vol-l", captures: { err3: $.data.error_id } }
            - { call: "POST /faire-days/${d1}/complete", payload: {}, as: FaireOperator, captures: { err4: $.data.error_id } }
            - { call: "POST /volunteer-shifts/${sh}/close-out", payload: { outcome: "WORKED" }, as: VolunteerCoordinator }
            - { call: "POST /faire-days/${d1}/complete", payload: {}, as: FaireOperator, captures: { day_fin: $.data.status } }
          assert:
