scenario: |
  336. Auto Glass & Windshield Repair: damage assessment (chip/crack) & repair-vs-replace,
  part lookup & order, mobile vs in-shop, ADAS recalibration, cure/safe-drive-away time,
  scheduling, warranty, payment

domain_name: auto-glass-windshield-repair
api_prefix: ""
# Flat top-level collections (root-relative): /customers, /vehicles, /work-orders,
# /glass-parts, /part-orders, /service-appointments, /recalibration-jobs, /payments,
# /warranties, /technicians, /service-bays. WorkOrder is the workflow spine.

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: hybrid
  # WorkOrder is the spine; DamageAssessment & Payment & Warranty hang off it as
  # owned children (hierarchical), while ServiceAppointment, RecalibrationJob,
  # PartOrder reference peers (Technician, ServiceBay, GlassPart) by FK (flat).

  state_machine_shape: branching
  # WorkOrder forks at the assessment outcome (REPAIR vs REPLACE), and REPLACE
  # branches again on ADAS (recalibration required vs not) before the branches
  # rejoin at COMPLETED. RecalibrationJob and PartOrder carry their own machines.

  relationship_patterns:
    - one_to_many       # WorkOrder -> DamageAssessment, Payment; GlassPart -> PartOrder
    - cross_aggregate   # ServiceAppointment references Technician + ServiceBay; RecalibrationJob references WorkOrder + ServiceBay + Technician

  role_model: peer_roles
  # Customer owns their own WorkOrders; ServiceAdvisor runs the front desk
  # (assessment, scheduling, ordering, payment); Technician executes field/shop
  # work and ADAS recalibration; ShopManager owns catalog/inventory/refunds.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Customer display name"
        constraints: "non-empty"
      - name: email
        type: string
        source: input
        description: "Contact email; unique across customers"
        constraints: "unique; non-empty"
      - name: phone
        type: string
        source: input
        description: "Contact phone"
      - name: service_address_state
        type: string
        source: input
        description: "Two-letter state code of the customer's service address; used to validate mobile-service eligibility"
        constraints: "2-letter uppercase US state code"

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; owner of the vehicle"
      - name: vin
        type: string
        source: input
        description: "Vehicle identification number; unique across vehicles"
        constraints: "exactly 17 chars; unique"
      - name: make
        type: string
        source: input
        description: "Vehicle make"
      - name: model
        type: string
        source: input
        description: "Vehicle model"
      - name: model_year
        type: integer
        source: input
        description: "Model year"
        constraints: "1980 <= model_year <= 2027"
      - name: adas_equipped
        type: boolean
        source: input
        description: "True when the windshield carries an ADAS camera (lane-keep / forward-collision) that requires recalibration after replacement"
        default: false
      - name: glass_part_number
        type: string
        source: input
        description: "OEM windshield part number stamped on the vehicle; matched against GlassPart.oem_part_number during part lookup"

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the customer who opened the work order"
      - name: vehicle_id
        type: string
        source: input
        description: "FK -> Vehicle.id; the vehicle being serviced"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state of the work order"
        default: OPEN
        constraints: "one of OPEN, ASSESSED, SCHEDULED, IN_SERVICE, AWAITING_RECALIBRATION, CURING, COMPLETED, CANCELLED"
      - name: service_decision
        type: enum
        source: computed
        description: "Repair-vs-replace decision frozen from the accepted DamageAssessment; null until assessment is accepted"
        default: null
        constraints: "one of REPAIR, REPLACE, null"
      - name: service_location
        type: enum
        source: input
        description: "Whether the job is performed at the customer site or in the shop; chosen at scheduling"
        default: null
        constraints: "one of MOBILE, IN_SHOP, null"
      - name: recalibration_required
        type: boolean
        source: computed
        description: "True when service_decision==REPLACE and the Vehicle.adas_equipped is true; frozen at scheduling time"
        default: false
      - name: assessment_version
        type: integer
        source: computed
        description: "Number of DamageAssessment rows accepted so far; supports re-assessment audit"
        default: 0
      - name: total_charge_cents
        type: integer
        source: computed
        description: "Quoted price in cents for the accepted service_decision; computed at assessment acceptance via price_quote"
        default: 0
      - name: amount_paid_cents
        type: integer
        source: computed
        description: "Sum of Payment.amount_cents for this work order in CAPTURED status minus refunded amounts"
        default: 0
      - name: safe_drive_away_at
        type: datetime
        source: computed
        description: "Earliest UTC instant the customer may drive after a REPLACE; null for REPAIR and until adhesive is applied"
        default: null

  - name: DamageAssessment
    parent: WorkOrder
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the work order being assessed"
      - name: chip_count
        type: integer
        source: input
        description: "Number of distinct chips on the windshield"
        constraints: ">= 0"
      - name: longest_crack_mm
        type: number
        source: input
        description: "Length of the longest crack in millimetres"
        constraints: ">= 0"
      - name: in_driver_primary_view
        type: boolean
        source: input
        description: "True when any damage sits inside the driver's primary acuity area (the wiper-swept zone in front of the driver)"
        default: false
      - name: edge_distance_mm
        type: number
        source: input
        description: "Distance in millimetres from the nearest damage to the glass edge; cracks reaching the edge propagate"
        constraints: ">= 0"
      - name: recommendation
        type: enum
        source: computed
        description: "Repair-vs-replace recommendation produced by repair_vs_replace_decision from this row's measurements"
        constraints: "one of REPAIR, REPLACE"
      - name: status
        type: enum
        source: system
        description: "Whether this assessment has been accepted onto the work order"
        default: DRAFT
        constraints: "one of DRAFT, ACCEPTED, SUPERSEDED"

  - name: GlassPart
    parent: null
    common_fields: true
    fields:
      - name: oem_part_number
        type: string
        source: input
        description: "OEM part number this SKU fulfils; matched against Vehicle.glass_part_number"
        constraints: "non-empty"
      - name: description
        type: string
        source: input
        description: "Human-readable part description"
      - name: adas_compatible
        type: boolean
        source: input
        description: "True when this glass carries the bracket/optics needed for an ADAS camera; an ADAS vehicle may only be fitted with an adas_compatible part"
        default: false
      - name: unit_price_cents
        type: integer
        source: input
        description: "Catalog price of one unit in cents"
        constraints: ">= 0"
      - name: on_hand_qty
        type: integer
        source: system
        description: "Units physically in stock and unreserved; decremented on reservation, restored on order cancellation"
        default: 0
      - name: reserved_qty
        type: integer
        source: system
        description: "Units reserved by open PartOrders not yet consumed"
        default: 0

  - name: PartOrder
    parent: null
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the replacement job this part is ordered for"
      - name: glass_part_id
        type: string
        source: input
        description: "FK -> GlassPart.id; the SKU being reserved/ordered"
      - name: quantity
        type: integer
        source: input
        description: "Units required (always 1 for a single windshield)"
        default: 1
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Fulfilment state of the part order"
        default: PENDING
        constraints: "one of PENDING, RESERVED, BACKORDERED, CONSUMED, CANCELLED"
      - name: expected_work_order_version
        type: integer
        source: input
        description: "Client's last-observed WorkOrder.version; OCC guard against a stale view when reserving a part"

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Technician display name"
      - name: can_mobile
        type: boolean
        source: input
        description: "True when this technician performs MOBILE (on-site) jobs"
        default: true
      - name: adas_certified
        type: boolean
        source: input
        description: "True when this technician is certified to perform ADAS recalibration"
        default: false
      - name: home_state
        type: string
        source: input
        description: "Two-letter state code the technician is licensed to perform mobile work in"
        constraints: "2-letter uppercase US state code"

  - name: ServiceBay
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Bay label"
      - name: bay_type
        type: enum
        source: input
        description: "INSTALL bays do glass replacement only; CALIBRATION bays support static ADAS recalibration (a target board at a fixed distance)"
        constraints: "one of INSTALL, CALIBRATION"
      - name: cleanroom
        type: boolean
        source: input
        description: "True when the bay is a controlled-temperature cleanroom; only cleanroom bays may host a CURING work order in winter conditions"
        default: false

  - name: ServiceAppointment
    parent: null
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the work order being scheduled"
      - name: technician_id
        type: string
        source: input
        description: "FK -> Technician.id; the assigned technician"
      - name: service_bay_id
        type: string
        source: input
        description: "FK -> ServiceBay.id; the assigned bay for IN_SHOP jobs; null for MOBILE"
        default: null
      - name: service_location
        type: enum
        source: input
        description: "MOBILE (at customer site) or IN_SHOP"
        constraints: "one of MOBILE, IN_SHOP"
      - name: start_at
        type: datetime
        source: input
        description: "Appointment start instant (UTC, ISO 8601)"
      - name: end_at
        type: datetime
        source: input
        description: "Appointment end instant (UTC, ISO 8601)"
        constraints: "end_at > start_at"
      - name: status
        type: enum
        source: system
        description: "Appointment lifecycle"
        default: BOOKED
        constraints: "one of BOOKED, CHECKED_IN, RELEASED, CANCELLED"

  - name: RecalibrationJob
    parent: null
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the REPLACE work order whose ADAS camera is being recalibrated"
      - name: technician_id
        type: string
        source: input
        description: "FK -> Technician.id; must be adas_certified"
      - name: service_bay_id
        type: string
        source: input
        description: "FK -> ServiceBay.id; required (a CALIBRATION bay) for STATIC; null for DYNAMIC road test"
        default: null
      - name: calibration_type
        type: enum
        source: input
        description: "STATIC uses a fixed target board in a CALIBRATION bay; DYNAMIC is a road drive"
        constraints: "one of STATIC, DYNAMIC"
      - name: start_at
        type: datetime
        source: input
        description: "Recalibration start instant (UTC)"
      - name: end_at
        type: datetime
        source: input
        description: "Recalibration end instant (UTC)"
        constraints: "end_at > start_at"
      - name: status
        type: enum
        source: system
        description: "Recalibration lifecycle"
        default: SCHEDULED
        constraints: "one of SCHEDULED, PASSED, FAILED, CANCELLED"
      - name: expected_work_order_version
        type: integer
        source: input
        description: "Client's last-observed WorkOrder.version; OCC guard when opening recalibration"

  - name: Payment
    parent: WorkOrder
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the work order being paid"
      - name: amount_cents
        type: integer
        source: input
        description: "Payment amount in cents"
        constraints: ">= 1"
      - name: method
        type: enum
        source: input
        description: "Payment instrument"
        constraints: "one of CARD, CASH, INSURANCE"
      - name: status
        type: enum
        source: system
        description: "Payment lifecycle"
        default: CAPTURED
        constraints: "one of CAPTURED, REFUNDED"
      - name: refunded_amount_cents
        type: integer
        source: computed
        description: "Portion of this payment refunded via a refund action; 0 until refunded"
        default: 0

  - name: Warranty
    parent: WorkOrder
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the completed job this warranty covers"
      - name: coverage_type
        type: enum
        source: computed
        description: "REPAIR jobs get CHIP_REPAIR coverage; REPLACE jobs get LIFETIME_LEAK coverage"
        constraints: "one of CHIP_REPAIR, LIFETIME_LEAK"
      - name: issued_at
        type: datetime
        source: system
        description: "Instant the warranty was issued (work-order completion time)"
      - name: status
        type: enum
        source: system
        description: "Warranty lifecycle"
        default: ACTIVE
        constraints: "one of ACTIVE, VOID"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: WorkOrder
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: OPEN
        to: ASSESSED
        trigger: "POST /work-orders/{id}/accept-assessment"
        actor: ServiceAdvisor
        preconditions:
          - "work_order.status == OPEN"
          - "a DamageAssessment in DRAFT exists for this work order (the assessment_id in the body)"
          - "the referenced DamageAssessment.status == DRAFT"
        side_effects:
          - "sets WorkOrder.service_decision = the accepted DamageAssessment.recommendation"
          - "sets DamageAssessment.status = ACCEPTED; any other ACCEPTED assessment on this work order is set to SUPERSEDED"
          - "increments WorkOrder.assessment_version by 1"
          - "computes WorkOrder.total_charge_cents via price_quote for the accepted service_decision"
          - "increments WorkOrder.version by 1"
      - from: ASSESSED
        to: SCHEDULED
        trigger: "POST /work-orders/{id}/schedule"
        actor: ServiceAdvisor
        preconditions:
          - "work_order.status == ASSESSED"
          - "a ServiceAppointment in BOOKED status referencing this work order exists (the appointment_id in body)"
          - "if service_decision==REPLACE: a PartOrder for this work order is in RESERVED status"
          - "if the chosen appointment.service_location==MOBILE: service_decision==REPAIR (REPLACE+ADAS cannot be mobile — see validations)"
        side_effects:
          - "sets WorkOrder.service_location = appointment.service_location"
          - "sets WorkOrder.recalibration_required = (service_decision==REPLACE AND vehicle.adas_equipped==true)"
          - "increments WorkOrder.version by 1"
      - from: SCHEDULED
        to: IN_SERVICE
        trigger: "POST /work-orders/{id}/start-service"
        actor: Technician
        preconditions:
          - "work_order.status == SCHEDULED"
          - "the linked ServiceAppointment.status is CHECKED_IN"
        side_effects:
          - "sets the linked ServiceAppointment.status = CHECKED_IN if not already (idempotent check-in is separate)"
          - "increments WorkOrder.version by 1"
      - from: IN_SERVICE
        to: AWAITING_RECALIBRATION
        trigger: "POST /work-orders/{id}/finish-install"
        actor: Technician
        preconditions:
          - "work_order.status == IN_SERVICE"
          - "service_decision == REPLACE"
          - "recalibration_required == true"
        side_effects:
          - "stamps WorkOrder.safe_drive_away_at via safe_drive_away_time using the adhesive cure model and current clock"
          - "marks the RESERVED PartOrder for this work order as CONSUMED and decrements GlassPart.reserved_qty"
          - "increments WorkOrder.version by 1"
      - from: IN_SERVICE
        to: CURING
        trigger: "POST /work-orders/{id}/finish-install"
        actor: Technician
        preconditions:
          - "work_order.status == IN_SERVICE"
          - "service_decision == REPLACE"
          - "recalibration_required == false"
        side_effects:
          - "stamps WorkOrder.safe_drive_away_at via safe_drive_away_time using the adhesive cure model and current clock"
          - "marks the RESERVED PartOrder for this work order as CONSUMED and decrements GlassPart.reserved_qty"
          - "increments WorkOrder.version by 1"
      - from: AWAITING_RECALIBRATION
        to: CURING
        trigger: "POST /recalibration-jobs/{id}/pass (system-bubbled on the work order)"
        actor: Technician
        preconditions:
          - "work_order.status == AWAITING_RECALIBRATION"
          - "a RecalibrationJob for this work order transitions SCHEDULED->PASSED"
        side_effects:
          - "increments WorkOrder.version by 1"
        note: "bubble-up: the WorkOrder advances when its RecalibrationJob passes"
      - from: CURING
        to: COMPLETED
        trigger: "POST /work-orders/{id}/complete"
        actor: ServiceAdvisor
        preconditions:
          - "work_order.status == CURING"
          - "current clock >= WorkOrder.safe_drive_away_at (safe-drive-away time has elapsed)"
          - "WorkOrder.amount_paid_cents >= WorkOrder.total_charge_cents (job fully paid)"
        side_effects:
          - "issues a Warranty (coverage_type CHIP_REPAIR if REPAIR else LIFETIME_LEAK), status ACTIVE, issued_at = now"
          - "sets the linked ServiceAppointment.status = RELEASED"
          - "increments WorkOrder.version by 1"
      - from: IN_SERVICE
        to: COMPLETED
        trigger: "POST /work-orders/{id}/complete"
        actor: ServiceAdvisor
        preconditions:
          - "work_order.status == IN_SERVICE"
          - "service_decision == REPAIR"
          - "WorkOrder.amount_paid_cents >= WorkOrder.total_charge_cents"
        side_effects:
          - "issues a Warranty (coverage_type CHIP_REPAIR), status ACTIVE, issued_at = now"
          - "sets the linked ServiceAppointment.status = RELEASED"
          - "increments WorkOrder.version by 1"
        note: "REPAIR jobs have no adhesive cure and no recalibration; they complete directly from IN_SERVICE"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: ServiceAdvisor
        preconditions:
          - "work_order.status in {OPEN, ASSESSED, SCHEDULED}"
        side_effects:
          - "cascade: any BOOKED ServiceAppointment for this work order -> CANCELLED"
          - "cascade: any RESERVED PartOrder for this work order -> CANCELLED, restoring GlassPart.on_hand_qty and decrementing GlassPart.reserved_qty (release_reserved_part)"
          - "increments WorkOrder.version by 1"
        note: "single transition row covering cancellation from OPEN, ASSESSED, or SCHEDULED; later states require the refund path"

  - entity: PartOrder
    initial_state: PENDING
    terminal_states: [CONSUMED, CANCELLED]
    transitions:
      - from: PENDING
        to: RESERVED
        trigger: "system on POST /part-orders when GlassPart.on_hand_qty >= quantity"
        actor: ServiceAdvisor
        preconditions:
          - "GlassPart.on_hand_qty >= quantity at creation"
          - "if vehicle.adas_equipped: GlassPart.adas_compatible == true"
        side_effects:
          - "decrements GlassPart.on_hand_qty by quantity; increments GlassPart.reserved_qty by quantity"
          - "increments WorkOrder.version by 1 (the part reservation mutates the parent work order's view)"
      - from: PENDING
        to: BACKORDERED
        trigger: "system on POST /part-orders when GlassPart.on_hand_qty < quantity"
        actor: ServiceAdvisor
        preconditions:
          - "GlassPart.on_hand_qty < quantity at creation"
        side_effects:
          - "no stock movement; the work order cannot be scheduled for REPLACE until the part is received"
      - from: BACKORDERED
        to: RESERVED
        trigger: "POST /part-orders/{id}/receive"
        actor: ShopManager
        preconditions:
          - "part_order.status == BACKORDERED"
        side_effects:
          - "increments GlassPart.reserved_qty by quantity (stock arrived directly into reservation for this order)"
          - "increments WorkOrder.version by 1"
      - from: RESERVED
        to: CONSUMED
        trigger: "system on WorkOrder finish-install"
        actor: system
        preconditions:
          - "part_order.status == RESERVED"
          - "the parent WorkOrder is transitioning IN_SERVICE->(CURING|AWAITING_RECALIBRATION)"
        side_effects:
          - "decrements GlassPart.reserved_qty by quantity (glass installed)"
      - from: RESERVED
        to: CANCELLED
        trigger: "system on WorkOrder cancel"
        actor: system
        preconditions:
          - "part_order.status == RESERVED"
        side_effects:
          - "increments GlassPart.on_hand_qty by quantity; decrements GlassPart.reserved_qty by quantity (release_reserved_part)"

  - entity: ServiceAppointment
    initial_state: BOOKED
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /service-appointments/{id}/check-in"
        actor: Technician
        preconditions:
          - "appointment.status == BOOKED"
          - "the linked WorkOrder.status == SCHEDULED"
        side_effects:
          - "increments ServiceAppointment.version by 1"
      - from: CHECKED_IN
        to: RELEASED
        trigger: "system on WorkOrder complete"
        actor: system
        preconditions:
          - "appointment.status == CHECKED_IN"
        side_effects:
          - "increments ServiceAppointment.version by 1"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /service-appointments/{id}/cancel OR system on WorkOrder cancel"
        actor: ServiceAdvisor
        preconditions:
          - "appointment.status == BOOKED"
        side_effects:
          - "increments ServiceAppointment.version by 1"

  - entity: RecalibrationJob
    initial_state: SCHEDULED
    terminal_states: [PASSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /recalibration-jobs/{id}/pass"
        actor: Technician
        preconditions:
          - "recalibration_job.status == SCHEDULED"
          - "the linked WorkOrder.status == AWAITING_RECALIBRATION"
          - "the acting Technician.adas_certified == true"
        side_effects:
          - "bubble-up: the linked WorkOrder advances AWAITING_RECALIBRATION->CURING"
          - "increments RecalibrationJob.version by 1"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /recalibration-jobs/{id}/fail"
        actor: Technician
        preconditions:
          - "recalibration_job.status == SCHEDULED"
          - "the linked WorkOrder.status == AWAITING_RECALIBRATION"
        side_effects:
          - "increments RecalibrationJob.version by 1"
        note: "FAILED is non-terminal: a new RecalibrationJob may be opened to retry; the WorkOrder stays AWAITING_RECALIBRATION"
      - from: FAILED
        to: SCHEDULED
        trigger: "POST /recalibration-jobs/{id}/retry"
        actor: Technician
        preconditions:
          - "recalibration_job.status == FAILED"
          - "the linked WorkOrder.status == AWAITING_RECALIBRATION"
        side_effects:
          - "increments RecalibrationJob.version by 1"
        note: "cyclic SCHEDULED->FAILED->SCHEDULED retry loop"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /recalibration-jobs/{id}/cancel"
        actor: ServiceAdvisor
        preconditions:
          - "recalibration_job.status in {SCHEDULED, FAILED}"
        side_effects:
          - "increments RecalibrationJob.version by 1"

  - entity: Warranty
    initial_state: ACTIVE
    terminal_states: [VOID]
    transitions:
      - from: ACTIVE
        to: VOID
        trigger: "POST /warranties/{id}/void"
        actor: ShopManager
        preconditions:
          - "warranty.status == ACTIVE"
        side_effects:
          - "increments Warranty.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: part-order-stale-work-order
    parent_entity: WorkOrder
    write_endpoint: "POST /part-orders"
    occ_field: "expected_work_order_version"
    description: |
      Reserving a GlassPart for a work order whose version has advanced since
      the client last observed it is rejected. A part reservation legitimately
      supersedes any prior view of the work order's part state (a prior reserve
      already moved stock and bumped the work order's version); a create that
      still carries the pre-reserve version is operating on a stale view and is
      refused so the second reservation cannot double-commit stock.
    error_id: ERR_STALE_WORK_ORDER_VERSION
    http_status: 412

  - rule_id: recalibration-open-stale-work-order
    parent_entity: WorkOrder
    write_endpoint: "POST /recalibration-jobs"
    occ_field: "expected_work_order_version"
    description: |
      Opening a RecalibrationJob against a work order whose version has advanced
      since the client last read it is rejected. Each successful recalibration
      create bumps the work order's version (a new recalibration legitimately
      supersedes any prior open recalibration view of the work order); a second
      create still carrying the version observed before the first create — or
      before the finish-install that bumped it on the way into
      AWAITING_RECALIBRATION — is acting on a stale view and is refused.
    error_id: ERR_STALE_WORK_ORDER_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: repair_vs_replace_decision
    trigger: "on POST /work-orders/{id}/damage-assessments (computes DamageAssessment.recommendation)"
    algorithm: threshold
    formula: |
      # Deterministic repair-vs-replace decision over four damage measurements.
      # Evaluate the disqualifiers in this fixed order; the FIRST that fires
      # forces REPLACE. If none fire, the result is REPAIR.
      #   1. in_driver_primary_view == true                       -> REPLACE
      #   2. longest_crack_mm > CRACK_REPAIRABLE_LIMIT_MM (150)    -> REPLACE   (strictly greater)
      #   3. edge_distance_mm < EDGE_SAFE_MARGIN_MM (12)           -> REPLACE   (strictly less; damage too near edge)
      #   4. chip_count > MAX_REPAIRABLE_CHIPS (3)                 -> REPLACE   (strictly greater)
      #   otherwise                                                -> REPAIR
      # NOTE the asymmetry: a crack of EXACTLY 150 mm is REPAIR (boundary is >),
      # edge_distance of EXACTLY 12 mm is REPAIR (boundary is <), chip_count of
      # EXACTLY 3 is REPAIR (boundary is >).
    input_set: "the single DamageAssessment row being created; no aggregation across rows"
    constants:
      CRACK_REPAIRABLE_LIMIT_MM: 150
      EDGE_SAFE_MARGIN_MM: 12
      MAX_REPAIRABLE_CHIPS: 3
    precision: "integer comparison on chip_count; millimetre comparisons exact to 0.1 mm, no rounding"
    variants: []

  - name: price_quote
    trigger: "on WorkOrder OPEN->ASSESSED (POST /work-orders/{id}/accept-assessment); writes WorkOrder.total_charge_cents"
    algorithm: tiered_pricing
    formula: |
      # Quote in cents for the accepted service_decision. Combinatorial:
      # base depends on decision; surcharges stack conditionally; the mobile
      # trip fee is tiered on the customer's state; everything is summed then a
      # single rounding step is applied to the percentage-derived shop fee.
      if service_decision == REPAIR:
          base = REPAIR_BASE_CENTS                      # 8900
          adas_fee = 0
          mobile_fee = 0   # repairs at this shop are always mobile-or-shop flat, no trip tier
      else:  # REPLACE
          base = REPLACE_BASE_CENTS                     # 32500
          adas_fee = ADAS_RECALIBRATION_FEE_CENTS if (vehicle.adas_equipped) else 0   # 19900
          # mobile trip fee tier by customer.service_address_state vs shop home state "CA"
          if appointment_location_is_mobile_at_quote_time:
              # at accept-assessment the location is not yet chosen, so mobile_fee
              # is 0 here; the trip fee is added at scheduling via schedule_trip_fee.
              mobile_fee = 0
          else:
              mobile_fee = 0
      # single rounding step: the shop fee is SHOP_FEE_PCT of (base+adas_fee),
      # rounded half-up to the nearest cent AFTER summing base+adas (sum-then-round).
      shop_fee = round_half_up((base + adas_fee) * SHOP_FEE_PCT)
      total_charge_cents = base + adas_fee + shop_fee
    input_set: "the accepted DamageAssessment.recommendation plus the work order's Vehicle.adas_equipped"
    constants:
      REPAIR_BASE_CENTS: 8900
      REPLACE_BASE_CENTS: 32500
      ADAS_RECALIBRATION_FEE_CENTS: 19900
      SHOP_FEE_PCT: 0.085
    precision: "2 decimal places (cents are integers); shop_fee rounded half-up; sum-then-round order is pinned (round the percentage fee on the summed base, never per-component)"
    variants:
      - name: repair_quote
        when: "service_decision == REPAIR"
        difference: "base = REPAIR_BASE_CENTS, no adas_fee; shop_fee = round_half_up(8900 * 0.085) = 757; total = 9657"
      - name: replace_adas_quote
        when: "service_decision == REPLACE and vehicle.adas_equipped == true"
        difference: "base+adas = 32500+19900 = 52400; shop_fee = round_half_up(52400*0.085)=round_half_up(4454.0)=4454; total = 56854"
      - name: replace_non_adas_quote
        when: "service_decision == REPLACE and vehicle.adas_equipped == false"
        difference: "base = 32500, no adas_fee; shop_fee = round_half_up(32500*0.085)=round_half_up(2762.5)=2763; total = 35263"

  - name: schedule_trip_fee
    trigger: "on WorkOrder ASSESSED->SCHEDULED (POST /work-orders/{id}/schedule); adds to WorkOrder.total_charge_cents"
    algorithm: tiered_pricing
    formula: |
      # Mobile trip fee, added to total_charge_cents at scheduling. Tiered on
      # the relationship between the customer's service_address_state and the
      # shop home state, AND on a circular-looking dependency: the fee is a
      # percentage of the ALREADY-COMPUTED total_charge_cents (which itself
      # includes the shop_fee from price_quote). Evaluation order is pinned:
      # price_quote runs first at accept-assessment and freezes total_charge_cents;
      # schedule_trip_fee reads that frozen value, never recomputes it.
      if appointment.service_location == IN_SHOP:
          trip_fee = 0
      else:  # MOBILE
          if customer.service_address_state == SHOP_HOME_STATE:   # "CA"
              trip_rate = LOCAL_TRIP_PCT      # 0.04
          else:
              trip_rate = OUT_OF_STATE_TRIP_PCT   # 0.09
          trip_fee = round_half_up(total_charge_cents_frozen * trip_rate)
      total_charge_cents = total_charge_cents_frozen + trip_fee
    input_set: "the frozen WorkOrder.total_charge_cents from price_quote, appointment.service_location, customer.service_address_state"
    constants:
      SHOP_HOME_STATE: "CA"
      LOCAL_TRIP_PCT: 0.04
      OUT_OF_STATE_TRIP_PCT: 0.09
    precision: "trip_fee rounded half-up to the nearest cent; the percentage is taken on the frozen total, pinning evaluation order (quote-then-trip), so the value is well-defined"
    variants:
      - name: in_shop_no_trip
        when: "service_location == IN_SHOP"
        difference: "trip_fee = 0; total unchanged"
      - name: local_mobile_trip
        when: "service_location == MOBILE and customer state == CA"
        difference: "trip_fee = round_half_up(frozen_total * 0.04)"
      - name: out_of_state_mobile_trip
        when: "service_location == MOBILE and customer state != CA"
        difference: "trip_fee = round_half_up(frozen_total * 0.09)"

  - name: safe_drive_away_time
    trigger: "on WorkOrder IN_SERVICE->(CURING|AWAITING_RECALIBRATION) (POST /work-orders/{id}/finish-install); writes WorkOrder.safe_drive_away_at"
    algorithm: threshold
    formula: |
      # Safe-drive-away time (SDAT): earliest instant the customer may drive after
      # a REPLACE. Cure time depends on temperature band and humidity band of the
      # install environment, reported in the finish-install body. Two valid reads
      # of the same prose diverge -> dual variant:
      #   base_minutes by temperature band:
      #     temp_c >= WARM_THRESHOLD_C (24)            -> WARM_CURE_MIN  (60)
      #     COLD_THRESHOLD_C (4) <= temp_c < 24        -> MILD_CURE_MIN  (120)
      #     temp_c < 4                                 -> COLD_CURE_MIN  (240)
      #   humidity adjustment:
      #     humidity_pct < DRY_HUMIDITY_PCT (15)       -> add DRY_PENALTY_MIN (30)
      #     otherwise                                  -> add 0
      #   safe_drive_away_at = finish_clock + base_minutes + humidity_penalty (minutes)
      # Boundary asymmetry: temp_c EXACTLY 24 is WARM (>=); temp_c EXACTLY 4 is MILD
      # (>=); humidity EXACTLY 15 takes NO dry penalty (penalty is < 15).
    input_set: "temp_c and humidity_pct from the finish-install body; the current clock at finish-install"
    constants:
      WARM_THRESHOLD_C: 24
      COLD_THRESHOLD_C: 4
      WARM_CURE_MIN: 60
      MILD_CURE_MIN: 120
      COLD_CURE_MIN: 240
      DRY_HUMIDITY_PCT: 15
      DRY_PENALTY_MIN: 30
    precision: "minutes are integers; resulting instant is ISO 8601 UTC with three fractional digits"
    variants:
      - name: posted_sdat_estimate
        when: "the install-environment reading is taken as the WORST band for the day (planner posts a conservative estimate before install)"
        difference: "uses COLD_CURE_MIN(240)+DRY_PENALTY_MIN(30)=270 min regardless of actual reading; computed by GET /work-orders/{id}/sdat-estimate"
      - name: actual_sdat
        when: "the real temp_c/humidity_pct reported at finish-install are used"
        difference: "uses the measured band; e.g. temp_c=24,humidity=40 -> 60 min, far shorter than the 270-min posted estimate"

  - name: refund_amount
    trigger: "on POST /payments/{id}/refund; computes the refunded delta and updates WorkOrder.amount_paid_cents"
    algorithm: aggregation
    formula: |
      # Refunding a CAPTURED payment. A restocking fee applies ONLY when the work
      # order has reached IN_SERVICE or beyond AND service_decision==REPLACE
      # (glass was opened from stock). The conserved invariant:
      #   WorkOrder.amount_paid_cents == sum(p.amount_cents for p in payments
      #       where p.status==CAPTURED) - sum(p.refunded_amount_cents for p in payments)
      # must hold after every refund.
      if work_order.status in {IN_SERVICE, AWAITING_RECALIBRATION, CURING, COMPLETED}
         and work_order.service_decision == REPLACE:
          restock_fee = round_half_up(payment.amount_cents * RESTOCK_PCT)   # 0.15
      else:
          restock_fee = 0
      refunded = payment.amount_cents - restock_fee
      payment.refunded_amount_cents = refunded
      payment.status = REFUNDED
      # recompute WorkOrder.amount_paid_cents per the invariant above
    input_set: "the single CAPTURED Payment being refunded plus the parent WorkOrder.status and service_decision"
    constants:
      RESTOCK_PCT: 0.15
    precision: "restock_fee rounded half-up to the nearest cent; amount_paid_cents recomputed as an exact integer aggregate"
    variants:
      - name: full_refund_pre_service
        when: "work order is OPEN/ASSESSED/SCHEDULED or service_decision==REPAIR"
        difference: "restock_fee = 0; refunded = full amount_cents"
      - name: restock_refund_replace_in_service
        when: "work order >= IN_SERVICE and service_decision == REPLACE"
        difference: "restock_fee = round_half_up(amount_cents * 0.15); refunded = amount_cents - restock_fee"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the role is permitted to invoke this endpoint per the RBAC matrix; for entity_backed roles acting on owned resources, X-User-ID matches the resource owner FK"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every resource referenced in the path or required FK body field exists; validated left-to-right in the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: existence
    check: "required input fields are present and well-typed; enum fields carry a declared member"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 5
    category: state
    check: "the target resource is in a state from which the requested transition is defined (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_work_order_version equals the current WorkOrder.version on part-order create and recalibration-job create"
    error_id: ERR_STALE_WORK_ORDER_VERSION
    http_status: 412
    applies_to: "POST /part-orders, POST /recalibration-jobs"

  - priority: 7
    category: business_safety
    check: "an ADAS-equipped vehicle may only be fitted with an adas_compatible GlassPart (part-order create); a REPLACE on an ADAS vehicle may not be scheduled MOBILE"
    error_id: ERR_ADAS_PART_INCOMPATIBLE
    http_status: 422
    applies_to: "POST /part-orders"

  - priority: 8
    category: business_safety
    check: "a REPLACE work order whose recalibration_required is true (ADAS vehicle) cannot be scheduled with a MOBILE appointment — recalibration needs the shop"
    error_id: ERR_MOBILE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /work-orders/{id}/schedule"

  - priority: 9
    category: business_safety
    check: "a RecalibrationJob may only be created/passed by an adas_certified Technician; STATIC calibration requires a CALIBRATION bay"
    error_id: ERR_TECH_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /recalibration-jobs, POST /recalibration-jobs/{id}/pass"

  - priority: 10
    category: business_safety
    check: "completing a CURING work order before its safe_drive_away_at has elapsed is refused (cure time not met)"
    error_id: ERR_CURE_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /work-orders/{id}/complete"

  - priority: 11
    category: business_constraint
    check: "an appointment's [start_at,end_at) must not overlap another non-cancelled appointment for the same technician (point-overlap; back-to-back start==end allowed)"
    error_id: ERR_TECHNICIAN_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /service-appointments"

  - priority: 12
    category: business_constraint
    check: "a STATIC recalibration's [start_at,end_at) plus a 15-minute clearance buffer (CALIBRATION_BAY_BUFFER_MIN=15) on each side must not overlap another non-cancelled recalibration in the same CALIBRATION bay; two recalibrations collide when the gap between them is strictly less than 15 minutes"
    error_id: ERR_BAY_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /recalibration-jobs"

  - priority: 13
    category: business_constraint
    check: "a MOBILE appointment's technician must have can_mobile==true and home_state matching the customer's service_address_state"
    error_id: ERR_MOBILE_TECH_UNAVAILABLE
    http_status: 422
    applies_to: "POST /service-appointments"

  - priority: 14
    category: business_referential
    check: "a REPLACE work order cannot be scheduled until a PartOrder for it is RESERVED (part not on hand)"
    error_id: ERR_PART_NOT_READY
    http_status: 409
    applies_to: "POST /work-orders/{id}/schedule"

  - priority: 15
    category: business_fiscal
    check: "a payment's amount_cents may not cause amount_paid_cents to exceed total_charge_cents (overpayment)"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /payments"

  - priority: 16
    category: business_fiscal
    check: "a work order cannot be completed until amount_paid_cents >= total_charge_cents (unpaid balance)"
    error_id: ERR_BALANCE_UNPAID
    http_status: 402
    applies_to: "POST /work-orders/{id}/complete"

  - priority: 17
    category: business_constraint
    check: "email uniqueness on Customer create; VIN uniqueness on Vehicle create"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /customers, POST /vehicles"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Customers ----
  - method: POST
    path: "/customers"
    description: "Register a customer"
    roles: [ServiceAdvisor, ShopManager]
    code: 201
    input: [full_name, email, phone, service_address_state]
    output: Customer
    side_effects: []

  - method: GET
    path: "/customers/{id}"
    description: "Fetch a customer"
    roles: [ServiceAdvisor, ShopManager, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/customers/{id}/vehicles"
    description: "List the customer's vehicles (FK reverse-reachability for Vehicle.customer_id)"
    roles: [ServiceAdvisor, ShopManager, Customer]
    code: 200
    input: []
    output: Vehicle[]
    side_effects: []

  - method: GET
    path: "/customers/{id}/work-orders"
    description: "List the customer's work orders (FK reverse-reachability for WorkOrder.customer_id)"
    roles: [ServiceAdvisor, ShopManager, Customer]
    code: 200
    input: []
    output: WorkOrder[]
    side_effects: []

  # ---- Vehicles ----
  - method: POST
    path: "/vehicles"
    description: "Register a vehicle for a customer"
    roles: [ServiceAdvisor, ShopManager]
    code: 201
    input: [customer_id, vin, make, model, model_year, "adas_equipped?", glass_part_number]
    output: Vehicle
    side_effects: []

  - method: GET
    path: "/vehicles/{id}"
    description: "Fetch a vehicle"
    roles: [ServiceAdvisor, ShopManager, Customer]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  - method: GET
    path: "/vehicles/{id}/work-orders"
    description: "List work orders for a vehicle (FK reverse-reachability for WorkOrder.vehicle_id)"
    roles: [ServiceAdvisor, ShopManager, Customer]
    code: 200
    input: []
    output: WorkOrder[]
    side_effects: []

  # ---- Glass parts catalog/inventory ----
  - method: POST
    path: "/glass-parts"
    description: "Create a glass part SKU with initial stock"
    roles: [ShopManager]
    code: 201
    input: [oem_part_number, description, "adas_compatible?", unit_price_cents, "on_hand_qty?"]
    output: GlassPart
    side_effects: ["sets on_hand_qty to the provided value or 0; reserved_qty starts at 0"]

  - method: GET
    path: "/glass-parts/{id}"
    description: "Fetch a glass part"
    roles: [ServiceAdvisor, ShopManager]
    code: 200
    input: []
    output: GlassPart
    side_effects: []

  - method: GET
    path: "/glass-parts"
    description: "List/lookup glass parts; filter by oem_part_number to match a vehicle's required part"
    roles: [ServiceAdvisor, ShopManager]
    code: 200
    input: ["oem_part_number?", "adas_compatible?", "limit?", "offset?"]
    output: GlassPart[]
    side_effects: []

  - method: PATCH
    path: "/glass-parts/{id}/restock"
    description: "Add units to on_hand_qty"
    roles: [ShopManager]
    code: 200
    input: [add_qty]
    output: GlassPart
    side_effects: ["increments on_hand_qty by add_qty"]

  # ---- Technicians ----
  - method: POST
    path: "/technicians"
    description: "Create a technician"
    roles: [ShopManager]
    code: 201
    input: [full_name, "can_mobile?", "adas_certified?", home_state]
    output: Technician
    side_effects: []

  - method: GET
    path: "/technicians/{id}"
    description: "Fetch a technician"
    roles: [ServiceAdvisor, ShopManager]
    code: 200
    input: []
    output: Technician
    side_effects: []

  # ---- Service bays ----
  - method: POST
    path: "/service-bays"
    description: "Create a service bay"
    roles: [ShopManager]
    code: 201
    input: [name, bay_type, "cleanroom?"]
    output: ServiceBay
    side_effects: []

  - method: GET
    path: "/service-bays/{id}"
    description: "Fetch a service bay"
    roles: [ServiceAdvisor, ShopManager]
    code: 200
    input: []
    output: ServiceBay
    side_effects: []

  # ---- Work orders (spine) ----
  - method: POST
    path: "/work-orders"
    description: "Open a work order for a customer+vehicle"
    roles: [ServiceAdvisor, Customer]
    code: 201
    input: [customer_id, vehicle_id]
    output: WorkOrder
    side_effects: ["status=OPEN; service_decision=null; total_charge_cents=0; amount_paid_cents=0"]

  - method: GET
    path: "/work-orders/{id}"
    description: "Fetch a work order"
    roles: [ServiceAdvisor, ShopManager, Customer, Technician]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  - method: POST
    path: "/work-orders/{id}/damage-assessments"
    description: "Record a chip/crack damage assessment; server computes recommendation"
    roles: [ServiceAdvisor]
    code: 201
    input: [chip_count, longest_crack_mm, "in_driver_primary_view?", edge_distance_mm]
    output: DamageAssessment
    side_effects: ["computes DamageAssessment.recommendation via repair_vs_replace_decision; status=DRAFT"]

  - method: GET
    path: "/work-orders/{id}/damage-assessments"
    description: "List assessments for a work order (FK reverse-reachability for DamageAssessment.work_order_id)"
    roles: [ServiceAdvisor, ShopManager, Customer]
    code: 200
    input: []
    output: DamageAssessment[]
    side_effects: []

  - method: POST
    path: "/work-orders/{id}/accept-assessment"
    description: "Accept a DRAFT assessment; freezes service_decision and quotes price"
    roles: [ServiceAdvisor]
    code: 200
    input: [assessment_id]
    output: WorkOrder
    side_effects: ["OPEN->ASSESSED; sets service_decision; computes total_charge_cents via price_quote; supersedes other accepted assessments; increments assessment_version; increments version by 1"]

  - method: POST
    path: "/work-orders/{id}/schedule"
    description: "Move ASSESSED->SCHEDULED by linking a BOOKED appointment; applies trip fee"
    roles: [ServiceAdvisor]
    code: 200
    input: [appointment_id]
    output: WorkOrder
    side_effects: ["ASSESSED->SCHEDULED; sets service_location; sets recalibration_required; adds schedule_trip_fee to total_charge_cents; increments version by 1"]

  - method: POST
    path: "/work-orders/{id}/start-service"
    description: "Move SCHEDULED->IN_SERVICE (technician begins work)"
    roles: [Technician]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["SCHEDULED->IN_SERVICE; increments version by 1"]

  - method: POST
    path: "/work-orders/{id}/finish-install"
    description: "REPLACE only: glass installed; stamps safe_drive_away_at and routes to CURING or AWAITING_RECALIBRATION"
    roles: [Technician]
    code: 200
    input: [temp_c, humidity_pct]
    output: WorkOrder
    side_effects: ["IN_SERVICE->CURING or AWAITING_RECALIBRATION; stamps safe_drive_away_at via safe_drive_away_time; CONSUMES the reserved PartOrder and decrements GlassPart.reserved_qty; increments version by 1"]

  - method: POST
    path: "/work-orders/{id}/complete"
    description: "Finalize the job; issues warranty, releases appointment"
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["->COMPLETED; issues Warranty; releases linked ServiceAppointment; increments version by 1"]

  - method: POST
    path: "/work-orders/{id}/cancel"
    description: "Cancel a pre-service work order; cascades to appointment + part order"
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["->CANCELLED; cancels BOOKED appointment; cancels RESERVED PartOrder releasing stock (release_reserved_part); increments version by 1"]

  - method: GET
    path: "/work-orders/{id}/sdat-estimate"
    description: "Computed read: the conservative posted safe-drive-away estimate (worst-band cure) for a REPLACE work order"
    roles: [ServiceAdvisor, ShopManager, Customer, Technician]
    code: 200
    input: []
    output: { posted_sdat_minutes: integer, posted_safe_drive_away_at: datetime }
    side_effects: []

  - method: GET
    path: "/work-orders/{id}/part-orders"
    description: "List part orders for a work order (FK reverse-reachability for PartOrder.work_order_id)"
    roles: [ServiceAdvisor, ShopManager]
    code: 200
    input: []
    output: PartOrder[]
    side_effects: []

  - method: GET
    path: "/work-orders/{id}/payments"
    description: "List payments for a work order (FK reverse-reachability for Payment.work_order_id)"
    roles: [ServiceAdvisor, ShopManager, Customer]
    code: 200
    input: []
    output: Payment[]
    side_effects: []

  - method: GET
    path: "/work-orders/{id}/appointments"
    description: "List appointments for a work order (FK reverse-reachability for ServiceAppointment.work_order_id)"
    roles: [ServiceAdvisor, ShopManager, Customer]
    code: 200
    input: []
    output: ServiceAppointment[]
    side_effects: []

  - method: GET
    path: "/work-orders/{id}/recalibration-jobs"
    description: "List recalibration jobs for a work order (FK reverse-reachability for RecalibrationJob.work_order_id)"
    roles: [ServiceAdvisor, ShopManager, Technician]
    code: 200
    input: []
    output: RecalibrationJob[]
    side_effects: []

  - method: GET
    path: "/work-orders/{id}/warranties"
    description: "List warranties for a work order (FK reverse-reachability for Warranty.work_order_id)"
    roles: [ServiceAdvisor, ShopManager, Customer]
    code: 200
    input: []
    output: Warranty[]
    side_effects: []

  # ---- Part orders ----
  - method: POST
    path: "/part-orders"
    description: "Order/reserve a glass part for a REPLACE work order; OCC-guarded on the work order"
    roles: [ServiceAdvisor]
    code: 201
    input: [work_order_id, glass_part_id, "quantity?", expected_work_order_version]
    output: PartOrder
    side_effects: ["RESERVED if stock available (decrement on_hand_qty, increment reserved_qty, increment WorkOrder.version) else BACKORDERED"]

  - method: GET
    path: "/part-orders/{id}"
    description: "Fetch a part order"
    roles: [ServiceAdvisor, ShopManager]
    code: 200
    input: []
    output: PartOrder
    side_effects: []

  - method: GET
    path: "/part-orders"
    description: "List/filter part orders (FK reverse-reachability for PartOrder.glass_part_id and PartOrder.work_order_id)"
    roles: [ServiceAdvisor, ShopManager]
    code: 200
    input: ["glass_part_id?", "work_order_id?", "limit?", "offset?"]
    output: PartOrder[]
    side_effects: []

  - method: POST
    path: "/part-orders/{id}/receive"
    description: "Mark a BACKORDERED part order received (BACKORDERED->RESERVED)"
    roles: [ShopManager]
    code: 200
    input: []
    output: PartOrder
    side_effects: ["BACKORDERED->RESERVED; increments GlassPart.reserved_qty; increments WorkOrder.version by 1"]

  # ---- Service appointments ----
  - method: POST
    path: "/service-appointments"
    description: "Book a mobile or in-shop appointment for a work order"
    roles: [ServiceAdvisor]
    code: 201
    input: [work_order_id, technician_id, "service_bay_id?", service_location, start_at, end_at]
    output: ServiceAppointment
    side_effects: ["status=BOOKED; rejects technician double-booking and mobile-tech ineligibility"]

  - method: GET
    path: "/service-appointments/{id}"
    description: "Fetch an appointment"
    roles: [ServiceAdvisor, ShopManager, Customer, Technician]
    code: 200
    input: []
    output: ServiceAppointment
    side_effects: []

  - method: GET
    path: "/service-appointments"
    description: "List/filter appointments (FK reverse-reachability for ServiceAppointment.technician_id, service_bay_id, work_order_id)"
    roles: [ServiceAdvisor, ShopManager, Technician]
    code: 200
    input: ["technician_id?", "service_bay_id?", "work_order_id?", "limit?", "offset?"]
    output: ServiceAppointment[]
    side_effects: []

  - method: POST
    path: "/service-appointments/{id}/check-in"
    description: "Check the customer/vehicle in (BOOKED->CHECKED_IN)"
    roles: [Technician]
    code: 200
    input: []
    output: ServiceAppointment
    side_effects: ["BOOKED->CHECKED_IN; increments version by 1"]

  - method: POST
    path: "/service-appointments/{id}/cancel"
    description: "Cancel a BOOKED appointment"
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: ServiceAppointment
    side_effects: ["BOOKED->CANCELLED; increments version by 1"]

  # ---- Recalibration jobs ----
  - method: POST
    path: "/recalibration-jobs"
    description: "Open an ADAS recalibration for an AWAITING_RECALIBRATION work order; OCC-guarded on the work order"
    roles: [Technician]
    code: 201
    input: [work_order_id, technician_id, "service_bay_id?", calibration_type, start_at, end_at, expected_work_order_version]
    output: RecalibrationJob
    side_effects: ["status=SCHEDULED; increments WorkOrder.version by 1 (so a second create carrying the now-stale version is rejected); rejects uncertified tech, missing/occupied CALIBRATION bay, stale work order"]

  - method: GET
    path: "/recalibration-jobs/{id}"
    description: "Fetch a recalibration job"
    roles: [ServiceAdvisor, ShopManager, Technician]
    code: 200
    input: []
    output: RecalibrationJob
    side_effects: []

  - method: GET
    path: "/recalibration-jobs"
    description: "List/filter recalibration jobs (FK reverse-reachability for RecalibrationJob.technician_id, service_bay_id, work_order_id)"
    roles: [ServiceAdvisor, ShopManager, Technician]
    code: 200
    input: ["technician_id?", "service_bay_id?", "work_order_id?", "limit?", "offset?"]
    output: RecalibrationJob[]
    side_effects: []

  - method: POST
    path: "/recalibration-jobs/{id}/pass"
    description: "Mark recalibration PASSED; bubbles the work order AWAITING_RECALIBRATION->CURING"
    roles: [Technician]
    code: 200
    input: []
    output: RecalibrationJob
    side_effects: ["SCHEDULED->PASSED; bubbles WorkOrder AWAITING_RECALIBRATION->CURING; increments both versions by 1"]

  - method: POST
    path: "/recalibration-jobs/{id}/fail"
    description: "Mark recalibration FAILED (retryable)"
    roles: [Technician]
    code: 200
    input: []
    output: RecalibrationJob
    side_effects: ["SCHEDULED->FAILED; increments version by 1"]

  - method: POST
    path: "/recalibration-jobs/{id}/retry"
    description: "Reopen a FAILED recalibration (FAILED->SCHEDULED)"
    roles: [Technician]
    code: 200
    input: []
    output: RecalibrationJob
    side_effects: ["FAILED->SCHEDULED; increments version by 1"]

  - method: POST
    path: "/recalibration-jobs/{id}/cancel"
    description: "Cancel a SCHEDULED/FAILED recalibration"
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: RecalibrationJob
    side_effects: ["->CANCELLED; increments version by 1"]

  # ---- Payments ----
  - method: POST
    path: "/payments"
    description: "Capture a payment against a work order"
    roles: [ServiceAdvisor, Customer]
    code: 201
    input: [work_order_id, amount_cents, method]
    output: Payment
    side_effects: ["status=CAPTURED; recomputes WorkOrder.amount_paid_cents; rejects overpayment"]

  - method: GET
    path: "/payments/{id}"
    description: "Fetch a payment"
    roles: [ServiceAdvisor, ShopManager, Customer]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: POST
    path: "/payments/{id}/refund"
    description: "Refund a CAPTURED payment; applies restock fee per refund_amount"
    roles: [ShopManager]
    code: 200
    input: []
    output: Payment
    side_effects: ["CAPTURED->REFUNDED; computes refunded_amount_cents via refund_amount; recomputes WorkOrder.amount_paid_cents"]

  # ---- Warranties ----
  - method: GET
    path: "/warranties/{id}"
    description: "Fetch a warranty"
    roles: [ServiceAdvisor, ShopManager, Customer]
    code: 200
    input: []
    output: Warranty
    side_effects: []

  - method: POST
    path: "/warranties/{id}/void"
    description: "Void an active warranty"
    roles: [ShopManager]
    code: 200
    input: []
    output: Warranty
    side_effects: ["ACTIVE->VOID; increments version by 1"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's current UTC instant (drives cure-elapsed checks deterministically)"
    roles: [ShopManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["sets the server clock used for safe_drive_away_at stamping and cure-elapsed completion checks"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "authenticated role not permitted for this endpoint, or entity_backed role acting on a resource it does not own"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "referenced resource (path id or required FK) does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, undeclared enum member, or end_at <= start_at"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the requested transition is not defined from the resource's current state"
  - id: ERR_STALE_WORK_ORDER_VERSION
    http: 412
    condition: "expected_work_order_version does not match the current WorkOrder.version on part-order or recalibration-job create"
  - id: ERR_ADAS_PART_INCOMPATIBLE
    http: 422
    condition: "ordering a non-adas_compatible GlassPart for an ADAS-equipped vehicle"
  - id: ERR_MOBILE_NOT_ELIGIBLE
    http: 422
    condition: "scheduling a REPLACE work order with recalibration_required==true onto a MOBILE appointment"
  - id: ERR_TECH_NOT_CERTIFIED
    http: 422
    condition: "creating or passing a RecalibrationJob with a non-adas_certified technician, or STATIC calibration without a CALIBRATION bay"
  - id: ERR_CURE_NOT_ELAPSED
    http: 422
    condition: "completing a CURING work order before current clock >= safe_drive_away_at"
  - id: ERR_TECHNICIAN_DOUBLE_BOOKED
    http: 409
    condition: "an appointment interval overlaps another non-cancelled appointment for the same technician"
  - id: ERR_BAY_DOUBLE_BOOKED
    http: 409
    condition: "a STATIC recalibration interval (with buffer) overlaps another non-cancelled recalibration in the same CALIBRATION bay"
  - id: ERR_MOBILE_TECH_UNAVAILABLE
    http: 422
    condition: "a MOBILE appointment's technician cannot do mobile work or is not licensed in the customer's state"
  - id: ERR_PART_NOT_READY
    http: 409
    condition: "scheduling a REPLACE work order before its PartOrder is RESERVED"
  - id: ERR_OVERPAYMENT
    http: 422
    condition: "a payment would push amount_paid_cents above total_charge_cents"
  - id: ERR_BALANCE_UNPAID
    http: 402
    condition: "completing a work order whose amount_paid_cents < total_charge_cents"
  - id: ERR_DUPLICATE
    http: 409
    condition: "duplicate Customer email or duplicate Vehicle VIN on create"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "The vehicle owner; opens work orders, pays, and reads their own resources"
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "POST /work-orders (only for own customer_id)"
      - "POST /payments (only for own work order)"
      - "GET /work-orders/{id} and owned sub-resources"
      - "GET /customers/{id}, /vehicles/{id} (own)"

  - name: ServiceAdvisor
    description: "Front-desk operator: assessment, quoting, scheduling, part ordering, cancellation, payment capture"
    identity: "opaque"
    exclusive_operations:
      - "POST /work-orders/{id}/damage-assessments"
      - "POST /work-orders/{id}/accept-assessment"
      - "POST /work-orders/{id}/schedule"
      - "POST /work-orders/{id}/complete"
      - "POST /work-orders/{id}/cancel"
      - "POST /part-orders"
      - "POST /service-appointments"
      - "POST /service-appointments/{id}/cancel"
      - "POST /recalibration-jobs/{id}/cancel"
    shared_operations:
      - "POST /work-orders"
      - "POST /customers, POST /vehicles"
      - "POST /payments"
      - "GET reads across work orders and sub-resources"

  - name: Technician
    description: "Field/shop technician: starts service, finishes install, performs ADAS recalibration, checks customers in"
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /work-orders/{id}/start-service"
      - "POST /work-orders/{id}/finish-install"
      - "POST /service-appointments/{id}/check-in"
      - "POST /recalibration-jobs"
      - "POST /recalibration-jobs/{id}/pass"
      - "POST /recalibration-jobs/{id}/fail"
      - "POST /recalibration-jobs/{id}/retry"
    shared_operations:
      - "GET /work-orders/{id}, /service-appointments/{id}, /recalibration-jobs/{id}"

  - name: ShopManager
    description: "Catalog/inventory owner and financial authority: parts, restock, receive, refunds, warranty void, clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /glass-parts"
      - "PATCH /glass-parts/{id}/restock"
      - "POST /technicians"
      - "POST /service-bays"
      - "POST /part-orders/{id}/receive"
      - "POST /payments/{id}/refund"
      - "POST /warranties/{id}/void"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /customers, POST /vehicles"
      - "GET reads across all resources"
