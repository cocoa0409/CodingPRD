      - name: ctr_exempt_deposits_excluded_from_totals
        claim_type: input_set_filtering
        grounds: [calculations.ctr_daily_aggregation]
        distinguishing_aspect: "is_ctr_exempt=true transactions never count toward the CTR trigger or the filed totals: 700000 exempt + 400000 non-exempt files nothing, and a further 600001 non-exempt files with total_cash_in_cents == 1000001 (not 1700001)."
