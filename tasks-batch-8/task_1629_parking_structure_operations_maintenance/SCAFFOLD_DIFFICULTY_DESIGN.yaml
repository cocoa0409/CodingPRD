    - state_machines.MonthlyAgreement.SUSPENDED_to_ACTIVE
    distinguishing_aspect: 'Cyclic machine: ACTIVE -> SUSPENDED -> ACTIVE -> SUSPENDED -> ACTIVE loops

      twice on the SAME agreement (MonthlyAgreement), unlike the parallel-session

      machine and the repair revision loop.

      '
    test_recipe:
      setup:
      - Facility monthly_capacity 50; one ACTIVE agreement
      setup_api_calls:
      - call: POST /ops/facilities
        payload:
          name: Cyc Fac
          total_spaces: 200
