          - validations.priority_34.ERR_INSPECTION_NOT_SCHEDULED
        distinguishing_aspect: "The start action is a one-way transition, not an idempotent setter: the second call is refused with 409 ERR_INSPECTION_NOT_SCHEDULED and leaves started_at and version exactly as the first call set them."
