            - "Order.${o_id}.is_blended_cost == true and primary_units == 20 and fallback_units == 40 still hold"
            - "PrescriptionRequest.${rq_id}.consumed_quantity == 0 after the cancel"
            - "Drug.${d_id}.supply_units == 620 after the cancel, which is the same value as before payment"
            - "the invariant acquisition_cost_cents + markup_cents + pharmacy_fee_cents + shipping_fee_cents == patient_price_cents holds on both sides of the cancel (15 + 2 + 800 + 500 == 1317)"

      - name: substantive_record_disablement_conserves_the_servable_comparison_count
        grounds:
          - state_machines.PriceSubstantiation.transitions.PENDING_to_ENABLED
          - state_machines.PriceSubstantiation.transitions.ENABLED_to_DISABLED
          - calculations.comparison_lifecycle
          - errors[ERR_COMPARISON_UNSUBSTANTIATED]
          - endpoints.POST_/orders/{id}/substantiation-disablement
        distinguishing_aspect: >
          The forward action (enablement) makes the comparison message servable and
          the compensating action (disablement) withholds it again, conserving the
          count of servable comparisons at exactly its pre-enablement value and
          restoring the digest to null, so the round trip leaves the order's
          observability identical to where it started.
        test_recipe:
          setup:
            - "Empty database. Logical clock at 2026-09-01T00:00:00Z."
            - "Drug D is FORMULARY with eligible pool {P1 12c x 600u}; prescription RX is ACTIVE with one order O at quantity 60 and comparison C."
            - "Substantiation S for O exists, is PENDING, and valid_until is 2026-12-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PharmacyOps
            - call: "POST /manufacturers"
              payload: { manufacturer_name: "Bexley Generics" }
              as: PharmacyOps
              captures: { m1_id: $.data.id }
            - call: "POST /drugs"
              payload: { drug_name: "Metformin HCL", strength: "500MG", dosage_form: "Tablet", is_controlled: false, retail_reference_price_cents: 4200, insured_reference_price_cents: 3600 }
              as: PharmacyOps
              captures: { d_id: $.data.id }
            - call: "POST /manufacturer-drug-prices"
              payload: { drug_id: "${d_id}", manufacturer_id: "${m1_id}", unit_cost_cents: 12, available_units: 600, reliability_tier: "A", packaging: "500-count bottle" }
              as: PharmacyOps
              captures: { p1_id: $.data.id }
            - call: "POST /manufacturer-drug-prices/${p1_id}/activation"
              payload: {}
              as: PharmacyOps
            - call: "POST /manufacturer-drug-prices/${p1_id}/sourcing"
              payload: { to_sourcing_status: "SOURCED" }
              as: PharmacyOps
            - call: "POST /formularies/${d_id}/expansion"
              payload: {}
              as: PharmacyOps
            - call: "POST /pharmacies"
              payload: { pharmacy_name: "Sunbelt Mail Pharmacy", domicile_state_code: "TX", shipping_enabled: true }
              as: PharmacyOps
              captures: { ph_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", home_state_code: "CA" }
              as: PharmacyOps
              captures: { pat_id: $.data.id }
            - call: "POST /prescribers"
              payload: { prescriber_name: "Dr. Lin", npi: "1407001234", license_state_code: "CA" }
              as: PharmacyOps
              captures: { prs_id: $.data.id }
            - call: "POST /prescriptions"
              payload: { patient_id: "${pat_id}", prescriber_id: "${prs_id}", drug_id: "${d_id}", ship_state_code: "CA", total_refills_authorized: 1 }
              as: PharmacyOps
              captures: { rx_id: $.data.id }
            - call: "POST /prescriptions/${rx_id}/intake-requests"
              payload: { packaged_quantity: 100 }
              as: PharmacyOps
              captures: { rq_id: $.data.id }
            - call: "POST /prescription-requests/${rq_id}/review"
              payload: {}
              as: Pharmacist
            - call: "POST /prescription-requests/${rq_id}/acceptance"
              payload: {}
              as: Pharmacist
            - call: "POST /orders"
              payload: { prescription_id: "${rx_id}", request_id: "${rq_id}", pharmacy_id: "${ph_id}", quantity: 60, source_price_id: "${p1_id}" }
              as: PharmacyOps
              captures: { o_id: $.data.id }
            - call: "GET /orders/${o_id}"
              payload: {}
              as: PharmacyOps
              captures: { v_o_before: $.data.version }
            - call: "POST /price-substantiations"
              payload: { order_id: "${o_id}", source_kind: "RETAIL_SURVEY", source_reference: "Q3-2026 retail survey ref 88", observed_at: "2026-08-15T00:00:00Z", valid_until: "2026-12-01T00:00:00Z" }
              as: PharmacyOps
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /orders/${o_id}/substantiation-enablement"
              payload: { substantiation_id: "${s_id}", expected_order_version: "${v_o_before}" }
              as: PharmacyOps
            - call: "GET /orders/${o_id}/comparison"
              payload: {}
              as: PharmacyOps
            - call: "POST /orders/${o_id}/substantiation-disablement"
              payload: { substantiation_id: "${s_id}" }
              as: PharmacyOps
            - call: "GET /orders/${o_id}/comparison"
              payload: {}
              as: PharmacyOps
              captures: { err: $.data.error_id }
          assert:
            - "after enablement the comparison response is 200 with status == \"SUBSTANTIATED\", substantiated == true and a non-null substantiation_digest"
            - "after disablement the comparison response is 422 with error_id ERR_COMPARISON_UNSUBSTANTIATED"
            - "PriceSubstantiation.${s_id}.status == \"DISABLED\""
            - "the count of servable comparisons for order ${o_id} is 0 before enablement and 0 after disablement, so the round trip conserved it exactly"
            - "the comparison's substantiation_digest is null again, matching its pre-enablement value"
