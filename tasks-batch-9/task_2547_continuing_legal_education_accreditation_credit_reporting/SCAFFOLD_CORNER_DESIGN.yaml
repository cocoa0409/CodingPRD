      - name: the_cleared_audit_branch_stamps_last_audit_closed_at_and_raises_no_sanction_fee
        claim_type: side_effect_execution
        grounds:
          - state_machines.ProviderAudit.OPENED_to_SAMPLED
          - state_machines.ProviderAudit.SAMPLED_to_FINDINGS_ISSUED
          - state_machines.ProviderAudit.FINDINGS_ISSUED_to_CLEARED
          - calculations.audit_sample_selection
          - calculations.provider_risk_score
          - entities.Complaint.fields.escalated
        distinguishing_aspect: "Walking OPENED -> SAMPLED -> FINDINGS_ISSUED -> CLEARED with findings_count 0 stamps closed_at, sanction_type NONE and provider.last_audit_closed_at, leaves the fee ledger holding only the PROVIDER_ANNUAL assessment (the SANCTIONED branch is the only one that bills), and marks the originating complaint escalated. risk_score_at_open is frozen at 0.10 (0.30 * min(1, 1/3) with zero staleness), which is below RISK_SAMPLE_TIER_MID, so target_n is 2 and the one-course pool yields sample_size 1."
        test_recipe:
          setup:
            - "ACCREDITED provider driven to PROBATIONARY by a substantiated ATTENDANCE_FRAUD complaint, with one course presented inside the audit window [2025-01-01, 2025-06-30]."
          setup_api_calls:
