              as: StoreAssociate
              as_user_id: "${s1}"
              captures: { e_inv: "$.data.error_id" }
            - call: "POST /fulfillment-network/packaging-supplies/${pk_s2}/restock"
              payload: { added_units: 5 }
              as: StoreAssociate
              as_user_id: "${s1}"
              captures: { e_pkg: "$.data.error_id" }
            - call: "GET /fulfillment-network/assignments/${a2}"
              payload: {}
              as: StoreAssociate
              as_user_id: "${s1}"
            - call: "GET /fulfillment-network/store-inventories/${inv_s2}"
              payload: {}
              as: StoreAssociate
              as_user_id: "${s1}"
