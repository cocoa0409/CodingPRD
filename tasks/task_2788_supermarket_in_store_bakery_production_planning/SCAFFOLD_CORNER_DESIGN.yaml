              as: RegionalAdmin
              captures: { flour_a: $.data.id }
            - call: "POST /bakery/ingredients"
              payload: { department_id: "${dept_b}", name: "Baker Sugar", case_pack_units: 30, unit_cost_cents: 15, shelf_life_days: 10, daily_usage_units: 20, reorder_point_units: 60, on_hand_units: 500 }
              as: RegionalAdmin
              captures: { sugar_b: $.data.id }
            - call: "GET /bakery/departments/${dept_a}"
