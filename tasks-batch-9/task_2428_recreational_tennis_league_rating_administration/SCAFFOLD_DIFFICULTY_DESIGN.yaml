      - name: rating_period_closed_409_outranks_player_not_playable_422_rejected
        grounds:
          - validations[priority=33]
          - validations[priority=34]
          - entities.Section.fields.rating_period_status
          - entities.Player.fields.status
          - state_machines.RosterSpot.PENDING_to_ACTIVE
        distinguishing_aspect: |
          Activating the spot of a STRIKE_SUSPENDED player while the section sits in
          RECALC_IN_PROGRESS violates priority 33 (409) and priority 34 (422); the state rule
          wins, so the answer is 409 ERR_RATING_PERIOD_CLOSED. This pair spans the
          state/business_safety boundary, unlike 5a (state vs temporal) and 5b (referential vs
          constraint), and the recalculation touched zero players (recalculated_player_count 0)
          which proves the phase flag alone — not any rating data — produced the block.
        test_recipe:
          setup:
            - "Section SOCAL-2026 with strike_limit 3; SECTION league REGISTRATION_OPEN with min_active_roster_size 2, so roster edits are otherwise legal."
            - "Team H is left in DRAFT with two PENDING spots (rh1 for h1, rh2 for h2) and nothing activated."
            - "Player h2 receives one SCORECARD_FALSIFICATION strike of weight 3, reaching strike_limit exactly and becoming STRIKE_SUSPENDED while its spot is still PENDING."
            - "POST /tennis/sections/{id}/year-end-recalc then moves rating_period_status OPEN_SEASON -> RECALC_IN_PROGRESS; no player has verified_line_count >= 1, so scope is empty and recalculated_player_count is 0."
            - "The captain now tries to activate rh2, which is blocked by the closed rating period and by the unplayable player at the same time."
          setup_api_calls:
            - { call: "POST /tennis/sections", payload: { code: "SOCAL-2026", name: "Southern California", season_year: 2026, min_matches_for_playoff_eligibility: 1, strike_limit: 3, disqualification_strike_limit: 6 }, as: SectionAdmin, captures: { sec: $.data.id } }
