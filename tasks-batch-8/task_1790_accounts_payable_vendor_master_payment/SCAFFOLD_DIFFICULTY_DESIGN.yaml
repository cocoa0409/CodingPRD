      - name: matrix_bracket_max_exclusive_boundary
        grounds:
          - calculations.invoice_approval_routing
          - validations[priority=26]
        distinguishing_aspect: |
          Metric = amount_cents, endpoint = invoice submit: bracket bounds are [min inclusive,
          max EXCLUSIVE), so 499999 routes to tier 1 while exactly 500000 routes to tier 2.
        test_recipe:
          setup:
            - "GLOBAL rules [0,500000) t1 and [500000,1000000) t2; aged vendor (no bumps)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: SystemAdmin, as_user_id: "u-sys-01" }
            - { call: "POST /approval-matrix-rules", payload: { cost_center: "GLOBAL", min_amount_cents: 0, max_amount_cents: 500000, tier: 1 }, as: Controller, as_user_id: "u-ctl-01" }
            - { call: "POST /approval-matrix-rules", payload: { cost_center: "GLOBAL", min_amount_cents: 500000, max_amount_cents: 1000000, tier: 2 }, as: Controller, as_user_id: "u-ctl-01" }
            - call: "POST /vendors"
              payload: { legal_name: "Boundary Box", tax_id: "10-0000010", remit_email: "ap@bb.com", phone: "+1-555-1100", address_line1: "12 Spruce St", city: "Springfield", country: "US" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { v_id: $.data.id }
            - { call: "POST /vendors/${v_id}/documents", payload: { doc_type: "W9", valid_from: "2026-01-01", valid_until: "2027-12-31" }, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${v_id}/submit", payload: {}, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${v_id}/approve", payload: {}, as: VendorManager, as_user_id: "u-vm-01" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin, as_user_id: "u-sys-01" }
            - call: "POST /invoices"
              payload: { vendor_id: "${v_id}", invoice_number: "INV-7101", amount_cents: 499999, cost_center: "CC-100", received_date: "2026-08-01" }
              as: APClerk
              as_user_id: "u-ap-01"
              captures: { inv_lo: $.data.id }
            - call: "POST /invoices"
              payload: { vendor_id: "${v_id}", invoice_number: "INV-7102", amount_cents: 500000, cost_center: "CC-100", received_date: "2026-08-01" }
              as: APClerk
              as_user_id: "u-ap-01"
              captures: { inv_hi: $.data.id }
          trigger:
            - { call: "POST /invoices/${inv_lo}/submit", payload: {}, as: APClerk, as_user_id: "u-ap-01" }
            - { call: "POST /invoices/${inv_hi}/submit", payload: {}, as: APClerk, as_user_id: "u-ap-01" }
          assert:
            - "Invoice.${inv_lo}.required_tier == 1 (499999 < 500000 stays in bracket 1)"
            - "Invoice.${inv_hi}.required_tier == 2 (500000 hits the inclusive min of bracket 2; max of bracket 1 is EXCLUSIVE)"

      - name: duplicate_score_exactly_hard_block_threshold
        grounds:
          - calculations.duplicate_vendor_detection
          - validations[priority=13]
          - validations[priority=14]
        distinguishing_aspect: |
          Metric = 4dp Dice similarity score, endpoint = POST /vendors (disjoint from the amount
          boundary): 'Red Barn Feeda' vs 'Red Barn Feeds' scores EXACTLY 0.9000 and hard-blocks
          (>= semantics), while 0.8966 lands in the review band and 0.8966 with
          duplicate_acknowledged=true creates the vendor flagged duplicate_review_required.
        test_recipe:
          setup:
            - "Vendors 'Red Barn Feeds' and 'Stonebridge Supply' exist (both DRAFT)"
          setup_api_calls:
            - call: "POST /vendors"
              payload: { legal_name: "Red Barn Feeds", tax_id: "33-3333333", remit_email: "ap@rbf.com", phone: "+1-555-1200", address_line1: "13 Ranch Rd", city: "Springfield", country: "US" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
            - call: "POST /vendors"
              payload: { legal_name: "Stonebridge Supply", tax_id: "44-4444444", remit_email: "ap@sbs.com", phone: "+1-555-1201", address_line1: "14 Ridge Rd", city: "Springfield", country: "US" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
          trigger:
            - call: "POST /vendors"
              payload: { legal_name: "Red Barn Feeda", tax_id: "55-5555555", remit_email: "ap@rbf2.com", phone: "+1-555-1202", address_line1: "15 Ranch Rd", city: "Springfield", country: "US" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { err_hard: $.data.error_id }
            - call: "POST /vendors"
              payload: { legal_name: "Sonebridge Supply", tax_id: "66-6666666", remit_email: "ap@sbs2.com", phone: "+1-555-1203", address_line1: "16 Ridge Rd", city: "Springfield", country: "US" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { err_soft: $.data.error_id }
            - call: "POST /vendors"
              payload: { legal_name: "Sonebridge Supply", tax_id: "66-6666666", remit_email: "ap@sbs2.com", phone: "+1-555-1203", address_line1: "16 Ridge Rd", city: "Springfield", country: "US", duplicate_acknowledged: true }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { v_soft: $.data.id }
          assert:
            - "'Red Barn Feeda' (Dice exactly 0.9000): error_id == ERR_DUPLICATE_VENDOR_HARD_BLOCK — the >= boundary is inclusive"
            - "'Sonebridge Supply' (Dice 0.8966 < 0.9000, >= 0.7500): error_id == ERR_DUPLICATE_VENDOR_REVIEW_REQUIRED"
            - "Same payload with duplicate_acknowledged=true: 201 and Vendor.${v_soft}.duplicate_review_required == true, status == DRAFT"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: invoice_submit_gated_by_vendor_status
        grounds:
          - state_machines.Invoice.RECEIVED_to_PENDING_APPROVAL
          - validations[priority=21]
        distinguishing_aspect: |
          Entity pair Invoice x Vendor: submit is legal only while Vendor.status == ACTIVE;
          suspending the vendor after invoice creation makes the same submit fail with
          ERR_VENDOR_NOT_ACTIVE and leaves the invoice in RECEIVED.
        test_recipe:
          setup:
            - "GLOBAL t1 rule; vendor ACTIVE; invoice 100000 in RECEIVED; vendor then SUSPENDED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: SystemAdmin, as_user_id: "u-sys-01" }
            - { call: "POST /approval-matrix-rules", payload: { cost_center: "GLOBAL", min_amount_cents: 0, max_amount_cents: 500000, tier: 1 }, as: Controller, as_user_id: "u-ctl-01" }
            - call: "POST /vendors"
              payload: { legal_name: "Gated Goods", tax_id: "10-0000011", remit_email: "ap@gg.com", phone: "+1-555-1300", address_line1: "17 Alder St", city: "Springfield", country: "US" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { v_id: $.data.id }
            - { call: "POST /vendors/${v_id}/documents", payload: { doc_type: "W9", valid_from: "2026-01-01", valid_until: "2027-12-31" }, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${v_id}/submit", payload: {}, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${v_id}/approve", payload: {}, as: VendorManager, as_user_id: "u-vm-01" }
            - call: "POST /invoices"
              payload: { vendor_id: "${v_id}", invoice_number: "INV-8101", amount_cents: 100000, cost_center: "CC-100", received_date: "2026-06-01" }
              as: APClerk
              as_user_id: "u-ap-01"
              captures: { inv_id: $.data.id }
            - { call: "POST /vendors/${v_id}/suspend", payload: { reason: "audit" }, as: VendorManager, as_user_id: "u-vm-01" }
          trigger:
            - call: "POST /invoices/${inv_id}/submit"
              payload: {}
              as: APClerk
              as_user_id: "u-ap-01"
              captures: { err: $.data.error_id }
          assert:
            - "trigger error_id == ERR_VENDOR_NOT_ACTIVE"
            - "Invoice.${inv_id}.status == RECEIVED (no partial transition, approval_round still 0)"

      - name: run_add_gated_by_bank_cooling_off
        grounds:
          - validations[priority=35]
          - state_machines.Invoice.APPROVED_to_IN_PAYMENT_RUN
        distinguishing_aspect: |
          Entity pair Payment x VendorBankAccount (disjoint from the Invoice x Vendor instance):
          adding to a run requires now >= verified_at + 72h — at 48h the add fails with
          ERR_BANK_CHANGE_COOLING_OFF; at exactly 72h (boundary, inclusive) the same add succeeds
          and snapshots the primary account onto the new Payment.
        test_recipe:
          setup:
            - "GLOBAL t1 rule; vendor 'Cooling Colloids' activated 2026-07-01; primary bank VERIFIED 2026-08-01T00:00:00Z"
            - "Invoice 100000 approved at 2026-08-02 (bank 24h old -> tier bump made it tier 2, both approvals done)"
            - "DRAFT run scheduled 2026-08-10"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: SystemAdmin, as_user_id: "u-sys-01" }
            - { call: "POST /approval-matrix-rules", payload: { cost_center: "GLOBAL", min_amount_cents: 0, max_amount_cents: 500000, tier: 1 }, as: Controller, as_user_id: "u-ctl-01" }
            - call: "POST /vendors"
              payload: { legal_name: "Cooling Colloids", tax_id: "10-0000012", remit_email: "ap@cc.com", phone: "+1-555-1400", address_line1: "18 Beech St", city: "Springfield", country: "US" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { v_id: $.data.id }
            - { call: "POST /vendors/${v_id}/documents", payload: { doc_type: "W9", valid_from: "2026-01-01", valid_until: "2027-12-31" }, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${v_id}/submit", payload: {}, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${v_id}/approve", payload: {}, as: VendorManager, as_user_id: "u-vm-01", captures: { v_ver: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin, as_user_id: "u-sys-01" }
            - call: "POST /vendors/${v_id}/bank-accounts"
              payload: { account_number: "000555666777", routing_number: "021000021", account_holder_name: "Cooling Colloids", is_primary: true, expected_vendor_version: "${v_ver}" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { ba_id: $.data.id }
            - { call: "GET /bank-accounts/${ba_id}/callback-verifications", payload: {}, as: Auditor, as_user_id: "u-aud-01", captures: { cb_code: "$.data[0].verification_code" } }
            - { call: "POST /bank-accounts/${ba_id}/confirm-verification", payload: { verification_code: "${cb_code}" }, as: VendorManager, as_user_id: "u-vm-01" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SystemAdmin, as_user_id: "u-sys-01" }
            - call: "POST /invoices"
              payload: { vendor_id: "${v_id}", invoice_number: "INV-8201", amount_cents: 100000, cost_center: "CC-100", received_date: "2026-08-02" }
              as: APClerk
              as_user_id: "u-ap-01"
              captures: { inv_id: $.data.id }
            - { call: "POST /invoices/${inv_id}/submit", payload: {}, as: APClerk, as_user_id: "u-ap-01" }
            - { call: "POST /invoices/${inv_id}/approve", payload: { tier: 1 }, as: APSupervisor, as_user_id: "u-sup-01" }
            - { call: "POST /invoices/${inv_id}/approve", payload: { tier: 2 }, as: APManager, as_user_id: "u-mgr-01" }
            - { call: "POST /payment-runs", payload: { scheduled_date: "2026-08-10", payment_method: "CHECK" }, as: TreasuryAnalyst, as_user_id: "u-ta-01", captures: { run_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: SystemAdmin, as_user_id: "u-sys-01" }
          trigger:
            - call: "POST /payment-runs/${run_id}/invoices"
              payload: { invoice_id: "${inv_id}" }
              as: TreasuryAnalyst
              as_user_id: "u-ta-01"
              captures: { err: $.data.error_id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: SystemAdmin, as_user_id: "u-sys-01" }
            - call: "POST /payment-runs/${run_id}/invoices"
              payload: { invoice_id: "${inv_id}" }
              as: TreasuryAnalyst
              as_user_id: "u-ta-01"
              captures: { pay_id: $.data.id }
          assert:
            - "At verified_at + 48h: error_id == ERR_BANK_CHANGE_COOLING_OFF and invoice stays APPROVED"
            - "At verified_at + exactly 72h (inclusive boundary): 201, Payment.${pay_id}.status == PENDING and bank_account_id == ${ba_id}"
            - "Invoice.${inv_id}.required_tier == 2 (recent-bank bump applied at submit)"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: matrix_brackets_half_open_adjacency
        grounds:
          - validations[priority=24]
          - state_machines.ApprovalMatrixRule
        distinguishing_aspect: |
          Resource = ApprovalMatrixRule per cost_center, HALF-OPEN numeric semantics: [0,500000) then
          [500000,1000000) is legal adjacency (no shared amount), while [499999,600000) collides.
          A different cost_center scope may overlap freely.
        test_recipe:
          setup: ["Empty matrix"]
          setup_api_calls:
            - { call: "POST /approval-matrix-rules", payload: { cost_center: "GLOBAL", min_amount_cents: 0, max_amount_cents: 500000, tier: 1 }, as: Controller, as_user_id: "u-ctl-01", captures: { rule_a: $.data.id } }
          trigger:
            - { call: "POST /approval-matrix-rules", payload: { cost_center: "GLOBAL", min_amount_cents: 500000, max_amount_cents: 1000000, tier: 2 }, as: Controller, as_user_id: "u-ctl-01", captures: { rule_b: $.data.id } }
            - call: "POST /approval-matrix-rules"
              payload: { cost_center: "GLOBAL", min_amount_cents: 499999, max_amount_cents: 600000, tier: 2 }
              as: Controller
              as_user_id: "u-ctl-01"
              captures: { err: $.data.error_id }
            - { call: "POST /approval-matrix-rules", payload: { cost_center: "CC-900", min_amount_cents: 0, max_amount_cents: 500000, tier: 2 }, as: Controller, as_user_id: "u-ctl-01", captures: { rule_c: $.data.id } }
          assert:
            - "[500000,1000000) adjacent to [0,5000000)'s max: 201 created (min == prior max is NOT an overlap under half-open semantics)"
            - "[499999,600000): error_id == ERR_RULE_RANGE_OVERLAP"
            - "CC-900 [0,500000): 201 — overlap is scoped per cost_center, GLOBAL and CC-900 are independent resources"

      - name: vendor_document_closed_interval_overlap
        grounds:
          - validations[priority=23]
          - calculations.document_validity
        distinguishing_aspect: |
          Resource = VendorDocument per (vendor, doc_type), CLOSED date semantics: both bounds are
          inclusive, so [2026-12-31, 2027-06-30] collides with [2026-01-01, 2026-12-31] (the shared
          day 2026-12-31 belongs to both) — adjacency that the half-open matrix brackets permit is
          FORBIDDEN here; [2027-01-01, ...] is the first legal successor.
        test_recipe:
          setup: ["Vendor 'Doc Holdings' in DRAFT with W9 [2026-01-01, 2026-12-31]"]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { legal_name: "Doc Holdings", tax_id: "10-0000013", remit_email: "ap@dh.com", phone: "+1-555-1500", address_line1: "19 Walnut St", city: "Springfield", country: "US" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { v_id: $.data.id }
            - { call: "POST /vendors/${v_id}/documents", payload: { doc_type: "W9", valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: VendorSpecialist, as_user_id: "u-vs-01" }
          trigger:
            - call: "POST /vendors/${v_id}/documents"
              payload: { doc_type: "W9", valid_from: "2026-12-31", valid_until: "2027-06-30" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { err: $.data.error_id }
            - { call: "POST /vendors/${v_id}/documents", payload: { doc_type: "W9", valid_from: "2027-01-01", valid_until: "2027-12-31" }, as: VendorSpecialist, as_user_id: "u-vs-01", captures: { doc_b: $.data.id } }
            - { call: "POST /vendors/${v_id}/documents", payload: { doc_type: "INSURANCE_CERT", valid_from: "2026-06-01", valid_until: "2026-12-31" }, as: VendorSpecialist, as_user_id: "u-vs-01", captures: { doc_c: $.data.id } }
          assert:
            - "W9 [2026-12-31, 2027-06-30]: error_id == ERR_DOCUMENT_PERIOD_OVERLAP (shared day 2026-12-31 under closed-interval semantics)"
            - "W9 [2027-01-01, 2027-12-31]: 201 (first non-overlapping successor)"
            - "INSURANCE_CERT [2026-06-01, 2026-12-31]: 201 — overlap is scoped per (vendor, doc_type)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: run_total_cents_add_then_void_conserved
        grounds:
          - calculations.payment_run_totals
          - state_machines.Payment.PENDING_to_VOIDED
          - state_machines.Invoice.IN_PAYMENT_RUN_to_APPROVED
        distinguishing_aspect: |
          Conserved quantity = run money cents: adding invoice 2 (total 10889 -> 32667) then voiding
          its payment restores total_amount_cents to EXACTLY 10889 and item_count to 1 — the forward
          and compensating actions compose to the identity on the pinned formula.
        test_recipe:
          setup:
            - "Aged vendor, discount 2%/30d, GLOBAL t1; inv1 11111 and inv2 22222 APPROVED; DRAFT run scheduled 2026-08-20 (discounts apply: nets 10889 and 21778)"
