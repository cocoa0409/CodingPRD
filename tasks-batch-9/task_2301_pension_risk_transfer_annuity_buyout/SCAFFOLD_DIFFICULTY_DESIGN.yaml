      - name: insurer_selection_gated_on_opinion_verdict_not_opinion_existence
        grounds:
          - state_machines.BuyoutTranche.QUOTING_to_INSURER_SELECTED
          - state_machines.IndependentExpert.ENGAGED_to_OPINION_ISSUED
          - validations.priority_50
          - errors.ERR_EXPERT_OPINION_REQUIRED
        distinguishing_aspect: |
          Quoting only requires an expert in {ENGAGED, OPINION_ISSUED}; selection
          requires OPINION_ISSUED *and* safest_available_opinion == AFFIRMATIVE.
          The instance walks the seam: with the expert merely ENGAGED, quoting
          succeeded but selection returns ERR_EXPERT_OPINION_REQUIRED. Then the
          expert issues an ADVERSE opinion — the state dimension is now satisfied
          (OPINION_ISSUED) yet selection returns the very same error, because the
          verdict field, not the status field, is the operative predicate. An
          implementation keyed on expert_status alone flips to success here and
          fails. Only a second expert engaged and issuing AFFIRMATIVE unblocks the
          selection, and it unblocks it while the ADVERSE expert is still attached
          to the plan: the predicate is existential over the plan's experts, not
          universal, so one dissent does not veto.
