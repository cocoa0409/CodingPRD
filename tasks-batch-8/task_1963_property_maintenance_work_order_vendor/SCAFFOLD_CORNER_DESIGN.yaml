      - name: technician_cannot_start_unassigned_order
        claim_type: role_denial
        grounds: ["roles[Technician]", "validations[priority=3]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "A technician who is not the assigned party (assigned_technician_id names technician A; caller is technician B) gets ERR_NOT_RESOURCE_OWNER (403)."
