        distinguishing_aspect: |
          Metric: account balance money. The admission rule is amount <= balance (equality
          admitted): a 5000-cent purchase on a 5000-cent balance succeeds and zeroes the
          account; the follow-up 1-cent purchase is the one rejected. Distinct metric and
          endpoint from the deadline-boundary instance.
