              payload: {}
              as: ProgramDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T23:59:59Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /cycles/${cyc}/participants"
              payload: { external_ref: "P-LAST" }
              as: ProgramDirector
              captures: { p_ok: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /cycles/${cyc}/participants"
              payload: { external_ref: "P-LATE" }
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "at exactly enrollment_end: 201 created (inclusive boundary)"
            - "one second past: HTTP 422, error_id == ERR_ENROLLMENT_WINDOW_CLOSED"

      - name: stale_consent_form_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_STALE_CONSENT_FORM]"]
        distinguishing_aspect: "Consent grants are version-pinned to program.current_consent_form_version: after a bump to 2, granting with form_version 1 fails ERR_STALE_CONSENT_FORM while form_version 2 succeeds."
        test_recipe:
