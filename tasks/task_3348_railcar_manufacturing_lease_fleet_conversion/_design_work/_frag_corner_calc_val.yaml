      - name: validation_p12_changeover_window_collision_returns_changeover_conflict
        claim_type: Violation → Error
        grounds:
          - validations[priority=12]
          - errors[ERR_CHANGEOVER_CONFLICT]
          - entities.CarType.fields.line_count_family
        distinguishing_aspect: "A second changeover on the same line_count_family whose [2026-09-02, 2026-09-03) window collides with an incumbent window on that family is rejected by priority 12 with ERR_CHANGEOVER_CONFLICT and HTTP 409, while a disjoint window on the same line is accepted."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
            - "Car type FLT-100 (BOXCAR, build_hours 1, regulatory_life_years 25, line_count_family FLT_LINE) with one WS-310 WHEELSET bill-of-material row at qty_per_car 1 and on_hand_qty 1000."
            - "Two SOLD orders of 1 car each (planned_shop_days 1), priorities 1 and 2, are both reserved and released; order 1 takes the line family first with the window [2026-09-02, 2026-09-03), which makes order 2 the head of the remaining backlog."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "FLT-100", car_class: "BOXCAR", build_hours: 1, regulatory_life_years: 25, line_count_family: "FLT_LINE" }
              as: ProductionPlanner
              captures: { ct_id: $.data.id }
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-310", component_class: "WHEELSET", unit_cost_cents: 1000, lead_time_days: 5, on_hand_qty: 1000 }
              as: SupplyChainCoordinator
              captures: { ws_id: $.data.id }
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_id}", component_id: "${ws_id}", qty_per_car: 1 }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_id}", quantity: 1, planned_shop_days: 1, disposition: "SOLD", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-09-20" }
              as: ProductionPlanner
              captures: { po_1: $.data.id }
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_id}", quantity: 1, planned_shop_days: 1, disposition: "SOLD", priority_rank: 2, order_date: "2026-09-01", required_delivery_date: "2026-09-20" }
              as: ProductionPlanner
              captures: { po_2: $.data.id }
            - call: "POST /api/v1/production-orders/${po_1}/reserve-components"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_1}/release"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_2}/reserve-components"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_2}/release"
              payload: {}
              as: ProductionPlanner
          trigger:
            - call: "POST /api/v1/production-lines/FLT-L1/changeover"
              payload: { production_order_id: "${po_1}", scheduled_start_date: "2026-09-02", scheduled_end_date: "2026-09-03" }
              as: ProductionPlanner
              captures: { po_1_status: $.data.status }
            - call: "POST /api/v1/production-lines/FLT-L1/changeover"
              payload: { production_order_id: "${po_2}", scheduled_start_date: "2026-09-02", scheduled_end_date: "2026-09-03" }
              as: ProductionPlanner
              captures: { err_conflict: $.data.error_id }
            - call: "POST /api/v1/production-lines/FLT-L1/changeover"
              payload: { production_order_id: "${po_2}", scheduled_start_date: "2026-09-03", scheduled_end_date: "2026-09-04" }
              as: ProductionPlanner
              captures: { po_2_status: $.data.status }
          assert:
            - "The incumbent changeover was accepted: ProductionOrder.${po_1}.status == ${po_1_status} == \"IN_PRODUCTION\" with window [2026-09-02, 2026-09-03)"
            - "The colliding request returns HTTP 409 with data.error_id == ${err_conflict} == \"ERR_CHANGEOVER_CONFLICT\""
            - "The collision is judged on the car type's line_count_family FLT_LINE rather than on the path's line segment, so a different line name would not evade it"
            - "The control window [2026-09-03, 2026-09-04) touches the incumbent's end and is accepted: ProductionOrder.${po_2}.status == ${po_2_status} == \"IN_PRODUCTION\", because changeover windows are half-open"
            - "The rejected call did not disturb the incumbent: order 1 kept its IN_PRODUCTION status and its window"
