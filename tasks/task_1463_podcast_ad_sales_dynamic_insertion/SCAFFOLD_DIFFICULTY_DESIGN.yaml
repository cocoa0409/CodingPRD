  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: show_impression_pool_reserve_release_invariant
        grounds:
          - calculations.inventory_forecast
          - entities.Show.fields.reserved_impressions
          - entities.Show.fields.available_impressions
        distinguishing_aspect: |
          Conserved quantity: forecast impressions. The forward action (line-item
          ACTIVATE debiting 4000) paired with its compensating action (PAUSE
          releasing 4000) leaves reserved_impressions + available_impressions ==
          forecast_impressions == 9500 at every observed step.
        test_recipe:
          setup:
            - "Show avg 10000 with one episode in horizon -> forecast 9500; advertiser; ACTIVE campaign with APPROVED copy; DRAFT run-of-show line item reserved 4000"
          setup_api_calls:
            - call: "POST /adnet/shows"
              payload: { title: "Pool FM", content_category: "NEWS", avg_downloads_30d: 10000 }
              as: AdOps
              captures: { sh: $.data.id }
            - call: "POST /adnet/episodes"
              payload: { show_id: "${sh}", title: "E1", publish_at: "2026-08-05T00:00:00Z", measurement_window_days: 30, slot_capacity: 2 }
              as: AdOps
            - call: "POST /adnet/advertisers"
              payload: { name: "PoolCo", category: "AUTOMOTIVE" }
              as: AdOps
              captures: { adv: $.data.id }
            - call: "POST /adnet/campaigns"
              payload: { advertiser_id: "${adv}", name: "CP", flight_start: "2026-08-01T00:00:00Z", flight_end: "2026-09-01T00:00:00Z", booked_impressions: 4000, cpm_cents: 1000, billing_model: "ACTUAL_DELIVERY" }
              as: AdOps
              captures: { cmp: $.data.id }
            - call: "POST /adnet/ad-copies"
              payload: { campaign_id: "${cmp}", kind: "PRODUCED_AUDIO", script_text: "spot" }
              as: Advertiser
              as_user_id: "${adv}"
              captures: { cpy: $.data.id }
            - call: "POST /adnet/ad-copies/${cpy}/submit"
              as: Advertiser
              as_user_id: "${adv}"
            - call: "POST /adnet/ad-copies/${cpy}/review"
              payload: { action: "APPROVE" }
              as: AdOps
            - call: "POST /adnet/campaigns/${cmp}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
            - call: "POST /adnet/line-items"
              payload: { campaign_id: "${cmp}", show_id: "${sh}", ad_format: "PRODUCED_SPOT", position: "MID_ROLL", reserved_impressions: 4000, priority: 10, ad_copy_id: "${cpy}" }
              as: AdOps
              captures: { li: $.data.id }
          trigger:
            - call: "POST /adnet/line-items/${li}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
            - call: "POST /adnet/line-items/${li}/transition"
              payload: { action: "PAUSE" }
              as: AdOps
          assert:
            - "Before ACTIVATE: Show.${sh}.reserved_impressions == 0 and available_impressions == 9500"
            - "After ACTIVATE: reserved_impressions == 4000 and available_impressions == 5500 (4000 + 5500 == 9500)"
            - "After compensating PAUSE: reserved_impressions == 0 and available_impressions == 9500 — the conserved quantity forecast_impressions is unchanged by the forward+compensating pair"

      - name: episode_slot_occupancy_activate_end_invariant
        grounds:
          - calculations.episode_slot_occupancy
          - entities.Episode.fields.slots_in_use
        distinguishing_aspect: |
          Conserved quantity: episode slot count (a different quantity than
          forecast impressions). ACTIVATE of an episode-targeted line item
          (slots_in_use 0 -> 1) paired with END (1 -> 0) leaves slots_in_use +
          (slot_capacity - slots_in_use) == slot_capacity == 2 throughout.
        test_recipe:
          setup:
            - "Show; episode publish_at 2026-08-01T00:00:00Z slot_capacity 2; logical clock 2026-08-01T00:00:00Z (inside the campaign flight)"
            - "Advertiser; ACTIVE campaign flight [2026-08-01, 2026-09-01) with APPROVED copy; DRAFT episode-targeted line item"
          setup_api_calls:
            - call: "POST /adnet/shows"
              payload: { title: "Slot Pool", content_category: "SPORTS", avg_downloads_30d: 10000 }
              as: AdOps
              captures: { sh: $.data.id }
            - call: "POST /adnet/episodes"
              payload: { show_id: "${sh}", title: "E1", publish_at: "2026-08-01T00:00:00Z", measurement_window_days: 30, slot_capacity: 2 }
              as: AdOps
              captures: { ep: $.data.id }
            - call: "POST /adnet/advertisers"
              payload: { name: "SlotCo", category: "TECHNOLOGY" }
              as: AdOps
              captures: { adv: $.data.id }
            - call: "POST /adnet/campaigns"
              payload: { advertiser_id: "${adv}", name: "CS", flight_start: "2026-08-01T00:00:00Z", flight_end: "2026-09-01T00:00:00Z", booked_impressions: 10, cpm_cents: 1000, billing_model: "ACTUAL_DELIVERY" }
              as: AdOps
              captures: { cmp: $.data.id }
            - call: "POST /adnet/ad-copies"
              payload: { campaign_id: "${cmp}", kind: "PRODUCED_AUDIO", script_text: "spot" }
              as: Advertiser
              as_user_id: "${adv}"
              captures: { cpy: $.data.id }
            - call: "POST /adnet/ad-copies/${cpy}/submit"
              as: Advertiser
              as_user_id: "${adv}"
            - call: "POST /adnet/ad-copies/${cpy}/review"
              payload: { action: "APPROVE" }
              as: AdOps
            - call: "POST /adnet/campaigns/${cmp}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
            - call: "POST /adnet/line-items"
              payload: { campaign_id: "${cmp}", episode_id: "${ep}", ad_format: "PRODUCED_SPOT", position: "MID_ROLL", reserved_impressions: 10, priority: 10, ad_copy_id: "${cpy}" }
              as: AdOps
              captures: { li: $.data.id }
          trigger:
            - call: "POST /adnet/line-items/${li}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
            - call: "POST /adnet/line-items/${li}/transition"
              payload: { action: "END" }
              as: AdOps
          assert:
            - "Before ACTIVATE: Episode.${ep}.slots_in_use == 0 (slot_capacity 2 fully free)"
            - "After ACTIVATE: slots_in_use == 1 (flight contains the clock time)"
            - "After compensating END: slots_in_use == 0 — slot occupancy is conserved across the forward+compensating pair"
