  - rule_id: resource_temporal_overlap
    instances:
      - name: statewide_consent_policy_timeline_rejects_overlap_but_accepts_adjacent_generation
        grounds:
          - validations.priority_20_ERR_CONSENT_POLICY_INTERVAL_OVERLAP
          - entities.ConsentPolicy.fields.effective_from
          - entities.ConsentPolicy.fields.effective_until
          - state_machines.ConsentPolicy.ACTIVE_to_SUPERSEDED
          - endpoints.POST_hie_consent_policies
        distinguishing_aspect: |
          Resource entity: ConsentPolicy. Interval semantics: HALF-OPEN [effective_from,
          effective_until) over a single statewide timeline of capacity 1, where an open-ended policy
          (effective_until null) extends to infinity. Because the right edge is exclusive, a successor
          starting exactly at the incumbent's effective_until is ACCEPTED (adjacency is legal) while a
          successor starting one month earlier is REJECTED. Contrast with the break-glass instance, whose
          interval is closed at both ends and carries an extra cooldown buffer.
        test_recipe:
          setup:
            - "Policy generation 1 covers [2026-01-01T00:00:00Z, 2026-07-01T00:00:00Z) and is ACTIVE."
          setup_api_calls:
            - call: "POST /hie/consent-policies"
              payload: { policy_version: "SP-2026.A", model: "OPT_IN", sensitive_categories_segmented: ["BEHAVIORAL_HEALTH", "HIV"], default_share_for_treatment: false, effective_from: "2026-01-01T00:00:00Z", effective_until: "2026-07-01T00:00:00Z" }
              as: PrivacyOfficer
              as_user_id: "privacy-policy-1"
              captures: { polA_id: $.data.id, polA_status_draft: $.data.status }
            - call: "POST /hie/consent-policies/${polA_id}/activation"
              payload: {}
              as: PrivacyOfficer
              as_user_id: "privacy-policy-1"
              captures: { polA_status_active: $.data.status }
          trigger:
            - call: "POST /hie/consent-policies"
              payload: { policy_version: "SP-2026.B", model: "OPT_OUT", sensitive_categories_segmented: ["BEHAVIORAL_HEALTH"], default_share_for_treatment: true, effective_from: "2026-06-01T00:00:00Z" }
              as: PrivacyOfficer
              as_user_id: "privacy-policy-1"
            - call: "POST /hie/consent-policies"
              payload: { policy_version: "SP-2026.C", model: "OPT_OUT", sensitive_categories_segmented: ["BEHAVIORAL_HEALTH", "HIV", "SUBSTANCE_USE"], default_share_for_treatment: true, effective_from: "2026-07-01T00:00:00Z" }
              as: PrivacyOfficer
              as_user_id: "privacy-policy-1"
              captures: { polC_id: $.data.id, polC_status_draft: $.data.status }
            - call: "POST /hie/consent-policies/${polC_id}/activation"
              payload: {}
              as: PrivacyOfficer
              as_user_id: "privacy-policy-1"
              captures: { polC_status_active: $.data.status, polC_activator: $.data.activated_by_user_id }
            - call: "GET /hie/consent-policies/${polA_id}"
              payload: {}
              as: PrivacyOfficer
              captures: { polA_status_final: $.data.status }
          assert:
            - "${polA_status_draft} == DRAFT"
            - "${polA_status_active} == ACTIVE"
            - "the first trigger call returns status 409 with error.code == ERR_CONSENT_POLICY_INTERVAL_OVERLAP, because [2026-06-01, infinity) overlaps [2026-01-01, 2026-07-01) on the month of June"
            - "the first trigger call writes no ConsentPolicy row"
            - "${polC_status_draft} == DRAFT"
            - "the second trigger call returns status 201, because effective_from 2026-07-01T00:00:00Z equals the incumbent's exclusive effective_until"
            - "${polC_status_active} == ACTIVE"
            - "${polC_activator} == privacy-policy-1"
            - "${polA_status_final} == SUPERSEDED"
            - "GET /hie/consent-policies filtered by status ACTIVE returns exactly 1 row, id ${polC_id}"
      - name: break_glass_cooldown_interval_is_closed_at_both_ends_and_scoped_per_clinician
        grounds:
          - validations.priority_19_ERR_BREAK_GLASS_COOLDOWN_ACTIVE
          - calculations.break_glass_sanction_points.constants.BREAK_GLASS_SESSION_MINUTES
          - calculations.break_glass_sanction_points.constants.BREAK_GLASS_COOLDOWN_MINUTES
          - endpoints.POST_hie_break_glass_accesses
          - endpoints.POST_hie_clock_set_current_utc
        distinguishing_aspect: |
          A different resource entity (BreakGlassAccess) with different interval semantics: the occupation
          interval is [opened_at, expires_at + BREAK_GLASS_COOLDOWN_MINUTES] CLOSED at both ends, so a
          re-invocation exactly at the far edge (2026-09-01T05:00:00Z = 00:00 + 240 min + 60 min) still
          collides and only 05:00:01Z is free - the opposite edge behaviour to the half-open policy
          timeline. The interval is also keyed per (cluster_id, invoking_clinician_user_id) rather than
          global, so a second clinician may occupy the very instant the first is refused.
        test_recipe:
          setup:
            - "A PROBABILISTIC_ONLY threshold generation is ACTIVE."
            - "Participant T is certified end-to-end and contributes one patient record, creating a single-member ACTIVE cluster."
            - "The logical clock is moved to 2026-09-01T00:00:00Z and clinician clin-t-1 opens a DISASTER session, so opened_at is 2026-09-01T00:00:00Z and expires_at is 2026-09-01T04:00:00Z."
          setup_api_calls:
            - call: "POST /hie/match-threshold-configs"
              payload: { config_label: "REF-PROB-T", auto_link_threshold: 0.9200, review_lower_bound: 0.7500, score_variant_mode: "PROBABILISTIC_ONLY", weight_family_name: 0.20, weight_given_name: 0.12, weight_birth_date: 0.25, weight_ssn_last4: 0.28, weight_postal_code: 0.08, weight_phone_digits: 0.07, partial_credit_factor: 0.50 }
              as: PrivacyOfficer
              as_user_id: "privacy-tuner-1"
              captures: { cfgT_id: $.data.id }
            - call: "POST /hie/match-threshold-configs/${cfgT_id}/activation"
              payload: {}
              as: PrivacyOfficer
              as_user_id: "privacy-tuner-1"
            - call: "POST /hie/participants"
              payload: { legal_name: "Thornhill Regional Trauma Center", org_type: "HOSPITAL", declared_annual_patient_volume: 156000, primary_contact_email: "hie@thornhill.example" }
              as: HieAdmin
              captures: { pT_id: $.data.id }
