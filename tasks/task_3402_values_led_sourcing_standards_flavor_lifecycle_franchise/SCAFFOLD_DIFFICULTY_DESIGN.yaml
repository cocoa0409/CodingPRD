        distinguishing_aspect: |
          Error-category pair (business_safety, business_referential) — different
          pair from state_beats_fiscal_on_order_confirm: publishing a claim whose
          verified coverage (85.0) is below the FAIR_TRADE_SOURCING threshold
          (95) AND one of whose cited certs has expired returns the compliance
