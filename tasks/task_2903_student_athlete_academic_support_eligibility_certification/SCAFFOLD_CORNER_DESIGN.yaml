          assert:
            - "The response is HTTP 201 with data.status == PROPOSED, data.suspension_count == 0, data.logged_hours == 0.00 and data.terminated_reason null"
            - "GET /athletics/tutor-assignments with tutor_id ${t56_id} returns total_count == 1 and that row's enrollment_id == ${e56_id}"
            - "GET /athletics/tutor-assignments with enrollment_id ${e56_id} returns total_count == 1 and that row's tutor_id == ${t56_id}"
            - "Tutor.${t56_id}.assigned_weekly_hours == 0.00 because only ACTIVE assignments consume capacity"

