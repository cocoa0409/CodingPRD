          - validations[priority 54 ERR_CREW_NOT_QUALIFIED_FOR_LESSEE_PROCEDURES]
          - errors.ERR_CREW_NOT_TYPE_RATED
          - entities.CrewMember.fields.type_ratings
        distinguishing_aspect: |
          Type rating is checked against the OPERATING airframe's type_designator (B738), not against
          the lease or the type_family, and it is checked at priority 50 - ahead of the
          lessee-procedures gate at 54. Here the first officer is fully QUALIFIED on the lease but
          rated only on A320, so the answer must be 422 ERR_CREW_NOT_TYPE_RATED and not the 409 that
          an implementation ordering these two checks the other way round would return.
          
