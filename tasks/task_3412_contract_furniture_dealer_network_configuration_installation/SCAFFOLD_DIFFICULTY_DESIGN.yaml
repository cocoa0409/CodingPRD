  # ------------------------------------------------------------------ Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: tier_boundary_exactly_25000000_cents_crosses
        grounds:
          - calculations.order_pricing
          - entities.VolumeAgreement.fields.current_tier
        distinguishing_aspect: |
          Metric: money (cents). The tier boundary is inclusive on its lower
          edge: a FINAL tier basis of exactly TIER2_MIN_CENTS=25000000 yields
          tier 2, while 24875000 (one 99-chair order short) yields tier 1 —
          exercised through submit/acknowledge endpoints.
        test_recipe:
          setup:
            - "agreement carries cumulative 12500000 (one 100-chair order acknowledged); locked configs of 99 chairs and 1 chair exist"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ManufacturerAdmin }
            - { call: "POST /product-families", payload: { family_code: "SEAT-2200", name: "Seating 2200", category: "SEATING", base_lead_time_days: 28 }, as: ManufacturerAdmin }
            - { call: "POST /dealers", payload: { name: "Dealer Alpha", territory_codes: ["MI", "OH"], service_capability_level: 4 }, as: ManufacturerAdmin, captures: { dlr_id: "$.data.id" } }
            - { call: "POST /end-users", payload: { name: "MegaCorp", industry: "technology" }, as: ManufacturerAdmin, captures: { eu_id: "$.data.id" } }
            - { call: "POST /volume-agreements", payload: { end_user_id: "${eu_id}", effective_start: "2026-01-01", effective_end: "2027-12-31", tier1_discount_pct: 0.10, tier2_discount_pct: 0.15, tier3_discount_pct: 0.20 }, as: ManufacturerAdmin, captures: { agr_id: "$.data.id" } }
            - { call: "POST /volume-agreements/${agr_id}/activate", as: ManufacturerAdmin }
            - { call: "POST /configurations", payload: { name: "Chairs 100", modules: [{ module_type: "TASK_CHAIR_SET", fabric_grade: "A", qty: 100 }] }, as: DealerRep, as_user_id: "${dlr_id}", captures: { cfg100: "$.data.id" , v100: "$.data.version" } }
            - { call: "POST /configurations/${cfg100}/lock", payload: { expected_configuration_version: "${v100}" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /configurations", payload: { name: "Chairs 99", modules: [{ module_type: "TASK_CHAIR_SET", fabric_grade: "A", qty: 99 }] }, as: DealerRep, as_user_id: "${dlr_id}", captures: { cfg99: "$.data.id" , v99: "$.data.version" } }
            - { call: "POST /configurations/${cfg99}/lock", payload: { expected_configuration_version: "${v99}" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /configurations", payload: { name: "Chair 1", modules: [{ module_type: "TASK_CHAIR_SET", fabric_grade: "A", qty: 1 }] }, as: DealerRep, as_user_id: "${dlr_id}", captures: { cfg1: "$.data.id" , v1c: "$.data.version" } }
            - { call: "POST /configurations/${cfg1}/lock", payload: { expected_configuration_version: "${v1c}" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /project-orders", payload: { volume_agreement_id: "${agr_id}", configuration_id: "${cfg100}", territory_code: "MI", requested_install_date: "2026-12-15" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { o1: "$.data.id", o1v: "$.data.version" } }
            - { call: "POST /project-orders/${o1}/submit", payload: { expected_order_version: "${o1v}" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /project-orders/${o1}/acknowledge", as: ManufacturerAdmin }
          trigger:
            - { call: "POST /project-orders", payload: { volume_agreement_id: "${agr_id}", configuration_id: "${cfg99}", territory_code: "MI", requested_install_date: "2026-12-15" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { o2: "$.data.id", o2v: "$.data.version" } }
            - { call: "POST /project-orders/${o2}/submit", payload: { expected_order_version: "${o2v}" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /project-orders/${o2}/acknowledge", as: ManufacturerAdmin, captures: { o2_tier: "$.data.final_tier", o2_total: "$.data.final_total_cents" } }
            - { call: "POST /project-orders", payload: { volume_agreement_id: "${agr_id}", configuration_id: "${cfg1}", territory_code: "MI", requested_install_date: "2026-12-15" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { o3: "$.data.id", o3v: "$.data.version" } }
            - { call: "POST /project-orders/${o3}/submit", payload: { expected_order_version: "${o3v}" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /project-orders/${o3}/acknowledge", as: ManufacturerAdmin, captures: { o3_tier: "$.data.final_tier", o3_total: "$.data.final_total_cents" } }
          assert:
            - "order2 (99 chairs, pre 12375000): final basis 24875000 < 25000000 -> final_tier == 1 and final_total_cents == 11137500"
            - "order3 (1 chair, pre 125000): final basis 24875000+125000 == 25000000 exactly -> final_tier == 2 and final_total_cents == 106250 (>= on the boundary)"

      - name: zero_open_critical_punches_gate_at_complete
        grounds:
          - validations[priority=25]
          - state_machines.InstallationPhase
          - state_machines.PunchTicket
        distinguishing_aspect: |
          Metric: count of blocking punch tickets (zero boundary), exercised
          through POST /phases/{phaseId}/complete — a different metric and
          endpoint from the money boundary. One CRITICAL punch blocks at 1;
          RESOLVED-but-unverified CRITICAL still counts; only VERIFIED drops
          the count to 0 and lets complete succeed.
        test_recipe:
          setup:
            - "phase IN_PROGRESS at clock 2026-11-02 (4-chair order, install 2026-12-15)"
            - "one CRITICAL punch ticket filed by the end user"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ManufacturerAdmin }
            - { call: "POST /product-families", payload: { family_code: "SEAT-2200", name: "Seating 2200", category: "SEATING", base_lead_time_days: 28 }, as: ManufacturerAdmin }
            - { call: "POST /dealers", payload: { name: "Dealer Alpha", territory_codes: ["MI", "OH"], service_capability_level: 4 }, as: ManufacturerAdmin, captures: { dlr_id: "$.data.id" } }
            - { call: "POST /end-users", payload: { name: "MegaCorp", industry: "technology" }, as: ManufacturerAdmin, captures: { eu_id: "$.data.id" } }
            - { call: "POST /volume-agreements", payload: { end_user_id: "${eu_id}", effective_start: "2026-01-01", effective_end: "2027-12-31", tier1_discount_pct: 0.10, tier2_discount_pct: 0.15, tier3_discount_pct: 0.20 }, as: ManufacturerAdmin, captures: { agr_id: "$.data.id" } }
            - { call: "POST /volume-agreements/${agr_id}/activate", as: ManufacturerAdmin }
            - { call: "POST /configurations", payload: { name: "Chairs", modules: [{ module_type: "TASK_CHAIR_SET", fabric_grade: "A", qty: 4 }] }, as: DealerRep, as_user_id: "${dlr_id}", captures: { cfg_id: "$.data.id" , cfg_v: "$.data.version" } }
            - { call: "POST /configurations/${cfg_id}/lock", payload: { expected_configuration_version: "${cfg_v}" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /project-orders", payload: { volume_agreement_id: "${agr_id}", configuration_id: "${cfg_id}", territory_code: "MI", requested_install_date: "2026-12-15" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { ord_id: "$.data.id", ord_v: "$.data.version" } }
            - { call: "POST /project-orders/${ord_id}/submit", payload: { expected_order_version: "${ord_v}" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /project-orders/${ord_id}/acknowledge", as: ManufacturerAdmin }
            - { call: "POST /project-orders/${ord_id}/phases", payload: { floor_number: 1, phase_sequence: 1, building_zone_id: "Z1", planned_units: 10 }, as: DealerRep, as_user_id: "${dlr_id}", captures: { ph_id: "$.data.id" } }
            - { call: "POST /phases/${ph_id}/reserve-slot", payload: { plant_code: "PLANT_GR", production_date: "2026-11-02" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-02T00:00:00Z" }, as: ManufacturerAdmin }
            - { call: "POST /phases/${ph_id}/start-install", as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /punch-tickets", payload: { installation_phase_id: "${ph_id}", severity: "CRITICAL", description: "Live wire exposed at station 7" }, as: EndUserRep, as_user_id: "${eu_id}", captures: { pt_id: "$.data.id" } }
          trigger:
            - { call: "POST /phases/${ph_id}/complete", as: DealerRep, as_user_id: "${dlr_id}", captures: { err_open: "$.data.error_id" } }
            - { call: "POST /punch-tickets/${pt_id}/resolve", payload: { resolution_note: "Rewired and taped" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /phases/${ph_id}/complete", as: DealerRep, as_user_id: "${dlr_id}", captures: { err_res: "$.data.error_id" } }
            - { call: "POST /punch-tickets/${pt_id}/verify", payload: { outcome: "CONFIRMED" }, as: EndUserRep, as_user_id: "${eu_id}" }
            - { call: "POST /phases/${ph_id}/complete", as: DealerRep, as_user_id: "${dlr_id}", captures: { fin_st: "$.data.install_status" } }
          assert:
            - "complete with 1 OPEN CRITICAL fails ERR_OPEN_CRITICAL_PUNCH"
            - "complete with the CRITICAL in RESOLVED (unverified) still fails ERR_OPEN_CRITICAL_PUNCH (count over {OPEN, RESOLVED} is still 1)"
            - "after verify CONFIRMED the count hits exactly 0 and complete succeeds: install_status == COMPLETE"

  # ------------------------------------------------------------------ Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_submit_requires_configuration_locked
        grounds:
          - validations[priority=11]
          - state_machines.ConfigurationSpec
          - state_machines.ProjectOrder.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Entity pair ProjectOrder <- ConfigurationSpec: submit reads the
          referenced spec's state; a DRAFT (never locked) spec rejects the
          order's DRAFT->SUBMITTED transition with ERR_SPEC_NOT_LOCKED, and
          locking the same spec afterwards makes the identical submit succeed.
        test_recipe:
          setup:
            - "spec DRAFT (never locked); order created against it"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ManufacturerAdmin }
            - { call: "POST /product-families", payload: { family_code: "SEAT-2200", name: "Seating 2200", category: "SEATING", base_lead_time_days: 28 }, as: ManufacturerAdmin }
            - { call: "POST /dealers", payload: { name: "Dealer Alpha", territory_codes: ["MI", "OH"], service_capability_level: 4 }, as: ManufacturerAdmin, captures: { dlr_id: "$.data.id" } }
            - { call: "POST /end-users", payload: { name: "MegaCorp", industry: "technology" }, as: ManufacturerAdmin, captures: { eu_id: "$.data.id" } }
            - { call: "POST /volume-agreements", payload: { end_user_id: "${eu_id}", effective_start: "2026-01-01", effective_end: "2027-12-31", tier1_discount_pct: 0.10, tier2_discount_pct: 0.15, tier3_discount_pct: 0.20 }, as: ManufacturerAdmin, captures: { agr_id: "$.data.id" } }
            - { call: "POST /volume-agreements/${agr_id}/activate", as: ManufacturerAdmin }
            - { call: "POST /configurations", payload: { name: "Chairs", modules: [{ module_type: "TASK_CHAIR_SET", fabric_grade: "A", qty: 4 }] }, as: DealerRep, as_user_id: "${dlr_id}", captures: { cfg_id: "$.data.id", cfg_v: "$.data.version" } }
            - { call: "POST /project-orders", payload: { volume_agreement_id: "${agr_id}", configuration_id: "${cfg_id}", territory_code: "MI", requested_install_date: "2026-12-15" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { ord_id: "$.data.id", ord_v: "$.data.version" } }
          trigger:
            - { call: "POST /project-orders/${ord_id}/submit", payload: { expected_order_version: "${ord_v}" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { err: "$.data.error_id" } }
            - { call: "POST /configurations/${cfg_id}/lock", payload: { expected_configuration_version: "${cfg_v}" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /project-orders/${ord_id}/submit", payload: { expected_order_version: "${ord_v}" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { st2: "$.data.status" } }
          assert:
            - "first submit error_id == ERR_SPEC_NOT_LOCKED and order status remains DRAFT"
            - "after locking the spec, the identical submit (same expected_order_version, unchanged by the failed call) succeeds: status == SUBMITTED (state dependency, not data dependency)"

      - name: phase_reserve_requires_order_acknowledged
        grounds:
          - validations[priority=12]
          - state_machines.InstallationPhase
          - state_machines.ProjectOrder.SUBMITTED_to_ACKNOWLEDGED
        distinguishing_aspect: |
          Entity pair InstallationPhase <- ProjectOrder: reserve-slot reads
          the parent order's state; a phase of a merely SUBMITTED order
          rejects PLANNED->SCHEDULED with ERR_ORDER_NOT_ACKNOWLEDGED.
        test_recipe:
          setup:
            - "order SUBMITTED (not yet acknowledged); phase created while order is SUBMITTED (phase creation is allowed in DRAFT/SUBMITTED/ACKNOWLEDGED)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ManufacturerAdmin }
            - { call: "POST /product-families", payload: { family_code: "SEAT-2200", name: "Seating 2200", category: "SEATING", base_lead_time_days: 28 }, as: ManufacturerAdmin }
            - { call: "POST /dealers", payload: { name: "Dealer Alpha", territory_codes: ["MI", "OH"], service_capability_level: 4 }, as: ManufacturerAdmin, captures: { dlr_id: "$.data.id" } }
            - { call: "POST /end-users", payload: { name: "MegaCorp", industry: "technology" }, as: ManufacturerAdmin, captures: { eu_id: "$.data.id" } }
            - { call: "POST /volume-agreements", payload: { end_user_id: "${eu_id}", effective_start: "2026-01-01", effective_end: "2027-12-31", tier1_discount_pct: 0.10, tier2_discount_pct: 0.15, tier3_discount_pct: 0.20 }, as: ManufacturerAdmin, captures: { agr_id: "$.data.id" } }
