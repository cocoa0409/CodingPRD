              captures: { wg: $.data.id, wg_v: $.data.version }
            - call: "POST /camp-ops/workout-groups/${wg}/assignments"
              payload: { workout_group_id: "${wg}", player_id: "${pl}", roster_bucket: "MAJOR", assignment_kind: "REHAB", expected_group_version: "${wg_v}" }
