      - claim_type: segregation_of_duties
        name: the_preparer_of_an_audit_cannot_review_or_close_it
        grounds:
          - validations[priority=79]
          - errors.ERR_SEGREGATION_OF_DUTIES
          - complexity_profile.role_model
          - state_machines.CustomsAudit.SUBMITTED_to_INFO_REQUESTED
        distinguishing_aspect: |
          Segregation of duties is enforced on X-User-ID, not on the role: a CustomsAuditor whose user id
          equals audit.preparer_user_id MUST be refused with 409 ERR_SEGREGATION_OF_DUTIES on both
          request-info and close, and a DIFFERENT auditor user MUST succeed. Checking only the role lets
          the preparer sign off on their own count.
        test_recipe:
          setup:
            - "Terminal HKG in HK, one ELECTRONICS product at 20000 cents / 700 bps with 100 units"
            - "ConcessionAgreement 2026-08 for HKG, activated and closed after the clock passes the period end"
            - "An audit prepared and submitted by user-stock-01 with counted_qty 90"
