            - call: "GET /search-assignments/${asg_id}"
              payload: {}
              as: Consultant
              as_user_id: "${c_id}"
              captures: { seats_after: $.data.open_positions_remaining, repl_after: $.data.replacement_count }
          assert:
            - "${seats_before} == 2"
            - "${seats_mid} == 1   # positions_total 2 - 1 ACTIVE_GUARANTEE placement"
            - "${sourcing_mid} == SLATE_SUBMITTED   # a seat remains, so the assignment does NOT reach FILLED"
            - "Engagement.${eng_id}.placements_count == 1 immediately after acceptance"
            - "${seats_after} == 2   # the FALLEN_OFF placement no longer consumes a seat"
            - "${repl_after} == 0    # replacement_count only increments on the FILLED -> OPEN transition"
            - "Engagement.${eng_id}.placements_count == 0 after the fall-off"
            - "Invariant holds at every step: open_positions_remaining == positions_total - COUNT(Placement in {ACTIVE_GUARANTEE, GUARANTEE_EXPIRED})"
