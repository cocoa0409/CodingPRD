        claim_type: immediate
        grounds: [endpoints, state_machines.PartDEnrollment.PENDING_to_ACTIVE]
        distinguishing_aspect: "The Part D confirm response immediately reflects status=ACTIVE and the computed lep_premium_cents in the same request's body (immediate consistency)."
        test_recipe:
          setup: ["A PENDING Part D enrollment, creditable null, confirm at Jan 2026 -> 13 uncovered months -> 450c"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-11-01T00:00:00.000Z" }
              as: EnrollmentAdmin
            - call: "POST /beneficiaries"
              payload: { full_name: "ImmB", date_of_birth: "1959-08-15T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { ben_id: $.data.id }
            - call: "POST /beneficiaries/${ben_id}/enrollment-periods"
              payload: { period_type: "IEP" }
              as: EnrollmentAdmin
              captures: { iep_id: $.data.id }
            - call: "POST /plans"
              payload: { name: "PDP Imm", part_type: "PART_D", monthly_premium_cents: 2000, star_rating: 3.0, includes_drug_coverage: true }
              as: EnrollmentAdmin
              captures: { pdp_id: $.data.id }
            - call: "POST /part-d-enrollments"
              payload: { beneficiary_id: "${ben_id}", plan_id: "${pdp_id}", enrollment_period_id: "${iep_id}" }
              as: EnrollmentAdmin
              captures: { pde_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00.000Z" }
              as: EnrollmentAdmin
          trigger:
            - call: "POST /part-d-enrollments/${pde_id}/confirm"
              payload: {}
              as: EnrollmentAdmin
              captures: { st: $.data.status, lep: $.data.lep_premium_cents }
          assert:
            - "response.status == 200"
            - "PartDEnrollment.${pde_id}.status == ACTIVE"
            - "PartDEnrollment.${pde_id}.lep_premium_cents == 450"
