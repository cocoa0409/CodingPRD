  - rule_id: cross_entity_state_dependency
    instances:
      - name: settle_blocked_by_stopped_certificate
        grounds:
          - state_machines.TransferRequest.APPROVED_to_SETTLED
          - state_machines.Certificate.ISSUED_to_LOST_REPORTED
        distinguishing_aspect: |
          Entity pair TransferRequest -> Certificate: an APPROVED transfer cannot settle once its
          source certificate has moved ISSUED -> LOST_REPORTED (stop-transfer order). The gate is
          the certificate's state, not anything on the transfer itself.
        test_recipe:
          setup:
            - "Issuer outstanding 300, price 5000; account A 300 book shares; 100-share certificate C withdrawn; account B"
            - "Certificated transfer of the 100 shares medallion-verified (coverage 500000) and approved by a different supervisor id"
            - "Certificate C reported lost before settlement"
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Xi Inc", cusip: "000000014", ticker: "XII", shares_outstanding: 300, par_value_cents: 1, current_market_price_cents: 5000 }
              as: AgentAdmin
              captures: { iss: $.data.id }
