      - name: listing_create_against_an_unapproved_facility_is_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=20]
          - errors[ERR_FACILITY_NOT_REGISTERED]
          - state_machines.Facility.DRAFT
        distinguishing_aspect: |
          The gate reads the PARENT facility's registration_status, so a DRAFT facility (and a
          PENDING_REVIEW one) refuses listings with ERR_FACILITY_NOT_REGISTERED (422) even though the
          facility id resolves fine — the 404 branch is not what fires — and the identical payload is
          accepted the moment the approval lands.
        test_recipe:
          setup:
            - "one DRAFT facility and one ResponsiblePerson"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
