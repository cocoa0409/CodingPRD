              as: RecipeDeveloper
              captures: { sub_comp: $.data.id }
            - call: "POST /culinary/recipes/${parent_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
              captures: { p_batch: $.data.batch_cost_micros, p_portion: $.data.portion_cost_micros, p_mask: $.data.allergen_mask, p_kcal: $.data.kcal_per_portion_micros, p_sodium: $.data.sodium_mcg_per_portion, p_depth: $.data.depth, p_state: $.data.cost_state }
            - call: "GET /culinary/recipe-components/${sub_comp}"
              as: CostAnalyst
              captures: { sub_ext: $.data.extended_cost_micros, sub_unit: $.data.unit_cost_micros_used }
          trigger:
            - call: "POST /culinary/recipes/${child_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${flour_id}", ep_quantity_base_units: 200, sequence_no: 2, expected_recipe_version: "${child_v1}" }
              as: RecipeDeveloper
              captures: { child_c2: $.data.id }
            - call: "GET /culinary/recipes/${child_id}"
              as: RecipeDeveloper
              captures: { child_mask2: $.data.allergen_mask, child_kcal2: $.data.kcal_per_portion_micros, child_sodium2: $.data.sodium_mcg_per_portion, child_state2: $.data.cost_state, child_batch2: $.data.batch_cost_micros }
            - call: "GET /culinary/recipes/${parent_id}"
              as: RecipeDeveloper
              captures: { p_mask_stale: $.data.allergen_mask, p_kcal_stale: $.data.kcal_per_portion_micros, p_sodium_stale: $.data.sodium_mcg_per_portion, p_state_stale: $.data.cost_state, p_v_stale: $.data.version }
            - call: "GET /culinary/recipes/${parent_id}/allergen-nutrition"
              as: CostAnalyst
              captures: { live_mask: $.data.allergen_mask, live_kcal: $.data.kcal_per_portion_micros, live_sodium: $.data.sodium_mcg_per_portion, live_depth: $.data.depth, live_count: $.data.component_count, live_batch: $.data.batch_cost_micros }
            - call: "GET /culinary/recipes/${parent_id}"
              as: RecipeDeveloper
              captures: { p_mask_after: $.data.allergen_mask, p_kcal_after: $.data.kcal_per_portion_micros, p_sodium_after: $.data.sodium_mcg_per_portion, p_v_after: $.data.version }
            - call: "POST /culinary/recipes/${parent_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
              captures: { e_stale: $.data.error_id }
          assert:
            - "${child_batch} == 1268499 == round_half_up(100*12000000/946), ${child_mask} == 8 and ${child_kcal} == 80000000 == round_half_up(800000000/10)"
            - "${sub_unit} == 1268499 (the child's batch cost) and ${sub_ext} == 634250 == round_half_up(500*1268499/1000) — the exact quotient 634249.5 rounds AWAY from zero, so a banker's-rounding implementation lands on 634249 here"
            - "${p_batch} == 4514321 == 3880071 + 634250, ${p_portion} == 1128580, ${p_mask} == 9 == 1|8 (PEANUT inherited through the sub-recipe, never referenced directly), ${p_kcal} == 500000000, ${p_sodium} == 620000, ${p_depth} == 1 and ${p_state} == FRESH"
            - "the child edit updates the CHILD only: ${child_mask2} == 12 == 8|4, ${child_kcal2} == 150000000, ${child_sodium2} == 400, ${child_state2} == STALE and ${child_batch2} == 1268499 still"
            - "${p_mask_stale} == 9, ${p_kcal_stale} == 500000000, ${p_sodium_stale} == 620000 and ${p_state_stale} == FRESH — the parent was never notified, which is the whole trap: a FRESH parent can be wrong about its allergens"
            - "the computed read disagrees: ${live_mask} == 13 == 1|12, ${live_kcal} == 587500000 == round_half_up((1600000000 + round_half_up(500*1500000000/1000))/4), ${live_sodium} == 620500 == round_half_up((2480000 + 2000)/4), ${live_depth} == 1 and ${live_count} == 2"
            - "${live_batch} == 4514321 — the computed read returns the Recipe shape but only recomputes the allergen and nutrition fields; it does not re-cost anything"
            - "${p_mask_after} == 9, ${p_kcal_after} == 500000000, ${p_sodium_after} == 620500 is WRONG and must read 620000, and ${p_v_after} == ${p_v_stale} — the read persisted nothing and did not bump the version"
            - "${e_stale} == ERR_COST_STALE (409) — the only endpoint that would fix the parent refuses to run while the child is STALE, so the computed read is the sole live view"

      - name: component_listing_filters_by_owner_child_ingredient_and_status_under_pagination
        claim_type: listing
        grounds:
          - endpoints[GET /culinary/recipe-components]
          - endpoints[DELETE /culinary/recipe-components/{recipe_component_id}]
        distinguishing_aspect: "Four orthogonal filters over one shared collection, plus the ordering and the pagination envelope. child_recipe_id answers the reverse question — which recipes consume this sub-recipe — which is not the same as recipe_id and is the filter an implementation is most likely to alias. The status filter is what makes a soft-removed row observable at all, and offset paging is checked against the sequence_no ASC ordering rather than against insertion order."
        test_recipe:
          setup:
            - "The PLATE-DEEP world: child SUB-OIL with PEANUT-OIL at sequence 1 and WHEAT-FLOUR at sequence 2, parent PLATE-DEEP with CHEDDAR at sequence 1 and the SUB-OIL sub-recipe component at sequence 2. Four RecipeComponent rows in total, all ACTIVE, both recipes DRAFT."
            - "The parent's CHEDDAR component is then soft-removed so exactly one row in the collection has status REMOVED."
          setup_api_calls:
            - call: "POST /culinary/ingredients"
              payload: { sku: "PEANUT-OIL", name: "Peanut Frying Oil", base_uom: "MILLILITER", pack_base_units: 946, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 8, kcal_per_base_unit_micros: 8000000, sodium_mcg_per_base_unit: 0 }
              as: RecipeDeveloper
              captures: { oil_id: $.data.id }
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
              as: RecipeDeveloper
              captures: { ched_id: $.data.id }
            - call: "POST /culinary/ingredients"
              payload: { sku: "WHEAT-FLOUR", name: "Bread Flour", base_uom: "GRAM", pack_base_units: 22680, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 4, kcal_per_base_unit_micros: 3500000, sodium_mcg_per_base_unit: 20 }
              as: RecipeDeveloper
              captures: { flour_id: $.data.id }
            - call: "POST /culinary/recipes"
              payload: { code: "SUB-OIL", name: "Fry Oil Base", recipe_type: "SUB_RECIPE", base_uom: "MILLILITER", batch_yield_base_units: 1000, portions_per_batch: 10 }
              as: RecipeDeveloper
              captures: { child_id: $.data.id, child_v0: $.data.version }
            - call: "POST /culinary/recipes/${child_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${oil_id}", ep_quantity_base_units: 100, sequence_no: 1, expected_recipe_version: "${child_v0}" }
              as: RecipeDeveloper
              captures: { c_oil: $.data.id }
            - call: "GET /culinary/recipes/${child_id}"
              as: RecipeDeveloper
              captures: { child_v1: $.data.version }
            - call: "POST /culinary/recipes/${child_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${flour_id}", ep_quantity_base_units: 200, sequence_no: 2, expected_recipe_version: "${child_v1}" }
              as: RecipeDeveloper
              captures: { c_flour: $.data.id }
            - call: "POST /culinary/recipes"
              payload: { code: "PLATE-DEEP", name: "Deep Fried Plate", recipe_type: "PLATED", base_uom: "EACH", batch_yield_base_units: 4, portions_per_batch: 4 }
              as: RecipeDeveloper
              captures: { parent_id: $.data.id, parent_v0: $.data.version }
            - call: "POST /culinary/recipes/${parent_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${ched_id}", ep_quantity_base_units: 400, sequence_no: 1, expected_recipe_version: "${parent_v0}" }
              as: RecipeDeveloper
              captures: { c_ched: $.data.id }
            - call: "GET /culinary/recipes/${parent_id}"
              as: RecipeDeveloper
              captures: { parent_v1: $.data.version }
            - call: "POST /culinary/recipes/${parent_id}/components"
              payload: { component_type: "SUB_RECIPE", child_recipe_id: "${child_id}", ep_quantity_base_units: 500, sequence_no: 2, expected_recipe_version: "${parent_v1}" }
              as: RecipeDeveloper
              captures: { c_sub: $.data.id }
          trigger:
            - call: "GET /culinary/recipe-components"
              payload: { recipe_id: "${child_id}", limit: 10, offset: 0 }
              as: CostAnalyst
              captures: { ch_first: "$.data[0].id", ch_second: "$.data[1].id", ch_total: $.pagination.total_count, ch_more: $.pagination.has_more }
            - call: "GET /culinary/recipe-components"
              payload: { recipe_id: "${child_id}", limit: 1, offset: 0 }
              as: CostAnalyst
              captures: { pg0: "$.data[0].id", pg0_seq: "$.data[0].sequence_no", pg0_total: $.pagination.total_count, pg0_more: $.pagination.has_more }
            - call: "GET /culinary/recipe-components"
              payload: { recipe_id: "${child_id}", limit: 1, offset: 1 }
              as: CostAnalyst
              captures: { pg1: "$.data[0].id", pg1_seq: "$.data[0].sequence_no", pg1_total: $.pagination.total_count, pg1_more: $.pagination.has_more }
            - call: "GET /culinary/recipe-components"
              payload: { child_recipe_id: "${child_id}", limit: 10, offset: 0 }
              as: CostAnalyst
              captures: { rev_id: "$.data[0].id", rev_owner: "$.data[0].recipe_id", rev_total: $.pagination.total_count }
            - call: "GET /culinary/recipe-components"
              payload: { ingredient_id: "${ched_id}", limit: 10, offset: 0 }
              as: CostAnalyst
              captures: { ing_id: "$.data[0].id", ing_total: $.pagination.total_count }
            - call: "DELETE /culinary/recipe-components/${c_ched}"
              payload: { expected_recipe_version: "${parent_v1}" }
              as: RecipeDeveloper
              captures: { del_status: $.data.status }
            - call: "GET /culinary/recipe-components"
              payload: { recipe_id: "${parent_id}", status: "ACTIVE", limit: 10, offset: 0 }
              as: CostAnalyst
              captures: { act_id: "$.data[0].id", act_total: $.pagination.total_count }
            - call: "GET /culinary/recipe-components"
              payload: { recipe_id: "${parent_id}", status: "REMOVED", limit: 10, offset: 0 }
              as: CostAnalyst
              captures: { rem_id: "$.data[0].id", rem_total: $.pagination.total_count }
            - call: "GET /culinary/recipe-components"
              payload: { recipe_id: "${parent_id}", child_recipe_id: "${child_id}", ingredient_id: "${ched_id}", limit: 10, offset: 0 }
              as: CostAnalyst
              captures: { conj_total: $.pagination.total_count }
          assert:
            - "${ch_total} == 2, ${ch_more} == false, ${ch_first} == ${c_oil} and ${ch_second} == ${c_flour} — ordered sequence_no ASC"
            - "${pg0} == ${c_oil} with ${pg0_seq} == 1, ${pg0_total} == 2 and ${pg0_more} == true; ${pg1} == ${c_flour} with ${pg1_seq} == 2, ${pg1_total} == 2 and ${pg1_more} == false — total_count counts the filtered set, not the page"
            - "${rev_total} == 1 with ${rev_id} == ${c_sub} and ${rev_owner} == ${parent_id}: child_recipe_id answers who CONSUMES SUB-OIL, so it returns the parent's component and never the child's own two rows"
            - "${ing_total} == 1 with ${ing_id} == ${c_ched} — ingredient_id skips the SUB_RECIPE component, whose ingredient_id is null"
            - "${del_status} == REMOVED"
            - "${act_total} == 1 with ${act_id} == ${c_sub}, and ${rem_total} == 1 with ${rem_id} == ${c_ched} — the soft-removed row is still in the collection and only the status filter separates them"
            - "${conj_total} == 0 — the three filters AND together, and no single row is simultaneously an ingredient component and a sub-recipe component"

      - name: propagation_is_a_conditional_action_on_the_approval_dimension_and_each_target_drains_once
        claim_type: conditional_action
        grounds:
          - endpoints[POST /culinary/spec-change-orders/{spec_change_order_id}/propagate]
          - validations[priority 22] ERR_SCO_INVALID_STATE
          - validations[priority 29] ERR_PROPAGATION_ALREADY_SYNCED
        distinguishing_aspect: "The action is legal only from APPROVED, and it is refused from BOTH earlier approval states — DRAFT and PENDING — with the same error, so an implementation that only checks 'not DRAFT' passes half the test. Each target then drains exactly once and the two drains compose into FULLY_PROPAGATED in either order, while approval_status never moves. The COUNT_SHEETS drain is also exercised with zero count lines in the entire system: draining an empty target is a legal no-op that still advances the dimension."
        test_recipe:
          setup:
            - "GRILL WORLD in MW: CHEDDAR-BLOCK PUBLISHED at 22000000 micros / 2268, PLATE-GRILL ACTIVE with CHEDDAR ep 400 over 4 portions, prep guide revision 1 CURRENT. No MenuPeriodReview and therefore no CountSheetLine exists anywhere."
            - "A DRAFT COMPONENT_QTY order raising the CHEDDAR component to ep 500."
          setup_api_calls:
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
              as: RecipeDeveloper
              captures: { ched_id: $.data.id }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed1_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed1_id}/lines"
              payload: { ingredient_id: "${ched_id}", pack_cost_micros: 22000000, effective_from: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed1_id}/publish"
              as: CostAnalyst
            - call: "POST /culinary/recipes"
              payload: { code: "PLATE-GRILL", name: "Grilled Cheese Plate", recipe_type: "PLATED", base_uom: "EACH", batch_yield_base_units: 4, portions_per_batch: 4 }
              as: RecipeDeveloper
              captures: { grill_id: $.data.id, grill_v0: $.data.version }
            - call: "POST /culinary/recipes/${grill_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${ched_id}", ep_quantity_base_units: 400, sequence_no: 1, expected_recipe_version: "${grill_v0}" }
              as: RecipeDeveloper
              captures: { comp_id: $.data.id }
            - call: "POST /culinary/recipes/${grill_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
            - call: "POST /culinary/recipes/${grill_id}/submit-review"
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${grill_id}/activate"
              as: CulinaryDirector
              captures: { grill_v_active: $.data.version }
            - call: "GET /culinary/recipes/${grill_id}/prep-guides"
              payload: { limit: 10, offset: 0 }
              as: RecipeDeveloper
              captures: { pg_rev0: "$.data[0].revision_no", pg_sync0: "$.data[0].sync_state", pg_count0: "$.data[0].component_count_snapshot", pg_ver0: "$.data[0].synced_spec_version" }
            - call: "POST /culinary/spec-change-orders"
              payload: { recipe_id: "${grill_id}", change_type: "COMPONENT_QTY", target_component_id: "${comp_id}", new_ep_quantity_base_units: 500, expected_recipe_version: "${grill_v_active}" }
              as: RecipeDeveloper
              captures: { sco_id: $.data.id, sco_appr0: $.data.approval_status, sco_prop0: $.data.propagation_status }
          trigger:
            - call: "POST /culinary/spec-change-orders/${sco_id}/propagate"
              payload: { target: "PREP_GUIDE" }
              as: CostAnalyst
              captures: { e_draft: $.data.error_id }
            - call: "POST /culinary/spec-change-orders/${sco_id}/submit"
              as: RecipeDeveloper
              as_user_id: "user-dev-1"
              captures: { sco_appr1: $.data.approval_status }
            - call: "POST /culinary/spec-change-orders/${sco_id}/propagate"
              payload: { target: "PREP_GUIDE" }
              as: CostAnalyst
              captures: { e_pending: $.data.error_id }
            - call: "POST /culinary/spec-change-orders/${sco_id}/approve"
              as: CulinaryDirector
              as_user_id: "user-dir-1"
              captures: { sco_appr2: $.data.approval_status, sco_prop2: $.data.propagation_status }
            - call: "GET /culinary/recipes/${grill_id}/prep-guides"
              payload: { limit: 10, offset: 0 }
              as: RecipeDeveloper
              captures: { pg_rev1: "$.data[0].revision_no", pg_sync1: "$.data[0].sync_state" }
            - call: "POST /culinary/spec-change-orders/${sco_id}/propagate"
              payload: { target: "PREP_GUIDE" }
              as: CostAnalyst
              captures: { prop3: $.data.propagation_status, appr3: $.data.approval_status }
            - call: "GET /culinary/recipes/${grill_id}/prep-guides"
              payload: { limit: 10, offset: 0 }
              as: RecipeDeveloper
              captures: { pg_rev2: "$.data[0].revision_no", pg_sync2: "$.data[0].sync_state", pg_count2: "$.data[0].component_count_snapshot", pg_ver2: "$.data[0].synced_spec_version" }
            - call: "POST /culinary/spec-change-orders/${sco_id}/propagate"
              payload: { target: "PREP_GUIDE" }
              as: CostAnalyst
              captures: { e_again: $.data.error_id }
            - call: "POST /culinary/spec-change-orders/${sco_id}/propagate"
              payload: { target: "COUNT_SHEETS" }
              as: CostAnalyst
              captures: { prop4: $.data.propagation_status, appr4: $.data.approval_status }
            - call: "POST /culinary/spec-change-orders/${sco_id}/propagate"
              payload: { target: "COUNT_SHEETS" }
              as: CostAnalyst
              captures: { e_counts_again: $.data.error_id }
          assert:
            - "${pg_rev0} == 1, ${pg_sync0} == CURRENT, ${pg_count0} == 1 and ${pg_ver0} == ${grill_v_active} — activation minted revision 1"
            - "${sco_appr0} == DRAFT and ${sco_prop0} == NOT_STARTED"
            - "${e_draft} == ERR_SCO_INVALID_STATE (409) — propagate from DRAFT"
            - "${sco_appr1} == PENDING and ${e_pending} == ERR_SCO_INVALID_STATE (409) — the SAME error from the state one step later, which is the arm a 'not DRAFT' check misses"
            - "${sco_appr2} == APPROVED with ${sco_prop2} == NOT_STARTED, and ${pg_rev1} == 1 with ${pg_sync1} == OUT_OF_DATE — approval flags the guide without re-issuing it"
            - "the first drain returns ${prop3} == PREP_GUIDE_SYNCED with ${appr3} == APPROVED unchanged; ${pg_rev2} == 2, ${pg_sync2} == CURRENT, ${pg_count2} == 1 (a quantity change does not change the component count) and ${pg_ver2} == the recipe version the approval left behind"
            - "${e_again} == ERR_PROPAGATION_ALREADY_SYNCED (409) — each target drains exactly once"
            - "${prop4} == FULLY_PROPAGATED with ${appr4} == APPROVED: the COUNT_SHEETS drain advances the dimension even though there is not a single CountSheetLine in the system to recompute"
            - "${e_counts_again} == ERR_PROPAGATION_ALREADY_SYNCED (409) — and it is priority 29, not the priority 22 state error, because the order is still APPROVED"

      - name: loading_a_mix_line_snapshots_the_plate_cost_and_never_tracks_it
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /culinary/menu-period-reviews/{id}/mix-lines]
          - validations[priority 9] ERR_MENU_ITEM_NOT_FOUND
          - validations[priority 12] ERR_PERIOD_REVIEW_NOT_FOUND
        distinguishing_aspect: "A link row that carries a value copy. Both endpoints of the association must exist — a bogus item and a bogus review return different 404s — and once the line is written its plate_cost_cents_snapshot is frozen: re-pricing the ingredient, re-rolling the recipe and re-costing the plate all the way from 103 to 151 cents leaves the already-loaded line at 103. An implementation that joins to MenuItem.plate_cost_cents at read time reports 151 and quietly re-writes history for every closed period."
        test_recipe:
          setup:
