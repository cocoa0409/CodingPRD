              as: ProcessEngineer
              captures: { lot_a: $.data.id }
            - call: "GET /rod-purchase-lots/${rod_id}"
              payload: {}
              as: ProcurementBuyer
              captures: { rod_v2: $.data.version }
            - call: "POST /production-lots"
              payload: { product_id: "${prod_id}", rod_lot_id: "${rod_id}", order_id: "${ord_id}", lot_code: "LOT-B", planned_length_ft: 2000, line_code: "EXT-2", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T10:00:00Z", expected_rod_lot_version: "${rod_v2}" }
              as: ProcessEngineer
              captures: { lot_b: $.data.id }
            - call: "POST /production-lots/${lot_a}/process-steps"
