      - name: clock_default_makes_waiver_expiry_deterministic
        claim_type: scheduled_actions
        grounds: [endpoints, entities.Waiver.fields.expires_at, entities.Waiver.fields.status]
        distinguishing_aspect: "A waiver signed at clock 2026-10-01T00:00:00Z expires at 2026-10-31T00:00:00Z (WAIVER_VALID_DAYS=30); at clock 2026-10-31T00:00:00Z (>= expires_at) its listed status reads EXPIRED."
        test_recipe:
          setup: ["Clock at 2026-10-01T00:00:00Z; a SIGNED waiver; then clock advanced to 2026-10-31T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: OpsManager
            - call: "POST /guests"
              payload: { full_name: "G", age: 30, email: "g@x.com" }
              as: BoxOffice
              captures: { g_id: $.data.id }
            - call: "POST /guests/${g_id}/waivers"
              payload: { max_scare_level: 5 }
              as: BoxOffice
              captures: { w_id: $.data.id, w_exp: $.data.expires_at }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-31T00:00:00Z" }
              as: OpsManager
          trigger:
            - call: "GET /waivers"
              payload: { guest_id: "${g_id}" }
              as: BoxOffice
              captures: { w_status: $.data.0.status }
          assert:
            - "Waiver.${w_id}.expires_at == 2026-10-31T00:00:00Z"
            - "the listed waiver status == EXPIRED at clock 2026-10-31T00:00:00Z"

      - name: occ_attraction_stale_version_on_closure
        claim_type: optimistic_concurrency
        grounds: [endpoints, 'errors[ERR_STALE_ATTRACTION_VERSION]', entities.Attraction.fields.version]
        distinguishing_aspect: "Opening a closure with a stale expected_attraction_version (the version before a prior closure bumped it) is rejected ERR_STALE_ATTRACTION_VERSION (412)."
        test_recipe:
          setup: ["Attraction at version v0; one SAFETY closure already opened (version -> v1); a second closure attempt still carries v0."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Fright Park", timezone: "UTC" }
              as: OpsManager
              captures: { ven_id: $.data.id }
            - call: "POST /attractions"
              payload: { venue_id: "${ven_id}", name: "Crypt", min_age: 0, scare_level: 1, throughput_per_slot: 10, requires_waiver: false }
              as: OpsManager
              captures: { att_id: $.data.id, att_v0: $.data.version }
            - call: "POST /attractions/${att_id}/closures"
              payload: { reason: "SAFETY", expected_attraction_version: "${att_v0}" }
              as: OpsManager
          trigger:
            - call: "POST /attractions/${att_id}/closures"
