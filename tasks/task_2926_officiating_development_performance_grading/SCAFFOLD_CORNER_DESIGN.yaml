            - call: "GET /officials"
              payload: { season_program_id: "${sp_id}" }
              as: CommunicationsOfficer
              captures: { shr_comms_first: "$.data[0].id" }
          assert:
            - "all eight reads return HTTP 200 with exactly one row"
            - "${shr_director_first} == ${shr_scheduler_first} == ${shr_supervisor_first} == ${shr_official_first} == ${dan_id}"
            - "${shr_evaluator_first} == ${shr_replay_first} == ${shr_coordinator_first} == ${shr_comms_first} == ${dan_id}"
            - "no role sees a redacted or filtered projection — the shared read is identical for all eight"

      - name: the_grader_may_not_review_or_decide_the_appeal
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=6]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - entities.PlayGrade.fields.graded_by_user_id
          - state_machines.GradeAppeal.SUBMITTED_to_UNDER_REVIEW
        distinguishing_aspect: "The rule is per user, not per role: sup-grader-1, who authored the grade, is blocked from both start-review and decide, while sup-review-2 in the same GradingSupervisor role may perform both."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 1 and appeal_credits_per_official 3."
            - "Game G1 is PLAYED; the grade Q3-P22 was authored and posted by sup-grader-1 and Dan has appealed it."
          setup_api_calls:
            - *k_clock
