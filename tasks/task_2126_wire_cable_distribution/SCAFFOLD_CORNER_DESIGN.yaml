            - "DeliveryRun.${run_id}.heaviest_reel_lbs == 320.0"
            - "DeliveryRun.${run_id}.status == SCHEDULED"
            - "DeliveryRun.${run_id}.branch_id == ${br_id}"

      - name: metal_variance_between_quoted_and_invoiced_variants
        claim_type: Variant Divergence
        grounds:
          - calculations.quote_line_pricing
        excluded_because:
          difficulty_instance: metal_pass_through_quoted_vs_invoiced_on_order_lines
          rationale: "The QUOTED-versus-INVOICED divergence and the resulting metal_variance_cents are the core assertions of that §1.8 instance."

      - name: allocation_policy_variant_selection
        claim_type: Variant Selection
        grounds:
          - calculations.reel_allocation_plan
        excluded_because:
          difficulty_instance: allocation_policy_minimize_remnant_vs_fewest_reels_on_reel_pool
          rationale: "Policy selection and its divergent Allocation.reel_id outcome are asserted end-to-end by that §1.8 instance."

  # ==========================================================================
  - section: validations
    instances:

      - name: put_up_not_in_product_catalog_is_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=13]
          - errors[ERR_PUT_UP_NOT_ALLOWED]
          - entities.CableProduct.fields.allowed_put_ups
        distinguishing_aspect: "A product whose allowed_put_ups is exactly [CUT] rejects a MASTER_REEL line with ERR_PUT_UP_NOT_ALLOWED (422), after the enum itself has been accepted as a valid member."
        test_recipe:
          setup:
            - "One branch, one customer, index CI1 and a cut-only product whose allowed_put_ups is [CUT]."
            - "A DRAFT quote for that customer at that branch."
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "Houston DC", region_code: "TX", concurrent_cut_capacity: 1, delivery_surcharge_cents: 0 }
              as: PlatformAdmin
              captures: { br_id: "$.data.id" }
            - call: "POST /customers"
              payload: { name: "Gulf Electric", credit_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { part_number: "CU-CUTONLY", conductor_metal: "COPPER", copper_lbs_per_1000ft: 12.5, base_price_cents_per_ft: 18, min_cut_length_ft: 100, cut_charge_cents: 3500, reel_deposit_cents: 12500, master_reel_length_ft: 2500, reel_weight_lbs: 320.0, allowed_put_ups: ["CUT"] }
              as: PlatformAdmin
              captures: { pc_id: "$.data.id" }
            - call: "POST /copper-index-entries"
              payload: { effective_date: "2026-07-30", price_cents_per_lb: 450 }
              as: PlatformAdmin
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}", branch_id: "${br_id}" }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { q_id: "$.data.id", q_v1: "$.data.version" }
          trigger:
            - call: "POST /quotes/${q_id}/lines"
              payload: { product_id: "${pc_id}", put_up: "MASTER_REEL", requested_length_ft: 2500, parallel_set_size: 1, expected_quote_version: "${q_v1}" }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status == 422"
            - "${err_id} == ERR_PUT_UP_NOT_ALLOWED"
            - "GET /quote-lines?quote_id=${q_id} returns 0 rows"

      - name: parallel_set_cannot_be_filled_across_two_lots
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=14]
          - errors[ERR_PARALLEL_SET_INCOMPLETE]
          - calculations.reel_allocation_plan
          - entities.Reel.fields.lot_code
        distinguishing_aspect: "Total branch availability is 1000 ft against a 600 ft demand, yet no single lot_code offers 3 distinct reels of at least 200 ft, so the paralleled set fails with ERR_PARALLEL_SET_INCOMPLETE (409) and no partial allocation is written."
        test_recipe:
          setup:
            - "One branch, one customer, product P1, index CI1, and exactly two 500 ft P1 reels in different lots, LA and LB."
            - "A single CUT line of 200 ft with parallel_set_size 3 is issued and converted, so required_length_ft is 600."
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "Houston DC", region_code: "TX", concurrent_cut_capacity: 1, delivery_surcharge_cents: 0 }
              as: PlatformAdmin
              captures: { br_id: "$.data.id" }
            - call: "POST /customers"
              payload: { name: "Gulf Electric", credit_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { part_number: "CU-500-XHHW", conductor_metal: "COPPER", copper_lbs_per_1000ft: 12.5, base_price_cents_per_ft: 18, min_cut_length_ft: 100, cut_charge_cents: 3500, reel_deposit_cents: 12500, master_reel_length_ft: 2500, reel_weight_lbs: 320.0, allowed_put_ups: ["MASTER_REEL", "CUT"] }
              as: PlatformAdmin
              captures: { p1_id: "$.data.id" }
            - call: "POST /copper-index-entries"
              payload: { effective_date: "2026-07-30", price_cents_per_lb: 450 }
              as: PlatformAdmin
            - call: "POST /reels"
              payload: { product_id: "${p1_id}", branch_id: "${br_id}", lot_code: "LA", nominal_length_ft: 500 }
              as: PlatformAdmin
              captures: { ra_id: "$.data.id" }
            - call: "POST /reels"
              payload: { product_id: "${p1_id}", branch_id: "${br_id}", lot_code: "LB", nominal_length_ft: 500 }
              as: PlatformAdmin
              captures: { rb_id: "$.data.id" }
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}", branch_id: "${br_id}" }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { q_id: "$.data.id", q_v1: "$.data.version" }
            - call: "POST /quotes/${q_id}/lines"
              payload: { product_id: "${p1_id}", put_up: "CUT", requested_length_ft: 200, parallel_set_size: 3, expected_quote_version: "${q_v1}" }
              as: SalesRep
              as_user_id: "rep-1"
            - call: "POST /quotes/${q_id}/issue"
              as: SalesRep
              as_user_id: "rep-2"
            - call: "POST /quotes/${q_id}/convert"
              as: SalesRep
              as_user_id: "rep-2"
              captures: { so_id: "$.data.id", so_v1: "$.data.version" }
          trigger:
            - call: "POST /sales-orders/${so_id}/allocate"
              payload: { allocation_policy: "MINIMIZE_REMNANT", expected_sales_order_version: "${so_v1}" }
