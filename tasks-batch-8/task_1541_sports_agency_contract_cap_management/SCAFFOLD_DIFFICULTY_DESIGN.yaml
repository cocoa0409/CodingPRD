              payload: { team_id: "${team_id}", cap_season_id: "${cs_id}", start_season_year: 2026, years: 1, base_salary_cents: 100000000, guaranteed_cents: 100000000, signing_bonus_cents: 0, incentive_cents: 0, escalator_pct: 0 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { con1_id: $.data.id }
            - call: "POST /agencies/${agency_id}/clients/${c1_id}/contracts/${con1_id}/proposals"
              payload: { proposed_by_agent_id: "${a_id}", proposed_aav_cents: 100000000, proposed_guaranteed_cents: 100000000 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { p1_id: $.data.id }
            - call: "GET /teams/${team_id}/cap_seasons/${cs_id}"
              as: LeagueOfficer
              captures: { cs_v1: $.data.version }
            - call: "POST /agencies/${agency_id}/clients/${c1_id}/contracts/${con1_id}/proposals/${p1_id}/submit"
              payload: { expected_cap_season_version: "${cs_v1}" }
              as: Agent
              as_user_id: "${a_id}"
            - call: "POST /agencies/${agency_id}/clients/${c1_id}/contracts/${con1_id}/proposals/${p1_id}/accept"
