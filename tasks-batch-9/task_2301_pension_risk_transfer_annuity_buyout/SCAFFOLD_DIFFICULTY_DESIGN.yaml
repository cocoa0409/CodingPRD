  - rule: resource_temporal_overlap
    instances:
      - name: window_quiet_period_admits_exactly_the_ninetieth_day
        grounds:
          - validations.priority_60
          - errors.ERR_WINDOW_QUIET_PERIOD_CONFLICT
          - state_machines.LumpSumWindow
          - endpoints.POST_/prt/plans/{id}/lump-sum-windows
        distinguishing_aspect: |
          Two different temporal predicates guard a new window and they disagree
          about adjacency. The window interval itself is HALF-OPEN, so a window
          opening exactly at an existing window's closes_at does not overlap it;
          the quiet period is a separate 90-day buffer measured forward from that
          same closes_at, and it rejects precisely the intervals the overlap test
          would have allowed. The instance walks four candidates against a window
          closing 2026-10-31: contained (overlap), abutting at 2026-10-31
          (overlap-free but inside the buffer), 2027-01-28 (one day short, 89 days),
          and 2027-01-29 (exactly 90 days, admitted). It also shows priority 24
          pre-empting the buffer check for a degenerate opens_at == closes_at
          interval, and shows that VOIDED windows leave the buffer entirely: after
          the amendment is rescinded, the previously rejected contained interval is
          accepted unchanged.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "a PensionPlan authorized with amendment_scope LUMP_SUM_ONLY over an APPROVED LUMP_SUM_WINDOW strategy"
            - "one existing PLANNED window W1 over [2026-08-15T00:00:00Z, 2026-10-31T00:00:00Z)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
            - call: "POST /prt/plans"
              payload: { sponsor_name: "Larkspur Ceramics", plan_name: "Larkspur Union Plan", plan_ein: "270991456", total_liability_cents: 60000000, plan_assets_cents: 55000000, service_cost_cents: 1800000, interest_cost_cents: 5200000, unrecognized_actuarial_loss_cents: 2400000, discount_rate_bps: 470 }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
              captures: { plan_id: $.data.id }
            - call: "POST /prt/plans/${plan_id}/strategies"
              payload: { strategy_name: "Larkspur Window Program", strategy_type: "LUMP_SUM_WINDOW" }
              as: Actuary
              as_user_id: "actuary-01"
              captures: { strategy_id: $.data.id }
            - call: "POST /prt/strategies/${strategy_id}/submission"
              payload: {}
              as: Actuary
              as_user_id: "actuary-01"
            - call: "POST /prt/strategies/${strategy_id}/decision"
              payload: { decision: "APPROVE", decision_rationale: "Window program approved." }
              as: PlanFiduciary
              as_user_id: "fiduciary-01"
            - call: "POST /prt/plans/${plan_id}/settlement-amendment"
              payload: { amendment_action: "ADOPT", amendment_scope: "LUMP_SUM_ONLY", amendment_effective_date: "2026-08-10T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
            - call: "POST /prt/plans/${plan_id}/lump-sum-windows"
              payload: { window_name: "Larkspur Autumn Window", opens_at: "2026-08-15T00:00:00Z", closes_at: "2026-10-31T00:00:00Z", lump_sum_cap_cents: 30000000, eligibility_max_lump_sum_cents: 15000000 }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { w1_id: $.data.id, w1_status: $.data.window_status }
          trigger:
            - call: "POST /prt/plans/${plan_id}/lump-sum-windows"
              payload: { window_name: "Contained Candidate", opens_at: "2026-09-15T00:00:00Z", closes_at: "2026-09-30T00:00:00Z", lump_sum_cap_cents: 10000000, eligibility_max_lump_sum_cents: 15000000 }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
            - call: "POST /prt/plans/${plan_id}/lump-sum-windows"
              payload: { window_name: "Abutting Candidate", opens_at: "2026-10-31T00:00:00Z", closes_at: "2026-11-30T00:00:00Z", lump_sum_cap_cents: 10000000, eligibility_max_lump_sum_cents: 15000000 }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
            - call: "POST /prt/plans/${plan_id}/lump-sum-windows"
              payload: { window_name: "Degenerate Candidate", opens_at: "2026-09-15T00:00:00Z", closes_at: "2026-09-15T00:00:00Z", lump_sum_cap_cents: 10000000, eligibility_max_lump_sum_cents: 15000000 }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
            - call: "POST /prt/plans/${plan_id}/lump-sum-windows"
              payload: { window_name: "Eighty Nine Day Candidate", opens_at: "2027-01-28T00:00:00Z", closes_at: "2027-03-01T00:00:00Z", lump_sum_cap_cents: 10000000, eligibility_max_lump_sum_cents: 15000000 }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
            - call: "POST /prt/plans/${plan_id}/lump-sum-windows"
              payload: { window_name: "Ninetieth Day Candidate", opens_at: "2027-01-29T00:00:00Z", closes_at: "2027-03-01T00:00:00Z", lump_sum_cap_cents: 10000000, eligibility_max_lump_sum_cents: 15000000 }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { w2_id: $.data.id, w2_status: $.data.window_status }
            - call: "POST /prt/plans/${plan_id}/settlement-amendment"
              payload: { amendment_action: "RESCIND" }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
              captures: { plan_status_after_rescind: $.data.plan_status }
            - call: "GET /prt/plans/${plan_id}/lump-sum-windows"
              payload: { window_status: "VOIDED" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { voided_first_status: "$.data[0].window_status" }
            - call: "POST /prt/plans/${plan_id}/lump-sum-windows"
              payload: { window_name: "Contained Candidate Retry", opens_at: "2026-09-15T00:00:00Z", closes_at: "2026-09-30T00:00:00Z", lump_sum_cap_cents: 10000000, eligibility_max_lump_sum_cents: 15000000 }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { w3_id: $.data.id, w3_status: $.data.window_status }
          assert:
            - "the contained candidate [2026-09-15, 2026-09-30) returns 409 ERR_WINDOW_QUIET_PERIOD_CONFLICT because it overlaps W1's half-open interval"
            - "the abutting candidate [2026-10-31, 2026-11-30) returns 409 ERR_WINDOW_QUIET_PERIOD_CONFLICT even though it does NOT overlap W1 under half-open semantics — it opens 0 days into the 90-day buffer that runs from W1.closes_at 2026-10-31"
            - "the degenerate candidate with opens_at == closes_at == 2026-09-15 returns 422 ERR_INVALID_INTERVAL, not 409 — priority 24 well-formedness pre-empts the priority 60 buffer check even though the interval also sits inside W1"
            - "the candidate opening 2027-01-28 returns 409 ERR_WINDOW_QUIET_PERIOD_CONFLICT: 2026-10-31 plus 89 days is 2027-01-28, one day short of the buffer"
            - "the candidate opening 2027-01-29 returns 201 with window_status == PLANNED: 2026-10-31 plus exactly QUIET_PERIOD_DAYS (90) days is 2027-01-29, and the buffer is half-open so the ninetieth day is admitted"
