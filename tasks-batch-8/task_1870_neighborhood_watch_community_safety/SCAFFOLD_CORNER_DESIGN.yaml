        distinguishing_aspect: "POST /watch/members against a FROZEN group fails ERR_POSTURE_GATED even though every other field is valid."
        test_recipe:
          setup:
            - "Group with 1 REGISTERED block; certification SUSPENDED via POST /watch/watch-groups/{id}/certification-suspend; posture then driven to FROZEN via the freeze action."
          setup_api_calls:
            - call: "POST /watch/watch-groups"
              payload: { name: "Gate2 Watch", precinct_code: "V01" }
              as: ProgramCoordinator
              captures: { wg: $.data.id }
