  instances:
  - name: duplicate_hardship_package_on_case_rejected
    claim_type: violation_to_error
    grounds:
    - validations[priority=44]
    - errors[ERR_DUPLICATE_RESOURCE]
    distinguishing_aspect: A case may carry at most one HardshipPackage; the second creation is refused with ERR_DUPLICATE_RESOURCE (409) and the reverse lookup still returns exactly one row.
    test_recipe:
      setup:
      - One GSE case that already carries one DRAFT HardshipPackage.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-05T00:00:00Z'
        as: PlatformAdmin
