# =============================================================================
# §1.9 Scaffold Corner Design - task_2994 VoIP Number Porting & E911 Address
# Registration. Breadth probe over §1.1-§1.7 of SCAFFOLD.yaml, walking
# references/claim-extraction-guide.md row by row. Corners already asserted by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_account_returns_201_with_every_declared_field
        claim_type: creation
        grounds:
          - entities.Account
          - endpoints[POST /voip/accounts]
          - response_envelope.success
        distinguishing_aspect: "POST /voip/accounts with all required fields returns 201, response_type 'object', and data carrying every declared Account field including the computed e911_compliance_posture, fee_liability_cents and ported_number_count."
        test_recipe:
          setup:
            - "empty database; clock at the default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT1001", billing_name: "AURORA LLC", service_state_code: "CA", status: "ACTIVE", intl_calling_enabled: true, intl_daily_cap_cents: 5000 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
          assert:
            - "the response status is 201 and meta contains api_request_id and api_request_timestamp"
            - "response_type == 'object'"
            - "Account.${acct_id}.account_number == 'ACCT1001', billing_name == 'AURORA LLC', service_state_code == 'CA'"
            - "Account.${acct_id}.status == ACTIVE, intl_calling_enabled == true, intl_daily_cap_cents == 5000"
            - "Account.${acct_id}.e911_compliance_posture == COMPLIANT, fee_liability_cents == 0, ported_number_count == 0"
            - "Account.${acct_id}.version == 1 and created_at == 2026-08-01T00:00:00Z"

      - name: get_jurisdiction_by_id_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - entities.Jurisdiction
          - endpoints[GET /voip/jurisdictions/{id}]
        distinguishing_aspect: "GET /voip/jurisdictions/{id} returns exactly the values stored at creation, with the ledger counters still at their 0 defaults and last_remitted_period null."
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; one PER_LOCATION jurisdiction at 250 cents"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/jurisdictions"
              payload: { state_code: "TX", county_fips: "48453", fee_type: "PER_LOCATION", monthly_fee_cents: 250, remit_day_of_month: 12 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
          trigger:
            - call: "GET /voip/jurisdictions/${jur_id}"
              payload: {}
              as: BillingAdmin
          assert:
            - "the response status is 200 and response_type == 'object'"
            - "Jurisdiction.${jur_id}.state_code == 'TX', county_fips == '48453', fee_type == PER_LOCATION"
            - "Jurisdiction.${jur_id}.monthly_fee_cents == 250 and remit_day_of_month == 12"
            - "Jurisdiction.${jur_id}.pending_fee_cents == 0, remitted_fee_cents == 0, last_remitted_period == null"

      - name: list_number_blocks_returns_pagination_envelope_fields
        claim_type: listing
        grounds:
          - endpoints[GET /voip/number-blocks]
          - complexity_profile.pagination_defaults
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /voip/number-blocks?limit=2&offset=0 over three blocks returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; one jurisdiction; three number blocks 415601, 415602, 415603"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/jurisdictions"
              payload: { state_code: "CA", county_fips: "06001", fee_type: "PER_LINE", monthly_fee_cents: 175, remit_day_of_month: 5 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /voip/number-blocks"
              payload: { jurisdiction_id: "${jur_id}", npa_nxx: "415601", total_capacity: 10, max_concurrent_reservations: 2 }
              as: NumberingAdmin
            - call: "POST /voip/number-blocks"
              payload: { jurisdiction_id: "${jur_id}", npa_nxx: "415602", total_capacity: 10, max_concurrent_reservations: 2 }
              as: NumberingAdmin
            - call: "POST /voip/number-blocks"
              payload: { jurisdiction_id: "${jur_id}", npa_nxx: "415603", total_capacity: 10, max_concurrent_reservations: 2 }
              as: NumberingAdmin
          trigger:
            - call: "GET /voip/number-blocks?jurisdiction_id=${jur_id}&limit=2&offset=0"
              payload: { jurisdiction_id: "${jur_id}", limit: 2, offset: 0 }
              as: NumberingAdmin
            - call: "GET /voip/number-blocks?jurisdiction_id=${jur_id}&limit=2&offset=2"
              payload: { jurisdiction_id: "${jur_id}", limit: 2, offset: 2 }
              as: NumberingAdmin
          assert:
            - "the first trigger returns response_type == 'array' with exactly 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "the second trigger returns exactly 1 row, total_count == 3, has_more == false, offset == 2"
            - "the union of npa_nxx over both pages is exactly {415601, 415602, 415603} with no row repeated"

      - name: get_phone_number_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=9]
          - errors[ERR_RESOURCE_NOT_FOUND]
          - endpoints[GET /voip/phone-numbers/{id}]
        distinguishing_aspect: "A GET against a PhoneNumber id that was never minted returns 404 ERR_RESOURCE_NOT_FOUND - the catch-all existence rule at priority 9, not ERR_ACCOUNT_NOT_FOUND or ERR_DEVICE_NOT_FOUND."
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; no PhoneNumber rows exist at all"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /voip/phone-numbers/pn-does-not-exist-0001"
              payload: {}
              as: NumberingAdmin
          assert:
            - "the trigger returns HTTP 404 with error_id ERR_RESOURCE_NOT_FOUND"
            - "response_type == 'error' and data.message is a non-empty string"

      - name: create_carrier_missing_required_ocn_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Carrier.fields.ocn
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the required ocn from POST /voip/carriers returns 400 ERR_INVALID_REQUEST and persists no Carrier row."
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; no carriers exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /voip/carriers"
              payload: { name: "Ochre Legacy", csr_match_policy: "STRICT", porting_buffer_minutes: 30, foc_business_days: 2 }
              as: PlatformAdmin
          assert:
            - "the trigger returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "no Carrier row is created: a subsequent POST /voip/carriers with ocn 'OC01' and the same name succeeds with 201"

      - name: create_account_omitting_optionals_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Account.fields.status
          - entities.Account.fields.intl_calling_enabled
          - entities.Account.fields.intl_daily_cap_cents
        distinguishing_aspect: "Omitting status, intl_calling_enabled and intl_daily_cap_cents yields exactly ACTIVE, false and 2000 - the §1.1 defaults - not null and not 0."
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT1002", billing_name: "BIRCH INC", service_state_code: "NV" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
          assert:
            - "Account.${acct_id}.status == ACTIVE"
            - "Account.${acct_id}.intl_calling_enabled == false"
            - "Account.${acct_id}.intl_daily_cap_cents == 2000"
            - "Account.${acct_id}.e911_compliance_posture == COMPLIANT and fee_liability_cents == 0"

      - name: phone_number_e164_is_computed_from_block_npa_nxx_and_line
        claim_type: computed_fields
        grounds:
          - entities.PhoneNumber.fields.e164
          - entities.PhoneNumber.fields.status
          - endpoints[POST /voip/number-blocks/{id}/phone-numbers]
        distinguishing_aspect: "Minting line_number 1501 inside block 415569 computes e164 exactly '+14155691501' and status AVAILABLE; the client never supplies either value."
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; one jurisdiction; one block with npa_nxx 415569"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/jurisdictions"
              payload: { state_code: "CA", county_fips: "06001", fee_type: "PER_LINE", monthly_fee_cents: 175, remit_day_of_month: 5 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /voip/number-blocks"
              payload: { jurisdiction_id: "${jur_id}", npa_nxx: "415569", total_capacity: 10, max_concurrent_reservations: 2 }
              as: NumberingAdmin
              captures: { blk_id: $.data.id }
          trigger:
            - call: "POST /voip/number-blocks/${blk_id}/phone-numbers"
              payload: { line_number: "1501" }
              as: NumberingAdmin
              captures: { pn_id: $.data.id }
          assert:
            - "PhoneNumber.${pn_id}.e164 == '+14155691501'"
            - "PhoneNumber.${pn_id}.status == AVAILABLE, assigned_account_id == null, parked_until == null, park_cycle_count == 0"
            - "NumberBlock.${blk_id}.minted_count == 1 and available_count == 1"

      - name: account_system_fields_are_server_generated_and_client_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Account
          - response_envelope.success
        distinguishing_aspect: "Sending id, created_at, updated_at and version in the POST body is ignored: the created Account carries a server-minted id different from the supplied string, created_at equal to the logical clock and version 1."
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT1003", billing_name: "CEDAR AG", service_state_code: "CA", id: "client-supplied-id", created_at: "1999-01-01T00:00:00Z", updated_at: "1999-01-01T00:00:00Z", version: 99 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
          assert:
            - "the response status is 201 and Account.${acct_id}.id != 'client-supplied-id'"
            - "Account.${acct_id}.created_at == 2026-08-01T00:00:00Z and updated_at == 2026-08-01T00:00:00Z"
            - "Account.${acct_id}.version == 1"

      - name: create_device_with_invalid_device_type_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Device.fields.device_type
          - entities.Device.fields.mac_address
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "device_type 'ROUTER' is not a member of {BASE_STATION, HANDSET, SOFTPHONE} and a 10-character mac_address is not 12 characters, so both bodies return 400 ERR_INVALID_REQUEST before any Device row exists."
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; one ACTIVE account"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT1004", billing_name: "DOGWOOD SA", service_state_code: "CA", status: "ACTIVE" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /voip/devices"
              payload: { account_id: "${acct_id}", mac_address: "AABBCC001001", device_type: "ROUTER" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
            - call: "POST /voip/devices"
              payload: { account_id: "${acct_id}", mac_address: "AABBCC0010", device_type: "HANDSET" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
          assert:
            - "both trigger calls return HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "GET /voip/devices?account_id=${acct_id} returns 0 rows"

      - name: carrier_is_immutable_and_exposes_no_version_field
        claim_type: immutability
        grounds:
          - entities.Carrier
          - endpoints[GET /voip/carriers/{id}]
          - endpoints[POST /voip/carriers]
        distinguishing_aspect: "Carrier is declared common_fields: false, so its read payload carries name, ocn, csr_match_policy, porting_buffer_minutes and foc_business_days plus id only - no version, no updated_at - and §1.5 declares no update endpoint for it."
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; one carrier"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/carriers"
              payload: { name: "Elm Legacy", ocn: "EL06", csr_match_policy: "RELAXED", porting_buffer_minutes: 0, foc_business_days: 1 }
              as: PlatformAdmin
              captures: { car_id: $.data.id }
          trigger:
            - call: "GET /voip/carriers/${car_id}"
              payload: {}
              as: PortingSpecialist
          assert:
            - "the response data contains no 'version' key and no 'updated_at' key"
            - "Carrier.${car_id}.name == 'Elm Legacy', ocn == 'EL06', csr_match_policy == RELAXED, porting_buffer_minutes == 0, foc_business_days == 1"

      - name: minting_a_phone_number_under_an_unknown_block_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.PhoneNumber.parent
          - validations[priority=9]
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "The nested route POST /voip/number-blocks/{id}/phone-numbers requires its parent block to exist: an unknown parent id returns 404 ERR_RESOURCE_NOT_FOUND and mints nothing."
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; no NumberBlock rows exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /voip/number-blocks/blk-does-not-exist-0001/phone-numbers"
              payload: { line_number: "1601" }
              as: NumberingAdmin
          assert:
            - "the trigger returns HTTP 404 with error_id ERR_RESOURCE_NOT_FOUND"
            - "GET /voip/phone-numbers returns 0 rows"

      - name: port_request_cross_aggregate_ids_are_validated_left_to_right
        claim_type: graph
        grounds:
          - complexity_profile.entity_topology
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_ACCOUNT_NOT_FOUND]
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "PortRequest joins two independent aggregates (Account and Carrier); an unknown account_id yields ERR_ACCOUNT_NOT_FOUND at priority 6 and, with a real account but an unknown losing_carrier_id, ERR_RESOURCE_NOT_FOUND at priority 9 - the graph topology's cross-reference integrity in both directions."
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; one ACTIVE account and one carrier"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT1005", billing_name: "FIRTH OY", service_state_code: "CA", status: "ACTIVE" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /voip/carriers"
              payload: { name: "Firth Legacy", ocn: "FL07", csr_match_policy: "RELAXED", porting_buffer_minutes: 30, foc_business_days: 2 }
              as: PlatformAdmin
              captures: { car_id: $.data.id }
          trigger:
            - call: "POST /voip/port-requests"
              payload: { account_id: "acct-does-not-exist-0001", losing_carrier_id: "${car_id}", requested_numbers: ["+14155551601"], claimed_account_number: "CSR-1005", claimed_pin: "1005", claimed_billing_name: "FIRTH OY", claimed_address_line1: "5 FIRTH WAY", claimed_zip: "94577" }
              as: PortingSpecialist
              as_user_id: "porting-1"
            - call: "POST /voip/port-requests"
              payload: { account_id: "${acct_id}", losing_carrier_id: "car-does-not-exist-0001", requested_numbers: ["+14155551601"], claimed_account_number: "CSR-1005", claimed_pin: "1005", claimed_billing_name: "FIRTH OY", claimed_address_line1: "5 FIRTH WAY", claimed_zip: "94577" }
              as: PortingSpecialist
              as_user_id: "porting-1"
          assert:
            - "the first trigger returns HTTP 404 with error_id ERR_ACCOUNT_NOT_FOUND"
            - "the second trigger returns HTTP 404 with error_id ERR_RESOURCE_NOT_FOUND"
            - "GET /voip/port-requests?account_id=${acct_id} returns 0 rows"

  - section: state_machines
    instances:
      - name: new_port_request_starts_in_submitted_with_null_derived_fields
        claim_type: initial_state
        grounds:
          - state_machines.PortRequest.initial_state
          - entities.PortRequest.fields.status
          - entities.PortRequest.fields.resubmission_count
        distinguishing_aspect: "A freshly filed PortRequest is SUBMITTED with resubmission_count 0, last_match_points null, last_mismatch_fields [], validated_at null and earliest_cutover_at null - no CSR evaluation has run yet."
        test_recipe:
          setup:
            - "clock at 2026-08-03T09:00:00Z; one ACTIVE account and one STRICT carrier"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT1006", billing_name: "GORSE LTD", service_state_code: "CA", status: "ACTIVE" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /voip/carriers"
              payload: { name: "Gorse Legacy", ocn: "GL08", csr_match_policy: "STRICT", porting_buffer_minutes: 60, foc_business_days: 3 }
              as: PlatformAdmin
              captures: { car_id: $.data.id }
          trigger:
            - call: "POST /voip/port-requests"
              payload: { account_id: "${acct_id}", losing_carrier_id: "${car_id}", requested_numbers: ["+14155551701", "+14155551702"], claimed_account_number: "CSR-1006", claimed_pin: "1006", claimed_billing_name: "GORSE LTD", claimed_address_line1: "6 GORSE LN", claimed_zip: "94577" }
              as: PortingSpecialist
              as_user_id: "porting-1"
              captures: { pr_id: $.data.id }
          assert:
            - "the response status is 201 and PortRequest.${pr_id}.status == SUBMITTED"
            - "PortRequest.${pr_id}.resubmission_count == 0 and last_rejection_code == null"
            - "PortRequest.${pr_id}.last_match_points == null and last_mismatch_fields == []"
            - "PortRequest.${pr_id}.validated_at == null and earliest_cutover_at == null"
            - "PortRequest.${pr_id}.version == 1"

      - name: matched_csr_snapshot_moves_port_request_submitted_to_validated
        claim_type: valid_transition
        grounds:
          - state_machines.PortRequest.SUBMITTED_to_VALIDATED
          - calculations.csr_match_evaluation
          - calculations.earliest_cutover_floor
          - endpoints[POST /voip/port-requests/{id}/csr-snapshots]
        distinguishing_aspect: "A snapshot agreeing on all five CSR fields scores 100 against the STRICT threshold of 100, so the request moves SUBMITTED -> VALIDATED with validated_at stamped at the clock and earliest_cutover_at at 2026-08-06T00:00:00Z (three business days after Monday 2026-08-03)."
        test_recipe:
          setup:
            - "clock at 2026-08-03T09:00:00Z, a Monday; STRICT carrier with foc_business_days 3"
            - "one SUBMITTED port request whose claimed_* fields will be matched exactly"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT1007", billing_name: "HAZEL NV", service_state_code: "CA", status: "ACTIVE" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /voip/carriers"
              payload: { name: "Hazel Legacy", ocn: "HL09", csr_match_policy: "STRICT", porting_buffer_minutes: 60, foc_business_days: 3 }
              as: PlatformAdmin
              captures: { car_id: $.data.id }
            - call: "POST /voip/port-requests"
              payload: { account_id: "${acct_id}", losing_carrier_id: "${car_id}", requested_numbers: ["+14155551703"], claimed_account_number: "CSR-1007", claimed_pin: "1007", claimed_billing_name: "HAZEL NV", claimed_address_line1: "7 HAZEL CT", claimed_zip: "94577" }
              as: PortingSpecialist
              as_user_id: "porting-1"
              captures: { pr_id: $.data.id, pr_v1: $.data.version }
          trigger:
            - call: "POST /voip/port-requests/${pr_id}/csr-snapshots"
              payload: { account_number_on_file: "CSR-1007", pin_on_file: "1007", billing_name_on_file: "HAZEL NV", address_line1_on_file: "7 HAZEL CT", zip_on_file: "94577", expected_port_request_version: "${pr_v1}" }
              as: CarrierLiaison
              as_user_id: "liaison-1"
              captures: { snap_id: $.data.id }
          assert:
            - "the response status is 201 and CarrierAccountSnapshot.${snap_id}.match_points == 100, threshold_applied == 100, match_status == MATCHED, mismatch_fields == []"
            - "CarrierAccountSnapshot.${snap_id}.superseded_at == null"
            - "PortRequest.${pr_id}.status == VALIDATED, last_match_points == 100, last_mismatch_fields == []"
            - "PortRequest.${pr_id}.validated_at == 2026-08-03T09:00:00Z and earliest_cutover_at == 2026-08-06T00:00:00Z"
            - "PortRequest.${pr_id}.version == 2"

      - name: resubmit_on_a_submitted_port_request_is_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.PortRequest.transitions
          - validations[priority=11]
          - errors[ERR_PORT_REQUEST_STATE_INVALID]
        distinguishing_aspect: "resubmit is declared only from CSR_MISMATCH and REJECTED, so invoking it on a SUBMITTED request returns 409 ERR_PORT_REQUEST_STATE_INVALID and leaves resubmission_count at 0."
        test_recipe:
          setup:
            - "clock at 2026-08-03T09:00:00Z; one SUBMITTED port request with no snapshot yet"
