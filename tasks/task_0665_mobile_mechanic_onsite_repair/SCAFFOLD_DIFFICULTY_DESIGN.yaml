  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: refund_conserves_fleet_outstanding_balance
        grounds:
          - state_machines.Payment.INVOICED_to_REFUNDED
          - state_machines.JobVisit.ON_SITE_WORKING_to_FINISHED
          - entities.FleetAccount.fields.outstanding_balance_cents
        distinguishing_aspect: "Conserved quantity = FleetAccount.outstanding_balance_cents. Invariant: outstanding_balance_cents == sum(total_due_cents over INVOICED fleet payments). The finish debit (+26000) paired with its compensating refund (-26000) leaves the balance at its pre-finish value (0), no drift."
        test_recipe:
          setup:
            - "FleetAccount F6 ACTIVE credit_limit 1000000 discount 0.20 outstanding 0; Customer M17 member; Mechanic K17 Z1 TIER2 rate 9000; CatalogPart CP5 wholesale 4000; SR17 finished fleet-billed => Payment INVOICED total 26000, outstanding 26000."
