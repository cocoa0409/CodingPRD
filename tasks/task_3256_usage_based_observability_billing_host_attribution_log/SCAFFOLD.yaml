    code: 200
    input: ["status?", "team_id?"]
    output: CustomMetricSeries[]
    side_effects: []

  - method: POST
    path: "/api/billing-accounts/{id}/custom-metric-series/{id}/rollup"
    description: "Post a rollup snapshot (new cardinality observation)"
    roles: [IngestionAgent]
    code: 200
    input: [cardinality_estimate]
    output: CustomMetricSeries
    side_effects:
      - "recomputes cardinality_estimate"
      - "if estimate > plan.included_custom_metrics + 10000 and no OPEN incident: open CardinalityIncident"
      - "if estimate < threshold for 2 consecutive snapshots and incident REMEDIATED: incident -> VERIFIED"
      - "if estimate crosses threshold again and incident VERIFIED: incident -> OPEN (recurrence)"

  # --- CardinalityIncident ---
  - method: GET
    path: "/api/billing-accounts/{id}/cardinality-incidents"
    description: "List cardinality incidents"
    roles: [BillingAdmin, FinanceReader]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CardinalityIncident[]
    side_effects: []

  - method: POST
    path: "/api/billing-accounts/{id}/cardinality-incidents/{id}/triage"
    description: "OPEN -> TRIAGED"
