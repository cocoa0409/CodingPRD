  - rule_id: compensating_invariant
    instances:
      - name: full_parts_return_conserves_ordered_gross_across_the_three_buckets
        grounds:
          - calculations.parts_commitment_ledger
          - entities.RepairOrder.fields.parts_ordered_gross_cents
          - entities.RepairOrder.fields.parts_committed_cents
          - entities.RepairOrder.fields.parts_return_credit_cents
          - entities.RepairOrder.fields.parts_restocking_loss_cents
        distinguishing_aspect: |
          Conserved quantity: money on the parts ledger. parts_ordered_gross_cents is append-only, so
          after a full UNUSED return of a 2-unit line the 20000 cents must still be exactly accounted
          for as committed 0 + credit 16000 + restocking loss 4000. The restocking fee is a loss, not a
          leak: an implementation that simply subtracts the return breaks the identity by 4000.
        test_recipe:
          setup:
            - "One OEM vendor with discount_pct 0 and restocking_fee_pct 0.2, max_qty_per_line 4."
            - "Repair order (deductible 25000, initial authorisation 400000) locked with a single BODY 4.5 h line."
            - "One OEM line at 10000 qty 2: quoted, price-locked (unit_extended 10000, extended 20000), ordered and received in full (received_qty 2, CORRECT)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Hana Cole", phone: "555-0266", email: "hana@example.com" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
