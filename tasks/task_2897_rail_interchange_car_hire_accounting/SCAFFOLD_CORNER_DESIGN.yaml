        distinguishing_aspect: "settle is declared only from EXCHANGED. Firing it on an OPEN cycle returns 409 ERR_INVALID_STATE_TRANSITION at priority 11, and it does so even for the payer road, i.e. the state check is not masked by the party check; the cycle stays OPEN with no ledger entry."
