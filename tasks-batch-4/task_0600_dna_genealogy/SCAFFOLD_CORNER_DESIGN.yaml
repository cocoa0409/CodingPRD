        test_recipe:
          setup: ["Clock 2026-05-01T00:00:00Z. Customer exists with a PLUS subscription."]
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/customers"
              payload: { email: "rb1@dna.test", display_name: "Rb1" }
              as: PlatformAdmin
              captures: { c: $.data.id }
            - call: "POST /dna/subscriptions"
              payload: { customer_id: "${c}", tier: "PLUS" }
              as: Customer
              as_user_id: "${c}"
            - call: "GET /dna/customers/${c}"
              payload: {}
              as: Customer
              as_user_id: "${c}"
              captures: { v: $.data.version }
          trigger:
            - call: "POST /dna/customers/${c}/reports"
              payload: { report_type: "ETHNICITY", variant: "PROVISIONAL", expected_customer_version: "${v}" }
              as: LabTechnician
              as_user_id: "lab-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "${err} == ERR_FORBIDDEN_ROLE"
            - "GET /dna/reports?customer_id=${c} returns 0 reports"

      - name: customer_cannot_decide_own_data_request
        claim_type: Role denial
        grounds: [roles.PrivacyOfficer, roles.Customer, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "POST /dna/data-requests/{id}/decide is exclusive to PrivacyOfficer (peer_roles): the requesting Customer calling it gets ERR_FORBIDDEN_ROLE (403) and the request stays PENDING."
        test_recipe:
          setup: ["Clock 2026-05-01T00:00:00Z. Customer has one PENDING DELETE DataRequest."]
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/customers"
              payload: { email: "rb2@dna.test", display_name: "Rb2" }
              as: PlatformAdmin
              captures: { c: $.data.id }
            - call: "POST /dna/data-requests"
              payload: { customer_id: "${c}", request_type: "DELETE" }
              as: Customer
              as_user_id: "${c}"
              captures: { dr: $.data.id }
          trigger:
            - call: "POST /dna/data-requests/${dr}/decide"
              payload: { decision: "APPROVE" }
              as: Customer
              as_user_id: "${c}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "${err} == ERR_FORBIDDEN_ROLE"
            - "DataRequest.${dr}.status == PENDING"
            - "DataRequest.${dr}.scheduled_purge_at == null"

      - name: customer_cannot_activate_another_customers_kit
        claim_type: Ownership denial
        grounds: ["validations[priority=5]", "errors[ERR_NOT_RESOURCE_OWNER]", roles.Customer]
        distinguishing_aspect: "Customer identity is entity_backed:Customer, so X-User-ID must equal Kit.customer_id; a second customer activating the first customer's kit gets ERR_NOT_RESOURCE_OWNER (403) even with the correct barcode."
        test_recipe:
          setup: ["Clock 2026-05-01T00:00:00Z. Customer 1 owns an ORDERED V5 kit; Customer 2 exists with a PLUS subscription."]
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
