      - name: missing_auth_headers_unauthenticated
        claim_type: Role denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A protected endpoint (POST /memberships/{id}/cancel) called without auth headers -> ERR_UNAUTHENTICATED (401), checked before role/existence."
        test_recipe:
          setup: ["A membership exists (id need not be valid; auth check precedes existence)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_type: "INDIVIDUAL", contact_email: "noauth@x.com" }
              as: AccountHolder
              captures: { acct: "$.data.id" }
          trigger:
            - call: "POST /memberships/00000000-0000-4000-8000-0000000000aa/cancel"
              payload: {}
              as: Anonymous
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 401; error_id == ERR_UNAUTHENTICATED"

