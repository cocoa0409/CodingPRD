          trigger:
            - call: "POST /event-bookings/${b1}/confirm"
              payload: { expected_venue_version: "${v_stale}" }
              as: BookingManager
            - call: "GET /venues/${venue_id}"
              payload: {}
              as: BookingManager
              captures: { v_fresh: $.data.version }
            - call: "POST /event-bookings/${b1}/confirm"
              payload: { expected_venue_version: "${v_fresh}" }
              as: BookingManager
          assert:
            - "the first trigger call returns HTTP 412 with error_id ERR_STALE_VENUE_VERSION, not ERR_HOLD_EXPIRED, even though the hold is also expired"
            - "the third trigger call returns HTTP 409 with error_id ERR_HOLD_EXPIRED"
            - "EventBooking.${b1}.status == HELD"
            - "EventBooking.${b1}.hold_expires_at == 2026-08-04T00:00:00.000Z"
            - "EventBooking.${b2}.status == HELD"
