    output: RentalAgreement
    side_effects: []
  - method: GET
    path: "/rental-network/rental-agreements/{id}/settlement-preview"
    description: "Provisional settlement estimate for an ACTIVE agreement"
    roles: [DealerAgent, NetworkAdmin]
    code: 200
    input: []
    output: RentalAgreement
    side_effects: ["calculate_settlement (provisional_estimate, not persisted)"]
  - method: POST
    path: "/rental-network/rental-agreements/{id}/return"
    description: "Return the equipment at the return location"
    roles: [DealerAgent]
    code: 200
    input: []
    output: RentalAgreement
    side_effects: ["RentalAgreement ACTIVE -> RETURNED", "actual_days computed", "EquipmentUnit OUT -> AVAILABLE with dealer handoff", "DamageProtectionPlan ACTIVE -> EXPIRED", "late_fee_cents computed", "lane_imbalance recompute if ONE_WAY"]
  - method: POST
    path: "/rental-network/rental-agreements/{id}/settle"
    description: "Settle a returned agreement; OCC-guarded"
    roles: [DealerAgent]
    code: 200
    input: [expected_agreement_version]
    output: RentalAgreement
    side_effects: ["RentalAgreement RETURNED -> SETTLED", "reconcile_damage_charges", "calculate_settlement (final_settled)", "increments RentalAgreement.version by 1"]

  - method: POST
    path: "/rental-network/damage-protection-plans"
    description: "Sell a damage protection plan at pickup"
    roles: [DealerAgent]
    code: 201
    input: [agreement_id, tier]
    output: DamageProtectionPlan
    side_effects: ["protection_premium"]
  - method: GET
    path: "/rental-network/damage-protection-plans"
    description: "List plans; optional agreement filter"
    roles: [DealerAgent, NetworkAdmin, FinanceReviewer]
    code: 200
    input: ["agreement_id?", "status?", "limit?", "offset?"]
    output: DamageProtectionPlan[]
    side_effects: []
  - method: GET
    path: "/rental-network/damage-protection-plans/{id}"
    description: "Fetch one plan"
    roles: [DealerAgent, NetworkAdmin, FinanceReviewer]
    code: 200
    input: []
    output: DamageProtectionPlan
    side_effects: []
  - method: POST
    path: "/rental-network/damage-protection-plans/{id}/cancel"
    description: "Cancel a plan before return; open claims auto-deny"
    roles: [DealerAgent]
    code: 200
    input: []
    output: DamageProtectionPlan
    side_effects: ["Plan ACTIVE -> CANCELLED", "FILED claims on the agreement -> DENIED"]

  - method: POST
    path: "/rental-network/damage-claims"
    description: "File a damage claim against an agreement; filer's X-User-ID recorded for segregation of duties"
    roles: [DealerAgent]
    code: 201
    input: [agreement_id, claimed_amount_cents]
    output: DamageClaim
    side_effects: []
  - method: GET
    path: "/rental-network/damage-claims"
    description: "List claims; optional filters"
    roles: [DealerAgent, NetworkAdmin, FinanceReviewer]
    code: 200
    input: ["agreement_id?", "status?", "limit?", "offset?"]
    output: DamageClaim[]
    side_effects: []
  - method: GET
    path: "/rental-network/damage-claims/{id}"
    description: "Fetch one claim"
    roles: [DealerAgent, NetworkAdmin, FinanceReviewer]
    code: 200
    input: []
    output: DamageClaim
    side_effects: []
  - method: POST
    path: "/rental-network/damage-claims/{id}/approve"
    description: "Approve a claim (capped by plan coverage); recomputes agreement damage charges"
    roles: [DealerAgent]
    code: 200
    input: ["resolution_note?"]
    output: DamageClaim
    side_effects: ["DamageClaim FILED -> APPROVED", "approved_amount_cents = min(claimed, tier cap)", "reconcile_damage_charges on agreement", "increments RentalAgreement.version by 1"]
  - method: POST
    path: "/rental-network/damage-claims/{id}/deny"
    description: "Deny a claim"
    roles: [DealerAgent]
    code: 200
    input: ["resolution_note?"]
    output: DamageClaim
    side_effects: ["DamageClaim FILED -> DENIED"]
  - method: POST
    path: "/rental-network/damage-claims/{id}/reopen"
    description: "Reopen a denied claim (appeal loop) while the agreement is unsettled"
    roles: [DealerAgent]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["DamageClaim DENIED -> FILED"]
  - method: POST
    path: "/rental-network/damage-claims/{id}/pay"
    description: "Pay an approved claim after settlement"
    roles: [DealerAgent]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["DamageClaim APPROVED -> PAID"]

  - method: POST
    path: "/rental-network/reposition-tasks"
    description: "Create a repositioning task; selector picks an AVAILABLE unit at the surplus location"
    roles: [NetworkAdmin]
    code: 201
    input: [from_location_id, to_location_id, equipment_type]
    output: RepositionTask
    side_effects: ["unit selector (created_at ASC among AVAILABLE units of the type at from_location)", "EquipmentUnit AVAILABLE -> REPOSITIONING", "reposition_cost (provisional_variant)", "scheduled_after = logical clock"]
  - method: GET
    path: "/rental-network/reposition-tasks"
    description: "List tasks; optional filters"
    roles: [NetworkAdmin, RepositionDriver, FinanceReviewer]
    code: 200
    input: ["from_location_id?", "to_location_id?", "equipment_unit_id?", "status?", "limit?", "offset?"]
    output: RepositionTask[]
    side_effects: []
  - method: GET
    path: "/rental-network/reposition-tasks/{id}"
    description: "Fetch one task"
    roles: [NetworkAdmin, RepositionDriver]
    code: 200
    input: []
    output: RepositionTask
    side_effects: []
  - method: GET
    path: "/rental-network/reposition-tasks/imbalance-report"
    description: "Historical imbalance factors per ACTIVE lane (excludes pending deficit term)"
    roles: [NetworkAdmin, PricingManager]
    code: 200
    input: ["equipment_type?"]
    output: "{ lanes: array }"
    side_effects: ["lane_imbalance (historical_variant)"]
  - method: POST
    path: "/rental-network/reposition-tasks/{id}/assign"
    description: "Assign a driver to an OPEN task"
    roles: [NetworkAdmin]
    code: 200
    input: [assigned_driver_id]
    output: RepositionTask
    side_effects: ["RepositionTask OPEN -> ASSIGNED"]
  - method: POST
    path: "/rental-network/reposition-tasks/{id}/complete"
    description: "Driver completes the move; unit lands at destination, lane imbalance recomputed"
    roles: [RepositionDriver]
    code: 200
    input: []
    output: RepositionTask
    side_effects: ["RepositionTask ASSIGNED -> COMPLETED", "EquipmentUnit REPOSITIONING -> AVAILABLE with dealer handoff", "reposition_cost (actual)", "lane_imbalance recomputed for touched lanes"]
  - method: POST
    path: "/rental-network/reposition-tasks/{id}/cancel"
    description: "Cancel an OPEN task; unit returns to AVAILABLE in place"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: RepositionTask
    side_effects: ["RepositionTask OPEN -> CANCELLED", "EquipmentUnit REPOSITIONING -> AVAILABLE (no location change)"]

  - method: POST
    path: "/rental-network/cross-sell-orders"
    description: "Create a cross-sell order (moving supplies + optional storage months)"
    roles: [DealerAgent]
    code: 201
    input: [dealer_id, "agreement_id?", line_items, "storage_months?"]
    output: CrossSellOrder
    side_effects: ["cross_sell_bundle", "zone capacity check"]
  - method: GET
    path: "/rental-network/cross-sell-orders"
    description: "List cross-sell orders; optional filters"
    roles: [DealerAgent, NetworkAdmin, FinanceReviewer]
    code: 200
    input: ["dealer_id?", "agreement_id?", "limit?", "offset?"]
    output: CrossSellOrder[]
    side_effects: []
  - method: GET
    path: "/rental-network/cross-sell-orders/{id}"
    description: "Fetch one cross-sell order"
    roles: [DealerAgent, NetworkAdmin, FinanceReviewer]
    code: 200
    input: []
    output: CrossSellOrder
    side_effects: []

  - method: POST
    path: "/rental-network/dealer-settlements"
    description: "Create a DRAFT quarterly settlement for a dealer"
    roles: [FinanceReviewer]
    code: 201
    input: [dealer_id, period]
    output: DealerSettlement
    side_effects: ["dealer_settlement (draft computation)"]
  - method: GET
    path: "/rental-network/dealer-settlements"
    description: "List settlements; optional filters"
    roles: [FinanceReviewer, NetworkAdmin, DealerAgent]
    code: 200
    input: ["dealer_id?", "period?", "status?", "limit?", "offset?"]
    output: DealerSettlement[]
    side_effects: []
  - method: GET
    path: "/rental-network/dealer-settlements/{id}"
    description: "Fetch one settlement"
    roles: [FinanceReviewer, NetworkAdmin, DealerAgent]
    code: 200
    input: []
    output: DealerSettlement
    side_effects: []
  - method: POST
    path: "/rental-network/dealer-settlements/{id}/approve"
    description: "Approve a DRAFT or DISPUTED settlement; recomputes and freezes amounts"
    roles: [FinanceReviewer]
    code: 200
    input: []
    output: DealerSettlement
    side_effects: ["DealerSettlement -> APPROVED", "dealer_settlement recompute + freeze"]
  - method: POST
    path: "/rental-network/dealer-settlements/{id}/dispute"
    description: "Dealer disputes a DRAFT settlement"
    roles: [DealerAgent]
    code: 200
    input: []
    output: DealerSettlement
    side_effects: ["DealerSettlement DRAFT -> DISPUTED"]
  - method: POST
    path: "/rental-network/dealer-settlements/{id}/pay"
    description: "Pay an APPROVED settlement; payer must differ from approver"
    roles: [FinanceReviewer]
    code: 200
    input: []
    output: DealerSettlement
    side_effects: ["DealerSettlement APPROVED -> PAID"]

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock. Before any call, the logical clock reads exactly 2026-09-01T00:00:00Z (the server startup default) and MUST NOT fall back to wall-clock time."
    roles: [NetworkAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or invalid X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not authorized for the endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path id does not resolve"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "Body FK (dealer, location, customer, reservation, agreement, vehicle profile) does not resolve"
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "Natural key collision: dealer_code, location_code, unit_code, customer email, agreement.reservation_id, plan.agreement_id"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong type, or unknown enum value"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Entity's current state does not permit the requested transition"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the entity's current version (OCC)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Same X-User-ID attempted two steps that must be performed by different people (claim approve/deny vs file; settlement pay vs approve)"
  - id: ERR_TOW_INCOMPATIBLE
    http: 422
    condition: "Towing compatibility check failed: hitch class, tow capacity, or curb-weight ratio below threshold"
  - id: ERR_LICENSE_NOT_VERIFIED
    http: 422
    condition: "Customer.driver_license_verified is false at confirm"
  - id: ERR_DEALER_SUSPENDED
    http: 409
    condition: "Reservation origin dealer is not ACTIVE at confirm or pickup"
  - id: ERR_LOCATION_CLOSED
    http: 409
    condition: "Pickup or return location is CLOSED"
  - id: ERR_INVALID_DATE_RANGE
    http: 400
    condition: "dropoff_date <= pickup_date, pickup in the past, or no-show before pickup_date"
  - id: ERR_NO_UNIT_AVAILABLE
    http: 409
    condition: "No AVAILABLE unit of the requested type at the origin dealer free for the interval"
  - id: ERR_NO_ACTIVE_RATE
    http: 422
    condition: "No ACTIVE LaneRate for (origin, dest, equipment_type, season)"
  - id: ERR_NO_REASSIGNMENT_CANDIDATE
    http: 409
    condition: "Reassignment selector pool empty"
  - id: ERR_OPEN_CLAIMS
    http: 409
    condition: "Settle attempted while a DamageClaim on the agreement is FILED"
  - id: ERR_STORAGE_CAPACITY_EXCEEDED
    http: 409
    condition: "Zone storage-month aggregate would exceed the sum of OPEN locations' storage_capacity"
  - id: ERR_DRIVER_MISMATCH
    http: 403
    condition: "Task complete attempted by an X-User-ID other than assigned_driver_id"
  - id: ERR_INVALID_CLAIM_AMOUNT
    http: 422
    condition: "claimed_amount_cents <= 0"
  - id: ERR_DEALER_HAS_ACTIVE_HOLDINGS
    http: 409
    condition: "Dealer deactivate attempted while units or live reservations are attached"
  - id: ERR_NO_ACTIVE_DEALER_AT_LOCATION
    http: 409
    condition: "Return or reposition completion cannot hand the unit to a dealer: no ACTIVE dealer at the location"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: NetworkAdmin
    description: "Central network operator: locations, dealers, fleet registry, lane oversight, repositioning orchestration, allocation rounds"
    identity: "opaque"
    exclusive_operations:
      - "create/close/reopen locations"
      - "create/suspend/reactivate/deactivate dealers"
      - "register/retire equipment units"
      - "create/assign/cancel reposition tasks"
      - "run allocation rounds and performance reviews"
      - "reassign/expire/mark-no-show reservations"
      - "set the logical clock"
    shared_operations:
      - "read any entity"
  - name: DealerAgent
    description: "Staff at an independent dealer location; X-User-ID equals the dealer's id for ownership checks"
    identity: "entity_backed:Dealer"
    exclusive_operations:
      - "verify customer licenses"
      - "create/return/settle rental agreements"
      - "sell and cancel damage protection plans"
      - "file/approve/deny/reopen/pay damage claims"
      - "create cross-sell orders"
      - "dispute dealer settlements"
      - "move own units into/out of maintenance"
    shared_operations:
      - "read reservations, agreements, claims, plans, orders, settlements, lane rates"
  - name: Customer
    description: "Renter; X-User-ID equals the customer's id"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "register customer account and vehicle profile"
      - "create reservations"
      - "confirm and cancel own reservations"
    shared_operations:
      - "read own reservations and events"
  - name: PricingManager
    description: "Owns lane rates and reads imbalance reports"
    identity: "opaque"
    exclusive_operations:
      - "create/activate/supersede lane rates"
    shared_operations:
      - "read locations, dealers, units, imbalance report"
  - name: RepositionDriver
    description: "Driver executing reposition tasks; X-User-ID is the driver identifier recorded on the task"
    identity: "opaque"
    exclusive_operations:
      - "complete assigned reposition tasks"
    shared_operations:
      - "read reposition tasks"
  - name: FinanceReviewer
    description: "Back-office finance: settlements, reads of monetary entities"
    identity: "opaque"
    exclusive_operations:
      - "create/approve/pay dealer settlements"
    shared_operations:
      - "read dealers, agreements, claims, plans, orders, settlements, lane rates, reposition tasks"
