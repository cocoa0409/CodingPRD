# =============================================================================
# SCAFFOLD — Sports Facility Scheduling & Field Allocation
# Parks & recreation athletics office: permit windows, priority allocation,
# rain rescheduling, turf rest, fees/deposits, lights cost recovery, no-shows.
# =============================================================================

scenario: |
  Sports Facility Scheduling & Field Allocation (parks & recreation athletics office):
  facility inventory & permit application windows, allocation policy by user group
  priority & historical usage, conflict resolution & rain-date rescheduling, field
  condition/closure decisions & turf rest rotation, fee schedule
  (resident/nonresident/commercial) & deposit, lights/utility scheduling & cost
  recovery, tournament vs league priority, no-show & permit revocation

domain_name: sports-facility-scheduling
api_prefix: ""

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - rate_threshold_triggers      # prime-hour caps, strike thresholds, refund-approval threshold
    - cascading_side_effects       # closure -> rain-out -> credit -> ledger release; no-show -> strike -> suspension -> revocation
    - derived_field_reconciliation # weekly_prime_hours_used, awarded_prime_hours, invoice aggregates
    - optimistic_concurrency       # OCC on Permit / Facility / Invoice version
  entity_topology: flat            # peer entities joined by FK references; no nested creation paths
  state_machine_shape: cyclic      # application info-loop, rain reschedule loop, standing cycle
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential             # Permit.original_permit_id (reschedule lineage)
  role_model: segregation_of_duties # refund initiator != refund approver
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Organization
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Organization legal name" }
      - { name: classification, type: enum, source: input, description: "RESIDENT | NONRESIDENT | COMMERCIAL" }
      - { name: org_type, type: enum, source: input, description: "YOUTH_LEAGUE | ADULT_LEAGUE | SCHOOL | TOURNAMENT_OPERATOR | CORPORATE" }
      - { name: prior_seasons_active, type: integer, source: input, description: "Count of prior seasons with any awarded usage; feeds loyalty points", default: 0, constraints: ">= 0" }
      - { name: standing, type: enum, source: system, description: "GOOD | PROBATION | SUSPENDED; derived from active strike count and admin reinstatement", default: GOOD }
      - { name: no_show_strikes_active, type: integer, source: computed, description: "Count of StrikeRecord rows with status ACTIVE for this organization", default: 0 }

  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Facility name" }
      - { name: facility_class, type: enum, source: input, description: "DIAMOND | RECTANGLE | MULTIPURPOSE" }
      - { name: has_lights, type: boolean, source: input, description: "Whether the facility has a lights grid" }
      - { name: capacity, type: integer, source: input, description: "Maximum headcount (occupancy safety limit)", constraints: ">= 1" }
      - { name: weekly_prime_hour_cap, type: integer, source: input, description: "Turf-rest cap: max prime hours (start_minute >= 1020) that may be RESERVED/CONFIRMED per ISO week", constraints: ">= 1" }
      - { name: nightly_light_block_cap, type: integer, source: input, description: "Max 15-minute light blocks approvable per calendar date (cost-recovery budget)", constraints: ">= 1" }
      - { name: condition_status, type: enum, source: system, description: "OPEN | LIMITED | CLOSED; mutated only via POST /facilities/{id}/condition", default: OPEN }
      - { name: condition_reason, type: string, source: system, description: "Reason text from the latest condition decision", default: "" }
      - { name: weekly_prime_hours_used, type: integer, source: computed, description: "Prime hours of this facility's Permits in {RESERVED, CONFIRMED} for the calendar week (Mon-Sun) of the current logical clock; recomputed on every permit mutation", default: 0 }

  - name: FeeSchedule
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Schedule label" }
      - { name: effective_from, type: datetime, source: input, description: "ISO8601 date from which this schedule may be pinned to new awards" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | SUPERSEDED", default: DRAFT }
      - { name: hourly_resident_cents, type: integer, source: input, description: "Per-hour field rate, RESIDENT classification", constraints: ">= 0" }
      - { name: hourly_nonresident_cents, type: integer, source: input, description: "Per-hour field rate, NONRESIDENT", constraints: ">= 0" }
      - { name: hourly_commercial_cents, type: integer, source: input, description: "Per-hour field rate, COMMERCIAL", constraints: ">= 0" }
      - { name: lights_block_cents, type: integer, source: input, description: "Price per 15-minute lights block", constraints: ">= 0" }
      - { name: nonresident_surcharge_pct, type: integer, source: input, description: "Percent surcharge on the rounded field-fee line for NONRESIDENT", constraints: "0..100" }
      - { name: commercial_surcharge_pct, type: integer, source: input, description: "Percent surcharge on the rounded field-fee line for COMMERCIAL", constraints: "0..100" }
      - { name: tournament_day_cents, type: integer, source: input, description: "Flat field fee replacing hourly when event_type=TOURNAMENT and duration >= tournament_day_min_minutes", constraints: ">= 0" }
      - { name: tournament_day_min_minutes, type: integer, source: input, description: "Duration threshold for the tournament flat day rate", constraints: ">= 60" }
      - { name: deposit_pct, type: integer, source: input, description: "Percent of quoted total charged as deposit", constraints: "1..100" }
      - { name: min_deposit_cents, type: integer, source: input, description: "Floor for the deposit", constraints: ">= 0" }

  - name: AllocationWindow
    parent: null
    common_fields: true
    fields:
      - { name: season_code, type: string, source: input, description: "Season label, e.g. 2026-FALL" }
      - { name: opens_at, type: datetime, source: input, description: "ISO8601; window may open no earlier than this" }
      - { name: closes_at, type: datetime, source: input, description: "ISO8601; window may close no earlier than this", constraints: "closes_at > opens_at" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN | CLOSED | ALLOCATED", default: SCHEDULED }
      - { name: prime_cap_hours_per_org, type: integer, source: input, description: "Max awarded prime hours per organization for this season (inclusive boundary)", constraints: ">= 1" }
      - { name: max_tournament_days_per_org, type: integer, source: input, description: "Max TOURNAMENT event days per organization per season (inclusive boundary)", constraints: ">= 0" }

  - name: PermitApplication
    parent: null
    common_fields: true
    fields:
      - { name: window_id, type: string, source: input, description: "FK -> AllocationWindow.id; window the application is filed under" }
      - { name: organization_id, type: string, source: system, description: "FK -> Organization.id; server-set from X-User-ID of the OrgCoordinator" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; requested facility" }
      - { name: event_date, type: string, source: input, description: "ISO8601 date (YYYY-MM-DD) of the requested slot" }
      - { name: start_minute, type: integer, source: input, description: "Minutes from midnight, local; half-open interval start", constraints: "0..1439" }
      - { name: end_minute, type: integer, source: input, description: "Minutes from midnight; half-open interval end", constraints: "start_minute < end_minute <= 1440; duration 30..480" }
      - { name: event_type, type: enum, source: input, description: "LEAGUE_GAME | LEAGUE_PRACTICE | TOURNAMENT | SPECIAL_EVENT" }
      - { name: wants_lights, type: boolean, source: input, description: "Whether lights are requested for the whole slot", default: false }
      - { name: headcount, type: integer, source: input, description: "Expected attendees; must be <= facility.capacity", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | NEEDS_INFO | AWARDED | WAITLISTED | DENIED | WITHDRAWN", default: SUBMITTED }
      - { name: provisional_score, type: integer, source: computed, description: "allocation_priority_score provisional variant, snapshot at submission time" }
      - { name: final_score, type: integer, source: computed, description: "allocation_priority_score final variant, computed at allocation run; null until window CLOSED run", default: null }
      - { name: decision_note, type: string, source: system, description: "Reason recorded for DENIED / WAITLISTED / NEEDS_INFO outcomes", default: "" }

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> PermitApplication.id; originating application" }
      - { name: organization_id, type: string, source: system, description: "FK -> Organization.id" }
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id" }
      - { name: fee_schedule_id, type: string, source: system, description: "FK -> FeeSchedule.id; version pinned at award time" }
      - { name: original_permit_id, type: string, source: system, description: "FK -> Permit.id; null for first award; set to this permit's own pre-reschedule identity lineage root when rescheduled (self-referential)", default: null }
      - { name: permit_date, type: string, source: system, description: "ISO8601 date of the slot" }
      - { name: start_minute, type: integer, source: system, description: "Half-open slot start" }
      - { name: end_minute, type: integer, source: system, description: "Half-open slot end" }
      - { name: event_type, type: enum, source: system, description: "Copied from the application: LEAGUE_GAME | LEAGUE_PRACTICE | TOURNAMENT | SPECIAL_EVENT" }
      - { name: lights_approved, type: boolean, source: system, description: "True when lights were granted (buffer + nightly cap checks passed at award)", default: false }
      - { name: lights_minutes_quoted, type: integer, source: system, description: "Quoted lights minutes = slot duration when lights_approved else 0", default: 0 }
      - { name: status, type: enum, source: system, description: "RESERVED | CONFIRMED | RAINED_OUT | COMPLETED | CANCELLED | NO_SHOW | REVOKED", default: RESERVED }
      - { name: quoted_field_fee_cents, type: integer, source: computed, description: "Provisional field-fee line at award/reschedule" }
      - { name: quoted_lights_fee_cents, type: integer, source: computed, description: "Provisional lights-fee line" }
      - { name: quoted_surcharge_cents, type: integer, source: computed, description: "Provisional surcharge line" }
      - { name: quoted_total_cents, type: integer, source: computed, description: "Provisional total (sum of rounded lines)" }
      - { name: deposit_required_cents, type: integer, source: computed, description: "min(quoted_total, max(min_deposit, round_half_up(quoted_total * deposit_pct/100)))" }
      - { name: final_total_cents, type: integer, source: computed, description: "Final-variant total at settle; null until COMPLETED", default: null }
      - { name: attendance_minutes, type: integer, source: system, description: "Recorded at check-in; null until checked in", default: null }
      - { name: rain_reschedule_count, type: integer, source: system, description: "Number of completed reschedules; hard cap 2", default: 0 }

  - name: FieldClosure
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: closure_date, type: string, source: input, description: "ISO8601 date affected" }
      - { name: start_minute, type: integer, source: input, description: "Null = full-day closure; else half-open start", default: null }
      - { name: end_minute, type: integer, source: input, description: "Null when full-day; else half-open end, > start_minute", default: null }
      - { name: reason, type: enum, source: input, description: "RAIN | TURF_REST | MAINTENANCE | SAFETY" }
      - { name: status, type: enum, source: system, description: "ACTIVE | LIFTED", default: ACTIVE }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: permit_id, type: string, source: system, description: "FK -> Permit.id; exactly one invoice per permit" }
      - { name: organization_id, type: string, source: system, description: "FK -> Organization.id" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PARTIALLY_PAID | PAID | VOID | REFUNDED", default: DRAFT }
      - { name: field_fee_cents, type: integer, source: computed, description: "Field-fee line (provisional until settle, final after)" }
      - { name: lights_fee_cents, type: integer, source: computed, description: "Lights-fee line" }
      - { name: surcharge_cents, type: integer, source: computed, description: "Classification surcharge line" }
      - { name: credit_cents, type: integer, source: computed, description: "Rain/closure credit applied (>= 0)", default: 0 }
      - { name: adjustment_cents, type: integer, source: computed, description: "Sum of manual adjustments (signed)", default: 0 }
      - { name: penalty_cents, type: integer, source: computed, description: "Cancellation/no-show/revocation penalty assessed", default: 0 }
      - { name: total_cents, type: integer, source: computed, description: "Amount owed: field+lights+surcharge+adjustment-credit, or penalty after cancel-style closeout" }
      - { name: deposit_cents, type: integer, source: computed, description: "Snapshot of permit.deposit_required_cents at invoice creation" }
      - { name: paid_cents, type: integer, source: computed, description: "Sum of Payment rows kind=PAYMENT status=CLEARED", default: 0 }
      - { name: refunded_cents, type: integer, source: computed, description: "Sum of Payment rows kind=REFUND status=CLEARED", default: 0 }
      - { name: balance_due_cents, type: integer, source: computed, description: "total_cents - (paid_cents - refunded_cents)", default: 0 }
      - { name: deposit_penalty_applied_cents, type: integer, source: computed, description: "Waterfall bucket 1: deposit consumed by penalty", default: 0 }
      - { name: deposit_balance_applied_cents, type: integer, source: computed, description: "Waterfall bucket 2: deposit consumed by remaining balance", default: 0 }
      - { name: deposit_refunded_cents, type: integer, source: computed, description: "Waterfall bucket 3: deposit returned", default: 0 }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id" }
      - { name: organization_id, type: string, source: system, description: "FK -> Organization.id" }
      - { name: kind, type: enum, source: system, description: "PAYMENT | REFUND" }
      - { name: amount_cents, type: integer, source: input, description: "Positive amount in cents", constraints: ">= 1" }
      - { name: method, type: enum, source: input, description: "CHECK | CARD | CASH | CREDIT" }
      - { name: status, type: enum, source: system, description: "CLEARED | PENDING_APPROVAL (refunds > auto-approve threshold start PENDING_APPROVAL)", default: CLEARED }
      - { name: initiated_by, type: string, source: system, description: "X-User-ID of the FinanceClerk who created the row" }
      - { name: approved_by, type: string, source: system, description: "X-User-ID of the approving AthleticsAdmin; null until approved", default: null }

  - name: StrikeRecord
    parent: null
    common_fields: false
    fields:
      - { name: organization_id, type: string, source: system, description: "FK -> Organization.id" }
      - { name: permit_id, type: string, source: system, description: "FK -> Permit.id; the no-show permit" }
      - { name: strike_points, type: integer, source: computed, description: "10 * (count of ACTIVE strikes including this one at creation time)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RESCINDED", default: ACTIVE }

  - name: UsageLedger
    parent: null
    common_fields: true
    fields:
      - { name: organization_id, type: string, source: system, description: "FK -> Organization.id" }
      - { name: season_code, type: string, source: system, description: "Season this ledger row accumulates into" }
      - { name: awarded_prime_hours, type: integer, source: computed, description: "Hours with start_minute >= 1020 held by this org's Permits in {RESERVED, CONFIRMED} this season", default: 0 }
      - { name: awarded_nonprime_hours, type: integer, source: computed, description: "Non-prime awarded hours in {RESERVED, CONFIRMED}", default: 0 }
      - { name: attended_hours, type: integer, source: computed, description: "Sum of attendance_minutes/60 (integer division per permit) over COMPLETED permits", default: 0 }
      - { name: no_show_count, type: integer, source: computed, description: "Count of NO_SHOW permits this season", default: 0 }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Organization
    field: standing
    initial_state: GOOD
    terminal_states: []
    transitions:
      - from: GOOD
        to: PROBATION
        trigger: "system: strike cascade makes no_show_strikes_active == 2"
        actor: system
        preconditions: ["no_show_strikes_active becomes exactly 2"]
        side_effects: ["Organization.version increments", "updated_at refreshed"]
      - from: PROBATION
        to: SUSPENDED
        trigger: "system: strike cascade makes no_show_strikes_active >= 3"
        actor: system
        preconditions: ["no_show_strikes_active becomes >= 3"]
        side_effects:
          - "Revocation cascade: every Permit of this org in {RESERVED, CONFIRMED} with permit_date >= current logical date transitions to REVOKED with fault=ORG_FAULT"
          - "Each revoked permit's Invoice runs the deposit waterfall with penalty_cents = deposit_cents (deposit forfeited); invoice balance_due_cents stays owed"
          - "Each revoked permit's UsageLedger awarded hours are released (awarded_prime_hours / awarded_nonprime_hours decremented)"
          - "All WAITLISTED PermitApplications of this org transition to DENIED with decision_note='ORG_SUSPENDED'"
      - from: SUSPENDED
        to: PROBATION
        trigger: "POST /organizations/{id}/reinstate"
        actor: AthleticsAdmin
        preconditions: ["organization.standing == SUSPENDED"]
        side_effects:
          - "Organization.version increments"
          - "standing re-evaluated immediately after reinstatement: if no_show_strikes_active < 2 the PROBATION -> GOOD system transition fires as a follow-on in the same request"
      - from: PROBATION
        to: GOOD
        trigger: "system: standing re-evaluation while no_show_strikes_active < 2 (after a rescind or immediately after reinstate)"
        actor: system
        preconditions: ["standing == PROBATION and no_show_strikes_active < 2"]
        side_effects: ["Organization.version increments"]
      - from: GOOD
        to: SUSPENDED
        trigger: "system: strike cascade makes no_show_strikes_active >= 3 in one step"
        actor: system
        preconditions: ["no_show_strikes_active jumps from < 2 to >= 3 (only reachable via bulk rescue; ordinarily via PROBATION)"]
        side_effects: ["Same revocation cascade as PROBATION -> SUSPENDED"]

  - entity: Facility
    field: condition_status
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: LIMITED
        trigger: "POST /facilities/{id}/condition"
        actor: FieldSupervisor
        preconditions: ["expected_facility_version matches facility.version"]
        side_effects: ["condition_reason set", "version increments"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /facilities/{id}/condition"
        actor: FieldSupervisor
        preconditions: ["expected_facility_version matches facility.version"]
        side_effects: ["condition_reason set", "version increments", "new PermitApplications naming this facility are rejected while CLOSED (ERR_FACILITY_CLOSED)", "reschedule targeting this facility is rejected while CLOSED"]
      - from: LIMITED
        to: OPEN
        trigger: "POST /facilities/{id}/condition"
        actor: FieldSupervisor
        preconditions: ["expected_facility_version matches facility.version"]
        side_effects: ["condition_reason set", "version increments"]
      - from: LIMITED
        to: CLOSED
        trigger: "POST /facilities/{id}/condition"
        actor: FieldSupervisor
        preconditions: ["expected_facility_version matches facility.version"]
        side_effects: ["condition_reason set", "version increments"]
      - from: CLOSED
        to: OPEN
        trigger: "POST /facilities/{id}/condition"
        actor: FieldSupervisor
        preconditions: ["expected_facility_version matches facility.version"]
        side_effects: ["condition_reason set", "version increments"]
      - from: CLOSED
        to: LIMITED
        trigger: "POST /facilities/{id}/condition"
        actor: FieldSupervisor
        preconditions: ["expected_facility_version matches facility.version"]
        side_effects: ["condition_reason set", "version increments"]

  - entity: FeeSchedule
    field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /fee-schedules/{id}/publish"
        actor: AthleticsAdmin
        preconditions: ["schedule.status == DRAFT", "effective_from is not after the current logical clock date + 365 days"]
        side_effects: ["Any other FeeSchedule in PUBLISHED transitions to SUPERSEDED", "version increments"]
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system: another FeeSchedule is published"
        actor: system
        preconditions: ["another schedule transitions DRAFT -> PUBLISHED"]
        side_effects: ["version increments"]

  - entity: AllocationWindow
    field: status
    initial_state: SCHEDULED
    terminal_states: [ALLOCATED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /allocation-windows/{id}/open"
        actor: AthleticsAdmin
        preconditions: ["window.status == SCHEDULED", "logical clock >= opens_at (else ERR_WINDOW_NOT_YET_OPEN)"]
        side_effects: ["version increments"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /allocation-windows/{id}/close"
        actor: AthleticsAdmin
        preconditions: ["window.status == OPEN"]
        side_effects:
          - "Every PermitApplication of this window in SUBMITTED transitions to UNDER_REVIEW"
          - "version increments"
      - from: CLOSED
        to: ALLOCATED
        trigger: "POST /allocation-windows/{id}/run-allocation"
        actor: AthleticsAdmin
        preconditions: ["window.status == CLOSED", "a FeeSchedule in PUBLISHED exists (else ERR_INVALID_SCHEDULE_STATE)"]
        side_effects:
          - "allocation_run calculation executes: each UNDER_REVIEW application is scored (final_score) and decided in deterministic order"
          - "Each AWARDED application spawns Permit(status=RESERVED, fee_schedule_id pinned to the PUBLISHED schedule) + Invoice(status=DRAFT, deposit snapshot)"
          - "UsageLedger row (org, season_code) is created on first award and awarded_*_hours incremented"
          - "Facility.weekly_prime_hours_used recomputed"
          - "version increments"

  - entity: PermitApplication
    field: status
    initial_state: SUBMITTED
    terminal_states: [AWARDED, DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "system: window close"
        actor: system
        preconditions: ["parent AllocationWindow transitions OPEN -> CLOSED"]
        side_effects: ["version increments"]
      - from: UNDER_REVIEW
        to: NEEDS_INFO
        trigger: "POST /permit-applications/{id}/request-info"
        actor: AthleticsAdmin
        preconditions: ["application.status == UNDER_REVIEW", "parent window.status == CLOSED"]
        side_effects: ["decision_note set from input note", "version increments"]
      - from: NEEDS_INFO
        to: UNDER_REVIEW
        trigger: "POST /permit-applications/{id}/respond"
        actor: OrgCoordinator
        preconditions: ["application.status == NEEDS_INFO", "X-User-ID == application.organization_id"]
        side_effects: ["version increments; the info loop may repeat without limit"]
      - from: UNDER_REVIEW
        to: AWARDED
        trigger: "system: allocation run selects the application, or waitlist promotion"
        actor: system
        preconditions: ["allocation_run or waitlist_promotion selects this application"]
        side_effects: ["Permit RESERVED created", "Invoice DRAFT created", "UsageLedger awarded hours incremented", "version increments"]
      - from: UNDER_REVIEW
        to: WAITLISTED
        trigger: "system: allocation run defers the application (conflict or cap)"
        actor: system
        preconditions: ["slot conflict with an earlier-awarded application, OR prime/tournament cap would be exceeded"]
        side_effects: ["decision_note set (SLOT_CONFLICT | PRIME_CAP | TOURNAMENT_CAP)", "version increments"]
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "system: allocation run denies the application"
        actor: system
        preconditions: ["organization.standing == SUSPENDED at run time"]
        side_effects: ["decision_note='ORG_SUSPENDED'", "version increments"]
      - from: WAITLISTED
        to: AWARDED
        trigger: "system: waitlist promotion after a cancel/revoke frees the slot"
        actor: system
        preconditions: ["promotion selector picks this application; caps re-checked and pass"]
        side_effects: ["Permit RESERVED created", "Invoice DRAFT created", "UsageLedger awarded hours incremented", "version increments"]
      - from: WAITLISTED
        to: DENIED
        trigger: "system: organization suspension cascade"
        actor: system
        preconditions: ["organization.standing becomes SUSPENDED"]
        side_effects: ["decision_note='ORG_SUSPENDED'", "version increments"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /permit-applications/{id}/withdraw"
        actor: OrgCoordinator
        preconditions: ["X-User-ID == application.organization_id"]
        side_effects: ["version increments"]
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /permit-applications/{id}/withdraw"
        actor: OrgCoordinator
        preconditions: ["X-User-ID == application.organization_id"]
        side_effects: ["version increments"]
      - from: NEEDS_INFO
        to: WITHDRAWN
        trigger: "POST /permit-applications/{id}/withdraw"
        actor: OrgCoordinator
        preconditions: ["X-User-ID == application.organization_id"]
        side_effects: ["version increments"]
      - from: WAITLISTED
        to: WITHDRAWN
        trigger: "POST /permit-applications/{id}/withdraw"
        actor: OrgCoordinator
        preconditions: ["X-User-ID == application.organization_id"]
        side_effects: ["version increments"]

  - entity: Permit
    field: status
    initial_state: RESERVED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW, REVOKED]
    transitions:
      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /permits/{id}/confirm"
        actor: OrgCoordinator
        preconditions:
          - "X-User-ID == permit.organization_id"
          - "permit.status == RESERVED"
          - "organization.standing != SUSPENDED (else ERR_ORG_SUSPENDED)"
          - "invoice.status == ISSUED | PARTIALLY_PAID | PAID (else ERR_INVALID_INVOICE_STATE)"
          - "invoice.paid_cents >= invoice.deposit_cents (else ERR_DEPOSIT_NOT_PAID)"
        side_effects: ["version increments"]
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /permits/{id}/cancel"
        actor: OrgCoordinator | AthleticsAdmin
        preconditions: ["permit.status == RESERVED", "OrgCoordinator must own the permit"]
        side_effects:
          - "cancellation_penalty runs (0% tier when unconfirmed)"
          - "deposit waterfall on the Invoice"
          - "UsageLedger awarded hours released; Facility.weekly_prime_hours_used recomputed"
          - "waitlist_promotion runs for the freed slot"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /permits/{id}/cancel"
        actor: OrgCoordinator | AthleticsAdmin
        preconditions: ["permit.status == CONFIRMED", "logical clock < permit start (else ERR_INVALID_PERMIT_STATE)", "OrgCoordinator must own the permit"]
        side_effects:
          - "cancellation_penalty runs with notice-hours tier; invoice.total_cents replaced by penalty_cents"
          - "deposit waterfall: deposit -> penalty -> remaining balance -> refund remainder (creates REFUND Payment when remainder > 0)"
          - "UsageLedger awarded hours released; Facility.weekly_prime_hours_used recomputed"
          - "waitlist_promotion runs for the freed slot"
      - from: CONFIRMED
        to: RAINED_OUT
        trigger: "system: FieldClosure cascade"
        actor: system
        preconditions: ["a FieldClosure is created ACTIVE with matching facility_id + closure_date and (full-day OR closure interval intersects permit slot)"]
        side_effects:
          - "Invoice rain credit: credit_cents = field_fee_cents + lights_fee_cents + surcharge_cents; total_cents recomputed (= adjustment_cents, typically 0); balance_due_cents recomputed and MAY GO NEGATIVE (credit on account; no automatic refund — money returns only via the cancel waterfall)"
          - "UsageLedger awarded hours released; Facility.weekly_prime_hours_used recomputed"
      - from: RAINED_OUT
        to: CONFIRMED
        trigger: "POST /permits/{id}/reschedule"
        actor: OrgCoordinator | AthleticsAdmin
        preconditions:
          - "expected_permit_version matches permit.version (else ERR_STALE_VERSION)"
          - "permit.rain_reschedule_count < 2 (else ERR_RESCHEDULE_LIMIT_REACHED)"
          - "facility.condition_status != CLOSED (else ERR_FACILITY_CLOSED)"
          - "new_date >= original permit_date and <= original permit_date + 10 days (else ERR_RESCHEDULE_HORIZON_EXCEEDED)"
          - "new slot is not in the past (else ERR_SLOT_IN_PAST)"
          - "no field-slot overlap with other {RESERVED, CONFIRMED} permits (else ERR_SLOT_OVERLAP)"
          - "lights buffer and nightly light block cap pass when lights were approved (else ERR_LIGHTS_BUFFER_OVERLAP)"
          - "prime cap and turf-rest cap pass for the new slot (else ERR_PRIME_CAP_EXCEEDED / ERR_TURF_REST_CAP_EXCEEDED)"
        side_effects:
          - "permit_date/start_minute/end_minute replaced; original_permit_id set to pre-reschedule lineage root (null -> self id of first award lineage root)"
          - "rain_reschedule_count increments; version increments"
          - "fee re-quote: quoted lines recomputed for the new slot and REPLACE the invoice's field/lights/surcharge lines; invoice.credit_cents and adjustment_cents reset to 0 (the rain credit is consumed by the replacement slot); total_cents and balance_due_cents recomputed — the org's earlier payments therefore absorb into the new charges"
          - "UsageLedger awarded hours re-added for the new slot; Facility.weekly_prime_hours_used recomputed"
          - "immediate re-rain: if an ACTIVE FieldClosure already intersects the new slot (same facility, closure_date == new_date, interval overlap), the rain-out cascade fires within the same request and the permit ends in RAINED_OUT (version advanced again) instead of remaining CONFIRMED"
      - from: RAINED_OUT
        to: CANCELLED
        trigger: "POST /permits/{id}/cancel"
        actor: OrgCoordinator | AthleticsAdmin
        preconditions: ["permit.status == RAINED_OUT", "OrgCoordinator must own the permit"]
        side_effects:
          - "rain cancel: penalty_cents = 0 (weather is never the organization's fault)"
          - "deposit waterfall refunds the entire net-paid amount (creates REFUND Payment; PENDING_APPROVAL when > 10000 cents)"
          - "invoice total stays 0; when cleared refunds equal paid_cents and total is 0 the invoice auto-transitions to REFUNDED"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /permits/{id}/mark-no-show"
        actor: FieldSupervisor
        preconditions: ["permit.status == CONFIRMED", "logical clock > permit end datetime (else ERR_NO_SHOW_NOT_YET)", "permit.attendance_minutes is null"]
        side_effects:
          - "StrikeRecord created (strike_points = 10 * new active count); Organization.no_show_strikes_active recomputed; standing re-evaluated (PROBATION at 2, SUSPENDED at >= 3 with revocation cascade)"
          - "Invoice: penalty_cents = deposit_cents; deposit waterfall applies deposit to penalty then balance; remainder of total stays owed"
          - "UsageLedger: awarded hours released, no_show_count increments"
          - "Facility.weekly_prime_hours_used recomputed"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /permits/{id}/settle"
        actor: FieldSupervisor
        preconditions: ["permit.status == CONFIRMED", "permit.attendance_minutes is not null (else ERR_CHECKIN_REQUIRED)", "logical clock > permit end datetime"]
        side_effects:
          - "final-variant fee: final field fee = min(quoted_field_fee, round_half_up(attendance_minutes/60 * hourly_rate)); final lights = min(quoted_lights_fee, ceil(actual_lights_minutes/15) * lights_block_cents); surcharge unchanged"
          - "permit.final_total_cents set; Invoice lines updated; total_cents recomputed; balance_due_cents recomputed"
          - "UsageLedger: awarded hours released, attended_hours += attendance_minutes/60 (integer division)"
          - "Facility.weekly_prime_hours_used recomputed"
      - from: RESERVED
        to: REVOKED
        trigger: "POST /permits/{id}/revoke or suspension cascade"
        actor: AthleticsAdmin | system
        preconditions: ["permit.status == RESERVED", "admin revoke requires fault input; cascade uses ORG_FAULT"]
        side_effects: ["deposit waterfall per fault code", "UsageLedger release", "Facility.weekly_prime_hours_used recomputed", "waitlist_promotion for freed slot"]
      - from: CONFIRMED
        to: REVOKED
        trigger: "POST /permits/{id}/revoke or suspension cascade"
        actor: AthleticsAdmin | system
        preconditions: ["permit.status == CONFIRMED", "admin revoke requires fault input"]
        side_effects:
          - "fault=ORG_FAULT: penalty_cents = deposit_cents (forfeit); fault=ADMIN_DISCRETION: penalty_cents = 0 and all paid amounts refunded"
          - "deposit waterfall; REFUND Payment created when refundable remainder > 0"
          - "UsageLedger release; Facility.weekly_prime_hours_used recomputed; waitlist_promotion"

  - entity: FieldClosure
    field: status
    initial_state: ACTIVE
    terminal_states: [LIFTED]
    transitions:
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /field-closures/{id}/lift"
        actor: FieldSupervisor
        preconditions: ["closure.status == ACTIVE"]
        side_effects: ["version increments; RAINED_OUT permits are NOT reverted (deterministic one-way cascade)"]

  - entity: Invoice
    field: status
    initial_state: DRAFT
    terminal_states: [VOID, REFUNDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /invoices/{id}/issue"
        actor: FinanceClerk
        preconditions: ["invoice.status == DRAFT"]
        side_effects: ["version increments"]
      - from: DRAFT
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: FinanceClerk
        preconditions: ["invoice.status == DRAFT", "paid_cents == 0"]
        side_effects: ["version increments"]
      - from: ISSUED
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: FinanceClerk
        preconditions: ["invoice.status == ISSUED", "paid_cents == 0 (else ERR_INVOICE_HAS_PAYMENTS)"]
        side_effects: ["version increments"]
      - from: PARTIALLY_PAID
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: FinanceClerk
        preconditions: ["paid_cents == 0 (else ERR_INVOICE_HAS_PAYMENTS); note PARTIALLY_PAID implies paid_cents > 0, so this path always fails fiscally — it exists to make ERR_INVOICE_HAS_PAYMENTS reachable"]
        side_effects: ["version increments"]
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "system: a PAYMENT clears with paid_cents < total_cents"
        actor: system
        preconditions: ["payment amount >= 1 and <= balance_due_cents"]
        side_effects: ["paid_cents, balance_due_cents recomputed", "version increments"]
      - from: ISSUED
        to: PAID
        trigger: "system: a PAYMENT clears with paid_cents == total_cents"
        actor: system
        preconditions: ["payment brings balance_due_cents to 0"]
        side_effects: ["paid_cents, balance_due_cents recomputed", "version increments"]
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "system: a PAYMENT clears with balance_due_cents reaching 0"
        actor: system
        preconditions: ["payment amount <= balance_due_cents"]
        side_effects: ["paid_cents, balance_due_cents recomputed", "version increments"]
      - from: PAID
        to: REFUNDED
        trigger: "system: cleared refunds make refunded_cents == paid_cents and total_cents == 0"
        actor: system
        preconditions: ["refund clears fully covering net paid amount and invoice total is 0 (rain credit full)"]
        side_effects: ["refunded_cents, balance_due_cents recomputed", "version increments"]
      - from: PARTIALLY_PAID
        to: REFUNDED
        trigger: "system: cleared refunds make refunded_cents == paid_cents and total_cents == 0"
        actor: system
        preconditions: ["same full-refund condition reached from PARTIALLY_PAID (e.g., rain cancel after deposit-only payment)"]
        side_effects: ["refunded_cents, balance_due_cents recomputed", "version increments"]

  - entity: Payment
    field: status
    initial_state: CLEARED
    terminal_states: [CLEARED]
    transitions:
      - from: PENDING_APPROVAL
        to: CLEARED
        trigger: "POST /payments/{id}/approve"
        actor: AthleticsAdmin
        preconditions: ["payment.kind == REFUND", "payment.status == PENDING_APPROVAL", "X-User-ID != payment.initiated_by (else ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["approved_by set", "Invoice.refunded_cents += amount_cents", "Invoice.balance_due_cents recomputed", "Invoice.status REFUNDED when fully refunded and total 0", "version increments"]
    note: "kind=PAYMENT rows are created directly in CLEARED; kind=REFUND rows are created CLEARED when amount_cents <= 10000, else PENDING_APPROVAL"

  - entity: StrikeRecord
    field: status
    initial_state: ACTIVE
    terminal_states: [RESCINDED]
    transitions:
      - from: ACTIVE
        to: RESCINDED
        trigger: "POST /strike-records/{id}/rescind"
        actor: AthleticsAdmin
        preconditions: ["strike.status == ACTIVE"]
        side_effects: ["Organization.no_show_strikes_active recomputed", "standing re-evaluated (SUSPENDED stays SUSPENDED until admin reinstate; PROBATION -> GOOD when count < 2)"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: permit-reschedule-occ
    parent_entity: Permit
    write_endpoint: "POST /permits/{id}/reschedule"
    occ_field: expected_permit_version
    description: |
      Rescheduling a Permit whose version has advanced since the client last
      observed it is rejected. Successive reschedules are legitimate under the
      product spec (rain date A, then rain date B), so the only thing wrong
      with the stale request is its stale expected_permit_version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: facility-condition-occ
    parent_entity: Facility
    write_endpoint: "POST /facilities/{id}/condition"
    occ_field: expected_facility_version
    description: |
      Recording a condition decision against a Facility whose version has
      advanced since the client last observed it is rejected. Each new decision
      legitimately supersedes the prior assessment, so a stale
      expected_facility_version is the sole defect.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: invoice-adjustment-occ
    parent_entity: Invoice
    write_endpoint: "POST /invoices/{id}/adjustments"
    occ_field: expected_invoice_version
    description: |
      Posting a manual adjustment to an Invoice whose version has advanced
      since the client last observed it is rejected. Successive adjustments
      are legitimate (each adjusts the latest state), so the stale
      expected_invoice_version is the sole defect.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: allocation_priority_score
    trigger: "PermitApplication submission (provisional variant) and allocation run (final variant)"
    algorithm: weighted_scoring
    formula: |
      base = 80 if classification == RESIDENT; 45 if NONRESIDENT; 25 if COMMERCIAL
      type_mod = +15 YOUTH_LEAGUE; +12 SCHOOL; +6 ADULT_LEAGUE; 0 CORPORATE; -5 TOURNAMENT_OPERATOR
      loyalty = min(LOYALTY_CAP, LOYALTY_PER_SEASON * organization.prior_seasons_active)
      prior_ledgers = UsageLedger rows for org with season_code != current season, ordered by season_code DESC
      util = attended_hours / (awarded_prime_hours + awarded_nonprime_hours + attended_hours) of the most recent
             prior ledger that has any awarded history; util is null when no prior ledger exists
      util_bonus = 10 if util >= 0.80; 5 if util >= 0.60; 0 otherwise (including null)
      strike_penalty = STRIKE_PENALTY_POINTS * organization.no_show_strikes_active
      event_mod = +8 LEAGUE_GAME; +4 LEAGUE_PRACTICE; -10 TOURNAMENT; 0 SPECIAL_EVENT
      score = max(0, base + type_mod + loyalty + util_bonus - strike_penalty + event_mod)
    input_set: "Organization (classification, org_type, prior_seasons_active, no_show_strikes_active), most recent prior-season UsageLedger, application event_type"
    constants:
      LOYALTY_CAP: 12
      LOYALTY_PER_SEASON: 3
      STRIKE_PENALTY_POINTS: 12
      UTIL_BONUS_HIGH: 10
      UTIL_BONUS_LOW: 5
    precision: "integer arithmetic; utilization compared as exact rational (attended*100 >= 80*total)"
    variants:
      - name: provisional
        when: "computed at POST /permit-applications; snapshot stored on application.provisional_score using organization counters live at submission time"
        difference: "uses strike count and loyalty as of submission instant"
      - name: final_run
        when: "computed at POST /allocation-windows/{id}/run-allocation; stored on application.final_score"
        difference: "recomputed with organization counters frozen at run time; a strike landing between submission and run changes final_run but not provisional"

  - name: permit_fee_quote
    trigger: "Permit award (allocation run or waitlist promotion), reschedule re-quote"
    algorithm: tiered_pricing
    formula: |
      # PINNED evaluation order: round each line independently, then sum. Never sum raw values then round.
      duration_min = end_minute - start_minute
      if event_type == TOURNAMENT and duration_min >= schedule.tournament_day_min_minutes:
        raw_field = schedule.tournament_day_cents            # flat day rate REPLACES hourly
      else:
        rate = schedule.hourly_resident_cents | hourly_nonresident_cents | hourly_commercial_cents by org.classification
        raw_field = duration_min * rate / 60               # rational arithmetic
      field_fee = round_half_up(raw_field)
      lights_blocks = ceil(lights_minutes_quoted / 15)     # lights_minutes_quoted = duration when lights_approved else 0
      lights_fee = lights_blocks * schedule.lights_block_cents
      surcharge_pct = nonresident_surcharge_pct if NONRESIDENT; commercial_surcharge_pct if COMMERCIAL; 0 if RESIDENT
      surcharge = round_half_up(field_fee * surcharge_pct / 100)   # computed on the ROUNDED field line
      quoted_total_cents = field_fee + lights_fee + surcharge
      deposit_required_cents = min(quoted_total_cents, max(schedule.min_deposit_cents, round_half_up(quoted_total_cents * schedule.deposit_pct / 100)))
    input_set: "Permit slot (duration, event_type, lights_approved), Organization.classification, pinned FeeSchedule rates"
    constants: {}
    precision: "integer cents; round_half_up per line BEFORE summing (per-line-then-sum pinned; sum-then-round is a known wrong variant producing different cents, e.g. NONRESIDENT 45 min at 3250/hr: 2804 vs 2803)"
    variants:
      - name: provisional
        when: "at award and reschedule; uses requested slot duration and lights_minutes_quoted"
        difference: "bills the full requested slot"
      - name: final_settlement
        when: "at POST /permits/{id}/settle (COMPLETED); uses attendance_minutes and actual_lights_minutes"
        difference: "final field fee = min(quoted_field_fee, round_half_up(attendance_minutes * rate / 60)); final lights fee = min(quoted_lights_fee, ceil(actual_lights_minutes/15) * block rate); surcharge line unchanged from provisional; can diverge downward from provisional for identical schedule rates"

  - name: cancellation_penalty
    trigger: "POST /permits/{id}/cancel from CONFIRMED"
    algorithm: threshold
    formula: |
      notice_hours = (permit start datetime) - (current logical clock), in whole hours (floor)
      tier_pct = 0 if notice_hours >= 168; 15 if >= 48; 30 if >= 24; 50 otherwise
      penalty_cents = round_half_up(quoted_total_cents_at_cancel_time * tier_pct / 100)
      # PINNED order: penalty is computed against the PRE-CANCEL quoted total; then invoice.total_cents
      # is REPLACED by penalty_cents; then the deposit waterfall runs. Never the reverse.
    input_set: "Permit quoted_total_cents at cancel time; logical clock"
    constants:
      TIER_FREE_HOURS: 168
      TIER_LOW_HOURS: 48
      TIER_MID_HOURS: 24
      TIER_LOW_PCT: 15
      TIER_MID_PCT: 30
      TIER_HIGH_PCT: 50
    precision: "integer cents, round_half_up"
    variants: []

  - name: deposit_disposition_waterfall
    trigger: "permit closeout: cancel, no-show, revoke (both fault codes), rain-out credit settlement"
    algorithm: waterfall_allocation
    formula: |
      deposit_held = min(invoice.paid_cents - invoice.refunded_cents, invoice.deposit_cents)  # portion of net payments attributable to deposit
      bucket1 penalty:      deposit_penalty_applied_cents = min(deposit_held, invoice.penalty_cents)
      bucket2 balance:      deposit_balance_applied_cents = min(deposit_held - bucket1, max(0, invoice.total_cents - invoice.penalty_cents))
      bucket3 refund:       deposit_refunded_cents = deposit_held - bucket1 - bucket2
      if deposit_refunded_cents > 0: create REFUND Payment of that amount
      # CONSERVED INVARIANT (money): at every closeout,
      #   deposit_held == deposit_penalty_applied_cents + deposit_balance_applied_cents + deposit_refunded_cents
    input_set: "Invoice (deposit_cents, paid_cents, refunded_cents, penalty_cents, total_cents)"
    constants:
      REFUND_AUTO_APPROVE_MAX_CENTS: 10000
    precision: "integer cents"
    variants: []

  - name: prime_hours_allocation_cap
    trigger: "allocation run decision and reschedule precondition"
    algorithm: threshold
    formula: |
      prime_hours(slot) = duration_hours if start_minute >= PRIME_START_MINUTE else 0   # integer hours; durations are whole hours in this system
      would_be = UsageLedger(org, season).awarded_prime_hours + prime_hours(new slot)
      ALLOWED  iff would_be <= window.prime_cap_hours_per_org      # INCLUSIVE boundary: exactly at cap is allowed
      else application -> WAITLISTED (decision_note PRIME_CAP) / reschedule -> ERR_PRIME_CAP_EXCEEDED
    input_set: "UsageLedger.awarded_prime_hours for org+season, new slot start/duration, window cap"
    constants:
      PRIME_START_MINUTE: 1020
    precision: "integer hours"
    variants: []

  - name: turf_rest_weekly_load
    trigger: "allocation run decision, reschedule precondition, and recomputed on every permit mutation"
    algorithm: aggregation
    formula: |
      weekly_load(week W) = sum of prime hours over Permits of this facility
        in {RESERVED, CONFIRMED} whose permit_date falls inside Monday-Sunday week W
      facility.weekly_prime_hours_used (display field) = weekly_load(week containing the logical clock date)
      cap check is against the CANDIDATE SLOT's week:
        award/reschedule ALLOWED iff weekly_load(week of new slot) + prime_hours(new slot) <= facility.weekly_prime_hour_cap
      # INCLUSIVE boundary; exceeding -> WAITLISTED (run) or ERR_TURF_REST_CAP_EXCEEDED (reschedule)
    input_set: "Permits of facility in {RESERVED, CONFIRMED} for the candidate slot's week"
    constants:
      PRIME_START_MINUTE: 1020
    precision: "integer hours"
    variants: []

  - name: lights_grid_conflict_and_cap
    trigger: "allocation run lights approval, reschedule precondition"
    algorithm: interval_merge
    formula: |
      lights window of a permit = [start_minute, end_minute) when lights would be approved
      BUFFER rule: two lights windows on the same facility+date conflict iff gap < LIGHTS_BUFFER_MINUTES,
        i.e. |b.start - a.end| < 30 when a ends before b starts (and symmetrically); a gap of EXACTLY 30 is allowed
      nightly cap: total approved light blocks per facility+date = sum(ceil(lights_minutes/15)) over permits with
        lights_approved=true; new approval allowed iff blocks_after <= facility.nightly_light_block_cap (inclusive)
      on conflict or cap breach at award time: permit is still AWARDED but lights_approved = false
      on conflict at reschedule time: ERR_LIGHTS_BUFFER_OVERLAP
    input_set: "Permits on facility+date with lights_approved=true in {RESERVED, CONFIRMED}, candidate slot"
    constants:
      LIGHTS_BUFFER_MINUTES: 30
      BLOCK_MINUTES: 15
    precision: "integer minutes/blocks"
    variants: []

  - name: allocation_run
    trigger: "POST /allocation-windows/{id}/run-allocation"
    algorithm: topological
    formula: |
      candidates = PermitApplications of window in UNDER_REVIEW
      order: final_score DESC, tie-break submitted order (created_at ASC), then application.created_at ASC
      for each application in order:
        if organization.standing == SUSPENDED: DENIED (decision_note ORG_SUSPENDED); continue
        if field-slot overlap with any already-AWARDED-this-run or existing {RESERVED, CONFIRMED} permit
           on same facility+date (half-open [start,end): adjacency end==start is NOT overlap):
           WAITLISTED (decision_note SLOT_CONFLICT); continue
        if prime cap would be exceeded: WAITLISTED (PRIME_CAP); continue
        if turf-rest weekly cap would be exceeded: WAITLISTED (TURF_REST_CAP); continue
        if event_type == TOURNAMENT and org's season TOURNAMENT day count + 1 > window.max_tournament_days_per_org:
           WAITLISTED (TOURNAMENT_CAP); continue
        AWARDED: create Permit(RESERVED, fee_schedule_id = currently PUBLISHED schedule),
                 Invoice(DRAFT) with provisional quote lines + deposit snapshot,
                 lights_approved per lights_grid_conflict_and_cap,
                 UsageLedger row created on first award for (org, season) and awarded_*_hours incremented
      waitlist_promotion (on cancel/revoke freeing a slot): candidates = WAITLISTED applications of the SAME
        window with same facility_id and event_date; rank final_score DESC, created_at ASC; first candidate whose
        slot fits the freed interval with all caps re-checked is promoted (AWARDED); empty pool -> no-op
    input_set: "UNDER_REVIEW applications of the window; existing permits; ledgers; facility caps"
    constants: {}
    precision: "integer scores"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and non-empty", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2, category: existence, check: "Request body well-formed; all required input fields present; enum values valid; integer ranges valid", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all POST endpoints" }
  - { priority: 3, category: auth, check: "Role is permitted to call this endpoint per §1.5 roles", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 4, category: auth, check: "OrgCoordinator ownership: X-User-ID equals the organization_id of the target resource (application, permit)", error_id: ERR_FORBIDDEN_ORG_OWNERSHIP, http_status: 403, applies_to: "POST /permit-applications/{id}/withdraw, POST /permit-applications/{id}/respond, POST /permits/{id}/confirm, POST /permits/{id}/cancel, POST /permits/{id}/reschedule" }
  - { priority: 5, category: existence, check: "Path ids exist, validated left-to-right", error_id: "ERR_ORGANIZATION_NOT_FOUND | ERR_FACILITY_NOT_FOUND | ERR_FEE_SCHEDULE_NOT_FOUND | ERR_WINDOW_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_PERMIT_NOT_FOUND | ERR_CLOSURE_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_PAYMENT_NOT_FOUND | ERR_STRIKE_NOT_FOUND", http_status: 404, applies_to: "all endpoints with path ids" }
  - { priority: 6, category: auth, check: "Segregation of duties: refund approver X-User-ID must differ from Payment.initiated_by", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /payments/{id}/approve" }
  - { priority: 7, category: state, check: "Target entity in a valid from-state for the transition (permit/application/window/invoice/closure/schedule/payment/strike state machines; ERR_ORG_SUSPENDED for org standing gates)", error_id: "ERR_INVALID_PERMIT_STATE | ERR_INVALID_APPLICATION_STATE | ERR_INVALID_WINDOW_STATE | ERR_INVALID_INVOICE_STATE | ERR_INVALID_CLOSURE_STATE | ERR_INVALID_SCHEDULE_STATE | ERR_INVALID_PAYMENT_STATE | ERR_INVALID_STRIKE_STATE | ERR_ORG_SUSPENDED", http_status: 409, applies_to: "all state-transition endpoints" }
  - { priority: 8, category: business_safety, check: "Facility condition gate: facility.condition_status == CLOSED blocks new applications naming it and reschedules onto it; headcount must be <= facility.capacity", error_id: "ERR_FACILITY_CLOSED | ERR_HEADCOUNT_EXCEEDS_CAPACITY", http_status: 409, applies_to: "POST /permit-applications, POST /permits/{id}/reschedule" }
  - { priority: 9, category: business_temporal, check: "Temporal gates: window OPEN for applications; open not before opens_at; slot not in the past; reschedule horizon (new_date within original+10 days); no-show only after slot end; check-in only within [start-30min, end]", error_id: "ERR_WINDOW_NOT_OPEN | ERR_WINDOW_NOT_YET_OPEN | ERR_SLOT_IN_PAST | ERR_RESCHEDULE_HORIZON_EXCEEDED | ERR_NO_SHOW_NOT_YET | ERR_CHECKIN_WINDOW_CLOSED", http_status: 409, applies_to: "window open, application create, reschedule, mark-no-show, check-in" }
  - { priority: 10, category: business_constraint, check: "Constraint gates: half-open slot overlap; lights 30-minute buffer; nightly light block cap; prime-hours cap; turf-rest weekly cap; tournament-day cap; reschedule count cap; duration bounds (30..480)", error_id: "ERR_SLOT_OVERLAP | ERR_LIGHTS_BUFFER_OVERLAP | ERR_PRIME_CAP_EXCEEDED | ERR_TURF_REST_CAP_EXCEEDED | ERR_RESCHEDULE_LIMIT_REACHED | ERR_INVALID_TIME_RANGE", http_status: 409, applies_to: "allocation run, reschedule, application create (duration), closures (interval validity)" }
  - { priority: 11, category: business_fiscal, check: "Fiscal gates: deposit paid before confirm; payment amount <= balance_due_cents; refund amount <= paid_cents - refunded_cents; void requires zero payments; adjustments only on ISSUED/PARTIALLY_PAID", error_id: "ERR_DEPOSIT_NOT_PAID | ERR_PAYMENT_EXCEEDS_BALANCE | ERR_REFUND_EXCEEDS_PAID | ERR_INVOICE_HAS_PAYMENTS", http_status: 422, applies_to: "confirm, payments, refunds, void, adjustments" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/_clock/set_current_utc", description: "Test-driving logical clock. Server default before any call is exactly 2026-08-01T00:00:00Z (never wall-clock). All deadline/window/no-show/cancel-tier comparisons read this clock.", roles: [AthleticsAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: [] }

  - { method: POST, path: "/organizations", description: "Register an organization", roles: [AthleticsAdmin], code: 201, input: [name, classification, org_type, "prior_seasons_active?"], output: Organization, side_effects: ["standing=GOOD, no_show_strikes_active=0"] }
  - { method: GET, path: "/organizations/{id}", description: "Get an organization", roles: [AthleticsAdmin, FieldSupervisor, OrgCoordinator, FinanceClerk], code: 200, input: [], output: Organization, side_effects: [] }
  - { method: POST, path: "/organizations/{id}/reinstate", description: "SUSPENDED -> PROBATION", roles: [AthleticsAdmin], code: 200, input: [], output: Organization, side_effects: ["standing transition", "version increments"] }

  - { method: POST, path: "/facilities", description: "Register a facility", roles: [AthleticsAdmin], code: 201, input: [name, facility_class, has_lights, capacity, weekly_prime_hour_cap, nightly_light_block_cap], output: Facility, side_effects: ["condition_status=OPEN", "weekly_prime_hours_used=0"] }
  - { method: GET, path: "/facilities/{id}", description: "Get a facility", roles: [AthleticsAdmin, FieldSupervisor, OrgCoordinator, FinanceClerk], code: 200, input: [], output: Facility, side_effects: [] }
  - { method: POST, path: "/facilities/{id}/condition", description: "Record a condition decision (OPEN/LIMITED/CLOSED); OCC-guarded", roles: [FieldSupervisor], code: 200, input: [condition_status, reason, expected_facility_version], output: Facility, side_effects: ["condition_status set", "condition_reason set", "increments Facility.version by 1"] }

  - { method: POST, path: "/fee-schedules", description: "Create a fee schedule (DRAFT)", roles: [AthleticsAdmin], code: 201, input: [name, effective_from, hourly_resident_cents, hourly_nonresident_cents, hourly_commercial_cents, lights_block_cents, nonresident_surcharge_pct, commercial_surcharge_pct, tournament_day_cents, tournament_day_min_minutes, deposit_pct, min_deposit_cents], output: FeeSchedule, side_effects: [] }
  - { method: GET, path: "/fee-schedules/{id}", description: "Get a fee schedule", roles: [AthleticsAdmin, FieldSupervisor, OrgCoordinator, FinanceClerk], code: 200, input: [], output: FeeSchedule, side_effects: [] }
  - { method: POST, path: "/fee-schedules/{id}/publish", description: "Publish a DRAFT schedule; supersedes the currently PUBLISHED one", roles: [AthleticsAdmin], code: 200, input: [], output: FeeSchedule, side_effects: ["DRAFT -> PUBLISHED", "prior PUBLISHED -> SUPERSEDED", "version increments"] }

  - { method: POST, path: "/allocation-windows", description: "Create an allocation window (SCHEDULED)", roles: [AthleticsAdmin], code: 201, input: [season_code, opens_at, closes_at, prime_cap_hours_per_org, max_tournament_days_per_org], output: AllocationWindow, side_effects: [] }
  - { method: GET, path: "/allocation-windows/{id}", description: "Get a window", roles: [AthleticsAdmin, FieldSupervisor, OrgCoordinator, FinanceClerk], code: 200, input: [], output: AllocationWindow, side_effects: [] }
  - { method: POST, path: "/allocation-windows/{id}/open", description: "SCHEDULED -> OPEN", roles: [AthleticsAdmin], code: 200, input: [], output: AllocationWindow, side_effects: ["status OPEN", "version increments"] }
  - { method: POST, path: "/allocation-windows/{id}/close", description: "OPEN -> CLOSED; SUBMITTED applications -> UNDER_REVIEW", roles: [AthleticsAdmin], code: 200, input: [], output: AllocationWindow, side_effects: ["application sweep to UNDER_REVIEW", "version increments"] }
  - { method: POST, path: "/allocation-windows/{id}/run-allocation", description: "CLOSED -> ALLOCATED; scores and decides all UNDER_REVIEW applications", roles: [AthleticsAdmin], code: 200, input: [], output: AllocationWindow, side_effects: ["allocation_run calculation", "permits + invoices created for AWARDED", "ledger updates", "version increments"] }

  - { method: POST, path: "/permit-applications", description: "Submit an application into an OPEN window; organization_id from X-User-ID", roles: [OrgCoordinator], code: 201, input: [window_id, facility_id, event_date, start_minute, end_minute, event_type, "wants_lights?", headcount], output: PermitApplication, side_effects: ["provisional_score snapshot", "status SUBMITTED"] }
  - { method: GET, path: "/permit-applications", description: "List applications with filters", roles: [AthleticsAdmin, FieldSupervisor, OrgCoordinator, FinanceClerk], code: 200, input: ["limit?", "offset?", "window_id?", "organization_id?", "facility_id?", "status?"], output: "PermitApplication[]", side_effects: [] }
  - { method: GET, path: "/permit-applications/{id}", description: "Get an application", roles: [AthleticsAdmin, FieldSupervisor, OrgCoordinator, FinanceClerk], code: 200, input: [], output: PermitApplication, side_effects: [] }
  - { method: POST, path: "/permit-applications/{id}/withdraw", description: "SUBMITTED/UNDER_REVIEW/NEEDS_INFO/WAITLISTED -> WITHDRAWN", roles: [OrgCoordinator], code: 200, input: [], output: PermitApplication, side_effects: ["status WITHDRAWN", "version increments"] }
  - { method: POST, path: "/permit-applications/{id}/request-info", description: "UNDER_REVIEW -> NEEDS_INFO", roles: [AthleticsAdmin], code: 200, input: [note], output: PermitApplication, side_effects: ["decision_note set", "version increments"] }
  - { method: POST, path: "/permit-applications/{id}/respond", description: "NEEDS_INFO -> UNDER_REVIEW (info loop)", roles: [OrgCoordinator], code: 200, input: [response_note], output: PermitApplication, side_effects: ["status UNDER_REVIEW", "version increments"] }

  - { method: GET, path: "/permits", description: "List permits with filters", roles: [AthleticsAdmin, FieldSupervisor, OrgCoordinator, FinanceClerk], code: 200, input: ["limit?", "offset?", "organization_id?", "facility_id?", "application_id?", "fee_schedule_id?", "original_permit_id?", "permit_date?", "status?"], output: "Permit[]", side_effects: [] }
  - { method: GET, path: "/permits/{id}", description: "Get a permit", roles: [AthleticsAdmin, FieldSupervisor, OrgCoordinator, FinanceClerk], code: 200, input: [], output: Permit, side_effects: [] }
  - { method: POST, path: "/permits/{id}/confirm", description: "RESERVED -> CONFIRMED; requires invoice ISSUED+ with paid_cents >= deposit_cents and org not SUSPENDED", roles: [OrgCoordinator], code: 200, input: [], output: Permit, side_effects: ["status CONFIRMED", "version increments"] }
  - { method: POST, path: "/permits/{id}/cancel", description: "RESERVED/CONFIRMED/RAINED_OUT -> CANCELLED with notice-tier penalty (0% from RESERVED or RAINED_OUT) and deposit waterfall; promotes waitlist when a confirmed slot frees", roles: [OrgCoordinator, AthleticsAdmin], code: 200, input: [], output: Permit, side_effects: ["cancellation_penalty", "deposit_disposition_waterfall", "ledger release", "waitlist_promotion", "version increments"] }
  - { method: POST, path: "/permits/{id}/check-in", description: "Record attendance for a CONFIRMED permit within [start-30min, end]; attended_minutes must be in 15..slot duration", roles: [FieldSupervisor], code: 200, input: [attended_minutes], output: Permit, side_effects: ["attendance_minutes set", "version increments"] }
  - { method: POST, path: "/permits/{id}/mark-no-show", description: "CONFIRMED -> NO_SHOW after slot end with no check-in; strike cascade", roles: [FieldSupervisor], code: 200, input: [], output: Permit, side_effects: ["StrikeRecord created", "standing re-evaluated", "deposit forfeited to penalty", "ledger release", "version increments"] }
  - { method: POST, path: "/permits/{id}/reschedule", description: "RAINED_OUT -> CONFIRMED onto a new date/slot within horizon; OCC-guarded; re-quotes fees", roles: [OrgCoordinator, AthleticsAdmin], code: 200, input: [new_date, new_start_minute, new_end_minute, expected_permit_version], output: Permit, side_effects: ["re-quote", "invoice adjustment delta", "ledger re-add", "rain_reschedule_count increments", "increments Permit.version by 1"] }
  - { method: POST, path: "/permits/{id}/revoke", description: "RESERVED/CONFIRMED -> REVOKED; fault=ORG_FAULT forfeits deposit, ADMIN_DISCRETION refunds fully", roles: [AthleticsAdmin], code: 200, input: [fault], output: Permit, side_effects: ["deposit waterfall per fault", "ledger release", "waitlist_promotion", "version increments"] }
  - { method: POST, path: "/permits/{id}/settle", description: "CONFIRMED + checked-in -> COMPLETED after slot end; final-variant fee settlement", roles: [FieldSupervisor], code: 200, input: ["actual_lights_minutes?"], output: Permit, side_effects: ["final fee variant", "invoice line updates", "attended_hours update", "version increments"] }

  - { method: POST, path: "/field-closures", description: "Create a closure (full-day when start/end omitted); cascades rain-out to intersecting RESERVED/CONFIRMED permits", roles: [FieldSupervisor], code: 201, input: [facility_id, closure_date, "start_minute?", "end_minute?", reason], output: FieldClosure, side_effects: ["rain-out cascade", "invoice credits", "refund payments", "ledger releases"] }
  - { method: GET, path: "/field-closures", description: "List closures with filters", roles: [AthleticsAdmin, FieldSupervisor, OrgCoordinator, FinanceClerk], code: 200, input: ["limit?", "offset?", "facility_id?", "closure_date?", "status?"], output: "FieldClosure[]", side_effects: [] }
  - { method: GET, path: "/field-closures/{id}", description: "Get a closure", roles: [AthleticsAdmin, FieldSupervisor, OrgCoordinator, FinanceClerk], code: 200, input: [], output: FieldClosure, side_effects: [] }
  - { method: POST, path: "/field-closures/{id}/lift", description: "ACTIVE -> LIFTED; does not revert rained-out permits", roles: [FieldSupervisor], code: 200, input: [], output: FieldClosure, side_effects: ["status LIFTED", "version increments"] }

  - { method: GET, path: "/invoices", description: "List invoices with filters", roles: [AthleticsAdmin, FieldSupervisor, OrgCoordinator, FinanceClerk], code: 200, input: ["limit?", "offset?", "organization_id?", "permit_id?", "status?"], output: "Invoice[]", side_effects: [] }
  - { method: GET, path: "/invoices/{id}", description: "Get an invoice", roles: [AthleticsAdmin, FieldSupervisor, OrgCoordinator, FinanceClerk], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: POST, path: "/invoices/{id}/issue", description: "DRAFT -> ISSUED", roles: [FinanceClerk], code: 200, input: [], output: Invoice, side_effects: ["status ISSUED", "version increments"] }
  - { method: POST, path: "/invoices/{id}/void", description: "DRAFT/ISSUED/PARTIALLY_PAID -> VOID only when paid_cents == 0 (PARTIALLY_PAID therefore always fails with ERR_INVOICE_HAS_PAYMENTS)", roles: [FinanceClerk], code: 200, input: [], output: Invoice, side_effects: ["status VOID", "version increments"] }
  - { method: POST, path: "/invoices/{id}/payments", description: "Record a cleared payment (amount <= balance_due)", roles: [FinanceClerk], code: 201, input: [amount_cents, method], output: Payment, side_effects: ["Payment CLEARED created", "invoice paid_cents/balance_due_cents recomputed", "invoice status may advance to PARTIALLY_PAID/PAID"] }
  - { method: POST, path: "/invoices/{id}/refunds", description: "Create a refund; > 10000 cents starts PENDING_APPROVAL", roles: [FinanceClerk], code: 201, input: [amount_cents, reason], output: Payment, side_effects: ["Payment REFUND created (CLEARED or PENDING_APPROVAL)", "cleared refunds update refunded_cents and balance_due_cents"] }
  - { method: POST, path: "/invoices/{id}/adjustments", description: "Manual signed adjustment line; OCC-guarded; ISSUED/PARTIALLY_PAID only", roles: [FinanceClerk], code: 200, input: [delta_cents, note, expected_invoice_version], output: Invoice, side_effects: ["adjustment_cents += delta", "total_cents and balance_due_cents recomputed", "increments Invoice.version by 1"] }

  - { method: GET, path: "/payments", description: "List payments with filters", roles: [AthleticsAdmin, FieldSupervisor, OrgCoordinator, FinanceClerk], code: 200, input: ["limit?", "offset?", "invoice_id?", "organization_id?", "kind?", "status?"], output: "Payment[]", side_effects: [] }
  - { method: GET, path: "/payments/{id}", description: "Get a payment", roles: [AthleticsAdmin, FieldSupervisor, OrgCoordinator, FinanceClerk], code: 200, input: [], output: Payment, side_effects: [] }
  - { method: POST, path: "/payments/{id}/approve", description: "Approve a PENDING_APPROVAL refund; approver must differ from initiator", roles: [AthleticsAdmin], code: 200, input: [], output: Payment, side_effects: ["refund CLEARED", "invoice refunded_cents/balance recomputed", "approved_by set"] }

  - { method: GET, path: "/strike-records", description: "List strikes with filters; results ordered by created_at ASC (stable for indexed reads)", roles: [AthleticsAdmin, FieldSupervisor, OrgCoordinator, FinanceClerk], code: 200, input: ["limit?", "offset?", "organization_id?", "permit_id?", "status?"], output: "StrikeRecord[]", side_effects: [] }
  - { method: GET, path: "/strike-records/{id}", description: "Get a strike", roles: [AthleticsAdmin, FieldSupervisor, OrgCoordinator, FinanceClerk], code: 200, input: [], output: StrikeRecord, side_effects: [] }
  - { method: POST, path: "/strike-records/{id}/rescind", description: "ACTIVE -> RESCINDED; recomputes org strike count and standing", roles: [AthleticsAdmin], code: 200, input: [], output: StrikeRecord, side_effects: ["standing re-evaluated (PROBATION -> GOOD when active count < 2)"] }

  - { method: GET, path: "/usage-ledgers", description: "List usage ledgers with filters", roles: [AthleticsAdmin, FieldSupervisor, OrgCoordinator, FinanceClerk], code: 200, input: ["limit?", "offset?", "organization_id?", "season_code?"], output: "UsageLedger[]", side_effects: [] }
  - { method: GET, path: "/usage-ledgers/{id}", description: "Get a usage ledger", roles: [AthleticsAdmin, FieldSupervisor, OrgCoordinator, FinanceClerk], code: 200, input: [], output: UsageLedger, side_effects: [] }

