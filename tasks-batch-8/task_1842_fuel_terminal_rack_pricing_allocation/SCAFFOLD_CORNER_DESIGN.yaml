scaffold_corner_design:
  # ==================================================================
  # Section: entities — creation, retrieval, defaults, type constraints
  # ==================================================================
  - section: entities
    instances:
      - name: terminal_creation_with_required_fields_returns_201
        claim_type: creation
        grounds: [entities.Terminal]
        distinguishing_aspect: "POST /rack/terminals with all required input fields returns 201 and Terminal with server-minted id, version=1, rack_status=OPEN default."
        test_recipe:
          setup: ["Empty DB; logical clock default"]
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /rack/terminals", payload: { terminal_code: "OKC-01", legal_name: "OKC Terminal", state_code: "OK", county_code: "40109", city_code: "OKC" }, as: PlatformAdmin, captures: { t_id: $.data.id, t_status: $.data.rack_status, t_v: $.data.version } }
          assert:
            - "Terminal.${t_id}.rack_status == OPEN"
            - "Terminal.${t_id}.version == 1"
            - "Terminal.${t_id}.inventory_gallons == 0"
            - "Terminal.${t_id}.daily_allocation_pool_gallons == 0"

      - name: product_is_brandable_default_false_when_omitted
        claim_type: defaults
        grounds: [entities.Product.fields.is_brandable]
        distinguishing_aspect: "When is_brandable is omitted at product creation, default false applies."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /rack/products", payload: { product_code: "REG87", display_name: "Regular", product_family: "GASOLINE" }, as: PlatformAdmin, captures: { p_id: $.data.id, p_brand: $.data.is_brandable } }
          assert:
            - "Product.${p_id}.is_brandable == false"

      - name: customer_credit_status_initial_good
        claim_type: initial_state
        grounds: [entities.Customer.fields.credit_status, state_machines.Customer]
        distinguishing_aspect: "Newly created customer has credit_status=GOOD and open_lifting_exposure_cents=0."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /rack/customers", payload: { customer_code: "C", legal_name: "C", credit_limit_cents: 500000 }, as: PlatformAdmin, captures: { c_id: $.data.id, c_status: $.data.credit_status, c_expo: $.data.open_lifting_exposure_cents } }
          assert:
            - "Customer.${c_id}.credit_status == GOOD"
            - "Customer.${c_id}.open_lifting_exposure_cents == 0"

      - name: terminal_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with non-existent UUID returns ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /rack/terminals/00000000-0000-0000-0000-000000000000", payload: {}, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_NOT_FOUND"

      - name: terminal_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, entities.Terminal]
        distinguishing_aspect: "GET /rack/terminals returns pagination_fields (limit, offset, total_count, has_more) with declared defaults."
        test_recipe:
          setup: ["Two terminals created"]
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals", payload: { terminal_code: "T1", legal_name: "T1", state_code: "TX", county_code: "48201", city_code: "HOU" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals", payload: { terminal_code: "T2", legal_name: "T2", state_code: "TX", county_code: "48201", city_code: "HOU" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /rack/terminals", payload: {}, as: PlatformAdmin }
          assert:
            - "response contains meta.api_request_id and meta.api_request_timestamp"
            - "response.response_type == 'array'"
            - "response.data is an array of length 2"

      - name: terminal_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Terminal]
        distinguishing_aspect: "Client-supplied id, created_at, version in POST /rack/terminals payload are ignored; server mints its own."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /rack/terminals", payload: { terminal_code: "T", legal_name: "T", state_code: "TX", county_code: "48201", city_code: "HOU", id: "00000000-1111-1111-1111-111111111111", version: 99 }, as: PlatformAdmin, captures: { t_id: $.data.id, t_v: $.data.version } }
          assert:
            - "Terminal.${t_id}.id != '00000000-1111-1111-1111-111111111111'"
            - "Terminal.${t_id}.version == 1"

      - name: exchange_agreement_initial_state_proposed
        claim_type: initial_state
        grounds: [state_machines.ExchangeAgreement]
        distinguishing_aspect: "Newly created ExchangeAgreement has status=PROPOSED and delivered_this_month_gallons=0."
        test_recipe:
          setup: ["Terminal and Product exist"]
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals", payload: { terminal_code: "T", legal_name: "T", state_code: "TX", county_code: "48201", city_code: "HOU" }, as: PlatformAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /rack/products", payload: { product_code: "ULSD", display_name: "D", product_family: "DIESEL", is_brandable: false }, as: PlatformAdmin, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /rack/exchange-agreements", payload: { delivering_terminal_id: "${t_id}", receiving_supplier_code: "EXT-1", product_id: "${p_id}", monthly_exchange_cap_gallons: 100000 }, as: ExchangeCoordinator, captures: { ea_id: $.data.id, ea_status: $.data.status } }
          assert:
            - "ExchangeAgreement.${ea_id}.status == PROPOSED"
            - "ExchangeAgreement.${ea_id}.delivered_this_month_gallons == 0"

  # ==================================================================
  # Section: state_machines — valid/invalid transitions, side effects
  # ==================================================================
  - section: state_machines
    instances:
      - name: terminal_freeze_from_frozen_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Terminal.transitions, "errors[ERR_TERMINAL_NOT_OPEN]"]
        distinguishing_aspect: "Freeze on already-FROZEN terminal is rejected; rack_status remains FROZEN."
        test_recipe:
          setup: ["Terminal exists and is FROZEN"]
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals", payload: { terminal_code: "T", legal_name: "T", state_code: "TX", county_code: "48201", city_code: "HOU" }, as: PlatformAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /rack/terminals/${t_id}/freeze", payload: {}, as: TerminalOperator }
          trigger:
            - { call: "POST /rack/terminals/${t_id}/freeze", payload: {}, as: TerminalOperator, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_TERMINAL_NOT_OPEN"
            - "Terminal.${t_id}.rack_status remains FROZEN"

      - name: terminal_unfreeze_from_open_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Terminal.transitions, "errors[ERR_TERMINAL_NOT_FROZEN]"]
        distinguishing_aspect: "Unfreeze on OPEN terminal is rejected with ERR_TERMINAL_NOT_FROZEN."
        test_recipe:
          setup: ["Terminal exists and is OPEN"]
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals", payload: { terminal_code: "T", legal_name: "T", state_code: "TX", county_code: "48201", city_code: "HOU" }, as: PlatformAdmin, captures: { t_id: $.data.id } }
          trigger:
            - { call: "POST /rack/terminals/${t_id}/unfreeze", payload: {}, as: TerminalOperator, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_TERMINAL_NOT_FROZEN"

      - name: exchange_agreement_suspend_reinstate_round_trip
        claim_type: valid_transition
        grounds: [state_machines.ExchangeAgreement.ACTIVE_to_SUSPENDED, state_machines.ExchangeAgreement.SUSPENDED_to_ACTIVE]
        distinguishing_aspect: "ExchangeAgreement supports ACTIVE↔SUSPENDED loop (cyclic behavior on this dimension)."
        test_recipe:
          setup: ["Active ExchangeAgreement exists"]
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals", payload: { terminal_code: "T", legal_name: "T", state_code: "TX", county_code: "48201", city_code: "HOU" }, as: PlatformAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /rack/products", payload: { product_code: "ULSD", display_name: "D", product_family: "DIESEL", is_brandable: false }, as: PlatformAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /rack/exchange-agreements", payload: { delivering_terminal_id: "${t_id}", receiving_supplier_code: "EXT-1", product_id: "${p_id}", monthly_exchange_cap_gallons: 100000 }, as: ExchangeCoordinator, captures: { ea_id: $.data.id } }
            - { call: "POST /rack/exchange-agreements/${ea_id}/activate", payload: {}, as: ExchangeCoordinator }
          trigger:
            - { call: "POST /rack/exchange-agreements/${ea_id}/suspend", payload: {}, as: ExchangeCoordinator, captures: { s1: $.data.status } }
            - { call: "POST /rack/exchange-agreements/${ea_id}/reinstate", payload: {}, as: ExchangeCoordinator, captures: { s2: $.data.status } }
          assert:
            - "First response status == SUSPENDED"
            - "Second response status == ACTIVE"

      - name: exchange_agreement_terminate_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ExchangeAgreement]
        distinguishing_aspect: "From TERMINATED, no further transitions are possible."
        test_recipe:
          setup: ["ExchangeAgreement TERMINATED"]
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals", payload: { terminal_code: "T", legal_name: "T", state_code: "TX", county_code: "48201", city_code: "HOU" }, as: PlatformAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /rack/products", payload: { product_code: "ULSD", display_name: "D", product_family: "DIESEL", is_brandable: false }, as: PlatformAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /rack/exchange-agreements", payload: { delivering_terminal_id: "${t_id}", receiving_supplier_code: "EXT-1", product_id: "${p_id}", monthly_exchange_cap_gallons: 100000 }, as: ExchangeCoordinator, captures: { ea_id: $.data.id } }
            - { call: "POST /rack/exchange-agreements/${ea_id}/activate", payload: {}, as: ExchangeCoordinator }
            - { call: "POST /rack/exchange-agreements/${ea_id}/terminate", payload: {}, as: ExchangeCoordinator }
          trigger:
            - { call: "POST /rack/exchange-agreements/${ea_id}/suspend", payload: {}, as: ExchangeCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_INVALID_STATE or ERR_AGREEMENT_NOT_ACTIVE (terminal-state lockdown)"

      - name: lifting_right_suspend_cascades_reserved_tickets_to_cancelled
        claim_type: side_effect_execution
        grounds: [state_machines.LiftingRight.ACTIVE_to_SUSPENDED]
        distinguishing_aspect: "Suspending a LiftingRight cancels all its RESERVED LiftingTickets and credits Customer.open_lifting_exposure_cents by their gross_cents."
        test_recipe:
          setup: ["LR ACTIVE with one RESERVED ticket of 1000 gal, price 262, tax 44 -> provisional gross 306000"]
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals", payload: { terminal_code: "T", legal_name: "T", state_code: "TX", county_code: "48201", city_code: "HOU" }, as: PlatformAdmin, captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /rack/products", payload: { product_code: "ULSD", display_name: "D", product_family: "DIESEL", is_brandable: false }, as: PlatformAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /rack/customers", payload: { customer_code: "C", legal_name: "C", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /rack/supply-contracts", payload: { customer_id: "${c_id}", start_date: "2026-01-01", end_date: "2026-12-31", volume_commitment_gallons: 100000, pricing_tier: "RACK" }, as: ContractAdministrator, captures: { sc_id: $.data.id } }
            - { call: "POST /rack/supply-contracts/${sc_id}/activate", payload: {}, as: ContractAdministrator }
            - { call: "POST /rack/lifting-rights", payload: { customer_id: "${c_id}", terminal_id: "${t_id}", product_id: "${p_id}", contract_id: "${sc_id}", daily_ratable_gallons: 100000 }, as: AllocationManager, captures: { lr: $.data.id } }
            - { call: "POST /rack/tax-rules", payload: { jurisdiction_level: "FEDERAL", jurisdiction_code: "US", product_family: "DIESEL", rate_cents_per_gal: 24, effective_start_date: "2026-01-01", effective_end_date: "2026-12-31" }, as: PlatformAdmin }
            - { call: "POST /rack/tax-rules", payload: { jurisdiction_level: "STATE", jurisdiction_code: "TX", product_family: "DIESEL", rate_cents_per_gal: 20, effective_start_date: "2026-01-01", effective_end_date: "2026-12-31" }, as: PlatformAdmin }
            - { call: "POST /rack/price-schedules", payload: { terminal_id: "${t_id}", product_id: "${p_id}", effective_date: "2026-08-01", posted_rack_cents_per_gal: 262, branded_premium_cents_per_gal: 0 }, as: RackPriceAnalyst, captures: { ps: $.data.id } }
            - { call: "POST /rack/price-schedules/${ps}/publish", payload: { expected_terminal_version: "${t_v}" }, as: RackPriceAnalyst }
            - { call: "POST /rack/lifting-tickets", payload: { lifting_right_id: "${lr}", requested_gallons: 1000, branded: false }, as: TerminalOperator, captures: { tk: $.data.id } }
          trigger:
            - { call: "POST /rack/lifting-rights/${lr}/suspend", payload: {}, as: AllocationManager }
          assert:
            - "LiftingRight.${lr}.status == SUSPENDED"
            - "LiftingTicket.${tk}.status == CANCELLED"
            - "Customer.${c_id}.open_lifting_exposure_cents == 0"

      - name: ticket_cancel_from_bol_issued_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.LiftingTicket, "errors[ERR_TICKET_NOT_RESERVED]"]
        distinguishing_aspect: "Cancel on BOL_ISSUED ticket is rejected (only RESERVED can be cancelled)."
        test_recipe:
          setup: ["Ticket posted to BOL_ISSUED"]
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals", payload: { terminal_code: "T", legal_name: "T", state_code: "TX", county_code: "48201", city_code: "HOU" }, as: PlatformAdmin, captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /rack/products", payload: { product_code: "ULSD", display_name: "D", product_family: "DIESEL", is_brandable: false }, as: PlatformAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /rack/customers", payload: { customer_code: "C", legal_name: "C", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /rack/supply-contracts", payload: { customer_id: "${c_id}", start_date: "2026-01-01", end_date: "2026-12-31", volume_commitment_gallons: 100000, pricing_tier: "RACK" }, as: ContractAdministrator, captures: { sc_id: $.data.id } }
            - { call: "POST /rack/supply-contracts/${sc_id}/activate", payload: {}, as: ContractAdministrator }
            - { call: "POST /rack/lifting-rights", payload: { customer_id: "${c_id}", terminal_id: "${t_id}", product_id: "${p_id}", contract_id: "${sc_id}", daily_ratable_gallons: 100000 }, as: AllocationManager, captures: { lr: $.data.id } }
            - { call: "POST /rack/tax-rules", payload: { jurisdiction_level: "FEDERAL", jurisdiction_code: "US", product_family: "DIESEL", rate_cents_per_gal: 24, effective_start_date: "2026-01-01", effective_end_date: "2026-12-31" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals/${t_id}/inventory/adjust", payload: { delta_gallons: 50000, reason: "init" }, as: TerminalOperator }
            - { call: "POST /rack/price-schedules", payload: { terminal_id: "${t_id}", product_id: "${p_id}", effective_date: "2026-08-01", posted_rack_cents_per_gal: 280, branded_premium_cents_per_gal: 0 }, as: RackPriceAnalyst, captures: { ps: $.data.id } }
            - { call: "POST /rack/price-schedules/${ps}/publish", payload: { expected_terminal_version: "${t_v}" }, as: RackPriceAnalyst }
            - { call: "POST /rack/lifting-tickets", payload: { lifting_right_id: "${lr}", requested_gallons: 1000, branded: false }, as: TerminalOperator, captures: { tk: $.data.id } }
            - { call: "POST /rack/lifting-tickets/${tk}/post-bol", payload: {}, as: TerminalOperator }
          trigger:
            - { call: "POST /rack/lifting-tickets/${tk}/cancel", payload: {}, as: TerminalOperator, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_TICKET_NOT_RESERVED"

      - name: invoice_from_reserved_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.LiftingTicket, "errors[ERR_TICKET_NOT_BOL_ISSUED]"]
        distinguishing_aspect: "Invoice on a RESERVED ticket is rejected."
        test_recipe:
          setup: ["Ticket RESERVED"]
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals", payload: { terminal_code: "T", legal_name: "T", state_code: "TX", county_code: "48201", city_code: "HOU" }, as: PlatformAdmin, captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /rack/products", payload: { product_code: "ULSD", display_name: "D", product_family: "DIESEL", is_brandable: false }, as: PlatformAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /rack/customers", payload: { customer_code: "C", legal_name: "C", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /rack/supply-contracts", payload: { customer_id: "${c_id}", start_date: "2026-01-01", end_date: "2026-12-31", volume_commitment_gallons: 100000, pricing_tier: "RACK" }, as: ContractAdministrator, captures: { sc_id: $.data.id } }
            - { call: "POST /rack/supply-contracts/${sc_id}/activate", payload: {}, as: ContractAdministrator }
            - { call: "POST /rack/lifting-rights", payload: { customer_id: "${c_id}", terminal_id: "${t_id}", product_id: "${p_id}", contract_id: "${sc_id}", daily_ratable_gallons: 100000 }, as: AllocationManager, captures: { lr: $.data.id } }
            - { call: "POST /rack/lifting-tickets", payload: { lifting_right_id: "${lr}", requested_gallons: 100, branded: false }, as: TerminalOperator, captures: { tk: $.data.id } }
          trigger:
            - { call: "POST /rack/lifting-tickets/${tk}/invoice", payload: {}, as: BillingClerk, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_TICKET_NOT_BOL_ISSUED"

  # ==================================================================
  # Section: calculations — precision / boundary / input-set claims
  # ==================================================================
  - section: calculations
    instances:
      - name: tax_jurisdiction_no_matching_county_or_city_rules
        claim_type: input_set_filtering
        grounds: [calculations.tax_jurisdiction_determination]
        distinguishing_aspect: "When no COUNTY or CITY rules match the terminal's codes, those levels contribute zero to tax_cents."
        test_recipe:
          setup: ["Terminal in state TX with county/city codes that have no rules"]
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals", payload: { terminal_code: "T", legal_name: "T", state_code: "TX", county_code: "48201", city_code: "HOU" }, as: PlatformAdmin, captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /rack/products", payload: { product_code: "ULSD", display_name: "D", product_family: "DIESEL", is_brandable: false }, as: PlatformAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /rack/customers", payload: { customer_code: "C", legal_name: "C", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /rack/supply-contracts", payload: { customer_id: "${c_id}", start_date: "2026-01-01", end_date: "2026-12-31", volume_commitment_gallons: 100000, pricing_tier: "RACK" }, as: ContractAdministrator, captures: { sc_id: $.data.id } }
            - { call: "POST /rack/supply-contracts/${sc_id}/activate", payload: {}, as: ContractAdministrator }
            - { call: "POST /rack/lifting-rights", payload: { customer_id: "${c_id}", terminal_id: "${t_id}", product_id: "${p_id}", contract_id: "${sc_id}", daily_ratable_gallons: 100000 }, as: AllocationManager, captures: { lr: $.data.id } }
            - { call: "POST /rack/tax-rules", payload: { jurisdiction_level: "FEDERAL", jurisdiction_code: "US", product_family: "DIESEL", rate_cents_per_gal: 24, effective_start_date: "2026-01-01", effective_end_date: "2026-12-31" }, as: PlatformAdmin }
            - { call: "POST /rack/tax-rules", payload: { jurisdiction_level: "STATE", jurisdiction_code: "TX", product_family: "DIESEL", rate_cents_per_gal: 20, effective_start_date: "2026-01-01", effective_end_date: "2026-12-31" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals/${t_id}/inventory/adjust", payload: { delta_gallons: 50000, reason: "init" }, as: TerminalOperator }
            - { call: "POST /rack/price-schedules", payload: { terminal_id: "${t_id}", product_id: "${p_id}", effective_date: "2026-08-01", posted_rack_cents_per_gal: 280, branded_premium_cents_per_gal: 0 }, as: RackPriceAnalyst, captures: { ps: $.data.id } }
            - { call: "POST /rack/price-schedules/${ps}/publish", payload: { expected_terminal_version: "${t_v}" }, as: RackPriceAnalyst }
            - { call: "POST /rack/lifting-tickets", payload: { lifting_right_id: "${lr}", requested_gallons: 1000, branded: false }, as: TerminalOperator, captures: { tk: $.data.id } }
          trigger:
            - { call: "POST /rack/lifting-tickets/${tk}/post-bol", payload: {}, as: TerminalOperator, captures: { tax: $.data.tax_cents } }
          assert:
            - "LiftingTicket.${tk}.tax_cents == 44000 (1000 * (24+20), no COUNTY/CITY contribution)"

      - name: ratable_allocation_excludes_suspended_rights
        claim_type: input_set_filtering
