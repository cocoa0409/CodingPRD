  - rule_id: cross_entity_state_dependency
    instances:
      - name: allocation_request_gated_on_wholesaler_status
        grounds:
          - state_machines.Wholesaler.APPOINTED_to_SUSPENDED
          - endpoints.POST_/allocation-events/{id}/requests
          - errors[ERR_WHOLESALER_NOT_ELIGIBLE]
        distinguishing_aspect: "Dependency across the AllocationEvent-request -> Wholesaler pair: a request that would be legal for an APPOINTED wholesaler is rejected with ERR_WHOLESALER_NOT_ELIGIBLE once three critical audits flip the wholesaler to SUSPENDED, and no request row is appended."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z."
            - "Territory awarded to wholesaler WQ with brand_scope [BUD-LTD]; three accounts AQ1/AQ2/AQ3 served by WQ; three CRITICAL_FAIL audits suspend all three accounts, flipping WQ to SUSPENDED."
            - "An OPEN allocation event for BUD-LTD exists (created after the suspension)."
          setup_api_calls:
            - call: "POST /territories"
              payload: { name: "Gated Territory", state_code: "TX" }
              as: BrewerAdmin
              captures: { tq_id: $.data.id }
            - call: "POST /wholesalers"
