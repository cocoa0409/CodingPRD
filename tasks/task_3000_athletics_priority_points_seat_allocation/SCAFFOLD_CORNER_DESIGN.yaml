            - "State reached after the transfer approve, before the trigger: Donor.${ff_id}.certified_base_points == 15.00, transferred_points_out == 10.00, certified_points == 5.00; Donor.${gg_id}.transferred_points_in == 10.00 and certified_points == 10.00"
