              as_user_id: clerk1
              captures: { app_id: $.data.id }
            - call: "POST /income-records"
              payload: { application_id: "${app_id}", gross_amount_cents: 150000, pay_frequency: "MONTHLY" }
              as: EligibilityClerk
              as_user_id: clerk1
            - call: "POST /applications/${app_id}/determine-income"
              payload: {}
              as: EligibilityClerk
              as_user_id: clerk1
            - call: "POST /applications/${app_id}/assess-risk"
              payload: { risk_factor_codes: ["GEST_DIABETES"] }
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
            - call: "GET /certifications"
              payload: {}
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
              captures: { cert_id: "$.data[0].id" }
            - call: "GET /participants/${p_id}"
              payload: {}
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
              captures: { p_ver: $.data.version }
            - call: "POST /food-prescriptions"
              payload: { certification_id: "${cert_id}", issuance_mode: "FULL", line_items: [{food_category: "MILK", requested_units: 6}, {food_category: "EGGS", requested_units: 2}, {food_category: "JUICE", requested_units: 3}], expected_participant_version: "${p_ver}" }
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
