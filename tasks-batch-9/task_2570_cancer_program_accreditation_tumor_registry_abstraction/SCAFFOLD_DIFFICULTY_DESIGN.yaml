      - name: deficiency_second_rejection_escalates_to_probation_and_holds_submission_depth4
        grounds:
          - state_machines.Deficiency.RESPONSE_SUBMITTED_to_ESCALATED
          - state_machines.CancerProgram.ACCREDITED_to_PROBATION
          - calculations.registry_posture
          - state_machines.RegistrySubmission.DRAFT_to_HOLD
          - calculations.deficiency_response_window
          - endpoints[POST /cancer-registry/deficiencies/{deficiencyId}/response-review]
        distinguishing_aspect: |
          A different trigger (surveyor response-review REJECTED at the escalation cap) drives the
          same depth-4 topology in the FREEZING direction: Deficiency -> ESCALATED,
          CancerProgram.accreditation_state -> PROBATION, registry_posture -> FROZEN,
          RegistrySubmission DRAFT -> HOLD; the chain is keyed on escalation_count reaching
          DEFICIENCY_ESCALATION_MAX, not on any backlog counter.
        test_recipe:
          setup:
            - "One program in ACCREDITED state holding one DRAFT submission for period 2026-01-01..2026-06-30."
            - "A MAJOR deficiency cited on 2026-08-01 has response_due_date 2026-09-15 (45-day window)."
            - "The coordinator already answered once and the surveyor already rejected once, so escalation_count == 1 and response_due_date was extended to 2026-09-30."
            - "The coordinator answered again, so the deficiency is RESPONSE_SUBMITTED; the clock is still 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Oakridge Cancer Program", coc_program_id: "COC-14558", annual_analytic_caseload: 620, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/submissions"
              payload: { program_id: "${prog_id}", period_start: "2026-01-01", period_end: "2026-06-30", deadline_date: "2026-12-31" }
              as: RegistryManager
              captures: { sub_id: $.data.id }
            - call: "POST /cancer-registry/deficiencies"
              payload: { program_id: "${prog_id}", standard_code: "STD-6.1", severity: "MAJOR", cited_on: "2026-08-01", evidence_reference: "survey-finding-6.1" }
              as: CoCSurveyor
              as_user_id: "surv-nakamura"
              captures: { def_id: $.data.id }
            - call: "POST /cancer-registry/deficiencies/${def_id}/response"
              payload: { response_narrative: "conference minutes attached for the missing months", evidence_reference: "minutes-2026H1" }
              as: AccreditationCoordinator
              as_user_id: "coord-lee"
            - call: "POST /cancer-registry/deficiencies/${def_id}/response-review"
              payload: { outcome: "REJECTED", reviewer_notes: "minutes do not evidence attendance" }
              as: CoCSurveyor
              as_user_id: "surv-nakamura"
            - call: "POST /cancer-registry/deficiencies/${def_id}/response"
              payload: { response_narrative: "attendance rosters added for all sessions" }
              as: AccreditationCoordinator
              as_user_id: "coord-lee"
          trigger:
            - call: "POST /cancer-registry/deficiencies/${def_id}/response-review"
              payload: { outcome: "REJECTED", reviewer_notes: "rosters still omit the required coordinator" }
              as: CoCSurveyor
              as_user_id: "surv-nakamura"
          assert:
            - "Deficiency.${def_id}.deficiency_state == ESCALATED"
            - "Deficiency.${def_id}.escalation_count == 2"
            - "Deficiency.${def_id}.response_due_date == 2026-09-30"
            - "CancerProgram.${prog_id}.accreditation_state == PROBATION"
            - "CancerProgram.${prog_id}.registry_posture == FROZEN"
            - "RegistrySubmission.${sub_id}.submission_state == HOLD and RegistrySubmission.${sub_id}.pre_hold_state == DRAFT"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: frozen_registry_masks_abstractor_capacity_cap_on_assign
        grounds:
          - validations[priority=50]
          - validations[priority=62]
          - calculations.registry_posture
          - calculations.abstractor_capacity_cap
          - errors[ERR_REGISTRY_FROZEN]
          - errors[ERR_ABSTRACTOR_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Both rules are violated by the same assign call — priority 50 business_safety
          (registry_posture FROZEN from one CRITICAL deficiency) and priority 62
          business_constraint (the TRAINEE already holds 2 open cases against a cap of
          round_half_up(0.2 * 10) == 2) — and the response must be ERR_REGISTRY_FROZEN, the
          lower-priority number, never the capacity error.
