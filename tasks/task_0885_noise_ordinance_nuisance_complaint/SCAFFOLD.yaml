# =============================================================================
# SCAFFOLD.yaml — Noise-Ordinance & Nuisance Complaint (Expert)
# §1.0–§1.7. Difficulty design (§1.8) and corner design (§1.9) live in siblings.
# =============================================================================

scenario: |
  Noise-Ordinance & Nuisance Complaint: complaint intake & location/time,
  decibel/threshold & permit check, warning & citation escalation,
  chronic-nuisance property tracking, variance (construction/event) permit,
  cross-agency referral, hearing/appeal, abatement

domain_name: noise-ordinance-nuisance-complaint
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat            # peer entities linked by FK, no URL nesting for ownership
  state_machine_shape: cyclic      # Enforcement appeal loop is cyclic; Property runs parallel axes
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties # hearing decider must differ from citation issuer (X-User-ID)
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Property
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: address, type: string, source: input, description: "Street address of the parcel" }
      - { name: zoning_type, type: enum, source: input, description: "One of RESIDENTIAL | COMMERCIAL | INDUSTRIAL | MIXED; selects the applicable NoiseLimitPolicy", constraints: "RESIDENTIAL|COMMERCIAL|INDUSTRIAL|MIXED" }
      - { name: substantiated_violation_count, type: integer, source: computed, default: 0, description: "Count of non-dismissed Enforcements for this Property within CHRONIC_WINDOW_DAYS; recomputed on every substantiate/dismiss (see calc property_chronic_status)" }
      - { name: chronic_status, type: enum, source: computed, default: "NONE", description: "Chronic-nuisance posture derived from substantiated_violation_count: NONE | WATCH | DESIGNATED", constraints: "NONE|WATCH|DESIGNATED" }
      - { name: abatement_status, type: enum, source: computed, default: "NONE", description: "Independent parallel axis tracking abatement lifecycle: NONE | UNDER_ABATEMENT | ABATED", constraints: "NONE|UNDER_ABATEMENT|ABATED" }

  - name: NoiseLimitPolicy
    parent: null
    common_fields: true
    fields:
      - { name: zoning_type, type: enum, source: input, description: "Zoning this policy governs; unique across all policies (ERR_DUPLICATE_POLICY)", constraints: "RESIDENTIAL|COMMERCIAL|INDUSTRIAL|MIXED; unique" }
      - { name: day_limit_db, type: number, source: input, description: "Decibel limit applied during daytime hours" }
      - { name: night_limit_db, type: number, source: input, description: "Decibel limit applied during nighttime hours" }
      - { name: day_start_hour, type: integer, source: input, description: "UTC hour [0..23] at which the daytime window begins (inclusive)" }
      - { name: night_start_hour, type: integer, source: input, description: "UTC hour [0..23] at which the nighttime window begins (inclusive); daytime is [day_start_hour, night_start_hour)" }

  - name: VariancePermit
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; the parcel the variance covers" }
      - { name: permit_type, type: enum, source: input, description: "CONSTRUCTION | EVENT; selects fee formula variant", constraints: "CONSTRUCTION|EVENT" }
      - { name: requested_start, type: datetime, source: input, description: "Applicant-requested window start (ISO 8601 UTC)" }
      - { name: requested_end, type: datetime, source: input, description: "Applicant-requested window end; must be strictly after requested_start (ERR_INVALID_WINDOW)" }
      - { name: permitted_max_db, type: number, source: input, description: "Decibel ceiling the variance grants; must be <= VARIANCE_ABSOLUTE_MAX_DB (ERR_VARIANCE_DB_EXCEEDS_CAP)" }
      - { name: expected_attendees, type: integer, source: input, default: 0, description: "Expected headcount; only used by EVENT fee formula" }
      - { name: approved_start, type: datetime, source: computed, description: "Window start locked at issuance; defaults to requested_start unless the clerk narrows it" }
      - { name: approved_end, type: datetime, source: computed, description: "Window end locked at issuance; defaults to requested_end unless the clerk narrows it" }
      - { name: fee_estimate_cents, type: integer, source: computed, description: "Provisional fee computed at creation from the REQUESTED window (variance_fee variant=estimate)" }
      - { name: fee_final_cents, type: integer, source: computed, description: "Final fee computed at issuance from the APPROVED window (variance_fee variant=final)" }
      - { name: status, type: enum, source: system, default: "UNDER_REVIEW", description: "UNDER_REVIEW -> ISSUED | DENIED; ISSUED -> REVOKED", constraints: "UNDER_REVIEW|ISSUED|DENIED|REVOKED" }

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; parcel the noise was reported at" }
      - { name: reported_at, type: datetime, source: input, description: "Instant the noise occurred (ISO 8601 UTC); drives day/night limit and variance-window coverage" }
      - { name: noise_type, type: enum, source: input, description: "CONSTRUCTION | AMPLIFIED_MUSIC | MACHINERY | ANIMAL | VEHICLE | OTHER", constraints: "CONSTRUCTION|AMPLIFIED_MUSIC|MACHINERY|ANIMAL|VEHICLE|OTHER" }
      - { name: reported_decibel, type: number, source: input, default: null, description: "Complainant-estimated level; advisory only (substantiation uses Inspection.measured_decibel)" }
      - { name: source, type: enum, source: input, default: "PHONE", description: "PHONE | ONLINE | OFFICER intake channel", constraints: "PHONE|ONLINE|OFFICER" }
      - { name: complainant_contact, type: string, source: input, default: null, description: "Optional reporter contact string" }
      - { name: status, type: enum, source: system, default: "RECEIVED", description: "RECEIVED -> UNDER_REVIEW -> SUBSTANTIATED | DISMISSED", constraints: "RECEIVED|UNDER_REVIEW|SUBSTANTIATED|DISMISSED" }

  - name: Inspection
    parent: null
    common_fields: false  # append-only reading: id + created_at only
    fields:
      - { name: complaint_id, type: string, source: input, description: "FK -> Complaint.id; the complaint this field reading supports" }
      - { name: measured_decibel, type: number, source: input, description: "Officer-measured sound level" }
      - { name: measured_at, type: datetime, source: input, description: "Instant of measurement (ISO 8601 UTC); selects day vs night limit" }
      - { name: effective_limit_db, type: number, source: computed, description: "Applicable limit resolved from the Property's NoiseLimitPolicy at measured_at (calc effective_noise_limit)" }
      - { name: exceeds_limit, type: boolean, source: computed, description: "True iff measured_decibel > effective_limit_db (STRICT; equal is not a violation) (calc inspection_exceeds_limit)" }
      - { name: inspected_by_user_id, type: string, source: system, description: "X-User-ID of the CodeOfficer who recorded the reading" }

  - name: Enforcement
    parent: null
    common_fields: true
    fields:
      - { name: complaint_id, type: string, source: input, description: "FK -> Complaint.id; the substantiated complaint that produced this action" }
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; denormalized from the complaint for escalation scoping" }
      - { name: tier, type: enum, source: computed, description: "WARNING (escalation_level 0, no fine) | CITATION (escalation_level >= 1, fined)", constraints: "WARNING|CITATION" }
      - { name: escalation_level, type: integer, source: computed, description: "Count of prior non-dismissed Enforcements for this Property within CHRONIC_WINDOW_DAYS, measured immediately before this one" }
      - { name: assessed_fine_cents, type: integer, source: computed, description: "Provisional fine at issuance (calc fine_escalation); STANDARD variant of enforcement_effective_fine" }
      - { name: effective_fine_cents, type: integer, source: computed, description: "Reconciled fine after any hearing REDUCED outcome (calc enforcement_effective_fine, FINAL variant); equals assessed_fine_cents until reduced" }
      - { name: late_penalty_cents, type: integer, source: computed, default: 0, description: "Accrued late penalty computed on read from current clock vs due_date (calc late_penalty)" }
      - { name: amount_paid_cents, type: integer, source: computed, default: 0, description: "sum(Payment.amount_cents where kind=PAYMENT,status=CLEARED) - sum(kind=REFUND,status=CLEARED) (calc enforcement_balance)" }
      - { name: amount_outstanding_cents, type: integer, source: computed, description: "effective_fine_cents + late_penalty_cents - amount_paid_cents (calc enforcement_balance)" }
      - { name: issued_by_user_id, type: string, source: system, description: "X-User-ID of the CodeOfficer who substantiated; used for segregation-of-duties at hearing" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock instant of substantiation" }
      - { name: due_date, type: datetime, source: system, description: "issued_at + PAYMENT_DUE_DAYS; after this the late penalty accrues" }
      - { name: status, type: enum, source: system, default: "ISSUED", description: "ISSUED -> CONTESTED -> HEARING_SCHEDULED -> UPHELD | REDUCED | DISMISSED; ISSUED/UPHELD/REDUCED -> PAID; HEARING_SCHEDULED -> CONTESTED (remand loop)", constraints: "ISSUED|CONTESTED|HEARING_SCHEDULED|UPHELD|REDUCED|DISMISSED|PAID" }

  - name: Hearing
    parent: null
    common_fields: true
    fields:
      - { name: enforcement_id, type: string, source: input, description: "FK -> Enforcement.id; the citation under appeal" }
      - { name: hearing_officer_id, type: string, source: input, description: "Opaque X-User-ID of the presiding HearingOfficer; overlap/buffer is enforced per officer" }
      - { name: scheduled_at, type: datetime, source: input, description: "Start instant of the hearing slot (ISO 8601 UTC)" }
      - { name: duration_minutes, type: integer, source: input, default: 30, description: "Slot length; slot occupies [scheduled_at, scheduled_at + duration_minutes]" }
      - { name: reduction_pct, type: number, source: input, default: null, description: "Fraction in [0,1) applied to assessed_fine_cents when outcome=REDUCED (ERR_REDUCTION_PCT_INVALID otherwise)" }
      - { name: outcome, type: enum, source: system, default: "PENDING", description: "PENDING -> UPHELD | REDUCED | DISMISSED | REMANDED", constraints: "PENDING|UPHELD|REDUCED|DISMISSED|REMANDED" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Logical-clock instant the outcome was recorded" }

  - name: AbatementOrder
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; parcel ordered to abate" }
      - { name: enforcement_id, type: string, source: input, default: null, description: "FK -> Enforcement.id; the delinquent citation that prompted a manual order (null for chronic-designation orders)" }
      - { name: trigger_source, type: enum, source: system, description: "CHRONIC_DESIGNATION (auto on DESIGNATED) | DELINQUENT_CITATION (manual)", constraints: "CHRONIC_DESIGNATION|DELINQUENT_CITATION" }
      - { name: compliance_deadline, type: datetime, source: input, default: null, description: "Deadline to comply; escalation is only allowed at/after this instant. Defaults to issued instant + ABATEMENT_COMPLIANCE_DAYS when omitted" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING -> COMPLIED | ESCALATED | VACATED", constraints: "PENDING|COMPLIED|ESCALATED|VACATED" }

  - name: CrossAgencyReferral
    parent: null
    common_fields: true
    fields:
      - { name: complaint_id, type: string, source: input, description: "FK -> Complaint.id; the complaint routed to another agency" }
      - { name: agency, type: enum, source: input, description: "POLICE | BUILDING | HEALTH | ANIMAL_CONTROL", constraints: "POLICE|BUILDING|HEALTH|ANIMAL_CONTROL" }
      - { name: reason, type: string, source: input, default: null, description: "Free-text routing reason" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN -> ACKNOWLEDGED -> CLOSED", constraints: "OPEN|ACKNOWLEDGED|CLOSED" }

  - name: Payment
    parent: null
    common_fields: false  # append-only ledger row: id + created_at only
    fields:
      - { name: enforcement_id, type: string, source: input, description: "FK -> Enforcement.id; the citation this ledger row applies to" }
      - { name: amount_cents, type: integer, source: input, description: "Positive magnitude in cents; interpreted per kind" }
      - { name: kind, type: enum, source: system, default: "PAYMENT", description: "PAYMENT (recorded via endpoint) | REFUND (system-created on hearing REDUCED/DISMISSED overpayment reversal)", constraints: "PAYMENT|REFUND" }
      - { name: method, type: enum, source: input, default: "CARD", description: "CARD | CHECK | CASH", constraints: "CARD|CHECK|CASH" }
      - { name: status, type: enum, source: system, default: "CLEARED", description: "CLEARED (all recorded rows; append-only ledger has no void path — reversals are new REFUND rows)", constraints: "CLEARED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Complaint
    initial_state: RECEIVED
    terminal_states: [SUBSTANTIATED, DISMISSED]
    transitions:
      - from: RECEIVED
        to: UNDER_REVIEW
        trigger: "POST /complaints/{id}/review"
        actor: CodeOfficer
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: SUBSTANTIATED
        trigger: "POST /complaints/{id}/substantiate"
        actor: CodeOfficer
        preconditions:
          - "Latest Inspection for this complaint exists (ERR_NO_INSPECTION_ON_RECORD)"
          - "Latest Inspection.exceeds_limit == true, i.e. measured_decibel > effective_limit_db STRICT (ERR_NOISE_WITHIN_LIMIT)"
          - "No ISSUED VariancePermit on the Property covers reported_at with permitted_max_db >= latest Inspection.measured_decibel (ERR_VARIANCE_COVERS_COMPLAINT)"
        side_effects:
          - "CREATE Enforcement (complaint_id, property_id); escalation_level = count of non-dismissed Enforcements for Property within CHRONIC_WINDOW_DAYS; tier & assessed_fine_cents via calc fine_escalation; effective_fine_cents = assessed_fine_cents; issued_by_user_id = X-User-ID; issued_at = clock; due_date = issued_at + PAYMENT_DUE_DAYS  [cascade hop 1]"
          - "Property.substantiated_violation_count += 1; recompute Property.chronic_status via calc property_chronic_status  [cascade hop 2]"
          - "If Property.chronic_status becomes DESIGNATED on this recompute: CREATE AbatementOrder(trigger_source=CHRONIC_DESIGNATION, status=PENDING); Property.abatement_status -> UNDER_ABATEMENT  [cascade hop 3]"
          - "increments Property.version by 1"
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /complaints/{id}/dismiss"
        actor: CodeOfficer
        preconditions: []
        side_effects: []

  - entity: VariancePermit
    initial_state: UNDER_REVIEW
    terminal_states: [DENIED, REVOKED]
    transitions:
      - from: UNDER_REVIEW
        to: ISSUED
        trigger: "POST /variance-permits/{id}/issue"
        actor: PermitClerk
        preconditions:
          - "approved window valid: approved_end > approved_start (ERR_INVALID_WINDOW)"
          - "permitted_max_db <= VARIANCE_ABSOLUTE_MAX_DB (ERR_VARIANCE_DB_EXCEEDS_CAP)"
          - "No other ISSUED VariancePermit on the same Property has a half-open [approved_start, approved_end) window overlapping this one (ERR_VARIANCE_WINDOW_OVERLAP)"
        side_effects:
          - "approved_start/approved_end locked (clerk override or requested defaults)"
          - "fee_final_cents computed from approved window via calc variance_fee (variant=final)"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /variance-permits/{id}/deny"
        actor: PermitClerk
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: REVOKED
        trigger: "POST /variance-permits/{id}/revoke"
        actor: PermitClerk
        preconditions: []
        side_effects: []

  - entity: Enforcement
    initial_state: ISSUED
    terminal_states: [DISMISSED, PAID]
    transitions:
      - from: ISSUED
        to: CONTESTED
        trigger: "POST /enforcements/{id}/contest"
        actor: Resident
        preconditions:
          - "tier == CITATION (WARNING cannot be appealed) (ERR_ENFORCEMENT_NOT_CITATION)"
        side_effects:
          - "increments Enforcement.version by 1"
      - from: CONTESTED
        to: HEARING_SCHEDULED
        trigger: "POST /enforcements/{id}/hearings"
        actor: HearingOfficer
        preconditions:
          - "No other Hearing for the same hearing_officer_id has a closed [scheduled_at, scheduled_at+duration_minutes] slot within HEARING_BUFFER_MINUTES of this one (ERR_HEARING_SLOT_CONFLICT)"
        side_effects:
          - "CREATE Hearing(outcome=PENDING)"
          - "increments Enforcement.version by 1"
      - from: HEARING_SCHEDULED
        to: UPHELD
        trigger: "POST /hearings/{id}/decide (outcome=UPHELD)"
        actor: HearingOfficer
        preconditions:
          - "deciding X-User-ID != Enforcement.issued_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Hearing.outcome=UPHELD, decided_at=clock; effective_fine_cents unchanged"
          - "increments Enforcement.version by 1"
      - from: HEARING_SCHEDULED
        to: REDUCED
        trigger: "POST /hearings/{id}/decide (outcome=REDUCED)"
        actor: HearingOfficer
        preconditions:
          - "deciding X-User-ID != Enforcement.issued_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "reduction_pct in [0,1) (ERR_REDUCTION_PCT_INVALID)"
        side_effects:
          - "Hearing.outcome=REDUCED; effective_fine_cents = round_half_up(assessed_fine_cents * (1 - reduction_pct)) (calc enforcement_effective_fine)  [cascade hop 1]"
          - "If amount_paid_cents > effective_fine_cents + late_penalty_cents: CREATE Payment(kind=REFUND, amount_cents = amount_paid_cents - (effective_fine_cents + late_penalty_cents)); recompute enforcement_balance  [cascade hop 2]"
          - "increments Enforcement.version by 1"
      - from: HEARING_SCHEDULED
        to: DISMISSED
        trigger: "POST /hearings/{id}/decide (outcome=DISMISSED)"
        actor: HearingOfficer
        preconditions:
          - "deciding X-User-ID != Enforcement.issued_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Hearing.outcome=DISMISSED; Enforcement.status=DISMISSED  [cascade hop 1]"
          - "If amount_paid_cents > 0: CREATE Payment(kind=REFUND, amount_cents = amount_paid_cents) (full refund)"
          - "Property.substantiated_violation_count -= 1; recompute Property.chronic_status via calc property_chronic_status  [cascade hop 2]"
          - "If chronic_status drops below DESIGNATED and a PENDING AbatementOrder with trigger_source=CHRONIC_DESIGNATION exists for the Property: that AbatementOrder.status=VACATED; Property.abatement_status -> NONE  [cascade hop 3]"
          - "increments Enforcement.version by 1; increments Property.version by 1"
      - from: HEARING_SCHEDULED
        to: CONTESTED
        trigger: "POST /hearings/{id}/decide (outcome=REMANDED)"
        actor: HearingOfficer
        note: "Remand loop — returns the citation to CONTESTED so a fresh Hearing may be scheduled (cyclic)."
        preconditions:
          - "deciding X-User-ID != Enforcement.issued_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Hearing.outcome=REMANDED; Enforcement.status=CONTESTED"
          - "increments Enforcement.version by 1"
      - from: ISSUED
        to: PAID
        trigger: "system (automatic on POST /enforcements/{id}/payments when amount_outstanding_cents <= 0)"
        actor: system
        preconditions:
          - "amount_outstanding_cents <= 0 after the payment"
        side_effects: []
      - from: UPHELD
        to: PAID
        trigger: "system (automatic on POST /enforcements/{id}/payments when amount_outstanding_cents <= 0)"
        actor: system
        preconditions:
          - "amount_outstanding_cents <= 0 after the payment"
        side_effects: []
      - from: REDUCED
        to: PAID
        trigger: "system (automatic on POST /enforcements/{id}/payments when amount_outstanding_cents <= 0)"
        actor: system
        preconditions:
          - "amount_outstanding_cents <= 0 after the payment"
        side_effects: []

  - entity: Hearing
    initial_state: PENDING
    terminal_states: [UPHELD, REDUCED, DISMISSED, REMANDED]
    transitions:
      - from: PENDING
        to: UPHELD
        trigger: "POST /hearings/{id}/decide (outcome=UPHELD)"
        actor: HearingOfficer
        preconditions: ["deciding X-User-ID != Enforcement.issued_by_user_id (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["see Enforcement HEARING_SCHEDULED->UPHELD"]
      - from: PENDING
        to: REDUCED
        trigger: "POST /hearings/{id}/decide (outcome=REDUCED)"
        actor: HearingOfficer
        preconditions: ["deciding X-User-ID != Enforcement.issued_by_user_id", "reduction_pct in [0,1)"]
        side_effects: ["see Enforcement HEARING_SCHEDULED->REDUCED"]
      - from: PENDING
        to: DISMISSED
        trigger: "POST /hearings/{id}/decide (outcome=DISMISSED)"
        actor: HearingOfficer
        preconditions: ["deciding X-User-ID != Enforcement.issued_by_user_id"]
        side_effects: ["see Enforcement HEARING_SCHEDULED->DISMISSED"]
      - from: PENDING
        to: REMANDED
        trigger: "POST /hearings/{id}/decide (outcome=REMANDED)"
        actor: HearingOfficer
        preconditions: ["deciding X-User-ID != Enforcement.issued_by_user_id"]
        side_effects: ["see Enforcement HEARING_SCHEDULED->CONTESTED"]

  - entity: Property
    initial_state: "NONE"   # names the chronic_status axis; abatement_status is a parallel independent axis
    terminal_states: []
    note: "Two PARALLEL independent axes on one row: chronic_status {NONE,WATCH,DESIGNATED} driven by substantiated_violation_count, and abatement_status {NONE,UNDER_ABATEMENT,ABATED} driven by AbatementOrder lifecycle. They evolve independently."
    transitions:
      - from: "NONE"
        to: WATCH
        trigger: "system (chronic axis; on substantiate when count reaches CHRONIC_WATCH_THRESHOLD)"
        actor: system
        preconditions: ["substantiated_violation_count >= CHRONIC_WATCH_THRESHOLD and < CHRONIC_DESIGNATED_THRESHOLD"]
        side_effects: []
      - from: WATCH
        to: DESIGNATED
        trigger: "system (chronic axis; on substantiate when count reaches CHRONIC_DESIGNATED_THRESHOLD)"
        actor: system
        preconditions: ["substantiated_violation_count >= CHRONIC_DESIGNATED_THRESHOLD"]
        side_effects: ["CREATE AbatementOrder(trigger_source=CHRONIC_DESIGNATION); abatement_status -> UNDER_ABATEMENT"]
      - from: DESIGNATED
        to: WATCH
        trigger: "system (chronic axis; on dismiss cascade when count falls back into WATCH band)"
        actor: system
        preconditions: ["substantiated_violation_count in [CHRONIC_WATCH_THRESHOLD, CHRONIC_DESIGNATED_THRESHOLD)"]
        side_effects: ["VACATE the PENDING CHRONIC_DESIGNATION AbatementOrder; abatement_status -> NONE"]
      - from: WATCH
        to: "NONE"
        trigger: "system (chronic axis; on dismiss cascade when count falls below CHRONIC_WATCH_THRESHOLD)"
        actor: system
        preconditions: ["substantiated_violation_count < CHRONIC_WATCH_THRESHOLD"]
        side_effects: []
      - from: "NONE"
        to: UNDER_ABATEMENT
        trigger: "system (abatement axis; on AbatementOrder creation)"
        actor: system
        preconditions: []
        side_effects: []
        note: "abatement_status axis transition, independent of chronic_status"
      - from: UNDER_ABATEMENT
        to: ABATED
        trigger: "POST /abatement-orders/{id}/comply (abatement axis)"
        actor: CodeOfficer
        preconditions: []
        side_effects: []
        note: "abatement_status axis transition"
      - from: UNDER_ABATEMENT
        to: "NONE"
        trigger: "system (abatement axis; on AbatementOrder VACATED)"
        actor: system
        preconditions: []
        side_effects: []
        note: "abatement_status axis transition"

  - entity: AbatementOrder
    initial_state: PENDING
    terminal_states: [COMPLIED, ESCALATED, VACATED]
    transitions:
      - from: PENDING
        to: COMPLIED
        trigger: "POST /abatement-orders/{id}/comply"
        actor: CodeOfficer
        preconditions:
          - "Property.abatement_status == UNDER_ABATEMENT (ERR_PROPERTY_NOT_UNDER_ABATEMENT)"
        side_effects:
          - "Property.abatement_status -> ABATED; increments Property.version by 1"
      - from: PENDING
        to: ESCALATED
        trigger: "POST /abatement-orders/{id}/escalate"
        actor: CodeOfficer
        preconditions:
          - "current_utc >= compliance_deadline (ERR_ABATEMENT_DEADLINE_NOT_REACHED)"
        side_effects: []
      - from: PENDING
        to: VACATED
        trigger: "system (dismiss cascade — chronic downgrade)"
        actor: system
        preconditions: []
        side_effects:
          - "Property.abatement_status -> NONE; increments Property.version by 1"

  - entity: CrossAgencyReferral
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /referrals/{id}/acknowledge"
        actor: CodeOfficer
        preconditions: []
        side_effects: []
      - from: ACKNOWLEDGED
        to: CLOSED
        trigger: "POST /referrals/{id}/close"
        actor: CodeOfficer
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /referrals/{id}/close"
        actor: CodeOfficer
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (true CREATE-with-supersede races, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: payment-create-stale-enforcement
    parent_entity: Enforcement
    write_endpoint: "POST /enforcements/{id}/payments"
    occ_field: "expected_enforcement_version"
    description: |
      Recording a Payment against an Enforcement whose version has advanced
      since the client last read it is rejected. Partial payments legitimately
      succeed in sequence, so this is a true race: between the client's read of
      the fine and this write, a hearing REDUCED/DISMISSED outcome (or another
      payment) has changed effective_fine_cents/amount_outstanding and bumped
      the Enforcement's version, making the client's payment decision stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: abatement-create-stale-property
    parent_entity: Property
    write_endpoint: "POST /abatement-orders"
    occ_field: "expected_property_version"
    description: |
      Creating a manual (DELINQUENT_CITATION) AbatementOrder against a Property
      whose version has advanced since the client last read it is rejected.
      Multiple abatement orders may legitimately exist per property, so this is
      a true race: a substantiate/dismiss cascade has changed the Property's
      chronic_status/substantiated_violation_count and bumped its version, so
      the operator's basis for opening a manual order is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: effective_noise_limit
    trigger: "POST /complaints/{id}/inspections (per reading)"
    algorithm: threshold
    formula: |
      policy = NoiseLimitPolicy where zoning_type == Property.zoning_type   # unique per zoning
      hour = UTC hour-of-day of Inspection.measured_at
      if policy.day_start_hour <= hour < policy.night_start_hour:
          effective_limit_db = policy.day_limit_db
      else:
          effective_limit_db = policy.night_limit_db
    input_set: "the single NoiseLimitPolicy matching the Property's zoning_type"
    precision: "decibels, exact (no rounding)"
    note: "Daytime window is half-open [day_start_hour, night_start_hour)."

  - name: inspection_exceeds_limit
    trigger: "POST /complaints/{id}/inspections (per reading)"
    algorithm: threshold
    formula: |
      exceeds_limit = (measured_decibel > effective_limit_db)   # STRICT >, equality is NOT a violation
    input_set: "single Inspection vs its effective_limit_db"
    precision: "boundary: measured == limit -> false; measured == limit + epsilon -> true"

  - name: fine_escalation
    trigger: "POST /complaints/{id}/substantiate (Enforcement creation) — cascade hop 1"
    algorithm: tiered_pricing
    formula: |
      level = count of non-dismissed Enforcements (status != DISMISSED) for Property
              with issued_at within CHRONIC_WINDOW_DAYS of now, measured BEFORE this one
      if level == 0:
          tier = WARNING
          assessed_fine_cents = 0
      else:
          tier = CITATION
          chronic_factor = CHRONIC_FINE_MULTIPLIER if Property.chronic_status == DESIGNATED
                           (as it stands BEFORE this substantiation's chronic recompute) else 1.0
          raw = BASE_FINE_CENTS * level * ZONING_FINE_FACTOR[Property.zoning_type] * chronic_factor
          assessed_fine_cents = min(MAX_FINE_CENTS, round_half_up(raw))
      effective_fine_cents = assessed_fine_cents   # at issuance
    input_set: "prior non-dismissed Enforcements for the Property within the rolling window"
    constants:
      BASE_FINE_CENTS: 10000
      MAX_FINE_CENTS: 500000
      CHRONIC_FINE_MULTIPLIER: 1.5
      CHRONIC_WINDOW_DAYS: 365
      ZONING_FINE_FACTOR: { RESIDENTIAL: 1.0, COMMERCIAL: 1.5, INDUSTRIAL: 0.75, MIXED: 1.25 }
    precision: "2 decimal places at cents granularity, round_half_up; then min-capped"
    note: "Non-linear: tier selection by level, a 3-factor product (level x zoning x chronic), and a min() cap. Evaluation order is pinned — the fine reads chronic_status BEFORE the chronic recompute in cascade hop 2."

  - name: enforcement_effective_fine
    trigger: "POST /hearings/{id}/decide"
    algorithm: forward_looking
    formula: |
      # dual variant of the SAME Enforcement fine
      STANDARD (variant at issuance):  effective_fine_cents = assessed_fine_cents
      FINAL    (variant after hearing REDUCED):
          effective_fine_cents = round_half_up(assessed_fine_cents * (1 - reduction_pct))
      UPHELD / DISMISSED do not change effective_fine_cents via this reduction path
      (DISMISSED zeroes the outstanding through refund, not through this field).
    input_set: "single Enforcement; assessed_fine_cents and (if reduced) Hearing.reduction_pct"
    constants: {}
    precision: "2 decimal places at cents granularity, round_half_up"
    variants:
      - { name: standard, when: "at issuance and on UPHELD", difference: "effective == assessed" }
      - { name: final, when: "on hearing outcome REDUCED", difference: "effective = round_half_up(assessed * (1 - reduction_pct)); strictly less than assessed for reduction_pct > 0" }

  - name: late_penalty
    trigger: "GET /enforcements/{id} and enforcement_balance (computed on read)"
    algorithm: aggregation
    formula: |
      if current_utc <= due_date:
          late_penalty_cents = 0
      else:
          overdue_days = floor((current_utc - due_date) / 86400 seconds)   # whole elapsed days
          per_day_cents = round_half_up(effective_fine_cents * LATE_PENALTY_DAILY_PCT)
          late_penalty_cents = sum over the overdue_days of per_day_cents    # ROUND-PER-DAY-THEN-SUM
      # Pinned order: round each day's penalty to whole cents, THEN sum.
      # Contrast round_half_up(effective_fine_cents * rate * overdue_days) (sum-then-round) which can differ by a cent.
    input_set: "single Enforcement; current logical clock vs due_date"
    constants:
      LATE_PENALTY_DAILY_PCT: 0.015
    precision: "whole cents, round_half_up per day BEFORE summing"

  - name: variance_fee
    trigger: "POST /variance-permits (estimate) and POST /variance-permits/{id}/issue (final)"
    algorithm: tiered_pricing
    formula: |
      duration_days(start, end) = ceil((end - start) total_seconds / 86400)
      if permit_type == CONSTRUCTION:
          fee = CONSTRUCTION_BASE_FEE_CENTS + CONSTRUCTION_PER_DAY_CENTS * duration_days(window)
      else:  # EVENT
          fee = EVENT_BASE_FEE_CENTS + EVENT_PER_ATTENDEE_CENTS * expected_attendees
      fee_estimate_cents uses the REQUESTED window/attendees (variant=estimate, at creation)
      fee_final_cents    uses the APPROVED  window/attendees (variant=final, at issuance)
    input_set: "single VariancePermit"
    constants:
      CONSTRUCTION_BASE_FEE_CENTS: 5000
      CONSTRUCTION_PER_DAY_CENTS: 2500
      EVENT_BASE_FEE_CENTS: 10000
      EVENT_PER_ATTENDEE_CENTS: 50
    precision: "whole cents"
    variants:
      - { name: estimate, when: "at creation", difference: "computed from requested_start/requested_end/expected_attendees" }
      - { name: final, when: "at issuance", difference: "computed from approved_start/approved_end (possibly narrowed by the clerk) — diverges from estimate when the window is shortened" }

  - name: property_chronic_status
    trigger: "substantiate cascade hop 2 / dismiss cascade hop 2"
    algorithm: threshold
    formula: |
      count = number of Enforcements for Property with status != DISMISSED and
              issued_at within CHRONIC_WINDOW_DAYS of now
      substantiated_violation_count = count
      if count >= CHRONIC_DESIGNATED_THRESHOLD:   chronic_status = DESIGNATED
      elif count >= CHRONIC_WATCH_THRESHOLD:       chronic_status = WATCH
      else:                                        chronic_status = NONE
    input_set: "non-dismissed Enforcements for the Property within the rolling window"
    constants:
      CHRONIC_WATCH_THRESHOLD: 2
      CHRONIC_DESIGNATED_THRESHOLD: 3
      CHRONIC_WINDOW_DAYS: 365
    precision: "integer count; thresholds use >= (inclusive)"
    note: "Conserved quantity: substantiated_violation_count always equals the live non-dismissed Enforcement count in the window."

  - name: enforcement_balance
    trigger: "POST /enforcements/{id}/payments; hearing REDUCED/DISMISSED refund cascade; GET /enforcements/{id}"
    algorithm: aggregation
    formula: |
      amount_paid_cents = sum(Payment.amount_cents where enforcement_id=E, kind=PAYMENT, status=CLEARED)
                        - sum(Payment.amount_cents where enforcement_id=E, kind=REFUND,  status=CLEARED)
      amount_outstanding_cents = effective_fine_cents + late_penalty_cents - amount_paid_cents
      # Invariant (money conservation): amount_paid_cents + amount_outstanding_cents == effective_fine_cents + late_penalty_cents
    input_set: "all CLEARED Payment rows for the Enforcement"
    constants: {}
    precision: "whole cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path resource ids exist, validated left-to-right; FK body ids exist"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all id-bearing endpoints"
  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, types correct, enums in range, window end > start"
    error_id: "ERR_VALIDATION | ERR_INVALID_ENUM | ERR_INVALID_WINDOW"
    http_status: 400
    applies_to: "all writes"
  - priority: 5
    category: state
    check: "Target resource in the correct state for the operation (e.g. complaint UNDER_REVIEW to substantiate, enforcement CONTESTED to schedule hearing, hearing PENDING to decide, variance UNDER_REVIEW to issue/deny, property UNDER_ABATEMENT to comply, enforcement tier CITATION to contest)"
    error_id: "ERR_COMPLAINT_NOT_UNDER_REVIEW | ERR_ENFORCEMENT_NOT_CONTESTED | ERR_HEARING_NOT_PENDING | ERR_VARIANCE_NOT_UNDER_REVIEW | ERR_VARIANCE_NOT_ISSUED | ERR_ENFORCEMENT_NOT_CITATION | ERR_PROPERTY_NOT_UNDER_ABATEMENT | ERR_REFERRAL_INVALID_STATE | ERR_INVALID_STATE"
    http_status: 409
    applies_to: "state-transition endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version (when the endpoint requires it)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /enforcements/{id}/payments, POST /abatement-orders"
  - priority: 7
    category: business_referential
    check: "Cross-entity linkage holds: policy exists for the Property zoning; on manual abatement, enforcement_id (if given) belongs to property_id; uniqueness of NoiseLimitPolicy per zoning_type"
    error_id: "ERR_DUPLICATE_POLICY | ERR_POLICY_NOT_CONFIGURED | ERR_ENFORCEMENT_PROPERTY_MISMATCH"
    http_status: 409
    applies_to: "POST /noise-policies, POST /complaints/{id}/inspections, POST /abatement-orders"
  - priority: 8
    category: business_temporal
    check: "Temporal / interval rules: no ISSUED variance covers a complaint being substantiated; no overlapping ISSUED variance window on a Property; no hearing slot within the officer buffer; abatement escalation only at/after deadline"
    error_id: "ERR_VARIANCE_COVERS_COMPLAINT | ERR_VARIANCE_WINDOW_OVERLAP | ERR_HEARING_SLOT_CONFLICT | ERR_ABATEMENT_DEADLINE_NOT_REACHED"
    http_status: 409
    applies_to: "POST /complaints/{id}/substantiate, POST /variance-permits/{id}/issue, POST /enforcements/{id}/hearings, POST /abatement-orders/{id}/escalate"
  - priority: 9
    category: business_safety
    check: "Segregation of duties: the HearingOfficer deciding a hearing must not be the CodeOfficer who issued the enforcement"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /hearings/{id}/decide"
  - priority: 10
    category: business_constraint
    check: "Domain thresholds: substantiation needs an inspection over the limit; variance permitted_max_db within cap; reduction_pct in [0,1)"
    error_id: "ERR_NO_INSPECTION_ON_RECORD | ERR_NOISE_WITHIN_LIMIT | ERR_VARIANCE_DB_EXCEEDS_CAP | ERR_REDUCTION_PCT_INVALID"
    http_status: 422
    applies_to: "POST /complaints/{id}/substantiate, POST /variance-permits/{id}/issue, POST /hearings/{id}/decide"
  - priority: 11
    category: business_fiscal
    check: "Payment amount_cents must not exceed the current amount_outstanding_cents"
    error_id: ERR_PAYMENT_EXCEEDS_OUTSTANDING
    http_status: 402
    applies_to: "POST /enforcements/{id}/payments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Property ----
  - { method: POST, path: "/properties", description: "Register a parcel", roles: [CodeOfficer, SystemAdmin], code: 201,
      input: [address, zoning_type], output: Property,
      side_effects: ["chronic_status=NONE, abatement_status=NONE, substantiated_violation_count=0"] }
  - { method: GET, path: "/properties", description: "List parcels", roles: &all_roles [CodeOfficer, HearingOfficer, PermitClerk, Resident, SystemAdmin], code: 200,
      input: ["zoning_type?", "chronic_status?", "limit?", "offset?"], output: "Property[]", side_effects: [] }
  - { method: GET, path: "/properties/{id}", description: "Get a parcel (posture + counts)", roles: *all_roles, code: 200,
      input: [], output: Property, side_effects: [] }

  # ---- NoiseLimitPolicy ----
  - { method: POST, path: "/noise-policies", description: "Configure day/night decibel limits for a zoning_type (unique)", roles: [SystemAdmin], code: 201,
      input: [zoning_type, day_limit_db, night_limit_db, day_start_hour, night_start_hour], output: NoiseLimitPolicy,
      side_effects: ["rejects duplicate zoning_type with ERR_DUPLICATE_POLICY"] }
  - { method: GET, path: "/noise-policies", description: "List configured policies", roles: *all_roles, code: 200,
      input: ["zoning_type?"], output: "NoiseLimitPolicy[]", side_effects: [] }

  # ---- VariancePermit ----
  - { method: POST, path: "/variance-permits", description: "Apply for a construction/event variance (starts UNDER_REVIEW)", roles: [Resident, PermitClerk], code: 201,
      input: [property_id, permit_type, requested_start, requested_end, permitted_max_db, "expected_attendees?"], output: VariancePermit,
      side_effects: ["fee_estimate_cents computed from requested window (calc variance_fee variant=estimate)"] }
  - { method: GET, path: "/variance-permits", description: "List variances (reverse-reachability for Property FK)", roles: *all_roles, code: 200,
      input: ["property_id?", "status?", "permit_type?", "limit?", "offset?"], output: "VariancePermit[]", side_effects: [] }
  - { method: GET, path: "/variance-permits/{id}", description: "Get a variance", roles: *all_roles, code: 200,
      input: [], output: VariancePermit, side_effects: [] }
  - { method: POST, path: "/variance-permits/{id}/issue", description: "Issue a variance (UNDER_REVIEW -> ISSUED)", roles: [PermitClerk], code: 200,
      input: ["approved_start?", "approved_end?", "permitted_max_db?"], output: VariancePermit,
      side_effects: ["lock approved window", "fee_final_cents computed (calc variance_fee variant=final)", "overlap + cap checks"] }
  - { method: POST, path: "/variance-permits/{id}/deny", description: "Deny a variance (UNDER_REVIEW -> DENIED)", roles: [PermitClerk], code: 200,
      input: ["reason?"], output: VariancePermit, side_effects: [] }
  - { method: POST, path: "/variance-permits/{id}/revoke", description: "Revoke an issued variance (ISSUED -> REVOKED)", roles: [PermitClerk], code: 200,
      input: ["reason?"], output: VariancePermit, side_effects: [] }

  # ---- Complaint ----
  - { method: POST, path: "/complaints", description: "Intake a noise complaint", roles: [Resident, CodeOfficer], code: 201,
      input: [property_id, reported_at, noise_type, "reported_decibel?", "source?", "complainant_contact?"], output: Complaint,
      side_effects: ["status=RECEIVED"] }
  - { method: GET, path: "/complaints", description: "List complaints (reverse-reachability for Property FK)", roles: *all_roles, code: 200,
      input: ["property_id?", "status?", "limit?", "offset?"], output: "Complaint[]", side_effects: [] }
  - { method: GET, path: "/complaints/{id}", description: "Get a complaint", roles: *all_roles, code: 200,
      input: [], output: Complaint, side_effects: [] }
  - { method: POST, path: "/complaints/{id}/review", description: "Open a complaint for review (RECEIVED -> UNDER_REVIEW)", roles: [CodeOfficer], code: 200,
      input: [], output: Complaint, side_effects: [] }
  - { method: POST, path: "/complaints/{id}/inspections", description: "Record a field decibel reading", roles: [CodeOfficer], code: 201,
      input: [measured_decibel, measured_at], output: Inspection,
      side_effects: ["effective_limit_db resolved (calc effective_noise_limit)", "exceeds_limit computed (calc inspection_exceeds_limit)", "inspected_by_user_id = X-User-ID"] }
  - { method: GET, path: "/complaints/{id}/inspections", description: "List readings for a complaint (reverse-reachability for Complaint FK)", roles: *all_roles, code: 200,
      input: [], output: "Inspection[]", side_effects: [] }
  - { method: POST, path: "/complaints/{id}/substantiate", description: "Substantiate a complaint; issues an Enforcement + cascades", roles: [CodeOfficer], code: 201,
      input: [], output: Enforcement,
      side_effects: ["complaint -> SUBSTANTIATED", "CREATE Enforcement (fine_escalation)", "Property count/chronic recompute", "auto AbatementOrder on DESIGNATED", "increments Property.version by 1"] }
  - { method: POST, path: "/complaints/{id}/dismiss", description: "Dismiss a complaint (UNDER_REVIEW -> DISMISSED)", roles: [CodeOfficer], code: 200,
      input: ["reason?"], output: Complaint, side_effects: [] }

  # ---- CrossAgencyReferral ----
  - { method: POST, path: "/referrals", description: "Refer a complaint to another agency", roles: [CodeOfficer], code: 201,
      input: [complaint_id, agency, "reason?"], output: CrossAgencyReferral, side_effects: ["status=OPEN"] }
  - { method: GET, path: "/referrals", description: "List referrals (reverse-reachability for Complaint FK)", roles: *all_roles, code: 200,
      input: ["complaint_id?", "status?"], output: "CrossAgencyReferral[]", side_effects: [] }
  - { method: GET, path: "/referrals/{id}", description: "Get a referral", roles: *all_roles, code: 200,
      input: [], output: CrossAgencyReferral, side_effects: [] }
  - { method: POST, path: "/referrals/{id}/acknowledge", description: "Agency acknowledges (OPEN -> ACKNOWLEDGED)", roles: [CodeOfficer], code: 200,
      input: [], output: CrossAgencyReferral, side_effects: [] }
  - { method: POST, path: "/referrals/{id}/close", description: "Close a referral (-> CLOSED)", roles: [CodeOfficer], code: 200,
      input: ["resolution?"], output: CrossAgencyReferral, side_effects: [] }

  # ---- Enforcement ----
  - { method: GET, path: "/enforcements", description: "List enforcements (reverse-reachability for Complaint & Property FKs)", roles: *all_roles, code: 200,
      input: ["complaint_id?", "property_id?", "status?", "tier?", "limit?", "offset?"], output: "Enforcement[]", side_effects: [] }
  - { method: GET, path: "/enforcements/{id}", description: "Get an enforcement (fine + live balance + late penalty)", roles: *all_roles, code: 200,
      input: [], output: Enforcement, side_effects: ["late_penalty_cents & balance computed on read"] }
  - { method: POST, path: "/enforcements/{id}/contest", description: "Appeal a citation (ISSUED -> CONTESTED)", roles: [Resident], code: 200,
      input: [], output: Enforcement, side_effects: ["requires tier==CITATION", "increments Enforcement.version by 1"] }
  - { method: POST, path: "/enforcements/{id}/hearings", description: "Schedule an appeal hearing (CONTESTED -> HEARING_SCHEDULED)", roles: [HearingOfficer], code: 201,
      input: [scheduled_at, hearing_officer_id, "duration_minutes?"], output: Hearing,
      side_effects: ["officer-buffer overlap check", "CREATE Hearing(PENDING)", "increments Enforcement.version by 1"] }
  - { method: GET, path: "/enforcements/{id}/hearings", description: "List hearings for an enforcement (reverse-reachability for Enforcement FK)", roles: *all_roles, code: 200,
      input: [], output: "Hearing[]", side_effects: [] }
  - { method: POST, path: "/enforcements/{id}/payments", description: "Record a fine payment (OCC-guarded)", roles: [Resident], code: 201,
      input: [amount_cents, expected_enforcement_version, "method?"], output: Payment,
      side_effects: ["balance recompute", "auto -> PAID when outstanding <= 0", "increments Enforcement.version by 1"] }
  - { method: GET, path: "/enforcements/{id}/payments", description: "List ledger rows for an enforcement (reverse-reachability for Enforcement FK)", roles: *all_roles, code: 200,
      input: [], output: "Payment[]", side_effects: [] }

  # ---- Hearing ----
  - { method: POST, path: "/hearings/{id}/decide", description: "Record a hearing outcome (PENDING -> UPHELD|REDUCED|DISMISSED|REMANDED)", roles: [HearingOfficer], code: 200,
      input: [outcome, "reduction_pct?"], output: Hearing,
      side_effects: ["SoD check", "enforcement transition + fine/refund/chronic cascades per outcome"] }

  # ---- AbatementOrder ----
  - { method: POST, path: "/abatement-orders", description: "Open a manual abatement order for a delinquent citation (OCC-guarded on Property)", roles: [CodeOfficer], code: 201,
      input: [property_id, expected_property_version, "enforcement_id?", "compliance_deadline?"], output: AbatementOrder,
      side_effects: ["trigger_source=DELINQUENT_CITATION", "Property.abatement_status -> UNDER_ABATEMENT", "increments Property.version by 1"] }
  - { method: GET, path: "/abatement-orders", description: "List abatement orders (reverse-reachability for Property & Enforcement FKs)", roles: *all_roles, code: 200,
      input: ["property_id?", "enforcement_id?", "status?", "limit?", "offset?"], output: "AbatementOrder[]", side_effects: [] }
  - { method: GET, path: "/abatement-orders/{id}", description: "Get an abatement order", roles: *all_roles, code: 200,
      input: [], output: AbatementOrder, side_effects: [] }
  - { method: POST, path: "/abatement-orders/{id}/comply", description: "Mark compliance (PENDING -> COMPLIED)", roles: [CodeOfficer], code: 200,
      input: [], output: AbatementOrder, side_effects: ["Property.abatement_status -> ABATED", "increments Property.version by 1"] }
  - { method: POST, path: "/abatement-orders/{id}/escalate", description: "Escalate past-deadline non-compliance (PENDING -> ESCALATED)", roles: [CodeOfficer], code: 200,
      input: [], output: AbatementOrder, side_effects: ["requires current_utc >= compliance_deadline"] }

  # ---- Test-driving logical clock ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly that default and never falls back to wall-clock.", roles: [SystemAdmin], code: 200,
      input: [to_iso8601], output: "null", side_effects: ["all subsequent issued_at/due_date/decided_at/overdue computations use this instant"] }

