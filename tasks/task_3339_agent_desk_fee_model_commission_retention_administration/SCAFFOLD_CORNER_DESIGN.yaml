  # ===========================================================================
  - section: endpoints
    instances:

      - name: fee_assignment_create_with_stale_agent_version_returns_412
        claim_type: Action endpoint
        grounds:
          - concurrency_rules[fee-assignment-stale-agent]
          - errors.ERR_STALE_VERSION
          - endpoints.POST_/agents/{agentId}/fee-assignments
        distinguishing_aspect: "OCC on Agent.version: after the first assignment create bumps the agent's version, a second create carrying the stale expected_agent_version is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Logical clock 2026-09-10. Alice PENDING_ONBOARDING at version 1; one schedule."]
          setup_api_calls:
            - *k_clock
            - *k_office
            - *k_sched
            - *k_alice
          trigger:
            - call: "POST /agents/${alice_id}/fee-assignments"
              payload: { fee_schedule_id: "${sched_id}", effective_from: "2026-01-01T00:00:00Z", effective_to: "9999-12-31T00:00:00Z", expected_agent_version: "${alice_v0}" }
              as: ManagingBroker
              captures: { fa_id: $.data.id }
            - call: "POST /agents/${alice_id}/fee-assignments"
              payload: { fee_schedule_id: "${sched_id}", effective_from: "2026-01-01T00:00:00Z", effective_to: "9999-12-31T00:00:00Z", expected_agent_version: "${alice_v0}" }
              as: ManagingBroker
              captures: { err_id: $.data.error_id }
          assert:
            - "the first create returns 201 and bumps Agent.${alice_id}.version to 2"
            - "the second create with the stale version returns 412 and err_id == ERR_STALE_VERSION"
            - "GET /agents/${alice_id}/fee-assignments returns exactly 1 PROPOSED row (the second was not persisted)"

      - name: second_proposed_assignment_supersedes_the_first
        claim_type: Cross-reference link
        grounds:
          - state_machines.FeeAssignment.PROPOSED_to_SUPERSEDED
        distinguishing_aspect: "Creating a second PROPOSED assignment while one is pending auto-supersedes the first: the old row reads SUPERSEDED and only the new row is PROPOSED."
        test_recipe:
          setup: ["Logical clock 2026-09-10. Alice PENDING_ONBOARDING; two schedules (95/5 and 90/10)."]
          setup_api_calls:
            - *k_clock
            - *k_office
            - *k_sched
            - &k_sched2
              call: "POST /fee-schedules"
              payload: { schedule_name: "90/10 Desk Plan", desk_fee_cents: 200000, overhead_share_bps: 600, retention_bps: 9000, referral_fee_bps: 2500, tech_subscription_monthly_cents: 25000, marketing_monthly_cents: 40000, effective_from: "2026-01-01T00:00:00Z", effective_to: "9999-12-31T00:00:00Z" }
              as: BrokerOfRecord
              captures: { sched2_id: $.data.id }
            - *k_alice
          trigger:
            - call: "POST /agents/${alice_id}/fee-assignments"
              payload: { fee_schedule_id: "${sched_id}", effective_from: "2026-01-01T00:00:00Z", effective_to: "9999-12-31T00:00:00Z", expected_agent_version: "${alice_v0}" }
              as: ManagingBroker
              captures: { fa1_id: $.data.id }
            - call: "GET /agents/${alice_id}"
              payload: {}
              as: ManagingBroker
              captures: { alice_v1: $.data.version }
            - call: "POST /agents/${alice_id}/fee-assignments"
              payload: { fee_schedule_id: "${sched2_id}", effective_from: "2026-01-01T00:00:00Z", effective_to: "9999-12-31T00:00:00Z", expected_agent_version: "${alice_v1}" }
