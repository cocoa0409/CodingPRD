              captures: { o1: $.data.id }
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "MACHINING" }
              as: ShopTechnician
            - call: "POST /operations/${o1}/perform"
              payload: { station_code: "STN-DS", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", result: "PASS" }
              as: ShopTechnician
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "ASSEMBLY" }
              as: ShopTechnician
            - call: "GET /work-orders/${w1}"
              as: PlantAdmin
              captures: { e1: $.data.reman_engine_id }
            - call: "POST /work-orders/${w1}/advance"
