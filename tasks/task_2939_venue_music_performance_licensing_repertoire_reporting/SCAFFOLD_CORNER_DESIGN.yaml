  - section: validations
    instances:
      - name: corner_validation_missing_auth_headers_returns_unauthenticated
        claim_type: violation_error
        grounds:
          - validations.priority_1_ERR_UNAUTHENTICATED
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Priority 1 fires before existence and before role checks: an omitted X-User-ID, an empty-string X-User-Role and an undeclared role name all return 401 ERR_UNAUTHENTICATED, even on a GET whose path id is valid."
        test_recipe:
          setup:
            - "Venue V1 exists, so the path id in every trigger call resolves"
          setup_api_calls:
            - call: "POST /licensing/venues"
              payload: { legal_name: "Blue Note Grill", venue_category: "BAR_GRILL", seating_capacity: 120, standing_capacity: 180, occupancy_limit: 200, music_use_profile: "MIXED", weekly_live_performance_nights: 4, annual_cover_revenue_cents: 4200000 }
              as: LicensingAdmin
              captures: { v1_id: "$.data.id" }
          trigger:
            - call: "GET /licensing/venues/${v1_id}"
              payload: {}
              as: LicensingAdmin
              headers_override: "X-User-ID header omitted entirely; X-User-Role still LicensingAdmin"
              captures: { err_a: "$.data.error_id" }
            - call: "GET /licensing/venues/${v1_id}"
              payload: {}
              as: LicensingAdmin
              headers_override: "X-User-Role sent as the empty string \"\" (not spaces); X-User-ID present"
              captures: { err_b: "$.data.error_id" }
            - call: "GET /licensing/venues/${v1_id}"
              payload: {}
              as: LicensingAdmin
              headers_override: "X-User-Role sent as Auditor, which is not one of the four declared roles"
              captures: { err_c: "$.data.error_id" }
            - call: "POST /licensing/venues"
              payload: { legal_name: "Ghost Venue", venue_category: "BAR_GRILL", seating_capacity: 10, standing_capacity: 10, occupancy_limit: 20, music_use_profile: "MIXED", weekly_live_performance_nights: 0, annual_cover_revenue_cents: 0 }
              as: LicensingAdmin
              headers_override: "both X-User-ID and X-User-Role omitted"
              captures: { err_d: "$.data.error_id" }
          assert:
            - "All four calls return HTTP 401 with data.error_id == ERR_UNAUTHENTICATED: ${err_a}, ${err_b}, ${err_c} and ${err_d}"
            - "The third call is NOT ERR_FORBIDDEN_ROLE: an unrecognised role name fails authentication, it is not an authorisation failure"
            - "The fourth call created nothing: GET /licensing/venues returns total_count == 1"
            - "POST /_clock/set_current_utc still succeeds with no auth headers at all, being the one exempt endpoint"

      - name: corner_validation_operator_cross_venue_access_forbidden
        claim_type: violation_error
        grounds:
          - validations.priority_2_ERR_FORBIDDEN_ROLE
          - roles.VenueOperator.identity
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "For a VenueOperator the row must resolve to X-User-ID through venue_id, license_id or performance_report_id, so operator B is refused on venue A's application even though the endpoint itself allows VenueOperator."
        test_recipe:
          setup:
            - "Venues V1 and V6 both exist; V1 has a DRAFT application A1"
          setup_api_calls:
            - call: "POST /licensing/societies"
              payload: { society_code: "BMI", display_name: "Broadcast Music Inc", repertoire_share_bp: 4600 }
              as: LicensingAdmin
              captures: { bmi_id: "$.data.id" }
            - call: "POST /licensing/venues"
              payload: { legal_name: "Blue Note Grill", venue_category: "BAR_GRILL", seating_capacity: 120, standing_capacity: 180, occupancy_limit: 200, music_use_profile: "MIXED", weekly_live_performance_nights: 4, annual_cover_revenue_cents: 4200000 }
              as: LicensingAdmin
              captures: { v1_id: "$.data.id", v1_v0: "$.data.version" }
            - call: "POST /licensing/venues"
              payload: { legal_name: "Rival Room", venue_category: "NIGHTCLUB", seating_capacity: 0, standing_capacity: 300, occupancy_limit: 320, music_use_profile: "RECORDED_ONLY", weekly_live_performance_nights: 0, annual_cover_revenue_cents: 900000 }
              as: LicensingAdmin
              captures: { v6_id: "$.data.id" }
            - call: "POST /licensing/license-applications"
              payload: { venue_id: "${v1_id}", society_id: "${bmi_id}", requested_license_type: "BLANKET", declared_seating: 120, declared_standing: 180, declared_cover_revenue_cents: 4200000, declared_live_nights: 4, declared_music_use_profile: "MIXED", requested_term_start: "2026-08-01T00:00:00Z", expected_venue_version: "${v1_v0}" }
              as: VenueOperator
              as_user_id: "${v1_id}"
              captures: { app1_id: "$.data.id", app1_ver: "$.data.version" }
          trigger:
            - call: "POST /licensing/license-applications/${app1_id}/submit"
              payload: {}
              as: VenueOperator
              as_user_id: "${v6_id}"
              captures: { err_a: "$.data.error_id" }
            - call: "PATCH /licensing/license-applications/${app1_id}"
              payload: { declared_live_nights: 0 }
              as: VenueOperator
              as_user_id: "${v6_id}"
              captures: { err_b: "$.data.error_id" }
            - call: "POST /licensing/venues"
              payload: { legal_name: "Operator Venue", venue_category: "BAR_GRILL", seating_capacity: 10, standing_capacity: 10, occupancy_limit: 20, music_use_profile: "MIXED", weekly_live_performance_nights: 0, annual_cover_revenue_cents: 0 }
              as: VenueOperator
              as_user_id: "${v1_id}"
              captures: { err_c: "$.data.error_id" }
          assert:
            - "All three calls return HTTP 403 with data.error_id == ERR_FORBIDDEN_ROLE: ${err_a}, ${err_b} and ${err_c}"
            - "The first two failed on row ownership even though VenueOperator is an allowed role for submit and PATCH"
            - "The third failed on the role table itself, POST /licensing/venues being LicensingAdmin-exclusive"
            - "LicenseApplication.${app1_id} is still DRAFT with version ${app1_ver} and declared_live_nights 4"
            - "The same submit issued by V1's own operator succeeds, proving the endpoint was reachable"

      - name: corner_validation_path_ids_resolved_before_body_returns_not_found
        claim_type: violation_error
        grounds:
          - validations.priority_3_existence
          - errors[ERR_LICENSE_NOT_FOUND]
          - errors[ERR_REPORT_NOT_FOUND]
        distinguishing_aspect: "Priority 3 outranks priority 5, so an unknown path id returns its own 404 family even when the request body is simultaneously malformed."
        test_recipe:
          setup:
            - "No rows are needed; the ids used are absent by construction"
          setup_api_calls:
            - call: "POST /licensing/venues"
              payload: { legal_name: "Blue Note Grill", venue_category: "BAR_GRILL", seating_capacity: 120, standing_capacity: 180, occupancy_limit: 200, music_use_profile: "MIXED", weekly_live_performance_nights: 4, annual_cover_revenue_cents: 4200000 }
              as: LicensingAdmin
              captures: { v1_id: "$.data.id" }
          trigger:
            - call: "GET /licensing/licenses/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: LicensingAdmin
              captures: { err_a: "$.data.error_id" }
            - call: "POST /licensing/performance-reports/00000000-0000-4000-8000-000000000002/setlist-entries"
              payload: { work_title: "Nowhere Song", writer_name: "N. Body", society_affiliation: "BMI", performance_datetime: "2026-09-05T20:00:00Z", use_type: "LIVE", duration_seconds: 300 }
              as: LicensingAdmin
              captures: { err_b: "$.data.error_id" }
            - call: "POST /licensing/audit-cases/00000000-0000-4000-8000-000000000003/close"
              payload: { closed_reason: "NO_GAP_FOUND" }
              as: ComplianceAuditor
              captures: { err_c: "$.data.error_id" }
            - call: "POST /licensing/venues/00000000-0000-4000-8000-000000000004/exemption-analysis"
              payload: {}
              as: LicensingAdmin
              captures: { err_d: "$.data.error_id" }
          assert:
            - "${err_a} == ERR_LICENSE_NOT_FOUND, ${err_b} == ERR_REPORT_NOT_FOUND, ${err_c} == ERR_AUDIT_CASE_NOT_FOUND, ${err_d} == ERR_VENUE_NOT_FOUND, all HTTP 404"
            - "The second call's body is well formed, so the 404 is unambiguous; repeating it with a missing work_title still returns ERR_REPORT_NOT_FOUND rather than ERR_INVALID_REQUEST"
            - "Venue.${v1_id} is untouched and no rows were created"

      - name: corner_validation_body_foreign_keys_missing_required_referent_not_found
        claim_type: violation_error
        grounds:
          - validations.priority_4_business_referential
          - errors[ERR_SOCIETY_NOT_FOUND]
          - errors[ERR_VENUE_NOT_FOUND]
        distinguishing_aspect: "Foreign keys carried in the request body are validated too, including every element of the society_ids array, and they report the referent's own 404 family rather than ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Society BMI and Venue V1 exist so that each trigger call has exactly one bad reference"
          setup_api_calls:
            - call: "POST /licensing/societies"
              payload: { society_code: "BMI", display_name: "Broadcast Music Inc", repertoire_share_bp: 4600 }
              as: LicensingAdmin
              captures: { bmi_id: "$.data.id" }
            - call: "POST /licensing/venues"
              payload: { legal_name: "Blue Note Grill", venue_category: "BAR_GRILL", seating_capacity: 120, standing_capacity: 180, occupancy_limit: 200, music_use_profile: "MIXED", weekly_live_performance_nights: 4, annual_cover_revenue_cents: 4200000 }
              as: LicensingAdmin
              captures: { v1_id: "$.data.id", v1_v0: "$.data.version" }
          trigger:
            - call: "POST /licensing/rate-schedules"
              payload: { society_id: "00000000-0000-4000-8000-000000000005", venue_category: "BAR_GRILL", effective_from: "2026-01-01T00:00:00Z" }
              as: LicensingAdmin
              captures: { err_a: "$.data.error_id" }
            - call: "POST /licensing/license-applications"
              payload: { venue_id: "00000000-0000-4000-8000-000000000006", society_id: "${bmi_id}", requested_license_type: "BLANKET", declared_seating: 120, declared_standing: 180, declared_cover_revenue_cents: 4200000, declared_live_nights: 4, declared_music_use_profile: "MIXED", requested_term_start: "2026-08-01T00:00:00Z", expected_venue_version: "${v1_v0}" }
              as: LicensingAdmin
              captures: { err_b: "$.data.error_id" }
            - call: "POST /licensing/audit-cases"
              payload: { venue_id: "${v1_id}", audit_trigger: "ROUTINE", lookback_start: "2025-01-01T00:00:00Z", lookback_end: "2026-01-01T00:00:00Z", society_ids: ["${bmi_id}", "00000000-0000-4000-8000-000000000007"] }
              as: ComplianceAuditor
              captures: { err_c: "$.data.error_id" }
            - call: "POST /licensing/performance-reports"
              payload: { license_id: "00000000-0000-4000-8000-000000000008", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: LicensingAdmin
              captures: { err_d: "$.data.error_id" }
          assert:
            - "${err_a} == ERR_SOCIETY_NOT_FOUND, ${err_b} == ERR_VENUE_NOT_FOUND, ${err_c} == ERR_SOCIETY_NOT_FOUND, ${err_d} == ERR_LICENSE_NOT_FOUND, all HTTP 404"
            - "The third call proves array elements are checked: the first element resolved and the second did not"
            - "No RateSchedule, LicenseApplication, AuditCase or PerformanceReport row was created"
            - "Venue.${v1_id}.version is still ${v1_v0}, so a rejected create never bumps the OCC parent"

      - name: corner_validation_invalid_request_rejects_shape_enum_and_sign
        claim_type: violation_error
        grounds:
          - validations.priority_5_ERR_INVALID_REQUEST
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Priority 5 covers four distinct shape failures with one error id: a missing required field, an undeclared enum member, a negative *_cents value and a date-only string where an RFC 3339 UTC instant is required."
        test_recipe:
          setup:
            - "Society BMI exists so the schedule call fails only on its effective_from format"
