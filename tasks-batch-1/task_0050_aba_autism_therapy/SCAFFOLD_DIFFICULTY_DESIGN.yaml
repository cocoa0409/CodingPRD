          assert:
            - "After schedule: GET /authorizations/${auth_id} shows reserved_direct_units == 8, delivered_direct_units == 0, remaining_direct_units == 312 (sum == 320)"
            - "After cancel: GET /authorizations/${auth_id} shows reserved_direct_units == 0, delivered_direct_units == 0, remaining_direct_units == 320 (sum == 320, zero drift)"

      - name: claim_money_conserved_allowed_equals_patient_plus_payer
        grounds:
          - calculations.claim_remittance
          - state_machines.Claim.SUBMITTED_to_PAID
          - entities.Claim.fields.allowed_cents
          - entities.Claim.fields.payer_paid_cents
        distinguishing_aspect: |
          Conserved quantity = CENTS (different from units): on PAID,
          allowed_cents == patient_responsibility_cents + payer_paid_cents exactly
          (19600 == 3920 + 15680); the remittance split leaves no money drift.
        test_recipe:
          setup:
            - "A DIRECT session delivered 7 units, supervision COMPLIANT, claim submitted then paid; payer allowed_rate 2800, coinsurance 0.20."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Clover ABA", allowed_rate_cents: 2800, coinsurance_pct: 0.20, supervision_ratio_pct: 0.10 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr BCBA18", credential: "BCBA", npi: "1000000170" }
              as: IntakeCoordinator
              captures: { bcba_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "RBT Eighteen", credential: "RBT", npi: "1000000171", supervising_bcba_id: "${bcba_id}" }
              as: IntakeCoordinator
              captures: { rbt_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Child R", date_of_birth: "2016-06-06", caregiver_user_id: "cg-18", insurance_payer_id: "${payer_id}" }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /diagnostic-evaluations"
              payload: { client_id: "${client_id}", evaluator_bcba_id: "${bcba_id}", assessment_score: 130 }
              as: BCBA
              as_user_id: "${bcba_id}"
              captures: { eval_id: $.data.id }
            - call: "POST /diagnostic-evaluations/${eval_id}/submit"
              payload: {}
              as: BCBA
              as_user_id: "${bcba_id}"
            - call: "POST /diagnostic-evaluations/${eval_id}/review"
              payload: { decision: "FINALIZE" }
              as: IntakeCoordinator
            - call: "POST /treatment-plans"
              payload: { client_id: "${client_id}", evaluation_id: "${eval_id}", author_bcba_id: "${bcba_id}", requested_direct_units: 100, requested_supervision_units: 20, requested_parent_training_units: 8 }
              as: BCBA
              as_user_id: "${bcba_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /treatment-plans/${plan_id}/submit"
              payload: {}
              as: BCBA
              as_user_id: "${bcba_id}"
            - call: "POST /treatment-plans/${plan_id}/review"
              payload: { decision: "APPROVE" }
              as: IntakeCoordinator
            - call: "POST /authorizations"
              payload: { treatment_plan_id: "${plan_id}", payer_id: "${payer_id}", authorized_direct_units: 100, authorized_supervision_units: 20, authorized_parent_training_units: 8, period_start: "2026-01-01", period_end: "2026-12-31" }
              as: BillingSpecialist
              captures: { auth_id: $.data.id }
            - call: "POST /therapy-sessions"
              payload: { authorization_id: "${auth_id}", provider_id: "${rbt_id}", service_line: "DIRECT_THERAPY", scheduled_start: "2026-04-10T09:00:00Z", scheduled_end: "2026-04-10T11:00:00Z", scheduled_units: 8 }
              as: RBT
              as_user_id: "${rbt_id}"
              captures: { direct_sess_id: $.data.id }
            - call: "POST /therapy-sessions/${direct_sess_id}/deliver"
              payload: { delivered_units: 7 }
              as: RBT
              as_user_id: "${rbt_id}"
            - call: "POST /therapy-sessions"
              payload: { authorization_id: "${auth_id}", provider_id: "${bcba_id}", service_line: "SUPERVISION", scheduled_start: "2026-04-10T11:30:00Z", scheduled_end: "2026-04-10T12:00:00Z", scheduled_units: 2 }
              as: BCBA
              as_user_id: "${bcba_id}"
              captures: { sup_sess_id: $.data.id }
            - call: "POST /therapy-sessions/${sup_sess_id}/deliver"
              payload: { delivered_units: 1 }
              as: BCBA
              as_user_id: "${bcba_id}"
            - call: "POST /claims"
              payload: { session_id: "${direct_sess_id}" }
              as: BillingSpecialist
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/submit"
              payload: {}
              as: BillingSpecialist
          trigger:
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: { decision: "PAY" }
              as: BillingSpecialist
          assert:
            - "Claim.${claim_id}.allowed_cents == 19600, patient_responsibility_cents == 3920, payer_paid_cents == 15680"
            - "allowed_cents == patient_responsibility_cents + payer_paid_cents (19600 == 3920 + 15680, zero money drift)"
