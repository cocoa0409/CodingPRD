          safety_buffer_units: 2
          oversell_grace_units: 3
          default_lead_time_days: 5
          ack_sla_hours: 24
          ship_sla_grace_hours: 12
        as: PlatformAdmin
        captures:
          v2_id: $.data.id
      - call: POST /dropship/vendors/${v2_id}/begin-integration
        payload: {}
        as: VendorOpsAnalyst
      - call: POST /dropship/vendors/${v2_id}/integration-tests
        payload:
          message_type: CATALOG
          sample_payload_digest: sha256-V2-catalog
        as: VendorOpsAnalyst
        as_user_id: ops-recorder-V2
        captures:
          v2_t_catalog: $.data.id
      - call: POST /dropship/vendors/${v2_id}/integration-tests
        payload:
          message_type: INVENTORY
