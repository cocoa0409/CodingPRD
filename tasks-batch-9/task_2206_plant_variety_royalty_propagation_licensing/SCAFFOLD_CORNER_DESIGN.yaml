      - name: annuity_lapse_cascade_corner_deferred_to_difficulty_design
        claim_type: cascading_side_effects
        grounds:
          - state_machines[ProtectionFiling.status].transitions[MAINTENANCE_DUE->LAPSED]
          - complexity_profile.complexity_layers
        distinguishing_aspect: "The three-level protection-lapse cascade is exercised end to end by the difficulty design."
        excluded_because:
          difficulty_instance: annuity_grace_expiry_lapses_filing_then_strips_jurisdiction_then_revokes_sublicense_then_decrements_count
          rationale: "That transitive_cascade instance asserts every level: filing LAPSED, jurisdiction stripped from the variety's posture, dependent grant REVOKED and active_sublicense_count decremented."

      - name: audit_finding_cascade_corner_deferred_to_difficulty_design
        claim_type: cascading_side_effects
        grounds:
          - state_machines[AuditEngagement.status].transitions[OPENED->FINDINGS_ISSUED]
          - complexity_profile.complexity_layers
        distinguishing_aspect: "The four-level audit-finding cascade is exercised end to end by the difficulty design."
        excluded_because:
          difficulty_instance: material_audit_finding_disputes_report_then_zeroes_payable_then_suspends_agreement_then_freezes_quota
          rationale: "That transitive_cascade instance asserts the report dispute, the payable reversal, the agreement suspension and the quota freeze in one trigger."

      - name: dual_variant_royalty_corner_deferred_to_difficulty_design
        claim_type: dual_variant_calculation
        grounds:
          - calculations.royalty_report_totals
          - complexity_profile.complexity_layers
        distinguishing_aspect: "The reported-basis versus audited-basis variant pair is exercised with a numerically divergent case by the difficulty design."
        excluded_because:
          difficulty_instance: royalty_report_reported_basis_versus_audited_basis_divergence
          rationale: "That dual_variant_calc instance drives both variants over the same data and asserts the two different totals plus the overrun flag."

  # =====================================================================
  - section: consistency_model
    instances:
      - name: acceptance_response_already_carries_the_recomputed_totals
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
          - calculations.royalty_report_totals
          - state_machines[RoyaltyReport.review_status].transitions[SUBMITTED->ACCEPTED]
        distinguishing_aspect: "consistency_model is immediate, so the accept response body itself shows the audited-basis recomputation and the propagator's updated payable - no follow-up read is needed, and a follow-up read returns byte-identical values."
        test_recipe:
          setup:
            - "One Variety, one Propagator, one ACTIVE agreement, one ACTIVE quota of 5000 units with tags_activated_units 0."
            - "One on-time report with a single line of 100 units, submitted."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Larchmont Bramble", species: "Rubus idaeus", breeder_code: "LM", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { v_id: $.data.id }
            - call: "POST /propagators"
              payload: { legal_name: "Larchmont Nursery", home_territory_code: "US-WA" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { p_id: $.data.id }
            - call: "POST /propagator-agreements"
              payload: { propagator_id: "${p_id}", quality_tier: "TIER_B", territory_codes: ["US-WA"], term_start: "2026-08-01T00:00:00Z", term_end: "2027-08-01T00:00:00Z" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { a_id: $.data.id }
            - call: "POST /propagator-agreements/${a_id}/countersign"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-1"
            - call: "POST /production-quotas"
              payload: { agreement_id: "${a_id}", variety_id: "${v_id}", season_code: "2026S1", basis: "PER_PLANT", territory_code: "US-WA", territory_class: "DOMESTIC", allocated_units: 5000 }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { q_id: $.data.id }
            - call: "POST /royalty-reports"
              payload: { agreement_id: "${a_id}", period_code: "2026Q3", period_start: "2026-08-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z", due_at: "2026-11-15T00:00:00Z" }
              as: Propagator
              as_user_id: "${p_id}"
              captures: { r_id: $.data.id, r_ver: $.data.version }
            - call: "POST /royalty-reports/${r_id}/line-items"
