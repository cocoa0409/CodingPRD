      - name: mastery_threshold_boundary_is_inclusive
        claim_type: threshold
        excluded_because:
          difficulty_instance: mastery_threshold_inclusive_boundary
          rationale: "The threshold row's at / just-below boundary pair for calculations.attempt_final_score is the whole point of that boundary-precision instance, which scores 8000/8000 (exactly 80.00, MASTERED) against 8000/7998 (79.99, NOT_MASTERED) on the same rubric."

      - name: rubric_weights_sum_without_rounding_drift
        claim_type: weighted_scoring
        excluded_because:
          difficulty_instance: rubric_sum_then_round_dimension_order
          rationale: "The weighted-scoring row (weights sum correctly, rounding accumulation does not drift) is asserted there by pinning 76.14 for sum-then-round against the 76.15 the rejected round-then-sum ordering would produce."

      - name: blueprint_windows_tile_without_gap_or_overlap
        claim_type: interval_merge
        excluded_because:
          difficulty_instance: blueprint_window_contiguous_tiling_with_notice
          rationale: "The interval_merge row (adjacent intervals with gap 0, overlap rejected) is exactly the blueprint-supersession tiling that resource_temporal_overlap instance walks, including the notice-period interaction."

      - name: term_close_refund_tiers_evaluated_in_order
        claim_type: tiered_pricing
        excluded_because:
          difficulty_instance: term_close_refund_evaluation_order
          rationale: "The tiered_pricing row (tier boundary, marginal versus average rate, cross-tier straddling) is the combinatorial-formula instance's subject: it pins the 0.6000 earned-percentage tier, the refund and the 50/50 unearned split in one fixed order."

      - name: mastered_units_recompute_after_reversal
        claim_type: aggregation
        excluded_because:
          difficulty_instance: unit_conservation_on_integrity_void
          rationale: "The aggregation row's running-total-after-reversal claim over calculations.unit_conservation is what that compensating-invariant instance asserts, restoring mastered_unit_total and mastered_competency_count exactly."

      - name: aid_cents_identity_holds_after_return
        claim_type: aggregation
        excluded_because:
          difficulty_instance: aid_cents_conservation_on_return
          rationale: "The same aggregation row applied to calculations.aid_cents_conservation — the cents identity before and after the compensating DISBURSED -> RETURNED transition — is that instance's core assertion, so a second breadth test would only restate it."

      - name: credit_equivalency_variants_diverge_on_one_dataset
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: credit_equivalency_aid_floor_vs_transcript_round
          rationale: "The variant_divergence row (same data, two variants, verify the delta) is that dual-variant instance's subject: AID_TERM_FLOOR versus TRANSCRIPT_CUMULATIVE_ROUND over one mastery record, with the gap reported and deliberately unreconciled."

      - name: provisional_variant_selected_at_first_reader
        claim_type: variant_selection
        excluded_because:
          difficulty_instance: attempt_score_provisional_vs_final_two_readers
          rationale: "The variant_selection row (correct variant in the correct context) is asserted there: PROVISIONAL_SINGLE_READER after reader 1 and TWO_READER_MEAN once reader 2 lands, on the same attempt."

      - name: provisional_to_final_delta_applied_once
        claim_type: reconciliation
        excluded_because:
          difficulty_instance: attempt_score_provisional_vs_final_two_readers
          rationale: "The reconciliation row (delta correctly applied when the variant switches) is the second half of that instance: no units are awarded while provisional, and the unit and credit ledgers move exactly once when the final variant resolves."

