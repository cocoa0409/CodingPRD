            - { call: "POST /cases/${case_id}/request_info", payload: { rationale: "correct the suitability form" }, as: SuitabilityReviewer, as_user_id: "rev-1" }
          trigger:
            - { call: "POST /cases/${case_id}/documents", payload: { doc_type: "SUITABILITY_FORM" }, as: Producer, as_user_id: "${p_id}", captures: { d_2b: $.data.id } }
            - { call: "GET /cases/${case_id}", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1", captures: { case_v2: $.data.version } }
