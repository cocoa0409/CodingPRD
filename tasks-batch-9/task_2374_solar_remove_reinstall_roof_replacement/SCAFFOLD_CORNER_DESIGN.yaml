      - name: corner_weather_abort_threshold_restricts_posture_at_exactly_two_aborts
        claim_type: threshold
        grounds:
          - calculations.project_posture.constants.WEATHER_ABORT_RESTRICT_THRESHOLD
          - state_machines.WorkWindow.transitions["SCHEDULED -> WEATHER_ABORTED"].side_effects
        distinguishing_aspect: "The comparison is >= 2, so one abort must leave posture OPEN and the second must flip it to RESTRICTED in the same request that increments the counter. The two windows belong to different parties, so no crew-overlap rule interferes with the arrangement."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, before both window starts; WEATHER_ABORT has no time guard, unlike START."
            - "A HOST_OWNED project holds one roofer window on 2026-08-10 and one crew window on 2026-08-12."
          setup_api_calls:
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProjectCoordinator
            - call: "POST /reroof/parties"
              payload: { name: "Ridgeline Roofing", party_type: "ROOFER", contact_email: "ops@ridgeline.example" }
              as: ProjectCoordinator
              captures: { roofer_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "Alvarez Household", party_type: "SOLAR_OWNER", contact_email: "owner2@example.com" }
              as: ProjectCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "SunSystem Crew A", party_type: "SOLAR_CONTRACTOR", contact_email: "crew.a@sunsystem.example" }
              as: ProjectCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /reroof/projects"
              payload: { site_address: "77 Ocotillo Ln, Chandler AZ", ownership_model: "HOST_OWNED", system_dc_kw: 6.0, roofer_party_id: "${roofer_id}", solar_owner_party_id: "${owner_id}", solar_contractor_party_id: "${crew_id}", baseline_daily_kwh: 30.0, downtime_days_estimated: 4, upgrade_budget_cents: 2000000 }
              as: ProjectCoordinator
              captures: { p1: $.data.id }
            - call: "POST /reroof/work-windows"
              payload: { project_id: "${p1}", party_id: "${roofer_id}", trade: "ROOFING", start_utc: "2026-08-10T14:00:00Z", end_utc: "2026-08-10T22:00:00Z" }
              as: ProjectCoordinator
              captures: { w1: $.data.id }
            - call: "POST /reroof/work-windows"
              payload: { project_id: "${p1}", party_id: "${crew_id}", trade: "SOLAR_REMOVAL", start_utc: "2026-08-12T09:00:00Z", end_utc: "2026-08-12T17:00:00Z" }
              as: ProjectCoordinator
              captures: { w2: $.data.id }
          trigger:
            - call: "POST /reroof/work-windows/${w1}/status"
              payload: { action: "WEATHER_ABORT", abort_reason: "first monsoon day" }
              as: RoofingContractor
              as_user_id: "${roofer_id}"
            - call: "GET /reroof/projects/${p1}"
              as: ProjectCoordinator
            - call: "POST /reroof/work-windows/${w2}/status"
              payload: { action: "WEATHER_ABORT", abort_reason: "second monsoon day" }
              as: SolarContractor
              as_user_id: "${crew_id}"
          assert:
            - "trigger call 2 shows ReroofProject.${p1}.weather_abort_count == 1 and posture == OPEN"
            - "trigger call 3 returns HTTP 200"
            - "ReroofProject.${p1}.weather_abort_count == 2"
            - "ReroofProject.${p1}.posture == RESTRICTED"
            - "WorkWindow.${w1}.status == WEATHER_ABORTED"
            - "WorkWindow.${w2}.status == WEATHER_ABORTED"

      - name: corner_deck_cost_straddles_the_area_tiers
        claim_type: tiered_pricing
        excluded_because:
          difficulty_instance: deck_upgrade_cost_mode_a_tier_straddle_flashing_surcharge_and_floor_beating_cap
          rationale: "That difficulty instance already crosses all three area tiers in one finding, applies the flashing surcharge and demonstrates the floor beating the cap, which covers every tiered-pricing boundary claim for this calculation."

      - name: corner_final_credit_rounds_per_day_before_summing
        claim_type: precision
        excluded_because:
          difficulty_instance: final_credit_mode_b_rounds_per_calendar_day_before_summing
          rationale: "That difficulty instance pins the rounding order with a literal that differs from the sum-then-round answer, which is exactly the precision claim for this calculation."

      - name: corner_credit_days_are_processed_in_ascending_calendar_order
        claim_type: chronological
        excluded_because:
          difficulty_instance: final_credit_mode_b_rounds_per_calendar_day_before_summing
          rationale: "The same instance iterates the inclusive date range ascending and creates its aborted windows out of chronological order, proving the result is independent of row creation order."

      - name: corner_crew_intervals_merge_with_the_mobilization_buffer
        claim_type: interval_merge
        excluded_because:
          difficulty_instance: crew_party_buffer_makes_adjacent_window_conflict_but_same_slot_on_another_party_legal
          rationale: "That difficulty instance covers adjacency at gap zero, the buffer-inflated conflict and the disjoint case on another party, which is the whole interval-merge row for crew_window_overlap."

      - name: corner_two_warranty_variants_disagree_on_the_same_unit
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: unit_warranty_manufacturer_strict_vs_installer_lenient_opposite_verdicts
          rationale: "That difficulty instance holds off_roof_days fixed and flips only the pinned variant, producing opposite preserved verdicts and different risk points - the divergence claim in full."

      - name: corner_provisional_reservation_ignores_what_actually_happened
        claim_type: forward_looking
        excluded_because:
          difficulty_instance: downtime_credit_provisional_forward_looking_vs_final_chronological_reconciliation
          rationale: "That difficulty instance shows the provisional variant reading only baseline_daily_kwh, downtime_days_estimated and ownership_model, unaffected by the child rows that later drive the final variant."

      - name: corner_switching_from_provisional_to_final_reconciles_the_ledger
        claim_type: reconciliation
        excluded_because:
          difficulty_instance: downtime_credit_provisional_forward_looking_vs_final_chronological_reconciliation
          rationale: "That instance asserts the settlement delta and the resulting authorized/settled/released split, which is the reconciliation claim."

      - name: corner_bin_occupancy_is_correct_after_add_and_after_reversal
        claim_type: aggregation
        excluded_because:
          difficulty_instance: unit_population_identity_holds_when_a_stored_panel_is_scrapped_and_frees_its_slot
          rationale: "That difficulty instance checks the aggregate after the add and again after the reversing scrap, including the project-level population identity."

      - name: corner_scoping_propagates_through_permit_inspection_and_posture_to_a_fixed_point
        claim_type: constraint_propagation
        excluded_because:
          difficulty_instance: critical_structural_scoping_reopens_permit_invalidates_inspection_and_downgrades_posture
          rationale: "That depth-4 cascade is the propagation-to-fixed-point claim: one write settles permit status, fee, deadline, inspection status and posture with no further re-entry."

