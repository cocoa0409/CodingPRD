# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Coverage Index)
# Task 2788 — Supermarket In-Store Bakery Production Planning
#
# Walked row-by-row against references/claim-extraction-guide.md over this
# scaffold's §1.1–§1.7 surface. `section:` values are the guide's nine sections;
# `claim_type:` values are its per-section table rows. Corners already asserted
# by a §1.8 instance appear as `excluded_because:` stubs naming that instance.
#
# Conventions shared with SCAFFOLD_DIFFICULTY_DESIGN.yaml:
#   * the logical clock is always set explicitly as the first call
#   * "00000000-0000-0000-0000-000000000000" is the canonical never-minted id
#   * business_date 2026-08-12 is a Wednesday (DOW_UPLIFT 1.00)
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: create_department_with_only_required_fields_applies_declared_defaults
        claim_type: creation
        grounds:
          - entities.BakeryDepartment.fields.freight_surcharge_pct
          - entities.BakeryDepartment.fields.donation_partner_enabled
          - entities.BakeryDepartment.fields.open_purchase_commitment_cents
          - endpoints.POST_/bakery/departments
          - response_envelope.success
        distinguishing_aspect: "A department created with only the four required inputs returns 201 with freight_surcharge_pct 0.05, donation_partner_enabled true, open_purchase_commitment_cents 0 and version 1 inside the standard success envelope."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-10T04:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T04:00:00Z" }
              as: RegionalAdmin
          trigger:
            - call: "POST /bakery/departments"
              payload: { name: "Store 41 Bakery", store_number: "0041", shrink_budget_pct: 0.03, labor_rate_cents_per_minute: 40 }
              as: RegionalAdmin
              captures: { dept_id: $.data.id }
          assert:
            - "HTTP 201 and response_type == 'object' with meta.api_request_id and meta.api_request_timestamp present"
            - "BakeryDepartment.${dept_id}.freight_surcharge_pct == 0.05 and donation_partner_enabled == true"
            - "BakeryDepartment.${dept_id}.open_purchase_commitment_cents == 0 and version == 1"
            - "BakeryDepartment.${dept_id}.name == 'Store 41 Bakery' and store_number == '0041'"
            - "id, created_at and updated_at are present and server-generated"

      - name: product_optional_inputs_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Product.fields.markdown_pct
          - entities.Product.fields.allergen_tags
          - entities.Product.fields.allergen_free_claim
          - entities.Product.fields.recipe_lines
          - entities.Product.fields.is_custom_cake_base
        distinguishing_aspect: "Omitting every optional Product input yields markdown_pct 0.5, allergen_tags [], allergen_free_claim false, recipe_lines [] and is_custom_cake_base false."
        test_recipe:
          setup:
            - "One department exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T04:00:00Z" }
              as: RegionalAdmin
            - call: "POST /bakery/departments"
              payload: { name: "Store 41 Bakery", store_number: "0041", shrink_budget_pct: 0.03, labor_rate_cents_per_minute: 40 }
              as: RegionalAdmin
              captures: { dept_id: $.data.id }
          trigger:
            - call: "POST /bakery/products"
              payload: { department_id: "${dept_id}", sku: "PLAIN-1", name: "Plain Roll", production_method: "PAR_BAKED", units_per_rack: 30, proof_minutes: 0, bake_minutes: 18, cool_minutes: 12, base_labor_minutes_per_rack: 9, setup_labor_minutes: 12, unit_retail_cents: 120, shelf_life_hours: 16 }
              as: RegionalAdmin
              captures: { prod_id: $.data.id }
          assert:
            - "Product.${prod_id}.markdown_pct == 0.5"
            - "Product.${prod_id}.allergen_tags == [] and recipe_lines == []"
            - "Product.${prod_id}.allergen_free_claim == false and is_custom_cake_base == false"
            - "Product.${prod_id}.department_id == ${dept_id} and version == 1"

      - name: get_oven_returns_the_stored_representation
        claim_type: retrieval
        grounds:
          - endpoints.GET_/bakery/ovens/{ovenId}
          - entities.Oven.fields.changeover_buffer_minutes
          - entities.Oven.fields.oven_status
        distinguishing_aspect: "A single-resource GET of a just-created oven returns the same field values that the create call reported, including the AVAILABLE default and a null status_reason."
        test_recipe:
          setup:
            - "One department with one oven: 2 decks, 4 racks per deck, 20-minute changeover buffer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T04:00:00Z" }
              as: RegionalAdmin
            - call: "POST /bakery/departments"
              payload: { name: "Store 41 Bakery", store_number: "0041", shrink_budget_pct: 0.03, labor_rate_cents_per_minute: 40 }
              as: RegionalAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /bakery/ovens"
              payload: { department_id: "${dept_id}", name: "Deck Oven A", deck_count: 2, rack_capacity_per_deck: 4, changeover_buffer_minutes: 20 }
              as: RegionalAdmin
              captures: { oven_id: $.data.id }
          trigger:
            - call: "GET /bakery/ovens/${oven_id}"
              payload: {}
              as: Baker
          assert:
            - "HTTP 200; Oven.${oven_id}.name == 'Deck Oven A', deck_count == 2, rack_capacity_per_deck == 4"
            - "Oven.${oven_id}.changeover_buffer_minutes == 20 and allergen_mode == SHARED (default)"
            - "Oven.${oven_id}.oven_status == AVAILABLE and status_reason == null"

      - name: list_products_filtered_by_department_paginates_with_envelope_fields
        claim_type: listing
        grounds:
          - endpoints.GET_/bakery/products
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three products in one department, limit 2 / offset 0 returns 2 rows with total_count 3 and has_more true, and offset 2 returns the last row with has_more false."
        test_recipe:
          setup:
            - "One department with exactly three PAR_BAKED products."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T04:00:00Z" }
              as: RegionalAdmin
            - call: "POST /bakery/departments"
              payload: { name: "Store 41 Bakery", store_number: "0041", shrink_budget_pct: 0.03, labor_rate_cents_per_minute: 40 }
              as: RegionalAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /bakery/products"
              payload: { department_id: "${dept_id}", sku: "P-1", name: "Product One", production_method: "PAR_BAKED", units_per_rack: 30, proof_minutes: 0, bake_minutes: 18, cool_minutes: 12, base_labor_minutes_per_rack: 9, setup_labor_minutes: 12, unit_retail_cents: 120, shelf_life_hours: 16 }
              as: RegionalAdmin
            - call: "POST /bakery/products"
              payload: { department_id: "${dept_id}", sku: "P-2", name: "Product Two", production_method: "PAR_BAKED", units_per_rack: 30, proof_minutes: 0, bake_minutes: 18, cool_minutes: 12, base_labor_minutes_per_rack: 9, setup_labor_minutes: 12, unit_retail_cents: 130, shelf_life_hours: 16 }
              as: RegionalAdmin
            - call: "POST /bakery/products"
              payload: { department_id: "${dept_id}", sku: "P-3", name: "Product Three", production_method: "PAR_BAKED", units_per_rack: 30, proof_minutes: 0, bake_minutes: 18, cool_minutes: 12, base_labor_minutes_per_rack: 9, setup_labor_minutes: 12, unit_retail_cents: 140, shelf_life_hours: 16 }
              as: RegionalAdmin
          trigger:
            - call: "GET /bakery/products?department_id=${dept_id}&limit=2&offset=0"
              payload: {}
              as: CakeDesk
            - call: "GET /bakery/products?department_id=${dept_id}&limit=2&offset=2"
              payload: {}
              as: CakeDesk
          assert:
            - "first call: response_type == 'array', 2 items, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second call: 1 item, total_count == 3, has_more == false, offset == 2"
            - "the two pages together contain exactly the three created skus P-1, P-2, P-3 with no repeats"

      - name: unknown_ids_on_every_read_endpoint_return_entity_specific_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_DEPARTMENT_NOT_FOUND
          - errors.ERR_BAKE_DAY_NOT_FOUND
          - errors.ERR_PRODUCT_NOT_FOUND
          - errors.ERR_INGREDIENT_NOT_FOUND
          - errors.ERR_OVEN_NOT_FOUND
          - errors.ERR_PRODUCTION_RUN_NOT_FOUND
          - errors.ERR_PICKUP_SLOT_NOT_FOUND
          - errors.ERR_CAKE_ORDER_NOT_FOUND
          - errors.ERR_INGREDIENT_ORDER_NOT_FOUND
          - errors.ERR_WASTE_RECORD_NOT_FOUND
        distinguishing_aspect: "Each of the ten single-resource GETs answers a never-minted UUID with its OWN 404 error_id, not a shared generic one."
        test_recipe:
          setup:
            - "Empty database; no ids have been minted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T04:00:00Z" }
              as: RegionalAdmin
          trigger:
            - call: "GET /bakery/departments/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RegionalAdmin
              captures: { e_dept: $.data.error_id }
            - call: "GET /bakery/bake-days/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RegionalAdmin
              captures: { e_bake_day: $.data.error_id }
            - call: "GET /bakery/products/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RegionalAdmin
              captures: { e_product: $.data.error_id }
            - call: "GET /bakery/ingredients/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RegionalAdmin
              captures: { e_ingredient: $.data.error_id }
            - call: "GET /bakery/ovens/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RegionalAdmin
              captures: { e_oven: $.data.error_id }
            - call: "GET /bakery/production-runs/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RegionalAdmin
              captures: { e_run: $.data.error_id }
            - call: "GET /bakery/pickup-slots/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RegionalAdmin
              captures: { e_slot: $.data.error_id }
            - call: "GET /bakery/custom-cake-orders/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RegionalAdmin
              captures: { e_cake: $.data.error_id }
            - call: "GET /bakery/ingredient-orders/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RegionalAdmin
              captures: { e_ing_order: $.data.error_id }
            - call: "GET /bakery/waste-records/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RegionalAdmin
              captures: { e_waste: $.data.error_id }
          assert:
            - "every call returns HTTP 404 with response_type == 'error' and a non-empty data.message"
            - "${e_dept} == ERR_DEPARTMENT_NOT_FOUND and ${e_bake_day} == ERR_BAKE_DAY_NOT_FOUND"
            - "${e_product} == ERR_PRODUCT_NOT_FOUND and ${e_ingredient} == ERR_INGREDIENT_NOT_FOUND"
            - "${e_oven} == ERR_OVEN_NOT_FOUND and ${e_run} == ERR_PRODUCTION_RUN_NOT_FOUND"
            - "${e_slot} == ERR_PICKUP_SLOT_NOT_FOUND and ${e_cake} == ERR_CAKE_ORDER_NOT_FOUND"
            - "${e_ing_order} == ERR_INGREDIENT_ORDER_NOT_FOUND and ${e_waste} == ERR_WASTE_RECORD_NOT_FOUND"

      - name: create_product_missing_required_units_per_rack_rejected
        claim_type: required_fields
        grounds:
          - validations.priority_14
          - errors.ERR_INVALID_REQUEST
          - endpoints.POST_/bakery/products
        distinguishing_aspect: "Dropping the required units_per_rack input from a product create returns ERR_INVALID_REQUEST (400) and mints no Product row."
        test_recipe:
          setup:
            - "One department exists and no products have been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T04:00:00Z" }
              as: RegionalAdmin
            - call: "POST /bakery/departments"
              payload: { name: "Store 41 Bakery", store_number: "0041", shrink_budget_pct: 0.03, labor_rate_cents_per_minute: 40 }
              as: RegionalAdmin
              captures: { dept_id: $.data.id }
          trigger:
            - call: "POST /bakery/products"
              payload: { department_id: "${dept_id}", sku: "NO-UPR", name: "Missing Units Per Rack", production_method: "PAR_BAKED", proof_minutes: 0, bake_minutes: 18, cool_minutes: 12, base_labor_minutes_per_rack: 9, setup_labor_minutes: 12, unit_retail_cents: 120, shelf_life_hours: 16 }
              as: RegionalAdmin
              captures: { e_missing: $.data.error_id }
          assert:
            - "${e_missing} == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /bakery/products?department_id=${dept_id} returns total_count == 0"

      - name: bake_day_day_of_week_is_computed_and_supplied_value_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.BakeDay.fields.day_of_week
          - entities.BakeDay.fields.business_date
          - calculations.bake_day_plan_generation
        distinguishing_aspect: "day_of_week is derived from business_date — 2026-08-12 yields WEDNESDAY — and a day_of_week value smuggled into the create payload is ignored rather than stored."
        test_recipe:
          setup:
            - "One department exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T04:00:00Z" }
              as: RegionalAdmin
            - call: "POST /bakery/departments"
              payload: { name: "Store 41 Bakery", store_number: "0041", shrink_budget_pct: 0.03, labor_rate_cents_per_minute: 40 }
              as: RegionalAdmin
              captures: { dept_id: $.data.id }
          trigger:
            - call: "POST /bakery/bake-days"
              payload: { department_id: "${dept_id}", business_date: "2026-08-12", labor_budget_minutes: 600, oven_shift_start_utc: "2026-08-12T04:00:00Z", oven_shift_end_utc: "2026-08-12T20:00:00Z", day_of_week: "SUNDAY" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { bd_id: $.data.id }
          assert:
            - "BakeDay.${bd_id}.day_of_week == WEDNESDAY, not the SUNDAY value supplied in the payload"
            - "BakeDay.${bd_id}.plan_posture == DRAFT, markdown_authorization == AUTO, forecast_lines == []"
            - "BakeDay.${bd_id}.planned_labor_minutes == 0.00 and plan_unmet_unit_count == 0"

      - name: pickup_slot_identity_and_audit_fields_are_server_generated
        claim_type: system_fields
        grounds:
          - entities.PickupSlot.fields.slot_status
          - entities.PickupSlot.fields.reserved_decoration_units
          - endpoints.POST_/bakery/pickup-slots
        distinguishing_aspect: "A newly created PickupSlot carries a server-minted id, created_at/updated_at stamped from the logical clock 2026-08-10T04:00:00Z, version 1, slot_status OPEN and reserved_decoration_units 0."
        test_recipe:
          setup:
            - "One department with one DRAFT BakeDay on 2026-08-12; clock at 2026-08-10T04:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T04:00:00Z" }
              as: RegionalAdmin
            - call: "POST /bakery/departments"
              payload: { name: "Store 41 Bakery", store_number: "0041", shrink_budget_pct: 0.03, labor_rate_cents_per_minute: 40 }
              as: RegionalAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /bakery/bake-days"
              payload: { department_id: "${dept_id}", business_date: "2026-08-12", labor_budget_minutes: 600, oven_shift_start_utc: "2026-08-12T04:00:00Z", oven_shift_end_utc: "2026-08-12T20:00:00Z" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { bd_id: $.data.id }
          trigger:
            - call: "POST /bakery/pickup-slots"
              payload: { bake_day_id: "${bd_id}", slot_start_utc: "2026-08-12T14:00:00Z", slot_end_utc: "2026-08-12T16:00:00Z", decorator_capacity_units: 30 }
              as: CakeDesk
              captures: { slot_id: $.data.id }
          assert:
            - "PickupSlot.${slot_id}.slot_status == OPEN and reserved_decoration_units == 0"
            - "PickupSlot.${slot_id}.version == 1 and created_at == updated_at == 2026-08-10T04:00:00Z (the logical clock, not wall time)"
            - "PickupSlot.${slot_id}.bake_day_id == ${bd_id}"
      - name: cake_order_and_pickup_slot_type_constraints_rejected
        claim_type: type_constraints
        grounds:
          - entities.CustomCakeOrder.fields.tier_count
          - entities.PickupSlot.fields.slot_end_utc
          - entities.ForecastLine.fields.daypart
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Three distinct type constraints all funnel to ERR_INVALID_REQUEST (400): tier_count above the 1..4 range, a pickup slot whose end equals its start, and a daypart outside the declared enum."
        test_recipe:
          setup:
            - "One department, one DRAFT BakeDay on 2026-08-12, one custom-cake base product, one OPEN pickup slot."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T04:00:00Z" }
              as: RegionalAdmin
            - call: "POST /bakery/departments"
              payload: { name: "Store 41 Bakery", store_number: "0041", shrink_budget_pct: 0.03, labor_rate_cents_per_minute: 40 }
              as: RegionalAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /bakery/products"
              payload: { department_id: "${dept_id}", sku: "CAKE-8", name: "8 Inch Round Base", production_method: "THAW_AND_SERVE", units_per_rack: 1, proof_minutes: 0, bake_minutes: 0, cool_minutes: 0, base_labor_minutes_per_rack: 0, setup_labor_minutes: 0, unit_retail_cents: 1800, shelf_life_hours: 48, is_custom_cake_base: true }
              as: RegionalAdmin
              captures: { cake_prod_id: $.data.id }
            - call: "POST /bakery/bake-days"
              payload: { department_id: "${dept_id}", business_date: "2026-08-12", labor_budget_minutes: 600, oven_shift_start_utc: "2026-08-12T04:00:00Z", oven_shift_end_utc: "2026-08-12T20:00:00Z" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { bd_id: $.data.id }
            - call: "POST /bakery/pickup-slots"
              payload: { bake_day_id: "${bd_id}", slot_start_utc: "2026-08-12T14:00:00Z", slot_end_utc: "2026-08-12T16:00:00Z", decorator_capacity_units: 30 }
              as: CakeDesk
              captures: { slot_id: $.data.id }
          trigger:
            - call: "POST /bakery/custom-cake-orders"
              payload: { bake_day_id: "${bd_id}", product_id: "${cake_prod_id}", pickup_slot_id: "${slot_id}", customer_name: "Ida Bloom", decoration_complexity: "STANDARD", tier_count: 5 }
              as: CakeDesk
              captures: { e_tier: $.data.error_id }
            - call: "POST /bakery/pickup-slots"
              payload: { bake_day_id: "${bd_id}", slot_start_utc: "2026-08-12T17:00:00Z", slot_end_utc: "2026-08-12T17:00:00Z", decorator_capacity_units: 10 }
              as: CakeDesk
              captures: { e_slot: $.data.error_id }
            - call: "POST /bakery/bake-days/${bd_id}/forecast-lines"
              payload: { product_id: "${cake_prod_id}", daypart: "BRUNCH", forecasted_units: 4 }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { e_daypart: $.data.error_id }
          assert:
            - "${e_tier} == ERR_INVALID_REQUEST (400) and no CustomCakeOrder row is created"
            - "${e_slot} == ERR_INVALID_REQUEST (400) and no second PickupSlot row is created"
            - "${e_daypart} == ERR_INVALID_REQUEST (400) and BakeDay.${bd_id}.forecast_lines == []"

      - name: forecast_line_naming_a_product_of_another_department_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Product.parent
          - entities.ForecastLine.fields.product_id
          - validations.priority_9
          - errors.ERR_PRODUCT_NOT_FOUND
        distinguishing_aspect: "A product that exists but hangs off a DIFFERENT department is not merely rejected as out of scope — the forecast-line endpoint reports it as ERR_PRODUCT_NOT_FOUND (404), so parent scoping is enforced through the parent chain rather than by global id lookup."
        test_recipe:
          setup:
            - "Two departments; the product belongs to department B while the bake day belongs to department A."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T04:00:00Z" }
              as: RegionalAdmin
            - call: "POST /bakery/departments"
              payload: { name: "Store 41 Bakery", store_number: "0041", shrink_budget_pct: 0.03, labor_rate_cents_per_minute: 40 }
              as: RegionalAdmin
              captures: { dept_a: $.data.id }
            - call: "POST /bakery/departments"
              payload: { name: "Store 88 Bakery", store_number: "0088", shrink_budget_pct: 0.03, labor_rate_cents_per_minute: 40 }
              as: RegionalAdmin
              captures: { dept_b: $.data.id }
            - call: "POST /bakery/products"
              payload: { department_id: "${dept_b}", sku: "B-CROIS", name: "Store 88 Croissant", production_method: "PAR_BAKED", units_per_rack: 40, proof_minutes: 0, bake_minutes: 20, cool_minutes: 15, base_labor_minutes_per_rack: 10, setup_labor_minutes: 15, unit_retail_cents: 150, shelf_life_hours: 10 }
              as: RegionalAdmin
              captures: { foreign_prod_id: $.data.id }
            - call: "POST /bakery/bake-days"
              payload: { department_id: "${dept_a}", business_date: "2026-08-12", labor_budget_minutes: 600, oven_shift_start_utc: "2026-08-12T04:00:00Z", oven_shift_end_utc: "2026-08-12T20:00:00Z" }
              as: DepartmentManager
              as_user_id: "${dept_a}"
              captures: { bd_a: $.data.id }
          trigger:
            - call: "POST /bakery/bake-days/${bd_a}/forecast-lines"
              payload: { product_id: "${foreign_prod_id}", daypart: "MORNING", forecasted_units: 40 }
              as: DepartmentManager
              as_user_id: "${dept_a}"
              captures: { e_cross: $.data.error_id }
          assert:
            - "${e_cross} == ERR_PRODUCT_NOT_FOUND with HTTP 404"
            - "BakeDay.${bd_a}.forecast_lines == [] and version is unchanged"
            - "Product.${foreign_prod_id} still exists under department ${dept_b}"

      - name: waste_record_against_an_unknown_production_run_returns_not_found
        claim_type: foreign_key_validation
        grounds:
          - complexity_profile.entity_topology
          - entities.WasteRecord.fields.production_run_id
          - validations.priority_11
          - errors.ERR_PRODUCTION_RUN_NOT_FOUND
        distinguishing_aspect: "The flat topology's foreign keys are resolved on WRITE, not only on read: a waste record naming a never-minted production_run_id is rejected 404 before any disposition or shrink recomputation happens."
        test_recipe:
          setup:
            - "One department; no production runs exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
