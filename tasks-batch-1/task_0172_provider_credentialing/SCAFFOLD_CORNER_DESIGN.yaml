# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Provider Credentialing & Enrollment — Expert
# Breadth probe across the claim-extraction taxonomy. Chains are §1.5-executable.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_provider_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Provider, endpoints./providers]
        distinguishing_aspect: "POST /providers with all required fields -> 201; server mints id/created_at/version=1; application_status=DRAFT, credentialing_status=PENDING, recred_state=NOT_CLEARED."
        test_recipe:
          setup: ["An org exists."]
          setup_api_calls:
            - call: "POST /credentialing-orgs"
              payload: { name: "CVO" }
              as: SystemAdmin
              captures: { org_id: $.data.id }
          trigger:
            - call: "POST /providers"
              payload: { org_id: "${org_id}", npi: "1234567890", full_name: "Dr A", specialty: "IM", caqh_id: "CAQH-A" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { p_id: $.data.id, st: $.data.application_status, cs: $.data.credentialing_status, ver: $.data.version }
          assert:
            - "response.status == 201"
            - "Provider.${p_id}.application_status == 'DRAFT'"
            - "Provider.${p_id}.credentialing_status == 'PENDING'"
            - "Provider.${p_id}.recred_state == 'NOT_CLEARED'"
            - "Provider.${p_id}.version == 1"

      - name: create_provider_missing_npi_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Provider.fields.npi, "validations[priority=5]"]
        distinguishing_aspect: "Omitting required npi -> ERR_INVALID_REQUEST (400); no provider created."
        test_recipe:
          setup: ["An org exists."]
          setup_api_calls:
            - call: "POST /credentialing-orgs"
              payload: { name: "CVO" }
              as: SystemAdmin
              captures: { org_id: $.data.id }
          trigger:
            - call: "POST /providers"
              payload: { org_id: "${org_id}", full_name: "Dr A", specialty: "IM", caqh_id: "CAQH-A" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == 'ERR_INVALID_REQUEST'"

      - name: create_provider_bad_npi_length_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Provider.fields.npi, "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "npi not exactly 10 digits ('123') -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["An org exists."]
          setup_api_calls:
            - call: "POST /credentialing-orgs"
              payload: { name: "CVO" }
              as: SystemAdmin
              captures: { org_id: $.data.id }
          trigger:
            - call: "POST /providers"
              payload: { org_id: "${org_id}", npi: "123", full_name: "Dr A", specialty: "IM", caqh_id: "CAQH-A" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == 'ERR_INVALID_REQUEST'"

      - name: provider_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Provider, "endpoints./providers/{id}", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /providers/{nonexistent UUID} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["An org exists; no provider with the queried id."]
          setup_api_calls:
            - call: "POST /credentialing-orgs"
              payload: { name: "CVO" }
              as: SystemAdmin
          trigger:
            - call: "GET /providers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == 'ERR_NOT_FOUND'"

      - name: credential_item_expirable_band_computed_valid_on_create
        claim_type: Computed Fields
        grounds: [entities.CredentialItem.fields.expirable_band, calculations.expirable_band]
        distinguishing_aspect: "A new item expiring far in the future (2030) with clock at default 2026-01-01 has expirable_band=VALID, regardless of any client-supplied value (computed, input ignored)."
        test_recipe:
          setup: ["Provider exists; clock at default 2026-01-01."]
          setup_api_calls:
            - call: "POST /credentialing-orgs"
              payload: { name: "CVO" }
              as: SystemAdmin
              captures: { org_id: $.data.id }
            - call: "POST /providers"
              payload: { org_id: "${org_id}", npi: "1234567890", full_name: "Dr A", specialty: "IM", caqh_id: "CAQH-A" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /providers/${p_id}/credential-items"
              payload: { item_type: "STATE_LICENSE", identifier: "LIC-1", issued_date: "2025-01-01T00:00:00.000Z", expiration_date: "2030-01-01T00:00:00.000Z" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { band: $.data.expirable_band, vs: $.data.verification_state }
          assert:
            - "response.status == 201"
            - "CredentialItem.*.expirable_band == 'VALID'"
            - "CredentialItem.*.verification_state == 'UNVERIFIED'"

      - name: credential_item_bad_dates_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.CredentialItem.fields.expiration_date, "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "expiration_date not strictly after issued_date -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Provider exists."]
          setup_api_calls:
            - call: "POST /credentialing-orgs"
              payload: { name: "CVO" }
              as: SystemAdmin
              captures: { org_id: $.data.id }
            - call: "POST /providers"
              payload: { org_id: "${org_id}", npi: "1234567890", full_name: "Dr A", specialty: "IM", caqh_id: "CAQH-A" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /providers/${p_id}/credential-items"
              payload: { item_type: "STATE_LICENSE", identifier: "LIC-1", issued_date: "2030-01-01T00:00:00.000Z", expiration_date: "2029-01-01T00:00:00.000Z" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == 'ERR_INVALID_REQUEST'"

      - name: payer_bad_enum_payer_type_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Payer.fields.payer_type, "validations[priority=5]"]
        distinguishing_aspect: "payer_type outside {COMMERCIAL,MEDICARE,MEDICAID} -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["An org exists."]
          setup_api_calls:
            - call: "POST /credentialing-orgs"
              payload: { name: "CVO" }
              as: SystemAdmin
              captures: { org_id: $.data.id }
          trigger:
            - call: "POST /payers"
              payload: { org_id: "${org_id}", name: "X", payer_type: "PRIVATE", panel_capacity: 5 }
              as: EnrollmentCoordinator
              as_user_id: "enr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == 'ERR_INVALID_REQUEST'"

      - name: org_create_defaults_applied
        claim_type: Defaults
        grounds: [entities.CredentialingOrg.fields.recred_cycle_days, entities.CredentialingOrg.fields.expiring_soon_window_days]
        distinguishing_aspect: "Creating an org without recred_cycle_days / expiring_soon_window_days applies defaults 1095 and 90; current_utc initialized to 2026-01-01T00:00:00.000Z."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /credentialing-orgs"
              payload: { name: "CVO" }
              as: SystemAdmin
              captures: { org_id: $.data.id, cyc: $.data.recred_cycle_days, win: $.data.expiring_soon_window_days, now: $.data.current_utc }
          assert:
            - "response.status == 201"
            - "CredentialingOrg.${org_id}.recred_cycle_days == 1095"
            - "CredentialingOrg.${org_id}.expiring_soon_window_days == 90"
            - "CredentialingOrg.${org_id}.current_utc == '2026-01-01T00:00:00.000Z'"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: begin_verification_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Provider.SUBMITTED_to_IN_VERIFICATION, "errors[ERR_APPLICATION_NOT_SUBMITTED]"]
        distinguishing_aspect: "begin-verification on a still-DRAFT provider (skipping submit) -> ERR_APPLICATION_NOT_SUBMITTED (409); no items move to PENDING_PSV."
        test_recipe:
          setup: ["Provider in DRAFT with a license."]
          setup_api_calls:
            - call: "POST /credentialing-orgs"
              payload: { name: "CVO" }
              as: SystemAdmin
              captures: { org_id: $.data.id }
            - call: "POST /providers"
              payload: { org_id: "${org_id}", npi: "1234567890", full_name: "Dr A", specialty: "IM", caqh_id: "CAQH-A" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { p_id: $.data.id }
            - call: "POST /providers/${p_id}/credential-items"
              payload: { item_type: "STATE_LICENSE", identifier: "LIC-1", issued_date: "2025-01-01T00:00:00.000Z", expiration_date: "2030-01-01T00:00:00.000Z" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
          trigger:
            - call: "POST /providers/${p_id}/begin-verification"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == 'ERR_APPLICATION_NOT_SUBMITTED'"

      - name: submit_application_without_license_returns_no_license
        claim_type: Precondition Enforcement
        grounds: [state_machines.Provider.DRAFT_to_SUBMITTED, "errors[ERR_NO_LICENSE_ON_FILE]"]
        distinguishing_aspect: "submit-application with no STATE_LICENSE credential item -> ERR_NO_LICENSE_ON_FILE (409)."
        test_recipe:
          setup: ["Provider in DRAFT with only a DEA item (no STATE_LICENSE)."]
          setup_api_calls:
            - call: "POST /credentialing-orgs"
              payload: { name: "CVO" }
              as: SystemAdmin
              captures: { org_id: $.data.id }
            - call: "POST /providers"
              payload: { org_id: "${org_id}", npi: "1234567890", full_name: "Dr A", specialty: "IM", caqh_id: "CAQH-A" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { p_id: $.data.id }
            - call: "POST /providers/${p_id}/credential-items"
              payload: { item_type: "DEA_REGISTRATION", identifier: "DEA-1", issued_date: "2025-01-01T00:00:00.000Z", expiration_date: "2030-01-01T00:00:00.000Z" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
          trigger:
            - call: "POST /providers/${p_id}/submit-application"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == 'ERR_NO_LICENSE_ON_FILE'"

      - name: submit_application_without_caqh_returns_caqh_required
        claim_type: Precondition Enforcement
        grounds: [state_machines.Provider.DRAFT_to_SUBMITTED, "errors[ERR_CAQH_REQUIRED]"]
        distinguishing_aspect: "submit-application on a provider created without caqh_id, with a license present -> ERR_CAQH_REQUIRED (400)."
        test_recipe:
          setup: ["Provider in DRAFT with a license but no caqh_id."]
          setup_api_calls:
            - call: "POST /credentialing-orgs"
              payload: { name: "CVO" }
              as: SystemAdmin
              captures: { org_id: $.data.id }
            - call: "POST /providers"
              payload: { org_id: "${org_id}", npi: "1234567890", full_name: "Dr A", specialty: "IM" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { p_id: $.data.id }
            - call: "POST /providers/${p_id}/credential-items"
              payload: { item_type: "STATE_LICENSE", identifier: "LIC-1", issued_date: "2025-01-01T00:00:00.000Z", expiration_date: "2030-01-01T00:00:00.000Z" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
          trigger:
            - call: "POST /providers/${p_id}/submit-application"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == 'ERR_CAQH_REQUIRED'"

      - name: finalize_verification_with_pending_psv_returns_incomplete
        claim_type: Precondition Enforcement
        grounds: [state_machines.Provider.IN_VERIFICATION_to_READY_FOR_REVIEW, "errors[ERR_VERIFICATIONS_INCOMPLETE]"]
        distinguishing_aspect: "finalize-verification while a CredentialItem is still PENDING_PSV -> ERR_VERIFICATIONS_INCOMPLETE (409)."
        test_recipe:
          setup: ["Provider IN_VERIFICATION with one PENDING_PSV item (no verification completed)."]
          setup_api_calls:
            - call: "POST /credentialing-orgs"
              payload: { name: "CVO" }
              as: SystemAdmin
              captures: { org_id: $.data.id }
            - call: "POST /providers"
              payload: { org_id: "${org_id}", npi: "1234567890", full_name: "Dr A", specialty: "IM", caqh_id: "CAQH-A" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { p_id: $.data.id }
            - call: "POST /providers/${p_id}/credential-items"
              payload: { item_type: "STATE_LICENSE", identifier: "LIC-1", issued_date: "2025-01-01T00:00:00.000Z", expiration_date: "2030-01-01T00:00:00.000Z" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
            - call: "POST /providers/${p_id}/submit-application"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
            - call: "POST /providers/${p_id}/begin-verification"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
          trigger:
            - call: "POST /providers/${p_id}/finalize-verification"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == 'ERR_VERIFICATIONS_INCOMPLETE'"

      - name: reverify_item_not_rejected_returns_error
        claim_type: Invalid Transitions
        grounds: [state_machines.CredentialItem.REJECTED_to_PENDING_PSV, "errors[ERR_ITEM_NOT_REJECTED]"]
        distinguishing_aspect: "reverify on a still-UNVERIFIED item (not REJECTED) -> ERR_ITEM_NOT_REJECTED (409)."
        test_recipe:
          setup: ["Provider DRAFT with one UNVERIFIED item."]
          setup_api_calls:
            - call: "POST /credentialing-orgs"
              payload: { name: "CVO" }
              as: SystemAdmin
              captures: { org_id: $.data.id }
            - call: "POST /providers"
              payload: { org_id: "${org_id}", npi: "1234567890", full_name: "Dr A", specialty: "IM", caqh_id: "CAQH-A" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { p_id: $.data.id }
            - call: "POST /providers/${p_id}/credential-items"
              payload: { item_type: "STATE_LICENSE", identifier: "LIC-1", issued_date: "2025-01-01T00:00:00.000Z", expiration_date: "2030-01-01T00:00:00.000Z" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { ci_id: $.data.id }
          trigger:
            - call: "POST /credential-items/${ci_id}/reverify"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == 'ERR_ITEM_NOT_REJECTED'"

      - name: complete_verification_twice_returns_not_open
        claim_type: Idempotency
        grounds: [state_machines.CredentialItem.PENDING_PSV_to_VERIFIED, "errors[ERR_VERIFICATION_NOT_OPEN]"]
        distinguishing_aspect: "Completing the same VerificationRequest twice -> second call ERR_VERIFICATION_NOT_OPEN (409) since it is no longer OPEN."
        test_recipe:
          setup: ["Provider IN_VERIFICATION; one OPEN VerificationRequest already completed PASS once."]
          setup_api_calls:
            - call: "POST /credentialing-orgs"
              payload: { name: "CVO" }
              as: SystemAdmin
              captures: { org_id: $.data.id }
            - call: "POST /providers"
              payload: { org_id: "${org_id}", npi: "1234567890", full_name: "Dr A", specialty: "IM", caqh_id: "CAQH-A" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { p_id: $.data.id }
            - call: "POST /providers/${p_id}/credential-items"
              payload: { item_type: "STATE_LICENSE", identifier: "LIC-1", issued_date: "2025-01-01T00:00:00.000Z", expiration_date: "2030-01-01T00:00:00.000Z" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { ci_id: $.data.id }
            - call: "POST /providers/${p_id}/submit-application"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
            - call: "POST /providers/${p_id}/begin-verification"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
            - call: "POST /credential-items/${ci_id}/verification-requests"
              payload: { method: "PRIMARY_SOURCE", source_reference: "https://lic.example/1" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { vr_id: $.data.id }
            - call: "POST /verification-requests/${vr_id}/complete"
              payload: { outcome: "PASS" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
          trigger:
            - call: "POST /verification-requests/${vr_id}/complete"
              payload: { outcome: "PASS" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == 'ERR_VERIFICATION_NOT_OPEN'"

      - name: terminate_terminal_enrollment_returns_not_active
        claim_type: Terminal State Lockdown
        grounds: [state_machines.PayerEnrollment.ACTIVE_to_TERMINATED, "errors[ERR_ENROLLMENT_NOT_ACTIVE]"]
        distinguishing_aspect: "Terminating an enrollment still in REQUESTED (never ACTIVE) -> ERR_ENROLLMENT_NOT_ACTIVE (409)."
        test_recipe:
          setup: ["Provider with one REQUESTED enrollment."]
          setup_api_calls:
            - call: "POST /credentialing-orgs"
              payload: { name: "CVO" }
              as: SystemAdmin
              captures: { org_id: $.data.id }
            - call: "POST /providers"
              payload: { org_id: "${org_id}", npi: "1234567890", full_name: "Dr A", specialty: "IM", caqh_id: "CAQH-A" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { p_id: $.data.id }
            - call: "POST /payers"
              payload: { org_id: "${org_id}", name: "Plan X", payer_type: "COMMERCIAL", retroactive_allowed: false, panel_capacity: 5 }
              as: EnrollmentCoordinator
              as_user_id: "enr-1"
              captures: { payer_id: $.data.id }
            - call: "POST /providers/${p_id}/payer-enrollments"
              payload: { payer_id: "${payer_id}" }
              as: EnrollmentCoordinator
              as_user_id: "enr-1"
              captures: { en_id: $.data.id }
          trigger:
            - call: "POST /payer-enrollments/${en_id}/terminate"
              payload: { termination_reason: "n/a" }
              as: EnrollmentCoordinator
              as_user_id: "enr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == 'ERR_ENROLLMENT_NOT_ACTIVE'"

      - name: resolve_screening_already_resolved_returns_not_open
        claim_type: Terminal State Lockdown
        grounds: [state_machines.SanctionsScreening.OPEN_to_RESOLVED, "errors[ERR_SCREENING_NOT_OPEN]"]
        distinguishing_aspect: "Resolving an already-RESOLVED screening -> ERR_SCREENING_NOT_OPEN (409)."
        test_recipe:
          setup: ["A HIT screening already resolved once."]
          setup_api_calls:
            - call: "POST /credentialing-orgs"
              payload: { name: "CVO" }
              as: SystemAdmin
              captures: { org_id: $.data.id }
            - call: "POST /sanctions-sources"
              payload: { org_id: "${org_id}", source_code: "OIG_LEIE", severity_weight: 3 }
              as: ComplianceOfficer
              as_user_id: "comp-1"
              captures: { src_id: $.data.id }
            - call: "POST /providers"
              payload: { org_id: "${org_id}", npi: "1234567890", full_name: "Dr A", specialty: "IM", caqh_id: "CAQH-A" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { p_id: $.data.id }
            - call: "POST /providers/${p_id}/sanctions-screenings"
              payload: { sanctions_source_id: "${src_id}", result: "HIT" }
              as: ComplianceOfficer
              as_user_id: "comp-1"
              captures: { scr_id: $.data.id }
            - call: "POST /sanctions-screenings/${scr_id}/resolve"
              payload: { resolution_note: "cleared" }
              as: ComplianceOfficer
              as_user_id: "comp-1"
          trigger:
            - call: "POST /sanctions-screenings/${scr_id}/resolve"
              payload: { resolution_note: "again" }
              as: ComplianceOfficer
              as_user_id: "comp-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == 'ERR_SCREENING_NOT_OPEN'"

      - name: resolve_screening_without_note_returns_note_required
        claim_type: Precondition Enforcement
        grounds: [state_machines.SanctionsScreening.OPEN_to_RESOLVED, "errors[ERR_RESOLUTION_NOTE_REQUIRED]"]
        distinguishing_aspect: "resolve with an empty resolution_note -> ERR_RESOLUTION_NOTE_REQUIRED (400)."
        test_recipe:
          setup: ["A HIT screening OPEN."]
          setup_api_calls:
            - call: "POST /credentialing-orgs"
              payload: { name: "CVO" }
              as: SystemAdmin
              captures: { org_id: $.data.id }
            - call: "POST /sanctions-sources"
              payload: { org_id: "${org_id}", source_code: "OIG_LEIE", severity_weight: 3 }
              as: ComplianceOfficer
              as_user_id: "comp-1"
              captures: { src_id: $.data.id }
            - call: "POST /providers"
