            - {call: "POST /use-cases/{id}/approve", payload: {expected_use_case_version: "${ucm_ready}"}, as: GovernanceOfficer, as_user_id: "usr_gov_2", captures: {err: "$.data.error_id"}}
          assert:
            - "the gate is CLEARED with cleared_by_user_id usr_gov_2 and the use case is READY_FOR_APPROVAL"
            - "HTTP 403 with data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "the response is NOT ERR_UNAUTHORIZED - the role on the header is GovernanceOfficer"
            - "status is still READY_FOR_APPROVAL and no DEPLOYMENT_FINAL ClassificationSnapshot was appended"
            - "the identical call as usr_gov_1, who cleared nothing and filed nothing, succeeds"

  # ===========================================================================
  # 8. CROSS-CUTTING COMPLEXITY LAYERS
  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: occ_stale_expected_version_rejects_binding_creation
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[binding-create-stale-use-case]", "errors[ERR_STALE_USE_CASE_VERSION]", "validations[p9]"]
        distinguishing_aspect: "Replaying the pre-classification version on POST /use-cases/{id}/model-bindings is refused 412 ERR_STALE_USE_CASE_VERSION: classify bumped UseCase.version, so the client's observed value is one behind."
        test_recipe:
          setup: ["MINIMAL use case classified, so UseCase.version is 2 while the client still holds the intake-time value 1; an approved first-party asset stands ready."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /model-assets", payload: {provider: "Internal ML Platform", model_name: "helios-mini", model_version: "1.0.0", hosting: "INTERNAL", modality: "TEXT", is_third_party: false}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {asset: "$.data.id"}}
            - {call: "POST /model-assets/{id}/approve-for-use", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Internal wiki search reranker", business_unit: "IT", description: "reranks internal wiki hits for staff searches", affects_individuals: false, decision_autonomy: "ADVISORY", data_sensitivity: "PUBLIC", individual_impact: "LOW", jurisdictions: [], deployed_headcount_reach: 500}, as: Requester, as_user_id: "usr_req_1", captures: {uc_m: "$.data.id", ucm_v1: "$.data.version"}}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${ucm_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ucm_v2: "$.data.version"}}
          trigger:
            - {call: "POST /use-cases/{id}/model-bindings", payload: {model_asset_id: "${asset}", expected_use_case_version: "${ucm_v2} - 1"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 412 with data.error_id == ERR_STALE_USE_CASE_VERSION"
            - "no ModelBinding row exists and ModelAsset.active_binding_count is still 0"
            - "UseCase.version is still 2 - a rejected write does not advance it"
            - "the same body carrying ${ucm_v2} succeeds with 201"

      - name: occ_stale_expected_version_rejects_oversight_design_filing
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[oversight-design-create-stale-use-case]", "errors[ERR_STALE_USE_CASE_VERSION]", "endpoints[POST /use-cases/{id}/oversight-designs]"]
        distinguishing_aspect: "The second concurrency rule guards a different write endpoint and a different actor: the Requester filing an oversight design against a version the binding creation has already moved past is refused 412 on POST /use-cases/{id}/oversight-designs."
        test_recipe:
          setup: ["MINIMAL use case classified (version 2) and then bound to an approved asset, which bumps UseCase.version to 3 while the requester still holds 2."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /model-assets", payload: {provider: "Internal ML Platform", model_name: "helios-mini", model_version: "1.0.0", hosting: "INTERNAL", modality: "TEXT", is_third_party: false}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {asset: "$.data.id"}}
            - {call: "POST /model-assets/{id}/approve-for-use", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Internal wiki search reranker", business_unit: "IT", description: "reranks internal wiki hits for staff searches", affects_individuals: false, decision_autonomy: "ADVISORY", data_sensitivity: "PUBLIC", individual_impact: "LOW", jurisdictions: [], deployed_headcount_reach: 500}, as: Requester, as_user_id: "usr_req_1", captures: {uc_m: "$.data.id", ucm_v1: "$.data.version"}}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${ucm_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ucm_v2: "$.data.version"}}
            - {call: "POST /use-cases/{id}/model-bindings", payload: {model_asset_id: "${asset}", expected_use_case_version: "${ucm_v2}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {bind: "$.data.id"}}
            - {call: "GET /use-cases/{id}", payload: {}, as: Requester, as_user_id: "usr_req_1", captures: {ucm_v3: "$.data.version"}}
          trigger:
            - {call: "POST /use-cases/{id}/oversight-designs", payload: {review_mode: "PRE_DECISION_REVIEW", sample_pct: 0, escalation_sla_hours: 24, reviewer_role: "BusinessReviewer", override_capability: true, expected_use_case_version: "${ucm_v3} - 1"}, as: Requester, as_user_id: "usr_req_1", captures: {err: "$.data.error_id"}}
          assert:
            - "the GET confirms UseCase.version == 3 after the binding creation"
            - "HTTP 412 with data.error_id == ERR_STALE_USE_CASE_VERSION"
            - "GET /use-cases/{uc_m}/oversight-designs returns 0 rows and UseCase.version is still 3"
            - "the supersede half of this rule is a separate matter: a SECOND filing that observes the current version legitimately succeeds and moves the prior DRAFT design to REJECTED"

      - name: version_pinning_stales_the_binding_and_voids_its_evaluation
        claim_type: version_pinning_on_approval
        grounds: [entities.ModelBinding.fields.pinned_model_version, state_machines.ModelBinding.transitions.PINNED_to_STALE, "endpoints[PATCH /model-assets/{id}]"]
        distinguishing_aspect: "The pinning layer is observable without any approval: one PATCH that bumps ModelAsset.version from 2 to 3 flips the binding pinned at 2 to STALE with superseded_reason ASSET_REAPPROVED and voids the PLANNED evaluation hanging off it, in that order."
        test_recipe:
          setup: ["MINIMAL use case classified and bound to an approved first-party asset at asset version 2, with one PLANNED BIAS evaluation on that binding."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /model-assets", payload: {provider: "Internal ML Platform", model_name: "helios-mini", model_version: "1.0.0", hosting: "INTERNAL", modality: "TEXT", is_third_party: false}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {asset: "$.data.id"}}
            - {call: "POST /model-assets/{id}/approve-for-use", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {asset_v2: "$.data.version"}}
            - {call: "POST /use-cases", payload: {title: "Internal wiki search reranker", business_unit: "IT", description: "reranks internal wiki hits for staff searches", affects_individuals: false, decision_autonomy: "ADVISORY", data_sensitivity: "PUBLIC", individual_impact: "LOW", jurisdictions: [], deployed_headcount_reach: 500}, as: Requester, as_user_id: "usr_req_1", captures: {uc_m: "$.data.id", ucm_v1: "$.data.version"}}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${ucm_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ucm_v2: "$.data.version"}}
            - {call: "POST /use-cases/{id}/model-bindings", payload: {model_asset_id: "${asset}", expected_use_case_version: "${ucm_v2}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {bind: "$.data.id"}}
            - {call: "POST /test-evaluations", payload: {use_case_id: "${uc_m}", model_binding_id: "${bind}", eval_type: "BIAS", window_start_at: "2026-08-02T00:00:00Z", window_end_at: "2026-08-03T00:00:00Z"}, as: SecurityReviewer, as_user_id: "usr_sec_1", captures: {ev: "$.data.id"}}
          trigger:
            - {call: "PATCH /model-assets/{id}", payload: {model_version: "1.0.1"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
          assert:
            - "before the trigger the binding is PINNED with pinned_model_version 2 and the evaluation is PLANNED with required_metric_threshold 0.6 and required_sample_size 100 (the MINIMAL profile)"
            - "HTTP 200; the asset is APPROVED_FOR_USE at version 3 with model_version '1.0.1'"
            - "the binding is STALE with superseded_reason ASSET_REAPPROVED, pinned_model_version still 2, and ModelAsset.active_binding_count still 1"
            - "the evaluation is VOIDED, which also frees its window for a later evaluation on the same asset"
            - "the use case is untouched: still UNDER_REVIEW at version 3 with no ledger entry appended"

      - name: revoke_cascade_end_to_end_through_bindings_assets_and_assessments
        claim_type: cascading_side_effects
        grounds: ["endpoints[POST /use-cases/{id}/revoke]", state_machines.ModelAsset.transitions.APPROVED_FOR_USE_to_RESTRICTED, state_machines.VendorModelAssessment.transitions.ACCEPTED_to_EXPIRED]
        excluded_because:
          difficulty_instance: transitive_cascade / revoke_cascades_four_hops_to_vendor_assessment_expiry
          rationale: "The declared cascading_side_effects layer is exactly the four-hop revoke chain the 1.8 transitive-cascade instance walks end to end - use case -> bindings -> asset active_binding_count/RESTRICTED -> ACCEPTED assessment EXPIRED and vendor_terms_grade nulled - including the ordering sensitivity between hop 3 and hop 4. Its sibling instance covers the SEV1 posture cascade."

      - name: dual_variant_scores_diverge_on_the_same_stored_row
        claim_type: dual_variant_calculation
        grounds: [calculations.risk_classification_score.variants, calculations.vendor_terms_grade.variants]
        excluded_because:
          difficulty_instance: dual_variant_calc / use_case_risk_provisional_versus_deployment_final
          rationale: "Both declared dual-variant calculations are covered at depth in 1.8: this instance pins the INTAKE_PROVISIONAL versus DEPLOYMENT_FINAL divergence and the band change it causes, and vendor_terms_conservative_versus_documented_variant pins the CONSERVATIVE_LEGAL versus DOCUMENTED_TERMS two-band grade swing on one unchanged assessment row."

