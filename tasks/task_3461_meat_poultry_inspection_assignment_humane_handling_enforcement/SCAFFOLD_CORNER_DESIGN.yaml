        distinguishing_aspect: "A write sent without the X-User-Role / X-User-ID header pair fails priority-1 with 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any existence or state check."
        test_recipe:
          setup: ["Empty database. The trigger call is sent with the role/identity headers deliberately omitted."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /inspection/establishments"
              payload: { name: "NoAuth Plant", species_classes: ["CATTLE"], slaughter_capable: true }
              as: ProgramAdministrator
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: occ_stale_establishment_version_returns_412
        claim_type: Violation → Error
        grounds:
          - validations[priority=4]
          - concurrency_rules[enforcement-create-stale-establishment]
          - errors.ERR_STALE_ESTABLISHMENT_VERSION
        distinguishing_aspect: "Two strictly sequential enforcement creates: the first bumps Establishment.version, the second arrives with the pre-mutation version and is rejected 412 ERR_STALE_ESTABLISHMENT_VERSION — no overlap in time is involved."
        test_recipe:
          setup: ["Clock default. Establishment registered (grant not required for WITHHOLD_MARKS eligibility) with one OPEN SANITATION NR; current establishment version captured as est_v."]
          setup_api_calls:
            - call: "POST /inspection/establishments"
