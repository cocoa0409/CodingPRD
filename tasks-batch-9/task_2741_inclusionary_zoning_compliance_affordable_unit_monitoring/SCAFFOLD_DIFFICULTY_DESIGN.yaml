          assert:
            - "L1 — AffordableUnit.${u_id}.occupancy_status == WITHDRAWN and withdrawn_reason is the submitted reason"
            - "L2 — Project.${p_id}.onsite_unit_equivalents_bps == 0"
            - "L3 — exactly one InLieuFee exists for the project with basis SUBSTITUTION, state ASSESSED and unit_equivalent_bps 10000"
