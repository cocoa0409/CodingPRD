              as: PlatformIntegration
              captures: { p_orig_id: $.data.id }
            - call: "GET /registry-items/${r_id}"
              payload: {}
              as: Couple
              as_user_id: "couple_id"
              captures: { r_v_before: $.data.version, r_qty_before: $.data.fulfilled_quantity }
          trigger:
            - call: "POST /registry-items/${r_id}/purchases"
