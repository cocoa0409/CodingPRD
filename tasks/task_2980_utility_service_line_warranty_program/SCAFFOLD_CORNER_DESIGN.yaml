              captures: { claim_v2: $.data.version, triage_status: $.data.status }
            - call: "POST /claims/${claim_id}/dispatches"
              payload: { window_start: "2026-09-10T09:00:00.000Z", expected_claim_version: "${claim_v1}", contractor_id: "${contractor_a}" }
