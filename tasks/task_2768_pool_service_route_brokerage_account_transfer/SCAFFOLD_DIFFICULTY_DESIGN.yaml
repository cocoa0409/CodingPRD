              payload: {"listing_id": "${l_t3}", "customer_ref": "TIER-AT-100000", "service_start_date": "2025-02-10", "route_day": "MON", "monthly_service_fee_cents": 60000, "avg_monthly_chemical_cents": 40000, "avg_monthly_repair_cents": 0, "chemical_billing_method": "INCLUDED", "billing_frequency": "MONTHLY"}
              as: Broker
              captures: {"a_t3": "$.data.id"}
          trigger:
            - call: "GET /route-listings/${l_t1}"
              as: Broker
              captures: {"v_t1": "$.data.version"}
            - call: "POST /route-listings/${l_t1}/valuations"
              payload: {"basis": "LISTED_BASIS", "expected_listing_version": "${v_t1}"}
