# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — Bridal & Gown Shop
# 9 rules x 2 instances = 18 instances total (meets the >=18 minimum).
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1–§1.7.
# Every setup_api_calls / trigger chain is executable from empty-DB using §1.5.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: gown_total_quoted_vs_final_diverges_on_accessories
        grounds:
          - calculations.gown_order_total
          - entities.GownOrder.fields.quoted_total_cents
          - entities.GownOrder.fields.final_total_cents
          - state_machines.GownOrder.ORDERED_to_RECEIVED
        distinguishing_aspect: "Quoted variant (at DRAFT, no accessories) and final variant (at RECEIVED, includes ACTIVE accessory lines) produce different totals for the SAME GownOrder: 290000 vs 305000."
        test_recipe:
          setup:
            - "A GownOrder base=200000, size=22 (>=20 upcharge), rush=true -> quoted_total_cents=290000."
            - "A VEIL accessory price 15000 attached ACTIVE; a PaymentPlan exists; order advanced DRAFT->ORDERED->RECEIVED."
          setup_api_calls:
            - call: "POST /gown-orders"
              payload: { gown_style_code: "ELEGANCE", ordered_size: 22, base_price_cents: 200000, standard_lead_days: 90, is_rush: true }
              as: BridalConsultant
              captures: { ord: $.data.id, quoted: $.data.quoted_total_cents }
            - call: "POST /accessory-addons"
              payload: { gown_order_id: "${ord}", accessory_type: "VEIL", price_cents: 15000 }
              as: BridalConsultant
            - call: "POST /payment-plans"
              payload: { gown_order_id: "${ord}", term_installments: 5, deposit_cents: 152500 }
              as: FinanceClerk
            - call: "POST /gown-orders/${ord}/submit"
              payload: {}
              as: BridalConsultant
            - call: "POST /gown-orders/${ord}/receive"
              payload: {}
              as: ShopManager
              captures: { final: $.data.final_total_cents }
          trigger:
            - call: "GET /gown-orders/${ord}"
              payload: {}
              as: ShopManager
              captures: { q2: $.data.quoted_total_cents, f2: $.data.final_total_cents }
          assert:
            - "GownOrder.${ord}.quoted_total_cents == 290000"
            - "GownOrder.${ord}.final_total_cents == 305000"
            - "GownOrder.${ord}.final_total_cents != GownOrder.${ord}.quoted_total_cents"

      - name: alteration_estimate_vs_actual_diverges_on_refits
        grounds:
          - calculations.alteration_cost
          - entities.AlterationJob.fields.estimated_cost_cents
          - entities.AlterationJob.fields.final_cost_cents
          - entities.AlterationJob.fields.refitting_count
          - state_machines.AlterationJob.FITTING_to_COMPLETED
        distinguishing_aspect: "On a DIFFERENT entity domain (AlterationJob, not GownOrder): estimate variant (estimated_labor_minutes only) = 7200 vs actual variant (actual minutes + refit surcharge) = 12960."
        test_recipe:
          setup:
            - "A RECEIVED GownOrder; an AlterationJob estimated_labor_minutes=60 -> estimated_cost_cents=7200."
            - "Job started, 1 adjustment requested then resumed logging 90 min, second adjustment then resume, total refitting_count=2, actual_labor_minutes=90, completed."
          setup_api_calls:
            - call: "POST /gown-orders"
              payload: { gown_style_code: "ATELIER", ordered_size: 10, base_price_cents: 180000, standard_lead_days: 60 }
              as: BridalConsultant
              captures: { ord: $.data.id }
            - call: "POST /payment-plans"
              payload: { gown_order_id: "${ord}", term_installments: 2, deposit_cents: 90000 }
              as: FinanceClerk
            - call: "POST /gown-orders/${ord}/submit"
              payload: {}
              as: BridalConsultant
            - call: "POST /gown-orders/${ord}/receive"
              payload: {}
              as: ShopManager
            - call: "POST /alteration-jobs"
              payload: { gown_order_id: "${ord}", estimated_labor_minutes: 60 }
              as: Seamstress
              captures: { job: $.data.id, est: $.data.estimated_cost_cents }
            - call: "POST /alteration-jobs/${job}/start-fitting"
              payload: {}
              as: Seamstress
            - call: "POST /alteration-jobs/${job}/request-adjustment"
              payload: {}
              as: Seamstress
            - call: "POST /alteration-jobs/${job}/log-labor"
              payload: { minutes: 50 }
              as: Seamstress
            - call: "POST /alteration-jobs/${job}/request-adjustment"
              payload: {}
              as: Seamstress
            - call: "POST /alteration-jobs/${job}/log-labor"
              payload: { minutes: 40 }
              as: Seamstress
          trigger:
            - call: "POST /alteration-jobs/${job}/complete"
              payload: {}
              as: Seamstress
              captures: { fin: $.data.final_cost_cents, refits: $.data.refitting_count }
          assert:
            - "AlterationJob.${job}.estimated_cost_cents == 7200"
            - "AlterationJob.${job}.refitting_count == 2"
            - "AlterationJob.${job}.actual_labor_minutes == 90"
            - "AlterationJob.${job}.final_cost_cents == 12960"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: payment_plan_schedule_nonlinear_three_inputs
        grounds:
          - calculations.payment_plan_schedule
          - entities.PaymentPlan.fields.installment_cents
          - entities.PaymentPlan.fields.plan_total_cents
          - entities.PaymentPlan.fields.deposit_cents
        distinguishing_aspect: "Mode (a): formula with >=3 inputs (plan_total_cents=305000, deposit_cents=160000, term_installments=3) interacting non-linearly via floor-division + remainder waterfall; base installment 48333, final installment absorbs remainder 1."
        test_recipe:
          setup:
            - "GownOrder base=200000,size=22,rush=true -> quoted 290000; VEIL 15000 attached -> plan_total snapshot 305000."
            - "PaymentPlan deposit_cents=160000, term_installments=3."
          setup_api_calls:
            - call: "POST /gown-orders"
              payload: { gown_style_code: "ELEGANCE", ordered_size: 22, base_price_cents: 200000, standard_lead_days: 90, is_rush: true }
              as: BridalConsultant
              captures: { ord: $.data.id }
            - call: "POST /accessory-addons"
              payload: { gown_order_id: "${ord}", accessory_type: "VEIL", price_cents: 15000 }
              as: BridalConsultant
          trigger:
            - call: "POST /payment-plans"
              payload: { gown_order_id: "${ord}", term_installments: 3, deposit_cents: 160000 }
              as: FinanceClerk
              captures: { plan: $.data.id, inst: $.data.installment_cents, tot: $.data.plan_total_cents }
          assert:
            - "PaymentPlan.${plan}.plan_total_cents == 305000"
            - "PaymentPlan.${plan}.installment_cents == 48333"
            - "PaymentPlan.${plan}.balance_due_cents == 305000"

      - name: final_total_rounding_order_pinned_per_line
        grounds:
          - calculations.gown_order_total
          - entities.GownOrder.fields.final_total_cents
          - entities.AccessoryAddOn.fields.price_cents
          - state_machines.GownOrder.ORDERED_to_RECEIVED
        distinguishing_aspect: "Mode (b): rounding-order-sensitive — gown subtotal terms are each ceil()'d per-term then summed (size ceil(133333*0.15)=20000, rush ceil(133333*0.30)=40000) then accessory lines added last; round-per-term gives 193333 not a sum-then-round 193333.0 collapse, isolating per-line order on base 133333."
        test_recipe:
          setup:
            - "GownOrder base=133333 (odd cents to expose rounding), size=25, rush=true -> per-term ceil: subtotal 133333+20000+40000=193333."
            - "Two accessories ACTIVE: TIARA 5001, SASH 2999 -> final 193333+5001+2999=201333."
          setup_api_calls:
            - call: "POST /gown-orders"
              payload: { gown_style_code: "BESPOKE", ordered_size: 25, base_price_cents: 133333, standard_lead_days: 45, is_rush: true }
              as: BridalConsultant
              captures: { ord: $.data.id }
            - call: "POST /accessory-addons"
              payload: { gown_order_id: "${ord}", accessory_type: "TIARA", price_cents: 5001 }
              as: BridalConsultant
            - call: "POST /accessory-addons"
              payload: { gown_order_id: "${ord}", accessory_type: "SASH", price_cents: 2999 }
              as: BridalConsultant
            - call: "POST /payment-plans"
              payload: { gown_order_id: "${ord}", term_installments: 2, deposit_cents: 101000 }
              as: FinanceClerk
            - call: "POST /gown-orders/${ord}/submit"
              payload: {}
              as: BridalConsultant
          trigger:
            - call: "POST /gown-orders/${ord}/receive"
              payload: {}
              as: ShopManager
              captures: { fin: $.data.final_total_cents }
          assert:
            - "GownOrder.${ord}.quoted_total_cents == 193333"
            - "GownOrder.${ord}.final_total_cents == 201333"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: alteration_cyclic_refit_loop
        grounds:
          - state_machines.AlterationJob.FITTING_to_ADJUSTING
          - state_machines.AlterationJob.ADJUSTING_to_FITTING
          - entities.AlterationJob.fields.refitting_count
        distinguishing_aspect: "Cyclic shape on AlterationJob: FITTING->ADJUSTING->FITTING is a true loop that can repeat, incrementing refitting_count each round (2 after two loops); not a linear pipeline."
        test_recipe:
          setup:
            - "A RECEIVED GownOrder with an AlterationJob started into FITTING."
          setup_api_calls:
            - call: "POST /gown-orders"
              payload: { gown_style_code: "ATELIER", ordered_size: 12, base_price_cents: 160000, standard_lead_days: 60 }
              as: BridalConsultant
              captures: { ord: $.data.id }
            - call: "POST /payment-plans"
              payload: { gown_order_id: "${ord}", term_installments: 2, deposit_cents: 80000 }
              as: FinanceClerk
            - call: "POST /gown-orders/${ord}/submit"
              payload: {}
              as: BridalConsultant
            - call: "POST /gown-orders/${ord}/receive"
              payload: {}
              as: ShopManager
            - call: "POST /alteration-jobs"
              payload: { gown_order_id: "${ord}", estimated_labor_minutes: 40 }
              as: Seamstress
              captures: { job: $.data.id }
            - call: "POST /alteration-jobs/${job}/start-fitting"
              payload: {}
              as: Seamstress
            - call: "POST /alteration-jobs/${job}/request-adjustment"
              payload: {}
              as: Seamstress
            - call: "POST /alteration-jobs/${job}/log-labor"
              payload: { minutes: 30 }
              as: Seamstress
          trigger:
            - call: "POST /alteration-jobs/${job}/request-adjustment"
              payload: {}
              as: Seamstress
              captures: { st: $.data.status, refits: $.data.refitting_count }
          assert:
            - "AlterationJob.${job}.status == ADJUSTING"
            - "AlterationJob.${job}.refitting_count == 2"

      - name: gown_order_parallel_payment_and_fulfillment_axes
        grounds:
          - state_machines.GownOrder.ORDERED_to_RECEIVED
          - state_machines.GownOrder.UNPAID_to_DEPOSIT_PAID
          - entities.GownOrder.fields.fulfillment_status
          - entities.GownOrder.fields.payment_status
        distinguishing_aspect: "Parallel dimensions on a DIFFERENT entity (GownOrder): fulfillment_status advances to RECEIVED while payment_status independently sits at DEPOSIT_PAID — two axes evolve on the same row without coupling."
        test_recipe:
          setup:
            - "GownOrder quoted 290000; plan deposit 145000 term 5; deposit paid (DEPOSIT_PAID); order submitted then received (RECEIVED)."
          setup_api_calls:
            - call: "POST /gown-orders"
              payload: { gown_style_code: "ELEGANCE", ordered_size: 22, base_price_cents: 200000, standard_lead_days: 90, is_rush: true }
              as: BridalConsultant
              captures: { ord: $.data.id }
            - call: "POST /payment-plans"
              payload: { gown_order_id: "${ord}", term_installments: 5, deposit_cents: 145000 }
              as: FinanceClerk
              captures: { plan: $.data.id, pv: $.data.version }
            - call: "POST /payment-plans/${plan}/payments"
              payload: { amount_cents: 145000, expected_plan_version: "${pv}" }
              as: FinanceClerk
            - call: "POST /gown-orders/${ord}/submit"
              payload: {}
              as: BridalConsultant
          trigger:
            - call: "POST /gown-orders/${ord}/receive"
              payload: {}
              as: ShopManager
              captures: { ff: $.data.fulfillment_status, ps: $.data.payment_status }
          assert:
            - "GownOrder.${ord}.fulfillment_status == RECEIVED"
            - "GownOrder.${ord}.payment_status == DEPOSIT_PAID"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: order_cancel_three_hop_cascade_to_room_capacity
        grounds:
          - state_machines.GownOrder.RECEIVED_to_CANCELLED
          - state_machines.AlterationJob.FITTING_to_CANCELLED
          - state_machines.FittingRoomBooking.HELD_to_RELEASED
        distinguishing_aspect: "Depth-3 cascade from GownOrder cancel: cancel order -> AlterationJob CANCELLED (hop1) -> that job's HELD FittingRoomBooking RELEASED (hop2) -> room capacity freed (hop3). Each hop caused by the previous, not the original action."
        test_recipe:
          setup:
            - "FittingRoom capacity 4; an Appointment FITTING; a HELD FittingRoomBooking party_size 4 occupying the whole room on that fitting_room."
            - "A RECEIVED GownOrder with an AlterationJob in FITTING whose fitting_room_id is that same room."
          setup_api_calls:
            - call: "POST /fitting-rooms"
              payload: { room_label: "Suite A", capacity: 4 }
              as: ShopManager
              captures: { room: $.data.id }
            - call: "POST /stylists"
              payload: { full_name: "Dana" }
              as: ShopManager
              captures: { sty: $.data.id }
            - call: "POST /appointments"
              payload: { stylist_id: "${sty}", appointment_type: "FITTING", start_at: "2026-07-01T15:00:00.000Z", end_at: "2026-07-01T16:00:00.000Z" }
              as: BridalConsultant
              captures: { appt: $.data.id }
            - call: "POST /fitting-room-bookings"
              payload: { appointment_id: "${appt}", fitting_room_id: "${room}", party_size: 4, slot_start_at: "2026-07-01T15:00:00.000Z", slot_end_at: "2026-07-01T16:00:00.000Z" }
              as: BridalConsultant
              captures: { booking: $.data.id }
            - call: "POST /gown-orders"
              payload: { gown_style_code: "ATELIER", ordered_size: 12, base_price_cents: 160000, standard_lead_days: 60 }
              as: BridalConsultant
              captures: { ord: $.data.id }
            - call: "POST /payment-plans"
              payload: { gown_order_id: "${ord}", term_installments: 2, deposit_cents: 80000 }
              as: FinanceClerk
            - call: "POST /gown-orders/${ord}/submit"
              payload: {}
              as: BridalConsultant
            - call: "POST /gown-orders/${ord}/receive"
              payload: {}
              as: ShopManager
            - call: "POST /alteration-jobs"
              payload: { gown_order_id: "${ord}", estimated_labor_minutes: 40, fitting_room_id: "${room}" }
              as: Seamstress
              captures: { job: $.data.id }
            - call: "POST /alteration-jobs/${job}/start-fitting"
              payload: {}
              as: Seamstress
          trigger:
            - call: "POST /gown-orders/${ord}/cancel"
              payload: {}
              as: ShopManager
              captures: { ff: $.data.fulfillment_status }
          assert:
            - "GownOrder.${ord}.fulfillment_status == CANCELLED"
            - "AlterationJob.${job}.status == CANCELLED"
            - "FittingRoomBooking.${booking}.status == RELEASED"

      - name: appointment_complete_releases_room_capacity_two_hop
        grounds:
          - state_machines.Appointment.CHECKED_IN_to_COMPLETED
          - state_machines.FittingRoomBooking.HELD_to_RELEASED
          - calculations.room_occupancy_at_instant
        distinguishing_aspect: "Depth-2 cascade from a DIFFERENT trigger (appointment complete): complete -> HELD FittingRoomBooking RELEASED (hop1) -> room capacity for the slot interval freed so a new full-capacity booking now succeeds (hop2)."
        test_recipe:
          setup:
            - "FittingRoom capacity 2; Appointment CHECKED_IN with a HELD FittingRoomBooking party_size 2 over [15:00,16:00)."
          setup_api_calls:
            - call: "POST /fitting-rooms"
              payload: { room_label: "Suite B", capacity: 2 }
              as: ShopManager
              captures: { room: $.data.id }
            - call: "POST /stylists"
              payload: { full_name: "Iris" }
              as: ShopManager
              captures: { sty: $.data.id }
            - call: "POST /appointments"
              payload: { stylist_id: "${sty}", appointment_type: "FITTING", start_at: "2026-07-02T15:00:00.000Z", end_at: "2026-07-02T16:00:00.000Z" }
              as: BridalConsultant
              captures: { appt: $.data.id }
            - call: "POST /fitting-room-bookings"
              payload: { appointment_id: "${appt}", fitting_room_id: "${room}", party_size: 2, slot_start_at: "2026-07-02T15:00:00.000Z", slot_end_at: "2026-07-02T16:00:00.000Z" }
              as: BridalConsultant
              captures: { booking: $.data.id }
            - call: "POST /appointments/${appt}/check-in"
              payload: {}
              as: BridalConsultant
            - call: "POST /appointments"
              payload: { stylist_id: "${sty}", appointment_type: "FITTING", start_at: "2026-07-02T16:30:00.000Z", end_at: "2026-07-02T17:30:00.000Z" }
              as: BridalConsultant
              captures: { appt2: $.data.id }
          trigger:
            - call: "POST /appointments/${appt}/complete"
              payload: {}
              as: BridalConsultant
            - call: "POST /fitting-room-bookings"
              payload: { appointment_id: "${appt2}", fitting_room_id: "${room}", party_size: 2, slot_start_at: "2026-07-02T15:00:00.000Z", slot_end_at: "2026-07-02T16:00:00.000Z" }
              as: BridalConsultant
              captures: { booking2: $.data.id, st2: $.data.status }
          assert:
            - "FittingRoomBooking.${booking}.status == RELEASED"
            - "FittingRoomBooking.${booking2}.status == HELD"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_pickup
        grounds:
          - validations[priority=5]
          - validations[priority=12]
          - state_machines.GownOrder.READY_to_PICKED_UP
        distinguishing_aspect: "Error-category pair state(p5) vs business_fiscal(p12): an order still in RECEIVED (not READY) AND not paid in full -> the lower-priority-number state check wins, returning ERR_ORDER_NOT_READY, not ERR_BALANCE_OUTSTANDING."
        test_recipe:
          setup:
            - "GownOrder RECEIVED (not READY), payment_status UNPAID (no deposit), final_steam_done would be true."
          setup_api_calls:
            - call: "POST /gown-orders"
              payload: { gown_style_code: "ATELIER", ordered_size: 10, base_price_cents: 180000, standard_lead_days: 60 }
              as: BridalConsultant
              captures: { ord: $.data.id }
            - call: "POST /payment-plans"
              payload: { gown_order_id: "${ord}", term_installments: 2, deposit_cents: 90000 }
              as: FinanceClerk
            - call: "POST /gown-orders/${ord}/submit"
              payload: {}
              as: BridalConsultant
            - call: "POST /gown-orders/${ord}/receive"
              payload: {}
              as: ShopManager
          trigger:
            - call: "POST /gown-orders/${ord}/pickup"
              payload: { final_steam_done: true }
              as: BridalConsultant
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ORDER_NOT_READY"

      - name: temporal_beats_referential_on_party_appointment
        grounds:
          - validations[priority=3]
          - validations[priority=7]
          - state_machines.Appointment.BOOKED_to_CANCELLED
        distinguishing_aspect: "Error-category pair existence/business_referential(p3, missing bridal_party) vs business_temporal(p7, stylist double-book): a booking that BOTH names a non-existent bridal_party_id AND double-books the stylist returns the lower-number existence error ERR_PARTY_NOT_FOUND, not ERR_STYLIST_DOUBLE_BOOKED."
        test_recipe:
          setup:
            - "Stylist with one BOOKED appointment [15:00,16:00); a second booking attempt overlaps AND names a bogus bridal_party_id."
          setup_api_calls:
            - call: "POST /stylists"
              payload: { full_name: "Mara" }
              as: ShopManager
              captures: { sty: $.data.id }
            - call: "POST /appointments"
              payload: { stylist_id: "${sty}", appointment_type: "CONSULTATION", start_at: "2026-07-03T15:00:00.000Z", end_at: "2026-07-03T16:00:00.000Z" }
              as: BridalConsultant
              captures: { appt1: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { stylist_id: "${sty}", appointment_type: "CONSULTATION", start_at: "2026-07-03T15:30:00.000Z", end_at: "2026-07-03T16:30:00.000Z", bridal_party_id: "00000000-0000-4000-8000-000000000000" }
              as: BridalConsultant
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_PARTY_NOT_FOUND"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: overpayment_boundary_exact_vs_over
        grounds:
          - validations[priority=11]
          - calculations.plan_ledger
          - entities.PaymentPlan.fields.amount_paid_cents
        distinguishing_aspect: "Numeric threshold metric on POST /payment-plans/{id}/payments: amount that lands amount_paid_cents exactly == plan_total_cents (145000 after a 145000 deposit on a 290000 plan, then 145000) succeeds; one cent more (145001) crosses and triggers ERR_OVERPAYMENT."
        test_recipe:
          setup:
            - "GownOrder quoted 290000; plan deposit 145000 term 5; deposit of 145000 paid -> balance 145000."
          setup_api_calls:
            - call: "POST /gown-orders"
              payload: { gown_style_code: "ELEGANCE", ordered_size: 22, base_price_cents: 200000, standard_lead_days: 90, is_rush: true }
              as: BridalConsultant
              captures: { ord: $.data.id }
            - call: "POST /payment-plans"
              payload: { gown_order_id: "${ord}", term_installments: 5, deposit_cents: 145000 }
              as: FinanceClerk
              captures: { plan: $.data.id, pv0: $.data.version }
            - call: "POST /payment-plans/${plan}/payments"
              payload: { amount_cents: 145000, expected_plan_version: "${pv0}" }
              as: FinanceClerk
            - call: "GET /payment-plans/${plan}"
              payload: {}
              as: FinanceClerk
              captures: { pv1: $.data.version, bal: $.data.balance_due_cents }
          trigger:
            - call: "POST /payment-plans/${plan}/payments"
              payload: { amount_cents: 145001, expected_plan_version: "${pv1}" }
              as: FinanceClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_OVERPAYMENT"
            - "PaymentPlan.${plan}.amount_paid_cents == 145000"

      - name: room_capacity_zero_headroom_empty_set_edge
        grounds:
          - validations[priority=8]
          - calculations.room_occupancy_at_instant
          - entities.FittingRoom.fields.capacity
        distinguishing_aspect: "DIFFERENT metric (occupant-count headroom) on a DIFFERENT endpoint (POST /fitting-room-bookings): when existing HELD party_size sum exactly equals capacity (zero headroom), even a party_size 1 candidate over the SAME interval is rejected; an empty-overlap interval (adjacent, gap=0) succeeds."
        test_recipe:
          setup:
            - "FittingRoom capacity 2; one HELD booking party_size 2 over [15:00,16:00) (room full)."
          setup_api_calls:
            - call: "POST /fitting-rooms"
              payload: { room_label: "Suite C", capacity: 2 }
              as: ShopManager
              captures: { room: $.data.id }
            - call: "POST /stylists"
              payload: { full_name: "Ono" }
              as: ShopManager
              captures: { sty: $.data.id }
            - call: "POST /appointments"
              payload: { stylist_id: "${sty}", appointment_type: "FITTING", start_at: "2026-07-04T15:00:00.000Z", end_at: "2026-07-04T16:00:00.000Z" }
              as: BridalConsultant
              captures: { appt: $.data.id }
            - call: "POST /fitting-room-bookings"
              payload: { appointment_id: "${appt}", fitting_room_id: "${room}", party_size: 2, slot_start_at: "2026-07-04T15:00:00.000Z", slot_end_at: "2026-07-04T16:00:00.000Z" }
              as: BridalConsultant
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /fitting-room-bookings"
              payload: { appointment_id: "${appt}", fitting_room_id: "${room}", party_size: 1, slot_start_at: "2026-07-04T15:30:00.000Z", slot_end_at: "2026-07-04T15:45:00.000Z" }
              as: BridalConsultant
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_FITTING_ROOM_OVERBOOKED"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: start_fitting_requires_order_received
        grounds:
          - state_machines.AlterationJob.QUEUED_to_FITTING
          - state_machines.GownOrder.ORDERED_to_RECEIVED
          - validations[priority=6]
        distinguishing_aspect: "Entity pair AlterationJob -> GownOrder: start-fitting on a QUEUED job is rejected with ERR_ORDER_NOT_RECEIVED while the linked GownOrder is still ORDERED (not RECEIVED), and succeeds once the order is received."
        test_recipe:
          setup:
            - "GownOrder ORDERED (not yet received); an AlterationJob QUEUED on it."
          setup_api_calls:
            - call: "POST /gown-orders"
              payload: { gown_style_code: "ATELIER", ordered_size: 10, base_price_cents: 180000, standard_lead_days: 60 }
              as: BridalConsultant
              captures: { ord: $.data.id }
            - call: "POST /payment-plans"
              payload: { gown_order_id: "${ord}", term_installments: 2, deposit_cents: 90000 }
              as: FinanceClerk
            - call: "POST /gown-orders/${ord}/submit"
              payload: {}
              as: BridalConsultant
            - call: "POST /alteration-jobs"
              payload: { gown_order_id: "${ord}", estimated_labor_minutes: 40 }
              as: Seamstress
              captures: { job: $.data.id }
          trigger:
            - call: "POST /alteration-jobs/${job}/start-fitting"
              payload: {}
              as: Seamstress
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ORDER_NOT_RECEIVED"
            - "AlterationJob.${job}.status == QUEUED"

      - name: pickup_requires_payment_paid_in_full
        grounds:
          - state_machines.GownOrder.READY_to_PICKED_UP
          - state_machines.GownOrder.UNPAID_to_DEPOSIT_PAID
          - validations[priority=12]
        distinguishing_aspect: "DIFFERENT entity pair (GownOrder fulfillment axis -> GownOrder payment axis): a READY order with payment_status DEPOSIT_PAID (balance > 0) is rejected on pickup with ERR_BALANCE_OUTSTANDING even though fulfillment is READY and steam done."
        test_recipe:
          setup:
            - "GownOrder quoted 180000; plan deposit 90000 term 2; deposit paid (DEPOSIT_PAID, balance 90000); order ORDERED->RECEIVED->READY (no alterations)."
          setup_api_calls:
            - call: "POST /gown-orders"
              payload: { gown_style_code: "ATELIER", ordered_size: 10, base_price_cents: 180000, standard_lead_days: 60 }
              as: BridalConsultant
              captures: { ord: $.data.id }
            - call: "POST /payment-plans"
              payload: { gown_order_id: "${ord}", term_installments: 2, deposit_cents: 90000 }
              as: FinanceClerk
              captures: { plan: $.data.id, pv0: $.data.version }
            - call: "POST /payment-plans/${plan}/payments"
              payload: { amount_cents: 90000, expected_plan_version: "${pv0}" }
              as: FinanceClerk
            - call: "POST /gown-orders/${ord}/submit"
              payload: {}
              as: BridalConsultant
            - call: "POST /gown-orders/${ord}/receive"
              payload: {}
              as: ShopManager
            - call: "POST /gown-orders/${ord}/mark-ready"
              payload: {}
              as: Seamstress
          trigger:
            - call: "POST /gown-orders/${ord}/pickup"
              payload: { final_steam_done: true }
              as: BridalConsultant
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_BALANCE_OUTSTANDING"
            - "GownOrder.${ord}.fulfillment_status == READY"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: stylist_buffered_overlap_rejected
        grounds:
          - validations[priority=7]
          - entities.Stylist.fields.turnaround_buffer_minutes
          - state_machines.Appointment.BOOKED_to_CANCELLED
        distinguishing_aspect: "Stylist interval semantics use a turnaround BUFFER inflating the existing appointment's end side: a second appointment starting 11:10 against an existing [10:00,11:00) on a stylist with 15-min buffer falls inside the buffered tail (11:00+15=11:15) and is rejected ERR_STYLIST_DOUBLE_BOOKED; buffer-only adjacency arithmetic."
        test_recipe:
          setup:
            - "Stylist turnaround_buffer_minutes=15 with one BOOKED appointment [10:00,11:00)."
          setup_api_calls:
            - call: "POST /stylists"
              payload: { full_name: "Pia", turnaround_buffer_minutes: 15 }
              as: ShopManager
              captures: { sty: $.data.id }
            - call: "POST /appointments"
              payload: { stylist_id: "${sty}", appointment_type: "CONSULTATION", start_at: "2026-07-05T10:00:00.000Z", end_at: "2026-07-05T11:00:00.000Z" }
              as: BridalConsultant
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { stylist_id: "${sty}", appointment_type: "CONSULTATION", start_at: "2026-07-05T11:10:00.000Z", end_at: "2026-07-05T12:00:00.000Z" }
              as: BridalConsultant
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_STYLIST_DOUBLE_BOOKED"

      - name: fitting_room_aggregate_capacity_half_open
        grounds:
          - validations[priority=8]
          - calculations.room_occupancy_at_instant
          - entities.FittingRoom.fields.capacity
        distinguishing_aspect: "DIFFERENT resource entity (FittingRoom) and DIFFERENT interval semantics: NO buffer, but AGGREGATE party_size summed over half-open [start,end) intervals — two HELD bookings of party_size 2 and 2 in a capacity-3 room conflict (sum 4>3) while a fully adjacent (gap=0) interval does not."
        test_recipe:
          setup:
            - "FittingRoom capacity 3; one HELD booking party_size 2 over [15:00,16:00)."
          setup_api_calls:
            - call: "POST /fitting-rooms"
              payload: { room_label: "Suite D", capacity: 3 }
              as: ShopManager
              captures: { room: $.data.id }
            - call: "POST /stylists"
              payload: { full_name: "Quinn" }
              as: ShopManager
              captures: { sty: $.data.id }
            - call: "POST /appointments"
              payload: { stylist_id: "${sty}", appointment_type: "FITTING", start_at: "2026-07-06T15:00:00.000Z", end_at: "2026-07-06T16:00:00.000Z" }
              as: BridalConsultant
              captures: { appt: $.data.id }
            - call: "POST /fitting-room-bookings"
              payload: { appointment_id: "${appt}", fitting_room_id: "${room}", party_size: 2, slot_start_at: "2026-07-06T15:00:00.000Z", slot_end_at: "2026-07-06T16:00:00.000Z" }
              as: BridalConsultant
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /fitting-room-bookings"
              payload: { appointment_id: "${appt}", fitting_room_id: "${room}", party_size: 2, slot_start_at: "2026-07-06T15:30:00.000Z", slot_end_at: "2026-07-06T16:30:00.000Z" }
              as: BridalConsultant
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_FITTING_ROOM_OVERBOOKED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: refund_restores_payment_ledger_to_zero
        grounds:
          - state_machines.PaymentPlan.ACTIVE_to_CANCELLED
          - state_machines.GownOrder.DEPOSIT_PAID_to_REFUNDED
          - calculations.plan_ledger
          - entities.PaymentPlan.fields.amount_paid_cents
        distinguishing_aspect: "Conserved quantity = money ledger: after deposit 145000 then full refund on a cancelled order, amount_paid_cents returns to exactly 0 and balance_due_cents back to plan_total_cents 290000 — the forward (pay) + compensating (refund) pair leaves net paid unchanged at 0."
        test_recipe:
          setup:
            - "GownOrder quoted 290000; plan deposit 145000; deposit paid (amount_paid 145000); order CANCELLED."
          setup_api_calls:
            - call: "POST /gown-orders"
              payload: { gown_style_code: "ELEGANCE", ordered_size: 22, base_price_cents: 200000, standard_lead_days: 90, is_rush: true }
              as: BridalConsultant
              captures: { ord: $.data.id }
            - call: "POST /payment-plans"
              payload: { gown_order_id: "${ord}", term_installments: 5, deposit_cents: 145000 }
              as: FinanceClerk
              captures: { plan: $.data.id, pv0: $.data.version }
            - call: "POST /payment-plans/${plan}/payments"
              payload: { amount_cents: 145000, expected_plan_version: "${pv0}" }
              as: FinanceClerk
            - call: "POST /gown-orders/${ord}/cancel"
              payload: {}
              as: ShopManager
            - call: "GET /payment-plans/${plan}"
              payload: {}
              as: FinanceClerk
              captures: { pv1: $.data.version }
          trigger:
            - call: "POST /payment-plans/${plan}/refund"
              payload: { expected_plan_version: "${pv1}" }
              as: FinanceClerk
          assert:
            - "PaymentPlan.${plan}.amount_paid_cents == 0"
            - "PaymentPlan.${plan}.balance_due_cents == 290000"
            - "GownOrder.${ord}.payment_status == REFUNDED"

      - name: book_then_release_conserves_room_capacity
        grounds:
          - state_machines.FittingRoomBooking.HELD_to_RELEASED
          - calculations.room_occupancy_at_instant
          - entities.FittingRoom.fields.capacity
        distinguishing_aspect: "DIFFERENT conserved quantity = room occupant capacity: holding party_size 3 then releasing it leaves the room's available headroom over [15:00,16:00) back at full capacity 4, proven by a fresh party_size 4 booking succeeding after release."
        test_recipe:
          setup:
            - "FittingRoom capacity 4; an Appointment; a HELD booking party_size 3 over [15:00,16:00) then RELEASED."
          setup_api_calls:
            - call: "POST /fitting-rooms"
              payload: { room_label: "Suite E", capacity: 4 }
              as: ShopManager
              captures: { room: $.data.id }
            - call: "POST /stylists"
              payload: { full_name: "Reed" }
              as: ShopManager
              captures: { sty: $.data.id }
            - call: "POST /appointments"
              payload: { stylist_id: "${sty}", appointment_type: "FITTING", start_at: "2026-07-07T15:00:00.000Z", end_at: "2026-07-07T16:00:00.000Z" }
              as: BridalConsultant
              captures: { appt: $.data.id }
            - call: "POST /fitting-room-bookings"
              payload: { appointment_id: "${appt}", fitting_room_id: "${room}", party_size: 3, slot_start_at: "2026-07-07T15:00:00.000Z", slot_end_at: "2026-07-07T16:00:00.000Z" }
              as: BridalConsultant
              captures: { b1: $.data.id }
            - call: "POST /fitting-room-bookings/${b1}/release"
              payload: {}
              as: BridalConsultant
          trigger:
            - call: "POST /fitting-room-bookings"
              payload: { appointment_id: "${appt}", fitting_room_id: "${room}", party_size: 4, slot_start_at: "2026-07-07T15:00:00.000Z", slot_end_at: "2026-07-07T16:00:00.000Z" }
              as: BridalConsultant
              captures: { b2: $.data.id, st: $.data.status }
          assert:
            - "FittingRoomBooking.${b1}.status == RELEASED"
            - "FittingRoomBooking.${b2}.status == HELD"
