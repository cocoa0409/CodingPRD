  - name: reinstate_blocked_while_debt_outstanding
    claim_type: rate_threshold_triggers
    grounds:
    - state_machines.Pharmacy.SUSPENDED_to_ACTIVE
    - errors[ERR_PHARMACY_DEBT_OUTSTANDING]
    distinguishing_aspect: Reinstate while balance (-6000) is still <= -threshold (-5000) fails 409 ERR_PHARMACY_DEBT_OUTSTANDING;
      after a 20000 balance adjustment the same reinstate succeeds.
    test_recipe:
      setup:
      - Pharmacy SUSPENDED via audit clawback cascade (balance -6000, threshold 5000)
      setup_api_calls:
      - call: POST /plans
        payload:
          name: P-DEBT
          deductible_cents: 0
          oop_max_cents: 100000
          assistance_model: ACCUMULATOR
          member_min_pay_cents: 0
          card_fill_cap_cents: 0
          dispensing_fee_cents: 0
        as: PbmAdmin
        captures:
          p_debt: $.data.id
      - call: POST /drugs
        payload:
          ndc: 00000-9041
          name: Debtol
          therapeutic_class: ANTACID
          unit_cost_cents: 1000
          max_daily_dose_units: 100
          is_specialty: false
        as: PbmAdmin
        captures:
          d_debt: $.data.id
      - call: POST /formulary-entries
        payload:
          plan_id: ${p_debt}
          drug_id: ${d_debt}
          tier: 1
          quantity_limit_per_fill: 90
          max_days_supply: 90
          copay_type: FLAT
          copay_flat_cents: 0
        as: PbmAdmin
      - call: POST /plans/${p_debt}/activate
        payload: {}
        as: PbmAdmin
      - call: POST /pharmacies
        payload:
          ncpdp_id: NCPDP-DEBT
          name: Rx Debt
          channel: RETAIL
          auto_suspend_threshold_cents: 5000
        as: PbmAdmin
        captures:
          ph_debt: $.data.id
      - call: POST /members
        payload:
          plan_id: ${p_debt}
          external_ref: M-DEBT
          full_name: Pat Debt
          eligibility_start_date: '2026-01-01'
          eligibility_end_date: '2026-12-31'
        as: PbmAdmin
        captures:
          m_debt: $.data.id
      - call: POST /claims
        payload:
          member_id: ${m_debt}
          drug_id: ${d_debt}
          prescription_number: RX-DEBT
          fill_date: '2026-03-01'
          quantity: 10
          days_supply: 10
        as: Pharmacist
        as_user_id: ${ph_debt}
        captures:
          c_debt: $.data.id
      - call: POST /audits
        payload:
          pharmacy_id: ${ph_debt}
          window_start_date: '2026-01-01'
          window_end_date: '2026-12-31'
          extrapolation_method: CLAIM_LEVEL
        as: Auditor
        captures:
          au_debt: $.data.id
      - call: POST /audits/${au_debt}/findings
        payload:
          findings:
          - claim_id: ${c_debt}
            clawback_cents: 16000
        as: Auditor
      - call: POST /audits/${au_debt}/close
        payload: {}
        as: Auditor
      trigger:
      - call: POST /pharmacies/${ph_debt}/reinstate
        payload: {}
        as: PbmAdmin
        captures:
          err_debt: $.data.error_id
      - call: POST /pharmacies/${ph_debt}/balance-adjustments
        payload:
          amount_cents: 20000
          reason: settlement check
        as: PbmAdmin
      - call: POST /pharmacies/${ph_debt}/reinstate
        payload: {}
        as: PbmAdmin
      assert:
      - 'First reinstate: 409 ERR_PHARMACY_DEBT_OUTSTANDING (balance -6000 <= -5000)'
      - 'After +20000 adjustment: balance 14000; second reinstate: 200, Pharmacy.${ph_debt}.status == ACTIVE'
