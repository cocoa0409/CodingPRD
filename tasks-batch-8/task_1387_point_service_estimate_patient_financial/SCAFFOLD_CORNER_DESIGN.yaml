            - "Estimate.${est_id}.patient_responsibility_cents == 20002 (not 20001, the aggregate-rounding trap value)"

      - name: gfe_discount_rounded_per_line
        claim_type: precision
        grounds: [calculations.estimate_patient_responsibility]
        distinguishing_aspect: "The 25% uninsured discount is rounded per line then summed: two lines at list 100001 give (100001 - 25000) x2 = 150002; discounting the aggregate once would give 150001."
        test_recipe:
          setup: ["Charge items 95001 and 95002 list 100001 each; patient with case (service 2026-08-20) and DRAFT UNINSURED_GFE estimate [95001 x1, 95002 x1]"]
