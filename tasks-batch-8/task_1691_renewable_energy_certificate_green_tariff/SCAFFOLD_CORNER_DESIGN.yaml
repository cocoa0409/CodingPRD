  - section: endpoints
    instances:
      - name: response_envelope_shape_success_and_error
        claim_type: side_effect_execution
        grounds: ["response_envelope"]
        distinguishing_aspect: "Every response carries the fixed envelope: success has meta.api_request_id + meta.api_request_timestamp + response_type + data; errors carry response_type 'error' with data.error_id and data.message."
        test_recipe:
          setup: ["one generator exists"]
          setup_api_calls:
            - call: "POST /greenpower/generators"
              payload: { legal_name: "Sierra Solar", facility_code: "SS1", technology: "SOLAR", nameplate_capacity_kw: 5000, region_code: "CAISO", commissioning_date: "2020-01-01" }
              as: RegistryAdmin
              captures: { g: $.data.id }
          trigger:
            - call: "GET /greenpower/generators/${g}"
              as: Auditor
            - call: "GET /greenpower/generators/00000000-0000-0000-0000-000000000000"
              as: Auditor
              captures: { err: $.data.error_id }
          assert:
            - "success response: meta.api_request_id non-empty, meta.api_request_timestamp ISO8601, response_type == 'object', data.id == ${g}"
            - "error response: response_type == 'error', data.error_id == ERR_NOT_FOUND, data.message non-empty"

      - name: certificate_transfer_holdings_ledger_sync
        claim_type: side_effect_execution
        grounds: ["entities.Account.fields.active_holdings_mwh", "state_machines.Certificate"]
        distinguishing_aspect: "Ledger sync on transfer: 5-MWh certificate transfer moves active_holdings_mwh 5 -> 0 on the source and 0 -> 5 on the target in the same request, and bumps the certificate version."
        test_recipe:
          setup: ["5-MWh certificate minted into the generator account; broker account b1 exists"]
          setup_api_calls:
            - call: "POST /greenpower/generators"
              payload: { legal_name: "Sierra Solar", facility_code: "SS1", technology: "SOLAR", nameplate_capacity_kw: 5000, region_code: "CAISO", commissioning_date: "2020-01-01" }
              as: RegistryAdmin
              captures: { g: $.data.id }
