          Category pair state (priority 7) versus business_temporal (priority 14) on
          POST /interviews. Both conditions are genuinely violated by the same request: the
          owning AuditProject is still in PLANNING and interviewer int-9 already holds an
          intersecting window booked under a different project, and priority 14's check is
          explicitly cross-project so it would fire on its own. Only the lower-numbered
          stage error may surface.
