          setup:
            - "logical clock at 2026-11-15T00:00:00Z"
            - "one ACTIVE campaign with two APPROVED EXCLUSIVE host sites sharing retailer Northgate Market store 114"
            - "one DRAFT kettle location at host site 1 with placement window 2026-11-01..2026-11-30"
