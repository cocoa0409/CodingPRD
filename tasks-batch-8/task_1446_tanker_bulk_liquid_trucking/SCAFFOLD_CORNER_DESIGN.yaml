            - { call: "GET /bulk-liquid/dedicated-trailer-agreements/${agr}", as: FleetAdmin, captures: { flags: $.data.flagged_shipment_count, ast: $.data.status } }
          assert:
            - "DedicatedTrailerAgreement.${agr}.flagged_shipment_count == 2 after the second variance close"
            - "DedicatedTrailerAgreement.${agr}.status == SUSPENDED (2 >= FLAG_SUSPEND_THRESHOLD 2)"
            - "Shipment.${s2}.status == VARIANCE_REVIEW"
      - name: reconcile_blocked_by_open_incident
        claim_type: violation_to_error
        grounds: ["errors[ERR_OPEN_INCIDENT]", state_machines.Shipment.DELIVERED_to_RECONCILED]
        distinguishing_aspect: "Cross-entity gate at reconcile: an incident still UNDER_REVIEW blocks with ERR_OPEN_INCIDENT; closing it unblocks reconcile."
        test_recipe:
          setup: ["shipment DELIVERED; incident UNDER_REVIEW"]
          setup_api_calls:
            - { call: "POST /bulk-liquid/customers", payload: { name: "Acme Chem", credit_limit_cents: 1000000000 }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bulk-liquid/products", payload: { name: "Diesel ULSD", compatibility_group: PETROLEUM, hazmat_class: CLASS_3_FLAMMABLE, packing_group: II, density_lb_per_gal: 7.0, temp_coeff_per_degF: 0.0007, placard_code: "UN1993" }, as: FleetAdmin, captures: { prod: $.data.id } }
