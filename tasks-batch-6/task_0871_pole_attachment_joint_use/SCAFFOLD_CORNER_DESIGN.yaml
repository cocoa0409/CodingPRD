# =============================================================================
# 1.9 Scaffold Corner Design (breadth coverage of non-difficulty claims)
# Default logical clock at server start: 2026-05-01T00:00:00Z
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_pole_owner_success
        claim_type: Creation
        grounds: [entities.PoleOwner.fields.legal_name, endpoints]
        distinguishing_aspect: "POST /joint-use/pole-owners with all required fields returns 201 and a server-minted UUID id plus version==1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /joint-use/pole-owners"
              payload: { legal_name: "O", owner_category: "ELECTRIC_UTILITY", annual_rental_rate_cents: 1000, make_ready_labor_rate_cents_per_hour: 12000 }
              as: JointUseCoordinator
              captures: { owner_id: $.data.id, v: $.data.version }
          assert:
            - "response_type == object AND http_status == 201"
            - "PoleOwner.${owner_id}.version == 1"

      - name: attacher_default_credit_limit_applied
        claim_type: Defaults
        grounds: [entities.Attacher.fields.credit_limit_cents]
        distinguishing_aspect: "Omitting credit_limit_cents applies the default 5000000."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /joint-use/attachers"
              payload: { company_name: "Acme", cin: "CIN1", contact_email: "a@x.com" }
              as: JointUseCoordinator
              captures: { att_id: $.data.id }
          assert:
            - "Attacher.${att_id}.credit_limit_cents == 5000000"
            - "Attacher.${att_id}.account_balance_cents == 0"

      - name: pole_computed_space_starts_zero
        claim_type: Computed Fields
        grounds: [entities.Pole.fields.occupied_space_inches, entities.Pole.fields.reserved_space_inches]
        distinguishing_aspect: "A freshly created pole has occupied_space_inches==0, reserved_space_inches==0 and status==ACTIVE regardless of input."
        test_recipe:
          setup: ["An owner exists."]
          setup_api_calls:
            - call: "POST /joint-use/pole-owners"
              payload: { legal_name: "O", owner_category: "ILEC", annual_rental_rate_cents: 1000, make_ready_labor_rate_cents_per_hour: 12000 }
              as: JointUseCoordinator
              captures: { owner_id: $.data.id }
          trigger:
            - call: "POST /joint-use/poles"
              payload: { pole_owner_id: "${owner_id}", tag: "P1", height_ft: 35, usable_communication_space_inches: 60 }
              as: JointUseCoordinator
              captures: { pole_id: $.data.id }
          assert:
            - "Pole.${pole_id}.occupied_space_inches == 0"
            - "Pole.${pole_id}.reserved_space_inches == 0"
            - "Pole.${pole_id}.status == ACTIVE"

      - name: application_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_APPLICATION_NOT_FOUND]"]
        distinguishing_aspect: "GET /joint-use/applications/{unknown} returns ERR_APPLICATION_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /joint-use/applications/00000000-0000-4000-8000-000000000000"
              as: JointUseCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_APPLICATION_NOT_FOUND"
            - "http_status == 404"

      - name: create_application_missing_required_field_rejected
        claim_type: Required Fields
        grounds: [entities.AttachmentApplication.fields.requested_space_inches, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /joint-use/applications without requested_space_inches returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Owner, pole, attacher exist."]
          setup_api_calls:
            - call: "POST /joint-use/pole-owners"
              payload: { legal_name: "O", owner_category: "ELECTRIC_UTILITY", annual_rental_rate_cents: 1000, make_ready_labor_rate_cents_per_hour: 12000 }
              as: JointUseCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /joint-use/poles"
              payload: { pole_owner_id: "${owner_id}", tag: "P1", height_ft: 35, usable_communication_space_inches: 60 }
              as: JointUseCoordinator
              captures: { pole_id: $.data.id }
            - call: "POST /joint-use/attachers"
              payload: { company_name: "Acme", cin: "CIN1", contact_email: "a@x.com" }
              as: JointUseCoordinator
              captures: { att_id: $.data.id }
          trigger:
            - call: "POST /joint-use/applications"
              payload: { pole_id: "${pole_id}", attacher_id: "${att_id}", requested_position_inches: 240, purpose: "FIBER" }
              as: Attacher
              as_user_id: "${att_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"
            - "http_status == 422"

      - name: duplicate_cin_rejected
        claim_type: Type Constraints
        grounds: [entities.Attacher.fields.cin, "errors[ERR_DUPLICATE_CIN]"]
        distinguishing_aspect: "Registering a second Attacher with an already-used cin returns ERR_DUPLICATE_CIN (409)."
        test_recipe:
          setup: ["One attacher with cin CIN1 exists."]
          setup_api_calls:
            - call: "POST /joint-use/attachers"
              payload: { company_name: "Acme", cin: "CIN1", contact_email: "a@x.com" }
              as: JointUseCoordinator
          trigger:
            - call: "POST /joint-use/attachers"
              payload: { company_name: "Beta", cin: "CIN1", contact_email: "b@x.com" }
              as: JointUseCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_DUPLICATE_CIN"
            - "http_status == 409"

      - name: duplicate_pole_tag_rejected
        claim_type: Type Constraints
        grounds: [entities.Pole.fields.tag, "errors[ERR_DUPLICATE_POLE_TAG]"]
        distinguishing_aspect: "Two poles with the same tag under the same owner returns ERR_DUPLICATE_POLE_TAG (409)."
        test_recipe:
          setup: ["Owner with pole tag P1 exists."]
          setup_api_calls:
            - call: "POST /joint-use/pole-owners"
              payload: { legal_name: "O", owner_category: "MUNICIPAL", annual_rental_rate_cents: 1000, make_ready_labor_rate_cents_per_hour: 12000 }
              as: JointUseCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /joint-use/poles"
              payload: { pole_owner_id: "${owner_id}", tag: "P1", height_ft: 35, usable_communication_space_inches: 60 }
              as: JointUseCoordinator
          trigger:
            - call: "POST /joint-use/poles"
              payload: { pole_owner_id: "${owner_id}", tag: "P1", height_ft: 40, usable_communication_space_inches: 72 }
              as: JointUseCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_DUPLICATE_POLE_TAG"
            - "http_status == 409"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: estimate_before_survey_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.AttachmentApplication.SURVEYED_to_ESTIMATE_ISSUED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST estimate on a SUBMITTED application (not yet SURVEYED) returns ERR_INVALID_STATE (409); no fee is computed."
        test_recipe:
          setup: ["Application just created (SUBMITTED)."]
          setup_api_calls:
            - call: "POST /joint-use/pole-owners"
              payload: { legal_name: "O", owner_category: "ELECTRIC_UTILITY", annual_rental_rate_cents: 1000, make_ready_labor_rate_cents_per_hour: 12000 }
              as: JointUseCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /joint-use/poles"
              payload: { pole_owner_id: "${owner_id}", tag: "P1", height_ft: 35, usable_communication_space_inches: 60 }
              as: JointUseCoordinator
              captures: { pole_id: $.data.id }
            - call: "POST /joint-use/attachers"
              payload: { company_name: "Acme", cin: "CIN1", contact_email: "a@x.com" }
              as: JointUseCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /joint-use/applications"
              payload: { pole_id: "${pole_id}", attacher_id: "${att_id}", requested_space_inches: 6, requested_position_inches: 240, purpose: "FIBER" }
              as: Attacher
              as_user_id: "${att_id}"
              captures: { app_id: $.data.id, app_v: $.data.version }
          trigger:
            - call: "POST /joint-use/applications/${app_id}/estimate"
              payload: { expected_application_version: "${app_v}" }
              as: Engineer
              as_user_id: "eng-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: withdraw_then_survey_on_terminal_rejected
        claim_type: Terminal State Lockdown
        grounds: [state_machines.AttachmentApplication.SUBMITTED_to_WITHDRAWN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "After WITHDRAWN (terminal), POST survey returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Application created then withdrawn (terminal)."]
          setup_api_calls:
            - call: "POST /joint-use/pole-owners"
              payload: { legal_name: "O", owner_category: "ELECTRIC_UTILITY", annual_rental_rate_cents: 1000, make_ready_labor_rate_cents_per_hour: 12000 }
              as: JointUseCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /joint-use/crews"
              payload: { pole_owner_id: "${owner_id}", crew_name: "C1", region: "R1" }
              as: JointUseCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /joint-use/poles"
              payload: { pole_owner_id: "${owner_id}", tag: "P1", height_ft: 35, usable_communication_space_inches: 60 }
              as: JointUseCoordinator
              captures: { pole_id: $.data.id }
            - call: "POST /joint-use/attachers"
              payload: { company_name: "Acme", cin: "CIN1", contact_email: "a@x.com" }
              as: JointUseCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /joint-use/applications"
              payload: { pole_id: "${pole_id}", attacher_id: "${att_id}", requested_space_inches: 6, requested_position_inches: 240, purpose: "FIBER" }
              as: Attacher
              as_user_id: "${att_id}"
              captures: { app_id: $.data.id }
            - call: "POST /joint-use/applications/${app_id}/withdraw"
              as: Attacher
              as_user_id: "${att_id}"
          trigger:
            - call: "POST /joint-use/applications/${app_id}/survey"
              payload: { crew_id: "${crew_id}", window_start: "2026-05-10T08:00:00Z", window_end: "2026-05-10T12:00:00Z", estimated_labor_hours: 4, make_ready_required: true, existing_attacher_count: 0, complexity_class: "SIMPLE", findings: "x" }
              as: Engineer
              as_user_id: "eng-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: retire_pole_with_open_application_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Pole.ACTIVE_to_RETIRED, "errors[ERR_POLE_HAS_ATTACHMENTS]"]
        distinguishing_aspect: "Retiring a pole that has a non-terminal application returns ERR_POLE_HAS_ATTACHMENTS (409)."
        test_recipe:
          setup: ["Pole with a SUBMITTED application."]
          setup_api_calls:
            - call: "POST /joint-use/pole-owners"
              payload: { legal_name: "O", owner_category: "ELECTRIC_UTILITY", annual_rental_rate_cents: 1000, make_ready_labor_rate_cents_per_hour: 12000 }
              as: JointUseCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /joint-use/poles"
              payload: { pole_owner_id: "${owner_id}", tag: "P1", height_ft: 35, usable_communication_space_inches: 60 }
              as: JointUseCoordinator
              captures: { pole_id: $.data.id }
            - call: "POST /joint-use/attachers"
              payload: { company_name: "Acme", cin: "CIN1", contact_email: "a@x.com" }
              as: JointUseCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /joint-use/applications"
              payload: { pole_id: "${pole_id}", attacher_id: "${att_id}", requested_space_inches: 6, requested_position_inches: 240, purpose: "FIBER" }
              as: Attacher
              as_user_id: "${att_id}"
          trigger:
            - call: "POST /joint-use/poles/${pole_id}/retire"
              as: JointUseCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_POLE_HAS_ATTACHMENTS"
            - "http_status == 409"

      - name: pay_already_paid_invoice_rejected
        claim_type: Idempotency
        grounds: [state_machines.Invoice.ISSUED_to_PAID, "errors[ERR_INVOICE_ALREADY_TERMINAL]"]
        distinguishing_aspect: "Paying an already-PAID invoice returns ERR_INVOICE_ALREADY_TERMINAL (409)."
        test_recipe:
          setup: ["An UNAUTHORIZED invoice is created for a finding and paid once."]
          setup_api_calls:
            - call: "POST /joint-use/pole-owners"
              payload: { legal_name: "O", owner_category: "ILEC", annual_rental_rate_cents: 1000, make_ready_labor_rate_cents_per_hour: 12000 }
              as: JointUseCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /joint-use/poles"
              payload: { pole_owner_id: "${owner_id}", tag: "P1", height_ft: 35, usable_communication_space_inches: 60 }
              as: JointUseCoordinator
              captures: { pole_id: $.data.id }
            - call: "POST /joint-use/attachers"
              payload: { company_name: "Acme", cin: "CIN1", contact_email: "a@x.com" }
              as: JointUseCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /joint-use/findings"
              payload: { pole_id: "${pole_id}", attacher_id: "${att_id}", discovered_space_inches: 8, discovered_position_inches: 150, good_faith: true, estimated_install_years_ago: 1 }
              as: FieldAuditor
              captures: { inv_id: $.data.penalty_invoice_id }
            - call: "POST /joint-use/invoices/${inv_id}/pay"
              as: Attacher
              as_user_id: "${att_id}"
          trigger:
            - call: "POST /joint-use/invoices/${inv_id}/pay"
              as: Attacher
              as_user_id: "${att_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVOICE_ALREADY_TERMINAL"
            - "http_status == 409"

      - name: attachment_transfer_creates_new_active_owner
        claim_type: Side Effect Execution
        grounds: [state_machines.Attachment.ACTIVE_to_TRANSFERRED, entities.Attachment.fields.transferred_from_attacher_id]
        distinguishing_aspect: "Transfer marks the old attachment TRANSFERRED and creates a new ACTIVE attachment owned by new_attacher_id with transferred_from_attacher_id set; pole occupied space is unchanged."
        test_recipe:
          setup: ["An ACTIVE attachment owned by attacher A (span 6, occupied 6); attacher B exists."]
          setup_api_calls:
            - call: "POST /joint-use/pole-owners"
              payload: { legal_name: "O", owner_category: "ELECTRIC_UTILITY", annual_rental_rate_cents: 1000, make_ready_labor_rate_cents_per_hour: 12000 }
              as: JointUseCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /joint-use/crews"
              payload: { pole_owner_id: "${owner_id}", crew_name: "C1", region: "R1" }
              as: JointUseCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /joint-use/poles"
              payload: { pole_owner_id: "${owner_id}", tag: "P1", height_ft: 35, usable_communication_space_inches: 60 }
              as: JointUseCoordinator
              captures: { pole_id: $.data.id }
            - call: "POST /joint-use/attachers"
              payload: { company_name: "A", cin: "CINA", contact_email: "a@x.com" }
              as: JointUseCoordinator
              captures: { att_a: $.data.id }
            - call: "POST /joint-use/attachers"
              payload: { company_name: "B", cin: "CINB", contact_email: "b@x.com" }
              as: JointUseCoordinator
              captures: { att_b: $.data.id }
            - call: "POST /joint-use/applications"
              payload: { pole_id: "${pole_id}", attacher_id: "${att_a}", requested_space_inches: 6, requested_position_inches: 240, purpose: "FIBER" }
              as: Attacher
              as_user_id: "${att_a}"
              captures: { app_id: $.data.id }
            - call: "POST /joint-use/applications/${app_id}/survey"
              payload: { crew_id: "${crew_id}", window_start: "2026-05-10T08:00:00Z", window_end: "2026-05-10T12:00:00Z", estimated_labor_hours: 4, make_ready_required: true, existing_attacher_count: 0, complexity_class: "SIMPLE", findings: "ok" }
              as: Engineer
              as_user_id: "eng-1"
            - call: "GET /joint-use/applications/${app_id}"
              as: Engineer
              captures: { app_v: $.data.version }
            - call: "POST /joint-use/applications/${app_id}/estimate"
              payload: { expected_application_version: "${app_v}" }
              as: Engineer
              as_user_id: "eng-1"
            - call: "POST /joint-use/applications/${app_id}/estimate-decision"
              payload: { decision: "ACCEPT" }
              as: Attacher
              as_user_id: "${att_a}"
            - call: "POST /joint-use/applications/${app_id}/permit"
              payload: { decision: "GRANTED", actual_labor_hours: 4 }
              as: PermitOfficer
              as_user_id: "po-1"
            - call: "GET /joint-use/attachments"
              payload: { application_id: "${app_id}" }
              as: JointUseCoordinator
              captures: { att_old: "$.data[0].id" }
          trigger:
            - call: "POST /joint-use/attachments/${att_old}/transfer"
              payload: { new_attacher_id: "${att_b}" }
              as: Attacher
              as_user_id: "${att_a}"
          assert:
            - "Attachment.${att_old}.status == TRANSFERRED"
            - "Pole.${pole_id}.occupied_space_inches == 6"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: annual_rental_first_year_proration_correct
        claim_type: Correct Result
        grounds: [calculations.annual_rental_first_year_proration, entities.AttachmentApplication.fields.annual_rental_fee_cents]
        distinguishing_aspect: "Permit granted at 2026-07-01 for span 6 at rate 1000: full_year=500, remaining_days=184, annual_rental_fee_cents=round(500*184/365)=252."
        test_recipe:
          setup: ["Application accepted; clock set to 2026-07-01 before grant."]
          setup_api_calls:
            - call: "POST /joint-use/pole-owners"
              payload: { legal_name: "O", owner_category: "ELECTRIC_UTILITY", annual_rental_rate_cents: 1000, make_ready_labor_rate_cents_per_hour: 12000 }
              as: JointUseCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /joint-use/crews"
              payload: { pole_owner_id: "${owner_id}", crew_name: "C1", region: "R1" }
              as: JointUseCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /joint-use/poles"
              payload: { pole_owner_id: "${owner_id}", tag: "P1", height_ft: 35, usable_communication_space_inches: 60 }
              as: JointUseCoordinator
              captures: { pole_id: $.data.id }
            - call: "POST /joint-use/attachers"
              payload: { company_name: "Acme", cin: "CIN1", contact_email: "a@x.com" }
              as: JointUseCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /joint-use/applications"
              payload: { pole_id: "${pole_id}", attacher_id: "${att_id}", requested_space_inches: 6, requested_position_inches: 240, purpose: "FIBER" }
              as: Attacher
              as_user_id: "${att_id}"
              captures: { app_id: $.data.id }
            - call: "POST /joint-use/applications/${app_id}/survey"
              payload: { crew_id: "${crew_id}", window_start: "2026-05-10T08:00:00Z", window_end: "2026-05-10T12:00:00Z", estimated_labor_hours: 4, make_ready_required: true, existing_attacher_count: 0, complexity_class: "SIMPLE", findings: "ok" }
              as: Engineer
              as_user_id: "eng-1"
            - call: "GET /joint-use/applications/${app_id}"
              as: Engineer
              captures: { app_v: $.data.version }
            - call: "POST /joint-use/applications/${app_id}/estimate"
              payload: { expected_application_version: "${app_v}" }
              as: Engineer
              as_user_id: "eng-1"
            - call: "POST /joint-use/applications/${app_id}/estimate-decision"
              payload: { decision: "ACCEPT" }
              as: Attacher
              as_user_id: "${att_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: JointUseCoordinator
          trigger:
            - call: "POST /joint-use/applications/${app_id}/permit"
              payload: { decision: "GRANTED", actual_labor_hours: 4 }
              as: PermitOfficer
              as_user_id: "po-1"
              captures: { rent: $.data.annual_rental_fee_cents }
          assert:
            - "AttachmentApplication.${app_id}.annual_rental_fee_cents == 252"

      - name: penalty_tier2_above_boundary
        claim_type: Constants Applied
        grounds: [calculations.back_rental_and_penalty, entities.UnauthorizedAttachmentFinding.fields.penalty_cents]
        distinguishing_aspect: "discovered_space_inches=13 (> UNAUTHORIZED_TIER1_MAX_INCHES 12) selects PENALTY_TIER2_CENTS=50000 (tier boundary complement to the 12-inch tier-1 case)."
        test_recipe:
          setup: ["Owner (rate 1000), pole, attacher."]
          setup_api_calls:
            - call: "POST /joint-use/pole-owners"
              payload: { legal_name: "O", owner_category: "ILEC", annual_rental_rate_cents: 1000, make_ready_labor_rate_cents_per_hour: 12000 }
              as: JointUseCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /joint-use/poles"
              payload: { pole_owner_id: "${owner_id}", tag: "P1", height_ft: 35, usable_communication_space_inches: 60 }
              as: JointUseCoordinator
              captures: { pole_id: $.data.id }
            - call: "POST /joint-use/attachers"
              payload: { company_name: "Acme", cin: "CIN1", contact_email: "a@x.com" }
              as: JointUseCoordinator
              captures: { att_id: $.data.id }
          trigger:
            - call: "POST /joint-use/findings"
              payload: { pole_id: "${pole_id}", attacher_id: "${att_id}", discovered_space_inches: 13, discovered_position_inches: 150, good_faith: true, estimated_install_years_ago: 1 }
              as: FieldAuditor
              captures: { finding_id: $.data.id, pen: $.data.penalty_cents }
          assert:
            - "UnauthorizedAttachmentFinding.${finding_id}.penalty_cents == 50000"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: insufficient_pole_space_over_capacity_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=11]", "errors[ERR_INSUFFICIENT_POLE_SPACE]"]
        distinguishing_aspect: "Accept where requested_space_inches 7 > available 6 (usable 6, occupied 0, reserved 0) returns ERR_INSUFFICIENT_POLE_SPACE (409) — the failing complement of the exact-fit boundary."
        test_recipe:
          setup: ["Pole usable 6; application requesting 7 inches; estimate issued."]
          setup_api_calls:
            - call: "POST /joint-use/pole-owners"
              payload: { legal_name: "O", owner_category: "ELECTRIC_UTILITY", annual_rental_rate_cents: 1000, make_ready_labor_rate_cents_per_hour: 12000 }
              as: JointUseCoordinator
              captures: { owner_id: $.data.id }
