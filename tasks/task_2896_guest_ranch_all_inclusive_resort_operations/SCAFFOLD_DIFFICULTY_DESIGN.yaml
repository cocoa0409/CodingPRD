              as: HorseProgramDirector
            - call: "POST /horses/${horse_id}/health-events"
              payload: { event_type: "REHAB_START", observed_on: "2026-10-13", note: "hand walking" }
              as: HorseProgramDirector
              captures: { he_rehab: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-20T08:00:00Z" }
              as: HorseProgramDirector
            - call: "POST /horses/${horse_id}/health-events"
              payload: { event_type: "VET_CLEARANCE", observed_on: "2026-10-20", note: "sound at trot" }
              as: HorseProgramDirector
              captures: { he_clear: $.data.id }
          assert:
            - "HorseHealthEvent.${he_lame}.resulting_horse_status == LAME"
            - "HorseHealthEvent.${he_rehab}.resulting_horse_status == REHAB"
            - "HorseHealthEvent.${he_clear}.resulting_horse_status == IN_SERVICE"
            - "Horse.${horse_id}.horse_status == IN_SERVICE"
            - "Horse.${horse_id}.consecutive_duty_days == 0"
            - "Horse.${horse_id}.scheduled_load_hours == 0.0"
            - "GET /horse-health-events?horse_id=${horse_id} returns exactly 3 rows and none of them carries a version field, because HorseHealthEvent is declared common_fields false"

  - rule_id: transitive_cascade
    instances:
      - name: lameness_event_cascades_four_levels_to_slot_hold
        depth: 4
        grounds:
          - state_machines.Horse.IN_SERVICE_to_LAME
          - state_machines.ActivityReservation.mount_status.ASSIGNED_to_RELEASED
          - calculations.slot_readiness_posture
          - state_machines.ActivitySlot.OPEN_to_HOLD
          - calculations.horse_load_index
        distinguishing_aspect: |
          Depth-4 chain from a single write: HorseHealthEvent(LAMENESS) -> Horse.horse_status LAME
          -> every ASSIGNED seat of that horse becomes mount_status RELEASED with
          assigned_horse_id cleared and scheduled_load_hours returned -> the slot's
          mount_assigned_count drops below its confirmed mounted rider count so
          readiness_posture recomputes to MOUNT_SHORT -> the slot itself leaves OPEN for HOLD with
          hold_reason MOUNT_SHORT. The trigger touches only the Horse aggregate; three other
          aggregates must move.
