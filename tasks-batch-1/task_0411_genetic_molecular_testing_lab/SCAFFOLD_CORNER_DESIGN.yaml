# =============================================================================
# §1.9 Scaffold Corner Design (Breadth / Coverage Index) — task_0411
# Single top-level key scaffold_corner_design. Complements §1.8 (depth) by
# exhaustively enumerating non-difficulty testable claims: required-field /
# default / computed-field corners, enum/type constraints, every state-machine
# invalid-from rejection + terminal lockdown + idempotency, every validation's
# both-sided boundary, every error_id trigger, the full RBAC role×endpoint
# denial matrix, FK referential integrity, response envelope, OCC stale-version,
# cascades, and the immediate consistency model.
# All grounds resolve into SCAFFOLD.yaml §1.1–§1.7; all setup_api_calls chains
# are empty-DB reachable via §1.5 endpoints; literals are pre-computed.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 — ENTITIES (creation / required-fields / defaults / computed /
  #             system fields / not-found / enum-type constraints / topology)
  # ===========================================================================
  - section: entities
    instances:

      - name: gene_create_returns_201_with_active_status_and_default_acmg_false
        claim_type: Creation
        grounds:
          - entities.Gene.fields.symbol
          - entities.Gene.fields.is_acmg_reportable
          - entities.Gene.fields.status
        distinguishing_aspect: "POST /lab/genes with only symbol returns 201, status==ACTIVE, is_acmg_reportable default false."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T00:00:00.000Z" }
              as: LabDirector
          trigger:
            - call: "POST /lab/genes"
              payload: { symbol: "CDH1" }
              as: LabDirector
              captures: { gene_id: $.data.id }
          assert:
            - "response status code == 201"
            - "Gene.${gene_id}.symbol == CDH1"
            - "Gene.${gene_id}.status == ACTIVE"
            - "Gene.${gene_id}.is_acmg_reportable == false"
            - "Gene.${gene_id}.version == 1"

      - name: gene_missing_symbol_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Gene.fields.symbol
          - validations[priority=17]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /lab/genes without the required symbol field returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T00:00:00.000Z" }
              as: LabDirector
          trigger:
            - call: "POST /lab/genes"
              payload: { is_acmg_reportable: true }
              as: LabDirector
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "response status code == 422"

      - name: gene_get_not_found_returns_gene_not_found
        claim_type: Not Found
        grounds:
          - entities.Gene
          - errors[ERR_GENE_NOT_FOUND]
        distinguishing_aspect: "GET /lab/genes/{geneId} with an unknown UUID returns ERR_GENE_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T00:00:00.000Z" }
              as: LabDirector
          trigger:
            - call: "GET /lab/genes/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LabDirector
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_GENE_NOT_FOUND"
            - "response status code == 404"

      - name: panel_create_returns_draft_zero_gene_count_default_requires_consent_true
        claim_type: Defaults
        grounds:
          - entities.Panel.fields.requires_consent
          - entities.Panel.fields.gene_count
          - entities.Panel.fields.status
          - entities.Panel.fields.list_price_cents
        distinguishing_aspect: "POST /lab/panels omitting requires_consent yields status==DRAFT, gene_count==0, requires_consent default true."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T00:00:00.000Z" }
              as: LabDirector
          trigger:
            - call: "POST /lab/panels"
              payload: { name: "Default Panel", list_price_cents: 12345 }
              as: LabDirector
              captures: { panel_id: $.data.id }
          assert:
            - "response status code == 201"
            - "Panel.${panel_id}.status == DRAFT"
            - "Panel.${panel_id}.gene_count == 0"
            - "Panel.${panel_id}.requires_consent == true"
            - "Panel.${panel_id}.list_price_cents == 12345"

      - name: panel_gene_count_recomputed_on_add
        claim_type: Computed Fields
        grounds:
          - entities.Panel.fields.gene_count
          - entities.PanelGene.fields.status
        distinguishing_aspect: "Panel.gene_count is computed (count of INCLUDED PanelGene rows); after adding two genes it equals 2, ignoring any client-sent value."
        test_recipe:
          setup:
            - "A DRAFT panel with two genes added."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T00:00:00.000Z" }
              as: LabDirector
            - call: "POST /lab/genes"
              payload: { symbol: "GC1A" }
              as: LabDirector
              captures: { g1: $.data.id }
            - call: "POST /lab/genes"
              payload: { symbol: "GC1B" }
              as: LabDirector
              captures: { g2: $.data.id }
            - call: "POST /lab/panels"
              payload: { name: "Count Panel", list_price_cents: 40000, requires_consent: false }
              as: LabDirector
              captures: { panel_id: $.data.id }
            - call: "POST /lab/panels/${panel_id}/panel-genes"
              payload: { gene_id: "${g1}" }
              as: LabDirector
          trigger:
            - call: "POST /lab/panels/${panel_id}/panel-genes"
              payload: { gene_id: "${g2}" }
              as: LabDirector
          assert:
            - "Panel.${panel_id}.gene_count == 2"

      - name: testorder_list_price_snapshot_immutable_from_panel
        claim_type: Computed Fields
        grounds:
          - entities.TestOrder.fields.list_price_cents
          - entities.TestOrder.fields.report_required_consent
          - entities.Panel.fields.list_price_cents
        distinguishing_aspect: "TestOrder.list_price_cents is a computed snapshot of Panel.list_price_cents at creation (== 80000), and report_required_consent snapshots Panel.requires_consent (false)."
        test_recipe:
          setup:
            - "PUBLISHED panel list_price 80000, requires_consent false; one order placed."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T00:00:00.000Z" }
              as: LabDirector
            - call: "POST /lab/genes"
              payload: { symbol: "GSNAP" }
              as: LabDirector
              captures: { g1: $.data.id }
            - call: "POST /lab/panels"
              payload: { name: "Snap Panel", list_price_cents: 80000, requires_consent: false }
              as: LabDirector
              captures: { panel_id: $.data.id }
            - call: "POST /lab/panels/${panel_id}/panel-genes"
              payload: { gene_id: "${g1}" }
              as: LabDirector
            - call: "POST /lab/panels/${panel_id}/publish"
              payload: {}
              as: LabDirector
            - call: "POST /lab/providers"
              payload: { npi: "2001001001", full_name: "Dr Snap" }
              as: LabIntake
              captures: { prov_id: $.data.id }
          trigger:
            - call: "POST /lab/test-orders"
              payload: { patient_mrn: "MRN-SNAP", patient_dob: "1990-01-01", panel_id: "${panel_id}", ordering_provider_id: "${prov_id}" }
              as: LabIntake
              captures: { order_id: $.data.id }
          assert:
            - "response status code == 201"
            - "TestOrder.${order_id}.list_price_cents == 80000"
            - "TestOrder.${order_id}.report_required_consent == false"
            - "TestOrder.${order_id}.pipeline_status == ORDERED"
            - "TestOrder.${order_id}.financial_status == PENDING"

      - name: testorder_create_against_draft_panel_rejected_panel_not_published
        claim_type: Parent Relationships
        grounds:
          - validations[priority=6]
          - entities.Panel.fields.status
          - errors[ERR_PANEL_NOT_PUBLISHED]
        distinguishing_aspect: "Placing an order against a DRAFT (unpublished) panel returns ERR_PANEL_NOT_PUBLISHED (409); only PUBLISHED panels accept orders."
        test_recipe:
          setup:
            - "A DRAFT panel (never published) and a provider."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T00:00:00.000Z" }
              as: LabDirector
            - call: "POST /lab/genes"
              payload: { symbol: "GDRAFT" }
              as: LabDirector
              captures: { g1: $.data.id }
            - call: "POST /lab/panels"
              payload: { name: "Draft Panel", list_price_cents: 40000, requires_consent: false }
              as: LabDirector
              captures: { panel_id: $.data.id }
            - call: "POST /lab/panels/${panel_id}/panel-genes"
              payload: { gene_id: "${g1}" }
              as: LabDirector
            - call: "POST /lab/providers"
              payload: { npi: "2002002002", full_name: "Dr Draft" }
              as: LabIntake
              captures: { prov_id: $.data.id }
          trigger:
            - call: "POST /lab/test-orders"
              payload: { patient_mrn: "MRN-DR", patient_dob: "1990-01-01", panel_id: "${panel_id}", ordering_provider_id: "${prov_id}" }
              as: LabIntake
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PANEL_NOT_PUBLISHED"
            - "response status code == 409"

      - name: testorder_create_unknown_provider_returns_provider_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.TestOrder.fields.ordering_provider_id
          - errors[ERR_PROVIDER_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "Placing an order whose ordering_provider_id does not resolve returns ERR_PROVIDER_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "PUBLISHED panel; no such provider id."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T00:00:00.000Z" }
              as: LabDirector
            - call: "POST /lab/genes"
              payload: { symbol: "GPROV" }
              as: LabDirector
              captures: { g1: $.data.id }
            - call: "POST /lab/panels"
              payload: { name: "Prov Panel", list_price_cents: 40000, requires_consent: false }
              as: LabDirector
              captures: { panel_id: $.data.id }
            - call: "POST /lab/panels/${panel_id}/panel-genes"
              payload: { gene_id: "${g1}" }
              as: LabDirector
            - call: "POST /lab/panels/${panel_id}/publish"
              payload: {}
              as: LabDirector
          trigger:
            - call: "POST /lab/test-orders"
              payload: { patient_mrn: "MRN-NP", patient_dob: "1990-01-01", panel_id: "${panel_id}", ordering_provider_id: "00000000-0000-4000-8000-0000000000aa" }
              as: LabIntake
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PROVIDER_NOT_FOUND"
            - "response status code == 404"

      - name: requisition_invalid_payer_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Requisition.fields.insurance_payer
          - validations[priority=17]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Creating a requisition with insurance_payer not in {MEDICARE,COMMERCIAL,SELF_PAY} returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "An ORDERED order on a PUBLISHED panel."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T00:00:00.000Z" }
              as: LabDirector
            - call: "POST /lab/genes"
              payload: { symbol: "GPAY" }
              as: LabDirector
              captures: { g1: $.data.id }
            - call: "POST /lab/panels"
              payload: { name: "Pay Panel", list_price_cents: 40000, requires_consent: false }
              as: LabDirector
              captures: { panel_id: $.data.id }
            - call: "POST /lab/panels/${panel_id}/panel-genes"
              payload: { gene_id: "${g1}" }
              as: LabDirector
            - call: "POST /lab/panels/${panel_id}/publish"
              payload: {}
              as: LabDirector
            - call: "POST /lab/providers"
              payload: { npi: "2003003003", full_name: "Dr Pay" }
              as: LabIntake
              captures: { prov_id: $.data.id }
            - call: "POST /lab/test-orders"
              payload: { patient_mrn: "MRN-PAY", patient_dob: "1990-01-01", panel_id: "${panel_id}", ordering_provider_id: "${prov_id}" }
              as: LabIntake
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /lab/test-orders/${order_id}/requisition"
              payload: { clinical_indication: "dx", insurance_payer: "TRICARE" }
              as: LabIntake
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "response status code == 422"

      - name: specimen_invalid_type_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Specimen.fields.specimen_type
          - validations[priority=17]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Registering a specimen with specimen_type not in {BLOOD,SALIVA,TISSUE} returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "A REQUISITIONED SELF_PAY order."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T00:00:00.000Z" }
              as: LabDirector
            - call: "POST /lab/genes"
              payload: { symbol: "GSPEC" }
              as: LabDirector
              captures: { g1: $.data.id }
            - call: "POST /lab/panels"
              payload: { name: "Spec Panel", list_price_cents: 40000, requires_consent: false }
              as: LabDirector
              captures: { panel_id: $.data.id }
            - call: "POST /lab/panels/${panel_id}/panel-genes"
              payload: { gene_id: "${g1}" }
              as: LabDirector
            - call: "POST /lab/panels/${panel_id}/publish"
              payload: {}
              as: LabDirector
            - call: "POST /lab/providers"
              payload: { npi: "2004004004", full_name: "Dr Spec" }
              as: LabIntake
              captures: { prov_id: $.data.id }
            - call: "POST /lab/test-orders"
              payload: { patient_mrn: "MRN-SP", patient_dob: "1990-01-01", panel_id: "${panel_id}", ordering_provider_id: "${prov_id}" }
              as: LabIntake
              captures: { order_id: $.data.id }
            - call: "POST /lab/test-orders/${order_id}/requisition"
              payload: { clinical_indication: "dx", insurance_payer: "SELF_PAY" }
              as: LabIntake
            - call: "POST /lab/test-orders/${order_id}/requisition/submit"
              payload: {}
              as: LabIntake
          trigger:
            - call: "POST /lab/test-orders/${order_id}/specimens"
              payload: { specimen_type: "URINE", collected_at: "2026-06-18T00:00:00.000Z", quantity_ng: 80 }
              as: AccessioningTech
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "response status code == 422"

      - name: sequencer_run_window_end_not_after_start_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.SequencerRun.fields.window_start
          - entities.SequencerRun.fields.window_end
          - validations[priority=17]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Scheduling a run with window_end == window_start (not strictly after) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "An online sequencer and a SEQUENCING order."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T00:00:00.000Z" }
              as: LabDirector
            - call: "POST /lab/sequencers"
              payload: { instrument_name: "NovaSeq-WIN" }
              as: LabDirector
              captures: { seq_id: $.data.id }
            - call: "POST /lab/genes"
              payload: { symbol: "GWIN" }
              as: LabDirector
              captures: { g1: $.data.id }
            - call: "POST /lab/panels"
              payload: { name: "Win Panel", list_price_cents: 40000, requires_consent: false }
              as: LabDirector
              captures: { panel_id: $.data.id }
            - call: "POST /lab/panels/${panel_id}/panel-genes"
              payload: { gene_id: "${g1}" }
              as: LabDirector
            - call: "POST /lab/panels/${panel_id}/publish"
              payload: {}
              as: LabDirector
            - call: "POST /lab/providers"
              payload: { npi: "2005005005", full_name: "Dr Win" }
              as: LabIntake
              captures: { prov_id: $.data.id }
            - call: "POST /lab/test-orders"
              payload: { patient_mrn: "MRN-WIN", patient_dob: "1990-01-01", panel_id: "${panel_id}", ordering_provider_id: "${prov_id}" }
              as: LabIntake
              captures: { order_id: $.data.id }
            - call: "POST /lab/test-orders/${order_id}/requisition"
              payload: { clinical_indication: "dx", insurance_payer: "SELF_PAY" }
              as: LabIntake
            - call: "POST /lab/test-orders/${order_id}/requisition/submit"
              payload: {}
              as: LabIntake
          trigger:
            - call: "POST /lab/sequencers/${seq_id}/runs"
              payload: { test_order_id: "${order_id}", window_start: "2026-06-20T10:00:00.000Z", window_end: "2026-06-20T10:00:00.000Z" }
              as: AccessioningTech
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "response status code == 422"

      - name: sequencer_create_default_turnaround_buffer_60
        claim_type: Defaults
        grounds:
          - entities.Sequencer.fields.turnaround_buffer_minutes
          - entities.Sequencer.fields.status
        distinguishing_aspect: "POST /lab/sequencers without turnaround_buffer_minutes applies the default 60 and status==ONLINE."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T00:00:00.000Z" }
              as: LabDirector
          trigger:
            - call: "POST /lab/sequencers"
              payload: { instrument_name: "NovaSeq-DEF" }
              as: LabDirector
              captures: { seq_id: $.data.id }
          assert:
            - "response status code == 201"
            - "Sequencer.${seq_id}.turnaround_buffer_minutes == 60"
            - "Sequencer.${seq_id}.status == ONLINE"

      - name: counselor_create_default_active_status
        claim_type: Creation
        grounds:
          - entities.GeneticCounselorProfile.fields.counselor_name
          - entities.GeneticCounselorProfile.fields.status
        distinguishing_aspect: "POST /lab/counselors returns 201 with status==ACTIVE."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T00:00:00.000Z" }
              as: LabDirector
          trigger:
            - call: "POST /lab/counselors"
              payload: { counselor_name: "GC Alpha" }
              as: LabDirector
              captures: { gc_id: $.data.id }
          assert:
            - "response status code == 201"
            - "GeneticCounselorProfile.${gc_id}.status == ACTIVE"

      - name: referral_optional_triggering_variant_defaults_null
        claim_type: Defaults
        grounds:
          - entities.CounselorReferral.fields.triggering_variant_id
          - entities.CounselorReferral.fields.slot_start
          - entities.CounselorReferral.fields.status
        distinguishing_aspect: "Requesting a referral without triggering_variant_id leaves it null, with slot_start/slot_end null and status REQUESTED."
        test_recipe:
          setup:
            - "An ORDERED order and one ACTIVE counselor."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T00:00:00.000Z" }
              as: LabDirector
            - call: "POST /lab/counselors"
              payload: { counselor_name: "GC Opt" }
              as: LabDirector
              captures: { gc_id: $.data.id }
            - call: "POST /lab/genes"
              payload: { symbol: "GREF" }
              as: LabDirector
              captures: { g1: $.data.id }
            - call: "POST /lab/panels"
              payload: { name: "Ref Panel", list_price_cents: 40000, requires_consent: false }
              as: LabDirector
              captures: { panel_id: $.data.id }
            - call: "POST /lab/panels/${panel_id}/panel-genes"
              payload: { gene_id: "${g1}" }
              as: LabDirector
            - call: "POST /lab/panels/${panel_id}/publish"
              payload: {}
              as: LabDirector
            - call: "POST /lab/providers"
              payload: { npi: "2006006006", full_name: "Dr Ref" }
              as: LabIntake
              captures: { prov_id: $.data.id }
            - call: "POST /lab/test-orders"
              payload: { patient_mrn: "MRN-REF", patient_dob: "1990-01-01", panel_id: "${panel_id}", ordering_provider_id: "${prov_id}" }
              as: LabIntake
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /lab/test-orders/${order_id}/referrals"
              payload: { counselor_id: "${gc_id}", reason: "PATIENT_REQUEST" }
              as: GeneticCounselor
              captures: { ref_id: $.data.id }
          assert:
            - "response status code == 201"
            - "CounselorReferral.${ref_id}.triggering_variant_id == null"
            - "CounselorReferral.${ref_id}.slot_start == null"
            - "CounselorReferral.${ref_id}.status == REQUESTED"

      - name: variant_is_incidental_computed_true_for_offpanel_acmg_gene
        claim_type: Computed Fields
        grounds:
          - entities.Variant.fields.is_incidental
          - entities.Variant.fields.gene_id
          - entities.Gene.fields.is_acmg_reportable
        distinguishing_aspect: "A variant on an ACMG-reportable gene NOT on the order's panel has is_incidental==true (computed), and classification starts UNCLASSIFIED."
        test_recipe:
          setup:
            - "SELF_PAY SEQUENCING order on a one-gene panel; an off-panel ACMG gene exists."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T00:00:00.000Z" }
              as: LabDirector
            - call: "POST /lab/genes"
              payload: { symbol: "GONPANEL" }
              as: LabDirector
              captures: { on_gene: $.data.id }
            - call: "POST /lab/genes"
              payload: { symbol: "GOFFACMG", is_acmg_reportable: true }
              as: LabDirector
              captures: { off_gene: $.data.id }
            - call: "POST /lab/panels"
              payload: { name: "Inc Panel", list_price_cents: 40000, requires_consent: false }
              as: LabDirector
              captures: { panel_id: $.data.id }
            - call: "POST /lab/panels/${panel_id}/panel-genes"
              payload: { gene_id: "${on_gene}" }
              as: LabDirector
            - call: "POST /lab/panels/${panel_id}/publish"
              payload: {}
              as: LabDirector
            - call: "POST /lab/providers"
              payload: { npi: "2007007007", full_name: "Dr Inc" }
              as: LabIntake
              captures: { prov_id: $.data.id }
            - call: "POST /lab/test-orders"
