              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_VACCINATION_PREREQUISITE   # replacement RABIES expires_on == clock date is NOT covered (half-open)"

