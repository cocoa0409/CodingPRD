            - call: "POST /pre-award/fa-rate-agreements/${rc_id}/finalize"
              payload: {}
              as: OSPDirector
              captures: { rc_status: $.data.status }
          assert:
            - "ra_status == FINAL and rb_status == FINAL (adjacent half-open windows accepted: end == start is not overlap)"
            - "err == ERR_FA_RATE_WINDOW_OVERLAP (straddling FINAL window rejected)"
            - "rc_status == FINAL (finalize of an OFF_CAMPUS PROVISIONAL is unaffected by ON_CAMPUS overlap — overlap is per rate_type)"

      - name: pi_effort_aggregate_capacity
        grounds:
          - calculations.pi_effort_capacity
          - errors[ERR_PI_EFFORT_EXCEEDED]
          - entities.PrincipalInvestigator.fields.committed_effort_pct
        distinguishing_aspect: |
          Resource PrincipalInvestigator with aggregate-capacity interval
          semantics (different from FaRateAgreement's geometric half-open
          collision): effort sums only over contributor-state proposals whose
          half-open project windows overlap the candidate; 60 + 40 == 100.00
          passes exactly, 100.01 fails, and a window adjacent to a contributor
          (start == its end) excludes that contributor.
        test_recipe:
          setup:
            - "Opportunity (no cost-share), fresh PI, 54% rate"
            - "Proposal A: effort 60, window [2026-01-01, 2026-12-31), ROUTED"
            - "Proposal B: effort 40, window [2026-06-01, 2027-05-31), overlaps A"
          setup_api_calls:
            - { call: "POST /pre-award/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OSPSystemAdmin }
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NSF", title: "O1", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2027-09-05T17:00:00Z", internal_lead_days: 5, requires_cost_share: false, min_cost_share_pct_of_request: 0 }
