            - call: "POST /applications/${app1_id}/reviews"
              payload: { academic_points: 30, experience_points: 20, holistic_points: 20 }
              as: Reviewer
              as_user_id: "${f1_id}"
            - call: "POST /applications/${app1_id}/reviews"
              payload: { academic_points: 30, experience_points: 20, holistic_points: 20 }
