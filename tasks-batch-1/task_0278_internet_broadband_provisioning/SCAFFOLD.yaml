# =============================================================================
# Internet / Broadband Service Provisioning — benchmark seed tables (v1)
# Difficulty band: Expert (§0.4)
# =============================================================================

scenario: |
  278. Internet/Broadband Service Provisioning: address serviceability check,
  plan/speed tier, install/self-install scheduling, equipment (modem/router)
  lease, data-cap/overage, throttling, outage credit, disconnect/transfer

domain_name: internet-broadband-provisioning
api_prefix: /

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - temporal_windowing          # install slot capacity windows + technician travel buffers + outage intervals
    - cascading_side_effects      # disconnect / transfer fan into multi-entity chains
    - rate_threshold_triggers     # data cap crossing -> throttle OR overage, at exact boundary
    - dual_variant_calculation    # overage estimate (forward) vs final (chronological)
    - optimistic_concurrency      # OCC on Account.version for appointment booking and plan change

  entity_topology: flat
  # Account is the OCC anchor; ServiceOrder, EquipmentUnit, BillingCycle, OutageEvent,
  # UsageRecord, AccountCredit, InstallAppointment, TransferRequest are peer entities
  # carrying FK references to Account (and to each other) rather than URL nesting.
  # InstallSlot / Technician / ServicePlan / ServiceAddress are reference catalogs.

  state_machine_shape: parallel
  # BillingCycle carries two independent dimensions (billing_state x throttle_state).
  # ServiceOrder branches (install vs self-install fork) then joins at ACTIVATED.
  # EquipmentUnit is cyclic (LEASED -> RETURN_PENDING -> RETURNED, re-leasable).

  relationship_patterns:
    - one_to_many                 # Account -> ServiceOrder, BillingCycle, UsageRecord, AccountCredit
    - cross_aggregate             # InstallAppointment references both ServiceOrder and InstallSlot/Technician
    - polymorphic                 # AccountCredit.source_type spans OUTAGE | LEASE_PRORATE | GOODWILL | TRANSFER_WAIVER

  role_model: peer_roles
  # Customer acts on own account; ProvisioningAgent drives orders/equipment;
  # NetworkOps logs outages/usage and runs the billing close; Dispatcher owns slots/technicians.

  consistency_model: immediate

# =============================================================================
# Response Envelope (FIXED — emitted verbatim per §1.0)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: ServiceAddress
    parent: null
    common_fields: false
    fields:
      - { name: line1, type: string, source: input, description: "Street address line" }
      - { name: postal_code, type: string, source: input, description: "Postal code" }
      - { name: coverage_status, type: enum, source: input, description: "SERVICEABLE | NOT_SERVICEABLE | PRE_ORDER", constraints: "one of SERVICEABLE, NOT_SERVICEABLE, PRE_ORDER" }
      - { name: technology, type: enum, source: input, description: "FIBER | CABLE | DSL | FIXED_WIRELESS", constraints: "one of FIBER, CABLE, DSL, FIXED_WIRELESS" }
      - { name: max_serviceable_mbps, type: integer, source: input, description: "Highest download speed the plant supports at this address" }
      - { name: self_install_eligible, type: boolean, source: input, description: "Whether self-install kits are permitted at this address" }

  - name: ServicePlan
    parent: null
    common_fields: false
    fields:
      - { name: code, type: string, source: input, description: "Plan code, unique among ServicePlans", constraints: "unique" }
      - { name: tier, type: enum, source: input, description: "BASIC | PLUS | GIG | MULTI_GIG", constraints: "one of BASIC, PLUS, GIG, MULTI_GIG" }
      - { name: download_mbps, type: integer, source: input, description: "Provisioned download speed when not throttled" }
      - { name: throttled_mbps, type: integer, source: input, description: "Reduced speed applied when overage_policy=THROTTLE and cap is crossed" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Recurring plan fee per billing cycle" }
      - { name: included_gb, type: integer, source: input, description: "Data cap: GB included before overage/throttle applies" }
      - { name: overage_policy, type: enum, source: input, description: "BILL | THROTTLE | UNLIMITED", constraints: "one of BILL, THROTTLE, UNLIMITED" }
      - { name: contract_term_months, type: integer, source: input, description: "Term length; 0 means month-to-month (no ETF)" }
      - { name: etf_full_cents, type: integer, source: input, description: "Early-termination fee at term start; decays linearly to 0 at term end" }

  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: service_address_id, type: string, source: input, description: "FK -> ServiceAddress.id; the premises this account serves" }
      - { name: plan_id, type: string, source: input, description: "FK -> ServicePlan.id; currently-provisioned plan" }
      - { name: customer_user_id, type: string, source: input, description: "Opaque customer identity that owns this account" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | ACTIVE | SUSPENDED | DISCONNECTED | TRANSFERRED", constraints: "PENDING,ACTIVE,SUSPENDED,DISCONNECTED,TRANSFERRED" }
      - { name: service_state, type: enum, source: computed, default: "PROVISIONING", description: "PROVISIONING | ONLINE | THROTTLED | OFFLINE — independent operational dimension derived from active BillingCycle + outage" }
      - { name: contract_start_iso, type: datetime, source: system, description: "Set when the account first reaches ACTIVE; basis for ETF decay" }
      - { name: credit_balance_cents, type: integer, source: computed, default: 0, description: "Sum of un-applied AccountCredit.amount_cents for this account" }
      - { name: equipment_unit_id, type: string, source: computed, description: "FK -> EquipmentUnit.id; the currently-leased unit, null when none" }

  - name: EquipmentUnit
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: computed, description: "FK -> Account.id; account currently holding the lease, null when in inventory" }
      - { name: kind, type: enum, source: input, description: "MODEM | ROUTER | GATEWAY", constraints: "one of MODEM, ROUTER, GATEWAY" }
      - { name: serial, type: string, source: input, description: "Hardware serial, unique among EquipmentUnits", constraints: "unique" }
      - { name: lease_fee_cents_per_cycle, type: integer, source: input, description: "Monthly lease fee charged while LEASED" }
      - { name: status, type: enum, source: system, default: "IN_INVENTORY", description: "IN_INVENTORY | LEASED | RETURN_PENDING | RETURNED | LOST", constraints: "IN_INVENTORY,LEASED,RETURN_PENDING,RETURNED,LOST" }
      - { name: leased_at_iso, type: datetime, source: system, description: "Timestamp the current lease began; basis for lease proration" }

  - name: ServiceOrder
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; account being provisioned" }
      - { name: order_type, type: enum, source: input, description: "NEW_INSTALL | TRANSFER_IN | UPGRADE", constraints: "one of NEW_INSTALL, TRANSFER_IN, UPGRADE" }
      - { name: install_mode, type: enum, source: input, description: "TECH_INSTALL | SELF_INSTALL", constraints: "one of TECH_INSTALL, SELF_INSTALL" }
      - { name: requested_plan_id, type: string, source: input, description: "FK -> ServicePlan.id; plan the order will provision" }
      - { name: equipment_unit_id, type: string, source: computed, description: "FK -> EquipmentUnit.id; unit assigned to the order at activation, null until then" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SCHEDULED | KIT_SHIPPED | ACTIVATED | CANCELLED", constraints: "DRAFT,SCHEDULED,KIT_SHIPPED,ACTIVATED,CANCELLED" }

  - name: InstallSlot
    parent: null
    common_fields: true
    fields:
      - { name: technician_id, type: string, source: input, description: "FK -> Technician.id; technician staffing this slot" }
      - { name: window_start_iso, type: datetime, source: input, description: "Half-open window start (inclusive)" }
      - { name: window_end_iso, type: datetime, source: input, description: "Half-open window end (exclusive)" }
      - { name: capacity, type: integer, source: input, description: "Maximum InstallAppointments bookable in this slot window" }
      - { name: booked_count, type: integer, source: computed, default: 0, description: "Count of non-cancelled InstallAppointments referencing this slot" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | FULL — FULL when booked_count == capacity, returns to OPEN when a booking is released", constraints: "OPEN,FULL" }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Technician display name" }
      - { name: travel_buffer_minutes, type: integer, source: input, default: 30, description: "Minutes of travel buffer reserved after each appointment before the technician is free" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether the technician can be assigned new appointments" }

  - name: InstallAppointment
    parent: null
    common_fields: true
    fields:
      - { name: service_order_id, type: string, source: input, description: "FK -> ServiceOrder.id; order this appointment fulfills" }
      - { name: install_slot_id, type: string, source: input, description: "FK -> InstallSlot.id; slot booked" }
      - { name: technician_id, type: string, source: computed, description: "FK -> Technician.id; copied from the slot at booking" }
      - { name: start_iso, type: datetime, source: input, description: "Appointment start (inclusive), must fall within the slot window" }
      - { name: end_iso, type: datetime, source: input, description: "Appointment end (exclusive), must fall within the slot window" }
      - { name: status, type: enum, source: system, default: "BOOKED", description: "BOOKED | COMPLETED | CANCELLED | NO_SHOW", constraints: "BOOKED,COMPLETED,CANCELLED,NO_SHOW" }

  - name: BillingCycle
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; account billed by this cycle" }
      - { name: cycle_start_iso, type: datetime, source: input, description: "Cycle window start (inclusive)" }
      - { name: cycle_end_iso, type: datetime, source: input, description: "Cycle window end (exclusive); cycle length in minutes drives outage proration" }
      - { name: usage_gb, type: integer, source: computed, default: 0, description: "Sum of UsageRecord.gb posted to this cycle" }
      - { name: billing_state, type: enum, source: system, default: "OPEN", description: "OPEN | CLOSED | FINALIZED — accrual lifecycle dimension", constraints: "OPEN,CLOSED,FINALIZED" }
      - { name: throttle_state, type: enum, source: system, default: "UNCAPPED", description: "UNCAPPED | THROTTLED — independent metering dimension, evolves separately from billing_state", constraints: "UNCAPPED,THROTTLED" }
      - { name: overage_charge_cents, type: integer, source: computed, default: 0, description: "Finalized overage charge; 0 until FINALIZED" }
      - { name: total_due_cents, type: integer, source: computed, default: 0, description: "Finalized amount due for the cycle; 0 until FINALIZED" }

  - name: UsageRecord
    parent: null
    common_fields: false
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; account whose usage this record posts" }
      - { name: billing_cycle_id, type: string, source: input, description: "FK -> BillingCycle.id; cycle this usage posts to" }
      - { name: posted_at_iso, type: datetime, source: input, description: "When this usage was metered; must fall within the cycle window" }
      - { name: gb, type: integer, source: input, description: "Gigabytes consumed in this record (> 0)" }

  - name: OutageEvent
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; affected account" }
      - { name: billing_cycle_id, type: string, source: input, description: "FK -> BillingCycle.id; cycle the outage falls within (used for credit proration)" }
      - { name: started_at_iso, type: datetime, source: input, description: "Outage start (inclusive)" }
      - { name: ended_at_iso, type: datetime, source: computed, description: "Outage end (exclusive); set on resolve, null while open" }
      - { name: duration_minutes, type: integer, source: computed, default: 0, description: "Resolved outage length in whole minutes" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | RESOLVED | CREDITED | DISMISSED", constraints: "OPEN,RESOLVED,CREDITED,DISMISSED" }

  - name: AccountCredit
    parent: null
    common_fields: false
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; account credited" }
      - { name: source_type, type: enum, source: system, description: "OUTAGE | LEASE_PRORATE | GOODWILL | TRANSFER_WAIVER", constraints: "OUTAGE,LEASE_PRORATE,GOODWILL,TRANSFER_WAIVER" }
      - { name: source_id, type: string, source: system, description: "Id of the originating OutageEvent / EquipmentUnit / TransferRequest; null for GOODWILL" }
      - { name: amount_cents, type: integer, source: input, description: "Credit amount in cents (> 0)" }
      - { name: applied, type: boolean, source: system, default: false, description: "Whether this credit has been consumed by a finalized BillingCycle" }

  - name: TransferRequest
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; account being transferred" }
      - { name: to_service_address_id, type: string, source: input, description: "FK -> ServiceAddress.id; destination premises" }
      - { name: to_plan_id, type: string, source: input, description: "FK -> ServicePlan.id; plan at the destination (may equal current)" }
      - { name: waive_etf, type: boolean, source: input, default: true, description: "Whether the transfer waives the source account's early-termination fee" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED | APPROVED | COMPLETED | REJECTED", constraints: "REQUESTED,APPROVED,COMPLETED,REJECTED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Account
    initial_state: PENDING
    terminal_states: [DISCONNECTED, TRANSFERRED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "system (cascaded from ServiceOrder DRAFT/SCHEDULED/KIT_SHIPPED -> ACTIVATED via POST /service-orders/{id}/activate)"
        actor: system
        preconditions:
          - "Account currently PENDING"
        side_effects:
          - "Set contract_start_iso = clock now"
          - "Set service_state = ONLINE"
          - "EquipmentUnit assigned to the order moves IN_INVENTORY -> LEASED (cascade), Account.equipment_unit_id set"
          - "Create an OPEN BillingCycle: cycle_start_iso = clock now, cycle_end_iso = clock now + 30 days (the canonical 30-day = 43200-minute cycle used by lease/outage proration)"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /accounts/{id}/suspend"
        actor: ProvisioningAgent
        preconditions:
          - "Account is ACTIVE"
        side_effects:
          - "Set service_state = OFFLINE"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /accounts/{id}/resume"
        actor: ProvisioningAgent
        preconditions:
          - "Account is SUSPENDED"
        side_effects:
          - "Set service_state = ONLINE (or THROTTLED if the open BillingCycle.throttle_state == THROTTLED)"

      - from: ACTIVE
        to: DISCONNECTED
        trigger: "POST /accounts/{id}/disconnect"
        actor: ProvisioningAgent
        preconditions:
          - "Account is ACTIVE or SUSPENDED"
          - "expected_account_version matches Account.version (OCC)"
        side_effects:
          - "Set service_state = OFFLINE"
          - "Compute early_termination_fee on the source plan and add it as a charge on the open BillingCycle"
          - "Cascade: EquipmentUnit LEASED -> RETURN_PENDING (its leased_at_iso drives lease_proration_credit)"
          - "Cascade: that EquipmentUnit transition itself emits an AccountCredit(source_type=LEASE_PRORATE) for the unused-days portion of the final cycle"
          - "Cascade: the open BillingCycle is CLOSED then FINALIZED (total_due recomputed including ETF, overage, lease proration, credits)"
          - "increments Account.version by 1"

      - from: SUSPENDED
        to: DISCONNECTED
        trigger: "POST /accounts/{id}/disconnect"
        actor: ProvisioningAgent
        preconditions:
          - "Account is ACTIVE or SUSPENDED"
          - "expected_account_version matches Account.version (OCC)"
        side_effects:
          - "Same disconnect cascade as ACTIVE -> DISCONNECTED"
          - "increments Account.version by 1"

      - from: ACTIVE
        to: TRANSFERRED
        trigger: "system (cascaded from TransferRequest APPROVED -> COMPLETED via POST /transfer-requests/{id}/complete)"
        actor: system
        preconditions:
          - "Account is ACTIVE"
          - "A TransferRequest for this account is in APPROVED"
        side_effects:
          - "Set service_state = OFFLINE"
          - "If TransferRequest.waive_etf: NO ETF charge is added; emit AccountCredit(source_type=TRANSFER_WAIVER, amount = the ETF that would otherwise apply)"
          - "Cascade: EquipmentUnit LEASED -> RETURN_PENDING; that transition emits LEASE_PRORATE credit"
          - "Cascade: open BillingCycle CLOSED then FINALIZED"
        note: "Transfer is the compensating counterpart of disconnect for the ETF conserved quantity — waiver leaves net ETF burden at zero."

  - entity: ServiceOrder
    initial_state: DRAFT
    terminal_states: [ACTIVATED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /install-appointments (TECH_INSTALL branch books a slot)"
        actor: ProvisioningAgent
        preconditions:
          - "order.install_mode == TECH_INSTALL"
          - "Account.service_address.coverage_status == SERVICEABLE"
          - "requested_plan.download_mbps <= Account.service_address.max_serviceable_mbps"
        side_effects:
          - "InstallAppointment created in BOOKED; InstallSlot.booked_count += 1"
        note: "TECH_INSTALL branch of the fork."

      - from: DRAFT
        to: KIT_SHIPPED
        trigger: "POST /service-orders/{id}/ship-kit"
        actor: ProvisioningAgent
        preconditions:
          - "order.install_mode == SELF_INSTALL"
          - "Account.service_address.self_install_eligible == true"
          - "Account.service_address.coverage_status == SERVICEABLE"
        side_effects:
          - "EquipmentUnit reserved (stays IN_INVENTORY until activation)"
        note: "SELF_INSTALL branch of the fork."

      - from: SCHEDULED
        to: ACTIVATED
        trigger: "POST /service-orders/{id}/activate"
        actor: ProvisioningAgent
        preconditions:
          - "The order's InstallAppointment is COMPLETED"
          - "An EquipmentUnit in IN_INVENTORY is available to assign"
        side_effects:
          - "Join point: assign EquipmentUnit, set equipment_unit_id"
          - "Cascade: EquipmentUnit IN_INVENTORY -> LEASED, leased_at_iso = now"
          - "Cascade: Account PENDING -> ACTIVE, an OPEN BillingCycle is created"

      - from: KIT_SHIPPED
        to: ACTIVATED
        trigger: "POST /service-orders/{id}/activate"
        actor: Customer | ProvisioningAgent
        preconditions:
          - "An EquipmentUnit in IN_INVENTORY is available to assign"
        side_effects:
          - "Join point: identical activation cascade as the SCHEDULED branch (assign+lease, account activate, open cycle)"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /service-orders/{id}/cancel"
        actor: ProvisioningAgent
        preconditions: []
        side_effects: []

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /service-orders/{id}/cancel"
        actor: ProvisioningAgent
        preconditions: []
        side_effects:
          - "Cascade: the order's BOOKED InstallAppointment -> CANCELLED; InstallSlot.booked_count -= 1; if slot was FULL it returns to OPEN"

      - from: KIT_SHIPPED
        to: CANCELLED
        trigger: "POST /service-orders/{id}/cancel"
        actor: ProvisioningAgent
        preconditions: []
        side_effects:
          - "Reserved EquipmentUnit released back to IN_INVENTORY"

  - entity: EquipmentUnit
    initial_state: IN_INVENTORY
    terminal_states: [RETURNED, LOST]
    transitions:
      - from: IN_INVENTORY
        to: LEASED
        trigger: "system (cascaded from ServiceOrder activate)"
        actor: system
        preconditions:
          - "Unit is IN_INVENTORY"
        side_effects:
          - "Set account_id, leased_at_iso = now"

      - from: LEASED
        to: RETURN_PENDING
        trigger: "system (cascaded from Account disconnect or transfer complete)"
        actor: system
        preconditions:
          - "Unit is LEASED"
        side_effects:
          - "Emit AccountCredit(source_type=LEASE_PRORATE) for the unused-days portion of the final cycle"

      - from: RETURN_PENDING
        to: RETURNED
        trigger: "POST /equipment-units/{id}/confirm-return"
        actor: ProvisioningAgent
        preconditions:
          - "Unit is RETURN_PENDING"
        side_effects:
          - "Clear account_id; unit is re-leasable only after being explicitly restocked (RETURNED -> IN_INVENTORY)"

      - from: RETURNED
        to: IN_INVENTORY
        trigger: "POST /equipment-units/{id}/restock"
        actor: ProvisioningAgent
        preconditions:
          - "Unit is RETURNED"
        side_effects:
          - "Unit becomes assignable again (cycle closes)"
        note: "Cyclic: a returned unit re-enters inventory and can be leased to another account."

      - from: RETURN_PENDING
        to: LOST
        trigger: "POST /equipment-units/{id}/mark-lost"
        actor: ProvisioningAgent
        preconditions:
          - "Unit is RETURN_PENDING"
        side_effects:
          - "No LEASE_PRORATE refund stands: the previously emitted LEASE_PRORATE credit for this unit is reversed (amount negated to zero net), preserving the lease conserved quantity"

  - entity: BillingCycle
    initial_state: OPEN
    terminal_states: [FINALIZED]
    transitions:
      # ---- billing_state dimension ----
      - from: OPEN
        to: CLOSED
        trigger: "POST /billing-cycles/{id}/close"
        actor: NetworkOps
        preconditions:
          - "Cycle is OPEN"
          - "No OutageEvent for this cycle is still OPEN (must be RESOLVED/CREDITED/DISMISSED)"
        side_effects:
          - "Freeze usage_gb = sum of posted UsageRecord.gb"
          - "Run overage_charge FINAL variant; set throttle_state per data-cap crossing"

      - from: CLOSED
        to: FINALIZED
        trigger: "POST /billing-cycles/{id}/finalize"
        actor: NetworkOps
        preconditions:
          - "Cycle is CLOSED"
        side_effects:
          - "Compute total_due_cents = monthly_fee + lease_fee + overage_charge - applied credits - promo_discount (evaluation order pinned in §1.3 monthly_bill_total)"
          - "Mark consumed AccountCredits.applied = true"

      # ---- throttle_state dimension (independent of billing_state) ----
      - from: UNCAPPED
        to: THROTTLED
        trigger: "POST /usage-records (cumulative usage_gb crosses included_gb while plan.overage_policy == THROTTLE)"
        actor: NetworkOps
        preconditions:
          - "Cycle billing_state is OPEN"
          - "Account plan.overage_policy == THROTTLE"
          - "cumulative usage_gb strictly greater than plan.included_gb after posting this record"
        side_effects:
          - "Set BillingCycle.throttle_state = THROTTLED"
          - "If the account is ACTIVE: Account.service_state ONLINE -> THROTTLED"
        note: "throttle_state evolves on usage posts; billing_state evolves on close/finalize — the two dimensions are orthogonal on the same row."

      - from: THROTTLED
        to: UNCAPPED
        trigger: "POST /accounts/{id}/restore-speed"
        actor: ProvisioningAgent
        preconditions:
          - "Cycle throttle_state is THROTTLED"
        side_effects:
          - "Set throttle_state = UNCAPPED; if account ACTIVE, service_state THROTTLED -> ONLINE"
        note: "Manual one-time speed restore (e.g., paid top-up); does not change billing_state."

  - entity: OutageEvent
    initial_state: OPEN
    terminal_states: [CREDITED, DISMISSED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /outage-events/{id}/resolve"
        actor: NetworkOps
        preconditions:
          - "Outage is OPEN"
          - "ended_at_iso (request body) strictly after started_at_iso"
        side_effects:
          - "Set ended_at_iso, duration_minutes = whole minutes between start and end"

      - from: RESOLVED
        to: CREDITED
        trigger: "POST /outage-events/{id}/issue-credit"
        actor: NetworkOps
        preconditions:
          - "Outage is RESOLVED"
          - "duration_minutes >= 240 (SLA qualifying threshold)"
        side_effects:
          - "Emit AccountCredit(source_type=OUTAGE) = outage_credit proration (§1.3); Account.credit_balance_cents recomputed"

      - from: RESOLVED
        to: DISMISSED
        trigger: "POST /outage-events/{id}/dismiss"
        actor: NetworkOps
        preconditions:
          - "Outage is RESOLVED"
        side_effects: []
        note: "Used when duration_minutes < 240 (below SLA) or otherwise non-qualifying."

  - entity: TransferRequest
    initial_state: REQUESTED
    terminal_states: [COMPLETED, REJECTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /transfer-requests/{id}/approve"
        actor: ProvisioningAgent
        preconditions:
          - "to_service_address.coverage_status == SERVICEABLE"
          - "to_plan.download_mbps <= to_service_address.max_serviceable_mbps"
        side_effects: []

      - from: APPROVED
        to: COMPLETED
        trigger: "POST /transfer-requests/{id}/complete"
        actor: ProvisioningAgent
        preconditions:
          - "Request is APPROVED"
          - "Account is ACTIVE"
          - "expected_account_version matches Account.version (OCC on the transferring account)"
        side_effects:
          - "Cascade: Account ACTIVE -> TRANSFERRED (see Account state machine)"
          - "increments Account.version by 1"

      - from: REQUESTED
        to: REJECTED
        trigger: "POST /transfer-requests/{id}/reject"
        actor: ProvisioningAgent
        preconditions: []
        side_effects: []

  - entity: InstallAppointment
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: BOOKED
        to: COMPLETED
        trigger: "POST /install-appointments/{id}/complete"
        actor: ProvisioningAgent
        preconditions:
          - "Appointment is BOOKED"
        side_effects:
          - "Slot's order can now activate"

      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /install-appointments/{id}/no-show"
        actor: ProvisioningAgent
        preconditions:
          - "Appointment is BOOKED"
        side_effects:
          - "InstallSlot.booked_count -= 1; if slot was FULL it returns to OPEN"

      - from: BOOKED
        to: CANCELLED
        trigger: "POST /install-appointments/{id}/cancel"
        actor: ProvisioningAgent | Customer
        preconditions:
          - "Appointment is BOOKED"
        side_effects:
          - "InstallSlot.booked_count -= 1; if slot was FULL it returns to OPEN"

# =============================================================================
# Concurrency Rules (§1.2.1 — true races only, OCC on Account.version)
# =============================================================================
concurrency_rules:
  - rule_id: appointment-book-stale-account
    parent_entity: Account
    write_endpoint: "POST /install-appointments"
    occ_field: "expected_account_version"
    description: |
      Booking an InstallAppointment for an account whose version has advanced
      since the client last observed it is rejected. A prior writer may have
      already disconnected or transferred the account (legitimately superseding
      the provisioning intent), so the booking client's view of the account is
      stale and the booking is refused on the version mismatch.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

  - rule_id: plan-change-stale-account
    parent_entity: Account
    write_endpoint: "POST /accounts/{id}/change-plan"
    occ_field: "expected_account_version"
    description: |
      Changing an account's plan against a stale account version is rejected.
      Another writer may have just changed the plan or disconnected the account
      (legitimately superseding the prior plan), so the current writer's
      expected_account_version no longer matches and the change is refused.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: overage_charge
    trigger: "BillingCycle close (FINAL) and GET /billing-cycles/{id}/overage-estimate (ESTIMATE)"
    algorithm: tiered_pricing
    formula: |
      over_gb = max(0, cumulative_usage_gb - plan.included_gb)   # strict: usage == included is NOT over
      if plan.overage_policy != BILL: overage_cents = 0          # THROTTLE/UNLIMITED never bill overage
      else:
        rem = over_gb; cost = 0
        t1 = min(rem, TIER1_LIMIT_GB); cost += t1 * TIER1_RATE_CENTS; rem -= t1
        t2 = min(rem, TIER2_LIMIT_GB); cost += t2 * TIER2_RATE_CENTS; rem -= t2
        cost += rem * TIER3_RATE_CENTS
        overage_cents = min(cost, OVERAGE_CAP_CENTS)
    input_set: "FINAL: cumulative_usage_gb = frozen usage_gb at close (sum of all UsageRecord.gb whose posted_at_iso is within the cycle window). ESTIMATE: cumulative_usage_gb = floor(usage_so_far / days_elapsed * cycle_days) projected to cycle end."
    constants:
      TIER1_LIMIT_GB: 50
      TIER1_RATE_CENTS: 50
      TIER2_LIMIT_GB: 50
      TIER2_RATE_CENTS: 30
      TIER3_RATE_CENTS: 20
      OVERAGE_CAP_CENTS: 6000
    precision: "integer cents; tier boundaries allocate marginal GB; cap applied last"
    variants:
      - name: final
        when: "BillingCycle close — uses actual frozen usage_gb"
        difference: "Chronological: sums actual posted UsageRecord.gb at close."
      - name: estimate
        when: "GET overage-estimate mid-cycle — forward-looking projection"
        difference: "Forward-looking: projects usage_so_far / days_elapsed * cycle_days, floor, then runs the same tier ladder. Diverges from final whenever the back half of the cycle deviates from the linear projection."

  - name: outage_credit
    trigger: "OutageEvent RESOLVED -> CREDITED (POST /outage-events/{id}/issue-credit)"
    algorithm: interval_merge
    formula: |
      cycle_minutes = whole minutes between BillingCycle.cycle_start_iso (incl) and cycle_end_iso (excl)
      qualifying_minutes = sum over this account's OutageEvents in {RESOLVED, CREDITED} whose
        billing_cycle_id == this cycle AND duration_minutes >= MIN_QUALIFYING_MINUTES,
        of duration_minutes  (overlapping outage intervals are merged before summing,
        so double-coverage of the same minute counts once)
      credit_cents = round_half_up(plan.monthly_fee_cents * qualifying_minutes / cycle_minutes)
      credit_cents = min(credit_cents, plan.monthly_fee_cents)   # never exceed one month's fee
    input_set: "OutageEvents for the same account+cycle with status in {RESOLVED, CREDITED} and duration_minutes >= 240; intervals merged (union of covered minutes), not naive-summed."
    constants:
      MIN_QUALIFYING_MINUTES: 240
    precision: "round_half_up to whole cents; ceiling at monthly_fee_cents"

  - name: lease_proration_credit
    trigger: "EquipmentUnit LEASED -> RETURN_PENDING (cascaded from disconnect/transfer)"
    algorithm: decay_function
    formula: |
      cycle_days = whole days in the open BillingCycle window
      days_used = whole days from BillingCycle.cycle_start_iso to clock now (inclusive of start day)
      days_remaining = max(0, cycle_days - days_used)
      refund_cents = round_half_up(unit.lease_fee_cents_per_cycle * days_remaining / cycle_days)
    input_set: "The single LEASED EquipmentUnit on the disconnecting/transferring account; refund is the unused-days portion of the current cycle's lease fee."
    precision: "round_half_up to whole cents"
    variants:
      - name: standard_return
        when: "unit reaches RETURNED via confirm-return"
        difference: "Refund credit stands."
      - name: lost_reversal
        when: "unit reaches LOST instead of RETURNED"
        difference: "The LEASE_PRORATE credit is reversed (net 0) — the conserved lease quantity must not refund a unit that was never returned."

  - name: early_termination_fee
    trigger: "Account ACTIVE/SUSPENDED -> DISCONNECTED; also projected on transfer for the waiver amount"
    algorithm: decay_function
    formula: |
      if plan.contract_term_months == 0: etf_cents = 0          # month-to-month
      else:
        months_elapsed = whole months between Account.contract_start_iso and clock now
        months_remaining = max(0, plan.contract_term_months - months_elapsed)
        etf_cents = round_half_up(plan.etf_full_cents * months_remaining / plan.contract_term_months)
    input_set: "The disconnecting account's currently-provisioned plan and its contract_start_iso."
    precision: "round_half_up to whole cents; 0 at or past term end (months_remaining == 0)"
    variants:
      - name: disconnect_charged
        when: "plain disconnect"
        difference: "ETF added as a charge on the final BillingCycle."
      - name: transfer_waived
        when: "disconnect happens as part of a TransferRequest with waive_etf == true"
        difference: "ETF is NOT charged; an equal TRANSFER_WAIVER credit is emitted so the net ETF burden is zero (compensating invariant)."

  - name: monthly_bill_total
    trigger: "BillingCycle CLOSED -> FINALIZED (POST /billing-cycles/{id}/finalize)"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is PINNED to make the promo (which keys off a subtotal tier) well-defined:
      # Step 1: plan_fee = plan.monthly_fee_cents
      # Step 2: lease_fee = (account.equipment_unit_id ? unit.lease_fee_cents_per_cycle : 0)
      #         -- on a disconnect cycle, lease_fee is replaced by the days_used charge (cycle - lease_proration_credit)
      # Step 3: overage_cents = overage_charge.final (0 unless overage_policy == BILL)
      # Step 4: etf_cents = early_termination_fee (only on a disconnect cycle; 0 otherwise)
      # Step 5: subtotal_pre = plan_fee + lease_fee
      # Step 6: promo_discount = (subtotal_pre >= PROMO_HIGH_CENTS ? PROMO_HIGH_OFF_CENTS
      #                          : subtotal_pre >= PROMO_LOW_CENTS  ? PROMO_LOW_OFF_CENTS : 0)
      # Step 7: applied_credits = sum of unapplied AccountCredit.amount_cents for the account
      # Step 8: total_due_cents = plan_fee + lease_fee + overage_cents + etf_cents - applied_credits - promo_discount
      # total_due_cents may be negative (carried as a credit balance); not floored at 0.
    input_set: "The cycle's account, its plan, its leased unit (if any), unapplied AccountCredits, and the FINAL overage/etf."
    constants:
      PROMO_LOW_CENTS: 8000
      PROMO_LOW_OFF_CENTS: 500
      PROMO_HIGH_CENTS: 10000
      PROMO_HIGH_OFF_CENTS: 1000
    precision: "integer cents; promo keyed strictly on subtotal_pre AFTER plan+lease, BEFORE overage/etf/credits"

  - name: serviceable_speed_check
    trigger: "ServiceOrder schedule/ship-kit, plan change, transfer approve"
    algorithm: threshold
    formula: |
      ok = (requested_plan.download_mbps <= service_address.max_serviceable_mbps)
           AND (service_address.coverage_status == SERVICEABLE)
      # boundary: equal is allowed (<=); plan exceeding plant by 1 Mbps is rejected
    input_set: "The order/transfer's requested plan and the target ServiceAddress."
    precision: "integer Mbps; <= boundary inclusive"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every referenced resource id exists (validated left-to-right in path, then body FKs)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: business_constraint
    check: "Request body well-formed; required fields present; gb > 0, amount_cents > 0, capacity > 0, end after start"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is allowed"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_referential
    check: "Customer acting on an account must own it (Account.customer_user_id == X-User-ID)"
    error_id: ERR_NOT_ACCOUNT_OWNER
    http_status: 403
    applies_to: "Customer-role account/order/appointment actions"

  - priority: 7
    category: business_safety
    check: "Target ServiceAddress.coverage_status must be SERVICEABLE before scheduling/shipping/transfer-approve"
    error_id: ERR_ADDRESS_NOT_SERVICEABLE
    http_status: 409
    applies_to: "ServiceOrder schedule/ship-kit, transfer approve"

  - priority: 8
    category: business_safety
    check: "Requested plan download_mbps must not exceed ServiceAddress.max_serviceable_mbps"
    error_id: ERR_PLAN_EXCEEDS_SERVICEABLE_SPEED
    http_status: 409
    applies_to: "ServiceOrder schedule/ship-kit, plan change, transfer approve"

  - priority: 9
    category: business_constraint
    check: "Self-install requires service_address.self_install_eligible == true"
    error_id: ERR_SELF_INSTALL_NOT_ELIGIBLE
    http_status: 409
    applies_to: "ServiceOrder ship-kit"

  - priority: 10
    category: business_temporal
    check: "InstallSlot must have booked_count < capacity (aggregate-capacity overlap, half-open window)"
    error_id: ERR_SLOT_AT_CAPACITY
    http_status: 409
    applies_to: "POST /install-appointments"

  - priority: 11
    category: business_temporal
    check: "Appointment [start, end+technician.travel_buffer) must not intersect any other BOOKED/COMPLETED appointment of the same technician"
    error_id: ERR_TECHNICIAN_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /install-appointments"

  - priority: 12
    category: business_temporal
    check: "Appointment [start,end) must fall entirely within the slot's [window_start, window_end)"
    error_id: ERR_APPOINTMENT_OUTSIDE_SLOT
    http_status: 422
    applies_to: "POST /install-appointments"

  - priority: 13
    category: business_constraint
    check: "OutageEvent must be RESOLVED with duration_minutes >= 240 before a credit may be issued"
    error_id: ERR_OUTAGE_BELOW_SLA
    http_status: 409
    applies_to: "POST /outage-events/{id}/issue-credit"

  - priority: 14
    category: business_constraint
    check: "A BillingCycle cannot be closed while any of its OutageEvents is still OPEN"
    error_id: ERR_CYCLE_HAS_OPEN_OUTAGE
    http_status: 409
    applies_to: "POST /billing-cycles/{id}/close"

  - priority: 15
    category: business_constraint
    check: "An EquipmentUnit must be IN_INVENTORY to be assignable at activation; none available -> error"
    error_id: ERR_NO_EQUIPMENT_AVAILABLE
    http_status: 409
    applies_to: "POST /service-orders/{id}/activate"

  - priority: 16
    category: business_fiscal
    check: "Optimistic-concurrency: expected_account_version must equal Account.version"
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
    applies_to: "POST /install-appointments, POST /accounts/{id}/change-plan, POST /accounts/{id}/disconnect, POST /transfer-requests/{id}/complete"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Reference catalogs ---
  - method: POST
    path: "/service-addresses"
    description: "Create a ServiceAddress (serviceability record)"
    roles: [ProvisioningAgent, NetworkOps]
    code: 201
    input: [line1, postal_code, coverage_status, technology, max_serviceable_mbps, self_install_eligible]
    output: ServiceAddress
    side_effects: []

  - method: GET
    path: "/service-addresses/{id}"
    description: "Get a ServiceAddress"
    roles: [Customer, ProvisioningAgent, NetworkOps, Dispatcher]
    code: 200
    input: []
    output: ServiceAddress
    side_effects: []

  - method: GET
    path: "/service-addresses/{id}/serviceability"
    description: "Serviceability check: returns coverage_status, technology, max_serviceable_mbps, self_install_eligible"
    roles: [Customer, ProvisioningAgent, NetworkOps, Dispatcher]
    code: 200
    input: []
    output: ServiceAddress
    side_effects: []

  - method: POST
    path: "/service-plans"
    description: "Create a ServicePlan"
    roles: [ProvisioningAgent, NetworkOps]
    code: 201
    input: [code, tier, download_mbps, throttled_mbps, monthly_fee_cents, included_gb, overage_policy, contract_term_months, etf_full_cents]
    output: ServicePlan
    side_effects: []

  - method: GET
    path: "/service-plans/{id}"
    description: "Get a ServicePlan"
    roles: [Customer, ProvisioningAgent, NetworkOps, Dispatcher]
    code: 200
    input: []
    output: ServicePlan
    side_effects: []

  - method: POST
    path: "/technicians"
    description: "Create a Technician"
    roles: [Dispatcher]
    code: 201
    input: [name, "travel_buffer_minutes?", "active?"]
    output: Technician
    side_effects: []

  - method: GET
    path: "/technicians/{id}"
    description: "Get a Technician"
    roles: [Dispatcher, ProvisioningAgent, NetworkOps]
    code: 200
    input: []
    output: Technician
    side_effects: []

  # --- Equipment ---
  - method: POST
    path: "/equipment-units"
    description: "Create an EquipmentUnit in inventory"
    roles: [ProvisioningAgent, NetworkOps]
    code: 201
    input: [kind, serial, lease_fee_cents_per_cycle]
    output: EquipmentUnit
    side_effects: ["status = IN_INVENTORY"]

  - method: GET
    path: "/equipment-units/{id}"
    description: "Get an EquipmentUnit"
    roles: [Customer, ProvisioningAgent, NetworkOps]
    code: 200
    input: []
    output: EquipmentUnit
    side_effects: []

  - method: GET
    path: "/equipment-units"
    description: "List EquipmentUnits, filterable by account_id and status"
    roles: [Customer, ProvisioningAgent, NetworkOps]
    code: 200
    input: ["account_id?", "status?"]
    output: "EquipmentUnit[]"
    side_effects: []

  - method: POST
    path: "/equipment-units/{id}/confirm-return"
    description: "Confirm a returned unit (RETURN_PENDING -> RETURNED)"
    roles: [ProvisioningAgent]
    code: 200
    input: []
    output: EquipmentUnit
    side_effects: ["status -> RETURNED; clear account_id"]

  - method: POST
    path: "/equipment-units/{id}/restock"
    description: "Restock a returned unit (RETURNED -> IN_INVENTORY)"
    roles: [ProvisioningAgent]
    code: 200
    input: []
    output: EquipmentUnit
    side_effects: ["status -> IN_INVENTORY"]

  - method: POST
    path: "/equipment-units/{id}/mark-lost"
    description: "Mark a unit lost (RETURN_PENDING -> LOST); reverses LEASE_PRORATE credit"
    roles: [ProvisioningAgent]
    code: 200
    input: []
    output: EquipmentUnit
    side_effects: ["status -> LOST; reverse the LEASE_PRORATE credit for this unit (net 0)"]

  # --- Account ---
  - method: POST
    path: "/accounts"
    description: "Create an Account (PENDING)"
    roles: [Customer, ProvisioningAgent]
    code: 201
    input: [service_address_id, plan_id, customer_user_id]
    output: Account
    side_effects: ["status = PENDING, version = 1"]

  - method: GET
    path: "/accounts/{id}"
    description: "Get an Account"
    roles: [Customer, ProvisioningAgent, NetworkOps, Dispatcher]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: POST
    path: "/accounts/{id}/change-plan"
    description: "Change the account's provisioned plan (OCC-guarded)"
    roles: [ProvisioningAgent]
    code: 200
    input: [new_plan_id, expected_account_version]
    output: Account
    side_effects: ["plan_id updated; increments Account.version by 1"]

  - method: POST
    path: "/accounts/{id}/suspend"
    description: "Suspend service (ACTIVE -> SUSPENDED)"
    roles: [ProvisioningAgent]
    code: 200
    input: []
    output: Account
    side_effects: ["service_state -> OFFLINE"]

  - method: POST
    path: "/accounts/{id}/resume"
    description: "Resume service (SUSPENDED -> ACTIVE)"
    roles: [ProvisioningAgent]
    code: 200
    input: []
    output: Account
    side_effects: ["service_state -> ONLINE or THROTTLED per open cycle"]

  - method: POST
    path: "/accounts/{id}/restore-speed"
    description: "Lift throttle on the open BillingCycle (THROTTLED -> UNCAPPED)"
    roles: [ProvisioningAgent]
    code: 200
    input: []
    output: BillingCycle
    side_effects: ["open BillingCycle.throttle_state -> UNCAPPED; service_state -> ONLINE if ACTIVE"]

  - method: POST
    path: "/accounts/{id}/disconnect"
    description: "Disconnect the account (OCC-guarded); cascades equipment return, ETF, cycle finalize"
    roles: [ProvisioningAgent]
    code: 200
    input: [expected_account_version]
    output: Account
    side_effects:
      - "status -> DISCONNECTED; service_state -> OFFLINE"
      - "Charge early_termination_fee on the open cycle"
      - "Cascade EquipmentUnit -> RETURN_PENDING (-> LEASE_PRORATE credit)"
      - "Cascade BillingCycle CLOSED -> FINALIZED"
      - "increments Account.version by 1"

  - method: GET
    path: "/accounts"
    description: "List Accounts, filterable by service_address_id, plan_id, equipment_unit_id, status"
    roles: [ProvisioningAgent, NetworkOps, Dispatcher]
    code: 200
    input: ["service_address_id?", "plan_id?", "equipment_unit_id?", "status?"]
    output: "Account[]"
    side_effects: []

  # --- Service Orders ---
  - method: POST
    path: "/service-orders"
    description: "Create a ServiceOrder (DRAFT)"
    roles: [Customer, ProvisioningAgent]
    code: 201
    input: [account_id, order_type, install_mode, requested_plan_id]
    output: ServiceOrder
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/service-orders/{id}"
    description: "Get a ServiceOrder"
    roles: [Customer, ProvisioningAgent, NetworkOps, Dispatcher]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: []

  - method: GET
    path: "/service-orders"
    description: "List ServiceOrders, filterable by account_id, requested_plan_id, equipment_unit_id, status"
    roles: [Customer, ProvisioningAgent, NetworkOps, Dispatcher]
    code: 200
    input: ["account_id?", "requested_plan_id?", "equipment_unit_id?", "status?"]
    output: "ServiceOrder[]"
    side_effects: []

  - method: POST
    path: "/service-orders/{id}/ship-kit"
    description: "Ship a self-install kit (DRAFT -> KIT_SHIPPED)"
    roles: [ProvisioningAgent]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: ["status -> KIT_SHIPPED"]

  - method: POST
    path: "/service-orders/{id}/activate"
    description: "Activate the order (SCHEDULED/KIT_SHIPPED -> ACTIVATED); join point assigning equipment and activating the account"
    roles: [Customer, ProvisioningAgent]
    code: 200
    input: []
    output: ServiceOrder
    side_effects:
      - "Assign EquipmentUnit; EquipmentUnit IN_INVENTORY -> LEASED"
      - "Account PENDING -> ACTIVE; create OPEN BillingCycle (cycle_start_iso = now, cycle_end_iso = now + 30 days)"

  - method: POST
    path: "/service-orders/{id}/cancel"
    description: "Cancel the order (DRAFT/SCHEDULED/KIT_SHIPPED -> CANCELLED)"
    roles: [ProvisioningAgent]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: ["cascade appointment cancel or equipment release per branch"]

  # --- Install Slots & Appointments ---
  - method: POST
    path: "/install-slots"
    description: "Create an InstallSlot (capacity window for a technician)"
    roles: [Dispatcher]
    code: 201
    input: [technician_id, window_start_iso, window_end_iso, capacity]
    output: InstallSlot
    side_effects: ["status = OPEN, booked_count = 0"]

  - method: GET
    path: "/install-slots/{id}"
    description: "Get an InstallSlot"
    roles: [Customer, ProvisioningAgent, NetworkOps, Dispatcher]
    code: 200
    input: []
    output: InstallSlot
    side_effects: []

  - method: GET
    path: "/install-slots"
    description: "List InstallSlots, filterable by technician_id and status"
    roles: [Customer, ProvisioningAgent, NetworkOps, Dispatcher]
    code: 200
    input: ["technician_id?", "status?"]
    output: "InstallSlot[]"
    side_effects: []

  - method: POST
    path: "/install-appointments"
    description: "Book an InstallAppointment for a TECH_INSTALL order (DRAFT -> SCHEDULED); OCC-guarded on the account"
    roles: [Customer, ProvisioningAgent]
    code: 201
    input: [service_order_id, install_slot_id, start_iso, end_iso, expected_account_version]
    output: InstallAppointment
    side_effects:
      - "InstallSlot.booked_count += 1; slot -> FULL when booked_count reaches capacity"
      - "ServiceOrder DRAFT -> SCHEDULED"
      - "technician_id copied from slot"
      - "increments Account.version by 1"

  - method: GET
    path: "/install-appointments/{id}"
    description: "Get an InstallAppointment"
    roles: [Customer, ProvisioningAgent, NetworkOps, Dispatcher]
    code: 200
    input: []
    output: InstallAppointment
    side_effects: []

  - method: GET
    path: "/install-appointments"
    description: "List InstallAppointments, filterable by service_order_id, install_slot_id, technician_id"
    roles: [Customer, ProvisioningAgent, NetworkOps, Dispatcher]
    code: 200
    input: ["service_order_id?", "install_slot_id?", "technician_id?"]
    output: "InstallAppointment[]"
    side_effects: []

  - method: POST
    path: "/install-appointments/{id}/complete"
    description: "Mark appointment completed (BOOKED -> COMPLETED)"
    roles: [ProvisioningAgent]
    code: 200
    input: []
    output: InstallAppointment
    side_effects: []

  - method: POST
    path: "/install-appointments/{id}/no-show"
    description: "Mark appointment no-show (BOOKED -> NO_SHOW)"
    roles: [ProvisioningAgent]
    code: 200
    input: []
    output: InstallAppointment
    side_effects: ["InstallSlot.booked_count -= 1; FULL -> OPEN"]

  - method: POST
    path: "/install-appointments/{id}/cancel"
    description: "Cancel appointment (BOOKED -> CANCELLED)"
    roles: [Customer, ProvisioningAgent]
    code: 200
    input: []
    output: InstallAppointment
    side_effects: ["InstallSlot.booked_count -= 1; FULL -> OPEN"]

  # --- Billing, Usage, Outage, Credits ---
  - method: POST
    path: "/billing-cycles"
    description: "Open a BillingCycle for an account (normally created by activation; this endpoint allows explicit creation for subsequent cycles)"
    roles: [NetworkOps, ProvisioningAgent]
    code: 201
    input: [account_id, cycle_start_iso, cycle_end_iso]
    output: BillingCycle
    side_effects: ["billing_state = OPEN, throttle_state = UNCAPPED"]

  - method: GET
    path: "/billing-cycles/{id}"
    description: "Get a BillingCycle"
    roles: [Customer, ProvisioningAgent, NetworkOps]
    code: 200
    input: []
    output: BillingCycle
    side_effects: []

  - method: GET
    path: "/billing-cycles"
    description: "List BillingCycles, filterable by account_id and billing_state"
    roles: [Customer, ProvisioningAgent, NetworkOps]
    code: 200
    input: ["account_id?", "billing_state?"]
    output: "BillingCycle[]"
    side_effects: []

  - method: GET
    path: "/billing-cycles/{id}/overage-estimate"
    description: "Computed read: forward-looking overage estimate (ESTIMATE variant) at a given as_of date"
    roles: [Customer, ProvisioningAgent, NetworkOps]
    code: 200
    input: ["as_of_iso?"]
    output: BillingCycle
    side_effects: []

  - method: POST
    path: "/billing-cycles/{id}/close"
    description: "Close a cycle (OPEN -> CLOSED); freezes usage and runs FINAL overage"
    roles: [NetworkOps]
    code: 200
    input: []
    output: BillingCycle
    side_effects: ["freeze usage_gb; compute overage_charge_cents (final); set throttle_state per cap"]

  - method: POST
    path: "/billing-cycles/{id}/finalize"
    description: "Finalize a cycle (CLOSED -> FINALIZED); computes total_due and applies credits"
    roles: [NetworkOps]
    code: 200
    input: []
    output: BillingCycle
    side_effects: ["compute total_due_cents; mark consumed AccountCredits.applied = true"]

  - method: POST
    path: "/usage-records"
    description: "Post a UsageRecord to a cycle; may trigger throttle when cap is crossed"
    roles: [NetworkOps]
    code: 201
    input: [account_id, billing_cycle_id, posted_at_iso, gb]
    output: UsageRecord
    side_effects:
      - "BillingCycle.usage_gb += gb"
      - "If cumulative usage_gb > plan.included_gb and overage_policy == THROTTLE: cycle throttle_state -> THROTTLED, service_state -> THROTTLED"

  - method: GET
    path: "/usage-records/{id}"
    description: "Get a UsageRecord"
    roles: [Customer, ProvisioningAgent, NetworkOps]
    code: 200
    input: []
    output: UsageRecord
    side_effects: []

  - method: GET
    path: "/usage-records"
    description: "List UsageRecords, filterable by account_id and billing_cycle_id"
    roles: [Customer, ProvisioningAgent, NetworkOps]
    code: 200
    input: ["account_id?", "billing_cycle_id?"]
    output: "UsageRecord[]"
    side_effects: []

  - method: POST
    path: "/outage-events"
    description: "Log an OutageEvent (OPEN)"
    roles: [NetworkOps]
    code: 201
    input: [account_id, billing_cycle_id, started_at_iso]
    output: OutageEvent
    side_effects: ["status = OPEN"]

  - method: GET
    path: "/outage-events/{id}"
    description: "Get an OutageEvent"
    roles: [Customer, ProvisioningAgent, NetworkOps]
    code: 200
    input: []
    output: OutageEvent
    side_effects: []

  - method: GET
    path: "/outage-events"
    description: "List OutageEvents, filterable by account_id and billing_cycle_id"
    roles: [Customer, ProvisioningAgent, NetworkOps]
    code: 200
    input: ["account_id?", "billing_cycle_id?"]
    output: "OutageEvent[]"
    side_effects: []

  - method: POST
    path: "/outage-events/{id}/resolve"
    description: "Resolve an outage (OPEN -> RESOLVED); sets duration"
    roles: [NetworkOps]
    code: 200
    input: [ended_at_iso]
    output: OutageEvent
    side_effects: ["set ended_at_iso, duration_minutes"]

  - method: POST
    path: "/outage-events/{id}/issue-credit"
    description: "Issue an outage credit (RESOLVED -> CREDITED) when duration >= SLA threshold"
    roles: [NetworkOps]
    code: 200
    input: []
    output: OutageEvent
    side_effects: ["emit AccountCredit(source_type=OUTAGE); recompute Account.credit_balance_cents"]

  - method: POST
    path: "/outage-events/{id}/dismiss"
    description: "Dismiss a resolved outage (RESOLVED -> DISMISSED), e.g. below SLA"
    roles: [NetworkOps]
    code: 200
    input: []
    output: OutageEvent
    side_effects: []

  - method: GET
    path: "/account-credits/{id}"
    description: "Get an AccountCredit"
    roles: [Customer, ProvisioningAgent, NetworkOps]
    code: 200
    input: []
    output: AccountCredit
    side_effects: []

  - method: GET
    path: "/account-credits"
    description: "List AccountCredits, filterable by account_id and applied"
    roles: [Customer, ProvisioningAgent, NetworkOps]
    code: 200
    input: ["account_id?", "applied?"]
    output: "AccountCredit[]"
    side_effects: []

  - method: POST
    path: "/accounts/{id}/credits"
    description: "Issue a manual GOODWILL credit to an account"
    roles: [ProvisioningAgent, NetworkOps]
    code: 201
    input: [amount_cents]
    output: AccountCredit
    side_effects: ["source_type = GOODWILL; recompute Account.credit_balance_cents"]

  # --- Transfer ---
  - method: POST
    path: "/transfer-requests"
    description: "Create a TransferRequest (REQUESTED)"
    roles: [Customer, ProvisioningAgent]
    code: 201
    input: [account_id, to_service_address_id, to_plan_id, "waive_etf?"]
    output: TransferRequest
    side_effects: ["status = REQUESTED"]

  - method: GET
    path: "/transfer-requests/{id}"
    description: "Get a TransferRequest"
    roles: [Customer, ProvisioningAgent, NetworkOps]
    code: 200
    input: []
    output: TransferRequest
    side_effects: []

  - method: GET
    path: "/transfer-requests"
    description: "List TransferRequests, filterable by account_id, to_service_address_id, to_plan_id, status"
    roles: [Customer, ProvisioningAgent, NetworkOps]
    code: 200
    input: ["account_id?", "to_service_address_id?", "to_plan_id?", "status?"]
    output: "TransferRequest[]"
    side_effects: []

  - method: POST
    path: "/transfer-requests/{id}/approve"
    description: "Approve a transfer (REQUESTED -> APPROVED) after serviceability/speed checks"
    roles: [ProvisioningAgent]
    code: 200
    input: []
    output: TransferRequest
    side_effects: []

  - method: POST
    path: "/transfer-requests/{id}/complete"
    description: "Complete a transfer (APPROVED -> COMPLETED); OCC-guarded; cascades account TRANSFERRED"
    roles: [ProvisioningAgent]
    code: 200
    input: [expected_account_version]
    output: TransferRequest
    side_effects:
      - "Cascade Account ACTIVE -> TRANSFERRED, equipment -> RETURN_PENDING, cycle finalize"
      - "If waive_etf: emit TRANSFER_WAIVER credit instead of charging ETF"
      - "increments Account.version by 1"

  - method: POST
    path: "/transfer-requests/{id}/reject"
    description: "Reject a transfer (REQUESTED -> REJECTED)"
    roles: [ProvisioningAgent]
    code: 200
    input: []
    output: TransferRequest
    side_effects: []

  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server clock to a fixed UTC instant (test-driving)"
    roles: [NetworkOps, ProvisioningAgent]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server clock pinned; subsequent now-stamped fields use this instant"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role valid but not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, non-positive gb/amount/capacity, end not after start" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state permitting the requested transition" }
  - { id: ERR_NOT_ACCOUNT_OWNER, http: 403, condition: "Customer acting on an account they do not own (Account.customer_user_id != X-User-ID)" }
  - { id: ERR_ADDRESS_NOT_SERVICEABLE, http: 409, condition: "ServiceAddress.coverage_status is not SERVICEABLE" }
  - { id: ERR_PLAN_EXCEEDS_SERVICEABLE_SPEED, http: 409, condition: "Requested plan download_mbps exceeds ServiceAddress.max_serviceable_mbps" }
  - { id: ERR_SELF_INSTALL_NOT_ELIGIBLE, http: 409, condition: "Self-install kit requested but service_address.self_install_eligible is false" }
  - { id: ERR_SLOT_AT_CAPACITY, http: 409, condition: "InstallSlot.booked_count has reached capacity" }
  - { id: ERR_TECHNICIAN_DOUBLE_BOOKED, http: 409, condition: "Appointment plus travel buffer intersects another appointment of the same technician" }
  - { id: ERR_APPOINTMENT_OUTSIDE_SLOT, http: 422, condition: "Appointment [start,end) not fully within the slot window" }
  - { id: ERR_OUTAGE_BELOW_SLA, http: 409, condition: "Outage duration below the 240-minute SLA threshold for crediting" }
  - { id: ERR_CYCLE_HAS_OPEN_OUTAGE, http: 409, condition: "BillingCycle cannot close while an OutageEvent is still OPEN" }
  - { id: ERR_NO_EQUIPMENT_AVAILABLE, http: 409, condition: "No IN_INVENTORY EquipmentUnit available to assign at activation" }
  - { id: ERR_STALE_ACCOUNT_VERSION, http: 412, condition: "expected_account_version does not match Account.version (OCC)" }
  - { id: ERR_DUPLICATE_SERIAL, http: 409, condition: "EquipmentUnit serial already in use" }
  - { id: ERR_DUPLICATE_PLAN_CODE, http: 409, condition: "ServicePlan code already in use" }
  - { id: ERR_USAGE_OUTSIDE_CYCLE, http: 422, condition: "UsageRecord.posted_at_iso falls outside the cycle window" }
  - { id: ERR_OUTAGE_OUTSIDE_CYCLE, http: 422, condition: "OutageEvent started_at_iso falls outside the cycle window" }
  - { id: ERR_CYCLE_NOT_CLOSED, http: 409, condition: "finalize called on a cycle that is not CLOSED" }
  - { id: ERR_ACCOUNT_NOT_ACTIVE, http: 409, condition: "Transfer complete requires the account to be ACTIVE" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "End customer; acts only on accounts they own (browses serviceability, creates orders/transfers, books/cancels own appointments, self-activates a shipped kit)"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /accounts — create own account (shared with ProvisioningAgent)"
      - "POST /service-orders — create order (shared with ProvisioningAgent)"
      - "POST /install-appointments — book appointment (shared with ProvisioningAgent)"
      - "POST /install-appointments/{id}/cancel — cancel own appointment (shared with ProvisioningAgent)"
      - "POST /service-orders/{id}/activate — self-install activation (shared with ProvisioningAgent)"
      - "POST /transfer-requests — request transfer (shared with ProvisioningAgent)"
      - "GET endpoints on owned/reference resources"

  - name: ProvisioningAgent
    description: "Operations agent: drives orders, equipment lifecycle, account suspend/resume/disconnect/change-plan, transfer approval/completion"
    identity: "opaque"
    exclusive_operations:
      - "POST /accounts/{id}/change-plan"
      - "POST /accounts/{id}/suspend"
      - "POST /accounts/{id}/resume"
      - "POST /accounts/{id}/restore-speed"
      - "POST /accounts/{id}/disconnect"
      - "POST /service-orders/{id}/ship-kit"
      - "POST /service-orders/{id}/cancel"
      - "POST /equipment-units/{id}/confirm-return"
      - "POST /equipment-units/{id}/restock"
      - "POST /equipment-units/{id}/mark-lost"
      - "POST /install-appointments/{id}/complete"
      - "POST /install-appointments/{id}/no-show"
      - "POST /transfer-requests/{id}/approve"
      - "POST /transfer-requests/{id}/complete"
      - "POST /transfer-requests/{id}/reject"
    shared_operations:
      - "POST /accounts (with Customer)"
      - "POST /service-orders (with Customer)"
      - "POST /install-appointments (with Customer)"
      - "POST /install-appointments/{id}/cancel (with Customer)"
      - "POST /service-orders/{id}/activate (with Customer)"
      - "POST /transfer-requests (with Customer)"
      - "POST /service-addresses, POST /service-plans, POST /equipment-units (with NetworkOps)"
      - "POST /accounts/{id}/credits (with NetworkOps)"
      - "POST /billing-cycles (with NetworkOps)"

  - name: NetworkOps
    description: "Network operations: posts usage, logs/resolves/credits outages, opens/closes/finalizes billing cycles, manages catalogs"
    identity: "opaque"
    exclusive_operations:
      - "POST /usage-records"
      - "POST /billing-cycles/{id}/close"
      - "POST /billing-cycles/{id}/finalize"
      - "POST /outage-events"
      - "POST /outage-events/{id}/resolve"
      - "POST /outage-events/{id}/issue-credit"
      - "POST /outage-events/{id}/dismiss"
    shared_operations:
      - "POST /service-addresses, POST /service-plans, POST /equipment-units (with ProvisioningAgent)"
      - "POST /accounts/{id}/credits (with ProvisioningAgent)"
      - "POST /billing-cycles (with ProvisioningAgent)"
      - "GET endpoints"

  - name: Dispatcher
    description: "Field-scheduling role: owns Technicians and InstallSlots"
    identity: "opaque"
    exclusive_operations:
      - "POST /technicians"
      - "POST /install-slots"
    shared_operations:
      - "GET endpoints on slots, technicians, orders, appointments"
