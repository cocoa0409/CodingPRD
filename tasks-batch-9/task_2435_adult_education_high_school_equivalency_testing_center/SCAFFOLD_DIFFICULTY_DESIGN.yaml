            - "room creation under the WITHDRAWN center returns 409 with data.error_id == ERR_CENTER_NOT_AUTHORIZED"
            - "GRANT_FULL on the WITHDRAWN center returns 409 with data.error_id == ERR_CENTER_DECISION_NOT_ALLOWED (terminal state)"

  - rule_id: transitive_cascade
    instances:
      - name: attendance_void_hours_posttest_outcome_funding_depth4
        depth: 4
        grounds:
          - state_machines[AttendanceEntry].transitions[POSTED->VOIDED].side_effects
          - state_machines[TestEvent].transitions[SCORED->INVALIDATED]
          - state_machines[OutcomeRecord].transitions[CERTIFIED->RESCINDED]
          - calculations.instructional_hour_ledger
          - calculations.msg_determination
          - concurrency_rules[attendance-void-stale-enrollment]
        chain: "void one 8.00-hour entry -> Enrollment.posted_hours 40.00 -> 32.00 (link 1) -> that drop below 40.00 invalidates the SCORED POST_TEST (link 2) -> losing the post-test withdraws the measurable skill gain, rescinding the CERTIFIED EFL_GAIN outcome (link 3) -> the rescission returns its committed 10000 cents to the funding pool (link 4)"
        distinguishing_aspect: |
          Trigger is an attendance void (an hour-ledger event). Each link is caused strictly by the
          previous one: link 2 fires only because link 1 pushed posted_hours under the 40.00 gate,
          link 3 fires only because link 2 removed the post-test the gain rested on, and link 4
          fires only because link 3 rescinded a COMMITTED line.
        test_recipe:
          setup:
            - "FundingPeriod PY2026 OPEN, rate_cents_per_weight 10000, total_cents 100000."
            - "Student PLACED at EFL 2 by a PRE_TEST scored 205 on 2026-08-03T09:00:00Z."
