            - *c_rad
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-EL-D", patient_state_code: "CT", exam_type: "DIAGNOSTIC", performed_at: "2026-07-20T00:00:00Z", original_image_count: 6 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { el_dia_id: $.data.id }
            - call: "POST /exams/${el_dia_id}/interpret"
              payload: { birads_assessment: 3 }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-EL-S", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-21T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { el_scr_id: $.data.id }
          trigger:
