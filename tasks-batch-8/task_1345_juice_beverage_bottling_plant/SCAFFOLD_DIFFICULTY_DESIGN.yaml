          trigger:
            - { call: "POST /v1/batches/${batch_id}/release", payload: {}, as: QAInspector, as_user_id: "qa-1", captures: { err: $.data.error_id } }
            - { call: "POST /v1/process-runs/${prun_id}/qa-disposition", payload: { disposition: "RELEASE" }, as: QAInspector, as_user_id: "qa-1" }
            - { call: "POST /v1/batches/${batch_id}/release", payload: {}, as: QAInspector, as_user_id: "qa-1", captures: { b_status: $.data.status } }
          assert:
            - "pr_status == DEVIATED and pr_dev == MINOR (86.5 >= 88.0 - 2.0 and 30 <= 60)"
            - "First release: err == ERR_PROCESS_NOT_VALIDATED (HTTP 409) — batch PROCESSING, governing run DEVIATED"
            - "After qa-disposition RELEASE: batch becomes PROCESSED then b_status == RELEASED"

