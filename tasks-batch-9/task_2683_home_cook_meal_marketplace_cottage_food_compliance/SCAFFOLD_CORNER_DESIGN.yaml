            - call: POST /safety-incidents/${i2}/adjudicate
              payload: { decision: "SUBSTANTIATE", resolution_note: "label photo confirms" }
              as: SafetyOfficer
              as_user_id: so-2
            - call: GET /cooks/${cook_id}
              payload: {}
              as: SafetyOfficer
              as_user_id: so-2
              captures: { score_after: "$.data.safety_score", standing_after: "$.data.compliance_standing", reason_after: "$.data.standing_reason" }
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-09-25T00:00:00Z" }
              as: PlatformAdmin
            - call: GET /cooks/${cook_id}
              payload: {}
              as: SafetyOfficer
              as_user_id: so-2
