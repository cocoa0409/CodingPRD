          Category pair STATE (priority 21) versus BUSINESS_FISCAL (priority 62): the identical
          underfunded sign of 1000 cents returns ERR_DEPOSIT_BELOW_MINIMUM while the show is still
          SPACE_SELECTION and switches to ERR_INVALID_SHOW_STATUS once the show is ON_SITE, so only the
          declared priority order — not the payload — decides which of the two live violations is reported.
