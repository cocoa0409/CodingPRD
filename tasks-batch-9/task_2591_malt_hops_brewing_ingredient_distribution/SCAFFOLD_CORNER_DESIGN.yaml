              as: WarehouseOperator
              as_user_id: "qa-analyst-1"
          trigger:
            - call: "GET /malt-lots/${af_lot_id}/spec-match"
              payload: { recipe_id: "${af_plain_recipe_id}" }
              as: Brewer
