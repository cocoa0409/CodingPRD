              as: SpecialEdCoordinator
          trigger:
            - call: "POST /sped-staffing/paraprofessionals/${p1}/qualifications/revoke"
              payload: { qualification: "BEHAVIOR_SUPPORT" }
              as: DistrictStaffingAdmin
            - call: "GET /sped-staffing/assignments/${a1}"
              as: Any
              captures: { a1_status: $.data.status }
            - call: "GET /sped-staffing/absence-reports"
              payload: { assignment_id: "${a1}" }
