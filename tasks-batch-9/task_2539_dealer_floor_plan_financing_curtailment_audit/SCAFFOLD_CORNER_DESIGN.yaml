              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c16_cl: "$.data.id" }
            - call: "POST /floorplan/credit-lines/${c16_cl}/activate"
              payload: {}
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "POST /floorplan/units"
              payload: { dealer_id: "${c16_d}", credit_line_id: "${c16_cl}", vin: "1CRNTERMINALUNIT1", inventory_class: "NEW", invoice_amount_cents: 3000000, invoice_date: "2026-08-01", title_document_type: "MSO" }
              as: DealerPrincipal
              as_user_id: "${c16_d}"
              captures: { c16_u: "$.data.id" }
            - call: "POST /floorplan/units/${c16_u}/title-custody"
              payload: { new_custody_status: "LENDER_HELD", document_reference: "MSO-C16" }
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "POST /floorplan/units/${c16_u}/title-custody"
              payload: { new_custody_status: "RELEASED_FOR_SALE" }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c16_released: "$.data.title_custody_status", c16_relver: "$.data.version" }
