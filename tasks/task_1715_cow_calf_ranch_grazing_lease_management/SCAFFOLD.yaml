# =============================================================================
# PRD Benchmark Seed Tables — Cow-Calf Ranch & Grazing Lease Management
# =============================================================================

scenario: |
  Cow-Calf Ranch & Grazing Lease Management (western cow-calf ranch): breeding/calving season & pregnancy check, pasture rotation & stocking rate by forage, calf marketing (weaning weight/preconditioning premium), grazing lease terms (AUM) & payment, mineral/supplement program, herd genetics & bull battery, drought contingency & destocking trigger, replacement heifer retention

domain_name: cow-calf-grazing
api_prefix: /api

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation          # AUM forage budget: reserved, committed, released across competing herd groups
  secondary_archetype: temporal_windowing      # pasture rest buffers, bull turnaround gaps, lease windows, BSE validity windows
  complexity_layers:
    - rate_threshold_triggers                  # drought posture thresholds, destock trigger, 45-day preconditioning gate
    - dual_variant_calculation                 # lease settlement basis; adjusted 205-day weaning weight
    - cascading_side_effects                   # drought finalize -> posture -> destock order -> herd reductions -> AUM release
    - optimistic_concurrency                   # OCC on GrazingLease.version (amend) and Ranch.version (assessment finalize)
  entity_topology: flat                        # peer collections under /api with FK references; junction entities (BullTurnout, GrazingAssignment)
  state_machine_shape: cyclic                  # lease suspend/reinstate, sale-lot relist/dispute loops, bull BSE retest loop; plus parallel axes on CalfCrop
  relationship_patterns:
    - one_to_many
    - many_to_many                             # BullTurnout joins Bull x BreedingSeason; GrazingAssignment joins HerdGroup x Pasture over time
    - cross_aggregate                          # SaleLot -> CalfCrop; LeaseStatement usage derived from GrazingAssignment via Pasture
  role_model: segregation_of_duties            # statement approver != recorder; sale settler != seller; RanchManager approves but cannot record field data
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1: Entity-Relationship Table
# All date fields are ISO calendar dates (YYYY-MM-DD) interpreted against the
# logical clock (POST /api/_clock/set_current_utc). "current_date" everywhere
# means the UTC calendar date of the logical clock.
# =============================================================================
entities:
  - name: Ranch
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Ranch display name" }
      - { name: hq_state, type: string, source: input, description: "Two-letter state code of headquarters" }
      - { name: destock_grace_days, type: integer, source: input, default: 30, description: "Days from drought assessment date to comply with a DestockOrder" }
      - { name: drought_posture, type: enum, source: computed, default: NORMAL, description: "NORMAL | WATCH | ALERT | CRITICAL — set only by DroughtAssessment finalize", constraints: "enum: NORMAL, WATCH, ALERT, CRITICAL" }
      - { name: ranch_production_pct, type: number, source: computed, default: 100.0, description: "Capacity-weighted forage production pct of normal from latest finalized assessment (1 decimal)" }
      - { name: assessment_seq, type: integer, source: system, default: 0, description: "Count of finalized DroughtAssessments; increments on each finalize" }

  - name: Pasture
    parent: null
    common_fields: true
    fields:
      - { name: ranch_id, type: string, source: input, description: "FK -> Ranch.id" }
      - { name: name, type: string, source: input, description: "Pasture name" }
      - { name: acreage, type: integer, source: input, description: "Grazeable acres" }
      - { name: tenure, type: enum, source: input, description: "DEEDED | LEASED", constraints: "enum: DEEDED, LEASED" }
      - { name: forage_type, type: enum, source: input, description: "NATIVE_RANGE | IMPROVED | CROP_RESIDUE", constraints: "enum: NATIVE_RANGE, IMPROVED, CROP_RESIDUE" }
      - { name: base_capacity_aum, type: integer, source: input, description: "Rated forage capacity in AUM per 5-month grazing season under NORMAL posture" }
      - { name: min_rest_days, type: integer, source: input, default: 45, description: "Mandatory rest days between grazing windows on this pasture" }
      - { name: effective_capacity_aum, type: number, source: computed, description: "round2(base_capacity_aum x drought posture factor); recomputed on every read/mutation" }
      - { name: committed_aum, type: number, source: computed, description: "Sum of reserved_aum over assignments with assignment_status == ACTIVE" }
      - { name: consumed_total_aum, type: number, source: computed, description: "Sum of consumed_aum over COMPLETED | SHORTENED assignments on this pasture" }
      - { name: available_aum, type: number, source: computed, description: "effective_capacity_aum - committed_aum - consumed_total_aum" }
      - { name: resting_until, type: datetime, source: system, description: "Date pasture leaves RESTING (last actual_end_date + min_rest_days); null if never grazed", default: null }
      - { name: closed_flag, type: boolean, source: system, default: false, description: "Set by POST /close; irreversible" }
      - { name: condition_status, type: enum, source: computed, description: "CLOSED if closed_flag; else RESTING if current_date < resting_until; else GRAZEABLE. RESTING is informational — spacing is enforced by the min_rest_days buffer rule; only CLOSED blocks creation", constraints: "enum: GRAZEABLE, RESTING, CLOSED" }

  - name: GrazingLease
    parent: null
    common_fields: true
    fields:
      - { name: ranch_id, type: string, source: input, description: "FK -> Ranch.id" }
      - { name: pasture_id, type: string, source: input, description: "FK -> Pasture.id; pasture must have tenure == LEASED" }
      - { name: lessor_name, type: string, source: input, description: "Landowner name" }
      - { name: start_date, type: datetime, source: input, description: "Lease window start (inclusive)" }
      - { name: end_date, type: datetime, source: input, description: "Lease window end (inclusive)" }
      - { name: aum_allotment, type: integer, source: input, description: "Contracted AUM allotment for the lease window" }
      - { name: rate_per_aum_cents, type: integer, source: input, description: "Base rate per AUM" }
      - { name: minimum_commit_aum, type: integer, source: input, description: "Take-or-pay floor, ACTUAL_USE basis only" }
      - { name: overage_tier1_cap_aum, type: integer, source: input, description: "Overage AUM up to this quantity billed at tier1 rate" }
      - { name: overage_tier1_rate_cents, type: integer, source: input, description: "Tier-1 overage rate per AUM" }
      - { name: overage_tier2_rate_cents, type: integer, source: input, description: "Tier-2 overage rate per AUM beyond tier1 cap" }
      - { name: settlement_basis, type: enum, source: input, description: "ALLOTMENT | ACTUAL_USE", constraints: "enum: ALLOTMENT, ACTUAL_USE" }
      - { name: lease_status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | EXPIRED | TERMINATED", constraints: "enum: DRAFT, ACTIVE, SUSPENDED, EXPIRED, TERMINATED" }

  - name: LeaseStatement
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> GrazingLease.id" }
      - { name: ranch_id, type: string, source: input, description: "FK -> Ranch.id; must equal lease.ranch_id" }
      - { name: period_year, type: integer, source: input, description: "Calendar settlement year; must fall within [year(lease.start_date), year(lease.end_date)]" }
      - { name: actual_aum_used, type: number, source: computed, description: "Snapshot at creation: sum of consumed AUM from COMPLETED/SHORTENED assignments on the lease pasture intersecting [period_year-01-01, period_year+1-01-01)" }
      - { name: base_charge_cents, type: number, source: computed, description: "Per lease_settlement_charge variant" }
      - { name: overage_charge_cents, type: number, source: computed, description: "Tiered overage charge" }
      - { name: total_due_cents, type: number, source: computed, description: "base_charge_cents + overage_charge_cents" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the creating RangeManager (segregation anchor)" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of approving RanchManager" }
      - { name: statement_status, type: enum, source: system, description: "DRAFT | ISSUED | APPROVED | PAID", constraints: "enum: DRAFT, ISSUED, APPROVED, PAID" }

  - name: HerdGroup
    parent: null
    common_fields: true
    fields:
      - { name: ranch_id, type: string, source: input, description: "FK -> Ranch.id" }
      - { name: group_name, type: string, source: input, description: "Management group name" }
      - { name: animal_class, type: enum, source: input, description: "MATURE_COW | REPLACEMENT_HEIFER | GROWING", constraints: "enum: MATURE_COW, REPLACEMENT_HEIFER, GROWING" }
      - { name: head_count, type: integer, source: input, description: "Current head; mutated only by reductions and heifer retention" }
      - { name: avg_weight_lbs, type: integer, source: input, description: "Average shrunk body weight" }
      - { name: marked_open_head, type: integer, source: system, default: 0, description: "Head flagged open by finalized PregChecks (cull candidates)" }
      - { name: retained_from_crop_id, type: string, source: system, default: null, description: "FK -> CalfCrop.id; set on first retain-heifers into this group; gates unretain" }
      - { name: group_status, type: enum, source: system, description: "ACTIVE | DESTOCKING | LIQUIDATED", constraints: "enum: ACTIVE, DESTOCKING, LIQUIDATED" }

  - name: BreedingSeason
    parent: null
    common_fields: true
    fields:
      - { name: ranch_id, type: string, source: input, description: "FK -> Ranch.id" }
      - { name: herd_group_id, type: string, source: input, description: "FK -> HerdGroup.id; the cow group being bred" }
      - { name: season_year, type: integer, source: input, description: "Calendar year of turnout" }
      - { name: planned_turnout_date, type: datetime, source: input, description: "Planned first day bulls are with cows" }
      - { name: planned_removal_date, type: datetime, source: input, description: "Planned last day bulls are with cows" }
      - { name: exposed_head_count, type: integer, source: input, description: "Females exposed; must be <= herd_group.head_count at creation" }
      - { name: required_bull_count, type: integer, source: computed, description: "ceil(exposed_head_count / COWS_PER_BULL)" }
      - { name: season_status, type: enum, source: system, description: "PLANNED | BREEDING | GESTATION | PREG_CHECK | CLOSED", constraints: "enum: PLANNED, BREEDING, GESTATION, PREG_CHECK, CLOSED" }

  - name: Bull
    parent: null
    common_fields: true
    fields:
      - { name: ranch_id, type: string, source: input, description: "FK -> Ranch.id" }
      - { name: tag, type: string, source: input, description: "Ear tag" }
      - { name: breed, type: string, source: input, description: "Breed code" }
      - { name: birth_year, type: integer, source: input, description: "Birth year" }
      - { name: last_bse_date, type: datetime, source: system, default: null, description: "Date of most recent breeding soundness exam" }
      - { name: last_bse_result, type: enum, source: system, default: null, description: "PASSED | FAILED", constraints: "enum: PASSED, FAILED" }
      - { name: scrotal_cm, type: number, source: system, default: null, description: "Scrotal circumference at last BSE" }
      - { name: bse_status, type: enum, source: computed, description: "UNTESTED | PASSED | FAILED | EXPIRED; PASSED lapses to EXPIRED when current_date > last_bse_date + BSE_VALIDITY_DAYS (lazy recompute)", constraints: "enum: UNTESTED, PASSED, FAILED, EXPIRED" }
      - { name: life_status, type: enum, source: system, description: "ACTIVE | SOLD | CULLED | DEAD", constraints: "enum: ACTIVE, SOLD, CULLED, DEAD" }

  - name: BullTurnout
    parent: null
    common_fields: true
    fields:
      - { name: bull_id, type: string, source: input, description: "FK -> Bull.id" }
      - { name: breeding_season_id, type: string, source: input, description: "FK -> BreedingSeason.id" }
      - { name: ranch_id, type: string, source: input, description: "FK -> Ranch.id; must match bull.ranch_id and season.ranch_id" }
      - { name: turnout_date, type: datetime, source: input, description: "First day with cows (closed interval start); within season planned window" }
      - { name: planned_removal_date, type: datetime, source: input, description: "Last planned day with cows (closed interval end)" }
      - { name: actual_removal_date, type: datetime, source: system, default: null, description: "Set by remove" }
      - { name: turnout_status, type: enum, source: system, description: "SCHEDULED | TURNED_IN | REMOVED | CANCELLED", constraints: "enum: SCHEDULED, TURNED_IN, REMOVED, CANCELLED" }

  - name: PregCheck
    parent: null
    common_fields: true
    fields:
      - { name: breeding_season_id, type: string, source: input, description: "FK -> BreedingSeason.id; exactly one PregCheck per season" }
      - { name: ranch_id, type: string, source: input, description: "FK -> Ranch.id" }
      - { name: check_date, type: datetime, source: input, description: "Palpation/ultrasound date" }
      - { name: exposed_head_count, type: integer, source: system, description: "Snapshot of season.exposed_head_count at creation" }
      - { name: pregnant_count, type: integer, source: input, description: "Supplied at finalize" }
      - { name: open_count, type: integer, source: input, description: "Supplied at finalize" }
      - { name: dead_count, type: integer, source: input, description: "Supplied at finalize" }
      - { name: pregnancy_rate_pct, type: number, source: computed, description: "round1(100 x pregnant_count / exposed_head_count); null until finalize", default: null }
      - { name: check_status, type: enum, source: system, description: "DRAFT | FINALIZED", constraints: "enum: DRAFT, FINALIZED" }

  - name: CalfCrop
    parent: null
    common_fields: true
    fields:
      - { name: breeding_season_id, type: string, source: input, description: "FK -> BreedingSeason.id" }
      - { name: ranch_id, type: string, source: input, description: "FK -> Ranch.id" }
      - { name: crop_year, type: integer, source: input, description: "Calf crop year" }
      - { name: steer_head, type: integer, source: input, description: "Live steer calves at creation (branding count)" }
      - { name: heifer_head, type: integer, source: input, description: "Live heifer calves at creation" }
      - { name: weaning_date, type: datetime, source: input, description: "Set by record-weaning; must be <= current_date" }
      - { name: avg_wean_weight_lbs, type: number, source: input, description: "Set by record-weaning" }
      - { name: avg_wean_age_days, type: integer, source: input, description: "Set by record-weaning" }
      - { name: avg_birth_weight_lbs, type: number, source: input, description: "Set by record-weaning" }
      - { name: avg_dam_age_years, type: integer, source: input, description: "Set by record-weaning; drives dam-age adjustment variant" }
      - { name: adj205_age_only_lbs, type: number, source: computed, default: null, description: "Variant AGE_ONLY of adjusted_205d_weight" }
      - { name: adj205_dam_adjusted_lbs, type: number, source: computed, default: null, description: "Variant AGE_DAM of adjusted_205d_weight" }
      - { name: vaccine_round_1_date, type: datetime, source: system, default: null, description: "Set by record-vaccine round 1" }
      - { name: vaccine_round_2_date, type: datetime, source: system, default: null, description: "Set by record-vaccine round 2" }
      - { name: retained_heifer_head, type: integer, source: system, default: 0, description: "Heifers retained into a REPLACEMENT_HEIFER HerdGroup (net of unretain)" }
      - { name: death_loss_steer_head, type: integer, source: system, default: 0, description: "Steer death loss" }
      - { name: death_loss_heifer_head, type: integer, source: system, default: 0, description: "Heifer death loss" }
      - { name: marketed_steer_head, type: integer, source: system, default: 0, description: "Steers on SETTLED sale lots" }
      - { name: marketed_heifer_head, type: integer, source: system, default: 0, description: "Heifers on SETTLED sale lots" }
      - { name: reserved_steer_head, type: integer, source: computed, default: 0, description: "Steers on lots in OFFERED | CONTRACTED | DELIVERED | DISPUTED" }
      - { name: reserved_heifer_head, type: integer, source: computed, default: 0, description: "Heifers on lots in OFFERED | CONTRACTED | DELIVERED | DISPUTED" }
      - { name: available_steer_head, type: integer, source: computed, description: "steer_head - death_loss_steer_head - reserved_steer_head - marketed_steer_head" }
      - { name: available_heifer_head, type: integer, source: computed, description: "heifer_head - death_loss_heifer_head - reserved_heifer_head - marketed_heifer_head - retained_heifer_head" }
      - { name: wean_status, type: enum, source: system, description: "UNWEANED | WEANED (parallel axis 1)", constraints: "enum: UNWEANED, WEANED" }
      - { name: precon_status, type: enum, source: system, description: "NONE | ENROLLED | CERTIFIED (parallel axis 2)", constraints: "enum: NONE, ENROLLED, CERTIFIED" }
      - { name: lifecycle_status, type: enum, source: system, description: "ACTIVE | CLOSED; CLOSED auto when available_steer_head == 0 AND available_heifer_head == 0 AND no lot in DRAFT | OFFERED | CONTRACTED | DELIVERED | DISPUTED", constraints: "enum: ACTIVE, CLOSED" }

  - name: SaleLot
    parent: null
    common_fields: true
    fields:
      - { name: calf_crop_id, type: string, source: input, description: "FK -> CalfCrop.id" }
      - { name: ranch_id, type: string, source: input, description: "FK -> Ranch.id; must equal crop.ranch_id" }
      - { name: lot_class, type: enum, source: input, description: "STEER | HEIFER", constraints: "enum: STEER, HEIFER" }
      - { name: head_count, type: integer, source: input, description: "Head in this lot" }
      - { name: base_price_cents_per_cwt, type: number, source: input, description: "Base price at base_weight_lbs" }
      - { name: slide_cents_per_lb, type: number, source: input, description: "Price slide per lb of pay-weight deviation from base (signed both directions)" }
      - { name: base_weight_lbs, type: number, source: input, description: "Weight at which base price applies" }
      - { name: shrink_pct, type: number, source: input, description: "Shrink fraction (e.g., 0.04)" }
      - { name: precon_claim, type: enum, source: input, description: "NONE | ENROLLED | CERTIFIED; may not exceed crop.precon_status", constraints: "enum: NONE, ENROLLED, CERTIFIED" }
      - { name: freight_cents_per_head, type: integer, source: input, description: "Freight deduction per head" }
      - { name: commission_pct, type: number, source: input, description: "Commission fraction of gross (e.g., 0.03)" }
      - { name: buyer_name, type: string, source: input, description: "Set at contract" }
      - { name: delivered_avg_weight_lbs, type: number, source: input, description: "Set at deliver" }
      - { name: pay_weight_lbs, type: number, source: computed, default: null, description: "round2(delivered_avg_weight_lbs x (1 - shrink_pct))" }
      - { name: final_price_cents_per_cwt, type: number, source: computed, default: null, description: "Slide-adjusted price plus preconditioning premium, floor 100" }
      - { name: per_head_gross_cents, type: number, source: computed, default: null, description: "round2(final_price_cents_per_cwt x pay_weight_lbs / 100)" }
      - { name: gross_cents, type: number, source: computed, default: null, description: "per_head_gross_cents x head_count (per-head rounding THEN multiply — pinned order)" }
      - { name: commission_cents, type: number, source: computed, default: null, description: "round2(gross_cents x commission_pct)" }
      - { name: freight_cents, type: integer, source: computed, default: null, description: "head_count x freight_cents_per_head" }
      - { name: net_settlement_cents, type: number, source: computed, default: null, description: "gross_cents - commission_cents - freight_cents" }
      - { name: relist_count, type: integer, source: system, default: 0, description: "Times returned CONTRACTED -> OFFERED" }
      - { name: sold_by_user_id, type: string, source: system, description: "X-User-ID of creating SalesAgent (segregation anchor)" }
      - { name: settled_by_user_id, type: string, source: system, default: null, description: "X-User-ID of settling RanchManager" }
      - { name: lot_status, type: enum, source: system, description: "DRAFT | OFFERED | CONTRACTED | DELIVERED | DISPUTED | SETTLED | CANCELLED", constraints: "enum: DRAFT, OFFERED, CONTRACTED, DELIVERED, DISPUTED, SETTLED, CANCELLED" }

  - name: GrazingAssignment
    parent: null
    common_fields: true
    fields:
      - { name: pasture_id, type: string, source: input, description: "FK -> Pasture.id" }
      - { name: herd_group_id, type: string, source: input, description: "FK -> HerdGroup.id" }
      - { name: ranch_id, type: string, source: input, description: "FK -> Ranch.id; must match pasture.ranch_id and herd_group.ranch_id" }
      - { name: start_date, type: datetime, source: input, description: "Half-open grazing window start (inclusive)" }
      - { name: planned_end_date, type: datetime, source: input, description: "Half-open grazing window end (exclusive)" }
      - { name: grazing_days, type: integer, source: computed, description: "planned_end_date - start_date in days (half-open)" }
      - { name: au_factor, type: number, source: computed, description: "Snapshot of animal_unit_factor at creation (4 dp)" }
      - { name: daily_demand_aum, type: number, source: computed, description: "head_count x au_factor / DAYS_PER_AUM_MONTH (snapshot)" }
      - { name: reserved_aum, type: number, source: computed, description: "round2(daily_demand_aum x grazing_days)" }
      - { name: consumed_aum, type: number, source: computed, default: null, description: "round2(daily_demand_aum x actual grazing days); set at complete" }
      - { name: actual_end_date, type: datetime, source: system, default: null, description: "Set at complete; == planned_end_date => COMPLETED, earlier => SHORTENED" }
      - { name: assignment_status, type: enum, source: system, description: "ACTIVE | COMPLETED | SHORTENED | CANCELLED; ACTIVE from creation", constraints: "enum: ACTIVE, COMPLETED, SHORTENED, CANCELLED" }

  - name: SupplementProgram
    parent: null
    common_fields: true
    fields:
      - { name: herd_group_id, type: string, source: input, description: "FK -> HerdGroup.id" }
      - { name: ranch_id, type: string, source: input, description: "FK -> Ranch.id" }
      - { name: program_type, type: enum, source: input, description: "MINERAL | PROTEIN | ENERGY", constraints: "enum: MINERAL, PROTEIN, ENERGY" }
      - { name: start_date, type: datetime, source: input, description: "Feeding window start" }
      - { name: end_date, type: datetime, source: input, description: "Feeding window end (inclusive)" }
      - { name: feed_rate_oz_per_head_day, type: number, source: input, description: "Target intake" }
      - { name: cost_cents_per_ton, type: integer, source: input, description: "Delivered cost per ton" }
      - { name: delivered_lbs_total, type: number, source: system, default: 0, description: "Accumulated deliveries" }
      - { name: cost_to_date_cents, type: number, source: computed, default: 0, description: "round2(delivered_lbs_total / 2000 x cost_cents_per_ton)" }
      - { name: projected_consumption_lbs, type: number, source: computed, description: "round2(head_count x window days x feed_rate_oz_per_head_day / 16)" }
      - { name: program_status, type: enum, source: system, description: "ACTIVE | COMPLETED | CANCELLED; ACTIVE on creation", constraints: "enum: ACTIVE, COMPLETED, CANCELLED" }

  - name: DroughtAssessment
    parent: null
    common_fields: true
    fields:
      - { name: ranch_id, type: string, source: input, description: "FK -> Ranch.id" }
      - { name: assessment_date, type: datetime, source: input, description: "Field assessment date; DestockOrder deadline anchors here" }
      - { name: pasture_measurements, type: array, source: input, description: "[{ pasture_id, production_pct_of_normal }] — must cover every pasture of the ranch with closed_flag == false exactly once" }
      - { name: ranch_production_pct, type: number, source: computed, description: "Capacity-weighted production pct (1 dp)" }
      - { name: monthly_supply_aum, type: number, source: computed, description: "Sum(base x factor(resulting_posture)) / SEASON_MONTHS over non-CLOSED pastures (2 dp)" }
      - { name: monthly_demand_aum, type: number, source: computed, description: "Sum(head x AU) over HerdGroups with group_status != LIQUIDATED (2 dp)" }
      - { name: deficit_aum_per_30d, type: number, source: computed, description: "round2(monthly_demand_aum - monthly_supply_aum)" }
      - { name: resulting_posture, type: enum, source: computed, description: "Threshold mapping of ranch_production_pct", constraints: "enum: NORMAL, WATCH, ALERT, CRITICAL" }
      - { name: assessment_status, type: enum, source: system, description: "DRAFT | FINALIZED", constraints: "enum: DRAFT, FINALIZED" }

  - name: DestockOrder
    parent: null
    common_fields: true
    fields:
      - { name: ranch_id, type: string, source: system, description: "FK -> Ranch.id" }
      - { name: drought_assessment_id, type: string, source: system, description: "FK -> DroughtAssessment.id that created this order" }
      - { name: required_reduction_head, type: integer, source: computed, description: "Single-pass class-priority allocation from destock_required_reduction" }
      - { name: received_reduction_head, type: integer, source: system, default: 0, description: "Sum of HerdGroup reductions referencing this order while OPEN | EXPIRED" }
      - { name: deadline_date, type: datetime, source: computed, description: "assessment.assessment_date + ranch.destock_grace_days" }
      - { name: waiver_note, type: string, source: input, default: null, description: "Required at waive" }
      - { name: order_status, type: enum, source: system, description: "OPEN | COMPLIANT | WAIVED | EXPIRED", constraints: "enum: OPEN, COMPLIANT, WAIVED, EXPIRED" }

# =============================================================================
# §1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: Ranch
    field: drought_posture
    initial_state: NORMAL
    terminal_states: []
    transitions:
      - from: [NORMAL, WATCH, ALERT, CRITICAL]
        to: NORMAL
        trigger: "POST /api/drought-assessments/{id}/finalize when resulting_posture == NORMAL"
        actor: system
        preconditions: ["assessment DRAFT", "expected_ranch_version == ranch.version"]
        side_effects:
          - "ranch.drought_posture <- NORMAL; ranch.ranch_production_pct and assessment_seq updated; ranch.version increments"
      - from: [NORMAL, WATCH, ALERT, CRITICAL]
        to: WATCH
        trigger: "POST /api/drought-assessments/{id}/finalize when resulting_posture == WATCH"
        actor: system
        preconditions: ["assessment DRAFT", "expected_ranch_version == ranch.version"]
        side_effects: ["same field updates as NORMAL"]
      - from: [NORMAL, WATCH, ALERT, CRITICAL]
        to: ALERT
        trigger: "POST /api/drought-assessments/{id}/finalize when resulting_posture == ALERT"
        actor: system
        preconditions: ["assessment DRAFT", "expected_ranch_version == ranch.version"]
        side_effects:
          - "ranch.drought_posture <- ALERT"
          - "if deficit_aum_per_30d > 0: create DestockOrder (OPEN) — this posture mutation is the cause of the order"
          - "order creation flips every HerdGroup with group_status == ACTIVE on the ranch to DESTOCKING"
      - from: [NORMAL, WATCH, ALERT, CRITICAL]
        to: CRITICAL
        trigger: "POST /api/drought-assessments/{id}/finalize when resulting_posture == CRITICAL"
        actor: system
        preconditions: ["assessment DRAFT", "expected_ranch_version == ranch.version"]
        side_effects:
          - "ranch.drought_posture <- CRITICAL"
          - "if deficit_aum_per_30d > 0: create DestockOrder (OPEN)"
          - "order creation flips every ACTIVE HerdGroup to DESTOCKING"

  - entity: Pasture
    field: condition_status
    initial_state: GRAZEABLE
    terminal_states: [CLOSED]
    transitions:
      - from: GRAZEABLE
        to: RESTING
        trigger: "system (an assignment on this pasture completes: POST /api/grazing-assignments/{id}/complete)"
        actor: system
        preconditions: []
        side_effects: ["resting_until <- assignment.actual_end_date + min_rest_days"]
      - from: RESTING
        to: GRAZEABLE
        trigger: "system (lazy: recomputed on read/mutation when current_date >= resting_until)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [GRAZEABLE, RESTING]
        to: CLOSED
        trigger: "POST /api/pastures/{id}/close"
        actor: RangeManager
        preconditions: ["no assignment with assignment_status == ACTIVE on this pasture"]
        side_effects: ["closed_flag <- true"]

  - entity: GrazingLease
    field: lease_status
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/grazing-leases/{id}/activate"
        actor: RangeManager
        preconditions:
          - "pasture.tenure == LEASED and pasture.condition_status != CLOSED"
          - "sum of aum_allotment over ACTIVE leases on this pasture, including this one, <= pasture.base_capacity_aum (aggregate-capacity semantics; overlapping lease windows allowed)"
        side_effects: ["lease.version increments"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/grazing-leases/{id}/suspend"
        actor: RangeManager
        preconditions: []
        side_effects: ["lease.version increments"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/grazing-leases/{id}/reinstate"
        actor: RangeManager
        preconditions:
          - "sum of aum_allotment over ACTIVE leases on this pasture, including this one, <= pasture.base_capacity_aum"
        side_effects: ["lease.version increments"]
        note: "ACTIVE -> SUSPENDED -> ACTIVE cycle is unrestricted in count (cycle shape)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (lazy: recomputed on read/mutation when current_date > end_date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [DRAFT, ACTIVE, SUSPENDED]
        to: TERMINATED
        trigger: "POST /api/grazing-leases/{id}/terminate"
        actor: RanchManager
        preconditions: ["no LeaseStatement for this lease in DRAFT or ISSUED"]
        side_effects: ["lease.version increments"]

  - entity: LeaseStatement
    field: statement_status
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /api/lease-statements/{id}/issue"
        actor: RangeManager
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: APPROVED
        trigger: "POST /api/lease-statements/{id}/approve"
        actor: RanchManager
        preconditions: ["X-User-ID != statement.recorded_by_user_id (segregation of duties)"]
        side_effects: ["approved_by_user_id <- X-User-ID"]
      - from: APPROVED
        to: PAID
        trigger: "POST /api/lease-statements/{id}/mark-paid"
        actor: RanchManager
        preconditions: []
        side_effects: []

  - entity: HerdGroup
    field: group_status
    initial_state: ACTIVE
    terminal_states: [LIQUIDATED]
    transitions:
      - from: ACTIVE
        to: DESTOCKING
        trigger: "system (a DestockOrder is created for this ranch by assessment finalize)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DESTOCKING
        to: ACTIVE
        trigger: "system (all covering DestockOrders reach COMPLIANT or WAIVED)"
        actor: system
        preconditions: []
        side_effects: []
        note: "ACTIVE <-> DESTOCKING cycle may repeat across assessments"
      - from: [ACTIVE, DESTOCKING]
        to: LIQUIDATED
        trigger: "POST /api/herd-groups/{id}/reductions with reason == LIQUIDATION (requires head_count == current head_count)"
        actor: HerdManager
        preconditions: []
        side_effects: ["head_count <- 0", "group excluded from destock demand calculations"]

  - entity: BreedingSeason
    field: season_status
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: BREEDING
        trigger: "POST /api/breeding-seasons/{id}/begin-breeding"
        actor: HerdManager
        preconditions:
          - "count of BullTurnouts with breeding_season_id == season.id, turnout_status == TURNED_IN, bull.life_status == ACTIVE, and bull.bse_status == PASSED (after lazy BSE expiry at current_date) >= season.required_bull_count"
        side_effects: []
      - from: BREEDING
        to: GESTATION
        trigger: "POST /api/breeding-seasons/{id}/end-breeding"
        actor: HerdManager
        preconditions: ["no BullTurnout for this season with turnout_status == TURNED_IN (all REMOVED or CANCELLED)"]
        side_effects: []
      - from: GESTATION
        to: PREG_CHECK
        trigger: "system (POST /api/preg-checks creates the season's PregCheck)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PREG_CHECK
        to: CLOSED
        trigger: "system (the season's PregCheck is finalized)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Bull
    field: bse_status
    initial_state: UNTESTED
    terminal_states: []
    transitions:
      - from: UNTESTED
        to: PASSED
        trigger: "POST /api/bulls/{id}/record-bse with result == PASSED"
        actor: HerdManager
        preconditions: ["life_status == ACTIVE"]
        side_effects: ["last_bse_date, last_bse_result, scrotal_cm recorded"]
      - from: [UNTESTED, PASSED, FAILED, EXPIRED]
        to: FAILED
        trigger: "POST /api/bulls/{id}/record-bse with result == FAILED"
        actor: HerdManager
        preconditions: ["life_status == ACTIVE"]
        side_effects: ["last_bse_date, last_bse_result, scrotal_cm recorded"]
      - from: [FAILED, EXPIRED, PASSED]
        to: PASSED
        trigger: "POST /api/bulls/{id}/record-bse with result == PASSED (retest — cyclic)"
        actor: HerdManager
        preconditions: ["life_status == ACTIVE"]
        side_effects: ["last_bse_date, last_bse_result, scrotal_cm recorded"]
      - from: PASSED
        to: EXPIRED
        trigger: "system (lazy: current_date > last_bse_date + BSE_VALIDITY_DAYS, recomputed on read and on battery evaluation)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Bull
    field: life_status
    initial_state: ACTIVE
    terminal_states: [SOLD, CULLED, DEAD]
    transitions:
      - from: ACTIVE
        to: SOLD
        trigger: "POST /api/bulls/{id}/retire with disposition == SOLD"
        actor: HerdManager
        preconditions: ["no BullTurnout for this bull with turnout_status IN {SCHEDULED, TURNED_IN}"]
        side_effects: []
      - from: ACTIVE
        to: CULLED
        trigger: "POST /api/bulls/{id}/retire with disposition == CULLED"
        actor: HerdManager
        preconditions: ["no BullTurnout for this bull with turnout_status IN {SCHEDULED, TURNED_IN}"]
        side_effects: []
      - from: ACTIVE
        to: DEAD
        trigger: "POST /api/bulls/{id}/retire with disposition == DEAD"
        actor: HerdManager
        preconditions: ["no BullTurnout for this bull with turnout_status IN {SCHEDULED, TURNED_IN}"]
        side_effects: []

  - entity: BullTurnout
    field: turnout_status
    initial_state: SCHEDULED
    terminal_states: [REMOVED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: TURNED_IN
        trigger: "POST /api/bull-turnouts/{id}/turn-in"
        actor: HerdManager
        preconditions: ["season.season_status == PLANNED or BREEDING"]
        side_effects: []
      - from: TURNED_IN
        to: REMOVED
        trigger: "POST /api/bull-turnouts/{id}/remove"
        actor: HerdManager
        preconditions: []
        side_effects: ["actual_removal_date <- input removal_date"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/bull-turnouts/{id}/cancel"
        actor: HerdManager
        preconditions: []
        side_effects: []

  - entity: PregCheck
    field: check_status
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /api/preg-checks/{id}/finalize"
        actor: HerdManager
        preconditions: ["pregnant_count + open_count + dead_count == exposed_head_count"]
        side_effects:
          - "pregnancy_rate_pct computed"
          - "season.herd_group.marked_open_head += open_count"
          - "season.season_status PREG_CHECK -> CLOSED"

  - entity: CalfCrop
    field: wean_status
    initial_state: UNWEANED
    terminal_states: []
    transitions:
      - from: UNWEANED
        to: WEANED
        trigger: "POST /api/calf-crops/{id}/record-weaning"
        actor: HerdManager
        preconditions: ["weaning_date <= current_date"]
        side_effects: ["adj205_age_only_lbs and adj205_dam_adjusted_lbs computed (both variants)"]

  - entity: CalfCrop
    field: precon_status
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: ENROLLED
        trigger: "POST /api/calf-crops/{id}/enroll-preconditioning"
        actor: HerdManager
        preconditions: []
        side_effects: []
        note: "Independent of wean_status: enrollment allowed while UNWEANED (parallel axes)"
      - from: ENROLLED
        to: CERTIFIED
        trigger: "POST /api/calf-crops/{id}/certify-preconditioning"
        actor: HerdManager
        preconditions:
          - "wean_status == WEANED"
          - "current_date - weaning_date >= PRECON_MIN_WEAN_DAYS (45; exactly 45 qualifies)"
          - "vaccine_round_1_date and vaccine_round_2_date set (spacing enforced at record-vaccine)"
        side_effects: []

  - entity: CalfCrop
    field: lifecycle_status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "system (bubble-up after any settle / retain-heifers / unretain-heifers / record-death-loss / lot cancel)"
        actor: system
        preconditions: ["available_steer_head == 0 AND available_heifer_head == 0 AND no SaleLot of this crop in DRAFT | OFFERED | CONTRACTED | DELIVERED | DISPUTED"]
        side_effects: ["new SaleLot creation for this crop is rejected once CLOSED"]

  - entity: SaleLot
    field: lot_status
    initial_state: DRAFT
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OFFERED
        trigger: "POST /api/sale-lots/{id}/offer"
        actor: SalesAgent
        preconditions: ["crop.lifecycle_status == ACTIVE", "available head of lot_class >= head_count"]
        side_effects: ["crop.reserved_<class>_head += head_count"]
      - from: OFFERED
        to: CONTRACTED
        trigger: "POST /api/sale-lots/{id}/contract"
        actor: SalesAgent
        preconditions: []
        side_effects: ["buyer_name recorded"]
      - from: CONTRACTED
        to: OFFERED
        trigger: "POST /api/sale-lots/{id}/relist (buyer default)"
        actor: SalesAgent
        preconditions: []
        side_effects: ["relist_count += 1", "buyer_name cleared"]
        note: "OFFERED <-> CONTRACTED cycle is unrestricted in count"
      - from: CONTRACTED
        to: DELIVERED
        trigger: "POST /api/sale-lots/{id}/deliver"
        actor: SalesAgent
        preconditions: []
        side_effects: ["sale_lot_settlement computed: pay_weight_lbs, final_price_cents_per_cwt, per_head_gross_cents, gross_cents, commission_cents, freight_cents, net_settlement_cents"]
      - from: DELIVERED
        to: DISPUTED
        trigger: "POST /api/sale-lots/{id}/dispute"
        actor: SalesAgent
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: DELIVERED
        trigger: "POST /api/sale-lots/{id}/resolve-dispute"
        actor: SalesAgent
        preconditions: []
        side_effects: ["if adjusted_delivered_weight_lbs supplied, delivered_avg_weight_lbs updated and settlement recomputed"]
      - from: DELIVERED
        to: SETTLED
        trigger: "POST /api/sale-lots/{id}/settle"
        actor: RanchManager
        preconditions: ["X-User-ID != lot.sold_by_user_id (segregation of duties)"]
        side_effects:
          - "settled_by_user_id <- X-User-ID"
          - "crop.reserved_<class>_head -= head_count; crop.marketed_<class>_head += head_count (mutation 1)"
          - "that marketed-head mutation re-evaluates the crop closure predicate; if fully accounted, crop.lifecycle_status -> CLOSED (mutation 2, caused by mutation 1)"
      - from: [DRAFT, OFFERED]
        to: CANCELLED
        trigger: "POST /api/sale-lots/{id}/cancel"
        actor: SalesAgent
        preconditions: []
        side_effects: ["if was OFFERED: crop.reserved_<class>_head -= head_count; crop closure predicate re-evaluated"]

  - entity: GrazingAssignment
    field: assignment_status
    initial_state: ACTIVE
    terminal_states: [COMPLETED, SHORTENED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /api/grazing-assignments/{id}/complete with actual_end_date == planned_end_date"
        actor: RangeManager
        preconditions: ["start_date <= actual_end_date", "actual_end_date <= current_date"]
        side_effects:
          - "consumed_aum <- round2(daily_demand_aum x (actual_end_date - start_date days)); pasture.committed_aum -= reserved_aum"
          - "pasture.resting_until <- actual_end_date + pasture.min_rest_days (pasture -> RESTING)"
      - from: ACTIVE
        to: SHORTENED
        trigger: "POST /api/grazing-assignments/{id}/complete with actual_end_date < planned_end_date (early-out, e.g., drought)"
        actor: RangeManager
        preconditions: ["start_date <= actual_end_date", "actual_end_date <= current_date"]
        side_effects:
          - "consumed_aum <- round2(daily_demand_aum x days grazed); pasture.committed_aum -= reserved_aum (the unused portion returns to available_aum)"
          - "pasture.resting_until <- actual_end_date + min_rest_days"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /api/grazing-assignments/{id}/cancel"
        actor: RangeManager
        preconditions: ["current_date < start_date (has not begun)"]
        side_effects: ["pasture.committed_aum -= reserved_aum; consumed_aum <- 0"]

  - entity: SupplementProgram
    field: program_status
    initial_state: ACTIVE
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /api/supplement-programs/{id}/complete"
        actor: HerdManager
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /api/supplement-programs/{id}/cancel"
        actor: HerdManager
        preconditions: []
        side_effects: []

  - entity: DroughtAssessment
    field: assessment_status
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /api/drought-assessments/{id}/finalize"
        actor: RangeManager
        preconditions: ["expected_ranch_version == ranch.version (OCC)"]
        side_effects:
          - "ranch.drought_posture <- resulting_posture; ranch.ranch_production_pct <- assessment value; ranch.assessment_seq += 1; ranch.version += 1"
          - "if deficit_aum_per_30d > 0 (strictly): create DestockOrder (OPEN, required_reduction_head per destock_required_reduction)"
          - "the new DestockOrder flips every HerdGroup with group_status == ACTIVE on the ranch to DESTOCKING"

  - entity: DestockOrder
    field: order_status
    initial_state: OPEN
    terminal_states: [COMPLIANT, WAIVED, EXPIRED]
    transitions:
      - from: [OPEN, EXPIRED]
        to: COMPLIANT
        trigger: "POST /api/destock-orders/{id}/verify-compliance when received_reduction_head >= required_reduction_head"
        actor: RangeManager
        preconditions: []
        side_effects: ["every HerdGroup on the ranch with group_status == DESTOCKING returns to ACTIVE"]
      - from: OPEN
        to: EXPIRED
        trigger: "POST /api/destock-orders/{id}/verify-compliance when received_reduction_head < required_reduction_head AND current_date > deadline_date"
        actor: RangeManager
        preconditions: []
        side_effects: ["order remains blocking (OPEN and EXPIRED both block new grazing commitments)"]
      - from: [OPEN, EXPIRED]
        to: WAIVED
        trigger: "POST /api/destock-orders/{id}/waive"
        actor: RanchManager
        preconditions: ["waiver_note non-empty"]
        side_effects: ["every HerdGroup on the ranch with group_status == DESTOCKING returns to ACTIVE"]

# =============================================================================
# §1.2.1: Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: lease-amend-stale-version
    parent_entity: GrazingLease
    write_endpoint: "PATCH /api/grazing-leases/{id}"
    occ_field: expected_lease_version
    description: |
      Amending a GrazingLease whose version has advanced since the client last
      observed it is rejected. Both amendments are individually legitimate under
      product semantics (terms may be amended in DRAFT, ACTIVE, or SUSPENDED),
      so the system resolves the stale write with OCC: the request must carry
      the version the client last read.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: assessment-finalize-stale-ranch
    parent_entity: Ranch
    write_endpoint: "POST /api/drought-assessments/{id}/finalize"
    occ_field: expected_ranch_version
    description: |
      Finalizing a DroughtAssessment against a Ranch whose version has advanced
      since the client last observed it is rejected. Finalization supersedes the
      ranch posture wholesale; a newer finalized assessment (or any other ranch
      mutation) makes the caller's view stale, and the finalize must be
      re-based on the fresh version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3: Calculation Rules Table
# Rounding convention: round_half_up. Money in cents carried at 2 decimals.
# =============================================================================
calculations:
  - name: animal_unit_factor
    trigger: "GrazingAssignment creation; DroughtAssessment demand computation"
    algorithm: aggregation
    formula: |
      AU = round4( BASE_AU[animal_class] x (1 + max(0, avg_weight_lbs - REF_WEIGHT_LBS) / REF_WEIGHT_LBS x WEIGHT_AU_COEF) )
    input_set: "HerdGroup.animal_class, HerdGroup.avg_weight_lbs (snapshot at call time)"
    constants:
      REF_WEIGHT_LBS: 1000
      WEIGHT_AU_COEF: 0.30
      BASE_AU_MATURE_COW: 1.00
      BASE_AU_REPLACEMENT_HEIFER: 0.70
      BASE_AU_GROWING: 0.75
    precision: "4 decimal places, round_half_up"

  - name: grazing_aum_demand
    trigger: "GrazingAssignment creation (reserved_aum), completion (consumed_aum)"
    algorithm: aggregation
    formula: |
      daily_demand_aum = head_count x AU / DAYS_PER_AUM_MONTH      # not rounded
      grazing_days     = planned_end_date - start_date in days     # half-open window
      reserved_aum     = round2(daily_demand_aum x grazing_days)
      consumed_aum     = round2(daily_demand_aum x actual_days)    # actual_days = actual_end_date - start_date
    input_set: "assignment head_count snapshot = herd_group.head_count at creation; au_factor snapshot"
    constants:
      DAYS_PER_AUM_MONTH: 30
    precision: "2 decimal places on reserved/consumed, round_half_up"
    note: "Mode (a) combinatorial: class-conditional base, max(0,...) weight branch, day scaling — 3+ inputs with non-linear interaction"

  - name: effective_pasture_capacity
    trigger: "any Pasture read or mutation; assignment budget check"
    algorithm: threshold
    formula: |
      effective_capacity_aum = round2(base_capacity_aum x POSTURE_FACTOR[ranch.drought_posture])
      committed_aum          = sum(reserved_aum) over GrazingAssignments of this pasture with assignment_status == ACTIVE
      consumed_total_aum     = sum(consumed_aum) over GrazingAssignments of this pasture with assignment_status IN {COMPLETED, SHORTENED}
      available_aum          = effective_capacity_aum - committed_aum - consumed_total_aum
    input_set: "assignments with assignment_status == ACTIVE only (COMPLETED, SHORTENED, CANCELLED excluded)"
    constants:
      POSTURE_FACTOR_NORMAL: 1.00
      POSTURE_FACTOR_WATCH: 0.85
      POSTURE_FACTOR_ALERT: 0.70
      POSTURE_FACTOR_CRITICAL: 0.50
    precision: "2 decimal places, round_half_up"

  - name: ranch_production_pct_and_posture
    trigger: "DroughtAssessment creation (preview) and finalize (persisted to ranch)"
    algorithm: weighted_scoring
    formula: |
      ranch_production_pct = round1( sum(base_capacity_aum x production_pct_of_normal) / sum(base_capacity_aum) )
        over pastures with closed_flag == false (every such pasture MUST appear in pasture_measurements exactly once)
      resulting_posture: pct >= 90 -> NORMAL; 75 <= pct < 90 -> WATCH; 55 <= pct < 75 -> ALERT; pct < 55 -> CRITICAL
    input_set: "pasture_measurements covering all non-CLOSED pastures"
    constants:
      THRESHOLD_WATCH: 90
      THRESHOLD_ALERT: 75
      THRESHOLD_CRITICAL: 55
    precision: "1 decimal place, round_half_up"

  - name: destock_required_reduction
    trigger: "DroughtAssessment finalize when deficit_aum_per_30d > 0 (strictly greater)"
    algorithm: constraint_propagation
    formula: |
      monthly_supply_aum = round2( sum(base_capacity_aum x POSTURE_FACTOR[resulting_posture]) / SEASON_MONTHS )
        over pastures with closed_flag == false
      monthly_demand_aum = round2( sum(head_count x animal_unit_factor(class, avg_weight_lbs)) )
        over HerdGroups of the ranch with group_status != LIQUIDATED
      deficit = monthly_demand_aum - monthly_supply_aum
      # Single left-to-right pass, NO re-iteration (pinned evaluation order):
      #   candidate groups sorted by (1) class priority GROWING first, then MATURE_COW,
      #   then REPLACEMENT_HEIFER; (2) within class avg_weight_lbs DESC;
      #   (3) ties broken by HerdGroup.created_at ASC.
      #   per-head monthly AUM for a group = animal_unit_factor of that group.
      #   For each group in that order, while deficit > 0:
      #     removable = min(group.head_count, ceil(deficit / per_head_aum))
      #     required += removable; deficit -= removable x per_head_aum
      # required_reduction_head = total removable across the single pass.
    input_set: "all non-LIQUIDATED HerdGroups of the ranch"
    constants:
      SEASON_MONTHS: 5
    precision: "AUM at 2 decimal places, round_half_up; head counts integer via ceil"
    note: "Mode (c) combinatorial: deficit depends on demand which depends on head; removing head changes demand — pinned single-pass order makes it well-defined"

  - name: lease_usage_measurement
    trigger: "LeaseStatement creation (snapshot)"
    algorithm: aggregation
    formula: |
      period window = [period_year-01-01, (period_year+1)-01-01)  # half-open
      for each GrazingAssignment with pasture_id == lease.pasture_id
        AND assignment_status IN {COMPLETED, SHORTENED}:
          days_in = overlap days of [start_date, actual_end_date) with period window
          contribution = round2(assignment.daily_demand_aum x days_in)
      actual_aum_used = round2(sum of contributions)
    input_set: "COMPLETED | SHORTENED assignments only; ACTIVE and CANCELLED assignments are EXCLUDED"
    precision: "2 decimal places, round_half_up"

  - name: lease_settlement_charge
    trigger: "LeaseStatement creation"
    algorithm: tiered_pricing
    formula: |
      overage_aum = max(0, actual_aum_used - aum_allotment)
      overage_charge_cents = round2( min(overage_aum, overage_tier1_cap_aum) x overage_tier1_rate_cents
                                     + max(0, overage_aum - overage_tier1_cap_aum) x overage_tier2_rate_cents )
      Variant ALLOTMENT:  base_charge_cents = aum_allotment x rate_per_aum_cents
      Variant ACTUAL_USE: base_charge_cents = round2( max(actual_aum_used, minimum_commit_aum) x rate_per_aum_cents )
      total_due_cents = base_charge_cents + overage_charge_cents
    input_set: "lease terms + actual_aum_used snapshot"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: ALLOTMENT
        when: "lease.settlement_basis == ALLOTMENT (full take-or-pay on allotment)"
        difference: "base charge ignores actual usage: allotment x rate even when actual_aum_used < allotment"
      - name: ACTUAL_USE
        when: "lease.settlement_basis == ACTUAL_USE"
        difference: "base charge = max(actual_aum_used, minimum_commit_aum) x rate; identical usage below allotment yields a LOWER total than ALLOTMENT"

  - name: adjusted_205d_weight
    trigger: "POST /api/calf-crops/{id}/record-weaning (both variants computed and stored)"
    algorithm: forward_looking
    formula: |
      Variant AGE_ONLY:
        adj205_age_only_lbs = round1( (avg_wean_weight_lbs - avg_birth_weight_lbs) / avg_wean_age_days x 205 + avg_birth_weight_lbs )
      Variant AGE_DAM:
        adj205_dam_adjusted_lbs = round1( AGE_ONLY + DAM_ADJ_LBS[avg_dam_age_years] )
    input_set: "CalfCrop weaning fields"
    constants:
      DAM_ADJ_DAM_2YR: 54
      DAM_ADJ_DAM_3YR: 20
      DAM_ADJ_DAM_4_TO_10: 0
      DAM_ADJ_DAM_11_PLUS: 20
    precision: "1 decimal place, round_half_up"
    variants:
      - name: AGE_ONLY
        when: "reported for within-crop comparisons"
        difference: "no dam-age adjustment"
      - name: AGE_DAM
        when: "used for preconditioning marketing claims"
        difference: "adds DAM_ADJ_LBS (54 for 2-year-old dams, 20 for 3-year-old or >=11-year-old dams, 0 for 4-10); for a 2-year-old-dam crop the two variants diverge by exactly +54.0 lbs"

  - name: sale_lot_settlement
    trigger: "POST /api/sale-lots/{id}/deliver; re-run by resolve-dispute when adjusted weight supplied"
    algorithm: tiered_pricing
    formula: |
      pay_weight_lbs            = round2( delivered_avg_weight_lbs x (1 - shrink_pct) )
      slid_price                = base_price_cents_per_cwt + (base_weight_lbs - pay_weight_lbs) x slide_cents_per_lb
                                  # signed BOTH directions: lighter pay weight raises price, heavier lowers it
      premium                   = PREMIUM[precon_claim]      # added AFTER the slide (pinned order)
      final_price_cents_per_cwt = round2( max(100, slid_price) + premium )
      per_head_gross_cents      = round2( final_price_cents_per_cwt x pay_weight_lbs / 100 )
      gross_cents               = per_head_gross_cents x head_count      # round per head THEN multiply (pinned order)
      commission_cents          = round2( gross_cents x commission_pct )
      freight_cents             = head_count x freight_cents_per_head
      net_settlement_cents      = gross_cents - commission_cents - freight_cents
    input_set: "lot terms + delivered_avg_weight_lbs"
    constants:
      PREMIUM_NONE: 0
      PREMIUM_ENROLLED: 250
      PREMIUM_CERTIFIED: 600
      MIN_PRICE_CENTS_PER_CWT: 100
    precision: "2 decimal places, round_half_up"
    note: "Mode (b) combinatorial: nested rounding — round-per-head-then-multiply vs lot-weight-x-price diverge by cents; the scaffold pins round-per-head-first"

  - name: pregnancy_rate
    trigger: "POST /api/preg-checks/{id}/finalize"
    algorithm: aggregation
    formula: |
      pregnancy_rate_pct = round1( 100 x pregnant_count / exposed_head_count )
    input_set: "finalized counts; accounting identity pregnant + open + dead == exposed enforced at validation"
    precision: "1 decimal place, round_half_up"

  - name: supplement_costs
    trigger: "program creation (projection); each delivery (cost_to_date)"
    algorithm: aggregation
    formula: |
      projected_consumption_lbs = round2( herd_group.head_count x (end_date - start_date days + 1) x feed_rate_oz_per_head_day / 16 )
      cost_to_date_cents        = round2( delivered_lbs_total / 2000 x cost_cents_per_ton )
    input_set: "deliveries while program_status == ACTIVE"
    precision: "2 decimal places, round_half_up"

# =============================================================================
# §1.4: Validation Rules Table (ordered by priority — first failure wins)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present; X-User-Role names a declared role", error_id: ERR_MISSING_OR_INVALID_CONTEXT_HEADER, http_status: 400, applies_to: "all endpoints" }
  - { priority: 2, category: auth, check: "Role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all endpoints" }
  - { priority: 3, category: auth, check: "Segregation of duties: statement approver X-User-ID != recorded_by_user_id; lot settler X-User-ID != sold_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /api/lease-statements/{id}/approve, POST /api/sale-lots/{id}/settle" }
  - { priority: 4, category: existence, check: "Path ids exist, validated left-to-right; FK ids in body exist and belong to the same ranch", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all resource endpoints" }
  - { priority: 5, category: existence, check: "Request body well-formed: required fields present, enum members valid, no computed/system/unknown fields supplied", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all mutating endpoints" }
  - { priority: 6, category: state, check: "Transition valid for current state (generic); terminal resources reject all mutations", error_id: ERR_INVALID_STATE_TRANSITION, http_status: 400, applies_to: "transition endpoints (non-terminal mismatch)" }
  - { priority: 7, category: state, check: "Resource already in a terminal state", error_id: ERR_ALREADY_TERMINAL, http_status: 400, applies_to: "transition endpoints on terminal-state resources" }
  - { priority: 8, category: state, check: "Specific state gates: pasture not CLOSED; covering lease ACTIVE; season GESTATION for preg check; crop WEANED for lot creation; crop ENROLLED for certify", error_id: "ERR_PASTURE_NOT_GRAZEABLE | ERR_LEASE_NOT_ACTIVE | ERR_SEASON_NOT_IN_GESTATION | ERR_CROP_NOT_WEANED | ERR_PRECON_NOT_ENROLLED", http_status: 400, applies_to: "assignment create; statement create; preg-check create; sale-lot create; certify" }
  - { priority: 9, category: state, check: "OCC: expected_<parent>_version equals current parent version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PATCH /api/grazing-leases/{id}, POST /api/drought-assessments/{id}/finalize" }
  - { priority: 10, category: business_safety, check: "Drought gates on new grazing commitments, checked in pinned sub-order: (10a) any DestockOrder in OPEN | EXPIRED on the ranch blocks; then (10b) ranch.drought_posture in {ALERT, CRITICAL} blocks", error_id: "ERR_DESTOCK_ORDER_BLOCKING | ERR_DROUGHT_POSTURE_BLOCKS_COMMITMENT", http_status: 422, applies_to: "POST /api/grazing-assignments" }
  - { priority: 11, category: business_safety, check: "Bull battery: qualified TURNED_IN bulls >= required_bull_count", error_id: ERR_BULL_BATTERY_INSUFFICIENT, http_status: 422, applies_to: "POST /api/breeding-seasons/{id}/begin-breeding" }
  - { priority: 12, category: business_temporal, check: "Half-open window overlap on pasture vs ACTIVE assignments ([s,e) intersect), then min_rest_days buffer vs ALL non-CANCELLED assignments both directions (uses actual_end_date for COMPLETED|SHORTENED, planned_end_date for ACTIVE); overlap checked before rest", error_id: "ERR_PASTURE_WINDOW_OVERLAP | ERR_PASTURE_REST_VIOLATION", http_status: 409, applies_to: "POST /api/grazing-assignments" }
  - { priority: 13, category: business_temporal, check: "Closed-interval bull turnout overlap vs SCHEDULED|TURNED_IN turnouts of the same bull ([t,r] inclusive intersect), then MIN_BULL_TURNAROUND_DAYS (7) gap vs any non-CANCELLED turnout of that bull (uses actual_removal_date when REMOVED, else planned_removal_date); overlap checked before turnaround", error_id: "ERR_BULL_TURNOUT_OVERLAP | ERR_BULL_TURNAROUND_TOO_SHORT", http_status: 409, applies_to: "POST /api/bull-turnouts" }
  - { priority: 14, category: business_temporal, check: "Windows nested: assignment inside covering lease window; turnout inside season planned window", error_id: "ERR_ASSIGNMENT_OUTSIDE_LEASE_WINDOW | ERR_TURNOUT_OUTSIDE_SEASON_WINDOW", http_status: 422, applies_to: "POST /api/grazing-assignments, POST /api/bull-turnouts" }
  - { priority: 15, category: business_constraint, check: "Lease aggregate capacity: sum of aum_allotment over ACTIVE leases on the pasture (incl. candidate) <= pasture.base_capacity_aum", error_id: ERR_LEASE_CAPACITY_EXCEEDED, http_status: 422, applies_to: "lease activate / reinstate" }
  - { priority: 16, category: business_constraint, check: "Amendment floor: new aum_allotment >= max actual_aum_used over non-DRAFT statements of the lease", error_id: ERR_ALLOTMENT_BELOW_RECORDED_USAGE, http_status: 422, applies_to: "PATCH /api/grazing-leases/{id}" }
  - { priority: 17, category: business_constraint, check: "Uniqueness: one PregCheck per season; one LeaseStatement per (lease, period_year)", error_id: "ERR_PREG_CHECK_ALREADY_EXISTS | ERR_DUPLICATE_STATEMENT_PERIOD", http_status: 409, applies_to: "preg-check create; statement create" }
  - { priority: 18, category: business_constraint, check: "Accounting identities and bounds: preg counts sum to exposed; exposure <= group head; reduction <= group head (LIQUIDATION must equal it); retention <= available heifers and target class REPLACEMENT_HEIFER; vaccine round spacing >= 14 days; assessment measurements complete", error_id: "ERR_PREG_COUNT_MISMATCH | ERR_EXPOSURE_EXCEEDS_GROUP | ERR_DESTOCK_REDUCTION_EXCEEDS_HEAD | ERR_RETENTION_EXCEEDS_AVAILABLE | ERR_RETENTION_CLASS_MISMATCH | ERR_VACCINE_SPACING_VIOLATION | ERR_ASSESSMENT_MEASUREMENT_INCOMPLETE", http_status: 422, applies_to: "preg finalize; season create; reductions; retain/unretain; record-vaccine; assessment create" }
  - { priority: 19, category: business_fiscal, check: "AUM budget: reserved_aum <= pasture.available_aum (inclusive == allowed)", error_id: ERR_AUM_BUDGET_EXCEEDED, http_status: 422, applies_to: "POST /api/grazing-assignments" }
  - { priority: 20, category: business_fiscal, check: "Calf-crop marketing gates: available head of lot_class >= head_count; precon_claim <= crop.precon_status; certification prerequisites (weaned, 45 days, two vaccine rounds)", error_id: "ERR_INSUFFICIENT_CROP_HEAD | ERR_PRECON_CLAIM_EXCEEDS_CROP | ERR_PRECON_VACCINE_INCOMPLETE | ERR_PRECON_DAYS_INSUFFICIENT", http_status: 422, applies_to: "sale-lot create/offer; certify-preconditioning" }

# =============================================================================
# §1.5: API Endpoint Table
# Logical clock: POST /api/_clock/set_current_utc. Server startup default is
# exactly 2026-08-01T00:00:00Z (never wall-clock). All date comparisons in
# state machines, calculations, and validations read this clock.
# =============================================================================
endpoints:
  # --- Test-driving clock ---
  - { method: POST, path: "/api/_clock/set_current_utc", description: "Set the logical clock (test-driving endpoint). Startup default is 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time", roles: [RanchManager], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["lazy state derivations (BSE expiry, lease expiry, pasture rest) re-evaluate against the new clock on next read/mutation"] }

  # --- Ranch ---
  - { method: POST, path: "/api/ranches", description: "Create ranch", roles: [RanchManager], code: 201, input: [name, hq_state, "destock_grace_days?"], output: Ranch, side_effects: ["drought_posture=NORMAL, assessment_seq=0, ranch_production_pct=100.0"] }
  - { method: GET, path: "/api/ranches/{id}", description: "Get ranch", roles: [RanchManager, RangeManager, HerdManager, SalesAgent], code: 200, input: [], output: Ranch, side_effects: [] }
  - { method: PATCH, path: "/api/ranches/{id}", description: "Update ranch policy fields", roles: [RanchManager], code: 200, input: ["name?", "hq_state?", "destock_grace_days?"], output: Ranch, side_effects: ["increments Ranch.version by 1"] }

  # --- Pasture ---
  - { method: POST, path: "/api/pastures", description: "Create pasture", roles: [RangeManager], code: 201, input: [ranch_id, name, acreage, tenure, forage_type, base_capacity_aum, "min_rest_days?"], output: Pasture, side_effects: ["condition_status=GRAZEABLE, committed_aum=0"] }
  - { method: GET, path: "/api/pastures/{id}", description: "Get pasture (recomputes condition_status, effective/committed/available AUM against current posture and clock)", roles: [RanchManager, RangeManager, HerdManager, SalesAgent], code: 200, input: [], output: Pasture, side_effects: [] }
  - { method: GET, path: "/api/pastures", description: "List pastures with filters", roles: [RanchManager, RangeManager, HerdManager, SalesAgent], code: 200, input: ["ranch_id?", "tenure?", "condition_status?"], output: "Pasture[]", side_effects: [] }
  - { method: POST, path: "/api/pastures/{id}/close", description: "Close pasture (terminal); requires no ACTIVE assignment", roles: [RangeManager], code: 200, input: [], output: Pasture, side_effects: ["closed_flag=true, condition_status=CLOSED"] }

  # --- GrazingLease ---
  - { method: POST, path: "/api/grazing-leases", description: "Create grazing lease (DRAFT)", roles: [RangeManager], code: 201, input: [ranch_id, pasture_id, lessor_name, start_date, end_date, aum_allotment, rate_per_aum_cents, minimum_commit_aum, overage_tier1_cap_aum, overage_tier1_rate_cents, overage_tier2_rate_cents, settlement_basis], output: GrazingLease, side_effects: ["lease_status=DRAFT"] }
  - { method: GET, path: "/api/grazing-leases/{id}", description: "Get lease (lazy expiry applied)", roles: [RanchManager, RangeManager, HerdManager, SalesAgent], code: 200, input: [], output: GrazingLease, side_effects: [] }
  - { method: GET, path: "/api/grazing-leases", description: "List leases", roles: [RanchManager, RangeManager, HerdManager, SalesAgent], code: 200, input: ["ranch_id?", "pasture_id?", "lease_status?"], output: "GrazingLease[]", side_effects: [] }
  - { method: PATCH, path: "/api/grazing-leases/{id}", description: "Amend lease terms (OCC-guarded; allowed in DRAFT/ACTIVE/SUSPENDED)", roles: [RangeManager], code: 200, input: [expected_lease_version, "aum_allotment?", "rate_per_aum_cents?", "minimum_commit_aum?", "overage_tier1_cap_aum?", "overage_tier1_rate_cents?", "overage_tier2_rate_cents?", "settlement_basis?", "start_date?", "end_date?"], output: GrazingLease, side_effects: ["increments GrazingLease.version by 1"] }
  - { method: POST, path: "/api/grazing-leases/{id}/activate", description: "Activate lease (aggregate capacity check)", roles: [RangeManager], code: 200, input: [], output: GrazingLease, side_effects: ["lease_status -> ACTIVE, increments GrazingLease.version by 1"] }
  - { method: POST, path: "/api/grazing-leases/{id}/suspend", description: "Suspend lease", roles: [RangeManager], code: 200, input: [], output: GrazingLease, side_effects: ["lease_status -> SUSPENDED, increments GrazingLease.version by 1"] }
  - { method: POST, path: "/api/grazing-leases/{id}/reinstate", description: "Reinstate suspended lease", roles: [RangeManager], code: 200, input: [], output: GrazingLease, side_effects: ["lease_status -> ACTIVE, increments GrazingLease.version by 1"] }
  - { method: POST, path: "/api/grazing-leases/{id}/terminate", description: "Terminate lease (RanchManager only)", roles: [RanchManager], code: 200, input: [], output: GrazingLease, side_effects: ["lease_status -> TERMINATED, increments GrazingLease.version by 1"] }

  # --- LeaseStatement ---
  - { method: POST, path: "/api/lease-statements", description: "Generate statement for (lease, period_year); snapshots usage and charges", roles: [RangeManager], code: 201, input: [lease_id, ranch_id, period_year], output: LeaseStatement, side_effects: ["computes actual_aum_used, base/overage/total per lease_settlement_charge; recorded_by_user_id <- X-User-ID; statement_status=DRAFT"] }
  - { method: GET, path: "/api/lease-statements/{id}", description: "Get statement", roles: [RanchManager, RangeManager, HerdManager, SalesAgent], code: 200, input: [], output: LeaseStatement, side_effects: [] }
  - { method: GET, path: "/api/lease-statements", description: "List statements", roles: [RanchManager, RangeManager, HerdManager, SalesAgent], code: 200, input: ["lease_id?", "ranch_id?", "statement_status?", "period_year?"], output: "LeaseStatement[]", side_effects: [] }
  - { method: POST, path: "/api/lease-statements/{id}/issue", description: "Issue statement", roles: [RangeManager], code: 200, input: [], output: LeaseStatement, side_effects: ["statement_status -> ISSUED"] }
  - { method: POST, path: "/api/lease-statements/{id}/approve", description: "Approve statement (segregation: approver != recorded_by)", roles: [RanchManager], code: 200, input: [], output: LeaseStatement, side_effects: ["statement_status -> APPROVED, approved_by_user_id <- X-User-ID"] }
  - { method: POST, path: "/api/lease-statements/{id}/mark-paid", description: "Mark approved statement paid", roles: [RanchManager], code: 200, input: [], output: LeaseStatement, side_effects: ["statement_status -> PAID"] }

  # --- HerdGroup ---
  - { method: POST, path: "/api/herd-groups", description: "Create herd group", roles: [HerdManager], code: 201, input: [ranch_id, group_name, animal_class, head_count, avg_weight_lbs], output: HerdGroup, side_effects: ["group_status=ACTIVE, marked_open_head=0"] }
  - { method: GET, path: "/api/herd-groups/{id}", description: "Get herd group", roles: [RanchManager, RangeManager, HerdManager, SalesAgent], code: 200, input: [], output: HerdGroup, side_effects: [] }
  - { method: GET, path: "/api/herd-groups", description: "List herd groups", roles: [RanchManager, RangeManager, HerdManager, SalesAgent], code: 200, input: ["ranch_id?", "animal_class?", "group_status?", "retained_from_crop_id?"], output: "HerdGroup[]", side_effects: [] }
  - { method: POST, path: "/api/herd-groups/{id}/reductions", description: "Record a head reduction (sale/cull/death/transfer/liquidation); optionally credits an OPEN|EXPIRED DestockOrder", roles: [HerdManager], code: 200, input: [head_count, reason, "destock_order_id?"], output: HerdGroup, side_effects: ["head_count -= head_count(input)", "if destock_order_id given and order OPEN|EXPIRED: order.received_reduction_head += head_count", "LIQUIDATION requires head_count == current head_count and sets group_status=LIQUIDATED"] }

  # --- BreedingSeason ---
  - { method: POST, path: "/api/breeding-seasons", description: "Create breeding season (PLANNED)", roles: [HerdManager], code: 201, input: [ranch_id, herd_group_id, season_year, planned_turnout_date, planned_removal_date, exposed_head_count], output: BreedingSeason, side_effects: ["required_bull_count = ceil(exposed/25)"] }
  - { method: GET, path: "/api/breeding-seasons/{id}", description: "Get season", roles: [RanchManager, RangeManager, HerdManager, SalesAgent], code: 200, input: [], output: BreedingSeason, side_effects: [] }
  - { method: GET, path: "/api/breeding-seasons", description: "List seasons", roles: [RanchManager, RangeManager, HerdManager, SalesAgent], code: 200, input: ["ranch_id?", "herd_group_id?", "season_status?"], output: "BreedingSeason[]", side_effects: [] }
  - { method: POST, path: "/api/breeding-seasons/{id}/begin-breeding", description: "Turn bulls in (bull battery gate)", roles: [HerdManager], code: 200, input: [], output: BreedingSeason, side_effects: ["season_status -> BREEDING"] }
  - { method: POST, path: "/api/breeding-seasons/{id}/end-breeding", description: "Close breeding window (all turnouts must be REMOVED or CANCELLED)", roles: [HerdManager], code: 200, input: [], output: BreedingSeason, side_effects: ["season_status -> GESTATION"] }

  # --- Bull ---
  - { method: POST, path: "/api/bulls", description: "Register bull", roles: [HerdManager], code: 201, input: [ranch_id, tag, breed, birth_year], output: Bull, side_effects: ["bse_status=UNTESTED, life_status=ACTIVE"] }
  - { method: GET, path: "/api/bulls/{id}", description: "Get bull (lazy BSE expiry applied)", roles: [RanchManager, RangeManager, HerdManager, SalesAgent], code: 200, input: [], output: Bull, side_effects: [] }
  - { method: GET, path: "/api/bulls", description: "List bulls", roles: [RanchManager, RangeManager, HerdManager, SalesAgent], code: 200, input: ["ranch_id?", "bse_status?", "life_status?"], output: "Bull[]", side_effects: [] }
  - { method: POST, path: "/api/bulls/{id}/record-bse", description: "Record breeding soundness exam result", roles: [HerdManager], code: 200, input: [result, exam_date, scrotal_cm], output: Bull, side_effects: ["bse_status <- result, last_bse_date <- exam_date, scrotal_cm recorded"] }
  - { method: POST, path: "/api/bulls/{id}/retire", description: "Remove bull from battery", roles: [HerdManager], code: 200, input: [disposition], output: Bull, side_effects: ["life_status <- disposition (SOLD|CULLED|DEAD)"] }

  # --- BullTurnout ---
  - { method: POST, path: "/api/bull-turnouts", description: "Schedule a bull turnout (closed-interval overlap + turnaround gap per bull)", roles: [HerdManager], code: 201, input: [bull_id, breeding_season_id, ranch_id, turnout_date, planned_removal_date], output: BullTurnout, side_effects: ["turnout_status=SCHEDULED"] }
  - { method: GET, path: "/api/bull-turnouts/{id}", description: "Get turnout", roles: [RanchManager, RangeManager, HerdManager, SalesAgent], code: 200, input: [], output: BullTurnout, side_effects: [] }
  - { method: GET, path: "/api/bull-turnouts", description: "List turnouts", roles: [RanchManager, RangeManager, HerdManager, SalesAgent], code: 200, input: ["bull_id?", "breeding_season_id?", "ranch_id?", "turnout_status?"], output: "BullTurnout[]", side_effects: [] }
  - { method: POST, path: "/api/bull-turnouts/{id}/turn-in", description: "Mark bull turned in", roles: [HerdManager], code: 200, input: [], output: BullTurnout, side_effects: ["turnout_status -> TURNED_IN"] }
  - { method: POST, path: "/api/bull-turnouts/{id}/remove", description: "Remove bull from breeding pasture", roles: [HerdManager], code: 200, input: [removal_date], output: BullTurnout, side_effects: ["turnout_status -> REMOVED, actual_removal_date <- removal_date"] }
  - { method: POST, path: "/api/bull-turnouts/{id}/cancel", description: "Cancel a scheduled turnout", roles: [HerdManager], code: 200, input: [], output: BullTurnout, side_effects: ["turnout_status -> CANCELLED"] }

  # --- PregCheck ---
  - { method: POST, path: "/api/preg-checks", description: "Create the season's preg check (season must be GESTATION; one per season)", roles: [HerdManager], code: 201, input: [breeding_season_id, ranch_id, check_date], output: PregCheck, side_effects: ["exposed_head_count <- season snapshot", "season PREG_CHECK <- GESTATION", "check_status=DRAFT"] }
  - { method: GET, path: "/api/preg-checks/{id}", description: "Get preg check", roles: [RanchManager, RangeManager, HerdManager, SalesAgent], code: 200, input: [], output: PregCheck, side_effects: [] }
  - { method: GET, path: "/api/preg-checks", description: "List preg checks", roles: [RanchManager, RangeManager, HerdManager, SalesAgent], code: 200, input: ["breeding_season_id?", "ranch_id?"], output: "PregCheck[]", side_effects: [] }
  - { method: POST, path: "/api/preg-checks/{id}/finalize", description: "Finalize counts (accounting identity enforced)", roles: [HerdManager], code: 200, input: [pregnant_count, open_count, dead_count], output: PregCheck, side_effects: ["pregnancy_rate_pct computed", "herd_group.marked_open_head += open_count", "season PREG_CHECK -> CLOSED"] }

  # --- CalfCrop ---
  - { method: POST, path: "/api/calf-crops", description: "Create calf crop at branding (season must be GESTATION | PREG_CHECK | CLOSED)", roles: [HerdManager], code: 201, input: [breeding_season_id, ranch_id, crop_year, steer_head, heifer_head], output: CalfCrop, side_effects: ["wean_status=UNWEANED, precon_status=NONE, lifecycle_status=ACTIVE"] }
  - { method: GET, path: "/api/calf-crops/{id}", description: "Get calf crop", roles: [RanchManager, RangeManager, HerdManager, SalesAgent], code: 200, input: [], output: CalfCrop, side_effects: [] }
  - { method: GET, path: "/api/calf-crops", description: "List calf crops", roles: [RanchManager, RangeManager, HerdManager, SalesAgent], code: 200, input: ["ranch_id?", "breeding_season_id?", "precon_status?", "lifecycle_status?"], output: "CalfCrop[]", side_effects: [] }
  - { method: POST, path: "/api/calf-crops/{id}/record-weaning", description: "Record weaning measurements; computes both adj205 variants", roles: [HerdManager], code: 200, input: [weaning_date, avg_wean_weight_lbs, avg_wean_age_days, avg_birth_weight_lbs, avg_dam_age_years], output: CalfCrop, side_effects: ["wean_status -> WEANED", "adj205_age_only_lbs, adj205_dam_adjusted_lbs computed"] }
  - { method: POST, path: "/api/calf-crops/{id}/enroll-preconditioning", description: "Enroll in preconditioning program (allowed pre- or post-weaning)", roles: [HerdManager], code: 200, input: [], output: CalfCrop, side_effects: ["precon_status -> ENROLLED"] }
  - { method: POST, path: "/api/calf-crops/{id}/record-vaccine", description: "Record a vaccine round (round 2 requires round 1 and >= 14 days spacing)", roles: [HerdManager], code: 200, input: [round_number, vaccine_date], output: CalfCrop, side_effects: ["vaccine_round_<n>_date recorded"] }
  - { method: POST, path: "/api/calf-crops/{id}/certify-preconditioning", description: "Certify preconditioning (ENROLLED + WEANED + >= 45 days since weaning + both vaccine rounds)", roles: [HerdManager], code: 200, input: [], output: CalfCrop, side_effects: ["precon_status -> CERTIFIED"] }
  - { method: POST, path: "/api/calf-crops/{id}/retain-heifers", description: "Retain replacement heifers into a REPLACEMENT_HEIFER herd group", roles: [HerdManager], code: 200, input: [head_count, target_herd_group_id], output: CalfCrop, side_effects: ["available_heifer_head -= head_count, retained_heifer_head += head_count", "target group head_count += head_count; target.retained_from_crop_id <- crop.id if null", "crop closure predicate re-evaluated"] }
  - { method: POST, path: "/api/calf-crops/{id}/unretain-heifers", description: "Return previously retained heifers to the crop's marketable pool", roles: [HerdManager], code: 200, input: [head_count, source_herd_group_id], output: CalfCrop, side_effects: ["requires source.retained_from_crop_id == crop.id and head_count <= retained_heifer_head", "source group head_count -= head_count, retained_heifer_head -= head_count", "crop closure predicate re-evaluated"] }
  - { method: POST, path: "/api/calf-crops/{id}/record-death-loss", description: "Record calf death loss by class", roles: [HerdManager], code: 200, input: [calf_class, head_count, loss_date], output: CalfCrop, side_effects: ["death_loss_<class>_head += head_count", "crop closure predicate re-evaluated"] }

  # --- SaleLot ---
  - { method: POST, path: "/api/sale-lots", description: "Create draft sale lot (crop WEANED, lifecycle ACTIVE, head and claim checks)", roles: [SalesAgent], code: 201, input: [calf_crop_id, ranch_id, lot_class, head_count, base_price_cents_per_cwt, slide_cents_per_lb, base_weight_lbs, shrink_pct, precon_claim, freight_cents_per_head, commission_pct], output: SaleLot, side_effects: ["lot_status=DRAFT, sold_by_user_id <- X-User-ID"] }
  - { method: GET, path: "/api/sale-lots/{id}", description: "Get sale lot", roles: [RanchManager, RangeManager, HerdManager, SalesAgent], code: 200, input: [], output: SaleLot, side_effects: [] }
  - { method: GET, path: "/api/sale-lots", description: "List sale lots", roles: [RanchManager, RangeManager, HerdManager, SalesAgent], code: 200, input: ["calf_crop_id?", "ranch_id?", "lot_status?", "lot_class?"], output: "SaleLot[]", side_effects: [] }
  - { method: POST, path: "/api/sale-lots/{id}/offer", description: "Offer lot (reserves head from crop)", roles: [SalesAgent], code: 200, input: [], output: SaleLot, side_effects: ["lot_status -> OFFERED, crop.reserved_<class>_head += head_count"] }
  - { method: POST, path: "/api/sale-lots/{id}/contract", description: "Contract lot to buyer", roles: [SalesAgent], code: 200, input: [buyer_name], output: SaleLot, side_effects: ["lot_status -> CONTRACTED"] }
  - { method: POST, path: "/api/sale-lots/{id}/relist", description: "Buyer default: return CONTRACTED lot to OFFERED", roles: [SalesAgent], code: 200, input: [], output: SaleLot, side_effects: ["lot_status -> OFFERED, relist_count += 1, buyer_name cleared"] }
  - { method: POST, path: "/api/sale-lots/{id}/deliver", description: "Deliver lot; computes settlement fields", roles: [SalesAgent], code: 200, input: [delivered_avg_weight_lbs], output: SaleLot, side_effects: ["lot_status -> DELIVERED", "sale_lot_settlement computed"] }
  - { method: POST, path: "/api/sale-lots/{id}/dispute", description: "Dispute a delivered lot", roles: [SalesAgent], code: 200, input: [reason], output: SaleLot, side_effects: ["lot_status -> DISPUTED"] }
  - { method: POST, path: "/api/sale-lots/{id}/resolve-dispute", description: "Resolve dispute back to DELIVERED (optional weight adjustment recomputes settlement)", roles: [SalesAgent], code: 200, input: ["adjusted_delivered_weight_lbs?"], output: SaleLot, side_effects: ["lot_status -> DELIVERED", "settlement recomputed if adjusted weight given"] }
  - { method: POST, path: "/api/sale-lots/{id}/settle", description: "Settle a delivered lot (RanchManager; segregation vs sold_by)", roles: [RanchManager], code: 200, input: [], output: SaleLot, side_effects: ["lot_status -> SETTLED", "crop reserved/marketed head updated", "crop closure bubble-up"] }
  - { method: POST, path: "/api/sale-lots/{id}/cancel", description: "Cancel a DRAFT or OFFERED lot", roles: [SalesAgent], code: 200, input: [], output: SaleLot, side_effects: ["lot_status -> CANCELLED, reservation released if OFFERED"] }

  # --- GrazingAssignment ---
  - { method: POST, path: "/api/grazing-assignments", description: "Create grazing assignment (ACTIVE immediately; drought gates, pasture not CLOSED, overlap/rest buffer, lease coverage, AUM budget)", roles: [RangeManager], code: 201, input: [pasture_id, herd_group_id, ranch_id, start_date, planned_end_date], output: GrazingAssignment, side_effects: ["au_factor/daily_demand_aum/reserved_aum snapshots computed", "pasture.committed_aum += reserved_aum"] }
  - { method: GET, path: "/api/grazing-assignments/{id}", description: "Get assignment", roles: [RanchManager, RangeManager, HerdManager, SalesAgent], code: 200, input: [], output: GrazingAssignment, side_effects: [] }
  - { method: GET, path: "/api/grazing-assignments", description: "List assignments", roles: [RanchManager, RangeManager, HerdManager, SalesAgent], code: 200, input: ["pasture_id?", "herd_group_id?", "ranch_id?", "assignment_status?"], output: "GrazingAssignment[]", side_effects: [] }
  - { method: POST, path: "/api/grazing-assignments/{id}/complete", description: "End grazing (actual_end == planned_end => COMPLETED; earlier => SHORTENED)", roles: [RangeManager], code: 200, input: [actual_end_date], output: GrazingAssignment, side_effects: ["consumed_aum computed", "pasture.committed_aum -= reserved_aum", "pasture.resting_until <- actual_end_date + min_rest_days"] }
  - { method: POST, path: "/api/grazing-assignments/{id}/cancel", description: "Cancel an assignment that has not begun (current_date < start_date)", roles: [RangeManager], code: 200, input: [], output: GrazingAssignment, side_effects: ["assignment_status -> CANCELLED", "pasture.committed_aum -= reserved_aum, consumed_aum <- 0"] }

  # --- SupplementProgram ---
  - { method: POST, path: "/api/supplement-programs", description: "Create mineral/supplement program (ACTIVE immediately)", roles: [HerdManager], code: 201, input: [herd_group_id, ranch_id, program_type, start_date, end_date, feed_rate_oz_per_head_day, cost_cents_per_ton], output: SupplementProgram, side_effects: ["projected_consumption_lbs computed from herd_group.head_count snapshot"] }
  - { method: GET, path: "/api/supplement-programs/{id}", description: "Get program", roles: [RanchManager, RangeManager, HerdManager, SalesAgent], code: 200, input: [], output: SupplementProgram, side_effects: [] }
  - { method: GET, path: "/api/supplement-programs", description: "List programs", roles: [RanchManager, RangeManager, HerdManager, SalesAgent], code: 200, input: ["herd_group_id?", "ranch_id?", "program_status?", "program_type?"], output: "SupplementProgram[]", side_effects: [] }
  - { method: POST, path: "/api/supplement-programs/{id}/deliveries", description: "Record a supplement delivery", roles: [HerdManager], code: 200, input: [delivered_lbs, delivery_date], output: SupplementProgram, side_effects: ["delivered_lbs_total += delivered_lbs", "cost_to_date_cents recomputed"] }
  - { method: POST, path: "/api/supplement-programs/{id}/complete", description: "Complete program", roles: [HerdManager], code: 200, input: [], output: SupplementProgram, side_effects: ["program_status -> COMPLETED"] }
  - { method: POST, path: "/api/supplement-programs/{id}/cancel", description: "Cancel program", roles: [HerdManager], code: 200, input: [], output: SupplementProgram, side_effects: ["program_status -> CANCELLED"] }

  # --- DroughtAssessment ---
  - { method: POST, path: "/api/drought-assessments", description: "Create drought assessment (DRAFT); computes pct, supply, demand, deficit, resulting posture preview", roles: [RangeManager], code: 201, input: [ranch_id, assessment_date, pasture_measurements], output: DroughtAssessment, side_effects: [] }
  - { method: GET, path: "/api/drought-assessments/{id}", description: "Get assessment", roles: [RanchManager, RangeManager, HerdManager, SalesAgent], code: 200, input: [], output: DroughtAssessment, side_effects: [] }
  - { method: GET, path: "/api/drought-assessments", description: "List assessments", roles: [RanchManager, RangeManager, HerdManager, SalesAgent], code: 200, input: ["ranch_id?", "assessment_status?"], output: "DroughtAssessment[]", side_effects: [] }
  - { method: POST, path: "/api/drought-assessments/{id}/finalize", description: "Finalize assessment (OCC on Ranch.version); applies posture, may create DestockOrder", roles: [RangeManager], code: 200, input: [expected_ranch_version], output: DroughtAssessment, side_effects: ["ranch posture/pct/seq updated, increments Ranch.version by 1", "if deficit > 0: DestockOrder created; ACTIVE herd groups -> DESTOCKING"] }

  # --- DestockOrder ---
  - { method: GET, path: "/api/destock-orders/{id}", description: "Get destock order", roles: [RanchManager, RangeManager, HerdManager, SalesAgent], code: 200, input: [], output: DestockOrder, side_effects: [] }
  - { method: GET, path: "/api/destock-orders", description: "List destock orders", roles: [RanchManager, RangeManager, HerdManager, SalesAgent], code: 200, input: ["ranch_id?", "drought_assessment_id?", "order_status?"], output: "DestockOrder[]", side_effects: [] }
  - { method: POST, path: "/api/destock-orders/{id}/verify-compliance", description: "Verify reductions: received >= required => COMPLIANT; past deadline and short => EXPIRED", roles: [RangeManager], code: 200, input: [], output: DestockOrder, side_effects: ["on COMPLIANT: DESTOCKING herd groups on the ranch -> ACTIVE"] }
  - { method: POST, path: "/api/destock-orders/{id}/waive", description: "Waive order (RanchManager, waiver_note required)", roles: [RanchManager], code: 200, input: [waiver_note], output: DestockOrder, side_effects: ["order_status -> WAIVED", "DESTOCKING herd groups on the ranch -> ACTIVE"] }

# =============================================================================
# §1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not declared" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not in endpoint's roles list" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Approver/settler X-User-ID equals the recorder/seller X-User-ID" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body FK id does not exist (or belongs to another ranch)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, computed/system/unknown field supplied, non-positive quantities, start >= end" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 400, condition: "Transition not valid from current (non-terminal) state" }
  - { id: ERR_ALREADY_TERMINAL, http: 400, condition: "Resource in terminal state rejects all transitions (includes SaleLot create against a CalfCrop with lifecycle_status == CLOSED)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not equal current parent version (OCC)" }
  - { id: ERR_PASTURE_NOT_GRAZEABLE, http: 400, condition: "Pasture condition_status is CLOSED (RESTING is informational; spacing is enforced by ERR_PASTURE_REST_VIOLATION)" }
  - { id: ERR_LEASE_NOT_ACTIVE, http: 400, condition: "Leased pasture has no ACTIVE lease, or statement/assignment target lease not ACTIVE|SUSPENDED|EXPIRED as required" }
  - { id: ERR_SEASON_NOT_IN_GESTATION, http: 400, condition: "PregCheck create requires season GESTATION; crop create requires GESTATION | PREG_CHECK | CLOSED" }
  - { id: ERR_CROP_NOT_WEANED, http: 400, condition: "SaleLot create or preconditioning certify requires wean_status == WEANED" }
  - { id: ERR_PRECON_NOT_ENROLLED, http: 400, condition: "certify-preconditioning requires precon_status == ENROLLED" }
  - { id: ERR_PASTURE_WINDOW_OVERLAP, http: 409, condition: "Half-open grazing window intersects an existing non-terminal assignment on the pasture" }
  - { id: ERR_PASTURE_REST_VIOLATION, http: 409, condition: "Gap between grazing windows on the pasture < min_rest_days" }
  - { id: ERR_BULL_TURNOUT_OVERLAP, http: 409, condition: "Closed turnout interval intersects another non-terminal turnout of the same bull" }
  - { id: ERR_BULL_TURNAROUND_TOO_SHORT, http: 409, condition: "Less than MIN_BULL_TURNAROUND_DAYS (7) between turnouts of the same bull" }
  - { id: ERR_PREG_CHECK_ALREADY_EXISTS, http: 409, condition: "Season already has a PregCheck" }
  - { id: ERR_DUPLICATE_STATEMENT_PERIOD, http: 409, condition: "A LeaseStatement already exists for (lease_id, period_year)" }
  - { id: ERR_AUM_BUDGET_EXCEEDED, http: 422, condition: "reserved_aum > pasture.available_aum (strictly greater fails; equality allowed)" }
  - { id: ERR_LEASE_CAPACITY_EXCEEDED, http: 422, condition: "Sum of ACTIVE lease allotments on pasture would exceed base_capacity_aum" }
  - { id: ERR_ASSIGNMENT_OUTSIDE_LEASE_WINDOW, http: 422, condition: "ACTIVE covering lease exists but [start_date, planned_end_date] not within [lease.start_date, lease.end_date]" }
  - { id: ERR_TURNOUT_OUTSIDE_SEASON_WINDOW, http: 422, condition: "Turnout window not within season planned turnout/removal dates" }
  - { id: ERR_DROUGHT_POSTURE_BLOCKS_COMMITMENT, http: 422, condition: "ranch.drought_posture in {ALERT, CRITICAL} blocks new grazing assignments" }
  - { id: ERR_DESTOCK_ORDER_BLOCKING, http: 422, condition: "A DestockOrder in OPEN | EXPIRED on the ranch blocks new grazing assignments" }
  - { id: ERR_BULL_BATTERY_INSUFFICIENT, http: 422, condition: "Qualified TURNED_IN bulls < required_bull_count at begin-breeding" }
  - { id: ERR_EXPOSURE_EXCEEDS_GROUP, http: 422, condition: "exposed_head_count > herd_group.head_count at season creation" }
  - { id: ERR_PREG_COUNT_MISMATCH, http: 422, condition: "pregnant + open + dead != exposed_head_count at finalize" }
  - { id: ERR_RETENTION_EXCEEDS_AVAILABLE, http: 422, condition: "retain/unretain head exceeds available_heifer_head / retained_heifer_head" }
  - { id: ERR_RETENTION_CLASS_MISMATCH, http: 422, condition: "retain target group is not animal_class REPLACEMENT_HEIFER (or belongs to another ranch / is LIQUIDATED)" }
  - { id: ERR_DESTOCK_REDUCTION_EXCEEDS_HEAD, http: 422, condition: "reduction head_count > group head_count (or LIQUIDATION with partial head)" }
  - { id: ERR_VACCINE_SPACING_VIOLATION, http: 422, condition: "round 2 vaccine < round 1 + 14 days; or round 2 recorded before round 1" }
  - { id: ERR_PRECON_VACCINE_INCOMPLETE, http: 422, condition: "certify without both vaccine rounds recorded" }
  - { id: ERR_PRECON_DAYS_INSUFFICIENT, http: 422, condition: "certify with current_date - weaning_date < 45 days" }
  - { id: ERR_PRECON_CLAIM_EXCEEDS_CROP, http: 422, condition: "lot precon_claim ranks above crop.precon_status (CERTIFIED > ENROLLED > NONE)" }
  - { id: ERR_INSUFFICIENT_CROP_HEAD, http: 422, condition: "lot head_count > available head of lot_class; or death loss exceeds available" }
  - { id: ERR_ASSESSMENT_MEASUREMENT_INCOMPLETE, http: 422, condition: "pasture_measurements missing a non-CLOSED pasture, duplicates one, or references an unknown pasture" }

# =============================================================================
# §1.7: RBAC Matrix
# =============================================================================
roles:
  - name: RanchManager
    description: "Ranch owner/manager; approval authority — approves lease statements, settles sale lots, sets drought policy, waives destock orders; may NOT record field data (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /api/ranches, PATCH /api/ranches/{id}"
      - "POST /api/_clock/set_current_utc"
      - "POST /api/lease-statements/{id}/approve, /mark-paid"
      - "POST /api/grazing-leases/{id}/terminate"
      - "POST /api/sale-lots/{id}/settle"
      - "POST /api/destock-orders/{id}/waive"
    shared_operations: ["all GET endpoints"]
  - name: RangeManager
    description: "Range/lease operator; pastures, leases, statements (records but cannot approve), grazing assignments, drought assessments"
    identity: opaque
    exclusive_operations:
      - "POST /api/pastures, POST /api/pastures/{id}/close"
      - "POST /api/grazing-leases, PATCH /api/grazing-leases/{id}, /activate, /suspend, /reinstate"
      - "POST /api/lease-statements, /issue"
      - "POST /api/grazing-assignments, /complete, /cancel"
      - "POST /api/drought-assessments, /finalize"
      - "POST /api/destock-orders/{id}/verify-compliance"
    shared_operations: ["all GET endpoints"]
  - name: HerdManager
    description: "Cow boss; herd groups, breeding seasons, bulls and turnouts, preg checks, calf crops, supplement programs"
    identity: opaque
    exclusive_operations:
      - "POST /api/herd-groups, /reductions"
      - "POST /api/breeding-seasons, /begin-breeding, /end-breeding"
      - "POST /api/bulls, /record-bse, /retire"
      - "POST /api/bull-turnouts, /turn-in, /remove, /cancel"
      - "POST /api/preg-checks, /finalize"
      - "POST /api/calf-crops and all /api/calf-crops/{id}/* actions"
      - "POST /api/supplement-programs and all program actions"
    shared_operations: ["all GET endpoints"]
  - name: SalesAgent
    description: "Calf marketing agent; sale lots from create through delivery/dispute (cannot settle)"
    identity: opaque
    exclusive_operations:
      - "POST /api/sale-lots, /offer, /contract, /relist, /deliver, /dispute, /resolve-dispute, /cancel"
    shared_operations: ["all GET endpoints"]
