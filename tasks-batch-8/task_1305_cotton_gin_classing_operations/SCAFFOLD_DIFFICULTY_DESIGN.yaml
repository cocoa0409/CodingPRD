            - "LoanPledge.${p1}.principal_cents == 27250 (500 lbs x 5450 points / 100) and loan_rate_points == 5450"
            - "same-day redeem: interest_cents == 0; receipt PLEDGED -> RELEASED (cycle point, not terminal)"
            - "re-pledge succeeds from RELEASED: LoanPledge.${p2}.status == ACTIVE, receipt -> PLEDGED again"
            - "ledger: LOAN_ADVANCE +27250, LOAN_REPAYMENT -27250, LOAN_ADVANCE +27250 -> Grower.${gl}.credit_balance_cents == 27250"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: complete_ginning_charge_cascade_to_grower_balance
        grounds:
          - state_machines.ModuleReceipt.GINNING_to_GINNED
          - calculations.ginning_charge
          - entities.Grower.fields.credit_balance_cents
        distinguishing_aspect: |
          Depth-3 cascade from POST /complete-ginning: module -> GINNED (A)
          causes Bale creation + actual_lint_lbs (B), which causes the tiered
          GINNING_CHARGE LedgerEntry (C), which causes Grower.credit_balance_cents
          recompute (D) — each link is caused by the previous one.
        test_recipe:
          setup:
            - "Grower GX with one module (net 10000, moisture 8.0, fm 4.0) QUEUED then GINNING in shift SX"
          setup_api_calls:
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-500", legal_name: "Cascade Farm" }
              as: CoopAdmin
              captures: { gx: $.data.id }
            - call: "POST /gin-ops/gin-shifts"
              payload: { season: "2026", stand_label: "STAND-G" }
              as: GinOperator
              captures: { sx: $.data.id }
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${gx}", season: "2026", ticket_number: "T-1", module_tag: "MT-X", gross_weight_lbs: 11000, tare_weight_lbs: 1000, moisture_pct: 8.0, foreign_matter_pct: 4.0 }
              as: GinOperator
              captures: { mx: $.data.id }
            - call: "POST /gin-ops/modules/${mx}/queue"
              payload: { gin_shift_id: "${sx}" }
              as: GinOperator
            - call: "POST /gin-ops/modules/${mx}/start-ginning"
              as: GinOperator
          trigger:
            - call: "POST /gin-ops/modules/${mx}/complete-ginning"
              payload: { bales: [ {bale_tag: "B-X1", net_weight_lbs: 500} ] }
              as: GinOperator
              as_user_id: "gin-op-7"
            - call: "GET /gin-ops/modules/${mx}/bales"
              as: GinOperator
            - call: "GET /gin-ops/ledger-entries"
              payload: { grower_id: "${gx}" }
              as: CoopAccountant
            - call: "GET /gin-ops/growers/${gx}"
              as: CoopAccountant
          assert:
            - "hop A: ModuleReceipt.${mx}.status == GINNED, ginned_by_user_id == gin-op-7, ginned_at == 2026-08-01T00:00:00Z (clock default)"
            - "hop B: exactly one Bale exists with classing_status == UNCLASSED, custody_status == ON_GIN_FLOOR; module actual_lint_lbs == 500"
            - "hop C: one LedgerEntry GINNING_CHARGE amount_cents == -5750, season == 2026"
            - "hop D: Grower.${gx}.credit_balance_cents == -5750 (visible immediately, same logical request scope)"

      - name: reclass_cascade_recomputes_draft_settlement
        grounds:
          - state_machines.Bale.classing_CLASSED_to_CLASSED
          - calculations.quality_price_adjustment
          - calculations.settlement_net
        distinguishing_aspect: |
          Depth-2+ cascade from POST /classing-results: new ACTIVE result (A)
          causes Bale quality fields recompute (B), which causes every DRAFT
          Settlement of (grower, season) to recompute its money lines (C) — the
          settlement delta equals the bale's adjustment delta exactly (+1848).
        test_recipe:
          setup:
            - "Grade schedules 41-4 (-110 pts, ..2026-07-01) and 31-3 (+265 pts, 2026-01-01..2027-01-01)"
            - "Grower GR with module (net 10000), one 480-lb bale classed 41-4 (adj -456), and a DRAFT settlement S created after classing"
          setup_api_calls:
            - call: "POST /gin-ops/grade-schedules"
              payload: { grade_code: "41-4", premium_discount_points: -110, loan_rate_points: 5200, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-07-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /gin-ops/grade-schedules"
              payload: { grade_code: "31-3", premium_discount_points: 265, loan_rate_points: 5450, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-501", legal_name: "Reclass Farm" }
              as: CoopAdmin
              captures: { gr: $.data.id }
            - call: "POST /gin-ops/gin-shifts"
              payload: { season: "2026", stand_label: "STAND-H" }
              as: GinOperator
              captures: { s1: $.data.id }
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${gr}", season: "2026", ticket_number: "T-1", module_tag: "MT-R", gross_weight_lbs: 11000, tare_weight_lbs: 1000, moisture_pct: 8.0, foreign_matter_pct: 4.0 }
              as: GinOperator
              captures: { mr: $.data.id }
            - call: "POST /gin-ops/modules/${mr}/queue"
              payload: { gin_shift_id: "${s1}" }
              as: GinOperator
            - call: "POST /gin-ops/modules/${mr}/start-ginning"
              as: GinOperator
            - call: "POST /gin-ops/modules/${mr}/complete-ginning"
              payload: { bales: [ {bale_tag: "B-R1", net_weight_lbs: 480} ] }
              as: GinOperator
              as_user_id: "gin-op-1"
            - call: "GET /gin-ops/modules/${mr}/bales"
              as: ClassingClerk
              captures: { b1: "$.data[0].id", b1v: "$.data[0].version" }
            - call: "POST /gin-ops/bales/${b1}/classing-results"
              payload: { grade_code: "41-4", micronaire: 4.5, strength_gpt: 30.0, staple_32nds: 35, classing_office: "USDA-MEMPHIS", result_date: "2026-03-10T00:00:00Z", expected_bale_version: "${b1v}" }
              as: ClassingClerk
              captures: { cr1: $.data.id }
            - call: "GET /gin-ops/growers/${gr}"
              as: CoopAccountant
              captures: { grv: $.data.version }
            - call: "POST /gin-ops/growers/${gr}/settlements"
              payload: { season: "2026", expected_grower_version: "${grv}" }
              as: CoopAccountant
              captures: { st: $.data.id }
            - call: "GET /gin-ops/bales/${b1}"
              as: ClassingClerk
              captures: { b1v2: $.data.version }
          trigger:
            - call: "POST /gin-ops/bales/${b1}/classing-results"
              payload: { grade_code: "31-3", micronaire: 3.9, strength_gpt: 27.0, staple_32nds: 36, classing_office: "USDA-MEMPHIS", result_date: "2026-03-15T00:00:00Z", expected_bale_version: "${b1v2}" }
              as: ClassingClerk
              captures: { cr2: $.data.id }
            - call: "GET /gin-ops/settlements/${st}"
              as: CoopAccountant
            - call: "GET /gin-ops/bales/${b1}/classing-results"
              as: ClassingClerk
          assert:
            - "before reclass: Settlement.${st}.quality_adjustment_cents == -456 and net_payable_cents == 161428 (lint 28800 - 456 + seed 137500 - ginning 5520 + patronage 1104)"
            - "hop B: Bale.${b1}.quality_points == 290 and adjustment_cents == 1392 after reclass"
            - "hop C: Settlement.${st} (still DRAFT) recomputed: quality_adjustment_cents == 1392, net_payable_cents == 163276 (delta exactly +1848)"
            - "ClassingResult.${cr1}.status == SUPERSEDED and ClassingResult.${cr2}.status == ACTIVE (list shows both)"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pledge_state_precondition_beats_loan_cap
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - errors[ERR_RECEIPT_NOT_ACTIVE]
          - errors[ERR_LOAN_CAP_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: a pledge against an
          already-PLEDGED receipt that would also breach the 50000000 season cap
          returns ERR_RECEIPT_NOT_ACTIVE (409, priority 4), not
          ERR_LOAN_CAP_EXCEEDED (402, priority 9).
        test_recipe:
          setup:
            - "Grade schedule 52-1 (0 pts, loan 5000000) covering 2026; bale of 500 lbs -> principal 25000000 per pledge"
            - "Grower GC with three classed 500-lb bales, three receipts at warehouse W (capacity 10); r1 and r2 pledged (season principal exactly 50000000)"
          setup_api_calls:
            - call: "POST /gin-ops/grade-schedules"
              payload: { grade_code: "52-1", premium_discount_points: 0, loan_rate_points: 5000000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-600", legal_name: "Cap Farm" }
              as: CoopAdmin
              captures: { gc: $.data.id }
            - call: "POST /gin-ops/warehouses"
              payload: { name: "WH-P", capacity_bales: 10, dock_count: 1 }
              as: CoopAdmin
              captures: { wh: $.data.id }
            - call: "POST /gin-ops/gin-shifts"
              payload: { season: "2026", stand_label: "STAND-I" }
              as: GinOperator
              captures: { s1: $.data.id }
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${gc}", season: "2026", ticket_number: "T-1", module_tag: "MT-C", gross_weight_lbs: 11000, tare_weight_lbs: 1000, moisture_pct: 8.0, foreign_matter_pct: 4.0 }
              as: GinOperator
              captures: { m1: $.data.id }
            - call: "POST /gin-ops/modules/${m1}/queue"
              payload: { gin_shift_id: "${s1}" }
              as: GinOperator
            - call: "POST /gin-ops/modules/${m1}/start-ginning"
              as: GinOperator
            - call: "POST /gin-ops/modules/${m1}/complete-ginning"
              payload: { bales: [ {bale_tag: "B-C1", net_weight_lbs: 500}, {bale_tag: "B-C2", net_weight_lbs: 500}, {bale_tag: "B-C3", net_weight_lbs: 500} ] }
              as: GinOperator
              as_user_id: "gin-op-1"
            - call: "GET /gin-ops/modules/${m1}/bales"
              as: ClassingClerk
              captures: { b1: "$.data[0].id", b1v: "$.data[0].version", b2: "$.data[1].id", b2v: "$.data[1].version", b3: "$.data[2].id", b3v: "$.data[2].version" }
            - call: "POST /gin-ops/bales/${b1}/classing-results"
              payload: { grade_code: "52-1", micronaire: 4.0, strength_gpt: 28.0, staple_32nds: 36, classing_office: "USDA-MEMPHIS", result_date: "2026-03-10T00:00:00Z", expected_bale_version: "${b1v}" }
              as: ClassingClerk
            - call: "POST /gin-ops/bales/${b2}/classing-results"
              payload: { grade_code: "52-1", micronaire: 4.0, strength_gpt: 28.0, staple_32nds: 36, classing_office: "USDA-MEMPHIS", result_date: "2026-03-10T00:00:00Z", expected_bale_version: "${b2v}" }
              as: ClassingClerk
            - call: "POST /gin-ops/bales/${b3}/classing-results"
              payload: { grade_code: "52-1", micronaire: 4.0, strength_gpt: 28.0, staple_32nds: 36, classing_office: "USDA-MEMPHIS", result_date: "2026-03-10T00:00:00Z", expected_bale_version: "${b3v}" }
              as: ClassingClerk
            - call: "POST /gin-ops/warehouse-receipts"
              payload: { bale_id: "${b1}", warehouse_id: "${wh}" }
              as: WarehouseManager
              as_user_id: "wm-1"
              captures: { r1: $.data.id }
            - call: "POST /gin-ops/warehouse-receipts"
              payload: { bale_id: "${b2}", warehouse_id: "${wh}" }
              as: WarehouseManager
              as_user_id: "wm-1"
              captures: { r2: $.data.id }
            - call: "POST /gin-ops/warehouse-receipts"
              payload: { bale_id: "${b3}", warehouse_id: "${wh}" }
              as: WarehouseManager
              as_user_id: "wm-1"
              captures: { r3: $.data.id }
            - call: "POST /gin-ops/loan-pledges"
              payload: { warehouse_receipt_id: "${r1}" }
              as: CoopAccountant
            - call: "POST /gin-ops/loan-pledges"
              payload: { warehouse_receipt_id: "${r2}" }
              as: CoopAccountant
          trigger:
            - call: "POST /gin-ops/loan-pledges"
              payload: { warehouse_receipt_id: "${r1}" }
              as: CoopAccountant
              captures: { err1: $.data.error_id }
            - call: "POST /gin-ops/loan-pledges"
              payload: { warehouse_receipt_id: "${r3}" }
              as: CoopAccountant
              captures: { err2: $.data.error_id }
          assert:
            - "re-pledging ${r1} (PLEDGED; would also exceed the cap): error_id == ERR_RECEIPT_NOT_ACTIVE, http 409 — state (priority 4) beats fiscal (priority 9)"
            - "pledging ${r3} (ACTIVE but 50000000 + 25000000 > cap): error_id == ERR_LOAN_CAP_EXCEEDED, http 402"
            - "receipts unchanged: ${r1}.status == PLEDGED, ${r3}.status == ACTIVE"

      - name: module_create_safety_beats_duplicate_tag
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_FOREIGN_MATTER_LIMIT_EXCEEDED]
          - errors[ERR_DUPLICATE_MODULE_TAG]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_constraint: a module
          create with foreign_matter_pct 12.0 (> 10.0) AND a duplicate
          (season, module_tag) returns ERR_FOREIGN_MATTER_LIMIT_EXCEEDED (422,
          priority 5), not ERR_DUPLICATE_MODULE_TAG (409, priority 6).
        test_recipe:
          setup:
            - "Grower GD with existing module MT-DUP in season 2026 (fm 5.0, accepted)"
          setup_api_calls:
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-601", legal_name: "Dup Farm" }
              as: CoopAdmin
              captures: { gd: $.data.id }
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${gd}", season: "2026", ticket_number: "T-1", module_tag: "MT-DUP", gross_weight_lbs: 11000, tare_weight_lbs: 1000, moisture_pct: 9.0, foreign_matter_pct: 5.0 }
              as: GinOperator
          trigger:
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${gd}", season: "2026", ticket_number: "T-2", module_tag: "MT-DUP", gross_weight_lbs: 12000, tare_weight_lbs: 1000, moisture_pct: 9.0, foreign_matter_pct: 12.0 }
              as: GinOperator
              captures: { err: $.data.error_id }
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${gd}", season: "2026", ticket_number: "T-3", module_tag: "MT-DUP", gross_weight_lbs: 12000, tare_weight_lbs: 1000, moisture_pct: 9.0, foreign_matter_pct: 5.0 }
              as: GinOperator
              captures: { err2: $.data.error_id }
          assert:
            - "dual failure (fm 12.0 + duplicate tag): error_id == ERR_FOREIGN_MATTER_LIMIT_EXCEEDED, http 422 — safety (priority 5) beats constraint (priority 6)"
            - "constraint alone (fm 5.0 + duplicate tag): error_id == ERR_DUPLICATE_MODULE_TAG, http 409"
            - "no second module with tag MT-DUP exists in season 2026"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: moisture_boundary_twelve_point_zero
        grounds:
          - validations[priority=5]
          - state_machines.ModuleReceipt.RECEIVED_to_QUEUED
        distinguishing_aspect: |
          Numeric threshold metric (moisture percent): the gate is strict
          greater-than — 12.0 exactly queues, 12.01 is rejected with
          ERR_MOISTURE_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "Grower GM, shift SM OPEN, module M-OK with moisture_pct 12.0, module M-WET with moisture_pct 12.01"
          setup_api_calls:
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-700", legal_name: "Boundary Farm" }
              as: CoopAdmin
              captures: { gm: $.data.id }
            - call: "POST /gin-ops/gin-shifts"
              payload: { season: "2026", stand_label: "STAND-J" }
              as: GinOperator
              captures: { sm: $.data.id }
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${gm}", season: "2026", ticket_number: "T-1", module_tag: "MT-OK", gross_weight_lbs: 11000, tare_weight_lbs: 1000, moisture_pct: 12.0, foreign_matter_pct: 4.0 }
              as: GinOperator
              captures: { mok: $.data.id }
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${gm}", season: "2026", ticket_number: "T-2", module_tag: "MT-WET", gross_weight_lbs: 11000, tare_weight_lbs: 1000, moisture_pct: 12.01, foreign_matter_pct: 4.0 }
              as: GinOperator
              captures: { mwet: $.data.id }
          trigger:
            - call: "POST /gin-ops/modules/${mok}/queue"
              payload: { gin_shift_id: "${sm}" }
              as: GinOperator
            - call: "POST /gin-ops/modules/${mwet}/queue"
              payload: { gin_shift_id: "${sm}" }
              as: GinOperator
              captures: { err: $.data.error_id }
          assert:
            - "ModuleReceipt.${mok} (moisture exactly 12.0): queue succeeds, status == QUEUED, gin_shift_id == ${sm}"
            - "ModuleReceipt.${mwet} (moisture 12.01): error_id == ERR_MOISTURE_LIMIT_EXCEEDED, http 422, status stays RECEIVED"

      - name: warehouse_capacity_exact_full_boundary
        grounds:
          - validations[priority=6]
          - entities.Warehouse.fields.stored_bale_count
          - entities.Warehouse.fields.capacity_bales
        distinguishing_aspect: |
          Integer count metric (warehouse occupancy): issuing succeeds while
          stored_bale_count == capacity - 1 and fails with
          ERR_WAREHOUSE_AT_CAPACITY when stored_bale_count == capacity — the
          boundary is an exact equality on a count, via a different endpoint
          than the moisture gate.
        test_recipe:
          setup:
            - "Warehouse W1 capacity_bales 1; grower GW with one module producing two 400-lb bales (ginned by gin-op-1)"
          setup_api_calls:
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-701", legal_name: "Capacity Farm" }
              as: CoopAdmin
              captures: { gw: $.data.id }
            - call: "POST /gin-ops/warehouses"
