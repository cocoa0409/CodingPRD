              as: ComplianceOfficer
              captures: { whA: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${whA}", full_name: "Agent A", user_role: "FILING_AGENT" }
              as: ComplianceOfficer
              captures: { agentA: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${whA}", full_name: "Officer A", user_role: "CERTIFYING_OFFICER" }
              as: ComplianceOfficer
              captures: { certA: $.data.id }
            - call: "POST /brands"
              payload: { wholesaler_id: "${whA}", brand_name: "Rio Reserve", supplier_name: "Rio Supply Co", beverage_class: "SPIRITS", registration_effective_from: "2026-01-01T00:00:00Z", registration_expires_on: "2027-12-31T23:59:59Z" }
              as: FilingAgent
              as_user_id: "${agentA}"
              captures: { brandA: $.data.id }
            - call: "POST /brands/${brandA}/approve"
              as: ComplianceOfficer
            - call: "POST /price-schedules"
              payload: { wholesaler_id: "${whA}", state_program_id: "${prog}", posting_month: "2026-09" }
              as: FilingAgent
              as_user_id: "${agentA}"
              captures: { schedA: $.data.id }
            - call: "POST /price-schedule-items"
              payload: { schedule_id: "${schedA}", brand_id: "${brandA}", size_ml: 750, bottles_per_case: 12, case_price_cents: 120000, unit_price_cents: 11000 }
              as: FilingAgent
              as_user_id: "${agentA}"
              captures: { itemA: $.data.id }
            - call: "POST /quantity-discount-tiers"
              payload: { item_id: "${itemA}", min_cases: 5, discount_pct: 0.10 }
              as: FilingAgent
              as_user_id: "${agentA}"
              captures: { tier1: $.data.id }
            - call: "POST /price-schedules/${schedA}/submit"
              as: FilingAgent
              as_user_id: "${agentA}"
            - call: "POST /price-schedules/${schedA}/certify"
              as: CertifyingOfficer
              as_user_id: "${certA}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /error-corrections"
              payload: { item_id: "${itemA}", corrected_case_price_cents: 114000, corrected_unit_price_cents: 10500, reason: "transposed case price on the filed schedule" }
              as: FilingAgent
