# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 difficulty rules x >=2 instances = 21 instances.
# Every chain replays from empty DB using only SCAFFOLD.yaml §1.5 endpoints.
# Role headers: as -> X-User-Role; as_user_id -> X-User-ID (opaque ids, literals).
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: cost_forecast_commitment_vs_trend_variants
        grounds:
          - calculations.cost_to_complete_forecast
          - entities.OwnerReport.fields.eac_commitment_based_cents
          - entities.OwnerReport.fields.eac_trend_based_cents
        distinguishing_aspect: |
          Cost-domain dual variant: identical program state yields
          eac_commitment_based_cents = 57700000 (full risk exposure, no pending-CO
          allowance) and eac_trend_based_cents = 57625000 (status-weighted exposure
          plus a 50% pending-CO allowance under NORMAL posture) — a pinned delta of
          75000 cents from the same inputs.
        test_recipe:
          setup:
            - "Program ACTIVE: budget 10000000, contingency 1000000, lines CC-100=6000000 / CC-200=4000000"
            - "CT1 EXECUTED awarded 4500000 with CO1 APPROVED 200000 (commitment 4700000; available 800000; posture NORMAL)"
            - "CT2 SOLICITED estimate 1000000; CT3 COUNTERED latest counter 1800000"
            - "CO2 UNDER_REVIEW amount 150000 (pending); R1 ASSESSED exposure 200000; R2 ESCALATED exposure 50000000"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_name: "P-EAC", owner_organization: "OwnerOrg" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { prog: $.data.id } }
            - { call: "POST /charters", payload: { program_id: "${prog}", objectives: "obj", scope_statement: "scope" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { ch: $.data.id } }
            - { call: "POST /charters/${ch}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv: $.data.version } }
            - { call: "POST /charters/${ch}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /baselines", payload: { program_id: "${prog}", total_budget_cents: 10000000, contingency_total_cents: 1000000, target_finish_date: "2027-03-31", lines: [ { cost_code: "CC-100", amount_cents: 6000000 }, { cost_code: "CC-200", amount_cents: 4000000 } ] }, as: OwnerRepPM, as_user_id: "pm-1", captures: { bl: $.data.id } }
            - { call: "POST /baselines/${bl}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv2: $.data.version } }
            - { call: "POST /baselines/${bl}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv2}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /programs/${prog}/activate", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /contracts", payload: { program_id: "${prog}", vendor_name: "V1", contract_type: "CONTRACTOR", solicitation_estimate_cents: 5000000 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { ct1: $.data.id } }
            - { call: "POST /contracts/${ct1}/begin-negotiation", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /contracts/${ct1}/counter", payload: { counter_amount_cents: 4500000 }, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /contracts/${ct1}/execute", payload: { awarded_amount_cents: 4500000 }, as: OwnerRepExecutive, as_user_id: "exec-1" }
            - { call: "POST /contracts", payload: { program_id: "${prog}", vendor_name: "V2", contract_type: "CONSULTANT", solicitation_estimate_cents: 1000000 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { ct2: $.data.id } }
            - { call: "POST /contracts", payload: { program_id: "${prog}", vendor_name: "V3", contract_type: "CONTRACTOR", solicitation_estimate_cents: 2000000 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { ct3: $.data.id } }
            - { call: "POST /contracts/${ct3}/begin-negotiation", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /contracts/${ct3}/counter", payload: { counter_amount_cents: 1800000 }, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /change-orders", payload: { contract_id: "${ct1}", title: "CO1", reason: "scope", amount_cents: 200000 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { co1: $.data.id } }
            - { call: "POST /change-orders/${co1}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /change-orders/${co1}/recommend", payload: { recommendation: "APPROVE", analysis_note: "ok" }, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /change-orders/${co1}/decide", payload: { decision: "APPROVE" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /change-orders", payload: { contract_id: "${ct1}", title: "CO2", reason: "pending", amount_cents: 150000 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { co2: $.data.id } }
            - { call: "POST /change-orders/${co2}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /risk-entries", payload: { program_id: "${prog}", title: "R1", category: "COST", probability_pct: 50, impact_cents: 400000 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { r1: $.data.id } }
            - { call: "POST /risk-entries/${r1}/assess", payload: { probability_pct: 50, impact_cents: 400000 }, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /risk-entries", payload: { program_id: "${prog}", title: "R2", category: "SCHEDULE", probability_pct: 50, impact_cents: 100000000 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { r2: $.data.id } }
            - { call: "POST /risk-entries/${r2}/assess", payload: { probability_pct: 50, impact_cents: 100000000 }, as: OwnerRepPM, as_user_id: "pm-1" }
          trigger:
            - { call: "POST /owner-reports", payload: { program_id: "${prog}", period: "2026-08" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { eac_cb: $.data.eac_commitment_based_cents, eac_tb: $.data.eac_trend_based_cents, var_cb: $.data.budget_variance_commitment_cents, var_tb: $.data.budget_variance_trend_cents, post: $.data.contingency_posture_snapshot } }
          assert:
            - "eac_cb == 57700000   # 4700000 committed + 2800000 estimated + 50200000 full exposures"
            - "eac_tb == 57625000   # 4700000 + 2800000 + (200000*0.25 + 50000000*1.00) + 150000*0.50"
            - "eac_cb - eac_tb == 75000   # variants provably diverge on identical data"
            - "var_cb == -47700000   # 10000000 - 57700000"
            - "var_tb == -47625000   # 10000000 - 57625000"
            - "post == NORMAL"

      - name: move_in_readiness_unweighted_vs_weighted
        grounds:
          - calculations.move_in_readiness
          - entities.OccupancyPlan.fields.readiness_unweighted_pct
          - entities.OccupancyPlan.fields.readiness_weighted_pct
        distinguishing_aspect: |
          Occupancy-domain dual variant (different entity domain from the cost
          forecast instance): with one COMPLETE wave of weight 2 and one SCHEDULED
          wave of weight 1 (a CANCELLED wave excluded), unweighted readiness is
          50.0 while criticality-weighted readiness is 66.67 — same wave set,
          different scores.
        test_recipe:
          setup:
            - "Program ACTIVE with approved baseline (total 3000000, contingency 300000, three equal lines)"
            - "Stakeholder group G1; occupancy plan PL progressed PLANNING->COORDINATING->READY->EXECUTING"
            - "W1 (DOCK_A, weight 2) COMPLETE; W2 (DOCK_B, weight 1) SCHEDULED; W3 (DOCK_C, weight 5) CANCELLED"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_name: "P-READ", owner_organization: "OwnerOrg" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { prog: $.data.id } }
            - { call: "POST /charters", payload: { program_id: "${prog}", objectives: "obj", scope_statement: "scope" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { ch: $.data.id } }
            - { call: "POST /charters/${ch}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv: $.data.version } }
            - { call: "POST /charters/${ch}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /baselines", payload: { program_id: "${prog}", total_budget_cents: 3000000, contingency_total_cents: 300000, target_finish_date: "2027-03-31", lines: [ { cost_code: "CC-100", amount_cents: 1000000 }, { cost_code: "CC-200", amount_cents: 1000000 }, { cost_code: "CC-300", amount_cents: 1000000 } ] }, as: OwnerRepPM, as_user_id: "pm-1", captures: { bl: $.data.id } }
            - { call: "POST /baselines/${bl}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv2: $.data.version } }
            - { call: "POST /baselines/${bl}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv2}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /programs/${prog}/activate", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /stakeholder-groups", payload: { program_id: "${prog}", group_name: "G1", group_type: "USER_GROUP", contact_email: "g1@x.com" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { g1: $.data.id } }
            - { call: "POST /occupancy-plans", payload: { program_id: "${prog}", plan_name: "PL", target_move_month: "2026-10" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { pl: $.data.id } }
            - { call: "POST /occupancy-plans/${pl}/coordinate", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /move-in-waves", payload: { occupancy_plan_id: "${pl}", stakeholder_group_id: "${g1}", wave_name: "W1", dock_resource: "DOCK_A", move_start: "2026-10-01T08:00:00Z", move_end: "2026-10-01T12:00:00Z", criticality_weight: 2 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { w1: $.data.id } }
            - { call: "POST /move-in-waves", payload: { occupancy_plan_id: "${pl}", stakeholder_group_id: "${g1}", wave_name: "W2", dock_resource: "DOCK_B", move_start: "2026-10-02T08:00:00Z", move_end: "2026-10-02T12:00:00Z", criticality_weight: 1 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { w2: $.data.id } }
            - { call: "POST /move-in-waves", payload: { occupancy_plan_id: "${pl}", stakeholder_group_id: "${g1}", wave_name: "W3", dock_resource: "DOCK_C", move_start: "2026-10-03T08:00:00Z", move_end: "2026-10-03T12:00:00Z", criticality_weight: 5 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { w3: $.data.id } }
            - { call: "POST /occupancy-plans/${pl}/mark-ready", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /occupancy-plans/${pl}/execute", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /move-in-waves/${w1}/confirm", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /move-in-waves/${w1}/complete", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /move-in-waves/${w3}/cancel", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
          trigger:
            - { call: "GET /occupancy-plans/${pl}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { un: $.data.readiness_unweighted_pct, wt: $.data.readiness_weighted_pct } }
          assert:
            - "un == 50.0    # 1 of 2 non-cancelled waves complete"
            - "wt == 66.67   # 100 * 2/(2+1), round_half_up to 2dp; CANCELLED W3 excluded from both"

  - rule_id: combinatorial_formula
    instances:
      - name: trend_eac_multibranch_formula
        grounds:
          - calculations.cost_to_complete_forecast
          - calculations.contingency_posture_derivation
        distinguishing_aspect: |
          Mode (a) combinatorial formula: TREND_BASED EAC combines committed +
          estimated + status-weighted exposure + a posture-conditional pending-CO
          allowance; under CRITICAL posture the allowance factor is 1.00 (not 0.50),
          so with committed 4500000, estimated 1000000, MONITORING exposure 200000
          and pending CO 150000 the trend EAC is exactly 5750000.
        test_recipe:
          setup:
            - "Program ACTIVE: budget 10000000, contingency 1000000, single line CC-100=10000000"
            - "CT1 EXECUTED 4500000 (commitment 4500000); CT2 SOLICITED estimate 1000000"
            - "CO2 UNDER_REVIEW 150000 submitted while posture still NORMAL"
            - "Manual reserve 900000 committed? No: RESERVED 910000 -> available 90000 -> ratio 0.09 -> posture CRITICAL"
            - "R1 progressed to MONITORING with exposure 200000 (multiplier 0.50)"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_name: "P-TREND", owner_organization: "OwnerOrg" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { prog: $.data.id } }
            - { call: "POST /charters", payload: { program_id: "${prog}", objectives: "obj", scope_statement: "scope" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { ch: $.data.id } }
            - { call: "POST /charters/${ch}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv: $.data.version } }
            - { call: "POST /charters/${ch}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /baselines", payload: { program_id: "${prog}", total_budget_cents: 10000000, contingency_total_cents: 1000000, target_finish_date: "2027-03-31", lines: [ { cost_code: "CC-100", amount_cents: 10000000 } ] }, as: OwnerRepPM, as_user_id: "pm-1", captures: { bl: $.data.id } }
            - { call: "POST /baselines/${bl}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv2: $.data.version } }
            - { call: "POST /baselines/${bl}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv2}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /programs/${prog}/activate", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /contracts", payload: { program_id: "${prog}", vendor_name: "V1", contract_type: "CONTRACTOR", solicitation_estimate_cents: 4500000 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { ct1: $.data.id } }
            - { call: "POST /contracts/${ct1}/begin-negotiation", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /contracts/${ct1}/execute", payload: { awarded_amount_cents: 4500000 }, as: OwnerRepExecutive, as_user_id: "exec-1" }
            - { call: "POST /contracts", payload: { program_id: "${prog}", vendor_name: "V2", contract_type: "CONSULTANT", solicitation_estimate_cents: 1000000 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { ct2: $.data.id } }
            - { call: "POST /change-orders", payload: { contract_id: "${ct1}", title: "CO2", reason: "pending", amount_cents: 150000 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { co2: $.data.id } }
            - { call: "POST /change-orders/${co2}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /contingency-drawdowns", payload: { program_id: "${prog}", purpose: "reserve hold", amount_cents: 910000 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { dd: $.data.id } }
            - { call: "POST /risk-entries", payload: { program_id: "${prog}", title: "R1", category: "COST", probability_pct: 50, impact_cents: 400000 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { r1: $.data.id } }
            - { call: "POST /risk-entries/${r1}/assess", payload: { probability_pct: 50, impact_cents: 400000 }, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /risk-entries/${r1}/mitigate", payload: { mitigation_plan: "mitigate" }, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /risk-entries/${r1}/monitor", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
          trigger:
            - { call: "POST /owner-reports", payload: { program_id: "${prog}", period: "2026-08" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { eac_cb: $.data.eac_commitment_based_cents, eac_tb: $.data.eac_trend_based_cents, post: $.data.contingency_posture_snapshot } }
          assert:
            - "post == CRITICAL   # available 90000 / total 1000000 = 0.09 < 0.10"
            - "eac_cb == 5700000   # 4500000 + 1000000 + 200000 (full exposure)"
            - "eac_tb == 5750000   # 4500000 + 1000000 + 200000*0.50 + 150000*1.00 (CRITICAL allowance branch)"

      - name: change_order_cost_code_rounding_order
        grounds:
          - calculations.change_order_cost_code_distribution
          - entities.ChangeOrder.fields.allocated_lines
        distinguishing_aspect: |
          Mode (b) nested rounding: distributing a 10-cent change order across three
          equal 1000000-cent baseline lines rounds per line first (3.333.. -> 3 each,
          sum 9), then assigns the +1 cent remainder to the largest fractional part
          with ties broken by cost_code ascending -> CC-100 gets 4, CC-200/CC-300 get
          3. Sum-then-round would misdistribute the remainder.
        test_recipe:
          setup:
            - "Program ACTIVE: baseline total 3000000, contingency 300000, lines CC-100/CC-200/CC-300 = 1000000 each"
            - "CT1 EXECUTED 1000000; CO of amount_cents 10 approved"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_name: "P-ROUND", owner_organization: "OwnerOrg" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { prog: $.data.id } }
            - { call: "POST /charters", payload: { program_id: "${prog}", objectives: "obj", scope_statement: "scope" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { ch: $.data.id } }
            - { call: "POST /charters/${ch}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv: $.data.version } }
            - { call: "POST /charters/${ch}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /baselines", payload: { program_id: "${prog}", total_budget_cents: 3000000, contingency_total_cents: 300000, target_finish_date: "2027-03-31", lines: [ { cost_code: "CC-100", amount_cents: 1000000 }, { cost_code: "CC-200", amount_cents: 1000000 }, { cost_code: "CC-300", amount_cents: 1000000 } ] }, as: OwnerRepPM, as_user_id: "pm-1", captures: { bl: $.data.id } }
            - { call: "POST /baselines/${bl}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv2: $.data.version } }
            - { call: "POST /baselines/${bl}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv2}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /programs/${prog}/activate", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /contracts", payload: { program_id: "${prog}", vendor_name: "V1", contract_type: "CONTRACTOR", solicitation_estimate_cents: 1000000 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { ct1: $.data.id } }
            - { call: "POST /contracts/${ct1}/begin-negotiation", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /contracts/${ct1}/execute", payload: { awarded_amount_cents: 1000000 }, as: OwnerRepExecutive, as_user_id: "exec-1" }
            - { call: "POST /change-orders", payload: { contract_id: "${ct1}", title: "CO10", reason: "rounding", amount_cents: 10 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { co: $.data.id } }
            - { call: "POST /change-orders/${co}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /change-orders/${co}/recommend", payload: { recommendation: "APPROVE", analysis_note: "ok" }, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /change-orders/${co}/decide", payload: { decision: "APPROVE" }, as: Owner, as_user_id: "owner-1" }
          trigger:
            - { call: "GET /change-orders/${co}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { lines: $.data.allocated_lines } }
          assert:
            - "lines == [ { cost_code: 'CC-100', allocated_cents: 4 }, { cost_code: 'CC-200', allocated_cents: 3 }, { cost_code: 'CC-300', allocated_cents: 3 } ]"
            - "sum of allocated_cents == 10 == amount_cents (remainder reconciled to exactly one line)"

      - name: forecast_posture_evaluation_order
        grounds:
          - calculations.cost_to_complete_forecast
          - calculations.contingency_pool_recompute
        distinguishing_aspect: |
          Mode (c) pinned evaluation order: the pool is recomputed WITHOUT pending
          change orders, posture derives from that pool (WATCH at 250000/1000000),
          and only then is the pending-CO allowance applied at 0.50. An
          implementation that deducts the pending 200000 CO from the pool first
          would compute 50000/1000000 -> CRITICAL and answer 4700000 instead of the
          correct 4600000.
        test_recipe:
          setup:
            - "Program ACTIVE: budget 10000000, contingency 1000000, single line CC-100"
            - "CT1 EXECUTED 4500000; manual reserve 750000 -> available 250000 (ratio 0.25 -> WATCH)"
            - "CO UNDER_REVIEW 200000 pending; no risks"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_name: "P-ORDER", owner_organization: "OwnerOrg" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { prog: $.data.id } }
            - { call: "POST /charters", payload: { program_id: "${prog}", objectives: "obj", scope_statement: "scope" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { ch: $.data.id } }
            - { call: "POST /charters/${ch}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv: $.data.version } }
            - { call: "POST /charters/${ch}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /baselines", payload: { program_id: "${prog}", total_budget_cents: 10000000, contingency_total_cents: 1000000, target_finish_date: "2027-03-31", lines: [ { cost_code: "CC-100", amount_cents: 10000000 } ] }, as: OwnerRepPM, as_user_id: "pm-1", captures: { bl: $.data.id } }
            - { call: "POST /baselines/${bl}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv2: $.data.version } }
            - { call: "POST /baselines/${bl}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv2}" }, as: Owner, as_user_id: "owner-1" }
