      - name: confirm_loan_area_not_active
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_AREA_NOT_ACTIVE]"]
        distinguishing_aspect: "Confirming a loan whose area is still DRAFT fails ERR_AREA_NOT_ACTIVE 422."
