            - "Team.${team_a_id}.compliance_status == COMPLIANT"
            - "Transaction.${txn_ir_id}.prior_designation == ACTIVE"

      - name: trade_counter_cycle_alternates_sides_then_voids_at_round_budget
        grounds:
          - state_machines.Trade.PROPOSED_to_COUNTERED
          - state_machines.Trade.COUNTERED_to_PROPOSED
          - state_machines.Trade.PROPOSED_to_VOIDED
          - state_machines.TradeAsset.PROPOSED_to_RETURNED
          - calculations.negotiation_round_budget
          - entities.Trade.fields.round_count
          - entities.Trade.fields.void_reason
          - concurrency_rules[trade-asset-add-stale-trade]
        distinguishing_aspect: |
          Non-linearity here is a CYCLE on a different entity than the first instance: Trade
          loops PROPOSED -> COUNTERED -> PROPOSED with the acting club alternating on every
          hop, and the same /counter trigger stops looping and voids the trade once
          round_count reaches MAX_TRADE_ROUNDS 3 — the identical trigger has two different
          targets depending on an accumulated counter, not on the current state alone.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z."
            - "Two clubs: Harbor Kings (waiver_priority_rank 1) and Basin Otters (waiver_priority_rank 2), both COMPLIANT."
            - "A Trade initiated by Harbor Kings against Basin Otters with conditional_clause_type NONE, status PROPOSED, round_count 1, carrying one PROPOSED DRAFT_PICK asset (2028 round 3) directed TO_COUNTERPARTY (cap_charge_snapshot_cents 0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
            - call: "POST /teams"
              payload: { name: "Harbor Kings", market_code: "HKG", salary_cap_limit_cents: 500000000, waiver_priority_rank: 1 }
              as: LeagueOfficer
              captures: { team_a_id: $.data.id }
            - call: "POST /teams"
              payload: { name: "Basin Otters", market_code: "BSN", salary_cap_limit_cents: 500000000, waiver_priority_rank: 2 }
              as: LeagueOfficer
              captures: { team_b_id: $.data.id }
            - call: "POST /trades"
              payload: { initiating_team_id: "${team_a_id}", counterparty_team_id: "${team_b_id}", conditional_clause_type: "NONE" }
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
              captures: { tr1_id: $.data.id, tr1_v1: $.data.version }
            - call: "POST /trades/${tr1_id}/assets"
              payload: { asset_kind: "DRAFT_PICK", direction: "TO_COUNTERPARTY", expected_trade_version: "${tr1_v1}", draft_pick_year: 2028, draft_pick_round: 3 }
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
              captures: { asset1_id: $.data.id }
            - call: "GET /trades/${tr1_id}"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${team_b_id}"
              captures: { tr1_v2: $.data.version }
          trigger:
            - call: "POST /trades/${tr1_id}/counter"
              payload: { expected_trade_version: "${tr1_v2}" }
              as: TeamCapAnalyst
              as_user_id: "${team_b_id}"
              captures: { tr1_v3: $.data.version, round_after_1: $.data.round_count }
            - call: "POST /trades/${tr1_id}/counter"
              payload: { expected_trade_version: "${tr1_v3}" }
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
              captures: { tr1_v4: $.data.version, round_after_2: $.data.round_count }
            - call: "POST /trades/${tr1_id}/counter"
              payload: { expected_trade_version: "${tr1_v4}" }
              as: TeamCapAnalyst
              as_user_id: "${team_b_id}"
          assert:
            - "after the first counter: Trade.${tr1_id}.status == COUNTERED and the captured ${round_after_1} == 2"
            - "after the second counter: Trade.${tr1_id}.status == PROPOSED and the captured ${round_after_2} == 3 (the cycle returned to its earlier state with a higher counter)"
            - "after the third counter: Trade.${tr1_id}.status == VOIDED"
            - "Trade.${tr1_id}.void_reason == ROUND_LIMIT_EXCEEDED"
            - "Trade.${tr1_id}.round_count == 4"
            - "Trade.${tr1_id}.version == 5"
            - "TradeAsset.${asset1_id}.status == RETURNED"
            - "Trade.${tr1_id}.cap_delta_initiating_cents == 0 and cap_delta_counterparty_cents == 0"
            - "Trade.${tr1_id}.accepted_at == null and executed_at == null"

  # ===========================================================================
  # R4 — transitive_cascade
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: waiver_clearance_cascade_terminates_contract_and_books_dead_money
        grounds:
          - state_machines.WaiverRequest.PENDING_to_CLEARED
          - state_machines.Contract.ACTIVE_to_TERMINATED
          - state_machines.BonusAllocation.SCHEDULED_to_ACCELERATED
          - calculations.dead_money_on_release
          - calculations.team_cap_commitment
          - calculations.designation_count_recompute
          - calculations.team_compliance_evaluation
          - entities.Team.fields.dead_money_cents
          - entities.WaiverRequest.fields.releasing_team_dead_money_cents
        distinguishing_aspect: |
          Depth-5 chain off one POST /waiver-requests/{id}/process: the empty survivor set
          clears the wire (1), which BECAUSE it cleared terminates the ACTIVE contract with
          RELEASE_CLEARED (2), which BECAUSE the contract terminated accelerates its three
          SIGNING_PRORATION rows and splits 10000000 of unamortized bonus into 3333333 this
          season / 6666667 next (3), which BECAUSE dead money was booked rewrites the club's
          dead_money_cents and both cap variants (4), which BECAUSE the cap totals moved
          re-derives compliance_status in EVENT mode (5) — every link is caused by the one
          before it, none of them by the request itself.
