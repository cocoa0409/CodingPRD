        distinguishing_aspect: "Body FK resolution is ordered: the part check at priority 17 fires before the build check at 18, so a claim naming two unknown ids reports ERR_PART_NOT_FOUND specifically rather than a generic reference failure."
        test_recipe:
          setup: ["Distributor D-01 (so the acting Distributor identity resolves); no parts and no builds"]
          setup_api_calls:
            - call: "POST /clm/distributors"
              payload: { distributor_code: "D-01", legal_name: "Bay Laundry Supply", territory_code: "TX-CENTRAL", territory_exclusive: true }
              as: ChannelManager
              as_user_id: "u-cm-01"
              captures: { dist: $.data.id }
          trigger:
            - call: "POST /clm/warranty-claims"
              payload: { build_order_id: "00000000-0000-4000-8000-0000000000b1", part_id: "00000000-0000-4000-8000-0000000000p1", distributor_id: "${dist}", reported_by_technician_id: "00000000-0000-4000-8000-0000000000t1", failure_cycle_count: 1000, in_service_months: 6, duty_cycle_class: "STANDARD", diagnostics_code: "BRG-NOISE" }
              as: Distributor
              as_user_id: "${dist}"
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns HTTP 404"
            - "${err} == ERR_PART_NOT_FOUND (not ERR_BUILD_NOT_FOUND and not ERR_TECHNICIAN_NOT_FOUND)"
            - "GET /clm/warranty-claims as WarrantyAnalyst u-wa-01 returns 0 items"
            - "Distributor.${dist}.open_claim_count == 0"

  - section: errors
    instances:
      - name: request_without_identity_headers_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Authentication is checked before everything else, so a headerless POST to a create endpoint with a body that would also fail three other validations still returns exactly 401 ERR_UNAUTHENTICATED."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /clm/machine-models"
              payload: { model_code: "VND-90-C", product_line: "ON_PREMISE", capacity_rating_lb: 90, rated_water_gal_per_cwt: 0.95, rated_kwh_per_cwt: 0.38, drum_alloy_grade: "AISI_316", payment_module_options: ["COIN"], list_price_cents: 900000 }
              as: none
              as_user_id: "none"
              captures: { err: $.data.error_id }
          assert:
            - "the trigger, sent with neither X-User-ID nor X-User-Role, returns HTTP 401"
            - "${err} == ERR_UNAUTHENTICATED"
            - "sending only X-User-Role without X-User-ID is also 401"
            - "GET /clm/machine-models returns 0 items"

      - name: undeclared_role_header_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
          - roles
        distinguishing_aspect: "A syntactically present but undeclared role value (PlantSupervisor is not one of the nine roles in §1.7) is 403 ERR_UNAUTHORIZED, not 401 — the caller is authenticated, just not anybody the system knows."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /clm/machine-models"
              payload: { model_code: "OPL-60-A", product_line: "ON_PREMISES", capacity_rating_lb: 60, rated_water_gal_per_cwt: 1.10, rated_kwh_per_cwt: 0.42, drum_alloy_grade: "AISI_304", payment_module_options: [], list_price_cents: 1250000 }
              as: PlantSupervisor
              as_user_id: "u-xx-01"
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns HTTP 403"
            - "${err} == ERR_UNAUTHORIZED"
            - "GET /clm/machine-models returns 0 items"

      - name: unknown_path_ids_each_return_their_own_not_found_code
        claim_type: error_triggerable
        grounds:
          - validations[priority=5]
          - validations[priority=11]
          - errors[ERR_LOG_NOT_FOUND]
          - errors[ERR_QUOTE_LINE_NOT_FOUND]
        distinguishing_aspect: "Every path-id existence rule owns a distinct error code: eleven reads against the same non-existent UUID return eleven different error_ids, so no endpoint falls back on a shared ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /clm/rebate-programs/00000000-0000-4000-8000-000000000001"
              as: ComplianceOfficer
              as_user_id: "u-co-01"
            - call: "GET /clm/certification-dossiers/00000000-0000-4000-8000-000000000002"
              as: ComplianceOfficer
              as_user_id: "u-co-01"
            - call: "GET /clm/service-parts/00000000-0000-4000-8000-000000000003"
              as: ProductEngineer
              as_user_id: "u-pe-01"
            - call: "GET /clm/assembly-stations/00000000-0000-4000-8000-000000000004"
              as: PlantManager
              as_user_id: "u-pm-01"
            - call: "GET /clm/technicians/00000000-0000-4000-8000-000000000005"
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
            - call: "GET /clm/build-orders/00000000-0000-4000-8000-000000000006"
              as: PlantManager
              as_user_id: "u-pm-01"
            - call: "GET /clm/station-logs/00000000-0000-4000-8000-000000000007"
              as: PlantManager
              as_user_id: "u-pm-01"
            - call: "GET /clm/distributors/00000000-0000-4000-8000-000000000008"
              as: ChannelManager
              as_user_id: "u-cm-01"
            - call: "GET /clm/quotes/00000000-0000-4000-8000-000000000009"
              as: ChannelManager
              as_user_id: "u-cm-01"
            - call: "GET /clm/quote-lines/00000000-0000-4000-8000-00000000000a"
              as: ChannelManager
              as_user_id: "u-cm-01"
            - call: "GET /clm/warranty-claims/00000000-0000-4000-8000-00000000000b"
              as: WarrantyAnalyst
              as_user_id: "u-wa-01"
          assert:
            - "all eleven trigger calls return HTTP 404 with response_type == error"
            - "the error_ids are, in order, ERR_PROGRAM_NOT_FOUND, ERR_DOSSIER_NOT_FOUND, ERR_PART_NOT_FOUND, ERR_STATION_NOT_FOUND, ERR_TECHNICIAN_NOT_FOUND, ERR_BUILD_NOT_FOUND, ERR_LOG_NOT_FOUND, ERR_DISTRIBUTOR_NOT_FOUND, ERR_QUOTE_NOT_FOUND, ERR_QUOTE_LINE_NOT_FOUND, ERR_CLAIM_NOT_FOUND"
            - "every response carries a non-empty data.message"

      - name: renew_before_any_grant_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=28]
          - errors[ERR_TECHNICIAN_STATE_INVALID]
          - state_machines.Technician
        distinguishing_aspect: "RENEW is defined only from ACTIVE or EXPIRED, so renewing a technician who has never been granted anything is 409 ERR_TECHNICIAN_STATE_INVALID rather than being silently upgraded to a first grant."
        test_recipe:
          setup: ["Technician T-100 in UNCERTIFIED"]
          setup_api_calls:
            - call: "POST /clm/technicians"
              payload: { employee_code: "T-100", full_name: "Ann Ito", employer: "FACTORY" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /clm/technicians/${t1}/certification-actions"
              payload: { action: "RENEW", scopes: ["DRUM_FAB"], expires_on: "2027-06-30T00:00:00Z" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns HTTP 409"
            - "${err} == ERR_TECHNICIAN_STATE_INVALID"
            - "Technician.${t1}.cert_state == UNCERTIFIED with cert_scopes == [] and version == 1"

      - name: decision_on_draft_quote_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=30]
          - errors[ERR_QUOTE_STATE_INVALID]
        distinguishing_aspect: "A channel decision is only defined on SUBMITTED, so deciding a DRAFT quote is 409 ERR_QUOTE_STATE_INVALID; the quote keeps decided_by_user_id null, proving the write is not partially applied."
        test_recipe:
          setup: ["Distributor D-01; a DRAFT quote with no lines"]
          setup_api_calls:
            - call: "POST /clm/distributors"
              payload: { distributor_code: "D-01", legal_name: "Bay Laundry Supply", territory_code: "TX-CENTRAL", territory_exclusive: true }
              as: ChannelManager
              as_user_id: "u-cm-01"
              captures: { dist: $.data.id }
            - call: "POST /clm/quotes"
              payload: { distributor_id: "${dist}", customer_name: "Sudz Express", laundromat_site_code: "SITE-77", stated_credit_score: 715, financing_program: "NONE", down_payment_cents: 0, package_discount_pct: 0.00, freight_cents: 0 }
              as: Distributor
              as_user_id: "${dist}"
              captures: { q1: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /clm/quotes/${q1}/decision"
              payload: { decision: "APPROVE", verified_credit_score: 700 }
              as: ChannelManager
              as_user_id: "u-cm-01"
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns HTTP 409"
            - "${err} == ERR_QUOTE_STATE_INVALID"
            - "PackageQuote.${q1}.quote_state == DRAFT and decided_by_user_id == null"
            - "PackageQuote.${q1}.verified_credit_score == null and version == ${v0}"

  - section: rbac
    instances:
      - name: distributor_creation_outside_channel_manager_rejected
        claim_type: exclusive_operations
        grounds:
          - roles.ChannelManager.exclusive_operations
          - roles.TrainingAdministrator
          - validations[priority=2]
        distinguishing_aspect: "Onboarding a distributor is ChannelManager's exclusive operation even though TrainingAdministrator owns everything that happens to that distributor afterwards (technicians, training completions) — adjacency in the workflow does not grant the create."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /clm/distributors"
              payload: { distributor_code: "D-01", legal_name: "Bay Laundry Supply", territory_code: "TX-CENTRAL", territory_exclusive: true }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
              captures: { err: $.data.error_id }
            - call: "POST /clm/distributors"
              payload: { distributor_code: "D-01", legal_name: "Bay Laundry Supply", territory_code: "TX-CENTRAL", territory_exclusive: true }
              as: ChannelManager
              as_user_id: "u-cm-01"
              captures: { dist: $.data.id }
          assert:
            - "the first trigger call returns HTTP 403 with ${err} == ERR_UNAUTHORIZED"
            - "the second trigger call returns HTTP 201, so the payload itself was never the problem"
            - "Distributor.${dist}.distributor_state == PENDING_TRAINING"
            - "GET /clm/distributors as TrainingAdministrator u-ta-01 returns 1 item (reads are shared, writes are not)"

      - name: machine_model_creation_by_distributor_rejected
        claim_type: role_denied_operation
        grounds:
          - roles.ProductEngineer.exclusive_operations
          - roles.Distributor
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "The Distributor role is the widest reader in the channel but holds no engineering write: creating a machine model is 403 even though the distributor may quote that same model minutes later."
        test_recipe:
          setup: ["Distributor D-01 so the caller identity resolves to a real row"]
          setup_api_calls:
            - call: "POST /clm/distributors"
              payload: { distributor_code: "D-01", legal_name: "Bay Laundry Supply", territory_code: "TX-CENTRAL", territory_exclusive: true }
              as: ChannelManager
              as_user_id: "u-cm-01"
              captures: { dist: $.data.id }
          trigger:
            - call: "POST /clm/machine-models"
              payload: { model_code: "OPL-60-A", product_line: "ON_PREMISES", capacity_rating_lb: 60, rated_water_gal_per_cwt: 1.10, rated_kwh_per_cwt: 0.42, drum_alloy_grade: "AISI_304", payment_module_options: [], list_price_cents: 1250000 }
              as: Distributor
              as_user_id: "${dist}"
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns HTTP 403 with ${err} == ERR_UNAUTHORIZED"
            - "GET /clm/machine-models as Distributor ${dist} returns HTTP 200 with 0 items (the read is permitted, the write is not)"

      - name: claim_adjudication_by_product_engineer_rejected
        claim_type: peer_roles
        grounds:
          - roles.WarrantyAnalyst.exclusive_operations
          - roles.ProductEngineer
          - validations[priority=2]
        distinguishing_aspect: "ProductEngineer and WarrantyAnalyst are peers over the same warranty data: the engineer may read the analysis rollup for a model but cannot adjudicate a single claim, and the 403 is decided before the unknown claim id is even looked up."
        test_recipe:
          setup: ["Service part BRG-2040 stocked to 1 so a real version token exists"]
          setup_api_calls:
            - call: "POST /clm/service-parts"
              payload: { part_number: "BRG-2040", component_class: "BEARING", fits_product_lines: ["ON_PREMISES", "VENDED"], fits_min_capacity_lb: 20, fits_max_capacity_lb: 80, rated_duty_cycles: 30000, warranty_months: 36, unit_price_cents: 42000, requires_cert_scope: "DIAGNOSTICS_TOOL", reorder_point_qty: 2 }
              as: ProductEngineer
              as_user_id: "u-pe-01"
              captures: { p1: $.data.id }
            - call: "POST /clm/service-parts/${p1}/stock-adjustments"
              payload: { delta_qty: 1, reason: "RECEIPT" }
              as: PlantManager
              as_user_id: "u-pm-01"
              captures: { p1_v: $.data.version }
          trigger:
            - call: "POST /clm/warranty-claims/00000000-0000-4000-8000-0000000000c1/adjudicate"
              payload: { decision: "APPROVE", expected_part_version: "${p1_v}" }
              as: ProductEngineer
              as_user_id: "u-pe-01"
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns HTTP 403 with ${err} == ERR_UNAUTHORIZED (not 404 ERR_CLAIM_NOT_FOUND, because priority 2 precedes priority 15)"
            - "ServicePart.${p1}.version == ${p1_v} and on_hand_qty == 1 (no stock was consumed)"

      - name: dossier_review_by_its_own_preparer_rejected
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=34]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - endpoints[POST /clm/certification-dossiers/{id}/reviews]
        distinguishing_aspect: "Both the preparer and the reviewer hold the same ComplianceOfficer role, so the denial cannot come from role checks — it comes from comparing X-User-ID against the dossier's prepared_by_user_id, and the very same call from a different officer succeeds."
        test_recipe:
          setup: ["OPL-60-A with a dossier prepared by u-prep-01"]
          setup_api_calls:
            - call: "POST /clm/machine-models"
              payload: { model_code: "OPL-60-A", product_line: "ON_PREMISES", capacity_rating_lb: 60, rated_water_gal_per_cwt: 1.10, rated_kwh_per_cwt: 0.42, drum_alloy_grade: "AISI_304", payment_module_options: [], list_price_cents: 1250000 }
              as: ProductEngineer
              as_user_id: "u-pe-01"
              captures: { m1: $.data.id }
            - call: "POST /clm/machine-models/${m1}/certification-dossiers"
              payload: { measured_water_gal_per_cwt: 1.05, measured_kwh_per_cwt: 0.40, test_cycle_count: 120 }
              as: ComplianceOfficer
              as_user_id: "u-prep-01"
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /clm/certification-dossiers/${d1}/reviews"
              payload: { dimension: "ENERGY", decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u-prep-01"
              captures: { err: $.data.error_id }
            - call: "POST /clm/certification-dossiers/${d1}/reviews"
              payload: { dimension: "ENERGY", decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u-rev-e"
          assert:
            - "the first trigger call returns HTTP 403 with ${err} == ERR_SEGREGATION_OF_DUTIES"
            - "after the first trigger call CertificationDossier.${d1}.energy_review_state == PENDING and energy_reviewed_by_user_id == null"
            - "the second trigger call returns HTTP 200/201 and sets energy_review_state == APPROVED with energy_reviewed_by_user_id == u-rev-e"
            - "CertificationDossier.${d1}.dossier_state == IN_REVIEW (WATER is still pending)"
            - "MachineModel.${m1}.certification_state == DRAFT"

      - name: qa_signoff_by_a_technician_who_logged_the_build_rejected
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=35]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - endpoints[POST /clm/build-orders/{id}/qa-signoff]
        distinguishing_aspect: "The builder-inspector separation is per build order, not per role or per scope: T-100 holds QA_SIGNOFF and would pass the certification check at priority 36, yet is refused on this build because his own station logs are on it — while the identical call from T-900 is accepted."
