  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: depart_cascade_slot_release_to_surge_posture
        grounds:
          - state_machines.TimerLoop.AT_WINDOW_to_CLOSED
          - state_machines.MergeSlot.COMMITTED_to_RELEASED
          - calculations.restaurant_rollup_recompute
          - calculations.oot_requirement
          - state_machines.Restaurant.OPEN_to_SURGE
          - entities.Restaurant.fields.merge_slots_free
        distinguishing_aspect: |
          Depth-5 chain fired by ONE request (POST /drive-thru/timer-loops/{loopId}/depart): loop
          CLOSED -> its COMMITTED MergeSlot RELEASED -> merge_slots_free 0 -> 1 -> cars_closed_trailing
          1 so cars_per_hour_effective 6.0 selects TIER_2 -> required_oot_count 0 -> 1 -> service_posture
          OPEN -> SURGE; each link exists only because the previous link changed, and cutting hop 3
          (the trailing car rate) leaves required_oot_count at 0 and the posture at OPEN.
        test_recipe:
          setup:
            - "Four VolumeTierPolicy bands; one DUAL_PARALLEL Restaurant with merge_slots_capacity 1 (so slot accounting is unambiguous) and labor_minutes_budget 300; one StaffMember; one ACTIVE LUNCH DaypartProfile (25/95/40/75)."
            - "One TimerLoop on LANE_A driven to AT_WINDOW through a real merge: create 11:00:00Z, greet 11:00:20Z, order-complete 11:01:00Z, merge-award (MergeSlot RESERVED, merge_slots_free 0), commit (slot COMMITTED, loop MERGED, merge_wait_seconds 0), window-arrive 11:02:00Z."
            - "Restaurant.service_posture is OPEN, required_oot_count 0, deployed_oot_count 0, cars_closed_trailing 0, volume_tier TIER_1."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, cars_per_hour_ceiling: 6, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
