              as: ComplianceOfficer
          trigger:
            - call: "POST /transactions/${t_id}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_BLACKOUT_PERIOD"

      - name: blackout_period_allows_plan_affiliated_transaction
        claim_type: conditional_validation
        grounds: ["validations[priority=7]", state_machines.SecurityTransaction.INGESTED_to_CONFIRMED]
        distinguishing_aspect: "The same blackout window does NOT block a transaction affiliated with an ACTIVE 10b5-1 plan — the plan exemption flips the validation off."
