scaffold_corner_design:

  # =====================================================================
  - section: entities
    instances:
      - name: owner_create_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Owner]
        distinguishing_aspect: "POST /owners with legal_name, email, default_management_fee_pct returns 201 and a server-minted id, version 1, status ACTIVE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /owners", payload: { legal_name: "Acme Owner", email: "a@x.com", default_management_fee_pct: 22 }, as: PlatformAdmin, captures: { oid: "$.data.id", v: "$.data.version", st: "$.data.status" } }
          assert:
            - "Owner.${oid}.status == ACTIVE"
            - "Owner.${oid}.version == 1"
            - "Owner.${oid}.default_management_fee_pct == 22"

      - name: property_get_nonexistent_returns_not_found
        claim_type: "Not Found"
        grounds: [entities.Property]
        distinguishing_aspect: "GET /properties/{id} for a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /properties/00000000-0000-0000-0000-000000000000", payload: {}, as: PropertyManager, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: booking_missing_check_out_returns_validation
        claim_type: "Required Fields"
        grounds: [entities.Booking.fields.check_out]
        distinguishing_aspect: "POST /bookings omitting the required check_out field returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["A LISTED property and a guest."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /owners", payload: { legal_name: "Oa", email: "oa@x.com", default_management_fee_pct: 20 }, as: PlatformAdmin, captures: { oa: "$.data.id" } }
            - { call: "POST /properties", payload: { owner_id: "${oa}", address: "A", city: "Austin", state_code: "TX", jurisdiction_code: "TX-ATX", base_nightly_rate_cents: 20000, cleaning_fee_cents: 15000, max_occupancy: 6 }, as: PropertyManager, captures: { pa: "$.data.id" } }
            - { call: "POST /permits", payload: { property_id: "${pa}", permit_number: "PA", jurisdiction_code: "TX-ATX", occupancy_tax_pct: 10, issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }, as: PropertyManager, captures: { pma: "$.data.id" } }
            - { call: "POST /permits/${pma}/activate", payload: {}, as: PropertyManager }
            - { call: "POST /properties/${pa}/list", payload: {}, as: PropertyManager }
            - { call: "POST /guests", payload: { full_name: "Ga", email: "ga@x.com" }, as: Anonymous, captures: { ga: "$.data.id" } }
          trigger:
            - { call: "POST /bookings", payload: { property_id: "${pa}", guest_id: "${ga}", check_in: "2026-07-01T00:00:00Z" }, as: PropertyManager, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_VALIDATION"

      - name: guest_create_defaults_status_unscreened
        claim_type: Defaults
        grounds: [entities.Guest.fields.status]
        distinguishing_aspect: "POST /guests without status defaults status to UNSCREENED and government_id_verified to false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /guests", payload: { full_name: "Zed", email: "z@x.com" }, as: Anonymous, captures: { gid: "$.data.id", st: "$.data.status", gv: "$.data.government_id_verified" } }
          assert:
            - "Guest.${gid}.status == UNSCREENED"
            - "Guest.${gid}.government_id_verified == false"

      - name: vendor_invalid_vendor_type_enum_returns_validation
        claim_type: "Type Constraints"
        grounds: [entities.Vendor.fields.vendor_type]
        distinguishing_aspect: "POST /vendors with vendor_type not in {CLEANER, INSPECTOR, MAINTENANCE, GENERAL} returns ERR_VALIDATION."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /vendors", payload: { name: "Bad", vendor_type: "PLUMBER", email: "b@x.com" }, as: PropertyManager, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_VALIDATION"

      - name: property_list_pagination_envelope
        claim_type: Listing
        grounds: [entities.Property]
        distinguishing_aspect: "GET /properties?owner_id= returns an array response with pagination fields total_count and has_more."
        test_recipe:
          setup: ["One owner with one property."]
          setup_api_calls:
            - { call: "POST /owners", payload: { legal_name: "Ob", email: "ob@x.com", default_management_fee_pct: 20 }, as: PlatformAdmin, captures: { ob: "$.data.id" } }
            - { call: "POST /properties", payload: { owner_id: "${ob}", address: "B", city: "Austin", state_code: "TX", jurisdiction_code: "TX-ATX", base_nightly_rate_cents: 20000, cleaning_fee_cents: 15000, max_occupancy: 6 }, as: PropertyManager, captures: { pb: "$.data.id" } }
          trigger:
            - { call: "GET /properties", payload: { owner_id: "${ob}" }, as: PropertyManager }
          assert:
            - "response_type == array"
            - "meta.total_count == 1 and has_more == false"

  # =====================================================================
  - section: state_machines
    instances:
      - name: confirm_from_cancelled_returns_invalid_state
        claim_type: "Invalid Transitions"
        grounds: [state_machines.Booking.HOLD_to_CONFIRMED]
        distinguishing_aspect: "Confirming a booking whose stay_status is CANCELLED returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A CANCELLED HOLD booking (cancelled before confirmation)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /owners", payload: { legal_name: "Oc", email: "oc@x.com", default_management_fee_pct: 20 }, as: PlatformAdmin, captures: { oc: "$.data.id" } }
            - { call: "POST /properties", payload: { owner_id: "${oc}", address: "C", city: "Austin", state_code: "TX", jurisdiction_code: "TX-ATX", base_nightly_rate_cents: 20000, cleaning_fee_cents: 15000, max_occupancy: 6 }, as: PropertyManager, captures: { pc: "$.data.id" } }
            - { call: "POST /permits", payload: { property_id: "${pc}", permit_number: "PC", jurisdiction_code: "TX-ATX", occupancy_tax_pct: 10, issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }, as: PropertyManager, captures: { pmc: "$.data.id" } }
            - { call: "POST /permits/${pmc}/activate", payload: {}, as: PropertyManager }
            - { call: "POST /properties/${pc}/list", payload: {}, as: PropertyManager }
            - { call: "POST /guests", payload: { full_name: "Gc", email: "gc@x.com" }, as: Anonymous, captures: { gc: "$.data.id" } }
            - { call: "POST /bookings", payload: { property_id: "${pc}", guest_id: "${gc}", check_in: "2026-07-01T00:00:00Z", check_out: "2026-07-04T00:00:00Z" }, as: PropertyManager, captures: { bc: "$.data.id" } }
            - { call: "POST /bookings/${bc}/cancel", payload: {}, as: PropertyManager }
          trigger:
            - { call: "POST /bookings/${bc}/confirm", payload: {}, as: PropertyManager, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: offboarded_property_list_returns_invalid_state
        claim_type: "Terminal State Lockdown"
        grounds: [state_machines.Property.LISTED_to_OFFBOARDED]
        distinguishing_aspect: "Listing an OFFBOARDED (terminal) property returns ERR_INVALID_STATE — no transitions leave a terminal state."
        test_recipe:
          setup: ["An OFFBOARDED property."]
          setup_api_calls:
            - { call: "POST /owners", payload: { legal_name: "Od", email: "od@x.com", default_management_fee_pct: 20 }, as: PlatformAdmin, captures: { od: "$.data.id" } }
            - { call: "POST /properties", payload: { owner_id: "${od}", address: "D", city: "Austin", state_code: "TX", jurisdiction_code: "TX-ATX", base_nightly_rate_cents: 20000, cleaning_fee_cents: 15000, max_occupancy: 6 }, as: PropertyManager, captures: { pd: "$.data.id" } }
            - { call: "POST /properties/${pd}/offboard", payload: {}, as: PropertyManager }
          trigger:
            - { call: "POST /properties/${pd}/list", payload: {}, as: PropertyManager, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_STATE"
            - "Property.${pd}.status == OFFBOARDED"

      - name: permit_revoke_unlists_property
        claim_type: "Cross-entity"
        grounds: [state_machines.Permit.ACTIVE_to_REVOKED, state_machines.Property.LISTED_to_UNLISTED]
        distinguishing_aspect: "Revoking a LISTED property's ACTIVE permit transitions the Property from LISTED to UNLISTED (cross-entity side effect)."
        test_recipe:
          setup: ["A LISTED property with an ACTIVE permit."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /owners", payload: { legal_name: "Oe", email: "oe@x.com", default_management_fee_pct: 20 }, as: PlatformAdmin, captures: { oe: "$.data.id" } }
            - { call: "POST /properties", payload: { owner_id: "${oe}", address: "E", city: "Austin", state_code: "TX", jurisdiction_code: "TX-ATX", base_nightly_rate_cents: 20000, cleaning_fee_cents: 15000, max_occupancy: 6 }, as: PropertyManager, captures: { pe: "$.data.id" } }
            - { call: "POST /permits", payload: { property_id: "${pe}", permit_number: "PE", jurisdiction_code: "TX-ATX", occupancy_tax_pct: 10, issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }, as: PropertyManager, captures: { pme: "$.data.id" } }
            - { call: "POST /permits/${pme}/activate", payload: {}, as: PropertyManager }
            - { call: "POST /properties/${pe}/list", payload: {}, as: PropertyManager }
          trigger:
            - { call: "POST /permits/${pme}/revoke", payload: {}, as: PropertyManager }
          assert:
            - "Permit.${pme}.status == REVOKED"
            - "Property.${pe}.status == UNLISTED"

      - name: inspection_pass_sets_turnover_inspected
        claim_type: "Side Effect Execution"
        grounds: [state_machines.TurnoverTask.CLEANED_to_INSPECTED]
        distinguishing_aspect: "Recording an inspection with result PASS on a CLEANED turnover transitions that turnover to INSPECTED."
        test_recipe:
          setup: ["A CLEANED turnover task with distinct cleaner and inspector vendors."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /owners", payload: { legal_name: "Of", email: "of@x.com", default_management_fee_pct: 20 }, as: PlatformAdmin, captures: { of: "$.data.id" } }
            - { call: "POST /properties", payload: { owner_id: "${of}", address: "F", city: "Austin", state_code: "TX", jurisdiction_code: "TX-ATX", base_nightly_rate_cents: 20000, cleaning_fee_cents: 15000, max_occupancy: 6 }, as: PropertyManager, captures: { pf: "$.data.id" } }
            - { call: "POST /permits", payload: { property_id: "${pf}", permit_number: "PF", jurisdiction_code: "TX-ATX", occupancy_tax_pct: 10, issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }, as: PropertyManager, captures: { pmf: "$.data.id" } }
            - { call: "POST /permits/${pmf}/activate", payload: {}, as: PropertyManager }
            - { call: "POST /properties/${pf}/list", payload: {}, as: PropertyManager }
            - { call: "POST /guests", payload: { full_name: "Gf", email: "gf@x.com" }, as: Anonymous, captures: { gf: "$.data.id" } }
            - { call: "POST /bookings", payload: { property_id: "${pf}", guest_id: "${gf}", check_in: "2026-07-01T00:00:00Z", check_out: "2026-07-04T00:00:00Z" }, as: PropertyManager, captures: { bf: "$.data.id" } }
            - { call: "POST /vendors", payload: { name: "Clf", vendor_type: "CLEANER", email: "clf@x.com" }, as: PropertyManager, captures: { vcf: "$.data.id" } }
            - { call: "POST /vendors", payload: { name: "Inf", vendor_type: "INSPECTOR", email: "inf@x.com" }, as: PropertyManager, captures: { vif: "$.data.id" } }
            - { call: "POST /turnover-tasks", payload: { booking_id: "${bf}", property_id: "${pf}", assigned_vendor_id: "${vcf}", scheduled_window_start: "2026-07-04T10:00:00Z", scheduled_window_end: "2026-07-04T13:00:00Z" }, as: PropertyManager, captures: { tf: "$.data.id" } }
            - { call: "POST /turnover-tasks/${tf}/start", payload: {}, as: Vendor, as_user_id: "${vcf}" }
            - { call: "POST /turnover-tasks/${tf}/complete", payload: {}, as: Vendor, as_user_id: "${vcf}" }
          trigger:
            - { call: "POST /inspections", payload: { turnover_task_id: "${tf}", inspector_vendor_id: "${vif}", result: "PASS" }, as: PropertyManager, captures: { iid: "$.data.id" } }
          assert:
            - "TurnoverTask.${tf}.status == INSPECTED"
            - "Inspection.${iid}.status == COMPLETED"

      - name: review_publish_then_suppress
        claim_type: "Valid Transition"
        grounds: [state_machines.Review.SUBMITTED_to_PUBLISHED, state_machines.Review.PUBLISHED_to_SUPPRESSED]
        distinguishing_aspect: "A SUBMITTED review can be published then suppressed, ending in terminal SUPPRESSED."
        test_recipe:
          setup: ["A CHECKED_OUT booking with a SUBMITTED review."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /owners", payload: { legal_name: "Og", email: "og@x.com", default_management_fee_pct: 20 }, as: PlatformAdmin, captures: { og: "$.data.id" } }
            - { call: "POST /properties", payload: { owner_id: "${og}", address: "G", city: "Austin", state_code: "TX", jurisdiction_code: "TX-ATX", base_nightly_rate_cents: 20000, cleaning_fee_cents: 15000, max_occupancy: 6 }, as: PropertyManager, captures: { pg: "$.data.id" } }
            - { call: "POST /permits", payload: { property_id: "${pg}", permit_number: "PG", jurisdiction_code: "TX-ATX", occupancy_tax_pct: 10, issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }, as: PropertyManager, captures: { pmg: "$.data.id" } }
            - { call: "POST /permits/${pmg}/activate", payload: {}, as: PropertyManager }
            - { call: "POST /properties/${pg}/list", payload: {}, as: PropertyManager }
            - { call: "POST /guests", payload: { full_name: "Gg", email: "gg@x.com" }, as: Anonymous, captures: { gg: "$.data.id" } }
            - { call: "POST /bookings", payload: { property_id: "${pg}", guest_id: "${gg}", check_in: "2026-06-05T00:00:00Z", check_out: "2026-06-06T00:00:00Z" }, as: PropertyManager, captures: { bg: "$.data.id" } }
            - { call: "POST /bookings/${bg}/screen", payload: { decision: "APPROVED" }, as: PropertyManager }
            - { call: "POST /bookings/${bg}/confirm", payload: {}, as: PropertyManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /bookings/${bg}/check-in", payload: {}, as: PropertyManager }
            - { call: "POST /bookings/${bg}/check-out", payload: {}, as: PropertyManager }
            - { call: "POST /reviews", payload: { booking_id: "${bg}", property_id: "${pg}", rating: 5, author_role: "GUEST" }, as: PropertyManager, captures: { rid: "$.data.id" } }
          trigger:
            - { call: "POST /reviews/${rid}/publish", payload: {}, as: PropertyManager, captures: { s1: "$.data.status" } }
            - { call: "POST /reviews/${rid}/suppress", payload: {}, as: PropertyManager, captures: { s2: "$.data.status" } }
          assert:
            - "s1 == PUBLISHED"
            - "Review.${rid}.status == SUPPRESSED"

      - name: turnover_cancel_cascades_inspection
        claim_type: "Conditional cascade"
        grounds: [state_machines.TurnoverTask.CLEANED_to_CANCELLED, state_machines.Inspection.COMPLETED_to_CANCELLED]
        distinguishing_aspect: "Cancelling a turnover that has a COMPLETED inspection cascades that inspection to CANCELLED (direct turnover cancel, not via booking/offboard)."
        test_recipe:
          setup: ["A CLEANED turnover with a COMPLETED FAIL inspection (turnover FAILED)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /owners", payload: { legal_name: "Oh", email: "oh@x.com", default_management_fee_pct: 20 }, as: PlatformAdmin, captures: { oh: "$.data.id" } }
            - { call: "POST /properties", payload: { owner_id: "${oh}", address: "H", city: "Austin", state_code: "TX", jurisdiction_code: "TX-ATX", base_nightly_rate_cents: 20000, cleaning_fee_cents: 15000, max_occupancy: 6 }, as: PropertyManager, captures: { ph: "$.data.id" } }
            - { call: "POST /permits", payload: { property_id: "${ph}", permit_number: "PH", jurisdiction_code: "TX-ATX", occupancy_tax_pct: 10, issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }, as: PropertyManager, captures: { pmh: "$.data.id" } }
            - { call: "POST /permits/${pmh}/activate", payload: {}, as: PropertyManager }
            - { call: "POST /properties/${ph}/list", payload: {}, as: PropertyManager }
            - { call: "POST /guests", payload: { full_name: "Gh", email: "gh@x.com" }, as: Anonymous, captures: { gh: "$.data.id" } }
            - { call: "POST /bookings", payload: { property_id: "${ph}", guest_id: "${gh}", check_in: "2026-07-01T00:00:00Z", check_out: "2026-07-04T00:00:00Z" }, as: PropertyManager, captures: { bh: "$.data.id" } }
            - { call: "POST /vendors", payload: { name: "Clh", vendor_type: "CLEANER", email: "clh@x.com" }, as: PropertyManager, captures: { vch: "$.data.id" } }
            - { call: "POST /vendors", payload: { name: "Inh", vendor_type: "INSPECTOR", email: "inh@x.com" }, as: PropertyManager, captures: { vih: "$.data.id" } }
            - { call: "POST /turnover-tasks", payload: { booking_id: "${bh}", property_id: "${ph}", assigned_vendor_id: "${vch}", scheduled_window_start: "2026-07-04T10:00:00Z", scheduled_window_end: "2026-07-04T13:00:00Z" }, as: PropertyManager, captures: { th: "$.data.id" } }
            - { call: "POST /turnover-tasks/${th}/start", payload: {}, as: Vendor, as_user_id: "${vch}" }
            - { call: "POST /turnover-tasks/${th}/complete", payload: {}, as: Vendor, as_user_id: "${vch}" }
            - { call: "POST /inspections", payload: { turnover_task_id: "${th}", inspector_vendor_id: "${vih}", result: "FAIL" }, as: PropertyManager, captures: { ih: "$.data.id" } }
          trigger:
            - { call: "POST /turnover-tasks/${th}/cancel", payload: {}, as: PropertyManager }
          assert:
            - "TurnoverTask.${th}.status == CANCELLED"
            - "Inspection.${ih}.status == CANCELLED"

  # =====================================================================
  - section: calculations
    instances:
      - name: booking_total_tax_computation_correct
        claim_type: "Correct Result"
        grounds: [calculations.booking_total, entities.Booking.fields.total_cents]
        distinguishing_aspect: "A 3-night booking (base 20000, cleaning 15000, tax 10%) computes nightly_subtotal 60000, occupancy_tax 7500, total 82500 at creation."
        test_recipe:
          setup: ["LISTED property base 20000, cleaning 15000, permit tax 10%, clock 2026-06-01, booking check_in 2026-07-01 (no last-minute), occupancy 0."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /owners", payload: { legal_name: "Oi", email: "oi@x.com", default_management_fee_pct: 20 }, as: PlatformAdmin, captures: { oi: "$.data.id" } }
            - { call: "POST /properties", payload: { owner_id: "${oi}", address: "I", city: "Austin", state_code: "TX", jurisdiction_code: "TX-ATX", base_nightly_rate_cents: 20000, cleaning_fee_cents: 15000, max_occupancy: 6 }, as: PropertyManager, captures: { pi: "$.data.id" } }
            - { call: "POST /permits", payload: { property_id: "${pi}", permit_number: "PI", jurisdiction_code: "TX-ATX", occupancy_tax_pct: 10, issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }, as: PropertyManager, captures: { pmi: "$.data.id" } }
            - { call: "POST /permits/${pmi}/activate", payload: {}, as: PropertyManager }
            - { call: "POST /properties/${pi}/list", payload: {}, as: PropertyManager }
            - { call: "POST /guests", payload: { full_name: "Gi", email: "gi@x.com" }, as: Anonymous, captures: { gi: "$.data.id" } }
          trigger:
            - { call: "POST /bookings", payload: { property_id: "${pi}", guest_id: "${gi}", check_in: "2026-07-01T00:00:00Z", check_out: "2026-07-04T00:00:00Z" }, as: PropertyManager, captures: { bi: "$.data.id" } }
          assert:
            - "Booking.${bi}.nightly_subtotal_cents == 60000"
            - "Booking.${bi}.occupancy_tax_cents == 7500"
            - "Booking.${bi}.total_cents == 82500"

      - name: last_minute_discount_7day_inclusive_boundary
        claim_type: "Correct Result"
        grounds: [calculations.dynamic_nightly_quote]
        distinguishing_aspect: "A quote for check_in exactly LAST_MINUTE_DAYS (7) out applies the 0.85 last-minute factor: per_night = round_half_up(20000 * 0.85) = 17000."
        test_recipe:
          setup: ["LISTED property base 20000, no pricing rules, clock 2026-06-01, quote check_in 2026-06-08 (7 days out)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /owners", payload: { legal_name: "Oj", email: "oj@x.com", default_management_fee_pct: 20 }, as: PlatformAdmin, captures: { oj: "$.data.id" } }
            - { call: "POST /properties", payload: { owner_id: "${oj}", address: "J", city: "Austin", state_code: "TX", jurisdiction_code: "TX-ATX", base_nightly_rate_cents: 20000, cleaning_fee_cents: 15000, max_occupancy: 6 }, as: PropertyManager, captures: { pj: "$.data.id" } }
            - { call: "POST /permits", payload: { property_id: "${pj}", permit_number: "PJ", jurisdiction_code: "TX-ATX", occupancy_tax_pct: 10, issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }, as: PropertyManager, captures: { pmj: "$.data.id" } }
            - { call: "POST /permits/${pmj}/activate", payload: {}, as: PropertyManager }
            - { call: "POST /properties/${pj}/list", payload: {}, as: PropertyManager }
          trigger:
            - { call: "POST /properties/${pj}/quote", payload: { check_in: "2026-06-08T00:00:00Z", check_out: "2026-06-09T00:00:00Z" }, as: PropertyManager, captures: { pn: "$.data.per_night_rate_cents" } }
          assert:
            - "pn == 17000"

  # =====================================================================
  - section: validations
    instances:
      - name: mutation_missing_auth_headers_returns_unauthenticated
        claim_type: "Violation to Error"
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
