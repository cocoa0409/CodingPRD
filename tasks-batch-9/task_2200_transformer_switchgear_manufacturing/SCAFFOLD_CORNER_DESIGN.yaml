              captures: { supplier_id: "$.data.id" }
          trigger:
            - call: POST /suppliers/${supplier_id}/receipt-events
              payload: { event_count: 3 }
              as: MaterialsPlanner
          assert:
            - "HTTP 200 with data.receipt_event_count == 3."
            - "data.attributed_failure_count == 0."
            - "data.quality_index_trailing == 100 and data.quality_index_lifetime == 100."
            - "data.status == \"APPROVED\" and data.probation_entered_at is null."
            - "GET /suppliers/${supplier_id}/quality-summary as QualityEngineer reports the same two index values."

      - name: exact_drain_allocation_of_every_available_unit_is_accepted
        claim_type: correct_result
        grounds:
          - calculations.component_availability
          - endpoints[create_component_allocation]
        distinguishing_aspect: "q == quantity_available is the last accepted quantity (exact drain is legal); the boundary is q == quantity_available + 1, so a component with quantity_on_hand 5 must accept a 5-unit reservation and report quantity_available 0 afterwards."
        test_recipe:
