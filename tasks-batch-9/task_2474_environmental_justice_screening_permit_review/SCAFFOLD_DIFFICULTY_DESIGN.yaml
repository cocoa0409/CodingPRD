# =============================================================================
# §1.8 Scaffold Difficulty Design — task_2474 Environmental Justice Screening
# & Permit Review
#
# Nine §0.5 rule_ids x 2 instances = 18 instances. Every grounds ref resolves
# into SCAFFOLD.yaml §1.1-§1.7. Every numeric assert is a literal computed from
# the named calculation's formula and constants (Decimal, ROUND_HALF_UP).
# Logical clock default before any /_clock/set_current_utc call: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: ej_screen_score_basis_divergence_statewide_vs_county
        grounds:
          - calculations.ej_screen_score
          - calculations.designation
          - entities.ScreeningArea.fields.ej_screen_score_statewide
          - entities.ScreeningArea.fields.ej_screen_score_county
          - entities.ScreeningArea.fields.pollution_component_statewide
          - concurrency_rules[indicator-create-stale-area]
        distinguishing_aspect: |
          Domain is the ScreeningArea burden-scoring entity: the STATEWIDE and COUNTY
          variants read different percentile columns of the SAME four BurdenIndicator
          rows, so one area yields 74.03 on the statewide basis (OVERBURDENED) and
          39.68 on the county basis, a 34.35-point divergence that no single-variant
          implementation can produce.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "ScreeningArea AREA_A (BG-06-101, Kern county, population 4200, limited_english_pct 12.5, required_translation_languages [es], baseline_load_tpy 400.00)."
            - "Four ACTIVE vintage-2024 indicators: PM25 85.00/62.00 and DIESEL_PM 90.00/70.00 (POLLUTION), ASTHMA_ED_RATE 80.00/55.00 (HEALTH), POVERTY_RATE 88.00/65.00 (DEMOGRAPHIC)."
            - "No enforcement points, no facilities, no applications."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ej/screening-areas"
              payload: { area_code: "BG-06-101", county: "Kern", population: 4200, limited_english_pct: 12.5, required_translation_languages: ["es"], baseline_load_tpy: 400.00 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { area_a_id: $.data.id, area_a_v0: $.data.version }
            - call: "POST /ej/burden-indicators"
              payload: { screening_area_id: "${area_a_id}", indicator_code: "PM25", category: "POLLUTION", raw_value: 12.40, statewide_percentile: 85.00, county_percentile: 62.00, vintage_year: 2024, expected_screening_area_version: "${area_a_v0}" }
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { area_a_v1: $.data.area_version_after }
            - call: "POST /ej/burden-indicators"
              payload: { screening_area_id: "${area_a_id}", indicator_code: "DIESEL_PM", category: "POLLUTION", raw_value: 4.80, statewide_percentile: 90.00, county_percentile: 70.00, vintage_year: 2024, expected_screening_area_version: "${area_a_v1}" }
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { area_a_v2: $.data.area_version_after }
            - call: "POST /ej/burden-indicators"
              payload: { screening_area_id: "${area_a_id}", indicator_code: "ASTHMA_ED_RATE", category: "HEALTH", raw_value: 62.00, statewide_percentile: 80.00, county_percentile: 55.00, vintage_year: 2024, expected_screening_area_version: "${area_a_v2}" }
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { area_a_v3: $.data.area_version_after }
            - call: "POST /ej/burden-indicators"
              payload: { screening_area_id: "${area_a_id}", indicator_code: "POVERTY_RATE", category: "DEMOGRAPHIC", raw_value: 31.50, statewide_percentile: 88.00, county_percentile: 65.00, vintage_year: 2024, expected_screening_area_version: "${area_a_v3}" }
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { area_a_v4: $.data.area_version_after }
          trigger:
            - call: "GET /ej/screening-areas/${area_a_id}"
              payload: {}
              as: EJAnalyst
              as_user_id: "analyst-1"
          assert:
            - "ScreeningArea.${area_a_id}.pollution_component_statewide == 87.50"
            - "ScreeningArea.${area_a_id}.health_component_statewide == 80.00"
            - "ScreeningArea.${area_a_id}.demographic_component_statewide == 88.00"
            - "ScreeningArea.${area_a_id}.ej_screen_score_statewide == 74.03"
            - "ScreeningArea.${area_a_id}.ej_screen_score_county == 39.68"
            - "ScreeningArea.${area_a_id}.ej_screen_score_statewide - ScreeningArea.${area_a_id}.ej_screen_score_county == 34.35"
            - "ScreeningArea.${area_a_id}.designation == OVERBURDENED"
            - "ScreeningArea.${area_a_id}.translation_required == true"
            - "ScreeningArea.${area_a_id}.active_indicator_count == 4"
            - "ScreeningArea.${area_a_id}.data_status == CURRENT"
            - "ScreeningArea.${area_a_id}.enforcement_burden_points == 0"

      - name: cumulative_impact_screening_vs_refined_divergence
        grounds:
          - calculations.cumulative_impact_index
          - calculations.governing_assessment_selector
          - entities.CumulativeImpactAssessment.fields.exposure_factor
          - entities.CumulativeImpactAssessment.fields.disproportionate_flag
          - entities.PermitApplication.fields.pre_mitigation_index
          - state_machines.CumulativeImpactAssessment.DRAFT_to_SUPERSEDED
          - concurrency_rules[assessment-create-stale-application]
        distinguishing_aspect: |
          Domain is the CumulativeImpactAssessment methodology entity (not the
          ScreeningArea scoring entity of the sibling instance): SCREENING_LEVEL pins
          exposure_factor at 1.0000 giving 81.82 with disproportionate_flag true,
          while REFINED (dispersion 0.60 at 500 m -> exposure 0.4500) gives 65.32 with
          disproportionate_flag false on identical area and application inputs.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; AREA_A scored 74.03 statewide, OVERBURDENED, baseline_load_tpy 400.00."
            - "Facility FAC_A (MAJOR_SOURCE, 450 m from centroid) inside AREA_A."
            - "PermitApplication APP_A: NEW_SOURCE, proposed_emissions_tpy 80.00, submitted and screened onto the ENHANCED track."
            - "One CumulativeImpactAssessment of APP_A in DRAFT with method SCREENING_LEVEL (cumulative_impact_index 81.82)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ej/screening-areas"
              payload: { area_code: "BG-06-101", county: "Kern", population: 4200, limited_english_pct: 12.5, required_translation_languages: ["es"], baseline_load_tpy: 400.00 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { area_a_id: $.data.id, area_a_v0: $.data.version }
            - call: "POST /ej/burden-indicators"
              payload: { screening_area_id: "${area_a_id}", indicator_code: "PM25", category: "POLLUTION", raw_value: 12.40, statewide_percentile: 85.00, county_percentile: 62.00, vintage_year: 2024, expected_screening_area_version: "${area_a_v0}" }
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { area_a_v1: $.data.area_version_after }
            - call: "POST /ej/burden-indicators"
              payload: { screening_area_id: "${area_a_id}", indicator_code: "DIESEL_PM", category: "POLLUTION", raw_value: 4.80, statewide_percentile: 90.00, county_percentile: 70.00, vintage_year: 2024, expected_screening_area_version: "${area_a_v1}" }
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { area_a_v2: $.data.area_version_after }
            - call: "POST /ej/burden-indicators"
              payload: { screening_area_id: "${area_a_id}", indicator_code: "ASTHMA_ED_RATE", category: "HEALTH", raw_value: 62.00, statewide_percentile: 80.00, county_percentile: 55.00, vintage_year: 2024, expected_screening_area_version: "${area_a_v2}" }
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { area_a_v3: $.data.area_version_after }
            - call: "POST /ej/burden-indicators"
              payload: { screening_area_id: "${area_a_id}", indicator_code: "POVERTY_RATE", category: "DEMOGRAPHIC", raw_value: 31.50, statewide_percentile: 88.00, county_percentile: 65.00, vintage_year: 2024, expected_screening_area_version: "${area_a_v3}" }
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { area_a_v4: $.data.area_version_after }
            - call: "POST /ej/facilities"
              payload: { screening_area_id: "${area_a_id}", name: "Kern Rendering Plant", facility_type: "MAJOR_SOURCE", distance_to_area_centroid_m: 450 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { fac_a_id: $.data.id }
            - call: "POST /ej/permit-applications"
              payload: { facility_id: "${fac_a_id}", permit_type: "NEW_SOURCE", proposed_emissions_tpy: 80.00, proposed_operating_hours_per_year: 8000 }
              as: ApplicantRepresentative
              as_user_id: "${fac_a_id}"
              captures: { app_a_id: $.data.id }
            - call: "POST /ej/permit-applications/${app_a_id}/submit"
              payload: {}
              as: ApplicantRepresentative
              as_user_id: "${fac_a_id}"
            - call: "POST /ej/permit-applications/${app_a_id}/screen"
              payload: {}
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { app_a_v_screen: $.data.application_version_after }
            - call: "POST /ej/cumulative-impact-assessments"
              payload: { permit_application_id: "${app_a_id}", method: "SCREENING_LEVEL", expected_application_version: "${app_a_v_screen}" }
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { assess_screen_id: $.data.id, app_a_v_assess1: $.data.application_version_after }
          trigger:
            - call: "POST /ej/cumulative-impact-assessments"
              payload: { permit_application_id: "${app_a_id}", method: "REFINED", dispersion_factor: 0.60, receptor_distance_m: 500, expected_application_version: "${app_a_v_assess1}" }
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { assess_refined_id: $.data.id }
          assert:
            - "CumulativeImpactAssessment.${assess_screen_id}.cumulative_impact_index == 81.82"
            - "CumulativeImpactAssessment.${assess_screen_id}.exposure_factor == 1.0000"
            - "CumulativeImpactAssessment.${assess_screen_id}.disproportionate_flag == true"
            - "CumulativeImpactAssessment.${assess_screen_id}.status == SUPERSEDED"
            - "CumulativeImpactAssessment.${assess_refined_id}.exposure_factor == 0.4500"
            - "CumulativeImpactAssessment.${assess_refined_id}.baseline_burden_score == 74.03"
            - "CumulativeImpactAssessment.${assess_refined_id}.proposed_increment_pct == 20.00"
            - "CumulativeImpactAssessment.${assess_refined_id}.cumulative_impact_index == 65.32"
            - "CumulativeImpactAssessment.${assess_refined_id}.disproportionate_flag == false"
            - "CumulativeImpactAssessment.${assess_refined_id}.data_confidence == HIGH"
            - "CumulativeImpactAssessment.${assess_screen_id}.cumulative_impact_index - CumulativeImpactAssessment.${assess_refined_id}.cumulative_impact_index == 16.50"
            - "PermitApplication.${app_a_id}.pre_mitigation_index == 65.32"
            - "PermitApplication.${app_a_id}.residual_impact_index == 65.32"

  - rule_id: combinatorial_formula
    instances:
      - name: mitigation_credit_round_per_condition_then_sum
        grounds:
          - calculations.mitigation_credit_aggregation
          - calculations.residual_impact_index
          - entities.PermitCondition.fields.credit_tpy
          - entities.PermitApplication.fields.total_mitigation_credit_tpy
          - entities.PermitApplication.fields.approved_net_emissions_tpy
          - concurrency_rules[condition-create-stale-application]
        distinguishing_aspect: |
          Mode (b) nested rounding order: three identical MONITORING conditions of
          12.35 tpy each produce raw products of 1.235, so round-per-condition-then-sum
          yields 1.24 x 3 == 3.72 while the sum-then-round reading yields 3.71 - the
          two readings are separated by a single cent that then moves residual_impact_index.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; AREA_A scored 74.03 statewide, OVERBURDENED."
            - "Facility FAC_A (MAJOR_SOURCE, 450 m) and APP_A with proposed_emissions_tpy 80.00 on the ENHANCED track."
            - "APP_A has an ACCEPTED SCREENING_LEVEL assessment: pre_mitigation_index 81.82, residual_impact_index 81.82, no conditions yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ej/screening-areas"
              payload: { area_code: "BG-06-101", county: "Kern", population: 4200, limited_english_pct: 12.5, required_translation_languages: ["es"], baseline_load_tpy: 400.00 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { area_a_id: $.data.id, area_a_v0: $.data.version }
            - call: "POST /ej/burden-indicators"
              payload: { screening_area_id: "${area_a_id}", indicator_code: "PM25", category: "POLLUTION", raw_value: 12.40, statewide_percentile: 85.00, county_percentile: 62.00, vintage_year: 2024, expected_screening_area_version: "${area_a_v0}" }
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { area_a_v1: $.data.area_version_after }
            - call: "POST /ej/burden-indicators"
              payload: { screening_area_id: "${area_a_id}", indicator_code: "DIESEL_PM", category: "POLLUTION", raw_value: 4.80, statewide_percentile: 90.00, county_percentile: 70.00, vintage_year: 2024, expected_screening_area_version: "${area_a_v1}" }
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { area_a_v2: $.data.area_version_after }
            - call: "POST /ej/burden-indicators"
              payload: { screening_area_id: "${area_a_id}", indicator_code: "ASTHMA_ED_RATE", category: "HEALTH", raw_value: 62.00, statewide_percentile: 80.00, county_percentile: 55.00, vintage_year: 2024, expected_screening_area_version: "${area_a_v2}" }
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { area_a_v3: $.data.area_version_after }
            - call: "POST /ej/burden-indicators"
              payload: { screening_area_id: "${area_a_id}", indicator_code: "POVERTY_RATE", category: "DEMOGRAPHIC", raw_value: 31.50, statewide_percentile: 88.00, county_percentile: 65.00, vintage_year: 2024, expected_screening_area_version: "${area_a_v3}" }
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { area_a_v4: $.data.area_version_after }
            - call: "POST /ej/facilities"
              payload: { screening_area_id: "${area_a_id}", name: "Kern Rendering Plant", facility_type: "MAJOR_SOURCE", distance_to_area_centroid_m: 450 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { fac_a_id: $.data.id }
            - call: "POST /ej/permit-applications"
              payload: { facility_id: "${fac_a_id}", permit_type: "NEW_SOURCE", proposed_emissions_tpy: 80.00, proposed_operating_hours_per_year: 8000 }
              as: ApplicantRepresentative
              as_user_id: "${fac_a_id}"
              captures: { app_a_id: $.data.id }
            - call: "POST /ej/permit-applications/${app_a_id}/submit"
              payload: {}
              as: ApplicantRepresentative
              as_user_id: "${fac_a_id}"
            - call: "POST /ej/permit-applications/${app_a_id}/screen"
              payload: {}
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { app_a_v_screen: $.data.application_version_after }
            - call: "POST /ej/cumulative-impact-assessments"
              payload: { permit_application_id: "${app_a_id}", method: "SCREENING_LEVEL", expected_application_version: "${app_a_v_screen}" }
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { assess_a_id: $.data.id }
            - call: "POST /ej/cumulative-impact-assessments/${assess_a_id}/submit-qa"
              payload: {}
              as: EJAnalyst
              as_user_id: "analyst-1"
            - call: "POST /ej/cumulative-impact-assessments/${assess_a_id}/qa-decision"
              payload: { outcome: "ACCEPT", note: "methodology verified" }
              as: QAReviewer
              as_user_id: "qa-1"
              captures: { app_a_v_accept: $.data.application_version_after }
          trigger:
            - call: "POST /ej/permit-conditions"
              payload: { permit_application_id: "${app_a_id}", condition_type: "MONITORING", reduction_tpy: 12.35, enforceable: false, monitoring_frequency: "QUARTERLY", expected_application_version: "${app_a_v_accept}" }
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { cond_1_id: $.data.id, app_a_v_c1: $.data.application_version_after }
            - call: "POST /ej/permit-conditions"
              payload: { permit_application_id: "${app_a_id}", condition_type: "MONITORING", reduction_tpy: 12.35, enforceable: false, monitoring_frequency: "QUARTERLY", expected_application_version: "${app_a_v_c1}" }
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { cond_2_id: $.data.id, app_a_v_c2: $.data.application_version_after }
            - call: "POST /ej/permit-conditions"
              payload: { permit_application_id: "${app_a_id}", condition_type: "MONITORING", reduction_tpy: 12.35, enforceable: false, monitoring_frequency: "CONTINUOUS", expected_application_version: "${app_a_v_c2}" }
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { cond_3_id: $.data.id, app_a_v_c3: $.data.application_version_after }
          assert:
            - "PermitCondition.${cond_1_id}.credit_tpy == 1.24"
            - "PermitCondition.${cond_2_id}.credit_tpy == 1.24"
            - "PermitCondition.${cond_3_id}.credit_tpy == 1.24"
            - "PermitApplication.${app_a_id}.total_mitigation_credit_tpy == 3.72"
            - "PermitApplication.${app_a_id}.total_mitigation_credit_tpy != 3.71  # 3.71 is the forbidden sum-then-round reading of round(3.705, 2)"
            - "PermitApplication.${app_a_id}.approved_net_emissions_tpy == 76.28"
            - "PermitApplication.${app_a_id}.pre_mitigation_index == 81.82"
            - "PermitApplication.${app_a_id}.residual_impact_index == 78.02"
            - "PermitApplication.${app_a_id}.status == ENHANCED_REVIEW"

      - name: community_benefit_surcharge_tier_keyed_on_base_not_total
        grounds:
          - calculations.community_benefit_obligation
          - calculations.residual_impact_index
          - calculations.participation_adequacy
          - entities.PermitDecision.fields.community_benefit_surcharge_usd
          - entities.PermitDecision.fields.community_benefit_total_usd
          - state_machines.PermitApplication.PENDING_DECISION_to_ISSUED
          - validations[priority=34]
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the surcharge tier is keyed on the
          request's community_benefit_base_usd (95,000.00 -> rate 0.05), never on the
          community_benefit_total_usd it feeds; the pinned order yields surcharge
          5,225.00 / total 100,225.00 whereas the circular reading (tier read off the
          103,360.00 total, rate 0.08) yields 8,360.00 / 103,360.00.
        test_recipe:
          setup:
            - "Clock advanced to 2026-10-10T09:00:00Z by the end of setup."
            - "AREA_A OVERBURDENED (74.03 statewide, baseline_load_tpy 400.00, permitted_load_tpy 0.00), translation_required true with required_translation_languages [es]."
            - "APP_A (80.00 tpy, ENHANCED track) with an ACCEPTED SCREENING_LEVEL assessment (81.82) authored by analyst-1 and QA-accepted by qa-1."
            - "Its ParticipationPlan required_comment_days 70, translated materials published in es, opened 2026-08-01 and closed 2026-10-10 with adequacy_status COMPLIANT (one accessible meeting already ended)."
            - "One ACTIVE ADDITIONAL_CONTROL condition of 30.00 tpy, enforceable: total_mitigation_credit_tpy 30.00, approved_net_emissions_tpy 50.00, residual_impact_index 51.14."
            - "APP_A in PENDING_DECISION."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ej/screening-areas"
              payload: { area_code: "BG-06-101", county: "Kern", population: 4200, limited_english_pct: 12.5, required_translation_languages: ["es"], baseline_load_tpy: 400.00 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { area_a_id: $.data.id, area_a_v0: $.data.version }
            - call: "POST /ej/burden-indicators"
              payload: { screening_area_id: "${area_a_id}", indicator_code: "PM25", category: "POLLUTION", raw_value: 12.40, statewide_percentile: 85.00, county_percentile: 62.00, vintage_year: 2024, expected_screening_area_version: "${area_a_v0}" }
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { area_a_v1: $.data.area_version_after }
            - call: "POST /ej/burden-indicators"
              payload: { screening_area_id: "${area_a_id}", indicator_code: "DIESEL_PM", category: "POLLUTION", raw_value: 4.80, statewide_percentile: 90.00, county_percentile: 70.00, vintage_year: 2024, expected_screening_area_version: "${area_a_v1}" }
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { area_a_v2: $.data.area_version_after }
            - call: "POST /ej/burden-indicators"
              payload: { screening_area_id: "${area_a_id}", indicator_code: "ASTHMA_ED_RATE", category: "HEALTH", raw_value: 62.00, statewide_percentile: 80.00, county_percentile: 55.00, vintage_year: 2024, expected_screening_area_version: "${area_a_v2}" }
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { area_a_v3: $.data.area_version_after }
            - call: "POST /ej/burden-indicators"
              payload: { screening_area_id: "${area_a_id}", indicator_code: "POVERTY_RATE", category: "DEMOGRAPHIC", raw_value: 31.50, statewide_percentile: 88.00, county_percentile: 65.00, vintage_year: 2024, expected_screening_area_version: "${area_a_v3}" }
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { area_a_v4: $.data.area_version_after }
            - call: "POST /ej/facilities"
              payload: { screening_area_id: "${area_a_id}", name: "Kern Rendering Plant", facility_type: "MAJOR_SOURCE", distance_to_area_centroid_m: 450 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { fac_a_id: $.data.id }
            - call: "POST /ej/venues"
              payload: { name: "Lamont Community Hall", address: "8600 Main St, Lamont CA", capacity: 120, transit_accessible: true, ada_accessible: true, interpretation_capable: true }
