  - rule_id: resource_temporal_overlap
    instances:
      - name: enrollment_window_within_course_delivery
        grounds:
          - validations[priority=9]
          - entities.Course.fields.delivery_start
          - entities.Course.fields.delivery_end
        distinguishing_aspect: |
          Half-open delivery-window semantics on Course: enrollment at the
          instant clock == delivery_start is legal (inclusive lower bound)
          while enrollment at clock == delivery_end is rejected
          ERR_WINDOW_CLOSED (exclusive upper bound) — adjacency treated
          asymmetrically.
        test_recipe:
          setup:
            - "CHARTERED member m1, counselor c1; course crs with delivery window [2026-09-10T00:00:00Z, 2026-09-20T00:00:00Z)"
          setup_api_calls:
