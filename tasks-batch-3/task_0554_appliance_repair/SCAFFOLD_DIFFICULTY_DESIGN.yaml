          assert:
            - "${err_id} == ERR_SAFETY_RECALL_HOLD"
            - "ServiceRequest.${sr_id}.status == INTAKE"

      - name: schedule_blocked_by_technician_off_duty
        grounds:
          - state_machines.ServiceRequest.INTAKE_to_SCHEDULED
          - state_machines.Technician.ON_DUTY_to_OFF_DUTY
          - errors[ERR_TECHNICIAN_OFF_DUTY]
