            - "ShipperAccount.${sh}.total_shipment_count == 0"

      - name: dimension_scans_are_append_only_rows_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.DimensionScan.fields.scanned_length_in
          - entities.DimensionScan.fields.tolerance_status
          - entities.Shipment.fields.billable_weight_lbs
        distinguishing_aspect: |
          DimensionScan is declared common_fields false, so its rows expose id and created_at
          but no version and no updated_at; a second scan appends a second immutable row
          instead of mutating the first, and the first row's scanned_length_in is unchanged
          afterwards even though the Shipment's governing measurement moved on.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE with an ACTIVE contract C1 (divisor 139) and ServiceLevel EXPRESS."
            - "Shipment 1Z-I-0001 is declared 10 x 10 x 20 in at 30.0 lb, zone 2 (cube 2000 in3, billable 30 lb on basis ACTUAL)."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel" }
              as: CarrierAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v}" }
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-I-0001", zone: 2, residential_declared: false, declared_length_in: 10, declared_width_in: 10, declared_height_in: 20, declared_weight_lbs: 30.0 }
              as: CarrierOps
              captures: { p: $.data.id, p_v1: $.data.version }
          trigger:
            - call: "POST /shipments/${p}/scans"
              payload: { scan_source: "AUTOMATED_DWS", scanned_length_in: 10, scanned_width_in: 10, scanned_height_in: 20, scanned_weight_lbs: 30.0, expected_shipment_version: "${p_v1}" }
              as: CarrierOps
              captures: { scan_a: $.data.id }
            - call: "GET /shipments/${p}"
              payload: {}
              as: CarrierOps
              captures: { p_v2: $.data.version }
            - call: "POST /shipments/${p}/scans"
              payload: { scan_source: "AUTOMATED_DWS", scanned_length_in: 10, scanned_width_in: 10, scanned_height_in: 21, scanned_weight_lbs: 30.0, expected_shipment_version: "${p_v2}" }
              as: CarrierOps
