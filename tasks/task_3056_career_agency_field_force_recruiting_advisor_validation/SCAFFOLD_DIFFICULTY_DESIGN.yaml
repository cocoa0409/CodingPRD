  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: securities_activation_gated_by_prerequisite_registration
        grounds:
          - state_machines.Advisor.PENDING_to_ACTIVE
          - entities.SecuritiesRegistration.fields.prerequisite_registration_id
          - calculations.appointment_sequencing_gate
          - errors.ERR_PREREQUISITE_REGISTRATION_NOT_ACTIVE
        distinguishing_aspect: |
          Entity pair SecuritiesRegistration -> SecuritiesRegistration (self-referential):
          the dependant's PENDING->ACTIVE transition is gated by its prerequisite's
          status == ACTIVE, and flipping the prerequisite flips the dependant's outcome
          on an unchanged request.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One office and one REP holding a SERIES_6 registration PENDING and a SERIES_65 registration PENDING that declares SERIES_6 as its prerequisite."
          setup_api_calls:
            - call: "POST /agency/district-offices"
              payload: { office_code: "DO-901", name: "Appleton District", region_code: "MW", state_code: "WI", override_rate_pct: 0.03, override_cap_cents: 300000 }
              as: ManagingDirector
              captures: { office_id: $.data.id }
            - call: "POST /agency/advisors"
              payload: { full_name: "Kai Sequence", email: "kai.seq@agency.example", district_office_id: "${office_id}", rank: "REP" }
              as: ManagingDirector
              captures: { adv_id: $.data.id }
            - call: "POST /agency/securities-registrations"
              payload: { advisor_id: "${adv_id}", registration_type: "SERIES_6", crd_number: "CRD-9006", effective_date: "2026-09-01T00:00:00Z", expires_at: "2027-12-31T00:00:00Z" }
              as: LicensingCoordinator
              captures: { reg_s6_id: $.data.id }
            - call: "POST /agency/securities-registrations"
              payload: { advisor_id: "${adv_id}", registration_type: "SERIES_65", crd_number: "CRD-9065", effective_date: "2026-09-01T00:00:00Z", expires_at: "2027-12-31T00:00:00Z", prerequisite_registration_id: "${reg_s6_id}" }
              as: LicensingCoordinator
              captures: { reg_s65_id: $.data.id }
          trigger:
            - call: "POST /agency/securities-registrations/${reg_s65_id}/activate"
              payload: {}
              as: LicensingCoordinator
              captures: { err_id: $.data.error_id }
            - call: "POST /agency/securities-registrations/${reg_s6_id}/activate"
              payload: {}
              as: LicensingCoordinator
            - call: "POST /agency/securities-registrations/${reg_s65_id}/activate"
              payload: {}
              as: LicensingCoordinator
              captures: { reg_s65_act_id: $.data.id }
          assert:
            - "the first activate returns 409 with error_id == ERR_PREREQUISITE_REGISTRATION_NOT_ACTIVE and the SERIES_65 row is still PENDING"
            - "after the SERIES_6 activate succeeds, the identical SERIES_65 activate returns 200 with status == ACTIVE"
            - "SecuritiesRegistration.${reg_s65_act_id}.prerequisite_registration_id == ${reg_s6_id}"
            - "Advisor.${adv_id}.securities_registration_status == ACTIVE"

      - name: policy_activation_gated_by_advisor_licensing_dimensions
        grounds:
          - state_machines.Policy.ISSUED_to_ACTIVE
          - state_machines.Advisor.ACTIVE_to_LAPSED
          - calculations.appointment_sequencing_gate
          - errors.ERR_APPOINTMENT_NOT_APPROVED
        distinguishing_aspect: |
          Entity pair Policy -> Advisor: a policy's ISSUED->ACTIVE transition is gated by
          the writing advisor's THREE derived dimensions, and the refusal differs by which
          dimension is deficient — an ANNUITY policy with an ACTIVE securities registration
          but no APPROVED appointment fails on ERR_APPOINTMENT_NOT_APPROVED, a different
          error from the LIFE arm that fails on ERR_LICENSE_NOT_ACTIVE.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One office, one REP with an ACTIVE LIFE licence, an ACTIVE SERIES_6 registration and NO carrier appointment. Two ISSUED policies: a LIFE one and an ANNUITY one."
          setup_api_calls:
            - call: "POST /agency/district-offices"
              payload: { office_code: "DO-902", name: "Oshkosh District", region_code: "MW", state_code: "WI", override_rate_pct: 0.03, override_cap_cents: 300000 }
              as: ManagingDirector
              captures: { office_id: $.data.id }
            - call: "POST /agency/advisors"
              payload: { full_name: "Lena Gate", email: "lena.gate@agency.example", district_office_id: "${office_id}", rank: "REP" }
              as: ManagingDirector
              captures: { adv_id: $.data.id }
            - call: "POST /agency/advisors/${adv_id}/licensing/lock-remediation"
              payload: {}
              as: ManagingDirector
            - call: "POST /agency/product-licenses"
              payload: { advisor_id: "${adv_id}", product_line: "LIFE", license_number: "WI-LIFE-9002", effective_date: "2026-01-01T00:00:00Z", expires_at: "2027-12-31T00:00:00Z", appointment_required: true }
              as: LicensingCoordinator
              captures: { lic_id: $.data.id }
            - call: "POST /agency/product-licenses/${lic_id}/activate"
              payload: {}
              as: LicensingCoordinator
            - call: "POST /agency/securities-registrations"
              payload: { advisor_id: "${adv_id}", registration_type: "SERIES_6", crd_number: "CRD-9002", effective_date: "2026-01-01T00:00:00Z", expires_at: "2027-12-31T00:00:00Z" }
              as: LicensingCoordinator
              captures: { reg_id: $.data.id }
            - call: "POST /agency/securities-registrations/${reg_id}/activate"
              payload: {}
              as: LicensingCoordinator
            - call: "POST /agency/policies"
              payload: { policy_number: "NM-9001", writing_advisor_id: "${adv_id}", carrier_name: "Northwestern Mutual", product_line: "LIFE", annual_premium_cents: 480000, issue_date: "2026-02-01T00:00:00Z", is_advanced_commission: true }
              as: ManagingDirector
              captures: { pol_life_id: $.data.id }
            - call: "POST /agency/policies"
              payload: { policy_number: "NM-9002", writing_advisor_id: "${adv_id}", carrier_name: "Northwestern Mutual", product_line: "ANNUITY", annual_premium_cents: 480000, issue_date: "2026-02-01T00:00:00Z", is_advanced_commission: true }
              as: ManagingDirector
              captures: { pol_ann_id: $.data.id }
          trigger:
            - call: "POST /agency/policies/${pol_life_id}/activate"
              payload: {}
              as: ManagingDirector
              captures: { err_id: $.data.error_id }
            - call: "POST /agency/carrier-appointments"
              payload: { advisor_id: "${adv_id}", requires_license_id: "${lic_id}", carrier_name: "Northwestern Mutual", state_code: "WI", requested_date: "2026-09-02T00:00:00Z" }
              as: LicensingCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /agency/carrier-appointments/${appt_id}/approve"
              payload: {}
              as: LicensingCoordinator
            - call: "POST /agency/policies/${pol_life_id}/activate"
              payload: {}
              as: ManagingDirector
              captures: { pol_life_act_id: $.data.id }
            - call: "POST /agency/policies/${pol_ann_id}/activate"
              payload: {}
              as: ManagingDirector
              captures: { pol_ann_act_id: $.data.id }
          assert:
            - "the first LIFE activate returns 409 with error_id == ERR_APPOINTMENT_NOT_APPROVED"
            - "Policy.${pol_life_act_id}.status == ACTIVE once the appointment is APPROVED (Advisor.appointment_status == APPROVED)"
            - "Policy.${pol_ann_act_id}.status == ACTIVE — the ANNUITY arm also satisfies the extra securities requirement because securities_registration_status == ACTIVE"
            - "Advisor.${adv_id}.insurance_license_status == ACTIVE and appointment_status == APPROVED"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: product_licence_half_open_interval_no_overlap_at_boundary
        grounds:
          - validations[priority=7]
          - errors.ERR_LICENSE_INTERVAL_OVERLAP
          - entities.ProductLicense.fields.expires_at
          - endpoints.POST_/agency/product-licenses
        distinguishing_aspect: |
          Half-open interval semantics: a LIFE licence running [2026-01-01, 2027-01-01) and
          a second LIFE licence starting exactly at 2027-01-01 are ALLOWED — the shared
          boundary instant is not an overlap — whereas a third licence starting at
          2026-12-31T23:59:59Z is refused with ERR_LICENSE_INTERVAL_OVERLAP.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One office and one REP already holding a LIFE licence over [2026-01-01T00:00:00Z, 2027-01-01T00:00:00Z)."
          setup_api_calls:
            - call: "POST /agency/district-offices"
              payload: { office_code: "DO-A01", name: "Eau Claire District", region_code: "MW", state_code: "WI", override_rate_pct: 0.03, override_cap_cents: 300000 }
              as: ManagingDirector
              captures: { office_id: $.data.id }
            - call: "POST /agency/advisors"
              payload: { full_name: "Mira Interval", email: "mira.int@agency.example", district_office_id: "${office_id}", rank: "REP" }
              as: ManagingDirector
              captures: { adv_id: $.data.id }
            - call: "POST /agency/product-licenses"
              payload: { advisor_id: "${adv_id}", product_line: "LIFE", license_number: "WI-LIFE-1001", effective_date: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z", appointment_required: true }
              as: LicensingCoordinator
              captures: { lic_1_id: $.data.id }
          trigger:
            - call: "POST /agency/product-licenses"
              payload: { advisor_id: "${adv_id}", product_line: "LIFE", license_number: "WI-LIFE-1002", effective_date: "2027-01-01T00:00:00Z", expires_at: "2028-01-01T00:00:00Z", appointment_required: true }
              as: LicensingCoordinator
              captures: { lic_2_id: $.data.id }
            - call: "POST /agency/product-licenses"
              payload: { advisor_id: "${adv_id}", product_line: "LIFE", license_number: "WI-LIFE-1003", effective_date: "2026-12-31T23:59:59Z", expires_at: "2027-06-01T00:00:00Z", appointment_required: true }
              as: LicensingCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "the boundary-adjacent create returns 201 with ProductLicense.${lic_2_id}.status == PENDING — [2026-01-01,2027-01-01) and [2027-01-01,2028-01-01) share no instant"
            - "the overlapping create returns 409 with error_id == ERR_LICENSE_INTERVAL_OVERLAP"
            - "GET /advisors/${adv_id}/product-licenses?product_line=LIFE returns exactly 2 rows, not 3"
            - "ProductLicense.${lic_1_id}.expires_at == 2027-01-01T00:00:00Z and is unchanged"

      - name: securities_registration_closed_interval_overlap_at_boundary
        grounds:
          - validations[priority=7]
          - errors.ERR_REGISTRATION_INTERVAL_OVERLAP
          - entities.SecuritiesRegistration.fields.expires_at
          - endpoints.POST_/agency/securities-registrations
        distinguishing_aspect: |
          Closed interval semantics on a DIFFERENT resource: a SERIES_6 registration over
          [2026-01-01, 2027-01-01] and a second SERIES_6 starting exactly at 2027-01-01 are
          REJECTED because the shared boundary instant IS an overlap for registrations —
          the exact opposite verdict from the half-open licence rule on the same dates.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One office and one REP already holding a SERIES_6 registration over the CLOSED interval [2026-01-01T00:00:00Z, 2027-01-01T00:00:00Z]."
          setup_api_calls:
            - call: "POST /agency/district-offices"
              payload: { office_code: "DO-A02", name: "Stevens Point District", region_code: "MW", state_code: "WI", override_rate_pct: 0.03, override_cap_cents: 300000 }
              as: ManagingDirector
              captures: { office_id: $.data.id }
            - call: "POST /agency/advisors"
              payload: { full_name: "Nico Closed", email: "nico.closed@agency.example", district_office_id: "${office_id}", rank: "REP" }
              as: ManagingDirector
              captures: { adv_id: $.data.id }
            - call: "POST /agency/securities-registrations"
              payload: { advisor_id: "${adv_id}", registration_type: "SERIES_6", crd_number: "CRD-A002", effective_date: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: LicensingCoordinator
              captures: { reg_1_id: $.data.id }
          trigger:
            - call: "POST /agency/securities-registrations"
              payload: { advisor_id: "${adv_id}", registration_type: "SERIES_6", crd_number: "CRD-A003", effective_date: "2027-01-01T00:00:00Z", expires_at: "2028-01-01T00:00:00Z" }
              as: LicensingCoordinator
              captures: { err_id: $.data.error_id }
            - call: "POST /agency/securities-registrations"
              payload: { advisor_id: "${adv_id}", registration_type: "SERIES_7", crd_number: "CRD-A007", effective_date: "2027-01-01T00:00:00Z", expires_at: "2028-01-01T00:00:00Z" }
              as: LicensingCoordinator
              captures: { reg_2_id: $.data.id }
          assert:
            - "the SERIES_6 create starting at the shared instant returns 409 with error_id == ERR_REGISTRATION_INTERVAL_OVERLAP"
            - "the SERIES_7 create at the SAME dates returns 201 — the overlap rule is scoped per registration_type, not per advisor"
            - "GET /advisors/${adv_id}/securities-registrations returns exactly 2 rows"
            - "SecuritiesRegistration.${reg_1_id}.status == PENDING and SecuritiesRegistration.${reg_2_id}.status == PENDING"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: reinstatement_preserves_only_unrecovered_chargeback_balance
        grounds:
          - state_machines.Policy.LAPSED_to_ACTIVE
          - state_machines.CommissionCredit.CHARGED_BACK_to_PAID
          - calculations.chargeback_assessment
          - entities.Advisor.fields.chargeback_balance_cents
        distinguishing_aspect: |
          Conserved quantity = the advisor's unrecovered chargeback balance. Lapse then
          reinstate with a partial 100000-cent recovery in between must leave
          chargeback_balance_cents at exactly 0 once the assessed amount is reversed AND
          must NOT refund the 100000 already recovered — the recovered money stays with
          the company, so the balance is a signed net, not a refund.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One office and one VALIDATED REP with an in-force policy whose 480000 annual premium produced a 204000-cent PRIMARY credit, now lapsed at 6 completed months and charged back 153000."
