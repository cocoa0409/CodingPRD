    side_effects: ["status=APPLICANT, version=1"]

  - method: GET
    path: "/agents"
    description: "List Agents"
    roles: [CarrierAdmin, RatingManager, UnderwritingReviewer, Agent, Consumer, ComparativeRater, System]
    code: 200
    input: ["status?", "state_code?", "limit?", "offset?"]
    output: "Agent[]"
    side_effects: []

  - method: GET
    path: "/agents/{id}"
    description: "Get an Agent"
    roles: [CarrierAdmin, RatingManager, UnderwritingReviewer, Agent, Consumer, ComparativeRater, System]
    code: 200
    input: []
    output: Agent
    side_effects: []

  - method: POST
    path: "/agents/{id}/appoint"
    description: "Appoint an APPLICANT agent (requires >= 1 ACTIVE appointment)"
    roles: [UnderwritingReviewer]
    code: 200
    input: []
    output: Agent
    side_effects: ["APPLICANT -> APPOINTED; increments Agent.version by 1"]

  - method: POST
    path: "/agents/{id}/suspend"
    description: "Suspend an APPOINTED agent"
    roles: [UnderwritingReviewer]
    code: 200
    input: []
    output: Agent
    side_effects: ["APPOINTED -> SUSPENDED; increments Agent.version by 1"]

  - method: POST
    path: "/agents/{id}/reinstate"
    description: "Reinstate a SUSPENDED agent"
    roles: [UnderwritingReviewer]
    code: 200
    input: []
    output: Agent
    side_effects: ["SUSPENDED -> APPOINTED; increments Agent.version by 1"]

  - method: POST
    path: "/agents/{id}/terminate"
    description: "Terminate an APPOINTED or SUSPENDED agent with full cascade"
    roles: [UnderwritingReviewer]
    code: 200
    input: ["reason?"]
    output: Agent
    side_effects: ["-> TERMINATED; cascade: appointments TERMINATED, uncovered schedules VOIDED, DRAFT statements STALE; increments Agent.version by 1"]

  # --- AgentAppointment ---
  - method: POST
    path: "/agents/{id}/appointments"
    description: "Create an ACTIVE appointment; half-open overlap with existing ACTIVE appointments of the same (agent, state, line) is rejected; adjacency (end == start) is allowed"
    roles: [UnderwritingReviewer]
    code: 201
    input: [state_code, line_of_business, effective_start, "effective_end?"]
    output: AgentAppointment
    side_effects: ["status=ACTIVE; ERR_APPOINTMENT_WINDOW_OVERLAP on overlap"]

  - method: GET
    path: "/agents/{id}/appointments"
    description: "List an agent's appointments (reverse reach for AgentAppointment.agent_id)"
    roles: [CarrierAdmin, RatingManager, UnderwritingReviewer, Agent, Consumer, ComparativeRater, System]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "AgentAppointment[]"
    side_effects: []

  - method: GET
    path: "/appointments/{id}"
    description: "Get an AgentAppointment (EXPIRED derived on read when effective_end <= now)"
    roles: [CarrierAdmin, RatingManager, UnderwritingReviewer, Agent, Consumer, ComparativeRater, System]
    code: 200
    input: []
    output: AgentAppointment
    side_effects: []

  - method: POST
    path: "/appointments/{id}/terminate"
    description: "Terminate an ACTIVE appointment"
    roles: [UnderwritingReviewer]
    code: 200
    input: ["reason?"]
    output: AgentAppointment
    side_effects: ["ACTIVE -> TERMINATED; increments AgentAppointment.version by 1"]

  # --- CommissionSchedule ---
  - method: POST
    path: "/agents/{id}/commission-schedules"
    description: "Create a CommissionSchedule (OCC-guarded on the agent's version); supersedes the prior ACTIVE schedule for the same (agent, line_of_business)"
    roles: [CarrierAdmin]
    code: 201
    input: [line_of_business, effective_start, tiers, contingent_bonus_eligible, "effective_end?", expected_agent_version]
    output: CommissionSchedule
    side_effects:
      - "status=ACTIVE; prior ACTIVE schedule for the same (agent, line_of_business) -> SUPERSEDED"
      - "increments Agent.version by 1"
      - "OCC: expected_agent_version must equal Agent.version (ERR_STALE_VERSION, 412)"

  - method: GET
    path: "/agents/{id}/commission-schedules"
    description: "List an agent's commission schedules (reverse reach for CommissionSchedule.agent_id)"
    roles: [CarrierAdmin, RatingManager, UnderwritingReviewer, Agent, Consumer, ComparativeRater, System]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CommissionSchedule[]"
    side_effects: []

  - method: GET
    path: "/commission-schedules/{id}"
    description: "Get a CommissionSchedule"
    roles: [CarrierAdmin, RatingManager, UnderwritingReviewer, Agent, Consumer, ComparativeRater, System]
    code: 200
    input: []
    output: CommissionSchedule
    side_effects: []

  # --- Consumer ---
  - method: POST
    path: "/consumers"
    description: "Register a Consumer"
    roles: [Anonymous]
    code: 201
    input: [email, full_name, date_of_birth, home_state_code]
    output: Consumer
    side_effects: ["ERR_DUPLICATE_CONSUMER_EMAIL if email already registered"]

  - method: GET
    path: "/consumers"
    description: "List Consumers"
    roles: [CarrierAdmin, RatingManager, UnderwritingReviewer, System]
    code: 200
    input: ["home_state_code?", "limit?", "offset?"]
    output: "Consumer[]"
    side_effects: []

  - method: GET
    path: "/consumers/{id}"
    description: "Get a Consumer"
    roles: [CarrierAdmin, RatingManager, UnderwritingReviewer, Agent, Consumer, ComparativeRater, System]
    code: 200
    input: []
    output: Consumer
    side_effects: []

  # --- Quote ---
  - method: POST
    path: "/quotes"
    description: "Create a DRAFT quote. Consumer callers create DIRECT quotes for themselves; Agent callers create AGENT quotes with agent_id equal to themselves."
    roles: [Consumer, Agent]
    code: 201
    input: [consumer_id, product_id, channel, coverages, "agent_id?", "bundled_home_intended?", "telematics_opt_in?"]
    output: Quote
    side_effects:
      - "status=DRAFT; quoted_premium_cents=null; rate_stale=false"
      - "channel == AGENT requires agent_id (ERR_AGENT_MISMATCH); Agent callers may only create quotes with agent_id == themselves (ERR_OWNERSHIP_MISMATCH); Consumer callers may only create channel == DIRECT with consumer_id == themselves"

  - method: GET
    path: "/quotes"
    description: "List quotes with filters (reverse reach for Quote.consumer_id / product_id / agent_id / rate_feed_publication_id)"
    roles: [CarrierAdmin, RatingManager, UnderwritingReviewer, Agent, Consumer, ComparativeRater, System]
    code: 200
    input: ["consumer_id?", "product_id?", "agent_id?", "rate_feed_publication_id?", "channel?", "status?", "limit?", "offset?"]
    output: "Quote[]"
    side_effects: []

  - method: GET
    path: "/quotes/{id}"
    description: "Get a Quote (lazy EXPIRED evaluation applied on read)"
    roles: [CarrierAdmin, RatingManager, UnderwritingReviewer, Agent, Consumer, ComparativeRater, System]
    code: 200
    input: []
    output: Quote
    side_effects: []

  - method: POST
    path: "/quotes/{id}/submit"
    description: "Submit a DRAFT quote; computes premium, pins feed for AGENT channel"
    roles: [Consumer, Agent]
    code: 200
    input: []
    output: Quote
    side_effects: ["DRAFT -> QUOTED; channel_quote_premium computed; expires_at = now + 30d; increments Quote.version by 1"]

  - method: POST
    path: "/quotes/{id}/re-rate"
    description: "Reset a QUOTED quote to DRAFT (or an AGENT_QUOTED quote back to REFERRED_TO_AGENT, preserving the referral) so it can be re-rated"
    roles: [Consumer, Agent]
    code: 200
    input: []
    output: Quote
    side_effects: ["clears computed premium, expiry, rate pin and rate_stale; increments Quote.version by 1"]

  - method: POST
    path: "/quotes/{id}/refer-to-agent"
    description: "Consumer hands a DIRECT QUOTED quote to an appointed agent (quote data reuse begins)"
    roles: [Consumer]
    code: 200
    input: [agent_id]
    output: Quote
    side_effects: ["QUOTED -> REFERRED_TO_AGENT; channel flips to AGENT; referral_snapshot captured; increments Quote.version by 1"]

  - method: POST
    path: "/quotes/{id}/agent-quote"
    description: "Agent re-quotes a referred quote; reuses referral_snapshot.coverages unless new coverages are supplied"
    roles: [Agent]
    code: 200
    input: ["coverages?"]
    output: Quote
    side_effects: ["REFERRED_TO_AGENT -> AGENT_QUOTED; premium recomputed with AGENT factors; increments Quote.version by 1"]

  - method: POST
    path: "/quotes/{id}/bind"
    description: "Bind a QUOTED (direct, by consumer) or AGENT_QUOTED (by agent) quote; creates the Policy and optional TelematicsEnrollment"
    roles: [Consumer, Agent]
    code: 200
    input: []
    output: Policy
    side_effects: ["quote -> BOUND; Policy created IN_FORCE; TelematicsEnrollment created when telematics_opt_in; increments Quote.version by 1"]

  - method: POST
    path: "/quotes/{id}/withdraw"
    description: "Withdraw a non-terminal, non-bound quote"
    roles: [Consumer, Agent]
    code: 200
    input: []
    output: Quote
    side_effects: ["-> WITHDRAWN; increments Quote.version by 1"]

