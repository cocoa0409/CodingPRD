            - "selector picked best-fit rack R-01 (4 free of 8, slack 0 beats R-02 slack 4): Tower.${t5}.tower_status == ALLOCATED"
            - "after RR1 approval creates a new batch, ReplantRequest.${rr2}.priority_score is STILL 150000.00 (frozen at creation — no recompute)"

  # ==========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: batch_parallel_production_safety_dimensions_with_stress_cycle
        grounds:
          - state_machines.GrowBatch (production_status)
          - state_machines.GrowBatch (safety_status)
          - calculations.projected_harvest_schedule
        distinguishing_aspect: |
          GrowBatch carries TWO independent state dimensions plus a production cycle:
          GROWING -> AT_RISK -> GROWING loops twice (each stress event extends the projection
          +1 day, cap 5) while safety_status independently moves PENDING -> RELEASED between
          the two stress events; each dimension evolves without disturbing the other.
        test_recipe:
          setup:
            - "Crop KALE-01 ACTIVE recipe (21d, 12.5 lb/tower); batch on 4 towers of R-01 (WL-A), seeded 2026-08-03T06:00:00Z, germination 96.0 -> projected_harvest_at 2026-08-24T06:00:00Z"
          setup_api_calls:
            - { call: "POST /farm/crops", payload: { crop_code: "KALE-01", display_name: "Kale", category: "LEAFY_GREEN", margin_cents_per_lb: 300, floor_price_cents_per_lb: 100 }, as: FarmManager, captures: { c_kale: "$.data.id", c_kale_v: "$.data.version" } }
            - { call: "POST /farm/recipes", payload: { crop_id: "${c_kale}", light_hours_per_day: 16, light_ppfd_umol: 600, ec_target_ms: 1.8, ph_target: 5.8, temp_day_c: 22, temp_night_c: 18, humidity_pct: 65, co2_ppm: 900, days_to_harvest: 21, expected_yield_lb_per_tower: 12.5 }, as: Grower, captures: { r_kale: "$.data.id" } }
            - { call: "POST /farm/recipes/${r_kale}/activate", payload: { expected_crop_version: "${c_kale_v}" }, as: Grower }
            - { call: "POST /farm/water-loops", payload: { loop_code: "WL-A" }, as: FarmManager, captures: { wl_a: "$.data.id" } }
            - { call: "POST /farm/racks", payload: { rack_code: "R-01", water_loop_id: "${wl_a}", zone: "Z1", tower_count: 4 }, as: FarmManager, captures: { rk_1: "$.data.id" } }
            - { call: "GET /farm/racks/${rk_1}/towers", as: FarmManager, captures: { t1: "$.data[0].id", t2: "$.data[1].id", t3: "$.data[2].id", t4: "$.data[3].id" } }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: FarmManager }
            - { call: "POST /farm/batches", payload: { crop_id: "${c_kale}", tower_ids: ["${t1}", "${t2}", "${t3}", "${t4}"] }, as: Grower, captures: { b1: "$.data.id" } }
            - { call: "POST /farm/batches/${b1}/seed", as: Grower }
            - { call: "POST /farm/batches/${b1}/germination-check", payload: { germination_rate_pct: 96.0 }, as: Grower }
          trigger:
            - { call: "POST /farm/batches/${b1}/report-stress", payload: { stress_note: "EC drift" }, as: Grower, captures: { s1_prod: "$.data.production_status", s1_ext: "$.data.stress_extension_days" } }
            - { call: "POST /farm/batches/${b1}/recover", as: Grower, captures: { r_prod: "$.data.production_status" } }
            - { call: "POST /farm/batches/${b1}/safety-release", payload: { decision: "RELEASED", lab_ref: "LAB-31" }, as: QualityAssurance, as_user_id: "qa-1", captures: { rel_safety: "$.data.safety_status", rel_prod: "$.data.production_status" } }
            - { call: "POST /farm/batches/${b1}/report-stress", payload: { stress_note: "pH spike" }, as: Grower, captures: { s2_prod: "$.data.production_status", s2_safety: "$.data.safety_status", s2_ext: "$.data.stress_extension_days", s2_proj: "$.data.projected_harvest_at" } }
          assert:
            - "after 1st stress: production_status == AT_RISK, stress_extension_days == 1"
            - "after recover: production_status == GROWING (cycle GROWING->AT_RISK->GROWING), extension stays 1"
            - "safety-release while GROWING: safety_status == RELEASED and production_status == GROWING (dimensions independent)"
            - "after 2nd stress: production_status == AT_RISK, safety_status STILL == RELEASED (production cycle does not reset safety), stress_extension_days == 2"
            - "projected_harvest_at == 2026-08-26T06:00:00Z (seeded 2026-08-03T06:00 + 21d + 2 stress days)"

      - name: water_loop_posture_cycle_with_retest
        grounds:
          - state_machines.WaterLoop
          - state_machines.SanitationCycle
          - calculations.sanitation_schedule
        distinguishing_aspect: |
          WaterLoop posture is a derived cyclic machine (IN_SERVICE -> SANITATION_IN_PROGRESS ->
          SANITATION_HOLD -> SANITATION_IN_PROGRESS -> IN_SERVICE) driven by a SECOND entity's
          lifecycle (SanitationCycle), including the FAILED-branch loop back through a retest
          cycle carrying parent_cycle_id — vs the GrowBatch parallel-dimension instance.
        test_recipe:
          setup:
            - "Loop WL-A with rack R-01 (2 towers); no batches needed — pure posture cycle"
          setup_api_calls:
            - { call: "POST /farm/water-loops", payload: { loop_code: "WL-A" }, as: FarmManager, captures: { wl_a: "$.data.id" } }
            - { call: "POST /farm/racks", payload: { rack_code: "R-01", water_loop_id: "${wl_a}", zone: "Z1", tower_count: 2 }, as: FarmManager, captures: { rk_1: "$.data.id" } }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: FarmManager }
            - { call: "POST /farm/sanitation-cycles", payload: { water_loop_id: "${wl_a}", scheduled_start_at: "2026-08-10T08:00:00Z", scheduled_end_at: "2026-08-10T10:00:00Z" }, as: SanitationLead, captures: { cy1: "$.data.id" } }
          trigger:
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: FarmManager }
            - { call: "POST /farm/sanitation-cycles/${cy1}/start", as: SanitationLead, captures: { cy1_status: "$.data.cycle_status" } }
            - { call: "GET /farm/water-loops/${wl_a}", as: FarmManager, captures: { p_inprog: "$.data.posture" } }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:30:00Z" }, as: FarmManager }
            - { call: "POST /farm/sanitation-cycles/${cy1}/record-result", payload: { result: "FAILED", coliform_cfu: 240 }, as: SanitationLead, as_user_id: "san-1" }
            - { call: "GET /farm/water-loops/${wl_a}", as: FarmManager, captures: { p_hold: "$.data.posture" } }
            - { call: "POST /farm/sanitation-cycles", payload: { water_loop_id: "${wl_a}", scheduled_start_at: "2026-08-10T14:30:00Z", scheduled_end_at: "2026-08-10T16:30:00Z", parent_cycle_id: "${cy1}" }, as: SanitationLead, captures: { cy2: "$.data.id" } }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T14:30:00Z" }, as: FarmManager }
            - { call: "POST /farm/sanitation-cycles/${cy2}/start", as: SanitationLead }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T16:45:00Z" }, as: FarmManager }
            - { call: "POST /farm/sanitation-cycles/${cy2}/record-result", payload: { result: "PASSED", coliform_cfu: 0 }, as: SanitationLead, as_user_id: "san-2" }
            - { call: "GET /farm/water-loops/${wl_a}", as: FarmManager, captures: { p_final: "$.data.posture", last_pass: "$.data.last_passed_at", next_due: "$.data.next_sanitation_due_at" } }
            - { call: "GET /farm/racks/${rk_1}", as: FarmManager, captures: { rk_posture: "$.data.rack_posture" } }
          assert:
            - "after start: WaterLoop.posture == SANITATION_IN_PROGRESS"
            - "after FAILED result: WaterLoop.posture == SANITATION_HOLD (cycle loop entry)"
            - "after retest PASSED: WaterLoop.posture == IN_SERVICE (cycle closes the loop)"
            - "last_passed_at == 2026-08-10T16:45:00Z; next_sanitation_due_at == 2026-08-17T16:45:00Z (+168h)"
            - "Rack.${rk_1}.rack_posture == OPERATING (cascade release)"

      - name: contract_suspension_cycle_and_termination_branch
        grounds:
          - state_machines.RetailContract
          - endpoints."POST /farm/shipments"
        distinguishing_aspect: |
          RetailContract is a branching machine with a revert loop (ACTIVE <-> SUSPENDED any
          number of rounds) plus a divergent terminal branch (TERMINATED) from either loop
          state — shipment creation is gated differently per branch (blocked in SUSPENDED and
          TERMINATED, allowed after reinstate), exercised here in one continuous lifecycle.
        test_recipe:
          setup:
            - "Crop KALE-01 with ACTIVE recipe; contract CT1 (commitment 500, MONDAY weeks, start 2026-08-24)"
            - "One batch packed 100.00 lb on 2026-08-24 (PASSED sanitation on WL-A at 2026-08-22T03:30:00Z), safety RELEASED"
          setup_api_calls:
            - { call: "POST /farm/crops", payload: { crop_code: "KALE-01", display_name: "Kale", category: "LEAFY_GREEN", margin_cents_per_lb: 300, floor_price_cents_per_lb: 100 }, as: FarmManager, captures: { c_kale: "$.data.id", c_kale_v: "$.data.version" } }
            - { call: "POST /farm/recipes", payload: { crop_id: "${c_kale}", light_hours_per_day: 16, light_ppfd_umol: 600, ec_target_ms: 1.8, ph_target: 5.8, temp_day_c: 22, temp_night_c: 18, humidity_pct: 65, co2_ppm: 900, days_to_harvest: 21, expected_yield_lb_per_tower: 12.5 }, as: Grower, captures: { r_kale: "$.data.id" } }
            - { call: "POST /farm/recipes/${r_kale}/activate", payload: { expected_crop_version: "${c_kale_v}" }, as: Grower }
