        grounds: ["validations[priority=9]", "errors[ERR_SERVICE_RECORD_GAP]", "errors[ERR_SERVICE_RECORD_OVERLAP]", "calculations.service_fraction_average"]
        distinguishing_aspect: "Half-open tiling is enforced per record append: a record starting 2025-03-16 after one ending 2025-03-15 leaves a one-day gap (ERR_SERVICE_RECORD_GAP); a record starting before the previous record's end overlaps (ERR_SERVICE_RECORD_OVERLAP)."
