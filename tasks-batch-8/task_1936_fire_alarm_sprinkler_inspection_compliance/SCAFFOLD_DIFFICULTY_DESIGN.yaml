              as_user_id: "${con_id}"
              captures: { sys_id: $.data.id, sys_v: $.data.version }
            - call: "POST /fire-compliance/systems/${sys_id}/modification-permits"
              payload: { project_valuation_cents: 500000, expected_system_version: "${sys_v}" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { perm_id: $.data.id }
            - call: "POST /fire-compliance/modification-permits/${perm_id}/issue"
              payload: {}
              as: FireMarshal
          trigger:
            - call: "POST /fire-compliance/modification-permits/${perm_id}/commence-work"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "GET /fire-compliance/systems/${sys_id}/impairments"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { imp_auto: "$.data[0].id" }
          assert:
            - "ModificationPermit.${perm_id}.status == WORK_COMMENCED"
            - "ModificationPermit.${perm_id}.work_commenced_at != null"
            - "captured imp_auto exists: exactly one auto-created Impairment with impairment_kind == UNPLANNED on system ${sys_id}"
            - "ProtectedSystem.${sys_id}.impairment_status == IMPAIRED"
            - "Impairment.${imp_auto}.notification_deadline == discovered_at + 2 hours"

  # =====================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_business_safety_on_event_start
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_LICENSE_NOT_VALID]
        distinguishing_aspect: |
          Pair (state vs business_safety): starting an event that is already
          CANCELLED with a lead technician who ALSO lacks a valid license must
          return ERR_INVALID_STATE (priority 5), not ERR_LICENSE_NOT_VALID
          (priority 7).
        test_recipe:
          setup:
            - "Published plan; event created with technician whose ALARM license is expired; event then CANCELLED by admin"
          setup_api_calls:
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FireMarshal
            - call: "POST /fire-compliance/contractors"
