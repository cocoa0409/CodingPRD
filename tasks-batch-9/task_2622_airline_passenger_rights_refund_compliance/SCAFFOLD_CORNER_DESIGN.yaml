  - section: cross_cutting_complexity_layers
    instances:
      - name: obligation_create_refuses_a_stale_booking_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules.obligation-create-stale-booking", "errors.ERR_STALE_BOOKING_VERSION", "validations[priority 35]"]
        distinguishing_aspect: "The version captured at booking create (1) is already superseded by the two segment adds, so the obligation create is refused with ERR_STALE_BOOKING_VERSION (412) - not clamped - and the identical body with the freshly read version 3 succeeds, proving the OCC field is compared rather than ignored."
        test_recipe:
          setup:
            - "Booking total_fare_cents = 90000 created (version 1), then two segments added (30000 + 60000), taking the booking to version 3."
          setup_api_calls:
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { pol_id: "$.data.id" }
            - call: "POST /compliance/passengers"
              payload: { email: "pat@example.com", full_name: "Pat Rivera" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { pax_id: "$.data.id" }
