              captures: { mw_b_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Ray Alder", position: "QB" }
              as: LeagueOfficer
              captures: { mw_p_id: $.data.id }
            - call: "POST /transactions"
              payload: { team_id: "${mw_a_id}", player_id: "${mw_p_id}", transaction_type: "SIGNING", expected_team_version: "${mw_a_v1}", years: 3, base_salary_cents: 80000000, signing_bonus_cents: 10000000, start_season_year: 2026 }
