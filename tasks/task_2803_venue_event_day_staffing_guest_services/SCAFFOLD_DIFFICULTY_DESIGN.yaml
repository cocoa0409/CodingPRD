            - "after GRATUITY_ALLOCATION: payout_status == GRATUITY_ALLOCATED, gratuity_cents == 50000, total_payout_cents == 59600, attendance_status still == COMPLETED"
            - "after GRATUITY_ALLOCATION: Event.${ev_id}.gratuity_allocated_cents == 50000"
            - "after PAYROLL: payout_status == PAID, attendance_status still == COMPLETED, total_payout_cents still == 59600"
