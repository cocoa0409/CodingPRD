              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { auth: $.data.id, coi0: $.data.coi_status }
            - call: "PATCH /care/service-authorizations/${auth}/state"
              payload: { to_state: "AUTHORIZED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
              captures: { deny_id: $.data.error_id }
            - call: "POST /care/service-authorizations/${auth}/coi-events"
              payload: { action: "DISCLOSE", note: "Referral relationship disclosed to the family." }
              as: CareManager
              as_user_id: "${cm_dana}"
