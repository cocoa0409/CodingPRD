  - method: GET
    path: "/plant/freezer-cells"
    description: "List freezer cells"
    roles: [PlantManager, ProductionPlanner, LineOperator, QATechnician, QAManager, WarehouseLead]
    code: 200
    input: ["limit?", "offset?"]
    output: BlastFreezerCell[]
    side_effects: []
  - method: GET
    path: "/plant/freezer-cells/{cellId}"
    description: "Get a freezer cell"
    roles: [PlantManager, ProductionPlanner, LineOperator, QATechnician, QAManager, WarehouseLead]
    code: 200
    input: []
    output: BlastFreezerCell
    side_effects: []
  - method: POST
    path: "/plant/production-batches/{batchId}/freezing-cycles"
    description: "Book a freezing cycle for a batch (OCC on the batch; supersedes a prior RESERVED cycle of the same batch; batch must be CREATED/KITTED/COOKED)"
    roles: [ProductionPlanner]
    code: 201
    input: [load_kg, entry_temp_c, planned_start, expected_batch_version, "cell_id?"]
    output: FreezingCycle
    side_effects:
      - "required_hours and planned_end computed per freezer_cycle_duration"
      - "prior RESERVED cycle of this batch -> VOIDED (supersede); supersede is applied BEFORE window-conflict validation, so a batch's own superseded cycle never conflicts with its replacement"
      - "increments ProductionBatch.version by 1"
  - method: GET
    path: "/plant/freezing-cycles"
    description: "List freezing cycles"
    roles: [PlantManager, ProductionPlanner, LineOperator, QATechnician, QAManager, WarehouseLead]
    code: 200
    input: ["cell_id?", "batch_id?", "status?", "limit?", "offset?"]
    output: FreezingCycle[]
    side_effects: []
  - method: GET
    path: "/plant/freezing-cycles/{cycleId}"
    description: "Get a freezing cycle"
    roles: [PlantManager, ProductionPlanner, LineOperator, QATechnician, QAManager, WarehouseLead]
    code: 200
    input: []
    output: FreezingCycle
    side_effects: []
  - method: POST
    path: "/plant/freezing-cycles/{cycleId}/start"
    description: "Start a reserved cycle (batch must be COOKED)"
    roles: [LineOperator]
    code: 200
    input: []
    output: FreezingCycle
    side_effects: ["status -> IN_PROGRESS"]
  - method: POST
    path: "/plant/freezing-cycles/{cycleId}/complete"
    description: "Complete a cycle; computed VERIFIED or FAILED"
    roles: [LineOperator]
    code: 200
    input: [actual_end, final_core_temp_c]
    output: FreezingCycle
    side_effects: ["status -> VERIFIED | FAILED", "VERIFIED: batch COOKED -> FROZEN"]
  - method: POST
    path: "/plant/freezing-cycles/{cycleId}/void"
    description: "Void a RESERVED cycle"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: FreezingCycle
    side_effects: ["status -> VOIDED"]

