  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: dispatch_trade_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_TRADE_MISMATCH]"]
        distinguishing_aspect: "An ELECTRICAL technician cannot be dispatched to a PLUMBING work order: ERR_TRADE_MISMATCH (409)."
        test_recipe:
          setup: ["work order PLUMBING TRIAGED; only an ELECTRICAL technician exists"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Trade Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "401", full_name: "R Trade", email: "rtrade@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /technicians"
              payload: { property_id: "${prop_id}", full_name: "T Elec", trade: "ELECTRICAL" }
              as: PropertyManager
              captures: { tech_id: $.data.id }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Leak" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T12:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_TRADE_MISMATCH, HTTP 409"
            - "WorkOrder.${wo_id}.status remains TRIAGED"

      - name: emergency_access_on_routine_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_ENTRY_RULE_VIOLATION]"]
        distinguishing_aspect: "EMERGENCY_ACCESS entry authorization is legal only for EMERGENCY priority; using it on a ROUTINE order fails with ERR_ENTRY_RULE_VIOLATION (422)."
        test_recipe:
          setup: ["ROUTINE work order TRIAGED; technician PLUMBING exists"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Entry Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "402", full_name: "R Entry", email: "rentry@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /technicians"
              payload: { property_id: "${prop_id}", full_name: "T One", trade: "PLUMBING" }
              as: PropertyManager
              captures: { tech_id: $.data.id }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Routine fix" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T12:00:00Z", entry_authorization: "EMERGENCY_ACCESS" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ENTRY_RULE_VIOLATION, HTTP 422"
            - "WorkOrder.${wo_id}.status remains TRIAGED"

      - name: notice_too_short_at_dispatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_ENTRY_NOTICE_TOO_SHORT]"]
        distinguishing_aspect: "NOTICE_POSTED dispatch with only 23 hours between notice_posted_at and scheduled_start_at (property requires 24) fails with ERR_ENTRY_NOTICE_TOO_SHORT."
        test_recipe:
          setup: ["ROUTINE work order TRIAGED; technician PLUMBING; property entry_notice_min_hours == 24 (default)"]
          setup_api_calls:
