            - { call: "POST /rights-deals/${deal1}/commit", payload: {}, as: RightsManager, as_user_id: u_rights }
            - { call: "POST /release-tranches", payload: { rights_deal_id: "${deal1}", promised_units: 30, promised_release_at: "2026-09-01T00:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { tr1: "$.data.id" } }
            - { call: "POST /rights-deals", payload: { event_id: "${ev2}", rights_holder_name: "Harbour United", inventory_type: "TICKET", contracted_units: 40, guaranteed_minimum_units: 20, unit_cost_cents: 8000 }, as: RightsManager, as_user_id: u_rights, captures: { deal2: "$.data.id" } }
            - { call: "POST /rights-deals/${deal2}/commit", payload: {}, as: RightsManager, as_user_id: u_rights }
            - { call: "POST /release-tranches", payload: { rights_deal_id: "${deal2}", promised_units: 30, promised_release_at: "2026-09-01T00:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { tr2: "$.data.id" } }
            - { call: "POST /package-products", payload: { event_id: "${ev1}", name: "Bronze Hospitality", tier: "BRONZE", tickets_per_package: 2, min_margin_pct: 0.1000 }, as: CommercialManager, as_user_id: u_pricer, captures: { pkg1: "$.data.id" } }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg1}", component_type: "TICKET", descriptor: "Category 1 seat pair", quantity: 2, unit_cost_cents: 50000, markup_pct: 0.2000, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${pkg1}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { pkg1_v: "$.data.version" } }
            - { call: "POST /package-products/${pkg1}/publish", payload: { expected_package_product_version: "${pkg1_v}" }, as: CommercialDirector, as_user_id: u_director }
