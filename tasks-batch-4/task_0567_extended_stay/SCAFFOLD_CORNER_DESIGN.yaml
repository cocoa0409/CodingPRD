      - name: error_corporate_admin_cannot_add_employee_to_foreign_account_forbidden
        claim_type: ownership_denial
        grounds: ["validations[priority=4]", roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "CorporateAdmin of account A adding an employee to account B (X-User-ID != corporate_account_id) returns ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["Two corporate accounts caA and caB."]
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { company_name: "Acme", billing_email: "ap@acme.test" }
              as: PropertyManager
              captures: { caA: $.data.id }
            - call: "POST /corporate-accounts"
              payload: { company_name: "Globex", billing_email: "ap@globex.test" }
              as: PropertyManager
              captures: { caB: $.data.id }
          trigger:
            - call: "POST /employees"
              payload: { corporate_account_id: "${caB}", full_name: "Mallory", email: "m@globex.test" }
              as: CorporateAdmin
              as_user_id: "${caA}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == ERR_FORBIDDEN (HTTP 403)"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_renegotiate_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[lease-renegotiate-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After a successful renegotiate advances MasterLease.version, a second renegotiate carrying the pre-advance version returns ERR_STALE_VERSION (412); the first rate stands."
        test_recipe:
          setup: ["Corporate account; master lease created + activated; version captured (ml_v0); one successful renegotiate to 250000 advances the version."]
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { company_name: "Acme", billing_email: "ap@acme.test" }
              as: PropertyManager
              captures: { ca: $.data.id }
            - call: "POST /master-leases"
              payload: { corporate_account_id: "${ca}", committed_units: 5, negotiated_monthly_rate_cents: 280000, start_date: "2026-05-01T00:00:00Z", end_date: "2027-05-01T00:00:00Z" }
              as: PropertyManager
              captures: { ml: $.data.id }
            - call: "POST /master-leases/${ml}/activate"
              payload: {}
              as: PropertyManager
            - call: "GET /master-leases/${ml}"
              payload: {}
              as: PropertyManager
              captures: { ml_v0: $.data.version }
            - call: "POST /master-leases/${ml}/renegotiate"
              payload: { expected_master_lease_version: "${ml_v0}", negotiated_monthly_rate_cents: 250000 }
              as: PropertyManager
          trigger:
            - call: "POST /master-leases/${ml}/renegotiate"
              payload: { expected_master_lease_version: "${ml_v0}", negotiated_monthly_rate_cents: 240000 }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response data.error_id == ERR_STALE_VERSION (HTTP 412)"
            - "GET /master-leases/${ml} -> data.negotiated_monthly_rate_cents == 250000 (the 240000 write was rejected)"

      - name: occ_renegotiate_success_bumps_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[lease-renegotiate-stale-version]", entities.MasterLease.fields.negotiated_monthly_rate_cents]
        distinguishing_aspect: "A renegotiate carrying the current version succeeds, supersedes the rate to 250000, and increments MasterLease.version by 1."
        test_recipe:
          setup: ["Corporate account; master lease created + activated; current version captured (ml_v0)."]
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { company_name: "Acme", billing_email: "ap@acme.test" }
              as: PropertyManager
              captures: { ca: $.data.id }
            - call: "POST /master-leases"
              payload: { corporate_account_id: "${ca}", committed_units: 5, negotiated_monthly_rate_cents: 280000, start_date: "2026-05-01T00:00:00Z", end_date: "2027-05-01T00:00:00Z" }
              as: PropertyManager
              captures: { ml: $.data.id }
            - call: "POST /master-leases/${ml}/activate"
              payload: {}
              as: PropertyManager
            - call: "GET /master-leases/${ml}"
              payload: {}
              as: PropertyManager
              captures: { ml_v0: $.data.version }
          trigger:
            - call: "POST /master-leases/${ml}/renegotiate"
              payload: { expected_master_lease_version: "${ml_v0}", negotiated_monthly_rate_cents: 250000 }
              as: PropertyManager
              captures: { ml_v1: $.data.version }
          assert:
            - "GET /master-leases/${ml} -> data.negotiated_monthly_rate_cents == 250000"
            - "trigger response version (ml_v1) == ml_v0 + 1"

