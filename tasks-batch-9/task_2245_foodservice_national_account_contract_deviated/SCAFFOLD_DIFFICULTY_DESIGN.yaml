          assert:
            - "OrderLine.${ln_below}.list_unit_price_cents == 5000"
            - "OrderLine.${ln_below}.invoiced_unit_price_cents == 5000"
            - "OrderLine.${ln_below}.cost_basis_snapshot_cents == 4850"
            - "OrderLine.${ln_below}.extended_price_cents == 495000"
            - "OrderLine.${ln_below}.service_fee_cents == 27225"
            - "OrderLine.${ln_below}.invoice_total_cents == 522225"
            - "OrderLine.${ln_below}.service_fee_cents != 0"
            - "OrderLine.${ln_below}.invoice_total_cents != 495000"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: deviation_negotiation_cycle_capped_at_three_rounds
        grounds:
          - state_machines.DeviationAgreement.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.DeviationAgreement.REVISION_REQUESTED_to_SUBMITTED
          - entities.DeviationAgreement.fields.revision_round
          - validations[priority=29]
          - errors.ERR_MAX_REVISION_ROUNDS_EXCEEDED
        distinguishing_aspect: |
          Non-linearity on the DeviationAgreement entity takes the form of a genuine
          cycle: SUBMITTED -> REVISION_REQUESTED -> SUBMITTED traversed three times,
          with revision_round advancing 0 -> 1 -> 2 -> 3 and the fourth resubmit
          rejected by the MAX_REVISION_ROUNDS cap, so the loop has an enforced
          termination condition rather than being an unbounded revert edge.
        test_recipe:
          setup:
            - "ACTIVE contract HLG-2026 with a PROTEIN LAST_COST PERCENT_OF_COST 12.50 entry tier and an in-market DC."
            - "Product P-CHKN with last_cost_cents 4200 owned by manufacturer CPC."
            - "A COST_PLUS_PROTECTED deviation on (HLG-2026, P-CHKN) with protected_discount_cents 300 so deviated_price_cents resolves to 3900, max_operator_price_cents 4500, window 2026-08-01 .. 2026-11-01, currently in DRAFT."
            - "Logical clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /nac/operators"
              payload: { legal_name: "Harborline Grill Group", operator_code: "HLG" }
              as: SystemAdmin
              captures: { op_id: $.data.id }
