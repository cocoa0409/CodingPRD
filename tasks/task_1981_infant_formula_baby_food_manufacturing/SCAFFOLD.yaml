# =============================================================================
# PRD Benchmark Scaffold — Infant Formula & Baby Food Manufacturing
# Task 1981
# =============================================================================

scenario: |
  1981. Infant Formula & Baby Food Manufacturing (infant formula manufacturer):
  formulation vs regulatory nutrient requirement, ingredient supplier qualification & audit,
  dry blending/wet processing validation & pathogen control, batch testing & positive-release hold,
  registration/notification & label review, complaint & adverse event escalation,
  recall preparedness & retail withdrawal, allocation during shortage

domain_name: infant-formula-manufacturing
api_prefix: /api/v1

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
    - dual_variant_calculation
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: NutrientProfile
    parent: null
    common_fields: true
    fields:
      - name: profile_code
        type: string
        source: input
        required: true
        description: "Unique regulatory profile code, e.g. INF-0-6M, INF-6-12M, CEREAL-6M"
        constraints: "unique; enum: INF-0-6M | INF-6-12M | TODDLER-12-36M | CEREAL-6M | PUREE-4M"
      - name: nutrient_specs
        type: array
        source: input
        required: true
        description: "Array of nutrient specification objects: [{nutrient_code, unit, min_per_100kcal, max_per_100kcal, target_per_100kcal}]"
        constraints: "must contain at least 1 nutrient spec; nutrient_code must be from recognized codex list"
      - name: regulation_ref
        type: string
        source: input
        required: true
        description: "Regulatory citation, e.g. 21 CFR 107.100, EU 2016/127"
      - name: effective_from
        type: datetime
        source: input
        required: true
        description: "ISO 8601 UTC timestamp from which this profile version is effective"
      - name: effective_until
        type: datetime
        source: input
        required: false
        description: "ISO 8601 UTC timestamp after which this profile version is superseded; null = currently effective"
        default: null
      - name: status
        type: enum
        source: system
        required: true
        description: "Lifecycle status of the nutrient profile version"
        constraints: "enum: DRAFT | SUBMITTED | APPROVED | SUPERSEDED | WITHDRAWN"
        default: DRAFT

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - name: supplier_code
        type: string
        source: input
        required: true
        description: "Unique supplier code"
        constraints: "unique; max 32 chars"
      - name: legal_name
        type: string
        source: input
        required: true
        description: "Legal registered name of the supplier"
      - name: ingredient_categories
        type: array
        source: input
        required: true
        description: "List of ingredient categories this supplier is qualified for, e.g. [DAIRY_BASE, VEGETABLE_OIL, VITAMIN_PREMIX, MINERAL_PREMIX, PROBIOTIC]"
        constraints: "must contain at least 1 category"
      - name: qualification_status
        type: enum
        source: system
        required: true
        description: "Qualification lifecycle status"
        constraints: "enum: PENDING_AUDIT | QUALIFIED | SUSPENDED | DISQUALIFIED"
        default: PENDING_AUDIT
      - name: last_audit_date
        type: datetime
        source: system
        required: false
        description: "Date of most recent passed audit; null until first audit passes"
      - name: next_audit_due
        type: datetime
        source: computed
        required: false
        description: "Computed: last_audit_date + audit_frequency_days; null when not QUALIFIED"
      - name: audit_frequency_days
        type: integer
        source: input
        required: true
        description: "Audit re-inspection interval in days"
        constraints: "integer >= 30 and <= 730"
      - name: risk_rating
        type: enum
        source: computed
        required: true
        description: "Derived from audit scores: HIGH | MEDIUM | LOW"
        constraints: "enum: HIGH | MEDIUM | LOW"
        default: HIGH

  - name: AuditRecord
    parent: Supplier
    common_fields: true
    fields:
      - name: supplier_id
        type: string
        source: input
        required: true
        description: "FK -> Supplier.id; the supplier being audited"
      - name: audit_type
        type: enum
        source: input
        required: true
        description: "Type of audit performed"
        constraints: "enum: INITIAL | SURVEILLANCE | FOR_CAUSE | RE_QUALIFICATION"
      - name: audit_date
        type: datetime
        source: input
        required: true
        description: "ISO 8601 UTC date the audit was performed"
      - name: auditor_name
        type: string
        source: input
        required: true
        description: "Name of the lead auditor"
      - name: score
        type: number
        source: input
        required: true
        description: "Overall audit score, 0.00 to 100.00"
        constraints: "number >= 0 and <= 100, 2 decimal places"
      - name: findings
        type: array
        source: input
        required: true
        description: "Array of finding objects: [{finding_code, severity, description, capa_required}]"
        default: []
      - name: capa_deadline
        type: datetime
        source: input
        required: false
        description: "Deadline for corrective and preventive actions if any finding requires CAPA"
      - name: result
        type: enum
        source: computed
        required: true
        description: "Computed from score and findings: PASS | CONDITIONAL_PASS | FAIL"
        constraints: "enum: PASS | CONDITIONAL_PASS | FAIL"

  - name: Ingredient
    parent: null
    common_fields: true
    fields:
      - name: ingredient_code
        type: string
        source: input
        required: true
        description: "Unique ingredient identifier, e.g. WPC-80, LACTOSE-FG"
        constraints: "unique"
      - name: ingredient_name
        type: string
        source: input
        required: true
        description: "Human-readable ingredient name"
      - name: category
        type: enum
        source: input
        required: true
        description: "Ingredient category matching supplier qualification categories"
        constraints: "enum: DAIRY_BASE | VEGETABLE_OIL | VITAMIN_PREMIX | MINERAL_PREMIX | PROBIOTIC | CARBOHYDRATE | NUCLEOTIDE | OTHER"
      - name: pathogen_risk_class
        type: enum
        source: input
        required: true
        description: "Pathogen risk classification determining testing requirements"
        constraints: "enum: HIGH_RISK | MEDIUM_RISK | LOW_RISK"
      - name: storage_condition
        type: enum
        source: input
        required: true
        description: "Required storage environment"
        constraints: "enum: AMBIENT | REFRIGERATED | FROZEN | CONTROLLED_HUMIDITY"
      - name: allergen_flags
        type: array
        source: input
        required: false
        description: "List of allergen codes present, e.g. [MILK, SOY, GLUTEN]"
        default: []

  - name: IngredientLot
    parent: Ingredient
    common_fields: true
    fields:
      - name: ingredient_id
        type: string
        source: input
        required: true
        description: "FK -> Ingredient.id; the ingredient this lot belongs to"
      - name: supplier_id
        type: string
        source: input
        required: true
        description: "FK -> Supplier.id; the supplier who provided this lot"
      - name: lot_number
        type: string
        source: input
        required: true
        description: "Supplier-assigned lot number"
        constraints: "unique per (ingredient_id, supplier_id)"
      - name: quantity_kg
        type: number
        source: input
        required: true
        description: "Quantity received in kilograms"
        constraints: "number > 0, 3 decimal places"
      - name: remaining_kg
        type: number
        source: system
        required: true
        description: "Remaining unconsumed quantity; decremented on batch consumption, restored on batch void"
      - name: received_date
        type: datetime
        source: input
        required: true
        description: "ISO 8601 UTC date the lot was received"
      - name: expiry_date
        type: datetime
        source: input
        required: true
        description: "ISO 8601 UTC date after which the lot must not be used"
      - name: qc_status
        type: enum
        source: system
        required: true
        description: "Quality control status of this ingredient lot"
        constraints: "enum: PENDING_QC | QC_PASSED | QC_FAILED | QUARANTINED"
        default: PENDING_QC

  - name: Formula
    parent: null
    common_fields: true
    fields:
      - name: formula_code
        type: string
        source: input
        required: true
        description: "Unique formula identifier, e.g. IF-START-1, IF-FOLLOW-2"
        constraints: "unique"
      - name: product_name
        type: string
        source: input
        required: true
        description: "Commercial product name"
      - name: nutrient_profile_id
        type: string
        source: input
        required: true
        description: "FK -> NutrientProfile.id; the regulatory nutrient profile this formula must satisfy"
      - name: ingredients
        type: array
        source: input
        required: true
        description: "Array of formula ingredient objects: [{ingredient_id, percentage_by_weight, is_critical}]"
        constraints: "must contain at least 2 ingredients; percentages must sum to 100.000"
      - name: process_type
        type: enum
        source: input
        required: true
        description: "Manufacturing process type determining validation requirements"
        constraints: "enum: DRY_BLEND | WET_PROCESS | COMBINATION"
      - name: status
        type: enum
        source: system
        required: true
        description: "Formula lifecycle status"
        constraints: "enum: DRAFT | IN_REVIEW | APPROVED | ACTIVE | DISCONTINUED"
        default: DRAFT

  - name: ProductionBatch
    parent: Formula
    common_fields: true
    fields:
      - name: formula_id
        type: string
        source: input
        required: true
        description: "FK -> Formula.id; the formula being manufactured"
      - name: batch_number
        type: string
        source: system
        required: true
        description: "System-generated batch number, format: B-{YYYYMMDD}-{seq}"
        constraints: "unique"
      - name: batch_size_kg
        type: number
        source: input
        required: true
        description: "Planned production quantity in kilograms"
        constraints: "number > 0, 3 decimal places"
      - name: actual_yield_kg
        type: number
        source: system
        required: false
        description: "Actual output quantity after processing; set at completion"
      - name: status
        type: enum
        source: system
        required: true
        description: "Batch lifecycle status"
        constraints: "enum: PLANNED | IN_PRODUCTION | BLENDING_COMPLETE | PROCESSING_COMPLETE | TESTING | POSITIVE_RELEASE_HOLD | RELEASED | REJECTED | RECALLED"
        default: PLANNED
      - name: production_date
        type: datetime
        source: input
        required: true
        description: "ISO 8601 UTC planned production date"
      - name: expiry_date
        type: datetime
        source: computed
        required: false
        description: "Computed from formula shelf-life and production completion date"
      - name: ingredient_consumptions
        type: array
        source: system
        required: true
        description: "Array of consumed ingredient lots: [{ingredient_lot_id, consumed_kg, consumption_order}]"
        default: []
      - name: nutrient_results
        type: array
        source: system
        required: false
        description: "Array of tested nutrient values: [{nutrient_code, measured_per_100kcal, pass}]"
      - name: pathogen_results
        type: array
        source: system
        required: false
        description: "Array of pathogen test results: [{pathogen_code, detected, cfu_per_g}]"
      - name: release_decision
        type: enum
        source: system
        required: false
        description: "Final release decision"
        constraints: "enum: null | RELEASED | REJECTED"

  - name: ProcessValidation
    parent: Formula
    common_fields: true
    fields:
      - name: formula_id
        type: string
        source: input
        required: true
        description: "FK -> Formula.id; the formula this validation covers"
      - name: validation_type
        type: enum
        source: input
        required: true
        description: "Type of process validation"
        constraints: "enum: DRY_BLEND_HOMOGENEITY | WET_PROCESS_THERMAL | PATHOGEN_ENVIRONMENTAL | COMBINATION_FULL"
      - name: status
        type: enum
        source: system
        required: true
        description: "Validation lifecycle status"
        constraints: "enum: PLANNED | IN_PROGRESS | PASSED | FAILED | EXPIRED"
        default: PLANNED
      - name: protocol_version
        type: string
        source: input
        required: true
        description: "Validation protocol version reference"
      - name: started_at
        type: datetime
        source: system
        required: false
        description: "Timestamp when validation run began"
      - name: completed_at
        type: datetime
        source: system
        required: false
        description: "Timestamp when validation run concluded"
      - name: test_results
        type: array
        source: input
        required: false
        description: "Array of validation test results: [{test_name, measured_value, acceptance_criteria, pass}]"
      - name: valid_until
        type: datetime
        source: computed
        required: false
        description: "Computed: completed_at + validation_validity_days; null until PASSED"
      - name: validation_validity_days
        type: integer
        source: input
        required: true
        description: "Number of days a passed validation remains effective"
        constraints: "integer >= 30 and <= 1095"

  - name: LabelSubmission
    parent: Formula
    common_fields: true
    fields:
      - name: formula_id
        type: string
        source: input
        required: true
        description: "FK -> Formula.id; the formula this label is for"
      - name: submission_type
        type: enum
        source: input
        required: true
        description: "Type of regulatory submission"
        constraints: "enum: NEW_PRODUCT_REGISTRATION | LABEL_AMENDMENT | NOTIFICATION | RENEWAL"
      - name: label_text
        type: string
        source: input
        required: true
        description: "Full label text content for review"
      - name: claims
        type: array
        source: input
        required: false
        description: "Array of marketing/nutritional claims made on the label"
        default: []
      - name: status
        type: enum
        source: system
        required: true
        description: "Submission review lifecycle"
        constraints: "enum: DRAFT | SUBMITTED | UNDER_REVIEW | APPROVED | REJECTED | WITHDRAWN"
        default: DRAFT
      - name: reviewer_id
        type: string
        source: system
        required: false
        description: "FK -> SystemUser.id of assigned reviewer; null until assigned"
      - name: review_comments
        type: array
        source: system
        required: false
        description: "Array of review comments: [{comment, severity, resolved}]"
      - name: submitted_at
        type: datetime
        source: system
        required: false
        description: "Timestamp when submission was sent for review"
      - name: decided_at
        type: datetime
        source: system
        required: false
        description: "Timestamp when approval/rejection decision was made"

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - name: complaint_ref
        type: string
        source: system
        required: true
        description: "System-generated complaint reference, format: C-{YYYYMMDD}-{seq}"
        constraints: "unique"
      - name: complainant_name
        type: string
        source: input
        required: true
        description: "Name of person filing the complaint"
      - name: complainant_contact
        type: string
        source: input
        required: true
        description: "Contact information for the complainant"
      - name: product_formula_id
        type: string
        source: input
        required: true
        description: "FK -> Formula.id; the formula/product the complaint is about"
      - name: batch_id
        type: string
        source: input
        required: false
        description: "FK -> ProductionBatch.id; the specific batch if known"
      - name: complaint_type
        type: enum
        source: input
        required: true
        description: "Category of complaint"
        constraints: "enum: QUALITY_DEFECT | FOREIGN_MATTER | PACKAGING | ADVERSE_EVENT | ILLNESS | OTHER"
      - name: severity
        type: enum
        source: input
        required: true
        description: "Severity classification"
        constraints: "enum: LOW | MEDIUM | HIGH | CRITICAL"
      - name: description
        type: string
        source: input
        required: true
        description: "Detailed complaint description"
      - name: status
        type: enum
        source: system
        required: true
        description: "Complaint processing lifecycle"
        constraints: "enum: RECEIVED | INVESTIGATING | ESCALATED | RESOLVED | CLOSED"
        default: RECEIVED
      - name: is_adverse_event
        type: boolean
        source: computed
        required: true
        description: "True if complaint_type is ADVERSE_EVENT or ILLNESS, or severity is CRITICAL"
        default: false
      - name: escalated_at
        type: datetime
        source: system
        required: false
        description: "Timestamp when escalated to adverse event"
      - name: resolution
        type: string
        source: input
        required: false
        description: "Resolution summary text"
      - name: resolved_at
        type: datetime
        source: system
        required: false
        description: "Timestamp when resolved"

  - name: RecallCampaign
    parent: null
    common_fields: true
    fields:
      - name: recall_ref
        type: string
        source: system
        required: true
        description: "System-generated recall reference, format: R-{YYYYMMDD}-{seq}"
        constraints: "unique"
      - name: reason
        type: enum
        source: input
        required: true
        description: "Recall classification reason"
        constraints: "enum: PATHOGEN_CONTAMINATION | NUTRIENT_DEVIATION | FOREIGN_MATTER | MISLABELING | PACKAGING_DEFECT | PRECAUTIONARY"
      - name: recall_class
        type: enum
        source: input
        required: true
        description: "Regulatory recall classification"
        constraints: "enum: CLASS_I | CLASS_II | CLASS_III"
      - name: scope_description
        type: string
        source: input
        required: true
        description: "Narrative description of the recall scope"
      - name: status
        type: enum
        source: system
        required: true
        description: "Recall lifecycle status"
        constraints: "enum: INITIATED | NOTIFIED | IN_PROGRESS | EFFECTIVENESS_CHECK | COMPLETED | TERMINATED"
        default: INITIATED
      - name: initiated_by
        type: string
        source: system
        required: true
        description: "User ID of the person who initiated the recall"
      - name: initiated_at
        type: datetime
        source: system
        required: true
        description: "Timestamp when recall was initiated"
      - name: completed_at
        type: datetime
        source: system
        required: false
        description: "Timestamp when recall was completed"
      - name: effectiveness_checks
        type: array
        source: system
        required: false
        description: "Array of effectiveness check results: [{check_date, consignee_count, response_count, recovery_pct}]"

  - name: RecallScope
    parent: RecallCampaign
    common_fields: true
    fields:
      - name: recall_id
        type: string
        source: input
        required: true
        description: "FK -> RecallCampaign.id; the recall campaign this scope entry belongs to"
      - name: batch_id
        type: string
        source: input
        required: true
        description: "FK -> ProductionBatch.id; the batch being recalled"
      - name: withdrawal_level
        type: enum
        source: input
        required: true
        description: "Level of distribution chain to withdraw from"
        constraints: "enum: CONSUMER | RETAIL | WHOLESALE | DISTRIBUTION_CENTER"
      - name: status
        type: enum
        source: system
        required: true
        description: "Withdrawal status for this scope entry"
        constraints: "enum: PENDING | NOTIFIED | IN_PROGRESS | RECOVERED | VERIFIED"
        default: PENDING
      - name: quantity_shipped_kg
        type: number
        source: input
        required: true
        description: "Total quantity of this batch that was shipped"
        constraints: "number >= 0, 3 decimal places"
      - name: quantity_recovered_kg
        type: number
        source: system
        required: true
        description: "Running total of recovered quantity"
        default: 0
      - name: recovery_pct
        type: number
        source: computed
        required: true
        description: "Computed: quantity_recovered_kg / quantity_shipped_kg * 100, 2 decimal places"

  - name: AllocationPlan
    parent: null
    common_fields: true
    fields:
      - name: plan_ref
        type: string
        source: system
        required: true
        description: "System-generated allocation plan reference, format: A-{YYYYMMDD}-{seq}"
        constraints: "unique"
      - name: formula_id
        type: string
        source: input
        required: true
        description: "FK -> Formula.id; the formula/product being allocated"
      - name: total_available_kg
        type: number
        source: input
        required: true
        description: "Total available quantity for allocation"
        constraints: "number > 0, 3 decimal places"
      - name: allocation_method
        type: enum
        source: input
        required: true
        description: "Allocation strategy to apply"
        constraints: "enum: PRO_RATA | PRIORITY_TIER | EQUAL_SPLIT | WATERFALL"
      - name: status
        type: enum
        source: system
        required: true
        description: "Allocation plan lifecycle"
        constraints: "enum: DRAFT | ACTIVE | FULFILLED | CANCELLED"
        default: DRAFT
      - name: activated_at
        type: datetime
        source: system
        required: false
        description: "Timestamp when plan was activated"
      - name: fulfilled_at
        type: datetime
        source: system
        required: false
        description: "Timestamp when all allocations were fulfilled"

  - name: AllocationEntry
    parent: AllocationPlan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        required: true
        description: "FK -> AllocationPlan.id; the allocation plan this entry belongs to"
      - name: customer_code
        type: string
        source: input
        required: true
        description: "Customer or distribution channel code"
      - name: customer_name
        type: string
        source: input
        required: true
        description: "Customer name"
      - name: requested_kg
        type: number
        source: input
        required: true
        description: "Quantity requested by this customer"
        constraints: "number > 0, 3 decimal places"
      - name: priority_tier
        type: integer
        source: input
        required: false
        description: "Priority tier for PRIORITY_TIER or WATERFALL allocation; lower = higher priority"
        constraints: "integer >= 1 and <= 10"
      - name: allocated_kg
        type: number
        source: computed
        required: true
        description: "Computed allocation quantity based on plan method"
        default: 0
      - name: fulfilled_kg
        type: number
        source: system
        required: true
        description: "Running total of quantity actually shipped"
        default: 0
      - name: status
        type: enum
        source: system
        required: true
        description: "Entry fulfillment status"
        constraints: "enum: PENDING | PARTIALLY_FULFILLED | FULFILLED | SHORTFALL"
        default: PENDING

  - name: SystemUser
    parent: null
    common_fields: false
    fields:
      - name: username
        type: string
        source: input
        required: true
        description: "Unique username for system access"
        constraints: "unique"
      - name: full_name
        type: string
        source: input
        required: true
        description: "Full name of the user"
      - name: role
        type: enum
        source: input
        required: true
        description: "Primary role for RBAC"
        constraints: "enum: QA_MANAGER | PRODUCTION_SUPERVISOR | REGULATORY_AFFAIRS | QUALITY_ANALYST | SUPPLY_CHAIN_PLANNER | COMPLAINT_HANDLER | ADMIN"
      - name: department
        type: string
        source: input
        required: true
        description: "Department name"

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: NutrientProfile
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/v1/nutrient-profiles/{id}/submit"
        actor: RegulatoryAffairs
        preconditions:
          - "nutrient_specs array is non-empty"
          - "every nutrient_spec has min_per_100kcal <= max_per_100kcal"
          - "every nutrient_spec has min_per_100kcal <= target_per_100kcal <= max_per_100kcal"
        side_effects:
          - "increments NutrientProfile.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/v1/nutrient-profiles/{id}/approve"
        actor: RegulatoryAffairs
        preconditions:
          - "approver is not the same user who submitted (segregation of duties)"
        side_effects:
          - "sets effective_from to current timestamp if not already set"
          - "supersedes any currently APPROVED NutrientProfile with same profile_code: that profile transitions APPROVED -> SUPERSEDED, its effective_until set to now"
          - "increments NutrientProfile.version by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /api/v1/nutrient-profiles/{id}/return-for-revision"
        actor: RegulatoryAffairs
        preconditions: []
        side_effects:
          - "increments NutrientProfile.version by 1"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system auto-transition when a newer version of same profile_code is APPROVED"
        actor: system
        preconditions:
          - "a newer NutrientProfile with same profile_code has just transitioned to APPROVED"
        side_effects:
          - "sets effective_until to the newer profile's effective_from"
          - "increments NutrientProfile.version by 1"
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /api/v1/nutrient-profiles/{id}/withdraw"
        actor: RegulatoryAffairs
        preconditions:
          - "no Formula with status ACTIVE references this NutrientProfile"
        side_effects:
          - "increments NutrientProfile.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /api/v1/nutrient-profiles/{id}/withdraw"
        actor: RegulatoryAffairs
        preconditions: []
        side_effects:
          - "increments NutrientProfile.version by 1"

  - entity: Supplier
    initial_state: PENDING_AUDIT
    terminal_states: [DISQUALIFIED]
    transitions:
      - from: PENDING_AUDIT
        to: QUALIFIED
        trigger: "POST /api/v1/suppliers/{id}/audits with result PASS or CONDITIONAL_PASS"
        actor: QualityAnalyst
        preconditions:
          - "the submitted AuditRecord has result PASS or CONDITIONAL_PASS"
          - "audit_date is within the last 365 days"
        side_effects:
          - "sets last_audit_date to audit_date"
          - "computes next_audit_due = audit_date + audit_frequency_days"
          - "recomputes risk_rating from audit score"
          - "increments Supplier.version by 1"
      - from: QUALIFIED
        to: SUSPENDED
        trigger: "POST /api/v1/suppliers/{id}/suspend"
        actor: QualityAnalyst
        preconditions:
          - "reason for suspension provided in request body"
        side_effects:
          - "transitions all IngredientLot with qc_status QC_PASSED and supplier_id == this supplier to QUARANTINED"
          - "increments Supplier.version by 1"
      - from: SUSPENDED
        to: QUALIFIED
        trigger: "POST /api/v1/suppliers/{id}/reinstate"
        actor: QualityAnalyst
        preconditions:
          - "a new AuditRecord with result PASS has been submitted after the suspension date"
        side_effects:
          - "sets last_audit_date to new audit_date"
          - "computes next_audit_due"
          - "recomputes risk_rating"
          - "transitions all IngredientLot with qc_status QUARANTINED and supplier_id == this supplier back to QC_PASSED"
          - "increments Supplier.version by 1"
      - from: SUSPENDED
        to: DISQUALIFIED
        trigger: "POST /api/v1/suppliers/{id}/disqualify"
        actor: QaManager
        preconditions:
          - "supplier is currently SUSPENDED"
          - "disqualification rationale provided"
        side_effects:
          - "transitions all IngredientLot with supplier_id == this supplier and qc_status != QC_FAILED to QC_FAILED"
          - "increments Supplier.version by 1"
      - from: PENDING_AUDIT
        to: DISQUALIFIED
        trigger: "POST /api/v1/suppliers/{id}/disqualify"
        actor: QaManager
        preconditions:
          - "disqualification rationale provided"
        side_effects:
          - "increments Supplier.version by 1"

  - entity: IngredientLot
    initial_state: PENDING_QC
    terminal_states: [QC_FAILED]
    transitions:
      - from: PENDING_QC
        to: QC_PASSED
        trigger: "POST /api/v1/ingredient-lots/{id}/qc-pass"
        actor: QualityAnalyst
        preconditions:
          - "supplier of this lot has qualification_status == QUALIFIED"
          - "expiry_date > current timestamp"
          - "no recall campaign is active for this ingredient lot"
        side_effects:
          - "increments IngredientLot.version by 1"
      - from: PENDING_QC
        to: QC_FAILED
        trigger: "POST /api/v1/ingredient-lots/{id}/qc-fail"
        actor: QualityAnalyst
        preconditions:
          - "failure_reason provided in request body"
        side_effects:
          - "increments IngredientLot.version by 1"
      - from: QC_PASSED
        to: QUARANTINED
        trigger: "system cascade when Supplier is suspended, or POST /api/v1/ingredient-lots/{id}/quarantine"
        actor: system
        preconditions:
          - "triggered by Supplier QUALIFIED -> SUSPENDED transition, or explicit quarantine action"
        side_effects:
          - "increments IngredientLot.version by 1"
      - from: QUARANTINED
        to: QC_PASSED
        trigger: "system cascade when Supplier is reinstated, or POST /api/v1/ingredient-lots/{id}/release-quarantine"
        actor: system
        preconditions:
          - "triggered by Supplier SUSPENDED -> QUALIFIED transition, or explicit release"
        side_effects:
          - "increments IngredientLot.version by 1"
      - from: QUARANTINED
        to: QC_FAILED
        trigger: "system cascade when Supplier is disqualified"
        actor: system
        preconditions:
          - "triggered by Supplier SUSPENDED -> DISQUALIFIED transition"
        side_effects:
          - "increments IngredientLot.version by 1"

  - entity: Formula
    initial_state: DRAFT
    terminal_states: [DISCONTINUED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /api/v1/formulas/{id}/submit-for-review"
        actor: RegulatoryAffairs
        preconditions:
          - "ingredients array percentages sum to 100.000 (tolerance 0.001)"
          - "nutrient_profile_id references an APPROVED NutrientProfile"
          - "all ingredients referenced in ingredients array exist"
        side_effects:
          - "increments Formula.version by 1"
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /api/v1/formulas/{id}/approve"
        actor: QaManager
        preconditions:
          - "approver is not the same user who submitted for review (segregation of duties)"
          - "at least one ProcessValidation with status PASSED exists for this formula and validation_type matches process_type"
        side_effects:
          - "increments Formula.version by 1"
      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /api/v1/formulas/{id}/return-for-revision"
        actor: QaManager
        preconditions: []
        side_effects:
          - "increments Formula.version by 1"
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /api/v1/formulas/{id}/activate"
        actor: QaManager
        preconditions:
          - "at least one LabelSubmission with status APPROVED exists for this formula"
          - "at least one ProcessValidation with status PASSED and valid_until > current timestamp exists"
        side_effects:
          - "increments Formula.version by 1"
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /api/v1/formulas/{id}/discontinue"
        actor: QaManager
        preconditions:
          - "no ProductionBatch with status IN_PRODUCTION or TESTING or POSITIVE_RELEASE_HOLD exists for this formula"
        side_effects:
          - "increments Formula.version by 1"

  - entity: ProductionBatch
    initial_state: PLANNED
    terminal_states: [RELEASED, REJECTED, RECALLED]
    transitions:
      - from: PLANNED
        to: IN_PRODUCTION
        trigger: "POST /api/v1/production-batches/{id}/start-production"
        actor: ProductionSupervisor
        preconditions:
          - "formula has status ACTIVE"
          - "all required ingredient lots have qc_status QC_PASSED and sufficient remaining_kg"
          - "for DRY_BLEND or COMBINATION formulas: at least one ProcessValidation with type DRY_BLEND_HOMOGENEITY and status PASSED and valid_until > now exists"
          - "for WET_PROCESS or COMBINATION formulas: at least one ProcessValidation with type WET_PROCESS_THERMAL and status PASSED and valid_until > now exists"
        side_effects:
          - "decrements remaining_kg on each consumed IngredientLot via FIFO by expiry_date ASC, created_at ASC as tie-break"
          - "populates ingredient_consumptions array with consumed lot references"
          - "increments ProductionBatch.version by 1"
      - from: IN_PRODUCTION
        to: BLENDING_COMPLETE
        trigger: "POST /api/v1/production-batches/{id}/complete-blending"
        actor: ProductionSupervisor
        preconditions:
          - "process_type is DRY_BLEND or COMBINATION"
        side_effects:
          - "increments ProductionBatch.version by 1"
      - from: IN_PRODUCTION
        to: PROCESSING_COMPLETE
        trigger: "POST /api/v1/production-batches/{id}/complete-processing"
        actor: ProductionSupervisor
        preconditions:
          - "process_type is WET_PROCESS"
        side_effects:
          - "sets actual_yield_kg from request"
          - "increments ProductionBatch.version by 1"
      - from: BLENDING_COMPLETE
        to: PROCESSING_COMPLETE
        trigger: "POST /api/v1/production-batches/{id}/complete-processing"
        actor: ProductionSupervisor
        preconditions: []
        side_effects:
          - "sets actual_yield_kg from request"
          - "increments ProductionBatch.version by 1"
      - from: PROCESSING_COMPLETE
        to: TESTING
        trigger: "POST /api/v1/production-batches/{id}/submit-for-testing"
        actor: QualityAnalyst
        preconditions:
          - "actual_yield_kg is set and > 0"
        side_effects:
          - "increments ProductionBatch.version by 1"
      - from: TESTING
        to: POSITIVE_RELEASE_HOLD
        trigger: "POST /api/v1/production-batches/{id}/submit-test-results"
        actor: QualityAnalyst
        preconditions:
          - "nutrient_results submitted for every nutrient in the formula's NutrientProfile"
          - "pathogen_results submitted for at least the required pathogen panel per ingredient risk class"
        side_effects:
          - "populates nutrient_results and pathogen_results"
          - "auto-evaluates each nutrient_result against min/max and sets pass flag"
          - "auto-evaluates each pathogen_result: detected=false required for pass"
          - "increments ProductionBatch.version by 1"
      - from: POSITIVE_RELEASE_HOLD
        to: RELEASED
        trigger: "POST /api/v1/production-batches/{id}/release"
        actor: QaManager
        preconditions:
          - "all nutrient_results have pass == true"
          - "all pathogen_results have detected == false"
          - "releasing QaManager is not the same user who submitted test results (segregation of duties)"
          - "computes expiry_date from production_date + shelf-life"
        side_effects:
          - "sets release_decision to RELEASED"
          - "computes and sets expiry_date"
          - "increments ProductionBatch.version by 1"
      - from: POSITIVE_RELEASE_HOLD
        to: REJECTED
        trigger: "POST /api/v1/production-batches/{id}/reject"
        actor: QaManager
        preconditions:
          - "rejection_reason provided"
          - "at least one nutrient_result has pass == false OR at least one pathogen_result has detected == true"
        side_effects:
          - "sets release_decision to REJECTED"
          - "restores remaining_kg on all consumed IngredientLots (compensation)"
          - "increments ProductionBatch.version by 1"
      - from: RELEASED
        to: RECALLED
        trigger: "system cascade when RecallScope entry is created for this batch"
        actor: system
        preconditions:
          - "a RecallCampaign with status INITIATED or later adds a RecallScope entry referencing this batch"
        side_effects:
          - "increments ProductionBatch.version by 1"
          - "if any AllocationEntry has fulfilled_kg from this batch, flags those entries for recall notification"

  - entity: ProcessValidation
    initial_state: PLANNED
    terminal_states: [PASSED, FAILED, EXPIRED]
    transitions:
      - from: PLANNED
        to: IN_PROGRESS
        trigger: "POST /api/v1/process-validations/{id}/start"
        actor: ProductionSupervisor
        preconditions: []
        side_effects:
          - "sets started_at"
          - "increments ProcessValidation.version by 1"
      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /api/v1/process-validations/{id}/complete"
        actor: QualityAnalyst
        preconditions:
          - "all test_results entries have pass == true"
        side_effects:
          - "sets completed_at"
          - "computes valid_until = completed_at + validation_validity_days"
          - "increments ProcessValidation.version by 1"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /api/v1/process-validations/{id}/fail"
        actor: QualityAnalyst
        preconditions:
          - "at least one test_results entry has pass == false"
          - "failure_summary provided"
        side_effects:
          - "sets completed_at"
          - "increments ProcessValidation.version by 1"
      - from: PASSED
        to: EXPIRED
        trigger: "system auto-transition when current timestamp > valid_until"
        actor: system
        preconditions:
          - "current timestamp > valid_until"
        side_effects:
          - "increments ProcessValidation.version by 1"

  - entity: LabelSubmission
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/v1/label-submissions/{id}/submit"
        actor: RegulatoryAffairs
        preconditions:
          - "label_text is non-empty"
          - "formula has status APPROVED or ACTIVE"
        side_effects:
          - "sets submitted_at"
          - "increments LabelSubmission.version by 1"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /api/v1/label-submissions/{id}/assign-reviewer"
        actor: QaManager
        preconditions:
          - "reviewer_id references a SystemUser with role REGULATORY_AFFAIRS or QA_MANAGER"
        side_effects:
          - "sets reviewer_id"
          - "increments LabelSubmission.version by 1"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /api/v1/label-submissions/{id}/approve"
        actor: QaManager
        preconditions:
          - "approver is not the same user who submitted (segregation of duties)"
          - "all review_comments have resolved == true"
        side_effects:
          - "sets decided_at"
          - "increments LabelSubmission.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /api/v1/label-submissions/{id}/reject"
        actor: QaManager
        preconditions:
          - "at least one review_comment has resolved == false"
          - "rejection_reason provided"
        side_effects:
          - "sets decided_at"
          - "increments LabelSubmission.version by 1"
      - from: UNDER_REVIEW
        to: DRAFT
        trigger: "POST /api/v1/label-submissions/{id}/return-for-revision"
        actor: QaManager
        preconditions: []
        side_effects:
          - "increments LabelSubmission.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /api/v1/label-submissions/{id}/withdraw"
        actor: RegulatoryAffairs
        preconditions: []
        side_effects:
          - "increments LabelSubmission.version by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /api/v1/label-submissions/{id}/withdraw"
        actor: RegulatoryAffairs
        preconditions: []
        side_effects:
          - "increments LabelSubmission.version by 1"

  - entity: Complaint
    initial_state: RECEIVED
    terminal_states: [CLOSED]
    transitions:
      - from: RECEIVED
        to: INVESTIGATING
        trigger: "POST /api/v1/complaints/{id}/start-investigation"
        actor: ComplaintHandler
        preconditions: []
        side_effects:
          - "increments Complaint.version by 1"
      - from: INVESTIGATING
        to: ESCALATED
        trigger: "POST /api/v1/complaints/{id}/escalate"
        actor: ComplaintHandler
        preconditions:
          - "is_adverse_event == true OR severity in {HIGH, CRITICAL}"
          - "escalation_reason provided"
        side_effects:
          - "sets escalated_at"
          - "if batch_id is set and batch status is RELEASED, flags batch for potential recall review"
          - "increments Complaint.version by 1"
      - from: INVESTIGATING
        to: RESOLVED
        trigger: "POST /api/v1/complaints/{id}/resolve"
        actor: ComplaintHandler
        preconditions:
          - "resolution text is non-empty"
        side_effects:
          - "sets resolved_at"
          - "increments Complaint.version by 1"
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /api/v1/complaints/{id}/resolve"
        actor: QaManager
        preconditions:
          - "resolution text is non-empty"
          - "if batch_id is set: batch has been reviewed for recall linkage (either recall initiated or documented no-recall decision)"
        side_effects:
          - "sets resolved_at"
          - "increments Complaint.version by 1"
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /api/v1/complaints/{id}/close"
        actor: ComplaintHandler
        preconditions:
          - "resolved_at is set"
        side_effects:
          - "increments Complaint.version by 1"

  - entity: RecallCampaign
    initial_state: INITIATED
    terminal_states: [COMPLETED, TERMINATED]
    transitions:
      - from: INITIATED
        to: NOTIFIED
        trigger: "POST /api/v1/recall-campaigns/{id}/notify"
        actor: RegulatoryAffairs
        preconditions:
          - "at least one RecallScope entry exists for this campaign"
          - "all RecallScope entries have status PENDING"
        side_effects:
          - "transitions all RecallScope entries from PENDING to NOTIFIED"
          - "increments RecallCampaign.version by 1"
      - from: NOTIFIED
        to: IN_PROGRESS
        trigger: "POST /api/v1/recall-campaigns/{id}/begin-recovery"
        actor: SupplyChainPlanner
        preconditions: []
        side_effects:
          - "transitions all RecallScope entries from NOTIFIED to IN_PROGRESS"
          - "increments RecallCampaign.version by 1"
      - from: IN_PROGRESS
        to: EFFECTIVENESS_CHECK
        trigger: "POST /api/v1/recall-campaigns/{id}/start-effectiveness-check"
        actor: QualityAnalyst
        preconditions:
          - "all RecallScope entries have status RECOVERED or VERIFIED"
        side_effects:
          - "populates effectiveness_checks from aggregated RecallScope data"
          - "increments RecallCampaign.version by 1"
      - from: EFFECTIVENESS_CHECK
        to: COMPLETED
        trigger: "POST /api/v1/recall-campaigns/{id}/complete"
        actor: QaManager
        preconditions:
          - "all RecallScope entries have status VERIFIED"
          - "overall recovery_pct >= 90.00 for CLASS_I recalls, >= 80.00 for CLASS_II, >= 70.00 for CLASS_III"
        side_effects:
          - "sets completed_at"
          - "increments RecallCampaign.version by 1"
      - from: INITIATED
        to: TERMINATED
        trigger: "POST /api/v1/recall-campaigns/{id}/terminate"
        actor: QaManager
        preconditions:
          - "termination_reason provided"
        side_effects:
          - "transitions all RecallScope entries to VERIFIED (marking them closed)"
          - "restores ProductionBatch status from RECALLED to RELEASED for all batches in scope"
          - "increments RecallCampaign.version by 1"

  - entity: AllocationPlan
    initial_state: DRAFT
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/v1/allocation-plans/{id}/activate"
        actor: SupplyChainPlanner
        preconditions:
          - "at least one AllocationEntry exists for this plan"
          - "total_available_kg > 0"
        side_effects:
          - "runs the allocation calculation based on allocation_method and populates allocated_kg on each entry"
          - "sets activated_at"
          - "increments AllocationPlan.version by 1"
      - from: ACTIVE
        to: FULFILLED
        trigger: "system auto-transition when all entries reach status FULFILLED or SHORTFALL"
        actor: system
        preconditions:
          - "every AllocationEntry for this plan has status FULFILLED or SHORTFALL"
        side_effects:
          - "sets fulfilled_at"
          - "increments AllocationPlan.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/v1/allocation-plans/{id}/cancel"
        actor: SupplyChainPlanner
        preconditions: []
        side_effects:
          - "increments AllocationPlan.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /api/v1/allocation-plans/{id}/cancel"
        actor: SupplyChainPlanner
        preconditions:
          - "no AllocationEntry has fulfilled_kg > 0"
        side_effects:
          - "increments AllocationPlan.version by 1"

  - entity: AllocationEntry
    initial_state: PENDING
    terminal_states: [FULFILLED, SHORTFALL]
    transitions:
      - from: PENDING
        to: PARTIALLY_FULFILLED
        trigger: "POST /api/v1/allocation-entries/{id}/record-fulfillment"
        actor: SupplyChainPlanner
        preconditions:
          - "parent AllocationPlan has status ACTIVE"
          - "fulfilled_kg after this record <= allocated_kg"
        side_effects:
          - "increments fulfilled_kg by the recorded amount"
          - "increments AllocationEntry.version by 1"
      - from: PENDING
        to: FULFILLED
        trigger: "POST /api/v1/allocation-entries/{id}/record-fulfillment when total fulfilled equals allocated"
        actor: SupplyChainPlanner
        preconditions:
          - "parent AllocationPlan has status ACTIVE"
          - "cumulative fulfilled_kg == allocated_kg after this record"
        side_effects:
          - "increments fulfilled_kg"
          - "increments AllocationEntry.version by 1"
      - from: PARTIALLY_FULFILLED
        to: FULFILLED
        trigger: "POST /api/v1/allocation-entries/{id}/record-fulfillment when total fulfilled equals allocated"
        actor: SupplyChainPlanner
        preconditions:
          - "parent AllocationPlan has status ACTIVE"
          - "cumulative fulfilled_kg == allocated_kg after this record"
        side_effects:
          - "increments fulfilled_kg"
          - "increments AllocationEntry.version by 1"
      - from: PENDING
        to: SHORTFALL
        trigger: "POST /api/v1/allocation-entries/{id}/mark-shortfall"
        actor: SupplyChainPlanner
        preconditions:
          - "parent AllocationPlan has status ACTIVE"
          - "allocated_kg < requested_kg"
          - "shortfall_reason provided"
        side_effects:
          - "increments AllocationEntry.version by 1"
      - from: PARTIALLY_FULFILLED
        to: SHORTFALL
        trigger: "POST /api/v1/allocation-entries/{id}/mark-shortfall"
        actor: SupplyChainPlanner
        preconditions:
          - "parent AllocationPlan has status ACTIVE"
          - "fulfilled_kg < allocated_kg"
          - "shortfall_reason provided"
        side_effects:
          - "increments AllocationEntry.version by 1"

# =============================================================================
# Concurrency Rules (§1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: batch-release-stale-formula
    parent_entity: Formula
    write_endpoint: "POST /api/v1/production-batches"
    occ_field: "expected_formula_version"
    description: |
      Creating a ProductionBatch against a Formula whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has modified the formula (e.g., ingredient change
      or process_type update) and the current writer's view of the formula
      is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: allocation-activate-stale-plan
    parent_entity: AllocationPlan
    write_endpoint: "POST /api/v1/allocation-plans/{id}/activate"
    occ_field: "expected_plan_version"
    description: |
      Activating an AllocationPlan whose version has advanced since the client
      last observed it is rejected. This captures the case where another writer
      has added, removed, or modified AllocationEntries and the current writer's
      view of the plan is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: nutrient_compliance_check
    description: "Evaluate whether a batch's measured nutrient values comply with the regulatory nutrient profile. Two variants: standard evaluation uses min/max as hard limits; borderline-evaluation variant uses tightened tolerance bands for infant formula (0-6 months) to add a 2% safety margin on minimum nutrients."
    trigger: "when ProductionBatch transitions TESTING -> POSITIVE_RELEASE_HOLD"
    inputs:
      - ProductionBatch.nutrient_results
      - NutrientProfile.nutrient_specs
      - Formula.nutrient_profile_id
    algorithm: threshold
    formula: |
      For each nutrient_spec in profile.nutrient_specs:
        result = find nutrient_results where nutrient_code == spec.nutrient_code
        if result is null: fail (missing nutrient)
        if variant == "standard":
          pass = (result.measured_per_100kcal >= spec.min_per_100kcal)
                 AND (result.measured_per_100kcal <= spec.max_per_100kcal)
        if variant == "borderline_infant":
          effective_min = spec.min_per_100kcal * 1.02
          effective_max = spec.max_per_100kcal * 0.98
          pass = (result.measured_per_100kcal >= effective_min)
                 AND (result.measured_per_100kcal <= effective_max)
      overall_pass = all individual pass flags are true
    constants:
      INFANT_SAFETY_MARGIN_MIN: 1.02
      INFANT_SAFETY_MARGIN_MAX: 0.98
    precision: "4 decimal places for nutrient values, round_half_up"
    variants:
      - name: standard
        when: "profile_code is not INF-0-6M"
        difference: "uses raw min/max from nutrient_specs as hard limits"
      - name: borderline_infant
        when: "profile_code is INF-0-6M (0-6 month infant formula)"
        difference: "tightens min by 2% upward and max by 2% downward before comparison, producing stricter pass/fail outcomes for identical measured values"

  - name: allocation_pro_rata
    description: "Distribute available quantity across allocation entries proportionally to requested amounts. Provisional allocation at plan activation may differ from final allocation after entry adjustments."
    trigger: "when AllocationPlan transitions DRAFT -> ACTIVE"
    inputs:
      - AllocationPlan.total_available_kg
      - AllocationEntry.requested_kg (for all entries in PENDING status)
    algorithm: waterfall_allocation
    formula: |
      total_requested = sum of all entry.requested_kg for entries with status PENDING
      if total_requested <= total_available_kg:
        each entry.allocated_kg = entry.requested_kg
      else:
        ratio = total_available_kg / total_requested
        For each entry, in order of created_at ASC:
          raw_allocation = entry.requested_kg * ratio
          entry.allocated_kg = floor(raw_allocation * 1000) / 1000  # truncate to 3 decimal places
        remainder = total_available_kg - sum(entry.allocated_kg)
        # Distribute remainder one entry at a time in created_at ASC order
        For each entry in created_at ASC order:
          if remainder >= 0.001:
            entry.allocated_kg += 0.001
            remainder -= 0.001
          else:
            break
    constants:
      PRECISION_KG: 0.001
    precision: "3 decimal places for kg quantities, truncate (floor) not round"
    variants:
      - name: provisional
        when: "at plan activation, before any fulfillment records"
        difference: "computed from requested_kg only; may be revised if entries are added/removed before first fulfillment"
      - name: final
        when: "after any entry modification post-activation"
        difference: "recomputed using only entries still in PENDING status, potentially yielding different allocations for the same inputs if entries changed"

  - name: allocation_priority_tier
    description: "Distribute available quantity by priority tier — fill higher tiers (lower tier number) completely before moving to next tier. Within a tier, distribute pro-rata."
    trigger: "when AllocationPlan transitions DRAFT -> ACTIVE with allocation_method == PRIORITY_TIER"
    inputs:
      - AllocationPlan.total_available_kg
      - AllocationEntry.requested_kg
      - AllocationEntry.priority_tier
    algorithm: waterfall_allocation
    formula: |
      remaining = total_available_kg
      For tier in 1..10 (ascending):
        tier_entries = entries where priority_tier == tier AND status == PENDING
        if tier_entries is empty: continue
        tier_requested = sum(tier_entries.requested_kg)
        if remaining >= tier_requested:
          each entry in tier: allocated_kg = requested_kg
          remaining -= tier_requested
        else:
          # Pro-rata within this tier
          ratio = remaining / tier_requested
          For each entry in tier, ordered by created_at ASC:
            raw = entry.requested_kg * ratio
            entry.allocated_kg = floor(raw * 1000) / 1000
          # Remainder distribution within tier
          tier_allocated = sum(tier_entries.allocated_kg)
          tier_remainder = remaining - tier_allocated
          For each entry in tier, ordered by created_at ASC:
            if tier_remainder >= 0.001:
              entry.allocated_kg += 0.001
              tier_remainder -= 0.001
          remaining = 0
          break
      # Entries in tiers not reached get allocated_kg = 0
    constants:
      PRECISION_KG: 0.001
    precision: "3 decimal places for kg quantities, truncate (floor) not round"

  - name: allocation_equal_split
    description: "Distribute available quantity equally across all PENDING entries, capped at requested_kg."
    trigger: "when AllocationPlan transitions DRAFT -> ACTIVE with allocation_method == EQUAL_SPLIT"
    inputs:
      - AllocationPlan.total_available_kg
      - AllocationEntry.requested_kg
    algorithm: waterfall_allocation
    formula: |
      n = count of entries with status PENDING
      if n == 0: no allocation
      base_share = floor((total_available_kg / n) * 1000) / 1000
      For each entry in created_at ASC order:
        entry.allocated_kg = min(base_share, entry.requested_kg)
      # Redistribute surplus from capped entries
      surplus = total_available_kg - sum(entry.allocated_kg)
      uncapped = entries where allocated_kg < requested_kg, in created_at ASC order
      while surplus >= 0.001 and uncapped is non-empty:
        per_entry_surplus = floor((surplus / len(uncapped)) * 1000) / 1000
        if per_entry_surplus < 0.001:
          # Give remaining surplus to first uncapped entry
          uncapped[0].allocated_kg += surplus
          surplus = 0
        else:
          For each entry in uncapped:
            grant = min(per_entry_surplus, entry.requested_kg - entry.allocated_kg)
            entry.allocated_kg += grant
            surplus -= grant
          uncapped = entries where allocated_kg < requested_kg
    constants:
      PRECISION_KG: 0.001
    precision: "3 decimal places for kg quantities, truncate (floor) not round"

  - name: supplier_risk_rating
    description: "Compute supplier risk rating from weighted audit scores. Uses the most recent passing audit score weighted with a recency decay factor."
    trigger: "when Supplier transitions to QUALIFIED, or when a new AuditRecord is submitted for a QUALIFIED supplier"
    inputs:
      - AuditRecord.score (most recent PASS or CONDITIONAL_PASS audit)
      - AuditRecord.audit_date
      - current timestamp
    algorithm: weighted_scoring
    formula: |
      days_since_audit = (current_timestamp - audit_date) / 86400
      recency_factor = max(0.5, 1.0 - (days_since_audit / 730))
      adjusted_score = audit_score * recency_factor
      if adjusted_score >= 80: risk_rating = LOW
      elif adjusted_score >= 60: risk_rating = MEDIUM
      else: risk_rating = HIGH
    constants:
      RECENCY_DECAY_PERIOD_DAYS: 730
      MIN_RECENCY_FACTOR: 0.5
      LOW_RISK_THRESHOLD: 80
      MEDIUM_RISK_THRESHOLD: 60
    precision: "2 decimal places, round_half_up"

  - name: audit_result_determination
    description: "Compute audit result from score and findings. The presence of critical findings can override a numerically passing score."
    trigger: "when AuditRecord is created"
    inputs:
      - AuditRecord.score
      - AuditRecord.findings (severity field of each finding)
    algorithm: threshold
    formula: |
      has_critical = any finding with severity == "CRITICAL"
      has_major = any finding with severity == "MAJOR"
      if has_critical:
        result = FAIL
      elif score < 50.00:
        result = FAIL
      elif has_major OR score < 75.00:
        result = CONDITIONAL_PASS
      else:
        result = PASS
    constants:
      PASS_THRESHOLD: 75.00
      FAIL_THRESHOLD: 50.00
    precision: "2 decimal places for score comparison"

  - name: batch_expiry_calculation
    description: "Compute batch expiry date from production completion date and formula shelf-life. Shelf-life varies by product type."
    trigger: "when ProductionBatch transitions POSITIVE_RELEASE_HOLD -> RELEASED"
    inputs:
      - ProductionBatch.production_date
      - Formula.process_type
      - NutrientProfile.profile_code
    algorithm: threshold
    formula: |
      if profile_code == INF-0-6M:
        shelf_life_months = 24
      elif profile_code == INF-6-12M:
        shelf_life_months = 24
      elif profile_code == TODDLER-12-36M:
        shelf_life_months = 18
      elif profile_code == CEREAL-6M:
        shelf_life_months = 12
      elif profile_code == PUREE-4M:
        shelf_life_months = 9
      else:
        shelf_life_months = 12
      if process_type == DRY_BLEND:
        shelf_life_months += 3  # dry blend has longer shelf life
      expiry_date = production_date + shelf_life_months (calendar months)
    constants:
      SHELF_LIFE_INF_0_6M: 24
      SHELF_LIFE_INF_6_12M: 24
      SHELF_LIFE_TODDLER: 18
      SHELF_LIFE_CEREAL: 12
      SHELF_LIFE_PUREE: 9
      DRY_BLEND_BONUS_MONTHS: 3
    precision: "date arithmetic, calendar months (not 30-day months)"

  - name: recovery_percentage
    description: "Compute recovery percentage for a RecallScope entry. Used to determine recall effectiveness."
    trigger: "when RecallScope quantity_recovered_kg is updated"
    inputs:
      - RecallScope.quantity_shipped_kg
      - RecallScope.quantity_recovered_kg
    algorithm: aggregation
    formula: |
      if quantity_shipped_kg == 0:
        recovery_pct = 100.00  # vacuously complete
      else:
        recovery_pct = (quantity_recovered_kg / quantity_shipped_kg) * 100
        recovery_pct = round(recovery_pct, 2)  # 2 decimal places, round_half_up
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: fifo_consumption_order
    description: "Determine the order in which ingredient lots are consumed during batch production. Strictly FIFO by expiry date to minimize waste."
    trigger: "when ProductionBatch transitions PLANNED -> IN_PRODUCTION"
    inputs:
      - IngredientLot.remaining_kg (for all lots of required ingredients with qc_status QC_PASSED)
      - IngredientLot.expiry_date
      - IngredientLot.created_at
    algorithm: chronological
    formula: |
      For each ingredient required by the formula:
        required_kg = batch_size_kg * (ingredient.percentage_by_weight / 100)
        eligible_lots = lots where ingredient_id matches AND qc_status == QC_PASSED
                        AND remaining_kg > 0 AND expiry_date > current_timestamp
        Sort eligible_lots by: expiry_date ASC, created_at ASC
        # Consume lots in sorted order until required_kg is met
        consumed = 0
        For each lot in sorted order:
          take = min(lot.remaining_kg, required_kg - consumed)
          if take <= 0: break
          lot.remaining_kg -= take
          consumed += take
          record in ingredient_consumptions: {ingredient_lot_id: lot.id, consumed_kg: take, consumption_order: <sequence>}
        if consumed < required_kg:
          fail with ERR_INSUFFICIENT_INGREDIENT_QUANTITY
    constants: {}
    precision: "3 decimal places for kg quantities"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role value is a recognized role from the RBAC matrix"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "The role specified in X-User-Role is authorized for the requested endpoint"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "All path parameters reference existing resources, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: existence
    check: "All foreign-key fields in request body reference existing resources"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all POST/PUT/PATCH endpoints"

  - priority: 6
    category: state
    check: "Target resource is in a valid state for the requested operation (state machine precondition)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: the acting user is not the same person who performed the prior step"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /api/v1/nutrient-profiles/{id}/approve, POST /api/v1/formulas/{id}/approve, POST /api/v1/production-batches/{id}/release, POST /api/v1/label-submissions/{id}/approve"

  - priority: 8
    category: business_safety
    check: "Ingredient lot has not passed QC and is not in QUARANTINED — only QC_PASSED lots may be consumed"
    error_id: ERR_LOT_NOT_QC_PASSED
    http_status: 422
    applies_to: "POST /api/v1/production-batches/{id}/start-production"

  - priority: 9
    category: business_safety
    check: "Supplier of an ingredient lot has qualification_status QUALIFIED at time of lot consumption"
    error_id: ERR_SUPPLIER_NOT_QUALIFIED
    http_status: 422
    applies_to: "POST /api/v1/production-batches/{id}/start-production"

  - priority: 10
    category: business_safety
    check: "Required process validation is PASSED and not expired for the formula's process_type"
    error_id: ERR_VALIDATION_REQUIRED
    http_status: 422
    applies_to: "POST /api/v1/production-batches/{id}/start-production"

  - priority: 11
    category: business_safety
    check: "Ingredient lot expiry_date is after current timestamp"
    error_id: ERR_LOT_EXPIRED
    http_status: 422
    applies_to: "POST /api/v1/production-batches/{id}/start-production, POST /api/v1/ingredient-lots/{id}/qc-pass"

  - priority: 12
    category: business_constraint
    check: "Formula ingredient percentages sum to 100.000 within tolerance of 0.001"
    error_id: ERR_PERCENTAGE_SUM_INVALID
    http_status: 422
    applies_to: "POST /api/v1/formulas/{id}/submit-for-review"

  - priority: 13
    category: business_constraint
    check: "NutrientProfile nutrient_specs min <= target <= max for every nutrient"
    error_id: ERR_NUTRIENT_RANGE_INVALID
    http_status: 422
    applies_to: "POST /api/v1/nutrient-profiles/{id}/submit"

  - priority: 14
    category: business_referential
    check: "NutrientProfile referenced by formula has status APPROVED"
    error_id: ERR_PROFILE_NOT_APPROVED
    http_status: 422
    applies_to: "POST /api/v1/formulas/{id}/submit-for-review"

  - priority: 15
    category: business_constraint
    check: "Unique constraint: profile_code, supplier_code, ingredient_code, formula_code are unique"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /api/v1/nutrient-profiles, POST /api/v1/suppliers, POST /api/v1/ingredients, POST /api/v1/formulas"

  - priority: 16
    category: business_constraint
    check: "Total consumed ingredient quantity does not exceed batch requirements (over-consumption prevention)"
    error_id: ERR_INSUFFICIENT_INGREDIENT_QUANTITY
    http_status: 422
    applies_to: "POST /api/v1/production-batches/{id}/start-production"

  - priority: 17
    category: business_temporal
    check: "Audit date is within the last 365 days for qualification purposes"
    error_id: ERR_AUDIT_TOO_OLD
    http_status: 422
    applies_to: "POST /api/v1/suppliers/{id}/audits"

  - priority: 18
    category: business_temporal
    check: "Allocation fulfillment does not exceed allocated_kg"
    error_id: ERR_FULFILLMENT_EXCEEDS_ALLOCATION
    http_status: 422
    applies_to: "POST /api/v1/allocation-entries/{id}/record-fulfillment"

  - priority: 19
    category: business_fiscal
    check: "Recall effectiveness threshold met for recall class before completion"
    error_id: ERR_RECOVERY_THRESHOLD_NOT_MET
    http_status: 422
    applies_to: "POST /api/v1/recall-campaigns/{id}/complete"

  - priority: 20
    category: business_constraint
    check: "Required input fields are present and non-empty"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PUT/PATCH endpoints"

  - priority: 21
    category: business_constraint
    check: "Enum fields contain valid enum values"
    error_id: ERR_INVALID_ENUM
    http_status: 422
    applies_to: "all POST/PUT/PATCH endpoints"

  - priority: 22
    category: business_constraint
    check: "Numeric fields satisfy range constraints (e.g., score 0-100, batch_size_kg > 0)"
    error_id: ERR_INVALID_RANGE
    http_status: 422
    applies_to: "all POST/PUT/PATCH endpoints"

  - priority: 23
    category: business_temporal
    check: "OCC version check: expected_<parent>_version matches current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/v1/production-batches, POST /api/v1/allocation-plans/{id}/activate"

  - priority: 24
    category: business_safety
    check: "Complaint escalation requires is_adverse_event == true or severity in {HIGH, CRITICAL}"
    error_id: ERR_ESCALATION_NOT_WARRANTED
    http_status: 422
    applies_to: "POST /api/v1/complaints/{id}/escalate"

  - priority: 25
    category: business_referential
    check: "Formula has at least one APPROVED LabelSubmission before activation"
    error_id: ERR_LABEL_NOT_APPROVED
    http_status: 422
    applies_to: "POST /api/v1/formulas/{id}/activate"

  - priority: 26
    category: business_referential
    check: "Formula has at least one PASSED non-expired ProcessValidation before activation"
    error_id: ERR_VALIDATION_REQUIRED
    http_status: 422
    applies_to: "POST /api/v1/formulas/{id}/activate"

  - priority: 27
    category: business_constraint
    check: "Formula status is ACTIVE before batch production can start"
    error_id: ERR_FORMULA_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /api/v1/production-batches"

  - priority: 28
    category: business_constraint
    check: "Batch test results must cover all nutrients in the formula's NutrientProfile"
    error_id: ERR_INCOMPLETE_TEST_RESULTS
    http_status: 422
    applies_to: "POST /api/v1/production-batches/{id}/submit-test-results"

  - priority: 29
    category: business_safety
    check: "Batch can only be released if all nutrient tests pass and no pathogens detected"
    error_id: ERR_BATCH_TESTS_FAILED
    http_status: 422
    applies_to: "POST /api/v1/production-batches/{id}/release"

  - priority: 30
    category: business_referential
    check: "No active batches exist before formula discontinuation"
    error_id: ERR_ACTIVE_BATCHES_EXIST
    http_status: 422
    applies_to: "POST /api/v1/formulas/{id}/discontinue"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- System / Test-driving endpoints ---
  - method: POST
    path: /api/v1/_clock/set_current_utc
    description: "Set the logical system clock. Before any set_current_utc call, the clock defaults to 2026-08-01T00:00:00Z. All time-dependent logic uses this logical clock."
    roles: [ADMIN]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["all time-dependent calculations use this timestamp going forward"]

  # --- SystemUser ---
  - method: POST
    path: /api/v1/system-users
    description: "Create a new system user"
    roles: [ADMIN]
    code: 201
    input: [username, full_name, role, department]
    output: SystemUser
    side_effects: []

  - method: GET
    path: /api/v1/system-users
    description: "List system users"
    roles: [ADMIN, QA_MANAGER]
    code: 200
    input: ["limit?", "offset?"]
    output: SystemUser[]
    side_effects: []

  - method: GET
    path: /api/v1/system-users/{id}
    description: "Get a system user by ID"
    roles: [ADMIN, QA_MANAGER]
    code: 200
    input: []
    output: SystemUser
    side_effects: []

  # --- NutrientProfile ---
  - method: POST
    path: /api/v1/nutrient-profiles
    description: "Create a new nutrient profile"
    roles: [REGULATORY_AFFAIRS]
    code: 201
    input: [profile_code, nutrient_specs, regulation_ref, effective_from, "effective_until?"]
    output: NutrientProfile
    side_effects: []

  - method: GET
    path: /api/v1/nutrient-profiles
    description: "List nutrient profiles"
    roles: [REGULATORY_AFFAIRS, QA_MANAGER, QUALITY_ANALYST]
    code: 200
    input: ["limit?", "offset?", "status?", "profile_code?"]
    output: NutrientProfile[]
    side_effects: []

  - method: GET
    path: /api/v1/nutrient-profiles/{id}
    description: "Get a nutrient profile by ID"
    roles: [REGULATORY_AFFAIRS, QA_MANAGER, QUALITY_ANALYST]
    code: 200
    input: []
    output: NutrientProfile
    side_effects: []

  - method: POST
    path: /api/v1/nutrient-profiles/{id}/submit
    description: "Submit nutrient profile for approval"
    roles: [REGULATORY_AFFAIRS]
    code: 200
    input: []
    output: NutrientProfile
    side_effects: ["transitions DRAFT -> SUBMITTED"]

  - method: POST
    path: /api/v1/nutrient-profiles/{id}/approve
    description: "Approve a submitted nutrient profile (segregation of duties enforced)"
    roles: [REGULATORY_AFFAIRS]
    code: 200
    input: []
    output: NutrientProfile
    side_effects: ["transitions SUBMITTED -> APPROVED", "supersedes older APPROVED version of same profile_code"]

  - method: POST
    path: /api/v1/nutrient-profiles/{id}/return-for-revision
    description: "Return a submitted profile to draft for revision"
    roles: [REGULATORY_AFFAIRS]
    code: 200
    input: []
    output: NutrientProfile
    side_effects: ["transitions SUBMITTED -> DRAFT"]

  - method: POST
    path: /api/v1/nutrient-profiles/{id}/withdraw
    description: "Withdraw a nutrient profile"
    roles: [REGULATORY_AFFAIRS]
    code: 200
    input: []
    output: NutrientProfile
    side_effects: ["transitions DRAFT|APPROVED -> WITHDRAWN"]

  # --- Supplier ---
  - method: POST
    path: /api/v1/suppliers
    description: "Create a new supplier"
    roles: [QA_MANAGER]
    code: 201
    input: [supplier_code, legal_name, ingredient_categories, audit_frequency_days]
    output: Supplier
    side_effects: []

  - method: GET
    path: /api/v1/suppliers
    description: "List suppliers"
    roles: [QA_MANAGER, QUALITY_ANALYST, PRODUCTION_SUPERVISOR, SUPPLY_CHAIN_PLANNER]
    code: 200
    input: ["limit?", "offset?", "qualification_status?"]
    output: Supplier[]
    side_effects: []

  - method: GET
    path: /api/v1/suppliers/{id}
    description: "Get a supplier by ID"
    roles: [QA_MANAGER, QUALITY_ANALYST, PRODUCTION_SUPERVISOR, SUPPLY_CHAIN_PLANNER]
    code: 200
    input: []
    output: Supplier
    side_effects: []

  - method: POST
    path: /api/v1/suppliers/{id}/suspend
    description: "Suspend a qualified supplier"
    roles: [QUALITY_ANALYST]
    code: 200
    input: [reason]
    output: Supplier
    side_effects: ["transitions QUALIFIED -> SUSPENDED", "cascades QUARANTINED to linked QC_PASSED IngredientLots"]

  - method: POST
    path: /api/v1/suppliers/{id}/reinstate
    description: "Reinstate a suspended supplier after new passing audit"
    roles: [QUALITY_ANALYST]
    code: 200
    input: [audit_record_id]
    output: Supplier
    side_effects: ["transitions SUSPENDED -> QUALIFIED", "cascades QC_PASSED to linked QUARANTINED IngredientLots"]

  - method: POST
    path: /api/v1/suppliers/{id}/disqualify
    description: "Disqualify a supplier permanently"
    roles: [QA_MANAGER]
    code: 200
    input: [rationale]
    output: Supplier
    side_effects: ["transitions PENDING_AUDIT|SUSPENDED -> DISQUALIFIED", "cascades QC_FAILED to linked IngredientLots"]

  # --- AuditRecord ---
  - method: POST
    path: /api/v1/suppliers/{id}/audits
    description: "Submit an audit record for a supplier"
    roles: [QUALITY_ANALYST]
    code: 201
    input: [audit_type, audit_date, auditor_name, score, "findings?", "capa_deadline?"]
    output: AuditRecord
    side_effects: ["computes audit result", "if result PASS or CONDITIONAL_PASS and supplier PENDING_AUDIT: transitions supplier to QUALIFIED"]

  - method: GET
    path: /api/v1/suppliers/{id}/audits
    description: "List audit records for a supplier"
    roles: [QA_MANAGER, QUALITY_ANALYST]
    code: 200
    input: ["limit?", "offset?"]
    output: AuditRecord[]
    side_effects: []

  - method: GET
    path: /api/v1/audit-records/{id}
    description: "Get an audit record by ID"
    roles: [QA_MANAGER, QUALITY_ANALYST]
    code: 200
    input: []
    output: AuditRecord
    side_effects: []

  # --- Ingredient ---
  - method: POST
    path: /api/v1/ingredients
    description: "Create a new ingredient"
    roles: [QA_MANAGER]
    code: 201
    input: [ingredient_code, ingredient_name, category, pathogen_risk_class, storage_condition, "allergen_flags?"]
    output: Ingredient
    side_effects: []

  - method: GET
    path: /api/v1/ingredients
    description: "List ingredients"
    roles: [QA_MANAGER, QUALITY_ANALYST, PRODUCTION_SUPERVISOR, SUPPLY_CHAIN_PLANNER]
    code: 200
    input: ["limit?", "offset?", "category?"]
    output: Ingredient[]
    side_effects: []

  - method: GET
    path: /api/v1/ingredients/{id}
    description: "Get an ingredient by ID"
    roles: [QA_MANAGER, QUALITY_ANALYST, PRODUCTION_SUPERVISOR, SUPPLY_CHAIN_PLANNER]
