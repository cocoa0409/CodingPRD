            - "the agreement leaving ACTIVE pushes the territory to PENDING_REALLOCATION, where it no longer counts"
            - "the reclaim returns 200 and reclaimed_status == RECLAIMED"
            - "after reclaim Territory.${ter1_id}.allocated_households == 0 and Territory.${ter1_id}.franchisee_id is null"
            - "Franchisee.${fr_ms_id}.allocated_households == 0, exactly its pre-award value"
            - "the invariant holds on the conserved quantity: allocated_households == sum of household_count over territories of this franchisee in status IN {AWARDED, ACTIVE, EXPANSION_REQUESTED} == 0"
            - "no drift: Franchisee.${fr_ms_id}.allocated_households has returned to its starting value of 0"