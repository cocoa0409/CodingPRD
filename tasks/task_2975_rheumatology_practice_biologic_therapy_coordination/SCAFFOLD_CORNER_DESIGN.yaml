      - name: one_lab_grade_hold_fans_out_to_units_appointments_and_assistance
        claim_type: cascading_side_effects
        grounds:
          - state_machines.TherapyEpisode.transitions.ACTIVE_to_HELD
          - endpoints.POST_/therapy-episodes/{id}/hold
        excluded_because:
          difficulty_instance: lab_grade_hold_cascade_releases_units_and_reactivates_enrollment
          rationale: "That transitive-cascade instance already drives a single hold call through the full fan-out (appointment cancellation with cancellation_reason THERAPY_HELD, authorization unit release, assistance benefit un-reservation and enrollment reactivation) and pins every downstream field and version bump, so a separate corner case would restate it."

      - name: the_visit_score_endpoint_dispatches_on_the_scoring_instrument
        claim_type: dual_variant_calculation
        grounds:
          - calculations.visit_disease_activity_score
          - endpoints.POST_/visits/{id}/score
        excluded_because:
          difficulty_instance: visit_instrument_variant_divergence_cdai_vs_das28
          rationale: "That dual-variant instance already scores the same joint counts under CDAI and DAS28_CRP on two sibling visits and asserts the divergent score, category and escalation_recommendation, which is exactly the dispatch claim for this layer."

  - section: consistency_model
    instances:
      - name: every_derived_field_is_readable_in_the_same_request_that_caused_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.screening_status_derivation
          - calculations.visit_disease_activity_score
        distinguishing_aspect: "Nothing in this API is eventually consistent: the screening write's own response already carries the recomputed patient screening status, a visit's end datetime and a scored visit's activity fields are present in the response body of the call that created them, and the very next read agrees with that body without any intervening sweep or refresh call."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Patient RH0001 starts with tb_screen_status MISSING, hbv_screen_status INCOMPLETE, latest_activity_score null and target_status UNASSESSED."
            - "A NEW visit lasts VISIT_DURATION_MINUTES_NEW = 60 minutes, so a visit at 2026-08-01T09:00:00Z has visit_end_datetime 2026-08-01T10:00:00Z, and the CDAI inputs (1, 1, 2.0, 2.0) score 6.00 / LOW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /clinicians"
              payload: { npi: "1234567893", full_name: "Ada Rheum", role_type: "RHEUMATOLOGIST", can_attest_formulary_exception: true }
              as: RegistryAdmin
              captures: { rheum1_id: $.data.id }
            - call: "POST /clinicians"
              payload: { npi: "1234567895", full_name: "Nia Nurse", role_type: "NURSE" }
              as: RegistryAdmin
              captures: { nurse1_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "RH0001", full_name: "Pat One", date_of_birth: "1975-04-12", diagnosis_code: "RA_SEROPOSITIVE", registry_consent: true }
              as: RegistryAdmin
              captures: { pat_id: $.data.id, pat_v0: $.data.version, tb0: $.data.tb_screen_status, target0: $.data.target_status }
          trigger:
            - call: "POST /screening-records"
              payload: { patient_id: "${pat_id}", screen_type: "TB_IGRA", result: "NEGATIVE", collected_at: "2026-07-20T00:00:00Z", resulted_at: "2026-07-21T00:00:00Z" }
              as: InfusionNurse
              as_user_id: "${nurse1_id}"
              captures: { screen_id: $.data.id, screen_recorder: $.data.recorded_by_user_id }
            - call: "GET /patients/${pat_id}"
              payload: {}
              as: Rheumatologist
              as_user_id: "${rheum1_id}"
              captures: { tb1: $.data.tb_screen_status, hbv1: $.data.hbv_screen_status, pat_v1: $.data.version }
            - call: "GET /patients/${pat_id}/screening-records"
              payload: {}
              as: Rheumatologist
              as_user_id: "${rheum1_id}"
              captures: { listed_screen_id: $.data.0.id, listed_screen_type: $.data.0.screen_type }
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", clinician_id: "${rheum1_id}", visit_datetime: "2026-08-01T09:00:00Z", visit_type: "NEW" }
              as: RegistryAdmin
              captures: { visit_id: $.data.id, visit_end_on_create: $.data.visit_end_datetime }
            - call: "POST /visits/${visit_id}/check-in"
              payload: {}
              as: InfusionNurse
              as_user_id: "${nurse1_id}"
            - call: "POST /visits/${visit_id}/score"
              payload: { scoring_instrument: "CDAI", tender_joint_count: 1, swollen_joint_count: 1, patient_global_assessment: 2.0, physician_global_assessment: 2.0 }
              as: Rheumatologist
              as_user_id: "${rheum1_id}"
              captures: { score_in_body: $.data.activity_score, category_in_body: $.data.activity_category, scored_at_in_body: $.data.scored_at }
            - call: "GET /patients/${pat_id}"
              payload: {}
              as: Rheumatologist
              as_user_id: "${rheum1_id}"
              captures: { pat_score: $.data.latest_activity_score, pat_category: $.data.latest_activity_category, pat_target: $.data.target_status }
          assert:
            - "${tb0} == \"MISSING\" and ${target0} == \"UNASSESSED\" before any screening write"
            - "the screening write's own 201 response body already reports ${screen_recorder} == \"${nurse1_id}\", so the identity stamp needs no follow-up read"
            - "the immediately following read returns ${tb1} == \"CLEARED\" with no sweep, refresh or second write in between, while ${hbv1} == \"INCOMPLETE\" (only the written marker moved)"
            - "${pat_v1} == ${pat_v0} + 1, and the list read returns exactly one element with ${listed_screen_id} == \"${screen_id}\" and ${listed_screen_type} == \"TB_IGRA\""
            - "${visit_end_on_create} == \"2026-08-01T10:00:00Z\" is present in the create response, not filled in later"
            - "${score_in_body} == 6.00, ${category_in_body} == \"LOW\" and ${scored_at_in_body} == \"2026-08-01T00:00:00Z\" all appear in the scoring call's own response"
            - "${pat_score} == 6.00, ${pat_category} == \"LOW\" and ${pat_target} == \"AT_TARGET\" on the very next patient read"
