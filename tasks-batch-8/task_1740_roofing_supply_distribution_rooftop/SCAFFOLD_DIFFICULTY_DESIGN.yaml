  # =========================================================================
  # Rule 8 — resource_temporal_overlap: two overlap rules with DIFFERENT
  # interval semantics on DIFFERENT resources. Instance 1 = DeliverySlot
  # capacity as a discrete counter (booked_count < capacity) — not a real
  # interval, a capacity-threshold semantic. Instance 2 = surge window vs
  # clock (temporal activation boundary) — allocation grant only valid while
  # event is in DECLARED/ACTIVE.
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: delivery_slot_capacity_threshold
        grounds:
          - validations[priority=8]
          - entities.DeliverySlot.fields.booked_count
        distinguishing_aspect: |
          Interval semantic = discrete capacity counter on DeliverySlot: a
          new delivery occupying the same (slot_date, window, equipment_type)
          bucket is rejected when booked_count == capacity; adjacency does
          not merge — the unit is a slot, not a time range.
        test_recipe:
          setup:
            - "Slot with capacity 1; one delivery already SCHEDULED into it"
          setup_api_calls:
            - call: "POST /roofing/branches"
              payload: { branch_code: "BR-O1", name: "Overlap1", rooftop_delivery_capacity_per_day: 4, conveyor_fleet_size: 2, crane_available: true }
