  # ================================================================ RULE 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: branch_window_half_open_overlap
        grounds:
          - validations[priority=7]
          - errors[ERR_WINDOW_OVERLAP]
          - state_machines.Appointment.SCHEDULED_to_SCHEDULED
        distinguishing_aspect: |
          Pure half-open interval semantics on the Branch resource: the interval [window_start_utc,
          window_end_utc) admits a booking that starts exactly when a live window ends, and rejects one
          that starts one second earlier.
        test_recipe:
          setup:
            - "one branch carrying a live appointment on [2026-09-10T09:00:00Z, 2026-09-10T11:00:00Z)"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "Austin", postal_code: "78701", daily_dispatch_capacity_hours: 80 }
              as: PlatformAdmin
              captures: { br_id: $.data.id }
            - call: "POST /api/appointments"
              payload: { branch_id: "${br_id}", customer_name: "Ada", postal_code: "78701", window_start_utc: "2026-09-10T09:00:00Z", window_end_utc: "2026-09-10T11:00:00Z" }
              as: Dispatcher
              captures: { a1_id: $.data.id }
          trigger:
            - call: "POST /api/appointments"
              payload: { branch_id: "${br_id}", customer_name: "Bo", postal_code: "78701", window_start_utc: "2026-09-10T10:59:59Z", window_end_utc: "2026-09-10T12:00:00Z" }
              as: Dispatcher
              captures: { err_id: $.data.error_id }
          assert:
            - "the trigger returns ERR_WINDOW_OVERLAP (409) because 10:59:59Z falls strictly inside the live window"
            - "an identical booking starting at 2026-09-10T11:00:00Z succeeds with 201, proving adjacency is not overlap"
            - "a booking on a second branch at 78702 overlapping the same instants succeeds, so the rule is scoped to the branch"
      - name: maintenance_visit_interval_with_agreement_alive_clip
        grounds:
          - validations[priority=9]
          - errors[ERR_VISIT_OVERLAP]
          - entities.MembershipPlan.fields.maintenance_visit_interval_days
        distinguishing_aspect: |
          The same half-open arithmetic is applied to a differently shaped resource: MembershipVisit
          intervals are [scheduled_date, scheduled_date + maintenance_visit_interval_days) clipped to the
          agreement's alive window, so a reschedule that lands inside a live visit's interval is refused
          even though the dates are not equal.
        test_recipe:
          setup:
            - "one branch, one membership plan with a 30-day maintenance interval and four visits"
            - "one activated agreement with visit 1 on 2026-10-01 and visit 2 on 2026-11-05"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "Austin", postal_code: "78701", daily_dispatch_capacity_hours: 80 }
              as: PlatformAdmin
              captures: { br_id: $.data.id }
            - call: "POST /api/membership-plans"
              payload: { name: "Comfort Club", annual_price_cents: 100000, included_service_visit_count: 4, maintenance_visit_interval_days: 30, included_labor_discount_pct: 0.10, status: "PUBLISHED" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /api/membership-agreements"
              payload: { membership_plan_id: "${plan_id}", branch_id: "${br_id}", homeowner_name: "Ada", homeowner_postal_code: "78701", term_months: 12 }
              as: Technician
              captures: { ag_id: $.data.id }
            - call: "POST /api/membership-agreements/${ag_id}/payments"
              payload: { amount_cents: 30000 }
              as: Dispatcher
            - call: "POST /api/membership-agreements/${ag_id}/membership-visits"
              payload: { sequence_number: 1, scheduled_date: "2026-10-01T00:00:00Z" }
              as: Dispatcher
              captures: { v1_id: $.data.id }
            - call: "POST /api/membership-agreements/${ag_id}/membership-visits"
              payload: { sequence_number: 2, scheduled_date: "2026-11-05T00:00:00Z" }
              as: Dispatcher
              captures: { v2_id: $.data.id }
          trigger:
            - call: "POST /api/membership-visits/${v1_id}/reschedule"
              payload: { scheduled_date: "2026-10-30T00:00:00Z" }
              as: Dispatcher
              captures: { err_id: $.data.error_id }
          assert:
            - "the trigger returns ERR_VISIT_OVERLAP (409), because [2026-10-30, 2026-11-29) intersects visit 2's [2026-11-05, 2026-12-05)"
            - "the identical payload with scheduled_date 2026-09-01T00:00:00Z succeeds, because [2026-09-01, 2026-10-01) is adjacent to visit 1's former interval and precedes both live intervals"
            - "the refusal is on the derived maintenance interval, not on date equality: 2026-10-30 appears in no visit's scheduled_date"
  # ================================================================ RULE 9
  - rule_id: compensating_invariant
    instances:
      - name: ledger_cents_conserved_across_completion_and_cancellation
        grounds:
          - calculations.technician_revenue_ledger_total
          - state_machines.Appointment.COMPLETED_to_CANCELLED
          - entities.RevenueLedgerEntry.fields.entry_type
        distinguishing_aspect: |
          Conserved quantity: technician revenue cents. Completing the appointment then cancelling it
          appends an ACCRUAL and its paired REVERSAL, leaving the technician's ledger total exactly where
          it stood before completion.
        test_recipe:
          setup:
            - "one branch, one HVAC technician, one published 60000-cent HVAC task, one dispatched and completed appointment"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "Austin", postal_code: "78701", daily_dispatch_capacity_hours: 80 }
              as: PlatformAdmin
              captures: { br_id: $.data.id }
            - call: "POST /api/branches/${br_id}/technicians"
              payload: { name: "Dana", postal_code: "78701", skill_codes: ["HVAC"], shift_segments: [{ start_utc: "2026-09-10T08:00:00Z", end_utc: "2026-09-20T18:00:00Z" }], daily_capacity_hours: 40 }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /api/pricebook/tasks"
              payload: { code: "HVAC-COIL", category: "HVAC", display_name: "Coil Clean", required_skill_code: "HVAC", estimated_hours: 1.0, flat_rate_cents: 60000, status: "PUBLISHED" }
              as: Dispatcher
            - call: "POST /api/appointments"
              payload: { branch_id: "${br_id}", customer_name: "Ada", postal_code: "78701", window_start_utc: "2026-09-10T09:00:00Z", window_end_utc: "2026-09-10T11:00:00Z" }
              as: Dispatcher
              captures: { ap_id: $.data.id }
            - call: "POST /api/appointments/${ap_id}/lines"
              payload: { pricebook_task_code: "HVAC-COIL" }
              as: Dispatcher
            - call: "POST /api/dispatch/orders"
              payload: { appointment_id: "${ap_id}" }
              as: Dispatcher
            - call: "POST /api/appointments/${ap_id}/complete"
              payload: { completion_description: "Cleaned the coil, replaced the filter and verified the blower amperage across the system." }
              as: Technician
            - call: "POST /api/appointments/${ap_id}/complete"
              payload: { completion_description: "Cleaned the coil, replaced the filter and verified the blower amperage across the system." }
              as: Technician
          trigger:
            - call: "POST /api/appointments/${ap_id}/cancel"
              payload: { reason: "customer dispute" }
              as: Manager
          assert:
            - "after the two complete calls Technician.${tech_id}.technician_revenue_ledger_cents == 60000, the ACCRUAL amount"
            - "after the trigger the same field == 0, the REVERSAL having cancelled the ACCRUAL"
            - "the ledger holds two entries, entry_type ACCRUAL of 60000 and entry_type REVERSAL of -60000, and their sum is the pre-completion total"
      - name: booked_hours_conserved_across_dispatch_and_release
        grounds:
          - calculations.technician_booked_hours
          - state_machines.Appointment.DISPATCHED_to_CANCELLED
          - entities.Technician.fields.dispatched_hours
        distinguishing_aspect: |
          A different conserved quantity — booked technician hours rather than cents. Dispatching commits
          estimated_hours and cancelling returns them, so the branch's capacity_consumed_hours and the
          technician's dispatched_hours both land back on their pre-dispatch values.
        test_recipe:
          setup:
            - "one branch with daily_dispatch_capacity_hours 8, one HVAC technician with an 8.0-hour day"
            - "two appointments each carrying a published 4.0-hour HVAC task"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "Austin", postal_code: "78701", daily_dispatch_capacity_hours: 8 }
              as: PlatformAdmin
              captures: { br_id: $.data.id }
            - call: "POST /api/branches/${br_id}/technicians"
              payload: { name: "Dana", postal_code: "78701", skill_codes: ["HVAC"], shift_segments: [{ start_utc: "2026-09-10T08:00:00Z", end_utc: "2026-09-10T18:00:00Z" }], daily_capacity_hours: 8 }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /api/pricebook/tasks"
              payload: { code: "HVAC-COIL", category: "HVAC", display_name: "Coil Clean", required_skill_code: "HVAC", estimated_hours: 4.0, flat_rate_cents: 60000, status: "PUBLISHED" }
              as: Dispatcher
            - call: "POST /api/appointments"
              payload: { branch_id: "${br_id}", customer_name: "Ada", postal_code: "78701", window_start_utc: "2026-09-10T09:00:00Z", window_end_utc: "2026-09-10T11:00:00Z" }
              as: Dispatcher
              captures: { a1_id: $.data.id }
            - call: "POST /api/appointments/${a1_id}/lines"
              payload: { pricebook_task_code: "HVAC-COIL" }
              as: Dispatcher
            - call: "POST /api/dispatch/orders"
              payload: { appointment_id: "${a1_id}" }
              as: Dispatcher
            - call: "POST /api/appointments"
              payload: { branch_id: "${br_id}", customer_name: "Bo", postal_code: "78701", window_start_utc: "2026-09-11T09:00:00Z", window_end_utc: "2026-09-11T11:00:00Z" }
              as: Dispatcher
              captures: { a2_id: $.data.id }
            - call: "POST /api/appointments/${a2_id}/lines"
              payload: { pricebook_task_code: "HVAC-COIL" }
              as: Dispatcher
          trigger:
            - call: "POST /api/dispatch/orders"
              payload: { appointment_id: "${a2_id}" }
              as: Dispatcher
          assert:
            - "after the trigger Technician.${tech_id}.dispatched_hours == 8.0 and Branch.${br_id}.capacity_consumed_hours == 8.0"
            - "cancelling appointment ${a2_id} returns Technician.${tech_id}.dispatched_hours to 4.0 and Branch.${br_id}.capacity_consumed_hours to 4.0"
            - "the telescope property holds: technician_booked_hours == dispatched_hours over Appointments with status in {SCHEDULED, DISPATCHED}, so the pair of operations leaves the named quantity unchanged"
