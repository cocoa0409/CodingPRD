            - "One DRAFT FundReplacementProposal on the CORE_BOND slot (incoming VLCB2), created while the posture was still OPEN."
            - "QuarterlyReview for quarter_index 0 in status PENDING_MINUTES, presented into meeting M2 whose minutes are APPROVED, with SUBMITTED scorecards for both seated funds."
