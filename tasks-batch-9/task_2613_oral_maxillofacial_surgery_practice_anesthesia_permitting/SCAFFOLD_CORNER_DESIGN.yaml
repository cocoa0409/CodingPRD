          assert:
            - "before the trigger: AnesthesiaPermit.${perm_id}.status == ACTIVE with expires_at == 2028-09-02T10:00:00Z, and BlockTime.${blk_id}.status == RESERVED with open_minutes == 240 and utilization_pct == 0.00"
            - "trigger: HTTP 200 with swept_at == 2028-09-09T10:00:00Z, permits_expired == 1, permits_expired_ids == [${perm_id}], permits_suspended == 0, blocks_released == 1, blocks_partially_released == 0, cases_cancelled == 0, reservations_released == 0"
            - "the permit is EXPIRED with last_enforcement_reason == PERMIT_EXPIRY and Practice.${prac_id}.sedation_privilege_state == UNPERMITTED"
            - "the permit is counted once: even though its 2026 drills are long outside the trailing window, expiry is evaluated before the drill recompute so it is not also reported as newly on PROBATION"
            - "BlockTime.${blk_id}.status == RELEASED with released_minutes == 240, open_minutes == 0, committed_minutes == 0"
            - "a second sweep at the same clock reports every counter as 0 - both rows are already in their terminal or released state"

  # ==========================================================================
  - section: errors
    instances:
      - name: second_open_permit_for_one_practice_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_PERMIT_ALREADY_OPEN]
        distinguishing_aspect: "The one-open-permit rule counts every status outside {EXPIRED, REVOKED}, so a practice sitting at APPLIED cannot file a second application even for a different permit level."
        test_recipe:
          setup:
            - "one practice with a MINIMAL_SEDATION permit at APPLIED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T10:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "Duplicate OMS", state_code: "OH", recovery_bay_count: 2 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
            - call: "POST /anesthesia-permits"
              payload: { practice_id: "${prac_id}", permit_level: "MINIMAL_SEDATION", applied_on: "2026-08-25T00:00:00Z" }
              as: PracticeAdministrator
              captures: { perm_id: $.data.id }
          trigger:
            - call: "POST /anesthesia-permits"
              payload: { practice_id: "${prac_id}", permit_level: "DEEP_SEDATION_GENERAL", applied_on: "2026-09-01T00:00:00Z" }
              as: PracticeAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_PERMIT_ALREADY_OPEN"
            - "GET /anesthesia-permits?practice_id=${prac_id} still returns total_count == 1 with permit_level == MINIMAL_SEDATION"

      - name: rewinding_the_logical_clock_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=30]
          - errors[ERR_CLOCK_MONOTONIC_VIOLATION]
        distinguishing_aspect: "The clock is monotonic with a >= comparison: setting the same instant twice is accepted while any earlier instant is refused, so no test can rewind history under a retention or window calculation."
        test_recipe:
          setup:
            - "the logical clock advanced to 2026-09-05T12:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T12:00:00Z" }
              as: PracticeAdministrator
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T12:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T11:59:59Z" }
              as: SchedulingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0]: HTTP 200 - re-setting the same instant satisfies the >= comparison"
            - "trigger[1]: HTTP 409 with data.error_id == ERR_CLOCK_MONOTONIC_VIOLATION"
            - "a subsequent read of any endpoint still behaves as at 2026-09-05T12:00:00Z"

      - name: remediation_after_the_deadline_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=58]
          - errors[ERR_REMEDIATION_WINDOW_EXPIRED]
        distinguishing_aspect: "The window rule outranks the drill rule: with compliance fully restored to 1.00 the attestation is still refused once the clock passes remediation_deadline_at, and the permit stays on PROBATION because nothing swept it."
        test_recipe:
