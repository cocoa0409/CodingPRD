    side_effects: []

  - method: GET
    path: "/banks/{bankId}/customers/{customerId}/agreements/{agreementId}/transmission_formats"
    description: "List transmission formats"
    roles: [BankOperationsAdmin, TreasuryImplementer, TreasuryActivator, LockboxOperator, CustomerOperator, BillingSpecialist, BillingApprover, Auditor]
    code: 200
    input: ["status?", "format_kind?", "limit?", "offset?"]
    output: "TransmissionFormat[]"
    side_effects: []

  - method: POST
    path: "/banks/{bankId}/customers/{customerId}/agreements/{agreementId}/transmission_formats/{formatId}/activate"
    description: "DRAFT → ACTIVE; supersedes linked format (OCC on parent agreement)"
    roles: [TreasuryActivator]
    code: 200
    input: [expected_agreement_version]
    output: TransmissionFormat
    side_effects: ["status → ACTIVE", "If supersedes_format_id set: that format → SUPERSEDED", "increments ServiceAgreement.version by 1"]

  - method: POST
    path: "/banks/{bankId}/customers/{customerId}/agreements/{agreementId}/transmission_formats/{formatId}/retire"
    description: "ACTIVE|SUPERSEDED → RETIRED"
    roles: [TreasuryActivator]
    code: 200
    input: []
    output: TransmissionFormat
    side_effects: ["status → RETIRED"]

  # --- RemittanceBatch ---
