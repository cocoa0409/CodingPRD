          Conserved quantity: `LabOrder.accessioned_count` must equal `count(Specimens where
          lab_order_id == ord AND status == ACCESSIONED)`. Forward action accession (+1) paired
          with compensating reject of an ACCESSIONED specimen (-1) MUST leave the named global
          quantity at its starting value. Distinct from instance 2 (Patient.results_release_count).
