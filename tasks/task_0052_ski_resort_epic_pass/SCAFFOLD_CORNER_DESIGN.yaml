  # ------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: clock_advance_within_season_does_not_expire
        claim_type: scheduled_actions
        grounds:
          - state_machines.Pass.ACTIVE_to_EXPIRED
          - endpoints.POST_/_clock/set_current_utc
          - entities.Pass.fields.status
        distinguishing_aspect: "Advancing the clock to a still-in-season date leaves an ACTIVE pass ACTIVE (no auto-expiry until the new date exceeds SEASON_END_DATE)."
        test_recipe:
          setup:
            - "Clock 2026-01-02. FULL_EPIC ACTIVE pass."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-02T08:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pass-products"
              payload: { tier: "FULL_EPIC", price_cents: 8000, ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "Season Holder" }
              as: ResortOps
              captures: { pass_id: $.data.id }
            - call: "POST /passes/${pass_id}/activate"
              payload: {}
              as: ResortOps
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T08:00:00Z" }
              as: NetworkAdmin
            - call: "GET /passes/${pass_id}"
              payload: {}
              as: ResortOps
              captures: { st: $.data.status }
          assert:
            - "Pass.${pass_id}.status == ACTIVE"

      - name: occ_version_happy_path_on_pass
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[refund-approve-stale-pass]
          - entities.Pass.fields.version
        excluded_because:
          difficulty_instance: dual_variant_calc / refund_injury_flat_vs_prorated_with_fee
          rationale: "The Pass.version observe-then-approve OCC happy path is exercised by every §1.8 refund-approve instance (capture pass version, then approve successfully); the stale-version failure is covered by errors / stale_pass_version_on_refund_approve_returns_stale."

  # ------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: refund_approve_atomic_cascade_single_request
        claim_type: immediate
        grounds:
          - state_machines.RefundRequest.PENDING_to_APPROVED
          - state_machines.Pass.ACTIVE_to_REFUNDED
          - state_machines.BuddyTicket.RESERVED_to_CANCELLED
        excluded_because:
          difficulty_instance: transitive_cascade / refund_approve_depth3_cascade
          rationale: "The single-request atomic cascade (approve -> pass refunded -> buddy tickets cancelled, all observable immediately after one call) is exercised by the named §1.8 depth-3 cascade instance."

      - name: buddy_remaining_consistent_immediately_after_reserve
        claim_type: immediate
        grounds:
          - calculations.buddy_tickets_remaining
          - endpoints.POST_/buddy-tickets
          - entities.Pass.fields.buddy_tickets_remaining
        distinguishing_aspect: "Immediately after POST /buddy-tickets succeeds, GET /passes/{id} shows buddy_tickets_remaining decremented in the same request cycle (no lag): allotment=2 -> 1."
        test_recipe:
          setup:
            - "ACTIVE pass allotment=2 (remaining=2)."
          setup_api_calls:
            - call: "POST /pass-products"
              payload: { tier: "LOCAL", price_cents: 4000, buddy_ticket_allotment: 2, buddy_ticket_price_cents: 1000, ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /resorts"
