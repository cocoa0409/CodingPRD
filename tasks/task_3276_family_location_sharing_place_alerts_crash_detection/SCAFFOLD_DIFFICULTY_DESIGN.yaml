          assert:
            - "HTTP 409 with error_id == ERR_TRIP_NOT_OPEN"
            - "TripReport.${trip_id}.trip_status == CLOSED"
            - "No CrashEvent was created"

      - name: place_alert_confirmation_requires_circle_open
        grounds:
          - state_machines.PlaceAlert PENDING_DWELL_to_SUPPRESSED
          - state_machines.Circle posture
          - entities.Circle.fields.circle_posture
        distinguishing_aspect: |
          Entity pair PlaceAlert -> Circle: a PlaceAlert's PENDING_DWELL ->
          CONFIRMED transition requires Circle.circle_posture == OPEN at
          confirmation time. A circle that flips to RESTRICTED mid-window
          suppresses the alert. Pair (PlaceAlert, Circle) — distinct from
          (CrashEvent, TripReport).
        test_recipe:
          setup:
            - "FREE circle, one GRANTED adult member, one ACTIVE place at the member's location with dwell_bucket_seconds=60."
            - "Member posts fix F1 inside the place (window opens, alert PENDING_DWELL with window_open=F1)."
            - "Circle transitions to RESTRICTED (payment failed)."
            - "Member posts fix F2 also inside the place at +120s."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: System
            - call: "POST /api/circles"
              payload: { name: "AlertFam", subscription_tier: "FREE", billing_anchor_day: 1, owner_display_name: "Al", owner_birthdate: "1980-01-01T00:00:00Z", owner_email: "al@example.com" }
              as: Owner
              captures: { circle_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /api/circles/${circle_id}/places"
              payload: { label: "Home", center_lat: 37.7000, center_lng: -122.4000, radius_m: 200, accuracy_floor_m: 100, notify_on_arrive: true, notify_on_depart: true, dwell_bucket_seconds: 60 }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { place_id: $.data.id }
            - call: "POST /api/circles/${circle_id}/members/${owner_id}/fixes"
              payload: { recorded_at: "2026-09-01T10:00:00Z", lat: 37.7000, lng: -122.4000, accuracy_m: 20, speed_mps: 0.0, battery_pct: 90, phone_in_use: false, motion_context: "STILL" }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /api/circles/${circle_id}/subscription/simulate-payment-failed"
              payload: {}
              as: System
          trigger:
            - call: "POST /api/circles/${circle_id}/members/${owner_id}/fixes"
              payload: { recorded_at: "2026-09-01T10:02:00Z", lat: 37.7000, lng: -122.4000, accuracy_m: 20, speed_mps: 0.0, battery_pct: 89, phone_in_use: false, motion_context: "STILL" }
              as: Owner
              as_user_id: "${owner_id}"
          assert:
            - "Circle.${circle_id}.circle_posture == RESTRICTED"
            - "The PENDING_DWELL PlaceAlert for place ${place_id} did NOT confirm: alert_status == PENDING_DWELL (confirmation withheld while posture != OPEN)"
            - "After circle posture returns to OPEN (e.g., reactivation) AND a further inside fix arrives, the same alert confirms against its original window_open_fix_id (no dwell restart)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: place_geofence_overlap_area_threshold
        grounds:
          - validations[priority=12]
          - errors.ERR_PLACE_OVERLAP
          - entities.Place.fields.radius_m
        distinguishing_aspect: |
          Interval semantics #1 (AREA): two Places collide when their
          circle-circle INTERSECTION AREA exceeds 50% of the SMALLER
          circle's area. Adjacent (tangent) places at d = r1+r2 are
          permitted; partial overlap below the 50% threshold is permitted.
          Two same-radius (r=500) places at d=250 (overlap ratio ~0.685)
          are rejected; at d=500 (ratio ~0.391) are accepted.
        test_recipe:
          setup:
            - "FREE circle with one existing ACTIVE place at (37.7000, -122.4000) radius 500."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: System
            - call: "POST /api/circles"
              payload: { name: "OvFam", subscription_tier: "FREE", billing_anchor_day: 1, owner_display_name: "Ov", owner_birthdate: "1980-01-01T00:00:00Z", owner_email: "ov@example.com" }
              as: Owner
              captures: { circle_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /api/circles/${circle_id}/places"
              payload: { label: "Home", center_lat: 37.7000, center_lng: -122.4000, radius_m: 500, accuracy_floor_m: 100, notify_on_arrive: true, notify_on_depart: true, dwell_bucket_seconds: 60 }
              as: Owner
              as_user_id: "${owner_id}"
          trigger:
            # Second place 250 m north (~0.00225 deg lat at 37.7) — ratio 0.685 -> REJECTED
            - call: "POST /api/circles/${circle_id}/places"
              payload: { label: "TooClose", center_lat: 37.70225, center_lng: -122.4000, radius_m: 500, accuracy_floor_m: 100, notify_on_arrive: true, notify_on_depart: true, dwell_bucket_seconds: 60 }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { err1: $.data.error_id }
            # Third place 500 m north (~0.00450 deg) — ratio ~0.391 -> ACCEPTED
            - call: "POST /api/circles/${circle_id}/places"
              payload: { label: "FarEnough", center_lat: 37.70450, center_lng: -122.4000, radius_m: 500, accuracy_floor_m: 100, notify_on_arrive: true, notify_on_depart: true, dwell_bucket_seconds: 60 }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { ok_id: $.data.id }
          assert:
            - "Place at d=250 m returns HTTP 409 ERR_PLACE_OVERLAP (overlap ratio ~0.685 > 0.5)"
            - "Place at d=500 m returns HTTP 201 (overlap ratio ~0.391 <= 0.5)"

      - name: trip_open_uniqueness_temporal_interval
        grounds:
          - state_machines.TripReport
          - entities.TripReport.fields.trip_status
        distinguishing_aspect: |
          Interval semantics #2 (HALF-OPEN interval on the time axis): a
          member may have at most one OPEN TripReport at a time. The OPEN
          interval is [started_at, ended_at) — a new trip can start exactly
          at the predecessor's ended_at. Distinct from place-overlap (area
          ratio on a 2-D geofence vs. time-interval on a 1-D history).
        test_recipe:
          setup:
            - "PLUS circle, one GRANTED adult member."
            - "Trip T1 opens at 10:00 DRIVING, then is closed by a STILL fix at 10:05."
            - "New DRIVING fix at exactly 10:05 opens a new trip T2."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: System
            - call: "POST /api/circles"
              payload: { name: "TripFam", subscription_tier: "PLUS", billing_anchor_day: 1, owner_display_name: "Tr", owner_birthdate: "1980-01-01T00:00:00Z", owner_email: "tr@example.com" }
              as: Owner
              captures: { circle_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /api/circles/${circle_id}/members/${owner_id}/fixes"
              payload: { recorded_at: "2026-09-01T10:00:00Z", lat: 37.7000, lng: -122.4000, accuracy_m: 20, speed_mps: 30.0, battery_pct: 90, phone_in_use: false, motion_context: "DRIVING" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { trip1_id: $.data.id }
            - call: "POST /api/circles/${circle_id}/members/${owner_id}/fixes"
              payload: { recorded_at: "2026-09-01T10:05:00Z", lat: 37.7050, lng: -122.4000, accuracy_m: 20, speed_mps: 0.0, battery_pct: 89, phone_in_use: false, motion_context: "STILL" }
              as: Owner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /api/circles/${circle_id}/members/${owner_id}/fixes"
              payload: { recorded_at: "2026-09-01T10:05:00Z", lat: 37.7050, lng: -122.4000, accuracy_m: 20, speed_mps: 30.0, battery_pct: 89, phone_in_use: false, motion_context: "DRIVING" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { trip2_id: $.data.id }
          assert:
            - "TripReport.${trip1_id}.trip_status == CLOSED with ended_at == 2026-09-01T10:05:00Z"
            - "TripReport.${trip2_id}.trip_status == OPEN with started_at == 2026-09-01T10:05:00Z"
            - "The two trips share the boundary timestamp but do not overlap (half-open semantics)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: assistance_units_escalate_then_false_alarm
        grounds:
          - calculations.assistance_unit_invariant
          - state_machines.CrashEvent ESCALATED_to_FALSE_ALARM
          - entities.Circle.fields.assistance_units_balance
        distinguishing_aspect: |
          Conserved quantity: assistance_units_balance. Escalation consumes
          1 (forward); FALSE_ALARM from ESCALATED refunds 1 (compensating).
          End balance equals start balance. FALSE_ALARM from DISPATCHED
          would NOT compensate — but DISPATCHED is excluded from the
          FALSE_ALARM source-state set, so the invariant holds.
        test_recipe:
          setup:
            - "PROTECT circle (start balance 4). One GRANTED adult member on an OPEN trip. Crash reported, escalated past wellness deadline."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: System
            - call: "POST /api/circles"
              payload: { name: "InvFam", subscription_tier: "PROTECT", billing_anchor_day: 1, owner_display_name: "Inv", owner_birthdate: "1980-01-01T00:00:00Z", owner_email: "inv@example.com" }
              as: Owner
              captures: { circle_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /api/circles/${circle_id}/members/${owner_id}/fixes"
              payload: { recorded_at: "2026-09-01T10:00:00Z", lat: 37.7, lng: -122.4, accuracy_m: 20, speed_mps: 30.0, battery_pct: 90, phone_in_use: false, motion_context: "DRIVING" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /api/circles/${circle_id}/members/${owner_id}/crash-events"
              payload: { trip_report_id: "${trip_id}", delta_v: 20.0, note: "impact" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { crash_id: $.data.id, wellness_id: $.data.wellness_check_id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T10:11:00Z" }
              as: System
            - call: "POST /api/_sweeps/age-and-retention"
              payload: {}
              as: System
          trigger:
            - call: "POST /api/crash-events/${crash_id}/mark-false-alarm"
              payload: { false_alarm_reason: "bump in parking lot" }
              as: Owner
              as_user_id: "${owner_id}"
          assert:
            - "CrashEvent.${crash_id}.crash_status == FALSE_ALARM"
            - "Circle.${circle_id}.assistance_units_balance == 4 (escalation -1 then FALSE_ALARM +1 restores start)"
            - "SubscriptionEvent ledger of circle ${circle_id} contains an ASSISTANCE_CONSUME (units_delta=-1) followed by an ASSISTANCE_GRANT (units_delta=+1)"

      - name: identity_credits_conserve_within_billing_window
        grounds:
          - calculations.identity_credit_invariant
          - entities.Circle.fields.identity_protection_credits
        distinguishing_aspect: |
          Conserved quantity: identity_protection_credits, different from
          assistance_units_balance. PROTECT tier starts each billing window
          with 1; consumption decrements; a rejected consumption leaves the
          balance unchanged (no orphan SubscriptionEvent row).
        test_recipe:
          setup:
            - "PROTECT circle, identity_protection_credits = 1 at window start."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: System
            - call: "POST /api/circles"
              payload: { name: "IdpFam", subscription_tier: "PROTECT", billing_anchor_day: 1, owner_display_name: "Idp", owner_birthdate: "1980-01-01T00:00:00Z", owner_email: "idp@example.com" }
              as: Owner
              captures: { circle_id: $.data.id, owner_id: $.data.owner_member_id }
          trigger:
            - call: "POST /api/circles/${circle_id}/identity-protection/consume"
              payload: { reason: "dark-web alert" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { consume_ev: $.data.id }
            - call: "POST /api/circles/${circle_id}/identity-protection/consume"
              payload: { reason: "second alert, no credit" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "First consume succeeds; identity_protection_credits becomes 0"
            - "Second consume returns HTTP 402 ERR_NO_IDENTITY_CREDIT"
            - "Circle identity_protection_credits remains 0 (rejected consume does not decrement)"
            - "SubscriptionEvent ledger has exactly one IDENTITY_CREDIT_CONSUME row in the current billing_period_index"
