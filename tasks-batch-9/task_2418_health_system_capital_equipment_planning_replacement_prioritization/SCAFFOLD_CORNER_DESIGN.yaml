              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { asset_ac_id: $.data.id }
            - call: "POST /capital/cycles"
              payload: { plan_year: 2027, plan_year_start: "2027-01-01T00:00:00Z", total_capital_cents: 500000000, contingency_pct: 0.00, facility_contingency_pct: 0.00 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { c_id: $.data.id }
            - call: "POST /capital/cycles/${c_id}/open-intake"
              payload: {}
              as: CapitalPlanner
              as_user_id: "planner-setup"
          trigger:
            - call: "POST /capital/requests"
              payload: { cycle_id: "${c_id}", department_id: "${dept_a2_id}", asset_id: "${asset_ac_id}", clinical_justification: "MRI department claiming the CT asset.", current_annual_volume: 1000, projected_annual_volume: 2000, estimated_capital_cents: 100000000, annual_service_contract_cents: 10000000, disposable_unit_cents: 500 }
              as: ClinicalRequester
              as_user_id: "${dept_a2_id}"
              captures: { e_asset_dept: $.data.error_id }
            - call: "POST /capital/requests"
              payload: { cycle_id: "${c_id}", department_id: "${dept_a1_id}", asset_id: "${asset_ac_id}", clinical_justification: "One cent over the modification cap.", current_annual_volume: 1000, projected_annual_volume: 2000, estimated_capital_cents: 100000000, annual_service_contract_cents: 10000000, disposable_unit_cents: 500, facility_modification_cents: 30000001 }
              as: ClinicalRequester
              as_user_id: "${dept_a1_id}"
              captures: { e_mod_cap: $.data.error_id }
            - call: "POST /capital/requests"
              payload: { cycle_id: "${c_id}", department_id: "${dept_a1_id}", asset_id: "${asset_ac_id}", clinical_justification: "Mandated replacement with no deadline supplied.", current_annual_volume: 1000, projected_annual_volume: 2000, estimated_capital_cents: 100000000, annual_service_contract_cents: 10000000, disposable_unit_cents: 500, regulatory_mandate_flag: true }
              as: ClinicalRequester
