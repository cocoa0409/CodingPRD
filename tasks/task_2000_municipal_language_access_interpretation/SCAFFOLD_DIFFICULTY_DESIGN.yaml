# =============================================================================
# Task 2000: Municipal Language Access — §1.8 Scaffold Difficulty Design
# Test Targeting Index: 9 Difficulty Rules x 2 instances = 18 instances.
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 and is reproducible from
# empty-DB via the structured setup_api_calls chain.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: interpretation_cost_estimated_vs_final
        grounds:
          - calculations.interpretation_cost
          - entities.InterpretationRequest.fields.estimated_cost_cents
          - entities.InterpretationRequest.fields.final_cost_cents
        distinguishing_aspect: |
          On the InterpretationRequest domain, the estimated variant (scheduled_duration_minutes=45)
          and the final variant (actual_minutes=130) of the same cost formula produce 9400 vs 17680
          cents for one request — same inputs except the variant's minutes basis.
        test_recipe:
          setup:
            - "Department D (budget 1000000) exists"
            - "VendorContract C ACTIVE: phone 50c/min, video 75, in_person 100, word 20c, travel 2500c, ceiling 1000000"
            - "Interpreter X: CERTIFIED, languages [es], modalities [IN_PERSON], confidentiality signed (current at default clock 2026-08-01T00:00:00Z)"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Health", service_area_code: "SA-1", annual_budget_cents: 1000000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { vendor_name: "VendorOne", ceiling_cents: 1000000, phone_per_minute_cents: 50, video_per_minute_cents: 75, in_person_per_minute_cents: 100, translation_per_word_cents: 20, in_person_travel_flat_cents: 2500 }
              as: LanguageAccessCoordinator
              captures: { contract_id: $.data.id }
            - call: "POST /vendor-contracts/${contract_id}/activate"
              as: LanguageAccessCoordinator
            - call: "POST /interpreters"
              payload: { full_name: "Iris Cert", language_codes: ["es"], modalities: ["IN_PERSON"], tier: "CERTIFIED", vendor_contract_id: "${contract_id}" }
              as: LanguageAccessCoordinator
              captures: { interp_id: $.data.id }
            - call: "PATCH /interpreters/${interp_id}"
              payload: { confidentiality_signed: true }
              as: LanguageAccessCoordinator
          trigger:
            - call: "POST /interpretation-requests"
              payload: { department_id: "${dept_id}", language_code: "es", modality: "IN_PERSON", encounter_setting: "GENERAL", scheduled_start: "2026-08-10T10:00:00Z", scheduled_duration_minutes: 45 }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { req_id: $.data.id, est: $.data.estimated_cost_cents }
            - call: "POST /interpretation-requests/${req_id}/complete"
              payload: { actual_minutes: 130 }
              as: Interpreter
              as_user_id: "${interp_id}"
          assert:
            - "InterpretationRequest.${req_id}.estimated_cost_cents == 9400  (max(60, ceil45->48)=60 min x 100c x 1.15 + 2500c travel)"
            - "InterpretationRequest.${req_id}.final_cost_cents == 17680  (ceil130->132 x 100c x 1.15 + 2500c)"
            - "InterpretationRequest.${req_id}.estimated_cost_cents != InterpretationRequest.${req_id}.final_cost_cents"
            - "VendorContract.${contract_id}.committed_cents == 0 and VendorContract.${contract_id}.spent_cents == 17680"
            - "Department.${dept_id}.spent_cents == 17680"
            - "Interpreter.${interp_id}.minutes_current_month == 130"

      - name: threshold_language_safe_harbor_vs_encounter_priority
        grounds:
          - calculations.threshold_language_classification
          - entities.LanguageAssessment.fields.threshold_language_safe
          - entities.LanguageAssessment.fields.priority_language
        distinguishing_aspect: |
          On the LanguageAssessment domain, the safe-harbor variant (lep_share >= 0.05) and the
          encounter-priority variant (encounter_share >= 0.05) classify the SAME record differently:
          600/10000 population share (6%) passes safe-harbor while 200/10000 encounter share (2%) fails priority.
        test_recipe:
          setup:
            - "Department D exists"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Housing", service_area_code: "SA-2", annual_budget_cents: 1000000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
          trigger:
            - call: "POST /language-assessments"
              payload: { department_id: "${dept_id}", language_code: "es", plan_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", lep_speaker_count: 600, service_area_population: 10000, encounter_count: 200, total_encounters: 10000 }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { asm_id: $.data.id }
          assert:
            - "LanguageAssessment.${asm_id}.lep_share == 0.06"
            - "LanguageAssessment.${asm_id}.threshold_language_safe == true   (safe-harbor: 0.06 >= 0.05)"
            - "LanguageAssessment.${asm_id}.encounter_share == 0.02"
            - "LanguageAssessment.${asm_id}.priority_language == false        (encounter-priority: 0.02 < 0.05)"
            - "LanguageAssessment.${asm_id}.status == DRAFT"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: interpretation_final_cost_rounding_order_pinned
        grounds:
          - calculations.interpretation_cost
          - entities.InterpretationRequest.fields.final_cost_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the formula pins quantize-duration-first (ceil 61 -> 66 billable
          minutes, then x 75c = 4950); the reversed order (61 raw x 75c = 4575) is a different,
          rejected result — the test distinguishes the two orders on the InterpretationRequest cost.
        test_recipe:
          setup:
            - "Department D (budget 1000000); VendorContract C ACTIVE (video 75c/min, ceiling 1000000)"
            - "Interpreter X: REGISTERED, [es], [VIDEO], confidentiality current"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Parks", service_area_code: "SA-3", annual_budget_cents: 1000000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { vendor_name: "VendorTwo", ceiling_cents: 1000000, phone_per_minute_cents: 50, video_per_minute_cents: 75, in_person_per_minute_cents: 100, translation_per_word_cents: 20, in_person_travel_flat_cents: 2500 }
              as: LanguageAccessCoordinator
              captures: { contract_id: $.data.id }
            - call: "POST /vendor-contracts/${contract_id}/activate"
              as: LanguageAccessCoordinator
            - call: "POST /interpreters"
              payload: { full_name: "Reg Video", language_codes: ["es"], modalities: ["VIDEO"], tier: "REGISTERED", vendor_contract_id: "${contract_id}" }
              as: LanguageAccessCoordinator
              captures: { interp_id: $.data.id }
            - call: "PATCH /interpreters/${interp_id}"
              payload: { confidentiality_signed: true }
              as: LanguageAccessCoordinator
          trigger:
            - call: "POST /interpretation-requests"
              payload: { department_id: "${dept_id}", language_code: "es", modality: "VIDEO", encounter_setting: "GENERAL", scheduled_start: "2026-08-10T10:00:00Z", scheduled_duration_minutes: 60 }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { req_id: $.data.id, est: $.data.estimated_cost_cents }
            - call: "POST /interpretation-requests/${req_id}/complete"
              payload: { actual_minutes: 61 }
              as: Interpreter
              as_user_id: "${interp_id}"
          assert:
            - "InterpretationRequest.${req_id}.estimated_cost_cents == 4500  (60 min x 75c x 1.0)"
            - "InterpretationRequest.${req_id}.final_cost_cents == 4950  (ceil(61/6)*6=66 min x 75c; NOT 4575 from raw-minute multiplication)"
            - "VendorContract.${contract_id}.spent_cents == 4950"

      - name: translation_final_cost_revision_cap_and_rush
        grounds:
          - calculations.translation_cost
          - entities.TranslationJob.fields.final_cost_cents
          - entities.TranslationJob.fields.revision_count
        distinguishing_aspect: |
          Mode (a) >=3 inputs with non-linear interaction: final translation cost combines
          submitted_word_count x rate with a CAPPED revision surcharge (min(5 x 10%, 30%) = 30%,
          the cap binds) and a conditional rush multiplier (x1.25) — 200000 + 60000 then x1.25 = 325000.
          Different mode than interpretation_final_cost_rounding_order_pinned (which is mode (b)).
        test_recipe:
          setup:
            - "Department D; VendorContract C ACTIVE (word rate 20c, ceiling 1000000); VitalDocument Doc ACTIVE"
            - "Translator T (REGISTERED, [es], conf current) and Reviewer R (CERTIFIED, [es], conf current), T != R"
            - "Job J: word_count 10000, rush=true -> provisional 200000; assigned to T; five submit/REQUEST_REVISION cycles"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Records", service_area_code: "SA-4", annual_budget_cents: 1000000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { vendor_name: "VendorThree", ceiling_cents: 1000000, phone_per_minute_cents: 50, video_per_minute_cents: 75, in_person_per_minute_cents: 100, translation_per_word_cents: 20, in_person_travel_flat_cents: 2500 }
              as: LanguageAccessCoordinator
              captures: { contract_id: $.data.id }
            - call: "POST /vendor-contracts/${contract_id}/activate"
              as: LanguageAccessCoordinator
            - call: "POST /interpreters"
              payload: { full_name: "Tom Translator", language_codes: ["es"], modalities: ["PHONE"], tier: "REGISTERED", vendor_contract_id: "${contract_id}" }
              as: LanguageAccessCoordinator
              captures: { translator_id: $.data.id }
            - call: "PATCH /interpreters/${translator_id}"
              payload: { confidentiality_signed: true }
              as: LanguageAccessCoordinator
            - call: "POST /interpreters"
              payload: { full_name: "Rita Reviewer", language_codes: ["es"], modalities: ["PHONE"], tier: "CERTIFIED", vendor_contract_id: "${contract_id}" }
              as: LanguageAccessCoordinator
              captures: { reviewer_id: $.data.id }
            - call: "PATCH /interpreters/${reviewer_id}"
              payload: { confidentiality_signed: true }
              as: LanguageAccessCoordinator
            - call: "POST /vital-documents"
              payload: { department_id: "${dept_id}", title: "Notice of Rights", document_type: "NOTICE" }
              as: LanguageAccessCoordinator
              captures: { doc_id: $.data.id }
            - call: "POST /translation-jobs"
              payload: { document_id: "${doc_id}", vendor_contract_id: "${contract_id}", target_language_code: "es", word_count: 10000, rush: true }
              as: LanguageAccessCoordinator
              captures: { job_id: $.data.id, prov: $.data.provisional_cost_cents }
            - call: "POST /translation-jobs/${job_id}/assign"
              payload: { translator_id: "${translator_id}" }
              as: LanguageAccessCoordinator
            - call: "POST /translation-jobs/${job_id}/submit-translation"
              payload: { submitted_word_count: 10000 }
              as: Interpreter
              as_user_id: "${translator_id}"
            - call: "POST /translation-jobs/${job_id}/review"
              payload: { decision: "REQUEST_REVISION" }
              as: QualityReviewer
              as_user_id: "${reviewer_id}"
            - call: "POST /translation-jobs/${job_id}/submit-translation"
              payload: { submitted_word_count: 10000 }
              as: Interpreter
              as_user_id: "${translator_id}"
            - call: "POST /translation-jobs/${job_id}/review"
              payload: { decision: "REQUEST_REVISION" }
              as: QualityReviewer
              as_user_id: "${reviewer_id}"
            - call: "POST /translation-jobs/${job_id}/submit-translation"
              payload: { submitted_word_count: 10000 }
              as: Interpreter
              as_user_id: "${translator_id}"
            - call: "POST /translation-jobs/${job_id}/review"
              payload: { decision: "REQUEST_REVISION" }
              as: QualityReviewer
              as_user_id: "${reviewer_id}"
            - call: "POST /translation-jobs/${job_id}/submit-translation"
              payload: { submitted_word_count: 10000 }
              as: Interpreter
              as_user_id: "${translator_id}"
            - call: "POST /translation-jobs/${job_id}/review"
              payload: { decision: "REQUEST_REVISION" }
              as: QualityReviewer
              as_user_id: "${reviewer_id}"
            - call: "POST /translation-jobs/${job_id}/submit-translation"
              payload: { submitted_word_count: 10000 }
              as: Interpreter
              as_user_id: "${translator_id}"
            - call: "POST /translation-jobs/${job_id}/review"
              payload: { decision: "REQUEST_REVISION" }
              as: QualityReviewer
              as_user_id: "${reviewer_id}"
            - call: "POST /translation-jobs/${job_id}/submit-translation"
              payload: { submitted_word_count: 10000 }
              as: Interpreter
              as_user_id: "${translator_id}"
          trigger:
            - call: "POST /translation-jobs/${job_id}/review"
              payload: { decision: "APPROVE" }
              as: QualityReviewer
              as_user_id: "${reviewer_id}"
          assert:
            - "TranslationJob.${job_id}.revision_count == 5"
            - "TranslationJob.${job_id}.status == APPROVED"
            - "TranslationJob.${job_id}.final_cost_cents == 325000  (base 10000x20=200000; surcharge min(5*10%,30%)=30% -> 60000; rush x1.25 -> 325000)"
            - "VendorContract.${contract_id}.spent_cents == 325000 and VendorContract.${contract_id}.committed_cents == 0"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: translation_job_revision_loop
        grounds:
          - state_machines.TranslationJob.QUALITY_REVIEW_to_IN_TRANSLATION
          - state_machines.TranslationJob.IN_TRANSLATION_to_QUALITY_REVIEW
        distinguishing_aspect: |
          TranslationJob cycles IN_TRANSLATION -> QUALITY_REVIEW -> IN_TRANSLATION (revision loop):
          two full cycles yield revision_count == 2 with translator unchanged — a cyclic machine on TranslationJob.
        test_recipe:
          setup:
            - "Department D; contract ACTIVE (word 20c, ceiling 1000000); Doc ACTIVE; translator REGISTERED conf current; reviewer CERTIFIED conf current"
            - "Job word_count 2000 (provisional 40000), assigned"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Libraries", service_area_code: "SA-5", annual_budget_cents: 1000000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { vendor_name: "VendorFour", ceiling_cents: 1000000, phone_per_minute_cents: 50, video_per_minute_cents: 75, in_person_per_minute_cents: 100, translation_per_word_cents: 20, in_person_travel_flat_cents: 2500 }
              as: LanguageAccessCoordinator
              captures: { contract_id: $.data.id }
            - call: "POST /vendor-contracts/${contract_id}/activate"
              as: LanguageAccessCoordinator
            - call: "POST /interpreters"
              payload: { full_name: "Tom Translator", language_codes: ["es"], modalities: ["PHONE"], tier: "REGISTERED", vendor_contract_id: "${contract_id}" }
              as: LanguageAccessCoordinator
              captures: { translator_id: $.data.id }
            - call: "PATCH /interpreters/${translator_id}"
              payload: { confidentiality_signed: true }
              as: LanguageAccessCoordinator
            - call: "POST /interpreters"
              payload: { full_name: "Rita Reviewer", language_codes: ["es"], modalities: ["PHONE"], tier: "CERTIFIED", vendor_contract_id: "${contract_id}" }
              as: LanguageAccessCoordinator
              captures: { reviewer_id: $.data.id }
            - call: "PATCH /interpreters/${reviewer_id}"
              payload: { confidentiality_signed: true }
              as: LanguageAccessCoordinator
            - call: "POST /vital-documents"
              payload: { department_id: "${dept_id}", title: "Intake Form", document_type: "FORM" }
              as: LanguageAccessCoordinator
              captures: { doc_id: $.data.id }
            - call: "POST /translation-jobs"
              payload: { document_id: "${doc_id}", vendor_contract_id: "${contract_id}", target_language_code: "es", word_count: 2000 }
              as: LanguageAccessCoordinator
              captures: { job_id: $.data.id }
            - call: "POST /translation-jobs/${job_id}/assign"
              payload: { translator_id: "${translator_id}" }
              as: LanguageAccessCoordinator
          trigger:
            - call: "POST /translation-jobs/${job_id}/submit-translation"
              payload: { submitted_word_count: 2100 }
              as: Interpreter
              as_user_id: "${translator_id}"
            - call: "POST /translation-jobs/${job_id}/review"
              payload: { decision: "REQUEST_REVISION" }
              as: QualityReviewer
              as_user_id: "${reviewer_id}"
              captures: { rev1: $.data.revision_count }
            - call: "POST /translation-jobs/${job_id}/submit-translation"
              payload: { submitted_word_count: 2100 }
              as: Interpreter
              as_user_id: "${translator_id}"
            - call: "POST /translation-jobs/${job_id}/review"
              payload: { decision: "REQUEST_REVISION" }
              as: QualityReviewer
              as_user_id: "${reviewer_id}"
          assert:
            - "TranslationJob.${job_id}.revision_count == 2 after two REQUEST_REVISION loops"
            - "TranslationJob.${job_id}.status == IN_TRANSLATION after each REQUEST_REVISION and QUALITY_REVIEW after each submit-translation"
            - "TranslationJob.${job_id}.translator_id == ${translator_id} (unchanged through the loop)"
            - "VendorContract.${contract_id}.committed_cents == 40000 (provisional still held during the loop)"

      - name: interpreter_suspension_reinstatement_loop
        grounds:
          - state_machines.Interpreter.ACTIVE_to_SUSPENDED
          - state_machines.Interpreter.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Interpreter cycles ACTIVE -> SUSPENDED -> ACTIVE (manual suspend then reinstate), and the
          reinstatement applies the probationary rating reset (quality_rating := 600) — a cyclic
          machine on Interpreter, a different entity than TranslationJob's revision loop.
        test_recipe:
          setup:
            - "Contract ACTIVE; Interpreter X CERTIFIED conf current, quality_rating 1000, status ACTIVE"
          setup_api_calls:
            - call: "POST /vendor-contracts"
              payload: { vendor_name: "VendorFive", ceiling_cents: 1000000, phone_per_minute_cents: 50, video_per_minute_cents: 75, in_person_per_minute_cents: 100, translation_per_word_cents: 20, in_person_travel_flat_cents: 2500 }
              as: LanguageAccessCoordinator
              captures: { contract_id: $.data.id }
            - call: "POST /vendor-contracts/${contract_id}/activate"
              as: LanguageAccessCoordinator
            - call: "POST /interpreters"
              payload: { full_name: "Cyclical Cy", language_codes: ["es"], modalities: ["PHONE"], tier: "CERTIFIED", vendor_contract_id: "${contract_id}" }
              as: LanguageAccessCoordinator
              captures: { interp_id: $.data.id }
            - call: "PATCH /interpreters/${interp_id}"
              payload: { confidentiality_signed: true }
              as: LanguageAccessCoordinator
          trigger:
            - call: "PATCH /interpreters/${interp_id}"
              payload: { status: "SUSPENDED" }
              as: ComplianceOfficer
            - call: "PATCH /interpreters/${interp_id}"
              payload: { status: "ACTIVE" }
              as: ComplianceOfficer
          assert:
            - "Interpreter.${interp_id}.status == SUSPENDED after the first PATCH and ACTIVE after the second (cycle traversed)"
            - "Interpreter.${interp_id}.quality_rating == 600 after reinstatement (probationary floor reset from 1000)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: complaint_substantiation_suspension_cancellation_release
        grounds:
          - state_machines.Complaint.RECEIVED_to_SUBSTANTIATED
          - state_machines.Interpreter.ACTIVE_to_SUSPENDED
          - state_machines.InterpretationRequest.ASSIGNED_to_CANCELLED
          - calculations.interpreter_quality_rating
          - calculations.vendor_contract_commitment
        distinguishing_aspect: |
          Depth-4 chain originating at complaint adjudication: adjudicate SUBSTANTIATED -> interpreter
          rating -200 (link 1); rating 400 < 600 -> interpreter auto-SUSPENDED (link 2); suspension ->
          his ASSIGNED request R4 CANCELLED (link 3); that cancellation -> contract committed_cents
          release 1725 (link 4). Also pins the rating boundary: 600 stays ACTIVE, 400 suspends.
        test_recipe:
          setup:
            - "Department D (budget 1000000); contract ACTIVE (phone 50c/min, ceiling 1000000)"
            - "Interpreter X CERTIFIED [es] [PHONE] conf current (sole candidate)"
            - "R1..R3 PHONE GENERAL 30-min requests ASSIGNED to X and COMPLETED (actual 30, est=final 1725 each); clock then advanced to 2026-08-02T00:00:00Z"
            - "R4 PHONE 30-min ASSIGNED to X (committed 1725); complaints C1..C3 recorded against D, linked to R1..R3 respectively"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Sanitation", service_area_code: "SA-6", annual_budget_cents: 1000000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { vendor_name: "VendorSix", ceiling_cents: 1000000, phone_per_minute_cents: 50, video_per_minute_cents: 75, in_person_per_minute_cents: 100, translation_per_word_cents: 20, in_person_travel_flat_cents: 2500 }
              as: LanguageAccessCoordinator
              captures: { contract_id: $.data.id }
            - call: "POST /vendor-contracts/${contract_id}/activate"
              as: LanguageAccessCoordinator
            - call: "POST /interpreters"
              payload: { full_name: "Xavier Phone", language_codes: ["es"], modalities: ["PHONE"], tier: "CERTIFIED", vendor_contract_id: "${contract_id}" }
              as: LanguageAccessCoordinator
              captures: { interp_id: $.data.id }
            - call: "PATCH /interpreters/${interp_id}"
              payload: { confidentiality_signed: true }
              as: LanguageAccessCoordinator
            - call: "POST /interpretation-requests"
              payload: { department_id: "${dept_id}", language_code: "es", modality: "PHONE", encounter_setting: "GENERAL", scheduled_duration_minutes: 30 }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /interpretation-requests/${r1_id}/complete"
              payload: { actual_minutes: 30 }
              as: Interpreter
              as_user_id: "${interp_id}"
            - call: "POST /interpretation-requests"
              payload: { department_id: "${dept_id}", language_code: "es", modality: "PHONE", encounter_setting: "GENERAL", scheduled_duration_minutes: 30 }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { r2_id: $.data.id }
            - call: "POST /interpretation-requests/${r2_id}/complete"
              payload: { actual_minutes: 30 }
              as: Interpreter
              as_user_id: "${interp_id}"
            - call: "POST /interpretation-requests"
              payload: { department_id: "${dept_id}", language_code: "es", modality: "PHONE", encounter_setting: "GENERAL", scheduled_duration_minutes: 30 }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { r3_id: $.data.id }
            - call: "POST /interpretation-requests/${r3_id}/complete"
              payload: { actual_minutes: 30 }
              as: Interpreter
              as_user_id: "${interp_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: LanguageAccessCoordinator
            - call: "POST /interpretation-requests"
              payload: { department_id: "${dept_id}", language_code: "es", modality: "PHONE", encounter_setting: "GENERAL", scheduled_duration_minutes: 30 }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { r4_id: $.data.id }
            - call: "POST /complaints"
              payload: { department_id: "${dept_id}", interpretation_request_id: "${r1_id}", category: "POOR_QUALITY", description: "c1" }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /complaints"
              payload: { department_id: "${dept_id}", interpretation_request_id: "${r2_id}", category: "POOR_QUALITY", description: "c2" }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /complaints"
              payload: { department_id: "${dept_id}", interpretation_request_id: "${r3_id}", category: "POOR_QUALITY", description: "c3" }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { c3_id: $.data.id }
            - call: "POST /complaints/${c1_id}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: ComplianceOfficer
            - call: "POST /complaints/${c2_id}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /complaints/${c3_id}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: ComplianceOfficer
          assert:
            - "Interpreter.${interp_id}.quality_rating == 800 after C1 and == 600 after C2 with status still ACTIVE (600 is not < 600)"
            - "Interpreter.${interp_id}.quality_rating == 400 and status == SUSPENDED after C3 (link 1 -> link 2)"
            - "InterpretationRequest.${r4_id}.status == CANCELLED (link 3: suspension cascade)"
            - "VendorContract.${contract_id}.committed_cents == 0 (link 4: 1725 released) and spent_cents == 5175 (3 x 1725 completions unaffected)"
            - "Department.${dept_id}.compliance_score == 550 and posture == NONCOMPLIANT (3 x -150)"

      - name: translation_approval_exhaustion_cancels_queued_jobs
        grounds:
          - state_machines.TranslationJob.QUALITY_REVIEW_to_APPROVED
          - state_machines.VendorContract.ACTIVE_to_EXHAUSTED
          - state_machines.TranslationJob.QUEUED_to_CANCELLED
          - calculations.vendor_contract_commitment
        distinguishing_aspect: |
          Different trigger than the complaint cascade: review APPROVE -> contract spent_cents 90000
          hits the 90% exhaustion threshold (>= 90000 of 100000, link 1) -> contract ACTIVE ->
          EXHAUSTED (link 2) -> unrelated QUEUED job B auto-CANCELLED (link 3) -> B's 10000
          provisional released (link 4).
        test_recipe:
          setup:
            - "Department D; contract ceiling 100000, word rate 20c, ACTIVE; Doc ACTIVE; translator REGISTERED conf current; reviewer CERTIFIED conf current"
            - "Job A word_count 4500 (provisional 90000, committed 90000); Job B word_count 500 (provisional 10000; committed == ceiling 100000, equality allowed)"
            - "Job A assigned and submitted (submitted_word_count 4500)"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Water", service_area_code: "SA-7", annual_budget_cents: 1000000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { vendor_name: "VendorSeven", ceiling_cents: 100000, phone_per_minute_cents: 50, video_per_minute_cents: 75, in_person_per_minute_cents: 100, translation_per_word_cents: 20, in_person_travel_flat_cents: 2500 }
              as: LanguageAccessCoordinator
              captures: { contract_id: $.data.id }
            - call: "POST /vendor-contracts/${contract_id}/activate"
              as: LanguageAccessCoordinator
            - call: "POST /interpreters"
              payload: { full_name: "Tom Translator", language_codes: ["es"], modalities: ["PHONE"], tier: "REGISTERED", vendor_contract_id: "${contract_id}" }
              as: LanguageAccessCoordinator
              captures: { translator_id: $.data.id }
            - call: "PATCH /interpreters/${translator_id}"
              payload: { confidentiality_signed: true }
              as: LanguageAccessCoordinator
            - call: "POST /interpreters"
              payload: { full_name: "Rita Reviewer", language_codes: ["es"], modalities: ["PHONE"], tier: "CERTIFIED", vendor_contract_id: "${contract_id}" }
              as: LanguageAccessCoordinator
              captures: { reviewer_id: $.data.id }
            - call: "PATCH /interpreters/${reviewer_id}"
              payload: { confidentiality_signed: true }
              as: LanguageAccessCoordinator
            - call: "POST /vital-documents"
              payload: { department_id: "${dept_id}", title: "Rate Guide", document_type: "GUIDE" }
              as: LanguageAccessCoordinator
              captures: { doc_id: $.data.id }
            - call: "POST /translation-jobs"
              payload: { document_id: "${doc_id}", vendor_contract_id: "${contract_id}", target_language_code: "es", word_count: 4500 }
              as: LanguageAccessCoordinator
              captures: { job_a_id: $.data.id }
            - call: "POST /translation-jobs"
              payload: { document_id: "${doc_id}", vendor_contract_id: "${contract_id}", target_language_code: "fr", word_count: 500 }
              as: LanguageAccessCoordinator
              captures: { job_b_id: $.data.id }
            - call: "POST /translation-jobs/${job_a_id}/assign"
              payload: { translator_id: "${translator_id}" }
              as: LanguageAccessCoordinator
            - call: "POST /translation-jobs/${job_a_id}/submit-translation"
              payload: { submitted_word_count: 4500 }
              as: Interpreter
              as_user_id: "${translator_id}"
          trigger:
            - call: "POST /translation-jobs/${job_a_id}/review"
              payload: { decision: "APPROVE" }
              as: QualityReviewer
              as_user_id: "${reviewer_id}"
          assert:
            - "TranslationJob.${job_a_id}.status == APPROVED and final_cost_cents == 90000"
            - "VendorContract.${contract_id}.spent_cents == 90000 (>= 90% of 100000 -> threshold hit, link 1)"
            - "VendorContract.${contract_id}.status == EXHAUSTED (link 2)"
            - "TranslationJob.${job_b_id}.status == CANCELLED (link 3)"
            - "VendorContract.${contract_id}.committed_cents == 0 (90000 released from A + 10000 released from B, link 4) and available_cents == 10000"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: job_create_retired_document_state_beats_ceiling_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_DOCUMENT_RETIRED]
          - errors[ERR_CONTRACT_CEILING_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair (state vs business_fiscal): one POST /translation-jobs violates both
          the document-state rule (RETIRED) and the fiscal rule (provisional 20000 > ceiling 100);
          the state error ERR_DOCUMENT_RETIRED (priority 5) must win over ERR_CONTRACT_CEILING_EXCEEDED (priority 9).
        test_recipe:
          setup:
            - "Department D; contract ACTIVE with ceiling 100 (word rate 20c); Doc retired via retire endpoint"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Aging", service_area_code: "SA-8", annual_budget_cents: 1000000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { vendor_name: "VendorEight", ceiling_cents: 100, phone_per_minute_cents: 50, video_per_minute_cents: 75, in_person_per_minute_cents: 100, translation_per_word_cents: 20, in_person_travel_flat_cents: 2500 }
              as: LanguageAccessCoordinator
              captures: { contract_id: $.data.id }
            - call: "POST /vendor-contracts/${contract_id}/activate"
              as: LanguageAccessCoordinator
            - call: "POST /vital-documents"
              payload: { department_id: "${dept_id}", title: "Old Form", document_type: "FORM" }
              as: LanguageAccessCoordinator
              captures: { doc_id: $.data.id }
            - call: "POST /vital-documents/${doc_id}/retire"
              as: LanguageAccessCoordinator
          trigger:
            - call: "POST /translation-jobs"
              payload: { document_id: "${doc_id}", vendor_contract_id: "${contract_id}", target_language_code: "es", word_count: 1000 }
              as: LanguageAccessCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DOCUMENT_RETIRED (HTTP 409; priority-5 state beats priority-9 fiscal)"
            - "error_id != ERR_CONTRACT_CEILING_EXCEEDED even though 1000 words x 20c = 20000 > ceiling 100"
            - "VendorContract.${contract_id}.committed_cents == 0 (no commitment leaked)"

      - name: request_create_setting_safety_beats_schedule_temporal
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_SETTING_REQUIRES_IN_PERSON]
          - errors[ERR_SCHEDULE_IN_PAST]
        distinguishing_aspect: |
          Error-category pair (business_safety vs business_temporal): one POST /interpretation-requests
          violates both the COURT-requires-IN_PERSON safety rule (modality PHONE) and the past-schedule
          temporal rule; ERR_SETTING_REQUIRES_IN_PERSON (priority 6) must win over ERR_SCHEDULE_IN_PAST (priority 7).
          Different category pair than job_create_retired_document_state_beats_ceiling_fiscal.
        test_recipe:
          setup:
            - "Department D exists; logical clock at default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Courts", service_area_code: "SA-9", annual_budget_cents: 1000000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
          trigger:
            - call: "POST /interpretation-requests"
              payload: { department_id: "${dept_id}", language_code: "es", modality: "PHONE", encounter_setting: "COURT", scheduled_start: "2026-07-01T10:00:00Z", scheduled_duration_minutes: 30 }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SETTING_REQUIRES_IN_PERSON (HTTP 422; priority-6 safety beats priority-7 temporal)"
            - "error_id != ERR_SCHEDULE_IN_PAST even though 2026-07-01 predates the logical clock"
            - "No InterpretationRequest is persisted for the rejected call (GET /interpretation-requests?department_id=${dept_id} total_count == 0)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: threshold_language_exactly_five_percent_inclusive
        grounds:
          - calculations.threshold_language_classification
          - entities.LanguageAssessment.fields.threshold_language_safe
        distinguishing_aspect: |
          Boundary on the population-share metric reached via POST /language-assessments:
          lep_share exactly 0.0500 satisfies the >= 0.05 safe-harbor threshold (inclusive), while
          0.0499 does not — pinned on both sides via two assessments on different languages.
        test_recipe:
          setup:
            - "Department D exists"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Elections", service_area_code: "SA-10", annual_budget_cents: 1000000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
          trigger:
            - call: "POST /language-assessments"
              payload: { department_id: "${dept_id}", language_code: "es", plan_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", lep_speaker_count: 500, service_area_population: 10000, encounter_count: 100, total_encounters: 10000 }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { asm_es: $.data.id }
            - call: "POST /language-assessments"
              payload: { department_id: "${dept_id}", language_code: "fr", plan_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", lep_speaker_count: 499, service_area_population: 10000, encounter_count: 100, total_encounters: 10000 }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { asm_fr: $.data.id }
          assert:
            - "LanguageAssessment.${asm_es}.lep_share == 0.05 and threshold_language_safe == true (>= is inclusive at exactly 5%)"
            - "LanguageAssessment.${asm_fr}.lep_share == 0.0499 and threshold_language_safe == false (499 < 1000 so the count override cannot save it)"

      - name: contract_ceiling_exact_cent_allowed_one_cent_over_rejected
        grounds:
          - calculations.vendor_contract_commitment
          - errors[ERR_CONTRACT_CEILING_EXCEEDED]
        distinguishing_aspect: |
          Boundary on the cents metric reached via POST /translation-jobs: commitments totaling
          exactly ceiling_cents (100000) are accepted (<= is inclusive), and the next 1-word job
          (20c over) is rejected — different metric and endpoint than the 5% share boundary.
        test_recipe:
          setup:
            - "Department D; contract ceiling 100000, word rate 20c, ACTIVE; Doc ACTIVE"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Finance", service_area_code: "SA-11", annual_budget_cents: 1000000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { vendor_name: "VendorNine", ceiling_cents: 100000, phone_per_minute_cents: 50, video_per_minute_cents: 75, in_person_per_minute_cents: 100, translation_per_word_cents: 20, in_person_travel_flat_cents: 2500 }
              as: LanguageAccessCoordinator
              captures: { contract_id: $.data.id }
            - call: "POST /vendor-contracts/${contract_id}/activate"
              as: LanguageAccessCoordinator
            - call: "POST /vital-documents"
              payload: { department_id: "${dept_id}", title: "Budget Notice", document_type: "NOTICE" }
              as: LanguageAccessCoordinator
              captures: { doc_id: $.data.id }
          trigger:
            - call: "POST /translation-jobs"
              payload: { document_id: "${doc_id}", vendor_contract_id: "${contract_id}", target_language_code: "es", word_count: 4500 }
              as: LanguageAccessCoordinator
              captures: { job1_id: $.data.id }
            - call: "POST /translation-jobs"
              payload: { document_id: "${doc_id}", vendor_contract_id: "${contract_id}", target_language_code: "fr", word_count: 500 }
              as: LanguageAccessCoordinator
              captures: { job2_id: $.data.id }
            - call: "POST /translation-jobs"
              payload: { document_id: "${doc_id}", vendor_contract_id: "${contract_id}", target_language_code: "vi", word_count: 1 }
              as: LanguageAccessCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Job1 (90000) and Job2 (10000) both created: VendorContract.${contract_id}.committed_cents == 100000 == ceiling_cents (equality allowed)"
            - "Third create: error_id == ERR_CONTRACT_CEILING_EXCEEDED (HTTP 402; 100020 > 100000)"
            - "VendorContract.${contract_id}.committed_cents == 100000 unchanged after the rejection"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: job_create_requires_active_contract
        grounds:
          - state_machines.VendorContract
          - validations[priority=5]
          - errors[ERR_CONTRACT_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair TranslationJob -> VendorContract: job creation is gated on the CONTRACT's
          state (DRAFT contract rejects with ERR_CONTRACT_NOT_ACTIVE; after activation the identical
          request succeeds) — the job's valid transition set depends on a different entity's state.
        test_recipe:
          setup:
            - "Department D; contract in DRAFT (not activated); Doc ACTIVE"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Streets", service_area_code: "SA-12", annual_budget_cents: 1000000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { vendor_name: "VendorTen", ceiling_cents: 1000000, phone_per_minute_cents: 50, video_per_minute_cents: 75, in_person_per_minute_cents: 100, translation_per_word_cents: 20, in_person_travel_flat_cents: 2500 }
              as: LanguageAccessCoordinator
              captures: { contract_id: $.data.id }
            - call: "POST /vital-documents"
              payload: { department_id: "${dept_id}", title: "Sweeping Schedule", document_type: "NOTICE" }
              as: LanguageAccessCoordinator
              captures: { doc_id: $.data.id }
          trigger:
            - call: "POST /translation-jobs"
              payload: { document_id: "${doc_id}", vendor_contract_id: "${contract_id}", target_language_code: "es", word_count: 100 }
              as: LanguageAccessCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /vendor-contracts/${contract_id}/activate"
              as: LanguageAccessCoordinator
            - call: "POST /translation-jobs"
              payload: { document_id: "${doc_id}", vendor_contract_id: "${contract_id}", target_language_code: "es", word_count: 100 }
              as: LanguageAccessCoordinator
              captures: { job_id: $.data.id }
          assert:
            - "First create: error_id == ERR_CONTRACT_NOT_ACTIVE (HTTP 409) while contract is DRAFT"
            - "Second create (after activate): 201 with TranslationJob.${job_id}.status == QUEUED and provisional_cost_cents == 2000"

      - name: request_create_blocked_when_department_noncompliant
        grounds:
          - calculations.department_compliance_score
          - validations[priority=6]
          - errors[ERR_DEPARTMENT_NONCOMPLIANT]
        distinguishing_aspect: |
          Entity pair InterpretationRequest -> Department: request creation is gated on the
          DEPARTMENT's derived posture; three SUBSTANTIATED complaints drive compliance_score to
          550 (< 600) flipping posture to NONCOMPLIANT, after which the previously-succeeding
          request create is rejected — different entity pair than TranslationJob -> VendorContract.
        test_recipe:
          setup:
            - "Department D; complaints K1..K3 recorded by D's liaison and adjudicated SUBSTANTIATED by an officer (score 1000 -> 850 -> 700 -> 550)"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Transit", service_area_code: "SA-13", annual_budget_cents: 1000000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
            - call: "POST /complaints"
              payload: { department_id: "${dept_id}", category: "NO_INTERPRETER_AVAILABLE", description: "k1" }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { k1_id: $.data.id }
            - call: "POST /complaints"
              payload: { department_id: "${dept_id}", category: "NO_INTERPRETER_AVAILABLE", description: "k2" }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { k2_id: $.data.id }
            - call: "POST /complaints"
              payload: { department_id: "${dept_id}", category: "NO_INTERPRETER_AVAILABLE", description: "k3" }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { k3_id: $.data.id }
            - call: "POST /complaints/${k1_id}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: ComplianceOfficer
            - call: "POST /complaints/${k2_id}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: ComplianceOfficer
            - call: "POST /complaints/${k3_id}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /interpretation-requests"
              payload: { department_id: "${dept_id}", language_code: "es", modality: "PHONE", encounter_setting: "GENERAL", scheduled_duration_minutes: 30 }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Department.${dept_id}.compliance_score == 550 and posture == NONCOMPLIANT before the trigger"
            - "error_id == ERR_DEPARTMENT_NONCOMPLIANT (HTTP 409)"
            - "GET /interpretation-requests?department_id=${dept_id} total_count == 0 (nothing persisted)"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: in_person_buffered_overlap_excludes_sole_candidate
        grounds:
          - calculations.interpreter_dispatch_selection
          - entities.InterpretationRequest.fields.scheduled_start
        distinguishing_aspect: |
          Buffered half-open semantics on the Interpreter resource: an existing ASSIGNED session
          [10:00, 12:00) blocks new sessions starting before 12:30 (30-min travel buffer), so a
          12:15 request lands UNFULFILLED while a 12:30 request (exactly at buffer end, exclusive)
          is ASSIGNED — buffer semantics distinct from the plain half-open assessment windows.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T06:00:00Z; Department D (budget 1000000); contract ACTIVE (in_person 100c/min, travel 2500c, ceiling 1000000)"
            - "Interpreter X CERTIFIED [es] [IN_PERSON] conf current (sole candidate)"
            - "Session A: IN_PERSON 10:00-12:00 ASSIGNED to X (est 16300 committed)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: LanguageAccessCoordinator
            - call: "POST /departments"
              payload: { name: "Dept Clinics", service_area_code: "SA-14", annual_budget_cents: 1000000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { vendor_name: "VendorEleven", ceiling_cents: 1000000, phone_per_minute_cents: 50, video_per_minute_cents: 75, in_person_per_minute_cents: 100, translation_per_word_cents: 20, in_person_travel_flat_cents: 2500 }
              as: LanguageAccessCoordinator
              captures: { contract_id: $.data.id }
            - call: "POST /vendor-contracts/${contract_id}/activate"
              as: LanguageAccessCoordinator
            - call: "POST /interpreters"
              payload: { full_name: "Ina Person", language_codes: ["es"], modalities: ["IN_PERSON"], tier: "CERTIFIED", vendor_contract_id: "${contract_id}" }
              as: LanguageAccessCoordinator
              captures: { interp_id: $.data.id }
            - call: "PATCH /interpreters/${interp_id}"
              payload: { confidentiality_signed: true }
              as: LanguageAccessCoordinator
            - call: "POST /interpretation-requests"
              payload: { department_id: "${dept_id}", language_code: "es", modality: "IN_PERSON", encounter_setting: "GENERAL", scheduled_start: "2026-08-01T10:00:00Z", scheduled_duration_minutes: 120 }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { req_a_id: $.data.id }
          trigger:
            - call: "POST /interpretation-requests"
              payload: { department_id: "${dept_id}", language_code: "es", modality: "IN_PERSON", encounter_setting: "GENERAL", scheduled_start: "2026-08-01T12:15:00Z", scheduled_duration_minutes: 45 }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { req_b_id: $.data.id }
            - call: "POST /interpretation-requests"
              payload: { department_id: "${dept_id}", language_code: "es", modality: "IN_PERSON", encounter_setting: "GENERAL", scheduled_start: "2026-08-01T12:30:00Z", scheduled_duration_minutes: 45 }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { req_c_id: $.data.id }
          assert:
            - "InterpretationRequest.${req_a_id}.status == ASSIGNED and interpreter_id == ${interp_id}"
            - "InterpretationRequest.${req_b_id}.status == UNFULFILLED and interpreter_id == null (12:15 inside [09:30,12:30) buffered window)"
            - "InterpretationRequest.${req_c_id}.status == ASSIGNED and interpreter_id == ${interp_id} (12:30 == buffer end, exclusive boundary)"
            - "Department.${dept_id}.compliance_score == 950 (one -50 UNFULFILLED event for B only)"

      - name: assessment_period_half_open_adjacency
        grounds:
          - validations[priority=7]
          - errors[ERR_ASSESSMENT_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Pure half-open interval semantics on the (Department, language) assessment stream — NO
          buffer and adjacency permitted: [2026-01-01,2026-06-01) then [2026-06-01,2026-12-01) is
          accepted (shared endpoint allowed), while [2026-05-01,2026-08-01) is rejected with
          ERR_ASSESSMENT_PERIOD_OVERLAP. Different resource and different interval semantics than
          the buffered in-person interpreter rule.
        test_recipe:
          setup:
            - "Department D; existing es assessment covering [2026-01-01, 2026-06-01)"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Planning", service_area_code: "SA-15", annual_budget_cents: 1000000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
            - call: "POST /language-assessments"
              payload: { department_id: "${dept_id}", language_code: "es", plan_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", lep_speaker_count: 100, service_area_population: 10000, encounter_count: 50, total_encounters: 10000 }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { asm1_id: $.data.id }
          trigger:
            - call: "POST /language-assessments"
              payload: { department_id: "${dept_id}", language_code: "es", plan_year: 2026, period_start: "2026-06-01T00:00:00Z", period_end: "2026-12-01T00:00:00Z", lep_speaker_count: 120, service_area_population: 10000, encounter_count: 60, total_encounters: 10000 }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { asm2_id: $.data.id }
            - call: "POST /language-assessments"
              payload: { department_id: "${dept_id}", language_code: "es", plan_year: 2026, period_start: "2026-05-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", lep_speaker_count: 110, service_area_population: 10000, encounter_count: 55, total_encounters: 10000 }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Adjacent assessment created: LanguageAssessment.${asm2_id}.status == DRAFT (end == start is NOT overlap)"
            - "Overlapping assessment: error_id == ERR_ASSESSMENT_PERIOD_OVERLAP (HTTP 409)"
            - "GET /language-assessments?department_id=${dept_id} total_count == 2 (rejected one not persisted)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: contract_commitment_create_cancel_restores_available
        grounds:
          - calculations.vendor_contract_commitment
          - state_machines.TranslationJob.QUEUED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = contract ceiling dollars: create (commit 20000) paired with its
          compensating cancel (release 20000) leaves committed + spent + available == ceiling_cents
          (500000) invariant at every step, with committed_cents back to exactly 0.
        test_recipe:
          setup:
            - "Department D; contract ceiling 500000, word rate 20c, ACTIVE; Doc ACTIVE"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Forestry", service_area_code: "SA-16", annual_budget_cents: 1000000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { vendor_name: "VendorTwelve", ceiling_cents: 500000, phone_per_minute_cents: 50, video_per_minute_cents: 75, in_person_per_minute_cents: 100, translation_per_word_cents: 20, in_person_travel_flat_cents: 2500 }
              as: LanguageAccessCoordinator
              captures: { contract_id: $.data.id }
            - call: "POST /vendor-contracts/${contract_id}/activate"
              as: LanguageAccessCoordinator
            - call: "POST /vital-documents"
              payload: { department_id: "${dept_id}", title: "Fire Safety Guide", document_type: "GUIDE" }
              as: LanguageAccessCoordinator
              captures: { doc_id: $.data.id }
          trigger:
            - call: "POST /translation-jobs"
              payload: { document_id: "${doc_id}", vendor_contract_id: "${contract_id}", target_language_code: "es", word_count: 1000 }
              as: LanguageAccessCoordinator
              captures: { job_id: $.data.id }
            - call: "POST /translation-jobs/${job_id}/cancel"
              as: LanguageAccessCoordinator
          assert:
            - "After create: VendorContract.${contract_id}.committed_cents == 20000 and available_cents == 480000 (20000 + 0 + 480000 == 500000)"
            - "After cancel: TranslationJob.${job_id}.status == CANCELLED"
            - "After cancel: VendorContract.${contract_id}.committed_cents == 0 and spent_cents == 0 and available_cents == 500000 (invariant restored exactly, no drift)"

      - name: interpreter_minutes_completion_refund_clawback
        grounds:
          - calculations.interpreter_dispatch_selection
          - state_machines.Complaint.RECEIVED_to_SUBSTANTIATED
          - entities.InterpretationRequest.fields.refund_clawed_back
          - entities.Interpreter.fields.minutes_current_month
        distinguishing_aspect: |
          Conserved quantity = service minutes (different from contract dollars): complete adds 130
          minutes; the compensating SUBSTANTIATED+REFUND adjudication claws exactly those minutes
          back, leaving minutes_current_month == 0 == sum of actual_minutes over COMPLETED
          non-clawed-back requests — plus mirrored dollar refunds on both ledgers.
        test_recipe:
          setup:
            - "Clock at default 2026-08-01T00:00:00Z; Department D (budget 1000000); contract ACTIVE (phone 50c/min, ceiling 1000000)"
            - "Interpreter X CERTIFIED [es] [PHONE] conf current"
            - "Request R PHONE 130 min ASSIGNED to X (est 7590) and COMPLETED with actual_minutes 130 (final 7590)"
            - "Complaint K linked to R recorded by D's liaison"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Social", service_area_code: "SA-17", annual_budget_cents: 1000000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { vendor_name: "VendorThirteen", ceiling_cents: 1000000, phone_per_minute_cents: 50, video_per_minute_cents: 75, in_person_per_minute_cents: 100, translation_per_word_cents: 20, in_person_travel_flat_cents: 2500 }
              as: LanguageAccessCoordinator
              captures: { contract_id: $.data.id }
            - call: "POST /vendor-contracts/${contract_id}/activate"
              as: LanguageAccessCoordinator
            - call: "POST /interpreters"
              payload: { full_name: "Mia Minutes", language_codes: ["es"], modalities: ["PHONE"], tier: "CERTIFIED", vendor_contract_id: "${contract_id}" }
              as: LanguageAccessCoordinator
              captures: { interp_id: $.data.id }
            - call: "PATCH /interpreters/${interp_id}"
              payload: { confidentiality_signed: true }
              as: LanguageAccessCoordinator
            - call: "POST /interpretation-requests"
              payload: { department_id: "${dept_id}", language_code: "es", modality: "PHONE", encounter_setting: "GENERAL", scheduled_duration_minutes: 130 }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { req_id: $.data.id }
            - call: "POST /interpretation-requests/${req_id}/complete"
              payload: { actual_minutes: 130 }
              as: Interpreter
              as_user_id: "${interp_id}"
            - call: "POST /complaints"
              payload: { department_id: "${dept_id}", interpretation_request_id: "${req_id}", category: "POOR_QUALITY", description: "bad session" }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { complaint_id: $.data.id }
          trigger:
            - call: "POST /complaints/${complaint_id}/adjudicate"
              payload: { outcome: "SUBSTANTIATED", remedy: "REFUND" }
              as: ComplianceOfficer
          assert:
            - "Before adjudication: Interpreter.${interp_id}.minutes_current_month == 130, Department.spent_cents == 7590, VendorContract.spent_cents == 7590"
            - "InterpretationRequest.${req_id}.refund_clawed_back == true after adjudication"
            - "Interpreter.${interp_id}.minutes_current_month == 0 (forward +130 and clawback -130 leave the minutes invariant intact)"
            - "Department.${dept_id}.spent_cents == 0 and VendorContract.${contract_id}.spent_cents == 0 (dollar ledgers restored)"
            - "Interpreter.${interp_id}.quality_rating == 800 (1000 - 200) and status == ACTIVE (800 >= 600)"
            - "Department.${dept_id}.compliance_score == 850 (single -150 event)"
