      - name: code_uniqueness_is_scoped_per_season_not_globally
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=10]
          - errors[ERR_DUPLICATE_CODE]
          - entities.TerrainArea.fields.trail_code
          - entities.DayPlan.fields.operating_date
        distinguishing_aspect: |
          Priority 10 declares four different scopes at once: season_label is global, trail_code and
          lift_code are per season, and operating_date is per season. Two seasons are therefore built and
          the SAME lift_code, trail_code and operating_date are re-used in the second one - every reuse
          must succeed, while every repeat inside one season must fail with ERR_DUPLICATE_CODE. An
          implementation with a global unique index passes the in-season half and fails the cross-season
          half, which no single-season test can detect.
        test_recipe:
          setup:
            - "Season A (2026-27) with lift L1 and terrain area T1 and a day plan for 2026-08-01."
            - "Season B (2027-28) exists with no lifts, areas or day plans yet."
