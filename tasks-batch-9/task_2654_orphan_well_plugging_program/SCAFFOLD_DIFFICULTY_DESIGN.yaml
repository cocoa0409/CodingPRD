  - rule_id: transitive_cascade
    instances:
      - name: bond_forfeiture_cascades_operator_to_funding_source_to_wells_to_scores
        grounds:
          - state_machines.Operator.INSOLVENT_to_REVOKED
          - state_machines.Well.INACTIVE_to_ORPHAN_CANDIDATE
          - calculations.orphan_priority_score
          - entities.FundingSource.fields.bond_operator_id
          - entities.Operator.fields.orphan_candidate_count
          - validations[priority=60]
        distinguishing_aspect: |
          One POST /operators/{id}/enforcement with action FORFEIT_BOND propagates four hops:
          (1) Operator INSOLVENT -> REVOKED with bond_amount_cents zeroed, (2) a new FORFEITED_BOND
          FundingSource authorized at the pre-forfeiture 3000000 cents, (3) both of the operator's
          PRODUCING wells -> ORPHAN_CANDIDATE, (4) each of those wells' screening_score and
          remediation_score recomputed and the operator's orphan_candidate_count raised to 2 - none of
          which the caller names in the request body.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default"
            - "Operator 'Ghost Creek Energy' tier INDIVIDUAL, bond 3000000, holding two PRODUCING wells (2500 ft and 8000 ft), required_bond_cents 1250000, status ACTIVE"
            - "no FundingSource exists yet"
            - "the operator has been declared INSOLVENT by a prior enforcement action"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Ghost Creek Energy", region_code: "TX", financial_assurance_tier: "INDIVIDUAL", bond_amount_cents: 3000000 }
              as: ProgramAdmin
