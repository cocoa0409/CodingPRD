# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2991_academic_integrity_case_adjudication
#
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 and is reachable from an empty
# database using only §1.5 endpoints. Every numeric literal in an `assert:` line was
# computed by executing the §1.3 formula (see the worked_examples blocks in §1.3,
# which carry the same values).
#
# Shared fixture vocabulary used by the chains below (all values are literals):
#   clock default            2026-08-01T00:00:00Z
#   ENGL department          enrolled_student_count 2000, faculty_headcount 5
#   ENGL-201 / 2026FA        grade_components ESSAY 200/40, MIDTERM 70/30,
#                            PROJECT 90/20, FINAL 180/10
#   canonical component_scores  ESSAY 156, MIDTERM 68, PROJECT 56, FINAL 113
#                            -> baseline_course_grade_pct 79.06
#   SEED-A evidence          one SIMILARITY_REPORT similarity_pct 45.00 page_count 4
#                            -> evidence_strength_score 60.00
#   SEED-B evidence          SEED-A plus one PROCTOR_LOG page_count 1 -> 81.50

scaffold_difficulty_design:

  # =========================================================================
  # RULE 1 - dual_variant_calc
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: ladder_placement_formal_and_informal_variants_yield_disjoint_bands
        grounds:
          - calculations.sanction_ladder_placement
          - calculations.case_severity_index
          - entities.Case.fields.informal_recommended_ladder_rank
          - entities.Case.fields.recommended_ladder_rank
          - endpoints[GET /integrity/cases/{id}/severity-assessment]
        distinguishing_aspect: |
          The variant pair differs by INPUT SET, not by rounding: formal_full consumes
          cross_course_pattern_points and prior_escalation_points while informal_instructor
          excludes both, so on the CASE-B fixture the same Case yields recommended_ladder_rank
          5 with band [4,6] under FORMAL and 3 with band [1,3] under INFORMAL - two DISJOINT
          bands, meaning no single proposed rank is legal under both variants.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z"
            - "ENGL department, one CURRENT-training reporter who instructs both offerings, one student"
            - "one legacy-imported RESPONSIBLE prior case in HIST-110 / 2025SP decided 2025-04-01 (inside the 730-day pattern window), so prior_upheld_count == 1 and distinct_other_course_codes == 1 -> cross_course_pattern_points == 4"
            - "the live case is PLAGIARISM on ENGL-201 / 2026FA with SEED-A evidence -> evidence_strength_score 60.00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/departments"
              payload: { code: "ENGL", name: "English", enrolled_student_count: 2000, faculty_headcount: 5 }
              as: IntegrityOfficer
              captures: { dept_engl_id: $.data.id }
            - call: "POST /integrity/faculty-members"
              payload: { department_id: "${dept_engl_id}", full_name: "Rita Reporter", email: "rita@u.edu" }
              as: IntegrityOfficer
              captures: { reporter_id: $.data.id }
            - call: "POST /integrity/faculty-members/${reporter_id}/training-completions"
              payload: { module_code: "AI-101", completed_at: "2026-01-15T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/students"
              payload: { full_name: "Sam Student", email: "sam@u.edu", program_code: "BA-ENG", class_year: 3 }
              as: IntegrityOfficer
              captures: { student_id: $.data.id }
            - call: "POST /integrity/course-offerings"
              payload: { department_id: "${dept_engl_id}", instructor_id: "${reporter_id}", course_code: "HIST-110", term_code: "2025SP", grade_components: [{ code: "FINAL", max_points: 100, weight_pct: 100 }] }
              as: IntegrityOfficer
              captures: { offering_hist_id: $.data.id }
            - call: "POST /integrity/reports"
              payload: { offering_id: "${offering_hist_id}", student_id: "${student_id}", alleged_violation_type: "PLAGIARISM", narrative: "Prior matter in HIST-110.", incident_at: "2025-03-01T00:00:00Z", component_scores: [{ code: "FINAL", earned_points: 50 }] }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
              captures: { report_hist_id: $.data.id }
            - call: "POST /integrity/evidence-items"
              payload: { report_id: "${report_hist_id}", kind: "SIMILARITY_REPORT", sha256: "2222222222222222222222222222222222222222222222222222222222222222", page_count: 4, similarity_pct: 45.00 }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
            - call: "POST /integrity/reports/${report_hist_id}/submit"
              as: FacultyReporter
              as_user_id: "${reporter_id}"
            - call: "POST /integrity/reports/${report_hist_id}/triage"
              payload: { decision: "ACCEPT", triage_note: "Historical record load." }
              as: IntegrityOfficer
            - call: "POST /integrity/cases/legacy-import"
              payload: { report_id: "${report_hist_id}", decided_at: "2025-04-01T00:00:00Z", responsibility_finding: "RESPONSIBLE", imposed_ladder_rank: 3, completed_at: "2025-05-01T00:00:00Z" }
              as: IntegrityOfficer
              captures: { case_hist_id: $.data.id }
            - call: "POST /integrity/course-offerings"
              payload: { department_id: "${dept_engl_id}", instructor_id: "${reporter_id}", course_code: "ENGL-201", term_code: "2026FA", grade_components: [{ code: "ESSAY", max_points: 200, weight_pct: 40 }, { code: "MIDTERM", max_points: 70, weight_pct: 30 }, { code: "PROJECT", max_points: 90, weight_pct: 20 }, { code: "FINAL", max_points: 180, weight_pct: 10 }] }
              as: IntegrityOfficer
              captures: { offering_id: $.data.id }
            - call: "POST /integrity/reports"
              payload: { offering_id: "${offering_id}", student_id: "${student_id}", alleged_violation_type: "PLAGIARISM", narrative: "Essay reuses an uncited source.", incident_at: "2026-07-20T00:00:00Z", component_scores: [{ code: "ESSAY", earned_points: 156 }, { code: "MIDTERM", earned_points: 68 }, { code: "PROJECT", earned_points: 56 }, { code: "FINAL", earned_points: 113 }] }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
              captures: { report_id: $.data.id }
            - call: "POST /integrity/evidence-items"
              payload: { report_id: "${report_id}", kind: "SIMILARITY_REPORT", sha256: "1111111111111111111111111111111111111111111111111111111111111111", page_count: 4, similarity_pct: 45.00 }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
            - call: "POST /integrity/reports/${report_id}/submit"
              as: FacultyReporter
              as_user_id: "${reporter_id}"
            - call: "POST /integrity/reports/${report_id}/triage"
              payload: { decision: "ACCEPT", triage_note: "Sufficient evidence." }
              as: IntegrityOfficer
            - call: "POST /integrity/cases"
              payload: { report_id: "${report_id}" }
              as: IntegrityOfficer
              captures: { case_id: $.data.id }
          trigger:
            - call: "GET /integrity/cases/${case_id}/severity-assessment"
              payload: { pathway_basis: "FORMAL" }
              as: IntegrityOfficer
              captures: { formal_rank: $.data.recommended_ladder_rank, formal_band_lo: $.data.permitted_band_min, formal_band_hi: $.data.permitted_band_max }
            - call: "GET /integrity/cases/${case_id}/severity-assessment"
              payload: { pathway_basis: "INFORMAL" }
              as: IntegrityOfficer
              captures: { informal_rank: $.data.recommended_ladder_rank, informal_band_lo: $.data.permitted_band_min, informal_band_hi: $.data.permitted_band_max }
          assert:
            - "FORMAL basis: data.evidence_strength_score == 60.00"
            - "FORMAL basis: data.cross_course_pattern_points == 4 and data.distinct_other_course_codes == 1"
            - "FORMAL basis: data.provisional_severity_index == 48.00, data.prior_escalation_points == 8, data.severity_index == 56.00"
            - "FORMAL basis: data.tier_rank == 5, data.recommended_ladder_rank == 5, data.permitted_band_min == 4, data.permitted_band_max == 6"
            - "FORMAL basis: data.recommended_kind == DISCIPLINARY_PROBATION and data.informal_pathway_permitted == false"
            - "INFORMAL basis: data.severity_index == 44.00, data.cross_course_pattern_points == 0, data.prior_escalation_points == 0"
            - "INFORMAL basis: data.recommended_ladder_rank == 3, data.permitted_band_min == 1, data.permitted_band_max == 3"
            - "INFORMAL basis: data.recommended_kind == GRADE_PENALTY_COURSE"
            - "the two bands [4,6] and [1,3] are disjoint: ${formal_band_lo} > ${informal_band_hi}"
            - "Case.${case_id}.recommended_ladder_rank == 5 and Case.${case_id}.informal_recommended_ladder_rank == 3 on GET /integrity/cases/${case_id}"

      - name: department_reporting_rate_submitted_basis_versus_adjudicated_basis
        grounds:
          - calculations.department_reporting_rate
          - entities.Department.fields.reporting_rate_per_1k_submitted
          - endpoints[GET /integrity/departments/{id}/reporting-metrics]
        distinguishing_aspect: |
          The variant pair differs by INPUT ENTITY, not by input set of one entity:
          submitted_basis counts IntegrityReport rows by submitted_at while adjudicated_basis
          counts Case rows by decided_at, so ENGL with 3 submitted reports of which exactly one
          reached an upheld finding returns 1.50 per 1000 on the submitted basis and 0.50 on
          the adjudicated basis - a delta of exactly 1.00 on identical stored data.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z"
            - "ENGL department with enrolled_student_count 2000"
            - "three ENGL reports submitted on 2026-08-01 (status != DRAFT), all inside the 365-day reporting window"
            - "exactly one of them is legacy-imported as a RESPONSIBLE case decided 2026-06-01, also inside the window"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/departments"
              payload: { code: "ENGL", name: "English", enrolled_student_count: 2000, faculty_headcount: 5 }
              as: IntegrityOfficer
              captures: { dept_engl_id: $.data.id }
            - call: "POST /integrity/faculty-members"
              payload: { department_id: "${dept_engl_id}", full_name: "Rita Reporter", email: "rita@u.edu" }
              as: IntegrityOfficer
              captures: { reporter_id: $.data.id }
            - call: "POST /integrity/faculty-members/${reporter_id}/training-completions"
              payload: { module_code: "AI-101", completed_at: "2026-01-15T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/students"
              payload: { full_name: "Sam Student", email: "sam@u.edu", program_code: "BA-ENG", class_year: 3 }
              as: IntegrityOfficer
              captures: { student_id: $.data.id }
            - call: "POST /integrity/course-offerings"
              payload: { department_id: "${dept_engl_id}", instructor_id: "${reporter_id}", course_code: "ENGL-101", term_code: "2026SP", grade_components: [{ code: "FINAL", max_points: 100, weight_pct: 100 }] }
              as: IntegrityOfficer
              captures: { offering_1_id: $.data.id }
            - call: "POST /integrity/reports"
              payload: { offering_id: "${offering_1_id}", student_id: "${student_id}", alleged_violation_type: "PLAGIARISM", narrative: "Report one.", incident_at: "2026-05-01T00:00:00Z", component_scores: [{ code: "FINAL", earned_points: 60 }] }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
              captures: { report_1_id: $.data.id }
            - call: "POST /integrity/evidence-items"
              payload: { report_id: "${report_1_id}", kind: "SIMILARITY_REPORT", sha256: "3333333333333333333333333333333333333333333333333333333333333333", page_count: 4, similarity_pct: 45.00 }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
            - call: "POST /integrity/reports/${report_1_id}/submit"
              as: FacultyReporter
              as_user_id: "${reporter_id}"
            - call: "POST /integrity/reports/${report_1_id}/triage"
              payload: { decision: "ACCEPT", triage_note: "Accepted for the historical load." }
              as: IntegrityOfficer
            - call: "POST /integrity/cases/legacy-import"
              payload: { report_id: "${report_1_id}", decided_at: "2026-06-01T00:00:00Z", responsibility_finding: "RESPONSIBLE", imposed_ladder_rank: 3, completed_at: "2026-06-20T00:00:00Z" }
              as: IntegrityOfficer
              captures: { case_1_id: $.data.id }
            - call: "POST /integrity/course-offerings"
              payload: { department_id: "${dept_engl_id}", instructor_id: "${reporter_id}", course_code: "ENGL-102", term_code: "2026SP", grade_components: [{ code: "FINAL", max_points: 100, weight_pct: 100 }] }
              as: IntegrityOfficer
              captures: { offering_2_id: $.data.id }
            - call: "POST /integrity/reports"
              payload: { offering_id: "${offering_2_id}", student_id: "${student_id}", alleged_violation_type: "FABRICATION_OF_DATA", narrative: "Report two.", incident_at: "2026-06-10T00:00:00Z", component_scores: [{ code: "FINAL", earned_points: 70 }] }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
              captures: { report_2_id: $.data.id }
            - call: "POST /integrity/evidence-items"
              payload: { report_id: "${report_2_id}", kind: "DOCUMENT", sha256: "4444444444444444444444444444444444444444444444444444444444444444", page_count: 6 }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
            - call: "POST /integrity/reports/${report_2_id}/submit"
              as: FacultyReporter
              as_user_id: "${reporter_id}"
            - call: "POST /integrity/course-offerings"
              payload: { department_id: "${dept_engl_id}", instructor_id: "${reporter_id}", course_code: "ENGL-103", term_code: "2026SP", grade_components: [{ code: "FINAL", max_points: 100, weight_pct: 100 }] }
              as: IntegrityOfficer
              captures: { offering_3_id: $.data.id }
            - call: "POST /integrity/reports"
              payload: { offering_id: "${offering_3_id}", student_id: "${student_id}", alleged_violation_type: "FABRICATION_OF_DATA", narrative: "Report three.", incident_at: "2026-06-15T00:00:00Z", component_scores: [{ code: "FINAL", earned_points: 80 }] }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
              captures: { report_3_id: $.data.id }
            - call: "POST /integrity/evidence-items"
              payload: { report_id: "${report_3_id}", kind: "DOCUMENT", sha256: "5555555555555555555555555555555555555555555555555555555555555555", page_count: 6 }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
            - call: "POST /integrity/reports/${report_3_id}/submit"
              as: FacultyReporter
              as_user_id: "${reporter_id}"
          trigger:
            - call: "GET /integrity/departments/${dept_engl_id}/reporting-metrics"
              payload: { basis: "SUBMITTED", as_of: "2026-08-01T00:00:00Z" }
              as: IntegrityOfficer
              captures: { sub_rate: $.data.reporting_rate_per_1k }
            - call: "GET /integrity/departments/${dept_engl_id}/reporting-metrics"
              payload: { basis: "ADJUDICATED", as_of: "2026-08-01T00:00:00Z" }
              as: IntegrityOfficer
              captures: { adj_rate: $.data.reporting_rate_per_1k }
          assert:
            - "SUBMITTED basis: data.numerator == 3 and data.reporting_rate_per_1k == 1.50"
            - "ADJUDICATED basis: data.numerator == 1 and data.reporting_rate_per_1k == 0.50"
            - "both responses: data.enrolled_student_count == 2000 and data.window_days == 365"
            - "the delta between the two bases is exactly 1.00: ${sub_rate} - ${adj_rate} == 1.00"
            - "Department.${dept_engl_id}.reporting_rate_per_1k_submitted == 1.50 on GET /integrity/departments/${dept_engl_id} (the persisted field always carries the submitted basis)"

  # =========================================================================
  # RULE 2 - combinatorial_formula (modes a, b and c are all present)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: evidence_strength_score_seven_step_dependency_chain_mode_a
        grounds:
          - calculations.evidence_strength_score
          - entities.IntegrityReport.fields.evidence_strength_score
          - entities.EvidenceItem.fields.similarity_pct
          - endpoints[POST /integrity/evidence-items]
        distinguishing_aspect: |
          MODE (a): a strictly dependency-ordered chain of seven steps in which step 2's band
          multiplier is chosen from step 1's allowance-adjusted similarity and step 3 multiplies
          the two, so the steps cannot be reordered or evaluated independently. On SEED-B the
          correct score is 81.50 while choosing the band from the RAW similarity_pct (skipping
          step 1 before step 2) yields 87.50.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z"
            - "one DRAFT PLAGIARISM report on ENGL-201 / 2026FA already carrying SEED-A evidence (SIMILARITY_REPORT similarity_pct 45.00, page_count 4)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/departments"
              payload: { code: "ENGL", name: "English", enrolled_student_count: 2000, faculty_headcount: 5 }
              as: IntegrityOfficer
              captures: { dept_engl_id: $.data.id }
            - call: "POST /integrity/faculty-members"
              payload: { department_id: "${dept_engl_id}", full_name: "Rita Reporter", email: "rita@u.edu" }
              as: IntegrityOfficer
              captures: { reporter_id: $.data.id }
            - call: "POST /integrity/faculty-members/${reporter_id}/training-completions"
              payload: { module_code: "AI-101", completed_at: "2026-01-15T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/students"
              payload: { full_name: "Sam Student", email: "sam@u.edu", program_code: "BA-ENG", class_year: 3 }
              as: IntegrityOfficer
              captures: { student_id: $.data.id }
            - call: "POST /integrity/course-offerings"
              payload: { department_id: "${dept_engl_id}", instructor_id: "${reporter_id}", course_code: "ENGL-201", term_code: "2026FA", grade_components: [{ code: "ESSAY", max_points: 200, weight_pct: 40 }, { code: "MIDTERM", max_points: 70, weight_pct: 30 }, { code: "PROJECT", max_points: 90, weight_pct: 20 }, { code: "FINAL", max_points: 180, weight_pct: 10 }] }
              as: IntegrityOfficer
              captures: { offering_id: $.data.id }
            - call: "POST /integrity/reports"
              payload: { offering_id: "${offering_id}", student_id: "${student_id}", alleged_violation_type: "PLAGIARISM", narrative: "Essay reuses an uncited source.", incident_at: "2026-07-20T00:00:00Z", component_scores: [{ code: "ESSAY", earned_points: 156 }, { code: "MIDTERM", earned_points: 68 }, { code: "PROJECT", earned_points: 56 }, { code: "FINAL", earned_points: 113 }] }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
              captures: { report_id: $.data.id }
            - call: "POST /integrity/evidence-items"
              payload: { report_id: "${report_id}", kind: "SIMILARITY_REPORT", sha256: "1111111111111111111111111111111111111111111111111111111111111111", page_count: 4, similarity_pct: 45.00 }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
              captures: { ev_sim_id: $.data.id }
          trigger:
            - call: "POST /integrity/evidence-items"
              payload: { report_id: "${report_id}", kind: "PROCTOR_LOG", sha256: "6666666666666666666666666666666666666666666666666666666666666666", page_count: 1 }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
              captures: { ev_proctor_id: $.data.id }
            - call: "GET /integrity/reports/${report_id}"
              as: IntegrityOfficer
              captures: { score_after: $.data.evidence_strength_score }
          assert:
            - "IntegrityReport.${report_id}.evidence_strength_score == 81.50 (48.00 similarity + 2.50 page + 16.00 kind-diversity + 15.00 corroboration)"
            - "IntegrityReport.${report_id}.evidence_strength_score != 87.50 (the value produced when the band multiplier is read off the raw 45.00 instead of the allowance-adjusted 40.00)"
            - "IntegrityReport.${report_id}.evidence_complete == true"
            - "before the PROCTOR_LOG was attached the same field read 60.00, so the second attachment moved it by exactly 21.50"
            - "IntegrityReport.${report_id}.status == DRAFT (attaching evidence does not submit the report)"

      - name: adjusted_course_grade_pct_round_components_first_mode_b
        grounds:
          - calculations.adjusted_course_grade_pct
          - entities.Sanction.fields.adjusted_course_grade_pct
          - entities.Sanction.fields.grade_penalty_delta_pct
          - state_machines.Sanction.ACCEPTED_to_IMPOSED
        distinguishing_aspect: |
          MODE (b): the SAME multiplication and addition set produces two different answers
          depending on rounding ORDER. Rounding each component percentage to 2 decimals BEFORE
          weighting gives adjusted_course_grade_pct 47.86 on the canonical fixture; weighting the
          unrounded percentages and rounding only the weighted sum gives 47.87.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z"
            - "an ENGL-201 / 2026FA case on the canonical fixture (baseline_course_grade_pct 79.06), pathway INFORMAL, ALLEGATION_NOTICE sent"
            - "the instructor proposes ladder_rank 2 GRADE_PENALTY_ASSIGNMENT zeroing the ESSAY component (informal band is [1,3])"
            - "the student accepts, so the Sanction is ACCEPTED and the case is INFORMAL_ACCEPTED with decided_at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/departments"
              payload: { code: "ENGL", name: "English", enrolled_student_count: 2000, faculty_headcount: 5 }
              as: IntegrityOfficer
              captures: { dept_engl_id: $.data.id }
            - call: "POST /integrity/faculty-members"
              payload: { department_id: "${dept_engl_id}", full_name: "Rita Reporter", email: "rita@u.edu" }
              as: IntegrityOfficer
              captures: { reporter_id: $.data.id }
            - call: "POST /integrity/faculty-members/${reporter_id}/training-completions"
              payload: { module_code: "AI-101", completed_at: "2026-01-15T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/students"
              payload: { full_name: "Sam Student", email: "sam@u.edu", program_code: "BA-ENG", class_year: 3 }
              as: IntegrityOfficer
              captures: { student_id: $.data.id }
            - call: "POST /integrity/course-offerings"
              payload: { department_id: "${dept_engl_id}", instructor_id: "${reporter_id}", course_code: "ENGL-201", term_code: "2026FA", grade_components: [{ code: "ESSAY", max_points: 200, weight_pct: 40 }, { code: "MIDTERM", max_points: 70, weight_pct: 30 }, { code: "PROJECT", max_points: 90, weight_pct: 20 }, { code: "FINAL", max_points: 180, weight_pct: 10 }] }
              as: IntegrityOfficer
              captures: { offering_id: $.data.id }
            - call: "POST /integrity/reports"
              payload: { offering_id: "${offering_id}", student_id: "${student_id}", alleged_violation_type: "PLAGIARISM", narrative: "Essay reuses an uncited source.", incident_at: "2026-07-20T00:00:00Z", component_scores: [{ code: "ESSAY", earned_points: 156 }, { code: "MIDTERM", earned_points: 68 }, { code: "PROJECT", earned_points: 56 }, { code: "FINAL", earned_points: 113 }] }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
              captures: { report_id: $.data.id }
            - call: "POST /integrity/evidence-items"
              payload: { report_id: "${report_id}", kind: "SIMILARITY_REPORT", sha256: "1111111111111111111111111111111111111111111111111111111111111111", page_count: 4, similarity_pct: 45.00 }
              as: FacultyReporter
