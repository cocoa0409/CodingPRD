          trigger:
            - call: "POST /ppa/credit-support/${ci_first}/post"
              payload: { expected_deal_version: "${deal_v_stale}" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
            - call: "POST /ppa/credit-support/${ci_second}/post"
              payload: { expected_deal_version: "${deal_v_stale}" }
