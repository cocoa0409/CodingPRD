              captures: { rc_id: "$.data.id" }
            - call: "POST /athletics/point-recalculations/${rc_id}/run"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/point-recalculations/${rc_id}/send-communications"
