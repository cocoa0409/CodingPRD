# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 3212 — Touring Arena Show Routing, Venue Settlement & Rigging Logistics
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: tour_create_returns_system_fields_and_defaults
        claim_type: Creation
        grounds: [entities.Tour, endpoints.POST_/tours]
        distinguishing_aspect: "POST /tours returns 201 with PLANNING status, version 1, market_cooldown_days defaulting to 180 when omitted, and computed fields zeroed."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /tours"
              payload: { name: "T", home_base_city: "Tampa", season_start_on: "2026-09-01T00:00:00Z", season_end_on: "2027-06-30T00:00:00Z" }
              as: TourManager
              captures: { tour_id: $.data.id }
          assert:
            - "201 with response_type object"
            - "Tour.${tour_id}.status == PLANNING"
            - "Tour.${tour_id}.version == 1"
            - "Tour.${tour_id}.market_cooldown_days == 180 (default applied)"
            - "Tour.${tour_id}.royalty_reserve_pct == 0.0 (default applied)"
            - "Tour.${tour_id}.total_gross_cents == 0 and open_engagement_count == 0"

      - name: tour_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - "endpoints.GET_/tours/{id}"
          - "errors.ERR_TOUR_NOT_FOUND"
        distinguishing_aspect: "A syntactically valid but unallocated UUID returns ERR_TOUR_NOT_FOUND (404), not a generic 400 or empty body."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /tours/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: TourManager
              captures: { err: $.data.error_id }
          assert:
            - "status == 404 and err == ERR_TOUR_NOT_FOUND"

      - name: venue_create_with_invalid_union_rule_set_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Venue.fields.union_rule_set, errors.ERR_INVALID_REQUEST]
        distinguishing_aspect: "union_rule_set is a closed enum (IATSE|TEAMSTERS|NON_UNION); value 'GUILD' is rejected with 400 ERR_INVALID_REQUEST rather than persisted."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /venues"
              payload: { name: "Bad", market_code: "X", capacity_seats: 1000, load_in_dock_doors: 1, union_rule_set: "GUILD", default_rent_cents: 100, percentage_share_pct: 0.10 }
              as: VenueBooker
              captures: { err: $.data.error_id }
          assert:
            - "status == 400 and err == ERR_INVALID_REQUEST"

      - name: ticket_scales_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - "endpoints.GET_/tours/{tourId}/engagements/{engagementId}/ticket-scales"
          - "response_envelope.pagination_defaults"
        distinguishing_aspect: "With three scales on an engagement, limit=2&offset=0 returns 2 rows + total_count 3 + has_more true; offset=2 returns 1 row + has_more false."
        test_recipe:
          setup: ["Confirmed engagement E1; three TicketScales T1/T2/T3."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tours"
              payload: { name: "T", home_base_city: "Tampa", season_start_on: "2026-09-01T00:00:00Z", season_end_on: "2027-06-30T00:00:00Z", market_cooldown_days: 30, royalty_reserve_pct: 0 }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/open-routing"
              payload: {}
              as: TourManager
            - call: "POST /venues"
              payload: { name: "V", market_code: "DAL", capacity_seats: 10000, load_in_dock_doors: 4, union_rule_set: "NON_UNION", default_rent_cents: 4000000, percentage_share_pct: 0.30 }
              as: VenueBooker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/date-avails"
              payload: { opens_at: "2026-09-10T00:00:00Z", closes_at: "2026-09-15T00:00:00Z", priority_rank: 10 }
              as: VenueBooker
              captures: { avail_id: $.data.id, avail_v: $.data.version }
            - call: "POST /tours/${tour_id}/engagements"
              payload: { venue_id: "${venue_id}", date_avail_id: "${avail_id}", load_in_at: "2026-09-10T08:00:00Z", first_show_at: "2026-09-11T19:00:00Z", load_out_at: "2026-09-13T23:00:00Z", deal_type: "FLAT_RENT", agreed_rent_cents: 4000000, expected_avail_version: "${avail_v}" }
              as: TourManager
              captures: { eng_id: $.data.id }
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/confirm"
              payload: {}
              as: TourManager
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/ticket-scales"
              payload: { tier_label: "A", base_price_cents: 5000, seats_allocated: 100, tier_rank: 1, on_sale_at: "2026-09-01T00:00:00Z" }
              as: BoxOfficeManager
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/ticket-scales"
              payload: { tier_label: "B", base_price_cents: 4000, seats_allocated: 100, tier_rank: 2, on_sale_at: "2026-09-01T00:00:00Z" }
              as: BoxOfficeManager
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/ticket-scales"
              payload: { tier_label: "C", base_price_cents: 3000, seats_allocated: 100, tier_rank: 3, on_sale_at: "2026-09-01T00:00:00Z" }
              as: BoxOfficeManager
          trigger:
            - call: "GET /tours/${tour_id}/engagements/${eng_id}/ticket-scales"
              payload: { limit: 2, offset: 0 }
              as: BoxOfficeManager
          assert:
            - "Returns 2 rows with total_count == 3 and has_more == true"
            - "Same endpoint with limit=2&offset=2 returns 1 row with has_more == false"

  - section: state_machines
    instances:
      - name: rigging_plan_approve_from_draft_returns_plan_not_submitted
        claim_type: invalid_transition
        grounds:
          - "state_machines.RiggingPlan"
          - "errors.ERR_PLAN_NOT_SUBMITTED"
        distinguishing_aspect: "Approve on a DRAFT plan is rejected with ERR_PLAN_NOT_SUBMITTED; the plan remains DRAFT."
        test_recipe:
          setup: ["Confirmed engagement E1 with DRAFT plan P1."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tours"
              payload: { name: "T", home_base_city: "Tampa", season_start_on: "2026-09-01T00:00:00Z", season_end_on: "2027-06-30T00:00:00Z", market_cooldown_days: 30, royalty_reserve_pct: 0 }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/open-routing"
              payload: {}
              as: TourManager
            - call: "POST /venues"
              payload: { name: "V", market_code: "DAL", capacity_seats: 10000, load_in_dock_doors: 4, union_rule_set: "NON_UNION", default_rent_cents: 4000000, percentage_share_pct: 0.30 }
              as: VenueBooker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/date-avails"
              payload: { opens_at: "2026-09-10T00:00:00Z", closes_at: "2026-09-15T00:00:00Z", priority_rank: 10 }
              as: VenueBooker
              captures: { avail_id: $.data.id, avail_v: $.data.version }
            - call: "POST /tours/${tour_id}/engagements"
              payload: { venue_id: "${venue_id}", date_avail_id: "${avail_id}", load_in_at: "2026-09-10T08:00:00Z", first_show_at: "2026-09-11T19:00:00Z", load_out_at: "2026-09-13T23:00:00Z", deal_type: "FLAT_RENT", agreed_rent_cents: 4000000, expected_avail_version: "${avail_v}" }
              as: TourManager
              captures: { eng_id: $.data.id }
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/confirm"
              payload: {}
              as: TourManager
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/rigging-plans"
              payload: {}
              as: ProductionEngineer
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/rigging-plans/${plan_id}/approve"
              payload: {}
              as: ProductionEngineer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PLAN_NOT_SUBMITTED"
            - "RiggingPlan.${plan_id}.status == DRAFT"

      - name: terminal_settlement_paid_accepts_no_further_dispute
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Settlement"
          - "errors.ERR_INVALID_STATE"
        distinguishing_aspect: "PAID is terminal: a dispute call against PAID is rejected with ERR_INVALID_STATE and the Settlement remains PAID."
        test_recipe:
          setup: ["Settlement S1 RECONCILED → mark-paid → PAID."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tours"
              payload: { name: "T", home_base_city: "Tampa", season_start_on: "2026-09-01T00:00:00Z", season_end_on: "2027-06-30T00:00:00Z", market_cooldown_days: 30, royalty_reserve_pct: 0 }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/open-routing"
              payload: {}
              as: TourManager
            - call: "POST /venues"
              payload: { name: "V", market_code: "DAL", capacity_seats: 10000, load_in_dock_doors: 4, union_rule_set: "NON_UNION", default_rent_cents: 4000000, percentage_share_pct: 0.30 }
              as: VenueBooker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/date-avails"
              payload: { opens_at: "2026-09-10T00:00:00Z", closes_at: "2026-09-15T00:00:00Z", priority_rank: 10 }
              as: VenueBooker
              captures: { avail_id: $.data.id, avail_v: $.data.version }
            - call: "POST /tours/${tour_id}/engagements"
              payload: { venue_id: "${venue_id}", date_avail_id: "${avail_id}", load_in_at: "2026-09-10T08:00:00Z", first_show_at: "2026-09-11T19:00:00Z", load_out_at: "2026-09-13T23:00:00Z", deal_type: "FLAT_RENT", agreed_rent_cents: 4000000, expected_avail_version: "${avail_v}" }
              as: TourManager
              captures: { eng_id: $.data.id }
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/confirm"
              payload: {}
              as: TourManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/settlement/reconcile"
              payload: {}
              as: TourManager
              captures: { settle_id: $.data.id, settle_v: $.data.version }
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/settlement/mark-paid"
              payload: { expected_settlement_version: "${settle_v}" }
              as: TourManager
          trigger:
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/settlement/dispute"
              payload: {}
              as: VenueBooker
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (or specific terminal-state error)"
            - "Settlement.${settle_id}.status == PAID"

      - name: engagement_confirm_initial_state_is_hold
        claim_type: Initial State
        grounds:
          - "state_machines.Engagement"
        distinguishing_aspect: "A freshly created Engagement is in HOLD (not CONFIRMED); hold_expires_at is created_at + 72h."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. Tour/Venue/Avail exist; avail OPEN."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tours"
              payload: { name: "T", home_base_city: "Tampa", season_start_on: "2026-09-01T00:00:00Z", season_end_on: "2027-06-30T00:00:00Z", market_cooldown_days: 30, royalty_reserve_pct: 0 }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/open-routing"
              payload: {}
              as: TourManager
            - call: "POST /venues"
              payload: { name: "V", market_code: "DAL", capacity_seats: 10000, load_in_dock_doors: 4, union_rule_set: "NON_UNION", default_rent_cents: 4000000, percentage_share_pct: 0.30 }
              as: VenueBooker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/date-avails"
              payload: { opens_at: "2026-09-10T00:00:00Z", closes_at: "2026-09-15T00:00:00Z", priority_rank: 10 }
              as: VenueBooker
              captures: { avail_id: $.data.id, avail_v: $.data.version }
          trigger:
            - call: "POST /tours/${tour_id}/engagements"
              payload: { venue_id: "${venue_id}", date_avail_id: "${avail_id}", load_in_at: "2026-09-10T08:00:00Z", first_show_at: "2026-09-11T19:00:00Z", load_out_at: "2026-09-13T23:00:00Z", deal_type: "FLAT_RENT", agreed_rent_cents: 4000000, expected_avail_version: "${avail_v}" }
              as: TourManager
              captures: { eng_id: $.data.id }
          assert:
            - "Engagement.${eng_id}.status == HOLD"
            - "Engagement.${eng_id}.hold_expires_at == created_at + 72h"

  - section: calculations
    instances:
      - name: venue_share_flat_rent_ignores_gross
        claim_type: Correct Result
        grounds:
          - "calculations.venue_share_settlement"
        excluded_because:
          difficulty_instance: dual_variant_calc / venue_share_flat_rent_vs_percentage_floor_binds
          rationale: "FLAT_RENT result asserted as the floor-bind branch of the §1.8 instance."

      - name: hold_ttl_expiry_boundary_at_exact_expiry
        claim_type: Correct Result
        grounds:
          - "calculations.hold_ttl_expiry"
          - "errors.ERR_HOLD_EXPIRED"
        distinguishing_aspect: "Setting clock to exactly hold_expires_at (created_at + 72h) triggers expiry (>= semantics); one second before does not."
        test_recipe:
          setup: ["Engagement E1 HOLD created at 2026-09-01T00:00:00Z; hold_expires_at=2026-09-04T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tours"
              payload: { name: "T", home_base_city: "Tampa", season_start_on: "2026-09-01T00:00:00Z", season_end_on: "2027-06-30T00:00:00Z", market_cooldown_days: 30, royalty_reserve_pct: 0 }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/open-routing"
              payload: {}
              as: TourManager
            - call: "POST /venues"
              payload: { name: "V", market_code: "DAL", capacity_seats: 10000, load_in_dock_doors: 4, union_rule_set: "NON_UNION", default_rent_cents: 4000000, percentage_share_pct: 0.30 }
              as: VenueBooker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/date-avails"
              payload: { opens_at: "2026-09-10T00:00:00Z", closes_at: "2026-09-15T00:00:00Z", priority_rank: 10 }
              as: VenueBooker
              captures: { avail_id: $.data.id, avail_v: $.data.version }
            - call: "POST /tours/${tour_id}/engagements"
              payload: { venue_id: "${venue_id}", date_avail_id: "${avail_id}", load_in_at: "2026-09-10T08:00:00Z", first_show_at: "2026-09-11T19:00:00Z", load_out_at: "2026-09-13T23:00:00Z", deal_type: "FLAT_RENT", agreed_rent_cents: 4000000, expected_avail_version: "${avail_v}" }
              as: TourManager
              captures: { eng_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T23:59:59Z" }
              as: PlatformAdmin
            - call: "GET /tours/${tour_id}/engagements/${eng_id}"
              payload: {}
              as: TourManager
              captures: { before_status: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /tours/${tour_id}/engagements/${eng_id}"
              payload: {}
              as: TourManager
              captures: { after_status: $.data.status }
          assert:
            - "before_status == HOLD (one second before expiry)"
            - "after_status == CANCELLED (at exact expiry)"

  - section: validations
    instances:
      - name: engagement_create_missing_agreed_rent_returns_invalid_request
        claim_type: Violation → Error
        grounds:
          - "validations.priority_24_business_constraint"
          - "errors.ERR_INVALID_REQUEST"
        distinguishing_aspect: "agreed_rent_cents is required on POST /engagements; omitting it returns 400 ERR_INVALID_REQUEST before any state or temporal check."
        test_recipe:
          setup: ["Tour T, Venue V, Avail A1 OPEN."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
