            - call: "POST /athletics/student-athletes/${s77_id}/major-declaration"
              payload: { declared_program_id: "${dp77_id}", term_id: "${term1_id}" }
              as: AcademicAdvisor
            - call: "GET /athletics/student-athletes/${s77_id}"
              payload: {}
              as: Registrar
              captures: { s77_v_before: $.data.version }
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s77_id}", course_id: "${kine_id}", term_id: "${term1_id}" }
