              as: RegulatoryAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /sterilization/emission-permits"
              payload: { permit_code: "AP-2026", permit_year: 2026, annual_allowance_kg: 48.0, max_concurrent_eto_cycles: 2 }
              as: RegulatoryAdmin
              captures: { permit_id: $.data.id }
            - call: "POST /sterilization/chambers"
              payload: { permit_id: "${permit_id}", chamber_code: "CH-E1", modality: "ETO", pallet_capacity: 8, turnaround_minutes: 60, abatement_efficiency_pct: 96.0 }
              as: RegulatoryAdmin
              captures: { che1_id: $.data.id }
            - call: "POST /sterilization/cycle-recipes"
