# =============================================================================
# PRD Benchmark Seed Tables
# Task: task_1297_satisfactory_academic_progress_appeal
# =============================================================================

scenario: |
  Satisfactory Academic Progress & Appeal (financial aid SAP committee): quantitative (pace) & qualitative (GPA) evaluation at term end, maximum-timeframe calculation, warning/suspension status assignment, appeal submission with mitigating documentation, academic plan creation & term-by-term monitoring, reinstatement determination, communication cadence to students, audit trail for federal review

domain_name: sap-appeals
api_prefix: /sap

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns: [one_to_many, many_to_many, cross_aggregate]
  role_model: approval_chain
  consistency_model: immediate
  difficulty_target: expert

# =============================================================================
# Table 1: Entity-Relationship Table (flat topology; all links are FK fields)
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique program code (e.g., BS-CSCI); duplicate rejected with ERR_PROGRAM_CODE_CONFLICT" }
      - { name: name, type: string, source: input, description: "Program display name" }
      - { name: required_credits, type: integer, source: input, description: "Published program length in credits; maximum-timeframe cap = floor(required_credits * 1.5)" }
      - { name: min_gpa, type: number, source: input, default: 2.0, description: "Qualitative SAP standard: cumulative GPA must be >= min_gpa (3dp)" }
      - { name: min_pace_pct, type: number, source: input, default: 67.0, description: "Quantitative SAP standard: pace percent must be >= min_pace_pct (2dp)" }
      - { name: appeal_window_days, type: integer, source: input, default: 14, description: "Days from suspension evaluation timestamp during which an appeal may be submitted (deadline inclusive)" }
      - { name: reminder_offset_days, type: array, source: input, default: [7, 13], description: "Days after a suspension evaluation at which appeal-deadline reminder notifications are scheduled" }

  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: student_number, type: string, source: input, description: "Unique student number; duplicate rejected with ERR_STUDENT_NUMBER_CONFLICT" }
      - { name: full_name, type: string, source: input, description: "Student full name" }
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; program of enrollment" }
      - { name: sap_status, type: enum, source: system, description: "GOOD_STANDING | WARNING | SUSPENSION | PROBATION | PLAN_PENDING | PLAN_ACTIVE; initial GOOD_STANDING" }
      - { name: cumulative_attempted_credits, type: integer, source: computed, description: "Sum of attempted_credits over this student's TermEnrollment rows with status IN {POSTED, AMENDED}" }
      - { name: cumulative_earned_credits, type: integer, source: computed, description: "Sum of earned_credits over TermEnrollment rows with status IN {POSTED, AMENDED}" }
      - { name: cumulative_quality_points, type: number, source: computed, description: "Sum of quality_points over TermEnrollment rows with status IN {POSTED, AMENDED}" }
      - { name: cumulative_gpa_hours, type: integer, source: computed, description: "Sum of gpa_hours over TermEnrollment rows with status IN {POSTED, AMENDED}" }
      - { name: cumulative_gpa, type: number, source: computed, description: "round_half_up(cumulative_quality_points / cumulative_gpa_hours, 3); null when cumulative_gpa_hours == 0; NEVER recomposed from rounded per-term GPAs" }
      - { name: pace_pct, type: number, source: computed, description: "round_half_up(100 * cumulative_earned_credits / cumulative_attempted_credits, 2); null when cumulative_attempted_credits == 0" }
      - { name: max_tf_exceeded, type: boolean, source: computed, description: "Maximum-timeframe projection flag from the most recent OFFICIAL SapEvaluation; false until first evaluation" }

  - name: Term
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Term code (e.g., 2026FA)" }
      - { name: seq, type: integer, source: input, description: "Monotonic term ordinal used for academic-plan coverage arithmetic" }
      - { name: start_date, type: string, source: input, description: "ISO date; closed interval start; must be <= end_date (else ERR_INVALID_REQUEST)" }
      - { name: end_date, type: string, source: input, description: "ISO date; closed interval end" }
      - { name: status, type: enum, source: system, description: "OPEN | GRADING_CLOSED | EVALUATED; initial OPEN" }

  - name: TermEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; enrolled student" }
      - { name: term_id, type: string, source: input, description: "FK -> Term.id; enrollment term; term must be OPEN at creation (else ERR_INVALID_STATE)" }
      - { name: attempted_credits, type: integer, source: input, description: "Credits attempted; immutable after creation (amend only adjusts outcome fields)" }
      - { name: earned_credits, type: integer, source: input, description: "Credits earned; set by post, changeable by amend; null while IN_PROGRESS" }
      - { name: quality_points, type: number, source: input, description: "Quality points earned; set by post, changeable by amend; null while IN_PROGRESS" }
      - { name: gpa_hours, type: integer, source: input, description: "GPA-counting hours (pass/fail courses contribute 0); set by post, changeable by amend; null while IN_PROGRESS" }
      - { name: status, type: enum, source: system, description: "IN_PROGRESS | POSTED | AMENDED; initial IN_PROGRESS" }
      - { name: amendment_count, type: integer, source: system, description: "Number of amendments applied; 0 until first amend" }
      - { name: amendment_reason, type: string, source: input, description: "Required on every amend (federal audit); most recent reason retained" }

  - name: SapEvaluation
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; evaluated student" }
      - { name: term_id, type: string, source: system, description: "FK -> Term.id; evaluation term" }
      - { name: status, type: enum, source: system, description: "OFFICIAL | SUPERSEDED; at most one OFFICIAL per (student_id, term_id); amendment-driven re-evaluation supersedes the prior row" }
      - { name: pace_pct, type: number, source: computed, description: "Official cumulative pace snapshot at evaluation (2dp, round_half_up)" }
      - { name: cumulative_gpa, type: number, source: computed, description: "Official cumulative GPA snapshot at evaluation (3dp, round_half_up, raw sums); null when no gpa_hours" }
      - { name: max_tf_headroom_credits, type: integer, source: computed, description: "floor(required_credits * 1.5) - cumulative_attempted_credits at evaluation" }
      - { name: max_tf_exceeded, type: boolean, source: computed, description: "Projection variant: cumulative_attempted + max(0, required_credits - cumulative_earned) > floor(required_credits * 1.5)" }
      - { name: prior_standing, type: enum, source: system, description: "Student.sap_status immediately before this evaluation" }
      - { name: result_standing, type: enum, source: system, description: "Student.sap_status assigned by this evaluation" }
      - { name: appeal_deadline_at, type: datetime, source: computed, description: "evaluated_at + program.appeal_window_days days; appeal submissions accepted while now <= appeal_deadline_at" }
      - { name: evaluated_at, type: datetime, source: system, description: "Logical clock timestamp at evaluation" }

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; appealing student (from X-User-ID)" }
      - { name: sap_evaluation_id, type: string, source: input, description: "FK -> SapEvaluation.id; the OFFICIAL suspension evaluation being appealed; must belong to the caller (ERR_EVALUATION_MISMATCH)" }
      - { name: reason_category, type: enum, source: input, description: "MEDICAL | FAMILY_EMERGENCY | MILITARY | OTHER" }
      - { name: statement, type: string, source: input, description: "Mitigating-circumstances statement" }
      - { name: documents, type: array, source: input, description: "Array of {doc_type, description}; must contain >= 1 element (ERR_APPEAL_DOCS_REQUIRED); resubmit appends" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | MORE_INFO_REQUESTED | APPROVED | DENIED | SUPERSEDED; initial SUBMITTED" }
      - { name: resolution, type: enum, source: input, description: "Required when decision == APPROVED: WITH_PLAN | PROBATION_ONLY; null otherwise" }
      - { name: rationale, type: string, source: input, description: "Committee rationale recorded at decide" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock at submission" }
      - { name: decided_at, type: datetime, source: system, description: "Logical clock at decision; null until decided" }

  - name: AcademicPlan
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; plan student" }
      - { name: appeal_id, type: string, source: input, description: "FK -> Appeal.id; must be an APPROVED appeal with resolution WITH_PLAN (ERR_PLAN_NOT_ALLOWED)" }
      - { name: start_term_id, type: string, source: input, description: "FK -> Term.id; first covered term; seq must be greater than the suspension evaluation's term seq (ERR_CHECKPOINT_TERM_INVALID)" }
      - { name: total_required_credits, type: integer, source: input, description: "Plan credit budget; must equal sum of checkpoints' required_earned_credits (ERR_PLAN_CREDIT_MISMATCH); invariant under revise" }
      - { name: coverage_start_seq, type: integer, source: computed, description: "start term seq (inclusive lower bound of half-open coverage)" }
      - { name: coverage_end_seq_exclusive, type: integer, source: computed, description: "max checkpoint term seq + 1 (exclusive upper bound of half-open coverage)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | COMPLETED | FAILED; initial ACTIVE" }

  - name: PlanCheckpoint
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> AcademicPlan.id; owning plan" }
      - { name: term_id, type: string, source: input, description: "FK -> Term.id; monitored term" }
      - { name: required_term_gpa, type: number, source: input, description: "Term GPA floor; MET requires actual >= required (or actual null); 3dp comparison" }
      - { name: required_term_pace_pct, type: number, source: input, description: "Term pace floor; MET requires actual >= required; 2dp comparison" }
      - { name: required_earned_credits, type: integer, source: input, description: "Term earned-credit floor; MET requires actual >= required" }
      - { name: actual_term_gpa, type: number, source: computed, description: "Term GPA from this term's POSTED|AMENDED enrollments; null when term gpa_hours == 0" }
      - { name: actual_term_pace_pct, type: number, source: computed, description: "Term pace percent (2dp)" }
      - { name: actual_earned_credits, type: integer, source: computed, description: "Term earned credits" }
      - { name: outcome, type: enum, source: system, description: "PENDING | MET | MISSED; initial PENDING" }

  - name: Notification
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; recipient" }
      - { name: kind, type: enum, source: system, description: "STANDING_CHANGE | APPEAL_DEADLINE_REMINDER | APPEAL_DECISION | PLAN_RESULT | REINSTATEMENT" }
      - { name: detail, type: string, source: system, description: "Human-readable summary (e.g., standing transition GOOD_STANDING->WARNING)" }
      - { name: scheduled_at, type: datetime, source: system, description: "Earliest send time; dispatch sends QUEUED rows with scheduled_at <= now" }
      - { name: sent_at, type: datetime, source: system, description: "Set when dispatched; null while QUEUED or CANCELLED" }
      - { name: status, type: enum, source: system, description: "QUEUED | SENT | CANCELLED; initial QUEUED" }

  - name: AuditEvent
    parent: null
    common_fields: false
    fields:
      - { name: actor_role, type: string, source: system, description: "X-User-Role of the mutating call; 'system' for cascade-internal effects is NOT used - events attribute to the triggering call's role" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID of the mutating call" }
      - { name: action, type: string, source: system, description: "One of: PROGRAM_CREATED, TERM_CREATED, TERM_GRADING_CLOSED, TERM_EVALUATED, STUDENT_CREATED, ENROLLMENT_CREATED, ENROLLMENT_POSTED, ENROLLMENT_AMENDED, EVALUATION_POSTED, EVALUATION_SUPERSEDED, STANDING_CHANGED, APPEAL_SUBMITTED, APPEAL_SUPERSEDED, APPEAL_SCREENED, APPEAL_INFO_REQUESTED, APPEAL_RESUBMITTED, APPEAL_DECIDED, PLAN_CREATED, PLAN_REVISED, CHECKPOINT_EVALUATED, PLAN_COMPLETED, PLAN_FAILED, NOTIFICATION_QUEUED, NOTIFICATION_SENT, NOTIFICATION_CANCELLED" }
      - { name: entity_type, type: string, source: system, description: "Entity type of the mutated row (e.g., Student, Appeal); polymorphic reference, NOT an FK" }
      - { name: entity_id, type: string, source: system, description: "Id of the mutated row; polymorphic reference, NOT an FK" }
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; null; affected student for federal-review scoping (null for Program/Term rows)" }
      - { name: before_json, type: string, source: system, description: "JSON snapshot of mutated row before the change (null on creation)" }
      - { name: after_json, type: string, source: system, description: "JSON snapshot of mutated row after the change" }
      - { name: occurred_at, type: datetime, source: system, description: "Logical clock at mutation" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Student
    field: sap_status
    initial_state: GOOD_STANDING
    terminal_states: []
    note: "Cyclic, branching standing machine. Driven by the term evaluation pipeline (POST /sap/terms/{id}/evaluate), amendment-driven re-evaluation, appeal decisions, and plan creation. Notifications and AuditEvents fire per the side effects below; STANDING_CHANGED audit + standing notification only when result_standing != prior_standing, EXCEPT SUSPENSION -> SUSPENSION which re-notifies because a new evaluation carries a new appeal_deadline_at."
    transitions:
      - from: GOOD_STANDING
        to: WARNING
        trigger: "POST /sap/terms/{id}/evaluate or POST /sap/term-enrollments/{id}/amend re-evaluation"
        actor: AidOfficer
        preconditions:
          - "Official metrics fail pace or GPA standard and max_tf_exceeded is false"
        side_effects:
          - "SapEvaluation row created (OFFICIAL) with prior_standing GOOD_STANDING, result_standing WARNING"
          - "Notification kind STANDING_CHANGE scheduled at evaluated_at"
          - "AuditEvent EVALUATION_POSTED, STANDING_CHANGED, NOTIFICATION_QUEUED appended"
      - from: GOOD_STANDING
        to: SUSPENSION
        trigger: "POST /sap/terms/{id}/evaluate or amend re-evaluation (max_tf_exceeded true)"
        actor: AidOfficer
        preconditions:
          - "max_tf_exceeded true (projection variant), regardless of pace/GPA passing"
        side_effects:
          - "SapEvaluation OFFICIAL with result_standing SUSPENSION and appeal_deadline_at = evaluated_at + program.appeal_window_days"
          - "Notification STANDING_CHANGE at evaluated_at plus APPEAL_DEADLINE_REMINDER rows at each program.reminder_offset_days offset"
          - "AuditEvents EVALUATION_POSTED, STANDING_CHANGED, one NOTIFICATION_QUEUED per notification row"
      - from: GOOD_STANDING
        to: GOOD_STANDING
        trigger: "POST /sap/terms/{id}/evaluate (standards met)"
        actor: AidOfficer
        preconditions: ["pace, GPA, and max-timeframe all satisfied"]
        side_effects:
          - "SapEvaluation OFFICIAL created; no STANDING_CHANGED audit, no notification"
      - from: WARNING
        to: GOOD_STANDING
        trigger: "POST /sap/terms/{id}/evaluate or amend re-evaluation (standards met)"
        actor: AidOfficer
        preconditions: ["pace >= min_pace_pct AND cumulative_gpa >= min_gpa AND max_tf_exceeded false"]
        side_effects:
          - "SapEvaluation OFFICIAL; Notification STANDING_CHANGE; AuditEvents EVALUATION_POSTED, STANDING_CHANGED, NOTIFICATION_QUEUED"
      - from: WARNING
        to: SUSPENSION
        trigger: "POST /sap/terms/{id}/evaluate or amend re-evaluation (standards failed)"
        actor: AidOfficer
        preconditions: ["pace or GPA failed, or max_tf_exceeded true"]
        side_effects:
          - "SapEvaluation OFFICIAL with appeal_deadline_at"
          - "Notification STANDING_CHANGE at evaluated_at plus APPEAL_DEADLINE_REMINDER rows at reminder offsets"
          - "AuditEvents EVALUATION_POSTED, STANDING_CHANGED, NOTIFICATION_QUEUED x (1 + len(reminder_offset_days))"
      - from: SUSPENSION
        to: GOOD_STANDING
        trigger: "POST /sap/terms/{id}/evaluate or amend re-evaluation (standards met; reinstatement determination)"
        actor: AidOfficer
        preconditions: ["pace, GPA, and max-timeframe all satisfied"]
        side_effects:
          - "SapEvaluation OFFICIAL; Notification kind REINSTATEMENT at evaluated_at"
          - "AuditEvents EVALUATION_POSTED, STANDING_CHANGED, NOTIFICATION_QUEUED"
      - from: SUSPENSION
        to: SUSPENSION
        trigger: "POST /sap/terms/{id}/evaluate (standards still failed)"
        actor: AidOfficer
        preconditions: ["pace or GPA failed, or max_tf_exceeded true"]
        side_effects:
          - "SapEvaluation OFFICIAL with a NEW appeal_deadline_at"
          - "Notification STANDING_CHANGE + APPEAL_DEADLINE_REMINDER rows re-issued (new window)"
          - "AuditEvents EVALUATION_POSTED, STANDING_CHANGED, NOTIFICATION_QUEUED per row"
      - from: SUSPENSION
        to: PROBATION
        trigger: "POST /sap/appeals/{id}/decide with decision APPROVED, resolution PROBATION_ONLY"
        actor: CommitteeMember
        preconditions: ["appeal UNDER_REVIEW"]
        side_effects:
          - "Appeal.status -> APPROVED; Notification APPEAL_DECISION; AuditEvents APPEAL_DECIDED, STANDING_CHANGED, NOTIFICATION_QUEUED"
      - from: SUSPENSION
        to: PLAN_PENDING
        trigger: "POST /sap/appeals/{id}/decide with decision APPROVED, resolution WITH_PLAN"
        actor: CommitteeMember
        preconditions: ["appeal UNDER_REVIEW"]
        side_effects:
          - "Appeal.status -> APPROVED; Notification APPEAL_DECISION; AuditEvents APPEAL_DECIDED, STANDING_CHANGED, NOTIFICATION_QUEUED"
      - from: PLAN_PENDING
        to: PLAN_ACTIVE
        trigger: "POST /sap/plans (plan created against the approved WITH_PLAN appeal)"
        actor: AidOfficer
        preconditions: ["appeal APPROVED with resolution WITH_PLAN"]
        side_effects:
          - "AcademicPlan ACTIVE + PlanCheckpoint rows (PENDING) created"
          - "AuditEvents PLAN_CREATED, STANDING_CHANGED"
      - from: PROBATION
        to: GOOD_STANDING
        trigger: "POST /sap/terms/{id}/evaluate or amend re-evaluation (standards met)"
        actor: AidOfficer
        preconditions: ["pace, GPA, max-timeframe satisfied"]
        side_effects:
          - "SapEvaluation OFFICIAL; Notification REINSTATEMENT; AuditEvents EVALUATION_POSTED, STANDING_CHANGED, NOTIFICATION_QUEUED"
      - from: PROBATION
        to: SUSPENSION
        trigger: "POST /sap/terms/{id}/evaluate or amend re-evaluation (standards failed)"
        actor: AidOfficer
        preconditions: ["pace or GPA failed, or max_tf_exceeded true"]
        side_effects:
          - "SapEvaluation OFFICIAL with new appeal_deadline_at; STANDING_CHANGE + reminder notifications; audit rows"
      - from: PLAN_ACTIVE
        to: GOOD_STANDING
        trigger: "POST /sap/terms/{id}/evaluate (final checkpoint of plan evaluated MET; reinstatement)"
        actor: AidOfficer
        preconditions: ["checkpoint for this term MET and it is the plan's max-seq checkpoint"]
        side_effects:
          - "PlanCheckpoint outcome MET (actuals written); AcademicPlan -> COMPLETED"
          - "Notifications PLAN_RESULT + REINSTATEMENT; AuditEvents CHECKPOINT_EVALUATED, PLAN_COMPLETED, STANDING_CHANGED, NOTIFICATION_QUEUED x2"
      - from: PLAN_ACTIVE
        to: SUSPENSION
        trigger: "POST /sap/terms/{id}/evaluate (checkpoint MISSED, or plan student not enrolled in a checkpoint term)"
        actor: AidOfficer
        preconditions: ["checkpoint for this term MISSED"]
        side_effects:
          - "PlanCheckpoint outcome MISSED; AcademicPlan -> FAILED"
          - "Notifications PLAN_RESULT + STANDING_CHANGE + APPEAL_DEADLINE_REMINDER rows (new window)"
          - "AuditEvents CHECKPOINT_EVALUATED, PLAN_FAILED, STANDING_CHANGED, NOTIFICATION_QUEUED per row"
      - from: PLAN_ACTIVE
        to: PLAN_ACTIVE
        trigger: "POST /sap/terms/{id}/evaluate (non-final checkpoint MET)"
        actor: AidOfficer
        preconditions: ["checkpoint MET and a later PENDING checkpoint remains"]
        side_effects:
          - "PlanCheckpoint outcome MET; Notification PLAN_RESULT; AuditEvents CHECKPOINT_EVALUATED, NOTIFICATION_QUEUED (no STANDING_CHANGED)"

  - entity: Term
    field: status
    initial_state: OPEN
    terminal_states: [EVALUATED]
    transitions:
      - from: OPEN
        to: GRADING_CLOSED
        trigger: "POST /sap/terms/{id}/close-grading"
        actor: Registrar
        preconditions:
          - "No TermEnrollment rows for this term in status IN_PROGRESS (ERR_ENROLLMENTS_PENDING)"
        side_effects:
          - "AuditEvent TERM_GRADING_CLOSED"
          - "New enrollment creation rejected while GRADING_CLOSED"
      - from: GRADING_CLOSED
        to: EVALUATED
        trigger: "POST /sap/terms/{id}/evaluate"
        actor: AidOfficer
        preconditions: ["term GRADING_CLOSED (ERR_TERM_NOT_READY)"]
        side_effects:
          - "Term evaluation pipeline runs for the sweep set (see calculations.term_evaluation_pipeline)"
          - "Per swept student: SapEvaluation created -> Student.sap_status reassigned -> Notifications queued -> AuditEvents appended (cascade, in this order)"
          - "AuditEvent TERM_EVALUATED"

  - entity: TermEnrollment
    field: status
    initial_state: IN_PROGRESS
    terminal_states: []
    transitions:
      - from: IN_PROGRESS
        to: POSTED
        trigger: "POST /sap/term-enrollments/{id}/post"
        actor: Registrar
        preconditions: ["enrollment IN_PROGRESS (ERR_INVALID_STATE)"]
        side_effects:
          - "earned_credits, quality_points, gpa_hours recorded"
          - "Student cumulative fields recomputed (cumulative_attempted/earned/quality_points/gpa_hours, cumulative_gpa, pace_pct); Student.version incremented"
          - "AuditEvent ENROLLMENT_POSTED"
      - from: POSTED
        to: AMENDED
        trigger: "POST /sap/term-enrollments/{id}/amend"
        actor: Registrar
        preconditions: ["enrollment POSTED or AMENDED (ERR_INVALID_STATE)"]
        side_effects:
          - "Outcome fields replaced; amendment_count += 1; amendment_reason recorded"
          - "Student cumulative fields recomputed (prior values fully reversed, new values applied); Student.version incremented"
          - "If an OFFICIAL SapEvaluation exists for (student, term): it -> SUPERSEDED and the per-student evaluation pipeline re-runs (new OFFICIAL evaluation -> standing reassigned -> notifications -> audit rows)"
          - "AuditEvent ENROLLMENT_AMENDED (plus EVALUATION_SUPERSEDED/EVALUATION_POSTED when the cascade fires)"
      - from: AMENDED
        to: AMENDED
        trigger: "POST /sap/term-enrollments/{id}/amend"
        actor: Registrar
        preconditions: ["enrollment POSTED or AMENDED"]
        side_effects: ["Same as POSTED -> AMENDED (repeat amendments allowed; each appends audit)"]

  - entity: SapEvaluation
    field: status
    initial_state: OFFICIAL
    terminal_states: [SUPERSEDED]
    transitions:
      - from: OFFICIAL
        to: SUPERSEDED
        trigger: "system (amendment of a POSTED/AMENDED enrollment for the same (student, term))"
        actor: system
        preconditions: []
        side_effects:
          - "A replacement OFFICIAL SapEvaluation is created for the same (student, term) from recomputed metrics"
          - "AuditEvent EVALUATION_SUPERSEDED"

  - entity: Appeal
    field: status
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /sap/appeals/{id}/screen"
        actor: AidOfficer
        preconditions: ["appeal SUBMITTED (ERR_INVALID_STATE)"]
        side_effects: ["AuditEvent APPEAL_SCREENED"]
      - from: UNDER_REVIEW
        to: MORE_INFO_REQUESTED
        trigger: "POST /sap/appeals/{id}/request-info"
        actor: AidOfficer
        preconditions: ["appeal UNDER_REVIEW"]
        side_effects: ["AuditEvent APPEAL_INFO_REQUESTED; info_request_note recorded in rationale"]
      - from: MORE_INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /sap/appeals/{id}/resubmit"
        actor: Student
        preconditions: ["appeal MORE_INFO_REQUESTED; caller owns the appeal (ERR_OWNERSHIP_VIOLATION)"]
        side_effects: ["documents appended (>= 1 required); AuditEvent APPEAL_RESUBMITTED"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /sap/appeals/{id}/decide"
        actor: CommitteeMember
        preconditions: ["appeal UNDER_REVIEW (ERR_DECISION_REQUIRES_REVIEW); resolution present and valid (ERR_INVALID_REQUEST)"]
        side_effects:
          - "decided_at set; rationale recorded"
          - "Student.sap_status: SUSPENSION -> PLAN_PENDING when resolution WITH_PLAN; SUSPENSION -> PROBATION when PROBATION_ONLY"
          - "Notification APPEAL_DECISION queued at decided_at"
          - "AuditEvents APPEAL_DECIDED, STANDING_CHANGED, NOTIFICATION_QUEUED"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /sap/appeals/{id}/decide"
        actor: CommitteeMember
        preconditions: ["appeal UNDER_REVIEW"]
        side_effects:
          - "Student.sap_status unchanged (stays SUSPENSION)"
          - "Notification APPEAL_DECISION; AuditEvents APPEAL_DECIDED, NOTIFICATION_QUEUED"
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system (a new POST /sap/appeals for the same student succeeds)"
        actor: system
        preconditions: []
        side_effects: ["AuditEvent APPEAL_SUPERSEDED"]
      - from: MORE_INFO_REQUESTED
        to: SUPERSEDED
        trigger: "system (a new POST /sap/appeals for the same student succeeds)"
        actor: system
        preconditions: []
        side_effects: ["AuditEvent APPEAL_SUPERSEDED"]

  - entity: AcademicPlan
    field: status
    initial_state: ACTIVE
    terminal_states: [COMPLETED, FAILED]
    transitions:
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (term evaluation pipeline: final checkpoint MET)"
        actor: system
        preconditions: ["max-seq checkpoint outcome MET"]
        side_effects: ["Student.sap_status -> GOOD_STANDING; AuditEvent PLAN_COMPLETED"]
      - from: ACTIVE
        to: FAILED
        trigger: "system (term evaluation pipeline: any checkpoint MISSED)"
        actor: system
        preconditions: ["checkpoint for the evaluated term MISSED"]
        side_effects: ["Student.sap_status -> SUSPENSION; AuditEvent PLAN_FAILED"]

  - entity: PlanCheckpoint
    field: outcome
    initial_state: PENDING
    terminal_states: [MET, MISSED]
    transitions:
      - from: PENDING
        to: MET
        trigger: "system (term evaluation pipeline evaluates the checkpoint term)"
        actor: system
        preconditions: ["actual_term_gpa null or >= required_term_gpa; actual_term_pace_pct >= required_term_pace_pct; actual_earned_credits >= required_earned_credits"]
        side_effects: ["actuals written; Notification PLAN_RESULT; AuditEvent CHECKPOINT_EVALUATED"]
      - from: PENDING
        to: MISSED
        trigger: "system (term evaluation pipeline; also when the plan student has no enrollment in the checkpoint term - actuals default to 0)"
        actor: system
        preconditions: ["any of the three checkpoint thresholds failed"]
        side_effects: ["actuals written; plan -> FAILED; Notification PLAN_RESULT; AuditEvent CHECKPOINT_EVALUATED"]

  - entity: Notification
    field: status
    initial_state: QUEUED
    terminal_states: [SENT, CANCELLED]
    transitions:
      - from: QUEUED
        to: SENT
        trigger: "POST /sap/notifications/dispatch (scheduled_at <= now)"
        actor: AidOfficer
        preconditions: ["scheduled_at <= current logical clock"]
        side_effects: ["sent_at set to now; AuditEvent NOTIFICATION_SENT"]
      - from: QUEUED
        to: CANCELLED
        trigger: "POST /sap/notifications/dispatch (obviated APPEAL_DEADLINE_REMINDER)"
        actor: AidOfficer
        preconditions: ["kind == APPEAL_DEADLINE_REMINDER AND (student has an appeal in {SUBMITTED, UNDER_REVIEW, MORE_INFO_REQUESTED, APPROVED} OR student.sap_status != SUSPENSION)"]
        side_effects: ["AuditEvent NOTIFICATION_CANCELLED"]

# =============================================================================
# Concurrency Rules (true races only; OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: appeal-create-stale-student
    parent_entity: Student
    write_endpoint: "POST /sap/appeals"
    occ_field: expected_student_version
    description: |
      Creating an Appeal for a Student whose version has advanced since the
      client last observed it is rejected. Creating an appeal legitimately
      supersedes the student's existing SUBMITTED or MORE_INFO_REQUESTED
      appeal, so a writer holding a stale student version would supersede an
      appeal it never saw; the stale-version check rejects that write.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: pace_calculation
    trigger: "Student cumulative recompute (enrollment post/amend), official evaluation, and GET /sap/students/{id}/sap-preview"
    algorithm: threshold
    formula: |
      OFFICIAL basis set: TermEnrollment rows of the student with status IN {POSTED, AMENDED}.
      pace_pct = round_half_up(100 * SUM(earned_credits) / SUM(attempted_credits), 2)
      null when SUM(attempted_credits) == 0.
      PASS when pace_pct >= program.min_pace_pct (inclusive boundary: exactly 67.00 passes).
    input_set: "POSTED | AMENDED enrollments only (IN_PROGRESS excluded from the official basis)"
    constants:
      ROUNDING: round_half_up
      DECIMALS: 2
    precision: "2 decimal places, round_half_up"
    variants:
      - name: official_cumulative
        when: "Official SapEvaluation rows and the student's stored pace_pct"
        difference: "Uses only POSTED | AMENDED enrollments"
      - name: preview_projected
        when: "GET /sap/students/{id}/sap-preview (advising preview)"
        difference: "Additionally counts every IN_PROGRESS enrollment's attempted_credits as both attempted AND earned (best-case projection); identical inputs therefore produce a higher-or-equal pace than official_cumulative"

  - name: gpa_calculation
    trigger: "Student cumulative recompute (enrollment post/amend), official evaluation, sap-preview"
    algorithm: aggregation
    formula: |
      Basis set: TermEnrollment rows with status IN {POSTED, AMENDED}.
      cumulative_gpa = round_half_up(SUM(quality_points) / SUM(gpa_hours), 3)
      null when SUM(gpa_hours) == 0.
      ROUNDING ORDER PINNED: the cumulative GPA MUST be computed from the raw
      cumulative sums and rounded once at the end. Recomposing from rounded
      per-term GPAs (round each term to 3dp, then credit-weight) is FORBIDDEN:
      e.g. term rows (quality_points 4.6, gpa_hours 3) and (13.9, 9) yield
      raw 18.5/12 -> 1.542, whereas the forbidden recomposition yields 1.541.
      PASS when cumulative_gpa >= program.min_gpa (inclusive: exactly 2.000 passes);
      a null GPA is treated as satisfying the qualitative standard.
    input_set: "POSTED | AMENDED enrollments; pass/fail rows contribute attempted/earned credits but 0 gpa_hours and 0 quality_points"
    constants:
      ROUNDING: round_half_up
      DECIMALS: 3
    precision: "3 decimal places, round_half_up"

  - name: max_timeframe_check
    trigger: "Official evaluation and sap-preview"
    algorithm: threshold
    formula: |
      cap = floor(program.required_credits * 1.5)
      remaining_required = max(0, program.required_credits - cumulative_earned_credits)
      headroom = cap - cumulative_attempted_credits   (stored as max_tf_headroom_credits)
      PROJECTION exceeded when cumulative_attempted_credits + remaining_required > cap
      (strictly greater; attempted == cap with remaining 0 is WITHIN).
    input_set: "Student cumulative fields (POSTED | AMENDED basis) and Program.required_credits"
    constants:
      MAX_TF_MULTIPLIER: 1.5
      CAP_ROUNDING: floor
    precision: "integer credits"
    variants:
      - name: remaining_projection
        when: "Official SapEvaluation.max_tf_exceeded and preview field max_tf_projection_exceeded"
        difference: "Fails a student who can no longer finish within the cap even before reaching it: attempted + remaining_required > cap"
      - name: attempted_only
        when: "Advisory preview field max_tf_attempted_only_exceeded only"
        difference: "Exceeded only when cumulative_attempted_credits > cap; identical inputs produce a strictly weaker (later) failure signal than remaining_projection"

  - name: sap_standing_assignment
    trigger: "Per swept student inside term_evaluation_pipeline (after metrics and any plan checkpoint)"
    algorithm: constraint_propagation
    formula: |
      Inputs: pace_ok (pace >= min_pace_pct), gpa_ok (gpa null OR gpa >= min_gpa),
              max_tf_exceeded (projection variant), prior sap_status,
              checkpoint_outcome (when an ACTIVE plan has a PENDING checkpoint for this term).
      Order of evaluation (non-linear interaction, pinned):
        1. If an ACTIVE plan has a checkpoint for this term:
             MISSED          -> SUSPENSION (regardless of pace_ok/gpa_ok/max_tf)
             MET, final      -> GOOD_STANDING
             MET, non-final  -> PLAN_ACTIVE (unchanged)
        2. Else if max_tf_exceeded: SUSPENSION (overrides prior standing; no WARNING grace)
        3. Else if pace_ok AND gpa_ok: GOOD_STANDING (from any prior standing; this is reinstatement)
        4. Else: GOOD_STANDING -> WARNING; WARNING -> SUSPENSION; SUSPENSION -> SUSPENSION;
                 PROBATION -> SUSPENSION; PLAN_PENDING -> PLAN_PENDING (unchanged).
    input_set: "Student standing + official metrics + plan checkpoint outcome"
    constants: {}
    precision: "n/a (discrete assignment)"

  - name: term_evaluation_pipeline
    trigger: "POST /sap/terms/{id}/evaluate (whole term) and POST /sap/term-enrollments/{id}/amend (single student re-run)"
    algorithm: chronological
    formula: |
      Sweep set S = { students with >= 1 enrollment in this term with status IN {POSTED, AMENDED} }
                    UNION { students with an ACTIVE AcademicPlan that has a PENDING checkpoint whose term_id == this term }.
      Processing order: student.created_at ASC (deterministic; never use id).
      For each student in S, IN THIS PINNED ORDER (circular-looking dependency resolved):
        1. Recompute cumulative metrics from POSTED | AMENDED enrollments (pace_calculation
           official_cumulative, gpa_calculation, max_timeframe_check remaining_projection).
        2. If an ACTIVE plan has a PENDING checkpoint for this term: compute term metrics
           (this term's POSTED | AMENDED rows only), evaluate the checkpoint
           (plan_checkpoint_evaluation), write actuals + outcome.
        3. Derive plan status (MISSED -> FAILED; MET on max-seq checkpoint -> COMPLETED).
        4. Assign standing via sap_standing_assignment (which consumes step 2/3 results).
        5. Queue notifications per notification_cadence; append AuditEvents.
      A plan student with NO enrollment in a checkpoint term is still swept: term metrics
      default to 0 earned / 0 attempted / null gpa, so the checkpoint evaluates MISSED.
      One OFFICIAL evaluation per (student, term): a re-run SUPERSEDES the prior OFFICIAL row.
    input_set: "Term + sweep set as defined above"
    constants: {}
    precision: "n/a"

  - name: plan_checkpoint_evaluation
    trigger: "Step 2 of term_evaluation_pipeline"
    algorithm: threshold
    formula: |
      term_attempted = SUM(attempted_credits) over this term's POSTED | AMENDED enrollments
      term_earned    = SUM(earned_credits) over the same set
      term_gpa       = round_half_up(SUM(quality_points) / SUM(gpa_hours), 3); null when SUM(gpa_hours) == 0
      term_pace_pct  = round_half_up(100 * term_earned / term_attempted, 2); null when term_attempted == 0
      MET iff (term_gpa IS NULL OR term_gpa >= required_term_gpa)
              AND (term_pace_pct IS NOT NULL AND term_pace_pct >= required_term_pace_pct)
              AND term_earned >= required_earned_credits
      otherwise MISSED. All three comparisons are INCLUSIVE (actual == required is MET).
    input_set: "Single PlanCheckpoint + the student's enrollments in the checkpoint term"
    constants:
      ROUNDING: round_half_up
    precision: "gpa 3dp; pace 2dp"

  - name: notification_cadence
    trigger: "Standing assignment (step 5 of pipeline), appeal decide, checkpoint evaluation, dispatch sweep"
    algorithm: chronological
    formula: |
      On standing assignment:
        result != prior AND result == SUSPENSION:
          queue STANDING_CHANGE at evaluated_at; queue one APPEAL_DEADLINE_REMINDER per
          program.reminder_offset_days entry at evaluated_at + offset days.
        result != prior AND result == GOOD_STANDING AND prior IN {SUSPENSION, PROBATION, PLAN_ACTIVE}:
          queue REINSTATEMENT at evaluated_at.
        result != prior (all other cases): queue STANDING_CHANGE at evaluated_at.
        result == prior: nothing (no notification, no STANDING_CHANGED audit).
      On appeal decide: queue APPEAL_DECISION at decided_at.
      On checkpoint evaluation: queue PLAN_RESULT at evaluated_at.
      Dispatch sweep (POST /sap/notifications/dispatch), in scheduled_at ASC order:
        SEND every QUEUED row with scheduled_at <= now (sent_at = now);
        CANCEL every QUEUED APPEAL_DEADLINE_REMINDER whose student has an appeal in
          {SUBMITTED, UNDER_REVIEW, MORE_INFO_REQUESTED, APPROVED} OR whose
          student.sap_status != SUSPENSION.
      Response: { sent_count, cancelled_count }.
    input_set: "Notification rows (QUEUED), student's appeals, student.sap_status"
    constants: {}
    precision: "ISO8601 timestamps, second precision"

  - name: plan_credit_budget_invariant
    trigger: "POST /sap/plans and POST /sap/plans/{id}/revise"
    algorithm: aggregation
    formula: |
      INVARIANT: plan.total_required_credits == SUM(checkpoints.required_earned_credits)
      checked at creation and after every revise; a revise whose checkpoint list sums to a
      different total is rejected (ERR_PLAN_CREDIT_MISMATCH) and the plan is unchanged.
      Revise replaces the whole checkpoint list and is allowed only while EVERY existing
      checkpoint is PENDING (else ERR_INVALID_STATE); coverage bounds recompute from the
      replacement list.
    input_set: "AcademicPlan + its PlanCheckpoint rows"
    constants: {}
    precision: "integer credits"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Caller role is in the endpoint's roles list", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path ids and body-referenced ids (program_id, student_id, term_id, sap_evaluation_id, appeal_id, start_term_id, checkpoint term_ids) exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all resource endpoints" }
  - { priority: 4, category: auth, check: "Role Student may only act on rows whose student_id == X-User-ID (own student record, own appeals, own preview; list endpoints force student_id = caller)", error_id: ERR_OWNERSHIP_VIOLATION, http_status: 403, applies_to: "student-scoped endpoints: GET /sap/students/{id}, GET /sap/students/{id}/sap-preview, POST /sap/appeals, POST /sap/appeals/{id}/resubmit, GET single-row endpoints when role is Student" }
  - { priority: 5, category: state, check: "OCC: expected_student_version equals the student's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /sap/appeals" }
  - { priority: 6, category: state, check: "Target resource is in a valid from-state for the transition (covers appeal decide on DENIED/APPROVED/SUPERSEDED, screen/resubmit from wrong state, enrollment post/amend from wrong state, evaluate on EVALUATED term, revise on non-ACTIVE plan or with evaluated checkpoints, enrollment creation on a non-OPEN term)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "state transition endpoints" }
  - { priority: 7, category: state, check: "Term is GRADING_CLOSED for evaluation", error_id: ERR_TERM_NOT_READY, http_status: 409, applies_to: "POST /sap/terms/{id}/evaluate" }
  - { priority: 8, category: state, check: "No IN_PROGRESS enrollments remain in the term", error_id: ERR_ENROLLMENTS_PENDING, http_status: 409, applies_to: "POST /sap/terms/{id}/close-grading" }
  - { priority: 9, category: state, check: "Appeal submission requires student.sap_status == SUSPENSION", error_id: ERR_STUDENT_NOT_SUSPENDED, http_status: 409, applies_to: "POST /sap/appeals" }
  - { priority: 10, category: state, check: "No existing appeal in UNDER_REVIEW for the student (SUBMITTED/MORE_INFO_REQUESTED are superseded instead)", error_id: ERR_APPEAL_UNDER_REVIEW, http_status: 409, applies_to: "POST /sap/appeals" }
  - { priority: 11, category: state, check: "Appeal decide requires status UNDER_REVIEW", error_id: ERR_DECISION_REQUIRES_REVIEW, http_status: 409, applies_to: "POST /sap/appeals/{id}/decide" }
  - { priority: 12, category: state, check: "Plan creation requires the referenced appeal APPROVED with resolution WITH_PLAN and student.sap_status == PLAN_PENDING", error_id: ERR_PLAN_NOT_ALLOWED, http_status: 409, applies_to: "POST /sap/plans" }
  - { priority: 13, category: business_temporal, check: "Appeal submission while now <= referenced evaluation's appeal_deadline_at (deadline inclusive)", error_id: ERR_APPEAL_WINDOW_CLOSED, http_status: 409, applies_to: "POST /sap/appeals" }
  - { priority: 14, category: business_constraint, check: "Appeal/resubmit documents array contains >= 1 element", error_id: ERR_APPEAL_DOCS_REQUIRED, http_status: 422, applies_to: "POST /sap/appeals, POST /sap/appeals/{id}/resubmit" }
  - { priority: 15, category: business_constraint, check: "Term date range does not intersect any existing term's [start_date, end_date] under CLOSED-interval semantics (touching endpoints count as overlap)", error_id: ERR_TERM_DATE_OVERLAP, http_status: 409, applies_to: "POST /sap/terms" }
  - { priority: 16, category: business_constraint, check: "Plan half-open coverage [coverage_start_seq, coverage_end_seq_exclusive) does not intersect the coverage of ANY other plan of the same student (any status; adjacency is allowed)", error_id: ERR_PLAN_TERM_OVERLAP, http_status: 409, applies_to: "POST /sap/plans" }
  - { priority: 17, category: business_constraint, check: "total_required_credits == SUM(checkpoints.required_earned_credits)", error_id: ERR_PLAN_CREDIT_MISMATCH, http_status: 422, applies_to: "POST /sap/plans, POST /sap/plans/{id}/revise" }
  - { priority: 18, category: business_constraint, check: "Checkpoint terms: contiguous seqs starting at start_term.seq; start_term.seq strictly greater than the suspension evaluation's term seq; each checkpoint term exists", error_id: ERR_CHECKPOINT_TERM_INVALID, http_status: 422, applies_to: "POST /sap/plans, POST /sap/plans/{id}/revise" }
  - { priority: 19, category: business_constraint, check: "Program code unique", error_id: ERR_PROGRAM_CODE_CONFLICT, http_status: 409, applies_to: "POST /sap/programs" }
  - { priority: 20, category: business_constraint, check: "Student number unique", error_id: ERR_STUDENT_NUMBER_CONFLICT, http_status: 409, applies_to: "POST /sap/students" }
  - { priority: 21, category: business_referential, check: "sap_evaluation_id references an OFFICIAL evaluation belonging to the calling student with result_standing == SUSPENSION", error_id: ERR_EVALUATION_MISMATCH, http_status: 409, applies_to: "POST /sap/appeals" }
  - { priority: 22, category: business_constraint, check: "Well-formed body: required fields present, enums valid, dates valid (start_date <= end_date), decide APPROVED carries resolution, amend carries amendment_reason, clock target >= current clock", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }

# =============================================================================
# Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/sap/programs", description: "Create a program (SAP policy thresholds)", roles: [Registrar], code: 201, input: [code, name, required_credits, "min_gpa?", "min_pace_pct?", "appeal_window_days?", "reminder_offset_days?"], output: Program, side_effects: ["AuditEvent PROGRAM_CREATED"] }
  - { method: GET, path: "/sap/programs/{id}", description: "Read a program", roles: [Student, Registrar, AidOfficer, CommitteeMember, Auditor, AidAdministrator], code: 200, input: [], output: Program, side_effects: [] }

  - { method: POST, path: "/sap/terms", description: "Create a term; closed-interval date overlap with any existing term is rejected (ERR_TERM_DATE_OVERLAP)", roles: [Registrar], code: 201, input: [code, seq, start_date, end_date], output: Term, side_effects: ["status OPEN", "AuditEvent TERM_CREATED"] }
  - { method: GET, path: "/sap/terms/{id}", description: "Read a term", roles: [Student, Registrar, AidOfficer, CommitteeMember, Auditor, AidAdministrator], code: 200, input: [], output: Term, side_effects: [] }
  - { method: POST, path: "/sap/terms/{id}/close-grading", description: "Close grading for a term; requires zero IN_PROGRESS enrollments (ERR_ENROLLMENTS_PENDING)", roles: [Registrar], code: 200, input: [], output: Term, side_effects: ["status GRADING_CLOSED", "AuditEvent TERM_GRADING_CLOSED"] }
  - { method: POST, path: "/sap/terms/{id}/evaluate", description: "Run the SAP evaluation pipeline for the term's sweep set (students with POSTED|AMENDED enrollments in the term, plus ACTIVE-plan students with a PENDING checkpoint for the term); requires GRADING_CLOSED (ERR_TERM_NOT_READY); one run per term (repeat -> ERR_INVALID_STATE)", roles: [AidOfficer], code: 200, input: [], output: { evaluated_count: integer, good_standing_count: integer, warning_count: integer, suspension_count: integer }, side_effects: ["per swept student: SapEvaluation OFFICIAL created -> standing assigned -> notifications queued -> audit rows", "term -> EVALUATED", "AuditEvent TERM_EVALUATED"] }

  - { method: POST, path: "/sap/students", description: "Create a student in a program; starts GOOD_STANDING with zeroed cumulatives; computed/system fields in the body are ignored", roles: [Registrar], code: 201, input: [student_number, full_name, program_id], output: Student, side_effects: ["AuditEvent STUDENT_CREATED"] }
  - { method: GET, path: "/sap/students/{id}", description: "Read a student (Student role: own record only)", roles: [Student, Registrar, AidOfficer, CommitteeMember, Auditor, AidAdministrator], code: 200, input: [], output: Student, side_effects: [] }
  - { method: GET, path: "/sap/students", description: "List students with filters and pagination (role Student is force-scoped to own record)", roles: [Student, Registrar, AidOfficer, CommitteeMember, Auditor, AidAdministrator], code: 200, input: ["program_id?", "sap_status?", "limit?", "offset?"], output: "Student[]", side_effects: [] }
  - { method: GET, path: "/sap/students/{id}/sap-preview", description: "Advising preview: provisional metrics on current data; returns BOTH pace bases and BOTH max-timeframe variants", roles: [Student, AidOfficer], code: 200, input: [], output: { pace_pct_official_basis: "number|null", pace_pct_projected: "number|null", cumulative_gpa: "number|null", max_tf_attempted_only_exceeded: boolean, max_tf_projection_exceeded: boolean }, side_effects: [] }

  - { method: POST, path: "/sap/term-enrollments", description: "Create an IN_PROGRESS enrollment; term must be OPEN", roles: [Registrar], code: 201, input: [student_id, term_id, attempted_credits], output: TermEnrollment, side_effects: ["AuditEvent ENROLLMENT_CREATED"] }
  - { method: GET, path: "/sap/term-enrollments/{id}", description: "Read an enrollment", roles: [Student, Registrar, AidOfficer, CommitteeMember, Auditor, AidAdministrator], code: 200, input: [], output: TermEnrollment, side_effects: [] }
  - { method: GET, path: "/sap/term-enrollments", description: "List enrollments (filtered)", roles: [Student, Registrar, AidOfficer, CommitteeMember, Auditor, AidAdministrator], code: 200, input: ["student_id?", "term_id?", "status?", "limit?", "offset?"], output: "TermEnrollment[]", side_effects: [] }
  - { method: POST, path: "/sap/term-enrollments/{id}/post", description: "Post final grades for an enrollment (IN_PROGRESS -> POSTED)", roles: [Registrar], code: 200, input: [earned_credits, quality_points, gpa_hours], output: TermEnrollment, side_effects: ["Student cumulative fields recomputed; Student.version incremented", "AuditEvent ENROLLMENT_POSTED"] }
  - { method: POST, path: "/sap/term-enrollments/{id}/amend", description: "Amend posted outcome fields (POSTED|AMENDED -> AMENDED); reverses old values and applies new ones; triggers per-student re-evaluation when an OFFICIAL evaluation exists for (student, term)", roles: [Registrar], code: 200, input: [earned_credits, quality_points, gpa_hours, amendment_reason], output: TermEnrollment, side_effects: ["Student cumulatives recomputed; Student.version incremented", "OFFICIAL SapEvaluation SUPERSEDED + pipeline re-run when applicable", "AuditEvent ENROLLMENT_AMENDED (+ EVALUATION_SUPERSEDED/EVALUATION_POSTED)"] }

  - { method: GET, path: "/sap/evaluations/{id}", description: "Read an evaluation", roles: [Student, Registrar, AidOfficer, CommitteeMember, Auditor, AidAdministrator], code: 200, input: [], output: SapEvaluation, side_effects: [] }
  - { method: GET, path: "/sap/evaluations", description: "List evaluations (filtered)", roles: [Student, Registrar, AidOfficer, CommitteeMember, Auditor, AidAdministrator], code: 200, input: ["student_id?", "term_id?", "status?", "result_standing?", "limit?", "offset?"], output: "SapEvaluation[]", side_effects: [] }

  - { method: POST, path: "/sap/appeals", description: "Submit a SAP appeal against an OFFICIAL suspension evaluation; OCC via expected_student_version; supersedes the student's existing SUBMITTED/MORE_INFO_REQUESTED appeal", roles: [Student], code: 201, input: [sap_evaluation_id, reason_category, statement, documents, expected_student_version], output: Appeal, side_effects: ["Student.version incremented by 1", "existing SUBMITTED|MORE_INFO_REQUESTED appeal -> SUPERSEDED", "AuditEvents APPEAL_SUBMITTED (+ APPEAL_SUPERSEDED)"] }
  - { method: GET, path: "/sap/appeals/{id}", description: "Read an appeal", roles: [Student, Registrar, AidOfficer, CommitteeMember, Auditor, AidAdministrator], code: 200, input: [], output: Appeal, side_effects: [] }
  - { method: GET, path: "/sap/appeals", description: "List appeals (filtered)", roles: [Student, Registrar, AidOfficer, CommitteeMember, Auditor, AidAdministrator], code: 200, input: ["student_id?", "sap_evaluation_id?", "status?", "limit?", "offset?"], output: "Appeal[]", side_effects: [] }
  - { method: POST, path: "/sap/appeals/{id}/screen", description: "Screen a submitted appeal (SUBMITTED -> UNDER_REVIEW)", roles: [AidOfficer], code: 200, input: [], output: Appeal, side_effects: ["AuditEvent APPEAL_SCREENED"] }
  - { method: POST, path: "/sap/appeals/{id}/request-info", description: "Request additional documentation (UNDER_REVIEW -> MORE_INFO_REQUESTED)", roles: [AidOfficer], code: 200, input: [info_request_note], output: Appeal, side_effects: ["AuditEvent APPEAL_INFO_REQUESTED"] }
  - { method: POST, path: "/sap/appeals/{id}/resubmit", description: "Resubmit with additional documentation (MORE_INFO_REQUESTED -> SUBMITTED); owner only", roles: [Student], code: 200, input: [documents, "statement?"], output: Appeal, side_effects: ["documents appended", "AuditEvent APPEAL_RESUBMITTED"] }
  - { method: POST, path: "/sap/appeals/{id}/decide", description: "Committee decision (UNDER_REVIEW -> APPROVED | DENIED); APPROVED requires resolution; cascades to student standing, notification, audit", roles: [CommitteeMember], code: 200, input: [decision, "resolution?", rationale], output: Appeal, side_effects: ["Student.sap_status -> PLAN_PENDING (WITH_PLAN) or PROBATION (PROBATION_ONLY); DENIED leaves SUSPENSION", "Notification APPEAL_DECISION queued", "AuditEvents APPEAL_DECIDED, STANDING_CHANGED (on change), NOTIFICATION_QUEUED"] }

  - { method: POST, path: "/sap/plans", description: "Create an academic plan for an APPROVED WITH_PLAN appeal; checkpoints must be contiguous from start_term; coverage must not overlap any other plan of the student; credit budget must balance", roles: [AidOfficer], code: 201, input: [student_id, appeal_id, start_term_id, total_required_credits, checkpoints], output: AcademicPlan, side_effects: ["PlanCheckpoint rows created PENDING", "Student.sap_status PLAN_PENDING -> PLAN_ACTIVE", "AuditEvents PLAN_CREATED, STANDING_CHANGED"] }
  - { method: GET, path: "/sap/plans/{id}", description: "Read a plan", roles: [Student, Registrar, AidOfficer, CommitteeMember, Auditor, AidAdministrator], code: 200, input: [], output: AcademicPlan, side_effects: [] }
  - { method: GET, path: "/sap/plans", description: "List plans (filtered)", roles: [Student, Registrar, AidOfficer, CommitteeMember, Auditor, AidAdministrator], code: 200, input: ["student_id?", "appeal_id?", "start_term_id?", "status?", "limit?", "offset?"], output: "AcademicPlan[]", side_effects: [] }
  - { method: POST, path: "/sap/plans/{id}/revise", description: "Replace the checkpoint list of an ACTIVE plan whose checkpoints are all PENDING; total_required_credits must still balance (plan_credit_budget_invariant)", roles: [AidOfficer], code: 200, input: [checkpoints], output: AcademicPlan, side_effects: ["PlanCheckpoint rows replaced", "coverage bounds recomputed", "AuditEvent PLAN_REVISED"] }

  - { method: GET, path: "/sap/checkpoints/{id}", description: "Read a checkpoint", roles: [Student, Registrar, AidOfficer, CommitteeMember, Auditor, AidAdministrator], code: 200, input: [], output: PlanCheckpoint, side_effects: [] }
  - { method: GET, path: "/sap/checkpoints", description: "List checkpoints (filtered)", roles: [Student, Registrar, AidOfficer, CommitteeMember, Auditor, AidAdministrator], code: 200, input: ["plan_id?", "term_id?", "outcome?", "limit?", "offset?"], output: "PlanCheckpoint[]", side_effects: [] }

  - { method: GET, path: "/sap/notifications/{id}", description: "Read a notification", roles: [Student, Registrar, AidOfficer, CommitteeMember, Auditor, AidAdministrator], code: 200, input: [], output: Notification, side_effects: [] }
  - { method: GET, path: "/sap/notifications", description: "List notifications (filtered)", roles: [Student, Registrar, AidOfficer, CommitteeMember, Auditor, AidAdministrator], code: 200, input: ["student_id?", "kind?", "status?", "limit?", "offset?"], output: "Notification[]", side_effects: [] }
  - { method: POST, path: "/sap/notifications/dispatch", description: "Communication sweep: send due QUEUED notifications (scheduled_at <= now, scheduled_at ASC), cancel obviated APPEAL_DEADLINE_REMINDER rows per notification_cadence", roles: [AidOfficer], code: 200, input: [], output: { sent_count: integer, cancelled_count: integer }, side_effects: ["QUEUED due -> SENT (sent_at = now)", "obviated reminders -> CANCELLED", "AuditEvents NOTIFICATION_SENT / NOTIFICATION_CANCELLED"] }

  - { method: GET, path: "/sap/audit-events/{id}", description: "Read one audit event (federal review)", roles: [Auditor, AidAdministrator], code: 200, input: [], output: AuditEvent, side_effects: [] }
  - { method: GET, path: "/sap/audit-events", description: "List audit events (filtered; append-only, no mutation endpoints exist)", roles: [Auditor, AidAdministrator], code: 200, input: ["student_id?", "entity_type?", "entity_id?", "action?", "limit?", "offset?"], output: "AuditEvent[]", side_effects: [] }

  - { method: POST, path: "/sap/_clock/set_current_utc", description: "Test-driving endpoint: set the logical clock. Server startup default is exactly 2026-08-01T00:00:00Z (never wall-clock). Target must be >= current logical time (ERR_INVALID_REQUEST otherwise).", roles: [AidAdministrator], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: [] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Caller role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_OWNERSHIP_VIOLATION, http: 403, condition: "Student role acting on another student's resources" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, invalid enum/date, APPROVED decision without resolution, amend without amendment_reason, non-monotonic clock set" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid from-state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_student_version does not match the student's current version (OCC)" }
  - { id: ERR_TERM_NOT_READY, http: 409, condition: "Evaluation requested for a term not in GRADING_CLOSED" }
  - { id: ERR_ENROLLMENTS_PENDING, http: 409, condition: "close-grading requested while IN_PROGRESS enrollments remain in the term" }
  - { id: ERR_STUDENT_NOT_SUSPENDED, http: 409, condition: "Appeal submission requires current standing SUSPENSION" }
  - { id: ERR_APPEAL_UNDER_REVIEW, http: 409, condition: "A new appeal cannot be created while one is UNDER_REVIEW" }
  - { id: ERR_DECISION_REQUIRES_REVIEW, http: 409, condition: "Appeal decision requires status UNDER_REVIEW" }
  - { id: ERR_PLAN_NOT_ALLOWED, http: 409, condition: "Plan requires an APPROVED WITH_PLAN appeal and standing PLAN_PENDING" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 409, condition: "now > appeal_deadline_at of the referenced evaluation" }
  - { id: ERR_APPEAL_DOCS_REQUIRED, http: 422, condition: "Appeal or resubmit carries zero documents" }
  - { id: ERR_TERM_DATE_OVERLAP, http: 409, condition: "Term date range intersects an existing term (closed intervals; touching counts)" }
  - { id: ERR_PLAN_TERM_OVERLAP, http: 409, condition: "Plan half-open term coverage intersects another plan of the same student" }
  - { id: ERR_PLAN_CREDIT_MISMATCH, http: 422, condition: "Checkpoint credits do not sum to total_required_credits" }
  - { id: ERR_CHECKPOINT_TERM_INVALID, http: 422, condition: "Checkpoint terms non-contiguous, or start term not after the suspension term" }
  - { id: ERR_PROGRAM_CODE_CONFLICT, http: 409, condition: "Duplicate program code" }
  - { id: ERR_STUDENT_NUMBER_CONFLICT, http: 409, condition: "Duplicate student number" }
  - { id: ERR_EVALUATION_MISMATCH, http: 409, condition: "sap_evaluation_id not an OFFICIAL SUSPENSION evaluation of the calling student" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: Student
    description: "Aid recipient; acts only on own records"
    identity: "entity_backed:Student"
    exclusive_operations: ["POST /sap/appeals", "POST /sap/appeals/{id}/resubmit"]
    shared_operations: ["GET own student record and sap-preview", "GET own appeals/plans/checkpoints/evaluations/notifications/enrollments"]
  - name: Registrar
    description: "Registrar operator; owns programs, terms, enrollments, grade posting and amendment"
    identity: opaque
    exclusive_operations: ["POST /sap/programs", "POST /sap/terms", "POST /sap/terms/{id}/close-grading", "POST /sap/students", "POST /sap/term-enrollments", "POST /sap/term-enrollments/{id}/post", "POST /sap/term-enrollments/{id}/amend"]
    shared_operations: ["GET endpoints except audit-events"]
  - name: AidOfficer
    description: "Financial aid officer; runs evaluations, screens appeals, manages plans, dispatches communications"
    identity: opaque
    exclusive_operations: ["POST /sap/terms/{id}/evaluate", "POST /sap/appeals/{id}/screen", "POST /sap/appeals/{id}/request-info", "POST /sap/plans", "POST /sap/plans/{id}/revise", "POST /sap/notifications/dispatch"]
    shared_operations: ["GET endpoints except audit-events"]
  - name: CommitteeMember
    description: "SAP committee member; decides appeals under review (approval chain final step)"
    identity: opaque
    exclusive_operations: ["POST /sap/appeals/{id}/decide"]
    shared_operations: ["GET endpoints except audit-events"]
  - name: Auditor
    description: "Federal reviewer; read-only, including the audit trail"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["All GET endpoints including /sap/audit-events"]
  - name: AidAdministrator
    description: "Aid office administrator; audit-trail access and logical clock control"
    identity: opaque
    exclusive_operations: ["POST /sap/_clock/set_current_utc"]
    shared_operations: ["All GET endpoints including /sap/audit-events"]
