            - "the UNBALANCED_INCLUSIVE run replaying ${sv1} -> 412 with data.error_id == ERR_STALE_SERIES_VERSION, even though no BALANCED_CORE row would have been superseded by it"
            - "that 412 wrote nothing: the analyses list contains exactly one row after it, series.version is still ${sv2}, and status is still ANALYZED"
            - "the third call, a BALANCED_CORE re-run with ${sv2} -> 201; AnalysisRun ${an1}.is_superseded == true, ${an3}.is_superseded == false"
            - "the analyses list ends at total_count == 2, both BALANCED_CORE, and series.version == ${sv2} + 1"
            - "BreedingLine.${line_a}.advancement_index_provisional == 104.55 after each accepted run and was not disturbed by the refused one"

      - name: line_discard_four_level_cascade_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines.BreedingLine.pipeline_stage[to_DISCARDED]
        excluded_because:
          difficulty_instance: transitive_cascade / line_discard_cascades_entries_sites_program_lots_and_backcross
          rationale: "That §1.8 instance already walks the L1-L4 chain in order and asserts the intermediate levels, including the ordering sensitivity between the entry invalidation and the site posture re-derivation."

      - name: both_index_variants_produce_their_own_result_and_delta
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.line_advancement_index.variants
        excluded_because:
          difficulty_instance: dual_variant / provisional_and_cumulative_indices_diverge_then_reconcile
          rationale: "Divergence, per-context selection and the reconciliation delta onto the decision row are the whole subject of that §1.8 instance."

      - name: site_posture_thresholds_at_their_boundaries_and_on_reset
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
          - calculations.site_utilisation_ratio
        excluded_because:
          difficulty_instance: rate_threshold / site_utilisation_posture_flips_at_the_exact_boundaries_and_back
          rationale: "That §1.8 instance drives utilisation to exactly 0.75 and exactly 0.95, one plot either side of each, and back down through a withdrawal, which is the boundary-and-reset triple this row asks for."

  - section: consistency_model
    instances:
      - name: every_derived_field_is_current_in_the_response_that_caused_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.entry_yield_rollup
          - calculations.site_utilisation_ratio
          - calculations.trial_cost_allocation
        distinguishing_aspect: "The scaffold declares immediate consistency, so no derived value may need a second read to become correct: the finalize response itself must already carry the rollup, and the counters on three different ancestor entities - series, site and program - must read the post-write values on a GET issued immediately afterwards, with no retry, no polling and no drift between the action body and the re-read."
        test_recipe:
          setup:
            - "One program (5000 plots, 2000000.00 USD), one objective, lines SX-1001 and SX-1002."
            - "One site with total_plot_capacity 100 and plot_cost_usd 45.00, one STAGE_1 series (rep 3, min_locations 1) with 9-plot entries for both lines, planted, and SX-1001 fully observed at 14.1 / 14.2 / 14.4."
