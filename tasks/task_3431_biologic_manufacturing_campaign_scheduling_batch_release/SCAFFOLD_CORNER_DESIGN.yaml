          - errors.ERR_STALE_BATCH_VERSION
          - validations[priority=3.5]
        distinguishing_aspect: "OCC on BatchLot.version: after the first test create bumps the batch version to 2, a second create carrying the stale version 1 is rejected 412; re-reading the batch and resubmitting with version 2 succeeds."
        test_recipe:
          setup:
            - "Batch in UPSTREAM (version 1 after creation)."
          setup_api_calls:
            - *k_clock
            - *k_site
            - *k_product
