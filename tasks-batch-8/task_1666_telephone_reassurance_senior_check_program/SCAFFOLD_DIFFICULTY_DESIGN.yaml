            - { call: "POST /api/participants", payload: { full_name: "PC2", date_of_birth: "1936-05-06", phone: "555-1406", address: "6 Birch St", referral_source: "FAMILY", age_band: "AGE_85_PLUS", lives_alone: true, mobility: "SEVERE", cognitive_concern: true, chronic_conditions_count: 3, recent_hospitalization: true, recent_bereavement: false }, as: IntakeWorker, captures: { pc2: $.data.id } }
