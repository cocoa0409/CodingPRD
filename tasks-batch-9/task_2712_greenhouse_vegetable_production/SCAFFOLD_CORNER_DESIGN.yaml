          rationale: |
            The §1.8 priority_pair_validation_conflict instance already sets up a single call that violates
            a business_safety rule and a business_temporal rule simultaneously and asserts which error_id
            surfaces, which is the priority-ordering claim in its strongest form.

      - name: cross_entity_validation_on_a_gating_aggregate
        claim_type: cross_entity_validation
        excluded_because:
          difficulty_instance: labor_task_creation_is_gated_on_the_zone_ipm_posture_until_overridden
          rationale: |
            LaborTask creation validated against Zone.ipm_posture is the scaffold's cross-aggregate check,
            and the §1.8 instance shows the blocked call, the override and the byte-identical retry.

      - name: temporal_validation_of_a_future_conflict
        claim_type: temporal_validation
        excluded_because:
          difficulty_instance: climate_windows_use_half_open_intervals_keyed_by_zone_and_regime
          rationale: |
            Window overlap is the scaffold's temporal conflict detector, and the §1.8
            resource_temporal_overlap instance covers adjacency, genuine overlap and the regime-scoped
            resource key in one chain.

