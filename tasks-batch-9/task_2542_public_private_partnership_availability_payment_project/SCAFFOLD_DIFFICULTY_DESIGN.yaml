      - name: handback_required_reserve_is_single_pass_not_a_fixed_point
        mode: c
        grounds:
          - calculations.handback_required_reserve
          - calculations.handback_required_reserve.constants.HANDBACK_PENALTY_PCT
          - entities.Concession.fields.handback_required_reserve_cents
          - entities.Concession.fields.handback_status
          - calculations.period_deduction_cap_allocation.variants.SEQUENTIAL_CAP
        distinguishing_aspect: |
          Mode (c): a circular-looking dependency with a pinned evaluation order. The
          required reserve depends on a shortfall which depends on the required reserve.
          The pinned order is exactly one pass: shortfall_pre = rectification_cost -
          lifecycle_reserve_balance = 4000000; penalty = round_half_up(shortfall_pre *
          0.15) = 600000; required = 12000000 + 600000 = 12600000; final shortfall =
          12600000 - 8000000 = 4600000. An implementation that iterates to a fixed point
          (re-deriving the penalty from the 4600000 shortfall) reports penalty 690000 and
          required 12690000. The resulting HANDBACK_SHORTFALL DeductionEvent carries
          points 3680 and raw 4600000 but is cap-truncated to allowed 1720833.
