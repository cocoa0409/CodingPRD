scenario: |
  Generate task harder than expert level!

  2598. Therapeutic Recreation Activity Program (long-term care activities department): resident
  assessment with interests, cognitive level and functional ability driving individualized activity
  plans, activity calendar construction across social, cognitive, physical, spiritual and creative
  domains with frequency targets, participation documentation with engagement level and refusal
  tracking feeding care plan updates, group size, staffing ratio and adaptive equipment planning for
  varying ability levels, volunteer and intergenerational program coordination with screening
  requirements, outing planning with transportation, supervision ratios and consent, resident council
  input and preference-driven programming, regulatory survey documentation of activity provision and
  outcome measurement
domain_name: therapeutic-recreation-activity-program
api_prefix: "/recreation"

complexity_profile:
  difficulty_level: beyond_expert          # §0.4 Expert band deliberately exceeded per scenario instruction
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: graph
  # ParticipationRecord (Resident x ActivitySession), VolunteerAssignment (Volunteer x
  # ActivitySession) and OutingConsent (Resident x Outing) are true junction entities; ActivityPlan
  # points at both Resident and ResidentAssessment; ResidentCouncilRequest points at Resident and
  # ActivityProgram. No entity is URL-nested more than one level under a non-owning parent.

  state_machine_shape: cyclic
  secondary_shapes: [parallel, branching, compound]
  # cyclic:    ActivityPlan ACTIVE -> UNDER_REVISION -> ACTIVE; Volunteer CLEARED -> EXPIRED ->
  #            SCREENING -> CLEARED; SurveyPacket ATTESTED -> AMENDED -> COMPILED -> ATTESTED;
  #            OutingConsent GRANTED -> REVOKED -> GRANTED
  # parallel:  Outing carries two independent state dimensions on one row
  #            (logistics_status x consent_status)
  # branching: ParticipationRecord PLANNED -> {ATTENDED, REFUSED, ABSENT} -> FINALIZED with a
  #            divergent side-effect set per branch
  # compound:  ActivitySession IN_PROGRESS -> DOCUMENTED gated on aggregate child record states

  relationship_patterns:
    - one_to_many        # Resident -> ResidentAssessment, ActivityPlan
    - many_to_many       # Resident <-> ActivitySession via ParticipationRecord; Volunteer <->
                         # ActivitySession via VolunteerAssignment; Resident <-> Outing via
                         # OutingConsent
    - cross_aggregate    # ActivityPlan.source_assessment_id crosses the assessment aggregate;
                         # ResidentCouncilRequest.requested_program_id crosses the catalog aggregate

  role_model: segregation_of_duties
  # The ComplianceOfficer who attests a SurveyPacket MUST NOT be the operator who compiled it
  # (X-User-ID comparison against SurveyPacket.compiled_by_user_id). Documentation (ActivityAide),
  # plan authorship (RecreationTherapist) and attestation (ComplianceOfficer) are disjoint duties.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Resident
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: resident's legal name as it appears on the activity roster
        constraints: non-empty, max 120 chars
      - name: room_number
        type: string
        source: input
        description: room identifier used to build paper call sheets
        constraints: non-empty, max 12 chars
      - name: admission_date
        type: string
        source: input
        description: ISO 8601 calendar date (YYYY-MM-DD) of admission to the facility
      - name: status
        type: enum
        source: input
        description: census status controlling whether the resident may be programmed
        default: ADMITTED
        constraints: "status IN {ADMITTED, ON_LEAVE, DISCHARGED}"
      - name: cognitive_level
        type: enum
        source: computed
        description: mirror of the latest non-superseded ResidentAssessment.cognitive_level; null when the resident has no assessment
        constraints: "cognitive_level IN {INTACT, MILD_IMPAIRMENT, MODERATE_IMPAIRMENT, SEVERE_IMPAIRMENT} or null"
      - name: functional_mobility
        type: enum
        source: computed
        description: mirror of the latest non-superseded ResidentAssessment.functional_mobility; null when the resident has no assessment
        constraints: "functional_mobility IN {INDEPENDENT, ASSIST_1, ASSIST_2, WHEELCHAIR_DEPENDENT, BEDBOUND} or null"
      - name: interest_domains
        type: array
        source: computed
        description: mirror of the latest non-superseded ResidentAssessment.interest_domains; empty array when the resident has no assessment
      - name: supervision_tier
        type: enum
        source: computed
        description: staffing weight class derived by calculations.supervision_tier from cognitive_level and functional_mobility; null when the resident has no assessment
        constraints: "supervision_tier IN {TIER_1, TIER_2, TIER_3} or null"
      - name: engagement_index
        type: number
        source: computed
        description: rolling engagement score from calculations.resident_engagement_index; 3 decimal places
        default: 0.0
      - name: refusal_streak
        type: integer
        source: computed
        description: consecutive most-recent refusals from calculations.resident_refusal_streak
        default: 0
      - name: absence_count
        type: integer
        source: computed
        description: count of this resident's ParticipationRecord rows whose outcome == ABSENT
        default: 0
      - name: enrollment_gate
        type: enum
        source: system
        description: gate posture set to THERAPIST_REVIEW when the resident's live ActivityPlan enters UNDER_REVISION and back to NONE when it returns to ACTIVE
        default: NONE
        constraints: "enrollment_gate IN {NONE, THERAPIST_REVIEW}"
      - name: care_plan_review_due
        type: boolean
        source: system
        description: true while the resident's live ActivityPlan is in UNDER_REVISION
        default: false

  - name: ResidentAssessment
    parent: Resident
    common_fields: false
    fields:
      - name: resident_id
        type: string
        source: input
        description: FK -> Resident.id; the assessed resident. Supplied by the path segment.
      - name: cognitive_level
        type: enum
        source: input
        description: assessed cognition band
        constraints: "cognitive_level IN {INTACT, MILD_IMPAIRMENT, MODERATE_IMPAIRMENT, SEVERE_IMPAIRMENT}"
      - name: functional_mobility
        type: enum
        source: input
        description: assessed functional ability band
        constraints: "functional_mobility IN {INDEPENDENT, ASSIST_1, ASSIST_2, WHEELCHAIR_DEPENDENT, BEDBOUND}"
      - name: interest_domains
        type: array
        source: input
        description: interest inventory result; subset of the five programming domains
        constraints: "non-empty, values IN {SOCIAL, COGNITIVE, PHYSICAL, SPIRITUAL, CREATIVE}, no duplicates"
      - name: adaptive_equipment_needs
        type: array
        source: input
        description: adaptive equipment the resident requires to participate
        default: []
        constraints: "values IN {WALKER, WHEELCHAIR, HEARING_AMPLIFIER, LARGE_PRINT, WEIGHTED_LAP_PAD, ADAPTIVE_UTENSILS}, no duplicates"
      - name: preferred_group_size
        type: enum
        source: input
        description: group tolerance recorded at assessment
        constraints: "preferred_group_size IN {SOLO, SMALL, LARGE}"
      - name: effective_date
        type: string
        source: input
        description: ISO 8601 calendar date (YYYY-MM-DD) the assessment takes effect
      - name: assessed_by_user_id
        type: string
        source: system
        description: X-User-ID of the RecreationTherapist who filed the assessment
      - name: superseded
        type: boolean
        source: computed
        description: true when another ResidentAssessment for the same resident has a strictly greater (effective_date, created_at) ordering key
        default: false

  - name: ActivityPlan
    parent: Resident
    common_fields: true
    fields:
      - name: resident_id
        type: string
        source: input
        description: FK -> Resident.id; the resident this individualized plan belongs to
      - name: source_assessment_id
        type: string
        source: input
        description: FK -> ResidentAssessment.id; the assessment whose interests, cognition and function justify these targets
      - name: status
        type: enum
        source: system
        description: plan lifecycle state
        default: DRAFT
        constraints: "status IN {DRAFT, ACTIVE, UNDER_REVISION, SUPERSEDED, CLOSED}"
      - name: cycle_start_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant that opens the 28-day frequency cycle the targets are measured over
      - name: domain_frequency_targets
        type: object
        source: input
        description: "sessions-per-28-day-cycle target per domain; every one of the five keys SOCIAL, COGNITIVE, PHYSICAL, SPIRITUAL, CREATIVE MUST be present with an integer >= 0"
        constraints: "each value integer 0..20; sum of the five values >= 1"
      - name: target_total_sessions
        type: integer
        source: computed
        description: arithmetic sum of the five domain_frequency_targets values
      - name: credited_attainment_pct
        type: number
        source: computed
        description: calculations.plan_attainment variant credited_attainment; 1 decimal place
        default: 0.0
      - name: offered_attainment_pct
        type: number
        source: computed
        description: calculations.plan_attainment variant offered_attainment; 1 decimal place
        default: 0.0
      - name: revision_count
        type: integer
        source: system
        description: number of completed UNDER_REVISION -> ACTIVE round trips
        default: 0
      - name: review_reason
        type: enum
        source: system
        description: why the plan entered UNDER_REVISION; reset to NONE on return to ACTIVE
        default: NONE
        constraints: "review_reason IN {NONE, REFUSAL_PATTERN, THERAPIST_REQUEST, COUNCIL_INPUT}"
      - name: activated_at
        type: datetime
        source: system
        description: ISO 8601 UTC instant of the most recent transition into ACTIVE; null while DRAFT

  - name: ActivityProgram
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: catalog name of the recurring program
        constraints: non-empty, max 120 chars
      - name: domain
        type: enum
        source: input
        description: the single programming domain this program serves
        constraints: "domain IN {SOCIAL, COGNITIVE, PHYSICAL, SPIRITUAL, CREATIVE}"
      - name: staffing_ratio_denominator
        type: integer
        source: input
        description: units of weighted supervision load that one staff member can carry in this program
        constraints: integer 1..20
      - name: max_group_size
        type: integer
        source: input
        description: largest resident group the program design tolerates
        constraints: integer 1..60
      - name: max_supervision_tier
        type: enum
        source: input
        description: highest resident supervision_tier this program is designed to accommodate
        constraints: "max_supervision_tier IN {TIER_1, TIER_2, TIER_3}"
      - name: required_adaptive_equipment
        type: array
        source: input
        description: equipment the room MUST stock for this program to run
        default: []
        constraints: "values IN {WALKER, WHEELCHAIR, HEARING_AMPLIFIER, LARGE_PRINT, WEIGHTED_LAP_PAD, ADAPTIVE_UTENSILS}, no duplicates"
      - name: volunteer_eligible
        type: boolean
        source: input
        description: whether volunteers may be assigned to sessions of this program
        default: false
      - name: required_screening_level
        type: enum
        source: input
        description: minimum Volunteer.screening_level required to be assigned to this program
        default: NONE
        constraints: "required_screening_level IN {NONE, BASIC, FULL}"
      - name: council_preference_weight
        type: integer
        source: system
        description: incremented by 1 each time a ResidentCouncilRequest naming this program is ADOPTED
        default: 0

  - name: ActivityRoom
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: room label (e.g. "Great Room")
        constraints: non-empty, max 80 chars
      - name: capacity
        type: integer
        source: input
        description: fire-code occupancy for residents
        constraints: integer 1..200
      - name: buffer_minutes
        type: integer
        source: input
        description: turnover minutes that MUST separate two sessions in this room; 0 means back-to-back bookings are legal
        default: 0
        constraints: integer 0..120
      - name: equipment_available
        type: array
        source: input
        description: adaptive equipment permanently stocked in this room
        default: []
        constraints: "values IN {WALKER, WHEELCHAIR, HEARING_AMPLIFIER, LARGE_PRINT, WEIGHTED_LAP_PAD, ADAPTIVE_UTENSILS}, no duplicates"

  - name: ActivitySession
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> ActivityProgram.id; the catalog program this calendar slot instantiates
      - name: room_id
        type: string
        source: input
        description: FK -> ActivityRoom.id; the room occupied for this slot
      - name: starts_at
        type: datetime
        source: input
        description: ISO 8601 UTC start instant of the calendar slot
      - name: ends_at
        type: datetime
        source: input
        description: ISO 8601 UTC end instant of the calendar slot; MUST be strictly after starts_at
      - name: assigned_staff_count
        type: integer
        source: input
        description: paid activity staff rostered to this slot
        constraints: integer 1..20
      - name: status
        type: enum
        source: system
        description: session lifecycle state
        default: SCHEDULED
        constraints: "status IN {SCHEDULED, IN_PROGRESS, DOCUMENTED, CANCELLED}"
      - name: enrolled_count
        type: integer
        source: computed
        description: count of this session's ParticipationRecord rows whose status != VOID
        default: 0
      - name: weighted_supervision_load
        type: number
        source: computed
        description: calculations.session_staffing_requirement intermediate weighted_load; 2 decimal places
        default: 0.0
      - name: required_staff_count
        type: integer
        source: computed
        description: calculations.session_staffing_requirement output
        default: 0
      - name: effective_capacity
        type: integer
        source: computed
        description: "min(ActivityProgram.max_group_size, ActivityRoom.capacity) resolved through program_id and room_id"
      - name: documented_at
        type: datetime
        source: system
        description: ISO 8601 UTC instant the session reached DOCUMENTED; null otherwise
      - name: cancel_reason
        type: string
        source: input
        description: free-text reason recorded when the session is cancelled; null while not CANCELLED

  - name: ParticipationRecord
    parent: ActivitySession
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: input
        description: FK -> ActivitySession.id; the documented calendar slot
      - name: resident_id
        type: string
        source: input
        description: FK -> Resident.id; the enrolled resident
      - name: status
        type: enum
        source: system
        description: documentation state; PLANNED until documented, VOID when the session is cancelled, FINALIZED once the session closes documentation
        default: PLANNED
        constraints: "status IN {PLANNED, ATTENDED, REFUSED, ABSENT, VOID, FINALIZED}"
      - name: finalized_from
        type: enum
        source: system
        description: the documented branch preserved when status becomes FINALIZED; null before finalization
        constraints: "finalized_from IN {ATTENDED, REFUSED, ABSENT} or null"
      - name: outcome
        type: enum
        source: computed
        description: "equals status when status != FINALIZED, else equals finalized_from; the single field every calculation reads"
        constraints: "outcome IN {PLANNED, ATTENDED, REFUSED, ABSENT, VOID}"
      - name: engagement_level
        type: enum
        source: input
        description: observed engagement, required when documenting outcome ATTENDED and rejected otherwise
        constraints: "engagement_level IN {NONE, PASSIVE_OBSERVER, PARTIAL, ACTIVE, LEADING} or null"
      - name: refusal_reason
        type: enum
        source: input
        description: reason captured when documenting outcome REFUSED and rejected otherwise
        constraints: "refusal_reason IN {FATIGUE, PAIN, NOT_INTERESTED, FAMILY_VISIT, MOOD, OTHER} or null"
      - name: adaptive_equipment_used
        type: array
        source: input
        description: equipment actually deployed for this resident in this session
        default: []
        constraints: "values IN {WALKER, WHEELCHAIR, HEARING_AMPLIFIER, LARGE_PRINT, WEIGHTED_LAP_PAD, ADAPTIVE_UTENSILS}, no duplicates"
      - name: gate_override_reason
        type: string
        source: input
        description: RecreationTherapist justification that permits enrollment while Resident.enrollment_gate == THERAPIST_REVIEW; null when no override was used
      - name: documented_by_user_id
        type: string
        source: system
        description: X-User-ID of the operator who documented the outcome; null while PLANNED
      - name: documented_at
        type: datetime
        source: system
        description: ISO 8601 UTC instant the outcome was documented; null while PLANNED

  - name: Volunteer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: volunteer's name
        constraints: non-empty, max 120 chars
      - name: volunteer_type
        type: enum
        source: input
        description: cohort the volunteer belongs to; STUDENT_INTERGENERATIONAL carries extra supervision requirements
        constraints: "volunteer_type IN {ADULT_COMMUNITY, STUDENT_INTERGENERATIONAL, FAMILY_MEMBER}"
      - name: screening_level
        type: enum
        source: system
        description: highest screening tier reached; raised by POST /recreation/volunteers/{volunteer_id}/screening
        default: NONE
        constraints: "screening_level IN {NONE, BASIC, FULL}"
      - name: background_check_cleared_on
        type: string
        source: system
        description: ISO 8601 calendar date the background check cleared; null until the BACKGROUND_CHECK_CLEARED event
      - name: background_check_expires_on
        type: string
        source: system
        description: "ISO 8601 calendar date equal to background_check_cleared_on + BACKGROUND_CHECK_VALID_DAYS; null until cleared"
      - name: orientation_completed_on
        type: string
        source: system
        description: ISO 8601 calendar date orientation was completed; null until the ORIENTATION_COMPLETED event
      - name: status
        type: enum
        source: system
        description: screening lifecycle state
        default: APPLICANT
        constraints: "status IN {APPLICANT, SCREENING, CLEARED, EXPIRED, SUSPENDED, TERMINATED}"
      - name: scheduled_hours_week
        type: number
        source: computed
        description: calculations.volunteer_hours variant scheduled_hours for the ISO week containing the logical clock; 2 decimal places
        default: 0.0
      - name: credited_service_hours
        type: number
        source: computed
        description: calculations.volunteer_hours variant credited_service_hours, lifetime; 2 decimal places
        default: 0.0

  - name: VolunteerAssignment
    parent: null
    common_fields: true
    fields:
      - name: volunteer_id
        type: string
        source: input
        description: FK -> Volunteer.id; the assigned volunteer
      - name: session_id
        type: string
        source: input
        description: FK -> ActivitySession.id; the session the volunteer supports
      - name: role_type
        type: enum
        source: input
        description: what the volunteer does in the session
        constraints: "role_type IN {COMPANION, GROUP_ASSISTANT, PROGRAM_LEAD}"
      - name: status
        type: enum
        source: system
        description: assignment lifecycle state
        default: PROPOSED
        constraints: "status IN {PROPOSED, CONFIRMED, WITHDRAWN, COMPLETED}"
      - name: hours
        type: number
        source: computed
        description: "(ActivitySession.ends_at - ActivitySession.starts_at) expressed in hours, 2 decimal places, resolved through session_id"
      - name: withdrawn_reason
        type: string
        source: system
        description: "reason stamped on withdrawal; the literal SESSION_CANCELLED when the cascade from a cancelled session withdraws it, otherwise the caller-supplied reason"

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - name: label
        type: string
        source: input
        description: fleet label of the bus or van
        constraints: non-empty, max 60 chars
      - name: ambulatory_seats
        type: integer
        source: input
        description: forward-facing seats usable by ambulatory riders and escorts
        constraints: integer 0..40
      - name: wheelchair_stations
        type: integer
        source: input
        description: tie-down stations usable only by wheelchair-dependent riders
        constraints: integer 0..8
      - name: turnaround_minutes
        type: integer
        source: input
        description: minutes of cleaning/refuel that MUST follow a return before the next departure
        default: 30
        constraints: integer 0..240
      - name: status
        type: enum
        source: input
        description: fleet availability
        default: AVAILABLE
        constraints: "status IN {AVAILABLE, OUT_OF_SERVICE}"
      - name: reserved_ambulatory_seats
        type: integer
        source: computed
        description: "sum of Outing.ambulatory_seats_required over Outings on this vehicle whose logistics_status IN {TRANSPORT_BOOKED, READY, DEPARTED}"
        default: 0
      - name: reserved_wheelchair_stations
        type: integer
        source: computed
        description: "sum of Outing.wheelchair_seats_required over Outings on this vehicle whose logistics_status IN {TRANSPORT_BOOKED, READY, DEPARTED}"
        default: 0

  - name: Outing
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> ActivityProgram.id; the program whose domain the outing counts toward
      - name: vehicle_id
        type: string
        source: input
        description: FK -> Vehicle.id; the vehicle the outing intends to use
      - name: destination
        type: string
        source: input
        description: where the group is going
        constraints: non-empty, max 160 chars
      - name: departure_at
        type: datetime
        source: input
        description: ISO 8601 UTC departure instant
      - name: return_at
        type: datetime
        source: input
        description: ISO 8601 UTC expected return instant; MUST be strictly after departure_at
      - name: escort_count
        type: integer
        source: input
        description: staff escorts riding along; each consumes one ambulatory seat
        default: 0
        constraints: integer 0..20
      - name: logistics_status
        type: enum
        source: system
        description: transportation/readiness dimension; evolves independently of consent_status
        default: PLANNING
        constraints: "logistics_status IN {PLANNING, TRANSPORT_BOOKED, READY, DEPARTED, RETURNED, CANCELLED}"
      - name: consent_status
        type: enum
        source: system
        description: consent dimension recomputed after every OutingConsent decision; evolves independently of logistics_status
        default: COLLECTING
        constraints: "consent_status IN {COLLECTING, CONSENT_COMPLETE, CONSENT_BLOCKED}"
      - name: roster_count
        type: integer
        source: computed
        description: count of this outing's OutingConsent rows whose status IN {REQUESTED, GRANTED, DENIED, REVOKED}
        default: 0
      - name: manifest_count
        type: integer
        source: computed
        description: count of this outing's OutingConsent rows whose status IN {REQUESTED, GRANTED}
        default: 0
      - name: weighted_supervision_load
        type: number
        source: computed
        description: calculations.outing_supervision_requirement intermediate weighted_load over manifest residents; 2 decimal places
        default: 0.0
      - name: required_escorts
        type: integer
        source: computed
        description: calculations.outing_supervision_requirement output
        default: 0
      - name: ambulatory_seats_required
        type: integer
        source: computed
        description: calculations.outing_seat_allocation output ambulatory_seats_required
        default: 0
      - name: wheelchair_seats_required
        type: integer
        source: computed
        description: calculations.outing_seat_allocation output wheelchair_seats_required
        default: 0
      - name: seat_shortfall_total
        type: integer
        source: computed
        description: calculations.outing_seat_allocation output seat_shortfall_total evaluated against the vehicle's free pool
        default: 0
      - name: departed_at
        type: datetime
        source: system
        description: ISO 8601 UTC instant the bus left; null before DEPARTED
      - name: returned_at
        type: datetime
        source: system
        description: ISO 8601 UTC instant the bus returned; null before RETURNED
      - name: cancel_reason
        type: string
        source: input
        description: free-text reason recorded when the outing is cancelled; null while not CANCELLED

  - name: OutingConsent
    parent: Outing
    common_fields: true
    fields:
      - name: outing_id
        type: string
        source: input
        description: FK -> Outing.id; the outing consent is being collected for
      - name: resident_id
        type: string
        source: input
        description: FK -> Resident.id; the resident whose participation is being consented to
      - name: responsible_party_name
        type: string
        source: input
        description: person who holds decision authority for this resident
        constraints: non-empty, max 120 chars
      - name: responsible_party_relation
        type: enum
        source: input
        description: relationship of the responsible party to the resident
        constraints: "responsible_party_relation IN {SELF, SPOUSE, ADULT_CHILD, GUARDIAN, POA}"
      - name: status
        type: enum
        source: system
        description: consent decision state
        default: REQUESTED
        constraints: "status IN {REQUESTED, GRANTED, DENIED, REVOKED}"
      - name: expires_on
        type: string
        source: input
        description: ISO 8601 calendar date after which the granted consent is no longer effective; null means the consent does not expire
      - name: effective
        type: boolean
        source: computed
        description: "true when status == GRANTED AND (expires_on is null OR expires_on >= the calendar date of Outing.departure_at)"
        default: false
      - name: decided_at
        type: datetime
        source: system
        description: ISO 8601 UTC instant of the most recent decision; null while REQUESTED

  - name: ResidentCouncilRequest
    parent: Resident
    common_fields: true
    fields:
      - name: resident_id
        type: string
        source: input
        description: FK -> Resident.id; the council representative who submitted the request
      - name: requested_domain
        type: enum
        source: input
        description: domain the council wants more programming in
        constraints: "requested_domain IN {SOCIAL, COGNITIVE, PHYSICAL, SPIRITUAL, CREATIVE}"
      - name: requested_program_id
        type: string
        source: input
        description: FK -> ActivityProgram.id; the specific catalog program the council named, or null when the request is domain-only
      - name: vote_count
        type: integer
        source: input
        description: number of council members who voted in favour
        constraints: integer 0..40
      - name: note
        type: string
        source: input
        description: free-text council minute excerpt
      - name: status
        type: enum
        source: system
        description: review state of the council request
        default: SUBMITTED
        constraints: "status IN {SUBMITTED, ADOPTED, DECLINED, DEFERRED}"
      - name: decision_note
        type: string
        source: system
        description: reviewer's rationale copied from the review call; null while SUBMITTED
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the ActivityDirector who reviewed the request; null while SUBMITTED

  - name: SurveyPacket
    parent: null
    common_fields: true
    fields:
      - name: window_start
        type: string
        source: input
        description: ISO 8601 calendar date opening the survey window, inclusive
      - name: window_end
        type: string
        source: input
        description: ISO 8601 calendar date closing the survey window, inclusive; MUST be >= window_start
      - name: status
        type: enum
        source: system
        description: attestation lifecycle state
        default: OPEN
        constraints: "status IN {OPEN, COMPILED, ATTESTED, AMENDED}"
      - name: offered_sessions_targeted
        type: integer
        source: computed
        description: calculations.survey_provision_score input offered_sessions_targeted; null while OPEN
      - name: offered_sessions_delivered
        type: integer
        source: computed
        description: calculations.survey_provision_score input offered_sessions_delivered; null while OPEN
      - name: base_score
        type: number
        source: computed
        description: calculations.survey_provision_score step 1 output; 1 decimal place; null while OPEN
      - name: domain_coverage_penalty
        type: number
        source: computed
        description: calculations.survey_provision_score step 2 output; 1 decimal place; null while OPEN
      - name: refusal_penalty
        type: number
        source: computed
        description: calculations.survey_provision_score step 2 output; 1 decimal place; null while OPEN
      - name: preliminary_score
        type: number
        source: computed
        description: calculations.survey_provision_score step 3 output; the ONLY score deficiency_flags may be derived from; 1 decimal place; null while OPEN
      - name: deficiency_flags
        type: array
        source: computed
        description: "calculations.survey_provision_score step 4 output, emitted in ascending flag-code order; values IN {F248_INSUFFICIENT_FREQUENCY, F249_UNADDRESSED_REFUSAL, F250_UNSCREENED_VOLUNTEER}; empty array while OPEN"
        default: []
      - name: provision_score
        type: number
        source: computed
        description: calculations.survey_provision_score step 5 output; 1 decimal place; null while OPEN
      - name: compiled_by_user_id
        type: string
        source: system
        description: X-User-ID of the operator who most recently compiled the packet; null while OPEN
      - name: attested_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who attested; null until ATTESTED
      - name: amendment_count
        type: integer
        source: system
        description: number of ATTESTED -> AMENDED transitions performed on this packet
        default: 0
      - name: remediation_note
        type: string
        source: input
        description: narrative required at attestation whenever deficiency_flags contains F249_UNADDRESSED_REFUSAL; null otherwise

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: ActivityPlan
    state_field: status
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /recreation/activity-plans/{plan_id}/transition with action: ACTIVATE"
        actor: RecreationTherapist
        preconditions:
          - "ActivityPlan.status == DRAFT"
          - "Resident.status == ADMITTED for ActivityPlan.resident_id"
          - "the ResidentAssessment at ActivityPlan.source_assessment_id has superseded == false"
        side_effects:
          - "sets ActivityPlan.status = ACTIVE and ActivityPlan.activated_at = current_utc"
          - "every other ActivityPlan with the same resident_id whose status IN {ACTIVE, UNDER_REVISION} transitions to SUPERSEDED"
          - "each plan that just became SUPERSEDED sets Resident.care_plan_review_due = false and Resident.enrollment_gate = NONE on ActivityPlan.resident_id"
          - "recomputes ActivityPlan.credited_attainment_pct and ActivityPlan.offered_attainment_pct via calculations.plan_attainment"
          - "increments Resident.version by 1"
      - from: ACTIVE
        to: UNDER_REVISION
        trigger: "POST /recreation/activity-plans/{plan_id}/transition with action: REVISE"
        actor: RecreationTherapist
        preconditions:
          - "ActivityPlan.status == ACTIVE"
          - "request review_reason IN {THERAPIST_REQUEST, COUNCIL_INPUT}"
        side_effects:
          - "sets ActivityPlan.status = UNDER_REVISION and ActivityPlan.review_reason = the supplied review_reason"
          - "sets Resident.care_plan_review_due = true and Resident.enrollment_gate = THERAPIST_REVIEW on ActivityPlan.resident_id"
          - "increments Resident.version by 1"
        note: "manual counterpart of the system-triggered refusal-pattern revision below"
      - from: ACTIVE
        to: UNDER_REVISION
        trigger: "system event: calculations.resident_refusal_streak returns a value >= REFUSAL_REVIEW_THRESHOLD immediately after PATCH /recreation/participation/{record_id} documented outcome REFUSED"
        actor: system
        preconditions:
          - "ActivityPlan.status == ACTIVE"
          - "ActivityPlan.resident_id == the documented ParticipationRecord.resident_id"
          - "Resident.refusal_streak >= REFUSAL_REVIEW_THRESHOLD (3) after the recompute"
        side_effects:
          - "sets ActivityPlan.status = UNDER_REVISION and ActivityPlan.review_reason = REFUSAL_PATTERN"
          - "sets Resident.care_plan_review_due = true and Resident.enrollment_gate = THERAPIST_REVIEW"
        note: "hop 3 of the refusal cascade; hop 4 is the Resident.enrollment_gate write caused by this plan entering UNDER_REVISION"
      - from: ACTIVE
        to: UNDER_REVISION
        trigger: "system event: POST /recreation/council-requests/{request_id}/review with decision: ADOPTED"
        actor: system
        preconditions:
          - "ActivityPlan.status == ACTIVE"
          - "Resident.interest_domains for ActivityPlan.resident_id contains the adopted ResidentCouncilRequest.requested_domain"
          - "ActivityPlan.domain_frequency_targets[requested_domain] == 0"
        side_effects:
          - "sets ActivityPlan.status = UNDER_REVISION and ActivityPlan.review_reason = COUNCIL_INPUT"
          - "sets Resident.care_plan_review_due = true and Resident.enrollment_gate = THERAPIST_REVIEW"
      - from: UNDER_REVISION
        to: ACTIVE
        trigger: "POST /recreation/activity-plans/{plan_id}/transition with action: REACTIVATE"
        actor: RecreationTherapist
        preconditions:
          - "ActivityPlan.status == UNDER_REVISION"
          - "the ResidentAssessment at ActivityPlan.source_assessment_id has superseded == false"
        side_effects:
          - "sets ActivityPlan.status = ACTIVE, increments ActivityPlan.revision_count by 1, sets ActivityPlan.review_reason = NONE and ActivityPlan.activated_at = current_utc"
          - "sets Resident.care_plan_review_due = false and Resident.enrollment_gate = NONE on ActivityPlan.resident_id"
          - "recomputes ActivityPlan.credited_attainment_pct and ActivityPlan.offered_attainment_pct via calculations.plan_attainment"
          - "increments Resident.version by 1"
        note: "closes the revision cycle ACTIVE -> UNDER_REVISION -> ACTIVE"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system event: another ActivityPlan for the same resident_id transitions DRAFT -> ACTIVE"
        actor: system
        preconditions:
          - "ActivityPlan.status == ACTIVE"
          - "the activating plan has the same resident_id and a different id"
        side_effects:
          - "sets ActivityPlan.status = SUPERSEDED"
          - "freezes ActivityPlan.credited_attainment_pct and ActivityPlan.offered_attainment_pct at their values as of this transition; later ParticipationRecord documentation never recomputes a SUPERSEDED plan"
      - from: UNDER_REVISION
        to: SUPERSEDED
        trigger: "system event: another ActivityPlan for the same resident_id transitions DRAFT -> ACTIVE"
        actor: system
        preconditions:
          - "ActivityPlan.status == UNDER_REVISION"
          - "the activating plan has the same resident_id and a different id"
        side_effects:
          - "sets ActivityPlan.status = SUPERSEDED"
          - "sets Resident.care_plan_review_due = false and Resident.enrollment_gate = NONE on ActivityPlan.resident_id"
      - from: DRAFT
        to: CLOSED
        trigger: "POST /recreation/activity-plans/{plan_id}/transition with action: CLOSE"
        actor: ActivityDirector
        preconditions: ["ActivityPlan.status == DRAFT"]
        side_effects: ["sets ActivityPlan.status = CLOSED"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /recreation/activity-plans/{plan_id}/transition with action: CLOSE"
        actor: ActivityDirector
        preconditions: ["ActivityPlan.status == ACTIVE"]
        side_effects:
          - "sets ActivityPlan.status = CLOSED"
          - "sets Resident.care_plan_review_due = false and Resident.enrollment_gate = NONE on ActivityPlan.resident_id"
      - from: UNDER_REVISION
        to: CLOSED
        trigger: "POST /recreation/activity-plans/{plan_id}/transition with action: CLOSE"
        actor: ActivityDirector
        preconditions: ["ActivityPlan.status == UNDER_REVISION"]
        side_effects:
          - "sets ActivityPlan.status = CLOSED"
          - "sets Resident.care_plan_review_due = false and Resident.enrollment_gate = NONE on ActivityPlan.resident_id"

  - entity: ActivitySession
    state_field: status
    shape: compound
    initial_state: SCHEDULED
    terminal_states: [DOCUMENTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /recreation/sessions/{session_id}/status with action: START"
        actor: ActivityAide
        preconditions:
          - "ActivitySession.status == SCHEDULED"
          - "current_utc >= ActivitySession.starts_at"
          - "ActivitySession.enrolled_count >= 1"
        side_effects: ["sets ActivitySession.status = IN_PROGRESS"]
      - from: IN_PROGRESS
        to: DOCUMENTED
        trigger: "POST /recreation/sessions/{session_id}/status with action: CLOSE_DOCUMENTATION"
        actor: ActivityAide
        preconditions:
          - "ActivitySession.status == IN_PROGRESS"
          - "no ParticipationRecord with session_id == this session has status == PLANNED"
        side_effects:
          - "sets ActivitySession.status = DOCUMENTED and ActivitySession.documented_at = current_utc"
          - "every ParticipationRecord of this session with status IN {ATTENDED, REFUSED, ABSENT} transitions to FINALIZED with finalized_from set to the pre-transition status (ParticipationRecord.outcome is unchanged by the join)"
          - "every VolunteerAssignment of this session with status == CONFIRMED transitions to COMPLETED"
          - "each VolunteerAssignment that just became COMPLETED recomputes Volunteer.credited_service_hours and Volunteer.scheduled_hours_week via calculations.volunteer_hours"
        note: "compound gate: the set of valid next states depends on the aggregate state of the child ParticipationRecord rows"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /recreation/sessions/{session_id}/status with action: CANCEL"
        actor: ActivityDirector
        preconditions: ["ActivitySession.status == SCHEDULED"]
        side_effects:
          - "sets ActivitySession.status = CANCELLED and ActivitySession.cancel_reason = the supplied cancel_reason"
          - "every ParticipationRecord of this session with status == PLANNED transitions to VOID"
          - "each ParticipationRecord that just became VOID recomputes the credited_attainment_pct and offered_attainment_pct of that resident's ActivityPlan whose status IN {ACTIVE, UNDER_REVISION}"
          - "every VolunteerAssignment of this session with status IN {PROPOSED, CONFIRMED} transitions to WITHDRAWN with withdrawn_reason = SESSION_CANCELLED"
          - "each VolunteerAssignment that just became WITHDRAWN recomputes Volunteer.scheduled_hours_week via calculations.volunteer_hours"
          - "recomputes ActivitySession.enrolled_count, ActivitySession.weighted_supervision_load and ActivitySession.required_staff_count (all reach 0 once every record is VOID)"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /recreation/sessions/{session_id}/status with action: CANCEL"
        actor: ActivityDirector
        preconditions: ["ActivitySession.status == IN_PROGRESS"]
        side_effects:
          - "sets ActivitySession.status = CANCELLED and ActivitySession.cancel_reason = the supplied cancel_reason"
          - "every ParticipationRecord of this session with status == PLANNED transitions to VOID; records already documented ATTENDED/REFUSED/ABSENT keep their outcome"
          - "each ParticipationRecord that just became VOID recomputes the credited_attainment_pct and offered_attainment_pct of that resident's ActivityPlan whose status IN {ACTIVE, UNDER_REVISION}"
          - "every VolunteerAssignment of this session with status IN {PROPOSED, CONFIRMED} transitions to WITHDRAWN with withdrawn_reason = SESSION_CANCELLED"
          - "each VolunteerAssignment that just became WITHDRAWN recomputes Volunteer.scheduled_hours_week via calculations.volunteer_hours"
          - "recomputes ActivitySession.enrolled_count, ActivitySession.weighted_supervision_load and ActivitySession.required_staff_count"

  - entity: ParticipationRecord
    state_field: status
    shape: branching
    initial_state: PLANNED
    terminal_states: [VOID, FINALIZED]
    transitions:
      - from: PLANNED
        to: ATTENDED
        trigger: "PATCH /recreation/participation/{record_id} with outcome: ATTENDED"
        actor: ActivityAide
        preconditions:
          - "ParticipationRecord.status == PLANNED"
          - "the ActivitySession at ParticipationRecord.session_id has status == IN_PROGRESS"
          - "request engagement_level is present"
          - "request refusal_reason is absent"
        side_effects:
          - "sets ParticipationRecord.status = ATTENDED, engagement_level, documented_by_user_id = X-User-ID and documented_at = current_utc"
          - "recomputes Resident.engagement_index via calculations.resident_engagement_index"
          - "recomputes Resident.refusal_streak via calculations.resident_refusal_streak (this record interrupts the streak, so the value becomes 0)"
          - "recomputes credited_attainment_pct and offered_attainment_pct on the ActivityPlan of this resident whose status IN {ACTIVE, UNDER_REVISION}"
        note: "branch A of the fork; the only branch that can raise credited_attainment_pct"
      - from: PLANNED
        to: REFUSED
        trigger: "PATCH /recreation/participation/{record_id} with outcome: REFUSED"
        actor: ActivityAide
        preconditions:
          - "ParticipationRecord.status == PLANNED"
          - "the ActivitySession at ParticipationRecord.session_id has status == IN_PROGRESS"
          - "request refusal_reason is present"
          - "request engagement_level is absent"
        side_effects:
          - "hop 1: sets ParticipationRecord.status = REFUSED, refusal_reason, documented_by_user_id = X-User-ID and documented_at = current_utc"
          - "hop 2: caused by hop 1, recomputes Resident.refusal_streak and Resident.engagement_index (a REFUSED record enters the engagement window worth 0 points)"
          - "hop 3: caused by hop 2 reaching REFUSAL_REVIEW_THRESHOLD, the resident's ActivityPlan with status == ACTIVE transitions ACTIVE -> UNDER_REVISION with review_reason = REFUSAL_PATTERN"
          - "hop 4: caused by hop 3, that plan entering UNDER_REVISION sets Resident.enrollment_gate = THERAPIST_REVIEW and Resident.care_plan_review_due = true"
          - "recomputes offered_attainment_pct on the ActivityPlan of this resident whose status IN {ACTIVE, UNDER_REVISION} (a refusal is a documented offer)"
        note: "branch B of the fork; carries the depth-4 transitive cascade"
      - from: PLANNED
        to: ABSENT
        trigger: "PATCH /recreation/participation/{record_id} with outcome: ABSENT"
        actor: ActivityAide
        preconditions:
          - "ParticipationRecord.status == PLANNED"
          - "the ActivitySession at ParticipationRecord.session_id has status == IN_PROGRESS"
          - "request engagement_level is absent"
          - "request refusal_reason is absent"
        side_effects:
          - "sets ParticipationRecord.status = ABSENT, documented_by_user_id = X-User-ID and documented_at = current_utc"
          - "recomputes Resident.absence_count"
          - "recomputes Resident.refusal_streak (an ABSENT record interrupts the streak, so the value becomes 0)"
          - "leaves Resident.engagement_index unchanged: ABSENT records never enter the engagement window"
          - "leaves ActivityPlan.offered_attainment_pct unchanged: an absence is not a documented offer"
        note: "branch C of the fork; the divergent side-effect set is the point of the branch"
      - from: ATTENDED
        to: FINALIZED
        trigger: "system event: POST /recreation/sessions/{session_id}/status with action: CLOSE_DOCUMENTATION"
        actor: system
        preconditions: ["ParticipationRecord.status == ATTENDED"]
        side_effects: ["sets ParticipationRecord.status = FINALIZED and ParticipationRecord.finalized_from = ATTENDED"]
      - from: REFUSED
        to: FINALIZED
        trigger: "system event: POST /recreation/sessions/{session_id}/status with action: CLOSE_DOCUMENTATION"
        actor: system
        preconditions: ["ParticipationRecord.status == REFUSED"]
        side_effects: ["sets ParticipationRecord.status = FINALIZED and ParticipationRecord.finalized_from = REFUSED"]
      - from: ABSENT
        to: FINALIZED
        trigger: "system event: POST /recreation/sessions/{session_id}/status with action: CLOSE_DOCUMENTATION"
        actor: system
        preconditions: ["ParticipationRecord.status == ABSENT"]
        side_effects: ["sets ParticipationRecord.status = FINALIZED and ParticipationRecord.finalized_from = ABSENT"]
      - from: PLANNED
        to: VOID
        trigger: "system event: POST /recreation/sessions/{session_id}/status with action: CANCEL"
        actor: system
        preconditions: ["ParticipationRecord.status == PLANNED"]
        side_effects:
          - "sets ParticipationRecord.status = VOID"
          - "recomputes credited_attainment_pct and offered_attainment_pct on the resident's ActivityPlan whose status IN {ACTIVE, UNDER_REVISION}"
          - "recomputes ActivitySession.enrolled_count on the cancelled session"

  - entity: Outing
    state_field: logistics_status
    shape: cyclic
    dimension: "logistics dimension; evolves independently of the consent dimension below on the same Outing row"
    initial_state: PLANNING
    terminal_states: [RETURNED, CANCELLED]
    transitions:
      - from: PLANNING
        to: TRANSPORT_BOOKED
        trigger: "POST /recreation/outings/{outing_id}/transport-booking"
        actor: ActivityDirector
        preconditions:
          - "Outing.logistics_status == PLANNING"
          - "the Vehicle at Outing.vehicle_id has status == AVAILABLE"
          - "request expected_vehicle_version == Vehicle.version"
          - "no other Outing with the same vehicle_id whose logistics_status IN {TRANSPORT_BOOKED, READY, DEPARTED} occupies an overlapping window per validations priority 26 (vehicle interval semantics)"
          - "calculations.outing_seat_allocation yields seat_shortfall_total == 0"
        side_effects:
          - "sets Outing.logistics_status = TRANSPORT_BOOKED"
          - "recomputes Outing.ambulatory_seats_required, Outing.wheelchair_seats_required and Outing.seat_shortfall_total via calculations.outing_seat_allocation"
          - "recomputes Vehicle.reserved_ambulatory_seats and Vehicle.reserved_wheelchair_stations"
          - "increments Vehicle.version by 1"
      - from: TRANSPORT_BOOKED
        to: READY
        trigger: "POST /recreation/outings/{outing_id}/logistics with action: FINALIZE"
        actor: ActivityDirector
        preconditions:
          - "Outing.logistics_status == TRANSPORT_BOOKED"
          - "Outing.escort_count >= Outing.required_escorts"
          - "Outing.consent_status == CONSENT_COMPLETE"
        side_effects: ["sets Outing.logistics_status = READY"]
      - from: READY
        to: TRANSPORT_BOOKED
        trigger: "system event: POST /recreation/outings/{outing_id}/consents/{consent_id}/decision moved Outing.consent_status out of CONSENT_COMPLETE"
        actor: system
        preconditions:
          - "Outing.logistics_status == READY"
          - "Outing.consent_status != CONSENT_COMPLETE after the consent recompute"
        side_effects:
          - "sets Outing.logistics_status = TRANSPORT_BOOKED"
        note: "cross-dimension revert; closes the READY -> TRANSPORT_BOOKED -> READY cycle in the logistics dimension"
      - from: READY
        to: DEPARTED
        trigger: "POST /recreation/outings/{outing_id}/logistics with action: DEPART"
        actor: ActivityDirector
        preconditions:
          - "Outing.logistics_status == READY"
          - "current_utc >= Outing.departure_at"
        side_effects: ["sets Outing.logistics_status = DEPARTED and Outing.departed_at = current_utc"]
      - from: DEPARTED
        to: RETURNED
        trigger: "POST /recreation/outings/{outing_id}/logistics with action: RETURN"
        actor: ActivityDirector
        preconditions:
          - "Outing.logistics_status == DEPARTED"
          - "current_utc >= Outing.departed_at"
        side_effects:
          - "sets Outing.logistics_status = RETURNED and Outing.returned_at = current_utc"
          - "recomputes Vehicle.reserved_ambulatory_seats and Vehicle.reserved_wheelchair_stations (this outing leaves the reserving set)"
          - "increments Vehicle.version by 1"
      - from: PLANNING
        to: CANCELLED
        trigger: "POST /recreation/outings/{outing_id}/logistics with action: CANCEL"
        actor: ActivityDirector
        preconditions: ["Outing.logistics_status == PLANNING"]
        side_effects: ["sets Outing.logistics_status = CANCELLED and Outing.cancel_reason = the supplied cancel_reason"]
      - from: TRANSPORT_BOOKED
        to: CANCELLED
        trigger: "POST /recreation/outings/{outing_id}/logistics with action: CANCEL"
        actor: ActivityDirector
        preconditions: ["Outing.logistics_status == TRANSPORT_BOOKED"]
        side_effects:
          - "sets Outing.logistics_status = CANCELLED and Outing.cancel_reason = the supplied cancel_reason"
          - "recomputes Vehicle.reserved_ambulatory_seats and Vehicle.reserved_wheelchair_stations (this outing leaves the reserving set, restoring INV_VEHICLE_SEATS)"
          - "increments Vehicle.version by 1"
      - from: READY
        to: CANCELLED
        trigger: "POST /recreation/outings/{outing_id}/logistics with action: CANCEL"
        actor: ActivityDirector
        preconditions: ["Outing.logistics_status == READY"]
        side_effects:
          - "sets Outing.logistics_status = CANCELLED and Outing.cancel_reason = the supplied cancel_reason"
          - "recomputes Vehicle.reserved_ambulatory_seats and Vehicle.reserved_wheelchair_stations"
          - "increments Vehicle.version by 1"

  - entity: Outing
    state_field: consent_status
    shape: cyclic
    dimension: "consent dimension; the second independent state axis on the same Outing row, driven only by OutingConsent decisions and never by a logistics action"
    initial_state: COLLECTING
    terminal_states: []
    transitions:
      - from: COLLECTING
        to: CONSENT_COMPLETE
        trigger: "system event: POST /recreation/outings/{outing_id}/consents/{consent_id}/decision with decision: GRANTED"
        actor: system
        preconditions:
          - "Outing.manifest_count >= 1"
          - "no OutingConsent of this outing has status == DENIED"
          - "every OutingConsent of this outing whose status IN {REQUESTED, GRANTED} has status == GRANTED and effective == true"
        side_effects: ["sets Outing.consent_status = CONSENT_COMPLETE"]
      - from: CONSENT_COMPLETE
        to: COLLECTING
        trigger: "system event: POST /recreation/outings/{outing_id}/consents/{consent_id}/decision with decision: REVOKED, or POST /recreation/outings/{outing_id}/consents added a new REQUESTED consent"
        actor: system
        preconditions:
          - "no OutingConsent of this outing has status == DENIED"
          - "at least one OutingConsent of this outing whose status IN {REQUESTED, GRANTED} fails the GRANTED-and-effective test, or Outing.manifest_count == 0"
        side_effects:
          - "sets Outing.consent_status = COLLECTING"
          - "when Outing.logistics_status == READY it reverts to TRANSPORT_BOOKED"
        note: "closes the COLLECTING -> CONSENT_COMPLETE -> COLLECTING cycle on the consent axis"
      - from: COLLECTING
        to: CONSENT_BLOCKED
        trigger: "system event: POST /recreation/outings/{outing_id}/consents/{consent_id}/decision with decision: DENIED"
        actor: system
        preconditions: ["at least one OutingConsent of this outing has status == DENIED"]
        side_effects: ["sets Outing.consent_status = CONSENT_BLOCKED"]
      - from: CONSENT_COMPLETE
        to: CONSENT_BLOCKED
        trigger: "system event: POST /recreation/outings/{outing_id}/consents/{consent_id}/decision with decision: DENIED"
        actor: system
        preconditions: ["at least one OutingConsent of this outing has status == DENIED"]
        side_effects:
          - "sets Outing.consent_status = CONSENT_BLOCKED"
          - "when Outing.logistics_status == READY it reverts to TRANSPORT_BOOKED"
      - from: CONSENT_BLOCKED
        to: COLLECTING
        trigger: "system event: POST /recreation/outings/{outing_id}/consents/{consent_id}/decision with decision: GRANTED on the last DENIED consent"
        actor: system
        preconditions:
          - "no OutingConsent of this outing has status == DENIED after the decision"
          - "at least one OutingConsent whose status IN {REQUESTED, GRANTED} fails the GRANTED-and-effective test"
        side_effects: ["sets Outing.consent_status = COLLECTING"]
      - from: CONSENT_BLOCKED
        to: CONSENT_COMPLETE
        trigger: "system event: POST /recreation/outings/{outing_id}/consents/{consent_id}/decision with decision: GRANTED on the last DENIED consent"
        actor: system
        preconditions:
          - "no OutingConsent of this outing has status == DENIED after the decision"
          - "Outing.manifest_count >= 1 and every OutingConsent whose status IN {REQUESTED, GRANTED} has status == GRANTED and effective == true"
        side_effects: ["sets Outing.consent_status = CONSENT_COMPLETE"]

  - entity: OutingConsent
    state_field: status
    shape: cyclic
    initial_state: REQUESTED
    terminal_states: []
    transitions:
      - from: REQUESTED
        to: GRANTED
        trigger: "POST /recreation/outings/{outing_id}/consents/{consent_id}/decision with decision: GRANTED"
        actor: ActivityAide
        preconditions:
          - "OutingConsent.status == REQUESTED"
          - "the Outing at OutingConsent.outing_id has logistics_status NOT IN {DEPARTED, RETURNED, CANCELLED}"
        side_effects:
          - "sets OutingConsent.status = GRANTED, OutingConsent.decided_at = current_utc and OutingConsent.expires_on = the supplied expires_on (null when omitted)"
          - "recomputes OutingConsent.effective"
          - "recomputes Outing.roster_count, Outing.manifest_count, Outing.weighted_supervision_load, Outing.required_escorts, Outing.ambulatory_seats_required and Outing.wheelchair_seats_required"
          - "re-derives Outing.consent_status per the consent dimension above"
          - "when Outing.logistics_status == TRANSPORT_BOOKED it recomputes Vehicle.reserved_ambulatory_seats and Vehicle.reserved_wheelchair_stations and increments Vehicle.version by 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /recreation/outings/{outing_id}/consents/{consent_id}/decision with decision: DENIED"
        actor: ActivityAide
        preconditions:
          - "OutingConsent.status == REQUESTED"
          - "the Outing at OutingConsent.outing_id has logistics_status NOT IN {DEPARTED, RETURNED, CANCELLED}"
        side_effects:
          - "sets OutingConsent.status = DENIED and OutingConsent.decided_at = current_utc"
          - "recomputes OutingConsent.effective (false)"
          - "recomputes Outing.manifest_count, Outing.weighted_supervision_load, Outing.required_escorts and the seat requirements (a DENIED consent leaves the manifest)"
          - "re-derives Outing.consent_status to CONSENT_BLOCKED"
      - from: GRANTED
        to: REVOKED
        trigger: "POST /recreation/outings/{outing_id}/consents/{consent_id}/decision with decision: REVOKED"
        actor: ActivityAide
        preconditions:
          - "OutingConsent.status == GRANTED"
          - "the Outing at OutingConsent.outing_id has logistics_status NOT IN {DEPARTED, RETURNED, CANCELLED}"
        side_effects:
          - "sets OutingConsent.status = REVOKED and OutingConsent.decided_at = current_utc"
          - "recomputes OutingConsent.effective (false)"
          - "recomputes Outing.manifest_count, Outing.weighted_supervision_load, Outing.required_escorts and the seat requirements"
          - "re-derives Outing.consent_status; when the outing was READY the logistics dimension reverts to TRANSPORT_BOOKED"
      - from: REVOKED
        to: GRANTED
        trigger: "POST /recreation/outings/{outing_id}/consents/{consent_id}/decision with decision: GRANTED"
        actor: ActivityAide
        preconditions:
          - "OutingConsent.status == REVOKED"
          - "the Outing at OutingConsent.outing_id has logistics_status NOT IN {DEPARTED, RETURNED, CANCELLED}"
        side_effects:
          - "sets OutingConsent.status = GRANTED, OutingConsent.decided_at = current_utc and OutingConsent.expires_on = the supplied expires_on (null when omitted)"
          - "recomputes OutingConsent.effective, the Outing roster/manifest/supervision/seat fields and Outing.consent_status"
        note: "closes the GRANTED -> REVOKED -> GRANTED cycle"
      - from: DENIED
        to: GRANTED
        trigger: "POST /recreation/outings/{outing_id}/consents/{consent_id}/decision with decision: GRANTED"
        actor: ActivityAide
        preconditions:
          - "OutingConsent.status == DENIED"
          - "the Outing at OutingConsent.outing_id has logistics_status NOT IN {DEPARTED, RETURNED, CANCELLED}"
        side_effects:
          - "sets OutingConsent.status = GRANTED, OutingConsent.decided_at = current_utc and OutingConsent.expires_on = the supplied expires_on (null when omitted)"
          - "recomputes OutingConsent.effective, the Outing roster/manifest/supervision/seat fields and Outing.consent_status"

  - entity: Volunteer
    state_field: status
    shape: cyclic
    initial_state: APPLICANT
    terminal_states: [TERMINATED]
    transitions:
      - from: APPLICANT
        to: SCREENING
        trigger: "POST /recreation/volunteers/{volunteer_id}/screening with event_type: BACKGROUND_CHECK_CLEARED"
        actor: VolunteerCoordinator
        preconditions:
          - "Volunteer.status == APPLICANT"
          - "request cleared_on is present"
          - "request cleared_on is a calendar date <= the calendar date of current_utc"
        side_effects:
          - "sets Volunteer.screening_level = BASIC, Volunteer.background_check_cleared_on = the supplied cleared_on and Volunteer.background_check_expires_on = cleared_on + BACKGROUND_CHECK_VALID_DAYS"
          - "sets Volunteer.status = SCREENING"
      - from: SCREENING
        to: CLEARED
        trigger: "POST /recreation/volunteers/{volunteer_id}/screening with event_type: ORIENTATION_COMPLETED"
        actor: VolunteerCoordinator
        preconditions:
          - "Volunteer.status == SCREENING"
          - "Volunteer.background_check_cleared_on is not null"
          - "Volunteer.background_check_expires_on >= the calendar date of current_utc"
        side_effects:
          - "sets Volunteer.orientation_completed_on = the calendar date of current_utc"
          - "sets Volunteer.status = CLEARED"
      - from: CLEARED
        to: EXPIRED
        trigger: "POST /recreation/volunteers/{volunteer_id}/screening with event_type: EXPIRE"
        actor: VolunteerCoordinator
        preconditions:
          - "Volunteer.status == CLEARED"
          - "Volunteer.background_check_expires_on < the calendar date of current_utc"
        side_effects:
          - "sets Volunteer.status = EXPIRED"
          - "every VolunteerAssignment of this volunteer with status IN {PROPOSED, CONFIRMED} transitions to WITHDRAWN with withdrawn_reason = CLEARANCE_EXPIRED"
          - "each VolunteerAssignment that just became WITHDRAWN recomputes Volunteer.scheduled_hours_week"
      - from: EXPIRED
        to: SCREENING
        trigger: "POST /recreation/volunteers/{volunteer_id}/screening with event_type: BACKGROUND_CHECK_CLEARED"
        actor: VolunteerCoordinator
        preconditions:
          - "Volunteer.status == EXPIRED"
          - "request cleared_on is present"
          - "request cleared_on is a calendar date <= the calendar date of current_utc"
        side_effects:
          - "sets Volunteer.screening_level = BASIC, Volunteer.background_check_cleared_on = the supplied cleared_on and Volunteer.background_check_expires_on = cleared_on + BACKGROUND_CHECK_VALID_DAYS from the re-screen"
          - "sets Volunteer.status = SCREENING"
        note: "closes the CLEARED -> EXPIRED -> SCREENING -> CLEARED re-screening cycle"
      - from: CLEARED
        to: SUSPENDED
        trigger: "POST /recreation/volunteers/{volunteer_id}/screening with event_type: SUSPEND"
        actor: VolunteerCoordinator
        preconditions: ["Volunteer.status == CLEARED"]
        side_effects:
          - "sets Volunteer.status = SUSPENDED"
          - "every VolunteerAssignment of this volunteer with status IN {PROPOSED, CONFIRMED} transitions to WITHDRAWN with withdrawn_reason = VOLUNTEER_SUSPENDED"
          - "each VolunteerAssignment that just became WITHDRAWN recomputes Volunteer.scheduled_hours_week"
      - from: SUSPENDED
        to: CLEARED
        trigger: "POST /recreation/volunteers/{volunteer_id}/screening with event_type: REINSTATE"
        actor: VolunteerCoordinator
        preconditions:
          - "Volunteer.status == SUSPENDED"
          - "Volunteer.background_check_expires_on >= the calendar date of current_utc"
          - "Volunteer.orientation_completed_on is not null"
        side_effects: ["sets Volunteer.status = CLEARED"]
        note: "closes the CLEARED -> SUSPENDED -> CLEARED cycle"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /recreation/volunteers/{volunteer_id}/screening with event_type: TERMINATE"
        actor: VolunteerCoordinator
        preconditions: ["Volunteer.status == SUSPENDED"]
        side_effects: ["sets Volunteer.status = TERMINATED"]

  - entity: VolunteerAssignment
    state_field: status
    shape: branching
    initial_state: PROPOSED
    terminal_states: [WITHDRAWN, COMPLETED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "PATCH /recreation/volunteer-assignments/{assignment_id} with status: CONFIRMED"
        actor: VolunteerCoordinator
        preconditions:
          - "VolunteerAssignment.status == PROPOSED"
          - "the ActivitySession at VolunteerAssignment.session_id has status == SCHEDULED"
          - "the Volunteer at VolunteerAssignment.volunteer_id has status == CLEARED"
          - "Volunteer.background_check_expires_on >= the calendar date of ActivitySession.ends_at"
          - "Volunteer.screening_level ranks at or above ActivityProgram.required_screening_level for the session's program, using the order NONE < BASIC < FULL"
          - "when Volunteer.volunteer_type == STUDENT_INTERGENERATIONAL, another VolunteerAssignment on the same session_id has status == CONFIRMED, role_type == PROGRAM_LEAD and a volunteer whose volunteer_type == ADULT_COMMUNITY"
        side_effects:
          - "sets VolunteerAssignment.status = CONFIRMED"
          - "recomputes Volunteer.scheduled_hours_week via calculations.volunteer_hours"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "PATCH /recreation/volunteer-assignments/{assignment_id} with status: WITHDRAWN"
        actor: VolunteerCoordinator
        preconditions: ["VolunteerAssignment.status == PROPOSED"]
        side_effects:
          - "sets VolunteerAssignment.status = WITHDRAWN and VolunteerAssignment.withdrawn_reason = the supplied withdrawn_reason"
          - "recomputes Volunteer.scheduled_hours_week via calculations.volunteer_hours"
      - from: CONFIRMED
        to: WITHDRAWN
        trigger: "PATCH /recreation/volunteer-assignments/{assignment_id} with status: WITHDRAWN"
        actor: VolunteerCoordinator
        preconditions: ["VolunteerAssignment.status == CONFIRMED"]
        side_effects:
          - "sets VolunteerAssignment.status = WITHDRAWN and VolunteerAssignment.withdrawn_reason = the supplied withdrawn_reason"
          - "recomputes Volunteer.scheduled_hours_week via calculations.volunteer_hours"
      - from: CONFIRMED
        to: WITHDRAWN
        trigger: "system event: POST /recreation/sessions/{session_id}/status with action: CANCEL, or POST /recreation/volunteers/{volunteer_id}/screening with event_type SUSPEND or EXPIRE"
        actor: system
        preconditions: ["VolunteerAssignment.status == CONFIRMED"]
        side_effects:
          - "sets VolunteerAssignment.status = WITHDRAWN and VolunteerAssignment.withdrawn_reason = SESSION_CANCELLED, VOLUNTEER_SUSPENDED or CLEARANCE_EXPIRED according to the causing event"
          - "recomputes Volunteer.scheduled_hours_week via calculations.volunteer_hours"
        note: "hop 2 of the session-cancel cascade; hop 3 is the Volunteer.scheduled_hours_week recompute caused by this withdrawal"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "system event: POST /recreation/sessions/{session_id}/status with action: CANCEL, or POST /recreation/volunteers/{volunteer_id}/screening with event_type SUSPEND or EXPIRE"
        actor: system
        preconditions: ["VolunteerAssignment.status == PROPOSED"]
        side_effects:
          - "sets VolunteerAssignment.status = WITHDRAWN and VolunteerAssignment.withdrawn_reason = SESSION_CANCELLED, VOLUNTEER_SUSPENDED or CLEARANCE_EXPIRED according to the causing event"
          - "recomputes Volunteer.scheduled_hours_week via calculations.volunteer_hours"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "system event: POST /recreation/sessions/{session_id}/status with action: CLOSE_DOCUMENTATION"
        actor: system
        preconditions: ["VolunteerAssignment.status == CONFIRMED"]
        side_effects:
          - "sets VolunteerAssignment.status = COMPLETED"
          - "recomputes Volunteer.credited_service_hours and Volunteer.scheduled_hours_week via calculations.volunteer_hours"

  - entity: ResidentCouncilRequest
    state_field: status
    shape: branching
    initial_state: SUBMITTED
    terminal_states: [ADOPTED, DECLINED]
    transitions:
      - from: SUBMITTED
        to: ADOPTED
        trigger: "POST /recreation/council-requests/{request_id}/review with decision: ADOPTED"
        actor: ActivityDirector
        preconditions:
          - "ResidentCouncilRequest.status == SUBMITTED"
          - "ResidentCouncilRequest.vote_count >= COUNCIL_QUORUM (5)"
        side_effects:
          - "sets ResidentCouncilRequest.status = ADOPTED, decision_note and reviewed_by_user_id = X-User-ID"
          - "when requested_program_id is not null, increments ActivityProgram.council_preference_weight by 1 on that program"
          - "every ActivityPlan with status == ACTIVE whose resident's interest_domains contains requested_domain and whose domain_frequency_targets[requested_domain] == 0 transitions ACTIVE -> UNDER_REVISION with review_reason = COUNCIL_INPUT"
          - "each such plan entering UNDER_REVISION sets Resident.care_plan_review_due = true and Resident.enrollment_gate = THERAPIST_REVIEW"
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /recreation/council-requests/{request_id}/review with decision: DECLINED"
        actor: ActivityDirector
        preconditions: ["ResidentCouncilRequest.status == SUBMITTED"]
        side_effects: ["sets ResidentCouncilRequest.status = DECLINED, decision_note and reviewed_by_user_id = X-User-ID"]
      - from: SUBMITTED
        to: DEFERRED
        trigger: "POST /recreation/council-requests/{request_id}/review with decision: DEFERRED"
        actor: ActivityDirector
        preconditions: ["ResidentCouncilRequest.status == SUBMITTED"]
        side_effects: ["sets ResidentCouncilRequest.status = DEFERRED, decision_note and reviewed_by_user_id = X-User-ID"]
      - from: DEFERRED
        to: ADOPTED
        trigger: "POST /recreation/council-requests/{request_id}/review with decision: ADOPTED"
        actor: ActivityDirector
        preconditions:
          - "ResidentCouncilRequest.status == DEFERRED"
          - "ResidentCouncilRequest.vote_count >= COUNCIL_QUORUM (5)"
        side_effects:
          - "sets ResidentCouncilRequest.status = ADOPTED, decision_note and reviewed_by_user_id = X-User-ID"
          - "when requested_program_id is not null, increments ActivityProgram.council_preference_weight by 1 on that program"
          - "every ActivityPlan with status == ACTIVE whose resident's interest_domains contains requested_domain and whose domain_frequency_targets[requested_domain] == 0 transitions ACTIVE -> UNDER_REVISION with review_reason = COUNCIL_INPUT"
          - "each such plan entering UNDER_REVISION sets Resident.care_plan_review_due = true and Resident.enrollment_gate = THERAPIST_REVIEW"
      - from: DEFERRED
        to: DECLINED
        trigger: "POST /recreation/council-requests/{request_id}/review with decision: DECLINED"
        actor: ActivityDirector
        preconditions: ["ResidentCouncilRequest.status == DEFERRED"]
        side_effects: ["sets ResidentCouncilRequest.status = DECLINED, decision_note and reviewed_by_user_id = X-User-ID"]

  - entity: SurveyPacket
    state_field: status
    shape: cyclic
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: COMPILED
        trigger: "POST /recreation/survey-packets/{packet_id}/compile"
        actor: ComplianceOfficer or ActivityDirector
        preconditions:
          - "SurveyPacket.status == OPEN"
          - "SurveyPacket.window_end <= the calendar date of current_utc"
        side_effects:
          - "runs calculations.survey_provision_score and stores offered_sessions_targeted, offered_sessions_delivered, base_score, domain_coverage_penalty, refusal_penalty, preliminary_score, deficiency_flags and provision_score"
          - "sets SurveyPacket.compiled_by_user_id = X-User-ID and SurveyPacket.status = COMPILED"
      - from: AMENDED
        to: COMPILED
        trigger: "POST /recreation/survey-packets/{packet_id}/compile"
        actor: ComplianceOfficer or ActivityDirector
        preconditions:
          - "SurveyPacket.status == AMENDED"
          - "SurveyPacket.window_end <= the calendar date of current_utc"
        side_effects:
          - "re-runs calculations.survey_provision_score and overwrites every stored score field and deficiency_flags"
          - "sets SurveyPacket.compiled_by_user_id = X-User-ID and SurveyPacket.status = COMPILED"
        note: "closes the COMPILED -> ATTESTED -> AMENDED -> COMPILED cycle"
      - from: COMPILED
        to: ATTESTED
        trigger: "POST /recreation/survey-packets/{packet_id}/attestation with action: ATTEST"
        actor: ComplianceOfficer
        preconditions:
          - "SurveyPacket.status == COMPILED"
          - "X-User-ID != SurveyPacket.compiled_by_user_id (segregation of duties)"
          - "when SurveyPacket.deficiency_flags is non-empty, request remediation_note is present and non-empty (validations priority 43)"
        side_effects:
          - "sets SurveyPacket.status = ATTESTED, SurveyPacket.attested_by_user_id = X-User-ID and SurveyPacket.remediation_note = the supplied remediation_note"
      - from: ATTESTED
        to: AMENDED
        trigger: "POST /recreation/survey-packets/{packet_id}/attestation with action: AMEND"
        actor: ComplianceOfficer
        preconditions: ["SurveyPacket.status == ATTESTED"]
        side_effects:
          - "sets SurveyPacket.status = AMENDED, increments SurveyPacket.amendment_count by 1 and clears SurveyPacket.attested_by_user_id to null"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: plan-create-stale-resident
    parent_entity: Resident
    write_endpoint: "POST /recreation/activity-plans"
    occ_field: "expected_resident_version"
    description: |
      Creating an ActivityPlan against a Resident whose version has advanced since the client last
      read it is rejected. A second DRAFT plan for the same resident is legitimate under §1.2 —
      activating it supersedes the prior live plan — so the write is not blocked by any state
      precondition; the stale-version check is what tells the caller their view of the resident
      (including supervision_tier, enrollment_gate and the existing live plan) predates another
      authoring pass.
    error_id: ERR_STALE_RESIDENT_VERSION
    http_status: 412
  - rule_id: transport-booking-stale-vehicle
    parent_entity: Vehicle
    write_endpoint: "POST /recreation/outings/{outing_id}/transport-booking"
    occ_field: "expected_vehicle_version"
    description: |
      Booking transport against a Vehicle whose version has advanced since the client last read it
      is rejected. Two bookings on the same vehicle for non-overlapping windows are both legitimate
      under §1.2 and both would succeed on their own, so no state precondition covers this write;
      the stale-version check is what tells the caller that the free seat/station pool they sized
      the manifest against has already been consumed or released by another booking pass.
    error_id: ERR_STALE_VEHICLE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: supervision_tier
    trigger: "on POST /recreation/residents/{resident_id}/assessments, and whenever any calculation or endpoint reads Resident.supervision_tier"
    algorithm: threshold
    formula: |
      # Step 1 — pick the governing assessment (selector is fully pinned).
      #   candidate set: every ResidentAssessment with resident_id == Resident.id
      #   ranking:       effective_date DESC
      #   tie-break:     created_at DESC
      #   empty set:     supervision_tier = null and Resident.cognitive_level /
      #                  functional_mobility / interest_domains stay null / null / []
      governing = first(candidates ordered by (effective_date DESC, created_at DESC))
      # Step 2 — map each axis to an integer band.
      cognition_band = COGNITION_BAND[governing.cognitive_level]
      function_band  = FUNCTION_BAND[governing.functional_mobility]
      # Step 3 — the resident sits in the WORSE of the two bands.
      supervision_tier = "TIER_" + str(max(cognition_band, function_band))
    input_set: "all ResidentAssessment rows for the resident; no status filter exists because assessments are immutable and never deleted. `superseded` is a derived label on the losers of Step 1, not a filter input."
    constants:
      COGNITION_BAND: { INTACT: 1, MILD_IMPAIRMENT: 1, MODERATE_IMPAIRMENT: 2, SEVERE_IMPAIRMENT: 3 }
      FUNCTION_BAND: { INDEPENDENT: 1, ASSIST_1: 1, ASSIST_2: 2, WHEELCHAIR_DEPENDENT: 2, BEDBOUND: 3 }
      TIER_WEIGHT: { TIER_1: 1.0, TIER_2: 1.5, TIER_3: 3.0 }
    precision: "integer band; no rounding"

  - name: resident_engagement_index
    trigger: "on PATCH /recreation/participation/{record_id} with outcome ATTENDED or REFUSED"
    algorithm: weighted_scoring
    formula: |
      # Window selector (fully pinned):
      #   candidate set: ParticipationRecord rows with resident_id == Resident.id and
      #                  outcome IN {ATTENDED, REFUSED}
      #   ranking:       the record's ActivitySession.starts_at DESC
      #   tie-break:     ParticipationRecord.created_at DESC
      #   window:        the first ENGAGEMENT_WINDOW_SIZE candidates after ranking
      #   empty set:     engagement_index = 0.0
      window = first ENGAGEMENT_WINDOW_SIZE of candidates ordered by (session.starts_at DESC, created_at DESC)
      if len(window) == 0:
          engagement_index = 0.0
      else:
          points = sum(ENGAGEMENT_POINTS[r.engagement_level] if r.outcome == ATTENDED else 0
                       for r in window)
          engagement_index = round_half_up(points / (MAX_ENGAGEMENT_POINTS * len(window)), 3)
    input_set: "ParticipationRecord rows whose outcome IN {ATTENDED, REFUSED}. PLANNED, ABSENT and VOID records are excluded; FINALIZED records enter through ParticipationRecord.outcome (== finalized_from)."
    constants:
      ENGAGEMENT_POINTS: { NONE: 0, PASSIVE_OBSERVER: 1, PARTIAL: 2, ACTIVE: 3, LEADING: 4 }
      MAX_ENGAGEMENT_POINTS: 4
      ENGAGEMENT_WINDOW_SIZE: 10
    precision: "3 decimal places, round_half_up"

  - name: resident_refusal_streak
    trigger: "on PATCH /recreation/participation/{record_id} with any outcome, and on the system PLANNED -> VOID transition"
    algorithm: chronological
    formula: |
      # Walk the resident's documented records newest-first and count the leading REFUSED run.
      #   candidate set: ParticipationRecord rows with resident_id == Resident.id and
      #                  outcome IN {ATTENDED, REFUSED, ABSENT}   (VOID and PLANNED excluded)
      #   ranking:       the record's ActivitySession.starts_at DESC
      #   tie-break:     ParticipationRecord.created_at DESC
      streak = 0
      for r in candidates ordered by (session.starts_at DESC, created_at DESC):
          if r.outcome == REFUSED:
              streak = streak + 1
          else:
              break          # an ATTENDED or ABSENT record interrupts the run
      refusal_streak = streak
      # REFUSAL_REVIEW_THRESHOLD is the >= breakpoint that fires the ACTIVE -> UNDER_REVISION
      # system transition in §1.2; it is a >= test, so a streak of exactly 3 fires it.
    input_set: "documented ParticipationRecord rows only (outcome IN {ATTENDED, REFUSED, ABSENT}); VOID records are removed from the walk entirely rather than treated as interrupters"
    constants:
      REFUSAL_REVIEW_THRESHOLD: 3
    precision: "integer count"

  - name: plan_attainment
    trigger: "on POST /recreation/sessions/{session_id}/enrollments, on PATCH /recreation/participation/{record_id}, on the system PLANNED -> VOID transition, and on ActivityPlan transitions into ACTIVE"
    algorithm: aggregation
    formula: |
      # Runs only for an ActivityPlan whose status IN {ACTIVE, UNDER_REVISION}. A SUPERSEDED,
      # CLOSED or DRAFT plan is never recomputed; its stored values are frozen.
      cycle_lo = plan.cycle_start_at                       # inclusive
      cycle_hi = plan.cycle_start_at + CYCLE_DAYS days     # exclusive
      scored_domains = [D for D in DOMAINS if plan.domain_frequency_targets[D] > 0]
      if len(scored_domains) == 0:
          # unreachable through the API: validations priority 9 rejects an all-zero target map,
          # but the guard is pinned so the formula is total.
          return 0.0
      ratio_sum = 0.0
      for D in scored_domains:
          target_D = plan.domain_frequency_targets[D]
          hits_D = count(ParticipationRecord r WHERE
                           r.resident_id == plan.resident_id
                           AND ActivitySession(r.session_id).program.domain == D
                           AND cycle_lo <= ActivitySession(r.session_id).starts_at < cycle_hi
                           AND <VARIANT PREDICATE>)
          ratio_sum = ratio_sum + min(1.0, hits_D / target_D)   # per-domain cap BEFORE averaging
      attainment = round_half_up(100 * ratio_sum / len(scored_domains), 1)
      # Pinned order: cap each domain ratio at 1.0, then average, then round ONCE at the end.
      # Averaging uncapped ratios and capping the average afterwards is the wrong order.
    input_set: "ParticipationRecord rows for the plan's resident whose session starts inside the half-open 28-day cycle window [cycle_start_at, cycle_start_at + 28 days). VOID and PLANNED records never qualify under either variant predicate."
    constants:
      CYCLE_DAYS: 28
      DOMAINS: [SOCIAL, COGNITIVE, PHYSICAL, SPIRITUAL, CREATIVE]
    precision: "1 decimal place, round_half_up"
    variants:
      - name: credited_attainment
        when: "stored in ActivityPlan.credited_attainment_pct; the clinical view used for care-plan progress"
        difference: "VARIANT PREDICATE is `r.outcome == ATTENDED AND r.engagement_level IN {PARTIAL, ACTIVE, LEADING}` — a body in the room with engagement NONE or PASSIVE_OBSERVER earns nothing"
      - name: offered_attainment
        when: "stored in ActivityPlan.offered_attainment_pct; the regulatory view consumed by calculations.survey_provision_score"
        difference: "VARIANT PREDICATE is `r.outcome IN {ATTENDED, REFUSED}` — the facility gets credit for offering the opportunity regardless of engagement, and a documented refusal counts as an offer; ABSENT never counts under either variant"

  - name: session_staffing_requirement
    trigger: "on POST /recreation/sessions/{session_id}/enrollments and on the system PLANNED -> VOID transition from a session cancel"
    algorithm: weighted_scoring
    formula: |
      # Inputs: the session's non-VOID roster grouped by Resident.supervision_tier, and the
      # program's staffing_ratio_denominator.
      for T in [TIER_1, TIER_2, TIER_3]:
          count_T    = count(ParticipationRecord r WHERE r.session_id == session.id
                             AND r.status != VOID
                             AND Resident(r.resident_id).supervision_tier == T)
          subtotal_T = round_half_up(count_T * TIER_WEIGHT[T], 2)
      weighted_supervision_load = round_half_up(subtotal_TIER_1 + subtotal_TIER_2 + subtotal_TIER_3, 2)
      required_staff_count = ceil(weighted_supervision_load / program.staffing_ratio_denominator)
      # PINNED ROUNDING/CEILING ORDER: round each tier subtotal to 2 dp, SUM the three subtotals,
      # divide ONCE, then apply a SINGLE ceil. Applying ceil per tier and summing the ceilings
      # (ceil(2.0/4) + ceil(1.5/4) + ceil(3.0/4) = 3 instead of ceil(6.5/4) = 2) is the wrong
      # order and is explicitly forbidden.
      # Enrollment gate: the enrollment is admitted only while
      #   required_staff_count <= session.assigned_staff_count      (<=, not <)
      # so the load value that divides exactly into assigned_staff_count is still admissible.
    input_set: "ParticipationRecord rows of this session with status != VOID; residents without an assessment cannot be enrolled (validations priority 29), so supervision_tier is never null here"
    constants:
      TIER_WEIGHT: { TIER_1: 1.0, TIER_2: 1.5, TIER_3: 3.0 }
    precision: "weighted_supervision_load 2 decimal places round_half_up; required_staff_count integer via a single ceil"

  - name: outing_supervision_requirement
    trigger: "on POST /recreation/outings, on POST /recreation/outings/{outing_id}/consents, on POST /recreation/outings/{outing_id}/consents/{consent_id}/decision, and on POST /recreation/outings/{outing_id}/logistics with action SET_ESCORTS"
    algorithm: threshold
    formula: |
      manifest = [OutingConsent c WHERE c.outing_id == outing.id AND c.status IN {REQUESTED, GRANTED}]
      weighted_supervision_load = round_half_up(
          sum(TIER_WEIGHT[Resident(c.resident_id).supervision_tier] for c in manifest), 2)
      base_escorts = ceil(weighted_supervision_load / OUTING_RATIO_DENOMINATOR)
      if any(Resident(c.resident_id).supervision_tier == TIER_3 for c in manifest):
          required_escorts = max(base_escorts, TIER_3_ESCORT_FLOOR)
      else:
          required_escorts = base_escorts
      # Readiness gate: FINALIZE is admitted only while escort_count >= required_escorts (>=, not >).
    input_set: "OutingConsent rows of this outing with status IN {REQUESTED, GRANTED}; DENIED and REVOKED consents leave the manifest and stop consuming supervision"
    constants:
      TIER_WEIGHT: { TIER_1: 1.0, TIER_2: 1.5, TIER_3: 3.0 }
      OUTING_RATIO_DENOMINATOR: 4
      TIER_3_ESCORT_FLOOR: 2
    precision: "weighted_supervision_load 2 decimal places round_half_up; required_escorts integer via a single ceil then a floor clamp"

  - name: outing_seat_allocation
    trigger: "on POST /recreation/outings/{outing_id}/transport-booking, and re-evaluated on every OutingConsent decision while Outing.logistics_status == TRANSPORT_BOOKED"
    algorithm: waterfall_allocation
    formula: |
      manifest = [OutingConsent c WHERE c.outing_id == outing.id AND c.status IN {REQUESTED, GRANTED}]
      wheelchair_seats_required = count(c in manifest WHERE
                                        Resident(c.resident_id).functional_mobility == WHEELCHAIR_DEPENDENT)
      ambulatory_seats_required = count(c in manifest WHERE
                                        Resident(c.resident_id).functional_mobility != WHEELCHAIR_DEPENDENT) \
                                  + outing.escort_count
      # Free pool on the vehicle EXCLUDES this outing's own current reservation, so re-evaluation
      # is idempotent.
      free_stations  = vehicle.wheelchair_stations - vehicle.reserved_wheelchair_stations
      free_ambulatory = vehicle.ambulatory_seats  - vehicle.reserved_ambulatory_seats
      # Waterfall: wheelchair riders fill tie-down stations first and may NEVER take a forward seat.
      wheelchair_shortfall = max(0, wheelchair_seats_required - free_stations)
      # Only stations left over AFTER wheelchair demand can flip up into forward seats, capped.
      stations_left  = max(0, free_stations - wheelchair_seats_required)
      converted_seats = min(stations_left, MAX_STATION_CONVERSIONS)
      ambulatory_shortfall = max(0, ambulatory_seats_required - (free_ambulatory + converted_seats))
      seat_shortfall_total = wheelchair_shortfall + ambulatory_shortfall
      # Booking gate: admitted only while seat_shortfall_total == 0.
    input_set: "OutingConsent rows of this outing with status IN {REQUESTED, GRANTED}, plus Outing.escort_count, plus the vehicle's free pool net of Outings whose logistics_status IN {TRANSPORT_BOOKED, READY, DEPARTED} other than this one"
    constants:
      MAX_STATION_CONVERSIONS: 2
    precision: "integer seats; no rounding"

  - name: volunteer_hours
    trigger: "on POST /recreation/volunteer-assignments, on PATCH /recreation/volunteer-assignments/{assignment_id}, on the system CONFIRMED -> COMPLETED transition, and on every system withdrawal cascade"
    algorithm: aggregation
    formula: |
      # A VolunteerAssignment's duration is
      #   hours = round_half_up((session.ends_at - session.starts_at) / 3600 seconds, 2)
      # ISO week window for the scheduled variant:
      #   week_lo = Monday 00:00:00Z of the ISO week containing current_utc   (inclusive)
      #   week_hi = week_lo + 7 days                                          (exclusive)
      total = round_half_up(sum(hours(a) for a in assignments matching <VARIANT PREDICATE>), 2)
      # Weekly cap gate on POST /recreation/volunteer-assignments: the new assignment is admitted
      # only while scheduled_hours_week AFTER including the new row is <= VOLUNTEER_WEEKLY_HOUR_CAP
      # (<=, not <), so a volunteer may reach exactly 8.00 hours but not 8.01.
    input_set: "VolunteerAssignment rows with volunteer_id == Volunteer.id; the variant predicate supplies both the status filter and the time window"
    constants:
      VOLUNTEER_WEEKLY_HOUR_CAP: 8.0
    precision: "2 decimal places, round_half_up"
    variants:
      - name: scheduled_hours
        when: "stored in Volunteer.scheduled_hours_week and used by the weekly-cap gate at assignment creation"
        difference: "VARIANT PREDICATE is `a.status IN {PROPOSED, CONFIRMED} AND week_lo <= session(a).starts_at < week_hi` — a forward-looking commitment view that DROPS an assignment the moment it becomes COMPLETED or WITHDRAWN"
      - name: credited_service_hours
        when: "stored in Volunteer.credited_service_hours and reported as volunteer service in the survey packet"
        difference: "VARIANT PREDICATE is `a.status == COMPLETED AND ActivitySession(a.session_id).status == DOCUMENTED` with no time window at all — a lifetime earned-service view that IGNORES every PROPOSED/CONFIRMED row the scheduled variant counts"

  - name: survey_provision_score
    trigger: "on POST /recreation/survey-packets/{packet_id}/compile (both the OPEN -> COMPILED and the AMENDED -> COMPILED transitions)"
    algorithm: weighted_scoring
    formula: |
      # Window: the packet's inclusive calendar-date range [window_start, window_end]. A session or
      # plan cycle is "in window" when the UTC calendar date of the instant satisfies
      #   window_start <= date(instant) <= window_end.
      #
      # Cohort: every Resident with status == ADMITTED that holds at least one ActivityPlan with
      # status IN {ACTIVE, UNDER_REVISION} whose cycle_start_at date is in window — the
      # "surveyed cohort". Each cohort resident contributes exactly ONE plan, the "governing plan":
      #   candidates ordered by cycle_start_at DESC, tie-break created_at DESC.
      cohort = surveyed cohort ordered by Resident.created_at ASC
      #
      # STEP 0 — session counters (reported, not scored)
      offered_sessions_targeted  = sum(governing_plan(r).target_total_sessions for r in cohort)
      offered_sessions_delivered = count(ParticipationRecord p WHERE
                                     p.resident_id IN cohort
                                     AND p.outcome IN {ATTENDED, REFUSED}
                                     AND date(ActivitySession(p.session_id).starts_at) in window)
      #
      # STEP 1 — base_score, from the OFFERED variant only, never the credited variant
      if len(cohort) == 0:
          base_score = 0.0
      else:
          base_score = round_half_up(
              sum(governing_plan(r).offered_attainment_pct for r in cohort) / len(cohort), 1)
      #
      # STEP 2 — penalties, each computed from RAW COUNTS, never from a flag
      unmet_domain_count = count over the cohort of (resident, domain) pairs where
                           governing_plan(resident).domain_frequency_targets[domain] > 0 AND the
                           resident logged ZERO qualifying records in that domain inside the plan's
                           cycle (qualifying := outcome IN {ATTENDED, REFUSED})
      unaddressed_refusal_count = count of residents in the cohort with
                           care_plan_review_due == true AND enrollment_gate == THERAPIST_REVIEW
      unscreened_volunteer_count = count of VolunteerAssignment rows with
                           status IN {CONFIRMED, COMPLETED}, whose session's starts_at date is in
                           window, and whose Volunteer.status != CLEARED at compile time
      domain_coverage_penalty = round_half_up(unmet_domain_count * DOMAIN_PENALTY, 1)
      refusal_penalty         = round_half_up(unaddressed_refusal_count * REFUSAL_PENALTY_PER_RESIDENT, 1)
      #
      # STEP 3 — preliminary_score
      preliminary_score = round_half_up(
          max(0.0, base_score - domain_coverage_penalty - refusal_penalty), 1)
      #
      # STEP 4 — deficiency_flags, derived ONLY from preliminary_score and the Step-2 raw counts.
      #          Emitted in ASCENDING flag-code string order.
      flags = []
      if preliminary_score < F248_THRESHOLD:    flags += ["F248_INSUFFICIENT_FREQUENCY"]
      if unaddressed_refusal_count > 0:         flags += ["F249_UNADDRESSED_REFUSAL"]
      if unscreened_volunteer_count > 0:        flags += ["F250_UNSCREENED_VOLUNTEER"]
      deficiency_flags = sorted(flags)
      #
      # STEP 5 — provision_score
      provision_score = round_half_up(
          max(0.0, preliminary_score - DEFICIENCY_PENALTY * len(deficiency_flags)), 1)
      #
      # PINNED EVALUATION ORDER — exactly five scored steps, each consuming ONLY earlier steps'
      # outputs:  base_score -> penalties -> preliminary_score -> deficiency_flags -> provision_score.
      # The F248 test reads preliminary_score, NEVER base_score and NEVER provision_score, and there
      # is NO second pass: subtracting DEFICIENCY_PENALTY must not re-open the F248 test and append
      # another flag. Testing F248 against base_score (before the penalties) is the wrong order and
      # produces a strictly smaller flag set and a strictly larger provision_score.
    input_set: "Residents with status == ADMITTED holding an ActivityPlan in status ACTIVE or UNDER_REVISION whose cycle_start_at date falls inside the inclusive packet window; ON_LEAVE and DISCHARGED residents and DRAFT/SUPERSEDED/CLOSED plans are excluded from every step, including the Step-0 counters"
    constants:
      DOMAIN_PENALTY: 5.0
      REFUSAL_PENALTY_PER_RESIDENT: 2.0
      DEFICIENCY_PENALTY: 3.0
      F248_THRESHOLD: 50.0
    precision: "1 decimal place, round_half_up at every named step; the max(0.0, ...) clamp is applied after each subtraction"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; lower number wins)
#
# Every write endpoint evaluates these rules in strict ascending `priority` order and returns the
# FIRST violated rule's error_id. Priorities are globally distinct integers so that any pair of
# rules violated by one and the same request has an unambiguous winner. Domain ordering inside the business
# band: temporal conflicts -> resident/volunteer safety and compliance -> referential integrity ->
# capacity constraints -> staffing/quota (the scarce-resource checks run last, exactly as a
# fiscal band would).
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID request headers are both present and X-User-Role is one of the seven role names declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the supplied X-User-Role appears in the target endpoint's `roles:` list in §1.5. This outranks every existence check, so an unauthorized role probing a non-existent id learns nothing about whether that id exists. Ownership is enforced in the same rule for the two entity-backed roles of §1.7: role Volunteer may only read or act on VolunteerAssignment rows whose volunteer_id equals X-User-ID, and role CouncilRepresentative may only create or read ResidentCouncilRequest rows whose resident_id equals X-User-ID. An ownership mismatch returns ERR_UNAUTHORIZED (403), never a 404."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "segregation of duties on attestation: on action ATTEST the acting X-User-ID MUST differ from SurveyPacket.compiled_by_user_id — the operator who compiled the packet may never attest to it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /recreation/survey-packets/{packet_id}/attestation with action ATTEST"

  - priority: 4
    category: auth
    check: "segregation of duties on gate override: when `gate_override_reason` is supplied, the acting X-User-ID MUST differ from the `assessed_by_user_id` of the ResidentAssessment referenced by the resident's live ActivityPlan.source_assessment_id — a therapist may not clear a review gate that rests on their own assessment"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /recreation/sessions/{session_id}/enrollments"

  - priority: 5
    category: existence
    check: "every id in the request PATH resolves to a live row, checked strictly left-to-right. Segment-to-error mapping: resident_id -> ERR_RESIDENT_NOT_FOUND, plan_id -> ERR_PLAN_NOT_FOUND, session_id -> ERR_SESSION_NOT_FOUND, record_id -> ERR_PARTICIPATION_RECORD_NOT_FOUND, program_id -> ERR_PROGRAM_NOT_FOUND, room_id -> ERR_ROOM_NOT_FOUND, volunteer_id -> ERR_VOLUNTEER_NOT_FOUND, assignment_id -> ERR_ASSIGNMENT_NOT_FOUND, vehicle_id -> ERR_VEHICLE_NOT_FOUND, outing_id -> ERR_OUTING_NOT_FOUND, consent_id -> ERR_CONSENT_NOT_FOUND, request_id -> ERR_COUNCIL_REQUEST_NOT_FOUND, packet_id -> ERR_SURVEY_PACKET_NOT_FOUND"
    error_id: ERR_RESIDENT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying a path id"

  - priority: 6
    category: existence
    check: "every FK supplied in the request BODY resolves to a live row, checked in the order the fields are declared in §1.5's `input:` list. Field-to-error mapping: resident_id -> ERR_RESIDENT_NOT_FOUND, source_assessment_id -> ERR_ASSESSMENT_NOT_FOUND, program_id -> ERR_PROGRAM_NOT_FOUND, room_id -> ERR_ROOM_NOT_FOUND, vehicle_id -> ERR_VEHICLE_NOT_FOUND, volunteer_id -> ERR_VOLUNTEER_NOT_FOUND, session_id -> ERR_SESSION_NOT_FOUND, requested_program_id -> ERR_PROGRAM_NOT_FOUND"
    error_id: ERR_PROGRAM_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints accepting a FK in the body"

  - priority: 7
    category: existence
    check: "nested-child ownership: a child id in the path MUST belong to the parent id earlier in the same path. `consent_id` must satisfy OutingConsent.outing_id == the path outing_id, otherwise ERR_CONSENT_NOT_FOUND (never ERR_OUTING_NOT_FOUND, and never a 403)."
    error_id: ERR_CONSENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /recreation/outings/{outing_id}/consents/{consent_id}/decision"

  - priority: 8
    category: existence
    check: "request body conforms to the endpoint's `input:` schema: every non-optional field present and non-null, every enum value inside its declared value set, every integer/number within its declared range, no unknown fields, and every array free of duplicates where §1.1 declares `no duplicates`"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 9
    category: business_constraint
    check: "ActivityPlan.domain_frequency_targets carries exactly the five keys SOCIAL, COGNITIVE, PHYSICAL, SPIRITUAL and CREATIVE, each value an integer in 0..20, and the sum of the five values is >= 1 — an all-zero target map is rejected so calculations.plan_attainment always has at least one scored domain"
    error_id: ERR_PLAN_TARGETS_INVALID
    http_status: 422
    applies_to: "POST /recreation/activity-plans"

  - priority: 10
    category: state
    check: "the requested ActivityPlan transition is declared for the plan's current status in §1.2 (e.g. REACTIVATE is only valid from UNDER_REVISION; nothing is valid from SUPERSEDED or CLOSED)"
    error_id: ERR_PLAN_INVALID_STATE
    http_status: 409
    applies_to: "POST /recreation/activity-plans/{plan_id}/transition"

  - priority: 11
    category: state
    check: "the ActivitySession is in a status that admits the requested operation: START only from SCHEDULED, CLOSE_DOCUMENTATION only from IN_PROGRESS, CANCEL only from SCHEDULED or IN_PROGRESS, enrollment only while SCHEDULED, volunteer assignment only while SCHEDULED. This state rule OUTRANKS every capacity and staffing check, so enrolling into a CANCELLED session returns ERR_SESSION_INVALID_STATE even when the same request would also breach the staffing ratio."
    error_id: ERR_SESSION_INVALID_STATE
    http_status: 409
    applies_to: "POST /recreation/sessions/{session_id}/status, POST /recreation/sessions/{session_id}/enrollments, POST /recreation/volunteer-assignments"

  - priority: 12
    category: state
    check: "the ParticipationRecord being documented is still PLANNED; ATTENDED, REFUSED, ABSENT, FINALIZED and VOID records reject any further documentation (documentation is one-shot, so replaying the same PATCH fails the second time)"
    error_id: ERR_PARTICIPATION_INVALID_STATE
    http_status: 409
    applies_to: "PATCH /recreation/participation/{record_id}"

  - priority: 13
    category: state
    check: "the requested Outing logistics action is declared for the outing's current logistics_status in §1.2 (transport-booking only from PLANNING, FINALIZE only from TRANSPORT_BOOKED, DEPART only from READY, RETURN only from DEPARTED, CANCEL only from PLANNING/TRANSPORT_BOOKED/READY); consent collection is closed once logistics_status IN {DEPARTED, RETURNED, CANCELLED}"
    error_id: ERR_OUTING_INVALID_STATE
    http_status: 409
    applies_to: "POST /recreation/outings/{outing_id}/transport-booking, POST /recreation/outings/{outing_id}/logistics, POST /recreation/outings/{outing_id}/consents, POST /recreation/outings/{outing_id}/consents/{consent_id}/decision"

  - priority: 14
    category: state
    check: "the requested consent decision is declared for the consent's current status in §1.2: GRANTED from REQUESTED/REVOKED/DENIED, DENIED from REQUESTED, REVOKED only from GRANTED (a DENIED consent cannot be revoked)"
    error_id: ERR_CONSENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /recreation/outings/{outing_id}/consents/{consent_id}/decision"

  - priority: 15
    category: state
    check: "the screening event_type is declared for the volunteer's current status in §1.2: BACKGROUND_CHECK_CLEARED from APPLICANT/EXPIRED, ORIENTATION_COMPLETED from SCREENING, EXPIRE and SUSPEND from CLEARED, REINSTATE and TERMINATE from SUSPENDED; nothing from TERMINATED"
    error_id: ERR_VOLUNTEER_INVALID_STATE
    http_status: 409
    applies_to: "POST /recreation/volunteers/{volunteer_id}/screening"

  - priority: 16
    category: state
    check: "the requested VolunteerAssignment status change is declared in §1.2: CONFIRMED only from PROPOSED, WITHDRAWN from PROPOSED or CONFIRMED; WITHDRAWN and COMPLETED are terminal"
    error_id: ERR_ASSIGNMENT_INVALID_STATE
    http_status: 409
    applies_to: "PATCH /recreation/volunteer-assignments/{assignment_id}"

  - priority: 17
    category: state
    check: "the council request is in SUBMITTED or DEFERRED; ADOPTED and DECLINED are terminal and reject any further review, and DEFERRED cannot be re-deferred"
    error_id: ERR_COUNCIL_REQUEST_INVALID_STATE
    http_status: 409
    applies_to: "POST /recreation/council-requests/{request_id}/review"

  - priority: 18
    category: state
    check: "the SurveyPacket is in a status that admits the operation: compile only from OPEN or AMENDED, ATTEST only from COMPILED, AMEND only from ATTESTED"
    error_id: ERR_PACKET_INVALID_STATE
    http_status: 409
    applies_to: "POST /recreation/survey-packets/{packet_id}/compile, POST /recreation/survey-packets/{packet_id}/attestation"

  - priority: 19
    category: state
    check: "optimistic concurrency on Resident: the request's `expected_resident_version` equals the current Resident.version (see §1.2.1 rule plan-create-stale-resident)"
    error_id: ERR_STALE_RESIDENT_VERSION
    http_status: 412
    applies_to: "POST /recreation/activity-plans"

  - priority: 20
    category: state
    check: "optimistic concurrency on Vehicle: the request's `expected_vehicle_version` equals the current Vehicle.version (see §1.2.1 rule transport-booking-stale-vehicle)"
    error_id: ERR_STALE_VEHICLE_VERSION
    http_status: 412
    applies_to: "POST /recreation/outings/{outing_id}/transport-booking"

  - priority: 21
    category: business_temporal
    check: "interval sanity: ActivitySession.ends_at is strictly after starts_at, Outing.return_at is strictly after departure_at, and SurveyPacket.window_end is >= window_start; a zero-length session interval is rejected while a single-day packet window is accepted"
    error_id: ERR_TIME_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /recreation/sessions, POST /recreation/outings, POST /recreation/survey-packets"

  - priority: 22
    category: business_temporal
    check: "a newly created ActivitySession or Outing must start at or after the logical clock: starts_at >= current_utc and departure_at >= current_utc (>=, so a slot pinned exactly to current_utc is accepted)"
    error_id: ERR_SESSION_IN_PAST
    http_status: 409
    applies_to: "POST /recreation/sessions, POST /recreation/outings"

  - priority: 23
    category: business_temporal
    check: "the logical clock is monotonic: the supplied current_utc must be >= the clock's present value, so time never rewinds under a test"
    error_id: ERR_CLOCK_REWIND_FORBIDDEN
    http_status: 409
    applies_to: "POST /recreation/_clock/set_current_utc"

  - priority: 24
    category: business_temporal
    check: "survey windows never overlap: the new packet's inclusive [window_start, window_end] must not intersect the window of any existing SurveyPacket in status OPEN, COMPILED, ATTESTED or AMENDED. Touching windows are legal — a packet ending 2026-08-31 and another starting 2026-09-01 do not overlap."
    error_id: ERR_PACKET_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /recreation/survey-packets"

  - priority: 25
    category: business_temporal
    check: "room turnover: the new session's [starts_at, ends_at) interval, widened by the room's buffer_minutes on BOTH sides, must not intersect the interval of any other session in the same room whose status IN {SCHEDULED, IN_PROGRESS, DOCUMENTED}. With buffer_minutes = 0 a session starting exactly when another ends is legal; with buffer_minutes = 15 it is not."
    error_id: ERR_ROOM_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /recreation/sessions"

  - priority: 26
    category: business_temporal
    check: "vehicle turnaround: the outing's [departure_at, return_at) interval, widened forward by the vehicle's turnaround_minutes, must not intersect the interval of any other outing on the same vehicle whose logistics_status IN {TRANSPORT_BOOKED, READY, DEPARTED, RETURNED}"
    error_id: ERR_VEHICLE_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /recreation/outings/{outing_id}/transport-booking"

  - priority: 27
    category: business_temporal
    check: "a volunteer is never double-booked: the target session's [starts_at, ends_at) must not intersect the interval of any session the same volunteer already holds an assignment on with status IN {PROPOSED, CONFIRMED}. Back-to-back sessions (gap zero) are legal for volunteers — there is no buffer on people."
    error_id: ERR_VOLUNTEER_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /recreation/volunteer-assignments"

  - priority: 28
    category: business_safety
    check: "only an ADMITTED resident may be programmed: plan creation, plan ACTIVATE, enrollment and outing consent all require Resident.status == ADMITTED (ON_LEAVE and DISCHARGED are both refused). This is the error a plan ACTIVATE returns when the §1.2 DRAFT -> ACTIVE precondition `Resident.status == ADMITTED` fails — never ERR_PLAN_INVALID_STATE, which speaks only about the plan's own status."
    error_id: ERR_RESIDENT_NOT_ADMITTED
    http_status: 409
    applies_to: "POST /recreation/activity-plans, POST /recreation/activity-plans/{plan_id}/transition with action ACTIVATE, POST /recreation/sessions/{session_id}/enrollments, POST /recreation/outings/{outing_id}/consents"

  - priority: 29
    category: business_safety
    check: "the resident has at least one ResidentAssessment (so Resident.supervision_tier is non-null) before any enrollment or outing consent is accepted — an unassessed resident has no supervision weight and cannot be safely staffed"
    error_id: ERR_NO_ACTIVE_ASSESSMENT
    http_status: 409
    applies_to: "POST /recreation/activity-plans, POST /recreation/sessions/{session_id}/enrollments, POST /recreation/outings/{outing_id}/consents"

  - priority: 30
    category: business_safety
    check: "program capability: the enrolling resident's supervision_tier must be <= the session program's max_supervision_tier under the TIER_1 < TIER_2 < TIER_3 ordering. This safety rule OUTRANKS the referential duplicate-enrollment check, so a request that is both a duplicate and tier-unsupported returns ERR_SUPERVISION_TIER_UNSUPPORTED."
    error_id: ERR_SUPERVISION_TIER_UNSUPPORTED
    http_status: 422
    applies_to: "POST /recreation/sessions/{session_id}/enrollments"

  - priority: 31
    category: business_safety
    check: "adaptive equipment availability: the union of the session program's required_adaptive_equipment and the enrolling resident's latest assessment's adaptive_equipment_needs must be a subset of the session room's equipment_available"
    error_id: ERR_ADAPTIVE_EQUIPMENT_UNAVAILABLE
    http_status: 422
    applies_to: "POST /recreation/sessions/{session_id}/enrollments"

  - priority: 32
    category: business_safety
    check: "a volunteer may only be assigned while Volunteer.status == CLEARED; APPLICANT, SCREENING, EXPIRED, SUSPENDED and TERMINATED are all refused"
    error_id: ERR_VOLUNTEER_CLEARANCE_EXPIRED
    http_status: 409
    applies_to: "POST /recreation/volunteer-assignments"

  - priority: 33
    category: business_safety
    check: "screening depth: Volunteer.screening_level must be >= the program's required_screening_level under the NONE < BASIC < FULL ordering, and the target program must have volunteer_eligible == true"
    error_id: ERR_VOLUNTEER_SCREENING_INSUFFICIENT
    http_status: 422
    applies_to: "POST /recreation/volunteer-assignments"

  - priority: 34
    category: business_safety
    check: "intergenerational supervision: a volunteer whose volunteer_type == STUDENT_INTERGENERATIONAL may only be assigned to a session whose assigned_staff_count >= 2, and may never hold role_type PROGRAM_LEAD"
    error_id: ERR_INTERGENERATIONAL_SUPERVISION_MISSING
    http_status: 422
    applies_to: "POST /recreation/volunteer-assignments"

  - priority: 35
    category: business_safety
    check: "outing supervision ratio: FINALIZE requires Outing.escort_count >= Outing.required_escorts as computed by calculations.outing_supervision_requirement (>=, so exact equality passes)"
    error_id: ERR_SUPERVISION_RATIO_UNMET
    http_status: 409
    applies_to: "POST /recreation/outings/{outing_id}/logistics with action FINALIZE"

  - priority: 36
    category: business_safety
    check: "consent completeness: FINALIZE and DEPART both require Outing.consent_status == CONSENT_COMPLETE and every OutingConsent on the manifest to have effective == true, so a GRANTED consent whose expires_on falls before the calendar date of Outing.departure_at blocks the bus. On FINALIZE this rule is evaluated AFTER the supervision-ratio rule at priority 35, so an outing that is both short of escorts and short of consent returns ERR_SUPERVISION_RATIO_UNMET."
    error_id: ERR_CONSENT_INCOMPLETE
    http_status: 409
    applies_to: "POST /recreation/outings/{outing_id}/logistics with action FINALIZE or action DEPART"

  - priority: 37
    category: business_safety
    check: "a resident whose functional_mobility == BEDBOUND may never be added to an outing manifest, regardless of consent"
    error_id: ERR_RESIDENT_INELIGIBLE_FOR_OUTING
    http_status: 422
    applies_to: "POST /recreation/outings/{outing_id}/consents"

  - priority: 38
    category: business_safety
    check: "review gate: while Resident.enrollment_gate == THERAPIST_REVIEW the resident may only be enrolled when the request carries a non-empty gate_override_reason AND X-User-Role == RecreationTherapist. This safety rule OUTRANKS the referential duplicate-enrollment check."
    error_id: ERR_ENROLLMENT_GATED
    http_status: 409
    applies_to: "POST /recreation/sessions/{session_id}/enrollments"

  - priority: 39
    category: business_safety
    check: "documentation completeness: CLOSE_DOCUMENTATION requires that no ParticipationRecord of the session is still PLANNED — every enrolled resident must carry a documented outcome before the session can be closed"
    error_id: ERR_DOCUMENTATION_INCOMPLETE
    http_status: 409
    applies_to: "POST /recreation/sessions/{session_id}/status with action CLOSE_DOCUMENTATION"

  - priority: 40
    category: business_safety
    check: "START requires at least one ParticipationRecord on the session with status != VOID — an empty session cannot be run"
    error_id: ERR_SESSION_HAS_NO_ENROLLMENTS
    http_status: 409
    applies_to: "POST /recreation/sessions/{session_id}/status with action START"

  - priority: 41
    category: business_safety
    check: "engagement documentation: engagement_level is REQUIRED when outcome == ATTENDED and MUST be absent (or null) for outcome REFUSED or ABSENT"
    error_id: ERR_ENGAGEMENT_LEVEL_REQUIRED
    http_status: 422
    applies_to: "PATCH /recreation/participation/{record_id}"

  - priority: 42
    category: business_safety
    check: "refusal documentation: refusal_reason is REQUIRED when outcome == REFUSED and MUST be absent (or null) for outcome ATTENDED or ABSENT"
    error_id: ERR_REFUSAL_REASON_REQUIRED
    http_status: 422
    applies_to: "PATCH /recreation/participation/{record_id}"

  - priority: 43
    category: business_safety
    check: "attestation narrative: on action ATTEST a non-empty remediation_note is REQUIRED whenever the packet's deficiency_flags array is non-empty; when deficiency_flags is empty the note is optional"
    error_id: ERR_REMEDIATION_NOTE_REQUIRED
    http_status: 422
    applies_to: "POST /recreation/survey-packets/{packet_id}/attestation with action ATTEST"

  - priority: 44
    category: business_safety
    check: "council quorum: a ResidentCouncilRequest may only be ADOPTED when its vote_count >= 5 (COUNCIL_QUORUM); DECLINED and DEFERRED carry no quorum requirement"
    error_id: ERR_COUNCIL_QUORUM_NOT_MET
    http_status: 422
    applies_to: "POST /recreation/council-requests/{request_id}/review with decision ADOPTED"

  - priority: 45
    category: business_referential
    check: "one participation row per resident per session: the resident must not already hold a ParticipationRecord on this session with status != VOID (a VOID row from a cancelled session does not block re-enrollment)"
    error_id: ERR_DUPLICATE_ENROLLMENT
    http_status: 409
    applies_to: "POST /recreation/sessions/{session_id}/enrollments"

  - priority: 46
    category: business_referential
    check: "one consent row per resident per outing: the resident must not already hold an OutingConsent on this outing in any status"
    error_id: ERR_DUPLICATE_CONSENT
    http_status: 409
    applies_to: "POST /recreation/outings/{outing_id}/consents"

  - priority: 47
    category: business_referential
    check: "plan provenance: the ResidentAssessment at source_assessment_id must have resident_id equal to the plan's resident_id AND superseded == false — a plan may never be justified by another resident's assessment or by a stale one"
    error_id: ERR_STALE_ASSESSMENT_REFERENCE
    http_status: 422
    applies_to: "POST /recreation/activity-plans"

  - priority: 48
    category: business_referential
    check: "the vehicle named by the outing must have Vehicle.status == AVAILABLE at booking time"
    error_id: ERR_VEHICLE_OUT_OF_SERVICE
    http_status: 409
    applies_to: "POST /recreation/outings/{outing_id}/transport-booking"

  - priority: 49
    category: business_constraint
    check: "group size: after admitting the new enrollment, ActivitySession.enrolled_count must be <= ActivitySession.effective_capacity, i.e. <= min(program.max_group_size, room.capacity). Filling the last seat exactly is legal."
    error_id: ERR_SESSION_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /recreation/sessions/{session_id}/enrollments"

  - priority: 50
    category: business_fiscal
    check: "staffing ratio: after admitting the new enrollment, calculations.session_staffing_requirement must yield required_staff_count <= ActivitySession.assigned_staff_count. This is the LAST check evaluated on an enrollment, so it only surfaces when every state, safety, referential and capacity rule above it passes."
    error_id: ERR_STAFFING_RATIO_EXCEEDED
    http_status: 409
    applies_to: "POST /recreation/sessions/{session_id}/enrollments"

  - priority: 51
    category: business_fiscal
    check: "volunteer weekly hour cap: after including the new assignment, calculations.volunteer_hours variant scheduled_hours must be <= 8.0 (VOLUNTEER_WEEKLY_HOUR_CAP) for the ISO week containing the logical clock"
    error_id: ERR_VOLUNTEER_HOUR_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /recreation/volunteer-assignments"

  - priority: 52
    category: business_fiscal
    check: "seat allocation: calculations.outing_seat_allocation must yield seat_shortfall_total == 0 against the vehicle's free pool before the transport booking is accepted"
    error_id: ERR_VEHICLE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /recreation/outings/{outing_id}/transport-booking"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
#
# All paths are prefixed `/recreation`. Every request carries X-User-Role and X-User-ID headers.
# Every response is wrapped in the envelope declared in §1.0.
# ---------------------------------------------------------------------------
endpoints:
  # ---- census and assessment ------------------------------------------------
  - method: POST
    path: "/recreation/residents"
    description: "Admits a resident to the activities census. supervision_tier, cognitive_level, functional_mobility and interest_domains all start null/empty until the first assessment is filed."
    roles: [ActivityDirector]
    code: 201
    input: [full_name, room_number, admission_date, "status?"]
    output: Resident
    side_effects:
      - "creates the Resident with version = 1, enrollment_gate = NONE, care_plan_review_due = false, engagement_index = 0.0, refusal_streak = 0 and absence_count = 0"

  - method: PATCH
    path: "/recreation/residents/{resident_id}"
    description: "Updates census-level resident data. The only mutable enum is `status`, which is how a resident reaches ON_LEAVE or DISCHARGED."
    roles: [ActivityDirector]
    code: 200
    input: ["full_name?", "room_number?", "status?"]
    output: Resident
    side_effects:
      - "increments Resident.version by 1"

  - method: GET
    path: "/recreation/residents/{resident_id}"
    description: "Reads one resident including every computed clinical mirror (supervision_tier, engagement_index, refusal_streak, absence_count) and the gate fields."
    roles: [ActivityDirector, RecreationTherapist, ActivityAide, VolunteerCoordinator, ComplianceOfficer]
    code: 200
    input: []
    output: Resident
    side_effects: []

  - method: GET
    path: "/recreation/residents"
    description: "Lists residents, newest first by created_at DESC, tie-break id ASC only for presentation stability."
    roles: [ActivityDirector, RecreationTherapist, ActivityAide, ComplianceOfficer]
    code: 200
    input: ["status?", "supervision_tier?", "limit?", "offset?"]
    output: Resident[]
    side_effects: []

  - method: POST
    path: "/recreation/residents/{resident_id}/assessments"
    description: "Files an immutable therapeutic recreation assessment. Assessments are append-only; a correction is filed as a newer assessment, never an update."
    roles: [RecreationTherapist]
    code: 201
    input: [cognitive_level, functional_mobility, interest_domains, "adaptive_equipment_needs?", preferred_group_size, effective_date]
    output: ResidentAssessment
    side_effects:
      - "sets ResidentAssessment.assessed_by_user_id = X-User-ID"
      - "recomputes `superseded` on every ResidentAssessment of this resident: exactly the winner of (effective_date DESC, created_at DESC) has superseded = false"
      - "mirrors the winner's cognitive_level, functional_mobility and interest_domains onto the Resident"
      - "runs calculations.supervision_tier and stores Resident.supervision_tier"
      - "increments Resident.version by 1"

  - method: GET
    path: "/recreation/residents/{resident_id}/assessments"
    description: "Reverse-reachability read for ResidentAssessment.resident_id; returns the resident's full assessment history ordered by effective_date DESC then created_at DESC, so element 0 is always the governing assessment."
    roles: [RecreationTherapist, ActivityDirector, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: ResidentAssessment[]
    side_effects: []

  - method: GET
    path: "/recreation/assessments/{assessment_id}"
    description: "Reads one immutable assessment, including the computed `superseded` flag that decides whether it may still justify a new plan."
    roles: [RecreationTherapist, ActivityDirector, ComplianceOfficer]
    code: 200
    input: []
    output: ResidentAssessment
    side_effects: []

  - method: GET
    path: "/recreation/assessments"
    description: "Reverse-reachability read for ResidentAssessment.resident_id across the whole facility. Ordered by effective_date DESC then created_at DESC."
    roles: [RecreationTherapist, ActivityDirector, ComplianceOfficer]
    code: 200
    input: ["resident_id?", "superseded?", "limit?", "offset?"]
    output: ResidentAssessment[]
    side_effects: []

  # ---- catalog: programs, rooms, vehicles -----------------------------------
  - method: POST
    path: "/recreation/programs"
    description: "Creates a catalog program in exactly one of the five domains, carrying its staffing ratio, group ceiling, tier ceiling, equipment requirements and volunteer screening bar."
    roles: [ActivityDirector]
    code: 201
    input: [name, domain, staffing_ratio_denominator, max_group_size, max_supervision_tier, "required_adaptive_equipment?", "volunteer_eligible?", "required_screening_level?"]
    output: ActivityProgram
    side_effects:
      - "creates the ActivityProgram with council_preference_weight = 0 and version = 1"

  - method: GET
    path: "/recreation/programs/{program_id}"
    description: "Reads one catalog program, including council_preference_weight — the only channel through which an adopted council request's effect on the catalog is observable."
    roles: [ActivityDirector, RecreationTherapist, ActivityAide, VolunteerCoordinator, ComplianceOfficer, CouncilRepresentative]
    code: 200
    input: []
    output: ActivityProgram
    side_effects: []

  - method: POST
    path: "/recreation/rooms"
    description: "Creates an activity room with its fire-code capacity, turnover buffer and permanently stocked adaptive equipment."
    roles: [ActivityDirector]
    code: 201
    input: [name, capacity, "buffer_minutes?", "equipment_available?"]
    output: ActivityRoom
    side_effects:
      - "creates the ActivityRoom with version = 1"

  - method: POST
    path: "/recreation/vehicles"
    description: "Adds a vehicle to the outing fleet. reserved_ambulatory_seats and reserved_wheelchair_stations start at 0 and are only ever moved by transport bookings and outing cancellations."
    roles: [ActivityDirector]
    code: 201
    input: [label, ambulatory_seats, wheelchair_stations, "turnaround_minutes?", "status?"]
    output: Vehicle
    side_effects:
      - "creates the Vehicle with version = 1, reserved_ambulatory_seats = 0 and reserved_wheelchair_stations = 0"

  - method: PATCH
    path: "/recreation/vehicles/{vehicle_id}"
    description: "Updates fleet metadata. Changing `status` to OUT_OF_SERVICE is what makes a later transport booking fail referential validation; every call here advances Vehicle.version and therefore invalidates any expected_vehicle_version a client is still holding."
    roles: [ActivityDirector]
    code: 200
    input: ["label?", "status?", "turnaround_minutes?"]
    output: Vehicle
    side_effects:
      - "increments Vehicle.version by 1"

  - method: GET
    path: "/recreation/vehicles/{vehicle_id}"
    description: "Reads one vehicle including `version` (the value a client must echo as expected_vehicle_version) and both reservation counters."
    roles: [ActivityDirector, ActivityAide, ComplianceOfficer]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  # ---- individualized activity plans ----------------------------------------
  - method: POST
    path: "/recreation/activity-plans"
    description: "Drafts an individualized activity plan against a specific assessment, carrying per-domain frequency targets for a 28-day cycle. Optimistic concurrency: `expected_resident_version` is required and MUST equal the resident's current version (§1.2.1 rule plan-create-stale-resident) — a plan built on a resident whose clinical picture has moved on is rejected with 412."
    roles: [RecreationTherapist]
    code: 201
    input: [resident_id, source_assessment_id, cycle_start_at, domain_frequency_targets, expected_resident_version]
    output: ActivityPlan
    side_effects:
      - "creates the ActivityPlan in status DRAFT with revision_count = 0, review_reason = NONE, activated_at = null and version = 1"
      - "computes ActivityPlan.target_total_sessions as the arithmetic sum of the five domain_frequency_targets values"
      - "runs calculations.plan_attainment and stores credited_attainment_pct and offered_attainment_pct (both 0.0 for a fresh cycle with no records)"
      - "increments Resident.version by 1"

  - method: POST
    path: "/recreation/activity-plans/{plan_id}/transition"
    description: "Drives the ActivityPlan lifecycle. `action` is one of ACTIVATE (DRAFT -> ACTIVE, superseding the resident's other live plans), REVISE (ACTIVE -> UNDER_REVISION, requires review_reason), REACTIVATE (UNDER_REVISION -> ACTIVE) and CLOSE (from DRAFT, ACTIVE or UNDER_REVISION -> CLOSED)."
    roles: [RecreationTherapist, ActivityDirector]
    code: 200
    input: [action, "review_reason?", "cycle_start_at?"]
    output: ActivityPlan
    side_effects:
      - "applies the §1.2 ActivityPlan transition matching `action`, including every side effect declared there"
      - "on ACTIVATE: supersedes the resident's other ACTIVE/UNDER_REVISION plans and clears their gate fields; sets activated_at = current_utc"
      - "on REVISE: sets review_reason, Resident.care_plan_review_due = true and Resident.enrollment_gate = THERAPIST_REVIEW"
      - "on REACTIVATE: increments revision_count by 1, resets review_reason to NONE, clears Resident.care_plan_review_due and Resident.enrollment_gate, and optionally re-bases cycle_start_at when supplied"
      - "recomputes credited_attainment_pct and offered_attainment_pct on every plan whose status is still ACTIVE or UNDER_REVISION after the transition"
      - "increments Resident.version by 1"
      - "increments ActivityPlan.version by 1"

  - method: GET
    path: "/recreation/activity-plans/{plan_id}"
    description: "Reads one plan including both attainment variants, revision_count and review_reason."
    roles: [RecreationTherapist, ActivityDirector, ActivityAide, ComplianceOfficer]
    code: 200
    input: []
    output: ActivityPlan
    side_effects: []

  - method: GET
    path: "/recreation/activity-plans"
    description: "Reverse-reachability read for both ActivityPlan.resident_id and ActivityPlan.source_assessment_id. Ordered by cycle_start_at DESC then created_at DESC."
    roles: [RecreationTherapist, ActivityDirector, ActivityAide, ComplianceOfficer]
    code: 200
    input: ["resident_id?", "source_assessment_id?", "status?", "limit?", "offset?"]
    output: ActivityPlan[]
    side_effects: []

  # ---- activity calendar: sessions ------------------------------------------
  - method: POST
    path: "/recreation/sessions"
    description: "Places one program instance on the activity calendar in a room for a time window with a rostered staff count. Room turnover (buffer_minutes on both sides) is enforced here, not at enrollment."
    roles: [ActivityDirector, RecreationTherapist]
    code: 201
    input: [program_id, room_id, starts_at, ends_at, assigned_staff_count]
    output: ActivitySession
    side_effects:
      - "creates the ActivitySession in status SCHEDULED with enrolled_count = 0, weighted_supervision_load = 0.0, required_staff_count = 0, documented_at = null and version = 1"
      - "computes effective_capacity as min(ActivityProgram.max_group_size, ActivityRoom.capacity)"

  - method: GET
    path: "/recreation/sessions/{session_id}"
    description: "Reads one calendar slot including enrolled_count, weighted_supervision_load, required_staff_count and effective_capacity."
    roles: [ActivityDirector, RecreationTherapist, ActivityAide, VolunteerCoordinator, ComplianceOfficer]
    code: 200
    input: []
    output: ActivitySession
    side_effects: []

  - method: GET
    path: "/recreation/sessions"
    description: "Reverse-reachability read for both ActivitySession.program_id and ActivitySession.room_id. Ordered by starts_at ASC then created_at ASC."
    roles: [ActivityDirector, RecreationTherapist, ActivityAide, VolunteerCoordinator, ComplianceOfficer]
    code: 200
    input: ["program_id?", "room_id?", "status?", "starts_from?", "starts_to?", "limit?", "offset?"]
    output: ActivitySession[]
    side_effects: []

  - method: POST
    path: "/recreation/sessions/{session_id}/status"
    description: "Drives the ActivitySession lifecycle. `action` is one of START (SCHEDULED -> IN_PROGRESS), CLOSE_DOCUMENTATION (IN_PROGRESS -> DOCUMENTED, the fork-join that finalizes every documented participation row) and CANCEL (SCHEDULED or IN_PROGRESS -> CANCELLED, the head of the depth-3 volunteer cascade). `cancel_reason` is required for CANCEL and rejected otherwise."
    roles: [ActivityDirector, RecreationTherapist, ActivityAide]
    code: 200
    input: [action, "cancel_reason?"]
    output: ActivitySession
    side_effects:
      - "applies the §1.2 ActivitySession transition matching `action`, including every side effect declared there"
      - "on CLOSE_DOCUMENTATION: every ParticipationRecord of the session in ATTENDED/REFUSED/ABSENT moves to FINALIZED with finalized_from preserving its branch; sets documented_at = current_utc; every VolunteerAssignment of the session in CONFIRMED moves to COMPLETED and Volunteer.credited_service_hours is recomputed"
      - "on CANCEL: every ParticipationRecord of the session still PLANNED moves to VOID; every VolunteerAssignment in PROPOSED or CONFIRMED moves to WITHDRAWN with withdrawn_reason = SESSION_CANCELLED; Volunteer.scheduled_hours_week is recomputed for each affected volunteer"
      - "recomputes ActivitySession.enrolled_count, weighted_supervision_load and required_staff_count"
      - "recomputes calculations.plan_attainment for every ACTIVE/UNDER_REVISION plan of every resident whose record changed"
      - "increments ActivitySession.version by 1"

  - method: POST
    path: "/recreation/sessions/{session_id}/enrollments"
    description: "Enrolls one resident in one calendar slot, creating the PLANNED ParticipationRecord. This is the densest validation path in the domain: state, segregation of duties, safety (tier ceiling, equipment, review gate), referential (duplicate) and finally the capacity and staffing-ratio checks all apply, in the §1.4 priority order. `gate_override_reason` is only meaningful while the resident's enrollment_gate is THERAPIST_REVIEW."
    roles: [ActivityDirector, RecreationTherapist, ActivityAide]
    code: 201
    input: [resident_id, "gate_override_reason?"]
    output: ParticipationRecord
    side_effects:
      - "creates the ParticipationRecord in status PLANNED with engagement_level = null, refusal_reason = null, documented_by_user_id = null, documented_at = null and version = 1"
      - "recomputes ActivitySession.enrolled_count, weighted_supervision_load and required_staff_count via calculations.session_staffing_requirement"
      - "recomputes calculations.plan_attainment for the resident's ACTIVE/UNDER_REVISION plan"
      - "increments ActivitySession.version by 1"

  - method: GET
    path: "/recreation/sessions/{session_id}/participation"
    description: "Reverse-reachability read for ParticipationRecord.session_id; the roster of one session ordered by created_at ASC. This is the only discovery channel for the VOID rows a session cancel synthesizes."
    roles: [ActivityDirector, RecreationTherapist, ActivityAide, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ParticipationRecord[]
    side_effects: []

  - method: PATCH
    path: "/recreation/participation/{record_id}"
    description: "Documents one resident's outcome for one session: ATTENDED (engagement_level required), REFUSED (refusal_reason required) or ABSENT (neither allowed). Documenting REFUSED is the head of the depth-4 refusal cascade that can drive the resident's live plan into UNDER_REVISION and gate future enrollment."
    roles: [ActivityAide, RecreationTherapist, ActivityDirector]
    code: 200
    input: [outcome, "engagement_level?", "refusal_reason?", "adaptive_equipment_used?"]
    output: ParticipationRecord
    side_effects:
      - "applies the §1.2 ParticipationRecord transition matching `outcome`, setting documented_by_user_id = X-User-ID and documented_at = current_utc"
      - "recomputes Resident.engagement_index via calculations.resident_engagement_index, Resident.refusal_streak via calculations.resident_refusal_streak and Resident.absence_count"
      - "when refusal_streak >= 3 and the resident holds an ACTIVE plan, that plan transitions to UNDER_REVISION with review_reason = REFUSAL_PATTERN, which sets Resident.care_plan_review_due = true and Resident.enrollment_gate = THERAPIST_REVIEW"
      - "recomputes calculations.plan_attainment (both variants) for the resident's ACTIVE/UNDER_REVISION plan"
      - "increments Resident.version by 1"
      - "increments ParticipationRecord.version by 1"

  - method: GET
    path: "/recreation/participation/{record_id}"
    description: "Reads one participation row including the computed `outcome` field every calculation keys off."
    roles: [ActivityDirector, RecreationTherapist, ActivityAide, ComplianceOfficer]
    code: 200
    input: []
    output: ParticipationRecord
    side_effects: []

  - method: GET
    path: "/recreation/participation"
    description: "Reverse-reachability read for ParticipationRecord.resident_id. Ordered by the record's session starts_at DESC then created_at DESC — the same ranking the engagement window and refusal streak use."
    roles: [ActivityDirector, RecreationTherapist, ActivityAide, ComplianceOfficer]
    code: 200
    input: ["resident_id?", "session_id?", "outcome?", "limit?", "offset?"]
    output: ParticipationRecord[]
    side_effects: []

  # ---- volunteers and intergenerational programming -------------------------
  - method: POST
    path: "/recreation/volunteers"
    description: "Registers a volunteer applicant. screening_level starts NONE and status starts APPLICANT; neither can be set from the request."
    roles: [VolunteerCoordinator]
    code: 201
    input: [full_name, volunteer_type]
    output: Volunteer
    side_effects:
      - "creates the Volunteer in status APPLICANT with screening_level = NONE, background_check_cleared_on = null, background_check_expires_on = null, orientation_completed_on = null, scheduled_hours_week = 0.0, credited_service_hours = 0.0 and version = 1"

  - method: POST
    path: "/recreation/volunteers/{volunteer_id}/screening"
    description: "Records a screening lifecycle event. `event_type` is one of BACKGROUND_CHECK_CLEARED (requires cleared_on), ORIENTATION_COMPLETED (requires completed_on), EXPIRE, SUSPEND, REINSTATE and TERMINATE. BACKGROUND_CHECK_CLEARED raises screening_level to BASIC and ORIENTATION_COMPLETED raises it to FULL."
    roles: [VolunteerCoordinator]
    code: 200
    input: [event_type, "cleared_on?", "completed_on?"]
    output: Volunteer
    side_effects:
      - "applies the §1.2 Volunteer transition matching `event_type`, including every side effect declared there"
      - "on BACKGROUND_CHECK_CLEARED: sets background_check_cleared_on = cleared_on, background_check_expires_on = cleared_on + 365 days and screening_level = BASIC"
      - "on ORIENTATION_COMPLETED: sets orientation_completed_on = completed_on and screening_level = FULL"
      - "on EXPIRE, SUSPEND and TERMINATE: every VolunteerAssignment of this volunteer in PROPOSED or CONFIRMED moves to WITHDRAWN, with withdrawn_reason = CLEARANCE_EXPIRED for EXPIRE and VOLUNTEER_SUSPENDED for SUSPEND or TERMINATE, and scheduled_hours_week is recomputed"
      - "increments Volunteer.version by 1"

  - method: GET
    path: "/recreation/volunteers/{volunteer_id}"
    description: "Reads one volunteer including screening_level, both background-check dates and both hour variants."
    roles: [VolunteerCoordinator, ActivityDirector, ComplianceOfficer]
    code: 200
    input: []
    output: Volunteer
    side_effects: []

  - method: POST
    path: "/recreation/volunteer-assignments"
    description: "Assigns a cleared volunteer to a scheduled session. Enforces clearance, screening depth, the intergenerational supervision floor, the no-double-booking temporal rule and finally the weekly hour cap."
    roles: [VolunteerCoordinator]
    code: 201
    input: [volunteer_id, session_id, role_type]
    output: VolunteerAssignment
    side_effects:
      - "creates the VolunteerAssignment in status PROPOSED with withdrawn_reason = null and version = 1"
      - "computes VolunteerAssignment.hours from the session's ends_at minus starts_at"
      - "recomputes Volunteer.scheduled_hours_week via calculations.volunteer_hours variant scheduled_hours"
      - "increments Volunteer.version by 1"

  - method: PATCH
    path: "/recreation/volunteer-assignments/{assignment_id}"
    description: "Confirms or withdraws an assignment. `status` accepts CONFIRMED (from PROPOSED) or WITHDRAWN (from PROPOSED or CONFIRMED). A caller with role Volunteer may only touch their own assignment and may only send WITHDRAWN; `withdrawn_reason` is required for WITHDRAWN and rejected otherwise."
    roles: [VolunteerCoordinator, Volunteer]
    code: 200
    input: [status, "withdrawn_reason?"]
    output: VolunteerAssignment
    side_effects:
      - "applies the §1.2 VolunteerAssignment transition matching `status`"
      - "recomputes Volunteer.scheduled_hours_week via calculations.volunteer_hours variant scheduled_hours"
      - "increments Volunteer.version by 1"
      - "increments VolunteerAssignment.version by 1"

  - method: GET
    path: "/recreation/volunteer-assignments/{assignment_id}"
    description: "Reads one assignment including its computed `hours` and any withdrawn_reason stamped by a cascade."
    roles: [VolunteerCoordinator, ActivityDirector, ComplianceOfficer, Volunteer]
    code: 200
    input: []
    output: VolunteerAssignment
    side_effects: []

  - method: GET
    path: "/recreation/volunteer-assignments"
    description: "Reverse-reachability read for both VolunteerAssignment.volunteer_id and VolunteerAssignment.session_id, and the only discovery channel for the WITHDRAWN rows a session cancel synthesizes. Ordered by created_at ASC."
    roles: [VolunteerCoordinator, ActivityDirector, ActivityAide, ComplianceOfficer, Volunteer]
    code: 200
    input: ["volunteer_id?", "session_id?", "status?", "limit?", "offset?"]
    output: VolunteerAssignment[]
    side_effects: []

  # ---- outings: transport, supervision and consent --------------------------
  - method: POST
    path: "/recreation/outings"
    description: "Plans an outing against a program and an intended vehicle. Both state dimensions start at their initial states: logistics_status = PLANNING and consent_status = COLLECTING. No seats are reserved until the transport booking."
    roles: [ActivityDirector, RecreationTherapist]
    code: 201
    input: [program_id, vehicle_id, destination, departure_at, return_at, escort_count]
    output: Outing
    side_effects:
      - "creates the Outing with logistics_status = PLANNING, consent_status = COLLECTING, roster_count = 0, manifest_count = 0, departed_at = null, returned_at = null and version = 1"
      - "runs calculations.outing_supervision_requirement over the (empty) manifest and stores weighted_supervision_load = 0.0 and required_escorts = 0"

  - method: GET
    path: "/recreation/outings/{outing_id}"
    description: "Reads one outing, exposing both independent state dimensions plus every derived seat and supervision counter."
    roles: [ActivityDirector, RecreationTherapist, ActivityAide, ComplianceOfficer]
    code: 200
    input: []
    output: Outing
    side_effects: []

  - method: GET
    path: "/recreation/outings"
    description: "Reverse-reachability read for both Outing.program_id and Outing.vehicle_id. Ordered by departure_at ASC then created_at ASC."
    roles: [ActivityDirector, RecreationTherapist, ActivityAide, ComplianceOfficer]
    code: 200
    input: ["program_id?", "vehicle_id?", "logistics_status?", "consent_status?", "limit?", "offset?"]
    output: Outing[]
    side_effects: []

  - method: POST
    path: "/recreation/outings/{outing_id}/transport-booking"
    description: "Reserves seats and stations on the outing's vehicle, moving logistics_status PLANNING -> TRANSPORT_BOOKED. Optimistic concurrency: `expected_vehicle_version` is required and MUST equal the vehicle's current version (§1.2.1 rule transport-booking-stale-vehicle) — a booking computed against a stale view of the fleet is rejected with 412."
    roles: [ActivityDirector]
    code: 200
    input: [expected_vehicle_version]
    output: Outing
    side_effects:
      - "runs calculations.outing_seat_allocation and stores Outing.ambulatory_seats_required, wheelchair_seats_required and seat_shortfall_total"
      - "sets logistics_status = TRANSPORT_BOOKED"
      - "adds Outing.ambulatory_seats_required to Vehicle.reserved_ambulatory_seats and Outing.wheelchair_seats_required to Vehicle.reserved_wheelchair_stations"
      - "increments Vehicle.version by 1"
      - "increments Outing.version by 1"

  - method: POST
    path: "/recreation/outings/{outing_id}/logistics"
    description: "Drives the Outing logistics dimension. `action` is one of SET_ESCORTS (adjusts escort_count while PLANNING or TRANSPORT_BOOKED, requires escort_count), FINALIZE (TRANSPORT_BOOKED -> READY, gated on the supervision ratio), DEPART (READY -> DEPARTED, gated on consent completeness), RETURN (DEPARTED -> RETURNED) and CANCEL (from PLANNING, TRANSPORT_BOOKED or READY, requires cancel_reason). consent_status is never touched from here."
    roles: [ActivityDirector]
    code: 200
    input: [action, "escort_count?", "cancel_reason?"]
    output: Outing
    side_effects:
      - "applies the §1.2 Outing logistics_status transition matching `action`, including every side effect declared there"
      - "on SET_ESCORTS: re-runs calculations.outing_supervision_requirement and calculations.outing_seat_allocation and, while logistics_status is TRANSPORT_BOOKED, re-bases the vehicle's reservation counters to the new requirement"
      - "on DEPART: sets departed_at = current_utc; on RETURN: sets returned_at = current_utc and releases the vehicle reservation counters"
      - "on CANCEL: releases the vehicle reservation counters and sets cancel_reason"
      - "increments Outing.version by 1"

  - method: POST
    path: "/recreation/outings/{outing_id}/consents"
    description: "Adds a resident to the outing roster with a consent request in status REQUESTED. A REQUESTED consent already counts toward the manifest for supervision and seat planning, which is why adding a rider can invalidate a finished booking."
    roles: [ActivityDirector, RecreationTherapist, ActivityAide]
    code: 201
    input: [resident_id, responsible_party_name, responsible_party_relation, "expires_on?"]
    output: OutingConsent
    side_effects:
      - "creates the OutingConsent in status REQUESTED with decided_at = null and version = 1"
      - "recomputes Outing.roster_count and Outing.manifest_count"
      - "re-runs calculations.outing_supervision_requirement and calculations.outing_seat_allocation"
      - "increments Outing.version by 1"

  - method: POST
    path: "/recreation/outings/{outing_id}/consents/{consent_id}/decision"
    description: "Records a responsible party's decision: GRANTED, DENIED or REVOKED. Every decision re-derives the outing's consent_status dimension independently of logistics_status, and can force the cyclic READY -> TRANSPORT_BOOKED revert."
    roles: [ActivityDirector, RecreationTherapist, ActivityAide]
    code: 200
    input: [decision, "expires_on?"]
    output: OutingConsent
    side_effects:
      - "applies the §1.2 OutingConsent transition matching `decision` and sets decided_at = current_utc"
      - "re-derives Outing.consent_status per the §1.2 Outing consent_status machine"
      - "recomputes Outing.manifest_count, then re-runs calculations.outing_supervision_requirement and calculations.outing_seat_allocation"
      - "when the re-derivation leaves consent_status != CONSENT_COMPLETE while logistics_status == READY, logistics_status reverts to TRANSPORT_BOOKED"
      - "increments Outing.version by 1"
      - "increments OutingConsent.version by 1"

  - method: GET
    path: "/recreation/outings/{outing_id}/consents"
    description: "Reverse-reachability read for OutingConsent.outing_id; the outing roster ordered by created_at ASC, including the computed `effective` flag."
    roles: [ActivityDirector, RecreationTherapist, ActivityAide, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: OutingConsent[]
    side_effects: []

  - method: GET
    path: "/recreation/outing-consents/{consent_id}"
    description: "Reads one consent row including status, expires_on and the computed `effective` flag evaluated against the logical clock."
    roles: [ActivityDirector, RecreationTherapist, ActivityAide, ComplianceOfficer]
    code: 200
    input: []
    output: OutingConsent
    side_effects: []

  - method: GET
    path: "/recreation/outing-consents"
    description: "Reverse-reachability read for OutingConsent.resident_id; every consent a resident holds across all outings, ordered by created_at ASC."
    roles: [ActivityDirector, RecreationTherapist, ActivityAide, ComplianceOfficer]
    code: 200
    input: ["resident_id?", "outing_id?", "status?", "limit?", "offset?"]
    output: OutingConsent[]
    side_effects: []

  # ---- resident council input ------------------------------------------------
  - method: POST
    path: "/recreation/council-requests"
    description: "A resident council representative files a programming request. `resident_id` MUST equal the caller's X-User-ID (role CouncilRepresentative is entity-backed by Resident); `requested_program_id` is optional and names a specific catalog program when the council asked for one."
    roles: [CouncilRepresentative]
    code: 201
    input: [resident_id, requested_domain, "requested_program_id?", vote_count, "note?"]
    output: ResidentCouncilRequest
    side_effects:
      - "creates the ResidentCouncilRequest in status SUBMITTED with decision_note = null, reviewed_by_user_id = null and version = 1"

  - method: POST
    path: "/recreation/council-requests/{request_id}/review"
    description: "The activities director dispositions a council request. `decision` is one of ADOPTED (requires vote_count >= 5), DECLINED or DEFERRED. Adoption is the head of the council cascade: it bumps the named program's council_preference_weight and pushes every matching live plan into revision."
    roles: [ActivityDirector]
    code: 200
    input: [decision, "decision_note?"]
    output: ResidentCouncilRequest
    side_effects:
      - "applies the §1.2 ResidentCouncilRequest transition matching `decision`, setting decision_note and reviewed_by_user_id = X-User-ID"
      - "on ADOPTED with a non-null requested_program_id: increments that ActivityProgram.council_preference_weight by 1 and increments ActivityProgram.version by 1"
      - "on ADOPTED: every ActivityPlan in status ACTIVE whose resident's interest_domains contains the requested_domain AND whose domain_frequency_targets[requested_domain] == 0 transitions to UNDER_REVISION with review_reason = COUNCIL_INPUT, which sets care_plan_review_due = true and enrollment_gate = THERAPIST_REVIEW on each affected Resident and increments each Resident.version by 1"
      - "increments ResidentCouncilRequest.version by 1"

  - method: GET
    path: "/recreation/council-requests/{request_id}"
    description: "Reads one council request including its disposition and reviewer."
    roles: [ActivityDirector, RecreationTherapist, ComplianceOfficer, CouncilRepresentative]
    code: 200
    input: []
    output: ResidentCouncilRequest
    side_effects: []

  - method: GET
    path: "/recreation/council-requests"
    description: "Reverse-reachability read for both ResidentCouncilRequest.resident_id and ResidentCouncilRequest.requested_program_id. Ordered by created_at DESC. A caller with role CouncilRepresentative only ever sees their own rows."
    roles: [ActivityDirector, RecreationTherapist, ComplianceOfficer, CouncilRepresentative]
    code: 200
    input: ["resident_id?", "requested_program_id?", "requested_domain?", "status?", "limit?", "offset?"]
    output: ResidentCouncilRequest[]
    side_effects: []

  # ---- regulatory survey documentation --------------------------------------
  - method: POST
    path: "/recreation/survey-packets"
    description: "Opens a survey documentation packet over an inclusive calendar-date window. Windows may touch but never overlap. Every score field and deficiency_flags stay null/empty until the packet is compiled."
    roles: [ComplianceOfficer, ActivityDirector]
    code: 201
    input: [window_start, window_end]
    output: SurveyPacket
    side_effects:
      - "creates the SurveyPacket in status OPEN with every score field null, deficiency_flags = [], amendment_count = 0, compiled_by_user_id = null, attested_by_user_id = null and version = 1"

  - method: POST
    path: "/recreation/survey-packets/{packet_id}/compile"
    description: "Runs calculations.survey_provision_score over the packet window and freezes the result, moving OPEN -> COMPILED or AMENDED -> COMPILED. Recompiling after an amendment overwrites every score field from scratch — there is no incremental accumulation."
    roles: [ComplianceOfficer, ActivityDirector]
    code: 200
    input: []
    output: SurveyPacket
    side_effects:
      - "runs calculations.survey_provision_score and stores offered_sessions_targeted, offered_sessions_delivered, base_score, domain_coverage_penalty, refusal_penalty, preliminary_score, deficiency_flags and provision_score"
      - "sets compiled_by_user_id = X-User-ID and status = COMPILED"
      - "increments SurveyPacket.version by 1"

  - method: POST
    path: "/recreation/survey-packets/{packet_id}/attestation"
    description: "`action` ATTEST moves COMPILED -> ATTESTED and requires a remediation_note whenever deficiency_flags is non-empty, and requires an attester different from the compiler (segregation of duties). `action` AMEND moves ATTESTED -> AMENDED to reopen the packet for recompilation."
    roles: [ComplianceOfficer]
    code: 200
    input: [action, "remediation_note?", "amendment_reason?"]
    output: SurveyPacket
    side_effects:
      - "applies the §1.2 SurveyPacket transition matching `action`"
      - "on ATTEST: sets attested_by_user_id = X-User-ID and stores remediation_note"
      - "on AMEND: increments amendment_count by 1 and clears attested_by_user_id back to null"
      - "increments SurveyPacket.version by 1"

  - method: GET
    path: "/recreation/survey-packets/{packet_id}"
    description: "Reads one packet including all five pinned score steps (base_score, domain_coverage_penalty, refusal_penalty, preliminary_score, provision_score) and deficiency_flags, so the pinned evaluation order is observable field-by-field."
    roles: [ComplianceOfficer, ActivityDirector]
    code: 200
    input: []
    output: SurveyPacket
    side_effects: []

  # ---- test-driving surface --------------------------------------------------
  - method: POST
    path: "/recreation/_clock/set_current_utc"
    description: "Sets the server's logical clock, which every `current_utc` reference in §1.2, §1.3 and §1.4 reads. At server startup the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. Time is monotonic: a value earlier than the present clock is rejected with ERR_CLOCK_REWIND_FORBIDDEN."
    roles: [ActivityDirector, ComplianceOfficer]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "sets the logical clock to the supplied instant; recomputes no stored field, so every clock-sensitive value (OutingConsent.effective, Volunteer.scheduled_hours_week) is re-derived on its next read or write"

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # --- authentication, authorization, segregation of duties -----------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header is missing, empty, or X-User-Role is not one of the seven role names in §1.7"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's `roles:`, or an entity-backed role (Volunteer, CouncilRepresentative) acts on a row it does not own"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID is the same person who performed the incompatible earlier step: attesting a packet they compiled, or overriding a review gate that rests on their own assessment"

  # --- existence ------------------------------------------------------------
  - id: ERR_RESIDENT_NOT_FOUND
    http: 404
    condition: "the resident_id in the path or body does not resolve to a Resident"
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "the source_assessment_id in the body does not resolve to a ResidentAssessment"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "the plan_id in the path does not resolve to an ActivityPlan"
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "the program_id or requested_program_id does not resolve to an ActivityProgram"
  - id: ERR_ROOM_NOT_FOUND
    http: 404
    condition: "the room_id in the body does not resolve to an ActivityRoom"
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "the session_id in the path or body does not resolve to an ActivitySession"
  - id: ERR_PARTICIPATION_RECORD_NOT_FOUND
    http: 404
    condition: "the record_id in the path does not resolve to a ParticipationRecord"
  - id: ERR_VOLUNTEER_NOT_FOUND
    http: 404
    condition: "the volunteer_id in the path or body does not resolve to a Volunteer"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "the assignment_id in the path does not resolve to a VolunteerAssignment"
  - id: ERR_VEHICLE_NOT_FOUND
    http: 404
    condition: "the vehicle_id in the path or body does not resolve to a Vehicle"
  - id: ERR_OUTING_NOT_FOUND
    http: 404
    condition: "the outing_id in the path does not resolve to an Outing"
  - id: ERR_CONSENT_NOT_FOUND
    http: 404
    condition: "the consent_id in the path does not resolve to an OutingConsent, or resolves to one whose outing_id differs from the outing_id earlier in the same path"
  - id: ERR_COUNCIL_REQUEST_NOT_FOUND
    http: 404
    condition: "the request_id in the path does not resolve to a ResidentCouncilRequest"
  - id: ERR_SURVEY_PACKET_NOT_FOUND
    http: 404
    condition: "the packet_id in the path does not resolve to a SurveyPacket"

  # --- request shape --------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is missing or null, an enum value is outside its declared set, a numeric value is out of range, an array declared `no duplicates` contains duplicates, or an unknown field is present"
  - id: ERR_PLAN_TARGETS_INVALID
    http: 422
    condition: "domain_frequency_targets does not carry exactly the five domain keys, a value is outside 0..20, or all five values are zero"
  - id: ERR_TIME_WINDOW_INVALID
    http: 422
    condition: "ends_at is not strictly after starts_at, return_at is not strictly after departure_at, or window_end is earlier than window_start"

  # --- state preconditions --------------------------------------------------
  - id: ERR_PLAN_INVALID_STATE
    http: 409
    condition: "the requested plan action is not declared for the plan's current status (including any action from the terminal SUPERSEDED or CLOSED states)"
  - id: ERR_SESSION_INVALID_STATE
    http: 409
    condition: "the session is not in a status that admits the operation — starting a non-SCHEDULED session, closing documentation on a session that is not IN_PROGRESS, cancelling a DOCUMENTED or CANCELLED session, or enrolling/assigning into a session that is no longer SCHEDULED"
  - id: ERR_PARTICIPATION_INVALID_STATE
    http: 409
    condition: "the participation record is no longer PLANNED, so its outcome cannot be documented (or re-documented)"
  - id: ERR_OUTING_INVALID_STATE
    http: 409
    condition: "the requested logistics action, consent addition or consent decision is not admitted by the outing's current logistics_status"
  - id: ERR_CONSENT_INVALID_STATE
    http: 409
    condition: "the requested consent decision is not declared for the consent's current status — most notably revoking a consent that was never GRANTED"
  - id: ERR_VOLUNTEER_INVALID_STATE
    http: 409
    condition: "the screening event_type is not declared for the volunteer's current status, including every event from the terminal TERMINATED state"
  - id: ERR_ASSIGNMENT_INVALID_STATE
    http: 409
    condition: "the requested assignment status change is not declared for its current status, including any change out of the terminal WITHDRAWN or COMPLETED states"
  - id: ERR_COUNCIL_REQUEST_INVALID_STATE
    http: 409
    condition: "the council request is already ADOPTED or DECLINED, or a DEFERRED request is being deferred again"
  - id: ERR_PACKET_INVALID_STATE
    http: 409
    condition: "the packet is not in a status that admits the operation — compiling an ATTESTED packet, attesting a packet that is not COMPILED, or amending a packet that is not ATTESTED"

  # --- optimistic concurrency (§1.2.1) -------------------------------------
  - id: ERR_STALE_RESIDENT_VERSION
    http: 412
    condition: "expected_resident_version does not equal the Resident's current version at the moment the plan create is processed"
  - id: ERR_STALE_VEHICLE_VERSION
    http: 412
    condition: "expected_vehicle_version does not equal the Vehicle's current version at the moment the transport booking is processed"

  # --- temporal conflicts ---------------------------------------------------
  - id: ERR_SESSION_IN_PAST
    http: 409
    condition: "a new session's starts_at or a new outing's departure_at is strictly earlier than the logical clock"
  - id: ERR_CLOCK_REWIND_FORBIDDEN
    http: 409
    condition: "the requested current_utc is strictly earlier than the logical clock's present value"
  - id: ERR_PACKET_WINDOW_OVERLAP
    http: 409
    condition: "the new packet's inclusive window intersects an existing SurveyPacket's window"
  - id: ERR_ROOM_TIME_CONFLICT
    http: 409
    condition: "the new session's interval, widened by the room's buffer_minutes on both sides, intersects another live session in the same room"
  - id: ERR_VEHICLE_TIME_CONFLICT
    http: 409
    condition: "the outing's interval, widened forward by the vehicle's turnaround_minutes, intersects another live outing on the same vehicle"
  - id: ERR_VOLUNTEER_TIME_CONFLICT
    http: 409
    condition: "the target session's interval intersects a session the volunteer already holds a PROPOSED or CONFIRMED assignment on"

  # --- resident safety and compliance --------------------------------------
  - id: ERR_RESIDENT_NOT_ADMITTED
    http: 409
    condition: "the resident's census status is ON_LEAVE or DISCHARGED, so the resident may not be planned, enrolled or added to an outing manifest"
  - id: ERR_NO_ACTIVE_ASSESSMENT
    http: 409
    condition: "the resident has no ResidentAssessment on file, so supervision_tier is null and no supervision weight can be computed"
  - id: ERR_SUPERVISION_TIER_UNSUPPORTED
    http: 422
    condition: "the resident's supervision_tier exceeds the program's max_supervision_tier"
  - id: ERR_ADAPTIVE_EQUIPMENT_UNAVAILABLE
    http: 422
    condition: "the union of the program's required_adaptive_equipment and the resident's assessed adaptive_equipment_needs is not stocked in the session's room"
  - id: ERR_ENROLLMENT_GATED
    http: 409
    condition: "the resident's enrollment_gate is THERAPIST_REVIEW and the request carries no gate_override_reason from a RecreationTherapist"
  - id: ERR_ENGAGEMENT_LEVEL_REQUIRED
    http: 422
    condition: "engagement_level is missing for outcome ATTENDED, or supplied for outcome REFUSED or ABSENT"
  - id: ERR_REFUSAL_REASON_REQUIRED
    http: 422
    condition: "refusal_reason is missing for outcome REFUSED, or supplied for outcome ATTENDED or ABSENT"
  - id: ERR_DOCUMENTATION_INCOMPLETE
    http: 409
    condition: "CLOSE_DOCUMENTATION was requested while at least one ParticipationRecord of the session is still PLANNED"
  - id: ERR_SESSION_HAS_NO_ENROLLMENTS
    http: 409
    condition: "START was requested on a session with no ParticipationRecord in a status other than VOID"

  # --- volunteer safety and compliance -------------------------------------
  - id: ERR_VOLUNTEER_CLEARANCE_EXPIRED
    http: 409
    condition: "the volunteer's status is not CLEARED at assignment time (APPLICANT, SCREENING, EXPIRED, SUSPENDED or TERMINATED)"
  - id: ERR_VOLUNTEER_SCREENING_INSUFFICIENT
    http: 422
    condition: "the volunteer's screening_level is below the program's required_screening_level, or the program is not volunteer_eligible"
  - id: ERR_INTERGENERATIONAL_SUPERVISION_MISSING
    http: 422
    condition: "a STUDENT_INTERGENERATIONAL volunteer is being assigned to a session with fewer than 2 rostered staff, or with role_type PROGRAM_LEAD"

  # --- outing safety and compliance ----------------------------------------
  - id: ERR_SUPERVISION_RATIO_UNMET
    http: 409
    condition: "FINALIZE was requested while Outing.escort_count is below the required_escorts computed by calculations.outing_supervision_requirement"
  - id: ERR_CONSENT_INCOMPLETE
    http: 409
    condition: "FINALIZE or DEPART was requested while consent_status is not CONSENT_COMPLETE, or a manifest consent has effective == false because its expires_on falls before the calendar date of Outing.departure_at"
  - id: ERR_RESIDENT_INELIGIBLE_FOR_OUTING
    http: 422
    condition: "a resident whose functional_mobility is BEDBOUND is being added to an outing manifest"

  # --- regulatory attestation ----------------------------------------------
  - id: ERR_REMEDIATION_NOTE_REQUIRED
    http: 422
    condition: "ATTEST was requested on a packet whose deficiency_flags is non-empty without a non-empty remediation_note"
  - id: ERR_COUNCIL_QUORUM_NOT_MET
    http: 422
    condition: "ADOPTED was requested on a council request whose vote_count is below 5"

  # --- referential integrity -----------------------------------------------
  - id: ERR_DUPLICATE_ENROLLMENT
    http: 409
    condition: "the resident already holds a ParticipationRecord on this session with a status other than VOID"
  - id: ERR_DUPLICATE_CONSENT
    http: 409
    condition: "the resident already holds an OutingConsent on this outing in any status"
  - id: ERR_STALE_ASSESSMENT_REFERENCE
    http: 422
    condition: "source_assessment_id belongs to a different resident, or names an assessment whose superseded flag is true"
  - id: ERR_VEHICLE_OUT_OF_SERVICE
    http: 409
    condition: "the outing's vehicle has status OUT_OF_SERVICE at transport-booking time"

  # --- capacity and scarce-resource quotas ---------------------------------
  - id: ERR_SESSION_CAPACITY_EXCEEDED
    http: 409
    condition: "admitting the enrollment would push enrolled_count above effective_capacity = min(program.max_group_size, room.capacity)"
  - id: ERR_STAFFING_RATIO_EXCEEDED
    http: 409
    condition: "admitting the enrollment would make required_staff_count exceed the session's assigned_staff_count"
  - id: ERR_VOLUNTEER_HOUR_CAP_EXCEEDED
    http: 409
    condition: "admitting the assignment would push the volunteer's scheduled_hours_week above 8.0 for the ISO week containing the logical clock"
  - id: ERR_VEHICLE_CAPACITY_EXCEEDED
    http: 409
    condition: "calculations.outing_seat_allocation yields a non-zero seat_shortfall_total against the vehicle's free pool"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
#
# Role model: segregation_of_duties. Five opaque operator roles plus two entity-backed roles.
# The two segregation rules (§1.4 priorities 3 and 4) are enforced on X-User-ID, never on role
# alone, so a single ComplianceOfficer account can compile a packet but can never attest the very
# packet it compiled.
# ---------------------------------------------------------------------------
roles:
  - name: ActivityDirector
    description: "Runs the activities department: census admission, catalog and fleet setup, calendar construction, outing logistics, council dispositions and survey packet compilation."
    identity: "opaque"
    exclusive_operations:
      - "POST /recreation/residents"
      - "PATCH /recreation/residents/{resident_id}"
      - "POST /recreation/programs"
      - "POST /recreation/rooms"
      - "POST /recreation/vehicles"
      - "PATCH /recreation/vehicles/{vehicle_id}"
      - "POST /recreation/outings/{outing_id}/transport-booking"
      - "POST /recreation/outings/{outing_id}/logistics"
      - "POST /recreation/council-requests/{request_id}/review"
    shared_operations:
      - "POST /recreation/activity-plans/{plan_id}/transition (with RecreationTherapist)"
      - "POST /recreation/sessions (with RecreationTherapist)"
      - "POST /recreation/sessions/{session_id}/status (with RecreationTherapist, ActivityAide)"
      - "POST /recreation/sessions/{session_id}/enrollments (with RecreationTherapist, ActivityAide)"
      - "PATCH /recreation/participation/{record_id} (with RecreationTherapist, ActivityAide)"
      - "POST /recreation/outings (with RecreationTherapist)"
      - "POST /recreation/outings/{outing_id}/consents (with RecreationTherapist, ActivityAide)"
      - "POST /recreation/outings/{outing_id}/consents/{consent_id}/decision (with RecreationTherapist, ActivityAide)"
      - "POST /recreation/survey-packets (with ComplianceOfficer)"
      - "POST /recreation/survey-packets/{packet_id}/compile (with ComplianceOfficer)"
      - "POST /recreation/_clock/set_current_utc (with ComplianceOfficer)"
      - "every GET in §1.5 except GET /recreation/volunteers/{volunteer_id} scoped reads reserved to VolunteerCoordinator"

  - name: RecreationTherapist
    description: "Licensed therapist who assesses residents and authors individualized activity plans. The only role that may file an assessment or create a plan, and the only role that may override a therapist-review enrollment gate."
    identity: "opaque"
    exclusive_operations:
      - "POST /recreation/residents/{resident_id}/assessments"
      - "POST /recreation/activity-plans"
      - "supplying gate_override_reason on POST /recreation/sessions/{session_id}/enrollments"
    shared_operations:
      - "POST /recreation/activity-plans/{plan_id}/transition (with ActivityDirector)"
      - "POST /recreation/sessions (with ActivityDirector)"
      - "POST /recreation/sessions/{session_id}/status (with ActivityDirector, ActivityAide)"
      - "POST /recreation/sessions/{session_id}/enrollments (with ActivityDirector, ActivityAide)"
      - "PATCH /recreation/participation/{record_id} (with ActivityDirector, ActivityAide)"
      - "POST /recreation/outings (with ActivityDirector)"
      - "POST /recreation/outings/{outing_id}/consents (with ActivityDirector, ActivityAide)"
      - "POST /recreation/outings/{outing_id}/consents/{consent_id}/decision (with ActivityDirector, ActivityAide)"

  - name: ActivityAide
    description: "Front-line aide who runs sessions and documents participation at the point of care. May not create plans, assessments, programs or bookings."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /recreation/sessions/{session_id}/status (with ActivityDirector, RecreationTherapist)"
      - "POST /recreation/sessions/{session_id}/enrollments (with ActivityDirector, RecreationTherapist)"
      - "PATCH /recreation/participation/{record_id} (with ActivityDirector, RecreationTherapist)"
      - "POST /recreation/outings/{outing_id}/consents (with ActivityDirector, RecreationTherapist)"
      - "POST /recreation/outings/{outing_id}/consents/{consent_id}/decision (with ActivityDirector, RecreationTherapist)"

  - name: VolunteerCoordinator
    description: "Owns the entire volunteer surface: registration, screening lifecycle, and assignment to sessions. No other role may touch a Volunteer or create a VolunteerAssignment."
    identity: "opaque"
    exclusive_operations:
      - "POST /recreation/volunteers"
      - "POST /recreation/volunteers/{volunteer_id}/screening"
      - "POST /recreation/volunteer-assignments"
    shared_operations:
      - "PATCH /recreation/volunteer-assignments/{assignment_id} (with Volunteer, who may only withdraw their own)"

  - name: ComplianceOfficer
    description: "Prepares and attests regulatory survey documentation. Attestation is exclusive to this role, and segregation of duties forbids attesting a packet this same user compiled."
    identity: "opaque"
    exclusive_operations:
      - "POST /recreation/survey-packets/{packet_id}/attestation"
    shared_operations:
      - "POST /recreation/survey-packets (with ActivityDirector)"
      - "POST /recreation/survey-packets/{packet_id}/compile (with ActivityDirector)"
      - "POST /recreation/_clock/set_current_utc (with ActivityDirector)"

  - name: Volunteer
    description: "A registered volunteer acting for themselves. X-User-ID is the Volunteer row's id; the volunteer may read and withdraw only their own assignments."
    identity: "entity_backed:Volunteer"
    exclusive_operations: []
    shared_operations:
      - "PATCH /recreation/volunteer-assignments/{assignment_id} restricted to status WITHDRAWN on rows whose volunteer_id == X-User-ID"
      - "GET /recreation/volunteer-assignments and GET /recreation/volunteer-assignments/{assignment_id} restricted to rows whose volunteer_id == X-User-ID"

  - name: CouncilRepresentative
    description: "A resident serving on the resident council. X-User-ID is the Resident row's id; the representative may file and read only their own council requests."
    identity: "entity_backed:Resident"
    exclusive_operations:
      - "POST /recreation/council-requests"
    shared_operations:
      - "GET /recreation/council-requests and GET /recreation/council-requests/{request_id} restricted to rows whose resident_id == X-User-ID"
      - "GET /recreation/programs/{program_id} (with every operator role)"
