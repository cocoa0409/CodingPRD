          - validations[priority=30]
          - errors[ERR_STALE_MODEL_VERSION]
          - endpoints[POST /repair-program/manual-revisions]
        distinguishing_aspect: |
          Several DRAFT revisions per (model, doc_type) are legal, so the second
          create is blocked purely by the version token that the first create
          consumed — and the retry with a fresh read must land on revision_number 2
          rather than replaying revision_number 1.
        test_recipe:
          setup:
