          that mutation itself causes PurchaseAgreement.earnest_money_received_cents to be
          recomputed and (when the threshold is now met) flips PurchaseAgreement ACTIVE->UNDER_CONTRACT;
          THAT transition itself flips EscrowAccount OPEN->FUNDED. Three causal hops, each
          link triggered by the previous link (not by the original action). Trigger:
