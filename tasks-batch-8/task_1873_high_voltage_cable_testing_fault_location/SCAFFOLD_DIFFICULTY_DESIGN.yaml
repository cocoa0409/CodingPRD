            - "TestJob.${j}.estimate_cents == 424000 (subtotal 400000 is not > 400000 -> STANDARD 6%)"
            - "TestJob.${j}.status == PLANNED (budget 424000 passes the <= check exactly)"

  # ------------------------------------------------------------------ Rule 3
