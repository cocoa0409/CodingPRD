          assert:
            - "Mid-cycle: occupied_beds == 0, reserved_beds == 2, beds_free == 2 (forward action holds 2)"
            - "After cancel: occupied_beds == 0, reserved_beds == 0, beds_free == 4 (compensation restores the pool)"
            - "Invariant holds at both observations: beds_effective == occupied_beds + reserved_beds + beds_free == 4"
      - name: meal_stock_conserved_through_receive_and_serve
        grounds:
          - calculations.supply_stock
          - state_machines.Donation.PLEDGED_to_RECEIVED
          - state_machines.MealService.PLANNED_to_SERVED
        distinguishing_aspect: |
          Conserved quantity is meal units (different quantity from bed slots):
          sum(RECEIVED MEAL donation quantity) == sum(SERVED served_count) + meal_stock_on_hand
          must hold at every step — 100 == 0 + 100, then 100 == 40 + 60, then 100 == 100 + 0,
          and the serve that would break it (1 more than 0) is rejected.
        test_recipe:
          setup:
            - "Episode STANDBY; SiteActivation OPENING (donations and meal services need no OPEN)"
            - "Donation of 100 MEAL RECEIVED; three meal services planned"
          setup_api_calls:
            - call: "POST /api/episodes"
              payload: { mode: "WARMING", threshold_f: 32.0, sustained_hours_required: 1, scheduled_end_at: "2026-08-12T00:00:00Z" }
              as: EOCManager
              captures: { ep: $.data.id }
            - call: "POST /api/sites"
              payload: { name: "Armory", address: "9 Oak Ave", bed_capacity: 10, pet_capacity: 0, locker_capacity: 0 }
              as: EOCManager
              captures: { site: $.data.id }
            - call: "POST /api/episodes/${ep}/site-activations"
              payload: { site_id: "${site}" }
              as: EOCManager
              captures: { sa: $.data.id }
            - call: "POST /api/staff-members"
              payload: { full_name: "Lead One", skills: ["SITE_LEAD"] }
              as: EOCManager
              captures: { lead1: $.data.id }
            - call: "POST /api/site-activations/${sa}/donations"
              payload: { partner_name: "FoodBank", category: "MEAL", quantity: 100 }
              as: SiteLead
              as_user_id: "${lead1}"
              captures: { don: $.data.id }
            - { call: "POST /api/donations/${don}/receive", payload: {}, as: SiteLead, as_user_id: "${lead1}" }
            - call: "POST /api/site-activations/${sa}/meal-services"
              payload: { service_date: "2026-08-10T00:00:00Z", meal_period: "LUNCH" }
              as: SiteLead
              as_user_id: "${lead1}"
              captures: { ms1: $.data.id }
            - call: "POST /api/site-activations/${sa}/meal-services"
              payload: { service_date: "2026-08-10T00:00:00Z", meal_period: "DINNER" }
              as: SiteLead
              as_user_id: "${lead1}"
              captures: { ms2: $.data.id }
            - call: "POST /api/site-activations/${sa}/meal-services"
              payload: { service_date: "2026-08-11T00:00:00Z", meal_period: "BREAKFAST" }
              as: SiteLead
              as_user_id: "${lead1}"
              captures: { ms3: $.data.id }
          trigger:
            - { call: "POST /api/meal-services/${ms1}/serve", payload: { served_count: 40 }, as: SiteLead, as_user_id: "${lead1}" }
            - { call: "POST /api/meal-services/${ms2}/serve", payload: { served_count: 60 }, as: SiteLead, as_user_id: "${lead1}" }
            - call: "POST /api/meal-services/${ms3}/serve"
              payload: { served_count: 1 }
              as: SiteLead
              as_user_id: "${lead1}"
              captures: { err: $.data.error_id }
            - call: "GET /api/site-activations/${sa}"
              as: EOCManager
              captures: { on_hand: $.data.meal_stock_on_hand }
          assert:
            - "After serving 40 then 60: meal_stock_on_hand == 0 (100 == 40 + 60 + 0)"
            - "Third serve of 1 rejected: error_id == ERR_INSUFFICIENT_MEAL_STOCK"
            - "Conservation identity holds: sum(RECEIVED quantity) 100 == sum(served_count) 100 + meal_stock_on_hand 0"
