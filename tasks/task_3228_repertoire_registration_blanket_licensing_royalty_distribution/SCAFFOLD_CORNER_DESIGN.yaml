      - name: clock_default_is_2026_09_01_and_settable
        claim_type: computed_read
        grounds: [endpoints.POST_clock_set_current_utc]
        distinguishing_aspect: "The default clock (2026-09-01T00:00:00Z) already lies beyond a license expiring 2026-06-30, so the very first read sweeps it to EXPIRED without any wall-clock dependency; rewinding the clock to 2026-01-01 before issuance keeps the same license ACTIVE."
        test_recipe:
          setup: ["two licensees; license A issued under the default clock; license B issued after rewinding the clock to 2026-01-01"]
          setup_api_calls:
            - call: "POST /pro/licensees"
              payload: { legal_name: "Clock A", category: VENUE, reported_revenue_cents: 10000000000, usage_units: 10 }
              as: ProLicensingAdmin
              captures: { cla_id: $.data.id, cla_ver: $.data.version }
            - call: "POST /pro/licensees/${cla_id}/licenses"
              payload: { effective_date: "2026-01-01", expiry_date: "2026-06-30", expected_licensee_version: "${cla_ver}" }
              as: ProLicensingAdmin
              captures: { cla_lic: $.data.id }
          trigger:
            - call: "GET /pro/licenses/${cla_lic}"
              payload: {}
              as: ProLicensingAdmin
              captures: { cla_status: $.data.status }
            - call: "POST /pro/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: ProSystemAdmin
            - call: "POST /pro/licensees"
              payload: { legal_name: "Clock B", category: VENUE, reported_revenue_cents: 10000000000, usage_units: 10 }
              as: ProLicensingAdmin
              captures: { clb_id: $.data.id, clb_ver: $.data.version }
            - call: "POST /pro/licensees/${clb_id}/licenses"
              payload: { effective_date: "2026-01-01", expiry_date: "2026-06-30", expected_licensee_version: "${clb_ver}" }
              as: ProLicensingAdmin
              captures: { clb_status: $.data.status }
          assert:
            - "cla_status == EXPIRED (default clock 2026-09-01 is past the 2026-06-30 expiry; the sweep fires on read without any clock-set call)"
            - "clb_status == ACTIVE (after the clock is set back to 2026-01-01, the same window is live at issuance)"
      - name: reverse_reachability_lists_children
        claim_type: fk_reverse_reachability
        grounds: [endpoints.GET_works_id_share-claims, endpoints.GET_cycles_id_statements]
        distinguishing_aspect: "Every FK has a filtered GET: a work's claims and a cycle's statements are listable from the parent id."
        test_recipe:
          setup: ["work with two claims"]
          setup_api_calls:
            - call: "POST /pro/affiliates"
              payload: { legal_name: "RR Pub", party_type: PUBLISHER, affiliation_code: "RRP" }
              as: ProRegistrar
              captures: { rr_id: $.data.id }
            - call: "POST /pro/affiliates"
              payload: { legal_name: "RR W", party_type: SONGWRITER, affiliation_code: "RRW" }
