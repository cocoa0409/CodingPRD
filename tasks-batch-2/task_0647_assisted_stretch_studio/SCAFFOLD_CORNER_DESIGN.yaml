            - "CreditPack.${pack}.available_credits == 1"

      - name: error_terminal_state_late_cancelled_no_recancel
        claim_type: terminal_state_lockdown
        grounds:
          - errors[ERR_INVALID_STATE]
        excluded_because:
          difficulty_instance: dual_variant_calc / no_show_fee_flat_vs_prorated_on_booking
          rationale: "The LATE_CANCELLED terminal state and its fee are produced and asserted in the named §1.8 instance; re-cancel lockdown is the same terminal-state claim."

      - name: booking_retired_service_rejected
        claim_type: valid_transition
        grounds:
          - state_machines.Service.status.ACTIVE_to_RETIRED
          - entities.Service.fields.status
          - errors[ERR_OUTSIDE_BUSINESS_HOURS]
        distinguishing_aspect: "POST /services/{id}/retire flips a service ACTIVE->RETIRED; a subsequent booking of that RETIRED service is rejected ERR_OUTSIDE_BUSINESS_HOURS (422)."
        test_recipe:
          setup: ["Member intro-completed; an ASSISTED_STRETCH service that is then RETIRED."]
