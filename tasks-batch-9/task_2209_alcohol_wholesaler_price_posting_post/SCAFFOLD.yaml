  - method: POST
    path: /error-corrections/{id}/approve
    description: "Approves a submitted error correction and applies the corrected prices."
    roles: [ComplianceOfficer]
    success_code: 200
    input: []
    output: ErrorCorrection
    side_effects:
      - "applies the corrected prices to the item and increments both correction counters"
      - "recomputes every ACTIVE quantity discount tier of the item"
      - "accrues the program's repeat correction penalty when the schedule reaches its second approved correction"
      - "increments PriceScheduleItem.version by 1"

  - method: POST
    path: /error-corrections/{id}/deny
    description: "Denies a submitted error correction, leaving the posted prices untouched."
    roles: [ComplianceOfficer]
    success_code: 200
    input: [denial_reason]
    output: ErrorCorrection
    side_effects:
      - "records denial_reason and increments ErrorCorrection.version by 1"

  - method: GET
    path: /error-corrections/{id}
    description: "Retrieves one error correction."
    roles: [ComplianceOfficer, FilingAgent, CertifyingOfficer]
    success_code: 200
    input: []
    output: ErrorCorrection
