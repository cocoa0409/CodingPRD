              payload: { base_property_type: "LIVESTOCK" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "GET /base-properties/${c_bp50_id}"
              payload: {}
              as: AppealsAdjudicator
              as_user_id: "u_judge_1"
            - call: "GET /base-properties"
              payload: { permittee_id: "${c_m59_id}" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
            - call: "GET /base-properties"
              payload: { base_property_type: "LAND" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
            - call: "GET /base-properties"
              payload: { permittee_id: "${c_m58_id}", base_property_type: "LAND" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
          assert:
            - "first call: HTTP 200 with total_count 2 and items ordered by sequence_order — items[0].id == ${c_p38_id} with sequence_order 1 and rest_required false, items[1].id == ${c_p39_id} with sequence_order 2 and rest_required true; every item carries allotment_id ${c_a73_id} and scheduled_aums 0"
            - "second call: HTTP 200 with id ${c_p39_id}, allotment_id ${c_a73_id}, name \"South Fork\", pasture_aum_capacity 300, sequence_order 2, rest_required true and scheduled_aums 0 — the by-id path agrees field-for-field with the nested listing"
            - "third call: total_count 1 and the only item is ${c_p40_id} — the global pasture collection narrowed by allotment_id excludes the other allotment's two pastures"
            - "fourth call: total_count 1 and the only item is ${c_p39_id} — rest_required is a real filter, and a Permittee may read it"
            - "fifth call: total_count 1 and the only item is ${c_p38_id} — rest_required false is honoured as a filter value rather than treated as an absent parameter (a boolean filter that is dropped when false would return 2 items here)"
            - "sixth call: HTTP 200 with exactly 1 item and total_count 3 — the unfiltered global collection spans both allotments and total_count counts the collection, not the page"
            - "seventh call: total_count 2 — items are ${c_bp49_id} with base_property_type \"LAND\", carrying_capacity_aums 200 and qualified_aums 200 (factor 1.0), and ${c_bp50_id} with base_property_type \"LIVESTOCK\", carrying_capacity_aums 100 and qualified_aums 75 (floor(100 * 0.75))"
            - "eighth call: total_count 1 and the only item is ${c_bp50_id} with qualified_aums 75"
            - "ninth call: HTTP 200 with id ${c_bp50_id}, permittee_id ${c_m58_id} and qualified_aums 75 — the by-id read reports the same floored figure as both list paths"
            - "tenth call: total_count 1 and the only item is ${c_bp51_id} with qualified_aums 300"
            - "eleventh call: total_count 2 — the global collection narrowed by type spans both permittees and contains exactly ${c_bp49_id} and ${c_bp51_id}, never the LIVESTOCK row"
            - "twelfth call: total_count 1 and the only item is ${c_bp49_id} — permittee_id and base_property_type combine conjunctively rather than as a union"

