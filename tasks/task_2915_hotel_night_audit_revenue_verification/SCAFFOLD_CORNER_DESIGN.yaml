          trigger: "POST /night-audit/outlets/${lounge_id}/suspend as PropertyAdmin (X-User-ID u_admin_1)."
          assert:
            - "HTTP 200 with status == \"SUSPENDED\" and version == 2; every configuration field including requires_shift_settlement == true is unchanged."
            - "POST /night-audit/outlet-tickets on ${lounge_id} for the same date fails 409 ERR_OUTLET_SUSPENDED."
            - "POST /night-audit/settlement-batches naming ${lounge_id} fails 409 ERR_OUTLET_SUSPENDED."
            - "GET /night-audit/outlet-tickets/${ticket_id} still reads status == \"CLOSED\" with total_amount == 160.48, and GET /night-audit/business-dates/${bd1_id} still reads closed_outlet_ticket_count == 1 and outlet_revenue_amount == 160.48 - suspending is not a retroactive erasure."
            - "The full close sequence on ${bd1_id} now runs to SETTLEMENT_REVIEW with no batch at all, because the mandatory-settler clause of priority 82 only looks at ACTIVE outlets."
            - "GET /night-audit/outlets?property_id=${prop_id}&status=ACTIVE returns 0 rows while status=SUSPENDED returns 1."

      - name: endpoint_cross_reference_link_documents_bind_to_exactly_one_target_kind
