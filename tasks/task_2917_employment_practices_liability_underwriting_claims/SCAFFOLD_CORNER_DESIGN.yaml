# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Scaffold Corner Design (breadth probe)
# Task 2917 — Employment Practices Liability Underwriting & Claims
#
# Walked from references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1-§1.7.
# `section:` values are the guide's nine sections; `claim_type:` values are that
# section's table rows. Instances whose corner is already asserted by an §1.8
# instance carry an `excluded_because:` stub and NO test_recipe.
#
# Logical clock default: 2026-08-01T00:00:00.000Z. All instants are ISO-8601 UTC
# with three fractional digits. Pinned user ids per §1.7 rbac_notes:
# admin-001 / uw-001 / uw-002 / uwm-001 / uwm-002 / adj-001 / adj-002 / clm-001 / clm-002.
#
# Reusable fixture literals (referenced by name in `setup:` prose):
#   Jurisdiction CA: T4, pre_suit_window_days 180, wage_hour_multiplier 1.60, class_action_propensity_pct 42.00
#   Jurisdiction TX: T2, pre_suit_window_days 120, wage_hour_multiplier 1.10, class_action_propensity_pct 18.00
#   RatePlan "EPLI Standard 2026": base_rate_per_employee_cents 41750, min_premium_cents 750000,
#                                 wage_hour_sublimit_pct 0.25, third_party_sublimit_pct 0.40
#   CHAIN S (small TX policy): applicant "Bayline Foods LLC" 40 headcount / 4 separations / TX 40,
#     assessment agg 10000000 retention 2500000 -> indicated_premium_cents 1803600, exposure_score 28.00,
#     policy [2026-08-01, 2027-08-01) ACTIVE, wage_hour_sublimit_cents 2500000, third_party_sublimit_cents 4000000

scaffold_corner_design:

  - section: entities
    instances:

      - name: create_jurisdiction_returns_201_with_every_declared_field
        claim_type: creation
        grounds:
          - entities.Jurisdiction.fields.code
          - entities.Jurisdiction.fields.hazard_tier
          - entities.Jurisdiction.fields.pre_suit_window_days
          - entities.Jurisdiction.fields.wage_hour_multiplier
          - endpoints[POST /epli/jurisdictions]
        distinguishing_aspect: "A single POST with all seven required inputs returns 201 and echoes every declared Jurisdiction field plus the four common fields; version is 1 and nothing is defaulted away."
        test_recipe:
          setup:
            - "Empty database. The logical clock is at its startup default 2026-08-01T00:00:00.000Z."
          setup_api_calls: []
          trigger:
            - call: "POST /epli/jurisdictions"
              payload: { code: "CA", name: "California", hazard_tier: "T4", admin_agency_name: "California Civil Rights Department", pre_suit_window_days: 180, wage_hour_multiplier: 1.60, class_action_propensity_pct: 42.00, pre_suit_mediation_required: true }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { jur_ca_id: $.data.id }
          assert:
            - "HTTP status is 201 and the envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"
            - "Jurisdiction.${jur_ca_id}.code == CA"
            - "Jurisdiction.${jur_ca_id}.name == California"
            - "Jurisdiction.${jur_ca_id}.hazard_tier == T4"
            - "Jurisdiction.${jur_ca_id}.admin_agency_name == California Civil Rights Department"
            - "Jurisdiction.${jur_ca_id}.pre_suit_window_days == 180"
            - "Jurisdiction.${jur_ca_id}.wage_hour_multiplier == 1.60"
            - "Jurisdiction.${jur_ca_id}.class_action_propensity_pct == 42.00"
            - "Jurisdiction.${jur_ca_id}.pre_suit_mediation_required == true"
            - "Jurisdiction.${jur_ca_id}.version == 1 and created_at == updated_at"

      - name: get_rate_plan_by_id_returns_the_stored_row_unchanged
        claim_type: retrieval
        grounds:
          - entities.RatePlan.fields.base_rate_per_employee_cents
          - entities.RatePlan.fields.status
          - endpoints[GET /epli/rate-plans/{rate_plan_id}]
        distinguishing_aspect: "The GET by id returns byte-identical field values to the create response, including the system-defaulted status DRAFT, and does not bump version."
        test_recipe:
          setup:
            - "One RatePlan named EPLI Standard 2026 exists in status DRAFT."
          setup_api_calls:
            - call: "POST /epli/rate-plans"
              payload: { name: "EPLI Standard 2026", base_rate_per_employee_cents: 41750, min_premium_cents: 750000, wage_hour_sublimit_pct: 0.25, third_party_sublimit_pct: 0.40 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { rp_id: $.data.id }
          trigger:
            - call: "GET /epli/rate-plans/${rp_id}"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
          assert:
            - "HTTP status is 200 and response_type == object"
            - "RatePlan.${rp_id}.name == EPLI Standard 2026"
            - "RatePlan.${rp_id}.base_rate_per_employee_cents == 41750"
            - "RatePlan.${rp_id}.min_premium_cents == 750000"
            - "RatePlan.${rp_id}.wage_hour_sublimit_pct == 0.25"
            - "RatePlan.${rp_id}.third_party_sublimit_pct == 0.40"
            - "RatePlan.${rp_id}.status == DRAFT"
            - "RatePlan.${rp_id}.version == 1"

      - name: list_defense_panel_firms_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /epli/defense-panel-firms]
          - entities.DefensePanelFirm.fields.blended_rate_cents
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three firms and limit 2, page one returns 2 rows with total_count 3 and has_more true, page two returns the remaining row with has_more false, and jurisdiction_code=TX narrows total_count to 2."
        test_recipe:
          setup:
            - "Jurisdictions CA and TX exist."
            - "Three DefensePanelFirm rows exist, created in this order: Ashford & Vance LLP (NATIONAL, CA+TX), Bellweather Rowe LLP (REGIONAL, CA), Lonestar Defense Group (REGIONAL, TX)."
          setup_api_calls:
            - call: "POST /epli/jurisdictions"
              payload: { code: "CA", name: "California", hazard_tier: "T4", admin_agency_name: "California Civil Rights Department", pre_suit_window_days: 180, wage_hour_multiplier: 1.60, class_action_propensity_pct: 42.00, pre_suit_mediation_required: true }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /epli/jurisdictions"
              payload: { code: "TX", name: "Texas", hazard_tier: "T2", admin_agency_name: "Texas Workforce Commission Civil Rights Division", pre_suit_window_days: 120, wage_hour_multiplier: 1.10, class_action_propensity_pct: 18.00 }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /epli/defense-panel-firms"
              payload: { name: "Ashford & Vance LLP", tier: "NATIONAL", jurisdiction_codes: ["CA", "TX"], partner_rate_cents_per_hour: 92000, associate_rate_cents_per_hour: 51000, paralegal_rate_cents_per_hour: 18000, capacity_open_matters: 3 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { firm_a_id: $.data.id }
            - call: "POST /epli/defense-panel-firms"
              payload: { name: "Bellweather Rowe LLP", tier: "REGIONAL", jurisdiction_codes: ["CA"], partner_rate_cents_per_hour: 70000, associate_rate_cents_per_hour: 43000, paralegal_rate_cents_per_hour: 16000, capacity_open_matters: 2 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { firm_b_id: $.data.id }
            - call: "POST /epli/defense-panel-firms"
              payload: { name: "Lonestar Defense Group", tier: "REGIONAL", jurisdiction_codes: ["TX"], partner_rate_cents_per_hour: 70000, associate_rate_cents_per_hour: 43000, paralegal_rate_cents_per_hour: 16000, capacity_open_matters: 2 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { firm_l_id: $.data.id }
          trigger:
            - call: "GET /epli/defense-panel-firms?limit=2&offset=0"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "GET /epli/defense-panel-firms?limit=2&offset=2"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "GET /epli/defense-panel-firms?jurisdiction_code=TX"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
          assert:
            - "page one: response_type == array, 2 items, limit == 2, offset == 0, total_count == 3, has_more == true"
            - "page one items are ${firm_a_id} then ${firm_b_id} in created_at ASC order"
            - "page two: 1 item == ${firm_l_id}, limit == 2, offset == 2, total_count == 3, has_more == false"
            - "the jurisdiction_code=TX page returns exactly 2 items, ${firm_a_id} and ${firm_l_id}, total_count == 2, has_more == false, and omits ${firm_b_id}"
            - "DefensePanelFirm.${firm_a_id}.blended_rate_cents == 60400"
            - "DefensePanelFirm.${firm_b_id}.blended_rate_cents == 48400"
            - "the default page for GET /epli/defense-panel-firms with no query params reports limit == 10 and offset == 0"

      - name: get_claim_by_unminted_uuid_returns_claim_not_found
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors[ERR_CLAIM_NOT_FOUND]
          - endpoints[GET /epli/claims/{claim_id}]
        distinguishing_aspect: "A syntactically valid UUID that was never minted resolves to no Claim row, so the path-existence rule at priority 4 returns ERR_CLAIM_NOT_FOUND with HTTP 404 and an error envelope."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /epli/claims/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "response_type == error and ${err} == ERR_CLAIM_NOT_FOUND"
            - "data.message is a non-empty string"

      - name: applicant_create_missing_required_fields_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - entities.Applicant.fields.primary_jurisdiction_code
          - entities.Applicant.fields.jurisdiction_headcounts
        distinguishing_aspect: "Each of the five Applicant fields declared source: input with no default is individually required: omitting primary_jurisdiction_code, then omitting jurisdiction_headcounts, both return ERR_INVALID_REQUEST at priority 3 before any FK resolution runs."
        test_recipe:
          setup:
            - "Jurisdiction TX exists so that no FK failure can mask the shape failure."
          setup_api_calls:
            - call: "POST /epli/jurisdictions"
              payload: { code: "TX", name: "Texas", hazard_tier: "T2", admin_agency_name: "Texas Workforce Commission Civil Rights Division", pre_suit_window_days: 120, wage_hour_multiplier: 1.10, class_action_propensity_pct: 18.00 }
              as: PlatformAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "POST /epli/applicants"
              payload: { legal_name: "Bayline Foods LLC", total_headcount: 40, prior_year_separations: 4, jurisdiction_headcounts: [{ code: "TX", headcount: 40 }] }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { err_no_primary: $.data.error_id }
            - call: "POST /epli/applicants"
              payload: { legal_name: "Bayline Foods LLC", total_headcount: 40, prior_year_separations: 4, primary_jurisdiction_code: "TX" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { err_no_alloc: $.data.error_id }
            - call: "POST /epli/applicants"
              payload: { total_headcount: 40, prior_year_separations: 4, jurisdiction_headcounts: [{ code: "TX", headcount: 40 }], primary_jurisdiction_code: "TX" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { err_no_name: $.data.error_id }
          assert:
            - "all three calls return HTTP 400 with response_type == error"
            - "${err_no_primary} == ERR_INVALID_REQUEST"
            - "${err_no_alloc} == ERR_INVALID_REQUEST"
            - "${err_no_name} == ERR_INVALID_REQUEST"

      - name: omitted_optional_inputs_take_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Jurisdiction.fields.pre_suit_mediation_required
          - entities.Applicant.fields.separations_since_assessment
          - entities.ExposureAssessment.fields.third_party_coverage_requested
          - entities.Claim.fields.claimant_count
        distinguishing_aspect: "Three unrelated optional inputs omitted in one chain each land on their declared default (false, 0, false) rather than null, and the ExposureAssessment starts with credit_basis_stale false."
        test_recipe:
          setup:
            - "Empty database; the logical clock stays at 2026-08-01T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /epli/rate-plans"
              payload: { name: "EPLI Standard 2026", base_rate_per_employee_cents: 41750, min_premium_cents: 750000, wage_hour_sublimit_pct: 0.25, third_party_sublimit_pct: 0.40 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { rp_id: $.data.id }
            - call: "POST /epli/rate-plans/${rp_id}/activate"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "POST /epli/jurisdictions"
              payload: { code: "NY", name: "New York", hazard_tier: "T3", admin_agency_name: "New York State Division of Human Rights", pre_suit_window_days: 150, wage_hour_multiplier: 1.35, class_action_propensity_pct: 31.00 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { jur_ny_id: $.data.id }
            - call: "POST /epli/applicants"
              payload: { legal_name: "Harborline Media Inc", total_headcount: 30, prior_year_separations: 3, jurisdiction_headcounts: [{ code: "NY", headcount: 30 }], primary_jurisdiction_code: "NY" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { app_id: $.data.id, app_v: $.data.version }
            - call: "POST /epli/exposure-assessments"
              payload: { applicant_id: "${app_id}", rate_plan_id: "${rp_id}", requested_aggregate_limit_cents: 10000000, requested_retention_cents: 2500000, expected_applicant_version: "${app_v}" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { asm_id: $.data.id }
          assert:
            - "Jurisdiction.${jur_ny_id}.pre_suit_mediation_required == false"
            - "Applicant.${app_id}.separations_since_assessment == 0"
            - "ExposureAssessment.${asm_id}.third_party_coverage_requested == false"
            - "ExposureAssessment.${asm_id}.credit_basis_stale == false"
            - "ExposureAssessment.${asm_id}.priced_by_user_id == null and approved_by_user_id == null"
            - "ExposureAssessment.${asm_id}.status == DRAFT and version == 1"

      - name: applicant_computed_exposure_fields_are_derived_and_unknown_input_rejected
        claim_type: computed_fields
        grounds:
          - entities.Applicant.fields.turnover_pct
          - entities.Applicant.fields.hazard_load_pct
          - entities.Applicant.fields.risk_credit_pct
          - entities.Applicant.fields.exposure_score
          - calculations.turnover_pct
          - calculations.exposure_score
        distinguishing_aspect: "For 40 headcount all in TX with 4 separations the four computed Applicant fields come out 10.00 / 0.070 / 0.00 / 28.00, and a client attempt to supply turnover_pct in the payload is rejected as an unknown field instead of being stored."
        test_recipe:
          setup:
            - "Jurisdiction TX (hazard_tier T2) exists. No RiskManagementService rows exist."
          setup_api_calls:
            - call: "POST /epli/jurisdictions"
              payload: { code: "TX", name: "Texas", hazard_tier: "T2", admin_agency_name: "Texas Workforce Commission Civil Rights Division", pre_suit_window_days: 120, wage_hour_multiplier: 1.10, class_action_propensity_pct: 18.00 }
              as: PlatformAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "POST /epli/applicants"
              payload: { legal_name: "Bayline Foods LLC", total_headcount: 40, prior_year_separations: 4, jurisdiction_headcounts: [{ code: "TX", headcount: 40 }], primary_jurisdiction_code: "TX" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { app_id: $.data.id }
            - call: "POST /epli/applicants"
              payload: { legal_name: "Bayline Foods Two LLC", total_headcount: 40, prior_year_separations: 4, jurisdiction_headcounts: [{ code: "TX", headcount: 40 }], primary_jurisdiction_code: "TX", turnover_pct: 1.00 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { err_unknown: $.data.error_id }
          assert:
            - "Applicant.${app_id}.turnover_pct == 10.00"
            - "Applicant.${app_id}.hazard_load_pct == 0.070"
            - "Applicant.${app_id}.risk_credit_pct == 0.00"
            - "Applicant.${app_id}.exposure_score == 28.00"
            - "Applicant.${app_id}.version == 1"
            - "the second call returns HTTP 400 and ${err_unknown} == ERR_INVALID_REQUEST"

      - name: rate_plan_create_mints_system_fields_and_activate_bumps_them
        claim_type: system_fields
        grounds:
          - entities.RatePlan.fields.status
          - state_machines.RatePlan.DRAFT_to_ACTIVE
          - endpoints[POST /epli/rate-plans]
        distinguishing_aspect: "id, created_at, updated_at, version and the enum status are all server-minted on create (version 1, status DRAFT, created_at == updated_at); a client-supplied status is rejected, and the activate transition moves updated_at forward while version becomes 2 and created_at is untouched."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /epli/rate-plans"
              payload: { name: "EPLI Standard 2026", base_rate_per_employee_cents: 41750, min_premium_cents: 750000, wage_hour_sublimit_pct: 0.25, third_party_sublimit_pct: 0.40 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { rp_id: $.data.id, rp_created: $.data.created_at }
            - call: "POST /epli/rate-plans"
              payload: { name: "EPLI Premier 2026", base_rate_per_employee_cents: 41750, min_premium_cents: 750000, wage_hour_sublimit_pct: 0.25, third_party_sublimit_pct: 0.40, status: "ACTIVE" }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { err_status: $.data.error_id }
            - call: "POST /epli/rate-plans/${rp_id}/activate"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
          assert:
            - "${rp_id} is a server-minted string id the client never supplied"
            - "on create RatePlan.${rp_id}.version == 1, status == DRAFT, created_at == updated_at == ${rp_created}"
            - "the second call returns HTTP 400 and ${err_status} == ERR_INVALID_REQUEST"
            - "after activate RatePlan.${rp_id}.status == ACTIVE, version == 2, created_at == ${rp_created}, updated_at > ${rp_created}"

      - name: enum_range_and_interval_type_constraints_return_invalid_request
        claim_type: type_constraints
        grounds:
          - validations[priority=3]
          - entities.Jurisdiction.fields.hazard_tier
          - entities.RatePlan.fields.wage_hour_sublimit_pct
          - entities.Applicant.fields.total_headcount
          - entities.DefensePanelFirm.fields.tier
          - entities.RiskManagementService.fields.effective_to
        distinguishing_aspect: "Five distinct shape defects each return ERR_INVALID_REQUEST: an off-enum hazard_tier T5, wage_hour_sublimit_pct 1.50 above its <= 1 ceiling, total_headcount 0 below its >= 1 floor, an off-enum firm tier GLOBAL, and a risk-management service whose effective_to equals effective_from; pagination limit 101 above the max 100 is the sixth."
        test_recipe:
          setup:
            - "Jurisdiction TX exists and applicant Bayline Foods LLC (40 headcount, TX 40) exists."
          setup_api_calls:
            - call: "POST /epli/jurisdictions"
              payload: { code: "TX", name: "Texas", hazard_tier: "T2", admin_agency_name: "Texas Workforce Commission Civil Rights Division", pre_suit_window_days: 120, wage_hour_multiplier: 1.10, class_action_propensity_pct: 18.00 }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /epli/applicants"
              payload: { legal_name: "Bayline Foods LLC", total_headcount: 40, prior_year_separations: 4, jurisdiction_headcounts: [{ code: "TX", headcount: 40 }], primary_jurisdiction_code: "TX" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /epli/jurisdictions"
              payload: { code: "NV", name: "Nevada", hazard_tier: "T5", admin_agency_name: "Nevada Equal Rights Commission", pre_suit_window_days: 120, wage_hour_multiplier: 1.10, class_action_propensity_pct: 12.00 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { err_tier: $.data.error_id }
            - call: "POST /epli/rate-plans"
              payload: { name: "EPLI Wide 2026", base_rate_per_employee_cents: 41750, min_premium_cents: 750000, wage_hour_sublimit_pct: 1.50, third_party_sublimit_pct: 0.40 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { err_pct: $.data.error_id }
            - call: "POST /epli/applicants"
              payload: { legal_name: "Zero Headcount LLC", total_headcount: 0, prior_year_separations: 0, jurisdiction_headcounts: [{ code: "TX", headcount: 1 }], primary_jurisdiction_code: "TX" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { err_hc: $.data.error_id }
            - call: "POST /epli/defense-panel-firms"
              payload: { name: "Global Reach Counsel LLP", tier: "GLOBAL", jurisdiction_codes: ["TX"], partner_rate_cents_per_hour: 70000, associate_rate_cents_per_hour: 43000, paralegal_rate_cents_per_hour: 16000, capacity_open_matters: 2 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { err_firm_tier: $.data.error_id }
            - call: "POST /epli/applicants/${app_id}/risk-management-services"
              payload: { service_type: "HOTLINE_SUBSCRIPTION", credit_pct: 0.08, effective_from: "2026-09-01T00:00:00.000Z", effective_to: "2026-09-01T00:00:00.000Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { err_interval: $.data.error_id }
            - call: "GET /epli/jurisdictions?limit=101"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { err_limit: $.data.error_id }
          assert:
            - "all six calls return HTTP 400 with response_type == error"
            - "${err_tier} == ERR_INVALID_REQUEST"
            - "${err_pct} == ERR_INVALID_REQUEST"
            - "${err_hc} == ERR_INVALID_REQUEST"
            - "${err_firm_tier} == ERR_INVALID_REQUEST"
            - "${err_interval} == ERR_INVALID_REQUEST"
            - "${err_limit} == ERR_INVALID_REQUEST"

      - name: claim_and_applicant_creates_reject_unresolvable_parent_references
        claim_type: parent_relationships
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_POLICY_NOT_FOUND]
          - errors[ERR_JURISDICTION_NOT_FOUND]
          - entities.Claim.parent
        distinguishing_aspect: "A Claim cannot be created under an unminted policy_id path parameter (ERR_POLICY_NOT_FOUND at priority 4) and an Applicant cannot be created against an unknown jurisdiction natural key in the body (ERR_JURISDICTION_NOT_FOUND at priority 5) — two different rungs of the existence ladder, two different error ids."
        test_recipe:
          setup:
            - "Jurisdiction TX exists; no Policy rows exist."
          setup_api_calls:
            - call: "POST /epli/jurisdictions"
              payload: { code: "TX", name: "Texas", hazard_tier: "T2", admin_agency_name: "Texas Workforce Commission Civil Rights Division", pre_suit_window_days: 120, wage_hour_multiplier: 1.10, class_action_propensity_pct: 18.00 }
              as: PlatformAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "POST /epli/policies/00000000-0000-4000-8000-0000000000aa/claims"
