      - name: priority_conflict_state_vs_acuity_on_booking
        grounds:
          - validations[priority=6]
          - validations[priority=12]
        distinguishing_aspect: |
          Error-category pair state(6, ERR_CYCLE_NOT_ACTIVE) vs
          business_temporal(12, ERR_NURSE_ACUITY_EXCEEDED): booking onto a PLANNED
          (not-yet-active) cycle while ALSO requesting acuity beyond the nurse's
          load — state check at priority 6 wins, returning ERR_CYCLE_NOT_ACTIVE
