scenario: |
  2244. Heavy Equipment Auction & Global Bidding (industrial equipment auctioneer): consignment intake with equipment inspection, hour meter verification and lien search, refurbishment, cleaning and photography with condition report generation, auction scheduling across live on-site and timed online events with global bidder registration, deposit, credit approval and payment terms by bidder country with financing options, unreserved sale policy versus reserve auctions and seller expectations management, buyer premium, taxes and export documentation including title and customs, post-sale settlement, equipment release and load-out scheduling, transport arrangement, storage fees and abandoned-purchase remedies

domain_name: heavy-equipment-auction
api_prefix: "/"   # flat topology: every entity collection is a top-level path segment

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by explicit foreign keys; action endpoints hang off the
  # owning resource only (POST /lots/{id}/hammer), never a parent/child URL chain.

  state_machine_shape: parallel
  # Lot carries two independent axes (lifecycle_status x title_status); Invoice
  # carries two independent axes (payment_status x release_status); Sale and
  # RefurbishmentOrder are cyclic; Consignment is compound (bubbles up from Lot).

  relationship_patterns:
    - one_to_many        # Consignment -> Lot, Invoice -> Payment
    - many_to_many       # Bidder x Auction via BidderRegistration
    - self_referential   # Lot.replacement_of_lot_id -> Lot.id (re-offer after abandonment)
    - cross_aggregate    # LoadoutSlot spans Invoice (sale aggregate) and LoadoutBay (yard aggregate)

  role_model: segregation_of_duties
  consistency_model: immediate

  difficulty_level: beyond_expert
  # 17 entities / 87 endpoints / 63 error codes / 7 calculations / 11 state machines
  # (9 distinct entities carry a machine; Lot and Invoice each carry two independent axes).

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Yard
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: human-readable yard code
        constraints: unique across Yard, 3-32 chars
      - name: country_code
        type: string
        source: input
        description: ISO-3166 alpha-2 country of the physical yard; drives domestic-vs-export classification
        constraints: exactly 2 uppercase letters
      - name: teardown_buffer_minutes
        type: integer
        source: input
        description: minutes of ring teardown required between two LIVE_ONSITE auctions at this yard
        default: 120
        constraints: 0 <= value <= 2880
      - name: loadout_deadline_days
        type: integer
        source: input
        description: days after an auction's window_end by which all load-out must finish
        default: 10
        constraints: 1 <= value <= 60
      - name: currency_code
        type: string
        source: input
        description: settlement currency for auctions held at this yard
        default: "USD"
        constraints: ISO-4217 alpha-3

  - name: LoadoutBay
    parent: null
    common_fields: true
    fields:
      - name: yard_id
        type: string
        source: input
        description: FK -> Yard.id; the yard that physically contains this bay
      - name: bay_number
        type: integer
        source: input
        description: bay index within the yard
        constraints: unique per (yard_id, bay_number); 1 <= value <= 99
      - name: crane_capacity_kg
        type: integer
        source: input
        description: maximum aggregate tonnage that may be reserved across time-overlapping slots in this bay
        constraints: 1000 <= value <= 500000
      - name: is_active
        type: boolean
        source: input
        description: false takes the bay out of service for new bookings
        default: true
      - name: reserved_tonnage_kg
        type: integer
        source: computed
        description: "sum of LoadoutSlot.tonnage_kg over slots of this bay with status IN {BOOKED, CHECKED_IN}"
        default: 0

  - name: Consignor
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: consignor legal entity name
        constraints: 2-120 chars
      - name: country_code
        type: string
        source: input
        description: ISO-3166 alpha-2 country of the consignor
        constraints: exactly 2 uppercase letters
      - name: seller_type
        type: enum
        source: input
        description: seller category
        constraints: "one of {DEALER, FLEET_OWNER, BANK_REPO, GOVERNMENT}"
      - name: unreserved_policy_ack
        type: boolean
        source: input
        description: consignor has signed the unreserved-sale disclosure; required to open an UNRESERVED consignment
        default: false
      - name: open_consignment_count
        type: integer
        source: computed
        description: "count of Consignment rows for this consignor with status IN {DRAFT, SUBMITTED, INTAKE_ACCEPTED, CATALOGED}"
        default: 0
      - name: lifetime_net_proceeds_cents
        type: integer
        source: computed
        description: "sum of ConsignorSettlement.net_proceeds_cents over settlements with status = POSTED reachable from this consignor"
        default: 0

  - name: Consignment
    parent: null
    common_fields: true
    fields:
      - name: consignor_id
        type: string
        source: input
        description: FK -> Consignor.id; owner of the consigned equipment
      - name: agreement_type
        type: enum
        source: input
        description: contractual sale policy for every lot in this consignment
        constraints: "one of {RESERVE, UNRESERVED}"
      - name: commission_schedule_code
        type: enum
        source: input
        description: commission table applied by consignor_net_proceeds
        constraints: "one of {RESERVE_STD, UNRESERVED_STD}"
      - name: refurb_authorization_cap_cents
        type: integer
        source: input
        description: maximum refurbishment cost rechargeable to the consignor across all lots of this consignment
        constraints: 0 <= value <= 100000000
      - name: advance_paid_cents
        type: integer
        source: input
        description: cash advanced to the consignor at intake, recoverable from proceeds
        default: 0
        constraints: 0 <= value <= 100000000
      - name: advance_outstanding_cents
        type: integer
        source: computed
        description: advance_paid_cents minus the sum of advance_recovery_cents over POSTED settlements of this consignment
        default: 0
      - name: status
        type: enum
        source: computed
        description: intake lifecycle state
        default: "DRAFT"
        constraints: "one of {DRAFT, SUBMITTED, INTAKE_ACCEPTED, CATALOGED}"
      - name: correction_note
        type: string
        source: input
        description: reviewer note recorded when intake returns the consignment to DRAFT
        default: null
      - name: unsold_lot_count
        type: integer
        source: computed
        description: "count of Lot rows of this consignment with lifecycle_status = UNSOLD"
        default: 0
      - name: reoffer_lot_count
        type: integer
        source: computed
        description: "count of Lot rows of this consignment with lifecycle_status = REOFFER_QUEUED"
        default: 0

  - name: Lot
    parent: null
    common_fields: true
    fields:
      - name: consignment_id
        type: string
        source: input
        description: FK -> Consignment.id; intake batch this unit arrived under
      - name: replacement_of_lot_id
        type: string
        source: input
        description: FK -> Lot.id; set when this lot re-offers equipment abandoned by a defaulting buyer
        default: null
      - name: auction_id
        type: string
        source: computed
        description: FK -> Auction.id; stamped by lot assignment, cleared never
        default: null
      - name: make
        type: string
        source: input
        description: equipment manufacturer
        constraints: 1-60 chars
      - name: model
        type: string
        source: input
        description: equipment model designation
        constraints: 1-60 chars
      - name: model_year
        type: integer
        source: input
        description: year of manufacture
        constraints: 1960 <= value <= 2030
      - name: serial_number
        type: string
        source: input
        description: manufacturer serial / PIN
        constraints: unique across Lot, 4-40 chars
      - name: hour_meter_reading
        type: integer
        source: input
        description: hour meter value declared by the consignor at intake
        constraints: 0 <= value <= 200000
      - name: weight_kg
        type: integer
        source: input
        description: shipping weight; drives storage daily rate and load-out tonnage
        constraints: 500 <= value <= 200000
      - name: title_required
        type: boolean
        source: input
        description: unit is titled (on-road equipment) so a title transfer fee applies at settlement
        default: false
      - name: reserve_price_cents
        type: integer
        source: input
        description: minimum acceptable hammer price; null means the lot sells unreserved
        default: null
        constraints: null or 1 <= value <= 1000000000
      - name: sold_as_hours_unverified
        type: boolean
        source: input
        description: consignor accepts cataloging with an unverifiable hour meter (hours-not-warranted disclaimer)
        default: false
      - name: lifecycle_status
        type: enum
        source: computed
        description: physical/commercial lifecycle axis, independent of title_status
        default: "INTAKE"
        constraints: "one of {INTAKE, INSPECTED, CATALOG_READY, ASSIGNED, HAMMERED, UNSOLD, SETTLED, RELEASED, REOFFER_QUEUED, WITHDRAWN}"
      - name: title_status
        type: enum
        source: computed
        description: lien/title axis, independent of lifecycle_status
        default: "TITLE_PENDING"
        constraints: "one of {TITLE_PENDING, LIEN_SEARCH_ORDERED, LIEN_CLEAR, LIEN_ENCUMBERED, LIEN_RELEASED}"
      - name: lien_search_reference
        type: string
        source: input
        description: reference number of the ordered lien search
        default: null
      - name: lienholder_name
        type: string
        source: input
        description: recorded lienholder when an encumbrance was found
        default: null
      - name: withdrawal_reason
        type: string
        source: input
        description: reason captured when the lot is withdrawn from sale
        default: null
      - name: high_bid_cents
        type: integer
        source: computed
        description: "max of Bid.amount_cents over bids on this lot with status = ACTIVE; 0 when no bid exists"
        default: 0

  - name: ConditionReport
    parent: null
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: FK -> Lot.id; inspected unit
      - name: inspector_user_id
        type: string
        source: system
        description: X-User-ID of the IntakeInspector who authored the report; segregation-of-duties anchor
      - name: structural_score
        type: number
        source: input
        description: structural condition score
        constraints: 0 <= value <= 100, at most 1 decimal place
      - name: powertrain_score
        type: number
        source: input
        description: engine/transmission condition score
        constraints: 0 <= value <= 100, at most 1 decimal place
      - name: hydraulics_score
        type: number
        source: input
        description: hydraulic system condition score
        constraints: 0 <= value <= 100, at most 1 decimal place
      - name: tires_score
        type: number
        source: input
        description: tires/undercarriage condition score
        constraints: 0 <= value <= 100, at most 1 decimal place
      - name: observed_hour_meter_reading
        type: integer
        source: input
        description: hour meter value read by the inspector on the machine
        constraints: 0 <= value <= 200000
      - name: hour_meter_verified
        type: boolean
        source: input
        description: inspector could verify the hour meter against ECM data
      - name: hour_meter_photo_ref
        type: string
        source: input
        description: photo asset reference of the hour meter
        default: null
      - name: hour_meter_variance_pct
        type: number
        source: computed
        description: abs(observed_hour_meter_reading - Lot.hour_meter_reading) / max(Lot.hour_meter_reading, 1), 4 decimals
      - name: grade_score
        type: number
        source: computed
        description: weighted condition score produced by lot_condition_grade, 2 decimals
      - name: grade_band
        type: enum
        source: computed
        description: banded grade published in the catalog
        constraints: "one of {A, B, C, D}"
      - name: status
        type: enum
        source: computed
        description: publication state of the report
        default: "DRAFT"
        constraints: "one of {DRAFT, PUBLISHED}"

  - name: RefurbishmentOrder
    parent: null
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: FK -> Lot.id; unit being refurbished, cleaned and photographed
      - name: scope_note
        type: string
        source: input
        description: work scope description
        constraints: 3-500 chars
      - name: estimated_cost_cents
        type: integer
        source: input
        description: estimated refurbishment cost
        constraints: 0 <= value <= 100000000
      - name: actual_cost_cents
        type: integer
        source: input
        description: cost submitted with the SUBMIT_QA action; basis of the consignor recharge
        default: null
      - name: qa_note
        type: string
        source: input
        description: latest QA reviewer note
        default: null
      - name: qa_signed_off_by_user_id
        type: string
        source: system
        description: X-User-ID of the inspector who passed QA; must differ from the lot report's inspector_user_id
        default: null
      - name: rework_round
        type: integer
        source: computed
        description: number of QA_REWORK decisions taken so far
        default: 0
      - name: status
        type: enum
        source: computed
        description: refurbishment workflow state
        default: "DRAFT"
        constraints: "one of {DRAFT, IN_PROGRESS, QA_REVIEW, REWORK, COMPLETED}"

  - name: Auction
    parent: null
    common_fields: true
    fields:
      - name: yard_id
        type: string
        source: input
        description: FK -> Yard.id; venue; also the load-out yard
      - name: kind
        type: enum
        source: input
        description: LIVE_ONSITE occupies the yard ring; TIMED_ONLINE does not
        constraints: "one of {LIVE_ONSITE, TIMED_ONLINE}"
      - name: reserve_policy
        type: enum
        source: input
        description: UNRESERVED forbids any lot carrying a reserve price
        constraints: "one of {UNRESERVED, RESERVE_ALLOWED}"
      - name: premium_schedule_code
        type: enum
        source: input
        description: buyer premium table applied to every sale in this auction
        constraints: "one of {STANDARD, LOW_VALUE_FLAT}"
      - name: window_start
        type: datetime
        source: input
        description: first instant of the bidding window (ISO 8601 UTC)
      - name: window_end
        type: datetime
        source: input
        description: last instant of the bidding window (ISO 8601 UTC); closed interval with window_start
        constraints: strictly greater than window_start
      - name: loadout_deadline_at
        type: datetime
        source: computed
        description: window_end + Yard.loadout_deadline_days days; no LoadoutSlot may end after it
      - name: status
        type: enum
        source: computed
        description: auction lifecycle
        default: "SCHEDULED"
        constraints: "one of {SCHEDULED, OPEN, CLOSED, RECONCILED}"
      - name: assigned_lot_count
        type: integer
        source: computed
        description: "count of Lot rows with auction_id = this auction and lifecycle_status NOT IN {WITHDRAWN}"
        default: 0
      - name: sold_lot_count
        type: integer
        source: computed
        description: "count of Sale rows of this auction with status IN {PROVISIONAL, CONSIGNOR_COUNTERED, CONFIRMED, SETTLED, DEFAULTED}"
        default: 0
      - name: unsold_lot_count
        type: integer
        source: computed
        description: "count of Lot rows with auction_id = this auction and lifecycle_status = UNSOLD"
        default: 0
      - name: gross_hammer_cents
        type: integer
        source: computed
        description: "sum of Sale.hammer_price_cents over sales of this auction with status IN {CONFIRMED, SETTLED}"
        default: 0

  - name: Bidder
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: bidder legal entity name
        constraints: 2-120 chars
      - name: country_code
        type: string
        source: input
        description: ISO-3166 alpha-2 country of the bidder; drives country tier, payment terms and tax rate
        constraints: exactly 2 uppercase letters
      - name: tax_id
        type: string
        source: input
        description: VAT / tax registration number
        default: null
      - name: country_tier
        type: enum
        source: computed
        description: risk tier derived from country_code by COUNTRY_TIER constants
        constraints: "one of {TIER_A, TIER_B, TIER_C}"
      - name: deposit_total_cents
        type: integer
        source: computed
        description: lifetime deposits received; conserved quantity anchor
        default: 0
      - name: deposit_held_cents
        type: integer
        source: computed
        description: deposits currently locked by non-terminal registrations
        default: 0
      - name: deposit_available_cents
        type: integer
        source: computed
        description: deposits free to be locked by a new registration
        default: 0
      - name: deposit_forfeited_cents
        type: integer
        source: computed
        description: deposits forfeited through abandoned purchases
        default: 0
      - name: open_exposure_cents
        type: integer
        source: computed
        description: "REGISTRATION_FORECAST exposure: sum of Invoice.total_due_cents for this bidder's invoices with payment_status IN {UNPAID, PARTIALLY_PAID} whose Sale.status IN {CONFIRMED, SETTLED}"
        default: 0
      - name: default_strike_count
        type: integer
        source: computed
        description: number of abandoned purchases charged to this bidder
        default: 0
      - name: lifetime_purchase_cents
        type: integer
        source: computed
        description: "sum of Sale.hammer_price_cents over this bidder's sales with status = SETTLED"
        default: 0

  - name: BidderRegistration
    parent: null
    common_fields: true
    fields:
      - name: bidder_id
        type: string
        source: input
        description: FK -> Bidder.id; registering bidder
      - name: auction_id
        type: string
        source: input
        description: FK -> Auction.id; auction being registered for
      - name: deposit_hold_cents
        type: integer
        source: input
        description: deposit locked for this auction; leveraged into the bid cap
        constraints: 1 <= value <= 1000000000
      - name: financing_requested
        type: boolean
        source: input
        description: bidder asks for equipment financing on this auction
        default: false
      - name: paddle_number
        type: integer
        source: system
        description: paddle assigned at creation; unique per auction, allocated as max(existing)+1 starting at 101
      - name: approved_credit_limit_cents
        type: integer
        source: input
        description: credit line granted by the credit decision
        default: 0
      - name: financing_approved
        type: boolean
        source: computed
        description: true when the credit decision approved a positive credit limit and financing_requested is true
        default: false
      - name: payment_terms_code
        type: enum
        source: computed
        description: "settlement terms stamped by the credit decision: NET_30 when financing_approved, else NET_7 for a TIER_A bidder, else PREPAY (see calculations.storage_fee_accrual constants PAYMENT_TERMS_*)"
        default: null
        constraints: "one of {PREPAY, NET_7, NET_30}"
      - name: leverage_multiplier
        type: integer
        source: computed
        description: deposit leverage from Bidder.country_tier
        default: null
      - name: bid_cap_cents
        type: integer
        source: computed
        description: REGISTRATION_FORECAST variant of bidder_exposure_and_bid_cap, stamped by the credit decision
        default: 0
      - name: credit_approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the SettlementOfficer who approved credit; segregation-of-duties anchor
        default: null
      - name: decline_reason
        type: string
        source: input
        description: reason recorded when credit is declined
        default: null
      - name: deposit_applied_total_cents
        type: integer
        source: computed
        description: "sum of Invoice.deposit_applied_cents over invoices of this registration"
        default: 0
      - name: status
        type: enum
        source: computed
        description: registration lifecycle
        default: "REQUESTED"
        constraints: "one of {REQUESTED, APPROVED, DECLINED, SUSPENDED, CANCELLED}"

  - name: Bid
    parent: null
    common_fields: false
    fields:
      - name: registration_id
        type: string
        source: input
        description: FK -> BidderRegistration.id; approved registration placing the bid
      - name: lot_id
        type: string
        source: input
        description: FK -> Lot.id; lot being bid on
      - name: amount_cents
        type: integer
        source: input
        description: bid amount
        constraints: 1 <= value <= 1000000000
      - name: placed_at
        type: datetime
        source: system
        description: logical clock value at acceptance
      - name: status
        type: enum
        source: computed
        description: append-only bid state
        default: "ACTIVE"
        constraints: "one of {ACTIVE, WINNING, LOSING}"

  - name: Sale
    parent: null
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: FK -> Lot.id; hammered lot
      - name: auction_id
        type: string
        source: computed
        description: FK -> Auction.id; copied from the lot at hammer time
      - name: winning_bid_id
        type: string
        source: computed
        description: FK -> Bid.id; the highest ACTIVE bid at hammer time
      - name: registration_id
        type: string
        source: computed
        description: FK -> BidderRegistration.id; registration of the winning bid
      - name: hammer_price_cents
        type: integer
        source: computed
        description: amount_cents of the winning bid
      - name: reserve_met
        type: boolean
        source: computed
        description: true when the lot sells unreserved or hammer_price_cents >= Lot.reserve_price_cents
      - name: hammered_at
        type: datetime
        source: system
        description: logical clock value at hammer; the ordering key for deposit application and settlement replay
      - name: counter_round
        type: integer
        source: computed
        description: number of consignor counteroffers issued on this sale
        default: 0
      - name: counter_price_cents
        type: integer
        source: input
        description: latest consignor counteroffer price
        default: null
      - name: reject_reason
        type: string
        source: input
        description: reason recorded when the consignor rejects the provisional result
        default: null
      - name: status
        type: enum
        source: computed
        description: sale negotiation/settlement state
        default: "PROVISIONAL"
        constraints: "one of {PROVISIONAL, CONSIGNOR_COUNTERED, CONFIRMED, NO_SALE, SETTLED, DEFAULTED}"

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: sale_id
        type: string
        source: input
        description: FK -> Sale.id; the confirmed sale being settled
      - name: bidder_id
        type: string
        source: computed
        description: FK -> Bidder.id; buyer
      - name: registration_id
        type: string
        source: computed
        description: FK -> BidderRegistration.id; registration whose deposit and terms apply
      - name: settlement_variant
        type: enum
        source: computed
        description: which variant of buyer_settlement_total is currently stamped
        default: "PROVISIONAL"
        constraints: "one of {PROVISIONAL, FINAL}"
      - name: hammer_price_cents
        type: integer
        source: computed
        description: denormalized copy of Sale.hammer_price_cents
      - name: is_cross_border
        type: boolean
        source: computed
        description: true when Bidder.country_code differs from the auction yard's country_code
      - name: buyer_premium_cents
        type: integer
        source: computed
        description: output of buyer_premium_computation
      - name: documentation_fee_cents
        type: integer
        source: computed
        description: DOC_FEE_DOMESTIC_CENTS or DOC_FEE_EXPORT_CENTS by is_cross_border
      - name: title_transfer_fee_cents
        type: integer
        source: computed
        description: TITLE_TRANSFER_FEE_CENTS when Lot.title_required else 0
      - name: financing_fee_cents
        type: integer
        source: computed
        description: FINANCING_FEE_PCT of hammer when the registration has financing_approved
      - name: subtotal_cents
        type: integer
        source: computed
        description: hammer_price_cents + buyer_premium_cents + documentation_fee_cents + title_transfer_fee_cents + financing_fee_cents
      - name: tax_rate_applied
        type: number
        source: computed
        description: tax rate used for tax_cents, 4 decimals
      - name: tax_cents
        type: integer
        source: computed
        description: round_half_up(subtotal_cents * tax_rate_applied)
      - name: chargeable_storage_days
        type: integer
        source: computed
        description: whole elapsed days beyond the free-storage grace end
        default: 0
      - name: storage_fee_cents
        type: integer
        source: computed
        description: output of storage_fee_accrual
        default: 0
      - name: credit_memo_cents
        type: integer
        source: computed
        description: cumulative approved fee waivers
        default: 0
      - name: deposit_applied_cents
        type: integer
        source: computed
        description: portion of the registration deposit hold offset against this invoice
        default: 0
      - name: total_due_cents
        type: integer
        source: computed
        description: subtotal_cents + tax_cents + storage_fee_cents - credit_memo_cents - deposit_applied_cents
      - name: amount_paid_cents
        type: integer
        source: computed
        description: "sum of Payment.amount_cents over payments of this invoice with status = SETTLED"
        default: 0
      - name: outstanding_cents
        type: integer
        source: computed
        description: max(0, total_due_cents - amount_paid_cents)
      - name: grace_end_at
        type: datetime
        source: computed
        description: Sale.hammered_at + free_storage_days of the registration's payment terms
      - name: payment_due_at
        type: datetime
        source: computed
        description: "Sale.hammered_at + DUE_DAYS of the registration's payment_terms_code (see calculations.buyer_settlement_total constants DUE_DAYS_PREPAY 2, DUE_DAYS_NET_7 7, DUE_DAYS_NET_30 30)"
      - name: deficiency_claim_cents
        type: integer
        source: computed
        description: output of abandonment_deficiency; 0 until abandonment
        default: 0
      - name: payment_status
        type: enum
        source: computed
        description: money axis, independent of release_status
        default: "UNPAID"
        constraints: "one of {UNPAID, PARTIALLY_PAID, PAID, IN_DEFAULT, WRITTEN_OFF}"
      - name: release_status
        type: enum
        source: computed
        description: custody axis, independent of payment_status
        default: "HELD"
        constraints: "one of {HELD, RELEASE_AUTHORIZED, LOADOUT_BOOKED, LOADED_OUT, ABANDONED}"

  - name: Payment
    parent: null
    common_fields: false
    fields:
      - name: invoice_id
        type: string
        source: input
        description: FK -> Invoice.id; invoice being paid
      - name: amount_cents
        type: integer
        source: input
        description: amount tendered
        constraints: 1 <= value <= 1000000000
      - name: method
        type: enum
        source: input
        description: tender method
        constraints: "one of {WIRE, CARD, FINANCED_DRAW}"
      - name: currency_code
        type: string
        source: input
        description: currency tendered; must equal the auction yard's currency_code
        constraints: ISO-4217 alpha-3
      - name: status
        type: enum
        source: computed
        description: payment state
        default: "SETTLED"
        constraints: "one of {SETTLED, REVERSED}"
      - name: received_at
        type: datetime
        source: system
        description: logical clock value at acceptance

  - name: ExportDocumentPacket
    parent: null
    common_fields: true
    fields:
      - name: invoice_id
        type: string
        source: input
        description: FK -> Invoice.id; cross-border invoice this packet clears
      - name: destination_country_code
        type: string
        source: input
        description: ISO-3166 alpha-2 destination; must equal the buyer's Bidder.country_code
        constraints: exactly 2 uppercase letters
      - name: title_document_ref
        type: string
        source: input
        description: title / MSO document reference attached to the packet
        default: null
      - name: customs_entry_ref
        type: string
        source: input
        description: customs entry / EEI filing reference
        default: null
      - name: rejection_reason
        type: string
        source: input
        description: customs rejection reason
        default: null
      - name: reopen_count
        type: integer
        source: computed
        description: number of times the packet returned to PREPARING after a customs rejection
        default: 0
      - name: status
        type: enum
        source: computed
        description: export documentation state
        default: "PREPARING"
        constraints: "one of {PREPARING, TITLE_ATTACHED, CUSTOMS_FILED, EXPORT_CLEARED, CUSTOMS_REJECTED}"

  - name: LoadoutSlot
    parent: null
    common_fields: true
    fields:
      - name: invoice_id
        type: string
        source: input
        description: FK -> Invoice.id; invoice whose equipment is being loaded out
      - name: bay_id
        type: string
        source: input
        description: FK -> LoadoutBay.id; bay reserved for the load-out
      - name: slot_start
        type: datetime
        source: input
        description: inclusive start of the reservation
      - name: slot_end
        type: datetime
        source: input
        description: exclusive end of the reservation; half-open interval semantics
        constraints: strictly greater than slot_start
      - name: tonnage_kg
        type: integer
        source: input
        description: tonnage reserved against the bay crane; defaults to the lot weight
        default: null
        constraints: null or 1 <= value <= Lot.weight_kg
      - name: transport_mode
        type: enum
        source: input
        description: arranged transport for this load-out
        constraints: "one of {BUYER_ARRANGED, HOUSE_BROKERED, RAIL, OCEAN_CONTAINER}"
      - name: gate_pass_ref
        type: string
        source: input
        description: gate pass reference recorded at completion
        default: null
      - name: supersedes_slot_id
        type: string
        source: computed
        description: FK -> LoadoutSlot.id; slot cancelled by this rebooking
        default: null
      - name: cancel_reason
        type: string
        source: input
        description: reason recorded on cancellation
        default: null
      - name: status
        type: enum
        source: computed
        description: load-out slot state
        default: "BOOKED"
        constraints: "one of {BOOKED, CHECKED_IN, COMPLETED, CANCELLED, NO_SHOW}"

  - name: ConsignorSettlement
    parent: null
    common_fields: true
    fields:
      - name: sale_id
        type: string
        source: input
        description: FK -> Sale.id; sale being settled to the consignor
      - name: gross_proceeds_cents
        type: integer
        source: computed
        description: Sale.hammer_price_cents while POSTED; 0 once REVERSED
      - name: commission_cents
        type: integer
        source: computed
        description: waterfall bucket 1 from consignor_net_proceeds
      - name: refurb_recharge_cents
        type: integer
        source: computed
        description: waterfall bucket 2, capped by Consignment.refurb_authorization_cap_cents
      - name: house_absorbed_refurb_cents
        type: integer
        source: computed
        description: refurbishment cost above the authorization cap, absorbed by the auctioneer
        default: 0
      - name: advance_recovery_cents
        type: integer
        source: computed
        description: waterfall bucket 3, recovering Consignment.advance_outstanding_cents
      - name: no_sale_fee_cents
        type: integer
        source: computed
        description: waterfall bucket 4; NO_SALE_FEE_CENTS once the settlement is reversed
        default: 0
      - name: net_proceeds_cents
        type: integer
        source: computed
        description: residual bucket; may be negative after reversal
      - name: status
        type: enum
        source: computed
        description: settlement posting state
        default: "POSTED"
        constraints: "one of {POSTED, REVERSED}"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Consignment
    state_field: status
    initial_state: DRAFT
    terminal_states: [CATALOGED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /consignments/{consignment_id}/submit"
        actor: Consignor
        preconditions:
          - "status == DRAFT"
          - "at least one Lot exists with consignment_id == this consignment"
          - "agreement_type == UNRESERVED implies Consignor.unreserved_policy_ack == true"
        side_effects:
          - "Consignment.updated_at refreshed; Consignment.version incremented by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /consignments/{consignment_id}/intake-decision with decision = RETURN"
        actor: AuctionOperator
        preconditions:
          - "status == SUBMITTED"
          - "correction_note is present in the request"
        side_effects:
          - "Consignment.correction_note set to the request note"
          - "Consignment.version incremented by 1"
        note: "Revert edge; the same consignment may be resubmitted any number of times."
      - from: SUBMITTED
        to: INTAKE_ACCEPTED
        trigger: "POST /consignments/{consignment_id}/intake-decision with decision = ACCEPT"
        actor: AuctionOperator
        preconditions:
          - "status == SUBMITTED"
          - "every Lot of this consignment has lifecycle_status IN {INTAKE, INSPECTED, WITHDRAWN}"
        side_effects:
          - "Consignor.open_consignment_count recomputed"
          - "Consignment.version incremented by 1"
      - from: INTAKE_ACCEPTED
        to: CATALOGED
        trigger: "system: bubble-up when the last non-WITHDRAWN Lot of the consignment reaches lifecycle_status = CATALOG_READY (POST /condition-reports/{report_id}/publish)"
        actor: system
        preconditions:
          - "status == INTAKE_ACCEPTED"
          - "every Lot of this consignment has lifecycle_status IN {CATALOG_READY, WITHDRAWN}"
          - "at least one Lot has lifecycle_status == CATALOG_READY"
        side_effects:
          - "Consignment.status = CATALOGED; Consignment.version incremented by 1"
        note: "Compound/aggregate transition: parent state is a function of child states."

  - entity: Lot
    state_field: lifecycle_status
    initial_state: INTAKE
    terminal_states: [RELEASED, WITHDRAWN]
    transitions:
      - from: INTAKE
        to: INSPECTED
        trigger: "POST /lots/{lot_id}/condition-reports"
        actor: IntakeInspector
        preconditions:
          - "lifecycle_status == INTAKE"
          - "no ConditionReport already exists for this lot"
          - "Consignment.status IN {SUBMITTED, INTAKE_ACCEPTED}"
        side_effects:
          - "ConditionReport created in status DRAFT with grade_score / grade_band from lot_condition_grade"
          - "Lot.version incremented by 1"
      - from: INSPECTED
        to: CATALOG_READY
        trigger: "POST /condition-reports/{report_id}/publish"
        actor: IntakeInspector
        preconditions:
          - "lifecycle_status == INSPECTED"
          - "the report's status == DRAFT"
          - "every RefurbishmentOrder of this lot has status == COMPLETED (vacuously true when none exist)"
          - "Consignment.status == INTAKE_ACCEPTED"
        side_effects:
          - "ConditionReport.status = PUBLISHED"
          - "Lot.version incremented by 1"
          - "cascade: when every non-WITHDRAWN sibling Lot is CATALOG_READY, Consignment.status INTAKE_ACCEPTED -> CATALOGED"
      - from: CATALOG_READY
        to: ASSIGNED
        trigger: "POST /auctions/{auction_id}/lot-assignments"
        actor: AuctionOperator
        preconditions:
          - "lifecycle_status == CATALOG_READY"
          - "Consignment.status == CATALOGED"
          - "Auction.status == SCHEDULED"
          - "Lot.title_status IN {LIEN_CLEAR, LIEN_RELEASED}"
          - "the lot's ConditionReport.status == PUBLISHED"
          - "ConditionReport.hour_meter_verified == true OR Lot.sold_as_hours_unverified == true"
          - "Auction.reserve_policy == RESERVE_ALLOWED OR Lot.reserve_price_cents is null"
          - "Consignment.agreement_type == RESERVE OR Lot.reserve_price_cents is null"
        side_effects:
          - "Lot.auction_id = auction; Auction.assigned_lot_count recomputed"
          - "Lot.reserve_price_cents overwritten when the request supplies reserve_price_cents"
          - "Lot.version and Auction.version each incremented by 1"
      - from: ASSIGNED
        to: HAMMERED
        trigger: "POST /lots/{lot_id}/hammer, or system fan-out from POST /auctions/{auction_id}/close"
        actor: AuctionOperator
        preconditions:
          - "lifecycle_status == ASSIGNED"
          - "Auction.status == OPEN"
          - "Lot.high_bid_cents > 0"
        side_effects:
          - "Sale created (see Sale machine) with hammer_price_cents = Lot.high_bid_cents and hammered_at = logical clock"
          - "the winning Bid.status = WINNING; every other ACTIVE bid on this lot becomes LOSING"
          - "Lot.version incremented by 1"
      - from: ASSIGNED
        to: UNSOLD
        trigger: "system: POST /auctions/{auction_id}/close with Lot.high_bid_cents == 0"
        actor: system
        preconditions:
          - "lifecycle_status == ASSIGNED"
          - "Lot.high_bid_cents == 0"
        side_effects:
          - "no Sale row is created"
          - "Consignment.unsold_lot_count and Auction.unsold_lot_count each recomputed"
          - "Lot.version incremented by 1"
      - from: HAMMERED
        to: UNSOLD
        trigger: "system: Sale reaches NO_SALE (POST /sales/{sale_id}/reject or a final counteroffer decline)"
        actor: system
        preconditions:
          - "lifecycle_status == HAMMERED"
          - "the lot's Sale.status == NO_SALE"
        side_effects:
          - "Consignment.unsold_lot_count and Auction.unsold_lot_count each recomputed"
          - "Lot.version incremented by 1"
      - from: HAMMERED
        to: SETTLED
        trigger: "system: POST /consignor-settlements posts a settlement for this lot's sale"
        actor: system
        preconditions:
          - "lifecycle_status == HAMMERED"
          - "the lot's Sale.status == CONFIRMED"
        side_effects:
          - "Sale.status CONFIRMED -> SETTLED"
          - "Lot.version incremented by 1"
      - from: SETTLED
        to: RELEASED
        trigger: "system: POST /loadout-slots/{slot_id}/complete"
        actor: system
        preconditions:
          - "lifecycle_status == SETTLED"
          - "Invoice.release_status == LOADOUT_BOOKED and the slot status == CHECKED_IN"
        side_effects:
          - "Invoice.release_status LOADOUT_BOOKED -> LOADED_OUT"
          - "LoadoutBay.reserved_tonnage_kg recomputed (the completed slot no longer reserves tonnage)"
          - "Bidder.lifetime_purchase_cents recomputed"
          - "Lot.version incremented by 1"
      - from: SETTLED
        to: REOFFER_QUEUED
        trigger: "system: cascade link 4 of POST /invoices/{invoice_id}/abandon"
        actor: system
        preconditions:
          - "lifecycle_status == SETTLED"
          - "the lot's ConsignorSettlement.status has just become REVERSED"
        side_effects:
          - "Consignment.reoffer_lot_count recomputed"
          - "Lot.version incremented by 1"
      - from: INTAKE
        to: WITHDRAWN
        trigger: "POST /lots/{lot_id}/withdraw"
        actor: AuctionOperator
        preconditions:
          - "lifecycle_status IN {INTAKE, INSPECTED, CATALOG_READY, ASSIGNED}"
          - "no Sale exists for this lot"
        side_effects:
          - "every ACTIVE Bid on this lot becomes LOSING"
          - "Auction.assigned_lot_count recomputed when the lot was ASSIGNED"
          - "Lot.version incremented by 1"
        note: "The same withdraw edge is valid from INSPECTED, CATALOG_READY and ASSIGNED."
      - from: ASSIGNED
        to: WITHDRAWN
        trigger: "POST /lots/{lot_id}/withdraw"
        actor: AuctionOperator
        preconditions:
          - "lifecycle_status == ASSIGNED"
          - "Auction.status IN {SCHEDULED, OPEN}"
          - "no Sale exists for this lot"
        side_effects:
          - "every ACTIVE Bid on this lot becomes LOSING"
          - "Auction.assigned_lot_count recomputed"
          - "Lot.version incremented by 1"

  - entity: Lot
    state_field: title_status
    initial_state: TITLE_PENDING
    terminal_states: []
    transitions:
      - from: TITLE_PENDING
        to: LIEN_SEARCH_ORDERED
        trigger: "POST /lots/{lot_id}/lien-search"
        actor: ComplianceOfficer
        preconditions:
          - "title_status == TITLE_PENDING"
          - "lifecycle_status != WITHDRAWN"
        side_effects:
          - "Lot.lien_search_reference set; Lot.version incremented by 1"
        note: "This axis advances independently of lifecycle_status."
      - from: LIEN_SEARCH_ORDERED
        to: LIEN_CLEAR
        trigger: "POST /lots/{lot_id}/lien-result with encumbrance_found = false"
        actor: ComplianceOfficer
        preconditions:
          - "title_status == LIEN_SEARCH_ORDERED"
        side_effects:
          - "Lot.version incremented by 1"
      - from: LIEN_SEARCH_ORDERED
        to: LIEN_ENCUMBERED
        trigger: "POST /lots/{lot_id}/lien-result with encumbrance_found = true"
        actor: ComplianceOfficer
        preconditions:
          - "title_status == LIEN_SEARCH_ORDERED"
          - "lienholder_name is present in the request"
        side_effects:
          - "Lot.lienholder_name set; Lot.version incremented by 1"
      - from: LIEN_ENCUMBERED
        to: LIEN_RELEASED
        trigger: "POST /lots/{lot_id}/lien-release"
        actor: ComplianceOfficer
        preconditions:
          - "title_status == LIEN_ENCUMBERED"
        side_effects:
          - "Lot.version incremented by 1"

  - entity: RefurbishmentOrder
    state_field: status
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    transitions:
      - from: DRAFT
        to: IN_PROGRESS
        trigger: "POST /refurbishment-orders/{order_id}/transition with action = START"
        actor: IntakeInspector
        preconditions:
          - "status == DRAFT"
          - "Lot.lifecycle_status == INSPECTED"
        side_effects:
          - "RefurbishmentOrder.version incremented by 1"
      - from: IN_PROGRESS
        to: QA_REVIEW
        trigger: "POST /refurbishment-orders/{order_id}/transition with action = SUBMIT_QA"
        actor: IntakeInspector
        preconditions:
          - "status == IN_PROGRESS"
          - "actual_cost_cents is present in the request"
        side_effects:
          - "RefurbishmentOrder.actual_cost_cents overwritten with the submitted value"
          - "RefurbishmentOrder.version incremented by 1"
      - from: QA_REVIEW
        to: REWORK
        trigger: "POST /refurbishment-orders/{order_id}/transition with action = QA_REWORK"
        actor: IntakeInspector
        preconditions:
          - "status == QA_REVIEW"
          - "rework_round < MAX_REWORK_ROUNDS"
          - "qa_note is present in the request"
        side_effects:
          - "RefurbishmentOrder.rework_round incremented by 1; qa_note set"
          - "RefurbishmentOrder.version incremented by 1"
      - from: REWORK
        to: IN_PROGRESS
        trigger: "POST /refurbishment-orders/{order_id}/transition with action = START"
        actor: IntakeInspector
        preconditions:
          - "status == REWORK"
        side_effects:
          - "RefurbishmentOrder.version incremented by 1"
        note: "Closes the QA_REVIEW -> REWORK -> IN_PROGRESS -> QA_REVIEW cycle; at most MAX_REWORK_ROUNDS laps."
      - from: QA_REVIEW
        to: COMPLETED
        trigger: "POST /refurbishment-orders/{order_id}/transition with action = QA_PASS"
        actor: IntakeInspector
        preconditions:
          - "status == QA_REVIEW"
          - "actual_cost_cents is not null"
          - "acting X-User-ID differs from the lot's ConditionReport.inspector_user_id"
        side_effects:
          - "RefurbishmentOrder.qa_signed_off_by_user_id = acting X-User-ID"
          - "RefurbishmentOrder.version incremented by 1"

  - entity: Auction
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [RECONCILED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /auctions/{auction_id}/open"
        actor: AuctionOperator
        preconditions:
          - "status == SCHEDULED"
          - "logical clock <= window_end"
          - "assigned_lot_count >= 1"
        side_effects:
          - "Auction.version incremented by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /auctions/{auction_id}/close"
        actor: AuctionOperator
        preconditions:
          - "status == OPEN"
        side_effects:
          - "cascade link 2: every ASSIGNED Lot of this auction is processed in Lot.created_at ASC order; high_bid_cents > 0 auto-hammers (Lot ASSIGNED -> HAMMERED, Sale created), high_bid_cents == 0 becomes UNSOLD"
          - "cascade link 3: each Sale created with status CONFIRMED creates an Invoice with settlement_variant = PROVISIONAL"
          - "cascade link 4: each Invoice creation recomputes Bidder.open_exposure_cents, BidderRegistration.deposit_applied_total_cents, Auction.sold_lot_count, Auction.unsold_lot_count and Auction.gross_hammer_cents"
          - "Auction.version incremented by 1"
      - from: CLOSED
        to: RECONCILED
        trigger: "POST /auctions/{auction_id}/reconcile"
        actor: SettlementOfficer
        preconditions:
          - "status == CLOSED"
          - "every Sale of this auction with status == CONFIRMED has a ConsignorSettlement with status == POSTED"
          - "no Sale of this auction has status IN {PROVISIONAL, CONSIGNOR_COUNTERED}"
        side_effects:
          - "Auction.gross_hammer_cents recomputed; Auction.version incremented by 1"
        note: "Compound precondition: the parent may only close its books once every child sale is resolved."

  - entity: BidderRegistration
    state_field: status
    initial_state: REQUESTED
    terminal_states: [DECLINED, CANCELLED, SUSPENDED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /bidder-registrations/{registration_id}/credit-decision with decision = APPROVE"
        actor: SettlementOfficer
        preconditions:
          - "status == REQUESTED"
          - "Auction.status IN {SCHEDULED, OPEN}"
          - "Bidder.country_code is not in EMBARGOED_COUNTRY_CODES"
          - "Bidder.default_strike_count < MAX_DEFAULT_STRIKES"
        side_effects:
          - "payment_terms_code, leverage_multiplier and financing_approved derived from Bidder.country_tier and financing_requested"
          - "bid_cap_cents stamped from bidder_exposure_and_bid_cap variant REGISTRATION_FORECAST"
          - "credit_approved_by_user_id = acting X-User-ID"
          - "BidderRegistration.version incremented by 1"
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /bidder-registrations/{registration_id}/credit-decision with decision = DECLINE"
        actor: SettlementOfficer
        preconditions:
          - "status == REQUESTED"
          - "decline_reason is present in the request"
        side_effects:
          - "deposit hold released: Bidder.deposit_held_cents decreased and Bidder.deposit_available_cents increased by deposit_hold_cents"
          - "BidderRegistration.version incremented by 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /bidder-registrations/{registration_id}/cancel"
        actor: Bidder
        preconditions:
          - "status IN {REQUESTED, APPROVED}"
          - "no Bid with status IN {ACTIVE, WINNING} exists for this registration"
        side_effects:
          - "compensating action: Bidder.deposit_held_cents decreased and Bidder.deposit_available_cents increased by deposit_hold_cents, leaving Bidder.deposit_total_cents unchanged"
          - "BidderRegistration.version incremented by 1"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /bidder-registrations/{registration_id}/cancel"
        actor: Bidder
        preconditions:
          - "status == APPROVED"
          - "no Bid with status IN {ACTIVE, WINNING} exists for this registration"
        side_effects:
          - "compensating action: deposit hold released exactly as from REQUESTED"
          - "BidderRegistration.version incremented by 1"
      - from: APPROVED
        to: SUSPENDED
        trigger: "system: cascade of POST /invoices/{invoice_id}/abandon once Bidder.default_strike_count reaches MAX_DEFAULT_STRIKES"
        actor: system
        preconditions:
          - "status == APPROVED"
          - "Bidder.default_strike_count >= MAX_DEFAULT_STRIKES"
        side_effects:
          - "bid_cap_cents set to 0"
          - "BidderRegistration.version incremented by 1"

  - entity: Sale
    state_field: status
    initial_state: PROVISIONAL
    terminal_states: [NO_SALE, DEFAULTED]
    transitions:
      - from: PROVISIONAL
        to: CONFIRMED
        trigger: "system: at Sale creation when Auction.reserve_policy == UNRESERVED, Lot.reserve_price_cents is null, or hammer_price_cents >= Lot.reserve_price_cents"
        actor: system
        preconditions:
          - "reserve_met == true"
        side_effects:
          - "Invoice created with settlement_variant = PROVISIONAL and totals from buyer_settlement_total"
          - "Bidder.open_exposure_cents recomputed"
          - "Auction.sold_lot_count and Auction.gross_hammer_cents recomputed"
          - "Sale.version incremented by 1"
        note: "Boundary: hammer_price_cents exactly equal to reserve_price_cents satisfies >= and confirms."
      - from: PROVISIONAL
        to: CONSIGNOR_COUNTERED
        trigger: "POST /sales/{sale_id}/counteroffer"
        actor: Consignor
        preconditions:
          - "status == PROVISIONAL and reserve_met == false"
          - "expected_sale_version equals Sale.version"
          - "counter_round < MAX_COUNTER_ROUNDS"
          - "counter_price_cents >= hammer_price_cents"
          - "counter_price_cents <= Lot.reserve_price_cents"
          - "counter_round == 0 OR counter_price_cents <= the previous counter_price_cents"
        side_effects:
          - "Sale.counter_round incremented by 1; Sale.counter_price_cents set"
          - "Sale.version incremented by 1"
      - from: CONSIGNOR_COUNTERED
        to: CONFIRMED
        trigger: "POST /sales/{sale_id}/counter-response with decision = ACCEPT"
        actor: Bidder
        preconditions:
          - "status == CONSIGNOR_COUNTERED"
          - "acting X-User-ID equals the Sale's registration bidder_id"
          - "counter_price_cents <= the registration's bid_cap_cents"
        side_effects:
          - "Sale.hammer_price_cents overwritten with counter_price_cents; reserve_met = true"
          - "Invoice created with settlement_variant = PROVISIONAL"
          - "Bidder.open_exposure_cents, Auction.sold_lot_count and Auction.gross_hammer_cents recomputed"
          - "Sale.version incremented by 1"
      - from: CONSIGNOR_COUNTERED
        to: PROVISIONAL
        trigger: "POST /sales/{sale_id}/counter-response with decision = DECLINE and counter_round < MAX_COUNTER_ROUNDS"
        actor: Bidder
        preconditions:
          - "status == CONSIGNOR_COUNTERED"
          - "counter_round < MAX_COUNTER_ROUNDS"
        side_effects:
          - "Sale.version incremented by 1"
        note: "Cyclic edge: the sale returns to PROVISIONAL so the consignor may counter again, at most MAX_COUNTER_ROUNDS laps."
      - from: CONSIGNOR_COUNTERED
        to: NO_SALE
        trigger: "POST /sales/{sale_id}/counter-response with decision = DECLINE and counter_round == MAX_COUNTER_ROUNDS"
        actor: Bidder
        preconditions:
          - "status == CONSIGNOR_COUNTERED"
          - "counter_round == MAX_COUNTER_ROUNDS"
        side_effects:
          - "Lot.lifecycle_status HAMMERED -> UNSOLD; Consignment.unsold_lot_count and Auction.unsold_lot_count recomputed"
          - "the winning Bid.status WINNING -> LOSING"
          - "Sale.version incremented by 1"
      - from: PROVISIONAL
        to: NO_SALE
        trigger: "POST /sales/{sale_id}/reject"
        actor: Consignor
        preconditions:
          - "status == PROVISIONAL and reserve_met == false"
          - "reason is present in the request"
        side_effects:
          - "Lot.lifecycle_status HAMMERED -> UNSOLD; Consignment.unsold_lot_count and Auction.unsold_lot_count recomputed"
          - "the winning Bid.status WINNING -> LOSING"
          - "Sale.version incremented by 1"
      - from: CONFIRMED
        to: SETTLED
        trigger: "POST /consignor-settlements"
        actor: SettlementOfficer
        preconditions:
          - "status == CONFIRMED"
          - "no ConsignorSettlement with status == POSTED exists for this sale"
        side_effects:
          - "ConsignorSettlement created in status POSTED from consignor_net_proceeds"
          - "Lot.lifecycle_status HAMMERED -> SETTLED"
          - "Consignment.advance_outstanding_cents reduced by advance_recovery_cents; Consignor.lifetime_net_proceeds_cents recomputed"
          - "Sale.version incremented by 1"
      - from: SETTLED
        to: DEFAULTED
        trigger: "system: cascade link 2 of POST /invoices/{invoice_id}/abandon"
        actor: system
        preconditions:
          - "status == SETTLED"
          - "the sale's Invoice.release_status has just become ABANDONED"
        side_effects:
          - "Bidder.default_strike_count incremented by 1, which in turn suspends every APPROVED BidderRegistration of that bidder once the count reaches MAX_DEFAULT_STRIKES"
          - "cascade link 3: ConsignorSettlement.status POSTED -> REVERSED"
          - "Auction.gross_hammer_cents recomputed"
          - "Sale.version incremented by 1"
      - from: CONFIRMED
        to: DEFAULTED
        trigger: "system: cascade link 2 of POST /invoices/{invoice_id}/abandon when no settlement was ever posted"
        actor: system
        preconditions:
          - "status == CONFIRMED"
          - "the sale's Invoice.release_status has just become ABANDONED"
        side_effects:
          - "Bidder.default_strike_count incremented by 1"
          - "Lot.lifecycle_status HAMMERED -> REOFFER_QUEUED is NOT taken on this edge; the lot stays HAMMERED because no settlement existed to reverse"
          - "Sale.version incremented by 1"

  - entity: Invoice
    state_field: payment_status
    initial_state: UNPAID
    terminal_states: [WRITTEN_OFF]
    transitions:
      - from: UNPAID
        to: PARTIALLY_PAID
        trigger: "POST /payments with amount_cents < outstanding_cents"
        actor: Bidder
        preconditions:
          - "payment_status IN {UNPAID, PARTIALLY_PAID}"
          - "currency_code equals the auction yard's currency_code"
          - "amount_cents <= outstanding_cents"
        side_effects:
          - "Invoice.amount_paid_cents and outstanding_cents recomputed"
          - "Bidder.open_exposure_cents recomputed"
          - "Invoice.version incremented by 1"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /payments with amount_cents == outstanding_cents"
        actor: Bidder
        preconditions:
          - "payment_status IN {UNPAID, PARTIALLY_PAID}"
          - "amount_cents == outstanding_cents"
        side_effects:
          - "Invoice.outstanding_cents = 0; Bidder.open_exposure_cents recomputed"
          - "Invoice.version incremented by 1"
      - from: UNPAID
        to: PAID
        trigger: "POST /payments settling the whole balance in one tender"
        actor: Bidder
        preconditions:
          - "payment_status == UNPAID"
          - "amount_cents == outstanding_cents"
        side_effects:
          - "Invoice.outstanding_cents = 0; Bidder.open_exposure_cents recomputed"
          - "Invoice.version incremented by 1"
      - from: PAID
        to: PARTIALLY_PAID
        trigger: "system: POST /invoices/{invoice_id}/finalize raises total_due_cents above amount_paid_cents"
        actor: system
        preconditions:
          - "payment_status == PAID"
          - "the FINAL variant total_due_cents > amount_paid_cents"
        side_effects:
          - "Invoice.outstanding_cents = total_due_cents - amount_paid_cents"
          - "Invoice.version incremented by 1"
        note: "The money axis regresses without touching release_status; the two axes are independent."
      - from: UNPAID
        to: IN_DEFAULT
        trigger: "POST /invoices/{invoice_id}/default"
        actor: SettlementOfficer
        preconditions:
          - "payment_status IN {UNPAID, PARTIALLY_PAID}"
          - "logical clock > payment_due_at"
          - "release_status != LOADED_OUT"
        side_effects:
          - "Invoice.version incremented by 1"
      - from: PARTIALLY_PAID
        to: IN_DEFAULT
        trigger: "POST /invoices/{invoice_id}/default"
        actor: SettlementOfficer
        preconditions:
          - "payment_status == PARTIALLY_PAID"
          - "logical clock > payment_due_at"
          - "release_status != LOADED_OUT"
        side_effects:
          - "Invoice.version incremented by 1"
      - from: IN_DEFAULT
        to: WRITTEN_OFF
        trigger: "POST /invoices/{invoice_id}/abandon"
        actor: SettlementOfficer
        preconditions:
          - "payment_status == IN_DEFAULT"
          - "release_status != LOADED_OUT"
        side_effects:
          - "cascade link 1: release_status -> ABANDONED, storage_fee_cents restamped at the FINAL variant, deficiency_claim_cents from abandonment_deficiency"
          - "the registration deposit hold is forfeited: Bidder.deposit_held_cents decreased and Bidder.deposit_forfeited_cents increased by deposit_hold_cents"
          - "every SETTLED Payment of this invoice becomes REVERSED and amount_paid_cents recomputed to 0"
          - "Invoice.version incremented by 1"

  - entity: Invoice
    state_field: release_status
    initial_state: HELD
    terminal_states: [LOADED_OUT, ABANDONED]
    transitions:
      - from: HELD
        to: RELEASE_AUTHORIZED
        trigger: "POST /invoices/{invoice_id}/authorize-release"
        actor: SettlementOfficer
        preconditions:
          - "release_status == HELD"
          - "payment_status == PAID"
          - "Sale.status IN {CONFIRMED, SETTLED}"
          - "Lot.title_status IN {LIEN_CLEAR, LIEN_RELEASED}"
          - "is_cross_border == false OR an ExportDocumentPacket of this invoice has status == EXPORT_CLEARED"
        side_effects:
          - "Invoice.version incremented by 1"
      - from: RELEASE_AUTHORIZED
        to: LOADOUT_BOOKED
        trigger: "POST /loadout-slots"
        actor: Bidder
        preconditions:
          - "release_status == RELEASE_AUTHORIZED"
          - "expected_invoice_version equals Invoice.version"
        side_effects:
          - "LoadoutSlot created in status BOOKED; LoadoutBay.reserved_tonnage_kg recomputed"
          - "Invoice.version incremented by 1"
      - from: LOADOUT_BOOKED
        to: LOADOUT_BOOKED
        trigger: "POST /loadout-slots superseding the invoice's existing BOOKED slot"
        actor: Bidder
        preconditions:
          - "release_status == LOADOUT_BOOKED"
          - "expected_invoice_version equals Invoice.version"
          - "exactly one LoadoutSlot of this invoice has status == BOOKED"
        side_effects:
          - "the prior BOOKED slot becomes CANCELLED with cancel_reason = SUPERSEDED after all validations pass; the new slot records supersedes_slot_id"
          - "LoadoutBay.reserved_tonnage_kg recomputed for both bays involved"
          - "Invoice.version incremented by 1"
        note: "Self-loop rebooking edge; the OCC rule loadout-slot-rebook-stale-invoice governs it."
      - from: LOADOUT_BOOKED
        to: RELEASE_AUTHORIZED
        trigger: "POST /loadout-slots/{slot_id}/cancel"
        actor: Bidder
        preconditions:
          - "release_status == LOADOUT_BOOKED"
          - "the slot status == BOOKED"
        side_effects:
          - "compensating action: LoadoutBay.reserved_tonnage_kg returns to its pre-booking value"
          - "Invoice.version incremented by 1"
      - from: LOADOUT_BOOKED
        to: LOADED_OUT
        trigger: "POST /loadout-slots/{slot_id}/complete"
        actor: SettlementOfficer
        preconditions:
          - "release_status == LOADOUT_BOOKED"
          - "the slot status == CHECKED_IN"
          - "gate_pass_ref is present in the request"
        side_effects:
          - "LoadoutSlot.status CHECKED_IN -> COMPLETED; Lot.lifecycle_status SETTLED -> RELEASED"
          - "LoadoutBay.reserved_tonnage_kg recomputed"
          - "Invoice.version incremented by 1"
      - from: HELD
        to: ABANDONED
        trigger: "POST /invoices/{invoice_id}/abandon"
        actor: SettlementOfficer
        preconditions:
          - "release_status IN {HELD, RELEASE_AUTHORIZED, LOADOUT_BOOKED}"
          - "payment_status == IN_DEFAULT"
        side_effects:
          - "cascade link 2: Sale.status -> DEFAULTED"
          - "every BOOKED or CHECKED_IN LoadoutSlot of this invoice becomes CANCELLED and LoadoutBay.reserved_tonnage_kg recomputed"
          - "Invoice.version incremented by 1"
      - from: RELEASE_AUTHORIZED
        to: ABANDONED
        trigger: "POST /invoices/{invoice_id}/abandon"
        actor: SettlementOfficer
        preconditions:
          - "release_status == RELEASE_AUTHORIZED"
          - "payment_status == IN_DEFAULT"
        side_effects:
          - "identical cascade to the HELD -> ABANDONED edge"
          - "Invoice.version incremented by 1"

  - entity: ExportDocumentPacket
    state_field: status
    initial_state: PREPARING
    terminal_states: [EXPORT_CLEARED]
    transitions:
      - from: PREPARING
        to: TITLE_ATTACHED
        trigger: "POST /export-packets/{packet_id}/transition with action = ATTACH_TITLE"
        actor: ComplianceOfficer
        preconditions:
          - "status == PREPARING"
          - "title_document_ref is present in the request"
          - "Lot.title_status IN {LIEN_CLEAR, LIEN_RELEASED}"
        side_effects:
          - "ExportDocumentPacket.version incremented by 1"
      - from: TITLE_ATTACHED
        to: CUSTOMS_FILED
        trigger: "POST /export-packets/{packet_id}/transition with action = FILE_CUSTOMS"
        actor: ComplianceOfficer
        preconditions:
          - "status == TITLE_ATTACHED"
          - "customs_entry_ref is present in the request"
        side_effects:
          - "ExportDocumentPacket.version incremented by 1"
      - from: CUSTOMS_FILED
        to: EXPORT_CLEARED
        trigger: "POST /export-packets/{packet_id}/transition with action = CLEAR"
        actor: ComplianceOfficer
        preconditions:
          - "status == CUSTOMS_FILED"
        side_effects:
          - "the invoice's FINAL variant becomes zero-rated for tax; Invoice totals are only restamped by POST /invoices/{invoice_id}/finalize"
          - "ExportDocumentPacket.version incremented by 1"
      - from: CUSTOMS_FILED
        to: CUSTOMS_REJECTED
        trigger: "POST /export-packets/{packet_id}/transition with action = REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "status == CUSTOMS_FILED"
          - "rejection_reason is present in the request"
        side_effects:
          - "ExportDocumentPacket.version incremented by 1"
      - from: CUSTOMS_REJECTED
        to: PREPARING
        trigger: "POST /export-packets/{packet_id}/transition with action = REOPEN"
        actor: ComplianceOfficer
        preconditions:
          - "status == CUSTOMS_REJECTED"
          - "reopen_count < MAX_PACKET_REOPENS"
        side_effects:
          - "ExportDocumentPacket.reopen_count incremented by 1; title_document_ref and customs_entry_ref cleared to null"
          - "ExportDocumentPacket.version incremented by 1"
        note: "Revision loop back to the start of the documentation pipeline."

  - entity: LoadoutSlot
    state_field: status
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /loadout-slots/{slot_id}/check-in"
        actor: Bidder
        preconditions:
          - "status == BOOKED"
          - "slot_start <= logical clock < slot_end"
        side_effects:
          - "LoadoutSlot.version incremented by 1"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /loadout-slots/{slot_id}/complete"
        actor: SettlementOfficer
        preconditions:
          - "status == CHECKED_IN"
        side_effects:
          - "Invoice.release_status LOADOUT_BOOKED -> LOADED_OUT and Lot.lifecycle_status SETTLED -> RELEASED"
          - "LoadoutBay.reserved_tonnage_kg recomputed"
          - "LoadoutSlot.version incremented by 1"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /loadout-slots/{slot_id}/cancel with outcome = CANCELLED, or system supersede/abandon cascade"
        actor: Bidder
        preconditions:
          - "status IN {BOOKED, CHECKED_IN}"
        side_effects:
          - "compensating action: LoadoutBay.reserved_tonnage_kg returns to its pre-booking value"
          - "Invoice.release_status LOADOUT_BOOKED -> RELEASE_AUTHORIZED when no other non-terminal slot remains"
          - "LoadoutSlot.version incremented by 1"
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /loadout-slots/{slot_id}/cancel with outcome = NO_SHOW"
        actor: SettlementOfficer
        preconditions:
          - "status == BOOKED"
          - "logical clock >= slot_end"
        side_effects:
          - "LoadoutBay.reserved_tonnage_kg recomputed; Invoice.release_status LOADOUT_BOOKED -> RELEASE_AUTHORIZED"
          - "LoadoutSlot.version incremented by 1"
      - from: CHECKED_IN
        to: CANCELLED
        trigger: "POST /loadout-slots/{slot_id}/cancel with outcome = CANCELLED"
        actor: SettlementOfficer
        preconditions:
          - "status == CHECKED_IN"
        side_effects:
          - "LoadoutBay.reserved_tonnage_kg recomputed; Invoice.release_status LOADOUT_BOOKED -> RELEASE_AUTHORIZED"
          - "LoadoutSlot.version incremented by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent entity's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: counteroffer-stale-sale
    parent_entity: Sale
    write_endpoint: "POST /sales/{sale_id}/counteroffer"
    occ_field: "expected_sale_version"
    description: |
      Issuing a consignor counteroffer against a Sale whose version has advanced
      since the client last observed it is rejected. A later counteroffer
      legitimately supersedes the prior negotiation round, so the write is
      allowed on its own merits; the stale expected_sale_version is what the
      server refuses, because the counter-price monotonicity check would
      otherwise be evaluated against a round the client never saw.
    error_id: ERR_STALE_SALE_VERSION
    http_status: 412

  - rule_id: loadout-slot-rebook-stale-invoice
    parent_entity: Invoice
    write_endpoint: "POST /loadout-slots"
    occ_field: "expected_invoice_version"
    description: |
      Booking a LoadoutSlot against an Invoice whose version has advanced since
      the client last observed it is rejected. Because a new slot legitimately
      supersedes the invoice's existing BOOKED slot, the write cannot be
      rejected on state grounds alone; the stale expected_invoice_version is the
      only deterministic signal that the client is rebooking on top of a
      cancellation, finalize restamp or release change it has not seen.
    error_id: ERR_STALE_INVOICE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# All money is integer cents. Every multiplication by a rate is rounded with
# round_half_up to whole cents at the step indicated by the formula; the step at
# which rounding happens is normative because it changes the result.
# =============================================================================
calculations:
  - name: lot_condition_grade
    description: |
      Weighted condition score and published grade band for a lot, derived from
      four component scores plus the hour-meter verification outcome. Each
      component is weighted and rounded to 2 decimals BEFORE the four are added;
      summing first and rounding once produces a different value in general.
    trigger: "POST /lots/{lot_id}/condition-reports (report creation); recomputed by POST /condition-reports/{report_id}/rescore"
    inputs:
      - "ConditionReport.structural_score, powertrain_score, hydraulics_score, tires_score"
      - "ConditionReport.hour_meter_verified"
      - "ConditionReport.observed_hour_meter_reading and Lot.hour_meter_reading"
    algorithm: weighted_scoring
    formula: |
      component_structural = round_half_up(structural_score * STRUCTURAL_WEIGHT, 2)
      component_powertrain = round_half_up(powertrain_score * POWERTRAIN_WEIGHT, 2)
      component_hydraulics = round_half_up(hydraulics_score * HYDRAULICS_WEIGHT, 2)
      component_tires      = round_half_up(tires_score      * TIRES_WEIGHT,      2)
      raw_grade = component_structural + component_powertrain
                + component_hydraulics + component_tires        # already 2 decimals, no further rounding

      if hour_meter_verified == false:
          grade_score = max(0.00, raw_grade - UNVERIFIED_HOURS_PENALTY)
      else:
          grade_score = raw_grade

      band_of(grade_score) = A if grade_score >= BAND_A_MIN
                             else B if grade_score >= BAND_B_MIN
                             else C if grade_score >= BAND_C_MIN
                             else D
      # Cap: an unverified hour meter can never publish above C, even when the
      # penalised score still lands in the A or B range.
      grade_band = band_of(grade_score)
      if hour_meter_verified == false and grade_band in {A, B}:
          grade_band = C

      hour_meter_variance_pct = round_half_up(
          abs(observed_hour_meter_reading - Lot.hour_meter_reading)
          / max(Lot.hour_meter_reading, 1), 4)
    constants:
      STRUCTURAL_WEIGHT: 0.35
      POWERTRAIN_WEIGHT: 0.30
      HYDRAULICS_WEIGHT: 0.20
      TIRES_WEIGHT: 0.15
      UNVERIFIED_HOURS_PENALTY: 15
      BAND_A_MIN: 85
      BAND_B_MIN: 70
      BAND_C_MIN: 55
    precision: "grade_score and each component to 2 decimals, round_half_up; hour_meter_variance_pct to 4 decimals, round_half_up"
    worked_example: |
      structural 83.5, powertrain 77.5, hydraulics 64.5, tires 58.5, verified true:
        29.23 (83.5*0.35 = 29.225 -> 29.23) + 23.25 + 12.90 + 8.78 (58.5*0.15 = 8.775 -> 8.78)
        = 74.16  -> band B
      Summing first would give 74.15 (83.5*0.35 + 77.5*0.30 + 64.5*0.20 + 58.5*0.15
      = 74.15 exactly), so the two orders are distinguishable by one cent of score.
      All four at 95.0 with verified false: 33.25 + 28.50 + 19.00 + 14.25 = 95.00,
      minus 15 = 80.00 (band-of = B) -> capped to C.

  - name: buyer_premium_computation
    description: |
      Buyer premium charged on top of the hammer price. Marginal tiered rate,
      then an online-event surcharge, then a same-auction volume discount, then a
      floor/ceiling clamp. The four steps are order-sensitive and the order below
      is normative.
    trigger: "Invoice creation (auction close, lot hammer, or counteroffer acceptance) and every POST /invoices/{invoice_id}/finalize"
    inputs:
      - "Sale.hammer_price_cents"
      - "Auction.premium_schedule_code and Auction.kind"
      - "prior_hammer_total_cents: sum of Sale.hammer_price_cents over sales of the SAME auction and SAME registration with status IN {CONFIRMED, SETTLED} and hammered_at strictly earlier than this sale (ties broken by created_at ASC)"
    algorithm: tiered_pricing
    formula: |
      # --- step 1: schedule -------------------------------------------------
      if premium_schedule_code == LOW_VALUE_FLAT:
          base = round_half_up(hammer * FLAT_PCT)
          return max(FLAT_MIN_CENTS, base)          # flat schedule: no surcharge, no discount, NO ceiling
      # premium_schedule_code == STANDARD, marginal tiers, rounded per tier then summed
      t1 = round_half_up(min(hammer, TIER1_LIMIT_CENTS) * TIER1_PCT)
      t2 = round_half_up(max(0, min(hammer, TIER2_LIMIT_CENTS) - TIER1_LIMIT_CENTS) * TIER2_PCT)
      t3 = round_half_up(max(0, hammer - TIER2_LIMIT_CENTS) * TIER3_PCT)
      tier_sum = t1 + t2 + t3

      # --- step 2: online surcharge (on the hammer, not on the premium) -----
      surcharge = round_half_up(hammer * ONLINE_SURCHARGE_PCT) if Auction.kind == TIMED_ONLINE else 0
      premium_before_discount = tier_sum + surcharge

      # --- step 3: volume discount, evaluated on prior hammer only ----------
      discount_pct = VOLUME_TIER2_PCT if prior_hammer_total_cents >= VOLUME_TIER2_THRESHOLD_CENTS
                     else VOLUME_TIER1_PCT if prior_hammer_total_cents >= VOLUME_TIER1_THRESHOLD_CENTS
                     else 0
      discounted = premium_before_discount
                 - round_half_up(premium_before_discount * discount_pct)

      # --- step 4: clamp ----------------------------------------------------
      buyer_premium_cents = min(PREMIUM_MAX_CENTS, max(PREMIUM_MIN_CENTS, discounted))
    constants:
      TIER1_LIMIT_CENTS: 5000000
      TIER1_PCT: 0.12
      TIER2_LIMIT_CENTS: 25000000
      TIER2_PCT: 0.08
      TIER3_PCT: 0.05
      ONLINE_SURCHARGE_PCT: 0.015
      VOLUME_TIER1_THRESHOLD_CENTS: 50000000
      VOLUME_TIER1_PCT: 0.10
      VOLUME_TIER2_THRESHOLD_CENTS: 100000000
      VOLUME_TIER2_PCT: 0.20
      PREMIUM_MIN_CENTS: 25000
      PREMIUM_MAX_CENTS: 4000000
      FLAT_PCT: 0.10
      FLAT_MIN_CENTS: 50000
    precision: "whole cents, round_half_up per tier and per rate application"
    worked_example: |
      STANDARD, LIVE_ONSITE, hammer 12000000, no prior hammer:
        t1 600000 + t2 560000 + t3 0 = 1160000; no surcharge; no discount;
        clamp leaves 1160000.
      STANDARD, TIMED_ONLINE, hammer 60000000, no prior hammer:
        600000 + 1600000 + 1750000 = 3950000; surcharge 900000 -> 4850000;
        clamp to PREMIUM_MAX_CENTS -> 4000000.
      STANDARD, TIMED_ONLINE, hammer 12000000, prior_hammer_total 60000000:
        1160000 + 180000 = 1340000; discount 10% -> 1340000 - 134000 = 1206000;
        clamp leaves 1206000. (Clamping before discounting would give 1206000 too,
        but clamping before the surcharge would give 1044000 -> the order matters.)
      STANDARD, LIVE_ONSITE, hammer 100000: t1 12000 -> clamp up to 25000.
      LOW_VALUE_FLAT, hammer 100000: 10000 -> floor to 50000, no ceiling applied.

  - name: buyer_settlement_total
    description: |
      The buyer's invoice. Two variants of the same formula are stamped at
      different points in the lifecycle and differ in three ways: whether
      storage has accrued, whether an export clearance zero-rates the tax, and
      which fee waivers are recognised.
    trigger: "PROVISIONAL at Invoice creation; FINAL on POST /invoices/{invoice_id}/finalize; read-only preview via GET /invoices/{invoice_id}/settlement-preview"
    inputs:
      - "Sale.hammer_price_cents, Lot.title_required, Lot.weight_kg"
      - "Invoice.is_cross_border, Invoice.credit_memo_cents"
      - "BidderRegistration.financing_approved, deposit_hold_cents, payment_terms_code"
      - "Bidder.country_code; Yard.country_code"
      - "ExportDocumentPacket.status of the invoice's packet, if any"
    algorithm: aggregation
    formula: |
      buyer_premium_cents     = buyer_premium_computation(...)
      documentation_fee_cents = DOC_FEE_EXPORT_CENTS if is_cross_border else DOC_FEE_DOMESTIC_CENTS
      title_transfer_fee_cents= TITLE_TRANSFER_FEE_CENTS if Lot.title_required else 0
      financing_fee_cents     = round_half_up(hammer * FINANCING_FEE_PCT)
                                if registration.financing_approved else 0
      subtotal_cents = hammer + buyer_premium_cents + documentation_fee_cents
                     + title_transfer_fee_cents + financing_fee_cents

      # tax: the base is the subtotal; storage fees are never taxed
      tax_rate_applied = 0.0000 if (variant == FINAL
                                    and is_cross_border
                                    and packet.status == EXPORT_CLEARED)
                         else TAX_RATE_BY_COUNTRY.get(Bidder.country_code, DEFAULT_TAX_RATE)
      tax_cents = round_half_up(subtotal_cents * tax_rate_applied)

      storage_fee_cents = 0 if variant == PROVISIONAL else storage_fee_accrual(invoice)

      gross_before_deposit = subtotal_cents + tax_cents + storage_fee_cents - credit_memo_cents

      # deposit waterfall across every invoice of the same registration, ordered
      # by Sale.hammered_at ASC (ties by Invoice.created_at ASC); each invoice
      # consumes min(remaining_hold, its own gross_before_deposit)
      deposit_applied_cents = min(remaining_deposit_hold, gross_before_deposit)
      total_due_cents  = gross_before_deposit - deposit_applied_cents
      outstanding_cents = max(0, total_due_cents - amount_paid_cents)
    constants:
      DOC_FEE_DOMESTIC_CENTS: 15000
      DOC_FEE_EXPORT_CENTS: 45000
      TITLE_TRANSFER_FEE_CENTS: 12500
      FINANCING_FEE_PCT: 0.02
      DEFAULT_TAX_RATE: 0.10
      DUE_DAYS_PREPAY: 2
      DUE_DAYS_NET_7: 7
      DUE_DAYS_NET_30: 30
      TAX_RATE_BY_COUNTRY:
        US: 0.0625
        CA: 0.13
        MX: 0.16
        DE: 0.19
        AU: 0.10
        AE: 0.05
        GB: 0.20
        BR: 0.17
        JP: 0.10
        ZA: 0.15
    precision: "whole cents, round_half_up; tax_rate_applied stored to 4 decimals"
    variants:
      - name: PROVISIONAL
        when: "stamped when the Invoice is created (auction close, lot hammer, or counteroffer acceptance)"
        difference: |
          storage_fee_cents is forced to 0 (nothing can have accrued yet) and the
          buyer's domestic tax rate is ALWAYS applied, even on a cross-border
          sale, because no customs clearance exists at hammer time.
      - name: FINAL
        when: "stamped by POST /invoices/{invoice_id}/finalize, and previewed by GET /invoices/{invoice_id}/settlement-preview?variant=FINAL"
        difference: |
          storage_fee_accrual is evaluated against the logical clock, and a
          cross-border sale whose ExportDocumentPacket has reached EXPORT_CLEARED
          is zero-rated (tax_rate_applied = 0.0000).
    worked_example: |
      Domestic US buyer, yard US, LIVE_ONSITE, hammer 12000000, weight 36000 kg,
      deposit hold 1500000, terms NET_7, no financing, title_required false:
        PROVISIONAL: premium 1160000, doc 15000, subtotal 13175000,
        tax 6.25% -> 823438 (13175000*0.0625 = 823437.5 -> 823438),
        gross 13998438, deposit 1500000 -> total_due 12498438.
        FINAL one whole day past grace: storage 12000 -> total_due 12510438.
      Cross-border DE buyer, yard US, hammer 12000000, deposit 1500000:
        PROVISIONAL: premium 1160000, doc 45000, subtotal 13205000,
        tax 19% -> 2508950, gross 15713950, deposit 1500000 -> total_due 14213950.
        FINAL with packet EXPORT_CLEARED and one day of storage:
        tax 0, gross 13217000, deposit 1500000 -> total_due 11717000.

  - name: bidder_exposure_and_bid_cap
    description: |
      How much more a paddle may bid. Two variants answer two different
      questions and are expected to disagree: the settlement desk forecasts the
      money actually owed, while the ring replays the hammer sequence.
    trigger: "REGISTRATION_FORECAST on POST /bidder-registrations/{registration_id}/credit-decision and on every Invoice write; LIVE_CHRONOLOGICAL on every POST /bids; both readable via GET /bidders/{bidder_id}/exposure"
    inputs:
      - "BidderRegistration.deposit_hold_cents, leverage_multiplier, approved_credit_limit_cents"
      - "the registration's Invoice rows with their payment_status and total_due_cents"
      - "the registration's Sale rows with hammer_price_cents, status and hammered_at"
    algorithm: forward_looking
    formula: |
      base_headroom = deposit_hold_cents * leverage_multiplier

      # ---- variant REGISTRATION_FORECAST (algorithm: forward_looking) ------
      forecast_exposure = sum(Invoice.total_due_cents
                              for invoices of this registration
                              where payment_status IN {UNPAID, PARTIALLY_PAID}
                                and Sale.status IN {CONFIRMED, SETTLED})
      forecast_cap = max(0, base_headroom + approved_credit_limit_cents - forecast_exposure)

      # ---- variant LIVE_CHRONOLOGICAL (algorithm: chronological) -----------
      # Replay the registration's sales in hammered_at ASC order, ties by
      # created_at ASC. Each sale consumes its GROSS hammer price - premiums,
      # taxes, deposits and payments are all ignored on the ring - and the first
      # step that drives headroom to zero or below is recorded.
      headroom = base_headroom          # the credit line is NOT available on the ring
      breached_at_sale_id = null
      for sale in sales ordered by (hammered_at ASC, created_at ASC)
          where sale.status NOT IN {NO_SALE}:
              headroom = headroom - sale.hammer_price_cents
              if headroom <= 0 and breached_at_sale_id is null:
                  breached_at_sale_id = sale.id
      chronological_cap = max(0, headroom)

      # POST /bids rejects amount_cents > chronological_cap
    constants:
      COUNTRY_TIER_A_CODES: [US, CA, DE, AU, GB, JP]
      COUNTRY_TIER_B_CODES: [MX, AE, BR, ZA]
      TIER_A_LEVERAGE: 10
      TIER_B_LEVERAGE: 5
      TIER_C_LEVERAGE: 2
      TIER_A_MIN_DEPOSIT_CENTS: 100000
      TIER_B_MIN_DEPOSIT_CENTS: 500000
      TIER_C_MIN_DEPOSIT_CENTS: 1500000
    precision: "whole cents; every intermediate value is an exact integer, no rounding occurs"
    variants:
      - name: REGISTRATION_FORECAST
        when: "stamped into BidderRegistration.bid_cap_cents by the credit decision and recomputed whenever an invoice of the registration is written"
        difference: |
          Values each open obligation at its currently stamped
          Invoice.total_due_cents, i.e. net of the deposit already applied and
          inclusive of premium, tax and accrued storage, and it ADDS
          approved_credit_limit_cents to the headroom.
      - name: LIVE_CHRONOLOGICAL
        when: "evaluated on every POST /bids to police the paddle during the event"
        difference: |
          Replays hammer prices gross, in hammered_at order, ignores payments,
          deposits and the credit line, and additionally reports
          breached_at_sale_id - which depends on the replay order, not on the sum.
    worked_example: |
      TIER_A registration, deposit hold 1500000, leverage 10, credit limit 0,
      two sales in the auction: lot A hammered 4000000 (CONFIRMED, invoice
      total_due 3275938 after 1500000 of deposit) and lot B hammered 3000000
      (still PROVISIONAL, no invoice yet):
        REGISTRATION_FORECAST = 15000000 + 0 - 3275938 = 11724062
        LIVE_CHRONOLOGICAL    = 15000000 - 4000000 - 3000000 = 8000000
      Delta 3724062. With approved_credit_limit_cents raised to 2000000 the
      forecast becomes 13724062 while the chronological cap stays 8000000.

  - name: storage_fee_accrual
    description: |
      Free-storage grace period followed by a daily rate keyed to the machine's
      weight band, capped as a fraction of the hammer price.
    trigger: "every POST /invoices/{invoice_id}/finalize, GET /invoices/{invoice_id}/settlement-preview?variant=FINAL, and abandonment"
    inputs:
      - "Invoice.grace_end_at (Sale.hammered_at + FREE_STORAGE_DAYS of the registration's payment_terms_code)"
      - "logical clock current UTC"
      - "Lot.weight_kg, Sale.hammer_price_cents"
    algorithm: threshold
    formula: |
      # payment_terms_code is stamped by the credit decision, so the grace
      # length is a function of the bidder's tier and financing outcome:
      payment_terms_code = PAYMENT_TERMS_FINANCED       if financing_approved
                           else PAYMENT_TERMS_TIER_A    if country_tier == TIER_A
                           else PAYMENT_TERMS_TIER_B_C
      grace_end_at = hammered_at + FREE_STORAGE_DAYS of payment_terms_code

      elapsed_seconds  = max(0, epoch_seconds(now) - epoch_seconds(grace_end_at))
      chargeable_days  = floor(elapsed_seconds / 86400)       # whole days only

      daily_rate = STORAGE_RATE_LIGHT_CENTS  if weight_kg <= LIGHT_WEIGHT_MAX_KG
                   else STORAGE_RATE_MEDIUM_CENTS if weight_kg <= MEDIUM_WEIGHT_MAX_KG
                   else STORAGE_RATE_HEAVY_CENTS

      uncapped = chargeable_days * daily_rate
      cap      = round_half_up(hammer_price_cents * STORAGE_FEE_CAP_PCT)
      storage_fee_cents = min(uncapped, cap)
    constants:
      PAYMENT_TERMS_FINANCED: NET_30
      PAYMENT_TERMS_TIER_A: NET_7
      PAYMENT_TERMS_TIER_B_C: PREPAY
      FREE_STORAGE_DAYS_PREPAY: 3
      FREE_STORAGE_DAYS_NET_7: 5
      FREE_STORAGE_DAYS_NET_30: 10
      LIGHT_WEIGHT_MAX_KG: 10000
      MEDIUM_WEIGHT_MAX_KG: 30000
      STORAGE_RATE_LIGHT_CENTS: 2500
      STORAGE_RATE_MEDIUM_CENTS: 6000
      STORAGE_RATE_HEAVY_CENTS: 12000
      STORAGE_FEE_CAP_PCT: 0.25
    precision: "whole cents; chargeable_days uses floor, never rounds up a partial day"
    worked_example: |
      grace_end_at 2026-08-15T16:00:00Z, weight 36000 kg (heavy, 12000/day),
      hammer 12000000 (cap 3000000):
        clock 2026-08-15T16:00:00Z -> elapsed 0        -> 0 days  -> 0
        clock 2026-08-16T15:59:59Z -> elapsed 86399 s  -> 0 days  -> 0
        clock 2026-08-16T16:00:00Z -> elapsed 86400 s  -> 1 day   -> 12000
        clock 2026-08-18T16:00:00Z -> 3 days -> 36000
      A 6000 kg machine over the same 1 day accrues 2500 instead of 12000.

  - name: consignor_net_proceeds
    description: |
      Seller-side waterfall. Commission is taken first, then the authorised part
      of the refurbishment cost, then the outstanding cash advance, then any
      no-sale fee; whatever remains is the consignor's net.
    trigger: "POST /consignor-settlements; restamped to the reversed figures by the cascade of POST /invoices/{invoice_id}/abandon"
    inputs:
      - "Sale.hammer_price_cents and Sale.status"
      - "Consignment.commission_schedule_code, refurb_authorization_cap_cents, advance_outstanding_cents"
      - "actual_cost_cents over the lot's RefurbishmentOrder rows with status = COMPLETED"
    algorithm: waterfall_allocation
    formula: |
      gross = Sale.hammer_price_cents

      # bucket 1 - commission, marginal two-tier with a floor
      if commission_schedule_code == RESERVE_STD:
          tiered = round_half_up(min(gross, COMMISSION_TIER1_LIMIT_CENTS) * RESERVE_TIER1_PCT)
                 + round_half_up(max(0, gross - COMMISSION_TIER1_LIMIT_CENTS) * RESERVE_TIER2_PCT)
          commission_cents = max(RESERVE_MIN_COMMISSION_CENTS, tiered)
      else:  # UNRESERVED_STD
          tiered = round_half_up(min(gross, COMMISSION_TIER1_LIMIT_CENTS) * UNRESERVED_TIER1_PCT)
                 + round_half_up(max(0, gross - COMMISSION_TIER1_LIMIT_CENTS) * UNRESERVED_TIER2_PCT)
          commission_cents = max(UNRESERVED_MIN_COMMISSION_CENTS, tiered)

      # bucket 2 - refurbishment recharge, capped by the consignment authorisation
      refurb_actual = sum(actual_cost_cents of COMPLETED RefurbishmentOrder rows of the lot)
      remaining_authorization = max(0, refurb_authorization_cap_cents
                                     - refurb recharged by earlier POSTED settlements
                                       of the same consignment)
      refurb_recharge_cents        = min(refurb_actual, remaining_authorization)
      house_absorbed_refurb_cents  = refurb_actual - refurb_recharge_cents

      # bucket 3 - advance recovery, limited by what is left in the waterfall
      remaining = gross - commission_cents - refurb_recharge_cents
      advance_recovery_cents = min(Consignment.advance_outstanding_cents, max(0, remaining))

      # bucket 4 - no-sale / reversal fee
      no_sale_fee_cents = 0                      # while status == POSTED

      net_proceeds_cents = gross - commission_cents - refurb_recharge_cents
                         - advance_recovery_cents - no_sale_fee_cents

      # on reverse: gross, commission, refurb_recharge and advance_recovery are
      # all restamped to 0, advance_outstanding_cents is restored on the
      # consignment, no_sale_fee_cents becomes NO_SALE_FEE_CENTS and
      # net_proceeds_cents becomes -NO_SALE_FEE_CENTS.
    constants:
      COMMISSION_TIER1_LIMIT_CENTS: 10000000
      RESERVE_TIER1_PCT: 0.12
      RESERVE_TIER2_PCT: 0.09
      RESERVE_MIN_COMMISSION_CENTS: 100000
      UNRESERVED_TIER1_PCT: 0.08
      UNRESERVED_TIER2_PCT: 0.06
      UNRESERVED_MIN_COMMISSION_CENTS: 50000
      NO_SALE_FEE_CENTS: 25000
    precision: "whole cents, round_half_up per commission tier"
    worked_example: |
      RESERVE_STD, hammer 12000000, no refurbishment, no advance:
        commission 1200000 + 180000 = 1380000 -> net 10620000.
      Same sale with one COMPLETED refurbishment order at actual 800000, a
      refurb_authorization_cap of 500000 and advance_outstanding 2000000:
        commission 1380000, recharge 500000, house absorbs 300000,
        advance recovery min(2000000, 10120000) = 2000000, net 8120000.
      After reversal: gross 0, commission 0, recharge 0, advance recovery 0,
      no_sale_fee 25000, net -25000.

  - name: abandonment_deficiency
    description: |
      The claim the auctioneer books against a buyer who abandons a purchase.
      It is a compensating figure: the deposit already forfeited and any cash
      already tendered are credited against the gross hammer plus accrued
      storage plus a re-offer administration fee, and the result never goes
      below zero.
    trigger: "POST /invoices/{invoice_id}/abandon"
    inputs:
      - "Invoice.hammer_price_cents"
      - "storage_fee_accrual evaluated at the FINAL variant at abandonment time"
      - "BidderRegistration.deposit_hold_cents (forfeited in full at abandonment)"
      - "Invoice.amount_paid_cents before the payments of this invoice are reversed"
    algorithm: aggregation
    formula: |
      storage_at_abandonment = storage_fee_accrual(invoice)       # FINAL rules
      forfeited              = deposit_hold_cents                 # entire hold is forfeited
      credited_cash          = amount_paid_cents                  # SETTLED payments, before reversal

      deficiency_claim_cents = max(0,
            hammer_price_cents
          + storage_at_abandonment
          + REOFFER_ADMIN_FEE_CENTS
          - forfeited
          - credited_cash)
    constants:
      REOFFER_ADMIN_FEE_CENTS: 75000
    precision: "whole cents; no rounding occurs, every term is already integral"
    worked_example: |
      hammer 12000000, 3 chargeable storage days on a 36000 kg machine (36000),
      deposit hold 1500000 forfeited, nothing paid:
        12000000 + 36000 + 75000 - 1500000 - 0 = 10611000.
      The same invoice with 11000000 already tendered would yield
      max(0, 12111000 - 1500000 - 11000000) = 0, not a negative claim.

# =============================================================================
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the FIRST violated rule determines the response, so a request that violates
# several rules always surfaces the lowest-numbered one)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-Role headers are present and X-Role is a known role name"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
    description: "Missing or unparseable identity headers are rejected before anything else, including before the request body is inspected."

  - priority: 2
    category: auth
    check: "X-Role is listed in the endpoint's roles"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
    description: "Role authorisation is decided from the endpoint alone, before body schema validation, so a permitted-looking but malformed payload from a wrong role still returns 403."

  - priority: 3
    category: validation
    check: "request body and query parameters satisfy the declared types, enum domains, string lengths, numeric ranges, ISO-8601 datetime format and required-field list"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
    description: "Includes limit/offset bounds, slot_end > slot_start, window_end > window_start, at-most-1-decimal condition scores and unknown enum members."

  - priority: 4
    category: existence
    check: "every {id} path parameter resolves to an existing row"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
    description: "Path existence precedes body existence; a request with both a bad path id and a bad body FK returns the path entity's 404."

  - priority: 5
    category: existence
    check: "every foreign key in the request body resolves to an existing row"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "POST /consignments, POST /lots, POST /auctions, POST /loadout-bays, POST /bidder-registrations, POST /bids, POST /payments, POST /export-packets, POST /loadout-slots, POST /consignor-settlements, POST /lots/{lot_id}/condition-reports, POST /auctions/{auction_id}/lot-assignments"
    description: "Body FKs are resolved left-to-right in the order the fields are declared in §1.1 for that entity."

  - priority: 6
    category: auth
    check: "for an entity_backed role, the acting X-User-ID equals the owning Consignor.id or Bidder.id reachable from the target resource"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /consignments/{consignment_id}/submit, POST /sales/{sale_id}/counteroffer, POST /sales/{sale_id}/reject, POST /sales/{sale_id}/counter-response, POST /bids, POST /payments, POST /loadout-slots, POST /loadout-slots/{slot_id}/cancel, POST /loadout-slots/{slot_id}/check-in, POST /bidder-registrations/{registration_id}/cancel"
    description: "Ownership is checked after existence so that probing a foreign id yields 403, never a 404 leak of someone else's row - the row is known to exist by then."

  - priority: 7
    category: concurrency
    check: "expected_sale_version / expected_invoice_version equals the parent's current version"
    error_id: "ERR_STALE_SALE_VERSION | ERR_STALE_INVOICE_VERSION"
    http_status: 412
    applies_to: "POST /sales/{sale_id}/counteroffer, POST /loadout-slots"
    description: "OCC is checked after ownership but before any state precondition, so a stale version on a resource in the wrong state still returns 412."

  - priority: 8
    category: state
    check: "the target entity is in a state from which the requested transition is declared in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint"
    description: "Generic state guard; more specific state guards below carry their own error ids and are only reached when this one passes."

  - priority: 9
    category: state
    check: "Auction.status == OPEN"
    error_id: ERR_AUCTION_NOT_OPEN
    http_status: 409
    applies_to: "POST /bids, POST /lots/{lot_id}/hammer"
    description: "Bidding and hammering require an open event. Deliberately ordered ABOVE the fiscal bid-cap check so a bid that is both late and oversized reports the closed auction."

  - priority: 10
    category: state
    check: "BidderRegistration.status == APPROVED"
    error_id: ERR_REGISTRATION_NOT_APPROVED
    http_status: 409
    applies_to: "POST /bids, POST /sales/{sale_id}/counter-response"
    description: "A REQUESTED, DECLINED, SUSPENDED or CANCELLED registration cannot bid or accept a counteroffer."

  - priority: 11
    category: state
    check: "the lot's Consignment.status == CATALOGED"
    error_id: ERR_CONSIGNMENT_NOT_CATALOGED
    http_status: 409
    applies_to: "POST /auctions/{auction_id}/lot-assignments"
    description: "Compound cross-entity dependency: the parent consignment only reaches CATALOGED once every non-WITHDRAWN sibling lot is CATALOG_READY, so one unpublished sibling blocks the assignment of an already-published lot."

  - priority: 12
    category: state
    check: "every RefurbishmentOrder of the lot has status == COMPLETED"
    error_id: ERR_REFURBISHMENT_INCOMPLETE
    http_status: 409
    applies_to: "POST /condition-reports/{report_id}/publish"
    description: "Vacuously satisfied when the lot has no refurbishment orders."

  - priority: 13
    category: state
    check: "Lot.title_status IN {LIEN_CLEAR, LIEN_RELEASED}"
    error_id: ERR_TITLE_NOT_CLEAR
    http_status: 409
    applies_to: "POST /auctions/{auction_id}/lot-assignments, POST /invoices/{invoice_id}/authorize-release, POST /export-packets/{packet_id}/transition with action = ATTACH_TITLE"
    description: "The title axis of the Lot state machine gates both catalogue assignment and physical release."

  - priority: 14
    category: state
    check: "Invoice.payment_status == PAID"
    error_id: ERR_INVOICE_NOT_PAID
    http_status: 409
    applies_to: "POST /invoices/{invoice_id}/authorize-release"
    description: "Custody is only released against a fully settled invoice; a PARTIALLY_PAID invoice is refused even when the shortfall is one cent."

  - priority: 15
    category: state
    check: "for a cross-border invoice, an ExportDocumentPacket with status == EXPORT_CLEARED exists"
    error_id: ERR_EXPORT_NOT_CLEARED
    http_status: 409
    applies_to: "POST /invoices/{invoice_id}/authorize-release"
    description: "Domestic invoices skip this rule entirely (conditional validation keyed on Invoice.is_cross_border)."

  - priority: 16
    category: state
    check: "every CONFIRMED Sale of the auction has a POSTED ConsignorSettlement and no Sale is still PROVISIONAL or CONSIGNOR_COUNTERED"
    error_id: ERR_SETTLEMENT_INCOMPLETE
    http_status: 409
    applies_to: "POST /auctions/{auction_id}/reconcile"
    description: "Aggregate state precondition over all children of the auction."

  - priority: 17
    category: state
    check: "no ConditionReport already exists for the lot; no POSTED ConsignorSettlement already exists for the sale; no non-terminal BidderRegistration already exists for the (bidder, auction) pair"
    error_id: "ERR_DUPLICATE_CONDITION_REPORT | ERR_DUPLICATE_SETTLEMENT | ERR_DUPLICATE_REGISTRATION"
    http_status: 409
    applies_to: "POST /lots/{lot_id}/condition-reports, POST /consignor-settlements, POST /bidder-registrations"
    description: "Idempotency guards: replaying a create that already produced a row is a conflict, not a second row."

  - priority: 18
    category: business_safety
    check: "Bidder.country_code is not in EMBARGOED_COUNTRY_CODES = {IR, KP, SY, RU}"
    error_id: ERR_COUNTRY_EMBARGOED
    http_status: 403
    applies_to: "POST /bidder-registrations, POST /bidder-registrations/{registration_id}/credit-decision, POST /export-packets"
    description: "Sanctions screening outranks every money rule: an embargoed bidder whose deposit is also below the tier minimum is refused for the embargo."

  - priority: 19
    category: business_safety
    check: "Bidder.default_strike_count < MAX_DEFAULT_STRIKES (2)"
    error_id: ERR_BIDDER_SUSPENDED
    http_status: 403
    applies_to: "POST /bidder-registrations, POST /bidder-registrations/{registration_id}/credit-decision, POST /bids"
    description: "A bidder who has abandoned two purchases is locked out of new registrations and of bidding on existing ones."

  - priority: 20
    category: business_safety
    check: "the acting X-User-ID differs from the segregation-of-duties anchor recorded on the target's chain: ConditionReport.inspector_user_id for QA pass, BidderRegistration.credit_approved_by_user_id for fee waivers"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /refurbishment-orders/{order_id}/transition with action = QA_PASS, POST /invoices/{invoice_id}/fee-waiver"
    description: "Same-person approval of one's own work is refused even when the role is correct."

  - priority: 21
    category: business_safety
    check: "ConditionReport.hour_meter_verified == true OR Lot.sold_as_hours_unverified == true"
    error_id: ERR_HOUR_METER_UNVERIFIED
    http_status: 422
    applies_to: "POST /auctions/{auction_id}/lot-assignments"
    description: "An unverifiable hour meter may only be catalogued when the consignor has accepted the hours-not-warranted disclaimer."

  - priority: 22
    category: business_referential
    check: "LoadoutBay.yard_id equals the Auction.yard_id reachable from the invoice's sale"
    error_id: ERR_BAY_YARD_MISMATCH
    http_status: 409
    applies_to: "POST /loadout-slots"
    description: "Equipment can only be loaded out of the yard that held the auction."

  - priority: 23
    category: business_referential
    check: "the assigned Lot's Consignment.status == INTAKE_ACCEPTED or CATALOGED, and the lot is not already assigned to another auction"
    error_id: ERR_LOT_AUCTION_MISMATCH
    http_status: 409
    applies_to: "POST /auctions/{auction_id}/lot-assignments, POST /lots/{lot_id}/hammer"
    description: "Also rejects hammering a lot whose auction_id differs from the auction being closed."

  - priority: 24
    category: business_referential
    check: "ExportDocumentPacket.destination_country_code equals the buyer's Bidder.country_code, and the invoice is cross-border"
    error_id: ERR_DESTINATION_COUNTRY_MISMATCH
    http_status: 422
    applies_to: "POST /export-packets"
    description: "A packet cannot be opened on a domestic invoice, nor routed to a country other than the buyer's."

  - priority: 25
    category: business_constraint
    check: "Lot.serial_number is unique across all lots"
    error_id: ERR_DUPLICATE_SERIAL_NUMBER
    http_status: 409
    applies_to: "POST /lots"
    description: "Serial/PIN uniqueness prevents the same machine being consigned twice."

  - priority: 26
    category: business_constraint
    check: "Auction.reserve_policy == RESERVE_ALLOWED and Consignment.agreement_type == RESERVE when a reserve price is present on the lot"
    error_id: ERR_RESERVE_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /auctions/{auction_id}/lot-assignments"
    description: "Unreserved events and unreserved consignment agreements both forbid a reserve price."

  - priority: 27
    category: business_constraint
    check: "Consignor.unreserved_policy_ack == true when Consignment.agreement_type == UNRESERVED"
    error_id: ERR_UNRESERVED_POLICY_NOT_ACK
    http_status: 422
    applies_to: "POST /consignments/{consignment_id}/submit"
    description: "Seller-expectation management: the unreserved disclosure must be signed before intake accepts the batch."

  - priority: 28
    category: business_constraint
    check: "rework_round < MAX_REWORK_ROUNDS (2); counter_round < MAX_COUNTER_ROUNDS (3); reopen_count < MAX_PACKET_REOPENS (2)"
    error_id: "ERR_MAX_REWORK_ROUNDS_EXCEEDED | ERR_MAX_COUNTER_ROUNDS_EXCEEDED | ERR_MAX_PACKET_REOPENS_EXCEEDED"
    http_status: 422
    applies_to: "POST /refurbishment-orders/{order_id}/transition, POST /sales/{sale_id}/counteroffer, POST /export-packets/{packet_id}/transition"
    description: "Each cyclic state machine has a hard lap limit; the lap that would exceed it is refused rather than silently capped."

  - priority: 29
    category: business_constraint
    check: "counter_price_cents >= Sale.hammer_price_cents, <= Lot.reserve_price_cents, and <= the previous counter_price_cents when counter_round > 0"
    error_id: ERR_COUNTER_PRICE_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /sales/{sale_id}/counteroffer"
    description: "Consignor concessions may only move down; a higher second counter is refused."

  - priority: 30
    category: business_constraint
    check: "LoadoutBay.is_active == true"
    error_id: ERR_BAY_INACTIVE
    http_status: 409
    applies_to: "POST /loadout-slots"
    description: "A bay taken out of service accepts no new bookings, though existing bookings survive."

  - priority: 31
    category: business_constraint
    check: "sum of tonnage_kg over time-overlapping BOOKED/CHECKED_IN slots of the bay, plus this slot's tonnage, is <= LoadoutBay.crane_capacity_kg; the invoice's own superseded BOOKED slot is EXCLUDED from the sum"
    error_id: ERR_BAY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /loadout-slots"
    description: "Aggregate validation: each individual booking fits, yet the overlapping set exceeds the crane rating."

  - priority: 32
    category: business_temporal
    check: "for a LIVE_ONSITE auction, [window_start, window_end] extended by Yard.teardown_buffer_minutes must not overlap another LIVE_ONSITE auction at the same yard whose status != RECONCILED; TIMED_ONLINE auctions are exempt"
    error_id: ERR_AUCTION_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /auctions, POST /auctions/{auction_id}/reschedule"
    description: "Closed-interval overlap: a candidate starting exactly at an existing window_end plus the buffer conflicts; one second later does not."

  - priority: 33
    category: business_temporal
    check: "LoadoutSlot [slot_start, slot_end) must not overlap another BOOKED/CHECKED_IN slot of the SAME invoice (ERR_SLOT_OVERLAP), and Auction.window_end <= slot_start with slot_end <= Auction.loadout_deadline_at (ERR_SLOT_OUTSIDE_DEADLINE)"
    error_id: "ERR_SLOT_OVERLAP | ERR_SLOT_OUTSIDE_DEADLINE"
    http_status: 409
    applies_to: "POST /loadout-slots"
    description: "Half-open interval semantics: a slot starting exactly at another slot's end is adjacent, not overlapping, and is accepted."

  - priority: 34
    category: business_temporal
    check: "slot_start <= logical clock < slot_end for check-in; logical clock >= slot_end for a NO_SHOW outcome"
    error_id: ERR_SLOT_NOT_IN_WINDOW
    http_status: 409
    applies_to: "POST /loadout-slots/{slot_id}/check-in, POST /loadout-slots/{slot_id}/cancel"
    description: "Arrival before the slot opens or after it closes is refused."

  - priority: 35
    category: business_temporal
    check: "logical clock > Invoice.payment_due_at"
    error_id: ERR_PAYMENT_NOT_OVERDUE
    http_status: 409
    applies_to: "POST /invoices/{invoice_id}/default"
    description: "An invoice cannot be defaulted at or before its due instant; exactly payment_due_at is still on time."

  - priority: 36
    category: business_fiscal
    check: "BidderRegistration.deposit_hold_cents >= the tier minimum for Bidder.country_tier and Bidder.deposit_available_cents >= deposit_hold_cents"
    error_id: "ERR_DEPOSIT_BELOW_MINIMUM | ERR_DEPOSIT_UNAVAILABLE"
    http_status: 422
    applies_to: "POST /bidder-registrations"
    description: "Fiscal admission control; deliberately the LAST family evaluated, so an embargoed bidder with an undersized deposit never reaches it."

  - priority: 37
    category: business_fiscal
    check: "Bid.amount_cents <= the LIVE_CHRONOLOGICAL bid cap of the registration"
    error_id: ERR_BID_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /bids"
    description: "Leveraged deposit ceiling; evaluated after the auction-open and registration-approved state guards."

  - priority: 38
    category: business_fiscal
    check: "Bid.amount_cents > Lot.high_bid_cents, and >= MIN_OPENING_BID_CENTS when no bid exists yet"
    error_id: ERR_BID_NOT_HIGHER
    http_status: 422
    applies_to: "POST /bids"
    description: "A bid equal to the standing high bid is refused; the increment must be strictly positive."

  - priority: 39
    category: business_fiscal
    check: "Payment.amount_cents <= Invoice.outstanding_cents"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /payments"
    description: "The house does not hold buyer credit balances; exact settlement or less."

  - priority: 40
    category: business_fiscal
    check: "Payment.currency_code equals the auction yard's Yard.currency_code"
    error_id: ERR_CURRENCY_MISMATCH
    http_status: 422
    applies_to: "POST /payments"
    description: "Cross-currency tenders are refused rather than converted."

  - priority: 41
    category: business_fiscal
    check: "Invoice.credit_memo_cents + requested waiver <= round_half_up(Invoice.subtotal_cents * MAX_WAIVER_PCT)"
    error_id: ERR_WAIVER_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /invoices/{invoice_id}/fee-waiver"
    description: "Cumulative fee waivers on one invoice may not exceed 5% of its subtotal (MAX_WAIVER_PCT = 0.05)."

# =============================================================================
# 1.5 API Endpoint Table
# Flat topology: every collection is a top-level segment and every action hangs
# off the resource that owns the state being changed.
# =============================================================================
endpoints:
  # ---------------------------------------------------------------- test clock
  - method: POST
    path: /_clock/set_current_utc
    description: |
      Sets the logical clock used by every temporal rule (storage accrual,
      payment due dates, auction windows, slot check-in). The clock defaults to
      2026-08-01T00:00:00Z until this endpoint is called. Test-driving endpoint:
      it exists because storage-day boundaries and overdue detection are
      otherwise unreachable.
    roles: [PlatformAdmin]
    success_code: 200
    input: ["current_utc"]
    output: "{ current_utc: datetime }"
    side_effects:
      - "no entity is mutated; subsequent requests read the new clock value"

  # --------------------------------------------------------------------- yards
  - method: POST
    path: /yards
    description: registers a physical auction and load-out yard
    roles: [PlatformAdmin]
    success_code: 201
    input: ["code", "country_code", "teardown_buffer_minutes?", "loadout_deadline_days?", "currency_code?"]
    output: Yard
    side_effects:
      - "Yard created with version 1"

  - method: GET
    path: /yards/{yard_id}
    description: reads one yard
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer, ComplianceOfficer, IntakeInspector, Consignor, Bidder]
    success_code: 200
    input: []
    output: Yard
    side_effects: []

  - method: GET
    path: /yards
    description: lists yards
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer, ComplianceOfficer, IntakeInspector, Consignor, Bidder]
    success_code: 200
    input: ["limit?", "offset?"]
    output: Yard[]
    side_effects: []

  - method: GET
    path: /yards/{yard_id}/auctions
    description: lists the auctions held at a yard (reverse of Auction.yard_id)
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer, ComplianceOfficer, IntakeInspector, Consignor, Bidder]
    success_code: 200
    input: ["status?", "limit?", "offset?"]
    output: Auction[]
    side_effects: []

  - method: GET
    path: /yards/{id}/loadout-bays
    description: lists the load-out bays of a yard (reverse of LoadoutBay.yard_id)
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer, Bidder]
    success_code: 200
    input: ["is_active?", "limit?", "offset?"]
    output: LoadoutBay[]
    side_effects: []

  # -------------------------------------------------------------- loadout bays
  - method: POST
    path: /loadout-bays
    description: creates a crane-rated load-out bay inside a yard
    roles: [PlatformAdmin]
    success_code: 201
    input: ["yard_id", "bay_number", "crane_capacity_kg", "is_active?"]
    output: LoadoutBay
    side_effects:
      - "LoadoutBay created with reserved_tonnage_kg = 0"

  - method: GET
    path: /loadout-bays/{bay_id}
    description: reads one bay, including its derived reserved_tonnage_kg
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer, Bidder]
    success_code: 200
    input: []
    output: LoadoutBay
    side_effects: []

  - method: PATCH
    path: /loadout-bays/{bay_id}
    description: takes a bay in or out of service without touching existing bookings
    roles: [PlatformAdmin]
    success_code: 200
    input: ["is_active"]
    output: LoadoutBay
    side_effects:
      - "LoadoutBay.version incremented by 1"

  # ---------------------------------------------------------------- consignors
  - method: POST
    path: /consignors
    description: registers a consignor (seller)
    roles: [PlatformAdmin]
    success_code: 201
    input: ["legal_name", "country_code", "seller_type", "unreserved_policy_ack?"]
    output: Consignor
    side_effects:
      - "Consignor created with open_consignment_count = 0 and lifetime_net_proceeds_cents = 0"

  - method: GET
    path: /consignors/{consignor_id}
    description: reads one consignor
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer, Consignor]
    success_code: 200
    input: []
    output: Consignor
    side_effects: []

  - method: GET
    path: /consignors
    description: lists consignors
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer]
    success_code: 200
    input: ["seller_type?", "limit?", "offset?"]
    output: Consignor[]
    side_effects: []

  - method: POST
    path: /consignors/{consignor_id}/policy-ack
    description: records the consignor's signature on the unreserved-sale disclosure
    roles: [Consignor]
    success_code: 200
    input: ["unreserved_policy_ack"]
    output: Consignor
    side_effects:
      - "Consignor.unreserved_policy_ack set; Consignor.version incremented by 1"

  - method: GET
    path: /consignors/{id}/consignments
    description: lists a consignor's consignments (reverse of Consignment.consignor_id)
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer, Consignor]
    success_code: 200
    input: ["status?", "limit?", "offset?"]
    output: Consignment[]
    side_effects: []

  # -------------------------------------------------------------- consignments
  - method: POST
    path: /consignments
    description: opens a draft consignment agreement
    roles: [Consignor]
    success_code: 201
    input: ["consignor_id", "agreement_type", "commission_schedule_code", "refurb_authorization_cap_cents", "advance_paid_cents?"]
    output: Consignment
    side_effects:
      - "Consignment created in status DRAFT with advance_outstanding_cents = advance_paid_cents"
      - "Consignor.open_consignment_count recomputed"

  - method: GET
    path: /consignments/{consignment_id}
    description: reads one consignment with its derived counters
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer, IntakeInspector, Consignor]
    success_code: 200
    input: []
    output: Consignment
    side_effects: []

  - method: POST
    path: /consignments/{consignment_id}/submit
    description: submits the consignment for intake review
    roles: [Consignor]
    success_code: 200
    input: []
    output: Consignment
    side_effects:
      - "Consignment.status DRAFT -> SUBMITTED; version incremented by 1"

  - method: POST
    path: /consignments/{consignment_id}/intake-decision
    description: accepts the consignment into the yard or returns it to the consignor for correction
    roles: [AuctionOperator]
    success_code: 200
    input: ["decision", "correction_note?"]
    output: Consignment
    side_effects:
      - "decision ACCEPT: status SUBMITTED -> INTAKE_ACCEPTED"
      - "decision RETURN: status SUBMITTED -> DRAFT with correction_note recorded"
      - "Consignor.open_consignment_count recomputed; version incremented by 1"

  - method: GET
    path: /consignments/{consignment_id}/lots
    description: lists the lots of a consignment (reverse of Lot.consignment_id)
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer, IntakeInspector, ComplianceOfficer, Consignor]
    success_code: 200
    input: ["lifecycle_status?", "limit?", "offset?"]
    output: Lot[]
    side_effects: []

  # ----------------------------------------------------------------------- lots
  - method: POST
    path: /lots
    description: adds a machine to a draft consignment
    roles: [Consignor]
    success_code: 201
    input: ["consignment_id", "make", "model", "model_year", "serial_number", "hour_meter_reading", "weight_kg", "title_required?", "reserve_price_cents?", "sold_as_hours_unverified?", "replacement_of_lot_id?"]
    output: Lot
    side_effects:
      - "Lot created with lifecycle_status = INTAKE and title_status = TITLE_PENDING"

  - method: GET
    path: /lots/{lot_id}
    description: reads one lot with both state axes and its derived high_bid_cents
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer, IntakeInspector, ComplianceOfficer, Consignor, Bidder]
    success_code: 200
    input: []
    output: Lot
    side_effects: []

  - method: GET
    path: /lots
    description: lists lots filtered by consignment, auction, re-offer parent or lifecycle state
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer, IntakeInspector, ComplianceOfficer, Consignor, Bidder]
    success_code: 200
    input: ["consignment_id?", "auction_id?", "replacement_of_lot_id?", "lifecycle_status?", "title_status?", "limit?", "offset?"]
    output: Lot[]
    side_effects: []

  - method: PATCH
    path: /lots/{lot_id}
    description: edits catalogue-relevant lot data before it is published
    roles: [Consignor]
    success_code: 200
    input: ["reserve_price_cents?", "sold_as_hours_unverified?", "weight_kg?"]
    output: Lot
    side_effects:
      - "allowed only while lifecycle_status IN {INTAKE, INSPECTED}; Lot.version incremented by 1"

  - method: POST
    path: /lots/{lot_id}/withdraw
    description: withdraws a lot from sale
    roles: [AuctionOperator]
    success_code: 200
    input: ["withdrawal_reason"]
    output: Lot
    side_effects:
      - "lifecycle_status -> WITHDRAWN; every ACTIVE Bid on the lot becomes LOSING"
      - "Auction.assigned_lot_count recomputed; Lot.version incremented by 1"

  - method: POST
    path: /lots/{lot_id}/lien-search
    description: orders a lien and title search on the machine
    roles: [ComplianceOfficer]
    success_code: 200
    input: ["lien_search_reference"]
    output: Lot
    side_effects:
      - "title_status TITLE_PENDING -> LIEN_SEARCH_ORDERED; Lot.version incremented by 1"

  - method: POST
    path: /lots/{lot_id}/lien-result
    description: records the outcome of the lien search
    roles: [ComplianceOfficer]
    success_code: 200
    input: ["encumbrance_found", "lienholder_name?"]
    output: Lot
    side_effects:
      - "title_status -> LIEN_CLEAR or LIEN_ENCUMBERED; Lot.version incremented by 1"

  - method: POST
    path: /lots/{lot_id}/lien-release
    description: records the lienholder's release of an encumbrance
    roles: [ComplianceOfficer]
    success_code: 200
    input: ["release_document_ref"]
    output: Lot
    side_effects:
      - "title_status LIEN_ENCUMBERED -> LIEN_RELEASED; Lot.version incremented by 1"

  - method: POST
    path: /lots/{lot_id}/hammer
    description: |
      Hammers a single lot in an open auction, creating the Sale. Used for
      lot-by-lot live selling; POST /auctions/{auction_id}/close performs the
      same operation for every remaining assigned lot.
    roles: [AuctionOperator]
    success_code: 201
    input: []
    output: Sale
    side_effects:
      - "Lot.lifecycle_status ASSIGNED -> HAMMERED; winning Bid -> WINNING, other ACTIVE bids -> LOSING"
      - "Sale created with hammered_at = logical clock and reserve_met evaluated against Lot.reserve_price_cents"
      - "when reserve_met: Sale -> CONFIRMED and an Invoice is created at the PROVISIONAL variant"
      - "Bidder.open_exposure_cents, BidderRegistration.bid_cap_cents, Auction.sold_lot_count and Auction.gross_hammer_cents recomputed"

  - method: POST
    path: /lots/{lot_id}/condition-reports
    description: files the inspection and photography condition report for a lot
    roles: [IntakeInspector]
    success_code: 201
    input: ["structural_score", "powertrain_score", "hydraulics_score", "tires_score", "observed_hour_meter_reading", "hour_meter_verified", "hour_meter_photo_ref?"]
    output: ConditionReport
    side_effects:
      - "ConditionReport created in DRAFT with inspector_user_id = acting X-User-ID"
      - "lot_condition_grade computes grade_score, grade_band and hour_meter_variance_pct"
      - "Lot.lifecycle_status INTAKE -> INSPECTED; Lot.version incremented by 1"

  - method: GET
    path: /lots/{id}/condition-reports
    description: lists the condition reports of a lot (reverse of ConditionReport.lot_id)
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer, IntakeInspector, ComplianceOfficer, Consignor, Bidder]
    success_code: 200
    input: ["limit?", "offset?"]
    output: ConditionReport[]
    side_effects: []

  - method: GET
    path: /lots/{id}/refurbishment-orders
    description: lists the refurbishment orders of a lot (reverse of RefurbishmentOrder.lot_id)
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer, IntakeInspector, Consignor]
    success_code: 200
    input: ["status?", "limit?", "offset?"]
    output: RefurbishmentOrder[]
    side_effects: []

  # ---------------------------------------------------------- condition reports
  - method: GET
    path: /condition-reports/{report_id}
    description: reads one condition report with its computed grade
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer, IntakeInspector, ComplianceOfficer, Consignor, Bidder]
    success_code: 200
    input: []
    output: ConditionReport
    side_effects: []

  - method: POST
    path: /condition-reports/{report_id}/rescore
    description: corrects component scores or the hour-meter verification outcome on a draft report
    roles: [IntakeInspector]
    success_code: 200
    input: ["structural_score?", "powertrain_score?", "hydraulics_score?", "tires_score?", "hour_meter_verified?"]
    output: ConditionReport
    side_effects:
      - "allowed only while status == DRAFT"
      - "lot_condition_grade re-run; grade_score and grade_band restamped"
      - "ConditionReport.version incremented by 1"

  - method: POST
    path: /condition-reports/{report_id}/publish
    description: publishes the report to the catalogue
    roles: [IntakeInspector]
    success_code: 200
    input: []
    output: ConditionReport
    side_effects:
      - "ConditionReport.status DRAFT -> PUBLISHED"
      - "Lot.lifecycle_status INSPECTED -> CATALOG_READY"
      - "bubble-up: Consignment.status INTAKE_ACCEPTED -> CATALOGED once every non-WITHDRAWN sibling lot is CATALOG_READY"
      - "ConditionReport.version incremented by 1"

  # ------------------------------------------------------- refurbishment orders
  - method: POST
    path: /refurbishment-orders
    description: opens a refurbishment, cleaning and photography work order for a lot
    roles: [IntakeInspector]
    success_code: 201
    input: ["lot_id", "scope_note", "estimated_cost_cents"]
    output: RefurbishmentOrder
    side_effects:
      - "RefurbishmentOrder created in DRAFT with rework_round = 0"

  - method: GET
    path: /refurbishment-orders/{order_id}
    description: reads one refurbishment order
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer, IntakeInspector, Consignor]
    success_code: 200
    input: []
    output: RefurbishmentOrder
    side_effects: []

  - method: POST
    path: /refurbishment-orders/{order_id}/transition
    description: |
      Drives the refurbishment workflow: START, SUBMIT_QA, QA_REWORK, QA_PASS.
      QA_PASS is subject to segregation of duties against the lot's inspector.
    roles: [IntakeInspector]
    success_code: 200
    input: ["action", "actual_cost_cents?", "qa_note?"]
    output: RefurbishmentOrder
    side_effects:
      - "status advances per the RefurbishmentOrder machine; QA_REWORK increments rework_round"
      - "QA_PASS records qa_signed_off_by_user_id = acting X-User-ID"
      - "RefurbishmentOrder.version incremented by 1"

  # ------------------------------------------------------------------- auctions
  - method: POST
    path: /auctions
    description: schedules a live on-site or timed online auction at a yard
    roles: [AuctionOperator]
    success_code: 201
    input: ["yard_id", "kind", "reserve_policy", "premium_schedule_code", "window_start", "window_end"]
    output: Auction
    side_effects:
      - "Auction created in SCHEDULED with loadout_deadline_at = window_end + Yard.loadout_deadline_days days"
      - "LIVE_ONSITE windows are checked against every other non-RECONCILED LIVE_ONSITE auction at the yard, extended by Yard.teardown_buffer_minutes"

  - method: GET
    path: /auctions/{auction_id}
    description: reads one auction with its derived counters
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer, ComplianceOfficer, IntakeInspector, Consignor, Bidder]
    success_code: 200
    input: []
    output: Auction
    side_effects: []

  - method: GET
    path: /auctions
    description: lists auctions
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer, ComplianceOfficer, IntakeInspector, Consignor, Bidder]
    success_code: 200
    input: ["yard_id?", "kind?", "status?", "limit?", "offset?"]
    output: Auction[]
    side_effects: []

  - method: POST
    path: /auctions/{auction_id}/reschedule
    description: moves a scheduled auction's bidding window
    roles: [AuctionOperator]
    success_code: 200
    input: ["window_start", "window_end"]
    output: Auction
    side_effects:
      - "allowed only while status == SCHEDULED"
      - "loadout_deadline_at recomputed; the yard overlap rule is re-evaluated excluding this auction"
      - "Auction.version incremented by 1"

  - method: POST
    path: /auctions/{auction_id}/lot-assignments
    description: assigns a catalogued lot to this auction and optionally stamps its reserve
    roles: [AuctionOperator]
    success_code: 201
    input: ["lot_id", "reserve_price_cents?"]
    output: Lot
    side_effects:
      - "Lot.auction_id stamped; Lot.lifecycle_status CATALOG_READY -> ASSIGNED"
      - "Auction.assigned_lot_count recomputed; Lot.version and Auction.version each incremented by 1"

  - method: POST
    path: /auctions/{auction_id}/open
    description: opens bidding
    roles: [AuctionOperator]
    success_code: 200
    input: []
    output: Auction
    side_effects:
      - "Auction.status SCHEDULED -> OPEN; version incremented by 1"

  - method: POST
    path: /auctions/{auction_id}/close
    description: |
      Closes bidding and settles the ring in one call: every still-ASSIGNED lot
      is processed in Lot.created_at ASC order, hammering those with a standing
      bid and marking the rest UNSOLD.
    roles: [AuctionOperator]
    success_code: 200
    input: []
    output: Auction
    side_effects:
      - "cascade depth 1: Auction.status OPEN -> CLOSED"
      - "cascade depth 2: each ASSIGNED lot with high_bid_cents > 0 -> HAMMERED and a Sale is created; high_bid_cents == 0 -> UNSOLD with no Sale"
      - "cascade depth 3: each Sale with reserve_met -> CONFIRMED and an Invoice is created at the PROVISIONAL variant"
      - "cascade depth 4: Bidder.open_exposure_cents, BidderRegistration.deposit_applied_total_cents and bid_cap_cents, Auction.sold_lot_count, unsold_lot_count and gross_hammer_cents, Consignment.unsold_lot_count all recomputed"
      - "Auction.version incremented by 1"

  - method: POST
    path: /auctions/{auction_id}/reconcile
    description: closes the auction's books once every sale is resolved and settled
    roles: [SettlementOfficer]
    success_code: 200
    input: []
    output: Auction
    side_effects:
      - "Auction.status CLOSED -> RECONCILED; gross_hammer_cents recomputed; version incremented by 1"

  # -------------------------------------------------------------------- bidders
  - method: POST
    path: /bidders
    description: registers a global bidder and derives its country tier
    roles: [PlatformAdmin]
    success_code: 201
    input: ["legal_name", "country_code", "tax_id?"]
    output: Bidder
    side_effects:
      - "Bidder.country_tier derived from country_code; every deposit counter starts at 0"

  - method: GET
    path: /bidders/{bidder_id}
    description: reads one bidder with the four deposit counters and open exposure
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer, ComplianceOfficer, Bidder]
    success_code: 200
    input: []
    output: Bidder
    side_effects: []

  - method: GET
    path: /bidders
    description: lists bidders
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer, ComplianceOfficer]
    success_code: 200
    input: ["country_code?", "country_tier?", "limit?", "offset?"]
    output: Bidder[]
    side_effects: []

  - method: POST
    path: /bidders/{bidder_id}/deposits
    description: records a cash deposit received from the bidder
    roles: [SettlementOfficer]
    success_code: 200
    input: ["amount_cents", "reference"]
    output: Bidder
    side_effects:
      - "deposit_total_cents and deposit_available_cents each increased by amount_cents"
      - "the conserved invariant deposit_total_cents == deposit_held_cents + deposit_available_cents + deposit_forfeited_cents continues to hold"
      - "Bidder.version incremented by 1"

  - method: GET
    path: /bidders/{bidder_id}/exposure
    description: |
      Computed read exposing both variants of bidder_exposure_and_bid_cap for one
      registration, so the ring view and the settlement view can be compared.
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer, Bidder]
    success_code: 200
    input: ["auction_id", "variant"]
    output: "{ bidder_id: string, auction_id: string, registration_id: string, variant: string, base_headroom_cents: integer, exposure_cents: integer, bid_cap_cents: integer, breached_at_sale_id: string }"
    side_effects: []

  # ------------------------------------------------------- bidder registrations
  - method: POST
    path: /bidder-registrations
    description: |
      Registers a bidder for one auction, locking a deposit hold. The tier
      minimum deposit and the sanctions screen are both applied here.
    roles: [Bidder]
    success_code: 201
    input: ["bidder_id", "auction_id", "deposit_hold_cents", "financing_requested?"]
    output: BidderRegistration
    side_effects:
      - "BidderRegistration created in REQUESTED with a paddle_number allocated as max(existing paddle at this auction)+1 starting at 101"
      - "Bidder.deposit_held_cents increased and deposit_available_cents decreased by deposit_hold_cents"
      - "BidderRegistration.version = 1"

  - method: GET
    path: /bidder-registrations/{registration_id}
    description: reads one registration with its derived terms, leverage and bid cap
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer, ComplianceOfficer, Bidder]
    success_code: 200
    input: []
    output: BidderRegistration
    side_effects: []

  - method: GET
    path: /bidder-registrations
    description: lists registrations by bidder or auction (reverse of both FKs)
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer, ComplianceOfficer, Bidder]
    success_code: 200
    input: ["bidder_id?", "auction_id?", "status?", "limit?", "offset?"]
    output: BidderRegistration[]
    side_effects: []

  - method: POST
    path: /bidder-registrations/{registration_id}/credit-decision
    description: approves or declines credit and stamps payment terms by bidder country
    roles: [SettlementOfficer]
    success_code: 200
    input: ["decision", "approved_credit_limit_cents?", "decline_reason?"]
    output: BidderRegistration
    side_effects:
      - "APPROVE: status -> APPROVED, leverage_multiplier and payment_terms_code derived from Bidder.country_tier and financing_approved, bid_cap_cents stamped from the REGISTRATION_FORECAST variant, credit_approved_by_user_id recorded"
      - "DECLINE: status -> DECLINED and the deposit hold is released back to deposit_available_cents"
      - "BidderRegistration.version incremented by 1"

  - method: POST
    path: /bidder-registrations/{registration_id}/cancel
    description: cancels a registration and releases its deposit hold
    roles: [Bidder]
    success_code: 200
    input: []
    output: BidderRegistration
    side_effects:
      - "status -> CANCELLED; deposit_held_cents decreased and deposit_available_cents increased by deposit_hold_cents, leaving deposit_total_cents unchanged"
      - "BidderRegistration.version incremented by 1"

  # ----------------------------------------------------------------------- bids
  - method: POST
    path: /bids
    description: places a bid, policed by the LIVE_CHRONOLOGICAL bid cap
    roles: [Bidder]
    success_code: 201
    input: ["registration_id", "lot_id", "amount_cents"]
    output: Bid
    side_effects:
      - "Bid created in ACTIVE with placed_at = logical clock"
      - "Lot.high_bid_cents recomputed"

  - method: GET
    path: /bids/{bid_id}
    description: reads one bid
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer, Bidder]
    success_code: 200
    input: []
    output: Bid
    side_effects: []

  - method: GET
    path: /bids
    description: lists bids by registration or lot (reverse of both FKs)
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer, Bidder]
    success_code: 200
    input: ["registration_id?", "lot_id?", "status?", "limit?", "offset?"]
    output: Bid[]
    side_effects: []

  # ---------------------------------------------------------------------- sales
  - method: GET
    path: /sales/{sale_id}
    description: reads one sale
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer, Consignor, Bidder]
    success_code: 200
    input: []
    output: Sale
    side_effects: []

  - method: GET
    path: /sales
    description: lists sales by auction, lot or winning bid (reverse of all three FKs)
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer, Consignor, Bidder]
    success_code: 200
    input: ["auction_id?", "lot_id?", "winning_bid_id?", "registration_id?", "status?", "limit?", "offset?"]
    output: Sale[]
    side_effects: []

  - method: POST
    path: /sales/{sale_id}/counteroffer
    description: |
      Consignor counteroffer on a provisional sale that missed its reserve.
      Guarded by optimistic concurrency on the Sale version because a later
      counteroffer legitimately supersedes an earlier one.
    roles: [Consignor]
    success_code: 200
    input: ["expected_sale_version", "counter_price_cents"]
    output: Sale
    side_effects:
      - "Sale.status PROVISIONAL -> CONSIGNOR_COUNTERED; counter_round incremented by 1; counter_price_cents recorded"
      - "Sale.version incremented by 1"

  - method: POST
    path: /sales/{sale_id}/counter-response
    description: buyer accepts or declines the consignor's counteroffer
    roles: [Bidder]
    success_code: 200
    input: ["decision"]
    output: Sale
    side_effects:
      - "ACCEPT: hammer_price_cents overwritten with counter_price_cents, reserve_met = true, status -> CONFIRMED, Invoice created at the PROVISIONAL variant"
      - "DECLINE below the lap limit: status -> PROVISIONAL so the consignor may counter again"
      - "DECLINE at the lap limit: status -> NO_SALE, Lot -> UNSOLD, winning bid -> LOSING"
      - "Sale.version incremented by 1"

  - method: POST
    path: /sales/{sale_id}/reject
    description: consignor refuses the provisional result outright
    roles: [Consignor]
    success_code: 200
    input: ["reject_reason"]
    output: Sale
    side_effects:
      - "Sale.status PROVISIONAL -> NO_SALE; Lot.lifecycle_status HAMMERED -> UNSOLD; winning bid -> LOSING"
      - "Consignment.unsold_lot_count and Auction.unsold_lot_count recomputed; Sale.version incremented by 1"

  - method: GET
    path: /sales/{id}/consignor-settlements
    description: lists the settlements posted against a sale (reverse of ConsignorSettlement.sale_id)
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer, Consignor]
    success_code: 200
    input: ["limit?", "offset?"]
    output: ConsignorSettlement[]
    side_effects: []

  # ------------------------------------------------------------------- invoices
  - method: GET
    path: /invoices/{invoice_id}
    description: reads one invoice with both state axes and every stamped money field
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer, ComplianceOfficer, Bidder]
    success_code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: /invoices
    description: lists invoices by sale, bidder or registration (reverse of all three FKs)
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer, ComplianceOfficer, Bidder]
    success_code: 200
    input: ["sale_id?", "bidder_id?", "registration_id?", "payment_status?", "release_status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  - method: GET
    path: /invoices/{invoice_id}/settlement-preview
    description: |
      Computed read returning buyer_settlement_total for either variant without
      mutating the invoice, so the PROVISIONAL and FINAL figures can be compared
      before finalisation.
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer, Bidder]
    success_code: 200
    input: ["variant"]
    output: "{ invoice_id: string, variant: string, hammer_price_cents: integer, buyer_premium_cents: integer, documentation_fee_cents: integer, title_transfer_fee_cents: integer, financing_fee_cents: integer, subtotal_cents: integer, tax_rate_applied: number, tax_cents: integer, chargeable_storage_days: integer, storage_fee_cents: integer, credit_memo_cents: integer, deposit_applied_cents: integer, total_due_cents: integer }"
    side_effects: []

  - method: POST
    path: /invoices/{invoice_id}/finalize
    description: restamps the invoice at the FINAL variant, accruing storage and applying any export zero-rating
    roles: [SettlementOfficer]
    success_code: 200
    input: []
    output: Invoice
    side_effects:
      - "settlement_variant PROVISIONAL -> FINAL; storage_fee_cents, chargeable_storage_days, tax_rate_applied, tax_cents, deposit_applied_cents and total_due_cents restamped"
      - "payment_status may regress PAID -> PARTIALLY_PAID when total_due_cents rises above amount_paid_cents; release_status is untouched"
      - "Bidder.open_exposure_cents recomputed; Invoice.version incremented by 1"

  - method: POST
    path: /invoices/{invoice_id}/fee-waiver
    description: waives part of the buyer's fees as a credit memo
    roles: [SettlementOfficer]
    success_code: 200
    input: ["waiver_cents", "reason"]
    output: Invoice
    side_effects:
      - "credit_memo_cents increased by waiver_cents; total_due_cents and outstanding_cents recomputed"
      - "refused when the acting X-User-ID is the registration's credit_approved_by_user_id"
      - "Invoice.version incremented by 1"

  - method: POST
    path: /invoices/{invoice_id}/authorize-release
    description: authorises physical release of the equipment
    roles: [SettlementOfficer]
    success_code: 200
    input: []
    output: Invoice
    side_effects:
      - "release_status HELD -> RELEASE_AUTHORIZED; Invoice.version incremented by 1"

  - method: POST
    path: /invoices/{invoice_id}/default
    description: marks an overdue invoice as in default
    roles: [SettlementOfficer]
    success_code: 200
    input: []
    output: Invoice
    side_effects:
      - "payment_status UNPAID or PARTIALLY_PAID -> IN_DEFAULT; Invoice.version incremented by 1"

  - method: POST
    path: /invoices/{invoice_id}/abandon
    description: |
      Applies the abandoned-purchase remedy. This is the deepest cascade in the
      domain: invoice -> sale -> consignor settlement -> lot -> consignment, plus
      the bidder strike sub-chain.
    roles: [SettlementOfficer]
    success_code: 200
    input: ["reason"]
    output: Invoice
    side_effects:
      - "cascade depth 1: payment_status IN_DEFAULT -> WRITTEN_OFF and release_status -> ABANDONED; storage restamped at the FINAL variant and deficiency_claim_cents computed"
      - "cascade depth 1b: every SETTLED Payment of the invoice -> REVERSED, amount_paid_cents recomputed; every BOOKED or CHECKED_IN LoadoutSlot -> CANCELLED and LoadoutBay.reserved_tonnage_kg recomputed"
      - "cascade depth 2: Sale.status -> DEFAULTED; Bidder.default_strike_count incremented, which suspends every APPROVED registration of that bidder once it reaches MAX_DEFAULT_STRIKES"
      - "cascade depth 3: the sale's POSTED ConsignorSettlement -> REVERSED with net_proceeds_cents = -NO_SALE_FEE_CENTS; Consignment.advance_outstanding_cents and Consignor.lifetime_net_proceeds_cents restored"
      - "cascade depth 4: Lot.lifecycle_status SETTLED -> REOFFER_QUEUED and Consignment.reoffer_lot_count recomputed"
      - "the deposit hold is forfeited: deposit_held_cents decreased and deposit_forfeited_cents increased by deposit_hold_cents"
      - "Invoice.version incremented by 1"

  - method: GET
    path: /invoices/{id}/payments
    description: lists the payments of an invoice (reverse of Payment.invoice_id)
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer, Bidder]
    success_code: 200
    input: ["status?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  - method: GET
    path: /invoices/{id}/export-packets
    description: lists the export document packets of an invoice (reverse of ExportDocumentPacket.invoice_id)
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer, ComplianceOfficer, Bidder]
    success_code: 200
    input: ["limit?", "offset?"]
    output: ExportDocumentPacket[]
    side_effects: []

  # ------------------------------------------------------------------- payments
  - method: POST
    path: /payments
    description: records a buyer tender against an invoice
    roles: [Bidder]
    success_code: 201
    input: ["invoice_id", "amount_cents", "method", "currency_code"]
    output: Payment
    side_effects:
      - "Payment created in SETTLED with received_at = logical clock"
      - "Invoice.amount_paid_cents, outstanding_cents and payment_status recomputed"
      - "Bidder.open_exposure_cents recomputed; Invoice.version incremented by 1"

  - method: GET
    path: /payments/{payment_id}
    description: reads one payment (immutable record, no version field)
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer, Bidder]
    success_code: 200
    input: []
    output: Payment
    side_effects: []

  # ------------------------------------------------------------ export packets
  - method: POST
    path: /export-packets
    description: opens the export documentation packet for a cross-border invoice
    roles: [ComplianceOfficer]
    success_code: 201
    input: ["invoice_id", "destination_country_code"]
    output: ExportDocumentPacket
    side_effects:
      - "ExportDocumentPacket created in PREPARING with reopen_count = 0"

  - method: GET
    path: /export-packets/{packet_id}
    description: reads one export packet
    roles: [PlatformAdmin, SettlementOfficer, ComplianceOfficer, Bidder]
    success_code: 200
    input: []
    output: ExportDocumentPacket
    side_effects: []

  - method: POST
    path: /export-packets/{packet_id}/transition
    description: |
      Drives the documentation pipeline: ATTACH_TITLE, FILE_CUSTOMS, CLEAR,
      REJECT, REOPEN.
    roles: [ComplianceOfficer]
    success_code: 200
    input: ["action", "title_document_ref?", "customs_entry_ref?", "rejection_reason?"]
    output: ExportDocumentPacket
    side_effects:
      - "status advances per the ExportDocumentPacket machine; REOPEN increments reopen_count and clears both document references"
      - "reaching EXPORT_CLEARED makes the invoice's FINAL variant zero-rated, but does not itself restamp the invoice"
      - "ExportDocumentPacket.version incremented by 1"

  # ------------------------------------------------------------- loadout slots
  - method: POST
    path: /loadout-slots
    description: |
      Books a load-out window in a bay, or supersedes the invoice's existing
      booking. Guarded by optimistic concurrency on the Invoice version because
      a rebooking legitimately supersedes the prior slot.
    roles: [Bidder]
    success_code: 201
    input: ["invoice_id", "bay_id", "expected_invoice_version", "slot_start", "slot_end", "transport_mode", "tonnage_kg?"]
    output: LoadoutSlot
    side_effects:
      - "LoadoutSlot created in BOOKED with tonnage_kg defaulting to Lot.weight_kg"
      - "an existing BOOKED slot of the same invoice is CANCELLED with cancel_reason = SUPERSEDED only after every validation has passed, and supersedes_slot_id is recorded on the new slot"
      - "LoadoutBay.reserved_tonnage_kg recomputed for every bay involved"
      - "Invoice.release_status RELEASE_AUTHORIZED -> LOADOUT_BOOKED; Invoice.version incremented by 1"

  - method: GET
    path: /loadout-slots/{slot_id}
    description: reads one load-out slot
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer, Bidder]
    success_code: 200
    input: []
    output: LoadoutSlot
    side_effects: []

  - method: GET
    path: /loadout-slots
    description: lists slots by invoice or bay (reverse of both FKs)
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer, Bidder]
    success_code: 200
    input: ["invoice_id?", "bay_id?", "status?", "supersedes_slot_id?", "limit?", "offset?"]
    output: LoadoutSlot[]
    side_effects: []

  - method: POST
    path: /loadout-slots/{slot_id}/check-in
    description: records the transporter's arrival inside the booked window
    roles: [Bidder]
    success_code: 200
    input: []
    output: LoadoutSlot
    side_effects:
      - "status BOOKED -> CHECKED_IN; LoadoutSlot.version incremented by 1"

  - method: POST
    path: /loadout-slots/{slot_id}/complete
    description: completes the load-out and releases the machine through the gate
    roles: [SettlementOfficer]
    success_code: 200
    input: ["gate_pass_ref"]
    output: LoadoutSlot
    side_effects:
      - "status CHECKED_IN -> COMPLETED; Invoice.release_status LOADOUT_BOOKED -> LOADED_OUT; Lot.lifecycle_status SETTLED -> RELEASED"
      - "LoadoutBay.reserved_tonnage_kg recomputed; Bidder.lifetime_purchase_cents recomputed"
      - "LoadoutSlot.version incremented by 1"

  - method: POST
    path: /loadout-slots/{slot_id}/cancel
    description: cancels a booking or records a no-show
    roles: [Bidder, SettlementOfficer]
    success_code: 200
    input: ["outcome", "cancel_reason?"]
    output: LoadoutSlot
    side_effects:
      - "status -> CANCELLED or NO_SHOW; LoadoutBay.reserved_tonnage_kg returns to its pre-booking value"
      - "Invoice.release_status LOADOUT_BOOKED -> RELEASE_AUTHORIZED when no non-terminal slot remains"
      - "LoadoutSlot.version incremented by 1"

  # ------------------------------------------------------ consignor settlements
  - method: POST
    path: /consignor-settlements
    description: posts the seller-side waterfall settlement for a confirmed sale
    roles: [SettlementOfficer]
    success_code: 201
    input: ["sale_id"]
    output: ConsignorSettlement
    side_effects:
      - "ConsignorSettlement created in POSTED with every waterfall bucket stamped by consignor_net_proceeds"
      - "Sale.status CONFIRMED -> SETTLED; Lot.lifecycle_status HAMMERED -> SETTLED"
      - "Consignment.advance_outstanding_cents reduced by advance_recovery_cents; Consignor.lifetime_net_proceeds_cents recomputed"

  - method: GET
    path: /consignor-settlements/{settlement_id}
    description: reads one settlement with every waterfall bucket
    roles: [PlatformAdmin, AuctionOperator, SettlementOfficer, Consignor]
    success_code: 200
    input: []
    output: ConsignorSettlement
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # ---- authentication / authorisation ---------------------------------------
  - id: ERR_UNAUTHENTICATED
    http_status: 401
    condition: "X-User-ID or X-Role header missing, empty, or X-Role not a known role name"
    applies_to: [all]
  - id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    condition: "the acting X-Role is not listed in the endpoint's roles"
    applies_to: [all]
  - id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    condition: "an entity_backed role acts on a resource owned by a different Consignor or Bidder"
    applies_to: ["POST /consignments/{consignment_id}/submit", "POST /sales/{sale_id}/counteroffer", "POST /sales/{sale_id}/reject", "POST /sales/{sale_id}/counter-response", "POST /bids", "POST /payments", "POST /loadout-slots", "POST /loadout-slots/{slot_id}/check-in", "POST /loadout-slots/{slot_id}/cancel", "POST /bidder-registrations/{registration_id}/cancel", "POST /consignors/{consignor_id}/policy-ack"]
  - id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    condition: "the acting X-User-ID equals the segregation anchor recorded upstream (report inspector for QA pass, credit approver for fee waivers)"
    applies_to: ["POST /refurbishment-orders/{order_id}/transition", "POST /invoices/{invoice_id}/fee-waiver"]

  # ---- request shape --------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http_status: 400
    condition: "missing required field, unknown enum member, wrong type, out-of-range number, malformed datetime, more than one decimal place on a condition score, limit/offset outside 1..100 / >= 0, or slot_end <= slot_start"
    applies_to: [all]

  # ---- existence ------------------------------------------------------------
  - id: ERR_YARD_NOT_FOUND
    http_status: 404
    condition: "yard_id in the path or body does not resolve"
    applies_to: ["GET /yards/{yard_id}", "GET /yards/{yard_id}/auctions", "GET /yards/{id}/loadout-bays", "POST /loadout-bays", "POST /auctions"]
  - id: ERR_LOADOUT_BAY_NOT_FOUND
    http_status: 404
    condition: "bay_id does not resolve"
    applies_to: ["GET /loadout-bays/{bay_id}", "PATCH /loadout-bays/{bay_id}", "POST /loadout-slots"]
  - id: ERR_CONSIGNOR_NOT_FOUND
    http_status: 404
    condition: "consignor_id does not resolve"
    applies_to: ["GET /consignors/{consignor_id}", "GET /consignors/{id}/consignments", "POST /consignors/{consignor_id}/policy-ack", "POST /consignments"]
  - id: ERR_CONSIGNMENT_NOT_FOUND
    http_status: 404
    condition: "consignment_id does not resolve"
    applies_to: ["GET /consignments/{consignment_id}", "GET /consignments/{consignment_id}/lots", "POST /consignments/{consignment_id}/submit", "POST /consignments/{consignment_id}/intake-decision", "POST /lots"]
  - id: ERR_LOT_NOT_FOUND
    http_status: 404
    condition: "lot_id does not resolve, including replacement_of_lot_id on lot creation"
    applies_to: ["GET /lots/{lot_id}", "PATCH /lots/{lot_id}", "POST /lots", "POST /lots/{lot_id}/withdraw", "POST /lots/{lot_id}/lien-search", "POST /lots/{lot_id}/lien-result", "POST /lots/{lot_id}/lien-release", "POST /lots/{lot_id}/hammer", "POST /lots/{lot_id}/condition-reports", "GET /lots/{id}/condition-reports", "GET /lots/{id}/refurbishment-orders", "POST /refurbishment-orders", "POST /auctions/{auction_id}/lot-assignments", "POST /bids"]
  - id: ERR_CONDITION_REPORT_NOT_FOUND
    http_status: 404
    condition: "report_id does not resolve"
    applies_to: ["GET /condition-reports/{report_id}", "POST /condition-reports/{report_id}/rescore", "POST /condition-reports/{report_id}/publish"]
  - id: ERR_REFURBISHMENT_ORDER_NOT_FOUND
    http_status: 404
    condition: "order_id does not resolve"
    applies_to: ["GET /refurbishment-orders/{order_id}", "POST /refurbishment-orders/{order_id}/transition"]
  - id: ERR_AUCTION_NOT_FOUND
    http_status: 404
    condition: "auction_id in the path, body or query does not resolve"
    applies_to: ["GET /auctions/{auction_id}", "POST /auctions/{auction_id}/reschedule", "POST /auctions/{auction_id}/lot-assignments", "POST /auctions/{auction_id}/open", "POST /auctions/{auction_id}/close", "POST /auctions/{auction_id}/reconcile", "POST /bidder-registrations", "GET /bidders/{bidder_id}/exposure"]
  - id: ERR_BIDDER_NOT_FOUND
    http_status: 404
    condition: "bidder_id does not resolve"
    applies_to: ["GET /bidders/{bidder_id}", "POST /bidders/{bidder_id}/deposits", "GET /bidders/{bidder_id}/exposure", "POST /bidder-registrations"]
  - id: ERR_REGISTRATION_NOT_FOUND
    http_status: 404
    condition: "registration_id does not resolve, or the bidder has no registration for the requested auction on the exposure read"
    applies_to: ["GET /bidder-registrations/{registration_id}", "POST /bidder-registrations/{registration_id}/credit-decision", "POST /bidder-registrations/{registration_id}/cancel", "POST /bids", "GET /bidders/{bidder_id}/exposure"]
  - id: ERR_BID_NOT_FOUND
    http_status: 404
    condition: "bid_id does not resolve"
    applies_to: ["GET /bids/{bid_id}"]
  - id: ERR_SALE_NOT_FOUND
    http_status: 404
    condition: "sale_id does not resolve"
    applies_to: ["GET /sales/{sale_id}", "GET /sales/{id}/consignor-settlements", "POST /sales/{sale_id}/counteroffer", "POST /sales/{sale_id}/counter-response", "POST /sales/{sale_id}/reject", "POST /consignor-settlements"]
  - id: ERR_INVOICE_NOT_FOUND
    http_status: 404
    condition: "invoice_id does not resolve"
    applies_to: ["GET /invoices/{invoice_id}", "GET /invoices/{invoice_id}/settlement-preview", "POST /invoices/{invoice_id}/finalize", "POST /invoices/{invoice_id}/fee-waiver", "POST /invoices/{invoice_id}/authorize-release", "POST /invoices/{invoice_id}/default", "POST /invoices/{invoice_id}/abandon", "GET /invoices/{id}/payments", "GET /invoices/{id}/export-packets", "POST /payments", "POST /export-packets", "POST /loadout-slots"]
  - id: ERR_PAYMENT_NOT_FOUND
    http_status: 404
    condition: "payment_id does not resolve"
    applies_to: ["GET /payments/{payment_id}"]
  - id: ERR_EXPORT_PACKET_NOT_FOUND
    http_status: 404
    condition: "packet_id does not resolve"
    applies_to: ["GET /export-packets/{packet_id}", "POST /export-packets/{packet_id}/transition"]
  - id: ERR_LOADOUT_SLOT_NOT_FOUND
    http_status: 404
    condition: "slot_id does not resolve"
    applies_to: ["GET /loadout-slots/{slot_id}", "POST /loadout-slots/{slot_id}/check-in", "POST /loadout-slots/{slot_id}/complete", "POST /loadout-slots/{slot_id}/cancel"]
  - id: ERR_SETTLEMENT_NOT_FOUND
    http_status: 404
    condition: "settlement_id does not resolve"
    applies_to: ["GET /consignor-settlements/{settlement_id}"]

  # ---- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_SALE_VERSION
    http_status: 412
    condition: "expected_sale_version does not equal the Sale's current version"
    applies_to: ["POST /sales/{sale_id}/counteroffer"]
  - id: ERR_STALE_INVOICE_VERSION
    http_status: 412
    condition: "expected_invoice_version does not equal the Invoice's current version"
    applies_to: ["POST /loadout-slots"]

  # ---- state ----------------------------------------------------------------
  - id: ERR_INVALID_STATE
    http_status: 409
    condition: "the requested transition is not declared from the entity's current state, including every terminal-state lockdown and every repeated one-shot action"
    applies_to: ["every action endpoint"]
  - id: ERR_AUCTION_NOT_OPEN
    http_status: 409
    condition: "the auction is not OPEN when a bid is placed or a lot is hammered"
    applies_to: ["POST /bids", "POST /lots/{lot_id}/hammer"]
  - id: ERR_REGISTRATION_NOT_APPROVED
    http_status: 409
    condition: "the registration is not APPROVED"
    applies_to: ["POST /bids", "POST /sales/{sale_id}/counter-response"]
  - id: ERR_CONSIGNMENT_NOT_CATALOGED
    http_status: 409
    condition: "a lot is assigned to an auction while its consignment has not yet bubbled up to CATALOGED (a sibling lot is still unpublished)"
    applies_to: ["POST /auctions/{auction_id}/lot-assignments"]
  - id: ERR_REFURBISHMENT_INCOMPLETE
    http_status: 409
    condition: "a RefurbishmentOrder of the lot is not COMPLETED when the report is published"
    applies_to: ["POST /condition-reports/{report_id}/publish"]
  - id: ERR_TITLE_NOT_CLEAR
    http_status: 409
    condition: "Lot.title_status is not LIEN_CLEAR or LIEN_RELEASED"
    applies_to: ["POST /auctions/{auction_id}/lot-assignments", "POST /invoices/{invoice_id}/authorize-release", "POST /export-packets/{packet_id}/transition"]
  - id: ERR_INVOICE_NOT_PAID
    http_status: 409
    condition: "release is authorised on an invoice whose payment_status is not PAID"
    applies_to: ["POST /invoices/{invoice_id}/authorize-release"]
  - id: ERR_EXPORT_NOT_CLEARED
    http_status: 409
    condition: "a cross-border invoice has no ExportDocumentPacket in EXPORT_CLEARED when release is authorised"
    applies_to: ["POST /invoices/{invoice_id}/authorize-release"]
  - id: ERR_SETTLEMENT_INCOMPLETE
    http_status: 409
    condition: "the auction still has an unresolved sale, or a CONFIRMED sale with no POSTED settlement, when reconciliation is attempted"
    applies_to: ["POST /auctions/{auction_id}/reconcile"]
  - id: ERR_DUPLICATE_CONDITION_REPORT
    http_status: 409
    condition: "the lot already has a ConditionReport"
    applies_to: ["POST /lots/{lot_id}/condition-reports"]
  - id: ERR_DUPLICATE_SETTLEMENT
    http_status: 409
    condition: "the sale already has a POSTED ConsignorSettlement"
    applies_to: ["POST /consignor-settlements"]
  - id: ERR_DUPLICATE_REGISTRATION
    http_status: 409
    condition: "the (bidder, auction) pair already has a registration in REQUESTED, APPROVED or SUSPENDED"
    applies_to: ["POST /bidder-registrations"]

  # ---- business safety ------------------------------------------------------
  - id: ERR_COUNTRY_EMBARGOED
    http_status: 403
    condition: "the bidder's country_code is in {IR, KP, SY, RU}"
    applies_to: ["POST /bidder-registrations", "POST /bidder-registrations/{registration_id}/credit-decision", "POST /export-packets"]
  - id: ERR_BIDDER_SUSPENDED
    http_status: 403
    condition: "Bidder.default_strike_count has reached MAX_DEFAULT_STRIKES (2)"
    applies_to: ["POST /bidder-registrations", "POST /bidder-registrations/{registration_id}/credit-decision", "POST /bids"]
  - id: ERR_HOUR_METER_UNVERIFIED
    http_status: 422
    condition: "the report could not verify the hour meter and the lot does not carry the hours-not-warranted disclaimer"
    applies_to: ["POST /auctions/{auction_id}/lot-assignments"]

  # ---- business referential -------------------------------------------------
  - id: ERR_BAY_YARD_MISMATCH
    http_status: 409
    condition: "the chosen bay belongs to a different yard than the auction that sold the lot"
    applies_to: ["POST /loadout-slots"]
  - id: ERR_LOT_AUCTION_MISMATCH
    http_status: 409
    condition: "the lot's consignment has not been accepted at intake, the lot is already assigned to another auction, or the lot's auction_id differs from the auction being closed"
    applies_to: ["POST /auctions/{auction_id}/lot-assignments", "POST /lots/{lot_id}/hammer"]
  - id: ERR_DESTINATION_COUNTRY_MISMATCH
    http_status: 422
    condition: "the packet's destination_country_code differs from the buyer's country_code, or the invoice is not cross-border"
    applies_to: ["POST /export-packets"]

  # ---- business constraint --------------------------------------------------
  - id: ERR_DUPLICATE_SERIAL_NUMBER
    http_status: 409
    condition: "another Lot already carries the same serial_number"
    applies_to: ["POST /lots"]
  - id: ERR_RESERVE_NOT_ALLOWED
    http_status: 422
    condition: "a reserve price is present on a lot being assigned to an UNRESERVED auction, or whose consignment agreement_type is UNRESERVED"
    applies_to: ["POST /auctions/{auction_id}/lot-assignments"]
  - id: ERR_UNRESERVED_POLICY_NOT_ACK
    http_status: 422
    condition: "an UNRESERVED consignment is submitted while the consignor has not signed the unreserved disclosure"
    applies_to: ["POST /consignments/{consignment_id}/submit"]
  - id: ERR_MAX_REWORK_ROUNDS_EXCEEDED
    http_status: 422
    condition: "a QA_REWORK decision would take rework_round beyond MAX_REWORK_ROUNDS (2)"
    applies_to: ["POST /refurbishment-orders/{order_id}/transition"]
  - id: ERR_MAX_COUNTER_ROUNDS_EXCEEDED
    http_status: 422
    condition: "a counteroffer would take counter_round beyond MAX_COUNTER_ROUNDS (3)"
    applies_to: ["POST /sales/{sale_id}/counteroffer"]
  - id: ERR_MAX_PACKET_REOPENS_EXCEEDED
    http_status: 422
    condition: "a REOPEN would take reopen_count beyond MAX_PACKET_REOPENS (2)"
    applies_to: ["POST /export-packets/{packet_id}/transition"]
  - id: ERR_COUNTER_PRICE_NOT_MONOTONIC
    http_status: 422
    condition: "counter_price_cents is below the hammer price, above the reserve, or above the previous counteroffer"
    applies_to: ["POST /sales/{sale_id}/counteroffer"]
  - id: ERR_BAY_INACTIVE
    http_status: 409
    condition: "the chosen bay has is_active = false"
    applies_to: ["POST /loadout-slots"]
  - id: ERR_BAY_CAPACITY_EXCEEDED
    http_status: 409
    condition: "aggregate tonnage across time-overlapping BOOKED/CHECKED_IN slots of the bay would exceed crane_capacity_kg"
    applies_to: ["POST /loadout-slots"]

  # ---- business temporal ----------------------------------------------------
  - id: ERR_AUCTION_WINDOW_CONFLICT
    http_status: 409
    condition: "a LIVE_ONSITE window, extended by the yard teardown buffer, overlaps another non-RECONCILED LIVE_ONSITE auction at the same yard"
    applies_to: ["POST /auctions", "POST /auctions/{auction_id}/reschedule"]
  - id: ERR_SLOT_OVERLAP
    http_status: 409
    condition: "the requested [slot_start, slot_end) overlaps another BOOKED or CHECKED_IN slot of the same invoice"
    applies_to: ["POST /loadout-slots"]
  - id: ERR_SLOT_OUTSIDE_DEADLINE
    http_status: 422
    condition: "slot_end is later than the auction's loadout_deadline_at, or slot_start is earlier than the auction's window_end"
    applies_to: ["POST /loadout-slots"]
  - id: ERR_SLOT_NOT_IN_WINDOW
    http_status: 409
    condition: "check-in outside [slot_start, slot_end), or a NO_SHOW outcome recorded before slot_end"
    applies_to: ["POST /loadout-slots/{slot_id}/check-in", "POST /loadout-slots/{slot_id}/cancel"]
  - id: ERR_PAYMENT_NOT_OVERDUE
    http_status: 409
    condition: "the logical clock is at or before Invoice.payment_due_at"
    applies_to: ["POST /invoices/{invoice_id}/default"]

  # ---- business fiscal ------------------------------------------------------
  - id: ERR_DEPOSIT_BELOW_MINIMUM
    http_status: 422
    condition: "deposit_hold_cents is below the tier minimum for the bidder's country tier"
    applies_to: ["POST /bidder-registrations"]
  - id: ERR_DEPOSIT_UNAVAILABLE
    http_status: 422
    condition: "Bidder.deposit_available_cents is smaller than the requested deposit_hold_cents"
    applies_to: ["POST /bidder-registrations"]
  - id: ERR_BID_CAP_EXCEEDED
    http_status: 422
    condition: "amount_cents exceeds the LIVE_CHRONOLOGICAL bid cap of the registration"
    applies_to: ["POST /bids"]
  - id: ERR_BID_NOT_HIGHER
    http_status: 422
    condition: "amount_cents is not strictly greater than Lot.high_bid_cents, or below MIN_OPENING_BID_CENTS (10000) on the first bid"
    applies_to: ["POST /bids"]
  - id: ERR_OVERPAYMENT
    http_status: 422
    condition: "amount_cents exceeds Invoice.outstanding_cents"
    applies_to: ["POST /payments"]
  - id: ERR_CURRENCY_MISMATCH
    http_status: 422
    condition: "the tendered currency_code differs from the auction yard's currency_code"
    applies_to: ["POST /payments"]
  - id: ERR_WAIVER_LIMIT_EXCEEDED
    http_status: 422
    condition: "cumulative credit memos would exceed 5% of Invoice.subtotal_cents"
    applies_to: ["POST /invoices/{invoice_id}/fee-waiver"]

# =============================================================================
# 1.7 RBAC Permission Matrix
# Segregation of duties: the inspector who authored a lot's condition report may
# not pass QA on that lot's refurbishment, and the officer who approved a
# bidder's credit may not later waive that bidder's fees.
# =============================================================================
roles:
  - name: PlatformAdmin
    description: back-office administrator; owns reference data (yards, bays, consignors, bidders) and the logical clock
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /yards"
      - "POST /loadout-bays"
      - "PATCH /loadout-bays/{bay_id}"
      - "POST /consignors"
      - "POST /bidders"
    shared_operations:
      - "every GET endpoint"

  - name: Consignor
    description: equipment seller; owns its own consignments, lots and provisional-sale negotiations
    identity: "entity_backed:Consignor"
    exclusive_operations:
      - "POST /consignments"
      - "POST /lots"
      - "PATCH /lots/{lot_id}"
      - "POST /consignments/{consignment_id}/submit"
      - "POST /consignors/{consignor_id}/policy-ack"
      - "POST /sales/{sale_id}/counteroffer"
      - "POST /sales/{sale_id}/reject"
    shared_operations:
      - "GET on its own consignments, lots, condition reports, sales and settlements"

  - name: IntakeInspector
    description: yard inspector; performs inspection, hour-meter verification, photography and refurbishment QA
    identity: opaque
    exclusive_operations:
      - "POST /lots/{lot_id}/condition-reports"
      - "POST /condition-reports/{report_id}/rescore"
      - "POST /condition-reports/{report_id}/publish"
      - "POST /refurbishment-orders"
      - "POST /refurbishment-orders/{order_id}/transition"
    shared_operations:
      - "GET on lots, condition reports, refurbishment orders, consignments and auctions"

  - name: ComplianceOfficer
    description: title, lien and customs specialist
    identity: opaque
    exclusive_operations:
      - "POST /lots/{lot_id}/lien-search"
      - "POST /lots/{lot_id}/lien-result"
      - "POST /lots/{lot_id}/lien-release"
      - "POST /export-packets"
      - "POST /export-packets/{packet_id}/transition"
    shared_operations:
      - "GET on lots, invoices, export packets, bidders and auctions"

  - name: AuctionOperator
    description: "runs the sale: intake decisions, scheduling, catalogue assignment, opening, hammering and closing"
    identity: opaque
    exclusive_operations:
      - "POST /consignments/{consignment_id}/intake-decision"
      - "POST /auctions"
      - "POST /auctions/{auction_id}/reschedule"
      - "POST /auctions/{auction_id}/lot-assignments"
      - "POST /auctions/{auction_id}/open"
      - "POST /auctions/{auction_id}/close"
      - "POST /lots/{lot_id}/hammer"
      - "POST /lots/{lot_id}/withdraw"
    shared_operations:
      - "GET on every operational resource"

  - name: SettlementOfficer
    description: "money desk: deposits, credit decisions, invoice finalisation, release authorisation, default and abandonment remedies, seller settlements"
    identity: opaque
    exclusive_operations:
      - "POST /bidders/{bidder_id}/deposits"
      - "POST /bidder-registrations/{registration_id}/credit-decision"
      - "POST /invoices/{invoice_id}/finalize"
      - "POST /invoices/{invoice_id}/fee-waiver"
      - "POST /invoices/{invoice_id}/authorize-release"
      - "POST /invoices/{invoice_id}/default"
      - "POST /invoices/{invoice_id}/abandon"
      - "POST /consignor-settlements"
      - "POST /auctions/{auction_id}/reconcile"
      - "POST /loadout-slots/{slot_id}/complete"
    shared_operations:
      - "POST /loadout-slots/{slot_id}/cancel (shared with Bidder)"
      - "GET on every money-bearing resource"

  - name: Bidder
    description: buyer; owns its registrations, bids, payments and load-out bookings
    identity: "entity_backed:Bidder"
    exclusive_operations:
      - "POST /bidder-registrations"
      - "POST /bidder-registrations/{registration_id}/cancel"
      - "POST /bids"
      - "POST /payments"
      - "POST /loadout-slots"
      - "POST /loadout-slots/{slot_id}/check-in"
      - "POST /sales/{sale_id}/counter-response"
    shared_operations:
      - "POST /loadout-slots/{slot_id}/cancel (shared with SettlementOfficer)"
      - "GET on its own registrations, bids, invoices, payments, packets and slots"
