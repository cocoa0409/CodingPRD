              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ROOM_DOUBLE_BOOKED"
            - "FunctionRoomBooking.${booking_b}.hold_status == HOLD"

      - name: hotel_block_per_night_aggregate_capacity_overlap
        grounds:
          - validations[priority=11]
          - calculations.block_night_occupancy
          - entities.RoomBlockLink.fields.check_in_date
          - entities.RoomBlockLink.fields.check_out_date
          - errors[ERR_BLOCK_INSUFFICIENT_ROOMS]
        distinguishing_aspect: |
          HotelRoomBlock uses AGGREGATE-CAPACITY-OVER-INTERVAL with half-open nights — distinct
          interval geometry on a distinct resource entity. Existing RESERVED link 2027-11-01..2027-11-03
          holds 7 of 10. Candidate 2027-11-02..2027-11-04 reserving 4: night 2027-11-02 has 7+4=11 > 10
          -> ERR_BLOCK_INSUFFICIENT_ROOMS (pairwise buffers play no role here).
        test_recipe:
          setup:
            - "Block total_rooms=10 with one RESERVED link reserving 7 rooms over nights 2027-11-01,2027-11-02."
          setup_api_calls:
            - call: "POST /hotel-room-blocks"
              payload: { block_name: "Night Block", total_rooms: 10, nightly_rate_cents: 12000 }
              as: PlatformAdmin
              captures: { block_id: $.data.id }
