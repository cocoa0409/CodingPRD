              captures: { dev1_id: $.data.id }
            - call: "POST /lifeline/providers/${prov_id}/devices"
              payload: { imei: "350000000000072", model_tier: "BASIC", unit_cost_cents: 2200 }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { dev2_id: $.data.id }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1200 N Main St", city: "El Paso", state_code: "TX", postal_code: "79901" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { addr_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Ana Ruiz", date_of_birth: "1980-04-11", last4_ssn: "4417", address_id: "${addr_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000 }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /lifeline/subscribers/${sub_id}/eligibility-checks"
              payload: { claimed_basis: "INCOME", proof_document_ref: "DOC-Q12" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { chk1_id: $.data.id }
            - call: "POST /lifeline/eligibility-checks/${chk1_id}/verifier-result"
              payload: { verifier_outcome: "MATCH" }
              as: NationalVerifier
            - call: "POST /lifeline/enrollments"
              payload: { subscriber_id: "${sub_id}", provider_id: "${prov_id}", eligibility_check_id: "${chk1_id}", certified_address_id: "${addr_id}", service_type: "VOICE", one_per_household_attested: true }
              as: ProviderAgent
