            - "Seller.${s_id}.available_balance_cents == 46000 and held_balance_cents == 54000   # no silent reduction"
            - "Seller.${s_id}.version == ${sv2}   # the refused write did not bump the version"

      - name: validation_escalation_is_refused_after_the_window_closes
        claim_type: temporal_validation
        grounds:
          - "validations.priority_110 (ERR_ESCALATION_WINDOW_CLOSED)"
          - "entities.Appeal.fields.escalation_deadline_at"
          - "calculations.repeat_offense_count.constants.ESCALATION_WINDOW_DAYS"
        distinguishing_aspect: |
          escalation_deadline_at is minted from decided_at + ESCALATION_WINDOW_DAYS = 2026-08-15, and
          the gate is `clock_now <= deadline`. One day past it the escalation is refused; rewinding
          the clock to exactly the deadline lets the same request through, so the boundary is
          inclusive and the window is measured from the DECISION, not from the action's issuance.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule LA-ESC-1 (LISTING_ACCURACY, base 2.00, ACCOUNT, requires_poa false)."
            - "One violation carried to SUBSTANTIATED, action a1 (severity 2.00, rung WARNING), appeal ap1 filed, review started by ar-1 and DENIED at 2026-08-01 with denial_reason EVIDENCE_UPHELD."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-ESC-1", category: "LISTING_ACCURACY", base_severity_weight: 2.00, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_la: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_la}", reporter_type: "BUYER", evidence_reference: "EV-ESC-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v1}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v1}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a1: $.data.id }
            - call: "POST /appeals"
              payload: { enforcement_action_id: "${a1}", grounds: "The listing text was accurate at the time of publication and the buyer photo shows another item." }
              as: Seller
              as_user_id: "${s_id}"
              captures: { ap1: $.data.id }
            - call: "POST /appeals/${ap1}/start-review"
              payload: {}
              as: AppealReviewer
              as_user_id: "ar-1"
            - call: "POST /appeals/${ap1}/decide"
              payload: { outcome: "DENIED", denial_reason: "EVIDENCE_UPHELD", rationale: "The archived listing snapshot contradicts the seller's account of the description." }
              as: AppealReviewer
              as_user_id: "ar-1"
              captures: { ap1_deadline: $.data.escalation_deadline_at }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /appeals/${ap1}/escalate"
              payload: { escalation_grounds: "New carrier evidence became available after the first-level decision was issued." }
              as: Seller
              as_user_id: "${s_id}"
              captures: { err_code: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /appeals/${ap1}/escalate"
              payload: { escalation_grounds: "New carrier evidence became available after the first-level decision was issued." }
              as: Seller
