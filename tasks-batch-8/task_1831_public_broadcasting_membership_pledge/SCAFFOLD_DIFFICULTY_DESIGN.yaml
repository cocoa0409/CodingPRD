            - "explicit reservation with available_qty == 0 exactly is rejected with ERR_INSUFFICIENT_INVENTORY"
            - "${err_inv} == ERR_INSUFFICIENT_INVENTORY"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: pledge_capture_depends_on_drive_on_air
        grounds:
          - state_machines.PledgeDrive
          - errors[ERR_DRIVE_NOT_OPEN]
        distinguishing_aspect: |
          Entity pair Pledge -> PledgeDrive: POST /station/pledges is valid
          only while the referenced PledgeDrive is ON_AIR; DRAFT, SCHEDULED,
          CLOSED, and RECONCILED all reject with ERR_DRIVE_NOT_OPEN.
        test_recipe:
          setup:
            - "Level BASIC; donor D; membership M; drive DRV SCHEDULED but not yet live"
          setup_api_calls:
            - call: "POST /station/membership-levels"
              payload: { code: "BASIC", min_annual_cents: 6000, min_monthly_sustainer_cents: 500 }
              as: StationAdmin
