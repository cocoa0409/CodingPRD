      - name: err_segregation_of_duties_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SEGREGATION_OF_DUTIES]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / disposition_state_beats_segregation_of_duties
          rationale: "ERR_SEGREGATION_OF_DUTIES is the losing error of the named §1.8 priority-conflict instance and is fired directly by the §1.9 RBAC instance disposition_by_ncr_author_segregation_of_duties."

      - name: err_deviation_required_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DEVIATION_REQUIRED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / use_as_is_disposition_requires_approved_in_window_deviation
          rationale: "ERR_DEVIATION_REQUIRED is fired by the §1.9 validations instance disposition_use_as_is_without_deviation_required; recorded for catalog coverage."

      - name: err_disposition_not_allowed_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DISPOSITION_NOT_ALLOWED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / ncr_disposition_branching_fork_divergent_cost
          rationale: "ERR_DISPOSITION_NOT_ALLOWED is fired by the §1.9 validations instance disposition_return_to_supplier_on_internal_ncr_not_allowed; recorded for catalog coverage."

      - name: err_deviation_overlap_triggerable
