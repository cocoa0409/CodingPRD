# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cable/Satellite TV Subscription. 9 rule_ids x 2 instances = 18 instances.
# Every grounds[] resolves into SCAFFOLD.yaml §1.1–§1.7.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: statement_full_vs_prorated_diverge
        grounds:
          - calculations.statement_total
          - entities.BillingStatement.fields.proration_mode
          - entities.BillingStatement.fields.total_cents
        distinguishing_aspect: |
          FULL_CYCLE bills the same line items at 8305c while PRORATED at active_days=10/30
          bills 2769c on the BillingStatement entity — same inputs, two algorithms, different totals.
        test_recipe:
          setup:
            - "Catalog: ChannelPackage PLUS (rank 2, fee 5000c). PremiumChannel SHOWX (kind PREMIUM, fee 1505c, min_package_rank 2). EquipmentModel BOX-HD (lease 1000c, replacement 30000c). RegionalSportsFeeRule TX (base 800c, premier_surcharge 500c)."
            - "Account in TX, ACTIVE, PLUS subscription, 1 SHOWX add-on, 1 BOX lease (qty 1), no promo."
          setup_api_calls:
            - call: "POST /channel-packages"
              payload: { tier_code: "PLUS", name: "Plus", monthly_fee_cents: 5000, channel_count: 120, rank: 2, active: true }
              as: BillingAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /premium-channels"
              payload: { code: "SHOWX", name: "ShowX", kind: "PREMIUM", monthly_fee_cents: 1505, min_package_rank: 2, active: true }
              as: BillingAdmin
              captures: { showx_id: $.data.id }
            - call: "POST /equipment-models"
              payload: { model_code: "BOX-HD", kind: "BOX", monthly_lease_cents: 1000, replacement_cost_cents: 30000, active: true }
              as: BillingAdmin
              captures: { box_id: $.data.id }
            - call: "POST /regional-sports-fee-rules"
              payload: { state_code: "TX", base_fee_cents: 800, premier_surcharge_cents: 500, active: true }
              as: BillingAdmin
            - call: "POST /accounts"
              payload: { customer_name: "Pat T", service_state_code: "TX", contract_term_months: 0 }
              as: CustomerServiceAgent
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { package_id: "${plus_id}" }
              as: CustomerServiceAgent
            - call: "POST /accounts/${acct_id}/add-ons"
              payload: { premium_channel_id: "${showx_id}" }
              as: CustomerServiceAgent
            - call: "POST /accounts/${acct_id}/equipment-leases"
              payload: { equipment_model_id: "${box_id}", quantity: 1 }
              as: CustomerServiceAgent
            - call: "POST /accounts/${acct_id}/billing-statements"
              payload: { cycle_index: 0, proration_mode: "FULL_CYCLE", days_in_cycle: 30 }
              as: BillingAdmin
              captures: { full_total: $.data.total_cents }
          trigger:
            - call: "POST /accounts/${acct_id}/billing-statements"
              payload: { cycle_index: 1, proration_mode: "PRORATED", days_in_cycle: 30, active_days: 10 }
              as: BillingAdmin
              captures: { prorated_total: $.data.total_cents }
          assert:
            - "full_total == 8305"
            - "BillingStatement.${prorated_total} == 2769"
            - "prorated_total != full_total"

      - name: promo_percent_vs_equipment_waiver_diverge
        grounds:
          - calculations.promo_discount
          - entities.PromotionOffer.fields.discount_kind
          - entities.Account.fields.monthly_recurring_cents
        distinguishing_aspect: |
          On the Account/PromotionApplication domain, PERCENT_OFF_PACKAGE yields discount 1500c
          (25% of the 6000c package), while EQUIPMENT_WAIVER yields discount 2500c (full ASSIGNED
          lease sum) for an account carrying the same package — different formula, different net.
        test_recipe:
          setup:
            - "Catalog: PLUS (rank 2, fee 6000c). HBOX premium (fee 1500c, min_rank 2). DVR model (lease 1000c, repl 30000c). RSF CA base 800 surcharge 500. Promo PCT25 (PERCENT_OFF_PACKAGE 0.25, requires_min_rank 2). Promo WAIVEQ (EQUIPMENT_WAIVER, requires_min_rank 2)."
            - "Account A: PLUS, 1 HBOX add-on, 1 DVR lease, promo PCT25 ACTIVE -> monthly_recurring 7800c."
            - "Account B: PLUS, 1 HBOX add-on, 2x DVR + 1 BOX leases (lease sum 2500c), promo WAIVEQ ACTIVE -> monthly_recurring 8300c."
          setup_api_calls:
            - call: "POST /channel-packages"
              payload: { tier_code: "PLUS", name: "Plus", monthly_fee_cents: 6000, channel_count: 120, rank: 2, active: true }
              as: BillingAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /premium-channels"
              payload: { code: "HBOX", name: "HBox", kind: "PREMIUM", monthly_fee_cents: 1500, min_package_rank: 2, active: true }
              as: BillingAdmin
              captures: { hbox_id: $.data.id }
            - call: "POST /equipment-models"
              payload: { model_code: "DVR-4K", kind: "DVR", monthly_lease_cents: 1000, replacement_cost_cents: 30000, active: true }
              as: BillingAdmin
              captures: { dvr_id: $.data.id }
            - call: "POST /equipment-models"
              payload: { model_code: "BOX-HD", kind: "BOX", monthly_lease_cents: 500, replacement_cost_cents: 20000, active: true }
              as: BillingAdmin
              captures: { box_id: $.data.id }
            - call: "POST /regional-sports-fee-rules"
              payload: { state_code: "CA", base_fee_cents: 800, premier_surcharge_cents: 500, active: true }
              as: BillingAdmin
            - call: "POST /promotion-offers"
              payload: { code: "PCT25", discount_kind: "PERCENT_OFF_PACKAGE", percent_off: 0.25, promo_months: 12, requires_min_rank: 2, rollback_protected: false, active: true }
              as: BillingAdmin
              captures: { pct_id: $.data.id }
            - call: "POST /promotion-offers"
              payload: { code: "WAIVEQ", discount_kind: "EQUIPMENT_WAIVER", promo_months: 12, requires_min_rank: 2, rollback_protected: false, active: true }
              as: BillingAdmin
              captures: { waive_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_name: "A", service_state_code: "CA", contract_term_months: 0 }
              as: CustomerServiceAgent
              captures: { acct_a: $.data.id }
            - call: "POST /accounts/${acct_a}/subscriptions"
              payload: { package_id: "${plus_id}" }
              as: CustomerServiceAgent
            - call: "POST /accounts/${acct_a}/add-ons"
              payload: { premium_channel_id: "${hbox_id}" }
              as: CustomerServiceAgent
            - call: "POST /accounts/${acct_a}/equipment-leases"
              payload: { equipment_model_id: "${dvr_id}", quantity: 1 }
              as: CustomerServiceAgent
              captures: { acct_a_v: $.data.version }
            - call: "GET /accounts/${acct_a}"
              payload: {}
              as: CustomerServiceAgent
              captures: { acct_a_ver: $.data.version }
            - call: "POST /accounts/${acct_a}/promotions"
              payload: { promotion_offer_id: "${pct_id}", expected_account_version: "${acct_a_ver}" }
              as: CustomerServiceAgent
            - call: "POST /accounts"
              payload: { customer_name: "B", service_state_code: "CA", contract_term_months: 0 }
              as: CustomerServiceAgent
              captures: { acct_b: $.data.id }
            - call: "POST /accounts/${acct_b}/subscriptions"
              payload: { package_id: "${plus_id}" }
              as: CustomerServiceAgent
            - call: "POST /accounts/${acct_b}/add-ons"
              payload: { premium_channel_id: "${hbox_id}" }
              as: CustomerServiceAgent
            - call: "POST /accounts/${acct_b}/equipment-leases"
              payload: { equipment_model_id: "${dvr_id}", quantity: 2 }
              as: CustomerServiceAgent
            - call: "POST /accounts/${acct_b}/equipment-leases"
              payload: { equipment_model_id: "${box_id}", quantity: 1 }
              as: CustomerServiceAgent
            - call: "GET /accounts/${acct_b}"
              payload: {}
              as: CustomerServiceAgent
              captures: { acct_b_ver: $.data.version }
            - call: "POST /accounts/${acct_b}/promotions"
              payload: { promotion_offer_id: "${waive_id}", expected_account_version: "${acct_b_ver}" }
              as: CustomerServiceAgent
          trigger:
            - call: "GET /accounts/${acct_a}"
              payload: {}
              as: CustomerServiceAgent
              captures: { a_net: $.data.monthly_recurring_cents }
            - call: "GET /accounts/${acct_b}"
              payload: {}
              as: CustomerServiceAgent
              captures: { b_net: $.data.monthly_recurring_cents }
          assert:
            - "Account.${a_net} == 7800"
            - "Account.${b_net} == 8300"
            - "a_net != b_net"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: statement_round_per_line_then_sum_order
        grounds:
          - calculations.statement_total
          - entities.BillingStatement.fields.proration_mode
          - entities.BillingStatement.fields.total_cents
        distinguishing_aspect: |
          Mode (b): with package 5000c, add-on 1505c, equip 1000c, rsf 800c prorated at 10/30,
          round-per-line-then-sum yields 1667+502+333+267=2769c whereas sum-then-prorate yields
          2768c — the scaffold pins per-line rounding so 2769 is the only correct total.
        test_recipe:
          setup:
            - "Same catalog as statement_full_vs_prorated_diverge: PLUS 5000c, SHOWX 1505c, BOX 1000c, TX rsf 800c. Account ACTIVE with all three line items."
          setup_api_calls:
            - call: "POST /channel-packages"
              payload: { tier_code: "PLUS", name: "Plus", monthly_fee_cents: 5000, channel_count: 120, rank: 2, active: true }
              as: BillingAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /premium-channels"
              payload: { code: "SHOWX", name: "ShowX", kind: "PREMIUM", monthly_fee_cents: 1505, min_package_rank: 2, active: true }
              as: BillingAdmin
              captures: { showx_id: $.data.id }
            - call: "POST /equipment-models"
              payload: { model_code: "BOX-HD", kind: "BOX", monthly_lease_cents: 1000, replacement_cost_cents: 30000, active: true }
              as: BillingAdmin
              captures: { box_id: $.data.id }
            - call: "POST /regional-sports-fee-rules"
              payload: { state_code: "TX", base_fee_cents: 800, premier_surcharge_cents: 500, active: true }
              as: BillingAdmin
            - call: "POST /accounts"
              payload: { customer_name: "Round Test", service_state_code: "TX", contract_term_months: 0 }
              as: CustomerServiceAgent
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { package_id: "${plus_id}" }
              as: CustomerServiceAgent
            - call: "POST /accounts/${acct_id}/add-ons"
              payload: { premium_channel_id: "${showx_id}" }
              as: CustomerServiceAgent
            - call: "POST /accounts/${acct_id}/equipment-leases"
              payload: { equipment_model_id: "${box_id}", quantity: 1 }
              as: CustomerServiceAgent
          trigger:
            - call: "POST /accounts/${acct_id}/billing-statements"
              payload: { cycle_index: 0, proration_mode: "PRORATED", days_in_cycle: 30, active_days: 10 }
              as: BillingAdmin
              captures: { st_id: $.data.id, pkg_line: $.data.package_charge_cents, add_line: $.data.addon_charge_cents, total: $.data.total_cents }
          assert:
            - "BillingStatement.${pkg_line} == 1667"
            - "BillingStatement.${add_line} == 502"
            - "BillingStatement.${total} == 2769"

      - name: monthly_recurring_eval_order_gross_then_discount
        grounds:
          - calculations.monthly_recurring_charge
          - calculations.promo_discount
          - entities.Account.fields.monthly_recurring_cents
        distinguishing_aspect: |
          Mode (c): monthly_recurring pins evaluation order gross = package+addon+equip+rsf, THEN
          discount = promo_discount(gross, package); FLAT_OFF_TOTAL caps at gross so net is
          max(0, gross - flat). With gross 6800c (6000 package + 800 rsf) and a 9000c flat-off, net
          floors at 0, not -2200.
        test_recipe:
          setup:
            - "Catalog: PLUS (rank 2, fee 6000c). RSF CA base 800 surcharge 500 (rank2 -> rsf 800). Promo BIGFLAT (FLAT_OFF_TOTAL flat_off_cents 9000, requires_min_rank 2). Account PLUS only (no add-on/equip) -> gross 6800c. Apply BIGFLAT."
          setup_api_calls:
            - call: "POST /channel-packages"
              payload: { tier_code: "PLUS", name: "Plus", monthly_fee_cents: 6000, channel_count: 120, rank: 2, active: true }
              as: BillingAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /regional-sports-fee-rules"
              payload: { state_code: "CA", base_fee_cents: 800, premier_surcharge_cents: 500, active: true }
              as: BillingAdmin
            - call: "POST /promotion-offers"
              payload: { code: "BIGFLAT", discount_kind: "FLAT_OFF_TOTAL", flat_off_cents: 9000, promo_months: 6, requires_min_rank: 2, rollback_protected: false, active: true }
              as: BillingAdmin
              captures: { flat_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_name: "Floor", service_state_code: "CA", contract_term_months: 0 }
              as: CustomerServiceAgent
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { package_id: "${plus_id}" }
              as: CustomerServiceAgent
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: CustomerServiceAgent
              captures: { acct_ver: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_id}/promotions"
              payload: { promotion_offer_id: "${flat_id}", expected_account_version: "${acct_ver}" }
              as: CustomerServiceAgent
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: CustomerServiceAgent
              captures: { net: $.data.monthly_recurring_cents }
          assert:
            - "Account.${net} == 0"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: account_promo_cycle_rolledback_to_promoactive_winback
        grounds:
          - state_machines.Account.promo_status.PROMO_ACTIVE_to_ROLLED_BACK
          - state_machines.Account.promo_status.ROLLED_BACK_to_PROMO_ACTIVE
          - entities.Account.fields.promo_status
        distinguishing_aspect: |
          On the Account entity, promo_status cycles PROMO_ACTIVE -> ROLLED_BACK (advance-cycle) ->
          PROMO_ACTIVE (win-back of a rollback_protected offer), a genuine A->B->A loop.
        test_recipe:
          setup:
            - "Catalog: PLUS (rank2 fee6000). Promo WB (PERCENT_OFF_PACKAGE 0.2, promo_months 1, requires_min_rank 2, rollback_protected true). Account PLUS ACTIVE, promo WB ACTIVE (promo_status PROMO_ACTIVE), tenure 0, rollback_at_tenure 1."
          setup_api_calls:
            - call: "POST /channel-packages"
              payload: { tier_code: "PLUS", name: "Plus", monthly_fee_cents: 6000, channel_count: 120, rank: 2, active: true }
              as: BillingAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /promotion-offers"
              payload: { code: "WB", discount_kind: "PERCENT_OFF_PACKAGE", percent_off: 0.2, promo_months: 1, requires_min_rank: 2, rollback_protected: true, active: true }
              as: BillingAdmin
              captures: { wb_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_name: "Cyc", service_state_code: "CA", contract_term_months: 0 }
              as: CustomerServiceAgent
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { package_id: "${plus_id}" }
              as: CustomerServiceAgent
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: CustomerServiceAgent
              captures: { v1: $.data.version }
            - call: "POST /accounts/${acct_id}/promotions"
              payload: { promotion_offer_id: "${wb_id}", expected_account_version: "${v1}" }
              as: CustomerServiceAgent
            - call: "POST /accounts/${acct_id}/advance-cycle"
              payload: {}
              as: BillingAdmin
              captures: { rolled_status: $.data.promo_status }
          trigger:
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: CustomerServiceAgent
              captures: { v2: $.data.version }
            - call: "POST /accounts/${acct_id}/promotions"
              payload: { promotion_offer_id: "${wb_id}", expected_account_version: "${v2}" }
              as: CustomerServiceAgent
              captures: { final_status: $.data.status, winback_flag: $.data.is_winback }
          assert:
            - "rolled_status == ROLLED_BACK"
            - "PromotionApplication.${final_status} == ACTIVE"
            - "PromotionApplication.${winback_flag} == true"

      - name: service_visit_branch_completed_vs_noshow
        grounds:
          - state_machines.ServiceVisit.status.DISPATCHED_to_COMPLETED
          - state_machines.ServiceVisit.status.DISPATCHED_to_NO_SHOW
          - calculations.visit_fee
        distinguishing_aspect: |
          On the ServiceVisit entity, DISPATCHED forks into COMPLETED (INSTALL waived -> fee 0) and
          NO_SHOW (full 9900c) with divergent side-effect sets per branch.
        test_recipe:
          setup:
            - "Technician TECH1 in CA. Account ACTIVE in CA (PLUS). Clock set to 2026-06-01T00:00Z."
            - "Two scheduled INSTALL visits, both dispatched: one to be completed, one to be no-showed, with non-overlapping windows for the same technician."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /channel-packages"
              payload: { tier_code: "PLUS", name: "Plus", monthly_fee_cents: 6000, channel_count: 120, rank: 2, active: true }
              as: BillingAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tech One", home_state_code: "CA", active: true }
              as: BillingAdmin
              captures: { tech1: $.data.id }
            - call: "POST /accounts"
              payload: { customer_name: "Visit", service_state_code: "CA", contract_term_months: 0 }
              as: CustomerServiceAgent
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { package_id: "${plus_id}" }
              as: CustomerServiceAgent
            - call: "POST /accounts/${acct_id}/service-visits"
              payload: { visit_type: "INSTALL", window_start: "2026-06-02T09:00:00Z", window_end: "2026-06-02T10:00:00Z", technician_id: "${tech1}" }
              as: CustomerServiceAgent
              captures: { v_done: $.data.id }
            - call: "POST /accounts/${acct_id}/service-visits"
              payload: { visit_type: "INSTALL", window_start: "2026-06-02T13:00:00Z", window_end: "2026-06-02T14:00:00Z", technician_id: "${tech1}" }
              as: CustomerServiceAgent
              captures: { v_noshow: $.data.id }
            - call: "POST /accounts/${acct_id}/service-visits/${v_done}/dispatch"
              payload: {}
              as: FieldTechnician
              as_user_id: "${tech1}"
            - call: "POST /accounts/${acct_id}/service-visits/${v_noshow}/dispatch"
              payload: {}
              as: FieldTechnician
              as_user_id: "${tech1}"
          trigger:
            - call: "POST /accounts/${acct_id}/service-visits/${v_done}/complete"
              payload: { outcome_note: "installed ok" }
              as: FieldTechnician
              as_user_id: "${tech1}"
              captures: { done_fee: $.data.truck_roll_fee_cents, done_status: $.data.status }
            - call: "POST /accounts/${acct_id}/service-visits/${v_noshow}/no-show"
              payload: {}
              as: FieldTechnician
              as_user_id: "${tech1}"
              captures: { noshow_fee: $.data.truck_roll_fee_cents, noshow_status: $.data.status }
          assert:
            - "ServiceVisit.${done_status} == COMPLETED"
            - "ServiceVisit.${done_fee} == 0"
            - "ServiceVisit.${noshow_status} == NO_SHOW"
            - "ServiceVisit.${noshow_fee} == 9900"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_cascade_subscription_addon_equipment_depth3
        grounds:
          - state_machines.Account.lifecycle_status.ACTIVE_to_CANCELLED
          - state_machines.Subscription.status.ACTIVE_to_TERMINATED
          - state_machines.EquipmentLease.status.ASSIGNED_to_UNRETURNED
          - entities.AddOnSubscription.fields.drop_reason
        distinguishing_aspect: |
          Cancel (depth >= 3): Account->CANCELLED terminates the Subscription; that termination drops
          the ACTIVE AddOnSubscription (drop_reason CANCELLED); the cancel also flips the ASSIGNED
          EquipmentLease to UNRETURNED with a replacement charge — each hop caused by the prior.
        test_recipe:
          setup:
            - "Account ACTIVE (PLUS), 1 HBOX add-on ACTIVE, 1 DVR lease ASSIGNED (qty 1, replacement 30000c), contract_term_months 0 (no ETF)."
          setup_api_calls:
            - call: "POST /channel-packages"
              payload: { tier_code: "PLUS", name: "Plus", monthly_fee_cents: 6000, channel_count: 120, rank: 2, active: true }
              as: BillingAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /premium-channels"
              payload: { code: "HBOX", name: "HBox", kind: "PREMIUM", monthly_fee_cents: 1500, min_package_rank: 2, active: true }
              as: BillingAdmin
              captures: { hbox_id: $.data.id }
            - call: "POST /equipment-models"
              payload: { model_code: "DVR-4K", kind: "DVR", monthly_lease_cents: 1000, replacement_cost_cents: 30000, active: true }
              as: BillingAdmin
              captures: { dvr_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_name: "Cancel", service_state_code: "CA", contract_term_months: 0 }
              as: CustomerServiceAgent
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { package_id: "${plus_id}" }
              as: CustomerServiceAgent
            - call: "POST /accounts/${acct_id}/add-ons"
              payload: { premium_channel_id: "${hbox_id}" }
              as: CustomerServiceAgent
              captures: { addon_id: $.data.id }
            - call: "POST /accounts/${acct_id}/equipment-leases"
              payload: { equipment_model_id: "${dvr_id}", quantity: 1 }
              as: CustomerServiceAgent
              captures: { lease_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/cancel"
              payload: {}
              as: CustomerServiceAgent
              captures: { life: $.data.lifecycle_status, net: $.data.monthly_recurring_cents }
          assert:
            - "Account.${life} == CANCELLED"
            - "Account.${net} == 0"
            - "AddOnSubscription.${addon_id}.status == DROPPED"
            - "AddOnSubscription.${addon_id}.drop_reason == CANCELLED"
            - "EquipmentLease.${lease_id}.status == UNRETURNED"
            - "EquipmentLease.${lease_id}.unreturned_charge_cents == 30000"

      - name: downgrade_cascade_incompatible_addon_recompute_depth2
        grounds:
          - state_machines.Subscription.status.ACTIVE_to_SUPERSEDED
          - entities.AddOnSubscription.fields.drop_reason
          - calculations.monthly_recurring_charge
        distinguishing_aspect: |
          Downgrade (depth >= 2): downgrading PLUS(rank2)->BASIC(rank1) supersedes the Subscription;
          that supersede drops the rank-2 add-on (drop_reason INCOMPATIBLE_DOWNGRADE); that drop in
          turn forces monthly_recurring recompute to the BASIC-only base.
        test_recipe:
          setup:
            - "Catalog: BASIC (rank1 fee3000), PLUS (rank2 fee6000). HBOX premium (fee1500 min_rank2). RSF CA base800 surcharge500. Account PLUS ACTIVE + HBOX add-on (rank2)."
          setup_api_calls:
            - call: "POST /channel-packages"
              payload: { tier_code: "BASIC", name: "Basic", monthly_fee_cents: 3000, channel_count: 60, rank: 1, active: true }
              as: BillingAdmin
