              as: LicensingAdmin
              captures: { app_status: "$.data.status" }
            - call: "POST /licensing/license-applications/${app_id}/review"
              payload: { disposition: "ACCEPT_FOR_REVIEW" }
              as: LicensingAdmin
            - call: "POST /licensing/license-applications/${app_id}/review"
