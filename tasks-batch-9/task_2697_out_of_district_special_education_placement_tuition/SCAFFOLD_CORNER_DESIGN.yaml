          rationale: "return_readiness_score is the declared weighted_scoring rule (W_GOAL 0.5, W_BENCH 0.3, W_ATT 0.2 plus a regression penalty). That §1.8 instance hits the 62.50 floor exactly from a three-quarter report set and shows 62.45 fails, which exercises the weights, the penalty and the rounding accumulation in one fixture."
