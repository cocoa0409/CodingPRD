          savings_cap_bp: 1000
          stop_loss_cents: 2000000
          withhold_rate_bp: 500
          quality_gate_floor_points: 30
          quality_gate_excellence_points: 80
          estimate_method: ANNUALIZATION
          quality_measures:
          - measure_code: HBA1C
            weight_bp: 10000
            decile_thresholds_bp:
            - 1000
            - 2000
            - 3000
            - 4000
            - 5000
            - 6000
            - 7000
            - 8000
            - 9000
        as: ContractManager
        captures:
          c1: $.data.id
      - call: POST /vbc/performance-years
        payload:
          contract_id: ${c1}
          year_label: 2026
          period_start: '2026-01-01'
          period_end: '2027-01-01'
        as: PayerAdmin
        captures:
          y1: $.data.id
      - call: POST /vbc/members
        payload:
          program_id: ${pg}
          member_ref: M-001
          birth_year: 1980
        as: PayerAdmin
        captures:
          m1: $.data.id
      trigger:
      - call: POST /vbc/claims
