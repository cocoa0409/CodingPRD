            - call: "POST /charity-care/accounts"
              payload: { patient_id: "${pat}", encounter_date: "2025-12-15", total_charges_cents: 100000, insurance_paid_cents: 0 }
              as: BillingAdministrator
              captures: { acc: $.data.id }
            - call: "POST /charity-care/accounts/${acc}/statements"
              payload: {}
              as: BillingAdministrator
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /charity-care/accounts/${acc}/notices"
              payload: { notice_type: "ECA_WARNING", delivery_channel: "MAIL" }
              as: BillingAdministrator
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /charity-care/accounts/${acc}/collection-actions"
