        grounds:
          - state_machines.MaterialLot.RETURNED_PENDING_to_DISCREPANT
          - entities.IrregularityReport.fields.system_generated
          - entities.TestWindow.fields.open_breach_count
          - entities.TestWindow.fields.security_hold
