            - call: "POST /homes/00000000-0000-0000-0000-000000000000/disposition-decision"
              payload: { decision: "APPROVE_SALE", disposition_mode: "INDIVIDUAL", bpo_value_cents: 30000000 }
              as: OperationsManager
              as_user_id: "ops-1"
            - call: "POST /underwriting-cases/${uc_id}/decision"
              payload: { decision: "APPROVE" }
              as: InvestmentCommittee
              as_user_id: "ic-1"
          assert:
            - "trigger call 1: response.http_status == 403 and response.error_id == ERR_UNAUTHORIZED"
            - "trigger call 2: response.http_status == 403 and response.error_id == ERR_UNAUTHORIZED"
            - "trigger call 3: response.http_status == 403 and response.error_id == ERR_UNAUTHORIZED"
