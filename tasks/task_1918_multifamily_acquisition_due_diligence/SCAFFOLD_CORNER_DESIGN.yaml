scaffold_corner_design:
  # ===================================================================
  # Section: entities
  # ===================================================================
  - section: entities
    instances:
      - name: create_acquisition_applies_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.Acquisition]
        distinguishing_aspect: "Create with only required inputs yields status DRAFT, posture ON_TRACK, all computed money fields 0, version 1, and the documented defaults (true_up_window_days 90, INSPECTOR_BASIS, DAILY_ACCRUAL)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /acquisitions", payload: { property_name: "Default Deal", address: "1 Main St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { st: $.data.status, post: $.data.readiness_posture, dm: $.data.deferred_maintenance_total_cents, rv: $.data.rent_roll_variance_cents, dv: $.data.deposit_variance_cents, pa: $.data.payroll_accrual_cents, np: $.data.net_proration_cents, v: $.data.version, tuw: $.data.true_up_window_days, basis: $.data.maintenance_estimate_basis, iam: $.data.interest_accrual_method } }
          assert:
            - "status == DRAFT; readiness_posture == ON_TRACK"
            - "deferred_maintenance_total_cents == 0; rent_roll_variance_cents == 0; deposit_variance_cents == 0; payroll_accrual_cents == 0; net_proration_cents == 0"
            - "version == 1; true_up_window_days == 90; maintenance_estimate_basis == INSPECTOR_BASIS; interest_accrual_method == DAILY_ACCRUAL"
            - "closing_executed_at is null"

      - name: get_acquisition_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Acquisition, "errors[ERR_ACQUISITION_NOT_FOUND]"]
        distinguishing_aspect: "Reading a random UUID returns the acquisition-specific 404, not a generic error."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /acquisitions/00000000-0000-0000-0000-000000000000", payload: {}, as: AcquisitionsAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 404 with error_id == ERR_ACQUISITION_NOT_FOUND"

      - name: list_units_paginates_with_limit_offset
        claim_type: listing
        grounds: [entities.Unit, response_envelope]
        distinguishing_aspect: "Three units listed with limit=2 return total_count 3, has_more true, then offset=2 returns the final row with has_more false."
        test_recipe:
          setup: ["One acquisition with three units 1A, 2B, 3C"]
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "Paging Deal", address: "2 Main St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id } }
            - { call: "POST /acquisitions/units", payload: { acquisition_id: "${acq}", unit_number: "1A", floor_plan: "1BR", sqft: 700, market_rent_cents: 160000 }, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/units", payload: { acquisition_id: "${acq}", unit_number: "2B", floor_plan: "2BR", sqft: 900, market_rent_cents: 180000 }, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/units", payload: { acquisition_id: "${acq}", unit_number: "3C", floor_plan: "3BR", sqft: 1100, market_rent_cents: 200000 }, as: AcquisitionsAnalyst }
          trigger:
            - { call: "GET /acquisitions/units", payload: { acquisition_id: "${acq}", limit: 2, offset: 0 }, as: AcquisitionsAnalyst }
            - { call: "GET /acquisitions/units", payload: { acquisition_id: "${acq}", limit: 2, offset: 2 }, as: AcquisitionsAnalyst }
          assert:
            - "Page 1: exactly 2 rows, total_count == 3, has_more == true"
            - "Page 2: exactly 1 row, total_count == 3, has_more == false"
            - "Filtering by acquisition_id excludes units of other acquisitions"

      - name: create_unit_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Unit.fields.sqft, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting sqft (source: input, no default) fails with ERR_INVALID_REQUEST (400); optional-vs-required is enforced per field."
        test_recipe:
          setup: ["One acquisition exists"]
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "Req Deal", address: "3 Main St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id } }
          trigger:
            - { call: "POST /acquisitions/units", payload: { acquisition_id: "${acq}", unit_number: "1A", floor_plan: "1BR", market_rent_cents: 160000 }, as: AcquisitionsAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST (sqft missing)"

      - name: create_acquisition_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Acquisition.fields.interest_accrual_method, "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "interest_accrual_method: WEEKLY is outside {SIMPLE_ANNUAL, DAILY_ACCRUAL} and is rejected with ERR_INVALID_ENUM."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /acquisitions", payload: { property_name: "Enum Deal", address: "4 Main St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000, interest_accrual_method: "WEEKLY" }, as: AcquisitionsAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_ENUM"

      - name: supersede_retires_prior_lease
        claim_type: cross_reference
        grounds: [entities.LeaseFile.fields.supersedes_lease_id, state_machines.LeaseFile]
        distinguishing_aspect: "Uploading lease2 with supersedes_lease_id = lease1 moves lease1 to SUPERSEDED and leaves lease2 as the unit's current lease."
        test_recipe:
          setup: ["Acquisition IN_DILIGENCE; one unit with current lease1 (UPLOADED)"]
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "Sup Deal", address: "5 Main St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id } }
            - { call: "POST /acquisitions/${acq}/kickoff", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "POST /acquisitions/units", payload: { acquisition_id: "${acq}", unit_number: "1A", floor_plan: "1BR", sqft: 700, market_rent_cents: 160000 }, as: AcquisitionsAnalyst, captures: { unit: $.data.id } }
            - { call: "POST /acquisitions/lease-files", payload: { unit_id: "${unit}", resident_name: "R One", lease_start_date: "2025-09-01T00:00:00Z", lease_end_date: "2026-08-31T00:00:00Z", contract_rent_cents: 150000, term_months: 12, deposit_amount_cents: 150000 }, as: AcquisitionsAnalyst, captures: { lease1: $.data.id } }
          trigger:
            - { call: "POST /acquisitions/lease-files", payload: { unit_id: "${unit}", resident_name: "R One", lease_start_date: "2026-09-01T00:00:00Z", lease_end_date: "2027-08-31T00:00:00Z", contract_rent_cents: 152000, term_months: 12, deposit_amount_cents: 150000, supersedes_lease_id: "${lease1}" }, as: AcquisitionsAnalyst, captures: { lease2: $.data.id, st2: $.data.status } }
            - { call: "GET /acquisitions/lease-files/${lease1}", payload: {}, as: AcquisitionsAnalyst, captures: { st1: $.data.status } }
          assert:
            - "lease1 status == SUPERSEDED; lease2 status == UPLOADED"
            - "GET /acquisitions/units/${unit}/lease-files returns both, exactly one non-SUPERSEDED"

      - name: supersede_stale_target_rejected
        claim_type: violation_to_error
        grounds: [entities.LeaseFile.fields.supersedes_lease_id, "errors[ERR_SUPERSEDE_TARGET_NOT_CURRENT]"]
        distinguishing_aspect: "Superseding an already-SUPERSEDED lease is rejected with ERR_SUPERSEDE_TARGET_NOT_CURRENT — a plain state check, not a race."
        test_recipe:
          setup: ["Acquisition IN_DILIGENCE; unit with lease2 current after superseding lease1"]
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "Sup Two", address: "6 Main St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id } }
            - { call: "POST /acquisitions/${acq}/kickoff", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "POST /acquisitions/units", payload: { acquisition_id: "${acq}", unit_number: "1A", floor_plan: "1BR", sqft: 700, market_rent_cents: 160000 }, as: AcquisitionsAnalyst, captures: { unit: $.data.id } }
            - { call: "POST /acquisitions/lease-files", payload: { unit_id: "${unit}", resident_name: "R One", lease_start_date: "2025-09-01T00:00:00Z", lease_end_date: "2026-08-31T00:00:00Z", contract_rent_cents: 150000, term_months: 12, deposit_amount_cents: 150000 }, as: AcquisitionsAnalyst, captures: { lease1: $.data.id } }
            - { call: "POST /acquisitions/lease-files", payload: { unit_id: "${unit}", resident_name: "R One", lease_start_date: "2026-09-01T00:00:00Z", lease_end_date: "2027-08-31T00:00:00Z", contract_rent_cents: 152000, term_months: 12, deposit_amount_cents: 150000, supersedes_lease_id: "${lease1}" }, as: AcquisitionsAnalyst, captures: { lease2: $.data.id } }
          trigger:
            - { call: "POST /acquisitions/lease-files", payload: { unit_id: "${unit}", resident_name: "R One", lease_start_date: "2026-09-01T00:00:00Z", lease_end_date: "2027-08-31T00:00:00Z", contract_rent_cents: 153000, term_months: 12, deposit_amount_cents: 150000, supersedes_lease_id: "${lease1}" }, as: AcquisitionsAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409 with error_id == ERR_SUPERSEDE_TARGET_NOT_CURRENT (lease1 is already SUPERSEDED)"

      - name: duplicate_current_lease_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_ACTIVE_LEASE_EXISTS]"]
        distinguishing_aspect: "A unit with a current (non-SUPERSEDED) lease rejects a second upload that names no supersedes_lease_id."
        test_recipe:
          setup: ["Acquisition IN_DILIGENCE; unit with current lease1"]
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "Dup Lease", address: "7 Main St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id } }
            - { call: "POST /acquisitions/${acq}/kickoff", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "POST /acquisitions/units", payload: { acquisition_id: "${acq}", unit_number: "1A", floor_plan: "1BR", sqft: 700, market_rent_cents: 160000 }, as: AcquisitionsAnalyst, captures: { unit: $.data.id } }
            - { call: "POST /acquisitions/lease-files", payload: { unit_id: "${unit}", resident_name: "R One", lease_start_date: "2025-09-01T00:00:00Z", lease_end_date: "2027-08-31T00:00:00Z", contract_rent_cents: 150000, term_months: 12, deposit_amount_cents: 150000 }, as: AcquisitionsAnalyst, captures: { lease1: $.data.id } }
          trigger:
            - { call: "POST /acquisitions/lease-files", payload: { unit_id: "${unit}", resident_name: "R Two", lease_start_date: "2026-01-01T00:00:00Z", lease_end_date: "2027-12-31T00:00:00Z", contract_rent_cents: 155000, term_months: 24, deposit_amount_cents: 155000 }, as: AcquisitionsAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409 with error_id == ERR_ACTIVE_LEASE_EXISTS"

      - name: rent_roll_entry_carries_no_version_field
        claim_type: immutability
        grounds: [entities.RentRollEntry]
        distinguishing_aspect: "RentRollEntry is common_fields:false — its response carries id and created_at but no version or updated_at keys, and no update endpoint exists."
        test_recipe:
          setup: ["Acquisition with one unit"]
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "Imm Deal", address: "8 Main St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id } }
            - { call: "POST /acquisitions/units", payload: { acquisition_id: "${acq}", unit_number: "1A", floor_plan: "1BR", sqft: 700, market_rent_cents: 160000 }, as: AcquisitionsAnalyst, captures: { unit: $.data.id } }
          trigger:
            - { call: "POST /acquisitions/rent-roll-entries", payload: { unit_id: "${unit}", reported_resident_name: "R One", reported_rent_cents: 150000, reported_concession_cents: 0, reported_deposit_cents: 150000, move_in_date: "2025-09-01T00:00:00Z" }, as: AcquisitionsAnalyst, captures: { rr: $.data.id, vs: $.data.verification_status } }
          assert:
            - "Response contains id and created_at; it does NOT contain version or updated_at"
            - "verification_status == UNVERIFIED at creation"

      - name: excluded_unit_is_terminal_and_out_of_scope
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Unit, entities.Unit.fields.status]
        distinguishing_aspect: "An EXCLUDED unit rejects further transitions (second exclude -> ERR_INVALID_STATE_TRANSITION) and drops out of audit scope."
        test_recipe:
          setup: ["Acquisition IN_DILIGENCE with one REGISTERED unit"]
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "Excl Deal", address: "9 Main St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id } }
            - { call: "POST /acquisitions/${acq}/kickoff", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "POST /acquisitions/units", payload: { acquisition_id: "${acq}", unit_number: "1A", floor_plan: "1BR", sqft: 700, market_rent_cents: 160000 }, as: AcquisitionsAnalyst, captures: { unit: $.data.id } }
          trigger:
            - { call: "POST /acquisitions/units/${unit}/exclude", payload: {}, as: AcquisitionsAnalyst, captures: { st1: $.data.status } }
            - { call: "POST /acquisitions/units/${unit}/exclude", payload: {}, as: AcquisitionsAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "First exclude: status == EXCLUDED"
            - "Second exclude: HTTP 409 ERR_INVALID_STATE_TRANSITION (terminal lockdown)"

      - name: duplicate_unit_number_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_DUPLICATE_UNIT_NUMBER]"]
        distinguishing_aspect: "unit_number is unique within an acquisition; a duplicate is rejected while the same number in ANOTHER acquisition is fine."
        test_recipe:
          setup: ["Acquisition A with unit 1A; acquisition B empty"]
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "Dup A", address: "10 Main St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq_a: $.data.id } }
            - { call: "POST /acquisitions/units", payload: { acquisition_id: "${acq_a}", unit_number: "1A", floor_plan: "1BR", sqft: 700, market_rent_cents: 160000 }, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions", payload: { property_name: "Dup B", address: "11 Main St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq_b: $.data.id } }
          trigger:
            - { call: "POST /acquisitions/units", payload: { acquisition_id: "${acq_a}", unit_number: "1A", floor_plan: "1BR", sqft: 720, market_rent_cents: 161000 }, as: AcquisitionsAnalyst, captures: { err: $.data.error_id } }
            - { call: "POST /acquisitions/units", payload: { acquisition_id: "${acq_b}", unit_number: "1A", floor_plan: "1BR", sqft: 700, market_rent_cents: 160000 }, as: AcquisitionsAnalyst, captures: { ok_b: $.data.id } }
          assert:
            - "Duplicate within acquisition A: HTTP 409 ERR_DUPLICATE_UNIT_NUMBER"
            - "Same unit_number in acquisition B: 201 created (uniqueness is acquisition-scoped)"
  # ===================================================================
  # Section: state_machines
  # ===================================================================
  - section: state_machines
    instances:
      - name: lease_reflag_cycle_covered_by_difficulty
        claim_type: cyclic
        grounds: [state_machines.LeaseFile]
        excluded_because:
          difficulty_instance: lease_file_reflag_cycle
          rationale: "Cycle RESOLVED -> DISCREPANCY_FLAGGED -> RESOLVED asserted end-to-end in the named §1.8 instance."

      - name: inspection_qa_cycle_covered_by_difficulty
        claim_type: cyclic
        grounds: [state_machines.UnitWalkInspection]
        excluded_because:
          difficulty_instance: inspection_qa_reject_reschedule_cycle
          rationale: "QA rejection loop with reschedule_count asserted in §1.8."

      - name: adjustment_fork_join_paths
        claim_type: branching
        grounds: [state_machines.PostClosingAdjustment]
        excluded_because:
          difficulty_instance: adjustment_fork_join_divergent_amounts
          rationale: "Both fork branches and their divergent posted amounts asserted in §1.8."

      - name: qa_accept_from_scheduled_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.UnitWalkInspection, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "qa-accept is only valid from COMPLETED; from SCHEDULED it returns ERR_INVALID_STATE_TRANSITION and no cascade fires."
        test_recipe:
          setup: ["Acquisition with one unit and one SCHEDULED inspection"]
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "Inv T", address: "12 Main St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id } }
            - { call: "POST /acquisitions/units", payload: { acquisition_id: "${acq}", unit_number: "1A", floor_plan: "1BR", sqft: 700, market_rent_cents: 160000 }, as: AcquisitionsAnalyst, captures: { unit: $.data.id } }
            - { call: "POST /acquisitions/inspections", payload: { unit_id: "${unit}", inspector_ref: "insp-1", walk_start: "2026-08-10T09:00:00Z", walk_end: "2026-08-10T10:00:00Z" }, as: PropertyOperationsLead, captures: { insp: $.data.id } }
          trigger:
            - { call: "POST /acquisitions/inspections/${insp}/qa-accept", payload: {}, as: PropertyOperationsLead, as_user_id: "pol-2", captures: { err: $.data.error_id } }
            - { call: "GET /acquisitions/inspections/${insp}", payload: {}, as: PropertyOperationsLead, captures: { st: $.data.status } }
          assert:
            - "HTTP 409 ERR_INVALID_STATE_TRANSITION; inspection remains SCHEDULED"

      - name: rejected_employee_decision_is_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.EmployeeDecision, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "A REJECTED decision cannot be approved later — terminal lockdown."
        test_recipe:
          setup: ["Acquisition IN_DILIGENCE with one PROPOSED decision"]
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "Term ED", address: "13 Main St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id } }
            - { call: "POST /acquisitions/${acq}/kickoff", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "POST /acquisitions/employee-decisions", payload: { acquisition_id: "${acq}", employee_ref: "emp-9", position: "PORTER", hire_date: "2024-06-01T00:00:00Z", annual_salary_cents: 5200000, accrued_pto_hours: 10, decision: "TERMINATE", notice_date: "2026-08-10T00:00:00Z", effective_date: "2026-09-01T00:00:00Z" }, as: HRPartner, as_user_id: "hr-1", captures: { dec: $.data.id } }
            - { call: "POST /acquisitions/employee-decisions/${dec}/reject", payload: { reason: "keep staff" }, as: UnderwritingManager, as_user_id: "um-1" }
          trigger:
            - { call: "POST /acquisitions/employee-decisions/${dec}/approve", payload: {}, as: UnderwritingManager, as_user_id: "um-2", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409 ERR_INVALID_STATE_TRANSITION (REJECTED is terminal)"

      - name: lease_waive_moves_variance_out_of_open_exposure
        claim_type: valid_transition
        grounds: [state_machines.LeaseFile.DISCREPANCY_FLAGGED_to_WAIVED, entities.LeaseFile.fields.waived_variance_cents]
        distinguishing_aspect: "Waive (UnderwritingManager-only) preserves waived_variance_cents 2000 while the acquisition open variance returns to 0 and posture recovers to ON_TRACK."
        test_recipe:
          setup: ["Acquisition IN_DILIGENCE; lease (150000) auto-flagged by audit against rent roll 152000 (variance 2000)"]
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "Waive Deal", address: "14 Main St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id } }
            - { call: "POST /acquisitions/${acq}/kickoff", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "POST /acquisitions/units", payload: { acquisition_id: "${acq}", unit_number: "1A", floor_plan: "1BR", sqft: 700, market_rent_cents: 160000 }, as: AcquisitionsAnalyst, captures: { unit: $.data.id } }
