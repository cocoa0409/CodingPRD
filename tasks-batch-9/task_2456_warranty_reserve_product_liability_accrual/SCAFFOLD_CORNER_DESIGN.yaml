          setup:
            - "Two AccrualPeriods: 2025-Q4 (OPEN, carries the analog family's observation coding) and 2026-Q3 (the reporting period)."
            - "The canonical analog basis FAM-A with its 300-claim / 6000000-paid observation coded to 2025-Q4."
            - "ProductFamily FAM-RF (analog blend on FAM-A, engineering_estimate_rate_ppm 4000, standard_cost_per_claim_cents 30000, reserve_cap_cents 40000000) with V1 3000 units (accrual target) and V2 1200 units (carries 465600 of paid cost coded 2026-Q3)."
            - "The accrual is posted into 2026-Q3 and a field action over 500 units at per_unit 10700 is APPROVED, booking to 2026-Q3 because it is the greatest OPEN-or-ANALYSIS_LOCKED period_code."
