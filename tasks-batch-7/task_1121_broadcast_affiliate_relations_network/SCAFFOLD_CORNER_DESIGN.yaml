scaffold_corner_design:
  # ==========================================================================
  # Section: entities
  # ==========================================================================
  - section: entities
    instances:
      - name: network_creation_returns_201_with_required_fields
        claim_type: creation
        grounds: ["entities.Network", "endpoints.\"POST /networks\""]
        distinguishing_aspect: "POST /networks with all required fields returns 201 and the entity carries computed/system defaults (current_period_index=0, posture=NORMAL)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /networks"
              payload: { call_sign: "PBN", primary_feed_tz: "America/New_York", reverse_comp_standard_pct: 0.40, retrans_share_standard_pct: 0.60 }
              as: PlatformAdmin
              captures: { nid: $.data.id }
          trigger:
            - call: "GET /networks/${nid}"
              payload: {}
              as: PlatformAdmin
              captures: { posture: $.data.posture, period: $.data.current_period_index, version: $.data.version }
          assert:
            - "posture == NORMAL"
            - "period == 0"
            - "version == 1"

      - name: station_get_not_found_returns_404
        claim_type: not_found
        grounds: ["entities.Station", "endpoints.\"GET /networks/{nid}/stations/{sid}\"", "\"errors[ERR_NOT_FOUND\"]"]
        distinguishing_aspect: "GET with non-existent station UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Network N1 exists"]
          setup_api_calls:
            - call: "POST /networks"
              payload: { call_sign: "PBN", primary_feed_tz: "America/New_York", reverse_comp_standard_pct: 0.40, retrans_share_standard_pct: 0.60 }
              as: PlatformAdmin
              captures: { net_id: $.data.id }
          trigger:
            - call: "GET /networks/${net_id}/stations/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: agreement_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.AffiliationAgreement", "endpoints.\"POST /networks/{nid}/stations/{sid}/agreements\"", "\"errors[ERR_INVALID_REQUEST\"]"]
        distinguishing_aspect: "Missing reverse_comp_pct returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Network, StationGroup, Station exist"]
          setup_api_calls:
            - call: "POST /networks"
              payload: { call_sign: "PBN", primary_feed_tz: "America/New_York", reverse_comp_standard_pct: 0.40, retrans_share_standard_pct: 0.60 }
              as: PlatformAdmin
              captures: { net_id: $.data.id }
            - call: "POST /station-groups"
              payload: { group_name: "M", leverage_tier: "MID" }
              as: PlatformAdmin
              captures: { sg_id: $.data.id }
            - call: "POST /networks/${net_id}/stations"
              payload: { call_sign: "KPBN", dma_code: "DMA-001", station_group_id: "${sg_id}" }
              as: NetworkAffiliateRelations
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements"
              payload: { term_start_utc: "2026-01-01T00:00:00Z", term_end_utc: "2027-01-01T00:00:00Z", retrans_share_pct: 0.60, clearance_obligation_hours: 100 }
              as: NetworkAffiliateRelations
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: station_posture_computed_field_initial_value
        claim_type: computed_fields
        grounds: ["entities.Station.fields.posture", "calculations.station_posture_derivation"]
        distinguishing_aspect: "Newly created Station has posture == CLEARANCE_OK and monthly_outage_minutes_current_period == 0; client-provided posture input is ignored."
        test_recipe:
          setup: ["Network + StationGroup exist"]
          setup_api_calls:
            - call: "POST /networks"
              payload: { call_sign: "PBN", primary_feed_tz: "America/New_York", reverse_comp_standard_pct: 0.40, retrans_share_standard_pct: 0.60 }
              as: PlatformAdmin
              captures: { net_id: $.data.id }
            - call: "POST /station-groups"
              payload: { group_name: "M", leverage_tier: "MID" }
              as: PlatformAdmin
              captures: { sg_id: $.data.id }
          trigger:
            - call: "POST /networks/${net_id}/stations"
              payload: { call_sign: "KPBN", dma_code: "DMA-001", station_group_id: "${sg_id}" }
              as: NetworkAffiliateRelations
              captures: { posture: $.data.posture, minutes: $.data.monthly_outage_minutes_current_period }
          assert:
            - "posture == CLEARANCE_OK"
            - "minutes == 0"

      - name: station_group_aggregate_retrans_defaults_zero
        claim_type: defaults
        grounds: ["entities.StationGroup.fields.aggregate_retrans_cents"]
        distinguishing_aspect: "StationGroup.aggregate_retrans_cents defaults to 0 on creation."
        test_recipe:
          setup: []
          setup_api_calls:
            - call: "POST /station-groups"
              payload: { group_name: "M", leverage_tier: "MID" }
              as: PlatformAdmin
              captures: { sg_id: $.data.id, agg: $.data.aggregate_retrans_cents }
          trigger:
            - call: "GET /station-groups/${sg_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "agg == 0"

      - name: rate_sum_constraint_invalid_enum_term_length
        claim_type: type_constraints
        grounds: ["\"validations[priority=19\"]", "errors[ERR_INVALID_TERM_LENGTH]"]
        distinguishing_aspect: "proposed_term_months outside {12,24,36,48,60} is rejected with ERR_INVALID_TERM_LENGTH."
        test_recipe:
          setup: ["Network, StationGroup (MAJOR), Station, Territory, Agreement ACTIVE with term_end_utc within 180 days"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /networks"
              payload: { call_sign: "PBN", primary_feed_tz: "America/New_York", reverse_comp_standard_pct: 0.40, retrans_share_standard_pct: 0.60 }
              as: PlatformAdmin
              captures: { net_id: $.data.id }
            - call: "POST /station-groups"
              payload: { group_name: "M", leverage_tier: "MAJOR" }
              as: PlatformAdmin
              captures: { sg_id: $.data.id }
            - call: "POST /networks/${net_id}/stations"
              payload: { call_sign: "KPBN", dma_code: "DMA-001", station_group_id: "${sg_id}" }
              as: NetworkAffiliateRelations
              captures: { st_id: $.data.id }
            - call: "POST /networks/${net_id}/territories"
              payload: { dma_code: "DMA-001", protection_window_start_utc: "2026-05-01T00:00:00Z", protection_window_end_utc: "2026-06-30T00:00:00Z" }
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements"
              payload: { term_start_utc: "2025-01-01T00:00:00Z", term_end_utc: "2026-12-31T00:00:00Z", reverse_comp_pct: 0.40, retrans_share_pct: 0.60, clearance_obligation_hours: 100 }
              as: NetworkAffiliateRelations
              captures: { ag_id: $.data.id }
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/submit"
              payload: {}
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/activate"
              payload: {}
              as: NetworkAffiliateRelations
              captures: { ag_v: $.data.version }
          trigger:
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/renewal-offers"
              payload: { proposed_by_role: "NETWORK_AFFILIATE_RELATIONS", proposed_reverse_comp_pct: 0.45, proposed_retrans_share_pct: 0.55, proposed_term_months: 18, expected_agreement_version: "${ag_v}" }
              as: NetworkAffiliateRelations
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_TERM_LENGTH"

  # ==========================================================================
  # Section: state_machines
  # ==========================================================================
  - section: state_machines
    instances:
      - name: agreement_invalid_from_terminated_to_active
        claim_type: invalid_transition
        grounds: ["state_machines.AffiliationAgreement"]
        distinguishing_aspect: "TERMINATED is terminal — no transition out. Attempting activate on TERMINATED agreement returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Agreement TERMINATED on S1"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /networks"
              payload: { call_sign: "PBN", primary_feed_tz: "America/New_York", reverse_comp_standard_pct: 0.40, retrans_share_standard_pct: 0.60 }
              as: PlatformAdmin
              captures: { net_id: $.data.id }
            - call: "POST /station-groups"
              payload: { group_name: "M", leverage_tier: "MID" }
              as: PlatformAdmin
              captures: { sg_id: $.data.id }
            - call: "POST /networks/${net_id}/stations"
              payload: { call_sign: "KPBN", dma_code: "DMA-001", station_group_id: "${sg_id}" }
              as: NetworkAffiliateRelations
              captures: { st_id: $.data.id }
            - call: "POST /networks/${net_id}/territories"
              payload: { dma_code: "DMA-001", protection_window_start_utc: "2026-05-01T00:00:00Z", protection_window_end_utc: "2026-06-30T00:00:00Z" }
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements"
              payload: { term_start_utc: "2026-01-01T00:00:00Z", term_end_utc: "2027-01-01T00:00:00Z", reverse_comp_pct: 0.40, retrans_share_pct: 0.60, clearance_obligation_hours: 100 }
              as: NetworkAffiliateRelations
              captures: { ag_id: $.data.id }
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/submit"
              payload: {}
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/activate"
              payload: {}
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/terminate"
              payload: {}
              as: NetworkAffiliateRelations
          trigger:
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/activate"
              payload: {}
              as: NetworkAffiliateRelations
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: clearance_report_audit_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.ClearanceReport.FILED_to_AUDITED"]
        distinguishing_aspect: "Audit can only fire from FILED; calling audit on a DRAFT report returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Network, StationGroup, Station, Agreement ACTIVE, ClearanceReport CR1 in DRAFT"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /networks"
              payload: { call_sign: "PBN", primary_feed_tz: "America/New_York", reverse_comp_standard_pct: 0.40, retrans_share_standard_pct: 0.60 }
              as: PlatformAdmin
              captures: { net_id: $.data.id }
            - call: "POST /station-groups"
              payload: { group_name: "M", leverage_tier: "MID" }
              as: PlatformAdmin
              captures: { sg_id: $.data.id }
            - call: "POST /networks/${net_id}/stations"
              payload: { call_sign: "KPBN", dma_code: "DMA-001", station_group_id: "${sg_id}" }
              as: NetworkAffiliateRelations
              captures: { st_id: $.data.id }
            - call: "POST /networks/${net_id}/territories"
              payload: { dma_code: "DMA-001", protection_window_start_utc: "2026-05-01T00:00:00Z", protection_window_end_utc: "2026-06-30T00:00:00Z" }
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements"
              payload: { term_start_utc: "2026-01-01T00:00:00Z", term_end_utc: "2027-01-01T00:00:00Z", reverse_comp_pct: 0.40, retrans_share_pct: 0.60, clearance_obligation_hours: 100 }
              as: NetworkAffiliateRelations
              captures: { ag_id: $.data.id }
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/submit"
              payload: {}
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/activate"
              payload: {}
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/clearance-reports"
              payload: { period_index: 0, cleared_hours: 90.0, preempted_hours: 10.0 }
              as: StationGroupOwner
              as_user_id: "${sg_id}"
              captures: { cr_id: $.data.id }
          trigger:
            - call: "POST /networks/${net_id}/stations/${st_id}/clearance-reports/${cr_id}/audit"
              payload: {}
              as: NetworkAffiliateRelations
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: clearance_resolve_cleared_requires_rate_threshold
        claim_type: precondition_enforcement
        grounds: ["state_machines.ClearanceReport.AUDITED_to_CLEARED", "calculations.clearance_rate_calc", "\"errors[ERR_DEFICIENT_CLEARANCE\"]"]
        distinguishing_aspect: "resolve-cleared rejected when clearance_rate < 0.85 with ERR_DEFICIENT_CLEARANCE."
        test_recipe:
          setup: ["ClearanceReport AUDITED with rate below threshold"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /networks"
              payload: { call_sign: "PBN", primary_feed_tz: "America/New_York", reverse_comp_standard_pct: 0.40, retrans_share_standard_pct: 0.60 }
              as: PlatformAdmin
              captures: { net_id: $.data.id }
            - call: "POST /station-groups"
              payload: { group_name: "M", leverage_tier: "MID" }
              as: PlatformAdmin
              captures: { sg_id: $.data.id }
            - call: "POST /networks/${net_id}/stations"
              payload: { call_sign: "KPBN", dma_code: "DMA-001", station_group_id: "${sg_id}" }
              as: NetworkAffiliateRelations
              captures: { st_id: $.data.id }
            - call: "POST /networks/${net_id}/territories"
              payload: { dma_code: "DMA-001", protection_window_start_utc: "2026-05-01T00:00:00Z", protection_window_end_utc: "2026-06-30T00:00:00Z" }
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements"
              payload: { term_start_utc: "2026-01-01T00:00:00Z", term_end_utc: "2027-01-01T00:00:00Z", reverse_comp_pct: 0.40, retrans_share_pct: 0.60, clearance_obligation_hours: 100 }
              as: NetworkAffiliateRelations
              captures: { ag_id: $.data.id }
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/submit"
              payload: {}
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/activate"
              payload: {}
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/clearance-reports"
              payload: { period_index: 0, cleared_hours: 50.0, preempted_hours: 50.0 }
              as: StationGroupOwner
              as_user_id: "${sg_id}"
              captures: { cr_id: $.data.id }
            - call: "POST /networks/${net_id}/stations/${st_id}/clearance-reports/${cr_id}/file"
              payload: {}
              as: StationGroupOwner
              as_user_id: "${sg_id}"
            - call: "POST /networks/${net_id}/stations/${st_id}/clearance-reports/${cr_id}/audit"
              payload: {}
              as: NetworkAffiliateRelations
          trigger:
            - call: "POST /networks/${net_id}/stations/${st_id}/clearance-reports/${cr_id}/resolve-cleared"
              payload: {}
              as: NetworkAffiliateRelations
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DEFICIENT_CLEARANCE  # rate=0.5 < 0.85"

      - name: avail_allocation_revoke_cascade_only_affects_non_terminal
        claim_type: side_effect_execution
        grounds: ["state_machines.AffiliationAgreement.ACTIVE_to_TERMINATED", "state_machines.AvailAllocation"]
        distinguishing_aspect: "Termination cascade revokes CLAIMED|CONFIRMED AvailAllocations but leaves already-REVOKED ones untouched (conditional cascade)."
        test_recipe:
          setup: ["Agreement ACTIVE; AA1 CONFIRMED; AA2 already REVOKED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /networks"
              payload: { call_sign: "PBN", primary_feed_tz: "America/New_York", reverse_comp_standard_pct: 0.40, retrans_share_standard_pct: 0.60 }
              as: PlatformAdmin
              captures: { net_id: $.data.id }
            - call: "POST /station-groups"
              payload: { group_name: "M", leverage_tier: "MID" }
              as: PlatformAdmin
              captures: { sg_id: $.data.id }
            - call: "POST /networks/${net_id}/stations"
              payload: { call_sign: "KPBN", dma_code: "DMA-001", station_group_id: "${sg_id}" }
              as: NetworkAffiliateRelations
              captures: { st_id: $.data.id }
            - call: "POST /networks/${net_id}/territories"
              payload: { dma_code: "DMA-001", protection_window_start_utc: "2026-05-01T00:00:00Z", protection_window_end_utc: "2026-06-30T00:00:00Z" }
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/programs"
              payload: { title: "S", scheduled_start_utc: "2026-06-01T20:00:00Z", scheduled_end_utc: "2026-06-01T21:00:00Z", avail_minutes_total: 20, avail_minutes_local_allocatable: 10, is_syndicated: false }
              as: NetworkAffiliateRelations
              captures: { prog_id: $.data.id }
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements"
              payload: { term_start_utc: "2026-01-01T00:00:00Z", term_end_utc: "2027-01-01T00:00:00Z", reverse_comp_pct: 0.40, retrans_share_pct: 0.60, clearance_obligation_hours: 100 }
              as: NetworkAffiliateRelations
              captures: { ag_id: $.data.id }
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/submit"
              payload: {}
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/activate"
              payload: {}
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/avail-allocations"
              payload: { program_id: "${prog_id}", period_index: 0, local_minutes_claimed: 2, claimed_revenue_cents: 100 }
              as: StationGroupOwner
              as_user_id: "${sg_id}"
              captures: { aa1: $.data.id }
            - call: "POST /networks/${net_id}/stations/${st_id}/avail-allocations"
              payload: { program_id: "${prog_id}", period_index: 0, local_minutes_claimed: 3, claimed_revenue_cents: 100 }
              as: StationGroupOwner
              as_user_id: "${sg_id}"
              captures: { aa2: $.data.id }
            - call: "POST /networks/${net_id}/stations/${st_id}/avail-allocations/${aa2}/revoke"
              payload: {}
              as: NetworkAffiliateRelations
          trigger:
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/terminate"
              payload: {}
              as: NetworkAffiliateRelations
            - call: "GET /networks/${net_id}/stations/${st_id}/avail-allocations/${aa1}"
              payload: {}
              as: NetworkAffiliateRelations
              captures: { aa1_status: $.data.status }
            - call: "GET /networks/${net_id}/stations/${st_id}/avail-allocations/${aa2}"
              payload: {}
              as: NetworkAffiliateRelations
              captures: { aa2_status: $.data.status }
          assert:
            - "aa1_status == REVOKED"
            - "aa2_status == REVOKED  # unchanged, already terminal"

      - name: renewal_withdraw_sod_proposer_only
        claim_type: precondition_enforcement
        grounds: ["state_machines.RenewalOffer.PROPOSED_to_WITHDRAWN", "\"validations[priority=6\"]", "errors[ERR_SOD_VIOLATION]"]
        distinguishing_aspect: "Only the proposing role may withdraw; counterparty attempting withdraw yields ERR_SOD_VIOLATION."
        test_recipe:
          setup: ["RenewalOffer O1 PROPOSED by NETWORK_AFFILIATE_RELATIONS"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /networks"
              payload: { call_sign: "PBN", primary_feed_tz: "America/New_York", reverse_comp_standard_pct: 0.40, retrans_share_standard_pct: 0.60 }
              as: PlatformAdmin
              captures: { net_id: $.data.id }
            - call: "POST /station-groups"
              payload: { group_name: "M", leverage_tier: "MAJOR" }
              as: PlatformAdmin
              captures: { sg_id: $.data.id }
            - call: "POST /networks/${net_id}/stations"
              payload: { call_sign: "KPBN", dma_code: "DMA-001", station_group_id: "${sg_id}" }
              as: NetworkAffiliateRelations
              captures: { st_id: $.data.id }
            - call: "POST /networks/${net_id}/territories"
              payload: { dma_code: "DMA-001", protection_window_start_utc: "2026-05-01T00:00:00Z", protection_window_end_utc: "2026-06-30T00:00:00Z" }
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements"
              payload: { term_start_utc: "2025-01-01T00:00:00Z", term_end_utc: "2026-12-31T00:00:00Z", reverse_comp_pct: 0.40, retrans_share_pct: 0.60, clearance_obligation_hours: 100 }
              as: NetworkAffiliateRelations
              captures: { ag_id: $.data.id }
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/submit"
              payload: {}
              as: NetworkAffiliateRelations
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/activate"
              payload: {}
              as: NetworkAffiliateRelations
              captures: { ag_v: $.data.version }
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/renewal-offers"
              payload: { proposed_by_role: "NETWORK_AFFILIATE_RELATIONS", proposed_reverse_comp_pct: 0.45, proposed_retrans_share_pct: 0.55, proposed_term_months: 24, expected_agreement_version: "${ag_v}" }
              as: NetworkAffiliateRelations
              captures: { offer_id: $.data.id }
          trigger:
            - call: "POST /networks/${net_id}/stations/${st_id}/agreements/${ag_id}/renewal-offers/${offer_id}/withdraw"
              payload: {}
              as: StationGroupOwner
              as_user_id: "${sg_id}"
              captures: { err: $.data.error_id }
          assert:
