      - name: appointment_temporal_vs_constraint_priority
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - calculations.appointment_window
          - calculations.auditor_calendar_overlap
        distinguishing_aspect: |
          Error-category pair business_temporal vs business_constraint: one appointment creation violates both the
          60-day audit window (work order WC-1100B window ended 2026-07-30) and the auditor's calendar (overlaps an
          appointment on WC-1100A); the response must be ERR_APPOINTMENT_OUTSIDE_WINDOW (priority 9), not
