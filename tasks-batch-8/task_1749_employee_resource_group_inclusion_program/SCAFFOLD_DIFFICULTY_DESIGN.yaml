      - name: event_impact_points_tiered_cap
        grounds:
          - calculations.event_impact_points
          - entities.ErgEvent.fields.impact_points
        distinguishing_aspect: |
          Mode (a) non-linear interaction of >=3 inputs: RECRUITING base 80 x tier 1.5
          (utilization 80.00 >= 75) + sponsor bonus 10 = 130, then min-cap 100 — tier
          branch, additive bonus, and cap all engage; an uncapped reading yields 130.
        test_recipe:
