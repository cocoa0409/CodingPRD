        as_user_id: ops-recorder-V2
        captures:
          v2_t_order: $.data.id
      - call: POST /dropship/vendors/${v2_id}/integration-tests
        payload:
          message_type: SHIP_CONFIRM
          sample_payload_digest: sha256-V2-ship_confirm
        as: VendorOpsAnalyst
        as_user_id: ops-recorder-V2
        captures:
          v2_t_ship_confirm: $.data.id
      - call: POST /dropship/integration-tests/${v2_t_catalog}/evaluate
        payload:
          outcome: PASS
          reported_error_count: 0
        as: VendorOpsAnalyst
        as_user_id: ops-evaluator-V2
      - call: POST /dropship/integration-tests/${v2_t_inventory}/evaluate
        payload:
          outcome: PASS
