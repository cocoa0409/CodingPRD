scenario: "928. Daily Money Management & Bill-Pay Fiduciary: client intake & authorization, bill-pay & account monitoring, budget & benefit application, bookkeeping & statement reconciliation, fraud/scam alert, bonded/insured & audit trail, family reporting, care-team coordination"
domain_name: "daily-money-management-fiduciary"
api_prefix: "/dmm"

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Ledger reconciliation"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

  notes: |
    Four independent write gates compose on top of ordinary per-request validation:
    the organization-level surety-bond gate, the client-level authorization
    instrument, the account-level fraud freeze, and the period-level
    reconciliation freeze. Their relative precedence is pinned explicitly in
    §1.4 (priorities 6, 7, 8, 9, 10) and restated in `gate_precedence:` below so
    that no downstream reader has to guess which refusal wins.

gate_precedence:
  order:
    - "G1 bond_gate            (priority 6)  — ERR_BOND_EXPIRED"
    - "G2a authorization_gate  (priority 7)  — ERR_AUTHORIZATION_INACTIVE"
    - "G2b authorization_scope (priority 8)  — ERR_SCOPE_NOT_PERMITTED"
    - "G3 account_fraud_freeze (priority 9)  — ERR_ACCOUNT_FROZEN"
    - "G4 period_freeze        (priority 10) — ERR_PERIOD_FROZEN"
    - "G5 ordinary per-request rungs (priority 11 and later)"
  rationale: |
    Widest blast radius first. G1 refuses for the whole organization (an
    unbonded fiduciary may lawfully disburse nothing), G2 refuses for one
    client (the instrument that grants agency is gone), G3 refuses for one
    account (confirmed fraud), G4 refuses for one account-month (the books are
    closed), and only then does the request's own validity get evaluated.
    Every gate above is evaluated AFTER authentication (1), authorization by
    role (2), existence (3), request-shape (4) and enum-membership (5), because
    a caller who is not authenticated or names a non-existent resource must not
    learn anything about the organization's bond or a client's freeze state.
  period_freeze_exclusions:
    description: |
      Operations that remain permitted while a ReconciliationPeriod is CLOSED
      or LOCKED. G4 (priority 10) applies ONLY to endpoints listed in its
      `applies_to:`; every operation below is deliberately outside that list.
    permitted_while_frozen:
      - "GET /dmm/clients/{id}/audit-entries (audit-trail read)"
      - "GET on every entity (all reads)"
      - "POST /dmm/fraud-alerts (raising an alert)"
      - "POST /dmm/fraud-alerts/{id}/disposition (acknowledge / confirm / dismiss)"
      - "POST /dmm/accounts/{id}/fraud-posture (freeze / unfreeze)"
      - "POST /dmm/authorizations/{id}/status (execute / revoke)"
      - "POST /dmm/coordination-requests and its disposition endpoint"
      - "POST /dmm/family-reports (report generation is a read-projection)"
      - "POST /dmm/reconciliation-periods/{id}/status (the reopen path itself)"
      - "POST /dmm/benefit-applications/{id}/record-decision (retro award; see calculations.retroactive_award_posting for how it avoids writing into the frozen period)"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

audit_trail:
  description: |
    Every endpoint whose method is POST appends exactly one AuditEntry, whether
    the request succeeded or was rejected. AuditEntry rows are append-only: no
    endpoint updates or deletes them, and the entity carries
    `common_fields: false` so it has no `version` and no update path. The
    append happens after the request's outcome is known, so a rejected request
    yields an AuditEntry with `outcome: REJECTED` and the returned `error_id`.
    Cascaded side effects do NOT append additional AuditEntry rows — one
    request, one entry, whose `subject_entity` / `subject_id` name the primary
    resource the request targeted.
  applies_to: "every POST endpoint in §1.5, including /_clock/set_current_utc and /dmm/ops/checkpoint"
  never: "AuditEntry is never mutated; the reconciliation freeze does not apply to it"

# ---------------------------------------------------------------------------
# Declared constants — every named constant used anywhere in this scaffold has
# an explicit value here. Nothing else in the file introduces a bare
# constant-looking identifier without a value.
# ---------------------------------------------------------------------------
global_constants:
  # --- logical clock -------------------------------------------------------
  DEFAULT_CLOCK_UTC: "2026-05-01T00:00:00Z"

  # --- settlement channel lead times & cut-off ------------------------------
  SAME_DAY_CUTOFF_UTC: "16:00:00"          # boundary INCLUSIVE: a request whose
                                           # logical time-of-day is >= 16:00:00
                                           # rolls to the next calendar day
  BUSINESS_DAY_WEEKDAYS: [1, 2, 3, 4, 5]   # ISO weekday numbers, 1=Monday
  HOLIDAY_CALENDAR: []                      # deliberately empty: no holidays observed
  LEAD_DAYS_CHECK: 5
  LEAD_DAYS_ACH: 2
  LEAD_DAYS_BILLER_DIRECT: 0

  # --- segregation of duties -----------------------------------------------
  SECOND_APPROVAL_THRESHOLD_CENTS: 100000  # boundary INCLUSIVE: amount_cents
                                           # >= 100000 needs a second approver

  # --- fiduciary service fee (tiered on amount_cents, pre-fee) --------------
  SERVICE_FEE_TIER1_UPPER_EXCLUSIVE_CENTS: 50000
  SERVICE_FEE_TIER2_UPPER_EXCLUSIVE_CENTS: 250000
  SERVICE_FEE_TIER1_CENTS: 250
  SERVICE_FEE_TIER2_CENTS: 500
  SERVICE_FEE_TIER3_CENTS: 900

  # --- payment lifecycle windows & fees ------------------------------------
  STOP_PAYMENT_WINDOW_HOURS: 48            # boundary INCLUSIVE: a stop request at
                                           # exactly created_at + 48h is allowed
  STOP_PAYMENT_FEE_CENTS: 3000
  NSF_FEE_CENTS: 3500
  DUPLICATE_PAYMENT_BUFFER_DAYS: 3         # boundary INCLUSIVE: |delta| <= 3 collides

  # --- authorization --------------------------------------------------------
  AUTHORIZATION_MAX_TERM_DAYS: 730         # boundary INCLUSIVE: exactly 730 passes
  LIMITED_SCOPE_MAX_PAYMENT_CENTS: 250000  # boundary INCLUSIVE: exactly 250000 passes
  REP_PAYEE_MAX_PAYMENT_CENTS: 400000      # boundary INCLUSIVE: exactly 400000 passes

  # --- budget ---------------------------------------------------------------
  BUDGET_OVERRIDE_REASON_MIN_CHARS: 20     # boundary INCLUSIVE: exactly 20 passes
  FRAUD_UNFREEZE_REASON_MIN_CHARS: 20      # boundary INCLUSIVE: exactly 20 passes

  # --- fraud alert scoring & SLA -------------------------------------------
  FRAUD_AMOUNT_HIGH_CENTS: 500000          # boundary INCLUSIVE: >= scores 50
  FRAUD_AMOUNT_MID_CENTS: 100000           # boundary INCLUSIVE: >= scores 30
  FRAUD_AMOUNT_POINTS_HIGH: 50
  FRAUD_AMOUNT_POINTS_MID: 30
  FRAUD_AMOUNT_POINTS_LOW: 10
  FRAUD_NOVELTY_POINTS_NEVER_PAID: 40      # payee.settled_payment_count == 0
  FRAUD_NOVELTY_SETTLED_COUNT_THIN_MAX: 2  # boundary INCLUSIVE: <= 2 scores 20
  FRAUD_NOVELTY_POINTS_THIN: 20
  FRAUD_NOVELTY_POINTS_ESTABLISHED: 0
  FRAUD_CHANNEL_POINTS_CHECK: 20
  FRAUD_CHANNEL_POINTS_ACH: 10
  FRAUD_CHANNEL_POINTS_BILLER_DIRECT: 0
  FRAUD_BAND_HIGH_MIN_SCORE: 90            # boundary INCLUSIVE
  FRAUD_BAND_MEDIUM_MIN_SCORE: 50          # boundary INCLUSIVE
  FRAUD_ACK_SLA_HOURS_HIGH: 4
  FRAUD_ACK_SLA_HOURS_MEDIUM: 24
  FRAUD_ACK_SLA_HOURS_LOW: 72

  # --- dispute --------------------------------------------------------------
  DISPUTE_FILING_WINDOW_DAYS: 60           # boundary INCLUSIVE: day 60 still files
  DISPUTE_PROVISIONAL_CREDIT_MAX_CENTS: 500000  # boundary INCLUSIVE: exactly 500000 credits

  # --- reconciliation -------------------------------------------------------
  PERIOD_REOPEN_WINDOW_DAYS: 30            # boundary INCLUSIVE: day 30 still reopens
  PERIOD_REOPEN_MAX_COUNT: 1

  # --- benefits -------------------------------------------------------------
  BENEFIT_APPEAL_MAX_COUNT: 1
  RETRO_AWARD_MAX_LOOKBACK_DAYS: 180       # boundary INCLUSIVE: exactly 180 passes
  BURIAL_EXCLUSION_CAP_CENTS: 150000
  RETIREMENT_COUNTABLE_RATE: 0.665
  LIFE_INSURANCE_COUNTABLE_RATE: 0.500
  PROGRAM_RESOURCE_LIMIT_CENTS_SSI: 200000
  PROGRAM_RESOURCE_LIMIT_CENTS_MEDICAID: 300000
  PROGRAM_RESOURCE_LIMIT_CENTS_SNAP: 275000
  PROGRAM_RESOURCE_LIMIT_CENTS_LIHEAP: 400000
  PROGRAM_INCOME_LIMIT_CENTS_SSI: 96700
  PROGRAM_INCOME_LIMIT_CENTS_MEDICAID: 150000
  PROGRAM_INCOME_LIMIT_CENTS_SNAP: 182000
  PROGRAM_INCOME_LIMIT_CENTS_LIHEAP: 250000

  # --- care-team coordination ----------------------------------------------
  COORD_ACK_SLA_HOURS_URGENT: 2
  COORD_ACK_SLA_HOURS_ROUTINE: 48
  COORD_ACK_SLA_HOURS_INFORMATIONAL: 120
  COORD_REROUTE_MAX_COUNT: 2               # the 3rd decline is refused

  # --- rounding -------------------------------------------------------------
  ROUNDING_MODE: "round_half_up"
  MONEY_UNIT: "integer cents; no fractional cents are ever stored or returned"

# ===========================================================================
# §1.1 Entity-Relationship Table
# ===========================================================================
entities:

  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Legal name of the person under daily-money-management service."
      - name: date_of_birth
        type: string
        source: input
        description: "ISO 8601 calendar date, YYYY-MM-DD."
      - name: intake_reference
        type: string
        source: input
        description: "Referral/intake reference recorded at onboarding."
      - name: status
        type: enum
        source: system
        description: "Client lifecycle state; see state_machines.Client."
        default: "INTAKE"
        constraints: "one of INTAKE, ACTIVE, SUSPENDED, CLOSED"
      - name: capacity_determination
        type: enum
        source: system
        description: "Decisional-capacity finding; gates who may set family disclosure restrictions."
        default: "NOT_DETERMINED"
        constraints: "one of NOT_DETERMINED, RETAINS_CAPACITY, DIMINISHED_CAPACITY, LACKS_CAPACITY"
      - name: capacity_determined_on
        type: string
        source: system
        description: "ISO 8601 date the capacity_determination was recorded; null while NOT_DETERMINED."
      - name: activated_on
        type: string
        source: system
        description: "ISO 8601 date of the INTAKE -> ACTIVE transition; null before it."
      - name: closed_on
        type: string
        source: system
        description: "ISO 8601 date of the transition into CLOSED; null before it."

  - name: Authorization
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client whose agency this instrument grants."
      - name: scope_tier
        type: enum
        source: input
        description: "Which operations this instrument permits; see calculations.authorization_scope_matrix."
        constraints: "one of LIMITED_BILLPAY, FULL_AGENCY, REP_PAYEE"
      - name: instrument_reference
        type: string
        source: input
        description: "Document reference of the signed agreement or appointment order."
      - name: effective_date
        type: string
        source: input
        description: "ISO 8601 date; the instrument is in force from this date inclusive."
      - name: expiry_date
        type: string
        source: input
        description: "ISO 8601 date; the instrument is in force through this date INCLUSIVE and lapses the following day."
      - name: status
        type: enum
        source: system
        description: "Instrument lifecycle; see state_machines.Authorization."
        default: "DRAFT"
        constraints: "one of DRAFT, ACTIVE, EXPIRED, REVOKED, SUPERSEDED"
      - name: executed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the DRAFT -> ACTIVE transition; null while DRAFT."
      - name: revoked_at
        type: datetime
        source: system
        description: "Logical-clock instant of the ACTIVE -> REVOKED transition; null otherwise."
      - name: revocation_reason
        type: string
        source: input
        description: "Free text supplied on revocation; null otherwise."
      - name: cascaded_payments_cancelled
        type: integer
        source: computed
        description: "Count of Payment rows this instrument's revocation moved SCHEDULED -> CANCELLED."
        default: 0
      - name: cascaded_recipients_terminated
        type: integer
        source: computed
        description: "Count of FamilyRecipient rows this instrument's revocation moved to TERMINATED."
        default: 0
      - name: cascaded_applications_withdrawn
        type: integer
        source: computed
        description: "Count of BenefitApplication rows this instrument's revocation moved to WITHDRAWN."
        default: 0

  - name: ClientAccount
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; owner of the funds."
      - name: institution_name
        type: string
        source: input
        description: "Name of the financial institution holding the account."
      - name: account_label
        type: string
        source: input
        description: "Human label distinguishing this account from the client's others."
      - name: account_type
        type: enum
        source: input
        description: "Account category."
        constraints: "one of CHECKING, SAVINGS, REP_PAYEE_TRUST"
      - name: opening_balance_cents
        type: integer
        source: input
        description: "Integer cents on the books when the account was placed under management; must be >= 0."
      - name: cleared_balance_cents
        type: integer
        source: computed
        description: "opening_balance_cents plus the signed sum of every LedgerEntry.amount_cents for this account."
      - name: pending_holds_cents
        type: integer
        source: computed
        description: "Sum of outstanding withdrawal holds placed via the adjustments endpoint; never negative."
        default: 0
      - name: committed_disbursements_cents
        type: integer
        source: computed
        description: "Sum of Payment.total_charge_cents over this account's payments whose settlement_status is in SCHEDULED or IN_FLIGHT."
        default: 0
      - name: available_balance_cents
        type: integer
        source: computed
        description: "cleared_balance_cents - pending_holds_cents - committed_disbursements_cents; may be negative."
      - name: fraud_posture
        type: enum
        source: system
        description: "Account-level outbound-payment gate; see state_machines.ClientAccount."
        default: "NORMAL"
        constraints: "one of NORMAL, WATCH, FROZEN"
      - name: fraud_posture_reason
        type: string
        source: input
        description: "Reason recorded on the most recent fraud_posture change; null before the first change."

  - name: Payee
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client this payee is authorized for."
      - name: payee_name
        type: string
        source: input
        description: "Name of the biller, vendor, or individual to be paid."
      - name: payee_type
        type: enum
        source: input
        description: "Category used by the authorization scope matrix."
        constraints: "one of RECURRING_BILLER, ESSENTIAL, DISCRETIONARY"
      - name: remittance_reference
        type: string
        source: input
        description: "Account or invoice number the fiduciary quotes when remitting."
      - name: status
        type: enum
        source: system
        description: "ACTIVE payees may receive payments; BLOCKED payees may not."
        default: "ACTIVE"
        constraints: "one of ACTIVE, BLOCKED"
      - name: blocked_reason
        type: string
        source: input
        description: "Reason recorded when a compliance officer blocks the payee; null while ACTIVE."
      - name: settled_payment_count
        type: integer
        source: computed
        description: "Count of Payment rows for this payee whose settlement_status is SETTLED; drives fraud novelty scoring."
        default: 0

  - name: BudgetCategory
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client whose monthly budget this line belongs to."
      - name: category_name
        type: string
        source: input
        description: "Budget line name, e.g. UTILITIES or GROCERIES; unique per client per budget_month."
      - name: budget_month
        type: string
        source: input
        description: "Calendar month this allocation governs, formatted YYYY-MM."
      - name: allocation_cents
        type: integer
        source: input
        description: "Integer cents allocated to this line for budget_month; must be > 0."
      - name: override_granted_cents
        type: integer
        source: computed
        description: "Cumulative additional cents granted by overrides on this line."
        default: 0
      - name: override_count
        type: integer
        source: computed
        description: "Number of overrides granted on this line."
        default: 0
      - name: last_override_reason
        type: string
        source: input
        description: "Reason text of the most recent override; null before the first override."
      - name: committed_cents
        type: integer
        source: computed
        description: "Sum of Payment.amount_cents (principal only, service fee excluded) over payments on this line whose settlement_status is in SCHEDULED, IN_FLIGHT, SETTLED."
        default: 0
      - name: settled_cents
        type: integer
        source: computed
        description: "Sum of Payment.amount_cents over payments on this line whose settlement_status is SETTLED."
        default: 0
      - name: remaining_cents
        type: integer
        source: computed
        description: "allocation_cents + override_granted_cents - committed_cents; never negative, because priority 36 refuses any payment that would drive it below zero."
      - name: variance_full_cents
        type: integer
        source: computed
        description: "Full-period variant of calculations.budget_variance."
      - name: variance_ptd_cents
        type: integer
        source: computed
        description: "Period-to-date variant of calculations.budget_variance."
      - name: variance_direction
        type: enum
        source: computed
        description: "Sign of variance_ptd_cents (NOT of variance_full_cents, which can never be negative)."
        constraints: "one of UNDER, EXACT, OVER"

  - name: SuretyBond
    parent: null
    common_fields: true
    fields:
      - name: carrier_name
        type: string
        source: input
        description: "Surety carrier that issued the bond."
      - name: bond_number
        type: string
        source: input
        description: "Carrier-issued bond number."
      - name: coverage_cents
        type: integer
        source: input
        description: "Aggregate coverage ceiling in integer cents; must be > 0."
      - name: effective_date
        type: string
        source: input
        description: "ISO 8601 date the bond attaches, inclusive."
      - name: expiry_date
        type: string
        source: input
        description: "ISO 8601 date the bond expires; the bond is in force through this date INCLUSIVE."
      - name: status
        type: enum
        source: system
        description: "IN_FORCE bonds gate disbursement; a newly created bond supersedes the previous one."
        default: "IN_FORCE"
        constraints: "one of IN_FORCE, SUPERSEDED"
      - name: exposure_committed_cents
        type: integer
        source: computed
        description: "Committed-basis variant of calculations.bond_exposure."
        default: 0
      - name: exposure_settled_inclusive_cents
        type: integer
        source: computed
        description: "Settled-inclusive variant of calculations.bond_exposure."
        default: 0
      - name: headroom_committed_cents
        type: integer
        source: computed
        description: "coverage_cents - exposure_committed_cents; may be negative only if coverage was lowered after exposure accrued."

  - name: Payment
    parent: ClientAccount
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> ClientAccount.id; the account the funds leave."
      - name: payee_id
        type: string
        source: input
        description: "FK -> Payee.id; the recipient of the disbursement."
      - name: authorization_id
        type: string
        source: input
        description: "FK -> Authorization.id; the instrument under whose authority this payment is made."
      - name: budget_category_id
        type: string
        source: input
        description: "FK -> BudgetCategory.id; the budget line this disbursement consumes."
      - name: amount_cents
        type: integer
        source: input
        description: "Principal paid to the payee, in integer cents; must be > 0."
      - name: channel
        type: enum
        source: input
        description: "Settlement rail; drives lead time and fraud channel points."
        constraints: "one of CHECK, ACH, BILLER_DIRECT"
      - name: memo
        type: string
        source: input
        description: "Optional remittance memo."
      - name: requested_send_date
        type: string
        source: input
        description: "ISO 8601 date the preparer wants the payment to leave; defaults to the current logical date."
      - name: duplicate_override
        type: boolean
        source: input
        description: "When true, the duplicate-payment buffer rule at priority 19 is skipped for this request."
        default: false
      - name: service_fee_cents
        type: integer
        source: computed
        description: "Fiduciary per-disbursement fee from calculations.payment_total_charge."
      - name: total_charge_cents
        type: integer
        source: computed
        description: "amount_cents + service_fee_cents; this is the figure committed against the account."
      - name: prepared_by_user_id
        type: string
        source: system
        description: "X-User-ID of the BillPaySpecialist who created the payment."
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the second approver; null until an APPROVE decision is recorded."
      - name: approval_status
        type: enum
        source: system
        description: "Approval axis; evolves independently of settlement_status. See state_machines.Payment_approval."
        constraints: "one of PREPARED, PENDING_SECOND_APPROVAL, APPROVED, REJECTED. PREPARED is the machine entry state only - POST /dmm/payments and POST /dmm/payments/{id}/revise both resolve it to APPROVED or PENDING_SECOND_APPROVAL inside the same request, so no read ever returns PREPARED."
      - name: settlement_status
        type: enum
        source: system
        description: "Settlement axis; evolves independently of approval_status. See state_machines.Payment_settlement."
        default: "SCHEDULED"
        constraints: "one of SCHEDULED, IN_FLIGHT, SETTLED, RETURNED, CANCELLED, STOPPED"
      - name: projected_settlement_date
        type: string
        source: computed
        description: "Projected variant of calculations.payment_settlement_schedule, fixed at creation."
      - name: effective_settlement_date
        type: string
        source: computed
        description: "Effective variant of calculations.payment_settlement_schedule, written at release; null before release."
      - name: released_at
        type: datetime
        source: system
        description: "Logical-clock instant of the SCHEDULED -> IN_FLIGHT transition; null before it."
      - name: settled_on
        type: string
        source: computed
        description: "ISO 8601 logical date of the IN_FLIGHT -> SETTLED transition; null before it. Starts the dispute filing window."
      - name: revision_count
        type: integer
        source: computed
        description: "Number of times the payment has gone REJECTED -> PENDING_SECOND_APPROVAL or REJECTED -> APPROVED via revise."
        default: 0
      - name: return_reason
        type: string
        source: input
        description: "Reason recorded on a SETTLED -> RETURNED transition; null otherwise."
      - name: stop_reason
        type: string
        source: input
        description: "Reason recorded on a stop-payment; null otherwise."

  - name: Dispute
    parent: Payment
    common_fields: true
    fields:
      - name: payment_id
        type: string
        source: input
        description: "FK -> Payment.id; the settled payment being disputed."
      - name: reason_code
        type: enum
        source: input
        description: "Why the disbursement is disputed."
        constraints: "one of UNAUTHORIZED, WRONG_AMOUNT, GOODS_NOT_RECEIVED, SCAM_INDUCED"
      - name: disputed_amount_cents
        type: integer
        source: input
        description: "Integer cents disputed; must be > 0 and <= Payment.amount_cents."
      - name: filed_on
        type: string
        source: system
        description: "ISO 8601 logical date the dispute was filed."
      - name: days_since_settlement
        type: integer
        source: computed
        description: "filed_on minus Payment.settled_on in whole days; must be <= DISPUTE_FILING_WINDOW_DAYS."
      - name: provisional_credit_cents
        type: integer
        source: computed
        description: "Cents credited when the dispute moves FILED -> PROVISIONAL_CREDITED; 0 before that."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Dispute lifecycle; see state_machines.Dispute."
        default: "FILED"
        constraints: "one of FILED, PROVISIONAL_CREDITED, UPHELD, DENIED"
      - name: resolution_note
        type: string
        source: input
        description: "Note recorded at resolution; null before it."

  - name: ReconciliationPeriod
    parent: ClientAccount
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> ClientAccount.id; the account whose month this period reconciles."
      - name: period_month
        type: string
        source: input
        description: "Calendar month reconciled, formatted YYYY-MM; unique per account."
      - name: status
        type: enum
        source: system
        description: "Period lifecycle; CLOSED and LOCKED freeze the period's ledger entries. See state_machines.ReconciliationPeriod."
        default: "OPEN"
        constraints: "one of OPEN, IN_REVIEW, CLOSED, REOPENED, LOCKED"
      - name: imported_line_count
        type: integer
        source: computed
        description: "Count of StatementLine rows imported into this period."
        default: 0
      - name: open_exception_count
        type: integer
        source: computed
        description: "Count of StatementLine rows in this period whose match_status is EXCEPTION."
        default: 0
      - name: unreconciled_entry_count
        type: integer
        source: computed
        description: "Count of LedgerEntry rows in this period that no StatementLine has matched."
        default: 0
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent transition into CLOSED or LOCKED; null before it."
      - name: reopen_count
        type: integer
        source: computed
        description: "Number of times this period has been reopened; capped at PERIOD_REOPEN_MAX_COUNT."
        default: 0
      - name: has_retro_adjustment
        type: boolean
        source: computed
        description: "True once a retroactive benefit award named this period as its retro_period_month. Writable while the period is CLOSED or LOCKED - explicitly exempt from the freeze."
        default: false

  - name: StatementLine
    parent: ReconciliationPeriod
    common_fields: true
    fields:
      - name: period_id
        type: string
        source: input
        description: "FK -> ReconciliationPeriod.id; the period this imported line belongs to."
      - name: external_ref
        type: string
        source: input
        description: "Bank statement reference for the line; unique within the period."
      - name: amount_cents
        type: integer
        source: input
        description: "Signed integer cents exactly as the institution reported the line."
      - name: line_date
        type: string
        source: input
        description: "ISO 8601 date the institution posted the line."
      - name: line_description
        type: string
        source: input
        description: "Free-text description copied from the statement."
      - name: match_status
        type: enum
        source: system
        description: "Matching lifecycle; see state_machines.StatementLine."
        default: "UNMATCHED"
        constraints: "one of UNMATCHED, MATCHED, EXCEPTION, RESOLVED_MATCHED, RESOLVED_WRITTEN_OFF"
      - name: matched_ledger_entry_id
        type: string
        source: input
        description: "FK -> LedgerEntry.id; the ledger entry this line was matched against; null while UNMATCHED or EXCEPTION."
      - name: exception_note
        type: string
        source: input
        description: "Note recorded when the line is flagged as an exception or resolved; null otherwise."

  - name: LedgerEntry
    parent: ClientAccount
    common_fields: false
    fields:
      - name: account_id
        type: string
        source: system
        description: "FK -> ClientAccount.id; the account the entry posts against."
      - name: period_id
        type: string
        source: system
        description: "FK -> ReconciliationPeriod.id; resolved by calculations.ledger_period_assignment; null when no period covers the entry."
      - name: source_payment_id
        type: string
        source: system
        description: "FK -> Payment.id; the payment that produced this entry; null for deposits and benefit awards."
      - name: entry_type
        type: enum
        source: system
        description: "What produced the entry."
        constraints: "one of DEPOSIT, DISBURSEMENT, SERVICE_FEE, STOP_PAYMENT_FEE, RETURN_REVERSAL, NSF_FEE, DISPUTE_PROVISIONAL_CREDIT, DISPUTE_CREDIT_REVERSAL, BENEFIT_AWARD. Cancelling a SCHEDULED payment produces NO entry at all - nothing had left the account - so there is deliberately no CANCELLATION entry type."
      - name: amount_cents
        type: integer
        source: system
        description: "Signed integer cents; negative entries reduce cleared_balance_cents."
      - name: entry_date
        type: string
        source: system
        description: "ISO 8601 date the entry is dated; decides which period covers it."
      - name: retro_period_month
        type: string
        source: system
        description: "YYYY-MM of the frozen month a retroactive benefit award relates to; null for every other entry."
      - name: memo
        type: string
        source: system
        description: "Human-readable description of the entry."
      - name: frozen
        type: boolean
        source: computed
        description: "True when the entry's period_id names a period whose status is CLOSED or LOCKED; derived on read, never stored."

  - name: FraudAlert
    parent: ClientAccount
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> ClientAccount.id; the account the alert concerns."
      - name: payment_id
        type: string
        source: input
        description: "FK -> Payment.id; the disbursement that triggered the alert."
      - name: reason_code
        type: enum
        source: input
        description: "Why the alert was raised."
        constraints: "one of UNRECOGNIZED_PAYEE, AMOUNT_ANOMALY, CHANNEL_ANOMALY, THIRD_PARTY_REPORT"
      - name: detail
        type: string
        source: input
        description: "Free-text description of the suspicious activity."
      - name: intake_risk_score
        type: integer
        source: computed
        description: "Intake variant score from calculations.fraud_risk_band, fixed at alert creation."
      - name: intake_risk_band
        type: enum
        source: computed
        description: "Band derived from intake_risk_score; drives the acknowledgement SLA."
        constraints: "one of LOW, MEDIUM, HIGH"
      - name: review_risk_score
        type: integer
        source: computed
        description: "Review variant score from calculations.fraud_risk_band, written at acknowledgement; null before it."
      - name: review_risk_band
        type: enum
        source: computed
        description: "Band derived from review_risk_score; null before acknowledgement."
        constraints: "one of LOW, MEDIUM, HIGH"
      - name: ack_due_at
        type: datetime
        source: computed
        description: "created_at plus the SLA hours of intake_risk_band; the checkpoint escalates NEW alerts at or after this instant."
      - name: acknowledged_at
        type: datetime
        source: system
        description: "Logical-clock instant of the acknowledgement; null before it."
      - name: status
        type: enum
        source: system
        description: "Alert lifecycle; see state_machines.FraudAlert."
        default: "NEW"
        constraints: "one of NEW, ESCALATED, ACKNOWLEDGED, CONFIRMED_FRAUD, DISMISSED"
      - name: disposition_note
        type: string
        source: input
        description: "Note recorded on acknowledge, confirm, or dismiss; null before the first disposition."

  - name: BenefitApplication
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the applicant."
      - name: authorization_id
        type: string
        source: input
        description: "FK -> Authorization.id; the instrument under which the fiduciary applies on the client's behalf."
      - name: program
        type: enum
        source: input
        description: "Means-tested program applied for."
        constraints: "one of SSI, MEDICAID, SNAP, LIHEAP"
      - name: asserted_monthly_income_cents
        type: integer
        source: input
        description: "Monthly countable income asserted on the application, in integer cents; must be >= 0."
      - name: resource_items
        type: array
        source: input
        description: "List of objects, each with item_type (one of HOME, VEHICLE, BURIAL_FUND, RETIREMENT, LIFE_INSURANCE, CASH) and value_cents (integer >= 0)."
      - name: countable_resources_gross_cents
        type: integer
        source: computed
        description: "Gross variant of calculations.benefit_countable_resources."
      - name: countable_resources_net_cents
        type: integer
        source: computed
        description: "Net variant of calculations.benefit_countable_resources; this is the figure the resource limit is tested against."
      - name: status
        type: enum
        source: system
        description: "Application lifecycle; see state_machines.BenefitApplication."
        default: "DRAFT"
        constraints: "one of DRAFT, SUBMITTED, APPROVED, DENIED, APPEALED, WITHDRAWN"
      - name: appeal_count
        type: integer
        source: computed
        description: "Number of appeals filed; capped at BENEFIT_APPEAL_MAX_COUNT."
        default: 0
      - name: submitted_on
        type: string
        source: system
        description: "ISO 8601 logical date of the DRAFT -> SUBMITTED transition; null before it."
      - name: decision_date
        type: string
        source: input
        description: "ISO 8601 date the awarding agency issued its decision; null before a decision."
      - name: award_effective_date
        type: string
        source: input
        description: "ISO 8601 date the award takes effect; may precede decision_date, producing a retroactive award."
      - name: award_monthly_amount_cents
        type: integer
        source: input
        description: "Monthly award in integer cents; null unless the decision is APPROVED."
      - name: retro_months
        type: integer
        source: computed
        description: "Whole calendar months between award_effective_date and decision_date; see calculations.retroactive_award_posting."
        default: 0
      - name: retro_award_cents
        type: integer
        source: computed
        description: "award_monthly_amount_cents multiplied by retro_months; posted as a BENEFIT_AWARD ledger entry."
        default: 0
      - name: denial_reason
        type: string
        source: input
        description: "Reason recorded on a DENIED decision; null otherwise."

  - name: FamilyRecipient
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; whose finances this person may receive reports about."
      - name: authorization_id
        type: string
        source: input
        description: "FK -> Authorization.id; the instrument this subscription derives from. Revoking it terminates the subscription."
      - name: full_name
        type: string
        source: input
        description: "Name of the family member or trusted contact."
      - name: contact_email
        type: string
        source: input
        description: "Email the reports are addressed to."
      - name: relationship
        type: enum
        source: input
        description: "Relationship to the client."
        constraints: "one of CHILD, SPOUSE, SIBLING, OTHER_RELATIVE, TRUSTED_FRIEND"
      - name: permitted_categories
        type: array
        source: input
        description: "Disclosure categories this recipient may see; each element is one of BILL_PAY, BUDGET, BENEFITS, FRAUD, CARE_TEAM, BALANCES. Empty until consent is recorded."
        default: []
      - name: subscription_status
        type: enum
        source: system
        description: "Subscription lifecycle; see state_machines.FamilyRecipient."
        default: "PENDING"
        constraints: "one of PENDING, ACTIVE, SUSPENDED, TERMINATED"
      - name: consent_recorded_by_role
        type: string
        source: system
        description: "Role name that last recorded consent; one of Client or FiduciaryManager. Null before the first consent."
      - name: consent_recorded_at
        type: datetime
        source: system
        description: "Logical-clock instant consent was last recorded; null before it."
      - name: report_count
        type: integer
        source: computed
        description: "Number of FamilyReport rows generated for this recipient."
        default: 0

  - name: FamilyReport
    parent: FamilyRecipient
    common_fields: false
    fields:
      - name: recipient_id
        type: string
        source: input
        description: "FK -> FamilyRecipient.id; who the report was generated for."
      - name: report_month
        type: string
        source: input
        description: "Calendar month covered, formatted YYYY-MM."
      - name: requested_categories
        type: array
        source: input
        description: "Categories the caller asked for; each element is one of BILL_PAY, BUDGET, BENEFITS, FRAUD, CARE_TEAM, BALANCES. Omitted means all six."
      - name: included_categories
        type: array
        source: computed
        description: "Intersection of requested_categories with the recipient's permitted_categories, in the fixed order BILL_PAY, BUDGET, BENEFITS, FRAUD, CARE_TEAM, BALANCES."
      - name: withheld_categories
        type: array
        source: computed
        description: "requested_categories minus included_categories, in the same fixed order."
      - name: is_provisional
        type: boolean
        source: computed
        description: "True unless every ClientAccount of the recipient's client has a ReconciliationPeriod for report_month whose status is CLOSED or LOCKED."
      - name: total_disbursed_cents
        type: integer
        source: computed
        description: "Sum of Payment.amount_cents settled in report_month across the client's accounts; 0 when BILL_PAY is not in included_categories."
      - name: closing_available_balance_cents
        type: integer
        source: computed
        description: "Sum of available_balance_cents across the client's accounts at generation time; 0 when BALANCES is not in included_categories."
      - name: generated_at
        type: datetime
        source: system
        description: "Logical-clock instant the report was generated."

  - name: CoordinationRequest
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client the coordination concerns."
      - name: subject
        type: string
        source: input
        description: "What the care team is being asked to do."
      - name: tier
        type: enum
        source: input
        description: "Urgency tier; sets the acknowledgement SLA."
        constraints: "one of URGENT, ROUTINE, INFORMATIONAL"
      - name: assigned_member_user_id
        type: string
        source: input
        description: "Opaque X-User-ID of the care-team member currently responsible. Not a foreign key to any entity."
      - name: ack_due_at
        type: datetime
        source: computed
        description: "Instant of assignment plus the SLA hours of tier; recomputed on every reroute."
      - name: acknowledged_at
        type: datetime
        source: system
        description: "Logical-clock instant of acknowledgement; null before it."
      - name: reroute_count
        type: integer
        source: computed
        description: "Number of declines that reassigned the request; capped at COORD_REROUTE_MAX_COUNT."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Coordination lifecycle; see state_machines.CoordinationRequest."
        default: "OPEN"
        constraints: "one of OPEN, ACKNOWLEDGED, COMPLETED, ESCALATED"
      - name: disposition_note
        type: string
        source: input
        description: "Note recorded on decline, complete, or escalate; null before the first disposition."

  - name: AuditEntry
    parent: Client
    common_fields: false
    fields:
      - name: client_id
        type: string
        source: system
        description: "FK -> Client.id; the client whose file the audited operation touched."
      - name: actor_role
        type: string
        source: system
        description: "X-User-Role of the caller."
      - name: actor_user_id
        type: string
        source: system
        description: "X-User-ID of the caller."
      - name: operation
        type: string
        source: system
        description: "Method and path of the audited request, e.g. POST /dmm/payments."
      - name: subject_entity
        type: enum
        source: system
        description: "Entity type the request primarily targeted; a polymorphic label, not a foreign key."
        constraints: "one of Client, Authorization, ClientAccount, Payee, BudgetCategory, Payment, Dispute, ReconciliationPeriod, StatementLine, FraudAlert, BenefitApplication, SuretyBond, FamilyRecipient, FamilyReport, CoordinationRequest, System"
      - name: subject_id
        type: string
        source: system
        description: "Identifier of the targeted row; a polymorphic reference resolved by subject_entity, not a declared foreign key."
      - name: outcome
        type: enum
        source: system
        description: "Whether the audited request succeeded."
        constraints: "one of SUCCESS, REJECTED"
      - name: error_id
        type: string
        source: system
        description: "Error code returned when outcome is REJECTED; null when SUCCESS."
      - name: disclosure_category
        type: enum
        source: system
        description: "Which family-disclosure category this entry falls under; used to project the audit export behind the disclosure wall."
        constraints: "one of BILL_PAY, BUDGET, BENEFITS, FRAUD, CARE_TEAM, BALANCES, ADMINISTRATION"
      - name: recorded_at
        type: datetime
        source: system
        description: "Logical-clock instant the entry was appended."

# ===========================================================================
# §1.2 State Machine Table
# ===========================================================================
state_machines:

  - entity: Client
    axis: status
    shape: "branching with revert (ACTIVE <-> SUSPENDED cycle)"
    initial_state: INTAKE
    terminal_states: [CLOSED]
    transitions:
      - from: INTAKE
        to: ACTIVE
        trigger: "POST /dmm/clients/{id}/status-change with to_status ACTIVE"
        actor: FiduciaryManager
        preconditions:
          - "Client.status == INTAKE"
          - "Client.capacity_determination != NOT_DETERMINED"
        side_effects:
          - "sets Client.activated_on to the current logical date"
          - "increments Client.version by 1"
        note: "Intake is not complete until a capacity determination is on file."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /dmm/clients/{id}/status-change with to_status SUSPENDED"
        actor: FiduciaryManager
        preconditions:
          - "Client.status == ACTIVE"
        side_effects:
          - "every FamilyRecipient of this client whose subscription_status == ACTIVE moves to SUSPENDED"
          - "increments Client.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /dmm/clients/{id}/status-change with to_status ACTIVE"
        actor: FiduciaryManager
        preconditions:
          - "Client.status == SUSPENDED"
        side_effects:
          - "every FamilyRecipient of this client whose subscription_status == SUSPENDED moves back to ACTIVE"
          - "increments Client.version by 1"
        note: "The ACTIVE <-> SUSPENDED cycle is re-entrant and uncapped."
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /dmm/clients/{id}/status-change with to_status CLOSED"
        actor: FiduciaryManager
        preconditions:
          - "Client.status == ACTIVE"
          - "no Payment on any of this client's accounts has settlement_status in SCHEDULED or IN_FLIGHT"
        side_effects:
          - "sets Client.closed_on to the current logical date"
          - "every Authorization of this client whose status == ACTIVE moves to REVOKED with revocation_reason CLIENT_CLOSED, running the full revocation cascade"
          - "increments Client.version by 1"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /dmm/clients/{id}/status-change with to_status CLOSED"
        actor: FiduciaryManager
        preconditions:
          - "Client.status == SUSPENDED"
          - "no Payment on any of this client's accounts has settlement_status in SCHEDULED or IN_FLIGHT"
        side_effects:
          - "sets Client.closed_on to the current logical date"
          - "every Authorization of this client whose status == ACTIVE moves to REVOKED with revocation_reason CLIENT_CLOSED, running the full revocation cascade"
          - "increments Client.version by 1"

  - entity: Authorization
    axis: status
    shape: "branching fork with divergent side-effect sets per branch"
    initial_state: DRAFT
    terminal_states: [EXPIRED, REVOKED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /dmm/authorizations/{id}/status with to_status ACTIVE"
        actor: FiduciaryManager
        preconditions:
          - "Authorization.status == DRAFT"
          - "Client.status in ACTIVE or INTAKE"
        side_effects:
          - "sets Authorization.executed_at to the current logical instant"
          - "every other Authorization of the same client whose status == ACTIVE moves to SUPERSEDED"
          - "increments Authorization.version by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /dmm/authorizations/{id}/status with to_status REVOKED"
        actor: FiduciaryManager
        preconditions:
          - "Authorization.status == ACTIVE"
          - "revocation_reason is present and non-empty"
        side_effects:
          - "CASCADE hop 1 - sets Authorization.status REVOKED and revoked_at to the current logical instant"
          - "CASCADE hop 2 - every Payment whose authorization_id == this instrument and whose settlement_status == SCHEDULED moves SCHEDULED -> CANCELLED (caused by hop 1)"
          - "CASCADE hop 3 - each of those cancellations decrements BudgetCategory.committed_cents by that payment's amount_cents and recomputes variance_full_cents, variance_ptd_cents and variance_direction (caused by hop 2)"
          - "each cancellation also decrements ClientAccount.committed_disbursements_cents by that payment's total_charge_cents, recomputes available_balance_cents, and decrements SuretyBond.exposure_committed_cents by that payment's amount_cents"
          - "every FamilyRecipient whose authorization_id == this instrument and whose subscription_status is in PENDING, ACTIVE or SUSPENDED moves to TERMINATED"
          - "every BenefitApplication whose authorization_id == this instrument and whose status is in DRAFT, SUBMITTED or APPEALED moves to WITHDRAWN"
          - "sets cascaded_payments_cancelled, cascaded_recipients_terminated and cascaded_applications_withdrawn to the respective counts"
          - "increments Authorization.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system - a later Authorization for the same client is executed"
        actor: system
        preconditions:
          - "Authorization.status == ACTIVE"
          - "another Authorization of the same client transitions DRAFT -> ACTIVE"
        side_effects:
          - "increments Authorization.version by 1"
        note: "Superseding does NOT run the revocation cascade; the successor instrument keeps the client's payments alive."
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /dmm/ops/checkpoint"
        actor: system
        preconditions:
          - "Authorization.status == ACTIVE"
          - "Authorization.expiry_date < the current logical date (the instrument is still in force ON expiry_date)"
        side_effects:
          - "increments Authorization.version by 1"
        note: "Priority 7 also refuses operations under an ACTIVE-but-lapsed instrument, so the checkpoint is a bookkeeping sweep, not the gate itself."

  - entity: ClientAccount
    axis: fraud_posture
    shape: "cyclic and re-entrant (NORMAL -> WATCH -> FROZEN -> NORMAL, and NORMAL -> FROZEN directly)"
    initial_state: NORMAL
    terminal_states: []
    transitions:
      - from: NORMAL
        to: WATCH
        trigger: "POST /dmm/accounts/{id}/fraud-posture with to_posture WATCH"
        actor: ComplianceOfficer
        preconditions:
          - "ClientAccount.fraud_posture == NORMAL"
        side_effects:
          - "records fraud_posture_reason"
          - "increments ClientAccount.version by 1"
        note: "WATCH is observational - it does NOT gate disbursement."
      - from: WATCH
        to: FROZEN
        trigger: "POST /dmm/accounts/{id}/fraud-posture with to_posture FROZEN"
        actor: ComplianceOfficer
        preconditions:
          - "ClientAccount.fraud_posture == WATCH"
        side_effects:
          - "records fraud_posture_reason"
          - "FREEZE SWEEP - every Payment on this account whose settlement_status == SCHEDULED moves to CANCELLED and every Payment whose settlement_status == IN_FLIGHT moves to STOPPED; see the shared freeze-sweep note below"
          - "increments ClientAccount.version by 1"
      - from: NORMAL
        to: FROZEN
        trigger: "POST /dmm/accounts/{id}/fraud-posture with to_posture FROZEN, or a FraudAlert on this account moving to CONFIRMED_FRAUD"
        actor: ComplianceOfficer
        preconditions:
          - "ClientAccount.fraud_posture == NORMAL"
        side_effects:
          - "records fraud_posture_reason"
          - "FREEZE SWEEP - every Payment on this account whose settlement_status == SCHEDULED moves to CANCELLED and every Payment whose settlement_status == IN_FLIGHT moves to STOPPED; see the shared freeze-sweep note below"
          - "increments ClientAccount.version by 1"
      - from: WATCH
        to: NORMAL
        trigger: "POST /dmm/accounts/{id}/fraud-posture with to_posture NORMAL"
        actor: ComplianceOfficer
        preconditions:
          - "ClientAccount.fraud_posture == WATCH"
        side_effects:
          - "records fraud_posture_reason"
          - "increments ClientAccount.version by 1"
      - from: FROZEN
        to: NORMAL
        trigger: "POST /dmm/accounts/{id}/fraud-posture with to_posture NORMAL"
        actor: ComplianceOfficer
        preconditions:
          - "ClientAccount.fraud_posture == FROZEN"
          - "no FraudAlert on this account has status in NEW, ESCALATED or ACKNOWLEDGED"
          - "the supplied reason is at least FRAUD_UNFREEZE_REASON_MIN_CHARS characters long"
        side_effects:
          - "records fraud_posture_reason"
          - "increments ClientAccount.version by 1"
        note: "Closes the cycle - the account can be frozen again afterwards without limit."
    freeze_sweep_note: |
      The FREEZE SWEEP referenced by both transitions into FROZEN is the same
      ordered routine, and it is the backbone of the deepest cascade in this
      scaffold. Ordered by the affected Payment's created_at ascending:
        hop A - Payment.settlement_status SCHEDULED -> CANCELLED (no ledger
                entry; nothing has left the account yet). The cancellation
                decrements ClientAccount.committed_disbursements_cents by
                total_charge_cents, decrements BudgetCategory.committed_cents by
                amount_cents, and decrements SuretyBond.exposure_committed_cents
                by amount_cents.
        hop B - Payment.settlement_status IN_FLIGHT -> STOPPED. The stop
                decrements the same three aggregates AND appends one
                STOP_PAYMENT_FEE LedgerEntry of -STOP_PAYMENT_FEE_CENTS dated
                the current logical date (caused by hop B, not by the freeze).
        hop C - that new LedgerEntry increments its period's
                unreconciled_entry_count by 1 (caused by hop B's entry).
        hop D - if that period's status == IN_REVIEW it reverts to OPEN,
                because a period under review can no longer be reviewed once a
                fresh unreconciled entry lands in it (caused by hop C).
      The stop-payment WINDOW rule at priority 21 does NOT apply to the freeze
      sweep; the sweep is a system action, not a POST /dmm/payments/{id}/stop-payment
      request.

  - entity: Payee
    axis: status
    shape: "linear"
    initial_state: ACTIVE
    terminal_states: [BLOCKED]
    transitions:
      - from: ACTIVE
        to: BLOCKED
        trigger: "POST /dmm/payees/{id}/block"
        actor: ComplianceOfficer
        preconditions:
          - "Payee.status == ACTIVE"
        side_effects:
          - "records blocked_reason"
          - "every Payment to this payee whose settlement_status == SCHEDULED moves to CANCELLED, releasing its commitment, budget and bond exposure"
          - "increments Payee.version by 1"

  - entity: SuretyBond
    axis: status
    shape: "linear"
    initial_state: IN_FORCE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: IN_FORCE
        to: SUPERSEDED
        trigger: "system - POST /dmm/surety-bonds creates a newer bond"
        actor: system
        preconditions:
          - "SuretyBond.status == IN_FORCE"
        side_effects:
          - "increments SuretyBond.version by 1"
        note: "Exactly one bond is IN_FORCE at any time; the gate at priority 6 reads that one."

  - entity: Payment
    axis: approval_status
    shape: "cyclic - PENDING_SECOND_APPROVAL -> REJECTED -> PENDING_SECOND_APPROVAL, and one of two parallel axes on the same row"
    initial_state: PREPARED
    terminal_states: [APPROVED]
    parallel_with: "state_machines.Payment.settlement_status - the two axes advance independently on the same Payment row"
    transitions:
      - from: PREPARED
        to: APPROVED
        trigger: "system - evaluated inside POST /dmm/payments and inside POST /dmm/payments/{id}/revise"
        actor: system
        preconditions:
          - "Payment.amount_cents < SECOND_APPROVAL_THRESHOLD_CENTS"
        side_effects:
          - "leaves approved_by_user_id null - single control means there is no second approver"
        note: "Single-control path. The payment is immediately releasable."
      - from: PREPARED
        to: PENDING_SECOND_APPROVAL
        trigger: "system - evaluated inside POST /dmm/payments and inside POST /dmm/payments/{id}/revise"
        actor: system
        preconditions:
          - "Payment.amount_cents >= SECOND_APPROVAL_THRESHOLD_CENTS"
        side_effects: []
        note: "Dual-control path. The boundary is inclusive - exactly SECOND_APPROVAL_THRESHOLD_CENTS needs a second approver."
      - from: PENDING_SECOND_APPROVAL
        to: APPROVED
        trigger: "POST /dmm/payments/{id}/approval-decision with decision APPROVE"
        actor: FiduciaryManager
        preconditions:
          - "Payment.approval_status == PENDING_SECOND_APPROVAL"
          - "Payment.settlement_status == SCHEDULED"
          - "the caller's X-User-ID != Payment.prepared_by_user_id"
        side_effects:
          - "sets approved_by_user_id to the caller's X-User-ID"
          - "increments Payment.version by 1"
      - from: PENDING_SECOND_APPROVAL
        to: REJECTED
        trigger: "POST /dmm/payments/{id}/approval-decision with decision REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "Payment.approval_status == PENDING_SECOND_APPROVAL"
          - "Payment.settlement_status == SCHEDULED"
          - "the caller's X-User-ID != Payment.prepared_by_user_id"
        side_effects:
          - "sets approved_by_user_id to null"
          - "leaves settlement_status at SCHEDULED - the funds stay committed while the payment is reworked"
          - "increments Payment.version by 1"
        note: "The two axes stay independent here - rejecting the approval does not cancel the settlement."
      - from: REJECTED
        to: PENDING_SECOND_APPROVAL
        trigger: "POST /dmm/payments/{id}/revise"
        actor: BillPaySpecialist
        preconditions:
          - "Payment.approval_status == REJECTED"
          - "Payment.settlement_status == SCHEDULED"
          - "the revised amount_cents >= SECOND_APPROVAL_THRESHOLD_CENTS"
        side_effects:
          - "recomputes service_fee_cents and total_charge_cents from the revised amount"
          - "adjusts ClientAccount.committed_disbursements_cents by the total_charge_cents delta and recomputes available_balance_cents"
          - "adjusts BudgetCategory.committed_cents by the amount_cents delta and recomputes the variance fields"
          - "adjusts SuretyBond.exposure_committed_cents by the amount_cents delta"
          - "increments Payment.revision_count by 1"
          - "increments Payment.version by 1"
        note: "Closes the approval cycle; the loop is uncapped by design because each pass re-runs the fiscal rungs."
      - from: REJECTED
        to: APPROVED
        trigger: "POST /dmm/payments/{id}/revise"
        actor: BillPaySpecialist
        preconditions:
          - "Payment.approval_status == REJECTED"
          - "Payment.settlement_status == SCHEDULED"
          - "the revised amount_cents < SECOND_APPROVAL_THRESHOLD_CENTS"
        side_effects:
          - "recomputes service_fee_cents and total_charge_cents from the revised amount"
          - "adjusts ClientAccount.committed_disbursements_cents by the total_charge_cents delta and recomputes available_balance_cents"
          - "adjusts BudgetCategory.committed_cents by the amount_cents delta and recomputes the variance fields"
          - "adjusts SuretyBond.exposure_committed_cents by the amount_cents delta"
          - "increments Payment.revision_count by 1"
          - "increments Payment.version by 1"
        note: "Revising below the threshold drops the payment out of dual control entirely."

  - entity: Payment
    axis: settlement_status
    shape: "branching with two terminal exits and a post-terminal return path; the second of two parallel axes on the same row"
    initial_state: SCHEDULED
    terminal_states: [RETURNED, CANCELLED, STOPPED]
    parallel_with: "state_machines.Payment.approval_status"
    transitions:
      - from: SCHEDULED
        to: IN_FLIGHT
        trigger: "POST /dmm/payments/{id}/release"
        actor: BillPaySpecialist
        preconditions:
          - "Payment.settlement_status == SCHEDULED (checked by priority 12)"
          - "Payment.approval_status == APPROVED (checked by priority 30, NOT by priority 12 - see validations[priority=12].axis_split_note)"
          - "ClientAccount.fraud_posture != FROZEN (checked by priority 9)"
        side_effects:
          - "sets released_at to the current logical instant"
          - "writes effective_settlement_date using the EFFECTIVE variant of calculations.payment_settlement_schedule, evaluated at the release instant"
          - "leaves projected_settlement_date untouched, so the two variants can be compared"
          - "increments Payment.version by 1"
      - from: IN_FLIGHT
        to: SETTLED
        trigger: "POST /dmm/payments/{id}/settlement-event with event SETTLE"
        actor: BillPaySpecialist
        preconditions:
          - "Payment.settlement_status == IN_FLIGHT"
        side_effects:
          - "sets settled_on to the current logical date"
          - "appends a DISBURSEMENT LedgerEntry of -amount_cents and a SERVICE_FEE LedgerEntry of -service_fee_cents, both dated the current logical date, both with source_payment_id set"
          - "decrements ClientAccount.committed_disbursements_cents by total_charge_cents; cleared_balance_cents falls by the same total, so available_balance_cents is unchanged"
          - "increments Payee.settled_payment_count by 1"
          - "increments the covering ReconciliationPeriod.unreconciled_entry_count by 2"
          - "decrements SuretyBond.exposure_committed_cents by amount_cents and increments SuretyBond.exposure_settled_inclusive_cents accordingly"
          - "leaves BudgetCategory.committed_cents unchanged and increments BudgetCategory.settled_cents by amount_cents"
          - "increments Payment.version by 1"
      - from: SETTLED
        to: RETURNED
        trigger: "POST /dmm/payments/{id}/settlement-event with event RETURN"
        actor: BillPaySpecialist
        preconditions:
          - "Payment.settlement_status == SETTLED"
          - "return_reason is present and non-empty"
        side_effects:
          - "appends a RETURN_REVERSAL LedgerEntry of +total_charge_cents and an NSF_FEE LedgerEntry of -NSF_FEE_CENTS, both dated the current logical date"
          - "decrements Payee.settled_payment_count by 1"
          - "decrements BudgetCategory.committed_cents and BudgetCategory.settled_cents by amount_cents and recomputes the variance fields"
          - "decrements SuretyBond.exposure_settled_inclusive_cents by amount_cents"
          - "increments the covering ReconciliationPeriod.unreconciled_entry_count by 2"
          - "increments Payment.version by 1"
        note: "Net effect on the account is +total_charge_cents - NSF_FEE_CENTS; the compensation is deliberately lossy by exactly the NSF fee."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /dmm/payments/{id}/cancel, or the authorization revocation cascade, or the payee-block cascade, or the account freeze sweep"
        actor: BillPaySpecialist
        preconditions:
          - "Payment.settlement_status == SCHEDULED"
        side_effects:
          - "decrements ClientAccount.committed_disbursements_cents by total_charge_cents and recomputes available_balance_cents"
          - "decrements BudgetCategory.committed_cents by amount_cents and recomputes the variance fields"
          - "decrements SuretyBond.exposure_committed_cents by amount_cents"
          - "appends no LedgerEntry - no money ever left the account"
          - "increments Payment.version by 1"
        note: "Cancellation is the exact compensating action for scheduling; every conserved quantity returns to its pre-scheduling value."
      - from: SCHEDULED
        to: STOPPED
        trigger: "POST /dmm/payments/{id}/stop-payment"
        actor: FiduciaryManager
        preconditions:
          - "Payment.settlement_status == SCHEDULED"
          - "the current logical instant is at or before Payment.created_at plus STOP_PAYMENT_WINDOW_HOURS"
        side_effects:
          - "appends a STOP_PAYMENT_FEE LedgerEntry of -STOP_PAYMENT_FEE_CENTS dated the current logical date"
          - "decrements ClientAccount.committed_disbursements_cents by total_charge_cents and recomputes available_balance_cents"
          - "decrements BudgetCategory.committed_cents by amount_cents and recomputes the variance fields"
          - "decrements SuretyBond.exposure_committed_cents by amount_cents"
          - "increments the covering ReconciliationPeriod.unreconciled_entry_count by 1"
          - "increments Payment.version by 1"
      - from: IN_FLIGHT
        to: STOPPED
        trigger: "POST /dmm/payments/{id}/stop-payment, or the account freeze sweep"
        actor: FiduciaryManager
        preconditions:
          - "Payment.settlement_status == IN_FLIGHT"
          - "the current logical instant is at or before Payment.created_at plus STOP_PAYMENT_WINDOW_HOURS (waived when the trigger is the freeze sweep)"
        side_effects:
          - "appends a STOP_PAYMENT_FEE LedgerEntry of -STOP_PAYMENT_FEE_CENTS dated the current logical date"
          - "decrements ClientAccount.committed_disbursements_cents by total_charge_cents and recomputes available_balance_cents"
          - "decrements BudgetCategory.committed_cents by amount_cents and recomputes the variance fields"
          - "decrements SuretyBond.exposure_committed_cents by amount_cents"
          - "increments the covering ReconciliationPeriod.unreconciled_entry_count by 1"
          - "increments Payment.version by 1"

  - entity: Dispute
    axis: status
    shape: "branching fork with divergent compensation per branch"
    initial_state: FILED
    terminal_states: [UPHELD, DENIED]
    transitions:
      - from: FILED
        to: PROVISIONAL_CREDITED
        trigger: "POST /dmm/disputes/{id}/provisional-credit"
        actor: ComplianceOfficer
        preconditions:
          - "Dispute.status == FILED"
          - "Dispute.disputed_amount_cents <= DISPUTE_PROVISIONAL_CREDIT_MAX_CENTS"
        side_effects:
          - "sets provisional_credit_cents to disputed_amount_cents"
          - "appends a DISPUTE_PROVISIONAL_CREDIT LedgerEntry of +provisional_credit_cents dated the current logical date"
          - "raises ClientAccount.cleared_balance_cents and available_balance_cents by the same amount"
          - "increments the covering ReconciliationPeriod.unreconciled_entry_count by 1"
          - "increments Dispute.version by 1"
      - from: PROVISIONAL_CREDITED
        to: UPHELD
        trigger: "POST /dmm/disputes/{id}/resolve with outcome UPHELD"
        actor: ComplianceOfficer
        preconditions:
          - "Dispute.status == PROVISIONAL_CREDITED"
        side_effects:
          - "leaves the provisional credit in place permanently - no reversal entry"
          - "increments Dispute.version by 1"
      - from: PROVISIONAL_CREDITED
        to: DENIED
        trigger: "POST /dmm/disputes/{id}/resolve with outcome DENIED"
        actor: ComplianceOfficer
        preconditions:
          - "Dispute.status == PROVISIONAL_CREDITED"
        side_effects:
          - "appends a DISPUTE_CREDIT_REVERSAL LedgerEntry of -provisional_credit_cents dated the current logical date"
          - "lowers ClientAccount.cleared_balance_cents and available_balance_cents back to their pre-credit values"
          - "increments the covering ReconciliationPeriod.unreconciled_entry_count by 1"
          - "increments Dispute.version by 1"
        note: "File -> credit -> deny is an exact round trip on cleared_balance_cents."
      - from: FILED
        to: DENIED
        trigger: "POST /dmm/disputes/{id}/resolve with outcome DENIED"
        actor: ComplianceOfficer
        preconditions:
          - "Dispute.status == FILED"
        side_effects:
          - "appends no LedgerEntry - there was never a credit to reverse"
          - "increments Dispute.version by 1"
      - from: FILED
        to: UPHELD
        trigger: "POST /dmm/disputes/{id}/resolve with outcome UPHELD"
        actor: ComplianceOfficer
        preconditions:
          - "Dispute.status == FILED"
        side_effects:
          - "sets provisional_credit_cents to disputed_amount_cents"
          - "appends a DISPUTE_PROVISIONAL_CREDIT LedgerEntry of +disputed_amount_cents dated the current logical date"
          - "raises ClientAccount.cleared_balance_cents and available_balance_cents by the same amount"
          - "increments the covering ReconciliationPeriod.unreconciled_entry_count by 1"
          - "increments Dispute.version by 1"
        note: "Upholding a dispute that never received a provisional credit pays it out at resolution instead."

  - entity: ReconciliationPeriod
    axis: status
    shape: "cyclic - CLOSED -> REOPENED -> IN_REVIEW -> LOCKED, with an IN_REVIEW -> OPEN revert driven by child activity"
    initial_state: OPEN
    terminal_states: [LOCKED]
    transitions:
      - from: OPEN
        to: IN_REVIEW
        trigger: "POST /dmm/reconciliation-periods/{id}/status with to_status IN_REVIEW"
        actor: BillPaySpecialist
        preconditions:
          - "ReconciliationPeriod.status == OPEN"
        side_effects:
          - "increments ReconciliationPeriod.version by 1"
      - from: IN_REVIEW
        to: OPEN
        trigger: "system - a new LedgerEntry lands in this period while it is IN_REVIEW"
        actor: system
        preconditions:
          - "ReconciliationPeriod.status == IN_REVIEW"
          - "a LedgerEntry whose period_id == this period is appended"
        side_effects:
          - "increments ReconciliationPeriod.version by 1"
        note: "The revert that closes the freeze-sweep cascade at hop D."
      - from: IN_REVIEW
        to: CLOSED
        trigger: "POST /dmm/reconciliation-periods/{id}/status with to_status CLOSED"
        actor: FiduciaryManager
        preconditions:
          - "ReconciliationPeriod.status == IN_REVIEW"
          - "ReconciliationPeriod.open_exception_count == 0"
          - "ReconciliationPeriod.reopen_count == 0"
        side_effects:
          - "sets closed_at to the current logical instant"
          - "every LedgerEntry whose period_id == this period now reads frozen true"
          - "the period freeze gate at priority 10 begins refusing the operations listed in its applies_to"
          - "increments ReconciliationPeriod.version by 1"
        note: "An empty period - zero imported lines, zero exceptions - closes successfully; the exception check is on a count, not on non-emptiness."
      - from: IN_REVIEW
        to: LOCKED
        trigger: "POST /dmm/reconciliation-periods/{id}/status with to_status CLOSED"
        actor: FiduciaryManager
        preconditions:
          - "ReconciliationPeriod.status == IN_REVIEW"
          - "ReconciliationPeriod.open_exception_count == 0"
          - "ReconciliationPeriod.reopen_count == PERIOD_REOPEN_MAX_COUNT"
        side_effects:
          - "sets closed_at to the current logical instant"
          - "every LedgerEntry whose period_id == this period now reads frozen true"
          - "increments ReconciliationPeriod.version by 1"
        note: "Same request as the CLOSED branch; reopen_count decides which of the two states the period lands in. LOCKED can never be reopened."
      - from: CLOSED
        to: REOPENED
        trigger: "POST /dmm/reconciliation-periods/{id}/status with to_status REOPENED"
        actor: FiduciaryManager
        preconditions:
          - "ReconciliationPeriod.status == CLOSED"
          - "ReconciliationPeriod.reopen_count < PERIOD_REOPEN_MAX_COUNT"
          - "the current logical instant is at or before closed_at plus PERIOD_REOPEN_WINDOW_DAYS days"
        side_effects:
          - "increments reopen_count by 1"
          - "every LedgerEntry whose period_id == this period reads frozen false again"
          - "increments ReconciliationPeriod.version by 1"
      - from: REOPENED
        to: IN_REVIEW
        trigger: "POST /dmm/reconciliation-periods/{id}/status with to_status IN_REVIEW"
        actor: BillPaySpecialist
        preconditions:
          - "ReconciliationPeriod.status == REOPENED"
        side_effects:
          - "increments ReconciliationPeriod.version by 1"
        note: "Closes the cycle back onto IN_REVIEW, from which the next close lands in LOCKED."

  - entity: StatementLine
    axis: match_status
    shape: "branching - UNMATCHED forks to MATCHED or EXCEPTION, and EXCEPTION forks again"
    initial_state: UNMATCHED
    terminal_states: [MATCHED, RESOLVED_MATCHED, RESOLVED_WRITTEN_OFF]
    transitions:
      - from: UNMATCHED
        to: MATCHED
        trigger: "POST /dmm/statement-lines/{id}/disposition with action MATCH"
        actor: BillPaySpecialist
        preconditions:
          - "StatementLine.match_status == UNMATCHED"
          - "the supplied ledger_entry_id names a LedgerEntry whose period_id equals this line's period_id"
          - "that LedgerEntry.amount_cents equals this line's amount_cents"
          - "the request carries the period's current version in expected_period_version"
        side_effects:
          - "sets matched_ledger_entry_id"
          - "decrements ReconciliationPeriod.unreconciled_entry_count by 1"
          - "increments ReconciliationPeriod.version by 1"
          - "increments StatementLine.version by 1"
      - from: UNMATCHED
        to: EXCEPTION
        trigger: "POST /dmm/statement-lines/{id}/disposition with action FLAG_EXCEPTION"
        actor: BillPaySpecialist
        preconditions:
          - "StatementLine.match_status == UNMATCHED"
          - "the request carries the period's current version in expected_period_version"
        side_effects:
          - "records exception_note"
          - "increments ReconciliationPeriod.open_exception_count by 1"
          - "increments ReconciliationPeriod.version by 1"
          - "increments StatementLine.version by 1"
      - from: EXCEPTION
        to: RESOLVED_MATCHED
        trigger: "POST /dmm/statement-lines/{id}/disposition with action RESOLVE_MATCHED"
        actor: FiduciaryManager
        preconditions:
          - "StatementLine.match_status == EXCEPTION"
          - "the supplied ledger_entry_id names a LedgerEntry whose period_id equals this line's period_id"
          - "that LedgerEntry.amount_cents equals this line's amount_cents"
          - "the request carries the period's current version in expected_period_version"
        side_effects:
          - "sets matched_ledger_entry_id"
          - "decrements ReconciliationPeriod.open_exception_count by 1"
          - "decrements ReconciliationPeriod.unreconciled_entry_count by 1"
          - "increments ReconciliationPeriod.version by 1"
          - "increments StatementLine.version by 1"
      - from: EXCEPTION
        to: RESOLVED_WRITTEN_OFF
        trigger: "POST /dmm/statement-lines/{id}/disposition with action RESOLVE_WRITTEN_OFF"
        actor: FiduciaryManager
        preconditions:
          - "StatementLine.match_status == EXCEPTION"
          - "the request carries the period's current version in expected_period_version"
        side_effects:
          - "records exception_note"
          - "decrements ReconciliationPeriod.open_exception_count by 1"
          - "increments ReconciliationPeriod.version by 1"
          - "increments StatementLine.version by 1"
        note: "Writing a line off leaves unreconciled_entry_count untouched - nothing on the ledger side was matched."

  - entity: FraudAlert
    axis: status
    shape: "cyclic - NEW -> ESCALATED -> ACKNOWLEDGED rejoins the same adjudication fork the un-escalated path uses"
    initial_state: NEW
    terminal_states: [CONFIRMED_FRAUD, DISMISSED]
    transitions:
      - from: NEW
        to: ESCALATED
        trigger: "POST /dmm/ops/checkpoint"
        actor: system
        preconditions:
          - "FraudAlert.status == NEW"
          - "the current logical instant is at or after FraudAlert.ack_due_at"
        side_effects:
          - "increments FraudAlert.version by 1"
      - from: NEW
        to: ACKNOWLEDGED
        trigger: "POST /dmm/fraud-alerts/{id}/disposition with action ACKNOWLEDGE"
        actor: ComplianceOfficer
        preconditions:
          - "FraudAlert.status == NEW"
        side_effects:
          - "sets acknowledged_at to the current logical instant"
          - "writes review_risk_score and review_risk_band using the REVIEW variant of calculations.fraud_risk_band, evaluated now"
          - "increments FraudAlert.version by 1"
      - from: ESCALATED
        to: ACKNOWLEDGED
        trigger: "POST /dmm/fraud-alerts/{id}/disposition with action ACKNOWLEDGE"
        actor: ComplianceOfficer
        preconditions:
          - "FraudAlert.status == ESCALATED"
        side_effects:
          - "sets acknowledged_at to the current logical instant"
          - "writes review_risk_score and review_risk_band using the REVIEW variant of calculations.fraud_risk_band"
          - "increments FraudAlert.version by 1"
        note: "Rejoins the un-escalated path - an escalated alert is adjudicated exactly like an acknowledged one."
      - from: ACKNOWLEDGED
        to: CONFIRMED_FRAUD
        trigger: "POST /dmm/fraud-alerts/{id}/disposition with action CONFIRM_FRAUD"
        actor: ComplianceOfficer
        preconditions:
          - "FraudAlert.status == ACKNOWLEDGED"
        side_effects:
          - "CASCADE hop 1 - the alert becomes CONFIRMED_FRAUD"
          - "CASCADE hop 2 - the ClientAccount named by account_id moves its fraud_posture to FROZEN (caused by hop 1), which runs the FREEZE SWEEP hops A through D described under state_machines.ClientAccount"
          - "increments FraudAlert.version by 1"
      - from: ACKNOWLEDGED
        to: DISMISSED
        trigger: "POST /dmm/fraud-alerts/{id}/disposition with action DISMISS"
        actor: ComplianceOfficer
        preconditions:
          - "FraudAlert.status == ACKNOWLEDGED"
        side_effects:
          - "leaves ClientAccount.fraud_posture untouched"
          - "increments FraudAlert.version by 1"

  - entity: BenefitApplication
    axis: status
    shape: "cyclic with a hard cap - DENIED -> APPEALED -> DENIED, the loop stopped by the priority-26 rung once appeal_count reaches BENEFIT_APPEAL_MAX_COUNT"
    initial_state: DRAFT
    terminal_states: [APPROVED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /dmm/benefit-applications/{id}/status with action SUBMIT"
        actor: FiduciaryManager
        preconditions:
          - "BenefitApplication.status == DRAFT"
          - "countable_resources_net_cents <= the program's resource limit"
          - "asserted_monthly_income_cents <= the program's monthly income limit"
        side_effects:
          - "sets submitted_on to the current logical date"
          - "increments BenefitApplication.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /dmm/benefit-applications/{id}/record-decision with outcome APPROVED"
        actor: FiduciaryManager
        preconditions:
          - "BenefitApplication.status == SUBMITTED"
        side_effects:
          - "CASCADE hop 1 - writes decision_date, award_effective_date, award_monthly_amount_cents, retro_months and retro_award_cents"
          - "CASCADE hop 2 - appends a BENEFIT_AWARD LedgerEntry of +retro_award_cents (caused by hop 1) using calculations.retroactive_award_posting to pick its period_id and retro_period_month"
          - "CASCADE hop 3 - that entry raises ClientAccount.cleared_balance_cents and available_balance_cents and increments the receiving period's unreconciled_entry_count by 1 (caused by hop 2)"
          - "when the award month's own period is CLOSED or LOCKED, that period's has_retro_adjustment becomes true - the one field the freeze permits writing"
          - "increments BenefitApplication.version by 1"
        note: "A zero retro_award_cents still appends the entry, so the cascade is observable even for a non-retroactive award."
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /dmm/benefit-applications/{id}/record-decision with outcome DENIED"
        actor: FiduciaryManager
        preconditions:
          - "BenefitApplication.status == SUBMITTED"
          - "denial_reason is present and non-empty"
        side_effects:
          - "writes decision_date and denial_reason"
          - "increments BenefitApplication.version by 1"
      - from: DENIED
        to: APPEALED
        trigger: "POST /dmm/benefit-applications/{id}/status with action APPEAL"
        actor: FiduciaryManager
        preconditions:
          - "BenefitApplication.status == DENIED"
          - "BenefitApplication.appeal_count < BENEFIT_APPEAL_MAX_COUNT"
        side_effects:
          - "increments appeal_count by 1"
          - "increments BenefitApplication.version by 1"
      - from: APPEALED
        to: APPROVED
        trigger: "POST /dmm/benefit-applications/{id}/record-decision with outcome APPROVED"
        actor: FiduciaryManager
        preconditions:
          - "BenefitApplication.status == APPEALED"
        side_effects:
          - "identical to the SUBMITTED -> APPROVED cascade, including the retroactive posting"
          - "increments BenefitApplication.version by 1"
      - from: APPEALED
        to: DENIED
        trigger: "POST /dmm/benefit-applications/{id}/record-decision with outcome DENIED"
        actor: FiduciaryManager
        preconditions:
          - "BenefitApplication.status == APPEALED"
          - "denial_reason is present and non-empty"
        side_effects:
          - "writes decision_date and denial_reason"
          - "increments BenefitApplication.version by 1"
        note: "The loop returns to DENIED, NOT to a separate final state. That is deliberate - the only thing that stops a second appeal is the priority-26 rung, and routing the second denial into a terminal state would let the priority-12 state gate pre-empt priority 26 and make ERR_APPEAL_LIMIT_REACHED unreachable."
      - from: DRAFT
        to: WITHDRAWN
        trigger: "system - the governing Authorization is revoked"
        actor: system
        preconditions:
          - "BenefitApplication.status == DRAFT"
        side_effects:
          - "increments BenefitApplication.version by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "system - the governing Authorization is revoked"
        actor: system
        preconditions:
          - "BenefitApplication.status == SUBMITTED"
        side_effects:
          - "increments BenefitApplication.version by 1"
      - from: APPEALED
        to: WITHDRAWN
        trigger: "system - the governing Authorization is revoked"
        actor: system
        preconditions:
          - "BenefitApplication.status == APPEALED"
        side_effects:
          - "increments BenefitApplication.version by 1"

  - entity: FamilyRecipient
    axis: subscription_status
    shape: "cyclic - ACTIVE <-> SUSPENDED driven by the client's own status axis"
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /dmm/family-recipients/{id}/consent"
        actor: Client
        preconditions:
          - "FamilyRecipient.subscription_status == PENDING"
          - "when the caller's role is Client, Client.capacity_determination == RETAINS_CAPACITY"
          - "the governing Authorization.status == ACTIVE"
        side_effects:
          - "writes permitted_categories, consent_recorded_by_role and consent_recorded_at"
          - "increments FamilyRecipient.version by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /dmm/family-recipients/{id}/consent"
        actor: Client
        preconditions:
          - "FamilyRecipient.subscription_status == ACTIVE"
          - "when the caller's role is Client, Client.capacity_determination == RETAINS_CAPACITY"
        side_effects:
          - "replaces permitted_categories wholesale - it is a set, not a delta"
          - "increments FamilyRecipient.version by 1"
        note: "A re-entrant self-transition; restrictions can be tightened or loosened any number of times."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system - the client moves ACTIVE -> SUSPENDED"
        actor: system
        preconditions:
          - "FamilyRecipient.subscription_status == ACTIVE"
        side_effects:
          - "increments FamilyRecipient.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system - the client moves SUSPENDED -> ACTIVE"
        actor: system
        preconditions:
          - "FamilyRecipient.subscription_status == SUSPENDED"
        side_effects:
          - "increments FamilyRecipient.version by 1"
      - from: PENDING
        to: TERMINATED
        trigger: "system - the governing Authorization is revoked"
        actor: system
        preconditions:
          - "FamilyRecipient.subscription_status == PENDING"
        side_effects:
          - "increments FamilyRecipient.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system - the governing Authorization is revoked"
        actor: system
        preconditions:
          - "FamilyRecipient.subscription_status == ACTIVE"
        side_effects:
          - "increments FamilyRecipient.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "system - the governing Authorization is revoked"
        actor: system
        preconditions:
          - "FamilyRecipient.subscription_status == SUSPENDED"
        side_effects:
          - "increments FamilyRecipient.version by 1"

  - entity: CoordinationRequest
    axis: status
    shape: "bounded self-loop - OPEN -> OPEN on decline, capped at COORD_REROUTE_MAX_COUNT reroutes"
    initial_state: OPEN
    terminal_states: [COMPLETED, ESCALATED]
    transitions:
      - from: OPEN
        to: OPEN
        trigger: "POST /dmm/coordination-requests/{id}/disposition with action DECLINE"
        actor: CareCoordinator
        preconditions:
          - "CoordinationRequest.status == OPEN"
          - "CoordinationRequest.reroute_count < COORD_REROUTE_MAX_COUNT"
          - "reassign_to_user_id is present and differs from assigned_member_user_id"
        side_effects:
          - "sets assigned_member_user_id to reassign_to_user_id"
          - "increments reroute_count by 1"
          - "recomputes ack_due_at as the current logical instant plus the tier's SLA hours"
          - "increments CoordinationRequest.version by 1"
        note: "The third decline is refused at priority 25; the request must be escalated to case review instead."
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /dmm/coordination-requests/{id}/disposition with action ACKNOWLEDGE"
        actor: CareCoordinator
        preconditions:
          - "CoordinationRequest.status == OPEN"
          - "the caller's X-User-ID == CoordinationRequest.assigned_member_user_id"
        side_effects:
          - "sets acknowledged_at to the current logical instant"
          - "increments CoordinationRequest.version by 1"
      - from: ACKNOWLEDGED
        to: COMPLETED
        trigger: "POST /dmm/coordination-requests/{id}/disposition with action COMPLETE"
        actor: CareCoordinator
        preconditions:
          - "CoordinationRequest.status == ACKNOWLEDGED"
        side_effects:
          - "records disposition_note"
          - "increments CoordinationRequest.version by 1"
      - from: OPEN
        to: ESCALATED
        trigger: "POST /dmm/coordination-requests/{id}/disposition with action ESCALATE, or POST /dmm/ops/checkpoint when the acknowledgement SLA has lapsed"
        actor: FiduciaryManager
        preconditions:
          - "CoordinationRequest.status == OPEN"
        side_effects:
          - "records disposition_note"
          - "increments CoordinationRequest.version by 1"
      - from: ACKNOWLEDGED
        to: ESCALATED
        trigger: "POST /dmm/coordination-requests/{id}/disposition with action ESCALATE"
        actor: FiduciaryManager
        preconditions:
          - "CoordinationRequest.status == ACKNOWLEDGED"
        side_effects:
          - "records disposition_note"
          - "increments CoordinationRequest.version by 1"

# ===========================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's version — the only sanctioned
# write-write conflict mechanism in this scaffold)
# ===========================================================================
concurrency_rules:
  - rule_id: payment-create-stale-account
    parent_entity: ClientAccount
    write_endpoint: "POST /dmm/payments"
    occ_field: "expected_account_version"
    description: |
      Scheduling a payment against a ClientAccount whose version has advanced
      since the preparer last read it is rejected. Two payments against the
      same account are both legitimate product behaviour, so the second
      request would succeed on its own terms; what makes it unsafe is that the
      preparer committed funds against a balance picture that a deposit, a
      hold, a settlement, a cancellation or an earlier payment has already
      moved. The stale-version check turns that into a deterministic refusal.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: statement-line-disposition-stale-period
    parent_entity: ReconciliationPeriod
    write_endpoint: "POST /dmm/statement-lines/{id}/disposition"
    occ_field: "expected_period_version"
    description: |
      Disposing of a statement line against a ReconciliationPeriod whose
      version has advanced since the reconciler last read it is rejected.
      Matching or flagging a second, different line is legitimate on its own,
      but each disposition moves the period's open_exception_count and
      unreconciled_entry_count, and a reconciler working from a stale count is
      the exact condition that lets a period be closed with an exception still
      outstanding.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: family-report-generate-stale-recipient
    parent_entity: FamilyRecipient
    write_endpoint: "POST /dmm/family-reports"
    occ_field: "expected_recipient_version"
    description: |
      Generating a report against a FamilyRecipient whose version has advanced
      since the requester last read it is rejected. Generating a second report
      is legitimate product behaviour, but permitted_categories is replaced
      wholesale by every consent call, so a report projected from a stale
      category set would disclose a category the client has just withdrawn.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ===========================================================================
# §1.3 Calculation Rules Table
# ===========================================================================
calculations:

  - name: payment_total_charge
    trigger: "POST /dmm/payments and POST /dmm/payments/{id}/revise, before any fiscal rung is evaluated"
    algorithm: tiered_pricing
    formula: |
      # Mode (c) of Difficulty Rule 2: the definition LOOKS circular because
      # total_charge_cents is what the account is charged and the fee tier is
      # the fee on that charge. The evaluation order is PINNED so the value is
      # well defined:
      #   step 1 - select the tier from amount_cents ALONE (the pre-fee principal)
      #   step 2 - read the tier's flat fee
      #   step 3 - total_charge_cents = amount_cents + service_fee_cents
      #   step 4 - NEVER re-select the tier from total_charge_cents
      if amount_cents < SERVICE_FEE_TIER1_UPPER_EXCLUSIVE_CENTS:
          service_fee_cents = SERVICE_FEE_TIER1_CENTS
      elif amount_cents < SERVICE_FEE_TIER2_UPPER_EXCLUSIVE_CENTS:
          service_fee_cents = SERVICE_FEE_TIER2_CENTS
      else:
          service_fee_cents = SERVICE_FEE_TIER3_CENTS
      total_charge_cents = amount_cents + service_fee_cents
    input_set: "the single Payment being created or revised; no other rows participate"
    constants:
      SERVICE_FEE_TIER1_UPPER_EXCLUSIVE_CENTS: 50000
      SERVICE_FEE_TIER2_UPPER_EXCLUSIVE_CENTS: 250000
      SERVICE_FEE_TIER1_CENTS: 250
      SERVICE_FEE_TIER2_CENTS: 500
      SERVICE_FEE_TIER3_CENTS: 900
    precision: "integer cents; no rounding occurs because every input and output is already an integer"
    three_bases_note: |
      Three different aggregates use three different bases and they are NOT
      interchangeable. ClientAccount.committed_disbursements_cents accumulates
      total_charge_cents. BudgetCategory.committed_cents accumulates
      amount_cents only. SuretyBond.exposure_committed_cents accumulates
      amount_cents only. A payment of 49999 cents therefore commits 50249
      against the account, 49999 against the budget line and 49999 against the
      bond.

  - name: payment_settlement_schedule
    trigger: "POST /dmm/payments writes the projected variant; POST /dmm/payments/{id}/release writes the effective variant"
    algorithm: interval_merge
    formula: |
      # Mode (a) of Difficulty Rule 2: three inputs (evaluation instant,
      # requested_send_date, channel) interacting non-linearly through a
      # cut-off test, a weekend roll and a business-day advance.
      def settlement_date(evaluation_instant, requested_send_date, channel):
          d = requested_send_date if requested_send_date is not None
              else evaluation_instant.date()
          # cut-off - INCLUSIVE at exactly SAME_DAY_CUTOFF_UTC
          if d == evaluation_instant.date() and evaluation_instant.time() >= "16:00:00":
              d = d + 1 calendar day
          # weekend roll - forward only, never backward
          while iso_weekday(d) not in BUSINESS_DAY_WEEKDAYS:
              d = d + 1 calendar day
          effective_submit_date = d
          # business-day advance - the submit date itself is NOT counted
          n = LEAD_DAYS_CHECK        if channel == "CHECK"
              else LEAD_DAYS_ACH     if channel == "ACH"
              else LEAD_DAYS_BILLER_DIRECT
          for _ in range(n):
              d = d + 1 calendar day
              while iso_weekday(d) not in BUSINESS_DAY_WEEKDAYS:
                  d = d + 1 calendar day
          return d
    input_set: "one Payment row; the logical clock supplies the evaluation instant"
    constants:
      SAME_DAY_CUTOFF_UTC: "16:00:00"
      BUSINESS_DAY_WEEKDAYS: [1, 2, 3, 4, 5]
      HOLIDAY_CALENDAR: []
      LEAD_DAYS_CHECK: 5
      LEAD_DAYS_ACH: 2
      LEAD_DAYS_BILLER_DIRECT: 0
    precision: "whole calendar dates, ISO 8601 YYYY-MM-DD"
    variants:
      - name: projected
        when: "evaluated once, at POST /dmm/payments, using the creation instant"
        difference: "written to projected_settlement_date and never recomputed afterwards, even if the payment is revised"
      - name: effective
        when: "evaluated again, at POST /dmm/payments/{id}/release, using the release instant and requested_send_date = null"
        difference: "written to effective_settlement_date; a release that happens on a later day, or on the same day but at or after the cut-off, lands on a strictly later date than the projection"

  - name: account_available_balance
    trigger: "recomputed on every mutation that touches a ClientAccount's ledger, holds, or committed payments"
    algorithm: aggregation
    formula: |
      cleared_balance_cents =
          opening_balance_cents
          + sum(LedgerEntry.amount_cents for entries where account_id == this account)
      pending_holds_cents =
          sum of every DEPOSIT-endpoint hold placed minus every hold released;
          floored at 0 - a release that would drive it below 0 is refused
      committed_disbursements_cents =
          sum(Payment.total_charge_cents
              for payments where account_id == this account
              and settlement_status in SCHEDULED, IN_FLIGHT)
      available_balance_cents =
          cleared_balance_cents - pending_holds_cents - committed_disbursements_cents
    input_set: "every LedgerEntry of the account regardless of period status (frozen entries still count); Payment rows filtered to settlement_status in SCHEDULED or IN_FLIGHT"
    constants: {}
    precision: "integer cents, exact; no rounding anywhere in this identity"
    conservation_invariant: |
      CONSERVED QUANTITY 1 - available_balance_cents. Scheduling a payment and
      then cancelling it must leave available_balance_cents byte-identical to
      its pre-scheduling value. Settling a payment must leave it unchanged
      (cleared and committed both fall by total_charge_cents). Stop-payment
      leaves it higher by total_charge_cents - STOP_PAYMENT_FEE_CENTS. A
      returned payment leaves it higher by total_charge_cents - NSF_FEE_CENTS.
    conservation_invariant_2: |
      CONSERVED QUANTITY 2 - the ledger identity
      cleared_balance_cents - opening_balance_cents == sum of every
      LedgerEntry.amount_cents for the account. Every compensating action
      appends its own reversing entry rather than deleting the original, so
      this identity holds at all times.

  - name: budget_variance
    trigger: "recomputed whenever a Payment on the line is created, revised, cancelled, stopped, settled or returned, and whenever an override is granted"
    algorithm: threshold
    formula: |
      committed_cents = sum(Payment.amount_cents
                            for payments on this line
                            with settlement_status in SCHEDULED, IN_FLIGHT, SETTLED)
      settled_cents   = sum(Payment.amount_cents
                            for payments on this line
                            with settlement_status == SETTLED)
      remaining_cents = allocation_cents + override_granted_cents - committed_cents
      variance_direction = "UNDER" if variance_ptd_cents > 0
                           else "EXACT" if variance_ptd_cents == 0
                           else "OVER"
      # Keyed to the PERIOD-TO-DATE variant on purpose. variance_full_cents can
      # never go negative, because the priority-36 rung refuses any payment that
      # would drive committed_cents above allocation_cents + override_granted_cents,
      # so an OVER direction read off the full-period variant would be an
      # unreachable enum value. variance_ptd_cents compares SETTLED spending
      # against a PRORATED allocation and goes negative as soon as a month's
      # spending front-loads, which is the ordinary case this field exists to flag.
    input_set: "Payment rows whose budget_category_id names this line, filtered by settlement_status as shown; CANCELLED, STOPPED and RETURNED payments are excluded from both sums"
    constants: {}
    precision: "integer cents; the proration in the period-to-date variant rounds half up to whole cents"
    variants:
      - name: full_period
        when: "always computed; written to variance_full_cents"
        difference: |
          variance_full_cents = allocation_cents + override_granted_cents - committed_cents
          Uses the WHOLE month's allocation and counts money that is merely
          committed, not yet settled.
      - name: period_to_date
        when: "always computed; written to variance_ptd_cents"
        difference: |
          days_in_month  = number of days in budget_month
          elapsed_days   = min(days_in_month,
                               max(0, day-of-month of the current logical date))
                           when the current logical month == budget_month;
                           0 when the current logical date precedes budget_month;
                           days_in_month when it follows budget_month
          prorated_allocation_cents =
              round_half_up((allocation_cents + override_granted_cents)
                            * elapsed_days / days_in_month)
          variance_ptd_cents = prorated_allocation_cents - settled_cents
          Uses a PRORATED allocation and counts only money that has actually
          settled. For the same row the two variants disagree whenever the
          month is partly elapsed or any payment is still unsettled.
    conservation_invariant: |
      CONSERVED QUANTITY 3 - budget line capacity. At all times
      committed_cents + remaining_cents == allocation_cents + override_granted_cents.
      Scheduling then cancelling a payment restores both terms exactly.

  - name: bond_exposure
    trigger: "recomputed on every Payment creation, revision, cancellation, stop, settlement and return"
    algorithm: aggregation
    formula: |
      exposure_committed_cents =
          sum(Payment.amount_cents ACROSS EVERY CLIENT
              where settlement_status in SCHEDULED, IN_FLIGHT)
      exposure_settled_inclusive_cents =
          exposure_committed_cents
          + sum(Payment.amount_cents ACROSS EVERY CLIENT
                where settlement_status == SETTLED
                and settled_on falls in the current logical calendar month)
      headroom_committed_cents = coverage_cents - exposure_committed_cents
    input_set: "every Payment row in the system belonging to any client, filtered by settlement_status as shown; only the SuretyBond whose status == IN_FORCE carries these fields"
    constants: {}
    precision: "integer cents, exact"
    variants:
      - name: committed_basis
        when: "the ceiling rung at priority 35 - this is the ONLY variant that gates a disbursement"
        difference: "counts money promised but not yet gone; refuses when exposure_committed_cents + amount_cents > coverage_cents"
      - name: settled_inclusive_basis
        when: "reported on the bond for supervisory review; never gates anything"
        difference: "additionally counts money that has already left the account this month, so it is always >= the committed basis and can exceed coverage_cents without refusing anything"
    conservation_invariant: |
      CONSERVED QUANTITY 4 - organization-wide committed exposure. Scheduling a
      payment and then cancelling it leaves exposure_committed_cents identical.
      Settling a payment moves the same cents from exposure_committed_cents into
      exposure_settled_inclusive_cents without changing their sum for the month.

  - name: fraud_risk_band
    trigger: "POST /dmm/fraud-alerts writes the intake variant; POST /dmm/fraud-alerts/{id}/disposition with action ACKNOWLEDGE writes the review variant"
    algorithm: weighted_scoring
    formula: |
      amount_points  = FRAUD_AMOUNT_POINTS_HIGH if payment.amount_cents >= FRAUD_AMOUNT_HIGH_CENTS
                       else FRAUD_AMOUNT_POINTS_MID if payment.amount_cents >= FRAUD_AMOUNT_MID_CENTS
                       else FRAUD_AMOUNT_POINTS_LOW
      novelty_points = FRAUD_NOVELTY_POINTS_NEVER_PAID if payee.settled_payment_count == 0
                       else FRAUD_NOVELTY_POINTS_THIN if payee.settled_payment_count <= FRAUD_NOVELTY_SETTLED_COUNT_THIN_MAX
                       else FRAUD_NOVELTY_POINTS_ESTABLISHED
      channel_points = FRAUD_CHANNEL_POINTS_CHECK if payment.channel == "CHECK"
                       else FRAUD_CHANNEL_POINTS_ACH if payment.channel == "ACH"
                       else FRAUD_CHANNEL_POINTS_BILLER_DIRECT
      score = amount_points + novelty_points + channel_points
      band  = "HIGH"   if score >= FRAUD_BAND_HIGH_MIN_SCORE
              else "MEDIUM" if score >= FRAUD_BAND_MEDIUM_MIN_SCORE
              else "LOW"
      ack_due_at = alert.created_at + (FRAUD_ACK_SLA_HOURS_HIGH   if intake_risk_band == "HIGH"
                                       else FRAUD_ACK_SLA_HOURS_MEDIUM if intake_risk_band == "MEDIUM"
                                       else FRAUD_ACK_SLA_HOURS_LOW) hours
    input_set: "exactly one Payment row and its Payee row; Payee.settled_payment_count is read at the moment the variant is evaluated"
    constants:
      FRAUD_AMOUNT_HIGH_CENTS: 500000
      FRAUD_AMOUNT_MID_CENTS: 100000
      FRAUD_AMOUNT_POINTS_HIGH: 50
      FRAUD_AMOUNT_POINTS_MID: 30
      FRAUD_AMOUNT_POINTS_LOW: 10
      FRAUD_NOVELTY_POINTS_NEVER_PAID: 40
      FRAUD_NOVELTY_SETTLED_COUNT_THIN_MAX: 2
      FRAUD_NOVELTY_POINTS_THIN: 20
      FRAUD_NOVELTY_POINTS_ESTABLISHED: 0
      FRAUD_CHANNEL_POINTS_CHECK: 20
      FRAUD_CHANNEL_POINTS_ACH: 10
      FRAUD_CHANNEL_POINTS_BILLER_DIRECT: 0
      FRAUD_BAND_HIGH_MIN_SCORE: 90
      FRAUD_BAND_MEDIUM_MIN_SCORE: 50
      FRAUD_ACK_SLA_HOURS_HIGH: 4
      FRAUD_ACK_SLA_HOURS_MEDIUM: 24
      FRAUD_ACK_SLA_HOURS_LOW: 72
    precision: "integer points; the maximum attainable score is 110 and the minimum is 10"
    variants:
      - name: intake
        when: "evaluated once at alert creation; written to intake_risk_score and intake_risk_band; drives ack_due_at"
        difference: "reads payee.settled_payment_count as it stands at creation time"
      - name: review
        when: "evaluated again at acknowledgement; written to review_risk_score and review_risk_band; changes nothing else"
        difference: "reads payee.settled_payment_count as it stands at acknowledgement time. If payments to that payee settled in between, novelty_points drops from 40 to 20 or from 20 to 0 and the band can fall a whole step while ack_due_at keeps the intake band's SLA."

  - name: benefit_countable_resources
    trigger: "recomputed on POST /dmm/benefit-applications and read by the submit rung at priority 38"
    algorithm: waterfall_allocation
    formula: |
      # Mode (b) of Difficulty Rule 2: rounding order matters and is PINNED to
      # ROUND PER ITEM, THEN SUM. Summing first and rounding once produces a
      # different number of cents whenever two or more rate-bearing items are
      # present.
      def countable(item):
          if item.item_type == "HOME":            return 0
          if item.item_type == "VEHICLE":         return 0
          if item.item_type == "BURIAL_FUND":     return max(0, item.value_cents - BURIAL_EXCLUSION_CAP_CENTS)
          if item.item_type == "RETIREMENT":      return round_half_up(item.value_cents * RETIREMENT_COUNTABLE_RATE)
          if item.item_type == "LIFE_INSURANCE":  return round_half_up(item.value_cents * LIFE_INSURANCE_COUNTABLE_RATE)
          if item.item_type == "CASH":            return item.value_cents
      countable_resources_gross_cents = sum(item.value_cents for item in resource_items)
      countable_resources_net_cents   = sum(countable(item) for item in resource_items)   # PINNED order
    input_set: "every element of the application's resource_items array, in the order supplied; no other rows participate"
    constants:
      BURIAL_EXCLUSION_CAP_CENTS: 150000
      RETIREMENT_COUNTABLE_RATE: 0.665
      LIFE_INSURANCE_COUNTABLE_RATE: 0.500
      PROGRAM_RESOURCE_LIMIT_CENTS_SSI: 200000
      PROGRAM_RESOURCE_LIMIT_CENTS_MEDICAID: 300000
      PROGRAM_RESOURCE_LIMIT_CENTS_SNAP: 275000
      PROGRAM_RESOURCE_LIMIT_CENTS_LIHEAP: 400000
      PROGRAM_INCOME_LIMIT_CENTS_SSI: 96700
      PROGRAM_INCOME_LIMIT_CENTS_MEDICAID: 150000
      PROGRAM_INCOME_LIMIT_CENTS_SNAP: 182000
      PROGRAM_INCOME_LIMIT_CENTS_LIHEAP: 250000
    precision: "integer cents; round_half_up applied ONCE PER ITEM, never to the sum"
    variants:
      - name: gross
        when: "always computed; written to countable_resources_gross_cents; reported only"
        difference: "no exclusion is applied at all - the raw declared value of every item"
      - name: net
        when: "always computed; written to countable_resources_net_cents; this is the figure the resource limit at priority 38 tests"
        difference: "applies the per-item exclusion table above with per-item rounding; for any application holding a HOME or VEHICLE the two variants differ by at least that item's full value"

  - name: retroactive_award_posting
    trigger: "POST /dmm/benefit-applications/{id}/record-decision with outcome APPROVED"
    algorithm: projection
    formula: |
      retro_months = (year(decision_date) * 12 + month(decision_date))
                   - (year(award_effective_date) * 12 + month(award_effective_date))
      retro_award_cents = award_monthly_amount_cents * retro_months
      # which period receives the BENEFIT_AWARD entry:
      award_month  = the YYYY-MM of award_effective_date
      award_period = the requesting account's ReconciliationPeriod whose period_month == award_month, if one exists
      if award_period exists and award_period.status in CLOSED, LOCKED:
          entry.entry_date         = the current logical date
          entry.period_id          = calculations.ledger_period_assignment(account, current logical date)
          entry.retro_period_month = award_month
          award_period.has_retro_adjustment = true      # the sole field the freeze permits writing
      else:
          entry.entry_date         = award_effective_date
          entry.period_id          = calculations.ledger_period_assignment(account, award_effective_date)
          entry.retro_period_month = null
    input_set: "one BenefitApplication and the ClientAccount named by the decision request's account_id"
    constants:
      RETRO_AWARD_MAX_LOOKBACK_DAYS: 180
    precision: "integer cents; retro_months is a whole-month difference and is 0 when award_effective_date falls in decision_date's own month"

  - name: ledger_period_assignment
    trigger: "every time a LedgerEntry is appended"
    algorithm: chronological
    formula: |
      candidates = ReconciliationPeriod rows where account_id == entry.account_id
                   and period_month == the YYYY-MM of entry.entry_date
      # period_month is unique per account (priority 18), so candidates holds
      # exactly zero or one row - no ranking or tie-break is possible or needed.
      entry.period_id = candidates[0].id if candidates is non-empty else null
      entry.frozen    = true if entry.period_id is not null
                        and that period's status in CLOSED, LOCKED
                        else false
    input_set: "ReconciliationPeriod rows of one account; the empty-candidate case yields a null period_id and an unfrozen entry"
    constants: {}
    precision: "not a numeric calculation"

  - name: authorization_scope_matrix
    trigger: "priority 8 evaluates this table on every operation that names an authorization_id"
    algorithm: constraint_propagation
    formula: |
      # rows are operations, columns are Authorization.scope_tier
      # PERMITTED means priority 8 lets the request through to the next rung.
      #
      #                                        LIMITED_BILLPAY  FULL_AGENCY  REP_PAYEE
      # schedule payment, payee_type
      #   RECURRING_BILLER                       PERMITTED       PERMITTED   PERMITTED
      #   ESSENTIAL                              REFUSED         PERMITTED   PERMITTED
      #   DISCRETIONARY                          REFUSED         PERMITTED   REFUSED
      # per-payment amount ceiling (INCLUSIVE)   250000          none        400000
      # create a BenefitApplication              REFUSED         PERMITTED   PERMITTED
      # create a FamilyRecipient                 REFUSED         PERMITTED   PERMITTED
      # file a Dispute                           PERMITTED       PERMITTED   PERMITTED
      #
      # A REFUSED cell in a row yields ERR_SCOPE_NOT_PERMITTED (403) at
      # priority 8. Breaching the amount ceiling yields
      # ERR_SCOPE_AMOUNT_EXCEEDED (422) at priority 33 - a fiscal rung, not a
      # scope rung, so a request that breaches BOTH the payee-type cell and the
      # ceiling returns ERR_SCOPE_NOT_PERMITTED.
    input_set: "one Authorization row and, for payment operations, the Payee row named by payee_id"
    constants:
      LIMITED_SCOPE_MAX_PAYMENT_CENTS: 250000
      REP_PAYEE_MAX_PAYMENT_CENTS: 400000
    precision: "not a numeric calculation apart from the two inclusive ceilings"

  - name: duplicate_payment_collision
    trigger: "priority 19, on POST /dmm/payments only"
    algorithm: interval_merge
    formula: |
      collision = EXISTS a Payment p where
            p.account_id == request.account_id
        AND p.payee_id   == request.payee_id
        AND p.amount_cents == request.amount_cents
        AND p.settlement_status in SCHEDULED, IN_FLIGHT
        AND abs(days_between(p.projected_settlement_date,
                             the new payment's projected_settlement_date))
            <= DUPLICATE_PAYMENT_BUFFER_DAYS
      if collision and request.duplicate_override is not true:
          refuse with ERR_DUPLICATE_PAYMENT_WINDOW
    input_set: "Payment rows of the same account and payee with settlement_status in SCHEDULED or IN_FLIGHT; CANCELLED, STOPPED, SETTLED and RETURNED rows never collide"
    constants:
      DUPLICATE_PAYMENT_BUFFER_DAYS: 3
    precision: |
      A SYMMETRIC buffer around a point, measured in whole calendar days and
      INCLUSIVE at the boundary - a gap of exactly 3 days collides and a gap of
      4 days does not. This is deliberately a different interval geometry from
      the reconciliation-period rule at priority 18, which partitions the
      calendar into exact non-overlapping months where adjacency is always legal.

  - name: coordination_ack_deadline
    trigger: "POST /dmm/coordination-requests and every DECLINE that reassigns the request"
    algorithm: threshold
    formula: |
      sla_hours = COORD_ACK_SLA_HOURS_URGENT        if tier == "URGENT"
                  else COORD_ACK_SLA_HOURS_ROUTINE  if tier == "ROUTINE"
                  else COORD_ACK_SLA_HOURS_INFORMATIONAL
      ack_due_at = the current logical instant + sla_hours hours
      # POST /dmm/ops/checkpoint escalates every OPEN request whose
      # ack_due_at <= the current logical instant. The boundary is INCLUSIVE -
      # a request whose ack_due_at equals the clock exactly is escalated.
    input_set: "one CoordinationRequest row"
    constants:
      COORD_ACK_SLA_HOURS_URGENT: 2
      COORD_ACK_SLA_HOURS_ROUTINE: 48
      COORD_ACK_SLA_HOURS_INFORMATIONAL: 120
      COORD_REROUTE_MAX_COUNT: 2
    precision: "whole hours added to an ISO 8601 instant with three fractional digits"

  - name: family_report_projection
    trigger: "POST /dmm/family-reports"
    algorithm: projection
    formula: |
      CATEGORY_ORDER = ["BILL_PAY", "BUDGET", "BENEFITS", "FRAUD", "CARE_TEAM", "BALANCES"]
      requested = request.requested_categories if supplied else CATEGORY_ORDER
      included  = [c for c in CATEGORY_ORDER
                   if c in requested and c in recipient.permitted_categories]
      withheld  = [c for c in CATEGORY_ORDER if c in requested and c not in included]
      accounts  = every ClientAccount whose client_id == recipient.client_id
      is_provisional = false
          if accounts is non-empty
          AND every account in accounts has a ReconciliationPeriod whose
              period_month == report_month and whose status is CLOSED or LOCKED
          else true
      total_disbursed_cents =
          sum(Payment.amount_cents for payments on those accounts
              with settlement_status == SETTLED and settled_on in report_month)
          if "BILL_PAY" in included else 0
      closing_available_balance_cents =
          sum(account.available_balance_cents for account in accounts)
          if "BALANCES" in included else 0
    input_set: "one FamilyRecipient, its Client's ClientAccount rows, and those accounts' Payment and ReconciliationPeriod rows"
    constants: {}
    precision: "integer cents; the category arrays are always emitted in CATEGORY_ORDER, never in request order"
    conservation_invariant: |
      CONSERVED QUANTITY 5 - disclosure closure. included_categories and
      withheld_categories partition requested_categories exactly - their union
      equals requested_categories and their intersection is empty, for every
      recipient and every request.

  - name: dispute_filing_window
    trigger: "priority 22, on POST /dmm/disputes"
    algorithm: threshold
    formula: |
      days_since_settlement = (the current logical date) - Payment.settled_on, in whole days
      if days_since_settlement > DISPUTE_FILING_WINDOW_DAYS:
          refuse with ERR_DISPUTE_WINDOW_EXPIRED
      # INCLUSIVE at the boundary - exactly DISPUTE_FILING_WINDOW_DAYS days
      # after settlement the dispute can still be filed; one day later it cannot.
    input_set: "one settled Payment row"
    constants:
      DISPUTE_FILING_WINDOW_DAYS: 60
      DISPUTE_PROVISIONAL_CREDIT_MAX_CENTS: 500000
    precision: "whole calendar days"

# ===========================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins when a
# single request violates several rungs)
# ===========================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role names a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the caller's role appears in the endpoint's roles list in §1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
    note: "Also covers the assigned-member check on POST /dmm/coordination-requests/{id}/disposition with action ACKNOWLEDGE, where a CareCoordinator whose X-User-ID differs from assigned_member_user_id is refused here."

  - priority: 3
    category: existence
    check: "every resource named in the path and then every resource named in the body exists, validated left to right; a missing Client yields ERR_CLIENT_NOT_FOUND and every other missing row yields ERR_RESOURCE_NOT_FOUND"
    error_id: ERR_CLIENT_NOT_FOUND
    http_status: 404
    applies_to: "all"
    secondary_error_id: ERR_RESOURCE_NOT_FOUND

  - priority: 4
    category: business_constraint
    check: "the request body carries every required field of the endpoint's §1.5 input list, each of the declared JSON type; unknown fields are ignored rather than rejected"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all"

  - priority: 5
    category: business_constraint
    check: |
      Every enum-typed input field holds a declared member. This rung is a
      CLOSED, EXHAUSTIVE list - exactly these fields route here and no others:
      Authorization.scope_tier; ClientAccount.account_type; Payee.payee_type;
      Payment.channel; Dispute.reason_code; FraudAlert.reason_code;
      BenefitApplication.program; every element of BenefitApplication.resource_items[].item_type;
      FamilyRecipient.relationship; every element of FamilyRecipient.permitted_categories;
      every element of FamilyReport.requested_categories; CoordinationRequest.tier;
      Client.capacity_determination on the capacity-determination endpoint;
      the to_status field on the client, authorization and reconciliation-period
      status endpoints; the to_posture field on the fraud-posture endpoint;
      the adjustment_type field on the adjustments endpoint; the decision field
      on the approval-decision endpoint; the event field on the settlement-event
      endpoint; the action field on the statement-line, fraud-alert,
      benefit-application-status and coordination-request disposition endpoints;
      the outcome field on the dispute-resolve and record-decision endpoints.
      No other field routes to ERR_INVALID_ENUM; a bad value anywhere else is
      ERR_VALIDATION at priority 4.
    error_id: ERR_INVALID_ENUM
    http_status: 422
    applies_to: "every endpoint that accepts one of the fields listed above"

  - priority: 6
    category: business_safety
    gate: "G1 - organization-wide bond gate"
    check: "a SuretyBond with status IN_FORCE exists and the current logical date is on or after its effective_date and on or before its expiry_date (both INCLUSIVE)"
    error_id: ERR_BOND_EXPIRED
    http_status: 409
    applies_to: "POST /dmm/payments, POST /dmm/payments/{id}/revise, POST /dmm/payments/{id}/release, POST /dmm/accounts/{id}/adjustments"
    note: "The widest gate. When no bond has ever been created this rung also fires, because no IN_FORCE bond exists."

  - priority: 7
    category: business_safety
    gate: "G2a - client-level authorization instrument gate"
    check: "the Authorization named by the request (directly, or through the Payment being acted on) has status ACTIVE and the current logical date lies between its effective_date and expiry_date INCLUSIVE"
    error_id: ERR_AUTHORIZATION_INACTIVE
    http_status: 409
    applies_to: "POST /dmm/payments, POST /dmm/payments/{id}/revise, POST /dmm/payments/{id}/release, POST /dmm/benefit-applications, POST /dmm/benefit-applications/{id}/status, POST /dmm/family-recipients, POST /dmm/family-recipients/{id}/consent, POST /dmm/family-reports"
    note: "A lapsed-but-unswept instrument (status still ACTIVE, expiry_date in the past) is refused here without waiting for POST /dmm/ops/checkpoint."

  - priority: 8
    category: business_safety
    gate: "G2b - authorization scope gate"
    check: "calculations.authorization_scope_matrix marks the requested operation PERMITTED for this instrument's scope_tier"
    error_id: ERR_SCOPE_NOT_PERMITTED
    http_status: 403
    applies_to: "POST /dmm/payments, POST /dmm/payments/{id}/revise, POST /dmm/benefit-applications, POST /dmm/family-recipients"

  - priority: 9
    category: business_safety
    gate: "G3 - account-level fraud freeze gate"
    check: "the ClientAccount named by the request has fraud_posture != FROZEN"
    error_id: ERR_ACCOUNT_FROZEN
    http_status: 409
    applies_to: "POST /dmm/payments, POST /dmm/payments/{id}/revise, POST /dmm/payments/{id}/release, POST /dmm/payments/{id}/settlement-event, POST /dmm/accounts/{id}/adjustments, POST /dmm/disputes/{id}/provisional-credit"
    note: "WATCH does not gate anything; only FROZEN does. Ordered ABOVE the period freeze because an account-wide freeze has a wider blast radius than one account-month."

  - priority: 10
    category: business_safety
    gate: "G4 - reconciliation period freeze gate"
    check: |
      The ReconciliationPeriod that would receive this request's ledger effect
      has status other than CLOSED and LOCKED. The receiving period is resolved
      by calculations.ledger_period_assignment against the request's own date
      input when it has one (adjustments.value_date, statement-line import's
      target period) and against the current logical date otherwise. When no
      period covers that date the rung passes.
    error_id: ERR_PERIOD_FROZEN
    http_status: 409
    applies_to: "POST /dmm/payments, POST /dmm/payments/{id}/revise, POST /dmm/payments/{id}/settlement-event, POST /dmm/payments/{id}/stop-payment, POST /dmm/accounts/{id}/adjustments, POST /dmm/reconciliation-periods/{id}/statement-lines, POST /dmm/statement-lines/{id}/disposition, POST /dmm/disputes/{id}/provisional-credit, POST /dmm/disputes/{id}/resolve"
    note: "Deliberately NOT applied to POST /dmm/reconciliation-periods/{id}/status (the reopen path must survive the freeze), nor to any endpoint in gate_precedence.period_freeze_exclusions.permitted_while_frozen."

  - priority: 11
    category: state
    check: "the Client governing this request has status ACTIVE"
    error_id: ERR_CLIENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /dmm/payments, POST /dmm/payments/{id}/revise, POST /dmm/payments/{id}/release, POST /dmm/benefit-applications, POST /dmm/benefit-applications/{id}/status, POST /dmm/family-recipients, POST /dmm/family-recipients/{id}/consent, POST /dmm/family-reports, POST /dmm/coordination-requests, POST /dmm/disputes"

  - priority: 12
    category: state
    check: "the target row is in a from-state that the §1.2 transition table permits for this trigger, including terminal-state lockdown"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every POST that names an existing row in its path"
    axis_split_note: |
      On a Payment the two parallel axes are checked by two DIFFERENT rungs and
      the split is normative. This rung evaluates ONLY the axis the trigger
      itself advances - settlement_status for release, settlement-event, cancel
      and stop-payment; approval_status for approval-decision and revise. The
      cross-axis precondition "release requires approval_status == APPROVED" is
      NOT this rung; it is priority 30 and returns
      ERR_SECOND_APPROVAL_REQUIRED. Releasing a payment that is SCHEDULED but
      still PENDING_SECOND_APPROVAL therefore returns
      ERR_SECOND_APPROVAL_REQUIRED, never ERR_INVALID_STATE.

  - priority: 13
    category: business_referential
    check: "the Payee and the BudgetCategory named on a payment both belong to the same Client as the ClientAccount, and the BudgetCategory.budget_month equals the YYYY-MM of the payment's projected_settlement_date"
    error_id: ERR_REFERENCE_MISMATCH
    http_status: 422
    applies_to: "POST /dmm/payments"

  - priority: 14
    category: business_referential
    check: "on a MATCH or RESOLVE_MATCHED disposition, the named LedgerEntry has period_id equal to the StatementLine's period_id and amount_cents equal to the line's amount_cents"
    error_id: ERR_REFERENCE_MISMATCH
    http_status: 422
    applies_to: "POST /dmm/statement-lines/{id}/disposition"

  - priority: 15
    category: business_constraint
    check: |
      Value constraints on already-well-typed fields, all returning
      ERR_VALIDATION - amount_cents > 0 on payments, revisions and adjustments;
      allocation_cents > 0 on budget categories; coverage_cents > 0 on bonds;
      opening_balance_cents >= 0 on accounts; asserted_monthly_income_cents >= 0
      and every resource_items[].value_cents >= 0 on applications;
      disputed_amount_cents > 0 and <= Payment.amount_cents on disputes;
      an override's added_cents > 0 and its reason at least
      BUDGET_OVERRIDE_REASON_MIN_CHARS characters; a fraud-posture NORMAL
      request's reason at least FRAUD_UNFREEZE_REASON_MIN_CHARS characters;
      a hold release that would drive pending_holds_cents below 0.
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "POST /dmm/payments, POST /dmm/payments/{id}/revise, POST /dmm/accounts, POST /dmm/accounts/{id}/adjustments, POST /dmm/accounts/{id}/fraud-posture, POST /dmm/budget-categories, POST /dmm/budget-categories/{id}/overrides, POST /dmm/surety-bonds, POST /dmm/benefit-applications, POST /dmm/disputes"

  - priority: 16
    category: business_constraint
    check: "uniqueness - (client_id, category_name, budget_month) on BudgetCategory, and (period_id, external_ref) on StatementLine"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "POST /dmm/budget-categories, POST /dmm/reconciliation-periods/{id}/statement-lines"

  - priority: 17
    category: business_temporal
    check: "an Authorization's expiry_date is strictly after its effective_date and the span between them is at most AUTHORIZATION_MAX_TERM_DAYS days INCLUSIVE; a SuretyBond's expiry_date is strictly after its effective_date"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "POST /dmm/authorizations, POST /dmm/surety-bonds"

  - priority: 18
    category: business_temporal
    check: "no ReconciliationPeriod already exists for this account with the same period_month. Calendar months partition the timeline exactly, so adjacency is always legal and only an exact repeat collides."
    error_id: ERR_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /dmm/reconciliation-periods"

  - priority: 19
    category: business_temporal
    check: "calculations.duplicate_payment_collision finds no colliding payment, or duplicate_override is true. The buffer is symmetric around projected_settlement_date and INCLUSIVE at DUPLICATE_PAYMENT_BUFFER_DAYS days."
    error_id: ERR_DUPLICATE_PAYMENT_WINDOW
    http_status: 409
    applies_to: "POST /dmm/payments"

  - priority: 20
    category: business_temporal
    check: "requested_send_date, when supplied, is not earlier than the current logical date"
    error_id: ERR_SEND_DATE_IN_PAST
    http_status: 422
    applies_to: "POST /dmm/payments"

  - priority: 21
    category: business_temporal
    check: "the current logical instant is at or before Payment.created_at plus STOP_PAYMENT_WINDOW_HOURS hours (INCLUSIVE at exactly 48 hours)"
    error_id: ERR_STOP_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /dmm/payments/{id}/stop-payment"

  - priority: 22
    category: business_temporal
    check: "the current logical date is at most DISPUTE_FILING_WINDOW_DAYS days after Payment.settled_on (INCLUSIVE at exactly 60 days)"
    error_id: ERR_DISPUTE_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /dmm/disputes"

  - priority: 23
    category: business_temporal
    check: "a reopen request arrives at or before closed_at plus PERIOD_REOPEN_WINDOW_DAYS days (INCLUSIVE at exactly 30 days). The reopen COUNT cap is NOT checked here - it is enforced structurally, because a period that has already been reopened once closes into LOCKED rather than CLOSED and the priority-12 state gate refuses the second reopen with ERR_INVALID_STATE."
    error_id: ERR_REOPEN_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /dmm/reconciliation-periods/{id}/status with to_status REOPENED"

  - priority: 24
    category: business_temporal
    check: "on an APPROVED decision, decision_date minus award_effective_date is at most RETRO_AWARD_MAX_LOOKBACK_DAYS days (INCLUSIVE at exactly 180) and award_effective_date is not after decision_date"
    error_id: ERR_RETRO_LOOKBACK_EXCEEDED
    http_status: 422
    applies_to: "POST /dmm/benefit-applications/{id}/record-decision"

  - priority: 25
    category: business_constraint
    check: "a DECLINE disposition arrives with reroute_count < COORD_REROUTE_MAX_COUNT"
    error_id: ERR_REROUTE_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /dmm/coordination-requests/{id}/disposition with action DECLINE"

  - priority: 26
    category: business_constraint
    check: "an APPEAL action arrives with appeal_count < BENEFIT_APPEAL_MAX_COUNT"
    error_id: ERR_APPEAL_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /dmm/benefit-applications/{id}/status with action APPEAL"

  - priority: 27
    category: business_constraint
    check: "a close request arrives with open_exception_count == 0; a period with zero imported lines closes successfully because the check is on the count, not on non-emptiness"
    error_id: ERR_OPEN_EXCEPTIONS
    http_status: 409
    applies_to: "POST /dmm/reconciliation-periods/{id}/status with to_status CLOSED"

  - priority: 28
    category: business_safety
    check: "the Payee named by the payment has status ACTIVE"
    error_id: ERR_PAYEE_BLOCKED
    http_status: 409
    applies_to: "POST /dmm/payments, POST /dmm/payments/{id}/revise"

  - priority: 29
    category: business_safety
    check: "the approver's X-User-ID differs from Payment.prepared_by_user_id; the same natural person may not prepare and approve the same disbursement even when acting under a different role"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /dmm/payments/{id}/approval-decision"

  - priority: 30
    category: business_safety
    check: "the payment being released has approval_status == APPROVED"
    error_id: ERR_SECOND_APPROVAL_REQUIRED
    http_status: 409
    applies_to: "POST /dmm/payments/{id}/release"

  - priority: 31
    category: business_safety
    check: "when the caller's role is Client, the governing Client has capacity_determination == RETAINS_CAPACITY"
    error_id: ERR_CAPACITY_REQUIRED
    http_status: 403
    applies_to: "POST /dmm/family-recipients/{id}/consent"

  - priority: 32
    category: business_safety
    check: "when the caller's role is Client, X-User-ID equals the governing Client.id; when the caller's role is FamilyRecipient, X-User-ID equals the FamilyRecipient.id named by the request and, on the audit export, the recipient's client_id equals the path client id"
    error_id: ERR_DISCLOSURE_DENIED
    http_status: 403
    applies_to: "POST /dmm/family-recipients/{id}/consent, POST /dmm/family-reports, GET /dmm/clients/{id}/audit-entries"

  - priority: 33
    category: business_fiscal
    check: "amount_cents is at or below the instrument's per-payment ceiling - LIMITED_SCOPE_MAX_PAYMENT_CENTS for LIMITED_BILLPAY, REP_PAYEE_MAX_PAYMENT_CENTS for REP_PAYEE, unbounded for FULL_AGENCY. Both ceilings are INCLUSIVE."
    error_id: ERR_SCOPE_AMOUNT_EXCEEDED
    http_status: 422
    applies_to: "POST /dmm/payments, POST /dmm/payments/{id}/revise"

  - priority: 34
    category: business_fiscal
    check: "the OCC field required by the endpoint (expected_account_version, expected_period_version or expected_recipient_version) equals the parent row's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /dmm/payments, POST /dmm/statement-lines/{id}/disposition, POST /dmm/family-reports"

  - priority: 35
    category: business_fiscal
    check: "SuretyBond.exposure_committed_cents + amount_cents <= coverage_cents on the IN_FORCE bond. This is an ORGANIZATION-WIDE aggregate - the request's own amount can be far below coverage and still be refused because other clients' committed payments have consumed the headroom."
    error_id: ERR_BOND_COVERAGE_EXCEEDED
    http_status: 409
    applies_to: "POST /dmm/payments, POST /dmm/payments/{id}/revise"

  - priority: 36
    category: business_fiscal
    check: "BudgetCategory.committed_cents + amount_cents <= allocation_cents + override_granted_cents. The boundary is INCLUSIVE - landing exactly on the allocation is permitted."
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /dmm/payments, POST /dmm/payments/{id}/revise"

  - priority: 37
    category: business_fiscal
    check: "ClientAccount.available_balance_cents >= total_charge_cents. The boundary is INCLUSIVE - an account with exactly the total charge available may schedule the payment."
    error_id: ERR_INSUFFICIENT_AVAILABLE
    http_status: 409
    applies_to: "POST /dmm/payments, POST /dmm/payments/{id}/revise"

  - priority: 38
    category: business_constraint
    check: "countable_resources_net_cents <= the program's resource limit AND asserted_monthly_income_cents <= the program's monthly income limit; both boundaries INCLUSIVE"
    error_id: ERR_RESOURCE_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /dmm/benefit-applications/{id}/status with action SUBMIT"

  - priority: 39
    category: business_fiscal
    check: "Dispute.disputed_amount_cents <= DISPUTE_PROVISIONAL_CREDIT_MAX_CENTS; the boundary is INCLUSIVE so exactly 500000 cents still credits"
    error_id: ERR_CREDIT_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /dmm/disputes/{id}/provisional-credit, POST /dmm/disputes/{id}/resolve with outcome UPHELD from status FILED"

# ===========================================================================
# §1.5 API Endpoint Table  (70 endpoints: 39 mutating/ops + 31 reads)
# ===========================================================================
endpoints:

  # ---- intake & client lifecycle -----------------------------------------
  - method: POST
    path: "/dmm/clients"
    description: "Open an intake file for a new daily-money-management client."
    roles: [FiduciaryManager]
    code: 201
    input: [full_name, date_of_birth, intake_reference]
    output: Client
    side_effects: ["creates the Client in status INTAKE with capacity_determination NOT_DETERMINED", "appends one AuditEntry"]

  - method: POST
    path: "/dmm/clients/{id}/capacity-determination"
    description: "Record the decisional-capacity finding for a client."
    roles: [FiduciaryManager]
    code: 200
    input: [determination, determined_on]
    output: Client
    side_effects: ["writes capacity_determination and capacity_determined_on", "increments Client.version by 1", "appends one AuditEntry"]

  - method: POST
    path: "/dmm/clients/{id}/status-change"
    description: "Drive the client status axis - ACTIVE, SUSPENDED or CLOSED."
    roles: [FiduciaryManager]
    code: 200
    input: ["to_status", "note?"]
    output: Client
    side_effects: ["runs the §1.2 Client transition for to_status", "cascades FamilyRecipient suspension or reinstatement", "on CLOSED revokes every ACTIVE Authorization of the client with the full revocation cascade", "increments Client.version by 1", "appends one AuditEntry"]

  - method: GET
    path: "/dmm/clients/{id}"
    description: "Read one client."
    roles: [FiduciaryManager, BillPaySpecialist, ComplianceOfficer, CareCoordinator, PlatformAdmin, Client]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: GET
    path: "/dmm/clients/{id}/authorizations"
    description: "List the authorization instruments issued for a client."
    roles: [FiduciaryManager, BillPaySpecialist, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Authorization[]
    side_effects: []

  - method: GET
    path: "/dmm/clients/{id}/accounts"
    description: "List the accounts under management for a client."
    roles: [FiduciaryManager, BillPaySpecialist, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ClientAccount[]
    side_effects: []

  - method: GET
    path: "/dmm/clients/{id}/payees"
    description: "List the payees authorized for a client."
    roles: [FiduciaryManager, BillPaySpecialist, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Payee[]
    side_effects: []

  - method: GET
    path: "/dmm/clients/{id}/budget-categories"
    description: "List a client's monthly budget lines."
    roles: [FiduciaryManager, BillPaySpecialist, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["budget_month?", "limit?", "offset?"]
    output: BudgetCategory[]
    side_effects: []

  - method: GET
    path: "/dmm/clients/{id}/coordination-requests"
    description: "List care-team coordination requests for a client."
    roles: [FiduciaryManager, CareCoordinator, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CoordinationRequest[]
    side_effects: []

  - method: GET
    path: "/dmm/clients/{id}/audit-entries"
    description: "Export the immutable audit trail for a client, projected by the caller's role and, for a FamilyRecipient, by the disclosure wall."
    roles: [FiduciaryManager, ComplianceOfficer, PlatformAdmin, FamilyRecipient]
    code: 200
    input: ["subject_entity?", "outcome?", "limit?", "offset?"]
    output: AuditEntry[]
    side_effects: []
    note: "A FamilyRecipient sees only entries whose disclosure_category is a member of that recipient's permitted_categories; ADMINISTRATION entries are never disclosed to a FamilyRecipient. Reading is permitted while a period is frozen."

  # ---- authorization instrument -------------------------------------------
  - method: POST
    path: "/dmm/authorizations"
    description: "Draft an authorization instrument for a client."
    roles: [FiduciaryManager]
    code: 201
    input: [client_id, scope_tier, instrument_reference, effective_date, expiry_date]
    output: Authorization
    side_effects: ["creates the Authorization in status DRAFT", "appends one AuditEntry"]

  - method: POST
    path: "/dmm/authorizations/{id}/status"
    description: "Execute a drafted instrument or revoke an active one. Permitted while a reconciliation period is frozen."
    roles: [FiduciaryManager]
    code: 200
    input: ["to_status", "revocation_reason?"]
    output: Authorization
    side_effects: ["DRAFT -> ACTIVE supersedes any other ACTIVE instrument for the client", "ACTIVE -> REVOKED runs the three-hop revocation cascade over payments, budget lines and bond exposure, and terminates recipients and withdraws applications", "increments Authorization.version by 1", "appends one AuditEntry"]

  - method: GET
    path: "/dmm/authorizations/{id}"
    description: "Read one authorization instrument."
    roles: [FiduciaryManager, BillPaySpecialist, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Authorization
    side_effects: []

  # ---- accounts & monitoring ----------------------------------------------
  - method: POST
    path: "/dmm/accounts"
    description: "Place a client account under management."
    roles: [FiduciaryManager]
    code: 201
    input: [client_id, institution_name, account_label, account_type, opening_balance_cents]
    output: ClientAccount
    side_effects: ["creates the ClientAccount with fraud_posture NORMAL and cleared_balance_cents equal to opening_balance_cents", "appends one AuditEntry"]

  - method: POST
    path: "/dmm/accounts/{id}/adjustments"
    description: "Post a deposit, place a withdrawal hold, or release a hold."
    roles: [BillPaySpecialist, FiduciaryManager]
    code: 200
    input: ["adjustment_type", "amount_cents", "value_date", "memo?"]
    output: ClientAccount
    side_effects: ["DEPOSIT appends a DEPOSIT LedgerEntry of +amount_cents dated value_date and raises cleared_balance_cents", "WITHDRAWAL_HOLD raises pending_holds_cents", "HOLD_RELEASE lowers pending_holds_cents", "recomputes available_balance_cents", "increments the covering ReconciliationPeriod.unreconciled_entry_count on a DEPOSIT", "increments ClientAccount.version by 1", "appends one AuditEntry"]

  - method: POST
    path: "/dmm/accounts/{id}/fraud-posture"
    description: "Move the account fraud posture. Permitted while a reconciliation period is frozen."
    roles: [ComplianceOfficer]
    code: 200
    input: [to_posture, reason]
    output: ClientAccount
    side_effects: ["runs the §1.2 ClientAccount transition", "a transition into FROZEN runs the FREEZE SWEEP hops A through D", "increments ClientAccount.version by 1", "appends one AuditEntry"]

  - method: GET
    path: "/dmm/accounts/{id}"
    description: "Read one account, including the four balance fields that make up the available-balance identity."
    roles: [FiduciaryManager, BillPaySpecialist, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: ClientAccount
    side_effects: []

  - method: GET
    path: "/dmm/accounts/{id}/reconciliation-periods"
    description: "List the reconciliation periods opened for an account."
    roles: [FiduciaryManager, BillPaySpecialist, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ReconciliationPeriod[]
    side_effects: []

  # ---- payees --------------------------------------------------------------
  - method: POST
    path: "/dmm/payees"
    description: "Register a payee for a client."
    roles: [BillPaySpecialist, FiduciaryManager]
    code: 201
    input: [client_id, payee_name, payee_type, remittance_reference]
    output: Payee
    side_effects: ["creates the Payee in status ACTIVE with settled_payment_count 0", "appends one AuditEntry"]

  - method: POST
    path: "/dmm/payees/{id}/block"
    description: "Block a payee after a scam or compliance finding."
    roles: [ComplianceOfficer]
    code: 200
    input: [blocked_reason]
    output: Payee
    side_effects: ["moves the Payee to BLOCKED", "cancels every SCHEDULED Payment to this payee, releasing account commitment, budget commitment and bond exposure", "increments Payee.version by 1", "appends one AuditEntry"]

  - method: GET
    path: "/dmm/payees/{id}"
    description: "Read one payee, including settled_payment_count which drives fraud novelty scoring."
    roles: [FiduciaryManager, BillPaySpecialist, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Payee
    side_effects: []

  # ---- budget --------------------------------------------------------------
  - method: POST
    path: "/dmm/budget-categories"
    description: "Create a monthly budget line for a client."
    roles: [FiduciaryManager]
    code: 201
    input: [client_id, category_name, budget_month, allocation_cents]
    output: BudgetCategory
    side_effects: ["creates the line with committed_cents 0 and computes the two variance variants", "appends one AuditEntry"]

  - method: POST
    path: "/dmm/budget-categories/{id}/overrides"
    description: "Grant an allocation override with a stated reason so a payment may exceed the original allocation."
    roles: [FiduciaryManager]
    code: 200
    input: [added_cents, reason]
    output: BudgetCategory
    side_effects: ["raises override_granted_cents by added_cents", "increments override_count by 1", "records last_override_reason", "recomputes remaining_cents and both variance variants", "increments BudgetCategory.version by 1", "appends one AuditEntry"]

  - method: GET
    path: "/dmm/budget-categories/{id}"
    description: "Read one budget line, including both variance variants."
    roles: [FiduciaryManager, BillPaySpecialist, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: BudgetCategory
    side_effects: []

  # ---- bill pay ------------------------------------------------------------
  - method: POST
    path: "/dmm/payments"
    description: "Prepare and schedule a disbursement. Commits total_charge_cents against the account, amount_cents against the budget line, and amount_cents against the bond."
    roles: [BillPaySpecialist]
    code: 201
    input: [account_id, payee_id, authorization_id, budget_category_id, amount_cents, channel, expected_account_version, "requested_send_date?", "memo?", "duplicate_override?"]
    output: Payment
    side_effects:
      - "runs calculations.payment_total_charge then calculations.payment_settlement_schedule projected variant"
      - "sets approval_status to APPROVED below SECOND_APPROVAL_THRESHOLD_CENTS and to PENDING_SECOND_APPROVAL at or above it"
      - "sets settlement_status to SCHEDULED and prepared_by_user_id to the caller's X-User-ID"
      - "raises ClientAccount.committed_disbursements_cents by total_charge_cents and recomputes available_balance_cents"
      - "raises BudgetCategory.committed_cents by amount_cents and recomputes both variance variants"
      - "raises SuretyBond.exposure_committed_cents by amount_cents"
      - "increments ClientAccount.version by 1"
      - "appends one AuditEntry"

  - method: POST
    path: "/dmm/payments/{id}/approval-decision"
    description: "Second-control approval or rejection of a payment awaiting dual control."
    roles: [FiduciaryManager, ComplianceOfficer]
    code: 200
    input: [decision, "note?"]
    output: Payment
    side_effects: ["APPROVE writes approved_by_user_id and moves approval_status to APPROVED", "REJECT moves approval_status to REJECTED and leaves settlement_status at SCHEDULED so the funds stay committed", "increments Payment.version by 1", "appends one AuditEntry"]

  - method: POST
    path: "/dmm/payments/{id}/revise"
    description: "Rework a rejected payment at a new amount; re-enters the approval axis and re-runs every fiscal rung on the delta."
    roles: [BillPaySpecialist]
    code: 200
    input: [amount_cents, "memo?"]
    output: Payment
    side_effects: ["recomputes service_fee_cents and total_charge_cents", "adjusts account commitment, budget commitment and bond exposure by their respective deltas", "re-enters PENDING_SECOND_APPROVAL or APPROVED depending on the new amount", "increments revision_count and Payment.version by 1", "appends one AuditEntry"]

  - method: POST
    path: "/dmm/payments/{id}/release"
    description: "Release an approved payment to the rail; recomputes the effective settlement date at the release instant."
    roles: [BillPaySpecialist]
    code: 200
    input: []
    output: Payment
    side_effects: ["moves settlement_status SCHEDULED -> IN_FLIGHT", "writes effective_settlement_date from the effective variant of calculations.payment_settlement_schedule", "sets released_at", "increments Payment.version by 1", "appends one AuditEntry"]

  - method: POST
    path: "/dmm/payments/{id}/settlement-event"
    description: "Record the rail's outcome - SETTLE moves IN_FLIGHT to SETTLED, RETURN moves SETTLED to RETURNED with an NSF fee."
    roles: [BillPaySpecialist]
    code: 200
    input: [event, "return_reason?"]
    output: Payment
    side_effects: ["SETTLE appends DISBURSEMENT and SERVICE_FEE ledger entries, releases the commitment, raises Payee.settled_payment_count and BudgetCategory.settled_cents, and shifts bond exposure from committed to settled-inclusive", "RETURN appends RETURN_REVERSAL and NSF_FEE ledger entries and unwinds the payee and budget counters", "increments the covering period's unreconciled_entry_count by 2", "increments Payment.version by 1", "appends one AuditEntry"]

  - method: POST
    path: "/dmm/payments/{id}/cancel"
    description: "Cancel a scheduled payment before it is released; the exact compensating action for scheduling."
    roles: [BillPaySpecialist, FiduciaryManager]
    code: 200
    input: ["reason?"]
    output: Payment
    side_effects: ["moves settlement_status SCHEDULED -> CANCELLED", "releases account commitment, budget commitment and bond exposure to their exact pre-scheduling values", "appends no LedgerEntry", "increments Payment.version by 1", "appends one AuditEntry"]

  - method: POST
    path: "/dmm/payments/{id}/stop-payment"
    description: "Stop an unsettled payment inside the stop-payment window, charging the stop fee."
    roles: [FiduciaryManager]
    code: 200
    input: [stop_reason]
    output: Payment
    side_effects: ["moves settlement_status to STOPPED from SCHEDULED or IN_FLIGHT", "appends a STOP_PAYMENT_FEE LedgerEntry of -STOP_PAYMENT_FEE_CENTS", "releases account commitment, budget commitment and bond exposure", "increments the covering period's unreconciled_entry_count by 1", "increments Payment.version by 1", "appends one AuditEntry"]

  - method: GET
    path: "/dmm/payments"
    description: "List payments with filters; the reverse-reachability channel for every Payment foreign key."
    roles: [FiduciaryManager, BillPaySpecialist, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["account_id?", "payee_id?", "authorization_id?", "budget_category_id?", "approval_status?", "settlement_status?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  - method: GET
    path: "/dmm/payments/{id}"
    description: "Read one payment, including both parallel status axes and both settlement-date variants."
    roles: [FiduciaryManager, BillPaySpecialist, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: GET
    path: "/dmm/payments/{id}/disputes"
    description: "List the disputes filed against a payment."
    roles: [FiduciaryManager, BillPaySpecialist, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Dispute[]
    side_effects: []

  # ---- disputes ------------------------------------------------------------
  - method: POST
    path: "/dmm/disputes"
    description: "File a dispute against a settled payment inside the filing window."
    roles: [FiduciaryManager, ComplianceOfficer]
    code: 201
    input: [payment_id, reason_code, disputed_amount_cents]
    output: Dispute
    side_effects: ["creates the Dispute in status FILED and writes filed_on and days_since_settlement", "appends one AuditEntry"]

  - method: POST
    path: "/dmm/disputes/{id}/provisional-credit"
    description: "Apply the provisional credit for a filed dispute."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Dispute
    side_effects: ["moves the Dispute to PROVISIONAL_CREDITED", "appends a DISPUTE_PROVISIONAL_CREDIT LedgerEntry of +disputed_amount_cents", "raises cleared_balance_cents and available_balance_cents", "increments the covering period's unreconciled_entry_count by 1", "increments Dispute.version by 1", "appends one AuditEntry"]

  - method: POST
    path: "/dmm/disputes/{id}/resolve"
    description: "Resolve a dispute; UPHELD keeps or grants the credit, DENIED reverses it."
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome, "resolution_note?"]
    output: Dispute
    side_effects: ["DENIED from PROVISIONAL_CREDITED appends a DISPUTE_CREDIT_REVERSAL LedgerEntry of -provisional_credit_cents, restoring cleared_balance_cents exactly", "UPHELD from FILED appends the credit instead", "increments Dispute.version by 1", "appends one AuditEntry"]

  - method: GET
    path: "/dmm/disputes/{id}"
    description: "Read one dispute."
    roles: [FiduciaryManager, BillPaySpecialist, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Dispute
    side_effects: []

  # ---- bookkeeping & statement reconciliation ------------------------------
  - method: POST
    path: "/dmm/reconciliation-periods"
    description: "Open a reconciliation period for one account-month."
    roles: [BillPaySpecialist, FiduciaryManager]
    code: 201
    input: [account_id, period_month]
    output: ReconciliationPeriod
    side_effects: ["creates the period in status OPEN", "retroactively adopts every existing LedgerEntry of that account whose entry_date falls in period_month, raising unreconciled_entry_count accordingly", "appends one AuditEntry"]

  - method: POST
    path: "/dmm/reconciliation-periods/{id}/statement-lines"
    description: "Import one line from the institution's statement into the period."
    roles: [BillPaySpecialist]
    code: 201
    input: [external_ref, amount_cents, line_date, "line_description?"]
    output: StatementLine
    side_effects: ["creates the StatementLine in match_status UNMATCHED", "increments ReconciliationPeriod.imported_line_count by 1", "increments ReconciliationPeriod.version by 1", "appends one AuditEntry"]

  - method: POST
    path: "/dmm/reconciliation-periods/{id}/status"
    description: "Drive the period status axis - IN_REVIEW, CLOSED or REOPENED. Deliberately exempt from the period freeze so a closed period can be reopened."
    roles: [BillPaySpecialist, FiduciaryManager]
    code: 200
    input: [to_status]
    output: ReconciliationPeriod
    side_effects: ["a close lands in CLOSED when reopen_count is 0 and in LOCKED when it equals PERIOD_REOPEN_MAX_COUNT", "closing freezes every LedgerEntry dated in the period and arms the priority-10 gate", "reopening unfreezes them and increments reopen_count", "increments ReconciliationPeriod.version by 1", "appends one AuditEntry"]

  - method: POST
    path: "/dmm/statement-lines/{id}/disposition"
    description: "Match a statement line to a ledger entry, flag it as an exception, or resolve an exception. Carries the period OCC token."
    roles: [BillPaySpecialist, FiduciaryManager]
    code: 200
    input: [action, expected_period_version, "ledger_entry_id?", "exception_note?"]
    output: StatementLine
    side_effects: ["runs the §1.2 StatementLine transition for action", "moves ReconciliationPeriod.open_exception_count and unreconciled_entry_count accordingly", "increments ReconciliationPeriod.version by 1", "increments StatementLine.version by 1", "appends one AuditEntry"]

  - method: GET
    path: "/dmm/reconciliation-periods/{id}"
    description: "Read one reconciliation period, including its exception and unreconciled counters."
    roles: [FiduciaryManager, BillPaySpecialist, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: ReconciliationPeriod
    side_effects: []

  - method: GET
    path: "/dmm/statement-lines"
    description: "List statement lines with filters; the reverse-reachability channel for both StatementLine foreign keys."
    roles: [FiduciaryManager, BillPaySpecialist, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["period_id?", "matched_ledger_entry_id?", "match_status?", "limit?", "offset?"]
    output: StatementLine[]
    side_effects: []

  - method: GET
    path: "/dmm/statement-lines/{id}"
    description: "Read one statement line."
    roles: [FiduciaryManager, BillPaySpecialist, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: StatementLine
    side_effects: []

  - method: GET
    path: "/dmm/ledger-entries"
    description: "List immutable ledger entries with filters; the reverse-reachability channel for every LedgerEntry foreign key."
    roles: [FiduciaryManager, BillPaySpecialist, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["account_id?", "period_id?", "source_payment_id?", "entry_type?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  - method: GET
    path: "/dmm/ledger-entries/{id}"
    description: "Read one ledger entry; frozen is derived from its period's status at read time."
    roles: [FiduciaryManager, BillPaySpecialist, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: LedgerEntry
    side_effects: []

  # ---- fraud / scam alerts -------------------------------------------------
  - method: POST
    path: "/dmm/fraud-alerts"
    description: "Raise a fraud or scam alert against a disbursement. Permitted while a reconciliation period is frozen."
    roles: [ComplianceOfficer, BillPaySpecialist]
    code: 201
    input: [account_id, payment_id, reason_code, "detail?"]
    output: FraudAlert
    side_effects: ["creates the alert in status NEW", "writes intake_risk_score, intake_risk_band and ack_due_at from the intake variant of calculations.fraud_risk_band", "appends one AuditEntry"]

  - method: POST
    path: "/dmm/fraud-alerts/{id}/disposition"
    description: "Acknowledge, confirm, or dismiss an alert. Permitted while a reconciliation period is frozen."
    roles: [ComplianceOfficer]
    code: 200
    input: [action, "disposition_note?"]
    output: FraudAlert
    side_effects: ["ACKNOWLEDGE writes review_risk_score and review_risk_band from the review variant and sets acknowledged_at", "CONFIRM_FRAUD freezes the account and runs the FREEZE SWEEP hops A through D", "DISMISS leaves the account posture untouched", "increments FraudAlert.version by 1", "appends one AuditEntry"]

  - method: GET
    path: "/dmm/fraud-alerts"
    description: "List fraud alerts with filters; the reverse-reachability channel for both FraudAlert foreign keys."
    roles: [FiduciaryManager, BillPaySpecialist, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["account_id?", "payment_id?", "status?", "limit?", "offset?"]
    output: FraudAlert[]
    side_effects: []

  - method: GET
    path: "/dmm/fraud-alerts/{id}"
    description: "Read one fraud alert, including both risk-band variants."
    roles: [FiduciaryManager, BillPaySpecialist, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: FraudAlert
    side_effects: []

  # ---- benefit applications -------------------------------------------------
  - method: POST
    path: "/dmm/benefit-applications"
    description: "Draft a means-tested benefit application on the client's behalf."
    roles: [FiduciaryManager]
    code: 201
    input: [client_id, authorization_id, program, asserted_monthly_income_cents, resource_items]
    output: BenefitApplication
    side_effects: ["creates the application in status DRAFT", "computes both variants of calculations.benefit_countable_resources", "appends one AuditEntry"]

  - method: POST
    path: "/dmm/benefit-applications/{id}/status"
    description: "Submit a drafted application or appeal a denial."
    roles: [FiduciaryManager]
    code: 200
    input: [action]
    output: BenefitApplication
    side_effects: ["SUBMIT tests both program limits and writes submitted_on", "APPEAL increments appeal_count", "increments BenefitApplication.version by 1", "appends one AuditEntry"]

  - method: POST
    path: "/dmm/benefit-applications/{id}/record-decision"
    description: "Record the awarding agency's decision, including a possibly retroactive award. Permitted while a reconciliation period is frozen."
    roles: [FiduciaryManager]
    code: 200
    input: [outcome, decision_date, account_id, "award_effective_date?", "award_monthly_amount_cents?", "denial_reason?"]
    output: BenefitApplication
    side_effects: ["APPROVED runs calculations.retroactive_award_posting, appends a BENEFIT_AWARD LedgerEntry and raises the account balances", "an award whose month is already CLOSED or LOCKED posts into the current period and sets that closed period's has_retro_adjustment true", "DENIED writes denial_reason and always lands in DENIED, whether the decision came from SUBMITTED or from APPEALED", "increments BenefitApplication.version by 1", "appends one AuditEntry"]

  - method: GET
    path: "/dmm/benefit-applications"
    description: "List benefit applications with filters; the reverse-reachability channel for both BenefitApplication foreign keys."
    roles: [FiduciaryManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["client_id?", "authorization_id?", "status?", "limit?", "offset?"]
    output: BenefitApplication[]
    side_effects: []

  - method: GET
    path: "/dmm/benefit-applications/{id}"
    description: "Read one benefit application, including both countable-resource variants."
    roles: [FiduciaryManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: BenefitApplication
    side_effects: []

  # ---- bonded / insured ------------------------------------------------------
  - method: POST
    path: "/dmm/surety-bonds"
    description: "Register the organization's surety bond. Creating a bond supersedes any bond currently IN_FORCE."
    roles: [PlatformAdmin]
    code: 201
    input: [carrier_name, bond_number, coverage_cents, effective_date, expiry_date]
    output: SuretyBond
    side_effects: ["creates the bond in status IN_FORCE", "moves any previously IN_FORCE bond to SUPERSEDED", "recomputes both exposure variants against the current payment population", "appends one AuditEntry"]

  - method: GET
    path: "/dmm/surety-bonds/{id}"
    description: "Read one surety bond, including both exposure variants and the committed headroom."
    roles: [FiduciaryManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: SuretyBond
    side_effects: []

  # ---- family reporting -------------------------------------------------------
  - method: POST
    path: "/dmm/family-recipients"
    description: "Enrol a family member or trusted contact as a report recipient under an authorization instrument."
    roles: [FiduciaryManager]
    code: 201
    input: [client_id, authorization_id, full_name, contact_email, relationship]
    output: FamilyRecipient
    side_effects: ["creates the recipient in subscription_status PENDING with an empty permitted_categories", "appends one AuditEntry"]

  - method: POST
    path: "/dmm/family-recipients/{id}/consent"
    description: "Record or replace the disclosure categories this recipient may see. A Client caller must retain decisional capacity."
    roles: [Client, FiduciaryManager]
    code: 200
    input: [permitted_categories]
    output: FamilyRecipient
    side_effects: ["replaces permitted_categories wholesale", "moves PENDING to ACTIVE, or re-enters ACTIVE", "writes consent_recorded_by_role and consent_recorded_at", "increments FamilyRecipient.version by 1", "appends one AuditEntry"]

  - method: POST
    path: "/dmm/family-reports"
    description: "Generate a monthly family report projected through the disclosure wall. Carries the recipient OCC token. Permitted while a reconciliation period is frozen."
    roles: [FamilyRecipient, FiduciaryManager]
    code: 201
    input: [recipient_id, report_month, expected_recipient_version, "requested_categories?"]
    output: FamilyReport
    side_effects: ["runs calculations.family_report_projection", "marks is_provisional true unless every account of the client has a CLOSED or LOCKED period for report_month", "increments FamilyRecipient.report_count and FamilyRecipient.version by 1", "appends one AuditEntry"]

  - method: GET
    path: "/dmm/family-recipients"
    description: "List family recipients with filters; the reverse-reachability channel for both FamilyRecipient foreign keys."
    roles: [FiduciaryManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["client_id?", "authorization_id?", "subscription_status?", "limit?", "offset?"]
    output: FamilyRecipient[]
    side_effects: []

  - method: GET
    path: "/dmm/family-recipients/{id}"
    description: "Read one family recipient, including permitted_categories and the version the report OCC token must carry."
    roles: [FiduciaryManager, ComplianceOfficer, PlatformAdmin, FamilyRecipient]
    code: 200
    input: []
    output: FamilyRecipient
    side_effects: []

  - method: GET
    path: "/dmm/family-reports"
    description: "List generated family reports; the reverse-reachability channel for FamilyReport.recipient_id."
    roles: [FiduciaryManager, ComplianceOfficer, PlatformAdmin, FamilyRecipient]
    code: 200
    input: ["recipient_id?", "report_month?", "limit?", "offset?"]
    output: FamilyReport[]
    side_effects: []

  - method: GET
    path: "/dmm/family-reports/{id}"
    description: "Read one generated family report."
    roles: [FiduciaryManager, ComplianceOfficer, PlatformAdmin, FamilyRecipient]
    code: 200
    input: []
    output: FamilyReport
    side_effects: []

  # ---- care-team coordination --------------------------------------------------
  - method: POST
    path: "/dmm/coordination-requests"
    description: "Open a care-team coordination request with a tier-dependent acknowledgement deadline."
    roles: [CareCoordinator, FiduciaryManager]
    code: 201
    input: [client_id, subject, tier, assigned_member_user_id]
    output: CoordinationRequest
    side_effects: ["creates the request in status OPEN with reroute_count 0", "writes ack_due_at from calculations.coordination_ack_deadline", "appends one AuditEntry"]

  - method: POST
    path: "/dmm/coordination-requests/{id}/disposition"
    description: "Acknowledge, decline-and-reroute, complete, or escalate a coordination request."
    roles: [CareCoordinator, FiduciaryManager]
    code: 200
    input: [action, "reassign_to_user_id?", "disposition_note?"]
    output: CoordinationRequest
    side_effects: ["ACKNOWLEDGE requires the caller to be the assigned member and writes acknowledged_at", "DECLINE reassigns, increments reroute_count and recomputes ack_due_at, refusing once the cap is reached", "COMPLETE and ESCALATE are terminal", "increments CoordinationRequest.version by 1", "appends one AuditEntry"]

  - method: GET
    path: "/dmm/coordination-requests/{id}"
    description: "Read one coordination request."
    roles: [FiduciaryManager, CareCoordinator, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: CoordinationRequest
    side_effects: []

  # ---- clock & operations ------------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-05-01T00:00:00Z and never falls back to real wall-clock time; every deadline, window and expiry rule in this scaffold is evaluated against the logical clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["moves the logical clock; performs no sweep of its own", "appends one AuditEntry with subject_entity System"]

  - method: POST
    path: "/dmm/ops/checkpoint"
    description: "Run the periodic sweep - expire lapsed authorizations, escalate fraud alerts past their acknowledgement SLA, and escalate coordination requests past theirs."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "{ authorizations_expired: integer, alerts_escalated: integer, coordination_requests_escalated: integer }"
    side_effects: ["moves ACTIVE authorizations whose expiry_date precedes the current logical date to EXPIRED", "moves NEW fraud alerts whose ack_due_at is at or before the clock to ESCALATED", "moves OPEN coordination requests whose ack_due_at is at or before the clock to ESCALATED", "appends one AuditEntry with subject_entity System"]

# ===========================================================================
# §1.6 Error Code Catalog (36 codes)
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID is missing, or X-User-Role names no role declared in §1.7"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the caller's role is not listed for the endpoint in §1.5, or a CareCoordinator acknowledges a coordination request assigned to a different member"
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "a Client named in the path or body does not exist"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "any non-Client resource named in the path or body does not exist"
  - id: ERR_VALIDATION
    http: 422
    condition: "a required field is missing or mistyped, a value constraint at priority 15 is violated, a uniqueness constraint at priority 16 is violated, or a date-span constraint at priority 17 is violated"
  - id: ERR_INVALID_ENUM
    http: 422
    condition: "one of the enum-typed fields on the closed list at priority 5 holds a value that is not a declared member"
  - id: ERR_BOND_EXPIRED
    http: 409
    condition: "no SuretyBond is IN_FORCE, or the IN_FORCE bond's coverage window does not contain the current logical date"
  - id: ERR_BOND_COVERAGE_EXCEEDED
    http: 409
    condition: "the organization-wide committed exposure plus this payment's amount_cents would exceed the IN_FORCE bond's coverage_cents"
  - id: ERR_AUTHORIZATION_INACTIVE
    http: 409
    condition: "the governing Authorization is not ACTIVE, or its effective/expiry window does not contain the current logical date"
  - id: ERR_SCOPE_NOT_PERMITTED
    http: 403
    condition: "the authorization scope matrix marks this operation REFUSED for the instrument's scope_tier"
  - id: ERR_SCOPE_AMOUNT_EXCEEDED
    http: 422
    condition: "amount_cents exceeds the instrument's per-payment ceiling"
  - id: ERR_ACCOUNT_FROZEN
    http: 409
    condition: "the ClientAccount's fraud_posture is FROZEN"
  - id: ERR_PERIOD_FROZEN
    http: 409
    condition: "the ReconciliationPeriod that would receive this request's ledger effect is CLOSED or LOCKED"
  - id: ERR_CLIENT_NOT_ACTIVE
    http: 409
    condition: "the governing Client's status is not ACTIVE"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target row's current state does not permit this trigger, including any attempt to move out of a terminal state"
  - id: ERR_REFERENCE_MISMATCH
    http: 422
    condition: "a payment's payee or budget line belongs to a different client or a different month, or a matched ledger entry belongs to a different period or carries a different amount"
  - id: ERR_SEND_DATE_IN_PAST
    http: 422
    condition: "requested_send_date is earlier than the current logical date"
  - id: ERR_PERIOD_OVERLAP
    http: 409
    condition: "a ReconciliationPeriod already exists for this account with the same period_month"
  - id: ERR_DUPLICATE_PAYMENT_WINDOW
    http: 409
    condition: "an unsettled payment to the same account and payee for the same amount projects to settle within DUPLICATE_PAYMENT_BUFFER_DAYS days, and duplicate_override is not true"
  - id: ERR_STOP_WINDOW_EXPIRED
    http: 409
    condition: "the stop-payment request arrives more than STOP_PAYMENT_WINDOW_HOURS hours after the payment was created"
  - id: ERR_DISPUTE_WINDOW_EXPIRED
    http: 409
    condition: "the dispute is filed more than DISPUTE_FILING_WINDOW_DAYS days after the payment settled"
  - id: ERR_REOPEN_NOT_PERMITTED
    http: 409
    condition: "a reopen arrives more than PERIOD_REOPEN_WINDOW_DAYS days after the period was closed"
  - id: ERR_RETRO_LOOKBACK_EXCEEDED
    http: 422
    condition: "award_effective_date precedes decision_date by more than RETRO_AWARD_MAX_LOOKBACK_DAYS days, or falls after decision_date"
  - id: ERR_APPEAL_LIMIT_REACHED
    http: 409
    condition: "an appeal is requested when appeal_count already equals BENEFIT_APPEAL_MAX_COUNT"
  - id: ERR_REROUTE_LIMIT_REACHED
    http: 409
    condition: "a decline is requested when reroute_count already equals COORD_REROUTE_MAX_COUNT"
  - id: ERR_OPEN_EXCEPTIONS
    http: 409
    condition: "a period close is requested while open_exception_count is greater than zero"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the approver's X-User-ID equals the payment's prepared_by_user_id"
  - id: ERR_SECOND_APPROVAL_REQUIRED
    http: 409
    condition: "a release is requested while approval_status is not APPROVED"
  - id: ERR_PAYEE_BLOCKED
    http: 409
    condition: "the payee named by the payment has status BLOCKED"
  - id: ERR_CAPACITY_REQUIRED
    http: 403
    condition: "a Client caller records consent while capacity_determination is not RETAINS_CAPACITY"
  - id: ERR_DISCLOSURE_DENIED
    http: 403
    condition: "a Client or FamilyRecipient caller acts on a resource that does not belong to them"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "an expected_account_version, expected_period_version or expected_recipient_version does not equal the parent row's current version"
  - id: ERR_BUDGET_EXCEEDED
    http: 409
    condition: "the budget line's committed_cents plus amount_cents would exceed allocation_cents plus override_granted_cents"
  - id: ERR_INSUFFICIENT_AVAILABLE
    http: 409
    condition: "the account's available_balance_cents is less than total_charge_cents"
  - id: ERR_CREDIT_CAP_EXCEEDED
    http: 409
    condition: "a provisional credit is requested for more than DISPUTE_PROVISIONAL_CREDIT_MAX_CENTS"
  - id: ERR_RESOURCE_LIMIT_EXCEEDED
    http: 409
    condition: "an application is submitted whose countable_resources_net_cents or asserted_monthly_income_cents exceeds the program limit"

# ===========================================================================
# §1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: PlatformAdmin
    description: "Operator of the platform. Registers the surety bond, drives the logical clock, and runs the periodic checkpoint sweep."
    identity: "opaque"
    exclusive_operations:
      - "POST /dmm/surety-bonds"
      - "POST /_clock/set_current_utc"
      - "POST /dmm/ops/checkpoint"
    shared_operations:
      - "every GET endpoint except GET /dmm/family-reports and GET /dmm/family-reports/{id} which it also reads"

  - name: FiduciaryManager
    description: "Licensed daily-money manager. Runs intake, issues and revokes authorization instruments, grants budget overrides, gives second-control approval, closes and reopens reconciliation periods, and files benefit applications."
    identity: "opaque"
    exclusive_operations:
      - "POST /dmm/clients"
      - "POST /dmm/clients/{id}/capacity-determination"
      - "POST /dmm/clients/{id}/status-change"
      - "POST /dmm/authorizations"
      - "POST /dmm/authorizations/{id}/status"
      - "POST /dmm/accounts"
      - "POST /dmm/budget-categories"
      - "POST /dmm/budget-categories/{id}/overrides"
      - "POST /dmm/payments/{id}/stop-payment"
      - "POST /dmm/benefit-applications"
      - "POST /dmm/benefit-applications/{id}/status"
      - "POST /dmm/benefit-applications/{id}/record-decision"
      - "POST /dmm/family-recipients"
    shared_operations:
      - "POST /dmm/payments/{id}/approval-decision (with ComplianceOfficer)"
      - "POST /dmm/payments/{id}/cancel (with BillPaySpecialist)"
      - "POST /dmm/accounts/{id}/adjustments (with BillPaySpecialist)"
      - "POST /dmm/payees (with BillPaySpecialist)"
      - "POST /dmm/reconciliation-periods (with BillPaySpecialist)"
      - "POST /dmm/reconciliation-periods/{id}/status (with BillPaySpecialist)"
      - "POST /dmm/statement-lines/{id}/disposition (with BillPaySpecialist)"
      - "POST /dmm/disputes (with ComplianceOfficer)"
      - "POST /dmm/family-recipients/{id}/consent (with Client)"
      - "POST /dmm/family-reports (with FamilyRecipient)"
      - "POST /dmm/coordination-requests and its disposition endpoint (with CareCoordinator)"
      - "all business GET endpoints"

  - name: BillPaySpecialist
    description: "Prepares disbursements, posts deposits and holds, imports and matches statement lines. Under segregation of duties this role can never approve its own payment - it is not listed on the approval-decision endpoint at all."
    identity: "opaque"
    exclusive_operations:
      - "POST /dmm/payments"
      - "POST /dmm/payments/{id}/revise"
      - "POST /dmm/payments/{id}/release"
      - "POST /dmm/payments/{id}/settlement-event"
      - "POST /dmm/reconciliation-periods/{id}/statement-lines"
    shared_operations:
      - "POST /dmm/payees (with FiduciaryManager)"
      - "POST /dmm/accounts/{id}/adjustments (with FiduciaryManager)"
      - "POST /dmm/payments/{id}/cancel (with FiduciaryManager)"
      - "POST /dmm/reconciliation-periods (with FiduciaryManager)"
      - "POST /dmm/reconciliation-periods/{id}/status (with FiduciaryManager)"
      - "POST /dmm/statement-lines/{id}/disposition (with FiduciaryManager)"
      - "POST /dmm/fraud-alerts (with ComplianceOfficer)"
      - "all business GET endpoints except the audit export and the family-report endpoints"

  - name: ComplianceOfficer
    description: "Adjudicates fraud alerts and disputes, blocks payees, drives the account fraud posture, reads the audit trail, and may serve as the second approver on a disbursement."
    identity: "opaque"
    exclusive_operations:
      - "POST /dmm/payees/{id}/block"
      - "POST /dmm/accounts/{id}/fraud-posture"
      - "POST /dmm/fraud-alerts/{id}/disposition"
      - "POST /dmm/disputes/{id}/provisional-credit"
      - "POST /dmm/disputes/{id}/resolve"
    shared_operations:
      - "POST /dmm/payments/{id}/approval-decision (with FiduciaryManager)"
      - "POST /dmm/fraud-alerts (with BillPaySpecialist)"
      - "POST /dmm/disputes (with FiduciaryManager)"
      - "GET /dmm/clients/{id}/audit-entries (with FiduciaryManager, PlatformAdmin and FamilyRecipient)"
      - "all business GET endpoints"

  - name: CareCoordinator
    description: "Care-team member. Opens coordination requests and acknowledges, declines, completes or escalates the ones assigned to them."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /dmm/coordination-requests (with FiduciaryManager)"
      - "POST /dmm/coordination-requests/{id}/disposition (with FiduciaryManager)"
      - "GET /dmm/clients/{id}, GET /dmm/clients/{id}/coordination-requests, GET /dmm/coordination-requests/{id}"
    note: "X-User-ID is the opaque care-team member identifier stored on CoordinationRequest.assigned_member_user_id; it is never required to equal any entity's id."

  - name: Client
    description: "The person under service. May set or replace the disclosure categories a family recipient can see, provided the capacity determination says they retain decisional capacity."
    identity: "entity_backed:Client"
    exclusive_operations: []
    shared_operations:
      - "POST /dmm/family-recipients/{id}/consent (with FiduciaryManager)"
      - "GET /dmm/clients/{id} for their own file"
    note: "X-User-ID equals the Client.id; priority 32 refuses any attempt to act on another client's recipient."

  - name: FamilyRecipient
    description: "Family member or trusted contact receiving monthly reports, projected through the disclosure wall."
    identity: "entity_backed:FamilyRecipient"
    exclusive_operations: []
    shared_operations:
      - "POST /dmm/family-reports (with FiduciaryManager)"
      - "GET /dmm/family-reports, GET /dmm/family-reports/{id}, GET /dmm/family-recipients/{id}"
      - "GET /dmm/clients/{id}/audit-entries, projected to the recipient's permitted_categories"
    note: "X-User-ID equals the FamilyRecipient.id; priority 32 refuses reports for any other recipient."
