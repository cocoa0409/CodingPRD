      - name: empty_period_effectiveness_lands_exactly_on_mid_band_edge
        grounds:
          - calculations.mitigation_effectiveness_score
          - entities.EffectivenessReport.fields.score_band
          - entities.EffectivenessReport.fields.data_sufficiency
          - "endpoints[POST /rmd/effectiveness-reports]"
        distinguishing_aspect: |
          A different metric on a different endpoint: effectiveness_score against
          MID_BAND_THRESHOLD 0.6000, on POST /rmd/effectiveness-reports. A provider
          with no signed calls, no tracebacks and no notices scores
          0.40*0.0000 + 0.35*1.0000 + 0.25*1.0000 = 0.6000 exactly, which must band
          MID (not LOW) while data_sufficiency is INSUFFICIENT. The band edge is then
          observable in money: TIER_2 x MID credits 300000 cents, where LOW would
          credit 150000 and NONE 0.
        test_recipe:
          setup:
            - "Provider with an ACCEPTED mitigation plan filed by officer-1 and no attestations, tracebacks or notices at all"
            - "Logical clock at 2026-09-01T00:00:00Z so the period [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z) has just elapsed"
