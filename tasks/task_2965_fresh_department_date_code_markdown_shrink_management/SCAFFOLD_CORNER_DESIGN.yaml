          - entities.DonationPickup.fields.manifest_credit_cents
          - entities.DonationLotAssignment.fields.line_credit_cents
        distinguishing_aspect: |
          The valuation switches input set when the manifest switches phase: at seal it credits the
          two ASSIGNED lines for 7488 = 2 * round_half_up(5990 * 0.625), and at reconcile it
          re-runs over PICKED_UP lines only, so the line REJECTED by a post-seal withdrawal drops
