    output: "Technician[]"
    side_effects: []
  - method: GET
    path: "/api/technicians/{id}"
    description: "Get a technician."
    roles: [SiteManager, ConversionTechnician, PlatformAdmin]
    code: 200
    input: []
    output: Technician
    side_effects: []
  - method: GET
    path: "/api/technicians/{id}/conversion-events"
    description: "List conversion events assigned to a technician."
    roles: [SiteManager, ConversionTechnician, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "ConversionEvent[]"
    side_effects: []
  - method: POST
