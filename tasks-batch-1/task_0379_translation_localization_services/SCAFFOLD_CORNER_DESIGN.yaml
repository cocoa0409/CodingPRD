# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Translation & Localization Services — Expert
#
# Breadth probe over §1.1–§1.7 per references/claim-extraction-guide.md.
# Sections / claim_types are taken verbatim from the guide. excluded_because
# stubs point at §1.8 instances that already exercise the corner.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_client_returns_201_with_system_fields
        claim_type: Creation
        grounds:
          - entities.Client
          - endpoints
        distinguishing_aspect: "POST /clients with name+billing_email → 201; response carries server-minted id, created_at, version=1, status=ACTIVE, ar_balance_cents=0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { name: "Acme", billing_email: "ar@acme.test" }
              as: ProjectManager
              captures: { cid: $.data.id, st: $.data.status, ar: $.data.ar_balance_cents, v: $.data.version }
          assert:
            - "response code == 201"
            - "Client.status == ACTIVE"
            - "Client.ar_balance_cents == 0"
            - "Client.version == 1"

      - name: get_client_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Client
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /clients/{id} for a non-existent UUID → ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /clients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "response code == 404"
            - "error_id == ERR_NOT_FOUND"

      - name: create_project_missing_rate_card_id_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Project.fields.rate_card_id
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /projects omitting required rate_card_id → ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Client exists."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Acme", billing_email: "ar@acme.test" }
              as: ProjectManager
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { client_id: "${cid}", name: "NoRate" }
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "response code == 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: create_project_defaults_rush_and_cert
        claim_type: Defaults
        grounds:
          - entities.Project.fields.rush_tier
          - entities.Project.fields.certification_mode
        distinguishing_aspect: "POST /projects omitting rush_tier and certification_mode → rush_tier=STANDARD, certification_mode=NONE applied."
        test_recipe:
          setup: ["Client + RateCard exist."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Acme", billing_email: "ar@acme.test" }
              as: ProjectManager
              captures: { cid: $.data.id }
            - call: "POST /rate-cards"
              payload: { source_locale: "en-US", target_locale: "de-DE", base_rate_cents_per_word: 15, linguist_rate_cents_per_word: 9 }
              as: ProjectManager
              captures: { rc: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { client_id: "${cid}", rate_card_id: "${rc}", name: "Def" }
              as: ProjectManager
              captures: { rt: $.data.rush_tier, cm: $.data.certification_mode }
          assert:
            - "Project.rush_tier == STANDARD"
            - "Project.certification_mode == NONE"

      - name: project_pins_rates_from_rate_card_system_fields
        claim_type: System Fields
        grounds:
          - entities.Project.fields.pinned_base_rate_cents_per_word
          - entities.Project.fields.pinned_linguist_rate_cents_per_word
        distinguishing_aspect: "POST /projects copies pinned_base_rate=15 and pinned_linguist_rate=9 from the rate card; client-sent pinned_* are ignored (not in input)."
        test_recipe:
          setup: ["Client + RateCard(base 15, linguist 9) exist."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Acme", billing_email: "ar@acme.test" }
              as: ProjectManager
              captures: { cid: $.data.id }
            - call: "POST /rate-cards"
              payload: { source_locale: "en-US", target_locale: "de-DE", base_rate_cents_per_word: 15, linguist_rate_cents_per_word: 9 }
              as: ProjectManager
              captures: { rc: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { client_id: "${cid}", rate_card_id: "${rc}", name: "Pin" }
              as: ProjectManager
              captures: { pb: $.data.pinned_base_rate_cents_per_word, pl: $.data.pinned_linguist_rate_cents_per_word }
          assert:
            - "Project.pinned_base_rate_cents_per_word == 15"
            - "Project.pinned_linguist_rate_cents_per_word == 9"

      - name: create_project_invalid_rush_tier_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Project.fields.rush_tier
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /projects with rush_tier='OVERNIGHT' (not in STANDARD|EXPRESS|SAME_DAY) → ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Client + RateCard exist."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Acme", billing_email: "ar@acme.test" }
              as: ProjectManager
              captures: { cid: $.data.id }
            - call: "POST /rate-cards"
              payload: { source_locale: "en-US", target_locale: "de-DE", base_rate_cents_per_word: 15, linguist_rate_cents_per_word: 9 }
              as: ProjectManager
              captures: { rc: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { client_id: "${cid}", rate_card_id: "${rc}", name: "Bad", rush_tier: "OVERNIGHT" }
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "response code == 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: ratecard_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.RateCard
        distinguishing_aspect: "RateCard has common_fields:false → response has id and created_at but no version field; there is no PUT/PATCH endpoint for rate cards."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /rate-cards"
              payload: { source_locale: "en-US", target_locale: "de-DE", base_rate_cents_per_word: 15, linguist_rate_cents_per_word: 9 }
              as: ProjectManager
              captures: { rc: $.data.id, ca: $.data.created_at }
          assert:
            - "response code == 201"
            - "RateCard response has created_at"
            - "no PUT or PATCH /rate-cards endpoint exists in §1.5"

      - name: project_quoted_total_computed_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Project.fields.quoted_total_cents
          - calculations.quote_estimate
        excluded_because:
          difficulty_instance: combinatorial_formula / cf_quote_nested_tier_rush_cert_mode_a
          rationale: "quoted_total_cents correctness from quote is asserted (==39613) by the named §1.8 instance."

      - name: list_projects_paginated_envelope
        claim_type: Listing
        grounds:
          - entities.Project
          - endpoints
        distinguishing_aspect: "GET /projects returns an array envelope with pagination fields limit/offset/total_count/has_more."
        test_recipe:
          setup: ["One client, one rate card, two projects created."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Acme", billing_email: "ar@acme.test" }
              as: ProjectManager
              captures: { cid: $.data.id }
            - call: "POST /rate-cards"
              payload: { source_locale: "en-US", target_locale: "de-DE", base_rate_cents_per_word: 15, linguist_rate_cents_per_word: 9 }
              as: ProjectManager
              captures: { rc: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${cid}", rate_card_id: "${rc}", name: "P1" }
              as: ProjectManager
            - call: "POST /projects"
              payload: { client_id: "${cid}", rate_card_id: "${rc}", name: "P2" }
              as: ProjectManager
          trigger:
            - call: "GET /projects"
              payload: { client_id: "${cid}" }
              as: ProjectManager
          assert:
            - "response_type == array"
            - "meta includes total_count and has_more"
            - "data length == 2"

      - name: payout_ledger_commit_entry_minted_on_accept
        claim_type: Creation
        grounds:
          - entities.PayoutLedgerEntry
          - entities.PayoutLedgerEntry.fields.entry_type
          - entities.PayoutLedgerEntry.fields.amount_cents
        distinguishing_aspect: "Accepting a translator assignment appends exactly one COMMIT PayoutLedgerEntry with amount_cents=+15975, discoverable via GET /linguists/{id}/payout-ledger (system-minted, no POST)."
        test_recipe:
          setup: ["Translator accepts the assignment on an APPROVED project (provisional 15975)."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Acme", billing_email: "ar@acme.test" }
              as: ProjectManager
              captures: { cid: $.data.id }
            - call: "POST /rate-cards"
              payload: { source_locale: "en-US", target_locale: "de-DE", base_rate_cents_per_word: 15, linguist_rate_cents_per_word: 9 }
              as: ProjectManager
              captures: { rc: $.data.id }
            - call: "POST /linguists"
              payload: { full_name: "T", native_locale: "de-DE", qualified_pairs: [ { source_locale: "en-US", target_locale: "de-DE" } ] }
              as: ProjectManager
              captures: { tl: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${cid}", rate_card_id: "${rc}", name: "P1" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /projects/${pid}/jobs"
              payload: { filename: "a.docx", quoted_no_match_words: 1200, quoted_fuzzy_words: 600, quoted_reps_words: 400, quoted_context_words: 300 }
              as: ProjectManager
              captures: { jid: $.data.id }
            - call: "POST /projects/${pid}/quote"
              payload: {}
              as: ProjectManager
            - call: "POST /projects/${pid}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "GET /jobs/${jid}"
              payload: {}
              as: ProjectManager
              captures: { jv: $.data.version }
            - call: "POST /assignments"
              payload: { job_id: "${jid}", linguist_id: "${tl}", role: "TRANSLATOR", window_start: "2026-06-01T00:00:00.000Z", window_end: "2026-06-02T00:00:00.000Z", expected_job_version: "${jv}" }
              as: ProjectManager
              captures: { ta: $.data.id }
            - call: "POST /assignments/${ta}/accept"
              payload: {}
              as: Translator
              as_user_id: "${tl}"
          trigger:
            - call: "GET /linguists/${tl}/payout-ledger"
              payload: {}
              as: ProjectManager
          assert:
            - "response_type == array"
            - "data length == 1"
            - "data[0].entry_type == COMMIT"
            - "data[0].amount_cents == 15975"

      - name: delivery_certificate_minted_on_certified_delivery
        claim_type: Creation
        grounds:
          - entities.DeliveryCertificate
          - entities.DeliveryCertificate.fields.page_count
          - entities.DeliveryCertificate.fields.certification_mode
        distinguishing_aspect: "Delivering a job under a CERTIFIED project mints one DeliveryCertificate with certification_mode=CERTIFIED and page_count=ceil(2600/250)=11, discoverable via GET /jobs/{id}/certificate."
        test_recipe:
          setup: ["CERTIFIED project, job QA_PASSED then delivered with actual 2600 source words."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Acme", billing_email: "ar@acme.test" }
              as: ProjectManager
              captures: { cid: $.data.id }
            - call: "POST /rate-cards"
              payload: { source_locale: "en-US", target_locale: "de-DE", base_rate_cents_per_word: 15, linguist_rate_cents_per_word: 9 }
              as: ProjectManager
              captures: { rc: $.data.id }
            - call: "POST /linguists"
              payload: { full_name: "T", native_locale: "de-DE", qualified_pairs: [ { source_locale: "en-US", target_locale: "de-DE" } ] }
              as: ProjectManager
              captures: { tl: $.data.id }
            - call: "POST /linguists"
              payload: { full_name: "R", native_locale: "de-DE", qualified_pairs: [ { source_locale: "en-US", target_locale: "de-DE" } ], can_review: true }
              as: ProjectManager
              captures: { rl: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${cid}", rate_card_id: "${rc}", name: "P1", certification_mode: "CERTIFIED" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /projects/${pid}/jobs"
              payload: { filename: "a.docx", quoted_no_match_words: 1200, quoted_fuzzy_words: 600, quoted_reps_words: 400, quoted_context_words: 300 }
              as: ProjectManager
              captures: { jid: $.data.id }
            - call: "POST /projects/${pid}/quote"
              payload: {}
              as: ProjectManager
            - call: "POST /projects/${pid}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "GET /jobs/${jid}"
              payload: {}
              as: ProjectManager
              captures: { jv1: $.data.version }
            - call: "POST /assignments"
              payload: { job_id: "${jid}", linguist_id: "${tl}", role: "TRANSLATOR", window_start: "2026-06-01T00:00:00.000Z", window_end: "2026-06-02T00:00:00.000Z", expected_job_version: "${jv1}" }
              as: ProjectManager
              captures: { ta: $.data.id }
            - call: "POST /assignments/${ta}/accept"
              payload: {}
              as: Translator
              as_user_id: "${tl}"
            - call: "GET /jobs/${jid}"
              payload: {}
              as: ProjectManager
              captures: { jv2: $.data.version }
            - call: "POST /assignments"
              payload: { job_id: "${jid}", linguist_id: "${rl}", role: "REVIEWER", window_start: "2026-06-02T00:00:00.000Z", window_end: "2026-06-03T00:00:00.000Z", expected_job_version: "${jv2}" }
              as: ProjectManager
              captures: { ra: $.data.id }
            - call: "POST /assignments/${ra}/accept"
              payload: {}
              as: Reviewer
              as_user_id: "${rl}"
            - call: "POST /jobs/${jid}/submit-translation"
              payload: {}
              as: Translator
              as_user_id: "${tl}"
            - call: "POST /jobs/${jid}/qa-reports"
              payload: { reviewer_assignment_id: "${ra}", critical_count: 0, major_count: 0, minor_count: 1, scored_word_count: 2600 }
              as: Reviewer
              as_user_id: "${rl}"
            - call: "POST /jobs/${jid}/deliver"
              payload: { actual_no_match_words: 1300, actual_fuzzy_words: 600, actual_reps_words: 400, actual_context_words: 300 }
              as: ProjectManager
          trigger:
            - call: "GET /jobs/${jid}/certificate"
              payload: {}
              as: ProjectManager
          assert:
            - "response_type == array"
            - "data length == 1"
            - "data[0].certification_mode == CERTIFIED"
            - "data[0].page_count == 11"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: approve_project_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Project.QUOTED_to_APPROVED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST /projects/{id}/approve while project is DRAFT (not QUOTED) → ERR_INVALID_STATE (409); no state change."
        test_recipe:
          setup: ["Project DRAFT (not yet quoted)."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Acme", billing_email: "ar@acme.test" }
              as: ProjectManager
              captures: { cid: $.data.id }
            - call: "POST /rate-cards"
              payload: { source_locale: "en-US", target_locale: "de-DE", base_rate_cents_per_word: 15, linguist_rate_cents_per_word: 9 }
              as: ProjectManager
              captures: { rc: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${cid}", rate_card_id: "${rc}", name: "P1" }
              as: ProjectManager
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /projects/${pid}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: quote_project_with_no_jobs_returns_no_jobs
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Project.DRAFT_to_QUOTED
          - "errors[ERR_NO_JOBS]"
        distinguishing_aspect: "POST /projects/{id}/quote with zero ProjectJobs → ERR_NO_JOBS (409)."
        test_recipe:
          setup: ["Project DRAFT with no jobs."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Acme", billing_email: "ar@acme.test" }
              as: ProjectManager
              captures: { cid: $.data.id }
            - call: "POST /rate-cards"
              payload: { source_locale: "en-US", target_locale: "de-DE", base_rate_cents_per_word: 15, linguist_rate_cents_per_word: 9 }
              as: ProjectManager
              captures: { rc: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${cid}", rate_card_id: "${rc}", name: "P1" }
              as: ProjectManager
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /projects/${pid}/quote"
              payload: {}
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "error_id == ERR_NO_JOBS"

      - name: cancel_terminal_project_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Project.DRAFT_to_CANCELLED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST /projects/{id}/cancel on an already-CANCELLED project → ERR_INVALID_STATE (409); CANCELLED is terminal."
        test_recipe:
          setup: ["Project CANCELLED."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Acme", billing_email: "ar@acme.test" }
              as: ProjectManager
              captures: { cid: $.data.id }
            - call: "POST /rate-cards"
              payload: { source_locale: "en-US", target_locale: "de-DE", base_rate_cents_per_word: 15, linguist_rate_cents_per_word: 9 }
              as: ProjectManager
              captures: { rc: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${cid}", rate_card_id: "${rc}", name: "P1" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /projects/${pid}/cancel"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /projects/${pid}/cancel"
              payload: {}
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: new_project_starts_in_draft
        claim_type: Initial State
        grounds:
          - state_machines.Project
          - entities.Project.fields.status
        distinguishing_aspect: "A freshly created Project has status DRAFT and quoted_total_cents null."
        test_recipe:
          setup: ["Client + RateCard exist."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Acme", billing_email: "ar@acme.test" }
              as: ProjectManager
              captures: { cid: $.data.id }
            - call: "POST /rate-cards"
              payload: { source_locale: "en-US", target_locale: "de-DE", base_rate_cents_per_word: 15, linguist_rate_cents_per_word: 9 }
              as: ProjectManager
              captures: { rc: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { client_id: "${cid}", rate_card_id: "${rc}", name: "P1" }
              as: ProjectManager
              captures: { st: $.data.status, qt: $.data.quoted_total_cents }
          assert:
            - "Project.status == DRAFT"
            - "Project.quoted_total_cents == null"

      - name: add_job_to_quoted_project_reopens_to_draft
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Project.QUOTED_to_DRAFT
          - entities.Project.fields.quoted_total_cents
        distinguishing_aspect: "POST /projects/{id}/jobs on a QUOTED project resets quoted_total_cents to null and reverts status QUOTED→DRAFT."
        test_recipe:
          setup: ["Project QUOTED with one job."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Acme", billing_email: "ar@acme.test" }
              as: ProjectManager
              captures: { cid: $.data.id }
            - call: "POST /rate-cards"
              payload: { source_locale: "en-US", target_locale: "de-DE", base_rate_cents_per_word: 15, linguist_rate_cents_per_word: 9 }
              as: ProjectManager
              captures: { rc: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${cid}", rate_card_id: "${rc}", name: "P1" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /projects/${pid}/jobs"
              payload: { filename: "a.docx", quoted_no_match_words: 1000 }
              as: ProjectManager
            - call: "POST /projects/${pid}/quote"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /projects/${pid}/jobs"
              payload: { filename: "b.docx", quoted_no_match_words: 500 }
              as: ProjectManager
            - call: "GET /projects/${pid}"
              payload: {}
              as: ProjectManager
              captures: { st: $.data.status, qt: $.data.quoted_total_cents }
          assert:
            - "Project.status == DRAFT"
            - "Project.quoted_total_cents == null"

      - name: submit_translation_without_reviewer_returns_no_reviewer
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ProjectJob.TRANSLATING_to_IN_QA
          - "errors[ERR_NO_REVIEWER_ASSIGNED]"
        distinguishing_aspect: "POST /jobs/{id}/submit-translation while no IN_PROGRESS REVIEWER assignment exists → ERR_NO_REVIEWER_ASSIGNED (409)."
        test_recipe:
          setup: ["Job TRANSLATING (translator accepted) but no reviewer assigned."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Acme", billing_email: "ar@acme.test" }
              as: ProjectManager
              captures: { cid: $.data.id }
            - call: "POST /rate-cards"
              payload: { source_locale: "en-US", target_locale: "de-DE", base_rate_cents_per_word: 15, linguist_rate_cents_per_word: 9 }
              as: ProjectManager
              captures: { rc: $.data.id }
            - call: "POST /linguists"
              payload: { full_name: "T", native_locale: "de-DE", qualified_pairs: [ { source_locale: "en-US", target_locale: "de-DE" } ] }
              as: ProjectManager
              captures: { tl: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${cid}", rate_card_id: "${rc}", name: "P1" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /projects/${pid}/jobs"
              payload: { filename: "a.docx", quoted_no_match_words: 1200, quoted_fuzzy_words: 600, quoted_reps_words: 400, quoted_context_words: 300 }
              as: ProjectManager
              captures: { jid: $.data.id }
            - call: "POST /projects/${pid}/quote"
              payload: {}
              as: ProjectManager
            - call: "POST /projects/${pid}/approve"
              payload: {}
              as: Client
