        grounds:
          - concurrency_rules[booking-amend-stale-version]
          - entities.Booking.fields.version
        distinguishing_aspect: "Two strictly sequential amends: the first (expected == observed version 1) succeeds and bumps version to 2; the second carrying the SAME expected version 1 is rejected 412 — a stale-view conflict with zero timing dependence. The successful amend also recomputes the estimate (89050)."
        test_recipe:
          setup: ["QUOTED LCL booking (4000kg/6.0cbm, estimate 77400, version 1)"]
          setup_api_calls:
            - { call: "POST /freight/shippers", payload: { legal_name: "ACME OCC1", credit_limit_cents: 100000000 }, as: OperationsManager, captures: { s: $.data.id } }
            - { call: "POST /freight/tariffs", payload: { tariff_code: "T-LCL-1", origin_port: "CNSHA", destination_port: "USLAX", commodity_type: "GENERAL", mode: "LCL", rate_per_unit_cents: 9500, minimum_charge_cents: 20000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1", captures: { t: $.data.id } }
            - { call: "POST /freight/tariffs/${t}/publish", payload: {}, as: ComplianceOfficer, as_user_id: "co_2" }
            - { call: "POST /freight/carrier-contracts", payload: { contract_number: "CARR-1", carrier_name: "MAERSK", service_lane: "CNSHA-USLAX", container_rates: [ { container_type: "40HC", rate_cents: 120000 } ], demurrage_free_days: 4, detention_free_days: 3, demurrage_tiers: [ { from_day: 1, to_day: 3, per_diem_cents: 15000 }, { from_day: 4, to_day: 7, per_diem_cents: 30000 }, { from_day: 8, to_day: null, per_diem_cents: 60000 } ], detention_per_diem_cents: 12000, service_start: "2026-01-01T00:00:00Z", service_end: "2026-12-31T00:00:00Z" }, as: OperationsManager, captures: { c: $.data.id } }
            - { call: "POST /freight/carrier-contracts/${c}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /freight/voyages", payload: { vessel_name: "EVER GIVEN", voyage_number: "EG101", carrier_contract_id: "${c}", origin_port: "CNSHA", destination_port: "USLAX", etd: "2026-09-01T00:00:00Z", eta: "2026-09-21T00:00:00Z" }, as: OperationsManager, captures: { v: $.data.id } }
            - { call: "POST /freight/voyages/${v}/open-for-booking", payload: {}, as: OperationsManager }
            - { call: "POST /freight/bookings", payload: { voyage_id: "${v}", tariff_id: "${t}", rate_source: "CONTRACT", mode: "LCL", commodity_type: "GENERAL", gross_weight_kg: 4000, volume_cbm: 6.0, terms: "PREPAID" }, as: Shipper, as_user_id: "${s}", captures: { b: $.data.id, bv: $.data.version } }
          trigger:
            - { call: "PATCH /freight/bookings/${b}", payload: { expected_booking_version: "${bv}", gross_weight_kg: 5000, volume_cbm: 7.0 }, as: BookingCoordinator, captures: { v2: $.data.version, est2: $.data.estimated_freight_cents } }
            - { call: "PATCH /freight/bookings/${b}", payload: { expected_booking_version: "${bv}", gross_weight_kg: 6000 }, as: BookingCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "first amend: version 1 -> 2, estimated_freight_cents == 89050 (RT 7.0: base 66500 + BAF 6650 + THC 8400 + DOC 7500)"
            - "second amend with stale expected_booking_version 1: error_id == ERR_STALE_BOOKING_VERSION, http 412; gross_weight_kg stays 5000"

      - name: occ_consolidation_stuff_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[consolidation-stuff-stale-version]
          - entities.Consolidation.fields.version
        distinguishing_aspect: "Two strictly sequential stuffs against version 1: the first succeeds (used_weight_kg 6000, version 2); the second — which would be perfectly legal on capacity — is rejected 412 purely because its expected_consolidation_version is stale."
        test_recipe:
