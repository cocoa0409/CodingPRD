  - section: errors
    instances:
      - name: error_empty_load_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_EMPTY_LOAD]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / empty_load_zero_net_weight_boundary
          rationale: "Zero-net-weight weigh-out already asserts ERR_EMPTY_LOAD in §1.8."

      - name: error_lane_occupied_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_LANE_OCCUPIED]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / scale_reservation_lane_halfopen_overlap
          rationale: "Overlapping lane reservation already asserts ERR_LANE_OCCUPIED in §1.8."

      - name: error_window_conflict_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_WINDOW_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / disposal_window_cell_buffer_conflict
          rationale: "Buffer-violating disposal window already asserts ERR_WINDOW_CONFLICT in §1.8."

