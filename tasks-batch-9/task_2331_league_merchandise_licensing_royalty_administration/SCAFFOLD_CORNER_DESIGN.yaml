              as_user_id: "u_ops_1"
          assert:
            - "the first ACTIVATE returns 200 with data.status == 'ACTIVE', data.vendor_compliance_certified == true and data.version == 2"
            - "the second ACTIVATE returns 409 with data.error_id == 'ERR_INVALID_STATE'"
            - "Licensee.${lic_l2}.version is still 2 after the rejection"

