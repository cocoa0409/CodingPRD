            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/retailers", payload: { contract_id: "${c_id}", retailer_name: "R1", acquirer_reference: "ACQ1" }, as: StateAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /ebt/retailers/${r_id}/item-files", payload: { items: [ { upc: "111111111111", food_eligible: true, effective_from: "2026-08-01", effective_to: null } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H Z2" }, as: StateAdmin, captures: { case_id: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_food}", benefit_month: "2026-09", amount_cents: 30000 }, as: StateAdmin }
            - { call: "POST /ebt/cards", payload: { case_account_id: "${case_id}" }, as: CardholderServices, captures: { card_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T12:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/cards/${card_id}/activate", payload: { pin: "1234" }, as: Cardholder, as_user_id: "${case_id}" }
          trigger:
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "999999999999", quantity: 1, unit_price_cents: 100 } ] }, as: RetailerSystem, as_user_id: "${r_id}", captures: { exc: $.data.exception_flag_count, fc: $.data.food_charge_cents } }
          assert:
            - "authorization succeeds: exception_flag_count == 1 and food_charge_cents == 100 (unknown UPC treated food-eligible under LENIENT)"

      - name: dispute_window_inclusive_boundary
        claim_type: boundary
        grounds: ["validations[priority=21]", "errors[ERR_DISPUTE_WINDOW_EXPIRED]"]
        distinguishing_aspect: "The dispute window boundary is inclusive: a filing at exactly cutoff_at + 15 days (2026-09-18T00:00:00Z) is accepted; one second later fails ERR_DISPUTE_WINDOW_EXPIRED."
        test_recipe:
          setup: ["Contract TX ACTIVE with FOOD; retailer R1; case 0000000000 active card; one 1000-cent purchase on 2026-09-02; batch cut at 2026-09-03T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { p_food: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/retailers", payload: { contract_id: "${c_id}", retailer_name: "R1", acquirer_reference: "ACQ1" }, as: StateAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /ebt/retailers/${r_id}/item-files", payload: { items: [ { upc: "111111111111", food_eligible: true, effective_from: "2026-08-01", effective_to: null } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H Y3" }, as: StateAdmin, captures: { case_id: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_food}", benefit_month: "2026-09", amount_cents: 30000 }, as: StateAdmin }
            - { call: "POST /ebt/cards", payload: { case_account_id: "${case_id}" }, as: CardholderServices, captures: { card_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T12:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/cards/${card_id}/activate", payload: { pin: "1234" }, as: Cardholder, as_user_id: "${case_id}" }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 1000 } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-03T00:00:00Z" }, as: StateAdmin }
            - { call: "GET /ebt/settlement-batches", payload: { contract_id: "${c_id}" }, as: StateAdmin, captures: { b_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-18T00:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/disputes", payload: { settlement_batch_id: "${b_id}", disputed_amount_cents: 992, reason: "at boundary" }, as: RetailerSystem, as_user_id: "${r_id}", captures: { d_ok: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-18T00:00:01Z" }, as: StateAdmin }
            - { call: "POST /ebt/disputes", payload: { settlement_batch_id: "${b_id}", disputed_amount_cents: 1, reason: "one second late" }, as: RetailerSystem, as_user_id: "${r_id}", captures: { err: $.data.error_id } }
          assert:
            - "filing at exactly cutoff + 15 days succeeds (d_ok captured an id)"
            - "filing one second later fails: err == 'ERR_DISPUTE_WINDOW_EXPIRED'"

      - name: reconcile_mismatch_creates_dispute_and_disputes_batch
        claim_type: conditional_action
        grounds: ["state_machines.SettlementBatch.CUTOFF_to_DISPUTED", "entities.SettlementDispute.fields.disputed_amount_cents"]
        distinguishing_aspect: "A mismatched reconcile is not an error: the batch flips CUTOFF -> DISPUTED and a system dispute of type RECONCILIATION_MISMATCH appears with disputed_amount_cents == actual - net == -92."
        test_recipe:
          setup: ["Contract TX ACTIVE with FOOD; retailer R1; case 0000000000 active card; one 1000-cent purchase on 2026-09-02; batch cut at 2026-09-03T00:00:00Z (gross 1000, fee 8, net 992)"]
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { p_food: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/retailers", payload: { contract_id: "${c_id}", retailer_name: "R1", acquirer_reference: "ACQ1" }, as: StateAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /ebt/retailers/${r_id}/item-files", payload: { items: [ { upc: "111111111111", food_eligible: true, effective_from: "2026-08-01", effective_to: null } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H X3" }, as: StateAdmin, captures: { case_id: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_food}", benefit_month: "2026-09", amount_cents: 30000 }, as: StateAdmin }
            - { call: "POST /ebt/cards", payload: { case_account_id: "${case_id}" }, as: CardholderServices, captures: { card_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T12:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/cards/${card_id}/activate", payload: { pin: "1234" }, as: Cardholder, as_user_id: "${case_id}" }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 1000 } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-03T00:00:00Z" }, as: StateAdmin }
            - { call: "GET /ebt/settlement-batches", payload: { contract_id: "${c_id}" }, as: StateAdmin, captures: { b_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /ebt/settlement-batches/${b_id}/reconcile", payload: { actual_settled_cents: 900 }, as: StateAdmin, captures: { bstat: $.data.batch_status } }
            - { call: "GET /ebt/settlement-batches/${b_id}/disputes", payload: {}, as: StateAdmin, captures: { dt: "$.data[0].dispute_type", da: "$.data[0].disputed_amount_cents", ds: "$.data[0].dispute_status" } }
          assert:
            - "reconcile response batch_status == 'DISPUTED' (mismatch is a transition, not an error)"
            - "exactly one dispute exists: dispute_type == 'RECONCILIATION_MISMATCH', disputed_amount_cents == -92 (900 - 992), dispute_status == 'OPEN'"

      - name: nonexistent_body_reference_returns_reference_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_REFERENCE_NOT_FOUND]"]
        distinguishing_aspect: "A body-carried reference (case_account_id) that does not exist yields 422 ERR_REFERENCE_NOT_FOUND, distinct from the 404 path-resource error."
        test_recipe:
          setup: ["Contract TX exists (empty of cases)"]
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin }
          trigger:
            - { call: "POST /ebt/cards", payload: { case_account_id: "11111111-1111-1111-1111-111111111111" }, as: CardholderServices, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_REFERENCE_NOT_FOUND' (HTTP 422)"

      - name: case_creation_before_contract_active_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_CONTRACT_NOT_ACTIVE]"]
        distinguishing_aspect: "While the contract is still CONFIGURING, case creation fails ERR_CONTRACT_NOT_ACTIVE."
        test_recipe:
          setup: ["Contract TX in CONFIGURING with one DRAFT FOOD program (never activated)"]
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin }
          trigger:
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H W3" }, as: StateAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_CONTRACT_NOT_ACTIVE'"

      - name: duplicate_food_program_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=20]", "errors[ERR_PROGRAM_TYPE_DUPLICATE]"]
        distinguishing_aspect: "FOOD and CASH are singletons per contract; a second FOOD program fails ERR_PROGRAM_TYPE_DUPLICATE while a DISASTER program remains legal."
        test_recipe:
          setup: ["Contract TX CONFIGURING with one FOOD program"]
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin }
          trigger:
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "DISASTER", disaster_window_start: "2026-09-10", disaster_window_end: "2026-09-20" }, as: StateAdmin, captures: { dis_id: $.data.id } }
          assert:
            - "second FOOD rejected: err == 'ERR_PROGRAM_TYPE_DUPLICATE'"
            - "DISASTER program with a window is accepted (dis_id captured)"

      - name: claim_mismatch_alone_returns_case_mismatch
        claim_type: violation_to_error
        grounds: ["validations[priority=22]", "errors[ERR_CLAIM_TXN_CASE_MISMATCH]"]
        distinguishing_aspect: "With the temporal window satisfied (same-day filing), the referential check fires alone: a claim by case A referencing case B's transaction fails ERR_CLAIM_TXN_CASE_MISMATCH."
        test_recipe:
          setup: ["Contract TX ACTIVE with FOOD; retailer R1; cases A 0000000000 (card, no txns) and B 0000000001 (card + 500-cent purchase on 2026-09-02)"]
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { p_food: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/retailers", payload: { contract_id: "${c_id}", retailer_name: "R1", acquirer_reference: "ACQ1" }, as: StateAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /ebt/retailers/${r_id}/item-files", payload: { items: [ { upc: "111111111111", food_eligible: true, effective_from: "2026-08-01", effective_to: null } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H V3" }, as: StateAdmin, captures: { case_a: $.data.id } }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000001", head_of_household_name: "H U3" }, as: StateAdmin, captures: { case_b: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_food}", benefit_month: "2026-09", amount_cents: 30000 }, as: StateAdmin }
            - { call: "POST /ebt/cards", payload: { case_account_id: "${case_a}" }, as: CardholderServices, captures: { card_a: $.data.id } }
            - { call: "POST /ebt/cards", payload: { case_account_id: "${case_b}" }, as: CardholderServices, captures: { card_b: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T12:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/cards/${card_b}/activate", payload: { pin: "1234" }, as: Cardholder, as_user_id: "${case_b}" }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_b}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 500 } ] }, as: RetailerSystem, as_user_id: "${r_id}", captures: { txn_b: $.data.id } }
          trigger:
            - { call: "POST /ebt/claims", payload: { case_account_id: "${case_a}", card_id: "${card_a}", authorization_ids: [ "${txn_b}" ], claimed_amount_cents: 500, incident_description: "not my txn", freeze_purse: false }, as: Cardholder, as_user_id: "${case_a}", captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_CLAIM_TXN_CASE_MISMATCH'"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: list_pagination_defaults_and_envelope
        claim_type: listing
        grounds: ["response_envelope"]
        distinguishing_aspect: "The purses list honors limit=1 against two real rows (total_count 2, has_more true) and the success envelope carries meta.api_request_id with response_type 'array'."
        test_recipe:
          setup: ["Contract TX ACTIVE with FOOD and CASH; case 0000000000 (two purses)"]
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "CASH" }, as: StateAdmin }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H T3" }, as: StateAdmin, captures: { case_id: $.data.id } }
          trigger:
            - { call: "GET /ebt/purses", payload: { case_account_id: "${case_id}", limit: 1 }, as: StateAdmin }
          assert:
            - "response meta contains a non-empty api_request_id and an ISO8601 api_request_timestamp"
            - "response_type == 'array'"
            - "exactly 1 data row returned; total_count == 2; has_more == true; limit == 1; offset == 0"

      - name: allotment_run_skips_suspended_cases
        claim_type: bulk_action
        grounds: ["endpoints POST /ebt/contracts/{id}/allotment-runs"]
        distinguishing_aspect: "The bulk run is best-effort per case: with case A OPEN and case B SUSPENDED, one run returns created_count == 1 and skipped_count == 1 and only A's purse holds a posting."
        test_recipe:
          setup: ["Contract TX ACTIVE with FOOD; cases A 0000000000 and B 0000000001; B suspended by StateAdmin (OCC version captured)"]
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { p_food: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H S3" }, as: StateAdmin, captures: { case_a: $.data.id } }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000001", head_of_household_name: "H R3" }, as: StateAdmin, captures: { case_b: $.data.id } }
            - { call: "GET /ebt/case-accounts/${case_b}", payload: {}, as: StateAdmin, captures: { vb: $.data.version } }
            - { call: "POST /ebt/case-accounts/${case_b}/status", payload: { to: "SUSPENDED", expected_case_account_version: "${vb}" }, as: StateAdmin }
            - { call: "GET /ebt/purses", payload: { case_account_id: "${case_a}", program_id: "${p_food}" }, as: StateAdmin, captures: { pu_a: "$.data[0].id" } }
          trigger:
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_food}", benefit_month: "2026-09", amount_cents: 30000 }, as: StateAdmin, captures: { made: $.data.created_count, skip: $.data.skipped_count } }
            - { call: "GET /ebt/purses/${pu_a}/postings", payload: {}, as: StateAdmin, captures: { amt: "$.data[0].amount_cents" } }
          assert:
            - "created_count == 1 and skipped_count == 1"
            - "case A's purse has a 30000-cent posting; case B's purse has none"

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers fails authentication at priority 1 with ERR_UNAUTHENTICATED (401) before anything else."
        test_recipe:
          setup: ["Server started (empty DB is fine); no headers attached to the request"]
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin }
          trigger:
            - { call: "GET /ebt/purses", payload: {}, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_UNAUTHENTICATED' (HTTP 401)"

      - name: cardholder_cannot_read_other_case_purse
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_FORBIDDEN]", "roles[Cardholder]"]
        distinguishing_aspect: "Entity-backed ownership: a Cardholder whose X-User-ID is case A's id gets ERR_FORBIDDEN (403) reading a purse of case B even though the purse exists and the role may use the endpoint."
        test_recipe:
          setup: ["Contract TX ACTIVE with FOOD; cases A 0000000000 and B 0000000001 (each with a food purse)"]
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { p_food: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H Q3" }, as: StateAdmin, captures: { case_a: $.data.id } }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000001", head_of_household_name: "H P3" }, as: StateAdmin, captures: { case_b: $.data.id } }
            - { call: "GET /ebt/purses", payload: { case_account_id: "${case_b}", program_id: "${p_food}" }, as: StateAdmin, captures: { pu_b: "$.data[0].id" } }
          trigger:
            - { call: "GET /ebt/purses/${pu_b}", payload: {}, as: Cardholder, as_user_id: "${case_a}", captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_FORBIDDEN' (HTTP 403)"

      - name: retailer_cannot_void_other_retailers_transaction
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_FORBIDDEN]", "roles[RetailerSystem]"]
        distinguishing_aspect: "Void ownership is checked against the transaction's retailer: retailer R2 calling void on R1's authorization gets ERR_FORBIDDEN."
        test_recipe:
          setup: ["Contract TX ACTIVE with FOOD; retailers R1 and R2 (same acquirer); case 0000000000 active card; one 800-cent purchase at R1"]
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { p_food: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/retailers", payload: { contract_id: "${c_id}", retailer_name: "R1", acquirer_reference: "ACQ1" }, as: StateAdmin, captures: { r1: $.data.id } }
            - { call: "POST /ebt/retailers", payload: { contract_id: "${c_id}", retailer_name: "R2", acquirer_reference: "ACQ1" }, as: StateAdmin, captures: { r2: $.data.id } }
            - { call: "POST /ebt/retailers/${r1}/item-files", payload: { items: [ { upc: "111111111111", food_eligible: true, effective_from: "2026-08-01", effective_to: null } ] }, as: RetailerSystem, as_user_id: "${r1}" }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H O3" }, as: StateAdmin, captures: { case_id: $.data.id } }
