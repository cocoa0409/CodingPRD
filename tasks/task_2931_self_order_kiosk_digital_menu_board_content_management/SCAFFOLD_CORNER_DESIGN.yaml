          assert:
            - "${draft_state} == DRAFT and ${pinned} == ${item_a_ver}"
            - "HTTP 200 with ${new_state} == PENDING_APPROVAL, ${rounds} == 0 and ${req} == 2 (uplift 555 bp on baseline 559)"
            - "approval_user_ids is an empty array and requested_by_user_id == u_analyst_1"
            - "MenuItem.${item_a_id}.pending_price_request_count == 1 and pricing_lock_state reflects the open request"

      - name: approver_cannot_approve_a_request_it_opened
        claim_type: precondition_enforcement
        grounds:
          - validations.priority_17_ERR_SELF_APPROVAL_FORBIDDEN
          - complexity_profile.role_model
          - state_machines.PriceChangeRequest.PENDING_APPROVAL_to_APPROVED
        distinguishing_aspect: "Segregation of duties: the APPROVE precondition requires X-User-ID != requested_by_user_id, so the same user id approving its own request returns ERR_SELF_APPROVAL_FORBIDDEN (403) and approval_user_ids stays empty."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; ZONE_A and Item A exist."
            - "User u_dual_hat opened a PriceChangeRequest as PricingAnalyst and it is PENDING_APPROVAL."
            - "Cluster CL_ZONE and store S001 put at least one Store in this price zone, which validation priority 32 (ERR_PRICE_ZONE_MISMATCH) requires before any PriceChangeRequest may name it."
