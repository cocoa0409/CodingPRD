    roles: [PlatformAdmin]
    code: 201
    input: [tier, seat_limit, included_build_minutes, build_concurrency_limit, included_bandwidth_gb, included_invocations_millions, bandwidth_tier1_rate_cents_per_gb, bandwidth_tier2_rate_cents_per_gb, bandwidth_tier2_threshold_gb, invocation_rate_cents_per_million, seat_price_cents_monthly, overage_build_minute_rate_cents]
    output: PlanCatalogEntry
    side_effects: []

  - method: GET
    path: "/v1/plan-catalog"
    description: "List plan catalog entries"
    roles: [PlatformAdmin, TeamOwner, TeamBillingManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "PlanCatalogEntry[]"
    side_effects: []

  # --- Teams ---
  - method: POST
    path: "/v1/teams"
    description: "Create a team on a plan tier"
    roles: [PlatformAdmin]
    code: 201
    input: [name, plan_tier]
    output: Team
    side_effects: ["Plan fields copied from PlanCatalogEntry; seats_used=0; prorated_charges_cents=0; increments Team.version to 1 at create"]

  - method: GET
    path: "/v1/teams"
    description: "List teams"
    roles: [PlatformAdmin, TeamOwner, TeamBillingManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "Team[]"
    side_effects: []

  - method: GET
    path: "/v1/teams/{id}"
    description: "Get team"
    roles: [PlatformAdmin, TeamOwner, TeamBillingManager, Developer, Viewer]
    code: 200
    input: []
    output: Team
    side_effects: []

  - method: PATCH
    path: "/v1/teams/{id}"
    description: "Change plan tier (re-copies plan limits onto team)"
    roles: [PlatformAdmin, TeamBillingManager]
    code: 200
    input: ["name?", "plan_tier?"]
    output: Team
    side_effects: ["On plan_tier change: re-copy plan fields; increments Team.version by 1"]

  # --- Members ---
  - method: POST
    path: "/v1/teams/{teamId}/members"
    description: "Add a member (seat)"
    roles: [TeamOwner]
    code: 201
    input: [user_email, role]
    output: Member
    side_effects: ["seats_used += 1; seat_proration charge added to team.prorated_charges_cents when OPEN period exists; increments Team.version by 1"]

  - method: GET
    path: "/v1/teams/{teamId}/members"
    description: "List members of a team"
    roles: [PlatformAdmin, TeamOwner, TeamBillingManager, Developer, Viewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Member[]"
    side_effects: []

  - method: GET
    path: "/v1/teams/{teamId}/members/{id}"
    description: "Get member"
    roles: [PlatformAdmin, TeamOwner, TeamBillingManager, Developer, Viewer]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: DELETE
    path: "/v1/teams/{teamId}/members/{id}"
    description: "Remove a member"
    roles: [TeamOwner]
    code: 204
    input: []
    output: null
    side_effects: ["seats_used -= 1; increments Team.version by 1"]

  - method: GET
    path: "/v1/members"
    description: "List members across teams, filterable by team_id"
    roles: [PlatformAdmin, TeamOwner, TeamBillingManager, Developer, Viewer]
    code: 200
    input: ["team_id?", "limit?", "offset?"]
    output: "Member[]"
    side_effects: []

  - method: GET
    path: "/v1/members/{id}"
    description: "Get member by id"
    roles: [PlatformAdmin, TeamOwner, TeamBillingManager, Developer, Viewer]
    code: 200
    input: []
    output: Member
    side_effects: []

  # --- Projects ---
  - method: POST
    path: "/v1/teams/{teamId}/projects"
    description: "Create project"
    roles: [TeamOwner, Developer]
    code: 201
    input: [name, production_branch, "framework?", "preview_protection?"]
    output: Project
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/v1/teams/{teamId}/projects"
    description: "List projects of a team"
    roles: [PlatformAdmin, TeamOwner, TeamBillingManager, Developer, Viewer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Project[]"
    side_effects: []

  - method: GET
    path: "/v1/projects"
    description: "List projects across teams, filterable by team_id"
    roles: [PlatformAdmin, TeamOwner, TeamBillingManager, Developer, Viewer]
    code: 200
    input: ["team_id?", "status?", "limit?", "offset?"]
    output: "Project[]"
    side_effects: []

  - method: GET
    path: "/v1/projects/{id}"
    description: "Get project"
    roles: [PlatformAdmin, TeamOwner, TeamBillingManager, Developer, Viewer]
    code: 200
    input: []
    output: Project
    side_effects: []

  - method: PATCH
    path: "/v1/projects/{id}"
    description: "Update project config with OCC"
    roles: [TeamOwner, Developer]
    code: 200
    input: ["name?", "production_branch?", "framework?", "preview_protection?", expected_project_version]
    output: Project
    side_effects: ["OCC check on expected_project_version; increments Project.version by 1"]

  - method: POST
    path: "/v1/projects/{id}/archive"
    description: "Archive project; cascades to deployments, domains, certificates"
    roles: [TeamOwner]
    code: 200
    input: []
    output: Project
    side_effects: ["QUEUED deployments -> CANCELED; ACTIVE domains -> SUSPENDED; their ACTIVE certificates -> REVOKED; increments Project.version by 1"]

  - method: POST
    path: "/v1/projects/{id}/resume"
    description: "Resume a spend-cap-suspended project"
    roles: [TeamOwner]
    code: 200
    input: []
    output: Project
    side_effects: ["status -> ACTIVE; team's TRIPPED SpendCap -> ACTIVE; increments Project.version by 1"]

  - method: POST
    path: "/v1/projects/{id}/rollback"
    description: "Instant rollback: promote prior production deployment"
    roles: [TeamOwner]
    code: 200
    input: []
    output: Deployment
    side_effects: ["current PROMOTED -> ROLLED_BACK; prior -> PROMOTED; project.production_deployment_id updated"]

  # --- Deployments ---
  - method: POST
    path: "/v1/git-events"
    description: "Git webhook: push/PR event creates a preview deployment"
    roles: [SystemWebhook]
    code: 201
    input: [project_id, branch, git_ref, commit_sha, "region?", "access_protection?"]
    output: Deployment
    side_effects: ["url_slug computed; access_protection defaulted from project.preview_protection; build_queue_admission check; status=QUEUED; estimated_build_minutes from last READY same-project deployment else DEFAULT_ESTIMATE_MINUTES"]

  - method: GET
    path: "/v1/deployments"
    description: "List deployments, filterable"
    roles: [PlatformAdmin, TeamOwner, TeamBillingManager, Developer, Viewer]
    code: 200
    input: ["project_id?", "branch?", "status?", "target?", "limit?", "offset?"]
    output: "Deployment[]"
    side_effects: []

  - method: GET
    path: "/v1/deployments/{id}"
    description: "Get deployment"
    roles: [PlatformAdmin, TeamOwner, TeamBillingManager, Developer, Viewer]
    code: 200
    input: []
    output: Deployment
    side_effects: []

  - method: POST
    path: "/v1/deployments/{id}/build-start"
    description: "Worker claims a QUEUED deployment for building"
    roles: [SystemWebhook]
    code: 200
    input: []
    output: Deployment
    side_effects: ["QUEUED -> BUILDING if concurrency slot free"]

  - method: POST
    path: "/v1/deployments/{id}/build-complete"
    description: "Worker reports build outcome"
    roles: [SystemWebhook]
    code: 200
    input: [outcome, build_duration_seconds]
    output: Deployment
    side_effects: ["billable_minutes computed; READY on SUCCESS / ERROR on FAILURE; period aggregates updated; projected bill recomputed; alerts and spend cap re-evaluated; same-branch supersede cascade on SUCCESS"]

  - method: POST
    path: "/v1/deployments/{id}/cancel"
    description: "Cancel a QUEUED or READY preview deployment"
    roles: [TeamOwner, Developer]
    code: 200
    input: []
    output: Deployment
    side_effects: ["status -> CANCELED"]

  - method: POST
    path: "/v1/deployments/{id}/promote"
    description: "Promote a READY or STALE preview to production"
    roles: [TeamOwner, Developer]
    code: 200
    input: []
    output: Deployment
    side_effects: ["target=PRODUCTION; status=PROMOTED; access_protection=NONE; prior PROMOTED -> ROLLED_BACK; project.production_deployment_id updated"]

  # --- Environment variables ---
  - method: POST
    path: "/v1/projects/{id}/env-vars"
    description: "Create an environment variable"
    roles: [TeamOwner, Developer]
    code: 201
    input: [key, value, scopes, "is_secret?"]
    output: EnvironmentVariable
    side_effects: ["Scope overlap validated per (project, key)"]

  - method: GET
    path: "/v1/projects/{id}/env-vars"
    description: "List env vars; secret values masked to null"
    roles: [PlatformAdmin, TeamOwner, TeamBillingManager, Developer, Viewer]
    code: 200
    input: ["limit?", "offset?", "scope?"]
    output: "EnvironmentVariable[]"
