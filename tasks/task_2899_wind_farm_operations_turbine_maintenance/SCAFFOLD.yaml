      - "recomputes service_due_flag and service_interval_breached per the scheduled_service_due calculation"
      - "recomputes projected_shortfall_pct and at_risk_flag on every ACTIVE ServiceAgreement of the farm using the LIVE_PROJECTION variant"
      - "rejected with ERR_AGREEMENT_IN_SETTLEMENT while any ServiceAgreement on the farm is in state IN_SETTLEMENT"
  - method: POST
    path: "/wind-ops/turbines/{id}/decommission"
    description: "Permanently retire a turbine. Only reachable from availability_state ONLINE."
