            - "${err_not_responded} == 'ERR_INSPECTION_NOT_RESPONDED' with HTTP 409 — close from OPEN"
            - "the re-run draft-response (OPEN -> RESPONSE_DRAFTED then RESPONSE_DRAFTED -> RESPONSE_DRAFTED) OVERWROTE provided_document_kinds to ['STATION_LOG', 'TEST_LOGS'] rather than appending"
            - "submit-response wrote responded_at == '2026-08-03T00:00:00Z' and completeness_score == 100.00 (2 of 2 kinds, responded before response_due_at 2026-08-08T00:00:00Z, no lateness deduction) with status == 'RESPONDED'"
            - "${err_not_draftable} == 'ERR_INSPECTION_NOT_DRAFTABLE' with HTTP 409 and provided_document_kinds is STILL ['STATION_LOG', 'TEST_LOGS'] — the rejected draft did not overwrite it"
            - "close returns 200 with status == 'CLOSED_SATISFIED' (completeness_score 100.00 >= 100.00)"
            - "${err_closed_twice} == 'ERR_INSPECTION_NOT_RESPONDED' with HTTP 409 — the terminal state is not re-enterable"

      - name: alert_axis_endpoints_cannot_apply_from_the_wrong_dimension_state
        claim_type: invalid_transition
        grounds:
          - "§1.2 state_machines.AlertEvent(relay_state) RELAY_PENDING -> RELAYED precondition 'relay_state == RELAY_PENDING'; terminal_states [RELAYED, UNMATCHED_OPTIONAL, SUPPRESSED_DUPLICATE]"
          - "§1.2 state_machines.AlertEvent(accessibility_state) terminal_states [ACCESSIBILITY_PASSED, ACCESSIBILITY_FAILED]"
          - "§1.6 ERR_ALERT_NOT_RELAY_PENDING (409) and ERR_ACCESSIBILITY_ALREADY_VERIFIED (409)"
        distinguishing_aspect: "Each dimension guards itself: confirm-relay on an UNMATCHED_OPTIONAL alert is ERR_ALERT_NOT_RELAY_PENDING even though the accessibility axis is still open, and a second verify-accessibility is ERR_ACCESSIBILITY_ALREADY_VERIFIED even though it would have produced a different score — the first measurement is final."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; plan KS 2026-R1 activated with mandatory_relay_event_codes [] and NO relay rules; station KWEA."
            - "alert1 TOR/KSAXS-0001 fips ['20173'] received 2026-08-01T00:00:00Z -> relay_state UNMATCHED_OPTIONAL (empty candidate pool), accessibility_state ACCESSIBILITY_UNVERIFIED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_id: "$.data.id" }
            - call: "POST /alert-events"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", event_code: "TOR", originator_sequence: "KSAXS-0001", fips_codes: ["20173"], received_at: "2026-08-01T00:00:00Z" }
              captures: { alert1: "$.data.id" }
          trigger:
            - call: "POST /alert-events/${alert1}/confirm-relay"
              as: StationEngineer
              as_user_id: eng-1
              payload: {}
              captures: { err_relay: "$.data.error_id" }
            - call: "POST /alert-events/${alert1}/verify-accessibility"
              as: StationEngineer
              as_user_id: eng-1
              payload: { visual_crawl_seconds: 60, audio_loudness_lufs: -24.0, caption_interaction: "NONE" }
            - call: "POST /alert-events/${alert1}/verify-accessibility"
              as: StationEngineer
              as_user_id: eng-1
              payload: { visual_crawl_seconds: 0, audio_loudness_lufs: -60.0, caption_interaction: "CRAWL_OVERLAP" }
              captures: { err_accessibility: "$.data.error_id" }
            - call: "GET /alert-events/${alert1}"
              as: ComplianceAdmin
              as_user_id: adm-1
          assert:
            - "${err_relay} == 'ERR_ALERT_NOT_RELAY_PENDING' with HTTP 409 — UNMATCHED_OPTIONAL is terminal on the relay axis"
            - "the first verify-accessibility returns 200 with accessibility_deficiency_points == 0.00 and accessibility_state == 'ACCESSIBILITY_PASSED' (0.00 <= 1.00)"
            - "${err_accessibility} == 'ERR_ACCESSIBILITY_ALREADY_VERIFIED' with HTTP 409"
            - "the stored measurements are still the first ones: visual_crawl_seconds == 60, audio_loudness_lufs == -24.0, caption_interaction == 'NONE', accessibility_deficiency_points == 0.00"
            - "relay_state is STILL 'UNMATCHED_OPTIONAL' — neither rejected call touched the other dimension"

      - name: parallel_alert_dimensions_advance_independently
        claim_type: parallel_dimensions
        grounds:
          - "§1.0 complexity_profile.state_machine_shape parallel"
          - "§1.2 state_machines.AlertEvent(relay_state) and state_machines.AlertEvent(accessibility_state)"
        excluded_because:
          difficulty_instance: alert_relay_and_accessibility_dimensions_advance_independently
          rationale: "The named §1.8 instance already drives the accessibility axis to ACCESSIBILITY_PASSED while relay_state stays RELAY_PENDING and then moves the relay axis, asserting the untouched dimension at each step."

      - name: outage_cascade_down_to_assignments_station_and_test_events
        claim_type: cascade_down
        grounds:
          - "§1.5 POST /equipment-outages side effects hops 1-4"
          - "§1.2 state_machines.EASDevice READY -> FAILED, MonitoringAssignment ACTIVE -> SUSPENDED, Station COMPLIANT -> SUSPENDED_FILINGS, TestEvent READY -> READINESS_PENDING"
        excluded_because:
          difficulty_instance: outage_create_cascades_four_levels_device_assignments_station_test_event
          rationale: "The named §1.8 instance asserts all four hops end-to-end from a single POST /equipment-outages, including the ordering-sensitive hop 4 revert."

      - name: plan_supersede_conditional_cascade_into_inspections
        claim_type: conditional_cascade
        grounds:
          - "§1.2 state_machines.StatePlan ACTIVE -> SUPERSEDED hop 2 and state_machines.InspectionRequest RESPONDED -> RESPONSE_DRAFTED hop 3"
        excluded_because:
          difficulty_instance: plan_supersede_cascades_three_levels_and_reverts_only_non_terminal_inspections
          rationale: "The named §1.8 instance asserts that hop 3 reverts only the RESPONDED inspection and leaves CLOSED_SATISFIED / CLOSED_DEFICIENT rows alone."

      - name: test_event_ready_reverts_to_readiness_pending_and_back
        claim_type: valid_transition
        grounds:
          - "§1.2 state_machines.TestEvent READY -> READINESS_PENDING (system hop 4) and READINESS_PENDING -> READY"
        excluded_because:
          difficulty_instance: test_event_reverts_ready_to_readiness_pending_and_back_to_ready
          rationale: "The named §1.8 instance asserts the revert clears readiness_score and readiness_evaluated_at and that a re-run restores READY."

      - name: filing_reversal_compensates_the_station_penalty_ledger
        claim_type: compensation
        grounds:
          - "§1.2 state_machines.FilingRecord ACCEPTED -> REVERSED COMPENSATION side effect"
        excluded_because:
          difficulty_instance: filing_reversal_returns_penalty_total_to_its_exact_pre_filing_value
          rationale: "The named §1.8 instance captures penalty_points_total before the filing and asserts the reversal restores that exact value with no drift."

      - name: penalty_points_total_ledger_sync_on_filing_create
        claim_type: ledger_sync
        grounds:
          - "§1.5 POST /filing-records side effect 'Station.penalty_points_total recomputed'"
          - "§1.3 calculations.filing_penalty_points 'Station.penalty_points_total = round(sum of penalty_points over filings with status IN {SUBMITTED, ACCEPTED}, 2)'"
        excluded_because:
          difficulty_instance: filing_penalty_pinned_round_per_entry_then_sum
          rationale: "The named §1.8 instance asserts the per-entry rounding, the filing's penalty_points and the resulting Station.penalty_points_total in one chain."

  # ===========================================================================
  # SECTION 3 — Calculations (claim-extraction-guide "From Table 3")
  # ===========================================================================
  - section: calculations
    instances:

      - name: selector_specificity_outranks_the_lower_priority_integer
        claim_type: correct_result
        grounds:
          - "§1.3 calculations.relay_rule_selection formula '(b) ranking expression, applied in this exact order: specificity DESC (2 = county-scoped beats 1 = statewide), priority ASC (lower integer ranks earlier)'"
          - "§1.5 POST /relay-rules side effect 'specificity = 2 when fips_codes is non-empty else 1'"
          - "§1.1 AlertEvent.matched_relay_rule_id / forward_delay_seconds_applied / relay_class_applied are source: computed"
        distinguishing_aspect: "The county rule wins with priority 9 against a statewide rule at priority 1, so the implementation cannot sort by priority first: matched_relay_rule_id is the county rule's id and forward_delay_seconds_applied is 45 (its value), not the statewide rule's 5."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; plan KS 2026-R1 (mandatory_relay_event_codes []) activated; station KWEA."
            - "rule_state: TOR, fips_codes [] -> specificity 1, priority 1, forward_delay_seconds 5, relay_class OPTIONAL."
            - "rule_county: TOR, fips_codes ['20173'] -> specificity 2, priority 9, forward_delay_seconds 45, relay_class OPTIONAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_id: "$.data.id" }
            - call: "POST /relay-rules"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", event_code: "TOR", fips_codes: [], relay_class: "OPTIONAL", priority: 1, forward_delay_seconds: 5 }
              captures: { rule_state: "$.data.id" }
            - call: "POST /relay-rules"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", event_code: "TOR", fips_codes: ["20173"], relay_class: "OPTIONAL", priority: 9, forward_delay_seconds: 45 }
              captures: { rule_county: "$.data.id" }
          trigger:
            - call: "POST /alert-events"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", event_code: "TOR", originator_sequence: "KSAXS-1001", fips_codes: ["20173"], received_at: "2026-08-01T00:00:00Z" }
              captures: { alert1: "$.data.id" }
            - call: "GET /relay-rules/${rule_state}"
              as: ComplianceAdmin
              as_user_id: adm-1
            - call: "GET /relay-rules/${rule_county}"
              as: ComplianceAdmin
              as_user_id: adm-1
          assert:
            - "rule_state.specificity == 1 and rule_county.specificity == 2 — derived from fips_codes emptiness, not supplied"
            - "alert1.matched_relay_rule_id == ${rule_county} — specificity DESC is applied before priority ASC"
            - "alert1.forward_delay_seconds_applied == 45 (copied from the selected rule, not 5)"
            - "alert1.relay_class_applied == 'OPTIONAL' (selected rule is OPTIONAL and 'TOR' is not in mandatory_relay_event_codes)"
            - "alert1.relay_state == 'RELAY_PENDING' and suppression_source == 'NONE' with suppression_reference_alert_id == null"

      - name: retired_and_fips_disjoint_rules_leave_the_candidate_pool
        claim_type: input_set_filtering
        grounds:
          - "§1.3 calculations.relay_rule_selection input_set 'Candidate pool = RelayRule rows where state_plan_id == station.state_plan_id AND status == ACTIVE AND event_code == alert.event_code AND (fips_codes == [] OR intersection(fips_codes, alert.fips_codes) is non-empty)'"
          - "§1.5 POST /relay-rules/{id}/retire side effect 'status = RETIRED'"
        distinguishing_aspect: "The same alert payload selects three different outcomes purely from pool membership: with a disjoint FIPS list the county rule drops out and the statewide rule wins, and after the county rule is retired even a matching-FIPS alert falls back to the statewide rule — status and FIPS intersection are separate filters, both applied before ranking."
        test_recipe:
          setup:
            - "Same fixture as selector_specificity_outranks_the_lower_priority_integer: rule_state (fips [], priority 1, delay 5) and rule_county (fips ['20173'], priority 9, delay 45) on plan KS 2026-R1; station KWEA."
            - "Each probe alert uses a distinct originator_sequence so phase A of duplicate_suppression_window never fires."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_id: "$.data.id" }
            - call: "POST /relay-rules"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", event_code: "TOR", fips_codes: [], relay_class: "OPTIONAL", priority: 1, forward_delay_seconds: 5 }
              captures: { rule_state: "$.data.id" }
            - call: "POST /relay-rules"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", event_code: "TOR", fips_codes: ["20173"], relay_class: "OPTIONAL", priority: 9, forward_delay_seconds: 45 }
              captures: { rule_county: "$.data.id" }
          trigger:
            - call: "POST /alert-events"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", event_code: "TOR", originator_sequence: "KSAXS-2001", fips_codes: ["20999"], received_at: "2026-08-01T00:00:00Z" }
              captures: { alert_disjoint: "$.data.id" }
            - call: "POST /relay-rules/${rule_county}/retire"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /alert-events"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", event_code: "TOR", originator_sequence: "KSAXS-2002", fips_codes: ["20173"], received_at: "2026-08-01T00:00:00Z" }
              captures: { alert_after_retire: "$.data.id" }
            - call: "POST /alert-events"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", event_code: "SVR", originator_sequence: "KSAXS-2003", fips_codes: ["20173"], received_at: "2026-08-01T00:00:00Z" }
              captures: { alert_other_code: "$.data.id" }
          assert:
            - "alert_disjoint.matched_relay_rule_id == ${rule_state} with forward_delay_seconds_applied == 5 — ['20173'] and ['20999'] do not intersect, so the higher-specificity rule was excluded, not merely outranked"
            - "the retire call returns 200 with status == 'RETIRED'"
            - "alert_after_retire.matched_relay_rule_id == ${rule_state} with forward_delay_seconds_applied == 5 even though its FIPS list matches the retired county rule"
            - "alert_other_code.relay_state == 'UNMATCHED_OPTIONAL' with matched_relay_rule_id == null, relay_class_applied == 'NONE' and forward_delay_seconds_applied == 0 — no ACTIVE rule carries event_code 'SVR'"
            - "all three alerts have suppression_source == 'NONE' (distinct originator_sequence values keep phase A empty)"

      - name: plan_mandatory_event_code_upgrades_an_optional_rule
        claim_type: correct_result
        grounds:
          - "§1.3 calculations.relay_rule_selection formula 'relay_class_applied = MANDATORY if (selected.relay_class == MANDATORY OR alert.event_code IN plan.mandatory_relay_event_codes) else OPTIONAL'"
          - "§1.1 StatePlan.mandatory_relay_event_codes (source: input)"
          - "§1.3 calculations.filing_penalty_points input_set 'Unconfirmed relay pool = AlertEvent rows with ... relay_class_applied == MANDATORY, relay_state == RELAY_PENDING ...'"
        distinguishing_aspect: "relay_class_applied is a disjunction over two different sources: an OPTIONAL rule still yields MANDATORY because the plan lists the event code, and the resulting alert then joins filing_penalty_points' unconfirmed pool — while the same rule under a plan without that code stays OPTIONAL and never charges points."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; plan_ks KS 2026-R1 with mandatory_relay_event_codes ['TOR'] activated, station KWEA under it."
            - "plan_ne NE 2026-R1 with mandatory_relay_event_codes [] activated, station KNEB under it (different state_code, so no supersede interaction)."
            - "Each plan gets one statewide OPTIONAL TOR rule at priority 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: ["TOR"] }
              captures: { plan_ks: "$.data.id" }
            - call: "POST /state-plans/${plan_ks}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "NE", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_ne: "$.data.id" }
            - call: "POST /state-plans/${plan_ne}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_ks}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_ks: "$.data.id" }
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_ne}", call_sign: "KNEB", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_ne: "$.data.id" }
            - call: "POST /relay-rules"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_ks}", event_code: "TOR", fips_codes: [], relay_class: "OPTIONAL", priority: 1, forward_delay_seconds: 0 }
              captures: { rule_ks: "$.data.id" }
            - call: "POST /relay-rules"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_ne}", event_code: "TOR", fips_codes: [], relay_class: "OPTIONAL", priority: 1, forward_delay_seconds: 0 }
              captures: { rule_ne: "$.data.id" }
          trigger:
            - call: "POST /alert-events"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_ks}", event_code: "TOR", originator_sequence: "KSAXS-3001", fips_codes: ["20173"], received_at: "2026-08-01T00:00:00Z" }
              captures: { alert_ks: "$.data.id" }
            - call: "POST /alert-events"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_ne}", event_code: "TOR", originator_sequence: "NEAXS-3001", fips_codes: ["31055"], received_at: "2026-08-01T00:00:00Z" }
              captures: { alert_ne: "$.data.id" }
          assert:
            - "alert_ks.matched_relay_rule_id == ${rule_ks} and relay_class_applied == 'MANDATORY' — upgraded by plan_ks.mandatory_relay_event_codes even though rule_ks.relay_class == 'OPTIONAL'"
            - "alert_ne.matched_relay_rule_id == ${rule_ne} and relay_class_applied == 'OPTIONAL' — identical rule, plan without the code"
            - "both alerts have relay_state == 'RELAY_PENDING' and forward_delay_seconds_applied == 0"
            - "rule_ks.relay_class is still 'OPTIONAL' in GET /relay-rules/${rule_ks} — the upgrade is per-alert, it does not rewrite the rule"

      - name: phase_a_station_repeat_wins_when_a_wireless_notice_also_matches
        claim_type: interval_merge
        grounds:
          - "§1.3 calculations.duplicate_suppression_window formula: phase A runs first and on a hit sets suppression_source = STATION_REPEAT, suppression_reference_alert_id = reference.id, then 'STOP (the relay selector does not run)'"
          - "§1.3 same formula phase B: on a hit sets suppression_source = WIRELESS_NOTICE with suppression_reference_alert_id = null"
          - "§1.3 constants STATION_DEDUP_SECONDS 900, WEA_MATCH_SECONDS 1800, WEA_BUFFER_SECONDS 120"
        distinguishing_aspect: "Both phases would fire on the third alert, and the phase ordering is observable in a single field: suppression_source is STATION_REPEAT with a non-null reference id (phase A), never WIRELESS_NOTICE with a null reference — an implementation that checks the wireless notices first produces the opposite pair."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; plan KS 2026-R1 (mandatory []) activated; station KWEA; one statewide ACTIVE TOR rule at priority 1 so a non-suppressed alert would visibly match it."
            - "WEA notice w1: originator_sequence 'KSAXS-4001', event_code TOR, fips ['20173'], wea_sent_at 2026-08-01T00:00:00Z -> window_B = [2026-07-31T23:58:00Z, 2026-08-01T00:32:00Z]."
            - "alert_first received 2026-08-01T00:20:00Z (inside window_B, matching FIPS) -> WIRELESS_NOTICE."
            - "alert_third received 2026-08-01T00:25:00Z: window_A = [2026-08-01T00:10:00Z, 2026-08-01T00:25:00Z) contains alert_first, and window_B still contains it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_id: "$.data.id" }
            - call: "POST /relay-rules"
