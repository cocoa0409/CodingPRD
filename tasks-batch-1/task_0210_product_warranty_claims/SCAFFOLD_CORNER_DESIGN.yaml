  # ===========================================================================
  # SECTION 6 — Errors (every error_id triggerable; stubs where §1.8 covers it)
  # ===========================================================================
  - section: errors
    instances:
      - name: error_not_found_triggerable
        claim_type: error_triggerability
        grounds:
          - errors[ERR_NOT_FOUND]
        excluded_because:
          difficulty_instance: null
          rationale: "Triggered by corner instance get_product_nonexistent_returns_not_found (section entities)."
      - name: error_invalid_request_triggerable
        claim_type: error_triggerability
        grounds:
          - errors[ERR_INVALID_REQUEST]
        excluded_because:
          difficulty_instance: null
          rationale: "Triggered by corner instances create_registration_missing_required_field / create_product_invalid_category_enum (section entities)."
      - name: error_unauthenticated_triggerable
        claim_type: error_triggerability
        grounds:
          - errors[ERR_UNAUTHENTICATED]
        excluded_because:
          difficulty_instance: null
          rationale: "Triggered by corner instance missing_headers_returns_unauthenticated (section validations)."
      - name: error_duplicate_serial_triggerable
        claim_type: error_triggerability
        grounds:
          - errors[ERR_DUPLICATE_SERIAL]
        excluded_because:
          difficulty_instance: null
          rationale: "Triggered by corner instance duplicate_serial_per_product_returns_duplicate_serial (section validations)."
      - name: error_tier_mismatch_triggerable
        claim_type: error_triggerability
        grounds:
          - errors[ERR_TIER_MISMATCH]
        excluded_because:
          difficulty_instance: null
          rationale: "Triggered by corner instance extended_warranty_amount_mismatch_returns_tier_mismatch (section validations)."
      - name: error_defect_not_covered_triggerable
        claim_type: error_triggerability
        grounds:
          - errors[ERR_DEFECT_NOT_COVERED]
        excluded_because:
          difficulty_instance: null
          rationale: "Triggered by corner instance adjudicate_non_manufacturing_defect_returns_defect_not_covered (section validations)."
      - name: error_warranty_expired_triggerable
        claim_type: error_triggerability
        grounds:
          - errors[ERR_WARRANTY_EXPIRED]
        excluded_because:
          difficulty_instance: null
          rationale: "Triggered by corner instance issue_rma_after_warranty_expired_returns_warranty_expired (section validations)."
      - name: error_refund_not_eligible_triggerable
        claim_type: error_triggerability
        grounds:
          - errors[ERR_REFUND_NOT_ELIGIBLE]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / refund_constraint_beats_fiscal_refund_not_eligible_over_coverage_exhausted
          rationale: "Also triggered standalone by corner adjudicate_refund_ineligible_tier_returns_refund_not_eligible; covered by the named §1.8 instance."
      - name: error_coverage_exhausted_triggerable
        claim_type: error_triggerability
        grounds:
          - errors[ERR_COVERAGE_EXHAUSTED]
        excluded_because:
          difficulty_instance: null
          rationale: "Triggered by corner instance adjudicate_coverage_exhausted_returns_coverage_exhausted (section validations)."
      - name: error_invalid_state_triggerable
        claim_type: error_triggerability
        grounds:
          - errors[ERR_INVALID_STATE]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_safety_invalid_state_over_defect_not_covered
          rationale: "Also triggered standalone by several state_machines corner instances; covered by the named §1.8 instance."
      - name: error_stale_version_triggerable
        claim_type: error_triggerability
        grounds:
          - errors[ERR_STALE_VERSION]
          - concurrency_rules[transfer-stale-registration]
        distinguishing_aspect: |
          OCC stale-version conflict: a transfer carrying an expected_registration_version one less than the
          current version (after a cascade bumped it) is rejected with ERR_STALE_VERSION (412).
        test_recipe:
          setup:
            - "Owner O1 ACTIVE validated registration; Owner O2 recipient. Client observes version V, then a proof re-validate... instead: client captures V, an extension purchase bumps version to V+1, then a transfer with expected V (stale) is sent."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-01-15T00:00:00Z" }
              as: WarrantyAdmin
            - call: "POST /products"
              payload: { model_number: "PRD-OCC", category: "ELECTRONICS", msrp_cents: 60000, base_warranty_months: 12, serviceable_lifespan_months: 48 }
              as: WarrantyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coverage-tiers"
              payload: { product_id: "${prod_id}", tier_name: "BASE", extension_months: 0, price_cents: 0, coverage_cap_cents: 20000, depreciation_method: "STRAIGHT_LINE" }
              as: WarrantyAdmin
            - call: "POST /coverage-tiers"
              payload: { product_id: "${prod_id}", tier_name: "GOLD", extension_months: 24, price_cents: 12000, coverage_cap_cents: 40000, depreciation_method: "STRAIGHT_LINE" }
              as: WarrantyAdmin
              captures: { gold_id: $.data.id }
            - call: "POST /owners"
              payload: { full_name: "OCC Owner1", email: "occ1@x.com" }
              as: WarrantyAdmin
              captures: { o1_id: $.data.id }
            - call: "POST /owners"
              payload: { full_name: "OCC Owner2", email: "occ2@x.com" }
              as: WarrantyAdmin
              captures: { o2_id: $.data.id }
            - call: "POST /registrations"
              payload: { product_id: "${prod_id}", serial_number: "SN-OCC", owner_user_id: "${o1_id}", purchase_date: "2024-01-15T00:00:00Z", purchase_price_cents: 50000 }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /proofs"
              payload: { registration_id: "${reg_id}", document_type: "RECEIPT", stated_purchase_date: "2024-01-15T00:00:00Z", stated_amount_cents: 50000 }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { proof_id: $.data.id }
            - call: "POST /proofs/${proof_id}/validate"
              payload: {}
              as: WarrantyAdmin
            - call: "GET /registrations/${reg_id}"
              payload: {}
              as: Owner
              as_user_id: "${o1_id}"
              captures: { stale_v: $.data.version }
            - call: "POST /extended-warranties"
              payload: { registration_id: "${reg_id}", coverage_tier_id: "${gold_id}", amount_paid_cents: 12000 }
              as: Owner
              as_user_id: "${o1_id}"
          trigger:
            - call: "POST /registrations/${reg_id}/transfer"
              payload: { to_owner_user_id: "${o2_id}", expected_registration_version: "${stale_v}" }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"
            - "Registration.${reg_id}.status == ACTIVE"

      - name: error_coverage_overlap_triggerable
        claim_type: error_triggerability
        grounds:
          - errors[ERR_COVERAGE_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / extended_warranty_coverage_interval_overlap_half_open
          rationale: "Triggered by the named §1.8 instance."
      - name: error_claim_cooldown_triggerable
        claim_type: error_triggerability
        grounds:
          - errors[ERR_CLAIM_COOLDOWN]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / claim_cooldown_buffer_gap_between_claims
          rationale: "Triggered by the named §1.8 instance."
      - name: error_not_owner_triggerable
        claim_type: error_triggerability
        grounds:
          - errors[ERR_NOT_OWNER]
        excluded_because:
          difficulty_instance: null
          rationale: "Triggered by corner instance owner_cannot_file_claim_on_others_registration (section rbac)."
      - name: error_forbidden_triggerable
        claim_type: error_triggerability
        grounds:
          - errors[ERR_FORBIDDEN]
        excluded_because:
          difficulty_instance: null
          rationale: "Triggered by corner instances in section rbac (e.g., owner_cannot_adjudicate_claim)."

  # ===========================================================================
  # SECTION 7 — RBAC (peer-roles denials; shared ops; ownership)
  # ===========================================================================
  - section: rbac
    instances:
      - name: owner_cannot_adjudicate_claim
        claim_type: cross_role_denial
        grounds:
          - roles.WarrantyAdmin
          - endpoints.POST_/claims/{id}/adjudicate
          - validations[priority=2]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: |
          peer_roles: an Owner calling POST /claims/{id}/adjudicate (a WarrantyAdmin exclusive_operation)
          is rejected with ERR_FORBIDDEN (403).
        test_recipe:
          setup:
            - "Owner O1 ACTIVE validated registration; a MANUFACTURING claim RMA_ISSUED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-01-15T00:00:00Z" }
              as: WarrantyAdmin
