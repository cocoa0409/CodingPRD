            - "TripRequest.${t3_id}.status remains APPROVED"

  - rule_id: compensating_invariant
    instances:
      - name: program_accrual_conserved_across_complete_and_void
        grounds:
          - state_machines.TripRequest.SCHEDULED_to_COMPLETED
          - state_machines.TripRequest.COMPLETED_to_VOID
          - calculations.maintenance_forecast
        distinguishing_aspect: |
          Conserved quantity: airframe hours and program liability. The forward
          action (complete, block 5.0, ENROLLED program at 15000/h) and its
          compensating action (void) must leave Aircraft.total_time_hours == 0.0
          and the only PROGRAM_ACCRUAL expense VOID — pinned by the invariant
          total_time_hours == SUM(block_hours_actual over COMPLETED trips).
        test_recipe:
          setup:
            - "Agreement ACTIVE; MaintenanceProgram ENROLLED at rate_per_hour_cents 15000; QUALIFIED crew pair; ACCEPTED INSURANCE_COI valid_until 2027-01-01"
            - "Fresh aircraft (total_time_hours 0.0); OWNER_USE trip T SCHEDULED"
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Aeris Holdings LLC", contact_email: "owner@aeris.example" }
              as: AccountExecutive
              captures: { o_id: $.data.id }
            - call: "POST /aircraft"
              payload: { owner_id: "${o_id}", tail_number: "N190JX", model: "G650", home_base_icao: "KTEB" }
              as: AccountExecutive
              captures: { a_id: $.data.id }
            - call: "POST /agreements"
              payload: { owner_id: "${o_id}", aircraft_id: "${a_id}", monthly_management_fee_cents: 500000, variable_fee_pct: 0.10, charter_owner_share_pct: 0.85, tax_allocation_method: FLIGHT_HOURS }
              as: AccountExecutive
              captures: { ag_id: $.data.id }
            - call: "POST /agreements/${ag_id}/activate"
              as: AccountExecutive
            - call: "POST /programs"
              payload: { aircraft_id: "${a_id}", program_name: "JetCare hourly", rate_per_hour_cents: 15000 }
              as: MaintenancePlanner
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/enroll"
              as: MaintenancePlanner
            - call: "POST /crew"
              payload: { aircraft_id: "${a_id}", full_name: "Pat Captain", crew_role: CAPTAIN, hire_date: "2026-01-15" }
              as: FlightOpsManager
              captures: { c1_id: $.data.id }
            - call: "POST /crew/${c1_id}/begin-training"
              as: FlightOpsManager
            - call: "POST /crew/${c1_id}/complete-training"
              payload: { training_hours: 30, check_ride_passed: true }
              as: FlightOpsManager
            - call: "POST /crew"
              payload: { aircraft_id: "${a_id}", full_name: "Sam Officer", crew_role: FIRST_OFFICER, hire_date: "2026-02-01" }
              as: FlightOpsManager
              captures: { c2_id: $.data.id }
            - call: "POST /crew/${c2_id}/begin-training"
              as: FlightOpsManager
            - call: "POST /crew/${c2_id}/complete-training"
              payload: { training_hours: 28, check_ride_passed: true }
              as: FlightOpsManager
            - call: "POST /filings"
              payload: { aircraft_id: "${a_id}", filing_kind: INSURANCE_COI, authority: "Avemco", reference_no: "COI-1901", valid_until: "2027-01-01" }
              as: ComplianceOfficer
              captures: { f_id: $.data.id }
            - call: "POST /filings/${f_id}/file"
              as: ComplianceOfficer
            - call: "POST /filings/${f_id}/record-decision"
              payload: { outcome: ACCEPTED }
              as: ComplianceOfficer
            - call: "POST /trips"
              payload: { aircraft_id: "${a_id}", trip_use: OWNER_USE, depart_icao: "KTEB", arrive_icao: "KPBI", departure_at: "2026-08-06T08:00:00Z", block_hours_est: 5.0 }
              as: FlightOpsManager
              captures: { t_id: $.data.id }
            - call: "POST /assignments"
              payload: { trip_id: "${t_id}", crew_member_id: "${c1_id}", duty_role: PIC, duty_start_at: "2026-08-06T06:00:00Z", duty_end_at: "2026-08-06T13:00:00Z" }
              as: FlightOpsManager
            - call: "POST /assignments"
              payload: { trip_id: "${t_id}", crew_member_id: "${c2_id}", duty_role: SIC, duty_start_at: "2026-08-06T06:00:00Z", duty_end_at: "2026-08-06T13:00:00Z" }
              as: FlightOpsManager
            - call: "POST /trips/${t_id}/schedule"
              as: FlightOpsManager
            - call: "POST /trips/${t_id}/complete"
              payload: { block_hours_actual: 5.0 }
              as: FlightOpsManager
          trigger:
            - call: "POST /trips/${t_id}/void"
              as: FlightOpsManager
          assert:
            - "TripRequest.${t_id}.status == VOID"
            - "Aircraft.${a_id}.total_time_hours == 0.0 (back to the pre-completion value)"
            - "GET /expenses?aircraft_id=${a_id}&category=PROGRAM_ACCRUAL returns exactly one expense, amount_cents == 75000, status == VOID"
            - "TripRequest.${t_id}.owner_credit_cents is null after void"

      - name: crew_duty_hours_conserved_across_assign_and_release
        grounds:
          - calculations.duty_hours_accumulation
          - state_machines.DutyAssignment.ASSIGNED_to_RELEASED
        distinguishing_aspect: |
          Conserved quantity: rolling crew duty hours (a DIFFERENT conserved
          quantity than airframe hours/program liability). Assigning an 8.0h
          duty raises duty_hours_7d from 10.0 to 18.0 and releasing it returns
          the accumulator to exactly 10.0 — pinned by duty_hours_7d ==
          SUM(duty_hours over ASSIGNED/COMPLETED assignments in window).
        test_recipe:
          setup:
            - "Crew member C QUALIFIED; logical clock 2026-08-10T00:00:00Z"
            - "T0, T1 OWNER_USE auto-APPROVED; A0: C on T0 duty 2026-08-05T08:00 to 2026-08-05T18:00 (10.0h, in window)"
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Aeris Holdings LLC", contact_email: "owner@aeris.example" }
              as: AccountExecutive
              captures: { o_id: $.data.id }
            - call: "POST /aircraft"
              payload: { owner_id: "${o_id}", tail_number: "N200JB", model: "G650", home_base_icao: "KTEB" }
              as: AccountExecutive
              captures: { a_id: $.data.id }
            - call: "POST /crew"
              payload: { aircraft_id: "${a_id}", full_name: "Pat Captain", crew_role: CAPTAIN, hire_date: "2026-01-15" }
              as: FlightOpsManager
              captures: { c1_id: $.data.id }
            - call: "POST /crew/${c1_id}/begin-training"
              as: FlightOpsManager
            - call: "POST /crew/${c1_id}/complete-training"
              payload: { training_hours: 30, check_ride_passed: true }
              as: FlightOpsManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /trips"
              payload: { aircraft_id: "${a_id}", trip_use: OWNER_USE, depart_icao: "KTEB", arrive_icao: "KPBI", departure_at: "2026-08-05T09:00:00Z", block_hours_est: 3.0 }
              as: FlightOpsManager
              captures: { t0_id: $.data.id }
            - call: "POST /trips"
              payload: { aircraft_id: "${a_id}", trip_use: OWNER_USE, depart_icao: "KTEB", arrive_icao: "KBOS", departure_at: "2026-08-08T09:00:00Z", block_hours_est: 2.0 }
              as: FlightOpsManager
              captures: { t1_id: $.data.id }
            - call: "POST /assignments"
              payload: { trip_id: "${t0_id}", crew_member_id: "${c1_id}", duty_role: PIC, duty_start_at: "2026-08-05T08:00:00Z", duty_end_at: "2026-08-05T18:00:00Z" }
              as: FlightOpsManager
          trigger:
            - call: "POST /assignments"
              payload: { trip_id: "${t1_id}", crew_member_id: "${c1_id}", duty_role: PIC, duty_start_at: "2026-08-08T08:00:00Z", duty_end_at: "2026-08-08T16:00:00Z" }
              as: FlightOpsManager
              captures: { a1_id: $.data.id }
            - call: "DELETE /assignments/${a1_id}"
              as: FlightOpsManager
          assert:
            - "between the two trigger calls CrewMember.${c1_id}.duty_hours_7d == 18.0"
            - "after the DELETE: CrewMember.${c1_id}.duty_hours_7d == 10.0 (the pre-assignment value)"
            - "after the DELETE: CrewMember.${c1_id}.duty_hours_28d == 10.0"
            - "DutyAssignment.${a1_id}.status == RELEASED"
