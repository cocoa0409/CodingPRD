  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: incident_review_escalate_cycle_increments_level
        grounds:
          - state_machines.IncidentReport.UNDER_REVIEW_to_ESCALATED
          - state_machines.IncidentReport.ESCALATED_to_UNDER_REVIEW
          - state_machines.IncidentReport.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.IncidentReport.INFO_REQUESTED_to_SUBMITTED
          - entities.IncidentReport.fields.escalation_level
        distinguishing_aspect: |
          Non-linear shape on IncidentReport: two genuine cycles (UNDER_REVIEW→INFO_REQUESTED→SUBMITTED→UNDER_REVIEW
          and UNDER_REVIEW→ESCALATED→UNDER_REVIEW) plus the RESOLVED branch; traversing the escalate cycle twice
          leaves escalation_level == 2, which no linear pipeline can produce.
        test_recipe:
          setup:
            - "Guard Ivy is ACTIVE and LICENSED and is clocked IN_PROGRESS on a confirmed shift."
            - "A HIGH-severity incident has been filed against that shift in DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { name: "Vertex Mall", margin_floor_pct: 20.0 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /sites"
              payload: { client_id: "${client_id}", name: "Vertex Mall Site" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /posts"
              payload: { site_id: "${site_id}", name: "Food Court", bill_rate_cents_per_hour: 4500, max_concurrent_guards: 1, required_cert_codes: [], checkpoint_tag_uids: [], tour_compliance_floor_pct: 80.0 }
              as: AccountManager
              captures: { post_id: $.data.id, post_v: $.data.version }
            - call: "POST /post-orders"
              payload: { post_id: "${post_id}", expected_post_version: "${post_v}", body_text: "Report all altercations.", revision_label: "REV-A" }
              as: AccountManager
              captures: { po_id: $.data.id }
            - call: "POST /post-orders/${po_id}/publish"
              payload: {}
              as: AccountManager
            - call: "POST /guards"
              payload: { full_name: "Ivy Marsh", employee_code: "G-030", pay_rate_cents_per_hour: 2200 }
              as: ComplianceOfficer
              captures: { guard_id: $.data.id }
            - call: "POST /credentials"
              payload: { guard_id: "${guard_id}", kind: "LICENSE", code: "GUARD_CARD", credential_number: "L-030", expires_at: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic_id: $.data.id }
            - call: "POST /credentials/${lic_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /guards/${guard_id}/status"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
            - call: "POST /shifts"
              payload: { post_id: "${post_id}", scheduled_start_at: "2026-05-04T08:00:00Z", scheduled_end_at: "2026-05-04T16:00:00Z", planned_break_minutes: 30 }
              as: Scheduler
              captures: { shift_id: $.data.id, shift_v: $.data.version }
            - call: "POST /shifts/${shift_id}/assignments"
              payload: { guard_id: "${guard_id}", expected_shift_version: "${shift_v}" }
              as: Scheduler
            - call: "POST /shifts/${shift_id}/actions"
              payload: { action: "CONFIRM" }
              as: Scheduler
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shifts/${shift_id}/clock-in"
              payload: {}
              as: Guard
              as_user_id: "${guard_id}"
            - call: "POST /incidents"
