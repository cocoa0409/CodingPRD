  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_suspended_beats_no_credits
        grounds:
          - validations[priority=8]
          - validations[priority=12]
          - errors[ERR_CLIENT_SUSPENDED]
          - errors[ERR_NO_PACKAGE_CREDITS]
        distinguishing_aspect: |
          Category pair state (priority 8, ERR_CLIENT_SUSPENDED) vs business_fiscal
          (priority 12, ERR_NO_PACKAGE_CREDITS): a suspended client with zero package credits
          posting a PACKAGE consult fails both checks; the higher-priority state error wins.
        test_recipe:
          setup:
            - "A SUSPENDED client (3 strikes) whose 1-visit package has 0 credits remaining (1 consumed)."
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "Bay Lactation", aca_preventive_enabled: true }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /service-packages"
              payload: { practice_id: "${prac_id}", name: "ONE_VISIT", included_visits: 1, price_cents: 10000 }
              as: PracticeAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /consultants"
              payload: { practice_id: "${prac_id}", full_name: "Ana IBCLC", standard_rate_cents: 20000 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /clients"
              payload: { practice_id: "${prac_id}", full_name: "Parent A", infant_dob: "2026-05-01T00:00:00Z", household_income_cents: 9900000, package_id: "${pkg_id}" }
              as: FrontDesk
              captures: { client_a_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { practice_id: "${prac_id}", to_iso8601: "2026-06-10T10:00:00Z" }
              as: PracticeAdmin
            - call: "POST /consults"
              payload: { practice_id: "${prac_id}", client_id: "${client_a_id}", consultant_id: "${cons_id}", consult_type: "TELEHEALTH", scheduled_start_utc: "2026-06-10T09:00:00Z", scheduled_end_utc: "2026-06-10T09:15:00Z", pay_method: "PACKAGE" }
              as: FrontDesk
              captures: { c1_id: $.data.id }
            - call: "POST /feeding-assessments"
              payload: { consult_id: "${c1_id}", latch_score: 8, pre_feed_weight_grams: 4000, post_feed_weight_grams: 4040 }
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /consults/${c1_id}/start"
