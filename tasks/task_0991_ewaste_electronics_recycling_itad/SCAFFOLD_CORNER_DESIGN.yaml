            - { call: "POST /itad/compliance-policies", payload: { standard: "R2", sanitization_methods_allowed: ["NIST_CLEAR"], export_allowed: true, resale_requires_verified_sanitization: true, is_active: true, weight_cert_freshness: 0.5, weight_volume: 0.2, weight_violations: 0.3 }, as: PlatformAdmin }
            - { call: "POST /itad/recyclers", payload: { name: "RecFirst", certification_standard: "R2", certification_expires_at: "2027-05-01T00:00:00Z", accepted_categories: ["OTHER"], daily_intake_capacity_kg: 1000, violation_count: 0 }, as: ComplianceOfficer, captures: { r1: $.data.id } }
            - { call: "POST /itad/recyclers", payload: { name: "RecSecond", certification_standard: "R2", certification_expires_at: "2027-05-01T00:00:00Z", accepted_categories: ["OTHER"], daily_intake_capacity_kg: 1000, violation_count: 0 }, as: ComplianceOfficer, captures: { r2: $.data.id } }
