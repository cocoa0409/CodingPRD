      - name: claim_residual_equality_boundary
        grounds:
          - calculations.receiving_reconciliation
          - errors[ERR_CLAIM_QTY_EXCEEDS_RESIDUAL]
        distinguishing_aspect: |
          Metric: cumulative claimed units vs the damaged residual on one POLine. Claim of 6 then 4
          against a residual of 10 are both accepted (cumulative 10 == residual, equality allowed);
          a further claim of 1 exceeds the residual and is rejected with ERR_CLAIM_QTY_EXCEEDS_RESIDUAL.
          Endpoint under test is POST /api/damage-claims — different metric and endpoint than the
          sibling cube-threshold instance.
        test_recipe:
          setup:
            - "Project in PROCUREMENT, FURNITURE budgeted 8000000c; spec 40 x 15000c cube 10 awarded and ordered"
            - "Shipment sealed + departed; receiving POSTED with 40 received, 10 damaged (damaged residual 10)"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-BP2", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 10000000, unallocated_contingency_cents: 0 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
