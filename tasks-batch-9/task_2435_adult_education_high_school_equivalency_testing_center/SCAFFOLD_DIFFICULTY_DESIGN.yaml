      - name: accommodation_request_info_request_resubmission_cycle
        shape: cyclic
        grounds:
          - state_machines[AccommodationRequest].transitions
          - validations[priority=89]
          - errors[ERR_INFO_REQUEST_LIMIT_REACHED]
          - errors[ERR_ACCOMMODATION_NOT_INFO_REQUESTED]
        distinguishing_aspect: |
          A different entity from the ExamRegistration instance and a different non-linearity: a
          bounded cycle SUBMITTED -> INFO_REQUESTED -> SUBMITTED traversed twice, where the loop
          counter (info_request_rounds) - not the state - terminates the loop on the third attempt,
          after which the request is still decidable from SUBMITTED.
        test_recipe:
          setup:
            - "FULL_AUTHORIZED center (its id is the CenterAdministrator user id)."
            - "Student with a SUBMITTED BRAILLE accommodation request, info_request_rounds 0."
          setup_api_calls:
            - call: "POST /testing-centers"
              payload: { name: "Cycle Center", state_code: "OH" }
              as: StateAuthority
              captures: { c: $.data.id }
            - call: "POST /testing-centers/${c}/authorization-decision"
              payload: { decision: "GRANT_FULL" }
              as: StateAuthority
            - call: "POST /students"
              payload: { full_name: "Hana Learner", email: "hana@x.test", primary_track: "ESL" }
              as: ProgramCoordinator
              captures: { s: $.data.id }
            - call: "POST /accommodation-requests"
              payload: { student_id: "${s}", requested_format: "BRAILLE", documentation_ref: "DOC-A" }
              as: Registrar
              captures: { ar: $.data.id }
          trigger:
            - call: "POST /accommodation-requests/${ar}/info-request"
              payload: { decision_note: "Need an evaluator signature" }
              as: CenterAdministrator
              as_user_id: "${c}"
            - call: "POST /accommodation-requests/${ar}/resubmission"
              payload: { documentation_ref: "DOC-B" }
              as: Registrar
            - call: "POST /accommodation-requests/${ar}/resubmission"
              payload: { documentation_ref: "DOC-B2" }
              as: Registrar
            - call: "POST /accommodation-requests/${ar}/info-request"
              payload: { decision_note: "Evaluation is older than 3 years" }
              as: CenterAdministrator
              as_user_id: "${c}"
            - call: "POST /accommodation-requests/${ar}/resubmission"
              payload: { documentation_ref: "DOC-C" }
              as: Registrar
            - call: "POST /accommodation-requests/${ar}/info-request"
              payload: { decision_note: "Third request" }
              as: CenterAdministrator
              as_user_id: "${c}"
            - call: "POST /accommodation-requests/${ar}/decision"
              payload: { decision: "APPROVE", granted_format: "BRAILLE", valid_until: "2026-12-31T00:00:00Z" }
              as: CenterAdministrator
              as_user_id: "${c}"
          assert:
            - "first info-request returns 200 with status == INFO_REQUESTED and info_request_rounds == 1"
            - "first resubmission returns 200 with status == SUBMITTED and documentation_ref == DOC-B"
            - "the repeated resubmission from SUBMITTED returns 409 with data.error_id == ERR_ACCOMMODATION_NOT_INFO_REQUESTED and documentation_ref stays DOC-B"
            - "second info-request returns 200 with info_request_rounds == 2"
            - "second resubmission returns 200 with status == SUBMITTED and documentation_ref == DOC-C"
            - "third info-request returns 409 with data.error_id == ERR_INFO_REQUEST_LIMIT_REACHED, status stays SUBMITTED and info_request_rounds stays 2"
            - "the APPROVE decision then returns 200 with status == APPROVED, granted_format == BRAILLE and info_request_rounds still 2"

      - name: testing_center_authorization_branch_divergent_side_effects
        shape: branching
        grounds:
          - state_machines[TestingCenter].transitions
          - validations[priority=53]
          - validations[priority=40]
          - errors[ERR_SUBTEST_NOT_AUTHORIZED]
          - errors[ERR_CENTER_DECISION_NOT_ALLOWED]
        distinguishing_aspect: |
          A third entity and a third non-linearity: one fork (APPLIED) with three exits whose
          side-effect sets differ, plus a merge edge PROVISIONAL -> FULL_AUTHORIZED that rewrites
          the scope written by the narrower branch. The WITHDRAWN exit is terminal, so the same
          trigger that widened the provisional center is refused there.
        test_recipe:
          setup:
            - "Three APPLIED centers: one to receive GRANT_PROVISIONAL, one GRANT_FULL, one WITHDRAW."
          setup_api_calls:
            - call: "POST /testing-centers"
              payload: { name: "Branch Provisional", state_code: "OH" }
