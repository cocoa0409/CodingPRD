scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 -- dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: agreement_quoted_forward_vs_final_chronological_diverge
        grounds:
          - calculations.agreement_total_cents
          - entities.Agreement.fields.quoted_total_cents
          - entities.Agreement.fields.final_total_cents
          - entities.AgreementUnit.fields.line_charge_cents
          - state_machines.Agreement.status.PENDING_ALLOCATION_to_RESERVED
          - state_machines.Agreement.status.PENDING_SETTLEMENT_to_CLOSED
        distinguishing_aspect: |
          This dual-variant instance is COST ACCOUNTING ON THE Agreement ENTITY: the same pinned
          RateCard and the same single trailer produce 123240 cents under quoted_forward (planned
          window, zero excess mileage, zero drop charge) and 151268 cents under final_chronological
          (actual shorter window, prorated mileage overage, one-way drop charge).
        test_recipe:
          setup:
            - "Branch WST-01 with peak window 2026-09-01..2026-11-30 and lease_reserve_pct 0.00; Branch EST-01 as a foreign drop yard."
            - "One ACTIVE SHORT_TERM_RENTAL RateCard at WST-01 for DRY_VAN_53: daily 5200, peak uplift 0.30, 2500 included miles per 30 days, 22 cents per excess mile."
            - "One serviceable DRY_VAN_53 trailer T-1001 standing at WST-01 with hub_miles 41000 and dot_expires_on 2027-01-01."
            - "Customer Ridge Haul LLC, tier B, with an ACTIVE certificate covering 2024-01-01..2027-01-01 at a 3,000,000 cent physical damage limit."
            - "Agreement AG1: SHORT_TERM_RENTAL, WST-01, 1 unit, 2026-08-20 .. 2026-09-10, reserved and activated on 2026-08-20, then returned early on 2026-09-03 at EST-01 with hub 44000."
          setup_api_calls:
            - call: "POST /fleet/branches"
              payload:
                code: "WST-01"
                name: "West Yard"
                region: "WEST"
                yard_capacity: 10
                peak_season_start_date: "2026-09-01"
                peak_season_end_date: "2026-11-30"
                lease_reserve_pct: 0.00
              as: FleetAdmin
              captures: { b_west_id: "$.data.id", b_west_v1: "$.data.version" }
            - call: "POST /fleet/branches"
              payload:
                code: "EST-01"
                name: "East Yard"
                region: "EAST"
                yard_capacity: 8
                peak_season_start_date: "2026-06-01"
                peak_season_end_date: "2026-08-31"
                lease_reserve_pct: 0.00
              as: FleetAdmin
              captures: { b_east_id: "$.data.id" }
            - call: "POST /fleet/trailer-types"
              payload:
                code: "DRY_VAN_53"
                description: "53ft dry van"
                base_daily_rate_cents: 4500
                base_monthly_rate_cents: 95000
                residual_floor_cents: 450000
                required_physical_damage_limit_cents: 3000000
                dot_inspection_interval_days: 365
                pm_interval_miles: 30000
              as: FleetAdmin
              captures: { tt_dv_id: "$.data.id" }
            - call: "POST /fleet/rate-cards"
              payload:
                branch_id: "${b_west_id}"
                trailer_type_id: "${tt_dv_id}"
                product: "SHORT_TERM_RENTAL"
                daily_rate_cents: 5200
                monthly_rate_cents: 110000
                peak_uplift_pct: 0.30
                mileage_included_per_month: 2500
                excess_mileage_rate_cents_per_mile: 22
                effective_date: "2026-07-01"
                expected_branch_version: "${b_west_v1}"
              as: FleetAdmin
              captures: { rc_str_id: "$.data.id" }
            - call: "POST /fleet/trailers"
              payload:
                unit_number: "T-1001"
                trailer_type_id: "${tt_dv_id}"
                home_branch_id: "${b_west_id}"
                acquisition_cost_cents: 4500000
                in_service_date: "2022-08-01"
                last_dot_inspection_date: "2026-01-01"
                hub_miles: 41000
              as: FleetAdmin
              captures: { tr1_id: "$.data.id" }
            - call: "POST /fleet/customers"
              payload:
                legal_name: "Ridge Haul LLC"
                dot_number: "DOT-771"
                credit_tier: "B"
                credit_limit_cents: 5000000
              as: FleetAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /fleet/insurance-certificates"
              payload:
                customer_id: "${cust_id}"
                carrier_name: "Great West Casualty"
                policy_number: "P-1"
                physical_damage_limit_cents: 3000000
                liability_limit_cents: 100000000
                effective_date: "2024-01-01"
                expiry_date: "2027-01-01"
              as: FleetAdmin
              captures: { cert_id: "$.data.id" }
            - call: "POST /fleet/agreements"
              payload:
                customer_id: "${cust_id}"
                branch_id: "${b_west_id}"
                product: "SHORT_TERM_RENTAL"
                trailer_type_id: "${tt_dv_id}"
                unit_count: 1
                start_date: "2026-08-20"
                end_date: "2026-09-10"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ag1_id: "$.data.id" }
            - call: "POST /fleet/agreements/${ag1_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /fleet/agreements/${ag1_id}/verify-insurance"
              payload: {}
              as: FleetAdmin
              captures: { ag1_v3: "$.data.version" }
            - call: "POST /fleet/agreements/${ag1_id}/allocate"
              payload: { expected_agreement_version: "${ag1_v3}" }
              as: BranchManager
              as_user_id: "${b_west_id}"
              captures: { ag1_quoted: "$.data.quoted_total_cents" }
            - call: "POST /fleet/agreements/${ag1_id}/activate"
              payload: { checkout_date: "2026-08-20" }
              as: BranchManager
              as_user_id: "${b_west_id}"
            - call: "GET /fleet/agreement-units"
              payload: { agreement_id: "${ag1_id}" }
              as: BranchManager
              as_user_id: "${b_west_id}"
              captures: { u1_id: "$.data[0].id" }
            - call: "POST /fleet/agreement-units/${u1_id}/return"
              payload:
                return_branch_id: "${b_east_id}"
                return_hub_miles: 44000
                return_date: "2026-09-03"
              as: BranchManager
              as_user_id: "${b_east_id}"
          trigger:
            - call: "POST /fleet/agreements/${ag1_id}/settle"
              payload: {}
              as: FleetAdmin
              captures: { ag1_final: "$.data.final_total_cents" }
          assert:
            - "${ag1_quoted} == 123240"
            - "Agreement.${ag1_id}.quoted_total_cents == 123240"
            - "${ag1_final} == 151268"
            - "Agreement.${ag1_id}.final_total_cents == 151268"
            - "Agreement.${ag1_id}.final_total_cents != Agreement.${ag1_id}.quoted_total_cents"
            - "AgreementUnit.${u1_id}.line_charge_cents == 151268"
            - "AgreementUnit.${u1_id}.peak_days == 2"
            - "AgreementUnit.${u1_id}.excess_miles == 1834"
            - "AgreementUnit.${u1_id}.drop_charge_cents == 35000"
            - "AgreementUnit.${u1_id}.status == SETTLED"
            - "Agreement.${ag1_id}.status == CLOSED"

      - name: customer_risk_underwriting_snapshot_vs_renewal_review_diverge
        grounds:
          - calculations.customer_risk_score
          - entities.Agreement.fields.underwriting_risk_score
          - entities.Customer.fields.outstanding_chargeback_cents
          - state_machines.Agreement.status.DRAFT_to_PENDING_INSURANCE
          - state_machines.Chargeback.status.PENDING_to_APPROVED
        distinguishing_aspect: |
          This dual-variant instance is RISK SCORING ON THE Customer ENTITY, a different entity
          domain from the Agreement cost accounting above: with one APPROVED chargeback of 108000
          and one still-PENDING chargeback of 81000, underwriting_snapshot returns exactly 48 while
          renewal_review returns exactly 67 for the same customer at the same instant.
        test_recipe:
          setup:
            - "Bootstrap identical to the previous instance through Customer, certificate, trailer and RateCard."
            - "Agreement AG1 run to a returned unit at WST-01 with hub 42000."
            - "DamageAssessment A1 on that unit (MODERATE x2 @ 40000) submitted -> Chargeback CB1 of 108000, then APPROVED, so A1 is APPROVED."
            - "DamageAssessment A2 on the same unit (MINOR x3 @ 25000) submitted -> Chargeback CB2 of 81000 left PENDING, so A2 stays SUBMITTED."
          setup_api_calls:
            - call: "POST /fleet/branches"
              payload:
                code: "WST-01"
                name: "West Yard"
                region: "WEST"
                yard_capacity: 10
                peak_season_start_date: "2026-09-01"
                peak_season_end_date: "2026-11-30"
                lease_reserve_pct: 0.00
              as: FleetAdmin
              captures: { b_west_id: "$.data.id", b_west_v1: "$.data.version" }
            - call: "POST /fleet/trailer-types"
              payload:
                code: "DRY_VAN_53"
                description: "53ft dry van"
                base_daily_rate_cents: 4500
                base_monthly_rate_cents: 95000
                residual_floor_cents: 450000
                required_physical_damage_limit_cents: 3000000
                dot_inspection_interval_days: 365
                pm_interval_miles: 30000
              as: FleetAdmin
              captures: { tt_dv_id: "$.data.id" }
            - call: "POST /fleet/rate-cards"
              payload:
                branch_id: "${b_west_id}"
                trailer_type_id: "${tt_dv_id}"
                product: "SHORT_TERM_RENTAL"
                daily_rate_cents: 5200
                monthly_rate_cents: 110000
                peak_uplift_pct: 0.30
                mileage_included_per_month: 2500
                excess_mileage_rate_cents_per_mile: 22
                effective_date: "2026-07-01"
                expected_branch_version: "${b_west_v1}"
              as: FleetAdmin
            - call: "POST /fleet/trailers"
              payload:
                unit_number: "T-1001"
                trailer_type_id: "${tt_dv_id}"
                home_branch_id: "${b_west_id}"
                acquisition_cost_cents: 4500000
                in_service_date: "2022-08-01"
                last_dot_inspection_date: "2026-01-01"
                hub_miles: 41000
              as: FleetAdmin
              captures: { tr1_id: "$.data.id" }
            - call: "POST /fleet/customers"
              payload:
                legal_name: "Ridge Haul LLC"
                dot_number: "DOT-771"
                credit_tier: "B"
                credit_limit_cents: 5000000
              as: FleetAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /fleet/insurance-certificates"
              payload:
                customer_id: "${cust_id}"
                carrier_name: "Great West Casualty"
                policy_number: "P-1"
                physical_damage_limit_cents: 3000000
                liability_limit_cents: 100000000
                effective_date: "2024-01-01"
                expiry_date: "2027-01-01"
              as: FleetAdmin
            - call: "POST /fleet/agreements"
              payload:
                customer_id: "${cust_id}"
                branch_id: "${b_west_id}"
                product: "SHORT_TERM_RENTAL"
                trailer_type_id: "${tt_dv_id}"
                unit_count: 1
                start_date: "2026-08-20"
                end_date: "2026-09-10"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ag1_id: "$.data.id" }
            - call: "POST /fleet/agreements/${ag1_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /fleet/agreements/${ag1_id}/verify-insurance"
              payload: {}
              as: FleetAdmin
              captures: { ag1_v3: "$.data.version" }
            - call: "POST /fleet/agreements/${ag1_id}/allocate"
              payload: { expected_agreement_version: "${ag1_v3}" }
              as: FleetAdmin
            - call: "POST /fleet/agreements/${ag1_id}/activate"
              payload: { checkout_date: "2026-08-20" }
              as: FleetAdmin
            - call: "GET /fleet/agreement-units"
              payload: { agreement_id: "${ag1_id}" }
              as: FleetAdmin
              captures: { u1_id: "$.data[0].id" }
            - call: "POST /fleet/agreement-units/${u1_id}/return"
              payload:
                return_branch_id: "${b_west_id}"
                return_hub_miles: 42000
                return_date: "2026-09-03"
              as: BranchManager
              as_user_id: "${b_west_id}"
              captures: { u1_v2: "$.data.version" }
            - call: "POST /fleet/agreement-units/${u1_id}/damage-assessments"
              payload:
                line_items: [{ severity: "MODERATE", quantity: 2, unit_cost_cents: 40000, description: "sidewall scuff" }]
                expected_agreement_unit_version: "${u1_v2}"
              as: Inspector
              as_user_id: "insp-1"
              captures: { as1_id: "$.data.id" }
            - call: "POST /fleet/damage-assessments/${as1_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "insp-1"
            - call: "GET /fleet/chargebacks"
              payload: { damage_assessment_id: "${as1_id}" }
              as: ChargebackApprover
              as_user_id: "appr-1"
              captures: { cb1_id: "$.data[0].id", cb1_amount: "$.data[0].amount_cents" }
            - call: "POST /fleet/chargebacks/${cb1_id}/approve"
              payload: {}
              as: ChargebackApprover
              as_user_id: "appr-1"
            - call: "GET /fleet/agreement-units/${u1_id}"
              payload: {}
              as: Inspector
              as_user_id: "insp-1"
              captures: { u1_v3: "$.data.version" }
            - call: "POST /fleet/agreement-units/${u1_id}/damage-assessments"
              payload:
                line_items: [{ severity: "MINOR", quantity: 3, unit_cost_cents: 25000, description: "floor gouges" }]
                expected_agreement_unit_version: "${u1_v3}"
              as: Inspector
              as_user_id: "insp-1"
              captures: { as2_id: "$.data.id" }
            - call: "POST /fleet/damage-assessments/${as2_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /fleet/agreements"
              payload:
                customer_id: "${cust_id}"
                branch_id: "${b_west_id}"
                product: "SHORT_TERM_RENTAL"
                trailer_type_id: "${tt_dv_id}"
                unit_count: 1
                start_date: "2026-10-01"
                end_date: "2026-10-11"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ag2_id: "$.data.id" }
          trigger:
            - call: "POST /fleet/agreements/${ag2_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { uw_score: "$.data.underwriting_risk_score" }
            - call: "GET /fleet/customers/${cust_id}/risk-review"
              payload: {}
              as: FleetAdmin
              captures: { renewal_score: "$.data.risk_score", renewal_weighted: "$.data.weighted_chargeback_cents" }
          assert:
            - "${cb1_amount} == 108000"
            - "${uw_score} == 48"
            - "Agreement.${ag2_id}.underwriting_risk_score == 48"
            - "${renewal_score} == 67"
            - "${renewal_weighted} == 189000"
            - "${renewal_score} > ${uw_score}"
            - "Customer.${cust_id}.outstanding_chargeback_cents == 189000"
            - "DamageAssessment.${as1_id}.status == APPROVED"
            - "DamageAssessment.${as2_id}.status == SUBMITTED"

  # ===========================================================================
  # Rule 2 -- combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: final_total_rounds_each_unit_line_before_summing
        grounds:
          - calculations.agreement_total_cents
          - entities.AgreementUnit.fields.line_charge_cents
          - entities.RateCard.fields.peak_uplift_pct
          - state_machines.Agreement.status.PENDING_SETTLEMENT_to_CLOSED
        distinguishing_aspect: |
          MODE (b) -- NESTED ROUNDING WHERE THE ORDER CHANGES THE CENTS. Two units each accrue an
          unrounded 5595.375 cents; rounding per line first and then summing yields exactly 11190,
          while summing first (11190.75) and rounding once yields 11191. The scaffold pins
          round-per-line-then-sum, so the correct answer is 11190 and 11191 is wrong.
        test_recipe:
          setup:
            - "Branch WST-01, peak window 2026-09-01..2026-11-30, lease_reserve_pct 0.00."
            - "ACTIVE SHORT_TERM_RENTAL RateCard for DRY_VAN_53 at WST-01 with daily_rate_cents 5205 and peak_uplift_pct 0.075, so the peak daily rate is exactly 5595.375 cents."
            - "Two serviceable DRY_VAN_53 trailers at WST-01 (hub 10000 and 20000)."
            - "Agreement AG1 for 2 units over 2026-09-01 .. 2026-09-03, allocated, activated on 2026-09-01, both units returned on 2026-09-02 at WST-01 with zero added hub miles."
          setup_api_calls:
            - call: "POST /fleet/branches"
              payload:
                code: "WST-01"
                name: "West Yard"
                region: "WEST"
                yard_capacity: 10
                peak_season_start_date: "2026-09-01"
                peak_season_end_date: "2026-11-30"
                lease_reserve_pct: 0.00
              as: FleetAdmin
              captures: { b_west_id: "$.data.id", b_west_v1: "$.data.version" }
            - call: "POST /fleet/trailer-types"
              payload:
                code: "DRY_VAN_53"
                description: "53ft dry van"
                base_daily_rate_cents: 4500
                base_monthly_rate_cents: 95000
                residual_floor_cents: 450000
                required_physical_damage_limit_cents: 3000000
                dot_inspection_interval_days: 365
                pm_interval_miles: 30000
              as: FleetAdmin
              captures: { tt_dv_id: "$.data.id" }
            - call: "POST /fleet/rate-cards"
              payload:
                branch_id: "${b_west_id}"
                trailer_type_id: "${tt_dv_id}"
                product: "SHORT_TERM_RENTAL"
                daily_rate_cents: 5205
                monthly_rate_cents: 110000
                peak_uplift_pct: 0.075
                mileage_included_per_month: 2500
                excess_mileage_rate_cents_per_mile: 22
                effective_date: "2026-07-01"
                expected_branch_version: "${b_west_v1}"
              as: FleetAdmin
            - call: "POST /fleet/trailers"
              payload:
                unit_number: "T-2001"
                trailer_type_id: "${tt_dv_id}"
                home_branch_id: "${b_west_id}"
                acquisition_cost_cents: 4500000
                in_service_date: "2022-08-01"
                last_dot_inspection_date: "2026-01-01"
                hub_miles: 10000
              as: FleetAdmin
              captures: { tr_a_id: "$.data.id" }
            - call: "POST /fleet/trailers"
              payload:
                unit_number: "T-2002"
                trailer_type_id: "${tt_dv_id}"
                home_branch_id: "${b_west_id}"
                acquisition_cost_cents: 4500000
                in_service_date: "2022-08-01"
                last_dot_inspection_date: "2026-01-01"
                hub_miles: 20000
              as: FleetAdmin
              captures: { tr_b_id: "$.data.id" }
            - call: "POST /fleet/customers"
              payload:
                legal_name: "Ridge Haul LLC"
                dot_number: "DOT-771"
                credit_tier: "B"
                credit_limit_cents: 5000000
              as: FleetAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /fleet/insurance-certificates"
              payload:
                customer_id: "${cust_id}"
                carrier_name: "Great West Casualty"
                policy_number: "P-1"
                physical_damage_limit_cents: 3000000
                liability_limit_cents: 100000000
                effective_date: "2024-01-01"
                expiry_date: "2027-01-01"
              as: FleetAdmin
            - call: "POST /fleet/agreements"
              payload:
                customer_id: "${cust_id}"
                branch_id: "${b_west_id}"
                product: "SHORT_TERM_RENTAL"
                trailer_type_id: "${tt_dv_id}"
                unit_count: 2
                start_date: "2026-09-01"
                end_date: "2026-09-03"
              as: FleetAdmin
              captures: { ag_id: "$.data.id" }
            - call: "POST /fleet/agreements/${ag_id}/submit"
              payload: {}
              as: FleetAdmin
            - call: "POST /fleet/agreements/${ag_id}/verify-insurance"
              payload: {}
              as: FleetAdmin
              captures: { ag_v3: "$.data.version" }
            - call: "POST /fleet/agreements/${ag_id}/allocate"
              payload: { expected_agreement_version: "${ag_v3}" }
              as: FleetAdmin
              captures: { ag_quoted: "$.data.quoted_total_cents" }
            - call: "POST /fleet/agreements/${ag_id}/activate"
              payload: { checkout_date: "2026-09-01" }
              as: FleetAdmin
            - call: "GET /fleet/agreement-units"
              payload: { agreement_id: "${ag_id}", trailer_id: "${tr_a_id}" }
              as: FleetAdmin
              captures: { ua_id: "$.data[0].id" }
            - call: "GET /fleet/agreement-units"
              payload: { agreement_id: "${ag_id}", trailer_id: "${tr_b_id}" }
              as: FleetAdmin
              captures: { ub_id: "$.data[0].id" }
            - call: "POST /fleet/agreement-units/${ua_id}/return"
              payload:
                return_branch_id: "${b_west_id}"
                return_hub_miles: 10000
                return_date: "2026-09-02"
              as: BranchManager
              as_user_id: "${b_west_id}"
            - call: "POST /fleet/agreement-units/${ub_id}/return"
              payload:
                return_branch_id: "${b_west_id}"
                return_hub_miles: 20000
                return_date: "2026-09-02"
              as: BranchManager
              as_user_id: "${b_west_id}"
          trigger:
            - call: "POST /fleet/agreements/${ag_id}/settle"
              payload: {}
              as: FleetAdmin
              captures: { ag_final: "$.data.final_total_cents" }
          assert:
            - "AgreementUnit.${ua_id}.line_charge_cents == 5595"
            - "AgreementUnit.${ub_id}.line_charge_cents == 5595"
            - "AgreementUnit.${ua_id}.peak_days == 1"
            - "${ag_final} == 11190"
            - "Agreement.${ag_id}.final_total_cents == 11190"
            - "Agreement.${ag_id}.final_total_cents != 11191"
            - "${ag_quoted} == 22382"
            - "Agreement.${ag_id}.quoted_total_cents == 22382"

      - name: purchase_option_credit_cap_keyed_on_pre_credit_base_price
        grounds:
          - calculations.purchase_option_price_cents
          - calculations.trailer_net_book_value_cents
          - entities.Agreement.fields.purchase_option_price_cents
          - entities.Agreement.fields.purchase_option_status
          - state_machines.Agreement.purchase_option_status.NOT_OFFERED_to_OFFERED
        distinguishing_aspect: |
          MODE (c) -- CIRCULAR-LOOKING DEPENDENCY WITH A PINNED EVALUATION ORDER, structurally
          different from the rounding-order instance above. The lease credit is capped at 30% of a
          price that is itself the book value minus that credit. The scaffold pins the cap to the
          PRE-credit base price 2662500, giving cap 798750, applied credit 400081 and a final price
          of exactly 2262419; keying the cap off the post-credit price yields a different number.
        test_recipe:
          setup:
            - "Branch WST-01 with peak window 2026-09-01..2026-11-30 (so a lease ending 2026-09-01 exclusive has zero peak days)."
            - "ACTIVE FULL_SERVICE_LEASE RateCard at WST-01 for DRY_VAN_53: daily 3800, peak uplift 0.10, 5000 included miles per 30 days, 15 cents per excess mile."
            - "Trailer T-3001 acquired for 4,500,000 cents, in service 2022-08-01, hub 41000, DOT good to 2027-01-01."
