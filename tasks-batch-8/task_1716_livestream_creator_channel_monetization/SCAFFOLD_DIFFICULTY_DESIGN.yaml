      - name: strike_suspension_payout_hold_cascade
        grounds: [state_machines.Channel.STANDARD_to_SUSPENDED, state_machines.Payout.SCHEDULED_to_HELD, calculations.strike_weight]
        distinguishing_aspect: |
          Depth-2 chain from the strike-issuance trigger (a third distinct trigger): SEVERE
          strike ISSUED pushes active weight to exactly 3 -> Channel STANDARD->SUSPENDED [1];
          the suspension cascades the channel's SCHEDULED payout to HELD with hold_reason=POSTURE [2].
        test_recipe:
          setup:
