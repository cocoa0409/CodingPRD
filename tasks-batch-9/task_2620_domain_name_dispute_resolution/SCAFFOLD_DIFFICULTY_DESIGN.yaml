      - name: segregation_of_duties_at_priority_50_beats_fee_shortfall_at_priority_80
        grounds:
          - validations[priority=50].ERR_SEGREGATION_OF_DUTIES
          - validations[priority=80].ERR_FILING_FEE_SHORTFALL
          - roles.CaseManager
          - calculations.case_ledger_reconciliation
          - calculations.filing_fee_assessment
        distinguishing_aspect: |
          Two violations of different kinds sit on the same call to compliance clearance: the acting
          case manager is the very user who issued the case's most recent deficiency notice (a 403
          authority failure) and the complainant has paid 100000 of a 150000 share (a 402 payment
          failure). The ladder must answer 403 ERR_SEGREGATION_OF_DUTIES, not 402
          ERR_FILING_FEE_SHORTFALL, and the follow-up call as the other case manager then surfaces
          the 402 - so the pair pins both the order and the liveness of both rules, and a wrong
          ordering shows up as a different HTTP status class, not just a different error id.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z throughout."
            - "Registrar IANA-1505 ACTIVE; domain sodcase.example under it."
            - "Complainant Duties Ltd (country_code FR) files a single-member case; assessed_fee_cents 150000 and complainant_share_cents 150000."
            - "Only 100000 cents are paid by the complainant, leaving a 50000 shortfall."
            - "cm-001 issues a deficiency notice, the complainant cures it, so the case is back in FILED and last_deficiency_issuer_user_id is cm-001."
          setup_api_calls:
            - call: "POST /udrp/_clock/set_current_utc"
