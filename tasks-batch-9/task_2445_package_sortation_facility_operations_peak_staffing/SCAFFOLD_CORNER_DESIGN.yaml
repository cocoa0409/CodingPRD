            - "ShiftPlan.${plan_id}.flex_draw_count == 1 and committed_headcount == 4 and staffing_gap == 0 and status == APPROVED"
            - "SortCenter.${center_id}.flex_pool_available == 4 and flex_pool_reserved == 1, with flex_pool_total 5 == 4 + 1"
            - "Worker.${w_id}.attrition_risk_score == 0.4200 with attrition_risk_basis == COHORT_BASELINE (0 completed assignments)"

      - name: corner_cyclic_shape_trailer_jam_loop
        claim_type: cyclic
        grounds:
          - state_machines.TrailerAppointment.JAM_HELD_to_UNLOADING
        excluded_because:
          difficulty_instance: non_linear_state_machine / trailer_jam_cycle_bounded_by_retry_limit
          rationale: "The loop-count termination condition (JAM_RETRY_LIMIT) is the subject of the named §1.8 instance."

      - name: corner_parallel_shape_outbound_dimensions
        claim_type: parallel
        grounds:
          - state_machines.OutboundLoad.seal_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / outbound_load_parallel_load_and_seal_dimensions
          rationale: "Independent movement of load_status and seal_status plus their join at dispatch is exactly the named §1.8 instance."

      - name: corner_branching_shape_shift_plan_fork
        claim_type: branching
        grounds:
          - state_machines.ShiftPlan.SUBMITTED_to_REJECTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / shift_plan_branching_fork_and_revision_cycle
          rationale: "Both fork branches and the REJECTED -> DRAFT revision cycle are asserted by the named §1.8 instance."

      - name: corner_guarded_transition_check_in_requires_certified
        claim_type: guarded transitions
        grounds:
          - state_machines.StaffAssignment.ASSIGNED_to_CHECKED_IN
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / check_in_blocked_until_worker_is_certified
          rationale: "The cross-entity guard on Worker.status is the subject of the named §1.8 instance."

      - name: corner_cascade_down_jam_hold_chain
        claim_type: Cascade down
        grounds:
          - state_machines.TrailerAppointment.UNLOADING_to_JAM_HELD
        excluded_because:
          difficulty_instance: transitive_cascade / jam_hold_depth4_cascade_to_center_posture
          rationale: "The four-level downward cascade and its per-level observables are the named §1.8 instance."

      - name: corner_compensation_resume_unload
        claim_type: Compensation
        grounds:
          - state_machines.TrailerAppointment.JAM_HELD_to_UNLOADING
        excluded_because:
          difficulty_instance: compensating_invariant / jam_resume_restores_lane_backlog_and_capacity_exactly
          rationale: "Exact reversal of the jam-hold side effects with no drift is the named §1.8 instance."

  # ===================================================================
  # 3. Calculations
  # ===================================================================
  - section: calculations
    instances:
      - name: unload_rank_recomputed_after_out_of_order_arrivals
        claim_type: chronological
        grounds:
          - calculations.unload_sequence_ranking
          - state_machines.TrailerAppointment.SCHEDULED_to_ARRIVED
        distinguishing_aspect: "Ranking is by priority class first and creation order last, so trailers that arrive in the wrong order are still ranked correctly, and start-unload re-ranks the survivors inside the same request."
        test_recipe:
          setup:
            - "Center SC1 with three inbound doors IN-1, IN-2 and IN-3 (one per trailer, so no door window can conflict)"
            - "Three appointments created in the WRONG order relative to their final rank: T-STD (STANDARD, 06:00-07:00, manifest 900), T-CRIT (CRITICAL, 08:00-09:00, manifest 300), T-EXP (EXPRESS, 07:00-08:00, manifest 600)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/dock-doors"
              payload: { door_number: "IN-1", kind: "INBOUND" }
              as: FacilityAdmin
              captures: { door1_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/dock-doors"
              payload: { door_number: "IN-2", kind: "INBOUND" }
              as: FacilityAdmin
              captures: { door2_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/dock-doors"
              payload: { door_number: "IN-3", kind: "INBOUND" }
              as: FacilityAdmin
              captures: { door3_id: $.data.id }
            - call: "POST /sortation/trailer-appointments"
              payload: { sort_center_id: "${center_id}", door_id: "${door1_id}", trailer_code: "T-STD", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T07:00:00Z", priority_class: "STANDARD", manifest_package_count: 900 }
              as: InboundCoordinator
              captures: { std_id: $.data.id }
            - call: "POST /sortation/trailer-appointments"
              payload: { sort_center_id: "${center_id}", door_id: "${door2_id}", trailer_code: "T-CRIT", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T09:00:00Z", priority_class: "CRITICAL", manifest_package_count: 300 }
              as: InboundCoordinator
              captures: { crit_id: $.data.id }
            - call: "POST /sortation/trailer-appointments"
              payload: { sort_center_id: "${center_id}", door_id: "${door3_id}", trailer_code: "T-EXP", window_start: "2026-08-03T07:00:00Z", window_end: "2026-08-03T08:00:00Z", priority_class: "EXPRESS", manifest_package_count: 600 }
              as: InboundCoordinator
              captures: { exp_id: $.data.id }
          trigger:
            - call: "POST /sortation/trailer-appointments/${std_id}/arrive"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${crit_id}/arrive"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${exp_id}/arrive"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${crit_id}/start-unload"
              payload: {}
              as: InboundCoordinator
          assert:
            - "after the first arrive T-STD holds unload_sequence_rank == 1 (it is alone in the ARRIVED set)"
            - "after the second arrive T-CRIT holds rank 1 and T-STD is demoted to rank 2, even though T-STD arrived first and has a much earlier window_start"
            - "after the third arrive the ranks are T-CRIT 1, T-EXP 2, T-STD 3 (priority class dominates window_start)"
            - "after start-unload on T-CRIT its rank is null (UNLOADING is outside the input set) and the survivors are re-ranked in the same request to T-EXP 1 and T-STD 2"
            - "SortCenter.${center_id}.packages_inducted_count == 0 (nothing has completed unloading yet)"

      - name: scan_outside_every_plan_window_attributes_no_plan
        claim_type: projection
        grounds:
          - calculations.attributed_shift_plan
          - endpoints.POST_/sortation/outbound-loads/{id}/scan-packages
        distinguishing_aspect: "The selector's empty-set fallback is a success, not an error: a scan taken while the only APPROVED plan's half-open window has not started leaves that plan's counters at zero, and the very same load scanning again after the clock enters the window is attributed."
        test_recipe:
          setup:
            - "Center SC1 (automation 70) with chute C1, lane L-WEST assigned to C1, inbound door IN-1 and outbound door OUT-1"
            - "500 packages inducted into work-in-process, an outbound load on L-WEST (trailer_cube_cuft 1000)"
            - "One APPROVED ShiftPlan for shift_date 2026-08-04 with window 2026-08-04T06:00:00Z - 2026-08-04T14:00:00Z (forecast_volume 4000, core 4, budget 100000): required_headcount 4, flex_draw_count 0"
            - "The logical clock sits at 2026-08-03T09:00:00Z, i.e. BEFORE that window"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/dock-doors"
              payload: { door_number: "IN-1", kind: "INBOUND" }
              as: FacilityAdmin
              captures: { door_in_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/dock-doors"
              payload: { door_number: "OUT-1", kind: "OUTBOUND" }
              as: FacilityAdmin
              captures: { door_out_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/sort-chutes"
              payload: { chute_number: "C1", throughput_pph: 1200 }
              as: FacilityAdmin
              captures: { chute_id: $.data.id, chute_v: $.data.version }
            - call: "POST /sortation/sort-centers/${center_id}/destination-lanes"
              payload: { lane_code: "L-WEST", region: "WEST", service_class: "GROUND", forecast_hourly_volume: 3000 }
              as: FacilityAdmin
              captures: { lane_id: $.data.id }
            - call: "POST /sortation/chute-assignments"
              payload: { chute_id: "${chute_id}", destination_lane_id: "${lane_id}", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-04T14:00:00Z", expected_chute_version: "${chute_v}" }
              as: SortSupervisor
            - call: "POST /sortation/trailer-appointments"
              payload: { sort_center_id: "${center_id}", door_id: "${door_in_id}", trailer_code: "T-A", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T10:00:00Z", priority_class: "STANDARD", manifest_package_count: 500 }
              as: InboundCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /sortation/trailer-appointments/${appt_id}/arrive"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt_id}/start-unload"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt_id}/complete-unload"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/outbound-loads"
              payload: { sort_center_id: "${center_id}", door_id: "${door_out_id}", destination_lane_id: "${lane_id}", trailer_code: "T-OUT-1", trailer_cube_cuft: 1000, dispatch_cut_time: "2026-08-04T13:00:00Z" }
              as: SortSupervisor
              captures: { load_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/shift-plans"
              payload: { shift_date: "2026-08-04", shift_window_start: "2026-08-04T06:00:00Z", shift_window_end: "2026-08-04T14:00:00Z", forecast_volume: 4000, planned_core_headcount: 4, planned_seasonal_headcount: 0, labor_budget_cents: 100000 }
              as: LaborPlanner
              as_user_id: "u_planner_1"
              captures: { plan_id: $.data.id }
            - call: "POST /sortation/shift-plans/${plan_id}/submit"
              payload: {}
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "GET /sortation/sort-centers/${center_id}"
              payload: {}
              as: OpsManager
              as_user_id: "u_ops_1"
              captures: { center_v: $.data.version }
            - call: "POST /sortation/shift-plans/${plan_id}/approve"
              payload: { expected_center_version: "${center_v}" }
              as: OpsManager
              as_user_id: "u_ops_1"
          trigger:
            - call: "POST /sortation/outbound-loads/${load_id}/scan-packages"
              payload: { small_count: 100 }
              as: SortSupervisor
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T07:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/outbound-loads/${load_id}/scan-packages"
              payload: { small_count: 50 }
              as: SortSupervisor
          assert:
            - "the first scan returns HTTP 200 with data.package_count == 100 and data.cube_used_cuft == 33.50"
            - "after the first scan ShiftPlan.${plan_id}.sorted_package_count == 0 (the clock is before shift_window_start, so the selector pool is empty)"
            - "after the first scan SortCenter.${center_id}.wip_package_count == 400 and DestinationLane.${lane_id}.sorted_package_count == 100 (center and lane counters are ALWAYS updated)"
            - "the second scan returns HTTP 200 with data.package_count == 150 and data.cube_used_cuft == 50.25"
            - "after the second scan ShiftPlan.${plan_id}.sorted_package_count == 50 - only the in-window batch is attributed"
            - "ShiftPlan.${plan_id}.status stays APPROVED throughout"

      - name: reroute_picks_highest_throughput_eligible_chute
        claim_type: waterfall_allocation
        grounds:
          - calculations.reroute_chute_selection
          - endpoints.POST_/sortation/package-exceptions/{id}/resolve
        distinguishing_aspect: "Two chutes are ACTIVE-assigned to the target lane in the same window; the selector must take the 1800 pph chute rather than the earlier-created 1200 pph one, so the tie-break on created_at is provably not reached."
        test_recipe:
