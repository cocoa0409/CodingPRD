  - rule_id: resource_temporal_overlap
    instances:
      - name: offer_windows_are_half_open_so_touching_is_allowed_and_straddling_is_not
        grounds:
          - "validations[priority=36]"
          - "errors[ERR_OFFER_WINDOW_OVERLAP]"
          - "entities.Offer.fields.effective_start_date"
          - "entities.Offer.fields.effective_end_date"
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [start, end) occupation of the (program_id, sku_scope, channel)
          resource with capacity 1 and NO buffer, so an offer beginning exactly at 2026-09-01, where the
          incumbent ends, is accepted, while one starting 2026-08-15 inside the incumbent is rejected.
        test_recipe:
          setup:
            - "ACTIVE Program with one PUBLISHED DEALER offer on sku_scope TOOLS spanning 2026-06-01 to 2026-09-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "POST /api/programs"
              payload: { name: "Overlap Program", budget_total_cents: 100000000, fiscal_year: 2026, escheat_jurisdiction: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "POST /api/offers"
              payload: { program_id: "${prog_id}", name: "Incumbent Offer", channel: "DEALER", sku_scope: "TOOLS", effective_start_date: "2026-06-01T00:00:00Z", effective_end_date: "2026-09-01T00:00:00Z", max_rebate_cents_per_claim: 500000 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { offer_incumbent: $.data.id }
            - call: "POST /api/offers/${offer_incumbent}/publish"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
          trigger:
            - call: "POST /api/offers"
              payload: { program_id: "${prog_id}", name: "Adjacent Offer", channel: "DEALER", sku_scope: "TOOLS", effective_start_date: "2026-09-01T00:00:00Z", effective_end_date: "2026-11-01T00:00:00Z", max_rebate_cents_per_claim: 500000 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { offer_adjacent: $.data.id }
            - call: "POST /api/offers"
              payload: { program_id: "${prog_id}", name: "Straddling Offer", channel: "DEALER", sku_scope: "TOOLS", effective_start_date: "2026-08-15T00:00:00Z", effective_end_date: "2026-10-01T00:00:00Z", max_rebate_cents_per_claim: 500000 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "the adjacent create returns HTTP 201 and Offer.${offer_adjacent}.status == DRAFT"
            - "the straddling create returns HTTP 409 with response.data.error_id == ERR_OFFER_WINDOW_OVERLAP"
            - "GET /api/offers?program_id=${prog_id} returns exactly 2 offers"

      - name: receipt_serial_dedupe_uses_closed_365_day_window
        grounds:
          - "validations[priority=34]"
          - "errors[ERR_DUPLICATE_RECEIPT_SERIAL]"
          - "entities.Receipt.fields.serial_number"
          - "entities.Claimant.fields.duplicate_attempt_count"
        distinguishing_aspect: |
          Different interval semantics on a different resource: the serial_number occupation is a
          CLOSED, symmetric +/- DEDUPE_WINDOW_DAYS window anchored on purchase_date and shared across
          claimants, so purchases exactly 365 days apart (2026-06-15 and 2027-06-15) still collide,
          unlike the half-open, adjacency-tolerant offer window.
        test_recipe:
          setup:
            - "ACTIVE Program with a PUBLISHED DEALER offer spanning 2026-06-01 to 2027-09-01."
            - "Claimant A holds a SUBMITTED claim whose receipt carries serial SN-365 purchased 2026-06-15, submitted while the clock read 2026-07-01."
            - "Claimant B holds a DRAFT claim whose receipt carries the same serial SN-365 purchased 2027-06-15, with the clock advanced to 2027-06-25."
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { name: "Serial Program", budget_total_cents: 100000000, fiscal_year: 2026, escheat_jurisdiction: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "POST /api/offers"
              payload: { program_id: "${prog_id}", name: "Serial Offer", channel: "DEALER", sku_scope: "TOOLS", effective_start_date: "2026-06-01T00:00:00Z", effective_end_date: "2027-09-01T00:00:00Z", max_rebate_cents_per_claim: 500000 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { offer_id: $.data.id }
            - call: "POST /api/offers/${offer_id}/publish"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "POST /api/claimants"
              payload: { type: "DEALER", legal_name: "Serial A", email: "sa@ser.example", mailing_state: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { clmt_a: $.data.id }
            - call: "POST /api/claimants"
              payload: { type: "DEALER", legal_name: "Serial B", email: "sb@ser.example", mailing_state: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { clmt_b: $.data.id }
            - call: "POST /api/claims"
              payload: { offer_id: "${offer_id}", claimant_id: "${clmt_a}" }
              as: Dealer
              as_user_id: "${clmt_a}"
              captures: { claim_a: $.data.id }
            - call: "POST /api/claims/${claim_a}/receipts"
              payload: { serial_number: "SN-365", purchase_date: "2026-06-15T00:00:00Z", retailer_name: "Bay Supply", lines: [ { sku: "TOOLS-A", quantity: 2, unit_price_cents: 1000 } ] }
              as: Dealer
              as_user_id: "${clmt_a}"
            - call: "POST /api/claims/${claim_a}/submit"
              payload: {}
              as: Dealer
              as_user_id: "${clmt_a}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-25T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "POST /api/claims"
              payload: { offer_id: "${offer_id}", claimant_id: "${clmt_b}" }
              as: Dealer
              as_user_id: "${clmt_b}"
              captures: { claim_b: $.data.id }
            - call: "POST /api/claims/${claim_b}/receipts"
              payload: { serial_number: "SN-365", purchase_date: "2027-06-15T00:00:00Z", retailer_name: "Bay Supply", lines: [ { sku: "TOOLS-A", quantity: 2, unit_price_cents: 1000 } ] }
              as: Dealer
              as_user_id: "${clmt_b}"
          trigger:
            - call: "POST /api/claims/${claim_b}/submit"
              payload: {}
              as: Dealer
              as_user_id: "${clmt_b}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_DUPLICATE_RECEIPT_SERIAL"
            - "Claimant.${clmt_b}.duplicate_attempt_count == 1"
            - "Claim.${claim_b}.adjudication_status == DRAFT"
            - "Claim.${claim_a}.adjudication_status == SUBMITTED"

  - rule_id: compensating_invariant
    instances:
      - name: approve_then_revoke_restores_program_available_cents_exactly
        grounds:
          - "state_machines.Claim.UNDER_REVIEW_to_APPROVED"
          - "state_machines.Claim.APPROVED_to_REVOKED"
          - "calculations.program_budget_position"
          - "entities.Program.fields.available_cents"
          - "entities.BudgetEntry.fields.entry_type"
        distinguishing_aspect: |
          Conserved quantity: MONEY, specifically Program.available_cents. The COMMIT of 1600 at approval
          and the RELEASE of 1600 at revocation must leave available_cents at exactly its post-activation
          value of 1000000, with committed_cents back at 0 and no residual drift of a single cent.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z."
            - "ACTIVE Program with budget_total_cents 1000000 and available_cents 1000000."
            - "An APPROVED DEALER claim with final_rebate_cents 1600 and no payout."
            - "A FraudCase for that claimant sitting in UNDER_INVESTIGATION."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "POST /api/programs"
              payload: { name: "Conservation Program", budget_total_cents: 1000000, fiscal_year: 2026, escheat_jurisdiction: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "POST /api/offers"
              payload: { program_id: "${prog_id}", name: "Conservation Offer", channel: "DEALER", sku_scope: "TOOLS", effective_start_date: "2026-06-01T00:00:00Z", effective_end_date: "2026-09-01T00:00:00Z", max_rebate_cents_per_claim: 500000 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { offer_id: $.data.id }
            - call: "POST /api/offers/${offer_id}/publish"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "POST /api/claimants"
              payload: { type: "DEALER", legal_name: "Conservation Dealer", email: "cv@cv.example", mailing_state: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { clmt_id: $.data.id }
            - call: "POST /api/claims"
              payload: { offer_id: "${offer_id}", claimant_id: "${clmt_id}" }
              as: Dealer
              as_user_id: "${clmt_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/receipts"
              payload: { serial_number: "SN-CNV-1", purchase_date: "2026-06-20T00:00:00Z", retailer_name: "Bay Supply", lines: [ { sku: "TOOLS-A", quantity: 10, unit_price_cents: 2000 } ] }
              as: Dealer
              as_user_id: "${clmt_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/submit"
              payload: {}
              as: Dealer
              as_user_id: "${clmt_id}"
            - call: "POST /api/claims/${claim_id}/review"
              payload: {}
              as: ClaimsProcessor
              as_user_id: "u-proc-1"
            - call: "POST /api/receipts/${r1_id}/validate"
              payload: {}
              as: ClaimsProcessor
              as_user_id: "u-proc-1"
            - call: "POST /api/claims/${claim_id}/approve"
              payload: {}
              as: ClaimsProcessor
              as_user_id: "u-proc-1"
            - call: "POST /api/fraud-cases"
              payload: { claimant_id: "${clmt_id}", opened_reason: "LEDGER_AUDIT" }
              as: FraudAnalyst
              as_user_id: "u-fraud-1"
              captures: { case_id: $.data.id }
            - call: "POST /api/fraud-cases/${case_id}/transition"
              payload: { to_status: "UNDER_INVESTIGATION" }
              as: FraudAnalyst
              as_user_id: "u-fraud-1"
          trigger:
            - call: "POST /api/fraud-cases/${case_id}/transition"
              payload: { to_status: "SUBSTANTIATED" }
              as: FraudAnalyst
              as_user_id: "u-fraud-1"
          assert:
            - "immediately after the approve, Program.${prog_id}.committed_cents == 1600 and Program.${prog_id}.available_cents == 998400"
            - "after the revoke, Program.${prog_id}.committed_cents == 0"
            - "after the revoke, Program.${prog_id}.available_cents == 1000000"
            - "after the revoke, Program.${prog_id}.utilization_pct == 0.0"
            - "Claim.${claim_id}.adjudication_status == REVOKED"
            - "GET /api/budget-entries?claim_id=${claim_id} returns one COMMIT of 1600 and one RELEASE of 1600"

      - name: submit_then_withdraw_restores_claim_slot_counters_exactly
        grounds:
          - "state_machines.Claim.DRAFT_to_SUBMITTED"
          - "state_machines.Claim.SUBMITTED_to_WITHDRAWN"
          - "entities.Claimant.fields.open_claim_count"
          - "entities.Offer.fields.active_claim_count"
          - "entities.Program.fields.pending_provisional_cents"
        distinguishing_aspect: |
          Conserved quantity: CLAIM-SLOT COUNTS rather than money. Submitting raises
          Claimant.open_claim_count and Offer.active_claim_count from 0 to 1 and the program's
          pending_provisional_cents to 1600 with reserve 240; withdrawing must return all four numbers
          to 0 with no residual slot consumed against MAX_CLAIMS_PER_CLAIMANT_PER_OFFER.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z."
            - "ACTIVE Program with budget_total_cents 1000000 and a PUBLISHED DEALER offer."
            - "One DEALER claimant with a single DRAFT claim carrying a 10 x 2000-cent receipt (provisional rebate 1600)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "POST /api/programs"
              payload: { name: "Slot Program", budget_total_cents: 1000000, fiscal_year: 2026, escheat_jurisdiction: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "POST /api/offers"
              payload: { program_id: "${prog_id}", name: "Slot Offer", channel: "DEALER", sku_scope: "TOOLS", effective_start_date: "2026-06-01T00:00:00Z", effective_end_date: "2026-09-01T00:00:00Z", max_rebate_cents_per_claim: 500000 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { offer_id: $.data.id }
            - call: "POST /api/offers/${offer_id}/publish"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "POST /api/claimants"
              payload: { type: "DEALER", legal_name: "Slot Dealer", email: "sl@sl.example", mailing_state: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { clmt_id: $.data.id }
            - call: "POST /api/claims"
              payload: { offer_id: "${offer_id}", claimant_id: "${clmt_id}" }
              as: Dealer
              as_user_id: "${clmt_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/receipts"
              payload: { serial_number: "SN-SLT-1", purchase_date: "2026-06-20T00:00:00Z", retailer_name: "Bay Supply", lines: [ { sku: "TOOLS-A", quantity: 10, unit_price_cents: 2000 } ] }
              as: Dealer
              as_user_id: "${clmt_id}"
          trigger:
            - call: "POST /api/claims/${claim_id}/submit"
              payload: {}
              as: Dealer
              as_user_id: "${clmt_id}"
            - call: "POST /api/claims/${claim_id}/withdraw"
              payload: {}
              as: Dealer
              as_user_id: "${clmt_id}"
          assert:
            - "immediately after the submit, Claimant.${clmt_id}.open_claim_count == 1 and Offer.${offer_id}.active_claim_count == 1"
            - "immediately after the submit, Program.${prog_id}.pending_provisional_cents == 1600 and Program.${prog_id}.reserve_cents == 240"
            - "immediately after the submit, Program.${prog_id}.available_cents == 999760"
            - "after the withdraw, Claimant.${clmt_id}.open_claim_count == 0"
            - "after the withdraw, Offer.${offer_id}.active_claim_count == 0"
            - "after the withdraw, Program.${prog_id}.pending_provisional_cents == 0 and Program.${prog_id}.reserve_cents == 0"
            - "after the withdraw, Program.${prog_id}.available_cents == 1000000"
            - "Claim.${claim_id}.adjudication_status == WITHDRAWN"
