              as: HRAdmin
              captures: { sched_id: $.data.id }
            - { call: "POST /adjunct-hr/rate-schedules/${sched_id}/publish", payload: {}, as: HRAdmin }
            - call: "POST /adjunct-hr/postings"
              payload: { department_id: "${dept_id}", term_code: "2026FA", title: "Cons Pool", min_education_tier: "MASTERS", open_date: "2026-06-01", close_date: "2026-07-15" }
              as: DepartmentChair
              captures: { posting_id: $.data.id }
            - { call: "POST /adjunct-hr/postings/${posting_id}/publish", payload: {}, as: DepartmentChair }
            - call: "POST /adjunct-hr/applications"
              payload: { posting_id: "${posting_id}", applicant_name: "Mia Adjunct", applicant_email: "mia@x.edu", claimed_education_tier: "MASTERS" }
              as: HRReviewer
              as_user_id: "hr_reviewer_1"
