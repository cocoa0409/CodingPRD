              payload: {}
              as: PlatformAdmin
              captures: { m_fr_read: $.data.member_rating_average }
          assert:
            - "HostBusiness.${h_fr}.host_rating_average == 0.00 on creation"
            - "Member.${m_fr}.member_rating_average == 0.00 on creation"
            - "neither field is null and neither endpoint returns an error for the empty input set"
            - "HostReview.${h_fr} — GET /api/reviews?host_id=${h_fr} returns an empty array with total_count 0, confirming the denominator really is empty"

