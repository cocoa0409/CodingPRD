            - "FundraisingContract.${ct_id}.filed_at == 2026-08-01T00:00:00Z"
            - "FundraisingContract.${ct_id}.late_filing_surcharge_cents == 0"

      - name: promotion_activate_requires_clear_posture_from_another_states_filing
        grounds:
          - validations[priority=15]
          - state_machines.Organization.CLEAR_to_RESTRICTED
          - state_machines.Organization.RESTRICTED_to_CLEAR
          - state_machines.CoventurePromotion.FILED_to_ACTIVE
          - state_machines.EnforcementAction.ESCALATED_to_VACATED
        depends_on:
          acting_entity: "CoventurePromotion (FILED, state_codes [FL])"
          gating_entity: "Organization.solicitation_posture, itself derived from a CEASED StateRegistration in CA"
          gating_condition: "solicitation_posture == CLEAR, which is strictly narrower than the != HALTED gate used elsewhere"
