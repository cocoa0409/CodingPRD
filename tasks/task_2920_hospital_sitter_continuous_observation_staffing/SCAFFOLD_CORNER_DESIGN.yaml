      - name: escalate_response_on_a_self_harm_event_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.SafetyEvent.status.REPORTED_to_ESCALATED_RESPONSE
          - errors.ERR_INVALID_EVENT_STATE
        distinguishing_aspect: "The SafetyEvent fork is kind-gated: SELF_HARM_ATTEMPT and FALL_WITH_INJURY may only take the incident-review branch, so escalate-response on a self-harm event is refused even though the event is in REPORTED — the precondition is on event_kind, not on status."
        test_recipe:
          setup:
            - "One unit, one admitted patient age 60, one ACTIVE order including SELF_HARM with an ADVANCED sitter on watch."
