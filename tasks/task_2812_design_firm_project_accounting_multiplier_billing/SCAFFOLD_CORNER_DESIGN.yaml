              payload: {}
              as: Controller
              captures: { p_v1: $.data.version }
            - call: "POST /time-entries/${te_id}/approve"
              payload: {}
              as: ProjectManager
              as_user_id: "pm-001"
            - call: "POST /billing-multipliers"
              payload: { project_id: "${p_id}", multiplier: 3.2000, effective_from: "2026-06-01", expected_project_version: "${p_v1}" }
              as: Controller
            - call: "GET /billing-multipliers/${bm1}"
              payload: {}
              as: Controller
            - call: "GET /projects/${p_id}"
              payload: {}
              as: Controller
              captures: { p_v2: $.data.version }
            - call: "POST /billing-multipliers"
              payload: { project_id: "${p_id}", multiplier: 3.2000, effective_from: "2026-06-01", expected_project_version: "${p_v2}" }
              as: Controller
