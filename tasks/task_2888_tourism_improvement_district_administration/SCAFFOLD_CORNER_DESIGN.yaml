            - "AnnualWorkPlan.${wp_id}.sales_and_marketing_cents == 650000, above the 600000 floor"
            - "AnnualWorkPlan.${wp_id}.destination_events_cents == 100000 and capital_improvement_cents == 0"
            - "AnnualWorkPlan.${wp_id}.assessment_revenue_forecast_cents == 1164500"
            - "AnnualWorkPlan.${wp_id}.funding_ratio == 1.1645"
            - "AnnualWorkPlan.${wp_id}.approver_user_id == board-member-02 and approved_at == 2026-08-01T00:00:00Z"
            - "AnnualWorkPlan.${wp_id}.revision_count == 0 and committed_program_cents == 0"

      - name: remittance_waterfall_fills_interest_then_penalty_then_principal_in_that_order
        claim_type: waterfall_allocation
        grounds:
          - calculations.remittance_waterfall
          - calculations.delinquency_charges
          - calculations.payment_status_derivation
          - errors[ERR_REMITTANCE_EXCEEDS_TOTAL_DUE]
        distinguishing_aspect: |
          A 500-cent payment against a swept statement carrying interest 412, penalty 82450 and
          principal 824500 must land 412 on interest and 88 on penalty and nothing on principal, which
          only the pinned bucket order produces; principal-first would have left interest_paid at 0.
          The statement stays DELINQUENT after the partial payment because the DELINQUENT branch of the
          ladder is tested before PARTIALLY_PAID, and the exact remainder 906862 then retires it.
        test_recipe:
          setup:
            - "canonical district, st1 filed at 824500, the other three statements NOT_FILED so the sweep skips them"
            - "period closed at clock 2026-11-16, swept at clock 2026-11-26, one day past the 2026-11-25 grace deadline"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - *c_activate
            - *c_period_q1
            - *c_generate_q1
            - *c_find_st1
            - *c_file_st1
            - *c_clock_period_end
            - *c_close_q1
            - &c_clock_after_grace
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-26T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - &c_sweep_q1
              call: "POST /assessment-periods/${ap_id}/delinquency-sweep"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
          trigger:
            - call: "POST /assessment-statements/${st1_id}/remittances"
              payload: { amount_cents: 500, received_on: "2026-11-26T00:00:00Z", method: "ACH" }
              as: LodgingOperator
              as_user_id: "${b1_id}"
            - call: "POST /assessment-statements/${st1_id}/remittances"
              payload: { amount_cents: 906862, received_on: "2026-11-26T00:00:00Z", method: "ACH" }
              as: LodgingOperator
              as_user_id: "${b1_id}"
            - call: "POST /assessment-statements/${st1_id}/remittances"
              payload: { amount_cents: 500001, received_on: "2026-11-26T00:00:00Z", method: "ACH" }
              as: LodgingOperator
              as_user_id: "${b1_id}"
          assert:
            - "after the sweep AssessmentStatement.${st1_id}.penalty_cents == 82450 and interest_cents == 412 and total_due_cents == 907362 and delinquency_stage == NOTICE"
            - "after the 500-cent payment interest_paid_cents == 412 and penalty_paid_cents == 88 and principal_paid_cents == 0"
            - "after the 500-cent payment total_due_cents == 906862 and payment_status == DELINQUENT, not PARTIALLY_PAID"
            - "after the 906862 payment interest_paid_cents == 412 and penalty_paid_cents == 82450 and principal_paid_cents == 824500 and credit_balance_cents == 0"
            - "after the 906862 payment total_due_cents == 0 and payment_status == PAID_IN_FULL"
            - "the 500001 payment returns 409 with data.error_id == ERR_REMITTANCE_EXCEEDS_TOTAL_DUE, since it exceeds total_due_cents 0 by more than the 500000 tolerance"
            - "District.${d_id}.collected_to_date_cents == 907362, which equals interest_paid + penalty_paid + principal_paid + credit across the district's statements"
            - "District.${d_id}.delinquent_charges_cents == 82862"

      - name: overpayment_exactly_at_the_tolerance_overflows_into_credit_and_flags_refund_due
        claim_type: correct_result
        grounds:
          - calculations.remittance_waterfall.applied_to_credit
          - calculations.payment_status_derivation.ladder
          - errors[ERR_REMITTANCE_EXCEEDS_TOTAL_DUE]
        distinguishing_aspect: |
          The overpayment tolerance boundary is walked on a statement carrying no penalty or interest:
          against total_due_cents 240000 a payment of exactly 740000 is accepted — 240000 due plus the
          500000 tolerance — and the 500000 overflow is preserved in credit_balance_cents rather than
          discarded, so the ladder returns REFUND_DUE ahead of PAID_IN_FULL even though total_due_cents
          is 0.
        test_recipe:
          setup:
            - "canonical district, st2 filed at 340000, period still OPEN, no sweep"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - *c_activate
            - *c_period_q1
            - *c_generate_q1
            - *c_find_st2
            - *c_file_st2
          trigger:
            - call: "POST /assessment-statements/${st2_id}/remittances"
              payload: { amount_cents: 100000, received_on: "2026-08-01T00:00:00Z", method: "ACH" }
              as: LodgingOperator
              as_user_id: "${b2_id}"
            - call: "POST /assessment-statements/${st2_id}/remittances"
              payload: { amount_cents: 740000, received_on: "2026-08-01T00:00:00Z", method: "WIRE" }
              as: LodgingOperator
              as_user_id: "${b2_id}"
          assert:
            - "after the first payment principal_paid_cents == 100000 and total_due_cents == 240000 and payment_status == PARTIALLY_PAID"
            - "the 740000 payment is accepted with status 201, because it exceeds total_due_cents 240000 by exactly the 500000 tolerance"
            - "AssessmentStatement.${st2_id}.principal_paid_cents == 340000 and credit_balance_cents == 500000"
            - "AssessmentStatement.${st2_id}.interest_paid_cents == 0 and penalty_paid_cents == 0"
            - "AssessmentStatement.${st2_id}.total_due_cents == 0 and payment_status == REFUND_DUE"
            - "District.${d_id}.collected_to_date_cents == 840000 == 340000 principal + 500000 credit"

      - name: sweep_at_exactly_the_grace_deadline_is_refused_and_one_day_later_charges_one_day
        claim_type: threshold
        grounds:
          - state_machines.AssessmentPeriod.CLOSED_to_DELINQUENCY_SWEPT
          - calculations.delinquency_charges.is_delinquent
          - calculations.delinquency_charges.days_late
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          The grace test is a strict inequality, so a clock landing exactly on the 2026-11-25 deadline
          does not sweep nothing — the transition itself is unavailable and the call is refused 409 with
          the period still CLOSED. One day later the same call succeeds with days_late exactly 1, which
          pins interest at 824500 x 0.0005 x 1 = 412.25 -> 412 rather than the 0 an inclusive
          comparison would have produced.
        test_recipe:
          setup:
            - "canonical district, st1 filed at 824500, period CLOSED at clock 2026-11-16"
            - "due_date 2026-11-15 with grace_days 10, so grace_deadline is 2026-11-25T00:00:00Z"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
