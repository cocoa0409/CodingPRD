            - "No ValueReport exists yet."
            - "Logical clock advanced to 2026-09-16T00:00:00Z - one day past the 2026-09-15 grace date of the August period 2026-08-01..2026-08-31."
          setup_api_calls:
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Ridgeline Yard Stock", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
