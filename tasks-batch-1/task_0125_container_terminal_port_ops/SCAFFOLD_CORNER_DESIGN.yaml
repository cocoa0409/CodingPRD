  # =========================================================================
  # Cross-Cutting Complexity Layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: berth_berth_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[berth-window-berth-stale]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Berthing with expected_berth_window_version one less than the window's current version -> ERR_STALE_VERSION (412); correct version succeeds and bumps version."
        test_recipe:
          setup: ["A SCHEDULED berth window (version 1)."]
          setup_api_calls:
            - call: "POST /berths"
              payload: { code: "B-800", length_m: 300, draft_m: 14.0 }
              as: TerminalAdmin
              captures: { berth_id: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "2000500", name: "Occ V", loa_m: 280, draft_m: 13.0 }
              as: TerminalAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /berth-windows"
              payload: { berth_id: "${berth_id}", vessel_id: "${vessel_id}", eta: "2026-02-01T00:00:00.000Z", etd: "2026-02-10T00:00:00.000Z" }
              as: BerthPlanner
              captures: { bw_id: $.data.id, bw_v: $.data.version }
          trigger:
            - call: "POST /berth-windows/${bw_id}/berth"
              payload: { expected_berth_window_version: "${bw_v} - 1" }
              as: BerthPlanner
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412"
            - "error_id == ERR_STALE_VERSION"
            - "BerthWindow.${bw_id}.status == SCHEDULED"

      - name: customs_clear_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[customs-release-stale-container-clear]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Direct-clearing a PENDING container with expected_container_version one less than its current version -> ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A grounded container still PENDING; its version has advanced beyond the initially-captured value by the ground side effects."]
          setup_api_calls:
            - call: "POST /berths"
              payload: { code: "B-810", length_m: 300, draft_m: 14.0 }
              as: TerminalAdmin
              captures: { berth_id: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "2000510", name: "Stl V", loa_m: 280, draft_m: 13.0 }
              as: TerminalAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /berth-windows"
              payload: { berth_id: "${berth_id}", vessel_id: "${vessel_id}", eta: "2026-02-01T00:00:00.000Z", etd: "2026-02-10T00:00:00.000Z" }
              as: BerthPlanner
              captures: { bw_id: $.data.id, bw_v: $.data.version }
            - call: "POST /berth-windows/${bw_id}/berth"
              payload: { expected_berth_window_version: "${bw_v}" }
              as: BerthPlanner
            - call: "POST /containers"
              payload: { container_number: "STLE810810", vessel_id: "${vessel_id}", berth_window_id: "${bw_id}" }
              as: YardPlanner
              captures: { cont_id: $.data.id, cont_v0: $.data.version }
            - call: "POST /yard-slots"
              payload: { block: "V", bay: 1, row: 1, tier: 1 }
              as: YardPlanner
              captures: { slot_id: $.data.id }
            - call: "POST /containers/${cont_id}/ground"
              payload: { yard_slot_id: "${slot_id}", condition: "SOUND" }
              as: YardPlanner
          trigger:
            - call: "POST /containers/${cont_id}/customs-clear"
              payload: { expected_container_version: "${cont_v0}" }
              as: CustomsOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412"
            - "error_id == ERR_STALE_VERSION"
            - "Container.${cont_id}.customs_status == PENDING"

      - name: gate_out_cascade_frees_slot_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - "state_machines.Container.GROUNDED_to_GATED_OUT"
          - "entities.YardSlot.fields.status"
        excluded_because:
          difficulty_instance: transitive_cascade / fulfill_gateout_invoice_slot_free_cascade
          rationale: "The end-to-end gate-out cascade (slot freed, invoice minted) is the asserted outcome of the named §1.8 instance."

      - name: berth_free_time_recompute_threshold_reset
        claim_type: rate_threshold_triggers
        grounds:
          - "state_machines.BerthWindow.SCHEDULED_to_BERTHED"
          - "entities.Container.fields.free_time_expires_at"
        excluded_because:
          difficulty_instance: compensating_invariant / unberth_compensates_free_time_clock_to_null
          rationale: "The free-time clock set/reset around the demurrage threshold is exercised by the named §1.8 compensating-invariant instance."

  # =========================================================================
  # Consistency Model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: ground_side_effects_visible_in_same_response
        claim_type: immediate
        grounds:
          - "state_machines.Container.ON_VESSEL_to_GROUNDED"
          - "entities.Container.fields.yard_slot_id"
        distinguishing_aspect: "The grounding response immediately reflects handling_status=GROUNDED and yard_slot_id set (immediate consistency, no read-after-write lag)."
        test_recipe:
          setup: ["A berthed window with one container and an empty slot."]
          setup_api_calls:
            - call: "POST /berths"
              payload: { code: "B-900", length_m: 300, draft_m: 14.0 }
              as: TerminalAdmin
              captures: { berth_id: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "2000600", name: "Imm V", loa_m: 280, draft_m: 13.0 }
              as: TerminalAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /berth-windows"
              payload: { berth_id: "${berth_id}", vessel_id: "${vessel_id}", eta: "2026-02-01T00:00:00.000Z", etd: "2026-02-10T00:00:00.000Z" }
              as: BerthPlanner
              captures: { bw_id: $.data.id, bw_v: $.data.version }
            - call: "POST /berth-windows/${bw_id}/berth"
              payload: { expected_berth_window_version: "${bw_v}" }
              as: BerthPlanner
            - call: "POST /containers"
              payload: { container_number: "IMMC900900", vessel_id: "${vessel_id}", berth_window_id: "${bw_id}" }
              as: YardPlanner
              captures: { cont_id: $.data.id }
            - call: "POST /yard-slots"
              payload: { block: "W", bay: 1, row: 1, tier: 1 }
              as: YardPlanner
              captures: { slot_id: $.data.id }
          trigger:
            - call: "POST /containers/${cont_id}/ground"
              payload: { yard_slot_id: "${slot_id}", condition: "SOUND" }
              as: YardPlanner
          assert:
            - "Container.handling_status == GROUNDED"
            - "Container.yard_slot_id == ${slot_id}"
