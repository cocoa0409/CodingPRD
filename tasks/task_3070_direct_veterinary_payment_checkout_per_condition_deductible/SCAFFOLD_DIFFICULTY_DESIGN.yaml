            - &d7_read
              call: "GET /vetpay/claims/${tw_c}"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { tw_cv: $.data.version }
          trigger:
            - call: "POST /vetpay/claims/${tw_c}/adjudicate"
              payload: { expected_claim_version: "${tw_cv}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { tw_err: $.data.error_id }
          assert:
            - "trigger returns http 409 with error_id == ERR_CLAIM_NOT_ADJUDICATABLE"
            - "error_id is NOT ERR_WAITING_PERIOD_ACTIVE even though the illness window (ends 2026-09-15) is still open"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: waiting_period_inclusive_boundary
        grounds:
          - validations[priority=6]
          - calculations.preexisting_determination
          - entities.Policy.fields.injury_waiting_end
        distinguishing_aspect: |
          Numeric-threshold boundary on inclusive >=: an INJURY claim
          adjudicated at exactly injury_waiting_end (coverage_start + 5 days
          == 2026-09-06T00:00:00Z) PASSES, while the identical claim
          adjudicated one second earlier fails ERR_WAITING_PERIOD_ACTIVE —
          >=, not >.
        test_recipe:
          setup:
            - "F1 EFFECTIVE; H ACTIVE; P (coverage_start 2026-09-01, deductible 20000, rate 0.9); claim C INJURY, one TREATMENT line 50000 DXA."
            - "Clock parked at 2026-09-05T23:59:59Z for the negative probe, then advanced to exactly 2026-09-06T00:00:00Z."
          setup_api_calls:
            - *d6_clock0
            - *d6_f1
            - *d6_f1_file
            - *d6_hosp
            - *d6_approve
            - *d6_train
            - *d6_pol
            - &d8_clock_pre
              call: "POST /vetpay/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T23:59:59Z" }
              as: PlatformAdmin
            - &d8_claim
              call: "POST /vetpay/claims"
              payload: { policy_id: "${pf_p}", hospital_id: "${pf_h}", visit_date: "2026-09-05", claim_type: "INJURY", lines: [{ description: "er", amount_cents: 50000, category: "TREATMENT", condition_code: "DXA" }] }
              as: HospitalStaff
              as_user_id: "${pf_h}"
              captures: { wb_c: $.data.id, wb_cv: $.data.version }
          trigger:
            - &d8_early
              call: "POST /vetpay/claims/${wb_c}/adjudicate"
              payload: { expected_claim_version: "${wb_cv}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { wb_err: $.data.error_id }
            - &d8_clock_on
              call: "POST /vetpay/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
            - &d8_ontime
              call: "POST /vetpay/claims/${wb_c}/adjudicate"
              payload: { expected_claim_version: "${wb_cv}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
          assert:
            - "first adjudicate returns http 409 ERR_WAITING_PERIOD_ACTIVE (one second before the boundary)"
            - "the failed attempt does not change Claim.${wb_c}.version (still ${wb_cv}) so the same OCC token succeeds"
            - "second adjudicate at exactly the boundary succeeds: Claim.${wb_c}.status == ADJUDICATED"
            - "Claim.${wb_c}.reimbursement_cents == 27000"

      - name: deductible_exact_zero_remaining_boundary
        grounds:
          - calculations.per_condition_deductible_and_reimbursement
          - entities.PolicyCondition.fields.deductible_accumulated_cents
        distinguishing_aspect: |
          Zero-remainder boundary on a different metric and endpoint: a
          TREATMENT line whose amount exactly equals the remaining deductible
          (10000 == 20000 - 10000) yields base 0 and reimbursement exactly 0
          (not an error, not negative); the checkout-pay of that claim mints a
          0-cent SETTLED Payment, exercising the zero-amount edge of the
          payment endpoint.
        test_recipe:
          setup:
            - "F1 EFFECTIVE; H ACTIVE; P (deductible 20000) past waiting."
            - "Claim CA: line 10000 DXA adjudicated -> DXA.accumulated 10000, reimbursement 0... pinned: CA reimbursement round_half_up(0 x 0.9) = 0; pay CA key KA (0-cent payment allowed)."
            - "Claim CB: line 10000 DXA -> remaining deductible exactly 10000."
          setup_api_calls:
            - *d6_clock0
            - *d6_f1
            - *d6_f1_file
            - *d6_hosp
            - *d6_approve
            - *d6_train
            - *d6_pol
            - *d6_clock1
            - &d9_ca
              call: "POST /vetpay/claims"
              payload: { policy_id: "${pf_p}", hospital_id: "${pf_h}", visit_date: "2026-10-02", claim_type: "INJURY", lines: [{ description: "exam-adjacent tx", amount_cents: 10000, category: "TREATMENT", condition_code: "DXA" }] }
              as: HospitalStaff
              as_user_id: "${pf_h}"
              captures: { zb_ca: $.data.id, zb_cav: $.data.version }
            - &d9_ca_adj
              call: "POST /vetpay/claims/${zb_ca}/adjudicate"
              payload: { expected_claim_version: "${zb_cav}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - &d9_ca_pay
              call: "POST /vetpay/claims/${zb_ca}/checkout-pay"
              payload: { idempotency_key: "KA" }
              as: HospitalStaff
              as_user_id: "${pf_h}"
            - &d9_cb
              call: "POST /vetpay/claims"
              payload: { policy_id: "${pf_p}", hospital_id: "${pf_h}", visit_date: "2026-10-03", claim_type: "INJURY", lines: [{ description: "suture", amount_cents: 10000, category: "TREATMENT", condition_code: "DXA" }] }
              as: HospitalStaff
              as_user_id: "${pf_h}"
              captures: { zb_cb: $.data.id, zb_cbv: $.data.version }
          trigger:
            - &d9_cb_adj
              call: "POST /vetpay/claims/${zb_cb}/adjudicate"
              payload: { expected_claim_version: "${zb_cbv}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - &d9_cb_pay
              call: "POST /vetpay/claims/${zb_cb}/checkout-pay"
              payload: { idempotency_key: "KB" }
              as: HospitalStaff
              as_user_id: "${pf_h}"
              captures: { zb_pay: $.data.amount_cents, zb_payst: $.data.status }
          assert:
            - "Claim.${zb_cb}.deductible_applied_cents == 10000 (line exactly exhausts the remaining deductible)"
            - "Claim.${zb_cb}.reimbursement_cents == 0 (base 0, not negative, not an error)"
            - "PolicyCondition DXA.deductible_accumulated_cents == 20000 (saturated exactly at target)"
            - "checkout-pay succeeds and the new Payment has amount_cents == 0, status == SETTLED, ledger_status == POSTED"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: adjudication_gated_by_hospital_status
        grounds:
          - state_machines.Claim.transitions
          - validations[priority=10]
          - errors[ERR_HOSPITAL_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair Claim -> Hospital: claim submission at an ACTIVE
          hospital succeeds, and the identical submission after the hospital
          flips to SUSPENDED is rejected with ERR_HOSPITAL_NOT_ACTIVE — the
          claim's own fields are well-formed in both calls, isolating the
          cross-entity state gate.
        test_recipe:
          setup:
            - "F1 EFFECTIVE; H ACTIVE; P past waiting."
          setup_api_calls:
            - *d6_clock0
            - *d6_f1
            - *d6_f1_file
            - *d6_hosp
            - *d6_approve
            - *d6_train
            - *d6_pol
            - *d6_clock1
            - &d10_c1
              call: "POST /vetpay/claims"
              payload: { policy_id: "${pf_p}", hospital_id: "${pf_h}", visit_date: "2026-10-02", claim_type: "INJURY", lines: [{ description: "er", amount_cents: 50000, category: "TREATMENT", condition_code: "DXA" }] }
              as: HospitalStaff
              as_user_id: "${pf_h}"
              captures: { hg_c: $.data.id }
            - &d10_suspend
              call: "POST /vetpay/hospitals/${pf_h}/suspend"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /vetpay/claims"
              payload: { policy_id: "${pf_p}", hospital_id: "${pf_h}", visit_date: "2026-10-05", claim_type: "INJURY", lines: [{ description: "er2", amount_cents: 60000, category: "TREATMENT", condition_code: "DXE" }] }
              as: HospitalStaff
              as_user_id: "${pf_h}"
              captures: { hg_err: $.data.error_id }
          assert:
            - "the pre-suspension claim ${hg_c} was created successfully (201) while H was ACTIVE"
            - "trigger returns http 409 with error_id == ERR_HOSPITAL_NOT_ACTIVE (Claim -> Hospital gate)"
            - "Claim.${hg_c}.status == DENIED with denial_reason == HOSPITAL_SUSPENDED (suspend cascade), proving the rejection came from hospital state, not claim state"

      - name: claim_submission_gated_by_policy_lifecycle
        grounds:
          - validations[priority=10]
          - errors[ERR_POLICY_NOT_ACTIVE]
          - state_machines.Policy
        distinguishing_aspect: |
          Different entity pair — Claim -> Policy: claim submission depends on
          the policy's lifecycle dimension; a CANCELLED policy rejects
          submission with ERR_POLICY_NOT_ACTIVE even though the hospital is
          ACTIVE and the enrollment waiting windows have fully elapsed.
        test_recipe:
          setup:
            - "F1 EFFECTIVE; H ACTIVE; P past waiting and then CANCELLED by owner."
          setup_api_calls:
            - *d6_clock0
            - *d6_f1
            - *d6_f1_file
            - *d6_hosp
            - *d6_approve
            - *d6_train
            - *d6_pol
            - *d6_clock1
            - &d11_cancel
              call: "POST /vetpay/policies/${pf_p}/cancel"
              payload: {}
              as: PetOwner
              as_user_id: "${pf_p}"
          trigger:
            - call: "POST /vetpay/claims"
              payload: { policy_id: "${pf_p}", hospital_id: "${pf_h}", visit_date: "2026-10-05", claim_type: "INJURY", lines: [{ description: "er", amount_cents: 40000, category: "TREATMENT", condition_code: "DXE" }] }
              as: HospitalStaff
              as_user_id: "${pf_h}"
              captures: { pl_err: $.data.error_id }
          assert:
            - "trigger returns http 409 with error_id == ERR_POLICY_NOT_ACTIVE"
            - "no Claim row is created for the rejected submission (GET /vetpay/claims?policy_id=${pf_p} returns 0 rows)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: effective_filing_supersession_intervals
        grounds:
          - state_machines.TerritoryRateFiling.FILED_to_EFFECTIVE
          - entities.TerritoryRateFiling.fields.filing_effective_date
        distinguishing_aspect: |
          Half-open effectiveness intervals on the (territory, species)
          resource: when F2 (effective 2026-10-01) becomes EFFECTIVE it
          supersedes F1 (effective 2026-09-01), so exactly one EFFECTIVE
          filing occupies any instant — a policy created before 10-01 binds
          F1 and one created on/after 10-01 binds F2, with 2026-10-01T00:00:00Z
          itself belonging to F2's half-open window.
        test_recipe:
          setup:
            - "F1 (base 100000, effective 2026-09-01) EFFECTIVE. F2 (base 110000, effective 2026-10-01) FILED."
            - "Clock at 2026-10-01T00:00:00Z (sweep makes F2 EFFECTIVE, F1 SUPERSEDED)."
          setup_api_calls:
            - *d6_clock0
            - *d6_f1
            - *d6_f1_file
            - &d12_pol_early
              call: "POST /vetpay/policies"
              payload: { owner_name: "Eli Ford", pet_name: "Bao", species: "DOG", breed: "Corgi", pet_date_of_birth: "2025-01-01", territory_code: "941", coverage_start: "2026-09-01", per_condition_deductible_cents: 20000, reimbursement_rate: 0.9 }
              as: PetOwner
              captures: { pe_id: $.data.id }
            - &d12_f2
              call: "POST /vetpay/rate-filings"
              payload: { territory_code: "941", state_code: "CA", species: "DOG", base_monthly_premium_cents: 110000, age_band_multipliers: { "0": 1.0, "1": 1.0025 }, filing_effective_date: "2026-10-01", regulator_reference: "CA-2026-010" }
              as: RateFilingAdmin
              captures: { of_f2: $.data.id }
            - &d12_f2_file
              call: "POST /vetpay/rate-filings/${of_f2}/file"
              payload: {}
              as: RateFilingAdmin
            - &d12_clock
              call: "POST /vetpay/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &d12_pol_late
              call: "POST /vetpay/policies"
              payload: { owner_name: "Faye Gao", pet_name: "Mochi", species: "DOG", breed: "Husky", pet_date_of_birth: "2025-01-01", territory_code: "941", coverage_start: "2026-10-01", per_condition_deductible_cents: 20000, reimbursement_rate: 0.9 }
              as: PetOwner
              captures: { pl2_id: $.data.id }
            - &d12_f1_read
              call: "GET /vetpay/rate-filings/${pf_f1}"
              payload: {}
              as: RateFilingAdmin
              captures: { f1_status: $.data.status }
          assert:
            - "Policy.${pe_id}.applied_filing_id == ${pf_f1} (created inside F1's half-open window)"
            - "Policy.${pl2_id}.applied_filing_id == ${of_f2} (boundary instant 2026-10-01T00:00:00Z belongs to F2)"
            - "TerritoryRateFiling.${pf_f1}.status == SUPERSEDED after F2 became EFFECTIVE (no overlapping EFFECTIVE pair)"
            - "Policy.${pl2_id}.filed_base_cents == 110000"

      - name: appeal_records_window_expiry
        grounds:
          - state_machines.ClaimAppeal.RECORDS_REQUESTED_to_UNDER_REVIEW
          - entities.ClaimAppeal.fields.records_due_at
          - errors[ERR_APPEAL_WINDOW_EXPIRED]
        distinguishing_aspect: |
          Closed-deadline interval semantics on the appeal resource (different
          from the filings' half-open occupation): submission at exactly
          records_due_at is accepted (<=), one second past it is rejected with
          ERR_APPEAL_WINDOW_EXPIRED — the window is a deadline, not an
          occupancy interval, and it gates a different entity (ClaimAppeal vs
          TerritoryRateFiling).
        test_recipe:
          setup:
            - "Chain to DENIED claim C (adjuster adj-1), appeal A OPEN, records requested at 2026-10-02T00:00:00Z -> records_due_at = 2026-10-16T00:00:00Z."
            - "Medical record MR uploaded and ready to attach."
          setup_api_calls:
            - *d6_clock0
            - *d6_f1
            - *d6_f1_file
            - *d6_hosp
            - *d6_approve
            - *d6_train
            - *d6_pol
            - *d6_clock1
            - &d13_claim
              call: "POST /vetpay/claims"
              payload: { policy_id: "${pf_p}", hospital_id: "${pf_h}", visit_date: "2026-10-02", claim_type: "INJURY", lines: [{ description: "er", amount_cents: 50000, category: "TREATMENT", condition_code: "DXA" }] }
              as: HospitalStaff
              as_user_id: "${pf_h}"
              captures: { aw_c: $.data.id }
            - &d13_deny
              call: "POST /vetpay/claims/${aw_c}/deny"
              payload: { denial_reason: "lack of evidence" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - &d13_appeal
              call: "POST /vetpay/claims/${aw_c}/appeals"
              payload: { reason_code: "COVERAGE_DENIAL" }
              as: PetOwner
              as_user_id: "${pf_p}"
              captures: { aw_a: $.data.id }
            - &d13_clock_req
              call: "POST /vetpay/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - &d13_req
              call: "POST /vetpay/appeals/${aw_a}/request-records"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - &d13_mr
              call: "POST /vetpay/policies/${pf_p}/medical-records"
              payload: { hospital_id: "${pf_h}", record_type: "LAB", recorded_at: "2026-10-02T08:00:00Z", diagnosis_code: "DXA", notes: "panel" }
              as: HospitalStaff
              as_user_id: "${pf_h}"
              captures: { aw_mr: $.data.id }
          trigger:
            - &d13_clock_late
              call: "POST /vetpay/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-16T00:00:01Z" }
              as: PlatformAdmin
            - &d13_sub_late
              call: "POST /vetpay/appeals/${aw_a}/submit-records"
              payload: { medical_record_ids: ["${aw_mr}"] }
              as: HospitalStaff
              as_user_id: "${pf_h}"
              captures: { aw_err: $.data.error_id }
          assert:
            - "submit at records_due_at + 1s returns http 409 ERR_APPEAL_WINDOW_EXPIRED"
            - "ClaimAppeal.${aw_a}.status remains RECORDS_REQUESTED after the rejected submission"
            - "MedicalRecord.${aw_mr}.appeal_id is still null (no partial attachment)"
            - "the exact-deadline (<=) success side is exercised by corner instance appeal_records_submit_at_exact_deadline"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: idempotent_checkout_pay_double_send
        grounds:
          - endpoints.POST_/vetpay/claims/{claimId}/checkout-pay
          - entities.Payment.fields.idempotency_key
          - entities.Hospital.fields.running_ledger_balance_cents
        distinguishing_aspect: |
          Conserved quantity: count of POSTED payments per idempotency key.
          Forward action checkout-pay with key K77 followed by the identical
          compensating duplicate request leaves the ledger unchanged — exactly
          one Payment of 117000 exists, the duplicate returns that same
          Payment id, and running_ledger_balance_cents == 117000 not 234000.
        test_recipe:
          setup:
            - "F1 EFFECTIVE; H ACTIVE; P past waiting; claim C (line 150000 DXA) adjudicated -> reimbursement 117000."
          setup_api_calls:
            - *d6_clock0
            - *d6_f1
            - *d6_f1_file
            - *d6_hosp
            - *d6_approve
            - *d6_train
            - *d6_pol
            - *d6_clock1
            - &d14_claim
              call: "POST /vetpay/claims"
              payload: { policy_id: "${pf_p}", hospital_id: "${pf_h}", visit_date: "2026-10-02", claim_type: "INJURY", lines: [{ description: "surgery", amount_cents: 150000, category: "TREATMENT", condition_code: "DXA" }] }
              as: HospitalStaff
              as_user_id: "${pf_h}"
              captures: { ik_c: $.data.id, ik_cv: $.data.version }
            - &d14_adj
              call: "POST /vetpay/claims/${ik_c}/adjudicate"
              payload: { expected_claim_version: "${ik_cv}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
          trigger:
            - &d14_pay1
              call: "POST /vetpay/claims/${ik_c}/checkout-pay"
              payload: { idempotency_key: "K77" }
              as: HospitalStaff
              as_user_id: "${pf_h}"
              captures: { ik_p1: $.data.id }
            - &d14_pay2
              call: "POST /vetpay/claims/${ik_c}/checkout-pay"
              payload: { idempotency_key: "K77" }
              as: HospitalStaff
              as_user_id: "${pf_h}"
              captures: { ik_p2: $.data.id }
            - &d14_hread
              call: "GET /vetpay/hospitals/${pf_h}"
              payload: {}
              as: PlatformAdmin
              captures: { ik_ledger: $.data.running_ledger_balance_cents }
          assert:
            - "the duplicate call returns the SAME Payment id: ${ik_p2} == ${ik_p1}"
            - "GET /vetpay/hospitals/${pf_h}/payments returns exactly 1 payment (no second row minted)"
            - "Hospital.${pf_h}.running_ledger_balance_cents == 117000 (conserved: forward + duplicate == forward alone)"
            - "Claim.${ik_c}.payment_id == ${ik_p1}"

      - name: payment_reversal_clawback_conserves_ledger
        grounds:
          - state_machines.Claim.SETTLED_to_REOPENED
          - entities.Payment.fields.kind
          - calculations.reconciliation_expected_vs_actual
        distinguishing_aspect: |
          Different conserved quantity: Hospital.running_ledger_balance_cents
          across a pay-then-reverse round trip. Paying 117000 then overturning
          the appeal returns the ledger to exactly 0 and the reconciliation
          discrepancy to 0 — the round trip conserves the balance only if the
          CLAWBACK (-117000, POSTED) precisely mirrors the reversed DIRECT_PAY.
        test_recipe:
          setup:
            - "F1 EFFECTIVE; H ACTIVE; P past waiting; claim C (150000 DXA) adjudicated, paid with key K88 (ledger 117000), SETTLED after clock advance; appeal opened and UNDER_REVIEW."
          setup_api_calls:
            - *d6_clock0
            - *d6_f1
            - *d6_f1_file
            - *d6_hosp
            - *d6_approve
            - *d6_train
            - *d6_pol
            - *d6_clock1
            - &d15_claim
              call: "POST /vetpay/claims"
              payload: { policy_id: "${pf_p}", hospital_id: "${pf_h}", visit_date: "2026-10-02", claim_type: "INJURY", lines: [{ description: "surgery", amount_cents: 150000, category: "TREATMENT", condition_code: "DXA" }] }
              as: HospitalStaff
              as_user_id: "${pf_h}"
              captures: { rv_c: $.data.id, rv_cv: $.data.version }
            - &d15_adj
              call: "POST /vetpay/claims/${rv_c}/adjudicate"
              payload: { expected_claim_version: "${rv_cv}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - &d15_pay
              call: "POST /vetpay/claims/${rv_c}/checkout-pay"
              payload: { idempotency_key: "K88" }
              as: HospitalStaff
              as_user_id: "${pf_h}"
              captures: { rv_p: $.data.id }
            - &d15_clock2
              call: "POST /vetpay/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-04T00:00:00Z" }
              as: PlatformAdmin
            - &d15_read_settle
              call: "GET /vetpay/claims/${rv_c}"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - &d15_appeal
              call: "POST /vetpay/claims/${rv_c}/appeals"
              payload: { reason_code: "LINE_CATEGORIZATION" }
              as: PetOwner
              as_user_id: "${pf_p}"
              captures: { rv_a: $.data.id }
          trigger:
            - &d15_resolve
              call: "POST /vetpay/appeals/${rv_a}/resolve"
              payload: { outcome: "OVERTURNED", resolution_note: "categorization wrong" }
              as: ClaimsAdjuster
              as_user_id: "adj-2"
            - &d15_hread
              call: "GET /vetpay/hospitals/${pf_h}"
              payload: {}
              as: PlatformAdmin
              captures: { rv_ledger: $.data.running_ledger_balance_cents }
            - &d15_report
              call: "POST /vetpay/hospitals/${pf_h}/reconciliation-reports"
              payload: { period_start: "2026-09-01", period_end: "2026-11-01" }
              as: PlatformAdmin
              captures: { rv_rep: $.data.id }
          assert:
            - "Hospital.${pf_h}.running_ledger_balance_cents == 0 (round trip conserves the balance exactly)"
            - "Payment.${rv_p}.status == REVERSED"
            - "GET /vetpay/payments?reverses_payment_id=${rv_p} returns exactly 1 CLAWBACK of amount_cents == -117000"
            - "ReconciliationReport.${rv_rep}.discrepancy_cents == 0 (both ledger variants agree post-round-trip)"
