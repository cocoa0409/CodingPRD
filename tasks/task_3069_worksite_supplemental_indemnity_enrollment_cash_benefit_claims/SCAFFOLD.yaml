# =============================================================================
# SCAFFOLD — Worksite Supplemental Indemnity Enrollment & Cash Benefit Claims
# (Aflac-style worksite voluntary benefits)
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8);
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml (§1.9).
# =============================================================================

scenario: |
  Worksite Supplemental Indemnity Enrollment & Cash Benefit Claims (Aflac): worksite enrollment campaigns at employer groups with benefit counselors and participation minimums, policy issuance with guaranteed-issue windows and pre-existing condition provisions, indemnity claim adjudication paying a fixed benefit per covered event regardless of medical billing, documentation requirements linking a diagnosis or procedure code to a benefit schedule, wellness benefit annual payment and duplicate-claim prevention, payroll deduction administration with pre-tax and post-tax treatment differences, portability when an employee leaves the group, benefit schedule updates and policy series version control

domain_name: worksite-indemnity
api_prefix: /

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: EmployerGroup
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Employer group legal name" }
      - { name: group_code, type: string, source: input, description: "Unique group code; globally unique", constraints: "unique across all EmployerGroup rows" }
      - { name: status, type: enum, source: system, description: "PROSPECT | ACTIVE | SUSPENDED | TERMINATED", default: PROSPECT }
      - { name: participation_minimum_pct, type: number, source: input, description: "Fraction of eligible employees that must enroll (0–1 inclusive)", default: 0.10 }
      - { name: participation_minimum_count, type: integer, source: input, description: "Absolute minimum enrolled policies for a campaign to be MET", default: 3 }
      - { name: proration_convention, type: enum, source: input, description: "DAILY | HALF_MONTH — selects the deduction proration variant for this group", default: DAILY }
      - { name: eligible_employee_count, type: integer, source: computed, description: "Count of Employee rows with employer_group_id = this group and status = ACTIVE at read time" }
      - { name: enrolled_count, type: integer, source: computed, description: "Count of Policy rows whose campaign belongs to this group and whose status IN {APPLIED, ISSUED, ACTIVE, LAPSED, PORTED} — i.e., not DECLINED and not CANCELLED" }

  - name: BenefitCounselor
    parent: null
    common_fields: true
    fields:
      - { name: license_id, type: string, source: input, description: "State producer license id; globally unique", constraints: "unique across all BenefitCounselor rows" }
      - { name: full_name, type: string, source: input, description: "Counselor full name" }
      - { name: home_state, type: string, source: input, description: "Two-letter US state code" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED", default: ACTIVE }

  - name: EnrollmentCampaign
    parent: null
    common_fields: true
    fields:
      - { name: employer_group_id, type: string, source: input, description: "FK -> EmployerGroup.id; group this campaign runs at" }
      - { name: counselor_id, type: string, source: input, description: "FK -> BenefitCounselor.id; lead counselor; must have status = ACTIVE at creation" }
      - { name: window_start, type: datetime, source: input, description: "Enrollment window open instant (ISO8601 UTC); half-open interval start" }
      - { name: window_end, type: datetime, source: input, description: "Enrollment window close instant (ISO8601 UTC); half-open interval end; must be strictly after window_start" }
      - { name: guaranteed_issue, type: boolean, source: input, description: "Whether applications in this campaign are guaranteed-issue", default: false }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | LOCKED | MET | FAILED | CLOSED", default: DRAFT }
      - { name: required_enrollments, type: integer, source: computed, description: "Set at close: max(employer_group.participation_minimum_count, ceil(employer_group.participation_minimum_pct * eligible_employee_count))" }
      - { name: participation_met, type: boolean, source: computed, description: "Set at close: enrolled_count >= required_enrollments" }

  - name: PolicySeries
    parent: null
    common_fields: true
    fields:
      - { name: series_code, type: string, source: input, description: "Policy series code; globally unique", constraints: "unique across all PolicySeries rows" }
      - { name: product_line, type: enum, source: input, description: "ACCIDENT | HOSPITAL | CRITICAL_ILLNESS" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED", default: DRAFT }
      - { name: current_schedule_id, type: string, source: computed, description: "id of the BenefitSchedule under this series with status = PUBLISHED; null when none" }

  - name: BenefitSchedule
    parent: null
    common_fields: true
    fields:
      - { name: policy_series_id, type: string, source: input, description: "FK -> PolicySeries.id; owning series" }
      - { name: schedule_version, type: integer, source: input, description: "Monotonically increasing version number within the series; must be greater than every existing schedule_version for the same series" }
      - { name: effective_date, type: datetime, source: input, description: "Date the schedule takes effect; must be strictly later than the effective_date of every other schedule in the same series (same-day collision rejected)" }
      - { name: benefit_items, type: array, source: input, description: "Array of { event_code, benefit_amount_cents, max_occurrences_per_year, lifetime_max_cents }; event_code unique within the array" }
      - { name: monthly_premium_cents, type: integer, source: input, description: "Full-month premium charged per policy issued against this schedule" }
      - { name: wellness_benefit_cents, type: integer, source: input, description: "Annual wellness benefit amount" }
      - { name: wellness_waiting_months, type: integer, source: input, description: "Whole months after coverage_start_date before wellness benefit is payable" }
      - { name: preexisting_exclusion_months, type: integer, source: input, description: "Whole months after coverage_start_date during which pre-existing diagnoses are excluded" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | SUPERSEDED", default: DRAFT }

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - { name: employer_group_id, type: string, source: input, description: "FK -> EmployerGroup.id; employing group" }
      - { name: employee_ref, type: string, source: input, description: "Employer-scoped employee reference; unique within the employer group", constraints: "unique per employer_group_id" }
      - { name: full_name, type: string, source: input, description: "Employee full name" }
      - { name: hire_date, type: datetime, source: input, description: "Hire date (ISO8601 UTC)" }
      - { name: preexisting_diagnosis_codes, type: array, source: input, description: "Diagnosis codes documented before coverage; used by the pre-existing exclusion", default: [] }
      - { name: status, type: enum, source: system, description: "ACTIVE | TERMINATED", default: ACTIVE }

  - name: Policy
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: system, description: "FK -> EnrollmentCampaign.id; campaign the application was filed under" }
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; insured employee" }
      - { name: policy_series_id, type: string, source: input, description: "FK -> PolicySeries.id; product series applied for" }
      - { name: benefit_schedule_id, type: string, source: computed, description: "FK -> BenefitSchedule.id; the PUBLISHED schedule of the series pinned at issuance — never repointed afterwards (version-pinning on approval)" }
      - { name: certificate_number, type: string, source: computed, description: "Minted at issuance: <series_code>-<8-char deterministic sequence within series>" }
      - { name: premium_mode, type: enum, source: input, description: "PRE_TAX | POST_TAX payroll deduction treatment", default: POST_TAX }
      - { name: monthly_premium_cents, type: integer, source: computed, description: "Copied from the pinned BenefitSchedule.monthly_premium_cents at issuance; unchanged by later schedule publishes" }
      - { name: issue_date, type: datetime, source: computed, description: "Set at APPLIED -> ISSUED transition" }
      - { name: coverage_start_date, type: datetime, source: computed, description: "Set at issuance: the first day of the calendar month containing issue_date (00:00:00Z)" }
      - { name: lifetime_paid_cents, type: integer, source: computed, description: "Sum of payable_amount_cents over Claim rows of this policy in status PAID; VOIDED claims are excluded (compensated)", default: 0 }
      - { name: paid_occurrences_by_year, type: object, source: computed, description: "Map calendar_year -> event_code -> occurrences paid, over claims in status PAID", default: {} }
      - { name: status, type: enum, source: system, description: "APPLIED | ISSUED | ACTIVE | LAPSED | PORTED | DECLINED | CANCELLED", default: APPLIED }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; policy claimed against" }
      - { name: event_code, type: string, source: input, description: "Covered-event code; must exist in the policy's pinned schedule benefit_items" }
      - { name: service_date, type: datetime, source: input, description: "Date the covered event occurred (ISO8601 UTC)" }
      - { name: diagnosis_code, type: string, source: input, description: "Diagnosis code linking the event to the benefit schedule" }
      - { name: procedure_code, type: string, source: input, description: "Optional procedure code", default: null }
      - { name: claimed_occurrences, type: integer, source: input, description: "Number of occurrences claimed; must be >= 1" }
      - { name: provisional_payable_cents, type: integer, source: computed, description: "Occurrence-based estimate set at submission (calculation claim_payable, variant PROVISIONAL)" }
      - { name: payable_amount_cents, type: integer, source: computed, description: "Final adjudicated amount set at APPROVED (calculation claim_payable, variant FINAL); null until approved" }
      - { name: adjudicated_occurrences, type: integer, source: computed, description: "Occurrences actually credited at APPROVED; null until approved" }
      - { name: denial_reason, type: enum, source: computed, description: "Set when DENIED: PRE_EXISTING | CAP_EXHAUSTED | INSUFFICIENT_DOCUMENTS | NOT_COVERED | POLICY_INACTIVE", default: null }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | APPROVED | PAID | DENIED | APPEALED | VOIDED", default: SUBMITTED }

  - name: ClaimDocument
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; owning claim" }
      - { name: doc_type, type: enum, source: input, description: "DIAGNOSIS_PROOF | PROCEDURE_PROOF | ITEMIZED_BILL | ATTENDING_PHYSICIAN_STATEMENT" }
      - { name: content_ref, type: string, source: input, description: "Opaque reference to uploaded content" }
      - { name: status, type: enum, source: system, description: "RECEIVED | ACCEPTED | REJECTED", default: RECEIVED }

  - name: WellnessBenefit
    parent: null
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; policy claiming the annual wellness benefit" }
      - { name: calendar_year, type: integer, source: input, description: "Calendar year the wellness service was performed" }
      - { name: service_date, type: datetime, source: input, description: "Date of the wellness service (ISO8601 UTC); must fall inside calendar_year and satisfy the waiting period" }
      - { name: amount_cents, type: integer, source: computed, description: "Copied from the pinned schedule's wellness_benefit_cents at approval" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | PAID | DENIED", default: SUBMITTED }

  - name: PayrollCycle
    parent: null
    common_fields: true
    fields:
      - { name: employer_group_id, type: string, source: input, description: "FK -> EmployerGroup.id; group this deduction cycle belongs to" }
      - { name: period_start, type: datetime, source: input, description: "Cycle period start (ISO8601 UTC); half-open interval start" }
      - { name: period_end, type: datetime, source: input, description: "Cycle period end (ISO8601 UTC); half-open interval end; strictly after period_start" }
      - { name: total_posted_cents, type: integer, source: computed, description: "Sum of amount_cents over DeductionLine rows of this cycle with status = POSTED (line-level rounding, then summed)", default: 0 }
      - { name: status, type: enum, source: system, description: "OPEN | FINALIZED | RECONCILED | CLOSED", default: OPEN }

  - name: DeductionLine
    parent: null
    common_fields: true
    fields:
      - { name: payroll_cycle_id, type: string, source: input, description: "FK -> PayrollCycle.id; owning cycle" }
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; policy being billed" }
      - { name: employee_id, type: string, source: computed, description: "FK -> Employee.id; copied from the policy at posting" }
      - { name: tax_treatment, type: enum, source: computed, description: "PRE_TAX | POST_TAX — copied from policy.premium_mode at posting; PRE_TAX lines are excluded from taxable wage reporting, POST_TAX lines are not" }
      - { name: coverage_days, type: integer, source: computed, description: "Days of this cycle's period the policy was in a billable status (ISSUED or ACTIVE), counting the period as half-open" }
      - { name: amount_cents, type: integer, source: computed, description: "Prorated premium per calculation deduction_proration using the employer group's proration_convention; rounded half-up to whole cents at line level" }
      - { name: status, type: enum, source: system, description: "POSTED | REVERSED", default: POSTED }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: EmployerGroup
    initial_state: PROSPECT
    terminal_states: [TERMINATED]
    transitions:
      - from: PROSPECT
        to: ACTIVE
        trigger: "POST /employer-groups/{id}/activate"
        actor: CarrierAdmin
        preconditions:
          - "participation_minimum_pct in [0, 1] and participation_minimum_count >= 0"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /employer-groups/{id}/suspend"
        actor: CarrierAdmin
        preconditions: []
        side_effects:
          - "Any EnrollmentCampaign of this group in status OPEN is auto-transitioned to LOCKED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /employer-groups/{id}/activate"
        actor: CarrierAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /employer-groups/{id}/terminate"
        actor: CarrierAdmin
        preconditions:
          - "No EnrollmentCampaign of this group in status OPEN"
        side_effects:
          - "Every Policy of this group's employees in status ISSUED or ACTIVE is auto-transitioned to LAPSED"
          - "Every EnrollmentCampaign of this group in status DRAFT, LOCKED, MET, or FAILED is auto-transitioned to CLOSED"
          - "The forced closure of a LOCKED campaign itself auto-transitions every Policy under that campaign in status APPLIED to DECLINED (a termination-forced close is FAILED-equivalent for in-flight applications — 3-hop chain: group TERMINATED -> campaign CLOSED -> policies DECLINED)"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /employer-groups/{id}/terminate"
        actor: CarrierAdmin
        preconditions: []
        side_effects:
          - "Every Policy of this group's employees in status ISSUED or ACTIVE is auto-transitioned to LAPSED"
          - "Every EnrollmentCampaign of this group in status DRAFT, LOCKED, MET, or FAILED is auto-transitioned to CLOSED"
          - "The forced closure of a LOCKED campaign itself auto-transitions every Policy under that campaign in status APPLIED to DECLINED (3-hop chain: group TERMINATED -> campaign CLOSED -> policies DECLINED)"

  - entity: BenefitCounselor
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /benefit-counselors/{id}/suspend"
        actor: CarrierAdmin
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /benefit-counselors/{id}/activate"
        actor: CarrierAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /benefit-counselors/{id}/terminate"
        actor: CarrierAdmin
        preconditions:
          - "No campaign led by this counselor in status OPEN (ERR_INVALID_STATE)"
        side_effects: []
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /benefit-counselors/{id}/terminate"
        actor: CarrierAdmin
        preconditions:
          - "No campaign led by this counselor in status OPEN (ERR_INVALID_STATE)"
        side_effects: []

  - entity: EnrollmentCampaign
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /enrollment-campaigns/{id}/open"
        actor: BenefitCounselor
        preconditions:
          - "counselor status = ACTIVE (ERR_COUNSELOR_INACTIVE)"
          - "employer_group status = ACTIVE (ERR_GROUP_INACTIVE)"
          - "current clock time < window_end (ERR_WINDOW_EXPIRED)"
          - "No other EnrollmentCampaign of the same employer_group with status = OPEN has a window that overlaps [window_start, window_end) — windows are half-open: an existing window ending exactly at window_start does NOT overlap (ERR_CAMPAIGN_WINDOW_OVERLAP)"
          - "The counselor must not already lead another campaign with status = OPEN whose window intersects [window_start, window_end] under CLOSED-interval semantics — a window whose window_start equals this campaign's window_end (or vice versa) DOES conflict for the counselor (ERR_COUNSELOR_DOUBLE_BOOKED), deliberately stricter than the group-level half-open rule"
        side_effects: []
      - from: OPEN
        to: LOCKED
        trigger: "POST /enrollment-campaigns/{id}/lock"
        actor: BenefitCounselor
        preconditions:
          - "current clock time >= window_end (ERR_WINDOW_NOT_CLOSED)"
        side_effects: []
      - from: LOCKED
        to: MET
        trigger: "POST /enrollment-campaigns/{id}/close"
        actor: BenefitCounselor
        preconditions:
          - "The close endpoint branches deterministically on participation: if employer_group.enrolled_count >= required_enrollments the campaign transitions to MET (this transition); otherwise it transitions to FAILED (the sibling transition) — the caller does not choose the branch"
        side_effects:
          - "participation_met = true; required_enrollments frozen on the campaign"
          - "Every Policy under this campaign in status APPLIED is auto-transitioned to ISSUED (bulk issuance): benefit_schedule_id pinned to the series' PUBLISHED schedule at this instant, monthly_premium_cents copied, issue_date set to now, coverage_start_date set to first of month"
          - "Any Policy under this campaign whose series has NO PUBLISHED schedule is instead auto-transitioned to DECLINED (ERR_SERIES_WITHOUT_SCHEDULE surfaced on the campaign response)"
      - from: LOCKED
        to: FAILED
        trigger: "POST /enrollment-campaigns/{id}/close"
        actor: BenefitCounselor
        preconditions:
          - "employer_group.enrolled_count < required_enrollments (the complement of the MET branch; the close endpoint picks exactly one of MET / FAILED)"
        side_effects:
          - "participation_met = false; required_enrollments frozen on the campaign"
          - "Every Policy under this campaign in status APPLIED is auto-transitioned to DECLINED"
      - from: MET
        to: CLOSED
        trigger: "POST /enrollment-campaigns/{id}/close"
        actor: BenefitCounselor
        preconditions: []
        side_effects: []
      - from: FAILED
        to: CLOSED
        trigger: "POST /enrollment-campaigns/{id}/close"
        actor: BenefitCounselor
        preconditions: []
        side_effects: []
      - from: FAILED
        to: OPEN
        trigger: "POST /enrollment-campaigns/{id}/reopen"
        actor: BenefitCounselor
        preconditions:
          - "employer_group status = ACTIVE (ERR_GROUP_INACTIVE)"
          - "window_end is extended by the request body field new_window_end which must be strictly after the current clock time and strictly after the old window_end (ERR_WINDOW_EXPIRED)"
          - "The extended window must not overlap any other OPEN campaign window of the same group (ERR_CAMPAIGN_WINDOW_OVERLAP)"
        side_effects:
          - "window_end := new_window_end; participation_met := null; required_enrollments := null"
          - "Every Policy under this campaign in status DECLINED is auto-transitioned back to APPLIED (reopen reversal — cyclic loop FAILED -> OPEN -> ... -> MET/FAILED)"

  - entity: PolicySeries
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /policy-series/{id}/activate"
        actor: CarrierAdmin
        preconditions:
          - "At least one BenefitSchedule of this series has status = PUBLISHED (ERR_SERIES_WITHOUT_SCHEDULE)"
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /policy-series/{id}/retire"
        actor: CarrierAdmin
        preconditions: []
        side_effects:
          - "New applications against this series are rejected thereafter (ERR_SERIES_RETIRED); existing policies keep their pinned schedule"

  - entity: BenefitSchedule
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /benefit-schedules/{id}/publish"
        actor: CarrierAdmin
        preconditions:
          - "policy_series status IN {DRAFT, ACTIVE} (ERR_SERIES_RETIRED)"
          - "benefit_items non-empty; each event_code unique within the array; each benefit_amount_cents >= 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "Any other BenefitSchedule of the same series in status PUBLISHED is auto-transitioned to SUPERSEDED"
          - "policy_series.current_schedule_id := this schedule's id; policy_series.version increments by 1"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (side effect of publishing a newer schedule in the same series)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Employee
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /employees/{id}/terminate"
        actor: GroupAdmin
        preconditions: []
        side_effects:
          - "Every Policy of this employee in status ISSUED or ACTIVE remains in its status (policies do not auto-lapse; they await explicit port or lapse)"
      - from: TERMINATED
        to: ACTIVE
        trigger: "POST /employees/{id}/reinstate"
        actor: GroupAdmin
        preconditions:
          - "employer_group status IN {ACTIVE, SUSPENDED} (ERR_GROUP_TERMINATED)"
        side_effects: []

  - entity: Policy
    initial_state: APPLIED
    terminal_states: [DECLINED, CANCELLED]
    transitions:
      - from: APPLIED
        to: ISSUED
        trigger: "system (campaign LOCKED -> MET bulk issuance) or POST /policies/{id}/issue for direct-bill issuance outside a campaign"
        actor: system | BenefitCounselor
        preconditions:
          - "series status = ACTIVE at issuance time (ERR_SERIES_RETIRED)"
          - "series has a PUBLISHED schedule (ERR_SERIES_WITHOUT_SCHEDULE)"
          - "If campaign.guaranteed_issue = false: employee.preexisting_diagnosis_codes must be empty, otherwise the policy is DECLINED instead of ISSUED (pre-existing condition provision on non-guaranteed-issue business)"
          - "No other Policy for the same employee_id and policy_series_id in status IN {APPLIED, ISSUED, ACTIVE, LAPSED, PORTED} (ERR_DUPLICATE_COVERAGE)"
        side_effects:
          - "benefit_schedule_id := series.current_schedule_id (pinned); monthly_premium_cents := schedule.monthly_premium_cents; issue_date := now; coverage_start_date := first day of issue_date's calendar month"
      - from: ISSUED
        to: ACTIVE
        trigger: "POST /policies/{id}/activate"
        actor: BenefitCounselor
        preconditions:
          - "employee status = ACTIVE (ERR_EMPLOYEE_INACTIVE)"
        side_effects: []
      - from: ISSUED
        to: LAPSED
        trigger: "POST /policies/{id}/lapse"
        actor: BenefitCounselor
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /policies/{id}/lapse"
        actor: BenefitCounselor
        preconditions: []
        side_effects: []
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /policies/{id}/reinstate"
        actor: BenefitCounselor
        preconditions:
          - "policy lapsed within the last 60 days measured against the current clock (ERR_REINSTATEMENT_WINDOW_EXPIRED)"
          - "employee status = ACTIVE (ERR_EMPLOYEE_INACTIVE)"
          - "employer_group status = ACTIVE (ERR_GROUP_INACTIVE)"
        side_effects:
          - "coverage_start_date unchanged (continuous coverage for pre-existing exclusion purposes)"
      - from: ISSUED
        to: PORTED
        trigger: "POST /policies/{id}/port"
        actor: PolicyholderServices
        preconditions:
          - "employee status = TERMINATED (ERR_PORT_NOT_ELIGIBLE)"
          - "request body includes new_premium_mode IN {PRE_TAX, POST_TAX}; ported policies are direct-billed, so premium_mode := POST_TAX regardless of the requested value, and premium_mode on the response is POST_TAX"
        side_effects:
          - "premium_mode := POST_TAX; policy no longer appears in the employer group's enrolled_count; future PayrollCycles of the group must not bill this policy (coverage_days = 0)"
      - from: ACTIVE
        to: PORTED
        trigger: "POST /policies/{id}/port"
        actor: PolicyholderServices
        preconditions:
          - "employee status = TERMINATED (ERR_PORT_NOT_ELIGIBLE)"
        side_effects:
          - "premium_mode := POST_TAX; excluded from enrolled_count and payroll billing"
      - from: APPLIED
        to: DECLINED
        trigger: "system (campaign FAILED close, non-guaranteed-issue pre-existing screen, or missing published schedule)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LAPSED
        to: CANCELLED
        trigger: "POST /policies/{id}/cancel"
        actor: PolicyholderServices
        preconditions:
          - "No Claim of this policy in status SUBMITTED, UNDER_REVIEW, APPEALED, or APPROVED (ERR_CLAIMS_IN_FLIGHT)"
        side_effects: []
      - from: PORTED
        to: CANCELLED
        trigger: "POST /policies/{id}/cancel"
        actor: PolicyholderServices
        preconditions:
          - "No Claim of this policy in status SUBMITTED, UNDER_REVIEW, APPEALED, or APPROVED (ERR_CLAIMS_IN_FLIGHT)"
        side_effects: []

  - entity: Claim
    initial_state: SUBMITTED
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /claims/{id}/review"
        actor: ClaimsAdjuster
        preconditions:
          - "policy status IN {ACTIVE, LAPSED, PORTED} — claims may be filed and reviewed on lapsed or ported policies if the service_date fell within a covered period (ERR_POLICY_INACTIVE)"
          - "event_code exists in the policy's pinned benefit_schedule.benefit_items (ERR_EVENT_NOT_COVERED)"
        side_effects:
          - "provisional_payable_cents computed via calculation claim_payable variant PROVISIONAL"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /claims/{id}/adjudicate with decision=APPROVE"
        actor: ClaimsAdjuster
        preconditions:
          - "Every ClaimDocument of this claim has status = ACCEPTED (no RECEIVED or REJECTED documents outstanding) (ERR_DOCUMENTS_PENDING)"
          - "At least one ClaimDocument of this claim exists with doc_type IN {DIAGNOSIS_PROOF, ATTENDING_PHYSICIAN_STATEMENT} and status = ACCEPTED (ERR_INSUFFICIENT_DOCUMENTS)"
          - "If diagnosis_code IN employee.preexisting_diagnosis_codes AND service_date < coverage_start_date + pinned_schedule.preexisting_exclusion_months months: deny instead (adjudicate with decision=APPROVE on a pre-existing claim inside the exclusion window returns ERR_PRE_EXISTING_EXCLUSION and the claim moves to DENIED with denial_reason = PRE_EXISTING)"
          - "If prior paid occurrences of event_code in service_date's calendar year >= benefit_item.max_occurrences_per_year (zero remaining occurrences): the claim is auto-DENIED with denial_reason = CAP_EXHAUSTED"
          - "If policy.lifetime_paid_cents >= benefit_item.lifetime_max_cents (zero remaining lifetime capacity): the claim is auto-DENIED with denial_reason = CAP_EXHAUSTED"
          - "Otherwise the FINAL variant credits min(claimed_occurrences, remaining_occurrences) occurrences and caps the amount at remaining lifetime — partial approval is normal, not a denial"
        side_effects:
          - "payable_amount_cents computed via calculation claim_payable variant FINAL (capped at remaining yearly occurrences and remaining lifetime max); adjudicated_occurrences set"
          - "claim status := APPROVED"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /claims/{id}/adjudicate with decision=DENY (or auto-deny from the APPROVE preconditions above)"
        actor: ClaimsAdjuster | system
        preconditions: []
        side_effects:
          - "denial_reason set: explicit manual deny uses NOT_COVERED; auto-denies set PRE_EXISTING, CAP_EXHAUSTED, or INSUFFICIENT_DOCUMENTS as applicable"
      - from: APPROVED
        to: PAID
        trigger: "POST /claims/{id}/pay"
        actor: ClaimsAdjuster
        preconditions:
          - "policy status IN {ACTIVE, LAPSED, PORTED} (ERR_POLICY_INACTIVE)"
        side_effects:
          - "policy.lifetime_paid_cents += payable_amount_cents (ledger sync)"
          - "policy.paid_occurrences_by_year[year(service_date)][event_code] += adjudicated_occurrences (ledger sync)"
      - from: DENIED
        to: APPEALED
        trigger: "POST /claims/{id}/appeal"
        actor: PolicyholderServices
        preconditions:
          - "appeal filed within 180 days of the DENIED transition measured against the current clock (ERR_APPEAL_WINDOW_EXPIRED)"
        side_effects: []
      - from: APPEALED
        to: UNDER_REVIEW
        trigger: "POST /claims/{id}/review"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects:
          - "provisional_payable_cents recomputed via variant PROVISIONAL (appeal re-review restarts adjudication — cyclic loop UNDER_REVIEW -> DENIED -> APPEALED -> UNDER_REVIEW)"
      - from: APPROVED
        to: VOIDED
        trigger: "POST /claims/{id}/void"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects:
          - "No ledger change (claim never paid); payable_amount_cents retained for audit"
      - from: PAID
        to: VOIDED
        trigger: "POST /claims/{id}/void"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects:
          - "policy.lifetime_paid_cents -= payable_amount_cents (compensating reversal; invariant: lifetime_paid_cents always equals sum over non-VOIDED PAID claims)"
          - "policy.paid_occurrences_by_year[year(service_date)][event_code] -= adjudicated_occurrences"

  - entity: ClaimDocument
    initial_state: RECEIVED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: RECEIVED
        to: ACCEPTED
        trigger: "POST /claim-documents/{id}/accept"
        actor: ClaimsAdjuster
        preconditions:
          - "claim status IN {UNDER_REVIEW, APPEALED} (ERR_INVALID_STATE)"
        side_effects: []
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /claim-documents/{id}/reject"
        actor: ClaimsAdjuster
        preconditions:
          - "claim status IN {UNDER_REVIEW, APPEALED} (ERR_INVALID_STATE)"
        side_effects: []

  - entity: WellnessBenefit
    initial_state: SUBMITTED
    terminal_states: [PAID, DENIED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /wellness-benefits/{id}/approve"
        actor: ClaimsAdjuster
        preconditions:
          - "policy status IN {ACTIVE, LAPSED, PORTED} (ERR_POLICY_INACTIVE)"
          - "service_date >= coverage_start_date + pinned_schedule.wellness_waiting_months months (ERR_WELLNESS_WAITING_PERIOD)"
          - "year(service_date) == calendar_year (ERR_INVALID_REQUEST)"
          - "No other WellnessBenefit of the same policy_id with status IN {SUBMITTED, APPROVED, PAID} and the same calendar_year (ERR_WELLNESS_DUPLICATE_YEAR — annual duplicate-claim prevention; DENIED rows do not block)"
        side_effects:
          - "amount_cents := pinned_schedule.wellness_benefit_cents"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /wellness-benefits/{id}/deny"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: PAID
        trigger: "POST /wellness-benefits/{id}/pay"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects: []

  - entity: PayrollCycle
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /payroll-cycles/{id}/finalize"
        actor: GroupAdmin
        preconditions:
          - "employer_group status IN {ACTIVE, SUSPENDED} (ERR_GROUP_TERMINATED)"
        side_effects:
          - "For every Policy of this group's employees with status IN {ISSUED, ACTIVE} at finalize time whose coverage overlaps [period_start, period_end): a DeductionLine is synthesized with coverage_days and amount_cents per calculation deduction_proration; PORTED and LAPSED policies are excluded"
          - "total_posted_cents := sum of amount_cents over the cycle's POSTED DeductionLines (line-level rounding first, then sum — the pinned rounding order)"
      - from: FINALIZED
        to: RECONCILED
        trigger: "POST /payroll-cycles/{id}/reconcile"
        actor: CarrierAdmin
        preconditions:
          - "Every DeductionLine of this cycle has status POSTED or REVERSED (always true at rest; reconcile is a no-op gate that requires the caller to have resolved any line disputes first)"
        side_effects: []
      - from: RECONCILED
        to: CLOSED
        trigger: "POST /payroll-cycles/{id}/close"
        actor: CarrierAdmin
        preconditions: []
        side_effects: []

  - entity: DeductionLine
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "POST /deduction-lines/{id}/reverse"
        actor: GroupAdmin
        preconditions:
          - "payroll_cycle status = FINALIZED (ERR_CYCLE_NOT_REVERSIBLE — once RECONCILED or CLOSED, lines are immutable)"
        side_effects:
          - "payroll_cycle.total_posted_cents -= amount_cents (compensating reversal; invariant: total_posted_cents always equals sum over POSTED lines)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: schedule-publish-stale-series
    parent_entity: PolicySeries
    write_endpoint: "POST /benefit-schedules/{id}/publish"
    occ_field: "expected_series_version"
    description: |
      Publishing a BenefitSchedule against a PolicySeries whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just published a different schedule of the
      same series (which legitimately supersedes the previously published one)
      and the current writer's view of the series is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: campaign-close-stale-group
    parent_entity: EmployerGroup
    write_endpoint: "POST /enrollment-campaigns/{id}/close"
    occ_field: "expected_group_version"
    description: |
      Closing an EnrollmentCampaign with an EmployerGroup version that has
      advanced since the client last observed it is rejected. Bulk issuance at
      close mutates the group-visible enrolled population, so a close issued
      against a stale group view must not be applied.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: claim_payable
    trigger: "claim review (PROVISIONAL) and claim adjudicate-approve (FINAL)"
    algorithm: threshold
    formula: |
      item = pinned_schedule.benefit_items[event_code]
      year = year(service_date)
      paid_this_year = policy.paid_occurrences_by_year[year][event_code] (default 0)
      remaining_occurrences = max(0, item.max_occurrences_per_year - paid_this_year)
      remaining_lifetime = max(0, item.lifetime_max_cents - policy.lifetime_paid_cents)
      occurrences_credited = min(claimed_occurrences, remaining_occurrences)
      uncapped = item.benefit_amount_cents * occurrences_credited
      payable = min(uncapped, remaining_lifetime)
    input_set: "Claim in scope; policy.paid_occurrences_by_year and policy.lifetime_paid_cents consider ONLY claims in status PAID (VOIDED claims compensated out; APPROVED-not-yet-PAID claims do NOT consume capacity)"
    constants: {}
    precision: "integer cents, no rounding"
    variants:
      - name: PROVISIONAL
        when: "computed at SUBMITTED -> UNDER_REVIEW and APPEALED -> UNDER_REVIEW"
        difference: "credited occurrences = min(claimed_occurrences, remaining_occurrences) evaluated against CURRENT paid counters; result is an estimate stored in provisional_payable_cents and is NOT ledger-binding — approved-but-unpaid claims are invisible to it"
      - name: FINAL
        when: "computed at UNDER_REVIEW -> APPROVED"
        difference: "same formula evaluated at adjudication instant; if paid counters advanced since review (another claim paid in between), FINAL may be lower than PROVISIONAL; payable_amount_cents stores the FINAL value and only this value ever posts to the ledger"

  - name: deduction_proration
    trigger: "payroll cycle finalize (line synthesis)"
    algorithm: aggregation
    formula: |
      days_in_period = (period_end - period_start) in whole days (half-open: end excluded)
      coverage_days = days in [period_start, period_end) where policy status was IN {ISSUED, ACTIVE};
                      status as of finalize instant is used for the whole period if no
                      mid-period transition is recorded (this benchmark pins: status AT
                      finalize time decides billability for the whole period — a policy
                      ISSUED or ACTIVE at finalize bills the FULL period; LAPSED or PORTED
                      at finalize bills ZERO days)
      Variant DAILY:
        amount_cents = round_half_up(monthly_premium_cents * coverage_days / days_in_period)
      Variant HALF_MONTH:
        amount_cents = round_half_up(monthly_premium_cents / 2) * 2 if coverage_days == days_in_period
                     = round_half_up(monthly_premium_cents / 2)     if coverage_days > 0 and coverage_days < days_in_period
                     = 0                                            if coverage_days == 0
      (Since coverage is all-or-nothing at finalize, HALF_MONTH yields the full premium when
       billable and 0 otherwise; DAILY yields the full premium when billable and 0 otherwise.
       The variants diverge on the rounding convention itself: DAILY rounds
       premium * coverage_days / days_in_period as one product-then-divide; HALF_MONTH rounds
       premium / 2 per half-month bucket first, then multiplies by the bucket count.)
    input_set: "Policies of the cycle's employer group employees with status IN {ISSUED, ACTIVE} at finalize instant; LAPSED, PORTED, DECLINED, CANCELLED, APPLIED excluded"
    constants: {}
    precision: "line-level round_half_up to whole cents BEFORE summing into cycle total (pinned rounding order: round per DeductionLine, then sum — never sum-then-round)"
    variants:
      - name: DAILY
        when: "employer_group.proration_convention = DAILY"
        difference: "product-then-divide rounding: round_half_up(premium * coverage_days / days_in_period)"
      - name: HALF_MONTH
        when: "employer_group.proration_convention = HALF_MONTH"
        difference: "bucket-first rounding: each half-month bucket is rounded independently via round_half_up(premium / 2) before multiplying by bucket count; for premium 9999 cents the two variants differ (DAILY full period = 9999, HALF_MONTH full period = round_half_up(9999/2)*2 = 5000*2 = 10000)"

  - name: required_enrollments
    trigger: "campaign LOCKED -> MET / FAILED close"
    algorithm: threshold
    formula: |
      required = max(employer_group.participation_minimum_count,
                     ceil(employer_group.participation_minimum_pct * employer_group.eligible_employee_count))
      met = (employer_group.enrolled_count >= required)   # >= is pinned: exactly-at-threshold MET
    input_set: "eligible_employee_count = count of Employee rows of the group with status = ACTIVE at close instant; enrolled_count = count of Policy rows whose campaign belongs to the group with status IN {APPLIED, ISSUED, ACTIVE, LAPSED, PORTED}"
    constants: {}
    precision: "integer; ceil applied before comparison"

  - name: claim_documentation_sufficiency
    trigger: "claim adjudicate-approve"
    algorithm: constraint_propagation
    formula: |
      docs = ClaimDocument rows of the claim
      sufficient = (exists doc with doc_type IN {DIAGNOSIS_PROOF, ATTENDING_PHYSICIAN_STATEMENT}
                    and status = ACCEPTED)
                   AND (all docs have status = ACCEPTED)
      if not sufficient: ERR_DOCUMENTS_PENDING (any RECEIVED/REJECTED outstanding) or
                         ERR_INSUFFICIENT_DOCUMENTS (no accepted diagnosis/APS proof)
      Priority: ERR_DOCUMENTS_PENDING is checked BEFORE ERR_INSUFFICIENT_DOCUMENTS
    input_set: "all ClaimDocument rows of the claim regardless of doc status"
    constants: {}
    precision: "boolean gate, no numeric output"

  - name: wellness_eligibility
    trigger: "wellness benefit approve"
    algorithm: threshold
    formula: |
      waiting_ok = service_date >= add_months(policy.coverage_start_date, pinned_schedule.wellness_waiting_months)
      duplicate = exists WellnessBenefit of same policy, same calendar_year, status IN {SUBMITTED, APPROVED, PAID}
      year_ok = year(service_date) == calendar_year
      approvable = waiting_ok AND NOT duplicate AND year_ok AND policy status IN {ACTIVE, LAPSED, PORTED}
    input_set: "WellnessBenefit rows of the policy with status IN {SUBMITTED, APPROVED, PAID}; DENIED excluded from duplicate detection"
    constants: {}
    precision: "month arithmetic: add_months clamps to last day of month when needed (Jan 31 + 1 month = Feb 28)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and names a declared role; X-User-ID present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /_clock/set_current_utc"
  - priority: 2
    category: auth
    check: "Acting role is in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Every id referenced in path or body exists (validated left-to-right in path, then body fields in declared order)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with resource ids"
  - priority: 4
    category: business_referential
    check: "Body-supplied FK references resolve and are type-consistent (campaign.employer_group_id exists, policy.employee_id exists, etc.)"
    error_id: ERR_REFERENTIAL_INTEGRITY
    http_status: 422
    applies_to: "creation endpoints"
  - priority: 5
    category: state
    check: "Target resource is in a state that permits the requested transition per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: business_safety
    check: "Regulatory/compliance gates: counselor ACTIVE for campaign open; pre-existing exclusion window; guaranteed-issue screen; appeal window; reinstatement window"
    error_id: "ERR_COUNSELOR_INACTIVE | ERR_PRE_EXISTING_EXCLUSION | ERR_APPEAL_WINDOW_EXPIRED | ERR_REINSTATEMENT_WINDOW_EXPIRED"
    http_status: 422
    applies_to: "campaign open; claim adjudicate; claim appeal; policy reinstate"
  - priority: 7
    category: business_constraint
    check: "Structural constraints: campaign window overlap within group (half-open), counselor double-booking across OPEN campaigns (closed-interval), duplicate coverage per employee+series, wellness duplicate per calendar year, schedule_version monotonicity, effective_date strictly increasing within series"
    error_id: "ERR_CAMPAIGN_WINDOW_OVERLAP | ERR_COUNSELOR_DOUBLE_BOOKED | ERR_DUPLICATE_COVERAGE | ERR_WELLNESS_DUPLICATE_YEAR | ERR_SCHEDULE_VERSION_CONFLICT"
    http_status: 409
    applies_to: "campaign create/open/reopen; policy apply; wellness submit; schedule create"
  - priority: 8
    category: business_temporal
    check: "Window/period temporal gates: campaign open before window_end; lock only after window_end; wellness waiting period; service_date within calendar_year; payroll cycle period_end strictly after period_start"
    error_id: "ERR_WINDOW_EXPIRED | ERR_WINDOW_NOT_CLOSED | ERR_WELLNESS_WAITING_PERIOD | ERR_INVALID_REQUEST"
    http_status: 422
    applies_to: "campaign open/lock/reopen; wellness approve; payroll cycle create"
  - priority: 9
    category: business_fiscal
    check: "Fiscal capacity gates: yearly occurrence cap, lifetime max cap, claims-in-flight on cancel"
    error_id: "ERR_CAP_EXHAUSTED | ERR_CLAIMS_IN_FLIGHT"
    http_status: 422
    applies_to: "claim adjudicate (auto-deny), policy cancel"
  - priority: 10
    category: business_constraint
    check: "OCC: expected_*_version matches the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /benefit-schedules/{id}/publish; POST /enrollment-campaigns/{id}/close"
  - priority: 11
    category: business_constraint
    check: "Request body schema: required fields present, enums valid, numeric ranges valid (claimed_occurrences >= 1, amounts >= 0, window_end > window_start)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the clock reads exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [CarrierAdmin, GroupAdmin, BenefitCounselor, ClaimsAdjuster, PolicyholderServices]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

  # --- EmployerGroup ---
  - method: POST
    path: "/employer-groups"
    description: "Create an employer group"
    roles: [CarrierAdmin]
    code: 201
    input: [name, group_code, "participation_minimum_pct?", "participation_minimum_count?", "proration_convention?"]
    output: EmployerGroup
    side_effects: ["status=PROSPECT"]
  - method: GET
    path: "/employer-groups/{id}"
    description: "Get an employer group (with computed eligible_employee_count and enrolled_count)"
    roles: [CarrierAdmin, GroupAdmin, BenefitCounselor]
    code: 200
    input: []
    output: EmployerGroup
    side_effects: []
  - method: GET
    path: "/employer-groups"
    description: "List employer groups (paginated)"
    roles: [CarrierAdmin, GroupAdmin, BenefitCounselor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EmployerGroup[]
    side_effects: []
  - method: POST
    path: "/employer-groups/{id}/activate"
    description: "PROSPECT|SUSPENDED -> ACTIVE"
    roles: [CarrierAdmin]
    code: 200
    input: []
    output: EmployerGroup
    side_effects: ["increments EmployerGroup.version by 1"]
  - method: POST
    path: "/employer-groups/{id}/suspend"
    description: "ACTIVE -> SUSPENDED; locks open campaigns"
    roles: [CarrierAdmin]
    code: 200
    input: []
    output: EmployerGroup
    side_effects: ["OPEN campaigns of the group -> LOCKED", "increments EmployerGroup.version by 1"]
  - method: POST
    path: "/employer-groups/{id}/terminate"
    description: "ACTIVE|SUSPENDED -> TERMINATED; lapses issued/active policies, closes campaigns"
    roles: [CarrierAdmin]
    code: 200
    input: []
    output: EmployerGroup
    side_effects: ["policies ISSUED/ACTIVE -> LAPSED", "campaigns DRAFT/LOCKED/MET/FAILED -> CLOSED", "increments EmployerGroup.version by 1"]
  - method: GET
    path: "/employer-groups/{id}/employees"
    description: "List employees of a group"
    roles: [CarrierAdmin, GroupAdmin, BenefitCounselor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Employee[]
    side_effects: []
  - method: GET
    path: "/employer-groups/{id}/enrollment-campaigns"
    description: "List campaigns of a group"
    roles: [CarrierAdmin, GroupAdmin, BenefitCounselor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EnrollmentCampaign[]
    side_effects: []
  - method: GET
    path: "/employer-groups/{id}/payroll-cycles"
    description: "List payroll cycles of a group"
    roles: [CarrierAdmin, GroupAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PayrollCycle[]
    side_effects: []

  # --- BenefitCounselor ---
  - method: POST
    path: "/benefit-counselors"
    description: "Create a benefit counselor"
    roles: [CarrierAdmin]
    code: 201
    input: [license_id, full_name, home_state]
    output: BenefitCounselor
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/benefit-counselors/{id}"
    description: "Get a counselor"
    roles: [CarrierAdmin, BenefitCounselor]
    code: 200
    input: []
    output: BenefitCounselor
    side_effects: []
  - method: POST
    path: "/benefit-counselors/{id}/suspend"
    description: "ACTIVE -> SUSPENDED"
    roles: [CarrierAdmin]
    code: 200
    input: []
    output: BenefitCounselor
    side_effects: []
  - method: POST
    path: "/benefit-counselors/{id}/activate"
    description: "SUSPENDED -> ACTIVE"
    roles: [CarrierAdmin]
    code: 200
    input: []
    output: BenefitCounselor
    side_effects: []
  - method: POST
    path: "/benefit-counselors/{id}/terminate"
    description: "ACTIVE|SUSPENDED -> TERMINATED (blocked while leading an OPEN campaign)"
    roles: [CarrierAdmin]
    code: 200
    input: []
    output: BenefitCounselor
    side_effects: []
  - method: GET
    path: "/benefit-counselors/{id}/enrollment-campaigns"
    description: "List campaigns led by a counselor"
    roles: [CarrierAdmin, BenefitCounselor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EnrollmentCampaign[]
    side_effects: []

  # --- EnrollmentCampaign ---
  - method: POST
    path: "/enrollment-campaigns"
    description: "Create a campaign (DRAFT)"
    roles: [CarrierAdmin, BenefitCounselor]
    code: 201
    input: [employer_group_id, counselor_id, window_start, window_end, "guaranteed_issue?"]
    output: EnrollmentCampaign
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/enrollment-campaigns/{id}"
    description: "Get a campaign"
    roles: [CarrierAdmin, GroupAdmin, BenefitCounselor]
    code: 200
    input: []
    output: EnrollmentCampaign
    side_effects: []
  - method: GET
    path: "/enrollment-campaigns"
    description: "List campaigns; filterable"
    roles: [CarrierAdmin, GroupAdmin, BenefitCounselor]
    code: 200
    input: ["employer_group_id?", "counselor_id?", "status?", "limit?", "offset?"]
    output: EnrollmentCampaign[]
    side_effects: []
  - method: POST
    path: "/enrollment-campaigns/{id}/open"
    description: "DRAFT -> OPEN"
    roles: [BenefitCounselor]
    code: 200
    input: []
    output: EnrollmentCampaign
    side_effects: []
  - method: POST
    path: "/enrollment-campaigns/{id}/lock"
    description: "OPEN -> LOCKED (requires clock >= window_end)"
    roles: [BenefitCounselor]
    code: 200
    input: []
    output: EnrollmentCampaign
    side_effects: []
  - method: POST
    path: "/enrollment-campaigns/{id}/close"
    description: "LOCKED -> MET|FAILED (participation branch); MET|FAILED -> CLOSED. OCC on employer group."
    roles: [BenefitCounselor]
    code: 200
    input: [expected_group_version]
    output: EnrollmentCampaign
    side_effects: ["on MET: bulk issue APPLIED policies", "on FAILED: APPLIED policies -> DECLINED", "increments EnrollmentCampaign.version by 1"]
  - method: POST
    path: "/enrollment-campaigns/{id}/reopen"
    description: "FAILED -> OPEN with extended window"
    roles: [BenefitCounselor]
    code: 200
    input: [new_window_end]
    output: EnrollmentCampaign
    side_effects: ["window_end := new_window_end", "DECLINED policies of this campaign -> APPLIED"]
  - method: GET
    path: "/enrollment-campaigns/{id}/policies"
    description: "List policies applied under a campaign"
    roles: [CarrierAdmin, GroupAdmin, BenefitCounselor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Policy[]
    side_effects: []

  # --- PolicySeries ---
  - method: POST
    path: "/policy-series"
    description: "Create a policy series (DRAFT)"
    roles: [CarrierAdmin]
    code: 201
    input: [series_code, product_line]
    output: PolicySeries
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/policy-series/{id}"
    description: "Get a series"
    roles: [CarrierAdmin, BenefitCounselor, ClaimsAdjuster]
    code: 200
    input: []
    output: PolicySeries
    side_effects: []
  - method: GET
    path: "/policy-series/{id}/benefit-schedules"
    description: "List schedules of a series"
    roles: [CarrierAdmin, BenefitCounselor, ClaimsAdjuster]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BenefitSchedule[]
    side_effects: []
  - method: POST
    path: "/policy-series/{id}/activate"
    description: "DRAFT -> ACTIVE (requires a PUBLISHED schedule)"
    roles: [CarrierAdmin]
    code: 200
    input: []
    output: PolicySeries
    side_effects: []
  - method: POST
    path: "/policy-series/{id}/retire"
    description: "ACTIVE -> RETIRED"
    roles: [CarrierAdmin]
    code: 200
    input: []
    output: PolicySeries
    side_effects: ["new applications rejected with ERR_SERIES_RETIRED"]
  - method: GET
    path: "/policy-series/{id}/policies"
    description: "List policies of a series"
    roles: [CarrierAdmin, ClaimsAdjuster]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Policy[]
    side_effects: []

  # --- BenefitSchedule ---
  - method: POST
    path: "/benefit-schedules"
    description: "Create a benefit schedule (DRAFT)"
    roles: [CarrierAdmin]
    code: 201
    input: [policy_series_id, schedule_version, effective_date, benefit_items, monthly_premium_cents, wellness_benefit_cents, wellness_waiting_months, preexisting_exclusion_months]
    output: BenefitSchedule
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/benefit-schedules/{id}"
    description: "Get a schedule"
    roles: [CarrierAdmin, BenefitCounselor, ClaimsAdjuster]
    code: 200
    input: []
    output: BenefitSchedule
    side_effects: []
  - method: POST
    path: "/benefit-schedules/{id}/publish"
    description: "DRAFT -> PUBLISHED; supersedes prior PUBLISHED schedule of the series. OCC on policy series."
    roles: [CarrierAdmin]
    code: 200
    input: [expected_series_version]
    output: BenefitSchedule
    side_effects: ["prior PUBLISHED schedule -> SUPERSEDED", "series.current_schedule_id := this id", "increments PolicySeries.version by 1"]

  # --- Employee ---
  - method: POST
    path: "/employees"
    description: "Create an employee (ACTIVE)"
    roles: [CarrierAdmin, GroupAdmin]
    code: 201
    input: [employer_group_id, employee_ref, full_name, hire_date, "preexisting_diagnosis_codes?"]
    output: Employee
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/employees/{id}"
    description: "Get an employee"
    roles: [CarrierAdmin, GroupAdmin, BenefitCounselor]
    code: 200
    input: []
    output: Employee
    side_effects: []
  - method: POST
    path: "/employees/{id}/terminate"
    description: "ACTIVE -> TERMINATED"
    roles: [GroupAdmin]
    code: 200
    input: []
    output: Employee
    side_effects: []
  - method: POST
    path: "/employees/{id}/reinstate"
    description: "TERMINATED -> ACTIVE"
    roles: [GroupAdmin]
    code: 200
    input: []
    output: Employee
    side_effects: []
  - method: GET
    path: "/employees/{id}/policies"
    description: "List policies of an employee"
    roles: [CarrierAdmin, GroupAdmin, BenefitCounselor, ClaimsAdjuster, PolicyholderServices]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Policy[]
    side_effects: []

  # --- Policy ---
  - method: POST
    path: "/policies"
    description: "Apply for a policy under a campaign (APPLIED)"
    roles: [BenefitCounselor]
    code: 201
    input: [campaign_id, employee_id, policy_series_id, "premium_mode?"]
    output: Policy
    side_effects:
      - "requires campaign status = OPEN and clock within [window_start, window_end) (ERR_WINDOW_EXPIRED / ERR_INVALID_STATE)"
      - "status=APPLIED"
  - method: GET
    path: "/policies/{id}"
    description: "Get a policy"
    roles: [CarrierAdmin, GroupAdmin, BenefitCounselor, ClaimsAdjuster, PolicyholderServices]
    code: 200
    input: []
    output: Policy
    side_effects: []
  - method: GET
    path: "/policies"
    description: "List policies; filterable"
    roles: [CarrierAdmin, GroupAdmin, BenefitCounselor, ClaimsAdjuster, PolicyholderServices]
    code: 200
    input: ["campaign_id?", "employee_id?", "policy_series_id?", "benefit_schedule_id?", "status?", "limit?", "offset?"]
    output: Policy[]
    side_effects: []
  - method: POST
    path: "/policies/{id}/issue"
    description: "APPLIED -> ISSUED (direct issuance, e.g. post-campaign cleanup; same preconditions as bulk issuance)"
    roles: [BenefitCounselor]
    code: 200
    input: []
    output: Policy
    side_effects: ["pins benefit_schedule_id, monthly_premium_cents, issue_date, coverage_start_date"]
  - method: POST
    path: "/policies/{id}/activate"
    description: "ISSUED -> ACTIVE"
    roles: [BenefitCounselor]
    code: 200
    input: []
    output: Policy
    side_effects: []
  - method: POST
    path: "/policies/{id}/lapse"
    description: "ISSUED|ACTIVE -> LAPSED"
    roles: [BenefitCounselor]
    code: 200
    input: []
    output: Policy
    side_effects: []
  - method: POST
    path: "/policies/{id}/reinstate"
    description: "LAPSED -> ACTIVE within 60 days"
    roles: [BenefitCounselor]
    code: 200
    input: []
    output: Policy
    side_effects: []
  - method: POST
    path: "/policies/{id}/port"
    description: "ISSUED|ACTIVE -> PORTED when employee terminated; forces POST_TAX"
    roles: [PolicyholderServices]
    code: 200
    input: [new_premium_mode]
    output: Policy
    side_effects: ["premium_mode := POST_TAX", "excluded from enrolled_count and payroll billing"]
  - method: POST
    path: "/policies/{id}/cancel"
    description: "LAPSED|PORTED -> CANCELLED (no in-flight claims)"
    roles: [PolicyholderServices]
    code: 200
    input: []
    output: Policy
    side_effects: []

  # --- Claim ---
  - method: POST
    path: "/claims"
    description: "Submit a claim (SUBMITTED)"
    roles: [PolicyholderServices, ClaimsAdjuster]
    code: 201
    input: [policy_id, event_code, service_date, diagnosis_code, "procedure_code?", claimed_occurrences]
    output: Claim
    side_effects: ["status=SUBMITTED"]
  - method: GET
    path: "/claims/{id}"
    description: "Get a claim"
    roles: [CarrierAdmin, ClaimsAdjuster, PolicyholderServices]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: GET
    path: "/claims"
    description: "List claims; filterable"
    roles: [CarrierAdmin, ClaimsAdjuster, PolicyholderServices]
    code: 200
    input: ["policy_id?", "status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []
  - method: POST
    path: "/claims/{id}/review"
    description: "SUBMITTED|APPEALED -> UNDER_REVIEW; computes provisional payable"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["provisional_payable_cents computed (PROVISIONAL variant)"]
  - method: POST
    path: "/claims/{id}/adjudicate"
    description: "UNDER_REVIEW -> APPROVED (decision=APPROVE) or -> DENIED (decision=DENY); auto-deny branches per §1.2"
    roles: [ClaimsAdjuster]
    code: 200
    input: [decision]
    output: Claim
    side_effects: ["on APPROVE: payable_amount_cents computed (FINAL variant), adjudicated_occurrences set", "on auto-deny: denial_reason set"]
  - method: POST
    path: "/claims/{id}/pay"
    description: "APPROVED -> PAID; posts to policy ledger"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["policy.lifetime_paid_cents += payable_amount_cents", "policy.paid_occurrences_by_year updated"]
  - method: POST
    path: "/claims/{id}/appeal"
    description: "DENIED -> APPEALED within 180 days"
    roles: [PolicyholderServices]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: POST
    path: "/claims/{id}/void"
    description: "APPROVED|PAID -> VOIDED; reverses ledger postings for PAID claims"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["if PAID: policy.lifetime_paid_cents -= payable_amount_cents; paid_occurrences_by_year decremented"]
  - method: GET
    path: "/claims/{id}/documents"
    description: "List documents of a claim"
    roles: [CarrierAdmin, ClaimsAdjuster, PolicyholderServices]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ClaimDocument[]
    side_effects: []

  # --- ClaimDocument ---
  - method: POST
    path: "/claim-documents"
    description: "Attach a document to a claim (RECEIVED)"
    roles: [PolicyholderServices, ClaimsAdjuster]
    code: 201
    input: [claim_id, doc_type, content_ref]
    output: ClaimDocument
    side_effects: ["status=RECEIVED; claim must be in UNDER_REVIEW or APPEALED"]
  - method: GET
    path: "/claim-documents/{id}"
    description: "Get a document"
    roles: [CarrierAdmin, ClaimsAdjuster, PolicyholderServices]
    code: 200
    input: []
    output: ClaimDocument
    side_effects: []
  - method: POST
    path: "/claim-documents/{id}/accept"
    description: "RECEIVED -> ACCEPTED"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: ClaimDocument
    side_effects: []
  - method: POST
    path: "/claim-documents/{id}/reject"
    description: "RECEIVED -> REJECTED"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: ClaimDocument
    side_effects: []

  # --- WellnessBenefit ---
  - method: POST
    path: "/wellness-benefits"
    description: "Submit an annual wellness benefit claim (SUBMITTED)"
    roles: [PolicyholderServices, ClaimsAdjuster]
    code: 201
    input: [policy_id, calendar_year, service_date]
    output: WellnessBenefit
    side_effects: ["status=SUBMITTED"]
  - method: GET
    path: "/wellness-benefits/{id}"
    description: "Get a wellness benefit"
    roles: [CarrierAdmin, ClaimsAdjuster, PolicyholderServices]
    code: 200
    input: []
    output: WellnessBenefit
    side_effects: []
  - method: GET
    path: "/wellness-benefits"
    description: "List wellness benefits; filterable"
    roles: [CarrierAdmin, ClaimsAdjuster, PolicyholderServices]
    code: 200
    input: ["policy_id?", "calendar_year?", "status?", "limit?", "offset?"]
    output: WellnessBenefit[]
    side_effects: []
  - method: POST
    path: "/wellness-benefits/{id}/approve"
    description: "SUBMITTED -> APPROVED (waiting period + duplicate-year + year-match gates)"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: WellnessBenefit
    side_effects: ["amount_cents := pinned schedule wellness_benefit_cents"]
  - method: POST
    path: "/wellness-benefits/{id}/deny"
    description: "SUBMITTED -> DENIED"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: WellnessBenefit
    side_effects: []
  - method: POST
    path: "/wellness-benefits/{id}/pay"
    description: "APPROVED -> PAID"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: WellnessBenefit
    side_effects: []

  # --- PayrollCycle / DeductionLine ---
  - method: POST
    path: "/payroll-cycles"
    description: "Create a payroll cycle (OPEN)"
    roles: [GroupAdmin]
    code: 201
    input: [employer_group_id, period_start, period_end]
    output: PayrollCycle
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/payroll-cycles/{id}"
    description: "Get a payroll cycle"
    roles: [CarrierAdmin, GroupAdmin]
    code: 200
    input: []
    output: PayrollCycle
    side_effects: []
  - method: POST
    path: "/payroll-cycles/{id}/finalize"
    description: "OPEN -> FINALIZED; synthesizes DeductionLines per deduction_proration"
    roles: [GroupAdmin]
    code: 200
    input: []
    output: PayrollCycle
    side_effects: ["DeductionLines synthesized for billable policies", "total_posted_cents computed (round-per-line then sum)"]
  - method: POST
    path: "/payroll-cycles/{id}/reconcile"
    description: "FINALIZED -> RECONCILED"
    roles: [CarrierAdmin]
    code: 200
    input: []
    output: PayrollCycle
    side_effects: []
  - method: POST
    path: "/payroll-cycles/{id}/close"
    description: "RECONCILED -> CLOSED"
    roles: [CarrierAdmin]
    code: 200
    input: []
    output: PayrollCycle
    side_effects: []
  - method: GET
    path: "/payroll-cycles/{id}/deduction-lines"
    description: "List deduction lines of a cycle"
    roles: [CarrierAdmin, GroupAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DeductionLine[]
    side_effects: []
  - method: GET
    path: "/deduction-lines"
    description: "List deduction lines; filterable by cycle, policy, employee"
    roles: [CarrierAdmin, GroupAdmin]
    code: 200
    input: ["payroll_cycle_id?", "policy_id?", "employee_id?", "status?", "limit?", "offset?"]
    output: DeductionLine[]
    side_effects: []
  - method: GET
    path: "/deduction-lines/{id}"
    description: "Get a deduction line"
    roles: [CarrierAdmin, GroupAdmin]
    code: 200
    input: []
    output: DeductionLine
    side_effects: []
  - method: POST
    path: "/deduction-lines/{id}/reverse"
    description: "POSTED -> REVERSED (cycle must be FINALIZED); compensates cycle total"
    roles: [GroupAdmin]
    code: 200
    input: []
    output: DeductionLine
    side_effects: ["payroll_cycle.total_posted_cents -= amount_cents"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, invalid enum, invalid range, year mismatch, empty benefit_items" }
  - { id: ERR_REFERENTIAL_INTEGRITY, http: 422, condition: "Body FK references a resource that does not exist or is the wrong type" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state that permits the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_GROUP_INACTIVE, http: 422, condition: "Employer group not ACTIVE where required (campaign open/reopen, policy reinstate)" }
  - { id: ERR_GROUP_TERMINATED, http: 422, condition: "Employer group TERMINATED; payroll finalize and employee reinstate blocked" }
  - { id: ERR_COUNSELOR_INACTIVE, http: 422, condition: "Benefit counselor not ACTIVE at campaign creation or open" }
  - { id: ERR_CAMPAIGN_WINDOW_OVERLAP, http: 409, condition: "Campaign window overlaps another OPEN campaign of the same group (half-open interval semantics)" }
  - { id: ERR_COUNSELOR_DOUBLE_BOOKED, http: 409, condition: "Counselor already leads an OPEN campaign whose window touches or intersects this one under closed-interval semantics" }
  - { id: ERR_WINDOW_EXPIRED, http: 422, condition: "Current clock at or past window_end on open; or new_window_end not strictly after now on reopen" }
  - { id: ERR_WINDOW_NOT_CLOSED, http: 422, condition: "Lock attempted before window_end" }
  - { id: ERR_SERIES_WITHOUT_SCHEDULE, http: 422, condition: "Policy series has no PUBLISHED benefit schedule (activation or issuance)" }
  - { id: ERR_SERIES_RETIRED, http: 422, condition: "Policy series RETIRED; new applications/issuance blocked" }
  - { id: ERR_SCHEDULE_VERSION_CONFLICT, http: 409, condition: "schedule_version not greater than existing versions of the series, or effective_date not strictly increasing within the series" }
  - { id: ERR_DUPLICATE_COVERAGE, http: 409, condition: "Another policy for the same employee and series exists in a non-terminal state" }
  - { id: ERR_EMPLOYEE_INACTIVE, http: 422, condition: "Employee TERMINATED where ACTIVE required (policy activate/reinstate)" }
  - { id: ERR_PORT_NOT_ELIGIBLE, http: 422, condition: "Port requested while employee still ACTIVE" }
  - { id: ERR_REINSTATEMENT_WINDOW_EXPIRED, http: 422, condition: "Policy lapsed more than 60 days ago" }
  - { id: ERR_CLAIMS_IN_FLIGHT, http: 422, condition: "Policy cancel blocked by claims in SUBMITTED/UNDER_REVIEW/APPEALED/APPROVED" }
  - { id: ERR_POLICY_INACTIVE, http: 422, condition: "Policy status not in {ACTIVE, LAPSED, PORTED} for claim review/pay or wellness approve" }
  - { id: ERR_EVENT_NOT_COVERED, http: 422, condition: "event_code absent from the policy's pinned benefit schedule" }
  - { id: ERR_DOCUMENTS_PENDING, http: 422, condition: "Claim has documents still RECEIVED or REJECTED at adjudication" }
  - { id: ERR_INSUFFICIENT_DOCUMENTS, http: 422, condition: "No ACCEPTED DIAGNOSIS_PROOF or ATTENDING_PHYSICIAN_STATEMENT on the claim" }
  - { id: ERR_PRE_EXISTING_EXCLUSION, http: 422, condition: "Diagnosis is pre-existing and service_date falls inside the exclusion window (claim auto-DENIED with reason PRE_EXISTING)" }
  - { id: ERR_CAP_EXHAUSTED, http: 422, condition: "Yearly occurrence cap or lifetime max would be exceeded (claim auto-DENIED with reason CAP_EXHAUSTED)" }
  - { id: ERR_APPEAL_WINDOW_EXPIRED, http: 422, condition: "Appeal filed more than 180 days after denial" }
  - { id: ERR_WELLNESS_WAITING_PERIOD, http: 422, condition: "service_date before coverage_start_date + wellness_waiting_months" }
  - { id: ERR_WELLNESS_DUPLICATE_YEAR, http: 422, condition: "Another wellness benefit for the same policy and calendar_year exists in SUBMITTED/APPROVED/PAID" }
  - { id: ERR_CYCLE_NOT_REVERSIBLE, http: 409, condition: "Deduction line reverse attempted on a cycle not in FINALIZED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CarrierAdmin
    description: "Carrier-side administrator: owns groups, series, schedules, counselors; reconciles payroll"
    identity: "opaque"
    exclusive_operations:
      - "POST /employer-groups, /employer-groups/{id}/activate|suspend|terminate"
      - "POST /policy-series, /policy-series/{id}/activate|retire"
      - "POST /benefit-schedules, /benefit-schedules/{id}/publish"
      - "POST /benefit-counselors"
      - "POST /payroll-cycles/{id}/reconcile, /payroll-cycles/{id}/close"
    shared_operations:
      - "GET endpoints across all resources"
      - "POST /_clock/set_current_utc"
  - name: GroupAdmin
    description: "Employer-side administrator: manages employees and payroll cycles"
    identity: "opaque"
    exclusive_operations:
      - "POST /employees/{id}/terminate, /employees/{id}/reinstate"
      - "POST /payroll-cycles, /payroll-cycles/{id}/finalize"
      - "POST /deduction-lines/{id}/reverse"
    shared_operations:
      - "POST /employees (with CarrierAdmin)"
      - "GET endpoints for groups, employees, policies, cycles, lines"
      - "POST /_clock/set_current_utc"
  - name: BenefitCounselor
    description: "Worksite counselor: runs enrollment campaigns and the policy lifecycle"
    identity: "entity_backed:BenefitCounselor"
    exclusive_operations:
      - "POST /enrollment-campaigns/{id}/open|lock|close|reopen"
      - "POST /policies (application intake)"
      - "POST /policies/{id}/issue|activate|lapse|reinstate"
    shared_operations:
      - "POST /enrollment-campaigns (with CarrierAdmin)"
      - "GET endpoints for groups, campaigns, series, schedules, employees, policies"
      - "POST /_clock/set_current_utc"
  - name: ClaimsAdjuster
    description: "Claims adjudicator: reviews, adjudicates, pays, voids claims; decides documents and wellness benefits"
    identity: "opaque"
    exclusive_operations:
      - "POST /claims/{id}/review|adjudicate|pay|void"
      - "POST /claim-documents/{id}/accept|reject"
      - "POST /wellness-benefits/{id}/approve|deny|pay"
    shared_operations:
      - "POST /claims, /claim-documents, /wellness-benefits (with PolicyholderServices)"
      - "GET endpoints for policies, claims, documents, wellness benefits, series, schedules"
      - "POST /_clock/set_current_utc"
  - name: PolicyholderServices
    description: "Policyholder service desk: files claims and wellness benefits on behalf of insureds, ports and cancels policies, files appeals"
    identity: "opaque"
    exclusive_operations:
      - "POST /policies/{id}/port, /policies/{id}/cancel"
      - "POST /claims/{id}/appeal"
    shared_operations:
      - "POST /claims, /claim-documents, /wellness-benefits (with ClaimsAdjuster)"
      - "GET endpoints for employees, policies, claims, documents, wellness benefits"
      - "POST /_clock/set_current_utc"
