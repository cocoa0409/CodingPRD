          trigger:
            - call: "POST /340b/dispenses"
              payload: { covered_entity_id: "${ce_id}", patient_id: "${pat_id}", prescriber_id: "${presc_id}", drug_product_id: "${dp_id}", quantity_units: 70, quarter: "2026Q2" }
