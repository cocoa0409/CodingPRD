    - name: visit_start_depends_on_auditor_certification_state
      grounds:
      - state_machines.AuditVisit.SCHEDULED_to_IN_PROGRESS
      - state_machines.Auditor.CERTIFIED_to_SUSPENDED
      - state_machines.Auditor.SUSPENDED_to_CERTIFIED
      - validations.priority_12
      - errors.ERR_AUDITOR_SUSPENDED
