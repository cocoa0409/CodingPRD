# ============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_2626 — Defensible Space & Fuels Inspection Program
#
# Breadth walk of references/claim-extraction-guide.md against this scaffold's
# §1.1-§1.7 surface. §1.8 is the depth probe; this file is the breadth probe.
# Every `section:` value is one of the guide's nine sections and every
# `claim_type:` value is a row from that section's table.
# Instances already exercised by §1.8 are emitted as `excluded_because:` stubs
# citing the §1.8 instance by exact name.
#
# Every numeric assert was executed against the §1.3 formulas and constants and
# is written as a pinned literal. The logical clock starts at
# 2026-08-01T00:00:00Z on a fresh server.
# ============================================================================

scaffold_corner_design:

  # ==========================================================================
  - section: entities
    instances:

      - name: parcel_creation_returns_intake_scored_row
        claim_type: Creation
        grounds:
          - entities.Parcel
          - calculations.parcel_risk_score
          - endpoints."POST /fire-district/parcels"
        distinguishing_aspect: |
          A parcel POST with every required field returns 201 and the row is already
          risk-scored by the intake_provisional variant: risk_score 63.83, risk_class HIGH,
          risk_score_basis INTAKE_PROVISIONAL, while the inspection-derived posture fields
          start at their neutral values (compliance_status PENDING_INSPECTION,
          open_violation_count 0, inspection_priority_rank null).
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-1001", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", structure_present: true, roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { p1: "$.data.id" }
          assert:
            - "HTTP 201 and the envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == \"object\" per §1.0"
            - "Parcel.${p1}.apn == \"APN-1001\", owner_name == \"Ann Reyes\", roof_class == \"CLASS_B\", vegetation_type == \"BRUSH\", slope_pct == 30, hazard_zone == \"HIGH\", access_constraint == \"GATED\""
            - "Parcel.${p1}.risk_score == 63.83 (weighted_subtotal 55.50 * HAZARD_MULT.HIGH 1.15) and risk_class == \"HIGH\""
            - "Parcel.${p1}.risk_score_basis == \"INTAKE_PROVISIONAL\": no inspection has happened yet"
            - "Parcel.${p1}.compliance_status == \"PENDING_INSPECTION\", open_violation_count == 0, inspection_priority_rank == null, last_passed_inspection_at_utc == null"

      - name: contractor_retrieval_returns_stored_row
        claim_type: Retrieval
        grounds:
          - entities.Contractor
          - endpoints."POST /fire-district/contractors"
          - endpoints."GET /fire-district/contractors/{contractor_id}"
        distinguishing_aspect: "GET /contractors/{id} returns exactly the row POST created, including the two conserved ledger fields committed_crew_hours == 0 and completed_crew_hours == 0."
        test_recipe:
          setup:
            - "One contractor registered at clock 2026-08-01T00:00:00Z, no orders awarded."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/contractors"
              payload: { business_name: "Ridgeline Fuels LLC", hourly_rate_cents: 8600, mobilization_fee_cents: 32000, license_status: "ACTIVE", insurance_expiry_utc: "2027-06-30T00:00:00Z", max_daily_orders: 2 }
              as: ProgramAdmin
              captures: { c1: "$.data.id" }
          trigger:
            - call: "GET /fire-district/contractors/${c1}"
              payload: {}
              as: FireMarshal
          assert:
            - "HTTP 200 with response_type == \"object\" and data.id == ${c1}"
            - "Contractor.${c1}.business_name == \"Ridgeline Fuels LLC\", hourly_rate_cents == 8600, mobilization_fee_cents == 32000, max_daily_orders == 2"
            - "Contractor.${c1}.license_status == \"ACTIVE\" and insurance_expiry_utc == \"2027-06-30T00:00:00Z\""
            - "Contractor.${c1}.committed_crew_hours == 0 and completed_crew_hours == 0"
            - "Contractor.${c1}.version == 1: a read performs no write"

      - name: parcel_listing_filters_by_risk_class_with_pagination
        claim_type: Listing
        grounds:
          - endpoints."GET /fire-district/parcels"
          - response_envelope.pagination_fields
          - calculations.parcel_risk_score
        distinguishing_aspect: |
          The list endpoint applies the risk_class filter to the DERIVED field and paginates the
          filtered set, not the whole table: two HIGH parcels and one MODERATE parcel exist, and
          limit 1 over risk_class HIGH returns exactly 1 row with total_count 2 and has_more true.
        test_recipe:
          setup:
            - "Three parcels: two scoring 63.83 (HIGH) and one scoring 35.25 (MODERATE)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-1101", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { ph1: "$.data.id", ph1_class: "$.data.risk_class" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-1102", owner_name: "Ben Ortiz", owner_email: "ben@example.com", situs_address: "14 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { ph2: "$.data.id" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-1103", owner_name: "Cara Diaz", owner_email: "cara@example.com", situs_address: "16 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "GRASS", slope_pct: 20, lot_area_sqft: 43560, hazard_zone: "MODERATE", access_constraint: "NONE" }
              as: ProgramAdmin
              captures: { pm1: "$.data.id", pm1_score: "$.data.risk_score" }
          trigger:
            - call: "GET /fire-district/parcels"
              payload: { risk_class: "HIGH", limit: 1, offset: 0 }
              as: ProgramAdmin
          assert:
            - "${ph1_class} == \"HIGH\" and ${pm1_score} == 35.25 (risk_class MODERATE) before the trigger"
            - "HTTP 200 with response_type == \"array\", exactly 1 element in data, total_count == 2 and has_more == true"
            - "The single returned element is ${ph1} or ${ph2}; ${pm1} is absent from the filtered page"
            - "The same call with offset 1 returns the other HIGH parcel with total_count 2 and has_more == false"
            - "The same call with no risk_class filter and limit 10 returns all 3 parcels with total_count 3 and has_more == false"

      - name: inspector_get_unknown_id_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_INSPECTOR_NOT_FOUND]
          - validations.priority_20
          - endpoints."GET /fire-district/inspectors/{inspector_id}"
        distinguishing_aspect: "A GET on a syntactically valid but unregistered inspector id returns 404 ERR_INSPECTOR_NOT_FOUND, not an empty 200 body."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock; no Inspector rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /fire-district/inspectors/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 with response_type == \"error\" and ${err} == \"ERR_INSPECTOR_NOT_FOUND\""
            - "data.message is a non-empty string and no Inspector row is created as a side effect"

      - name: parcel_create_missing_apn_returns_400
        claim_type: Required Fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations.priority_30
          - entities.Parcel.fields.apn
        distinguishing_aspect: "apn is a required input with no default; omitting it returns 400 ERR_INVALID_REQUEST and creates nothing, while the same body with apn present succeeds."
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /fire-district/parcels"
              payload: { owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400 and ${err} == \"ERR_INVALID_REQUEST\""
            - "GET /fire-district/parcels returns total_count == 0: the rejected request created no row"
            - "Re-sending the same body with apn \"APN-1201\" returns 201 with risk_score 63.83"
            - "Omitting roof_class, vegetation_type, slope_pct, lot_area_sqft, hazard_zone or access_constraint each fail the same way, since none of them declares a default"

      - name: optional_inputs_fall_back_to_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.InspectionCycle.fields.notice_lead_days
          - entities.InspectionCycle.fields.invoice_due_days
          - entities.Contractor.fields.license_status
          - entities.Contractor.fields.max_daily_orders
          - entities.Inspector.fields.status
          - entities.Parcel.fields.structure_present
          - entities.Parcel.fields.owner_hardship_flag
        distinguishing_aspect: |
          Every field declared with a `default:` in §1.1 is materialised when its optional input
          is omitted: cycle notice_lead_days 10 / invoice_due_days 45 / epoch 0 / status PLANNING,
          contractor license_status ACTIVE / max_daily_orders 2, inspector status ACTIVE, parcel
          structure_present true / owner_hardship_flag false / exemption_flag false.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; a contractor, an inspector and a parcel are created with every optional input omitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/contractors"
              payload: { business_name: "Ridgeline Fuels LLC", hourly_rate_cents: 8600, mobilization_fee_cents: 32000, insurance_expiry_utc: "2027-06-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { c1: "$.data.id", c1_license: "$.data.license_status", c1_cap: "$.data.max_daily_orders" }
            - call: "POST /fire-district/inspectors"
              payload: { full_name: "Ivan Ruiz", certification_level: "ADVANCED" }
              as: ProgramAdmin
              captures: { insp1: "$.data.id", insp1_status: "$.data.status" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-1301", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { p1: "$.data.id", p1_structure: "$.data.structure_present", p1_hardship: "$.data.owner_hardship_flag" }
          trigger:
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2027 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id" }
          assert:
            - "${c1_license} == \"ACTIVE\" and ${c1_cap} == 2 (declared defaults, not nulls)"
            - "${insp1_status} == \"ACTIVE\""
            - "${p1_structure} == true, ${p1_hardship} == false and Parcel.${p1}.exemption_flag == false"
            - "InspectionCycle.${cyc}.notice_lead_days == 10 and invoice_due_days == 45"
            - "InspectionCycle.${cyc}.status == \"PLANNING\", epoch == 0, activated_at_utc == null, closed_at_utc == null"
            - "Contractor.${c1}.committed_crew_hours == 0 and Inspector.${insp1}.assigned_open_count == 0"

      - name: zone_evaluation_computed_fields_derived_not_supplied
        claim_type: Computed Fields
        excluded_because:
          difficulty_instance: zone_severity_major_at_exact_0_6000_deficit_ratio
          rationale: |
            That §1.8 boundary_precision_check instance already posts ZoneEvaluations and asserts the
            full computed tuple (required_clearance_ft, deficit_ft, deficit_ratio, deficiency_severity,
            points) against values the client never supplied, on the exact 0.6000 MAJOR boundary. A
            separate Computed Fields corner would restate the same claim with weaker inputs.

      - name: parcel_system_fields_stamped_by_server
        claim_type: System Fields
        grounds:
          - entities.Parcel
          - response_envelope
          - endpoints."POST /_clock/set_current_utc"
        distinguishing_aspect: |
          id, version, created_at and updated_at are stamped by the server from the logical clock and
          are not client inputs: a POST that tries to supply id and version has them ignored, the row
          comes back with version 1 and created_at == updated_at == the clock instant, and a later
          PATCH moves version and updated_at while created_at stays pinned.
        test_recipe:
          setup:
            - "Clock advanced to 2026-08-05T00:00:00Z before the parcel is created so the stamped timestamps are distinguishable from the 2026-08-01 default."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-1401", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { p1: "$.data.id", p1_v: "$.data.version" }
          assert:
            - "HTTP 201, ${p1} is a non-empty server-generated string and ${p1_v} == 1"
            - "Parcel.${p1}.created_at == \"2026-08-05T00:00:00Z\" and updated_at == \"2026-08-05T00:00:00Z\": both read the logical clock, not wall time"
            - "PATCH /fire-district/parcels/${p1} with expected_parcel_version ${p1_v} and slope_pct 50 at clock 2026-08-06T00:00:00Z returns version 2, updated_at \"2026-08-06T00:00:00Z\" and created_at still \"2026-08-05T00:00:00Z\""
            - "A POST body that additionally carries id \"client-chosen\" and version 99 is answered with a server-generated id != \"client-chosen\" and version == 1"

      - name: parcel_create_with_undeclared_roof_class_returns_400
        claim_type: Type Constraints
        grounds:
          - entities.Parcel.fields.roof_class
          - validations.priority_30
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Enum and numeric domains are enforced before any scoring happens: roof_class \"CLASS_D\" is
          not one of CLASS_A/CLASS_B/CLASS_C/NONE so the request is rejected 400 rather than scored
          with a missing ROOF_POINTS lookup, and a negative slope_pct is rejected the same way.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-1501", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", roof_class: "CLASS_D", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400 and ${err} == \"ERR_INVALID_REQUEST\" — not a 500 from an unmatched ROOF_POINTS key"
            - "GET /fire-district/parcels returns total_count == 0"
            - "The same body with slope_pct -5 and roof_class \"CLASS_B\" is also 400 ERR_INVALID_REQUEST"
            - "The same body with vegetation_type \"CHAPARRAL\" (undeclared) is also 400 ERR_INVALID_REQUEST"
            - "The same body with roof_class \"CLASS_B\" and slope_pct 30 returns 201 with risk_score 63.83"

      - name: zone_evaluation_is_immutable_and_cannot_be_rewritten
        claim_type: Immutability
        grounds:
          - entities.ZoneEvaluation
          - errors[ERR_ZONE_ALREADY_EVALUATED]
          - endpoints."POST /fire-district/inspections/{inspection_id}/zone-evaluations"
        distinguishing_aspect: |
          ZoneEvaluation is declared common_fields: false — it is an append-only measurement with no
          version and no updated_at, §1.5 exposes no PATCH or DELETE for it, and a second POST for the
          same zone on the same inspection is refused 409 ERR_ZONE_ALREADY_EVALUATED with the original
          measurement left byte-identical.
        test_recipe:
          setup:
            - "Active cycle, ACTIVE inspector, HIGH parcel (slope 30), NOTICED inspection, one ZONE_1 evaluation of 15.0 ft."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/inspectors"
              payload: { full_name: "Ivan Ruiz", certification_level: "ADVANCED", status: "ACTIVE" }
              as: ProgramAdmin
              captures: { insp1: "$.data.id" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-1601", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /fire-district/inspections"
              payload: { parcel_id: "${p1}", cycle_id: "${cyc}", inspector_id: "${insp1}", inspection_type: "INITIAL", scheduled_start_utc: "2026-08-20T15:00:00Z", scheduled_end_utc: "2026-08-20T17:00:00Z", access_arrangement: "OWNER_PRESENT" }
              as: ProgramAdmin
              captures: { ins1: "$.data.id" }
            - call: "POST /fire-district/inspections/${ins1}/notice"
              payload: { notice_method: "CERTIFIED_MAIL" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspections/${ins1}/zone-evaluations"
              payload: { zone: "ZONE_1", measured_clearance_ft: 15.0 }
              as: Inspector
              as_user_id: "${insp1}"
              captures: { ze1: "$.data.id", ze1_ratio: "$.data.deficit_ratio" }
          trigger:
            - call: "POST /fire-district/inspections/${ins1}/zone-evaluations"
              payload: { zone: "ZONE_1", measured_clearance_ft: 35.0 }
              as: Inspector
              as_user_id: "${insp1}"
              captures: { err: "$.data.error_id" }
          assert:
            - "${ze1_ratio} == 0.6000 and the stored ZoneEvaluation.${ze1} has required_clearance_ft == 37.5, deficit_ft == 22.5, deficiency_severity == \"MAJOR\", points == 60.00"
            - "HTTP 409 on the trigger and ${err} == \"ERR_ZONE_ALREADY_EVALUATED\""
            - "GET /fire-district/zone-evaluations/${ze1} still reports measured_clearance_ft == 15.0 and points == 60.00: the rejected rewrite changed nothing"
            - "GET /fire-district/zone-evaluations with inspection_id ${ins1} returns total_count == 1"
            - "The GET /fire-district/zone-evaluations/${ze1} body exposes no `version` and no `updated_at` field, and §1.5 declares no PATCH or DELETE route for zone-evaluations"

      - name: inspection_create_with_unknown_parcel_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Inspection.fields.parcel_id
          - validations.priority_20
          - errors[ERR_PARCEL_NOT_FOUND]
        distinguishing_aspect: |
          Body FKs are existence-checked in the declaration order cycle_id then parcel_id then
          inspector_id: with a real cycle, a bogus parcel_id and a real inspector, the answer is
          404 ERR_PARCEL_NOT_FOUND and no Inspection row is created.
        test_recipe:
          setup:
            - "Active cycle and an ACTIVE inspector exist; no parcel exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/inspectors"
              payload: { full_name: "Ivan Ruiz", certification_level: "ADVANCED", status: "ACTIVE" }
              as: ProgramAdmin
              captures: { insp1: "$.data.id" }
          trigger:
            - call: "POST /fire-district/inspections"
              payload: { parcel_id: "00000000-0000-0000-0000-0000000000aa", cycle_id: "${cyc}", inspector_id: "${insp1}", inspection_type: "INITIAL", scheduled_start_utc: "2026-08-20T15:00:00Z", scheduled_end_utc: "2026-08-20T17:00:00Z", access_arrangement: "OWNER_PRESENT" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 and ${err} == \"ERR_PARCEL_NOT_FOUND\" (not ERR_INSPECTOR_NOT_FOUND, not 400)"
            - "GET /fire-district/inspections with cycle_id ${cyc} returns total_count == 0"
            - "Inspector.${insp1}.assigned_open_count == 0: the failed create incremented no ledger"
            - "A bogus cycle_id with a real parcel_id yields ERR_CYCLE_NOT_FOUND, confirming cycle_id is checked before parcel_id"

      - name: enrollment_create_with_unknown_program_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.SupportEnrollment.fields.support_program_id
          - validations.priority_20
          - validations.priority_36
          - errors[ERR_PROGRAM_NOT_FOUND]
        distinguishing_aspect: |
          Existence (priority 20) outranks the optimistic-concurrency check (priority 36): an
          enrollment naming a non-existent support_program_id fails 404 ERR_PROGRAM_NOT_FOUND even
          though the request carries a version token that matched a real program, proving the FK is
          resolved before any version comparison.
        test_recipe:
          setup:
            - "An active cycle holds one real CHIPPER_DAY program; the client captures that program's version, then sends it against a bogus program id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-1701", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /fire-district/support-programs"
              payload: { cycle_id: "${cyc}", program_type: "CHIPPER_DAY", budget_total_cents: 500000, capacity_slots: 5, service_window_start_utc: "2026-08-01T00:00:00Z", service_window_end_utc: "2026-09-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { prog: "$.data.id", prog_v: "$.data.version" }
          trigger:
            - call: "POST /fire-district/support-enrollments"
              payload: { support_program_id: "00000000-0000-0000-0000-0000000000bb", parcel_id: "${p1}", expected_program_version: "${prog_v}" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "${prog_v} == 1 for the real program ${prog}"
            - "HTTP 404 and ${err} == \"ERR_PROGRAM_NOT_FOUND\" — not 412 ERR_STALE_PROGRAM_VERSION"
            - "SupportProgram.${prog}.reserved_slots == 0 and budget_remaining_cents == 500000: the untouched real program is unaffected"
            - "GET /fire-district/support-enrollments with support_program_id ${prog} returns total_count == 0"

  # ==========================================================================
  - section: state_machines
    instances:

      - name: cycle_activate_moves_planning_to_active_with_stamp
        claim_type: Valid Transition
        grounds:
          - state_machines.InspectionCycle.PLANNING_to_ACTIVE
          - endpoints."POST /fire-district/inspection-cycles/{cycle_id}/activate"
        distinguishing_aspect: "The declared PLANNING -> ACTIVE transition succeeds, stamps activated_at_utc from the logical clock, bumps version to 2 and leaves epoch at 0 (activation is not an advance)."
        test_recipe:
          setup:
            - "One PLANNING cycle for season 2026 at clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id", cyc_v0: "$.data.version" }
          trigger:
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
          assert:
            - "HTTP 200 and InspectionCycle.${cyc}.status == \"ACTIVE\""
            - "InspectionCycle.${cyc}.activated_at_utc == \"2026-08-01T00:00:00Z\" and closed_at_utc == null"
            - "${cyc_v0} == 1 and the post-trigger version == 2"
            - "InspectionCycle.${cyc}.epoch == 0: activation performs none of the eight advance steps"

      - name: cycle_activate_rejected_while_another_cycle_active
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.InspectionCycle.PLANNING_to_ACTIVE.preconditions
          - errors[ERR_CYCLE_ALREADY_ACTIVE]
          - validations.priority_40
        distinguishing_aspect: |
          The second precondition — no other InspectionCycle holds ACTIVE — is enforced globally, not
          per row: activating the 2027 cycle while the 2026 cycle is ACTIVE returns 409
          ERR_CYCLE_ALREADY_ACTIVE and leaves the 2027 cycle in PLANNING at version 1.
        test_recipe:
          setup:
            - "Season 2026 cycle activated; season 2027 cycle created and still PLANNING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026 }
              as: ProgramAdmin
              captures: { cyc26: "$.data.id" }
            - call: "POST /fire-district/inspection-cycles/${cyc26}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2027 }
              as: ProgramAdmin
              captures: { cyc27: "$.data.id", cyc27_v: "$.data.version" }
          trigger:
            - call: "POST /fire-district/inspection-cycles/${cyc27}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409 and ${err} == \"ERR_CYCLE_ALREADY_ACTIVE\""
            - "InspectionCycle.${cyc27}.status == \"PLANNING\", activated_at_utc == null and version == ${cyc27_v} (still 1)"
            - "InspectionCycle.${cyc26}.status == \"ACTIVE\" and its version is unchanged by the rejected call"
            - "After POST /fire-district/inspection-cycles/${cyc26}/close, activating ${cyc27} succeeds with status ACTIVE"

      - name: notice_service_stamps_method_and_sent_at
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Inspection.SCHEDULED_to_NOTICED.side_effects
          - endpoints."POST /fire-district/inspections/{inspection_id}/notice"
        distinguishing_aspect: |
          Serving the owner notice performs exactly the two declared side effects — notice_method and
          notice_sent_at_utc = logical clock — and touches nothing else: the inspection keeps its
          window, the inspector's assigned_open_count stays 1 (NOTICED is still a live assignment)
          and no ViolationNotice is created.
        test_recipe:
          setup:
            - "Active cycle, ACTIVE inspector, HIGH parcel, one SCHEDULED inspection for 2026-08-20."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/inspectors"
              payload: { full_name: "Ivan Ruiz", certification_level: "ADVANCED", status: "ACTIVE" }
              as: ProgramAdmin
              captures: { insp1: "$.data.id" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-2001", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /fire-district/inspections"
              payload: { parcel_id: "${p1}", cycle_id: "${cyc}", inspector_id: "${insp1}", inspection_type: "INITIAL", scheduled_start_utc: "2026-08-20T15:00:00Z", scheduled_end_utc: "2026-08-20T17:00:00Z", access_arrangement: "GATE_CODE" }
              as: ProgramAdmin
              captures: { ins1: "$.data.id", ins1_v: "$.data.version" }
          trigger:
            - call: "POST /fire-district/inspections/${ins1}/notice"
              payload: { notice_method: "CERTIFIED_MAIL" }
              as: ProgramAdmin
          assert:
            - "HTTP 200 with Inspection.${ins1}.status == \"NOTICED\", notice_method == \"CERTIFIED_MAIL\" and notice_sent_at_utc == \"2026-08-01T00:00:00Z\""
            - "${ins1_v} == 1 and the post-trigger Inspection version == 2"
            - "Inspection.${ins1}.scheduled_start_utc == \"2026-08-20T15:00:00Z\" and scheduled_end_utc == \"2026-08-20T17:00:00Z\": the window is untouched"
            - "Inspector.${insp1}.assigned_open_count == 1: NOTICED is still one of {SCHEDULED, NOTICED, ACCESS_DENIED}"
            - "GET /fire-district/violation-notices with parcel_id ${p1} returns total_count == 0 and Parcel.${p1}.compliance_status == \"PENDING_INSPECTION\""

      - name: inspection_complete_from_scheduled_returns_409
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Inspection
          - validations.priority_40
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          COMPLETED is reachable only from NOTICED. Completing a still-SCHEDULED inspection is refused
          with 409 ERR_INVALID_STATE by priority 40, which outranks the priority-56 zone-coverage check,
          so the answer is the state error even though no ZoneEvaluation exists either.
        test_recipe:
          setup:
            - "Active cycle, ACTIVE inspector, HIGH parcel, one SCHEDULED inspection that was never noticed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/inspectors"
              payload: { full_name: "Ivan Ruiz", certification_level: "ADVANCED", status: "ACTIVE" }
              as: ProgramAdmin
              captures: { insp1: "$.data.id" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-2101", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /fire-district/inspections"
              payload: { parcel_id: "${p1}", cycle_id: "${cyc}", inspector_id: "${insp1}", inspection_type: "INITIAL", scheduled_start_utc: "2026-08-20T15:00:00Z", scheduled_end_utc: "2026-08-20T17:00:00Z", access_arrangement: "OWNER_PRESENT" }
              as: ProgramAdmin
              captures: { ins1: "$.data.id" }
          trigger:
            - call: "POST /fire-district/inspections/${ins1}/complete"
              payload: { result: "PASS" }
              as: Inspector
              as_user_id: "${insp1}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409 and ${err} == \"ERR_INVALID_STATE\" — not ERR_ZONE_COVERAGE_INCOMPLETE (priority 40 precedes priority 56)"
            - "Inspection.${ins1}.status == \"SCHEDULED\", result == null and completed_at_utc == null"
            - "Parcel.${p1}.risk_score == 63.83 and risk_score_basis == \"INTAKE_PROVISIONAL\": no post-inspection rescore happened"
            - "POST /fire-district/inspections/${ins1}/access-denial by the same inspector is also 409 ERR_INVALID_STATE, since ACCESS_DENIED is reachable only from NOTICED"

      - name: created_rows_start_in_declared_initial_states
        claim_type: Initial State
        grounds:
          - state_machines.Inspection.initial_state
          - state_machines.InspectionCycle.initial_state
          - state_machines.ComplianceCertificate.initial_state
        distinguishing_aspect: |
          None of the three creation endpoints accepts a status input, and each row lands on its
          declared initial state: InspectionCycle PLANNING, ComplianceCertificate REQUESTED with every
          snapshot field null, Inspection SCHEDULED with result and notice_method null.
        test_recipe:
          setup:
            - "Active cycle, ACTIVE inspector, HIGH parcel and a fresh certificate request."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id", cyc_status0: "$.data.status" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/inspectors"
              payload: { full_name: "Ivan Ruiz", certification_level: "ADVANCED", status: "ACTIVE" }
              as: ProgramAdmin
              captures: { insp1: "$.data.id" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-2201", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /fire-district/parcels/${p1}/compliance-certificates"
              payload: { requester_kind: "REAL_ESTATE", transaction_reference: "ESC-4410" }
              as: TitleAgent
              captures: { cert1: "$.data.id", cert1_status: "$.data.status", cert1_snap: "$.data.snapshot_risk_class" }
          trigger:
            - call: "POST /fire-district/inspections"
              payload: { parcel_id: "${p1}", cycle_id: "${cyc}", inspector_id: "${insp1}", inspection_type: "INITIAL", scheduled_start_utc: "2026-08-20T15:00:00Z", scheduled_end_utc: "2026-08-20T17:00:00Z", access_arrangement: "OWNER_PRESENT" }
              as: ProgramAdmin
              captures: { ins1: "$.data.id", ins1_status: "$.data.status" }
          assert:
            - "${cyc_status0} == \"PLANNING\": the cycle create endpoint declares no status input"
            - "${cert1_status} == \"REQUESTED\", ${cert1_snap} == null and ComplianceCertificate.${cert1}.issued_at_utc == null and expires_at_utc == null"
            - "${ins1_status} == \"SCHEDULED\" with result == null, notice_method == null, notice_sent_at_utc == null and access_denial_count == 0"
            - "Inspection.${ins1}.measured_veg_points == null, hardening_credit_points == null and max_deficiency_severity == null"

      - name: cancelled_inspection_cannot_be_rescheduled
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Inspection.terminal_states
          - errors[ERR_INVALID_STATE]
          - endpoints."POST /fire-district/inspections/{inspection_id}/reschedule"
        distinguishing_aspect: |
          CANCELLED is terminal: reschedule (declared only from ACCESS_DENIED), notice and complete are
          all refused 409 ERR_INVALID_STATE afterwards, and the cancel already released the inspector's
          window so assigned_open_count is 0.
        test_recipe:
          setup:
            - "Active cycle, ACTIVE inspector, HIGH parcel, one inspection cancelled from SCHEDULED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/inspectors"
              payload: { full_name: "Ivan Ruiz", certification_level: "ADVANCED", status: "ACTIVE" }
              as: ProgramAdmin
              captures: { insp1: "$.data.id" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-2301", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /fire-district/inspections"
              payload: { parcel_id: "${p1}", cycle_id: "${cyc}", inspector_id: "${insp1}", inspection_type: "INITIAL", scheduled_start_utc: "2026-08-20T15:00:00Z", scheduled_end_utc: "2026-08-20T17:00:00Z", access_arrangement: "OWNER_PRESENT" }
              as: ProgramAdmin
              captures: { ins1: "$.data.id" }
            - call: "POST /fire-district/inspections/${ins1}/cancel"
              payload: { reason: "Owner sold the parcel" }
              as: ProgramAdmin
              captures: { ins1_status: "$.data.status" }
          trigger:
            - call: "POST /fire-district/inspections/${ins1}/reschedule"
              payload: { scheduled_start_utc: "2026-08-25T15:00:00Z", scheduled_end_utc: "2026-08-25T17:00:00Z" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "${ins1_status} == \"CANCELLED\" after the setup cancel"
            - "HTTP 409 on the trigger and ${err} == \"ERR_INVALID_STATE\""
            - "Inspection.${ins1}.scheduled_start_utc == \"2026-08-20T15:00:00Z\": the rejected reschedule moved nothing"
            - "Inspector.${insp1}.assigned_open_count == 0: the cancel released the window and the failed reschedule did not re-take it"
            - "POST /fire-district/inspections/${ins1}/notice and POST /fire-district/inspections/${ins1}/complete are each 409 ERR_INVALID_STATE"

      - name: second_notice_service_rejected_not_reapplied
        claim_type: Idempotency
        grounds:
          - state_machines.Inspection.SCHEDULED_to_NOTICED.preconditions
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Notice service is a one-shot transition, not an idempotent upsert: the repeat call is refused
          409 ERR_INVALID_STATE with notice_method, notice_sent_at_utc and version all frozen at the
          values the first call wrote, even though the second call names a different method.
        test_recipe:
          setup:
            - "Active cycle, ACTIVE inspector, HIGH parcel, one inspection already NOTICED by CERTIFIED_MAIL at clock 2026-08-01T00:00:00Z; the clock then moves to 2026-08-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/inspectors"
              payload: { full_name: "Ivan Ruiz", certification_level: "ADVANCED", status: "ACTIVE" }
              as: ProgramAdmin
              captures: { insp1: "$.data.id" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-2401", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /fire-district/inspections"
              payload: { parcel_id: "${p1}", cycle_id: "${cyc}", inspector_id: "${insp1}", inspection_type: "INITIAL", scheduled_start_utc: "2026-08-20T15:00:00Z", scheduled_end_utc: "2026-08-20T17:00:00Z", access_arrangement: "OWNER_PRESENT" }
              as: ProgramAdmin
              captures: { ins1: "$.data.id" }
            - call: "POST /fire-district/inspections/${ins1}/notice"
              payload: { notice_method: "CERTIFIED_MAIL" }
              as: ProgramAdmin
              captures: { ins1_v1: "$.data.version" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /fire-district/inspections/${ins1}/notice"
              payload: { notice_method: "IN_PERSON" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "${ins1_v1} == 2 after the first notice"
            - "HTTP 409 on the repeat and ${err} == \"ERR_INVALID_STATE\""
            - "Inspection.${ins1}.notice_method == \"CERTIFIED_MAIL\" (not IN_PERSON) and notice_sent_at_utc == \"2026-08-01T00:00:00Z\" (not the new clock)"
            - "Inspection.${ins1}.version == ${ins1_v1}: the refused call performed no write"

      - name: access_denial_reschedule_cycle_returns_to_noticed
        claim_type: cyclic transitions
        excluded_because:
          difficulty_instance: inspection_denial_reschedule_loop_terminates_in_abandoned
          rationale: |
            That §1.8 non_linear_state_machine instance already walks NOTICED -> ACCESS_DENIED ->
            SCHEDULED -> NOTICED and proves the loop is bounded by MAX_ACCESS_DENIALS, ending in
            ABANDONED with a CRITICAL notice. A separate cyclic-shape corner would repeat the same walk.

      - name: enrollment_completion_branches_by_program_type
        claim_type: branching transitions
        excluded_because:
          difficulty_instance: enrollment_completion_forks_on_program_type
          rationale: |
            That §1.8 instance already fires the single /complete endpoint on three enrollments and
            shows APPROVED forking to COMPLETED, REIMBURSED and NO_SHOW according to program_type and
            the attended flag, including the divergent budget effects of each branch.

      - name: certificate_issue_guarded_by_parcel_posture
        claim_type: guarded transitions
        excluded_because:
          difficulty_instance: certificate_issuance_gated_on_no_open_violation_notice
          rationale: |
            That §1.8 cross_entity_state_dependency instance already exercises the REQUESTED -> ISSUED
            guard from both sides — refused with ERR_OPEN_VIOLATION_EXISTS while a notice is open, and
            permitted once the notice leaves the open set — with the parcel's own state unchanged.

      - name: fail_completion_cascades_down_to_community
        claim_type: Cascade down
        excluded_because:
          difficulty_instance: inspection_fail_cascade_five_links_to_community_rate
          rationale: |
            That §1.8 transitive_cascade instance already follows all six declared links of the FAIL
            completion in one request — measurements, parcel rescore, notice creation, certificate
            revocation, community rate recompute and community lapse — with pinned values at each link.

      - name: enrollment_admission_bubbles_slot_and_budget_to_program
        claim_type: Bubble up
        grounds:
          - state_machines.SupportEnrollment.REQUESTED_to_APPROVED.side_effects
          - calculations.cost_share_award
          - entities.SupportProgram.fields.budget_remaining_cents
        distinguishing_aspect: |
          Creating one child enrollment rewrites the parent SupportProgram's aggregates in the same
          request: an award of 120000 debits budget_remaining_cents from 500000 to 380000, lifts
          reserved_slots from 0 to 1 and bumps SupportProgram.version, satisfying the budget
          conservation invariant budget_remaining == budget_total - sum(reserved_amount_cents).
        test_recipe:
          setup:
            - "Active cycle; a COST_SHARE_GRANT program with budget 500000 and 2 slots, window 2026-08-01..2026-09-30; one HIGH parcel with owner_hardship_flag false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-2501", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED", owner_hardship_flag: false }
              as: ProgramAdmin
              captures: { p1: "$.data.id", p1_class: "$.data.risk_class" }
            - call: "POST /fire-district/support-programs"
              payload: { cycle_id: "${cyc}", program_type: "COST_SHARE_GRANT", budget_total_cents: 500000, capacity_slots: 2, service_window_start_utc: "2026-08-01T00:00:00Z", service_window_end_utc: "2026-09-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { prog: "$.data.id", prog_v: "$.data.version", prog_budget0: "$.data.budget_remaining_cents", prog_slots0: "$.data.reserved_slots" }
          trigger:
            - call: "POST /fire-district/support-enrollments"
              payload: { support_program_id: "${prog}", parcel_id: "${p1}", vendor_invoice_cents: 200000, expected_program_version: "${prog_v}" }
              as: ProgramAdmin
              captures: { en1: "$.data.id" }
          assert:
            - "${p1_class} == \"HIGH\", ${prog_budget0} == 500000, ${prog_slots0} == 0 and ${prog_v} == 1 before the trigger"
            - "SupportEnrollment.${en1}.status == \"APPROVED\" with award_before_bonus_cents == 120000 (min(200000, 250000) * 0.60), bonus_pct == 0.05, hardship_bonus_cents == 0 and award_cents == 120000"
            - "SupportEnrollment.${en1}.reserved_amount_cents == 120000 and waitlist_position == null"
