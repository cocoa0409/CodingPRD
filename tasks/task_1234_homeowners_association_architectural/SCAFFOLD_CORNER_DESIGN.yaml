          trigger:
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/_sweeps/daily", as: Manager }
            - { call: "GET /arc/violations/${vio}/fines", as: Manager, captures: { acc_d3: "$.data[0].accrued_cents" } }
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/_sweeps/daily", as: Manager }
            - { call: "GET /arc/violations/${vio}/fines", as: Manager, captures: { acc_d4: "$.data[0].accrued_cents" } }
          assert:
            - "after day 3 (2026-05-04): accrued_cents == 13000 (10000 + 3 x 1000 base rate)"
            - "after day 4 (2026-05-05): accrued_cents == 15000 (+ 2000 escalated rate; day_index 4 > grace 3)"

      - name: balance_aggregation_excludes_settled_fines
        claim_type: input_set_filtering
        grounds: [calculations.property_outstanding_balance, entities.Property.fields.outstanding_fine_balance_cents]
        distinguishing_aspect: "Two violations on one property (base 10000 each) give balance 20000; settling one fine in full drops the balance to exactly the other fine's outstanding (10000) — SETTLED fines contribute 0."
        test_recipe:
          setup: ["Association SIMPLE base 10000; two violations on the same property at 2026-05-01"]
          setup_api_calls:
            - { call: "POST /arc/associations", payload: { name: "Agg HOA", statutory_response_days: 30, counting_mode: CALENDAR, fine_mode: SIMPLE_DAILY, base_fine_cents: 10000, daily_fine_cents: 1000, lien_threshold_cents: 1000000, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager, captures: { assoc: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Ann A", email: "ann.a@x.com" }, as: Manager, captures: { owner_a: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/properties", payload: { lot_number: "A-2", address: "2 Aggregate Ave", primary_owner_id: "${owner_a}" }, as: Manager, captures: { prop: $.data.id } }
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/properties/${prop}/violations", payload: { kind: UNAPPROVED_WORK, description: "shed" }, as: Manager, captures: { vio1: $.data.id } }
            - { call: "POST /arc/properties/${prop}/violations", payload: { kind: CONDITION_BREACH, description: "wrong trim color" }, as: Manager, captures: { vio2: $.data.id } }
            - { call: "GET /arc/violations/${vio1}/fines", as: Manager, captures: { fine1: "$.data[0].id" } }
          trigger:
            - { call: "GET /arc/properties/${prop}", as: Manager, captures: { bal_before: $.data.outstanding_fine_balance_cents } }
            - { call: "POST /arc/fines/${fine1}/settle", payload: { amount_cents: 10000 }, as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "GET /arc/properties/${prop}", as: Manager, captures: { bal_after: $.data.outstanding_fine_balance_cents, posture_after: $.data.compliance_posture } }
          assert:
            - "balance before settle == 20000 (two fines x 10000)"
            - "balance after settling fine1 == 10000 (exactly fine2's outstanding); posture remains FINES_OUTSTANDING"

      - name: tally_abstain_excluded_from_ratio
        claim_type: correct_result
        grounds: [calculations.quorum_decision_tally, entities.CommitteeVote.fields.ballot]
        distinguishing_aspect: "With ballots A,A,D,ABSTAIN (4 cast, quorum 3 met), the approval ratio is computed over non-abstain ballots only: 2/3 >= 2/3 approves. Counting the abstain in the denominator (2/4 = 0.5) would wrongly deny."
