          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "Two sequential transfer creates: the first succeeds and bumps Vehicle.version; the second (same customer, same store) carrying the pre-first version fails 412 ERR_STALE_VERSION even though the hold was released by cancelling the first request in between."
        test_recipe:
          setup: ["Clock default. V_A RETAIL_LISTED at PHX. CUST1 creates TR1 with version v0, cancels it (hold released, version advanced again), then re-creates with the stale v0."]
          setup_api_calls:
