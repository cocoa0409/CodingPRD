scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: ledger_chronological_vs_submission_order_on_claim
        grounds:
          - calculations.policy_year_ledger
          - state_machines.Claim.IN_REVIEW_to_APPROVED
          - entities.Claim.fields.reimbursed_cents
        distinguishing_aspect: |
          On the Claim domain: approving a Mar-incident claim then a Feb-incident claim must
          re-attribute the deductible by incident_date — the Feb claim reimburses 4000 (chronological),
          NOT 20000 (submission-order); the Mar claim reimburses 16000, NOT 0.
        test_recipe:
          setup:
            - "Account with one ACTIVE policy: deductible 25000c, rate 8000bps, cap 500000c, waiting 14d, effective 2026-01-01."
            - "Clock at 2026-06-01 so PolicyYear 0 [2026-01-01,2026-12-31) is OPEN."
            - "Condition COVERED (diagnosed 2026-02-15, after coverage start)."
            - "Claim X: ILLNESS, incident 2026-03-01, one line 20000c, invoice ACCEPTED, IN_REVIEW; approved first."
            - "Claim Y: ILLNESS, incident 2026-02-01, one line 30000c, invoice ACCEPTED, IN_REVIEW; approved second."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /accounts"
              payload: { email: "a1@x.com", full_name: "A One" }
              as: Underwriter
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/policies"
              payload: { pet_name: "Rex", species: "DOG", base_premium_cents: 4500, annual_deductible_cents: 25000, reimbursement_rate_bps: 8000, annual_cap_cents: 500000, waiting_period_days: 14, wellness_rider: false, effective_date: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /accounts/${acct}/policies/${pol}/activate"
              payload: {}
              as: Underwriter
            - call: "GET /accounts/${acct}/policies/${pol}/policy-years"
              payload: {}
              as: Underwriter
              captures: { py: "$.data[0].id "}
            - call: "POST /accounts/${acct}/policies/${pol}/conditions"
              payload: { name: "ear infection", first_diagnosed_date: "2026-02-15T00:00:00Z" }
              as: PolicyHolder
              as_user_id: "${acct}"
              captures: { cond: $.data.id }
            - call: "POST /accounts/${acct}/policies/${pol}/claims"
              payload: { claim_type: "ILLNESS", incident_date: "2026-03-01T00:00:00Z", condition_id: "${cond}" }
              as: PolicyHolder
              as_user_id: "${acct}"
              captures: { cx: $.data.id }
            - call: "POST /claims/${cx}/lines"
              payload: { description: "meds", billed_amount_cents: 20000 }
              as: PolicyHolder
              as_user_id: "${acct}"
            - call: "POST /claims/${cx}/invoices"
              payload: { file_uri: "s3://inv/x" }
              as: PolicyHolder
              as_user_id: "${acct}"
              captures: { ix: $.data.id }
            - call: "POST /claims/${cx}/invoices/${ix}/run-ocr"
              payload: { ocr_total_cents: 20000 }
              as: ClaimsAdjuster
            - call: "POST /claims/${cx}/invoices/${ix}/accept"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /claims/${cx}/submit"
              payload: {}
              as: PolicyHolder
              as_user_id: "${acct}"
            - call: "POST /claims/${cx}/begin-review"
              payload: {}
              as: ClaimsAdjuster
            - call: "GET /accounts/${acct}/policies/${pol}/policy-years"
              payload: {}
              as: ClaimsAdjuster
              captures: { pyv1: "$.data[0].version "}
            - call: "POST /claims/${cx}/adjudicate"
              payload: { decision: "APPROVE", expected_policy_year_version: "${pyv1}" }
              as: ClaimsAdjuster
            - call: "POST /accounts/${acct}/policies/${pol}/claims"
              payload: { claim_type: "ILLNESS", incident_date: "2026-02-01T00:00:00Z", condition_id: "${cond}" }
              as: PolicyHolder
              as_user_id: "${acct}"
              captures: { cy: $.data.id }
            - call: "POST /claims/${cy}/lines"
              payload: { description: "surgery", billed_amount_cents: 30000 }
              as: PolicyHolder
              as_user_id: "${acct}"
            - call: "POST /claims/${cy}/invoices"
              payload: { file_uri: "s3://inv/y" }
              as: PolicyHolder
              as_user_id: "${acct}"
              captures: { iy: $.data.id }
            - call: "POST /claims/${cy}/invoices/${iy}/run-ocr"
              payload: { ocr_total_cents: 30000 }
              as: ClaimsAdjuster
            - call: "POST /claims/${cy}/invoices/${iy}/accept"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /claims/${cy}/submit"
              payload: {}
              as: PolicyHolder
              as_user_id: "${acct}"
            - call: "POST /claims/${cy}/begin-review"
              payload: {}
              as: ClaimsAdjuster
            - call: "GET /accounts/${acct}/policies/${pol}/policy-years"
              payload: {}
              as: ClaimsAdjuster
              captures: { pyv2: "$.data[0].version "}
          trigger:
            - call: "POST /claims/${cy}/adjudicate"
              payload: { decision: "APPROVE", expected_policy_year_version: "${pyv2}" }
              as: ClaimsAdjuster
            - call: "GET /claims/${cx}"
              payload: {}
              as: ClaimsAdjuster
              captures: { cx_reimb: $.data.reimbursed_cents }
          assert:
            - "Claim.${cy}.deductible_applied_cents == 25000"
            - "Claim.${cy}.reimbursed_cents == 4000"
            - "Claim.${cx}.deductible_applied_cents == 0"
            - "Claim.${cx}.reimbursed_cents == 16000"

      - name: premium_discount_base_vs_full_line_on_account
        grounds:
          - calculations.account_monthly_premium
          - state_machines.Policy.PENDING_PAYMENT_to_ACTIVE
          - entities.Account.fields.monthly_premium_cents
        distinguishing_aspect: |
          On the Account domain: with two ACTIVE policies (10% multi-pet discount), the rider premium
          must escape the discount — monthly_premium_cents == 8970, NOT 8820 (which would discount the rider too).
        test_recipe:
          setup:
            - "Account with two ACTIVE policies: P1 base 4500c with wellness rider, P2 base 3800c no rider."
            - "active_policy_count == 2 so multi_pet_discount_applied == true."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "a2@x.com", full_name: "A Two" }
              as: Underwriter
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/policies"
              payload: { pet_name: "Rex", species: "DOG", base_premium_cents: 4500, annual_deductible_cents: 25000, reimbursement_rate_bps: 8000, annual_cap_cents: 500000, wellness_rider: true, effective_date: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { p1: $.data.id }
            - call: "POST /accounts/${acct}/policies"
              payload: { pet_name: "Mia", species: "CAT", base_premium_cents: 3800, annual_deductible_cents: 25000, reimbursement_rate_bps: 8000, annual_cap_cents: 500000, wellness_rider: false, effective_date: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { p2: $.data.id }
            - call: "POST /accounts/${acct}/policies/${p1}/activate"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /accounts/${acct}/policies/${p2}/activate"
              payload: {}
              as: Underwriter
            - call: "GET /accounts/${acct}"
              payload: {}
              as: Underwriter
              captures: { prem: $.data.monthly_premium_cents }
          assert:
            - "Account.${acct}.active_policy_count == 2"
            - "Account.${acct}.multi_pet_discount_applied == true"
            - "Account.${acct}.monthly_premium_cents == 8970"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: reimbursement_min_max_nested_deductible_cap
        grounds:
          - calculations.policy_year_ledger
          - entities.Claim.fields.reimbursed_cents
        distinguishing_aspect: |
          Mode (a): nested min/max over 4 inputs (eligible, remaining deductible, rate, remaining cap).
          A single 700000c claim after deductible is met reimburses min(560000, cap-headroom 500000) == 500000.
        test_recipe:
          setup:
            - "Policy: deductible 25000c, rate 8000bps, cap 500000c, waiting 14d, effective 2026-01-01, ACTIVE, year OPEN."
            - "Two ILLNESS claims: C1 incident 2026-02-01 eligible 25000c (exactly meets deductible), C2 incident 2026-03-01 eligible 700000c."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /accounts"
              payload: { email: "a3@x.com", full_name: "A Three" }
              as: Underwriter
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/policies"
              payload: { pet_name: "Rex", species: "DOG", base_premium_cents: 4500, annual_deductible_cents: 25000, reimbursement_rate_bps: 8000, annual_cap_cents: 500000, waiting_period_days: 14, wellness_rider: false, effective_date: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /accounts/${acct}/policies/${pol}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /accounts/${acct}/policies/${pol}/conditions"
              payload: { name: "fracture", first_diagnosed_date: "2026-01-20T00:00:00Z" }
              as: Underwriter
              captures: { cond: $.data.id }
            - call: "POST /accounts/${acct}/policies/${pol}/claims"
              payload: { claim_type: "ILLNESS", incident_date: "2026-02-01T00:00:00Z", condition_id: "${cond}" }
              as: PolicyHolder
              as_user_id: "${acct}"
              captures: { c1: $.data.id }
            - call: "POST /claims/${c1}/lines"
              payload: { description: "exam", billed_amount_cents: 25000 }
              as: PolicyHolder
              as_user_id: "${acct}"
            - call: "POST /claims/${c1}/invoices"
              payload: { file_uri: "s3://inv/c1" }
              as: PolicyHolder
              as_user_id: "${acct}"
              captures: { i1: $.data.id }
            - call: "POST /claims/${c1}/invoices/${i1}/run-ocr"
              payload: { ocr_total_cents: 25000 }
              as: ClaimsAdjuster
            - call: "POST /claims/${c1}/invoices/${i1}/accept"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /claims/${c1}/submit"
              payload: {}
              as: PolicyHolder
              as_user_id: "${acct}"
            - call: "POST /claims/${c1}/begin-review"
              payload: {}
              as: ClaimsAdjuster
            - call: "GET /accounts/${acct}/policies/${pol}/policy-years"
              payload: {}
              as: ClaimsAdjuster
              captures: { pyv1: "$.data[0].version "}
            - call: "POST /claims/${c1}/adjudicate"
              payload: { decision: "APPROVE", expected_policy_year_version: "${pyv1}" }
              as: ClaimsAdjuster
            - call: "POST /accounts/${acct}/policies/${pol}/claims"
              payload: { claim_type: "ILLNESS", incident_date: "2026-03-01T00:00:00Z", condition_id: "${cond}" }
              as: PolicyHolder
              as_user_id: "${acct}"
              captures: { c2: $.data.id }
            - call: "POST /claims/${c2}/lines"
              payload: { description: "ortho surgery", billed_amount_cents: 700000 }
              as: PolicyHolder
              as_user_id: "${acct}"
            - call: "POST /claims/${c2}/invoices"
              payload: { file_uri: "s3://inv/c2" }
              as: PolicyHolder
              as_user_id: "${acct}"
              captures: { i2: $.data.id }
            - call: "POST /claims/${c2}/invoices/${i2}/run-ocr"
              payload: { ocr_total_cents: 700000 }
              as: ClaimsAdjuster
            - call: "POST /claims/${c2}/invoices/${i2}/accept"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /claims/${c2}/submit"
              payload: {}
              as: PolicyHolder
              as_user_id: "${acct}"
            - call: "POST /claims/${c2}/begin-review"
              payload: {}
              as: ClaimsAdjuster
            - call: "GET /accounts/${acct}/policies/${pol}/policy-years"
              payload: {}
              as: ClaimsAdjuster
              captures: { pyv2: "$.data[0].version "}
          trigger:
            - call: "POST /claims/${c2}/adjudicate"
              payload: { decision: "APPROVE", expected_policy_year_version: "${pyv2}" }
              as: ClaimsAdjuster
          assert:
            - "Claim.${c2}.deductible_applied_cents == 0"
            - "Claim.${c2}.reimbursed_cents == 500000"

      - name: premium_round_per_policy_then_sum_order
        grounds:
          - calculations.account_monthly_premium
          - entities.Account.fields.monthly_premium_cents
        distinguishing_aspect: |
          Mode (b): rounding order is pinned — discount+round_half_up PER policy base, THEN add the
          undiscounted rider, THEN sum. Two policies base 4500 (rider) + 3800 -> 4050+1500 + 3420 == 8970.
        test_recipe:
          setup:
            - "Account with two ACTIVE policies: P1 base 4500c rider, P2 base 3800c no rider; multi-pet discount active."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "a4@x.com", full_name: "A Four" }
              as: Underwriter
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/policies"
              payload: { pet_name: "Rex", species: "DOG", base_premium_cents: 4500, annual_deductible_cents: 25000, reimbursement_rate_bps: 8000, annual_cap_cents: 500000, wellness_rider: true, effective_date: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { p1: $.data.id }
            - call: "POST /accounts/${acct}/policies"
              payload: { pet_name: "Mia", species: "CAT", base_premium_cents: 3800, annual_deductible_cents: 25000, reimbursement_rate_bps: 8000, annual_cap_cents: 500000, wellness_rider: false, effective_date: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { p2: $.data.id }
            - call: "POST /accounts/${acct}/policies/${p1}/activate"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /accounts/${acct}/policies/${p2}/activate"
              payload: {}
              as: Underwriter
            - call: "GET /accounts/${acct}"
              payload: {}
              as: Underwriter
              captures: { prem: $.data.monthly_premium_cents }
          assert:
            - "Account.${acct}.monthly_premium_cents == 8970"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: invoice_branching_review_needed_then_reject
        grounds:
          - state_machines.InvoiceDocument.PENDING_OCR_to_OCR_DONE
          - state_machines.InvoiceDocument.REVIEW_NEEDED_to_REJECTED
          - entities.InvoiceDocument.fields.ocr_status
        distinguishing_aspect: |
          Branching fork-join on InvoiceDocument: high OCR mismatch (>500bps) forks to REVIEW_NEEDED
          (a different branch than OCR_DONE), from which REJECT is reachable but ACCEPT-from-OCR_DONE is not.
        test_recipe:
          setup:
            - "DRAFT claim with submitted_amount implied 40000c (one 40000c line) and an invoice PENDING_OCR."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "a5@x.com", full_name: "A Five" }
              as: Underwriter
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/policies"
              payload: { pet_name: "Rex", species: "DOG", base_premium_cents: 4500, annual_deductible_cents: 25000, reimbursement_rate_bps: 8000, annual_cap_cents: 500000, wellness_rider: false, effective_date: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /accounts/${acct}/policies/${pol}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /accounts/${acct}/policies/${pol}/conditions"
              payload: { name: "skin", first_diagnosed_date: "2026-02-01T00:00:00Z" }
              as: Underwriter
              captures: { cond: $.data.id }
            - call: "POST /accounts/${acct}/policies/${pol}/claims"
              payload: { claim_type: "ILLNESS", incident_date: "2026-03-01T00:00:00Z", condition_id: "${cond}" }
              as: PolicyHolder
              as_user_id: "${acct}"
              captures: { cl: $.data.id }
            - call: "POST /claims/${cl}/lines"
              payload: { description: "visit", billed_amount_cents: 40000 }
              as: PolicyHolder
              as_user_id: "${acct}"
            - call: "POST /claims/${cl}/invoices"
              payload: { file_uri: "s3://inv/m" }
              as: PolicyHolder
              as_user_id: "${acct}"
              captures: { inv: $.data.id }
            - call: "POST /claims/${cl}/invoices/${inv}/run-ocr"
              payload: { ocr_total_cents: 45000 }
              as: ClaimsAdjuster
              captures: { st: $.data.ocr_status, mm: $.data.ocr_mismatch_bps }
          trigger:
            - call: "POST /claims/${cl}/invoices/${inv}/reject"
              payload: {}
              as: ClaimsAdjuster
              captures: { final: $.data.ocr_status }
          assert:
            - "InvoiceDocument.${inv}.ocr_mismatch_bps == 1250"
            - "InvoiceDocument.${inv}.ocr_status was REVIEW_NEEDED before reject"
            - "InvoiceDocument.${inv}.ocr_status == REJECTED after reject"

      - name: claim_approve_vs_deny_divergent_branches
        grounds:
          - state_machines.Claim.IN_REVIEW_to_APPROVED
          - state_machines.Claim.IN_REVIEW_to_DENIED
          - entities.Claim.fields.reimbursed_cents
        distinguishing_aspect: |
          Branching on Claim: from IN_REVIEW the APPROVE branch books reimbursement and bumps PolicyYear,
          while the DENY branch zeroes payable fields and leaves PolicyYear.reimbursed_cents unchanged.
        test_recipe:
          setup:
            - "Two sibling IN_REVIEW ILLNESS claims under one OPEN policy year; deductible already met by neither yet."
            - "Claim D eligible 40000c will be DENIED; Claim A eligible 40000c will be APPROVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /accounts"
              payload: { email: "a6@x.com", full_name: "A Six" }
              as: Underwriter
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/policies"
              payload: { pet_name: "Rex", species: "DOG", base_premium_cents: 4500, annual_deductible_cents: 25000, reimbursement_rate_bps: 8000, annual_cap_cents: 500000, waiting_period_days: 14, wellness_rider: false, effective_date: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /accounts/${acct}/policies/${pol}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /accounts/${acct}/policies/${pol}/conditions"
              payload: { name: "gi", first_diagnosed_date: "2026-02-01T00:00:00Z" }
              as: Underwriter
              captures: { cond: $.data.id }
            - call: "POST /accounts/${acct}/policies/${pol}/claims"
              payload: { claim_type: "ILLNESS", incident_date: "2026-03-01T00:00:00Z", condition_id: "${cond}" }
              as: PolicyHolder
              as_user_id: "${acct}"
              captures: { cd: $.data.id }
            - call: "POST /claims/${cd}/lines"
              payload: { description: "x", billed_amount_cents: 40000 }
              as: PolicyHolder
              as_user_id: "${acct}"
            - call: "POST /claims/${cd}/invoices"
              payload: { file_uri: "s3://inv/cd" }
              as: PolicyHolder
              as_user_id: "${acct}"
              captures: { id: $.data.id }
            - call: "POST /claims/${cd}/invoices/${id}/run-ocr"
              payload: { ocr_total_cents: 40000 }
              as: ClaimsAdjuster
            - call: "POST /claims/${cd}/invoices/${id}/accept"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /claims/${cd}/submit"
              payload: {}
              as: PolicyHolder
              as_user_id: "${acct}"
            - call: "POST /claims/${cd}/begin-review"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "POST /claims/${cd}/adjudicate"
              payload: { decision: "DENY", reason: "ERR_PRE_EXISTING_EXCLUDED" }
              as: ClaimsAdjuster
            - call: "GET /accounts/${acct}/policies/${pol}/policy-years"
              payload: {}
              as: ClaimsAdjuster
              captures: { reimbursed: "$.data[0].reimbursed_cents "}
          assert:
            - "Claim.${cd}.status == DENIED"
            - "Claim.${cd}.reimbursed_cents == 0"
            - "PolicyYear.${pol}.year0.reimbursed_cents == 0"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: activate_policy_year_account_reprice_depth3
        grounds:
          - state_machines.Policy.PENDING_PAYMENT_to_ACTIVE
          - entities.Account.fields.monthly_premium_cents
          - entities.PolicyYear.fields.status
        distinguishing_aspect: |
          Depth-3 cascade from activate: activate P2 (A) -> P2 becomes ACTIVE and creates PolicyYear (B) ->
          P2 ACTIVE flips active_policy_count to 2 which re-prices Account.monthly_premium_cents (C). Each link
          is caused by the prior link, not by activate directly.
        test_recipe:
          setup:
            - "Account with one ACTIVE policy P1 (base 4500 rider) and one PENDING_PAYMENT policy P2 (base 3800 no rider)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "a7@x.com", full_name: "A Seven" }
              as: Underwriter
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/policies"
              payload: { pet_name: "Rex", species: "DOG", base_premium_cents: 4500, annual_deductible_cents: 25000, reimbursement_rate_bps: 8000, annual_cap_cents: 500000, wellness_rider: true, effective_date: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { p1: $.data.id }
            - call: "POST /accounts/${acct}/policies/${p1}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /accounts/${acct}/policies"
              payload: { pet_name: "Mia", species: "CAT", base_premium_cents: 3800, annual_deductible_cents: 25000, reimbursement_rate_bps: 8000, annual_cap_cents: 500000, wellness_rider: false, effective_date: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { p2: $.data.id }
          trigger:
            - call: "POST /accounts/${acct}/policies/${p2}/activate"
              payload: {}
              as: Underwriter
            - call: "GET /accounts/${acct}/policies/${p2}/policy-years"
              payload: {}
              as: Underwriter
              captures: { p2y: "$.data[0].id "}
            - call: "GET /accounts/${acct}"
              payload: {}
              as: Underwriter
              captures: { prem: $.data.monthly_premium_cents }
          assert:
            - "Policy.${p2}.status == ACTIVE"
            - "PolicyYear count under ${p2} == 1 (year_index 0 created)"
            - "Account.${acct}.active_policy_count == 2"
            - "Account.${acct}.monthly_premium_cents == 8970"

      - name: lapse_policy_account_reprice_depth2
        grounds:
          - state_machines.Policy.ACTIVE_to_LAPSED
          - entities.Account.fields.monthly_premium_cents
        distinguishing_aspect: |
          Depth-2 cascade from lapse (a different trigger than activate): lapse P2 (A) -> active_policy_count
          drops to 1, removing the multi-pet discount, re-pricing P1 upward so monthly_premium_cents == 6000 (B).
