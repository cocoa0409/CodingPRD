              payload: { decision: "APPROVE" }
              as: PeoAdmin
            - call: "POST /benefit-plans"
              payload: { carrier_name: "BlueRock", plan_type: "DENTAL", plan_year: 2026, composite_rate_cents: 45000, age_band_base_rate_cents: 40000, pool_capacity: 2, participation_minimum_count: 2, rating_method: "COMPOSITE", employer_contribution_pct: 0.60 }
              as: PeoAdmin
              captures: { plan_den: $.data.id }
            - call: "POST /clients/${client_s}/enrollment-windows"
              payload: { plan_year: 2026, open_date: "2026-05-15", close_date: "2026-06-30" }
              as: PeoAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PeoAdmin
            - call: "POST /worksite-employees/${emp1}/benefit-enrollments"
              payload: { benefit_plan_id: "${plan_den}", coverage_start_date: "2026-07-01" }
              as: ClientAdmin
              as_user_id: "${client_s}"
              captures: { enr1: $.data.id }
          trigger:
            - call: "POST /worksite-employees/${emp2}/benefit-enrollments"
              payload: { benefit_plan_id: "${plan_den}", coverage_start_date: "2026-07-01" }
              as: ClientAdmin
              as_user_id: "${client_s}"
              captures: { enr2: $.data.id }
            - call: "GET /benefit-plans/${plan_den}"
              payload: {}
              as: PeoAdmin
              captures: { count_full: $.data.enrolled_count }
            - call: "POST /benefit-enrollments/${enr2}/cancel"
              payload: {}
              as: ClientAdmin
              as_user_id: "${client_s}"
              captures: { enr2_status: $.data.status }
            - call: "GET /benefit-plans/${plan_den}"
              payload: {}
              as: PeoAdmin
              captures: { count_after: $.data.enrolled_count, pool_after: $.data.pool_status }
          assert:
            - "After the forward action: BenefitPlan.${plan_den}.enrolled_count == 2, pool_status == FULL, available seats == pool_capacity - enrolled_count == 0"
            - "After the compensating cancel: BenefitEnrollment.${enr2}.status == CANCELLED"
            - "After the compensating cancel: BenefitPlan.${plan_den}.enrolled_count == 1, pool_status == AT_RISK, available seats == 1 — exactly the pre-enrollment occupancy"
            - "Invariant holds at both points: enrolled_count == COUNT(BenefitEnrollment of ${plan_den} with status IN {PENDING, ACTIVE}) (2 == 2 before; 1 == 1 after)"
            - "BenefitEnrollment.${enr1}.status == PENDING — the cancel released only the cancelled seat"
