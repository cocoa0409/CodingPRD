  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: offer_accept_cascades_to_deal_rights_posture
        grounds:
          - state_machines.AcquisitionOffer.OPEN_to_ACCEPTED
          - state_machines.Film.acquisition_status_UNDER_NEGOTIATION_to_ACQUIRED
          - state_machines.Film.awards_posture_INELIGIBLE_to_ELIGIBLE
        distinguishing_aspect: |
          Depth-3 cascade triggered by offer accept: offer -> ACCEPTED causes
          AcquisitionDeal creation which causes RightsGrant creation which causes
          Film.awards_posture INELIGIBLE -> ELIGIBLE. The posture flip is caused
          by the RightsGrant, not directly by the offer accept.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Territories US (is_home_ent_eligible=true) and FR (is_home_ent_eligible=true)."
            - "Film F registered; one OPEN offer requesting THEATRICAL+HOME_ENT in US and THEATRICAL in FR."
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "US", name: "United States", is_home_ent_eligible: true }
              as: PlatformAdmin
            - call: "POST /territories"
              payload: { code: "FR", name: "France", is_home_ent_eligible: true }
              as: PlatformAdmin
            - call: "POST /films"
              payload: { title: "Meridian", director_name: "Ana Ruiz", principal_cast: ["Jae Park"], genre: "DRAMA", runtime_minutes: 102, production_budget_cents: 2000000 }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /films/${film_id}/offers"
              payload: { buyer_code: "A24", upfront_price_cents: 5000000, backend_participation_pct: 0.10, prints_advertising_commit_cents: 8000000, requested_territory_codes: ["US", "FR"], requested_windows: ["THEATRICAL", "HOME_ENT"], expiry_at: "2026-12-31T00:00:00Z" }
              as: AcquisitionExec
              captures: { offer_id: $.data.id }
            - call: "GET /films/${film_id}"
              payload: {}
              as: AcquisitionExec
              captures: { film_v2: $.data.version }
          trigger:
            - call: "POST /films/${film_id}/offers/${offer_id}/accept"
              payload: { expected_film_version: "${film_v2}" }
              as: AcquisitionExec
              captures: { deal_id: $.data.id }
          assert:
            - "Film.${film_id}.acquisition_status == ACQUIRED"
            - "Film.${film_id}.awards_posture == ELIGIBLE (cascade from THEATRICAL RightsGrant)"
            - "AcquisitionDeal.${deal_id}.status == EXECUTED"
            - "GET /deals/${deal_id}/rights-grants returns 4 rows: (US,THEATRICAL), (US,HOME_ENT), (FR,THEATRICAL), (FR,HOME_ENT), all status GRANTED"
            - "Offer.${offer_id}.status == ACCEPTED"

      - name: report_market_screening_cascades_to_plan_expansion_and_film_wide
        grounds:
          - state_machines.MarketScreening.SCHEDULED_to_REPORTED
          - state_machines.ReleasePlan.OPENED_to_EXPANDING
          - state_machines.ReleasePlan.EXPANDING_to_WIDE
          - state_machines.Film.release_posture_EXPANDING_to_WIDE
        distinguishing_aspect: |
          Depth-4 cascade triggered by reporting a market screening: report causes
          MarketScreening REPORTED -> EXPANSION_TRIGGERED which causes ReleasePlan
          OPENED -> EXPANDING; subsequent report pushes screen count over 600,
          causing ReleasePlan EXPANDING -> WIDE which causes Film.release_posture
          -> WIDE. Different originating trigger than instance 1 (POST .../report
          vs POST .../accept).
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Acquired film with premiere booked."
            - "ReleasePlan LIMITED_4 with expansion_threshold_psa_cents=10000 and target_market_codes=[NY]."
            - "Plan opened; initial MarketScreening (NY, weekend 1, SCHEDULED)."
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "US", name: "United States", is_home_ent_eligible: true }
              as: PlatformAdmin
            - call: "POST /films"
              payload: { title: "Meridian", director_name: "Ana Ruiz", principal_cast: ["Jae Park"], genre: "DRAMA", runtime_minutes: 102, production_budget_cents: 2000000 }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /films/${film_id}/offers"
              payload: { buyer_code: "A24", upfront_price_cents: 5000000, backend_participation_pct: 0.10, prints_advertising_commit_cents: 8000000, requested_territory_codes: ["US"], requested_windows: ["THEATRICAL"], expiry_at: "2026-12-31T00:00:00Z" }
              as: AcquisitionExec
              captures: { offer_id: $.data.id }
            - call: "GET /films/${film_id}"
              payload: {}
              as: AcquisitionExec
              captures: { film_v2: $.data.version }
            - call: "POST /films/${film_id}/offers/${offer_id}/accept"
              payload: { expected_film_version: "${film_v2}" }
              as: AcquisitionExec
              captures: { deal_id: $.data.id }
            - call: "POST /festivals"
              payload: { code: "SUNDANCE", name: "Sundance", start_date: "2027-01-21T00:00:00Z", end_date: "2027-01-31T00:00:00Z", prestige_tier: "A_LIST", default_review_embargo_hours: 24 }
              as: PlatformAdmin
              captures: { fest_id: $.data.id }
            - call: "POST /festivals/${fest_id}/premiere-slots"
              payload: { section: "COMPETITION", screening_starts_at: "2027-01-22T20:00:00Z", screening_ends_at: "2027-01-22T22:00:00Z", review_embargo_lifts_at: "2027-01-23T08:00:00Z" }
              as: FestivalProgrammer
              captures: { slot_id: $.data.id }
            - call: "POST /festivals/${fest_id}/premiere-slots/${slot_id}/hold"
              payload: { film_id: "${film_id}" }
              as: FestivalProgrammer
            - call: "GET /films/${film_id}"
              payload: {}
              as: FestivalProgrammer
              captures: { film_v3: $.data.version }
            - call: "POST /festivals/${fest_id}/premiere-slots/${slot_id}/book"
              payload: { expected_film_version: "${film_v3}" }
              as: FestivalProgrammer
            - call: "POST /films/${film_id}/release-plans"
              payload: { deal_id: "${deal_id}", platform_strategy: "LIMITED_4", opening_weekend_date: "2027-02-05T00:00:00Z", target_market_codes: ["NY"], expansion_threshold_psa_cents: 10000 }
              as: DistributionExec
              captures: { plan_id: $.data.id }
