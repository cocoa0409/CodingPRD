    instances:
      - name: warranty_claim_triage_fork_and_bounded_reopen_cycle
        grounds:
          - state_machines.WarrantyClaim.SUBMITTED_to_TRIAGED_ADMISSIBLE
          - state_machines.WarrantyClaim.SUBMITTED_to_DENIED
          - state_machines.WarrantyClaim.REMEDIATED_to_REOPENED
          - state_machines.WarrantyClaim.REOPENED_to_TRIAGED_ADMISSIBLE
          - state_machines.WarrantyClaim.REMEDIATION_SCHEDULED_to_REMEDIATED
          - calculations.warranty_charge_and_window
          - entities.WarrantyClaim.fields.reopen_count
          - entities.WarrantyClaim.fields.accrued_charge_cents
          - validations[priority=46]
        distinguishing_aspect: |
          WarrantyClaim is non-linear in two ways at once: SUBMITTED forks to TRIAGED_ADMISSIBLE or
          DENIED with disjoint side-effect sets (charge accrual onto
          ConversionProject.warranty_reserve_charge_cents versus a zeroed charge and no project
          mutation), and TRIAGED_ADMISSIBLE -> REMEDIATION_SCHEDULED -> REMEDIATED -> REOPENED ->
          TRIAGED_ADMISSIBLE is a true cycle bounded at MAX_CLAIM_REOPENS (2), so the third
          reopening is refused.
