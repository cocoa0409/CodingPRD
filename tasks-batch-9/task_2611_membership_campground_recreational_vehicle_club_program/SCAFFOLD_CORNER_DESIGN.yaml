      - name: the_user_that_proposes_can_never_be_the_user_that_decides
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=41]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - complexity_profile.role_model
          - endpoints["POST /capital-projects/{id}/decision"]
        distinguishing_aspect: "Segregation of duties is tested on both decision endpoints and across role boundaries: the same X-User-ID is refused whether it proposed as ClubAdmin, proposed as ParkManager and then reappears behind a ClubAdmin role header, or submitted a transfer as Member. Each refusal is immediately followed by the identical call from a different X-User-ID, and each refused attempt must leave both the version counter and the pending status untouched so the follow-up succeeds with the same expected_park_version."
        test_recipe:
