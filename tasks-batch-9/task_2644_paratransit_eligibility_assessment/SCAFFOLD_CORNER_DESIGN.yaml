            - "${enrolled_status} == \"ENROLLED\", then ${completed_status} == \"COMPLETED\" with ${completed_score} == 85"
            - "${rider_flag} == true and ${det_flag} == true (the same completion writes both mirrors)"
            - "the second check returns HTTP 200 with ${after_eligible} == false, ${after_applied} == [], ${after_count} == 1 and ${after_reason} == \"NO_CONDITION_MET\""

      - name: rescheduling_after_a_no_show_charges_the_gap_to_the_applicant
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/applications/{id}/assessments
          - state_machines.Application.ASSESSMENT_SCHEDULED_to_ASSESSMENT_REQUIRED
          - entities.Application.fields.applicant_delay_days
        distinguishing_aspect: "The optional rescheduled_from_assessment_id turns an ordinary booking into a delay-charging one: after a NO_SHOW returns the application to ASSESSMENT_REQUIRED, booking a slot exactly seven days later with the back-reference adds 7 to applicant_delay_days (floor whole days between the two slots' starts_at), while the original booking added nothing."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; two capacity-1 slots at 2026-08-05T09:00:00Z and 2026-08-12T09:00:00Z (different evaluators are unnecessary — the times do not overlap)"
