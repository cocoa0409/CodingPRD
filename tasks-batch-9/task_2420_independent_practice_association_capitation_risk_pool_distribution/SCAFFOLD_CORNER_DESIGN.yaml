            - call: "GET /ipa/enrollment-files/${file_c6}/rows"
              payload: { match_status: "UNMATCHED", limit: 10, offset: 0 }
              as: IpaAdmin
              captures: { reset_row_id: "$.data[0].id" }
            - call: "POST /ipa/enrollment-files/${file_c6}/state"
              payload: { to_state: "PARSED" }
              as: IpaAdmin
              captures: { file_c6_matched_again: "$.data.matched_row_count", file_c6_claimed_again: "$.data.claimed_capitation_cents" }
            - call: "POST /ipa/enrollment-files/${file_c6}/state"
              payload: { to_state: "RECONCILED" }
              as: IpaAdmin
            - call: "GET /ipa/enrollment-files/${file_c6}/remittances"
              payload: { status: "RECONCILED", limit: 10, offset: 0 }
              as: IpaAdmin
              captures: { rem_c6_second: "$.data[0].id", rem_c6_second_expected: "$.data[0].expected_capitation_cents" }
            - call: "GET /ipa/enrollment-files/${file_c6}/remittances"
              payload: { limit: 10, offset: 0 }
              as: IpaAdmin
            - call: "GET /ipa/delegation-agreements/${agr_c6}"
              as: IpaAdmin
              captures: { agr_c6_accrued: "$.data.accrued_capitation_cents", agr_c6_posture: "$.data.capitation_posture" }
          assert:
            - "${file_c6_matched_reset} == 0 and ${file_c6_claimed_reset} == 0 and ${file_c6_exceptions_reset} == 0 — the rewind zeroes the projection, it does not delete the rows"
            - "call 2 returns exactly 1 row with ${reset_row_id} == ${row_c6}, total_count == 1, and EnrollmentFile.${file_c6}.row_count == 1 throughout"
            - "${file_c6_matched_again} == 1 and ${file_c6_claimed_again} == 20000 — the re-parse re-projects the row to MATCHED from the rows themselves"
            - "${rem_c6_second} != ${rem_c6_first} — a new CapitationRemittance is minted; the DISPUTED one is never reopened"
            - "${rem_c6_second_expected} == 20000 == ${rem_c6_first_expected} and CapitationRemittance.${rem_c6_first}.status == \"DISPUTED\""
            - "call 6 returns total_count == 2 — one DISPUTED and one RECONCILED remittance for the same file"
            - "${agr_c6_accrued} == 20000 — reversed to 0 at DISPUTED, re-accrued once by the second reconcile, never double-counted"
            - "${agr_c6_posture} == \"WITHHELD\" (not \"CURRENT\") — the retained DISPUTED remittance still dominates the derivation"

      - name: quality_composite_weights_accumulate_without_rounding_drift
        claim_type: weighted_scoring
        grounds:
          - calculations.quality_composite_and_withhold_release
          - state_machines.QualityScorecard.DRAFT_to_FINAL
        distinguishing_aspect: |
          The three weighted terms must be accumulated unrounded and rounded
          exactly once. With hedis 8333 / access 6667 / experience 5555 the
          unrounded sum is 7166.4 bps and the composite must be 7166; rounding
          each term first gives 4167 + 1333 + 1667 = 7167, a one-bps drift that
          this instance detects. A second scorecard for a different measurement
          period with all three inputs at 8500 must land on exactly 8500,
          proving the weights sum to 10000 bps, and must release the FULL
          withhold because the 8500 band uses >=.
        test_recipe:
          setup:
            - "Agreement AGR_C7 ACTIVE with one ACTIVE physician and no scorecards yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Corner Weighted Scoring Health", payer_tax_id: "94-3000058", delegation_scope: "FULL_RISK", base_pmpm_cents: 20000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 10000, institutional_pool_share_bps: 0, quality_withhold_bps: 700, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 5 }
              as: IpaAdmin
              captures: { agr_c7: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_c7}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_c7}/physicians"
              payload: { npi: "4600000001", full_name: "Dr Weighted", specialty: "PEDIATRICS" }
              as: NetworkManager
              captures: { p_c7: "$.data.id", p_c7_v0: "$.data.version" }
            - call: "POST /ipa/physicians/${p_c7}/state"
              payload: { to_state: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /ipa/physicians/${p_c7}/state"
              payload: { to_state: "ACTIVE" }
              as: NetworkManager
            - call: "GET /ipa/physicians/${p_c7}"
              as: IpaAdmin
              captures: { p_c7_v1: "$.data.version" }
          trigger:
            - call: "POST /ipa/quality-scorecards"
              payload: { physician_id: "${p_c7}", measurement_period: "2026", hedis_composite_bps: 8333, access_score_bps: 6667, patient_experience_bps: 5555, attributed_member_months: 12, expected_physician_version: "${p_c7_v1}" }
              as: IpaAdmin
              captures: { sc_c7a: "$.data.id" }
            - call: "POST /ipa/quality-scorecards/${sc_c7a}/state"
              payload: { to_state: "FINAL" }
              as: IpaAdmin
              captures: { sc_c7a_composite: "$.data.composite_score_bps", sc_c7a_release: "$.data.withhold_release_bps" }
            - call: "GET /ipa/physicians/${p_c7}"
              as: IpaAdmin
              captures: { p_c7_composite: "$.data.quality_composite_bps", p_c7_v2: "$.data.version" }
            - call: "POST /ipa/quality-scorecards"
              payload: { physician_id: "${p_c7}", measurement_period: "2027", hedis_composite_bps: 8500, access_score_bps: 8500, patient_experience_bps: 8500, attributed_member_months: 12, expected_physician_version: "${p_c7_v2}" }
              as: IpaAdmin
              captures: { sc_c7b: "$.data.id" }
            - call: "POST /ipa/quality-scorecards/${sc_c7b}/state"
              payload: { to_state: "FINAL" }
              as: IpaAdmin
              captures: { sc_c7b_composite: "$.data.composite_score_bps", sc_c7b_release: "$.data.withhold_release_bps" }
            - call: "GET /ipa/physicians/${p_c7}/scorecards"
              payload: { status: "FINAL", limit: 10, offset: 0 }
              as: IpaAdmin
          assert:
            - "${sc_c7a_composite} == 7166 — round_half_up(4166.5 + 1333.4 + 1666.5) on the accumulated sum 7166.4, NOT 7167 from per-term rounding"
            - "${sc_c7a_release} == 7500 — 7166 clears the 7000 band but not the 8500 band"
            - "${p_c7_composite} == 7166 — the physician mirror takes the finalised composite"
            - "${sc_c7b_composite} == 8500 exactly — QUALITY_WEIGHTS_BPS 5000 + 2000 + 3000 sum to 10000, so equal inputs pass through unchanged"
            - "${sc_c7b_release} == 10000 — the 8500 threshold is inclusive (>=), releasing the full withhold"
            - "call 6 returns total_count == 2 — the 2027 scorecard does not supersede the 2026 one; supersession is scoped to the same measurement_period"
            - "QualityScorecard.${sc_c7a}.status == \"FINAL\" and QualityScorecard.${sc_c7b}.status == \"FINAL\""

      - name: distribution_leftover_cent_tie_broken_by_created_at_not_npi
