            - "DeliveryOrder.${o2}.late_credit_cents == 500 (1801s crosses into the 100% band)"

      - name: peak_window_half_open_boundary
        claim_type: Correct Result
        grounds:
          - calculations.delivery_fee
          - entities.PricingPolicy.fields.peak_windows
        distinguishing_aspect: "Peak windows are half-open in store-local time: pickup_ready_at 10:59:59 quotes off-peak (500) while 11:00:00 exactly quotes peak (500 + round_half_up(500*0.25) = 625); one second of pickup time changes the fee by 125."
        test_recipe:
          setup:
            - "Base chain through policy ACTIVE; surge 1.0. Two quotes differing only in pickup_ready_at."
          setup_api_calls:
            - *c_clock
            - *c_merchant
            - *c_activate
            - *c_store
            - *c_policy
            - *c_mgetv
            - *c_pact
          trigger:
            - call: "POST /delivery-quotes"
              payload: { store_id: "${s_id}", dropoff_lat: 0.02, dropoff_lng: 0.0, address_text: "10 Dest Rd", order_value_cents: 5000, pickup_ready_at: "2026-09-01T10:59:59Z" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { q_off: $.data.id }
            - call: "POST /delivery-quotes"
              payload: { store_id: "${s_id}", dropoff_lat: 0.02, dropoff_lng: 0.0, address_text: "10 Dest Rd", order_value_cents: 5000, pickup_ready_at: "2026-09-01T11:00:00Z" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { q_peak: $.data.id }
          assert:
            - "DeliveryQuote.${q_off}.peak_uplift_cents == 0 and quoted_fee_cents == 500"
            - "DeliveryQuote.${q_peak}.peak_uplift_cents == 125 and quoted_fee_cents == 625"

      - name: value_tier_highest_match_applies
        claim_type: Constants Applied
        grounds:
          - calculations.delivery_fee
          - entities.PricingPolicy.fields.value_tiers
        distinguishing_aspect: "order_value_cents 50000 matches both tiers; the HIGHEST matching tier wins — surcharge 500 not 200 — so the off-peak quote is 1000, not 700."
        test_recipe:
          setup:
            - "Base chain through policy ACTIVE; surge 1.0."
          setup_api_calls:
            - *c_clock
            - *c_merchant
            - *c_activate
            - *c_store
            - *c_policy
            - *c_mgetv
            - *c_pact
          trigger:
            - call: "POST /delivery-quotes"
              payload: { store_id: "${s_id}", dropoff_lat: 0.02, dropoff_lng: 0.0, address_text: "10 Dest Rd", order_value_cents: 50000, pickup_ready_at: "2026-09-01T09:00:00Z" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { q_id: $.data.id }
          assert:
            - "DeliveryQuote.${q_id}.value_surcharge_cents == 500 (highest matching tier, not the 200 tier it also satisfies)"
            - "DeliveryQuote.${q_id}.quoted_fee_cents == 1000"

      - name: invoice_floor_when_surge_drops_between_quote_and_dispatch
        claim_type: Reconciliation
        grounds:
          - calculations.delivery_fee
        distinguishing_aspect: "Variant reconciliation in the negative direction: quoted at surge 2.0 (quoted 1000 on base 500), dispatch at surge 1.0 makes the passthrough delta round_half_up(0.5 * (0 - 500)) = -250, but the invoice floor pins merchant_invoice at base_total 500 — the merchant never pays below base even though quoted was higher."
        test_recipe:
          setup:
            - "Base chain with surge 2.0 at quote time and 1.0 at dispatch time; order READY_FOR_PICKUP."
          setup_api_calls:
            - *c_clock
            - *c_merchant
            - *c_activate
            - *c_store
            - *c_policy
            - *c_mgetv
            - *c_pact
            - *c_courier
